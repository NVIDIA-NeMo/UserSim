# Permissive licenses that the Apache Software Foundation classifies as
# "Apache-like" (Category A). Values use SPDX identifiers after normalization.
# https://www.apache.org/legal/resolved.html#category-a
allowed_licenses = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Zlib",
]

# Anything outside the list above is reviewed per package, version, and exact
# reported license string, so a version bump or a metadata change has to be
# re-reviewed rather than inherited. Populated by running
# `make check-dependency-licenses` and justifying each report.


[exceptions.certifi]
reason = "Unmodified TLS certificate bundle installed as a separate transitive dependency. MPL-2.0 is ASF Category B, which permits redistribution of an unmodified dependency."
reports = [{ version = "2026.2.25", license = "Mozilla Public License 2.0 (MPL 2.0)" }]

[exceptions.chardet]
reason = "Unmodified character-detection library installed as a separate transitive dependency, imported rather than incorporated."
reports = [{ version = "5.2.0", license = "GNU Lesser General Public License v2 or later (LGPLv2+)" }]

[exceptions.email-validator]
reason = "Transitive dependency of pydantic. The Unlicense is a public-domain dedication and imposes no conditions."
reports = [{ version = "2.3.0", license = "The Unlicense (Unlicense)" }]

[exceptions.matplotlib]
reason = "Plot rendering for the reporting layer. PSF-2.0 is the Python Software Foundation licence, ASF Category A."
reports = [{ version = "3.10.8", license = "Python Software Foundation License" }]


[exceptions.numpy]
reason = "Core numerical dependency, BSD-3-Clause overall. The additional identifiers cover vendored components and are each permissive or public-domain-equivalent."
reports = [{ version = "2.4.3", license = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0" }]

[exceptions.pathspec]
reason = "Unmodified transitive dependency installed as a separate package. MPL-2.0 is ASF Category B."
reports = [{ version = "1.0.4", license = "Mozilla Public License 2.0 (MPL 2.0)" }]

[exceptions.pillow]
reason = "Image handling for the reporting layer, under the permissive MIT-CMU licence."
reports = [{ version = "12.2.0", license = "MIT-CMU" }]

[exceptions.regex]
reason = "Transitive dependency of the tokenizer, dual-licensed. CNRI-Python is part of the Python licence family; both identifiers are ASF Category A."
reports = [{ version = "2026.2.28", license = "Apache-2.0 AND CNRI-Python" }]

[exceptions.tqdm]
reason = "Unmodified progress-bar library installed as a separate dependency, dual-licensed MPL-2.0 and MIT."
reports = [{ version = "4.67.3", license = "MPL-2.0 AND MIT" }]

[exceptions.typing_extensions]
reason = "Backport of stdlib typing, under the same PSF-2.0 licence as CPython. ASF Category A."
reports = [{ version = "4.15.0", license = "PSF-2.0" }]
