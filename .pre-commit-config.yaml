# Local mirror of the CI lint and format gate, so failures surface before push
# rather than in the pipeline. Install with `make install-dev`.
#
# Top-level underscore directories contain private, non-distribution material.
# uv owns lock formatting; notebooks skip rewriting text hooks individually.
exclude: '^_[^/]+/|^uv\.lock$'

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.ipynb$'
      - id: end-of-file-fixer
        exclude: '\.ipynb$'
      - id: mixed-line-ending
        exclude: '\.ipynb$'
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: check-added-large-files
        # Notebooks stay in scope, so one committed with its outputs fails
        # here. uv.lock is exempt via the global exclude: it is a committed
        # resolved graph that grows with the dependency set.
        args: ["--maxkb=600", "--enforce-all"]
        # Existing shipped corpora exceed the budget; only these two files
        # are exempt. They still receive syntax and conflict checks.
        exclude: '^src/usersim/engine/assets/(safety_chat_pressure|safety_agentic)/sample\.yaml$'

  # Ruff runs through `uv run` rather than pre-commit's own mirror so the
  # version always matches the pin in pyproject.toml. A mirrored rev drifts
  # from the project pin and then pre-commit and CI disagree about what
  # "clean" means. `types: [python]` means notebooks are not passed here --
  # identify tags .ipynb as `jupyter`, not `python`.
  - repo: local
    hooks:
      - id: check-lock
        name: dependency lock consistency
        entry: make check-lock
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: type checking (Python 3.11)
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: spdx-headers
        name: SPDX headers (staged files)
        entry: uv run python scripts/update_license_headers.py
        language: system
        files: '^(src/|tests/|tests_e2e/|scripts/|templates/|Makefile$|conftest\.py$)'
      - id: dco-trailers
        name: DCO author and co-author sign-offs
        entry: python3 scripts/check_commit_signoffs.py --commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

  # Notebooks are committed as source only: outputs carry run data and local
  # paths from whoever executed them.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
