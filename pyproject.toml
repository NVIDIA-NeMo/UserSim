[project]
name = "nemo-usersim"
version = "0.1.0"
description = "Population-grounded user simulation for evaluating conversational LLMs"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "llm", "evaluation", "synthetic-data", "simulation", "personas", "nemotron",
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # The simulator runs on the async engine, which 0.9 provides. It also
    # needs ``RunConfig.jinja_rendering_engine`` and ko_KR
    # Nemotron-Personas locale support: the ``NATIVE`` mode is what lets
    # expression columns use the standard Jinja ``select`` / ``join``
    # filters (the older ``SECURE`` mode ships a narrow filter allowlist
    # that excludes both). See ``cli/_pipeline.py`` for the opt-in. 0.9.4 is
    # the first release that supports pandas 3 and allows cryptography 50.
    "data-designer>=0.9.4,<0.10",
    # Language detection for the language_compliance scorer. Pure Python,
    # MIT, accurate on short conversational text. Pinned to a major version
    # to keep CI deterministic -- bump deliberately.
    "lingua-language-detector>=2.0,<3.0",
    # YAML-backed prompt and bank assets are loaded at runtime.
    "PyYAML>=6.0",
    # The engine's config models are Pydantic; core/preview.py renders with
    # Rich. Every third-party import must be declared here so the package
    # installs standalone; tests/test_packaging_contract.py enforces it.
    "pydantic>=2.0",
    "rich",
    "pandas",
    "pyarrow",
    "seaborn",
    "matplotlib",
    "langdetect",
    # NOTE: ipykernel is deliberately NOT a runtime dependency. The only
    # IPython use in shipped code is a guarded `from IPython import
    # get_ipython` probe in core/manifest.py, so requiring a Jupyter kernel
    # of every install would pull in 23 packages to satisfy an optional
    # branch. The `dev` extra's `jupyter` covers notebook execution.
    # tiktoken powers the post-hoc reasoning-token estimator
    # (``reporting/_reasoning.py``). Currently transitive via ``data-designer``;
    # pinned explicitly so the report-build path stays decoupled from
    # data-designer dep churn. ``cl100k_base`` encoding ships with all 0.7+.
    "tiktoken>=0.7,<1.0",
    # Reached directly rather than through another package's public API, so
    # declared even though each also arrives transitively today: a transitive
    # pin can be dropped by its parent without warning.
    #   httpx           -- cli/_models.py probes model endpoints
    #   huggingface_hub -- selection/io.py publishes dataset cards
    #   numpy           -- asset_gen near-duplicate detection
    "httpx",
    "huggingface-hub",
    "numpy",
    # Reads credentials from a .env file so a run does not depend on what is
    # exported in the calling shell. No required dependencies of its own.
    "python-dotenv>=1.0,<2",
    # Parses the models TOML on Python 3.10, which has no tomllib.
    "tomli>=1.1.0; python_version < '3.11'",
]
[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/UserSim"
Repository = "https://github.com/NVIDIA-NeMo/UserSim"
Issues = "https://github.com/NVIDIA-NeMo/UserSim/issues"

[dependency-groups]
# A dependency group rather than an optional-dependency extra, so `uv sync`
# installs it by default and `pip install nemo-usersim[dev]` cannot pull test
# and lint tooling into a user's environment. `make test` and the hermeticity
# guard in conftest.py both depend on this group being present.
dev = [
    "jupyter",
    "pytest>=8.0",
    # Lint + format. Pinned to a minor range because ruff's default rule
    # behaviour shifts between minors and CI must agree with pre-commit.
    "ruff>=0.14,<0.15",
    "pytest-cov>=7.0,<8",
    "pre-commit>=4.0,<5",
    # Distributes the test suite across cores. It is CPU-bound with every LLM
    # call mocked, so it parallelises well. `make test` passes -n and fails
    # without this.
    "pytest-xdist>=3.6,<4",
    # Applies the [tool.pytest.ini_options] env block below, which sets
    # USERSIM_DISABLE_EXTENSIONS before any conftest loads. A root conftest.py
    # would run after one that imports a registry, which is too late to keep
    # discovery out of the suite. conftest.py fails the run if this is absent.
    "pytest-env>=1.1,<2",
    # Collects `async def` tests. `asyncio_mode = "auto"` below means they need
    # no decorator, so a contributor writing one does not have to know this is
    # here. conftest.py fails the run if it is absent, because without it every
    # async test is skipped with a warning rather than failing.
    "pytest-asyncio>=1.0,<2",
    # tests/test_network_guard.py unwraps exception groups, which Python 3.10
    # has only through this backport.
    "exceptiongroup>=1.0; python_version < '3.11'",
]
# Empty on purpose: the gate runs a pinned pip-licenses through `uv tool run`,
# so this group exists only to scope an isolated environment holding the
# locked runtime set and no dev tooling.
license-check = []

[project.scripts]
usersim = "usersim.cli:main"

[project.entry-points."data_designer.plugins"]
conversation-simulator = "usersim.engine.plugin:conversation_simulator"
trajectory-evaluator = "usersim.engine.plugin:trajectory_evaluator"

[tool.uv]
override-dependencies = [
    # Keep in sync with the ``dependencies`` pin above.
    "data-designer>=0.9.4,<0.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["usersim*"]

[tool.setuptools.package-data]
# PEP 561. Without this marker every annotation in the package is invisible to
# a type checker running against an installed copy, so callers get `Any` back
# from functions we annotated carefully.
"usersim" = ["py.typed"]
"usersim.cli" = [
    # Every shipped models TOML, not just the default: smoke validates all of
    # them against the catalog, and an unshipped one silently reduces what an
    # installed package can resolve.
    "models_*.toml",
]
"usersim.engine" = [
    # The asset banks. Hatchling shipped the whole package tree implicitly;
    # setuptools needs them named, and a wheel without them fails every
    # probe at asset resolution. `make check-wheel` counts these.
    "assets/**/*.yaml",
    "assets/**/*.yml",
    "assets/**/*.json",
    "assets/**/*.parquet",
    "assets/**/*.md",
    "**/*.yaml",
]

[tool.setuptools.exclude-package-data]
# Retrieval embeds each query with the model that produced the corpus vectors,
# so shipped vectors would tie every install to one embedding model. The
# vectors `gen-assets` writes beside a bank stay local.
"usersim.engine" = ["assets/financial_services/**/embeddings.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An extension installed in a developer's virtualenv would otherwise register
# itself into the probe, scorer, and domain registries and change what the
# suite sees, making results depend on the machine. Tests that exercise
# discovery clear this deliberately.
#
# Deliberately NOT setting DISABLE_DATA_DESIGNER_PLUGINS: that would hide our
# own two DataDesigner plugins and make the entry-point resolution test vacuous.
env = [
    "USERSIM_DISABLE_EXTENSIONS=1",
    # Data Designer's usage telemetry stays off under test, so a test run never
    # sends usage events.
    "NEMO_TELEMETRY_ENABLED=false",
]
# Every `async def` test is collected and run without a per-test marker. The
# alternative, strict mode, silently skips any test whose decorator was
# forgotten, which reads as a passing suite.
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
# Ruff lints .ipynb by default. The notebooks are user-facing walkthroughs with
# committed outputs, so linting them means noise and rewritten cells. Excluding
# them keeps a bare `ruff check` equivalent to `make lint`.
extend-exclude = ["notebooks", "output", "artifacts"]

# Deliberately absent, so the omissions read as choices rather than gaps:
# `E`, because the formatter owns line length and enabling both means they
# argue; `ERA001` (commented-out code), which misfires on pseudo-code inside
# docstrings; and `RUF100` (unused noqa), which is worth a periodic sweep but
# not a build failure.
[tool.ruff.lint]
select = [
    "W",     # pycodestyle warnings
    "F",     # pyflakes: real bugs (undefined names, unused imports)
    "I",     # isort (import sorting)
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie: misc correctness lints
    "TID",   # flake8-tidy-imports (ban relative imports)
    "UP006", # List[A] -> list[A]
    "UP007", # Union[A, B] -> A | B
    "UP045", # Optional[A] -> A | None
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any)
]

[tool.ruff.lint.isort]
known-first-party = ["usersim"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
