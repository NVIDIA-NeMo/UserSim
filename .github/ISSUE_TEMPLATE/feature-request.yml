name: ✨ Feature Request
description: Suggest a capability, probe or scorer
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        A maintainer reviews each issue and adds the `triaged` label when a
        change is wanted. If you plan to build this yourself, open the pull
        request once the issue has that label; see
        [Issues before pull requests](https://github.com/NVIDIA-NeMo/UserSim/blob/main/CONTRIBUTING.md#issues-before-pull-requests).
        To propose a probe you plan to build, use the New probe form instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >-
        Describe the situation rather than the fix you have in mind. Knowing
        what you are trying to measure usually suggests a better answer than
        the one either of us started with.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project?
      options:
        - A new probe or capability to measure
        - A scorer or how results are graded
        - Reporting and dashboards
        - Personas and locales
        - Models, providers and configuration
        - Training-data export
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including anything you tried that did not work.

  - type: textarea
    id: investigation
    attributes:
      label: Prior investigation
      description: >-
        What you or your coding agent found in the code, documentation and
        existing issues, such as whether a probe, scorer or extension already
        covers part of this. If an agent investigated, paste its findings.
      placeholder: Paste the agent's findings, or describe what you checked.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation, or had my agent do so
          required: true
        - label: If an agent helped, its findings are under Prior investigation
          required: false
