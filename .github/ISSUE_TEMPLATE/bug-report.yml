name: 🐛 Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        A maintainer reviews each issue and adds the `triaged` label when a
        change is wanted. If you plan to fix this yourself, open the pull
        request once the issue has that label; see
        [Issues before pull requests](https://github.com/NVIDIA-NeMo/UserSim/blob/main/CONTRIBUTING.md#issues-before-pull-requests).

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps or code to reproduce
      description: |
        The smallest thing that shows the problem. If it involves a run,
        the command line is usually enough.
      placeholder: |
        Please include:
          - The exact command or code
          - Any probe, locale or models file involved
          - The full error traceback
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you using?
      description: >-
        Model behaviour differs a lot between providers, so knowing this
        usually narrows the cause immediately. Pick "not applicable" if the
        problem happens before any model is called.
      options:
        - build.nvidia.com (models_default.toml)
        - OpenAI (models_openai.toml)
        - OpenRouter (models_openrouter.toml)
        - A custom models file
        - Not applicable / no model call involved
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Paste the output of `usersim --version` and `uv run python -VV`. If
        the issue involves model resolution, `usersim smoke` output helps too.
      render: shell
    validations:
      required: true

  - type: textarea
    id: investigation
    attributes:
      label: Prior investigation
      description: >-
        What you or your coding agent already checked: documentation and
        issues searched, commands run, and what they showed. If an agent
        investigated, paste its findings.
      placeholder: Paste the agent's findings, or describe what you tried.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation, or had my agent do so
          required: true
        - label: The steps above reproduce the problem
          required: true
        - label: If an agent helped, its findings are under Prior investigation
          required: false
