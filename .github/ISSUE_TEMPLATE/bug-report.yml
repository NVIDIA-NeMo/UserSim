name: 🐛 Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps or code to reproduce
      description: |
        The smallest thing that shows the problem. If it involves a run,
        the command line is usually enough.
      placeholder: |
        Please include:
          - The exact command or code
          - Any probe, locale or models file involved
          - The full error traceback
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you using?
      description: >-
        Model behaviour differs a lot between providers, so knowing this
        usually narrows the cause immediately. Pick "not applicable" if the
        problem happens before any model is called.
      options:
        - build.nvidia.com (models_default.toml)
        - OpenAI (models_openai.toml)
        - OpenRouter (models_openrouter.toml)
        - A custom models file
        - Not applicable / no model call involved
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Paste the output of `usersim --version` and `uv run python -VV`. If
        the issue involves model resolution, `usersim smoke` output helps too.
      render: shell
    validations:
      required: true
