# Turns a version tag into a GitHub release carrying the sdist and wheel. The
# files attached to that release are the ones published to PyPI, so this is
# the only place they are built.
#
# The build job runs the same make targets as CI and can only read. The
# release job can write, so it waits for a maintainer to approve the
# `release` environment, and it publishes only the archives the build job
# checked.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    # The digest step pipes into tee; without pipefail a failure before the
    # pipe would not fail the job.
    shell: bash -euo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag check needs main's history to tell whether the tagged
          # commit is on it. Nothing after checkout needs the token.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "pyproject.toml"
          python-version: "3.12"
          # A cache written by another run could otherwise reach the
          # published files.
          enable-cache: false

      - run: make install-ci

      - name: Native checks, coverage, smoke, and extension contracts
        # Re-run the shared gates on the tagged commit, even if PR CI passed.
        run: make validate-native

      - name: Build and check the sdist and wheel, install the wheel clean, run it from an empty directory
        run: make check-dist

      - name: The tag names the built release version and a commit on main
        id: tag
        env:
          # In the environment, not on make's command line: make would expand
          # a `$(shell ...)` in the tag name there.
          TAG: ${{ github.ref_name }}
        run: make check-release-tag

      - name: Installed CLI e2e against the original release wheel
        # check-dist produced and validated this single wheel. Do not rebuild.
        run: make test-e2e WHEEL_DIR=dist

      - name: SHA-256 digests for publication approval
        # Available from the read-only build before the release environment gate.
        run: make release-digests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # creates the release and attaches its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: SHA-256 digests
        # PyPI reports the same digests for the files it serves, so anyone
        # can check that what was published is what this run built.
        run: |
          {
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the release as a draft with both archives, then publish it
        # Both files are attached while the release is still a draft, so it
        # is never published incomplete; once published, an immutable
        # release keeps them unchanged. --verify-tag stops gh from creating
        # a missing tag itself.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
          gh release edit "$TAG" --draft=false
