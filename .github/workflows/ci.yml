# Every job here calls a shared Mise task rather than restating the command, so
# what CI enforces and what you can run locally cannot drift apart. If a job
# fails, the same target reproduces it on your machine.
#
# No job in this file touches a secret. Anything needing a credential lives in
# health-checks.yml, which never runs on pull_request, so a PR from a fork can
# run the full suite without exposing anything.
name: CI

on:
  push:
    branches: [main]
  # Child PRs target another stack branch and need the same checks.
  pull_request:
  workflow_dispatch:

# Least privilege: enough to clone, nothing else. Checking out a private
# repository needs `contents: read`, so an empty block would fail here even
# though it works for a public one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"
  PYTEST_WORKERS: "2"
  NEMO_TELEMETRY_ENABLED: "false"

jobs:
  static:
    name: Lint, format, docs and licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh
      - name: Cache locked Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_PYTHON }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Locked registry tools
        run: scripts/mise run setup:tools

      - run: scripts/mise run setup:ci

      - name: Static checks and all tracked-file hooks
        run: scripts/mise run check

      - name: Dependency licences
        run: scripts/mise run check:license:dependencies


  typecheck:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh
      - name: Cache locked Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_PYTHON }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Locked registry tools
        run: scripts/mise run setup:tools
      - run: scripts/mise run setup:ci
      - run: scripts/mise run check:type

  test:
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh
      - name: Cache locked Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_PYTHON }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Locked registry tools
        run: scripts/mise run setup:tools

      - run: scripts/mise run setup:ci

      - name: Test suite
        if: matrix.python-version != '3.12'
        # Durations are reported because a slow test is invisible until
        # someone profiles the suite, and the runner is the only place that
        # measures the hardware CI actually runs on.
        env:
          PYTEST_ARGS: "--durations=25 --junitxml=junit.xml"
        run: scripts/mise run test

      - name: Test suite with coverage
        if: matrix.python-version == '3.12'
        env:
          PYTEST_ARGS: "--durations=25 --junitxml=junit.xml"
        run: scripts/mise run test:ci

      - name: Coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-python-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Offline self-check
        run: scripts/mise run test:smoke

      - name: Dependency licences
        # Each Python resolves its own releases of some dependencies, and the
        # policy approves exceptions per release and reported licence.
        run: scripts/mise run check:license:dependencies

  packaging:
    name: Wheel and extension seams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh
      - name: Cache locked Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_PYTHON }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Locked registry tools
        run: scripts/mise run setup:tools

      - run: scripts/mise run setup:ci

      - name: Build and check the sdist and wheel, install the wheel clean, run it from an empty directory
        run: scripts/mise run check:dist

      - name: An out-of-tree package reaches every extension seam
        run: scripts/mise run check:extensions

  e2e:
    name: Installed CLI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh
      - name: Cache locked Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_PYTHON }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Locked registry tools
        run: scripts/mise run setup:tools
      - run: scripts/mise run setup:ci
      - env:
          E2E_ARGS: "--artifacts test-results/e2e"
        run: scripts/mise run test:e2e
      - name: E2e diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: test-results/e2e/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: CPU container tests
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verified Mise bootstrap
        run: bash scripts/install_mise.sh

      - name: Build and run isolated CPU validation
        run: scripts/mise run test:ci-container

      - name: Container test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-test-results
          path: test-results/container/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  status:
    name: CI Status
    if: always()
    needs: [static, typecheck, test, packaging, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_ci_results.py
