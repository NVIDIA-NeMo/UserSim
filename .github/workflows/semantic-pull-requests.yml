# The PR title becomes the squashed commit subject, so this is what keeps the
# history on main parseable and the changelog derivable.
name: Validate PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_semantic_pull_request.yml@d0a139c4943a203afaadb6af7373b9055e653cd1 # v1.15.0
