# The PR title becomes the squashed commit subject, so this is what keeps the
# history on main parseable and the changelog derivable.
name: Validate PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_semantic_pull_request.yml@7dd05d1e00c28bde40d5f90cd0b494e57bf52ce0 # v1.15.1
