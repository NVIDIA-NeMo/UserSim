# The PR title becomes the squashed commit subject, so this is what keeps the
# history on main parseable and the changelog derivable.
name: Validate PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_semantic_pull_request.yml@5d472fb485ffe334332f0e95f6f69bed650f70a0 # v1.16.1
