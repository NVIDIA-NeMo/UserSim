# Default model configuration for `usersim`. Runs on build.nvidia.com through
# the built-in `nvidia` provider, so `NVIDIA_API_KEY` is the only credential
# needed.
#
# `openai` and `openrouter` are also built in; see models_openai.toml and
# models_openrouter.toml. For any other OpenAI-compatible endpoint, declare a
# provider in your own file and pass `--models`. See CONTRIBUTING.md.
#
# Per-model sampling parameters live in cli/model_catalog.py. Per-alias knobs
# (max_parallel_requests, timeout, max_tokens) go here and win over the catalog.
#
# Judges are a different model from `assistant_model` on purpose, so the model
# under test is not scoring its own output.

models = [
  { alias = "user_model",         model = "openai/gpt-oss-20b",                    provider = "nvidia", max_parallel_requests = 4 },                 # simulated user
  { alias = "assistant_model",    model = "google/gemma-4-31b-it",                 provider = "nvidia", max_parallel_requests = 4, timeout = 300 },  # model under test
  { alias = "api_response_model", model = "openai/gpt-oss-20b",                    provider = "nvidia", max_parallel_requests = 4 },                 # tool-call responses
  { alias = "judge_model",        model = "nvidia/nemotron-3.5-lightning-30b-a3b", provider = "nvidia", max_parallel_requests = 4 },                 # in-sim gates
  { alias = "summary_model",      model = "openai/gpt-oss-20b",                    provider = "nvidia", max_parallel_requests = 4 },                 # context compression
  { alias = "evaluator_model",    model = "nvidia/nemotron-3.5-lightning-30b-a3b", provider = "nvidia", max_parallel_requests = 4 },                 # trajectory rubric

  # Used only by `usersim gen-assets`, which is a live, billable step. See
  # probes/financial_services/README.md for the pipeline and its tuning knobs.
  #
  # `doc_gen_model` emits a whole document cluster per call, hence max_tokens.
  # `asset_judge_model` grades that output, so it is a different family and
  # runs at temperature 0 to keep scores stable between runs.
  { alias = "doc_gen_model",      model = "google/gemma-4-31b-it",                 provider = "nvidia", max_parallel_requests = 8, timeout = 600, max_tokens = 16384 },
  { alias = "asset_judge_model",  model = "nvidia/nemotron-3.5-lightning-30b-a3b", provider = "nvidia", max_parallel_requests = 8, temperature = 0.0 },

  # Query side of the financial_services probe's dense and hybrid retrieval.
  # Must be the same model that produced the corpus vectors: vectors only
  # compare within one embedding space, and a mismatch fails silently. Without
  # it the probe retrieves lexically. See the probe README.
  { alias = "embedding_model",    model = "nvidia/nemotron-3-embed-1b",            provider = "nvidia", max_parallel_requests = 8 },
]
