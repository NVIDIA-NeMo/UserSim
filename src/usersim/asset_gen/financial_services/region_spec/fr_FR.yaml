  - id: assurance_auto
    display_name: Assurance auto Égide
    domain: insurance
    variables:
      car_annual_premium_example: {type: money, value: 640}
      comprehensive_deductible: {type: money, value: 300}
      maximum_bonus: {type: percent, value: 50}
      claim_reporting_days: {type: int, value: 5}
  - id: complementaire_sante
    display_name: Complémentaire santé Égide
    domain: insurance
    variables:
      health_monthly_premium_example: {type: money, value: 58}
      optical_allowance_2_years: {type: money, value: 200}
      hospital_daily_fee: {type: money, value: 23}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: make_additional_payment
    discoverable: true
    side_effect_class: state_changing
    description: Effectuer un versement libre ou mettre en place des versements programmés sur un contrat d'assurance-vie ou un PER.
  - name: request_partial_surrender
    discoverable: true
    side_effect_class: irreversible
    description: Demander un rachat partiel sur un contrat d'assurance-vie ; l'assureur verse les sommes dans un délai maximal de deux mois.
  - name: switch_funds
    discoverable: true
    side_effect_class: state_changing
    description: Réaliser un arbitrage entre le fonds en euros et les unités de compte d'un contrat d'assurance-vie ou d'un PER.
  - name: initiate_plan_transfer
    discoverable: true
    side_effect_class: state_changing
    description: Lancer le transfert vers le PER individuel Égide d'un PER, d'un ancien PERP ou d'un contrat Madelin détenu dans un autre établissement.
  - name: request_early_release
    discoverable: true
    side_effect_class: irreversible
    description: Demander le déblocage anticipé d'un PER dans un cas prévu par la loi, comme l'achat de la résidence principale ou un accident de la vie.
  - name: request_retirement_payout
    discoverable: true
    side_effect_class: irreversible
    description: Demander la liquidation d'un PER à partir du départ à la retraite, en capital versé en une ou plusieurs fois, ou en rente viagère.
  - name: send_insurance_certificate
    discoverable: true
    side_effect_class: read_only
    description: Envoyer au client une attestation d'assurance habitation ou auto, par exemple pour un bailleur.
  - name: request_health_reimbursement
    discoverable: true
    side_effect_class: state_changing
    description: Transmettre une demande de remboursement de frais de santé (facture d'opticien, de dentiste ou d'audioprothésiste) lorsque le tiers payant n'a pas été appliqué.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: Souscrire un nouveau contrat (assurance-vie, PER, habitation, auto ou complémentaire santé).
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: Modifier la clause bénéficiaire d'un contrat d'assurance-vie ou d'un PER.
  - name: file_claim
    discoverable: true
    side_effect_class: state_changing
    description: Déclarer un sinistre (dégât des eaux, vol, bris de glace, accident de la circulation) sur un contrat habitation ou auto.
  - name: update_policy
    discoverable: true
    side_effect_class: state_changing
    description: Modifier un contrat par avenant, par exemple après un déménagement, un changement de véhicule, l'ajout d'un conducteur ou un changement de formule de complémentaire santé.
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: Résilier un contrat d'assurance habitation, auto ou de complémentaire santé, ou demander le rachat total d'un contrat d'assurance-vie.
  task_templates:
  - {id: TPL-EG-CLAIM-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [file_claim]}
  - {id: TPL-EG-AV-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

