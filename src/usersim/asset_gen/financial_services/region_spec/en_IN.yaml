  - {id: TPL-KF-TOPUP-001, tier: verifiable, task_type: transactional, persona_tags: [region:any], gold_tool_sequence: [request_gold_loan_topup]}
  - {id: TPL-KF-COST-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any, financial-literacy:low]}
