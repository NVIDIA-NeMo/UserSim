    variables:
      domestic_trade_fee_rate: {type: percent, value: 0.015}
      securities_tax_kospi: {type: percent, value: 0.2}
      securities_tax_kosdaq: {type: percent, value: 0.2}
  - id: garam_us_stock
    display_name: US Stock Trading
    display_name_local: 미국주식 거래
    domain: brokerage_investing
    variables:
      us_trade_fee_rate: {type: percent, value: 0.25}
      fx_spread_discount: {type: percent, value: 95}
      overseas_capital_gains_tax_rate: {type: percent, value: 22}
      overseas_basic_deduction: {type: money, value: 2500000}
  - id: garam_jeokrip
    display_name: Recurring Investment
    display_name_local: 적립식 투자
    domain: brokerage_investing
    variables:
      minimum_contribution: {type: money, value: 1000}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - {name: get_positions, discoverable: true, side_effect_class: read_only}
  - {name: place_trade, discoverable: true, side_effect_class: state_changing}
  - name: open_isa_account
    discoverable: true
    side_effect_class: state_changing
    description: 중개형 ISA 개설을 신청한다. ISA는 모든 금융회사를 합해 1인 1계좌이고, 직전 3년 중 한 번이라도 금융소득종합과세 대상이었으면 개설할 수 없다.
  - name: transfer_isa_provider
    discoverable: true
    side_effect_class: state_changing
    description: 다른 금융회사의 ISA를 가람증권으로 옮기는 계좌 이전을 신청한다. 가입 기간과 납입 한도는 그대로 이어진다.
  - name: open_pension_account
    discoverable: true
    side_effect_class: state_changing
    description: 연금저축계좌 개설을 신청하고, 납입 방식(자유 납입 또는 정기 자동이체)을 정한다.
  - name: apply_irp
    discoverable: true
    side_effect_class: state_changing
    description: 개인형 퇴직연금(IRP) 개설을 신청한다. 퇴직금을 받을 계좌로 쓰거나 개인 부담금을 납입할 수 있다.
  - name: set_up_investment_plan
    discoverable: true
    side_effect_class: state_changing
    description: 국내외 주식이나 펀드의 적립식 투자(금액, 주기, 종목)를 설정하거나 바꾼다.
  - name: initiate_securities_transfer
    discoverable: true
    side_effect_class: state_changing
    description: 다른 증권회사 계좌의 주식이나 펀드를 가람증권으로 옮기는 대체입고를 신청한다.
  # Common operations whose meaning differs in Korea, declared with the Korean
  # procedure they carry here.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: 국내외 주식을 거래하는 종합매매계좌의 비대면 개설을 신청한다. 신분증 확인 등 실명확인이 필요하다.
  - name: deposit_funds
    discoverable: true
    side_effect_class: state_changing
    description: 연결한 은행 계좌에서 종합매매계좌로 예탁금을 입금한다.
  - name: withdraw_funds
    discoverable: true
    side_effect_class: irreversible
    description: 종합매매계좌의 예탁금을 등록한 은행 계좌로 출금한다.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 출금 계좌로 등록한 은행 계좌를 바꾼다.
  - name: manage_authorized_users
    discoverable: true
    side_effect_class: state_changing
    description: 미성년 자녀 계좌의 법정대리인(부모)을 등록하거나 바꾼다.
  task_templates:
  - {id: TPL-GR-ISA-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [open_isa_account]}
  - {id: TPL-GR-YEONGEUM-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

