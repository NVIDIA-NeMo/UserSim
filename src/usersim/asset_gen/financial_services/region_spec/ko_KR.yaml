      annuity_premium_example: {type: money, value: 300000}
      tax_free_monthly_cap: {type: money, value: 1500000}
      tax_free_min_holding_years: {type: int, value: 10}
      tax_free_min_payment_years: {type: int, value: 5}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: request_policy_loan
    discoverable: true
    side_effect_class: state_changing
    description: 해약환급금의 일정 범위 안에서 보험계약대출을 신청한다.
  - name: reinstate_policy
    discoverable: true
    side_effect_class: state_changing
    description: 보험료를 내지 않아 효력을 잃은 계약의 부활을 신청한다. 부활하려면 계약 전 알릴 의무를 다시 이행해야 하고, 정해진 기간 안에만 할 수 있다.
  - name: send_deduction_certificate
    discoverable: true
    side_effect_class: read_only
    description: 연말정산용 보험료 납입증명서를 발급해 보낸다.
  - name: change_payment_method
    discoverable: true
    side_effect_class: state_changing
    description: 보험료 납입 방법(자동이체 또는 신용카드)이나 출금 계좌를 바꾼다.
  - name: withdraw_application
    discoverable: true
    side_effect_class: irreversible
    description: 청약철회를 접수한다.
  # Common operations whose meaning differs in Korea, declared with the Korean
  # procedure they carry here.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: 새 보험계약의 청약을 접수한다. 청약할 때 계약 전 알릴 의무를 이행해야 한다.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 사망보험금 수익자나 지정대리청구인을 바꾼다.
  - name: file_claim
    discoverable: true
    side_effect_class: state_changing
    description: 입원, 수술, 암 진단의 보험금이나 사망보험금 청구를 접수하고 필요 서류를 안내한다.
  - name: get_claim_status
    discoverable: true
    side_effect_class: read_only
    description: 보험금 청구의 처리 상황(서류 접수, 심사, 지급)을 확인한다.
  - name: update_policy
    discoverable: true
    side_effect_class: state_changing
    description: 보험가입금액 감액, 특약 추가와 해지 같은 계약 내용 변경을 접수한다.
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: 보험계약을 해지한다. 해약환급금이 있으면 지정한 계좌로 지급한다.
  task_templates:
  - {id: TPL-DD-CLAIM-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [file_claim]}
  - {id: TPL-DD-BOJANG-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

# ── 5. Credit card company ────────────────────────────────────────────
- id: yeoul_card
  display_name: Yeoul Card
  display_name_local: 여울카드
  type: nbfc
  brand_voice: traditional
  domains: [payments, lending_mortgage]
  products:
  - id: yeoul_credit
    display_name: Yeoul Credit Card
    display_name_local: 여울 신용카드
    domain: payments
    variables:
      annual_fee: {type: money, value: 15000}
      reward_rate: {type: percent, value: 0.7}
      credit_limit_max: {type: money, value: 20000000}
  - id: yeoul_revolving
    display_name: Revolving Payment
    display_name_local: 리볼빙(일부결제금액이월약정)
    domain: payments
    variables:
      revolving_apr: {type: percent, value: 16.5}
      minimum_payment_ratio: {type: percent, value: 10}
  - id: yeoul_halbu
    display_name: Installment Payment
    display_name_local: 할부
    domain: payments
    variables:
      installment_apr_min: {type: percent, value: 9.9}
      installment_apr_max: {type: percent, value: 19.9}
      max_installments: {type: int, value: 24}
  - id: yeoul_cash_service
    display_name: Cash Advance
    display_name_local: 단기카드대출(현금서비스)
    domain: lending_mortgage
    variables:
      cash_advance_apr: {type: percent, value: 18.2}
      cash_advance_limit_max: {type: money, value: 5000000}
  - id: yeoul_card_loan
    display_name: Card Loan
    display_name_local: 장기카드대출(카드론)
    domain: lending_mortgage
    variables:
      loan_rate_min: {type: percent, value: 5.9}
      loan_rate_max: {type: percent, value: 19.9}
      credit_limit_max: {type: money, value: 50000000}
      prepayment_fee_rate: {type: percent, value: 0}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: get_account_transactions
    discoverable: true
    side_effect_class: read_only
    description: 신용카드 이용과 현금서비스의 이용 내역을 확인한다.
  - name: file_transaction_dispute
    discoverable: true
    side_effect_class: state_changing
    description: 본인이 사용하지 않은 거래나 이중 청구의 조사를 접수하고, 부정사용 보상 절차를 시작한다.
  - name: freeze_card
    discoverable: true
    side_effect_class: state_changing
    description: 카드의 분실·도난 신고를 접수하고 즉시 사용을 정지한다.
  - name: order_replacement_card
    discoverable: true
    side_effect_class: state_changing
    description: 새 카드 번호로 카드를 재발급한다.
  - name: change_to_revolving
    discoverable: true
    side_effect_class: state_changing
    description: 일부결제금액이월약정(리볼빙)을 신청하고 약정결제비율을 정한다.
  - name: change_to_installments
    discoverable: true
    side_effect_class: state_changing
    description: 일시불로 결제한 이용 건을 결제일 전에 할부 개월 수를 정해 할부로 바꾼다(결제 후 할부 전환).
  - name: change_revolving_payment
    discoverable: true
    side_effect_class: state_changing
    description: 리볼빙의 약정결제비율을 바꾼다.
  - name: prepay_revolving_balance
    discoverable: true
    side_effect_class: state_changing
    description: 리볼빙 이월 잔액이나 결제 예정 금액의 일부 또는 전부를 결제일 전에 선결제한다.
  - name: request_limit_change
    discoverable: true
    side_effect_class: state_changing
    description: 카드 이용한도나 현금서비스 한도의 상향·하향을 신청한다. 상향하려면 심사가 있다.
  - name: file_installment_objection
    discoverable: true
    side_effect_class: state_changing
    description: 물건이 오지 않거나 하자가 있는 할부 거래에 대해 남은 할부금의 지급을 거절하는 항변 신청을 접수한다.
  # Common operations whose identifiers come from other markets, declared with
  # the Korean procedure they carry here.
  - name: get_loan_details
    discoverable: true
    side_effect_class: read_only
    description: 현금서비스와 카드론의 이용 잔액, 금리, 다음 결제일과 결제 금액을 확인한다.
  - name: apply_loan
    discoverable: true
    side_effect_class: state_changing
    description: 장기카드대출(카드론) 신청을 접수한다. 심사가 있으며, 대출 총액이 1억원을 넘으면 DSR 규제가 적용된다.
  - name: pay_emi
    discoverable: true
    side_effect_class: state_changing
    description: 결제일에 출금되지 못한 카드대금이나 현금서비스·카드론 상환금을 가상계좌 이체로 납부한다.
  - name: foreclose_loan
    discoverable: true
    side_effect_class: irreversible
    description: 카드론의 남은 원금을 한꺼번에 중도상환한다.
  - name: update_repayment_mandate
    discoverable: true
    side_effect_class: state_changing
    description: 카드대금을 출금할 결제 계좌를 바꾼다.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 카드론 대출금을 받을 입금 계좌를 바꾼다.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: 가족카드나 후불교통카드 기능 추가 발급을 신청한다.
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: 카드를 해지한다. 리볼빙, 할부, 카드론 잔액은 해지한 뒤에도 계속 갚아야 한다.
  task_templates:
  - {id: TPL-YW-REVO-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [change_to_revolving]}
  - {id: TPL-YW-HALBU-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}
