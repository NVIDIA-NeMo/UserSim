  - name: report_voice_phishing
    discoverable: true
    side_effect_class: state_changing
    description: 보이스피싱 등 전기통신금융사기 피해 신고를 받아 피해구제 신청을 접수하고, 돈을 보낸 상대 계좌의 지급정지를 요청한다.
  # Common operations whose meaning differs in Korea, declared with the Korean
  # procedure they carry here.
  - name: transfer_funds
    discoverable: true
    side_effect_class: state_changing
    description: 입출금통장, 세이프박스, 모임통장, 다른 은행 계좌 사이에서 돈을 옮긴다.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 자주 쓰는 계좌(받는 분의 은행, 계좌번호, 이름)를 등록, 변경, 삭제한다.
  - name: stop_payment
    discoverable: true
    side_effect_class: state_changing
    description: 자동이체의 해지를 접수한다. 미리내뱅크는 수표와 어음을 다루지 않는다.
  - name: pay_bill
    discoverable: true
    side_effect_class: state_changing
    description: 국세, 지방세, 공과금을 입출금통장에서 납부한다.
  - name: activate_card
    discoverable: true
    side_effect_class: state_changing
    description: 앱에서 체크카드 사용을 시작한다.
  - name: order_replacement_card
    discoverable: true
    side_effect_class: state_changing
    description: 체크카드를 재발급한다.
  task_templates:
  - {id: TPL-MR-FREEZE-001, tier: verifiable, task_type: fraud_triage, persona_tags: [region:any, age:any], gold_tool_sequence: [freeze_card]}
  - {id: TPL-MR-MOIM-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

