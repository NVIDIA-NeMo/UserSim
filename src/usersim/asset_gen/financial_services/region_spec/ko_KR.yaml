  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - {name: get_account_transactions, discoverable: true, side_effect_class: read_only}
  - name: file_transaction_dispute
    discoverable: true
    side_effect_class: state_changing
    description: 체크카드의 본인이 사용하지 않은 거래나 이중 출금에 대해 이의 제기와 조사를 접수한다.
  - name: freeze_card
    discoverable: true
    side_effect_class: state_changing
    description: 현금카드나 체크카드의 분실·도난 신고를 접수하고 즉시 사용을 정지한다.
  - name: report_voice_phishing
    discoverable: true
    side_effect_class: state_changing
    description: 보이스피싱 등 전기통신금융사기 피해 신고를 받아 피해구제 신청을 접수하고, 돈을 보낸 상대 계좌의 지급정지를 요청한다.
  - name: open_time_deposit
    discoverable: true
    side_effect_class: state_changing
    description: 입출금통장에서 금액과 기간을 정해 정기예금에 가입한다.
  - name: open_installment_savings
    discoverable: true
    side_effect_class: state_changing
    description: 월 납입액과 기간을 정해 정기적금에 가입하고, 입출금통장에서 자동이체를 설정한다.
  - name: cancel_time_deposit
    discoverable: true
    side_effect_class: irreversible
    description: 정기예금이나 정기적금을 만기 전에 해지하고, 원금과 중도해지이율로 계산한 이자를 입출금통장에 입금한다.
  - name: request_loan_prepayment
    discoverable: true
    side_effect_class: state_changing
    description: 주택담보대출이나 신용대출의 일부 또는 전액 중도상환을 신청한다.
  - name: change_loan_rate_type
    discoverable: true
    side_effect_class: state_changing
    description: 주택담보대출의 금리를 변동금리에서 5년 혼합형 금리로 바꾸거나, 혼합형의 고정 기간이 끝날 때의 금리 유형 선택을 접수한다.
  - name: apply_credit_loan
    discoverable: true
    side_effect_class: state_changing
    description: 직장인 신용대출 신청을 접수한다. 심사가 있으며 한도와 금리는 심사 결과에 따라 정해진다.
  - name: request_rate_reduction
    discoverable: true
    side_effect_class: state_changing
    description: 대출을 받은 뒤 소득 증가나 신용점수 상승 등으로 신용 상태가 나아진 고객의 금리인하요구를 접수한다.
  # Common operations whose meaning differs in Korea, declared with the Korean
  # procedure they carry here.
  - name: transfer_funds
    discoverable: true
    side_effect_class: state_changing
    description: 입출금통장에서 윤슬은행이나 다른 은행의 계좌로 이체한다.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 모바일·인터넷뱅킹의 자주 쓰는 계좌(받는 분의 은행, 계좌번호, 이름)를 등록, 변경, 삭제한다.
  - name: stop_payment
    discoverable: true
    side_effect_class: state_changing
    description: 공과금, 보험료, 카드대금 같은 자동이체의 해지를 접수한다.
  - name: pay_bill
    discoverable: true
    side_effect_class: state_changing
    description: 국세, 지방세, 공과금을 입출금통장에서 납부한다.
  - name: activate_card
    discoverable: true
    side_effect_class: state_changing
    description: 받은 체크카드의 사용 등록을 한다.
  - name: order_replacement_card
    discoverable: true
    side_effect_class: state_changing
    description: 현금카드나 체크카드를 재발급한다. 재발급 수수료가 붙을 수 있다.
  task_templates:
  - {id: TPL-YS-FREEZE-001, tier: verifiable, task_type: fraud_triage, persona_tags: [region:any, age:any], gold_tool_sequence: [freeze_card]}
  - {id: TPL-YS-YEGEUM-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

