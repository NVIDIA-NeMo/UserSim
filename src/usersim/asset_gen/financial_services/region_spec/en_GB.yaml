  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: transfer_isa_in
    discoverable: true
    side_effect_class: state_changing
    description: Transfer an ISA held with another provider into a Fernbridge ISA without losing its tax-free status.
  - name: claim_lisa_home_purchase
    discoverable: true
    side_effect_class: irreversible
    description: Release Lifetime ISA savings and the government bonus to the member's conveyancer for a first home purchase.
  - name: make_mortgage_overpayment
    discoverable: true
    side_effect_class: state_changing
    description: Make a one-off or regular mortgage overpayment, within the yearly allowance or with the early repayment charge shown first.
  - name: request_product_transfer
    discoverable: true
    side_effect_class: state_changing
    description: Move an existing mortgage onto a new fixed or tracker deal when the current deal ends, without a new mortgage application.
  - name: apply_mortgage
    discoverable: true
    side_effect_class: state_changing
    description: Start a mortgage application or an agreement in principle (property price, deposit, term).
  - name: transfer_funds
    discoverable: true
    side_effect_class: state_changing
    description: Withdraw money from a savings account or ISA to the member's nominated bank account.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: Change the nominated bank account that withdrawals are paid to.
  - name: manage_authorized_users
    discoverable: true
    side_effect_class: state_changing
    description: Register a power of attorney, or add or remove a third-party mandate on the account.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: Open a savings account, an ISA or a Lifetime ISA.
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: Close a savings account or ISA and pay the balance to the nominated bank account.
  task_templates:
  - {id: TPL-FB-LISA-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [claim_lisa_home_purchase]}
  - {id: TPL-FB-SAVINGS-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

