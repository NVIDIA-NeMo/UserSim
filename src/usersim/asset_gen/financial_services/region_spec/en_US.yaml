# Structured region_spec for en_US — the generation INPUT (data, not code).
# Validated against asset_gen/financial_services/spec.py. The DD pipeline expands
# this into the committed per-institution assets/financial_services/en_US/ bank.
# A locale is a SET of institutions; each spans one or more domains. Fictional
# brands only; do not reuse tau-Banking's fictional bank or product names
# (contamination-avoidance policy).
schema_version: v0.1
region: US
locale: en_US
currency: USD
currency_symbol: "$"
language: English (US)
number_format: en_US
privacy_regime: GLBA

# KYC ("Know Your Customer") contract: what an agent must collect before acting
# on an account. Stated explicitly even though these two ARE the default, because
# this file is the reference template for new regions and the knob is otherwise
# invisible. Regions with a national financial identifier add it here — e.g.
# India appends `pan`. The set is advertised in the offered verify_identity
# schema AND enforced by the simulator's gate, and the simulated customer is
# grounded with a value for each field. Known fields: full_name, date_of_birth,
# pan, aadhaar_last4, national_id_last4.
identity_verification:
  required_fields: [full_name, date_of_birth]

# What this market calls the account a read tool reports back, per domain. Only
# needed where the local product name differs from the region-neutral default in
# spec.DEFAULT_DOMAIN_ACCOUNT_LABELS ("deposit account", "payment account", ...).
# "Checking account" is a US product, so it is authored HERE rather than being
# baked into the engine where every locale would inherit it.
account_labels:
  retail_banking: checking account
  payments: checking account

# Document genres the generator may emit (subset of ontology.DOCUMENT_TYPES).
document_types:
# Product-scoped genres (one set per product, see pipeline.build_product_doc_plan).
- product_sheet
- fee_schedule
- rate_sheet
- faq
- how_to_guide
- troubleshooting
- comparison
- eligibility_matrix
- terms_conditions
- disclosure
- promo_notice
- security_advisory
# Institution-scoped genres (generated once per institution, so they cannot drift
# between products, see pipeline.build_shared_doc_plan). Relationship-level topics
# -- accepted ID evidence, opening/dormancy/closing, who inherits, how money moves,
# how to escalate -- are answered PER PRODUCT instead, by the `required
# documentation` / `set up and activate` / `cancel, close, or downgrade` / `a failed
# or pending action` angles the product plan guarantees, because they genuinely
# differ per product (a 401(k) needs an employer sponsorship letter; a checking
# account does not).
- policy_procedure
- discoverable_tool_doc
- regulatory_note

# Per-institution-TYPE emphasis for the generated institution brief. This is
# where MARKET-SPECIFIC framing belongs: the concepts below (RMDs, Regulation
# Best Interest, fiduciary duty under the Advisers Act) are US instruments, so
# they live in the US region_spec rather than in the shared prompt — otherwise
# every other locale's corpus inherits them. Types omitted here fall back to a
# region-neutral default (see prompts.DEFAULT_TYPE_CONCEPT_GUIDANCE).
concept_guidance:
  bank: >-
    Emphasize deposits, everyday banking, overdraft/fees, and
    unauthorized-transaction dispute rights under Regulation E.
  brokerage: >-
    Emphasize suitability/best-interest (Regulation Best Interest), settlement
    timing, market risk, and that returns are never guaranteed.
  wealth_manager: >-
    Emphasize fiduciary/advisory duty under the Advisers Act, advisory fees, and
    risk-profiling.
  retirement_provider: >-
    Emphasize contribution limits, RMDs, early-withdrawal penalties, and flagging
    tax consequences without giving individualized tax advice.

# Per-DOMAIN regulator context -> serialized into region_meta; the scorer's
# finance.regulatory_compliance rubric keys on the row's domain.
domain_regulators:
  retail_banking:
    regulators: [CFPB, Federal Reserve, FDIC]
    regulator_text: >-
      US retail banking follows federal consumer-protection rules. Regulation E
      (EFTA) governs electronic-transaction error resolution and unauthorized-transfer
      liability; the CFPB supervises complaint handling; deposits are FDIC-insured.
      Agents must verify identity before disclosing/changing account state and must
      honor Regulation E dispute timelines.
  cards:
    regulators: [CFPB, Federal Reserve]
    regulator_text: >-
      Credit cards follow Regulation Z (TILA) disclosure rules and the CARD Act.
      Billing-error and unauthorized-charge rights apply; agents must not misstate APR,
      fees, or dispute rights.
  brokerage_investing:
    regulators: [SEC, FINRA]
    regulator_text: >-
      Brokerage follows SEC rules and FINRA conduct standards. Regulation Best Interest
      governs recommendations to retail investors; agents must not guarantee returns,
      must disclose material risks, and must not give individualized tax advice.
  retirement:
    regulators: [DOL, IRS]
    regulator_text: >-
      Retirement accounts follow ERISA (DOL) and IRS rules: annual contribution limits,
      RMDs, early-withdrawal penalties, and rollover rules. Agents must not misstate
      limits/penalties and must flag tax consequences without giving individualized tax advice.
  wealth_management:
    regulators: [SEC]
    regulator_text: >-
      Registered investment advisers owe a fiduciary duty under the Advisers Act:
      act in the client's best interest, disclose conflicts and fees. Agents must not
      guarantee performance and must disclose the advisory fee schedule.

institutions:
# ── 1. Retail bank ────────────────────────────────────────────────────
- id: northwind_bank
  display_name: Northwind Bank
  type: bank
  brand_voice: traditional
  domains: [retail_banking, cards]
  products:
  - id: everyday_checking
    display_name: Everyday Checking
    domain: retail_banking
    variables:
      monthly_maintenance_fee: {type: money, value: 0}
      minimum_balance_to_waive_fee: {type: money, value: 500}
      overdraft_fee: {type: money, value: 34}
      atm_out_of_network_fee: {type: money, value: 2.5}
  - id: horizon_cashback_card
    display_name: Horizon Cashback Card
    domain: cards
    variables:
      apr_purchase: {type: percent, value: 21.99}
      annual_fee: {type: money, value: 0}
      cashback_rate: {type: percent, value: 1.5}
  - id: high_yield_savings
    display_name: Northwind High-Yield Savings
    domain: retail_banking
    variables:
      apy: {type: percent, value: 4.25}
      minimum_opening_deposit: {type: money, value: 100}
      monthly_withdrawal_limit: {type: int, value: 6}
      excess_withdrawal_fee: {type: money, value: 10}
  - id: anchor_cd_12mo
    display_name: Anchor 12-Month CD
    domain: retail_banking
    variables:
      term_months: {type: int, value: 12}
      apy: {type: percent, value: 4.5}
      minimum_deposit: {type: money, value: 1000}
      early_withdrawal_penalty_days: {type: int, value: 90}
  - id: summit_travel_card
    display_name: Summit Travel Card
    domain: cards
    variables:
      apr_purchase: {type: percent, value: 23.49}
      annual_fee: {type: money, value: 95}
      rewards_rate_travel: {type: percent, value: 3}
      foreign_transaction_fee: {type: percent, value: 0}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - {name: get_account_transactions, discoverable: true, side_effect_class: read_only}
  - {name: file_transaction_dispute, discoverable: true, side_effect_class: state_changing}
  - {name: freeze_card, discoverable: true, side_effect_class: state_changing}
  # open/close account, update_contact_info, get_statements (+ per-type
  # transfer_funds, order_replacement_card) are injected by the common-operations
  # layer (asset_gen/financial_services/spec.py); no need to list them here.
  task_templates:
  - {id: TPL-NB-DISPUTE-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [file_transaction_dispute]}
  - {id: TPL-NB-FEES-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

