    discoverable: true
    side_effect_class: irreversible
    description: 証券総合口座の預り金を、登録した銀行口座へ出金する。
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 出金先として登録している銀行口座を変更する。
  - name: manage_authorized_users
    discoverable: true
    side_effect_class: state_changing
    description: 未成年口座の法定代理人（親権者）を登録・変更する。
  task_templates:
  - {id: TPL-HS-NISA-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [open_nisa_account]}
  - {id: TPL-HS-SHISAN-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

