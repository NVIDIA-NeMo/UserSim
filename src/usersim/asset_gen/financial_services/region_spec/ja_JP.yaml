  - id: asanagi_debit
    display_name: Asanagi Visa Debit
    display_name_local: 朝凪Visaデビット
    domain: cards
    variables:
      annual_fee: {type: money, value: 0}
      overseas_fee_rate: {type: percent, value: 3.0}
      daily_spending_limit: {type: money, value: 500000}
      cashback_rate: {type: percent, value: 0.2}
  - id: jutaku_loan
    display_name: Home Loan
    display_name_local: 住宅ローン
    domain: lending_mortgage
    variables:
      variable_rate: {type: percent, value: 1.375}
      fixed_rate_10_years: {type: percent, value: 3.7}
      loan_fee_rate: {type: percent, value: 2.2}
      max_loan_amount: {type: money, value: 100000000}
      max_term_years: {type: int, value: 35}
      payment_review_years: {type: int, value: 5}
      payment_increase_cap: {type: percent, value: 125}
      online_prepayment_fee: {type: money, value: 0}
  - id: asanagi_card_loan
    display_name: Asanagi Card Loan
    display_name_local: 朝凪カードローン
    domain: lending_mortgage
    variables:
      loan_rate_min: {type: percent, value: 2.0}
      loan_rate_max: {type: percent, value: 14.5}
      credit_limit_max: {type: money, value: 8000000}
      minimum_monthly_payment: {type: money, value: 2000}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - {name: get_account_transactions, discoverable: true, side_effect_class: read_only}
  - name: file_transaction_dispute
    discoverable: true
    side_effect_class: state_changing
    description: デビットカードの身に覚えのない利用や二重の引落しについて、調査と補償の申出を受け付ける。
  - name: freeze_card
    discoverable: true
    side_effect_class: state_changing
    description: キャッシュカードまたはデビットカードの紛失・盗難の届出を受け付け、すぐに利用を停止する。
  - name: open_time_deposit
    discoverable: true
    side_effect_class: state_changing
    description: 普通預金から、金額と預入期間を指定してスーパー定期を預け入れる。
  - name: cancel_time_deposit
    discoverable: true
    side_effect_class: irreversible
    description: スーパー定期を満期前に解約し、元金と中途解約利率で計算した利息を普通預金に入金する。
  - name: request_loan_prepayment
    discoverable: true
    side_effect_class: state_changing
    description: 住宅ローンの一部繰上返済（期間短縮型または返済額軽減型）または全額繰上返済を申し込む。
  - name: change_loan_rate_type
    discoverable: true
    side_effect_class: state_changing
    description: 住宅ローンの金利タイプを変動金利から固定金利期間選択型に変更する。固定金利期間が終わるときの金利タイプの選び直しも受け付ける。
  - name: apply_card_loan
    discoverable: true
    side_effect_class: state_changing
    description: 朝凪カードローンの申込みを受け付ける。審査があり、利用限度額は審査で決まる。
  # Common operations whose meaning differs in Japan, declared with the Japanese
  # procedure they carry here.
  - name: transfer_funds
    discoverable: true
    side_effect_class: state_changing
    description: 普通預金から当行または他行の口座へ振込を行う。
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: インターネットバンキングの登録振込先（金融機関、支店、口座番号、受取人名）を追加、変更、削除する。
  - name: stop_payment
    discoverable: true
    side_effect_class: state_changing
    description: 公共料金やクレジットカード代金などの口座振替（自動引落し）の停止を受け付ける。
  - name: pay_bill
    discoverable: true
    side_effect_class: state_changing
    description: 税金や公共料金などの払込みを、ペイジーで口座から行う。
  - name: activate_card
    discoverable: true
    side_effect_class: state_changing
    description: 届いたデビットカードの利用開始の手続きを行う。
  - name: order_replacement_card
    discoverable: true
    side_effect_class: state_changing
    description: キャッシュカードやデビットカードを再発行する。再発行手数料がかかる。
  - name: manage_authorized_users
    discoverable: true
    side_effect_class: state_changing
    description: 同居の家族が使う代理人カードの発行や利用停止を受け付ける。
  task_templates:
  - {id: TPL-AN-FREEZE-001, tier: verifiable, task_type: fraud_triage, persona_tags: [region:any, age:any], gold_tool_sequence: [freeze_card]}
  - {id: TPL-AN-TEIKI-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

