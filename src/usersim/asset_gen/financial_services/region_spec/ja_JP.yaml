# Structured region_spec for ja_JP, the generation INPUT (data, not code).
# Validated against asset_gen/financial_services/spec.py. gen-assets expands this
# into the committed per-institution assets/financial_services/ja_JP/ bank.
#
# The institution set follows the Japanese retail market: a regional bank, an
# internet-only bank, an online broker (NISA, specified accounts, iDeCo), a life
# insurer with medical and cancer cover, and a credit card company that also
# lends through cash advances and card loans. Brands are fictional.
#
# Content fields are written in Japanese, so the institution brief, the corpus and
# the regulatory context the judge reads share the corpus language. Field names,
# ids, variable keys and tool names are identifiers and stay in English. Brands
# and products keep a Latin `display_name` as the canonical label, and the
# Japanese `display_name_local` is the name the corpus and conversations use.
#
# Multi-line Japanese values are double-quoted with escaped line breaks: YAML
# folds a plain line break into a space, which Japanese does not write.
#
# Regulated values (NISA allowances, deposit insurance, lending rate caps, tax
# rates and deduction limits) are those in force in October 2026. The iDeCo
# contribution caps and fees are those that apply from December 2026
# contributions, and their labels say so. Entries carry `placeholder: true`, as
# in the other banks.
schema_version: v0.1
region: JP
locale: ja_JP
currency: JPY
currency_symbol: "円"
language: Japanese (Japan)
number_format: ja_JP
privacy_regime: 個人情報保護法

# Japanese institutions identify a customer by name and date of birth before
# acting on an account, as in the default contract.
identity_verification:
  required_fields: [full_name, date_of_birth]

# The numeric check reads half-width digits, and reads 万 and 億 only for whole
# multiples of 10,000, so the guidance asks for exactly those forms.
language_conventions:
  guidance: >-
    Write natural Japanese in the polite です・ます style that Japanese financial
    institutions use with customers. Write amounts and rates in half-width Arabic
    digits with comma grouping and 円 directly after the number (1,234円, 0.4%),
    never in full-width digits, kanji numerals, ¥ or ￥. Round amounts may use
    万 and 億 (1,000万円, 1億円); write every other amount in full digits
    (62,000円, not 6.2万円). Write years in the Western calendar (2026年). Use
    the current NISA terms つみたて投資枠 and 成長投資枠, and mention つみたてNISA
    or 一般NISA only for holdings bought under the system that ended in 2023.

# The account type the simulator's read tools report back to the customer.
account_labels:
  retail_banking: 普通預金
  cards: デビットカード
  payments: クレジットカード
  lending_mortgage: ローン
  insurance: 保険契約
  brokerage_investing: 証券総合口座

document_types:
- product_sheet
- fee_schedule
- rate_sheet
- faq
- how_to_guide
- troubleshooting
- comparison
- eligibility_matrix
- terms_conditions
- disclosure
- promo_notice
- security_advisory
- policy_procedure
- discoverable_tool_doc
- regulatory_note

# Per-institution-TYPE emphasis for the generated institution brief.
concept_guidance:
  bank: "地域に根ざした地方銀行として、次の点を取り上げる。普通預金（給与・年金の受取口座、\
    公共料金などの口座振替、ATMの時間外手数料、他行あて振込手数料と、給与・年金の受取による優遇）。\
    スーパー定期（預入期間ごとの金利、満期時の自動継続、満期前に解約すると中途解約利率が適用されること、\
    利息には20.315%の税金がかかること）。キャッシュカードとデビットカード（紛失・盗難時の利用停止と再発行、\
    デビットカードは利用と同時に口座残高から引き落とされること、偽造・盗難カードによる被害の補償）。\
    住宅ローン（変動金利と固定金利期間選択型の違い、変動金利の返済額は5年ごとに見直され、\
    見直し後の返済額は見直し前の125%が上限だが、未払利息が生じることがあること、\
    繰上返済の期間短縮型と返済額軽減型、団体信用生命保険への加入、住宅ローン控除）。\
    銀行のカードローン（貸金業法の総量規制の対象外だが、返済能力を審査して利用限度額を決めること）。\
    預金保険制度による保護と、口座開設時の本人確認にも触れる。"
  neobank: "店舗を持たないインターネット専業銀行として、次の点を取り上げる。\
    スマートフォンのアプリで完結する口座開設（マイナンバーカードのICチップを読み取るオンラインの本人確認）、\
    普通預金の金利、目的別口座、会員ランクに応じた他行あて振込手数料とATM手数料の無料回数、\
    Visaデビットカード（キャッシュバック、海外利用時の事務手数料、アプリでの利用停止と利用限度額の変更）、\
    携帯電話番号を使った少額の送金、ログイン時と振込時の二段階認証、機種変更時の認証の再登録、\
    不正送金やフィッシング詐欺への注意と被害の補償。預金は預金保険制度の対象で、\
    利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護される。"
  insurer: "生命保険会社として、次の点を取り上げる。定期保険、終身保険（低解約返戻金型）、医療保険、\
    がん保険、個人年金保険の違い。保険金・給付金の請求手続き（必要書類と、書類がそろってからの支払時期）。\
    告知義務（事実と違う告知をすると契約が解除され、保険金や給付金が支払われないことがある）。\
    クーリング・オフ（申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内）。\
    がん保険の待ち期間。払込猶予期間、失効と復活、契約者貸付、解約返戻金。受取人の変更。\
    生命保険料控除（新制度の契約は、一般生命保険料、介護医療保険料、個人年金保険料の区分ごとに\
    所得税で最高4万円、合計で最高12万円。2026年分と2027年分は、23歳未満の扶養親族がいる人の\
    一般生命保険料控除が最高6万円になるが、合計の上限は12万円のまま）。\
    公的医療保険の高額療養費制度（自己負担には所得に応じた月ごとの上限があり、\
    2026年8月の診療分からは年間の上限も設けられた）と、民間の医療保険が補う部分。\
    生命保険契約者保護機構にも触れ、保険金の支払いを約束する表現や、個別の税務・医療の助言は避ける。"
  nbfc: "クレジットカード会社として、次の点を取り上げる。ショッピングの支払方法（1回払い、2回払い、\
    ボーナス一括払いは手数料がかからず、分割払いとリボ払いは手数料がかかること、あとからリボとあとから分割）。\
    リボ払いの仕組み（毎月の支払額はほぼ一定でも、残高に手数料がかかり続けるため支払総額が増えやすいこと、\
    繰上返済で手数料を減らせること）。キャッシングとカードローン（貸金業法の総量規制により、\
    貸金業者からの借入れは原則として年収の3分の1まで。上限金利は元本10万円未満が年20%、\
    10万円以上100万円未満が年18%、100万円以上が年15%）。年会費とポイント、利用可能枠と支払可能見込額の調査、\
    不正利用の補償、紛失・盗難時の利用停止と再発行、本人認証サービス（EMV 3-Dセキュア）、\
    指定信用情報機関への登録、支払いが難しくなったときの早めの相談。"
  brokerage: "ネット証券として、次の点を取り上げる。NISA（日本に住む18歳以上が1人1口座。\
    つみたて投資枠は年間120万円、成長投資枠は年間240万円で、年間投資枠は合計360万円。\
    非課税保有限度額は1,800万円で、うち成長投資枠は1,200万円。売却した商品の取得価額の分だけ、\
    翌年以降に非課税保有限度額の枠を再び使える。NISA口座を開く金融機関は年単位で変更できる。\
    2027年1月からは0歳から17歳もつみたて投資枠を利用でき、年間投資枠は60万円、非課税保有限度額は600万円）。\
    特定口座（源泉徴収ありを選ぶと原則として確定申告が不要。上場株式等の譲渡益と配当には20.315%の税金がかかる。\
    損益通算と、確定申告による3年間の損失の繰越控除）。iDeCo（掛金は全額が所得控除の対象で、\
    原則として60歳まで引き出せない。2026年12月分の掛金から拠出限度額が引き上げられ、\
    会社員は企業年金の掛金と合わせて月額62,000円まで、自営業者は国民年金基金の掛金などと合わせて\
    月額75,000円まで。一定の要件を満たせば70歳になるまで加入できる）。国内株式と米国株式の取引手数料、\
    為替手数料、投資信託の積立とクレジットカード積立、国内株式の受渡しは約定日の2営業日後であること、\
    顧客資産の分別管理と日本投資者保護基金、適合性の原則、元本が保証されないこと。"

# Per-DOMAIN regulator context -> serialized into region_meta; the scorer's
# finance.regulatory_compliance rubric keys on the row's domain.
domain_regulators:
  retail_banking:
    regulators: [金融庁, 預金保険機構]
    regulator_text: "銀行は銀行法に基づき金融庁の監督を受ける。預金保険制度により、利息のつく普通預金や定期預金などは、\
      1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護され、\
      無利息、要求払い、決済サービスを提供できるという3つの条件を満たす決済用預金は全額が保護される。\
      外貨預金は預金保険の対象外である。偽造・盗難キャッシュカードによる不正な払戻しは、預金者保護法に基づき、\
      預金者に故意や重大な過失がない限り原則として銀行が補償する（盗難カードで預金者に過失がある場合は、\
      補償が減額されることがある）。口座の開設などでは、犯罪収益移転防止法に基づく取引時確認（本人確認）が必要になる。\
      個人情報は個人情報保護法に従って取り扱う。苦情や紛争は全国銀行協会相談室で受け付けている。\
      エージェントは、口座の情報を伝えたり変更したりする前に本人確認を行う。"
  cards:
    regulators: [金融庁]
    regulator_text: "デビットカードは利用と同時に預金口座から代金が引き落とされ、口座残高を超えて利用することはできない。\
      紛失や盗難に気づいたら、ただちに銀行に届け出てカードの利用を止める必要がある。\
      インターネットでの利用には本人認証サービス（EMV 3-Dセキュア）が使われる。\
      不正利用による被害は、銀行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となる。\
      キャッシュカードの偽造・盗難による不正な払戻しは預金者保護法の対象となる。\
      エージェントは、手数料、利用限度額、補償の条件を誤って伝えてはならない。"
  lending_mortgage:
    regulators: [金融庁]
    regulator_text: "銀行の住宅ローンやカードローンは銀行法に基づき金融庁の監督を受け、貸金業法の総量規制の対象外だが、\
      銀行は返済能力を審査したうえで利用限度額を決める。クレジットカードのキャッシングやカードローンなど、\
      貸金業者による個人向けの貸付けは貸金業法の対象で、総量規制により、貸金業者からの借入れの合計は\
      原則として年収の3分の1までとなる。利息制限法により、上限金利は元本10万円未満が年20%、\
      10万円以上100万円未満が年18%、100万円以上が年15%で、貸金業者の遅延損害金の上限は年20%である。\
      借入れの状況は指定信用情報機関に登録される。住宅ローン控除は、2030年末までに入居した場合に、\
      年末のローン残高の0.7%を所得税などから控除する制度で、住宅の省エネ性能などによって\
      借入限度額と控除期間が異なる。エージェントは融資の承認を約束せず、総返済額を小さく見せず、\
      返済が難しい顧客には早めの相談と返済条件の見直しを案内する。"
  payments:
    regulators: [経済産業省]
    regulator_text: "クレジットカードのショッピングは割賦販売法の対象で、カード会社は経済産業省に登録した\
      包括信用購入あっせん業者として、カードの発行時と利用可能枠を増やすときに支払可能見込額を調査し、\
      それを超える利用可能枠を設定しない。リボ払いや分割払いでは、販売店とのトラブルを理由に\
      カード会社への支払いを拒める場合がある（支払停止の抗弁）。カード会社はカード番号などの情報を適切に管理し、\
      インターネットでの利用には本人認証サービス（EMV 3-Dセキュア）を導入している。\
      ショッピングの利用は貸金業法の総量規制の対象外である。苦情は日本クレジット協会の消費者相談室でも受け付けている。\
      エージェントは手数料や支払総額を誤って伝えず、リボ払いや分割払いを案内するときは手数料がかかることを明確に伝える。"
  insurance:
    regulators: [金融庁, 生命保険契約者保護機構]
    regulator_text: "生命保険会社は保険業法に基づき金融庁の監督を受ける。生命保険会社が破綻した場合、\
      生命保険契約者保護機構により、補償対象契約の責任準備金等の90%まで（高予定利率契約を除く）が補償されるが、\
      保険金額などが削減されることがある。契約者は、申込日または契約内容を記載した書面を受け取った日の\
      いずれか遅い日から8日以内であれば、書面または電磁的記録によりクーリング・オフ（申込みの撤回）ができる。\
      告知義務に違反すると契約が解除され、保険金や給付金が支払われないことがある。生命保険料控除は、\
      新制度の契約では一般生命保険料、介護医療保険料、個人年金保険料の区分ごとに所得税で最高4万円、\
      合計で最高12万円である。苦情や紛争は生命保険協会の生命保険相談所で受け付けている。\
      エージェントは保険金や給付金の支払いを約束せず、個別の税務や医療の助言は行わない。"
  brokerage_investing:
    regulators: [金融庁, 日本証券業協会]
    regulator_text: "証券会社は金融商品取引法に基づき金融庁に登録し、その監督を受ける。顧客から預かった金銭や\
      有価証券は証券会社の財産と分けて管理され（分別管理）、証券会社が破綻して返還されない場合は、\
      日本投資者保護基金が1人当たり1,000万円まで補償する。相場の変動による損失は補償の対象外である。\
      証券会社は、顧客の知識、経験、財産の状況、投資の目的に照らして不適当な勧誘をしてはならず\
      （適合性の原則）、顧客の最善の利益を考えて業務を行う。上場株式等の譲渡益と配当には20.315%の税金がかかり、\
      NISA口座で得た利益は非課税になる。iDeCoは確定拠出年金法に基づく制度で、国民年金基金連合会が実施し、\
      証券会社は運営管理機関として運用商品の提示や情報提供を行う。証券口座の開設にはマイナンバーの届出が必要である。\
      苦情や紛争は証券・金融商品あっせん相談センター（FINMAC）で受け付けている。\
      エージェントは利益を保証せず、個別の税務の助言は行わない。"

# In-language vocabulary the deterministic doc plan builds titles from. Tool names
# are identifiers and stay verbatim in every language.
