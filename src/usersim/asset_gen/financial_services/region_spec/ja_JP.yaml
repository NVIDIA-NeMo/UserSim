  - id: gan_hoken
    display_name: Komorebi Cancer Insurance
    display_name_local: こもれびがん保険
    domain: insurance
    variables:
      cancer_diagnosis_benefit: {type: money, value: 1000000}
      cancer_treatment_monthly_benefit: {type: money, value: 100000}
      waiting_period_days: {type: int, value: 90}
      cancer_premium_example: {type: money, value: 1980}
  - id: kojin_nenkin
    display_name: Komorebi Individual Annuity
    display_name_local: こもれび個人年金保険
    domain: insurance
    variables:
      annuity_start_age: {type: int, value: 65}
      annuity_period_years: {type: int, value: 10}
      annuity_premium_example: {type: money, value: 10000}
      return_rate_example: {type: percent, value: 108}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: request_policy_loan
    discoverable: true
    side_effect_class: state_changing
    description: 解約返戻金の一定範囲内で、契約者貸付を申し込む。
  - name: reinstate_policy
    discoverable: true
    side_effect_class: state_changing
    description: 払込猶予期間を過ぎて失効した契約の復活を申し込む。復活には告知が必要で、所定の期間内に限る。
  - name: send_deduction_certificate
    discoverable: true
    side_effect_class: read_only
    description: 生命保険料控除証明書を再発行して郵送する。
  - name: change_payment_method
    discoverable: true
    side_effect_class: state_changing
    description: 保険料の払込方法（口座振替またはクレジットカード）や引落口座を変更する。
  - name: withdraw_application
    discoverable: true
    side_effect_class: irreversible
    description: クーリング・オフ（申込みの撤回）を受け付ける。
  # Common operations whose meaning differs in Japan, declared with the Japanese
  # procedure they carry here.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: 新しい保険契約の申込みを受け付ける。申込みには告知が必要。
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: 死亡保険金受取人や指定代理請求人を変更する。
  - name: file_claim
    discoverable: true
    side_effect_class: state_changing
    description: 入院、手術、がんの診断などの給付金や、死亡保険金の請求を受け付け、必要書類を案内する。
  - name: get_claim_status
    discoverable: true
    side_effect_class: read_only
    description: 請求の手続き状況（書類の受付、確認、支払）を確認する。
  - name: update_policy
    discoverable: true
    side_effect_class: state_changing
    description: 保険金額の減額や特約の追加・解約などの契約内容の変更を受け付ける。
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: 保険契約を解約する。解約返戻金がある場合は指定の口座に支払う。
  task_templates:
  - {id: TPL-KL-CLAIM-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [file_claim]}
  - {id: TPL-KL-HOSHO-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

# ── 5. Credit card company ────────────────────────────────────────────
- id: tsumugi_card
  display_name: Tsumugi Card
  display_name_local: つむぎカード
  type: nbfc
  brand_voice: traditional
  domains: [payments, lending_mortgage]
  products:
  - id: tsumugi_card_standard
    display_name: Tsumugi Card
    display_name_local: つむぎカード
    domain: payments
    variables:
      annual_fee: {type: money, value: 1375}
      reward_rate: {type: percent, value: 0.5}
      shopping_limit_max: {type: money, value: 1000000}
      etc_card_fee: {type: money, value: 550}
  - id: ribo_barai
    display_name: Revolving Payment
    display_name_local: リボ払い
    domain: payments
    variables:
      revolving_apr: {type: percent, value: 15.0}
      minimum_revolving_payment: {type: money, value: 5000}
  - id: bunkatsu_barai
    display_name: Installment Payment
    display_name_local: 分割払い
    domain: payments
    variables:
      installment_apr_min: {type: percent, value: 12.0}
      installment_apr_max: {type: percent, value: 15.0}
      fee_per_100_yen_3_payments: {type: money, value: 2.01}
      max_installments: {type: int, value: 24}
  - id: cashing
    display_name: Cash Advance
    display_name_local: キャッシング
    domain: lending_mortgage
    variables:
      cashing_apr: {type: percent, value: 18.0}
      cashing_limit_max: {type: money, value: 500000}
      atm_fee_up_to_10000: {type: money, value: 110}
      atm_fee_over_10000: {type: money, value: 220}
  - id: tsumugi_card_loan
    display_name: Tsumugi Card Loan
    display_name_local: つむぎカードローン
    domain: lending_mortgage
    variables:
      loan_rate_min: {type: percent, value: 4.5}
      loan_rate_max: {type: percent, value: 18.0}
      credit_limit_max: {type: money, value: 5000000}
      minimum_monthly_payment: {type: money, value: 4000}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - name: get_account_transactions
    discoverable: true
    side_effect_class: read_only
    description: ショッピングとキャッシングの利用明細を確認する。
  - name: file_transaction_dispute
    discoverable: true
    side_effect_class: state_changing
    description: 身に覚えのない利用や二重請求の調査を受け付け、不正利用の補償の手続きを開始する。
  - name: freeze_card
    discoverable: true
    side_effect_class: state_changing
    description: カードの紛失・盗難の届出を受け付け、すぐに利用を停止する。
  - name: order_replacement_card
    discoverable: true
    side_effect_class: state_changing
    description: 新しいカード番号でカードを再発行する。
  - name: change_to_revolving
    discoverable: true
    side_effect_class: state_changing
    description: 1回払いで利用したショッピングを、支払日の前にリボ払いへ変更する（あとからリボ）。
  - name: change_to_installments
    discoverable: true
    side_effect_class: state_changing
    description: 1回払いで利用したショッピングを、支払回数を指定して分割払いへ変更する（あとから分割）。
  - name: change_revolving_payment
    discoverable: true
    side_effect_class: state_changing
    description: リボ払いの毎月の支払額を変更する。
  - name: prepay_revolving_balance
    discoverable: true
    side_effect_class: state_changing
    description: リボ払いの残高の一部または全部を、振込やATMで繰上返済する手続きを受け付ける。
  - name: request_limit_change
    discoverable: true
    side_effect_class: state_changing
    description: ショッピング枠やキャッシング枠の増枠・減枠を申し込む。増枠には審査がある。
  # Common operations whose identifiers come from other markets, declared with
  # the Japanese procedure they carry here.
  - name: get_loan_details
    discoverable: true
    side_effect_class: read_only
    description: キャッシングやカードローンの借入残高、金利、次回の返済日と返済額を確認する。
  - name: apply_loan
    discoverable: true
    side_effect_class: state_changing
    description: つむぎカードローンの申込みを受け付ける。審査があり、貸金業者からの借入れは合計で年収の3分の1までに限られる。
  - name: pay_emi
    discoverable: true
    side_effect_class: state_changing
    description: 引落しができなかった月の支払いや、キャッシング・カードローンの返済を、振込やATMで行う。
  - name: foreclose_loan
    discoverable: true
    side_effect_class: irreversible
    description: キャッシングやカードローンの残高を一括で返済する。
  - name: update_repayment_mandate
    discoverable: true
    side_effect_class: state_changing
    description: 毎月の支払いに使う引落口座を変更する。
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: カードローンの融資金の振込先口座を変更する。
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: 家族カードやETCカードの追加発行を申し込む。
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: カードを解約する。リボ払い、分割払い、キャッシングの残高は、解約後も支払いが続く。
  task_templates:
  - {id: TPL-TC-REVO-001, tier: verifiable, task_type: transactional, persona_tags: [region:any, age:any], gold_tool_sequence: [change_to_revolving]}
  - {id: TPL-TC-RIBO-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}
