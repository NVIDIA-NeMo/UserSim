  topic_separator: '：'

  product_genre_angles:
    product_sheet:
    - 商品概要
    - おすすめの方と主な使い方
    - ご利用開始までの手順
    - 限度額・制限と注意事項
    - ほかの選択肢との比較と向かない場合
    fee_schedule:
    - 手数料一覧
    eligibility_matrix:
    - お申込みいただける方
    - 必要書類
    - ご利用条件による違い
    disclosure:
    - 重要事項のご説明
    - リスクについてのご説明
    - 個人情報の取扱い
    promo_notice:
    - 実施中のキャンペーン
    - ご紹介・継続利用の特典
    rate_sheet:
    - 金利・料率一覧
    - 金利・料率の決まり方と適用
    terms_conditions:
    - 規定・約款
    - 規定・約款の変更
    security_advisory:
