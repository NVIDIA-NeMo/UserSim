  - name: change_savings_rate
    discoverable: true
    side_effect_class: state_changing
    description: Den monatlichen Sparbeitrag ändern oder eine Sonderzahlung auf den Bausparvertrag leisten.
  - name: accept_allocation
    discoverable: true
    side_effect_class: irreversible
    description: Die Zuteilung eines Bausparvertrags annehmen und die Auszahlung von Bausparguthaben und Bauspardarlehen für ein Wohnvorhaben beantragen.
  - name: apply_housing_bonus
    discoverable: true
    side_effect_class: state_changing
    description: Den jährlichen Antrag auf Wohnungsbauprämie für einen Bausparvertrag einreichen.
  - name: set_up_employee_savings
    discoverable: true
    side_effect_class: state_changing
    description: Vermögenswirksame Leistungen auf einen Bausparvertrag einrichten und die Bescheinigung für den Arbeitgeber ausstellen.
  - name: apply_loan
    discoverable: true
    side_effect_class: state_changing
    description: Ein Modernisierungsdarlehen beantragen (Betrag, Laufzeit, Vorhaben); die Kreditwürdigkeitsprüfung folgt.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: Eine Begünstigung für den Todesfall in einem Bausparvertrag festlegen oder ändern.
  - name: open_account
    discoverable: true
    side_effect_class: state_changing
    description: Einen neuen Bausparvertrag abschließen.
  - name: close_account
    discoverable: true
    side_effect_class: irreversible
    description: Einen Bausparvertrag mit einer Frist von drei Monaten kündigen und das Guthaben auszahlen lassen.
