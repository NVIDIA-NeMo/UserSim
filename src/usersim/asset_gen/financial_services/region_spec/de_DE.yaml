  product_genre_angles:
    product_sheet:
    - Überblick
    - für wen und wofür geeignet
    - Schritt für Schritt starten
    - Grenzen, Einschränkungen und Sonderfälle
    - Vergleich mit Alternativen und wann es nicht passt
    fee_schedule:
    - Preis- und Leistungsverzeichnis
    eligibility_matrix:
    - Voraussetzungen
    - erforderliche Unterlagen
    - Zugangsstufen
    disclosure:
    - rechtliche Hinweise
    - Risikohinweise
    - Datenschutz und Datenverarbeitung
    promo_notice:
    - aktuelles Angebot
    - Empfehlungs- und Treueangebot
    rate_sheet:
    - Zinsübersicht
    - wie Zinsen berechnet und angewendet werden
    terms_conditions:
    - Allgemeine Geschäftsbedingungen
    - Änderung der Bedingungen
    security_advisory:
    - Schutz vor Betrug und nicht autorisierten Vorgängen
    - Sicherheitstipps für Ihr Konto
    - Betrugsmaschen rund um dieses Produkt erkennen

