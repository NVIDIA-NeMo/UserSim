institutions:
# ── 1. Public savings bank ────────────────────────────────────────────
- id: sparkasse_lindenhain
  display_name: Sparkasse Lindenhain
  type: bank
  brand_voice: traditional
  domains: [retail_banking, cards, lending_mortgage]
  products:
  - id: girokonto_komfort
    display_name: Girokonto Komfort mit Sparkassen-Card
    domain: retail_banking
    variables:
      monthly_account_fee: {type: money, value: 7.5}
      overdraft_rate: {type: percent, value: 11.49}
      tolerated_overdraft_rate: {type: percent, value: 14.49}
      protected_account_allowance: {type: money, value: 1590}
  - id: sparkassenbuch
    display_name: Sparkassenbuch
    domain: retail_banking
    variables:
      interest_rate: {type: percent, value: 0.5}
      notice_period_months: {type: int, value: 3}
      free_monthly_withdrawal: {type: money, value: 2000}
  - id: kreditkarte_gold
    display_name: Sparkassen-Kreditkarte Gold
    domain: cards
    variables:
      annual_fee: {type: money, value: 84}
      foreign_currency_fee: {type: percent, value: 1.75}
      monthly_limit: {type: money, value: 5000}
  - id: baufinanzierung
    display_name: Sparkassen-Baufinanzierung
    domain: lending_mortgage
    variables:
      fixed_rate_10_years: {type: percent, value: 3.68}
      fixed_rate_15_years: {type: percent, value: 3.91}
      annual_special_repayment_pct: {type: percent, value: 5}
  - id: privatkredit
    display_name: Sparkassen-Privatkredit
    domain: lending_mortgage
    variables:
      representative_apr: {type: percent, value: 6.49}
      representative_amount: {type: money, value: 10000}
      representative_duration_months: {type: int, value: 60}
      representative_monthly_payment: {type: money, value: 194.75}
      representative_total_cost: {type: money, value: 1685}
      maximum_loan_amount: {type: money, value: 50000}
  tool_taxonomy:
  - {name: kb_search, discoverable: false, side_effect_class: read_only}
  - {name: verify_identity, discoverable: false, side_effect_class: read_only}
  - {name: get_account_transactions, discoverable: true, side_effect_class: read_only}
  - {name: file_transaction_dispute, discoverable: true, side_effect_class: state_changing}
  - {name: freeze_card, discoverable: true, side_effect_class: state_changing}
  - name: change_overdraft_limit
    discoverable: true
    side_effect_class: state_changing
    description: Den Dispositionsrahmen des Girokontos nach Prüfung erhöhen, senken oder kündigen.
  - name: convert_to_protected_account
    discoverable: true
    side_effect_class: state_changing
    description: Ein bestehendes Girokonto innerhalb von vier Geschäftstagen in ein Pfändungsschutzkonto (P-Konto) umwandeln.
  - name: initiate_account_switch
    discoverable: true
    side_effect_class: state_changing
    description: Die Kontowechselhilfe beauftragen, die Daueraufträge, Lastschriften und Zahlungspartner vom bisherigen Konto überträgt.
  - name: request_special_repayment
    discoverable: true
    side_effect_class: state_changing
    description: Eine Sondertilgung auf die Baufinanzierung im vertraglich vereinbarten Rahmen beauftragen.
  - name: apply_loan
    discoverable: true
    side_effect_class: state_changing
    description: Einen Privatkredit beantragen (Betrag, Laufzeit, Verwendungszweck); die Kreditwürdigkeitsprüfung folgt.
  # Common operations whose meaning differs in Germany, declared with the
  # German procedure they carry here.
  - name: update_beneficiary
    discoverable: true
    side_effect_class: state_changing
    description: Einen Empfänger (Name und IBAN) in der Empfängerliste des Girokontos anlegen, ändern oder löschen.
  - name: stop_payment
    discoverable: true
    side_effect_class: state_changing
    description: Eine SEPA-Lastschrift zurückgeben, einem Lastschriftmandat widersprechen oder einen Dauerauftrag löschen.
  - name: pay_bill
    discoverable: true
    side_effect_class: state_changing
    description: Eine Rechnung per Überweisung mit den Zahlungsdaten aus der Rechnung bezahlen.
  - name: manage_authorized_users
    discoverable: true
    side_effect_class: state_changing
    description: Eine Kontovollmacht erteilen oder widerrufen.
  task_templates:
  - {id: TPL-SK-DISPUTE-001, tier: verifiable, task_type: complaint_dispute, persona_tags: [region:any, age:any], gold_tool_sequence: [file_transaction_dispute]}
  - {id: TPL-SK-DISPO-001, tier: dynamic, task_type: advisory_qa, persona_tags: [region:any]}

# ── 2. Direct bank ────────────────────────────────────────────────────
- id: kompass_direktbank
  display_name: Kompass Direktbank
  type: neobank
  brand_voice: neobank
  domains: [retail_banking, cards, payments]
  products:
  - id: girokonto
    display_name: Kompass Girokonto
    domain: retail_banking
    variables:
      monthly_account_fee: {type: money, value: 4.9}
      minimum_monthly_inflow: {type: money, value: 700}
