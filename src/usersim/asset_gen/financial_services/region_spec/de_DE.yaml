# Structured region_spec for de_DE, the generation INPUT (data, not code).
# Validated against asset_gen/financial_services/spec.py. The DD pipeline expands
# this into the committed per-institution assets/financial_services/de_DE/ bank.
#
# The institution set follows the German retail market: a public savings bank
# (Sparkasse), a direct bank, a neobroker, an insurer (liability, contents, car,
# disability and unit-linked pension cover) and a building-savings bank
# (Bausparkasse). Brands are fictional.
#
# Content fields are written in German, so the institution brief, the corpus and
# the regulatory context the judge reads share the corpus language. Field names,
# ids, variable keys and tool names are identifiers and stay in English.
#
# Regulated values (deposit protection, the garnishment-protection allowance, the
# housing bonus and employee savings allowance, legal fee caps) are those in force
# in October 2026. Entries carry `placeholder: true`, as in the other banks.
schema_version: v0.1
region: DE
locale: de_DE
currency: EUR
currency_symbol: "€"
language: German (Germany)
number_format: de_DE
privacy_regime: DSGVO

# German institutions identify a customer by name and date of birth before acting
# on an account, as in the default contract.
identity_verification:
  required_fields: [full_name, date_of_birth]

# The account type the simulator's read tools report back to the customer.
account_labels:
  retail_banking: Girokonto
  cards: Karte
  payments: Zahlungskonto
  lending_mortgage: Darlehen
  insurance: Versicherungsvertrag
  brokerage_investing: Depot

document_types:
- product_sheet
- fee_schedule
- rate_sheet
- faq
- how_to_guide
- troubleshooting
- comparison
- eligibility_matrix
- terms_conditions
- disclosure
- promo_notice
- security_advisory
- policy_procedure
- discoverable_tool_doc
- regulatory_note

# Per-institution-TYPE emphasis for the generated institution brief. Both the
# Sparkasse and the Bausparkasse are banks, so the bank entry covers each.
concept_guidance:
  bank: >-
    Für eine Sparkasse hervorheben: die öffentlich-rechtliche Trägerschaft und
    die regionale Verankerung mit Filialen und Geldautomaten, das Girokonto mit
    Kontoführungsentgelt und Sparkassen-Card (Debitkarte), den
    Dispositionskredit, seinen Zinssatz und das Beratungsangebot bei dauerhafter
    Inanspruchnahme, das Basiskonto und die Kontowechselhilfe nach dem
    Zahlungskontengesetz, das Pfändungsschutzkonto (kostenlose Umwandlung,
    Grundfreibetrag), das Sparkassenbuch mit Kündigungsfrist, die Kreditkarte,
    die Baufinanzierung (Sollzinsbindung, Sondertilgung, Kündigungsrecht nach
    zehn Jahren) und den Privatkredit (effektiver Jahreszins, repräsentatives
    Beispiel, Widerrufsrecht von 14 Tagen, Kreditwürdigkeitsprüfung mit
    Schufa-Auskunft). Eine Bausparkasse führt keine Girokonten und gibt keine
    Karten aus; für sie hervorheben: den
    Bausparvertrag (Bausparsumme, Abschlussgebühr, Regelsparbeitrag,
    Mindestsparguthaben, Bewertungszahl und eine Zuteilung ohne garantierten
    Termin, fester Darlehenszins schon bei Abschluss), die Wohnungsbauprämie und
    die Arbeitnehmer-Sparzulage für vermögenswirksame Leistungen mit ihren
    Einkommensgrenzen und dem Verbot der Doppelförderung, und das
    Bauspardarlehen mit jederzeit kostenfreien Sondertilgungen.
  neobank: >-
    Hervorheben: das Girokonto ohne Filialnetz, das ab einem monatlichen
    Geldeingang kostenlos ist, die Visa-Debitkarte, das Tagesgeldkonto mit
    befristetem Neukundenzins, Echtzeitüberweisungen mit Empfängerüberprüfung,
    die gesetzliche Einlagensicherung bis 100.000 Euro, die digitale
    Kontowechselhilfe und die Erledigung aller Anliegen in der App oder im Chat.
  brokerage: >-
    Hervorheben: das Wertpapierdepot ohne Depotgebühr mit festem Entgelt pro
    Order, ETF-Sparpläne schon mit kleinen Beträgen, die Verzinsung des
    Verrechnungskontos, das Kinderdepot, den Freistellungsauftrag mit dem
    Sparer-Pauschbetrag, die Abgeltungsteuer mit Solidaritätszuschlag und
    gegebenenfalls Kirchensteuer, die Vorabpauschale bei Fonds, den kostenlosen
    Depotübertrag, die Geeignetheits- und Angemessenheitsprüfung sowie die
    Kosteninformation nach MiFID II, die Verwahrung der Kundenwertpapiere als
    Sondervermögen und den Hinweis, dass Kursverluste möglich sind und keine
    Rendite garantiert wird.
  insurer: >-
    Hervorheben: die Privathaftpflicht (Deckungssumme, Selbstbeteiligung,
    mitversicherte Personen), die Hausratversicherung (Versicherungssumme je
    Quadratmeter, Unterversicherungsverzicht, Fahrraddiebstahl), die
    Kfz-Versicherung (gesetzliche Haftpflicht, Teil- und Vollkasko,
    Schadenfreiheitsklasse, Kündigung bis zum 30. November, Sonderkündigungsrecht
    nach Beitragserhöhung, eVB-Nummer für die Zulassung), die
    Berufsunfähigkeitsversicherung (Leistung ab 50 Prozent Berufsunfähigkeit,
    Gesundheitsfragen und vorvertragliche Anzeigepflicht) und die
    fondsgebundene Rentenversicherung (Beitragsfreistellung, Fondswechsel,
    Kosten, Bezugsrecht), die unverzügliche Schadenmeldung, das Widerrufsrecht
    von 14 Tagen, bei Lebens- und Rentenversicherungen 30 Tage, und den
    kostenlosen Versicherungsombudsmann; niemals eine Wertentwicklung
    garantieren oder individuelle Steuerberatung geben.

# Per-DOMAIN regulator context -> serialized into region_meta; the scorer's
# finance.regulatory_compliance rubric keys on the row's domain.
domain_regulators:
  retail_banking:
    regulators: [BaFin, Deutsche Bundesbank]
    regulator_text: >-
      Einlagenkreditinstitute werden von der BaFin und der Deutschen Bundesbank
      beaufsichtigt. Die gesetzliche Einlagensicherung schützt Guthaben bis
      100.000 Euro pro Kunde und Bank, für sechs Monate nach der Gutschrift bis
      500.000 Euro, wenn das Geld aus bestimmten Lebensereignissen stammt, etwa
      aus dem Verkauf einer selbst genutzten Wohnimmobilie, einer Abfindung oder
      bestimmten Versicherungsleistungen. Jeder Verbraucher mit rechtmäßigem
      Aufenthalt in der EU hat Anspruch auf ein Basiskonto, und die
      Kontowechselhilfe nach dem Zahlungskontengesetz überträgt Daueraufträge
      und Lastschriften auf das neue Konto. Eine SEPA-Lastschrift kann ohne
      Angabe von Gründen acht Wochen lang zurückgegeben werden, eine nicht
      autorisierte Zahlung 13 Monate lang. Bei dauerhafter und erheblicher
      Inanspruchnahme des Dispositionskredits muss die Bank eine Beratung über
      günstigere Alternativen anbieten. Ab dem 20. November 2026 besteht für
      eingeräumte Überziehungsmöglichkeiten ein Widerrufsrecht; einen
      unbefristeten Dispo kann die Bank nur mit einer Frist von mindestens zwei
      Monaten kündigen, und vor einer Zwangsvollstreckung muss sie anbieten,
      den in Anspruch genommenen Betrag ohne zusätzliche Kosten in zwölf
      gleichen Monatsraten zurückzuzahlen. Jedes Girokonto kann kostenlos in ein
      Pfändungsschutzkonto umgewandelt werden, nach einer Pfändung spätestens
      nach vier Geschäftstagen; der Grundfreibetrag wird jährlich zum 1. Juli
      angepasst. Der Kundenservice prüft die Identität, bevor er
      Kontoinformationen mitteilt oder ändert.
  cards:
    regulators: [BaFin, Deutsche Bundesbank]
    regulator_text: >-
      Für Debit- und Kreditkarten gelten die Vorschriften über Zahlungsdienste
      im BGB. Nach der Sperrung einer verlorenen oder gestohlenen Karte, etwa
      über den Sperr-Notruf 116 116, haftet der Kunde nicht mehr für spätere
      Verfügungen; vor der Sperrung ist seine Haftung auf 50 Euro begrenzt,
      außer bei grober Fahrlässigkeit. Online-Zahlungen erfordern eine starke
      Kundenauthentifizierung. Der Kundenservice darf Entgelte,
      Verfügungsrahmen und Erstattungsrechte nicht falsch darstellen.
  payments:
    regulators: [BaFin]
    regulator_text: >-
      Zahlungsdienste unterliegen dem Zahlungsdiensteaufsichtsgesetz und der
      Aufsicht der BaFin. Echtzeitüberweisungen in Euro dürfen nicht mehr kosten
      als Standardüberweisungen, und vor jeder Überweisung gleicht die Bank Name
      und IBAN des Empfängers ab (Empfängerüberprüfung). Eine SEPA-Lastschrift
      kann acht Wochen lang ohne Angabe von Gründen zurückgegeben werden. Der
      Kundenservice prüft die Identität, bevor er eine Zahlung auslöst oder
      Daten ändert.
  lending_mortgage:
    regulators: [BaFin]
    regulator_text: >-
      Verbraucherdarlehen regelt das BGB. Der effektive Jahreszins ist
      anzugeben, und Werbung mit Zinsangaben muss ein repräsentatives Beispiel
      enthalten. Bei einem Allgemein-Verbraucherdarlehen hat der Kunde ein
      Widerrufsrecht von 14 Tagen und kann jederzeit vorzeitig zurückzahlen; die
      Vorfälligkeitsentschädigung ist auf 1 Prozent des vorzeitig
      zurückgezahlten Betrags begrenzt, bei einer Restlaufzeit von höchstens
      einem Jahr auf 0,5 Prozent. Ein Kredit darf nur vergeben werden, wenn die
      Kreditwürdigkeitsprüfung ergibt, dass der Kunde ihn voraussichtlich
      zurückzahlen kann. Ab dem 20. November 2026 fallen auch Zahlungsaufschübe
      wie „Buy now, pay later“ und Kredite unter 200 Euro unter das
      Verbraucherkreditrecht. Ein Immobiliar-
      Verbraucherdarlehen mit Sollzinsbindung kann zehn Jahre nach der
      vollständigen Auszahlung mit einer Frist von sechs Monaten ohne
      Vorfälligkeitsentschädigung gekündigt werden. Bauspardarlehen haben einen
      festen Sollzins und lassen jederzeit kostenfreie Sondertilgungen zu. Der
      Kundenservice sagt nie eine Kreditzusage zu und verschweigt keine Kosten.
  insurance:
    regulators: [BaFin]
    regulator_text: >-
      Versicherungsunternehmen werden von der BaFin beaufsichtigt; die Verträge
      regelt das Versicherungsvertragsgesetz. Der Versicherungsnehmer kann
      innerhalb von 14 Tagen widerrufen, bei Lebens- und Rentenversicherungen
      innerhalb von 30 Tagen. Ein Schaden ist unverzüglich zu melden. Die
      Kfz-Haftpflichtversicherung ist gesetzlich vorgeschrieben; Kfz-Verträge
      mit Hauptfälligkeit zum 1. Januar können mit einer Kündigung, die bis zum
      30. November eingeht, zum Jahresende beendet werden, und nach einer
      Beitragserhöhung oder einem Schadenfall besteht ein Sonderkündigungsrecht.
      Lebens- und
      Rentenversicherer sind über den Sicherungsfonds Protektor abgesichert.
      Beschwerden können kostenlos beim Versicherungsombudsmann eingereicht
      werden. Der Kundenservice garantiert keine Wertentwicklung und gibt keine
      individuelle Steuerberatung.
  brokerage_investing:
    regulators: [BaFin]
    regulator_text: >-
      Wertpapierdienstleistungen beaufsichtigt die BaFin nach dem
      Wertpapierhandelsgesetz und MiFID II: Vor einer Empfehlung wird die
      Geeignetheit oder Angemessenheit geprüft, Kosten werden offengelegt, und
      es wird auf das Verlustrisiko hingewiesen. Die Wertpapiere der Kunden
      werden als Sondervermögen verwahrt und fallen bei einer Insolvenz des
      Instituts nicht in die Insolvenzmasse; die gesetzliche
      Anlegerentschädigung deckt zudem 90 Prozent der Forderungen aus
      Wertpapiergeschäften, höchstens 20.000 Euro. Kapitalerträge unterliegen
      der Abgeltungsteuer; mit einem Freistellungsauftrag bleiben sie bis zum
      Sparer-Pauschbetrag steuerfrei. Ein Depotübertrag ist kostenlos. Der
      Kundenservice garantiert keine Rendite und gibt keine individuelle
      Steuerberatung.

