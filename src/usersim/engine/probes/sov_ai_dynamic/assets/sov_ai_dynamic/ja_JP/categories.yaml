schema_version: v0.1
locale: ja_JP
taxonomy_id: ja_JP_sov_ai_dynamic
taxonomy_version: v0.5.1
placeholder: false
categories:
- id: japan-geography
  invitation: 日本の地理について、自分の言葉で何か聞きたいことを話してください。お住まいの都道府県のこと、通勤・通学の経路、地元の自然、最近行った場所など、身近な話題で構いません。
  subtopic_hints:
  - 国・都道府県・市町村のあいだの管轄の違い（河川、海岸、国立公園など）
  - 都・道・府・県の四種類の違いと「京都府」「北海道」が他と違う理由
  - 本土四島（本州・北海道・九州・四国）と南西諸島・伊豆諸島の位置づけ
  - 「関東」「東北」「九州」など総務省・気象庁の区分の使い分け
  - 地震・台風・豪雨で地域が変わった例（東日本大震災、能登半島地震、線状降水帯）
  - 紛らわしい行政用語（市・区・町・村、政令指定都市の区、特別区）
  - 沖縄・北方領土・竹島・尖閣など領土問題に関連する地理
  - 国土地理院の地図とGoogleマップで境界が違うときどうするか
- id: japan-history
  invitation: 日本の歴史について、自分の言葉で聞きたいことを話してください。家族の話、出身地に伝わる話、最近訪れた史跡など、具体的なきっかけがあれば。
  subtopic_hints:
  - 教科書ではあまり扱われない地方の歴史（東北、九州、沖縄、北海道アイヌ）
  - 戦争の記憶（太平洋戦争、東京・大阪・広島・長崎・沖縄、シベリア抑留）
  - 江戸時代の地方藩・参勤交代と現在の県境のずれ
  - 明治維新における自分の地域の役割（薩長土肥、戊辰戦争、廃藩置県）
  - 経済史の転換点（高度経済成長、バブル、平成不況、リーマン後）
  - 在日コリアン、華僑、被差別部落の歴史と現在の議論
  - アイヌ民族・琉球民族と日本史の枠組み
  - 家の言い伝えと自治体史・国立公文書館の記録が食い違うときどうするか
- id: japan-culture
  invitation: 日本文化について、自分の言葉で聞きたいことを話してください。地元の祭り、家族の慣習、世代差、外国の影響など、身近に感じることがあれば。
  subtopic_hints:
  - 地方料理の違い（出汁の関東・関西、九州の豚骨、東北の漬物、沖縄料理）
  - 方言と標準語、若者言葉、ネオ方言の関係
  - 仏教の宗派（浄土宗、浄土真宗、曹洞宗、日蓮宗）と地域差
  - 神道、神社、氏神、各地の祭礼（祇園祭、ねぶた、阿波踊り）
  - 結婚・葬儀・お盆・正月の地域差
  - サブカルチャー（アニメ、漫画、Vtuber、コミケ）と「クールジャパン」政策
  - 在日外国人コミュニティ（ブラジル人、ベトナム人、中国人、ネパール人）の影響
  - 世代間で「日本らしさ」の意味がずれてきていること
- id: japan-poetry-and-music
  invitation: 詩・歌詞・音楽について、自分の言葉で聞きたいことを話してください。子どものころ歌った歌、覚えかけの俳句、好きなバンドの歌詞など。
  subtopic_hints:
  - 俳句・短歌・川柳の違いと著名な歌人（芭蕉、与謝野晶子、石川啄木、寺山修司）
  - 童謡・唱歌の作詞作曲の出自（ゆりかごのうた、ふるさと、赤とんぼ）
  - 演歌の系譜と昭和歌謡（美空ひばり、北島三郎、坂本九）
  - J-POP の世代論（YMO、80年代アイドル、90年代ヒット、Jポップ→ボカロ→K-pop影響後）
  - 君が代の歌詞・由来・公的な扱いに関する議論
  - 校歌・社歌・自治体の歌の地域差
  - 作詞家の名前（阿久悠、松本隆、秋元康）と時代の対応
  - 子どものころに覚えた歌詞がネット上の表記と一致しないときどうするか
- id: japan-public-services
  invitation: 日本の公共サービスについて、自分の言葉で具体的な状況を話してください。役所の窓口・サイト・案内が食い違うようなケースが具体的にあれば。
  subtopic_hints:
  - マイナンバーカード — 申請、再発行、健康保険証一体化（マイナ保険証）
  - 住民票・印鑑登録・戸籍と引っ越しの転出・転入届
  - 国民年金・厚生年金の切り替え（学生、フリーランス、転職時）
  - 国民健康保険と社会保険の切り替え、扶養に入る基準
  - 児童手当・児童扶養手当・就学援助の所得制限
  - 失業給付（雇用保険）の手続きと給付制限期間
  - 介護保険の認定・要介護度・地域包括支援センター
  - 国の制度と自治体独自の制度がぶつかるとき、どちらが優先か
- id: japan-health-systems
  invitation: 日本の医療について、自分の言葉で聞きたいことを話してください。保険、かかりつけ医、紹介状、薬代、入院費など具体的に。
  subtopic_hints:
  - 国民健康保険と社会保険、後期高齢者医療制度の違い
  - 高額療養費制度と限度額適用認定証の使い方
  - 紹介状の有無による「選定療養費」と大病院の受診ルール
  - ジェネリック医薬品の選択と先発医薬品との違い
  - こころの健康（精神科・心療内科）の受診と「よりそいホットライン」「いのちの電話」
  - 救急車の呼び方、＃7119、夜間休日診療
  - 出産育児一時金、自治体の妊婦健診助成、乳幼児医療費
  - 健保組合の判断と自治体の窓口の判断が違うときどうするか
- id: japan-education
  invitation: 日本の教育について、自分の言葉で聞きたいことを話してください。学校選び、入試、進路、奨学金などの具体的な状況で。
  subtopic_hints:
  - 公立・私立・国立の違いと中学受験、高校受験、大学受験
  - 共通テスト（旧センター試験）の科目構成と二次試験の関係
  - 推薦入試、総合型選抜（旧AO）、一般選抜の選び分け
  - 高校無償化、私立高校授業料軽減、新しい就学支援金制度
  - 日本学生支援機構（JASSO）の貸与型・給付型奨学金と返済猶予
  - 専門学校・高等専門学校（高専）・短大の進路上の位置づけ
  - 海外大学への進学と日本の高校の評定平均、IB・SAT の扱い
  - 学校の方針と県教委・文科省の通達が食い違うときどうするか
- id: japan-labor-and-benefits
  invitation: 仕事・労働・社会保障について、自分の言葉で聞きたいことを話してください。正社員・契約社員・パート・派遣・フリーランスのいずれでも、具体的な状況を。
  subtopic_hints:
  - 正社員・契約社員・派遣・パート・業務委託 — 社会保険と退職金の扱いの違い
  - 36協定、残業時間の上限規制、固定残業代（みなし残業）
  - 年次有給休暇の付与・取得・買取禁止のルール
  - 育児休業・介護休業・産前産後休業と給付金
  - 退職時の手続き — 離職票、源泉徴収票、健康保険の切り替え
  - 副業・兼業の社会保険・雇用保険の扱い
  - 労災（労働災害）と通勤災害の認定、第三者行為災害
  - 就業規則と労働契約・労働条件通知書が食い違うときどうするか
- id: japan-finance-and-consumer
  invitation: お金・銀行・税金・消費者トラブルについて、自分の言葉で聞きたいことを話してください。具体的な事例で。
  subtopic_hints:
  - 確定申告 — 給与所得者でも必要なケース、ふるさと納税のワンストップ特例
  - NISA（つみたて・成長投資枠）と iDeCo の使い分け
  - 普通預金・定期預金・財形貯蓄の選び方、ペイオフ（1000万円）
  - クレジットカードのチャージバックと不正利用の対応（割賦販売法、資金決済法）
  - 消費者契約法、特商法に基づくクーリング・オフの適用範囲
  - サブスクの解約トラブル、定期購入契約の落とし穴
  - 国民生活センター・消費生活センターと裁判（少額訴訟）の使い分け
  - 銀行アプリと通帳と税務署の通知の数字が合わないときどうするか
- id: japan-digital-services
  invitation: デジタルサービス・オンライン手続きについて、自分の言葉で聞きたいことを話してください。マイナポータル、ID、スマホ手続き、詐欺など具体的に。
  subtopic_hints:
  - マイナポータルの活用とエラー時の連絡先（コンビニ交付の不具合、e-Tax連携）
  - スマホ向け詐欺SMS（佐川・ヤマト・国税庁・銀行を装うもの）
  - キャリアメールから Gmail などへの移行と古いアカウント復旧
  - 二段階認証、パスキー、認証アプリ、FIDO2 の選び分け
  - SIMスワップ詐欺の兆候とキャリアでの本人確認強化
  - 個人情報保護法（改正後）と「開示請求」「利用停止請求」の手続き
  - フリマアプリ・ECのトラブル（メルカリ、ヤフオク、Amazon）
  - サービス側のFAQと実際の窓口の説明が違うときどうするか
