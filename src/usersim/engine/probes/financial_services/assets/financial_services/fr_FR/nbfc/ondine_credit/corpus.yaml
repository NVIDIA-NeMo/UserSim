- id: dfd54847-6367-5df9-85f4-a9b2f87e85e3
  title: Paiement en 3 ou 4 fois Ondine — offre en cours
  body: 'Bénéficiez d''une offre exceptionnelle sur vos achats de fin d''année avec
    Ondine Crédit !


    Du 1er novembre 2024 au 31 décembre 2024, nous réduisons les frais de service
    pour vos paiements fractionnés. Pour tout achat compris entre 100 € et 3 000 €,
    le taux habituel de 2,2 % est remplacé par un taux promotionnel de 1,5 %.


    Conditions de l''offre :

    - Période de validité : du 01/11/2024 au 31/12/2024.

    - Montant de l''achat : minimum 100 € et maximum 3 000 €.

    - Application : L''offre s''applique automatiquement lors de la sélection du paiement
    en 3 ou 4 fois.


    C''est l''occasion idéale d''équiper votre foyer tout en préservant votre trésorerie.
    Après le 31 décembre 2024, le taux standard de 2,2 % sera rétabli. Pour toute
    question sur vos frais actuels, vous pouvez consulter le document Paiement en
    3 ou 4 fois Ondine — frais du paiement en plusieurs fois : explications.'
