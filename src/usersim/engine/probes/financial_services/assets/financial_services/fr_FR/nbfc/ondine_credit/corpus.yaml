- id: b449c625-18c3-5787-b020-5c9b6f66aa00
  title: Paiement en 3 ou 4 fois Ondine — face à un produit similaire de l'établissement
  body: 'Le Paiement en 3 ou 4 fois Ondine se distingue du Crédit renouvelable Ondine
    principalement par sa finalité et sa structure.


    Le Paiement en 3 ou 4 fois Ondine est une solution ponctuelle liée à un achat
    spécifique entre 100 € et 3 000 €, avec un coût fixe de 2,2 %. C''est le choix
    idéal pour une gestion agile d''un achat précis sans ouvrir de ligne de crédit
    permanente.


    À l''inverse, le Crédit renouvelable Ondine offre une réserve de fonds disponible
    et réutilisable, adaptée aux besoins imprévus ou aux montants plus importants.
    Alors que le paiement fractionné est fermé dès le remboursement de l''achat, le
    crédit renouvelable reste ouvert.


    Choisissez le Paiement en 3 ou 4 fois Ondine pour : la rapidité, la transparence
    d''un coût unique de 2,2 % et des achats de consommation courante.


    Choisissez le Crédit renouvelable Ondine pour : la flexibilité d''une réserve
    disponible et des besoins financiers plus globaux.


    Pour plus de détails sur l''alternative, consultez le document Crédit renouvelable
    Ondine — présentation.'
  domain: payments
  product_category: paiement_fractionne
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 97172f68-3c46-5562-ac72-9eb735b7c6c9
  title: Paiement en 3 ou 4 fois Ondine — informations réglementaires
  body: 'Le Paiement en 3 ou 4 fois Ondine est un crédit à la consommation régi par
    les lois en vigueur et opéré sous la surveillance de l''ACPR et de la Banque de
    France. Ondine Crédit s''engage à ce que le coût total du crédit reste transparent
    et justifié.


    Conformément à la réglementation, tout emprunteur dispose d''un droit de rétractation
    de 14 jours à compter de la signature du contrat. Pendant ce délai, vous pouvez
    annuler votre engagement sans pénalité.


    Le coût du service est fixé à un taux de 2,2 %, appliqué au montant total de l''achat.
    Nous garantissons que ce coût, intégré dans le TAEG, demeure systématiquement
    inférieur au taux d''usure légal.


    Nous appliquons une politique stricte de vérification de la solvabilité. Si vous
    rencontrez des difficultés de remboursement durables, Ondine Crédit s''engage
    à vous orienter vers la commission de surendettement afin de protéger votre situation
    financière.


    L''octroi du crédit est soumis à l''acceptation finale après vérification d''identité
    rigoureuse et authentification forte. Ondine Crédit ne promet jamais l''octroi
    d''un crédit avant l''analyse complète du dossier.


    ***

    MENTION LÉGALE OBLIGATOIRE : Un crédit vous engage et doit être remboursé. Veillez
    à choisir un montant et une durée de remboursement adaptés à vos capacités financières.

    ***


    L''assistance pour les litiges relatifs à ce produit est traitée avec diligence,
    notamment pour les prélèvements SEPA contestables sous huit semaines.'
  domain: payments
  product_category: paiement_fractionne
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 2d8586da-41b5-51db-924c-9743cdfd93d9
  title: Paiement en 3 ou 4 fois Ondine — grille des taux
  body: 'La structure tarifaire du Paiement en 3 ou 4 fois Ondine est conçue pour
    être simple et prévisible. Contrairement aux crédits classiques dont les taux
    peuvent varier selon le profil ou la durée, ce produit applique un taux unique.


    Taux applicable : 2,2 %


    Ce taux de 2,2 % s''applique uniformément à toutes les transactions éligibles,
    quel que soit le montant de l''achat (dans la limite de 100 € à 3 000 €) et quelle
    que soit la durée choisie (3 ou 4 mensualités).


    Ce taux est crédité lors de la mise en place du fractionnement et couvre l''ensemble
    des frais de dossier et de gestion du risque. Il n''existe aucun palier de taux
    ni de dégressivité : le coût reste constant pour garantir une équité totale entre
    nos clients et une transparence absolue des coûts.'
