- id: 81bd21d4-2963-5ba0-834a-4c1732816c14
  title: Crédit auto Ondine — face à un produit similaire de l'établissement
  body: 'Il est important de choisir le financement adapté à votre besoin. Voici la
    comparaison entre le Crédit auto Ondine et le Prêt personnel Ondine.


    Le Crédit auto Ondine est un financement affecté, spécifiquement conçu pour l''achat
    d''un véhicule. Il offre une structure optimisée pour cet usage, avec un exemple
    représentatif affichant un TAEG de 4,9 % pour un montant de 20 000 € sur 60 mois
    (coût total : 2 531,80 €).


    Le Prêt personnel Ondine, quant à lui, est une solution polyvalente. Il ne nécessite
    pas de justificatif d''achat spécifique et offre une liberté totale d''utilisation
    des fonds.


    Quel produit choisir ?

    - Choisissez le Crédit auto Ondine si vous souhaitez un financement dédié à un
    véhicule, bénéficiant souvent de conditions optimisées pour ce type d''actif.

    - Choisissez le Prêt personnel Ondine si votre projet est multiple ou si vous
    ne souhaitez pas affecter le crédit à un bien précis.


    Pour plus de détails sur l''alternative polyvalente, consultez Prêt personnel
    Ondine — présentation.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ed429d83-7562-50c6-9806-66d687d7d726
  title: Crédit auto Ondine — informations réglementaires
  body: 'Le Crédit auto Ondine est distribué par Ondine Crédit, établissement opérant
    sous la supervision rigoureuse de l''ACPR et de la Banque de France. Cette supervision
    garantit que nos pratiques sont conformes aux normes bancaires et de protection
    des consommateurs.


    Engagement sur les taux :

    Nous nous engageons à ce que le Taux Annuel Effectif Global (TAEG) soit systématiquement
    inférieur au taux d''usure légal en vigueur. À titre d''exemple, notre TAEG représentatif
    est de 4,9 %.


    Droits de l''emprunteur :

    - Droit de rétractation : Conformément à la loi, vous disposez d''un délai de
    14 jours calendaires pour rétracter votre engagement sans avoir à justifier de
    motif et sans frais.

    - Remboursement anticipé : Vous avez la possibilité de rembourser tout ou partie
    de votre crédit avant son terme. Les frais de remboursement anticipé sont strictement
    plafonnés selon les dispositions légales.


    Obligations de vérification :

    L''octroi du crédit est conditionné par une vérification stricte de la solvabilité
    de l''emprunteur. Ondine Crédit s''interdit de promettre l''octroi d''un crédit
    avant l''analyse complète du dossier.


    Prévention du surendettement :

    Conformément à notre posture éthique, Ondine Crédit oriente systématiquement tout
    client rencontrant des difficultés de remboursement durables vers la commission
    de surendettement compétente.


    L''authentification forte est exigée pour toute opération modifiant l''état du
    compte ou tout déblocage de fonds, garantissant ainsi la sécurité de vos données
    personnelles et de vos transactions financières.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: bbb22bf3-7891-5b49-b837-d5009e755e5d
  title: Crédit auto Ondine — grille des taux
  body: 'La grille des taux du Crédit auto Ondine est conçue pour offrir une visibilité
    immédiate sur le coût de votre financement.


    Le taux de référence utilisé pour nos simulations est le suivant :

    - TAEG représentatif : 4,9 %


    Ce taux s''applique à l''exemple suivant : un montant emprunté de 20 000 € remboursé
    sur une durée de 60 mois, avec des mensualités de 375,53 €.


    Conditions d''application :

    - Le taux peut varier selon le montant emprunté (minimum 3 000 €) et la durée
    choisie (maximum 84 mois).

    - Le taux définitif est fixé lors de l''émission de l''offre de prêt, après analyse
    de votre profil de risque et de votre solvabilité.

    - Le taux est fixe pour toute la durée du contrat, garantissant la stabilité de
    vos mensualités.


    Nous rappelons que le TAEG inclut l''ensemble des frais obligatoires, assurant
    ainsi une transparence totale sur le coût total du crédit, qui s''élève à 2 531,80
    € dans l''exemple cité.'
  domain: lending_mortgage
