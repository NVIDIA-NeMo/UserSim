- id: d3537cae-f620-53df-8b36-c2124f5b374f
  title: Prêt personnel Ondine — face à une offre concurrente type
  body: 'Lorsqu''un client compare le Prêt personnel Ondine à une offre concurrente
    classique, la différence se situe principalement sur la transparence et la structure
    des coûts.


    Dimensions de comparaison :

    - Coût total : Là où certains concurrents utilisent des frais de dossier opaques,
    Ondine Crédit affiche un coût total clair. Pour un exemple de 10 000 € sur 48
    mois, le coût total du crédit est précisément de 1 217,12 €.

    - Taux : Notre TAEG représentatif est de 5,9 %, un taux stable et toujours inférieur
    au taux d''usure, contrairement à certaines offres promotionnelles « d''appel
    » qui augmentent après quelques mois.

    - Flexibilité : Nous appliquons un plafonnement strict des frais de remboursement
    anticipé à 1 %, là où d''autres établissements peuvent appliquer des frais plus
    élevés ou moins transparents.


    Verdict :

    L''offre concurrente peut être intéressante pour des montants très faibles et
    des durées très courtes si elle propose un taux promotionnel temporaire. Cependant,
    le Prêt personnel Ondine est le choix supérieur pour ceux qui recherchent une
    stabilité financière, une rigueur réglementaire exemplaire et une absence totale
    de frais cachés sur le long terme.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 738c67b3-6e55-50f0-82e2-d60d79acfdd3
  title: Prêt personnel Ondine — informations sur les risques
  body: 'L''octroi d''un crédit est un acte sérieux qui engage votre responsabilité
    financière. Conformément à la réglementation, nous vous rappelons qu''un crédit
    vous engage et doit être remboursé. Si vous n''êtes pas en mesure de rembourser,
    vous pourriez perdre vos biens.


    Le risque principal associé au Prêt personnel Ondine est le risque d''endettement
    excessif. Pour limiter ce risque, Ondine Crédit effectue systématiquement une
    vérification rigoureuse de votre solvabilité. Nous nous engageons à ne jamais
    minimiser le coût total du crédit ni à promettre l''octroi d''un financement avant
    l''analyse de votre dossier.


    À titre d''illustration, pour un emprunt de 10 000 € sur une durée de 48 mois
    avec un TAEG de 5,9 %, le coût total du crédit s''élève à 1 217,12 €, avec des
    mensualités de 233,69 €. Ce montant représente la charge financière réelle que
    vous devrez supporter en plus du capital emprunté.


    Si vous rencontrez des difficultés financières durables, nous vous encourageons
    vivement à ne pas attendre l''accumulation des impayés. Ondine Crédit a pour politique
    d''orienter systématiquement les clients en situation de fragilité vers la commission
    de surendettement pour bénéficier d''un accompagnement légal et protecteur.


    Nous vous rappelons que vous disposez d''un délai de rétractation de 14 jours
    pour annuler votre contrat sans pénalité après sa signature. Pour plus d''informations
    réglementaires, veuillez consulter le document Prêt personnel Ondine — informations
    réglementaires.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b7452b05-3961-5846-a80f-11a219e68649
  title: Prêt personnel Ondine — calcul et application des taux
  body: 'Le Prêt personnel Ondine applique une politique de taux transparente et rigoureusement
    encadrée par la législation française.


    Le Taux Annuel Effectif Global (TAEG) représentatif est de 5,9 %. Ce taux inclut
    l''ensemble des frais liés au crédit, permettant ainsi une comparaison honnête
    avec d''autres offres. Nous garantissons que ce taux est toujours maintenu en
    dessous du taux d''usure fixé par la Banque de France.


    Application du taux :

    - Le taux est fixe pour toute la durée du contrat, assurant ainsi la stabilité
    de vos mensualités (par exemple, 233,69 € pour un prêt de 10 000 € sur 48 mois).

    - Le calcul des intérêts est effectué sur le capital restant dû.


    Ce taux peut varier lors de la souscription en fonction du profil de risque de
    l''emprunteur, après analyse de sa solvabilité, mais il ne sera jamais supérieur
    au plafond légal. Pour comprendre la décomposition du coût total, vous pouvez
    consulter le document Prêt personnel Ondine — grille des taux.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 268ae1d9-6d72-504a-97fc-4b3fb8f38b0d
  title: Prêt personnel Ondine — offre de parrainage et de fidélité
  body: 'Ondine Crédit valorise la confiance que vous nous accordez. Dans le cadre
    de notre programme de fidélité et de parrainage, nous vous invitons à partager
    notre vision d''un financement responsable avec vos proches.


    Pour toute nouvelle souscription initiée via un parrainage entre le 1er et le
    31 octobre 2023, le nouveau client peut bénéficier de notre Solution de financement
    polyvalente et stable pour tout projet personnel. À titre d''exemple, pour un
    montant de 10 000 € sur 48 mois, nous proposons un TAEG de 5,9 %, avec des mensualités
    de 233,69 € et un coût total du crédit de 1 217,12 €.


    Nous nous engageons à maintenir une transparence absolue sur nos coûts. Le parrain
    et le filleul bénéficient d''un accompagnement pédagogique pour optimiser la gestion
    de leur budget. Nous vous rappelons que l''octroi d''un crédit est soumis à une
    vérification rigoureuse de la solvabilité et n''est jamais garanti d''avance.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ef5c2766-1dbc-5410-ac28-4c0b1404911b
  title: Prêt personnel Ondine — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos fonds et de vos données personnelles est notre priorité
    absolue. Pour protéger votre Prêt personnel Ondine et l''accès à vos informations
    financières, nous vous demandons de suivre rigoureusement ces consignes de sécurité.


    L''authentification forte est systématiquement exigée pour sécuriser vos transactions.
    Ne partagez jamais vos codes d''accès, vos mots de passe ou les codes de validation
    reçus par SMS avec qui que ce soit, même si la personne prétend travailler pour
    Ondine Crédit. Nos conseillers ne vous demanderont jamais vos secrets de sécurité
    par téléphone ou par email.


    Soyez vigilants face aux tentatives de phishing : nous ne vous demanderons jamais
    de cliquer sur un lien pour « débloquer » vos fonds ou pour « confirmer » votre
    identité en urgence. Toute modification de l''état de votre compte ou tout déblocage
    de fonds nécessite une vérification d''identité rigoureuse et préalable, conformément
    à nos protocoles internes.


    En cas de doute sur la légitimité d''une communication ou si vous constatez une
    activité inhabituelle sur votre compte, informez-nous immédiatement. Une réaction
    rapide est essentielle pour permettre le signalement des fraudes aux autorités
    compétentes et la protection active de vos avoirs.


    Enfin, nous vous recommandons de consulter régulièrement vos relevés pour identifier
    toute anomalie. Si vous suspectez une fraude, nous traiterons votre contestation
    avec diligence, notamment pour les prélèvements SEPA contestables sous huit semaines.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 759ec1a5-d657-5117-a166-b02677af42fe
  title: Prêt personnel Ondine — modification des conditions
  body: "Le présent document précise les modalités de modification des conditions\
    \ applicables au Prêt personnel Ondine. Ondine Crédit s'engage à garantir une\
    \ clarté absolue des coûts et une rigueur réglementaire exemplaire tout au long\
    \ de votre contrat.\n\nModification des taux et frais : Ondine Crédit se réserve\
    \ le droit de modifier ses conditions tarifaires pour refléter l'évolution des\
    \ coûts opérationnels et la gestion du risque. Nous nous engageons toutefois à\
    \ ce que le TAEG reste systématiquement inférieur au taux d'usure fixé par les\
    \ autorités.\n\nInformation et acceptation : Toute modification substantielle\
    \ des conditions vous sera notifiée par écrit. Vous disposez d'un délai de prévenance\
    \ avant l'entrée en vigueur des nouvelles conditions. En cas de refus de ces modifications,\
    \ vous pouvez demander la résiliation du contrat.\n\nDroits de l'emprunteur :\
    \ \n1. Droit de rétractation : Conformément à la loi, vous bénéficiez d'un délai\
    \ de rétractation de 14 jours après la signature du contrat pour annuler votre\
    \ engagement sans pénalité.\n2. Remboursement anticipé : Vous avez la possibilité\
    \ de rembourser tout ou partie de votre crédit avant l'échéance. Les frais de\
    \ remboursement anticipé sont strictement plafonnés à 1 %, conformément à la réglementation\
    \ en vigueur, afin de garantir votre flexibilité.\n\nRégulation : Nos activités\
    \ sont opérées sous la supervision de l'ACPR et de la Banque de France. En cas\
    \ de difficultés de remboursement durables, nous nous engageons à vous orienter\
    \ vers la commission de surendettement pour vous accompagner dans la recherche\
    \ d'une solution viable."
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f31f6648-50b3-5fc3-82bc-8c91da45ad3c
  title: Prêt personnel Ondine — prise en main pas à pas
  body: 'Ce guide est destiné aux agents d''assistance pour accompagner les clients
    dans la souscription et l''activation de leur Prêt personnel Ondine.


    Étape 1 : Simulation et définition du besoin

    Aidez le client à définir le montant souhaité. Le montant minimum du prêt est
    de 1 000 € et le montant maximum est de 75 000 €. Présentez l''exemple représentatif
    pour illustrer le coût : pour un emprunt de 10 000 € sur 48 mois avec un TAEG
    de 5,9 %, la mensualité s''élève à 233,69 € et le coût total du crédit est de
    1 217,12 €.


    Étape 2 : Vérification de la solvabilité

    Informez le client que nous appliquons strictement la vérification de la solvabilité.
    L''agent doit s''assurer que tous les documents justificatifs sont transmis pour
    l''analyse du risque. Rappelez au client que nous ne promettons jamais l''octroi
    d''un crédit avant l''étude complète du dossier.


    Étape 3 : Vérification d''identité et sécurité

    Avant tout déblocage de fonds ou signature, une vérification d''identité rigoureuse
    est impérative. Guidez le client vers le processus d''authentification forte requis
    pour sécuriser les données personnelles et les transactions.


    Étape 4 : Contractualisation et rétractation

    Une fois le crédit approuvé, le contrat est signé électroniquement. Précisez clairement
    au client qu''il dispose d''un délai de rétractation de 14 jours pour annuler
    son contrat sans frais.


    Étape 5 : Mise à disposition des fonds

    Après validation finale et vérification d''identité, les fonds sont débloqués
    sur le compte indiqué. Confirmez au client le montant exact et la date du premier
    prélèvement.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 58d20e16-c97d-5f4d-9f8f-7ce18b056d2a
  title: 'Prêt personnel Ondine — durée de l''exemple représentatif (mois) : explications'
  body: 'Question : Pourquoi l''exemple représentatif du Prêt personnel Ondine est-il
    basé sur une durée de 48 mois ?


    Réponse : La durée de 48 mois est utilisée dans notre exemple pour vous offrir
    une vision équilibrée entre le montant des mensualités et le coût total du crédit.
    Elle permet d''illustrer concrètement l''impact du taux sur une période standard
    de financement personnel.


    Pour un montant de 10 000 €, une durée de 48 mois génère une mensualité de 233,69
    € avec un TAEG de 5,9 %. Cela aboutit à un coût total du crédit de 1 217,12 €.
    En modifiant cette durée, vous pouvez réduire vos mensualités (en allongeant la
    durée) ou diminuer le coût total du crédit (en raccourcissant la durée). Nous
    vous invitons à consulter la page Prêt personnel Ondine — présentation pour plus
    de détails sur la flexibilité de nos solutions.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 03314aaa-f7f1-5954-bc72-24461bf3b431
  title: Prêt personnel Ondine — effectuer une modification
  body: 'Vous souhaitez modifier un élément de votre contrat de Prêt personnel Ondine
    (par exemple, vos coordonnées de contact ou vos informations de prélèvement).
    Voici la marche à suivre pour effectuer cette modification en toute sécurité.


    1. Formulez votre demande : Indiquez-nous précisément l''élément que vous souhaitez
    modifier (adresse postale, téléphone, email ou mandat de prélèvement).

    2. Vérification d''identité : Pour protéger vos fonds et vos données, nous procéderons
    à une vérification d''identité rigoureuse. Vous devrez passer par notre processus
    d''authentification forte pour confirmer que vous êtes bien le titulaire du compte.

    3. Transmission des justificatifs : Si la modification concerne un changement
    de domiciliation bancaire ou d''identité, nous vous demanderons de nous fournir
    les documents officiels actualisés.

    4. Validation et confirmation : Une fois vos informations vérifiées et validées
    par notre équipe, nous vous confirmerons la prise en compte de la modification
    par un message sécurisé.


    Sachez que toute modification impactant le calendrier de remboursement ou le montant
    des mensualités peut nécessiter l''établissement d''un avenant au contrat. Pour
    toute question sur les frais liés à la gestion de votre compte, vous pouvez consulter
    le document Prêt personnel Ondine — grille tarifaire.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8d264c22-0213-5eb6-b3bc-1f6099186b39
  title: Prêt personnel Ondine — problèmes d'accès ou de connexion
  body: 'Symptôme : Vous ne parvenez pas à accéder à votre espace client pour consulter
    le suivi de votre Prêt personnel Ondine ou effectuer une opération.


    Causes probables :

    - Échec de l''authentification forte (problème de réception du code SMS ou erreur
    de mot de passe).

    - Identifiants obsolètes suite à une mise à jour de sécurité.

    - Session expirée pour des raisons de protection des données.


    Actions à entreprendre :

    1. Vérifiez vos identifiants : Assurez-vous que vos informations de connexion
    sont correctes et que vous utilisez le dernier mot de passe enregistré.

    2. Testez l''authentification forte : Si vous ne recevez pas le code de validation,
    vérifiez que votre appareil mobile capte le réseau et que le numéro de téléphone
    associé à votre compte est bien le bon.

    3. Réinitialisez vos accès : Si le problème persiste, demandez-nous de réinitialiser
    vos accès. Cette opération déclenchera une nouvelle vérification d''identité rigoureuse
    pour garantir la sécurité de votre compte.


    Quand escalader :

    Si malgré ces vérifications vous ne pouvez toujours pas vous connecter, nous escaladerons
    votre demande vers un gestionnaire de compte. Ce dernier analysera l''état technique
    de votre profil et vous contactera pour résoudre le blocage. Vous recevrez une
    confirmation de la résolution du problème par notification sécurisée dès que l''accès
    sera rétabli.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: c7e2bbf3-443e-542d-b488-2e61c9573d76
  title: Prêt personnel Ondine — niveaux d'accès
  body: 'Ce tableau définit les niveaux d''accès accordés aux utilisateurs et clients
    selon la validation de leurs conditions de sécurité et d''éligibilité.


    | Condition validée | Niveau d''accès | Opérations autorisées |

    | :--- | :--- | :--- |

    | Identité non vérifiée | Accès Limité | Simulation de prêt, consultation des
    tarifs généraux. |

    | Identité vérifiée + Solvabilité analysée | Accès Standard | Signature du contrat,
    demande de déblocage de fonds (max 75 000 €). |

    | Authentification forte active | Accès Complet | Modification des données personnelles,
    demande de remboursement anticipé, consultation des relevés. |

    | Dossier en anomalie / Litige | Accès Restreint | Consultation seule ; modification
    bloquée jusqu''à résolution par le responsable de la conformité. |


    L''accès complet est impératif pour toute opération modifiant l''état du compte,
    conformément à notre politique de sécurité.'
