  institution_id: ondine_credit
- id: 6638ba70-cd22-5e38-be83-f20685a390bc
  title: Crédit renouvelable Ondine — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos fonds et de vos données est notre priorité absolue. Le
    Crédit renouvelable Ondine, par sa nature flexible, nécessite une vigilance accrue
    pour éviter toute utilisation non autorisée de votre réserve de crédit pouvant
    aller jusqu''à 3 000 €.


    Voici les règles d''or pour protéger votre compte :


    1. L''authentification forte : Elle est systématiquement exigée pour toute transaction
    ou modification de vos données personnelles. Ne partagez jamais vos codes secrets,
    vos mots de passe ou vos clés de sécurité avec un tiers, même si celui-ci prétend
    travailler pour Ondine Crédit.


    2. Vigilance face au phishing : Soyez attentifs aux emails ou SMS suspects vous
    demandant de cliquer sur un lien pour « débloquer » vos fonds ou « mettre à jour
    » votre dossier de solvabilité. Ondine Crédit ne vous demandera jamais vos identifiants
    de connexion par email.


    3. Surveillance des mouvements : Nous vous recommandons de consulter régulièrement
    vos relevés pour détecter tout prélèvement inhabituel. En cas de doute, signalez-nous
    immédiatement l''opération.


    Ce que nous ne vous demanderons jamais :

    - Votre code secret de paiement.

    - Un transfert de fonds vers un compte tiers pour « valider » votre identité.

    - L''installation d''un logiciel de prise de contrôle à distance sur votre ordinateur.


    En cas de suspicion de fraude ou de perte de vos identifiants, contactez-nous
    sans délai. Nous adopterons une posture de protection active pour sécuriser vos
    fonds et, si nécessaire, nous signalons les faits aux autorités compétentes. Pour
    plus de détails sur la prévention, vous pouvez consulter le document Crédit renouvelable
    Ondine — protection contre la fraude et les opérations non autorisées.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 7d253134-d000-50c1-8db5-9053a342130d
  title: Crédit renouvelable Ondine — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    contractuelles applicables au Crédit renouvelable Ondine. Conformément à notre
    engagement de transparence, toute modification est soumise à un cadre réglementaire
    strict.


    Modification des tarifs et taux : Ondine Crédit se réserve le droit de modifier
    le taux annuel effectif global (TAEG), actuellement fixé à 19,9 % pour l''exemple
    représentatif, en fonction de l''évolution des conditions de marché ou des directives
    de l''ACPR et de la Banque de France. Toute modification du TAEG vous sera notifiée
    par écrit avec un préavis minimum de 30 jours.


    Évolution de la réserve de crédit : Votre plafond de crédit, dont le maximum est
    de 3 000 €, peut être revu à la hausse ou à la baisse. Une révision à la baisse
    peut intervenir suite à une analyse périodique de votre solvabilité ou en cas
    de dégradation de votre situation financière. À l''inverse, une augmentation de
    votre réserve nécessite une nouvelle vérification de votre capacité de remboursement.


    Durée de remboursement : Bien que la durée maximale de remboursement soit de 36
    mois, Ondine Crédit peut vous proposer des ajustements de calendrier pour garantir
    la viabilité de votre crédit.


    Droit de rétractation : Nous vous rappelons que vous disposez d''un délai de rétractation
    de 14 jours après la signature du contrat pour annuler votre engagement sans pénalité.


    En cas de désaccord avec les nouvelles conditions notifiées, vous disposez de
    la possibilité de résilier votre contrat conformément aux modalités décrites dans
    le document Crédit renouvelable Ondine — résilier, clôturer ou changer de formule.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: af4f1be8-9d6c-5a30-b9fe-6f8a168d689b
  title: Crédit renouvelable Ondine — prise en main pas à pas
  body: 'Ce guide est destiné aux agents d''assistance pour accompagner le client
    dans l''activation et l''utilisation du Crédit renouvelable Ondine. Ce produit
    offre une réserve de crédit flexible, idéale pour répondre à des besoins ponctuels.


    Étape 1 : Vérification de la solvabilité

    Avant tout déblocage de fonds, l''agent doit s''assurer que la vérification d''identité
    rigoureuse a été effectuée. Le client doit fournir les justificatifs requis. Le
    système analyse alors la solvabilité pour déterminer le plafond de crédit accordé,
    dans la limite maximale de 3 000 €.


    Étape 2 : Signature et contractualisation

    Présentez au client les conditions tarifaires. Il est impératif de mentionner
    l''exemple représentatif : pour un montant de 1 000 € utilisé sur 12 mois, le
    TAEG est de 19,9 %, avec des mensualités de 91,82 € et un coût total du crédit
    de 101,84 €. Rappelez le droit de rétractation de 14 jours.


    Étape 3 : Activation de la réserve

    Une fois le contrat signé, la réserve de crédit est disponible. Le client peut
    utiliser tout ou partie du montant alloué. Expliquez-lui que les fonds non utilisés
    ne génèrent aucun intérêt.


    Étape 4 : Modalités de remboursement

    Le client peut rembourser son crédit via des mensualités. La durée maximale de
    remboursement est fixée à 36 mois. Informez le client que tout remboursement anticipé
    est possible et que les frais associés sont strictement plafonnés conformément
    à la loi.


    Étape 5 : Suivi du compte

    L''agent doit orienter le client vers l''authentification forte pour consulter
    son solde disponible et l''historique de ses utilisations.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f3e78daa-c061-51a7-9b5c-d6e1f664047c
  title: 'Crédit renouvelable Ondine — durée de l''exemple représentatif (mois) :
    explications'
  body: "Question : Pourquoi l'exemple représentatif mentionne-t-il une durée de 12\
    \ mois alors que je peux rembourser sur plus longtemps ?\n\nRéponse : La durée\
    \ de 12 mois utilisée dans notre exemple représentatif est une norme pédagogique\
    \ permettant de visualiser clairement le coût d'un crédit sur une année complète.\
    \ Pour un montant de 1 000 €, cela aboutit à des mensualités de 91,82 € et un\
    \ coût total de 101,84 € avec un TAEG de 19,9 %. \n\nCependant, cette durée n'est\
    \ pas une limite : le Crédit renouvelable Ondine offre une grande flexibilité.\
    \ Vous pouvez adapter vos remboursements selon vos capacités, sachant que la durée\
    \ maximale de remboursement autorisée pour ce produit est de 36 mois. Plus la\
    \ durée de remboursement est longue, plus le coût total du crédit augmentera,\
    \ même si la mensualité diminue.\n\nPour plus de détails sur les coûts, veuillez\
    \ consulter le document Crédit renouvelable Ondine — grille tarifaire."
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b35d5780-33a8-5993-8a0c-14a1a92a705c
  title: Crédit renouvelable Ondine — effectuer une modification
  body: 'Ce guide vous accompagne dans la modification des paramètres de votre Crédit
    renouvelable Ondine. Toute modification impactant l''état de votre compte nécessite
    une authentification forte.


    Pour modifier vos informations personnelles ou vos modalités de remboursement
    :


    1. Demandez-nous la modification souhaitée (par exemple, un changement de date
    de prélèvement mensuel ou une mise à jour de vos coordonnées de contact).

    2. Nous déclencherons une procédure de vérification d''identité rigoureuse. Vous
    devrez confirmer votre identité via l''authentification forte sur votre appareil
    sécurisé.

    3. Une fois l''identité confirmée, indiquez-nous la nouvelle valeur ou la nouvelle
    date à appliquer.

    4. Nous traiterons la demande et vous confirmerons la prise en compte de la modification
    par un message de confirmation immédiat.


    S''il s''agit d''une demande de modification du plafond de votre réserve de crédit
    (actuellement limitée à un maximum de 3 000 €) :


    1. Demandez-nous l''augmentation ou la diminution de votre ligne de crédit.

    2. Nous procéderons à une nouvelle vérification de votre solvabilité pour nous
    assurer que le nouveau montant reste responsable et soutenable.

    3. Si la demande est acceptée, nous vous informerons du nouveau montant disponible
    et des éventuelles incidences sur vos conditions contractuelles.

    4. Vous recevrez un avenant électronique à votre contrat confirmant la modification.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 357f0820-d14d-5dd1-8f04-7539f4f6fc5d
  title: Crédit renouvelable Ondine — problèmes d'accès ou de connexion
  body: 'Symptôme : Vous ne parvenez pas à accéder à votre espace client pour consulter
    votre réserve de crédit ou effectuer un virement depuis votre Crédit renouvelable
    Ondine.


    Causes probables :

    - Échec de l''authentification forte (problème de réception du code ou appareil
    non reconnu).

    - Identifiants erronés ou compte temporairement bloqué pour raisons de sécurité.

    - Maintenance technique des canaux numériques.


    Procédure de résolution :

    1. Vérifiez votre connexion réseau et assurez-vous que votre application est à
    jour. Si le problème persiste, tentez de redémarrer votre appareil.

    2. Si l''authentification forte échoue, demandez-nous de réinitialiser vos paramètres
    de sécurité. Nous procéderons alors à une vérification d''identité rigoureuse
    avant toute action.

    3. Si vos identifiants sont refusés, demandez-nous la procédure de récupération
    de mot de passe. Nous vous guiderons pour sécuriser l''accès à nouveau.


    Quand escalader le problème ?

    Si malgré ces étapes vous ne pouvez toujours pas accéder à vos fonds (jusqu''à
    3 000 €) ou si vous suspectez une intrusion, nous prendrons les mesures suivantes
    :

    - Nous escaladerons votre dossier vers un gestionnaire de compte dédié.

    - Si une anomalie de sécurité est confirmée, le responsable de la conformité sera
    saisi pour geler temporairement les opérations et protéger vos fonds.


    Vous recevrez une notification de confirmation dès que l''accès sera rétabli ou
    que le dossier d''incident sera clos.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 605d64cf-ad78-58d5-b177-220d65d91a50
  title: Crédit renouvelable Ondine — niveaux d'accès
  body: 'Ce tableau définit les niveaux d''accès à la réserve de crédit en fonction
    des résultats de la vérification de la solvabilité. L''accès final est déterminé
    après analyse du dossier client.


    | Résultat de la solvabilité | Niveau d''accès | Plafond de crédit maximum | Condition
    additionnelle |

    | :--- | :--- | :--- | :--- |

    | Solvabilité excellente | Niveau 1 | 3 000 € | Justificatif de revenus stable
    |

    | Solvabilité satisfaisante | Niveau 2 | Jusqu''à 2 000 € | Analyse du taux d''endettement
    |

    | Solvabilité modérée | Niveau 3 | Jusqu''à 1 000 € | Garantie ou caution possible
    |

    | Solvabilité insuffisante | Accès refusé | 0 € | Orientation vers conseil budgétaire
    |

    | Présence au FICP | Accès refusé | 0 € | Signalement et refus systématique |


    Note pour l''agent : Toute attribution de crédit doit respecter le principe du
    TAEG inférieur au taux d''usure et l''obligation d''informer le client sur le
    coût total du crédit.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ed14c713-b7e3-5a2d-8a73-b7db382baef2
  title: Crédit renouvelable Ondine — choisir entre les formules
  body: 'Pour vos besoins de financement, Ondine Crédit propose deux approches distinctes
    : le Crédit renouvelable Ondine et le Prêt personnel Ondine. Le choix dépend de
    la nature de votre projet.


    Le Crédit renouvelable Ondine est une réserve flexible. Vous disposez d''un plafond
    allant jusqu''à 3 000 € que vous utilisez selon vos besoins. C''est la solution
    idéale pour des dépenses imprévues ou ponctuelles. Le coût est proportionnel aux
    sommes utilisées, avec un TAEG de 19,9 % (sur la base d''un exemple de 1 000 €
    sur 12 mois). Sa force réside dans sa disponibilité immédiate et sa flexibilité
    de remboursement sur 36 mois maximum.


    Le Prêt personnel Ondine est une solution stable. Le montant est versé en une
    seule fois pour un projet précis. Il convient mieux aux investissements lourds
    et planifiés, car il offre généralement une structure de coût plus prévisible
    et un TAEG souvent plus bas que le crédit renouvelable.


    En résumé :

    - Choisissez le Crédit renouvelable Ondine si vous recherchez une agilité maximale
    et une réserve disponible pour des besoins variés.

    - Choisissez le Prêt personnel Ondine pour un projet unique avec un budget fixe
    et une durée de remboursement déterminée.


    Pour plus de détails sur le prêt personnel, consultez le document Prêt personnel
    Ondine — présentation.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f2678677-c91e-52b0-9285-77687070d80a
  title: Crédit renouvelable Ondine — confidentialité et protection des données
  body: 'Ondine Crédit s''engage à protéger la confidentialité de vos données personnelles
    conformément au Règlement Général sur la Protection des Données (RGPD) et sous
    la supervision de l''ACPR et de la Banque de France.


    Collecte et utilisation des données : Dans le cadre de la gestion de votre Crédit
    renouvelable Ondine, nous collectons les informations nécessaires à la vérification
    rigoureuse de votre identité et à l''évaluation de votre solvabilité. Ces données
    sont indispensables pour déterminer votre plafond de crédit, pouvant atteindre
    3 000 €, et pour garantir que le crédit octroyé reste responsable.


    Sécurité des traitements : Nous appliquons l''authentification forte pour sécuriser
    l''accès à vos données et empêcher toute modification non autorisée de l''état
    de votre compte. Vos données sont cryptées et stockées selon des standards de
    sécurité institutionnels.


    Partage d''informations : Nous pouvons être amenés à consulter des fichiers réglementaires,
    tels que le Fichier national des Incidents de remboursement des Crédits aux Particuliers
    (FICP), pour valider l''éligibilité au produit. En cas de difficultés de remboursement
    durables, nous nous engageons à vous orienter vers la commission de surendettement.


    Vos droits : Vous disposez d''un droit d''accès, de rectification et de suppression
    de vos données personnelles. Vous pouvez exercer ces droits en nous contactant
    via vos canaux habituels. Nous vous rappelons également que vous bénéficiez d''un
    délai de rétractation de 14 jours lors de la souscription initiale, vous permettant
    d''annuler le contrat et l''associated traitement de données sans pénalité.'
