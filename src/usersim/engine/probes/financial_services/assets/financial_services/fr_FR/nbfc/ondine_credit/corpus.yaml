- id: 681b4e0b-969e-549a-97d4-b5390ce9c5cf
  title: Paiement en 3 ou 4 fois Ondine — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos transactions est notre priorité absolue. Pour utiliser
    le Paiement en 3 ou 4 fois Ondine en toute sérénité, nous vous demandons d''appliquer
    rigoureusement les mesures suivantes :


    1. Authentification Forte : L''authentification forte est systématiquement exigée
    pour sécuriser vos données personnelles et chaque demande de fractionnement. Ne
    partagez jamais vos codes de validation, même si l''interlocuteur prétend travailler
    pour Ondine Crédit.


    2. Vigilance face au Phishing : Soyez attentifs aux courriels ou SMS vous demandant
    de mettre à jour vos informations bancaires pour « débloquer » un plafond d''achat.
    Ondine Crédit ne vous demandera jamais votre mot de passe ou vos codes secrets
    par message.


    3. Vérification des Montants : Avant de valider un paiement fractionné, vérifiez
    que le montant total respecte bien vos limites (entre 100 € et 3 000 €) et que
    les frais de 2,2 % sont clairement indiqués.


    4. Signalement Rapide : En cas d''opération suspecte ou de perte de vos identifiants,
    informez-nous immédiatement. Nous adoptons une posture de protection active des
    fonds clients et signalons rapidement les fraudes aux autorités compétentes.


    Sachez qu''une vérification d''identité rigoureuse est impérative avant toute
    opération modifiant l''état de votre compte. Si vous constatez un prélèvement
    SEPA contestable, vous disposez d''un délai de huit semaines pour nous le signaler
    afin que nous puissions traiter votre contestation avec diligence.


    Pour plus d''informations sur la protection globale de vos avoirs, vous pouvez
    consulter le document suivant : Paiement en 3 ou 4 fois Ondine — protection contre
    la fraude et les opérations non autorisées.'
  domain: payments
  product_category: paiement_fractionne
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 2518a1c6-3770-57b2-9382-6d6f87d0337a
  title: Paiement en 3 ou 4 fois Ondine — modification des conditions
  body: 'Le présent document détaille les modalités de modification des conditions
    générales applicables au produit Paiement en 3 ou 4 fois Ondine.


    Ondine Crédit se réserve le droit de modifier les termes du contrat pour s''adapter
    aux évolutions réglementaires de l''ACPR et de la Banque de France. Toute modification
    touchant aux frais, notamment le taux de 2,2 %, ou aux limites d''achat (actuellement
    fixées entre 100 € et 3 000 €), fera l''objet d''une notification préalable.


    Notification et Consentement :

    Vous serez informé de toute modification substantielle via votre canal de communication
    numérique privilégié avec un préavis minimal de 30 jours. En cas de modification
    des conditions tarifaires, vous disposez de la possibilité de refuser les nouvelles
    conditions, ce qui entraînera la clôture de votre accès au paiement fractionné
    pour vos futurs achats.


    Obligations de l''Emprunteur :

    L''utilisateur s''engage à maintenir un solde suffisant pour honorer les échéances
    du paiement fractionné. Tout incident de paiement peut entraîner un signalement
    au Fichier national des Incidents de remboursement des Crédits aux Particuliers
    (FICP).


    Droit de Rétractation :

    Conformément à la réglementation, vous bénéficiez d''un délai de rétractation
    de 14 jours après la signature du contrat de fractionnement, vous permettant d''annuler
    l''opération sans pénalité.


    Fin du Contrat :

    Le contrat prend fin automatiquement après le règlement de la dernière échéance.
    En cas de difficultés durables de remboursement, Ondine Crédit s''engage à vous
    orienter vers la commission de surendettement.'
  domain: payments
  product_category: paiement_fractionne
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 930c59a7-8416-5212-b7d6-75d1e08747f6
  title: Paiement en 3 ou 4 fois Ondine — prise en main pas à pas
  body: 'Ce guide est destiné aux agents du support pour accompagner les clients dans
    l''activation et l''utilisation du Paiement en 3 ou 4 fois Ondine.


    L''objectif est de transformer un achat unique en un financement responsable et
    transparent.


    Étape 1 : Vérification de l''éligibilité du montant

    L''agent doit s''assurer avec le client que le montant de l''achat se situe strictement
    dans la fourchette autorisée :

    - Montant minimum : 100 €

    - Montant maximum : 3 000 €

    Si le montant est inférieur à 100 € ou supérieur à 3 000 €, le produit ne peut
    être proposé.


    Étape 2 : Présentation du coût

    L''agent doit expliquer pédagogiquement que le service n''est pas gratuit. Un
    taux de frais de 2,2 % est appliqué sur le montant total de l''achat. Ce coût
    est fixe et transparent, justifié par la gestion du risque opérationnel.


    Étape 3 : Choix de la formule

    Le client choisit entre un étalement en 3 ou 4 mensualités. L''agent doit confirmer
    que le client a compris le montant exact de chaque échéance, incluant la quote-part
    des frais de 2,2 %.


    Étape 4 : Validation et Sécurisation

    L''agent guide le client vers l''authentification forte. Une vérification d''identité
    rigoureuse est impérative avant le déblocage des fonds vers le commerçant.


    Étape 5 : Confirmation

    Une fois l''opération validée, le client reçoit un échéancier détaillé. L''agent
    doit rappeler l''existence du délai de rétractation de 14 jours.


    En cas de dossier complexe ou de litige sur un montant, l''agent doit escalader
    la demande vers un gestionnaire de compte, puis vers le responsable de la conformité
    si nécessaire.'
  domain: payments
  product_category: paiement_fractionne
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: fba02633-5c61-5cd7-81f2-f6691bc7d82e
  title: 'Paiement en 3 ou 4 fois Ondine — montant d''achat maximal : explications'
  body: 'Pourquoi le montant de mon achat est-il limité pour le paiement fractionné
    ?


    Le Paiement en 3 ou 4 fois Ondine est conçu comme une option de paiement agile
    pour vos achats de consommation courante. Afin de garantir un financement responsable
    et d''éviter le surendettement, nous avons fixé un montant d''achat maximal de
    3 000 €.


    Que se passe-t-il si mon achat dépasse 3 000 € ?


    Si votre projet nécessite un financement supérieur à 3 000 €, le paiement fractionné
    ne sera pas disponible. Nous vous invitons alors à consulter nos autres solutions
    de financement plus polyvalentes, comme le Prêt personnel Ondine — présentation,
    qui permet de financer des montants plus importants sur des durées plus longues.


    Le plafond de 3 000 € inclut-il les frais de 2,2 % ?


    Le plafond de 3 000 € s''applique au montant principal de l''achat. Les frais
    de 2,2 % sont calculés en sus sur la base de ce montant.'
  domain: payments
  product_category: paiement_fractionne
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 71723c48-f73c-5ecc-aa6c-e8d5f7e7ae7e
  title: Paiement en 3 ou 4 fois Ondine — effectuer une modification
  body: 'Si vous souhaitez modifier un élément lié à l''un de vos paiements fractionnés
    en cours (comme la date de prélèvement ou la mise à jour de vos coordonnées de
    paiement), veuillez suivre ces étapes :


    1. Demande de modification : Indiquez-nous précisément l''opération concernée
    et la modification souhaitée. Nous vérifierons que l''achat initial respectait
    bien les conditions de montant (entre 100 € et 3 000 €).


    2. Vérification d''identité : Pour protéger vos fonds et vos données, nous procéderons
    à une vérification d''identité rigoureuse. Vous devrez passer par l''étape d''authentification
    forte via votre appareil sécurisé.


    3. Analyse de la demande : Nous vérifierons que la modification demandée ne contrevient
    pas aux règles de conformité de l''ACPR et ne fragilise pas votre capacité de
    remboursement.


    4. Confirmation de la mise à jour : Une fois la modification validée, nous vous
    confirmerons le nouvel échéancier par écrit. Vous y retrouverez le rappel des
    frais de 2,2 % appliqués à l''origine de l''opération.


    5. Notification du changement : Vous recevrez une notification numérique confirmant
    que la modification a été prise en compte et est effective pour la prochaine échéance.


    Sachez que certaines modifications structurelles du contrat peuvent être limitées
    après le dépassement du délai de rétractation de 14 jours.'
  domain: payments
  product_category: paiement_fractionne
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8223c2c2-f75e-550c-9544-ac79b454edb7
  title: Paiement en 3 ou 4 fois Ondine — problèmes d'accès ou de connexion
  body: 'Symptôme : Vous ne parvenez pas à sélectionner l''option de paiement en 3
    ou 4 fois lors de la validation de votre achat, ou vous recevez un message d''erreur
    lors de l''authentification.


    Causes probables et vérifications :


    1. Montant de l''achat : Vérifiez que le panier est compris entre 100 € et 3 000
    €. Si le montant est de 99 € ou de 3 001 €, l''option sera automatiquement grisée.


    2. Authentification Forte : Assurez-vous que vos informations de sécurité sont
    à jour. Un échec de l''authentification forte bloque systématiquement le déblocage
    des fonds pour protéger votre compte contre la fraude.


    3. État du compte : Vérifiez que vous n''avez pas d''incidents de paiement en
    cours. Une situation complexe peut restreindre l''accès aux nouveaux fractionnements.


    Résolution :


    - Si le problème est lié au montant, ajustez votre panier pour entrer dans la
    plage 100 € - 3 000 €.

    - Si le problème est technique, tentez de redémarrer votre session d''authentification.


    Escalade :

    Si le problème persiste malgré le respect des conditions, nous prendrons les mesures
    suivantes :

    - Nous ouvrirons un dossier d''incident technique pour analyser l''échec de connexion.

    - Nous escaladerons votre dossier vers un gestionnaire de compte pour une analyse
    manuelle de votre éligibilité.

    - En dernier recours, le responsable de la conformité interviendra pour valider
    l''accès si un blocage réglementaire est suspecté.


    Vous serez informé du rétablissement de vos accès via une notification sécurisée.'
  domain: payments
  product_category: paiement_fractionne
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
