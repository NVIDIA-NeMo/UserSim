- id: 85fb0410-bf69-5b70-9798-6ce42205cb6e
  title: Paiement en 3 ou 4 fois Ondine — conditions d'éligibilité
  body: 'L''éligibilité au Paiement en 3 ou 4 fois Ondine dépend du respect strict
