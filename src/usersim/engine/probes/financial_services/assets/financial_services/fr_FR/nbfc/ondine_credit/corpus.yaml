- id: 602e06f7-bd10-5e04-875a-484e523f718c
  title: Crédit auto Ondine — opération refusée ou bloquée
  body: 'Symptôme : Vous tentez de finaliser une demande de crédit ou de débloquer
    les fonds, mais l''opération est affichée comme « refusée » ou « bloquée ».


    Causes probables :

    - Échec de la vérification d''identité : Les documents fournis sont illisibles,
    expirés ou ne correspondent pas aux informations du profil.

    - Insuffisance de solvabilité : L''analyse du dossier révèle un risque d''endettement
    trop élevé, dépassant les normes de prudence réglementaires.

    - Absence d''authentification forte : L''étape de sécurité obligatoire n''a pas
    été validée avec succès.

    - Document manquant : Une pièce justificative indispensable à l''étude du dossier
    est absente.


    Procédure de résolution :

    1. Vérifiez la validité de vos pièces d''identité. Assurez-vous que vos documents
    sont à jour et parfaitement lisibles. Si nécessaire, fournissez-nous une version
    numérisée plus nette.

    2. Contrôlez vos informations de solvabilité. Si un refus est lié à la capacité
    de remboursement, nous examinerons si un ajustement du montant (minimum 3 000
    €) ou de la durée (maximum 84 mois) pourrait rendre le dossier viable.

    3. Relancez l''authentification forte. Assurez-vous que votre appareil de confiance
    est actif pour valider l''opération.


    Si le problème persiste après ces vérifications, nous escaladerons votre dossier
    vers un gestionnaire de compte, puis vers le responsable de la conformité pour
    une analyse manuelle approfondie. Vous recevrez une notification officielle vous
    informant de la décision finale ou des documents complémentaires requis sous un
    délai raisonnable.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 2c75c19d-678e-58ad-abd1-bc8deb8134cc
  title: Crédit auto Ondine — quand changer ou monter en gamme
  body: 'Le Crédit auto Ondine est optimisé pour l''acquisition d''un véhicule avec
    un TAEG représentatif de 4,9 %. Cependant, selon l''évolution des besoins du client,
    un changement de produit peut être pertinent.


    Il est conseillé de s''orienter vers le Prêt personnel Ondine dans les cas suivants
    :

    - Polyvalence : Le client souhaite financer un projet mixte (véhicule et travaux,
    par exemple) et non exclusivement un véhicule.

    - Montants atypiques : Si le besoin de financement s''éloigne des standards du
    crédit auto et nécessite une structure de prêt plus globale.


    Le Crédit auto Ondine reste le choix privilégié pour tout achat automobile grâce
    à sa structure de coût optimisée. En revanche, si le client a besoin d''une réserve
    d''argent disponible et flexible pour des besoins ponctuels liés à l''entretien
    du véhicule plutôt qu''à son achat, le Crédit renouvelable Ondine est plus adapté.


    Pour plus de détails sur les caractéristiques du prêt polyvalent, voir : Prêt
    personnel Ondine — présentation.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8611cc5f-e92c-5181-b85e-86bce6bb32c9
  title: Crédit auto Ondine — comparaison avec les alternatives et quand ne pas le
    choisir
  body: 'Le Crédit auto Ondine est une solution de financement optimisée et spécifique
    pour l''acquisition d''un véhicule. Pour faire un choix éclairé, il est essentiel
    de comprendre ses avantages et ses limites par rapport aux autres options.


    Pourquoi choisir le Crédit auto Ondine ?

    C''est la solution idéale pour ceux qui recherchent une stabilité et une transparence
    absolue. Avec un TAEG représentatif de 4,9 %, il offre un coût maîtrisé pour des
    montants significatifs. Par exemple, pour un prêt de 20 000 € sur 60 mois, le
    coût total du crédit s''élève à 2 531,80 €, avec des mensualités fixes de 375,53
    €.


    Quand ne PAS choisir ce produit ?

    1. Montants trop faibles : Si votre besoin de financement est inférieur à 3 000
    €, le Crédit auto Ondine n''est pas accessible, car c''est le montant minimum
    d''emprunt.

    2. Besoin de flexibilité totale : Si vous ne connaissez pas encore le montant
    exact de vos besoins ou si vous souhaitez pouvoir piocher dans une réserve de
    crédit au fur et à mesure, le Crédit renouvelable Ondine sera plus approprié.

    3. Projets diversifiés : Si le financement ne concerne pas exclusivement un véhicule,
    la polyvalence du Prêt personnel Ondine est préférable.


    En résumé, le Crédit auto Ondine s''adresse aux emprunteurs ayant un projet d''acquisition
    automobile précis, souhaitant une rigueur réglementaire exemplaire et un coût
    total transparent. Nous vous rappelons que nous n''orientons jamais un client
    vers un crédit sans une vérification stricte de sa solvabilité et que nous ne
    promettons jamais l''octroi d''un prêt avant l''analyse du dossier.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: caa4c600-bbe9-5e89-b52a-af55b1919162
  title: 'Crédit auto Ondine — coût total du crédit dans l''exemple représentatif
    : explications'
  body: '« Que représente le montant de 2 531,80 € mentionné comme coût total du crédit
    ? »


    Le coût total du crédit correspond à la somme de tous les frais et intérêts que
    vous payez en plus du capital emprunté sur la durée totale du prêt. Dans notre
    exemple représentatif (un emprunt de 20 000 € sur 60 mois à un TAEG de 4,9 %),
    le montant de 2 531,80 € est la somme totale des intérêts dus à l''institution
    pour le service de financement. C''est l''indicateur le plus transparent pour
    évaluer le prix réel de votre crédit.


    « Ce montant peut-il être réduit ? »


    Oui, le coût total peut être diminué si vous effectuez un remboursement anticipé.
    Conformément à notre philosophie de frais, les frais de remboursement anticipé
    sont strictement plafonnés par la loi pour vous garantir une flexibilité maximale.
    En remboursant votre crédit plus tôt, vous réduisez la part d''intérêts calculée
    sur la durée restante.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 24f912ff-86a6-5251-8c40-b5aa6f8ecaa0
  title: Crédit auto Ondine — traiter une demande courante de bout en bout
  body: 'Voici la procédure complète pour souscrire à un Crédit auto Ondine, de la
    demande initiale au déblocage des fonds :


    1. Formulez votre demande de financement en indiquant le montant souhaité (minimum
    3 000 €) et la durée envisagée (maximum 84 mois).

    2. Fournissez les pièces justificatives nécessaires. Nous vous demanderons vos
    documents d''identité et vos justificatifs de revenus pour procéder à la vérification
    obligatoire de votre solvabilité.

    3. Examinez l''offre personnalisée. Nous vous proposerons un contrat basé sur
    votre profil. À titre d''exemple, pour un montant de 20 000 € sur 60 mois, le
    TAEG sera de 4,9 % avec des mensualités de 375,53 €.

    4. Signez électroniquement le contrat. Une fois l''offre acceptée, la signature
    engage les deux parties.

    5. Observez le délai de rétractation. Vous disposez légalement de 14 jours pour
    annuler votre contrat sans aucune pénalité.

    6. Validez l''authentification forte finale. Avant tout versement, une dernière
    vérification d''identité rigoureuse est impérative.

    7. Recevez les fonds. Après expiration du délai de rétractation et validation
    de l''identité, nous procédons au déblocage des fonds sur votre compte.


    L''opération est considérée comme réussie lorsque les fonds sont disponibles sur
    votre compte et que vous avez reçu votre tableau d''amortissement détaillé. Pour
    toute question sur le suivi ultérieur, consultez : Crédit auto Ondine — consulter
    le suivi ou l''historique.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: cadcc66f-baeb-55f6-bb1c-5041e4398248
  title: Crédit auto Ondine — écart avec vos relevés
  body: 'Symptôme : Le client signale que le solde restant dû ou le montant d''une
    mensualité sur son relevé ne correspond pas à ses attentes ou à ses propres calculs.


    Causes probables :

    - Prélèvement SEPA en cours : Un prélèvement peut mettre quelques jours à apparaître.
    Rappelons que les contestations de prélèvements SEPA sont traitables sous huit
    semaines.

    - Remboursement anticipé : Le client a effectué un versement volontaire qui n''a
    pas encore été totalement intégré au calcul du solde.

    - Frais de remboursement anticipé : L''application de frais légaux plafonnés lors
    d''un remboursement partiel peut créer un écart temporaire.

    - Erreur de date de valeur : Un décalage entre la date de l''opération et la date
    de comptabilisation sur le relevé.


    Procédure de résolution pour l''agent :

    1. Vérifier l''historique des transactions : Confirmer la date exacte du dernier
    prélèvement et vérifier s''il existe des opérations en attente.

    2. Analyser les derniers mouvements : Rechercher tout versement anticipé et vérifier
    si les frais légaux correspondants ont été appliqués conformément à la loi.

    3. Comparer avec le tableau d''amortissement : Vérifier si la mensualité prélevée
    correspond bien à la mensualité contractuelle (ex: 375,53 € pour l''exemple représentatif).


    Si l''écart n''est pas expliqué par ces éléments, l''agent doit escalader le dossier
    vers le gestionnaire de compte pour un audit du compte. Le client sera informé
    que son dossier est en cours d''analyse et recevra une réponse corrective ou une
    explication détaillée sous 5 jours ouvrés.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f70c7e7a-fb91-512f-82df-97ad31b82c92
  title: Paiement en 3 ou 4 fois Ondine — présentation
  body: "Le Paiement en 3 ou 4 fois Ondine est une solution de financement agile et\
    \ rapide, conçue pour vous accompagner dans vos achats de consommation courante.\
    \ Ce produit vous permet de répartir le règlement de vos dépenses sur une courte\
    \ période, vous offrant ainsi une plus grande souplesse dans la gestion de votre\
    \ budget mensuel.\n\nPour bénéficier de ce service, votre achat doit s'inscrire\
    \ dans une fourchette précise : le montant minimum de l'achat est fixé à 100 €,\
    \ et le montant maximum autorisé est de 3 000 €. Cette structure garantit que\
    \ le fractionnement reste un outil de gestion ponctuel et responsable.\n\nEn termes\
    \ de coût, Ondine Crédit s'engage sur une transparence absolue. L'utilisation\
    \ de ce service entraîne l'application de frais fixes, correspondant à un taux\
    \ de 2,2 %. Ces frais sont justifiés par la gestion du risque et les coûts opérationnels\
    \ liés à l'immédiateté du déblocage des fonds pour le marchand.\n\nConformément\
    \ à notre positionnement de rigueur réglementaire, le Paiement en 3 ou 4 fois\
    \ Ondine est opéré sous la supervision de l'ACPR et de la Banque de France. Nous\
    \ appliquons strictement la vérification de votre solvabilité avant toute activation\
    \ pour éviter tout risque de surendettement. \n\n***\nAVERTISSEMENT LÉGAL : Un\
    \ crédit vous engage et doit être remboursé. Vérifiez vos capacités de remboursement\
    \ avant de vous engager.\n***\n\nCe produit est idéal pour ceux qui recherchent\
    \ une solution rapide sans les formalités d'un crédit à plus long terme. Si vos\
    \ besoins de financement concernent des montants plus élevés ou des durées plus\
    \ longues, nous vous invitons à consulter le document Prêt personnel Ondine —\
    \ présentation."
