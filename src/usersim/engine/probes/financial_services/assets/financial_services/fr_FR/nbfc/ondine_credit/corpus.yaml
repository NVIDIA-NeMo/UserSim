  institution_id: ondine_credit
- id: 8f478fb1-e70a-5440-a3d1-71d159937235
  title: Crédit auto Ondine — niveaux d'accès
  body: 'Ce tableau définit les critères d''éligibilité et les niveaux d''accès pour
    l''octroi du Crédit auto Ondine. L''accès au financement est conditionné par la
    validation des points suivants :


    | Critère | Condition Requise | Résultat / Impact |

    | :--- | :--- | :--- |

    | Montant du prêt | Minimum de 3 000 € | Accès autorisé au produit |

    | Durée du crédit | Maximum de 84 mois | Validation du plan de remboursement |

    | Solvabilité | Vérification positive (Revenus > Charges) | Approbation du dossier
    |

    | Antécédents | Absence d''incident majeur (Consultation FICP) | Validation du
    risque opérationnel |

    | Identité | Vérification d''identité rigoureuse complétée | Déblocage des fonds
    autorisé |


    L''agent doit s''assurer que TOUTES les conditions de la colonne « Condition Requise
