- id: e75e76f2-61b0-5b9c-853c-b14947bda850
  title: Crédit auto Ondine — protection contre la fraude et les opérations non autorisées
  body: 'La sécurité de vos fonds et de vos données personnelles est une priorité
    absolue pour Ondine Crédit. Dans le cadre de votre Crédit auto Ondine, nous appliquons
    des protocoles de vérification rigoureux pour prévenir toute tentative de fraude.


    Une vérification d''identité approfondie est impérative avant tout déblocage de
    fonds ou toute opération modifiant l''état de votre compte. Pour sécuriser vos
    transactions, l''authentification forte est systématiquement exigée. Soyez vigilants
    : Ondine Crédit ne vous demandera jamais vos codes secrets, vos mots de passe
    ou vos identifiants de connexion par téléphone ou par e-mail.


    Certaines tentatives de fraude peuvent viser les emprunteurs en se faisant passer
    pour un service de recouvrement ou un organisme de rachat de crédit. Nous vous
    rappelons que toutes les communications officielles concernant votre financement
    sont transmises via vos canaux sécurisés habituels.


    Si vous constatez une opération suspecte ou si vous pensez être la cible d''une
    tentative d''usurpation d''identité, vous devez nous le signaler immédiatement.
    Nous adoptons une posture de protection active et procédons au signalement rapide
    des fraudes aux autorités compétentes pour limiter l''impact financier.


    Pour les prélèvements SEPA, sachez que toute contestation doit être formulée avec
    diligence, les opérations étant contestables sous un délai de huit semaines.


    ***

    AVERTISSEMENT : Le non-respect des procédures de sécurité et l''utilisation de
    canaux de communication non sécurisés peuvent augmenter le risque de fraude. Soyez
    attentifs aux demandes d''informations inhabituelles.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 9682521d-8962-515e-89b8-a1c9d9f962cb
  title: Crédit auto Ondine — conditions générales
  body: 'Les présentes conditions générales régissent l''octroi et le remboursement
    du Crédit auto Ondine. Ce contrat établit les obligations réciproques entre l''emprunteur
    et Ondine Crédit.


    Éligibilité et Montants : L''octroi du crédit est soumis à une vérification stricte
    de la solvabilité de l''emprunteur. Le montant minimum du prêt est fixé à 3 000
    €. La durée maximale de remboursement ne peut excéder 84 mois.


    Engagement de l''Emprunteur : Vous vous engagez à rembourser les sommes mises
    à disposition selon l''échéancier convenu. Tout retard de paiement peut entraîner
    des pénalités conformément à la réglementation en vigueur.


    Droit de Rétractation : Conformément à la loi, vous disposez d''un délai de rétractation
    de « 14 » jours après la signature du contrat pour annuler votre engagement sans
    pénalité.


    Remboursement Anticipé : Vous avez la possibilité de rembourser tout ou partie
    de votre crédit avant le terme prévu. Les frais de remboursement anticipé sont
    strictement plafonnés conformément à la loi pour garantir votre flexibilité financière.


    Modification et Résiliation : Ondine Crédit se réserve le droit de modifier les
    conditions générales sous réserve d''un préavis légal. Le contrat prend fin lors
    du remboursement intégral du capital, des intérêts et des frais annexes.


    Supervision : Ce produit opère sous la supervision de l''ACPR et de la Banque
    de France, garantissant que le TAEG reste systématiquement inférieur au taux d''usure.


    ***

    MENTION LÉGALE : Un crédit vous engage et doit être remboursé. Vérifiez vos capacités
    de remboursement avant de vous engager.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 6282a60c-67e7-54e0-8568-baa4bf13ba45
  title: Crédit auto Ondine — pour qui et pour quels usages
  body: 'Le Crédit auto Ondine est une solution de financement optimisée et spécifique
    pour l''acquisition d''un véhicule. Il s''adresse aux particuliers recherchant
    un partenaire financier transparent, privilégiant la clarté des coûts et une gestion
    responsable de leur endettement.


    Ce produit est idéal pour financer l''achat d''un véhicule neuf ou d''occasion,
    vous permettant de lisser l''investissement sur une durée adaptée à vos besoins,
    avec un maximum de 84 mois.


    Caractéristiques principales :

    - Montant minimum du prêt : 3 000 €

    - Durée maximale de remboursement : 84 mois

    - Transparence totale : Pas de frais cachés, coûts justifiés par la gestion du
    risque.


    Exemple représentatif :

    Pour un montant emprunté de 20 000 € sur une durée de 60 mois, avec un TAEG de
    4,9 %, la mensualité s''élève à 375,53 €. Le coût total du crédit pour cet exemple
    est de 2 531,80 €.


    Ondine Crédit s''engage à ne jamais promettre l''octroi d''un crédit et à ne jamais
    minimiser son coût total. Nous vous accompagnons dans l''éducation financière
    pour que votre choix de financement reste soutenable.


    ***

    AVERTISSEMENT : Le taux mentionné est un exemple. Le taux définitif dépend de
    votre profil de solvabilité. Un crédit vous engage et doit être remboursé.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 94364ff1-4da1-5093-add4-a2605cd93a17
  title: 'Crédit auto Ondine — montant de l''exemple représentatif : explications'
  body: 'Question : Pourquoi le montant de 20 000 € est-il utilisé dans l''exemple
    représentatif du Crédit auto Ondine ?


    Réponse : Le montant de 20 000 € sert de référence standard pour vous permettre
    de visualiser concrètement le coût d''un financement automobile typique. En prenant
    ce montant sur 60 mois avec un TAEG de 4,9 %, vous pouvez constater qu''une mensualité
    de 375,53 € génère un coût total du crédit de 2 531,80 €. Cela vous aide à comparer
    notre offre avec d''autres solutions de manière objective.


    Question : Puis-je emprunter un montant différent de celui de l''exemple ?


    Réponse : Absolument. L''exemple est pédagogique. Le Crédit auto Ondine est disponible
    pour tout montant supérieur ou égal au minimum de 3 000 €, sous réserve de validation
    de votre solvabilité. Pour plus de détails sur la composition du taux, vous pouvez
    consulter le document Crédit auto Ondine — calcul et application des taux.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 607f1fef-7ab8-5011-ba21-0125b73a7978
  title: Crédit auto Ondine — résilier, clôturer ou changer de formule
  body: 'La clôture d''un Crédit auto Ondine intervient généralement lors du remboursement
    intégral des sommes dues, soit à l''échéance du contrat, soit par anticipation.


    Voici la procédure pour clôturer votre crédit par remboursement anticipé :


    1. Demandez-nous le décompte exact restant dû à la date prévue de remboursement.
    Nous vous communiquerons le capital restant dû ainsi que les intérêts courus.

    2. Transmettez-nous l''ordre de virement correspondant au montant total indiqué.
    Si vous effectuez un remboursement partiel, précisez si vous souhaitez réduire
    la mensualité ou raccourcir la durée du prêt.

    3. Nous traiterons le paiement et appliquerons les frais de remboursement anticipé,
    lesquels sont strictement plafonnés conformément à la loi pour garantir votre
    flexibilité.

    4. Vous recevrez une confirmation écrite de la clôture de votre dossier et la
    levée éventuelle des garanties liées au véhicule.


    Si vous souhaitez changer de formule ou renégocier vos conditions, veuillez nous
    faire part de votre demande. Nous analyserons votre situation actuelle et vous
    proposerons une solution adaptée, sans jamais minimiser le coût total du nouveau
    financement.


    En cas de difficultés financières durables rendant le remboursement impossible,
    nous vous orienterons vers la commission de surendettement pour vous protéger.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: e068d1d4-4b10-51c2-a584-b9759458fc75
  title: Crédit auto Ondine — frais ou montant inattendu
  body: 'Symptôme : Le client signale qu''une mensualité prélevée est supérieure au
    montant prévu ou constate des frais non identifiés sur son relevé lié au Crédit
    auto Ondine.


    Causes probables :

    - Retard de paiement ayant entraîné des pénalités de retard.

    - Application de frais de remboursement anticipé lors d''un versement volontaire.

    - Ajustement du montant suite à une modification des modalités du contrat.


    Procédure de résolution :

    1. Vérifier la date du dernier prélèvement et comparer le montant avec l''échéancier
    contractuel.

    2. Identifier si une opération de remboursement anticipé a eu lieu récemment,
    en vérifiant que les frais appliqués respectent le plafond légal.

    3. Consulter l''historique des communications pour voir si un avenant au contrat
    a été signé.

    4. Expliquer pédagogiquement au client l''origine du montant, en s''appuyant sur
    la grille tarifaire et les conditions générales.


    Escalade :

    Si le client conteste toujours le montant après ces vérifications, ou si une erreur
    technique est suspectée :

    - Le dossier est escaladé vers un gestionnaire de compte pour une analyse détaillée
    du compte.

    - Si le litige persiste sur un point réglementaire ou légal, le dossier est transmis
    au responsable de la conformité pour arbitrage final.


    Le client sera informé du délai de traitement de sa demande et recevra une réponse
    écrite justifiant le montant ou confirmant le remboursement du trop-perçu.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 38ffca32-c94b-546c-a4c9-0a9fab7c87cc
  title: Crédit auto Ondine — justificatifs à fournir
  body: 'Pour permettre l''étude de votre demande de Crédit auto Ondine et la vérification
    de votre solvabilité, les documents suivants sont impératifs :


    | Type de justificatif | Document accepté | Objectif |

    | :--- | :--- | :--- |

    | Identité | Passeport ou Carte Nationale d''Identité valide | Vérification rigoureuse
    de l''identité |

    | Revenus | 3 derniers bulletins de salaire ou avis d''imposition | Analyse de
    la solvabilité |

    | Domicile | Justificatif de domicile de moins de 3 mois | Validation du cadre
    résidentiel |

    | Véhicule | Bon de commande, facture pro forma ou certificat de cession | Justification
    de l''objet du financement |

    | Bancaire | Relevé d''Identité Bancaire (RIB) | Mise en place des prélèvements
    SEPA |


    L''absence d''un seul de ces documents entraînera la suspension du traitement
    de votre dossier jusqu''à réception du justificatif manquant.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: eligibility_matrix
