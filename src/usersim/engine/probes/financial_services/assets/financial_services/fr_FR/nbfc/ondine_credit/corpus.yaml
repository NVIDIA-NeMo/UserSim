- id: 3b419f3d-5052-5096-9d28-b7976850f53e
  title: 'Crédit renouvelable Ondine — TAEG de l''exemple représentatif : explications'
  body: '« Qu''est-ce que le TAEG de 19,9 % mentionné dans l''exemple représentatif
    ? »

    Le Taux Annuel Effectif Global (TAEG) de 19,9 % est l''indicateur unique qui reflète
    le coût total du crédit pour vous. Il inclut non seulement les intérêts, mais
    également tous les frais obligatoires liés à l''obtention du crédit. C''est l''outil
    pédagogique essentiel pour comparer notre offre avec d''autres solutions de financement.


    « Ce taux s''applique-t-il à tous les montants ? »

    Le taux de 19,9 % est utilisé dans notre exemple représentatif pour un montant
    de 1 000 €. Bien que ce taux serve de référence pour illustrer le coût du produit,
    le TAEG appliqué à votre contrat final sera déterminé après l''analyse de votre
    dossier, tout en restant systématiquement inférieur au taux d''usure légal.


    Pour plus de détails sur la nature du crédit, vous pouvez vous référer à « Crédit
    renouvelable Ondine — présentation ».'
