- id: 7529bfe6-3367-54bd-bab2-5ab87c57a85c
  title: 'Crédit auto Ondine — mensualité de l''exemple représentatif : explications'
  body: '« Pourquoi la mensualité de l''exemple représentatif est-elle de 375,53 €
    ? »


    Ce montant correspond au paiement mensuel pour un financement de 20 000 € sur
    une durée de 60 mois, avec un TAEG de 4,9 %. La mensualité de 375,53 € comprend
    à la fois le remboursement d''une partie du capital emprunté et les intérêts calculés
    sur la base du taux annuel. Ce montant est fixe pendant toute la durée du contrat,
    vous offrant ainsi une visibilité totale et une gestion stable de votre budget.


    « Le montant de la mensualité peut-il varier ? »


    Dans le cadre du Crédit auto Ondine, la mensualité est déterminée lors de la signature
    du contrat selon le montant emprunté et la durée choisie. Elle reste identique
    chaque mois, sauf en cas de remboursement anticipé partiel ou total, conformément
    aux dispositions légales sur la flexibilité de l''emprunteur. Pour comprendre
    le coût global, nous vous invitons à consulter : Crédit auto Ondine — coût total
    du crédit dans l''exemple représentatif : explications.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: a3b3793d-fe1a-5bd1-896d-90f80b408264
  title: Crédit auto Ondine — consulter le suivi ou l'historique
  body: "Pour suivre l'état de vos remboursements et consulter l'historique des transactions\
    \ liées à votre Crédit auto Ondine, veuillez suivre les étapes suivantes :\n\n\
    1. Demandez l'accès à votre historique de prêt en précisant le numéro de votre\
    \ contrat. Vous pouvez solliciter le solde restant dû ou le détail des mensualités\
    \ déjà prélevées.\n2. Procédez à l'authentification forte. Pour sécuriser vos\
    \ données personnelles et l'état de votre compte, nous vous demanderons de confirmer\
    \ votre identité via la méthode de sécurité active liée à votre profil.\n3. Validez\
    \ la demande de génération de relevé. Nous traiterons alors votre demande pour\
    \ extraire les données de paiement correspondantes.\n4. Recevez le récapitulatif\
    \ détaillé. Nous vous transmettrons un document listant chaque mensualité prélevée,\
    \ la date de l'opération, la part de capital remboursée et la part d'intérêts.\n\
    \nVous saurez que l'opération a réussi lorsque vous aurez reçu la confirmation\
    \ de transmission du relevé et que vous pourrez visualiser le détail chronologique\
    \ de vos paiements. \n\nSi vous constatez un montant qui ne semble pas correspondre\
    \ à vos attentes dans cet historique, nous vous suggérons de consulter le guide\
    \ : Crédit auto Ondine — écart avec vos relevés."
  domain: lending_mortgage
  product_category: credit_auto
