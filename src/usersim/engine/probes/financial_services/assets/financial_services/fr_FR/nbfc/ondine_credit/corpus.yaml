- id: cdab7c97-d664-5f61-8527-400b52e747c6
  title: Crédit renouvelable Ondine — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux gestionnaires support pour l''accompagnement
    des clients sur les limites techniques et réglementaires du Crédit renouvelable
    Ondine.


    **Plafonds de crédit et durées**

    Le Crédit renouvelable Ondine est une réserve de crédit flexible dont les limites
    sont strictement définies :

    - Montant maximum de la ligne de crédit : 3 000 €. Ce plafond est déterminé après
    une vérification rigoureuse de la solvabilité du client.

    - Durée maximale de remboursement : 36 mois. Au-delà de ce délai, le crédit doit
    être intégralement soldé.


    **Restrictions et Conformité**

    Ondine Crédit opère sous la supervision de l''ACPR et de la Banque de France.
    À ce titre, les restrictions suivantes s''appliquent :

    - Taux d''usure : Le TAEG appliqué est systématiquement inférieur au taux d''usure
    légal en vigueur.

    - Vérification de solvabilité : Aucune ligne de crédit ne peut être ouverte ou
    augmentée sans une mise à jour des justificatifs de revenus et une analyse de
    la capacité de remboursement.

    - Droit de rétractation : Le client dispose d''un délai légal de « 14 » jours
    pour revenir sur son engagement après la signature du contrat.


    **Cas particuliers et escalades**

    - Difficultés de remboursement : En cas de difficultés durables, le gestionnaire
    doit orienter systématiquement le client vers la commission de surendettement.

    - Demandes de dépassement de plafond : Toute demande d''augmentation au-delà des
    3 000 € doit être refusée, car elle contrevient aux limites du produit actuel.

    - Litiges complexes : Tout dossier présentant une anomalie réglementaire ou un
    litige persistant doit être escaladé vers le responsable de la conformité après
    passage par le gestionnaire de compte.


    Pour une vue d''ensemble des conditions d''accès, se référer à Crédit renouvelable
    Ondine — conditions d''éligibilité.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 043375cc-29a0-5eb7-83bc-44a068d3c107
  title: 'Crédit renouvelable Ondine — mensualité de l''exemple représentatif : explications'
  body: '**Qu''est-ce que la mensualité de 91,82 € mentionnée dans l''exemple ?**


    La mensualité de 91,82 € est le montant que vous rembourseriez chaque mois si
    vous utilisiez une partie de votre réserve de crédit pour un montant de 1 000
    €, sur une durée de 12 mois, avec un TAEG de 19,9 %.


    **S''agit-il d''un montant fixe pour tous les clients ?**

    Non. Ce montant est purement pédagogique pour vous aider à visualiser le coût
    du crédit. Votre mensualité réelle dépendra du montant que vous aurez effectivement
    débloqué, de la durée de remboursement choisie et du taux applicable à votre contrat.


    **Puis-je modifier ce montant ?**

    Le crédit renouvelable offre une grande flexibilité. Vous pouvez rembourser davantage
    que la mensualité minimale pour réduire la durée de votre crédit et ainsi diminuer
    le coût total. Pour comprendre comment ce montant impacte vos frais, consultez
    Crédit renouvelable Ondine — coût total du crédit dans l''exemple représentatif
    : explications.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: a4990bfc-211e-5ee0-96a1-a17581a847b0
  title: Crédit renouvelable Ondine — consulter le suivi ou l'historique
  body: "Ce guide vous accompagne pour suivre l'utilisation de votre réserve de crédit\
    \ et consulter l'historique de vos opérations sur le Crédit renouvelable Ondine.\n\
    \n**Prérequis**\nL'authentification forte (sécurisation par code ou biométrie)\
    \ est impérative pour accéder à ces informations confidentielles.\n\n**Étapes\
    \ de consultation**\n\n1. Demandez l'accès à l'état actuel de votre compte de\
    \ crédit. Nous vous confirmerons alors le montant total de votre ligne de crédit\
    \ (jusqu'à 3 000 €) et la part actuellement disponible.\n2. Pour visualiser vos\
    \ derniers mouvements, demandez l'historique des tirages. Nous vous listerons\
    \ les dates, les montants débloqués et les comptes de destination des fonds.\n\
    3. Pour vérifier vos remboursements, demandez le détail des mensualités payées.\
    \ Nous vous fournirons la date de chaque prélèvement et la répartition entre le\
    \ remboursement du capital et les intérêts calculés selon votre TAEG de 19,9 %.\n\
    4. Si vous souhaitez un document officiel, demandez l'édition de votre relevé\
    \ périodique. Nous vous transmettrons ce document récapitulatif incluant le solde\
    \ restant dû et le coût total du crédit depuis l'ouverture.\n\n**Confirmation\
    \ du succès**\nL'opération est réussie lorsque vous avez reçu la confirmation\
    \ écrite des montants disponibles ou le document PDF de votre relevé. \n\nEn cas\
    \ d'incohérence entre vos calculs et les montants affichés, vous pouvez consulter\
    \ Crédit renouvelable Ondine — écart avec vos relevés pour identifier l'origine\
    \ de la différence."
