  institution_id: ondine_credit
- id: aa799475-a38e-5807-a679-42d3b1ac2bec
  title: Crédit auto Ondine — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner le client dans
    la souscription et l''activation du Crédit auto Ondine. Ce financement est optimisé
    spécifiquement pour l''acquisition d''un véhicule.


    Étape 1 : Vérification de l''éligibilité et solvabilité

    L''agent doit s''assurer que le projet respecte le montant minimum de prêt de
    3 000 €. Une vérification rigoureuse de la solvabilité est impérative, incluant
    la consultation du Fichier national des Incidents de remboursement des Crédits
    aux Particuliers (FICP) si nécessaire.


    Étape 2 : Constitution du dossier

    L''agent guide le client pour fournir les justificatifs requis. Une vérification
    d''identité rigoureuse doit être effectuée avant toute étape suivante. L''agent
    rappelle que le Crédit auto Ondine peut s''étendre sur une durée maximale de 84
    mois.


    Étape 3 : Présentation de l''offre

    L''agent présente l''offre en s''appuyant sur l''exemple représentatif pour illustrer
    le coût : pour un emprunt de 20 000 € sur 60 mois à un TAEG de 4,9 %, le client
    paiera 375,53 € par mois, pour un coût total du crédit de 2 531,80 €. L''agent
    ne doit jamais promettre l''octroi du crédit ni minimiser son coût total.


    Étape 4 : Signature et Droit de rétractation

    Une fois l''offre acceptée, le contrat est signé numériquement avec authentification
    forte. L''agent doit explicitement mentionner le droit de rétractation de 14 jours.


    Étape 5 : Déblocage des fonds

    Après expiration du délai de rétractation ou levée anticipée, les fonds sont débloqués
    vers le vendeur ou le client après une ultime vérification de sécurité.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b13bc290-ceea-5acf-aefb-a03069d1e7ad
  title: 'Crédit auto Ondine — durée de l''exemple représentatif (mois) : explications'
  body: 'Question : Pourquoi l''exemple représentatif du Crédit auto Ondine est-il
    basé sur une durée de 60 mois ?


    Réponse : La durée de 60 mois est utilisée comme référence pour vous offrir une
    vision équilibrée entre le montant des mensualités et le coût total du crédit.
    Pour un montant de 20 000 €, une durée de 60 mois permet d''aboutir à une mensualité
    de 375,53 €, ce qui est représentatif d''un budget automobile courant tout en
    limitant le coût total du crédit à 2 531,80 € (avec un TAEG de 4,9 %).


    Sachez toutefois que cette durée est indicative. Le Crédit auto Ondine est flexible
    et peut s''adapter à vos besoins sur une période allant jusqu''à une durée maximale
    de 84 mois, afin de réduire vos mensualités si vous le souhaitez. Pour plus de
    détails sur les conditions, vous pouvez consulter le document : Crédit auto Ondine
    — conditions générales.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 60cc5c52-2353-59f8-900f-62ad3a4f8063
  title: Crédit auto Ondine — effectuer une modification
  body: 'Vous souhaitez modifier un élément de votre contrat de Crédit auto Ondine
    (changement de coordonnées, mise à jour du mandat de prélèvement ou modification
    de vos informations personnelles). Voici la marche à suivre :


    1. Demande de modification : Indiquez-nous précisément l''élément que vous souhaitez
    modifier. Si vous changez de banque, veuillez nous fournir les nouveaux coordonnées
    bancaires (IBAN).


    2. Vérification d''identité : Pour sécuriser votre compte, nous procéderons à
    une authentification forte. Nous vous demanderons de confirmer votre identité
    via la méthode sécurisée habituelle. Cette étape est impérative avant toute modification
    de l''état du compte.


    3. Traitement et validation : Nous traiterons votre demande durant les heures
    ouvrables (CET). S''il s''agit d''une modification complexe impactant le calendrier
    de remboursement, un gestionnaire de compte pourra vous contacter pour valider
    les nouveaux termes.


    4. Confirmation : Vous recevrez une confirmation numérique dès que la modification
    aura été enregistrée. Vous pourrez alors consulter l''historique de vos modifications
    dans votre espace client.


    En cas de litige concernant une modification, votre dossier sera escaladé vers
    le responsable de la conformité pour garantir un traitement rigoureux et conforme
    aux règles de l''ACPR.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b6aca530-4f3b-5f7e-9823-d612e388bde7
  title: Crédit auto Ondine — problèmes d'accès ou de connexion
  body: "Symptôme : Vous ne parvenez pas à accéder à vos détails de prêt ou à vous\
    \ connecter à votre espace sécurisé pour le Crédit auto Ondine.\n\nCauses probables\
    \ :\n- Identifiants incorrects ou mot de passe expiré.\n- Échec de l'authentification\
    \ forte (problème de réception du code).\n- Compte temporairement bloqué suite\
    \ à plusieurs tentatives infructueuses pour des raisons de sécurité.\n\nÉtapes\
    \ de résolution :\n1. Vérification des accès : Assurez-vous que vos identifiants\
    \ sont corrects. Tentez une réinitialisation de mot de passe via le canal sécurisé.\n\
    2. Test de l'authentification : Vérifiez que votre appareil de confiance est connecté\
    \ et capable de recevoir les notifications d'authentification forte.\n3. Demande\
    \ d'assistance : Si le problème persiste, demandez-nous de vérifier l'état de\
    \ votre compte. Nous procéderons à une vérification d'identité rigoureuse avant\
    \ toute action sur vos accès.\n\nEscalade :\nSi l'accès ne peut être rétabli immédiatement,\
    \ nous ouvrirons un ticket d'incident. Votre dossier sera transmis à un gestionnaire\
    \ de compte qui vous contactera sous 48 heures ouvrées pour résoudre le problème.\
    \ \n\nPour toute question sur la gestion des données liées à vos accès, veuillez\
    \ vous référer au document : Crédit auto Ondine — confidentialité et protection\
    \ des données."
  domain: lending_mortgage
  product_category: credit_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
