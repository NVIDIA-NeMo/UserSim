- id: 6a52522c-581d-5f66-ba19-c37d1a8ecf04
  title: Crédit renouvelable Ondine — opération refusée ou bloquée
  body: 'Il peut arriver que vous ne puissiez pas débloquer de fonds ou effectuer
    une modification sur votre Crédit renouvelable Ondine. Voici comment identifier
    et résoudre le problème.


    **Symptômes courants**

    - Message d''erreur lors d''une demande de tirage.

    - Refus immédiat d''une opération de déblocage de fonds.

    - Impossibilité de modifier la durée de remboursement.


    **Causes probables et vérifications**


    1. Dépassement du plafond : Vérifiez que le montant demandé ne porte pas le solde
    total utilisé au-delà de la limite maximale de 3 000 €. Si le plafond est atteint,
    l''opération sera systématiquement bloquée.

    2. Défaut d''authentification : Assurez-vous d''avoir validé l''authentification
    forte. Pour sécuriser vos données, toute opération modifiant l''état du compte
    exige une vérification d''identité rigoureuse.

    3. Incident de paiement : Si une mensualité précédente n''a pas pu être prélevée,
    votre ligne de crédit peut être temporairement suspendue par mesure de gestion
    du risque.

    4. Dossier de conformité incomplet : Si vos justificatifs de revenus ne sont plus
    à jour, nous pouvons bloquer les nouveaux tirages jusqu''à la mise à jour de votre
    dossier.


    **Résolution et Escalade**

    - Si le problème est lié au plafond ou à l''authentification, la résolution est
    immédiate dès que la condition est remplie.

    - Si l''opération est bloquée pour un motif de conformité, nous vous demanderons
    de fournir les documents manquants. Une fois reçus, nous procéderons à la levée
    du blocage sous 48 heures ouvrables.

    - Si la cause n''est pas identifiée après ces vérifications, nous escaladerons
    votre demande vers un gestionnaire de compte pour une analyse approfondie de votre
    dossier.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b2d7f4a6-26f2-533e-b489-d19e50b7ca1a
  title: Crédit renouvelable Ondine — quand changer ou monter en gamme
  body: 'Ce document aide le conseiller à orienter le client vers un produit plus
    adapté lorsque le Crédit renouvelable Ondine ne répond plus à ses besoins.


    **Critères de basculement**

    Le Crédit renouvelable Ondine est idéal pour des besoins ponctuels grâce à sa
    réserve disponible. Cependant, un changement est recommandé dans les cas suivants
    :


    - Montant du besoin > 3 000 € : La ligne de crédit maximale étant de 3 000 €,
    tout projet supérieur nécessite un Prêt personnel Ondine — présentation.

    - Durée de remboursement > 36 mois : Pour des financements s''étalant sur une
    période plus longue que le maximum de 36 mois autorisé, le prêt personnel est
    la solution appropriée.

    - Recherche de coût réduit : Pour un projet stable et planifié, le prêt personnel
    offre généralement un TAEG plus avantageux que les 19,9 % du crédit renouvelable.


    **Synthèse d''orientation**

    - Conserver le crédit renouvelable si : Le client a besoin d''une réserve flexible
    pour des imprévus.

    - Passer au prêt personnel si : Le client a un projet précis, un montant élevé
    ou souhaite réduire le coût total du crédit.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 41820c08-f3ae-58b5-b018-7a0d3a44b1ea
  title: Crédit renouvelable Ondine — comparaison avec les alternatives et quand ne
    pas le choisir
  body: 'Le Crédit renouvelable Ondine est conçu comme une réserve financière agile.
    Pour faire un choix responsable, il est essentiel de le comparer aux autres solutions
    de financement.


    **Comparaison avec le prêt personnel**

    Le crédit renouvelable se distingue par sa flexibilité : une fois la ligne de
    crédit (jusqu''à 3 000 €) accordée, vous disposez des fonds sans nouvelle demande.
    À l''inverse, le prêt personnel débloque la totalité de la somme en une fois pour
    un projet spécifique.


    **Quand choisir le Crédit renouvelable Ondine ?**

    Ce produit est pertinent si vous recherchez :

    - Une réserve disponible pour répondre à des besoins ponctuels et imprévisibles.

    - La possibilité de rembourser vos fonds à tout moment pour reconstituer votre
    réserve.

    - Un financement rapide pour des petits achats de consommation.


    **Quand NE PAS choisir ce produit ?**

    Nous vous conseillons de vous orienter vers une autre solution si :

    - Votre besoin dépasse 3 000 € : Ce produit est limité à ce plafond maximum.

    - Vous avez besoin d''un remboursement sur une durée très longue : Le remboursement
    maximum est fixé à 36 mois.

    - Vous recherchez le coût le plus bas possible pour un projet planifié : Avec
    un TAEG représentatif de 19,9 %, ce produit est plus coûteux qu''un prêt personnel
    classique pour un montant identique.


    **Exemple de coût pour aide au choix**

    Pour un montant utilisé de 1 000 € sur 12 mois, la mensualité est de 91,82 € et
    le coût total du crédit s''élève à 101,84 €. Ce montant reflète la flexibilité
    du service et la gestion du risque associée.


    Pour plus d''informations sur la structure des taux, consultez Crédit renouvelable
    Ondine — grille des taux.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8a62bec9-0d7d-5c26-ba12-8da36ecf80bc
  title: 'Crédit renouvelable Ondine — coût total du crédit dans l''exemple représentatif
    : explications'
  body: '**Que représente le montant de 101,84 € dans l''exemple représentatif ?**


    Le montant de 101,84 € correspond au coût total du crédit pour un emprunt de 1
    000 € remboursé sur 12 mois. C''est la somme totale des intérêts que vous payez
    à l''institution en échange du service de mise à disposition des fonds, calculée
    sur la base d''un TAEG de 19,9 %.


    **Ce coût est-il fixe pour chaque utilisation de ma réserve ?**

    Non. Le coût total dépendra du montant que vous débloquez, de la durée pendant
    laquelle vous conservez les fonds et de la rapidité de vos remboursements. Plus
    vous remboursez rapidement le capital, moins le coût total sera élevé.


    **Comment réduire ce coût ?**

    Vous pouvez effectuer des remboursements anticipés. Conformément à notre philosophie,
    ces frais sont strictement plafonnés par la loi pour vous garantir une flexibilité
    maximale et réduire vos frais d''intérêts.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 15449aee-cedf-51cf-a663-8a1c1b787eab
  title: Crédit renouvelable Ondine — traiter une demande courante de bout en bout
  body: 'Ce guide détaille la procédure complète pour effectuer un tirage (déblocage
    de fonds) depuis votre réserve de Crédit renouvelable Ondine.


    **Prérequis**

    - Posséder une ligne de crédit active.

    - Avoir un solde disponible suffisant sur votre réserve (maximum 3 000 €).


    **Étapes de la demande**


    1. Précisez le montant que vous souhaitez débloquer. Nous vérifierons immédiatement
    si ce montant est disponible sur votre ligne de crédit et s''il respecte le plafond
    maximum de 3 000 €.

    2. Procédez à l''authentification forte. Nous vous demanderons de valider l''opération
    via votre méthode de sécurisation habituelle pour confirmer votre identité avant
    tout mouvement de fonds.

    3. Indiquez le compte de destination pour les fonds. Nous confirmerons les coordonnées
    bancaires du compte sur lequel la somme doit être versée.

    4. Validez le plan de remboursement. Nous vous confirmerons la mensualité applicable
    en fonction du montant tiré, en vous rappelant que la durée maximale de remboursement
    est de 36 mois et que le TAEG est de 19,9 %.

    5. Confirmez l''opération finale. Nous traiterons alors le virement des fonds
    vers votre compte.


    **Confirmation du succès**

    L''opération est considérée comme réussie lorsque vous recevez la confirmation
    du virement et que vous constatez la mise à jour de votre solde disponible dans
    le suivi de votre compte.


    Pour consulter l''historique après l''opération, veuillez suivre la procédure
    décrite dans Crédit renouvelable Ondine — consulter le suivi ou l''historique.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 3dd7d5d1-885d-5ff8-8ac4-80e2ad18fb6a
  title: Crédit renouvelable Ondine — écart avec vos relevés
  body: 'Ce document aide le support à traiter les réclamations de clients constatant
    un écart entre leurs calculs personnels et les relevés du Crédit renouvelable
    Ondine.


    **Symptômes**

    - Le client estime que le montant des intérêts prélevés est supérieur à ses attentes.

    - Le solde restant dû ne semble pas diminuer proportionnellement aux remboursements
    effectués.

    - Un prélèvement SEPA apparaît comme incorrect sur le relevé.


    **Points de vérification et causes probables**


    1. Application du TAEG : Vérifiez que le client a bien pris en compte le TAEG
    de 19,9 %. Les intérêts sont calculés quotidiennement sur le capital restant dû,
    et non sur le montant initial du tirage.

    2. Décalage SEPA : Pour les prélèvements contestés, vérifiez la date de valeur.
    Rappelez au client que les contestations de prélèvements SEPA sont traitables
    sous huit semaines.

    3. Remboursements partiels : Si le client a effectué un remboursement anticipé,
    vérifiez que celui-ci a bien été déduit du capital avant le calcul des intérêts
    du mois suivant.

    4. Frais opérationnels : Assurez-vous que l''écart ne provient pas de frais justifiés
    par la gestion du risque ou des coûts opérationnels, conformément à notre grille
    tarifaire.


    **Résolution et Escalade**

    - Si l''écart est dû à une erreur de compréhension du client, fournissez une explication
    pédagogique sur le calcul des intérêts.

    - Si l''écart est avéré (erreur technique de calcul), procédez à une correction
    immédiate du solde.

    - Si le litige persiste ou concerne un montant important, escaladez le dossier
    vers le gestionnaire de compte, puis vers le responsable de la conformité si nécessaire.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: d108c3b6-9d45-5365-8ef9-3d925e395c65
  title: Crédit auto Ondine — présentation
  body: 'Le Crédit auto Ondine est un financement optimisé et spécifique pour l''acquisition
    d''un véhicule. Conçu pour accompagner vos projets de mobilité avec rigueur et
    transparence, ce produit vous permet de financer l''achat d''un véhicule neuf
    ou d''occasion tout en bénéficiant d''un cadre réglementaire sécurisant.


    Chez Ondine Crédit, nous nous engageons à une clarté absolue des coûts. Pour vous
    permettre d''évaluer la faisabilité de votre projet, nous vous proposons un exemple
    représentatif basé sur les conditions suivantes :


    Pour un montant emprunté de 20 000 € sur une durée de 60 mois, le Taux Annuel
    Effectif Global (TAEG) est de 4,9 %. Dans cette configuration, vos mensualités
    s''élèvent à 375,53 €, pour un coût total du crédit de 2 531,80 €.


    Les caractéristiques principales de ce financement sont les suivantes :

    - Montant minimum du prêt : 3 000 €

    - Durée maximale de remboursement : 84 mois

    - TAEG : 4,9 % (selon exemple représentatif)


    Nous appliquons une politique de financement responsable. Chaque demande fait
    l''objet d''une vérification rigoureuse de votre solvabilité afin de garantir
    que les mensualités sont compatibles avec vos capacités de remboursement. Conformément
    à la législation, vous disposez d''un délai de rétractation de 14 jours après
    la signature de votre contrat.


    Nous vous rappelons qu''un crédit engage vous et doit être remboursé. Nous nous
    engageons à ne jamais minimiser le coût total de l''opération et à vous fournir
    toutes les informations nécessaires pour un choix éclairé. Pour plus de détails
    sur les modalités de souscription, vous pouvez consulter le document Crédit auto
    Ondine — souscrire et activer.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8fd6117e-aafa-569d-b3e2-0cf30c62ee5d
  title: 'Crédit auto Ondine — TAEG de l''exemple représentatif : explications'
  body: 'Qu''est-ce que le TAEG de 4,9 % mentionné dans l''exemple du Crédit auto
    Ondine ?

    Le Taux Annuel Effectif Global (TAEG) est l''indicateur le plus complet pour comparer
    le coût de votre crédit. Le taux de 4,9 % indiqué dans notre exemple représentatif
    inclut non seulement les intérêts débiteurs, mais aussi tous les frais obligatoires
    liés à l''obtention du prêt. C''est ce taux qui permet de calculer le coût total
    du crédit, soit 2 531,80 € pour un emprunt de 20 000 € sur 60 mois.


    Ce taux est-il garanti pour tous les clients ?

    Le taux de 4,9 % est une valeur représentative. Le taux définitif qui vous sera
    proposé dépendra de l''analyse de votre dossier et de votre profil de risque.
    Toutefois, Ondine Crédit s''engage à ce que le TAEG soit toujours inférieur au
    taux d''usure fixé par la Banque de France.


    Pour comprendre comment ce taux s''applique à votre situation, veuillez vous référer
    à Crédit auto Ondine — grille des taux.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8b73264d-6d6f-5b4a-8b29-cf93fd3ebb4e
  title: Crédit auto Ondine — souscrire et activer
  body: 'L''obtention de votre Crédit auto Ondine suit un processus rigoureux visant
    à sécuriser votre engagement financier et à garantir la transparence de l''opération.


    Voici les étapes pour souscrire et activer votre financement :


    1. Définition du projet : Indiquez-nous le montant souhaité (minimum 3 000 €)
    et la durée de remboursement envisagée (jusqu''à 84 mois maximum). Précisez les
    caractéristiques du véhicule faisant l''objet du financement.


    2. Constitution du dossier : Fournissez-nous les pièces justificatives nécessaires.
    Une vérification d''identité rigoureuse est impérative. Nous vous demanderons
    une pièce d''identité valide ainsi que vos justificatifs de revenus et de domicile.


    3. Analyse de solvabilité : Nous procédons à l''étude de votre capacité de remboursement.
    Cette étape est fondamentale pour nous assurer que le crédit reste responsable
    et soutenable pour vous.


    4. Signature de l''offre : Une fois le dossier validé, nous vous transmettons
    l''offre de prêt détaillant le TAEG, la mensualité et le coût total du crédit.
    Vous signez le contrat via notre système d''authentification forte pour sécuriser
    la transaction.


    5. Délai de rétractation : Après la signature, vous disposez d''un délai légal
    de 14 jours pour annuler votre contrat sans pénalité.


    6. Déblocage des fonds : Une fois le délai de rétractation expiré ou après réception
    de votre demande de levée anticipée, nous procédons au déblocage des fonds selon
    les modalités convenues pour l''acquisition du véhicule.


    Vous saurez que l''opération est réussie lorsque vous recevrez la confirmation
    officielle de déblocage des fonds et que votre tableau d''amortissement sera disponible
    dans vos documents de compte.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 5d3cd320-d963-5edb-8682-e5ef19ba5d13
  title: Crédit auto Ondine — grille tarifaire
  body: 'La philosophie tarifaire d''Ondine Crédit repose sur la transparence et la
    justification des frais par la gestion du risque.


    Pour le Crédit auto Ondine, les coûts sont intégrés dans le TAEG. À titre d''illustration,
    pour un emprunt représentatif de 20 000 € sur une durée de 60 mois, le coût total
    du crédit s''élève à 2 531,80 €.


    Concernant les frais spécifiques :

    - Frais de dossier : Inclus dans le calcul du TAEG représentatif de 4,9 %.

    - Frais de remboursement anticipé : Ces frais sont strictement plafonnés conformément
    à la loi en vigueur pour garantir la flexibilité de l''emprunteur.

    - Frais de gestion : Intégrés au coût total du crédit.


    L''ensemble de ces coûts est détaillé dans l''offre de prêt individualisée remise
    avant signature. Pour toute question sur un montant spécifique, veuillez consulter
    Crédit auto Ondine — informations réglementaires.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 74da488c-ff4e-53c2-b8ed-9e705d989250
  title: Crédit auto Ondine — opération échouée ou en attente
  body: 'Il peut arriver que votre demande de Crédit auto Ondine soit marquée comme
    « échouée » ou reste « en attente » durant le processus de souscription. Voici
    comment identifier et résoudre ces situations.


    Symptômes courants :

    - Notification d''échec lors de l''envoi des pièces justificatives.

    - Statut « en attente » prolongé après la signature du contrat.

    - Refus immédiat lors de l''étape de vérification d''identité.


    Causes probables et vérifications :

    1. Validité des documents : Vérifiez que vos pièces d''identité sont en cours
    de validité et que les photos sont parfaitement lisibles. Un document flou peut
    entraîner un échec automatique de la vérification.

    2. Authentification forte : Assurez-vous que vos coordonnées mobiles sont à jour.
    Si l''authentification forte échoue, l''opération de signature restera en attente.

    3. Analyse de solvabilité : Si le dossier est en attente, il est possible que
    des informations complémentaires soient nécessaires pour finaliser l''étude de
    votre capacité de remboursement.


    Résolution et escalade :

    - Si l''échec persiste après avoir renouvelé l''envoi des documents, nous prendrons
    en charge votre dossier pour une analyse manuelle.

    - En cas de blocage technique, nous escaladons votre demande vers un gestionnaire
    de compte dédié qui reviendra vers vous sous 48 heures ouvrables.

    - Pour les dossiers complexes présentant un litige sur la solvabilité, le dossier
    est transmis au responsable de la conformité pour décision finale.


    Vous recevrez une notification par canal numérique dès que le statut de votre
    opération aura été mis à jour.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 2aa0d728-9769-5547-a512-20fd7849cb98
  title: Crédit auto Ondine — conditions d'éligibilité
  body: 'L''accès au Crédit auto Ondine est soumis au respect des critères suivants
    :


    | Critère | Condition Requise | Résultat |

    | :--- | :--- | :--- |

    | Montant du prêt | Minimum 3 000 € | Éligible si ≥ 3 000 € |

    | Durée du prêt | Maximum 84 mois | Éligible si ≤ 84 mois |

    | Identité | Vérification d''identité rigoureuse réussie | Obligatoire pour tout
    déblocage |

    | Solvabilité | Capacité de remboursement validée | Obligatoire pour l''octroi
    |

    | Statut FICP | Analyse du fichier national des incidents | Étude au cas par cas
    |

    | Résidence | Résidence fiscale dans la zone CET | Obligatoire |


    L''absence de validation de l''un de ces critères entraîne le refus systématique
    de l''octroi du crédit, conformément à notre posture de risque et de conformité.'
  domain: lending_mortgage
  product_category: credit_auto
