- id: e0806e76-00c6-51bf-aab6-a6a0ab0834a9
  title: Prêt personnel Ondine — frais ou montant inattendu
  body: 'Symptôme : Le client constate un montant prélevé supérieur à la mensualité
    habituelle ou l''apparition de frais non identifiés sur son relevé.


    Causes probables :

    1. Application de frais de remboursement anticipé suite à un versement volontaire.

    2. Intérêts de retard suite à un défaut de provision sur le compte de prélèvement.

    3. Erreur technique de calcul sur l''échéance.


    Procédure de vérification et résolution :

    1. Vérifier l''historique des opérations : Le client doit confirmer s''il a effectué
    un remboursement partiel ou total récemment. Si c''est le cas, vérifier que les
    frais appliqués respectent le plafond légal de 1 %.

    2. Contrôler la date du prélèvement : Vérifier si le prélèvement a été effectué
    après la date d''échéance contractuelle, ce qui pourrait expliquer des frais de
    retard.

    3. Comparer avec le tableau d''amortissement : Vérifier si le montant correspond
    à l''échéance prévue pour le mois concerné.


    Résolution et escalade :

    - Si l''erreur est identifiée comme technique, nous procédons immédiatement à
    la régularisation du montant sur la prochaine échéance ou via un virement correctif.

    - Si le client conteste la légitimité des frais malgré les explications, le dossier
    est escaladé vers un gestionnaire de compte pour une analyse approfondie.

    - En cas de litige persistant sur la conformité réglementaire des frais, le dossier
    est transmis au responsable de la conformité pour arbitrage final.


    Le client recevra une notification écrite détaillant la résolution du problème
    et, le cas échéant, le justificatif du remboursement des frais indus. Pour plus
    de détails sur les frais applicables, voir Prêt personnel Ondine — grille tarifaire.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 0a66a331-926e-5e25-9224-217a92eaa7bb
  title: Prêt personnel Ondine — justificatifs à fournir
  body: "Pour l'octroi d'un Prêt personnel Ondine, la constitution d'un dossier complet\
    \ est indispensable pour permettre la vérification de la solvabilité. \n\n| Type\
    \ de justificatif | Condition / Document requis | Résultat attendu |\n| :--- |\
    \ :--- | :--- |\n| Identité | Pièce d'identité officielle en cours de validité\
    \ (CNI, Passeport) | Validation de l'identité |\n| Domicile | Justificatif de\
    \ domicile de moins de 3 mois (Facture énergie, Télécom) | Validation de la résidence\
    \ |\n| Revenus | 3 derniers bulletins de salaire ou avis d'imposition | Évaluation\
    \ de la capacité de remboursement |\n| Engagements | Relevés bancaires des 3 derniers\
    \ mois | Analyse du taux d'endettement |\n\nL'absence d'un seul de ces documents\
    \ entraîne la suspension de l'étude du dossier. Une fois tous les justificatifs\
    \ reçus, nous confirmons la réception et lançons l'analyse de solvabilité. Pour\
    \ connaître les critères d'acceptation, consultez Prêt personnel Ondine — conditions\
    \ d'éligibilité."
