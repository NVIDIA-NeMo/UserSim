- id: ca4ec4a6-96ff-5ddf-8483-ec4ea32c2987
  title: Crédit renouvelable Ondine — face à une offre concurrente type
  body: 'Face à une offre de crédit renouvelable classique d''un établissement traditionnel,
    le Crédit renouvelable Ondine se distingue par sa transparence et sa structure
    agile.


    **Comparaison des dimensions clés**

    - **Coût :** Là où certaines offres concurrentes cachent des frais de dossier
    ou des assurances complexes, Ondine Crédit affiche un TAEG clair de 19,9 %, reflétant
    le coût total réel pour l''emprunteur.

    - **Accessibilité :** Notre plafond de 3 000 € est conçu pour des besoins ponctuels
    et responsables, évitant le surendettement lié à des lignes de crédit trop élevées.

    - **Flexibilité :** Nous offrons une durée de remboursement pouvant aller jusqu''à
    36 mois, avec des frais de remboursement anticipé strictement plafonnés par la
    loi.

    - **Rigueur :** Notre supervision par l''ACPR garantit que notre taux reste toujours
    inférieur au taux d''usure.


    **Quel produit choisir ?**

    - **L''offre concurrente** peut convenir à ceux recherchant des montants de réserve
    très élevés, malgré une opacité potentielle sur les frais annexes.

    - **Le Crédit renouvelable Ondine** est le choix privilégié pour les clients qui
    valorisent la clarté absolue des coûts, une gestion responsable et un partenaire
    financier transparent.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: d79f7664-44f2-5020-9124-2e253f041cca
  title: Crédit renouvelable Ondine — informations sur les risques
  body: '**Avertissement Légal : Un crédit vous engage et doit être remboursé. Vérifiez
    vos capacités de remboursement avant de vous engager.**


    L''utilisation du Crédit renouvelable Ondine, bien que flexible, comporte des
    risques financiers qu''il est essentiel de comprendre avant toute souscription.


    **Risque de coût élevé**

    Le crédit renouvelable est une solution de financement agile, mais son coût peut
    être supérieur à celui d''un prêt amortissable classique. Avec un TAEG représentatif
    de 19,9 %, le coût du crédit s''accumule sur chaque somme utilisée. Par exemple,
    pour un montant de 1 000 € utilisé sur 12 mois, le coût total du crédit s''élève
    à 101,84 €.


    **Risque de surendettement**

    La disponibilité immédiate d''une réserve allant jusqu''à 3 000 € peut inciter
    à des dépenses dépassant vos capacités réelles de remboursement. Une gestion non
    rigoureuse de ce produit peut mener à une situation d''insolvabilité.


    **Engagements de Ondine Crédit**

    Pour limiter ces risques, nous nous engageons à :

    - Appliquer strictement la vérification de la solvabilité avant toute mise à disposition
    de fonds.

    - Respecter le droit de rétractation de 14 jours.

    - Ne jamais promettre l''octroi d''un crédit et ne jamais minimiser son coût total.

    - Orienter systématiquement tout client rencontrant des difficultés durables vers
    la commission de surendettement.


    Ondine Crédit opère sous la supervision de l''ACPR et de la Banque de France,
    garantissant que les conditions d''octroi et les taux pratiqués respectent scrupuleusement
    la réglementation en vigueur.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 82a9181e-2b22-586e-aa6d-c26186c289c7
  title: Crédit renouvelable Ondine — calcul et application des taux
  body: 'Le Crédit renouvelable Ondine applique un taux unique et transparent pour
    l''ensemble de ses clients, justifié par la gestion du risque et les coûts opérationnels
    de l''établissement.


    **Taux applicable**

    Le TAEG (Taux Annuel Effectif Global) applicable est de 19,9 %.


    **Application du taux**

    Contrairement à un prêt personnel classique, les intérêts du crédit renouvelable
    ne sont calculés que sur la portion de la réserve effectivement utilisée. Si votre
    réserve de 3 000 € n''est pas utilisée, aucun intérêt n''est facturé.


    **Exemple de calcul**

    Pour un montant utilisé de 1 000 € sur une durée de 12 mois, le TAEG de 19,9 %
    génère un coût total du crédit de 101,84 €, ce qui se traduit par des mensualités
    de 91,82 €.


    **Évolutions du taux**

    Le taux est fixe pour la durée du contrat, sauf modification réglementaire majeure
    ou évolution du taux d''usure imposée par la Banque de France. Toute modification
    du taux fera l''objet d''une notification préalable conformément aux conditions
    générales.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 79538165-05cd-5413-a2fb-38324b3cbfa6
  title: Crédit renouvelable Ondine — offre de parrainage et de fidélité
  body: 'Ondine Crédit récompense votre confiance et celle de vos proches. Du 1er
    juin 2024 au 31 août 2024, nous proposons une offre de parrainage exclusive pour
    le Crédit renouvelable Ondine.


    Pour chaque nouveau client parrainé qui active sa réserve de crédit, vous recevez
    une prime de fidélité de 25 €, créditée directement sur votre compte. Le parrainé,
    de son côté, bénéficie d''une réduction de 10 € sur ses premiers frais de dossier.


    Le Crédit renouvelable Ondine reste l''outil idéal pour vos besoins ponctuels,
    avec une réserve pouvant atteindre 3 000 €. À titre d''exemple, pour un montant
    utilisé de 1 000 € sur 12 mois, la mensualité s''élève à 91,82 €, pour un coût
    total du crédit de 101,84 € et un TAEG de 19,9 %.


    C''est l''occasion d''allier flexibilité financière et avantages partagés. Nous
    vous invitons à consulter les conditions complètes de l''offre via votre espace
    client pour découvrir comment parrainer vos proches dès aujourd''hui.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: promo_notice
  source_authority: official
  placeholder: true
