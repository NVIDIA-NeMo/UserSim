- id: 690c0e74-e168-5649-a2fb-bf91ee8189bd
  title: Prêt personnel Ondine — protection contre la fraude et les opérations non
    autorisées
  body: "Chez Ondine Crédit, la sécurité de vos fonds et la protection de vos données\
    \ personnelles sont nos priorités absolues. Le Prêt personnel Ondine, en raison\
    \ de la nature des fonds débloqués, peut être la cible de tentatives de fraude\
    \ sophistiquées. \n\nNous attirons votre attention sur le fait que Ondine Crédit\
    \ ne vous demandera jamais, par téléphone, par e-mail ou par SMS, de communiquer\
    \ vos codes secrets, vos identifiants de connexion ou de valider une opération\
    \ de déblocage de fonds sans une procédure d'authentification forte préalable.\
    \ Soyez vigilants face aux appels prétendant provenir de notre service de conformité\
    \ et vous demandant de transférer des fonds vers un « compte de sécurisation »\
    \ pour débloquer votre prêt : il s'agit d'une fraude.\n\nPour sécuriser vos opérations,\
    \ nous appliquons une vérification d'identité rigoureuse avant toute modification\
    \ de l'état de votre compte ou tout déblocage de capital. L'authentification forte\
    \ est systématiquement exigée pour garantir que vous êtes le seul auteur des transactions\
    \ liées à votre financement.\n\nSi vous constatez une opération suspecte, un prélèvement\
    \ non autorisé ou si vous avez communiqué des informations confidentielles par\
    \ erreur, vous devez nous le signaler immédiatement. Une réaction rapide nous\
    \ permet d'adopter une posture de protection active de vos fonds et de procéder\
    \ au signalement des fraudes auprès des autorités compétentes. Pour les prélèvements\
    \ SEPA contestables, nous vous rappelons qu'ils peuvent être contestés dans un\
    \ délai de huit semaines.\n\nEn comparant notre offre à d'autres solutions, vous\
    \ constaterez que notre rigueur réglementaire et nos protocoles de sécurité stricts\
    \ sont conçus pour éliminer les ambiguïtés et protéger l'emprunteur contre les\
    \ risques d'usurpation d'identité. Nous vous recommandons de consulter régulièrement\
    \ vos relevés pour détecter toute anomalie.\n\nPour plus de détails sur la gestion\
    \ de vos accès, vous pouvez consulter le document Prêt personnel Ondine — bonnes\
    \ pratiques de sécurité du compte."
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f06c1481-26a4-5a42-9068-bd2e3b4a5b45
  title: Prêt personnel Ondine — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation du Prêt personnel
    Ondine. Ce contrat est conclu sous la supervision de l''ACPR et de la Banque de
    France, garantissant que le coût total du crédit reste transparent et conforme
    aux normes légales.


    Obligations de l''emprunteur : Vous vous engagez à rembourser le capital emprunté
    ainsi que les intérêts selon l''échéancier convenu. Toute modification de votre
    situation financière impactant votre solvabilité doit nous être signalée sans
    délai. Ondine Crédit applique strictement la vérification de la solvabilité avant
    l''octroi du crédit pour prévenir le surendettement.


    Droit de rétractation : Conformément à la loi, vous bénéficiez d''un délai de
    rétractation de 14 jours après la signature du contrat. Durant cette période,
    vous pouvez annuler votre engagement sans pénalité, moyennant le remboursement
    des sommes éventuellement perçues.


    Remboursement anticipé : Vous disposez de la flexibilité de rembourser tout ou
    partie de votre prêt avant son terme. Les frais de remboursement anticipé sont
    strictement plafonnés à 1 % conformément à la réglementation en vigueur, afin
    de ne pas pénaliser l''emprunteur souhaitant réduire sa dette.


    Modification et résiliation : Ondine Crédit se réserve le droit de modifier les
    présentes conditions, sous réserve de vous en informer préalablement. Le contrat
    prend fin au terme du remboursement intégral du capital, des intérêts et des éventuels
    frais annexes.


    En cas de difficultés de paiement durables, Ondine Crédit s''engage à vous orienter
    vers la commission de surendettement pour trouver une solution adaptée à votre
    situation. Pour toute question relative aux frais, veuillez vous référer au document
    Prêt personnel Ondine — grille tarifaire.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: a4266597-cdf0-5f7d-beb3-1af57a045448
  title: Prêt personnel Ondine — pour qui et pour quels usages
  body: 'Le Prêt personnel Ondine est conçu comme une solution de financement polyvalente
    et stable, idéale pour les particuliers souhaitant concrétiser un projet personnel
    sans restreindre l''usage des fonds.


    Pour qui est ce produit ?

    Ce prêt s''adresse aux emprunteurs recherchant un partenaire financier transparent,
    privilégiant la clarté des coûts et une gestion responsable. Il convient particulièrement
    à ceux qui préfèrent une structure de remboursement fixe et prévisible, loin de
    la volatilité d''autres produits de crédit.


    Pour quels usages ?

    Grâce à sa nature non affectée, vous pouvez utiliser les fonds pour une multitude
    de projets :

    - Travaux de rénovation ou d''aménagement intérieur.

    - Financement d''un événement familial ou personnel.

    - Consolidation de dettes pour simplifier vos mensualités.

    - Acquisition d''équipements divers.


    Caractéristiques principales :

    - Montant minimum : Vous pouvez solliciter un financement à partir de 1 000 €.

    - Montant maximum : Nous accompagnons vos projets jusqu''à un plafond de 75 000
    €.

    - Flexibilité : Vous conservez la possibilité d''effectuer des remboursements
    anticipés, avec des frais plafonnés à 1 %.


    Notre approche pédagogique vous permet de comprendre exactement l''impact de votre
    emprunt sur votre budget. Nous ne promettons jamais l''octroi d''un crédit avant
    l''étude complète de votre dossier, car la vérification de votre solvabilité est
    l''étape cruciale pour garantir un endettement responsable.


    Pour comprendre comment nous déterminons vos mensualités, nous vous invitons à
    lire le document Prêt personnel Ondine — présentation.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: e36c6a44-2453-5a69-8f2a-3532bfc7b6b2
  title: 'Prêt personnel Ondine — montant de l''exemple représentatif : explications'
  body: 'Question : Pourquoi utilisez-vous un montant de 10 000 € dans vos exemples
    représentatifs ?


    Réponse : Le montant de 10 000 € est utilisé comme base de calcul standard pour
    vous offrir une vision claire et pédagogique du coût d''un crédit. Ce montant
    est représentatif d''un besoin de financement courant pour la majorité de nos
    clients. Il permet d''illustrer concrètement l''application du TAEG de 5,9 % sur
    une durée de 48 mois, aboutissant à une mensualité de 233,69 € et un coût total
    du crédit de 1 217,12 €.


    Question : Ce montant est-il obligatoire pour ma demande ?


    Réponse : Absolument pas. Le Prêt personnel Ondine est flexible : vous pouvez
    emprunter tout montant compris entre 1 000 € et 75 000 €, selon vos besoins et
    votre capacité de remboursement validée lors de l''étude de solvabilité. L''exemple
    à 10 000 € sert uniquement de point de comparaison pour vous aider à évaluer le
    coût global d''un emprunt chez nous.


    Pour plus de détails sur le coût total, consultez Prêt personnel Ondine — coût
    total du crédit dans l''exemple représentatif : explications.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: faq
  source_authority: official
