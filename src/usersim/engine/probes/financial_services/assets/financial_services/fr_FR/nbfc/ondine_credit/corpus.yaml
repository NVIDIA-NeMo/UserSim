- id: 4bd29e39-1b82-5d1e-b77b-24c192bdceba
  title: Paiement en 3 ou 4 fois Ondine — confidentialité et protection des données
  body: 'Ondine Crédit s''engage à protéger vos données personnelles conformément
    au RGPD et sous la supervision rigoureuse de l''ACPR et de la Banque de France.


    Collecte et Utilisation des Données :

    Pour chaque demande de Paiement en 3 ou 4 fois Ondine, nous collectons les données
    nécessaires à la vérification de votre identité et à l''évaluation de votre solvabilité.
    Cette étape est impérative pour garantir un crédit responsable et éviter tout
    risque de surendettement. Nous traitons vos données pour vérifier que l''achat,
    compris entre 100 € et 3 000 €, est compatible avec vos capacités financières.


    Sécurité du Traitement :

    L''utilisation de l''authentification forte est systématiquement exigée pour sécuriser
    l''accès à vos données et valider vos transactions. Vos informations sont cryptées
    et ne sont jamais transmises à des tiers à des fins commerciales.


    Vos Droits :

    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Vous pouvez également exercer votre droit de rétractation
    de 14 jours après la souscription, ce qui entraînera l''annulation du contrat
    et le traitement des données associé à l''opération.


    Transparence Tarifaire :

    Nous vous informons que les frais de 2,2 % appliqués à votre crédit sont justifiés
    par la gestion du risque et les coûts opérationnels de l''établissement. Ce coût
    est clairement indiqué avant toute validation.


    En cas de litige concernant le traitement de vos données, vous pouvez saisir la
    Commission Nationale de l''Informatique et des Libertés (CNIL) ou nous contacter
    pour une résolution rapide via notre gestionnaire de compte.'
  domain: payments
  product_category: paiement_fractionne
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 3f7c982a-7ce6-5a71-b66b-8be3a5f77792
  title: Paiement en 3 ou 4 fois Ondine — reconnaître les arnaques visant ce produit
  body: 'Le Paiement en 3 ou 4 fois Ondine est une solution agile, mais sa simplicité
    peut être exploitée par des acteurs malveillants. Pour protéger vos fonds et vos
    données, il est essentiel de savoir identifier les tentatives de fraude.


    Les fraudeurs utilisent souvent des techniques d''ingénierie sociale pour vous
    inciter à partager des informations sensibles. Méfiez-vous particulièrement des
    scénarios suivants :


    1. L''offre de « plafond exceptionnel » : Un individu prétendant être un agent
    d''Ondine Crédit vous contacte pour vous proposer d''augmenter votre limite d''achat
    au-delà des 3 000 € réglementaires en échange de frais d''activation immédiats.
    Ondine Crédit ne propose jamais de modification de plafond via un appel non sollicité.

    2. La demande de codes de sécurité : On vous demande votre code secret ou un code
    de validation reçu par SMS pour « débloquer » un paiement fractionné. Rappelez-vous
    que l''authentification forte est un processus sécurisé que vous validez vous-même
    ; nous ne vous demanderons jamais de nous communiquer ces codes.

    3. Les sites de vente frauduleux : Certains sites imitent l''interface de paiement
    d''Ondine pour vous faire croire que vous payez en plusieurs fois, alors qu''ils
    capturent l''intégralité de vos coordonnées bancaires.


    Ce qu''il faut retenir : Ondine Crédit ne vous demandera jamais vos identifiants
    de connexion, vos mots de passe ou vos codes de sécurité par téléphone ou par
    e-mail. Toute demande d''argent pour « garantir » l''accès au Paiement en 3 ou
    4 fois Ondine est une tentative d''escroquerie.


    Si vous constatez une anomalie ou si vous avez communiqué des informations sensibles,
    signalez-le nous immédiatement. Nous procéderons au blocage sécurisé de vos accès
    et, si nécessaire, au signalement de la fraude aux autorités compétentes pour
    protéger vos avoirs.'
  domain: payments
  product_category: paiement_fractionne
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 7ef74305-a536-5c70-86d0-aaa41ff65751
  title: Paiement en 3 ou 4 fois Ondine — plafonds, restrictions et cas particuliers
  body: 'Cette fiche technique détaille les limites opérationnelles et les restrictions
    applicables au Paiement en 3 ou 4 fois Ondine. Elle est destinée aux agents d''assistance
    pour garantir une information précise lors de l''accompagnement des clients.


    **Plafonds de transaction**

    Le produit est strictement encadré par des seuils de montant d''achat :

    - Montant minimum d''achat : 100 €. Toute transaction inférieure à ce seuil ne
    peut pas être fractionnée et doit être réglée au comptant.

    - Montant maximum d''achat : 3 000 €. Au-delà de ce montant, le client doit s''orienter
    vers des solutions de financement à plus long terme.


    **Restrictions d''usage**

    Le fractionnement du paiement n''est pas autorisé pour les catégories de dépenses
    suivantes :

    - Les jeux d''argent et les paris en ligne.

    - Le paiement d''impôts ou de taxes gouvernementales.

    - Les transferts de fonds vers des tiers.


    **Cas particuliers et conditions de blocage**

    Le déblocage des fonds et la validation du fractionnement sont conditionnés par
    :

    - Une vérification d''identité rigoureuse et à jour.

    - Le passage réussi d''une analyse de solvabilité stricte, conformément aux directives
    de l''ACPR.

    - L''utilisation systématique de l''authentification forte pour sécuriser la transaction.


    En cas de dépassement du plafond de 3 000 € ou de tentative d''achat sous les
    100 €, le système rejettera automatiquement la demande de fractionnement. L''agent
    doit alors inviter le client à ajuster son panier ou à consulter les alternatives
    de financement disponibles au sein de l''institution.'
  domain: payments
  product_category: paiement_fractionne
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 4eb7868a-a209-5763-b71e-682c724bad39
  title: Paiement en 3 ou 4 fois Ondine — coûts et frais
  body: 'Découvrez comment sont calculés les coûts liés à l''utilisation de notre
    solution de paiement agile.


    **Quel est le coût du Paiement en 3 ou 4 fois Ondine ?**

    L''utilisation de ce service entraîne l''application de frais fixes correspondant
    à un taux de 2,2 % du montant total de l''achat. Ces frais sont transparents et
    justifiés par la gestion du risque et les coûts opérationnels de l''institution.


    **Comment sont appliqués ces frais de 2,2 % ?**

    Les frais sont calculés sur la base du montant total de votre commande. Par exemple,
    pour un achat de 1 000 €, les frais s''élèveront à 22 €. Ce montant est ajouté
    au coût total de l''achat et réparti sur vos mensualités.


    **Y a-t-il d''autres frais cachés ?**

    Non. Ondine Crédit s''engage à une clarté absolue. En dehors des frais de service
    de 2,2 %, aucun autre coût n''est appliqué pour le fractionnement standard, sous
    réserve du respect des échéances de paiement.


    Pour plus de détails sur la structure tarifaire, vous pouvez consulter le document
    Paiement en 3 ou 4 fois Ondine — grille tarifaire.'
  domain: payments
  product_category: paiement_fractionne
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ea79987e-0a38-56ee-8842-9d39b30d9baf
  title: Paiement en 3 ou 4 fois Ondine — consulter le suivi ou l'historique
  body: 'Pour garder une maîtrise totale de votre budget, nous vous permettons de
    suivre précisément l''état de vos remboursements pour chaque achat fractionné.


    **Éléments nécessaires avant de commencer**

    - Votre accès sécurisé à votre compte Ondine Crédit.

    - L''authentification forte active sur votre appareil.


    **Étapes pour consulter votre historique**


    1. Demandez-nous l''affichage de vos transactions fractionnées en cours ou passées.
    Nous vous présenterons la liste complète de vos achats ayant fait l''objet d''un
    paiement en 3 ou 4 fois.

    2. Sélectionnez la transaction spécifique que vous souhaitez analyser. Nous vous
    fournirons alors le détail du plan de remboursement, incluant le montant initial
    de l''achat, les frais de 2,2 % appliqués et le montant total dû.

    3. Examinez le calendrier des échéances. Vous verrez précisément quelles mensualités
    ont déjà été prélevées et quelles sont les dates des prochains prélèvements à
    venir.

    4. Vérifiez le solde restant dû. Nous vous confirmerons le montant exact qu''il
    vous reste à rembourser pour clore ce financement spécifique.


    **Comment savoir si l''opération a réussi ?**

    Vous avez réussi la consultation lorsque vous visualisez le récapitulatif détaillé
    de votre plan de remboursement et que vous pouvez confirmer la date et le montant
    de votre prochaine échéance.'
  domain: payments
  product_category: paiement_fractionne
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 349cb585-5e27-5eb6-bae1-de25e9dc7201
  title: Paiement en 3 ou 4 fois Ondine — opération refusée ou bloquée
  body: 'Il peut arriver que votre demande de paiement fractionné soit refusée lors
    de la validation de votre achat. Voici comment identifier la cause et résoudre
    la situation.


    **Symptômes**

    Le message « Opération refusée » ou « Produit non éligible » s''affiche au moment
    de choisir le paiement en 3 ou 4 fois lors du règlement.


    **Causes possibles et vérifications**


    1. Non-respect des seuils de montant : Vérifiez que le montant total de votre
    achat est compris entre 100 € (minimum) et 3 000 € (maximum). Si le montant est
    de 99 € ou de 3 001 €, l''option sera systématiquement bloquée.

    2. Échec de la vérification de solvabilité : Conformément à notre rigueur réglementaire,
    nous appliquons une vérification stricte de la solvabilité. Un refus peut survenir
    si vos capacités de remboursement actuelles sont jugées insuffisantes.

    3. Problème d''identité ou de sécurité : L''opération peut être bloquée si vos
    documents d''identité sont expirés ou si l''authentification forte a échoué.

    4. Nature de l''achat : Assurez-vous que l''achat ne concerne pas des domaines
    restreints (jeux d''argent, impôts).


    **Résolution**

    - Si le montant est hors limites : Ajustez le contenu de votre panier pour atteindre
    la fourchette 100 € - 3 000 €.

    - Si l''identité est en cause : Mettez à jour vos justificatifs via notre service
    de vérification.

    - Si la solvabilité est en cause : Nous vous invitons à revoir vos capacités financières
    ou à consulter un autre produit mieux adapté.


    **Quand escalader ?**

    Si vous estimez que toutes les conditions sont remplies et que le blocage persiste,
    nous ouvrirons un dossier d''analyse auprès de notre équipe de conformité. Vous
    recevrez une réponse sous 48 heures ouvrables.'
  domain: payments
  product_category: paiement_fractionne
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 5042b5b2-ca95-5d9a-809a-1310595abdd3
  title: Paiement en 3 ou 4 fois Ondine — quand changer ou monter en gamme
  body: 'Le Paiement en 3 ou 4 fois Ondine est conçu pour l''agilité et les achats
    de consommation courante. Toutefois, selon les besoins du client, un changement
    de produit peut être nécessaire.


    **Passage vers un produit supérieur**

    L''agent doit recommander un changement de produit dans les cas suivants :

    - Dépassement du plafond : Si le projet du client excède 3 000 €, le paiement
    fractionné n''est plus applicable. Il convient alors de s''orienter vers le Prêt
    personnel Ondine — présentation.

    - Besoin de flexibilité temporelle : Si le client souhaite étaler son remboursement
    sur une durée plus longue que 4 mois, le crédit personnel est la solution adaptée
    pour réduire la mensualité.

    - Besoins récurrents : Pour un client ayant des besoins de financement ponctuels
    et fréquents, le Crédit renouvelable Ondine — présentation offre une réserve disponible
    sans nouvelle souscription à chaque achat.


    **Résumé du choix**

    - Paiement en 3 ou 4 fois : Idéal pour les achats entre 100 € et 3 000 € avec
    un coût fixe de 2,2 %.

    - Prêt personnel / Crédit renouvelable : Idéal pour des montants > 3 000 € ou
    des durées de remboursement prolongées.'
  domain: payments
  product_category: paiement_fractionne
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 540b186c-1c07-5e10-954a-6825ac6302ac
  title: Paiement en 3 ou 4 fois Ondine — comparaison avec les alternatives et quand
    ne pas le choisir
  body: 'Le Paiement en 3 ou 4 fois Ondine est une solution de financement agile pour
    vos achats de consommation. Pour faire un choix éclairé, il est important de comparer
    ce produit avec d''autres options.


    **Pourquoi choisir le Paiement en 3 ou 4 fois Ondine ?**

    Ce produit est privilégié pour sa rapidité et sa transparence. Avec des frais
    fixes de 2,2 %, vous connaissez immédiatement le coût total de l''opération sans
    calcul complexe de TAEG sur longue durée. C''est l''outil idéal pour des achats
    compris entre 100 € et 3 000 €.


    **Quand ne pas choisir ce produit ?**


    1. Pour les petits achats : Si votre commande est inférieure à 100 €, ce produit
    n''est pas disponible. Vous devrez régler l''intégralité au comptant.

    2. Pour les investissements majeurs : Si votre achat dépasse 3 000 €, le plafond
    du produit est atteint. Dans ce cas, un prêt personnel serait plus approprié pour
    bénéficier d''un montant plus élevé et d''un étalement plus long.

    3. Pour un besoin de trésorerie global : Si vous avez besoin de fonds pour plusieurs
    projets différents plutôt qu''un seul achat précis, une réserve de crédit serait
    plus flexible.


    **Comparaison synthétique**

    - Coût : Frais fixes de 2,2 %, très compétitifs pour un court terme.

    - Accessibilité : Très rapide, sous réserve de solvabilité.

    - Limites : Strictement limité à une plage de 100 € à 3 000 €.


    En résumé, choisissez le Paiement en 3 ou 4 fois Ondine pour sa simplicité sur
    des achats modérés. Pour tout besoin dépassant 3 000 €, nous vous recommandons
    de consulter le Prêt personnel Ondine — présentation.'
  domain: payments
  product_category: paiement_fractionne
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 309d66a2-da7e-58ec-86ff-681d68e84c1b
  title: Paiement en 3 ou 4 fois Ondine — éligibilité et souscription
  body: 'Vous souhaitez utiliser le paiement fractionné pour votre prochain achat
    ? Voici les réponses à vos questions sur l''éligibilité.


    **Qui peut souscrire au Paiement en 3 ou 4 fois Ondine ?**

    Ce service est accessible aux clients Ondine Crédit dont le projet d''achat se
    situe entre 100 € et 3 000 €. L''octroi est soumis à une vérification rigoureuse
    de votre solvabilité pour garantir un endettement responsable.


    **Quelles sont les étapes de souscription ?**

    La souscription se fait en temps réel lors de votre achat. Après avoir sélectionné
    l''option, vous devrez passer par une étape d''authentification forte. Nous analysons
    alors votre dossier et vous confirmons l''accord immédiatement.


    **Quels documents sont nécessaires ?**

    L''accès au service nécessite une identité vérifiée et à jour dans nos dossiers.
    Si vos documents sont obsolètes, nous vous demanderons de les mettre à jour avant
    de valider le fractionnement.


    Pour plus de détails sur les conditions d''accès, veuillez consulter le document
    Paiement en 3 ou 4 fois Ondine — conditions d''éligibilité.'
  domain: payments
  product_category: paiement_fractionne
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 5a422e3f-f5e1-513d-ab6d-8c80e50d74c7
  title: Paiement en 3 ou 4 fois Ondine — traiter une demande courante de bout en
    bout
  body: 'L''utilisation du Paiement en 3 ou 4 fois Ondine est conçue pour être fluide
    et rapide lors de vos achats. Voici le processus complet, de la sélection à la
    confirmation.


    **Prérequis**

    - Un achat dont le montant total est compris entre 100 € et 3 000 €.

    - Un compte Ondine Crédit actif avec une identité vérifiée.


    **Étapes de traitement**


    1. Sélectionnez l''option « Paiement en 3 ou 4 fois Ondine » lors de la validation
    de votre panier d''achat. Nous vérifierons immédiatement si le montant (entre
    100 € et 3 000 €) est éligible.

    2. Validez l''authentification forte via votre appareil sécurisé. Cette étape
    est impérative pour confirmer que vous êtes bien l''auteur de la transaction.

    3. Examinez la proposition de remboursement que nous vous soumettons. Elle détaillera
    le montant principal, les frais de service de 2,2 % et l''échéancier précis (3
    ou 4 mensualités).

    4. Confirmez votre accord sur le plan de remboursement. Nous procéderons alors
    au déblocage des fonds auprès du marchand.

    5. Recevez la confirmation finale de la transaction. Vous recevrez un récapitulatif
    incluant la date du premier prélèvement et le montant total incluant les frais.


    **Comment savoir si l''opération a réussi ?**

    L''opération est réussie lorsque vous recevez la confirmation de paiement et que
    le marchand valide votre commande. Vous pourrez ensuite retrouver le suivi détaillé
    de vos échéances dans votre historique.'
  domain: payments
  product_category: paiement_fractionne
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f8fd588d-1c33-500c-adb6-1a1b1b01cfd7
  title: Paiement en 3 ou 4 fois Ondine — écart avec vos relevés
  body: 'Certains clients peuvent noter une différence entre le prix affiché par le
    marchand et le montant total prélevé sur leurs relevés Ondine. Voici comment analyser
    et résoudre cet écart.


    **Symptôme**

    Le client signale que la somme des mensualités prélevées est supérieure au prix
    d''achat initial du produit.


    **Causes probables et vérifications**


    1. Application des frais de service : La cause la plus fréquente est l''omission
    des frais de 2,2 % dans le calcul du client. L''agent doit vérifier si le montant
    total prélevé correspond bien à : [Montant de l''achat] + [Montant de l''achat
    × 2,2 %].

    2. Arrondis comptables : Selon le nombre de mensualités (3 ou 4), des micro-écarts
    de centimes peuvent apparaître sur la dernière mensualité pour solder exactement
    le compte.

    3. Erreur de prélèvement : Dans des cas plus rares, un double prélèvement ou un
    montant erroné peut être appliqué.


    **Résolution**

    - Si l''écart est dû aux frais : Expliquez pédagogiquement au client que le service
    de fractionnement inclut des frais de 2,2 % pour couvrir la gestion du risque
    et les coûts opérationnels, comme stipulé lors de la souscription.

    - Si l''écart est un arrondi : Confirmez que le montant total final correspond
    au contrat et que la dernière échéance a été ajustée pour solder le prêt.

    - Si l''écart est une erreur réelle : Initiez une procédure de correction immédiate
    et informez le client du délai de régularisation.


    **Quand escalader ?**

    Si le client conteste la légitimité des frais malgré vos explications ou si l''écart
    financier est significatif et inexpliqué, le dossier doit être escaladé vers le
    responsable de la conformité pour un audit détaillé du contrat.'
  domain: payments
  product_category: paiement_fractionne
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 760f2c09-7c6d-51f7-a607-98f24a07d4b4
  title: Frais et tarifs de l'établissement
  body: 'Chez Ondine Crédit, nous nous engageons à une transparence totale concernant
    nos coûts. Nos frais sont justifiés par la gestion rigoureuse du risque et les
    coûts opérationnels nécessaires au maintien de notre infrastructure numérique.


    Certains frais s''appliquent de manière uniforme à l''ensemble de nos comptes
    et services, tandis que d''autres varient selon la nature du produit souscrit.
    Pour chaque produit, une grille tarifaire spécifique est disponible pour détailler
    les coûts associés.


    Conformément à la législation en vigueur, les frais de remboursement anticipé
    sont strictement plafonnés afin de garantir la flexibilité de l''emprunteur et
    de ne pas pénaliser la gestion responsable de ses dettes. Nous vous invitons à
    consulter les documents détaillés pour chaque solution de financement pour obtenir
    la liste exhaustive des tarifs applicables à votre situation.'
  domain: lending_mortgage
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 0bf0699d-ed1b-5b76-a7f9-89e84ecb6525
  title: Questions fréquentes
  body: 'Comment puis-je contacter l''assistance d''Ondine Crédit ?

    L''assistance est accessible via nos canaux numériques et par téléphone durant
    les heures ouvrables (CET).


    Que se passe-t-il si mon dossier est complexe ou si je souhaite contester une
    opération ?

    Les dossiers complexes ou les litiges sont systématiquement escaladés vers un
    gestionnaire de compte, puis, si nécessaire, vers le responsable de la conformité
    pour une résolution diligente.


    Quelles sont les conditions pour modifier mes informations personnelles ou débloquer
    des fonds ?

    Une vérification d''identité rigoureuse est impérative avant toute opération modifiant
    l''état du compte ou tout déblocage de fonds. L''authentification forte est systématiquement
    exigée pour sécuriser vos transactions et vos données personnelles.


    Pour plus de détails sur les procédures de gestion, veuillez vous référer aux
    documents de politique interne de l''établissement.'
  domain: lending_mortgage
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ba7acc06-9f33-5135-88fc-f5b525f27886
  title: 'Notes réglementaires : crédits et prêts immobiliers'
  body: 'Ondine Crédit opère sous la supervision stricte de l''ACPR et de la Banque
    de France. Cette gouvernance garantit que toutes nos opérations de crédit respectent
    les normes de protection des consommateurs et de stabilité financière.


    L''établissement s''engage à ce que le Taux Annuel Effectif Global (TAEG) soit
    toujours inférieur au taux d''usure légal en vigueur. Nous appliquons une vérification
    rigoureuse de la solvabilité de chaque demandeur avant tout octroi de crédit,
    afin de prévenir le surendettement.


    Conformément au Code de la consommation, tout emprunteur bénéficie d''un droit
    de rétractation de « 14 » jours suivant l''acceptation du contrat, lui permettant
    d''annuler son engagement sans pénalité.


    En cas de difficultés financières durables, Ondine Crédit a l''obligation d''orienter
    activement le client vers la commission de surendettement compétente pour trouver
    des solutions pérennes.


    *** AVERTISSEMENT LÉGAL ***

    Un crédit vous engage et doit être remboursé. Vérifiez vos capacités de remboursement
    avant de vous engager.


    L''agent doit s''assurer que ces mentions sont claires et que le client a bien
    compris le coût total du crédit. Ondine Crédit ne promet jamais l''octroi d''un
    crédit avant l''étude de solvabilité et ne minimise jamais le coût total des opérations.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 69adab2d-7414-5de9-bce5-df30af478f53
  title: 'Notes réglementaires : paiements'
  body: 'La gestion des flux de paiement chez Ondine Crédit est régie par les normes
    SEPA et les directives européennes sur les services de paiement (DSP2).


    En matière de contestation, les prélèvements SEPA contestables sont traités avec
    diligence. Le client dispose d''un délai maximal de huit semaines pour contester
    un prélèvement autorisé. En cas de prélèvement non autorisé, les délais de contestation
    sont étendus selon la réglementation en vigueur.


    L''établissement adopte une posture de protection active des fonds des clients.
    Toute suspicion de fraude entraîne un signalement rapide aux autorités compétentes
    et le blocage conservatoire des fonds si la sécurité du compte est compromise.


    L''authentification forte (SCA - Strong Customer Authentication) est systématiquement
    exigée pour toutes les transactions initiées numériquement. Cette mesure est indispensable
    pour sécuriser les données personnelles et prévenir les opérations frauduleuses.


    L''agent a l''obligation de collecter les preuves de la contestation et de transmettre
    le dossier au responsable de la conformité pour tout litige relatif aux paiements
    qui ne peut être résolu via les procédures standard de remboursement.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 06e1a5db-f8d5-5112-a7c6-8afa79e95870
  title: Quand utiliser withdraw_from_credit
  body: 'L''outil withdraw_from_credit doit être utilisé exclusivement pour permettre
    à un client d''exercer son droit légal de rétractation sur un contrat de crédit.
    Cette action est possible uniquement si la demande intervient dans le délai légal
    de « 14 » jours suivant l''acceptation du contrat.


    La procédure d''exécution est la suivante :


    1. Vérification d''identité : L''agent doit impérativement effectuer une vérification
    d''identité complète du client avant toute manipulation.

    2. Identification du compte : L''agent utilise l''outil get_accounts pour identifier
    le compte de crédit concerné en se basant sur les informations fournies par le
    client (par exemple, les quatre derniers chiffres du compte).

    3. Validation du délai : L''agent vérifie via les détails du prêt que la date
    actuelle se situe bien dans la fenêtre des « 14 » jours suivant la signature.

    4. Exécution : L''agent appelle l''outil withdraw_from_credit pour annuler le
    contrat.


    L''agent ne doit jamais rediriger le client vers un formulaire externe pour cette
    opération ; l''action doit être finalisée directement dans la conversation via
    l''outil. Une fois l''outil exécuté, l''agent doit confirmer au client que la
    rétractation a été enregistrée et l''informer des modalités de remboursement des
    fonds s''ils ont déjà été débloqués.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_from_credit
  institution_id: ondine_credit
- id: 8b23875e-2f71-515b-a1b2-8c923de9aa7d
  title: Référence de l'outil withdraw_from_credit
  body: 'L''outil `withdraw_from_credit` permet d''exercer le droit de rétractation
    sur un contrat de crédit dans le délai de « 14 » jours suivant son acceptation.


    Signature de l''outil :

    - Paramètres : L''outil requiert l''identifiant du compte de crédit concerné.


    L''agent effectue cette action en appelant l''outil directement après avoir vérifié
    l''identité du client et identifié le compte via `get_accounts`. L''effet de l''outil
    est l''annulation immédiate et irréversible du contrat de crédit, entraînant la
    cessation des obligations futures de l''emprunteur et le déclenchement du processus
    de restitution des fonds si nécessaire.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_from_credit
  institution_id: ondine_credit
- id: a640363f-6909-5d1c-9333-009c942a60c6
  title: Quand utiliser open_account
  body: 'L''outil open_account est utilisé spécifiquement pour l''ouverture d''un
    produit de Crédit renouvelable Ondine. Cette action intervient après que le client
    a reçu et accepté une offre de crédit préalable, soumise à une étude de solvabilité
    positive.


    La procédure d''exécution est la suivante :


    1. Vérification d''identité : L''agent doit réaliser une vérification d''identité
    rigoureuse conformément aux standards de sécurité d''Ondine Crédit.

    2. Confirmation de l''offre : L''agent s''assure que l''offre de crédit a été
    formellement acceptée par le client et que le délai de réflexion éventuel est
    respecté.

    3. Collecte des informations : L''agent recueille les détails nécessaires à l''ouverture
    (nom complet, date de naissance, contact).

    4. Exécution : L''agent appelle l''outil open_account pour activer la réserve
    de crédit.


    L''ouverture d''un compte de crédit renouvelable engage le client. L''agent doit
    rappeler que l''utilisation de cette réserve est flexible mais soumise aux taux
    et conditions détaillés dans l''offre. L''action est finalisée par l''appel direct
    à l''outil dans la conversation, sans renvoi vers un portail externe.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: ondine_credit
- id: ca65a01c-8acc-5729-b576-1f6560816393
  title: Référence de l'outil open_account
  body: 'L''outil `open_account` permet l''ouverture d''un compte de Crédit renouvelable
    Ondine après l''acceptation de l''offre de crédit.


    Signature de l''outil :

    - Paramètres : L''outil requiert les informations d''identification du client
    (nom complet, date de naissance, contact) telles que fournies durant la conversation.


    L''agent effectue l''ouverture du compte en appelant l''outil directement. L''effet
    est la création du compte de crédit et la mise à disposition de la réserve financière
    selon les plafonds définis dans l''offre acceptée.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: ondine_credit
- id: feb09416-5670-5acb-ae5d-23f21078e56c
  title: Quand utiliser close_account
  body: 'L''outil close_account est utilisé dans deux scénarios distincts : la résiliation
    d''un Crédit renouvelable Ondine ou la clôture d''un compte de crédit dont la
    totalité du capital a été remboursée.


    La procédure d''exécution est la suivante :


    1. Vérification d''identité : L''agent doit impérativement vérifier l''identité
    du client avant toute demande de clôture.

    2. Analyse de l''état du compte : L''agent utilise l''outil get_accounts pour
    identifier le compte et l''outil get_loan_details pour vérifier le solde restant
    dû. La clôture n''est possible que si le solde est nul ou si le produit est un
    crédit renouvelable dont la résiliation est demandée.

    3. Confirmation : L''agent confirme au client que la clôture est définitive et
    irréversible.

    4. Exécution : L''agent appelle l''outil close_account pour finaliser la fermeture
    du compte.


    Si le compte présente un solde débiteur, l''agent doit d''abord orienter le client
    vers le paiement des sommes dues via l''outil pay_emi avant de pouvoir procéder
    à la clôture. L''action doit être réalisée directement par l''agent via l''outil.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: ondine_credit
- id: 2d98cff7-d5c9-527e-bc94-561a464cff50
  title: Référence de l'outil close_account
  body: 'L''outil `close_account` permet de résilier un Crédit renouvelable Ondine
    ou de clôturer un compte de crédit entièrement remboursé.


    Signature de l''outil :

    - Paramètres : L''outil requiert l''identifiant du compte à clôturer.


    L''agent effectue cette action en appelant l''outil directement après avoir vérifié
    l''identité du client et confirmé que le solde du compte permet la fermeture (solde
    à 0 € pour les prêts classiques). L''effet est la clôture définitive du compte
    et l''arrêt de toute activité liée à ce contrat.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: ondine_credit
- id: 08494725-0813-5fa4-afe3-66af702cff16
  title: Quand utiliser request_payment_deferral
  body: 'L''outil request_payment_deferral est destiné aux clients rencontrant des
    difficultés financières passagères et souhaitant éviter un défaut de paiement.
    Conformément à notre posture d''accompagnement responsable, Ondine Crédit permet
    d''ajuster temporairement la charge mensuelle pour soutenir l''emprunteur dans
    une phase de transition.


    Cet outil doit être utilisé lorsque le client exprime une incapacité temporaire
    à honorer sa prochaine échéance ou lorsqu''il souhaite réduire le montant de ses
    mensualités pour une période définie. Il est crucial de distinguer une difficulté
    ponctuelle d''une situation de surendettement durable. Si le client présente des
    signes de difficultés persistantes, l''agent doit, conformément à nos obligations
    réglementaires, l''orienter vers la commission de surendettement.


    Procédure d''exécution pour l''agent :


    1. Effectuer une vérification d''identité rigoureuse du client via l''authentification
    forte pour sécuriser les données personnelles.

    2. Utiliser l''outil get_accounts pour identifier le numéro de compte correspondant
    au client à partir des quatre derniers chiffres fournis.

    3. Analyser la situation financière actuelle du client en l''interrogeant sur
    la nature et la durée de sa difficulté.

    4. Expliquer pédagogiquement que le report d''échéance ou la baisse des mensualités
    peut modifier la durée totale du crédit et potentiellement son coût total.

    5. Confirmer avec le client l''option choisie : soit le report complet d''une
    échéance, soit une diminution temporaire du montant mensuel.

    6. Appeler l''outil request_payment_deferral en renseignant l''identifiant du
    compte, le type de demande (report ou baisse) et la durée souhaitée.


    L''agent doit s''assurer que le client a bien compris que cette mesure est exceptionnelle
    et temporaire. Pour toute demande complexe ou contestation liée à un refus de
    report, le dossier doit être escaladé vers le gestionnaire de compte, puis vers
    le responsable de la conformité si nécessaire.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_payment_deferral
  institution_id: ondine_credit
- id: 19e1ee50-7726-5dbd-991f-976daab0c41b
  title: Référence de l'outil request_payment_deferral
  body: 'L''outil request_payment_deferral permet à l''agent de modifier temporairement
    le calendrier de remboursement d''un crédit. L''agent effectue cette action en
    appelant l''outil directement dans la conversation après avoir vérifié l''identité
    du client.


    Arguments requis :

    - account_id : L''identifiant unique du compte de crédit, obtenu préalablement
    via l''outil get_accounts.

    - request_type : La nature de l''aménagement demandé (par exemple, ''report_echeance''
    pour décaler un paiement ou ''reduction_mensualite'' pour baisser le montant).

    - duration : La période couverte par cet aménagement (en nombre de mois).


    Effet : L''outil déclenche une demande de modification du plan de remboursement.
    Le client est informé de l''acceptation ou du refus de sa demande et des nouvelles
    dates de prélèvement. Cette opération est enregistrée dans le dossier de conformité
    du client.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_payment_deferral
  institution_id: ondine_credit
- id: ee2968c2-1dd1-5582-9912-311e2628cfaf
  title: Quand utiliser apply_loan
  body: 'L''outil apply_loan est le mécanisme central pour initier toute demande de
    financement chez Ondine Crédit. Il est utilisé pour les produits suivants : Prêt
    personnel Ondine, Crédit auto Ondine ou Crédit renouvelable Ondine.


    L''agent doit adopter une posture pédagogique, en aidant le client à choisir le
    produit adapté à son projet tout en restant transparent sur les coûts. Il est
    strictement interdit de promettre l''octroi d''un crédit, car chaque demande est
    soumise à une étude rigoureuse de la solvabilité du client, conformément aux directives
    de l''ACPR et de la Banque de France.


    Procédure d''exécution pour l''agent :


    1. Vérifier l''identité du client via l''authentification forte avant de débuter
    la simulation.

    2. Identifier le besoin du client pour orienter vers le produit adéquat (projet
    polyvalent, acquisition de véhicule ou réserve flexible).

    3. Recueillir les informations nécessaires : le montant souhaité, la durée de
    remboursement envisagée et l''objet précis du financement.

    4. Informer le client que le Taux Annuel Effectif Global (TAEG) appliqué sera
    toujours inférieur au taux d''usure en vigueur.

    5. Préciser que l''octroi du crédit dépendra de la vérification de sa solvabilité
    et qu''aucune promesse de déblocage de fonds ne peut être faite à ce stade.

    6. Appeler l''outil apply_loan en saisissant l''identifiant du produit, le montant,
    la durée et l''objet du prêt.


    Une fois la demande déposée, le client est informé du délai de traitement. L''agent
    doit rappeler que, si le crédit est accordé, le client disposera d''un délai de
    rétractation de 14 jours pour annuler son contrat sans pénalité.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: ondine_credit
- id: ef1cd869-efb7-50db-a0f5-216c0c2e8846
  title: Référence de l'outil apply_loan
  body: 'L''outil apply_loan permet d''enregistrer une demande de crédit soumise à
    étude de solvabilité. L''agent exécute cette opération en appelant l''outil directement
    durant l''échange avec le client.


    Arguments requis :

    - product_id : L''identifiant du produit choisi (par exemple, ''pret_personnel'',
    ''credit_auto'' ou ''credit_renouvelable'').

    - amount : Le montant total du financement demandé en €.

    - duration : La durée du crédit souhaitée (exprimée en mois).

    - purpose : L''objet du financement (ex: achat de véhicule, travaux, trésorerie).


    Effet : L''outil crée un dossier de demande de crédit. Ce dossier est transmis
    au service des risques pour l''analyse de la solvabilité. Le client reçoit une
    notification de confirmation de dépôt de demande. L''outil ne valide pas le crédit,
    il initie le processus d''instruction.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: ondine_credit
- id: fc1dd597-792c-55aa-82a3-b1f58a5a684b
  title: Quand utiliser pay_emi
  body: 'L''outil pay_emi est utilisé pour régulariser une mensualité de crédit, qu''il
    s''agisse d''un paiement anticipé ou du règlement d''une échéance impayée. Cette
    action permet au client de maintenir la régularité de son dossier et d''éviter
    les frais de retard.


    L''agent doit s''assurer que le client comprend le montant exact qu''il s''apprête
    à verser, en distinguant le capital amorti des intérêts et frais éventuels.


    Procédure d''exécution pour l''agent :


    1. Procéder à la vérification d''identité rigoureuse du client via l''authentification
    forte.

    2. Utiliser l''outil get_accounts pour identifier le compte de crédit concerné.

    3. Consulter le solde des échéances dues pour confirmer le montant exact de la
    mensualité à régler.

    4. Demander au client son mode de paiement préféré (carte bancaire ou virement).

    5. Confirmer avec le client le montant total du paiement et le numéro de l''échéance
    concernée.

    6. Appeler l''outil pay_emi en spécifiant l''identifiant du compte, le montant
    en € et le mode de paiement.


    En cas d''échec de la transaction, l''agent doit inviter le client à vérifier
    ses plafonds bancaires ou à utiliser un autre moyen de paiement. Si le client
    conteste un prélèvement déjà effectué, l''agent doit traiter la demande avec diligence,
    en rappelant que les contestations de prélèvements SEPA sont possibles sous huit
    semaines.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: ondine_credit
- id: 6480e2b0-eacf-59e9-882a-08a73be31d6e
  title: Référence de l'outil pay_emi
  body: 'L''outil pay_emi permet de régler une mensualité de crédit ou une échéance
    en souffrance. L''agent effectue ce règlement en appelant l''outil directement
    dans la conversation.


    Arguments requis :

    - account_id : L''identifiant unique du compte de crédit, obtenu via l''outil
    get_accounts.

    - amount : Le montant exact de la mensualité à régler en €.

    - payment_method : Le moyen de paiement utilisé (ex: ''carte_bancaire'' ou ''virement'').


    Effet : L''outil initie la transaction financière. En cas de succès, le solde
    du crédit est mis à jour en temps réel et l''échéance est marquée comme payée.
    Un reçu de paiement est généré et envoyé au client.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: ondine_credit
- id: e1dbdfa8-017d-5c27-9bb5-538d52bc4e0d
  title: Quand utiliser foreclose_loan
  body: 'L''outil foreclose_loan est utilisé lorsqu''un client souhaite effectuer
    un remboursement anticipé total de son crédit. Cette opération consiste à solder
    l''intégralité du capital restant dû pour mettre fin au contrat avant la date
    d''échéance prévue.


    Conformément à notre philosophie tarifaire, Ondine Crédit garantit la flexibilité
    de l''emprunteur. Les frais de remboursement anticipé sont strictement plafonnés
    conformément à la loi. L''agent doit informer le client de ces frais s''ils s''appliquent,
    sans jamais les minimiser.


    Procédure d''exécution pour l''agent :


    1. Effectuer une vérification d''identité rigoureuse du client via l''authentification
    forte.

    2. Utiliser l''outil get_accounts pour identifier le compte de crédit à clôturer.

    3. Appeler l''outil get_loan_details pour obtenir le montant exact du capital
    restant dû à la date du jour.

    4. Calculer et annoncer au client le montant total à verser, incluant le capital
    et les éventuelles indemnités de remboursement anticipé plafonnées légalement.

    5. Confirmer l''accord explicite du client pour procéder au remboursement total
    et à la clôture du prêt.

    6. Appeler l''outil foreclose_loan en renseignant l''identifiant du compte.


    Une fois l''opération réalisée, le crédit est considéré comme soldé. L''agent
    doit confirmer au client que le contrat est désormais résilié et qu''aucune mensualité
    future ne sera prélevée.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: ondine_credit
- id: 023254cb-2579-5da9-a519-3f4b6a1bbb4f
  title: Référence de l'outil foreclose_loan
  body: 'L''outil foreclose_loan permet de solder l''intégralité du capital restant
    dû d''un crédit, entraînant la clôture définitive du contrat. L''agent effectue
    cette action en appelant l''outil directement.


    Argument requis :

    - account_id : L''identifiant unique du compte de crédit, obtenu via l''outil
    get_accounts.


    Effet : L''outil calcule le montant total du solde (capital + frais légaux de
    remboursement anticipé), déclenche le prélèvement des fonds et clôture le compte
    de crédit. Le contrat est marqué comme ''Solder'' dans le système et un document
    de clôture est envoyé au client.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: ondine_credit
- id: 3d4974f6-ad97-55d1-bed6-ccbe5cc2c3b6
  title: Quand utiliser update_repayment_mandate
  body: 'L''outil update_repayment_mandate est utilisé pour modifier les modalités
    de prélèvement des mensualités. Cela concerne soit le changement de l''IBAN associé
    au mandat de prélèvement SEPA, soit la modification de la date de prélèvement
    mensuelle.


    La modification du mandat est une opération sensible qui impacte le flux financier
    du crédit. Une vigilance particulière est requise pour éviter toute interruption
    de paiement qui pourrait fragiliser la situation du client.


    Procédure d''exécution pour l''agent :


    1. Effectuer une vérification d''identité rigoureuse du client via l''authentification
    forte.

    2. Utiliser l''outil get_accounts pour identifier le compte de crédit concerné.

    3. Recueillir les nouvelles informations : le nouvel IBAN (si changement de banque)
    et/ou la nouvelle date de prélèvement souhaitée.

    4. Vérifier la validité du format de l''IBAN fourni.

    5. Informer le client que la modification peut prendre quelques jours ouvrables
    pour être effective et que, selon la date demandée, la prochaine échéance pourrait
    encore être prélevée sur l''ancien compte.

    6. Appeler l''outil update_repayment_mandate en renseignant l''identifiant du
    compte, le nouvel IBAN et/ou la nouvelle date.


    L''agent doit confirmer au client que la mise à jour a été enregistrée et l''inviter
    à surveiller son prochain relevé bancaire pour s''assurer de la bonne application
    du nouveau mandat.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: ondine_credit
- id: d3a23d06-d9df-560e-a558-14f58e12d29d
  title: Référence de l'outil update_repayment_mandate
  body: 'L''outil update_repayment_mandate permet de modifier les coordonnées bancaires
    de prélèvement ou la date d''échéance mensuelle. L''agent effectue cette modification
    en appelant l''outil directement.


    Arguments requis :

    - account_id : L''identifiant unique du compte de crédit, obtenu via l''outil
    get_accounts.

    - new_iban : Le nouvel identifiant bancaire international pour le prélèvement
    SEPA (optionnel si seule la date change).

    - new_date : Le jour du mois souhaité pour le prélèvement des mensualités (optionnel
    si seul l''IBAN change).


    Effet : L''outil met à jour le mandat SEPA associé au crédit. Une notification
    de modification de mandat est envoyée au client pour confirmer le changement et
    prévenir toute fraude.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: ondine_credit
- id: 545eb492-fdd7-5900-92f2-fe243085f15e
  title: Quand utiliser update_beneficiary
  body: 'L''outil update_beneficiary est utilisé exclusivement pour modifier les coordonnées
    bancaires (IBAN) sur lesquelles les fonds d''un crédit accordé doivent être versés.
    Cette opération est critique car elle impacte le déblocage des fonds et doit être
    traitée avec la plus grande rigueur pour prévenir tout risque de fraude.


    L''agent doit suivre strictement la procédure suivante :


    1. Effectuer une vérification d''identité rigoureuse via l''outil verify_identity.
    L''authentification forte est systématiquement exigée avant toute modification
    de l''état du compte.

    2. Identifier le contrat de crédit concerné. Si le client ne dispose pas de l''identifiant
    exact, l''agent doit utiliser l''outil get_accounts pour résoudre l''identifiant
    du compte à partir des quatre derniers chiffres fournis par le client.

    3. Recueillir le nouvel IBAN du compte bénéficiaire. L''agent doit s''assurer
    que le compte est bien au nom du client pour garantir la conformité avec les règles
    de lutte contre le blanchiment.

    4. Une fois les informations validées, l''agent doit appeler l''outil update_beneficiary
    en renseignant l''identifiant du compte et le nouvel IBAN.


    Cette modification doit être effectuée avant que le déblocage des fonds ne soit
    initié. Si les fonds ont déjà été versés, cet outil n''est plus applicable.


    Pour toute question relative aux modalités de versement selon le produit, veuillez
    vous référer aux documents de présentation tels que Prêt personnel Ondine — présentation
    ou Crédit renouvelable Ondine — présentation.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: ondine_credit
- id: 3c71accf-2b5d-5259-829a-00e2712eed58
  title: Référence de l'outil update_beneficiary
  body: 'L''outil update_beneficiary permet de modifier le compte bancaire de destination
    pour le versement des fonds d''un crédit.


    Signature de l''outil :

    update_beneficiary(account_id: string, new_iban: string)


    Arguments :

    - account_id : L''identifiant unique du compte de crédit, obtenu préalablement
    via l''outil get_accounts.

    - new_iban : Le nouvel IBAN du compte bénéficiaire, communiqué par le client lors
    de la conversation.


    Effet :

    L''outil met à jour l''IBAN de destination associé au contrat de crédit. Le prochain
    déblocage de fonds sera effectué vers ce nouveau compte. L''agent effectue cette
    action en appelant l''outil directement dans l''interface de conversation après
    avoir validé l''identité du client.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: ondine_credit
- id: e35c8b29-b086-567a-9c0c-3904a1d8a609
  title: Quand utiliser get_accounts
  body: 'L''outil get_accounts est le point d''entrée indispensable pour toute opération
    nécessitant l''identification précise d''un ou plusieurs contrats de crédit détenus
    par un client. Puisque Ondine Crédit propose plusieurs solutions (Prêt personnel
    Ondine, Crédit renouvelable Ondine, Crédit auto Ondine, Paiement en 3 ou 4 fois
    Ondine), il est impératif de confirmer quel produit est concerné par la demande.


    L''agent doit procéder comme suit :


    1. Initier la conversation par une vérification d''identité via l''outil verify_identity.

    2. Demander au client la référence de son compte ou, à défaut, les quatre derniers
    chiffres de l''identifiant du compte concerné.

    3. Appeler l''outil get_accounts en utilisant le terme de recherche fourni (identifiant
    partiel ou référence).

    4. Confirmer avec le client le type de produit et le montant associé retournés
    par l''outil pour s''assurer que le bon compte a été sélectionné.


    L''utilisation de get_accounts est obligatoire avant d''appeler tout autre outil
    nécessitant un identifiant de compte (comme update_beneficiary ou get_statements),
    afin d''éviter toute erreur de saisie ou manipulation sur un mauvais contrat.


    Pour comprendre la structure des comptes selon le produit, consultez la note Frais
    et tarifs de l''établissement.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: ondine_credit
- id: 66f8b6b9-8c27-5dc5-86e3-b889dc63a911
  title: Référence de l'outil get_accounts
  body: 'L''outil get_accounts permet de récupérer la liste des comptes et contrats
    de crédit associés à un client.


    Signature de l''outil :

    get_accounts(search_term: string)


    Arguments :

    - search_term : Un terme de recherche permettant d''identifier le compte, tel
    que les quatre derniers chiffres de l''identifiant du compte ou une référence
    contractuelle communiquée par le client.


    Effet :

    L''outil retourne les détails des comptes correspondants, incluant l''identifiant
    complet du compte (account_id), le type de produit et l''état actuel du crédit.
    L''agent effectue cette action en appelant l''outil directement dans l''interface
    de conversation.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: ondine_credit
- id: 87eb17aa-fb2b-524f-97bd-9e63e966254c
  title: Quand utiliser update_contact_info
  body: 'L''outil update_contact_info est utilisé pour maintenir l''exactitude des
    données personnelles du client, conformément aux exigences de rigueur réglementaire
    de l''ACPR et de la Banque de France. La mise à jour des coordonnées est essentielle
    pour l''envoi des mentions légales et des notifications de paiement.


    L''agent doit suivre les étapes suivantes :


    1. Vérifier l''identité du client via l''outil verify_identity. Aucune modification
    de donnée personnelle ne peut être effectuée sans authentification forte.

    2. Identifier précisément l''information à modifier (adresse postale, adresse
    e-mail ou numéro de téléphone).

    3. Recueillir la nouvelle valeur exacte auprès du client.

    4. Appeler l''outil update_contact_info en précisant le champ à modifier et la
    nouvelle valeur.

    5. Confirmer au client que la mise à jour a été prise en compte et que les prochaines
    communications seront envoyées aux nouvelles coordonnées.


    L''agent doit rester vigilant : si le client demande un changement d''adresse
    associé à un signalement de fraude, il doit immédiatement suivre la procédure
    de signalement rapide aux autorités compétentes mentionnée dans la posture de
    gestion des litiges de l''institution.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: ondine_credit
- id: 88840780-fa04-564e-96bb-158eaa72a753
  title: Référence de l'outil update_contact_info
  body: 'L''outil update_contact_info permet de modifier les informations de contact
    d''un client dans le système d''information.


    Signature de l''outil :

    update_contact_info(field: string, new_value: string)


    Arguments :

    - field : Le nom du champ de contact à modifier (par exemple : ''email'', ''phone'',
    ''address'').

    - new_value : La nouvelle coordonnée fournie par le client.


    Effet :

    L''outil met à jour l''information spécifique dans le profil du client. L''agent
    effectue cette action en appelant l''outil directement dans l''interface de conversation
    après avoir vérifié l''identité de l''utilisateur.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
