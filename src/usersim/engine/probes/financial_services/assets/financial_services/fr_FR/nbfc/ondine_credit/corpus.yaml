- id: 48c383f7-949e-519d-9b8e-a18d7e50d883
  title: 'Paiement en 3 ou 4 fois Ondine — frais du paiement en plusieurs fois : explications'
  body: 'Question : Comment sont calculés les frais pour mon paiement fractionné ?

    Réponse : Pour chaque opération de paiement en 3 ou 4 fois, des frais de service
    s''appliquent. Ils sont calculés sur la base d''un taux de 2,2 % du montant total
    de l''achat. Ce montant est transparent et communiqué avant la validation finale
    de votre transaction.


    Question : Ces frais varient-ils selon que je choisisse 3 ou 4 mensualités ?

    Réponse : Non, le taux de 2,2 % reste identique, quel que soit le nombre d''échéances
    choisi (3 ou 4), afin de vous garantir une clarté totale sur le coût de votre
    crédit.


    Question : Où puis-je retrouver le détail de ces frais ?

    Réponse : Le détail exact apparaît lors de la simulation de votre paiement. Pour
    une vue d''ensemble de nos tarifs, vous pouvez vous référer au document Paiement
    en 3 ou 4 fois Ondine — grille tarifaire.'
  domain: payments
  product_category: paiement_fractionne
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f1909bc1-19ed-5e54-86b1-d4233a740c00
  title: Paiement en 3 ou 4 fois Ondine — souscrire et activer
  body: 'L''activation du Paiement en 3 ou 4 fois Ondine est un processus simplifié,
    conçu pour s''intégrer rapidement à votre parcours d''achat. Avant de commencer,
    assurez-vous que le montant de votre commande est compris entre 100 € et 3 000
    €.


    Voici les étapes pour activer votre financement :


    1. Indiquez-nous le montant total de votre achat ainsi que l''identité du marchand.
    Nous vérifierons immédiatement si la transaction respecte les seuils d''éligibilité
    (minimum 100 € et maximum 3 000 €).


    2. Procédez à la vérification de votre identité. Conformément à nos protocoles
    de sécurité, nous exigeons une authentification forte pour sécuriser vos données
    personnelles et valider l''opération.


    3. Choisissez votre rythme de remboursement : sélectionnez soit l''option en 3
    fois, soit l''option en 4 fois. Le système vous affichera alors le montant exact
    des frais s''élevant à 2,2 % du prix d''achat.


    4. Validez le contrat de crédit numérique. Nous vous confirmerons alors l''activation
    du paiement et le déblocage des fonds vers le commerçant.


    Vous saurez que l''opération a réussi lorsque vous recevrez une notification de
    confirmation de transaction et que votre échéancier de remboursement sera visible
    dans votre historique.


    Pour comprendre comment ce produit se distingue d''autres options de financement,
    nous vous suggérons de consulter le document Paiement en 3 ou 4 fois Ondine —
    face à un produit similaire de l''établissement.'
