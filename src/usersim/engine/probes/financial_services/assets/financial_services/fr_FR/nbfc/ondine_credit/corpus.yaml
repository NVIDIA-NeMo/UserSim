- id: 2261e18b-044c-55f5-8c3f-5d37952bf285
  title: Crédit renouvelable Ondine — opération échouée ou en attente
  body: 'Il peut arriver qu''une demande de déblocage de fonds ou une modification
    de votre réserve de crédit apparaisse comme « échouée » ou « en attente ».


    Symptômes courants :

    - Message d''erreur lors de la demande de fonds.

    - Statut de l''opération bloqué sur « en cours de traitement » pendant plus de
    48 heures.


    Causes probables et vérifications :

    1. Défaut d''authentification : L''authentification forte est systématiquement
    exigée pour sécuriser vos fonds. Vérifiez que vous avez bien validé l''étape de
    sécurité sur votre appareil.

    2. Identité non mise à jour : Une vérification d''identité rigoureuse est impérative.
    Si vos documents sont arrivés à expiration, l''opération sera bloquée.

    3. Plafond atteint : Vérifiez que le montant demandé ne dépasse pas votre réserve
    disponible (maximum 3 000 €).

    4. Délai de rétractation : Si vous venez de souscrire, assurez-vous que le délai
    légal de 14 jours est écoulé.


    Résolution :

    - Relancez l''authentification forte si la session a expiré.

    - Transmettez-nous vos documents d''identité actualisés si nécessaire.


    Si le problème persiste, nous escaladerons votre dossier vers un gestionnaire
    de compte, puis vers le responsable de la conformité si le blocage est d''ordre
    réglementaire. Vous recevrez une notification dès que la situation sera régularisée
    ou si des informations complémentaires sont requises.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ec74bf24-ffc9-5ce5-8664-f575e7272295
  title: Crédit renouvelable Ondine — conditions d'éligibilité
  body: 'L''accès au Crédit renouvelable Ondine est soumis à des critères de rigueur
    réglementaire pour garantir un endettement responsable.


    | Condition | Exigence | Résultat

    | :--- | :--- | :--- |

    | Vérification de solvabilité | Capacité de remboursement confirmée | Éligible

    | Fichier FICP | Absence d''inscription active | Éligible

    | Identité | Vérification d''identité rigoureuse validée | Éligible

    | Capacité d''emprunt | Demande ≤ 3 000 € | Éligible

    | Résidence | Résidence fiscale dans la zone CET | Éligible


    En cas de difficultés financières durables, nous orientons systématiquement nos
    clients vers la commission de surendettement, conformément à notre posture de
    protection active.'
