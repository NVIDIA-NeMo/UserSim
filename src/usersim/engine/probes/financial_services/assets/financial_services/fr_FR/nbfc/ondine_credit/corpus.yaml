- id: 679659dd-f147-5237-a773-4d09522897bb
  title: Quand utiliser get_statements
  body: 'L''outil get_statements est utilisé pour fournir au client un historique
    détaillé de ses opérations, ses relevés de compte ou le solde restant dû de son
    crédit. Cet outil soutient notre engagement de transparence absolue des coûts.


    L''agent doit appliquer la procédure suivante :


    1. Vérifier l''identité du client via l''outil verify_identity.

    2. Utiliser l''outil get_accounts pour identifier le compte de crédit concerné
    et obtenir l''identifiant du compte.

    3. Préciser avec le client la période souhaitée (par exemple : le mois dernier,
    l''année civile en cours) ou le type de relevé recherché.

    4. Appeler l''outil get_statements en renseignant l''identifiant du compte et
    la plage de dates.

    5. Communiquer les informations extraites au client de manière pédagogique, en
    expliquant notamment le coût total du crédit si nécessaire.


    Cet outil est particulièrement utile lors du traitement des contestations de prélèvements
    SEPA, qui peuvent être contestables sous huit semaines. Il permet à l''agent de
    vérifier la date et le montant exact du prélèvement avant d''escalader le dossier
    vers un gestionnaire de compte.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: ondine_credit
- id: 5ea4695d-7f97-5974-9a82-17a93a69bf14
  title: Référence de l'outil get_statements
  body: 'L''outil get_statements permet de récupérer les relevés et l''historique
    des transactions pour un compte de crédit spécifique.


    Signature de l''outil :

    get_statements(account_id: string, date_range: string)


    Arguments :

    - account_id : L''identifiant unique du compte, obtenu via l''outil get_accounts.

    - date_range : La période pour laquelle les relevés sont demandés (format standard
    de dates).


    Effet :

    L''outil retourne les données transactionnelles et les soldes pour la période
    définie. L''agent effectue cette action en appelant l''outil directement dans
    l''interface de conversation.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: ondine_credit
- id: c884ab78-b2f6-50c0-9542-2a3c7d7400c7
  title: Quand utiliser set_alerts
  body: 'L''outil set_alerts permet au client de configurer des notifications pour
    mieux gérer son budget et éviter tout incident de paiement. C''est un outil d''éducation
    financière active qui aide le client à rester responsable dans son financement.


    L''agent doit procéder ainsi :


    1. Vérifier l''identité du client via l''outil verify_identity.

    2. Utiliser l''outil get_accounts pour identifier le compte de crédit pour lequel
    l''alerte doit être configurée.

    3. Définir avec le client le type d''alerte souhaité (par exemple : rappel d''échéance,
    notification de franchissement de seuil de capital restant dû).

    4. Déterminer la valeur déclencheuse si nécessaire (par exemple : 3 jours avant
    la date de prélèvement).

    5. Appeler l''outil set_alerts avec l''identifiant du compte, le type d''alerte
    et la valeur associée.


    L''agent doit rappeler au client que ces alertes sont des aides à la gestion et
    ne remplacent pas l''obligation de remboursement. En cas de difficultés financières
    durables, l''agent doit orienter le client vers la commission de surendettement,
    conformément à notre posture de conformité.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: ondine_credit
- id: e94432ef-8ec9-5b79-b3ed-e4d76843e935
  title: Référence de l'outil set_alerts
  body: 'L''outil set_alerts permet de configurer des notifications automatisées pour
    un compte de crédit.


    Signature de l''outil :

    set_alerts(account_id: string, alert_type: string, trigger_value: string)


    Arguments :

    - account_id : L''identifiant unique du compte, obtenu via l''outil get_accounts.

    - alert_type : La nature de l''alerte (ex: ''payment_reminder'', ''balance_threshold'').

    - trigger_value : La condition déclenchant l''alerte (ex: ''3_days_before'' ou
    un montant spécifique).


    Effet :

    L''outil enregistre la préférence de notification dans le profil du compte. Le
    client recevra désormais des alertes selon les critères définis. L''agent effectue
    cette action en appelant l''outil directement dans l''interface de conversation.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: ondine_credit
- id: 2f537fe4-b358-5601-979a-05ffe8d3dec8
  title: Quand utiliser get_loan_details
  body: 'L''outil get_loan_details est le mécanisme faisant autorité pour accéder
    aux informations contractuelles et au solde actuel d''un crédit. Cet outil doit
    être utilisé systématiquement dès qu''un client sollicite des précisions sur l''état
    de son engagement financier, afin de garantir une transparence absolue et une
    rigueur réglementaire conforme aux exigences de l''ACPR.


    Vous devez utiliser cet outil dans les scénarios suivants :

    - Consultation du capital restant dû pour un remboursement anticipé.

    - Vérification du Taux Annuel Effectif Global (TAEG) appliqué au contrat.

    - Confirmation de la date d''échéance finale du prêt.

    - Analyse du montant des mensualités pour un accompagnement pédagogique sur la
    gestion du budget du client.

    - Préparation d''une demande de report d''échéance ou de modification via d''autres
    outils de gestion.


    Procédure opérationnelle :


    1. Vérification de l''identité : Avant toute consultation de données sensibles,
    vous devez impérativement valider l''identité du client en utilisant l''outil
    verify_identity. L''authentification forte est exigée pour sécuriser les données
    personnelles.

    2. Identification du compte : Si le client ne fournit pas l''identifiant complet
    de son contrat, utilisez l''outil get_accounts pour résoudre l''account_id à partir
    des informations fournies (comme les derniers chiffres du compte).

    3. Extraction des données : Appelez l''outil get_loan_details en renseignant l''account_id
    cible. L''outil retournera les détails précis du crédit.

    4. Communication au client : Transmettez les informations au client en utilisant
    un ton rassurant et institutionnel. Veillez à ne jamais minimiser le coût total
    du crédit et à rester dans les limites de l''éducation financière, sans fournir
    de conseil juridique ou fiscal individualisé.


    En cas de litige sur les montants affichés, le dossier doit être escaladé vers
    un gestionnaire de compte, conformément à notre modèle de service. Pour une vision
    globale des comptes d''un client, vous pouvez vous référer au document Quand utiliser
    get_accounts.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: ondine_credit
- id: f6544dfb-2f38-585f-a4f6-4cd6ad0d4afc
  title: Référence de l'outil get_loan_details
  body: 'L''outil get_loan_details permet à l''agent de récupérer l''intégralité des
    détails techniques et financiers associés à un contrat de crédit spécifique. L''agent
    effectue cette action en appelant l''outil directement dans l''interface de conversation
    après avoir sécurisé la session.


    Signature de l''outil :

    get_loan_details(account_id: string)


    Arguments :

    - account_id : L''identifiant unique du compte de crédit. Cet argument doit être
    obtenu soit par la déclaration directe du client, soit, plus fréquemment, via
    le résultat retourné par l''outil get_accounts.


    Effet de l''outil :

    L''appel à cet outil interroge la base de données de Ondine Crédit et retourne
    un objet contenant les informations suivantes : le montant initial du prêt, le
    capital restant dû, le TAEG, la durée contractuelle, la date de fin de contrat
    et le montant de la mensualité.


    Cet outil est strictement en lecture seule (read_only) ; il ne modifie aucunement
    l''état du compte ou les conditions du contrat.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: ondine_credit
