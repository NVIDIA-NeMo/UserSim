- id: 89dd1f6c-1078-5b78-a954-25a8bceebf6d
  title: Crédit renouvelable Ondine — protection contre la fraude et les opérations
    non autorisées
  body: 'La flexibilité du Crédit renouvelable Ondine, avec sa réserve pouvant atteindre
    3 000 €, peut attirer des tentatives de fraude sophistiquées. Pour protéger vos
    fonds et vos données, Ondine Crédit applique une politique de sécurité rigoureuse
    basée sur l''authentification forte pour chaque transaction et modification de
    compte.


    **Schémas de fraude courants**

    Les fraudeurs peuvent tenter d''usurper votre identité pour solliciter un déblocage
    de fonds ou modifier vos coordonnées de paiement. Soyez vigilants face aux demandes
    urgentes par SMS ou e-mail vous demandant de confirmer vos codes d''accès ou vos
    identifiants de sécurité pour « débloquer » votre réserve de crédit.


    **Nos engagements de sécurité**

    Sachez qu''Ondine Crédit ne vous demandera jamais, sous aucun prétexte, vos mots
    de passe, vos codes de validation temporaires ou vos informations de carte bancaire
    par téléphone ou par message.


    Une vérification d''identité rigoureuse est impérative avant toute opération modifiant
    l''état de votre compte. L''authentification forte est systématiquement exigée
    pour sécuriser vos transactions et vos données personnelles.


    **Actions en cas de doute ou d''incident**

    Si vous constatez une opération non autorisée sur votre réserve de crédit ou si
    vous suspectez une compromission de vos identifiants :

    1. Signalez-nous immédiatement l''incident pour bloquer l''accès aux fonds.

    2. En cas de prélèvements SEPA contestables, vous disposez d''un délai de huit
    semaines pour initier une contestation.

    3. Nous procéderons à un signalement rapide des fraudes auprès des autorités compétentes.


    L''adoption d''une posture de protection active est notre priorité pour garantir
    l''intégrité de votre solution de financement.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 7240744e-4189-51d2-8b8d-4284377ea38d
  title: Crédit renouvelable Ondine — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation du Crédit renouvelable
    Ondine. Ce contrat établit une réserve de crédit flexible, dont le montant maximum
    est plafonné à 3 000 €.


    **Obligations de l''emprunteur**

    L''emprunteur s''engage à rembourser les sommes utilisées selon l''échéancier
    convenu, sans excéder une durée maximale de remboursement de 36 mois. Le remboursement
    doit être effectué via le mandat de prélèvement SEPA enregistré.


    **Obligations de l''établissement**

    Ondine Crédit s''engage à maintenir un TAEG toujours inférieur au taux d''usure,
    conformément à la supervision de l''ACPR et de la Banque de France. Nous appliquons
    strictement la vérification de la solvabilité avant toute mise à disposition des
    fonds.


    **Droit de rétractation et modification**

    Conformément à la loi, l''emprunteur bénéficie d''un délai de rétractation de
    14 jours suivant la signature du contrat, lui permettant d''annuler son engagement
    sans pénalité.


    **Frais et remboursement anticipé**

    Les frais sont transparents et justifiés par la gestion du risque et les coûts
    opérationnels. Les frais de remboursement anticipé sont strictement plafonnés
    conformément à la loi pour garantir la flexibilité de l''emprunteur.


    **Rupture du contrat**

    Le contrat peut être résilié par l''emprunteur à tout moment, sous réserve du
    remboursement intégral du capital restant dû et des intérêts courus. Ondine Crédit
    peut suspendre ou clôturer la réserve de crédit en cas de défaut de paiement prolongé
    ou de modification substantielle de la solvabilité du client.


    **Difficultés de paiement**

    En cas de difficultés durables, Ondine Crédit s''engage à orienter l''emprunteur
    vers la commission de surendettement.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 391d3210-bda6-53a9-b79b-0a24ef8cc0ef
  title: Crédit renouvelable Ondine — pour qui et pour quels usages
  body: 'Le Crédit renouvelable Ondine est une réserve de crédit flexible et disponible,
    conçue pour répondre à vos besoins ponctuels et imprévus avec une transparence
    absolue sur les coûts.


    **Pour qui ?**

    Ce produit s''adresse aux particuliers recherchant une solution de financement
    responsable et agile. Il est idéal pour ceux qui souhaitent disposer d''une sécurité
    financière sans avoir à reformuler une demande de prêt à chaque besoin.


    **Pour quels usages ?**

    Grâce à sa structure, il est particulièrement adapté pour :

    - Gérer un décalage de trésorerie temporaire.

    - Financer des achats de consommation courante.

    - Faire face à une dépense imprévue (réparation, santé, etc.).


    **Caractéristiques principales**

    - **Plafond de la réserve :** Jusqu''à 3 000 € disponibles.

    - **Durée de remboursement :** Jusqu''à un maximum de 36 mois.

    - **Coût du crédit :** Le TAEG représentatif est de 19,9 %.


    **Exemple représentatif**

    Pour un montant utilisé de 1 000 € sur une durée de 12 mois, la mensualité s''élève
    à 91,82 €, pour un coût total du crédit de 101,84 €.


    **Engagement de transparence**

    Conformément à notre philosophie, nous ne promettons jamais l''octroi d''un crédit
    et nous ne minimisons jamais son coût total. Chaque utilisation de votre réserve
    est assortie d''une information claire sur les intérêts générés.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: d174e59d-42be-52df-b6aa-dcfc79222a94
  title: 'Crédit renouvelable Ondine — montant de l''exemple représentatif : explications'
  body: '**Pourquoi utilisez-vous un montant de 1 000 € dans vos exemples ?**

    Le montant de 1 000 € est utilisé comme base de calcul pour l''exemple représentatif
    afin de vous fournir une référence standard et pédagogique. Cela vous permet de
    visualiser concrètement l''impact du TAEG de 19,9 % sur une somme significative,
    facilitant ainsi la comparaison avec d''autres offres.


    **Ce montant est-il obligatoire pour mon crédit ?**

    Non, 1 000 € n''est qu''une illustration. Votre réserve de crédit peut aller jusqu''à
    3 000 €, et vous êtes libre d''utiliser tout montant inférieur ou égal à ce plafond,
    selon vos besoins et votre capacité de remboursement.


    **Comment ce montant influence-t-il mes mensualités ?**

    Le montant utilisé détermine la base sur laquelle sont calculés les intérêts.
    Par exemple, pour l''utilisation de cet exemple de 1 000 € sur 12 mois, la mensualité
    est de 91,82 €. Si vous utilisez un montant différent, vos mensualités seront
    ajustées proportionnellement.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 1a5010fa-c863-5b1e-b872-d923a6c53f95
  title: Crédit renouvelable Ondine — résilier, clôturer ou changer de formule
  body: 'La clôture ou la modification de votre Crédit renouvelable Ondine s''effectue
    via un échange direct avec nos services. Voici la procédure à suivre pour mettre
    fin à votre contrat ou modifier vos options.


    **Prérequis**

    Avant de commencer, assurez-vous que le solde utilisé de votre réserve est soit
    nul, soit que vous disposez des fonds nécessaires pour solder le capital restant
    dû.


    **Étapes pour la clôture du crédit**

    1. **Demande de résiliation :** Informez-nous de votre volonté de clôturer votre
    réserve de crédit. Précisez s''il s''agit d''une clôture immédiate (si le solde
    est à 0 €) ou d''un remboursement anticipé total pour clôturer le compte.

    2. **Vérification d''identité :** Nous procéderons à une authentification forte
    pour sécuriser l''opération et confirmer que vous êtes bien le titulaire du contrat.

    3. **Règlement du solde :** Si un montant est encore utilisé, nous confirmerons
    ensemble le montant exact à rembourser pour solder le compte. Nous effectuerons
    alors le prélèvement final.

    4. **Confirmation de clôture :** Une fois le solde nul, nous vous confirmerons
    la fermeture définitive de votre réserve de crédit. Vous recevrez un document
    attestant de la fin du contrat.


    **Étapes pour changer de formule ou modifier le plafond**

    1. **Expression du besoin :** Indiquez-nous si vous souhaitez modifier le montant
    de votre réserve (dans la limite des 3 000 € maximum) ou changer les modalités
    de remboursement.

    2. **Analyse de solvabilité :** Conformément à notre rigueur réglementaire, nous
    effectuerons une nouvelle vérification de votre solvabilité pour valider la modification.

    3. **Validation :** Nous vous confirmerons l''application des nouveaux paramètres
    et vous transmettrons l''avenant au contrat correspondant.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 39ee97b5-029c-574b-8147-9fea6f233cce
  title: Crédit renouvelable Ondine — frais ou montant inattendu
  body: '**Symptôme : Le client constate un prélèvement ou un coût total qu''il juge
    inattendu sur son relevé.**


    **Causes probables**

    - Confusion entre le montant du capital emprunté et la mensualité incluant les
    intérêts.

    - Méconnaissance du TAEG appliqué à la portion utilisée de la réserve.

    - Utilisation d''un montant correspondant à l''exemple représentatif sans en avoir
    noté les détails.


    **Procédure de vérification (ordre suggéré)**

    1. **Vérifier le montant utilisé :** Confirmer avec le client la somme exacte
    débloquée depuis sa réserve.

    2. **Comparer avec l''exemple représentatif :** Si le client a utilisé 1 000 €
    sur 12 mois, vérifier si la mensualité de 91,82 € et le coût total de 101,84 €
    correspondent à son relevé.

    3. **Analyser le TAEG :** Rappeler que le taux annuel effectif global est de 19,9
    %, ce qui inclut tous les frais liés au crédit.

    4. **Contrôler les dates :** S''assurer que le prélèvement correspond bien à l''échéance
    prévue dans le contrat.


    **Résolution et action**

    - **Explication pédagogique :** Si l''écart provient d''une incompréhension du
    coût du crédit, détailler le calcul : Capital + Intérêts (basés sur 19,9 %) =
    Mensualité.

    - **Correction d''erreur :** Si une erreur de prélèvement est avérée, nous procédons
    immédiatement à la régularisation du montant.

    - **Escalade :** Si le client conteste toujours la légitimité des frais après
    explication, le dossier est escaladé vers un gestionnaire de compte, puis vers
    le responsable de la conformité pour un audit détaillé.


    Le client recevra une notification écrite confirmant la résolution du litige ou
    les conclusions de l''audit de conformité.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8e13727c-85ba-5fa8-9feb-96dd09c5d4b7
  title: Crédit renouvelable Ondine — justificatifs à fournir
  body: 'Pour l''ouverture de votre Crédit renouvelable Ondine, la présentation des
    documents suivants est impérative afin de garantir une vérification rigoureuse
    de votre identité et de votre solvabilité :


    | Type de justificatif | Document accepté | Finalité |

    | :--- | :--- | :--- |

    | **Identité** | Passeport ou Carte Nationale d''Identité (CNI) en cours de validité
    | Vérification d''identité et lutte contre la fraude |

    | **Domicile** | Facture d''énergie, d''eau ou justificatif de domicile de moins
    de 3 mois | Confirmation de la résidence fiscale |

    | **Revenus** | 3 derniers bulletins de salaire ou avis d''imposition récent |
    Vérification de la solvabilité et capacité de remboursement |

    | **Bancaire** | Relevé d''Identité Bancaire (RIB) | Mise en place du prélèvement
    SEPA |


    **Note importante :** L''absence de l''un de ces documents ou la fourniture d''un
    document non conforme entraînera le refus systématique de l''ouverture de la réserve
    de crédit, conformément à notre politique de rigueur réglementaire.'
  domain: lending_mortgage
