- id: a1c6ee79-9c6a-515a-abc4-34a1858e11a7
  title: Prêt personnel Ondine — choisir entre les formules
  body: 'Selon la nature de votre projet, Ondine Crédit propose différentes structures
    de financement. Voici comment choisir entre le Prêt personnel Ondine et le Crédit
    renouvelable Ondine.


    Le Prêt personnel Ondine est une solution de financement polyvalente et stable.
    Il est idéal pour des projets précis et importants. Par exemple, pour un besoin
    de 10 000 € sur 48 mois, il offre un TAEG de 5,9 % et un coût total du crédit
    transparent de 1 217,12 €. C''est le choix privilégié pour ceux qui recherchent
    une mensualité fixe (233,69 € dans l''exemple) et une visibilité totale sur la
    fin de leur engagement.


    Le Crédit renouvelable Ondine est, à l''inverse, une réserve de crédit flexible.
    Il convient mieux aux besoins ponctuels ou imprévus, permettant de puiser dans
    une enveloppe selon vos besoins. Cependant, il offre moins de stabilité sur le
    coût total à long terme qu''un prêt personnel.


    En résumé : choisissez le Prêt personnel pour la stabilité et la clarté d''un
    projet défini ; choisissez le Crédit renouvelable pour la souplesse d''une réserve
    disponible.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 60242344-39b0-52d2-85a7-a20e79c43f9d
  title: Prêt personnel Ondine — confidentialité et protection des données
  body: 'Ondine Crédit traite vos données personnelles avec la plus grande rigueur,
    conformément au Règlement Général sur la Protection des Données (RGPD) et sous
    la supervision de l''ACPR et de la Banque de France.


    Collecte et usage des données : Dans le cadre de votre Prêt personnel Ondine,
    nous collectons les informations nécessaires à la vérification rigoureuse de votre
    solvabilité et à la lutte contre le blanchiment d''argent et le financement du
    terrorisme. Ces données sont utilisées exclusivement pour évaluer votre capacité
    de remboursement et sécuriser le déblocage des fonds, dans la limite du plafond
    de 75 000 €.


    Sécurisation : L''accès à vos données est protégé par des mesures d''authentification
    forte. Toute modification de vos informations personnelles requiert une vérification
    d''identité préalable pour éviter toute usurpation.


    Vos droits : Vous disposez d''un droit d''accès, de rectification et de suppression
    de vos données personnelles. Vous pouvez exercer ces droits en nous contactant
    via nos canaux numériques ou téléphoniques durant les heures ouvrables (CET).


    Confidentialité : Nous nous engageons à ne jamais vendre vos données à des tiers.
    Le partage d''informations est strictement limité aux autorités réglementaires
    compétentes dans le cadre de nos obligations légales. Nous vous rappelons que
    nous fournissons une éducation financière, mais ne délivrons aucun conseil fiscal
    ou juridique individualisé.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f13d19a4-2884-53d7-8364-18ecab4ae6b4
  title: Prêt personnel Ondine — reconnaître les arnaques visant ce produit
  body: 'Dans le cadre de votre recherche de financement, il est essentiel de savoir
    identifier les tentatives de fraude qui pourraient utiliser l''image d''Ondine
    Crédit pour vous tromper. La vigilance est votre première protection.


    **Les signes d''alerte classiques**


    Certains fraudeurs peuvent vous contacter en prétendant être des agents d''Ondine
    Crédit pour vous proposer un déblocage de fonds rapide sans vérification de solvabilité.
    Soyez extrêmement prudent si vous rencontrez les situations suivantes :


    1. **Demande de frais d''avance** : Ondine Crédit ne vous demandera jamais de
    verser une somme d''argent (frais de dossier, assurance, frais de déblocage) par
    mandat cash, coupon ou virement avant que les fonds du prêt ne soient versés sur
    votre compte.

    2. **Urgence injustifiée** : Les escrocs créent souvent un sentiment d''urgence
    pour vous pousser à transmettre vos documents d''identité ou vos coordonnées bancaires
    sans réfléchir.

    3. **Canaux de communication non officiels** : Nous ne traitons pas les demandes
    de modification de contrat ou de déblocage de fonds via des messageries sociales
    ou des emails personnels.


    **Nos engagements de sécurité**


    Sachez que toute opération modifiant l''état de votre compte ou tout déblocage
    de fonds nécessite une vérification d''identité rigoureuse et l''application systématique
    d''une authentification forte. Nous ne vous demanderons jamais votre code secret
    ou vos identifiants de connexion par téléphone ou par email.


    **Que faire en cas de doute ?**


    Si vous recevez une communication suspecte, ne cliquez sur aucun lien et ne transmettez
    aucune information personnelle. Nous vous invitons à nous contacter immédiatement
    via nos canaux numériques officiels pour vérifier l''authenticité de la demande.
    En cas de fraude avérée, nous procédons au signalement rapide des faits aux autorités
    compétentes pour protéger vos fonds et vos données.


    Pour plus de détails sur la sécurisation de vos accès, vous pouvez consulter le
    document Prêt personnel Ondine — bonnes pratiques de sécurité du compte.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 3adffd30-1e29-5f31-a892-b415de707a66
  title: Prêt personnel Ondine — plafonds, restrictions et cas particuliers
  body: 'Ce document détaille les limites opérationnelles et les cadres réglementaires
    applicables au Prêt personnel Ondine. Il est destiné aux agents de support pour
    garantir une information exacte et homogène auprès des clients.


    **Plafonds de financement**


    Le Prêt personnel Ondine est encadré par des limites de montant strictes :

    - **Montant minimum** : 1 000 €

    - **Montant maximum** : 75 000 €


    Toute demande en dehors de cette fourchette ne peut être traitée via ce produit
    spécifique.


    **Restrictions et obligations réglementaires**


    Conformément à la supervision de l''ACPR et de la Banque de France, Ondine Crédit
    applique les règles suivantes :

    - **Vérification de la solvabilité** : Aucune offre de prêt n''est validée sans
    une analyse rigoureuse de la capacité de remboursement du client.

    - **Taux d''usure** : Le TAEG pratiqué est systématiquement inférieur au taux
    d''usure légal en vigueur.

    - **Droit de rétractation** : L''emprunteur bénéficie d''un délai légal de 14
    jours pour annuler son contrat sans pénalité.


    **Cas particuliers du remboursement**


    Le remboursement anticipé est autorisé. Pour garantir la flexibilité de l''emprunteur
    tout en couvrant les coûts opérationnels, les frais de remboursement anticipé
    sont strictement plafonnés à 1 % du montant remboursé, conformément aux dispositions
    légales.


    **Gestion des difficultés**


    En cas de difficultés financières durables, Ondine Crédit ne se contente pas d''un
    simple suivi ; nous orientons systématiquement le client vers la commission de
    surendettement pour une prise en charge adaptée.


    **Avertissement important** : L''octroi d''un crédit n''est jamais promis avant
    l''analyse complète du dossier. Le coût total du crédit doit être présenté avec
    clarté et ne doit jamais être minimisé.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ef8e6b8c-3843-59fc-8ed8-146c9ce54de3
  title: 'Prêt personnel Ondine — mensualité de l''exemple représentatif : explications'
  body: '**Pourquoi la mensualité de l''exemple représentatif est-elle de 233,69 €
    ?**


    Ce montant correspond au paiement mensuel fixe que vous devrez acquitter pour
    un emprunt basé sur les conditions suivantes :

    - Un montant emprunté de 10 000 €.

    - Une durée de remboursement de 48 mois.

    - Un Taux Annuel Effectif Global (TAEG) de 5,9 %.


    Cette mensualité de 233,69 € inclut à la fois le remboursement d''une partie du
    capital emprunté et les intérêts calculés selon le TAEG. Ce montant reste stable
    pendant toute la durée du contrat, vous offrant ainsi une visibilité totale sur
    votre budget mensuel.


    Pour comprendre comment ce taux est appliqué, nous vous invitons à consulter le
    document Prêt personnel Ondine — TAEG de l''exemple représentatif : explications.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 98dbe2bd-5a19-5077-a69f-f41c7cacb3c0
  title: Prêt personnel Ondine — consulter le suivi ou l'historique
  body: 'Ce guide vous accompagne dans la consultation du suivi de votre Prêt personnel
    Ondine afin de suivre l''évolution de votre remboursement et de vérifier vos échéances
    passées.


    **Prérequis**


    Vous devez disposer d''un contrat de prêt actif et avoir validé votre authentification
    forte lors de votre connexion.


    **Étapes de consultation**


    1. **Demander l''état actuel de votre prêt** : Indiquez-nous que vous souhaitez
    consulter le suivi de votre crédit. Nous vous confirmerons alors le montant du
    capital restant dû à la date du jour.

    2. **Accéder au tableau d''amortissement** : Demandez-nous l''historique ou le
    calendrier de vos mensualités. Nous vous transmettrons le détail de vos 48 mensualités
    (pour l''exemple représentatif), précisant pour chaque échéance la part affectée
    au remboursement du capital et la part correspondant aux intérêts.

    3. **Vérifier les paiements effectués** : Sollicitez la liste des prélèvements
    SEPA déjà honorés. Nous vous confirmerons les dates de débit et les montants exacts
    prélevés sur votre compte.

    4. **Valider la cohérence** : Comparez ces informations avec vos relevés bancaires
    pour vous assurer que chaque mensualité a bien été traitée.


    **Comment savoir si l''opération a réussi ?**


    L''opération est réussie lorsque vous avez reçu la confirmation écrite du solde
    restant dû et que vous avez pu visualiser le détail des échéances passées et futures.


    Si vous constatez un montant qui ne semble pas correspondre à vos attentes, vous
    pouvez consulter le document Prêt personnel Ondine — frais ou montant inattendu.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 6c2d078e-aed8-5187-81db-db8ee1b6b980
  title: Prêt personnel Ondine — opération refusée ou bloquée
  body: 'Il peut arriver que votre demande de prêt ou une opération liée à votre contrat
    soit refusée ou bloquée. Voici comment identifier la cause et résoudre la situation.


    **Symptômes constatés**


    - Votre demande de financement est marquée comme « refusée » après analyse.

    - Le déblocage des fonds est suspendu malgré la signature du contrat.

    - Une modification de vos coordonnées bancaires est bloquée.


    **Causes probables et vérifications**


    1. **Défaut de solvabilité** : Nous appliquons strictement la vérification de
    la solvabilité. Si vos revenus ne permettent pas de couvrir la mensualité sans
    fragiliser votre budget, la demande peut être refusée.

    2. **Échec de la vérification d''identité** : Une vérification d''identité rigoureuse
    est impérative. Si les documents fournis sont illisibles, périmés ou ne correspondent
    pas aux informations saisies, l''opération est bloquée.

    3. **Absence d''authentification forte** : Pour toute opération modifiant l''état
    du compte, l''authentification forte est exigée. Si cette étape échoue, la transaction
    est interrompue pour protéger vos fonds.

    4. **Incohérence des données SEPA** : Un blocage peut survenir si le compte de
    prélèvement n''est pas à votre nom ou si le mandat est invalide.


    **Résolution et escalade**


    - **Pour un problème d''identité** : Fournissez-nous un nouveau scan de pièce
    d''identité en haute résolution. Nous relancerons la vérification immédiatement.

    - **Pour un refus de solvabilité** : Nous vous expliquerons les raisons du refus.
    Si vos difficultés sont durables, nous vous orienterons vers la commission de
    surendettement.

    - **Pour un blocage technique** : Nous déclencherons une vérification manuelle
    de vos droits d''accès.


    Si le problème persiste, nous escaladons votre dossier vers un gestionnaire de
    compte, puis vers le responsable de la conformité pour un examen approfondi. Vous
    recevrez une notification de la décision finale sous un délai raisonnable.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 33de8463-281c-515b-90e8-9f02ddc02854
  title: Prêt personnel Ondine — quand changer ou monter en gamme
  body: 'Ce document aide l''agent de support à orienter le client vers le produit
    le plus adapté selon l''évolution de ses besoins financiers.


    **Comparaison : Prêt personnel vs Crédit renouvelable**


    Le Prêt personnel Ondine est une solution stable avec un coût total fixe (par
    exemple, 1 217,12 € pour un emprunt de 10 000 € sur 48 mois). Le Crédit renouvelable
    offre une réserve flexible.


    **Quand conseiller le passage au Prêt personnel ?**

    - Le client a un projet précis et unique (travaux, achat important).

    - Le client recherche une stabilité maximale avec une mensualité fixe (ex: 233,69
    €).

    - Le client souhaite un coût total clairement défini dès le départ et une date
    de fin de crédit précise.


    **Quand orienter vers le Crédit renouvelable ?**

    - Le client a des besoins ponctuels et imprévisibles.

    - Le client souhaite pouvoir réutiliser les fonds au fur et à mesure de ses remboursements.

    - Le client a besoin d''une flexibilité totale sur le montant et la durée de l''utilisation.


    Le Prêt personnel est préférable pour la planification à long terme, tandis que
    le Crédit renouvelable convient mieux à la gestion de trésorerie courante. Pour
    plus de détails, consultez Crédit renouvelable Ondine — présentation.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: cf7a05ee-3109-5981-982a-5a5aac002bb6
  title: Prêt personnel Ondine — comparaison avec les alternatives et quand ne pas
    le choisir
  body: 'Choisir le bon financement est essentiel pour maintenir une santé financière
    responsable. Le Prêt personnel Ondine est conçu pour être une solution polyvalente
    et stable, mais il n''est pas adapté à tous les scénarios.


    **Pourquoi choisir le Prêt personnel Ondine ?**


    Il se distingue par sa transparence absolue et sa rigueur réglementaire. Vous
    bénéficiez d''un coût total connu à l''avance et d''un TAEG compétitif (5,9 %
    dans notre exemple représentatif). C''est l''outil idéal pour un projet structuré
    où vous souhaitez rembourser une somme fixe sur une durée déterminée (par exemple,
    48 mois).


    **Quand ne PAS choisir ce produit ?**


    Le Prêt personnel Ondine n''est pas la solution recommandée dans les cas suivants
    :

    - **Besoins de petits montants** : Si vous avez besoin de moins de 1 000 €, ce
    produit n''est pas accessible (montant minimum requis : 1 000 €).

    - **Projets de très grande envergure** : Pour des besoins dépassant 75 000 €,
    d''autres solutions de financement doivent être envisagées (montant maximum :
    75 000 €).

    - **Besoins de flexibilité immédiate** : Si vous ne connaissez pas le montant
    exact dont vous avez besoin ou si vous souhaitez pouvoir emprunter et rembourser
    plusieurs fois la même somme, le Crédit renouvelable Ondine est plus approprié.

    - **Achats de consommation rapides** : Pour fractionner un achat courant en quelques
    mensualités, le Paiement en 3 ou 4 fois Ondine est une option plus agile.


    **Résumé comparatif**


    | Besoin | Produit recommandé |

    | :--- | :--- |

    | Projet stable et défini (1 000 € - 75 000 €) | Prêt personnel Ondine |

    | Réserve de fonds disponible | Crédit renouvelable Ondine |

    | Achat rapide fractionné | Paiement en 3 ou 4 fois Ondine |


    Nous vous rappelons qu''un crédit vous engage et doit être remboursé. Vérifiez
    vos capacités de remboursement avant toute souscription.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: e521dcdb-62f3-53c7-97ef-d4e6b9c1090e
  title: 'Prêt personnel Ondine — coût total du crédit dans l''exemple représentatif
    : explications'
  body: "**Que représente le montant de 1 217,12 € indiqué comme coût total du crédit\
    \ ?**\n\nLe coût total du crédit correspond à la somme totale des intérêts et\
    \ des frais que vous payez pour le service de prêt, en plus du remboursement du\
    \ capital emprunté. \n\nDans l'exemple représentatif d'un prêt de 10 000 € sur\
    \ 48 mois avec un TAEG de 5,9 %, vous versez une mensualité de 233,69 €. \n\n\
    Le calcul est le suivant : (233,69 € x 48 mois) - 10 000 € = 1 217,12 €.\n\nCe\
    \ montant de 1 217,12 € est donc le coût réel du financement pour Ondine Crédit.\
    \ Nous nous engageons à ne jamais minimiser ce coût et à vous fournir une clarté\
    \ absolue sur les frais engagés.\n\nPour plus d'informations sur les frais, vous\
    \ pouvez consulter Prêt personnel Ondine — grille tarifaire."
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 515dc3d8-939d-598d-9d5a-37192432f1fd
  title: Prêt personnel Ondine — traiter une demande courante de bout en bout
  body: 'Ce guide détaille le parcours complet d''une demande de Prêt personnel Ondine,
    de la manifestation d''intérêt jusqu''au déblocage des fonds.


    **Prérequis**


    Vous devez être une personne physique majeure, disposer d''un revenu stable et
    viser un montant compris entre 1 000 € et 75 000 €.


    **Étapes du processus**


    1. **Expression du besoin** : Communiquez-nous le montant souhaité et la durée
    envisagée (par exemple, 10 000 € sur 48 mois). Nous vous fournirons alors une
    simulation incluant le TAEG (ex: 5,9 %) et la mensualité correspondante (ex: 233,69
    €).

    2. **Constitution du dossier** : Transmettez-nous vos justificatifs d''identité
    et de revenus. Nous procédons alors à une vérification d''identité rigoureuse
    et à une analyse de votre solvabilité.

    3. **Acceptation de l''offre** : Si votre dossier est validé, nous vous envoyons
    l''offre de prêt contractuelle. Vous devez l''accepter via notre processus d''authentification
    forte.

    4. **Délai de rétractation** : À compter de la signature, vous disposez d''un
    délai légal de 14 jours pour annuler votre contrat sans aucune pénalité.

    5. **Déblocage des fonds** : Une fois le délai de rétractation expiré ou après
    réception de votre demande de levée de rétractation, nous versons les fonds sur
    votre compte bancaire après une dernière vérification de sécurité.


    **Comment savoir si la demande est finalisée ?**


    Le processus est terminé lorsque vous recevez la notification de virement des
    fonds sur votre compte et que vous avez accès à votre tableau d''amortissement.


    Pour plus de détails sur les documents à fournir, veuillez consulter Prêt personnel
    Ondine — justificatifs à fournir.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 6c264611-b3ba-5164-8fcc-4c4690169f5f
  title: Prêt personnel Ondine — écart avec vos relevés
  body: 'Ce document aide l''agent de support à résoudre les situations où un client
    signale une différence entre le solde de son prêt et ses relevés bancaires personnels.


    **Symptômes constatés**


    - Le client affirme avoir payé plus que le montant dû.

    - Le montant prélevé sur le compte bancaire ne correspond pas à la mensualité
    prévue (ex: 233,69 €).

    - Le solde restant dû ne semble pas diminuer conformément au tableau d''amortissement.


    **Étapes de vérification et résolution**


    1. **Vérification des dates de prélèvement** : Assurez-vous que le prélèvement
    SEPA a bien été exécuté. Un décalage peut apparaître si la date de valeur bancaire
    diffère de la date d''enregistrement comptable chez Ondine Crédit.

    2. **Analyse des remboursements anticipés** : Vérifiez si le client a effectué
    un remboursement partiel ou total. Si c''est le cas, vérifiez que les frais de
    remboursement anticipé ont été appliqués correctement, en respectant le plafonnement
    strict de 1 %.

    3. **Contrôle du TAEG et des intérêts** : Confirmez que la mensualité est bien
    calculée sur la base du TAEG contractuel (ex: 5,9 %). Tout écart peut provenir
    d''une erreur de saisie ou d''un ajustement réglementaire rare.

    4. **Recherche de prélèvements contestés** : Vérifiez si un prélèvement a été
    contesté via la procédure SEPA (sous huit semaines). Si un montant a été recrédité
    par la banque, le solde du prêt augmentera mécaniquement.


    **Action et Escalade**


    - **Écart mineur (< 1 €)** : Expliquez au client qu''il peut s''agir d''un arrondi
    comptable et régularisez lors de la prochaine échéance.

    - **Écart significatif** : Ouvrez un ticket de réconciliation financière. Si l''erreur
    provient d''un dysfonctionnement technique, escaladez le dossier vers le responsable
    de la conformité.


    Le client doit être informé du délai de traitement de sa demande et recevoir une
    confirmation écrite de la correction apportée à son solde.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: d995e4e3-f997-529d-9de7-c59ccec1a7eb
  title: Crédit renouvelable Ondine — présentation
  body: 'Le Crédit renouvelable Ondine est conçu comme une réserve de crédit flexible
    et disponible, permettant de répondre à vos besoins ponctuels avec une réactivité
    optimale. Contrairement à un prêt classique, ce produit vous offre la liberté
    d''utiliser les fonds selon vos nécessités, tout en reconstituant votre réserve
    disponible à mesure que vous remboursez vos mensualités.


    Pour garantir une transparence absolue, nous nous engageons sur une clarté totale
    des coûts. Le montant maximal de la réserve de crédit est fixé à 3 000 €. La durée
    maximale de remboursement est de 36 mois, vous offrant ainsi un cadre temporel
    maîtrisé pour l''apurement de vos dettes.


    Afin de vous aider à visualiser le coût d''un tel engagement, voici un exemple
    représentatif :

    Pour un montant emprunté de 1 000 € sur une durée de 12 mois, avec un Taux Annuel
    Effectif Global (TAEG) de 19,9 %, vos mensualités s''élèvent à 91,82 €. Dans ce
    scénario, le coût total du crédit est de 101,84 €.


    Ce produit s''inscrit dans notre volonté de proposer des solutions de financement
    responsables. Nous appliquons une vérification rigoureuse de la solvabilité pour
    nous assurer que le crédit est adapté à votre situation financière. Conformément
    à la réglementation, vous disposez d''un droit de rétractation de 14 jours après
    la signature du contrat.


    Le Crédit renouvelable Ondine est idéal pour ceux qui recherchent une agilité
    financière sans avoir à reformuler une demande de prêt pour chaque besoin. Pour
    une analyse comparative avec nos autres solutions de financement, nous vous invitons
    à consulter le document « Prêt personnel Ondine — présentation ».'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: product_sheet
  source_authority: official
