- id: f31c4aa2-2ddd-511e-bafa-81b9513daac0
  title: Crédit renouvelable Ondine — souscrire et activer
  body: 'La souscription au Crédit renouvelable Ondine est un processus sécurisé et
    transparent, conçu pour vous accompagner vers un financement responsable.


    Avant de commencer, assurez-vous d''avoir vos justificatifs d''identité et de
    revenus à disposition pour la vérification de solvabilité.


    1. Formulez votre demande : Indiquez-nous le montant de la réserve souhaitée (dans
    la limite de 3 000 €) ainsi que la durée de remboursement envisagée (jusqu''à
    36 mois).

    2. Fournissez vos justificatifs : Transmettez-nous les documents requis pour la
    vérification de votre identité et l''analyse de votre solvabilité. Cette étape
    est impérative pour sécuriser vos opérations.

    3. Validation du contrat : Après analyse, nous vous transmettons l''offre de crédit
    détaillée. Vous devez signer ce contrat pour confirmer votre accord sur les conditions,
    notamment le TAEG applicable.

    4. Respect du délai légal : Un droit de rétractation de 14 jours s''applique dès
    la signature. Durant cette période, aucun fonds ne peut être débloqué, garantissant
    ainsi votre réflexion.

    5. Activation et déblocage : Une fois le délai de rétractation expiré, votre réserve
    de crédit est activée. Vous pouvez alors demander le déblocage des fonds selon
    vos besoins.


    Vous saurez que l''opération a réussi lorsque vous recevrez une notification de
    confirmation d''activation et que votre solde disponible apparaîtra dans le suivi
    de votre compte.


    Pour comprendre les implications réglementaires de ce processus, consultez « Crédit
    renouvelable Ondine — informations réglementaires ».'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f447909e-161e-5749-a56b-11a55bba9025
  title: Crédit renouvelable Ondine — grille tarifaire
  body: 'Conformément à notre philosophie de transparence, les frais du Crédit renouvelable
    Ondine sont justifiés par la gestion du risque et les coûts opérationnels.


    - Frais d''ouverture de dossier : 0 €

    - Frais de gestion annuels : Inclus dans le TAEG

    - Coût total du crédit (exemple représentatif pour 1 000 € sur 12 mois) : 101,84
    €

    - Frais de remboursement anticipé : Strictement plafonnés conformément à la loi
    pour garantir la flexibilité de l''emprunteur.


    Note pour l''agent : Tout calcul de coût doit se baser sur le TAEG contractuel.
    Ne jamais promettre de frais nuls si le contrat stipule le contraire. En cas de
    litige sur un prélèvement, se référer à la procédure de traitement des contestations
    SEPA sous huit semaines.'
