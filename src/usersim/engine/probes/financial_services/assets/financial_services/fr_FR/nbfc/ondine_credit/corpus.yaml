- id: b69fea2c-5b9f-5314-80bb-bd313638fbdc
  title: Crédit auto Ondine — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos données et de vos fonds est notre priorité absolue. Pour
    protéger votre contrat de Crédit auto Ondine, nous vous recommandons d''appliquer
    rigoureusement les pratiques suivantes :


    1. Authentification forte : L''accès à vos informations de prêt nécessite systématiquement
    une authentification forte. Ne partagez jamais vos codes secrets, vos mots de
    passe ou vos clés de sécurité avec un tiers, même s''il prétend travailler pour
    Ondine Crédit.


    2. Vigilance face au phishing : Soyez attentif aux communications suspectes. Ondine
    Crédit ne vous demandera jamais de communiquer vos identifiants de connexion ou
    vos coordonnées bancaires par e-mail ou par SMS pour « débloquer » un fonds ou
    « mettre à jour » un dossier.


    3. Vérification d''identité : Sachez qu''une vérification d''identité rigoureuse
    est impérative avant toute opération modifiant l''état de votre compte ou tout
    déblocage de fonds. Si vous recevez une demande de modification que vous n''avez
    pas initiée, signalez-le-nous immédiatement.


    4. Signalement rapide : En cas de perte de vos moyens d''accès ou de suspicion
    de fraude, informez-nous sans délai. Nous adoptons une posture de protection active
    et procédons au signalement rapide des fraudes aux autorités compétentes.


    Nous vous rappelons que nos services sont accessibles via nos canaux numériques
    et par téléphone durant les heures ouvrables (CET). En cas de doute, privilégiez
    toujours le canal officiel de communication pour confirmer une instruction.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 79d6e300-f978-556f-8ac2-34a972a49695
  title: Crédit auto Ondine — modification des conditions
  body: "Le présent document précise les modalités de modification des conditions\
    \ applicables au Crédit auto Ondine. \n\nEngagement de Transparence : Ondine Crédit\
    \ s'engage à maintenir une clarté absolue sur les coûts. Toute modification des\
    \ conditions tarifaires ou contractuelles fera l'objet d'une notification préalable.\
    \ Nous garantissons que le Taux Annuel Effectif Global (TAEG) restera systématiquement\
    \ inférieur au taux d'usure fixé par la Banque de France.\n\nProcédure de Modification\
    \ : Les modifications peuvent résulter d'évolutions réglementaires (ACPR) ou d'ajustements\
    \ opérationnels. Vous serez informé de tout changement impactant vos mensualités\
    \ ou le coût total du crédit dans un délai de préavis raisonnable avant son application\
    \ effective.\n\nFlexibilité et Rétractation : Conformément à la loi, vous disposez\
    \ d'un délai de rétractation de 14 jours après la signature de votre contrat pour\
    \ annuler votre engagement sans pénalité. De même, les frais de remboursement\
    \ anticipé sont strictement plafonnés selon la réglementation en vigueur pour\
    \ garantir votre flexibilité.\n\nExemple de référence : Pour un montant représentatif\
    \ de 20 000 € sur une durée de 60 mois, avec un TAEG de 4,9 %, la mensualité s'élève\
    \ à 375,53 € pour un coût total du crédit de 2 531,80 €. Toute modification des\
    \ taux ou des frais impactant ces ratios sera explicitement détaillée lors de\
    \ la mise à jour de vos conditions.\n\nEn cas de difficultés durables de remboursement,\
    \ nous vous orienterons systématiquement vers la commission de surendettement."
  domain: lending_mortgage
  product_category: credit_auto
  document_type: terms_conditions
  source_authority: official
