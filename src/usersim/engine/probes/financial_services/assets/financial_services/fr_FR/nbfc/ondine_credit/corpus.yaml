- id: cfd777b5-771d-5906-870e-bdb99c83a009
  title: Crédit renouvelable Ondine — informations réglementaires
  body: 'Le Crédit renouvelable Ondine est opéré sous la supervision stricte de l''ACPR
    et de la Banque de France. Nous nous engageons à respecter l''intégralité du cadre
    légal relatif au crédit à la consommation.


    Engagement sur les taux : Nous garantissons que le Taux Annuel Effectif Global
    (TAEG) appliqué est toujours inférieur au taux d''usure en vigueur, conformément
    aux directives réglementaires. Le TAEG est l''indicateur global du coût du crédit,
    incluant les intérêts et les frais.


    Protection de l''emprunteur : Tout contrat de crédit est assorti d''un droit de
    rétractation légal de 14 jours. Pendant ce délai, l''emprunteur peut annuler son
    engagement sans pénalité. Nous appliquons strictement la vérification de la solvabilité
    avant toute octroi de crédit pour prévenir le surendettement.


    Transparence et responsabilité : Nous ne promettons jamais l''octroi d''un crédit
    avant l''étude complète du dossier et nous ne minimisons jamais le coût total
    du crédit. Pour illustration, un emprunt de 1 000 € sur 12 mois avec un TAEG de
    19,9 % engendre un coût total de 101,84 €.


    Lutte contre la fraude : L''authentification forte est systématiquement exigée
    pour sécuriser les transactions et les données personnelles. Toute modification
    de l''état du compte nécessite une vérification d''identité rigoureuse.


    En cas de difficultés de paiement durables, Ondine Crédit s''engage à orienter
    le client vers la commission de surendettement compétente.'
  domain: lending_mortgage
  product_category: credit_renouvelable
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 1dd3ddff-2533-511b-823e-41730fc557cc
  title: Crédit renouvelable Ondine — grille des taux
  body: 'La tarification du Crédit renouvelable Ondine est conçue pour être transparente
    et proportionnelle au risque opérationnel.


    - TAEG de l''exemple représentatif : 19,9 %


    Ce taux de 19,9 % s''applique à l''exemple de référence pour un montant de 1 000
    € sur une durée de 12 mois. Le taux définitif applicable à votre réserve de crédit
    est fixé lors de la signature du contrat après analyse de votre profil de risque
    et de votre solvabilité.


    Le taux est communiqué en TAEG (Taux Annuel Effectif Global), ce qui signifie
    qu''il inclut l''ensemble des coûts du crédit. Nous garantissons que ce taux restera
    toujours inférieur au taux d''usure fixé par la Banque de France.


    Pour comprendre comment ce taux impacte vos mensualités, veuillez consulter «
    Crédit renouvelable Ondine — TAEG de l''exemple représentatif : explications ».'
