- id: 03f932df-9a0d-5433-b5d5-de71f5037a0f
  title: Crédit auto Ondine — informations sur les risques
  body: 'Conformément aux obligations réglementaires, Ondine Crédit apporte les précisions
    suivantes concernant les risques liés au Crédit auto Ondine.


    Engagement Financier : Un crédit vous engage et doit être remboursé. Le fait d''emprunter
    des fonds implique l''obligation de rembourser le capital ainsi que les intérêts.
    Tout défaut de paiement peut entraîner des sanctions et affecter votre solvabilité.


    Évaluation de la Solvabilité : Nous appliquons strictement la vérification de
    la solvabilité avant tout octroi de prêt. Cette analyse vise à garantir que la
    mensualité, telle que l''exemple de 375,53 € pour un prêt de 20 000 €, est compatible
    avec vos revenus et vos charges.


    Droits de l''Emprunteur : Vous disposez d''un délai de rétractation légal de «
    14 » jours pour annuler votre contrat. En cas de difficultés financières durables,
    nous vous orienterons vers la commission de surendettement pour protéger vos intérêts.


    Coût du Crédit : Le coût total du crédit est représenté par le TAEG (Taux Annuel
    Effectif Global). Dans notre exemple représentatif, pour un capital de 20 000
    € sur 60 mois à 4,9 %, le coût total s''élève à 2 531,80 €. Ce montant inclut
    l''ensemble des frais et intérêts.


    ***

    MENTION LÉGALE : Ondine Crédit opère sous la supervision de l''ACPR et de la Banque
    de France. Nous nous engageons à maintenir un TAEG toujours inférieur au taux
    d''usure légal.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 710c0ce5-82d8-5029-bb4c-d933d4aefb4d
  title: Crédit auto Ondine — calcul et application des taux
  body: 'Le Crédit auto Ondine applique un taux basé sur le Taux Annuel Effectif Global
    (TAEG), qui reflète le coût total du crédit pour l''emprunteur, incluant les intérêts
    et les frais obligatoires.


    Application du Taux :

    - Le taux représentatif pour ce produit est de 4,9 %.

    - Ce taux est appliqué uniformément à l''ensemble des dossiers répondant aux critères
    de solvabilité standard.

    - Le TAEG est garanti être toujours inférieur au taux d''usure fixé par la Banque
    de France.


    Calcul du coût :

    Pour un financement de 20 000 € sur une durée de 60 mois au taux de 4,9 %, le
    calcul aboutit à une mensualité de 375,53 €, pour un coût total du crédit de 2
    531,80 €.


    Éléments pouvant modifier le coût final :

    - La durée du crédit (jusqu''à un maximum de 84 mois).

    - Le montant emprunté (minimum de 3 000 €).

    - Le profil de risque de l''emprunteur lors de la vérification de la solvabilité.


    Ondine Crédit ne pratique aucune commission cachée ; tous les coûts sont explicitement
    mentionnés dans le contrat.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 8b46ad67-1626-5b3d-814a-319e80d056e1
  title: Crédit auto Ondine — offre de parrainage et de fidélité
  body: "Ondine Crédit valorise la confiance que vous nous accordez. C'est pourquoi\
    \ nous avons mis en place un programme de parrainage dédié à notre Crédit auto\
    \ Ondine pour accompagner vos proches dans l'acquisition de leur véhicule.\n\n\
    Pour chaque nouveau client parrainé qui souscrit à un Crédit auto Ondine (montant\
    \ minimum de 3 000 €), vous bénéficiez d'une prime de fidélité de 50 €, créditée\
    \ directement sur votre compte après le déblocage des fonds du nouveau contrat.\
    \ Le filleul, quant à lui, profite de l'accompagnement pédagogique de nos équipes\
    \ pour optimiser son financement.\n\nCette offre est valable pour toute souscription\
    \ effectuée entre le 1er octobre 2023 et le 31 décembre 2023. \n\n⚠️ Avertissement\
    \ : Un crédit vous engage et doit être remboursé. Vérifiez vos capacités de remboursement\
    \ avant toute souscription. Le coût total du crédit est transparent et détaillé\
    \ dans chaque offre personnalisée."
