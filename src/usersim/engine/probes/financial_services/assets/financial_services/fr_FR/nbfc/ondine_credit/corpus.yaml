- id: 75b19e79-0133-5154-903f-28ed49fee71c
  title: Prêt personnel Ondine — présentation
  body: 'Le Prêt personnel Ondine est une solution de financement polyvalente et stable,
    conçue pour accompagner vos projets personnels avec une transparence totale. Que
    vous souhaitiez financer des travaux, un événement familial ou un besoin d''équipement,
    ce crédit vous offre la sécurité d''un coût fixe et d''un échéancier prévisible.


    Nous nous engageons à une clarté absolue concernant les coûts du crédit. Pour
    un montant représentatif de 10 000 € emprunté sur une durée de 48 mois, le Taux
    Annuel Effectif Global (TAEG) est de 5,9 %. Dans ce cadre, vos mensualités s''élèvent
    à 233,69 €, pour un coût total du crédit de 1 217,12 €.


    Le Prêt personnel Ondine s''adapte à l''envergure de vos projets grâce à une plage
    de financement flexible :

    - Montant minimum d''emprunt : 1 000 €

    - Montant maximum d''emprunt : 75 000 €


    Conformément à notre philosophie de flexibilité pour l''emprunteur, les frais
    de remboursement anticipé sont strictement plafonnés à 1 % conformément à la législation
    en vigueur. De plus, pour vous garantir une réflexion sereine, vous disposez d''un
    délai de rétractation légal de 14 jours après la signature de votre contrat pour
    annuler l''opération sans pénalité.


    L''octroi du crédit est soumis à une vérification rigoureuse de votre solvabilité,
    conformément aux exigences de l''ACPR et de la Banque de France. Nous vous rappelons
    qu''un crédit vous engage et doit être remboursé. Nous vous conseillons de vérifier
    votre capacité de remboursement avant toute souscription.


    Pour plus de détails sur les modalités financières, vous pouvez consulter la Prêt
    personnel Ondine — grille tarifaire ou la Prêt personnel Ondine — grille des taux.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: dcd278e0-486c-54ca-a580-29558aa4db42
  title: 'Prêt personnel Ondine — TAEG de l''exemple représentatif : explications'
  body: 'Que signifie le TAEG de 5,9 % mentionné dans l''exemple représentatif ?

    Le Taux Annuel Effectif Global (TAEG) est l''indicateur central du coût de votre
    crédit. Il intègre non seulement les intérêts, mais aussi tous les frais obligatoires
    liés à l''emprunt. Dans notre exemple pour un capital de 10 000 €, le TAEG de
    5,9 % vous permet de visualiser le coût réel et global de l''opération sur une
    durée de 48 mois.


    Le TAEG est-il garanti pour tous les profils ?

    Le taux de 5,9 % est communiqué à titre représentatif. Le taux définitif qui vous
    sera proposé dépendra de l''analyse de votre solvabilité et des caractéristiques
    de votre dossier. Cependant, Ondine Crédit garantit que le TAEG appliqué sera
    toujours inférieur au taux d''usure fixé par les autorités.


    Où trouver le détail du coût total ?

    Pour l''exemple cité, le coût total du crédit s''élève à 1 217,12 €. Vous trouverez
    le détail des composants de ce coût dans le document Prêt personnel Ondine — présentation.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 80bf6a7c-0cfb-5c20-9bde-6e411b80d6f9
  title: Prêt personnel Ondine — souscrire et activer
  body: 'Pour souscrire à un Prêt personnel Ondine, veuillez suivre les étapes suivantes.
    Ce processus est conçu pour être transparent et sécurisé.


    Préalables : Munissez-vous de vos pièces d''identité à jour et de vos justificatifs
    de revenus récents.


    1. Définition du besoin : Indiquez-nous le montant souhaité (entre 1 000 € et
    75 000 €) ainsi que la durée de remboursement envisagée. Nous vous communiquerons
    alors une simulation précise incluant le TAEG et la mensualité.


    2. Constitution du dossier : Transmettez-nous les documents justificatifs demandés.
    Nous procédons alors à une vérification rigoureuse de votre solvabilité pour garantir
    un endettement responsable.


    3. Validation et Signature : Une fois le crédit accordé, nous vous adressons le
    contrat. Prenez le temps de lire les conditions. Vous pouvez signer le contrat
    électroniquement. À ce stade, nous vous confirmons l''existence de votre délai
    de rétractation de 14 jours.


    4. Authentification Forte : Pour sécuriser le déblocage des fonds, vous devrez
    valider l''opération via notre système d''authentification forte. Cette étape
    est impérative pour protéger vos données et vos fonds.


    5. Mise à disposition des fonds : Après validation finale et vérification d''identité,
    les fonds sont versés sur votre compte. Vous recevrez une notification confirmant
    le virement et le début de votre échéancier.


    Le succès de l''opération est confirmé lorsque vous visualisez le solde du prêt
    sur votre tableau de bord et que la date de la première échéance est fixée. Pour
    toute question sur les coûts, consultez la Prêt personnel Ondine — grille tarifaire.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 97ed4ac5-1998-58d0-b35f-8936f17934ef
  title: Prêt personnel Ondine — grille tarifaire
  body: 'Cette grille tarifaire détaille les frais applicables au Prêt personnel Ondine.
    Conformément à notre engagement de transparence, aucun frais caché n''est appliqué.


    - Frais de dossier : 0 € (Inclus dans le TAEG).

    - Frais de remboursement anticipé : Plafonnés à 1 % du capital restant dû, conformément
    aux dispositions légales pour garantir la flexibilité de l''emprunteur.

    - Frais de modification contractuelle : 0 €.


    Exemple de coût total : Pour un prêt de 10 000 € sur 48 mois avec un TAEG de 5,9
    %, le coût total du crédit est de 1 217,12 €.


    L''ensemble de ces coûts est reflété dans le TAEG communiqué lors de votre simulation.
    Pour comprendre la composition de ces taux, veuillez vous référer à la Prêt personnel
    Ondine — grille des taux.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: fe553bf2-ba14-5e72-8e0a-376b1c10471b
  title: Prêt personnel Ondine — opération échouée ou en attente
  body: 'Il peut arriver que votre demande de crédit ou le déblocage de vos fonds
    apparaisse comme « en attente » ou « échoué ». Voici comment identifier la cause
    et résoudre la situation.


    Symptôme : La demande de prêt est marquée comme « en attente de validation » pendant
    plus de 3 jours ouvrables.

    Causes probables :

    - Documents justificatifs illisibles ou non conformes.

    - Vérification de solvabilité nécessitant des informations complémentaires.

    Action : Vérifiez vos notifications. Si un document a été refusé, transmettez-nous
    une nouvelle version nette et complète. Nous vous confirmerons la réception et
    la mise à jour de votre dossier.


    Symptôme : Le déblocage des fonds a échoué après la signature du contrat.

    Causes probables :

    - Échec de l''authentification forte (SCA).

    - Identité non vérifiée ou expiration du délai de validation.

    Action : Relancez la procédure d''authentification forte via vos canaux sécurisés.
    Assurez-vous que vos informations d''identité sont strictement identiques à celles
    du contrat signé.


    Symptôme : Le virement des fonds n''est pas visible sur votre compte après confirmation.

    Cause probable : Délai interbancaire standard.

    Action : Patientez 48 heures ouvrables. Si les fonds n''apparaissent toujours
    pas, demandez-nous l''identifiant de la transaction pour suivi.


    Escalade : Si le problème persiste malgré ces vérifications, nous escaladons votre
    dossier vers un gestionnaire de compte, puis vers le responsable de la conformité
    si un blocage réglementaire est identifié. Vous serez informé par notification
    du statut de votre demande.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: f1fba333-6a90-530b-aab3-c944b38aef41
  title: Prêt personnel Ondine — conditions d'éligibilité
  body: 'L''accès au Prêt personnel Ondine est conditionné par le respect des critères
    suivants :


    | Critère | Condition requise | Résultat |

    | :--- | :--- | :--- |

    | Montant demandé | Entre 1 000 € et 75 000 € | Éligible si dans la fourchette
    |

    | Solvabilité | Analyse positive des revenus et charges | Accord soumis à validation
    |

    | Identité | Vérification d''identité rigoureuse et validée | Obligatoire pour
    tout déblocage |

    | Conformité | Absence d''inscription restrictive majeure | Évaluation du risque
    |

    | Réglementation | Respect du taux d''usure (TAEG < Usure) | Garantie systématique
    |


    Tout dossier ne respectant pas le montant minimum de 1 000 € ou dépassant le plafond
    de 75 000 € sera automatiquement refusé. L''orientation vers la commission de
    surendettement est systématiquement proposée en cas de difficultés financières
    durables constatées lors de l''analyse.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 9cabb091-eb8a-59ee-b101-bba61b2639f4
  title: Prêt personnel Ondine — face à un produit similaire de l'établissement
  body: 'Si vous hésitez entre le Prêt personnel Ondine et le Crédit renouvelable
    Ondine, voici les éléments de distinction pour vous aider à choisir.


    Le Prêt personnel Ondine est une solution stable. Pour un exemple de 10 000 €,
    vous disposez d''une mensualité fixe de 233,69 € sur 48 mois et un TAEG de 5,9
    %. C''est le choix idéal pour un projet précis et planifié, offrant une visibilité
    totale sur le coût final (1 217,12 € dans l''exemple).


    À l''inverse, le Crédit renouvelable Ondine offre une réserve de fonds flexible
    et disponible pour des besoins ponctuels, mais avec une gestion des remboursements
    plus variable.


    Résumé du choix :

    - Choisissez le Prêt personnel Ondine pour : Un investissement majeur, une stabilité
    budgétaire et un coût global maîtrisé.

    - Choisissez le Crédit renouvelable Ondine pour : Une réserve de précaution ou
    des petits achats imprévus.


    Pour plus de détails sur la structure du prêt personnel, consultez la Prêt personnel
    Ondine — présentation.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 1be8e99a-b95f-5463-994c-465d28f82cc9
  title: Prêt personnel Ondine — informations réglementaires
  body: 'Le Prêt personnel Ondine est distribué par Ondine Crédit, institution opérant
    sous la supervision stricte de l''ACPR et de la Banque de France. Cette supervision
    garantit que nos pratiques respectent les normes de protection des consommateurs
    et la stabilité financière.


    Engagement sur les taux : Nous nous engageons à ce que le Taux Annuel Effectif
    Global (TAEG) appliqué à vos contrats soit systématiquement inférieur au taux
    d''usure légal en vigueur. À titre d''exemple, notre taux représentatif est de
    5,9 % pour un capital de 10 000 € sur 48 mois.


    Droit de rétractation : Conformément à la loi, tout emprunteur dispose d''un délai
    de rétractation de 14 jours calendaires à compter de la signature du contrat.
    Durant cette période, vous pouvez annuler votre engagement sans motif et sans
    pénalité.


    Vérification de la solvabilité : L''octroi d''un crédit est conditionné par une
    vérification rigoureuse de la solvabilité de l''emprunteur. Cette étape vise à
    prévenir le surendettement. En cas de difficultés financières durables, Ondine
    Crédit s''engage à orienter le client vers la commission de surendettement compétente.


    Sécurité et Authentification : Toute opération modifiant l''état du compte ou
    entraînant un déblocage de fonds (montants compris entre 1 000 € et 75 000 €)
    requiert une vérification d''identité impérative et l''utilisation d''une authentification
    forte (SCA).


    Responsabilité : Ondine Crédit fournit une éducation financière et une aide au
    choix de produit, mais ne fournit aucun conseil fiscal ou juridique individualisé.
    Nous ne promettons jamais l''octroi d''un crédit avant l''analyse complète du
    dossier et nous ne minimisons jamais le coût total du crédit, tel que illustré
    par le coût de 1 217,12 € pour l''exemple représentatif.'
  domain: lending_mortgage
  product_category: pret_personnel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: a8f21fe4-0ecb-55ec-914b-b2c719557728
  title: Prêt personnel Ondine — grille des taux
  body: "La tarification du Prêt personnel Ondine repose sur la transparence et la\
    \ rigueur réglementaire. \n\nLe taux de référence utilisé pour nos simulations\
    \ est le Taux Annuel Effectif Global (TAEG). Pour notre exemple représentatif,\
    \ le TAEG est de 5,9 %. Ce taux est applicable pour un emprunt de 10 000 € sur\
    \ une durée de 48 mois.\n\nCe taux est fixe pour toute la durée du contrat, ce\
    \ qui vous garantit que vos mensualités (233,69 € dans l'exemple) ne varieront\
    \ pas, indépendamment des fluctuations du marché financier.\n\nL'application du\
    \ taux définitif dépend de l'évaluation de votre profil de risque lors de l'analyse\
    \ de solvabilité. Nous garantissons toutefois que ce taux restera toujours en\
    \ dessous du seuil légal de l'usure.\n\nPour comprendre comment ce taux impacte\
    \ le coût final, veuillez consulter la Prêt personnel Ondine — présentation où\
    \ est détaillé le coût total du crédit de 1 217,12 € pour l'exemple cité."
  domain: lending_mortgage
