- id: a4af7e71-a7ac-5380-8fdb-cab2423feb65
  title: Prêt personnel Ondine — résilier, clôturer ou changer de formule
  body: "L'une des forces du Prêt personnel Ondine est la flexibilité offerte à l'emprunteur.\
    \ Voici la marche à suivre selon votre objectif :\n\nPour clôturer votre prêt\
    \ via un remboursement anticipé total :\n1. Demandez-nous le décompte arrêté à\
    \ la date souhaitée. Nous calculerons le capital restant dû ainsi que les intérêts\
    \ courus jusqu'à cette date.\n2. Nous vous confirmerons le montant exact à verser,\
    \ incluant les éventuels frais de remboursement anticipé. Notez que ces frais\
    \ sont strictement plafonnés à 1 % du capital remboursé.\n3. Effectuez le versement\
    \ du montant indiqué. \n4. Nous vous transmettrons une attestation de clôture\
    \ de prêt confirmant que vous avez rempli toutes vos obligations contractuelles.\n\
    \nPour changer de formule ou renégocier vos conditions :\n1. Indiquez-nous votre\
    \ souhait de modification (par exemple, allonger la durée pour réduire la mensualité).\n\
    2. Nous procéderons à une nouvelle vérification de votre solvabilité pour nous\
    \ assurer que le changement reste responsable.\n3. Si la demande est validée,\
    \ nous vous proposerons un avenant au contrat avec les nouvelles conditions tarifaires\
    \ et le nouveau calendrier de remboursement.\n4. Vous signez l'avenant numériquement\
    \ via notre système d'authentification forte.\n5. Nous vous confirmons la mise\
    \ en œuvre du nouveau plan de remboursement dès la prochaine échéance.\n\nSi vous\
    \ êtes encore dans la période légale suivant la signature, vous pouvez exercer\
    \ votre droit de rétractation dans un délai de 14 jours pour annuler le contrat\
    \ sans pénalité. Pour toute question sur les coûts associés, référez-vous au document\
    \ Prêt personnel Ondine — grille tarifaire."
