  institution_id: ondine_credit
- id: 46ff63eb-9b3a-54bc-8617-aca04942953c
  title: Crédit auto Ondine — confidentialité et protection des données
  body: 'Ondine Crédit s''engage à protéger la confidentialité de vos données personnelles
    dans le cadre de la gestion de votre Crédit auto Ondine, conformément au RGPD
    et aux directives de l''ACPR.


    Collecte et Usage des Données : Nous collectons les informations strictement nécessaires
    à la gestion de votre crédit, notamment pour la vérification obligatoire de votre
    solvabilité et la consultation du FICP. Ces données sont utilisées pour évaluer
    votre capacité de remboursement et garantir un financement responsable.


    Sécurité : L''accès à vos données est sécurisé par une authentification forte.
    Nous appliquons des protocoles de chiffrement rigoureux pour empêcher tout accès
    non autorisé à vos informations financières.


    Droits de l''Emprunteur : Vous disposez d''un droit d''accès, de rectification
    et de suppression de vos données personnelles. Vous pouvez exercer ces droits
    en nous contactant via nos canaux numériques durant les heures ouvrables (CET).


    Supervision : Nos opérations sont supervisées par l''ACPR et la Banque de France,
    ce qui nous impose une rigueur exemplaire dans la conservation et le traitement
    de vos données.


    Nous vous rappelons que nous ne fournissons aucun conseil fiscal ou juridique
    individualisé. Les informations fournies dans vos documents contractuels, incluant
    le TAEG de 4,9 % et le coût total du crédit (ex: 2 531,80 € pour 20 000 € sur
    60 mois), sont les seules valeurs opposables.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: a6f9f66a-0b7c-5895-9b2b-ea8d117d71c7
  title: Crédit auto Ondine — reconnaître les arnaques visant ce produit
  body: 'La vigilance est essentielle lors de la recherche d''un financement pour
    votre véhicule. À Ondine Crédit, nous observons plusieurs tactiques frauduleuses
    visant les emprunteurs potentiels. Il est impératif de savoir les identifier pour
    protéger vos données et vos fonds.


    Premièrement, méfiez-vous des promesses d''octroi garanti. Conformément à notre
    politique de rigueur, Ondine Crédit ne promet jamais l''octroi d''un crédit avant
    l''étude complète de votre dossier et la vérification de votre solvabilité. Toute
    communication affirmant que le Crédit auto Ondine vous est « déjà acquis » sans
    analyse préalable est une tentative d''escroquerie.


    Deuxièmement, soyez alertés par toute demande de paiement anticipé. Un fraudeur
    peut vous demander de verser des « frais de dossier », une « assurance obligatoire
    » ou des « frais de déblocage » via des moyens de paiement non traçables (coupons,
    cryptomonnaies ou virements vers des comptes tiers) avant que les fonds du prêt
    ne soient versés. Ondine Crédit ne vous demandera jamais de payer des frais pour
    « débloquer » vos fonds.


    Troisièmement, attention à l''usurpation d''identité. Les fraudeurs peuvent utiliser
    nos logos et nos couleurs pour vous envoyer des courriels ou des SMS. Notez que
    nous exigeons systématiquement une authentification forte pour sécuriser vos transactions
    et vos données personnelles. Nous ne vous demanderons jamais vos codes secrets
    ou vos mots de passe par message.


    Si vous constatez une anomalie ou si vous avez un doute sur la légitimité d''une
    demande, la première action à entreprendre est de suspendre tout échange et de
    nous signaler immédiatement l''incident. Nous adoptons une posture de protection
    active et signalons rapidement les fraudes aux autorités compétentes.


    Pour plus d''informations sur la sécurité globale de vos comptes, vous pouvez
    consulter le document : Prêt personnel Ondine — bonnes pratiques de sécurité du
    compte.'
  domain: lending_mortgage
  product_category: credit_auto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 1642f274-7cc2-594e-bcae-b3ffa84d1406
  title: Crédit auto Ondine — plafonds, restrictions et cas particuliers
  body: "Ce document détaille les limites opérationnelles et les cadres réglementaires\
    \ applicables au Crédit auto Ondine. Ces paramètres sont stricts et doivent être\
    \ communiqués avec précision aux clients pour garantir la transparence de notre\
    \ offre.\n\nMontants et Durées :\nLe montant minimum pour lequel un financement\
    \ peut être accordé est de 3 000 €. Toute demande inférieure à ce seuil ne pourra\
    \ pas être traitée via ce produit spécifique. Concernant la temporalité du remboursement,\
    \ la durée maximale autorisée est de 84 mois. Ces plafonds permettent de maintenir\
    \ un équilibre entre l'accessibilité du crédit et la gestion responsable du risque\
    \ d'endettement.\n\nCadre Réglementaire et Conformité :\nLe Crédit auto Ondine\
    \ opère sous la supervision rigoureuse de l'ACPR et de la Banque de France. À\
    \ ce titre, nous garantissons que le TAEG est toujours maintenu en dessous du\
    \ taux d'usure en vigueur. L'octroi du crédit est systématiquement conditionné\
    \ à une vérification approfondie de la solvabilité de l'emprunteur. En cas de\
    \ difficultés financières durables constatées lors de l'étude du dossier, nous\
    \ avons l'obligation d'orienter le client vers la commission de surendettement.\n\
    \nRestrictions Opérationnelles :\nLe déblocage des fonds est strictement subordonné\
    \ à une vérification d'identité rigoureuse. Aucune opération modifiant l'état\
    \ du compte ou déclenchant un versement ne peut être effectuée sans l'authentification\
    \ forte du client. \n\nCas Particuliers :\nConformément à la loi, l'emprunteur\
    \ bénéficie d'un délai de rétractation de 14 jours après la signature du contrat,\
    \ lui permettant d'annuler son engagement sans pénalité. De plus, les frais de\
    \ remboursement anticipé sont strictement plafonnés conformément à la législation\
    \ pour garantir la flexibilité de l'emprunteur."
