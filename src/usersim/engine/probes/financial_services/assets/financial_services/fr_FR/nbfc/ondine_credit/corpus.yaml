- id: bb2d9693-08e9-5d7b-8620-acc6471d4cfa
  title: Paiement en 3 ou 4 fois Ondine — protection contre la fraude et les opérations
    non autorisées
  body: 'La sécurité de vos transactions est une priorité absolue chez Ondine Crédit.
    Le produit Paiement en 3 ou 4 fois Ondine, par sa nature agile, peut être ciblé
    par des tentatives de fraude sophistiquées. Nous vous informons des mesures de
    protection en vigueur et des comportements à adopter pour sécuriser vos financements.


    L''authentification forte est systématiquement exigée pour chaque nouvelle demande
    de fractionnement. Cette étape est indispensable pour garantir que vous êtes bien
    l''auteur de l''opération et pour protéger vos données personnelles. Sachez qu''une
    vérification d''identité rigoureuse est impérative avant tout déblocage de fonds
    ou modification de l''état de votre compte.


    Pour votre sécurité, soyez vigilants : Ondine Crédit ne vous demandera jamais
    votre code secret, vos identifiants de connexion ou vos codes de validation par
    téléphone, par e-mail ou par SMS. Toute demande de ce type doit être considérée
    comme une tentative de phishing.


    En cas de constatation d''une opération non autorisée, la réactivité est primordiale.
    Si vous remarquez un prélèvement suspect lié à votre plan de paiement, vous disposez
    d''un délai de huit semaines pour contester tout prélèvement SEPA. Nous adoptons
    une posture de protection active des fonds de nos clients et nous procédons au
    signalement rapide des fraudes confirmées auprès des autorités compétentes.


    Si vous suspectez une compromission de vos accès, informez-nous immédiatement.
    Nous procéderons alors au blocage préventif de vos options de paiement fractionné
    pour empêcher toute utilisation frauduleuse de votre réserve de crédit.'
  domain: payments
  product_category: paiement_fractionne
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: fa0e5d02-b485-5b94-a43e-6d0f1a9f1df4
  title: Paiement en 3 ou 4 fois Ondine — conditions générales
  body: 'Le présent document définit les conditions contractuelles régissant l''utilisation
    du Paiement en 3 ou 4 fois Ondine. Ce service permet de fractionner le règlement
    d''un achat selon des modalités strictes de transparence et de responsabilité.


    Éligibilité et Plafonds : Le fractionnement est accessible pour tout achat dont
    le montant est compris entre 100 € (minimum) et 3 000 € (maximum). L''octroi du
    crédit est soumis à une vérification rigoureuse de la solvabilité de l''emprunteur,
    conformément aux directives de l''ACPR et de la Banque de France.


    Coûts et Frais : Chaque opération de paiement fractionné entraîne l''application
    d''un taux de frais fixe de 2,2 %. Ces frais sont justifiés par la gestion du
    risque et les coûts opérationnels de l''institution. Ils sont calculés sur le
    montant total de l''achat et sont transparents dès la souscription.


    Obligations de l''Emprunteur : Vous vous engagez à honorer les échéances selon
    le calendrier convenu. Tout retard de paiement peut entraîner des frais de recouvrement
    et, en cas de difficultés durables, nous vous orienterons vers la commission de
    surendettement.


    Droit de Rétractation : Conformément à la législation en vigueur, vous bénéficiez
    d''un délai de rétractation de 14 jours après la signature du contrat pour annuler
    votre opération sans pénalité.


    Modification et Fin du Contrat : Ondine Crédit se réserve le droit de modifier
    les présentes conditions sous réserve d''un préavis informant le client. Le contrat
    prend fin lors du remboursement intégral du montant principal et des frais associés.


    Le non-respect des obligations de remboursement peut conduire à l''inscription
    au Fichier national des Incidents de remboursement des Crédits aux Particuliers
    (FICP).'
  domain: payments
  product_category: paiement_fractionne
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 640b2299-1b73-5cee-b3a1-4e6bdd0e1cde
  title: Paiement en 3 ou 4 fois Ondine — pour qui et pour quels usages
  body: 'Le Paiement en 3 ou 4 fois Ondine est une solution de financement agile et
    rapide, conçue pour répondre aux besoins de consommation courante des particuliers.
    Il s''adresse aux clients recherchant une flexibilité immédiate pour gérer leur
    budget sans recourir à un crédit complexe sur le long terme.


    Pour quels usages ?

    Ce produit est idéal pour l''acquisition de biens d''équipement, de mobilier,
    ou pour tout achat ponctuel nécessitant un étalement du paiement. Il permet de
    préserver sa trésorerie tout en bénéficiant d''un cadre réglementaire sécurisant.


    Caractéristiques principales :

    - Montant minimum d''achat : 100 €

    - Montant maximum d''achat : 3 000 €

    - Frais de service : 2,2 %


    Pourquoi choisir cette solution ?

    Contrairement aux crédits classiques, le Paiement en 3 ou 4 fois Ondine se distingue
    par sa rapidité de mise en œuvre et la clarté absolue de ses coûts. Il n''y a
    pas de frais cachés : le coût total est connu dès le départ grâce au taux de frais
    unique de 2,2 %.


    Ondine Crédit s''engage à promouvoir un financement responsable. C''est pourquoi
    nous appliquons une vérification systématique de la solvabilité pour nous assurer
    que le rythme de remboursement est compatible avec vos capacités financières.
    Nous vous accompagnons dans l''éducation financière pour que ce choix reste un
    outil de gestion et non un risque d''endettement.'
  domain: payments
  product_category: paiement_fractionne
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 39a64f5f-9283-5a0d-852e-2eacb22961c9
  title: 'Paiement en 3 ou 4 fois Ondine — montant d''achat minimal : explications'
  body: 'Pourquoi existe-t-il un montant minimal pour le paiement fractionné ?


    Le montant d''achat minimal est fixé à 100 €. Ce seuil est instauré pour garantir
    la viabilité opérationnelle de l''opération et pour s''assurer que le fractionnement
    apporte une réelle valeur ajoutée à votre gestion budgétaire. Pour des achats
    inférieurs à 100 €, le paiement comptant reste la solution la plus simple et la
    plus économique.


    Puis-je cumuler plusieurs achats pour atteindre ce seuil ?


    Le fractionnement s''applique à une transaction unique. Vous ne pouvez pas additionner
    plusieurs petits achats pour atteindre le minimum de 100 € si ceux-ci ont fait
    l''objet de transactions séparées.


    Que se passe-t-il si mon panier est légèrement inférieur à 100 € ?


    L''option de paiement en 3 ou 4 fois ne sera pas proposée lors de la validation
    de votre commande. Nous vous invitons à consulter le document Paiement en 3 ou
    4 fois Ondine — présentation pour plus de détails sur les conditions d''utilisation.'
  domain: payments
  product_category: paiement_fractionne
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: ec5c2c8d-4656-5468-9613-9415df704eb3
  title: Paiement en 3 ou 4 fois Ondine — résilier, clôturer ou changer de formule
  body: 'La résiliation ou la clôture d''un plan de Paiement en 3 ou 4 fois Ondine
    intervient généralement lors du remboursement anticipé de la totalité des sommes
    dues. Voici la marche à suivre selon votre situation.


    Pour clôturer un plan en cours (Remboursement anticipé) :

    1. Demandez-nous le solde exact restant dû pour votre transaction spécifique,
    incluant le capital et la part des frais de 2,2 % non encore prélevée.

    2. Confirmez votre volonté de solder l''intégralité du montant en une seule fois.

    3. Nous procéderons au prélèvement du montant total sur votre compte associé.

    4. Nous vous confirmerons par notification la clôture définitive du plan et la
    libération de votre plafond de crédit.


    Pour changer de formule :

    Le Paiement en 3 ou 4 fois Ondine est lié à une transaction précise et ne peut
    être modifié une fois validé (on ne peut pas passer de 3 à 4 fois, par exemple).

    1. Si vous souhaitez une autre modalité de financement pour un nouvel achat, demandez
    l''ouverture d''un nouveau dossier.

    2. Nous vérifierons à nouveau votre solvabilité pour cet achat spécifique, dans
    la limite du plafond de 3 000 €.

    3. Nous confirmerons l''application des frais de 2,2 % pour cette nouvelle opération.


    Sachez que si vous souhaitez annuler l''opération juste après la souscription,
    vous pouvez exercer votre droit de rétractation dans un délai de 14 jours, à condition
    que les fonds n''aient pas encore été débloqués ou que la transaction n''ait pas
    été finalisée.'
  domain: payments
  product_category: paiement_fractionne
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: c40b76b0-6567-50ad-af89-a9bc0bfeae64
  title: Paiement en 3 ou 4 fois Ondine — frais ou montant inattendu
  body: "Symptôme : Le client signale que le montant prélevé est supérieur à ce qu'il\
    \ avait prévu ou qu'il ne comprend pas l'apparition de frais supplémentaires sur\
    \ son relevé.\n\nCauses probables :\n- Omission du taux de frais de 2,2 % lors\
    \ de la lecture du plan de remboursement.\n- Échec d'un prélèvement ayant entraîné\
    \ des frais de rejet bancaire.\n- Erreur de calcul lors de l'application du fractionnement\
    \ sur le montant total.\n\nProcédure de vérification :\n1. Vérifier le montant\
    \ total de l'achat initial. S'assurer qu'il se situe bien entre 100 € et 3 000\
    \ €.\n2. Recalculer les frais : multiplier le montant total de l'achat par 2,2\
    \ %. \n3. Comparer le montant total (Achat + Frais) avec la somme des échéances\
    \ prélevées et restant dues.\n4. Vérifier l'historique des transactions pour identifier\
    \ d'éventuels frais de rejet liés à un manque de provision sur le compte.\n\n\
    Résolution :\n- Si l'erreur provient d'un mauvais calcul de notre part, nous rectifierons\
    \ le solde immédiatement et confirmerons le nouveau montant au client.\n- Si le\
    \ client a omis les frais, rappelez-lui avec pédagogie que le taux de 2,2 % est\
    \ la condition tarifaire transparente appliquée à tous les plans de paiement fractionné.\n\
    - Si des frais de rejet sont présents, expliquez l'origine bancaire du coût.\n\
    \nEscalade :\nSi le litige persiste ou si le client conteste la validité du contrat\
    \ malgré les explications, transférez le dossier à son gestionnaire de compte.\
    \ En cas de contestation réglementaire sur les frais, le dossier sera escaladé\
    \ vers le responsable de la conformité."
  domain: payments
  product_category: paiement_fractionne
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 623bd09c-a87f-5b11-a65b-e95da4bf560f
  title: Paiement en 3 ou 4 fois Ondine — justificatifs à fournir
  body: 'Pour activer l''option de Paiement en 3 ou 4 fois Ondine, chaque client doit
    fournir un ensemble de justificatifs permettant de garantir la sécurité des transactions
    et la solvabilité de l''emprunteur.


    | Document requis | Condition d''acceptation | Résultat

    | :--- | :--- | :--- |

    | Pièce d''identité officielle | En cours de validité (CNI, Passeport) | Validation
    de l''identité

    | Justificatif de domicile | Daté de moins de 3 mois | Vérification de la résidence

    | Relevé d''Identité Bancaire (RIB) | Compte ouvert dans la zone SEPA | Activation
    des prélèvements

    | Justificatif de revenus | Revenus stables et suffisants | Confirmation de la
    solvabilité |


    L''absence d''un seul de ces documents ou la présentation d''un justificatif non
    conforme entraînera le refus systématique du fractionnement. Le montant de l''achat
    doit également être compris entre 100 € et 3 000 € pour que la demande soit traitée.'
  domain: payments
  product_category: paiement_fractionne
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: b47753dc-0e10-5605-9454-50dfcb222b6d
  title: Paiement en 3 ou 4 fois Ondine — face à une offre concurrente type
  body: 'Lorsqu''il compare le Paiement en 3 ou 4 fois Ondine avec des solutions de
    « Buy Now Pay Later » (BNPL) externes, le client doit se concentrer sur la transparence
    et la sécurité réglementaire.


    Comparaison des dimensions clés :

    - Coût : De nombreuses offres concurrentesK affichent un taux « 0 % » mais cachent
    des frais de dossier élevés ou des pénalités de retard prohibitives. Ondine Crédit
    applique un taux unique et transparent de 2,2 % sur le montant total, sans frais
    cachés.

    - Accès : Là où certains concurrents limitent les achats à de petits montants,
    Ondine Crédit permet de fractionner des achats allant jusqu''à 3 000 €, tout en
    maintenant un seuil minimum de 100 €.

    - Risque : Contrairement aux fintechs non régulées, Ondine Crédit opère sous la
    supervision de l''ACPR et de la Banque de France, garantissant un cadre légal
    protecteur pour l''emprunteur.


    Verdict :

    - L''offre concurrente peut convenir pour des micro-achats très occasionnels et
    de faibles montants si le risque de retard est nul.

    - Le Paiement en 3 ou 4 fois Ondine est le meilleur choix pour les clients privilégiant
    la rigueur réglementaire, la clarté absolue des frais et la possibilité de financer
    des achats plus significatifs (jusqu''à 3 000 €) en toute sécurité.'
  domain: payments
  product_category: paiement_fractionne
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: d51dcd3b-54e2-5c4f-a0df-41f51538a206
  title: Paiement en 3 ou 4 fois Ondine — informations sur les risques
  body: "Le recours au Paiement en 3 ou 4 fois Ondine, bien que conçu pour faciliter\
    \ la gestion budgétaire, constitue un engagement financier qui comporte des risques.\n\
    \nRisque d'Endettement : Le fractionnement de plusieurs achats peut mener à une\
    \ accumulation d'échéances mensuelles. Nous vous rappelons que le crédit vous\
    \ engage et doit être remboursé. Nous appliquons strictement la vérification de\
    \ la solvabilité pour limiter ce risque, mais il vous appartient de veiller à\
    \ ce que la somme de vos mensualités ne compromette pas votre équilibre financier.\n\
    \nConséquences des Impayés : Tout défaut de paiement peut entraîner des frais\
    \ supplémentaires et l'activation de procédures de recouvrement. En cas d'incident\
    \ de paiement durable, Ondine Crédit est tenu de signaler l'incident au Fichier\
    \ national des Incidents de remboursement des Crédits aux Particuliers (FICP),\
    \ ce qui pourrait limiter votre accès futur au crédit.\n\nCadre Réglementaire\
    \ : Ce produit est régi par les normes de la Banque de France et de l'ACPR. Vous\
    \ disposez d'un droit de rétractation légal de 14 jours pour annuler votre contrat.\
    \ \n\nEn cas de difficultés financières durables, nous vous recommandons vivement\
    \ de nous en informer sans délai afin que nous puissions vous orienter vers la\
    \ commission de surendettement, conformément à notre politique de protection des\
    \ clients. Nous nous engageons à ne jamais minimiser le coût total du crédit,\
    \ lequel inclut le montant principal et les frais de 2,2 %."
  domain: payments
  product_category: paiement_fractionne
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: ondine_credit
- id: 7952ca09-7c2f-51f3-bc41-fb231cbf651c
  title: Paiement en 3 ou 4 fois Ondine — calcul et application des taux
  body: 'L''application tarifaire du Paiement en 3 ou 4 fois Ondine repose sur un
    principe de simplicité et de transparence totale. Un taux unique s''applique à
    l''ensemble des opérations, sans distinction de profil client ou de montant, dès
    lors que les seuils d''éligibilité sont respectés.


    Taux applicable : 2,2 % (frais fixes sur le montant total de l''achat).


    Calcul du coût :

    Le coût du crédit est calculé en multipliant le montant total de la transaction
    par le taux de frais. Ce montant est ensuite ajouté au capital pour déterminer
    la somme totale à rembourser.


    Exemple d''application :

    Pour un achat d''un montant de 1 000 € :

    - Calcul des frais : 1 000 € x 2,2 % = 22 €

    - Coût total du crédit : 1 022 €

    - Mensualités (si 4 fois) : 1 022 € / 4 = 255,50 € par mois.


    Ce taux est fixe pour la durée du plan de paiement. Aucun autre taux d''intérêt
    ou frais de dossier ne s''ajoute à ce montant. Le montant de l''achat doit impérativement
    être compris entre 100 € et 3 000 € pour que ce barème s''applique.'
