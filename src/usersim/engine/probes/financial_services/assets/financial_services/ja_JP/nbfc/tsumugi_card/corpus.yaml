- id: f90824b1-6446-59a6-b4bf-d791eecc8260
  title: foreclose_loan を使う場面
  body: 'お客さまから、キャッシングまたはつむぎカードローンの借入残高をすべて一括で返済したい（全額完済したい）との要望があった際に本手続きを行います。


    【注意事項】

    - 本手続きは「一括返済」であり、一度完了すると当該融資契約の残高はゼロになります。不可逆的な操作であるため、お客さまの意思を十分に確認してください。

    - 完済に必要な正確な金額（元本および精算日までの利息）をあらかじめ案内してください。


    【手続き手順】

    1. お客さまにフルネーム（氏名）と生年月日を確認し、`verify_identity`を呼び出して本人確認を完了します。

    2. `get_accounts`を呼び出し、完済対象となる`account_id`を特定します。

    3. `get_loan_details`で現在の正確な残高を確認し、お客さまに一括返済額を提示して同意を得ます。

    4. `foreclose_loan`を呼び出し、一括返済手続きを完了します。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: tsumugi_card
- id: cecc2749-f070-54b8-a9d6-6713c2ce38d0
  title: foreclose_loan ツールリファレンス
  body: 'このツールは、指定された融資アカウントの全残高を一括で返済し、完済させるために使用します。エージェントはこのツールを直接呼び出すことで、完済手続きを実行します。


    本操作は不可逆的な変更を伴います。本人確認は`verify_identity`によって完了していることが前提です。


    【引数】

    - `account_id`: `get_accounts`などで取得した、完済対象アカウントの識別子です。'
