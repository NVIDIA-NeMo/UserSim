  institution_id: tsumugi_card
- id: 2ae4570c-1c3f-59b2-b685-a60f858d79d1
  title: 分割払い：3回払いの手数料（利用金額100円あたり）について
  body: '【ご質問】

    分割払いで「3回払い」を選択した場合、手数料はいくらになりますか？


    【回答】

    つむぎカードの分割払いにおける3回払いの手数料は、利用金額100円あたり2.01円となります。


    例えば、30,000円のお買い物を3回払いでご利用いただいた場合、手数料の目安は603円（30,000円 ÷ 100 × 2.01円）となります。なお、分割払い全般の手数料率は、実質年率12%から15%の範囲で設定されております。


    その他の手数料詳細については、「分割払い：手数料一覧」をご確認ください。'
