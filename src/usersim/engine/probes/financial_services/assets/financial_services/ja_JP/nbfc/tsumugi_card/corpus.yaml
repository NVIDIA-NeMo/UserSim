- id: 7eb541e0-ed8c-5837-a1be-c4580b5b34e7
  title: リボ払い：安全にご利用いただくためのポイント
  body: 'リボ払いを安心・安全にご利用いただくために、以下のセキュリティポイントを必ずご確認ください。


    ■不審な連絡にご注意ください

    つむぎカードからのお電話やメールで、以下のような情報を伺うことは絶対にございません。

    ・カードの暗証番号（PIN）

    ・カード裏面のセキュリティコード（CVV）

    ・パスワードやワンタイムパスワード

    ・身分証明書の番号


    もしこのような情報を求める連絡があった場合は、詐欺の可能性があります。すぐに通話を切り、当社までご連絡ください。


    ■インターネット決済の安全対策

    オンラインでのショッピングにリボ払いをご利用の際は、本人認証サービス「EMV 3-Dセキュア」を導入しております。これにより、カード番号だけでなく追加の認証を行うことで、不正利用のリスクを低減しています。


    ■異常を感じたときの対応

    ご利用明細に心当たりのないリボ払い残高や手数料が含まれていた場合は、速やかにご連絡ください。迅速に利用停止および再発行の手続きを行い、規約に基づいた補償を適用いたします。


    安全なご利用のために、定期的にご利用明細をご確認いただくことをおすすめいたします。'
  domain: payments
  product_category: ribo_barai
  document_type: security_advisory
  source_authority: official
