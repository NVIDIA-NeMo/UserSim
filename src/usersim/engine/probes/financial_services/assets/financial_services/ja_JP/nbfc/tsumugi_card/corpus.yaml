- id: 4b63bc93-1d78-54c5-bf91-40f7d7c82521
  title: つむぎカード：解約・変更・プランの切替え
  body: 'つむぎカードの解約や、登録内容の変更、プランの切替えを希望される際の手順をご案内します。


    【お手続きの流れ】


    1. ご本人確認

    まず、ご登録いただいている「フルネーム（氏名）」と「生年月日」をお伝えください。弊社にてご本人確認を行います。


    2. ご要望内容の伝達

    「カードを解約したい」「登録情報を変更したい」「別のプランに切り替えたい」など、具体的なご要望をお伝えください。


    3. 詳細の確認と手続き

    担当者が現在の契約状況や、プラン切替えに伴う条件（年会費などの変更点）をご説明します。内容に同意いただけることを確認し、手続きを進行します。


    4. 手続き完了の通知

    お手続きが完了した旨を、担当者が口頭または書面にてご案内します。これで手続きは完了です。


    【ご注意事項】

    * カードを解約される場合、未払いのショッピング残高がある場合は、完済までにお支払いを完了させる必要があります。

    * ETCカード（年会費550円）を併用されている場合、本体カードの解約に伴いETCカードも同時に解約となりますのでご注意ください。


    プランの選び方についてご不安な場合は、「つむぎカード：プランの選び方」をご参照ください。'
