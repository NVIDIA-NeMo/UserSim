- id: 58bd9f94-70fe-55b9-9ce7-bce1174214f9
  title: 分割払い：必要書類
  body: '「分割払い」をご利用いただくための審査および利用可能枠の設定には、割賦販売法に基づいた「支払可能見込額の調査」が必要です。以下の書類のご提示をお願いしております。


    | 確認事項 | 必要書類の例 | 判定・結果への影響 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポート等 | 本人確認が完了しない場合は利用不可 |

    | 年収の確認 | 源泉徴収票、確定申告書、直近の給与明細書等 | 支払可能見込額の算定根拠となり、利用枠に影響 |

    | 生活維持費の確認 | 家計簿、住居費の証明書、他社借入状況の申告 | 年収から差し引かれ、最終的な利用限度額が決定 |

    | 居住確認 | 公共料金の領収書、住民票等（必要な場合のみ） | 住所確認の整合性を確認し、審査に反映 |'
