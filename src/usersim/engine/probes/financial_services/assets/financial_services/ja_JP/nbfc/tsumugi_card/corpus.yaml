- id: c956758e-87bb-50b5-81d9-92095ae52613
  title: 分割払い：分割払いの最大支払回数について
  body: '【ご質問】

    分割払いを利用する場合、最大で何回まで分けて支払うことができますか？


    【回答】

    つむぎカードの「分割払い」では、最大24回までのお支払回数をご選択いただけます。お買い物の金額や、ご自身の月々の予算に合わせて計画的に回数をお選びください。


    なお、分割回数に応じて手数料率が変わる場合がございます。詳細な手数料については「分割払い：手数料と費用」をご確認ください。'
