- id: 171bc462-8b73-5d1e-aefa-0fefb20eef2f
  title: つむぎカード：お手続きが完了しない・保留中のまま
  body: '【症状】

    カードのお申込み手続きを行ったが、ステータスが「保留中」のまま進まない、または完了通知が届かない。


    【考えられる原因】

    ・本人確認情報の不一致：お伝えいただいた「フルネーム（氏名）」または「生年月日」が、登録情報や提出書類と一致していない可能性があります。

    ・支払可能見込額の調査への回答不足：年収や生活維持費など、審査に必要な情報の確認が不十分である場合があります。

    ・書類の不備：提出された身分証の画像が不鮮明であるなどの理由で、確認が止まっている可能性があります。


    【確認と解決策】

    1. 情報の再確認：まず、お申込み時に入力・伝達した氏名と生年月日が正確であるか、今一度ご確認ください。

    2. 不足情報の提供：私たちから不足している情報の提供を求めている場合は、速やかに詳細をお伝えください。

    3. 再送手続き：書類不備のご連絡があった場合は、改めて鮮明な書類をご提示ください。


    【エスカレーション】

    上記を確認しても解決せず、数営業日が経過している場合は、専門の審査部門へ詳細な調査を依頼いたします。調査の結果および進捗状況については、定期的に、かつ透明性を持ってご報告いたします。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 9ef6c03a-0c3b-5689-a7cc-86494ade09a5
  title: つむぎカード：お申込みいただける方
  body: 'つむぎカードのお申込み条件および審査基準は以下の通りです。


    | 条件項目 | 内容・基準 | 結果 |

    | :--- | :--- | :--- |

    | 本人確認 | フルネーム（氏名）と生年月日の提示が可能であること | 必須 |

    | 支払能力 | 支払可能見込額の調査に基づき、適正な利用枠が設定できること | 必須 |

    | 信用状況 | 指定信用情報機関への登録内容に重大な不備がないこと | 審査対象 |

    | 利用限度額 | 審査により、最大1,000,000円の範囲内で設定 | 個別設定 |

    | 年齢制限 | 日本国内に居住し、契約能力を有する成人であること | 必須 |


    ※割賦販売法および貸金業法に基づき、過剰な借入を防止するための適正な審査を行います。'
