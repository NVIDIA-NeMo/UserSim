- id: 057f1c0d-40ff-5b40-a909-32de8ae988d8
  title: つむぎカードローン：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードローンをかたる第三者による詐欺行為について、大切なお知らせです。お客様の資産を守るため、以下の点に十分ご注意ください。


    ■ よくある詐欺の手口

    「審査に通過し、特別な低金利で融資ができる」といった案内を、メールやSNS、電話で送る手口が報告されています。また、融資を実行するために「保証金」や「手数料」として、事前にお金を振り込ませようとするケースがありますが、つむぎカードがこのような要求をすることはありません。


    ■ 当社が絶対にお聞きしないこと

    つむぎカードでは、ご本人確認のために「フルネーム（氏名）」と「生年月日」の2点を確認いたします。それ以外の以下の情報は、どのような場合でもお聞きしません。


    * カード番号、CVV（セキュリティコード）、暗証番号

    * パスワードやワンタイムパスワード

    * 身分証の番号（マイナンバーなど）


    ■ 異常を感じたときの対応

    「心当たりのない連絡が来た」「お金の振り込みを要求された」など、少しでも不審に感じた場合は、すぐにお取引を中断し、当社までご連絡ください。迅速に状況を確認し、必要に応じて利用停止などの手続きを行います。'
