- id: e34c7151-276b-53e0-ab09-8421959ca2d8
  title: キャッシング：金利・料率の決まり方と適用
  body: 'キャッシングに適用される金利および手数料の決定方法についてご案内します。


    ■適用金利

    ・キャッシング金利（実質年率）：18%


    本商品はフラットレートを採用しており、すべてのお客さま、およびすべての利用残高に対して一律で年18%の金利を適用いたします。残高に応じた金利の変動（ティア構造）はございません。


    ■金利の適用タイミング

    金利は、ATMでお引き出しいただいた日から、ご返済いただいた日までの日数分が日割りで計算され、翌月の請求額に加算されます。


    ■手数料の適用

    ATM利用手数料は、1回のお引き出し金額に基づき、以下の通り適用されます。

    ・1万円以下：110円

    ・1万円超：220円


    金利の適用に関する詳細は、「キャッシング：リスクについてのご説明」をご確認ください。'
