- id: 45221468-32a5-5abc-a88d-19fd0e151568
  title: つむぎカードローン：金利・料率一覧
  body: 'つむぎカードローンに適用される金利についてご案内します。


    ■適用金利（実質年率）

    年4.5% 〜 年18%


    【金利の決定方法】

    金利は一律ではなく、以下の要素を総合的に審査して決定されます。

    ・年収および就業状況（勤続年数など）

    ・現在の他社借入残高

    ・過去の信用取引実績（返済履歴）


    【金利の適用について】

    ・決定した金利は、借入残高に対して日割りで計算されます。

    ・金利は原則としてご契約時に決定しますが、当行の審査基準の変更や、お客さまの信用状況の変化により、改定される場合がございます。


    【利息を軽減する方法】

    本商品は繰上返済が可能です。毎月の最低返済額（4,000円）以上の金額を返済することで元金が早く減り、結果としてお支払いいただく利息の総額を軽減することができます。'
