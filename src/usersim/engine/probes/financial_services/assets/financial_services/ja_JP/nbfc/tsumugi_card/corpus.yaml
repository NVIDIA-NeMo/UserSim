  institution_id: tsumugi_card
- id: 9637cc72-0d0c-5b6c-b851-b3911bfb5cf0
  title: リボ払い：お取引が拒否された・制限された
  body: '【想定される症状】

    「ショッピング利用分をリボ払いに変更しようとしたが、エラーになり受け付けられない」「リボ払いの設定変更ができない」


    【考えられる原因】

    1. 利用可能枠の不足：支払可能見込額の調査に基づき設定された限度額を超過している可能性があります。

    2. 審査状況の変化：最新の信用情報に基づき、一時的にリボ払い機能が制限されている場合があります。

    3. お支払い遅延：過去に支払いの遅延があり、制限がかかっている可能性があります。


    【確認と対処法】

    ・まず、現在の利用可能枠に余裕があるかをご確認ください。

    ・お支払いが滞っていないか、最新の明細をご確認ください。


    【解決しない場合の対応】

    上記を確認しても解決しない場合、または制限の理由について詳細を確認したい場合は、当社にて対応いたします。担当者が状況を確認し、必要に応じて専門の審査部門へエスカレーションいたします。審査結果および今後の利用可否については、後日改めてご連絡を差し上げます。'
