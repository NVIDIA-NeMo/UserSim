- id: 15f4ffaa-39ed-5635-9959-819d3f088327
  title: つむぎカード：個人情報の取扱い
  body: 'つむぎカードでは、お客さまからお預かりした個人情報を、法令に基づき適切に管理・運用しております。


    ■個人情報の利用目的

    ご提供いただいた個人情報は、主に以下の目的で利用いたします。

    ・カードの発行審査および利用可能枠（上限1,000,000円）の算定

    ・割賦販売法に基づく「支払可能見込額の調査」の実施

    ・ご請求金額の通知および決済処理

    ・不正利用の検知および防止


    ■指定信用情報機関への登録

    弊社は、貸金業法および割賦販売法に基づき、ご契約内容や支払状況を「指定信用情報機関」に登録いたします。これは、過剰な借入を防止し、健全な信用環境を維持するための法定手続きです。登録された情報は、他社での審査時などに参照される場合があります。


    ■安全管理措置

    個人情報の漏洩を防ぐため、厳格なアクセス制限と暗号化を行い、社内規定に従い管理しております。また、インターネット決済においては「EMV 3-Dセキュア」などの本人認証サービスを導入し、情報の悪用を防止しています。


    ■お客さまの権利

    ご自身の個人情報の開示、訂正、利用停止を希望される場合は、弊社窓口までお問い合わせください。本人確認（フルネームと生年月日）の後、適切に手続きをさせていただきます。'
