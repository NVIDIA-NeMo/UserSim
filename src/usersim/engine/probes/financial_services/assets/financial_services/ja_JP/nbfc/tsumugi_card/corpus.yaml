- id: 6fe6d709-2939-5002-80c4-6088b1feb049
  title: つむぎカード：手数料と費用
  body: '【Q】つむぎカードを維持するためにかかる費用はありますか？


    【A】はい。年会費として1,375円をいただいております。また、ETCカードを併せてご利用の場合は、別途ETCカード年会費として550円がかかります。


    【Q】買い物をしたときに、毎回手数料がかかるのでしょうか？


    【A】いいえ。1回払い、2回払い、およびボーナス一括払いでのお支払いは手数料無料です。ただし、分割払いまたはリボ払いをご利用の場合は、所定の手数料が発生いたします。


    【Q】ポイント還元はどのくらい受けられますか？


    【A】ポイント還元率は0.5%です。日々の決済で計画的にポイントを貯めていただけます。詳細は「つむぎカード：ポイント還元率について」をご参照ください。'
