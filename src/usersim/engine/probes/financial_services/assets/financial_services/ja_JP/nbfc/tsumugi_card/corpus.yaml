- id: e0b49c06-28b3-59db-bde0-9fb17aa58539
  title: つむぎカード：実施中のキャンペーン
  body: '【新入会者応援ポイントプレゼントキャンペーン】


    つむぎカードへのご入会ありがとうございます。現在、新しくカードをご利用いただくお客さまを対象に、以下の特典をご用意しております。


    ■キャンペーン期間

    2025年1月1日から2025年6月30日まで


    ■特典内容

    期間中に対象のカードをお申し込みいただき、初回のご利用が確認できた方に、期間限定ポイント 1,000円分をプレゼントいたします。


    ■適用条件

    ・2025年6月30日までに「つむぎカード：お申込みとご利用開始」の手順に沿って入会を完了された方

    ・入会後、期間中に1回以上のショッピング利用がある方


    ポイントは、条件達成後、翌月のお取引明細にて付与されます。日々の決済にぜひお役立てください。'
