- id: dc28a6c0-60da-51e9-91e4-f251aeee3b36
  title: キャッシング：解約・変更・プランの切替え
  body: 'キャッシング機能の解約や利用枠の変更手続きについてご案内します。


    ■キャッシング機能の解約（停止）手順

    1. ご本人確認：フルネーム（氏名）と生年月日をお伝えください。

    2. 残高の確認：現在のお借入れ残高を確認します。残高がある場合は、まず全額を返済していただく必要があります。

    3. 解約の申請：キャッシング機能の停止を希望される旨をお伝えください。

    4. 完了通知：手続きが完了し、以降キャッシングが利用できなくなったことを当社より確認させていただきます。


    ■利用可能枠の変更（減枠・増枠）手順

    1. ご本人確認：フルネーム（氏名）と生年月日をお伝えください。

    2. 希望額の提示：変更したい利用可能枠の金額をお伝えください（最大500,000円まで）。

    3. 審査（増枠時のみ）：増枠をご希望の場合、最新の年収等の情報を確認し、支払能力の審査を行います。

    4. 結果通知：審査に基づき設定された新しい利用可能枠を当社より通知いたします。


    お手続きに関する不安がある場合は、「キャッシング：重要事項のご説明」をご一読ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
