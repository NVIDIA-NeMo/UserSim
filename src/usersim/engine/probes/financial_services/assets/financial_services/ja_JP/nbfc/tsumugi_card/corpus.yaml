- id: 0712f188-6398-54fc-87f6-71ef2a58aa52
  title: つむぎカード：お申込みとご利用開始
  body: 'つむぎカードのお申込みからご利用開始までの手順をご案内します。


    【ご準備いただくもの】

    ・ご本人様確認書類（運転免許証など）

    ・ご印鑑（必要な場合のみ）


    【お手続きの流れ】

    1. お申込みの意思伝達：私たちに「つむぎカードを申し込みたい」とお伝えください。

    2. ご本人様確認：セキュリティのため、お客さまの「フルネーム（氏名）」と「生年月日」の2点を確認させていただきます。

    3. 審査の実施：割賦販売法に基づき、年収や生活維持費などの情報を伺い、「支払可能見込額の調査」を行います。これにより、最大1,000,000円の範囲内で、お客さまに最適な利用可能枠を決定します。

    4. カードの発行・郵送：審査承認後、カードを作成し、ご登録のご住所へ郵送いたします。

    5. 利用開始：カードがお手元に届きましたら、設定完了のご連絡をいただき、すぐにご利用いただけます。


    【完了の確認】

    カードが届き、初期設定が完了した時点で、日々の決済および0.5%のポイント還元サービスが適用されます。手続きの詳細や注意点については「つむぎカード：重要事項のご説明」をご確認ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: how_to_guide
  source_authority: official
