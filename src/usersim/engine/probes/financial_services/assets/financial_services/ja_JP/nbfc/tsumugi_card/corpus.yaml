- id: d8a5828e-905e-5dbb-889c-1224838ff4f8
  title: リボ払い：明細や記録と合わない
  body: "【エージェント向け：明細の不整合に関する対応】\n\n【想定される症状】\n顧客から「毎月5,000円支払っているのに、リボ残高がほとんど減っていない」「想定より支払総額が多くなっている」という問い合わせ。\
    \ \n\n【原因の解説】\nリボ払いの仕組み上、毎月の支払額には「元金分」と「手数料分」が含まれています。リボ払いの手数料率（実質年率）15%に基づき計算されるため、残高が高額な場合、最低支払額の5,000円の大部分が手数料の支払いに充てられ、元金が減りにくい状況が発生します。\n\
    \n【対処法】\n1. 顧客の現在のリボ残高と、直近の明細における「手数料額」を具体的に提示してください。\n2. 「リボ払いの仕組み」に基づき、残高に対して手数料がかかり続けるため、支払総額が増えやすいことを丁寧に説明してください。\n\
    3. 解決策として、手数料を軽減するための「繰上返済」を提案してください。\n\n【エスカレーション】\n計算内容について顧客が納得せず、強い不信感を持たれた場合や、システム的な計上ミスの疑いがある場合は、速やかにコンプライアンス担当または専門の審査部門へエスカレーションし、公正な再調査を行ってください。"
