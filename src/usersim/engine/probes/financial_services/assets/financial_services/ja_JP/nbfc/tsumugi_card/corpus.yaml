- id: b87eb794-0d4c-50ea-a789-88119d577ee4
  title: つむぎカードローン：解約・変更・プランの切替え
  body: 'つむぎカードローンのご契約内容の変更や解約をご希望される際の手順をご案内いたします。


    ■お手続き前にご確認いただきたいこと

    *   解約を希望される場合は、借入残高をすべて精算していただく必要があります。

    *   ご本人様確認のため、フルネームと生年月日をご用意ください。


    ■お手続きの手順

    1.  当社スタッフへ、フルネーム（氏名）と生年月日を伝えてください。

    2.  「解約したい」「返済プランを変更したい」など、ご希望の内容を伝えてください。

    3.  （解約の場合）現在の借入残高と、精算に必要な合計金額を確認し、お支払手続きを行います。

    4.  （変更の場合）新しい返済額やプランの条件を確認し、合意します。

    5.  当社にて手続きを完了し、完了通知（メッセージまたは書面）を受け取ります。


    ■完了の確認

    お手続き完了後、最新の利用可能枠や返済スケジュールが反映されます。内容に相違がないかをご確認ください。


    なお、返済額の変更により、毎月の最低返済額である4,000円を下回る設定はできませんのでご注意ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 9034cf4d-a8e7-5bbd-b46c-a4221b9b057b
  title: つむぎカードローン：想定外の手数料・金額
  body: '「明細を確認したところ、想定していたよりも返済金額や利息が高くなっている」と感じられた場合の確認事項です。


    ■考えられる原因

    *   利息の累積：返済額を最低返済額（4,000円）に近い金額に設定している場合、元金の減少速度が緩やかになり、結果として支払う利息の総額が増えることがあります。

    *   金利の適用：審査に基づき、貸付金利（上限）である18%に近い金利が適用されている可能性があります。

    *   支払日のずれ：返済日の変更などで、日割り計算の利息が通常より多く発生した可能性があります。


    ■確認の手順

    1.  現在の適用金利が、契約時のどの範囲（4.5% ～ 18%）にあるかをご確認ください。

    2.  直近の返済額が、元金の返済にどの程度充てられ、利息にいくら充てられたかを確認します。

    3.  繰上返済を行い、元金を減らすことで今後の利息負担を軽減できるか検討してください。


    ■解決しない場合

    上記を確認しても納得がいかない場合や、返済が困難な状況にある場合は、至急当社へご相談ください。専門の担当者が現在の状況を調査し、返済条件の見直しについて個別に案内いたします。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
