- id: 26322fac-f173-5c0f-92fb-74dc36b1c6af
  title: リボ払い：リスクについてのご説明
  body: 'リボ払いをご利用いただく前に、必ず以下のリスクについてご理解ください。


    ■支払総額が増加する仕組み

    リボ払いは、月々の支払額を一定に抑えられる便利なサービスですが、その一方で残高に対して実質年率15%の手数料がかかり続けます。特に、毎月の支払額を最低の5,000円に設定している場合、元金の減少が非常に緩やかになり、結果として支払総額が当初の想定を大きく上回ることがあります。


    ■「リボ払い」利用上の注意点

    ・支払額を低く設定しすぎると、完済までに非常に長い年月を要する場合があります。

    ・リボ残高がある状態でさらに利用を続けると、残高が積み上がり、返済が困難になるリスクがあります。


    ■健全な利用のために

    ・余裕があるときは、必ず「繰上返済」を行い、元金を減らしてください。

    ・ご自身の年収や生活維持費に基づいた適正な利用範囲内でご利用ください。


    万が一、お支払いが困難になった場合は、放置せず早めにご相談ください。誠実義務に基づき、お客様の状況に合わせた対応を検討いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 29a73823-04e6-5fee-a330-706eec744d8f
  title: リボ払い：金利・料率の決まり方と適用
  body: 'リボ払いに適用される手数料率の決定方法についてご案内します。


    ■適用される手数料率

    リボ払いの手数料率は、一律で以下の通りです。

    ・リボ払いの手数料率（実質年率）：15%


    ■料率の適用方法

    ・本サービスでは、残高に応じた段階的な金利設定（ティア構造）は採用しておりません。すべてのお客様に一律の実質年率15%が適用されます。

    ・手数料は、前月末のリボ残高に対し、日割り計算で算出されます。


    ■変動の可能性について

    原則として固定の率を適用しておりますが、法規制（利息制限法等）の変更や、経済状況の著しい変化により、規定に基づき改定される場合があります。改定の際は、あらかじめ書面やWeb等でお知らせいたします。'
