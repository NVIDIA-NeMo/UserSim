- id: 223c0704-ffc7-576e-81a7-55cd73264220
  title: つむぎカードローン：ご利用開始までの手順
  body: "つむぎカードローンのご利用を開始するまでの流れをご案内します。本サービスは、余裕を持った返済計画でご利用いただける低利の融資商品です。\n\n■ご利用開始までのステップ\n\
    \n1.  **お申し込み**\n    必要事項を記入し、お申し込みください。この際、ご希望の利用限度額をご提示いただきます。\n\n2.  **ご本人確認**\n\
    \    当社スタッフが「フルネーム（氏名）」と「生年月日」の2点を確認し、ご本人様であることを認証いたします。\n\n3.  **審査と支払可能見込額の調査**\n\
    \    貸金業法および割賦販売法に基づき、年収や生活維持費、他社借入状況などの審査を行います。これにより、適正な利用可能枠（上限5,000,000円まで）を決定します。\n\
    \n4.  **ご契約内容の確認**\n    適用される貸付金利（4.5%〜18%）および毎月の最低返済額（4,000円）についてご説明いたします。内容に同意いただいた後、ご契約成立となります。\n\
    \n5.  **ご利用開始**\n    審査で決定した利用限度額の範囲内で、資金のお借入れが可能になります。\n\n■重要事項\n*   審査の結果、ご希望の限度額に届かない場合や、ご利用いただけない場合がございますのでご了承ください。\n\
    *   融資の承認を確約するものではありません。誠実な審査に基づき決定いたします。"
