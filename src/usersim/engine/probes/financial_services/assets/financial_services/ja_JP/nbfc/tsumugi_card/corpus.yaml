- id: 58dc6e6c-93bf-5c60-97ad-ecf6f2d7f3d4
  title: つむぎカードローン：安全にご利用いただくためのポイント
  body: 'つむぎカードローンを安心してお使いいただくため、セキュリティに関する重要な注意点をご案内いたします。


    ■つむぎカードが「絶対にお伺いしない」情報

    当社スタッフが、電話やメール、チャットなどで以下のような情報を聞き出すことは絶対にございません。これらの要求があった場合は、詐欺の可能性がありますので十分にご注意ください。


    *   カード番号、CVV（セキュリティコード）

    *   暗証番号、パスワード

    *   身分証明書の番号（マイナンバーなど）

    *   ワンタイムパスワード


    ■ご本人確認の方法について

    当社で本人確認が必要な操作を行う際は、必ず「フルネーム（氏名）」と「生年月日」の2点を確認させていただきます。それ以外の認証ステップを求めることはございません。


    ■不審な点を感じたときの対応

    「心当たりのない請求がある」「不審なメールが届いた」など、不正利用の疑いがある場合は、直ちにご連絡ください。迅速に利用停止および再発行の手続きを行い、規約に基づいた補償を適用いたします。


    ■被害を最小限にするために

    万が一、情報を漏洩させてしまった場合や、不正な操作が行われた疑いがある場合は、気づいた時点ですぐにご報告ください。報告が早いほど、被害の拡大を防ぎ、公正な調査による補償を適用しやすくなります。


    お客様の財産を守るため、不審な連絡には十分にご注意ください。'
