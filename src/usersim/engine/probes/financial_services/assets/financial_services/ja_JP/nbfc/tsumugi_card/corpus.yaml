- id: b6eb20d1-6fc8-5785-9bde-b221729eac1d
  title: つむぎカード：安全にご利用いただくためのポイント
  body: 'つむぎカードを安心してお使いいただくために、セキュリティに関する重要なポイントをご案内いたします。


    ■弊社が「絶対に」お聞きしない情報

    つむぎカードでは、以下の情報を電話やチャット、メールでお伺いすることはございません。もし要求された場合は、詐欺の可能性がありますので絶対に応じないでください。

    ・カード番号、有効期限、CVV（セキュリティコード）

    ・カードの暗証番号（PIN）

    ・パスワードやワンタイムパスワード

    ・身分証明書の番号


    ■本人確認の方法について

    お手続きの際、弊社から本人確認をお願いすることがございます。その際は必ず「フルネーム（氏名）」と「生年月日」の2点を確認させていただきます。それ以外の認証ステップ（アプリ承認など）は行いませんのでご注意ください。


    ■インターネット決済の安全対策

    オンラインショッピングの際は、カード番号だけでなく本人認証を追加して不正利用を防ぐ「EMV 3-Dセキュア」を導入しております。加盟店での設定状況をご確認ください。


    ■万が一、不正利用の疑いがある場合

    速やかにカードの利用停止および再発行の手続きを行います。規約に基づいた補償を適用し、公正な調査の結果を定期的にお伝えいたします。不審な請求に気づいた際は、すぐに弊社までご連絡ください。'
