- id: 5c7b7cda-468d-5f36-8935-6e9ec5723644
  title: キャッシング：お手続きが完了しない・保留中のまま
  body: 'キャッシングの利用申込みをしたものの、お手続きが完了せず「保留中」となっている場合、以下の原因が考えられます。


    【よくある原因】

    ・ご本人確認情報の不一致：お伝えいただいた「フルネーム（氏名）」または「生年月日」が、登録情報と一致していない場合がございます。

    ・審査の時間を要している：総量規制に基づき、指定信用情報機関への照会や年収の確認を行っているため、お時間をいただいている場合がございます。


    【確認と解決の手順】

    1. 情報の再確認

    改めて、ご本人確認に使用した氏名と生年月日に間違いがなかったかをご確認ください。


    2. 弊社による状況確認

    お客様から状況をお伺いした後、弊社担当者が専門の審査部門へ現在の進捗を確認いたします。


    【今後の流れ】

    ・審査が完了次第、利用可能枠の決定についてご連絡いたします。

    ・万が一、審査の結果としてご希望の枠を設定できない場合や、追加の書類確認が必要な場合は、その旨を誠実にご案内いたします。'
