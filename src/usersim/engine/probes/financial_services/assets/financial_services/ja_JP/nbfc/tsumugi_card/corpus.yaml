- id: 2738c3e9-eee1-527c-836f-87ba6cbfb33b
  title: つむぎカードローン：限度額・制限と注意事項
  body: 'つむぎカードローンのご利用にあたっての制限事項および注意点についてご案内します。本商品は貸金業法の規制を厳格に遵守して運営されています。


    ■ 利用限度額と審査

    * 利用限度額の上限：5,000,000円

    * 設定基準：お客様の年収、生活維持費、および他社借入状況などの返済能力に基づき、審査の上で個別に設定いたします。

    * 総量規制について：貸金業法に基づき、貸金業者からの借入れ合計額は、原則として年収の3分の1までと制限されています。


    ■ 金利について

    * 貸付金利（下限）：4.5%

    * 貸付金利（上限）：18%

    * 利息制限法に基づき、元本額に応じた上限金利が適用されます。具体的は「つむぎカードローン：金利・料率一覧」をご参照ください。


    ■ 注意事項

    * 適正な利用枠の設定により、お申し込みいただいた金額と実際の利用可能額が異なる場合があります。

    * 返済が困難になった場合は、早めのご相談をお願いいたします。返済条件の見直しなどのご案内が可能です。

    * 借入れの状況は、指定信用情報機関に適切に登録されます。'
