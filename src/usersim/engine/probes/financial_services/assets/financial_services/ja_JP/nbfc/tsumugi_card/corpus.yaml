- id: fbd99606-6910-57b4-b325-bef101992858
  title: キャッシング：おすすめの方と主な使い方
  body: 'キャッシングは、ATMなどを通じて、短期的かつ急な資金ニーズに即座に対応できる少額融資サービスです。


    ■このような方におすすめです

    ・急に現金が必要になったが、少額なので短期間で返済できる方

    ・銀行などの融資手続きに時間をかけず、今すぐ資金を確保したい方

    ・つむぎカードの決済機能と合わせて、柔軟な資金調達手段を持っておきたい方


    ■サービス内容とご利用条件

    ・キャッシング金利（実質年率）：18%

    ・キャッシング利用可能枠の上限：500,000円（審査により異なります）

    ・ATM利用手数料：

    　- 1万円以下のお引き出し：110円

    　- 1万円を超えるお引き出し：220円


    ■主な使い方

    全国の対応ATMにて、つむぎカードを挿入し、キャッシングメニューを選択することで、設定された利用可能枠の範囲内で即座に現金をお引き出しいただけます。急な出費に備えて、あらかじめ利用枠を確保しておくことで、安心感のある生活基盤としてご活用いただけます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: ed99a5d3-3b77-56b2-bfcc-a37dc43fb4ff
  title: キャッシング：キャッシング利用可能枠の上限について
  body: '【質問】キャッシングで利用できる金額の上限はいくらまでですか？

    【回答】キャッシング利用可能枠の上限は500,000円です。ただし、実際にご利用いただける金額は、お客さまの年収や他社借入状況に基づいた審査により決定されます。


    【質問】利用可能枠を増やすことはできますか？

    【回答】はい、増枠のお申し込みが可能です。ただし、貸金業法の「総量規制」により、貸金業者からの借入れ合計額は原則として年収の3分の1までと制限されております。審査の結果、この制限を超える枠の設定はできかねますのでご了承ください。


    詳細については、「キャッシング：商品概要」をご確認ください。'
