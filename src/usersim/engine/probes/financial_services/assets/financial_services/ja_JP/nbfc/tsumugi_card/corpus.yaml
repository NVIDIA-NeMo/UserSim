  institution_id: tsumugi_card
- id: 4348a8d3-616c-5efa-9dfd-35191f98e791
  title: つむぎカード：切替えや上位プランを検討するとき
  body: 'お客さまのライフステージや利用金額の変化に伴い、現在のつむぎカードから上位プランへの切替えを検討される場合の判断基準をご案内します。


    【つむぎカード（スタンダード）の基準】

    * 年会費：1,375円

    * ポイント還元率：0.5%

    * ショッピング利用可能枠：最大1,000,000円


    【上位プランを検討すべきケース】

    * **月々の利用金額が大幅に増加した場合**：より高いポイント還元率を設定した上位プランに切り替えることで、実質的なコストを抑え、得られるポイントを増やすことが可能です。

    * **より高い利用限度額が必要な場合**：高額な買い物を頻繁に行う場合、上位プランでの限度額増枠審査を検討してください。


    【選択のポイント】

    年会費の負担増と、得られるポイントの増加分を比較し、年間支出額に見合っているかが判断基準となります。少額利用が中心の方は、現在の1,375円というリーズナブルな年会費のつむぎカードを継続されることをおすすめします。


    切替えの手続きについては「つむぎカード：解約・変更・プランの切替え」をご確認ください。'
