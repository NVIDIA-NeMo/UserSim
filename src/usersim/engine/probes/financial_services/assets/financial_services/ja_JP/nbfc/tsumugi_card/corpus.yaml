  institution_id: tsumugi_card
- id: d012b6e1-f1ce-5fcf-8a40-3cf10b3e8845
  title: キャッシング：想定外の手数料・金額
  body: 'お客様から「ATM手数料が想定より高い」または「返済額が予想より多い」といったお問い合わせをいただいた際の対応フローです。


    ■症状：ATM利用手数料が予想と異なる

    【原因】お引き出し金額によって手数料の区分が変わるためです。

    【確認事項】

    ・お引き出し額が1万円以下か、1万円超かを確認してください。

    ・1万円以下の場合は110円、1万円を超える場合は220円の手数料が適用されます。

    【解決策】適用されている金額が正しければ、その旨を丁寧にご説明ください。


    ■症状：返済額が元金より大幅に多い

    【原因】キャッシング金利（実質年率18%）が日割りで計算され、元金に加算されているためです。

    【確認事項】

    ・最終返済日からの経過日数と、借入残高を確認してください。

    【解決策】金利の計算方法について、中学生の方でもわかる平易な表現でご説明し、早めの返済が手数料軽減につながることを案内してください。


    ■エスカレーション基準

    ・総量規制（年収の3分の1）に関する不服申し立てがあった場合

    ・金利計算に明確な誤りがある疑いがある場合

    上記の場合は、速やかに専門の審査部門またはコンプライアンス担当へエスカレーションしてください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 6ded9627-e2db-58f1-bf90-2642a89d4aa7
  title: キャッシング：必要書類
  body: 'キャッシングのご利用開始および利用可能枠の設定に必要な書類は以下の通りです。


    | 確認項目 | 必要書類 | 判定/条件 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポート等の公的身分証明書 | 必須（有効期限内であること） |

    | 支払能力の確認 | 健康保険証（勤務先確認のため） | 必須 |

    | 利用可能枠の増枠 | 源泉徴収票、直近の給与明細書など年収を証明できる書類 | 500,000円までの枠設定や増枠を希望される場合に必要 |


    ※すべての書類は最新のものである必要があります。また、審査の結果、ご希望の利用可能枠をすべてご提供できない場合がございます。'
