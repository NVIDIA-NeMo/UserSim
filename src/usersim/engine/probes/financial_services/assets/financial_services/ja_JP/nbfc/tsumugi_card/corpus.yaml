- id: f3192b03-7533-5c84-9a13-d45ab4d7c0db
  title: つむぎカードローン：登録内容の変更
  body: "ご住所、お電話番号、メールアドレスなどのご登録内容を変更する手順をご案内します。正確な情報をご登録いただくことで、大切なお知らせを確実にお届けできます。\n\
    \n■お手続きに必要なもの\n*   ご本人様確認ができる情報（フルネーム、生年月日）\n\n■変更の手順\n\n1.  **本人確認の実施**\n   \
    \ まず、お客様の「フルネーム（氏名）」と「生年月日」を伺い、ご本人様であることを確認させていただきます。\n\n2.  **変更内容の伝達**\n   \
    \ 変更したい項目（例：住所、電話番号）と、新しい内容を具体的にお伝えください。\n\n3.  **内容の照合と更新**\n    当社スタッフが入力内容を確認し、登録情報を更新いたします。この際、カード番号や暗証番号、パスワードなどは一切お伺いしませんのでご注意ください。\n\
    \n4.  **完了通知の受領**\n    登録内容の変更が完了した旨を、チャットまたはメールにて通知いたします。通知が届いたことを確認して完了です。\n\
    \n■ご注意点\n*   お引越しなどで住所が変わった場合は、速やかに変更手続きをお願いいたします。返済に関する重要なお知らせが届かなくなる恐れがあります。\n\
    *   登録内容の変更に際し、身分証番号などの機密情報を詳しく聞き出すことはございません。"
