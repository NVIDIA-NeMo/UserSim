- id: 8abacdbf-73b6-599d-a738-44bd263f731b
  title: リボ払い：重要事項のご説明
  body: 'リボ払いのご利用にあたり、以下の重要事項を必ずご確認ください。


    【手数料と支払総額について】

    リボ払いは、実質年率15%の手数料がかかります。毎月の支払額を最低支払額（5,000円）に近い金額に設定し、かつ利用を継続した場合、元金の減少速度が遅くなり、結果として支払総額が大幅に増加する可能性があります。


    【法令遵守と権利について】

    - 本サービスは経済産業省（割賦販売法）の規制に従い、支払可能見込額の調査に基づいた利用限度額を設定しています。

    - 販売店とのトラブル等により商品の不備がある場合、規約に基づき、カード会社への支払いを拒める「支払停止の抗弁」が行使できる場合があります。


    【健全な利用のために】

    - 過剰な借入を防止するため、ご自身の返済能力に見合った範囲でご利用ください。

    - 支払いが困難になった場合は、お早めにご相談ください。返済条件の見直しについて適切に案内いたします。


    基本概要は「リボ払い：商品概要」にてご確認いただけます。'
  domain: payments
  product_category: ribo_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 0d26c9ba-00aa-5724-8481-59440b5da6ab
  title: リボ払い：金利・料率一覧
  body: 'リボ払いに適用される金利・料率は以下の通りです。


    - **適用料率（実質年率）：15%**


    【適用ルール】

    - 上記の15%という単一の料率が、すべてのお客様の利用残高に適用されます。残高に応じた段階的な料率設定はございません。

    - 手数料は、前日までのリボ残高に対して日割りで計算され、毎月の請求額に加算されます。


    【手数料を軽減する方法】

    毎月の最低支払額である5,000円を超える金額を返済（繰上返済）していただくことで、元金が早く減り、適用される手数料の総額を抑えることができます。


    手数料の構成については、「リボ払い：手数料一覧」もあわせてご確認ください。'
