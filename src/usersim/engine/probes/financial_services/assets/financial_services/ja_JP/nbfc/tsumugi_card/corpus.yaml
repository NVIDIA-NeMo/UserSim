- id: 7e57086a-169a-574f-bd3b-6b5a0230b95d
  title: 分割払い：ご利用開始までの手順
  body: '【オペレーター向け：分割払い案内フロー】


    お客様が分割払いの利用を希望された際は、以下の手順に従って案内および手続きを行ってください。


    1. 本人確認の実施

    まず、お客様に「フルネーム（氏名）」と「生年月日」を確認し、本人確認を完了させてください。


    2. 利用可能枠と支払可能見込額の確認

    割賦販売法に基づき、お客様の現在の利用可能枠および支払可能見込額を調査します。希望される分割金額が枠内であることを確認してください。


    3. 条件の説明

    以下の重要事項を明確に伝えてください。

    ・分割払いには手数料がかかること。

    ・最大支払回数は24回までであること。

    ・手数料率は実質年率12%から15%の範囲で適用されること。


    4. 支払い回数の決定

    お客様と相談し、適切な回数を設定します。例えば3回払いをご希望の場合、手数料は利用金額100円あたり2.01円となる旨を案内してください。


    5. 手続きの完了

    設定内容を復唱し、お客様の同意を得た後、システムへ登録します。完了後、変更内容が反映された旨を伝えてください。


    ※審査が必要な案件や、法的な相談を伴う場合は、速やかに専門の審査部門またはコンプライアンス担当へエスカレーションしてください。'
