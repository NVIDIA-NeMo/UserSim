- id: 5ca51abe-8642-5965-9971-991b36509689
  title: freeze_card を使う場面
  body: 'お客様からカードの紛失、盗難の報告があった場合、または不正利用が疑われ、至急カードの利用を停止させる必要がある場合に freeze_card を使用します。


    ■手続き手順

    1. 本人確認を実施します。お客様から「フルネーム（氏名）」と「生年月日」を確認し、verify_identity を呼び出します。

    2. 対象カードを特定します。お客様が提示したカード番号の下4桁などを基に、get_accounts を呼び出して正確な card_id を特定します。

    3. 特定した card_id を使用して freeze_card を呼び出し、即座にカードの利用を停止させます。

    4. 利用停止完了後、必要に応じて order_replacement_card を案内し、新しいカード番号での再発行手続きを行います。


    ※紛失・盗難時はスピードが重要です。本人確認後、速やかに停止処理を行ってください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
