- id: b228f07d-79d2-5185-ba3e-402abe7700eb
  title: つむぎカードローン：ログインできない・アクセスできない
  body: "つむぎカードローンの管理画面やサービスにログインできない、またはアクセスできない場合の対処法をご案内します。\n\n■考えられる症状と原因\n*\
    \   **IDまたはパスワードが正しくない**：入力ミスのほか、大文字・小文字の区別が間違っている可能性があります。\n*   **アカウントがロックされている**：短時間に複数回、誤ったパスワードを入力された場合にセキュリティ保護のためロックされます。\n\
    *   **通信環境の問題**：ネットワーク接続が不安定なため、ページが正常に読み込まれていない可能性があります。\n\n■確認と解決の手順\n\n1. \
    \ **入力情報の再確認**\n    半角英数字で正しく入力されているか、不要なスペースが入っていないかを確認し、再度ログインをお試しください。\n\n\
    2.  **通信状態の確認**\n    Wi-Fiやモバイルデータ通信が正常に動作しているか確認してください。一度ログアウトし、再起動してからアクセスをお試しください。\n\
    \n3.  **パスワードの再設定**\n    パスワードを忘れた場合は、再設定の手続きを行ってください。その際、「フルネーム（氏名）」と「生年月日」による本人確認をさせていただきます。\n\
    \n■解決しない場合の対応（エスカレーション）\n上記を確認してもログインできない場合は、専門のテクニカルサポート部門へ案件をエスカレーションいたします。状況を確認し、アカウントの復旧や原因の特定を行い、解決までの方針を定期的にお客様へご報告いたします。"
