  title: つむぎカード：必要書類
  body: 'つむぎカードのお申込みにあたり、以下の書類のご提示をお願いしております。


    | 確認事項 | 必要書類 | 判定・結果 |

    | :--- | :--- | :--- |

    | ご本人確認 | 運転免許証、マイナンバーカード、パスポート等の公的証明書 | 確認ができ次第、審査へ移行します |

    | お支払能力の確認 | 給与明細書、源泉徴収票、確定申告書などの収入証明書 | 割賦販売法に基づき、利用可能枠（最大1,000,000円）を算定します |

    | 住所確認 | 公共料金の領収書（必要に応じて） | ご登録住所との整合性を確認します |'
