- id: 26312ffc-16d7-58ff-89ac-ece5ea8cfdaa
  title: キャッシング：リスクについてのご説明
  body: 'キャッシングをご利用いただく前に、以下のリスクと法令について必ずご確認ください。


    ■金利負担のリスク

    キャッシングの金利（実質年率）は18%です。これは、お借入れ期間が長くなるほど、および借入金額が多くなるほど、支払う利息の総額が増加することを意味します。余裕があるときに繰上返済を行うことで、利息負担を軽減することが可能です。


    ■過剰借入の防止（総量規制）

    貸金業法に基づき、当社を含む貸金業者からの借入れ合計額は、原則としてお客さまの年収の3分の1までとなります。この制限は、お客さまが無理のない返済計画を維持し、健全な信用環境を保つための制度です。年収を超えた借入れは法律により制限されており、審査の結果、ご希望の金額をご提供できない場合がございます。


    ■支払いが困難になった場合

    返済が難しくなったと感じられた際は、放置せず、できるだけ早めにご相談ください。返済条件の見直しなど、誠実に対応させていただきます。


    詳細は「キャッシング：規定・約款」をご参照ください。'
