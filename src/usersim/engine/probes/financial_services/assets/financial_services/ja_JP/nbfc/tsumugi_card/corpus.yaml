- id: a48e126e-d56f-544a-8293-cd6d13865e8f
  title: つむぎカードローン：お申込みとご利用開始
  body: 'つむぎカードローンのお申込みからご利用開始までの手順をご案内します。本手続きは、お客様の返済能力を確認し、最適な利用枠を設定するために行われます。


    【お手続きの流れ】

    1. 本人確認

    まず、お客さまのフルネーム（氏名）と生年月日をお伺いし、ご本人様であることを確認いたします。

    2. お申込み情報の提供

    年収、勤務先、勤続年数、および現在の他社借入状況などの必要情報をお伝えください。これらは貸金業法に基づく総量規制の確認および審査に必要となります。

    3. 審査の実施

    専門の審査部門にて、ご提示いただいた情報に基づき返済能力の審査を行います。審査結果が出るまで数営業日いただく場合がございます。

    4. 利用限度額と金利の提示

    審査完了後、お客さまに適用される貸付金利（年4.5%〜18%）と、設定可能な利用限度額（最大5,000,000円）をご提示いたします。

    5. ご契約の承諾とご利用開始

    提示内容にご同意いただけましたら、ご契約成立となります。以降、設定された限度額の範囲内で、必要なタイミングで融資をご利用いただけます。


    【ご確認事項】

    ・審査の結果、ご希望の限度額に達しない場合や、お申込みをお断りする場合がございますのであらかじめご了承ください。

    ・手続き中にご不明な点がございましたら、いつでも担当者までお問い合わせください。'
