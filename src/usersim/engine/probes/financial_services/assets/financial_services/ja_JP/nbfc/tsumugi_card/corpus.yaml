- id: ff32247f-452b-52f1-9339-f3169cda7986
  title: 分割払い：当社の似た商品との比較
  body: '「分割払い」と「リボ払い」のどちらを利用すべきか迷われている方への比較ガイドです。


    | 比較項目 | 分割払い | リボ払い |

    | :--- | :--- | :--- |

    | 支払いの仕組み | 回数を指定して、期間を決めて支払う | 月々の支払額を一定に設定して支払う |

    | 最大期間 | 最大 24 回まで | 設定により変動（長期化しやすい） |

    | 手数料率 | 実質年率 12% 〜 15% | 商品ごとの規定利率を適用 |

    | メリット | 完済時期が明確で計画が立てやすい | 月々の負担額を低く抑えられる |

    | デメリット | 支払回数が固定される | 残高が多いと手数料が増え続けやすい |


    【おすすめの方】

    ・分割払い：大型家電や家具など、特定の高額商品について「いつまでに支払いたいか」が決まっている方。

    ・リボ払い：月々の支出を一定に保ち、家計管理を柔軟に行いたい方（詳細は「リボ払い：商品概要」をご参照ください）。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e07e6950-d6b1-531a-ba6f-d22948644103
  title: 分割払い：重要事項のご説明
  body: '本サービスをご案内する際は、以下の法令および規定に基づき、正確な説明を行ってください。


    【法令遵守について】

    ・分割払いは経済産業省が管轄する「割賦販売法」の対象となります。カード発行時および増枠時には、必ず支払可能見込額の調査を行い、過剰な利用枠を設定してはなりません。


    【重要告知事項】

    ・手数料の明確化：分割払いは手数料がかかるサービスであることを、顧客に明確に伝えてください。特に、1回払い等が無料であることとの対比を明確にします。

    ・支払停止の抗弁：販売店とのトラブル（商品の未着や欠陥など）がある場合、顧客は法律に基づき、カード会社への支払いを拒める「支払停止の抗弁」を exercising
    できる権利があることを説明してください。


    【利率の適用】

    ・適用される実質年率は 12% から 15% の範囲内であり、顧客の属性や回数によって決定されます。総返済額を少なく見せるような案内は厳禁です。


    【セキュリティ】

    ・手続き前の本人確認として、必ず「フルネーム」と「生年月日」の2点を確認してください。カード番号や暗証番号を伺うことは一切禁止されています。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
