- id: c3631504-ae0a-5d31-893f-d8a4bf524706
  title: 分割払い：プランの選び方
  body: 'つむぎカードでは、高額な決済を柔軟に支払う方法として「分割払い」と「リボ払い」をご用意しています。お客様のライフスタイルに合わせて最適なプランをお選びください。


    ■分割払い（bunkatsu_barai）

    ・特徴：回数を決めて計画的に支払う方法です。最大24回まで設定可能です。

    ・コスト：実質年率12%から15%の手数料がかかります。回数が決まっているため、支払総額をあらかじめ把握しやすいのがメリットです。

    ・向いている方：特定の高額商品を、期限を決めて完済したい方。


    ■リボ払い（ribo_barai）

    ・特徴：月々の支払額をほぼ一定に抑える方法です。

    ・コスト：残高に対して手数料がかかり続けるため、支払い期間が長くなると支払総額が増えやすい傾向があります。

    ・向いている方：月々の支出額を一定に保ち、家計管理を柔軟に行いたい方。


    どちらのプランも手数料が発生しますが、1回払い等の基本決済は手数料無料です。まずはご自身の返済能力に照らして、無理のない計画をご検討ください。詳細は「リボ払い：商品概要」もご参照ください。'
  domain: payments
