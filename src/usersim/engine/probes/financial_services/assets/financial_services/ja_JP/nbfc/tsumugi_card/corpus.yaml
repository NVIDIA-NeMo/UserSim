- id: d9f63ea5-923a-5226-8922-39a490f18b70
  title: キャッシング：規定・約款
  body: '本規定は、つむぎカードが提供するキャッシングサービスの利用条件を定めるものです。


    ■利用限度額と審査

    ・お客さまのキャッシング利用可能枠は、貸金業法に基づき、年収や生活維持費などを踏まえた審査の結果、最大500,000円まで設定されます。

    ・総量規制に基づき、貸金業者からの借入れ合計額は原則として年収の3分の1までとなります。


    ■金利および手数料

    ・キャッシングの金利（実質年率）は18%とします。金利の変更が必要な場合は、あらかじめ書面またはWebサイトにて通知いたします。

    ・ATM利用手数料として、1万円以下の場合は110円、1万円を超える場合は220円を、利用時に申し受けます。


    ■返済義務と遅延

    ・お客さまは、所定の支払日に元金および利息を支払う義務を負います。

    ・支払いが遅延した場合、利息制限法に基づいた遅延損害金が課されることがあります。


    ■契約の終了

    ・お客さまからの解約申請、または当社の規定による利用停止措置により、本契約は終了します。契約終了時までにご利用残高の全額を清算していただく必要があります。


    本規定の詳細は、「キャッシング：重要事項のご説明」とあわせてご確認ください。'
