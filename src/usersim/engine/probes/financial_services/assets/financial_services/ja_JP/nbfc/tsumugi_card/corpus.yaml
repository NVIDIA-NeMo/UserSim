- id: 23c9699f-c9c9-5bce-9f3c-44a563b29c86
  title: つむぎカードローン：お取引が拒否された・制限された
  body: 'つむぎカードローンで借入の手続きをした際や、お取引が拒否された場合の原因と対処法をご案内します。


    ■ 考えられる原因

    * 利用限度額への到達：設定された利用可能枠、または利用限度額の上限である 5,000,000円 に達している場合、追加の借入はできません。

    * 総量規制による制限：他社借入を含めた合計額が年収の3分の1を超えている場合、法令に基づき借入が制限されます。

    * 審査基準の変更：定期的な審査や信用情報の変動により、一時的に利用が制限されることがあります。


    ■ 確認と解決の手順

    1. まず、現在の利用残高が限度額に達していないかを確認してください。

    2. ご本人確認（フルネームと生年月日）の後、制限がかかっている具体的な理由について当社へお問い合わせください。


    ■ 当社での対応

    原因が審査や法令（総量規制など）に関連する場合、専門の審査部門にて詳細を確認いたします。調査の結果は、改めてお客様へご報告いたします。なお、融資の承認を確約することはできませんのでご了承ください。'
