- id: 7faa2a9a-2333-56a0-bcc7-0a641f1e6f55
  title: 分割払い：不正利用からお客さまを守るために
  body: 'つむぎカードでは、お客さまが安心してお買い物をお楽しみいただけるよう、強固なセキュリティ体制を整えております。特に、高額な決済になりやすい「分割払い」をご利用の際は、以下の点にご注意ください。


    ■ インターネット決済の安全性について

    オンラインでのご利用には、カード番号に加えて本人認証を行う「EMV 3-Dセキュア」を導入しております。これにより、万が一カード情報が流出した場合でも、不正利用のリスクを大幅に低減することが可能です。


    ■ つむぎカードが絶対に聞き出さない情報

    安心感と信頼感を大切にするため、弊社員がお客さまに対し、以下の情報を求めることはございません。不審な連絡があった場合は、すぐにご注意ください。

    ・カードの暗証番号（PIN）

    ・カード裏面のセキュリティコード（CVV）

    ・パスワードやワンタイムパスワード

    ・身分証明書の番号


    ■ 不正利用が疑われる場合

    身に覚えのない利用通知が届いた場合や、不正利用の疑いがある場合は、迅速に利用停止および再発行の手続きを行います。規約に基づいた補償を適用し、公正な調査結果と進捗状況を定期的にお知らせいたします。


    また、割賦販売法に基づき、販売店との間でトラブルがあり、商品の不備などで支払いを拒める「支払停止の抗弁」という権利が認められている場合がございます。詳細については、弊社までご相談ください。'
