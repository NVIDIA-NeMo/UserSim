- id: e199902d-2863-5f71-9215-e12c97038b7f
  title: 分割払い：お手続きが完了しない・保留中のまま
  body: '分割払いの設定手続きが正常に完了せず、保留状態になっている場合や、エラーが表示される場合の対処法をご案内します。


    【考えられる原因と確認事項】

    1. ご本人確認の不一致：ご提示いただいた氏名または生年月日が、ご登録情報と一致していない可能性があります。改めて正確な情報をご提示ください。

    2. 利用可能枠の不足：分割払いへの変更であっても、利用可能枠の再計算が行われる場合があります。現在の利用可能枠に余裕があるかご確認ください。

    3. 対象外の取引：一部の加盟店や決済内容によっては、分割払いへの変更ができない場合がございます。


    【解決策】

    ・まずは、ご登録内容（氏名・生年月日）に誤りがないか再度ご確認をお願いいたします。

    ・利用可能枠の確認を行い、不足している場合は一部繰上返済をご検討ください。


    【エスカレーションについて】

    上記を確認しても解決せず、システム上のエラーが続く場合は、弊社専門の審査部門またはコンプライアンス担当へ詳細を報告し、調査を行います。調査結果については、後日改めてご連絡いたします。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
