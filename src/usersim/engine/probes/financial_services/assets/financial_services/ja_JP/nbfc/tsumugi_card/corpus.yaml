  institution_id: tsumugi_card
- id: e268cb14-4f76-5dda-9676-7100efe26447
  title: キャッシング：商品概要
  body: '「キャッシング」は、ATMなどを通じて、急な資金ニーズに即座に対応できる少額融資サービスです。つむぎカードをお持ちの方であれば、いつでも安心してお使いいただけます。


    【サービス内容】

    お手持ちのカードで、必要な時に必要な分だけ現金を借入いただけます。最短で即時の資金調達が可能です。


    【ご利用条件と限度額】

    ・キャッシング利用可能枠の上限：500,000円

    ・ご利用限度額は、貸金業法に基づき、お客様の年収や返済能力を審査したうえで個別に設定いたします。原則として、貸金業者からの借入れ合計額は年収の3分の1までとなる「総量規制」が適用されます。


    【金利・手数料】

    ・キャッシングの金利（実質年率）：18%

    ・ATM利用手数料（1万円以下）：110円

    ・ATM利用手数料（1万円超）：220円


    【ご注意事項】

    ・借入状況は、指定信用情報機関に登録されます。

    ・返済が困難になった場合は、お早めにご相談ください。返済条件の見直しについてご案内いたします。


    金利の詳細については、「キャッシング：金利・料率一覧」をご確認ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b955dd5a-99c6-5545-ba6a-39b49eb708ac
  title: キャッシング：キャッシングの金利（実質年率）について
  body: '【質問】キャッシングを利用した場合、金利はどのくらいかかりますか？


    【回答】当社のキャッシングの金利（実質年率）は18%となっております。この金利は、実際に借入れている残高に対して日割りで計算され、毎月の支払額に加算されます。


    【質問】利用金額によって金利は変わりますか？


    【回答】いいえ。キャッシングの金利は一律で実質年率18%となっております。ご利用金額に関わらず、同一の利率が適用されます。


    詳細な利率の適用条件については、「キャッシング：金利・料率一覧」をご参照ください。'
