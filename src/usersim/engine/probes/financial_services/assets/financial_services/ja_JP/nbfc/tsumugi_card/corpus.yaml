- id: a36fa9f5-7841-547a-b4b4-8840ac04f693
  title: file_transaction_dispute ツールリファレンス
  body: '身に覚えのない利用や二重請求などの調査を受け付け、不正利用補償の手続きを開始するためのツールです。


    ■シグネチャ

    file_transaction_dispute(transaction_id)


    ■引数

    ・transaction_id: 調査を依頼したい特定の取引の識別子。get_account_transactions ツールで取得してください。


    ■機能と効果

    指定された取引について不服申し立て（ディスピュート）を登録します。これにより、専門部門による公正な調査が開始され、規約に基づいた補償適用の審査が行われます。


    ※本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
