- id: 5d586df3-fcaf-567d-ac10-776973912057
  title: リボ払い：お手続きが完了しない・保留中のまま
  body: 'リボ払いのお申込みや設定変更の手続きが完了せず、「保留中」のままとなっている場合の対処法をご案内します。


    【考えられる原因】

    - ご本人確認情報（フルネーム・生年月日）に不備があり、認証が完了していない。

    - 割賦販売法に基づく「支払可能見込額の調査」の結果、現在の利用可能枠での設定が制限されている。

    - システムの一時的な遅延。


    【確認と解決の手順】

    1. お伝えいただいた氏名と生年月日が、カード登録情報と完全に一致しているか再度ご確認ください。

    2. 直近で利用可能枠の増枠申請を行っている場合は、その審査が完了するまで設定が保留されることがあります。


    【解決しない場合】

    上記を確認しても解消されない場合は、当社にて専門の審査部門へエスカレーションし、詳細な状況を確認いたします。確認完了後、改めて手続きの結果をご報告いたします。


    お手続きの基本ステップについては、「リボ払い：お申込みとご利用開始」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bc61c8c3-03e3-5cce-b863-25f549ef226e
  title: リボ払い：お申込みいただける方
  body: 'リボ払いのご利用には、以下の条件を満たしている必要があります。


    - つむぎカードの有効なカードを保有していること：必須

    - 支払可能見込額の調査を完了していること：必須（割賦販売法に基づき、年収や生活維持費を踏まえて算定されます）

    - 当社が定める信用基準を満たしていること：必須

    - 18歳以上であること：必須


    上記条件を満たしているお客様は、いつでもリボ払いへの切り替えまたは新規設定が可能です。商品概要については「リボ払い：商品概要」をご確認ください。'
