- id: a5d6e368-e0fa-5c77-b73c-1cd042caa297
  title: 分割払い：分割払いの手数料率（実質年率、上限）について
  body: '【ご質問】

    分割払いを利用する場合、手数料率は最大でどのくらいになりますか？


    【回答】

    分割払いの手数料率（実質年率）の上限は15%となっております。


    手数料率は、お客さまの審査結果に基づき、12%から15%の範囲で設定されます。ご利用の回数や金額によって、最終的な支払総額が変わりますので、お支払い前に必ずご確認をお願いいたします。


    詳細については「分割払い：商品概要」または「分割払い：金利・料率の決まり方と適用」をご覧ください。'
