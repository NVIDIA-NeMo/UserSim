- id: 0d368e7c-a0c6-51e4-8162-ba298d0cc5bc
  title: 分割払い：規定・約款
  body: '本規定は、つむぎカードが提供する「分割払い」サービスの利用条件を定めるものです。サポート担当者は、顧客への案内時に以下の条項を遵守してください。


    ■ 支払回数と手数料

    ・分割払いの最大支払回数は24回までとします。

    ・分割払いには、実質年率12%から15%の手数料が適用されます。具体的な適用率は、顧客の信用状況および審査に基づき決定されます。


    ■ 支払義務と抗弁権

    ・顧客は、指定の期日までに元金および手数料を支払う義務を負います。

    ・割賦販売法に基づき、販売店との間で契約の解除や取消しが生じた場合、または商品に重大な瑕疵がある場合に限り、顧客はカード会社への支払いを拒絶できる「支払停止の抗弁」を申し出ることができます。


    ■ 利用限度額の算定

    ・分割払いの利用可能枠は、割賦販売法に基づいた「支払可能見込額の調査」を経て設定されます。年収や生活維持費などの情報を基に、過剰な債務を防止するための適切な限度額を維持します。


    ■ 契約の終了と変更

    ・分割払いの回数変更や繰上返済を希望する場合、所定の手続きが必要です。繰上返済を行った場合、それ以降に発生するはずであった手数料は軽減されます。


    本規定に記載のない事項は、つむぎカードの基本約款に従います。'
