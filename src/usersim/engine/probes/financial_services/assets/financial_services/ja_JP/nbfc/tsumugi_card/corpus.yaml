- id: bca05d46-6877-5e5a-91a1-713efe1cfe8e
  title: キャッシング：ご紹介・継続利用の特典
  body: '【つむぎカードからのお知らせ】


    日々の生活に安心とゆとりを。つむぎカードの「キャッシング」サービスを、ぜひこの機会にご活用ください。


    急な出費が必要な際も、ATMを通じて迅速に資金を調達いただけます。最大500,000円までの利用可能枠を設定しており、お客様のライフステージに合わせた柔軟な資金活用をサポートいたします。


    ■本サービスの特徴

    ・実質年率18%の透明性の高い金利体系

    ・ATM利用手数料は、1万円以下のご利用で110円、1万円超のご利用で220円と、コストを抑えた運用が可能です。


    詳細な商品仕様については、「キャッシング：商品概要」をご参照ください。誠実なサービスで、お客様の健やかな金融生活をお手伝いいたします。'
