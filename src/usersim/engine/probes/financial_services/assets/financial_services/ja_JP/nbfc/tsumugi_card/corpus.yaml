- id: 62af9e60-f04a-509c-accf-d2b299352bf5
  title: 分割払い：限度額・制限と注意事項
  body: '「分割払い」の利用に関する限度額および制限事項についてご案内します。サポート担当者は、お客様へ案内する際に以下の基準を遵守してください。


    【利用回数の制限】

    ・分割払いの最大支払回数は24回までとなっております。


    【利用限度額の算定】

    ・クレジットカードのショッピング利用は割賦販売法の対象となります。そのため、カード発行時および利用可能枠の増枠時には、「支払可能見込額の調査」を実施します。お客様の年収や生活維持費に基づき算定されたこの金額を超えて、利用可能枠を設定することはできません。


    【重要な注意事項】

    ・分割払いを利用する場合、1回払いとは異なり手数料が発生します。お客様には、支払総額が増えることを明確に伝える義務があります。

    ・販売店との間で商品やサービスに関するトラブルがあり、契約を解除した場合は、規約に基づき「支払停止の抗弁」が行える場合があります。

    ・インターネット決済においては、不正利用防止のため、本人認証サービス（EMV 3-Dセキュア）を導入しています。'
