- id: a0a36733-b171-5b43-a72b-63fcc2ebf93c
  title: キャッシング：実施中のキャンペーン
  body: '【キャンペーンのご案内】


    誠に恐れ入りますが、現在キャッシングサービスにおいて実施中の特別な金利優遇キャンペーンやキャッシュバック特典はございません。


    今後、魅力的なキャンペーンを実施する際は、本お知らせページや、お客様への個別のご案内を通じて迅速に告知させていただきます。あわせて、日々の家計管理に役立つサービスの活用をご検討ください。'
