- id: d9766aba-b3e1-5faf-8741-0e4a98ddcf09
  title: つむぎカード：状況・履歴の確認
  body: "つむぎカードのご利用状況や、過去のお取引履歴を確認する手順をご案内します。\n\n【ご準備いただくもの】\nお手元にカードをご用意いただき、ご本人様であることを確認できる情報（フルネームと生年月日）をお知らせください。\n\
    \n【確認の手順】\n1. **ご本人様確認**\n   担当者に「利用履歴を確認したい」旨をお伝えください。その後、フルネーム（氏名）と生年月日をお伝えいただき、本人確認を完了させます。\n\
    2. **確認範囲の指定**\n   確認したい期間（例：先月分、直近3ヶ月分など）や、特定の取引について具体的に指定してください。\n3. **内容の照会**\n\
    \   当社にて最新の利用明細および決済履歴を確認し、利用店舗名、利用日、利用金額、および現在の利用可能枠の残高について回答いたします。\n4. **完了の確認**\n\
    \   提示された内容に相違がないかをご確認ください。詳細な明細書が必要な場合は、郵送または電子交付の手続きについてあわせてご案内いたします。\n\n【ご注意点】\n\
    * 決済直後のご利用分は、加盟店からのデータ確定まで「利用未確定」として表示され、履歴に反映されるまで数日かかる場合がございます。\n* 詳しい手数料の計算根拠などを確認したい場合は、「つむぎカード：手数料一覧」をご参照ください。"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 47c44897-593e-5517-8bd4-5b5f9b5e4600
  title: つむぎカード：お取引が拒否された・制限された
  body: "お店での支払いやインターネット決済時に、カードが利用できず拒否された場合の対処法をご案内します。\n\n【考えられる原因】\n* **利用可能枠の超過**：ショッピング利用可能枠の上限（最大1,000,000円）に達している。\n\
    * **セキュリティ制限**：不正利用の疑いがある不審な取引として、システムにより一時的に制限がかかった。\n* **カードの有効期限切れ**：カードの有効期限が切れている。\n\
    * **支払いの遅延**：お支払いの遅延により、カードの利用機能が停止している。\n\n【確認と解決の手順】\n1. **本人確認**\n   まず、フルネーム（氏名）と生年月日をお伝えいただき、ご本人様確認を行います。\n\
    2. **制限理由の特定**\n   当社にて、拒否された取引のログを確認し、制限がかかっている理由を特定します。\n3. **状況に応じた対応**\n \
    \  * **利用枠超過の場合**：現在の利用額を確認し、繰り上げ返済などの方法をご案内します。\n   * **セキュリティ制限の場合**：ご本人様による正当な利用であることを確認でき次第、制限を解除いたします。\n\
    \   * **有効期限切れの場合**：再発行の手続きをご案内します。\n\n【エスカレーション】\n原因が特定できない場合や、審査上の理由で利用制限がかかっている場合は、専門の審査部門へ調査を依頼します。調査完了後、改めてご連絡いたします。\n\
    \n詳細は「つむぎカード：限度額・制限と注意事項」も併せてご確認ください。"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
