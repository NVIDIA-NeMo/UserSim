- id: 88c9014f-af74-5c4b-977c-4c80389ace7f
  title: つむぎカードローン：商品概要
  body: 'つむぎカードローンは、人生のさまざまなステージで発生する大きなお金のご要望に対し、余裕を持った返済計画でご利用いただける低利の融資商品です。急な出費や、計画的な資金調達を必要とされるお客さまに、安心と信頼の金融サービスを提供いたします。


    【本商品のおもな特徴】

    ■柔軟な利用限度額

    お客さまの信用状況や返済能力に基づき、最大5,000,000円までの利用限度額を設定いたします。

    ■納得の金利体系

    貸付金利は年4.5%から年18%の範囲で、審査結果に応じて適切に設定されます。

    ■無理のない返済計画

    毎月の最低返済額を4,000円からに設定しており、家計に負担をかけすぎない柔軟な返済が可能です。


    【ご利用上の注意点】

    ・本商品は貸金業法に基づき、原則として年収の3分の1までという「総量規制」が適用されます。

    ・金利は審査結果によって変動するため、必ずご契約時の確定金利をご確認ください。

    ・過剰な借入は生活設計に影響を及ぼす可能性があるため、ご自身の返済能力に見合った範囲でのご利用を強く推奨いたします。


    詳細な金利については「つむぎカードローン：金利・料率一覧」を、お手続きの流れについては「つむぎカードローン：お申込みとご利用開始」をご参照ください。'
