- id: 4d476e7e-5fe9-50ba-a11f-0743824357d8
  title: つむぎカード：重要事項のご説明
  body: 'つむぎカードのご利用にあたり、法令に基づいた重要な事項をご説明いたします。


    【法令遵守と利用枠の設定】

    本カードのショッピング機能は経済産業省の管轄である「割賦販売法」に基づいています。カード発行時および利用可能枠の増枠時には、お客さまの年収や生活維持費等を踏まえた「支払可能見込額の調査」を実施し、それを超える利用可能枠を設定いたしません。本商品のショッピング利用可能枠の上限は1,000,000円です。


    【セキュリティと本人認証】

    インターネット決済における不正利用防止のため、本人認証サービス「EMV 3-Dセキュア」を導入しております。また、弊社がお客さまにカード番号、CVV、暗証番号、パスワード、身分証番号を直接聞き出すことはございません。


    【支払停止の抗弁】

    分割払いまたはリボ払いをご利用の場合、販売店とのトラブル（商品の不備や未届など）が発生した際、一定の条件下でカード会社への支払いを拒める「支払停止の抗弁」という権利が認められています。


    【信用情報の登録】

    適正な信用環境を維持するため、ご利用状況は指定信用情報機関に適切に登録されます。これにより、過剰借入の防止と健全な金融取引を促進しております。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1d2e1b3a-e61e-5cec-b263-e498be4056e4
  title: つむぎカード：金利・料率一覧
  body: 'つむぎカードに適用されるポイント還元率および決済手数料の料率は以下の通りです。


    ■ポイント還元率

    ・基本還元率：0.5%

    （すべてのショッピング利用金額に対し、一律で適用されます）


    ■ショッピング決済手数料（年率）

    ・1回払い：0%（無料）

    ・2回払い：0%（無料）

    ・ボーナス一括払い：0%（無料）

    ・分割払い：実質年率に基づき手数料が発生します（※回数により変動）

    ・リボ払い：実質年率に基づき手数料が発生します（※残高に応じて計算）


    【注意点】

    分割払いおよびリボ払いは、支払総額が増えやすい仕組みとなっております。手数料を軽減するためには、繰上返済をご検討ください。具体的な手数料額については、ご利用時の明細または「つむぎカード：手数料一覧」をご確認ください。'
