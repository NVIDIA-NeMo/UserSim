- id: a03d52e8-ab43-56c4-8232-1885b4872037
  title: つむぎカードローン：実施中のキャンペーン
  body: '【2026年 新春・ライフプラン応援キャンペーン】


    つむぎカードをご利用中のお客さまへ、新年の新たなスタートを応援するキャンペーンを実施いたします。


    ■キャンペーン期間

    2026年1月1日 〜 2026年3月31日


    ■キャンペーン内容

    期間中につむぎカードローンのお申込みをいただき、審査通過されたお客さまを対象に、個別の信用審査に基づき、下限金利に近い年4.5%からの優遇金利を適用いたします（※審査結果により異なります）。


    ■対象となる方

    ・つむぎカードをすでにご所有の方

    ・安定した収入があり、当行の審査基準を満たされる方


    ■ご注意点

    ・本キャンペーンによる金利適用は、審査の結果、適用されない場合がございます。

    ・詳細な適用条件については、お申込み時に担当者がご案内いたします。'
