- id: e4972a71-39ce-5dff-a4d3-a1a330f0f29c
  title: 分割払い：切替えや上位プランを検討するとき
  body: '「分割払い」から他の支払い方法への切り替えを検討される際の判断基準をご案内します。


    【分割払いとリボ払いの比較】

    ・分割払い：支払回数をあらかじめ決めるため、いつ完済するかが明確です。計画的な支出管理に向いています。

    ・リボ払い：月々の支払額を一定に設定できるため、家計の変動を抑えられます。ただし、残高がある限り手数料がかかり続けるため、注意が必要です。


    【どちらを選ぶべきか】

    ・「今回の買い物だけを数回に分けて、確実に終わらせたい」場合は、分割払いが適しています。

    ・「月々の支払額を常に一定にし、柔軟に管理したい」場合は、「リボ払い：商品概要」をご参照いただき、リボ払いへの切り替えをご検討ください。


    ※どちらの方法も、1回払いとは異なり手数料が発生いたします。誠実なご案内として、お客様の返済能力に照らして適切な方法をご提案いたします。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: f61c8b66-6ad9-5b4c-ae5b-403536a651ba
  title: 分割払い：ほかの選択肢との比較と向かない場合
  body: '「分割払い」を検討される際に、他の支払い方法と比較してどちらが適切か、またどのような場合に不向きかをご案内します。


    【支払い方法の比較】

    ・1回払い（基本決済）：手数料は無料です。最もコストを抑えられるため、余裕がある場合はこちらを推奨します。

    ・分割払い：回数を分けて計画的に支払えますが、実質年率12%から15%の手数料がかかります。高額な買い物を無理なく済ませたい場合に有効です。


    【分割払いが向かないケース】

    ・少額の買い物：支払額が小さい場合、分割にするメリットよりも、発生する手数料の負担が大きくなることがあります。

    ・短期での完済を希望する場合：1回払いまたは2回払い（手数料無料）で対応可能な金額であれば、そちらの方が経済的です。


    【判断の基準】

    お客様の属性と返済能力に基づき、月々の支払額が家計を圧迫しない範囲で、手数料負担を納得いただいた上でご利用いただくことが重要です。詳細な手数料については「分割払い：手数料と費用」をご確認ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 6b2c3eaa-3c19-5770-99ad-f3825c1e7f02
  title: 分割払い：手数料と費用
  body: '【ご質問】

    分割払いを利用すると、どのくらいの手数料がかかりますか？


    【回答】

    分割払いの手数料率は、実質年率で下限12%、上限15%となっております。お客様のご利用状況や審査に基づき、この範囲内で適用されます。


    【ご質問】

    3回払いを利用する場合の手数料を具体的に教えてください。


    【回答】

    3回払いの場合は、利用金額100円あたり2.01円の手数料がかかります。例えば、10,000円のお買い物を3回払いにした場合、手数料は201円となります。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 3300d1d9-f768-5a8b-94e8-c39e729889c9
  title: 分割払い：よくあるお手続きの流れ
  body: '一度1回払いで決済したものを、後から分割払いに変更する「あとから分割」の手続きの流れをご案内します。


    【ご準備いただくもの】

    ご本人確認のため、「フルネーム（氏名）」と「生年月日」のご提示をお願いいたします。


    【お手続きの手順】

    1. ご本人確認のため、フルネーム（氏名）と生年月日をお伝えください。

    2. 分割払いに変更したいお取引の内容（利用日や金額など）を私たちに提示してください。

    3. 希望する分割回数をお伝えください（最大24回まで選択可能です）。

    4. 私たちが、その回数を適用した場合の適用手数料率（実質年率12%～15%）と、月々の支払予定額を計算し、お客様へ提示します。

    5. 内容にご納得いただき、変更に同意していただいた時点で、手続きが完了します。


    【完了の目安】

    変更後の月々のお支払額と、合計の支払回数が確定し、案内された時点で完了となります。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: how_to_guide
  source_authority: official
