- id: b66e569c-4251-58bd-bdd3-e06f9fe15214
  title: 分割払い：商品概要
  body: 'つむぎカードの「分割払い」は、高額な買い物をした際に、お支払回数を分けて計画的に予算を管理できる便利なサービスです。一度に大きな金額を支払う負担を軽減し、ライフスタイルに合わせた柔軟な資金管理を実現します。


    【サービスの特徴】

    ・お支払回数を最大24回まで設定でき、月々の負担を調整可能です。

    ・回数に応じた手数料が設定されており、透明性の高い料金体系を採用しています。

    ・ご利用時の設定だけでなく、後から変更する「あとから分割」への切り替えも承っております。


    【手数料および条件】

    ・分割払いの手数料率（実質年率）：下限 12%、上限 15%

    ・3回払い時の手数料：利用金額100円あたり 2.01円

    ・最大支払回数：24回


    【ご注意事項】

    ・分割払いは手数料がかかるサービスです。1回払い、2回払い、ボーナス一括払いとは異なり、利息相当額が加算されますのでご注意ください。

    ・ご利用可能枠は、分割払いを選択した場合でも、商品代金全額分が確保されます。


    詳細な金利については、「分割払い：金利・料率一覧」をご確認ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 7870f2e4-91c4-51a5-8b91-83f04a3ce5bb
  title: 分割払い：分割払いの手数料率（実質年率、下限）について
  body: '【ご質問】

    分割払いを利用する場合、手数料率（実質年率）の最低ラインはどのくらいになりますか？


    【回答】

    つむぎカードの分割払いにおける手数料率（実質年率）の下限は 12% です。実際にご適用される利率は、お選びいただく支払回数やお客様の審査状況によって、下限の
    12% から上限の 15% の範囲内で決定されます。


    手数料を抑えてご利用いただきたい場合は、なるべく短い回数での設定をご検討ください。具体的な利率の詳細は、「分割払い：金利・料率一覧」にてご確認いただけます。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 26e2248a-17d7-57cf-959b-1196804d756b
  title: 分割払い：お申込みとご利用開始
  body: '「分割払い」のご利用開始までの手順をご案内いたします。本サービスは、つむぎカードをお持ちの方であれば、追加の審査なしで簡単にご利用いただけます。


    【ご利用までの流れ】

    1. ご本人確認：まず、ご登録の「フルネーム（氏名）」と「生年月日」をお伝えください。

    2. 対象取引の指定：分割払いに変更したいご利用内容（商品名や金額）をお伝えください。

    3. 回数の選択：お支払回数をご指定ください（最大 24 回まで設定可能です）。

    4. 手数料の確認：オペレーターより、適用される手数料率（実質年率 12% 〜 15%）に基づいた、お支払総額と月々の支払額をご案内します。

    5. 設定完了：内容に同意いただけましたら、手続きが完了し、次回の請求分より分割払いとして計上されます。


    【ご利用のポイント】

    ・お買い物時に店先で「分割払い」と指定いただく方法のほか、後から変更する「あとから分割」もご利用いただけます。

    ・計画的な返済のため、あらかじめ「分割払い：手数料一覧」にてコストをご確認いただくことをおすすめします。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: how_to_guide
  source_authority: official
