- id: 16620a96-0d67-5429-bef9-fc6fecca6c69
  title: 分割払い：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードの「分割払い」をかたる、巧妙な詐欺の手口についてご注意ください。お客様の安心と安全を守るため、以下の点に十分ご留意ください。


    【注意すべき詐欺の手口】

    ・「分割払いの手数料を特別に減額できる」という案内を装い、個人情報を聞き出そうとする電話やメール。

    ・「あとから分割」の手続きを代行すると称して、カードの暗証番号やセキュリティコード（CVV）を要求するメッセージ。

    ・特定のサイトへ誘導し、「手数料返還」などの名目で不自然なアプリのインストールを促す行為。


    【つむぎカードが絶対に行わないこと】

    私たちは、いかなる場合でも電話やメールで以下の情報を聞き出すことはございません。

    ・カードの暗証番号、パスワード

    ・カード番号の全桁およびセキュリティコード（CVV）

    ・身分証明書の番号


    【不審なと感じたときの対応】

    もし、不審な連絡を受けたり、心当たりのない請求があったりした場合は、すぐにカードの利用停止手続きを行ってください。迅速に停止し、再発行の手続きを進めることで被害を最小限に抑えられます。また、不審なメールのURLなどは絶対にクリックせず、速やかに削除してください。'
