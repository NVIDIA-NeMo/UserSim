- id: e34f6841-df1b-5c57-bfc3-a5c4ac254d9a
  title: つむぎカードローン：貸付金利（上限）について
  body: '【ご質問】つむぎカードローンの貸付金利の上限はどのくらいになりますか？


    【回答】つむぎカードローンの貸付金利（上限）は18%となっております。実際の適用金利は、お客さまの信用状況や審査結果に基づき、4.5%から18%の範囲内で決定されます。


    詳細な適用金利については、ご契約時の書面またはマイページよりご確認いただけます。金利に関するご不明点がある場合は、いつでも担当スタッフまでお問い合わせください。'
