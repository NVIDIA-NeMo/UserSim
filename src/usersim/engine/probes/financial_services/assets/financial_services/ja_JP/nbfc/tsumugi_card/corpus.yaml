  institution_id: tsumugi_card
- id: 28c121c0-b8a2-5e8c-a20d-8c0eea444669
  title: リボ払い：規定・約款の変更
  body: '本規定は、つむぎカードのリボ払いサービスにおける利用条件および変更手続きについて定めたものです。他社サービスと比較される際は、以下の条件を十分にご確認ください。


    ■手数料率（実質年率）

    リボ払いのご利用にかかる手数料率は15%とします。この率は、元本残高に対して日割りで計算されます。


    ■最低支払額の義務

    毎月の最低支払額は5,000円と定めております。お客さまは、設定された支払額または最低支払額以上の金額を、指定の期日までに支払う義務を負います。


    ■規定の変更手続き

    当社は、法令の改正や経済情勢の変化に基づき、手数料率や支払条件を変更する場合があります。変更を行う際は、適用日の1ヶ月前までにお知らせいたします。


    ■支払停止の抗弁権

    割賦販売法に基づき、販売店との間で商品の不備などのトラブルがある場合、一定の条件下で当社への支払いを拒絶できる「支払停止の抗弁」を申し立てることができます。


    ■契約の終了

    カードの解約時またはリボ払い設定の解除時に、未払いの残高がある場合は、一括で清算していただく必要があります。'
