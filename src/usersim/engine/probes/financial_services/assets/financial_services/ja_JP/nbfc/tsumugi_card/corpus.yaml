- id: 429eeef2-bea3-5e0d-ac6a-19e4fcea421d
  title: つむぎカード：規定・約款の変更
  body: 'つむぎカードの規定および約款は、法令の改正やサービス向上のため、適宜変更される場合がございます。変更にあたっては、お客さまに不利益が生じないよう誠実に対応いたします。


    ■変更の手続きと通知

    規定の変更を行う際は、事前にWebサイトへの掲載または書面等により、変更内容および適用開始日を通知いたします。通知後、一定期間までにご異議がない場合は、変更後の約款に同意いただいたものとみなされます。


    ■費用および限度額に関する規定

    ・年会費：本カードの年会費は1,375円です。改定される場合は、適用開始の1ヶ月前までにお知らせいたします。

    ・利用可能枠：割賦販売法に基づき、年収や生活維持費を考慮した「支払可能見込額の調査」を行い、適正なショッピング利用可能枠を設定します。上限は最大1,000,000円となります。


    ■契約の終了について

    お客さまからの解約請求、または弊社が規定する利用停止事由（支払遅延の継続など）に該当した場合、本契約は終了いたします。契約終了時の残債は、直ちに一括して支払う義務が生じます。


    詳細な規定全文については、「つむぎカード：規定・約款」をご参照ください。'
