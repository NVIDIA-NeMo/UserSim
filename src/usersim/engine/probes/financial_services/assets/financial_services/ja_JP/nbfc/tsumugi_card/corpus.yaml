- id: c8ad552f-9fce-58ae-a48b-6a248843e187
  title: order_replacement_card を使う場面
  body: 'お客様がカードを紛失された場合や、磁気不良・物理的な破損によりカードが利用できなくなった場合に、新しいカード番号でカードを再発行するための手続きです。


    特に紛失や盗難の疑いがある場合は、再発行の前に速やかにカードの利用停止を行う必要があります。あわせて「freeze_card」ツールを用いて利用停止処理を行ってください。


    【手続きの流れ】

    1. お客様の「フルネーム（氏名）」と「生年月日」を確認し、「verify_identity」ツールで本人確認を完了します。

    2. 「get_accounts」ツールを使い、お客様が提示したカード番号の下4桁から、該当する「card_id」を特定します。

    3. 特定した「card_id」を用いて、「order_replacement_card」ツールを実行し、再発行手続きを完了します。


    【注意点】

    * 再発行されたカードは、後日郵送で届きます。

    * 旧カードは、再発行手続き完了後、速やかに破棄いただくようご案内ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: tsumugi_card
- id: 2c21d5c9-b62c-5ce5-a398-3987e048ca18
  title: order_replacement_card ツールリファレンス
  body: '指定されたカードの再発行手続きを行い、新しいカード番号を発行します。


    エージェントは、本人確認が完了した後にこのツールを直接呼び出して手続きを行います。


    【引数】

    * card_id: 再発行対象となるカードの識別子（「get_accounts」ツールで取得します）。


    【効果】

    * 該当するカードの再発行が申請され、新しいカードがお客様の登録住所へ郵送されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: tsumugi_card
- id: 59751945-b60a-5659-98e2-eed6996f4fdb
  title: change_to_revolving を使う場面
  body: 'お客様が「1回払い」で利用したショッピングの支払い方法を、後から「リボ払い」に変更したい（あとからリボ）場合に利用します。


    リボ払いは月々の支払額を一定に抑えられるため家計の管理に便利ですが、手数料が発生し、支払総額が増えやすい仕組みであることを必ず丁寧にご説明ください。


    【手続きの流れ】

    1. お客様の「フルネーム（氏名）」と「生年月日」を確認し、「verify_identity」ツールで本人確認を完了します。

    2. 「get_accounts」ツールで「account_id」を特定し、「get_account_transactions」ツールを用いて変更対象となる取引の「transaction_id」を確認します。

    3. 「change_to_revolving」ツールを実行し、支払い方法をリボ払いに変更します。


    【重要な注意点】

    * 1回払いは手数料無料ですが、リボ払いへの変更後は、残高に対して所定の手数料がかかります。

    * 支払日の直前など、変更可能な期限があるため、早めの手続きを推奨してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: tsumugi_card
- id: bf9c2213-db4e-5323-85be-eebea2218ac7
  title: change_to_revolving ツールリファレンス
  body: '1回払いで利用したショッピング取引を、リボ払いへ変更します。


    エージェントは、本人確認が完了した後にこのツールを直接呼び出して手続きを行います。


    【引数】

    * account_id: 対象となるアカウントの識別子（「get_accounts」ツールで取得します）。

    * transaction_id: 変更したい取引の識別子（「get_account_transactions」ツールで取得します）。


    【効果】

    * 指定した取引の支払い区分が「リボ払い」に変更されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: tsumugi_card
- id: 8a512d4a-fac3-590d-ad02-197d4c21ef26
  title: change_to_installments を使う場面
  body: 'お客様が「1回払い」で利用した高額な買い物などの支払い方法を、後から「分割払い」に変更したい（あとから分割）場合に利用します。


    分割払いは回数を分けて計画的に支払うことができますが、分割回数に応じて手数料が発生することを明確にお伝えください。


    【手続きの流れ】

    1. お客様の「フルネーム（氏名）」と「生年月日」を確認し、「verify_identity」ツールで本人確認を完了します。

    2. 「get_accounts」ツールで「account_id」を特定し、「get_account_transactions」ツールを用いて変更対象となる取引の「transaction_id」を確認します。

    3. お客様にご希望の分割回数を確認し、「change_to_installments」ツールを実行します。


    【重要な注意点】

    * 1回払いは手数料無料ですが、分割払いへの変更後は、利用金額と回数に基づいた手数料がかかります。

    * 分割回数によって支払総額が変動することを、お客様に十分にご理解いただいた上で手続きを行ってください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_installments
  institution_id: tsumugi_card
- id: faa57d63-fc11-5d99-b60c-9c5fdbb24f54
  title: change_to_installments ツールリファレンス
  body: '1回払いで利用したショッピング取引を、指定した回数の分割払いへ変更します。


    エージェントは、本人確認が完了した後にこのツールを直接呼び出して手続きを行います。


    【引数】

    * account_id: 対象となるアカウントの識別子（「get_accounts」ツールで取得します）。

    * transaction_id: 変更したい取引の識別子（「get_account_transactions」ツールで取得します）。

    * installments_count: 分割回数（数値）。


    【効果】

    * 指定した取引の支払い区分が、指定された回数の「分割払い」に変更されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
