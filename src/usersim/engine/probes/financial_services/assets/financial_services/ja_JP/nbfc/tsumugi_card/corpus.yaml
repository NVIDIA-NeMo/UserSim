  body: 'つむぎカードローンのお申込みにあたり、以下の書類のご提出をお願いしております。


    | 確認事項 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポートなどの公的証明書 | 有効期限内のものに限ります |

    | 収入証明 | 源泉徴収票、確定申告書、直近の給与明細書など | 総量規制に基づき、年収の3分の1までの借入制限を確認するために必要です |

    | 居住確認 | 公共料金の領収書、住民票など | 必要に応じてご提示をお願いする場合があります |'
