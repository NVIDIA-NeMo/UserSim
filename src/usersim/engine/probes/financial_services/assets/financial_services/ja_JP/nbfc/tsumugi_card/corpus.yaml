- id: b51c11bb-6318-5910-a171-5bdfe0c58f63
  title: つむぎカード：ご利用条件による違い
  body: '【サポート担当者向け：ご利用条件判定基準】

    お客さまの属性に基づいた利用可能枠および発行可否の判定基準です。


    | 条件（属性） | 結果（設定内容） | 備考 |

    | :--- | :--- | :--- |

    | 支払可能見込額の調査において十分な返済能力あり | 最大1,000,000円の枠を設定 | 個別審査により決定 |

    | 安定した収入はあるが、他社借入がある | 調査に基づいた限定的な枠を設定 | 総量規制に留意 |

    | 支払可能見込額が基準に満たない | カード発行不可（または極めて低額な枠） | 法令遵守のため厳格に適用 |

    | ETCカードの追加申請あり | 年会費550円の適用 | 本カードの保有が前提 |'
