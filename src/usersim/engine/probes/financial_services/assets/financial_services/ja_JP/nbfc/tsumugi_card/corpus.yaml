- id: de70954a-9e0f-5063-a984-115e5610216b
  title: つむぎカード：登録内容の変更
  body: 'ご住所や電話番号などの登録内容を変更される際の手順をご案内いたします。


    ■お手続き前にご用意いただくもの

    ・つむぎカード本体

    ・（住所変更の場合）現住所を確認できる身分証明書


    ■変更の手順

    1. 本人確認を行います

    担当者が確認いたしますので、「フルネーム（氏名）」と「生年月日」をお伝えください。


    2. 変更内容を伝えます

    「住所を変更したい」「電話番号を変えたい」など、変更したい項目と新しい内容を正確にお伝えください。


    3. 内容の確認と照合

    担当者が変更内容を復唱し、確認いたします。住所変更などの場合は、必要に応じて身分証明書の提示をお願いすることがあります。


    4. 完了通知を受け取る

    変更手続きが完了すると、その場で、あるいは後ほど通知いたします。これで手続きは完了です。


    ※カード番号、暗証番号、パスワードなどは、この手続きで聞き出すことはございません。不審な要求があった場合は、すぐにお知らせください。'
