- id: dd4a2604-30d2-505e-8cdb-c0c63f56043c
  title: 分割払い：登録内容の変更
  body: '分割払いのご利用に関連して、お客様の登録内容（住所や連絡先など）を変更する手順をご案内します。


    ■ご準備いただくもの

    ・ご本人様確認ができる情報（氏名、生年月日）


    ■お手続きの手順

    1. 本人確認

    オペレーターに「フルネーム（氏名）」と「生年月日」をお伝えください。これにより、安全に手続きを開始いたします。


    2. 変更内容の提示

    変更したい項目（例：お引越しに伴う住所変更、電話番号の変更など）と、新しい情報をオペレーターにお伝えください。


    3. 内容の確認と照合

    オペレーターが入力内容を確認し、間違いがないかをお客様に復唱いたします。内容に間違いがないかご確認ください。


    4. 完了通知

    登録内容の変更が完了した旨をオペレーターが伝えます。これで手続きはすべて終了です。


    ■ご注意点

    ・カード番号や暗証番号、パスワード等をお伺いすることはありません。不自然な要求があった場合は、すぐに担当者にその旨をお伝えください。


    お手続き後の状況確認については、「分割払い：状況・履歴の確認」をご参照ください。'
