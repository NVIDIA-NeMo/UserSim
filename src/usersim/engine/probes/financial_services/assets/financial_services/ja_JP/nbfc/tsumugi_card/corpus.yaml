- id: 9bdbd93c-48ce-5546-97df-9731ee9d7990
  title: リボ払い：不正利用からお客さまを守るために
  body: 'リボ払いを含むクレジットカードのご利用において、お客さまの安心と安全を守るための重要なご案内です。最近では、巧妙なメールやSMSを用いて、カード情報を盗み出そうとする「フィッシング詐欺」などの被害が増えています。


    ■つむぎカードが絶対に聞き出さない情報

    弊社では、どのような場合であっても、以下の情報を電話やメール、チャットでお伺いすることはありません。

    ・カード番号、有効期限、CVV（セキュリティコード）

    ・暗証番号やオンラインサービスのパスワード

    ・身分証の番号（マイナンバーなど）


    ■本人確認について

    操作の前に本人確認を行う際は、必ず「フルネーム（氏名）」と「生年月日」の2点のみを確認させていただきます。これ以外の認証ステップ（ワンタイムパスワードの送付など）を求めることはございませんので、ご注意ください。


    ■不正利用が疑われる場合の対応

    身に覚えのない請求がある、またはカードを紛失した場合は、直ちにご連絡ください。迅速に利用停止および再発行手続きを行い、規約に基づいた補償を適用いたします。報告が遅れると補償の対象外となる場合がございますので、早急なご連絡をお願いいたします。


    詳細については、「つむぎカード：不正利用からお客さまを守るために」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1052e0bd-ee6f-56d8-8ea9-b5552e0afc1f
  title: リボ払い：規定・約款
  body: '本規定は、つむぎカードが提供する「リボ払い」サービスの利用条件を定めるものです。


    1. サービスの概要

    リボ払いは、利用金額を月々一定額（最低支払額5,000円）で返済する仕組みです。これにより、月々の家計管理を柔軟に行うことが可能です。


    2. 手数料の適用

    ・リボ払いにおける手数料率は、実質年率15%とします。

    ・手数料は、前月末の利用残高に対して日割りで計算され、毎月の支払額に加算されます。


    3. お客さまの義務

    ・お客さまは、設定された支払日に、所定の支払額（元金および手数料）を遅滞なく支払う義務を負います。

    ・支払いが困難となった場合は、速やかに弊社へ相談し、返済条件の見直しについて協議するものとします。


    4. 契約の変更および終了

    ・リボ払いの設定変更や解約は、所定の手続きを経て行うことができます。

    ・弊社は、法令に基づく審査や信用情報の著しい悪化が認められた場合、事前の通知なくリボ払いの利用を停止、または一括返済を求めることができるものとします。


    5. 準拠法

    本サービスは、経済産業省（割賦販売法）および金融庁（貸金業法）の規制を厳格に遵守して運営されます。'
  domain: payments
  product_category: ribo_barai
  document_type: terms_conditions
  source_authority: official
