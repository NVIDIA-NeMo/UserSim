- id: 82271b8c-eb98-5d0d-b15e-2cd6222e3cfd
  title: つむぎカード：想定外の手数料・金額
  body: '「身に覚えのない手数料が請求されている」「支払金額が想定より高い」と感じられた場合の確認事項です。サポート担当者は、以下の順序で原因を切り分けてください。


    【考えられる原因と確認ステップ】


    1. 支払方法の確認

    * 1回払い、2回払い、ボーナス一括払いは手数料無料です。もし請求額に手数料が含まれている場合、その利用分が「分割払い」または「リボ払い」に設定されていないか確認してください。


    2. 「あとからリボ」「あとから分割」の適用確認

    * ご自身で、あるいは設定により、決済後に支払方法をリボ払いや分割払いに変更されていないかを確認します。これらの方法は残高に対して手数料がかかるため、支払総額が増加します。


    3. 年会費の請求タイミングの確認

    * 年に一度、年会費1,375円が請求されます。また、ETCカードをご利用の場合は別途550円が発生します。これらの請求月ではないかを確認してください。


    【解決策と対応】

    * 支払方法の誤りの場合：今後の利用方法についてご案内し、必要に応じて繰上返済による手数料軽減を提案してください。

    * 不正利用の疑いがある場合：速やかにカードの利用停止手続きを行い、調査を開始します。


    【エスカレーション】

    請求内容に納得いただけない場合や、複雑な計算による紛争に発展した場合は、速やかにコンプライアンス担当または専門の審査部門へエスカレーションし、公正な調査を行ってください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
