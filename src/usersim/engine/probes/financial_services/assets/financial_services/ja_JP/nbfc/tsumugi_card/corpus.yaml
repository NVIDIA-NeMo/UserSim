- id: 3a50ad86-c750-52bd-9a59-fe00a354d9df
  title: リボ払い：解約・変更・プランの切替え
  body: 'リボ払いの設定変更や、他の支払い方法への切替え手続きについてご案内します。


    ■リボ払いの設定変更・解約の手順

    1. ご本人確認を行います。フルネーム（氏名）と生年月日をお伝えください。

    2. 変更したい内容（例：月々の支払額を5,000円から10,000円に変更したい、リボ設定を解除して1回払いに戻したい等）を弊社へお申し付けください。

    3. 弊社にて現在のリボ残高と、変更後の支払計画を確認します。

    4. 変更内容の確定通知をいたします。これにより手続きは完了です。


    ■「あとからリボ」への切替え手順

    1. ご本人確認のため、フルネーム（氏名）と生年月日をお伝えください。

    2. 1回払いで決済した特定のご利用分、またはすべてのご利用分をリボ払いに変更したい旨をお伝えください。

    3. 適用される手数料率（実質年率15%）と、今後の支払スケジュールについて説明を受けます。

    4. 同意いただけましたら、切替え処理を行い、完了報告をいたします。


    ■注意点

    ・リボ設定を解約しても、それまでに発生したリボ残高は引き続きリボ払いとして支払うか、一括で返済していただく必要があります。

    ・手数料を軽減したい場合は、繰上返済のご検討をお勧めいたします。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 2058d19b-ea33-5d06-a876-2fdb63f11549
  title: リボ払い：想定外の手数料・金額
  body: '「明細を確認したところ、想定していたよりも支払総額や手数料が高くなっている」と感じられる場合の確認事項です。


    ■考えられる原因

    1. 最低支払額での返済

    毎月の支払額を最低の5,000円に設定している場合、元金の減少速度が遅いため、実質年率15%の手数料が長期間にわたって発生し続けます。

    2. 残高への手数料適用

    リボ払いは、支払った金額からまず手数料が差し引かれ、残りが元金の返済に充てられます。そのため、残高が多いうちは手数料の割合が高く感じられます。


    ■確認と対処法

    ・現在のリボ残高を確認してください。

    ・月々の支払額を5,000円より引き上げることで、完済までの期間を短縮し、手数料を削減できます。

    ・余裕がある際に「繰上返済」を行い、元金を直接減らしてください。


    ■弊社での対応

    ご自身の返済能力に照らして支払いが困難であると感じられる場合は、早めにご相談ください。コンプライアンス担当および専門の審査部門と連携し、返済条件の見直しについて適切にご案内いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8649863d-c32b-5bd1-8172-86969dec628d
  title: リボ払い：必要書類
  body: 'リボ払いのご利用（および利用可能枠の設定）に必要な書類は以下の通りです。割賦販売法に基づき、支払可能見込額の調査を行うため、正確な情報の提供をお願いいたします。


    | 確認事項 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポート等の公的証明書 | フルカラーの写し、または提示 |

    | 収入証明 | 源泉徴収票、確定申告書、直近の給与明細など | 利用可能枠の増枠時や審査時に必要 |

    | 居住確認 | 公共料金の請求書、住民票など | 住所確認が不十分な場合に提示を求めることがあります |


    ※書類の内容に基づき、適正な利用可能枠を設定させていただきます。'
