- id: 92804016-1932-5a01-8635-c9eb09117a5c
  title: つむぎカード：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードをかたる不審な電話やメール、ショートメッセージ（SMS）による詐欺にご注意ください。信頼できる金融機関として、お客さまの大切な資産を守るため、以下の点に十分ご注意いただけますようお願い申し上げます。


    【当社の対応について】

    つむぎカードでは、いかなる場合においても、電話やメールでお客さまの以下の情報を聞き出すことはございません。

    * カード番号、有効期限、CVV（セキュリティコード）

    * 暗証番号（PIN）やログインパスワード

    * 身分証明書の番号（マイナンバーなど）

    * ワンタイムパスワードなどの認証コード


    【本人確認の手順】

    お問い合わせの際、本人確認が必要な場合は、必ず「フルネーム（氏名）」と「生年月日」の2点のみを確認させていただきます。これ以外の情報を要求した場合は、詐欺の可能性が非常に高いため、すぐにお電話を切るかメッセージを削除してください。


    【不審な点を感じたとき】

    「利用停止になる」「至急手続きが必要」などの言葉で不安を煽り、個人情報を聞き出そうとするアプローチには絶対に応じないでください。万が一、情報を伝えてしまった場合や、身に覚えのない請求がある場合は、速やかに当社へご連絡ください。迅速にカードの利用停止および再発行の手続きを行い、規約に基づいた補償を適用いたします。


    詳細は「つむぎカード：不正利用からお客さまを守るために」も併せてご確認ください。'
