- id: 21ca6048-4cd6-5936-905e-ea0e7bad7ed6
  title: change_revolving_payment を使う場面
  body: 'リボ払いをご利用中のお客様が、毎月の支払金額（設定金額）を変更したい場合に利用します。


    支払金額を下げると月々の負担は軽減されますが、その分完済までの期間が延び、支払う手数料の総額が増える可能性があることを誠実にご案内ください。


    【手続きの流れ】

    1. お客様の「フルネーム（氏名）」と「生年月日」を確認し、「verify_identity」ツールで本人確認を完了します。

    2. 「get_accounts」ツールで「account_id」を特定します。

    3. お客様にご希望の新しい月々支払額を確認し、「change_revolving_payment」ツールを実行します。


    【注意点】

    * 変更後の支払額が、リボ払いの最低支払額を下回ることはできません。

    * 設定変更のタイミングにより、次回の引落し分から適用されるか、その次の回から適用されるかが異なります。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_revolving_payment
  institution_id: tsumugi_card
- id: e1396618-a1aa-5381-8951-1f43a6a28666
  title: change_revolving_payment ツールリファレンス
  body: 'リボ払いの毎月の支払額を変更します。


    エージェントは、本人確認が完了した後にこのツールを直接呼び出して手続きを行います。


    【引数】

    * account_id: 対象となるアカウントの識別子（「get_accounts」ツールで取得します）。

    * new_monthly_payment_amount: 新しく設定する月々の支払額（数値）。


    【効果】

    * 指定したアカウントのリボ払い月々支払設定額が変更されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_revolving_payment
  institution_id: tsumugi_card
- id: 5695c50b-f084-5d1a-bdfd-095867c43c48
  title: prepay_revolving_balance を使う場面
  body: 'リボ払いをご利用中のお客様が、リボ残高の一部または全部を、次回の支払日を待たずに繰上返済したい場合に利用します。


    繰上返済を行うことで、将来的に支払う予定であった手数料を軽減できるため、お客様にとってコスト負担を最適化する有効な手段となります。


    【手続きの流れ】

    1. お客様の「フルネーム（氏名）」と「生年月日」を確認し、「verify_identity」ツールで本人確認を完了します。

    2. 「get_accounts」ツールで「account_id」を特定し、「get_loan_details」ツールなどで現在のリボ残高を確認します。

    3. お客様が返済したい金額を確認し、「prepay_revolving_balance」ツールを実行して繰上返済の手続きを受け付けます。


    【注意点】

    * 繰上返済の受付後、実際のお振込やATMでの入金手続きが必要になる場合があります。その手順について丁寧にご案内ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - prepay_revolving_balance
  institution_id: tsumugi_card
- id: 21641526-a7b8-54aa-8dbc-c7cba9813296
  title: prepay_revolving_balance ツールリファレンス
  body: 'リボ払いの残高の一部または全部を繰上返済するための手続きを受け付けます。


    エージェントは、本人確認が完了した後にこのツールを直接呼び出して手続きを行います。


    【引数】

    * account_id: 対象となるアカウントの識別子（「get_accounts」ツールで取得します）。

    * amount: 繰上返済する金額（数値）。


    【効果】

    * 指定した金額分の繰上返済手続きが受理され、リボ残高が減少します。これにより、今後の手数料負担が軽減されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - prepay_revolving_balance
  institution_id: tsumugi_card
- id: c31a282c-cac2-5448-b55a-cdc78fb3f821
  title: request_limit_change を使う場面
  body: 'お客さまから、つむぎカードのショッピング枠またはキャッシング枠の増枠、あるいは減枠のご要望をいただいた際に本手続きを行います。特に増枠のご希望がある場合は、割賦販売法に基づき、年収や生活維持費などの支払可能見込額を調査したうえで、適正な利用可能枠を設定いたします。


    【重要事項】

    - 増枠のお申し込みには審査があり、必ずしもご希望の金額で承認されるとは限りません。

    - キャッシング枠の増枠については、貸金業法の総量規制に基づき、原則として年収の3分の1までとなる制限がございます。


    【手続き手順】

    1. お客さまにフルネーム（氏名）と生年月日を確認し、`verify_identity`を呼び出して本人確認を完了します。

    2. `get_accounts`を呼び出し、お客さまが保有するカードの`account_id`を特定します。

    3. お客さまが希望される枠の種類（ショッピングまたはキャッシング）と、変更後の希望金額を確認します。

    4. `request_limit_change`を呼び出し、増減枠の申し込み手続きを完了します。


    詳細は「つむぎカード：限度額・制限と注意事項」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_limit_change
  institution_id: tsumugi_card
- id: f14f35ed-455f-59cb-80e5-b244a7cdc4a1
  title: request_limit_change ツールリファレンス
  body: 'このツールは、特定のアカウントのショッピング枠またはキャッシング枠の限度額変更を申請するために使用します。エージェントはこのツールを直接呼び出すことで、お客さまの増減枠リクエストを審査部門へ送信します。


    本人確認は`verify_identity`によって完了していることが前提であり、ツール内での追加認証は不要です。


    【引数】

    - `account_id`: `get_accounts`などで取得した、対象カードの識別子です。

    - `limit_type`: 変更したい枠の種類を指定します（「ショッピング」または「キャッシング」）。

    - `new_limit`: 設定を希望される新しい限度額（円）を数値で指定します。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_limit_change
  institution_id: tsumugi_card
- id: b910f72c-fa50-5e9f-94d1-962eed58ab03
  title: get_loan_details を使う場面
  body: 'お客さまから、キャッシングまたはつむぎカードローンの現在の借入状況について問い合わせがあった際に本手続きを行います。具体的には、現在の借入残高、適用されている金利、次回の返済日および返済額を確認し、正確にお伝えします。


    【確認事項】

    - 金利については、利息制限法に基づいた上限金利が適用されています（元本10万円未満は年20%、10万円以上100万円未満は年18%、100万円以上は年15%）。

    - 残高の確認により、返済計画の見直しが必要な場合は、早めの相談を促してください。


    【手続き手順】

    1. お客さまにフルネーム（氏名）と生年月日を確認し、`verify_identity`を呼び出して本人確認を完了します。

    2. `get_accounts`を呼び出し、対象となる`account_id`を特定します。

    3. `get_loan_details`を呼び出し、最新の借入状況（残高・金利・次回返済日・返済額）を取得します。

    4. 取得した情報を丁寧にお客さまへご案内します。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: tsumugi_card
- id: 5c9b9fe5-e1ab-5c49-8231-0a6a384cf364
  title: get_loan_details ツールリファレンス
  body: 'このツールは、指定されたアカウントの融資に関する詳細情報を取得するために使用します。エージェントはこのツールを直接呼び出し、お客さまに現在の借入状況を提示します。


    本人確認は`verify_identity`によって完了していることが前提です。


    【引数】

    - `account_id`: `get_accounts`などで取得した、対象の融資アカウントまたはカードの識別子です。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: tsumugi_card
- id: 3ca58642-2193-57e5-b22f-a1846968667f
  title: apply_loan を使う場面
  body: 'お客さまから、より大きな資金需要への対応として「つむぎカードローン」の申し込み希望があった際に本手続きを行います。本商品は低利の融資商品ですが、貸金業法の規制を厳格に遵守して取り扱います。


    【重要事項】

    - 貸金業法に基づく「総量規制」により、貸金業者からの借入れ合計額は原則として年収の3分の1までとなります。この制限を超える融資は行えません。

    - 申し込みは審査に基づき行われ、エージェントは融資の承認を約束してはいけません。

    - 総返済額を不当に小さく見せるような案内は禁止されています。


    【手続き手順】

    1. お客さまにフルネーム（氏名）と生年月日を確認し、`verify_identity`を呼び出して本人確認を完了します。

    2. 申し込みに必要な情報（連絡先、希望借入額、年収など）を伺います。

    3. `apply_loan`を呼び出し、申し込み手続きを完了します。審査結果は後日、別途通知される旨を伝えます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: tsumugi_card
- id: e40cddfa-53b6-55fa-bb71-5679ce22665f
  title: apply_loan ツールリファレンス
  body: 'このツールは、つむぎカードローンの新規申し込みを受け付けるために使用します。エージェントはこのツールを直接呼び出すことで、審査部門へ申し込み情報を送信します。


    本人確認は`verify_identity`によって完了していることが前提です。


    【引数】

    - `full_name`: お客さまから伺ったフルネーム（氏名）です。

    - `date_of_birth`: お客さまから伺った生年月日です。

    - `contact_info`: 電話番号やメールアドレスなどの連絡先情報です。

    - `requested_amount`: 希望される借入金額（円）を数値で指定します。

    - `annual_income`: 審査および総量規制の判定に必要な年収（円）を数値で指定します。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: tsumugi_card
- id: 9d62b3ce-b009-519b-b35f-fa4510d299a7
  title: pay_emi を使う場面
  body: 'お客さまから、引落しができなかった月の支払い（未払金）の解消や、キャッシング・つむぎカードローンの返済を振込やATMで行いたいとの要望があった際に本手続きを行います。


    【注意事項】

    - 支払いが困難な状況にあるお客さまには、早めの相談と返済条件の見直しを案内してください。

    - 本手続きは、指定の口座への振込やATMでの入金手続きを案内し、その記録をシステムに紐付けるためのものです。


    【手続き手順】

    1. お客さまにフルネーム（氏名）と生年月日を確認し、`verify_identity`を呼び出して本人確認を完了します。

    2. `get_accounts`を呼び出し、返済対象となる`account_id`を特定します。

    3. 支払希望金額と、利用される支払い方法（振込またはATM）を確認します。

    4. `pay_emi`を呼び出し、返済手続きの受付を完了します。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: tsumugi_card
- id: 723870eb-c2f5-52a5-9cd2-f07dc26e9fd8
  title: pay_emi ツールリファレンス
  body: 'このツールは、未払金や融資残高に対する振込またはATMによる任意返済の手続きを受け付けるために使用します。エージェントはこのツールを直接呼び出すことで、入金予定をシステムに登録します。


    本人確認は`verify_identity`によって完了していることが前提です。


    【引数】

    - `account_id`: `get_accounts`などで取得した、返済対象アカウントの識別子です。

    - `payment_amount`: 今回返済する金額（円）を数値で指定します。

    - `payment_method`: 支払い方法を指定します（「振込」または「ATM」）。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
