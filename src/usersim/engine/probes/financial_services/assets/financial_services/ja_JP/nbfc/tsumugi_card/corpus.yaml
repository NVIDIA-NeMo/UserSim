  mentions_tools: []
  institution_id: tsumugi_card
- id: 9ef8dc68-2dca-5db4-bbe7-b3c7705e8de7
  title: リボ払い：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードの「リボ払い」をかたる不審な電話やメールにご注意ください。以下のような内容は詐欺の可能性が非常に高く、十分な警戒が必要です。


    【よくある詐欺の手口】

    ・「リボ払いの手数料率（実質年率）15%を特別に大幅に引き下げる」という案内

    ・「リボ残高を解消するための特別な手続きがある」として、外部サイトへ誘導する

    ・「至急手続きをしないと利用停止になる」と不安を煽り、個人情報を聞き出そうとする


    【つむぎカードが絶対に行わないこと】

    当社では、本人確認のために「フルネーム（氏名）」と「生年月日」の2点を確認いたしますが、それ以外の認証ステップ（ワンタイムパスワードやアプリ承認など）を電話口で求めることはありません。また、以下の情報はどのような理由があっても絶対にお聞きしません。

    ・カード番号、CVV（セキュリティコード）、暗証番号、パスワード、身分証番号


    【不審な点があると感じたときは】

    少しでも「おかしい」と感じた場合は、すぐに操作を中断し、リボ払いの利用停止手続きを行ってください。速やかに当社へご連絡いただき、状況をご報告ください。迅速に再発行手続きを行い、規約に基づいた補償を適用いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 590473b6-3786-506d-8047-b6e938033ffd
  title: リボ払い：限度額・制限と注意事項
  body: '【エージェント向け：リボ払いの管理制限と注意点】


    リボ払いの利用可能枠は、割賦販売法に基づき、カード発行時および増枠時に実施する「支払可能見込額の調査」の結果に基づいて設定されます。顧客の年収や生活維持費を考慮し、支払能力を超えない適正な枠を維持してください。


    【主要な制限と数値】

    ・リボ払いの手数料率（実質年率）：15%

    ・リボ払いの毎月の最低支払額：5,000円


    【運用上の注意点】

    ・手数料の明示：リボ払いの案内を行う際は、必ず「手数料がかかること」を明確に伝えてください。1回払い等の基本決済は無料ですが、リボ払いは残高に対して手数料が発生し続けるため、支払総額が増えやすい仕組みであることを丁寧に説明してください。

    ・最低支払額の遵守：月々の支払額を顧客が設定する場合、リボ払いの毎月の最低支払額である5,000円を下回る設定はできません。

    ・支払停止の抗弁：販売店とのトラブルを理由に、リボ払いでの支払いを拒む「支払停止の抗弁」が適用される場合があることを留意してください。


    詳細な利用条件については、「リボ払い：お申込みとご利用条件」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: f05a5fff-2e4d-53a4-ae5d-f776570f089b
  title: リボ払い：お申込みとご利用条件
  body: '【ご質問：リボ払いは誰でも利用できますか？】

    つむぎカードをお持ちで、当社が実施する「支払可能見込額の調査」に基づき、適切な利用可能枠が設定されている方がご利用いただけます。


    【ご質問：利用にあたっての手数料はいくらですか？】

    リボ払いの手数料率（実質年率）は15%です。ご利用残高に応じて手数料が発生いたしますので、あらかじめご了承ください。


    【ご質問：毎月いくらから支払うことができますか？】

    リボ払いの毎月の最低支払額は5,000円からとなっております。この金額以上で、ご自身のライフステージに合わせた柔軟な支払額の設定が可能です。


    より詳細な費用については、「リボ払い：手数料一覧」をご確認ください。'
  domain: payments
  product_category: ribo_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: ee076b2e-b15c-5f51-9c32-00ae0f30d262
  title: リボ払い：状況・履歴の確認
  body: 'リボ払いの現在の利用状況や、過去の支払い履歴を確認する手順をご案内します。


    【ご確認前に】

    ご本人確認のため、フルネーム（氏名）と生年月日を伺います。


    【確認の手順】

    1. 担当者に「リボ払いの現在の利用状況と履歴を確認したい」とお伝えください。

    2. 担当者がご本人確認（氏名・生年月日）を行い、照会画面へアクセスします。

    3. 現在の「リボ払い利用残高」および、次回の「お支払い予定額」について案内を受けます。

    4. 必要に応じて、過去数ヶ月分の支払い履歴（元金分と手数料分の内訳）について説明を受けます。


    【完了の目安】

    現在の正確な残高と、今後のお支払いスケジュールが明確に提示された時点で確認完了となります。


    なお、リボ払いの仕組みにより、残高がある限り手数料率（実質年率）15%に基づいた手数料が発生し続けます。手数料を軽減したい場合は、繰上返済をご検討ください。お手続きの流れは「リボ払い：よくあるお手続きの流れ」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
