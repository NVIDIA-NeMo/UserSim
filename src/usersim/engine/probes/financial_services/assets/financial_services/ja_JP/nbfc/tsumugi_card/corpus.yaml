- id: bd18e170-c722-5e45-9004-21d0c96c7a81
  title: つむぎカードローン：状況・履歴の確認
  body: 'つむぎカードローンの現在の借入残高や、過去の返済履歴を確認する手順をご案内します。


    ■ ご確認の手順

    1. 当社担当者に、状況確認を希望される旨をお伝えください。

    2. ご本人確認のため、「フルネーム（氏名）」と「生年月日」をお伝えください。

    3. 確認したい内容（例：現在の利用残高、直近3回分の返済履歴など）を指定してください。

    4. 当社より、最新の貸付残高、適用されている金利、および返済完了日の履歴を回答いたします。


    ■ 確認できる内容

    * 現在の利用残高（円単位）

    * 次回の返済予定日と返済金額

    * 適用されている貸付金利（4.5%から18%の範囲内）


    もし、お手元の記録と内容が異なる場合は、「つむぎカードローン：明細や記録と合わない」をご参照いただき、速やかに当社へお知らせください。'
