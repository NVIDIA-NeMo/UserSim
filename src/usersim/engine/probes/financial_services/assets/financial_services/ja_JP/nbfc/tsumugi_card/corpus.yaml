- id: 2ec809e6-ec5b-5893-b5e1-ddb430a4034a
  title: つむぎカード：商品概要
  body: 'つむぎカードは、日々の安心した決済と、確かな信頼を大切にする方へ向けたメイン決済サービスです。お買い物から毎月の固定費の支払いまで、幅広くご利用いただける生活基盤としての金融サービスを提供いたします。


    【主な特長とサービス内容】

    ■ポイント還元：ご利用金額に応じて0.5%のポイントが還元されます。日々の小さなお買い物も、計画的な利用で効率よくポイントを貯めることができます。

    ■ショッピング利用可能枠：最大で1,000,000円までの利用可能枠を設定しております。お客さまの支払能力に基づいた適正な枠を算定いたします。

    ■柔軟な支払い方法：1回払いのほか、回数を分けて支払う「分割払い」や、月々の支払額を一定にする「リボ払い」を選択いただけます（※分割払い・リボ払いは手数料がかかります）。


    【費用について】

    ■年会費：1,375円

    ■ETCカード年会費：550円（ETCカードを別途お申し込みの場合）


    透明性の高い手数料体系により、コスト負担と利便性のバランスを最適化しています。詳細な費用については「つむぎカード：手数料一覧」をご確認ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bee552e7-dc38-5a05-891c-e29e5a971f2c
  title: つむぎカード：年会費について
  body: '【Q】つむぎカードの年会費はいくらですか？

    【A】つむぎカードの年会費は1,375円です。サービスの維持および向上、ならびに信用リスク管理のための実費として設定させていただいております。


    【Q】ETCカードを申し込む場合、別途費用はかかりますか？

    【A】はい。ETCカードをご希望の場合は、別途ETCカード年会費として550円を申し受けます。


    【Q】年会費の支払タイミングはいつですか？

    【A】ご入会時および、その後1年ごとにご請求させていただきます。詳しいお支払いの流れについては「つむぎカード：商品概要」をご参照ください。'
  domain: payments
