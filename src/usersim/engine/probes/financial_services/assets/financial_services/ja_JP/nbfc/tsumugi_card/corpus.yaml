- id: bbb4636d-eb78-5e58-80d0-095a6323eb18
  title: キャッシング：明細や記録と合わない
  body: 'お客さまから「明細上の残高が想定より高い」または「利用記録に心当たりがない」とのお問い合わせがあった場合の対応手順です。


    【確認すべきポイント】

    1. 利息の計算：キャッシングは実質年率18%の金利が発生します。元本だけでなく、日割りで計算された利息が加算されているかを確認してください。

    2. ATM手数料の計上：引き出し時に110円（1万円以下）または220円（1万円超）の手数料が別途発生しており、それが明細に反映されているかを確認してください。

    3. 処理日のズレ：ATMでの取引日時と、帳簿上の反映日にタイムラグがある場合がございます。


    【解決ステップ】

    ・まず、ご本人様確認としてフルネーム（氏名）と生年月日を伺います。

    ・その後、詳細な取引履歴を照会し、利息と手数料が正しく適用されているかを一件ずつ照らし合わせ、お客さまにご説明いたします。


    【エスカレーションについて】

    照合の結果、当社側の計算誤りや、身に覚えのない不正利用の疑いがある場合は、速やかにコンプライアンス担当または不正利用補償専門チームへエスカレーションし、公正な調査を行います。調査の結果は定期的かつ透明性を持って報告いたします。'
