- id: 8f86b76e-a86a-5703-b374-5e616e016625
  title: よくあるご質問
  body: 'つむぎカードのサービス全般に関するよくあるご質問です。


    Q：お問い合わせの方法はどのような手段がありますか？

    A：お電話、チャット、およびWebフォームによるマルチチャネルサポートを日本時間で提供しております。ご都合の良い方法でご連絡ください。


    Q：複雑な審査や法律的な相談をしたい場合はどうすればよいですか？

    A：オペレーターが承った後、専門の審査部門またはコンプライアンス担当へエスカレーションし、適切にご案内いたします。


    Q：身に覚えのない請求がある場合はどうすればよいですか？

    A：至急、カードの利用停止手続きを行い、調査を依頼してください。詳細は「file_transaction_dispute を使う場面」をご確認ください。'
  domain: payments
