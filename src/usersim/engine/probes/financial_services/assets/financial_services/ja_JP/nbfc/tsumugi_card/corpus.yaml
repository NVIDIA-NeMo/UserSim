- id: 08a5fb9a-9b4a-59b0-9190-c8f6535ff184
  title: update_repayment_mandate を使う場面
  body: 'お客さまが、ショッピングの利用代金やキャッシング、カードローンの返済に使用する口座（引落口座）を変更したい場合に、この手続きを行います。


    【手続きの流れ】

    1. お客さまの「フルネーム（氏名）」と「生年月日」を確認し、`verify_identity` を呼び出して本人確認を完了します。

    2. お客さまから提示された口座番号の下4桁に基づき、`get_accounts` を使用して、対象となる正しい `account_id` を特定します。

    3. 新しい引落口座の情報（金融機関名、支店名、口座番号、口座名義）を確認します。

    4. `update_repayment_mandate` を呼び出し、引落口座の変更処理を完結させます。


    【注意点】

    * 本人確認の際は、フルネームと生年月日の2点のみを確認してください。ワンタイムパスワードやアプリによる承認などの追加認証は行いません。

    * カード番号、CVV、暗証番号、パスワードなどの機密情報は一切聞き出さないでください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: tsumugi_card
- id: 44d3c002-50f6-5ec7-8adf-9d9d4ce2b141
  title: update_repayment_mandate ツールリファレンス
  body: 'このツールは、お客さまの毎月の支払いに使用する引落口座を更新するために使用します。エージェントはこのツールを直接呼び出すことで、お客さまの口座変更手続きを完了させます。


    【引数】

    * `account_id`: 変更対象となる口座の識別子。`get_accounts` 等で取得します。

    * `new_bank_account_details`: 新しく設定する銀行口座の詳細情報。お客さまから伺った金融機関名、支店名、口座番号、名義人を含めて指定します。


    【動作】

    指定された `account_id` に紐づく引落口座情報を、提供された新しい口座情報に更新します。本ツールを呼び出す前に、`verify_identity`
    による本人確認が完了している必要があります。'
