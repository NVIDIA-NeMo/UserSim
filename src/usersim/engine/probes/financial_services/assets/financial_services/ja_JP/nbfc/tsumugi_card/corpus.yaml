- id: 3b30b34b-9487-58ca-9ca5-f4cbf146f9e5
  title: set_alerts ツールリファレンス
  body: 'お客さまの通知設定（アラート）を管理するためのツールです。エージェントはこのツールを直接呼び出して、通知のオン・オフや条件を変更します。


    【引数】

    - account_id：通知を設定したい口座またはカードの識別子

    - アラートの種類（利用通知、支払日通知など）

    - 通知条件（しきい値となる金額など）


    【動作】

    指定されたアカウントに対し、選択した通知設定を適用します。`verify_identity` による本人確認完了後に実行されるため、ツール内で別途本人認証を行うステップは含まれません。'
