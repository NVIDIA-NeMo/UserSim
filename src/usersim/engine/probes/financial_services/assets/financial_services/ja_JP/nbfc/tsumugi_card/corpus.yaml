- id: 87b6e1a9-f703-585b-a12c-c2f4e7e820c1
  title: 分割払い：状況・履歴の確認
  body: '現在ご利用中の「分割払い」の残高や、今後の支払予定を確認するための手順をご案内します。


    【ご準備いただくもの】

    ご本人確認のため、「フルネーム（氏名）」と「生年月日」のご提示をお願いいたします。


    【確認の手順】

    1. ご本人確認のため、フルネーム（氏名）と生年月日をお伝えください。

    2. 確認したいお取引の内容、または「分割払いの利用状況をすべて確認したい」旨を私たちにお申し付けください。

    3. 私たちが現在の分割払い残高、および残り何回の支払があるかを確認し、お客様へ回答いたします。

    4. 毎月の支払額に手数料がいくら含まれているかなど、詳細な内訳が必要な場合は、あわせてお申し付けください。


    【完了の目安】

    現在の正確な残高と、次回の請求予定額が案内された時点で、確認手続きは完了となります。'
