- id: 2f1711a9-1a4f-57bd-988f-91b4afe3de15
  title: つむぎカードローン：個人情報の取扱い
  body: 'つむぎカードローンにおける個人情報の取扱および法令遵守についてご説明いたします。


    ■個人情報の収集と利用目的

    当社は、貸金業法および割賦販売法に基づき、お客様の氏名、住所、生年月日、年収、勤務先等の情報を収集いたします。これらの情報は、以下の目的のみに使用されます。

    *   ご契約時の審査および利用可能枠（上限5,000,000円）の算定

    *   ご本人確認（フルネームおよび生年月日の照合）

    *   ご契約後の適切な債権管理およびご連絡


    ■指定信用情報機関への登録

    健全な信用環境を維持するため、お客様の借入状況や返済履歴などの信用情報は、法令に基づき指定信用情報機関に登録されます。この情報は、他社での審査等に利用される場合がありますので、適正なご利用をお願いいたします。


    ■情報の管理と保護

    当社は、経済産業省および金融庁の規制を厳格に遵守し、個人情報を適切に管理します。お客様の同意なく第三者に個人情報を提供することはありません。ただし、法令に基づく要請がある場合はこの限りではありません。


    ■お客様の権利

    ご自身の登録情報の開示や訂正を希望される場合は、所定の手続きにより申請いただけます。本人確認のため、フルネームと生年月日の提示をお願いしております。


    当社は、透明性の高い運営を通じて、お客様に信頼される金融サービスを提供することに努めております。'
