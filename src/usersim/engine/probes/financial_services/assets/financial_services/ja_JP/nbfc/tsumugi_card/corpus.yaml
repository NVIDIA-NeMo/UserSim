- id: 24525dac-8268-50e3-8044-ff4ebc8c8513
  title: 分割払い：金利・料率の決まり方と適用
  body: '「分割払い」に適用される手数料率（金利）の決定方法と適用基準について説明します。サポート担当者は、顧客への説明時に正確な数値を用いてください。


    ■ 手数料率の範囲

    分割払いの手数料率は、実質年率で以下の範囲内で設定されます。

    ・下限：12%

    ・上限：15%


    ■ 料率の決定プロセス

    適用される具体的な料率は、カード発行時および利用可能枠の増枠時に行われる「支払可能見込額の調査」の結果、および個別の信用審査に基づき決定されます。原則として、全ての顧客に対してこの範囲内の料率が適用されます。


    ■ 具体的な適用例（目安）

    3回払いを選択した場合、利用金額100円あたり2.01円の手数料が適用されます。これにより、顧客は概算のコストを把握することが可能です。


    ■ 料率の変更について

    一度設定された分割払いの料率は、その取引期間中に変更されることはありません。ただし、新たな利用分については、その時点の審査結果に基づいた料率が適用される場合があります。


    分割払いは貸金業法の総量規制の対象外ですが、割賦販売法に基づき、返済能力に見合った適正な利用枠の中で提供されます。'
