- id: 3743e96f-4a64-5694-9f6e-e23b513a54fd
  title: つむぎカード：明細や記録と合わない
  body: "お客さまから「利用明細の金額が記憶しているものと違う」「身に覚えのない請求がある」とのお問い合わせをいただいた際の対応手順です。サポート担当者は以下の手順で確認を行ってください。\n\
    \n【考えられる原因】\n* **決済のタイミング**：店舗での利用日と、当社にデータが届き明細に反映される日にタイムラグがある。\n* **支払い方法の変更**：お客さまが「あとからリボ」や「あとから分割」への変更を行ったため、手数料が加算されている。\n\
    * **不正利用**：第三者によってカード情報が盗用され、身に覚えのない決済が行われた。\n* **自動更新サービスの請求**：サブスクリプションなどの自動更新による請求である。\n\
    \n【確認と解決の手順】\n1. **本人確認**\n   フルネーム（氏名）と生年月日を確認し、ご本人様であることを確定させます。\n2. **取引内容の照会**\n\
    \   該当する取引の利用日、金額、店舗名を具体的に提示し、お客さまの記憶や控えと照らし合わせます。\n3. **支払い方法の確認**\n   当該取引が1回払いか、あるいは手数料が発生するリボ払い・分割払いになっているかを確認し、説明します。\n\
    4. **不正利用の疑いがある場合の対応**\n   お客さまが明確に「利用していない」と判断された場合は、直ちにカードの利用停止手続きを行い、再発行の手続きへ移行します。その後、規約に基づいた補償適用のための調査を開始します。\n\
    \n【エスカレーション】\n金額の不一致がシステム上の不備である疑いがある場合、または複雑な紛争解決が必要な場合は、速やかにコンプライアンス担当または専門の審査部門へエスカレーションしてください。"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
