  institution_id: tsumugi_card
- id: 90491ee7-cee3-57f6-9ac6-875e2753b1b8
  title: リボ払い：商品概要
  body: '「リボ払い」は、月々の支払額をほぼ一定に設定することで、家計の管理を柔軟に行える便利な支払い方法です。高額な買い物をした月でも、月々の負担を抑えて計画的に返済いただけます。


    【主な特徴】

    - 月々の支払額を一定に抑え、支出の波をなくせます。

    - 余裕がある時に繰上返済を行うことで、手数料を軽減することが可能です。


    【適用される手数料と条件】

    - リボ払いの手数料率（実質年率）：15%

    - リボ払いの毎月の最低支払額：5,000円


    【ご注意事項】

    - リボ払いは、残高に対して継続的に手数料が発生するため、支払い期間が長くなると支払総額が増えやすい仕組みです。

    - 本サービスは経済産業省（割賦販売法）の規制に基づき提供されており、適切な利用枠の設定を行っております。


    詳細なリスクや制度については、「リボ払い：重要事項のご説明」をご確認ください。'
  domain: payments
  product_category: ribo_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: a44dd99c-27c7-53b1-a321-054e32a40d07
  title: リボ払い：リボ払いの手数料率（実質年率）について
  body: '【質問】リボ払いを利用する場合、どのくらいの手数料がかかりますか？

    【回答】リボ払いの手数料率は、実質年率15%となります。この手数料は、ご利用残高に対して日割りで計算されます。


    【質問】手数料を少なくする方法はありますか？

    【回答】はい。月々の最低支払額（5,000円）以上の金額を「繰上返済」としてお支払いいただくことで、元金を早く減らすことができ、結果として支払う手数料の総額を抑えることが可能です。


    【質問】1回払いからリボ払いに変更しても手数料は同じですか？

    【回答】はい、後からリボ払いへ変更された場合も、同様に実質年率15%の手数料が適用されます。


    手数料の詳細については、「リボ払い：金利・料率一覧」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: c8ca4b83-6d99-5ac0-8289-d09c4813ce97
  title: リボ払い：お申込みとご利用開始
  body: 'リボ払いのご利用開始までの手順をご案内いたします。本手続きは、つむぎカードのショッピング枠を利用して行われます。


    【ご準備いただくもの】

    - ご本人様のフルネーム（氏名）

    - 生年月日


    【お手続きの流れ】

    1. ご本人確認のため、フルネームと生年月日をお伝えください。

    2. リボ払いの適用範囲（すべての利用をリボ払いにするか、特定の利用分のみを後からリボに変更するか）をご指定ください。

    3. 毎月の支払額を決定します。なお、リボ払いの毎月の最低支払額は5,000円となります。これ以上の金額を任意に設定いただけます。

    4. 担当者が、適用される手数料（実質年率15%）について改めてご説明し、ご了承いただいた後、設定を完了いたします。


    【完了の確認】

    手続き完了後、次回の請求明細にて「リボ払い」として計上されていることをご確認ください。設定内容の変更については、「リボ払い：登録内容の変更」にてご案内しております。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1ed54dc7-46ea-5808-9ecb-9a8f5d5348f4
  title: リボ払い：手数料一覧
  body: 'リボ払いに関連する手数料は以下の通りです。誠実で透明性の高い手数料体系に基づき、実費として設定しております。


    - リボ払いの手数料率（実質年率）：15%

    - リボ払いの毎月の最低支払額：5,000円

    - 設定変更手数料：無料

    - 繰上返済手数料：無料


    ※1回払い、2回払い、ボーナス一括払いでの決済には手数料はかかりません。リボ払いをご利用の場合のみ、上記の実質年率が適用されます。


    料率の適用詳細については、「リボ払い：金利・料率一覧」をご確認ください。'
