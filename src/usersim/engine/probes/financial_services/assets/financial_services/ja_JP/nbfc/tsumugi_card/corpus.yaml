- id: 9ef3c026-d2a1-55fe-9197-82a89c23c680
  title: つむぎカード：不正利用からお客さまを守るために
  body: 'つむぎカードでは、お客さまに安心してお買い物をお楽しみいただけるよう、強固なセキュリティ体制を整えております。特にインターネットショッピングにおいては、カード番号だけでなく本人認証を追加することで不正利用を防止する「EMV
    3-Dセキュア」を導入し、安全性を高めております。


    【ご注意いただきたい点】

    つむぎカードの社員が、以下のような情報を電話やメール、チャットで聞き出すことは絶対にございません。十分にご注意ください。


    * カード番号、有効期限、CVV（セキュリティコード）

    * 暗証番号（PIN）やパスワード

    * 身分証明書の番号

    * ワンタイムパスワードなどの認証コード


    ご本人確認が必要な操作の際は、必ず「フルネーム（氏名）」と「生年月日」の2点のみを確認させていただきます。これ以外の情報を求められた場合は、詐欺の可能性がございますので、すぐにご連絡を中断してください。


    【万が一、不正利用が疑われる場合】

    カードの紛失や盗難、または身に覚えのない請求に気づいた際は、速やかにご連絡ください。迅速に利用停止および再発行手続きを行い、規約に基づいた補償を適用いたします。迅速な報告が、被害を最小限に抑える鍵となります。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bf94ad4e-ff20-5331-820e-02b4c9e427b2
  title: つむぎカード：規定・約款
  body: '本規定は、つむぎカードの利用に関する権利と義務を定めるものです。サポート担当者は、顧客への案内において以下の条件を厳格に適用してください。


    1. 費用および手数料

    * 年会費：本サービスの維持・向上および信用リスク管理のため、1,375円を申し受けます。

    * ETCカード年会費：ETCカードを併用される場合は、別途550円の年会費が発生します。

    * 基本決済：1回払い、2回払い、ボーナス一括払いでの利用は手数料無料です。


    2. 利用限度額と審査

    * ショッピング利用可能枠の上限は1,000,000円までとし、割賦販売法に基づいた「支払可能見込額の調査」の結果により、個別の利用限度額を設定します。


    3. 顧客の義務と権利

    * 顧客は、登録内容に変更があった場合に速やかに通知する義務を負います。

    * 分割払いまたはリボ払いを利用し、販売店とのトラブルが発生した場合は、規約に基づき支払停止の抗弁権を行使できる場合があります。


    4. 合意の終了

    * カードの解約手続きが完了した時点で、本契約は終了します。ただし、未払いの残高がある場合は、完済までのお支払義務が継続します。


    本規定は、経済産業省（割賦販売法）および金融庁（銀行法・貸金業法）の規制を遵守し、健全な信用環境を維持することを目的としています。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 4012af4d-9827-5288-9299-d4b5e11fc16c
  title: つむぎカード：おすすめの方と主な使い方
  body: 'つむぎカードは、日々の生活に寄り添う誠実な金融サービスを目指しています。シンプルで使いやすく、信頼感のあるメインカードをお探しの方に最適です。


    【このような方におすすめです】

    * 日々の買い物を効率的にまとめ、ポイントを計画的に貯めたい方

    * 透明性の高い手数料体系で、安心して長く利用したい方

    * ショッピングだけでなく、必要に応じて柔軟な支払い方法を選択したい方


    【主な活用方法とメリット】

    * 日常の決済：スーパーやコンビニなどの日々の支払いでご利用ください。0.5%のポイント還元率により、使うほどにメリットが積み上がります。

    * 計画的な買い物：ショッピング利用可能枠の上限は1,000,000円となっており、幅広くご活用いただけます。高額な買い物には、回数を分けて支払う「分割払い」も選択可能です。

    * ETCの利用：年会費550円でETCカードを発行でき、高速道路でのスムーズな移動をサポートします。


    【基本コスト】

    * 年会費：1,375円


    つむぎカードは、お客様のライフステージに合わせた利便性を提供し、生活基盤としての安心感を大切にしております。詳細は「つむぎカード：商品概要」も併せてご確認ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 3edec5bd-1fc2-5428-ba21-2f5f9f17b538
  title: つむぎカード：ポイント還元率について
  body: '【質問】つむぎカードを利用した際のポイント還元率はどのくらいですか？


    【回答】つむぎカードのポイント還元率は0.5%です。日々のショッピング決済にご利用いただくことで、ご利用金額に応じてポイントが貯まります。


    【質問】ポイント還元に条件はありますか？


    【回答】基本的にはすべてのショッピング利用が対象となります。ただし、一部のサービスや特定の支払い方法において還元対象外となる場合がございます。詳細は「つむぎカード：商品概要」をご確認ください。'
