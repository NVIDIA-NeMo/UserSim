- id: 024ba31a-95db-510c-96fd-044732a5a2b8
  title: リボ払い：ログインできない・アクセスできない
  body: 'リボ払いの設定変更や残高確認を行うためのページにアクセスできない場合の対処法です。


    ■考えられる症状と原因

    ・ログインボタンを押しても反応がない、またはエラーメッセージが表示される（パスワード誤入力やアカウントロック）。

    ・ページが表示されず、タイムアウトになる（通信環境の問題）。


    ■確認と対処の手順

    1. 通信環境の確認

    他のWebサイトやアプリが正常に動作するかご確認ください。不安定な場合は、Wi-Fiのオン・オフを試してください。


    2. 入力内容の再確認

    大文字・小文字の区別や、不要なスペースが入っていないかを確認し、再度ログインをお試しください。


    3. 本人確認とロック解除

    ログインできない状態が続く場合は、当社までご連絡ください。「フルネーム（氏名）」と「生年月日」で本人確認を行った後、パスワードの再設定やアカウントロックの解除を行います。


    ■解決しない場合の対応

    上記の手順でも解決しない場合は、専門のシステム担当部署へエスカレーションいたします。調査には数営業日かかる場合がございますが、進捗状況は定期的にご報告いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: aff73ff4-944a-5769-ac8c-7060e7273daa
  title: リボ払い：ご利用条件による違い
  body: '【サポート担当者向け：リボ払い利用可否判定】


    | 条件 | 判定結果 | 基準・しきい値 |

    | :--- | :--- | :--- |

    | 基本利用条件 | 利用可能 | つむぎカード（Standard）を保有していること |

    | 初回設定/増枠時 | 要審査 | 支払可能見込額の調査に基づき、利用可能枠を算定 |

    | 支払額の変更 | 承認 | 月々の支払額が5,000円以上であること |

    | 利用停止中 | 利用不可 | 不正利用疑い等でカードが凍結されている場合 |

    | 信用情報への影響 | 登録あり | 指定信用情報機関への登録が行われる |'
