- id: 15c1c458-e1d8-5fcb-8f8b-1448380b71a4
  title: つむぎカード：ショッピング利用可能枠の上限について
  body: 'Q：ショッピングで利用できる金額の上限（利用可能枠）はいくらまでですか？


    A：つむぎカードのショッピング利用可能枠の上限は、最大で1,000,000円です。ただし、すべての方にこの金額が設定されるわけではありません。


    割賦販売法に基づき、お客さまの年収や生活維持費などを踏まえた「支払可能見込額の調査」を行い、個別の返済能力に応じて適切な利用限度額を設定しております。審査の結果、上限額より低い枠が設定される場合がございますので、あらかじめご了承ください。'
