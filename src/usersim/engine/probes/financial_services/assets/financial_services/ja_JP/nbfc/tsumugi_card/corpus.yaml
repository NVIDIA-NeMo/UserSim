- id: 66b74e98-572f-585f-aaaa-19c272e6c8d3
  title: つむぎカードローン：不正利用からお客さまを守るために
  body: 'つむぎカードローンを安心してお使いいただくために、セキュリティに関する重要なご注意事項をご案内いたします。


    ■なりすましや詐欺へのご注意

    当社の担当者を名乗り、個人情報を聞き出そうとする電話やメールにご注意ください。つむぎカードでは、お客さまの安全を守るため、以下の情報を伺うことは絶対にございません。


    *   カード番号、CVV（セキュリティコード）

    *   暗証番号、パスワード

    *   身分証明書の番号

    *   ワンタイムパスワードやアプリ承認コード


    ■本人確認について

    お手続きの際、当社からお客さまへ本人確認をお願いすることがございます。その際は必ず「フルネーム（氏名）」と「生年月日」の2点のみを確認させていただきます。それ以外の認証ステップを求めることはございませんので、不審な点がある場合はすぐに操作を中断してください。


    ■不正利用が疑われる場合の対応

    「身に覚えのない利用がある」「認証情報を教えてしまった可能性がある」など、不正利用の疑いがある場合は、速やかに当社へご連絡ください。迅速に利用停止および再発行手続きを行い、規約に基づいた補償を適用いたします。


    早期にご報告いただくことで、被害を最小限に抑えることができます。不審な点があれば、迷わずお知らせください。'
