  mentions_tools: []
  institution_id: tsumugi_card
- id: b3e687ad-d556-53dc-876a-76525ce3719e
  title: つむぎカード：手数料一覧
  body: 'つむぎカードの基本手数料は以下の通りです。本表は、サポート担当者が顧客へ案内する際の情報源としてご利用ください。


    ■基本費用

    ・年会費：1,375円

    ・ETCカード年会費：550円


    ■ショッピング決済手数料

    ・1回払い：0円（無料）

    ・2回払い：0円（無料）

    ・ボーナス一括払い：0円（無料）

    ・分割払い：有料（※利用回数により異なります。詳細は「金利・料率一覧」をご参照ください）

    ・リボ払い：有料（※残高に応じて手数料が発生します。詳細は「金利・料率一覧」をご参照ください）


    ※手数料は、信用リスクの管理およびサービスの維持・向上に必要な実費として設定しております。'
