- id: 8d8fcd82-a370-5f15-a35f-4e4902064230
  title: キャッシング：お申込みいただける方
  body: 'キャッシングのご利用にあたっては、以下の条件に基づき審査を行います。


    ■お申込み条件と結果

    ・本人確認が可能であること → 「フルネーム（氏名）」および「生年月日」による確認ができれば、お申込みいただけます。

    ・安定した収入があること → 支払能力の審査を行い、適切であると判断された場合に利用可能枠を設定いたします。

    ・借入合計額が年収の3分の1以下であること → 貸金業法の「総量規制」に基づき、原則としてこの範囲内で利用可能枠を決定します。

    ・指定信用情報機関の登録状況 → 健全な信用環境を維持するため、信用情報の確認を行い、審査結果に反映いたします。'
