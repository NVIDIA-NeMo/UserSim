- id: 94d5a8aa-3ee5-5549-a726-d3f7d0f3490e
  title: つむぎカード：限度額・制限と注意事項
  body: 'つむぎカードのショッピング利用に関する限度額および制限事項についてご案内します。本資料はサポート担当者が顧客対応を行う際の基準として活用してください。


    【ショッピング利用可能枠】

    * ショッピング利用可能枠の上限：1,000,000円


    【利用限度額の設定根拠】

    割賦販売法に基づき、カード発行時および利用可能枠の増枠時には、「支払可能見込額の調査」を実施します。これは、お客さまの年収や生活維持費等を踏まえ、無理のない支払範囲内で利用枠を設定するための法的なプロセスです。この調査結果に基づき、適切に利用可能枠を決定しており、法的な上限を超える設定は行いません。


    【利用上の注意事項】

    * 1回払い、2回払い、ボーナス一括払いは手数料がかかりませんが、分割払いおよびリボ払いを選択した場合は、別途所定の手数料が発生します。

    * お客さまがリボ払いや分割払いへの変更を希望される際は、支払総額が増加する可能性があることを明確に説明してください。

    * 総量規制について：ショッピング利用は貸金業法の総量規制（年収の3分の1まで）の対象外ですが、キャッシングをご利用の場合はこの規制が適用されます。


    【重要事項】

    審査状況や信用情報の登録内容により、上記上限額（1,000,000円）よりも低い利用可能枠が設定される場合があります。'
