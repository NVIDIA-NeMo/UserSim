- id: 9e59bf67-7d95-5f78-aad0-a1ce7c980f1e
  title: 分割払い：安全にご利用いただくためのポイント
  body: 'お客様に安心してお買い物をお楽しみいただくため、「分割払い」のご利用にあたってのセキュリティ上の注意点をご案内いたします。


    ■つむぎカードからのお願いとご注意

    ・当社では、電話やメール、チャットなどで、カード番号、CVV（セキュリティコード）、暗証番号、パスワード、身分証番号などを聞き出すことは一切ございません。

    ・本人確認が必要な操作の際は、必ず「フルネーム（氏名）」と「生年月日」の2点を確認させていただきます。それ以外の認証ステップ（ワンタイムパスワードやアプリ承認など）を求めることはございませんのでご注意ください。


    ■不正利用を防ぐために

    ・インターネットショッピングで分割払いをご利用の際は、本人認証サービス（EMV 3-Dセキュア）を導入している加盟店をご利用ください。これにより、カード番号だけでなく追加の認証が行われ、不正利用のリスクを大幅に軽減できます。


    ■異変を感じたら

    ・身に覚えのない利用通知が届いた場合や、カードを紛失された場合は、直ちに当社へご連絡ください。迅速に利用停止および再発行手続きを行い、規約に基づいた補償を適用いたします。


    詳細は「つむぎカード：不正利用からお客さまを守るために」も併せてご確認ください。'
