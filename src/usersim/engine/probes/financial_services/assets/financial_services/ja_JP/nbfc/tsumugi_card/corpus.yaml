- id: f82536fb-73bf-5169-8c80-11e6646df18b
  title: つむぎカードローン：ご利用条件による違い
  body: 'つむぎカードローンのご利用条件と、それに基づく適用内容の目安をまとめました。


    | 条件 | 結果・適用内容 |

    | :--- | :--- |

    | **本人確認** | 「フルネーム」と「生年月日」が一致し、本人確認が完了していること（必須） |

    | **総量規制の遵守** | 貸金業者からの借入合計額が原則として年収の3分の1以下であること（承認の前提条件） |

    | **支払能力の審査** | 年収および生活維持費の調査に基づき、返済能力があると判断された場合 → 利用可能枠（最大5,000,000円）を付与 |

    | **信用情報の確認** | 指定信用情報機関への登録内容に著しい問題がないこと → ご契約および貸付の実行 |

    | **金利の適用** | 審査による信用格付けに基づき、貸付金利 4.5% 〜 18% の範囲で決定 |'
