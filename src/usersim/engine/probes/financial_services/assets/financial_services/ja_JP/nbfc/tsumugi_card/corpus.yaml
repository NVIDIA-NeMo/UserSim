- id: eea6f3e4-c0ae-57cd-a33c-220342d6979e
  title: 分割払い：ご利用条件による違い
  body: '【オペレーター向け：分割払い適用条件マトリクス】


    お客様の属性や審査結果に基づき、以下の通りサービス内容が異なります。


    | 確認項目 | 条件・しきい値 | 適用結果・制限 |

    | :--- | :--- | :--- |

    | 支払可能見込額 | 割賦販売法に基づく調査結果 | 利用可能枠内でのみ分割払い設定が可能 |

    | 信用スコア（審査） | 審査結果（高） | 分割払いの手数料率：実質年率12%（下限）を適用 |

    | 信用スコア（審査） | 審査結果（標準～低） | 分割払いの手数料率：最大実質年率15%（上限）まで適用 |

    | 支払回数希望 | 24回以内 | 設定可能 |

    | 支払回数希望 | 25回以上 | 設定不可（最大24回までと案内） |

    | 3回払い利用 | 利用金額100円あたり | 手数料2.01円を適用 |


    ※個別の利用限度額は、年収や生活維持費を踏まえた算定プロセスに基づき決定されます。'
