- id: e8d322f1-badd-5b1d-8460-56fe5cbfc840
  title: 分割払い：おすすめの方と主な使い方
  body: '「分割払い」は、高額な買い物をしても、月々の支払額を調整して計画的に支払うことができる便利なサービスです。


    ■ このような方におすすめです

    ・最新の家電や家具など、まとまった金額の買い物をしたいが、一度に支払うのは家計に負担がかかるという方

    ・月々の支出を一定の範囲に抑えつつ、欲しいものを手に入れたい方


    ■ サービスの特徴とご利用条件

    ・最大支払回数：24回まで（回数を分けて柔軟に計画を立てられます）

    ・手数料率（実質年率）：12% ～ 15%

    ・3回払いの場合の手数料：利用金額100円あたり2.01円


    ■ ご利用のメリット

    1回払いでは難しい高額商品でも、分割を利用することで月々の負担を軽減できます。また、余裕がある時に繰上返済を行うことで、支払総額の手数料を抑えることが可能です。


    ■ 注意点

    1回払い、2回払い、ボーナス一括払いは手数料がかかりませんが、分割払いは上記の手数料が発生します。ご自身の返済能力に合わせて、無理のない回数を選択してください。詳細な手数料体系については「分割払い：金利・料率の決まり方と適用」をご参照ください。'
