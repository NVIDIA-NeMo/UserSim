- id: 938a9804-db36-5288-8dd0-0c75e2447960
  title: つむぎカード：リスクについてのご説明
  body: 'つむぎカードのご利用にあたり、以下のリスクと法令遵守事項についてあらかじめご了承ください。


    【支払可能見込額の調査について】

    割賦販売法に基づき、カード発行時や利用可能枠の増枠時には、お客様の年収や生活維持費等を踏まえた「支払可能見込額の調査」を行います。ショッピング利用可能枠の上限は1,000,000円ですが、この調査に基づき、お客様の支払能力に見合った適切な限度額を設定いたします。


    【過剰借入の防止（総量規制）】

    キャッシングなどの貸付サービスを併用される場合、貸金業法に基づき、貸金業者からの借入れ合計額は原則として年収の3分の1までとなる「総量規制」が適用されます。これはお客様を過剰な債務から守るための制度です。


    【リボ払い・分割払いのリスク】

    * リボ払いは月々の支払額を一定に抑えられますが、残高に対して手数料がかかり続けるため、支払総額が増えやすい仕組みです。

    * 分割払いも回数に応じて手数料が発生します。


    【信用情報への登録】

    ご利用状況や支払状況は、指定信用情報機関に適切に登録されます。支払いの遅延などは、今後の金融サービスの利用に影響を及ぼす可能性があります。


    万が一、お支払いが困難になった場合は、お早めに弊社までご相談ください。返済条件の見直しなど、誠実に対応させていただきます。'
