- id: c6d66ac2-457d-5533-9d26-82f8f6447d95
  title: つむぎカードローン：規定・約款
  body: 'つむぎカードローンのご利用にあたり、以下の規定および約款が適用されます。本内容は、貸金業法および利息制限法に基づき策定されています。


    ■利用限度額と審査

    お客さまの利用限度額は、年収や生活維持費などの支払能力を審査したうえで決定いたします。最大で利用限度額の上限として5,000,000円まで設定可能ですが、個別の審査結果により異なります。


    ■金利および手数料

    貸付金利は、個別の審査に基づき、貸付金利（下限）4.5%から貸付金利（上限）18%の範囲内で適用されます。金利は年率で計算され、借入残高に対して日割りで計算されます。


    ■返済義務と最低支払額

    お客さまは、契約に基づき元金および利息を遅滞なく返済する義務を負います。毎月の返済額は、毎月の最低返済額として4,000円以上の設定となります。


    ■契約の変更および終了

    *   登録内容の変更や解約を希望される場合は、所定の手続きを経て、当社が承認した時点から適用されます。

    *   返済が困難な状況となった場合は、早急に当社へご相談ください。返済条件の見直しについて協議いたします。


    ■信用情報機関への登録

    本商品の利用状況および返済状況は、指定信用情報機関に登録されます。適切にご利用いただくことで、健全な信用環境の維持にご協力をお願いいたします。'
