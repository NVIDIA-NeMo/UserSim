  institution_id: tsumugi_card
- id: 6f7910c9-c1fc-535c-b879-e8037617f1e4
  title: 分割払い：お申込みいただける方
  body: '「分割払い」のご利用条件は以下の通りです。


    | 条件項目 | 内容 | 判定 |

    | :--- | :--- | :--- |

    | カード保有 | つむぎカード（スタンダード）を保有していること | 必須 |

    | 本人確認 | フルネームおよび生年月日の照合が完了していること | 必須 |

    | 支払能力 | 支払可能見込額の調査に基づき、適切な利用可能枠が設定されていること | 必須 |

    | 利用枠の状態 | 設定したい取引金額を含め、利用可能枠内に十分な余裕があること | 必須 |

    | 信用情報 | 指定信用情報機関への登録内容に基づき、健全な信用環境にあること | 必須 |'
