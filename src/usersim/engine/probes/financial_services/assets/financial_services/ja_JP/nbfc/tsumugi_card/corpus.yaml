- id: 762cf3fc-b057-59e8-bb25-d05d8aa8fc65
  title: つむぎカード：ETCカードの年会費について
  body: '【Q】ETCカードを利用したいのですが、年会費はいくらになりますか？


    【A】つむぎカードのETCカードの年会費は550円です。


    【Q】メインのつむぎカードの年会費とは別に支払う必要がありますか？


    【A】はい。つむぎカード（本会員カード）の年会費1,375円とは別に、ETCカード専用の年会費550円がかかりますのでご了承ください。


    【Q】ETCカードを申し込んだ後、いつから利用できますか？


    【A】お手続き完了後、カードがお手元に届き次第ご利用いただけます。お申込みの流れについては「つむぎカード：お申込みとご利用開始」をご確認ください。'
