- id: 0f710179-28f1-5e2d-8bb8-8e07ba8846ea
  title: つむぎカード：ご利用開始までの手順
  body: '【サポート担当者向け：ご利用開始フロー】

    お客さまがつむぎカードをお申し込みいただいてから、実際に利用を開始するまでの標準的な手順です。


    1. お申し込みの受付

    Webフォームまたは電話にて、必要事項の入力・聴取を行います。この際、本人確認書類の提出をご案内してください。


    2. 支払可能見込額の調査（審査）

    割賦販売法に基づき、経済産業省に登録された包括信用購入あっせん業者として、お客さまの年収や生活維持費、既存の借入状況を確認します。これにより、ショッピング利用可能枠（上限1,000,000円まで）を算定します。


    3. 審査結果の通知とカード発行

    審査に承認された場合、カードの発行手続きへ進みます。審査結果は速やかにお伝えし、カードはご登録住所へ郵送されます。


    4. カードの有効化と利用開始

    お手元に届いたカードを確認し、利用を開始していただきます。ポイント還元率0.5%が適用されるメイン決済サービスとしてご案内してください。


    5. オプションカードの手配（希望者のみ）

    ETCカードの追加を希望される場合は、別途年会費550円がかかる旨を説明し、手続きを案内してください。


    審査の結果、承認が得られない場合や、条件の変更が必要な場合は、速やかにコンプライアンス担当へエスカレーションしてください。'
