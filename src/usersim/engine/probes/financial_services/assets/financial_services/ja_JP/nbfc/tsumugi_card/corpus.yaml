- id: 173fdd14-81ec-5a16-aa51-796174e7c885
  title: キャッシング：よくあるお手続きの流れ
  body: 'キャッシングサービスのお申込みからご利用開始までの一般的な流れをご案内します。


    【お手続きの流れ】

    1. お申込みと審査：キャッシングの利用希望をお伝えください。貸金業法に基づき、年収の3分の1という総量規制および支払可能見込額の調査を行い、審査させていただきます。

    2. ご本人様確認：審査承認後、改めてフルネーム（氏名）と生年月日を確認させていただきます。これにより、正式に利用可能枠が確定します。

    3. 利用可能枠の通知：審査結果に基づき、最大500,000円までの範囲内で設定された利用可能枠をご案内いたします。

    4. ご利用開始：お手持ちのカードを用いてATM等でキャッシングをご利用いただけます。この際、引き出し金額に応じて110円または220円のATM利用手数料が発生します。

    5. ご返済：実質年率18%の利息をあわせて、ご指定の口座よりご返済いただきます。


    審査の結果、ご希望の限度額に届かない場合や、ご利用いただけない場合があることをご了承ください。詳細な条件は「キャッシング：限度額・制限と注意事項」をご参照ください。'
