- id: b9591b41-1ff2-5a37-b0de-299a7a05bac4
  title: キャッシング：状況・履歴の確認
  body: 'キャッシングのご利用状況（現在の借入残高や過去の取引履歴）を確認する手順をご案内します。


    【ご確認に必要なもの】

    ・ご本人様確認情報（フルネームと生年月日）


    【お手続きの流れ】

    1. 本人確認：オペレーターに「キャッシングの利用状況を確認したい」旨をお伝えください。ご本人様確認のため、フルネーム（氏名）と生年月日を伺います。

    2. 確認事項の指定：現在の利用残高を確認したいのか、あるいは過去の引き出し履歴を確認したいのかを詳しくお伝えください。

    3. 内容の照会：当社にて最新の取引データを照会し、現在の借入金額、次回のお支払い日、および直近のATM利用履歴をご案内いたします。

    4. 内容の確定：ご案内した内容に間違いがないかご確認いただき、お手続きは完了となります。


    なお、詳細な明細を文書で確認したい場合は、別途明細書の送付についてご相談ください。もし記載内容に不明点がある場合は、「キャッシング：明細や記録と合わない」をご確認ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 97b17e45-22fa-5e43-a32e-219f8042a910
  title: キャッシング：お取引が拒否された・制限された
  body: 'ATMなどでキャッシングの引き出しを試みた際にお取引が拒否された、または利用制限がかかった場合の対処法です。


    【考えられる原因】

    1. 利用可能枠の不足：現在の借入残高が、設定されている利用限度額（最大500,000円）に達している可能性があります。

    2. 総量規制による制限：他社借入を含む合計額が年収の3分の1を超え、法令に基づき枠が制限されている場合がございます。

    3. ご本人確認の不備：カードの有効期限切れや、セキュリティ上の理由で一時的に制限がかかっている可能性があります。


    【確認と解決の手順】

    ・まず、ご本人様確認（フルネームと生年月日）を行い、現在の正確な利用可能額を確認してください。

    ・利用枠の不足が原因の場合、まずは現在のご返済状況を確認し、繰上返済をご検討ください。


    【エスカレーションについて】

    ご本人様確認の結果、システム的な不具合が疑われる場合や、利用枠の増枠を希望される場合は、専門の審査部門へエスカレーションいたします。審査部門にて改めて返済能力の調査を行い、結果をご案内いたします。審査結果によっては、ご要望に沿えない場合があることをあらかじめご了承ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 11fb28e1-47fd-5a69-be43-56fa9fc89b11
  title: キャッシング：切替えや上位プランを検討するとき
  body: '短期的かつ少額の資金調達に適した「キャッシング」と、より大きな資金需要に適した「つむぎカードローン」の比較です。


    ・キャッシング：ATMですぐに現金化でき、最大500,000円まで利用可能です。金利は実質年率18%で、急ぎの少額資金ニーズに向いています。

    ・つむぎカードローン：より大きな金額の借入が可能で、返済計画を余裕を持って立てることができます。一般的にキャッシングよりも低利な設定となっており、まとまった資金が必要な方向けです。


    一時的な不足分を補いたい場合は「キャッシング」、長期的な視点で低利の融資を検討される場合は「つむぎカードローン」への切替えや併用をご検討ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 780b8d6d-bc2c-5312-9e94-2b2a882d0fe5
  title: キャッシング：ほかの選択肢との比較と向かない場合
  body: 'キャッシングサービスを検討される際、他の支払い方法や融資商品との違いを正しく理解し、適切にご選択ください。


    【他の選択肢との比較】

    ・ショッピングの「リボ払い」や「分割払い」：商品の購入代金を分割して支払う方法です。現金が必要なわけではなく、買い物の支払いを調整したい場合に適しています。

    ・「つむぎカードローン」：借入金額が大きく、返済期間を長く設定したい場合に適しています。キャッシングよりも金利が低く抑えられています。

    ・「キャッシング」：ATM等を通じて即座に現金を得られるため、急な出費など短期的な現金ニーズに最適です。ただし、金利は実質年率18%と高めに設定されています。


    【キャッシングが向かない場合】

    ・低金利で借りたい場合：実質年率18%の金利がかかるため、長期的な借入には不向きです。低利な融資を希望される場合は、カードローンをご検討ください。

    ・年収に対する借入額が多い場合：貸金業法の「総量規制」により、原則として年収の3分の1までしか借入ができません。この制限を超える資金調達はできません。


    ご自身の返済能力に照らして、誠実にご利用いただけますようお願い申し上げます。'
