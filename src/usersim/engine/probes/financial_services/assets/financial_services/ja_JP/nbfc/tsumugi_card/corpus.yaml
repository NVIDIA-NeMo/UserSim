  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: tsumugi_card
- id: 6e0d9c4e-5185-5a1d-8a68-c2ec9a94b16f
  title: update_beneficiary を使う場面
  body: '「つむぎカードローン」をご利用のお客さまが、融資の実行時に資金を受け取る振込先口座を変更したい場合に、この手続きを行います。


    【手続きの流れ】

    1. お客さまの「フルネーム（氏名）」と「生年月日」を確認し、`verify_identity` を呼び出して本人確認を完了します。

    2. `get_accounts` を使用して、つむぎカードローンに関連する正しい `account_id` を特定します。

    3. 新しい振込先口座の情報（金融機関名、支店名、口座番号、口座名義）を確認します。

    4. `update_beneficiary` を呼び出し、振込先口座の変更処理を完結させます。


    【注意点】

    * 本人確認はフルネームと生年月日の2点のみで行い、その他の認証ステップ（アプリ承認等）は行わないでください。

    * 振込先口座の変更は、貸付実行前に行う必要があります。また、身分証番号などの機密情報は聞き出さないでください。'
