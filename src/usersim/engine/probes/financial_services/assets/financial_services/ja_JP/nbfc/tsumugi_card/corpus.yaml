  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b770333e-3bbb-518f-a857-c449b19d931b
  title: リボ払い：切替えや上位プランを検討するとき
  body: '【エージェント向け：リボ払いと分割払いの切り替え判断基準】


    顧客が「月々の支払いを抑えたい」と考えている場合、リボ払い（ribo_barai）と分割払い（bunkatsu_barai）のどちらが適切か、以下の基準で案内してください。


    ・リボ払いが適しているケース：

    月々の支払額を5,000円などの一定額に固定し、家計管理をシンプルにしたい場合。また、利用金額が変動しやすく、柔軟に支払い額を調整したい場合に推奨します。ただし、実質年率15%の手数料が残高に対してかかり続けるため、長期的な利用は支払総額を増やすリスクがあることを伝えてください。


    ・分割払いが適しているケース：

    高額な買い物をし、「〇回で完結させたい」という明確な返済計画がある場合に推奨します。回数に応じて手数料が決まるため、完済までの期間と総額が明確です。


    顧客の属性と返済能力に照らし、誠実義務に基づいた最適な案内を行ってください。詳細は「リボ払い：ほかの選択肢との比較と向かない場合」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: d12e1494-36b7-5ed1-aed6-f9186c25e79a
  title: リボ払い：ほかの選択肢との比較と向かない場合
  body: '【リボ払いの特徴と選択肢の比較】


    リボ払いは、月々の支払額をほぼ一定に設定できるため、急な出費があっても家計への影響を抑えられる便利なサービスです。しかし、仕組みを正しく理解してご利用いただくことが重要です。


    【他の支払い方法との比較】

    ・1回払い / 2回払い / ボーナス一括払い：

    手数料は無料です。支払能力がある場合は、こちらが最もコストを抑えられる選択肢です。

    ・分割払い：

    回数を決めて計画的に支払います。完済までの期間が明確です。

    ・リボ払い：

    月々の支払額（最低5,000円）を一定に保てます。一方で、リボ払いの手数料率（実質年率）15%が残高に対してかかり続けるため、支払期間が長くなるほど支払総額が増加します。


    【リボ払いが向かない方】

    ・「いつの間にか残高が減っていない」という状況を避けたい方

    ・計画的に短期間で完済することを優先したい方

    ・利息負担を最小限に抑えたい方


    リボ払いは、月々の予算を固定したい方には非常に便利ですが、手数料負担を軽減するためには、余裕があるときに「繰上返済」を行うことを強くお勧めいたします。'
  domain: payments
  product_category: ribo_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 10cc271a-4db9-5066-b49d-87f8f1757414
  title: リボ払い：ご利用方法の手順
  body: '【ご質問：リボ払いはどのように利用すればよいですか？】

    お買い物の際に「リボ払い」を選択していただくか、後から1回払いのご利用分をリボ払いに変更する「あとからリボ」をご利用いただけます。


    【ご質問：毎月の支払額を変更したい場合はどうすればいいですか？】

    リボ払いの毎月の最低支払額である5,000円以上であれば、ご希望の金額に変更可能です。担当者へお申し付けください。


    【ご質問：手数料を減らす方法はありますか？】

    「繰上返済」を行うことで、元金を効率よく減らすことができ、結果として支払う手数料を軽減することが可能です。余裕のあるタイミングでぜひご活用ください。


    具体的な手続きの流れについては、「リボ払い：よくあるお手続きの流れ」をご覧ください。'
  domain: payments
  product_category: ribo_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: a679ff72-95e1-5a9c-968a-b9674f537d73
  title: リボ払い：よくあるお手続きの流れ
  body: '1回払いでお買い物をした後に、リボ払いに変更する「あとからリボ」のお手続きの流れをご案内します。


    【ご確認事項】

    リボ払いに変更する場合、リボ払いの手数料率（実質年率）15%が適用されます。また、月々のお支払額は最低5,000円からとなります。


    【お手続きの手順】

    1. 担当者に「1回払いの利用分をリボ払いに変更したい」とお伝えください。

    2. ご本人確認のため、フルネーム（氏名）と生年月日を伺います。

    3. リボ払いに変更したい対象の取引（日付や金額）を具体的に指定してください。

    4. 担当者が、変更後の月々のお支払額（5,000円以上）を確認し、適用後の支払スケジュールを提示します。

    5. 内容に同意いただいた後、変更手続きを完了いたします。


    【完了の確認】

    手続き完了後、次回の明細からリボ払いとして計上されます。正しく変更されたかは、「リボ払い：状況・履歴の確認」の手順でご確認いただけます。'
