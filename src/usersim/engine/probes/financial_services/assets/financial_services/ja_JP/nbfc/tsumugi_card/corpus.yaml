- id: 62a0f71f-51b1-53c7-b2a6-151217bcc49f
  title: 法令・制度に関するご案内：クレジットカードのショッピング
  body: 'つむぎカードのショッピング機能は、経済産業省の監督下にある「割賦販売法」に基づき運営されております。当社の義務およびお客様の権利についてご案内いたします。


    ■支払可能見込額の調査

    当社は包括信用購入あっせん業者として、カードの発行時および利用可能枠を増枠する際に、お客様の年収や生活維持費等を踏まえた「支払可能見込額の調査」を実施します。この調査に基づき、適切な利用可能枠を設定し、過剰な利用を防止します。


    ■支払停止の抗弁権

    リボ払いまたは分割払いをご利用の場合、販売店との間でトラブル（商品の未届や債務不履行など）が発生した際、一定の条件の下でカード会社への支払いを拒むことができる「支払停止の抗弁」という権利が認められています。


    ■セキュリティ対策

    インターネット決済における不正利用防止のため、カード番号に加えて本人認証を行う「EMV 3-Dセキュア」を導入しております。


    ■適用法令の範囲

    ショッピング利用による決済は、貸金業法における「総量規制」の対象外となります。なお、本サービスに関する苦情は、日本クレジット協会の消費者相談室でも受け付けられています。'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1873ebf8-143c-595e-98b1-4d287e1d14f7
  title: 法令・制度に関するご案内：ローン
  body: 'つむぎカードのキャッシングおよびつむぎカードローンは、金融庁の監督下にある「銀行法」および「貸金業法」を厳格に遵守しております。


    ■総量規制について

    貸金業法に基づき、貸金業者からの借入れの合計額は、原則として年収の3分の1までと制限される「総量規制」が適用されます。これにより、お客様の過剰借入を防止し、健全な信用環境を維持します。


    ■上限金利（利息制限法）

    利息制限法により、元本に応じた上限金利が以下のように定められています。

    ・元本10万円未満：年20%

    ・元本10万円以上100万円未満：年18%

    ・元本100万円以上：年15%

    また、貸金業者の遅延損害金の上限は年20%となります。


    ■信用情報の登録

    借入れの状況は、適切に指定信用情報機関に登録されます。


    ■エージェントの義務

    ・融資の承認を確約することはいたしません。

    ・総返済額を不当に小さく見せる案内は行いません。

    ・返済が困難な状況にあるお客様には、早急なご相談と返済条件の見直しをご案内いたします。'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8574e72c-de59-503e-94f0-f2c054aa05c1
  title: get_account_transactions を使う場面
  body: 'お客様からショッピングまたはキャッシングの利用明細について問い合わせがあった際、または特定の取引内容を確認する必要がある場合に、get_account_transactions
    を使用します。


    ■手続き手順

    1. 本人確認を実施します。お客様から「フルネーム（氏名）」と「生年月日」を確認し、verify_identity を呼び出します。

    2. 対象となる口座またはカードを特定します。お客様が提示したカード番号の下4桁などを基に、get_accounts を呼び出して正確な account_id
    を特定します。

    3. 特定した account_id を使用して get_account_transactions を呼び出し、利用明細を取得します。

    4. 取得した明細に基づき、お客様に利用金額や日付などの詳細を丁寧にご案内します。


    ※注意：本人確認が完了する前に、明細内容を提示したり、ツールを呼び出したりしないでください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: tsumugi_card
- id: 5cb7e6ac-69d4-5831-b1c4-c1cecb896d65
  title: get_account_transactions ツールリファレンス
  body: 'ショッピングおよびキャッシングの利用明細を確認するためのツールです。


    ■シグネチャ

    get_account_transactions(account_id)


    ■引数

    ・account_id: 明細を確認したい口座の識別子。get_accounts ツールなどで取得してください。


    ■機能と効果

    指定された口座に紐づく最近の取引履歴（利用日、利用先、金額、決済方法など）を返します。エージェントはこのツールを直接呼び出すことで、お客様に最新の利用状況を提示します。


    ※本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: tsumugi_card
- id: 8aa40902-1391-5b2c-b36a-a15fe1b46f36
  title: file_transaction_dispute を使う場面
  body: 'お客様から「身に覚えのない利用がある」「二重に請求されている」といった不正利用の疑いや請求内容への不服申し立てがあった場合に、file_transaction_dispute
    を使用します。


    ■手続き手順

    1. 本人確認を実施します。お客様から「フルネーム（氏名）」と「生年月日」を確認し、verify_identity を呼び出します。

    2. 対象の取引を特定します。まず get_accounts で account_id を特定し、次に get_account_transactions を呼び出して、お客様が指摘されている問題の取引（transaction_id）を特定します。

    3. 特定した transaction_id を使用して file_transaction_dispute を呼び出し、調査および補償の手続きを開始します。

    4. 不正利用の疑いが強い場合は、同時に freeze_card を呼び出してカードを停止させ、被害の拡大を防ぎます。

    5. 調査の進捗状況について、定期的かつ透明性を持って報告することを約束し、案内を終了します。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
