- id: 9121c79f-a188-50f0-ab7e-4a2f1431a142
  title: キャッシング：規定・約款の変更
  body: '本規定は、つむぎカードが提供する「キャッシング」サービスの利用条件を定めるものです。お客様は本約款に同意することで、貸金業法および関連法令に基づいた融資サービスを受けることができます。


    ■金利および利用限度額

    ・適用金利：実質年率18%といたします。

    ・利用可能枠：審査に基づき、最大500,000円までと設定します。この限度額は、割賦販売法および貸金業法に基づいた支払可能見込額の調査および総量規制（年収の3分の1まで）を遵守して決定されます。


    ■手数料の負担

    ATM利用時の手数料は、お客様の負担となります。1万円以下の引き出しで110円、1万円超の引き出しで220円を適用いたします。


    ■規定の変更について

    経済産業省や金融庁などの規制当局による法令改正、または当社の運営方針の変更に伴い、本規定および金利・手数料を改定する場合があります。変更がある場合は、Webサイトへの掲載または書面等により、事前に十分な期間をもってお客様に通知いたします。


    ■契約の終了

    お客様が本サービスの解約を希望される場合、または当社が審査の結果、利用限度額を0円とするなどの措置を講じた場合、本契約は終了いたします。未払金がある場合は、速やかに全額を返済いただく義務がございます。'
