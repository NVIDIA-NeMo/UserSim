- id: 0db8d64c-e8e5-5640-bea2-0cfa9d630a53
  title: リボ払い：リボ払いの毎月の最低支払額について
  body: 'Q: リボ払いの毎月の最低支払額はいくらですか？

    A: リボ払いの毎月の最低支払額は 5,000円 です。この金額を下回る設定をすることはできません。


    Q: 最低支払額だけを支払っているとどうなりますか？

    A: 毎月の支払額が一定であるため家計管理はしやすいですが、元金の減りが緩やかになり、実質年率15%の手数料が長くかかり続けるため、支払総額が増える可能性が高くなります。


    Q: 支払額を5,000円以上に変更することはできますか？

    A: はい、可能です。月々の支払額を増やすことで、より早く完済でき、手数料を抑えることができます。変更手続きについては「リボ払い：解約・変更・プランの切替え」をご参照ください。'
