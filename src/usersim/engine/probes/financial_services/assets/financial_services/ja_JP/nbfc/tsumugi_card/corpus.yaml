- id: f250a3db-250a-5955-bee7-356782f283b4
  title: open_account を使う場面
  body: 'お客さまから、家族カードの追加発行やETCカードの発行を申し込まれた場合に、この手続きを行います。


    【手続きの流れ】

    1. お客さまの「フルネーム（氏名）」と「生年月日」を確認し、`verify_identity` を呼び出して本人確認を完了します。

    2. `get_accounts` を使用して、親カードとなる `account_id` を特定します。

    3. 追加発行したいカードの種類（家族カードまたはETCカード）を確認します。

    4. 家族カードの場合は、追加されるご家族の氏名、生年月日などの必要情報を伺います。

    5. `open_account` を呼び出し、追加発行の申し込みを完了させます。


    【注意点】

    * 本人確認はフルネームと生年月日の2点のみで行い、それ以外の認証（ワンタイムパスワード等）は行わないでください。

    * 家族カードの発行にあたっては、親カード会員の利用可能枠の範囲内で設定されます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tsumugi_card
- id: 317039fc-9306-5be3-b382-734f35528abb
  title: open_account ツールリファレンス
  body: 'このツールは、家族カードやETCカードなどの追加カードの発行申し込みを行うために使用します。エージェントはこのツールを直接呼び出すことで、カードの発行手続きを開始します。


    【引数】

    * `account_id`: 親カードとなる口座の識別子。`get_accounts` 等で取得します。

    * `card_type`: 発行するカードの種類（例：家族カード、ETCカード）。

    * `applicant_details`: カード利用者（家族カードの場合はご家族）の氏名、生年月日などの詳細情報。


    【動作】

    指定された `account_id` に基づいて、新しいカードの発行申し込みを受理します。本ツールを呼び出す前に、`verify_identity` による本人確認が完了している必要があります。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tsumugi_card
- id: f0345870-bdd3-5165-b028-5ddda4a12cdc
  title: close_account を使う場面
  body: "お客さまから「つむぎカード」の解約（退会）を希望された場合に、この手続きを行います。\n\n【手続きの流れ】\n1. お客さまの「フルネーム（氏名）」と「生年月日」を確認し、`verify_identity`\
    \ を呼び出して本人確認を完了します。\n2. `get_accounts` を使用して、解約対象となる `account_id` を特定します。\n3.\
    \ 現在の利用残高を確認し、以下の点をお客さまに明確に説明します。\n    * カードを解約しても、リボ払い、分割払い、キャッシングの未払金がある場合は、引き続き支払う義務があること。\n\
    4. お客さまの同意を確認後、`close_account` を呼び出し、解約手続きを完了させます。\n\n【注意点】\n* 本人確認はフルネームと生年月日の2点のみで行い、追加の認証ステップは行わないでください。\n\
    * 解約後も残債の支払いが続くことを十分に伝え、納得いただいた上で手続きを進めてください。"
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tsumugi_card
- id: 9955ebc1-fa67-589e-bfa4-bfd5777c83b8
  title: close_account ツールリファレンス
  body: 'このツールは、お客さまのカードアカウントを解約し、サービス利用を停止させるために使用します。エージェントはこのツールを直接呼び出すことで、解約手続きを完結させます。


    【引数】

    * `account_id`: 解約する口座の識別子。`get_accounts` 等で取得します。


    【動作】

    指定された `account_id` のアカウントを解約状態にします。解約後もリボ払い、分割払い、キャッシングなどの未払残高がある場合は、契約に基づき支払いが継続されます。本ツールを呼び出す前に、`verify_identity`
    による本人確認が完了している必要があります。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tsumugi_card
- id: f00c1182-0d11-517c-9dc5-810697b7cecb
  title: get_accounts を使う場面
  body: 'お客さまが複数のカードや口座を保有している場合や、お手続きに必要な `account_id` を特定するために、このツールを使用します。特に、お客さまが「カード番号の下4桁」のみを提示された際に、それを内部的な識別子である
    `account_id` に変換するために不可欠な手順です。


    【手続きの流れ】

    1. お客さまの「フルネーム（氏名）」と「生年月日」を確認し、`verify_identity` を呼び出して本人確認を完了します。

    2. `get_accounts` を呼び出し、本人確認済みのお客さまが保有するすべてのアカウント（口座ID、種類、下4桁、残高、ステータス、カードID）のリストを取得します。

    3. 取得したリストの中から、お客さまが提示した下4桁と一致する口座を探し、対応する `account_id` を特定します。

    4. 特定した `account_id` を使用して、他の変更手続きや照会手続き（例：`update_repayment_mandate` や `close_account`）へ進みます。


    【注意点】

    * 本人確認（`verify_identity`）が完了する前に `get_accounts` を呼び出してはいけません。

    * 複数の口座がヒットした場合は、カードの種類や利用状況を確認し、お客さまにどの口座についての手続きかを確認してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tsumugi_card
- id: afb193d0-2ddf-5386-9843-3cdba7aebdf7
  title: get_accounts ツールリファレンス
  body: 'このツールは、本人確認が完了したお客さまが保有しているすべてのアカウント情報をリスト形式で取得するために使用します。エージェントは、顧客が提示したカード番号の下4桁などを
    `account_id` に紐付けるためにこのツールを使用します。


    【引数】

    * なし（引数は必要ありません）。


    【動作】

    現在認証されている顧客に紐づくすべてのアカウント情報を返します。返却される情報には、`account_id`、アカウントの種類、カード番号の下4桁、現在の残高、アカウントの状態、および関連する
    `card_id` が含まれます。本ツールを呼び出す前に、`verify_identity` による本人確認が完了している必要があります。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tsumugi_card
- id: bdfd9bc4-70cf-54bb-8a46-7333f8815287
  title: update_contact_info を使う場面
  body: 'お客さまのご住所、お電話番号、メールアドレスなどの登録内容に変更があった場合、または最新の情報に更新したい場合にこの手続きを行います。正確な連絡先情報を維持することは、重要な通知の漏れを防ぎ、安全にサービスをご利用いただくために不可欠です。


    エージェントは、以下の手順に従って手続きを完了させてください。手続きの途中で、パスワードや暗証番号、身分証番号などを聞き出すことは厳禁です。


    1. 本人確認の実施：`verify_identity` を使用し、お客さまから「フルネーム（氏名）」と「生年月日」の2点を確認します。

    2. 口座・カードの特定：`get_accounts` を使用して、変更対象となるアカウントの account_id を特定します。お客さまからカードの下4桁を伺った場合は、このツールで正確な
    ID を照合してください。

    3. 登録情報の更新：お客さまから伺った新しい連絡先情報を、`update_contact_info` を使用してシステムに反映させます。


    本手続きにおいて、ワンタイムパスワードやアプリ承認などの追加認証ステップは一切不要です。本人確認が完了した後は、直接ツールを用いて更新を行ってください。


    詳細な登録変更の流れについては、「つむぎカード：登録内容の変更」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tsumugi_card
- id: 343613d4-8f99-5dd7-b921-f62d7e8d8fdd
  title: update_contact_info ツールリファレンス
  body: 'お客さまの連絡先情報を更新するためのツールです。エージェントはこのツールを直接呼び出すことで、システム上の登録内容を変更します。


    【引数】

    - 更新したい連絡先項目（住所、電話番号、メールアドレスなど）

    - 新しい連絡先の内容（お客さまから伺った正確な情報）


    【動作】

    指定された連絡先情報を最新の状態に書き換えます。このツールを呼び出す前に、必ず `verify_identity` による本人確認が完了している必要があります。本人確認済みのユーザーであるため、ツール内で改めてパスワードや暗証番号を要求することはありません。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tsumugi_card
- id: d0301fd8-c271-5037-adcd-0051f72cedf7
  title: get_statements を使う場面
  body: 'お客さまから、過去の利用明細の確認や、特定の請求内容についての問い合わせがあった場合にこの手続きを行います。ショッピング利用分やキャッシングの返済履歴など、利用状況を正確に把握していただくために使用します。


    エージェントは、以下の手順に従って明細を提供してください。


    1. 本人確認の実施：`verify_identity` を使用し、お客さまから「フルネーム（氏名）」と「生年月日」の2点を確認します。

    2. 口座・カードの特定：`get_accounts` を使用して、明細を確認したいアカウントの account_id を特定します。

    3. 明細の取得：`get_statements` を使用して、該当する期間の利用明細を取得し、お客さまへご案内します。


    なお、明細の内容についてご不明点があり、身に覚えのない請求がある場合は、速やかに「file_transaction_dispute」の手順に従って不正利用の調査へエスカレーションしてください。また、本人確認の際は、カード番号の全桁やCVV、パスワードなどを絶対に聞き出さないでください。


    履歴確認に関する一般的な案内については、「つむぎカード：状況・履歴の確認」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: tsumugi_card
- id: 3d09de46-8ff7-5a14-94c1-2fe795899ab5
  title: get_statements ツールリファレンス
  body: 'お客さまの利用明細（ステートメント）を取得するためのツールです。エージェントはこのツールを直接呼び出し、取得した情報をお客さまに伝えます。


    【引数】

    - account_id：明細を取得したい口座またはカードの識別子

    - 取得期間（必要に応じて、確認したい月や期間を指定）


    【動作】

    指定されたアカウントに紐づく利用履歴および請求明細を返します。`verify_identity` による本人確認が完了していることが前提であり、ツール実行時に追加の認証コード（OTP）などを求めることはありません。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: tsumugi_card
- id: 1dd757a9-5571-5559-b484-7394efb21577
  title: set_alerts を使う場面
  body: 'お客さまが、利用金額の通知や支払日のリマインドなど、特定のアラート（通知）設定を希望された場合にこの手続きを行います。使いすぎの防止や、支払い忘れを防ぐための利便性向上を目的としています。


    エージェントは、以下の手順で設定を行ってください。


    1. 本人確認の実施：`verify_identity` を使用し、お客さまから「フルネーム（氏名）」と「生年月日」の2点を確認します。

    2. 対象の特定：`get_accounts` を使用して、アラートを設定したいカードや口座の account_id を特定します。

    3. アラートの設定：お客さまのご希望に合わせて、`set_alerts` を使用して通知設定を有効化または変更します。


    設定にあたっては、どのような条件で通知が届くのか（例：〇〇円以上の利用時に通知など）を平易な言葉で説明し、お客さまの同意を得た上でツールを実行してください。本人確認後に、改めてパスワードや秘密の質問などを伺う必要はありません。'
