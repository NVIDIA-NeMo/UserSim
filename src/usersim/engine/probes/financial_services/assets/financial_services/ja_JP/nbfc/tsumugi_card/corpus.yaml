- id: 2fdeaa81-ff52-58a6-94ef-8f9bf4ad9339
  title: つむぎカードローン：貸付金利（下限）について
  body: '【質問】

    つむぎカードローンの貸付金利（下限）である4.5%を適用してもらうにはどうすればよいですか？


    【回答】

    貸付金利は、お客さまの年収、勤続年数、お取引実績などの審査に基づき、年4.5%から年18%の範囲で決定されます。下限金利である4.5%を適用するための具体的な条件を個別に提示することはできかねますが、安定した収入と健全な信用履歴が審査の重要なポイントとなります。


    金利の適用範囲や詳細については、「つむぎカードローン：金利・料率一覧」をご確認ください。また、ご自身の適用金利についてのご質問は、本人確認（フルネームと生年月日）の後に担当者がご案内いたします。'
