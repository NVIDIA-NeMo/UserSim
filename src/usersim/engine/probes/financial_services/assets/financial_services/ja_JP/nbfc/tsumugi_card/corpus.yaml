- id: 6e3dd069-9583-57e6-89c9-e67e932c3617
  title: 分割払い：個人情報の取扱い
  body: 'つむぎカードでは、お客様に安全かつ適切な信用供与を行うため、個人情報を厳重に管理し、法令に基づいた取扱いを徹底しております。


    ■個人情報の利用目的

    「分割払い」のご利用にあたり、以下の目的で個人情報を利用させていただきます。

    ・割賦販売法に基づく「支払可能見込額の調査」：お客様の年収や生活維持費などを踏まえ、適正な利用限度額を算定するため。

    ・信用情報の照会および登録：指定信用情報機関への登録を通じて、過剰借入を防止し、健全な信用環境を維持するため。

    ・ご本人確認：不正利用防止のため、操作前に「フルネーム（氏名）」および「生年月日」を確認させていただきます。


    ■情報の管理と保護

    ・当社は経済産業省および金融庁の規制を厳格に遵守し、カード番号などの重要な情報は適切に管理しております。

    ・インターネット決済においては、EMV 3-Dセキュア等の本人認証サービスを導入し、情報の漏洩および不正利用の防止に努めております。


    ■お客様の権利

    お客様は、ご自身の登録内容の確認や変更を請求することが可能です。お手続きについては「分割払い：登録内容の変更」をご確認ください。'
