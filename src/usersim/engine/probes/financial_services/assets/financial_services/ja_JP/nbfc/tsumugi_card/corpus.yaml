- id: 4f224f95-c07e-56c1-a597-094247fcb876
  title: キャッシング：不正利用からお客さまを守るために
  body: 'つむぎカードのキャッシングサービスを安心してお使いいただくために、最近の不正利用の手口と対策についてご案内いたします。


    ■注意すべき不正利用の手口

    ・フィッシング詐欺：当社の担当者を装い、メールやSMSで偽のサイトへ誘導し、個人情報を盗み出そうとする手口です。

    ・ATMスキミング：ATMのカード挿入口に不正な装置を設置し、磁気情報を読み取ってカードを複製する手口です。


    ■つむぎカードが「絶対に」お聞きしないこと

    私たちは、どのような理由があっても、電話やメール、チャットで以下の情報を聞き出すことはございません。

    ・カード番号、有効期限、CVV（セキュリティコード）

    ・暗証番号（PIN）

    ・ログインパスワードやワンタイムパスワード

    ・身分証の番号


    ■もし「おかしい」と感じたら

    身に覚えのない利用通知が届いた場合や、カードを紛失した可能性がある場合は、直ちにご連絡ください。迅速に利用停止および再発行手続きを行い、規約に基づいた補償を適用いたします。不正利用の報告が遅れると、補償の範囲が制限される場合があるため、早めの対応をお願いいたします。


    詳細な安全利用のポイントについては、「つむぎカード：安全にご利用いただくためのポイント」をご参照ください。'
