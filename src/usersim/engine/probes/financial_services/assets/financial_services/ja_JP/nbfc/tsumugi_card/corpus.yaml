- id: 6dc8ad9d-761e-5545-9805-e797debb0b74
  title: キャッシング：ご利用開始までの手順
  body: 'お客様がキャッシングサービスをスムーズにご利用開始いただけるよう、以下のお手続きの流れをご案内いたします。サポート担当者は、お客様の状況に合わせて各ステップを適切に案内してください。


    1. お申し込みと本人確認

    まず、お客様に「フルネーム（氏名）」と「生年月日」をご提示いただき、ご本人様であることを確認します。その後、キャッシング機能の利用申し込みを受け付けます。


    2. 支払能力の審査（審査部門による対応）

    貸金業法および割賦販売法に基づき、お客様の年収、生活維持費、他社借入状況などの情報を確認し、返済能力を審査します。特に「総量規制」に基づき、貸金業者からの借入合計額が原則として年収の3分の1を超えない範囲で設定します。


    3. 利用可能枠の決定

    審査結果に基づき、利用限度額を決定します。設定可能な最大枠は500,000円です。決定した限度額はお客様へ通知いたします。


    4. カードの発行と機能有効化

    キャッシング機能が付帯したカードを発行し、お客様へお届けします。


    5. ATMでのご利用開始

    お手元のカードと暗証番号を用い、全国の対応ATMから現金の引き出しが可能となります。

    ・1万円以下のご利用：ATM利用手数料110円

    ・1万円超のご利用：ATM利用手数料220円

    ・適用金利：実質年率18%


    なお、審査の詳細や法的な判断が必要な案件については、速やかに専門の審査部門またはコンプライアンス担当へエスカレーションしてください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
