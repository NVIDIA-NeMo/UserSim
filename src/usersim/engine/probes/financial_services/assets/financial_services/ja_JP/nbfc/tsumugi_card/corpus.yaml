- id: 924d2752-9cb0-599f-8219-e3ef2d36dcad
  title: つむぎカード：ご紹介・継続利用の特典
  body: '【お知り合いへのご紹介キャンペーン】

    つむぎカードを大切にご利用いただいているお客さまへ、ご紹介特典をご案内いたします。


    ■特典内容

    ご紹介いただいた方が「つむぎカード」を新規に発行し、初めてのお買い物をされた場合、ご紹介者様とご入会者様の両方に1,000ポイントを進呈いたします。


    ■実施期間

    2025年4月1日から2025年9月30日まで


    ■条件

    ・本カードを継続してご利用中の方に限ります。

    ・ポイント還元率0.5%の適用に加え、本特典が付与されます。


    大切な方へ、日々の生活に寄り添う安心の金融サービスをご紹介ください。詳細は「つむぎカード：実施中のキャンペーン」をご確認ください。'
