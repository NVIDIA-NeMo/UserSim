- id: 3ba7eb56-75a5-5342-9d2c-f6fd90729847
  title: 分割払い：ご紹介・継続利用の特典
  body: 'つむぎカードの「分割払い」をご利用いただき、誠にありがとうございます。高額なお買い物でも、最大24回まで回数を分けて計画的に支払うことができるため、家計のバランスを維持しながら理想のライフスタイルを実現いただけます。


    現在、つむぎカードを継続してご利用いただいているお客様や、ご友人をご紹介いただいたお客様に向けた特典をご案内しております。詳細なキャンペーン内容や適用条件につきましては、「つむぎカード：実施中のキャンペーン」にてご確認いただけます。


    日々の決済から大きな買い物まで、つむぎカードがお客様の生活基盤として、安心で便利な金融サービスを提供し続けます。'
