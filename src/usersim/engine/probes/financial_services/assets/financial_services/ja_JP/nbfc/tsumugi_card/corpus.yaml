- id: cd553a65-1b8b-5720-b3a2-9268a3322bf1
  title: つむぎカードローン：重要事項のご説明
  body: 'つむぎカードローンのご利用にあたり、法令に基づいた重要な事項をご説明いたします。内容を十分にご理解いただいた上でご契約ください。


    【適用法令と規制】

    本商品は金融庁の監督の下、銀行法および貸金業法を厳格に遵守して運営されています。


    ■総量規制について

    貸金業法に基づき、お客さまが貸金業者から借入できる合計額は、原則として年収の3分の1までと制限されています。この制限を超える借入は、原則としてお断りしております。


    ■上限金利について

    利息制限法に基づき、元本金額に応じて以下の通り上限金利が定められています。

    ・元本10万円未満：年20%

    ・元本10万円以上100万円未満：年18%

    ・元本100万円以上：年15%

    本商品の適用金利（年4.5%〜18%）は、これらの法令の上限を超えない範囲で設定されます。


    ■信用情報機関への登録

    本商品の借入状況および返済履歴は、指定信用情報機関に登録されます。適切に管理された信用情報は、今後の健全な金融取引の基盤となります。


    ■返済に関するご相談

    万が一、ご自身の経済状況の変化により返済が困難になった場合は、早めにご相談ください。返済条件の見直しなど、誠実に対応させていただきます。無理な借入を防止し、健全な信用環境を維持することが当行の使命です。'
