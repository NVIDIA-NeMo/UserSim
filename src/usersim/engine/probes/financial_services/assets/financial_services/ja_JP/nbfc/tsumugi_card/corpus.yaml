- id: 86269b52-e9fd-555a-8ba3-ed7af343aa1b
  title: つむぎカードローン：切替えや上位プランを検討するとき
  body: '急な資金ニーズへの対応として「キャッシング」をご利用中の方で、より大きな資金調達を検討される場合の比較です。


    ■ つむぎカードローンとキャッシングの比較

    * 利用可能額：キャッシングは少額の短期融資向けですが、つむぎカードローンは最大 5,000,000円 までという大きな資金需要に対応可能です。

    * 金利面：つむぎカードローンは、より余裕を持った返済計画を立てることで、低利での利用が可能です（貸付金利：4.5% ～ 18%）。

    * 返済方式：キャッシングに比べ、つむぎカードローンは返済期間を長く設定でき、月々の負担を抑えた計画的な返済に適しています。


    ■ おすすめの選択

    * 短期間に少額だけ借りたい場合 → キャッシング

    * 高額な資金が必要で、低金利かつ長期的な返済計画を立てたい場合 → つむぎカードローン


    切替えをご検討の際は、お客様の現在の属性と返済能力に基づき、最適なプランをご案内いたします。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bca85803-c67e-5991-876f-93b3d80deda8
  title: つむぎカードローン：ほかの選択肢との比較と向かない場合
  body: 'つむぎカードローンを検討される際、どのような場合に最適で、どのような場合に他のお手続きが適しているかを解説します。


    ■ つむぎカードローンが向いている方

    * 数十万円から数百万円といった、まとまった資金を調達したい方

    * 貸付金利 4.5% ～ 18% の範囲で、返済能力に応じた適切な金利での借入を希望される方

    * 毎月の返済額をコントロールし、計画的に完済を目指したい方


    ■ 向かない場合（他の選択肢を検討すべきケース）

    * 極めて少額の資金を、ATMなどで即座に調達したい場合 → 「キャッシング」がより便利です。

    * 毎月の最低返済額 4,000円 の支払いが困難であると考えられる場合 → 無理な借入は避け、家計の見直しをご検討ください。

    * お買い物の支払いを分割したいだけの場合 → 「分割払い」や「リボ払い」の方が手数料を抑えられる場合があります。


    ■ ご留意点

    本商品は貸金業法の「総量規制」の対象となります。年収の3分の1を超える借入は原則としてできません。お客様の状況に合わせて、誠実な基準でプランをご提案いたします。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: fe2abe55-44c0-571e-85bc-cbc937df083f
  title: つむぎカードローン：手数料と費用
  body: '【質問】つむぎカードローンの利用にかかる手数料や費用について教えてください。


    【回答】主な費用は、お借入額に対して発生する「貸付金利（利息）」です。金利は年 4.5% から 18% の範囲で、お客様の審査結果に基づき決定されます。


    ■ 手数料の考え方

    つむぎカードでは、手数料を信用リスクの管理およびサービスの維持に必要な実費として設定しております。そのため、貸付金利以外の不透明な費用はいただいておりません。


    ■ 費用を抑える方法

    最低返済額の 4,000円 を超える金額を随時返済（繰上返済）いただくことで、元本が早く減り、支払う利息の総額を軽減することが可能です。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: ac18b9f3-8573-51cc-ab63-99bfef198132
  title: つむぎカードローン：よくあるお手続きの流れ
  body: 'つむぎカードローンのご申込みからご利用開始までの一般的な流れをご案内します。


    ■ お手続きの流れ

    1. お申込みの意思を当社にお伝えください。

    2. ご本人確認のため、「フルネーム（氏名）」と「生年月日」をお伝えください。

    3. 審査のため、年収や生活維持費、他社借入状況などの情報を伺います。これにより、割賦販売法や貸金業法に基づいた「支払可能見込額」および「総量規制」の調査を行います。

    4. 審査完了後、お客様の返済能力に基づいた「利用限度額（最大 5,000,000円）」と「適用金利（4.5% ～ 18%）」を提示いたします。

    5. 内容にご同意いただき、ご契約が成立した時点で、借入が可能となります。


    ■ ご注意点

    * 審査の結果、ご希望の金額や金利でのご提供が難しい場合がございます。

    * 融資の承認を事前にお約束することはできません。誠実な審査に基づき、お客様に無理のない利用枠を設定させていただきます。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 2bb521c1-e128-5552-af99-f5b5ce85eb41
  title: つむぎカードローン：明細や記録と合わない
  body: 'つむぎカードローンの利用明細や残高が、お客様ご自身の計算と合わない場合の確認事項をご案内します。


    ■ よくある原因

    * 利息の計算タイミング：利息は日割りで計算されるため、返済日までの日数によって変動します。適用金利（4.5% ～ 18%）に基づき正確に計算されています。

    * 返済の充当順序：お支払いいただいた金額は、まず未払利息に、次に元本に充当されます。そのため、元本の減り方が想定より遅く感じられる場合があります。

    * 最低返済額の適用：毎月 4,000円 の最低返済額を支払っている場合、利息の割合が高い時期は元本の減少額が少なくなります。


    ■ 確認の手順

    1. ご本人確認（フルネームと生年月日）の後、正確な適用金利と、直近の返済金がどのように充当されたかを確認してください。

    2. 当社にて再計算を行い、計算根拠をご説明いたします。


    ■ 当社での対応

    再確認の結果、当社の計算に誤りがあった場合は速やかに修正し、お詫びとともに正しい金額を報告いたします。また、どうしても解消しない不整合がある場合は、コンプライアンス担当または専門の審査部門へエスカレーションし、公正な調査を行います。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 44a5d07d-f34a-533f-9a73-a9a4cdfb28d9
  title: 手数料・料金のご案内
  body: 'つむぎカードでは、サービスの維持・向上および信用リスク管理に必要な実費として手数料を設定しております。透明性の高い料金体系を心がけており、お客様の利便性とコスト負担のバランスを最適化しております。


    ■基本決済の手数料

    ・1回払い、2回払い、ボーナス一括払い：無料


    ■商品別の手数料

    ・リボ払い、分割払い、キャッシング、つむぎカードローンをご利用の場合、所定の手数料または利息が発生いたします。詳細については、各商品の「手数料一覧」または「金利・料率一覧」をご確認ください。'
  domain: payments
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
