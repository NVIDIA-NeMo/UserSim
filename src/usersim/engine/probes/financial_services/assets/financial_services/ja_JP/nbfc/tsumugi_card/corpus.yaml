- id: 787afeae-798a-50ba-b22c-88cfb1cd0b53
  title: 分割払い：リスクについてのご説明
  body: '「分割払い」をご利用いただく前に、以下のリスクと注意点について必ずご確認ください。


    ■ 支払総額の増加について

    分割払いは、月々の支払額を抑えられる一方で、利用金額に対して手数料が加算されます。そのため、1回払いに比べて、最終的な支払総額は必ず増加します。手数料率は実質年率12%から15%の範囲で適用されます。


    ■ 手数料の発生構造

    回数を増やせば増やすほど、手数料が適用される期間が長くなるため、支払総額は大きくなります。最大24回まで設定可能ですが、ご自身の返済能力に見合った回数を選択してください。


    ■ 支払遅延のリスク

    分割払いの支払いが遅れた場合、約定の手数料に加え、遅延損害金が発生する可能性があります。また、指定信用情報機関への登録内容に影響し、今後の利用枠の制限や他社での審査に影響を及ぼす恐れがあります。


    ■ 繰上返済による軽減

    支払総額を抑えたい場合は、余裕がある時に繰上返済を行うことをお勧めします。これにより、未経過分の手数料を削減することが可能です。


    つむぎカードは、顧客の支払能力に基づいた適正な利用枠を設定し、過剰な借入を防止する健全な信用環境の維持に努めております。'
