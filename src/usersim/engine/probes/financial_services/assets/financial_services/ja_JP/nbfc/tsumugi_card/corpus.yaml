- id: 779e98e0-ae3b-525a-bdec-2e510258b543
  title: リボ払い：ご紹介・継続利用の特典
  body: '【ご紹介キャンペーンのご案内】


    つむぎカードを大切にご利用いただいているお客さまへ、特別な特典をご用意いたしました。


    ■特典内容

    ご友人やご家族に「リボ払い」をご案内いただき、新しくご利用を開始された場合、ご紹介者様とご入会者様それぞれに1,000円のギフトポイントを進呈いたします。


    ■実施期間

    2025年1月1日から2025年6月30日まで


    ■ご注意事項

    ・本特典は、期間内にリボ払いの設定を完了された方が対象となります。

    ・ポイントの進呈時期や詳細は、個別の通知にてご案内いたします。


    日々の家計管理をより柔軟にするリボ払いを、この機会にぜひご検討ください。'
