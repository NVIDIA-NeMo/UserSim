- id: 5c862f6b-569b-5e19-80e8-dd21572b607d
  title: 分割払い：実施中のキャンペーン
  body: '【計画的なショッピング応援キャンペーン実施中】


    2025年1月1日から2025年3月31日まで、つむぎカードでのお買い物における「分割払い」のご利用を推進するキャンペーンを実施しております。


    期間中に対象の商品をご購入いただき、分割払い（回数不問）をご設定いただいたお客様を対象に、ポイント還元率をアップさせる特典をご用意しております。


    【適用される基本条件】

    ・最大支払回数：24回

    ・適用手数料率（実質年率）：12% 〜 15%

    ・3回払い手数料：100円あたり 2.01円


    キャンペーン期間中であっても、分割払いには所定の手数料がかかります。月々の支払額を計画的に設定し、ぜひ本サービスをご活用ください。'
