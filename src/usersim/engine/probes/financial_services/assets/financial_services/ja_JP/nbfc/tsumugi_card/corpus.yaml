- id: 2bf395b1-5a83-52c4-a659-b49ef1e0e6c9
  title: つむぎカード：金利・料率の決まり方と適用
  body: 'つむぎカードにおける費用および料率の決定基準についてご案内します。サポート担当者は、お客様へ正確な金額を提示してください。


    【固定費用】

    * 年会費：1,375円（全ての会員様に一律で適用されます）

    * ETCカード年会費：550円（ETCカード発行希望の方に適用されます）


    【ショッピング利用可能枠】

    * 最大上限：1,000,000円

    * 決定方法：割賦販売法に基づく「支払可能見込額の調査」を行い、お客様の年収、生活維持費、他社借入状況などを総合的に判断して決定します。


    【還元率】

    * ポイント還元率：0.5%（利用金額に対して一定の率で付与されます）


    【手数料の適用】

    * 1回払い、2回払い、ボーナス一括払い：手数料 0円

    * 分割払い、リボ払い：残高に基づいた手数料が適用されます。具体的な料率は、利用回数や残高に応じて決定されます。


    これらの料率は、サービスの維持向上および信用リスクの管理に必要な実費として設定しております。'
