- id: cb2356b7-fe54-5e32-8c18-ff12276d94f7
  title: つむぎカードローン：金利・料率の決まり方と適用
  body: 'つむぎカードローンの適用金利の決定プロセスについてご案内します。


    ■適用金利の範囲

    本商品の貸付金利は、以下の範囲内で設定されます。

    *   貸付金利（下限）：4.5%

    *   貸付金利（上限）：18%


    ■金利の決定要因

    具体的な適用金利は、お申込み時の審査において、以下の要素を総合的に判断して決定いたします。

    1.  年収および支払能力の確認（総量規制の遵守）

    2.  指定信用情報機関に登録されている過去の取引実績

    3.  ご提示いただいた収入証明書の内容


    ■金利の適用方法

    決定した金利は年率で適用され、借入残高に対して日割りで計算されます。一度決定した金利は原則として固定されますが、利用限度額の増枠申請や、定期的な属性変更に伴う再審査の際に変更となる場合がございます。個別の適用金利については、契約締結時の書面にて明確に提示いたします。'
