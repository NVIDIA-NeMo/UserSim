- id: 9aa11710-cdd0-55ba-9434-c685994570fb
  title: freeze_card ツールリファレンス
  body: 'カードの紛失・盗難届出を受け付け、即時にカードの利用を停止させるためのツールです。


    ■シグネチャ

    freeze_card(card_id)


    ■引数

    ・card_id: 利用停止にするカードの識別子。get_accounts ツールなどで取得してください。


    ■機能と効果

    指定されたカードを即時に利用不能状態（凍結）にします。これにより、以降の不正な決済やキャッシングを防ぎます。


    ※本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
