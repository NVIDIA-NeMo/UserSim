- id: d22e1f07-f46e-5bac-a1f5-b648fcc86296
  title: つむぎカードローン：お申込みいただける方
  body: 'つむぎカードローンのお申込み条件および審査基準についてご案内いたします。


    | 項目 | 条件・基準 | 結果 |

    | :--- | :--- | :--- |

    | 本人確認 | フルネームおよび生年月日の照合が可能であること | 必須条件 |

    | 借入合計額 | 他社借入を含む合計額が原則として年収の3分の1以下であること（総量規制） | 審査基準 |

    | 支払能力 | 安定した継続的な収入があり、毎月の最低返済額4,000円以上の支払が可能であること | 審査基準 |

    | 信用情報 | 指定信用情報機関に登録された履歴に重大な問題がないこと | 審査基準 |

    | 利用希望額 | 最大5,000,000円の範囲内であること | 設定上限 |


    ※上記条件を満たしていても、総合的な審査の結果、ご利用いただけない場合がございます。'
