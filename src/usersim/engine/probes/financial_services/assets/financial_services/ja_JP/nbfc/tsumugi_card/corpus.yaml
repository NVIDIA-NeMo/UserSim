- id: 867b2353-b87f-5036-9156-ab7134590c2f
  title: つむぎカード：よくあるお手続きの流れ
  body: "つむぎカードをお申し込みいただき、ご利用を開始するまでの標準的な流れをご案内します。\n\n【お手続きのステップ】\n1. **お申し込み**\n\
    \   必要事項をご入力の上、お申し込みください。この際、年会費1,375円および、希望される場合はETCカード年会費550円についてのご案内を差し上げます。\n\
    2. **支払可能見込額の調査**\n   割賦販売法に基づき、お客さまの年収や生活維持費などを確認し、適切なショッピング利用可能枠を算定します。この調査の結果に基づき、最大1,000,000円までの範囲で利用限度額が設定されます。\n\
    3. **ご本人様確認**\n   ご本人様であることを確認するための手続きを行います。ご提示いただいた書類等に基づき、厳格に審査いたします。\n4. **審査および発行**\n\
    \   信用情報機関への照会を含めた総合的な審査を行い、発行可否を決定します。承認後、カードの製造および発送手続きに入ります。\n5. **カードの受け取りと利用開始**\n\
    \   ご登録先住所にカードが届きます。お手元に届いたカードで、0.5%のポイント還元を適用したショッピング利用が可能になります。\n\n【完了の目安】\n\
    お申し込みからカードのお届けまで、通常1週間から2週間程度お時間をいただいております。進捗状況についてのお問い合わせは、フルネーム（氏名）と生年月日をお知らせください。\n\
    \n詳細は「つむugi_card_standard_product_sheet_3」をご確認ください。"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: how_to_guide
