- id: 72ad5751-4b62-5c7a-b0a0-1c6e5f781f30
  title: 分割払い：解約・変更・プランの切替え
  body: 'すでにお買い物をされた後で、支払方法を「分割払い」に変更したい場合や、分割払いを途中で終了（繰上返済）させたい場合の手続きをご案内します。


    ■ ご準備いただくもの

    ・ご本人確認のため、「フルネーム（氏名）」と「生年月日」をお知らせください。


    ■ 支払方法を「分割払い」へ変更する手順

    1. 変更したい利用明細の内容を弊社にお伝えください。

    2. 分割回数を選択してください（最大24回まで設定可能です）。

    3. 適用される手数料率（12% ～ 15%）に基づいた、月々の支払額と手数料の合計額を弊社から提示いたします。

    4. 内容に同意いただいた後、変更手続きが完了します。変更後の金額は次回の明細に反映されます。


    ■ 分割払いを途中で終了（繰上返済）する手順

    1. 繰上返済を希望される利用分を弊社にお伝えください。

    2. 現在の残高（元金および未経過分の手数料）を確認し、提示いたします。

    3. 全額または一部を返済することを申し出てください。

    4. ご指定の口座から引き落とし、またはご入金をもって手続き完了となります。繰上返済により、将来的に発生する予定の手数料を軽減できます。


    ■ プランの切替えについて

    「リボ払い」から「分割払い」への変更などは、審査および条件により制限がある場合がございます。あわせてご相談ください。'
