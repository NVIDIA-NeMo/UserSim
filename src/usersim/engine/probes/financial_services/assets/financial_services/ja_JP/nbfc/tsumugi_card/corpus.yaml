- id: 645b8129-2a2c-53bd-9a2f-fc1be614509c
  title: キャッシング：金利・料率一覧
  body: 'キャッシングに適用される金利についてご案内いたします。


    ■適用金利

    ・キャッシングの金利（実質年率）：18%


    【金利の適用について】

    ・本金利は、借入残高に対して適用される一律の利率です。借入金額の多寡にかかわらず、すべての利用者に同一の利率が適用されます。

    ・金利は日割りで計算され、毎月の返済日に合算して請求されます。


    【変動の可能性】

    法令の改正や経済情勢の変化により、金利が改定される場合があります。改定の際は、あらかじめ書面またはWeb等で告知いたします。'
