- id: 49888cbf-60c7-53bf-ba28-5fc4e8ebe059
  title: キャッシング：お申込みとご利用開始
  body: 'キャッシングのご利用を開始するための手順をご案内いたします。本サービスは、お客様の安定した生活基盤を維持するため、適切な審査を経て提供しております。


    【お手続きの流れ】

    1. ご本人確認

    まず、お客様の「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認いたします。


    2. ご利用希望額の提示

    キャッシングのご利用を希望される旨と、おおよその希望金額をお伝えください。


    3. 審査の実施

    弊社にて、年収や生活維持費、および他の貸金業者からの借入状況を確認いたします。貸金業法の「総量規制」に基づき、原則として年収の3分の1までの範囲で利用可能枠を算定します。


    4. 利用可能枠の決定と通知

    審査の結果、キャッシング利用可能枠（最大500,000円まで）が決定いたします。決定した枠の範囲内で、ATM等から現金をお引き出しいただけます。


    審査基準の詳細については、「キャッシング：お申込みいただける方」をご確認ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 624beaac-b2a7-541d-a34b-2f1837331f03
  title: キャッシング：手数料一覧
  body: 'キャッシングサービスのご利用に伴う手数料は以下の通りです。本手数料は、サービスの維持およびATMネットワークの利用実費として設定しております。


    ■ATM利用手数料

    ・1万円以下の引き出し：110円

    ・1万円超の引き出し：220円


    ※上記手数料は、1回のATM操作ごとに発生いたします。

    ※金利（実質年率18%）は別途、借入残高に対して発生いたします。'
