- id: 22725985-62d8-55b6-949c-8003e9c99137
  title: つむぎカードローン：お手続きが完了しない・保留中のまま
  body: 'つむぎカードローンのお申込み手続きが完了せず、「審査中」や「保留」の状態が続いている場合に考えられる原因と対処法をご案内します。


    【よくある原因】

    1. 必要情報の不足：年収や勤務先などの入力内容に不備があり、審査部門で確認事項が発生している。

    2. 本人確認書類の不備：ご提出いただいた書類の記載内容と、お申込み時の情報に相違がある。

    3. 審査の混雑：お申込み件数の増加により、通常よりも審査にお時間をいただいている。


    【ご確認と対処の手順】

    1. 登録情報の再確認：お伝えいただいたフルネーム、生年月日、および年収等の情報に誤りがないか、改めて担当者にご確認ください。

    2. 追加情報の提供：当行から追加の証明書類（所得証明書など）の提出を依頼している場合は、速やかにご提示をお願いいたします。

    3. 状況の照会：お手続きから3営業日以上経過している場合は、現在の審査ステータスを担当者が確認いたします。


    【エスカレーションについて】

    担当者による確認で解決しない場合や、審査結果について詳細な説明が必要な場合は、専門の審査部門またはコンプライアンス担当へ案件をエスカレーションし、精査いたします。その後の進捗状況については、定期的に丁寧にご報告させていただきます。'
