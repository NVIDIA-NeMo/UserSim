- id: 24ddec24-432b-5339-822f-ef55a56d8383
  title: つむぎカードローン：リスクについてのご説明
  body: 'つむぎカードローンのご利用にあたり、以下のリスクと法的制限について十分にご理解ください。


    ■利息負担のリスク

    本商品は借入に対する金利（4.5% ～ 18%）が発生します。特に最低返済額（4,000円）のみの返済を続けると、元金の減少が遅くなり、最終的な支払総額が当初の想定よりも増える可能性があります。余裕がある際は繰上返済を行い、利息負担を軽減することをお勧めします。


    ■総量規制について

    貸金業法に基づき、貸金業者からの借入れの合計額は、原則として年収の3分の1までと制限されています。この制限を超える借入れは原則としてできません。無理な借入は生活基盤を不安定にするため、返済能力に基づいた適正な利用をお願いいたします。


    ■信用情報への影響

    本商品の利用および返済状況は、指定信用情報機関に登録されます。万が一、返済が遅延した場合は、信用情報に記録され、今後他社を含めローンやクレジットカードの審査に影響を及ぼす可能性があります。


    ■ご相談のお願い

    万が一、ご自身の経済状況の変化により返済が困難になった場合は、放置せず早めにご相談ください。誠実な対応に基づき、返済条件の見直しについて検討いたします。'
