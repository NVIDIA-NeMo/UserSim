    年4.5% 〜 年18%

    ※お客さまの審査結果に基づき決定されます。


    ■毎月の最低返済額

    4,000円

    ※借入残高に応じて設定されますが、最低として月々4,000円からの返済となります。


    ■その他手数料

    ・融資実行手数料：無料

    ・繰上返済手数料：無料


    本商品のコストは、主に借入残高に対して課される貸付金利となります。繰上返済を行うことで、お支払いいただく利息総額を軽減することが可能です。'
