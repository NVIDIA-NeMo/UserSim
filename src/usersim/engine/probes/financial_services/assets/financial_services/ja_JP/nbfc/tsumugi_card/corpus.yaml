- id: 078cb225-6b19-59f2-8b14-4732a7b2462b
  title: 分割払い：お取引が拒否された・制限された
  body: 'お買い物時に「分割払い」を選択したが、決済が拒否された場合の確認事項と解決策をご案内します。


    【考えられる原因】

    1. 支払可能見込額の制限：割賦販売法に基づき設定された「支払可能見込額」を、今回の利用分を含めて超えてしまう場合、分割払いの利用が制限されます。

    2. 利用可能枠の不足：ショッピング全体の利用可能枠が不足している可能性があります。

    3. 店舗側の未対応：ご利用の販売店が分割払いの決済に対応していない場合があります。

    4. カードの状態：カードの有効期限切れや、セキュリティ上の理由で一時的に利用制限がかかっている可能性があります。


    【確認と解決の手順】

    ・まず、現在のショッピング利用可能枠に十分な余裕があるかをご確認ください。

    ・ご本人確認（フルネームと生年月日）の上、私たちに「分割払いが利用できなかった理由」をお問い合わせください。枠の不足や制限がある場合は、審査部門へエスカレーションし、現在の状況を調査いたします。


    【解決の目安】

    原因が枠不足である場合は、他のお支払い方法（1回払いなど）への変更、または繰上返済による枠の回復をご検討ください。'
