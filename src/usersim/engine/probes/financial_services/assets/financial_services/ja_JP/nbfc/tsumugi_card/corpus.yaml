- id: 97a7dc7e-2241-5bc8-8d3d-344856c79063
  title: つむぎカード：ログインできない・アクセスできない
  body: '会員ページにログインできない、またはページにアクセスできない場合の対処法をご案内いたします。


    ■よくある症状と原因

    ・「IDまたはパスワードが正しくありません」と表示される

    　→ 入力内容の間違いや、大文字・小文字の区別が正しくない可能性があります。

    ・ページが読み込まれない、またはタイムアウトになる

    　→ 通信環境の不安定さや、弊社システムの一時的なメンテナンスが原因と考えられます。


    ■確認していただく順番

    1. 入力情報の再確認：半角英数字で正しく入力されているか、不要なスペースが入っていないかをご確認ください。

    2. 通信状態の確認：Wi-Fiの切り替えや、機内モードのオン・オフを試して、インターネット接続が安定しているか確認してください。

    3. システム状況の確認：弊社Webサイトの「お知らせ」欄で、システムメンテナンスが行われていないかをご確認ください。


    ■解決しない場合の対応

    上記を確認してもログインできない場合は、弊社にてアカウントの状態を確認いたします。本人確認（フルネームと生年月日）の後、パスワードの再設定などのサポートをさせていただきます。担当者が状況を確認し、必要に応じて専門の技術部門へエスカレーションして対応いたします。'
