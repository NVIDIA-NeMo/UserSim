- id: 98619de7-7769-5590-8dc4-efce58ffa3b1
  title: つむぎカードローン：規定・約款の変更
  body: 'つむぎカードローンのご利用にあたり、適用される規定および約款についてご説明いたします。本契約は、お客様と当社の間での誠実な合意に基づくものです。


    ■金利および返済に関する義務

    お客様は、ご契約時に設定された貸付金利（下限4.5%から上限18%）に基づき、元本および利息を期限通りに支払う義務を負います。また、毎月の最低返済額として4,000円を支払っていただく必要があります。返済が困難な状況になった場合は、速やかに当社へご相談ください。


    ■利用限度額の遵守

    利用可能枠は、割賦販売法および貸金業法に基づき、お客様の年収や生活維持費等の支払能力を調査したうえで決定されます。最大で5,000,000円まで設定されますが、総量規制（年収の3分の1まで）などの法令を厳格に遵守します。


    ■規定・約款の変更について

    法令の改正や経済状況の変化に伴い、当社は規定・約款を変更することがあります。変更を行う場合は、事前にお客様へ通知し、同意をいただくプロセスを経て適用いたします。


    ■契約の終了

    以下の場合は、本契約が終了し、残債の一括返済を求めることがあります。

    *   お客様による解約申請があったとき

    *   支払能力に著しい変化が生じ、返済が困難と判断されたとき

    *   重大な規約違反が認められたとき


    詳細は、最新の約款をご確認ください。'
