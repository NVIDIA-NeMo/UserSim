- id: cf1cb4b2-733f-50d7-9ccd-952cf774a730
  title: つむぎカードローン：利用限度額の上限について
  body: '【よくあるご質問】


    Q：利用限度額は最大でいくらまで設定できますか？

    A：つむぎカードローンの利用限度額の上限は5,000,000円です。ただし、すべての方にこの金額が適用されるわけではなく、個別の審査に基づき決定いたします。


    Q：限度額はどのように決まりますか？

    A：貸金業法等の法令に基づき、お客様の年収、生活維持費、現在の借入状況などを踏まえた「支払可能見込額の調査」を行い、無理のない返済計画が可能である範囲で設定いたします。


    Q：年収による制限はありますか？

    A：はい。貸金業法の「総量規制」により、原則として貸金業者からの借入合計額は年収の3分の1までと制限されています。このルールに基づき、適正な利用枠をご案内しております。'
