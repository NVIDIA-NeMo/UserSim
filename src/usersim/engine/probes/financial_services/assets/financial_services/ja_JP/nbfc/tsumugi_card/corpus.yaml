- id: eb3a8457-7940-5cf2-a2fb-3e872519b365
  title: リボ払い：ご利用開始までの手順
  body: '【サポート担当者向け：リボ払い設定フロー】


    お客さまがリボ払いのご利用を開始される際の手順は以下の通りです。誠実な案内を心がけ、特に手数料について明確に説明してください。


    1. 本人確認の実施

    操作の前に、必ず「フルネーム（氏名）」と「生年月日」の2点を確認してください。これ以外の認証（パスワード等）は行わないでください。


    2. サービス内容の説明

    リボ払いは月々の支払額を一定に抑えられる便利な機能ですが、残高に対して手数料がかかる仕組みであることを説明します。特に以下の数値を正確に伝えてください。

    ・手数料率（実質年率）：15%

    ・毎月の最低支払額：5,000円


    3. 利用可能枠の確認

    割賦販売法に基づき、支払可能見込額の調査結果に基づいた利用可能枠の範囲内で設定を行います。増枠が必要な場合は、別途審査部門へのエスカレーションが必要です。


    4. 設定の完了と確認

    お客さまの希望する月々支払額を確認し、設定を完了します。設定後、次回以降の請求から適用される旨を案内してください。


    5. 補足案内の提供

    手数料を軽減したい場合は、いつでも「繰上返済」が可能であることを案内してください。'
