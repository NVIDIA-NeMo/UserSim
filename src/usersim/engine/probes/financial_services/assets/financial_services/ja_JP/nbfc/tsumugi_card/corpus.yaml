- id: c0609f9d-7abc-524c-a4e5-bc411a05a12f
  title: リボ払い：登録内容の変更
  body: 'リボ払いの月々支払額などの登録内容を変更する手順をご案内します。


    ■準備するもの

    特に書類は必要ありません。ご本人様が直接お問い合わせください。


    ■変更の手順

    1. 本人確認

    まず、ご本人様確認のため「フルネーム（氏名）」と「生年月日」をお伝えください。


    2. 変更内容の提示

    「リボ払いの月々支払額を変更したい」旨を当社にお伝えください。現在設定されている金額と、新しく希望される金額をご提示いただきます。


    3. 条件の確認

    ご希望の金額が、リボ払いの最低支払額である5,000円以上であることを確認いたします。5,000円未満への変更は承れませんのでご了承ください。


    4. 設定の変更と完了通知

    当社にて変更処理を行い、完了した旨を回答いたします。これにより、次回の請求サイクルから新しい支払額が適用されます。


    ■完了の確認方法

    お手元に届く次回の請求明細書にて、支払額が変更されていることでご確認いただけます。'
