  institution_id: tsumugi_card
- id: dc70fba8-330d-5966-8110-0d3269e37d45
  title: キャッシング：ATM利用手数料（1万円以下）について
  body: '【ご質問】

    ATMで1万円以下のお金を引き出す場合、手数料はいくらかかりますか？


    【回答】

    1万円以下のお引き出しの場合、ATM利用手数料は110円となります。


    なお、1万円を超える金額をお引き出しになる場合は、手数料が220円に変わりますのでご注意ください。手数料は、サービスの維持および向上に必要な実費として設定しております。


    その他の手数料や金利の詳細については、「キャッシング：手数料一覧」または「キャッシング：金利・料率一覧」をご参照ください。'
