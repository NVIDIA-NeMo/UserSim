- id: 7091220e-594d-51d0-87a2-1fcc45bf44c2
  title: つむぎカードローン：ご紹介・継続利用の特典
  body: '【ご紹介・継続利用キャンペーンのご案内】


    いつもつむぎカードをご利用いただき、誠にありがとうございます。このたび、多くのお客様に「つむぎカードローン」の利便性を知っていただくため、特別な特典をご用意いたしました。


    ■キャンペーン期間

    2026年1月1日から2026年3月31日まで


    ■ご紹介特典

    ご友人やご家族に本サービスをご紹介いただき、ご紹介された方がご契約に至った場合、ご紹介者様とご成約者様の両方に、次回のご利用時に活用いただける1,000円相当の特典を差し上げます。


    ■継続利用特典

    一定期間、健全なご利用とご返済を継続していただいたお客様には、審査に基づき、貸付金利（下限）4.5%への適用見直しを個別に検討させていただきます。


    誠実なご利用を通じて、より安心な金融ライフをサポートいたします。詳細はお問い合わせください。'
