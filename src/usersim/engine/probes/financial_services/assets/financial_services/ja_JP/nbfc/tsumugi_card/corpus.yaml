- id: abbe9010-6dda-5f91-a3c3-2956d3e2b5b2
  title: リボ払い：実施中のキャンペーン
  body: '【キャンペーン内容】リボ払い切り替え応援キャンペーン


    日々の決済をより柔軟にするため、リボ払いへの切り替えを応援する特典をご用意いたしました。


    - **特典内容**：期間中に初めて「全回リボ設定」または「あとからリボ」へ変更されたお客様に、500ポイントをプレゼントいたします。

    - **実施期間**：2024年4月1日から2024年6月30日まで

    - **適用条件**：キャンペーン期間中に設定を完了し、その後1回以上のショッピング利用があること。


    ※リボ払いの手数料（実質年率15%）および最低支払額（5,000円）などの基本条件に変更はございません。


    設定方法は「リボ払い：お申込みとご利用開始」をご確認ください。'
