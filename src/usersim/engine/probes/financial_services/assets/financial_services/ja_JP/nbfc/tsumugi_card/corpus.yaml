- id: 02c2c3c3-4978-5e53-876b-3c420a02d337
  title: キャッシング：重要事項のご説明
  body: '本サービスのご利用にあたり、以下の法令および重要事項についてあらかじめご了承ください。


    【法令遵守について】

    当社のキャッシングは、金融庁の監督のもと、貸金業法および利息制限法を厳格に遵守して運営しております。


    【総量規制について】

    貸金業法に基づき、お客様が貸金業者から借入できる合計額は、原則として年収の3分の1までに制限されています。この制限を超えて利用可能枠を設定することはできません。


    【金利および限度額】

    ・キャッシングの金利（実質年率）：18%

    ・キャッシング利用可能枠の上限：500,000円

    ※金利は利息制限法の上限範囲内で設定されており、遅延損害金の上限は年20%となります。


    【信用情報への登録】

    本サービスのご利用状況および返済状況は、指定信用情報機関に登録されます。適切に管理されることで、健全な信用環境の維持に寄与いたします。


    【誠実義務】

    弊社は、お客様の属性と返済能力に照らして適切であるかという基準に基づき、誠実にご案内いたします。融資の承認を確約するものではありませんのでご了承ください。


    金利の詳細については「キャッシング：金利・料率一覧」をご覧ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: disclosure
  source_authority: official
  placeholder: true
