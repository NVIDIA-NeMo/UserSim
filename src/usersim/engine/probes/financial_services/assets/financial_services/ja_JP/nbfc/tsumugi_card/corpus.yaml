  institution_id: tsumugi_card
- id: 46bcbfca-7beb-5f68-8710-54440d1f2ce5
  title: 分割払い：明細や記録と合わない
  body: 'お客様から「分割払いの月々の請求額が、想定していた金額よりも高い」といったお問い合わせをいただいた際の対応手順です。


    【考えられる原因】

    1. 手数料の加算：分割払いは元金に加えて手数料が発生します。実質年率12%から15%の範囲内で計算されるため、単純な割り算（利用金額÷回数）よりも請求額が高くなります。

    2. 初回請求額の調整：分割回数によっては、初回請求分に端数調整が含まれ、2回目以降より高くなる場合があります。

    3. 適用利率の相違：お客様が想定していた利率と、実際に適用されている利率が異なっている可能性があります。


    【確認と解決の手順】

    ・まず、お客様に「分割払いでは手数料がかかること」を丁寧にご説明し、適用されている実質年率（12%～15%）を確認してください。

    ・具体的な計算根拠を提示し、明細の内容と一致するかを照合します。


    【エスカレーション】

    計算上の誤りが疑われる場合、またはお客様が納得されない場合は、速やかにコンプライアンス担当または専門の審査部門へエスカレーションし、再調査を依頼してください。調査結果は定期的かつ透明性を持ってお客様へ報告します。'
