- id: 2bc363fd-0347-571c-b5c1-9d734af26e59
  title: キャッシング：安全にご利用いただくためのポイント
  body: 'つむぎカードを安全にご利用いただくために、以下のセキュリティポイントを必ずご確認ください。


    ■なりすまし・不正利用を防ぐために

    キャッシング機能は、カード番号と暗証番号で即座に資金を引き出せる便利な機能である一方、悪意のある第三者に情報を知られた場合、大きな被害につながる恐れがあります。暗証番号は他の方に教えず、定期的に変更することを強く推奨いたします。


    ■つむぎカードがお伺いすること・しないこと

    当社では、本人確認が必要な操作の前に、必ず「フルネーム（氏名）」と「生年月日」の2点を確認させていただきます。

    一方で、以下の情報は、いかなる場合（電話、メール、チャット等）であっても、当社社員がお伺いすることはございません。

    ・カード番号、CVV（セキュリティコード）

    ・暗証番号、ログインパスワード

    ・身分証明書の番号


    もし、これらの情報を聞き出そうとする連絡があった場合は、詐欺の可能性が非常に高いため、すぐにお電話を切ってください。


    ■万が一の疑いがあるとき

    身に覚えのない利用通知が届いた場合や、カードを紛失した場合は、直ちに利用停止手続きを行ってください。迅速な報告により、規約に基づいた補償を適用することが可能です。詳しい手続きは「キャッシング：商品概要」をご確認ください。'
