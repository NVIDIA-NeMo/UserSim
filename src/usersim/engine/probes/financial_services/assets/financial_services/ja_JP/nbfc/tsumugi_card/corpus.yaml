- id: 47892796-d5fd-5a29-b0bd-09c2ddeefc66
  title: リボ払い：個人情報の取扱い
  body: 'つむぎカードのリボ払いサービスをご利用いただく際、お客さまの個人情報は以下の通り厳格に管理されます。


    ■信用情報機関への登録

    貸金業法および割賦販売法に基づき、リボ払いの利用限度額、利用残高、および支払状況などの情報は、指定信用情報機関に登録されます。これは、過剰な借入を防止し、健全な信用環境を維持するための法的義務に基づくものです。


    ■利用目的

    ご提供いただいた個人情報は、以下の目的のみに使用いたします。

    ・支払可能見込額の調査および利用可能枠の設定

    ・ご請求金額の計算および回収業務

    ・法令に基づく当局への報告


    ■情報の第三者提供

    法令に基づく場合を除き、お客さまの同意なく第三者に個人情報を提供することはありません。


    ■お問い合わせについて

    ご自身の登録情報の確認や修正を希望される場合は、当社までご連絡ください。本人確認として「フルネーム（氏名）」と「生年月日」を確認させていただきます。


    当社は、経済産業省および金融庁の規制を遵守し、透明性の高い情報管理に努めております。'
  domain: payments
  product_category: ribo_barai
  document_type: disclosure
  source_authority: official
