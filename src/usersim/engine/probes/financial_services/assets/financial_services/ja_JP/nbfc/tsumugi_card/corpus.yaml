- id: 53709ed9-9ce7-5d35-973a-6dca7a654646
  title: キャッシング：登録内容の変更
  body: 'ご住所やご連絡先など、ご登録内容の変更を希望される場合は、以下の手順で手続きを行います。


    ■お手続きの前に

    ご本人様確認のため、お手元にカードをご用意ください。


    ■変更の手順

    1. 本人確認の実施

    まず、お客様に「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認いたします。※暗証番号やパスワードはお伺いいたしませんのでご注意ください。


    2. 変更内容の提示

    変更したい項目（例：引越による住所変更、電話番号の変更など）と、新しい情報を正確にお伝えください。


    3. 必要書類の確認と提出

    変更内容によっては、ご住所を確認できる公的書類（住民票や運転免許証など）の提示が必要となる場合がございます。その際は、当社から指定する方法で書類をご提出ください。


    4. 変更完了の通知

    当社にて内容を確認し、登録情報の更新が完了いたします。完了後、確定した内容を改めてお客様へご案内いたします。


    登録内容が正しく更新されることで、重要な通知が適切に届き、キャッシングサービスを安全にご利用いただけます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e8171f47-582d-5e7a-b8e4-b3072d53f148
  title: キャッシング：ログインできない・アクセスできない
  body: 'キャッシングの利用状況確認などのため、アカウントへのアクセスを試みたがログインできない場合、以下の手順でご確認と対応をお願いいたします。


    ■考えられる原因

    ・IDまたはパスワードの入力間違い

    ・パスワードの有効期限切れ、またはロック状態

    ・システムメンテナンスによる一時的な停止


    ■確認と解決の手順

    1. 入力内容の再確認

    大文字・小文字の区別や、不要なスペースが入っていないかをご確認の上、再度お試しください。


    2. 本人確認によるロック解除

    繰り返しログインに失敗し、アカウントがロックされた場合は、当社にて本人確認を行います。お客様の「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認した後、ロックを解除いたします。※この際、パスワードそのものを聞き出すことはございません。


    3. パスワードの再設定

    パスワードを忘れた場合は、本人確認を経て、新しいパスワードを設定するための案内をいたします。


    ■解決しない場合

    上記を試してもアクセスできない場合は、個別の状況を確認するため、専門の担当者が調査いたします。調査の結果、アカウントの状態や解決策について改めてご報告させていただきます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 16a11a1d-b285-5703-939e-80f490adc57a
  title: キャッシング：ご利用条件による違い
  body: 'キャッシングサービスの利用可能枠は、お客様の属性と返済能力に基づき、以下の基準で決定いたします。


    | ご利用条件 | 判定結果・適用内容 |

    | :--- | :--- |

    | 支払可能見込額の調査結果 | 審査に基づき、個別に利用可能枠を設定（最大500,000円） |

    | 貸金業法（総量規制）の適用 | 年収の3分の1を超える借入がある場合、原則として利用不可 |

    | 信用情報機関の登録状況 | 健全な信用環境が確認できない場合、利用可能枠の制限または不可 |

    | 年収および生活維持費 | 余裕を持った返済計画が立てられる額を上限として設定 |


    ※すべての設定は、法令を厳格に遵守して行われます。審査の結果、ご希望の金額に届かない場合や、ご利用いただけない場合がございます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 7a0c076c-941a-5c33-a279-102516b96ff5
  title: キャッシング：プランの選び方
  body: 'お客様の資金ニーズに合わせて、「キャッシング」と「つむぎカードローン」を使い分けてください。


    ■キャッシング（本サービス）

    ・特徴：ATMで即座に現金を引き出せる、短期的な少額融資に最適です。

    ・金利：実質年率18%

    ・限度額：最大500,000円

    ・向いている方：急に数万円程度の現金が必要になり、すぐに返済できる方。


    ■つむぎカードローン

    ・特徴：より大きな金額を、余裕を持った返済計画で借りられる低利の融資商品です。

    ・向いている方：まとまった資金が必要で、月々の返済額を抑えて長期的に計画的に返済したい方。


    「利便性とスピード」を重視される場合はキャッシングを、「低コストと返済のゆとり」を重視される場合はカードローンをご検討ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: f3ce42d7-fd31-51f4-8f28-78db5b4259d8
  title: キャッシング：個人情報の取扱い
  body: 'つむぎカードでは、お客様からお預かりした個人情報を、法令に基づき適切に管理し、以下の目的で利用いたします。


    ■利用目的

    キャッシングサービスの提供にあたり、以下の目的で個人情報を利用します。

    ・ご本人様の確認（フルネーム、生年月日等による認証）

    ・貸金業法および割賦販売法に基づく支払可能見込額の調査および審査

    ・ご契約内容の管理、および返済状況の確認

    ・法令に基づく当局への報告


    ■指定信用情報機関への登録

    当社は、健全な信用環境を維持するため、貸金業法等に基づき、お客様の借入状況や返済履歴を指定信用情報機関に登録し、また同機関から情報を参照いたします。これにより、過剰借入を防止し、お客様の適切な支払能力の範囲内での利用をサポートいたします。


    ■第三者提供の制限

    法令に基づく場合や、専門の審査部門へのエスカレーションなど、サービスの提供に不可欠な場合を除き、お客様の同意なく個人情報を第三者に提供することはございません。


    ■お客様の権利

    ご自身の登録情報の開示や訂正を希望される場合は、所定の手続きを経て対応させていただきます。詳細は「キャッシング：登録内容の変更」をご参照ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b81caba7-da54-5628-bf1c-58dd8fd61b44
  title: キャッシング：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードのキャッシングサービスをかたる、巧妙な詐欺へのご注意をお願いいたします。最近、当社の名前を騙り、「特別な低金利で融資が可能になった」や「至急の審査手続きが必要」といった内容のメールやSMSを送信し、不正に個人情報を取得しようとする事例が報告されています。


    【特にご注意いただきたい点】

    ・つむぎカードが、メールやSMSで「金利の特別値下げ」を案内し、外部サイトへの誘導や個人情報の入力を求めることはございません。

    ・審査の結果を伝えるために、暗証番号やパスワードを伺うことは絶対にございません。


    【つむぎカードが絶対にお聞きしない情報】

    ・カードの暗証番号（PIN）

    ・カード裏面のセキュリティコード（CVV）

    ・Webサービスのパスワード

    ・身分証明書の番号


    もし、不審な連絡を受け、不安に感じられた場合は、すぐにでも当社のサポート窓口までお知らせください。また、万が一情報を伝えてしまった可能性がある場合は、迅速に利用停止の手続きを行い、被害を最小限に抑える必要があります。不審な点がある際は、独断で判断せず、まずは当社の正規窓口へご確認をお願いいたします。'
  domain: lending_mortgage
  product_category: cashing
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1aa961a6-cd54-5f69-a47a-5bdbae495a0f
  title: キャッシング：限度額・制限と注意事項
  body: 'キャッシングサービスのご利用における限度額および制限事項についてご案内します。本サービスは、短期的かつ急な資金ニーズにお応えするための少額融資です。


    【利用限度額と制限】

    ・キャッシング利用可能枠の上限：最大500,000円

    ・適用金利：実質年率18%


    【重要な注意事項】

    ・総量規制について：貸金業法に基づき、当社のキャッシングを含む貸金業者からの借入れ合計額は、原則として年収の3分の1までと制限されております。この制限を超えるご利用枠の設定はできません。

    ・支払可能見込額の調査：ご利用可能枠の設定にあたっては、お客さまの年収や生活維持費等を踏まえ、適切に返済能力を審査させていただきます。

    ・審査による制限：審査の結果、最大上限の500,000円に満たない金額が利用可能枠として設定される場合がございます。


    本サービスは利便性が高い一方で、金利（実質年率18%）が発生するため、計画的なご利用をお願いいたします。返済が困難になったと感じられた場合は、お早めに当社までご相談ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bdc7e33c-8d27-52c4-8186-ce584f586c78
  title: キャッシング：ATM利用手数料（1万円超）について
  body: '【ご質問】

    ATMでキャッシングを利用する際、1万円を超える金額を引き出す場合の手数料はいくらになりますか？


    【回答】

    1万円を超える金額を引き出す場合のATM利用手数料は、1回につき220円となります。


    なお、1万円以下の金額を引き出す場合は、手数料が110円となります。引き出し金額によって手数料が異なりますので、ご利用の際はご注意ください。


    詳細については「キャッシング：手数料一覧」をご参照ください。'
  domain: lending_mortgage
