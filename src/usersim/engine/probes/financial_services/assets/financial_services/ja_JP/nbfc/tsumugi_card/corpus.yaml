- id: fc4f8a57-4164-5768-8bec-332a23697d84
  title: 分割払い：規定・約款の変更
  body: '本規定は、つむぎカードが提供する「分割払い」サービスの利用条件および約款の変更に関する事項を定めたものです。お客様は本サービスを利用することで、以下の条件に同意したものとみなされます。


    ■基本合意事項

    ・分割払いの手数料率は、実質年率で下限12%、上限15%の範囲内で設定されます。個別の適用利率はお客様の審査結果に基づきます。

    ・分割払いの最大支払回数は24回までとします。

    ・お客様は、設定された利用可能枠の範囲内で、誠実に支払義務を履行するものとします。


    ■約款の変更について

    ・法令の改正、経済情勢の変化、またはサービス向上のため、当社は本規定および約款を変更することがあります。

    ・変更を行う場合は、あらかじめ当社ウェブサイトまたは書面にて告知いたします。告知後、一定期間が経過した後に利用された場合は、変更後の規定に同意したものとみなされます。


    ■契約の終了

    ・カードの解約、または支払能力の著しい低下が認められた場合、分割払いを含むすべての利用枠が停止されることがあります。


    本サービスを他社サービスと比較検討される際は、「分割払い：プランの選び方」をご参照ください。'
