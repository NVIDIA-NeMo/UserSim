- id: 4e9adae9-1d66-511a-9c59-12d841da523a
  title: 分割払い：ログインできない・アクセスできない
  body: '「あとから分割」への変更手続きなどを、オンライン上で行おうとした際にログインできない、または画面にアクセスできない場合の対処法です。


    ■考えられる原因と対処法

    1. IDまたはパスワードの入力誤り

    ・大文字・小文字、全角・半角が正しく入力されているか再度ご確認ください。特に「0（ゼロ）」と「O（オー）」などの間違いが多く見られます。


    2. セッションタイムアウト

    ・セキュリティ保護のため、一定時間操作がない場合は自動的にログアウトされます。再度最初からログインをお試しください。


    3. 本人認証の不一致

    ・登録されている情報と入力内容が異なる場合、アクセスが制限されます。


    ■解決しない場合の対応

    上記を試しても解決しない場合は、当社オペレーターまでご連絡ください。以下の流れで解決をサポートいたします。

    ・まず「フルネーム（氏名）」と「生年月日」による本人確認を行います。

    ・アカウントの状態を確認し、パスワードの再設定手続きや、アクセス制限の解除を行います。

    ・解決後、改めてログインできることを確認していただきます。


    もし、想定外の手数料が表示されているなどの問題がある場合は、「分割払い：想定外の手数料・金額」をご確認ください。'
