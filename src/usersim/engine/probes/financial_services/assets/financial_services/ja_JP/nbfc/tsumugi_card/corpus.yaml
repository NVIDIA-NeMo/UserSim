  body: "【ご質問】\nキャッシングを利用する際にかかる主な費用について教えてください。\n\n【回答】\n主に「利息」と「ATM利用手数料」の2点がございます。\n\
    \n1. 利息：実質年率18%として、借入残高に対して発生いたします。\n2. ATM利用手数料：\n   ・1万円以下の引き出し：110円\n   ・1万円超の引き出し：220円\n\
    \nこれらの費用は、サービスの維持および信用リスク管理のための実費として設定させていただいております。詳細な計算方法や料金表については「キャッシング：手数料一覧」をご確認ください。"
