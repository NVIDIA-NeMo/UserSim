- id: 4b8196e9-c4c5-5bc2-a203-846d1df7846e
  title: 分割払い：想定外の手数料・金額
  body: '顧客から「分割払いの手数料が予想より高い」「請求金額が想定と違う」という問い合わせを受けた際の対応フローです。


    ■ 確認すべき症状

    ・月々の請求額が、顧客の計算していた金額より高い。

    ・支払総額に、想定していなかった手数料が含まれている。


    ■ 原因の切り分けと確認事項

    1. 支払回数の確認：設定した回数が、顧客の意向と異なっていないか確認してください（最大24回まで）。

    2. 手数料率の確認：適用されている実質年率が12%から15%の範囲内にあるか確認してください。

    3. 計算方法の誤解：実質年率は「元金残高」に対してかかります。初期の支払額には、比較的多くの手数料が含まれることを説明してください。


    ■ 解決策の提示

    ・計算根拠の提示：利用金額100円あたり2.01円（3回払いの場合）などの具体例を挙げ、手数料の算出根拠を丁寧に説明してください。

    ・繰上返済の提案：支払総額を減らしたい場合は、繰上返済によって手数料を軽減できることを案内してください。


    ■ エスカレーション基準

    ・システム上の計算不備が疑われる場合、または顧客が販売店とのトラブルを理由に「支払停止の抗弁」を申し出た場合は、速やかにコンプライアンス担当または専門の審査部門へエスカレーションしてください。'
