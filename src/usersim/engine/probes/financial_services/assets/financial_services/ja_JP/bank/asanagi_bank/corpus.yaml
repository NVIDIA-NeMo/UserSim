- id: 050aa692-69ef-5c27-a8a4-66887f0118a5
  title: open_time_deposit を使う場面
  body: '## 概要

    お客様が、普通預金の資金を利用して「スーパー定期」を新規に作成したい場合にこの手続きを行います。確実な資産形成を目的とした預入をサポートします。


    ## 手続き手順

    1. **本人確認の実施**: `verify_identity`を呼び出し、お客様のフルネームと生年月日を確認します。

    2. **口座情報の照会**: `get_accounts`を使用して、資金元となる普通預金口座の`account_id`を確認し、預入希望額以上の残高があるかを確認します。

    3. **条件の確認**: お客様から、預け入れる金額（円）および預入期間（年または月）を確認します。

    4. **ツールの実行**: 確認した内容に基づき、`open_time_deposit`を呼び出して定期預金口座を開設します。


    ## 注意点

    - 普通預金から資金が即時に引き落とされることをお客様に説明してください。

    - 詳細な金利については、「スーパー定期：金利・料率一覧」をご案内ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_time_deposit
  institution_id: asanagi_bank
- id: 70e53027-4527-5696-aceb-fddc686e0dfb
  title: open_time_deposit ツールリファレンス
  body: "## 概要\n普通預金口座から指定した金額を、指定した期間の「スーパー定期」として預け入れます。\n\n## ツール仕様\n- **ツール名**:\
    \ `open_time_deposit`\n- **引数**: \n    - `account_id`: 資金元となる普通預金口座の識別子。\n   \
    \ - `amount`: 預入金額（円）。\n    - `period`: 預入期間（例：1年、3年など）。\n\n## 動作とエージェントの役割\n\
    エージェントはこのツールを直接呼び出すことで、普通預金から定期預金への資金移動と口座開設を同時に行います。お客様に手続きを委ねるのではなく、対話の中で完結させます。\n\
    \n本ツールの実行前に、`verify_identity`による本人確認が完了している必要があります。引数にパスワードや暗証番号を必要としません。"
