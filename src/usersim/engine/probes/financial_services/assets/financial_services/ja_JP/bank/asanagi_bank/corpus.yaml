- id: d86c2c81-34ae-5e45-829a-96d42f61a05c
  title: 普通預金：他行あて振込手数料（インターネットバンキング）について
  body: '【質問】インターネットバンキングを使って他の銀行へ振り込む場合、手数料はいくらかかりますか？


    【回答】他行あて振込手数料（インターネットバンキング）は、1回につき220円となります。手数料は振込時に口座残高から即時に引き落とされます。


    なお、当行をメインバンクとしてご利用いただき、「給与・年金受取特典」をご利用のお客様は、条件に応じて手数料の無料枠などが適用される場合がございます。詳細は「給与・年金受取特典：商品概要」をご確認ください。'
