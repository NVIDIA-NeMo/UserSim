  institution_id: asanagi_bank
- id: d4fcc2e8-ffb3-5604-b6ee-90604050a9e9
  title: スーパー定期：規定・約款
  body: '本規定は、朝凪銀行が提供する「スーパー定期」の利用条件を定めるものです。サポート担当者は、お客様への案内時に以下の条項を遵守してください。


    1. 預入条件

    本商品の開設には、最低預入金額として1,000円が必要です。預入金額がこの金額に満たない場合は、お申し込みいただけません。


    2. 金利の適用

    適用金利は、預入期間（1年、3年、5年）に応じて約定されます。金利は預入時に確定し、満期まで適用されます。利息に対しては、所得税および復興特別所得税として20.315%の税金が課せられます。


    3. 中途解約について

    満期前に解約を希望される場合は、中途解約利率が適用されます。これは当初の約定金利よりも低い利率であり、預入期間に応じて適用される利率が異なります。解約手続きには適切な本人確認が必要です。


    4. 預金保険制度

    本商品は預金保険制度の対象です。当行が破綻した場合、預金保険機構により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    5. 契約の終了

    満期時の自動継続設定がない場合、またはお客様による中途解約により、本契約は終了し、元本および利息（税引後）が指定の普通預金口座へ払い戻されます。'
  domain: retail_banking
  product_category: super_teiki
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 129a8318-a8a2-540e-bbd2-05645bb95e64
  title: スーパー定期：おすすめの方と主な使い方
  body: '「スーパー定期」は、確実な資産形成を目指すお客様に最適な、期間に応じた金利を設定した定期預金です。日常的に利用する普通預金とは別に、まとまった資金を安全に運用したい場合にぜひご活用ください。


    ■このような方におすすめです

    ・将来のために、計画的に貯蓄を行いたい方

    ・元本を保証しつつ、普通預金よりも高い金利で運用したい方

    ・1,000円からの少額から資産形成を始めたい方


    ■選べる3つのプラン（金利）

    お客様のライフプランに合わせて、以下の期間からお選びいただけます。

    ・1年もの：金利 0.55%

    ・3年もの：金利 0.85%

    ・5年もの：金利 1.05%


    ■主なご利用方法

    1. 最低預入金額である1,000円以上の資金をご用意いただきます。

    2. ご希望の預入期間（1年、3年、5年）を選択し、預け入れを行います。

    3. 満期までお待ちいただくことで、約定した金利に基づいた利息を受け取ることができます。


    本商品は、地域に根ざした当行が提供する安心のサービスです。具体的なお申込み方法については、「スーパー定期：お申込みとご利用開始」をご参照ください。'
