- id: 36ba83be-7301-5147-923c-df17cadd8907
  title: スーパー定期：手数料と費用
  body: '【Q】スーパー定期の口座開設に手数料はかかりますか？


    A. いいえ、口座開設に伴う手数料はございません。最低預入金額の1,000円以上をご預金いただくことで、どなたでもお申し込みいただけます。


    【Q】受け取る利息から差し引かれる費用はありますか？


    A. はい。利息には20.315%（国税および地方税）の税金が課せられます。税引き後の金額がお客様の口座に加算されます。


    【Q】満期前に解約する場合、違約金などの手数料はかかりますか？


    A. 解約手数料としての費用はかかりませんが、適用される金利が当初の約定金利よりも低い「中途解約利率」となります。その結果、本来満期まで保有していた場合に比べて受取利息が少なくなりますのでご注意ください。'
