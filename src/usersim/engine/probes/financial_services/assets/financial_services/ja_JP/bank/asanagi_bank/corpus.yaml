- id: 1912a9d4-1db4-59c5-bcf8-97f0b3337edf
  title: 住宅ローン：よくあるお手続きの流れ
  body: '住宅ローンのお申込みからご融資までの一般的な流れをご案内いたします。


    【お手続きの流れ】

    1. ご相談・お申込み：ライフプランに合わせ、変動金利（1.375%）または固定金利（3.7%）などのプランを選択し、お申込みください。

    2. 本人確認と書類提出：フルネーム（氏名）と生年月日による本人確認を行い、所得証明書や物件資料などの必要書類をご提出いただきます。

    3. 返済能力の審査：金融庁の監督および銀行法に基づき、お客様の返済能力を適切に審査し、利用限度額（最大100,000,000円）を決定いたします。

    4. ご契約・ご融資：審査通過後、正式な契約手続きを行います。この際、借入金額に対する割合として2.2%の融資手数料が発生いたします。

    5. 実行：指定の口座に融資額が振り込まれ、お手続きが完了します。


    【完了の確認】

    ご契約後に発行される返済予定表にて、適用金利、返済期間、および毎月の返済額が正しく設定されていることをご確認ください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 8c95e233-0bbc-51e6-a594-2fc681665c50
  title: 住宅ローン：明細や記録と合わない
  body: 'お客様から「返済明細の金額が想定と異なる」または「記録と一致しない」とのご相談をいただいた際の確認手順です。


    【確認すべきポイント】

    1. 変動金利の更新タイミング：変動金利プランの場合、返済額の見直し間隔（年）は5年です。見直し時期に当たっている場合、金利変動により返済額が変更されます。なお、見直し後の返済額の上限は、見直し前の返済額に対する割合として125%までと定められています。

    2. 繰上返済の反映状況：インターネットで一部繰上返済（手数料0円）を行われた場合、処理タイミングによって明細への反映に時間がかかることがあります。

    3. 利息計算の差異：金利変更や返済日のずれにより、端数計算などの差異が生じていないか確認してください。


    【対応とエスカレーション】

    ・まずはお客様の返済予定表と最新の金利適用状況を照合してください。

    ・計算上の不一致が解消されない場合や、システム上のエラーが疑われる場合は、速やかに専門部署へエスカレーションし、詳細な元本・利息の再計算および履歴照会を行い、透明性のある回答を提示してください。'
