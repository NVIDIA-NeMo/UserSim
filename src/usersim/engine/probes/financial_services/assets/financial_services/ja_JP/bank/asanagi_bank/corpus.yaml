  body: "本ツールは、ペイジー（Pay-easy）を利用して、お客様の口座から税金や公共料金などの払込みを行うために使用します。エージェントは本ツールを直接呼び出すことで決済を完了させます。\n\
    \n【ツール仕様】\n- ツール名: pay_bill\n- 引数:\n    - 口座ID: 支払元となる普通預金口座の account_id\n   \
