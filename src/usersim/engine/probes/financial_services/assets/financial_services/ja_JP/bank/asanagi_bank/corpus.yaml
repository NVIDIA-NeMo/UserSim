- id: 5563a56f-1b59-5ccd-824b-664dedc4d4a8
  title: 普通預金：時間外のATM利用手数料について
  body: '【Q】時間外にATMを利用する場合、どのような手数料がかかりますか？

    【A】普通預金口座をご利用の場合、時間外のATM利用手数料として110円を申し受けます。


    【Q】時間外手数料を無料にする方法はありますか？

    【A】当行をメインバンクとしてご利用いただき、給与または年金の受取口座に設定していただいているお客様には、手数料無料枠などの特典を提供しております。詳細は「給与・年金受取特典：商品概要」をご覧ください。


    【Q】インターネットバンキングでの振込手数料は異なりますか？

    【A】はい。他行あて振込手数料（インターネットバンキング利用）は220円となっております。'
