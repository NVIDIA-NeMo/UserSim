  institution_id: asanagi_bank
- id: a7ee4b0d-cfa8-5d95-b764-ed13a3189daa
  title: 住宅ローン：想定外の手数料・金額
  body: 'お客様より「返済額や手数料が想定していた金額と異なる」とのご相談をいただいた際の確認事項です。


    【ケース1：月々の返済額が急に増えた】

    ・原因：変動金利プランをご利用の場合、5年ごとに返済額の見直しが行われます。金利上昇に伴い、見直し後の返済額が上昇している可能性があります。

    ・確認点：返済額の上限ルール（見直し前の返済額の125%が上限）が適用されているかを確認します。ただし、金利が大幅に上昇した場合は「未払利息」が発生している可能性があります。

    ・対応：返済計画の見直しが必要な場合は、速やかに担当部署へエスカレーションし、返済条件の変更を検討します。


    【ケース2：融資実行時に想定より多くの費用が引かれている】

    ・原因：融資手数料（借入金額の2.2%）が正しく適用されているかを確認します。

    ・確認点：借入金額に2.2%を乗じた金額が、実際の手数料として計上されているか照合します。

    ・対応：計算に誤りがある場合は、速やかに修正手続きを行います。


    【ケース3：繰上返済時に費用が発生した】

    ・原因：手続き方法による違いを確認します。

    ・確認点：インターネットでの一部繰上返済は0円ですが、窓口での手続きや全額繰上返済（完済）の場合は別途手数料が発生する場合があります。適用された手数料の項目を確認してください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 778ee551-4db0-5073-9651-4979d248c0d5
  title: 住宅ローン：必要書類
  body: '住宅ローンのお申込みおよび審査にあたり、以下の書類のご提出をお願いしております。


    | 確認事項 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポート等の公的証明書 | 有効期限内のもの |

    | 収入証明 | 源泉徴収票、確定申告書、または直近の給与明細書 | 直近1〜2年分 |

    | 物件確認 | 不動産売買契約書、重要事項説明書、登記事項証明書 | 物件の価格と権利関係を証明するもの |

    | その他 | 健康保険証、住民票の写し | 住所確認および加入状況の確認のため |'
