  institution_id: asanagi_bank
- id: 3fdc9cb0-ae1e-59fa-9076-e7e73a887dab
  title: スーパー定期：プランの選び方
  body: '「スーパー定期」では、お客様の資金計画に合わせて3つの期間プランをご用意しております。それぞれの特徴を比較し、最適なプランをお選びください。


    ■プラン別金利比較

    ・1年もの：0.55%（短期間で確実な運用をしたい方向け）

    ・3年もの：0.85%（中期的な資産形成を目指す方向け）

    ・5年もの：1.05%（長期的に高い金利を確保したい方向け）


    ■選び方のポイント

    ・【流動性を重視する場合】

    1年ものを推奨します。満期が早いため、資金の予定が不透明な場合でもリスクを抑えて運用できます。

    ・【収益性を重視する場合】

    5年ものを推奨します。期間が長い分、最も高い1.05%の金利を適用いただけます。


    いずれのプランも最低預入金額は1,000円からとなります。なお、満期前の解約には中途解約利率が適用されますので、余裕を持った期間設定をおすすめいたします。'
