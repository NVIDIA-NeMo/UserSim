- id: 800bf986-967d-56ef-bce7-32e442f4118f
  title: 朝凪カードローン：貸付金利（下限）について
  body: '**Q: 朝凪カードローンの貸付金利（下限）はいくらですか？また、どのように適用されますか？**


    A: 当商品の貸付金利（下限）は2%となっております。この金利は、お申込み時の審査において、お客様の信用状況や返済能力、および当行との取引実績などを総合的に判断し、適用される最低の利率です。


    すべてのお客様に一律に適用されるものではなく、審査結果に基づき、2%から14.5%の範囲内で個別に金利が決定されます。適用金利の詳細については、ご契約時の書面にてご確認いただけます。


    金利に関する全体的な構成については、「朝凪カードローン：金利・料率一覧」をご覧ください。'
