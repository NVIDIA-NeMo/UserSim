- id: 2b664f48-aff7-58cd-92ff-61c30770f931
  title: 給与・年金受取特典：よくあるお手続きの流れ
  body: '給与受取口座として当行をご指定いただき、特典を適用させるまでの一般的な流れをご案内します。


    【お手続きの流れ】

    1. 担当者に「給与受取口座の指定に必要な書類をいただきたい」とお申し付けください。

    2. ご本人確認のため、「フルネーム（氏名）」および「生年月日」をお伝えください。

    3. 担当者が、お客様の口座情報を記載した「給与振込依頼書」等の必要書類を作成し、お渡しします。

    4. お渡しした書類を、お勤め先の給与担当部署へご提出ください。

    5. お勤め先での手続きを経て、当行口座に初めて給与の振込が行われたことを確認いたします。

    6. 以降、翌月より「他行あて振込手数料（月3回まで）」および「時間外ATM手数料（月5回まで）」の無料特典が適用されます。


    【完了の確認】

    給与の入金を確認した後、担当者へ適用状況を確認いただくか、次回の振込・ATM利用時に手数料が差し引かれていないことでご確認いただけます。


    年金受取口座の指定手続きについても、同様に本人確認の上で必要書類をご案内いたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: how_to_guide
  source_authority: official
