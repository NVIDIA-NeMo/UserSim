  mentions_tools: []
  institution_id: asanagi_bank
- id: b8ee95d3-1784-5b59-a24c-ee0cbee7bb98
  title: スーパー定期：規定・約款の変更
  body: '本規定は、朝凪銀行が提供する「スーパー定期」の利用条件および約款の変更に関する事項を定めたものです。


    ■契約の成立と最低預入金額

    お客様が当行の所定の手続きを行い、最低預入金額である1,000円以上の預入が完了した時点で契約が成立します。1,000円未満の預入では本商品の契約を締結することはできません。


    ■金利の適用と変更

    適用される金利は、預入期間（1年、3年、5年）に応じて決定されます。金利の変更が必要となった場合は、当行のウェブサイトへの掲載または店頭での掲示により、事前に告知いたします。


    ■中途解約に関する取り決め

    満期前に解約される場合は、約定金利ではなく「中途解約利率」が適用されます。これにより、当初の想定よりも受取利息が少なくなりますので、あらかじめご了承ください。


    ■約款の変更手続き

    法令の改正や監督官庁からの要請、または当行の運営方針の変更に伴い、約款の一部または全部を変更することがあります。変更内容は、適用日の1ヶ月前までに公表いたします。本変更に同意いただけない場合は、本契約を解約いただくことが可能です。


    本規定は、金融庁の監督および銀行法に基づき、厳格なコンプライアンス体制の下で運用されます。'
