- id: 6a68d493-a2bf-5725-9d7e-4c8c42156873
  title: 普通預金：プランの選び方
  body: 'お客様の目的やライフスタイルに合わせて、最適な預金プランをお選びください。


    【普通預金が向いている方】

    ・日常的な支払いや公共料金の引き落とし、給与・年金の受取など、いつでも自由にお金を出し入れしたい方。

    ・利便性を最優先しつつ、0.4%の金利を享受したい方。


    【スーパー定期が向いている方】

    ・一定期間、資金を拘束しても構わないので、より確実な資産形成を目指し、期間に応じた金利を確保したい方。


    【選び方のポイント】

    流動性を重視し、日々の決済口座として利用される場合は「普通預金」が最適です。一方で、将来の住宅購入や教育資金など、当面使う予定のない資金を効率的に運用したい場合は「スーパー定期」への預け入れを推奨いたします。多くのお客様は、普通預金で日常の支払いを管理し、余裕資金を定期預金に回す併用プランを選択されています。


    詳細は「普通預金：当社の似た商品との比較」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: comparison
  source_authority: official
