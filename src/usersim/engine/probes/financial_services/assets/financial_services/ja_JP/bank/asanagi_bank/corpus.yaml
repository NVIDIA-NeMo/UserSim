  title: 普通預金：ご利用条件による違い
  body: '| ご利用条件 | 適用される内容・特典 |

    | :--- | :--- |

    | 全てのお客様 | 普通預金金利 0.4% が適用されます。 |

    | 給与・年金受取口座に指定 | 振込手数料や時間外ATM利用手数料（通常 110円）の無料枠などの特典が適用されます。 |

    | キャッシュカードの再発行申請 | 再発行手数料として 1,100円 が発生します。 |

    | 他行あて振込（ネットバンキング） | 通常 220円 の手数料がかかります（特典適用時を除く）。 |'
