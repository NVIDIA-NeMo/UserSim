- id: 3b601105-5689-53c4-9064-6883ec6cc4e2
  title: 住宅ローン：お手続きが完了しない・保留中のまま
  body: '【症状】

    住宅ローンの事前審査または本審査のお手続きが完了せず、「保留中」の状態となっている。


    【考えられる原因】

    ・ご提出いただいた収入証明書等の書類に不備がある、または最新の資料ではない。

    ・ご本人確認の情報（フルネームおよび生年月日）と提出書類の内容に相違がある。

    ・物件の担保評価において、追加の確認事項が発生している。


    【ご確認・対処法】

    1. 書類の内容確認：提出した書類の有効期限が切れていないか、署名捺印に漏れがないかをご確認ください。

    2. 不足書類の追加提出：担当者から案内があった不足書類を速やかにご提示ください。


    【解決しない場合】

    上記を確認しても状況が変わらない場合、または審査状況について詳細な説明が必要な場合は、当行にて担当者から支店責任者または審査専門部署へ速やかにエスカレーションを行い、進捗状況を調査いたします。調査結果は追って担当者よりご連絡いたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 2dca3582-e736-572b-8bf4-93da765ee5e3
  title: 住宅ローン：お申込みいただける方
  body: '住宅ローンのお申込み条件は以下の通りです。


    ・返済能力：当行が定める審査基準に基づき、安定した収入があり、返済能力があると認められた方（利用限度額は審査により決定いたします）。

    ・借入限度額：最大100,000,000円の範囲内で、物件価格および自己資金比率に応じた金額をお借入れいただける方。

    ・借入期間：最長35年までの期間内で、完済時年齢が当行規定の範囲内である方。

    ・本人確認：犯罪収益移転防止法に基づき、適正な本人確認（フルネームおよび生年月日の照会を含む）にご協力いただける方。'
