- id: a983973f-930a-5c64-85f4-34c88dbd666b
  title: 給与・年金受取特典：実施中のキャンペーン
  body: '【2025年 メインバンク利用促進キャンペーン】


    いつも朝凪銀行をご利用いただき、誠にありがとうございます。現在、より多くのお客様に当行をメインバンクとしてご活用いただくため、受取口座指定キャンペーンを実施しております。


    ■ キャンペーン期間

    2025年1月1日から2025年12月31日まで


    ■ キャンペーン内容

    期間中に新たに給与受取口座または年金受取口座として当行をご指定いただいたお客様に、以下の特典を適用いたします。


    ・他行あて振込手数料：毎月3回まで無料

    ・時間外ATM手数料：毎月5回まで無料

    ・（年金受取の方限定）定期預金金利を 0.1% 上乗せ


    すでに対象の特典をご利用中のお客様も、引き続きこれらの優遇を享受いただけます。地域に根ざした銀行として、皆様の生活を全力でサポートいたします。'
