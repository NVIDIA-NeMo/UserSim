- id: 4ba8e54e-dc9d-5522-b84c-a1d609cbdd4e
  title: 普通預金：お申込みとご利用開始
  body: '普通預金口座の開設からご利用開始までの流れをご案内いたします。当行では、法令に基づき適正な本人確認を実施したうえで口座を開設しております。


    【お手続きの流れ】

    1. 口座開設の意思表明と目的の確認

    お客様に口座開設の目的（給与受取、生活費決済など）をお伺いします。


    2. 本人確認の実施

    ご本人様確認のため、「フルネーム（氏名）」および「生年月日」の2点をお伺いします。※暗証番号やパスワードなどは一切求めません。


    3. 必要書類のご提示

    犯罪収益移転防止法に基づき、運転免許証やマイナンバーカードなどの公的証明書をご提示いただきます。


    4. 口座情報の確定とカード発行

    確認が完了し、口座開設が承認されると、口座番号の発行およびキャッシュカードの作成が行われます。


    5. ご利用開始

    キャッシュカードのお届け後、ATMやインターネットバンキングにて、金利0.4%の普通預金口座をご利用いただけます。


    詳細な条件については「普通預金：お申込みいただける方」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: cd473c4d-f113-55e5-b7d9-9e4f03f0aa3e
  title: 普通預金：手数料一覧
  body: '普通預金のご利用に伴う手数料は以下の通りです。お客様へのご案内の際は、正確な金額を提示してください。


    ・他行あて振込手数料（インターネットバンキング）：220円

    ・時間外のATM利用手数料：110円

    ・キャッシュカード・通帳の再発行手数料：1,100円


    ※給与・年金の受取口座として当行をメインバンクにご利用いただいているお客様には、別途手数料無料枠などの特典をご提供しております。詳細は「給与・年金受取特典：商品概要」をご確認ください。'
