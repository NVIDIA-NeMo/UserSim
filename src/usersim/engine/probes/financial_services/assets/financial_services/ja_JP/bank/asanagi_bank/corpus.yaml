- id: f3809abd-1929-5ed6-b628-b0693dba7181
  title: activate_card を使う場面
  body: 'お客様の手元に「朝凪Visaデビット」カードが届き、利用開始の手続き（アクティベーション）を希望される場合に対応します。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様のフルネームと生年月日の2点を確認し、本人確認を完了します。

    2. `get_accounts` を使用し、お客様が保有しているデビットカードの card_id を特定します。

    3. `activate_card` を呼び出し、カードの利用開始処理を行います。

    4. お客様に、カードが利用可能になったことを伝え、ご利用方法についてご案内します。


    カードの利用限度額や詳細については、「朝凪Visaデビット：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: asanagi_bank
- id: 01ab34cd-9e07-5bfa-910f-495dae16f3e0
  title: activate_card ツールリファレンス
  body: '### ツール概要

    お手元に届いた朝凪Visaデビットカードの利用開始手続きを完了させるためのツールです。


    ### 実行動作

    オペレーターが本ツールを直接呼び出すことで、指定されたカードを有効化し、即時利用可能な状態にします。


    ### 引数

    - `card_id`: 有効化対象となるカードの識別子。`get_accounts` ツールによって取得します。


    ### 注意事項

    本ツールを呼び出す前に、必ず `verify_identity` による本人確認を完了させてください。本人確認が完了しているため、ツール引数に暗証番号やパスワードを含める必要はありません。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
