- id: 75f88e1d-7237-59d9-8ee1-58243230d827
  title: よくあるご質問
  body: '【お問い合わせやサポートについて】

    問：店舗窓口以外にどのような相談方法がありますか？

    答：当行では、店舗窓口のほか、インターネットバンキングおよび電話サポートによるオムニチャネル体制を整えております。ご都合に合わせて最適な方法をご選択ください。


    問：電話サポートで解決しなかった場合はどうすればよいですか？

    答：複雑な案件や、ご要望に沿わない点がある場合は、担当者から支店責任者または専門部署へと速やかにエスカレーションし、誠実に対応させていただきます。


    問：本人確認には何が必要ですか？

    答：口座情報の照会や変更などの操作にあたっては、原則として「フルネーム（氏名）」および「生年月日」の2点による確認を実施いたします。暗証番号やパスワード、身分証番号などは一切求めませんのでご注意ください。'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
