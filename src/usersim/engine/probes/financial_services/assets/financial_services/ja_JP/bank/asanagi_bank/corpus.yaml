- id: d5657e80-f6e4-56b9-9fb1-257b5e3911d8
  title: 給与・年金受取特典：重要事項のご説明
  body: '本特典のご利用にあたり、以下の重要事項をご確認ください。


    【法令遵守と監督】

    朝凪銀行は、銀行法に基づき金融庁の監督を受けております。また、個人情報保護法および犯罪収益移転防止法に従い、厳格な本人確認を実施しております。


    【預金保険制度について】

    当行の預金は預金保険制度により保護されており、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【特典の適用条件】

    ・本特典の適用には、実際に給与または年金の入金が確認される必要があります。口座指定のみでは適用されません。

    ・無料回数（他行あて振込月3回、時間外ATM月5回）を超えた分については、通常の手数料が課金されます。

    ・年金受取の方への金利上乗せ（0.1%）は、適用対象となる定期預金商品に限定されます。


    【免責事項】

    給与・年金の受取指定手続きは、お客様ご自身で勤務先や年金事務所へ行っていただく必要がございます。当行でこれらの指定を代行することはできません。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: disclosure
  source_authority: official
