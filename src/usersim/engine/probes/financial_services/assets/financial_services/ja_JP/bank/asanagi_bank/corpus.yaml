  title: 給与・年金受取特典：ご利用条件による違い
  body: 'お客様のご利用条件に基づいた特典適用内容は以下の通りです。


    | ご利用条件 | 適用される特典内容 |

    | :--- | :--- |

    | 給与受取口座として指定 | 他行あて振込手数料：月3回無料 / 時間外ATM手数料：月5回無料 |

    | 年金受取口座として指定 | 他行あて振込手数料：月3回無料 / 時間外ATM手数料：月5回無料 / 定期預金金利上乗せ幅：0.1% |

    | 上記いずれにも該当しない | 通常の手数料および金利が適用されます |


    ※給与と年金の両方を受取口座に指定いただいている場合は、最も有利な条件（金利上乗せを含む）が適用されます。'
