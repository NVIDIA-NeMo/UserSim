- id: 4ffa0891-6ab8-50b3-b280-83f01d9e8ef0
  title: 普通預金：規定・約款の変更
  body: '本規定は、朝凪銀行が提供する普通預金の利用条件および、約款の変更手続きについて定めるものです。


    【約款の変更について】

    当行は、法令の改正、経済情勢の変化、または業務運営上の必要に基づき、普通預金の約款を変更することがあります。変更の内容は、店頭への掲示、郵送、またはインターネットバンキング等の電子的な方法により事前にお知らせいたします。お客様が変更後も引き続き口座を利用された場合、または指定の期日までに拒絶の意思表示をされなかった場合は、変更後の約款に同意したものとみなされます。


    【適用される基本条件】

    本口座には、以下の条件が適用されます。これらの数値は、約款の変更により改定される場合があります。

    ・普通預金金利：0.4%

    ・他行あて振込手数料（インターネットバンキング利用時）：220円

    ・時間外ATM利用手数料：110円

    ・キャッシュカード・通帳の再発行手数料：1,100円


    【合意の解消】

    お客様は、いつでも口座の解約を請求することができ、当行は正当な理由なくこれを拒否しません。ただし、未決済の債務がある場合や、法的拘束がある場合は、所定の手続きが完了するまで解約が制限されることがあります。


    規定の全文および詳細については、「普通預金：規定・約款」をご参照ください。'
