- id: 73479f25-5b64-5dbc-a237-ac5fc5266179
  title: 朝凪カードローン：貸付金利（上限）について
  body: '【質問】貸付金利の上限はいくらですか？また、どのような場合に適用されますか？


    【回答】「朝凪カードローン」の貸付金利の上限は年14.5%です。適用される金利は、お申し込み時の審査において、お客様の年収や勤務先、他社での借入状況などの返済能力を総合的に判断して決定いたします。個別の適用金利についてご確認されたい場合は、本人確認（フルネームと生年月日）の後、担当者が現在の適用金利をご案内いたします。'
