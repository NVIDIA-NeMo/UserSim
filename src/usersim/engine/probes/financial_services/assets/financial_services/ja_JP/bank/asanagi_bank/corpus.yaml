  institution_id: asanagi_bank
- id: bedfd342-fc89-51e1-9ada-8ce312f3f469
  title: 普通預金：個人情報の取扱い
  body: '朝凪銀行は、お客様からお預かりした個人情報を、個人情報保護法および関連法令に従い、厳格に管理いたします。


    【収集する情報の目的】

    普通預金口座の開設および維持管理において、以下の目的で個人情報を利用いたします。

    ・口座開設時の本人確認（犯罪収益移転防止法に基づく取引時確認）

    ・ご入出金、振込等の取引実行および照会への対応

    ・金利（0.4%）の計算および利息のお支払い

    ・各種手数料（他行あて振込 220円、時間外ATM 110円等）の精算

    ・法令に基づく当局（金融庁等）への報告


    【情報の管理と第三者提供】

    当行は、お客様の同意なく個人情報を第三者に提供いたしません。ただし、以下の場合は除きます。

    ・法令に基づき開示が求められた場合

    ・人の生命、身体または財産の保護のために緊急の必要がある場合

    ・指定信用情報機関等、適切な審査および管理のために必要な範囲内で提供する場合


    【お客様の権利】

    お客様は、ご自身の個人情報の開示、訂正、利用停止を請求することが可能です。お手続きを希望される場合は、本人確認（フルネームおよび生年月日）の上、所定の手順にて承ります。


    【預金保険制度について】

    預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。安心してお取引いただける環境を維持し、誠実に運営してまいります。


    詳細なリスクに関する事項は、「普通預金：リスクについてのご説明」をご確認ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 7697cc1d-c276-5bc5-bcb5-a74745ded084
  title: 普通預金：この商品をかたる詐欺にご注意ください
  body: '当行の普通預金口座を利用した、巧妙な詐欺の手口についてご注意ください。特に、当行の職員を名乗り、「口座に制限がかかっている」「至急手続きをしないと資産が失われる」といった不安を煽る電話やメール、SMSが報告されています。


    朝凪銀行では、いかなる場合においても、お客様の暗証番号、パスワード、キャッシュカード番号、身分証明書番号などを、電話やメールでお伺いすることはございません。本人確認のために弊社からお願いすることは、「フルネーム（氏名）」および「生年月日」の2点のみです。これら以外の機密情報を求める連絡は、すべて詐欺であると判断し、すぐにお切りください。


    もし、不審な連絡を受けたり、誤って情報を伝えてしまったと感じられた場合は、直ちにご相談ください。キャッシュカードの紛失や盗難、不正利用の疑いがある場合は、迅速に利用停止措置を行い、預金者保護法に基づき誠実に対応させていただきます。


    お客様のの大切な資産を守るため、不審な点がある場合は、慌てずに当行の窓口または公式のサポート窓口までご確認いただけますようお願い申し上げます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 0c1d5b57-436c-5090-ab27-3c93c8990ce9
  title: 普通預金：限度額・制限と注意事項
  body: '本資料は、普通預金の運用における限度額、制限事項、およびコンプライアンス上の注意点をまとめたものです。お客様への案内時にご活用ください。


    【預金保険制度による保護】

    普通預金は預金保険制度の対象となっております。当行が破綻した場合、預金者1人当たり元本1,000万円までとその利息が保護されます。この点は、お客様に安心感を提供するための重要な説明事項として提示してください。


    【本人確認の徹底】

    口座情報の照会や変更、状態変更を伴う操作を行う前には、必ず本人確認を実施してください。確認事項は「フルネーム（氏名）」および「生年月日」の2点に限定し、これ以外の機密情報（暗証番号等）は絶対に求めないでください。これは犯罪収益移転防止法および当行のセキュリティポリシーに基づく厳格なルールです。


    【金利の適用】

    普通預金の金利は0.4%です。適用条件や変更がある場合は、適宜最新の情報を確認してください。


    【利用制限】

    法令に基づき、不審な取引が検知された場合や、本人確認書類の更新が必要な場合は、一時的にお取引を制限させていただく場合がございます。その際は、丁寧にご事情を説明し、必要な手続きをご案内してください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 7402e1af-f420-50df-96c5-42b14852470b
  title: 普通預金：キャッシュカード・通帳の再発行手数料について
  body: '**Q: キャッシュカードや通帳を紛失してしまった場合、再発行に費用はかかりますか？**


    A: はい。キャッシュカードおよび通帳の再発行には、手数料として1,100円を申し受けます。


    **Q: 手数料の支払いはどのように行えばよいですか？**


    A: 原則として、当行の普通預金口座から差し引かせていただきます。再発行のお手続き時に、口座残高が十分にあるかをご確認ください。


    紛失や盗難に気づいた際は、被害を最小限に抑えるため、至急当行までご連絡ください。迅速にカードの利用停止措置を講じます。詳細は「普通預金：不正利用からお客さまを守るために」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: bc739b08-bc1a-55b9-9cb1-c546e3cc3520
  title: 普通預金：状況・履歴の確認
  body: '普通預金の残高や、過去のお取引履歴を確認する方法をご案内いたします。


    【ご準備いただくもの】

    ・ご本人様確認のための情報（フルネームおよび生年月日）


    【確認の手順】

    1. 当行の担当者に、残高照会または取引履歴の確認を希望される旨をお伝えください。

    2. ご本人確認のため、「フルネーム（氏名）」と「生年月日」をお伺いします。これらをご提示ください。

    3. 本人確認が完了した後、担当者が最新の残高、およびご希望の期間の入出金明細をご案内いたします。


    【確認完了後の状態】

    ・口頭での照会の場合：その場で最新の残高と履歴が伝えられます。


    なお、インターネットバンキングをご利用いただければ、いつでもリアルタイムで履歴のご確認が可能です。また、通帳記帳を行うことで、物理的な記録として履歴を保持いただけます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 47455abf-6f48-5324-9ca9-016a26662303
  title: 普通預金：お取引が拒否された・制限された
  body: '「ATMで引き出しができない」「振込の手続きが完了しない」など、お取引が拒否された場合に考えられる原因と対処法をご案内いたします。


    【考えられる原因】

    1. **残高不足**：口座残高が、お取引金額および手数料（他行あて振込手数料220円や時間外ATM手数料110円など）を下回っている可能性があります。

    2. **カードの有効期限切れまたはロック**：暗証番号の誤入力が続いた場合、セキュリティのためカードが一時的にロックされます。

    3. **本人確認情報の未更新**：犯罪収益移転防止法に基づき、定期的な情報の更新が必要な場合がございます。

    4. **不正利用検知による制限**：通常とは異なる不自然な取引が検知された場合、安全のため制限をかけることがあります。


    【対処方法】

    ・まず、インターネットバンキングなどで最新の残高をご確認ください。

    ・カードのロックや情報の更新が必要な場合は、当行担当者に「フルネーム（氏名）」と「生年月日」をお伝えいただき、状況を確認してください。


    【解決しない場合】

    担当者による確認でも解決しない場合は、速やかに支店責任者または専門部署へエスカレーションし、詳細な調査を行います。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e0a990d5-cf10-50be-b020-9b9f54ff8136
  title: 普通預金：切替えや上位プランを検討するとき
  body: 'お客様が現在の普通預金から、より最適なプランや商品への切替えを検討されている際のご案内指針です。


    【スーパー定期への切り替え検討】

    ・**目的**：日常的な支払いのための流動性よりも、確実な資産形成（金利の確保）を優先される場合。

    ・**比較**：普通預金は金利0.4%でいつでも引き出し可能ですが、スーパー定期は期間に応じた金利が設定され、原則として満期まで預け入れます。


    【給与・年金受取特典への移行検討】

    ・**目的**：当行をメインバンクとして利用し、コストを削減したい場合。

    ・**メリット**：普通預金単体では、他行あて振込手数料（インターネットバンキング）に220円、時間外ATM利用手数料に110円かかりますが、本特典を適用することでこれらの手数料負担を軽減できます。


    お客様のライフスタイルや資産運用の目的に合わせ、利便性の高い「普通預金」か、収益性の高い「スーパー定期」、あるいはコスト効率の良い「給与・年金受取特典」をご提案してください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 6d1d3188-0958-591a-8fb9-fb94e22d8295
  title: 普通預金：ほかの選択肢との比較と向かない場合
  body: "普通預金は、利便性に優れた基本口座ですが、お客様のご要望によっては他の商品の方が適している場合がございます。\n\n【普通預金が最適なケース】\n\
    ・給与や年金の受取口座として利用したい。\n・公共料金の引き落としなど、日常的な決済に利用したい。\n・いつでも自由に入出金でき、かつ0.4%の金利を享受したい。\n\
    \n【普通預金が向かないケース（他商品の推奨）】\n1. **まとまった資金を効率的に増やしたい場合**\n   → 「スーパー定期」が適しています。普通預金よりも高い金利設定がされており、期間を定めて預けることで、確実な資産形成が可能です。\n\
    2. **投資による資産形成を検討されている場合**\n   → NISAの「つみたて投資枠」や「成長投資枠」などを活用した投資信託等の検討をお勧めします。ただし、投資には元本割れのリスクが伴うため、教育的な情報提供に留め、具体的なプランは専門家にご相談ください。\n\
    \n【まとめ】\n普通預金は「流動性」と「安心感」を重視する方に最適です。一方で「収益性」を重視される場合は、定期預金や資産運用商品との組み合わせをご提案いたします。"
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 980d28ec-6cc1-500b-8730-c9a94ec7cdc9
  title: 普通預金：手数料と費用
  body: '**Q: 普通預金を利用する際、どのような手数料がかかりますか？**


    A: 主に以下の手数料を設定しております。

    ・他行あて振込手数料（インターネットバンキング利用時）：220円

    ・時間外のATM利用手数料：110円

    ・キャッシュカード・通帳の再発行手数料：1,100円


    **Q: これらの手数料を無料にしたり、軽減したりする方法はありますか？**


    A: はい。当行の「給与・年金受取特典」をご利用いただくことで、振込手数料やATM手数料の無料枠などの特典を提供しております。当行をメインバンクとしてご利用いただくことで、長期的にコストを抑えてご利用いただけます。


    詳細は「給与・年金受取特典：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: ae528b53-3b69-5c20-8cfb-391aed2a66ce
  title: 普通預金：よくあるお手続きの流れ
  body: '普通預金における代表的なお手続きの流れをご案内いたします。


    【口座開設の流れ】

    1. **ご希望の提示**：口座開設を希望される旨を当行へお伝えください。

    2. **本人確認**：ご本人様確認のため、「フルネーム（氏名）」および「生年月日」をお伺いします。その後、犯罪収益移転防止法に基づき、指定の本人確認書類をご提示いただきます。

    3. **詳細設定**：利用目的や、キャッシュカードの発行有無などを確認いたします。

    4. **完了**：手続き完了後、口座番号が発行され、ご利用可能となります。


    【口座解約の流れ】

    1. **解約の依頼**：口座解約を希望される旨を当行へお伝えください。

    2. **本人確認**：ご本人確認のため、「フルネーム（氏名）」および「生年月日」をお伺いします。

    3. **残高精算**：口座内の残高をすべてお引き出しいただくか、指定の口座へ送金いたします。

    4. **完了**：通帳およびキャッシュカードを回収し、解約手続きが完了いたします。


    すべてのお手続きにおいて、誠実かつ丁寧な対応を心がけております。ご不明な点はいつでもお問い合わせください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 3b5f4dab-4c2d-5fb1-8132-c3c865f492ac
  title: 普通預金：明細や記録と合わない
  body: 'お客様から「通帳や明細の金額が、自身の記録と一致しない」というお問い合わせをいただいた際の対応フローです。


    【想定される原因】

    1. **未記帳分がある**：ATMで通帳記帳を行っていないため、最新の取引が反映されていない。

    2. **自動振替の発生**：公共料金やクレジットカードの支払いなど、あらかじめ設定された口座振替が実行された。

    3. **他行あて振込の手数料**：振込金額とは別に、インターネットバンキング利用時の手数料220円などが差し引かれている。

    4. **処理のタイムラグ**：他行からの振込などで、入金反映までにお時間がかかっている。


    【確認ステップ】

    1. **詳細照会**：お客様に、不一致となっている日付と金額を具体的にご確認いただきます。

    2. **履歴の精査**：当行の記録と照らし合わせ、上記のような手数料（220円、110円など）や自動振替が含まれていないかを確認します。

    3. **ご説明**：原因が判明した場合は、丁寧にお客様へご説明し、納得いただけるようサポートしてください。


    【エスカレーション】

    原因が特定できない場合や、システム上の不具合が疑われる場合は、速やかに支店責任者または専門部署へ報告し、詳細な調査を依頼してください。'
