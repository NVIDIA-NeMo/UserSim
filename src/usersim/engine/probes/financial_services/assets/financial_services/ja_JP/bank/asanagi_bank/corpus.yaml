- id: 4521da27-ddf3-5337-b598-94cb2ddfbc29
  title: 給与・年金受取特典：この商品をかたる詐欺にご注意ください
  body: '当行の「給与・年金受取特典」を悪用し、お客様の資産を狙う不審な電話やメール、SMSなどの詐欺行為が報告されています。十分にご注意ください。


    【詐欺の主な手口】

    「給与・年金受取口座への指定手続きが未完了のため、特典が失効します」や「特別な金利上乗せキャンペーンの適用には、至急手続きが必要です」といった不安を煽る内容で、偽のウェブサイトへ誘導したり、個人情報を聞き出そうとしたりします。


    【当行の対応について】

    朝凪銀行では、口座情報の照会や変更などの操作を行う前に、必ず本人確認を実施いたします。確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これら以外の暗証番号、パスワード、キャッシュカード番号、身分証番号などは、いかなる理由があっても電話やメールでお伺いすることはございません。


    【不審な点に気づいたときは】

    もし不審な連絡を受け、個人情報を伝えてしまった場合や、不審なサイトで操作を行った場合は、直ちに当行までご連絡ください。迅速に口座の利用停止措置などの対応を行い、お客様の資産を保護いたします。


    詳細については、「普通預金：不正利用からお客さまを守るために」も併せてご確認ください。'
