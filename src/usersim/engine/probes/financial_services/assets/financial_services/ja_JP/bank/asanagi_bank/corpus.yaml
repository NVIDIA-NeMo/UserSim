- id: 5da59091-59eb-5a5b-938f-9c566964be9e
  title: 朝凪カードローン：不正利用からお客さまを守るために
  body: '朝凪カードローンを安心してお使いいただくために、不審な連絡や不正利用への対策についてご案内いたします。


    ■当行が絶対に求めない情報

    当行では、いかなる場合においても、電話やメール、SMSなどを通じて以下の情報を求めることはございません。心当たりのない請求や、急ぎの手続きを促す連絡があった場合は、十分にご注意ください。

    ・カードの暗証番号（PIN）

    ・インターネットバンキングのパスワード

    ・カード番号の全桁

    ・身分証明書の番号


    ■本人確認について

    口座情報の照会や変更などの操作を行う際は、必ず本人確認を実施いたします。当行が確認させていただく事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の機密情報を求められた場合は、不審な連絡である可能性が高いため、速やかに通話を終了してください。


    ■万が一、紛失や盗難に気づいたときは

    キャッシュカードの紛失や盗難、または身に覚えのない利用通知が届いた場合は、直ちにご連絡ください。迅速に利用停止措置を行い、被害の拡大を防ぎます。不正利用への補償については、預金者保護法および当行の規定に基づき、誠実に対応させていただきます。


    不審な点を感じた際は、迷わず当行の窓口または電話サポートまでお問い合わせください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: security_advisory
  source_authority: official
