- id: b9dfb34f-79f5-53e5-9d24-d52d2f1d391b
  title: transfer_funds を使う場面
  body: "お客様から普通預金口座からの振込依頼（当行内または他行あて）があった場合に、本手続きを実施します。振込手数料については、お客様が「給与・年金受取特典」をご利用かによって無料枠が異なります。詳細は「普通預金：手数料一覧」をご確認ください。\n\
    \n【手続き手順】\n1. `verify_identity` を呼び出し、お客様のフルネームと生年月日の2点を確認し、本人確認を完了します。\n2. `get_accounts`\
    \ を使用し、振込元となる普通預金口座の account_id を特定します。\n3. お客様に以下の情報を確認します。\n    - 送金先金融機関名、支店名、口座番号、受取人名\n\
    \    - 振込金額（例: 10,000円）\n4. `transfer_funds` を呼び出し、振込処理を実行します。\n\n振込先の情報をあらかじめ登録したい場合は、「update_beneficiary\
    \ を使う場面」の手順をご案内ください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: asanagi_bank
- id: 5ce7a905-a44c-58d2-9b82-a078d850e6af
  title: transfer_funds ツールリファレンス
  body: "本ツールは、お客様の普通預金口座から、指定した口座へ資金を振り込むために使用します。エージェントは本ツールを直接呼び出して処理を完結させます。\n\
    \n【ツール仕様】\n- ツール名: transfer_funds\n- 引数:\n    - 送金元口座ID: `get_accounts` 等で特定した\
    \ account_id\n    - 送金先口座情報: 金融機関名、支店名、口座番号、受取人名を含む詳細情報\n    - 金額: 振込金額（例: 5,000円）\n\
    - 実行内容: 指定された口座から送金先へ即時に振込処理を行います。\n\n※本ツールの実行には、事前の `verify_identity` による本人確認が必須です。"
