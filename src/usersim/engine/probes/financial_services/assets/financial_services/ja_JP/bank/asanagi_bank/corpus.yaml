- id: 8f00bb50-b050-5d6b-8238-92a5e537398c
  title: スーパー定期：個人情報の取扱い
  body: '朝凪銀行は、お客様からお預かりした個人情報を、個人情報保護法および犯罪収益移転防止法に基づき、適切かつ厳格に取り扱います。


    ■個人情報の利用目的

    「スーパー定期」のご契約にあたり収集した個人情報は、以下の目的で利用いたします。

    ・口座開設および契約内容の管理

    ・利息の計算およびお支払い手続き

    ・法令に基づく本人確認（取引時確認）の実施

    ・当行からのお取引に関する重要なお知らせの送付


    ■安全管理措置

    当行は、個人情報の漏洩、滅失または毀損を防止するため、適切なセキュリティ対策を講じております。また、内部管理体制を整備し、権限を持つ社員のみが業務に必要な範囲で情報にアクセスできるよう制限しております。


    ■第三者への提供

    法令に基づく場合や、監督官庁（金融庁など）からの要請がある場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    ■お客様の権利

    ご自身の個人情報の開示、訂正、または利用停止を希望される場合は、所定の手続きを経て申請いただけます。詳細については、当行の個人情報保護方針をご確認ください。誠実な対応を通じて、地域の皆様に信頼される金融サービスの提供に努めてまいります。'
