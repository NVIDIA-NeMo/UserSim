  institution_id: asanagi_bank
- id: c3350573-0929-51dd-87d4-a2cf3f0d5176
  title: 住宅ローン：この商品をかたる詐欺にご注意ください
  body: '当行の住宅ローンをかたる、不審な電話やメール、郵便物にご注意ください。特に「低金利への切り替えを保証する」や「審査なしで融資限度額を増額できる」といった、常識外の好条件を提示して個人情報を聞き出そうとする手口が報告されています。


    朝凪銀行では、口座情報の照会や変更などの手続きに際して、本人確認として「フルネーム（氏名）」および「生年月日」の2点のみを確認させていただきます。これら以外の暗証番号、パスワード、キャッシュカード番号、身分証番号などは、どのような理由があっても、電話やメールでお伺いすることは一切ございません。


    もし不審な連絡を受け、不安を感じられた場合は、すぐに当行の窓口または電話サポートまでご連絡ください。また、万が一、個人情報を伝えてしまった場合は、速やかに状況をお知らせいただけますようお願い申し上げます。'
