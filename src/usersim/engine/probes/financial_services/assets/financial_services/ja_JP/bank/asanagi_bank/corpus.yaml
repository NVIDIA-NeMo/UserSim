- id: 1773dd67-6410-5150-835a-8e260fcf3e6b
  title: スーパー定期：解約・変更・プランの切替え
  body: '「スーパー定期」の解約や内容変更、プランの切替えを希望される際の手順をご案内いたします。


    ■お手続きの前に

    お手元にキャッシュカードまたは通帳をご用意ください。


    ■お手続きの流れ

    1. 本人確認の実施

    担当者にお申し出ください。ご本人確認のため、「フルネーム（氏名）」および「生年月日」を伺います。これにより、安全に口座操作を行うことができます。


    2. ご希望の内容を伝達

    「満期前の解約」か「預入期間の変更（切替え）」かをご指示ください。なお、プランの切替えは原則として一度解約し、改めて新しい期間で預け直す形となります。


    3. 条件の確認

    満期前に解約される場合は、「中途解約利率」が適用されることをご説明します。当初の約定金利（例：3年ものの 0.85% など）よりも低い利率となりますので、あらかじめご了承ください。


    4. 処理の完了と確認

    手続き完了後、解約金および利息（税引後）が普通預金口座へ入金されたことを確認していただきます。


    ■完了の目安

    手続き直後、または後ほど発行される取引明細にて、入金金額をご確認いただけます。'
