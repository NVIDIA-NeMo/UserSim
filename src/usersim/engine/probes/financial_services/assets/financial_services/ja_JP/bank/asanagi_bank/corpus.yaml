- id: 174c12f3-a540-5eb1-a86e-4f884422c6ab
  title: 住宅ローン：規定・約款の変更
  body: '本規定は、当行の住宅ローン契約における条件および変更手続きについて定めるものです。他行のプランと比較検討される際は、以下の重要条項をご参照ください。


    ■金利および返済額の改定

    1. 変動金利を選択された場合、返済額は変動金利の返済額の見直し間隔（年）である5年ごとに見直されます。

    2. 返済額の見直し後、その金額は見直し前の返済額に対する割合として、見直し後の返済額の上限である125%を上限とします。

    3. 金利の変更および規定の改定がある場合は、事前にお客様へ通知いたします。


    ■借入条件の遵守

    ・借入限度額は最大100,000,000円、最長借入期間（年）は35年までとなります。

    ・融資の実行にあたっては、当行が定める返済能力審査を通過することが条件となります。


    ■契約の終了と繰上返済

    ・インターネットでの一部繰上返済手数料は0円です。効率的な返済計画に基づいたご利用を推奨いたします。

    ・全額繰上返済または完済による契約終了の手続きについては、別途規定に基づき行います。


    本規定は、銀行法および金融庁の監督指針に基づき、誠実かつ透明性のある運用を維持します。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: ba0ac261-a038-5b63-81cb-a922d8807d05
  title: 住宅ローン：ご利用開始までの手順
  body: '【担当者向け：住宅ローン利用開始フロー】


    お客様が住宅ローンの利用を開始するまでの一連の手順について、以下の通り案内してください。


    1. 事前相談と意向確認

    お客様のライフプランに基づき、変動金利（優遇後）1.375%か、固定金利期間選択型10年の金利（優遇後）3.7%かの選択意向を確認します。あわせて、借入限度額（最大100,000,000円）や最長借入期間（35年）の範囲内であるかを確認します。


    2. 正式申込みと本人確認

    犯罪収益移転防止法に基づき、適切な本人確認書類を提示いただき、取引時確認を実施します。同時に、融資手数料（借入金額に対する割合）として2.2%が発生することを明確に説明してください。


    3. 返済能力審査

    銀行法に基づき、年収や既存債務などの返済能力を厳格に審査し、最終的な利用限度額を決定します。


    4. 契約締結と保険加入

    団体信用生命保険への加入手続きを含め、金銭消費貸借契約を締結します。住宅ローン控除（2030年末までに入居した場合、年末残高の0.7%を所得税等から控除）についても案内してください。


    5. 融資実行

    審査承認後、指定の口座へ融資を実行し、ご利用開始となります。'
