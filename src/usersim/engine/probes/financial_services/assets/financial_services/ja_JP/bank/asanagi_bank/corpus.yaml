- id: 11e37c0a-90ab-53d8-84b1-4d87637824bb
  title: 給与・年金受取特典：状況・履歴の確認
  body: '現在ご利用中の「給与・年金受取特典」の利用状況（無料回数の残りなど）を確認する手順をご案内します。


    【ご確認前に】

    お手元にキャッシュカードまたは通帳をご用意ください。


    【確認の手順】

    1. 担当者に「給与・年金受取特典の今月の利用状況を確認したい」とお申し付けください。

    2. ご本人確認のため、「フルネーム（氏名）」および「生年月日」をお伝えください。

    3. 担当者が、今月すでに利用された「他行あて振込手数料の無料回数」および「時間外ATM手数料の無料回数」を照会します。

    4. 現在の利用回数と、今月中に残っている無料回数の合計（振込は最大3回/月、ATMは最大5回/月まで）について回答を受けます。


    【完了の目安】

    担当者から「今月の無料回数はあと〇回です」という案内があり、ご自身の記録と一致していれば確認完了です。


    ご利用履歴の詳細について不明点がある場合は、「給与・年金受取特典：明細や記録と合わない」をご参照ください。'
