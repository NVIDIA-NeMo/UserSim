- id: 9b29651b-7936-552c-b90d-47cb67f5b97a
  title: 朝凪カードローン：他社の一般的な商品との比較
  body: '一般的な消費者金融（貸金業者）の商品と「朝凪カードローン」の違いについてご説明いたします。


    ■主な相違点

    ・規制の適用：消費者金融は貸金業法の「総量規制」により、原則として年収の3分の1までしか借りられません。一方、当行のカードローンは銀行法に基づき、総量規制の対象外となります。ただし、当行では独自の厳格な審査を行い、返済能力に見合った限度額（最大8,000,000円）を設定いたします。

    ・金利水準：当行の金利は年2%から14.5%となっており、多くの場合、消費者金融よりも低水準な金利での提供が可能です。


    ■どちらが適しているか

    ・朝凪カードローン：安定した信頼感を重視し、低金利での利用を希望される方、または年収制限を超えても返済能力があることを適切に審査していただきたい方に適しています。

    ・消費者金融：審査のスピードや、極めて短期間の超小口借入を優先される方に適している場合があります。'
