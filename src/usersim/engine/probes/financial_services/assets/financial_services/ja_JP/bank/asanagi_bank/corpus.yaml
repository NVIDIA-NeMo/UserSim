- id: ff1484d7-4e9d-5108-9d1a-d31c0a58dc2c
  title: 朝凪カードローン：よくあるお手続きの流れ
  body: '朝凪カードローンのお申込みからご利用開始、および解約までのお手続きの流れをご案内いたします。


    ■お申込みからご利用開始まで

    1. 担当者に「カードローンの利用を検討している」旨をお伝えください。

    2. ご本人確認のため、「フルネーム（氏名）」と「生年月日」をお伝えください。

    3. 審査に必要な書類（収入証明書等）のご案内を受け、提示してください。

    4. 当行にて返済能力の審査を行い、利用限度額（最大 8,000,000円）と適用金利（2% ～ 14.5%）を決定します。

    5. 審査結果のご案内を受け、契約内容に同意いただいた後、お手続きが完了します。


    ■ご返済の手続き

    ・原則として、ご指定の口座から毎月 2,000円 以上の最低返済額が自動で引き落とされます。

    ・追加で返済したい場合は、担当者へ「繰上返済をしたい」旨をお伝えください。


    ■解約の手続き

    1. 担当者に「カードローンの解約をしたい」旨をお伝えください。

    2. 本人確認（フルネームと生年月日）を実施します。

    3. 借入残高が 0円 であることを確認します。残高がある場合は、全額精算の手続きを行います。

    4. 解約手続きが完了し、利用限度額が消滅します。


    すべてのお手続きは、誠実かつ透明性のあるプロセスで迅速に実施いたします。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 40ded84a-0b2d-53e0-b89c-33096215d557
  title: 朝凪カードローン：明細や記録と合わない
  body: '【サポート担当者向け：明細不整合への対応】


    お客様から「返済したはずなのに残高が減っていない」「利息の計算が合わない」などの指摘を受けた際の対応フローです。


    ■確認すべき事項（優先順位順）

    1. 入金日と反映日のタイムラグ：振込が行われた日と、システムに反映される営業日にズレがないかを確認してください。

    2. 返済充当の順序：ご返済額が「利息」に先に充当され、その後「元金」に充当されていることを説明してください。特に最低返済額 2,000円 のみの返済の場合、元金の減少幅が小さくなるため、誤解が生じやすい点です。

    3. 適用金利の確認：契約時の金利（2% ～ 14.5% の範囲内）が正しく適用されているか、再照会してください。


    ■解消の手順

    1. お客様の提示する記録（振込明細など）と、当行の取引履歴を照合します。

    2. 差異の原因を明確にし、分かりやすい平易な表現で説明してください。

    3. 計算ミスの疑いがある場合は、直ちに計算根拠を再検証します。


    ■エスカレーション基準

    ・お客様が納得されない場合、または当行側のシステムエラーが明確な場合は、速やかに支店責任者または専門部署へエスカレーションし、調査を依頼してください。透明性のあるプロセスで迅速な解決を図ります。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: troubleshooting
  source_authority: official
