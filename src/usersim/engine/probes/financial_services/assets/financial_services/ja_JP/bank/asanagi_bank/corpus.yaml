- id: a8951702-ef5f-5c88-88c7-353cdb45aabf
  title: スーパー定期：最低預入金額について
  body: '【Q】スーパー定期を始めるために、最低いくらから預け入れることができますか？


    A. 「スーパー定期」の最低預入金額は1,000円です。1,000円以上の金額からお申し込みいただけます。


    【Q】1,000円未満の金額で口座を開設することは可能ですか？


    A. 誠に恐れ入りますが、本商品は最低預入金額を1,000円と定めておりますため、1,000円未満での開設は承ることができません。少額からの決済や自由な出金を優先される場合は、「普通預金：商品概要」をご参照の上、普通預金のご利用をご検討ください。'
