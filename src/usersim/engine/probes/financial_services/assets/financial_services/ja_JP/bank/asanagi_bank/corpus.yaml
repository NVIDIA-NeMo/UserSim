- id: c4aa50b6-3989-561e-957e-df91ecde4292
  title: 給与・年金受取特典：不正利用からお客さまを守るために
  body: '当行では、お客さまの大切な資産を守るため、厳格なセキュリティ体制を構築しております。特に給与・年金受取口座として当行をご利用いただいているお客さまには、安心してお取引いただけるよう、以下の点にご注意ください。


    【当行が絶対にお伺いしないこと】

    当行の職員が、お電話やメール、または書面にて、お客様の暗証番号、パスワード、キャッシュカード番号、身分証番号などを求めることは一切ございません。これらの情報を求める連絡があった場合は、詐欺の可能性が非常に高いため、絶対に応じないでください。


    【本人確認について】

    口座情報の照会や変更などの操作を行う際は、必ず本人確認を実施いたします。確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の機密情報を求められた場合は、速やかに通報してください。


    【万が一のときは】

    キャッシュカードの紛失や盗難に気づいた際は、直ちにご連絡ください。迅速に利用停止措置を行い、預金者保護法に基づき、お客さまに故意や重大な過失がない限り、誠実に対応いたします。


    地域に根ざした銀行として、お客さまの信頼に最大限にお応えいたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 3f0c1175-e364-5a20-b436-6a3e1b2127c9
  title: 給与・年金受取特典：規定・約款
  body: '本規定は、朝凪銀行の「給与・年金受取特典」の適用条件および運用について定めるものです。担当者は本規定に基づき、適正に案内を行ってください。


    1. 特典適用の条件

    本特典は、当行の普通預金口座を給与受取口座または年金受取口座として指定し、継続的に利用しているお客さまに適用されます。


    2. 提供される特典内容

    ・他行あて振込手数料の無料回数（月）：最大3回まで無料とします。

    ・時間外ATM手数料の無料回数（月）：最大5回まで無料とします。

    ・年金受取特典金利：年金受取口座としてご利用のお客さまが、当行の定期預金（スーパー定期）に預入された場合、適用金利に0.1%を上乗せします。


    3. 特典の停止と変更

    給与または年金の受取状況が確認できなくなった場合、または受取口座の変更が行われた場合、翌月より本特典の適用を停止します。また、当行は経済情勢や法令の変更に基づき、事前の告知をもって本特典の内容を変更できるものとします。


    4. 適用範囲

    本特典は、当行の規定および全国銀行協会相談室の指針に従い運用されます。詳細は「給与・年金受取特典：商品概要」をご参照ください。'
