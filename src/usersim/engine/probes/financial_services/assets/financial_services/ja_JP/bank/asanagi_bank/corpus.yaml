- id: 60455147-ddb3-5046-88b2-0daab7b8a210
  title: 住宅ローン：安全にご利用いただくためのポイント
  body: '住宅ローンをご利用のお客様へ、安心・安全にお取引いただくための重要なポイントをご案内いたします。


    ■当行が絶対にお伺いしない事項

    当行が、電話やメール、ショートメッセージ（SMS）にて、以下の情報を求めることはございません。

    ・暗証番号、ログインパスワード

    ・キャッシュカード番号や身分証の番号

    ・ワンタイムパスワードなどの認証コード


    ■本人確認について

    口座情報の照会や変更などの操作を行う際は、必ず本人確認を実施いたします。当行が確認するのは「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の情報を求められた場合は、速やかに通話を切り、当行の窓口または担当者までご連絡ください。


    ■不正利用が疑われる場合

    身に覚えのない通知が届いた場合や、情報の流出が疑われる場合は、直ちにご連絡ください。迅速に利用停止措置を行い、預金者保護法に基づき誠実に対応いたします。


    不審な連絡への警戒を怠らず、大切なお資産を守る取り組みにご協力をお願い申し上げます。'
