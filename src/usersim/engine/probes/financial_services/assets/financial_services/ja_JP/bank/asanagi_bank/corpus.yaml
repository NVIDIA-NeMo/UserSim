- id: 7414cc74-41d0-5f15-9dd7-30f8e5ffd487
  title: 給与・年金受取特典：お手続きが完了しない・保留中のまま
  body: '給与・年金受取口座の指定手続きを行われたものの、特典が適用されない、または手続きが完了していないと思われる場合の対処法をご案内します。


    【考えられる原因と確認事項】

    1. 初回入金の未確認

    本特典は、受取口座の指定後、実際に初回のご入金（給与または年金）が当行口座に振り込まれた時点で適用されます。振込指定日に正しく入金されているか、通帳または明細をご確認ください。


    2. 書類の不備または未提出

    勤務先や年金事務所への変更届が正しく受理されていない場合、入金が行われないため特典が適用されません。


    【解決方法】

    ・入金が確認できない場合は、まず振込元（勤務先または年金事務所）へ手続きの状況をお問い合わせください。

    ・入金は完了しているが特典が適用されていない場合は、私共へお知らせください。至急、お客様の口座状態を確認いたします。


    【エスカレーションについて】

    入金実績があるにもかかわらずシステム上の適用が保留されているなどの複雑な案件については、私から支店責任者または専門部署へ速やかにエスカレーションし、解決を図ります。確認完了まで、通常数営業日お時間をいただく場合がございます。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: troubleshooting
  source_authority: official
