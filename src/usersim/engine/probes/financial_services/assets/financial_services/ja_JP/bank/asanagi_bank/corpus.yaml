- id: 541ffdbf-4b7c-5560-8cd7-b94bed51035e
  title: 給与・年金受取特典：手数料一覧
  body: '「給与・年金受取特典」適用時のお取引手数料は以下の通りです。本表はサポート担当者がお客様へご案内する際に使用します。


    ■ 他行あて振込手数料（月間）

    ・1回目から3回目まで：0円

    ・4回目以降：所定の手数料を適用


    ■ 時間外ATM利用手数料（月間）

    ・1回目から5回目まで：0円

    ・6回目以降：所定の手数料を適用


    ※4回目以降の振込手数料および6回目以降のATM手数料の具体的な金額については、「普通預金：手数料一覧」をご確認ください。'
