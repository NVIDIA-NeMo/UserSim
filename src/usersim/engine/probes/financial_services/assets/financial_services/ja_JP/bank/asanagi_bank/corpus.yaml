- id: b1579e65-c70c-58c1-8864-c8f7cde89331
  title: 給与・年金受取特典：リスクについてのご説明
  body: '本特典のご利用にあたり、以下のリスクおよび留意点についてあらかじめご了承ください。


    【特典適用の変動リスク】

    本特典（振込・ATM手数料の無料枠および金利上乗せ）は、当行口座を給与または年金の受取口座として継続的に利用することが条件となっております。受取口座の変更や、受取の停止が確認された場合、事前の通知なく特典の適用が終了いたします。


    【金利に関する留意点】

    年金受取の方に適用される0.1%の金利上乗せは、ベースとなる定期預金（スーパー定期）の約定金利に加算されるものです。ベース金利自体が変動する場合、最終的な適用金利も変動いたします。


    【預金保険制度について】

    当行の預金は預金保険制度の対象となっております。この制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【個人情報の取り扱い】

    特典適用のための受取確認等において、個人情報保護法に基づき適切に情報を取り扱います。'
