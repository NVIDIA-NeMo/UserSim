- id: 39f6fc0d-d051-5fcb-a483-f95302a768b1
  title: 朝凪Visaデビット：お申込みとご利用開始
  body: '朝凪Visaデビットのお申込みからご利用開始までの手順をご案内いたします。本カードは、クレジットカードのような審査を待つ必要がなく、スムーズにご利用を開始いただけます。


    【事前準備】

    ・当行の普通預金口座（未開設の方は先に口座開設のお手続きをお願いいたします）

    ・ご本人確認書類


    【お手続きの流れ】

    1. 本人確認：担当者へ「フルネーム（氏名）」および「生年月日」をお伝えください。

    2. お申込み：デビットカードの発行を希望される旨を伝え、必要事項を記入します。

    3. カードの受け取り：後日、ご登録住所へカードが郵送されます。

    4. 利用開始：カードがお手元に届き次第、すぐにVisa加盟店でのご利用が可能です。


    【完了の確認】

    カードがお手元に届き、店頭やオンラインショップで決済が正常に完了した時点で、お手続きはすべて完了となります。インターネットでのご利用には、より安全な本人認証サービス（EMV
    3-Dセキュア）が適用されます。'
