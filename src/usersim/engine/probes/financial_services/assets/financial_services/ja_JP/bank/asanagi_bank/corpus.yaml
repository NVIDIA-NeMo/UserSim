- id: eeab43ae-a60a-5ec1-a673-b1e5e8640de4
  title: 給与・年金受取特典：お申込みとご利用開始
  body: '当行をメインバンクとしてご利用いただき、特典を適用させるための手順をご案内いたします。


    【お手続き前にご準備いただくもの】

    ・当行の普通預金口座

    ・給与振込先変更届（勤務先指定のもの）または年金受取口座変更届


    【ご利用開始までの流れ】

    1. ご本人確認

    対話の中で、お客様の「フルネーム（氏名）」および「生年月日」をお伺いし、ご本人様確認を実施いたします。


    2. 受取口座の指定手続き

    給与または年金の受取口座を当行の口座に指定する手続きを行います。勤務先や年金事務所へ提出する書類への記入について、ご不明な点があれば私たちがサポートいたします。


    3. 特典の適用確認

    指定した口座に、初回のご入金（給与または年金）が確認された時点で、自動的に「給与・年金受取特典」が適用されます。


    4. 特典のご利用

    適用後より、他行あて振込手数料（月3回まで）および時間外ATM手数料（月5回まで）の無料枠がご利用いただけます。また、年金受取の方は定期預金の上乗せ金利0.1%が適用されます。


    お手続きの詳細は「給与・年金受取特典：お申込みいただける方」にてご確認いただけます。'
