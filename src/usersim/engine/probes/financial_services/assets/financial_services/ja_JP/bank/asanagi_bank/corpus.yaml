- id: 20017394-dfc3-51a9-a00c-8f46c8943381
  title: 普通預金：実施中のキャンペーン
  body: '【地域応援・資産形成キャンペーン】


    地域社会の発展に寄与するため、朝凪銀行では普通預金の利用を促進するキャンペーンを実施しております。


    ■期間：2025年1月1日から2025年6月30日まで

    ■内容：

    期間中、当行の普通預金口座をお持ちのお客様全員に、年0.4%の金利を適用いたします。さらに、本口座を「給与受取口座」または「年金受取口座」に指定いただいたお客様には、振込手数料やATM手数料の無料枠を付与する特典制度をご提供いたします。


    【特典の適用について】

    給与・年金の受取口座に設定することで、日常の決済コストを軽減し、より効率的な資産形成をサポートいたします。特典の具体的な内容については「給与・年金受取特典：商品概要」をご参照ください。


    皆様のご利用を心よりお待ちしております。'
