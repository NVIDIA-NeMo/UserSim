- id: a6be88fe-0f4a-59b9-a690-c33069e2824e
  title: apply_card_loan を使う場面
  body: "## 概要\nお客様から「朝凪カードローン」の新規申し込みがあった場合にこの手続きを行います。\n\n## 手続き手順\n1. **本人確認の実施**:\
    \ `verify_identity`を呼び出し、お客様のフルネームと生年月日を確認します。\n2. **必要情報の収集**: 年収や勤務先など、審査に必要な情報を確認します。\n\
    3. **制度の説明**: \n    - 本商品は銀行法に基づき、貸金業法の「総量規制（年収の3分の1まで）」の対象外であることを説明します。\n   \
    \ - ただし、当行で適切に返済能力を審査した上で、利用限度額を決定することを伝えます。\n4. **ツールの実行**: `apply_card_loan`を呼び出し、申し込み手続きを完了させます。\n\
    \n## 注意点\n- 審査があるため、この時点で融資の承認を約束してはいけません。\n- 審査結果および利用限度額は後日通知されることを案内してください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_card_loan
  institution_id: asanagi_bank
