- id: dbf38b9f-d824-5cf5-8c7b-40de0558f6ef
  title: 給与・年金受取特典：解約・変更・プランの切替え
  body: '特典の適用を終了される場合や、受取口座の変更をご希望される際の手続きをご案内します。


    【お手続きの流れ】

    1. 本人確認の実施

    まず、お客さまの「フルネーム（氏名）」と「生年月日」を確認させていただきます。


    2. ご希望内容の受付

    特典の解約、または給与・年金受取口座の変更（他行への切り替え等）のご要望を承ります。


    3. 受取状況の確認と変更処理

    当行にて、現在適用されている特典の内容を確認し、変更手続きを行います。年金受取口座の変更については、別途年金受給権者ご本人による届出が必要となる場合がございます。


    4. 完了のご案内と適用終了日の確認

    手続き完了後、特典が終了するタイミング（例：翌月から適用外となるなど）をご案内します。


    【ご注意事項】

    特典の適用を終了されると、月3回までの他行あて振込無料、月5回までの時間外ATM手数料無料、および年金受取の方への定期預金金利上乗せ（0.1%）がすべて適用外となりますのでご注意ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 264b90d9-7222-5b68-a687-ede6283f91fe
  title: 給与・年金受取特典：想定外の手数料・金額
  body: 'お客さまより「特典を適用しているはずなのに、手数料が引かれている」との申し出があった場合の対応フローです。


    【確認事項と原因の切り分け】

    1. 利用回数の確認

    ・他行あて振込回数が、当月すでに3回を超えていないか確認してください。

    ・時間外ATMの利用回数が、当月すでに5回を超えていないか確認してください。


    2. 特典適用ステータスの確認

    ・口座が正しく「給与受取口座」または「年金受取口座」として登録されているか確認してください。受取が停止している場合、特典は自動的に解除されます。


    3. 適用対象外の取引であるかの確認

    ・振込手数料の無料枠は「他行あて」に適用されます。当行内での振込など、別の規定が適用される取引ではないか確認してください。


    【解決策とエスカレーション】

    ・回数制限によるものである場合は、その旨を丁寧にご説明ください。

    ・システム上の不備や、登録状況に誤りがあると思われる場合は、速やかに支店責任者または専門部署へエスカレーションし、過分に徴収された手数料の返金手続きを検討します。'
