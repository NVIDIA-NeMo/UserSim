  institution_id: asanagi_bank
- id: a72b4ded-c773-5521-9a01-db718dd3ce08
  title: 朝凪Visaデビット：金利・料率の決まり方と適用
  body: "朝凪Visaデビットに適用される諸費用および還元率についてご案内します。\n\n■適用される料率\n・年会費：0円\n  すべてのお客さまに一律で適用され、維持費はかかりません。\n\
    \n・海外利用時の事務手数料：3%\n  日本国外での決済時に、決済金額に対して一律で適用されます。\n\n・キャッシュバック率：0.2%\n  条件を満たしたご利用額に対して適用されます。還元の計算は、決済確定後の金額に基づき行われます。\n\
    \n■料率の変動について\n上記の料率は、当行の規定に基づき決定しております。経済状況の変化やサービス改定により変更となる場合がございます。変更の際は、事前にホームページ等で告知いたします。\n\
    \nなお、本サービスは決済手段であり、カード自体に利息を付与する金利設定はございません。"
