  institution_id: asanagi_bank
- id: 05f7d7a4-c68f-5289-9864-ebd87b73cbd3
  title: 朝凪カードローン：この商品をかたる詐欺にご注意ください
  body: '昨今、当行の「朝凪カードローン」をかたる、巧妙な詐欺の手口が報告されております。お客様の大切な資産を守るため、以下の点に十分ご注意ください。


    【不審な連絡への注意】

    当行職員または当行を名乗る人物が、電話やメール、SMS等で「低金利への切り替え」や「審査なしでの限度額増枠」を提案し、外部サイトへの誘導や個人情報の入力を求めることはございません。特に、不安を煽り、急ぎの手続きを促す場合は詐欺の可能性が非常に高いと考えられます。


    【当行がお伺いすること】

    口座情報の照会や変更などの操作を行う際、当行では本人確認として「フルネーム（氏名）」および「生年月日」の2点のみを確認させていただきます。これ以外の以下の情報は、どのような理由があっても絶対にお伺いいたしません。

    ・暗証番号やパスワード

    ・クレジットカード番号、キャッシングカード番号

    ・身分証明書に記載されている番号

    ・ワンタイムパスワードなどの認証コード


    【万が一、不審な連絡を受けた場合】

    もし不審な連絡を受けたり、誤って情報を伝えてしまったと感じられた場合は、直ちに当行の窓口または電話サポートまでご連絡ください。迅速に利用停止措置などの対応をさせていただきます。


    誠実なサービス提供に努める当行として、お客様に安心してお取引いただけるよう、セキュリティ体制の強化に全力で取り組んでおります。'
