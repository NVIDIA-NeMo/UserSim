- id: b1e17b3d-936d-5ffd-9adf-332d51628a25
  title: 住宅ローン：限度額・制限と注意事項
  body: '住宅ローンをご検討のお客様へ、本商品の限度額および重要な制限事項をご案内いたします。


    【借入条件および限度額】

    ・借入限度額：100,000,000円

    ・最長借入期間（年）：35年


    【費用および注意点】

    ・融資手数料（借入金額に対する割合）：2.2%


    【重要な注意事項】

    ・借入限度額は最大100,000,000円となっておりますが、実際のご融資額は、お客様の年収、勤続年数、その他の債務状況などの返済能力を適切に審査した上で決定いたします。

    ・本ローンをご利用いただく際は、団体信用生命保険への加入が必須となります。これにより、ご契約者が死亡または高度障害状態になった際、保険金でローン残高が完済される仕組みとなっております。

    ・審査の結果、ご希望の金額や期間での融資が難しい場合がございます。その際は、担当者が誠実に説明責任を果たし、最適なプランを提案いたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
