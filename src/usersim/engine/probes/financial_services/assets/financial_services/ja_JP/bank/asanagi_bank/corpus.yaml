- id: 8c5e12cf-e05d-512b-ba4c-55b4f136212f
  title: 朝凪Visaデビット：商品概要
  body: '朝凪Visaデビットは、お買い物をした瞬間に、お客様の普通預金口座から代金が即時に引き落とされる、利便性と安心感を兼ね備えたVisaデビットカードです。現金を持ち歩く必要がなく、世界中のVisa加盟店でご利用いただけます。


    【本商品の特長】

    ・お支払いと同時に口座から引き落としが行われるため、後からまとめて請求が来る心配がなく、計画的な支出管理が可能です。

    ・ご利用金額に応じて、0.2%のキャッシュバックを提供しており、日々の決済がお得になります。

    ・年会費は0円で、どなたでも気軽にご利用いただけます。


    【ご利用条件と制限】

    ・1日あたりの利用限度額（初期設定）は500,000円となっております。

    ・海外でのご利用時には、3%の事務手数料が加算されます。


    本カードをご利用いただくには、当行の普通預金口座が必要となります。口座の詳細については「普通預金：商品概要」をご参照ください。'
