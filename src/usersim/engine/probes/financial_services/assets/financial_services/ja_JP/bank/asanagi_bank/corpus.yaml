  body: "本ツールは、インターネットバンキングの登録振込先リストを管理するために使用します。エージェントは本ツールを用いて登録情報の更新を直接行います。\n\
    \n【ツール仕様】\n- ツール名: update_beneficiary\n- 引数:\n    - 操作内容: 「追加」「変更」「削除」のいずれか\n\
    \    - 振込先詳細: 金融機関名、支店名、口座番号、受取人名（追加・変更時に必要）\n    - 識別情報: 変更・削除対象の受取人を特定するための情報\n\
    - 実行内容: 顧客の登録振込先リストを更新します。\n\n※本ツールを呼び出す前に、必ず `verify_identity` による本人確認を完了させてください。"
