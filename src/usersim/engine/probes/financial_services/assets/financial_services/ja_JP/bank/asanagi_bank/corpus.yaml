  institution_id: asanagi_bank
- id: dee6f326-f696-50c8-8d76-959f9319e10e
  title: スーパー定期：ログインできない・アクセスできない
  body: 'インターネットバンキング等で「スーパー定期」の残高確認や手続きができず、ログインできない場合の対処法をご案内いたします。


    ■考えられる原因

    ・パスワードの入力間違い（大文字・小文字の区別など）

    ・一定回数の認証失敗によるアカウントの一時ロック

    ・ご利用端末のブラウザ設定やキャッシュの影響


    ■ご確認いただきたい事項（順序通りにお試しください）

    1. 入力内容の再確認：CapsLockキーなどがオンになっていないか、全角入力になっていないかをご確認ください。

    2. ブラウザの更新：一度ブラウザを閉じ、再度アクセスしてログインをお試しください。


    ■解決しない場合の対応

    上記を確認してもログインできない場合は、担当者が本人確認を行った上でロックの解除やパスワードの再設定を承ります。「フルネーム（氏名）」と「生年月日」をお伝えいただき、状況をご説明ください。


    ■エスカレーションについて

    パスワードの再発行ができない、または不正アクセスの疑いがあるなどの複雑な案件については、担当者から支店責任者または専門部署へ速やかにエスカレーションいたします。解決までにお時間をいただく場合がございますが、透明性のあるプロセスで迅速に解決を図ります。'
  domain: retail_banking
  product_category: super_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: acf70983-75ca-59dc-bae4-0ddc50f6ab49
  title: スーパー定期：ご利用条件による違い
  body: '「スーパー定期」のご利用可否および条件に関する判定基準は以下の通りです。担当者は本表に基づき案内してください。


    | 確認項目 | 条件・しきい値 | 判定結果 |

    | :--- | :--- | :--- |

    | 預入金額 | 1,000円以上 | ご利用可能 |

    | 預入金額 | 1,000円未満 | ご利用不可 |

    | 本人確認 | 氏名・生年月日の照合完了 | お手続き可能 |

    | 本人確認 | 不一致または提示不能 | お手続き不可 |

    | 口座状態 | 当行の普通預金口座を保有 | 即時開設可能 |

    | 口座状態 | 口座未保有 | 新規口座開設後に可能 |


    ※最低預入金額の1,000円を満たしていない場合は、普通預金での運用をご提案ください。'
  domain: retail_banking
  product_category: super_teiki
