- id: 5d3c79df-aee4-5911-baa8-289e249ba645
  title: 普通預金：リスクについてのご説明
  body: '普通預金のご利用にあたり、以下のリスクおよび制度についてあらかじめご了承ください。


    【物価上昇（インフレ）リスク】

    普通預金の金利は年0.4%となっておりますが、物価上昇率がこの金利を上回った場合、実質的な資産価値が低下するリスクがあります。資産形成にあたっては、定期預金やNISAなどの多様な手法を検討されることをお勧めします。


    【預金保険制度について】

    当行の普通預金は預金保険制度の対象です。万一、当行が破綻した場合であっても、預金保険法に基づき、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【税金について】

    普通預金に付与される利息には、所得税および復興特別所得税、地方税として合計20.315%の税金がかかります。税引き後の金額が口座に入金されます。


    【コンプライアンスについて】

    当行は銀行法および金融庁の監督の下、厳格なコンプライアンス体制を構築しています。犯罪収益移転防止法に基づき、不自然な取引や本人確認が不十分な場合は、口座利用を制限させていただく場合がございます。


    詳細な重要事項については、「普通預金：重要事項のご説明」をご確認ください。'
