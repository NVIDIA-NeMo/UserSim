  title: スーパー定期：必要書類
  body: '「スーパー定期」のお申込みに必要な書類は、お客様のご状況によって異なります。


    | お客様の状態 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | すでに当行に口座をお持ちの方 | 通帳、お届け印（または署名） | 普通預金口座からのお振替で開設可能です |

    | 新たに口座を開設される方 | ご本人確認書類（運転免許証、マイナンバーカード等） | 犯罪収益移転防止法に基づき、適正な本人確認を実施します |

    | 法人としてお申込みの方 | 法人実在証明書、代表者様のご本人確認書類 | 詳細は窓口にてご案内いたします |'
