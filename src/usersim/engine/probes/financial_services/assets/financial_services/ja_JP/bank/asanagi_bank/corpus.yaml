- id: 6a69dd39-aceb-51ca-bae3-fcc2d71b1627
  title: update_beneficiary を使う場面
  body: "インターネットバンキングにおける登録振込先（受取人）の追加、変更、または削除を希望されるお客様に対応する場合に本手続きを実施します。\n\n【手続き手順】\n\
    1. `verify_identity` を呼び出し、お客様のフルネームと生年月日の2点を確認し、本人確認を完了します。\n2. お客様に、登録先の「追加」「変更」または「削除」のいずれを希望されるか確認します。\n\
    3. 操作内容に応じて、以下の情報を確認します。\n    - 追加・変更の場合: 金融機関名、支店名、口座番号、受取人名\n    - 削除の場合: 現在登録されている振込先の特定情報\n\
    4. `update_beneficiary` を呼び出し、登録内容を更新します。\n\n登録後の振込操作については、「transfer_funds を使う場面」の手順に従ってください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: asanagi_bank
