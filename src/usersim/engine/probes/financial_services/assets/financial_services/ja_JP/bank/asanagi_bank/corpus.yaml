- id: e6f79e82-97a8-5c9f-b0ed-f3c818f56c22
  title: スーパー定期：リスクについてのご説明
  body: '「スーパー定期」をご利用いただくにあたり、以下のリスクおよび留意事項を必ずご確認ください。


    ■流動性リスク（中途解約による影響）

    本商品は、あらかじめ定めた期間まで資金を預けることで高い金利を得る仕組みです。満期前に解約される場合は「中途解約利率」が適用されます。この利率は当初の約定金利（例：5年ものの
    1.05% など）よりも低いため、期待していた利息が得られないリスクがあります。余裕資金での運用をお勧めいたします。


    ■税金に関する留意事項

    適用される金利は税引前の数値です。実際にお支払いされる利息からは、20.315% の税金が差し引かれます。実質的な収益を計算される際は、この税率をご考慮ください。


    ■預金保険制度による保護

    本商品は預金保険制度の対象です。当行が破綻した場合であっても、預金保険機構により、1金融機関につき預金者1人当たり元本 1,000万円 までとその利息が保護されます。1,000万円を超える元本および利息については、保護の対象外となりますのでご注意ください。


    ■元本保証について

    本商品は元本保証型の預金商品であり、市場の変動により元本が減少することはありません。'
