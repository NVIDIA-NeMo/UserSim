- id: d92d4b6a-3229-57e0-96a0-1dde4c40cec7
  title: 給与・年金受取特典：時間外ATM手数料の無料回数（月）について
  body: '【Q】時間外ATM手数料の無料回数は、月に何回まで利用できますか？

    【A】「給与・年金受取特典」を適用されているお客さまは、時間外ATM手数料が月5回まで無料となります。


    【Q】月に5回を超えて時間外ATMを利用した場合、どうなりますか？

    【A】6回目以降のご利用分からは、通常の手数料が適用されます。ご利用状況については「普通預金：手数料一覧」をご参照ください。


    【Q】無料回数は月途中でリセットされますか？

    【A】はい。毎月1日に無料回数がリセットされます。'
