- id: 88bc2056-5d98-5cb6-a9ac-a73278885896
  title: スーパー定期：金利・料率の決まり方と適用
  body: '「スーパー定期」の金利適用ルールについて、担当者は以下の基準に基づきお客様へご案内ください。


    ■適用金利（年率・税引前）

    お客様が選択された預入期間に応じて、以下の固定金利が適用されます。

    ・1年もの：0.55%

    ・3年もの：0.85%

    ・5年もの：1.05%


    ■金利の決定と適用タイミング

    金利は預入時に決定し、満期まで変更されません。利息は日割り計算で算出され、満期時に一括して（または約定の支払方法に従って）お支払いします。


    ■適用外または変更となるケース

    ・中途解約：満期前に解約された場合は、上記約定金利ではなく「中途解約利率」が適用されます。

    ・最低預入金額：本金利を適用するためには、最低預入金額 1,000円 以上の預入れが必要です。


    金利の改定が行われた場合、新規お申込み分から新金利が適用されます。既にお預かりしている預金については、当初の約定金利がそのまま維持されます。'
