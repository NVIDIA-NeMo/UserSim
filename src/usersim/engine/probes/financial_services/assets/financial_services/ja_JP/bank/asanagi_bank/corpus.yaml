  institution_id: asanagi_bank
- id: 1c0e3f61-740a-52ff-903e-08a3b99d2f80
  title: 住宅ローン：借入限度額について
  body: 'Q：住宅ローンで最大いくらまで借りることができますか？

    A：当行の住宅ローンの借入限度額は100,000,000円です。ただし、この金額までどなたでもお借入れいただけるわけではありません。お客様の返済能力（年収や現在の借入状況など）を適切に審査し、個別に利用限度額を決定させていただきます。


    Q：借入限度額を決定する際の基準は何ですか？

    A：主に、ご提出いただく所得証明書に基づいた返済能力の審査、および担保となる物件の価値などを総合的に判断いたします。詳細は「住宅ローン：限度額・制限と注意事項」をご確認ください。'
