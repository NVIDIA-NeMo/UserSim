    当行の「普通預金」を給与受取口座または年金受取口座としてご利用中のお客様が「朝凪カードローン」にお申込みいただいた場合、当行内での取引実績を最大限に考慮し、通常よりも迅速な審査回答を目指します。


    **■適用条件**

    ・期間中にお申込みを完了されること。

    ・当行の口座で給与または年金の受取実績があること。


