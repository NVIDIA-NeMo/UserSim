- id: ad0a470c-c55f-5e69-8c28-104aa3c087d7
  title: 朝凪カードローン：お取引が拒否された・制限された
  body: '「カードローンから借入ができない」「利用限度額に達していないのに拒否される」などの症状が発生した場合の確認事項です。


    ■考えられる原因

    1. 利用限度額の超過：審査時に設定された限度額まで利用している。

    2. 返済の遅延：前回までのお支払いが確認できておらず、一時的に利用が制限されている。

    3. 本人確認情報の不備：住所変更などの届出がなされておらず、コンプライアンス上の理由で制限がかかっている。

    4. カードの有効期限切れや磁気不良：物理的なカード利用時の不具合。


    ■確認と解消の手順

    1. まず、直近の返済が正常に完了しているか、口座残高をご確認ください。

    2. 担当者に状況をお伝えいただき、本人確認（フルネームと生年月日）を実施します。

    3. 担当者が制限の理由（例：返済遅延、書類不備など）を特定します。

    4. 原因に応じた解消手続きを行います。

    　・返済遅延の場合：至急のご返済を案内し、入金確認後に制限解除を検討します。

    　・情報不備の場合：最新の住所や連絡先の確認を行い、手続きを完了させます。


    ■エスカレーションについて

    上記の手順で解決せず、システム的なエラーが疑われる場合や、複雑な制限解除が必要な場合は、担当者から支店責任者または専門部署へ速やかにエスカレーションし、解決を図ります。'
