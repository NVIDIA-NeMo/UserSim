- id: 100e4477-2fde-52d5-8372-7c65fe6a7b3b
  title: 手数料・料金のご案内
  body: '当行では、システムの維持および安全な取引環境を提供するため、適正な手数料を設定しております。


    多くのお取引において共通の基本手数料が適用されますが、給与受取口座や年金受取口座として当行をメインバンクにご利用いただいているお客様には、振込手数料やATM利用手数料の無料枠などの特典を提供しております。これにより、お客様の日常的なコスト負担を軽減し、長期的な信頼関係を築くことを目指しております。


    各商品ごとの具体的な手数料については、「普通預金：手数料一覧」や「朝凪Visaデビット：手数料一覧」などの各商品専用の案内をご確認ください。'
  domain: retail_banking
