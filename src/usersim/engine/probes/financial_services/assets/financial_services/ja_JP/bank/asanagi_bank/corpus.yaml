- id: 1a1c3949-d3c9-56d4-9efd-7b0ac47b2a2d
  title: 普通預金：ご利用開始までの手順
  body: '普通預金口座を開設し、ご利用を開始するまでの手順をご案内いたします。地域に根ざした誠実なサービスで、お客様の日常の決済をサポートいたします。


    【お手続きの流れ】

    1. お申込みと本人確認

    まずは口座開設のお申込みをお願いいたします。犯罪収益移転防止法に基づき、厳格な本人確認を実施いたします。確認事項は「フルネーム（氏名）」および「生年月日」の2点です。あわせて、有効な身分証明書のご提示をお願いしております。


    2. 口座情報の作成

    本人確認後、当行にて口座番号を発行し、普通預金口座を開設いたします。これにより、0.4%の金利が適用される預金口座がご利用可能となります。


    3. キャッシュカード・通帳の発行

    お取引に必要なキャッシュカードおよび通帳を発行いたします。これらの発行には通常、数営業日のお時間をいただきます。なお、紛失等により再発行が必要な場合は、再発行手数料として1,100円を申し受けます。


    4. 初回のご入金と利用開始

    口座開設後、ATMまたは窓口にて初回のご入金をお願いいたします。以降、日常的なお取引や、他行あて振込（インターネットバンキング利用で220円）などがご利用いただけます。


    【ご注意事項】

    ・預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。

    ・詳細な利用条件については、「普通預金：お申込みとご利用開始」をご確認ください。'
