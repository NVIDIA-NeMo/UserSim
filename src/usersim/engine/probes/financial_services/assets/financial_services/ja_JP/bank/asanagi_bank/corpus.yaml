- id: bf4c7207-abcb-5ab9-8b88-680c93bbee1b
  title: 朝凪カードローン：規定・約款の変更
  body: '本規定は、「朝凪カードローン」の利用に関する契約条件および、その変更手続きについて定めるものです。


    ■規定・約款の変更について

    当行は、法令の改正、金融庁の監督指針の変更、または社会経済情勢の変化に伴い、本規定および約款を変更することがあります。変更の内容および適用日は、当行ウェブサイトへの掲載または書面での通知によりお客様に周知いたします。


    ■適用される条件

    ・貸付金利：お客様の審査結果に基づき、年2%から年14.5%の範囲内で決定されます。

    ・利用限度額：審査により、最大8,000,000円まで設定されます。

    ・返済義務：お客様は、毎月2,000円以上の最低返済額を、指定の期日までに完済までお支払いいただきます。


    ■契約の終了

    お客様からの解約申出、または当行が定める期限利益喪失事由に該当した場合、本契約は終了し、借入残高の一括返済を求めることがあります。変更後の条件に同意いただけない場合は、速やかに担当窓口までご相談ください。'
