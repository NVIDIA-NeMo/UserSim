- id: 4dffd2e1-94ad-58e8-984a-82454b9568f1
  title: スーパー定期：お手続きが完了しない・保留中のまま
  body: 'スーパー定期のお申し込み手続きが完了せず、保留状態となっている場合に考えられる原因と対処法をご案内いたします。


    【考えられる原因と確認事項】

    1. 普通預金口座の残高不足

    普通預金から定期預金へ資金を振り替える際、預入金額（最低1,000円以上）に不足がある場合、手続きが完了しません。最新の残高をご確認ください。


    2. 本人確認情報の不一致

    ご提示いただいた「フルネーム（氏名）」または「生年月日」が、当行に登録されている情報と異なる場合、セキュリティ保護のため手続きを中断いたします。登録内容に誤りがないか改めてご確認ください。


    3. システムの一時的な不具合

    通信環境の影響などで手続きが保留となる場合がございます。一度画面を更新し、再度お手続きをお試しください。


    【解決しない場合】

    上記を確認しても解決しない場合は、当行にて詳細な調査を行います。担当者が支店責任者または専門部署へ速やかにエスカレーションし、原因の究明と解消に向けて対応いたします。調査結果については、改めて担当者よりご連絡差し上げます。'
