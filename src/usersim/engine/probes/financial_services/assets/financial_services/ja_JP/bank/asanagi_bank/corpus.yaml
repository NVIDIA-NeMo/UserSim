- id: bc56d808-8ead-5591-8a29-933dbc27efb5
  title: 朝凪Visaデビット：個人情報の取扱い
  body: '当行は、「朝凪Visaデビット」のご提供にあたり、お客様の個人情報を個人情報保護法および犯罪収益移転防止法に従い、厳格に取り扱います。


    ■個人情報の利用目的

    お客様からお預かりした個人情報（氏名、生年月日、住所、電話番号等）は、以下の目的で利用いたします。

    ・本人確認および口座開設、カード発行手続きのため

    ・カード利用時の不正検知およびセキュリティ管理のため

    ・当行からの重要なお知らせや、本サービスの改善に関するご案内（同意を得た場合のみ）のため


    ■安全管理措置

    お預かりした情報は、高度なセキュリティシステムによって保護され、権限のない従業員によるアクセスを制限しております。また、外部への提供は、法令に基づく請求がある場合や、Visaネットワーク等の決済処理に必要な範囲を除き、お客様の同意なく第三者に提供することはありません。


    ■お客様の権利

    お客様は、ご自身の個人情報の開示、訂正、利用停止を求めることができます。これらのご要望がある場合は、担当者までお知らせください。本人確認のため、「フルネーム（氏名）」および「生年月日」の確認をさせていただきます。


    ■犯罪収益移転防止法への対応

    口座開設およびカード発行時には、法律に基づき、ご本人様であることを確認するための手続きが必要です。ご協力をお願い申し上げます。これにより、地域社会の安全と健全な金融取引の維持に寄与いたします。'
