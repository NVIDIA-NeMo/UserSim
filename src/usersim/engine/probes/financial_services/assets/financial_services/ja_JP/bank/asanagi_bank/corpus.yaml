- id: a987bd77-6b29-5e78-a6d4-7a30cc073262
  title: 朝凪Visaデビット：規定・約款の変更
  body: '本規定は、「朝凪Visaデビット」のご利用に関する約款の変更手続きおよび、適用される条件について定めたものです。


    ■約款の変更について

    当行は、法令の改正、金融庁の監督指針の変更、またはサービス向上のため、本約款の内容を変更することがあります。変更を行う場合は、適用日の1ヶ月前までに、当行の店頭への掲示またはインターネットバンキング等を通じてお客様に告知いたします。告知期間を経て適用された変更は、お客様に同意いただいたものとみなされます。


    ■利用者の義務と責任

    お客様は、カードの管理に十分な注意を払う義務を負います。特に、1日あたりの利用限度額（初期設定：500,000円）の管理や、暗証番号の厳重な保管をお願いいたします。不適切な管理により第三者にカードを利用させた場合、預金者保護法に基づき、故意や重大な過失があるとは認められない限り原則として当行が補償いたしますが、過失の程度により補償額が減額される場合がございます。


    ■手数料および費用

    本カードの年会費は0円として提供しております。ただし、海外利用時の事務手数料として3%が適用されます。これらの手数料率に変更が生じる場合は、前述の告知手順に従いお知らせいたします。


    ■契約の終了

    お客様が口座を解約された場合、または当行が本サービスを終了させる場合、本契約は終了いたします。終了時に未決済の利用分がある場合は、速やかに精算されるものとします。'
