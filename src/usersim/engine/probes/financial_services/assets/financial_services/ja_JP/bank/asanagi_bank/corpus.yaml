- id: 8e26b09b-f446-56ce-b7ed-8f44f4e0ca95
  title: スーパー定期：5年ものの金利について
  body: '【よくあるご質問】


    Q：5年ものの金利はどのくらいですか？

    A：「スーパー定期」の5年もの金利は、年 1.05%となっております。長期でお預けいただくことで、より高い金利での資産形成が可能です。


    Q：5年ものを申し込む際の最低金額はありますか？

    A：はい。最低預入金額は1,000円からとなっております。


    Q：5年経つ前に解約することはできますか？

    A：可能です。ただし、満期前に解約される場合は、当初の約定金利よりも低い「中途解約利率」が適用されますのでご注意ください。


    詳細な条件については、「スーパー定期：商品概要」をご参照ください。'
