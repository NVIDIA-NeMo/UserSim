- id: 7877d9cf-0d60-532f-88d2-d49e24b78fdc
  title: スーパー定期：想定外の手数料・金額
  body: 'お客様より「満期に受け取った金額が想定より少ない」「利息が低い」といったお問い合わせをいただいた際の対応手順です。


    ■想定される原因と確認事項

    1. 中途解約の適用

    お客様が満期日より前に解約手続きを行わなかったか確認してください。満期前解約の場合、約定金利ではなく「中途解約利率」が適用されるため、受取利息が大幅に減少します。


    2. 税金の差し引き

    提示した金利は「税引前」である点をご案内ください。実際には利息から 20.315% の税金が差し引かれます。お客様が税引前の金額で計算されているケースが多く見られます。


    3. 計算期間の相違

    預入日から起算して正確な日数が経過しているか、または途中で一部解約が行われていないかを確認してください。


    ■解決策と案内

    ・中途解約利率の適用について：規定に基づき、満期前解約時の利率が適用されたことを説明し、ご理解をいただきます。

    ・税金について：20.315% の税率が適用される仕組みを丁寧に説明します。


    ■エスカレーションについて

    上記の説明を行っても納得いただけない場合や、システム上の計算誤りが疑われる場合は、速やかに支店責任者または専門部署へエスカレーションし、再計算と詳細な内訳提示を行ってください。'
