  body: '住宅ローンに適用される金利および料率は以下の通りです。


    【適用金利（優遇後）】

    ・変動金利：1.375%

    ・固定金利期間選択型10年：3.7%


    【適用料率】

    ・融資手数料（借入金額に対する割合）：2.2%


    ※上記金利は優遇後の適用金利です。適用される金利は、審査結果や借入条件によって変動する場合があります。また、変動金利の返済額については5年ごとに見直しを行い、見直し後の返済額の上限を、見直し前の返済額の125%として設定しております。'
