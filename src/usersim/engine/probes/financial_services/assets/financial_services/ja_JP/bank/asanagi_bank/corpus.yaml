- id: 0eea1d64-604e-506c-b30f-0909218887ae
  title: 給与・年金受取特典：おすすめの方と主な使い方
  body: '朝凪銀行をメインバンクとしてご利用いただき、日常のコストを抑えながら効率的に資産形成を行いたい方におすすめの特典制度です。


    【このような方におすすめです】

    ・毎月、他行へのお振込手続きがある方

    ・ATMを時間外に利用することが多く、手数料を軽減したい方

    ・年金を受取口座に指定し、あわせて定期預金での資産形成を検討されている方


    【主な特典内容】

    当行の口座を給与または年金の受取口座に設定していただくだけで、以下のサービスを無料でご利用いただけます。


    ・他行あて振込手数料：月3回まで無料

    ・時間外ATM手数料：月5回まで無料


    さらに、年金を受取口座に指定されているお客さまには、資産形成をサポートする特別な金利を適用いたします。

    ・年金受取の方の定期預金金利上乗せ：0.1%


    日常の決済から将来への備えまで、包括的にサポートすることで、地域のお客さまの豊かな生活に寄与いたします。詳細な条件については「給与・年金受取特典：商品概要」をご確認ください。'
