- id: c5613e1a-1f49-5252-bcb4-b8a13a8a2865
  title: 普通預金：お申込みいただける方
  body: '普通預金口座のお申込みに関する適格性基準は以下の通りです。


    | 条件項目 | 内容・しきい値 | 結果 |

    | :--- | :--- | :--- |

    | 居住地 | 日本国内に住所を有していること | 申込み可能 |

    | 本人確認 | フルネームおよび生年月日の提示、および公的証明書の提示ができること | 申込み可能 |

    | 年齢 | 制約なし（未成年の場合は法定代理人の同意が必要） | 申込み可能 |

    | 法令遵守 | 犯罪収益移転防止法に基づく取引時確認に同意すること | 申込み可能 |


    詳細は「普通預金：重要事項のご説明」をご参照ください。'
