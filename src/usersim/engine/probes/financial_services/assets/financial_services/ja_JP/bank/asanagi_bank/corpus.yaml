- id: 07356eca-274b-5918-993c-77b61dfb6497
  title: 朝凪カードローン：状況・履歴の確認
  body: '朝凪カードローンの現在の借入残高や、過去のご利用・ご返済履歴を確認する手順をご案内いたします。


    ■ご確認前にご準備いただくもの

    ・ご本人様確認のための情報（フルネームおよび生年月日）


    ■確認の手順

    1. 担当者へ「カードローンの利用状況と履歴を確認したい」旨をお伝えください。

    2. 本人確認のため、ご自身の「フルネーム（氏名）」と「生年月日」をお伝えください。

    3. 担当者がシステムにて照会を行い、以下の内容を回答いたします。

    　・現在のご利用残高

    　・適用されている貸付金利

    　・直近のご返済日および返済金額

    　・次回のお支払期日と予定金額

    4. 詳細な利用明細が必要な場合は、その旨をお伝えください。書面またはデジタル形式での提供についてご案内いたします。


    ■ご確認完了の目安

    担当者から最新の残高と次回返済額が提示され、お客様のご認識と一致した時点で確認完了となります。


    ※暗証番号やパスワードをお伺いすることはございません。不審な要求があった場合は、すぐにお知らせください。'
