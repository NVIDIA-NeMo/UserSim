- id: 66ecaabd-0d84-5d3d-ab21-1fa9c88ef528
  title: スーパー定期：安全にご利用いただくためのポイント
  body: '朝凪銀行では、お客様の大切な資産を安全に守るため、厳格なセキュリティ体制を構築しております。「スーパー定期」をご利用の際は、以下のポイントに十分ご注意ください。


    1. 個人情報の取り扱いについて

    当行が口座情報の照会や変更などの手続きを行う際、本人確認として伺うのは「フルネーム（氏名）」および「生年月日」の2点のみです。これら以外の暗証番号、パスワード、キャッシュカード番号、身分証番号などを電話やメールでお伺いすることは一切ございません。このような要求があった場合は、詐欺の可能性が高いため、絶対に応じないでください。


    2. 不審な連絡への警戒

    「定期預金の金利が大幅に上がったため、手続きが必要である」といった、不安を煽る電話やメールにご注意ください。当行からそのような案内を急かすことはございません。


    3. 不正利用への対応

    万が一、キャッシュカードの紛失や盗難に気づいた際は、直ちに当行へご連絡ください。迅速に利用停止措置を行い、預金者保護法に基づき誠実に対応いたします。


    安全な取引環境を維持するため、お客様のご協力をお願い申し上げます。'
  domain: retail_banking
  product_category: super_teiki
  document_type: security_advisory
  source_authority: official
