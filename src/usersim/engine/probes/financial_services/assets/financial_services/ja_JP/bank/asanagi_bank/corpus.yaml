- id: ba3251c1-3afb-5ffa-bea3-4fdfd365239b
  title: 普通預金：商品概要
  body: '朝凪銀行の「普通預金」は、日常的な決済や給与・年金の受取に最適な、利便性の高い基本口座です。地域に根ざした当行ならではの誠実なサービスで、幅広い世代のお客様の資産管理をサポートいたします。


    【商品特長】

    ・いつでも自由にお預入れと お引出しが可能です。

    ・給与受取口座や年金受取口座としてご利用いただけます。

    ・公共料金などの口座振替設定が可能です。


    【適用金利】

    ・普通預金の金利：0.4%


    【ご利用手数料】

    ・他行あて振込手数料（インターネットバンキング）：220円

    ・時間外のATM利用手数料：110円

    ・キャッシュカード・通帳の再発行手数料：1,100円


    【安心の保護制度】

    当行は金融庁の監督を受けており、預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    詳細な手数料については「普通預金：手数料一覧」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
