- id: 60577aee-329f-5aea-91dd-1a086d67ccc1
  title: 朝凪Visaデビット：状況・履歴の確認
  body: '「朝凪Visaデビット」のご利用状況や取引履歴を確認する際の手順をご案内します。


    【ご用意いただくもの】

    特に書類のご用意は不要ですが、ご本人確認のため以下の情報をお伺いします。


    【お手続きの流れ】

    1. ご本人確認：お客様の「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認します。

    2. 照会内容の指定：確認したい期間や、特定の取引内容についてお伝えください。

    3. 履歴の提示：当行にて最新の利用履歴を確認し、お取引金額や利用店舗名、決済日時をご案内いたします。

    4. 確認完了：提示された内容に相違がないかをご確認いただきます。


    【ご確認いただきたいポイント】

    ・デビットカードの特性上、お取引と同時に口座から引き落としが行われるため、普通預金口座の入出金明細と照らし合わせてご確認いただけます。

    ・海外利用分については、3%の事務手数料が加算された金額で記載されます。'
