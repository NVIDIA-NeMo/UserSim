  mentions_tools: []
  institution_id: asanagi_bank
- id: c001b345-266d-5d8e-8ad2-9c27147a010e
  title: 給与・年金受取特典：明細や記録と合わない
  body: "お客様から「無料回数内のはずなのに手数料が引かれている」などのご指摘を受けた際の対応手順です。\n\n【確認ステップ】\n1. 対象期間の取引明細を照会し、該当する取引の日時と金額を確認します。\n\
    2. 当月の「他行あて振込」および「時間外ATM利用」の累計回数を算出します。\n   - 振込回数が3回を超えていないか\n   - ATM利用回数が5回を超えていないか\n\
    3. 給与または年金の受取実績が、該当月の前月までにあるかを確認します。受取が途絶えている場合、特典は適用されません。\n\n【原因の切り分け】\n・回数オーバーの場合：お客様に利用回数の上限（振込月3回、ATM月5回）について丁寧に説明し、ご理解をいただきます。\n\
    ・条件未充足の場合：受取口座指定が解除されている可能性を伝え、再設定をご案内します。\n\n【修正対応（エスカレーション）】\n調査の結果、回数内であり条件も満たしているにもかかわらず手数料が徴収されていた場合は、速やかに「手数料誤徴収」としてケースを起票してください。確認後、速やかに対象金額を口座へ返金処理いたします。お客様には、返金完了までにお時間をいただく旨と、完了後の通知方法についてご案内ください。"
