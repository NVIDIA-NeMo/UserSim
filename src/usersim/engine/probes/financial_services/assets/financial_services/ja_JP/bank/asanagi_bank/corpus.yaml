  institution_id: asanagi_bank
- id: 8b422f9c-7b1f-5c34-b5bd-f691abc06136
  title: 朝凪カードローン：金利・料率の決まり方と適用
  body: '「朝凪カードローン」の金利決定プロセスおよび適用方法について、担当者向けに解説します。


    ■適用金利の範囲

    ・貸付金利（下限）：2%

    ・貸付金利（上限）：14.5%


    ■金利の決定方法

    金利は一律ではなく、個別の審査によって決定されます。主に以下の要素を総合的に判断します。

    ・年収および安定した収入の有無

    ・勤続年数および雇用形態

    ・他金融機関における借入状況（信用情報機関の照会結果）

    ・当行との取引実績


    ■金利の適用と計算

    決定された金利は、借入残高に対して日割りで計算され、毎月の返済日に合算して請求されます。金利の変更は、原則として当行の規定に基づき、審査の再実施や市場金利の変動に応じて行われる場合があります。'
