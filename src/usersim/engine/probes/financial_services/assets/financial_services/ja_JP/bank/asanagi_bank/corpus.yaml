- id: 911ccb76-d55c-51df-9b8a-3b357d2de7cd
  title: 住宅ローン：状況・履歴の確認
  body: '現在住宅ローンをご利用中のお客様が、借入残高や返済履歴を確認される際の手順をご案内いたします。


    【ご準備いただくもの】

    ・ご本人様であることを確認できる情報（フルネームおよび生年月日）


    【お手続きの流れ】

    1. 担当窓口または電話サポートにて、住宅ローンの状況照会を依頼してください。

    2. 本人確認のため、フルネーム（氏名）と生年月日をお伝えください。

    3. 確認が完了した後、以下の内容について回答いたします。

    　・現在のローン借入残高

    　・次回のお支払日およびお支払金額

    　・これまでの返済履歴（詳細な明細が必要な場合は、書面での発行を承ります）


    【完了の確認】

    提示された残高および次回支払額が、お手元の返済予定表や記録と一致していることをご確認ください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: how_to_guide
