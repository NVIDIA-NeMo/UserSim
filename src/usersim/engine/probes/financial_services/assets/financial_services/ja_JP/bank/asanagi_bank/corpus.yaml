  institution_id: asanagi_bank
- id: f2847f6c-0f4a-5646-a141-acf37f49aab1
  title: 住宅ローン：登録内容の変更
  body: 'ご住所やご連絡先など、住宅ローンにご登録いただいている内容を変更される際の手順をご案内いたします。


    ■ご用意いただくもの

    ・ご本人確認書類（運転免許証、マイナンバーカードなど）


    ■お手続きの流れ

    1. 本人確認の実施

    担当者に「登録内容の変更希望」である旨をお伝えください。まず、ご本人確認のため「フルネーム（氏名）」と「生年月日」をお伺いします。


    2. 変更内容の提示

    変更後の新しいご住所や電話番号などの情報を担当者に提示してください。


    3. 内容の確認と受理

    担当者が提示された内容をシステムに反映し、変更内容に誤りがないか最終確認を行います。


    4. 完了通知の受領

    手続き完了後、変更内容を記した通知書が発送されます。お手元に届いた際、内容に相違がないかをご確認ください。


    ※個別の税務相談や法的助言は行っておりませんので、必要に応じて専門家へご相談ください。'
