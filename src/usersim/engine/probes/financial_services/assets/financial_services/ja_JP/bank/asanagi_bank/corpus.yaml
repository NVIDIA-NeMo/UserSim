  mentions_tools: []
  institution_id: asanagi_bank
- id: 5d579727-f641-5e80-87ba-6e5449911568
  title: 給与・年金受取特典：規定・約款の変更
  body: '本特典の適用に関する規定および約款の変更についてご案内いたします。


    ■規定の変更について

    当行は、銀行法および金融庁の監督に基づき、適正な手数料体系を維持するため、本特典の内容（無料回数や適用条件など）を改定することがあります。改定にあたっては、適用開始日の1ヶ月前までに、店頭掲示または当行ウェブサイトにて告知いたします。


    ■適用条件の維持

    本特典（他行あて振込手数料の月3回無料、時間外ATM手数料の月5回無料）は、継続的に給与または年金の受取実績があることを条件として適用されます。受取口座の変更等により実績が確認できなくなった場合、次月より通常の振込・ATM手数料が適用されますのでご注意ください。


    ■年金受取の方への金利上乗せ

    年金受取口座としてご利用いただいている方に適用される「定期預金金利の上乗せ幅 0.1%」については、適用される定期預金商品の約定時に規定された条件に基づきます。


    本規定の全体像については、「給与・年金受取特典：規定・約款」をご参照ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: terms_conditions
