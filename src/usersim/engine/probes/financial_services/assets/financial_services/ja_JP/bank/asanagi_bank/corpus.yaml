- id: e312b9d4-e503-5e82-b07d-c98b02a0d7aa
  title: 朝凪カードローン：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、「審査中」や「保留」の状態が続いている場合に考えられる原因と対処法をご案内します。


    【考えられる原因】

    ・**提出書類の不備**：ご本人確認書類の画像が不鮮明である、または有効期限が切れている。

    ・**入力情報の不一致**：お申込み時にご入力いただいた内容と、確認書類の内容に相違がある。

    ・**審査の混雑**：お申込み件数の増加により、審査に通常より時間を要している。


    【ご確認いただきたい事項】

    1. ご提出いただいた書類（免許証等）が最新のものであるか、再度ご確認ください。

    2. ご登録の連絡先（電話番号・メールアドレス）に誤りがないかご確認ください。


    【解決方法と今後の流れ】

    不足書類がある場合は、当行担当者よりご連絡いたします。指示に従い、不足分をご提示ください。書類の再提出が完了次第、速やかに審査を再開いたします。


    【エスカレーション】

    書類に不備がなく、かつ合理的期間（概ね1週間）が経過しても回答が得られない場合は、担当者から支店責任者または審査専門部署へ速やかにエスカレーションし、進捗を確認いたします。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: troubleshooting
  source_authority: official
