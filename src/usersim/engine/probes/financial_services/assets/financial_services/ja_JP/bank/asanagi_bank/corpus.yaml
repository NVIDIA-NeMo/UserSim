- id: e498a0bc-145b-5387-ad5b-5b1dc498dddc
  title: 普通預金：必要書類
  body: '普通預金口座の開設に必要な書類は、お客様の属性により異なります。犯罪収益移転防止法に基づき、以下の書類をご提示ください。


    | 対象者 | 必要書類 | 判定 |

    | :--- | :--- | :--- |

    | 個人（日本国内居住） | 運転免許証 または マイナンバーカード（顔写真付き） | 必須 |

    | 個人（外国籍居住） | 在留カード および パスポート | 必須 |

    | 法人 | 法人設立届 出品証明書 または 履歴事項全部証明書 | 必須 |

    | 法人 | 代表者または代理人の本人確認書類 | 必須 |

    | 法人 | 法人印鑑証明書 | 必須 |'
