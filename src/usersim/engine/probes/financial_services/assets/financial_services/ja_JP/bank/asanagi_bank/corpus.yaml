  body: '朝凪カードローンのお申込み条件は以下の通りです。


    | 条件項目 | 内容・基準 | 判定 |

    | :--- | :--- | :--- |

    | 年齢 | 日本国内の満20歳以上の方 | 必須 |

    | 居住地 | 日本国内に居住し、連絡可能な住所をお持ちの方 | 必須 |

    | 返済能力 | 当行による審査において、安定した収入と返済能力が認められる方 | 必須 |

    | 本人確認 | 犯罪収益移転防止法に基づく本人確認書類を提示できる方 | 必須 |

    | 信用情報 | 指定信用情報機関の審査において、著しい信用上の問題がない方 | 必須 |


    ※本商品は銀行法に基づき、貸金業法の総量規制（年収の3分の1まで）の対象外ですが、個別の返済能力審査に基づき、利用限度額（最大8,000,000円）を決定いたします。'
