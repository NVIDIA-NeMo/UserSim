  institution_id: asanagi_bank
- id: 2bad9358-5fbf-5bdf-aeee-8409fa4e5a4b
  title: 朝凪Visaデビット：限度額・制限と注意事項
  body: '本資料は「朝凪Visaデビット」の利用限度額および制限事項についてまとめたものです。お客様へのご案内時にご活用ください。


    【利用限度額】

    ・1日あたりの利用限度額（初期設定）：500,000円

    ※この限度額は、1日に行える決済の合計金額に適用されます。


    【決済の制限と条件】

    ・口座残高内での利用：デビットカードは利用と同時に預金口座から代金が引き落とされるため、口座残高を超えて利用することはできません。残高が不足している場合、お取引は拒否されます。

    ・本人認証サービス：インターネットでの安全な利用のため、本人認証サービス（EMV 3-Dセキュア）が導入されています。


    【海外利用時の手数料】

    ・海外利用時の事務手数料：3%

    ※海外加盟店で利用された場合、決済金額に加えてこの手数料が加算されます。


    【重要注意事項】

    ・紛失・盗難時の対応：カードの紛失や盗難に気づいた際は、ただちに当行へ届け出てカードの利用を停止させる必要があります。

    ・補償について：キャッシュカードの偽造・盗難による不正な払戻しについては、預金者保護法に基づき誠実に対応いたします。ただし、預金者に故意または重大な過失がある場合は、補償額が減額されることがあります。'
