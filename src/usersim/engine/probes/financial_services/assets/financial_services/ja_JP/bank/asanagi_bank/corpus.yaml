  mentions_tools: []
  institution_id: asanagi_bank
- id: 0c9ca147-d58d-540d-bcd1-d162a0ed97a7
  title: 朝凪カードローン：規定・約款
  body: '本規定は、お客さまと朝凪銀行との間における「朝凪カードローン」の利用に関する合意事項を定めるものです。


    1. 貸付金利と利用限度額

    貸付金利は、審査結果に基づき年2%から14.5%の範囲内で決定されます。利用限度額は、返済能力の審査を経て、最大8,000,000円までとさせていただきます。


    2. 返済義務

    お客さまは、借入金および利息を、当行が指定する返済日に、指定の口座より引き落としする方法で返済するものとします。毎月の最低返済額は2,000円とし、これ以上の金額を任意に繰り上げ返済することが可能です。


    3. 契約の変更および終了

    ・利用限度額の変更を希望される場合は、改めて審査を行い、承認後に行います。

    ・本契約を解約される場合は、借入金および未払利息の全額を完済した時点で、解約手続きが可能となります。


    4. 期限の利益の喪失

    返済の遅延が続き、当行が定めた基準に達した場合は、期限の利益を喪失し、借入金全額および遅延損害金を直ちに一括返済していただく場合がございます。


    5. 法的準拠

    本契約は、銀行法および金融庁の監督指針に基づき運用されます。個人情報の取り扱いについては、個人情報保護法および犯罪収益移転防止法に従います。'
