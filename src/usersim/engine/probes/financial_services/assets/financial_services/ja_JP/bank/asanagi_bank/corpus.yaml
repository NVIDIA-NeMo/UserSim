- id: 246ee1d9-5bbd-5dae-b304-e43f24e87bb0
  title: 朝凪カードローン：ログインできない・アクセスできない
  body: 'インターネットバンキング等で「朝凪カードローン」の照会画面にログインできない、またはアクセスできない場合の対処法です。


    ■考えられる原因と確認事項

    1. パスワードの入力間違い

    入力内容に誤りがないか、大文字・小文字の区別や全角・半角が正しく入力されているかをご確認ください。


    2. アカウントのロック

    短時間に複数回パスワードを間違えた場合、セキュリティ保護のためアカウントが一時的にロックされます。この場合、一定時間が経過するか、再設定の手続きが必要です。


    3. 通信環境の問題

    ネットワーク接続が不安定な場合、ページが正しく表示されないことがあります。一度通信状態を確認し、再度アクセスをお試しください。


    ■解決しない場合の対応

    上記を確認しても解決しない場合は、当行にて状況を確認いたします。まずはご本人確認（氏名・生年月日）を行い、エラーの詳細を調査します。


    【当行の対応】

    原因がシステムエラーやアカウントロックである場合、担当者が専門部署へ速やかにエスカレーションし、ロック解除やパスワード再発行の手続きを案内いたします。解決までにお時間をいただく場合は、目安となる時間を改めて提示いたします。'
