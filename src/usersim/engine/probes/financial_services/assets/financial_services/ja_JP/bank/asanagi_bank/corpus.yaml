- id: 651e2f78-f3e1-5648-aa99-66569b154659
  title: 住宅ローン：実施中のキャンペーン
  body: '【春の住まい応援キャンペーン】


    地域社会の発展と皆様の理想の住まいづくりをサポートするため、期間限定の特典をご案内いたします。


    【期間】

    2025年4月1日から2025年6月30日までのお申込み分


    【キャンペーン特典】

    期間中にお申込みいただき、融資が実行されたお客様を対象に、インターネットでの一部繰上返済手数料を、永続的に0円で提供させていただきます。


    【対象商品】

    ・住宅ローン（変動金利・固定金利期間選択型10年）


    無理のない返済計画を立てながら、効率的にローン残高を減らしていただける機会です。ぜひこの機会にご相談ください。'
