- id: e239f2fe-f48a-52ae-a2f0-6c0e72947fb8
  title: freeze_card を使う場面
  body: 'お客様からキャッシュカードまたは朝凪Visaデビットの「紛失」「盗難」の届け出があった場合、または不正利用の疑いがある場合に、直ちにこのツールを使用してカードを停止させます。


    【手続きの流れ】

    1. 本人確認の実施：`verify_identity` を呼び出し、フルネーム（氏名）と生年月日を確認します。

    2. カードの特定：`get_accounts` を呼び出し、停止すべきカードの `card_id` を特定します。

    3. 利用停止の実行：`freeze_card` を呼び出し、対象カードを即時に利用停止状態にします。

    4. 完了報告：カードが停止されたことをお客様に伝え、安心感を提供します。

    5. 再発行の案内：必要に応じて、`order_replacement_card` による再発行手続きを案内します。


    注意点：カードの紛失・盗難は緊急性が高いため、迅速に停止措置を講じることが最優先されます。'
