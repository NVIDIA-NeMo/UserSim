  institution_id: asanagi_bank
- id: 0a9c88e5-8e42-5c21-aefd-20c4aaf5ee7c
  title: 住宅ローン：リスクについてのご説明
  body: '住宅ローンをご利用いただくにあたり、以下のリスクおよび重要な注意点についてあらかじめご了承ください。


    1. 変動金利上昇リスク

    変動金利プラン（優遇後 1.375%）を選択された場合、市場金利の上昇に伴い適用金利が上昇し、返済額が増加するリスクがあります。返済額の見直しは5年ごとに行われますが、見直し後の返済額は、見直し前の125%を上限として設定されます。ただし、金利が急激に上昇した場合、利息が返済額を上回り「未払利息」が生じることがあります。


    2. 審査と借入限度額

    当行は銀行法に基づき、お客様の年収、資産状況、返済能力を厳格に審査いたします。借入限度額（最大100,000,000円）は審査結果によって変動し、必ずしも希望額全額の融資が約束されるものではありません。


    3. 費用負担

    融資実行時に、借入金額の2.2%に相当する融資手数料が発生します。この費用は借入時に確定し、原則として返金されません。


    4. 団体信用生命保険について

    本ローンは原則として団体信用生命保険への加入を条件としております。健康状態によっては加入できず、融資が受けられない場合がございます。


    これらのリスクをご理解いただいた上で、無理のない返済計画を立てていただけますようお願い申し上げます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 791cce1c-845a-539b-b1f5-969bdf4a652c
  title: 住宅ローン：金利・料率の決まり方と適用
  body: '住宅ローンに適用される金利および手数料の決定基準についてご案内いたします。


    【適用金利（優遇後）】

    ・変動金利：1.375%

    ・固定金利期間選択型10年：3.7%

    ※これらの金利は、市場金利および当行の資金調達コストに基づき設定され、審査結果に応じた優遇幅を適用した後の数値です。


    【融資手数料】

    ・料率：借入金額の 2.2%

    ※融資実行時に、借入総額にこの料率を乗じた金額を申し受けます。


    【金利の変動と見直し】

    ・変動金利の場合：5年ごとに返済額の見直しを行います。見直し後の返済額は、直前の返済額の125%を上限とするルールが適用されます。

    ・固定金利期間選択型の場合：選択した期間（例：10年）は金利が固定されます。期間終了後は、その時の市場金利に基づき、新たな適用金利が決定されます。


    【繰上返済手数料】

    ・インターネットでの一部繰上返済：0円

    ※利便性向上のため、オンライン手続きに限り手数料を無料としております。'
