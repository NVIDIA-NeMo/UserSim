  institution_id: asanagi_bank
- id: 4bfc7b63-80b4-50c6-923d-31b2e6d940db
  title: 住宅ローン：解約・変更・プランの切替え
  body: '住宅ローンの金利プラン（変動金利から固定金利、またはその逆）の切替えや、全額繰上返済による解約のお手続きについてご案内いたします。


    【お手続きの流れ】

    1. 本人確認：フルネーム（氏名）と生年月日をお伝えいただき、ご本人様であることを確認いたします。

    2. ご要望の提示：プランの切替えか、または全額解約（完済）か、ご希望の内容をお伝えください。

    3. 現状確認とシミュレーション：当行にて現在の借入残高を確認し、切替え後の月々のご返済額や、完済に必要な金額を算出したシミュレーション結果を提示いたします。

    4. 条件の合意と書類手続き：提示された金利条件や返済計画にご同意いただいた後、契約変更手続き（または解約手続き）に必要な書類をご案内いたします。必要書類に署名・捺印の上、当行へご提出ください。

    5. 完了確認：手続き完了後、変更後の返済スケジュールまたは完済証明書を発行いたします。


    なお、インターネットを利用した一部繰上返済の場合、手数料は0円で簡単にお手続きいただけます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: how_to_guide
  source_authority: official
