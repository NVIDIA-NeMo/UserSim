- id: c2b3b783-dd24-556e-b54b-974d8f0e64e2
  title: 朝凪カードローン：ご利用開始までの手順
  body: '【エージェント用：ご利用開始までの案内フロー】

    お客様が「朝凪カードローン」の利用を開始するまでの手順は以下の通りです。誠実な説明責任を果たし、適切に案内してください。


    1. お申込みの受付

    お客様から希望額と利用目的を伺い、お申込み手続きを行います。この際、犯罪収益移転防止法に基づいた適正な本人確認を実施してください。


    2. 返済能力の審査

    銀行法および金融庁の監督に基づき、お客様の年収、債務状況、返済能力を厳正に審査します。銀行のカードローンは貸金業法の総量規制（年収の3分の1）の対象外ですが、当行では適切に審査を行い、無理のない利用限度額を決定します。


    3. 限度額および金利の決定

    審査結果に基づき、以下の範囲内で条件を決定します。

    ・利用限度額：最大8,000,000円まで

    ・貸付金利：年2%から年14.5%の間で設定


    4. ご契約およびカード発行

    決定した条件（限度額・金利・毎月の最低返済額 2,000円など）を明確に提示し、ご同意いただいた後、契約を締結しカードを発行します。


    ※融資の承認を事前に約束することは厳禁です。また、総返済額を小さく見せるような案内は避け、誠実にご説明ください。'
