  body: '朝凪Visaデビットのお申込みにあたり、犯罪収益移転防止法に基づき以下の書類による本人確認が必要です。


    | 確認事項 | 必要書類（いずれか一つ） | 判定 |

    | :--- | :--- | :--- |

    | 氏名・住所・生年月日の確認 | 運転免許証（有効期限内） | 確認完了 |

    | 氏名・住所・生年月日の確認 | マイナンバーカード（表面のみ） | 確認完了 |

    | 氏名・住所・生年月日の確認 | パスポート（住所記載があるもの） | 確認完了 |

    | 住所の追加確認 | 公共料金の領収書（発行から3ヶ月以内） | 補完完了 |'
