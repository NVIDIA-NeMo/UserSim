- id: 1681eab8-9cdc-590c-b994-6276c2d9d273
  title: 朝凪カードローン：個人情報の取扱い
  body: '「朝凪カードローン」のご利用にあたり、当行は個人情報保護法および犯罪収益移転防止法に基づき、お客様の個人情報を厳重に管理いたします。


    ■個人情報の収集と利用目的

    お申込み時にご提供いただいた氏名、住所、勤務先、年収等の情報は、以下の目的で利用いたします。

    ・ご本人確認および口座開設の手続き

    ・貸付審査における返済能力の確認

    ・契約内容の管理および返済のご案内


    ■信用情報機関への登録

    当行は、指定信用情報機関に加入しております。借入金額や返済状況などの情報は、法令に基づき信用情報機関に登録されます。また、審査にあたっては、お客様の同意を得たうえで、当該機関に登録されている情報の照会を行います。


    ■第三者への提供

    法令に基づく場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    ■お問い合わせ

    個人情報の開示、訂正、または利用停止をご希望の場合は、当行の個人情報保護担当窓口までご連絡ください。誠実に対応させていただきます。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
