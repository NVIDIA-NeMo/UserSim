- id: af70d77b-9812-5052-89a1-b9c1fa616550
  title: 住宅ローン：お取引が拒否された・制限された
  body: '住宅ローンの申し込みや、一部繰上返済などの手続きが拒否された、あるいは制限されたと感じられる場合の対処法をご案内いたします。


    【考えられる原因】

    ・本人確認情報の不一致：ご提示いただいたフルネームまたは生年月日が、登録情報と一致していない場合、セキュリティ保護のため操作が制限されます。

    ・審査基準への未到達：新規借入や条件変更の際、返済能力の審査において規定の基準を満たさなかった可能性があります。

    ・必要書類の不足：本人確認書類や所得証明書など、法令に基づく必要書類が不足している場合、手続きが進みません。


    【確認と解決策】

    1. まず、ご提示いただいた氏名と生年月日に誤りがないか、改めてご確認ください。

    2. 書類に不備がある場合は、不足している書類を再度ご提出ください。

    3. 審査結果による制限である場合は、担当者が個別の状況を伺い、返済条件の見直しなどの相談を承ります。


    【エスカレーション】

    上記を確認しても解決しない場合、または審査結果について詳細な説明を希望される場合は、支店責任者または専門部署へ速やかにエスカレーションし、透明性のあるプロセスで対応させていただきます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 1a4025d4-2c0b-549f-8b17-cc19af721534
  title: 住宅ローン：切替えや上位プランを検討するとき
  body: 'お客様のライフプランに合わせて、変動金利と固定金利期間選択型のどちらが適しているかをご案内します。


    【金利タイプの比較】

    ・変動金利（優遇後）：1.375%

    　→ 市場金利に合わせて返済額が変動します。低金利のメリットを享受したい方、将来的に繰上返済を計画している方向けです。

    ・固定金利期間選択型10年（優遇後）：3.7%

    　→ 10年間は金利が固定されます。将来の金利上昇リスクを避け、安定した返済計画を立てたい方向けです。


    【検討のポイント】

    金利の低さを優先し、リスクを許容できる場合は変動金利が適していますが、家計の安定性を重視される場合は固定金利期間選択型が安心です。なお、インターネットでの一部繰上返済手数料は0円となっており、どちらのプランでも柔軟な資産形成が可能です。お客様の返済能力と意向を総合的に判断し、最適な選択をサポートいたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: comparison
  source_authority: official
