- id: df7b4aa5-a758-5853-beb3-35dce7e82fef
  title: 普通預金：金利・料率の決まり方と適用
  body: '普通預金に適用される金利およびその適用方法についてご案内いたします。


    【適用金利】

    ・普通預金金利：年0.4%


    【金利の適用について】

    本金利は、預金残高の金額にかかわらず、一律で適用されるフラットレートです。特別な残高条件による金利の変動はございません。


    【利息の計算と支払】

    利息は、日々の最終残高に基づき計算されます。支払日は当行所定の日となっており、税引き後の利息がお客さまの口座に自動的に加算されます。


    【金利の変更】

    金利は市場金利の変動や当行の判断に基づき、変更される場合がございます。変更される際は、店舗への掲示やホームページ等を通じて速やかにお知らせいたします。


    金利の詳細一覧については、「普通預金：金利・料率一覧」をご参照ください。'
