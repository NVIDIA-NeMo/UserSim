- id: 7a117f03-f89f-524d-963c-2a382a6c29a4
  title: get_accounts を使う場面
  body: 'お客様がご自身の保有口座の残高照会を希望された場合や、特定の口座・カードを指して手続きを依頼された際、正確な識別子（ID）を特定するために本ツールを使用します。


    ### 手続きの流れ

    1. **本人確認の実施**: お客様から「フルネーム（氏名）」および「生年月日」を伺い、`verify_identity` を呼び出して本人確認を完了します。

    2. **口座情報の取得**: `get_accounts` を呼び出し、お客様が当行で保有しているすべての口座（普通預金、スーパー定期など）およびカードの一覧を取得します。

    3. **特定と照合**: リストに表示される「口座種別」「口座番号の下4桁」「残高」「ステータス」を確認し、お客様が意図している口座がどれであるかを確定させます。


    ### 利用例

    - 「普通預金の残高を教えてほしい」 → `get_accounts` で残高を確認し、回答します。

    - 「末尾1234の口座を解約したい」 → `get_accounts` で末尾1234に該当する `account_id` を特定し、その後の解約手続きに利用します。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: asanagi_bank
- id: 7958eaee-f3ed-5f6d-ad0e-3140fb896948
  title: get_accounts ツールリファレンス
  body: '### ツール概要

    認証済みのお客様が保有する口座およびカードの情報を一覧で取得するためのツールです。


    ### 実行動作

    オペレーターが本ツールを呼び出すことで、そのお客様に紐づく以下の情報を取得します。

    - 口座情報: `account_id`、口座種別（type）、口座番号の下4桁、現在の残高（balance）、口座の状態（status）

    - カード情報: 紐づいているカードの `card_id`


    ### 引数

    - 引数は不要です。


    ### 注意事項

    本ツールは、`verify_identity` によって本人確認が完了したお客様に対してのみ実行可能です。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: asanagi_bank
- id: 5b4367e9-a4fb-5ae7-ab0a-888e3abf414d
  title: open_account を使う場面
  body: "新しく当行の口座（普通預金など）を開設することを希望されるお客様に対し、口座開設手続きを行う場合に本ツールを使用します。\n\n### 手続きの流れ\n\
    1. **必要情報の収集**: お客様から以下の情報を伺います。\n    - フルネーム（氏名）\n    - 生年月日\n    - 連絡先（住所、電話番号等）\n\
    \    - 希望する口座種別（例：普通預金）\n2. **本人確認の実施**: 伺った情報をもとに `verify_identity` を呼び出し、本人確認を行います。\n\
    3. **口座開設の実行**: `open_account` を呼び出し、口座開設手続きを完了させます。\n\n### 注意点\n- 犯罪収益移転防止法に基づき、厳格な本人確認（取引時確認）が必要です。確認書類のご提示を案内してください。\n\
    - 口座開設後、キャッシュカードやデビットカードの発行を希望される場合は、別途カード発行の手続きを案内します。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: asanagi_bank
- id: 9cddd22f-d652-5483-b772-82845ba113b1
  title: open_account ツールリファレンス
  body: '### ツール概要

    新しい銀行口座を開設するためのツールです。


    ### 実行動作

    オペレーターが本ツールを呼び出すことで、指定された顧客情報に基づき、新しい口座（`account_id`）がシステムに作成されます。


    ### 引数

    - `full_name`: 開設者のフルネーム

    - `date_of_birth`: 開設者の生年月日

    - `contact_info`: 開設者の連絡先（住所、電話番号など）

    - `account_type`: 開設する口座の種類（例：`futsu_yokin`）


    ### 注意事項

    本ツールの実行前には、必ず `verify_identity` による本人確認を完了させてください。金融庁の監督および銀行法に基づき、適正な本人確認を徹底してください。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: asanagi_bank
- id: 14b7c5ac-8942-565c-b1d9-8ebfbcdf8357
  title: close_account を使う場面
  body: 'お客様から、保有している口座の解約（閉鎖）を希望された場合に本手続きを行います。


    ### 手続きの流れ

    1. **本人確認の実施**: お客様から「フルネーム（氏名）」および「生年月日」を伺い、`verify_identity` を呼び出して本人確認を完了します。

    2. **解約対象口座の特定**: `get_accounts` を呼び出し、お客様が保有する口座一覧を確認します。解約したい口座の末尾4桁などを伺い、正確な
    `account_id` を特定します。

    3. **解約の実行**: 特定した `account_id` を使用して `close_account` を呼び出し、口座を閉鎖します。


    ### 注意点

    - 口座に残高がある場合は、あらかじめ出金いただくか、他口座への振込等の処理を案内してください。

    - 解約手続きは不可逆的な操作であるため、お客様の意思確認を十分に行った上で実行してください。また、公共料金の口座振替などが設定されていないか、あらかじめご確認いただくよう促してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: asanagi_bank
- id: a2a870d7-79ae-5a88-8da0-f294593d9882
  title: close_account ツールリファレンス
  body: "このツールは、お客様の指定された口座を解約するためのものです。エージェントは、本人確認および口座の特定が完了した後、このツールを直接呼び出すことで解約処理を実行します。\n\
    \n・引数：\n  - account_id: 解約対象となる口座の識別子（get_accounts ツールで取得した ID を使用します）。\n\n本操作は不可逆的であり、一度実行されると口座は完全に閉鎖されます。実行前に、口座残高の取り扱いについてお客様に十分な説明を行い、同意を得てください。本人確認はあらかじめ\
    \ verify_identity によって完了している必要があります。"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: asanagi_bank
- id: 2752ec61-d5a8-5d08-86de-384c49e7a2fb
  title: update_contact_info を使う場面
  body: "お客様から、住所、電話番号、メールアドレスなどの連絡先情報の変更依頼があった場合に、この手続きを行います。当行では、正確な顧客情報を維持することが、安全なサービスの提供とコンプライアンス遵守（犯罪収益移転防止法など）のために不可欠であると考えております。\n\
    \n手続きの際は、以下の手順に従って操作してください。\n\n1. 本人確認の実施：\n   まず、verify_identity ツールを呼び出し、お客様から「フルネーム（氏名）」と「生年月日」を確認します。必要に応じて、口座番号の下4桁を併せて確認してください。\n\
    2. 口座の特定：\n   get_accounts ツールを呼び出し、お客様が変更を希望される口座に関連付けられた正しい account_id を特定します。\n\
    3. 変更内容のヒアリング：\n   新しく登録する住所、電話番号、またはメールアドレスの内容を正確に伺います。\n4. 情報の更新：\n   update_contact_info\
    \ ツールを呼び出し、特定した account_id と、伺った新しい連絡先情報を入力して更新を完了させます。\n\n完了後、お客様に更新が正常に処理されたことを丁寧にお伝えください。なお、暗証番号やパスワードなどの機密情報は、この手続きにおいて一切求めないでください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: asanagi_bank
- id: 2fc9d971-79a4-5b24-baca-95341d74668f
  title: update_contact_info ツールリファレンス
  body: "このツールは、お客様の登録連絡先情報を更新するためのものです。エージェントは、お客様から伺った最新の情報をこのツールを用いてシステムに反映させます。\n\
    \n・引数：\n  - account_id: 更新対象の口座識別子（get_accounts ツールで取得します）。\n  - new_contact_details:\
    \ 更新する連絡先情報の詳細。具体的に変更が必要な項目（住所、電話番号、メールアドレスなど）の内容を記述します。\n\nエージェントは、verify_identity\
    \ による本人確認が完了した後にのみ、このツールを直接呼び出すことができます。お客様に外部サイトや書面での手続きを案内せず、会話の中で完結させてください。"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
