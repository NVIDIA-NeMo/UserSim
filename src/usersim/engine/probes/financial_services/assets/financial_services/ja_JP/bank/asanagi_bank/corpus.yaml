- id: 601ed1c1-ad7a-541f-b0be-36932f369397
  title: 普通預金：普通預金の金利について
  body: '【Q】普通預金に預けているお金に利息はつきますか？

    【A】はい、つきます。当行の普通預金の金利は0.4%となっております。お預入れ金額に対してこの利率が適用され、定期的にお利息が加算されます。


    【Q】金利は変動しますか？

    【A】はい。市場金利の変動や当行の判断により、金利が変更となる場合がございます。変更の際は、店頭での掲示やホームページにてご案内いたします。


    【Q】利息に税金はかかりますか？

    【A】はい。お支払いの利息からは、所得税および地方税として20.315%が源泉徴収されます。


    金利の詳細については「普通預金：金利・料率一覧」をご確認ください。'
