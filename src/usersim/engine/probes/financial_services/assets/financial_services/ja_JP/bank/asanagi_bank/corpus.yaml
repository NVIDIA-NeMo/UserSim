- id: 97a57de5-12bc-5c8f-a520-fb0e301a535a
  title: 朝凪カードローン：利用限度額の上限について
  body: '【よくあるご質問】


    Q：朝凪カードローンの利用限度額は最大でいくらまで設定可能ですか？


    A：「朝凪カードローン」の利用限度額の上限は、最大8,000,000円となっております。


    ただし、この金額がすべての方に適用されるわけではありません。銀行法に基づき、お客様の年収や現在の借入状況などの返済能力を適切に審査したうえで、個別に限度額を決定させていただきます。詳細な審査基準や、お客様ご自身の適用限度額については、お申込み時に改めてご案内いたします。'
