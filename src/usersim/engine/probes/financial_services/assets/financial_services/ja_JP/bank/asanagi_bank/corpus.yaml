- id: 8b6e3c3e-d222-501e-a717-3432cbc608f0
  title: 給与・年金受取特典：登録内容の変更
  body: '「給与・年金受取特典」を適用している口座の登録内容（住所、電話番号、氏名等）を変更する手順をご案内いたします。


    ■ご準備いただくもの

    ・ご本人様確認書類（運転免許証、マイナンバーカード等）

    ・ご印鑑（お届け印）


    ■変更の手順

    1. 本人確認

    窓口またはお電話にて、ご自身の「フルネーム（氏名）」と「生年月日」をお伝えください。


    2. 変更内容の提示

    変更したい項目（例：転居に伴う住所変更）を当行職員へお伝えください。


    3. 書類による確認

    窓口での手続きの場合、ご準備いただいた本人確認書類を提示してください。


    4. 変更完了の確認

    当行にて手続きを行い、変更後の登録内容を改めてご案内いたします。これで手続きは完了です。


    ※受取口座としての指定を変更される場合は、別途お勤め先や年金事務所での手続きが必要となります。特典の継続利用についてご不明な点がある場合は、担当職員までご相談ください。'
