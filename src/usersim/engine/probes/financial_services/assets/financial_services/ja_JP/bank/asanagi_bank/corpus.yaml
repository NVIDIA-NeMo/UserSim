- id: ff09b633-f411-5225-9e87-6f4fa1ff6df6
  title: 給与・年金受取特典：他行あて振込手数料の無料回数（月）について
  body: '【Q】他行あて振込手数料の無料回数は、具体的に月に何回まで利用できますか？


    【A】「給与・年金受取特典」をご利用のお客様は、他行あて振込手数料が毎月3回まで無料となります。4回目以降のご利用については、所定の手数料がかかりますのでご注意ください。


    【Q】無料回数のカウントはいつリセットされますか？


    【A】無料回数は毎月1日にリセットされます。月ごとのご利用状況については、通帳やインターネットバンキングの明細にてご確認いただけます。


    詳細な手数料体系については、「給与・年金受取特典：手数料一覧」をご参照ください。'
