- id: 5ff9c52c-fe21-5c61-a075-cc550ee9edbe
  title: 朝凪カードローン：お申込みとご利用開始
  body: '朝凪カードローンのお申込みからご利用開始までの手順をご案内します。


    【ご準備いただくもの】

    ・ご本人確認書類（運転免許証、マイナンバーカードなど）

    ・収入を証明する書類（源泉徴収票など、審査により必要な場合のみ）


    【お手続きの流れ】

    1. **ご本人確認**

    まず、お客様の「フルネーム（氏名）」と「生年月日」を確認させていただきます。当行では、これら以外の暗証番号やパスワード、身分証番号などを伺うことはございません。


    2. **お申込み内容の提示**

    ご希望の利用限度額（最大8,000,000円まで）および、資金使途についてお伺いします。


    3. **審査の実施**

    当行にて返済能力を適切に審査いたします。この際、指定信用情報機関に借入状況が登録されます。


    4. **ご契約の締結**

    審査承認後、適用される貸付金利（2%から14.5%の範囲内）と決定した利用限度額をご提示し、ご契約手続きを行います。


    5. **カードの受取とご利用開始**

    お手元にカードが届きましたら、即時にお借入が可能となります。毎月の最低返済額は2,000円からとなります。


    審査の結果、ご希望の限度額や金利にならない場合がございます。あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: how_to_guide
  source_authority: official
