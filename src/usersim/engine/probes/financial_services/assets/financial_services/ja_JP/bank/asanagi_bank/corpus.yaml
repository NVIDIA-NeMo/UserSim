  institution_id: asanagi_bank
- id: 90e3472d-bffc-53dd-b5fa-fda11f9990cb
  title: 朝凪カードローン：切替えや上位プランを検討するとき
  body: '【サポート担当者向け：プラン検討の案内指針】


    お客様が現状の利用枠の拡大や、他社商品からの切替えを検討されている際の比較ポイントです。


    ■朝凪カードローンの優位性

    ・銀行法に基づき、貸金業法の総量規制（年収3分の1）の対象外であるため、柔軟な限度額設定が可能です（最大 8,000,000円）。

    ・貸付金利の下限が 2% と低く設定されており、審査結果によっては低コストな資金調達が可能です。


    ■検討の切り分け

    ・少額を頻繁に利用し、利便性を最優先される方 → 現行のカードローンを継続利用。

    ・まとまった資金を低金利で長期的に返済したい方 → 目的別ローンへの切り替えを提案。


    案内時には、お客様の現在の返済能力を再審査し、誠実な説明責任を果たしてください。無理な増枠提案は避け、適正な利用を促します。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: comparison
  source_authority: official
  placeholder: true
