  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: asanagi_bank
- id: 4a19164e-4531-5d3a-8b58-c74a60671f60
  title: manage_authorized_users を使う場面
  body: '同居のご家族が口座を利用するための「代理人カード」の発行、または発行済み代理人カードの利用停止を希望される場合に本手続きを行います。


    ### 手続きの流れ

    1. **本人確認の実施**: 口座名義人のお客様から「フルネーム（氏名）」および「生年月日」を伺い、`verify_identity` を呼び出して本人確認を完了します。

    2. **対象口座の特定**: `get_accounts` を呼び出し、代理人カードを紐づける `account_id` を特定します。

    3. **代理人情報の確認**: 代理人となるご家族の「フルネーム」、「生年月日」、「連絡先」を伺います。

    4. **手続きの実行**: 取得した情報をもとに `manage_authorized_users` を呼び出し、カードの「発行」または「利用停止」を指示します。


    ### 注意点

    - 代理人カードの発行は、同居のご家族に限られます。

    - 本人確認の際は、名義人本人の情報を確認してください。代理人となる方の情報は、ツール引数としてのみ使用します。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: asanagi_bank
- id: a98893af-7097-5587-91bb-6121f509d277
  title: manage_authorized_users ツールリファレンス
  body: "### ツール概要\n口座の代理人ユーザー（同居家族）の管理を行うためのツールです。代理人カードの発行および利用停止を制御します。\n\n###\
    \ 実行動作\nオペレーターが本ツールを呼び出し、指定したアクション（発行または停止）を実行します。\n\n### 引数\n- `account_id`:\
    \ 代理人カードを紐づける口座の識別子。\n- `authorized_user_details`: 代理人の詳細情報。以下を含みます：\n    - `full_name`:\
    \ 代理人の氏名\n    - `date_of_birth`: 代理人の生年月日\n    - `contact_info`: 代理人の連絡先\n- `action`:\
    \ 実行する操作（「発行」または「利用停止」）。\n\n### 注意事項\n本ツールを実行する前に、口座名義人であるお客様の `verify_identity`\
    \ が完了している必要があります。"
