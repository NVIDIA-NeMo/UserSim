- id: a68d9f36-8326-5054-bbde-d13b22ea020b
  title: 普通預金：ログインできない・アクセスできない
  body: 'インターネットバンキング等で普通預金口座にアクセスできず、ログインに失敗する場合の対処法をご案内いたします。


    【よくある症状と原因】

    ・「IDまたはパスワードが正しくありません」というメッセージが表示される。 → 入力内容の誤り、または大文字・小文字の切り替えミスが考えられます。

    ・ログインを試みると「アカウントがロックされています」と表示される。 → パスワードの誤入力が一定回数を超えたため、セキュリティ保護により制限がかかっています。


    【確認と解決の手順】

    1. 入力内容の再確認

    キーボードのCaps LockやNum Lockが有効になっていないか、全角文字が混じっていないかを確認し、再度入力してください。


    2. 通信環境の確認

    インターネット接続が安定しているか、機内モードになっていないかをご確認ください。


    3. パスワードの再設定

    上記を確認しても解決しない場合、またはロックがかかっている場合は、担当者へお知らせください。本人確認（フルネームと生年月日）の上、パスワードの再設定手続きを承ります。


    【エスカレーションについて】

    担当者での対応で解決しない複雑な事象や、不正アクセスの疑いがある場合は、速やかに支店責任者または専門部署へエスカレーションし、調査を行います。調査結果および今後の対応策について、改めてお客様へご連絡差し上げます。


    お手続きが保留状態のまま進まない場合は、「普通預金：お手続きが完了しない・保留中のまま」をご確認ください。'
  domain: retail_banking
