  institution_id: asanagi_bank
- id: b4e9c8cb-d74e-5127-b1a4-f26082e2be6d
  title: 住宅ローン：融資手数料（借入金額に対する割合）について
  body: 'Q: 住宅ローンの融資手数料はいくらになりますか？


    A: 当行の住宅ローンでは、融資手数料（借入金額に対する割合）として2.2%を設定しております。この手数料は、融資実行時に借入金額に対して計算され、ご負担いただきます。


    Q: 手数料の計算例を教えてください。


    A: 例えば、1,000万円を借り入れる場合、1,000万円 × 2.2% = 220,000円が融資手数料となります。


    詳細は「住宅ローン：商品概要」にてご確認いただけます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: faq
  source_authority: official
  placeholder: true
