- id: 3b130cd4-ac86-5af4-9e26-a298f35bbebb
  title: 朝凪Visaデビット：ログインできない・アクセスできない
  body: 'インターネットバンキング等で、カードの利用状況確認や設定変更のためのログインができない場合、以下の手順でご確認をお願いいたします。


    ■考えられる症状と原因

    ・「IDまたはパスワードが正しくありません」と表示される → 入力内容の誤り、またはパスワードの有効期限切れ。

    ・画面が白くなり、読み込みが終わらない → 通信環境の不安定さ、またはブラウザのキャッシュの問題。

    ・アカウントがロックされている旨のメッセージが出る → パスワードの入力誤りが規定回数を超えたため。


    ■ご確認いただきたい順番

    1. 入力モードの確認：全角・半角の切り替えや、Caps Lockがオンになっていないかをご確認ください。

    2. 通信環境の切り替え：Wi-Fiからモバイルデータ通信に切り替えてアクセスできるかをお試しください。

    3. ブラウザの再起動：一度ブラウザを閉じ、再度アクセスしてください。


    ■解決しない場合の対応

    上記を確認しても解決しない場合は、担当者が状況を確認いたします。本人確認（フルネームと生年月日）の後、ロックの解除やパスワードの再発行手続きをサポートいたします。


    ■当行での対応（エスカレーション）

    システム的な不具合が疑われる場合や、不正アクセスの可能性がある場合は、速やかに専門部署へエスカレーションし、調査を行います。調査結果は後日、お客様にご連絡いたしますので、今しばらくお待ちください。'
