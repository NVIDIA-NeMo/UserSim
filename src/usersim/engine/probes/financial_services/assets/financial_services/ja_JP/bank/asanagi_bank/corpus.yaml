  institution_id: asanagi_bank
- id: 5a47f6a7-6f35-5031-833a-069d96fd6ff3
  title: スーパー定期：ほかの選択肢との比較と向かない場合
  body: "「スーパー定期」は、確実な資産形成を目指す方向けの定期預金です。お客様の目的によって、最適な選択肢は異なります。\n\n【本商品の特徴と適用金利】\n\
    - 1年もの：0.55%\n- 3年もの：0.85%\n- 5年もの：1.05%\n- 最低預入金額：1,000円\n\n【スーパー定期が向いている方】\n\
    - 給与や年金などで得た資金のうち、当面使う予定のないお金を安全に増やしたい方\n- 確実な金利を得て、計画的に資産を形成したい方\n\n【本商品が向かない方（ほかの選択肢）】\n\
    - 急な出費に備え、いつでも自由にお金を引き出したい方\n  → 「普通預金：商品概要」をご参照ください。利便性の高い基本口座として、日常的な決済に適しています。\n\
    - より高い収益性を求め、元本変動リスクを許容できる方\n  → NISA（つみたて投資枠や成長投資枠）などの投資商品をご検討ください。当行では、商品の特徴について教育的な情報提供を行っております。\n\
    \n【注意点】\n満期前に解約される場合は「中途解約利率」が適用され、当初の金利よりも低くなります。あらかじめご資金計画を立てた上でのご利用をお勧めいたします。"
