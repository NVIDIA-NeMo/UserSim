  institution_id: asanagi_bank
- id: 6ccc0b35-fff7-528c-ac96-b0f518f7e244
  title: 朝凪Visaデビット：ご利用条件による違い
  body: '【エージェント用：ご利用条件判定マトリクス】


    お客様のご状況に応じた発行可否および適用条件は以下の通りです。


    | 条件 | 判定/結果 | 備考 |

    | :--- | :--- | :--- |

    | 当行の普通預金口座を保有している | 発行可能 | 本カードは口座連動型のため必須です |

    | 犯罪収益移転防止法に基づく本人確認が完了している | 発行可能 | 有効な身分証明書の提示が必要です |

    | 未成年者である | 保護者の同意があれば発行可能 | 法定代理人の承諾書が必要です |

    | 海外居住者である | 原則発行不可 | 日本国内に住所を有していることが条件です |

    | 初回発行時 | 年会費 0円 | 全ての適格者に適用されます |

    | 海外利用を希望 | 事務手数料 3% 適用 | Visa加盟店での利用が条件です |'
