- id: aee4164b-7973-5119-8388-ff9bff1dc941
  title: 住宅ローン：ご利用条件による違い
  body: '【担当者向け：住宅ローン適用条件一覧】


    | 条件項目 | 適用内容 / 閾値 |

    | :--- | :--- |

    | 借入限度額 | 最大 100,000,000円 |

    | 最長借入期間 | 35年 |

    | 融資手数料 | 借入金額の 2.2% |

    | 審査基準 | 銀行法に基づき、個々の返済能力を審査し決定 |

    | 必須加入保険 | 団体信用生命保険への加入が必要 |

    | 繰上返済手数料 | インターネットでの一部繰上返済は 0円 |


    ※審査の結果、限度額や期間が制限される場合があります。必ずお客様の返済能力を適切に審査してください。'
