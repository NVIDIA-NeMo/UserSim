- id: 2b3873ad-39ff-52a3-b201-211e14170e64
  title: dispute_status を使う場面
  body: "お客様が、以前に申し出た「身に覚えのない利用」や「二重引落し」などの調査状況（紛争ステータス）について問い合わせをされた場合に、この手続きを行います。特に朝凪Visaデビットなどの不正利用補償に関する進捗確認で利用されます。\n\
    \n手続きの際は、以下の手順に従って操作してください。\n\n1. 本人確認の実施：\n   verify_identity ツールを呼び出し、お客様の「フルネーム（氏名）」と「生年月日」を確認します。\n\
    2. 案件の特定：\n   お客様から、申請時の受付番号（dispute_id）を伺います。もし番号が不明な場合は、get_accounts ツールで口座やカードの情報を確認し、関連する申請履歴があるかを確認してください。\n\
    3. ステータスの照会：\n   dispute_status ツールを呼び出し、特定した dispute_id を入力して、現在の調査状況（調査中、補償決定、却下など）を取得します。\n\
    4. 進捗のご説明：\n   取得したステータスに基づき、現在の状況を丁寧にご説明します。調査に時間を要している場合は、その旨をお伝えし、誠実な対応を心がけてください。\n\
    \nもし、まだ不正利用の届け出を行っていないお客様である場合は、まず freeze_card による利用停止を行い、その後に file_transaction_dispute\
    \ による申出を案内してください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: asanagi_bank
- id: 47bf178c-c233-5070-8903-eb201783db90
  title: dispute_status ツールリファレンス
  body: "このツールは、提出された取引に関する異議申し立て（紛争）の現在の処理状況を確認するためのものです。エージェントは、このツールを用いて調査の進捗を照会し、お客様に報告します。\n\
    \n・引数：\n  - dispute_id: 異議申し立て案件固有の識別子。お客様から提示されるか、申請履歴から特定します。\n\n本ツールを呼び出す前に、必ず\
    \ verify_identity による本人確認を完了させてください。得られた結果に基づいて、透明性のあるプロセスで迅速にお客様へ状況を伝えてください。"
