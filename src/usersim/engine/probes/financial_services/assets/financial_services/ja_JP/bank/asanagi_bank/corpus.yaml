  mentions_tools: []
  institution_id: asanagi_bank
- id: 3ef0f58a-0713-5c55-abce-48b24dff56e7
  title: 給与・年金受取特典：ご紹介・継続利用の特典
  body: '【地域のみなさまへ】

    朝凪銀行をメインバンクとしてご利用いただいているお客様、およびこれから口座開設をご検討のお客様へ、特別な特典をご案内いたします。


    2026年1月1日から2026年3月31日までのお手続き分を対象に、当行を給与受取口座または年金受取口座に指定いただいたお客様へ「給与・年金受取特典」を適用いたします。


    ■適用される特典内容

    ・他行あて振込手数料の無料回数（月）：3回

    ・時間外ATM手数料の無料回数（月）：5回


    日々の決済から資産形成まで、誠実なサービスで地域の皆さまをサポートいたします。詳細はお近くの窓口または担当職員までお問い合わせください。'
