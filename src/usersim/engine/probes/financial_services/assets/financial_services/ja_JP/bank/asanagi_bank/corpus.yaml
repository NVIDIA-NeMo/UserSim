- id: e3bbe3de-54a6-55ce-b528-a59aee94f6a4
  title: スーパー定期：この商品をかたる詐欺にご注意ください
  body: '昨今、当行の「スーパー定期」などの定期預金商品をかたり、「特別金利を適用するため、指定の口座に資金を移動させてほしい」あるいは「手続きのために暗証番号が必要である」といった不審な電話やメール、メッセージが届く事例が報告されています。このような案内はすべて詐欺であり、十分にご注意ください。


    朝凪銀行では、どのような場合であっても、お電話やメール、SMS等で以下のような情報を伺うことはございません。

    - キャッシュカードの暗証番号

    - インターネットバンキングのログインパスワード

    - ログイン用ワンタイムパスワード

    - カード番号や身分証番号


    当行が口座情報の照会や変更などの操作を行う際は、必ずご本人確認を実施いたしますが、確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の機密情報を求めることは一切ございません。


    もし、不審な連絡を受け、不安に感じられた場合は、すぐに操作を中断し、当行の窓口または電話サポートへご連絡ください。また、万が一、個人情報や資金を渡してしまった可能性がある場合は、迅速に口座の利用停止措置を講じますので、至急お知らせいただけますようお願い申し上げます。'
  domain: retail_banking
  product_category: super_teiki
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 80cd175c-cee9-526a-92d7-0848e864ce04
  title: スーパー定期：限度額・制限と注意事項
  body: '本資料は、サポート担当者が「スーパー定期」の限度額、制限事項、および重要注意点を顧客に案内するためのものです。


    【預入制限】

    - 最低預入金額：1,000円からお申し込みいただけます。1,000円未満の預入はできません。


    【税金および利息に関する注意】

    - 利息への課税：適用される利息に対しては、20.315%（国税および地方税）の税金が課せられます。お客様がお受け取りになるのは、この税金が差し引かれた後の金額となります。

    - 中途解約：満期前に解約された場合、当初の約定金利ではなく、「中途解約利率」が適用されます。この利率は当初の金利よりも低くなるため、受取利息が減少します。


    【預金保険制度について】

    - 本商品は預金保険制度の対象です。当行が破綻した場合、預金保険機構により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【コンプライアンス】

    - 本商品の開設および解約などの手続きに際しては、犯罪収益移転防止法に基づき、厳格な本人確認（取引時確認）を徹底してください。個人情報の取扱いは個人情報保護法に従います。'
