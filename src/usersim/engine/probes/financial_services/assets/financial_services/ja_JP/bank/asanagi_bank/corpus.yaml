- id: 72bf5e5c-d76e-522d-ace7-4b8332fcfec4
  title: 普通預金：重要事項のご説明
  body: '本口座のご利用にあたり、以下の重要事項をご承知おきください。


    【預金保険制度について】

    当行は預金保険機構の会員であり、預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【コンプライアンスと本人確認】

    当行は銀行法および金融庁の監督に基づき、厳格なコンプライアンス体制を構築しております。口座開設および重要な操作にあたっては、個人情報保護法および犯罪収益移転防止法に従い、適切な本人確認（フルネームおよび生年月日の照会）を実施いたします。


    【金利と税金】

    普通預金の金利は0.4%です。適用される利息に対しては、所得税および地方税（計20.315%）が課税されます。


    【手数料】

    インターネットバンキングによる他行あて振込手数料（220円）、時間外ATM利用手数料（110円）、再発行手数料（1,100円）などの適正な手数料を設定しております。


    苦情や紛争については、当行の規定および全国銀行協会相談室の指針に従い、透明性のあるプロセスで迅速に解決を図ります。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 52a7093c-0642-53c8-98b9-6bc71fa9ce90
  title: 普通預金：金利・料率一覧
  body: '普通預金に適用される金利についてご案内いたします。


    【適用金利】

    ・普通預金の金利：0.4%


    【適用条件】

    本金利は、預入金額の多寡にかかわらず、すべてのお客様に一律に適用されます。特別な条件や段階的な金利設定はございません。


    【金利の適用と変更】

    ・金利は年率で表示されており、日次で計算されます。

    ・市場金利の変動に伴い、金利が改定される場合がございます。改定される場合は、店頭掲示およびホームページにてお知らせいたします。


    利息の計算方法や税務に関する詳細は「普通預金：普通預金の金利について」をご確認ください。'
