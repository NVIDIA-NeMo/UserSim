  body: "本ツールは、お客様から「朝凪カードローン」の申込みを受け付け、審査プロセスを開始するために使用します。エージェントは本ツールを直接呼び出すことで手続きを完了させます。お客様に外部サイトや窓口へ誘導する必要はありません。\n\
    \n【ツール仕様】\n- ツール名: apply_card_loan\n- 引数:\n    - 氏名（フルネーム）: お客様から提供された正確な氏名\n\
    - 実行内容: カードローンの申込みを登録します。審査の結果に基づき、利用限度額が決定されます。\n\n※本ツールを呼び出す前に、必ず `verify_identity`\
    \ を使用して、お客様のフルネームおよび生年月日の2点による本人確認を完了させてください。"
