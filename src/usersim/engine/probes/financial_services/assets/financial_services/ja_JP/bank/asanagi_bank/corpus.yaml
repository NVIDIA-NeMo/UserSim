- id: 20c7e9be-6152-51c9-b9cd-694d9c768652
  title: 朝凪Visaデビット：よくあるお手続きの流れ
  body: '「朝凪Visaデビット」のお申込みからご利用開始までの流れをご案内します。


    【お手続き前の準備】

    当行の普通預金口座をお持ちである必要があります。口座をお持ちでない方は、先に「普通預金：お申込みとご利用開始」の手順に従ってください。


    【お手続きの流れ】

    1. お申込みの意思表示：カードの発行を希望される旨をお伝えください。

    2. ご本人確認：お客様の「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認します。

    3. 口座の確認：紐付ける普通預金口座の状況を確認し、発行に必要な条件を満たしているか審査いたします。

    4. 発行手続き：当行にてカードの発行処理を行います。

    5. カードの受け取り：ご登録のご住所へカードが配送されます。お手元に届きましたら、利用開始の手続き（アクティベーション）を行ってください。


    【ご利用開始後】

    ・1日あたりの利用限度額は初期設定で500,000円となっております。

    ・ご利用分は即時に口座から引き落とされますので、残高のご確認をお願いいたします。'
  domain: cards
  product_category: asanagi_debit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 797ede45-2b13-52bb-b7b7-2c247471eb90
  title: 朝凪Visaデビット：明細や記録と合わない
  body: 'お客様から「利用した金額と口座からの引き落とし額が異なる」「明細に心当たりのない記録がある」とのお問い合わせを受けた際の対応フローです。


    【確認すべき原因】

    1. 海外利用時の事務手数料

    海外での決済の場合、利用金額に加えて3%の事務手数料が加算されます。お客様が認識されている金額にこの手数料が含まれているか確認してください。


    2. オーソリゼーション（仮押さえ）

    ホテルやレンタカー等の利用時、実際のお取引額より多い金額が一時的に「仮押さえ」され、後日確定額に修正される場合があります。このタイムラグにより、一時的に残高が不整合に見えることがあります。


    3. 決済タイミングのズレ

    即時引き落としですが、加盟店側の処理により明細への反映に時間を要する場合や、まとめ買いなどで合算されて表示される場合があります。


    【対応手順】

    1. 取引の特定：お客様の「フルネーム（氏名）」と「生年月日」で本人確認を行い、該当する取引日時と金額を照合します。

    2. 内容の説明：上記の手数料（3%）や仮押さえの仕組みについて丁寧に説明し、納得いただけるか確認します。

    3. 不正利用の疑い：お客様が全く心当たりのない取引である場合、直ちにカードの利用停止措置を講じます。


    【エスカレーション】

    金額の相違が解消されない場合や、不正利用の疑いが強い場合は、速やかに支店責任者または専門部署へエスカレーションし、預金者保護法に基づいた補償手続きの検討に入ります。'
  domain: cards
