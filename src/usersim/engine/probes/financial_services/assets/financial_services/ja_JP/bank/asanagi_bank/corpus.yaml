  title: 住宅ローン：手数料一覧
  body: '【住宅ローン適用手数料】


    ・融資手数料（借入金額に対する割合）：2.2%

    ・インターネットでの一部繰上返済手数料：0円


    ※上記以外の諸費用（印紙代等）については、別途実費をご負担いただきます。また、繰上返済の形態（期間短縮型・返済額軽減型）による手数料の差異はございませんが、詳細は個別にご案内いたします。'
