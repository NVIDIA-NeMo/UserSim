- id: 85becb23-0989-557a-901c-67788df172b5
  title: 朝凪Visaデビット：リスクについてのご説明
  body: '朝凪Visaデビットのご利用にあたり、以下のリスクおよび注意点について十分にご確認ください。


    ■残高不足による決済不能リスク

    本カードは、決済時に口座残高から即時に引き落とされる仕組みです。口座残高が利用金額を下回っている場合、決済は承認されず、お買い物ができません。クレジットカードのような「後払い」機能はありませんのでご注意ください。


    ■海外利用時のコスト増

    海外の加盟店でご利用いただく際は、為替レートに加え、海外利用時の事務手数料として3%が加算されます。これにより、日本国内での利用時よりも実質的な費用が高くなる点にご留意ください。


    ■不正利用のリスク

    万が一、カード番号等の情報が漏洩し、第三者に不正利用された場合、口座から資金が引き落とされるリスクがあります。当行では預金者保護法に基づき補償を行いますが、お客さまに重大な過失（暗証番号を他人に教える等）がある場合は、補償額が制限されることがあります。


    ■利用限度額の制限

    1日あたりの利用限度額（初期設定）は500,000円となっております。この金額を超える決済は、設定変更を行わない限りご利用いただけません。


    これらのリスクを理解した上で、適切に管理し、安全にご利用いただけますようお願い申し上げます。'
