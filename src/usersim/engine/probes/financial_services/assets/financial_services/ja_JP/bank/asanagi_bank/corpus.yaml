- id: 10bf9f74-771b-5800-8818-22192a920947
  title: stop_payment を使う場面
  body: '公共料金やクレジットカードの利用料金など、普通預金口座から設定されている口座振替（自動引落し）の停止を希望されるお客様に対応する場合に本手続きを実施します。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様のフルネームと生年月日の2点を確認し、本人確認を完了します。

    2. `get_accounts` を使用し、対象となる普通預金口座の account_id を特定します。

    3. お客様に、停止を希望される振替項目（例: 電気料金、〇〇カード代金など）を確認します。

    4. `stop_payment` を呼び出し、自動引落しの停止処理を行います。


    口座振替の停止後、別の方法で支払いたい場合は「pay_bill を使う場面」の手順をご案内ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: asanagi_bank
