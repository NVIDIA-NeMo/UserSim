- id: 1c2c2209-670e-5012-aa95-63ae3a3e994b
  title: スーパー定期：不正利用からお客さまを守るために
  body: '朝凪銀行では、お客さまのの大切な資産を守るため、セキュリティ対策を徹底しております。特に「スーパー定期」のような資産形成を目的とした商品をご利用の際は、以下の点にご注意ください。


    ■不審な連絡へのご注意

    当行からのお電話やメール、SMSにおいて、暗証番号、パスワード、クレジットカード番号、または身分証番号などの機密情報を求めることは一切ございません。このような要求があった場合は、詐欺の可能性が非常に高いため、絶対に応じないでください。


    ■本人確認について

    当行で口座情報の照会や変更などの操作を行う際は、必ず本人確認を実施いたします。確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の情報は、本人確認の目的で伺うことはございません。


    ■異常を感じたときの対応

    キャッシュカードの紛失や盗難、または身に覚えのない取引があることに気づいた場合は、ただちに当行へご連絡ください。迅速に利用停止措置を行い、預金者保護法に基づき誠実に対応いたします。


    安全にお取引いただくため、定期的なパスワードの変更や、不審なメールのリンクをクリックしないなどの対策をあわせてお願いいたします。'
  domain: retail_banking
  product_category: super_teiki
  document_type: security_advisory
  source_authority: official
  placeholder: true
