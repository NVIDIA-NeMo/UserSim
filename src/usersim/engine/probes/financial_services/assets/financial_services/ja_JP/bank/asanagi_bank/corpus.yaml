- id: 20b4f1f2-2933-503f-b62f-0f0c461d702c
  title: 朝凪Visaデビット：不正利用からお客さまを守るために
  body: '朝凪Visaデビットを安心してお使いいただくために、不正利用への対策と当行の取り組みについてご説明いたします。


    ■インターネット利用時のセキュリティ

    オンラインショッピングなどのインターネット決済では、本人認証サービス「EMV 3-Dセキュア」を導入しております。これにより、カード番号と有効期限だけでなく、ご本人様のみが知るパスワード等での認証が求められるため、第三者による不正利用のリスクを大幅に低減できます。


    ■カード紛失・盗難時の対応

    万が一、カードを紛失されたり、盗難に遭われたりした場合は、直ちにご連絡ください。迅速に利用停止措置を行い、被害の拡大を防ぎます。偽造・盗難キャッシュカードによる不正な払戻しについては、預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。ただし、過失がある場合は補償額が減額される場合がございます。


    ■当行が絶対に求めない情報

    当行では、口座情報の照会や変更などの操作を行う際、ご本人確認として「フルネーム（氏名）」および「生年月日」の2点のみを確認させていただきます。

    以下の情報は、電話やメール、SMSなどで絶対にお尋ねすることはありません。不審な連絡があった場合は、直ちにご注意ください。

    ・暗証番号（PIN）

    ・ネットワークパスワード

    ・カード番号、有効期限、セキュリティコード

    ・身分証番号


    万が一、不審な取引に気づいた際は、速やかに当行へお知らせください。'
  domain: cards
  product_category: asanagi_debit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 1bc14d33-7594-5618-b064-a65541bf90a0
  title: 朝凪Visaデビット：規定・約款
  body: '本規定は、お客さまが朝凪Visaデビットをご利用いただく際の条件を定めるものです。


    ■サービスの基本原則

    朝凪Visaデビットは、お買い物と同時に、ご指定の普通預金口座から代金が即時に引き落とされる決済サービスです。口座残高を超えてのご利用はできません。また、本サービスの提供にあたり、年会費は0円とさせていただきます。


    ■利用限度額について

    1日あたりの利用限度額（初期設定）は500,000円です。この限度額は、不正利用などのリスクを抑制するための制限であり、お客さまのご要望に応じて変更手続きが可能です。


    ■海外利用時の手数料

    日本国外でご利用いただいた場合、決済金額に加えて海外利用時の事務手数料として3%が課金されます。この手数料は、外貨から日本円への換算および決済処理に伴う費用として適用されます。


    ■特典の適用

    一定の条件を満たすご利用に対し、キャッシュバック率0.2%に基づいた還元を行います。還元の詳細な条件および付与時期は、当行の規定に従います。


    ■契約の終了とカードの停止

    カードの紛失、盗難、または本規定への重大な違反が認められた場合、当行は事前の通知なくカードの利用を停止できるものとします。また、口座の解約に伴い、本サービスの契約も同時に終了いたします。


    本規定の内容に変更がある場合は、当行のホームページまたは店頭にて事前にお知らせいたします。'
  domain: cards
  product_category: asanagi_debit
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: d3333256-a95e-5a00-8527-c905a649c378
  title: 朝凪Visaデビット：おすすめの方と主な使い方
  body: '朝凪Visaデビットは、現金を持ち歩く不安を解消し、日々の決済をスマートに行いたい方に最適なカードです。


    ■このような方におすすめです

    ・「家計管理をシンプルにしたい」方：利用と同時に口座から引き落とされるため、後からまとめて請求が来るクレジットカードよりも支出の把握が容易です。

    ・「使いすぎを防ぎたい」方：口座残高の範囲内でしか利用できないため、計画的な消費が可能です。

    ・「コストを抑えて便利に使いたい」方：年会費は0円であり、どなたでも気軽にご利用いただけます。


    ■主な活用シーン

    ・日々のショッピング：スーパーやコンビニなど、Visa加盟店で現金不要の決済が可能です。

    ・オンライン決済：Amazonや楽天などのECサイトで、口座残高から即時に支払いが完了します。

    ・海外旅行や出張：海外のVisa加盟店でそのままご利用いただけます（別途、海外利用時の事務手数料3%が適用されます）。


    ■本サービスの魅力

    ・即時決済の安心感：クレジットカードのように借金をすることなく、今ある資金で決済いただけます。

    ・お得な還元：ご利用額に応じて、0.2%のキャッシュバックを受けられるため、日常の支払いが資産形成の助けになります。

    ・安心の限度額設定：1日あたりの利用限度額（初期設定）は500,000円となっており、高額決済にも対応しつつ、セキュリティを確保しています。


    詳細な商品概要については、「朝凪Visaデビット：商品概要」をご参照ください。'
  domain: cards
  product_category: asanagi_debit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 966d2bf0-8b08-5597-8967-302d235aa124
  title: 朝凪Visaデビット：海外利用時の事務手数料について
  body: 'Q：海外の店舗やウェブサイトで朝凪Visaデビットを利用した場合、どのような費用がかかりますか？


    A：ご利用金額に加えて、海外利用時の事務手数料として3%が加算されます。この手数料は、外貨建ての決済を日本円に換算し、お客さまの口座から引き落とす際の処理費用として設定されています。


    Q：海外利用時の手数料はいつ引き落とされますか？


    A：原則として、決済が行われたタイミングで、商品代金と合わせて3%の手数料が口座から即時に引き落とされます。そのため、口座残高には商品代金以上の余裕を持たせていただくことをおすすめいたします。'
  domain: cards
  product_category: asanagi_debit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 2541f424-4369-5229-9f6b-0e3c7ebab211
  title: 朝凪Visaデビット：解約・変更・プランの切替え
  body: '朝凪Visaデビットの解約、または登録情報の変更手続きについてご案内いたします。


    ■お手続きに必要なもの

    ・ご本人様確認書類（運転免許証、パスポート等）

    ・キャッシュカード（解約時に回収させていただきます）


    ■お手続きの手順

    1. 本人確認：まず、ご本人様であることを確認するため、「フルネーム（氏名）」および「生年月日」をお伺いします。

    2. 要望の提示：解約、または変更したい内容（例：1日あたりの利用限度額の変更など）をお伝えください。

    3. 内容の審査・確認：当行にて現在の契約状況と変更内容を確認し、手続きの可否を判定します。

    4. 完了の案内：お手続きが完了した旨を、口頭または書面にてご案内いたします。解約の場合は、お手元のカードを速やかに破棄、または当行へご返却ください。


    ■ご注意事項

    ・1日あたりの利用限度額（初期設定：500,000円）の変更については、セキュリティ上の理由から、審査および確認にお時間をいただく場合がございます。

    ・解約後は、直ちにカードが利用不能となります。あらかじめご了承ください。


    口座自体の解約をご希望の場合は、「普通預金：解約・変更・プランの切替え」をご参照ください。'
  domain: cards
  product_category: asanagi_debit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 486c8170-f732-5ab9-a8b0-30195b2aeb12
  title: 朝凪Visaデビット：想定外の手数料・金額
  body: 'お客さまより「利用した金額よりも多く口座から引き落とされている」といったお問い合わせをいただいた際の対応手順です。


    ■考えられる原因と確認事項

    1. 海外利用の有無

    海外の店舗または海外に拠点を持つオンラインショップを利用されていないか確認してください。海外利用の場合、海外利用時の事務手数料3%が加算されます。


    2. 為替レートの変動

    外貨建て決済の場合、決済時の為替レートが適用されます。日本円での想定額と実際の引き落とし額に差が生じることがあります。


    3. キャッシュバックの未反映

    キャッシュバック率0.2%による還元は、決済と同時に行われるものではなく、後日まとめて適用されます。決済額から直接差し引かれるものではないことをご説明ください。


    ■解決策と案内

    ・海外利用であることが判明した場合：海外利用時の事務手数料3%が適用されている旨を丁寧に説明し、明細の内容と照らし合わせていただきます。

    ・金額に心当たりがない場合：不正利用の可能性があるため、直ちにカードの利用停止措置を講じます。その後、預金者保護法に基づいた補償手続きについてご案内してください。


    ■エスカレーション

    原因が不明確な場合や、お客さまが納得されない場合は、速やかに支店責任者または専門部署へ報告し、詳細な取引ログの調査を依頼してください。'
  domain: cards
  product_category: asanagi_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
