- id: ba352e21-8e87-5376-a995-38f3dca17e0b
  title: 普通預金：ご紹介・継続利用の特典
  body: '朝凪銀行では、地域の皆様に長く安心してお使いいただくため、普通預金口座の継続的なご利用をサポートする特典をご用意しております。


    特に、当行の口座を給与受取口座または年金受取口座としてご指定いただいたお客様には、振込手数料やATM利用手数料の負担を軽減できる「給与・年金受取特典」を適用させていただきます。


    日常的な決済から資産形成まで、普通預金に適用される0.4%の金利とともに、メインバンクとしてご利用いただくことで得られる多彩なメリットをぜひご活用ください。詳細は「給与・年金受取特典：商品概要」をご覧ください。'
