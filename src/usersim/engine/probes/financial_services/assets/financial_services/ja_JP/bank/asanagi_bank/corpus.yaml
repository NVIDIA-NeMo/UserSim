- id: cc7c9003-20e3-5ab1-92fa-1c4d5c2e1609
  title: 普通預金：想定外の手数料・金額
  body: "お客様から「身に覚えのない手数料が引かれている」「想定していた金額と異なる」というお問い合わせをいただいた際の対応フローです。\n\n【考えられる原因と確認事項】\n\
    まず、取引明細を確認し、以下の手数料が適用されていないか照合してください。\n\n1. 時間外ATM利用手数料（110円）\n   - 銀行の営業時間外にATMを利用した場合、110円の手数料が発生します。\n\
    2. 他行あて振込手数料（220円）\n   - インターネットバンキング経由で他金融機関へ振込を行った場合、220円の手数料が発生します。\n3. 再発行手数料（1,100円）\n\
    \   - キャッシュカードや通帳の再発行手続きを行った場合、1,100円の手数料が差し引かれます。\n\n【対応手順】\n・原因が上記手数料である場合は、適用条件について丁寧にご説明し、ご了承をいただきます。\n\
    ・もし上記に該当せず、かつお客様が不正利用を疑われる場合は、直ちにカードの利用停止措置を行い、預金者保護法に基づき誠実に対応します。\n\n【エスカレーション】\n\
    手数料の適用に納得いただけない場合や、複雑な紛争に発展した場合は、速やかに担当者から支店責任者または専門部署へエスカレーションし、透明性のあるプロセスで解決を図ります。詳細は「普通預金：規定・約款」に基づき判断してください。"
