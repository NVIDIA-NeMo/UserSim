- id: 1c4ab4ec-f624-5cf4-8de4-56f207655bd5
  title: 住宅ローン：おすすめの方と主な使い方
  body: '朝凪銀行の住宅ローンは、地域に根ざした安心感と、ライフプランに合わせた柔軟な選択肢を提供します。住まいの夢を叶えたいすべてのお客様を包括的にサポートいたします。


    【このような方におすすめです】

    ・返済額を抑えつつ、将来の金利変動に合わせて柔軟に対応したい方（変動金利プラン）

    ・一定期間の返済額を確定させ、家計の管理を安定させたい方（固定金利期間選択型プラン）

    ・地域に密着した金融機関で、対面による丁寧な相談を受けながら進めたい方


    【主なプランと金利（優遇後）】

    ・変動金利：1.375%

    ・固定金利期間選択型10年：3.7%


    【ご利用上のポイント】

    ・借入限度額は最大100,000,000円、期間は最長35年まで設定可能です。

    ・団体信用生命保険への加入により、万が一の際にもご家族に安心を提供できます。

    ・住宅ローン控除（2030年末までに入居した場合、年末残高の0.7%を所得税等から控除）を活用することで、税制面でのメリットを享受いただけます。


    【費用について】

    ・融資手数料として、借入金額の2.2%を申し受けます。

    ・インターネットでの一部繰上返済手数料は0円となっており、計画的な資産形成を支援いたします。'
