- id: f281ad36-1777-5248-8423-33daa352ae7b
  title: 朝凪カードローン：重要事項のご説明
  body: '本商品は、金融庁の監督および銀行法に基づき提供されており、以下の重要事項についてご説明いたします。サポート担当者は、お客様に誠実に説明してください。


    【審査と限度額について】

    本商品は貸金業法の総量規制の対象外ですが、当行は銀行法および内部規定に基づき、お客様の返済能力を適切に審査します。審査結果に基づき利用限度額（最大8,000,000円）を決定し、決して過剰な融資は行いません。また、融資の承認を確約することはできません。


    【金利について】

    適用される貸付金利は年2%から14.5%の範囲内です。金利は個別の審査により決定され、借入残高に対して日割りで計算されます。


    【信用情報の登録】

    お申込みおよびご利用状況は、指定信用情報機関に登録されます。他社での借入状況が審査に影響する場合があります。


    【返済に関する注意】

    毎月の最低返済額は2,000円からとなっております。返済計画に無理がある場合や、返済が困難になった場合は、早めにご相談ください。返済条件の見直しについてご案内いたします。


    【個人情報の取り扱い】

    個人情報保護法および犯罪収益移転防止法に基づき、適正な本人確認を行い、適切に情報を管理いたします。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 7f223819-6a41-5ca5-9b85-23930441573f
  title: 朝凪カードローン：金利・料率一覧
  body: '朝凪カードローンの貸付金利についてご案内いたします。


    【貸付金利（年率）】

    **2% ～ 14.5%**


    【金利の決定方法】

    上記範囲内での適用金利は、以下の要素を総合的に審査して決定いたします。

    ・ご提出いただいた年収および安定した収入の有無

    ・当行における口座取引実績（給与・年金受取などのメインバンク利用状況）

    ・指定信用情報機関に登録されている他社借入状況および返済履歴

    ・その他、当行が定める審査基準


    【金利の適用と変更】

    ・金利はご契約時に決定し、原則としてご契約期間中の適用金利となります。

    ・ただし、当行の規定により金利が見直される場合がございます。その際は事前にお客様へ通知いたします。


    【計算方法】

    利息は、借入残高に対して年率を適用し、日割り計算（1年を365日として計算）されます。'
