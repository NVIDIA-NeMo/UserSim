- id: 0755d2c5-c8c2-5a8f-a6b4-e2ad48303b1a
  title: 朝凪カードローン：商品概要
  body: '朝凪カードローンは、急な資金ニーズに迅速にお応えする、当行の柔軟な融資サービスです。審査を経て、お客様のご意向と返済能力に応じた利用限度額を設定いたします。


    【本商品のおもな特徴】

    ・一度のお申込みと審査で、最大8,000,000円までご利用いただけます。

    ・貸付金利は年2%から14.5%の間で、審査結果に基づき決定されます。

    ・毎月の最低返済額を2,000円からに設定しており、無理のない返済計画をサポートします。

    ・当行の普通預金口座と連携し、スムーズなご借入とご返済が可能です。


    【ご利用条件】

    ・貸付金利（下限）：2%

    ・貸付金利（上限）：14.5%

    ・利用限度額の上限：8,000,000円

    ・毎月の最低返済額：2,000円


    詳細な金利については「朝凪カードローン：金利・料率一覧」をご参照ください。また、お申込みの流れについては「朝凪カードローン：お申込みとご利用開始」にてご案内しております。'
