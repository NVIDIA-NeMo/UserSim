- id: c7788ca6-b4eb-5898-bd99-9bd9612bfcaa
  title: 給与・年金受取特典：安全にご利用いただくためのポイント
  body: '「給与・年金受取特典」を安全にご利用いただくために、以下の重要なセキュリティポイントをご確認ください。


    ■当行が絶対に求めない情報

    当行が口座情報の照会や変更などの手続きを行う際、本人確認のために求める事項は「フルネーム（氏名）」および「生年月日」の2点のみです。以下の情報は、どのような場合であっても電話やメールでお尋ねすることはございません。

    ・暗証番号、パスワード

    ・キャッシュカード番号、身分証番号


    ■不審な連絡への対応

    「特典の更新手続きが必要です」などと称して、暗証番号やパスワードを求める連絡があった場合は、詐欺の可能性がございます。すぐにお電話を切り、当行の窓口までご相談ください。


    ■カード紛失時の対応

    キャッシュカードを紛失または盗難された場合は、被害を最小限に抑えるため、ただちに当行へ届け出て利用停止措置を行ってください。預金者保護法に基づき、誠実に対応いたします。


    詳細は「普通預金：不正利用からお客さまを守るために」も併せてご確認ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: security_advisory
