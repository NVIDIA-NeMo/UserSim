  institution_id: asanagi_bank
- id: d123f158-d3df-5799-96e6-9d9e2ce7d75c
  title: スーパー定期：1年ものの金利について
  body: '【質問】スーパー定期の「1年もの」の金利はどのくらいですか？

    【回答】「1年もの」の適用金利は0.55%です。短期的な資産運用を検討されているお客さまに多くご利用いただいております。


    【質問】金利は預入期間中に変動しますか？

    【回答】いいえ、スーパー定期は預入時に金利が確定する商品です。1年ものをお申し込みいただいた場合、満期まで0.55%の金利が適用されます。


    【質問】1年ものの満期後に、別の期間に変更することはできますか？

    【回答】はい、可能です。満期後のお手続きにおいて、3年もの（0.85%）や5年もの（1.05%）への切り替えをご案内しております。詳細については「スーパー定期：商品概要」をご確認ください。'
