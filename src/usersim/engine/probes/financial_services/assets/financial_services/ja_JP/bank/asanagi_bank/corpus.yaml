- id: e5c5e401-ab2e-5edf-b57a-398bd28dab08
  title: 給与・年金受取特典：手数料と費用
  body: '「給与・年金受取特典」の手数料に関するよくあるご質問です。


    Q. この特典を利用するために、別途申し込み手数料や月額利用料はかかりますか？

    A. いいえ、本特典をご利用いただくための費用は一切かかりません。当行の口座を給与受取または年金受取口座にご指定いただくだけで、自動的に適用されます。


    Q. 他行への振込手数料は、すべて無料になりますか？

    A. いいえ、無料となるのは月3回までです。4回目以降の他行あて振込については、所定の手数料がかかります。


    Q. ATMの手数料について教えてください。

    A. 時間外ATM手数料が、月に5回まで無料でご利用いただけます。6回目以降のご利用には、時間外手数料が発生いたします。


    詳細な料金体系については、「給与・年金受取特典：手数料一覧」をご覧ください。'
