- id: d694dae2-df9a-527c-b81e-ed7a6462a1c6
  title: スーパー定期：登録内容の変更
  body: '「スーパー定期」の登録内容（ご住所やご連絡先など）を変更される際の手順をご案内いたします。


    ■事前のご準備

    お手元にご本人様確認ができる書類（運転免許証やマイナンバーカードなど）をご用意ください。


    ■お手続きの流れ

    1. ご本人確認

    担当者に「登録内容の変更をしたい」旨をお伝えください。まず、ご本人確認のため「フルネーム（氏名）」と「生年月日」をお伺いします。これらをご確認いただいた後、お手続きに移ります。


    2. 変更内容の提示

    変更したい項目（例：新住所、電話番号）を正確にお伝えください。担当者が変更内容をシステムに入力し、確認画面を提示いたします。


    3. 内容の最終確認と完了

    提示された変更内容に間違いがないかをご確認ください。相違がなければ、手続き完了となります。変更後の内容は、次回の通帳記帳や通知書にてご確認いただけます。


    ※暗証番号の変更を希望される場合は、別途所定の手続きが必要となります。あわせてご案内いたしますので、担当者までお知らせください。'
