- id: 286f8af1-6f34-5054-b735-409daf277638
  title: 朝凪Visaデビット：ご紹介・継続利用の特典
  body: '【ご紹介・継続利用キャンペーンのご案内】


    日頃より当行をご利用いただき、誠にありがとうございます。この度、多くの方に「朝凪Visaデビット」の利便性を実感していただくため、特別な特典をご用意いたしました。


    ■キャンペーン期間

    2025年4月1日から2025年6月30日まで


    ■特典内容

    1. ご紹介特典：本カードをお使いのお客様のご紹介で新規に口座開設およびカード発行をされた方に、キャッシュバックとして1,000円を進呈いたします。

    2. 継続利用特典：期間中に累計100,000円以上のショッピング利用をされたお客様の中から抽選で、Amazonギフトカード3,000円分をプレゼントいたします。


    年会費は0円ですので、どなたでも気軽にお申し込みいただけます。この機会にぜひ、口座残高から即時引き落としができる安心感と、0.2%のキャッシュバック率を併せ持つ便利な決済手段をご体験ください。'
