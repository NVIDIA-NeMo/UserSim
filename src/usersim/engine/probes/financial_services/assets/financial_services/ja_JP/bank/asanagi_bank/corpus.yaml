  body: 'スーパー定期の適用金利一覧です。お選びいただく預入期間に応じて、以下の年利率が適用されます。


    【適用金利（年率）】

    ・1年もの：0.55%

    ・3年もの：0.85%

    ・5年もの：1.05%


    【適用条件】

    ・最低預入金額：1,000円から適用されます。

    ・適用期間：預入時から満期日まで、上記金利が固定で適用されます。


    【変動要因】

    本商品は固定金利商品であるため、預入後の期間中に金利が変動することはありません。ただし、満期前に解約された場合は、上記金利ではなく、当行規定の「中途解約利率」が適用されます。'
