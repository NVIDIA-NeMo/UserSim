  institution_id: asanagi_bank
- id: 12dc7956-e1c4-57f1-8a60-62d789e77ebf
  title: スーパー定期：お申込みいただける方
  body: 'スーパー定期のお申し込み条件は以下の通りです。


    ・当行の普通預金口座を保有している方：お申し込み可能

    ・預入金額が1,000円以上の方：お申し込み可能

    ・犯罪収益移転防止法に基づく本人確認（氏名・生年月日）が完了した方：お申し込み可能

    ・外貨での預入を希望される方：お申し込み不可（本商品は日本円のみの取り扱いとなります）


    詳細な本人確認の手順については、「スーパー定期：お申込みとご利用開始」をご参照ください。'
