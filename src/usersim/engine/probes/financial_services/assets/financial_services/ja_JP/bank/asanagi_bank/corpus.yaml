- id: 7793e524-bcaf-59c4-85e5-782eeedba8ed
  title: スーパー定期：当社の似た商品との比較
  body: '当行の「普通預金」と「スーパー定期」の比較をご案内いたします。


    【普通預金】

    ・特徴：いつでも自由に入出金が可能で、利便性が非常に高い口座です。

    ・金利：スーパー定期に比べ、適用金利は低く設定されています。

    ・向いている方：日常的な決済や、急な出費に備えて資金を置いておきたい方。


    【スーパー定期】

    ・特徴：一定期間資金を預けることで、高い金利を確保できる商品です。

    ・金利：期間に応じて0.55%（1年）、0.85%（3年）、1.05%（5年）と、普通預金より高く設定されています。

    ・制約：原則として満期までのお預かりとなります。中途解約は可能ですが、金利が「中途解約利率」に低下します。

    ・向いている方：1,000円以上のまとまった資金を、安全に効率よく増やしたい方。


    利便性を優先される場合は「普通預金：商品概要」を、資産形成を優先される場合は「スーパー定期：商品概要」をご検討ください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 133127ae-9e01-5f9e-8ebd-343bd1aacf5e
  title: スーパー定期：重要事項のご説明
  body: 'スーパー定期のご利用にあたり、以下の重要事項を必ずご確認ください。


    【預金保険制度について】

    本商品は預金保険制度の対象です。当行が破綻した場合でも、預金保険機構により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【税金について】

    お支払いとなる利息には、所得税、復興特別所得税、および地方税として計20.315%の税金が課せられます。税引後の金額が口座に入金されます。


    【中途解約について】

    満期前に解約される場合は、当初ご案内した約定金利ではなく、「中途解約利率」が適用されます。中途解約利率は当初の金利よりも低くなるため、受取利息が減少しますのでご注意ください。


    【個人情報の取扱い】

    お申し込み時の本人確認等で取得した個人情報は、個人情報保護法および犯罪収益移転防止法に基づき、適正に管理・利用いたします。


    詳細な法令上の案内については、「法令・制度に関するご案内：預金・日常のお取引」をご参照ください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
