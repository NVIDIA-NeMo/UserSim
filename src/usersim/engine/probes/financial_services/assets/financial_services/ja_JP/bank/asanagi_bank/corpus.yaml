- id: eb88036d-3290-515d-b5cb-a645d8e4c68b
  title: スーパー定期：実施中のキャンペーン
  body: '【2026年 資産形成応援キャンペーン実施のお知らせ】


    地域のみなさまの確かな資産形成をサポートするため、スーパー定期の利用促進キャンペーンを実施しております。


    【キャンペーン期間】

    2026年4月1日 〜 2026年6月30日


    【対象商品と金利】

    期間中のお申し込みについて、以下の競争力ある金利をご提供いたします。

    ・1年もの：0.55%

    ・3年もの：0.85%

    ・5年もの：1.05%


    【対象となる方】

    ・最低預入金額1,000円以上で、期間中にお申し込みいただいたすべてのお客さまが対象です。


    特に、給与や年金の受取口座として当行をご利用いただいているお客さまは、他の特典と併せてご利用いただくことで、より効率的な資産運用が可能です。詳細は「給与・年金受取特典：商品概要」をご確認ください。'
