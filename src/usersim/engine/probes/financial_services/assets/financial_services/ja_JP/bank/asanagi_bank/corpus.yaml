- id: 7034764e-949e-599f-bf1b-72e5d940fbf2
  title: 朝凪Visaデビット：1日あたりの利用限度額（初期設定）について
  body: 'Q：朝凪Visaデビットの1日あたりの利用限度額はいくらですか？


    A：本カードの1日あたりの利用限度額（初期設定）は 500,000円です。この金額を超えてのお買い物やサービス利用はできませんのでご注意ください。


    Q：初期設定の限度額を変更することは可能ですか？


    A：はい、変更可能です。お客様のご利用状況に合わせて限度額の変更を承っております。お手続きの詳細については、当行の窓口またはインターネットバンキングにてご確認いただけます。なお、限度額を上げても、口座残高を超える金額を利用することはできませんので、あわせてご了承ください。


    詳細については「朝凪Visaデビット：商品概要」をご参照ください。'
