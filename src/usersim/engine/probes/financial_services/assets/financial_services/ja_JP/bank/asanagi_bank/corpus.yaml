  institution_id: asanagi_bank
- id: 518c1a9f-96e7-5914-9af5-2394a1465ce5
  title: 朝凪Visaデビット：手数料と費用
  body: 'Q：朝凪Visaデビットの年会費はいくらですか？


    A：年会費は0円です。どなたでも費用負担なく、安心してお使いいただけます。


    Q：海外で利用する場合、追加の費用はかかりますか？


    A：はい。海外加盟店でご利用いただいた際は、海外利用時の事務手数料として3%をいただいております。


    Q：カードの再発行に費用はかかりますか？


    A：紛失や盗難による再発行の手数料については、「朝凪Visaデビット：手数料一覧」または「普通預金：キャッシュカード・通帳の再発行手数料について」をご確認ください。'
