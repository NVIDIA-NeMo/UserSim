- id: 62baf09b-03bc-5812-9e21-0914aa579e31
  title: 朝凪カードローン：必要書類
  body: '「朝凪カードローン」のお申し込みに際し、以下の書類のご提示が必要となります。


    | 確認事項 | 必要書類（例） | 判定 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、パスポート | 必須（いずれか1点） |

    | 居住確認 | 公共料金の領収書、住民票の写し（免許証等で確認不可の場合） | 必要に応じて提示 |

    | 返済能力の確認 | 直近の給与明細書、源泉徴収票、確定申告書 | 必須（年収を証明できるもの） |


    ※書類の内容に基づき審査を行い、最大8,000,000円の範囲内で利用限度額を決定いたします。'
