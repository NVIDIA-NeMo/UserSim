  institution_id: asanagi_bank
- id: f3f581e2-6ec6-5093-be98-e5831f8d0f7a
  title: 給与・年金受取特典：金利・料率の決まり方と適用
  body: '本特典における金利上乗せの適用メカニズムについて説明します。担当者は正確に案内してください。


    【年金受取特典金利の適用】

    ・上乗せ幅：0.1%

    ・適用対象：年金受取口座として登録されているお客さまが、当行の定期預金（スーパー定期）に新規に預入、または自動継続された場合に適用されます。


    【計算方法】

    適用金利 ＝ 「スーパー定期の基本約定金利」 ＋ 「年金受取特典金利 0.1%」


    【適用タイミング】

    年金受取口座としての登録が完了した時点から適用されます。登録前に預入された定期預金については、原則として満期後の継続時または新規預入時から適用となります。


    【注意点】

    この0.1%の上乗せは、預金保険制度の対象となる元本1,000万円までの保護範囲内であっても、適用される金利にのみ加算されるものです。利息には別途20.315%の税金がかかることを併せて案内してください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: rate_sheet
  source_authority: official
