- id: 88607d25-a6a4-5192-887c-6925f79ac953
  title: 朝凪カードローン：限度額・制限と注意事項
  body: '【サポート担当者向け：商品制限および注意事項】


    「朝凪カードローン」の利用限度額および適用金利に関する制限事項です。顧客への案内時には、以下の数値を正確に提示してください。


    ■利用限度額および金利

    ・利用限度額の上限：8,000,000円

    ・貸付金利（下限）：2%

    ・貸付金利（上限）：14.5%

    ※利用限度額は、お客様の返済能力を適切に審査したうえで決定されます。一律に上限額が適用されるわけではありません。


    ■審査とコンプライアンス

    ・本商品は銀行法に基づき金融庁の監督を受けています。

    ・貸金業法による「総量規制（年収の3分の1まで）」の対象外ですが、当行では健全な貸付を維持するため、厳格な返済能力審査を実施いたします。

    ・借入の状況は、指定信用情報機関に登録されます。他社借入状況を含めた総合的な判断となりますので、審査結果について確約することは禁止されています。


    ■注意事項

    ・返済が困難になったお客様には、早めの相談と返済条件の見直しを案内してください。

    ・個別の税務相談や法的助言は行わず、必要に応じて専門家への相談を促してください。

    ・顧客への説明責任を果たし、総返済額を小さく見せるような不適切な誘導は厳禁です。'
