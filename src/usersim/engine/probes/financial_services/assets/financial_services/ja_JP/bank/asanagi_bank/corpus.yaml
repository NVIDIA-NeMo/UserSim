- id: 06959db5-ec1d-55e1-b18d-fe0846e97289
  title: スーパー定期：ご紹介・継続利用の特典
  body: '【地域のみなさまへ：感謝の特典キャンペーン】


    いつも朝凪銀行をご利用いただき、誠にありがとうございます。当行では、地域の皆様との絆をより深めるため、以下の特典をご用意いたしました。


    ■ご紹介特典

    2024年4月1日から2024年9月30日までにお知り合いの方を「スーパー定期」へご紹介いただき、新しく口座を開設された場合、ご紹介者様とご成約者様それぞれに、ギフト券2,000円分を差し上げます。


    ■継続利用特典

    すでに「スーパー定期」をご利用中で、満期時に自動継続手続きをされたお客様には、抽選で地域特産品セットをプレゼントいたします。


    本制度は、当行をメインバンクとしてご利用いただいているお客様への感謝を込めた取り組みです。詳細については、窓口にてお気軽にお尋ねください。'
