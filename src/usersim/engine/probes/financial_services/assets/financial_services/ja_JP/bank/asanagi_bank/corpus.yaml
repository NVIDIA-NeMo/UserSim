- id: 1222b76f-4637-5e00-81e3-af8c68e83332
  title: 朝凪カードローン：実施中のキャンペーン
  body: '【給与・年金受取口座のお客様限定：審査スピードアップキャンペーン】


    日頃より当行をメインバンクとしてご利用いただいているお客様に、より便利なサービスをご提供するためのキャンペーンを実施いたします。


