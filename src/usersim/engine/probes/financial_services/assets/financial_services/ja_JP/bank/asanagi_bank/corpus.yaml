- id: 0cb253e8-599e-5d29-ab24-29123361deaf
  title: 普通預金：安全にご利用いただくためのポイント
  body: 'お客様のの大切な資産を守るため、普通預金をご利用いただく際は以下のセキュリティポイントにご注意ください。


    【当行が絶対にお伺いしない事項】

    朝凪銀行では、電話やメール、SMS等で、お客様の「暗証番号」「パスワード」「キャッシュカード番号」「身分証番号」を求めることは一切ございません。これらの情報を入力させる画面や、電話口での回答を求める連絡があった場合は、詐欺の可能性が高いため、絶対に応じないでください。


    【本人確認について】

    口座情報の照会や変更など、状態変更を伴う操作を行う際は、必ず本人確認を実施いたします。当行で確認させていただく事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の機密情報を求められた場合は、直ちにご注意ください。


    【万が一のときは】

    キャッシュカードの紛失や盗難に気づかれた際は、被害を最小限に抑えるため、速やかに当行へご連絡ください。迅速に利用停止措置を行い、預金者保護法に基づき誠実に対応いたします。


    安全な取引環境を維持するため、パスワードの適切な管理と、不審な連絡への警戒をお願い申し上げます。詳細は「普通預金：不正利用からお客さまを守るために」でもご確認いただけます。'
