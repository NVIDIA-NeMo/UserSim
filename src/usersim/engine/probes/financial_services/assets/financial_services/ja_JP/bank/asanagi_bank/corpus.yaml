- id: 0a02d72b-fde9-59e3-9e42-0a968715b882
  title: file_transaction_dispute を使う場面
  body: '朝凪Visaデビットにおいて、お客様が「身に覚えのない利用がある」または「二重に引き落とされている」として、調査と補償の申し出をされた場合にこのツールを使用します。


    【手続きの流れ】

    1. 本人確認の実施：`verify_identity` を呼び出し、お客様のフルネーム（氏名）と生年月日を確認します。

    2. カードの特定：`get_accounts` を呼び出し、お客様が利用しているカードの `card_id` を特定します。

    3. 取引の確認：`get_account_transactions` を使用して、問題となっている取引の日時や金額を確認し、お客様と合意します。

    4. 紛争申立の受付：`file_transaction_dispute` を呼び出し、対象の取引について調査と補償の手続きを開始します。

    5. 案内：手続きが受理されたことを伝え、今後の調査プロセスについて案内します。


    注意点：不正利用の疑いがある場合は、まず `freeze_card` を使用してカードを停止させることを優先してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
