- id: f5b3230b-a535-5d03-9dc7-e2fe8a8ade7c
  title: 住宅ローン：プランの選び方
  body: 'お客様のライフプランに合わせて、変動金利と固定金利期間選択型から最適なプランをお選びいただけます。


    ■プラン別特徴


    ・変動金利（優遇後）：1.375%

    【メリット】当初の返済額を低く抑えられます。

    【リスク】金利上昇時に返済額が増加します。ただし、返済額の見直しは5年ごとに行われ、上昇幅は前回の125%が上限となる仕組みでリスクを緩和しています。


    ・固定金利期間選択型10年（優遇後）：3.7%

    【メリット】10年間は金利が固定されるため、返済計画が立てやすく安心です。

    【リスク】変動金利に比べて当初の金利が高めに設定されています。


    ■おすすめの方

    ・金利上昇のリスクを許容し、初期の支払いを最小限にしたい方は「変動金利」

    ・将来の金利変動に左右されず、安定した家計管理を優先したい方は「固定金利期間選択型」が適しています。'
