- id: f720156c-e409-52b3-bb3b-cc07bcf7f595
  title: 給与・年金受取特典：ログインできない・アクセスできない
  body: 'インターネットバンキングにて、特典の利用状況（無料回数の残りなど）を確認しようとしてログインできない場合の対処法をご案内いたします。


    ■考えられる原因と確認事項

    ・ログインIDまたはパスワードの入力間違い：大文字・小文字の区別や、不要なスペースが入っていないかご確認ください。

    ・アカウントのロック：短時間に複数回認証に失敗した場合、セキュリティ保護のため一時的にロックされます。


    ■解決方法

    1. パスワードの再設定

    パスワードを忘れた場合は、ご本人確認（フルネームおよび生年月日）を行った上で、再設定の手続きを承ります。


    2. ロックの解除

    アカウントがロックされている場合は、当行にて本人確認を行った後、ロックを解除いたします。


    ■解決しない場合（エスカレーション）

    上記を確認しても解決しない場合は、システム部門の専門部署へ案件をエスカレーションし、詳細な調査を行います。調査結果および復旧の目途については、後ほど担当者より改めてご連絡いたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
