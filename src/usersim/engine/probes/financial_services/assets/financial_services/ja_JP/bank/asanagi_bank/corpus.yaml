- id: d4fe4c70-9597-58e2-b209-e398d47a21c1
  title: order_replacement_card を使う場面
  body: 'キャッシュカードまたは朝凪Visaデビットカードの紛失、盗難、破損、あるいは有効期限切れに伴い、カードの再発行が必要となった場合に本手続きを行います。


    ### 手続きの流れ

    1. **本人確認の実施**: お客様から「フルネーム（氏名）」および「生年月日」を伺い、`verify_identity` を呼び出して本人確認を完了します。

    2. **対象カードの特定**: `get_accounts` を呼び出し、お客様が保有する口座およびカードの一覧を確認します。再発行したいカードの末尾4桁を伺い、対応する
    `card_id` を特定します。

    3. **再発行の実行**: 特定した `card_id` を使用して `order_replacement_card` を呼び出します。


    ### 注意点

    - 再発行には所定の手数料がかかります。詳細については「普通預金：キャッシュカード・通帳の再発行手数料について」をご参照ください。

    - カードの紛失や盗難により不正利用の恐れがある場合は、本手続きの前に直ちに `freeze_card` を実行してカードの利用停止措置を講じてください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: asanagi_bank
- id: acfde9d9-2503-5061-b14c-eca138c1d7ce
  title: order_replacement_card ツールリファレンス
  body: '### ツール概要

    キャッシュカードまたは朝凪Visaデビットカードの再発行手続きを行うためのツールです。


    ### 実行動作

    オペレーターが本ツールを呼び出すことで、新しいカードの発行手続きが開始され、登録住所へ配送されます。また、規定の再発行手数料が口座から引き落とされます。


    ### 引数

    - `card_id`: 再発行対象となるカードの識別子。`get_accounts` ツール等で特定した ID を指定します。


    ### 注意事項

    本ツールを呼び出す前に、必ず `verify_identity` による本人確認を完了させてください。本人確認済みの操作であるため、カード番号全文や暗証番号などの情報は不要です。'
