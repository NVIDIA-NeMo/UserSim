- id: b49b05ab-cefe-57b1-ad74-3392d874c47d
  title: pay_bill を使う場面
  body: "税金や公共料金などの支払いを、ペイジー（Pay-easy）を利用して普通預金口座から行いたいというお客様に対応する場合に本手続きを実施します。\n\
    \n【手続き手順】\n1. `verify_identity` を呼び出し、お客様のフルネームと生年月日の2点を確認し、本人確認を完了します。\n2. `get_accounts`\
    \ を使用し、支払元となる普通預金口座の account_id を特定します。\n3. お客様に、払込票に記載されている以下の情報を確認します。\n   \
    \ - 収納機関番号、お客様番号、確認番号、賛同番号（またはペイジー指定の納付番号）\n    - 支払金額（例: 3,500円）\n4. `pay_bill`\
    \ を呼び出し、払込み処理を実行します。\n\n本サービスのご利用により、窓口へ行かずに便利に税金・公共料金のお支払いが可能です。"
