- id: 931e7f8f-30b7-5e8c-9bc5-f94a789830cf
  title: 朝凪カードローン：想定外の手数料・金額
  body: 'お客様より「引き落とし金額が想定より高い」「心当たりのない金額が加算されている」とのお問い合わせをいただいた際の対応手順です。


    ■想定される原因

    1. 利息の累積：貸付金利（最大14.5%）に基づき、借入残高に対して日割りで計算される利息が加算されているため。

    2. 最低返済額の適用：借入残高がある場合、最低でも2,000円の返済額が設定されるため。

    3. 遅延損害金の発生：返済日の入金が遅れたことにより、規定の遅延損害金が加算されているため。


    ■確認ステップ

    1. 本人確認（フルネームと生年月日）を行い、お客様の借入状況を確認します。

    2. 直近の貸付残高と適用金利、および返済日の入金状況を照合します。

    3. お客様へ、利息計算の仕組みや、遅延の有無について丁寧にご説明します。


    ■解決しなかった場合の対応

    金額の計算に不備がある疑いがある場合や、お客様が納得されない場合は、速やかに支店責任者または専門部署へエスカレーションし、詳細な再計算と正式な回答を依頼してください。お客様には「専門部署にて精査し、改めてご連絡いたします」とお伝えください。'
