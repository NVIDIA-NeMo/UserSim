- id: 809f2389-5deb-56aa-bae7-32bd8691a760
  title: file_transaction_dispute ツールリファレンス
  body: 'デビットカードの不正利用や二重引き落としに関する調査および補償の申出を受け付けます。


    【シグネチャ】

    `file_transaction_dispute(card_id: string, transaction_id: string, reason: string)`


    【引数】

    - `card_id`: 対象となる朝凪Visaデビットの識別子。

    - `transaction_id`: 異議申し立てを行う特定の取引の識別子。

    - `reason`: 申立理由（例：「身に覚えのない利用」「二重引き落とし」など）。


    【効果】

    指定された取引について調査依頼が登録され、銀行の規定に基づいた補償審査プロセスが開始されます。


    【注意】

    本ツールは、`verify_identity` による本人確認完了後にのみ実行可能です。'
