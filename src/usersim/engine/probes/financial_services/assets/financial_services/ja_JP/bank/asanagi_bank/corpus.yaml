- id: ec13075b-145e-5e5b-ad89-1dd81e08cf8b
  title: 住宅ローン：ご紹介・継続利用の特典
  body: '【地域のみなさまと共に歩む、特別金利のご案内】


    当行をメインバンクとしてご利用いただいているお客様、および当行をご友人やご家族にご紹介いただいたお客様を対象に、住まいの夢を応援する特別優遇金利を適用いたします。


    ■適用金利（優遇後）

    ・変動金利：1.375%

    ・固定金利期間選択型10年：3.7%


    ■キャンペーン期間

    2025年4月1日から2025年9月30日までのお申込み分まで


    地域に根ざした金融機関として、皆様の長期的な資産形成と快適な住まいづくりを全力でサポートいたします。詳細な適用条件については、窓口にて丁寧にご説明させていただきます。'
