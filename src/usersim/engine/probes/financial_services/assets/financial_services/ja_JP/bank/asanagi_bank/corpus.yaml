- id: 3002dc65-56fb-5330-8d6b-3c4ba4e4295c
  title: cancel_time_deposit を使う場面
  body: '## 概要

    お客様が「スーパー定期」を満期前に解約し、資金を普通預金に戻したい場合にこの手続きを行います。


    ## 手続き手順

    1. **本人確認の実施**: `verify_identity`を呼び出し、お客様のフルネームと生年月日を確認します。

    2. **口座の特定**: `get_accounts`を使用して、解約対象となるスーパー定期の`account_id`を特定します。

    3. **中途解約利率の説明**: 満期前に解約する場合、当初の約定金利よりも低い「中途解約利率」が適用されることを明確に説明し、同意を得ます。

    4. **ツールの実行**: `cancel_time_deposit`を呼び出し、解約処理を実行します。元金と中途解約利率に基づいた利息が普通預金に入金されます。


    ## 注意点

    - 利息には20.315%の税金がかかることをあわせてご案内ください。

    - 中途解約に関する定義については、「スーパー定期：商品概要」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_time_deposit
  institution_id: asanagi_bank
- id: 11f0633f-2085-57ee-b217-e9137a275ee8
  title: cancel_time_deposit ツールリファレンス
  body: "## 概要\n「スーパー定期」を満期前に解約し、元金と中途解約利率で計算された利息を、お客様の普通預金口座へ払い戻します。\n\n## ツール仕様\n\
    - **ツール名**: `cancel_time_deposit`\n- **引数**: \n    - `account_id`: 解約対象となるスーパー定期口座の識別子。\n\
    \n## 動作とエージェントの役割\nエージェントはこのツールを直接呼び出すことで、定期預金の解約手続きを完了させます。\n\n本ツールの実行前に、`verify_identity`による本人確認が完了している必要があります。中途解約に伴う利率の変更については、エージェントがツール実行前に口頭で説明し、お客様の同意を得る義務があります。"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_time_deposit
  institution_id: asanagi_bank
- id: e105faeb-cd92-5c4c-bf0d-cd8c5942cb5f
  title: request_loan_prepayment を使う場面
  body: "## 概要\n「住宅ローン」をご利用のお客様が、借入金の一部または全額を予定より早く返済（繰上返済）したい場合にこの手続きを行います。\n\n##\
    \ 手続き手順\n1. **本人確認の実施**: `verify_identity`を呼び出し、お客様のフルネームと生年月日を確認します。\n2. **ローン口座の特定**:\
    \ `get_accounts`を使用して、対象となる住宅ローンの`account_id`を特定します。\n3. **返済方法の選択**: 以下のいずれの形式で返済するかを確認します。\n\
    \    - **期間短縮型**: 毎月の返済額は変えず、返済期間を短縮する方法。\n    - **返済額軽減型**: 返済期間は変えず、毎月の返済額を減らす方法。\n\
    \    - **全額繰上返済**: 残高をすべて返済する方法。\n4. **金額の確認**: 繰上返済する金額（円）を確認します。\n5. **ツールの実行**:\
    \ `request_loan_prepayment`を呼び出し、手続きを完了させます。\n\n## 注意点\n- 手続き後の残高や返済スケジュールへの影響について、誠実に説明してください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_loan_prepayment
  institution_id: asanagi_bank
- id: 36f80a79-21c0-58cb-9dec-10666c39c652
  title: request_loan_prepayment ツールリファレンス
  body: "## 概要\n住宅ローンの一部繰上返済（期間短縮型または返済額軽減型）、あるいは全額繰上返済の申し込みを受け付けます。\n\n## ツール仕様\n\
    - **ツール名**: `request_loan_prepayment`\n- **引数**: \n    - `account_id`: 対象となる住宅ローン口座の識別子。\n\
    \    - `amount`: 繰上返済する金額（円）。\n    - `prepayment_type`: 返済形式（期間短縮型、返済額軽減型、または全額返済）。\n\
    \n## 動作とエージェントの役割\nエージェントはこのツールを直接呼び出すことで、繰上返済の処理を完了させます。\n\n本ツールの実行前に、`verify_identity`による本人確認が必須です。エージェントは、選択された返済形式がお客様のライフプランに合致しているかを確認し、適切な説明を行う責任があります。"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_loan_prepayment
  institution_id: asanagi_bank
- id: b65bf3e1-2cda-5d91-9305-ec092242925b
  title: change_loan_rate_type を使う場面
  body: '## 概要

    「住宅ローン」をご利用のお客様が、金利タイプを「変動金利」から「固定金利期間選択型」へ変更したい、あるいは固定期間終了後の金利タイプを選び直したい場合にこの手続きを行います。


    ## 手続き手順

    1. **本人確認の実施**: `verify_identity`を呼び出し、お客様のフルネームと生年月日を確認します。

    2. **ローン口座の特定**: `get_accounts`を使用して、対象となる住宅ローンの`account_id`を特定します。

    3. **金利タイプの説明**: 変動金利と固定金利期間選択型の違い、およびそれぞれのメリット・リスクについて説明し、お客様の意向を確認します。

    4. **ツールの実行**: `change_loan_rate_type`を呼び出し、金利タイプの変更処理を完了させます。


    ## 注意点

    - 変動金利の場合、返済額は5年ごとに見直され、上限は前回の125%となること、また未払利息が生じる可能性があることを適切に説明してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_loan_rate_type
  institution_id: asanagi_bank
- id: 4695237a-2c5e-53a2-994a-91fc3d46731d
  title: change_loan_rate_type ツールリファレンス
  body: "## 概要\n住宅ローンの金利タイプを変動金利から固定金利期間選択型に変更、または固定期間終了時の金利タイプ選択を行います。\n\n## ツール仕様\n\
    - **ツール名**: `change_loan_rate_type`\n- **引数**: \n    - `account_id`: 対象となる住宅ローン口座の識別子。\n\
    \    - `new_rate_type`: 変更後の金利タイプ（変動金利 または 固定金利期間選択型）。\n\n## 動作とエージェントの役割\nエージェントはこのツールを直接呼び出すことで、金利タイプの切り替え手続きを完了させます。\n\
    \n本ツールの実行前に、`verify_identity`による本人確認が完了している必要があります。金利変更に伴う返済額の変動について、お客様へ十分な説明を行った上で実行してください。"
