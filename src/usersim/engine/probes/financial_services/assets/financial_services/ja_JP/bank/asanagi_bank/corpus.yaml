- id: 2a928566-9b5f-5fcb-ba2b-450c28b59f0c
  title: 給与・年金受取特典：年金受取の方の定期預金金利の上乗せ幅について
  body: 'Q：年金受取口座として利用すると、定期預金の金利にどのようなメリットがありますか？


    A：当行の「給与・年金受取特典」により、年金受取の方には、定期預金金利の上乗せ幅 0.1% という優遇金利を提供しております。通常の定期預金金利にこの上乗せ幅が加算されるため、より効率的な資産形成が可能です。


    Q：この上乗せ金利はどのような商品に適用されますか？


    A：主に「スーパー定期」などの定期預金商品が対象となります。詳細な適用条件や現在の基本金利については、「スーパー定期：商品概要」をご確認いただくか、窓口の担当職員までお問い合わせください。'
