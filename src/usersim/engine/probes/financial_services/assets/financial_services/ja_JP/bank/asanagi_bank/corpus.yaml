- id: cba6d45d-d87a-51ad-84aa-c781f51cd373
  title: 給与・年金受取特典：当社の似た商品との比較
  body: '当行の標準的な普通預金口座と、「給与・年金受取特典」を適用した状態での違いを比較します。


    | 比較項目 | 標準的な普通預金 | 給与・年金受取特典適用時 |

    | :--- | :--- | :--- |

    | 他行あて振込手数料 | 全回数で所定の手数料 | 月3回まで 0円 |

    | 時間外ATM手数料 | 全回数で所定の手数料 | 月5回まで 0円 |

    | 定期預金金利（年金受取） | 通常金利のみ | 通常金利 ＋ 0.1%上乗せ |


    【どちらが適しているか】

    ・標準的な普通預金：たまにしか振込やATM利用をしない方、受取口座の指定が難しい方に向いています。

    ・給与・年金受取特典：毎月の固定費の支払いで他行への振込が多く、時間外にATMを利用される方、または年金受取口座として資産形成を効率的に行いたい方に最適です。'
