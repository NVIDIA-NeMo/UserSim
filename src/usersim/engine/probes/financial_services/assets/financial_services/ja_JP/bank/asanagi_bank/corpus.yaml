- id: 991b7b57-7b3e-5add-9959-ab97201e46ea
  title: freeze_card ツールリファレンス
  body: "## 概要\nキャッシュカードまたは朝凪Visaデビットの紛失や盗難が発生した際、不正利用を防止するために即座にカードの利用を停止します。\n\n\
    ## ツール仕様\n- **ツール名**: `freeze_card`\n- **引数**: \n    - `card_id`: 停止対象となるカードの識別子。`get_accounts`ツールを用いて、お客様が提示したカード番号の下4桁から特定します。\n\
    \n## 動作とエージェントの役割\nエージェントはこのツールを直接呼び出すことで、カードの利用停止処理を完了させます。お客様に外部のアプリや窓口へ誘導することなく、対話の中で完結させます。\n\
    \n本ツールの実行前に、必ず`verify_identity`を用いてお客様の本人確認（フルネームと生年月日）を完了させてください。本ツール自体に認証のための引数は含まれていません。"
