  institution_id: asanagi_bank
- id: 809ba988-8f76-59ee-9e5a-969a53a6f774
  title: get_statements を使う場面
  body: "お客様から、過去の取引履歴や残高証明、または特定の期間の利用明細書の提供を求められた場合に、この手続きを行います。確定申告や住宅ローンの審査、家計管理などの目的で利用されることが一般的です。\n\
    \n手続きの際は、以下の手順に従って操作してください。\n\n1. 本人確認の実施：\n   verify_identity ツールを使用し、お客様の「フルネーム（氏名）」と「生年月日」を確認します。\n\
    2. 対象口座の特定：\n   get_accounts ツールを呼び出し、明細が必要な口座の account_id を確認します。複数の口座をお持ちの場合は、どの口座の明細が必要かを確認してください。\n\
    3. 期間の指定：\n   お客様に、明細を抽出したい具体的な期間（例：2024年1月1日から2024年12月31日まで）を確認します。\n4. 明細の取得：\n\
    \   get_statements ツールを呼び出し、特定した account_id と指定された期間を入力して、取引履歴を取得します。\n\n取得した情報は、お客様のプライバシー保護のため、適切に提示してください。また、明細の内容について不備や疑問がある場合は、「普通預金：明細や記録と合わない」などの関連ドキュメントに基づき、適切にご案内してください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: asanagi_bank
- id: 97a4b336-2c0a-5070-b76b-7d9c4952fa07
  title: get_statements ツールリファレンス
  body: "このツールは、指定された口座の取引明細（ステートメント）を取得するためのものです。エージェントは、このツールを呼び出すことで、お客様の過去の入出金履歴を確認し、提示することができます。\n\
    \n・引数：\n  - account_id: 明細を取得する口座の識別子（get_accounts ツールで特定します）。\n  - period: 明細を抽出する期間。開始日と終了日を指定します。\n\
    \n本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。取得したデータは、お客様への回答にのみ使用し、適切に取り扱ってください。"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: asanagi_bank
- id: ee1db5cf-255b-5ae0-9b70-96ceeb71c52e
  title: set_alerts を使う場面
  body: "お客様が、口座残高が一定金額を下回った際や、高額な入出金があった際に通知を受け取りたいと希望された場合に、この設定を行います。これにより、お客様はリアルタイムで口座の状態を把握でき、安心感を持ってご利用いただけます。\n\
    \n手続きの際は、以下の手順に従って操作してください。\n\n1. 本人確認の実施：\n   verify_identity ツールを呼び出し、お客様の「フルネーム（氏名）」と「生年月日」を確認します。\n\
    2. 対象口座の特定：\n   get_accounts ツールを使用して、アラートを設定したい口座の account_id を特定します。\n3. 通知条件の確認：\n\
    \   どのような条件で通知を希望されるか伺います（例：「残高が10,000円以下になったとき」や「50,000円以上の振込があったとき」など）。\n4.\
    \ アラートの設定：\n   set_alerts ツールを呼び出し、account_id、通知の種類（alert_type）、およびしきい値（threshold_value）を入力して設定を完了します。\n\
    \n設定完了後、どのような条件で通知が届くかを改めてお客様にご説明し、承諾を得てください。設定の変更や解除を希望される場合も、同様の手順で対応いたします。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: asanagi_bank
- id: 06a4eefc-143a-53b4-961c-c4db7e7806b9
  title: set_alerts ツールリファレンス
  body: "このツールは、口座の残高変動や取引に関する通知（アラート）を設定するためのものです。エージェントは、お客様の希望する条件に基づき、このツールを呼び出して設定を行います。\n\
    \n・引数：\n  - account_id: アラートを設定する口座の識別子（get_accounts ツールで取得します）。\n  - alert_type:\
    \ 通知の種類（例：残高減少、高額入金など）。\n  - threshold_value: 通知をトリガーとする金額などのしきい値。\n\n実行にあたっては、事前に\
    \ verify_identity による本人確認が完了している必要があります。設定内容は、お客様の利便性と資産管理のサポートを目的として提供されます。"
  domain: retail_banking
