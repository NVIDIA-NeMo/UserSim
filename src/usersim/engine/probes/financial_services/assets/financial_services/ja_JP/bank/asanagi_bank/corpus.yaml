- id: 948ca124-3b9c-5e72-b319-5045c487cd80
  title: 給与・年金受取特典：商品概要
  body: '朝凪銀行では、地域の皆様にメインバンクとして安心してご利用いただくため、「給与・年金受取特典」をご提供しております。当行の口座を給与受取口座または年金受取口座に指定いただくことで、日々の決済にかかるコストを軽減し、より豊かな資産形成をサポートいたします。


    【本特典の主な内容】

    ■ お取引手数料の優遇

    ・他行あて振込手数料：毎月3回まで無料

    ・時間外ATM手数料：毎月5回まで無料


    ■ 資産形成のサポート（年金受取の方限定）

    ・スーパー定期などの定期預金をご利用の際、通常の金利に加えて0.1%の金利を上乗せいたします。


    本特典は、日々の生活でお使いいただく「普通預金：商品概要」の口座とあわせてご利用いただくことで、最大限のメリットを享受いただけます。誠実で信頼される金融サービスを通じて、お客様の生活の発展に寄与してまいります。'
