- id: 83dc5364-a026-51a1-b89f-24c3afab4da4
  title: 住宅ローン：個人情報の取扱い
  body: '当行は、個人情報保護法および犯罪収益移転防止法に基づき、お客様の個人情報を厳格に管理いたします。


    ■利用目的

    住宅ローンのご契約にあたり、以下の目的で個人情報を利用させていただきます。

    ・融資審査における返済能力の確認（年収、勤務先、既存債務の照会など）

    ・指定信用情報機関への登録および照会

    ・契約内容の管理および返済状況の確認

    ・法令に基づく本人確認手続き（取引時確認）


    ■第三者への提供

    法令に基づく場合や、指定信用情報機関への登録など、適切な審査と管理に必要な範囲を除き、お客様の同意なく個人情報を第三者に提供することはございません。


    ■安全管理措置

    個人情報の漏洩、滅失、毀損を防止するため、組織的・人的・物理的・技術的な安全管理措置を講じております。


    本件に関するお問い合わせは、当行の個人情報保護担当窓口までお願いいたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
