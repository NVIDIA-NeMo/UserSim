  institution_id: asanagi_bank
- id: 1c65c5df-8647-5a84-92ce-035d96cfaabf
  title: スーパー定期：商品概要
  body: '朝凪銀行の「スーパー定期」は、確実な資産形成を目指すお客さまに最適な定期預金商品です。あらかじめお預かりする期間に応じて金利を設定し、満期まで安心してお任せいただくことで、普通預金よりも高い金利での運用が可能です。


    【お預り期間と適用金利】

    ・1年もの：0.55%

    ・3年もの：0.85%

    ・5年もの：1.05%


    【ご利用条件】

    ・最低預入金額：1,000円からお申し込みいただけます。


    【商品の特徴】

    本商品は、お預かりした元本と利息が保護される安全性の高い商品です。中長期的な視点で資産を増やしたい方や、まとまった資金を安全に保管したい方に推奨いたします。また、満期時の自動継続設定をいただくことで、手間なく資産形成を継続することが可能です。


    なお、利息には20.315%の税金が課されます。詳細な金利体系については、「スーパー定期：金利・料率一覧」をご参照ください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: product_sheet
  source_authority: official
