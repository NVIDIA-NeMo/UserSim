  institution_id: asanagi_bank
- id: 5d7dfe2b-dd4e-5d90-a600-080eabbcaacf
  title: 住宅ローン：不正利用からお客さまを守るために
  body: '住宅ローンのご契約に関連し、当行員や専門のコンサルタントを装った不審な電話やメールにご注意ください。特に「低金利への切り替えを案内するため」や「審査の結果、至急手続きが必要」として、個人情報を聞き出そうとする手口が報告されています。


    朝凪銀行では、口座情報の照会やご契約内容の変更を行う際、本人確認として「フルネーム（氏名）」および「生年月日」の2点のみを確認させていただきます。これら以外の暗証番号、ログインパスワード、クレジットカード番号、身分証の番号などは、いかなる理由があっても、電話やメールでお伺いすることはございません。


    もし不審な連絡を受け、個人情報を伝えてしまった場合や、身に覚えのない手続き通知が届いた場合は、直ちにご報告ください。迅速に状況を確認し、必要に応じて口座の利用停止などの保護措置を講じます。お客様の資産と安心を守るため、不審な点がある際は、まずは当行の窓口または電話サポートまでお知らせいただけますようお願い申し上げます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 78e596ff-1b5f-529a-8875-492030256e6e
  title: 住宅ローン：規定・約款
  body: '本規定は、朝凪銀行の住宅ローン利用における契約条件を定めるものです。


    1. 融資の決定と限度額

    当行は銀行法に基づき、お客様の返済能力および担保価値を適切に審査したうえで融資額を決定します。借入限度額は最大100,000,000円とし、最長借入期間は35年までとします。


    2. 手数料の負担

    借入時に、借入金額に対する割合として2.2%の融資手数料が発生します。この手数料は、融資実行時の条件に基づき算出され、原則として借入金額から差し引くか、別途お支払いいただきます。


    3. 返済の義務と金利の適用

    借入者は、約定した返済スケジュールに従い、元金および利息を遅滞なく支払う義務を負います。適用金利は、選択されたプラン（変動金利または固定金利期間選択型）に基づきます。


    4. 契約の変更および解約

    プランの切替えや繰上返済を希望される場合は、当行所定の手続きが必要です。インターネットでの一部繰上返済手数料は0円として提供されます。


    5. 期限の利益の喪失

    返済の遅延が一定期間継続した場合や、虚偽の申告が判明した場合は、期限の利益を喪失し、残債全額を直ちに返済していただく場合がございます。'
