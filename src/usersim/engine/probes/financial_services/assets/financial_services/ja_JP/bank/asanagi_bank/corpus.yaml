- id: 0028304e-e3e1-5702-9c60-27d7b257b0b8
  title: 朝凪Visaデビット：安全にご利用いただくためのポイント
  body: '「朝凪Visaデビット」を安心・安全にご利用いただくために、以下の重要なポイントをご確認ください。


    ■インターネット利用時のセキュリティ

    オンラインショッピングなどのインターネット利用には、本人認証サービス（EMV 3-Dセキュア）を導入しております。これにより、カード番号と有効期限に加え、ご本人様のみが知るパスワード等の入力が求められ、第三者による不正利用のリスクを大幅に軽減しております。


    ■紛失・盗難時の迅速な対応

    万が一、キャッシュカード・デビットカードを紛失されたり、盗難に遭われたりした場合は、ただちに当行までご連絡ください。迅速に利用停止措置を行い、被害の拡大を防ぎます。不正利用による被害については、当行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となります。


    ■当行からのお願いと注意点

    当行がお客様に、暗証番号、パスワード、カード番号、身分証番号などをメールや電話でお伺いすることは一切ございません。不審な連絡があった場合は、情報を伝えずに速やかにご相談ください。


    なお、口座情報の照会や変更などの操作を行う際は、必ず「フルネーム（氏名）」および「生年月日」の2点による本人確認を実施いたします。これ以外の機密情報を求められた場合は、十分にご注意ください。


    安全な取引環境を維持するため、お客様のご協力をお願い申し上げます。'
