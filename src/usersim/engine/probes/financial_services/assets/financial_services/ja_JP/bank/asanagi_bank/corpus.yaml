- id: b9cad86b-ee50-5952-8774-f517f2d880a2
  title: 住宅ローン：固定金利期間選択型10年の金利（優遇後）について
  body: 'Q: 固定金利期間選択型10年の金利（優遇後）はいくらですか？


    A: 固定金利期間選択型10年の適用金利（優遇後）は3.7%です。この金利は、借入から10年間固定されますので、期間中の金利上昇による返済額の増加を避けることができます。


    Q: 10年の固定期間が終了した後はどうなりますか？


    A: 固定期間終了後は、その時点の金利状況に基づき、再度金利が見直されます。お客様のご希望に合わせて、改めて固定金利期間を選択いただくか、変動金利へ移行いただくことが可能です。詳細な切り替え手続きについては「住宅ローン：解約・変更・プランの切替え」をご参照ください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: faq
  source_authority: official
  placeholder: true
