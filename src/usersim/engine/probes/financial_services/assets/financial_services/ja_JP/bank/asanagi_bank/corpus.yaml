  body: '朝凪Visaデビットのお申込み条件は以下の通りです。


    | 条件項目 | 内容 | 結果 |

    | :--- | :--- | :--- |

    | 当行口座の保有 | 朝凪銀行の普通預金口座を保有している | 必須（未保有の方は要開設） |

    | 本人確認 | 犯罪収益移転防止法に基づく取引時確認が完了している | 必須 |

    | 年齢制限 | 日本国内で法的に有効な契約締結が可能な年齢である | 必須 |

    | 居住地 | 日本国内に居住し、郵便物が受領可能な住所がある | 必須 |


    ※口座開設の手続きについては、「普通預金：お申込みとご利用開始」をご参照ください。'
