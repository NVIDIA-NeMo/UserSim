- id: ad25598d-4080-51fb-95f5-ad2c590e516b
  title: 普通預金：登録内容の変更
  body: 'ご住所、お電話番号、ご氏名などの登録内容を変更される際の手順をご案内いたします。正確な情報管理のため、以下の手順で手続きを行ってください。


    【事前のご準備】

    ・お手元にキャッシュカードまたは通帳をご用意ください。

    ・変更後の内容が確認できる公的書類（住民票や運転免許証など）をご準備ください。


    【変更手続きの手順】

    1. 変更内容の提示

    担当者に、変更したい項目（例：転居に伴う住所変更）とお知らせください。


    2. 本人確認の実施

    安全に手続きを行うため、本人確認を実施いたします。「フルネーム（氏名）」および「生年月日」の2点をお伺いします。これ以外の暗証番号やパスワードを求められることはございません。


    3. 証明書類の確認と受理

    ご準備いただいた身分証明書等の原本を提示してください。当行にて内容を確認し、変更手続きを行います。


    4. 変更完了の確認

    手続き完了後、変更内容が正しく反映されたことを担当者が確認し、お客様へご報告いたします。


    【完了の目安】

    窓口での手続きの場合、その場で完了いたします。インターネットバンキング経由で申請された場合は、審査および処理に数営業日かかる場合がございます。


    なお、カードの再発行を伴う変更（氏名変更等）がある場合は、再発行手数料として1,100円を申し受けます。詳細は「普通預金：手数料一覧」をご参照ください。'
