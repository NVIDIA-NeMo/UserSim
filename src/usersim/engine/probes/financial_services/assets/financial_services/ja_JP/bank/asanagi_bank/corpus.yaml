  product_category: futsu_yokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: caef32b3-2085-59b7-8401-180b2a42f2b7
  title: 普通預金：規定・約款
  body: '本規定は、朝凪銀行（以下「当行」）が提供する普通預金口座の開設および運用に関する条件を定めるものです。本口座のご利用にあたっては、銀行法および金融庁の監督指針、ならびに当行の規定に従うものとします。


    1. 預金および利息

    当行は、預金金額に対して年0.4%の金利を適用いたします。利息の計算および支払方法は、当行所定の基準に基づきます。


    2. 手数料の負担

    お客さまは、以下の手数料を支払うものとします。

    ・他行あて振込手数料（インターネットバンキング利用時）：220円

    ・時間外のATM利用手数料：110円

    ・キャッシュカードおよび通帳の再発行手数料：1,100円


    3. 本人確認とコンプライアンス

    口座開設および重要な手続きに際し、犯罪収益移転防止法に基づき、適切な本人確認（取引時確認）を実施します。個人情報は個人情報保護法に従い適切に取り扱われます。


    4. 規定の変更および解約

    当行は、社会情勢の変化や法令の改正に伴い、本規定および手数料、金利を変更することがあります。変更の際は、あらかじめ告知いたします。また、お客さまはいつでも口座を解約することができ、その際は残高および利息を精算するものとします。


    詳細は「普通預金：商品概要」にてご確認ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: d4cf65f6-4483-5996-b9bb-12dac1949d26
  title: 普通預金：おすすめの方と主な使い方
  body: '朝凪銀行の「普通預金」は、地域に根ざした信頼の金融サービスとして、日常的なお金の管理に最適な、利便性の高い基本口座です。


    【このような方におすすめです】

    ・毎月の給与や年金を確実に受け取りたい方

    ・公共料金やクレジットカードの支払いに口座振替を利用したい方

    ・いつでも自由に入出金でき、かつ適正な金利で資産を管理したい方


    【主なご利用シーン】

    ・給与・年金受取口座として：日々の生活費の管理に最適です。当行をメインバンクとしてご利用いただくことで、手数料の負担を軽減できる「給与・年金受取特典」をご利用いただけます。

    ・日常の決済に：インターネットバンキングを利用した他行への振込（手数料220円）や、ATMでの現金引き出しなど、スムーズな決済をサポートします。


    【適用金利と基本手数料】

    ・普通預金金利：0.4%

    ・時間外ATM利用手数料：110円

    ・キャッシュカード・通帳再発行手数料：1,100円


    地域のみなさまに信頼される銀行として、日常の決済から将来の資産形成まで、包括的にサポートさせていただきます。お手続きについては「普通預金：お申込みとご利用開始」をご参照ください。'
