- id: 7b030ba1-dc47-5c07-af8c-6d27627a02cc
  title: 朝凪Visaデビット：登録内容の変更
  body: '「朝凪Visaデビット」にご登録いただいている住所や連絡先などの内容を変更される際の手順をご案内いたします。


    ■お手続き前にご用意いただくもの

    ・ご本人様確認が可能な状態（お電話口で回答できる状態）


    ■変更の手順

    1. 担当者に「登録内容の変更」を希望される旨をお伝えください。

    2. 本人確認のため、ご自身の「フルネーム（氏名）」および「生年月日」を回答してください。※暗証番号やパスワード、カード番号などは求めませんので、お答えにならないようご注意ください。

    3. 変更したい項目（例：住所、電話番号）と、新しい内容を伝えてください。

    4. 担当者が内容を確認し、変更処理を行います。処理が完了した旨の案内を受けたら、お手続きは完了です。


    ■変更後のご確認

    変更内容が正しく反映されたかどうかは、インターネットバンキングの会員情報画面にてご確認いただけます。もし内容に誤りがある場合や、不審な変更通知を受け取った場合は、直ちにご連絡ください。


    ※住所変更などの重要事項の変更は、ご本人様によるお手続きが必要となります。'
