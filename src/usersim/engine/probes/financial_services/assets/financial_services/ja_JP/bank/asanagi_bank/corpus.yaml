  mentions_tools: []
  institution_id: asanagi_bank
- id: 84385fb4-4e32-551a-8e74-3f70fced7933
  title: 住宅ローン：ほかの選択肢との比較と向かない場合
  body: '当行の住宅ローンは、長期的に安定した住まいの資金を確保したい方に適した商品です。他商品との特性の違いをご説明します。


    【本商品の強み】

    ・最大100,000,000円という高額な借入限度額と、最長35年の長期借入期間により、ゆとりある返済計画が可能です。

    ・団体信用生命保険への加入により、不測の事態におけるご家族の住まいが保護されます。


    【本商品が向かない場合】

    ・急ぎで少額の資金ニーズがある場合：住宅ローンは審査に時間を要し、目的も限定されています。迅速な資金調達を希望される場合は、「朝凪カードローン」などの検討をお勧めします。

    ・担保となる物件をお持ちでない場合：本商品は住宅を担保とするため、物件がない場合はご利用いただけません。

    ・返済能力の審査基準を満たさない場合：厳格なコンプライアンス体制に基づき、返済能力を審査しております。審査の結果、お借入れが難しい場合がございます。


    【結論】

    ライフプランに沿って、変動金利（1.375%）または固定金利（3.7%）を選択し、計画的に住宅を購入されたい方に最適な商品です。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 374a4c29-1c5b-5c7f-bef7-0afa47351a3c
  title: 住宅ローン：最長借入期間（年）について
  body: 'Q：住宅ローンの最長借入期間はどれくらいですか？

    A：当行の住宅ローンでは、最長借入期間（年）を35年として設定しております。期間を長く設定することで、月々の返済額を抑えることが可能です。


    Q：借入期間の途中で、期間を短くすることはできますか？

    A：はい、「期間短縮型」の繰上返済を行うことで、借入期間を短縮することが可能です。これにより、総返済額を減らすことができます。なお、インターネットでの一部繰上返済手数料は0円ですので、ぜひご活用ください。詳細については「住宅ローン：限度額・制限と注意事項」をご参照ください。'
  domain: lending_mortgage
