- id: 69969bc6-ed4b-5ec7-83d7-ac5a0b8472e0
  title: 普通預金：不正利用からお客さまを守るために
  body: '朝凪銀行では、お客さまの大切な資産を守るため、セキュリティの強化に努めております。昨今、銀行員や公的機関を装い、個人情報を聞き出そうとするフィッシング詐欺などの被害が増加しています。


    【当行が絶対に求めないこと】

    当行が、電話やメール、SMSなどで、お客さまに「暗証番号」「パスワード」「キャッシュカード番号」「身分証番号」を伺うことは一切ございません。これらの情報を求める連絡があった場合は、詐欺の可能性が非常に高いため、絶対に応じず、速やかに当行へご連絡ください。


    【本人確認について】

    口座情報の照会や変更などの手続きを行う際、当行から伺う確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。それ以外の機密情報を求められることはございません。


    【万が一のときは】

    キャッシュカードの紛失や盗難に気づいた際は、被害を最小限に抑えるため、直ちにご連絡ください。迅速に利用停止措置を行います。また、偽造・盗難キャッシュカードによる不正な払戻しについては、預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。


    なお、当行の普通預金は預金保険制度の対象となっており、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。'
