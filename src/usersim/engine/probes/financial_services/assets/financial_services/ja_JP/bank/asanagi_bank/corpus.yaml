    | 当行口座を給与受取口座に指定し、入金がある方 | 他行あて振込手数料（月3回まで無料）、時間外ATM手数料（月5回まで無料） |

    | 当行口座を年金受取口座に指定し、入金がある方 | 他行あて振込手数料（月3回まで無料）、時間外ATM手数料（月5回まで無料）、定期預金金利上乗せ 0.1%
    |

    | 給与および年金の両方を受取口座に指定されている方 | 上記すべての特典を適用 |


    ※いずれの場合も、当行の普通預金口座をお持ちであることが前提となります。'
