  institution_id: asanagi_bank
- id: 78b177d1-348d-5852-b86d-467879e75524
  title: スーパー定期：よくあるお手続きの流れ
  body: '「スーパー定期」の開設における一般的なお手続きの流れをご案内いたします。ここでは例として「3年もの」のプランをご希望の場合の手順を説明します。


    1. ご本人確認を行います。担当者へ「フルネーム（氏名）」と「生年月日」をお伝えください。

    2. 預入金額を決定します。1,000円以上の金額を、どの口座（普通預金など）から振り替えるかをご指示ください。

    3. 預入期間を選択します。「3年もの」をご希望である旨を伝え、適用金利（0.85%）を確認してください。

    4. 満期時の処理方法を指定します。「元金と利息をすべて普通預金へ解約」するか、「元金のみを自動継続」するかなどを選択してください。

    5. 担当者が手続きの内容を復唱確認し、承諾を得た後、預入処理を完了します。

    6. 手続き完了後、新しい定期預金口座の番号や満期日などが通知されますので、ご確認ください。


    なお、1年もの（0.55%）や5年もの（1.05%）をご希望の場合も、同様の流れで期間と金利を選択していただくことでお手続きが可能です。'
  domain: retail_banking
  product_category: super_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: b0f12fc3-2a79-5f03-8e5c-42c03b210905
  title: スーパー定期：明細や記録と合わない
  body: "お客様から「想定していた利息と実際の受取額が異なる」といったお問い合わせをいただいた際の確認手順です。サポート担当者は以下の項目を順に確認してください。\n\
    \n【確認ステップ】\n1. 税金の差し引き確認\n   - 提示されている金額が「税込み」か「税引き後」かを確認します。利息には一律で20.315%の税金が課せられるため、額面金利からこの分が差し引かれています。\n\
    2. 中途解約の有無を確認\n   - 満期前に解約されていないかを確認します。中途解約された場合は、約定金利ではなく「中途解約利率」が適用されており、利息が大幅に減少します。\n\
    3. 適用金利と預入期間の再確認\n   - 顧客が記憶している金利と、実際に設定された金利が一致しているか照合します。\n     - 1年もの：0.55%\n\
    \     - 3年もの：0.85%\n     - 5年もの：1.05%\n\n【解決策の提示】\n- 税金による減少である場合は、20.315%の課税について改めて丁寧にご説明ください。\n\
    - 中途解約によるものである場合は、中途解約利率の適用についてご案内ください。\n\n【エスカレーション】\n計算上の不備が疑われる場合や、システム上のエラーが考えられる場合は、速やかに支店責任者または専門部署へ報告し、正確な再計算と照会を依頼してください。"
  domain: retail_banking
