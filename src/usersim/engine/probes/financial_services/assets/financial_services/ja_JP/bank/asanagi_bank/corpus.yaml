  institution_id: asanagi_bank
- id: d5166b5c-96b6-5676-a73f-4dd35ea5a41d
  title: 朝凪カードローン：手数料と費用
  body: '【Q】借入時に手数料はかかりますか？また、金利はどのように決まりますか？


    【A】借入時の手数料は無料で、金利のみが発生いたします。


    適用される貸付金利は、審査結果に基づき 年 2% から 14.5% の範囲内で決定されます。金利は借入残高に対して日割りで計算されます。


    【Q】繰上返済をする際に、別途費用はかかりますか？


    【A】いいえ、繰上返済に際しての手数料はございません。余裕がある時にいつでもご返済いただくことで、利息負担を軽減いただけます。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: faq
