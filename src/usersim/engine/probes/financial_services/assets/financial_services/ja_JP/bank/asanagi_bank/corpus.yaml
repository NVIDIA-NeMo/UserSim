- id: 465f9311-b710-59a5-9a22-c359d8b7bc3b
  title: 住宅ローン：ログインできない・アクセスできない
  body: '住宅ローンの残高確認や一部繰上返済の手続きを行うためのオンラインサービスにログインできない場合の対処法をご案内いたします。


    ■想定される症状

    ・正しいID・パスワードを入力しているが「認証エラー」が表示される

    ・画面が読み込まれず、タイムアウトになる


    ■確認事項と解決策

    1. 入力内容の再確認

    大文字・小文字の区別や、不要なスペースが入っていないかをご確認ください。


    2. パスワードの再設定

    パスワードを忘れた場合は、再設定の手続きをお願いします。この際も、ご本人確認として「フルネーム（氏名）」と「生年月日」の確認を行います。


    3. 通信環境の確認

    ネットワーク接続が不安定な場合、正しくアクセスできないことがあります。一度ログアウトし、ブラウザのキャッシュをクリアして再度お試しください。


    ■解決しない場合（エスカレーション）

    上記を試しても解消されない場合は、担当者が専門部署へ調査を依頼いたします。原因の特定までにお時間をいただく場合がございますが、調査完了後、担当者より改めてご連絡差し上げます。'
