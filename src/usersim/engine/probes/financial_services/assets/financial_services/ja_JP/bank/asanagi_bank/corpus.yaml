- id: b3256fa8-1862-5d72-9e87-771cafb22048
  title: 朝凪Visaデビット：年会費について
  body: '【Q】朝凪Visaデビットの年会費はいくらですか？


    【A】朝凪Visaデビットの年会費は0円です。ご入会から更新時に至るまで、年会費のご負担なく継続してご利用いただけます。


    【Q】年会費が無料になる条件や、メインバンクとしての特典はありますか？


    【A】本カードは、給与・年金受取口座の指定などの条件に関わらず、すべてのお客様に年会費0円で提供しております。なお、給与・年金の受取口座にすることで得られるその他の優遇措置については、「給与・年金受取特典：商品概要」をご確認ください。'
