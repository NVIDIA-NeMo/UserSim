- id: b1f79716-c2f1-50dc-a661-336cc553f751
  title: 給与・年金受取特典：個人情報の取扱い
  body: '当行は、個人情報保護法および犯罪収益移転防止法に基づき、お客様の個人情報を厳格に管理しております。「給与・年金受取特典」のご利用にあたっては、以下の通り取り扱わせていただきます。


    ■本人確認の徹底

    特典の適用や口座情報の変更を行う際は、適正な本人確認を徹底しております。確認事項は「フルネーム（氏名）」および「生年月日」の2点のみとし、これ以外の機密情報（暗証番号等）を求めることはございません。


    ■利用目的

    お預かりした個人情報は、以下の目的で利用いたします。

    ・給与または年金の受取実績の確認および特典の適用判断

    ・振込手数料およびATM手数料の無料回数の管理

    ・定期預金金利の上乗せ幅 0.1% の適用管理


    ■安全管理措置

    お客様の情報は、厳格なアクセス制限を設けたシステム内で管理し、法令に基づき適切に保護いたします。預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護される体制の下、安心してお取引いただける環境を提供いたします。'
