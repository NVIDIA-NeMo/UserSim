- id: 55c9abad-e5e1-5112-b77e-71d76c4bbe1d
  title: スーパー定期：ご利用開始までの手順
  body: '本資料は、サポート担当者がお客様の「スーパー定期」開設を案内するための手順書です。誠実かつ丁寧な対応を心がけ、以下のステップで案内してください。


    【ステップ1：ご意向の確認と審査】

    まず、お客様が確実な資産形成を目的としているかを確認します。あわせて、預入希望額が最低預入金額である1,000円以上であることを確認してください。


    【ステップ2：本人確認の実施】

    口座開設や情報の登録にあたり、犯罪収益移転防止法に基づき適正な本人確認を行います。お客様に「フルネーム（氏名）」および「生年月日」をご提示いただき、照合してください。これ以外の機密情報（暗証番号等）を求めることは厳禁です。


    【ステップ3：プラン（期間）の選択】

    お客様のライフプランに合わせて、以下の金利プランから選択いただきます。

    ・1年もの：0.55%

    ・3年もの：0.85%

    ・5年もの：1.05%


    【ステップ4：預入手続きの完了】

    指定された口座から、または現金にて預入を行います。手続き完了後、預金通帳または証明書を発行し、適用金利と満期日を明確に提示してください。


    【注意点】

    預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されることを必ず明示してください。また、満期前に解約した場合は中途解約利率が適用される点についても、誠実に説明してください。'
