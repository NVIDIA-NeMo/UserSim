- id: 6ec19cb7-4cb4-5e35-8d7a-7d40159ea2fb
  title: スーパー定期：状況・履歴の確認
  body: "お持ちの「スーパー定期」の現在の残高や満期日、適用金利などの状況を確認する手順をご案内いたします。\n\n1. ご本人確認を行います。担当者へ「フルネーム（氏名）」と「生年月日」をお伝えください。これ以外の暗証番号やパスワードなどは求めませんのでご安心ください。\n\
    2. 確認したい口座の種別（スーパー定期）とお手続きの内容（残高照会、満期日の確認など）を担当者へお伝えください。\n3. 担当者が口座情報を照会し、以下の内容をご案内します。\n\
    \   - 現在の預入金額（元本）\n   - 適用されている金利（例：1年ものの0.55%など）\n   - 満期日\n   - 満期時の処理設定（自動継続か、普通預金への解約か）\n\
    4. 内容に相違がないかをご確認いただき、お手続き完了となります。\n\n詳細な取引履歴（預入・解約の履歴）が必要な場合は、別途取引明細書の発行を承りますので、併せてお申し付けください。"
  domain: retail_banking
  product_category: super_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 08232c55-83c4-52b6-8cfc-b7712fdb401b
  title: スーパー定期：お取引が拒否された・制限された
  body: "「スーパー定期」の開設や解約の手続きにおいて、エラーが発生したり、取引を拒否されたりする場合の確認事項です。\n\n【考えられる原因と確認事項】\n\
    1. 預入金額の不足\n   - 預入金額が最低預入金額の1,000円に満たっていない場合、お手続きが完了しません。金額を再度ご確認ください。\n2. 本人確認の不備\n\
    \   - ご提示いただいた「フルネーム（氏名）」または「生年月日」が、当行に登録されている情報と一致しない場合、セキュリティ保護のため操作が制限されます。登録内容に変更がないかご確認ください。\n\
    3. 口座の凍結・制限\n   - 犯罪収益移転防止法に基づく確認事項の未完了や、カードの紛失届出などにより、口座全体に制限がかかっている可能性があります。\n\
    \n【解決方法】\n- 金額不足の場合は、1,000円以上の金額で再度お申し込みください。\n- 本人確認でエラーが出る場合は、最新のご住所や氏名に変更がないか、身分証明書とともに改めてご確認をお願いいたします。\n\
    \n【エスカレーション】\n上記を確認しても解決せず、原因が不明な場合は、担当者から支店責任者または専門部署へ速やかにエスカレーションし、詳細な調査を行います。調査完了までにお時間をいただく場合がございますので、あらかじめご了承ください。"
  domain: retail_banking
  product_category: super_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 41915db2-3bef-5ed4-9fcb-a8c6d3a7a351
  title: スーパー定期：切替えや上位プランを検討するとき
  body: 'サポート担当者は、顧客が「普通預金」から「スーパー定期」への資金移動や、より長期のプランへの変更を検討している際に、以下の視点で案内してください。


    【普通預金との比較】

    - 普通預金：いつでも自由に出し入れができ、日常的な決済に適していますが、金利は低めに設定されています。

    - スーパー定期：1,000円から預入可能で、期間に応じた高い金利（1年もの0.55%、3年もの0.85%、5年もの1.05%）が適用されます。ただし、原則として満期まで資金を拘束するため、流動性は低くなります。


    【期間プランの選び方】

    - 短期的な資金準備（1年後など）であれば「1年もの（0.55%）」を推奨します。

    - より確実な資産形成を目指し、中長期的に資金を運用したい場合は、金利の高い「3年もの（0.85%）」や「5年もの（1.05%）」が適しています。


    顧客の資金ニーズが「日常の決済」にあるか「将来への貯蓄」にあるかを確認し、適切なプランを提案してください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: comparison
  source_authority: official
  placeholder: true
