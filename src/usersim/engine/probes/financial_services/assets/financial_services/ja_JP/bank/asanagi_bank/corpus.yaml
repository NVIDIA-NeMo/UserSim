  institution_id: asanagi_bank
- id: 67c0edea-49e0-51d5-a56c-06059c3d2242
  title: 給与・年金受取特典：お申込みとご利用条件
  body: '「給与・年金受取特典」の適用条件についてのご質問です。


    Q. 特典を適用してもらうための具体的な手続きはありますか？

    A. はい。お勤め先や年金事務所にて、受取口座として朝凪銀行の口座を指定してください。当行での別途申し込み手続きは不要ですが、実際に給与または年金の振込実績が確認された時点で特典が適用されます。


    Q. 給与受取と年金受取の両方を行っている場合、特典は重複しますか？

    A. 振込手数料（月3回まで）およびATM手数料（月5回まで）の無料枠は、合算されませんのでご注意ください。ただし、年金受取の方への定期預金金利上乗せ（0.1%）は、年金受取の実績があることで適用されます。


    Q. 受取口座を変更して、給与や年金が他行に切り替わった場合はどうなりますか？

    A. 当行への受取実績がなくなったことが確認された翌月から、本特典の適用は終了し、通常の手数料体系に戻ります。'
