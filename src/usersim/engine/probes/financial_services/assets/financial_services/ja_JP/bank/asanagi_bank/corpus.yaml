- id: e4b63c6e-10ef-5182-99e4-176ff798f9c1
  title: 給与・年金受取特典：お取引が拒否された・制限された
  body: '特典が適用されるはずの取引で、手数料が請求されたり、取引が制限されたりする場合の確認事項です。


    【考えられる原因とチェック項目】

    1. 無料回数の上限に達していないか

    ・他行あて振込は月3回、時間外ATM利用は月5回までが無料です。すでに上限に達している場合、以降の取引は有料となります。今月の利用回数を再度ご確認ください。


    2. 受取口座としての条件を維持しているか

    ・直近で給与または年金の受取が停止していませんか。受取口座としての指定が解除されている場合、特典が適用されません。


    3. 対象外の取引ではないか

    ・他行あて振込無料特典は、一部の特殊な送金形式には適用されない場合があります。


    【解決方法とエスカレーション】

    上記を確認しても正しく適用されていないと思われる場合は、当行までお知らせください。担当者が取引履歴を詳細に調査し、システム上の不具合や設定漏れがないか確認いたします。


    調査の結果、当行の不備で不当に手数料が徴収されていたことが判明した場合は、速やかに手数料相当額を口座へ返金（クレジット）させていただきます。解決までにお時間をいただく場合は、その旨を担当者から改めてご案内いたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 20dd57c0-77ac-5a38-8c01-bc30ba9b6f34
  title: 給与・年金受取特典：切替えや上位プランを検討するとき
  body: '本資料は、サポート担当者が「普通預金」のみの利用と「給与・年金受取特典」の適用を比較し、お客様に最適な案内をするためのものです。


    【比較概要】

    ・普通預金（基本）：他行あて振込や時間外ATM利用のたびに、所定の手数料が発生します。

    ・給与・年金受取特典：条件を満たすことで、他行あて振込手数料が月3回まで、時間外ATM手数料が月5回まで無料になります。また、年金受取の方は定期預金金利に0.1%の上乗せが適用されます。


    【提案の指針】

    ・給与や年金を他行で受取っているお客様へは、当行への受取口座変更を提案してください。これにより、日常的な決済コストを大幅に軽減できるメリットを提示します。

    ・すでに当行をメインバンクとしてご利用中の方には、受取指定の手続きが完了しているか確認し、未完了であれば手続きを案内してください。


    【適したお客様】

    ・毎月決まった回数の振込やATM利用がある方

    ・資産形成として定期預金を活用し、少しでも高い金利を希望される年金受取の方


    プランの選び方についての詳細は、「普通預金：プランの選び方」もご参照ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 46bd5b76-712e-5164-b5d7-3988ab4b2311
  title: 給与・年金受取特典：ほかの選択肢との比較と向かない場合
  body: '「給与・年金受取特典」をご検討中のお客様へ、本特典の内容とどのような方に向いているかをご説明します。


    【本特典のメリット】

    当行をメインバンクとして給与や年金をお受け取りいただくことで、日常的に発生する手数料の負担を軽減できます。

    ・他行あて振込手数料：月3回まで無料

    ・時間外ATM手数料：月5回まで無料

    ・年金受取の方限定：定期預金金利に0.1%の上乗せ適用


    【ほかの選択肢との比較】

    通常の普通預金口座では、これらの手数料は毎回発生いたします。本特典は、別途プランに加入するのではなく、受取口座に指定されることで得られる「優待」という位置づけです。


    【本特典が向かない場合】

    以下のようなお客様には、本特典によるメリットが少ないため、通常の普通預金としての利用をご検討ください。

    ・給与や年金を当行で受け取る予定がない方（受取実績がない場合は、無料回数の特典などが適用されません）

    ・他行あて振込や時間外ATM利用をほとんど行わない方


    お客様のライフプランに合わせた口座活用についてのご相談は、いつでも店舗窓口またはお電話にて承っております。'
