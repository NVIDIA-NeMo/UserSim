- id: 11c6de99-5127-5fdf-9149-4b4917204fde
  title: 朝凪Visaデビット：お取引が拒否された・制限された
  body: '「お店でカードを使おうとしたが、決済が拒否された」という状況への対応方法です。


    【考えられる原因と確認事項】

    1. 口座残高の不足

    デビットカードは即時決済のため、口座残高が利用金額を下回っている場合、お取引は拒否されます。現在の残高をご確認ください。


    2. 1日あたりの利用限度額への到達

    「朝凪Visaデビット」の1日あたりの利用限度額（初期設定）は500,000円です。当日の累計利用額がこの金額に達していないかご確認ください。


    3. 暗証番号の誤入力

    暗証番号を複数回間違えて入力された場合、セキュリティ保護のためカードが一時的に制限されます。


    4. 本人認証（3-Dセキュア）の不備

    オンラインショッピングにおいて、本人認証サービスの設定や入力に不備がある場合、決済が完了しません。


    【解決策と対応】

    ・残高不足の場合：口座への入金後に再度お試しください。

    ・限度額超過の場合：限度額の変更をご希望される場合は、お手続きをご案内します。

    ・制限がかかった場合：ご本人確認（氏名・生年月日）の上、制限解除の手続きを行います。


    【エスカレーション】

    上記を確認しても原因が不明な場合や、カードに物理的な不具合がある場合は、担当者から支店責任者または専門部署へ速やかにエスカレーションし、詳細な調査を行います。'
  domain: cards
  product_category: asanagi_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 764805eb-6488-579f-8f26-f8b73b291137
  title: 朝凪Visaデビット：切替えや上位プランを検討するとき
  body: 'お客様がクレジットカードへの切替えや、他の決済手段との比較を検討されている際の案内指針です。


    【朝凪Visaデビットの特長】

    ・コスト：年会費0円で、維持費がかかりません。

    ・管理：利用と同時に口座から引き落とされるため、使いすぎを防ぎ、家計管理が容易です。

    ・特典：利用額の0.2%がキャッシュバックされます。


    【クレジットカードとの比較】

    ・支払いタイミング：クレジットカードは後払いですが、本商品は即時払いです。

    ・審査：クレジットカードのような与信枠（借入）を伴わないため、残高の範囲内で安心してご利用いただけます。


    【どのような方に向いているか】

    ・「使いすぎを防止したい」「借金をせず、今ある資金の範囲でスマートに買い物をしたい」というお客様には、朝凪Visaデビットが最適です。一方で、高額な買い物を分割で支払いたい、あるいはポイント還元率を最優先したいというお客様には、クレジットカードの方が適している場合がございます。'
  domain: cards
  product_category: asanagi_debit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: d42f37d7-f83a-5d85-81f2-554c468ba3fd
  title: 朝凪Visaデビット：ほかの選択肢との比較と向かない場合
  body: '「朝凪Visaデビット」を検討されているお客様へ、他の決済手段との違いと、本商品が適さないケースをご説明します。


    【本商品が適している方】

    ・現金を持ち歩かずに、安心・便利に決済したい方

    ・年会費0円のコストパフォーマンスを重視される方

    ・利用額の0.2%という確実なキャッシュバックを希望される方

    ・口座残高の範囲内で支出を厳格に管理したい方


    【本商品が適さない方】

    ・一時的に口座残高以上の金額を支払う必要がある方（本商品は残高不足の場合、決済が拒否されます）

    ・支払いを先送りにしたい、または分割払いやリボ払いを利用したい方


    【現金決済との比較】

    現金に比べ、財布を厚くする必要がなく、紛失時のリスクも低減できます。また、現金では得られない0.2%のキャッシュバックというメリットがございます。


    【注意点】

    海外でのご利用には、別途3%の事務手数料がかかります。海外旅行等の際は、この点をご留意ください。また、インターネット利用時にはEMV 3-Dセキュアによる認証が必要となる場合がございます。'
  domain: cards
  product_category: asanagi_debit
  document_type: product_sheet
  source_authority: official
