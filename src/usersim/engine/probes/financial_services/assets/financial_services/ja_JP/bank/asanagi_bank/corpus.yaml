- id: 7680a11f-22f5-526f-ad09-6a3e3d167262
  title: 朝凪Visaデビット：キャッシュバック率について
  body: 'Q：朝凪Visaデビットを利用すると、キャッシュバックを受けられるのでしょうか？


    A：はい、ご利用額に応じてキャッシュバックをさせていただきます。本商品のキャッシュバック率は0.2%です。


    Q：キャッシュバックはどのように受け取れますか？


    A：ご利用実績に基づき、所定のタイミングでご登録の口座へ自動的に払い戻されます。詳細は「朝凪Visaデビット：商品概要」または「朝凪Visaデビット：金利・料率一覧」をご確認ください。'
