- id: a1299e5f-bf42-5e0e-a58f-65d6d9d144ee
  title: 住宅ローン：当社の似た商品との比較
  body: '当行の住宅ローンにおける「変動金利」と「固定金利期間選択型10年」の比較です。


    【変動金利】

    ・金利（優遇後）：1.375%

    ・特徴：適用金利が低く設定されており、当初の返済額を抑えられます。ただし、市場金利の上昇に伴い返済額が増加するリスクがあります。

    ・適した方：金利上昇リスクを許容でき、現在の返済額を最小限に抑えたい方。


    【固定金利期間選択型10年】

    ・金利（優遇後）：3.7%

    ・特徴：10年間は金利が固定されるため、返済額が確定し、長期的な家計管理が容易です。変動金利より金利は高めに設定されています。

    ・適した方：将来の金利変動に不安があり、一定期間の支払額を確定させて安心したい方。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 3d962fbd-2be5-567f-81be-8aaafd147571
  title: 住宅ローン：重要事項のご説明
  body: '本融資商品をご利用にあたり、以下の重要事項を必ずご確認ください。


    【金利変動と返済額について】

    変動金利を選択された場合、返済額は5年ごとに見直されます。見直し後の返済額は、見直し前の返済額の125%を上限とします。ただし、金利が大幅に上昇した場合、返済額が利息支払額を下回り「未払利息」が発生し、最終回にまとめて請求される可能性があります。


    【審査と限度額】

    借入限度額は最大100,000,000円ですが、実際の融資額は、お客様の年収、勤続年数、その他の債務状況などの返済能力を審査した上で決定します。


    【費用と保険】

    融資実行時に、借入金額の2.2%の融資手数料が発生します。また、団体信用生命保険への加入は必須であり、借入者が死亡または高度障害状態となった場合にローン残高が完済されます。


    【ご相談のお願い】

    景気変動やライフスタイルの変化により返済が困難になった場合は、放置せず早めにご相談ください。返済条件の見直しなど、誠実に対応させていただきます。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
