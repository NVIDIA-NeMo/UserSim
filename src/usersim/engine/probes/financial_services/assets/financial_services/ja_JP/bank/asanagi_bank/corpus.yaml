  title: 朝凪カードローン：ご利用条件による違い
  body: '【エージェント用：条件別適用内容】


    | ご利用条件（審査項目） | 適用の結果（設定内容） |

    | :--- | :--- |

    | 返済能力・信用情報の審査結果 | 貸付金利：年2% ～ 年14.5% の範囲内で決定 |

    | 返済能力・信用情報の審査結果 | 利用限度額：最大 8,000,000円 まで |

    | 全てのご利用者様 | 毎月の最低返済額：2,000円 |

    | 銀行法に基づく審査 | 貸金業法の総量規制（年収1/3）の対象外として審査 |


    ※個別の審査結果により、上限額に達しない場合や、貸付不可となる場合がございます。'
