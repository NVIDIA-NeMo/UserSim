- id: f043d4ad-087a-57f7-84ce-cc17c354147a
  title: 給与・年金受取特典：必要書類
  body: '本特典を適用し、受取口座として登録するために必要な書類は以下の通りです。


    | 条件 | 必要書類 | 判定 |

    | :--- | :--- | :--- |

    | 本人確認 | 運転免許証、マイナンバーカード、またはパスポート（いずれか1点） | 必須 |

    | 給与受取の証明 | 直近の給与明細書、または勤務先が発行した給与振込口座変更届 | 適用に必要 |

    | 年金受取の証明 | 年金振込通知書、または年金受給権者としての届出書 | 適用に必要 |'
