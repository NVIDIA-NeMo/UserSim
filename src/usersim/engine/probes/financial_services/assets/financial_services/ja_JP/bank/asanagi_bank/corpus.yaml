- id: b3bc4914-7c66-5e31-8030-316520f60fba
  title: 朝凪Visaデビット：お手続きが完了しない・保留中のまま
  body: '【症状】

    デビットカードの申込み手続きを行ったが、完了画面が表示されない、または審査や発行が「保留中」となっており、カードが届かない。


    【考えられる原因と確認事項】

    1. 本人確認情報の不備：ご提示いただいた「フルネーム（氏名）」または「生年月日」が、口座登録情報と一致していない可能性があります。

    2. 書類提出の不足：犯罪収益移転防止法に基づき必要な本人確認書類の不備、または未提出がある場合、手続きが止まります。

    3. システムの一時的な遅延：ネットワーク負荷により処理に時間がかかっている場合があります。


    【解決策】

    ・まず、ご登録内容に変更がないか、最新の本人確認書類をご準備の上、改めて内容を確認してください。


    【エスカレーションについて】

    上記を確認しても状況が変わらない場合、または不備の内容が不明な場合は、担当者が速やかに支店責任者または専門部署へ案件をエスカレーションし、個別に確認を行います。解決までには数営業日かかる場合がございますので、あらかじめご了承ください。'
  domain: cards
  product_category: asanagi_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
