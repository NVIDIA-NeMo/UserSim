- id: 20b50539-a20d-5cd5-a7b0-e96400dd0fc2
  title: 朝凪Visaデビット：ご利用開始までの手順
  body: '【エージェント用：ご利用開始フロー】


    お客様が「朝凪Visaデビット」の利用を開始されるまでの手順と、案内すべき重要事項についてまとめました。お客様の状況に合わせて、以下のステップで案内してください。


    ■1. お申し込みの受付

    お客様からのお申し込みを承ります。本カードは年会費0円であり、日常的な決済に最適であることをお伝えください。また、利用と同時に口座残高から即時引き落とされるため、使いすぎを防げる安心感についても強調してください。


    ■2. 本人確認の実施

    犯罪収益移転防止法に基づき、適切な本人確認を行います。口座開設を伴う場合は、必要書類の提示を案内してください。なお、電話口等での状態変更操作時には、「フルネーム（氏名）」および「生年月日」の2点のみを確認してください。暗証番号等は絶対に求めないでください。


    ■3. カードの発行と配送

    審査完了後、カードを郵送いたします。配送までにお時間をいただく旨を案内してください。


    ■4. 利用開始の設定案内

    カード到着後、利用開始にあたり以下の点をご案内してください。

    ・1日あたりの利用限度額（初期設定）：500,000円であること。

    ・キャッシュバック率：0.2%が適用されること。

    ・海外利用時の事務手数料：3%が加算されること。


    ■5. 利用状況の確認方法

    インターネットバンキング等で、即時に引き落とし金額と残高を確認できることを案内し、利便性を伝えてください。'
