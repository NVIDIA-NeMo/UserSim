- id: 84b701af-d253-5143-8860-248cd8cfced7
  title: 朝凪Visaデビット：重要事項のご説明
  body: '朝凪Visaデビットのご利用にあたり、以下の重要事項をご確認ください。


    【預金保険制度について】

    本カードが紐づく普通預金は、預金保険制度の対象です。当行が破綻した場合、1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護されます。


    【ご利用上の注意】

    ・本カードは、口座残高を超えて利用することはできません。残高不足の場合は決済が拒否されます。

    ・海外利用時には、3%の事務手数料が別途課されます。

    ・インターネット利用時は、セキュリティ向上のため本人認証サービス（EMV 3-Dセキュア）が利用されます。


    【紛失・盗難時の対応】

    カードの紛失や盗難に気づいた際は、直ちに当行へ届け出てカードの利用停止措置を行ってください。偽造・盗難カードによる不正な払戻しについては、預金者保護法に基づき、預金者に故意や重大な過失がない限り、原則として当行が補償いたします。ただし、過失がある場合は補償額が減額されることがあります。


    【個人情報の取り扱い】

    お客様の個人情報は、個人情報保護法および犯罪収益移転防止法に従い、適正に取り扱います。'
  domain: cards
  product_category: asanagi_debit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
