- id: 66b241f4-676a-541e-8a8f-e9c4d36579c3
  title: 普通預金：解約・変更・プランの切替え
  body: '普通預金口座の解約、または登録情報の変更をご希望の場合の手順をご案内いたします。


    【お手続き前にご準備いただくもの】

    ・ご本人様確認書類（運転免許証、マイナンバーカード等）

    ・キャッシュカードおよび通帳


    【解約・変更の手順】

    1. 本人確認を行います。ご本人様から「フルネーム（氏名）」および「生年月日」をお伺いし、照合いたします。

    2. 手続き内容を承ります。「口座の解約」か「登録内容（住所・氏名等）の変更」か、または他のプランへの切り替えをご希望かをお伝えください。

    3. 解約の場合、口座残高および未払利息の精算方法を確認します。残高を現金で受け取るか、他口座へ振り替えるかをご指定ください。

    4. 当行にて手続きを完了し、完了した旨をご案内いたします。解約の場合は、通帳およびキャッシュカードを回収させていただきます。


    【ご注意点】

    ・口座情報の変更を伴う操作の前には、必ず上記のご本人確認を実施させていただきます。

    ・暗証番号やパスワード、カード番号などを伺うことはございませんのでご注意ください。


    登録情報の変更について詳しく知りたい方は、「普通預金：登録内容の変更」をご参照ください。'
