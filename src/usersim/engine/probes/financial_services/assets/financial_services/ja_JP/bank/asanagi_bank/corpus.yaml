  institution_id: asanagi_bank
- id: 34f27076-2f91-528d-be07-24499628e628
  title: 法令・制度に関するご案内：預金・日常のお取引
  body: '当行は、銀行法に基づき金融庁の監督を受けております。お客様に安心してお取引いただくため、以下の法令および制度を遵守しています。


    ■預金保険制度について

    預金保険制度により、利息のつく普通預金やスーパー定期などの預金は、1金融機関につき預金者1人当たり元本1,000万円までと、破綻日までの利息等が保護されます。また、無利息、要求払い、決済サービス提供という3つの条件を満たす「決済用預金」は、全額が保護されます。なお、外貨預金は預金保険の対象外となりますので、あらかじめご了承ください。


    ■不正利用への対応

    偽造または盗難キャッシュカードによる不正な払戻しについては、預金者保護法に基づき、お客様に故意や重大な過失がない限り、原則として当行が補償いたします。ただし、お客様に過失がある場合は、補償額が減額されることがあります。


    ■コンプライアンスと個人情報保護

    口座開設などの際、犯罪収益移転防止法に基づき、取引時確認（本人確認）を実施しております。また、お預かりした個人情報は、個人情報保護法に従って適切に取り扱います。


    ■苦情・紛争の解決

    当行での解決が困難な苦情や紛争については、全国銀行協会相談室でも受け付けております。透明性のあるプロセスで迅速な解決に努めます。'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 11938198-8965-5f60-898d-fdf21cfb608d
  title: 法令・制度に関するご案内：デビットカード
  body: '朝凪Visaデビットのご利用にあたっては、以下の法令および規定が適用されます。


    ■デビットカードの仕組みと制限

    デビットカードは、利用と同時に連携する普通預金口座から代金が即時引き落とされる仕組みです。そのため、口座残高を超えて利用することはできません。


    ■セキュリティと本人認証

    インターネット上での安全なショッピングのため、本人認証サービス（EMV 3-Dセキュア）を導入しております。これにより、不正利用のリスクを低減し、安全な決済環境を提供しています。


    ■紛失・盗難時の対応と補償

    カードの紛失や盗難に気づかれた際は、ただちに当行へ届け出て、カードの利用を停止してください。不正利用による被害については、当行の規定に基づき、届出日からさかのぼった一定期間の利用分が補償の対象となります。


    ■キャッシュカード機能の補償

    キャッシュカードとしての偽造・盗難による不正な払戻しについては、預金者保護法の対象となります。


    エージェントは、お客様に対し手数料、利用限度額、および補償条件について誤った情報を伝えてはなりません。'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: a0dcf0ab-5a9d-5262-b3b2-a904a1347132
  title: 法令・制度に関するご案内：ローン
  body: '当行の住宅ローンおよび朝凪カードローンは、銀行法に基づき金融庁の監督を受けております。


    ■借入制限と審査について

    銀行の住宅ローンやカードローンは、貸金業法による「総量規制」（原則として年収の3分の1までという借入制限）の対象外です。ただし、当行ではお客様の返済能力を適切に審査した上で、個別の利用限度額を決定しております。


    ■利息制限法による上限金利

    貸付けに適用される上限金利は、利息制限法により以下の通り定められています。

    ・元本10万円未満：年20%

    ・元本10万円以上100万円未満：年18%

    ・元本100万円以上：年15%

    なお、貸金業者による遅延損害金の上限は年20%となります。


    ■信用情報の登録

    借入れの状況は、指定信用情報機関に登録されます。


    ■住宅ローン控除について

    2030年末までに入居した場合、年末のローン残高の0.7%が所得税などから控除される制度があります。住宅の省エネ性能等により、借入限度額と控除期間が異なります。


    エージェントは、審査前の融資承認を約束することや、総返済額を不当に小さく見せる表現を禁止します。返済が困難なお客様には、早めの相談と返済条件の見直しを案内してください。'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 0b5cb1f2-ac13-5e6d-82a1-b1da7cbc9c90
  title: get_account_transactions を使う場面
  body: 'お客様から口座の入出金明細や取引履歴の照会を求められた際に、このツールを使用します。


    【手続きの流れ】

    1. 本人確認の実施：`verify_identity` を呼び出し、お客様から提示されたフルネーム（氏名）と生年月日を用いて本人確認を完了させます。

    2. 口座の特定：お客様が口座番号の下4桁を提示された場合、`get_accounts` を呼び出して、その下4桁に一致する口座の `account_id`
    を特定します。

    3. 取引履歴の取得：特定した `account_id` を引数として `get_account_transactions` を呼び出し、取引明細を取得します。

    4. 情報の提示：取得した履歴に基づき、日付、金額、内容などの情報を丁寧にお客様へ伝えます。


    注意点：本人確認が完了する前に、口座残高や取引履歴などの個人情報を開示してはいけません。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: asanagi_bank
- id: 52fda76c-de51-5959-8ae1-40bd6476e4b2
  title: get_account_transactions ツールリファレンス
  body: '指定された口座の取引明細（入出金履歴）を取得します。


    【シグネチャ】

    `get_account_transactions(account_id: string)`


    【引数】

    - `account_id`: 照会対象となる口座の識別子。`get_accounts` ツールで取得してください。


    【効果】

    指定された口座の最新の取引履歴を返します。


    【注意】

    本ツールは、`verify_identity` による本人確認が完了した後にのみ実行可能です。エージェントはツールを直接呼び出して情報を取得し、お客様に提示します。'
