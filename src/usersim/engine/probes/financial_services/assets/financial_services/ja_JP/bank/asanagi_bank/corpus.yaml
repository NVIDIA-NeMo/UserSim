- id: 509262a6-978a-579e-bd91-59e3eb73422d
  title: 給与・年金受取特典：限度額・制限と注意事項
  body: '本資料は、サポート担当者が「給与・年金受取特典」の制限事項について案内するための社内資料です。お客様へは丁寧な言葉遣いで、以下の限度額および制限事項を正確に伝えてください。


    【特典の適用条件】

    本特典は、当行の普通預金口座を給与受取口座または年金受取口座として指定し、実際に受取が行われているお客様が対象となります。


    【手数料の無料回数と制限】

    1. 他行あて振込手数料の無料回数（月）：

    月3回まで無料となります。4回目以降の振込については、通常の振込手数料が適用されます。


    2. 時間外ATM手数料の無料回数（月）：

    月5回まで無料となります。6回目以降の時間外利用については、所定の時間外手数料が適用されます。


    【金利上乗せの制限】

    年金受取の方に適用される定期預金金利の上乗せ幅は0.1%です。この上乗せは、対象となる定期預金商品にのみ適用されます。


    【注意事項】

    ・無料回数は毎月1日にリセットされます。月をまたいで繰り越すことはできません。

    ・給与または年金の受取状況に変更があり、受取口座としての条件を満たさなくなった場合、翌月から特典の適用が終了します。


    手数料の詳細については、「給与・年金受取特典：手数料一覧」を参照してください。'
