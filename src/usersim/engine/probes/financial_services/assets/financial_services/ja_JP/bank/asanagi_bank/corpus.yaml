- id: f44e1d68-3764-55be-9871-1f12cb1d2355
  title: 朝凪カードローン：リスクについてのご説明
  body: '「朝凪カードローン」のご利用にあたり、以下のリスクについて十分にご理解ください。


    ■利息負担について

    本商品は借入金額に対して利息が発生します。適用金利は年2%から14.5%であり、借入期間が長くなるほど、または借入金額が増えるほど、支払う利息の総額は増加します。


    ■最低返済額の設定による影響

    毎月の最低返済額は2,000円と低く設定されています。これにより月々の負担は軽減されますが、返済額を最低金額に留めた場合、元金の減少ペースが緩やかになり、結果として完済までの期間が長期化し、利息負担が増大するリスクがあります。余裕がある際は、繰り上げ返済をご検討ください。


    ■過剰借入のリスク

    最大8,000,000円までの利用限度額を設定いただけますが、ご自身の返済能力を超えた借入は、生活の困窮を招く恐れがあります。当行では審査にて適切に限度額を決定しますが、お客様ご自身においても計画的な利用をお願いいたします。


    ■監督体制

    当行は金融庁の監督を受け、銀行法に基づいた厳格なコンプライアンス体制のもとで運営しております。ご不明な点がある場合は、契約前に十分にご確認ください。'
