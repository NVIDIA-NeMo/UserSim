- id: f4c43d89-1660-5a80-bd53-e8df70f8841c
  title: スーパー定期：お申込みとご利用開始
  body: 'スーパー定期のお申し込み手順をご案内いたします。本手続きは、当行の普通預金口座をお持ちのお客さまがご利用いただけます。


    【お手続きの流れ】

    1. 本人確認：お客さまの「フルネーム（氏名）」と「生年月日」をお伺いし、ご本人様であることを確認いたします。

    2. 預入条件の決定：ご希望の預入期間（1年、3年、または5年）と、預入金額をご提示ください。なお、最低預入金額は1,000円からとなっております。

    3. 資金の確認：普通預金口座に、預入金額以上の残高があることを確認いたします。

    4. 設定の完了：預入期間、適用金利、満期日を当行より提示し、お客さまの同意をいただいた後、普通預金から定期預金口座へ資金を振り替えます。

    5. 確認書の受領：手続き完了後、お取引内容を記載した明細または確認書を発行いたします。


    【ご注意点】

    ・本人確認の際、暗証番号やパスワード、カード番号などは一切お伺いいたしませんのでご注意ください。

    ・お申し込み内容の詳細や各期間の金利については、「スーパー定期：商品概要」にてご確認いただけます。'
  domain: retail_banking
  product_category: super_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 30d77168-d008-5d23-ad25-525962abf4c2
  title: スーパー定期：手数料一覧
  body: 'スーパー定期のご利用に関する手数料および費用についてご案内いたします。


    ・口座開設手数料：無料

    ・預入手数料：無料

    ・満期解約手数料：無料

    ・中途解約手数料：無料（ただし、適用される利率が「中途解約利率」となり、当初の約定金利よりも低くなります）


    【適用される税金】

    ・利息に対する税率：20.315%（所得税および復興特別所得税、地方税）


    本商品は、安全な取引環境の提供を目的としており、預入および満期時の解約に際しての手数料はいただいておりません。'
