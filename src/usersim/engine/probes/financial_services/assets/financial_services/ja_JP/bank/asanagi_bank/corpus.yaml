- id: 6eef4e46-4524-5376-aec5-7a90833f5b0b
  title: 給与・年金受取特典：ご利用開始までの手順
  body: '【担当職員向け：ご利用開始手続きフロー】

    お客様が「給与・年金受取特典」を適用し、メインバンクとしてご利用開始いただくまでの手順は以下の通りです。


    1. 口座開設の確認

    お客様が当行の普通預金口座を所有しているか確認します。未開設の場合は、まず口座開設手続きを案内してください。


    2. 本人確認の実施

    状態変更を伴う操作の前には、必ず「フルネーム（氏名）」および「生年月日」の2点を用いて本人確認を実施してください。


    3. 受取口座指定の案内

    お客様に対し、お勤め先や年金事務所へ、受取口座を朝凪銀行に変更する手続きを行っていただくようご案内します。


    4. 特典適用の確認

    給与または年金の振込実績が確認できた時点で、以下の特典を自動的に適用します。

    ・他行あて振込手数料の無料回数（月）：3回

    ・時間外ATM手数料の無料回数（月）：5回


    5. 追加特典の案内（年金受取の方のみ）

    年金受取の方には、スーパー定期等の定期預金をご利用の際、金利の上乗せ幅 0.1% が適用されることをご説明ください。'
