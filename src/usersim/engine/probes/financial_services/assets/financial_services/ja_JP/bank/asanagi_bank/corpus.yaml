- id: 818f6f8b-1b94-507d-a447-df18490f4c6a
  title: 住宅ローン：商品概要
  body: '朝凪銀行の「住宅ローン」は、お客様のライフプランに合わせて、変動金利と固定金利期間選択型から最適なプランをお選びいただける、住まいの夢を叶えるための融資商品です。


    【商品特長】

    ・柔軟なプラン選択：市場金利に連動する変動金利と、一定期間金利が固定される「固定金利期間選択型10年」をご用意しております。

    ・安心のサポート：団体信用生命保険への加入により、万が一の際にもご家族の住まいを守ることができます。

    ・税制優遇の活用：2030年末までに入居した場合、年末のローン残高の0.7%を所得税などから控除できる住宅ローン控除の制度をご利用いただけます（条件あり）。


    【主な条件・数値】

    ・借入限度額：100,000,000円

    ・最長借入期間（年）：35

    ・融資手数料（借入金額に対する割合）：2.2%

    ・インターネットでの一部繰上返済手数料：0円


    【金利プラン】

    ・変動金利（優遇後）：1.375%

    ・固定金利期間選択型10年の金利（優遇後）：3.7%


    詳細な金利については「住宅ローン：金利・料率一覧」をご参照ください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: f30e66da-358b-58bc-baa4-862d5fd2dbf4
  title: 住宅ローン：変動金利（優遇後）について
  body: '【ご質問】変動金利プランを利用していますが、返済額はどのように決まり、いつ変更されますか？


    【回答】当行の変動金利（優遇後）は1.375%となっております。変動金利をご利用の場合、返済額は5年ごとに見直されます（変動金利の返済額の見直し間隔）。


    また、急激な金利上昇によるご負担を軽減するため、「5年ルール」および「125%ルール」を適用しております。見直し後の返済額は、見直し前の返済額の125%が上限となります（見直し後の返済額の上限）。


    なお、金利上昇に伴い、実際のお支払額が利息額を下回った場合には「未払利息」が生じることがありますので、あらかじめご了承ください。詳細は「住宅ローン：重要事項のご説明」をご確認ください。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: a06953fd-4185-5481-ac1c-77da4504427d
  title: 住宅ローン：お申込みとご利用開始
  body: '住宅ローンのお申込みから融資実行までの手順をご案内いたします。


    1. 借入のご相談とプラン決定

    お客様のご希望の借入金額（最大100,000,000円まで）と借入期間（最長35年まで）、および金利プラン（変動金利または固定金利期間選択型10年）についてお知らせください。


    2. 本人確認と書類のご提出

    ご本人確認のため、「フルネーム（氏名）」および「生年月日」をお伺いします。その後、収入証明書や物件資料などの必要書類をご提示ください。


    3. 審査および融資額の決定

    当行にて、お客様の返済能力を適切に審査し、最終的な利用限度額を決定いたします。


    4. ご契約と融資実行

    審査承認後、 loan契約を締結します。この際、融資手数料として借入金額の2.2%を申し受けます。手続き完了後、指定の口座へ融資が実行されます。


    手続きがスムーズに完了した際は、担当者より確定した返済計画書をお渡しいたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
