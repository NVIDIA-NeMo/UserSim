- id: c102ac0b-5b74-5153-bedd-11b9ce5fa851
  title: 普通預金：お手続きが完了しない・保留中のまま
  body: '口座開設のお手続き中に、ステータスが「保留中」のまま完了しない、あるいは手続きが途中で止まってしまった場合の対応方法です。


    【考えられる原因】

    ・ご提示いただいた本人確認書類の内容と、お伺いした情報（氏名・生年月日）に不一致がある。

    ・提出書類に不備（有効期限切れ、画像不鮮明など）がある。

    ・犯罪収益移転防止法に基づく確認事項への回答が不足している。


    【確認と解決の手順】

    1. 情報の再確認：お伝えいただいた「フルネーム（氏名）」および「生年月日」に誤りがないか、改めてご確認ください。

    2. 書類の再提出：不備がある場合は、有効な最新の証明書を改めてご提示ください。


    【解決しない場合のエスカレーション】

    上記を確認しても手続きが進まない場合は、担当者から支店責任者または専門部署へ速やかにエスカレーションし、審査状況の詳細を確認いたします。確認完了後、改めてお客様へ結果をご案内いたします。'
