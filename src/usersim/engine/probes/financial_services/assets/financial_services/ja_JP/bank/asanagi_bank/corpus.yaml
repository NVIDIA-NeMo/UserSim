  mentions_tools: []
  institution_id: asanagi_bank
- id: 782eb980-7385-5f53-ba82-16ad37b6de68
  title: 給与・年金受取特典：金利・料率一覧
  body: '「給与・年金受取特典」による金利優遇の内容は以下の通りです。


    ■ 年金受取特典金利

    ・年金受取の方の定期預金金利上乗せ幅：0.1%


    【適用について】

    この 0.1% という数値は、お客様が「スーパー定期」などの対象商品をご契約いただいた際の、基本金利に加算される上乗せ金利です。


    （例）基本金利が 0.2% の商品をご契約の場合、本特典適用により 0.3%（0.2% + 0.1%）の金利が適用されます。


    ※適用期間は、年金受取口座として当行をご利用いただいている期間に限ります。受取口座を変更された場合は、上乗せ金利の適用は終了いたします。詳細は「スーパー定期：商品概要」もあわせてご覧ください。'
