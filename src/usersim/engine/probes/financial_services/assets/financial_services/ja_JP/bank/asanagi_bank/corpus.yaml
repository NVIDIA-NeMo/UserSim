- id: af35b404-7007-5291-af9f-de514b492add
  title: 普通預金：当社の似た商品との比較
  body: '当行で提供している「普通預金」と「スーパー定期」の比較です。用途に合わせて最適な口座をお選びください。


    | 比較項目 | 普通預金 | スーパー定期 |

    | :--- | :--- | :--- |

    | 金利 | 0.4% | 期間に応じた金利（原則として普通預金より高設定） |

    | 流動性 | 非常に高い（いつでも自由に出し入れ可能） | 低い（満期まで預け入れることが前提） |

    | リスク | 極めて低い | 極めて低い（ただし中途解約時は中途解約利率が適用） |

    | 主な目的 | 日常決済、給与・年金受取 | 確実な資産形成 |


    【選び方】

    ・生活費の管理や、急に必要になるお金を保管したい方は「普通預金」が適しています。

    ・一定期間、使う予定のない資金を効率的に増やしたい方は「スーパー定期」が適しています。


    詳細は「スーパー定期：商品概要」をご覧ください。'
