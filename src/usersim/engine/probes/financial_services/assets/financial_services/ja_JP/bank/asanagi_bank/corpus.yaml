- id: 914748ec-81ae-551b-b8e4-8e70e32f83ec
  title: 朝凪カードローン：安全にご利用いただくためのポイント
  body: '「朝凪カードローン」を安全にご利用いただくため、以下のセキュリティポイントを必ずご確認ください。


    ■当行が絶対にお伺いしない情報

    当行が口座情報の照会や変更などの操作を行う際、本人確認としてお願いするのは「フルネーム（氏名）」および「生年月日」の2点のみです。以下の情報は、電話、メール、SMSなどで提示を求めることは一切ございません。

    ・キャッシュカードの暗証番号（PIN）

    ・インターネットバンキングのパスワード

    ・カード番号や身分証番号


    ■不審な連絡への対応

    「限度額が引き上げられた」「至急手続きが必要」といった内容のメールやメッセージに記載されたURLを安易にクリックせず、必ず公式サイトからアクセスしてください。万が一、不審な連絡があった場合や、カードを紛失・盗難された場合は、直ちに当行までご連絡ください。迅速に利用停止措置を行い、被害を最小限に抑えます。


    お客様の大切な資産と個人情報を守るため、ご協力をお願い申し上げます。'
