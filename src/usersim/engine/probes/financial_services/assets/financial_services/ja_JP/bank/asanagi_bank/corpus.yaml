- id: 3d10f08d-9e65-50ca-9ebb-bb246810ebd2
  title: 朝凪Visaデビット：この商品をかたる詐欺にご注意ください
  body: '当行の「朝凪Visaデビット」をかたる、不審なメールやSMS（ショートメッセージ）によるフィッシング詐欺にご注意ください。


    【想定される詐欺の手口】

    「カードの利用制限がかかりました」「不正利用の可能性があるため、至急確認が必要です」といった不安を煽る文面で、偽のウェブサイトへ誘導し、個人情報の入力を求めるケースがございます。


    【当行が絶対にお伺いしないこと】

    朝凪銀行では、どのような理由があっても、電話やメール、SMSを通じて以下の情報を求めることはございません。

    ・暗証番号（PIN）

    ・パスワード

    ・カード番号の全桁

    ・身分証番号


    【当行の本人確認について】

    口座情報の照会や変更など、状態変更を伴う操作の前に、当行では必ず本人確認を実施いたします。確認事項は「フルネーム（氏名）」および「生年月日」の2点のみです。これ以外の機密情報を求めることはございませんので、十分にご注意ください。


    【不審な点を感じたときは】

    もし不審な連絡を受けたり、誤って情報を入力してしまった場合は、直ちにご連絡ください。迅速にカードの利用停止措置を行い、被害の拡大を防ぎます。不正利用による被害については、当行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となります。'
