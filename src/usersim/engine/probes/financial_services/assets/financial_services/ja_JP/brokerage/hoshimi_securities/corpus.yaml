- id: ae03b434-7bca-5d15-9a03-a1de4f2452dc
  title: place_trade を使う場面
  body: 'お客様から株式や投資信託などの売買注文の依頼を受けた際に、取引を執行するために place_trade を使用します。


    【手続き手順】

    1. 本人確認の実施

    verify_identity を呼び出し、お客様の「フルネーム」と「生年月日」を確認して本人確認を完了させてください。


    2. アカウントIDの特定

    get_accounts を使用して、取引に使用する口座の account_id を特定します。


    3. 適合性の確認

    注文を受ける前に、当該商品がお客様の知識、経験、目的に照らして適切であるかを確認してください。不適切な勧誘は「適合性の原則」により禁止されています。


    4. 取引の執行

    必要事項（銘柄、数量、売買区分など）を確認し、place_trade を呼び出して注文を確定させます。


    5. 完了報告

    注文が正常に受理されたことをお客様に伝え、約定までの流れを案内してください。'
