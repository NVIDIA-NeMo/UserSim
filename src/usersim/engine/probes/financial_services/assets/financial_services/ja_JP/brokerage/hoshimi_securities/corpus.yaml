- id: d2e874b5-6a9f-5cc3-ba88-5042eac66f92
  title: 米国株式の取引：重要事項のご説明
  body: '「米国株式の取引」をご利用いただく前に、以下の重要事項を必ずご確認ください。


    【リスク告知】

    本商品は元本が保証されておりません。相場変動により、投資金額を割り込む可能性があります。また、外貨建て資産であるため、為替相場の変動により、円貨換算時の資産価値が減少するリスクがあります。


    【適合性の原則】

    当社は金融商品取引法に基づき、お客様の知識、経験、財産の状況および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しております。推奨商品の提示にあたっては、適切性の確認を必ず行います。


    【資産の管理と補償】

    顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外となります。


    【免責事項】

    当社は一般的な投資教育および商品情報の提供を行いますが、個別の税務相談、法的助言、および将来の利益の保証は一切行いません。上場株式等の譲渡益と配当には20.315%の税金がかかります（NISA口座を除く）。'
