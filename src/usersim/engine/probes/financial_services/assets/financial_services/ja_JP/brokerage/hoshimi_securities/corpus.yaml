- id: e6b5ad9d-2f28-54aa-817b-22bddab747e2
  title: 特定口座（源泉徴収あり）：お取引が拒否された・制限された
  body: '特定口座（源泉徴収あり）でのお取引時に、注文が拒否されたり制限がかかったりする場合の対処法です。


    【よくある症状】

    ・注文ボタンを押した際に「取引制限がかかっています」というメッセージが表示される。

    ・十分な資金があるはずなのに、買付注文が拒否される。


    【考えられる原因と確認事項】

    1. 資金不足：国内株式の売買手数料は0円ですが、株価本体の代金および、米国株式等の場合は為替手数料などの必要資金が不足していないかご確認ください。

    2. 本人確認の未完了：口座開設後、マイナンバーの届出などの重要手続きが完了していない場合、取引が制限されます。

    3. 適合性の確認：お客様の投資目的や経験に照らして、特定の商品が不適当と判断された場合、適合性の原則に基づき取引が制限されることがあります。


    【解決策とエスカレーション】

    ・不足資金がある場合は、追加で入金を行ってください。

    ・本人確認書類の不備がある場合は、正しく再提出してください。


    上記を確認しても解決せず、不当に制限されていると感じられる場合は、当社にて詳細を調査いたします。社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、制限解除の可否を判断した上で、結果を改めてお客様へ通知いたします。'
