    この料率は、クレジットカードを用いて投資信託の積立買い付けを行った際に適用されるポイント還元率です。


    【適用条件】

    ・星見証券が指定する提携クレジットカードを決済手段として登録していること。

    ・積立買い付けが正常に完了し、カード会社による決済が確定していること。


    【留意事項】

    ・還元ポイントの付与タイミングおよび詳細は、ご利用のクレジットカード会社の規定に従います。

    ・本還元率は一律で適用され、積立金額の多寡による変動はありません。'
