- id: 72fb93fd-8d27-5d57-af4c-fd37fa80b14b
  title: 特定口座（源泉徴収あり）：規定・約款の変更
  body: '本規定は、星見証券が提供する特定口座（源泉徴収あり）の利用条件および、法令に基づく約款の変更手続きについて定めたものです。


    【税率の適用と義務】

    上場株式等の譲渡益および配当には、20.315%の税率が適用されます。本口座では、当社がお客様に代わって税金を計算し、源泉徴収を行うため、原則としてお客様による確定申告の手間を省くことができます。


    【損失の繰越控除】

    年度内の損失がある場合、確定申告を行うことで、最大で3年まで損失の繰越控除を受けることが可能です。この期間の適用については、金融商品取引法および税法に基づきます。


    【規定の変更手続き】

    法令の改正や、日本証券業協会の指針変更に伴い、約款の内容を変更することがあります。変更がある場合は、あらかじめデジタルチャネルにて告知いたします。告知後、一定期間内に異議申し立てがない場合は、変更に同意したものとみなされます。


    【契約の終了】

    口座の解約または当社による口座凍結などの事由により、本契約は終了します。終了時の精算および税金の処理は、法令に従い適切に実施されます。'
