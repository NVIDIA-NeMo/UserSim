- id: 31558db1-0d48-5b05-9616-c9489201abd9
  title: よくあるご質問
  body: '■サポートの利用時間について

    ヘルプデスクは日本標準時（JST）の営業時間内に運営しております。デジタルチャネルを通じてお問い合わせください。


    ■本人確認の手続きについて

    口座情報の変更などの重要なお手続きの前には、必ず本人確認を実施いたします。お客様の「フルネーム」と「生年月日」の照合により確認を行います。


    ■苦情や紛争の解決について

    弊社では誠実かつ迅速に調査を行い、透明性のあるプロセスを提示いたします。解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）へご案内いたします。'
