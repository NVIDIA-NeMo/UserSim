- id: b1d0e982-82da-5c7f-9cfb-06d5c9c2d5cf
  title: 特定口座（源泉徴収あり）：よくあるお手続きの流れ
  body: '特定口座（源泉徴収あり）を開設し、取引を開始するまでの標準的な流れをご案内します。


    【お手続きの流れ】

    1. 口座開設の申し込み：当社へ特定口座（源泉徴収あり）の開設を希望する旨を伝えます。

    2. 本人確認とマイナンバー届出：お客様の「フルネーム」と「生年月日」による照合を行い、あわせてマイナンバーを確認できる書類をご提示いただきます。

    3. 適合性確認：お客様の投資経験や目的、資産状況に関する質問にお答えいただき、本口座がお客様に適しているかを確認します。

    4. 口座開設完了の通知：審査および書類確認が完了次第、口座開設完了の通知をお送りします。

    5. 資金の入金：国内株式の売買手数料は0円ですが、株価相当額の資金を口座に用意します。

    6. 取引開始：銘柄を選択し、注文を出して運用を開始してください。利益が出た際は、自動的に20.315%の税金が差し引かれます。


    【完了の目安】

    口座番号が発行され、ログイン後の資産状況画面に「特定口座（源泉徴収あり）」と表示されていれば、すべてのお手続きは完了です。'
