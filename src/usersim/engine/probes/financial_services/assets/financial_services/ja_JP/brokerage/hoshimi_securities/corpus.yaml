- id: 50b582d7-5fe1-5880-a9d3-4adaf4867c6d
  title: NISA（つみたて投資枠）：安全にご利用いただくためのポイント
  body: '星見証券では、お客さまの資産と個人情報を守るため、厳格なセキュリティ体制を運用しております。NISA（つみたて投資枠）を安全にご利用いただくために、以下のポイントを必ずご確認ください。


    1. 本人確認の徹底について

    口座情報の変更などの重要な手続きを行う際、当社は必ずお客様の「フルネーム」と「生年月日」の照合による本人確認を実施します。これ以外の認証ステップや、機密情報の要求を行うことはございません。


    2. 決して提供してはいけない情報

    当社から、電話やメール、チャット等でパスワード、PINコード、ワンタイムパスコード、またはクレジットカードのセキュリティコードを伺うことは絶対にございません。このような要求があった場合は、詐欺の可能性が高いため、直ちに応答を停止してください。


    3. 不正利用の疑いがある場合の対応

    身に覚えのない取引通知が届いた場合や、ログインできないなどの異常を感じた場合は、直ちに当社のヘルプデスクへご連絡ください。迅速に調査プロセスを開始し、誠実に対応いたします。


    4. 資産の安全管理

    お客さまの資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外となりますので、あらかじめご了承ください。


    さらに詳しい対策については、「NISA（つみたて投資枠）：不正利用からお客さまを守るために」をご参照ください。'
