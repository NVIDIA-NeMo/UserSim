  title: NISA（つみたて投資枠）：ご利用条件による違い
  body: '【サポートエージェント向け：ご利用条件別限度額マトリクス】

    顧客の年齢および適用開始日に応じた投資枠の制限を以下に示します。案内時に誤りがないよう徹底してください。


    | 条件 | 年間投資枠 | 非課税保有限度額 |

