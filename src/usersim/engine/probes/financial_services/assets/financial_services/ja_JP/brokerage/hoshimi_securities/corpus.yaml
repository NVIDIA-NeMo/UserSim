- id: 44d8172b-5b0f-519b-9003-19383fdc1cb0
  title: change_nisa_provider を使う場面
  body: 'お客様が他の金融機関でNISA口座を保有しており、その管理金融機関を星見証券に変更したいと希望された場合に change_nisa_provider
    を使用します。


    【手続き手順】

    1. 本人確認の実施

    verify_identity を呼び出し、お客様の「フルネーム」と「生年月日」を照合して本人確認を完了させてください。


    2. アカウントIDの特定

    get_accounts を使用し、手続きを行うお客様の account_id を特定します。


    3. 金融機関変更手続きの開始

    change_nisa_provider を呼び出し、他社から弊社への変更手続きを開始します。


    4. 重要事項の案内

    以下の点について必ず説明してください。

    - 金融機関の変更は年単位で可能です。

    - その年に既にNISA口座で買い付けを行っている場合は、変更は翌年分からとなります。


    5. 完了案内

    手続きの受理について案内し、今後の流れを説明してください。'
