- id: 51a2ce97-bd0e-5ffe-999d-38bc6c620164
  title: NISA（つみたて投資枠）：個人情報の取扱い
  body: '星見証券は、金融商品取引法および個人情報保護法に基づき、お客様の個人情報を厳重に管理いたします。本制度（NISA（つみたて投資枠））の提供にあたり、以下の通り個人情報を取り扱います。


    1. 個人情報の収集目的

    口座開設および維持管理のため、氏名、住所、生年月日、マイナンバー等の情報を収集します。特にNISA口座の開設には、法令に基づきマイナンバーの届出が必須となります。


    2. 利用範囲と第三者提供

    収集した情報は、税務署への報告、金融庁および日本証券業協会などの監督官庁への報告、および日本投資者保護基金への加入手続きなど、法令で定められた範囲内でのみ利用し、それ以外の目的で第三者に提供することはありません。


    3. 本人確認の手順

    お客様の情報を安全に管理するため、重要な手続きの前には必ず「フルネーム」と「生年月日」の照合による本人確認を行います。これにより、第三者による不正な情報変更を防止します。


    4. 安全管理措置

    お客様の資産は分別管理され、個人情報は高度に暗号化されたサーバーで保管されます。万一、個人情報の漏洩等の事故が発生した場合は、速やかにお客様へ通知し、透明性のある調査プロセスを提示いたします。


    本制度の利用に関する重要なリスク告知については、「NISA（つみたて投資枠）：重要事項のご説明」を併せてご確認ください。'
