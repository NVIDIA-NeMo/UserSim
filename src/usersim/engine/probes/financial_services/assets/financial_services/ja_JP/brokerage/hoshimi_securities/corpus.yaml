- id: d3920b4b-e4b0-5410-ae1c-623c0ed5f144
  title: 投資信託の積立：必要書類
  body: '「投資信託の積立」を開始するために必要な書類は以下の通りです。


    | 必要書類 | 提出の必要性 | 詳細・条件 |

    | :--- | :--- | :--- |

    | マイナンバーカード（または通知カード＋身分証明書） | 必須 | 証券口座開設時に必須となる届出事項です。 |

    | 本人確認書類 | 必須 | 運転免許証やパスポートなど、有効な公的証明書が必要です。 |

    | クレジットカード | 任意 | クレジットカード積立を利用する場合のみ必要です（月額100,000円まで）。 |

    | 銀行口座情報 | 必須 | 買付代金の引き落としおよび解約金の受取先として必要です。 |'
