- id: fa9c9d9c-baa3-5f4f-8d3a-97c1e5915093
  title: NISA（つみたて投資枠）：ご利用開始までの手順
  body: '【サポートエージェント向け：ご利用開始ガイド】

    お客さまがNISA（つみたて投資枠）の利用を開始するまでの標準的なフローです。各ステップで正確な案内を行い、不備のない手続きを支援してください。


    ステップ1：本人確認の実施

    まず、お客様の「フルネーム」と「生年月日」を確認し、口座保持者本人であることを照合してください。これ以外の機密情報は要求しないでください。


    ステップ2：口座開設とマイナンバーの届出

    NISA口座の開設にはマイナンバーの届出が必須であることをご案内ください。デジタルチャネルを通じて、本人確認書類およびマイナンバーカードの提出を促してください。


    ステップ3：積立設定の案内

    以下の条件に基づき、積立プランの作成をサポートしてください。

    ・積立の最低金額：100円から設定可能です。

    ・年間投資枠：最大1,200,000円まで設定いただけます。


    ステップ4：商品の選択と適合性の確認

    提供する投資信託商品が、お客様の知識、経験、目的に照らして適切であるかを確認してください。利益の保証は行わず、元本保証がないリスクを明確に伝えてください。


    ステップ5：完了確認

    設定完了後、非課税保有限度額（18,000,000円）の枠内で運用が開始されることを案内し、手続きを完了します。


    詳細な商品概要については「NISA（つみたて投資枠）：商品概要」を併せて参照してください。'
