- id: 0ac08a28-718a-58e1-9671-960873afc173
  title: 特定口座（源泉徴収あり）：他社の一般的な商品との比較
  body: '他社の一般的な特定口座（源泉徴収あり）と、星見証券のサービスを比較します。


    | 比較項目 | 星見証券（本商品） | 他社の一般的サービス |

    | :--- | :--- | :--- |

    | 国内株式売買手数料 | 0円 | 段階的な手数料設定がある場合が多い |

    | 税率（譲渡益・配当） | 20.315%（法定） | 20.315%（法定） |

    | 確定申告の手間 | 原則不要 | 原則不要 |

    | 資産管理 | 分別管理・投資者保護基金対応 | 分別管理・投資者保護基金対応 |


    【どちらを選ぶべきか】

    ・星見証券が向いている方：国内株式の取引頻度が高く、コストを最大限に抑えたい方。また、デジタル完結のシンプルな操作性を重視される方に適しています。

    ・他社が向いている方：対面での詳細なコンサルティングや、物理的な店舗でのサポートを必須とされる方。


    なお、完全に非課税で運用したい場合は、「NISA（成長投資枠）：商品概要」などのNISA口座のご検討をおすすめいたします。'
