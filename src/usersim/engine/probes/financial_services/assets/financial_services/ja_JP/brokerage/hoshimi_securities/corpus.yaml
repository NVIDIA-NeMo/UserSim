- id: 649861dd-df3c-56de-a539-b7a8a852d152
  title: 米国株式の取引：手数料と費用
  body: 'Q：米国株式を取引する際にかかる手数料を教えてください。

    A：取引手数料として、約定代金に対する割合で0.495%をいただいております。ただし、1回の取引につき手数料の上限は22米ドルとなっております。


    Q：米ドルの調達や米ドルからの円への換算時に費用はかかりますか？

    A：はい。為替手数料として、1米ドルあたり25銭をいただいております。


    Q：国内株式のように手数料が0円になるプランはありますか？

    A：誠に恐れ入りますが、米国株式などの海外取引については、適正なインフラ維持と規制遵守のためのコストとして上記の手数料を設定しております。国内株式の手数料体系とは異なりますのでご了承ください。'
