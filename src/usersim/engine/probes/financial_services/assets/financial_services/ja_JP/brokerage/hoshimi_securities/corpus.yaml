- id: c65bf4e6-300e-5218-a138-8d891e8116e2
  title: 投資信託の積立：クレジットカード積立の上限（月額）について
  body: 'Q：クレジットカードで積立を行う場合、月々に設定できる上限金額はいくらですか？


    A：クレジットカード積立の上限（月額）は100,000円です。この金額を上限として、積立の最低金額である100円から任意に設定いただけます。


    Q：月間の上限額を変更することはできますか？


    A：申し訳ございませんが、クレジットカード積立の上限（月額）100,000円は制度上の上限であり、個別の変更はできかねます。さらに大きな金額を積み立てたい場合は、証券口座からの振替による積立をご検討ください。詳細は「投資信託の積立：おすすめの方と主な使い方」をご参照ください。'
