- id: a0a6bc7b-d99a-5635-a633-9aaeae9d80f5
  title: 特定口座（源泉徴収あり）：明細や記録と合わない
  body: '特定口座（源泉徴収あり）の明細に記載された税額や残高が、ご自身の計算と合わない場合の確認手順です。


    【よくある症状】

    ・利益が出ているはずなのに、源泉徴収された税金が少ない、または無い。

    ・想定よりも手取り額が多い、あるいは少ない。


    【確認すべきポイント】

    1. 損益通算の有無：同一年度内に他の銘柄で損失が出ていた場合、利益と相殺されるため、課税額が減少します。

    2. 損失の繰越控除：過去3年以内に発生し、確定申告を行っている損失がある場合、今年の利益からその分が差し引かれて計算されます。この繰越控除が適用されていないか、履歴を確認してください。

    3. 税率の適用：上場株式等の譲渡益・配当には一律で20.315%の税率が適用されています。計算式が「利益 × 20.315%」となっているかご確認ください。


    【解決策とエスカレーション】

    ・過去3年分の損失繰越状況を再度照会し、現在の計算結果と突き合わせてください。


    上記を確認してもなお不整合がある場合は、システム上の不備や計算ミスの可能性があるため、速やかに社内の専門の運用責任者へエスカレーションします。詳細な再計算を行い、修正が必要な場合は速やかに訂正明細を提示し、不足分がある場合は精算処理を行います。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: troubleshooting
  source_authority: official
