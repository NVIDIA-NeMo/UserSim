- id: 887a4e90-0375-51d0-a55b-6174b4d6ab07
  title: 特定口座（源泉徴収あり）：状況・履歴の確認
  body: '特定口座（源泉徴収あり）での資産状況や税金の徴収履歴を確認する手順をご案内します。


    【事前準備】

    お手元に口座番号をご用意ください。


    【確認の手順】

    1. 本人確認：お客様の「フルネーム」と「生年月日」をお伝えいただき、照合を行います。

    2. 確認内容の指定：確認したい期間（例：2024年1月〜12月）と、確認したい項目（保有資産残高、または源泉徴収された税額の履歴）を当社へ伝えます。

    3. 情報の提示：当社より、指定期間内の取引履歴および、適用された20.315%の税金計算結果を含む明細を提示いたします。

    4. 内容の確認：提示された明細と、ご自身の記録に相違がないかをご確認ください。


    【完了の目安】

    当社から提示された明細に、最新の約定代金と正確な源泉徴収額が記載されていれば、状況確認は完了です。もし計算内容に不明点がある場合は、その場で詳細を解説いたします。'
