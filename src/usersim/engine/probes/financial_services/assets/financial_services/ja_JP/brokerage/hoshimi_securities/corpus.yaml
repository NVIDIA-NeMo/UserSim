- id: 58d003c6-829b-575b-81e2-dec92fd3765b
  title: 特定口座（源泉徴収あり）：安全にご利用いただくためのポイント
  body: 'お客様のの大切な資産と個人情報を守るため、特定口座（源泉徴収あり）をご利用の際は以下のセキュリティポイントを必ずご確認ください。


    【ご本人確認について】

    星見証券では、口座情報の変更などの重要な手続きを行う際、必ずご本人確認を実施します。当社の確認ステップは、お客様の「フルネーム」と「生年月日」の照合のみで行われます。


    【重要：当社がお伺いしない情報】

    以下の情報を要求することは絶対にございません。万が一、要求された場合は詐欺の可能性がありますので、直ちにご連絡ください。

    ・暗証番号やログインパスワード

    ・ワンタイムパスワードや認証コード

    ・クレジットカードのセキュリティコード


    【不審な点がある場合】

    心当たりのない取引通知が届いた場合や、不審なメールを受け取った場合は、速やかにヘルプデスクまでお知らせください。誠実かつ迅速に調査プロセスを提示し、対応いたします。


    また、個人情報の管理体制については「特定口座（源泉徴収あり）：個人情報の取扱い」をご参照ください。'
