  body: 'iDeCo（個人型確定拠出年金）におけるコスト（料率）についてご案内します。


    【運営管理手数料】

    ・運営管理機関手数料（星見証券）：0円

    星見証券では、口座維持にかかる運営管理手数料を完全に無料としております。これにより、お客様の積立金が効率的に運用に回る体制を整えています。


    【制度維持費用】

    以下の費用は、制度を運営する国民年金基金連合会へ支払われるものです。

    ・加入時の手数料：2,829円

    ・毎月の手数料（2026年12月分から）：186円


