- id: a19b5fbe-b241-59b5-81b6-e8a8207bd1ff
  title: apply_ideco を使う場面
  body: 'お客様がiDeCo（個人型確定拠出年金）への新規加入、または企業型確定拠出年金などからの資産移換を希望される場合に、本ツールを使用します。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合して本人確認を行います。

    2. `get_accounts` を使用し、既存の総合口座がある場合は `account_id` を特定します。

    3. 加入希望のプランや移換の有無など、必要事項をヒアリングします。

    4. `apply_ideco` を呼び出し、加入または移換の申し込み手続きを開始します。


    iDeCoは原則として60歳まで資産を引き出すことができない制度であるため、この点について明確に告知してください。詳細については、「iDeCo（個人型確定拠出年金）：お申込みとご利用開始」をご参照ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_ideco
  institution_id: hoshimi_securities
- id: 7845e882-1768-5647-94ba-1a572815020b
  title: apply_ideco ツールリファレンス
  body: 'このツールは、iDeCo（個人型確定拠出年金）への加入申し込み、または他制度からの資産移換手続きを行うために使用します。


    【機能】

    iDeCoへの新規加入、または企業型確定拠出年金などから星見証券への資産移換を申し込みます。


    【引数】

    - `full_name`: お客様のフルネーム

    - `date_of_birth`: お客様の生年月日

    - `application_type`: 「新規加入」または「資産移換」などの申請区分

    - `contact_info`: 連絡先情報


    エージェントは `verify_identity` で本人確認を行った後、本ツールを直接呼び出して手続きを完了させます。'
