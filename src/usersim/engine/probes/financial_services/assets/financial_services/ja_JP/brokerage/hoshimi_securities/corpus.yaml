  institution_id: hoshimi_securities
- id: be2305ce-ebaf-5343-8d8f-f33917c96d7a
  title: NISA（成長投資枠）：ほかの選択肢との比較と向かない場合
  body: 'NISA（成長投資枠）を検討される際、他の口座との違いを理解することが重要です。


    【特定口座（源泉徴収あり）との比較】

    ・税制面：特定口座では上場株式等の譲渡益と配当に20.315%の税金がかかりますが、NISA（成長投資枠）では利益が非課税となります。

    ・利便性：特定口座は税金計算を自動的に行い、原則として確定申告が不要です。NISA（成長投資枠）も同様に非課税のため、税務上の手間は省けます。

    ・制限：特定口座に投資限度額はありませんが、NISA（成長投資枠）は年間投資枠2,400,000円、非課税保有限度額12,000,000円という制限があります。


    【NISA（成長投資枠）が向かない場合】

    ・短期間に12,000,000円を大幅に超える多額の資金を運用したい場合：非課税枠を超えた分は特定口座での運用となるため、最初から特定口座を主軸にする方が管理が簡便な場合があります。

    ・極めて保守的な運用を希望し、個別の株式や成長投資向け商品にリスクを感じる場合：より制限の厳しい「つみたて投資枠」のみでの運用が適している可能性があります。


    当社の国内株式売買手数料は0円であり、コスト面でのハードルは最小限に抑えられています。お客さまの資産状況と投資目的に照らし、最善の選択を支援いたします。'
