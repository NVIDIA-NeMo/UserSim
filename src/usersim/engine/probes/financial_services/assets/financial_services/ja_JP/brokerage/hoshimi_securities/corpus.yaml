- id: 1636c7f5-ec41-54f6-b5ce-fa5926c92f91
  title: NISA（成長投資枠）：商品概要
  body: '星見証券のNISA（成長投資枠）は、株式や投資信託など幅広い商品に柔軟に投資でき、運用益と配当金が非課税となる便利な制度です。資産形成の民主化を目指す当社は、投資へのハードルを下げるため、国内株式などの主要商品の売買手数料を0円として提供しております。


    【本制度の主要ポイント】

    ■ 年間投資枠：2,400,000円

    （1年間に投資できる最大金額です）

    ■ 非課税保有限度額：12,000,000円

    （非課税で保有し続けられる資産の最大合計額です）

    ■ 国内株式の売買手数料：0円


    本制度を利用することで、本来であれば約20.315%かかる上場株式等の譲渡益および配当への税金が免除されます。つみたて投資枠と併用することで、より戦略的な資産運用が可能です。詳細な比較については「NISA（成長投資枠）：当社の似た商品との比較」をご参照ください。


    ※相場変動により元本を割り込むリスクがあり、損失は補償されません。投資判断は、お客様の知識、経験、目的に照らして適切に行っていただけますようお願い申し上げます。'
