- id: 11c49d0c-0bdc-535a-8ce9-550c8b0e9de9
  title: iDeCo（個人型確定拠出年金）：ログインできない・アクセスできない
  body: 'iDeCo（個人型確定拠出年金）の資産状況確認や設定変更のためにログインしようとした際、アクセスできない場合の対処法です。


    ■考えられる原因と確認事項

    ・IDまたはパスワードの入力誤り：大文字・小文字の区別や、不要なスペースが入っていないかご確認ください。

    ・アカウントのロック：短時間に複数回認証に失敗した場合、セキュリティ保護のため一時的にロックがかかることがあります。

    ・通信環境の不安定：ネットワーク接続が正常であるか、他のサイトへのアクセスを確認してください。


    ■解決方法

    上記を確認しても解決しない場合は、当社にて状況を確認いたします。お客様の「フルネーム」と「生年月日」をご提示ください。その後、認証情報の再設定やロックの解除をサポートさせていただきます。


    ■エスカレーションについて

    システム上の不具合が疑われる場合や、認証情報の再発行に時間を要する複雑な案件については、社内の専門の運用責任者へエスカレーションし、調査を行います。調査結果および復旧の目途については、改めて担当者よりご連絡いたします。'
