- id: e7dceb5f-26aa-52c1-ac37-459c95f3fa05
  title: iDeCo（個人型確定拠出年金）：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、保留状態となっている場合に考えられる原因と対処法をご案内します。


    【よくある症状】

    「手続き中」の表示が長く続いている、または書類の不備について通知が届いた。


    【考えられる原因】

    1. マイナンバーの不備：提示された書類の画像が不鮮明であるか、記載内容に誤りがある。

    2. 適合性確認の未完了：投資目的や経験などの確認事項への回答が不足している。

    3. 拠出額の設定誤り：月額5,000円未満、または上限額（会社員：62,000円、自営業者：75,000円 ※2026年12月分から）を超えた金額が設定されている。


    【対処方法】

    ・弊社スタッフに現在の状況を確認してください。不足している情報や書類がある場合は、その場で再提示をさせていただきます。


    【エスカレーション】

    書類に不備がないにもかかわらず保留が続く場合は、社内のコンプライアンス担当または運用責任者が審査状況を再確認し、結果をご案内します。'
