- id: fe58bd07-dc48-5fd3-8db1-c1e68a40f407
  title: iDeCo（個人型確定拠出年金）：切替えや上位プランを検討するとき
  body: 'サポート担当者は、お客様がiDeCo（個人型確定拠出年金）から他の資産形成手段への切替えや、併用を検討されている場合に、以下の比較軸を用いてご案内してください。


    【iDeCoとNISAの比較】

    - 税制メリット：iDeCoは掛金が全額所得控除となるため、所得税・住民税の軽減効果が非常に高いのが特徴です。対してNISAは運用益が非課税となる制度です。

    - 資金の流動性：iDeCoは原則60歳まで引き出し不可という強い拘束力があります。一方、NISA（つみたて投資枠・成長投資枠）は柔軟に売却・出金が可能です。

    - 限度額：iDeCoは月額の上限（2026年12月分から会社員62,000円、自営業者75,000円）が設定されています。


    【どちらが適しているか】

    - iDeCoが適している方：所得税の節税を重視し、老後資金として60歳まで使わないことが確定している方。

    - NISAが適している方：結婚、住宅購入など、将来的に柔軟に資金を取り出す可能性がある方。


    併用することで、所得控除のメリットを享受しつつ、流動的な資産も確保できるため、多くの顧客にとって最適な戦略となります。'
  domain: brokerage_investing
  product_category: ideco
  document_type: comparison
  source_authority: official
  placeholder: true
