- id: f8aaa6fd-7a62-5142-9c44-3d15c9fcc381
  title: 投資信託の積立：規定・約款
  body: '本規定は、星見証券が提供する「投資信託の積立」サービスにおける利用条件を定めるものです。


    1. 積立金額の制限

    お客様が設定できる積立の最低金額は100円とします。これ以下の金額での積立設定はできません。


    2. クレジットカード決済の制限

    クレジットカードを利用した積立の場合、クレジットカード積立の上限（月額）は100,000円とします。この上限を超える金額の設定は、当社のシステムにより制限されます。


    3. 資産の管理と補償

    お客様から預かった金銭および有価証券は、金融商品取引法に基づき、当社の財産と分けて管理する「分別管理」を徹底いたします。万一、当社の破綻により資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による損失は補償の対象外となります。


    4. サービスの変更および終了

    当社は、規制遵守やインフラ維持のため、本サービスの内容または手数料体系を変更することがあります。変更の内容および適用日は、あらかじめ適切に告知いたします。


    5. 契約の終了

    お客様は、いつでも積立設定の解約を申し出ることができます。また、口座の解約をもって本契約は終了します。'
