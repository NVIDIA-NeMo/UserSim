- id: edb38bd2-c32b-57fa-950c-453d95fae016
  title: NISA（成長投資枠）：安全にご利用いただくためのポイント
  body: '星見証券を安全にご利用いただくために、以下のセキュリティポイントを必ずご確認ください。


    ■ 本人確認について

    当社が口座情報の変更などの重要な手続きを行う際、お客様にご提示いただくのは「フルネーム」と「生年月日」の照合のみです。これ以外の認証ステップや、暗証番号、パスワード、クレジットカード番号などの機密情報を要求することは一切ございません。このような要求があった場合は、詐欺の可能性がありますので十分にご注意ください。


    ■ 避けるべき操作

    ・不審なメールやSMSに記載されたURLからログインし、個人情報を入力すること。

    ・共有のパソコンや公共のWi-Fi環境で、重要な資産操作を行うこと。


    ■ 異常を感じたときの対応

    万が一、身に覚えのない取引通知が届いた場合や、ログインできないなどの不審な点がある場合は、直ちに当社ヘルプデスクまでお知らせください。迅速に調査プロセスを開始し、透明性を持って対応いたします。


    お客様の資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による損失は補償対象外となりますので、あらかじめご了承ください。'
