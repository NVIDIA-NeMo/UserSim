- id: 387e9c5c-ab86-517d-a856-6912e055f25b
  title: NISA（つみたて投資枠）：実施中のキャンペーン
  body: '【資産形成スタート応援キャンペーン】


    星見証券で新しくNISA（つみたて投資枠）での積立を開始されるお客様を対象に、口座開設特典を差し上げます。


    ■キャンペーン期間

    2024年4月1日から2024年6月30日まで


    ■特典内容

    期間中にNISA（つみたて投資枠）を開設し、積立設定（最低金額100円以上）を完了されたお客様に、現金1,000円をプレゼントいたします。


    ■適用条件

    ・期間内にNISA（つみたて投資枠）の口座開設を完了すること

    ・積立設定を行い、初回買い付けが約定すること


    特典は初回買い付け約定後の翌月末までにご指定の口座へ入金されます。詳細は「NISA（つみたて投資枠）：商品概要」をご確認ください。'
