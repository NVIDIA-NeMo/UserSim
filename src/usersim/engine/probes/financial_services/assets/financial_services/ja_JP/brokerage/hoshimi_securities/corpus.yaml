- id: 5f119323-8b8e-577e-8770-a34e6952b238
  title: 米国株式の取引：想定外の手数料・金額
  body: 'お客さまから「取引後の残高が想定より少ない」「手数料が予想と異なる」というお問い合わせをいただいた際の確認手順です。


    【考えられる原因】

    1. 為替手数料の未考慮：米ドルへの換金または日本円への戻し時に、1米ドルあたり25銭の為替手数料が発生しています。

    2. 取引手数料の計算違い：約定代金の0.495%が手数料として差し引かれています。上限の22米ドルに達していないか確認してください。

    3. 現地税の発生：米国株式の配当金などには、現地での課税が行われる場合があります。


    【確認ステップ】

    1. 取引履歴の照会：約定代金を確認し、そこに0.495%の手数料が正しく適用されているか計算します。

    2. 為替履歴の照会：換金時のレートに、1米ドルあたり25銭の手数料が含まれているかを確認します。

    3. 上限適用の確認：手数料が22米ドルを超えていないか照合します。


    【解決しない場合の対応】

    上記を確認しても金額に不整合がある場合は、社内のコンプライアンス担当または専門の運用責任者へエスカレーションします。調査後、誤りがあった場合は誠実かつ迅速に修正し、そのプロセスを透明性をもってお客さまにご提示いたします。'
