- id: fa2e8e3a-439e-541b-9a7f-ce7290be212e
  title: 投資信託の積立：金利・料率の決まり方と適用
  body: '「投資信託の積立」におけるポイント還元率の適用についてご案内します。


    【適用される料率】

    ・クレジットカード積立のポイント還元率：0.5%


    【適用条件】

    この0.5%の還元率は、クレジットカード決済を用いて投資信託の積立を行った金額に対して適用されます。積立の最低金額100円から、クレジットカード積立の上限（月額）100,000円までの範囲で、決済が完了した金額に基づき算出されます。


    【留意事項】

    ・この還元率は決済に対する特典であり、投資信託自体の運用利回りや金利ではありません。

    ・投資信託の運用成果（基準価額の変動）は、市場価格に基づき決定され、上記ポイント還元率とは一切関係ございません。

    ・還元ポイントの付与タイミングおよび詳細は、ご利用のクレジットカード会社の規定に従います。'
