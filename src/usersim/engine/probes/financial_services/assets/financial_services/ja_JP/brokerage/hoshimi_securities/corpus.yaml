- id: 50e0c1ef-4daf-5da0-a0b2-a6eaa1a18c86
  title: 米国株式の取引：リスクについてのご説明
  body: '米国株式の取引を始める前に、以下のリスクについて十分にご理解ください。


    1. 価格変動リスク

    株価は企業の業績や市場環境により変動します。投資元本は保証されておりません。相場変動による損失は、日本投資者保護基金の補償対象外となります。


    2. 為替変動リスク

    米ドル建て資産であるため、株価が変わらなくても、円高・円安の進行により日本円ベースでの資産価値が変動します。また、取引の都度、1米ドルあたり25銭の為替手数料が発生します。


    3. 取引コスト

    売買時に約定代金の0.495%の取引手数料（上限22米ドル）がかかります。短期的な売買を繰り返すと、これらのコストが運用成績に影響を与える可能性があります。


    4. 制度上の補償

    当社は顧客資産の分別管理を徹底しており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、これはあくまで証券会社の破綻に対するものであり、投資損失を補填するものではありません。


    詳細な制度については「法令・制度に関するご案内：株式・投資信託・NISA・iDeCo」をご参照ください。'
