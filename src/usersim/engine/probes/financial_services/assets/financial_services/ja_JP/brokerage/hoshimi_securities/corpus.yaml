- id: d9f52f91-7a51-5b76-9fbe-7adc18b5bf66
  title: 特定口座（源泉徴収あり）：お申込みとご利用開始
  body: '「特定口座（源泉徴収あり）」のお申込みからご利用開始までの手順をご案内します。


    【ご準備いただくもの】

    ・マイナンバーカード（またはマイナンバー確認書類と本人確認書類）


    【お手続きの流れ】

    1. 本人確認：まず、お客様の「フルネーム」と「生年月日」をお伝えください。当社の担当者がご本人様であることの照合を行います。

    2. 口座種別の選択：口座開設のご希望として、「特定口座（源泉徴収あり）」を希望される旨をお伝えください。

    3. マイナンバーの届出：口座開設にはマイナンバーの届出が必須となります。当社の案内に沿って、必要書類のご提示または情報の提供をお願いいたします。

    4. 審査および開設完了：弊社にて内容の審査を行い、開設が完了しましたら、ご利用可能である旨を通知いたします。


    【ご利用の開始】

    開設完了後、国内株式などの売買が可能になります。国内株式の売買手数料は0円ですので、コストを気にせず投資を始めていただけます。なお、国内株式の受渡しは約定日の2営業日後となります。


    他の非課税口座との違いを検討される場合は、「特定口座（源泉徴収あり）：当社の似た商品との比較」をご参照ください。'
