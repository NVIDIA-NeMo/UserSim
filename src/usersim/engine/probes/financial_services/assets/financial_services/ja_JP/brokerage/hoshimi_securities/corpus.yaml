- id: 280a8d36-f6f1-5db7-b978-bcbee999d0b5
  title: 米国株式の取引：切替えや上位プランを検討するとき
  body: '米国株式への直接投資と、投資信託（toshin_tsumitate）による間接投資の検討基準についてご案内します。


    【米国株式の取引（直接投資）】

    - 特徴：世界をリードする米国企業の株式を個別に選択でき、企業の成長を直接享受できます。

    - コスト：約定代金の0.495%（上限22米ドル）の取引手数料と、1米ドルあたり25銭の為替手数料がかかります。

    - 向いている方：特定の企業に注目し、能動的に資産を運用したい方。


    【投資信託の積立（間接投資）】

    - 特徴：複数の銘柄に分散投資されており、少額から自動的に資産形成が可能です。

    - 向いている方：リスクを分散し、手間をかけずに長期的な資産成長を目指したい方。


    直接投資は高いコントロール力を得られますが、個別銘柄のリスクと為替変動リスクを直接的に負うことになります。'
  domain: brokerage_investing
  product_category: beikoku_kabu
  document_type: comparison
  source_authority: official
