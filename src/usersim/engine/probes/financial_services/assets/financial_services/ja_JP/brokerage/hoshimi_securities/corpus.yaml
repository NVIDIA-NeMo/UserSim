- id: 7f056b7e-2fac-59ab-ac9a-0d147891326a
  title: NISA（成長投資枠）：お申込みとご利用条件
  body: 'Q：NISA（成長投資枠）を利用するための条件はありますか？


    A：日本に住む18歳以上の方が、1人1口座まで開設いただけます。また、口座開設にはマイナンバーの届出が必要です。


    Q：すでに他社でNISA口座を持っているのですが、星見証券で成長投資枠を利用できますか？


    A：はい、可能です。NISA口座を開設している金融機関は年単位で変更いただけます。お手続きの流れについては、当社サポートにてご案内いたします。'
