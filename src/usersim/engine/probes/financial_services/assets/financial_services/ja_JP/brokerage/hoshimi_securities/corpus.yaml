  title: 米国株式の取引：金利・料率の決まり方と適用
  body: '米国株式の取引に適用される手数料率および上限額についてご案内します。当社の手数料体系は、すべてのお客さまに一律で適用される透明性の高い構造となっております。


    【取引手数料】

    ・適用料率：0.495%

    ・計算方法：約定代金 × 0.495%

    ・適用上限：22米ドル（1回の取引あたり）

    ※計算の結果、手数料が22米ドルを超える場合は、上限額の22米ドルが適用されます。


    【為替手数料】

    ・適用料率：25銭

    ・計算方法：1米ドルあたりの換金額に25銭を適用


    これらの料率は、取引金額の多寡や顧客ランクによる変動はなく、すべての米国株式取引に一律に適用されます。'
