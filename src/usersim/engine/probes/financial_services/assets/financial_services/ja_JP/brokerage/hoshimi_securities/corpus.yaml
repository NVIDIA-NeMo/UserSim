- id: ea70f15a-91e7-5edc-9a39-9e3842fc3319
  title: NISA（成長投資枠）：必要書類
  body: 'NISA（成長投資枠）の開設および利用にあたり、以下の書類が必要となります。


    | 必要書類 | 提出条件 | 判定/結果 |

    | :--- | :--- | :--- |

    | マイナンバーカード | 全てのお客様 | 口座開設に必須（届出が必要） |

    | 本人確認書類（通知カード等） | マイナンバーカードをお持ちでない方 | 住所確認書類と併せて提出し、本人確認を完了 |

    | 住民票または運転免許証 | 本人確認書類として | 住所および氏名の有効性を確認 |


    ※口座開設後の重要な手続き（変更等）においては、お客様の「フルネーム」と「生年月日」による照合で本人確認を実施いたします。


    具体的な開設ステップについては「NISA（成長投資枠）：お申込みとご利用開始」をご覧ください。'
