  title: iDeCo（個人型確定拠出年金）：必要書類
  body: 'iDeCo口座開設のお申し込みに必要な書類は以下の通りです。お客様のご属性に合わせてご準備ください。


    | 必要書類 | 会社員の方 | 自営業の方 | 公務員の方 | 備考 |

    | :--- | :---: | :---: | :---: | :--- |

    | マイナンバーカード | 必須 | 必須 | 必須 | 番号確認および本人確認として利用 |

    | 本人確認書類（免許証等） | 必要※ | 必要※ | 必要※ | マイナンバーカードがない場合に必要 |

    | 基礎年金番号通知書 | 必要 | 必要 | 必要 | 番号の確認が必要です |

    | 事業所等の証明書 | 必須 | 不要 | 必須 | 勤務先による加入資格の証明が必要です |


    ※マイナンバーカードを提示いただく場合は、別途の本人確認書類は不要です。'
