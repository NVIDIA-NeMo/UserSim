- id: bce22db5-4a36-53d5-97b3-61a696cbc4cd
  title: 投資信託の積立：ログインできない・アクセスできない
  body: '投資信託の積立設定の確認や変更を行おうとした際に、ログインできない、あるいはページにアクセスできない場合の対処法です。


    【考えられる症状と原因】

    ・ログインボタンを押しても反応しない、またはエラーメッセージが表示される（通信環境の問題、またはブラウザのキャッシュ蓄積）。

    ・IDまたはパスワードが正しくないというエラーが出る（入力ミスのほか、長期間の未利用によるロック）。

    ・「メンテナンス中」の画面が表示される（システム更新による一時的な停止）。


    【確認と解決の手順】

    1. 通信環境の確認：Wi-Fiのオン・オフを切り替えるか、別のネットワークでアクセスをお試しください。

    2. ブラウザの更新：キャッシュをクリアするか、別のブラウザでログインできるか確認してください。

    3. パスワードの再入力：大文字・小文字の区別に注意して、正確に再入力してください。


    【解決しない場合の対応】

    上記を確認してもログインできない場合は、当社へご連絡ください。本人確認（フルネームと生年月日の照合）を行った上で、アカウントの状態を確認します。


    【エスカレーション】

    不正アクセスが疑われる場合や、システム的な不具合が判明した場合は、当社にて速やかにコンプライアンス担当または専門の運用責任者へ案件をエスカレーションし、調査と復旧を行います。調査状況については随時お客様へご報告いたします。'
