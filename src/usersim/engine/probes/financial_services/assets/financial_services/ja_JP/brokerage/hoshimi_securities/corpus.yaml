- id: 67c73d9d-4de3-59b8-acf6-057666e14c87
  title: iDeCo（個人型確定拠出年金）：リスクについてのご説明
  body: 'iDeCo（個人型確定拠出年金）のご利用にあたり、以下の重要なリスクと制限事項をご理解ください。


    【元本保証について】

    iDeCoで運用する投資信託などの商品は、預金ではありません。相場変動により、運用成果によっては元本を割り込む（損失が出る）可能性があります。当社は運用利益を保証いたしません。また、相場変動による損失は日本投資者保護基金の補償対象外となります。


    【資産の拘束期間について】

    本制度は老後資金の形成を目的としているため、原則として60歳まで資産を引き出すことができません。急な資金需要がある場合でも、中途解約は原則不可となりますので、十分にご注意ください。


    【適合性の原則】

    当社は、お客様の知識、経験、財産の状況、および投資目的に照らして適切な商品提示に努めますが、最終的な運用判断はお客様ご自身で行っていただきます。


    【資産の保護】

    お客様の資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【助言の範囲】

    一般的な投資教育および商品情報の提供は行いますが、個別の税務相談や法的助言は行いません。具体的な税額計算等については、管轄の税務署または税理士にご相談ください。'
