- id: 2716b8fc-9720-5e39-bbe8-680486b177c8
  title: NISA（つみたて投資枠）：規定・約款の変更
  body: '本規定は、星見証券が提供するNISA（つみたて投資枠）の利用条件および約款の変更手続きについて定めたものです。


    1. 約款変更の告知

    当社は、法令の改正、監督官庁（金融庁および日本証券業協会）からの要請、またはサービス運営上の必要が生じた場合、本規定および利用約款を変更することがあります。変更内容は、事前にデジタルチャネルを通じてお客さまに通知いたします。


    2. 投資枠の適用と制限

    本制度における年間投資枠（1,200,000円）および非課税保有限度額（18,000,000円）の適用ルールは、税制改正に伴い変更される場合があります。変更後の限度額および適用開始日は、通知される日付をもって確定します。


    3. 適合性の原則の遵守

    約款の変更にかかわらず、当社は常に「適合性の原則」を徹底します。お客さまの知識、経験、財産の状況、投資目的に照らして不適当な勧誘は行わず、最善の利益を追求します。


    4. 同意と承諾

    通知後、所定の期間内にお手続きまたは異議申し立てがない場合、お客さまは変更後の約款に同意したものとみなされます。変更内容に同意いただけない場合は、口座の解約または他社への金融機関変更をご検討ください。手続きの詳細は「NISA（つみたて投資枠）：解約・変更・プランの切替え」にてご確認いただけます。'
