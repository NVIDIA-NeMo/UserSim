- id: a610afd1-bec9-5920-97d5-c6dd7c754f62
  title: 特定口座（源泉徴収あり）：国内株式の売買手数料について
  body: 'Q：特定口座（源泉徴収あり）で国内株式を取引する場合、手数料はかかりますか？


    A：いいえ、国内株式の売買手数料は0円です。投資への心理的・経済的ハードルを最小限に抑え、お客様が無理なく資産形成を行えるよう支援しております。


    Q：海外株式の取引でも同様に0円になりますか？


    A：いいえ、海外取引の手数料は、適正なインフラ維持と規制遵守のためのコストとして別途設定しております。詳細な手数料体系については、別途手数料一覧をご確認ください。'
