- id: f402d8bf-31c3-5358-86c5-32c19d17b811
  title: iDeCo（個人型確定拠出年金）：自営業者の掛金の上限（月額、2026年12月分から）について
  body: 'Q：自営業者の場合、月々いくらまでiDeCoに拠出できますか？


    A：2026年12月分の掛金から、自営業者（第1号被保険者）の方の拠出上限額は月額 75,000円となります。なお、この金額は国民年金基金の掛金などと合算した上限となりますのでご注意ください。


    Q：上限額の変更手続きは必要ですか？


    A：現在の拠出額を上限まで引き上げたい場合は、改めて拠出金額の変更手続きが必要です。詳細な手順は『iDeCo（個人型確定拠出年金）：登録内容の変更』をご参照ください。'
