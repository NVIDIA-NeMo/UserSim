- id: 739279d6-a767-549f-acbf-b2f3a5c8b888
  title: 投資信託の積立：ご利用開始までの手順
  body: '【エージェント向け：ご利用開始サポート手順】

    お客様が投資信託の積立をスムーズに開始できるよう、以下のステップで案内してください。


    ステップ1：本人確認の実施

    まずはお客様の「フルネーム」と「生年月日」を確認し、口座所有者本人であることを照合してください。これ以外の機密情報は要求しないでください。


    ステップ2：積立商品の選定

    お客様の知識、経験、投資目的に照らし、適合性の原則に基づいた適切な商品（投資信託）を提示してください。個別の利益保証や税務助言は行わないよう徹底してください。


    ステップ3：決済方法の決定

    「現金（口座振替）」か「クレジットカード積立」かを確認します。クレジットカードを選択される場合は、以下の条件を伝えてください。

    ・クレジットカード積立の上限（月額）：100,000円

    ・クレジットカード積立のポイント還元率：0.5%


    ステップ4：積立金額の設定

    積立の最低金額である100円以上の金額を設定していただきます。クレジットカード決済の場合、前述の100,000円上限を超えないよう案内してください。


    ステップ5：設定完了の確認

    設定が正しく完了したことを画面または通知で確認していただき、次回の積立予定日を案内してクローズしてください。複雑な案件となった場合は、速やかにコンプライアンス担当または運用責任者へエスカレーションしてください。'
