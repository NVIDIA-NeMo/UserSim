- id: 349423ce-c890-5719-8d84-ad3a189afc2e
  title: 特定口座（源泉徴収あり）：解約・変更・プランの切替え
  body: '特定口座の解約、または源泉徴収なし口座から「特定口座（源泉徴収あり）」への切替え手順をご案内します。


    【お手続き前にご用意いただくもの】

    ・ご登録済みのフルネームと生年月日（本人確認に使用します）


    【お手続きの流れ】

    1. 変更または解約の申請：ヘルプデスクにて、特定口座の「解約」または「源泉徴収ありへのプラン切替え」を依頼してください。

    2. 本人確認の実施：当社担当者が、お客さまの「フルネーム」と「生年月日」を確認し、ご本人様であることの照合を行います。なお、パスワードや暗証番号などの機密情報を伺うことはございません。

    3. 内容の確認と承諾：変更後の税務上の扱い（20.315%の自動課税など）について説明を受け、承諾してください。

    4. 手続き完了の通知：手続きが正常に完了した旨が、登録メールアドレス宛に通知されます。


    【ご注意点】

    ・プランの切替えは、原則として年単位での変更となります。

    ・解約される場合は、保有されている有価証券の売却または他社への移管が必要です。資産が残っている状態では解約いただけません。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: how_to_guide
