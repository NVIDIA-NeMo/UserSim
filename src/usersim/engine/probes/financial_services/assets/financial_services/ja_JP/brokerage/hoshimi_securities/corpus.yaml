- id: 25414400-f34d-5189-b627-7b148b86b710
  title: NISA（成長投資枠）：限度額・制限と注意事項
  body: '本ドキュメントは、サポート担当者が顧客へNISA（成長投資枠）の制限事項を案内するための資料です。顧客の状況に応じて、以下の限度額および制限を正確に伝えてください。


    【投資限度額】

    ・年間投資枠：2,400,000円（1年間に投資できる最大金額です）

    ・非課税保有限度額：12,000,000円（非課税で保有できる資産の最大金額です。なお、つみたて投資枠分を含めたNISA口座全体の合計限度額は1,800万円となります）


    【重要な制限と注意事項】

    ・商品の売却による枠の再利用：売却した商品の取得価額分だけ、翌年以降に非課税保有限度額の枠を再び利用することが可能です。当日の枠復活は行われませんのでご注意ください。

    ・国内株式の受渡し：国内株式のお取引の場合、受渡しは約定日の2営業日後となります。

    ・適合性の原則：顧客の知識、経験、財産の状況、投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底してください。顧客の最善の利益を追求し、リスク告知を明確に行う必要があります。

    ・補償について：顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外です。'
