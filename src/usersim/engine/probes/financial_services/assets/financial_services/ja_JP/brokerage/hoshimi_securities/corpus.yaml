  mentions_tools: []
  institution_id: hoshimi_securities
- id: a830aea5-0fa5-5b19-9607-c5b01a144f9e
  title: NISA（つみたて投資枠）：おすすめの方と主な使い方
  body: 'NISA（つみたて投資枠）は、少額からコツコツと長期的な資産形成を行うための、非課税の積立専用枠です。将来に向けて着実に資産を増やしたい方に最適な制度です。


    【このような方におすすめです】

    ・投資は初めてで、リスクを抑えて少額から始めたい方

    ・老後資金や教育資金など、長期的な視点で資産形成を行いたい方

    ・日々の相場変動に一喜一憂せず、自動的に積み立てを行いたい方


    【主な使い方と特徴】

    ・少額からのスタート：積立の最低金額は100円からとなっており、心理的・経済的なハードルを最小限に抑えて開始いただけます。

    ・非課税メリット：通常、上場株式等の譲渡益や配当には20.315%の税金がかかりますが、本枠で得た利益は非課税となります。

    ・効率的な積立：クレジットカード決済などを利用した自動積立により、手間なく効率的な資産形成が可能です。


    【運用のポイント】

    年間投資枠の1,200,000円を最大限に活用し、時間をかけて運用することで、複利の効果を享受しながら非課税保有限度額の18,000,000円まで資産を積み上げることが可能です。'
