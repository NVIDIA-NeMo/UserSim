- id: ca5e2258-ce64-5083-b52d-63db7d61fae3
  title: NISA（つみたて投資枠）：解約・変更・プランの切替え
  body: 'NISA（つみたて投資枠）の積立プランの変更や、解約、他社への切り替えを行う際の手順をご案内します。


    【お手続き前の準備】

    お手元に口座番号のご用意をお願いいたします。


    【お手続きの流れ】

    1. 本人確認：担当者に「フルネーム」と「生年月日」を伝え、本人確認を完了させてください。

    2. 内容の提示：積立金額の変更、積立商品の変更、または解約など、ご希望の内容を具体的にお伝えください。

    3. 条件確認：変更後の金額が、年間投資枠である1,200,000円の範囲内であるかを確認します。

    4. 確定と通知：弊社にて手続きを処理し、完了後、デジタルチャネルにて通知をお送りします。


    【プラン切替え・金融機関変更について】

    NISA口座を開設している金融機関の変更は、年単位で実施いただけます。他社への切り替えを希望される場合は、弊社にて変更手続きの案内を行い、必要書類の提示をさせていただきます。手続き完了後、翌年以降から新しい金融機関で非課税枠をご利用いただけます。


    【解約について】

    保有商品の売却による解約が可能です。売却後の取得価額分は、翌年以降に非課税保有限度額（最大18,000,000円）の中で再利用可能です。'
