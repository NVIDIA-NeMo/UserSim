- id: b3a7e805-574e-5aeb-9023-719a3303ef08
  title: 投資信託の積立：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの資産を安全に管理し、不正利用から守るための体制を整備しております。特に「投資信託の積立」をご利用の際は、以下の点にご注意ください。


    【なりすまし詐欺へのご注意】

    当社を名乗り、お客様の資産状況や積立設定の変更を促して、機密情報を聞き出そうとする不審な連絡にご注意ください。星見証券が、お客様のパスワード、暗証番号、またはクレジットカードのセキュリティコードをメールや電話でお伺いすることはございません。


    【本人確認について】

    口座情報の変更や重要な手続きを行う際、当社は必ず本人確認を実施します。確認項目は、お客様の「フルネーム」と「生年月日」の照合のみです。これ以外の認証ステップや、機密情報の提示を要求することはございませんので、不自然な要求があった場合はすぐにご連絡ください。


    【異常に気づいた時の対応】

    身に覚えのない積立設定の変更や、クレジットカードへの不審な請求に気づいた場合は、速やかに当社ヘルプデスクまでご連絡ください。迅速に調査を行い、透明性のあるプロセスで対応いたします。解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）をご案内しております。'
