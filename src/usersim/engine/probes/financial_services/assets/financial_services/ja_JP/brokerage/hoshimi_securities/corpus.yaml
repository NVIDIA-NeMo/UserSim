- id: 4788061c-23ab-5558-be6d-e6768d8e50f6
  title: NISA（成長投資枠）：ログインできない・アクセスできない
  body: 'NISA（成長投資枠）のご利用にあたり、ログインやアクセスができない場合の対処法をご案内します。


    ■ よくある症状と原因

    ・ログインボタンを押しても反応がない、またはエラーメッセージが表示される（通信環境の不安定、またはブラウザのキャッシュ蓄積）。

    ・「IDまたはパスワードが正しくありません」と表示される（入力ミスのほか、一定回数の失敗によるアカウントロック）。


    ■ 確認と解決の手順

    1. 通信環境の確認：Wi-Fiやモバイルデータ通信が正常に動作しているかご確認ください。

    2. 入力内容の再確認：大文字・小文字の区別や、不要なスペースが入っていないかをご確認ください。

    3. パスワードの再設定：パスワードを忘れた場合は、再設定の手続きをご案内します。本人確認（フルネームと生年月日）を経て、新しいパスワードを設定いただけます。


    ■ 解決しない場合（エスカレーション）

    上記を試しても解決しない場合は、当社でシステムログを確認し、アカウントの状態を調査いたします。調査結果および復旧見込みについては、後ほど担当よりご連絡差し上げます。


    ※本件に関し、お客様に暗証番号や機密情報の入力を求めることはございません。'
