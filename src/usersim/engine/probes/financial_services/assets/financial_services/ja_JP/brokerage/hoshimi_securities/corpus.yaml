- id: 7bf1e113-644e-5d52-ba5a-e41c5668c26e
  title: NISA（成長投資枠）：規定・約款の変更
  body: '本規定は、星見証券が提供するNISA（成長投資枠）の利用条件および約款の変更手続きについて定めたものです。


    1. 規定の変更

    当社は、法令の改正、監督官庁（金融庁、日本証券業協会）の指示、または運営上の合理的な理由がある場合、本約款を変更することがあります。変更内容は、事前にお客様への通知または公式サイトへの掲載により告知いたします。


    2. 投資限度額の遵守

    お客様は、年間投資枠2,400,000円および非課税保有限度額12,000,000円の範囲内で取引を行うものとします。これらの限度額は税制に基づいたものであり、限度額を超えた分については非課税適用外となります。


    3. 手数料の適用

    国内株式の売買手数料は原則として0円とします。ただし、海外取引等については、インフラ維持と規制遵守のための適正なコストとして別途設定された手数料が適用されます。


    4. 合意の終了

    お客様が口座解約を申し出た場合、または当社が本約款への重大な違反を確認した場合、本契約は終了します。終了時の資産取り扱いは、金融商品取引法および分別管理の規定に基づき適切に処理されます。


    本規定の詳細について、他社サービスとの比較をご検討される際は、当社の透明性の高い手数料体系をご確認ください。'
