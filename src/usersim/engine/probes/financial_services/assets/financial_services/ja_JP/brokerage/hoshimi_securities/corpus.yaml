- id: 7b6aa0a7-8675-5a19-b957-f1c2a21043dd
  title: 特定口座（源泉徴収あり）：限度額・制限と注意事項
  body: '特定口座（源泉徴収あり）をご利用いただく際の重要な制限事項および注意事項についてご案内いたします。


    【税率と税金】

    上場株式等の譲渡益および配当に対しては、20.315%の税率が適用されます。本口座では、この税金が自動的に差し引かれるため、原則として確定申告の手間を省くことができます。


    【損失の繰越控除】

    年間の取引で損失が出た場合、確定申告を行うことで、その損失を最大3年まで繰り越し、将来の利益から差し引くことが可能です。


    【手数料】

    国内株式の売買手数料は0円となっており、投資への経済的なハードルを最小限に抑えた設計となっております。


    【資産の保護とリスク】

    ・分別管理：お客様の資産は当社の財産と分けて管理されています。

    ・投資者保護：万一の際は、日本投資者保護基金により1人当たり1,000万円まで補償されます。

    ・市場リスク：相場変動による損失は補償の対象外となります。元本は保証されておりませんのでご注意ください。


    【適合性の原則】

    お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘は行いません。お取引の際は、ご自身のリスク許容度に基づいた判断をお願いいたします。'
