- id: b5d9d010-07ae-5d80-a2b4-815e8022cbf6
  title: iDeCo（個人型確定拠出年金）：明細や記録と合わない
  body: "お客様から「iDeCo（個人型確定拠出年金）の資産残高や拠出記録が、自身の記録と合わない」と指摘された場合の対応フローです。サポート担当者は以下のステップで確認してください。\n\
    \n【症状】\n・拠出金が想定より少ない。\n・残高が計算と合わない。\n\n【確認すべき事項と原因】\n1. 手数料の差し引きを確認する：\n   - 2026年12月分から適用される毎月の手数料186円が差し引かれているかを確認してください。お客様がこのコストを失念しているケースが多くあります。\n\
    2. 拠出タイミングの確認：\n   - 掛金の拠出日にタイムラグがあるため、最新の拠出分がまだ反映されていない可能性があります。\n3. 加入時費用の確認：\n\
    \   - 加入時に国民年金基金連合会へ支払われた2,829円が、資産から差し引かれているか（あるいは別途支払われたか）を確認してください。\n\n【解決策】\n\
    - 手数料（月額186円など）を具体的に提示し、差し引き後の正当な残高であることを説明してください。\n- 拠出履歴の詳細を提示し、どのタイミングでいくら積み立てられたかを明確に示してください。\n\
    \n【エスカレーション】\n上記の説明を行っても不一致が解消されない、あるいはシステム上の計算ミスが疑われる場合は、速やかに社内の専門の運用責任者へ報告し、詳細なデータ照合を依頼してください。調査完了後、お客様へ誠実に回答いたします。"
