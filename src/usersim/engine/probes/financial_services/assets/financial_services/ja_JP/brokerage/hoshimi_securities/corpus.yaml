- id: e33f4b56-b71d-5751-a445-7a86748bb34d
  title: 特定口座（源泉徴収あり）：ご利用開始までの手順
  body: 'お客様が特定口座（源泉徴収あり）を利用開始するまでのフローです。サポートエージェントは以下のステップに従って案内してください。


    1. 【本人確認の実施】

    手続きの開始前に、必ずお客様の「フルネーム」と「生年月日」を確認し、登録情報と照合してください。これ以外の機密情報は要求しないでください。


    2. 【マイナンバーの届出確認】

    特定口座の開設には、法令によりマイナンバーの届出が必須です。未提出のお客様には、デジタルチャネルを通じて届出を案内してください。


    3. 【口座タイプの選択案内】

    「源泉徴収あり」を選択することで、上場株式等の譲渡益・配当にかかる税率20.315%の計算と納税を当社が代行し、原則として確定申告が不要になるメリットを説明してください。


    4. 【手数料の告知】

    国内株式の売買手数料が0円であることを伝え、コスト面でのハードルが低いことを案内してください。


    5. 【完了確認】

    口座開設手続きが完了し、取引可能な状態になったことをお客様に通知して完了となります。


    【注意点】

    個別の税務相談は行わず、一般的な制度説明に留めてください。複雑な案件は社内のコンプライアンス担当へエスカレーションしてください。'
