- id: b17c0b89-54c8-52e7-a123-09edf714ab8b
  title: 投資信託の積立：想定外の手数料・金額
  body: 'お客様から「想定していた金額と異なる」「不明な金額が請求されている」とのお問い合わせがあった際の対応フローです。


    【想定される症状と原因】

    1. クレジットカードからの請求額が設定額より少ない

    ・原因：クレジットカード積立の上限（月額）である100,000円を超えて設定しようとしたか、カード側の利用限度額に達している可能性があります。


    2. 積立が実行されていない

    ・原因：積立の最低金額（100円）を下回る設定になっていたか、カードの有効期限切れなどが考えられます。


    【確認の手順】

    1. 設定金額の確認：お客様の現在の積立設定額が、最低100円から上限100,000円（カード積立の場合）の範囲内にあるかを確認します。

    2. 決済履歴の照会：カード決済が正しく完了しているか、エラーメッセージが出ていないかを確認します。


    【解決策とエスカレーション】

    ・設定ミスの場合：その場で正しい金額への変更を案内し、手続きを行います。

    ・カード会社側の制限の場合：お客様ご自身でカード会社へご確認いただくよう案内します。

    ・原因が特定できず、金額の不一致が解消されない場合：社内のコンプライアンス担当または運用責任者へエスカレーションし、詳細な調査を依頼します。調査結果はお客様に透明性を持って提示してください。'
