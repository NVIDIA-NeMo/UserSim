- id: f8bb33ec-ee8d-5adb-ae09-8638ab69ac91
  title: iDeCo（個人型確定拠出年金）：重要事項のご説明
  body: '【適合性の原則について】

    星見証券は金融商品取引法に基づき、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しています。推奨商品の提示にあたっては、これらの条件に適切であるかを確認いたします。


    【元本保証とリスク】

    iDeCoで運用される商品は元本が保証されておりません。運用成果によっては、受け取り時の資産額が拠出額を下回る（元本割れ）可能性があります。相場変動による損失は、いかなる場合も補償の対象外となります。


    【資産の管理と補償】

    お客様の資産は、証券会社の財産とは分けて管理される「分別管理」が行われています。万一、証券会社が破綻し資産が返還されない場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【税務・法的助言について】

    弊社は一般的な投資教育および商品情報の提供を行いますが、個別の税務相談や法的助言、および将来の利益の保証は行いません。確定申告などの具体的な税務手続きについては、税理士または管轄の税務署へご相談ください。'
  domain: brokerage_investing
  product_category: ideco
  document_type: disclosure
  source_authority: official
