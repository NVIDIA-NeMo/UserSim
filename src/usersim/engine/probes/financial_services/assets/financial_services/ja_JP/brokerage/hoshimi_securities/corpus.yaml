  title: 米国株式の取引：当社の似た商品との比較
  body: '当社の国内株式取引と「米国株式の取引」を比較します。


    【コスト面】

    ・国内株式：主要商品の手数料は0円であり、投資へのハードルを最小限に抑えています。

    ・米国株式：取引手数料は0.495%（上限22米ドル）となり、さらに為替手数料（1米ドルあたり25銭）が発生します。


    【リスクとリターン】

    ・国内株式：日本企業の成長に投資します。通貨は円のため、為替リスクはありません。

    ・米国株式：世界をリードする米国企業の成長を享受できますが、株価変動に加えて為替変動リスクを伴います。


    【選び方】

    コストを抑えて国内の資産形成を優先したい方は国内株式を、手数料を許容してでも世界的な成長銘柄に直接投資し、分散投資を追求したい方は「米国株式の取引」が適しています。'
