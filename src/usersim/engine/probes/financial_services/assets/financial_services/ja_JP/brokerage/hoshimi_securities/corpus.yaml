- id: 5569d81e-a9fc-5193-bbd6-e851d2b7e766
  title: 米国株式の取引：為替手数料（1米ドルあたり、銭）について
  body: '【Q】米国株式を取引するための米ドルを準備する際、どのような手数料がかかりますか？


    A：日本円から米ドルへ、または米ドルから日本円へ換算される際に、為替手数料として1米ドルあたり25銭を申し受けます。


    【Q】為替手数料はいつ差し引かれますか？


    A：通貨の換算手続き（円貨決済または外貨への変更）を行ったタイミングで計算され、適用されます。


    【Q】為替手数料以外に米国株の取引でかかる費用はありますか？


    A：はい。別途、取引手数料として約定代金に対する0.495%（上限22米ドル）がかかります。詳細は「米国株式の取引：手数料一覧」をご確認ください。'
