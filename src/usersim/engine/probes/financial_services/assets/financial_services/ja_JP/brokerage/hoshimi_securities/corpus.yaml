- id: de31e18e-a83c-52b5-a79f-0d6d0e17708a
  title: iDeCo（個人型確定拠出年金）：よくあるお手続きの流れ
  body: 'iDeCo（個人型確定拠出年金）で頻繁に行われる「掛金の金額変更」の手続きフローをご案内します。


    【事前準備】

    変更後の希望金額を決定しておいてください。また、ご本人様確認のため「フルネーム」と「生年月日」をご用意ください。


    【お手続きの手順】

    1. 当社担当者に「iDeCoの掛金金額を変更したい」旨をお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」を伝えてください。

    3. 新しい月々の掛金額を伝えてください。金額は、最低額5,000円から、上限額（2026年12月分から会社員62,000円、自営業者75,000円）の範囲内で指定してください。

    4. 変更内容に間違いがないか、担当者が復唱して確認します。

    5. 手続き完了後、当社から変更完了の旨を通知いたします。


    【完了の確認】

    次回の拠出分から、指定した金額で積み立てが行われていることを、状況確認のお手続き（iDeCo（個人型確定拠出年金）：状況・履歴の確認）にてご確認ください。'
