  body: '【資産形成応援キャンペーンのご案内】


    星見証券では、多くの方に資産形成の民主化を実感していただくため、以下の特典をご用意いたしました。


    ■ ご紹介特典

    ご友人やご家族に星見証券をご紹介いただき、新しくNISA（成長投資枠）口座を開設された方とご紹介者様それぞれに、1,000円のギフト券をプレゼントいたします。


    ■ 継続利用特典

    NISA（成長投資枠）を継続してご利用いただき、年間投資枠である2,400,000円を最大限に活用されたお客様を対象に、抽選で限定の投資レポートを差し上げます。


    【キャンペーン期間】

    2024年4月1日から2024年12月31日まで


    国内株式の売買手数料0円のメリットを活かし、ぜひこの機会にグローバルな成長への投資を始めてください。'
