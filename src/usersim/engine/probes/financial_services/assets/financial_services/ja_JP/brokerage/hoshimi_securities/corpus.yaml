- id: 903ec186-f725-505e-a2b6-8a70f8bc6f2a
  title: NISA（つみたて投資枠）：手数料一覧
  body: 'NISA（つみたて投資枠）における手数料は以下の通りです。星見証券では、資産形成へのハードルを下げるため、主要商品の手数料を無料としております。


    ・国内株式等の主要商品売買手数料：0円

    ・NISA口座開設手数料：0円

    ・NISA口座維持管理手数料：0円


    ※投資信託をご利用の場合、商品内部で発生する信託報酬などの運用管理費用は、別途各商品の目論見書に記載されています。これらは運用会社へ支払われるコストであり、弊社が受領する手数料ではありません。'
