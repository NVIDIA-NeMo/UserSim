- id: 9ba4217c-7343-59d1-b78a-955bd2385b77
  title: open_nisa_account を使う場面
  body: 'お客様から NISA（つみたて投資枠）または NISA（成長投資枠）の開設申し込みを受けた際に、open_nisa_account を使用します。


    【手続き手順】

    1. 本人確認の実施

    verify_identity を呼び出し、お客様の「フルネーム」と「生年月日」を用いて本人確認を完了させてください。


    2. 総合口座の確認

    NISA口座の開設には証券総合口座が必要です。get_accounts を使用し、既に口座を保有しているか確認します。未保有の場合は、先に総合口座の開設を案内してください。


    3. NISA口座開設の申し込み

    お客様の意向を確認後、open_nisa_account を呼び出して申し込み手続きを行います。


    4. 案内事項の伝達

    申し込み完了後、税務署での確認手続きを経てから利用可能になることを明確に伝えてください。また、18歳以上の方が1人1口座持てる制度である点についても併せてご案内ください。'
