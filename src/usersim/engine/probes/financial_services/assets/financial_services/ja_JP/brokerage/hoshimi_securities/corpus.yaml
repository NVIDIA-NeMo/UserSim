    期間中にお友達をご紹介いただき、ご紹介された方が「米国株式の取引」口座を開設された場合、ご紹介者様とご友人様の両方に、投資資金としてご利用いただける1,000円をプレゼントいたします。


    【期間】

    2024年11月1日から2024年12月31日まで


    【継続利用特典】

    米国株式の取引を継続的にご利用いただいているお客様には、定期的にお得な情報や、取引コストを抑えるための限定的なプランをご案内いたします。グローバルな資産形成を、ぜひ星見証券で始めてください。'
