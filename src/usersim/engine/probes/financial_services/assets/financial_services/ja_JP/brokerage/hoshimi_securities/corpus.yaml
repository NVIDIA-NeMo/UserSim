- id: 172d744c-4642-5165-8ee0-8658648f819f
  title: 特定口座（源泉徴収あり）：手数料と費用
  body: '特定口座（源泉徴収あり）のご利用に伴う費用について、よくあるご質問にお答えします。


    Q：国内株式を売買する際の手数料はかかりますか？

    A：いいえ、国内株式の売買手数料は0円です。コストを抑えて資産形成に取り組んでいただけます。


    Q：運用で得た利益に税金はかかりますか？

    A：はい。上場株式等の譲渡益・配当にかかる税率として20.315%が適用されます。本口座では税金が自動的に源泉徴収されるため、原則として確定申告は不要です。


    Q：NISA口座との費用の違いは何ですか？

    A：NISA口座では利益が非課税となりますが、本口座では上記20.315%の税金が発生します。詳細は「NISA（成長投資枠）：商品概要」などをご参照ください。'
