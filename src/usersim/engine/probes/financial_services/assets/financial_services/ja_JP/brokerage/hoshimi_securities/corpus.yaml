  body: 'NISA（つみたて投資枠）のお申込み条件は以下の通りです。


    | 条件 | 判定 | 備考 |

    | :--- | :--- | :--- |

    | 日本国内に居住している18歳以上の方 | 利用可能 | 1人1口座まで開設可能です |

    | 日本国内に居住している0歳から17歳の方 | 2027年1月から利用可能 | 年間投資枠 600,000円 / 非課税保有限度額 6,000,000円まで
    |

    | マイナンバーの届出が可能な方 | 必須 | 法律に基づき届出が必要です |

    | 他社でNISA口座を保有している方 | 要手続き | 金融機関変更手続きを経て利用可能です |'
