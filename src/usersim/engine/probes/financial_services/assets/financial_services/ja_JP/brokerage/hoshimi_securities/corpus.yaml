- id: ad57a293-3ec6-556d-b7c0-761ea99c248e
  title: 米国株式の取引：取引手数料の上限（米ドル）について
  body: 'Q：米国株式を大量に売買する場合、取引手数料が非常に高くなってしまいませんか？


    A：ご安心ください。当社の米国株式取引手数料には上限が設けられています。通常、取引手数料は約定代金の0.495%となりますが、1回の取引あたりの最大金額は22米ドルです。したがって、約定代金が高額になり、計算上の手数料が22米ドルを超える場合でも、お客さまにご負担いただく手数料は22米ドルのみとなります。


    詳細は「米国株式の取引：金利・料率の決まり方と適用」をご確認ください。'
