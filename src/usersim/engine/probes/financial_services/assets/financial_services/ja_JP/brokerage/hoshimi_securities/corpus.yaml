- id: 078fa215-a8c4-5915-86c3-783cc517376f
  title: 特定口座（源泉徴収あり）：当社の似た商品との比較
  body: '「特定口座（源泉徴収あり）」と、非課税制度であるNISA口座を比較します。


    【特定口座（源泉徴収あり）】

    ・税金：上場株式等の譲渡益・配当に20.315%の税金がかかります。

    ・投資限度額：制限はありません。自由に投資額を決定いただけます。

    ・メリット：確定申告が原則不要で、運用金額に上限がないため、積極的な資産形成に適しています。


    【NISA（成長投資枠）】

    ・税金：一定の限度額まで利益が非課税となります。

    ・投資限度額：年間240万円、非課税保有限度額は1,200万円までです。

    ・メリット：税金がかからないため、効率的に資産を増やせます。


    【選び方の目安】

    ・まずは非課税のメリットを最大限に活用したい方は「NISA（成長投資枠）：商品概要」をご検討ください。

    ・NISAの限度額を超えて投資したい方や、税金の手続きを完全に自動化したい方は「特定口座（源泉徴収あり）」が最適です。'
