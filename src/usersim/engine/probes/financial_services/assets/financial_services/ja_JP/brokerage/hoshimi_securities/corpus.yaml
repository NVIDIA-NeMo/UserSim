  body: 'iDeCo（個人型確定拠出年金）に関わる手数料は以下の通りです。サポート担当者は、顧客への案内時に正確な金額を提示してください。


    ・加入時の手数料（国民年金基金連合会）：2,829円

    ・毎月の手数料（2026年12月分から）：186円

    ・運営管理機関手数料（星見証券）：0円


    ※加入時の手数料および毎月の手数料は、制度を運営する国民年金基金連合会へ支払われる費用です。星見証券が徴収する運営管理機関手数料は、すべての加入者様に対して0円となります。'
