- id: 77567135-5b38-546f-b151-c29633cb0cca
  title: NISA（成長投資枠）：プランの選び方
  body: '資産形成の目的に合わせて、NISA（つみたて投資枠）とNISA（成長投資枠）を使い分けてください。


    ■ NISA（成長投資枠）

    ・特徴：株式などの幅広い商品に柔軟に投資でき、利益が非課税となる枠です。

    ・年間投資枠：2,400,000円

    ・非課税保有限度額：12,000,000円

    ・向いている方：個別の銘柄選定を行い、積極的な資産成長を目指したい方。


    ■ NISA（つみたて投資枠）

    ・特徴：少額からコツコツと長期的な資産形成を行うための、非課税の積立専用枠です。

    ・年間投資枠：1,200,000円

    ・非課税保有限度額：合計1,800万円（うち成長投資枠は1,200万円）

    ・向いている方：リスクを抑え、定額積立で着実に資産を増やしたい方。


    星見証券では、国内株式の売買手数料を0円としており、成長投資枠での積極的な運用を強力にサポートします。両枠を併用することで、より効率的なポートフォリオを構築することが可能です。'
