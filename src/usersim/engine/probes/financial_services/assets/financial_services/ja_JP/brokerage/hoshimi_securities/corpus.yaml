- id: da36020a-8a7c-5a74-86cb-17c9d8a58da8
  title: NISA（つみたて投資枠）：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの大切な資産を保護するため、セキュリティの強化に努めております。特にNISA（つみたて投資枠）のような長期的な資産形成を行う口座において、以下のような不正利用の手口に十分ご注意ください。


    【注意すべき詐欺パターン】

    ・弊社職員を名乗り、「非課税枠の再設定が必要である」として、パスワードや暗証番号、ワンタイムコードを要求する電話やメール。

    ・「限定の非課税商品がある」として、外部の不審なURLへ誘導し、個人情報の入力を求めるメッセージ。


    【星見証券が絶対に行わないこと】

    弊社が、お問い合わせの際や手続きの過程で、お客さまのパスワード、ログインID、または機密性の高い認証コードを伺うことはございません。本人確認において弊社が要求するのは、お客様の「フルネーム」と「生年月日」の照合のみです。これ以外の機密情報の要求は一切ございませんので、十分にご注意ください。


    【不審な点に気づいた時の対応】

    もし不審な連絡を受けたり、身に覚えのない取引通知が届いたりした場合は、直ちにご報告ください。迅速に調査プロセスを開始し、透明性のある対応をさせていただきます。なお、不正利用の報告が遅れた場合、責任範囲の特定に影響が出る可能性がございますので、早急なご連絡をお願いいたします。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: d5965c98-ff8d-5af4-bf47-9d4f296bc84b
  title: NISA（つみたて投資枠）：規定・約款
  body: '本規定は、星見証券で提供するNISA（つみたて投資枠）の利用条件を定めるものです。本サービスを利用する際は、以下の条件に同意し、遵守いただく必要があります。


    1. 投資枠の遵守

    お客さまは、法令に基づき、年間投資枠である1,200,000円および非課税保有限度額である18,000,000円の範囲内で運用を行うものとします。これらの限度額を超えた拠出はできません。


    2. 適合性の原則

    弊社は、お客さまの知識、経験、財産の状況および投資目的に照らして、不適当な勧誘を行わない「適合性の原則」に基づき業務を行います。お客さまは、正確な情報を弊社に提供する義務を負います。


    3. 資産の管理と補償

    顧客資産は、弊社財産とは分けて管理する「分別管理」を徹底します。万一弊社が破綻し資産が返還されない場合、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償の対象外となります。


    4. 規定の変更および終了

    法令の改正や制度変更に伴い、本規定を変更することがあります。変更内容は事前にお知らせいたします。また、口座開設に必要なマイナンバーの届出が適切に行われていない場合、口座の利用を制限または終了することがあります。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: terms_conditions
  source_authority: official
