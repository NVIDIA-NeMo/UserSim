- id: 8340e90c-a0b5-5712-b1d4-35c1677124ff
  title: get_accounts を使う場面
  body: 'お客様が保有している口座の一覧を確認したい場合や、お客様から提示された口座番号の下4桁から正確な account_id を特定する必要がある場合にこの手続きを行います。他の多くの手続き（入出金や口座変更など）の前提ステップとして利用されます。


    1. 本人確認を実施します。お客様から「フルネーム」と「生年月日」を確認し、verify_identity を呼び出して照合してください。

    2. 口座情報を取得します。get_accounts を呼び出し、お客様が保有するすべての口座（口座ID、口座タイプ、下4桁、残高、ステータス）および登録カードの情報を取得します。

    3. 特定の口座を照合します。取得したリストの中から、お客様が提示した下4桁と一致する口座を探し、その account_id を特定して以降の手続きに利用します。


    本ツールで得られた account_id は、社内管理用の識別子であるため、お客様に直接提示しないでください。お客様への案内には、口座タイプや下4桁などの情報を適切に用いてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: hoshimi_securities
- id: 7cd78705-c6e6-5139-84e1-463a7d89304b
  title: get_accounts ツールリファレンス
  body: 'get_accountsは、本人確認が完了した顧客の口座情報を一覧で取得するツールです。エージェントはこのツールを直接呼び出すことで、顧客の口座ID（account_id）、口座種別、口座番号の下4桁、残高、ステータス、および保持しているカードID（card_id）を確認できます。


    本ツールは引数をとりません。顧客から提示された口座番号の下4桁を基に、正確なaccount_idを特定して他の手続きに利用するために使用します。ツールの呼び出し前に、必ずverify_identityによる本人確認を完了させてください。'
