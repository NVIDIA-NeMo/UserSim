- id: a6e0e9ba-6620-59c8-a5ab-1d9d9f5798db
  title: iDeCo（個人型確定拠出年金）：規定・約款
  body: '本規定は、星見証券が提供するiDeCo（個人型確定拠出年金）の運営管理機関としてのサービス利用条件を定めるものです。


    1. 手数料の負担

    お客様は、以下の手数料を負担するものとします。

    ・加入時手数料：2,829円（国民年金基金連合会へ支払われる初期費用です）

    ・月額手数料：186円（2026年12月分から適用されます）

    ・運営管理機関手数料：0円（星見証券が負担いたします）


    2. 掛金の拠出制限

    拠出額は法令に基づき、以下の上限および下限を適用します。

    ・最低掛金額：月額 5,000円

    ・会社員の上限額：月額 62,000円（2026年12月分から）

    ・自営業者の上限額：月額 75,000円（2026年12月分から）


    3. 資産の引き出し制限

    iDeCoは原則として60歳まで資産を引き出すことができません。確定拠出年金法に基づく制度であり、中途解約は法令で定められた厳格な要件を満たす場合を除き認められません。


    4. 適合性の原則

    当社は、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わず、お客様の最善の利益を追求して業務を行います。


    5. 資産の管理

    顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による損失は補償対象外となります。'
