  mentions_tools: []
  institution_id: hoshimi_securities
- id: 0bf15f62-966b-5b2d-a83d-a424b9d7cf95
  title: 手数料・料金のご案内
  body: '星見証券では、投資への心理的・経済的なハードルを最小限に抑えるため、透明性の高い手数料体系を採用しております。


    ■国内株式などの主要商品

    売買手数料：0円


    ■海外取引およびその他商品

    海外取引等の手数料につきましては、適正なインフラ維持および規制遵守のためのコストとして、別途設定しております。詳細な商品別手数料については、各商品の手数料一覧をご参照ください。'
