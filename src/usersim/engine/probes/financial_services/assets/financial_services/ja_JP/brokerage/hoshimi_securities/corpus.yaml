- id: cdb0a95b-6c70-51e8-97e3-ebc8678a0628
  title: 米国株式の取引：ご利用条件による違い
  body: '「米国株式の取引」のご利用可否および制限については、金融商品取引法に基づく「適合性の原則」に従い、以下の基準で判断いたします。


    | 顧客属性・条件 | 判定結果 | 適用される制限・措置 |

    | :--- | :--- | :--- |

    | 十分な投資知識と経験があり、リスク許容度が高い | 利用可能 | 制限なし。全銘柄の取引が可能です。 |

    | 投資経験はあるが、米国株の特性（為替リスク等）への理解が不十分 | 条件付き利用可能 | 適切な投資教育情報の提供後、利用可能となります。 |

    | 投資経験がなく、資産状況に照らしてリスク許容度が低い | 利用不可 | 適合性の原則に基づき、本商品の提供は見合わせます。 |'
