  institution_id: hoshimi_securities
- id: 57f21170-5c44-558e-bfd6-d55f324e11a0
  title: NISA（つみたて投資枠）：非課税保有限度額について
  body: 'Q：NISA（つみたて投資枠）の非課税保有限度額はいくらですか？

    A：非課税保有限度額は18,000,000円です。この金額まで、非課税で資産を保有し続けることができます。


    Q：商品を売却した場合、限度額はどうなりますか？

    A：売却した商品の取得価額分だけ、翌年以降に非課税保有限度額の枠を再び利用することが可能です。


    Q：未成年の場合の限度額はどうなりますか？

    A：2027年1月からは0歳から17歳の方もつみたて投資枠を利用でき、未成年者の非課税保有限度額（2027年1月から）は6,000,000円となります。'
