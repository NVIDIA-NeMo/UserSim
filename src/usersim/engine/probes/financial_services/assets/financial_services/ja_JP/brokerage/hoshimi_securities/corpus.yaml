- id: ce61103b-419b-51e1-b4ee-97b5035e3d54
  title: close_account を使う場面
  body: '顧客から口座解約の申し出があった場合、エージェントは以下の手順で手続きを行います。口座解約は取り消し不可能な操作であるため、慎重に実施してください。


    1. 顧客から「フルネーム」と「生年月日」を確認し、verify_identityを呼び出して本人確認を行います。

    2. 顧客が解約を希望する口座の下4桁を確認します。

    3. get_accountsを呼び出し、下4桁に合致する口座の正確なaccount_idを特定します。

    4. 特定したaccount_idを用いてclose_accountを呼び出し、解約手続きを完了させます。


    手続き完了後、顧客に解約が完了したことを丁寧にお伝えください。なお、口座内の残高がある場合は、あらかじめwithdraw_fundsなどのツールを用いて出金手続きを完了させていただくようご案内ください。複雑な事情による解約や、不適切な解約申請が疑われる場合は、社内のコンプライアンス担当者へエスカレーションしてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: hoshimi_securities
- id: 70d10df2-e842-5112-a69a-1767fcc2ceb2
  title: close_account ツールリファレンス
  body: 'close_accountは、指定された証券口座を解約するためのツールです。エージェントがこのツールを直接呼び出すことで解約処理が実行されます。


    【引数】

    - account_id: 解約対象となる口座の固有識別子。get_accountsなどのツールで取得してください。


    【効果】

    指定された口座が即座に閉鎖されます。この操作は不可逆的（irreversible）であり、一度実行すると元に戻すことはできません。実行前に必ずverify_identityによる本人確認を完了させてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: hoshimi_securities
- id: 9ea866cd-8bf6-540f-b917-6d277e2f21a4
  title: update_contact_info を使う場面
  body: '顧客の住所、電話番号、メールアドレスなどの連絡先情報に変更が生じ、更新を希望された場合に本手続きを行います。正確な顧客情報の維持は、法令遵守および重要な通知の送付において不可欠です。


    1. 顧客から「フルネーム」と「生年月日」を確認し、verify_identityを呼び出して本人確認を行います。

    2. 更新が必要な項目（新しい住所、電話番号、またはメールアドレス）を顧客から伺います。

    3. 顧客の「フルネーム」、「生年月日」および「新しい連絡先情報」を用いてupdate_contact_infoを呼び出し、情報を更新します。


    更新完了後、正しく変更されたことを顧客に報告してください。本人確認が不十分な状態で情報を更新することは厳禁です。また、法人顧客や代理人による変更など、特殊なケースについては、必ず社内の運用責任者へエスカレーションし、指示を仰いでください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: hoshimi_securities
- id: a5cdbf9e-2c7f-528e-92dd-d32c9e8b4b62
  title: update_contact_info ツールリファレンス
  body: 'update_contact_infoは、顧客の登録連絡先情報を更新するためのツールです。エージェントが直接呼び出すことで、データベース上の情報を書き換えます。


    【引数】

    - フルネーム: 本人確認済みの顧客の氏名

    - 生年月日: 本人確認済みの顧客の生年月日

    - 新しい連絡先情報: 更新後の住所、電話番号、メールアドレスなどの詳細


    【効果】

    顧客の登録情報が最新の状態に更新されます。本ツールの使用前には、必ずverify_identityを用いて本人確認を完了させてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: hoshimi_securities
- id: 174af2a5-079f-5f1e-8ca7-4fb29df4977d
  title: get_statements を使う場面
  body: '顧客から取引報告書や残高証明書などの statements（明細書・報告書）の提供を求められた場合に本手続きを行います。資産状況の確認や税務申告の準備などの目的で利用されます。


    1. 顧客から「フルネーム」と「生年月日」を確認し、verify_identityを呼び出して本人確認を行います。

    2. 明細を希望する口座の下4桁を確認します。

    3. get_accountsを呼び出し、該当する口座の正確なaccount_idを特定します。

    4. 特定したaccount_idを用いてget_statementsを呼び出し、該当する報告書情報を取得します。


    取得した情報を基に、顧客へ必要な内容を提示してください。もし顧客が「明細の内容が正しくない」と主張される場合は、独断で判断せず、速やかに専門の運用責任者またはコンプライアンス担当者へエスカレーションしてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: hoshimi_securities
- id: f56d4b2c-fa42-5ac4-8f49-f88c297337ac
  title: get_statements ツールリファレンス
  body: 'get_statementsは、指定された口座の取引明細や報告書を取得するためのツールです。エージェントはこのツールを呼び出すことで、顧客の資産変動履歴や税務上の情報を参照できます。


    【引数】

    - account_id: 明細を取得したい口座の固有識別子。get_accountsなどのツールを用いて特定してください。


    【効果】

    当該口座に関連する最新のステートメント（明細情報）が返されます。利用前に必ずverify_identityによる本人確認を完了させてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: hoshimi_securities
- id: b59d6aaa-30ac-5ea6-b3b9-1521a1bd8431
  title: set_alerts を使う場面
  body: '特定の株価に達した際や、入出金があった際に通知を希望される顧客に対し、アラート設定を行います。これにより、顧客はタイムリーな投資判断や口座管理が可能になります。


    1. 顧客から「フルネーム」と「生年月日」を確認し、verify_identityを呼び出して本人確認を行います。

    2. 通知を希望する条件（例：特定の銘柄が〇〇円になった時）と、通知先の連絡先を確認します。

    3. 顧客の「フルネーム」、「生年月日」、および「設定したいアラート条件と通知先」を用いてset_alertsを呼び出し、設定を保存します。


    設定完了後、どのような条件で通知が届くかを顧客に復唱し、承諾を得てください。設定の解除や変更を希望された場合も、同様に本人確認を行った上で本ツールを用いて対応してください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: hoshimi_securities
- id: f15c536c-b413-5f0f-8249-a8c43540d89a
  title: set_alerts ツールリファレンス
  body: 'set_alertsは、顧客の口座や市場動向に関する通知（アラート）を設定するためのツールです。エージェントが直接呼び出すことで、条件に基づいた自動通知を有効にします。


    【引数】

    - フルネーム: 本人確認済みの顧客の氏名

    - 生年月日: 本人確認済みの顧客の生年月日

    - アラート条件: 通知をトリガーする条件（価格、イベントなど）

    - 通知先: 通知を送信する連絡先情報


    【効果】

    指定された条件が満たされた際に、顧客へ通知が送信されるよう設定されます。実行前に必ずverify_identityを完了させてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: hoshimi_securities
- id: 1d4b4381-678c-5dbf-a71b-e31abe2cea68
  title: transfer_funds を使う場面
  body: '顧客が自身の保有する口座間、あるいは指定の外部口座へ資金を移動させたい場合に本手続きを行います。資金移動は資産管理の根幹に関わるため、厳格な本人確認が必要です。


    1. 顧客から「フルネーム」と「生年月日」を確認し、verify_identityを呼び出して本人確認を行います。

    2. 送金元の口座（下4桁）および送金先の詳細、移動させる金額を確認します。

    3. get_accountsを呼び出し、送金元口座の正確なaccount_idを特定します。

    4. 特定したaccount_id、送金先情報、および金額を用いてtransfer_fundsを呼び出し、資金移動を実行します。


    手続き完了後、移動した金額と送金先を顧客に伝え、正しく処理されたことを報告してください。高額な送金や、不自然な送金先への移動が疑われる場合は、不正利用防止の観点から、直ちにコンプライアンス担当者へエスカレーションしてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: hoshimi_securities
- id: a0b80a25-bc36-5424-b52a-67945cf2bfee
  title: transfer_funds ツールリファレンス
  body: 'このツールは、お客様の口座間における資金の移動（振替）を直接実行します。エージェントはこのツールを呼び出すことで、外部サイトへ誘導することなく手続きを完結させます。


    【引数】

    ・from_account_id: 資金を移動させる元の口座ID

    ・to_account_id: 資金の移動先となる口座ID

    ・amount: 移動させる金額（数値）


    【動作】

    指定された口座から指定された金額を差し引き、移動先口座へ即時に加算します。


    ※本ツールの実行前には、必ず `verify_identity` による本人確認が完了している必要があります。本ツール自体の引数にPINや認証コードなどの機密情報は含まれません。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: hoshimi_securities
- id: 30ca5b19-4d2e-52b8-b054-b9f131323367
  title: cancel_order を使う場面
  body: 'お客様から、既に出した注文（指値注文などの未約定注文）の取り消し依頼を受けた場合に本手続きを行います。約定済みの注文を取り消すことはできませんので、あらかじめご了承ください。


    【対応手順】


    1. 本人確認の実施

    `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合します。必要に応じて口座番号の下4桁を併せて確認してください。


    2. 対象注文の特定

    お客様が取り消したい注文を特定します。注文番号（order_id）がお分かりでない場合は、`get_order_status` を呼び出して現在の注文一覧を取得し、銘柄名や数量から該当する
    `order_id` を特定してください。


    3. 注文の取り消し実行

    特定した `order_id` を引数として `cancel_order` を呼び出します。これにより、該当の注文が取り消されます。


    4. 完了報告

    取り消し手続きが正常に完了したことをお客様に丁寧にご案内ください。


    詳細なツールの仕様については、「cancel_order ツールリファレンス」をご参照ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: hoshimi_securities
- id: 861e254e-9629-51e4-8c2e-6ce4c07e9844
  title: cancel_order ツールリファレンス
  body: 'このツールは、指定された未約定の注文を1件取り消します。エージェントはこのツールを直接呼び出すことで、取り消し処理を完結させます。


    【引数】

    ・order_id: 取り消し対象となる注文の固有識別子。このIDは `get_order_status` ツールによって取得可能です。


    【動作】

    指定された `order_id` に対応する注文が「未約定」の状態であれば、その注文を取り消します。既に約定している場合はエラーとなり、取り消しは行われません。


    ※本ツールの実行前には、必ず `verify_identity` による本人確認が完了している必要があります。本ツール自体の引数に認証コードやパスワードなどの機密情報は要求されません。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: hoshimi_securities
- id: 6e64e868-483e-54b3-ab78-af43ef4a0981
  title: get_order_status を使う場面
  body: 'お客様から、現在の注文状況（約定したか、まだ待機中か）について問い合わせがあった場合や、注文を取り消すために必要な注文番号（order_id）を確認する場合に本手続きを行います。


    【対応手順】


    1. 本人確認の実施

    `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合し、本人確認を完了させてください。


    2. 注文状況の照会

    `get_order_status` を呼び出します。特定の注文についてのみ確認したい場合は `order_id` を指定し、全体を把握したい場合は引数なしで呼び出して注文一覧を取得してください。


    3. 情報の提供

    取得した結果に基づき、銘柄名、注文ステータス（約定済み、未約定など）をお客様に丁寧にご案内します。


    もしお客様がこの確認の後に注文の取り消しを希望された場合は、取得した `order_id` を用いて取り消し手続きへ進んでください。


    詳細なツールの仕様については、「get_order_status ツールリファレンス」をご参照ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: hoshimi_securities
- id: d4130ee2-6e50-5293-9796-fd080b1c736b
  title: get_order_status ツールリファレンス
  body: 'このツールは、お客様の口座における注文の状況を照会します。エージェントはこのツールを呼び出すことで、現在の注文一覧または特定の注文の詳細を取得します。


    【引数】

    ・order_id（任意）: 特定の注文のみを確認したい場合に指定します。指定しない場合は、現在有効または最近のすべての注文がリスト形式で返されます。


    【動作】

    指定された注文、または全注文について、以下の情報を返します：

    ・order_id（注文識別子）

    ・security（銘柄）

    ・status（注文ステータス：例として約定済み、未約定など）


    ※本ツールの実行前には、必ず `verify_identity` による本人確認が完了している必要があります。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: hoshimi_securities
