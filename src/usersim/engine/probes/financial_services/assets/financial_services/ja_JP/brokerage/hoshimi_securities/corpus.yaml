- id: 3fd54ccb-dc9d-5c16-99b0-e9c3e9fb976a
  title: 特定口座（源泉徴収あり）：損失の繰越控除ができる期間（年）について
  body: 'Q：特定口座で損失が出た場合、翌年以降の利益と相殺することはできますか？また、その期間はいつまでですか？


    A：はい、可能です。確定申告を行うことで、その年に発生した損失を最大3年まで繰り越し、翌年以降に得られた利益から差し引くことができます（繰越控除）。


    例えば、今年度に損失が出た場合、翌年、翌々年、その次の年までの3年間にわたって、利益との相殺が可能です。これにより、長期的な視点での税負担を軽減いただけます。具体的な手続きについては、税務署または税理士にご相談ください。当社では個別の税務相談は行っておりません。'
