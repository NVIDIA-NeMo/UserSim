- id: 3c6b2ed7-e37b-59f5-8813-8627e5228bea
  title: NISA（成長投資枠）：ご利用条件による違い
  body: '【サポートエージェント用：NISA（成長投資枠）利用条件一覧】


    | 条件項目 | 判定基準 | 結果 |

    | :--- | :--- | :--- |

    | 年齢 | 18歳以上 | 利用可能 |

    | 年齢 | 18歳未満 | 利用不可 |

    | 居住地 | 日本国内に居住 | 利用可能 |

    | 居住地 | 海外居住 | 利用不可 |

    | 口座状況 | 日本国内でNISA口座を未開設、または他社から変更申請済み | 利用可能 |

    | 口座状況 | 他社で既にNISA口座を開設中（変更手続きなし） | 利用不可 |

    | 本人確認 | フルネームおよび生年月日の照合完了 | 手続き進行可能 |

    | 本人確認 | 照合不一致 | 手続き停止（再確認が必要） |'
