- id: f193fa7d-43dd-5109-899e-e69d89c1fb14
  title: NISA（成長投資枠）：リスクについてのご説明
  body: 'NISA（成長投資枠）のご利用にあたり、以下の重要なリスクおよび免責事項について必ずご確認ください。


    【元本保証について】

    本制度で投資される株式や投資信託は、預金とは異なり元本が保証されておりません。相場変動により、投資元本を割り込む（損失が出る）可能性があります。相場変動による損失は、いかなる場合も補償の対象外となります。


    【資産の保全について】

    お客様からお預かりした資産は、法令に基づき当社の財産とは分けて管理する「分別管理」を行っております。万一、当社が破綻し資産が返還されない場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【適合性の原則】

    当社は、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しております。推奨商品の提示に際しても、適切であるかを確認した上で行います。


    【免責事項】

    当社は一般的な投資教育および商品情報の提供を行いますが、個別の税務相談や法的助言、および将来の利益の保証は一切行いません。


    契約の詳細な義務については「NISA（成長投資枠）：規定・約款」をご確認ください。'
