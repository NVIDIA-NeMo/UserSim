- id: 4f16bef3-afef-54b3-86db-d79f9451ef6f
  title: NISA（成長投資枠）：非課税保有限度額について
  body: 'Q：NISA（成長投資枠）で保有できる上限額はいくらですか？


    A：成長投資枠の非課税保有限度額は12,000,000円です。これは生涯で利用できる非課税枠の合計額（取得価額ベース）を指します。


    Q：保有している商品を売却した場合、枠は再利用できますか？


    A：はい、可能です。売却した商品の取得価額分だけ、翌年以降に非課税保有限度額の枠を再び利用いただけます。これにより、ライフステージに合わせた柔軟な資産の入れ替えが可能です。


    Q：つみたて投資枠の限度額とは別になりますか？


    A：はい、別枠です。NISA全体の非課税保有限度額は1,800万円ですが、そのうち成長投資枠として利用できるのは最大12,000,000円までとなります。


    詳細な商品概要は「NISA（成長投資枠）：商品概要」をご参照ください。'
