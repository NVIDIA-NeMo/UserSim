- id: 2a701abf-f1ee-5fa5-835d-839fa809f7c8
  title: NISA（つみたて投資枠）：プランの選び方
  body: 'NISAには「つみたて投資枠」と「成長投資枠」の2種類があり、目的によって使い分けが可能です。


    【NISA（つみたて投資枠）が向いている方】

    ・少額（最低100円から）でコツコツと長期的な資産形成を行いたい方

    ・手間をかけず、自動積立で非課税メリットを享受したい方

    ・年間1,200,000円までの範囲で、低リスクな投資信託を積み上げたい方


    【NISA（成長投資枠）が向いている方】

    ・個別株式や幅広い商品に柔軟に投資したい方

    ・つみたて投資枠とは別に、成長性の高い資産を保有したい方


    両枠は併用可能です。まずは「つみたて投資枠」で土台となる資産を形成し、余裕資金で「成長投資枠」を活用するプランが一般的です。詳細な比較は「NISA（つみたて投資枠）：当社の似た商品との比較」をご覧ください。'
