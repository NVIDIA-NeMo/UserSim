- id: 6685244d-a8f8-524b-950d-3e1c5a33dc60
  title: 米国株式の取引：お取引が拒否された・制限された
  body: "【症状】\n米国株式の注文を出そうとした際に、「取引が拒否されました」または「口座に制限がかかっています」という旨の通知が表示され、注文が完了できない。\n\
    \n【考えられる原因と確認事項】\n1. 証拠金（米ドル）の不足：\n   注文に必要な代金および取引手数料（約定代金の0.495%）を賄う十分な米ドル残高があるか確認してください。\n\
    2. 適合性確認の未完了または不適合：\n   米国株式取引に必要なリスク告知への同意や、知識・経験等の適合性確認が完了していない可能性があります。\n3.\
    \ 口座ステータスの制限：\n   マイナンバーの届出不足や、本人確認書類の有効期限切れなどにより、口座に制限がかかっている場合があります。\n\n【解決方法】\n\
    - 不足金がある場合は、日本円から米ドルへの為替交換（1米ドルあたり25銭の手数料が発生します）を行い、残高を補充してください。\n- 適合性確認が未完了の方は、改めてリスク告知の内容を確認し、同意手続きを行ってください。\n\
    \n【エスカレーション】\n上記を確認しても解決しない場合や、具体的な制限理由が不明な場合は、弊社で社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、詳細を調査いたします。調査結果は、後ほど改めてお客さまへご連絡いたします。"
