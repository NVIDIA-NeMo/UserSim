- id: 80cade76-e12a-5de0-9322-c909f7468fc3
  title: NISA（つみたて投資枠）：当社の似た商品との比較
  body: 'NISA（つみたて投資枠）と、当社の他の口座・枠との違いを比較します。


    | 比較項目 | NISA（つみたて投資枠） | NISA（成長投資枠） | 特定口座（源泉徴収あり） |

    | :--- | :--- | :--- | :--- |

    | **目的** | 長期・積立・分散投資 | 幅広い商品への柔軟な投資 | 利便性の高い課税運用 |

    | **税制** | 運用益が非課税 | 運用益が非課税 | 20.315%の課税 |

    | **年間投資枠** | 1,200,000円 | 2,400,000円 | 制限なし |

    | **投資手法** | 定期的な積立のみ | 積立および一括購入 | 自由な売買 |

    | **最低金額** | 100円から | 商品により異なる | 商品により異なる |


    【どちらを選ぶべきか】

    ・「NISA（つみたて投資枠）」は、少額からコツコツと老後資金や教育資金を準備したい方に最適です。

    ・「NISA（成長投資枠）」は、個別株などより積極的な運用で利益を狙いたい方に適しています。

    ・「特定口座（源泉徴収あり）」は、非課税枠を使い切った後や、確定申告の手間を省いて運用したい方向けです。'
