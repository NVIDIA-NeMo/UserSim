- id: 62bc37e4-3500-527d-9388-bd106bca9e24
  title: deposit_funds を使う場面
  body: 'お客様が提携金融機関の口座から星見証券の証券総合口座へ、即時に入金することを希望される場合にこの手続きを行います。以下の手順に従って操作してください。


    1. 本人確認を実施します。お客様から「フルネーム」と「生年月日」を確認し、verify_identity を呼び出して照合してください。

    2. 対象となる口座を特定します。お客様から口座番号の下4桁を伺い、get_accounts を呼び出して、該当する口座の account_id を取得してください。

    3. 入金処理を実行します。取得した account_id と、お客様が希望される入金金額を指定して deposit_funds を呼び出します。


    本手続きにより、提携金融機関から証券口座への即時入金が完了します。入金後の残高確認を希望される場合は、別途残高照会をご案内ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: hoshimi_securities
- id: 3dea2034-b43c-5ab3-9b1b-fd334583c5e2
  title: deposit_funds ツールリファレンス
  body: 'このツールは、提携金融機関の口座から証券総合口座へ即時入金を行うために使用します。エージェントはこのツールを直接呼び出すことで入金処理を完結させます。


    【引数】

    ・account_id：入金先となる証券口座の識別子（get_accounts 等で取得します）

    ・amount：入金する金額（例：10,000円）


    【効果】

    指定された口座に、提携金融機関から即時に資金が振り込まれます。本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
