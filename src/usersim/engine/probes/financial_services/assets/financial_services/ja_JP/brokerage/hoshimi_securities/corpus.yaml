- id: 06575fba-e9a9-5a00-a078-16da8bd6dc38
  title: NISA（成長投資枠）：お取引が拒否された・制限された
  body: 'NISA（成長投資枠）での注文時に、取引が拒否されたり制限がかかったりする場合の確認事項をご案内します。


    【考えられる原因と確認事項】

    1. 年間投資枠の超過

    本年既に2,400,000円の年間投資枠を使い切っていないかご確認ください。枠を超えた注文は、NISA口座では受け付けられません。


    2. 非課税保有限度額の超過

    非課税保有限度額の12,000,000円に達していないかご確認ください。保有額が上限に達している場合、新規の買い付けは制限されます。


    3. 適合性の原則による制限

    お客さまの知識、経験、投資目的に照らし、特定の商品が不適当であると判断された場合、お取引を制限させていただくことがございます。


    【解決策】

    ・枠の超過が原因の場合：翌年の枠更新を待つか、特定口座での取引をご検討ください。なお、商品の売却による枠の再利用は翌年以降に適用されます。

    ・適合性に関する制限の場合：改めて投資目的やリスク許容度についてご確認させていただきますので、当社担当者へご相談ください。


    【エスカレーション】

    上記を確認しても原因が不明な場合、または制限の解除を希望される場合は、社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、詳細な調査を行います。'
