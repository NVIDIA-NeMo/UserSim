- id: a72dbf7c-00d1-5a4c-90b2-4917a4b9db4a
  title: NISA（つみたて投資枠）：明細や記録と合わない
  body: '【症状】

    「利用したはずの投資金額が、明細上の非課税枠利用額と一致しない」という状況。


    【考えられる原因と確認事項】

    1. 約定日と受渡日のズレ：投資信託などの商品は、注文を出した日（約定日）と、実際に資産が確定し受渡される日にタイムラグがあります。明細上の反映タイミングを確認してください。

    2. 取得価額による計算：非課税保有限度額（18,000,000円）の計算は、時価ではなく「取得価額（買い付け時の金額）」に基づいています。現在の評価額と混同していないか確認してください。

    3. 他社からの乗り換え：年単位で金融機関を変更された場合、前金融機関での利用枠が反映されるまで時間を要することがあります。


    【解決策】

    ・約定日ベースの履歴と受渡日ベースの明細を照合し、不整合がないかを確認します。


    【エスカレーション】

    計算根拠が不明確である、または明らかなシステム不備が疑われる場合は、専門の運用責任者へエスカレーションし、詳細な取引ログの精査を行います。結果については、調査完了後、速やかにお客様へ報告いたします。'
