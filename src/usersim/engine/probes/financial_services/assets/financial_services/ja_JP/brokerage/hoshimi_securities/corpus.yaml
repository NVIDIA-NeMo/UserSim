- id: f85ed8b6-36c5-5469-b12f-d1d9fc1f51cb
  title: 特定口座（源泉徴収あり）：この商品をかたる詐欺にご注意ください
  body: '星見証券では、お客様の資産を守るため、特定口座（源泉徴収あり）を悪用した詐欺への注意喚起を行っております。


    【想定される詐欺の手口】

    「特定口座を利用すれば、特別な運用方法で税金が完全に免除される」「元本を保証したまま、20.315%の税金を回避できる裏技がある」といった、不自然な利益や税制上のメリットを強調する勧誘にご注意ください。金融商品取引法に基づき、正当な手続きなしに税金を回避することはできず、また当社の運用において利益を保証することはございません。


    【当社の確認事項について】

    星見証券では、口座情報の変更など重要な手続きを行う前に、必ずお客様の「フルネーム」と「生年月日」の照合による本人確認を実施いたします。それ以外の認証ステップや、以下のような機密情報の要求は一切ございません。

    ・暗証番号（PIN）やパスワードの提示

    ・クレジットカードのセキュリティコード

    ・ワンタイムパスワードや認証コードの口頭伝達


    【異常を感じた場合】

    不審な連絡を受けた場合や、心当たりのない取引通知が届いた場合は、速やかに当社へお知らせください。迅速に調査プロセスを提示し、誠実に対応いたします。'
