- id: 6b29a1be-0074-529f-94cf-d28ec368dfa7
  title: NISA（成長投資枠）：手数料と費用
  body: 'Q：NISA（成長投資枠）で国内株式を取引する場合、手数料はかかりますか？


    A：いいえ、星見証券では国内株式の売買手数料を0円としております。投資への心理的・経済的ハードルを最小限に抑え、お客さまの長期的な資産成長を支援いたします。


    Q：海外取引などの手数料はどうなっていますか？


    A：海外取引等の手数料は、適正なインフラ維持と規制遵守のためのコストとして設定しております。詳細な料金体系については、当社の手数料案内をご確認ください。'
