- id: a71f7d61-84b2-59c1-86ff-c31cd909e8db
  title: 投資信託の積立：リスクについてのご説明
  body: '「投資信託の積立」をご利用いただく前に、以下のリスクについて十分にご確認ください。


    【元本保証について】

    本商品（投資信託）は、預金とは異なり元本が保証されておりません。運用実績によっては、投資した金額を下回る（元本を割り込む）可能性があります。


    【価格変動リスク】

    投資信託の基準価額は、組み入れられている株式や債券などの資産価格の変動により、日々変動します。相場の変動により損失が生じた場合、その損失はすべてお客様に帰属し、当社は補償いたしません。


    【適合性の原則】

    当社は、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しております。お客様のご意向に沿った適切な商品選びを支援しますが、最終的な投資判断はお客様ご自身で行っていただきます。


    【注意点】

    ・個別的な税務相談および法的助言は行いません。

    ・将来の運用成果について、利益を保証することはございません。

    ・顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、これは相場変動による損失をカバーするものではありません。'
