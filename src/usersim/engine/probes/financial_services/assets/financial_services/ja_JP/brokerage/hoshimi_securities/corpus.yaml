- id: 01b90086-7960-5a78-aeae-6fe8eb55094a
  title: iDeCo（個人型確定拠出年金）：毎月の手数料（2026年12月分から）について
  body: '【Q】iDeCoを運用し続ける際、毎月いくらの手数料がかかりますか？


    A. 2026年12月分から、毎月の手数料として186円がかかります。この手数料は、制度の運営に関わるコストとして発生いたします。


    【Q】星見証券に支払う管理手数料は別途ありますか？


    A. いいえ。星見証券の運営管理機関手数料は0円です。お客様に負担をお願いしているのは、前述の制度運営に関わる手数料のみとなります。


    【Q】手数料はどのように支払われますか？


    A. 原則として、iDeCo口座内の資産から差し引かれます。


    詳細な費用体系については、iDeCo（個人型確定拠出年金）：手数料一覧をご確認ください。'
