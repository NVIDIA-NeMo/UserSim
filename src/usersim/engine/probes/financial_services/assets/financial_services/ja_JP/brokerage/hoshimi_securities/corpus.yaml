- id: e0edaecb-9383-50ea-a086-472d217af39b
  title: NISA（つみたて投資枠）：登録内容の変更
  body: 'NISA（つみたて投資枠）の積立金額や出金先口座などの登録内容を変更する手順をご案内します。


    【事前準備】

    お手元に口座番号がわかる書類をご用意ください。


    【変更手順】

    1. 本人確認の実施

    オペレーターに「登録内容の変更をしたい」旨を伝えてください。その後、ご自身の「フルネーム」と「生年月日」を伝え、本人確認を完了させます。


    2. 変更箇所の指定

    変更したい項目（例：毎月の積立金額を5,000円から10,000円に変更したい、など）を伝えてください。なお、積立金額を変更する場合、年間の合計額が年間投資枠の1,200,000円を超えない範囲で指定する必要があります。


    3. 内容の照合と確定

    オペレーターから変更後の内容について復唱説明があります。内容に間違いがないかを確認し、確定の意思を伝えてください。


    4. 完了通知の受領

    手続きが完了すると、デジタルチャネルを通じて変更完了の通知が届きます。この通知をもって、次回の積立分から変更内容が適用されます。


    ※非課税保有限度額（18,000,000円）の変更は制度上の制限があるため、個別の相談が必要です。詳細は「NISA（つみたて投資枠）：非課税保有限度額について」をご参照ください。'
