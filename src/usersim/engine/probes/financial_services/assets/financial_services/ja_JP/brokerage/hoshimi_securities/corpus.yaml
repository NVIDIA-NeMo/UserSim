- id: e35d57b4-da4f-50ff-8d70-3d42b690c6ad
  title: 投資信託の積立：商品概要
  body: '星見証券の「投資信託の積立」は、少額からコツコツと長期的な資産形成を目指すお客様に最適なデジタル完結型のサービスです。一度の設定で、定期的・自動的に投資信託を買い付けることができ、時間と手間をかけずに分散投資を実践いただけます。


    【本サービスの特徴と仕様】

    ■積立の最低金額：100円

    非常に低いハードルで投資を開始でき、どなたでも無理なく資産形成に取り組んでいただけます。


    ■クレジットカード積立

    効率的な資産形成を支援するため、クレジットカードでの決済に対応しています。

    ・クレジットカード積立の上限（月額）：100,000円

    ・クレジットカード積立のポイント還元率：0.5%


    【運用の考え方】

    当社の「投資への心理的・経済的ハードルを最小限に抑える」という方針に基づき、透明性の高い手数料体系を提供しています。また、本サービスを「NISA（つみたて投資枠）」と併せてご利用いただくことで、運用益が非課税となる税制優遇を最大限に活用することが可能です。


    【リスクについて】

    投資信託は元本が保証されておりません。相場変動により、投資した金額を下回るリスクがあることをあらかじめご了承ください。詳細については「投資信託の積立：重要事項のご説明」をご参照ください。'
