- id: 2fabc477-3110-542a-a969-01ec97a49feb
  title: NISA（成長投資枠）：金利・料率の決まり方と適用
  body: 'NISA（成長投資枠）における手数料および料率の適用ルールについて案内します。サポート担当者は、顧客へ提示する金額の根拠として本内容を用いてください。


    【国内株式の売買手数料】

    ・適用料率：0円

    ・適用条件：NISA（成長投資枠）口座を利用した国内株式の売買すべてに適用されます。取引金額の多寡にかかわらず、一律で0円となります。


    【海外取引の手数料】

    海外株式等の取引については、適正なインフラ維持および規制遵守のためのコストとして、別途設定された手数料が適用されます。適用される具体的な料率は、取引商品ごとの最新の料金表に基づきます。


    【非課税率】

    ・適用率：0%（非課税）

    ・適用範囲：本枠内で得られた譲渡益および配当金に適用されます。通常、上場株式等の譲渡益と配当には20.315%の税金がかかりますが、本枠での保有分についてはこれが免除されます。


    全体的な手数料体系については「NISA（成長投資枠）：手数料一覧」をご参照ください。'
