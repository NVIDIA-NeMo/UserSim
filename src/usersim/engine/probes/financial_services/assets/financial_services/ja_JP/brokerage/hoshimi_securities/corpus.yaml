- id: d7a511ed-9c00-5663-9050-1a9d74f2bc94
  title: NISA（成長投資枠）：よくあるお手続きの流れ
  body: 'NISA（成長投資枠）をご利用開始いただくまでの標準的な流れをご案内いたします。当社のサービスはデジタル完結型となっており、迅速な手続きが可能です。


    【お手続きの流れ】

    1. 口座開設の申込み

    まず、マイナンバーカード等の必要書類をご用意の上、口座開設をお申込みください。


    2. 本人確認と口座審査

    当社にてご提出書類の確認を行います。重要事項の変更や確認が必要な場合は、お客さまの「フルネーム」と「生年月日」による照合を行い、安全に手続きを進行いたします。


    3. NISA口座の選択と設定

    NISA（成長投資枠）の利用設定を行います。これにより、年間投資枠2,400,000円、非課税保有限度額12,000,000円の枠が適用されます。


    4. 運用資金の入金と取引開始

    ご自身の口座に資金を入金し、国内株式（売買手数料0円）などの商品を購入してください。


    【完了の確認】

    取引完了後、注文履歴に「NISA（成長投資枠）」として反映されていることをご確認ください。国内株式の場合、受渡しは約定日の2営業日後となります。'
