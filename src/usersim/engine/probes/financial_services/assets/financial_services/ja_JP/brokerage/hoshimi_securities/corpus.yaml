- id: 118b4859-a5d7-56e2-b617-d50f1fd6f72c
  title: NISA（成長投資枠）：ご利用開始までの手順
  body: '【サポートエージェント向け：NISA（成長投資枠）開設フロー】


    お客様がNISA（成長投資枠）の利用を開始するまでの標準的な手順は以下の通りです。適合性の原則に基づき、お客様の知識、経験、目的に照らして適切であるかを確認しながら進めてください。


    1. 本人確認の実施

    お客様から「フルネーム」と「生年月日」を伺い、登録情報と照合します。これにより、口座手続きの権限を確認します。


    2. NISA口座開設の申請

    デジタルチャネルを通じて、NISA（成長投資枠）の開設申請を案内します。マイナンバーの届出が未完了の場合は、先に届出を完了していただく必要があります。


    3. 税務署による審査

    申請後、税務署による開設審査が行われます。審査完了までには数営業日を要することを案内してください。


    4. 利用可能状態の通知

    審査が完了し、口座が有効になるとお客様へ通知されます。この時点で、年間投資枠2,400,000円および非課税保有限度額12,000,000円の枠が利用可能になります。


    5. 初回取引の案内

    国内株式の売買手数料0円であることを伝え、投資を開始していただくよう案内します。


    ※複雑な案件や重要事項については、社内のコンプライアンス担当または運用責任者へエスカレーションしてください。'
