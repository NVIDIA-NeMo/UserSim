- id: 4fb17197-8742-5438-8659-9d514b175655
  title: 投資信託の積立：重要事項のご説明
  body: '本サービスをご利用いただくにあたり、以下の重要事項を必ずご確認ください。


    【適合性の原則について】

    星見証券は、金融商品取引法に基づき「適合性の原則」を徹底しております。お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘は行いません。推奨商品の提示を行う際は、これらが適切であるかを確認した上で行います。


    【資産の保護と補償】

    ・分別管理：お客様からお預かりした金銭および有価証券は、当社の財産と分けて厳格に管理（分別管理）しております。

    ・投資者保護基金：万一、当社が破綻し資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【リスク告知】

    ・元本保証の不在：本サービスで取り扱う投資信託は元本が保証されておりません。相場変動による損失は、上記投資者保護基金の補償対象外となります。


    【免責事項】

    ・個別の助言の禁止：一般的な投資教育および商品情報の提供は行いますが、個別の税務相談、法的助言、および将来の運用利益の保証は一切行いません。

    ・紛争解決：解決に至らない苦情や紛争については、証券・金融商品あっせん相談センター（FINMAC）をご案内いたします。'
