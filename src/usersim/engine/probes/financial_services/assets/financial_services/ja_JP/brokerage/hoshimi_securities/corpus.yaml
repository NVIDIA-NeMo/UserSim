- id: 8c8fccbd-34be-52c3-8cc9-3fdc09d058c7
  title: 投資信託の積立：状況・履歴の確認
  body: '積立投資の現在の状況や、過去の取引履歴を確認する手順をご案内します。


    【事前準備】

    お手元に口座番号をご用意ください。


    【確認手順】

    1. 担当者に「積立投資の状況と履歴を確認したい」とお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」をお伺いします。照合が完了するまでお待ちください。

    3. 確認したい積立商品名、または期間を指定してください。

    4. 担当者が、現在の積立設定金額、直近の積立実行日、および累計の投資金額を回答いたします。


    【完了の確認】

    提示された金額が、ご自身の認識している積立金額と一致しているかをご確認ください。もし内容に相違がある場合は、その場ですぐに担当者へお知らせください。


    明細の内容に疑問がある場合は、「投資信託の積立：明細や記録と合わない」をご参照ください。'
