- id: a8e4d71c-8884-5ee7-b8ff-1e0e5fc27346
  title: NISA（成長投資枠）：当社の似た商品との比較
  body: 'NISA（成長投資枠）と、併用可能なNISA（つみたて投資枠）の比較です。


    | 比較項目 | NISA（成長投資枠） | NISA（つみたて投資枠） |

    | :--- | :--- | :--- |

    | 年間投資枠 | 2,400,000円 | 1,200,000円 |

    | 非課税保有限度額 | 12,000,000円 | 6,000,000円（合計1,800万円の内訳） |

    | 投資対象 | 株式、投資信託など幅広く柔軟に | 長期積立・分散投資に適した限定的な投資信託 |

    | 主な目的 | 積極的な資産成長、個別株投資 | 少額からのコツコツとした資産形成 |

    | 手数料（国内株） | 0円 | N/A（個別株不可） |


    【どちらが適しているか】

    ・NISA（成長投資枠）：特定の企業の成長に投資したい方や、柔軟にポートフォリオを構築したい方向けです。

    ・NISA（つみたて投資枠）：リスクを抑え、長期的に安定した資産形成を目指したい方向けです。


    詳細は「NISA（つみたて投資枠）：商品概要」もあわせてご覧ください。'
