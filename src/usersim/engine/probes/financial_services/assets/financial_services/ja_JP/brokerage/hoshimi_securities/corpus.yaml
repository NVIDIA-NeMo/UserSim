- id: 9a42bde9-dec0-5656-9d07-fe251a3a58aa
  title: NISA（つみたて投資枠）：お手続きが完了しない・保留中のまま
  body: 'NISA（つみたて投資枠）のお申込み手続きが「保留中」のまま完了しない場合、以下の原因が考えられます。


    【考えられる原因と確認事項】

    1. 本人確認情報の不一致

    お客様から伺った「フルネーム」または「生年月日」が、登録情報と一致していない場合がございます。改めて正確な情報をお伝えください。


    2. マイナンバー書類の不備

    提出いただいた書類の画像が不鮮明であるか、記載内容に不備がある場合、税務署の審査で保留となることがあります。書類の再提出が必要か、現在の状況を確認いたします。


    3. 重複口座の存在

    NISA口座は、1人につき1つの金融機関でしか開設できません。他社で既に口座をお持ちの場合、金融機関変更の手続きが必要となります。


    【解決策】

    ・情報の再確認：正しい「フルネーム」と「生年月日」を改めてご提示ください。

    ・書類の再提出：不備がある箇所を特定し、改めて鮮明な画像を提出してください。


    【エスカレーションについて】

    上記を確認しても解決しない複雑な案件や、税務署からの回答待ちで長期間保留となっている場合は、社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、詳細な調査を行います。調査結果については、改めてお客様にご連絡いたします。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
