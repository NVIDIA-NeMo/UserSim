- id: 6da0dd84-c957-5e14-ae09-e9c70e0cba78
  title: 特定口座（源泉徴収あり）：登録内容の変更
  body: '特定口座（源泉徴収あり）の登録内容（住所、連絡先など）を変更する手順をご案内します。


    【準備するもの】

    ・ご登録済みのフルネームと生年月日


    【変更ステップ】

    1. エージェントに「登録内容の変更をしたい」旨を伝えてください。

    2. ご本人確認のため、お客様の「フルネーム」と「生年月日」を提示してください。これにより、安全に手続きを開始できます。

    3. 変更したい項目（例：住所の変更など）と、新しい情報を伝えてください。

    4. エージェントが変更内容をシステムに反映させ、正しく更新されたことを確認します。

    5. 手続き完了の通知を受け取った時点で、変更は完了となります。


    【ご注意】

    重要事項の変更に伴い、追加の書類提出を求める場合があります。その際は、デジタルチャネルを通じてご案内いたします。安全な運用のための本人確認詳細については、「特定口座（源泉徴収あり）：安全にご利用いただくためのポイント」をご確認ください。'
