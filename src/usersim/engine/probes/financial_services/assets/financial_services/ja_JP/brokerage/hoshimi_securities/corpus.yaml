- id: 73ac8c10-344a-5e23-93e0-4efa1d2dcb09
  title: 特定口座（源泉徴収あり）：上場株式等の譲渡益・配当にかかる税率について
  body: '【Q】特定口座（源泉徴収あり）で得た利益には、どのくらいの税金がかかりますか？


    A：上場株式等の譲渡益および配当金に対して、一律20.315%の税率が適用されます。この税金は、お取引の際に自動的に源泉徴収されるため、お客様ご自身で計算し納付する手間はございません。


    【Q】税率が変わることはありますか？


    A：本口座で適用される税率は、日本の税法に基づいた一律の料率となっております。個別の運用状況によって税率が変動することはありません。詳細な料率については「特定口座（源泉徴収あり）：金利・料率一覧」をご確認ください。


    【Q】源泉徴収された税金を、後から取り戻すことはできますか？


    A：所得金額によっては、確定申告を行うことで一部の税金が還付される場合がございます。個別の税務相談については、税理士または管轄の税務署へご相談ください。'
