  product_category: tokutei_koza
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 432ec43b-05e1-5a66-9777-099c5e6d0ac6
  title: 特定口座（源泉徴収あり）：切替えや上位プランを検討するとき
  body: '特定口座（源泉徴収あり）から、NISAなどの非課税制度への切り替えや併用を検討される際の比較ポイントをご案内します。


    【比較の軸】

    ・税制面：特定口座（源泉徴収あり）では利益に20.315%の税金がかかりますが、NISAでは利益が非課税となります。

    ・手続きの簡便さ：特定口座（源泉徴収あり）は自動的に税金が計算されるため確定申告が原則不要です。NISAも同様に非課税管理されますが、年間投資枠（つみたて投資枠120万円、成長投資枠240万円）という制限があります。

    ・損失の扱い：特定口座では、損失を3年まで繰り越して将来の利益と相殺できますが、NISAでは損失の繰越控除はできません。


    【おすすめの使い分け】

    ・NISA：長期的な資産形成を目的とし、非課税のメリットを最大化したい方に向いています。

    ・特定口座（源泉徴収あり）：NISAの枠を超えて投資したい方や、確定申告の手間を避けつつ、損失の繰越控除を利用して税負担を最適化したい方に向いています。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 96e0d760-305c-5f79-92a7-a3c5d85cffd6
  title: 特定口座（源泉徴収あり）：ほかの選択肢との比較と向かない場合
  body: '特定口座（源泉徴収あり）を検討される際、他の口座タイプと比較してどちらが適しているかをご案内します。


    【他口座との比較】

    ・NISA口座：最大の特徴は「非課税」であることです。特定口座では20.315%の税金がかかりますが、NISAではこれが0円となります。ただし、NISAには年間の投資枠や非課税保有限度額（最大1,800万円）という制限があります。

    ・特定口座（源泉徴収なし）：ご自身で確定申告を行う必要があります。本口座（源泉徴収あり）は、税金計算を当社が代行し、自動的に納付するため、手間を最小限に抑えたい方に最適です。


    【本口座が向いている方】

    ・確定申告の手間を省き、効率的に取引を行いたい方

    ・NISAの非課税枠を使い切り、さらに追加で投資を行いたい方

    ・損失が出た場合に、確定申告を通じて3年間の繰越控除を受けたい方


    【本口座が向かない方】

    ・少額からの投資で、まずは完全な非課税メリットを享受したい方（まずはNISA口座の検討をお勧めします）

    ・税金計算をすべて自分で行い、詳細に管理したい方'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: b16ece89-69c8-5562-83b7-7247a10359fa
  title: 特定口座（源泉徴収あり）：お申込みとご利用条件
  body: '特定口座（源泉徴収あり）の開設条件について、よくあるご質問にお答えします。


    Q：口座開設に特別な条件はありますか？

    A：基本的にはどなたでもお申し込みいただけます。ただし、金融商品取引法に基づき「適合性の原則」を確認させていただきます。お客様の知識や経験、投資目的に照らして適切な商品提供を行うため、事前のアンケート等への回答をお願いしております。


    Q：手続きに必要な書類は何ですか？

    A：税法に基づき、マイナンバーの届出が必須となります。本人確認書類とともに、マイナンバーを確認できる書類をご提示ください。


    Q：すでに他の口座を持っている場合、後から「源泉徴収あり」に変更できますか？

    A：はい、お手続きにより変更可能です。変更後の適用タイミングについては、個別にご案内いたします。'
