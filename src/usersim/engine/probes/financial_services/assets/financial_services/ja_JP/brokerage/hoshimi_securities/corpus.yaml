- id: f8333531-6515-546b-8ba3-c5cbf6c3534b
  title: 米国株式の取引：限度額・制限と注意事項
  body: '本サービスをご案内する際は、以下の制限事項および注意事項を徹底してください。


    【適合性の原則と制限】

    金融商品取引法に基づき、お客さまの知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底します。お客さまがリスクを十分に理解していない場合、または投資目的に照らして不適切と判断される場合は、お取引を制限することがあります。


    【資産管理と補償】

    お客さまからお預かりした資産は、弊社の財産と分けて管理する「分別管理」を実施しております。万一、弊社が破綻して資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償の対象外であることを明確に告知してください。


    【取引上の注意事項】

    ・米国株式は米ドル建ての商品であり、為替変動リスクを伴います。

    ・取引手数料として約定代金の0.495%（上限22米ドル）および為替手数料（1米ドルあたり25銭）が発生します。

    ・米国市場の取引時間および現地の祝日に準じます。

    ・元本は保証されず、投資した金額を割り込む可能性があります。'
