- id: 5de8e047-3641-5a34-9121-92adb0d2c2bf
  title: NISA（つみたて投資枠）：積立の最低金額について
  body: 'Q. NISA（つみたて投資枠）で積立を始める際、最低いくらから設定できますか？

    A. 積立の最低金額は100円からとなっております。少額から無理なく資産形成を始めていただけます。


    Q. 積立金額の上限はありますか？

    A. 年間の投資枠が1,200,000円までとなっております。この範囲内で、ご自身の予算に合わせて月々の積立額を柔軟にご設定いただけます。


    Q. 設定した最低金額を後から変更することは可能ですか？

    A. はい、可能です。いつでも変更いただけますので、余裕がある時に積立額を増やすなどの調整を行ってください。詳細な変更手順は「NISA（つみたて投資枠）：登録内容の変更」をご確認ください。'
