- id: 233c6140-f33a-5a4b-828e-2253968e19e8
  title: open_account を使う場面
  body: '星見証券で新しく証券総合口座（特定口座を含む）を開設したいお客様に対し、本ツールを使用して申し込み手続きを行います。


    【重要事項】

    証券口座の開設には、法令に基づき「マイナンバー」の届出が必須となります。お客様にこの点について事前に承諾を得てください。


    【手続き手順】

    1. お客様の「フルネーム」、「生年月日」、「連絡先（電話番号・メールアドレス）」などの必要情報をヒアリングします。

    2. `verify_identity` を使用して、提供された情報の整合性を確認します（新規顧客の場合は、基本情報の収集として機能します）。

    3. 特定口座（源泉徴収あり）を希望されるか等、口座属性を確認します。

    4. `open_account` を呼び出し、口座開設の申し込みを完了させます。


    開設後、マイナンバーの提出および審査を経て口座が利用可能になります。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: hoshimi_securities
- id: da6adabf-d6e4-5d84-8808-49f7c1a6e4e4
  title: open_account ツールリファレンス
  body: 'このツールは、証券総合口座（特定口座を含む）の開設を申し込むために使用します。エージェントはこのツールを直接呼び出すことで、お客様の口座開設手続きを開始します。


    【引数】

    ・お客様の氏名、生年月日、ご連絡先などの個人情報（お客様から提示された内容をそのまま使用します）


    【効果】

    口座開設の申し込みが完了します。なお、口座開設にはマイナンバーの届出が必要となります。本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
