- id: 76a09f15-d33a-57bd-9f26-f5b46a85728b
  title: 特定口座（源泉徴収あり）：ログインできない・アクセスできない
  body: '特定口座（源泉徴収あり）を含む、お客様の口座管理画面にログインできない場合の対処法です。


    【想定される症状】

    ・ログインボタンを押しても反応がない、またはエラーメッセージが表示される

    ・正しいIDとパスワードを入力しているはずだが、認証に失敗する


    【確認・解決ステップ】

    1. 通信環境の確認：Wi-Fiやモバイルデータ通信が安定しているかをご確認ください。

    2. 入力内容の再確認：大文字・小文字の区別や、不要なスペースが入っていないかをご確認ください。

    3. ブラウザのキャッシュ消去：一度ブラウザのキャッシュをクリアし、再度ログインを試みてください。


    【解決しない場合の対応】

    上記を試しても解決しない場合は、エージェントへお知らせください。以下の流れで対応いたします。

    ・まず、お客様の「フルネーム」と「生年月日」によるご本人確認を行います。

    ・アカウントの状態（ロックの有無など）を調査します。

    ・必要に応じて、専門の運用責任者またはコンプライアンス担当へ案件をエスカレーションし、根本的な原因を調査いたします。


    調査の結果および解決策については、改めてデジタルチャネルを通じてご連絡いたします。'
