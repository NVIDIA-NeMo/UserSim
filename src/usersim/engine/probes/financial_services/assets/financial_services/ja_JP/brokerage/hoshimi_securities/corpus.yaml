- id: 56f2c6e8-18a8-5341-a048-62f4d1e349c1
  title: NISA（成長投資枠）：規定・約款
  body: '本規定は、星見証券が提供するNISA（成長投資枠）の利用条件を定めるものです。サポート担当者は、顧客への案内時に本規定を遵守してください。


    1. 投資枠の制限

    NISA（成長投資枠）における年間の投資限度額は2,400,000円とし、非課税保有限度額（生涯投資枠）は12,000,000円とします。これらの限度額は、取得価額ベースで計算されます。


    2. 手数料の適用

    国内株式の売買手数料は0円として適用されます。その他の海外取引等の手数料については、別途定める適正なインフラ維持コストに基づき設定されます。


    3. 適合性の原則

    当社は金融商品取引法に基づき、顧客の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底します。


    4. 資産の管理と補償

    顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外となります。


    5. 契約の終了および変更

    顧客は年単位でNISA口座を開設する金融機関を変更することが可能です。また、規定の変更がある場合は、当社より事前にお知らせいたします。


    具体的な料率の適用については「NISA（成長投資枠）：金利・料率の決まり方と適用」を参照してください。'
