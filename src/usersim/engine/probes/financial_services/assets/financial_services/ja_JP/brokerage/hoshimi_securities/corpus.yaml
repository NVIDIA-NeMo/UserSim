- id: aa497bd3-de8e-5306-8ddb-603175100a7c
  title: change_ideco_contribution を使う場面
  body: 'お客様がiDeCoの月々の掛金額を変更したい場合に、本ツールを使用します。


    【重要な制約】

    iDeCoの掛金変更は、原則として年1回までしか行えない点をお客様に必ずお伝えください。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合して本人確認を行います。

    2. `get_accounts` を使用し、対象となるiDeCo口座の `account_id` を特定します。

    3. 変更後の月々の掛金額を確認します。なお、2026年12月分の掛金から拠出限度額が引き上げられる点（会社員は最大62,000円、自営業者は最大75,000円）に留意し、限度額内であるかを確認してください。

    4. `change_ideco_contribution` を呼び出して金額変更を申請します。


    詳細は、「iDeCo（個人型確定拠出年金）：登録内容の変更」をご参照ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_ideco_contribution
  institution_id: hoshimi_securities
- id: af0b4704-e22a-5059-bc6e-675a027186c3
  title: change_ideco_contribution ツールリファレンス
  body: 'このツールは、iDeCo（個人型確定拠出年金）の月々の掛金額を変更するために使用します。


    【機能】

    指定された口座のiDeCo掛金額を更新します。手続きは原則として年1回までという制限があります。


    【引数】

    - `account_id`: 対象となるiDeCo口座の識別子

    - `new_amount`: 変更後の月々の掛金（円）


    エージェントは `verify_identity` による本人確認および `get_accounts` による口座特定を完了した後、本ツールを直接呼び出します。'
