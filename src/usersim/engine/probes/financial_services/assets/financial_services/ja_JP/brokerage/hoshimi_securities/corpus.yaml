- id: 30038ba8-fad1-581f-b730-d8f2751acd83
  title: NISA（つみたて投資枠）：ほかの選択肢との比較と向かない場合
  body: 'NISA（つみたて投資枠）をご検討中の方へ、他の口座選択肢との違いと、本商品が適さないケースをご説明します。


    【特定口座（源泉徴収あり）との比較】

    ・税制：特定口座では上場株式等の譲渡益と配当に20.315%の税金がかかりますが、NISA（つみたて投資枠）で得た利益は非課税となります。

    ・運用スタイル：特定口座は自由な売買に適していますが、つみたて投資枠は少額（最低100円）からの長期積立に特化しています。


    【本商品が向かない場合】

    ・短期的な売買で利益を狙いたい方：つみたて投資枠は長期的な資産形成を目的としており、短期トレードには不向きです。柔軟な運用を求める方は「NISA（成長投資枠）」をご検討ください。

    ・非課税枠を使い切った方：年間投資枠（1,200,000円）または非課税保有限度額（18,000,000円）をすべて利用済みの方は、特定口座での運用となります。


    資産形成の目的に合わせて、最適な口座をお選びください。'
