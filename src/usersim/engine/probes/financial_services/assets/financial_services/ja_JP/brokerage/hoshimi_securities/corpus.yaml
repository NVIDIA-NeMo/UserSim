- id: f2f44b58-d00a-5a85-b835-a186295693fd
  title: 米国株式の取引：個人情報の取扱い
  body: '星見証券は、お客様からお預かりした個人情報を、法令および社内規定に基づき厳重に管理いたします。


    ■ 利用目的

    「米国株式の取引」における個人情報は、以下の目的で利用いたします。

    ・口座開設手続きおよび本人確認（フルネーム、生年月日、マイナンバーの照合等）

    ・米国市場における取引執行および清算

    ・法的な義務に基づく規制当局（金融庁、日本証券業協会）への報告

    ・重要事項のご案内およびサービス向上のための連絡


    ■ 資産の保護と管理

    お客様の資産は、当社の財産とは明確に分けて管理する「分別管理」を徹底しております。これにより、万一当社に破綻が生じた場合でも、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による損失は補償対象外となりますので、あらかじめご了承ください。


    ■ 第三者提供の制限

    法令に基づく要請がある場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。情報の開示や訂正を希望される場合は、本人確認（フルネームと生年月日の照合）を経て、迅速に対応いたします。'
