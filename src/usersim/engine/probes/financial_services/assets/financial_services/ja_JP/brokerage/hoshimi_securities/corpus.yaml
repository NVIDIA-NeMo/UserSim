- id: ba9e6930-5370-57a7-ba1c-01b499ba7c7d
  title: 特定口座（源泉徴収あり）：重要事項のご説明
  body: '本口座のご利用にあたり、以下の重要事項を必ずご確認ください。


    【法令遵守と適合性の原則】

    星見証券は金融商品取引法に基づき、お客様の知識、経験、財産の状況および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しております。


    【資産の管理と補償】

    お客様からお預かりした金銭および有価証券は、当社の財産と分けて管理する「分別管理」を実施しております。万一、当社が破綻し資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【リスク告知】

    投資信託や株式などの金融商品は、価格変動リスクを伴います。相場の変動により、投資元本を割り込む可能性があり、その損失は日本投資者保護基金の補償対象外となります。利益を保証するものではありませんので、リスクをご理解いただいた上で運用をお願いいたします。


    【税務および法的助言】

    本口座では上場株式等の譲渡益・配当に20.315%の税率が適用されますが、当社は個別の税務相談や法的助言は行いません。詳細な税務判断が必要な場合は、専門の税理士にご相談ください。'
