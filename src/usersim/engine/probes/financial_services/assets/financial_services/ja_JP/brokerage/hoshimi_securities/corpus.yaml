- id: 63936980-9ded-5337-97ea-51b6a94b1593
  title: 投資信託の積立：この商品をかたる詐欺にご注意ください
  body: '星見証券の「投資信託の積立」サービスをかたる、不審な電話やメール、SNSでの勧誘にご注意ください。特に「必ず利益が出る」「元本を保証しつつ高還元を得られる」といった、金融商品取引法および当社のコンプライアンス方針に反する断定的な利益保証をうたうものは、詐欺である可能性が非常に高いです。


    当社では、口座情報の変更や重要なお手続きを行う際、お客様の「フルネーム」と「生年月日」の照合のみで本人確認を行います。クレジットカードの暗証番号、ログインパスワード、あるいはワンタイムコードなどの機密情報を、電話やメールでお伺いすることは決してございません。


    もし、不審な連絡を受けたり、心当たりのない取引通知が届いたりした場合は、直ちにご相談ください。迅速に調査を行い、お客様の資産を守るための対応をいたします。また、万一被害に遭われた場合は、速やかに警察および当社のヘルプデスクへご連絡をお願いいたします。'
