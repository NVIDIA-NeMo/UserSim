- id: eea967b7-43bc-5360-96d1-22eb6605115e
  title: 投資信託の積立：規定・約款の変更
  body: '本規定は、星見証券が提供する「投資信託の積立」サービスにおける利用条件および約款の変更について定めるものです。


    1. サービスの利用条件

    お客様は、積立の最低金額である100円以上の設定を行うことで本サービスを利用できます。また、クレジットカードによる決済を選択した場合、クレジットカード積立の上限（月額）として100,000円までという制限が適用されます。この上限額を超える設定はできませんのでご注意ください。


    2. 規定の変更手続き

    当社は、法令の改正、監督官庁である金融庁または日本証券業協会の指導、あるいは運営上の必要が生じた場合、本約款を変更することがあります。変更の内容および適用開始日については、デジタルチャネルを通じて事前にお知らせいたします。


    3. 合意の効力

    事前通知後、所定の期間内にお客様から異議申し立てがない場合は、変更後の約款に同意したものとみなされます。本サービスはデジタル完結型であるため、通知の確認はお客様自身の責任において行っていただくものとします。


    4. 契約の終了

    お客様が口座を解約した場合、または当社が規約違反に基づき口座を凍結した場合、本積立設定は自動的に解除されます。'
