- id: fc518292-bdfe-5aa6-8147-a526ec7839be
  title: NISA（成長投資枠）：登録内容の変更
  body: 'NISA（成長投資枠）に関連するご登録内容の変更手順をご案内いたします。


    【お手続きの前に】

    お手続きにはご本人様確認が必要です。あらかじめご準備をお願いいたします。


    【変更手順】

    1. 担当スタッフに「登録内容の変更」を希望される旨をお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」をお伝えください。スタッフが照合を行います。

    3. 変更したい項目（住所、連絡先など）と、新しい内容をお伝えください。

    4. スタッフが変更内容を確認し、手続きを完了します。

    5. 手続き完了後、内容が正しく反映されたことを確認する通知が届きますので、ご確認ください。


    【ご注意】

    ・NISA口座の金融機関変更など、税制上の手続きが伴う場合は別途書類の提出が必要となる場合がございます。

    ・機密情報（パスワードや暗証番号）を伺うことはございません。万一要求された場合は、直ちにご報告ください。'
