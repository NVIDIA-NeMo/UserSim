- id: ae0d6cdd-68fe-599b-85cc-0dd1119ff898
  title: 投資信託の積立：お申込みとご利用開始
  body: '「投資信託の積立」のご利用開始までの流れをご案内します。本手続きはデジタルチャネルで完結いたします。


    【事前準備】

    ・星見証券の総合口座開設が完了していること

    ・（クレジットカード積立をご希望の場合）有効なクレジットカードをご用意ください


    【お申込みステップ】

    1. 本人確認の実施

    まず、お客様の「フルネーム」と「生年月日」をご提示いただき、ご本人様であることを確認させていただきます。


    2. 積立商品の選択

    ラインナップの中から、お客様の投資目的やリスク許容度に合った投資信託を選択します。当社の専門スタッフが、適合性の原則に基づき、適切な商品選びをサポートいたします。


    3. 積立条件の設定

    積立金額と決済方法を決定します。

    ・金額：積立の最低金額である100円以上で設定してください。

    ・方法：現金またはクレジットカードを選択します。クレジットカード積立の上限（月額）は100,000円までとなります。


    4. 内容確認と確定

    設定内容に間違いがないかを確認し、確定します。この時点で、次回の積立指定日から自動的に買い付けが開始されます。


    【完了の確認】

    手続き完了後、登録メールアドレスに通知が届きます。また、口座状況画面にて、設定した積立金額とスケジュールが表示されていれば正常に完了しています。'
