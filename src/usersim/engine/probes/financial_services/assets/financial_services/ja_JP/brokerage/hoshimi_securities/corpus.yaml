- id: 9a97bbf3-9b31-5ff4-bf11-572676dfda4e
  title: NISA（成長投資枠）：この商品をかたる詐欺にご注意ください
  body: '星見証券では、お客さまの資産を守るため、NISA（成長投資枠）を悪用した詐欺への注意喚起を行っております。最近では、当社の職員や投資専門家を名乗り、「必ず利益が出る」「元本が保証される」といった勧誘を行う事例が報告されています。


    まず、金融商品取引法および当社の規定に基づき、投資における利益を保証することは一切ございません。相場変動による損失は補償の対象外となりますので、断定的な利益提示がある場合は詐欺である可能性が非常に高いと考えられます。また、当社の担当者がお客さまにパスワード、暗証番号、またはクレジットカードのセキュリティコードを伺うことはございません。


    口座情報の変更などの重要な手続きを行う際は、必ず本人確認を実施いたします。確認に使用するのは、お客さまの「フルネーム」と「生年月日」の照合のみです。その他の機密情報の要求は行いませんので、不審な要求があった場合は直ちに応答を停止してください。


    もし不審な連絡を受け、資産の移動や個人情報の提供を指示された場合は、至急当社ヘルプデスクまでご連絡ください。迅速に調査プロセスを提示し、対応いたします。解決に至らない紛争については、証券・金融商品あっせん相談センター（FINMAC）へご案内いたします。'
