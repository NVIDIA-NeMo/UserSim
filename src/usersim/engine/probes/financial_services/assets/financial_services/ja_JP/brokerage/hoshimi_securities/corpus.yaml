- id: 3bc25719-ff8c-5284-9208-9fa224474c93
  title: 投資信託の積立：手数料と費用
  body: 'Q：投資信託の積立を利用する場合、どのような費用がかかりますか？


    A：星見証券では、投資へのハードルを下げるため、主要商品の取引手数料を0円としております。また、クレジットカード積立をご利用いただくことで、効率的な資産形成を支援しています。


    Q：クレジットカード積立を利用するメリットはありますか？


    A：はい。クレジットカード積立をご利用いただくと、クレジットカード積立のポイント還元率として0.5%のポイントが付与されます。これにより、積立金額に応じたポイントを効率的に獲得しながら運用いただけます。


    なお、個別の投資信託商品自体に設定されている信託報酬などの管理費用は別途発生いたします。詳細な費用については、各商品の目論見書をご確認ください。'
