- id: 0a7f4164-4e8d-5327-ad1e-c43d572704a0
  title: NISA（つみたて投資枠）：未成年者の非課税保有限度額（2027年1月から）について
  body: 'Q：2027年1月から未成年者がNISA（つみたて投資枠）を利用する場合、非課税で持てる資産の最大額はいくらになりますか？


    A：未成年者の非課税保有限度額（2027年1月から）は、6,000,000円となります。


    Q：この限度額は大人（18歳以上）の限度額とは別になりますか？


    A：はい。18歳以上の方の非課税保有限度額は18,000,000円ですが、未成年者向けに別途設定された限度額となります。


    詳細な年間投資枠については「NISA（つみたて投資枠）：未成年者の年間投資枠（2027年1月から）について」をご確認ください。'
