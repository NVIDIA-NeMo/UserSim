- id: edc28a1f-5323-5450-8b54-3238ab552d0c
  title: iDeCo（個人型確定拠出年金）：限度額・制限と注意事項
  body: 'iDeCo（個人型確定拠出年金）のご利用における重要な限度額、制限事項および注意事項についてご案内します。サポート担当者は、お客様へのご案内の際に以下の数値を正確に提示してください。


    【掛金の限度額（月額）】

    2026年12月分の掛金から、以下の拠出限度額が適用されます。

    ・会社員の方：62,000円（企業年金等の掛金と合算して）

    ・自営業者の方：75,000円（国民年金基金の掛金等と合算して）


    【掛金の最低額】

    ・月額：5,000円


    【重要な制限事項】

    ・資産の引き出し：iDeCoは老後資金を準備するための制度であるため、原則として60歳まで資産を引き出すことはできません。この資金拘束性は制度上の重要な制限であるため、必ずお客様へ明確に告知してください。

    ・適合性の原則：顧客の知識、経験、財産の状況、投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底し、お客様の最善の利益を追求します。


    【リスク告知】

    ・元本保証の有無：運用商品によっては元本が保証されず、相場変動により投資元本を割り込む可能性があります。相場変動による損失は、日本投資者保護基金の補償対象外となります。'
