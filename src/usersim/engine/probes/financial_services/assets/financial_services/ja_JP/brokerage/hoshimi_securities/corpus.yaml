- id: 421b1e31-a25f-5249-82ba-df14b51158cc
  title: 特定口座（源泉徴収あり）：おすすめの方と主な使い方
  body: '「特定口座（源泉徴収あり）」は、税金の手続きをシンプルにしたい投資家の方に最適な口座です。


    【おすすめの方】

    ・確定申告の手間を省き、効率的に資産運用を行いたい方

    ・投資による利益から税金が自動的に差し引かれる安心感を重視する方

    ・国内株式を中心に、低コストで取引を開始したい方


    【主な特徴とメリット】

    ・自動納税：上場株式等の譲渡益や配当に対して、20.315%の税率で自動的に源泉徴収が行われます。原則として、ご自身で確定申告を行う必要がありません。

    ・コストの最小化：国内株式の売買手数料は0円です。投資への心理的なハードルを下げ、少額からでも気軽にお取引いただけます。

    ・損失の管理：口座内で損益通算が行われるほか、確定申告により損失を3年まで繰り越して、将来の利益と相殺することが可能です。


    【使い方】

    口座開設時に「特定口座（源泉徴収あり）」を選択していただくだけで、以降の取引で発生した利益から税金が自動的に差し引かれます。お客さまは、純粋に資産の成長に集中していただけます。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: product_sheet
