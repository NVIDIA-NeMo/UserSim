- id: c0722def-64ec-59d0-a2ce-72a8fbb533e1
  title: 投資信託の積立：限度額・制限と注意事項
  body: '【サポート担当者向け：投資信託の積立 限度額・制限詳細】


    本サービスにおける積立設定の制限事項および限度額は以下の通りです。顧客への案内時には、これらの数値を正確に提示してください。


    ■積立金額の制限

    ・積立の最低金額：100円

    （100円から少額での積立設定が可能です）


    ■クレジットカード決済の制限

    ・クレジットカード積立の上限（月額）：100,000円

    （月間の決済合計額がこの上限を超えて設定することはできません）


    ■注意事項

    ・クレジットカード積立を利用する場合、カード会社の利用限度額が不足していると積立が実行されません。

    ・積立商品の選択にあたっては、「適合性の原則」に基づき、顧客の知識、経験、目的に照らして適切であることを確認してください。

    ・相場変動による損失は補償対象外となるため、元本保証がないことを明確に伝えてください。


    詳細な商品概要については、「投資信託の積立：商品概要」を参照してください。'
