- id: 6c79d96b-5f74-5d5e-a8f4-e96e345326bf
  title: iDeCo（個人型確定拠出年金）：想定外の手数料・金額
  body: 'お客様から「資産残高から予想外の金額が差し引かれている」とのお問い合わせをいただいた際の確認手順です。


    【想定される原因と確認事項】

    1. 加入時手数料の発生：新規加入時に 2,829円 の加入時手数料（国民年金基金連合会への支払分）が差し引かれます。加入直後の残高確認であるかを確認してください。

    2. 月額手数料の発生：2026年12月分から、月額 186円 の手数料が差し引かれます。直近の明細にこの金額が含まれていないか確認してください。

    3. 運営管理機関手数料の確認：星見証券の運営管理機関手数料は 0円 です。もし運営管理手数料として別途金額が差し引かれている場合は、誤認の可能性があるため詳細を照会してください。


    【解決策とエスカレーション】

    ・上記の手数料（2,829円 または 186円）による正当な差し引きである場合は、その旨を丁寧にご説明し、納得いただければ解決となります。

    ・上記に当てはまらない不明な金額の変動がある場合、またはお客様が強く不服を申し立てられた場合は、速やかに社内のコンプライアンス担当または専門の運用責任者へエスカレーションしてください。調査後、透明性のあるプロセスでお客様に回答いたします。'
