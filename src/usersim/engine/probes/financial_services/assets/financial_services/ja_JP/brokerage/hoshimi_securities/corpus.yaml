- id: b01fcf52-88e2-50ce-b2fc-f49d86413d94
  title: 米国株式の取引：お手続きが完了しない・保留中のまま
  body: '米国株式の取引お申込み後、ステータスが「保留中」のまま完了しない場合に考えられる原因と対処法をご案内します。


    【考えられる原因】

    1. 本人確認情報の不一致：ご提示いただいたフルネームまたは生年月日が、口座登録情報と一致していない可能性があります。

    2. 適合性確認の未完了：投資目的や経験に関する回答が不足しており、適合性の原則に基づいた審査が完了していない場合があります。

    3. マイナンバー未届：口座開設時にマイナンバーの届出が完了していない場合、海外取引の制限がかかります。


    【確認と解決の手順】

    ・まず、ご登録の氏名および生年月日に誤りがないか、私たちに再度ご確認ください。

    ・次に、適合性確認のために追加で回答が必要な事項があるか、現在の審査状況を確認させていただきます。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、私たちが社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、個別に調査を行います。調査結果については、改めてご連絡いたします。'
