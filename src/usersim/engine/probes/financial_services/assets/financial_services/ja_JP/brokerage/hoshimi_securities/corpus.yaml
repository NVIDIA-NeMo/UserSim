- id: 5b064301-b6c6-538e-b9c3-a843ac833fa9
  title: 投資信託の積立：明細や記録と合わない
  body: '【サポート担当者向け：明細・記録不一致への対応】


    顧客より「積立金額が明細と合わない」「記録に反映されていない」との申し出があった場合、以下の順序で確認してください。


    ■確認ステップ

    1. 決済手段の確認：クレジットカード積立の場合、カード会社の請求サイクルと当社の積立実行日にタイムラグが生じます。カード明細の日付ではなく、当社の約定日を確認してください。

    2. 最低金額の確認：設定金額が100円未満になっていないか、または端数処理の影響がないかを確認します。

    3. 上限超過の確認：クレジットカード積立の上限（月額）100,000円を超えて設定しようとして、一部が拒否されていないかを確認してください。

    4. 基準価額の変動：投資信託は金額指定で積立を行いますが、取得できる口数は基準価額により変動します。「投資金額」と「評価額」を混同されていないか確認してください。


    ■対処とエスカレーション

    ・単純な誤解である場合は、上記の仕組みを丁寧に説明してください。

    ・システム上の不整合や、計算に明らかな誤りがあると思われる場合は、直ちに社内の専門の運用責任者へエスカレーションし、内部調査を依頼してください。顧客には「現在、詳細な調査を行っておりますので、回答まで今しばらくお待ちください」と伝え、透明性のあるプロセスで対応してください。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: troubleshooting
  source_authority: official
