- id: 8e5f2f5d-352c-5bc5-ad79-928415df851d
  title: NISA（つみたて投資枠）：限度額・制限と注意事項
  body: '本資料は、NISA（つみたて投資枠）の運用における限度額および制限事項をまとめたものです。顧客サポートの際は、以下の数値を正確に案内してください。


    【投資限度額】

    ・年間投資枠：1,200,000円

    ・非課税保有限度額：18,000,000円（成長投資枠との合計額です）


    【取引制限】

    ・積立の最低金額：100円から設定可能です。

    ・対象者：原則として日本国内に居住する18歳以上の方（2027年1月より未成年者の利用範囲が拡大されます）。


    【注意事項】

    ・非課税保有限度額の再利用：商品を売却した場合、その商品の取得価額分だけ、翌年以降に非課税保有限度額の枠を再び利用することが可能です。

    ・元本保証の否認：相場変動による損失は補償の対象外となります。適合性の原則に基づき、顧客の知識、経験、目的に照らして適切な商品提示を行ってください。

    ・分別管理：顧客資産は当社財産と分けて管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    詳細については「NISA（つみたて投資枠）：商品概要」をご参照ください。'
