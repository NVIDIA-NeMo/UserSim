- id: 3ce4e854-5891-5849-9af6-46decd189e8c
  title: iDeCo（個人型確定拠出年金）：お申込みいただける方
  body: 'iDeCo（個人型確定拠出年金）へのお申込み条件は以下の通りです。


    | 条件 | 内容 | 判定 |

    | :--- | :--- | :--- |

    | 年齢 | 原則として20歳以上65歳未満の方 | 加入可能 |

    | マイナンバー | 正確なマイナンバーの届出が可能な方 | 加入必須 |

    | 拠出金額 | 月額5,000円以上を拠出できる方 | 加入可能 |

    | 会社員 | 企業年金等の加入状況に応じた上限額（2026年12月分から最大62,000円）の範囲内であること | 加入可能 |

    | 自営業者 | 国民年金基金等の加入状況に応じた上限額（2026年12月分から最大75,000円）の範囲内であること | 加入可能 |


    ※一定の要件を満たせば70歳まで加入できる場合があります。詳細については個別にご相談ください。'
