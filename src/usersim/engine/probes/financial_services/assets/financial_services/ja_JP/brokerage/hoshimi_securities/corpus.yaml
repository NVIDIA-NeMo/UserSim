- id: d1c48e3a-08fa-5d58-83ab-a41f1b0cfbb9
  title: NISA（成長投資枠）：明細や記録と合わない
  body: '顧客から「NISA（成長投資枠）の明細や利用限度額の記録が、自身の認識と合わない」と指摘された場合の対応フローです。サポート担当者は以下の順序で確認してください。


    【確認ステップ】

    1. 受渡し日の確認（T+2）

    国内株式の場合、受渡しは約定日の2営業日後です。約定直後に限度額の変動を期待されている場合、受渡し完了までタイムラグがあることを説明してください。


    2. 取得価額と時価の混同

    非課税保有限度額（12,000,000円）の判定は「時価」ではなく「取得価額」に基づきます。時価が上昇していても、枠の消費は取得時の金額で計算されるため、その点を確認してください。


    3. 枠の再利用タイミングの確認

    商品を売却して空いた枠が復活するのは「翌年以降」です。当年度中に売却しても、即座に今年の年間投資枠（2,400,000円）が増えるわけではないことを明確に伝えてください。


    【解決策】

    上記の説明で解消しない場合は、取引履歴を詳細に照合し、不整合がある箇所を特定します。


    【エスカレーション】

    計算上の不整合が疑われる場合や、システム上の不具合が考えられる場合は、直ちに社内の専門の運用責任者へエスカレーションし、正確な再計算と修正を行ってください。'
