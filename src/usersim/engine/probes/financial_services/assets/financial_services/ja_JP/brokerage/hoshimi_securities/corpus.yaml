  institution_id: hoshimi_securities
- id: b316a71b-0737-55e5-ba3b-ed4a3b502400
  title: NISA（つみたて投資枠）：金利・料率一覧
  body: 'NISA（つみたて投資枠）に適用される料率および税率は以下の通りです。


    【税率】

    ・運用益（譲渡益および配当金）にかかる税率：0%

    ※通常、特定口座等で適用される20.315%の税金が、本枠の非課税保有限度額内においては完全に非課税となります。


    【取引手数料】

    ・国内株式等の主要商品取引手数料：0円

    ※すべての投資金額に対し、一律0円を適用いたします。


    【適用条件】

    上記の非課税措置は、NISA口座における適正な手続きを経て保有されている資産にのみ適用されます。非課税保有限度額（18,000,000円）を超えて保有する場合、超過分については課税対象となりますのでご注意ください。'
