- id: d6c8b7d7-f6fb-53e0-8869-0cdcb4a5ad42
  title: NISA（つみたて投資枠）：想定外の手数料・金額
  body: '【症状】

    「積立金額や残高が想定していた金額と異なる」「身に覚えのない手数料が差し引かれている」と感じる場合。


    【考えられる原因と確認事項】

    1. 口座種類の確認：

    投資信託の購入が、NISA（つみたて投資枠）ではなく、特定口座や一般口座で行われていないかをご確認ください。課税口座の場合、利益に対して20.315%の税金が差し引かれます。


    2. 信託報酬（管理費用）の発生：

    投資信託の運用に伴う信託報酬は、商品内部で日々差し引かれます。これは弊社が徴収する手数料ではなく、運用会社へ支払われるコストです。商品詳細にて料率をご確認ください。


    3. 積立設定の重複：

    複数の積立設定を行っていないか、履歴をご確認ください。


    【解決方法】

    ・取引履歴を照合し、どの口座で取引が行われたかを確認してください。

    ・もし設定ミスが判明した場合は、担当者へ伝え、積立プランの変更手続きを行ってください。


    【エスカレーション】

    履歴を確認しても原因が不明な場合や、明らかな計算誤りが疑われる場合は、社内のコンプライアンス担当または運用責任者へエスカレーションし、透明性のある調査を実施いたします。調査結果は速やかにお知らせいたします。'
