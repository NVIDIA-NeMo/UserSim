- id: 24a3ac5e-c86d-50b4-9ce7-409ad5fbfef4
  title: 特定口座（源泉徴収あり）：お手続きが完了しない・保留中のまま
  body: '特定口座（源泉徴収あり）のお申込み手続きが完了せず、「保留中」の状態となっている場合の対処法をご案内します。


    【考えられる原因と確認事項】

    1. 本人確認情報の不一致：ご提示いただいた「フルネーム」または「生年月日」が、登録情報と一致していない可能性がございます。再度正しい情報をお伝えください。

    2. マイナンバー届出の不備：マイナンバーの番号に誤りがあるか、添付書類の画像が不鮮明で確認できない場合がございます。


    【解決方法】

    ・情報の修正：不備がある箇所を特定し、正しい情報を改めてお伝えください。担当者が即時に情報を更新いたします。

    ・書類の再提出：不鮮明な書類がある場合は、再度鮮明な画像を提示いただくか、書類の送付をお願いいたします。


    【解決しない場合の対応】

    上記を確認しても状況が変わらない場合、または複雑な不備がある場合は、担当者が社内のコンプライアンス担当へエスカレーションいたします。調査の結果およびお手続きの進捗については、通常3営業日以内にご連絡いたします。'
