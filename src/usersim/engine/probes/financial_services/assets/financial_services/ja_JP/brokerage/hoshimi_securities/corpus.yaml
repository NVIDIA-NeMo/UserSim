  body: 'お客様が投資信託の積立設定を新規に作成、または既存のプランを変更したい場合に、本ツールを使用します。クレジットカード決済を利用した効率的な資産形成を支援します。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合して本人確認を行います。

    2. `get_accounts` を使用し、お客様が提示した口座番号の下4桁から、対象となる `account_id` を特定します。

    3. 積立対象の商品（`product_id`）、毎回の積立金額、積立頻度、および決済方法（証券口座またはクレジットカード）を確認します。

    4. 確認した内容に基づき、`set_up_investment_plan` を呼び出して設定を完了させます。


    詳細については、「投資信託の積立：お申込みとご利用開始」をご参照ください。'
