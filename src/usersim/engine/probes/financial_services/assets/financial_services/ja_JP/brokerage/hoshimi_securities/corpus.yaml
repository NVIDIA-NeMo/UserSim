- id: 6655a5ee-4843-5ac8-a72f-f3e3a3e92344
  title: NISA（つみたて投資枠）：よくあるお手続きの流れ
  body: 'NISA（つみたて投資枠）のご利用開始までのお手続きの流れをご案内します。


    【事前準備】

    ・マイナンバーカード（またはマイナンバー確認書類と本人確認書類）


    【お手続きの手順】

    1. 本人確認：お客様のフルネームと生年月日を伺い、照合いたします。

    2. 口座開設の申請：NISA口座開設に必要なマイナンバーの届出および申請手続きを行います。

    3. 銘柄の選択：長期的な資産形成に適した投資信託の中から、投資したい商品をお選びいただきます。

    4. 積立金額の設定：毎月の積立金額を設定します。積立の最低金額は100円からとなります。

    5. 確定と確認：設定内容を最終確認し、お手続きを完了します。


    【完了の目安】

    税務署による審査を経て、NISA口座開設が完了した旨の通知が届いた時点で、非課税での積立運用が開始されます。'
