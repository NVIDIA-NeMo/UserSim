- id: 08d2522e-3974-5eb3-880a-2bfcac0ddee7
  title: NISA（つみたて投資枠）：ログインできない・アクセスできない
  body: 'NISA（つみたて投資枠）の管理画面にログインできない、またはアクセスできない場合の対処法をご案内します。


    【症状】

    ・ログインIDまたはパスワードを入力してもエラーが表示され、マイページに入れない。

    ・認証画面で止まってしまい、次へ進めない。


    【考えられる原因】

    1. 入力情報の誤り：大文字・小文字の区別や、不要なスペースが入っている可能性があります。

    2. アカウントのロック：短時間に複数回ログインに失敗し、セキュリティ保護のため一時的にロックがかかっている可能性があります。

    3. 通信環境の問題：ご利用のネットワーク接続が不安定な場合があります。


    【確認および解決手順】

    1. 入力内容の再確認

    パスワードを正しく入力しているか、キーボードのCaps Lockなどがオンになっていないかを確認してください。


    2. パスワードの再設定

    パスワードを忘れた場合は、再設定手続きを行ってください。手続きの際は、ご登録の「フルネーム」と「生年月日」による照合が必要です。


    3. 通信環境の切り替え

    Wi-Fiからモバイル通信への切り替え、またはブラウザのキャッシュ消去をお試しください。


    【解決しない場合の対応（エスカレーション）】

    上記を試しても解決しない場合は、当社ヘルプデスクまでご連絡ください。専門の運用責任者がアカウントの状態を調査し、ロックの解除やアクセス権限の復旧を行います。調査結果は、通常1〜3営業日以内にデジタルチャネルにて通知いたします。'
