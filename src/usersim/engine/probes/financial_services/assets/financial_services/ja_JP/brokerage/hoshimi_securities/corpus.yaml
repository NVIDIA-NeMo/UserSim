- id: 0836b6e1-b5d1-51f2-8654-2fb27518838d
  title: 米国株式の取引：規定・約款
  body: '本規定は、星見証券における「米国株式の取引」の利用条件を定めるものです。お客さまは本規定に同意した上でサービスを利用するものとします。


    1. 取引の成立と手数料

    米国株式の売買にあたっては、約定代金に対する割合として0.495%の取引手数料が発生します。ただし、1回の取引あたりの取引手数料の上限は22米ドルと定められており、計算額がこの上限を超える場合は22米ドルが適用されます。


    2. 為替取引

    米国株式の取引に際して米ドルへの換金または日本円への換金を行う場合、1米ドルあたり25銭の為替手数料を申し受けます。


    3. 資産の管理と補償

    お客さまから預かった金銭および有価証券は、法令に基づき当社の財産と分けて管理する「分別管理」を徹底しております。万一、当社が破綻し資産の返還が不能となった場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償の対象外となります。


    4. 適合性の原則

    当社は、お客さまの知識、経験、財産の状況および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を遵守します。


    5. 規定の変更と終了

    本規定は、法令の変更や社内規定の改定に伴い変更されることがあります。重要な変更がある場合は、事前にお知らせいたします。口座の解約を希望される場合は、所定の手続きを経て取引を終了し、資産を清算するものとします。'
  domain: brokerage_investing
