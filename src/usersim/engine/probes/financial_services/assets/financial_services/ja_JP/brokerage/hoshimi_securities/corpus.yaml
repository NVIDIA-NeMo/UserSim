- id: 56d1e2c4-e33a-58e8-9ee1-120700d1e6aa
  title: 投資信託の積立：切替えや上位プランを検討するとき
  body: '【サポート担当者向け：プラン切替え検討時の案内指針】


    顧客が現在の積立設定から、より効率的な非課税枠の活用やプラン変更を検討している場合、以下の視点で提案してください。


    ■NISA（つみたて投資枠）への切替え

    特定口座での「投資信託の積立」を利用中のお客様には、利益が非課税となる「NISA（つみたて投資枠）」への切替えを提案してください。長期的な資産形成において、税制優遇のメリットは非常に大きいためです。


    ■クレジットカード積立の活用

    現金振替による積立からクレジットカード積立への変更を検討される場合、クレジットカード積立のポイント還元率 0.5% のメリットを提示してください。ただし、クレジットカード積立の上限（月額）が100,000円である点に留意し、それを超える積立を希望される場合は、併用または別の決済方法を案内してください。


    詳細は「NISA（つみたて投資枠）：商品概要」にて、非課税限度額などの条件を確認してください。'
