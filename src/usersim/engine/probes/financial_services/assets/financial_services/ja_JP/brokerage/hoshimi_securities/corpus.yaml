- id: eac2e8b2-9a78-5701-b48b-9f3590104080
  title: 米国株式の取引：不正利用からお客さまを守るために
  body: '星見証券では、お客さまが安心してお取引いただけるよう、セキュリティ対策を徹底しております。米国株式の取引において特に注意が必要な不正利用のパターンと、当社の対応についてご案内いたします。


    【注意すべき不正利用のパターン】

    SNSやメールで「元本保証で必ず利益が出る米国株の投資案件」や「未公開の優良銘柄を特別に案内する」といった勧誘がある場合は、詐欺の可能性が非常に高いため、十分にご注意ください。金融商品取引法に基づき、当社は将来の利益を保証することはございません。


    【当社の本人確認について】

    当社が口座情報の変更などの重要な手続きを行う際、お客さまに確認させていただく情報は「フルネーム」と「生年月日」のみです。これら以外の機密情報（暗証番号、パスワード、ワンタイムコード、クレジットカードのセキュリティコードなど）を、お電話やメールで要求することは一切ございません。このような要求があった場合は、直ちに中断してください。


    【異常を感じた際の初動対応】

    身に覚えのない取引通知が届いた、あるいは不審な連絡を受けた場合は、速やかに当社のヘルプデスクまでお知らせください。迅速に調査を行い、必要に応じて口座の利用制限などの措置を講じます。不正利用の疑いがある場合は、発見から早急にご連絡いただくことが被害を最小限に抑える鍵となります。'
