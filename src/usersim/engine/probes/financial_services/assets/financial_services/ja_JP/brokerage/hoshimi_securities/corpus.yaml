- id: 2f5abc5c-458b-53ff-8585-1d6eaef7c6f4
  title: 投資信託の積立：よくあるお手続きの流れ
  body: '「投資信託の積立」を開始するための一般的なお手続きの流れをご案内します。


    【事前準備】

    ご希望の投資信託商品を選定し、月々の積立予定金額（100円以上の金額）を決めておいてください。


    【お手続き手順】

    1. 担当者に「投資信託の積立設定をしたい」とお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」をお伺いします。

    3. 積立希望の商品名と、毎月の積立金額を伝えてください。なお、クレジットカード積立をご希望の場合は、その旨を合わせてお伝えください（月額上限100,000円まで）。

    4. 担当者が、選択された商品がお客様の投資目的に照らして適切であるかを確認します（適合性の原則に基づく確認）。

    5. 設定内容の最終確認を行い、承諾いただければ設定が完了します。


    【完了の確認】

    設定完了後、担当者より確定した積立金額と次回引落日、およびクレジットカード利用時はポイント還元率0.5%が適用される旨を回答いたします。


    非課税での運用をご希望の方は、「NISA（つみたて投資枠）：お申込みとご利用開始」も併せてご確認ください。'
