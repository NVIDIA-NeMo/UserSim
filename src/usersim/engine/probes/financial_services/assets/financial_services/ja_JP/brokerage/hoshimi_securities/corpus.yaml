- id: fc65db7f-f341-5f0f-9820-78f9d64c8a49
  title: 投資信託の積立：登録内容の変更
  body: "現在ご利用中の積立設定（金額、決済方法、商品など）を変更する手順をご案内します。\n\n【事前準備】\nお手元に口座情報をご用意ください。変更手続きには本人確認が必要です。\n\
    \n【変更ステップ】\n1. 本人確認：オペレーターに「フルネーム」と「生年月日」を伝えてください。照合が完了し、本人確認が承認されます。\n2. 変更箇所の指定：変更したい項目（例：積立金額の増減、決済方法の変更など）を伝えてください。\n\
    3. 設定値の入力・指定：\n   - 金額を変更する場合：積立の最低金額である100円以上の金額を指定してください。\n   - クレジットカード積立に変更する場合：クレジットカード積立の上限（月額）である100,000円以内であるか確認が行われます。\n\
    4. 内容の確認：変更後の積立金額、適用されるポイント還元率（クレジットカード積立の場合は0.5%）、次回の積立予定日について案内を受け、内容に間違いがないか確認します。\n\
    5. 完了通知の受領：手続き完了後、登録内容が更新された旨の通知が届きます。これにより変更手続きは完了です。\n\n手続きの流れについてさらに詳しく知りたい方は、「投資信託の積立：ご利用開始までの手順」をご参照ください。"
