- id: 3a9e48e4-c218-5004-9a71-ac57241c2575
  title: 米国株式の取引：ご利用開始までの手順
  body: 'サポート担当者は、お客様が「米国株式の取引」を開始される際、以下の手順に沿って案内を行ってください。


    1. 口座開設と本人確認

    まず、証券口座の開設が必要です。金融商品取引法に基づき、マイナンバーの届出を含む本人確認手続きを完了していただきます。


    2. 米国株式取引の有効化

    口座開設後、お客様に「米国株式の取引」への参加を申請していただきます。この際、適合性の原則に基づき、お客様の知識、経験、投資目的に照らして米国株への投資が適切であるかを確認します。


    3. 資金の入金

    日本円を口座に預け入れていただきます。顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    4. 通貨の換算（米ドルへの変更）

    米国株の購入には米ドルが必要です。円から米ドルへ換算する際、1米ドルあたり25銭の為替手数料が発生することを説明してください。


    5. 取引の実行

    銘柄を選択し、注文を出します。取引手数料は約定代金の0.495%（上限22米ドル）となります。相場変動による損失は補償対象外となるため、リスク告知を明確に行ってください。'
