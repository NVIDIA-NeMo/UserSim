- id: af67a41a-7a94-5bcc-81ce-a2817f665458
  title: 投資信託の積立：お取引が拒否された・制限された
  body: '積立設定や購入依頼がお取引拒否、または制限された場合に考えられる原因と対処法です。


    ■考えられる原因

    1. クレジットカードの限度額不足：クレジットカード積立の上限（月額）である100,000円以内であっても、カード自体の利用可能枠が不足している場合に拒否されます。

    2. 設定金額の不足：積立の最低金額である100円を下回る金額で設定しようとした場合、エラーとなります。

    3. 適合性の原則による制限：お客様の投資経験や目的に照らして、特定の商品が不適当であると判断された場合、勧誘および取引が制限されることがあります。

    4. 本人確認の未完了：重要な変更を伴う設定において、本人確認が正しく行われていない場合に制限がかかります。


    ■確認と解決の手順

    ・まず、設定金額が100円以上であるか、また月額100,000円以内であるかをご確認ください。

    ・クレジットカードの利用可能枠に十分な余裕があるか、カード会社へご確認をお願いします。

    ・適合性の確認が必要な場合は、改めてお客様の投資目的や経験についてお伺いさせていただきます。


    上記を確認しても解決しない場合は、社内のコンプライアンス担当または運用責任者へエスカレーションし、詳細な調査を行います。'
