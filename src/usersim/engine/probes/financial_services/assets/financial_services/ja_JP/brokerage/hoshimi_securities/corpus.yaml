  title: iDeCo（個人型確定拠出年金）：実施中のキャンペーン
  body: '【星見証券 iDeCoコスト削減のご案内】


    星見証券では、資産形成の民主化を目指し、iDeCo（個人型確定拠出年金）の「運営管理機関手数料」を、期間の定めなく永続的に0円で提供しております。


    他社からのお乗り換えをご検討中の方も、星見証券なら運用期間中の管理コストを抑え、より多くの資産を将来へ繋げることが可能です。


    【注目ポイント】

    ・運営管理機関手数料：0円

    ・2026年12月分より、会社員の拠出上限額が最大62,000円、自営業者の上限額が最大75,000円へと引き上げられます。より積極的な節税対策と資産形成が可能になります。


    この機会に、ぜひ星見証券での老後資金準備をご検討ください。'
