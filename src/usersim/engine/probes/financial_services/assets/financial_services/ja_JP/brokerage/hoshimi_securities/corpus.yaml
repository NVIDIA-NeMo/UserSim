- id: b8b6fa02-9fef-5b2b-acab-a91ac435cb2b
  title: iDeCo（個人型確定拠出年金）：お申込みとご利用開始
  body: 'iDeCo（個人型確定拠出年金）のご利用開始までの手順をご案内します。


    【事前準備】

    ・マイナンバーカード（またはマイナンバー確認書類と本人確認書類）

    ・ご印鑑


    【お手続きの流れ】

    1. 本人確認：まず、お客様の「フルネーム」と「生年月日」をお伺いし、ご本人様確認を行います。

    2. お申込みの意思確認：iDeCoの加入希望と、月々の拠出希望額（5,000円以上）を伝えてください。

    3. 書類のご提示：マイナンバーの届出を含む必要書類を提示してください。弊社にて内容を確認いたします。

    4. 審査と登録：国民年金基金連合会および弊社にて加入審査を行います。審査完了後、登録手続きが行われます。

    5. ご利用開始：手続き完了の通知が届きましたら、運用商品の選定および積立が開始されます。


    審査状況の確認や、お手続きが止まっている場合は、「iDeCo（個人型確定拠出年金）：お手続きが完了しない・保留中のまま」をご確認ください。'
