- id: c4d9bd83-4b58-5577-8921-a001b1521457
  title: 米国株式の取引：登録内容の変更
  body: '「米国株式の取引」をご利用中のお客様が、ご住所やメールアドレスなどの登録内容を変更する手順をご案内します。


    ■ 事前準備

    お手元に最新の登録情報と、変更後の情報をご用意ください。


    ■ 手続きの流れ

    1. 本人確認の実施

    まず、ご本人様確認のため、お客様の「フルネーム」と「生年月日」を弊社担当へお伝えください。照合が完了し、ご本人様であることが確認できた後、変更手続きへ進みます。


    2. 変更内容の提示

    変更したい項目（例：メールアドレス、電話番号、住所など）と、新しい情報を担当へお伝えください。


    3. 内容の照合と確定

    担当者が入力内容を確認し、変更事項に誤りがないかを復唱します。お客様が内容に同意し、確定の意思を示してください。


    4. 完了通知の受領

    手続きが完了すると、ご登録の連絡先に変更完了の通知が届きます。通知が届いた時点で、新しい登録内容が反映されています。


    ※重要な情報の変更に際し、パスワードや暗証番号を伺うことはございません。ご注意ください。'
