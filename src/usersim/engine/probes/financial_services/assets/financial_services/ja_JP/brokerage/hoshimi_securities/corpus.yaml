- id: 896fafff-aa43-5d3d-9f29-c6a6eb241a41
  title: iDeCo（個人型確定拠出年金）：登録内容の変更
  body: 'iDeCo（個人型確定拠出年金）の掛金額や、ご登録情報の変更手続きについてご案内します。


    ■お手続きの流れ


    1. 本人確認

    まず、お客様の「フルネーム」と「生年月日」をお伺いし、ご本人様であることを確認させていただきます。


    2. 変更内容の提示

    「月々の掛金額を変更したい」「住所や連絡先を変更したい」など、変更したい内容を具体的にお申し付けください。


    3. 内容の確認と申請

    当社にて、変更後の内容が制度上の限度額（例：2026年12月分からの上限である会社員62,000円、自営業者75,000円など）に適合しているかを確認し、申請手続きを行います。


    4. 完了通知の受領

    手続きが完了しましたら、その旨を通知いたします。掛金額の変更については、反映までにお時間をいただく場合がございますので、完了通知をもって確定としてください。


    ■ご注意点

    掛金の最低額（月額）は5,000円です。これ以下の金額への変更はできませんのでご注意ください。'
