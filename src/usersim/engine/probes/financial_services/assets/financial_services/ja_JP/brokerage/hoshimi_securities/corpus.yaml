  title: NISA（つみたて投資枠）：未成年者の年間投資枠（2027年1月から）について
  body: 'Q：未成年の方でもNISA（つみたて投資枠）を利用することはできますか？


    A：はい、2027年1月からは、0歳から17歳までの方もつみたて投資枠を利用いただけるようになります。


    Q：未成年者が利用する場合の年間投資枠はいくらになりますか？


    A：未成年者の年間投資枠（2027年1月から）は、600,000円となります。


    ご検討にあたっては、あわせて「NISA（つみたて投資枠）：未成年者の非課税保有限度額（2027年1月から）について」をご確認ください。'
