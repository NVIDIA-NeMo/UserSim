- id: d56f806e-2689-5687-9291-fbe94f10d34d
  title: 投資信託の積立：安全にご利用いただくためのポイント
  body: '星見証券の投資信託の積立サービスを安全にご利用いただくために、以下のセキュリティ上の注意点をご確認ください。


    【なりすまし詐欺への警戒】

    当社をかたるメールやSMSにより、不審なURLへのアクセスや個人情報の入力を求めるケースが報告されています。不自然な案内があった場合は、直ちに操作を中断してください。


    【当社の本人確認について】

    口座情報の変更や重要なお手続きを行う際、当社は必ずお客様の本人確認を実施いたします。確認に使用する情報は、お客様の「フルネーム」と「生年月日」の照合のみです。これ以外の認証ステップを求めたり、以下の機密情報を要求したりすることは絶対にございません。

    ・クレジットカードのセキュリティコード

    ・口座のパスワードや暗証番号

    ・ワンタイムパスワード


    【異常を感じた時の対応】

    心当たりのない積立設定の変更や、身に覚えのない取引通知を受け取った場合は、速やかに当社ヘルプデスクへご連絡ください。迅速に調査プロセスを開始し、透明性を持って対応いたします。


    詳細なデータ管理については、「投資信託の積立：個人情報の取扱い」をご参照ください。'
