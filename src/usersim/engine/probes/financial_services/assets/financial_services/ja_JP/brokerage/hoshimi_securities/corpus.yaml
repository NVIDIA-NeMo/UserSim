- id: 9db0e573-cc48-51b6-846a-1d4098eb109e
  title: iDeCo（個人型確定拠出年金）：会社員の掛金の上限（月額、2026年12月分から）について
  body: 'Q：会社員の場合、月々の掛金は最大でいくらまで拠出できますか？


    A：2026年12月分の掛金から、会社員の掛金の上限（月額）は62,000円となります。ただし、この金額は企業年金の掛金などと合わせた合算枠となります。個別の加入状況により上限が異なる場合がありますので、詳細はお申込み時にご確認ください。


    Q：上限額を超えて拠出することは可能ですか？


    A：制度上の上限額を超える拠出はできません。上限額の範囲内で、月額5,000円からご設定いただけます。


    詳細な条件については「iDeCo（個人型確定拠出年金）：お申込みいただける方」をご確認ください。'
