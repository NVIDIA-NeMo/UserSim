- id: 869ab2ee-3b23-511b-9cdc-47235817393b
  title: NISA（成長投資枠）：お手続きが完了しない・保留中のまま
  body: 'NISA（成長投資枠）の開設手続きが完了せず、「保留中」の状態となっている場合に考えられる原因と対処法をご案内します。


    【想定される原因とチェック事項】

    1. 本人確認情報の不一致

    登録された「フルネーム」または「生年月日」が、公的書類の記載と異なっている場合がございます。正しく入力されているか再度ご確認ください。


    2. マイナンバー書類の不備

    アップロードされた画像が不鮮明である、または有効期限が切れている可能性があります。四隅が明確に写っているかご確認ください。


    3. 他社でのNISA口座開設済み

    NISA口座は1人1口座のみです。他社で既に開設されている場合、金融機関変更の手続きが必要となります。


    【解消方法】

    上記を確認の上、不備がある場合は正しい情報を再度ご提示ください。弊社にて速やかに再審査を行います。


    【エスカレーション】

    上記を確認しても解決しない場合、または審査に時間がかかっている場合は、弊社コンプライアンス担当または運用責任者へ案件をエスカレーションし、個別に調査いたします。調査結果は改めてご連絡差し上げます。'
