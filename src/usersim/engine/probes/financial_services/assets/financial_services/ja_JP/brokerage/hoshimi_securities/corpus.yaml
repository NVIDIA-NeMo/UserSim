- id: 31384776-cf09-5dcb-a64b-26d0379a4329
  title: 特定口座（源泉徴収あり）：想定外の手数料・金額
  body: 'お客さまより「取引後の残高が想定より少ない」「身に覚えのない金額が差し引かれている」というお問い合わせをいただいた際の対応フローです。


    【考えられる原因】

    多くの場合、特定口座（源泉徴収あり）における「自動的な税金徴収」が原因です。利益が出た取引において、上場株式等の譲渡益・配当に対する税率20.315%が、決済時に自動的に差し引かれています。


    【確認ステップ】

    1. 取引履歴の確認：該当する取引で利益（譲渡益）が発生しているか、または配当金が入金されていないかを確認します。

    2. 税金計算の照合：[利益額 × 20.315%] の計算結果が、差し引かれた金額と一致するかを確認してください。

    3. 国内株式手数料の確認：国内株式の売買手数料は0円であるため、手数料による減額ではありません。


    【解決策と案内】

    計算結果が一致する場合、それは適正な納税手続きです。特定口座（源泉徴収あり）の仕組みについて、改めてご説明してください。


    【エスカレーション】

    上記を確認しても計算が合わない、またはシステムエラーが疑われる場合は、速やかに社内のコンプライアンス担当または運用責任者へエスカレーションし、詳細な調査を依頼してください。'
