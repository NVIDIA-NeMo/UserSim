- id: 15abae44-779e-5c1e-9e7c-4e156a506099
  title: 投資信託の積立：お手続きが完了しない・保留中のまま
  body: '積立設定のお手続き中に「処理中」のまま画面が切り替わらない、または「保留」となって完了しない場合の対処法をご案内します。


    【よくある原因とチェック項目】

    1. 本人確認情報の不一致

    お手続きの最初に行う「フルネーム」と「生年月日」の照合内容が、口座登録情報と正しく一致しているかご確認ください。一文字でも相違がある場合、セキュリティ保護のため手続きが保留されます。


    2. クレジットカードの利用限度額オーバー

    クレジットカード積立をご選択の場合、設定金額がカード側の利用可能枠を超えている可能性があります。クレジットカード積立の上限（月額）は100,000円ですが、カード自体の限度額が優先されます。


    3. 通信環境の一時的な不具合

    デジタル完結型のサービスであるため、ネットワークの切断により確定処理が正常に送信されなかった場合がございます。


    【解決方法とエスカレーション】

    上記を確認しても解決しない場合は、弊社スタッフへその旨をお伝えください。スタッフがお客様の状況を確認し、必要に応じて社内のコンプライアンス担当または運用責任者へエスカレーションを行い、保留状態の解除および再手続きを支援いたします。調査結果および対応完了のご連絡は、通常営業日の翌営業日までに行います。'
