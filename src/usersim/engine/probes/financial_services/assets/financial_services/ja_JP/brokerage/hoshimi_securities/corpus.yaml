- id: 433c4460-042a-5ffc-a304-b21d57e742c1
  title: NISA（成長投資枠）：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの大切な資産を守るため、セキュリティ対策を徹底しております。NISA（成長投資枠）のご利用にあたり、以下の点に十分ご注意ください。


    【当社の本人確認について】

    口座情報の変更などの重要な手続きを行う際、当社は必ず本人確認を実施いたします。確認項目は、お客様の「フルネーム」と「生年月日」の照合のみです。これ以外の認証ステップや、機密情報の要求を行うことはございません。


    【ご注意いただきたい点】

    当社がメールや電話で、以下の情報を求めることは絶対にございません。心当たりのない要求があった場合は、詐欺の可能性がありますので十分にご注意ください。

    ・暗証番号やパスワード

    ・クレジットカードのセキュリティコード

    ・ワンタイムパスワード


    【万一、不審な点を感じたら】

    身に覚えのない取引通知が届いた場合や、個人情報の流出が疑われる場合は、直ちにお知らせください。迅速に調査し、透明性のあるプロセスで対応いたします。また、解決に至らない苦情や紛争については、証券・金融商品あっせん相談センター（FINMAC）へご案内させていただきます。


    詳細は「NISA（成長投資枠）：リスクについてのご説明」でもご確認いただけます。'
