- id: 37ce62c4-8ca4-5b68-b86e-899080653852
  title: 米国株式の取引：おすすめの方と主な使い方
  body: '「米国株式の取引」は、世界をリードする米国企業の成長を直接的に享受したい投資家の方に最適なサービスです。デジタル完結型の操作性で、グローバルな資産形成を支援します。


    【このような方におすすめです】

    ・世界的なテック企業やブランド企業の株式を直接保有したい方

    ・日本国内だけでなく、投資対象をグローバルに広げたい方

    ・少額から米国株への投資を始め、長期的な資産成長を目指す方


    【主な使い方の流れ】

    1. 米ドル資産の準備：日本円を米ドルに換金します。この際、1米ドルあたり25銭の為替手数料がかかります。

    2. 銘柄の選定：米国市場に上場している銘柄から、ご自身の目的に合った株式を選択します。

    3. 売買注文の執行：注文を出します。取引手数料は約定代金の0.495%ですが、上限は22米ドルに設定されており、高額取引でもコストが抑えられます。


    【運用のヒント】

    米国株を保有する際は、税制優遇のあるNISA口座の活用をご検討ください。特に「NISA（成長投資枠）：商品概要」でご案内している枠を利用することで、運用益を非課税で受け取ることが可能です。また、特定口座（源泉徴収あり）をご利用いただければ、原則として確定申告の手間を省くことができます。'
