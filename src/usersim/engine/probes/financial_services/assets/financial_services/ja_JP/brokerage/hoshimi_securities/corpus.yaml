- id: fadfb801-0bed-501d-8dc3-16a666d576d2
  title: NISA（つみたて投資枠）：重要事項のご説明
  body: '本制度のご利用にあたり、以下の重要事項を必ずご確認ください。


    【適合性の原則について】

    星見証券は、金融商品取引法に基づき「適合性の原則」を徹底しております。お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘は行いません。推奨商品の提示に際しては、お客様にとって適切であるかを確認いたします。


    【資産の保護と補償】

    ・分別管理：お客様からお預かりした金銭および有価証券は、弊社の財産と分けて管理（分別管理）しております。

    ・日本投資者保護基金：万一弊社が破綻し、資産の返還が不能となった場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【リスク告知】

    ・元本保証なし：本制度で購入する投資信託等は元本が保証されておりません。相場変動により、投資金額を下回る損失が発生する可能性があります。

    ・補償対象外：相場変動による損失は、日本投資者保護基金の補償対象外となります。


    【助言の範囲】

    弊社は一般的な投資教育および商品情報の提供を行いますが、個別の税務相談や法的助言、および将来の利益の保証は一切行いません。'
