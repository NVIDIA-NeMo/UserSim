  title: iDeCo（個人型確定拠出年金）：金利・料率の決まり方と適用
  body: 'iDeCo（個人型確定拠出年金）に適用される手数料体系についてご案内いたします。


    【運営管理手数料】

    星見証券の運営管理機関手数料は 0円 です。すべての加入者様に一律で適用され、資産残高や拠出額に関わらず無料となります。


    【公的制度手数料】

    以下の手数料は、国民年金基金連合会により定められたものであり、一律に適用されます。

    ・加入時手数料：2,829円（加入時に一度のみ発生します）

    ・毎月の手数料：186円（2026年12月分から適用されます）


    【適用タイミング】

    運営管理手数料 0円 は口座開設時から適用されます。公的制度手数料については、加入手続き完了時および2026年12月以降の毎月の拠出時にそれぞれ適用されます。運用商品の利回り（金利）については、選択される商品ごとに異なりますので、個別商品詳細をご確認ください。'
