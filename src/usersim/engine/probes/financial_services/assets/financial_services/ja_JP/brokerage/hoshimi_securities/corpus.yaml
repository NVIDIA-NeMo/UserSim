  title: NISA（つみたて投資枠）：必要書類
  body: '| 必要書類 | 提出の条件・目的 | 備考 |

    | :--- | :--- | :--- |

    | マイナンバーカード | 全員必須（口座開設・税制適用） | 通知カード＋本人確認書類でも可 |

    | 本人確認書類 | 全員必須（住所・氏名の確認） | 運転免許証、パスポート等 |

    | 住民票または公共料金領収書 | 現住所が確認できない場合 | 発行から6ヶ月以内のもの |

    | 法定代理人の同意書 | 未成年者が申し込む場合 | 親権者の署名・捺印が必要 |'
