- id: f1ca1eec-becb-5ea9-b7a8-52359e5b12c8
  title: NISA（成長投資枠）：解約・変更・プランの切替え
  body: 'NISA（成長投資枠）の口座解約、金融機関の変更、およびプランの切替え手続きについてご案内します。


    【お手続き前にご用意いただくもの】

    ・ご本人様確認のための情報（フルネームおよび生年月日）


    【お手続きの手順】

    1. 本人確認の実施

    まず、お客様の「フルネーム」と「生年月日」をお伝えください。当社にて照合を行い、ご本人様であることを確認いたします。


    2. ご要望の提示

    「NISA口座の解約をしたい」「他社へ金融機関を変更したい」など、具体的なご希望をお伝えください。


    3. 手続き内容の確認と申請

    担当者が変更内容や、現在の非課税保有限度額（最大12,000,000円）の状況についてご説明し、申請処理を行います。


    4. 完了通知の受領

    お手続きが完了次第、確定した内容を通知いたします。これにより、次回の投資枠の適用や他社での口座開設が可能になります。


    なお、手続きに必要な書類について詳しく知りたい方は、「NISA（成長投資枠）：必要書類」をご確認ください。'
