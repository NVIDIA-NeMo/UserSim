- id: b26012ec-2a01-59d6-a672-7811af306fae
  title: NISA（つみたて投資枠）：リスクについてのご説明
  body: 'NISA（つみたて投資枠）を利用して投資信託等で運用される際は、以下のリスクを十分にご理解ください。


    【元本保証の不担保】

    本商品による運用は、元本が保証されておりません。投資した金額を下回る可能性があります。相場変動による損失は、いかなる場合も補償の対象外となります。


    【価格変動リスク】

    投資信託の基準価額は、組み入れ資産の価格変動により日々変動します。これにより、運用結果がマイナスとなるリスクがあります。


    【制度上の制限】

    年間投資枠（1,200,000円）および非課税保有限度額（18,000,000円）があるため、限度額を超えて非課税運用することはできません。


    【資産保護について】

    弊社は金融商品取引法に基づき、顧客資産を分別管理しております。万一弊社が破綻し、資産が返還されない場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、これはあくまで制度上の補償であり、運用の損失を補填するものではないことを明確に告知いたします。'
