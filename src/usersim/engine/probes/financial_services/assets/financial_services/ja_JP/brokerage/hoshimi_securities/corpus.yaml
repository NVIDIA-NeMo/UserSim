- id: 9a97c740-ba6b-5df0-a50f-b02e398c1410
  title: NISA（つみたて投資枠）：ご紹介・継続利用の特典
  body: '星見証券では、お客さまの長期的な資産形成を支援するため、NISA（つみたて投資枠）の継続的なご利用を推奨しております。本制度を継続的にご利用いただくことで、非課税保有限度額である18,000,000円を最大限に活用し、効率的な資産成長を目指すことが可能です。


    また、ご友人やご家族に星見証券をご紹介いただき、新しく口座を開設された方への特典をご用意しております。デジタル完結の手軽さと、年間投資枠1,200,000円をフルに活用できる透明性の高い環境を、ぜひ大切な方にも共有してください。詳細なキャンペーン期間および適用条件については、最新の「NISA（つみたて投資枠）：実施中のキャンペーン」をご確認ください。'
