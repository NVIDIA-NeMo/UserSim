- id: 84e32442-dd95-5051-946e-b783d2cdecbf
  title: iDeCo（個人型確定拠出年金）：ご利用開始までの手順
  body: '【サポート担当者向け：iDeCo（個人型確定拠出年金）開設フロー】


    お客様がiDeCoの利用を開始するまでの手順は以下の通りです。各ステップにおいて、正確な案内を行い、必要書類の不備を防止してください。


    1. 適合性の確認と案内

    お客様の知識、経験、投資目的を確認し、iDeCoが適切であるかを確認します。掛金が全額所得控除となり、効率的に老後資金を準備できる点、および原則60歳まで引き出せない制限を明確に伝えてください。


    2. 本人確認の実施

    手続き前に、お客様の「フルネーム」と「生年月日」を照合し、本人確認を完了させてください。


    3. 必要書類の案内と届出

    口座開設にはマイナンバーの届出が必要です。国民年金基金連合会への加入申請手続きを案内します。この際、加入時の手数料として2,829円が発生することを説明してください。


    4. 掛金設定の決定

    掛金の最低額（月額）は5,000円からであることを案内し、お客様のご希望額を設定します。2026年12月分からの上限額（会社員：62,000円、自営業者：75,000円）についても、長期的な計画に合わせて提示してください。


    5. 運用商品の選択

    提示する商品は、お客様の特性に照らして適切であることを確認し、選択をサポートします。星見証券の運営管理機関手数料は0円です。'
