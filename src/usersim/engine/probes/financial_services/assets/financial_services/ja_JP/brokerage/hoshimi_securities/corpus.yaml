- id: 6076c17c-de18-5e26-9d3f-434eea75d2cf
  title: 特定口座（源泉徴収あり）：金利・料率の決まり方と適用
  body: '「特定口座（源泉徴収あり）」に適用される主要な料率および手数料についてご案内します。


    【適用料率】

    ・上場株式等の譲渡益・配当にかかる税率：20.315%

    この料率は法定税率であり、すべてのお客さまに一律に適用されます。利益が発生した時点（決済時）で自動的に計算され、差し引かれます。


    【適用手数料】

    ・国内株式の売買手数料：0円

    取引金額や回数にかかわらず、一律0円となります。これにより、投資への経済的ハードルを最小限に抑えています。


    【料率の変更について】

    税率は日本の税法に基づいております。法改正が行われた場合は、それに準じて適用される税率が変更されます。手数料については、当社のサービス方針またはインフラ維持コストの変動に基づき改定される場合があり、その際は事前に通知いたします。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 6e7be8ce-4d6e-538a-adf4-bb8f5e3d0dc5
  title: 特定口座（源泉徴収あり）：ご紹介・継続利用の特典
  body: '星見証券では、新しく資産形成を始める方を応援するため、特定口座（源泉徴収あり）のご開設と継続的なご利用をサポートする特典をご用意しております。


    【特典内容】

    国内株式の売買手数料を、永続的に0円で提供いたします。投資への経済的ハードルを最小限に抑え、長期的な資産成長を支援します。


    【対象となる方】

    ・新しく特定口座（源泉徴収あり）を開設される方

    ・星見証券のご紹介を通じて口座開設される方


    手間のかかる確定申告を原則不要とする利便性と、業界最安水準の手数料体系をぜひご活用ください。詳細については「特定口座（源泉徴収あり）：国内株式の売買手数料について」をご確認ください。'
