  body: '【新NISA活用応援キャンペーン実施中】


    星見証券でNISA（成長投資枠）を初めてご利用いただくお客様を対象に、資産形成のスタートを後押しする特典をご用意いたしました。


    ■ キャンペーン期間

    2024年4月1日から2024年12月31日まで


    ■ 特典内容

    期間中にNISA（成長投資枠）での初回買い付けを完了されたお客様全員に、投資サポート金として1,000円を贈呈いたします。


    ■ 条件

    ・期間内にNISA（成長投資枠）の口座開設を完了していること

    ・期間中に1回以上の買い付け（金額不問）を行っていること


    ■ お受け取り方法

    条件を満たしたお客様の証券口座へ、翌月第3営業日までに自動的に入金されます。


    日々の資産成長を、手数料0円の国内株式取引とともにぜひご体験ください。'
