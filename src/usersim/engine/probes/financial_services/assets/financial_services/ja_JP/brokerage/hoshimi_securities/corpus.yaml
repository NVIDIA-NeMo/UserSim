- id: 44b91b3f-4e49-5082-a494-032feef7302c
  title: NISA（成長投資枠）：個人情報の取扱い
  body: '星見証券（以下、当社）は、NISA（成長投資枠）の提供にあたり、お客様の個人情報を金融商品取引法および個人情報保護法に基づき、厳重に管理いたします。


    ■ 利用目的

    ご提供いただいた個人情報は、以下の目的のみに使用されます。

    ・NISA口座の開設審査および税務署への届出手続き

    ・口座管理、取引執行、および法令に基づく報告書の作成

    ・適合性の原則に基づく、適切な商品情報の提供


    ■ 第三者提供について

    当社は、法令に基づき、税務署および日本証券業協会などの規制当局への報告が必要な場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    ■ 本人確認の限定

    当社のセキュリティポリシーに基づき、重要な手続きにおける本人確認は「フルネーム」と「生年月日」の照合のみで行います。これ以外の機密情報を要求することはございません。


    ■ 安全管理措置

    お客様の資産および情報は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。なお、相場変動による損失は補償対象外となりますことをあわせて告知いたします。'
