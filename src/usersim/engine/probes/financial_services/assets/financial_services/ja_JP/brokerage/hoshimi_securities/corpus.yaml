- id: aed44c8a-be8d-5840-969a-c989050ae059
  title: NISA（成長投資枠）：状況・履歴の確認
  body: 'NISA（成長投資枠）のご利用状況および取引履歴を確認する手順をご案内いたします。本手続きはデジタルチャネルを通じて完結します。


    【事前準備】

    ご本人様確認のため、フルネームと生年月日をお手元にご用意ください。


    【確認手順】

    1. ヘルプデスクまたはチャットサポートにて、「NISA（成長投資枠）の利用状況と履歴を確認したい」旨を伝えてください。

    2. 担当者より本人確認のため、フルネームと生年月日の照合を求められますので、回答してください。

    3. 本人確認完了後、現在の「非課税保有限度額（12,000,000円）」に対する利用額、および本年の「年間投資枠（2,400,000円）」の消化状況を確認し、提示いたします。

    4. 直近の取引履歴（約定日、銘柄、数量、約定代金）について詳細を提示いたします。


    【完了の確認】

    提示された内容が、お客さまご自身の記録と一致しているかをご確認ください。国内株式の場合、受渡しは約定日の2営業日後となるため、履歴上の反映タイミングにご留意ください。'
