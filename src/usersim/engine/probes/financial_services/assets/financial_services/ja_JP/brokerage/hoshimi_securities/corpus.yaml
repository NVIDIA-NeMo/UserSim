- id: f02681c2-7c87-56e4-9e77-f71071aa8886
  title: NISA（つみたて投資枠）：この商品をかたる詐欺にご注意ください
  body: '星見証券では、お客様の資産形成を誠実に支援いたしますが、最近、当社の「NISA（つみたて投資枠）」をかたる巧妙な詐欺への注意喚起をお願いしております。


    【特にご注意いただきたい点】

    ・「元本を保証し、必ず利益が出る」という勧誘：投資信託を含む金融商品は相場変動により損失が生じるリスクがあり、当社が利益を保証することは絶対にございません。

    ・「特別な投資枠や優先的な配分がある」という誘い：NISAの制度および投資枠（年間投資枠 1,200,000円など）は法令に基づいた一律のルールであり、個別の特別な枠は存在しません。


    【星見証券の本人確認について】

    当社が口座情報の変更等の重要なお手続きを行う際、お客様に照会するのは「フルネーム」と「生年月日」のみです。パスワード、暗証番号、二要素認証のコード、または機密情報を電話やメールで要求することはございません。


    万一、不審な連絡を受けた場合や、詐欺の疑いがあると感じられた場合は、すぐに当社のヘルプデスクまでお知らせください。迅速に調査プロセスを提示し、誠実に対応いたします。'
