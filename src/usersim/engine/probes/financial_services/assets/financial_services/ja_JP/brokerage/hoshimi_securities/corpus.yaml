- id: 0658539c-3ae5-5dab-ad5d-3c270365e12c
  title: NISA（つみたて投資枠）：切替えや上位プランを検討するとき
  body: '顧客から「より柔軟に投資したい」等の要望があった際、NISA（成長投資枠）との切り替え・併用を検討します。


    【比較ポイント】

    ・NISA（つみたて投資枠）：長期的な資産形成を目的とし、少額（最低100円）からコツコツと積み立てる仕組みです。年間投資枠は1,200,000円です。

    ・NISA（成長投資枠）：株式などの幅広い商品に柔軟に投資でき、年間投資枠は2,400,000円とより大きな金額の運用が可能です。


    【適したケース】

    ・つみたて投資枠が向く方：リスクを抑えて長期的に、自動的に資産を増やしたい方。

    ・成長投資枠への切り替え・併用が向く方：個別の株式への投資を検討している方や、より積極的な運用で利益を追求したい方。


    両枠は併用可能です。顧客の知識、経験、目的に照らし、適合性の原則に基づいたご提案を行ってください。'
