- id: 7eacbef1-10f5-55ed-bd1c-7bb62b344e28
  title: 米国株式の取引：状況・履歴の確認
  body: "保有している米国株式の状況や、過去の取引履歴を確認する手順をご案内します。\n\n【事前準備】\nお手元にご登録のお名前と生年月日をご用意ください。\n\
    \n【確認の手順】\n1. お客さまの「フルネーム」と「生年月日」をお伝えいただき、ご本人確認を完了させてください。\n2. 確認したい内容（例：「現在の保有銘柄と評価額を知りたい」「過去1ヶ月の取引履歴を詳しく確認したい」など）を弊社へお伝えください。\n\
    3. 弊社にて最新の口座情報を照会し、以下の内容をお答えします。\n   - 保有銘柄名および数量\n   - 現在の市場価格および評価損益\n   - 約定日、約定単価、約定数量、および適用された取引手数料（0.495%）を含む取引明細\n\
    4. 内容に相違がないかご確認いただき、手続き完了となります。\n\n【完了の確認】\nご案内した内容が、お手元の記録や想定される取引内容と一致していることで完了となります。詳細な明細書が必要な場合は、別途発行手続きについてお問い合わせください。"
