- id: 1b4b73e4-6f26-5321-a509-8f16ae77b4a1
  title: 投資信託の積立：クレジットカード積立のポイント還元率について
  body: 'Q：クレジットカード積立を利用すると、ポイント還元はありますか？

    A：はい。星見証券のクレジットカード積立をご利用いただくと、0.5%のポイント還元率が適用されます。効率的な資産形成とあわせて、ポイントを貯めることが可能です。


    Q：還元率は積立金額に応じて変動しますか？

    A：いいえ。クレジットカード積立におけるポイント還元率は、一律で0.5%となります。


    Q：クレジットカード積立に上限はありますか？

    A：はい。クレジットカード積立の上限（月額）は100,000円までとなっております。これ以上の金額を積み立てたい場合は、現金による積立をご検討ください。プランの詳細は「投資信託の積立：プランの選び方」をご覧ください。'
