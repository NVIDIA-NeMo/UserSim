  title: NISA（成長投資枠）：手数料一覧
  body: 'NISA（成長投資枠）における主要商品の取引手数料は以下の通りです。


    ■ 国内株式の売買手数料：0円

    （成長投資枠を利用した国内株式の取引において適用されます）


    ■ 海外取引等の手数料

    海外株式等の取引については、インフラ維持および規制遵守コストとして別途手数料を設定しております。詳細な料率については、各商品詳細ページをご確認ください。


    ■ 口座維持手数料

    0円


    ※本制度を利用した取引であっても、商品自体に内包される信託報酬等のコストが発生する場合がございます。'
