- id: 19ff7511-2415-5557-a74a-d6a2dcec45db
  title: iDeCo（個人型確定拠出年金）：掛金の最低額（月額）について
  body: '【よくあるご質問】


    Q：iDeCoを始める際、毎月最低いくらから積み立てることができますか？


    A：iDeCo（個人型確定拠出年金）の掛金の最低額（月額）は5,000円です。5,000円から、お選びいただいたプランの限度額まで、1,000円単位で設定いただけます。


    Q：掛金の金額は途中で変更できますか？


    A：はい、変更可能です。変更の手続き方法については、「iDeCo（個人型確定拠出年金）：登録内容の変更」をご参照ください。


    Q：少額からでも節税メリットはありますか？


    A：はい。拠出した掛金は全額が所得控除の対象となるため、金額に関わらず所得税や住民税の軽減効果が得られます。'
