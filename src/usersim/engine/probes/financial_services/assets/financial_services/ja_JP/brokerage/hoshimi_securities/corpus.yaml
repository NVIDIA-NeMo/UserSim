- id: 550cddd4-ed82-5a7c-b6a6-76b577a09ec2
  title: 投資信託の積立：個人情報の取扱い
  body: '星見証券は、金融商品取引法および個人情報保護法に基づき、お客様からお預かりした個人情報を厳重に管理いたします。投資信託の積立サービスにおける個人情報の取扱いは以下の通りです。


    1. 利用目的

    ご提供いただいた個人情報（氏名、生年月日、クレジットカード情報等）は、積立注文の執行、決済処理、および法令に基づく本人確認のためにのみ利用いたします。特にクレジットカード積立においては、決済代行会社およびカード発行会社と必要な情報を共有し、適切に処理いたします。


    2. 安全管理措置

    顧客資産は分別管理されており、個人情報についてもアクセス制限を設けたセキュアな環境で管理しています。また、本人確認においては「フルネーム」と「生年月日」の照合のみを実施し、不要な機密情報の収集を排除することでリスクを最小限に抑えています。


    3. 第三者提供

    法令に基づく場合、または金融庁等の監督官庁による検査・監査がある場合を除き、お客様の同意なく第三者に個人情報を提供することはありません。


    4. リスク告知

    投資信託の積立による資産形成において、元本は保証されません。相場変動により投資元本を割り込む可能性があります。また、日本投資者保護基金による補償（1人当たり1,000万円まで）は、証券会社の破綻による資産返還不能時に適用されるものであり、相場変動による損失は補償対象外となりますことをあらかじめご了承ください。'
