- id: 25320346-db16-585d-9d0b-f1e275e1437f
  title: 米国株式の取引：プランの選び方
  body: '星見証券では、投資目的やリスク許容度に合わせて、国内株式と米国株式の使い分けをご提案しています。


    ■ 米国株式の取引

    ・特徴：世界的な成長企業の株に直接投資でき、グローバルな成長を享受できます。

    ・コスト：取引手数料は約定代金の0.495%（上限22米ドル）、および1米ドルあたり25銭の為替手数料がかかります。

    ・向き：積極的な資産成長を目指し、為替変動リスクを許容できる方。


    ■ 国内株式の取引

    ・特徴：身近な日本企業の成長を支援でき、心理的・経済的ハードルが極めて低いです。

    ・コスト：主要商品の取引手数料は0円です。

    ・向き：まずは低コストで投資を始めたい方、安定した国内資産を形成したい方。


    どちらのプランも、顧客資産は分別管理されており、安全な運用を支援します。'
