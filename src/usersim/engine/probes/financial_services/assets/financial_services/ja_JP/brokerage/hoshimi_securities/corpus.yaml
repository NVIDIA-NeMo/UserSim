- id: b3a2a441-75a5-5afe-8f26-ec1a11242297
  title: 投資信託の積立：解約・変更・プランの切替え
  body: '積立プランの変更や解約の手続きは、以下の手順で簡単に行っていただけます。


    【ご準備いただくもの】

    ・ご本人様確認のための「フルネーム」と「生年月日」


    【お手続きの手順】

    1. 担当者へ「積立設定の変更」または「解約」を希望する旨を伝えます。

    2. 本人確認のため、フルネームと生年月日をお伝えください。照合が完了し、お手続きへ進みます。

    3. 変更内容（積立金額の増減、または解約）を伝えます。金額を変更される場合は、積立の最低金額である100円以上で設定してください。

    4. クレジットカード積立をご利用の場合、クレジットカード積立の上限（月額）である100,000円の範囲内であることを確認します。

    5. 担当者が設定変更の内容を復唱し、お客様の同意を得た後、処理を確定させます。

    6. 設定変更完了の通知を受け取り、手続き完了となります。


    【ご確認事項】

    次回の買付日に反映させるためには、所定の締切日までの手続きが必要です。具体的な締切日や制限については、「投資信託の積立：クレジットカード積立の上限（月額）について」も併せてご確認ください。'
