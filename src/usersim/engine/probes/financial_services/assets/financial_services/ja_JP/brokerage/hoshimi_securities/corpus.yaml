- id: eb6b36c8-2d9f-548e-82d6-87aca45f13a9
  title: iDeCo（個人型確定拠出年金）：この商品をかたる詐欺にご注意ください
  body: '星見証券では、お客様の資産を守るため、iDeCo（個人型確定拠出年金）をかたる不審な勧誘や詐欺への注意喚起を行っております。


    【想定される詐欺の手口】

    「iDeCoの運用益を保証する」「限定の特別プランがある」といった虚偽の内容で、資産の移管や個人情報を要求するケースが報告されています。星見証券および公的な運営管理機関が、利益を保証することを約束したり、個別の税務相談を電話やメールで強要したりすることはありません。


    【星見証券の確認方法について】

    当社が口座情報の変更などの重要な手続きを行う際は、必ずお客様の「フルネーム」と「生年月日」の照合のみで本人確認を実施します。それ以外の認証ステップや、機密情報の要求（パスワード、暗証番号、クレジットカード番号など）は一切行いません。このような要求があった場合は、詐欺の可能性が非常に高いため、絶対に応じないでください。


    【不審な点を感じたとき】

    もし不審な連絡を受けたり、被害に遭われた疑いがある場合は、速やかに当社ヘルプデスクまでお知らせください。また、解決に至らない苦情や紛争については、証券・金融商品あっせん相談センター（FINMAC）へご案内しております。


    お客様の大切な資産を守るため、不審な連絡には十分ご注意ください。'
