- id: 08baa63b-2538-5334-a90e-e614149313b0
  title: NISA（つみたて投資枠）：年間投資枠について
  body: '【Q】NISA（つみたて投資枠）で1年間に投資できる金額はいくらまでですか？

    【A】年間投資枠は1,200,000円です。この金額を超えて投資することはできません。


    【Q】年間の投資枠を使い切った後、商品を売却するとどうなりますか？

    【A】売却した商品の取得価額（購入時の金額）分だけ、翌年以降に非課税保有限度額の枠を再び利用することが可能です。


    【Q】年間投資枠は、他のNISA枠と合算されますか？

    【A】はい。NISA（成長投資枠）と併用する場合、合計の年間投資枠は3,600,000円となります。本枠の1,200,000円と成長投資枠の2,400,000円を合わせてご利用いただけます。


    詳細な条件については「NISA（つみたて投資枠）：商品概要」をご参照ください。'
