  - withdraw_funds
  institution_id: hoshimi_securities
- id: a2aae9c3-853b-5d1a-b6e9-093ee0aa532a
  title: update_beneficiary を使う場面
  body: 'お客様が、出金先として登録している銀行口座（受取人口座）の変更を希望される場合にこの手続きを行います。誤った口座への出金を防ぐため、正確な口座情報を確認してください。


    1. 本人確認を実施します。お客様から「フルネーム」と「生年月日」を確認し、verify_identity を呼び出して照合してください。

    2. 対象となる口座を特定します。お客様から口座番号の下4桁を伺い、get_accounts を呼び出して、該当する口座の account_id を取得してください。

    3. 出金先口座の変更を実行します。取得した account_id と、新しく登録する銀行口座の情報（銀行名、支店名、口座種別、口座番号、名義人名）を指定して
    update_beneficiary を呼び出します。


    本手続きにより、今後の出金時に利用される銀行口座が更新されます。変更完了後、正しく更新されたことをお客様へお伝えください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: hoshimi_securities
- id: a83b0857-ac10-5de8-96f4-83818ca594e0
  title: update_beneficiary ツールリファレンス
  body: 'このツールは、出金先として登録している銀行口座を変更するために使用します。エージェントはこのツールを直接呼び出すことで口座情報の更新を行います。


    【引数】

    ・account_id：変更対象の証券口座の識別子（get_accounts 等で取得します）

    ・bank_details：新しく登録する銀行口座の詳細情報（銀行名、支店名、口座番号、名義人など）


    【効果】

    指定された証券口座に紐づく出金先銀行口座が更新されます。以後の出金手続きはすべてこの新しい口座に対して行われます。本ツールを呼び出す前に、必ず verify_identity
    による本人確認を完了させてください。'
