- id: 12d80971-abcf-5f46-9973-2381f4344710
  title: 投資信託の積立：積立の最低金額について
  body: '【Q】積立投資を始めたいのですが、最低いくらから設定できますか？


    【A】「投資信託の積立」の積立の最低金額は100円です。非常に少額から設定が可能ですので、まずは無理のない金額から資産形成を始めていただくことをおすすめしております。


    【Q】積立金額は後から変更できますか？


    【A】はい、可能です。お客様のご状況に合わせて、いつでも積立金額の変更がお手続きいただけます。変更後の金額についても、積立の最低金額である100円以上であれば設定いただけます。詳細な変更手順については、担当スタッフまでお問い合わせください。'
