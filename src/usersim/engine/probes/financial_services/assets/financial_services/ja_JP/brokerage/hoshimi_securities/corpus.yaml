  institution_id: hoshimi_securities
- id: 8bf6cc46-5832-57be-b235-75df63e992f3
  title: iDeCo（個人型確定拠出年金）：商品概要
  body: 'iDeCo（個人型確定拠出年金）は、ご自身で掛金を拠出し、運用して老後資金を準備する私的年金制度です。最大のメリットは、掛金が全額所得控除の対象となるため、効率的に資産形成ができる点にあります。


    【運用のルールと制限】

    ・掛金の最低額（月額）：5,000円

    ・会社員の掛金の上限（月額、2026年12月分から）：62,000円

    ・自営業者の掛金の上限（月額、2026年12月分から）：75,000円

    ・原則として60歳まで資産を引き出すことはできません。


    【手数料体系】

    ・加入時の手数料（国民年金基金連合会）：2,829円

    ・毎月の手数料（2026年12月分から）：186円

    ・運営管理機関手数料（星見証券）：0円


    星見証券では、運営管理機関としての手数料を0円に設定し、お客様の長期的な資産形成を支援します。運用商品は、お客様の知識、経験、目的に照らして適切であるかを確認した上でご提示します。なお、運用成果によっては元本を割り込むリスクがあり、利益を保証するものではありません。


    詳細なリスクについては「iDeCo（個人型確定拠出年金）：重要事項のご説明」をご参照ください。'
  domain: brokerage_investing
  product_category: ideco
  document_type: product_sheet
  source_authority: official
