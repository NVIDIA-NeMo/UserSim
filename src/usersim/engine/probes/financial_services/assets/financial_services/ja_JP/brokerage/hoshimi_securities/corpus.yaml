- id: 49ce3b5d-2cbb-5188-89e1-02369bf40502
  title: 米国株式の取引：ほかの選択肢との比較と向かない場合
  body: '「米国株式の取引」をご検討の方へ、他の運用手段との比較および本商品が適さないケースについてご説明します。


    【他の選択肢との比較】

    米国株式への直接投資は、米国企業の成長をダイレクトに享受できる点が最大の魅力です。一方で、「投資信託の積立」などの商品と比較すると、分散投資の管理を自分で行う必要があり、銘柄選定の知識と経験が求められます。また、取引ごとに0.495%（上限22米ドル）の手数料と、1米ドルあたり25銭の為替手数料が発生するため、少額の頻繁な売買ではコスト負担が相対的に大きくなる傾向があります。


    【本商品に向かない場合】

    以下に該当される方は、他の商品（NISAのつみたて投資枠など）を優先的にご検討ください。

    - 元本保証を希望される方：米国株式は相場変動により元本を割り込むリスクがあり、損失は補償されません。

    - 為替変動リスクを避けたい方：米ドル建て資産であるため、株価が上昇しても円高が進めば円建ての評価額が下落します。

    - 個別銘柄の分析や管理に時間を割けない方：運用の手間を最小限にしたい場合は、投資信託による自動積立が適しています。


    弊社では「適合性の原則」に基づき、お客さまの目的に照らして最適な商品をご提案いたします。'
