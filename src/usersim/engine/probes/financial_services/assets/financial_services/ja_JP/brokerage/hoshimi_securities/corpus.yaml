  title: set_up_investment_plan ツールリファレンス
  body: 'このツールは、投資信託の積立プランの設定および変更を行うために使用します。エージェントは、お客様の希望条件を確認後、本ツールを直接呼び出すことで設定を反映させます。


    【機能】

    投資信託の自動積立における金額、頻度、および決済方法（証券口座またはクレジットカード）を登録または更新します。


    【引数】

    - `account_id`: `get_accounts` 等で特定したお客様の口座識別子

    - `product_id`: 積立対象の投資信託商品ID

    - `amount`: 積立金額（円）

    - `frequency`: 積立頻度

    - `payment_method`: 決済手段（証券口座またはクレジットカード）


    ※`verify_identity` による本人確認完了後にのみ実行可能です。'
