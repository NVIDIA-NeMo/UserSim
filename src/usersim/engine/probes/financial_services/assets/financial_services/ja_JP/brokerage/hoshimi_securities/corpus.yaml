- id: 51ea7d42-5d4f-59be-bf39-61ffc6b6844f
  title: 法令・制度に関するご案内：株式・投資信託・NISA・iDeCo
  body: '星見証券は、金融庁および日本証券業協会の監督下で、金融商品取引法に基づき適切に運営されています。


    【資産の管理と保護】

    お客様からお預かりした金銭や有価証券は、弊社の財産と分けて管理する「分別管理」を徹底しております。万一、弊社が破綻し資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による損失は補償の対象外となりますのでご注意ください。


    【適合性の原則と最善の利益】

    弊社は「適合性の原則」に基づき、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わず、常にお客様の最善の利益を追求して業務を行います。


    【税制について】

    上場株式等の譲渡益と配当には20.315%の税金がかかります。ただし、NISA口座で得た利益は非課税となります。


    【制度上の留意点】

    iDeCoは確定拠出年金法に基づく制度であり、弊社は運営管理機関として運用商品の提示や情報提供を行います。また、証券口座の開設にはマイナンバーの届出が必須となります。


    弊社は利益を保証せず、個別の税務相談や法的助言は行いません。'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 6a57e4f6-035f-5a1c-9eee-2e58d124c77c
  title: get_positions を使う場面
  body: 'お客様から保有資産の状況や現在のポジションについて問い合わせがあった際に、最新の資産状況を確認するために get_positions を使用します。


    【手続き手順】

    1. 本人確認の実施

    まず、verify_identity を呼び出し、お客様から伺った「フルネーム」と「生年月日」を照合して本人確認を完了させてください。


    2. アカウントIDの特定

    お客様が口座番号の下4桁のみを提示している場合は、get_accounts を呼び出して、該当するアカウントの account_id を特定してください。


    3. 保有ポジションの取得

    特定した account_id を引数として get_positions を呼び出し、現在の保有商品および数量を確認します。


    4. 情報の提示

    取得した情報をもとに、丁寧な「です・ます」調で、お客様の現在の資産状況を案内してください。'
