- id: 0bc5b223-0ce5-5f09-a20f-55b498cd45a6
  title: iDeCo（個人型確定拠出年金）：規定・約款の変更
  body: '本規定は、星見証券が運営管理機関として提供するiDeCo（個人型確定拠出年金）の利用条件を定めるものです。法令の改正や制度の変更に伴い、約款の内容を改定することがあります。


    ■手数料の改定と適用

    iDeCoの運営に関わる手数料は、以下の通り定めております。これらの金額に変更が生じる場合は、事前にお客様へ通知いたします。

    ・加入時の手数料（国民年金基金連合会）：2,829円

    ・毎月の手数料（2026年12月分から）：186円

    ・運営管理機関手数料（星見証券）：0円


    ■拠出限度額の変更

    確定拠出年金法の改正に基づき、2026年12月分の掛金から、以下の拠出限度額が適用されます。

    ・会社員の方：月額62,000円まで

    ・自営業の方：月額75,000円まで

    （※それぞれ、企業年金や国民年金基金の掛金との合算額となります）


    ■義務と責任

    お客様は、最新の規定を確認し、適切に口座を管理する義務を負います。当社は、金融商品取引法に基づき「適合性の原則」を徹底し、お客様の最善の利益を追求して業務を行います。なお、原則として60歳まで資産を引き出すことはできませんので、十分にご留意ください。'
