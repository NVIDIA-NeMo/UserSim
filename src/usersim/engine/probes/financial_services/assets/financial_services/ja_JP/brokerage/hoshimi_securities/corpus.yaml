- id: 84febc6d-17df-51c8-b00d-c59e54d6b2e8
  title: iDeCo（個人型確定拠出年金）：安全にご利用いただくためのポイント
  body: '星見証券では、お客様のの大切な資産と個人情報を守るため、セキュリティ対策を徹底しております。iDeCo（個人型確定拠出年金）を安全にご利用いただくために、以下の点にご注意ください。


    ■本人確認について

    口座情報の変更など、重要な手続きを行う際は、必ずお客様の本人確認を実施いたします。当社の確認ステップは、お客様の「フルネーム」と「生年月日」の照合のみで行います。


    ■このような要求にはご注意ください

    当社が、電話やメール、チャット等で以下のような情報を要求することは絶対にございません。

    ・暗証番号（PIN）やログインパスワード

    ・クレジットカードのセキュリティコード

    ・ワンタイムパスワードなどの認証コード


    ■不審な点を感じたときは

    「身に覚えのない通知が届いた」「不審な連絡があった」など、少しでも不安を感じられた場合は、直ちにお問い合わせください。迅速に調査プロセスを提示し、誠実に対応いたします。


    また、相場変動による損失は日本投資者保護基金の補償対象外となります。投資判断は、ご自身の責任において慎重に行っていただきますようお願いいたします。'
