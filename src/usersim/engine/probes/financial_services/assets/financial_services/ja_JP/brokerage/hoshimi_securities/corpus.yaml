- id: 326e032c-7e0d-513a-8306-d5bd30c4e892
  title: NISA（成長投資枠）：重要事項のご説明
  body: '本制度のご利用にあたり、以下の重要事項を必ずご確認ください。


    【適合性の原則とリスク告知】

    弊社は金融商品取引法に基づき、「適合性の原則」を徹底しております。顧客の知識、経験、財産の状況、投資目的に照らして不適当な勧誘は行いません。ただし、投資信託や株式等の金融商品は元本が保証されておりません。相場変動により投資元本を割り込むおそれがあり、その損失は補償の対象外となります。


    【資産の保護】

    お客様からお預かりした資産は「分別管理」により、弊社の固有財産と分けて厳格に管理されます。万一、弊社が破綻し資産の返還が不能となった場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【税制について】

    NISA口座内での運用益および配当金は非課税となります。一方、特定口座等の課税口座では上場株式等の譲渡益と配当に20.315%の税金が課されます。


    【免責事項】

    弊社は一般的な投資教育および商品情報の提供を行いますが、個別の税務相談や法的助言、および将来の利益の保証は一切行いません。'
