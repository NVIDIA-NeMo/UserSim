- id: ecbd6841-68f6-5994-8001-278686e39fa2
  title: 投資信託の積立：お申込みとご利用条件
  body: 'Q：積立投資を始めるために、最低いくらから設定できますか？


    A：積立の最低金額は100円からとなっております。少額から無理なく、コツコツと資産形成を始めていただけます。


    Q：クレジットカードで積立を行いたいのですが、上限はありますか？


    A：はい。クレジットカード積立の上限（月額）は100,000円までとなっております。これを超える金額を積立したい場合は、他の決済手段をご検討ください。


    Q：利用にあたって必要な条件はありますか？


    A：星見証券の口座をお持ちであること、および、ご希望の商品がお客様の知識や経験、投資目的に照らして適切であること（適合性の原則）を確認させていただきます。また、口座開設時にマイナンバーの届出が完了している必要があります。'
