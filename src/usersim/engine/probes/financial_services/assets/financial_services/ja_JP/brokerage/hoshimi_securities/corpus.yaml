- id: afe7ce7c-aafc-5717-980f-b73bc622a641
  title: iDeCo（個人型確定拠出年金）：プランの選び方
  body: '資産形成において、iDeCo（個人型確定拠出年金）とNISAのどちらを優先すべきか、あるいはどのように組み合わせるべきかをご案内します。


    ■iDeCo（個人型確定拠出年金）

    ・最大の特徴：掛金が全額所得控除となるため、拠出時点で税負担を軽減できます。

    ・コスト：運営管理機関手数料（星見証券）は0円ですが、加入時に2,829円、2026年12月分から毎月186円の手数料（国民年金基金連合会等）が発生します。

    ・制約：原則として60歳まで資産を引き出すことができません。

    ・向いている方：老後資金を最優先に準備したい方、所得税・住民税の負担を軽減したい方。


    ■NISA（つみたて投資枠・成長投資枠）

    ・最大の特徴：運用益が非課税であり、iDeCoと異なりいつでも売却・引き出しが可能です。

    ・コスト：国内株式などの主要商品の手数料を0円としており、心理的ハードルを抑えています。

    ・向いている方：ライフイベントに合わせて柔軟に資金を活用したい方、中短期的な資産形成も行いたい方。


    結論として、「税制優遇を最大限に活かして老後資金を確保したい」場合はiDeCoを、「自由度の高い資産形成を行いたい」場合はNISAをおすすめします。多くのお客様には、両制度を併用して目的別に使い分ける方法をご提案しております。'
