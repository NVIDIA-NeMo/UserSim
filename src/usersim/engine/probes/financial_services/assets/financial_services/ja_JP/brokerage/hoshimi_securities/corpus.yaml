- id: dd065925-c759-5ae0-ae66-f284e5994d8c
  title: manage_authorized_users を使う場面
  body: '未成年者口座において、法定代理人（親権者）の登録または変更が必要な場合にこの手続きを行います。適切な権限管理を行うため、正確な代理人情報を取得してください。


    1. 本人確認を実施します。お客様（または手続き依頼者）から「フルネーム」と「生年月日」を確認し、verify_identity を呼び出して照合してください。

    2. 対象となる未成年口座を特定します。お客様から口座番号の下4桁を伺い、get_accounts を呼び出して、該当する口座の account_id を取得してください。

    3. 法定代理人の登録・変更を実行します。取得した account_id と、法定代理人の詳細情報（氏名、住所、続柄などの必要情報）を指定して manage_authorized_users
    を呼び出します。


    本手続きにより、未成年口座の管理権限を持つ法定代理人の情報が更新されます。重要事項であるため、手続き完了後にお客様へ明確に通知してください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: hoshimi_securities
- id: ea8a11ff-cd7e-5449-b4d1-3ae2eb68548a
  title: manage_authorized_users ツールリファレンス
  body: 'このツールは、未成年口座の法定代理人（親権者）を登録または変更するために使用します。エージェントはこのツールを直接呼び出すことで代理人情報を更新します。


    【引数】

    ・account_id：対象となる未成年口座の識別子（get_accounts 等で取得します）

    ・representative_details：法定代理人の氏名、生年月日、連絡先などの詳細情報


    【効果】

    指定された口座の法定代理人として、新しい担当者が登録または更新されます。本ツールを呼び出す前に、必ず verify_identity による本人確認を完了させてください。'
