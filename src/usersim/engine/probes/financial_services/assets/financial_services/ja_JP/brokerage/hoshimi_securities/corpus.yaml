  title: place_trade ツールリファレンス
  body: 'place_trade は、有価証券の売買注文を執行するツールです。エージェントはこのツールを直接呼び出すことで、お客様に代わって取引を完了させます。


    【引数】

    - account_id: 取引を行う口座の識別子。

    - security_id: 取引対象の商品（銘柄）の識別子。

    - quantity: 取引数量。

    - side: 売買の区分（買い、または売り）。

    - order_type: 注文形式（指値、成行など）。


