- id: 3d0c433e-0800-571e-b8b8-ae72eaf8e08a
  title: 特定口座（源泉徴収あり）：個人情報の取扱い
  body: '星見証券では、金融商品取引法および個人情報保護法に基づき、お客様の個人情報を厳重に管理しています。特定口座（源泉徴収あり）における取扱いは以下の通りです。


    【マイナンバーの取扱い】

    特定口座の開設にあたりご提供いただくマイナンバーは、税法に基づく法定調書作成および税務署への報告のみに使用いたします。目的外の利用は一切ございません。


    【資産の管理】

    お客様からお預かりした金銭および有価証券は、当社の財産とは明確に分けて管理する「分別管理」を徹底しております。万一の際は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外となりますのでご注意ください。


    【情報の照合と認証】

    重要手続き時のご本人確認は、お客様の「フルネーム」と「生年月日」の照合のみで実施します。これにより、不要な機密情報の流出リスクを低減しています。


    【苦情・紛争の解決】

    万一、当社の対応にご満足いただけず、解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）へご案内いたします。透明性のある調査プロセスを通じて、誠実に対応いたします。'
