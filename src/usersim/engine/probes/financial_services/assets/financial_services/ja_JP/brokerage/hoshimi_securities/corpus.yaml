- id: 04dff538-d404-5eca-a3cd-291c88d945aa
  title: 特定口座（源泉徴収あり）：規定・約款
  body: '本規定は、星見証券が提供する「特定口座（源泉徴収あり）」の利用条件を定めるものです。


    1. サービス内容と義務

    当社は、金融商品取引法に基づき、お客さまの上場株式等の譲渡益および配当金から、税率20.315%の税金を自動的に計算し、源泉徴収いたします。これにより、原則としてお客さまは個別の確定申告を行う手間を省くことができます。


    2. 手数料の適用

    国内株式の売買手数料は0円とします。ただし、海外取引等については、インフラ維持および規制遵守コストとして別途設定された手数料が適用されます。


    3. 資産の管理と補償

    顧客資産は分別管理され、当社の財産とは明確に分けて管理いたします。万一、当社が破綻し資産が返還されない場合は、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償の対象外となります。


    4. 損失の繰越控除

    特定口座内で発生した損失については、確定申告を行うことにより、最大3年まで翌年以降の利益と相殺（繰越控除）することが可能です。


    5. 契約の変更および終了

    口座種類の変更や解約を希望される場合は、所定の手続きに従って申請してください。当社は、法令の変更や監督官庁の指示に基づき、本約款を適宜改定することがあります。'
