- id: 3c009229-9d8f-574f-8906-0216a90818cb
  title: iDeCo（個人型確定拠出年金）：解約・変更・プランの切替え
  body: 'iDeCo（個人型確定拠出年金）の拠出金額の変更や、運用商品の切替え手続きについてご案内いたします。


    【拠出金額の変更・プラン切替えの手順】

    1. お手続きの依頼：オペレーターに「iDeCoの拠出金額を変更したい」または「運用商品を切り替えたい」旨をお伝えください。

    2. 本人確認：お客様の「フルネーム」と「生年月日」をお伺いし、ご本人様確認を行います。

    3. 内容の指定：変更後の月額（月額 5,000円以上、上限は会社員 62,000円、自営業者 75,000円 ※2026年12月分以降）または、切替え先の運用商品をご指定ください。

    4. 確認と完了：当社にて変更内容を確認し、手続き完了の通知を差し上げます。


    【解約（脱退）について】

    iDeCoは原則として60歳まで資産を引き出すことができません。法律で定められた「脱退一時金」の受取要件（死亡、高度障害、または極めて限定的な要件）を満たさない限り、中途解約はできませんのであらかじめご了承ください。


    【注意点】

    拠出金額の変更は、国民年金基金連合会の処理スケジュールの都合上、反映までにお時間がかかる場合がございます。'
