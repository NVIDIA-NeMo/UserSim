- id: 103211f1-44f8-5616-afa9-12451783b9a6
  title: 特定口座（源泉徴収あり）：ご利用条件による違い
  body: '| 条件 | 判定・結果 | 基準・詳細 |

    | :--- | :--- | :--- |

    | マイナンバーの届出 | 必須 | 届出がない場合は特定口座の開設ができません |

    | 日本国内の居住者 | 必須 | 日本の税制に基づく源泉徴収を行うため |

    | 本人確認の完了 | 必須 | フルネームと生年月日の照合による確認が必要 |

    | 適合性の確認 | 必須 | 知識、経験、目的に照らして適切であること |


    ※サポートエージェントは、上記条件をすべて満たしていることを確認した上で、開設手続きへと進めてください。'
