  title: 投資信託の積立：ご紹介・継続利用の特典
  body: '星見証券では、お客様の長期的な資産形成を応援するため、投資信託の積立サービスの継続利用を推奨しております。特にクレジットカード積立をご利用いただくことで、効率的な資産運用とあわせて、0.5%のポイント還元率を適用させていただきます。


    積立の最低金額は100円からと非常に低く設定されており、少額からでも無理なく継続いただけます。お知り合いの方にご紹介いただき、新しく口座を開設して積立を開始された場合も、同様のメリットを享受いただけます。詳細は「投資信託の積立：プランの選び方」にて、お支払い方法ごとのメリットをご確認ください。'
