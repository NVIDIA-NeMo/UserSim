- id: b0369fa1-0b97-5768-a239-d81a7f43e220
  title: NISA（成長投資枠）：お申込みとご利用開始
  body: 'NISA（成長投資枠）のお申込みからご利用開始までの手順をご案内いたします。本手続きはデジタルチャネルで完結します。


    【ご準備いただくもの】

    ・マイナンバーカード（またはマイナンバー確認書類と本人確認書類）


    【お手続きの流れ】

    1. 本人確認の実施

    まず、お客様の「フルネーム」と「生年月日」をお伺いし、ご本人様であることを照合させていただきます。なお、機密情報やパスワード等の要求はございませんのでご注意ください。


    2. 口座開設・NISA申請の依頼

    オペレーターまたはチャットにて「NISA（成長投資枠）の開設を希望」とお伝えください。必要事項の入力案内を差し上げます。


    3. 書類の提出と審査

    案内に沿ってマイナンバー等の必要書類をアップロードしてください。弊社にて適合性の原則に基づいた審査を行います。


    4. 開設完了の通知

    審査完了後、口座開設およびNISA（成長投資枠）の適用が完了した旨を通知いたします。


    5. 投資の開始

    口座に資金を入金し、国内株式（手数料0円）や投資信託などの商品をご選択いただき、購入手続きを行ってください。


    手続きが完了しない場合は、「NISA（成長投資枠）：お手続きが完了しない・保留中のまま」をご参照ください。'
