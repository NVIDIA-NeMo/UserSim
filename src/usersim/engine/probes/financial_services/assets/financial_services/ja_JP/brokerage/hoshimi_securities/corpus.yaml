- id: 59ca471f-16b0-52d7-a175-897eb0196b76
  title: 特定口座（源泉徴収あり）：商品概要
  body: '星見証券の「特定口座（源泉徴収あり）」は、投資に伴う税金計算と納付の手間を大幅に軽減し、スムーズな資産運用を支援する口座です。


    【主な特徴】

    最大のメリットは、上場株式などの譲渡益や配当金にかかる税金を、証券会社がお客様に代わって計算し、自動的に源泉徴収する点にあります。これにより、原則として確定申告を行う必要がなくなり、忙しい方でも効率的に投資を継続いただけます。


    【適用される手数料と税率】

    ・国内株式の売買手数料：0円

    ・上場株式等の譲渡益・配当にかかる税率：20.315%


    【損失の繰越控除】

    運用の中で損失が発生した場合、確定申告を行うことで、その損失を最大3年まで繰り越し、将来の利益と相殺させることが可能です。これにより、税負担を適正に管理いただけます。


    【運用の透明性と安心】

    お客様の資産は、当社の財産とは明確に分けて管理する「分別管理」を徹底しております。万一の場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による損失は補償の対象外となりますので、あらかじめご了承ください。


    詳細な手数料体系については「特定口座（源泉徴収あり）：手数料一覧」をご参照ください。'
