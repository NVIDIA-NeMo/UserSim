- id: b8bc1f8e-7078-5f2f-a942-3c15b8fa18a2
  title: NISA（つみたて投資枠）：お申込みとご利用開始
  body: 'NISA（つみたて投資枠）のご利用開始までの手順をご案内いたします。本手続きはすべてデジタルチャネルで完結いたします。


    【ご準備いただくもの】

    ・ご本人確認書類

    ・マイナンバーカード（またはマイナンバー確認書類および本人確認書類）


    【ご利用開始の手順】

    1. お申込みの意思をお伝えください。担当者が手続きを開始いたします。

    2. ご本人確認を実施いたします。お客様の「フルネーム」と「生年月日」を照合させていただきます。その他の機密情報の提供は不要です。

    3. マイナンバーの届出を行ってください。証券口座開設およびNISA口座開設にはマイナンバーの届出が法律で義務付けられています。

    4. 税務署による審査を経て、NISA口座が開設されます。審査には数日かかる場合がございます。

    5. 口座開設完了の通知後、積立設定を行います。積立の最低金額である100円から、ご希望の金額と商品を選択してください。


    上記手順が完了し、初回積立日の買い付けが約定した時点で、ご利用開始となります。


    お手続きの詳細や条件については「NISA（つみたて投資枠）：お申込みいただける方」をご確認ください。'
