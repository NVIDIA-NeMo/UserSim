  title: iDeCo（個人型確定拠出年金）：加入時の手数料（国民年金基金連合会）について
  body: '【Q】iDeCoの加入時にかかる手数料はありますか？


    A. はい。iDeCo（個人型確定拠出年金）への加入時に、国民年金基金連合会へ支払う加入時の手数料として2,829円がかかります。


    【Q】この手数料は星見証券に支払うものですか？


    A. いいえ。この2,829円の手数料は、制度を運営する国民年金基金連合会へ支払われるものです。なお、運営管理機関である星見証券の運営管理機関手数料は0円となっております。


    詳細については、iDeCo（個人型確定拠出年金）：手数料一覧をご参照ください。'
