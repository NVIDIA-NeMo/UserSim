- id: c20a7f7d-7e92-5388-a9b8-e36e3aaead02
  title: 特定口座（源泉徴収あり）：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの資産を安全に守るため、セキュリティ対策を徹底しております。特に「特定口座（源泉徴収あり）」をご利用の際は、以下の点に十分ご注意ください。


    【注意すべき詐欺の手口】

    最近では、当社の社員を装い、「税務上の手続きが必要である」として、偽のウェブサイトやアプリへ誘導し、個人情報を盗み出そうとするフィッシング詐欺が報告されています。また、SNS等で「確実に利益が出る投資手法」を提示し、口座情報の共有を求めるケースがございますが、これらはすべて詐欺です。


    【星見証券が絶対に行わないこと】

    当社からお客さまに対し、以下のような機密情報を要求することはございません。

    ・ログインパスワードや暗証番号（PIN）

    ・ワンタイムパスワードなどの認証コード

    ・クレジットカードのセキュリティコード


    【本人確認について】

    口座情報の変更などの重要な手続きを行う際は、必ずお客さまの「フルネーム」と「生年月日」の照合による本人確認を実施いたします。これ以外の認証ステップや機密情報の要求は行いませんのでご安心ください。


    【異常を感じたときの対応】

    身に覚えのない取引通知が届いた、または不審な連絡を受けた場合は、直ちに当社ヘルプデスクまでお知らせください。迅速に口座の利用制限などの措置を講じます。


    詳細なリスクについては、「特定口座（源泉徴収あり）：リスクについてのご説明」をご確認ください。'
