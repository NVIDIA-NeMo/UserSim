- id: dda03d6f-c2a8-5f9f-83a0-2f693fd69e34
  title: 米国株式の取引：解約・変更・プランの切替え
  body: "米国株式の保有資産の売却や、管理口座の変更（特定口座への切替えなど）をご希望される際の手順をご案内します。\n\n【事前準備】\n・お手元に口座番号をご用意ください。\n\
    \n【お手続きの流れ】\n1. ご要望の提示：担当者に「米国株の売却」または「管理口座の変更」を希望する旨をお伝えください。\n2. 本人確認：お客さまの「フルネーム」と「生年月日」を伺い、ご本人様であることの照合を行います。\n\
    3. 詳細の確認：\n   - 売却の場合：売却したい銘柄と数量を指定してください。約定後、0.495%（上限22米ドル）の手数料が差し引かれます。\n \
    \  - 口座変更の場合：現在の口座から、どの口座（例：「特定口座（源泉徴収あり）：商品概要」で案内している特定口座など）へ移行するかを指定してください。\n\
    4. 処理の執行：当社にて手続きを行い、完了後に通知いたします。\n5. 結果の確認：資産残高または保有銘柄一覧に、変更内容が正しく反映されていることをご確認ください。\n\
    \n【注意点】\n口座の切替えに伴い、税制上の扱いが変わる場合がございます。個別の税務相談は承っておりませんので、詳細は税理士または管轄の税務署へご相談ください。"
