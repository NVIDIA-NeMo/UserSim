- id: f0e5b5c1-5401-5d2b-929f-4616c8b88e12
  title: NISA（成長投資枠）：切替えや上位プランを検討するとき
  body: 'サポート担当者は、顧客が「つみたて投資枠」から「成長投資枠」への活用比重の変更や、併用を検討されている際に、以下の特性を説明してください。


    ・NISA（成長投資枠）：年間投資枠2,400,000円。株式などの幅広い商品に柔軟に投資でき、個別の銘柄選択による成長を追求したい方向けです。

    ・NISA（つみたて投資枠）：少額からコツコツと長期的な資産形成を行うための積立専用枠です。


    両者は併用可能であり、合計で年間3,600,000円まで投資できます。安定的な積み立てをベースにしつつ、成長投資枠で戦略的な投資を行いたい場合に、併用をご提案ください。顧客の知識や経験に基づき、適切な活用方法を提示してください。'
  domain: brokerage_investing
  product_category: nisa_seicho
  document_type: comparison
  source_authority: official
  placeholder: true
