- id: 10b26c9e-29c9-51b2-9fdb-3431f7fd93ca
  title: 米国株式の取引：規定・約款の変更
  body: '本規定は、星見証券における「米国株式の取引」の利用条件を定めるものです。お客様は本規定に同意することで、当社のサービスを利用いただけます。


    ■ 手数料およびコストの適用

    本サービスにおける取引手数料は、約定代金に対する割合として0.495%を適用します。ただし、1回の取引あたりの手数料上限は22米ドルとします。また、米ドルへの通貨換算に際しては、1米ドルあたり25銭の為替手数料を申し受けます。


    ■ 規定の変更手続き

    当社は、法令の改正、規制当局（金融庁および日本証券業協会）の指示、またはインフラ維持コストの変動に基づき、本規定および手数料体系を変更することがあります。変更を行う場合は、適用日の30日前までに、デジタルチャネル（メールまたはアプリ内通知）にてお客様に告知いたします。


    ■ 合意の終了

    お客様はいつでも口座の解約を申し出ることができます。また、重大な規約違反が認められた場合、当社は利用を制限または停止することがあります。


    ■ 準拠法と紛争解決

    本規定は日本法に準拠します。本サービスに関して解決に至らない苦情や紛争については、証券・金融商品あっせん相談センター（FINMAC）へご案内いたします。'
