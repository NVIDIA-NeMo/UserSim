- id: 32a4e32d-e6d1-5dd7-9fe9-2c1997e5e311
  title: 米国株式の取引：安全にご利用いただくためのポイント
  body: '米国株式の取引を安全にご利用いただくために、以下の重要なセキュリティポイントをご確認ください。


    ■ 詐欺の手口にご注意ください

    「絶対に利益が出る米国株がある」といった勧誘や、SNSを通じた個別の投資助言に十分ご注意ください。星見証券では、個別の利益保証や、不透明な投資案件への勧誘は一切行いません。


    ■ 星見証券がお伺いすること

    お客様の口座情報の変更など、重要な手続きを行う際には、必ず本人確認を実施します。確認は、お客様の「フルネーム」と「生年月日」の照合のみで行います。以下の情報は、いかなる場合でもお伺いすることはありませんので、絶対に入力や回答をしないでください。

    ・暗証番号（PIN）

    ・ログインパスワード

    ・ワンタイムパスコード

    ・クレジットカードのセキュリティコード


    ■ 異常を感じた場合の対応

    身に覚えのない取引通知が届いた場合や、不審な連絡を受けた場合は、直ちに当社のヘルプデスクまでご連絡ください。迅速に調査し、被害の拡大を防止します。万一、不正利用が判明した際は、透明性のある調査プロセスを経て誠実に対応いたします。'
