- id: fc06570e-3c10-5a6e-9aca-3720910e3dc4
  title: 特定口座（源泉徴収あり）：リスクについてのご説明
  body: '本口座のご利用にあたり、以下のリスクおよび重要事項を必ずご確認ください。


    【元本保証について】

    本口座を通じて投資される有価証券は、元本が保証されておりません。株価の変動などにより、投資した金額を下回る損失が生じる可能性があります。相場変動による損失は、日本投資者保護基金の補償対象外となります。


    【税金について】

    上場株式等の譲渡益および配当には、20.315%の税金がかかります。本口座ではこの税金が自動的に徴収されますが、損益通算の結果や他の所得状況により、確定申告を行うことで税金の還付を受けられる場合があります。


    【適合性の原則】

    当社は、お客さまの知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を徹底しております。ご自身のリスク許容度に見合った投資判断をお願いいたします。


    【資産の保護】

    お客さまからお預かりした資産は、当社の財産と分けて管理する「分別管理」を徹底しております。万一の際は、日本投資者保護基金により1人当たり1,000万円まで補償されます。'
