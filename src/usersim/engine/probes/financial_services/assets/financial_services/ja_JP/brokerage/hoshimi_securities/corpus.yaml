  body: 'Q：NISA（成長投資枠）で国内株式を取引する場合、手数料はかかりますか？


    A：いいえ、星見証券では国内株式の売買手数料を0円としております。投資への心理的・経済的なハードルを最小限に抑え、お客様の長期的な資産成長を支援いたします。


    Q：すべての取引が無料になるのでしょうか？


