- id: 0a739936-245c-5672-b91d-643d95c22c59
  title: 米国株式の取引：商品概要
  body: '星見証券の「米国株式の取引」は、世界経済を牽引する米国企業の株式に直接投資し、グローバルな成長を享受いただけるサービスです。デジタル完結型の手続きで、どなたでも手軽に米国市場へのアクセスが可能です。


    【手数料体系】

    本サービスでは、透明性の高い以下の手数料を設定しております。

    ・取引手数料（約定代金に対する割合）：0.495%

    ・取引手数料の上限（米ドル）：22

    ・為替手数料（1米ドルあたり）：25銭


    【商品の特徴とリスク】

    米国株への投資により、日本国内では得られない成長機会を追求できます。一方で、株価の変動による元本割れのリスクに加え、為替相場の変動により、円貨ベースでの資産価値が変動する「為替リスク」を伴います。


    【資産の保護】

    お客様の資産は、証券会社の財産とは分けて管理する「分別管理」を徹底しております。万一の場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償の対象外となりますので、あらかじめご了承ください。'
