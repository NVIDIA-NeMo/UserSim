  title: NISA（成長投資枠）：お申込みいただける方
  body: 'NISA（成長投資枠）のお申込み条件は以下の通りです。


    | 条件項目 | 基準・要件 | 結果 |

    | :--- | :--- | :--- |

    | 居住地 | 日本国内に居住していること | 必須 |

    | 年齢 | 18歳以上であること | 必須 |

    | 口座数 | 他社を含めNISA口座を保有していないこと（または変更手続き中であること） | 必須 |

    | 必要書類 | マイナンバーの届出が可能であること | 必須 |


    ※上記条件をすべて満たしている場合にお申込みいただけます。また、お取引にあたっては「適合性の原則」に基づき、お客様の知識、経験、投資目的に照らして適切であるかを確認させていただきます。'
