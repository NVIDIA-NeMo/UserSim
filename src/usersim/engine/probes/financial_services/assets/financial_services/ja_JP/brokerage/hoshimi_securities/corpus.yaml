- id: 5bf0ca9f-a22c-55d8-a20f-c46743cef175
  title: 米国株式の取引：よくあるお手続きの流れ
  body: "米国株式の取引を開始し、実際に注文を行うまでの標準的な流れをご案内します。\n\n【事前準備】\n星見証券の総合口座を開設し、マイナンバーの届出を完了させておいてください。\n\
    \n【お手続きの手順】\n1. ご本人確認：\n   お客さまの「フルネーム」と「生年月日」をお伝えいただき、ご本人確認を完了させます。\n2. 米国株式取引の利用申し込み：\n\
    \   弊社へ米国株式取引の利用希望をお伝えください。その後、提示されるリスク告知書の内容を確認し、同意の手続きを行ってください。\n3. 米ドルの準備（為替取引）：\n\
    \   米国株式の購入には米ドルが必要です。日本円を米ドルに交換してください。この際、1米ドルあたり25銭の為替手数料が発生します。\n4. 注文の実行：\n\
    \   購入したい銘柄、数量、価格を指定して注文を依頼してください。約定時に、約定代金の0.495%（最大22米ドル）の取引手数料が差し引かれます。\n\n\
    【完了の確認】\n約定通知が届き、保有資産一覧に該当の米国株式が表示されたことで、一連の手続きは完了となります。"
