- id: 8726c9ab-7fcb-57ee-8979-3f644429f00d
  title: 投資信託の積立：手数料一覧
  body: '「投資信託の積立」に関連する手数料についてご案内します。星見証券では、投資への心理的・経済的ハードルを最小限に抑えるため、主要商品の手数料を0円とする方針を採用しております。


    ■積立買い付け手数料：0円

    （国内株式などの主要商品と同様に、積立による買い付け手数料は無料です）


    ■クレジットカード決済手数料：0円

    （クレジットカード積立をご利用いただく際、弊社側で課金される決済手数料はございません）


    ※投資信託自体に課せられる「信託報酬（運用管理費用）」などのコストは、各商品の目論見書に記載されており、純資産総額から差し引かれます。これらは運用会社が設定する費用であり、弊社が別途徴収するものではありません。'
