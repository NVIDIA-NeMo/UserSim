- id: b569f54e-5da5-570e-9734-170946716d20
  title: get_positions ツールリファレンス
  body: 'get_positions は、指定された口座の保有資産（ポジション）の一覧を取得するツールです。エージェントはこのツールを直接呼び出すことで、お客様の現在の資産状況をリアルタイムに確認できます。


    【引数】

    - account_id: 資産を確認したい口座の識別子。get_accounts 等で取得します。


    【効果】

    指定された account_id に紐づく保有有価証券の種類、数量、および現在の評価状況を返します。


    ※本ツールを実行する前に、verify_identity による本人確認が完了している必要があります。'
