- id: 03bc555f-643a-5cb1-b573-5b3229132551
  title: iDeCo（個人型確定拠出年金）：お取引が拒否された・制限された
  body: "iDeCo（個人型確定拠出年金）の掛金変更や商品変更などの手続きが拒否された、あるいは制限された場合の対処法をご案内します。\n\n【想定される症状】\n\
    「掛金の変更手続きが完了しない」「エラーが表示されて設定が保存できない」といった状況。\n\n【考えられる原因と確認事項】\n1. 掛金額が制限範囲外である：\n\
    \   - 月額の最低額である5,000円を下回っていませんか？\n   - 2026年12月分から適用される上限額（会社員：62,000円、自営業者：75,000円）を超えて設定しようとしていませんか？\n\
    2. 本人確認が未完了である：\n   - 重要な手続きの前に、「フルネーム」と「生年月日」による照合が正しく行われているか確認してください。\n3. 制度上の制限：\n\
    \   - 60歳未満での解約や引き出しを希望されていませんか？（制度上不可となります）\n\n【解決策】\n- 金額設定を5,000円から各上限額（62,000円または75,000円）の範囲内で再度設定してください。\n\
    - 正しい本人情報を提示し、再度手続きを依頼してください。\n\n【エスカレーション】\n上記を確認しても解決しない場合は、社内のコンプライアンス担当または専門の運用責任者へ案件をエスカレーションし、詳細な調査を行います。調査結果は後日、お客様へご報告いたします。"
