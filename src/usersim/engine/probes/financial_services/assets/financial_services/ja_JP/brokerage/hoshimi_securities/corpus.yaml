- id: 12e8a9f8-c7ec-5170-a6db-51efa9692b72
  title: initiate_securities_transfer を使う場面
  body: 'お客様が他社（他金融機関）の特定口座で保有している株式や投資信託を、星見証券の口座へ移管（入庫）したい場合に、本ツールを使用します。


    【手続き手順】

    1. `verify_identity` を呼び出し、お客様の「フルネーム」と「生年月日」を照合して本人確認を行います。

    2. `get_accounts` を使用し、移管先となる星見証券の `account_id` を特定します。

    3. 移管元となる金融機関名および移管したい銘柄・数量などの詳細を確認します。

    4. `initiate_securities_transfer` を呼び出し、移管手続きを開始します。


    移管手続きには、移管元金融機関での手続きも必要となる場合があることをお客様にご案内ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_securities_transfer
  institution_id: hoshimi_securities
- id: d377fe3a-0bf1-5cca-bafc-4dc7c2d07f89
  title: initiate_securities_transfer ツールリファレンス
  body: 'このツールは、他社から星見証券への有価証券の移管（入庫）手続きを開始するために使用します。


    【機能】

    他社の特定口座から株式や投資信託を星見証券の口座へ移管する手続きを申請します。


    【引数】

    - `account_id`: 移管先となる星見証券の口座識別子

    - `source_institution`: 移管元の金融機関名

    - `assets_to_transfer`: 移管対象の銘柄および数量の詳細


    エージェントは `verify_identity` による本人確認および `get_accounts` による口座特定を完了した後、本ツールを直接呼び出して手続きを実行します。'
