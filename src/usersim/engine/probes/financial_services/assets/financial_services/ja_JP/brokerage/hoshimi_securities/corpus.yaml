- id: b2591679-50f2-51e3-85b1-a289e0f033a7
  title: NISA（つみたて投資枠）：金利・料率の決まり方と適用
  body: 'NISA（つみたて投資枠）におけるコストおよび料率の適用についてご案内します。


    【取引手数料】

    国内株式等の主要商品における売買手数料は0円です。これにより、積立投資におけるコスト負担を最小限に抑えています。


    【運用コスト（信託報酬）】

    つみたて投資枠で取り扱う投資信託の運用コスト（信託報酬）は、各運用会社によって決定されます。これは年率（%）で表示され、基準価額から日々按分して差し引かれます。弊社が独自に設定する料率ではなく、商品ごとの規定に基づきます。


    【税率】

    本枠内で運用された資産から得られる譲渡益および配当は、非課税となります（通常は20.315%の課税）。この非課税措置は、年間投資枠1,200,000円および非課税保有限度額18,000,000円の範囲内で適用されます。'
