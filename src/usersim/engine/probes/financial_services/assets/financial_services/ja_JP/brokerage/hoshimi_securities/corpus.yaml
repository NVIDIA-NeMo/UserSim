- id: 895c2139-bc03-5451-a9c4-4ce528bc1cda
  title: 米国株式の取引：お申込みとご利用条件
  body: 'Q：米国株式の取引を始めるには、どのような手続きが必要ですか？

    A：まず星見証券の総合口座を開設していただき、マイナンバーの届出を完了させてください。その後、米国株式取引の利用申し込みを行い、リスク告知書の内容に同意いただくことでご利用いただけます。


    Q：誰でも利用できるサービスですか？

    A：はい、口座をお持ちの方であれば原則としてどなたでもお申込みいただけます。ただし、「適合性の原則」に基づき、お客さまの知識や経験、投資目的に照らして著しく不適切と判断される場合には、お取引を制限させていただくことがございます。


    Q：米国株式の取引に最低限必要な金額はありますか？

    A：明確な最低金額の制限はございませんが、銘柄の株価および取引手数料（約定代金の0.495%、上限22米ドル）が必要となるため、十分な米ドル残高をご用意ください。'
