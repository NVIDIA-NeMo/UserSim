- id: 34af8673-cf0b-59ce-bf64-e7132426eb72
  title: NISA（成長投資枠）：おすすめの方と主な使い方
  body: 'NISA（成長投資枠）は、株式などの幅広い商品に柔軟に投資でき、得られた利益が非課税となる大変便利な制度です。


    【このような方におすすめです】

    ・個別の国内株式に投資して、企業の成長を直接享受したい方

    ・つみたて投資枠だけでなく、より自由度の高い資産運用を組み合わせたい方

    ・コストを抑えて効率的に資産形成を行いたい方


    【本制度の魅力と主な使い方】

    ・投資コストの最小化：国内株式の売買手数料を0円としているため、少額からの取引でも心理的・経済的ハードルを低く抑えられます。

    ・柔軟な運用：年間投資枠2,400,000円の範囲内で、ご自身の判断で成長性の高い銘柄へ投資いただけます。

    ・長期的な非課税メリット：非課税保有限度額12,000,000円（生涯投資枠）の範囲内で、運用益を非課税で保有し続けることが可能です。


    【運用のポイント】

    つみたて投資枠でコツコツと土台を作りつつ、成長投資枠で積極的な運用を行うことで、バランスの良い資産形成が目指せます。限度額の詳細については「NISA（成長投資枠）：非課税保有限度額について」をご覧ください。'
