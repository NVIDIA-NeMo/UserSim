- id: 60f268c6-d4b9-5f45-9519-a542180151db
  title: iDeCo（個人型確定拠出年金）：ご利用条件による違い
  body: '【iDeCo（個人型確定拠出年金）拠出限度額一覧】


    お客様のご属性により、拠出できる掛金の上限額が異なります。以下の表は2026年12月分から適用される上限額です。


    | ご利用条件（属性） | 掛金の上限（月額、2026年12月分から） |

    | :--- | :--- |

    | 会社員（企業年金加入状況等による） | 62,000円まで |

    | 自営業者（国民年金基金加入状況等による） | 75,000円まで |

    | 全属性共通（最低拠出額） | 5,000円から |


    ※会社員の方は企業年金の掛金と合わせて、自営業者の方は国民年金基金の掛金などと合わせての合算上限となります。詳細な適合性の確認は、個別にお申し付けください。'
