- id: a6a70287-d9b7-58af-8b9d-dea036489e83
  title: withdraw_funds を使う場面
  body: 'お客様が証券総合口座に預けている資金を、あらかじめ登録されている出金先銀行口座へ出金することを希望される場合にこの手続きを行います。出金は取り消し不可能な操作となるため、慎重に確認を行ってください。


    1. 本人確認を実施します。お客様から「フルネーム」と「生年月日」を確認し、verify_identity を呼び出して照合してください。

    2. 対象となる口座を特定します。お客様から口座番号の下4桁を伺い、get_accounts を呼び出して、該当する口座の account_id を取得してください。

    3. 出金処理を実行します。取得した account_id と、お客様が希望される出金金額を指定して withdraw_funds を呼び出します。


    本手続きにより、証券口座から登録済み銀行口座への出金指示が完了します。出金先口座の変更を希望される場合は、別途出金先変更の手続きをご案内ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: hoshimi_securities
- id: a74df7f8-f9d2-5867-9585-e08749ea55bd
  title: withdraw_funds ツールリファレンス
  body: 'このツールは、証券総合口座の預り金を、登録した銀行口座へ出金するために使用します。エージェントはこのツールを直接呼び出すことで出金処理を完結させます。


    【引数】

    ・account_id：出金元となる証券口座の識別子（get_accounts 等で取得します）

    ・amount：出金する金額（例：50,000円）


    【効果】

    指定された口座から、登録済みの出金先銀行口座へ資金が送金されます。この操作は不可逆的であるため、実行前に金額に間違いがないか十分にご確認ください。また、呼び出し前に必ず
    verify_identity による本人確認を完了させてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
