- id: 19ea090c-7932-5e9e-aaaf-4b9854e029f5
  title: 米国株式の取引：この商品をかたる詐欺にご注意ください
  body: '星見証券の「米国株式の取引」をかたる、巧妙な詐欺へのご注意をお願いいたします。


    【想定される詐欺の手口】

    「元本保証で確実に高利益が得られる米国株の銘柄がある」「特別な運用プランに招待された」といった、限定的な好条件を提示して、外部サイトへの誘導や送金を促す手口が報告されています。投資において利益を保証することはあり得ません。このような案内はすべて詐欺であると断定し、十分にご注意ください。


    【星見証券が絶対に要求しないこと】

    弊社がお客さまの口座情報の変更や重要手続きを行う際、ご本人確認のために「フルネーム」と「生年月日」の照合のみを実施いたします。それ以外の機密情報、例えば以下のものは絶対に要求いたしません。

    ・暗証番号やログインパスワード

    ・クレジットカードのセキュリティコード

    ・ワンタイムパスコードや認証アプリのコード

    ・弊社以外の指定口座への送金


    【不審な点がある場合の対応】

    少しでも不審なと感じられた場合は、直ちにお取引を中断し、弊社ヘルプデスクまでご連絡ください。迅速に調査プロセスを提示し、誠実に対応いたします。万一、被害に遭われた可能性がある場合や解決に至らない紛争については、証券・金融商品あっせん相談センター（FINMAC）へのご案内も行っております。'
