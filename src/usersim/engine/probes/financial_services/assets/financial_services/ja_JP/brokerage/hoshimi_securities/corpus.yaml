  title: 米国株式の取引：お申込みとご利用開始
  body: '米国株式の取引を開始するための手順をご案内します。本手続きはすべてデジタルチャネルで完結いたします。


    【事前準備】

    ・星見証券の総合口座をお持ちであること

    ・マイナンバーの届出が完了していること


    【お手続きの流れ】

    1. 私たちに「米国株式の取引を開始したい」旨をお伝えください。

    2. ご本人確認のため、お客様の「フルネーム」と「生年月日」をお伺いします。照合が完了するまでお待ちください。

    3. 次に、お客様の知識、経験、投資目的に照らして本商品が適切であるかを確認する「適合性の原則」に基づく確認を行います。こちらで提示する質問にご回答ください。

    4. 適合性の確認が完了し、社内審査を通過しますと、米国株式の取引が有効になります。

    5. 私たちからお手続き完了の通知をいたします。これをもって、米国株式の注文が可能になります。


    お手続き完了後、円貨を米ドルに替える際の為替手数料として、1米ドルあたり25銭が発生いたします。'
