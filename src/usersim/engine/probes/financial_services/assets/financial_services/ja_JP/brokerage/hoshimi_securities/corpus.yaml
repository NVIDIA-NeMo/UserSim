- id: c923a45e-a6b2-564e-b601-e7e1b5720bfe
  title: 投資信託の積立：プランの選び方
  body: '投資信託の積立では、「現金（口座振替）」と「クレジットカード積立」の2つの決済プランからお選びいただけます。


    【クレジットカード積立】

    ・メリット：0.5%のポイント還元率が適用されるため、実質的なコストを抑えつつ資産形成が可能です。

    ・制限：クレジットカード積立の上限（月額）が100,000円までとなっています。

    ・向いている方：月々の積立額が100,000円以下で、ポイントを効率的に貯めたい方。


    【現金（口座振替）積立】

    ・メリット：月々の積立上限に制限がなく、柔軟に金額を設定できます。

    ・制限：ポイント還元はありません。

    ・向いている方：月額100,000円を超える金額を積み立てたい方や、クレジットカードを利用したくない方。


    どちらのプランでも、積立の最低金額は100円からとなっており、少額から無理なく開始いただけます。'
