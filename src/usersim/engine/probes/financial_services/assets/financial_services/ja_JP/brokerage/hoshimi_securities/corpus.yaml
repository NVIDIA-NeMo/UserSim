- id: b776cd60-ee1a-54b0-82bd-8fe8281e8976
  title: 米国株式の取引：明細や記録と合わない
  body: "【症状】\n取引後の残高や決済金額が、お客さまの計算（株価 × 数量）と一致せず、想定より金額が少なくなっている、または多くなっていると感じる。\n\
    \n【確認すべき項目と原因】\n1. 取引手数料の適用：\n   米国株式の取引では、約定代金に対して0.495%の手数料がかかります。この金額が決済時に差し引かれているか確認してください。ただし、手数料は最大で22米ドルまでとなります。\n\
    2. 為替手数料の計算：\n   日本円から米ドルへ（またはその逆へ）交換した際、1米ドルあたり25銭の為替手数料が適用されています。適用レートにこのコストが含まれているか確認してください。\n\
    3. 約定価格の差異：\n   指値注文ではなく成行注文を利用した場合、市場の変動により想定と異なる価格で約定している可能性があります。\n\n【解決方法】\n\
    まずは、上記の手数料（0.495%および25銭）を算入して再計算をお願いいたします。計算方法が不明な場合は、具体的な約定日と銘柄をお伝えいただければ、弊社にて再計算し詳細を回答いたします。\n\
    \n【エスカレーション】\n再計算後も依然として不一致がある場合や、システム上の不具合が疑われる場合は、速やかに社内の専門の運用責任者へエスカレーションし、正確な取引記録の照合と調査を実施いたします。"
