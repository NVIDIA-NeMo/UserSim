- id: 1bc643e5-aae1-5a54-bd1a-4463ababd960
  title: iDeCo（個人型確定拠出年金）：個人情報の取扱い
  body: '星見証券は、iDeCo（個人型確定拠出年金）の運営にあたり、お客様からお預かりした個人情報を金融商品取引法および個人情報保護法に基づき厳重に管理いたします。


    ■個人情報の利用目的

    ご提供いただいた個人情報は、以下の目的で利用いたします。

    ・iDeCo口座の開設、維持、および運用管理業務の遂行

    ・国民年金基金連合会等、制度運営に必要な外部機関への届出および連携

    ・重要事項のご案内および法令に基づく報告

    ・適合性の原則に基づく、適切な商品提示のための分析


    ■情報の管理と安全性

    お客様の資産は分別管理され、当社自身の財産とは明確に分けて管理しております。また、重要なお手続きの際は、フルネームと生年月日の照合による本人確認を徹底し、不正アクセスやなりすましを防止します。


    ■第三者への提供

    法令に基づく場合、または運営管理機関として制度上必要な手続きを行う場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    ■お客様の権利

    ご自身の個人情報の開示、訂正、または利用停止をご希望の場合は、当社ヘルプデスクまでお申し付けください。誠実かつ迅速に対応いたします。'
