    | 本人確認 | フルネームおよび生年月日の照合が可能であること | 必須 |

    | 投資金額 | 積立の最低金額である100円以上の設定が可能であること | 必須 |

    | 決済手段 | 現金振替または有効なクレジットカードを保有していること | 必須 |

    | 居住地 | 日本国内に居住していること | 必須 |


