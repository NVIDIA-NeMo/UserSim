- id: fee49004-9294-5d3e-82e3-5893ecb5f0c1
  title: NISA（成長投資枠）：年間投資枠について
  body: '【Q】NISA（成長投資枠）で1年間に投資できる金額はいくらまでですか？


    A：年間投資枠は2,400,000円です。この枠内での投資による利益はすべて非課税となります。


    【Q】つみたて投資枠も利用していますが、合算して枠が管理されるのでしょうか？


    A：NISA全体の年間投資枠は合計3,600,000円（つみたて投資枠1,200,000円 ＋ 成長投資枠2,400,000円）となります。成長投資枠の2,400,000円を使い切った後でも、つみたて投資枠の範囲内であれば引き続き非課税での投資が可能です。


    【Q】枠を使い切った場合、翌年まで投資できないのでしょうか？


    A：はい、年間の投資枠を使い切った場合は、翌年1月まで成長投資枠での新規購入はできません。なお、商品の売却による枠の再利用については「NISA（成長投資枠）：非課税保有限度額について」をご確認ください。'
