- id: 0e9b49f2-5fa5-5e3b-b16c-2cb8b4f5e67f
  title: iDeCo（個人型確定拠出年金）：おすすめの方と主な使い方
  body: 'iDeCo（個人型確定拠出年金）は、ご自身で掛金を拠出し、運用した資産を老後資金として受け取る私的な年金制度です。資産形成の民主化を目指す星見証券が、効率的な準備をサポートいたします。


    【こんな方におすすめです】

    ・所得税や住民税の負担を軽減しながら、老後の備えをしたい方（掛金が全額所得控除となります）

    ・長期的な視点でコツコツと資産を増やしたい方

    ・運営管理コストを抑えて運用効率を高めたい方


    【主な特徴と利用方法】

    ・拠出額の設定：月額 5,000円から、ご自身の状況に合わせて設定いただけます。

    ・拠出上限額（2026年12月分から）：

    　- 会社員の方：月額 62,000円まで

    　- 自営業の方：月額 75,000円まで

    ・コストの最適化：星見証券の運営管理機関手数料は 0円 です。長期運用において、このコスト削減が大きなメリットとなります。


    【ご利用上の注意】

    制度の性質上、原則として60歳まで資産を引き出すことができません。そのため、余裕資金での運用を強く推奨いたします。詳細な加入条件については、『iDeCo（個人型確定拠出年金）：お申込みいただける方』をご確認ください。'
