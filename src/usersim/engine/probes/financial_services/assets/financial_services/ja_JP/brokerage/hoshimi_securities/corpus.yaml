- id: 2de9a2d5-d5ed-5477-a9b4-5df9470c8d0f
  title: iDeCo（個人型確定拠出年金）：状況・履歴の確認
  body: 'iDeCo（個人型確定拠出年金）の現在の資産状況や拠出履歴を確認するための手順をご案内します。


    【事前準備】

    お手元にご登録時のご本人様情報をご用意ください。


    【確認の手順】

    1. 当社担当者に、iDeCo（個人型確定拠出年金）の状況確認を希望する旨をお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」を伝えてください。

    3. 確認したい内容（現在の評価額、直近の掛金拠出履歴、運用商品の配分など）を具体的にお伝えください。

    4. 当社にて照合後、現在の状況や履歴を口頭または書面形式でご案内します。


    【完了の確認】

    提示された資産残高や拠出金額が、お客様の認識している記録と一致しているかをご確認ください。もし不一致がある場合は、そのまま担当者へお知らせください。'
