- id: 9f0dc2aa-4881-51d1-8341-282fde51c51d
  title: NISA（つみたて投資枠）：お取引が拒否された・制限された
  body: '【症状】

    「積立設定を変更しようとしたがエラーになる」「買い付けが拒否された」という状況。


    【考えられる原因と確認事項】

    1. 年間投資枠の超過：本年の投資額がすでに1,200,000円に達していないか確認してください。

    2. 非課税保有限度額の超過：保有資産の取得価額の合計が18,000,000円を超えていないか確認してください。

    3. 口座状態の制限：本人確認書類の期限切れや、コンプライアンス上の確認事項により一時的に制限がかかっていないか確認してください。


    【解決策】

    ・枠の超過が原因の場合：積立金額を減額するか、翌年まで設定変更を待つようご案内ください。

    ・書類不備等の場合：必要な書類の再提出をご案内します。


    【エスカレーション】

    上記を確認しても解決せず、システム的な制限が疑われる場合は、社内のコンプライアンス担当または専門の運用責任者へエスカレーションし、制限解除の可否を判断します。お客様には、調査完了まで数営業日かかる旨を丁寧にお伝えください。'
