- id: d404dbef-6503-5dab-85db-cd510fe40930
  title: NISA（つみたて投資枠）：状況・履歴の確認
  body: 'お客様が現在の投資状況や利用履歴を確認される際の手順です。


    【準備するもの】

    ・ご本人様確認のための情報（フルネーム、生年月日）


    【確認の手順】

    1. お客様にフルネームと生年月日を伺い、ご本人様確認を行います。

    2. 「現在のNISA（つみたて投資枠）の利用状況を確認したい」旨のご要望を承ります。

    3. 当社にて、以下の情報を照会し、お客様へ提示します。

    　・現在の非課税保有限度額（18,000,000円）のうち、いくらを使用済みか

    　・本年の年間投資枠（1,200,000円）のうち、いくらを利用したか

    　・直近の積立履歴（積立日、金額、銘柄）

    4. 内容に相違がないか、お客様にご確認いただきます。


    【完了の目安】

    お客様が提示された利用枠および履歴の内容を承諾された時点で、確認手続きは完了となります。'
