- id: e925ff24-3ec0-5cb5-8474-2f5544e4e55a
  title: NISA（つみたて投資枠）：商品概要
  body: '星見証券のNISA（つみたて投資枠）は、少額からコツコツと長期的な資産形成を行うための非課税積立専用枠です。投資信託などの金融商品を定期的に買い付けることで、時間的な分散投資が可能となり、将来に向けた安定的な資産成長を支援します。


    【制度のポイント】

    本制度の最大の特徴は、運用益が非課税となる点です。通常、上場株式等の譲渡益と配当には20.315%の税金がかかりますが、本枠での運用による利益には税金がかかりません。


    【ご利用限度額】

    ・年間投資枠：1,200,000円

    ・非課税保有限度額：18,000,000円


    【積立設定について】

    ・積立の最低金額：100円から設定可能です。どなたでも無理のない金額から投資を始めていただけます。


    【未成年者のご利用について】

    2027年1月からは、0歳から17歳の方も本枠を利用できるようになります。

    ・未成年者の年間投資枠（2027年1月から）：600,000円

    ・未成年者の非課税保有限度額（2027年1月から）：6,000,000円


    詳細な手数料については「NISA（つみたて投資枠）：手数料一覧」をご確認ください。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: product_sheet
  source_authority: official
