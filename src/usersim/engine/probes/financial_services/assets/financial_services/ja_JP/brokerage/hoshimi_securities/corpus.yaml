- id: d0297fb3-3e65-59dc-9226-55abf252f6a0
  title: NISA（成長投資枠）：想定外の手数料・金額
  body: '顧客より「想定していた手数料と異なる」「不明な金額が差し引かれている」との問い合わせがあった際の対応フローです。


    【考えられる原因】

    1. 国内株式以外の取引：国内株式の売買手数料は0円ですが、米国株式などの海外取引にはインフラ維持と規制遵守のためのコストとして別途手数料が設定されています。

    2. 課税口座での取引：NISA（成長投資枠）ではなく、特定口座や一般口座で取引が行われた場合、20.315%の税金が適用されます。

    3. 限度額超過：年間投資枠2,400,000円または非課税保有限度額12,000,000円を超えて購入しようとした際のエラーや、不適切に課税口座へ振り替えられたケース。


    【確認手順】

    1. 取引履歴の確認：取引した商品が「国内株式」であるかを確認してください。

    2. 口座区分の確認：注文時に「NISA（成長投資枠）」が正しく選択されていたかを確認してください。

    3. 適用料率の照合：海外取引の場合は、最新の料率表と照らし合わせます。


    【解決しない場合の対応】

    原因が特定できない場合や、システム不備が疑われる場合は、社内のコンプライアンス担当または専門の運用責任者へエスカレーションしてください。顧客には調査プロセスを透明性を持って提示し、誠実に対応します。


    手数料の詳細は「NISA（成長投資枠）：金利・料率の決まり方と適用」を参照してください。'
