- id: 6ec98131-e72d-54f2-8544-7065282d4681
  title: change_nisa_provider ツールリファレンス
  body: 'このツールは、他金融機関でNISA口座を保有しているお客様が、星見証券へ口座を変更（金融機関変更）する手続きを開始するために使用します。


    エージェントは、お客様との会話を通じて本人確認を完了させた後、このツールを直接呼び出すことで手続きを実行します。


    【機能】

    他の金融機関から星見証券へのNISA口座移管手続きを開始します。なお、当該年においてすでに他社でNISA口座による買付けを行っている場合は、翌年分からの変更となります。


    【引数】

    本ツールは、既に `verify_identity` によって認証済みの顧客コンテキストを使用して動作するため、個別の認証コードやPINは不要です。'
