- id: edc86916-a97d-57d3-8939-474a629704cb
  title: 特定口座（源泉徴収あり）：プランの選び方
  body: '資産形成における口座選びで、特定口座（源泉徴収あり）がどのようなメリットを持つかを解説します。


    【特定口座（源泉徴収あり）の特長】

    ・利便性：上場株式等の譲渡益・配当にかかる税率20.315%の計算と納税を当社が代行するため、原則として確定申告が不要です。

    ・コスト：国内株式の売買手数料は0円であり、低コストで取引可能です。

    ・管理：損失が出た場合、確定申告により最大3年まで繰越控除が可能です。


    【他プランとの比較】

    ・NISA口座：利益が非課税となるため、最優先で利用すべき口座です。非課税枠を超えた分を本口座で運用するのが効率的です。

    ・特定口座（源泉徴収なし）：ご自身で税金計算と確定申告を行う必要があります。税務知識があり、精緻に申告したい方向けです。


    結論として、「税金の手続きをシンプルにしたい」「低コストで効率的に運用したい」という方には、本プランが最適です。'
