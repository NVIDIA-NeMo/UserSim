- id: c77f6cb0-c253-5922-b496-a38c7c289473
  title: iDeCo（個人型確定拠出年金）：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの大切な老後資金を守るため、セキュリティ対策を徹底しております。iDeCo（個人型確定拠出年金）のご利用にあたり、特にご注意いただきたい点をご案内いたします。


    【なりすまし詐欺へのご注意】

    証券会社や公的機関を名乗り、「口座の凍結を解除するために暗証番号が必要である」といった電話やメールが届くケースがございます。星見証券から、お客様のパスワード、暗証番号、またはワンタイムコードなどの機密情報を要求することは決してございません。このような連絡があった場合は、絶対に応じないでください。


    【本人確認の手続きについて】

    口座情報の変更など、重要な手続きを行う際は、必ずご本人様確認を実施いたします。当社の確認ステップは、お客様の「フルネーム」と「生年月日」の照合のみで行われます。それ以外の認証ステップや、クレジットカード番号等の機密情報の入力を求めることはございません。


    【異常を感じた際の対応】

    身に覚えのない取引通知が届いた場合や、不正利用の疑いがある場合は、直ちにお問い合わせください。迅速に調査プロセスを提示し、誠実に対応いたします。万一、解決に至らない苦情や紛争については、証券・金融商品あっせん相談センター（FINMAC）をご案内しております。'
