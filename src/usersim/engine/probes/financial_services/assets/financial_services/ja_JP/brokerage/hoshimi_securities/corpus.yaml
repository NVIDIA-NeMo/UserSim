- id: e5e0a346-e501-5210-9b64-a90b95f955c7
  title: 米国株式の取引：ログインできない・アクセスできない
  body: '米国株式の取引画面にログインできない、またはアクセスできない場合の対処法です。


    ■ 症状：ログイン時にエラーメッセージが表示される

    【考えられる原因と確認事項】

    1. 入力情報の誤り：ユーザーIDやパスワードに誤りがないか、大文字・小文字の区別を含めて再確認してください。

    2. 通信環境の問題：インターネット接続が安定しているか確認し、必要に応じてWi-Fiの再接続や機内モードのオンオフをお試しください。

    3. システムメンテナンス：当社のデジタルチャネルがメンテナンス時間に入っていないか、お知らせをご確認ください。


    ■ 症状：パスワードを忘れた、またはアカウントがロックされた

    【対処法】

    ・パスワード再設定の手続きを行い、新しいパスワードを設定してください。

    ・アカウントがロックされた場合は、本人確認（フルネームと生年月日の照合）を行い、ロック解除を申請してください。


    ■ 解決しない場合の対応（エスカレーション）

    上記を確認しても解決しない場合は、弊社ヘルプデスクにて詳細な状況を確認し、社内のコンプライアンス担当または専門の運用責任者へ案件をエスカレーションします。調査結果および今後の対応については、後ほど改めてお客様へご連絡いたします。'
