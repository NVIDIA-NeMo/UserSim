- id: 9ee5ab9a-6f27-52ad-b1e1-5311f15510d7
  title: Quill Instant Access Savings — account security best practices
  body: "Protecting your hard-earned savings is our highest priority. Because Quill\
    \ Instant Access Savings are managed through an app-first interface, your primary\
    \ line of defence is the security of your device and your identity verification.\
    \ \n\nTo maintain the highest standard of account security, we employ multi-factor\
    \ authentication (MFA) and in-app biometric checks. You should ensure that biometrics\
    \ (such as FaceID or fingerprint scanning) are enabled on your device to prevent\
    \ unauthorised access to your savings pots. \n\nBe aware of the following security\
    \ rules:\n1. We will never ask you to disclose your full password, PIN, or biometric\
    \ data via chat or email.\n2. We will never ask you to transfer your savings to\
    \ a 'safe account' or 'temporary holding account' to protect them from fraud.\n\
    3. Any state-changing action, such as a large withdrawal from your savings, requires\
    \ rigorous identity verification before we can process the request.\n\nIf you\
    \ notice any suspicious activity, such as an unexpected movement of funds or a\
    \ notification for a login you did not initiate, tell us immediately. We prioritise\
    \ the rapid resolution of disputes and can apply instant card control or account\
    \ freezes to stop further loss. For more information on how we handle fraud, please\
    \ see Quill Instant Access Savings — fraud and unauthorised-activity protection."
  domain: retail_banking
  product_category: instant_access_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: cfc9d1ca-20a8-5160-9f45-e7f4d3364460
  title: Quill Instant Access Savings — change-of-terms policy
  body: "This policy governs how we manage changes to the terms and conditions of\
    \ your Quill Instant Access Savings account. As a modern neobank, we strive for\
    \ agility, but we remain committed to the Consumer Duty to ensure fair outcomes\
    \ for all customers.\n\nInterest Rate Adjustments: The interest rate of 3.75%\
    \ AER is variable. This means we may increase or decrease the rate based on market\
    \ conditions or regulatory changes. We will notify you of any rate changes via\
    \ a push notification and an in-app message. \n\nGeneral Term Changes: If we make\
    \ significant changes to the way the account operates—such as altering the rules\
    \ around savings pots or changing the identity verification requirements for withdrawals—we\
    \ will provide you with at least 30 days' notice before the change takes effect.\
    \ \n\nYour Rights: If you do not agree to a change in terms, you have the right\
    \ to close your savings pot. We will ensure that all interest accrued up to the\
    \ date of closure, calculated at the applicable rate, is paid into your linked\
    \ current account. \n\nTermination: We may terminate this agreement immediately\
    \ if we suspect fraudulent activity or a breach of our security protocols. Your\
    \ eligible deposits remain protected by the FSCS up to £120,000 per person, per\
    \ institution, regardless of changes to these terms."
