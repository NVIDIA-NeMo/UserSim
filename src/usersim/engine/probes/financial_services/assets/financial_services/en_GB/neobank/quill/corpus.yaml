- id: 533d5d29-70a0-522e-9fad-2c8afb6b7709
  title: Quill Current Account — a discrepancy in your records or statement
  body: 'When a customer reports a discrepancy in their records or a statement error,
    it is essential to follow a methodical verification process to ensure a fair outcome
    in line with Consumer Duty.


    **Symptom**

    The customer claims a transaction amount is incorrect, a payment has been debited
    twice, or a credited amount is missing from their transaction history.


    **What to Check (In Order)**

    1. **Pending vs. Settled:** Check if the transaction is still ''Pending''. Some
    merchants place a temporary hold on funds that may differ from the final settled
    amount. Advise the customer that the final amount will be corrected once the transaction
    settles.

    2. **Transaction IDs:** Compare the transaction IDs in our system with the customer''s
    evidence. If there are two identical amounts but different IDs, it may be two
    separate legitimate payments.

    3. **Daily Limits and Fees:** Ensure the discrepancy isn''t actually a legitimate
    charge. For example, verify if the customer has exceeded their £200 monthly fee-free
    ATM allowance, resulting in an unexpected fee.

    4. **Overdraft Interest:** If the discrepancy relates to a balance drop, check
    if interest on an arranged overdraft has been applied at the rate of 29%.


    **The Fix**

    - If the error is a simple processing delay, explain the timeline for settlement.

    - If the discrepancy is a genuine bank error, acknowledge the mistake and initiate
    a correction to restore the funds immediately.


    **When to Escalate**

    If the customer disputes a transaction that appears legitimate in our records,
    we must treat it as a formal dispute. We will route the case to our tiered specialist
    path. We are committed to providing a final response for payment services disputes
    within 15 business days. While the specialist reviews the case, provide the customer
    with a reference number and a clear timeline for the final response.


    For guidance on the tools used for this process, refer to the internal policy
    for filing transaction disputes.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 505c1410-ea36-5d44-96e5-4c3f635e1ee7
  title: Quill Plus — overview
  body: 'Welcome to Quill Plus, our premium subscription tier designed for digitally
    native consumers who want to elevate their financial management. While our standard
    offering provides the essentials, Quill Plus is built for those who value additional
    value-added services and enhanced app functionality to support their overall financial
    wellness.


    Quill Plus is an app-first experience that integrates seamlessly with your existing
    banking journey. By upgrading to this tier, you move beyond the basics of the
    current account to a more comprehensive suite of features tailored for agility
    and transparency. We believe in a fair and clear pricing model, which is why we
    maintain a straightforward cost structure without hidden charges or complex tiers.


    To enjoy the premium enhancements of Quill Plus, there is a monthly fee of £7.
    This subscription funds the ongoing development and provision of our advanced
    features. It is important to note that when you activate Quill Plus, you are committing
    to a minimum term of 3 months. This ensures that you have sufficient time to experience
    the full range of benefits and integrate the premium tools into your daily financial
    routine.


    Our commitment to your security remains paramount regardless of your account tier.
    Whether you are using our basic services or the premium enhancements of Quill
    Plus, we employ rigorous identity verification, multi-factor authentication, and
    in-app biometric checks to ensure your funds and data remain protected. We operate
    under the strict supervision of the FCA and PRA, adhering to the Consumer Duty
    to ensure that every customer receives a fair outcome.


    If you are currently using our core entry point and are wondering whether to upgrade,
    we recommend reviewing the specific enhancements available in the app. For those
    who only require essential spending and management, our standard account remains
    available with a £0 monthly fee. However, for those seeking a more robust toolset
    to manage their financial life, Quill Plus provides the professional yet approachable
    solution you need.'
