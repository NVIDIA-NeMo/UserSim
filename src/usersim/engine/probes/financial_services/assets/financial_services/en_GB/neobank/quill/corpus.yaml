- id: ccf38c4c-589e-5897-827d-42417f00d8e1
  title: Quill Payments — make a change or update
  body: 'If you need to update the details of a saved beneficiary or change a recurring
    payment amount, please follow these steps to ensure your funds are sent securely.


    **Updating a Beneficiary**

    1. Tell us which saved payee you wish to update and provide the new account name,
    sort code, and account number.

    2. We will perform a Confirmation of Payee check to verify that the new details
    match the intended recipient. This prevents funds from being sent to the wrong
    person.

    3. Once we confirm the match, we will update the beneficiary record in your account.

    4. We will send you an in-app notification confirming that the payee details have
    been successfully updated.


    **Changing a Payment Amount**

    1. Specify the payment or scheduled transfer you wish to modify and the new amount
    you intend to send.

    2. We will verify that the new amount is within your daily limit for Faster Payments,
    which is £10,000. If the amount exceeds this limit, we will notify you that the
    payment cannot be processed as requested.

    3. Confirm the update through your in-app biometric check to ensure the request
    is authorised by you.

    4. We will provide a final confirmation message once the payment amount has been
    updated.


    If you encounter any issues during this process, such as a failure in the biometric
    check, please refer to Quill Payments — access or login problems.'
  domain: payments
  product_category: payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: f9f89e17-22cf-5cea-8a19-76d7ff3ff3dc
  title: Quill Payments — access or login problems
  body: 'If you are unable to access the payment features within the app, it is typically
    due to a security trigger or a technical mismatch. Here is how to resolve the
    most common issues.


    **Symptom: "Payment Limit Exceeded" message**

    *   **Likely Cause:** You have reached the daily limit for Faster Payments of
    £10,000.

    *   **What to check:** Review your transaction history for the current calendar
    day to see the total amount sent.

    *   **The Fix:** Wait until the next calendar day for the limit to reset. If you
    have an urgent requirement for a higher limit, ask us to escalate this to a specialist
    for a compliance review.


    **Symptom: Biometric check failing during payment confirmation**

    *   **Likely Cause:** The app is unable to verify your identity, or the biometric
    sensor is obstructed.

    *   **What to check:** Ensure your device''s biometric sensors are clean and that
    you are using the most recent version of the Quill app.

    *   **The Fix:** Attempt the check again. If it continues to fail, you can use
    your secure backup PIN to authorise the action.


    **Symptom: Unable to add a new payee due to "Name Mismatch"**

    *   **Likely Cause:** The Confirmation of Payee service has detected that the
    name provided does not match the records at the receiving bank.

    *   **What to check:** Verify the spelling of the recipient''s name and the account
    details provided.

    *   **The Fix:** Correct the details and try again. If the recipient confirms
    the details are correct but the match still fails, we can route this to our payments
    specialist team to investigate the discrepancy.


    In all cases, if we escalate a query to a specialist, we will provide you with
    a status update via the app to ensure we meet our regulatory response timelines.'
  domain: payments
  product_category: payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b964ad3e-18ef-5ce6-af8b-90a407e1e920
  title: Quill Payments — qualification tiers
  body: 'Quill Payments is designed to be accessible to all our users. The following
    matrix defines the eligibility for our payment features:


    | Customer Tier | Access to Faster Payments | Fee for Faster Payment | Daily Limit
    |

    | :--- | :--- | :--- | :--- |

    | Current Account (Standard) | Full Access | £0 | £10,000 |

    | Quill Plus (Premium) | Full Access | £0 | £10,000 |


    All users, regardless of their tier, must complete the mandatory identity verification
    and biometric setup before these features are activated. There are no minimum
    balance requirements to qualify for the £0 fee structure.'
  domain: payments
