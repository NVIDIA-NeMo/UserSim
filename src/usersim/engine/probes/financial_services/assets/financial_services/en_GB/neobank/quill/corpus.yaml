- id: 12192606-48fd-5d17-8550-329a45e785a0
  title: Quill Instant Access Savings — an unexpected charge or amount
  body: 'As a support agent, use this guide when a customer reports a discrepancy
    in their Quill Instant Access Savings balance or an unexpected amount.


    Symptom: ''My interest payment seems lower than expected'' or ''My balance isn''t
    what I thought it would be.''


    Likely Causes:

    1. Interest Calculation: The customer may be calculating interest on a simple
    basis rather than the 3.75% AER (Annual Equivalent Rate), which accounts for compounding.

    2. Pending Transfers: Funds may have been moved to the current account but are
    not yet reflecting in the total balance due to a momentary sync delay.

    3. Account Closure: If the account was recently closed, the final interest payment
    may be processed slightly differently than monthly cycles.


    What to check in order:

    1. Verify the current balance in the savings pot and check the transaction history
    for any recent transfers to the current account.

    2. Confirm that the interest was applied based on the 3.75% AER.

    3. Check for any disputed transactions that may have affected the available balance.


    Resolution:

    - If the amount is correct based on the 3.75% AER, explain the compounding effect
    of the Annual Equivalent Rate to the customer using plain English.

    - If there is a genuine technical discrepancy, we will raise a case with our finance
    specialists to investigate the ledger.


    Escalation:

    If the customer remains dissatisfied, we will route the query to a tiered specialist
    path to ensure a final response is provided within the regulatory response timelines.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
