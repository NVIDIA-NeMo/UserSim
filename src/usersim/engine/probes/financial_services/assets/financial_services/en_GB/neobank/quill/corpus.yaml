  institution_id: quill
- id: 3c3b68e7-03f6-5168-a195-0b79703cfb75
  title: Quill Debit Card — a failed or pending action
  body: 'It can be frustrating when a payment is declined or a card action remains
    pending. Below are the most common causes and the steps to resolve them.


    **Symptom: Your card is declined at a point-of-sale terminal.**


    Likely Causes:

    - Insufficient funds in your current account.

    - The card has been frozen via the app''s security controls.

    - An incorrect PIN was entered multiple times.

    - A security block was triggered by a high-risk or unusual transaction pattern.


    What to check and how to fix:

    1. Check your balance: Verify in the app that you have sufficient funds to cover
    the transaction.

    2. Check card status: Ensure the card is not ''Frozen''. If it is, simply unfreeze
    it in the app and try the transaction again.

    3. Verify PIN: If you suspect a PIN error, you can request a PIN reminder or reset
    through the app.


    **Symptom: An ATM withdrawal is pending or failed abroad.**


    Likely Causes:

    - The ATM provider has a local limit or temporary outage.

    - You have exceeded your daily spending limit.

    - Connectivity issues between the ATM and our systems.


    What to do:

    - If the transaction is ''Pending'' but the cash was not dispensed, please let
    us know immediately. We will initiate a review of the transaction logs.


    **Escalation process**

    If the steps above do not resolve the issue, we will escalate your query to our
    card specialist team. We will review the specific transaction decline codes and
    provide a resolution or a clear explanation within 15 business days for payment
    services. For guidance on the initial setup of your card, you may wish to review
    the Quill Debit Card — set up and activate guide.'
  domain: cards
  product_category: debit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 76b9b372-f265-57ff-9d86-b9aa6fbd749d
  title: Quill Debit Card — eligibility requirements
  body: 'The Quill Debit Card is available to customers who meet the following criteria:


    - Active Account Holder: You must hold an open and active Quill current account.
    (Outcome: Eligible)

    - Identity Verification: You must have successfully completed our rigorous identity
    and biometric verification process. (Outcome: Eligible)

    - Account Status: Your account must not be restricted due to compliance or regulatory
    flags. (Outcome: Eligible)


    If you have not yet opened an account, please refer to the Quill Current Account
    — eligibility requirements to see if you qualify for the underlying account required
    to issue a card.'
  domain: cards
  product_category: debit_card
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: ea004451-1079-5e7a-9d16-0c213623ccd8
  title: Quill Debit Card — vs. a similar product here
  body: 'When comparing the Quill Debit Card to a traditional high-street bank debit
    card, the primary differences lie in cost transparency and agility.


    **Cost of International Spend**

    Traditional cards often charge a percentage-based fee on every single transaction
    made in a foreign currency. In contrast, Quill offers a 0% foreign transaction
    fee, making it a superior choice for frequent travellers or those shopping from
    international retailers.


    **Cash Access Abroad**

    Many traditional banks charge a flat fee per ATM withdrawal abroad. Quill provides
    a fee-free ATM allowance of £200 per month. Only once this allowance is exceeded
    do we apply a 3% fee, whereas traditional banks often charge from the first penny.


    **Control and Agility**

    Quill is app-first, offering instant card control (freeze/unfreeze) and real-time
    notifications. Traditional banks may require phone calls or slower portal updates
    to manage card security.


    **Who it suits**

    The Quill Debit Card is ideal for digitally native users and global travellers.
    A traditional bank card may be preferable only for those who require physical
    branch access for complex cash deposits.'
  domain: cards
  product_category: debit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b6645cf0-6018-54dc-ac29-56f97585ba0b
  title: Quill Debit Card — regulatory disclosures
  body: 'The Quill Debit Card is issued by Quill, which operates under the strict
    supervision of the Financial Conduct Authority (FCA) and the Prudential Regulation
    Authority (PRA). We are committed to the Consumer Duty, ensuring that all our
    products and services provide fair outcomes for our customers.


    **Deposit Protection**

    Funds held in the account linked to your Quill Debit Card are protected by the
    Financial Services Compensation Scheme (FSCS). Eligible deposits are protected
    up to £120,000 per person, per institution. This provides a critical layer of
    security for your balance in the unlikely event of institutional failure.


    **Fraud and Dispute Handling**

    We prioritise the rapid resolution of disputes. For payment services, we commit
    to providing a final response within 15 business days. We are dedicated to protecting
    our customers from fraud; this includes the reimbursement of authorised push payment
    (APP) scams up to £85,000, subject to our terms and conditions.


    **Fees and Charges**

    Our fee structure is designed for transparency. The Quill Debit Card features
    a 0% foreign transaction fee and a monthly fee-free ATM allowance abroad of £200.
    Any withdrawals abroad exceeding this £200 limit incur a fee of 3%.


    For further details on the regulatory environment governing our card services,
    please see the Regulatory notes for Cards.'
  domain: cards
  product_category: debit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 60caa821-9efa-514d-b319-67cac3153149
  title: Quill Debit Card — interest rate / AER schedule
  body: 'The Quill Debit Card is a payment and spending tool; as such, it does not
    earn interest. The interest rate (AER) applicable to the card itself is 0%.


    Because the card is linked to your current account, the funds you spend are drawn
    from a non-interest-bearing balance. To earn interest on your money while maintaining
    the ability to spend via your debit card, we recommend using our intuitive savings
    pots. For example, our instant access savings tool allows users to earn 3.75%
    AER.


    For a detailed explanation of how to grow your wealth with us, please refer to
    the Quill Instant Access Savings — overview.'
  domain: cards
  product_category: debit_card
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 5d629fd1-a23c-54be-830f-56ad2025855d
  title: Quill Debit Card — current offer
  body: 'Travel the world without the hidden costs. We are currently highlighting
    our global-ready features to help our users maintain financial wellness while
    exploring.


    **Current Feature Highlight: Zero-Cost Global Spend**


    For all existing and new customers, the Quill Debit Card continues to offer a
    0% foreign transaction fee on all purchases made abroad. Whether you are dining
    in Tokyo or shopping in New York, you will never pay a surcharge for using your
    card in a foreign currency.


    Additionally, take advantage of our £200 monthly fee-free ATM allowance for cash
    withdrawals abroad. If you need more, a simple fee of 3% applies only to the amount
    above the £200 threshold.


    This offer is available to all eligible account holders indefinitely as part of
    our commitment to transparency and fairness. For more details on how these fees
    work, see the Quill Debit Card — non-sterling transaction fee explained.'
