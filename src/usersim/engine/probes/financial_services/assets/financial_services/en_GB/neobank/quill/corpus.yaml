- id: 8c67d049-24d3-575b-b0fe-712b704b3325
  title: Quill Instant Access Savings — how rates are tiered and applied
  body: "As a support agent, please use the following guidelines to explain interest\
    \ application for the Quill Instant Access Savings product.\n\nRate Structure:\n\
    Quill Instant Access Savings uses a flat-rate structure. There are no tiers based\
    \ on balance levels. A single interest rate of 3.75% AER applies to all balances,\
    \ from the first pound saved up to the maximum account limit.\n\nApplication of\
    \ Interest:\n- Rate: 3.75% AER (Annual Equivalent Rate).\n- Calculation: Interest\
    \ is calculated daily based on the closing balance of the savings pot.\n- Crediting:\
    \ Interest is credited to the account monthly.\n\nWhat would change the rate?\n\
    The rate is variable. Changes are driven by: \n1. Decisions by the Bank of England\
    \ regarding the base rate.\n2. Internal reviews of our competitive positioning\
    \ in the neobank market.\n\nWhen a rate change occurs, we notify the customer\
    \ via the app. The new rate will apply to all balances starting from the effective\
    \ date of the change."
