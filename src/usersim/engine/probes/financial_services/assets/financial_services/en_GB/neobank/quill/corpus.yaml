- id: ab56b186-89a3-5aa5-8700-cf2c89fd832d
  title: Quill Plus — referral and loyalty offer
  body: 'We are pleased to introduce our latest loyalty initiative for the Quill community.
    From 1 November 2024 to 31 December 2024, we are offering a special referral incentive
    to help you and your friends experience our premium services.


    If you are an existing customer and successfully refer a new user to open a Quill
    account, we will waive the £7 monthly fee for your Quill Plus subscription for
    one full month. To qualify, the referred friend must successfully complete our
    identity verification and open an account. Once verified, we will apply the credit
    to your account automatically.


    This offer is designed to reward those who help us grow our community of digitally
    native consumers. Please note that the standard £7 monthly fee applies to all
    other months of the subscription, and the minimum term of 3 months remains in
    effect for all new Quill Plus activations. For more details on our pricing, you
    may wish to view Quill Plus — cost and charges.'
  domain: retail_banking
