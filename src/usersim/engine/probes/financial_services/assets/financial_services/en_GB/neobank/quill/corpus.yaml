- id: bcacbe86-94e4-517b-b21f-35f257f8b3ee
  title: Quill Instant Access Savings — fraud and unauthorised-activity protection
  body: 'When choosing where to keep your savings, security should be your primary
    consideration. At Quill, we protect your Quill Instant Access Savings with the
    same rigour as our spending accounts, ensuring your funds remain secure while
    earning 3.75% AER.


    One common fraud pattern targeting savings products is the ''Safe Account'' scam.
    In this scenario, fraudsters may contact you pretending to be from our security
    team, claiming your funds are at risk and instructing you to move your money into
    a ''safe'' account. Please be aware: we will never ask you to transfer your savings
    to a different account to keep them safe. Any request to do so is a red flag for
    fraud.


    To provide peace of mind for those comparing their options, your deposits are
    protected by the Financial Services Compensation Scheme (FSCS) up to £120,000
    per person, per institution. This means that even in the unlikely event of institutional
    failure, your money is safe up to this limit.


    Furthermore, we are committed to protecting you from Authorised Push Payment (APP)
    scams. If you are tricked into voluntarily transferring money from your savings
    to a fraudster, we provide reimbursement for such scams up to £85,000.


    If you ever notice a transaction you did not authorise, or if you receive a suspicious
    request for your account details, the first action you must take is to use the
    instant card control or account freeze features within the app. We employ multi-factor
    authentication and biometric checks to ensure that only you can access your funds.
    We will never ask for your full PIN or password over the phone or via email.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: a9939134-04ef-5c9a-b5e7-1f58081ad78e
  title: Quill Instant Access Savings — account agreement
  body: "This agreement outlines the binding terms between Quill and the customer\
    \ regarding the Quill Instant Access Savings account. \n\n1. Interest and Earnings:\
    \ We agree to pay interest on the daily balance of the account at a rate of 3.75%\
    \ AER. This rate is variable, meaning we may change it based on market conditions.\
    \ We will notify you of any changes via the app.\n\n2. Deposit Protection: All\
    \ eligible deposits are protected by the FSCS up to a maximum of £120,000 per\
    \ person. \n\n3. Customer Obligations: The customer must provide valid identity\
    \ verification and proof of tax residency before the account is activated. The\
    \ customer is responsible for maintaining the security of their biometric and\
    \ multi-factor authentication credentials.\n\n4. Access and Withdrawals: As an\
    \ 'instant access' product, the customer may transfer funds out of the savings\
    \ pot into their Quill current account at any time without penalty. \n\n5. Account\
    \ Closure: Either party may terminate this agreement. The customer may close the\
    \ account via the app. Upon closure, all remaining funds and accrued interest\
    \ will be transferred to the customer's linked Quill current account.\n\n6. Changes\
    \ to Terms: We may update these terms to reflect regulatory changes or service\
    \ enhancements. We will provide clear and concise notice of any material changes\
    \ before they take effect.\n\n7. Fraud and Disputes: In accordance with our dispute\
    \ handling policy, we aim to provide final responses for payment service disputes\
    \ within 15 business days. Our commitment to reimburse APP scams up to £85,000\
    \ is subject to our fraud investigation process."
