- id: f3dc7503-8567-5fed-afa4-9dd4b1d70021
  title: Quill Instant Access Savings — getting started walkthrough
  body: 'This walkthrough is intended for support agents assisting customers in the
    setup of their savings tool. Quill Instant Access Savings allows users to earn
    3.75% AER via intuitive savings pots, providing a frictionless way to manage financial
    wellness.


    Prerequisites for the Customer:

    - A fully verified Quill account.

    - An active current account (which carries a monthly fee of £0) to act as the
    funding source.


    Walkthrough Steps:

    1. Verification: Confirm the customer has completed the mandatory identity verification
    process. This is required before any state-changing action can occur.

    2. Pot Creation: Guide the customer to the ''Savings'' section of the app. They
    can create a new ''pot'' and give it a custom name (e.g., ''Holiday Fund'' or
    ''Emergency Rainyday'').

    3. Funding: The customer transfers funds from their current account into the pot.
    These transfers are fast and secure with £0 fees.

    4. Rate Confirmation: Confirm to the customer that their balance will earn an
    interest rate of 3.75% AER. Explain that this is an Annual Equivalent Rate, meaning
    it reflects the yearly interest earned.

    5. Accessibility: Remind the customer that these funds are ''instant access'',
    meaning they can move money back to their current account at any time without
    penalty.


    If the customer is interested in further premium features to complement their
    savings, you may mention Quill Plus, which is available for a £7 monthly fee.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: product_sheet
  source_authority: official
