  institution_id: quill
- id: f9dfe4aa-196a-52a4-b452-5bd0b3d44395
  title: Quill Debit Card — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational limits and fee triggers associated with the Quill Debit Card.


    Core Financial Limits and Fees:

    - Foreign Transaction Fees: The Quill Debit Card carries a 0% foreign transaction
    fee. This applies to all purchases made in non-sterling currencies; we do not
    add a markup to the exchange rate.

    - Monthly ATM Allowance (Abroad): Users have a fee-free ATM withdrawal allowance
    of £200 per calendar month when using the card at an automated teller machine
    outside of the UK.

    - Excess ATM Charges: Once the £200 monthly allowance is exceeded, a fee of 3%
    is applied to the value of each subsequent withdrawal.


    Operational Restrictions and Edge Cases:

    - Card Freezing: Users can instantly freeze and unfreeze their card via the app.
    While frozen, all point-of-sale and ATM transactions are blocked, though some
    recurring subscriptions may still process depending on the merchant''s billing
    agreement.

    - ATM Operator Fees: While we do not charge a fee for the first £200 of withdrawals
    abroad, the third-party ATM operator may still charge their own local convenience
    fee. This is external to Quill and cannot be waived by us.

    - Transaction Declines: Common edge cases for declines include exceeding the daily
    payment limit (which should be checked against the general payments limits) or
    attempting to use the card at a merchant that does not support our security protocols.


    When assisting customers, always verify if the user is querying a transaction
    fee or an ATM withdrawal charge, as these are governed by different rules (0%
    for spend, 3% for ATM withdrawals over £200).'
  domain: cards
  product_category: debit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 1aa2337d-8c28-5c11-b1b9-3560a1d69d52
  title: Quill Debit Card — cost and charges
  body: 'How much does it cost to use my Quill Debit Card for shopping abroad?

    There are no charges for spending. We apply a 0% foreign transaction fee, meaning
    you pay the exchange rate without any added cost from us when you make purchases
    in a foreign currency.


    Are there fees for taking out cash from an ATM while I am travelling?

    We provide a fee-free ATM allowance of £200 each month for withdrawals made abroad.
    If you withdraw more than £200 in a single monthly period, we charge a fee of
    3% on the amount that exceeds this limit.


    Is there a monthly fee for having the card?

    The Quill Debit Card is a feature of our core account. As outlined in Quill Current
    Account — overview, our current_account has a monthly fee of £0, making the card
    accessible and free to maintain.'
  domain: cards
