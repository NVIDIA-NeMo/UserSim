  mentions_tools: []
  institution_id: quill
- id: 971363ca-bc81-571b-b895-8a2d130af1fc
  title: Quill Debit Card — referral and loyalty offer
  body: 'We are delighted to reward our community for helping us grow. If you are
    joining Quill for the first time via a friend''s referral, you can start your
    journey with a global-ready account designed for the modern traveller.


    By opening your account and activating your Quill Debit Card, you immediately
    unlock our loyalty-focused fee structure. We believe in rewarding your trust with
    transparency: you will enjoy 0% foreign transaction fees on all your spending
    abroad, ensuring you get the most out of your money regardless of where you are
    in the world. Additionally, we provide a generous fee-free ATM allowance of £200
    every month for cash withdrawals abroad.


    This offer is available to all new customers who successfully complete our identity
    verification process. Join us today and experience a fairer way to bank, where
    we prioritise your financial wellness and agility over hidden charges.'
  domain: cards
