- id: edcca515-b608-5043-9e35-66b36bcb00cd
  title: Quill Current Account — vs. a typical competitor offering
  body: 'When comparing the Quill Current Account to typical offerings from legacy
    high-street banks or other neobanks, several key distinctions emerge in terms
    of cost, protection, and agility.


    **Cost and Fees**

    Many traditional competitors charge a monthly maintenance fee for basic accounts
    or require a minimum monthly deposit to waive such fees. In contrast, the Quill
    Current Account maintains a transparent monthly account fee of £0, with no hidden
    strings attached.


    **Fraud Protection**

    While most banks provide basic fraud monitoring, Quill offers an aggressive posture
    towards customer protection. We provide reimbursement for eligible authorised
    push payment (APP) scams up to £85,000, a threshold that is often significantly
    higher than the discretionary limits found at other institutions.


    **User Experience**

    Legacy banks often rely on branch networks or slow web portals. We compete on
    a frictionless, app-first experience with 24/7 support and instant card control.


    **Verdict**

    - **Choose a typical competitor** if you require physical cash deposits at a branch
    or complex, face-to-face financial relationship management.

    - **Choose the Quill Current Account** if you value a £0 monthly fee, superior
    APP fraud protection, and the agility of a modern digital interface.'
  domain: retail_banking
