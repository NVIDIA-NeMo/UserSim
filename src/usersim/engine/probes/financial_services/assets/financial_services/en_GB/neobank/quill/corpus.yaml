  mentions_tools: []
  institution_id: quill
- id: 78bf2ad6-7d80-50fa-bccb-cebe363115ba
  title: Quill Debit Card — cancel, close, or downgrade
  body: 'If you no longer require your Quill Debit Card or wish to move to a different
    service tier, follow these steps to ensure your card is closed securely.


    Before starting, ensure that any pending transactions have cleared and that you
    have noted any recurring payments linked to the card, as these will fail once
    the card is cancelled.


    1. Tell us that you wish to cancel or close your Quill Debit Card. We will then
    verify your identity using our standard in-app biometric checks to ensure the
    request is authorised.

    2. We will ask you to confirm if you wish to close the card only or the entire
    associated account. If you are downgrading from a premium tier, specify the plan
    you wish to move to.

    3. We will check for any remaining balances or active disputes. If there are pending
    disputes, we will advise you on the expected timeline for resolution before the
    final closure.

    4. We will process the cancellation. You will receive an immediate confirmation
    in the app that the card is no longer active and cannot be used for further transactions.

    5. Once confirmed, we will provide instructions on how to securely destroy your
    physical card.


    Your request is processed immediately upon verification. If you are closing your
    account to move to another institution, you may also wish to use the Current Account
    Switch Service for a guaranteed transition. For more details on account transitions,
    see Quill Current Account — overview.'
  domain: cards
  product_category: debit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: c0875d89-ad48-5830-ab4a-cf1ab9c342ae
  title: Quill Debit Card — an unexpected charge or amount
  body: 'If you notice a charge on your statement that appears unexpected or an amount
    that differs from your intended spend, please follow this troubleshooting process.


    Symptom: An unexpected fee has appeared following an ATM withdrawal abroad.


    Likely Cause: You may have exceeded your monthly fee-free ATM allowance. We provide
    £200 of fee-free withdrawals abroad per month; any amount withdrawn beyond this
    limit attracts a fee of 3%.


    What to check in order:

    1. Review your transaction history for the current calendar month.

    2. Total all ATM withdrawals made outside of the UK.

    3. Determine if the sum of these withdrawals exceeds £200. If it does, the 3%
    fee is correctly applied to the amount above that threshold.


    Symptom: A transaction amount is higher than the price listed at the point of
    sale.


    Likely Cause: This is usually due to the exchange rate applied by the merchant
    or the network, not a Quill fee, as we charge a 0% foreign transaction fee.


    Fix: Compare the transaction amount against the mid-market exchange rate for that
    date. If the discrepancy is due to a merchant error or unauthorised activity,
    let us know.


    When to escalate:

    If the fee was applied despite you being under the £200 limit, or if you suspect
    the charge is fraudulent, tell us immediately. We will then raise a formal case,
    route the query to our payment specialists, and if applicable, apply a provisional
    credit while we investigate. You will receive a final response within 15 business
    days.'
  domain: cards
  product_category: debit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 07b74f7b-65eb-5452-9ef2-b671528504d7
  title: Quill Debit Card — required documentation
  body: 'To issue a Quill Debit Card, we must adhere to strict regulatory standards.
    The following documentation and verification steps are mandatory for all prospective
    customers:


    | Requirement | Documentation/Action | Outcome |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid government-issued photo ID (e.g., Passport or Driving
    Licence) | Identity Verified |

    | Proof of Residency | Recent utility bill or official correspondence | Address
    Verified |

    | Account Security | Successful completion of in-app biometric check | Security
    Enabled |

    | Identity Confirmation | Multi-factor authentication (MFA) setup | Account Active
    |


    All documentation must be clear and legible. Failure to provide valid identity
    verification will result in the card application being declined to ensure compliance
    with FCA and PRA regulations.'
