- id: 08646ba0-cc91-54db-991f-99ca2885e3fd
  title: Quill Plus — fraud and unauthorised-activity protection
  body: "When choosing a premium banking tier, the quality of security and fraud protection\
    \ is often the deciding factor. At Quill, we integrate the advanced protections\
    \ of our core platform into Quill Plus to ensure your enhanced features never\
    \ come at the cost of safety. \n\nWe employ a rigorous identity verification process\
    \ and multi-factor authentication for every state-changing action. For users of\
    \ Quill Plus, this means that any high-value movement of funds or changes to account\
    \ permissions are protected by in-app biometric checks, ensuring that only you\
    \ can access your premium services.\n\nOur commitment to protecting our customers\
    \ from fraud is absolute. We operate under the strict supervision of the FCA and\
    \ PRA, adhering to the Consumer Duty to ensure fair outcomes. If you fall victim\
    \ to an Authorised Push Payment (APP) scam, we are committed to the reimbursement\
    \ of such losses up to £85,000. Furthermore, all eligible deposits within your\
    \ account are protected by the FSCS up to £120,000 per person, per institution.\n\
    \nWe believe in proactive security. Users can employ instant card control and\
    \ gambling blocks directly within the app to mitigate risk before fraud occurs.\
    \ If you do encounter unauthorised activity, we prioritise rapid resolution; we\
    \ provide final responses for payment services disputes within 15 business days.\n\
    \nTo maintain this level of security, please be aware that we will never ask you\
    \ for your full PIN, password, or biometric data over a phone call or email. If\
    \ you receive any request for this information, do not provide it and report the\
    \ incident to us immediately. The first step in securing your account after a\
    \ suspected breach is to use the instant card control feature to freeze your debit\
    \ card.\n\nWhile Quill Plus carries a monthly fee of £7 to fund additional value-added\
    \ services, these security frameworks are provided as a standard of care for all\
    \ our users, ensuring a frictionless yet safe experience."
