- id: 0f934f59-9757-5bb6-91d3-6f7e94c03691
  title: Quill Plus — a discrepancy in your records or statement
  body: 'Support agents should follow this process when a customer reports that the
    charges for their Quill Plus subscription do not match their expectations.


    **Symptom: Customer reports an incorrect number of charges or a missing charge**

    This usually manifests as a customer claiming they were charged the £7 fee twice
    in one month, or that they were charged after they believed they had cancelled.


    **What to check and in what order**

    1. **Verify the Billing Cycle:** Check the date the subscription was activated.
    Confirm if the £7 charge aligns with the monthly anniversary of the sign-up date.

    2. **Check the Minimum Term:** If the customer claims they cancelled but are still
    being charged, check if the 3-month minimum term has elapsed. If they attempted
    to cancel in month 1 or 2, the £7 fee must still be collected for the remainder
    of the 3-month period.

    3. **Review Transaction History:** Check for ''Pending'' vs ''Posted'' transactions.
    Occasionally, a temporary authorisation hold may look like a duplicate charge.

    4. **Verify Account Status:** Ensure the account hasn''t been accidentally upgraded
    twice through a technical glitch (though this is rare due to our identity verification
    protocols).


    **The Fix**

    - **If a duplicate charge occurred:** If a technical error caused two £7 debits
    in a single cycle, we will apply a provisional credit of £7 to the customer''s
    account immediately and raise a case for a permanent reversal.

    - **If the customer misunderstood the minimum term:** Explain the 3-month commitment
    clearly and provide the date when the £7 charges will officially cease.


    **When to escalate**

    If the transaction history shows a discrepancy that cannot be explained by the
    3-month term or the billing cycle, route the query to the billing specialist team.
    The customer should receive a final resolution within 15 business days if the
    discrepancy relates to a payment service dispute.


    For further details on costs, refer to Quill Plus — fee schedule.'
  domain: retail_banking
  product_category: quill_plus
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: fc01f5d7-9375-54b7-b9f2-fd4f1d27c991
  title: Quill Instant Access Savings — overview
  body: 'Welcome to a simpler way of growing your money. Quill Instant Access Savings
    is designed for digitally native consumers who want their money to work harder
    without locking it away. Our goal is to provide a frictionless experience that
    balances high growth with total agility, allowing you to manage your goals through
    intuitive savings pots within our app.


    At the heart of this product is a competitive annual interest rate of 3.75% AER.
    This ensures that your balance grows steadily, regardless of whether you are saving
    for a rainy day, a future holiday, or a major life milestone. Because this is
    an instant access account, you maintain complete control; you can move funds back
    to your spending account whenever you need them, ensuring your financial wellness
    is never compromised by rigid lock-in periods.


    Security and transparency are fundamental to how we operate. All eligible deposits
    in your Quill Instant Access Savings account are protected by the Financial Services
    Compensation Scheme (FSCS) up to £120,000 per person, per institution. This provides
    you with peace of mind knowing your hard-earned savings are secure under the strict
    supervision of the FCA and PRA.


    To keep things fair and transparent, we have removed the barriers typically associated
    with traditional savings accounts. There are no monthly maintenance fees to keep
    your savings pot active, and we avoid the opaque banking jargon that often makes
    financial planning feel inaccessible. We believe that essential banking tools
    should be accessible to all, and our savings product reflects this philosophy
    by offering a straightforward, high-yield environment for your capital.


    Whether you are just starting your savings journey or looking for a more agile
    home for your existing funds, Quill Instant Access Savings provides the perfect
    blend of security, yield, and accessibility. To get started with your first pot,
    you can follow the steps outlined in Quill Instant Access Savings — set up and
    activate.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 39143320-2466-5655-af67-0d95d4c727eb
  title: Quill Instant Access Savings — interest rate (AER) explained
  body: 'How is the interest on my savings calculated?

    We apply an annual interest rate of 3.75% AER to your balance. This rate is calculated
    daily and typically credited to your account monthly, meaning you earn interest
    on your interest throughout the year.


    What does AER actually mean?

    AER stands for Annual Equivalent Rate. As detailed in our glossary, this is the
    interest rate paid on savings, expressed as a yearly percentage. It allows you
    to compare our rate of 3.75% fairly against other savings products in the market,
    regardless of how often interest is paid.


    Is the 3.75% rate guaranteed for the life of the account?

    No, the rate is variable. This means we may adjust the interest rate based on
    market conditions or regulatory changes. We will always notify you clearly and
    concisely within the app if there is a change to the rate you are earning.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 8755ab0f-2e91-5f5c-86c9-c4cffd44c9f0
  title: Quill Instant Access Savings — set up and activate
  body: 'Setting up your savings pots is a quick process designed to get your money
    growing immediately. Before you begin, ensure you have an active Quill account
    and that your biometric security (FaceID or fingerprint) is enabled on your device.


    Follow these steps to activate your savings:


    1. Tell us that you would like to open a Quill Instant Access Savings pot. You
    can do this by requesting a new savings goal through our chat interface.

    2. Provide a name for your pot. Whether it is ''Emergency Fund'', ''New Car'',
    or ''Summer Holiday'', naming your pots helps you track your progress towards
    specific financial wellness goals.

    3. We will then perform a quick biometric check via your app to verify your identity.
    This rigorous verification is mandatory for all state-changing actions to ensure
    your account remains secure.

    4. Once verified, we will confirm that your pot is active. You will see the new
    pot appearing in your account dashboard immediately.

    5. Tell us the amount you wish to make your first deposit. We will transfer these
    funds from your current account into the new savings pot instantly.


    How you know it worked:

    You will receive an in-app confirmation message stating that your pot is open
    and funded. Your account dashboard will now display the total balance of your
    savings and the current annual interest rate of 3.75% AER being applied to those
    funds.


    If you are deciding between different ways to manage your money, you may also
    wish to review Quill Instant Access Savings — vs. a similar product here to see
    how this compares to our other offerings.'
  domain: retail_banking
  product_category: instant_access_savings
