- id: 7844f4dc-b66c-5e70-9d8f-b9afc94c22e4
  title: Quill Current Account — getting started walkthrough
  body: 'This guide is for support agents assisting new customers with the onboarding
    process for the Quill Current Account. Please follow these steps to ensure a compliant
    and frictionless setup.


    1. Initial Application: Direct the customer to the app to begin their application.
    Ensure they understand that the Quill Current Account is an app-only entry point
    with a monthly account fee of £0.


    2. Identity Verification: Confirm that the customer undergoes our mandatory identity
    verification. This involves uploading a valid government-issued ID and completing
    a biometric liveness check. We cannot proceed with account opening until this
    rigorous verification is successfully completed.


    3. Terms Acceptance: Ensure the customer has reviewed and accepted the account
    agreement. Highlight the key financial terms: the monthly account fee of £0 and
    the arranged overdraft rate of 29%.


    4. Account Activation: Once verified, the account is activated instantly. The
    customer can now fund their account via a transfer or by using the Current Account
    Switch Service to move their banking from another institution within seven working
    days.


    5. Feature Orientation: Briefly introduce the customer to the in-app card controls
    and security features, such as gambling blocks, which are central to our financial
    wellness positioning.


    If the customer expresses a need for additional value-added services, you may
    introduce them to the premium subscription tier as detailed in Quill Plus — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
