- id: 8a81a6ba-0dcd-56dd-bcf7-753f71470328
  title: Quill Instant Access Savings — who it is best for and common use cases
  body: 'Quill Instant Access Savings is designed for digitally native users who want
    their money to work harder without locking it away. By offering 3.75% AER, we
    provide a competitive return while maintaining total agility.


    Who is this best for?

    This product is ideal for customers who value transparency and frictionless management.
    It is specifically suited for those who prefer an app-first experience and want
    to separate their spending money from their savings effortlessly.


    Common Use Cases:


    - Emergency Funds: Because there are no lock-in periods, this is the perfect place
    to store your ''rainy day'' fund. You earn 3.75% AER, but can move the money back
    to your current account instantly if an emergency arises.

    - Short-Term Goals: Whether you are saving for a holiday or a tech upgrade, our
    intuitive savings pots allow you to track your progress towards a specific target.

    - High-Yield Parking: For those who have a surplus in their current account (which
    carries a monthly fee of £0), moving those funds into this savings product allows
    them to earn a meaningful return without sacrificing liquidity.


    Compared to our premium tier, Quill Plus, which carries a £7 monthly fee for enhanced
    value-added services, the savings product focuses purely on growth and accessibility.
    It complements our core offering by providing a low-friction path to financial
    wellness.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: cf326e6c-e16f-5092-a0cc-43231e757eb3
  title: Quill Instant Access Savings — cost and charges
  body: 'Q: Is there a monthly fee to maintain a Quill Instant Access Savings account?


    A: No. There are no monthly maintenance fees or opening charges for this account.
    We believe essential banking and saving should be accessible to all, so you can
    enjoy a 3.75% AER return without any cost to hold the account.


    Q: Do I need a paid subscription like Quill Plus to open a savings pot?


    A: No, you do not. While Quill Plus is available for a £7 monthly fee to provide
    premium enhancements, the Quill Instant Access Savings product is available to
    all our customers regardless of their subscription tier.


    Q: Are there any charges for transferring money out of my savings?


    A: No. Transfers from your savings pots to your Quill current account are free
    of charge and happen instantly, ensuring you have full agility over your funds.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b7c6bb51-c913-5874-ad52-85e4919ce400
  title: Quill Instant Access Savings — cancel, close, or downgrade
  body: "If you are comparing your options and decide that the Quill Instant Access\
    \ Savings product no longer meets your needs, closing your account is a straightforward\
    \ process handled entirely within your conversation with us.\n\nBefore you start:\n\
    Ensure you have an active Quill current account, as this is where your remaining\
    \ balance and accrued interest will be sent.\n\nSteps to close your account:\n\
    1. Tell us that you wish to close your Quill Instant Access Savings account. \n\
    2. We will then calculate your final balance, including any interest earned at\
    \ the 3.75% AER rate up to the current date.\n3. We will ask you to confirm that\
    \ you are happy for the total balance to be transferred to your linked current\
    \ account.\n4. Once you provide this confirmation, we will process the transfer\
    \ and close the savings account.\n\nHow you know it worked:\n- You will receive\
    \ an instant confirmation message in the chat stating that the account is closed.\n\
    - You will see the total balance from your savings appear as a credit in your\
    \ current account transaction history.\n\nIf you simply wish to stop adding money\
    \ to a specific savings pot but keep the account open, you can simply stop your\
    \ transfers. There is no 'downgrade' path for this product as there are no paid\
    \ tiers for the savings account itself."
  domain: retail_banking
  product_category: instant_access_savings
