- id: 5b982981-d16e-5cad-8f16-996133b5edcc
  title: Quill Debit Card — comparison vs. alternatives and when not to choose it
  body: 'The Quill Debit Card is built for the digitally native consumer who prioritises
    transparency and global mobility. When compared to traditional banking alternatives,
    our value proposition is centred on the removal of common ''hidden'' costs.


    Why choose the Quill Debit Card?

    - Global Spend: Most traditional banks charge a percentage on every transaction
    made in a foreign currency. We maintain a 0% foreign transaction fee, ensuring
    you get a fair rate without hidden markups.

    - International Cash Access: While many neobanks offer limited free withdrawals,
    we provide a clear £200 monthly allowance for fee-free ATM withdrawals abroad,
    giving you flexibility while travelling.

    - App-First Control: Unlike legacy cards, the Quill Debit Card is managed entirely
    via our app, featuring instant card freezing and real-time notifications.


    When is the Quill Debit Card NOT the best choice?

    While we strive for accessibility, the Quill Debit Card may not be the ideal tool
    for every scenario:

    - Heavy ATM Dependents Abroad: Because we apply a 3% fee to any ATM withdrawals
    abroad that exceed the £200 monthly allowance, users who frequently withdraw very
    large sums of cash in foreign countries may find this restrictive compared to
    specialised high-limit travel accounts.

    - Non-Digital Users: As an app-first product, users who prefer physical branch
    banking or paper-based management will find our frictionless, digital-only model
    unsuitable.

    - Those Seeking Credit: This is a debit tool for spending existing funds. Those
    requiring a revolving credit line or a credit-builder product should look towards
    traditional credit card offerings.


    For those who value a fair fee structure and a modern user experience, the Quill
    Debit Card provides a transparent and efficient way to manage money globally.'
  domain: cards
  product_category: debit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 939bb16e-3fb2-53c3-8cd3-f654473bbb02
  title: Quill Debit Card — eligibility and setup
  body: 'Who is eligible to receive a Quill Debit Card?

    Any customer with an active Quill current account is eligible for a Quill Debit
    Card. Since the current account is our core entry point with a £0 monthly fee,
    the card is available to all our standard users.


    How do I set up and activate my card?

    Once you have completed our mandatory identity verification process, we will issue
    your card. When it arrives, you can activate it instantly through the app. Simply
    navigate to the ''Cards'' section and follow the on-screen prompts to confirm
    receipt and set your security preferences.


    Can I have more than one debit card on my account?

    Currently, each account is issued one primary Quill Debit Card. If you lose your
    card or it becomes damaged, you can request a replacement through the app, which
    will automatically deactivate the previous card for your security.'
  domain: cards
  product_category: debit_card
  document_type: faq
  source_authority: official
