- id: 563a2a1c-87dc-5dfd-9b73-9fe1d591687a
  title: Quill Plus — privacy and data handling
  body: 'As a subscriber to Quill Plus, your data is handled with the highest standards
    of care and in strict accordance with the supervision of the FCA and PRA. We believe
    in transparency and the Consumer Duty, ensuring that our data practices lead to
    fair outcomes for all customers.


    Data Collection for Premium Services

    To provide the enhanced features associated with the £7 monthly fee, we may process
    additional data related to your usage patterns. This allows us to offer a more
    agile and personalised experience. We only collect data that is necessary for
    the delivery of the service and for the maintenance of account security.


    Security and Verification

    To prevent fraud and protect your assets, we employ rigorous identity verification
    for all state-changing actions. This includes the use of multi-factor authentication
    and in-app biometric checks. These measures are mandatory for all Quill Plus users
    to ensure the highest standard of account security.


    Regulatory Protection

    Your funds are held securely. Eligible deposits are protected by the FSCS up to
    £120,000 per person, per institution. This protection applies regardless of whether
    you are on a standard account or the Quill Plus tier.


    Data Access and Rights

    Under current data protection laws, you have the right to request a copy of the
    data we hold about you. We provide this information in a clear, concise, and non-obtrusive
    format. If you wish to exercise these rights or have questions about how your
    data is used to fund our value-added services, please contact us via our 24/7
    support channels.'
  domain: retail_banking
  product_category: quill_plus
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 105d4377-27ce-5279-ac0d-93f8c8364a5f
  title: Quill Plus — recognising scams targeting this product
  body: "As we continue to grow, we have seen an increase in sophisticated phishing\
    \ attempts that specifically target customers interested in our premium features.\
    \ Because Quill Plus offers enhanced value-added services, fraudsters may attempt\
    \ to mimic our brand to steal your credentials or funds by promising 'exclusive'\
    \ upgrades or 'discounted' subscription rates.\n\nCommon tactics to watch for\
    \ include emails or text messages claiming that you are eligible for a free trial\
    \ of Quill Plus, or messages stating that your subscription has been suspended\
    \ and requesting an immediate payment to avoid a service interruption. Please\
    \ be aware that we will never ask you to provide your full password, PIN, or biometric\
    \ data via a link in a message. Furthermore, we will never ask you to transfer\
    \ money to a different account to 'verify' your eligibility for Quill Plus.\n\n\
    Our subscription fee for Quill Plus is a transparent £7 per month. Any offer suggesting\
    \ a lower fee via an external payment link or a request to pay the £7 fee through\
    \ an unconventional method (such as gift cards or cryptocurrency) is a scam. \n\
    \nIf you receive a suspicious communication, do not click any links or download\
    \ any attachments. Instead, report the incident to us immediately through the\
    \ in-app chat. For more information on how we protect your account from unauthorised\
    \ activity, please refer to Quill Plus — fraud and unauthorised-activity protection.\
    \ Remember, your eligible deposits are protected by the FSCS up to £120,000 per\
    \ person, per institution, and our security team is available 24/7 to help you\
    \ secure your account if you suspect a breach."
  domain: retail_banking
  product_category: quill_plus
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: bd3eb50d-51c7-52cf-8524-590ef8855765
  title: Quill Plus — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary technical parameters
    regarding the Quill Plus subscription to ensure accurate customer guidance.


    **Subscription Fee and Billing**

    Quill Plus is a premium subscription tier with a monthly fee of £7. This fee is
    debited monthly from the customer''s linked current account. If the account has
    insufficient funds, the customer will be notified in-app, and the subscription
    may be suspended if the balance is not rectified within the grace period defined
    in our internal billing policy.


    **Minimum Term Commitment**

    Every Quill Plus subscription is subject to a minimum term of 3 months. This is
    a binding commitment upon activation. Customers cannot downgrade to the standard
    current account or cancel the Plus subscription without fulfilling this 3-month
    period unless there are exceptional circumstances approved by a specialist.


    **Edge Cases and Restrictions**

    1. **Early Cancellation Requests:** If a customer requests to cancel before the
    3-month minimum term has elapsed, they must be informed that the subscription
    remains active and the £7 monthly fee continues to apply until the end of the
    third month.

    2. **Account Freezes:** If a customer freezes their account for security reasons,
    the £7 monthly subscription fee will still be attempted. A frozen account does
    not pause the subscription term or the billing cycle.

    3. **Overdraft Interaction:** If a customer is in an arranged overdraft, the £7
    fee will still be debited, which may increase their overdraft balance and potentially
    impact the interest they accrue.


    For detailed contractual obligations, please refer to Quill Plus — account agreement.'
  domain: retail_banking
  product_category: quill_plus
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b163668c-7226-5a50-bfa5-39af55331119
  title: Quill Plus — eligibility and setup
  body: '**Who is eligible to upgrade to Quill Plus?**

    Any customer with an active Quill current account is eligible to upgrade to Quill
    Plus. There are no minimum balance requirements to qualify for the upgrade.


    **How do I set up my Quill Plus subscription?**

    You can activate Quill Plus directly through the app. Once you select the upgrade
    option and agree to the terms, the subscription becomes active immediately. We
    will then begin charging the monthly fee of £7 from your account.


    **Is there a commitment period when I sign up?**

    Yes, Quill Plus has a minimum term of 3 months. By upgrading, you agree to maintain
    the subscription and the £7 monthly fee for at least this duration.


    For a detailed walkthrough of the activation process, please see Quill Plus —
    set up and activate.'
  domain: retail_banking
  product_category: quill_plus
  document_type: faq
  source_authority: official
