- id: 90a87941-baed-5c03-adc2-11d17b67c0fb
  title: Quill Current Account — privacy and data handling
  body: 'Quill is committed to the highest standards of data privacy and regulatory
    compliance. We handle all personal and financial data in accordance with the strict
    supervision of the FCA and PRA, adhering to the Consumer Duty to ensure fair outcomes
    for all our customers.


    Data Usage and Privacy:

    We collect and process your data to provide our app-first banking services, conduct
    mandatory identity verification, and protect your account from fraud. We use multi-factor
    authentication and biometric checks to ensure that your account information is
    disclosed only to you or authorised representatives after rigorous verification.


    Your Protections:

    As a customer of the Quill Current Account, your eligible deposits are protected
    by the FSCS up to £120,000 per person, per institution. This ensures that your
    funds are secure up to this threshold should the institution fail.


    Transparency and Control:

    We avoid opaque banking jargon and present all regulatory disclaimers in a clear,
    concise format. You have the right to request a copy of the data we hold about
    you and to ask for corrections to any inaccurate information.


    Security Measures:

    To prevent unauthorised access, we employ advanced encryption and real-time monitoring.
    Our commitment to security extends to the reimbursement of eligible Authorised
    Push Payment (APP) scams up to £85,000, reflecting our posture of protecting customers
    from fraudulent activity.


    For more on our overall risk framework, see Quill Current Account — regulatory
    disclosures.'
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: c30b2aa9-8659-587f-92a2-ce0920bb12ac
  title: Quill Current Account — recognising scams targeting this product
  body: 'As you compare different banking providers, it is important to understand
    how we protect you and how to spot attempts by fraudsters to target your funds.
    Because the Quill Current Account is app-first and agile, scams often attempt
    to mimic our digital communications to create a sense of urgency.


    A common threat is the Authorised Push Payment (APP) Scam. This occurs when a
    fraudster tricks you into voluntarily transferring money to an account they control,
    often by pretending to be a trusted entity or a Quill employee. We are committed
    to protecting our customers in these scenarios and provide reimbursement for eligible
    APP scams up to £85,000.


    To recognise a scam, remember that we will never ask you for your full password,
    your multi-factor authentication (MFA) codes, or for you to move your money to
    a ''safe account''. Any request to do so is a definitive sign of fraud. Furthermore,
    we will never pressure you to bypass our security checks or ask you to share your
    biometric verification details over a call or email.


    If you notice any suspicious activity or believe you have been targeted, the first
    action you should take is to use the instant card control feature in your app
    to freeze your card. This prevents any further unauthorised transactions while
    we investigate. Following this, you should immediately report the incident to
    us via our 24/7 in-app chat or email.


    We operate under the strict supervision of the FCA and PRA, ensuring that our
    security posture is designed to provide fair outcomes. For a deeper look at our
    protection mechanisms, you may wish to review Quill Current Account — fraud and
    unauthorised-activity protection.'
  domain: retail_banking
  product_category: current_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 1d5356ff-6129-5959-8685-f0df94f3f8c3
  title: Quill Current Account — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary technical parameters
    and constraints governing the Quill Current Account to assist customers with query
    resolution.


    **Financial Limits and Fees**

    - Monthly Account Fee: The account carries a monthly fee of £0, making it our
    core entry point.

    - Daily Payment Limit: Outgoing transfers are capped at a daily limit of £10,000.
    This applies to all fast, secure transfers sent via the app.

    - ATM Allowance: The associated debit card includes a monthly fee-free ATM allowance
    of £200. Withdrawals exceeding this amount will incur fees as per the standard
    fee schedule.

    - Overdraft Costs: For customers with an arranged overdraft, the interest rate
    is 29%.


    **Operational Restrictions**

    - Identity Verification: No state-changing action, payment, or disclosure of account
    information can occur without rigorous identity verification, including MFA and
    in-app biometric checks.

    - Transactional Blocks: We provide proactive security features, such as gambling
    blocks, which can be toggled by the user to restrict specific spending categories.


    **Edge Cases and Handling**

    - Limit Breaches: If a customer attempts to send a payment exceeding the £10,000
    daily limit, the transaction will be declined. Agents should advise the customer
    that this is a security measure to protect their funds.

    - Overdraft Defaults: If a customer exceeds their arranged overdraft limit, the
    account may be restricted. Agents must verify the customer''s identity before
    discussing specific limit increases.

    - FSCS Protection: Ensure customers are aware that eligible deposits are protected
    by the FSCS up to £120,000 per person, per institution.


    For further details on how these limits relate to the overall account structure,
    refer to Quill Current Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 02d87f6d-ddda-593c-b048-f7bad966683b
  title: Quill Current Account — eligibility and setup
  body: '### Who is eligible to open a Quill Current Account?

    We welcome digitally native consumers who are looking for a transparent and frictionless
    banking experience. To be eligible, you must meet our standard identity and residency
    requirements, which are verified during the onboarding process. Please refer to
    Quill Current Account — eligibility requirements for the full criteria.


    ### How do I set up my account?

    Setting up your account is entirely app-based. After downloading the Quill app,
    you will be asked to provide your personal details and complete a rigorous identity
    verification process. This includes a multi-factor authentication (MFA) check
    and in-app biometric verification to ensure your account is secure from the start.


    ### Is there a cost to open the account?

    No. Our core current account is designed to be accessible to all, which is why
    it carries a monthly fee of £0. There are no hidden charges for the basic setup
    and activation of your account.'
