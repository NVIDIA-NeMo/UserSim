- id: 289990d2-8c30-5f9a-b6be-8131dd1c8219
  title: Quill Payments — cost and charges
  body: '**How much does it cost to send a Faster Payment?**

    We believe essential banking should be free. Therefore, the fee for a Faster Payment
    is £0. There are no hidden charges for using our core payment service.


    **Are there any limits on how much I can send for free?**

    Yes, while the fee remains £0, there is a daily limit for Faster Payments of £10,000.
    This ensures a high level of security for your account.


    **Do I need a premium account to access these payment features?**

    No. These payment terms are available to all our users. Whether you use our core
    account with a monthly fee of £0 or have upgraded to Quill Plus for a £7 monthly
    fee, the payment fees and limits remain the same. For more details, see Quill
    Payments — overview.'
