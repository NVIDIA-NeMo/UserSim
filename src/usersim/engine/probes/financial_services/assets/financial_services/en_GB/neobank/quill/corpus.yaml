- id: b83788bc-9edd-5aed-8e42-8845cb9397ef
  title: Quill Current Account — account security best practices
  body: "At Quill, we prioritise the safety of your funds and the security of your\
    \ personal data. To ensure your Quill Current Account remains protected, we ask\
    \ that you adhere to the following best practices.\n\nFirst, always utilise our\
    \ multi-factor authentication and in-app biometric checks. These rigorous identity\
    \ verification steps are mandatory before any state-changing action or payment\
    \ is processed, ensuring that only you have access to your money.\n\nBe aware\
    \ of common fraud patterns. We will never ask you for your full PIN, your password,\
    \ or a one-time passcode (OTP) over the phone or via email. If you receive a request\
    \ for this information, it is a scam. If you suspect your account has been compromised,\
    \ use the instant card control feature in the app to freeze your debit card immediately.\n\
    \nWe are committed to protecting our customers from fraud. In the event of an\
    \ Authorised Push Payment (APP) scam—where you are tricked into voluntarily transferring\
    \ money to a fraudster—we provide reimbursement for eligible scams up to £85,000.\
    \ \n\nFurthermore, your peace of mind is supported by the fact that eligible deposits\
    \ are protected by the FSCS up to £120,000 per person, per institution. For more\
    \ details on how we protect you, see Quill Current Account — fraud and unauthorised-activity\
