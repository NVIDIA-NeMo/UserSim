- id: c0e852e4-6dce-52c0-b560-d14bbaeafbc8
  title: Quill Instant Access Savings — vs. a similar product here
  body: 'When deciding where to hold your funds, it is important to understand the
    trade-off between immediate spending utility and long-term growth. Here is how
    Quill Instant Access Savings compares to our core spending product, the Quill
    Current Account.


    Quill Instant Access Savings is designed for growth and goal-setting. It offers
    a significant annual interest rate of 3.75% AER, making it the ideal choice for
    any money you do not need for daily expenses. While you can access these funds
    instantly, they are mentally and digitally separated into pots to encourage financial
    wellness.


    In contrast, the Quill Current Account is designed for agility and daily transactions.
    While it carries a monthly fee of £0, it does not provide the 3.75% AER yield
    found in our savings product. It is the better choice for active spending, bill
    payments, and using your debit card.


    In short: use the Current Account for your spending money and the Instant Access
    Savings product for any capital you wish to grow while maintaining the flexibility
    to withdraw it at a moment''s notice.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 11e22837-a3e2-5c7d-b05b-50257047a558
  title: Quill Instant Access Savings — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the Quill
    Instant Access Savings product. Quill operates under the strict supervision of
    the Financial Conduct Authority (FCA) and the Prudential Regulation Authority
    (PRA). We are committed to the Consumer Duty, ensuring that all our products provide
    fair outcomes for our customers.


    Deposit Protection:

    Eligible deposits held within Quill Instant Access Savings are protected by the
    Financial Services Compensation Scheme (FSCS). This protection applies up to a
    maximum of £120,000 per person, per institution. In the unlikely event of institutional
    failure, the FSCS acts to ensure that eligible customers are reimbursed up to
    this limit.


    Interest Rate Nature:

    The annual interest rate of 3.75% AER is variable. This means the rate can fluctuate
    based on the base rate set by the Bank of England or other market drivers. We
    reserve the right to change the rate upon providing notice to the customer through
    our standard communication channels.


    Tax Obligations:

    Quill provides general financial education and product information. However, we
    do not offer individualised tax, legal, or professional investment advice. Customers
    are responsible for understanding the tax implications of the interest earned
    on their savings pots and for reporting such earnings to the relevant tax authorities.


    Security and Access:

    To protect your funds, all state-changing actions, including the movement of money
    between savings pots and spending accounts, require rigorous identity verification.
    We employ multi-factor authentication and in-app biometric checks as a mandatory
    security standard. These measures are in place to prevent unauthorised access
    and to protect our users from fraud.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 28ee1590-57be-5679-a863-54b8d320c0db
  title: Quill Instant Access Savings — interest rate / AER schedule
  body: 'The following rate applies to all Quill Instant Access Savings pots, regardless
    of the balance held or the number of pots created.


    - Current Annual Interest Rate: 3.75% AER


    Rate Details:

    - Application: This flat rate applies to all balances from £0.01 upwards.

    - Frequency: Interest is calculated daily based on the closing balance of the
    pot.

    - Credit: Interest is typically credited to the pot on a monthly basis.

    - Type: This is a variable rate. While it is currently 3.75%, it may increase
    or decrease in response to changes in the wider financial market or regulatory
    requirements. We will notify you in the app should the rate change.'
