- id: fb779bce-298a-5296-8c1b-9cf916cccb71
  title: Quill Plus — check status or history
  body: "If you want to review your current subscription status or see a history of\
    \ your monthly payments for Quill Plus, please follow these steps:\n\n**What you\
    \ need before starting**\nEnsure you are logged into your Quill app and have access\
    \ to your main account dashboard.\n\n**Steps to check your subscription status**\n\
    1. Tell us that you would like to check your subscription status. We will confirm\
    \ whether your account is currently on the standard tier or the Quill Plus tier.\n\
    2. If you are on Quill Plus, we will provide your current subscription start date\
    \ and the date of your next scheduled £7 monthly fee payment.\n3. We will also\
    \ confirm if you are still within your 3-month minimum term or if you are now\
    \ eligible to cancel or downgrade at any time.\n\n**Steps to review your payment\
    \ history**\n1. Ask us for a history of your Quill Plus subscription charges.\
    \ \n2. We will provide a list of the dates on which the £7 monthly fee was debited\
    \ from your account.\n3. If any payment failed or was delayed, we will highlight\
    \ these specific dates and the current status of the payment.\n\n**How you know\
    \ it worked**\nYou will have a clear confirmation of your current plan, the date\
    \ of your next £7 charge, and a verified list of all previous subscription debits\
    \ applied to your account.\n\nFor more details on the costs associated with your\
    \ account, please see Quill Plus — monthly fee explained."
  domain: retail_banking
  product_category: quill_plus
  document_type: how_to_guide
