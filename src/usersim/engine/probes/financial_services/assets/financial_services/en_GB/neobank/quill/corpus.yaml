- id: b8f101ac-2c86-5679-a96c-94f04b7dbcf7
  title: Quill Current Account — how-to / step-by-step
  body: '### How do I freeze my card if I lose it?

    Simply open the Quill app, navigate to the ''Cards'' tab, and toggle the ''Freeze
    Card'' switch to the ''On'' position. Your card will be instantly deactivated
    to prevent unauthorised spend. You can unfreeze it just as easily if the card
    is found.


    ### How do I send money to another person?

    Go to the ''Payments'' section in the app, select ''Send Money'', and enter the
    recipient''s details. We use Confirmation of Payee to verify the name matches
    the account. Remember that you have a daily limit of £10,000 for these transfers.


    ### How can I stop a recurring payment?

    If you wish to cancel a subscription or a standing order, navigate to the ''Payments''
    tab, select the recurring transaction from your history, and choose ''Cancel Payment''.
    We will process the request immediately to ensure no further funds are withdrawn.'
