- id: 4b570a25-3f75-53bf-9763-0e0d9b978305
  title: Quill Plus — cancel, close, or downgrade
  body: 'Depending on your goals, you may wish to move from Quill Plus back to our
    standard offering or close your relationship with us entirely. Please review the
    steps below to understand how these transitions work.


    Downgrading to a Standard Account

    If you wish to stop paying the monthly fee of £7 and return to the basic current
    account (£0 monthly fee), follow these steps:


    1. Tell us that you wish to downgrade your subscription to the standard current
    account.

    2. We will verify your identity using an in-app biometric check.

    3. We will confirm your current billing cycle date and check if you have met the
    minimum term of 3 months.

    4. If you have met the minimum term, we will schedule the downgrade for the end
    of your current billing period. If you have not yet reached 3 months, we will
    notify you of the remaining fees due before the downgrade takes effect.

    5. You will receive a confirmation message in-app once the downgrade is scheduled.


    Closing Your Account

    If you wish to close your Quill account entirely:


    1. Tell us that you wish to close your account.

    2. Ensure your account balance is £0 and any outstanding Quill Plus fees are settled.

    3. We will perform a final identity verification.

    4. We will confirm the closure of the account and provide a final statement for
    your records.


    You will know the process is complete when you receive a formal closure notice
    via email and can no longer access the account via the app.


    For a comparison of the costs between our tiers, please refer to Quill Plus —
    vs. a similar product here.'
  domain: retail_banking
  product_category: quill_plus
  document_type: how_to_guide
  source_authority: official
