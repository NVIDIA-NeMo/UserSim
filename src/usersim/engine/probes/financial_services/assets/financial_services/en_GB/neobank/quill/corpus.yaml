- id: 2378f2a9-d390-539f-8175-7c0fe4d95700
  title: Quill Current Account — fee schedule
  body: 'This fee schedule is for internal use by support agents to assist customers
    with billing enquiries. All figures are exact.


    - Monthly Account Maintenance Fee: £0

    - Standard Payment Transfer Fee: £0

    - Foreign Transaction Fee (via Debit Card): 0%

    - ATM Withdrawal Allowance (Monthly): £200 (Fee-free)


    Please note that these fees apply specifically to the standard Quill Current Account.
    If the customer has upgraded to a premium tier, they will be charged a monthly
    fee of £7 for Quill Plus. For details on the costs associated with borrowing,
    please refer to the Quill Current Account — rate sheet.'
