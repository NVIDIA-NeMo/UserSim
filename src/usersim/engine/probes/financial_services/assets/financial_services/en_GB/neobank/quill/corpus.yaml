- id: 10b3d604-28f3-5421-b57d-63c9cb1f6ecb
  title: Quill Current Account — cost and charges
  body: 'How much does it cost to maintain a Quill Current Account?

    Our core account is designed to be accessible to everyone. The monthly account
    fee for the Quill Current Account is £0.


    Is there a cost for using an arranged overdraft?

    Yes. If you have an arranged overdraft, the interest rate applied is 29%. This
    is the cost for the flexibility of spending more than your current balance.


    Are there any other hidden monthly charges?

    No. We value transparency and plain English. We do not charge hidden maintenance
    fees for our standard account. If you are looking for more advanced features,
    you might consider our premium tier; please see Quill Current Account — choosing
    between tiers or options for a comparison.'
