    | Residency | Must be a resident of a supported region | Mandatory |

    | Minimum Deposit | £0.01 | Eligible to start earning interest |

    | Interest Rate | Standard Tier | 3.75% AER applied to all balances |


    All qualified users earn the same 3.75% AER, regardless of whether they use the
