- id: 430ac5fa-3461-5b5b-9227-cb431eac9fce
  title: Quill Plus — cost and charges
  body: 'How much does Quill Plus cost per month?

    Quill Plus carries a monthly fee of £7. This fee funds additional value-added
    services and premium enhancements beyond our standard account.


    Is there a minimum period I must stay subscribed?

    Yes, there is a minimum term of 3 months for all Quill Plus subscriptions. This
    ensures you can fully experience the benefits of the premium tier.


    How does this compare to the standard account?

    Our core current account has a monthly fee of £0. Quill Plus is an optional upgrade
    for those who value additional features and are comfortable with the £7 monthly
    cost. You can see a detailed breakdown in Quill Plus — choosing between tiers
    or options.'
