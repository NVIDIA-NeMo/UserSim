- id: e82d74ef-63ca-54cf-91c1-ff3c076c02da
  title: Quill Plus — access or login problems
  body: 'At Quill, we pride ourselves on a frictionless user experience. However,
    if you experience difficulties accessing your Quill Plus features, the following
    guide outlines the likely causes and the path to resolution.


    Symptom: ''Unable to access premium features'' or ''Subscription not recognised''.


    Likely Causes:

    1. Outdated App Version: Premium features often require the latest security protocols
    and app updates.

    2. MFA/Biometric Failure: Because Quill Plus involves a paid subscription of £7,
    we require rigorous identity verification for access.

    3. Account Status: The account may be in a restricted state due to a failed monthly
    fee payment.


    What to Check:

    1. App Store/Play Store: Ensure you are running the most recent version of the
    Quill app.

    2. Connectivity: Verify you have a stable internet connection, as biometric checks
    require a secure handshake with our servers.

    3. Balance: Ensure your account has sufficient funds to cover the £7 monthly fee.


    How to Fix:

    - Update the app and restart your device.

    - Clear your app cache and attempt the biometric login again.

    - If the issue is a failed payment, top up your account and request a payment
    retry via chat.


    When to Escalate:

    If you have completed the checks above and still cannot access your account, tell
    us in the chat. We will escalate the matter to a tiered specialist path. You will
    receive a case reference number and we will provide a resolution or a detailed
    status update within 15 business days, in accordance with our commitment to rapid
    dispute and query resolution.'
  domain: retail_banking
  product_category: quill_plus
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
