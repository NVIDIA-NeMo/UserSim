- id: 4efebe1d-19f0-5875-b076-48c79648c21e
  title: Quill Current Account — check status or history
  body: 'Maintaining a clear view of your financial wellness is simple with our app-first
    design. Follow these steps to check your current balance and review your transaction
    history.


    **Prerequisites**

    - Your Quill app must be installed and updated to the latest version.

    - You must have completed the biometric or MFA login process.


    **Step-by-Step Instructions**

    1. Open the Quill app on your mobile device.

    2. From the main dashboard, tap on the ''Quill Current Account'' tile. This action
    will open your account overview page.

    3. View your current available balance, which is displayed prominently at the
    top of the screen.

    4. Scroll down to the ''Recent Activity'' section. This provides a chronological
    list of all your spending, deposits, and transfers.

    5. To see more detail for a specific transaction, tap on the individual entry.
    This will display the merchant name, the exact amount, the date, and the transaction
    status (e.g., ''Pending'' or ''Completed'').

    6. To view older records, scroll to the bottom of the list and select ''View Statement''
    to generate a digital record of your history.


    **How you know it worked**

    You have successfully checked your status when you can see your real-time balance
    and a detailed list of transactions that match your recent spending activity.


    If you notice any transaction that does not look correct while reviewing your
    history, please refer to Quill Current Account — a discrepancy in your records
    or statement for guidance on how to resolve it.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b8367370-e5ec-5fdd-ab21-ffdb5f731135
  title: Quill Current Account — a declined or blocked action
  body: 'It can be frustrating when a payment is declined or an action is blocked.
    Because we prioritise security and the protection of your funds, our systems may
    occasionally stop a transaction if it appears unusual or exceeds set parameters.


    **Common Symptoms**

    - A payment is declined at the point of sale or during an online checkout.

    - An attempted transfer shows a ''Transaction Blocked'' or ''Limit Exceeded''
    message in the app.

    - An account feature is temporarily unavailable following a security alert.


    **Likely Causes and What to Check**

    1. **Insufficient Funds:** Check your balance on the main dashboard. If your balance
    is below the transaction amount and you do not have an arranged overdraft, the
    payment will fail.

    2. **Daily Transfer Limits:** If you are making a transfer, check if you have
    already reached your daily limit of £10,000. If this limit has been hit, you will
    be unable to send further payments until the next calendar day.

    3. **ATM Allowance:** If a cash withdrawal is declined, check if you have exceeded
    your monthly fee-free ATM allowance of £200.

    4. **Security Blocks:** We employ proactive security features. If a transaction
    is flagged as high-risk (e.g., an unusual international payment), we may block
    it to protect you from fraud.


    **The Fix**

    - For limit-related declines, wait until the limit resets or top up your account.

    - For security blocks, check your in-app notifications. We will often ask you
    to confirm the transaction using a biometric check to unblock the payment.


    **When to Escalate**

    If you believe a legitimate payment has been blocked in error and you cannot resolve
    it via the app, please tell us through our 24/7 chat. We will then route your
    query to a tiered specialist who can review the security flag. Once verified,
    we can manually override the block or provide a specific reason for the decline.
    You can expect a response regarding the status of the block within our standard
    regulatory timelines.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 766effca-8650-5b27-a2f4-8056e3ece3cc
  title: Quill Current Account — when to switch or upgrade
  body: 'As a support agent, you should help customers determine if the standard Quill
    Current Account still meets their needs or if an upgrade is appropriate.


    **Quill Current Account (£0 monthly fee)**

    This is best for users who require essential spending and management without any
    fixed monthly costs. It is ideal for those who value a frictionless, app-only
    experience and do not require advanced premium features.


    **Quill Plus (£7 monthly fee)**

    Suggest an upgrade to Quill Plus when a customer expresses a need for value-added
    services that go beyond basic banking. While the standard account is free, the
    £7 monthly fee for Quill Plus funds enhanced features designed for those who want
    a more comprehensive financial wellness toolkit.


    **Key Decision Points**

    - **Cost Sensitivity:** If the customer prioritises a £0 cost structure, keep
    them on the standard account.

    - **Feature Requirement:** If the customer asks for premium enhancements not available
    in the core product, guide them towards Quill Plus.


    For a more detailed breakdown of the premium benefits, refer to Quill Plus — overview.'
