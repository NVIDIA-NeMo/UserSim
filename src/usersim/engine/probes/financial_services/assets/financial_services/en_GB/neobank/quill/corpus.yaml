  mentions_tools: []
  institution_id: quill
- id: 79a60d15-128b-5c77-9fab-fd37a37a0ba5
  title: Quill Plus — an unexpected charge or amount
  body: 'Symptom: A customer reports a charge on their statement that they do not
    recognise or an amount that differs from their expectations regarding their Quill
    Plus subscription.


    Likely Causes:

    - The standard monthly fee of £7 has been applied at the start of the billing
    cycle.

    - The customer is within their minimum term of 3 months and was charged after
    requesting a downgrade.

    - A previous month''s fee was missed and has been collected as a combined charge.


    What to Check (In Order):

    1. Review the transaction date: Does it coincide with the monthly anniversary
    of the subscription activation?

    2. Check the subscription start date: Has the customer completed the minimum term
    of 3 months?

    3. Check account history: Were there any failed payment attempts for the £7 fee
    in previous months?


    Resolution:

    - If the charge is the correct £7 monthly fee, explain the billing cycle and the
    minimum term requirements to the customer.

    - If the charge is a result of a downgrade request made before the 3-month minimum
    term ended, clarify that the fee remains applicable until the term is complete.

    - If a genuine billing error has occurred, we will raise a case with the billing
    specialist team.


    Escalation:

    If the customer disputes the validity of the charge and it cannot be resolved
    via the steps above, we will route the query to a tiered specialist path. The
    customer should be informed that we will investigate and provide a final response
    within 15 business days, as per our payment services dispute policy.'
  domain: retail_banking
  product_category: quill_plus
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
