- id: 4e310e59-c186-5f5e-bee9-4b6bf5f0fc3f
  title: Quill Payments — regulatory disclosures
  body: 'Quill operates under the strict supervision of the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). Our payment services are
    designed and managed in adherence to the Consumer Duty, ensuring that we provide
    fair outcomes for all customers through transparency and accessibility.


    Eligible deposits held within the accounts used for Quill Payments are protected
    by the Financial Services Compensation Scheme (FSCS) up to £120,000 per person,
    per institution.


    To mitigate risk and protect our customers from financial loss, we enforce a strict
    daily transfer limit of £10,000. This is a regulatory and security safeguard.
    Any attempt to circumvent these limits through structured payments may be flagged
    by our security systems for review.


    We are committed to protecting our customers from fraud. In the event of an Authorised
    Push Payment (APP) Scam, we commit to the reimbursement of such scams up to £85,000,
    subject to our terms and conditions and the outcome of a fraud investigation.
    We prioritise the rapid resolution of all payment disputes, aiming to provide
    a final response within 15 business days.


    All users must undergo rigorous identity verification before initiating payments.
    We employ multi-factor authentication and in-app biometric checks to ensure that
    all state-changing actions are authorised by the account holder.


    For further regulatory context, please refer to Regulatory notes for Payments.'
  domain: payments
  product_category: payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 7fda8ceb-bfa9-5aa5-8ba6-c8a525fee979
  title: Quill Payments — interest rate / AER schedule
  body: 'Quill Payments is a transactional service designed for the agile movement
    of funds. As such, it is not an interest-bearing product.


    **Interest Rates**

    - The interest rate applied to funds while in transit via Quill Payments is 0%.

    - No Annual Equivalent Rate (AER) is applicable to the payment service itself.


    **Applicability**

    This 0% rate applies to all users regardless of the transfer amount or the frequency
    of payments. Because we charge a fee of £0 for these services, there are no costs
    to offset and no tiered interest structures applied to transactional outflows.


    If you are looking for a way to earn interest on your money, we recommend our
    intuitive savings pots, which can be found in the documentation for our savings
    products.'
  domain: payments
  product_category: payments
  document_type: rate_sheet
  source_authority: official
