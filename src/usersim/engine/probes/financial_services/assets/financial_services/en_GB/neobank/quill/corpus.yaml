- id: 7d1ec6ab-4146-56c1-a0ea-437d3d592b00
  title: Quill Plus — account agreement
  body: 'This account agreement outlines the binding terms governing the use of the
    Quill Plus premium subscription. By activating this service, you agree to the
    following obligations and terms.


    1. Subscription Fees and Payment

    The user agrees to pay a monthly fee of £7 for the Quill Plus subscription. This
    fee is charged in advance on the first day of each billing cycle. We reserve the
    right to suspend access to premium features if the monthly fee remains unpaid
    for more than seven calendar days.


    2. Minimum Term\Quill Plus is subject to a minimum term of 3 months. This period
    begins on the date of activation. If a user wishes to downgrade to a standard
    current account before the end of this 3-month period, they remain liable for
    the monthly fee of £7 for the remainder of the term.


    3. Service Obligations\Quill agrees to provide the value-added services associated
    with the premium tier as described in our product documentation. We will maintain
    the account in accordance with FCA and PRA regulations. The user is obligated
    to provide accurate identity verification and maintain the security of their biometric
    and MFA credentials.


    4. Changes to Terms\We may amend the fees or features of Quill Plus. We will provide
    users with clear and concise notice of any such changes. Continued use of the
    subscription following the notice period constitutes acceptance of the updated
    terms.


    5. Termination and Downgrade\A user may request to downgrade their account to
    a standard current account at any time. Such requests are processed at the end
    of the current billing cycle, subject to the minimum term of 3 months. Closing
    the account entirely requires the settlement of any outstanding fees.


    6. Liability and Protection\Eligible deposits are protected by the FSCS up to
    £120,000. In the event of an Authorised Push Payment (APP) scam, reimbursement
    is available up to £85,000, subject to our fraud investigation and the terms of
    the Consumer Duty.'
