- id: 53ec073c-95d1-5c66-97c7-19537b22dea9
  title: Quill Debit Card — recognising scams targeting this product
  body: 'At Quill, we are committed to protecting your money. Because the Quill Debit
    Card is designed for global use and high agility, it can sometimes be a target
    for sophisticated fraudsters. Recognising the signs of a scam is your first line
    of defence.


    Common scam patterns targeting our cardholders include:


    1. The ''Security Breach'' Call: You may receive a call from someone claiming
    to be from Quill''s fraud department. They might tell you that your Quill Debit
    Card has been compromised and ask you to move your funds to a ''safe account''.
    We will never ask you to transfer money to a different account to keep it safe.


    2. Phishing for Card Details: Be wary of emails or texts containing links to ''verify''
    your card details. We will never ask you to provide your full 16-digit card number,
    expiry date, and CVV via a link in a message or through an unsecured chat.


    3. The ''Overpayment'' Scam: A fraudster may claim to have sent you too much money
    and ask you to send a portion back using your card or a transfer. This is often
    a precursor to an Authorised Push Payment (APP) Scam.


    If you believe you have been the victim of a scam, your first action must be to
    freeze your card immediately via the app to prevent further unauthorised transactions.
    Once the card is secure, let us know right away. In line with our commitment to
    fraud protection, we provide reimbursement for eligible authorised push payment
    scams up to £85,000.


    Remember, we will never ask for your PIN or your full security credentials over
    the phone. If a request feels urgent or unusual, it is likely a scam. For more
    on our general security approach, you can refer to Quill Debit Card — fraud and
    unauthorised-activity protection.'
  domain: cards
  product_category: debit_card
  document_type: security_advisory
  source_authority: official
