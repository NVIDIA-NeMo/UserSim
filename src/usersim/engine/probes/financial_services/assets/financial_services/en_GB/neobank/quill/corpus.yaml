- id: d41d772f-5c86-58e9-9a4d-438027f4b611
  title: Quill Debit Card — account security best practices
  body: 'At Quill, your security is our primary concern. To keep your funds safe and
    your Quill Debit Card secure, we recommend following these essential best practices.


    First, make full use of our instant card control features within the app. If you
    misplace your card or notice any suspicious activity, you should freeze your card
    immediately to prevent unauthorised transactions. We also encourage you to set
    up real-time notifications for all spending, allowing you to spot irregularities
    the moment they happen.


    Be mindful of your biometric security. We employ multi-factor authentication and
    in-app biometric checks to ensure that only you can authorise state-changing actions
    or access sensitive account information. Never share your biometric data or authentication
    codes with anyone, even if they claim to be from Quill.


    We want to be clear about our communication: we will never ask you for your full
    PIN, your password, or request that you move your money to a ''safe account''
    via a phone call or email. Such requests are always a sign of a scam. If you receive
    a suspicious request, do not engage and report it to us immediately.


    In the event of fraud or a disputed payment, we are committed to a rapid resolution.
    We aim to provide final responses for payment services disputes within 15 business
    days. If you have fallen victim to an authorised push payment scam, we provide
    reimbursement up to £85,000 for eligible cases, reflecting our commitment to protecting
    our customers from financial crime.


    For more detailed information on how we protect you, please refer to Quill Debit
    Card — fraud and unauthorised-activity protection.'
  domain: cards
  product_category: debit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 429560e5-ffe8-50f3-bfdd-c90aac77553e
  title: Quill Debit Card — change-of-terms policy
  body: "This policy outlines how we manage changes to the terms and conditions governing\
    \ the Quill Debit Card. As a modern neobank, we strive for agility, but we maintain\
    \ a strict commitment to transparency and the Consumer Duty to ensure fair outcomes\
    \ for all our customers.\n\nWe reserve the right to amend the features and fees\
    \ associated with the Quill Debit Card. This may include adjustments to the 0%\
    \ foreign transaction fee, the £200 monthly fee-free ATM allowance for withdrawals\
    \ abroad, or the 3% fee applied to withdrawals exceeding that allowance. \n\n\
    Whenever we make a material change to these terms, we will provide you with clear\
    \ and concise notice through the app or via your registered email address. We\
    \ will ensure that these notifications are non-obtrusive but prominent, giving\
    \ you sufficient time to review the changes before they take effect. \n\nIf you\
    \ do not agree to the updated terms, you have the right to close your account\
    \ or downgrade your services. We operate under the strict supervision of the FCA\
    \ and PRA, meaning our change-of-terms process is designed to be fair and non-misleading.\
    \ \n\nOur fee philosophy is centred on accessibility. While the core features\
    \ of the Quill Debit Card are designed to be frictionless, any changes to the\
    \ cost of services will be communicated with a full explanation of why the change\
    \ is occurring and how it impacts you. Your deposits remain protected by the FSCS\
    \ up to £120,000 per person, per institution, regardless of changes to the card's\
    \ operational terms. For a full understanding of our base agreement, see Quill\
    \ Debit Card — account agreement."
  domain: cards
  product_category: debit_card
  document_type: terms_conditions
  source_authority: official
