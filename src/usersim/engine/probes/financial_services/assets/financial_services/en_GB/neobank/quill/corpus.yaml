- id: c084e69a-8d68-5d62-b39e-3fcfb72f1a12
  title: Quill Debit Card — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the replacement of a lost or
    stolen Quill Debit Card. We have streamlined this process to ensure your funds
    remain secure while you wait for a new card.


    What you will need:

    - Your registered mobile device.

    - A secure, updated delivery address.


    Steps to replace your card:

    1. Freeze the lost card: In the app, go to the ''Cards'' section and toggle your
    card to ''Off''. This immediately stops any new transactions and protects your
    balance.

    2. Request a replacement: Select the ''Replace Card'' option within the card settings.
    You will be asked to specify if the card was lost, stolen, or damaged.

    3. Verify your identity: For your security, you must complete a quick biometric
    check (such as a face scan or fingerprint) to confirm you are the account holder
    requesting the new plastic.

    4. Confirm delivery details: Review your registered home address. If you need
    the card sent elsewhere, provide the updated address at this stage.

    5. Confirmation: We will confirm the order of your new card and provide an estimated
    delivery window. Your old card will be permanently cancelled at this point.

    6. Activation: Once the new card arrives, open the app, go to ''Cards'', and tap
    ''Activate New Card''.


    How you know it worked:

    Your old card will show as ''Cancelled'' in the app, and your new card will show
    as ''Active'' once the final activation step is completed. You can then resume
    spending immediately.'
  domain: cards
  product_category: debit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 5efeb0e6-757d-5198-8032-563d8bce22bb
  title: Quill Debit Card — a discrepancy in your records or statement
  body: 'Support agents should use this guide when a customer reports a discrepancy
    between their own records and the transaction history associated with their Quill
    Debit Card.


    Common Symptoms:

    - The customer claims they were charged twice for a single purchase.

    - The amount deducted from the account does not match the merchant''s receipt.

    - A transaction appears on the statement that the customer does not recognise.


    Investigation Steps:

    1. Distinguish between Pending and Settled: Explain to the customer that some
    merchants place a ''temporary hold'' (pending) on funds. These amounts may fluctuate
    before the final settlement. Check the transaction status in the system.

    2. Verify Currency Conversion: If the transaction was abroad, confirm that the
    customer is looking at the settled sterling amount. Remind them that while we
    charge a 0% foreign transaction fee, the final amount depends on the exchange
    rate at the time of settlement.

    3. Review ATM Withdrawals: If the discrepancy relates to a cash withdrawal abroad,
    check if the customer has exceeded their £200 monthly allowance. If they have,
    a 3% fee would have been applied to the excess, which may account for the difference.


    Resolution and Escalation:

    If the discrepancy cannot be explained by pending status or the 3% excess ATM
    fee, the customer should file a formal dispute.

    - Action: Guide the customer to provide the transaction ID and evidence (e.g.,
    a digital receipt).

    - Escalation: Raise a formal payment dispute case. We are committed to the rapid
    resolution of such queries and will provide a final response for payment services
    within 15 business days.

    - Outcome: If the dispute is upheld, a credit for the discrepant amount will be
    applied to the customer''s account.'
  domain: cards
  product_category: debit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 76fd20b5-a5c8-596f-900c-0014e55005f6
  title: Quill Payments — overview
  body: "Quill Payments is our integrated, app-first transfer service designed to\
    \ make moving your money as frictionless as possible. We believe that sending\
    \ money should be simple and transparent, which is why we have removed the cost\
    \ barriers associated with traditional banking transfers.\n\nOur payment suite\
    \ is built for the digitally native user, providing an agile way to manage your\
    \ funds without leaving the app. Whether you are splitting a dinner bill or sending\
    \ money to a family member, we ensure the process is secure and immediate. Every\
    \ transfer utilises Confirmation of Payee, a security service that verifies the\
    \ recipient's name matches the account details before any money is sent, significantly\
    \ reducing the risk of errors or fraud.\n\nWe are committed to a fair fee structure.\
    \ Consequently, we charge a fee of £0 for Faster Payments. There are no hidden\
    \ costs or monthly charges to use our transfer tools; it is a core part of our\
    \ commitment to financial wellness and accessibility.\n\nTo balance agility with\
    \ security, we implement a daily limit of £10,000 on transfers. This threshold\
    \ helps protect your account from large, unauthorised outflows while providing\
    \ ample headroom for the vast majority of our customers' daily needs. \n\nAll\
    \ payments are conducted within the secure ecosystem of your account. To ensure\
    \ the highest standard of security, every payment requires rigorous identity verification,\
    \ including in-app biometric checks, before the funds are released. This ensures\
    \ that you, and only you, have control over your money.\n\nQuill Payments is designed\
    \ to work seamlessly with your overall financial setup. For more information on\
    \ the account that powers these transfers, you can refer to Quill Current Account\
    \ — overview."
  domain: payments
  product_category: payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 331dffe7-a55f-5570-8160-4d36f0439b08
  title: Quill Payments — fee for a Faster Payment explained
  body: 'Q: How much does Quill charge for making a Faster Payment?


    A: We believe essential banking should be accessible to everyone. Because of this
    philosophy, the fee for a Faster Payment is £0. We do not charge you for sending
    or receiving money via the Faster Payments network.


    Q: Are there any hidden costs for high-volume transfers?


    A: No. Regardless of how many transfers you make within your daily limit, the
    cost remains £0 per transaction. We avoid opaque fee structures to ensure you
    have full transparency over your spending.


    Q: Where can I see a full list of costs associated with my payments?


    A: All costs are listed clearly in our Quill Payments — fee schedule, where you
    can confirm that our standard transfer fees remain at £0.'
  domain: payments
  product_category: payments
  document_type: faq
  source_authority: official
