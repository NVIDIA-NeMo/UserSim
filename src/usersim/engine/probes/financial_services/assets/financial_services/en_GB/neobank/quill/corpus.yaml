- id: 809903a5-7780-5553-b0c0-00881a4c067c
  title: Quill Plus — regulatory disclosures
  body: 'Quill Plus is provided as a premium service tier by Quill. We operate under
    the strict supervision of the Financial Conduct Authority (FCA) and the Prudential
    Regulation Authority (PRA). In accordance with the Consumer Duty, we are committed
    to ensuring that all customers—including those on our premium plans—receive fair
    outcomes and clear communication regarding the costs of our services.


    **Fees and Commitments**

    The subscription to Quill Plus involves a recurring monthly fee of £7. By activating
    this service, the customer agrees to a minimum term of 3 months. We ensure that
    these terms are presented clearly and concisely, avoiding opaque jargon, so that
    customers can make an informed decision about the suitability of this product
    for their financial circumstances.


    **Deposit Protection**

    Regardless of the account tier, all eligible deposits held with Quill are protected
    by the Financial Services Compensation Scheme (FSCS) up to £120,000 per person,
    per institution. This protection applies to the funds held in the account associated
    with the Quill Plus subscription.


    **Service Standards**

    We maintain a high standard of care, ensuring all product recommendations are
    fair, clear, and not misleading. We do not provide individualised tax, legal,
    or professional investment advice as part of the Quill Plus subscription. Our
    support is delivered 24/7 via in-app chat and email to assist our global user
    base, with complex queries escalated through a tiered specialist path to ensure
    compliance with regulatory response timelines.'
