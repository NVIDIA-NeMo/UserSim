- id: 584b344c-e19c-5033-b5db-b52becef0cc0
  title: Quill Current Account — vs. a similar product here
  body: "When comparing the Quill Current Account to a traditional high-street current\
    \ account, the primary distinctions lie in cost, accessibility, and agility.\n\
    \n**Cost**\nQuill provides essential banking with a monthly account fee of £0.\
    \ Many traditional alternatives charge a monthly maintenance fee for basic accounts\
    \ or require a minimum monthly deposit to waive such fees. \n\n**Accessibility\
    \ and UX**\nQuill is an app-first neobank. While traditional banks offer physical\
    \ branches, we compete on a frictionless, digital-only experience. This allows\
    \ for instant card control and proactive security features, such as gambling blocks,\
    \ managed entirely in-app.\n\n**Borrowing**\nQuill offers an arranged overdraft\
    \ rate of 29% (EAR). Traditional banks may offer varying rates, some of which\
    \ may be lower for specific customer segments but often come with more opaque\
    \ terms.\n\n**Who it suits**\n- **Quill Current Account:** Best for digitally\
    \ native users who value transparency, zero monthly fees, and a high-speed user\
    \ experience.\n- **Traditional Account:** Best for users who require physical\
    \ cash deposits or face-to-face consultations in a branch."
  domain: retail_banking
  product_category: current_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 5fe8c55c-b369-5603-9f66-118f4a1d8935
  title: Quill Current Account — regulatory disclosures
  body: 'Quill operates under the strict supervision of the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). We are fully committed to
    the Consumer Duty, which mandates that we act to deliver good outcomes for retail
    customers by providing products that are fair, clear, and not misleading.


    **Deposit Protection**

    Eligible deposits held within the Quill Current Account are protected by the Financial
    Services Compensation Scheme (FSCS). This protection covers up to £120,000 per
    person, per institution. This ensures that your funds remain secure in the unlikely
    event of institutional failure.


    **Fraud and Dispute Handling**

    We prioritise the rapid resolution of disputes. For payment services, we commit
    to providing a final response within 15 business days. In alignment with our commitment
    to protect customers from fraud, we provide reimbursement for Authorised Push
    Payment (APP) scams up to a maximum of £85,000, subject to our fraud investigation
    and terms.


    **Security and Verification**

    To comply with Anti-Money Laundering (AML) and Know Your Customer (KYC) regulations,
    rigorous identity verification is mandatory before any state-changing action,
    payment, or disclosure of account information. We employ multi-factor authentication
    and in-app biometric checks as a standard security measure to prevent unauthorised
    access.


    **Advice Boundaries**

    While we provide financial education and general product information through our
    app and support channels, Quill does not offer individualised tax, legal, or professional
    investment advice. All product recommendations are intended for general informational
    purposes only and are not tailored to the specific financial circumstances of
    any individual customer.'
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 5dbd0b88-6d42-512a-b4d2-c51bd7cc79a7
  title: Quill Current Account — interest rate / AER schedule
  body: 'The Quill Current Account is a non-interest-bearing account. No interest
    is paid on the credit balance of this account.


    **Overdraft Rates**

    For customers who have been granted an arranged overdraft, the following rate
    applies:


    - Arranged Overdraft Rate: 29% (EAR)


    This is a flat rate that applies to all arranged overdraft balances regardless
    of the amount. The Effective Annual Rate (EAR) includes the effect of compounding
    interest. This rate is variable and may be subject to change based on market conditions
    or regulatory updates. We will notify customers of any changes to this rate in
    accordance with our change-of-terms policy. For those wishing to earn interest
    on their funds, we recommend using our Quill Instant Access Savings product, which
    offers 3.75% AER.'
  domain: retail_banking
  product_category: current_account
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
