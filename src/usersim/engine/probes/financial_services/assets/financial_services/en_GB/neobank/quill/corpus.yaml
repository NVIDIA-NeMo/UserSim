- id: 2d88d9f8-62cd-521d-aad7-834ad1e5a937
  title: Quill Instant Access Savings — privacy and data handling
  body: 'Quill operates under the strict supervision of the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). We adhere to the Consumer
    Duty to ensure that our data handling and product delivery result in fair outcomes
    for all customers.


    Data Privacy: Your savings data, including your balance and the names of your
    savings pots, is encrypted and handled in accordance with current UK data protection
    laws. We use this information solely to manage your account, calculate your 3.75%
    AER interest, and provide a frictionless user experience. We do not sell your
    financial data to third parties.


    Deposit Protection: We are committed to the security of your funds. Eligible deposits
    held within your Quill Instant Access Savings pots are protected by the Financial
    Services Compensation Scheme (FSCS) up to £120,000 per person, per institution.
    This protection is a regulatory guarantee that your money is safe up to this limit
    should the institution fail.


    Regulatory Compliance: All interest payments and tax reporting are handled in
    alignment with UK banking regulations. We provide general financial education
    and product information; however, we do not offer individualised tax, legal, or
    professional investment advice. Our recommendations are designed to be fair, clear,
    and not misleading.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 0b09a819-d9b0-5900-a9fb-bb0e00b02e28
  title: Quill Instant Access Savings — recognising scams targeting this product
  body: 'As you compare our savings options against other providers, it is important
    to remain vigilant against fraud. Scammers often target those looking for high-yield
    opportunities by promising returns significantly higher than our standard 3.75%
    AER through ''exclusive'' or ''limited-time'' offers. These are almost always
    fraudulent.


    Common patterns to recognise include:

    - Urgent requests to move your funds into a ''safe account'' to avoid a tax penalty
    or to qualify for a higher rate.

    - Unsolicited messages via email or SMS claiming that your Quill Instant Access
    Savings account has been compromised and requires an immediate transfer of funds
    to secure them.

    - Pressure to share your login credentials or biometric verification codes to
    ''unlock'' a premium interest tier.


    We want to be clear: we will never ask you for your password, your full PIN, or
    for you to move your money to a third-party account for ''security'' reasons.
    We will never pressure you to make a state-changing action over the phone.


    If you notice any suspicious activity or receive a communication that feels off,
    your first action should be to report it to us immediately via the in-app chat.
    Rapid reporting is essential, especially in cases of Authorised Push Payment (APP)
    scams, where we are committed to reimbursing eligible victims up to £85,000.


    For your peace of mind, remember that all eligible deposits in your savings pots
    are protected by the FSCS up to £120,000 per person, per institution, ensuring
    your money is safe even in the unlikely event of bank failure.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
