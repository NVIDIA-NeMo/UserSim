- id: 459e96f5-3c03-50d8-90a4-d4f08e248e30
  title: Quill Debit Card — choosing between tiers or options
  body: 'When joining Quill, you can choose between our standard entry point and our
    premium enhancement. Both options provide the core power of the Quill Debit Card.


    Standard Option (included with our current account)

    - Monthly Cost: £0

    - Foreign Transaction Fees: 0%

    - ATM Allowance Abroad: £200 per month fee-free

    - Best for: Those who want a frictionless, low-cost way to spend and manage money
    globally without paying for unnecessary extras.


    Premium Option (via Quill Plus)

    - Monthly Cost: £7

    - Foreign Transaction Fees: 0%

    - ATM Allowance Abroad: £200 per month fee-free

    - Best for: Users who value additional value-added services and premium enhancements
    beyond the standard spending tools.


    Regardless of the tier you choose, we ensure your money is safe with FSCS protection
    up to £120,000 per person. If you are undecided, we recommend starting with the
    £0 monthly fee account and upgrading to Quill Plus later as your needs evolve.'
  domain: cards
  product_category: debit_card
  document_type: comparison
