- id: 6b4bc797-e111-55e8-a2b0-e9eaf0aaf6db
  title: Quill Current Account — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right bank depends on your personal financial habits and priorities.
    The Quill Current Account is built for the digitally native consumer who values
    agility, transparency, and a fair fee structure.


    **Why Choose the Quill Current Account?**

    - **Zero Monthly Cost:** Unlike many traditional accounts that charge for maintenance,
    our core account has a monthly fee of £0.

    - **Frictionless Experience:** We provide an app-first interface with proactive
    security, such as instant card control and gambling blocks, designed for immediate
    management.

    - **Transparent Security:** We offer a commitment to protect you from fraud, including
    the reimbursement of eligible authorised push payment (APP) scams up to £85,000.

    - **Regulatory Safety:** Your eligible deposits are protected by the FSCS up to
    £120,000 per person, providing the same peace of mind as a traditional high-street
    bank.


    **When Not to Choose Quill**

    While we offer a modern experience, the Quill Current Account may not be the best
    fit if:

    - **You Need Physical Branches:** We are an app-only neobank. If you require face-to-face
    consultations or the ability to deposit physical cash at a branch, a traditional
    bank would be a better choice.

    - **You Require Low-Cost Overdrafts:** Our arranged overdraft rate is 29%. If
    you frequently rely on an overdraft and require a lower rate, you may find traditional
    alternatives more cost-effective.

    - **You Want Complex Investment Advice:** We provide financial education and general
    product information, but we do not offer individualised tax, legal, or professional
    investment advice.


    In summary, if you value a high-tech, low-cost, and transparent way to manage
    your daily spending, Quill is an excellent choice. If you prefer legacy banking
    infrastructure and physical presence, you may prefer a traditional alternative.


    For more on our pricing, see Quill Current Account — fee schedule.'
