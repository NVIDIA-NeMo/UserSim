- id: eb22b423-8513-5a8e-ba31-8e7928f3df6a
  title: Quill Payments — a failed or pending action
  body: 'If you encounter a situation where a payment is marked as ''Pending'' or
    has ''Failed'', it is usually due to a security trigger or a limit restriction.


    **Common Symptoms**

    - The payment status remains ''Pending'' for more than a few minutes.

    - An error message appears stating ''Transaction Declined'' or ''Limit Exceeded''.

    - The funds have left your balance, but the recipient has not received them.


    **What to Check**

    1. Available Balance: Ensure you have sufficient funds to cover the full amount
    of the transfer.

    2. Daily Limit: Check if this payment, combined with your other transfers today,
    exceeds the daily limit of £10,000. If you have hit this ceiling, you will need
    to wait until the next calendar day to send further funds.

    3. Recipient Details: Verify that the account number and sort code are correct.
    If Confirmation of Payee flagged a name mismatch, the payment may have been paused
    for your protection.

    4. Identity Verification: Ensure your app is updated and that you successfully
    completed the biometric check during the payment process.


    **The Fix**

    - If the limit was exceeded, schedule the remaining balance for tomorrow.

    - If the details were wrong, delete the payment recipient and re-enter the details
    carefully.

    - If the balance was insufficient, top up your account and retry the transfer.


    **Escalation**

    If you believe the payment failed in error or is stuck in ''Pending'' despite
    meeting all requirements, tell us. We will raise a formal investigation case with
    our payments specialist team. You will receive an update via in-app chat or email
    within 15 business days, in accordance with our commitment to rapid dispute resolution.
    For further details on requirements, see Quill Payments — eligibility requirements.'
  domain: payments
  product_category: payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 1ca2aab8-ea32-55dd-9aa3-964c3e3791a7
