- id: 67316d60-d661-5071-9b82-030ca8df4bdb
  title: Quill Plus — monthly fee explained
  body: 'Q: How much does Quill Plus cost each month?

    A: Quill Plus carries a monthly fee of £7. This fee is charged to your account
    once per month and covers the cost of the additional value-added services and
    premium features available in this tier.


    Q: When is the £7 fee deducted from my account?

    A: The monthly fee is deducted automatically from your account balance on the
    anniversary of your activation date each month. We recommend ensuring your account
    is sufficiently funded to avoid any disruption in service.


    Q: Can I cancel the fee immediately after joining?

    A: Because Quill Plus is a premium commitment, it comes with a minimum term of
    3 months. This means you will be charged the £7 monthly fee for at least the first
    3 months of your subscription before you are eligible to downgrade or cancel the
    premium tier. For more details on how this works, you can refer to Quill Plus
    — minimum subscription period (months) explained.'
