- id: b89385ac-0c4b-5757-9596-52e3a444f827
  title: Quill Payments — account security best practices
  body: "Protecting your money is our highest priority. As you use Quill Payments\
    \ to move funds, we encourage you to adopt these essential security practices\
    \ to safeguard your account.\n\nFirst, always rely on our built-in Confirmation\
    \ of Payee service. This security feature verifies that the recipient's name matches\
    \ the account details before any Faster Payment is sent, providing a critical\
    \ layer of defence against errors and fraud. \n\nBe vigilant regarding Authorised\
    \ Push Payment (APP) scams. These occur when fraudsters trick you into voluntarily\
    \ transferring money to an account they control. Remember, we will never ask you\
    \ for your full PIN or password via chat or email. If a payment request feels\
    \ urgent or unusual, stop and verify the recipient through a secondary, trusted\
    \ channel.\n\nIn the event that you fall victim to an APP scam, we are committed\
    \ to your protection. We provide reimbursement for these scams up to £85,000.\
    \ To ensure the best chance of recovery, you must report the incident to us immediately.\
    \ We prioritise the rapid resolution of disputes, aiming to provide final responses\
    \ for payment services within 15 business days.\n\nTo maintain the highest standard\
    \ of security, we employ multi-factor authentication and in-app biometric checks\
    \ for all state-changing actions. Never share your biometric data or authentication\
    \ codes with anyone. If you notice any suspicious activity or believe your account\
    \ security has been compromised, notify us through the app immediately so we can\
    \ secure your funds."
  domain: payments
  product_category: payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 8c2bac7a-bb72-594e-ae66-8193d7a3b1b1
  title: Quill Payments — change-of-terms policy
  body: 'This document outlines our policy regarding changes to the terms and conditions
    governing Quill Payments. We reserve the right to modify the features, limits,
    and fees associated with our payment services to ensure our offering remains fair
    and competitive.


    Currently, the fee for a Faster Payment is £0, and the daily limit for Faster
    Payments is £10,000. Should we decide to alter these specific values—for example,
    by introducing a fee or adjusting the daily transfer ceiling—we will provide you
    with clear and concise notice. We commit to notifying you of any material changes
    at least 30 days before they take effect. This notice will be delivered via in-app
    notification and email, avoiding opaque banking jargon to ensure the impact on
    your financial wellness is transparent.


    If a change in terms is unacceptable to you, you have the right to close your
    account or downgrade your subscription before the change becomes effective. Our
    commitment to the Consumer Duty ensures that any adjustments to our service model
    are designed to deliver fair outcomes for all customers.


    These terms are subject to the strict supervision of the FCA and PRA. While our
    current pricing model reflects our belief that essential banking should be accessible
    to all, we will maintain a high standard of care in all communications regarding
    future adjustments to the Quill Payments framework.'
  domain: payments
  product_category: payments
  document_type: terms_conditions
  source_authority: official
