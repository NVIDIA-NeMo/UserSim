    \ better for?\nA typical competitor might be a better choice if you are looking\
    \ for a 'Fixed Term' bond where you are willing to lock your money away for years\
    \ in exchange for a potentially higher, guaranteed rate. \n\nWho is Quill better\
    \ for?\nQuill is the superior choice for those who want a high return of 3.75%\
