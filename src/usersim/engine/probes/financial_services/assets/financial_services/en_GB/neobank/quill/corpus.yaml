- id: 539031c9-5fb2-52df-bc8c-1aa0f29dc064
  title: Quill Current Account — overview
  body: 'The Quill Current Account is our core, app-only entry point designed for
    digitally native consumers who prioritise agility, transparency, and financial
    wellness. We have built this account to strip away the friction of traditional
    banking, offering a seamless experience managed entirely through our mobile application.


    At the heart of our offering is the belief that essential banking should be accessible
    to everyone. Consequently, the Quill Current Account carries a monthly account
    fee of £0. This allows our users to manage their daily spending and finances without
    the burden of a recurring subscription cost.


    For those who require a safety net, we provide arranged overdraft facilities.
    These are subject to an arranged overdraft rate of 29% (EAR), ensuring that users
    have a clear understanding of the cost of borrowing.


    Beyond the basics, the account integrates perfectly with our broader ecosystem
    of financial tools. Users can instantly open savings pots through our Quill Instant
    Access Savings, which currently offers an interest rate of 3.75% AER. For those
    seeking a more comprehensive suite of value-added services, we offer an upgrade
    to Quill Plus for a monthly fee of £7.


    Every Quill Current Account is supported by a Quill Debit Card, which enables
    global spending with 0% foreign transaction fees and a monthly fee-free ATM allowance
    of £200. Additionally, our payments infrastructure allows for fast, secure transfers
    with £0 fees and a daily limit of £10,000, all protected by Confirmation of Payee
    to ensure funds reach the correct recipient.


    Security is paramount at Quill. We employ rigorous identity verification, multi-factor
    authentication, and in-app biometric checks for all state-changing actions. Furthermore,
    your peace of mind is protected by the FSCS, which protects eligible deposits
    up to £120,000 per person, per institution. We are committed to the Consumer Duty,
    ensuring that our products provide fair outcomes for all our customers.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 4fe845a1-cdee-507b-a466-089387f9efca
  title: Quill Current Account — monthly account fee explained
  body: 'Q: How much does it cost per month to maintain my Quill Current Account?


    A: The Quill Current Account is designed to be an accessible entry point for essential
    banking. Therefore, the monthly account fee is £0. There are no hidden monthly
    charges for the standard account features.


    Q: Are there any other monthly subscriptions I should be aware of?


    A: While the core account remains free, we offer a premium tier called Quill Plus.
    This is an optional subscription that costs £7 per month and provides additional
    value-added services beyond the standard offering. You can find more details on
    this in the Quill Plus — overview document.


    Q: Will I be charged for making payments from my account?


    A: No, we provide fast and secure transfers with £0 fees for standard payments.
    For a full breakdown of what we do and do not charge, please refer to the Quill
    Current Account — fee schedule.'
  domain: retail_banking
  product_category: current_account
  document_type: faq
  source_authority: official
