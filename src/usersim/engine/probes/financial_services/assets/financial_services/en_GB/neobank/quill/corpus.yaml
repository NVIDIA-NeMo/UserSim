- id: dedb042c-028d-51fc-8513-8771b663f04c
  title: Quill Instant Access Savings — vs. a typical competitor offering
  body: "When comparing Quill Instant Access Savings to typical high-street or neobank\
    \ alternatives, the primary differences lie in agility and cost.\n\nTypical Competitor\
