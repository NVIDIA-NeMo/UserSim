- id: 6ec88d3c-f7ce-5be4-91c6-4c2a726e713a
  title: Quill Plus — make a change or update
  body: "If you need to update your subscription details or make a change to your\
    \ Quill Plus account, please follow these steps. All changes are handled securely\
    \ through our support team or the app.\n\nStep 1: Request the Change\nTell us\
    \ exactly what you wish to update—for example, updating the payment method for\
    \ your £7 monthly fee or modifying your account preferences. \n\nStep 2: Security\
    \ Verification\nTo protect your account, we will trigger a mandatory identity\
    \ verification check. You will be asked to complete a biometric check or an MFA\
    \ prompt within your app. We cannot process any state-changing action without\
    \ this confirmation.\n\nStep 3: Review and Confirmation\nWe will present the proposed\
    \ change for your review. For example, if you are updating a billing preference,\
    \ we will confirm that the £7 fee will continue to be collected on the same date\
    \ each month.\n\nStep 4: Finalisation\nOnce you confirm the details, we will apply\
    \ the update. You will receive an instant notification in the app confirming that\
    \ the change has been successfully completed.\n\nIf you are looking to move away\
    \ from the premium tier entirely, please refer to Quill Plus — cancel, close,\
    \ or downgrade, keeping in mind the 3-month minimum term requirement."
