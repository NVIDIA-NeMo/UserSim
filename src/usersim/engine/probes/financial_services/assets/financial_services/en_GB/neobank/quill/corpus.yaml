- id: bc32f0a3-48e7-5548-8777-c42811f8622e
  title: Quill Payments — fraud and unauthorised-activity protection
  body: "At Quill, we take a proactive approach to safeguarding your money. When using\
    \ Quill Payments, your primary defence against fraud is our integration of Confirmation\
    \ of Payee. This security service verifies that the recipient's name matches the\
    \ account details before any Faster Payment is sent, significantly reducing the\
    \ risk of sending funds to the wrong person or a fraudster.\n\nWe are acutely\
    \ aware of the rise in Authorised Push Payment (APP) scams, where customers are\
    \ tricked into voluntarily transferring money to an account controlled by a criminal.\
    \ To provide peace of mind, we are committed to protecting our customers from\
    \ such fraud, including the reimbursement of authorised push payment scams up\
    \ to £85,000. This commitment ensures that you are not left financially devastated\
    \ by sophisticated social engineering attacks.\n\nTo maintain the highest standard\
    \ of account security, we employ multi-factor authentication and in-app biometric\
    \ checks. Rigorous identity verification is mandatory before any state-changing\
    \ action or payment is processed. We will never ask you to disclose your full\
    \ biometric data or passwords over a chat or email.\n\nIf you notice any unauthorised\
    \ activity or believe you have fallen victim to a scam, the first action you must\
    \ take is to report it to us immediately via the app. Rapid reporting is essential\
    \ for the recovery of funds. For any payment service disputes, we prioritise a\
    \ swift resolution and aim to provide a final response within 15 business days.\
    \ \n\nFor further guidance on maintaining your account's overall integrity, we\
    \ recommend reviewing Quill Current Account — account security best practices."
  domain: payments
  product_category: payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 33a43545-56eb-508b-87f9-e3343a104876
  title: Quill Payments — account agreement
  body: 'This agreement outlines the terms governing the use of Quill Payments. By
    utilising our payment services, you agree to adhere to the following conditions:


    1. Service Obligations: We provide a frictionless, app-first payment experience
    designed for agility and transparency. We commit to maintaining the service according
    to the standards set by the FCA and PRA, ensuring fair outcomes for all customers
    under the Consumer Duty.


    2. Fees and Limits: We believe essential banking should be accessible. Consequently,
    the fee for a Faster Payment is £0. To mitigate risk and protect your funds, a
    daily limit of £10,000 applies to all outgoing transfers. This limit is a maximum
    aggregate and cannot be exceeded within a single 24-hour period without a formal
    specialist review.


    3. Security and Verification: You are obligated to maintain the security of your
    access credentials. We require rigorous identity verification and biometric authentication
    before any payment is authorised. You must notify us immediately of any suspected
    security breach.


    4. Fraud and Reimbursement: While we employ Confirmation of Payee to verify recipients,
    you remain responsible for the accuracy of the payment details provided. However,
    in cases of Authorised Push Payment (APP) scams, we provide reimbursement up to
    £85,000, subject to our fraud investigation and regulatory guidelines.


    5. Dispute Resolution: All payment service disputes will be handled with priority.
    We aim to provide a final response to such queries within 15 business days.


    6. Termination: This agreement ends upon the closure of your associated account.
    Changes to these terms will be communicated via the app in accordance with our
    change-of-terms policy. For more details on account termination, please refer
    to Quill Current Account — cancel, close, or downgrade.'
  domain: payments
  product_category: payments
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 721279c9-5ff0-57ef-b116-68ab882c1a18
  title: Quill Payments — who it is best for and common use cases
  body: 'Quill Payments is designed for the digitally native consumer who demands
    speed, transparency, and a frictionless experience. By stripping away the opaque
    jargon and hidden costs of traditional banking, we provide a payment tool that
    fits seamlessly into a modern lifestyle.


    This service is best suited for:

    - Freelancers and remote workers who need to send and receive funds quickly and
    without the burden of transaction fees.

    - Tech-savvy individuals who prefer managing their entire financial life through
    a high-performance app.

    - Users who prioritise security and want built-in protections like Confirmation
    of Payee and APP scam reimbursement.


    Common Use Cases:

    - Instant Peer-to-Peer Transfers: Splitting a dinner bill or paying a friend back
    instantly with a £0 fee per transfer.

    - Monthly Bill Management: Moving funds to utility providers or landlords with
    the confidence of a £10,000 daily limit, ensuring most household requirements
    are covered in a single day.

    - Rapid Fund Redistribution: Moving money between your current account and your
    savings pots for better financial wellness.


    Key Features:

    - Cost: A flat £0 fee for Faster Payments.

    - Capacity: A daily transfer limit of £10,000.

    - Security: Integrated Confirmation of Payee and biometric verification.

    - Protection: Reimbursement for APP scams up to £85,000.


    Quill Payments is the ideal choice for those who value agility over legacy banking
    structures. It pairs perfectly with our other offerings, such as the Quill Debit
    Card for global spending. For a full overview of our account tiers, see Quill
    Current Account — overview.'
  domain: payments
  product_category: payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 7c20703c-27ec-543d-9df5-42b9815969e9
  title: Quill Payments — daily limit for Faster Payments explained
  body: 'Q: What is the daily limit for Faster Payments at Quill?

    A: To ensure the security of your account and adhere to risk management protocols,
    we apply a daily limit of £10,000 for all outgoing transfers. This is the total
    aggregate amount you can send across all transactions in a single day.


    Q: Does the £10,000 limit apply to each individual payment or the total for the
    day?

    A: The limit is a daily total. Once you have transferred £10,000 in a 24-hour
    period, you will be unable to send further payments until the limit resets the
    following day.


    Q: Can I increase my daily limit for a specific large purchase?

    A: While the standard limit is £10,000, complex queries or requests for higher
    limits are escalated through our tiered specialist path. This ensures we remain
    compliant with regulatory response timelines and security standards. Please ask
    us to initiate a review if you have a one-off requirement for a higher amount.'
  domain: payments
  product_category: payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 6b1fcdf9-dc65-596a-a3e8-3846c0c0e87f
  title: Quill Payments — cancel, close, or downgrade
  body: 'Because Quill Payments is a core feature integrated into your account, you
    cannot ''cancel'' the payment functionality as a standalone service while keeping
    your account open. However, if you wish to stop using our payment services or
    restrict your ability to send funds, follow these steps:


    1. State your intent: Tell us that you wish to either close your account entirely
    or restrict your payment capabilities (such as implementing a lower custom limit
    for security).


    2. Verify your identity: You will be asked to complete an in-app biometric check
    and multi-factor authentication. This is a mandatory security step to ensure no
    unauthorised person is attempting to restrict your account access.


    3. Confirm balances: We will confirm that any pending Faster Payments have cleared
    and that your balance is handled according to your preference (e.g., transferred
    to another institution).


    4. Finalise the request: We will then process the closure or the restriction.
    You will receive an instant in-app notification confirming that the action is
    complete.


    If you are closing your account to move to another provider, we recommend using
    the Current Account Switch Service for a guaranteed move within seven working
    days.


    For users specifically looking to move from a premium tier back to our core offering,
    please refer to Quill Plus — cancel, close, or downgrade to see how to manage
    your subscription while retaining your payment features.'
  domain: payments
  product_category: payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 0e9fa7a6-4b00-5a5b-8096-32b79e2f3100
  title: Quill Payments — an unexpected charge or amount
  body: 'Symptom: A customer reports seeing a charge they did not expect or an incorrect
    amount deducted from their balance following a payment.


    Likely Causes:

    - User error in entering the payment amount.

    - A misunderstanding of the fee structure.

    - An unauthorised transaction resulting from fraud.


    What to check in order:

    1. Review the Transaction History: Check the exact amount debited. Since the fee
    for a Faster Payment is £0, there should be no additional charges added to the
    principal amount.

    2. Verify the Recipient: Confirm via the app that the payment was sent to the
    intended recipient and that the Confirmation of Payee check was successful.

    3. Check for Pending Actions: Determine if the amount is a finalised charge or
    a pending hold.


    Resolution:

    - If the customer entered the wrong amount, we must explain that Faster Payments
    are typically instant and cannot be ''undone''. We will advise the customer to
    request a return from the recipient.

    - If the charge is unauthorised, we will immediately initiate our fraud protocol.
    We will review the transaction to see if it qualifies as an Authorised Push Payment
    (APP) scam, for which we provide reimbursement up to £85,000.


    Escalation:

    If the issue cannot be resolved through initial review, we will raise a formal
    dispute case. This will be routed to our specialist team. The customer should
    be informed that we prioritise rapid resolution and will provide a final response
    within 15 business days.'
  domain: payments
  product_category: payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
