- id: 3e7633dc-8f14-5f91-b3ff-699374f74aac
  title: Quill Current Account — access or login problems
  body: 'If you are experiencing difficulties accessing your Quill Current Account,
    please review the following common causes and resolutions. Because we are an app-first
    bank, most access issues are related to device security or verification.


    Symptom: "I cannot log in to the app or my biometric check is failing."


    Likely Causes:

    - Outdated app version.

    - Biometric data changes on the device (e.g., new fingerprint or face scan).

    - Account lock due to multiple incorrect PIN attempts.

    - Unrecognised device attempting to access the account.


    What to check in order:

    1. App Version: Check your device''s app store to ensure you are running the latest
    version of the Quill app.

    2. Device Biometrics: Ensure that the biometric sensor on your phone is clean
    and that your device is correctly recognising your biometric data in other apps.

    3. Connectivity: Confirm you have a stable internet connection, as our identity
    verification requires a real-time link to our security servers.


    How to fix it:

    - If biometrics fail, use the "Use PIN" option on the login screen to gain access.

    - If you have forgotten your PIN, ask us to trigger a secure identity reset. We
    will guide you through a new biometric verification and ID check to set a new
    PIN.

    - If the account is locked, we will initiate a tiered specialist review to verify
    your identity and restore access.


    When to escalate:

    If these steps do not resolve the issue, we will raise a high-priority technical
    case. You will receive a reference number and a status update via your registered
    email. Most access issues are resolved within 24 hours. For further details on
    account status, see Quill Current Account — check status or history.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
