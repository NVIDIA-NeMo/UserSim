- id: b1fe31ea-12e7-5a42-b697-3d6f062ad546
  title: Quill Instant Access Savings — risk disclosures
  body: "This document provides essential regulatory disclosures regarding the Quill\
    \ Instant Access Savings product.\n\nInterest Rate Risk:\nThe interest rate for\
    \ this account is 3.75% AER. Please be advised that this is a variable rate. This\
    \ means the rate can fluctuate upwards or downwards based on market conditions\
    \ and changes to the base rate set by the Bank of England. Your actual earnings\
    \ may change over the duration of your account holding.\n\nDeposit Protection:\n\
    Your funds are held with Quill, which operates under the strict supervision of\
    \ the FCA and PRA. Eligible deposits are protected by the Financial Services Compensation\
    \ Scheme (FSCS). The maximum protection limit is £120,000 per person, per institution.\
    \ Any amount exceeding £120,000 is not protected by the FSCS.\n\nLiquidity:\n\
    While this is an 'instant access' account, allowing for rapid movement of funds,\
    \ the actual speed of transfer depends on the availability of your linked Quill\
    \ current account. \n\nRegulatory Compliance:\nQuill adheres to the Consumer Duty\
    \ to ensure fair outcomes for all customers. We provide financial education and\
    \ general information; however, we do not provide individualised tax, legal, or\
    \ professional investment advice. Customers are encouraged to seek independent\
    \ professional advice regarding the tax implications of the interest earned on\
    \ their savings."
  domain: retail_banking
