- id: 6fafbfa9-e4e0-5606-91b3-ae3acd2a6208
  title: Quill Current Account — a failed or pending action
  body: 'If you are attempting to open an account or perform a state-changing action
    and encounter a ''failed'' or ''pending'' status, please follow these steps to
    resolve the issue.


    **Symptom: Account application is ''Pending'' for more than 24 hours**


    Likely Cause: This is usually due to a mismatch in identity verification or a
    low-quality upload of your government ID.


    1. Check your notifications: We will send a message if we require a clearer photo
    of your ID or additional proof of address.

    2. Re-submit documentation: If prompted, provide a high-resolution image of your
    ID ensuring no glare or cropped edges.

    3. Complete biometric re-verification: If the initial biometric check was inconclusive,
    we will request a new scan. Ensure you are in a well-lit environment.


    **Symptom: Action ''Failed'' during payment or account update**


    Likely Cause: This is typically caused by a failure in multi-factor authentication
    (MFA) or a timeout during the biometric check.


    1. Verify your connection: Ensure you have a stable internet connection, as MFA
    requests can time out.

    2. Re-authenticate: Attempt the action again and ensure you complete the biometric
    prompt immediately when it appears.

    3. Check for account blocks: Ensure you have not accidentally enabled a security
    block that might prevent the action.


    **When to escalate**


    If you have re-submitted your documents and completed the biometric check but
    the status remains ''Pending'' for another 48 hours, we will raise a priority
    case with our compliance specialists. You will receive a confirmation that your
    case is being reviewed, and we aim to provide a final response within 15 business
    days if the issue relates to a payment service dispute. For general setup issues,
    we will update you via the app as soon as the specialist review is complete.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 71cdcf37-d09c-52b2-9813-e2724653ccb1
  title: Quill Current Account — eligibility requirements
  body: 'The following matrix outlines the requirements for maintaining or opening
    a Quill Current Account. All conditions must be met for a positive outcome.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Age | 18 years or older | Eligible |

    | Residency | Permanent resident of a supported jurisdiction | Eligible |

    | Identity | Valid government-issued photo ID | Eligible |

    | Verification | Successful completion of biometric check | Eligible |

    | Legal Status | Not subject to active financial sanctions | Eligible |

    | Documentation | Valid proof of address (where requested) | Eligible |


    Failure to meet any of the above criteria will result in an ''Ineligible'' outcome,
    and the account application will be declined. For existing customers, failure
    to provide updated documentation upon request may lead to account restrictions.
    Please refer to Quill Current Account — regulatory disclosures for further information
    on our compliance obligations.'
  domain: retail_banking
  product_category: current_account
  document_type: eligibility_matrix
  source_authority: official
