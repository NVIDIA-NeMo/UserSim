- id: 1f0ba2bc-6f2a-5edd-a1c6-bccccdefe997
  title: Quill Debit Card — privacy and data handling
  body: 'This disclosure explains how Quill handles the data generated by your use
    of the Quill Debit Card. We operate under the strict supervision of the FCA and
    PRA, ensuring that your data is processed in accordance with the highest regulatory
    standards and the Consumer Duty.


    Transaction Data: We collect and process data related to your spending, including
    merchant details, transaction amounts, and locations. This data is used to provide
    you with real-time notifications, to facilitate our 0% foreign transaction fee
    calculations, and to monitor your monthly £200 ATM allowance. This processing
    is essential for the delivery of our frictionless user experience.


    Security and Verification: To protect your account, we employ rigorous identity
    verification. This includes the use of multi-factor authentication and in-app
    biometric checks. This data is used exclusively to prevent fraud and ensure that
    only the authorised account holder can perform state-changing actions or access
    account information.


    Fraud Prevention: We monitor transaction patterns to protect you from fraud, including
    authorised push payment scams. In line with our commitment to customer protection,
    we reimburse eligible victims of such scams up to £85,000. Data shared with fraud
    prevention agencies is done so under strict regulatory guidelines to enhance the
    security of the wider financial ecosystem.


    Your funds are protected by the FSCS up to £120,000 per person, per institution,
    providing peace of mind alongside our digital-first security approach. We avoid
    opaque jargon and provide all privacy information in a clear and concise format.
    For further details on our regulatory obligations, please see Quill Debit Card
    — regulatory disclosures.'
  domain: cards
  product_category: debit_card
  document_type: disclosure
  source_authority: official
