  mentions_tools: []
  institution_id: quill
- id: 8e4ab420-6781-5cc4-aece-9a4cbc70911e
  title: Quill Payments — getting started walkthrough
  body: "This guide is intended for support agents assisting customers with their\
    \ first use of Quill Payments. Our goal is to ensure the customer experiences\
    \ a frictionless transition into our payment ecosystem.\n\n**Step 1: Preparation**\n\
    Ensure the customer has completed the mandatory identity verification process.\
    \ We employ rigorous checks and in-app biometric authentication before any payment\
    \ can be initiated. Confirm the customer has a balance sufficient to cover the\
    \ transfer.\n\n**Step 2: Setting up the Recipient**\nGuide the customer to add\
    \ a new payee. Explain that we use Confirmation of Payee to verify the recipient's\
    \ name matches the account details. If the system flags a mismatch, advise the\
    \ customer to double-check the details with the recipient before proceeding.\n\
    \n**Step 3: Executing the Transfer**\nInform the customer that they can send funds\
    \ instantly. Highlight that the fee for a Faster Payment is £0, meaning no money\
    \ is deducted from the transfer amount for the service. \n\n**Step 4: Managing\
    \ Limits**\nIf the customer intends to send a large sum, remind them that there\
    \ is a daily limit for Faster Payments of £10,000. If the requested amount exceeds\
    \ this threshold, explain that this is a security measure to protect their funds.\n\
    \n**Step 5: Confirmation**\nOnce the customer confirms the payment via biometric\
    \ check, the funds are sent. We will provide an instant notification within the\
    \ app once the payment has been processed. If the customer has any further questions\
    \ about their account structure, you may refer them to the Quill Current Account\
    \ — overview."
