- id: 770a6bc1-1726-5728-a7e5-2c0de2be6d0f
  title: Quill Plus — vs. a typical competitor offering
  body: 'When comparing Quill Plus to typical premium offerings from other neobanks
    or traditional institutions, the primary differences lie in transparency and agility.


    Quill Plus focuses on a simple, flat-fee structure. We charge a transparent monthly
    fee of £7, whereas competitors often use complex bundles or ''hidden'' criteria
    to waive fees. While some alternatives might offer a ''free'' tier, they often
    lack the integrated proactive security features, such as gambling blocks and rapid
    15-business-day dispute resolution, that we provide as standard.


    In terms of lock-in, many traditional premium accounts require long-term contracts
    or high minimum balances. Quill Plus employs a modest minimum term of 3 months,
    ensuring users can experience the value of the service without being tied into
    an oppressive long-term agreement.


    Who should choose which?

    - Quill Plus is the better choice for those who want a professional, app-first
    experience with a clear cost of £7 per month and no hidden balance requirements.

    - A competitor''s offering may be preferable if the user requires physical branch
    access or specific legacy banking products that we do not offer as a neobank.'
  domain: retail_banking
  product_category: quill_plus
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: edd8840b-eae3-5c2c-8745-457a7bd65113
  title: Quill Plus — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Quill
    Plus subscription service. Please read these carefully when comparing our offering
    against alternatives.


    Regulatory Oversight

    Quill operates under the strict supervision of the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). We adhere to the Consumer
    Duty, which mandates that we act to deliver good outcomes for retail customers.
    All features and fees associated with Quill Plus are designed to be fair, clear,
    and not misleading.


    Deposit Protection\All eligible deposits held within a Quill Plus account are
    protected by the Financial Services Compensation Scheme (FSCS). This protection
    covers up to £120,000 per person, per institution. This is a statutory protection
    and does not depend on the subscription tier you choose.


    Fraud and Liability\We are committed to protecting our users from fraud. In the
    event of an Authorised Push Payment (APP) scam, we provide reimbursement up to
    £85,000, subject to our internal investigation and regulatory guidelines. Please
    note that while we provide robust security tools, the user remains responsible
    for maintaining the confidentiality of their biometric and MFA credentials.


    Advice Boundaries\Quill provides financial education and general product information
    regarding the Quill Plus tier. However, we do not offer individualised tax, legal,
    or professional investment advice. Any recommendations made regarding our products
    are based on general use cases and should not be construed as professional financial
    advice.


    Fees\The Quill Plus subscription carries a monthly fee of £7. This fee is non-refundable
    once the billing cycle has commenced, subject to the minimum term of 3 months.'
  domain: retail_banking
  product_category: quill_plus
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 630bfc2f-bb00-5a29-92b7-ceabf333d52b
  title: Quill Plus — how rates are tiered and applied
  body: 'For the Quill Plus product, ''rates'' refer to the subscription cost rather
    than an interest yield. Unlike savings products, Quill Plus employs a flat-fee
    pricing model.


    Subscription Fee: £7 per month


    Application of the Fee:

    - The fee is applied as a flat monthly charge. There are no balance-based tiers
    or spend-based waivers for this subscription.

    - The fee is debited from the user''s current account on the first day of each
    billing cycle.

    - This rate applies uniformly to all users of the Quill Plus tier, regardless
    of their total deposits or transaction volume.


    What would change this rate?

    Any change to the monthly fee of £7 would be communicated to the user in accordance
    with our change-of-terms policy, providing clear and concise notice before the
    new rate takes effect.'
  domain: retail_banking
  product_category: quill_plus
  document_type: rate_sheet
