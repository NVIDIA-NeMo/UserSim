- id: b36dc158-b4e1-5a6c-a0b6-f7c23cf2767d
  title: Quill Plus — a declined or blocked action
  body: "It can be frustrating if you find that a specific feature of your Quill Plus\
    \ account is unavailable or if a transaction has been declined. This guide helps\
    \ identify why this may be happening and how we can resolve it.\n\n**Symptom:\
    \ 'Premium Feature Unavailable' or Action Blocked**\nIf you are attempting to\
    \ use a value-added service included in Quill Plus and receive a message stating\
    \ the action is blocked or the feature is unavailable, the most common causes\
    \ are:\n\n1. **Failed Subscription Payment:** If the £7 monthly fee could not\
    \ be debited from your account due to insufficient funds, your access to premium\
    \ features may be temporarily suspended. Check your transaction history for any\
    \ failed debits of £7.\n2. **Minimum Term Conflict:** While rare, some account\
    \ state changes are restricted until the 3-month minimum term has been completed.\n\
    3. **Identity Verification:** For high-value actions, we require rigorous identity\
    \ verification. If your biometric check or multi-factor authentication failed,\
    \ the action will be blocked for your security.\n\n**How to resolve the issue**\n\
    - **If the fee failed:** Ensure your account has at least £7 available and ask\
    \ us to re-process the subscription payment. Once the fee is successfully collected,\
    \ your features will be restored immediately.\n- **If verification failed:** Simply\
    \ repeat the in-app biometric check or provide the requested identity verification.\
    \ \n- **If you are unsure:** Tell us which specific feature is blocked. We will\
    \ check your account status and, if necessary, route you to a specialist team\
    \ to resolve the restriction.\n\n**When to escalate**\nIf your balance is sufficient\
    \ and your identity is verified but features remain blocked, we will raise a technical\
    \ case with our specialist path. You will receive a status update via the app\
    \ within 2 business days.\n\nFor general issues with account actions, see Quill\
    \ Plus — a failed or pending action."
  domain: retail_banking
  product_category: quill_plus
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 428047a7-0e93-5d2e-82c0-e638739c75cd
  title: Quill Plus — when to switch or upgrade
  body: 'Support agents should use this guide to help customers decide whether to
    move from the standard `current_account` to `quill_plus`.


    **Comparison: Standard vs. Plus**

    - **Monthly Cost:** The standard account has a monthly fee of £0, while Quill
    Plus requires a monthly fee of £7.

    - **Commitment:** The standard account has no minimum term. Quill Plus requires
    a minimum term of 3 months.

    - **Value Proposition:** The standard account provides essential spending and
    management. Quill Plus provides enhanced, value-added services designed for those
    who want a more comprehensive banking experience.


    **Who should stay with the Standard Account?**

    Customers who value a cost-free entry point, have simple banking needs, or are
    not ready to commit to a 3-month subscription term.


    **Who should upgrade to Quill Plus?**

    Digitally native consumers who derive more value from premium features than the
    £7 monthly cost and are comfortable with the 3-month minimum commitment.


    For a broader overview of our entry-level offering, see Quill Current Account
    — overview.'
  domain: retail_banking
  product_category: quill_plus
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 600c0130-269f-5303-bf24-ec6151916f45
  title: Quill Plus — comparison vs. alternatives and when not to choose it
  body: 'When choosing a banking subscription, it is important to understand how Quill
    Plus fits into the landscape of modern neobanking. We focus on transparency and
    agility, avoiding the hidden costs often found in traditional premium accounts.


    **Why Choose Quill Plus?**

    Unlike many competitors who offer complex ''bundles'' with varying costs, Quill
    Plus is straightforward: you pay a monthly fee of £7 in exchange for enhanced
    features. This predictable cost structure aligns with our commitment to financial
    wellness and transparency.


    **How We Compare to Alternatives**

    Many traditional banks offer ''premium'' accounts that require high minimum monthly
    deposits or high average balances to waive fees. Quill Plus does not require you
    to maintain a specific balance to enjoy its benefits; the £7 fee is the only requirement.


    **When Quill Plus Might NOT Be the Right Choice**

    Quill Plus may not be the best fit for you if:

    - **You prefer zero monthly costs:** If you only need essential spending and management,
    our standard account with its £0 monthly fee is the better option.

    - **You require total flexibility:** Because Quill Plus has a minimum term of
    3 months, it is not suitable for those who may need to close or downgrade their
    account within a very short timeframe.

    - **You do not use premium features:** If you find that you do not utilise the
    value-added services, the £7 monthly fee becomes an unnecessary expense.


    We encourage all our customers to review their spending habits to ensure they
    are on the plan that best supports their financial goals. For more information
    on our core offering, see Quill Current Account — overview.'
  domain: retail_banking
  product_category: quill_plus
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 4aaf94b6-9e20-5495-a6a5-575816182ddc
  title: Quill Plus — how-to / step-by-step
  body: '**How do I change the account used to pay my Quill Plus fee?**

    Since the £7 monthly fee is automatically debited from your linked Quill current
    account, you simply need to ensure that this account is funded. If you wish to
    move funds from a savings pot to cover the fee, you can do this instantly via
    the app.


    **How do I downgrade from Quill Plus back to the standard account?**

    If you have completed your 3-month minimum term, you can request a downgrade.
    Once processed, your monthly fee will return to £0 starting from the next billing
    cycle.


    **Can I pause my Quill Plus subscription?**

    We do not offer a ''pause'' feature. The subscription remains active, and the
    £7 fee continues to be charged until the account is downgraded or closed, provided
    the 3-month minimum term has been met.


    For more information on changing your plan, see Quill Plus — cancel, close, or
    downgrade.'
  domain: retail_banking
  product_category: quill_plus
  document_type: faq
  source_authority: official
