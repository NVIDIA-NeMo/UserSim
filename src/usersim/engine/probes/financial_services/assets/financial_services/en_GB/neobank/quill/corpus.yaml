- id: 14f7f664-0947-5291-813b-6ff7a6dd9bd5
  title: Quill Instant Access Savings — current offer
  body: 'Boost your financial wellness with our current savings highlight. We are
    pleased to confirm that our headline rate for all new and existing savings pots
    is currently 3.75% AER.


    Offer Period:

    This rate is available for pots opened or funded between 1st January 2024 and
    31st March 2024.


    How to benefit:

    Simply create a new savings pot or move funds from your current account into an
    existing one to begin earning 3.75% AER immediately. There are no minimum deposit
    requirements to qualify for this rate, and no monthly fees are charged for maintaining
    your pots.


    Start growing your savings today and take a proactive step towards your financial
    goals.'
