- id: 1fad2b98-05ef-5266-941c-22bada14e01c
  title: Quill Instant Access Savings — limits, restrictions, and edge cases
  body: 'This document provides a detailed breakdown of the operational limits and
    constraints for Quill Instant Access Savings to assist support agents in resolving
    customer queries.


    Core Financials

    - Interest Rate: All balances in this product earn a flat interest rate of 3.75%
    AER.

    - FSCS Protection: Deposits are protected up to a maximum of £120,000 per person.


    Access and Liquidity

    - Withdrawal Limits: As an ''instant access'' product, there are no regulatory
    or contractual limits on the number of withdrawals a customer can make. Funds
    can be moved from a savings pot to the current account instantly.

    - Transfer Limits: While the savings product itself does not restrict withdrawals,
    any subsequent outgoing payment from the current account is subject to our standard
    daily payment limit of £10,000.


    Edge Cases and Restrictions

    - Minimum Balance: There is no minimum balance required to maintain the account
    or to earn the 3.75% AER interest rate.

    - Account Type: This is an app-only product. Customers cannot manage these savings
    pots via traditional paper-based instructions.

    - Joint Accounts: Savings pots are currently tied to the individual identity verified
    during the onboarding process; they cannot be converted into joint accounts.

    - Negative Balances: It is not possible to have a negative balance within a savings
    pot. Funds must be present in the pot to be withdrawn.


    If a customer exceeds the FSCS protection limit of £120,000, they should be advised
    that only amounts up to that threshold are guaranteed by the scheme.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: d91c7b65-840d-5c9f-97d6-535cc4174bea
  title: Quill Instant Access Savings — how-to / step-by-step
  body: 'How do I open a savings pot and start earning interest?

    To start saving, simply navigate to the savings section of the app and select
    ''Create New Pot''. Give your pot a name and transfer the amount you wish to save
    from your current account. Your funds will immediately begin earning interest
    at a rate of 3.75% AER.


    How do I move money back to my spending account?

    Open the specific savings pot you wish to withdraw from and select the ''Withdraw''
    option. Enter the amount you need and confirm the transfer. The funds are moved
    instantly back to your current account.


    Is there a limit to how much I can save?

    There is no maximum limit on how much you can deposit into your savings pots.
    However, please keep in mind that the FSCS protects eligible deposits up to £120,000
    per person.


    Can I set up automatic transfers into my savings?

    Yes, you can establish a recurring transfer from your current account to a specific
    pot to help grow your savings consistently at 3.75% AER.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 622b6eaf-507c-5b49-a088-8eb60eb7de9c
  title: Quill Instant Access Savings — check status or history
  body: 'Use this guide to view your current savings balance, track your interest
    earnings, and review your history of deposits and withdrawals.


    What you need before starting:

    - Your registered mobile device with the Quill app installed.

    - Successful biometric or multi-factor authentication to access your account.


    Steps to check your status and history:

    1. Open the Quill app and navigate to the ''Savings'' tab from the main dashboard.

    2. Select the specific savings pot you wish to inspect from your list of active
    pots.

    3. To see your current status, view the ''Current Balance'' displayed at the top
    of the pot screen. This reflects the total amount currently earning 3.75% AER.

    4. To view your history, scroll down to the ''Activity'' section. Here you will
    see a chronological list of every deposit and withdrawal made to that pot.

    5. To check interest earned, look for the ''Interest Credited'' entries in the
    activity list. These entries show the exact amount added to your balance based
    on the 3.75% AER.


    How you know it worked:

    You will see a detailed list of transactions with dates and amounts, and your
    total balance will be clearly displayed, ensuring you have a complete record of
    your financial growth within that pot.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: aef22b3d-399e-5184-ba77-84287886aef1
  title: Quill Instant Access Savings — a declined or blocked action
  body: 'Symptom: A customer attempts to move funds from a savings pot to their current
    account, or from a savings pot to an external account, and the action is declined
    or blocked.


    Likely Causes:

    - Verification Failure: The in-app biometric check failed or the session timed
    out during a state-changing action.

    - Payment Limits: If the customer is attempting to move funds out of the bank
    entirely, they may have hit the daily payment limit of £10,000.

    - Account Security Hold: A proactive security block may have been placed on the
    account due to unusual activity patterns.


    What to check in order:

    1. Verification: Ask the customer if they received a biometric prompt. If the
    prompt failed, suggest they restart the app and attempt the transfer again.

    2. Balance Check: Confirm that the savings pot contains sufficient funds for the
    requested withdrawal.

    3. Payment Limits: If the funds reached the current account but cannot be sent
    externally, check if the total outgoing transfers for the day have reached £10,000.


    How to fix:

    - For verification issues: Ensure the app is updated to the latest version and
    that biometric settings are enabled on the device.

    - For payment limits: Advise the customer that they must wait until the next calendar
    day for the £10,000 limit to reset.


    When to escalate:

    If the action is still blocked and no limit or verification error is apparent,
    we will escalate the query to our tiered specialist path. We will investigate
    if a security hold is in place and provide a resolution within the regulatory
    response timelines.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: f07533a0-97bf-528d-a62e-119298d019a1
  title: Quill Instant Access Savings — when to switch or upgrade
  body: 'This guide helps support agents advise customers on whether Quill Instant
    Access Savings is the right tool for their current needs or if they should consider
    other options.


    Quill Instant Access Savings (3.75% AER)

    - Best for: Users who want their money to grow but require the ability to withdraw
    funds instantly without penalty.

    - Key Trade-off: Provides high liquidity and a competitive 3.75% rate, but the
    rate is variable and may change based on market conditions.


    When to suggest a switch or addition:

    - If the customer requires more advanced banking features: While savings are great
    for growth, the customer may benefit from Quill Plus for a £7 monthly fee to access
    premium enhancements.

    - If the customer is keeping too much in a Current Account: If a customer has
    a large balance in their current account (which earns no interest), they should
    be encouraged to move those funds into a savings pot to start earning 3.75% AER
    immediately.

    - If the customer needs a loan: Savings pots cannot be used as collateral for
    overdrafts; they should be directed towards the standard Current Account for spending
    and credit needs.


    Summary: The 3.75% AER pot is the ideal choice for any funds not needed for immediate
    daily spending. It should be the default recommendation for any customer looking
    to improve their financial wellness without locking away their money.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 16f90f95-98be-5fbd-a8e2-28bf8d486a18
  title: Quill Instant Access Savings — comparison vs. alternatives and when not to
    choose it
  body: 'Choosing the right place for your money is essential for financial wellness.
    Quill Instant Access Savings is designed for those who value both growth and agility.


    How it compares to alternatives

    Compared to a standard current account, our savings pots offer a significant advantage
    by paying 3.75% AER on your balance, whereas current accounts are intended for
    spending rather than growth.


    Compared to fixed-term deposits (offered by other institutions), our product provides
    total flexibility. While some fixed-term accounts might offer a higher rate in
    exchange for locking your money away for years, Quill allows you to withdraw your
    funds at any time without any penalties or fees.


    When to choose Quill Instant Access Savings

    - You have an emergency fund that needs to be available instantly.

    - You are saving for a short-term goal and want your money to work for you at
    3.75% AER.

    - You want the security of FSCS protection up to £120,000 while maintaining full
    control over your cash.


    When NOT to choose this product

    - If you need a borrowing facility: This is a savings tool, not a credit tool.
    If you need an overdraft, you should use our current account.

    - If you are looking for professional investment advice: We provide financial
    education and a high-interest savings tool, but we do not offer individualised
    investment, legal, or tax advice.

    - If you require a guaranteed fixed rate for several years: Because our 3.75%
    AER is variable, it may change over time. If you absolutely require a rate that
    never fluctuates for a set period, a fixed-term product elsewhere may be more
    suitable.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: a8de91c0-3476-599c-84db-7b8d453cd609
  title: Quill Instant Access Savings — troubleshooting a problem
  body: 'Why does the interest credited to my pot look different from my manual calculations?

    Interest is calculated daily and credited periodically. The 3.75% AER (Annual
    Equivalent Rate) reflects the interest you would earn over a full year, including
    the effect of compounding. Small discrepancies are usually due to the timing of
    when interest is posted to the account.


    I tried to move money from my savings pot, but the app is lagging. What should
    I do?

    First, ensure you have a stable internet connection. If the app is unresponsive,
    please force-close and restart it. If the balance hasn''t updated, check your
    ''Activity'' list; the transfer may have already been processed. If the funds
    are missing from both the pot and the current account, contact us immediately
    via chat.


    Can I change the name of my savings pot after I have created it?

    Yes, you can rename your pots at any time within the pot settings to better organise
    your savings goals without affecting your 3.75% AER interest accumulation.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 0841161e-3e8f-5d51-9a26-6b77bce0b8f5
  title: Quill Instant Access Savings — resolve a common request end-to-end
  body: 'This guide outlines the process for closing a savings pot and transferring
    the remaining balance back to your main current account.


    What you need before starting:

    - Access to your Quill app.

    - A confirmed current account balance where the funds will be received.


    Steps to resolve the request:

    1. Open the app and go to the ''Savings'' section.

    2. Select the specific pot you wish to close.

    3. Scroll to the bottom of the pot details and select ''Close Pot''.

    4. The app will ask you to confirm the destination of the funds. Ensure ''Current
    Account'' is selected as the recipient.

    5. Review the final balance, including any accrued interest at the 3.75% AER rate,
    and confirm the closure.

    6. You will receive an instant confirmation message in the app stating that the
    pot has been closed and the funds have been transferred.


    How you know it worked:

    Navigate back to your main dashboard. You will see that the total balance of your
    current account has increased by the exact amount that was held in the closed
    savings pot. The pot will no longer appear in your list of active savings.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 6dded201-a353-58bb-ae8d-6c50c71e705f
  title: Quill Instant Access Savings — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that the balance shown in their savings pot does
    not match their own records or the amount they believe they should have earned
    in interest.


    Likely Causes:

    - Accrued vs. Posted Interest: The customer may be seeing the balance before the
    latest interest payment has been posted, even though it has been accruing at 3.75%
    AER.

    - Pending Transfers: A recent transfer from the current account may still be processing
    and not yet reflected in the total balance.

    - Misinterpretation of AER: The customer may be calculating simple interest rather
    than the compound interest reflected in the Annual Equivalent Rate.


    What to check in order:

    1. Review Activity: Check the ''Activity'' log for the pot to see if any interest
    credits were missed in the customer''s manual calculation.

    2. Verify Transfer Dates: Check for any ''Pending'' transactions in the current
    account that were destined for the savings pot.

    3. Confirm AER Calculation: Ensure the customer understands that 3.75% AER is
    the yearly rate, not a monthly payout.


    How to fix:

    - If it is a timing issue: Explain that interest is calculated daily and will
    be posted according to our standard schedule. Provide the date of the next expected
    credit.

    - If it is a calculation error: Gently explain the difference between a nominal
    rate and the AER to help the customer align their records with ours.


    When to escalate:

    If a transaction is clearly missing from the activity log despite being debited
    from the current account, or if the interest credit is mathematically incorrect
    based on the 3.75% AER, we will escalate this to our specialist accounting team.
    We will conduct a full audit of the pot''s history and provide a final response
    within the regulatory timeline.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b48ec595-62be-5662-8284-2f1a80a02868
  title: Quill Debit Card — overview
  body: 'The Quill Debit Card is designed for the digitally native consumer who needs
    a global payment tool that is as agile as their lifestyle. It serves as the primary
    physical and digital interface for spending and managing your funds, providing
    a frictionless experience whether you are shopping at a local market or travelling
    across the globe.


    We have built this card to remove the hidden costs often associated with traditional
    banking. One of the most significant benefits is our commitment to transparency
    regarding international spend: we charge a 0% foreign transaction fee. This means
    you can spend in different currencies without worrying about unexpected surcharges
    appearing on your statement.


    For those who need cash while abroad, we provide a generous fee-free ATM allowance
    of £200 every month. This allows you to access local currency from automated teller
    machines without Quill charging a fee. If your monthly withdrawals exceed this
    £200 limit, we apply a straightforward fee of 3% on the remaining amount withdrawn.
    This structure ensures that essential travel cash is accessible and affordable
    while maintaining a fair cost model for higher-volume usage.


    Security is at the heart of the Quill experience. Your card is fully integrated
    with our app-first security suite, allowing you to exercise instant card control—such
    as freezing and unfreezing the card—directly from your device. This is complemented
    by our rigorous identity verification and multi-factor authentication processes
    to ensure your money remains secure.


    The Quill Debit Card works in tandem with our other core offerings to provide
    a comprehensive financial wellness ecosystem. To learn more about the account
    that powers your card, we recommend reviewing the Quill Current Account — overview.'
  domain: cards
  product_category: debit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: d0aa2477-c553-5046-a4cd-1a76faf0c412
  title: Quill Debit Card — non-sterling transaction fee explained
  body: 'How does Quill handle payments made in currencies other than British Pounds
    (GBP)?


    We believe that accessing your money globally should be simple and fair. When
    you use your Quill Debit Card to make a purchase in a foreign currency, we apply
    a 0% foreign transaction fee. This means we do not add an additional percentage-based
    surcharge to the exchange rate for the convenience of spending abroad.


    Does this 0% fee apply to ATM withdrawals too?


    While the 0% foreign transaction fee applies to all point-of-sale purchases, ATM
    withdrawals abroad are handled via our monthly allowance. You can withdraw up
    to £200 each month from ATMs abroad without paying a Quill fee. If you exceed
    this £200 monthly allowance, a fee of 3% will be applied to any further withdrawals.


    For a complete breakdown of all associated costs, you can refer to the Quill Debit
    Card — fee schedule.'
  domain: cards
  product_category: debit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: f6d70ea0-88c6-537a-a1ba-4afd67990714
  title: Quill Debit Card — set up and activate
  body: 'Activating your Quill Debit Card is a straightforward process designed to
    get you spending securely as quickly as possible. Before you begin, ensure you
    have completed your initial identity verification during the account opening process
    and that you have your physical card in hand.


    Follow these steps to activate your card:


    1. Provide the card activation request: Let us know that your card has arrived
    and that you are ready to activate it. We will then prompt you for the specific
    card details required to link the physical plastic to your digital account.


    2. Share the card identifiers: Provide the unique card number and the security
    code found on the back of your card. We use this information to ensure the card
    being activated is the one specifically issued to your identity.


    3. Complete the biometric check: To maintain our high security standards, we will
    ask you to perform an in-app biometric verification (such as a fingerprint or
    facial scan). This ensures that the person activating the card is the verified
    account holder.


    4. Confirm the activation: Once the biometric check is successful, we will send
    you a confirmation message in the app stating that your card is now active and
    ready for use.


    Once activated, your card is immediately ready for both physical point-of-sale
    transactions and online spending. You will now have access to our core benefits,
    including the 0% foreign transaction fee and the £200 monthly fee-free ATM allowance
    abroad. If you are new to our ecosystem, you can find more information on the
    core features in the Quill Debit Card — overview.'
  domain: cards
  product_category: debit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: d3d9f0fb-79ef-5488-984a-d2a72f6c865f
  title: Quill Debit Card — fee schedule
  body: 'This schedule outlines the fees associated with the use of the Quill Debit
    Card. We maintain a transparent pricing model to ensure there are no hidden costs
    for our customers.


    - Foreign Transaction Fee: 0%

    - Monthly ATM Withdrawal Allowance (Abroad): £200

    - ATM Withdrawal Fee (Above Monthly Allowance): 3%


    All fees are applied in real-time to the linked account. For information regarding
    the regulatory framework and our commitment to fair outcomes under the Consumer
    Duty, please refer to the Quill Debit Card — regulatory disclosures.'
  domain: cards
  product_category: debit_card
