- id: f39aa3c5-70b4-586c-b02e-8e1abd7a8370
  title: Quill Current Account — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the formal closure of an account.
    Whether you are switching to another provider or simply no longer need the service,
    we ensure the process is clear and fair.


    **Prerequisites**

    - Your account balance must be £0. If you have remaining funds, you must transfer
    them to another account first.

    - Any pending transactions must be fully processed (settled).

    - You must have access to your registered email address for final confirmation.


    **Step-by-Step Instructions**

    1. Tell us through the in-app chat or via email that you wish to close your Quill
    Current Account.

    2. We will ask you to confirm that your balance is £0 and that there are no outstanding
    payments or pending transactions.

    3. We will then perform a final identity verification check using your in-app
    biometrics or MFA to ensure the request is legitimate.

    4. Once verified, we will initiate the closure process. You will receive an immediate
    confirmation in the chat stating that the closure request has been submitted.

    5. Within one business day, we will send a formal closure notification to your
    registered email address, confirming that the account is closed and no further
    fees (though the account fee is £0) or interests will accrue.


    **How you know it worked**

    The process is complete when you receive the final confirmation email and can
    no longer log into the account dashboard via the app.


    If you are closing your account specifically to move to another bank, you might
    find it easier to use the Current Account Switch Service, as detailed in Quill
    Current Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
