  institution_id: quill
- id: 37c6fb9a-e0c0-5e82-8c1b-c8f60a825cbd
  title: Quill Current Account — set up and activate
  body: 'Setting up your Quill Current Account is a streamlined, digital-first process.
    To ensure the highest security standards, we require rigorous identity verification
    before your account is activated.


    Before you begin, please ensure you have a valid government-issued photo ID and
    a smartphone capable of performing biometric checks.


    1. Provide your personal details: Tell us your full legal name, date of birth,
    residential address, and contact information. We will use these details to initiate
    the identity verification process.


    2. Submit your identification: Provide a clear photograph of your government-issued
    ID. We will verify the authenticity of the document against official databases.


    3. Complete the biometric check: Perform the in-app biometric scan as prompted.
    This ensures that the person opening the account matches the identification provided.


    4. Confirm account preferences: We will present the account terms, including the
    £0 monthly account fee. Review these details and confirm your agreement to the
    terms and conditions.


    5. Await activation confirmation: Once our verification team has approved your
    documents and biometric data, we will send you a notification confirming that
    your account is active.


    6. Access your account: You can now log in using your secured credentials and
    multi-factor authentication to begin managing your money. Your virtual account
    details will be available immediately, and your physical Quill Debit Card will
    be dispatched to your registered address.


    Your setup is successful when you can view your account balance of £0 (or your
    initial deposit) and access the main dashboard of the application. For more information
    on managing your new account, see the Quill Current Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
