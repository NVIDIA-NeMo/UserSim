- id: 157551d5-ca3c-565f-b957-4bfc7806e9d4
  title: Quill Debit Card — who it is best for and common use cases
  body: 'The Quill Debit Card is a global payment tool specifically engineered for
    the modern, digitally native consumer. It is best suited for individuals who value
    agility and transparency, particularly those who travel frequently or interact
    with international services.


    Common use cases include:


    1. The Global Traveller: Because we offer a 0% foreign transaction fee, the card
    is ideal for spending in various currencies without the hidden costs associated
    with traditional banking. Whether you are dining in Tokyo or shopping in New York,
    you pay the exchange rate without an added Quill surcharge.


    2. The Occasional Cash User: For those who primarily spend digitally but occasionally
    need local currency, our monthly fee-free ATM allowance of £200 provides ample
    flexibility for small withdrawals abroad without incurring costs.


    3. The Security-Conscious Spender: With instant card control and biometric verification,
    this card is perfect for users who want to manage their security in real-time
    via an app.


    While the card is highly versatile, it is most effective when paired with our
    core account. It provides the essential bridge between your digital balance and
    the physical world, ensuring that your spending is fair and your fees are transparent.
    If you find yourself withdrawing more than £200 in cash abroad per month, you
    should be aware that a fee of 3% applies to any amount above that threshold.


    For a complete list of features and account requirements, refer to Quill Debit
    Card — overview.'
  domain: cards
  product_category: debit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 869817b8-603c-5c3c-ac1e-d093a077b71c
  title: Quill Debit Card — fee-free cash withdrawals abroad each month explained
  body: 'Q: How does the fee-free ATM allowance for overseas withdrawals work?


    A: We provide every Quill Debit Card holder with a monthly allowance of £200 that
    can be used for cash withdrawals at ATMs abroad without any fee from us. This
    allowance resets at the start of every calendar month.


    Q: What happens if I withdraw more than £200 in a month?


    A: Once you have reached the £200 limit, any further ATM withdrawals made abroad
    within that same month will incur a fee of 3% of the transaction amount. This
    fee is applied automatically to the excess amount.


    Q: Does this allowance apply to withdrawals made within the UK?


    A: The £200 allowance specifically covers withdrawals made abroad. For a full
    breakdown of our costs, please see Quill Debit Card — fee schedule.'
  domain: cards
  product_category: debit_card
  document_type: faq
  source_authority: official
