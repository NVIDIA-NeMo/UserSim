- id: 6dfcf755-76f6-5945-9c35-1f1c314a0a91
  title: Quill Current Account — make a change or update
  body: 'Updating your account details is a straightforward process handled entirely
    within our secure environment. Follow these steps to make changes to your profile
    or preferences.


    What you need before starting:

    - Access to your registered device with biometric authentication enabled.

    - The updated information you wish to provide (e.g., a new residential address
    or updated contact email).


    Steps to update your account:

    1. Tell us which specific detail you wish to update (for example, your home address
    or phone number).

    2. We will prompt you to perform a biometric check via the app to verify your
    identity. This is a mandatory security step for any state-changing action.

    3. Provide the new information. If you are updating a residential address, we
    may ask you to provide a digital copy of a recent utility bill or council tax
    statement for verification.

    4. We will review the submitted information. Once verified, we will send a confirmation
    notification to your app and registered email address.


    How you know it worked:

    - You will receive an in-app confirmation message stating that your account details
    have been successfully updated.

    - The changes will be reflected immediately in your profile settings within the
    app.


    If you need to change your overall plan or move to a premium tier, please refer
    to Quill Current Account — choosing between tiers or options.'
