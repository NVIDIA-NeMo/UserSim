- id: 3173f364-eb0c-5cd6-8070-151732498f53
  title: Quill Plus — resolve a common request end-to-end
  body: "One of the most common requests we handle is the upgrade from a standard\
    \ current account to Quill Plus. This guide outlines the end-to-end process to\
    \ ensure you understand the costs and commitments involved.\n\n**What you need\
    \ before starting**\nAn active Quill current account and a sufficient balance\
    \ to cover the first monthly fee.\n\n**Steps to upgrade to Quill Plus**\n1. Tell\
    \ us that you would like to upgrade your account to Quill Plus.\n2. We will explain\
    \ the key terms of the subscription: a monthly fee of £7 and a minimum term of\
    \ 3 months. You must explicitly confirm that you accept these terms to proceed.\n\
    3. Once you confirm, we will apply the upgrade to your account. This action is\
    \ immediate.\n4. We will confirm that the upgrade is successful and that your\
    \ premium features are now active. \n5. We will notify you of the date the first\
    \ £7 fee will be debited from your account.\n\n**How you know it worked**\nYour\
    \ account status in the app will change from 'Standard' to 'Plus', and you will\
    \ have immediate access to all value-added services. You will also see a confirmation\
    \ message in your chat history detailing the £7 fee and the 3-month commitment.\n\
    \nIf you are still deciding whether this is the right move for you, you may wish\
    \ to consult Quill Plus — comparison vs. alternatives and when not to choose it."
