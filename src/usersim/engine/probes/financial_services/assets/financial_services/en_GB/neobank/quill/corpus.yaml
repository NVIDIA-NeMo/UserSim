- id: 12e27647-9cd7-57db-bfe1-ffe05b2e2148
  title: Quill Instant Access Savings — choosing between tiers or options
  body: "When deciding how to manage your money at Quill, you may be choosing between\
    \ keeping funds in your core account or moving them into a savings pot. \n\nQuill\
    \ Instant Access Savings\n- Interest: Earns 3.75% AER.\n- Access: Instant; funds\
    \ can be moved back to the current account immediately.\n- Best For: Short-to-medium\
    \ term goals, emergency funds, and users who want their money to grow without\
    \ locking it away.\n\nQuill Current Account\n- Interest: 0% (unless otherwise\
    \ stated in rate sheets).\n- Monthly Fee: £0.\n- Best For: Daily spending, receiving\
    \ payments, and managing immediate expenses.\n\nIf you value high-yield growth\
    \ while maintaining total agility, the Quill Instant Access Savings pot is the\
    \ superior choice. For those who require the absolute highest level of app-based\
    \ utility and additional value-added services, combining these savings pots with\
    \ a Quill Plus subscription (£7 monthly fee) provides the most comprehensive experience.\
    \ Both options ensure your deposits are protected by the FSCS up to £120,000."
