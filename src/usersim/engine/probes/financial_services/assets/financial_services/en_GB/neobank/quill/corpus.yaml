- id: 8edd6bcb-79b5-5f20-86be-8740de1180e0
  title: Quill Plus — choosing between tiers or options
  body: 'Choosing the right account depends on your financial habits and the level
    of service you require. Here is how our two primary tiers compare:


    Quill Current Account

    - Monthly Fee: £0

    - Commitment: No minimum term

    - Best For: Those who want essential, frictionless banking without a monthly cost.


    Quill Plus

    - Monthly Fee: £7

    - Commitment: 3-month minimum term

    - Best For: Digitally native users who want premium enhancements and additional
    value-added services.


    If you value the absolute lowest cost, the standard account is the better choice.
    However, if you want the full suite of Quill''s premium tools and are happy to
    commit to a 3-month minimum term for a £7 monthly fee, Quill Plus is the ideal
    option. You can upgrade at any time via the app.'
  domain: retail_banking
