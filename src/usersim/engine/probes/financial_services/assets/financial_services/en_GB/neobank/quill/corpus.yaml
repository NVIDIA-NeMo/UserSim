- id: 3111d90d-f545-5ae7-8380-b3d7be5bf895
  title: Quill Current Account — change-of-terms policy
  body: 'This policy outlines how we manage changes to the terms and conditions governing
    the Quill Current Account. We are committed to transparency and ensuring that
    any modifications to our service are communicated clearly and in advance.


    We reserve the right to amend the terms of your account, including changes to
    the monthly account fee of £0 or the arranged overdraft rate of 29%. Any such
    changes will be made in accordance with the Consumer Duty to ensure fair outcomes
    for all customers.


    Notification of Changes: We will provide you with clear, concise notice of any
    material changes to your terms via in-app notification and email. This notice
    will include the nature of the change, the reason for it, and the date it will
    take effect. We typically provide a minimum notice period of 30 days before a
    change to fees or interest rates is implemented.


    Your Options: If you do not agree to the updated terms, you have the right to
    close your account without penalty before the changes take effect. We ensure that
    our processes for closing accounts are straightforward and frictionless.


    Regulatory Alignment: All changes are conducted under the strict supervision of
    the FCA and PRA. Our commitment to a fair fee structure remains central to our
    positioning, ensuring that the Quill Current Account continues to provide an accessible
    entry point for our users.


    For a full overview of our current agreement, please refer to Quill Current Account
    — account agreement.'
