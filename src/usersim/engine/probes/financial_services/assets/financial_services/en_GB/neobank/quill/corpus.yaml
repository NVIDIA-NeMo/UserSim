- id: 3fdfb364-5f4f-5c52-b0ea-b5d429e23d79
  title: Quill Plus — account security best practices
  body: 'Maintaining the security of your Quill Plus account is a shared responsibility.
    Because our premium tier provides enhanced features and agility, it is vital that
    you employ the highest standards of account protection to prevent unauthorised
    access.


    We employ rigorous identity verification and multi-factor authentication (MFA)
    to safeguard your funds. To keep your account secure, we strongly recommend that
    you exclusively use in-app biometric checks—such as fingerprint or facial recognition—whenever
    prompted for state-changing actions or payments. This ensures that only you can
    authorise transactions or modify your subscription settings.


    Be aware of the following security imperatives:


    1. We will never ask you for your full password, PIN, or biometric data over the
    phone or via email. Any request for this information should be treated as a fraud
    attempt.


    2. Ensure your app is updated to the latest version. Security patches are critical
    for maintaining the integrity of our encrypted communication channels.


    3. Monitor your transactions regularly. If you notice any activity that seems
    unusual, use the instant card control features in the app to freeze your card
    immediately.


    If you suspect your account has been compromised, notify us via our 24/7 in-app
    chat immediately. Prompt reporting is essential for the rapid resolution of disputes.
    Remember that eligible deposits in your account are protected by the FSCS up to
    £120,000 per person, per institution, providing you with a robust layer of regulatory
    security. For further guidance on identifying threats, please refer to Quill Plus
    — recognising scams targeting this product.'
  domain: retail_banking
  product_category: quill_plus
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 30bc1f48-42e3-5133-8883-092c0f48c3cc
  title: Quill Plus — change-of-terms policy
  body: 'This policy outlines how we manage changes to the terms and conditions governing
    the Quill Plus subscription. We are committed to transparency and fairness, adhering
    to the Consumer Duty to ensure outcomes are always clear and not misleading.


    Fees and Obligations

    Quill Plus is provided as a premium subscription service with a monthly fee of
    £7. By activating this service, you agree to a minimum term of 3 months. This
    minimum term is a binding commitment; should you wish to downgrade to a standard
    account before this period expires, you remain liable for the monthly fees for
    the duration of the 3 months.


    Notification of Changes

    We reserve the right to amend the fees, features, or terms of the Quill Plus product.
    We will provide you with a minimum of 30 days'' notice before any change to the
    £7 monthly fee or the 3-month minimum term takes effect. This notice will be delivered
    via in-app notification and email.


    Your Rights Following a Change

    If you do not agree to the updated terms provided in the notice, you have the
    right to cancel your Quill Plus subscription. If you are still within your initial
    3-month minimum term, the cancellation will take effect at the end of that term,
    unless the change is so fundamental that we allow an earlier exit.


    Termination

    After the 3-month minimum term has elapsed, you may cancel the subscription at
    any time. The subscription will terminate at the end of the current billing cycle.
    For a comparison of how this differs from our basic offering, see Quill Plus —
    choosing between tiers or options.'
  domain: retail_banking
  product_category: quill_plus
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 6d2428f1-21e5-5009-a2f8-5e33bde1a548
  title: Quill Plus — getting started walkthrough
  body: 'This guide provides the internal walkthrough for agents assisting customers
    who wish to upgrade their standard account to Quill Plus. Ensure the customer
    has a fully verified current account before proceeding.


    Walkthrough Steps:


    1. Activation Request: The customer must initiate the upgrade within the app or
    request it via chat. Confirm that the customer understands the monthly fee is
    £7.


    2. Term Acknowledgement: The agent must ensure the customer explicitly acknowledges
    the minimum term of 3 months. If the customer is hesitant about the commitment,
    explain that this term ensures the stability of the value-added services provided
    in the premium tier.


    3. Identity Verification: Before applying the upgrade, a biometric check or MFA
    prompt must be completed within the app. This is a mandatory security step for
    any state-changing action.


    4. Billing Confirmation: Once verified, the system will apply the £7 charge to
    the account. Confirm with the customer that the first payment has been processed
    or scheduled.


    5. Feature Access: Once the subscription is active, the customer will gain immediate
    access to premium enhancements. The agent should confirm that the customer can
    now see the Quill Plus branding and expanded feature set in their app interface.


    If the customer encounters an error during the biometric check, refer to Quill
    Plus — access or login problems. For information on who is eligible for this tier,
    consult Quill Plus — qualification tiers.'
  domain: retail_banking
  product_category: quill_plus
  document_type: product_sheet
  source_authority: official
