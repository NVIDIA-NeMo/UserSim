- id: 1d6d22e2-7013-54e3-b480-c770a6249464
  title: Quill Payments — risk disclosures
  body: 'This document provides formal regulatory disclosures regarding the use of
    Quill Payments. All services are provided under the supervision of the FCA and
    PRA.


    Payment Risks: Users should be aware that Faster Payments are processed almost
    instantaneously. Once a payment is authorised and sent, it is generally irrevocable.
    While we employ Confirmation of Payee to help you verify the recipient, the ultimate
    responsibility for ensuring the correct account details are used rests with the
    sender.


    Limit Restrictions: To protect customers and the institution from fraudulent activity
    and systemic risk, we enforce a daily limit of £10,000 on outgoing transfers.
    This limit is non-negotiable for standard account operations but can be reviewed
    by specialists for exceptional circumstances.


    Fraud Protection: In alignment with the Consumer Duty, we strive to ensure fair
    outcomes. We provide reimbursement for Authorised Push Payment (APP) scams up
    to £85,000. This reimbursement is subject to an internal investigation to verify
    that the customer acted in good faith and was the victim of a scam.


    Regulatory Timelines: For any disputes arising from payment services, we commit
    to a transparent and rapid resolution process, with a final response provided
    within 15 business days.


    For more information on how your deposits are protected, please refer to Quill
    Current Account — regulatory disclosures, which details FSCS protection up to
    £120,000.'
  domain: payments
  product_category: payments
  document_type: disclosure
  source_authority: official
