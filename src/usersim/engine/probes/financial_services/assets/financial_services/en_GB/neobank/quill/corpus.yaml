- id: ade6f842-00f9-5c65-aa59-10ad57dcf595
  title: Quill Instant Access Savings — make a change or update
  body: 'If you need to update the details of your savings pots, such as changing
    a name or adjusting a savings goal, follow these steps to complete the process
    through our support channels.


    Before you start: Ensure you have your app open and are logged in, as we may require
    a biometric check to verify your identity for this change.


    1. Identify the Pot: Tell us the current name of the savings pot you wish to update.

    2. Specify the Change: Provide the new name for the pot or the new target balance
    you wish to set for your savings goal.

    3. Identity Verification: We will trigger an in-app biometric check. Complete
    this check in your app to confirm you are the account holder.

    4. Confirmation: Once verified, we will apply the update to your account. You
    will receive a confirmation message in the chat and a push notification once the
    change is live.


    You will know the process was successful when the updated name or goal is reflected
    in your ''Savings'' dashboard. Your balance will continue to earn 3.75% AER regardless
    of the pot''s name or goal.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 33a19d41-c7c3-5487-bd45-6abb635873db
  title: Quill Instant Access Savings — access or login problems
  body: 'If you are having trouble accessing your Quill Instant Access Savings pots
    or cannot log in to the app to manage your funds, please follow these steps.


    Symptom: ''I cannot see my savings pots'' or ''The app is not letting me log in
    to view my 3.75% AER balance''.


    Likely Causes:

    - Outdated app version.

    - Biometric authentication failure.

    - Temporary account lock due to multiple failed verification attempts.


    What to check and do:

    1. App Version: Ensure you are using the latest version of the Quill app. If an
    update is available, please install it first.

    2. Biometric Reset: If your fingerprint or face scan is failing, try logging in
    using your backup security method (MFA).

    3. Identity Re-verification: If you are locked out, tell us you need to re-verify
    your identity. We will guide you through a secure identity check using our standard
    verification protocols.


    Resolution and Escalation:

    Most access issues are resolved immediately during the conversation once the biometric
    check is passed. If the problem persists, we will escalate your case to our tiered
    specialist path. We will raise a technical ticket and notify you via email as
    soon as the access is restored. You can expect a resolution within 15 business
    days for complex account access disputes, though most are fixed much faster.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
