    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Account Status | Must hold an active Quill Current Account | Eligible to initiate
    payments |

    | Identity Verification | Completion of mandatory KYC and biometric setup | Able
    to authenticate transfers |

    | Account Standing | No active fraud freezes or restrictive blocks | Full access
    to payment tools |

    | Geographic Eligibility | Resident in a supported jurisdiction | Able to use
    UK Faster Payments |


    Users who do not meet these criteria will find the payment options disabled within
    the app. For more on how to get your account started, please refer to Quill Current
