- id: 4d8db334-3771-5684-ad9a-ec410603106c
  title: Quill Debit Card — getting started walkthrough
  body: "Use this guide to walk customers through the onboarding and activation process\
    \ for the Quill Debit Card. Ensure the customer has their mobile device ready\
    \ and has already opened a Quill account.\n\n1. Identity Verification: Before\
    \ a card can be issued, the customer must complete rigorous identity verification.\
    \ This involves a multi-factor authentication check and an in-app biometric scan.\
    \ If the customer is struggling with this, remind them that this is a mandatory\
    \ security requirement to protect their account.\n\n2. Card Ordering: Once verified,\
    \ the customer can request their physical Quill Debit Card via the 'Cards' section\
    \ of the app. Confirm with the customer that their delivery address is current.\
    \ \n\n3. Activation: Upon receiving the card, the customer must activate it through\
    \ the app. This step links the physical plastic to their digital account and enables\
    \ spending.\n\n4. Explaining the Value Proposition: As the customer begins using\
    \ the card, highlight the following key financial benefits to ensure they understand\
    \ the value of the product:\n\n- Global Spending: Explain that they will be charged\
    \ 0% foreign transaction fees when spending in currencies other than GBP.\n- Cash\
    \ Withdrawals: Clarify that they have a fee-free ATM allowance of £200 every month\
    \ for withdrawals made abroad.\n- Excess Withdrawals: Be transparent that any\
    \ cash withdrawals abroad exceeding the £200 monthly limit will incur a fee of\
    \ 3%.\n\n5. Security Setup: Encourage the customer to explore the instant card\
    \ control features, such as the ability to freeze and unfreeze the card instantly,\
    \ and the option to set up gambling blocks if desired.\n\nFor more information\
    \ on account requirements, refer to Quill Debit Card — eligibility requirements."
  domain: cards
  product_category: debit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 3ef5f06c-ce12-5726-95a4-fd930071275e
  title: Quill Debit Card — fee on cash withdrawals abroad above the monthly allowance
    explained
  body: 'Q: How does the fee for withdrawing cash abroad work with my Quill Debit
    Card?


    A: We provide a generous fee-free ATM allowance of £200 every month for cash withdrawals
    made abroad. As long as your total monthly withdrawals in foreign currencies stay
    within this £200 limit, we charge no fee.


    Q: What happens if I withdraw more than £200 in a single month?


    A: Once you exceed your £200 monthly allowance, a fee of 3% is applied to the
    remaining amount of your cash withdrawals abroad for that month. This allowance
    resets at the start of every calendar month.


    Q: Does this 3% fee apply to all foreign spending?


    A: No. This fee only applies to ATM cash withdrawals. For all other purchases
    and transactions made abroad, we maintain a 0% foreign transaction fee, ensuring
    your everyday spending remains frictionless. For a full breakdown of costs, see
    Quill Debit Card — fee schedule.'
  domain: cards
  product_category: debit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: cf646d77-c21d-5a6c-b274-1d9a78526ab0
  title: Quill Debit Card — make a change or update
  body: 'Whether you have moved house or need to update your card security settings,
    we make it simple to manage your Quill Debit Card details directly through our
    support channels.


    To update your card delivery address or request a replacement card:

    1. Tell us that you need to update your address or order a new card.

    2. We will ask you to complete a biometric check in the app to verify your identity.

    3. Provide the new address or confirm the replacement request.

    4. We will confirm when the request is processed and provide an estimated delivery
    date for your new card.


    To update your card security settings (such as spending limits or gambling blocks):

    1. Tell us which specific security feature you wish to change.

    2. We will guide you through a multi-factor authentication process to ensure the
    request is authorised.

    3. Confirm the new limit or the activation/deactivation of the block.

    4. We will immediately update your account and send a confirmation notification
    to your app.


    To change your card PIN:

    1. Tell us you would like to reset your PIN.

    2. We will perform a rigorous identity verification check using your app''s biometric
    security.

    3. We will then provide you with a secure method to set your new PIN.

    4. You will receive a confirmation once the PIN has been successfully updated.


    For more information on managing your overall account, see Quill Current Account
    — make a change or update.'
  domain: cards
  product_category: debit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 6da14725-e36d-5b03-a105-21b9287d4c3a
  title: Quill Debit Card — access or login problems
  body: 'If you are unable to access your card management features or login to the
    Quill app, we are here to help you resolve the issue quickly. Unlike traditional
    banks with opaque processes, we provide a direct path to resolution.


    Symptom: ''I cannot log in to the app to manage my Quill Debit Card.''


    Likely Causes:

    - Biometric authentication failure (e.g., outdated fingerprint or facial recognition
    data).

    - Account lock due to multiple incorrect PIN or password attempts.

    - Outdated app version preventing secure connection to our servers.


    Steps to resolve:

    1. Check Biometrics: Ensure your device''s biometric sensors are clean and that
    you are using the most recent version of the app. Try restarting the app to trigger
    a fresh authentication request.

    2. Verify Identity: If you are locked out, tell us you are having login issues.
    We will initiate a manual identity verification process, which may involve multi-factor
    authentication and a secure identity check.

    3. Update Software: Ensure your mobile operating system is up to date, as our
    high security standards require current encryption protocols.


    When to escalate:

    If you have completed the biometric and manual identity checks but still cannot
    access your account, we will escalate your case to our tiered specialist path.
    This ensures that complex technical or compliance issues are handled by the right
    experts. You can expect a response and a resolution path within the timelines
    required by the FCA and PRA to ensure fair customer outcomes.


    For issues regarding specific failed transactions rather than login problems,
    please see Quill Debit Card — a failed or pending action.'
  domain: cards
  product_category: debit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 3120784e-be3c-5b74-91a2-6a0bc0a9ca99
  title: Quill Debit Card — qualification tiers
  body: 'Use this matrix to determine if a customer is eligible for the Quill Debit
    Card. All customers must meet the baseline identity requirements regardless of
    their account tier.


    | Requirement | Standard Eligibility | Premium Eligibility (Quill Plus) |

    | :--- | :--- | :--- |

    | Base Account | Must hold an active `current_account` | Must hold an active `current_account`
    |

    | Identity Verification | Mandatory biometric & MFA check | Mandatory biometric
    & MFA check |

    | Residency | Digitally native / Eligible region | Digitally native / Eligible
    region |

    | Monthly Fee | £0 (included with account) | £7 (as part of subscription) |

    | Card Features | 0% foreign transaction fees; £200 ATM allowance | 0% foreign
    transaction fees; £200 ATM allowance + Plus benefits |


    All qualified users receive the same core card functionality. The primary difference
    in qualification is whether the customer is on the standard free tier or the Quill
    Plus premium tier. For a detailed look at the premium offering, refer to Quill
    Plus — overview.'
  domain: cards
  product_category: debit_card
