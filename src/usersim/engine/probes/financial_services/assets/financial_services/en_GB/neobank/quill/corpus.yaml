- id: 31938a34-c9b5-5e93-9577-a826808f9a9f
  title: Quill Debit Card — fraud and unauthorised-activity protection
  body: 'At Quill, we prioritise the security of your funds and the integrity of your
    account. The Quill Debit Card is designed with proactive security features to
    protect you against unauthorised activity, but we encourage all our customers
    to remain vigilant against evolving fraud patterns.


    A common threat targeting digitally native users is the Authorised Push Payment
    (APP) scam, where you may be tricked into voluntarily transferring money to a
    fraudster. We are committed to protecting our customers in these instances, providing
    reimbursement for APP scams up to £85,000.


    To keep your account secure, please remember that we will never ask you for your
    full PIN, your password, or to move your money to a ''safe account'' via a phone
    call or email. Any request to do so is a clear sign of fraud. We employ rigorous
    identity verification, multi-factor authentication, and in-app biometric checks
    to ensure that only you can authorise state-changing actions on your account.


    If you notice a transaction you did not authorise, or if your card has been lost
    or stolen, the first and most critical action is to use the instant card control
    feature in the app to freeze your card immediately. This prevents any further
    unauthorised spend while we investigate the activity. Once the card is frozen,
    you should report the incident to us through our 24/7 in-app chat or email support.


    We prioritise the rapid resolution of all payment disputes, aiming to provide
    final responses for payment services within 15 business days. By combining our
    proactive security blocks with your vigilance, we can maintain a secure banking
    environment. For more information on general account safety, you may wish to review
    Quill Debit Card — overview.'
  domain: cards
  product_category: debit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: f97561a5-3233-522b-840d-d14e5c033776
  title: Quill Debit Card — account agreement
  body: 'This agreement outlines the terms and conditions governing the use of the
    Quill Debit Card. By activating and using your card, you agree to be bound by
    these terms.


    Our commitment is to provide a frictionless spending experience. We provide a
    0% foreign transaction fee on all purchases made in currencies other than Sterling.
    This means we do not add a percentage-based surcharge to the exchange rate when
    you spend abroad.


    Regarding cash access, we provide a monthly fee-free ATM allowance of £200 for
    withdrawals made abroad. Once this £200 limit is exceeded within a single calendar
    month, a fee of 3% will be applied to the value of any further overseas ATM withdrawals.
    This fee is calculated and deducted from your account balance at the time of the
    transaction.


    Your obligations as a cardholder include maintaining the confidentiality of your
    security credentials and notifying us immediately if your card is compromised.
    We reserve the right to suspend card functionality if we detect suspicious activity
    or if there is a breach of our security protocols.


    This agreement is subject to the regulations of the FCA and PRA. We adhere to
    the Consumer Duty to ensure fair outcomes for all customers. Any changes to these
    terms, including adjustments to the ATM allowance or associated fees, will be
    communicated to you via the app with a clear notice period before they take effect.


    This agreement ends when you close your associated current account or if we terminate
    the card facility due to a breach of terms. For details on how to end this agreement,
    please see Quill Debit Card — cancel, close, or downgrade.'
  domain: cards
  product_category: debit_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
