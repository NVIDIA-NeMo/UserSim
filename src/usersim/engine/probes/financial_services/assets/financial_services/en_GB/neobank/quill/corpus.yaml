- id: c60e04c6-26cb-508c-903c-8b16a682948f
  title: Quill Payments — vs. a similar product here
  body: 'When comparing Quill Payments to traditional high-street banking payment
    services, the primary differences lie in cost, speed, and user experience.


    **Quill Payments**

    - **Cost:** We charge a flat fee of £0 for Faster Payments.

    - **Limits:** A clear, consistent daily limit of £10,000.

    - **Experience:** App-first, requiring biometric authentication for every state-changing
    action.

    - **Security:** Integrated Confirmation of Payee as standard.


    **Traditional Bank Payments**

    - **Cost:** May charge fees for certain types of transfers or require a paid monthly
    account tier to waive fees.

    - **Limits:** Often have variable limits that may require a phone call or branch
    visit to increase.

    - **Experience:** Often rely on legacy systems with slower interfaces or external
    portals.


    **Who it suits**

    Quill Payments is the superior choice for digitally native consumers who value
    transparency and want to avoid paying for essential services. A traditional provider
    might be better only for those who require manual, branch-based payment interventions
    or transfers exceeding our £10,000 daily limit. For the core experience, refer
    to Quill Current Account — overview.'
  domain: payments
  product_category: payments
  document_type: comparison
  source_authority: official
