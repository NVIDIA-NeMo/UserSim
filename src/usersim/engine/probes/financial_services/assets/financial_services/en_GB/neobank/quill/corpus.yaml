- id: 77f2ca33-1bc5-5e6f-bbaa-2690b4c72aec
  title: Quill Instant Access Savings — a failed or pending action
  body: 'It can be frustrating when a financial action doesn''t complete as expected.
    Below are the most common symptoms customers describe and how we resolve them.


    Symptom: "I have transferred money into my savings pot, but the balance hasn''t
    updated."


    Likely Causes:

    - The transaction is still pending due to a temporary network lag.

    - A security flag has been triggered, requiring additional verification.

    - The biometric check during the transfer was not fully completed.


    What to check in order:

    1. Check your transaction history in the app. If the transfer is listed as ''Pending'',
    it is likely a processing delay.

    2. Ensure your app is updated to the latest version to avoid interface glitches.

    3. Check if you received a notification requesting a secondary biometric confirmation.


    How to fix it:

    - If the transaction is pending, please wait 24 hours for the systems to synchronise.

    - If the biometric check failed, simply re-initiate the transfer and ensure your
    sensor is clean and your face/finger is clearly scanned.


    When to escalate:

    If the funds have left your current account but have not appeared in your savings
    pot after 24 hours, please let us know. We will escalate the matter to our specialist
    tiered path. We will then conduct a manual audit of the transaction and provide
    a resolution or a provisional credit to your account within the regulatory timelines.
    You will receive a notification once the audit is complete and the funds are correctly
    allocated.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 7e6d653b-ce14-5fe8-92e8-63a851b494b2
  title: Quill Instant Access Savings — eligibility requirements
  body: 'To ensure compliance with FCA and PRA regulations, we apply the following
    eligibility criteria for opening a Quill Instant Access Savings pot:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Account Status | Must hold an active Quill Current Account | Eligible to open
    savings pots |

    | Identity Verification | Must have completed full KYC and biometric onboarding
    | Eligible to open savings pots |

    | Residency | Must be a legal resident of a supported jurisdiction | Eligible
    to open savings pots |

    | Age | Must be 18 years of age or older | Eligible to open savings pots |

    | Documentation | Valid government-issued ID on file | Eligible to open savings
    pots |


    If any of the above requirements are not met, the system will prevent the creation
    of a savings pot until the missing criteria are satisfied.'
  domain: retail_banking
  product_category: instant_access_savings
  document_type: eligibility_matrix
