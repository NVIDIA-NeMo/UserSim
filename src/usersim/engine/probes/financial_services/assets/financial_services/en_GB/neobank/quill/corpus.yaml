- id: b3aa5900-6a24-54a2-bed6-6d921c2f3734
  title: Quill Current Account — fraud and unauthorised-activity protection
  body: 'When comparing your banking options, security is often the deciding factor.
    We believe that agility should never come at the cost of safety. The Quill Current
    Account is designed with a ''security-first'' architecture, integrating multi-factor
    authentication and in-app biometric checks as mandatory requirements for any state-changing
    action, such as making a high-value payment or updating your personal details.
    This ensures that your funds are protected by the highest modern standards of
    identity verification.


    One of the primary risks in modern digital banking is the Authorised Push Payment
    (APP) scam, where customers are deceived into sending money to fraudsters. We
    are committed to protecting our users from these threats. Unlike many alternatives,
    we provide reimbursement for eligible authorised push payment scams up to £85,000.
    Should you experience unauthorised activity, we prioritise rapid resolution and
    commit to providing a final response for payment services disputes within 15 business
    days.


    Beyond fraud protection, we provide structural peace of mind. Quill operates under
    the strict supervision of the FCA and the PRA. This means your eligible deposits
    are protected by the Financial Services Compensation Scheme (FSCS) up to £120,000
    per person, per institution. This level of protection ensures that your money
    is safe even in the event of institutional failure, offering a level of security
    that matches or exceeds traditional high-street banks.


    To maintain this security, we will never ask you for your full PIN or password
    via email or chat. The first action you should take if you notice any suspicious
    activity is to use the instant card control features in your app to freeze your
    account. For more information on how to maintain your account''s integrity, please
    refer to Quill Current Account — account security best practices.'
  domain: retail_banking
  product_category: current_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 63858dcb-2ece-513b-82bf-7e0e1b697ed6
  title: Quill Current Account — account agreement
  body: 'This account agreement governs the relationship between Quill and the customer
    regarding the use of the Quill Current Account. By opening and maintaining an
    account, the customer agrees to the following terms.


    1. Fees and Charges: The Quill Current Account is provided with a monthly account
    fee of £0. We reserve the right to amend this fee, subject to providing the customer
    with notice in accordance with our change-of-terms policy.


    2. Overdraft Facilities: If a customer is granted an arranged overdraft, interest
    will be charged on the utilised balance. The current arranged overdraft rate is
    29% EAR. This rate is variable, meaning we may adjust it based on market conditions
    or regulatory changes. Interest is calculated daily and applied monthly to the
    account.


    3. Customer Obligations: The customer must provide accurate identity documentation
    and pass all mandatory biometric and multi-factor authentication checks. Any attempt
    to bypass these security features may lead to the immediate suspension of the
    account.


    4. Institution Obligations: We commit to operating under the supervision of the
    FCA and PRA. Eligible deposits are protected by the FSCS up to £120,000 per person.
    We agree to resolve payment service disputes within a maximum of 15 business days.


    5. Account Closure: Either party may terminate this agreement. The customer may
    request closure via the app or support channels. All outstanding balances must
    be settled, and any arranged overdraft must be repaid in full before the account
    can be formally closed.


    6. Regulatory Adherence: This agreement is governed by the Consumer Duty, ensuring
    that all outcomes for the customer are fair and transparent. For a detailed breakdown
    of all costs, see Quill Current Account — fee schedule.'
  domain: retail_banking
  product_category: current_account
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: eff3bdf1-2b72-528d-b96b-52169acd3458
  title: Quill Current Account — who it is best for and common use cases
  body: 'The Quill Current Account is our core, app-only entry point, specifically
    engineered for digitally native consumers who prioritise transparency, agility,
    and a frictionless user experience. It is the ideal choice for individuals who
    want a primary spending account without the burden of monthly maintenance costs.


    **Who it is best for:**

    - **The Minimalist:** Users who want essential banking features—spending, managing,
    and transferring—with a monthly account fee of £0.

    - **The Global Traveller:** Those who need a global payment tool. When paired
    with our debit card, users benefit from 0% foreign transaction fees and a £200
    monthly fee-free ATM allowance.

    - **The Security-Conscious:** Individuals who value proactive safety features,
    such as instant card control and gambling blocks, combined with the protection
    of FSCS coverage up to £120,000.

    - **The Tech-Savvy Spender:** Users who prefer an app-first interface and require
    fast, secure transfers with a daily limit of £10,000 and £0 transfer fees.


    **Common Use Cases:**

    - **Daily Spending:** Using the app to manage day-to-day expenses and monitor
    spending in real-time without worrying about a monthly subscription charge.

    - **International Trips:** Using the associated debit card for spending abroad
    to avoid the high conversion fees typical of legacy institutions.

    - **Digital Salary Receipt:** Acting as the primary hub for receiving income and
    distributing it to savings pots or other accounts.

    - **Secure Peer-to-Peer Payments:** Sending money quickly via Faster Payments,
    leveraging Confirmation of Payee to ensure funds reach the correct recipient.


    For users who find they need more than the essential toolkit, we offer a premium
    subscription via Quill Plus — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 78121136-68b9-5532-90cf-f0bfbb5e7d5b
  title: Quill Current Account — arranged overdraft interest rate (EAR, variable)
    explained
  body: '**What is the interest rate for an arranged overdraft on my account?**

    The arranged overdraft rate for the Quill Current Account is 29% EAR. This is
    a variable rate, meaning it may change over time based on market conditions.


    **What does ''EAR'' mean in this context?**

    EAR stands for Effective Annual Rate. This represents the actual annual cost of
    your arranged overdraft, taking into account the effect of compounding interest
    over the year. It provides a more accurate picture of the total cost than a simple
    nominal rate.


    **How is this rate applied to my balance?**

    Interest is calculated daily on the amount you have borrowed from your arranged
    overdraft and is typically charged to your account on a monthly basis. Because
    the rate is variable, we will notify you of any significant changes to the 29%
    EAR.


    For further details on how we calculate interest, please see Quill Current Account
    — how rates are tiered and applied.'
  domain: retail_banking
  product_category: current_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 2b9c9361-4586-525d-984f-ced832c7e6e6
  title: Quill Current Account — cancel, close, or downgrade
  body: 'Whether you are moving to a different provider or simply changing your plan,
    we ensure the process of closing or downgrading your account is straightforward
    and transparent.


    **Before you begin:**

    - Ensure all pending transactions have cleared.

    - Move any remaining funds to another account or your savings pots.

    - If you have an arranged overdraft, this must be repaid in full so your balance
    is at least £0.


    **Steps to close your account:**

    1. Tell us that you wish to close your Quill Current Account. We will then initiate
    the closure sequence.

    2. We will ask you to complete a biometric verification check via the app to ensure
    the request is authorised by the account holder.

    3. We will verify that your final balance is £0 and that there are no outstanding
    liabilities.

    4. We will provide a final confirmation message in the app and via email once
    the account is officially closed.


    **Steps to downgrade from Quill Plus:**

    1. Tell us you wish to downgrade your account to the standard Quill Current Account.

    2. We will confirm the date on which your premium features will cease and the
    date your last £7 monthly fee was charged.

    3. We will transition your account to the standard tier, restoring your monthly
    account fee to £0.


    **Switching to another bank:**

    If you are moving to another institution, you may use the Current Account Switch
    Service. This regulated process allows you to move your banking to a new provider
    within seven working days with a full guarantee.


    For information on starting a new account, see Quill Current Account — set up
    and activate.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 4e7c5249-ba8e-585f-b488-9ad38c62b01c
  title: Quill Current Account — an unexpected charge or amount
  body: 'When a customer reports a charge or an amount on their Quill Current Account
    that they did not expect, we follow a systematic diagnostic path to resolve the
    discrepancy.


    **Symptom:** The customer identifies a transaction or a balance deduction they
    do not recognise.


    **Likely Causes and Resolution Steps:**

    1. **Overdraft Interest:** Check if the customer has utilised an arranged overdraft.
    If the account is in a negative balance, the charge is likely the monthly interest
    applied at the 29% EAR. We will explain the EAR calculation to the customer.

    2. **Pending Transactions:** Check for ''authorised'' but not yet ''settled''
    transactions. Some merchants place a temporary hold on funds, which can make the
    available balance appear lower than the actual balance.

    3. **Subscription Fees:** Verify if the customer is on the standard account (monthly
    account fee of £0) or has been upgraded to Quill Plus (monthly fee of £7).

    4. **Unauthorised Activity:** If the charge is a payment the customer did not
    authorise, it must be treated as potential fraud. We will immediately trigger
    the dispute process.


    **How to fix and escalate:**

    - **For legitimate charges:** Once we explain the nature of the 29% EAR or the
    subscription fee, the issue is resolved in the conversation.

    - **For disputed payments:** We will guide the customer to freeze their card immediately.
    We will then raise a formal dispute case. We commit to providing a final response
    for payment services disputes within 15 business days.

    - **For APP Scams:** If the customer was tricked into sending the money, we will
    assess the case for reimbursement under our policy for authorised push payment
    scams, which covers eligible claims up to £85,000.


    If the issue cannot be resolved through these steps, we will escalate the query
    to our tiered specialist path to ensure regulatory compliance.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 2f713343-a32c-5039-a59f-6168fdb3b107
  title: Quill Current Account — required documentation
  body: 'To open a Quill Current Account, all prospective customers must complete
    our rigorous identity verification process. The following documentation and checks
    are required to achieve an ''Approved'' status:


    | Requirement | Necessary Documentation/Action | Outcome |

    | :--- | :--- | :--- |

    | **Proof of Identity** | Valid Government-issued Photo ID (e.g., Passport or
    Driving Licence) | Mandatory for Account Opening |

    | **Identity Verification** | Real-time biometric facial scan via the Quill app
    | Mandatory for Account Opening |

    | **Residential Address** | Digital utility bill or bank statement (dated within
    last 3 months) | Mandatory for Account Opening |

    | **Security Setup** | Configuration of multi-factor authentication (MFA) | Mandatory
    for Account Activation |

    | **Tax Residency** | Provision of Tax Identification Number (TIN) | Mandatory
    for Regulatory Compliance |


    Failure to provide any of the above documentation will result in a ''Pending''
    or ''Declined'' application until the information is supplied and verified.'
  domain: retail_banking
  product_category: current_account
  document_type: eligibility_matrix
  source_authority: official
