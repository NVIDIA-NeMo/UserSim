- id: ce3bc80e-9ae7-5b49-99bf-88a9251f7458
  title: Quill Debit Card — check status or history
  body: 'To maintain full visibility over your spending and security, you can check
    your card''s status and transaction history directly through your account.


    What you will need:

    - Your registered mobile device with the Quill app installed.

    - Your biometric login (FaceID/Fingerprint) or secure passcode.


    Steps to check your transaction history:

    1. Open the app and navigate to the ''Cards'' section from the main dashboard.

    2. Select your active Quill Debit Card.

    3. Scroll down to the ''Recent Activity'' list. Here, you will see a chronological
    record of all settled and pending transactions, including the exact amount and
    the merchant name.

    4. Tap on any specific transaction to view more details, such as the date, time,
    and the specific currency conversion used if the purchase was made abroad.


    Steps to check your card''s current status:

    1. From the main dashboard, enter the ''Cards'' menu.

    2. Look at the card toggle switch. If the switch is ''On'', your card is active
    and ready for use. If the switch is ''Off'', the card is currently frozen and
    will decline all new payment attempts.

    3. If the card is frozen, you can simply toggle the switch back to ''On'' to reactivate
    it instantly.


    How you know it worked:

    For history, you will see a detailed list of your spends. For status, the toggle
    switch will clearly indicate whether the card is ''Active'' or ''Frozen''.'
  domain: cards
  product_category: debit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 2bb56c76-b86a-57f6-aa1b-e38a92c6cbc4
  title: Quill Debit Card — a declined or blocked action
  body: 'If you find that your Quill Debit Card has been declined at a point-of-sale
    terminal or an ATM, please follow these steps to identify and resolve the issue.


    Common Symptoms:

    - The payment terminal displays ''Transaction Declined'' or ''Unable to Authorise''.

    - The ATM returns your card without dispensing cash.

    - You receive an immediate push notification stating a payment was blocked.


    Likely Causes and Fixes:

    1. Card is Frozen: Check your app''s ''Cards'' section. If the card toggle is
    ''Off'', your card is frozen. Toggle it back to ''On'' to resume spending.

    2. Insufficient Funds: Ensure your current account has enough available balance
    to cover the transaction. If you are relying on an overdraft, check your limits
    in the account settings.

    3. Incorrect PIN: If you have entered the wrong PIN multiple times, the card may
    be temporarily blocked for security. If you have forgotten your PIN, you can request
    a PIN reminder or a new PIN via the app.

    4. Security Block: Our proactive security features may block a transaction if
    it appears unusual (e.g., a very large purchase in a new country). Check your
    app for a ''Did you make this payment?'' notification and confirm the transaction
    to unblock the merchant.


    When to escalate:

    If you have verified that your card is unfrozen, you have sufficient funds, and
    your PIN is correct, but the card is still being declined, we need to investigate
    further. Tell us the date, time, and location of the failed attempt. We will then
    route your query to our card specialist team to check for technical blocks or
    network issues. You will receive a status update via the app once the investigation
    is complete.'
  domain: cards
  product_category: debit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: d3c9aeaf-965d-5491-8ecd-3512a65da236
  title: Quill Debit Card — when to switch or upgrade
  body: "The Quill Debit Card is designed for agility and transparency, particularly\
    \ for users who travel or spend in multiple currencies. \n\nCompared to traditional\
    \ high-street bank cards, the Quill Debit Card is a superior choice for those\
    \ who want to avoid the typical 2% to 3% non-sterling transaction fees, as we\
    \ offer a 0% foreign transaction fee. It is also ideal for casual travellers who\
    \ need modest amounts of cash, benefiting from our £200 monthly fee-free ATM allowance\
    \ abroad.\n\nHowever, a user might consider moving beyond the standard card setup\
    \ if their needs change:\n- High-Volume Cash Users: If a customer regularly withdraws\
    \ more than £200 per month from ATMs abroad, they will incur a 3% fee on the excess.\
    \ In such cases, they may wish to evaluate if their spending patterns suit our\
    \ model or if they require different arrangements.\n- Premium Feature Seekers:\
    \ For those who want more than just essential spending and management, upgrading\
    \ to the quill_plus subscription for £7 per month provides additional value-added\
    \ services.\n\nIn short: switch to the Quill Debit Card for frictionless, fee-free\
    \ global spending; upgrade to quill_plus for enhanced account benefits."
  domain: cards
  product_category: debit_card
  document_type: comparison
  source_authority: official
