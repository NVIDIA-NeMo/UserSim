  mentions_tools: []
  institution_id: quill
- id: 8fa67042-3faf-52e9-861e-c0effa34a540
  title: Quill Payments — set up and activate
  body: 'Activating and using Quill Payments is a streamlined process integrated directly
    into your account experience. You do not need to apply for a separate payment
    service; once your account is open, the payment functionality is active by default.


    Before you begin your first transfer, ensure you have an active account and have
    completed the initial onboarding as described in Quill Current Account — overview.


    Follow these steps to make your first payment:


    1. Provide the recipient''s details: Enter the sort code and account number of
    the person or business you wish to pay.

    2. Verify the recipient: We will automatically trigger Confirmation of Payee.
    Review the name we return to ensure it matches the intended recipient. If the
    name does not match, we recommend double-checking the details before proceeding.

    3. Specify the amount: Enter the amount you wish to send. Note that your total
    transfers for the day cannot exceed the daily limit of £10,000.

    4. Authenticate the transaction: When prompted, complete the in-app biometric
    check (such as FaceID or fingerprint scan) to verify your identity.

    5. Confirm and send: Review the final summary and tap ''Send''.


    You will know the payment was successful when you receive an instant in-app confirmation
    notification and the transaction appears in your activity feed with a ''Completed''
    status. The funds will be deducted from your balance immediately, and a fee of
    £0 will be applied.'
  domain: payments
  product_category: payments
  document_type: how_to_guide
  source_authority: official
