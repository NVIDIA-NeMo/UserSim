- id: ef05e617-4d54-52bb-982a-742996c9b995
  title: Quill Current Account — risk disclosures
  body: 'This document provides essential risk disclosures related to the Quill Current
    Account. Please read these carefully to understand the financial and regulatory
    environment of your account.


    **Overdraft Risk**

    Users who utilise an arranged overdraft are subject to interest charges. The current
    arranged overdraft rate is 29% EAR. It is important to note that this rate is
    variable; it may increase or decrease over time. A higher EAR increases the total
    cost of borrowing, which can lead to a cycle of debt if the overdraft is not managed
    carefully. We encourage users to monitor their balances via the app to avoid unexpected
    interest accumulations.


    **Deposit Protection**

    Quill is supervised by the FCA and the PRA. Your eligible deposits are protected
    by the Financial Services Compensation Scheme (FSCS). The maximum limit of this
    protection is £120,000 per person, per institution. Any funds held in excess of
    £120,000 are not covered by the FSCS and would be subject to the institution''s
    available assets in the event of failure.


    **Payment and Fraud Risks**

    While we employ rigorous multi-factor authentication and biometric checks, no
    system is entirely immune to fraud. We provide reimbursement for eligible authorised
    push payment (APP) scams up to £85,000, but this is subject to our investigation
    and the criteria of the scam. We commit to providing a final response for payment
    services disputes within 15 business days.


    **Advice Limitation**

    Quill provides general financial education and product information. We do not
    provide individualised tax, legal, or professional investment advice. All product
    recommendations are designed to be fair and clear, but users should seek independent
    professional advice for specific financial planning needs.


    For further regulatory details, see Quill Current Account — regulatory disclosures.'
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: fcb71cd3-92a2-523a-8be4-8190c1c398dd
  title: Quill Current Account — how rates are tiered and applied
  body: 'The Quill Current Account employs a simplified, non-tiered pricing structure
    for its core credit facility to ensure maximum transparency for the user.


    **Arranged Overdraft Rate**

    There are no tiered interest brackets based on the amount borrowed. A single,
    flat rate applies to all balances within an arranged overdraft limit:

    - **Applicable Rate:** 29% EAR

    - **Application:** This rate is applied to the total daily utilised overdraft
    balance.

    - **Frequency:** Interest is calculated daily and debited from the account on
    a monthly basis.


    **Monthly Account Fee**

    - **Standard Rate:** £0

    - **Application:** This fee is applied to all standard Quill Current Accounts
    regardless of balance or activity level.


    As this is a variable rate, any changes to the 29% EAR will be communicated to
    the customer via the app and email before they take effect. For a full list of
    all costs, refer to Quill Current Account — fee schedule.'
  domain: retail_banking
  product_category: current_account
  document_type: rate_sheet
