  mentions_tools: []
  institution_id: quill
- id: 89780f0f-fdf8-5781-9f19-82c9f8e2faac
  title: Quill Payments — how rates are tiered and applied
  body: 'Quill Payments employs a transparent, flat-fee pricing model to ensure essential
    banking remains accessible to all. There are no tiered rates, volume-based charges,
    or hidden costs associated with our payment services.


    - Faster Payment Fee: £0

    - Application: This rate applies to all outgoing Faster Payments, regardless of
    the amount sent or the number of transactions performed per month.

    - Daily Limit: £10,000 (applied to the total aggregate of all transfers in a 24-hour
    period).


    Because we do not use a tiered structure, the cost remains £0 whether you are
    sending a small payment to a friend or transferring the full £10,000 daily limit.
    This rate is subject to change only if we update our general fee schedule, in
    which case you will be notified via the app in accordance with our change-of-terms
    policy.'
