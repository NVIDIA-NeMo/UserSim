- id: 84c754e2-fa9e-5d86-b898-602569f895fd
  title: Quill Payments — choosing between tiers or options
  body: 'When choosing how to manage your transfers, it is helpful to compare Quill
    Payments against traditional banking alternatives.


    **Quill Payments**

    We offer a completely frictionless experience with a fee for a Faster Payment
    of £0 and a daily limit for Faster Payments of £10,000. Our model is designed
    for the digitally native user who wants agility without the burden of transaction
    costs.


    **Traditional Banks**

    Many legacy institutions may charge a fee for instant transfers or impose significantly
    lower default daily limits, requiring lengthy manual requests to increase them.
    They often lack the integrated biometric agility we provide.


    **Who it suits**

    Quill Payments is the ideal choice for those who value transparency and cost-efficiency.
    If you frequently move funds and want a predictable, £0-cost structure with a
    high daily ceiling, our service is superior. If you require physical branch-based
    payment services for very high-value corporate transfers exceeding our £10,000
    daily limit, a traditional institution may be a necessary supplement.'
  domain: payments
  product_category: payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 8a756c9c-0fef-5f65-aa12-99291b37dd71
  title: Quill Payments — privacy and data handling
  body: 'Quill operates under the strict supervision of the FCA and PRA, ensuring
    that all payment data is handled with the highest level of care and in compliance
    with the Consumer Duty.


    When you use Quill Payments, we process your data to facilitate the secure transfer
    of funds. This includes the use of the Confirmation of Payee service, where we
    share the recipient''s name and account details with the receiving institution
    to verify a match. This process is essential for reducing fraud and ensuring fair
    outcomes for all customers.


    We employ rigorous identity verification, including multi-factor authentication
    and biometric checks, to ensure that only the authorised account holder can initiate
    state-changing actions. All payment data is encrypted and stored according to
    strict regulatory standards. We may disclose payment information to regulatory
    bodies or law enforcement if required by law to combat financial crime, including
    Authorised Push Payment (APP) scams.


    Your deposits are protected by the FSCS up to £120,000 per person, per institution.
    This protection applies to the funds held in your account while they are awaiting
    transfer. We are committed to transparency and will never share your payment history
    with third-party marketers without your explicit consent.


    For further information on how we handle your broader account data, please refer
    to Quill Current Account — privacy and data handling.'
  domain: payments
  product_category: payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: cdb16780-4973-5e56-9557-788124eec500
  title: Quill Payments — recognising scams targeting this product
  body: 'At Quill, we are committed to your financial wellness, which includes protecting
    you from the evolving tactics of fraudsters. When using Quill Payments, the most
    common threat is the Authorised Push Payment (APP) Scam. This occurs when you
    are tricked into voluntarily transferring money to an account controlled by a
    fraudster, often through social engineering or impersonation.


    Common red flags include urgency, requests to move money to a ''safe account'',
    or individuals claiming to be from a government agency or our own security team
    asking for a transfer. Please remember: we will never ask you to transfer funds
    to a different account to ''protect'' them, nor will we ask for your full biometric
    data or MFA codes over a phone call.


    If you believe you have been targeted or have already sent a payment under false
    pretences, you must notify us immediately. We prioritise the rapid resolution
    of disputes and are committed to protecting our customers; this includes the reimbursement
    of authorised push payment scams up to £85,000, subject to our terms and conditions.
    Once a dispute is raised, we aim to provide final responses for payment services
    within 15 business days.


    To keep your account secure, we employ Confirmation of Payee, which verifies that
    the recipient''s name matches the account details before a transfer is sent. Always
    double-check these details before confirming any payment. If a name does not match,
    we strongly advise against proceeding with the transaction.'
  domain: payments
  product_category: payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: bb989870-bef8-5a23-a054-015893eccebe
  title: Quill Payments — limits, restrictions, and edge cases
  body: 'This document provides the technical parameters for Quill Payments to assist
    support agents in managing customer expectations and resolving queries regarding
    transaction failures.


    **Fee Structure**

    We maintain a fair and transparent fee philosophy. There is a £0 fee for making
    a Faster Payment, ensuring that essential money movement is accessible to all
    our users.


    **Transaction Limits**

    To mitigate risk and protect customer funds, we apply a daily limit of £10,000
    for all payments. This limit is a rolling 24-hour cap on the total value of funds
    sent from the account.


    **Restrictions and Edge Cases**

    - **Daily Cap:** If a customer attempts to send a payment that would exceed the
    £10,000 daily limit, the transaction will be declined. We cannot manually override
    this limit for individual transactions at this time.

    - **Identity Verification:** All state-changing actions, including high-value
    payments, require rigorous identity verification. If a payment is blocked, it
    may be due to a failed biometric check or an MFA timeout.

    - **Confirmation of Payee:** If the Confirmation of Payee service indicates a
    mismatch between the recipient''s name and the account details, the user will
    receive a warning. While the user may still choose to proceed, these transactions
    are flagged for higher security scrutiny.

    - **Account Status:** Payments cannot be initiated from accounts that are frozen
    or under a temporary security block. Users must resolve the account status before
    payment functionality is restored.'
  domain: payments
  product_category: payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: b1aae3f5-40f7-5680-8e5c-3f9247c4ffea
  title: Quill Payments — eligibility and setup
  body: '### Who is eligible to use Quill Payments?

    Quill Payments is available to any customer who holds an active Quill current
    account. There are no additional eligibility checks or application processes required
    to use our payment services; they are integrated into your core banking experience
    from the moment your account is open.


    ### How do I set up Quill Payments?

    There is no separate setup process. Once you have completed the mandatory identity
    verification and biometric checks during your account opening, you can begin sending
    and receiving money immediately through the app.


    ### Is there a cost to start using this service?

    No. In line with our commitment to transparency, there is a £0 fee for using our
    payment services. You will not be charged for setting up recipients or initiating
    transfers.


    For more information on how to get your account ready, see Quill Current Account
    — overview.'
  domain: payments
  product_category: payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 89980ef8-0376-5ea5-8c46-94025a141b6c
  title: Quill Payments — check status or history
  body: 'To keep track of your spending and verify that your transfers have reached
    their destination, you can review your payment status and history directly within
    the app.


    **What you need before starting:**

    - Your registered mobile device with the Quill app installed.

    - Successful biometric or PIN authentication to access your account.


    **Steps to check your payment history:**

    1. Navigate to the ''Payments'' tab from the main app dashboard.

    2. Select ''Activity'' or ''History'' to view a chronological list of all sent
    and received funds.

    3. Tap on any individual transaction to view the full details, including the recipient''s
    name, the exact amount sent, and the timestamp.

    4. Check the status label next to the transaction: ''Completed'' indicates the
    funds have been successfully sent; ''Pending'' indicates the payment is processing;
    ''Declined'' means the transaction did not go through.


    **How you know it worked:**

    You will see a detailed digital receipt for the specific payment, showing the
    confirmation of the transfer and the updated balance of your account.


    If you notice a transaction marked as ''Declined'', please refer to Quill Payments
    — limits, restrictions, and edge cases for possible reasons, such as exceeding
    your £10,000 daily limit.'
  domain: payments
  product_category: payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: e0198357-700e-5fb3-baf2-ddd042513af3
  title: Quill Payments — a declined or blocked action
  body: 'It can be frustrating when a payment does not go through. If you have experienced
    a declined or blocked payment, it is usually due to one of the following reasons.


    **Symptom: The app displays a ''Payment Declined'' message immediately after confirmation.**


    **Likely Causes:**

    - **Daily Limit Exceeded:** You have reached the £10,000 daily limit for payments.
    This is a security feature to protect your funds.

    - **Insufficient Funds:** Your current account balance is lower than the amount
    you are attempting to send.

    - **Verification Failure:** The in-app biometric check or multi-factor authentication
    (MFA) failed or timed out.


    **What to check in order:**

    1. **Check your balance:** Ensure you have enough funds to cover the payment and
    any other pending transactions.

    2. **Check your daily total:** Add up all payments made in the last 24 hours.
    If the total reaches £10,000, you will need to wait until the limit resets.

    3. **Retry authentication:** Ensure you are in a well-lit area for biometric checks
    and that your device is connected to a stable internet connection.


    **The Fix:**

    - If the limit was the issue, please wait for the 24-hour window to pass before
    attempting the transfer again.

    - If the biometric check failed, simply restart the payment process and follow
    the on-screen prompts for verification.


    **When to escalate:**

    If you have sufficient funds and are well within your £10,000 daily limit but
    payments continue to be blocked, please let us know. We will route your query
    to a specialist compliance team to investigate if there is a security hold on
    your account. You will receive a notification once the review is complete.'
  domain: payments
  product_category: payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 473433fe-a747-5976-aa02-a7bed5107c5e
  title: Quill Payments — when to switch or upgrade
  body: 'As a support agent, you should help customers determine if Quill Payments
    meets their needs or if they require alternative arrangements for larger financial
    movements.


    **Comparison: Quill Payments vs. Traditional Bank Transfers**


    - **Cost:** Quill Payments is consistently £0, whereas some traditional institutions
    may charge for certain types of transfers or account maintenance.

    - **Speed:** We use a modern, app-first infrastructure to ensure transfers are
    fast and frictionless.

    - **Limits:** We have a strict daily limit of £10,000. Traditional banks may offer
    higher daily limits for established accounts, though these often require manual
    requests or phone verification.

    - **Security:** We integrate Confirmation of Payee and biometric checks directly
    into the flow, providing a more agile experience than traditional security questionnaires.


    **Who suits each?**

    - **Quill Payments** is the ideal choice for digitally native users who value
    speed and transparency, and whose daily transfer needs stay within the £10,000
    threshold.

    - **Traditional Alternatives** may be better for customers who frequently need
    to move very large sums (exceeding £10,000) in a single day and prefer a relationship-manager
    model over an app-first experience.


    Refer to Quill Payments — overview for the full product feature set.'
  domain: payments
  product_category: payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 941cb772-93a5-5ffe-a8a7-3294f30e2060
  title: Quill Payments — comparison vs. alternatives and when not to choose it
  body: 'When choosing a banking partner, the way you move your money is critical.
    Quill Payments is designed for the modern user who expects banking to be as agile
    as the rest of their digital life.


    **Why choose Quill Payments?**

    - **Zero Cost:** We believe essential banking should be accessible. This is why
    our payment fee is £0. You can send money without worrying about eroding your
    balance with transaction charges.

    - **Frictionless Experience:** Our app-first approach means you can send funds
    in seconds, supported by intuitive biometric verification and Confirmation of
    Payee to ensure your money goes to the right person.

    - **Security First:** We employ multi-factor authentication and rigorous identity
    verification to ensure that only you can move your funds.


    **When might an alternative be better?**

    While we strive to provide a comprehensive service, there are specific scenarios
    where Quill Payments may not be the best fit:

    - **High-Value Daily Transfers:** We maintain a daily limit of £10,000. If your
    financial activity requires you to transfer more than this amount every single
    day, a traditional institution with higher corporate-style limits may be more
    appropriate.

    - **Non-Digital Preferences:** Because our service is app-only, those who prefer
    to conduct their banking via physical branches or paper-based instructions will
    find our model unsuitable.


    In summary, if you value a £0 fee structure and a seamless digital experience
    and your daily transfers are £10,000 or less, Quill Payments is the superior choice
    for agility and transparency.'
  domain: payments
  product_category: payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 053b10c7-860b-53d2-94f6-938c2137526d
  title: Quill Payments — how-to / step-by-step
  body: '### How do I send money to someone for the first time?

    To send a payment, go to the ''Payments'' tab in your app, select ''Send'', and
    enter the recipient''s account details. Our Confirmation of Payee service will
    verify the name matches the account. Once confirmed, enter the amount and complete
    the biometric check to send the funds.


    ### Can I send more than £10,000 in one day?

    No. To protect your account security, we have a daily limit of £10,000. If you
    attempt to send more than this, the payment will be declined.


    ### How much does it cost to make a transfer?

    There is a £0 fee for all Faster Payments made through your account.


    For a more detailed walkthrough, see Quill Payments — resolve a common request
    end-to-end.'
  domain: payments
  product_category: payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: bbb8fc11-2323-5fca-b5c3-393d9a44b1ce
  title: Quill Payments — resolve a common request end-to-end
  body: 'A common request for our users is setting up a new recipient and sending
    their first payment. Here is the complete process to do this securely.


    **What you need before starting:**

    - The recipient''s full legal name.

    - The recipient''s sort code and account number.

    - Sufficient funds in your Quill current account to cover the transfer.


    **Steps to complete the payment:**

    1. Open the Quill app and navigate to the ''Payments'' section.

    2. Select ''Send Money'' and then ''Add New Recipient''.

    3. Enter the recipient''s sort code and account number. We will then perform a
    Confirmation of Payee check; we will confirm if the name you provided matches
    the details held by the receiving bank.

    4. Once the name is verified, enter the amount you wish to send. Ensure this amount,
    combined with any other payments you have made today, does not exceed the £10,000
    daily limit.

    5. Review the payment summary and tap ''Confirm''.

    6. Complete the required in-app biometric check (FaceID or Fingerprint) to authorise
    the transaction.


    **How you know it worked:**

    - You will immediately see a ''Payment Successful'' screen.

    - The funds will be deducted from your available balance.

    - A record of the transaction will appear in your payment history with a ''Completed''
    status.


    If the payment fails at step 6, please ensure your biometric sensors are clean
    and you are using the most recent version of the app.'
  domain: payments
  product_category: payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: f9cb00eb-286b-5308-b012-589961f7e884
  title: Quill Payments — a discrepancy in your records or statement
  body: 'This guide assists support agents in resolving cases where a customer reports
    that their payment history or statement does not match their expectations.


    **Symptom: The customer claims a payment was sent but it does not appear in their
    history, or the amount deducted is incorrect.**


    **Likely Causes:**

    - **Processing Lag:** The payment may be in a ''Pending'' state and has not yet
    moved to ''Completed''.

    - **Failed Transaction:** The payment may have been declined (e.g., due to the
    £10,000 daily limit) and the funds were never actually deducted.

    - **User Error:** The customer may be looking at the wrong date range or the wrong
    account.


    **What to check in order:**

    1. **Verify Transaction Status:** Review the customer''s activity log. Look for
    any ''Pending'' transactions that match the amount and recipient in question.

    2. **Check for Declined Events:** Search for declined attempts. If a payment was
    blocked for exceeding the £10,000 limit, it will not appear as a successful deduction
    from the balance.

    3. **Cross-Reference Statement:** Compare the in-app activity log with the official
    monthly statement to see if there is a timing discrepancy.


    **The Fix:**

    - If the payment is ''Pending'', advise the customer that the funds are in transit
    and provide the expected completion timeline.

    - If the payment was ''Declined'', explain the cause (e.g., daily limit) and confirm
    that no funds have left their account.

    - If a genuine discrepancy exists (e.g., funds deducted but no record found),
    escalate the case immediately.


    **When to escalate:**

    Raise a high-priority case to the payments specialist team if you find a balance
    deduction without a corresponding transaction record. We will investigate the
    ledger and provide a final response within 15 business days. The customer should
    be informed that we are conducting a thorough audit of the transaction flow.'
  domain: payments
  product_category: payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 4a3fb65f-9fd7-5a06-b928-91b7c8399ffc
  title: Institution-wide fees and charges
  body: 'At Quill, we believe essential banking should be accessible to everyone.
    Our fee structure is designed for transparency and agility, ensuring that our
    users are never surprised by hidden costs.


    For our core offering, the Quill Current Account carries a monthly fee of £0,
    providing essential spending and management tools without a recurring cost. For
    users seeking a more enhanced experience, we offer Quill Plus, which is available
    for a monthly fee of £7. This subscription funds additional value-added services
    and premium enhancements.


    While we maintain a commitment to fairness, certain specific products—such as
    the Quill Debit Card or Quill Payments—have their own specific limits and fee-free
    allowances (such as ATM withdrawal thresholds). These product-specific details
    are maintained in their respective fee schedules to ensure clarity and precision.


    We operate with a transparent posture: if a fee is applicable, it is clearly stated
    in plain English, avoiding the opaque jargon common in traditional banking. For
    a detailed breakdown of individual product costs, please refer to the specific
    product fee schedules.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 7699302e-72d7-5931-a0e6-5da4c83d05e2
  title: General frequently asked questions
  body: 'How do I get support from Quill?

    We provide support primarily through our in-app chat and email channels. To support
    our global user base, these services operate 24/7. If your query is complex, we
    will escalate it through a tiered specialist path to ensure we meet all regulatory
    response timelines.


    What happens if I have a complex issue that cannot be resolved in chat?

    Our support model is designed for efficiency, but we recognise that some issues
    require deeper expertise. Complex queries are escalated to specialists who ensure
    that our responses remain compliant with the strict supervision of the FCA and
    PRA.


    How does Quill handle account security?

    We employ rigorous identity verification before any state-changing action, payment,
    or disclosure of account information. This includes the use of multi-factor authentication
    and in-app biometric checks to ensure your funds and data remain secure.


    Where can I find more information on specific account procedures?

    Every payment on your account is listed in the Quill app, and you can ask us about
    any of them in the in-app chat.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 50a5adcd-eaa1-595c-9895-e5badf4f7401
  title: Regulatory notes for Current accounts and savings
  body: 'Quill operates under the strict supervision of the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). In all our retail banking
    interactions, specifically regarding the Quill Current Account and Quill Instant
    Access Savings, we adhere strictly to the Consumer Duty. This means we are obligated
    to act to deliver good outcomes for retail customers, ensuring that our products
    are fit for purpose and provide fair value.


    One of the most critical protections for our users is the deposit guarantee. Eligible
    deposits held within Quill accounts are protected by the Financial Services Compensation
    Scheme (FSCS) up to £120,000 per person, per institution. This ensures that user
    funds are secure up to this limit in the unlikely event of institutional failure.


    When discussing savings products, agents must be precise regarding interest rates.
    For the Quill Instant Access Savings product, we quote the Annual Equivalent Rate
    (AER). The AER represents the interest rate paid on savings, expressed as a yearly
    percentage, accounting for the effect of compounding. Agents must never approximate
    this rate; they must state the exact percentage as provided in the product rate
    sheets.


    Furthermore, we maintain a strict boundary regarding financial advice. While we
    provide comprehensive financial education and general product information to help
    users improve their financial wellness, Quill does not offer individualised tax,
    legal, or professional investment advice. Agents must ensure that all product
    recommendations are fair, clear, and not misleading, and they must never suggest
    that a product is a guaranteed investment for a specific individual''s tax or
    legal situation.


    All regulatory disclaimers must be presented to the customer in a clear, concise,
    and non-obtrusive format, maintaining our brand voice of professionalism and accessibility
    without using opaque banking jargon.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: ecd2e49c-2cbb-5b4d-8268-32d00aac8017
  title: Regulatory notes for Cards
  body: 'The issuance and management of the Quill Debit Card are governed by the regulatory
    frameworks set by the FCA and PRA. Our approach is centred on the Consumer Duty,
    ensuring that the features of our cards—such as instant card control and gambling
    blocks—are implemented to provide fair and beneficial outcomes for the user.


    Security and verification are the highest priorities for card-related actions.
    Under no circumstances should an agent perform a state-changing action—such as
    freezing a card, ordering a replacement, or altering card limits—without first
    completing rigorous identity verification. This mandatory process involves multi-factor
    authentication and, where applicable, in-app biometric checks. This is not merely
    a company policy but a regulatory requirement to prevent unauthorised account
    access and fraud.


    Regarding the Quill Debit Card''s global payment capabilities, we provide a transparent
    fee structure. The card features 0% foreign transaction fees and a £200 monthly
    fee-free ATM allowance. Agents must communicate these figures exactly. When the
    £200 limit is exceeded, the applicable fees must be clearly explained to the user
    without ambiguity.


    Agents must also be aware of the regulatory requirements surrounding the gambling
    block feature. To promote financial wellness and responsible spending, Quill allows
    users to block gambling payments. However, to prevent impulsive decisions and
    ensure a reasoned approach to financial management, switching this block off requires
    a 48-hour cooling-off period before it takes effect. This mechanism is a key part
    of our proactive security and wellness posture.


    Finally, any card-related disclosures must be delivered in plain English. We avoid
    banking jargon to ensure that the user fully understands their rights and the
    limitations of their card services, maintaining our commitment to transparency
    and accessibility.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 4d5fd565-4254-5afa-a640-4b9044dc0396
  title: Regulatory notes for Payments
  body: 'Quill''s payment services are designed to be fast, secure, and transparent,
    adhering to the regulations enforced by the FCA and PRA. A cornerstone of our
    payment security is the use of Confirmation of Payee. This is a security service
    that verifies the recipient''s name matches the account details before a Faster
    Payment is sent, significantly reducing the risk of misdirected payments and fraud.


    We are deeply committed to protecting our customers from fraud, particularly Authorised
    Push Payment (APP) scams. An APP scam occurs when a customer is tricked into voluntarily
    transferring money to an account controlled by a fraudster. In accordance with
    our risk and compliance posture, we provide reimbursement for eligible APP scams
    up to £85,000. Agents must guide affected users through the report_scam_payment
    process with empathy and precision, ensuring all necessary details are captured
    to facilitate a fair outcome.


    In the event of payment disputes, we prioritise rapid resolution. We are committed
    to providing final responses for payment services disputes within 15 business
    days. This timeline is a regulatory benchmark that we strive to meet or beat to
    ensure our users are not left in financial limbo.


    Regarding the limits of our payment services, the daily limit for transfers is
    £10,000. These transfers are processed with £0 fees to maintain the accessibility
    of our core banking services. Agents must communicate these limits and fees exactly
    as stated, as they are fundamental to the user''s understanding of their account''s
    liquidity and cost.


    When assisting users with the Current Account Switch Service, agents must ensure
    the user understands that this is a regulated process. This service allows customers
    to move their banking to Quill within seven working days with a full guarantee.
    The agent''s role is to facilitate the initiation of this process through the
    appropriate tool, ensuring the transition is frictionless and compliant with the
    regulatory guarantee.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 3fa98ea4-cc6d-5253-92ae-2cc794900eeb
  title: When to use get_account_transactions
  body: 'The `get_account_transactions` tool is the authoritative mechanism for retrieving
    a history of credits and debits associated with a user''s account. This tool should
    be used whenever a customer requests a list of recent payments, seeks to verify
    if a specific transaction has cleared, or needs to identify a transaction ID for
    the purpose of filing a dispute.


    To ensure the security of user data and comply with our rigorous verification
    standards, the following procedure must be followed:


    1. **Verify Identity**: Before accessing any account information, the agent must
    complete the mandatory identity verification process using `verify_identity`.
    No transaction data may be disclosed or retrieved until the user''s identity is
    confirmed via multi-factor authentication or biometric checks.

    2. **Resolve Account ID**: The agent must identify the specific account for which
    transactions are required. If the user provides a partial account number (e.g.,
    the last four digits), the agent must first call `get_accounts` to retrieve the
    full, internal `account_id` associated with that user.

    3. **Retrieve Transactions**: Once the `account_id` is confirmed, the agent calls
    `get_account_transactions`. The agent should specify the relevant parameters (such
    as date ranges or transaction types) based on the user''s request to avoid returning
    unnecessary data.

    4. **Present Information**: The retrieved transactions should be presented to
    the user in plain English, avoiding internal codes and ensuring that the dates
    and amounts are clearly legible.


    This tool is read-only and does not alter the state of the account. If the user
    wishes to dispute one of the transactions found via this tool, the agent should
    then transition to the process outlined in When to use file_transaction_dispute.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: quill
- id: 4ffe1cc8-c28f-5e9b-b455-67233e5eafe4
  title: get_account_transactions tool reference
  body: 'The `get_account_transactions` tool retrieves a historical list of transactions
    for a specified account. The agent performs this action by calling the tool directly
    within the conversation after the user''s identity has been verified.


    **Signature**: `get_account_transactions(account_id: string, start_date: string,
    end_date: string)`


    **Arguments**:

    - `account_id`: The unique identifier for the user''s account. This must be obtained
    by the agent using the `get_accounts` tool before calling the transaction retrieval
    tool.

    - `start_date`: The beginning of the period for which transactions are requested
    (YYYY-MM-DD).

    - `end_date`: The end of the period for which transactions are requested (YYYY-MM-DD).


    **Effect**: Returns a list of transactions including dates, descriptions, amounts,
    and unique transaction identifiers. This is a read-only operation and does not
    modify account state.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: quill
- id: 9cc89b99-6041-5752-8046-a3489b3b90da
  title: When to use file_transaction_dispute
  body: 'The `file_transaction_dispute` tool is used to initiate a formal dispute
    for a card payment via the card scheme''s chargeback process. This is the correct
    path when a user claims a transaction was unauthorised, the goods/services were
    not received, or there is a discrepancy in the amount charged.


    To maintain regulatory compliance and account security, agents must follow these
    steps:


    1. **Verify Identity**: The agent must first ensure the user''s identity is fully
    verified using `verify_identity`. No dispute can be filed on an unverified session.

    2. **Identify Transaction**: To file a dispute, a specific transaction identifier
    is required. The agent must use `get_accounts` to find the `account_id` and then
    call `get_account_transactions` to locate the exact transaction the user is disputing.
    The user must confirm the date and amount of the transaction.

    3. **Collect Dispute Details**: The agent must ask the user for the specific reason
    for the dispute (e.g., "Service not provided" or "Unrecognised transaction").

    4. **Execute Dispute**: The agent calls `file_transaction_dispute` using the retrieved
    transaction identifier and the stated reason.

    5. **Set Expectations**: The agent must inform the user that Quill prioritises
    rapid resolution and will provide a final response for payment services disputes
    within 15 business days.


    Agents should not use this tool for APP scams (where the user was tricked into
    sending a payment); for those cases, the `report_scam_payment` tool must be used
    instead to open a reimbursement claim.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: quill
- id: 0b530849-c49c-506a-8dce-b01c33337000
  title: file_transaction_dispute tool reference
  body: 'The `file_transaction_dispute` tool initiates a formal chargeback process
    for a specific card transaction. The agent performs this action by calling the
    tool directly after identity verification and transaction identification are complete.


    **Signature**: `file_transaction_dispute(transaction_id: string, reason: string)`


    **Arguments**:

    - `transaction_id`: The unique identifier of the transaction to be disputed. This
    must be retrieved by the agent using the `get_account_transactions` tool.

    - `reason`: A clear description of why the transaction is being disputed, provided
    by the customer during the conversation.


    **Effect**: Opens a formal dispute case with the card scheme. This is a state-changing
    operation that marks the transaction as disputed in the system. Once filed, the
    resolution process typically concludes with a final response within 15 business
    days.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: quill
- id: 9567e0c1-6a65-535a-9802-fff513db016e
  title: When to use freeze_card
  body: 'The `freeze_card` tool is used to immediately stop all spending on a Quill
    Debit Card. This is a critical security action used when a customer has lost their
    card, suspects it has been stolen, or notices unauthorised transactions.


    Because this is a state-changing action that affects the user''s ability to access
    funds, the following protocol is mandatory:


    1. **Verify Identity**: The agent must immediately verify the user''s identity
    using `verify_identity`. Given the urgency of a lost or stolen card, the agent
    should move quickly but must not bypass multi-factor authentication or biometric
    checks.

    2. **Resolve Account/Card Details**: The agent must call `get_accounts` to identify
    the user''s active accounts and the specific `card_id` associated with the card
    that needs to be frozen. If the user has multiple cards, the agent must confirm
    which one requires the freeze.

    3. **Execute Freeze**: The agent calls the `freeze_card` tool using the identified
    card identifier. This action takes effect immediately, preventing any further
    transactions from being processed.

    4. **Confirm Action**: The agent must confirm to the user that the card has been
    successfully frozen and explain that this is a temporary measure.

    5. **Next Steps**: The agent should then ask the user if they wish to order a
    replacement card using `order_replacement_card` or if they believe the card was
    stolen, in which case they should be guided through reporting the incident.


    Freezing a card is a reversible action. If the user finds their card and wishes
    to unfreeze it, they can do so via the app or by requesting the agent to reverse
    the freeze, subject to the same identity verification standards.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: quill
- id: 701549f3-e138-5b6a-ae81-d256be4c13c9
  title: freeze_card tool reference
  body: 'The agent performs this action by calling the `freeze_card` tool directly
    to immediately disable a customer''s card for all spending and withdrawals.


    **Tool Signature:**

    `freeze_card(account_id: string, card_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the customer''s account, obtained by
    calling the `get_accounts` tool.

    - `card_id`: The unique identifier for the specific Quill Debit Card to be frozen,
    provided by the customer or retrieved via transaction history.


    **Effect:**

    The tool places an immediate block on the specified card, preventing any further
    transactions. This action is reversible and can be undone through the app or by
    support agents.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: quill
- id: eaf52ab6-fa28-5283-9d09-93dbe7794f23
  title: When to use report_scam_payment
  body: 'We are committed to protecting our customers from fraud. This procedure is
    used when a customer identifies they have been the victim of an Authorised Push
    Payment (APP) scam, where they were tricked into voluntarily transferring funds
    to a fraudster.


    In accordance with our commitment to fair outcomes, we provide reimbursement for
    eligible authorised push payment scams up to £85,000.


    **Procedure for Reporting a Scam Payment:**


    1. **Verify Identity**: Perform rigorous identity verification using multi-factor
    authentication or biometric checks before proceeding with any account-related
    action.

    2. **Identify Account**: Use the `get_accounts` tool to resolve the customer''s
    account identifier from the details provided (such as the last four digits of
    the account).

    3. **Gather Transaction Details**: Ask the customer for the specific transaction
    date and amount. Use `get_account_transactions` to identify the exact transaction
    identifier for the fraudulent payment.

    4. **Collect Evidence**: Request a detailed description of the scam and any relevant
    correspondence from the fraudster.

    5. **Execute Report**: Call the `report_scam_payment` tool, providing the account
    identifier, the transaction identifier, and the details of the scam to open a
    reimbursement claim.


    For more information on how we protect our users, see Quill Current Account —
    security advisory.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_scam_payment
  institution_id: quill
- id: a5ed0216-b164-5bc9-b04e-28ac04e4e861
  title: report_scam_payment tool reference
  body: 'The agent performs this action by calling the `report_scam_payment` tool
    directly to formally report a fraudulent transfer and initiate a reimbursement
    claim.


    **Tool Signature:**

    `report_scam_payment(account_id: string, transaction_id: string, scam_details:
    string)`


    **Arguments:**

    - `account_id`: The identifier for the account from which the funds were sent,
    obtained via the `get_accounts` tool.

    - `transaction_id`: The unique identifier for the specific fraudulent transaction,
    retrieved via `get_account_transactions`.

    - `scam_details`: A comprehensive description of the fraud, as provided by the
    customer during the conversation.


    **Effect:**

    This tool logs the scam report and opens a formal reimbursement claim. This triggers
    the internal review process to determine eligibility for reimbursement up to the
    £85,000 limit.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_scam_payment
  institution_id: quill
- id: 0e706fd7-8c13-5fb0-b9e6-5ae05832afcc
  title: When to use block_gambling_payments
  body: 'As part of our commitment to financial wellness, Quill provides proactive
    security features including the ability to block gambling-related spending on
    a customer''s account.


    **Procedure for Managing Gambling Blocks:**


    1. **Verify Identity**: Complete mandatory identity verification using our multi-factor
    authentication and biometric checks.

    2. **Identify Account**: Use the `get_accounts` tool to retrieve the account identifier
    associated with the customer''s profile.

    3. **Confirm Intent**: Determine if the customer wishes to turn the gambling block
    on or off.

    4. **Execute Block Request**: Call the `block_gambling_payments` tool to update
    the status of the block.


    **Important Regulatory Note:**

    If a customer requests to switch the gambling block **off**, the agent must inform
    the customer that the change will only take effect after a 48-hour cooling-off
    period. This is a mandatory safety measure to prevent impulsive decisions and
    ensure the customer''s financial well-being.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - block_gambling_payments
  institution_id: quill
- id: 78d8b944-3c79-5ba4-84fc-052121c4f687
  title: block_gambling_payments tool reference
  body: 'The agent performs this action by calling the `block_gambling_payments` tool
    directly to enable or disable spending restrictions on gambling merchants.


    **Tool Signature:**

    `block_gambling_payments(account_id: string, enable_block: boolean)`


    **Arguments:**

    - `account_id`: The identifier for the account, obtained by calling the `get_accounts`
    tool.

    - `enable_block`: A boolean value where `true` turns the gambling block on and
    `false` turns it off.


    **Effect:**

    Setting `enable_block` to `true` immediately prevents all gambling-related payments.
    Setting `enable_block` to `false` initiates a 48-hour cooling-off period, after
    which the block is removed and spending is permitted again.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - block_gambling_payments
  institution_id: quill
- id: e8e4d386-96cd-56d7-812e-43d064d64156
  title: When to use change_overdraft_limit
  body: 'This procedure is used when a customer wishes to apply for a new arranged
    overdraft, or to increase, reduce, or entirely remove an existing overdraft limit
    on their account.


    **Procedure for Changing Overdraft Limits:**


    1. **Verify Identity**: Ensure the customer has passed rigorous identity verification
    via the app''s biometric or multi-factor authentication.

    2. **Identify Account**: Use the `get_accounts` tool to resolve the account identifier
    for the customer.

    3. **Determine Requested Limit**: Confirm the specific monetary limit the customer
    is requesting. If they wish to remove the overdraft, the limit should be set to
    £0.

    4. **Affordability Check**: The agent must inform the customer that any increase
    or new application for an overdraft is subject to an affordability check to ensure
    the outcome is fair and sustainable, as per our Consumer Duty obligations.

    5. **Execute Request**: Call the `change_overdraft_limit` tool using the account
    identifier and the new requested limit amount.


    For further details on how overdraft interest is calculated, please refer to Quill
    Current Account — arranged overdraft interest rate (EAR, variable) explained.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: quill
- id: a75a6600-768f-5a18-8ad5-4deb5e72e8fe
  title: change_overdraft_limit tool reference
  body: 'The agent performs this action by calling the `change_overdraft_limit` tool
    directly to adjust the arranged overdraft facility for a customer.


    **Tool Signature:**

    `change_overdraft_limit(account_id: string, new_limit: number)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, obtained via the `get_accounts`
    tool.

    - `new_limit`: The requested overdraft limit amount in GBP (e.g., 500 for £500).
    Use 0 to remove the overdraft facility.


    **Effect:**

    The tool submits a request to change the overdraft limit. This action triggers
    an automated affordability check. The limit is only updated if the check is passed,
    in compliance with regulatory requirements for fair lending.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: quill
- id: 98af9574-8672-58b8-94f6-c6a649abf08c
  title: When to use initiate_account_switch
  body: 'We use this procedure when a customer wants to move their banking from another
    institution to Quill using the regulated Current Account Switch Service.


    **Procedure for Initiating an Account Switch:**


    1. **Verify Identity**: Perform mandatory identity verification via multi-factor
    authentication or biometric checks.

    2. **Identify Account**: Use the `get_accounts` tool to retrieve the account identifier
    for the customer''s Quill account.

    3. **Collect Source Details**: Request the full details of the account they wish
    to switch from, including the bank name, sort code, and account number.

    4. **Execute Switch**: Call the `initiate_account_switch` tool using the account
    identifier and the provided source bank details.


    **Service Standards:**

    Agents must inform the customer that the Current Account Switch Service is a regulated
    process. This means their balance, Direct Debits, standing orders, and all incoming
    payments will be moved to Quill within seven working days, backed by a full guarantee
    to ensure a frictionless transition.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: quill
- id: dde747c8-41a2-5061-b1ba-626474f1e104
  title: initiate_account_switch tool reference
  body: 'The agent performs this action by calling the `initiate_account_switch` tool
    directly to start the regulated process of moving a customer''s banking to Quill.


    **Tool Signature:**

    `initiate_account_switch(account_id: string, source_bank_details: string)`


    **Arguments:**

    - `account_id`: The identifier for the Quill account receiving the funds, obtained
    via the `get_accounts` tool.

    - `source_bank_details`: The full details of the external account to be closed
    and switched (e.g., Bank Name, Sort Code, and Account Number), provided by the
    customer.


    **Effect:**

    This tool triggers the Current Account Switch Service. It automatically manages
    the transfer of the customer''s balance, Direct Debits, standing orders, and incoming
    payments from the old institution to Quill within seven working days.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: quill
- id: 6b7a9f53-72be-542a-bcdf-b22b4c59850c
  title: When to use change_plan
  body: 'This procedure is used when a customer wishes to switch between the standard
    account and the premium subscription tier.


    **Plan Details:**

    - **Quill Current Account**: Our core entry point providing essential spending
    with a monthly fee of £0.

    - **Quill Plus**: A premium subscription tier for a £7 monthly fee that offers
    enhanced features and value-added services.


    **Procedure for Changing Plans:**


    1. **Verify Identity**: Perform mandatory identity verification using in-app biometric
    checks or multi-factor authentication.

    2. **Identify Account**: Use the `get_accounts` tool to retrieve the account identifier
    for the customer.

    3. **Confirm Selection**: Clearly explain the difference in fees (£0 for the standard
    account vs £7 for Quill Plus) and confirm which plan the customer wishes to move
    to.

    4. **Execute Plan Change**: Call the `change_plan` tool, specifying the account
    identifier and the target plan.


    For more information on the benefits of our premium tier, see Quill Plus — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_plan
  institution_id: quill
- id: feb0141a-9a1a-5b9c-8188-55af7644f8d3
  title: change_plan tool reference
  body: 'The `change_plan` tool allows an agent to modify the subscription tier associated
    with a customer''s account. We use this tool to move a user between the core Quill
    Current Account (which has a monthly fee of £0) and the premium Quill Plus plan
    (which carries a monthly fee of £7).


    **Tool Signature:**

    `change_plan(account_id: string, new_plan_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, obtained via the `get_accounts`
    tool.

    - `new_plan_id`: The identifier for the target plan. Use `current_account` to
    downgrade to the free tier or `quill_plus` to upgrade to the premium tier.


    **Effect:**

    Executing this tool immediately updates the account''s billing status and feature
    set. The agent performs this action by calling the tool directly within the conversation
    after the customer''s identity has been rigorously verified. All changes are reflected
    in the user''s app in real-time, including the application of the applicable monthly
    fee of £0 or £7.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_plan
  institution_id: quill
- id: 1d4da57b-e841-5078-bf83-d93598cd87c2
  title: When to use update_beneficiary
  body: 'We use the `update_beneficiary` process whenever a customer needs to manage
    the recipients of their outgoing payments. This includes adding a new payee for
    the first time, correcting the details of an existing beneficiary, or deleting
    a payee who is no longer required. Because we prioritise the security of Quill
    Payments, rigorous identity verification is mandatory before any beneficiary changes
    are processed.


    To update a beneficiary, follow these steps:


    1. Verify the customer''s identity using the required multi-factor authentication
    and biometric checks.

    2. Use the `get_accounts` tool to resolve the customer''s account identifier from
    the last four digits of their account number or other identifying information
    provided.

    3. Confirm the specific action required: whether the customer is adding a new
    payee, updating an existing one, or removing one.

    4. Collect the necessary payment details from the customer. For any new or updated
    beneficiary, you must obtain the recipient''s full name, sort code, and account
    number.

    5. Call the `update_beneficiary` tool using the `account_id` and the specific
    details collected in step 4.

    6. Confirm to the customer that the beneficiary has been successfully updated
    and remind them that we use Confirmation of Payee to verify that the recipient''s
    name matches the account details before payments are sent.


    This procedure ensures that all payment transfers remain secure and that we maintain
    a high standard of care in preventing errors or fraud. For further details on
    payment limits, refer to Quill Payments — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: quill
- id: 40d227f9-7b63-5f7d-94aa-f9648405cd9a
  title: update_beneficiary tool reference
  body: 'The `update_beneficiary` tool is used to add, modify, or remove a payee associated
    with a customer''s account. The agent performs this action by calling the tool
    directly in the conversation once the customer''s identity is confirmed.


    **Tool Signature:**

    `update_beneficiary(account_id: string, action: string, beneficiary_details: object)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, retrieved using `get_accounts`.

    - `action`: The specific operation to perform: `add`, `update`, or `delete`.

    - `beneficiary_details`: An object containing the required information. For `add`
    and `update`, this must include the recipient''s full name, sort code, and account
    number. For `delete`, it must include the identifier of the beneficiary to be
    removed.


    **Effect:**

    Updating a beneficiary modifies the account''s payee list. This allows the customer
    to send funds via Quill Payments. All additions and updates are subject to our
    security checks and the Confirmation of Payee service to ensure the recipient''s
    details are accurate before any funds are transferred.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: quill
- id: c3ff9b7e-8e4b-5801-ba18-292779a32a1b
  title: When to use stop_payment
  body: 'Customers may request to cancel recurring payments to manage their financial
    wellness or resolve disputes with service providers. We use the `stop_payment`
    tool specifically to cancel Direct Debits or standing orders. This tool should
    be used when a customer no longer wishes for a third party to automatically withdraw
    funds or when they wish to stop a scheduled recurring transfer.


    To stop a payment, follow these steps:


    1. Perform rigorous identity verification of the customer using in-app biometric
    checks and multi-factor authentication.

    2. Use the `get_accounts` tool to resolve the `account_id` based on the customer''s
    provided account details.

    3. Ask the customer to identify the specific payment they wish to cancel. You
    must confirm the payee''s name and the amount or reference associated with the
    Direct Debit or standing order.

    4. Verify that the payment exists on the account by reviewing recent transactions
    or payment schedules.

    5. Call the `stop_payment` tool, providing the `account_id` and the specific details
    of the payment to be cancelled.

    6. Inform the customer that the payment has been stopped. Advise them that while
    we have cancelled the instruction within our systems, they should also notify
    the payee to ensure no further attempts are made to claim funds.


    If the customer is requesting to stop a payment because they suspect they have
    been a victim of a scam, do not use this tool. Instead, immediately follow the
    procedure for reporting an authorised push payment scam as detailed in When to
    use report_scam_payment.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: quill
- id: 3a2016ac-200e-5247-9723-19b5d1bb83a3
  title: stop_payment tool reference
  body: 'The `stop_payment` tool is the authoritative mechanism for cancelling recurring
    payment instructions on a customer''s account. The agent executes this action
    by calling the tool directly during the support interaction.


    **Tool Signature:**

    `stop_payment(account_id: string, payment_identifier: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, obtained via `get_accounts`.

    - `payment_identifier`: The unique reference or ID of the Direct Debit or standing
    order that needs to be cancelled. This identifier is typically found when reviewing
    the account''s active payment instructions.


    **Effect:**

    Calling this tool terminates the specific recurring payment instruction. No further
    funds will be transferred to the payee via this instruction. This action is immediate
    and is used to maintain the customer''s control over their spending and financial
    commitments.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: quill
- id: 6f3abe94-eb32-5906-8775-376066e21dfd
  title: When to use manage_authorized_users
  body: 'There are instances where a customer requires a third party to have legal
    authority to act on their behalf, such as through a power of attorney or a third-party
    mandate. We use the `manage_authorized_users` tool to register these legal arrangements,
    ensuring that we comply with regulatory requirements while protecting the account
    holder''s assets.


    To manage authorised users, follow these steps:


    1. Complete rigorous identity verification for the account holder using multi-factor
    authentication and biometric checks.

    2. Use the `get_accounts` tool to resolve the `account_id` from the customer''s
    account information.

    3. Determine the nature of the request: adding a new authorised user (e.g., registering
    a power of attorney), modifying an existing mandate, or removing a third-party
    user.

    4. Collect the full legal details of the person to be added or modified, including
    their full name, date of birth, and current contact information.

    5. Ensure that the customer has provided the necessary legal documentation (such
    as the Power of Attorney deed) through the secure app upload channel before proceeding.

    6. Call the `manage_authorized_users` tool using the `account_id` and the person''s
    details collected.

    7. Confirm to the customer that the authorised user status has been updated. Remind
    them that they can remove this authority at any time by following a similar process.


    This procedure ensures we adhere to the Consumer Duty by providing fair outcomes
    and secure access for those legally entitled to manage an account, while preventing
    unauthorised access.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: quill
- id: a78944cc-d0ef-524b-be65-5a83e224d3ac
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool is used to register or remove third-party
    legal authority on an account, such as a power of attorney or a third-party mandate.
    The agent performs this action by calling the tool directly after identity verification
    and document review.


    **Tool Signature:**

    `manage_authorized_users(account_id: string, action: string, person_details: object)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, retrieved using `get_accounts`.

    - `action`: The operation to perform: `add` (to register a new authorised user)
    or `remove` (to revoke existing authority).

    - `person_details`: An object containing the details of the third party. This
    must include their full name, date of birth, and contact details as provided by
    the customer.


    **Effect:**

    This tool updates the account''s access permissions. When a user is added, they
    are granted the authority specified in the legal documentation to perform actions
    on the account. When removed, all such authority is immediately revoked.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: quill
- id: 2da0d794-6c03-52f7-be53-a2c011a8c95c
  title: When to use get_accounts
  body: 'The `get_accounts` tool is a foundational read-only tool used at the start
    of almost every state-changing or information-disclosure interaction. Because
    our internal systems rely on unique `account_id` strings which are not shared
    with customers, agents must use this tool to resolve a customer''s human-readable
    account details (such as the last four digits of an account number) into a machine-readable
    ID.


    Use `get_accounts` in the following scenarios:


    1. **Initial Identification:** When a customer provides their account details
    to identify which of their products they are calling about.

    2. **Prerequisite for other Tools:** Before calling any tool that requires an
    `account_id` (e.g., `transfer_funds`, `change_plan`, or `stop_payment`), you must
    first call `get_accounts` to ensure you are applying the action to the correct
    account.

    3. **Account Overview:** When a customer asks for a summary of the accounts they
    hold with Quill, such as whether they have both a Quill Current Account and Quill
    Instant Access Savings.


    Procedure for use:


    1. Verify the customer''s identity through our mandatory biometric and multi-factor
    authentication process.

    2. Ask the customer for the identifying details of the account in question (e.g.,
    "Which account are we looking at today?").

    3. Call the `get_accounts` tool. The tool will return a list of accounts associated
    with the verified customer.

    4. Match the customer''s provided details against the returned list to identify
    the correct `account_id`.


    Failure to use `get_accounts` to resolve the `account_id` before performing state-changing
    actions is a breach of our security and compliance posture, as it risks applying
    changes to the wrong account.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: quill
- id: 102aeb4d-e60b-5935-a6ee-6a25d2a533c5
  title: get_accounts tool reference
  body: 'The `get_accounts` tool is a read-only utility that retrieves all accounts
    held by the currently verified customer. The agent calls this tool directly to
    resolve account identifiers necessary for subsequent actions.


    **Tool Signature:**

    `get_accounts()`


    **Arguments:**

    None. The tool automatically operates on the context of the verified customer
    currently in the conversation.


    **Effect:**

    The tool returns a list of all accounts owned by the customer, including the `account_id`,
    the product type (e.g., `current_account`, `instant_access_savings`), and current
    balance information. This allows the agent to identify the correct `account_id`
    to use in other tools, ensuring that subsequent state-changing operations are
    performed on the correct financial product.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: quill
- id: e3a9fd55-777a-5d16-9080-df14840ddef3
  title: When to use open_account
  body: 'We use the `open_account` process to onboard new customers or provide existing
    customers with additional financial products. Whether a user is starting with
    our core Quill Current Account or looking to start saving with Quill Instant Access
    Savings, the process must be handled with a strict adherence to our identity verification
    and regulatory compliance standards.


    To open a new account, follow these steps:


    1. Verify the identity of the applicant using mandatory multi-factor authentication
    and in-app biometric checks. This is a non-negotiable requirement before any account
    can be created.

    2. Determine which product the customer wishes to open. If they are looking for
    essential banking, we recommend the Quill Current Account with its £0 monthly
    fee. If they want premium features, we suggest Quill Plus for £7 per month.

    3. Collect all necessary onboarding information from the customer, including their
    full legal name, date of birth, residential address, and tax residency status.

    4. Ensure the customer has reviewed the relevant regulatory disclosures and account
    agreements for the chosen product.

    5. Call the `open_account` tool, passing the `product_id` (e.g., `current_account`
    or `instant_access_savings`) and the verified person''s details.

    6. Confirm the account has been successfully created. If it is a current account,
    guide the customer through the next steps for activating their Quill Debit Card.


    Our onboarding process is designed to be frictionless yet rigorous, ensuring we
    comply with FCA and PRA supervision. For detailed requirements on what documentation
    is needed during this process, see Quill Current Account — required documentation.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: quill
- id: 9b482a0d-4f1b-5fbd-b29f-25f117fb77d5
  title: open_account tool reference
  body: 'The `open_account` tool allows an agent to create a new financial product
    for a customer. The agent performs this action by calling the tool directly once
    the customer''s identity has been verified.


    **Tool Signature:**

    `open_account(full_name: string, date_of_birth: string, contact_email: string,
    contact_phone: string, product_id: string)`


    **Arguments:**

    - `full_name`: The customer''s full legal name as provided during the conversation.

    - `date_of_birth`: The customer''s date of birth (DD/MM/YYYY).

    - `contact_email`: The email address the customer wishes to associate with the
    account.

    - `contact_phone`: The mobile phone number provided by the customer.

    - `product_id`: The identifier for the specific product being opened (e.g., `current_account`,
    `quill_plus`, or `instant_access_savings`).


    **Effect:**

    This tool initiates the account opening process, creating the account record and
    associating it with the provided personal details. The result is a confirmation
    that the account has been successfully established.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: quill
- id: 57d1071b-3e31-5642-95d6-d603f5f31f40
  title: When to use close_account
  body: 'We provide a straightforward process for customers who wish to end their
    relationship with Quill. The `close_account` tool is used when a customer explicitly
    requests the permanent closure of one or more of their accounts.


    Because closing an account is an irreversible action, agents must ensure all regulatory
    and security prerequisites are met before proceeding. We adhere to the Consumer
    Duty to ensure customers are fully aware of the implications of closure, such
    as the loss of access to specific features or the termination of a `quill_plus`
    subscription.


    **Procedure for Account Closure:**


    1. **Identity Verification:** Perform rigorous identity verification using the
    required biometric or multi-factor authentication checks to ensure the request
    is legitimate.

    2. **Account Identification:** Use the `get_accounts` tool to resolve the customer''s
    account details from the last four digits of their account number, identifying
    the specific `account_id` to be closed.

    3. **Balance Clearance:** Verify that the account balance is exactly £0. If there
    are remaining funds, the agent must guide the customer to move the money using
    the `transfer_funds` tool. If there is a negative balance (e.g., an utilised overdraft),
    the customer must clear the debt before the account can be closed.

    4. **Dependency Check:** Confirm that no pending transactions, disputes, or active
    `payments` are awaiting settlement. If a dispute is active, refer to the guidance
    in the relevant dispute policy.

    5. **Final Confirmation:** Clearly explain to the customer that this action is
    irreversible and that the account will be closed immediately.

    6. **Execution:** Call the `close_account` tool using the verified `account_id`
    to complete the process.


    For detailed guidance on how to handle the account closure flow, agents can refer
    to the sibling document: Quill Current Account — cancel, close, or downgrade.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: quill
- id: 77bdd612-df3c-5e95-bb0c-41389c9c97d8
  title: close_account tool reference
  body: 'The `close_account` tool is used to permanently terminate a customer''s account.
    The agent performs this action by calling the tool directly after the customer
    has been verified and the account balance has been cleared to £0.


    **Tool Signature:**

    `close_account(account_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the account to be closed. This value
    is typically retrieved via the `get_accounts` tool during the procedure.


    **Effect:**

    This tool marks the specified account as closed in our systems. This is an irreversible
    state-changing action. Once executed, the account can no longer be used for transactions,
    and any associated services (such as a `quill_plus` subscription) are terminated.
    The tool returns a confirmation of the successful closure.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: quill
- id: 13e49615-6b58-5b50-83b2-92a6aca118a9
  title: When to use update_contact_info
  body: 'To maintain a high standard of account security and ensure the delivery of
    critical regulatory communications, we require that all customer contact information
    is accurate and up to date. The `update_contact_info` tool is used when a customer
    notifies us of a change to their primary email, mobile phone number, or residential
    address.


    Updating contact information is a state-changing action that could potentially
    be exploited by fraudsters to hijack account access. Therefore, we apply rigorous
    identity verification before any updates are processed.


    **Procedure for Updating Contact Information:**


    1. **Identity Verification:** The agent must successfully complete the mandatory
    identity verification process, including in-app biometric checks or multi-factor
    authentication, before discussing or changing any account details.

    2. **Information Gathering:** Ask the customer to provide the new details they
    wish to record. The agent must clearly confirm the spelling of the email address
    and the accuracy of the phone number and postal address.

    3. **Verification of Intent:** Confirm with the customer that these changes should
    apply to all their Quill products (e.g., their `current_account` and `instant_access_savings`
    pots).

    4. **Execution:** Call the `update_contact_info` tool using the new details provided
    by the customer.

    5. **Confirmation:** Inform the customer that their records have been updated
    and advise them to check their app for a confirmation notification.


    For further details on managing account modifications, see: Quill Current Account
    — make a change or update.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: quill
- id: ecae6039-073a-5273-ac82-74688a33efa5
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool allows an agent to modify a customer''s primary
    contact details. The agent performs this action by calling the tool directly following
    successful identity verification.


    **Tool Signature:**

    `update_contact_info(email: string, phone_number: string, address: string)`


    **Arguments:**

    - `email`: The updated email address provided by the customer.

    - `phone_number`: The updated mobile phone number provided by the customer.

    - `address`: The updated residential address provided by the customer.


    **Effect:**

    This tool updates the customer''s profile in the core banking system. These changes
    are applied globally across all the customer''s products. The tool returns a confirmation
    once the profile has been successfully updated.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: quill
- id: 1f6008ad-097d-5af0-b60c-f8300b34d443
  title: When to use get_statements
  body: 'Customers may request account statements for various reasons, including financial
    auditing, loan applications, or personal budgeting. The `get_statements` tool
    is the authoritative mechanism for agents to retrieve these records on behalf
    of a customer.


    We ensure that statement delivery is secure and that only the authorised account
    holder or a registered power of attorney (managed via `manage_authorized_users`)
    can access this sensitive financial data.


    **Procedure for Retrieving Statements:**


    1. **Identity Verification:** Complete the mandatory identity verification process.
    This is critical as statements contain full transaction histories and sensitive
    account data.

    2. **Account Identification:** Use the `get_accounts` tool to identify the specific
    `account_id` for which the statement is required (e.g., a `current_account` or
    an `instant_access_savings` account).

    3. **Define Parameters:** Determine the specific timeframe the customer requires.
    The agent must obtain a precise start date and end date for the statement period.

    4. **Execution:** Call the `get_statements` tool using the verified `account_id`
    and the date range specified by the customer.

    5. **Delivery:** Provide the statement information to the customer through the
    secure in-app chat or email channel as per our service model.


    For more information on monitoring account history, refer to: Quill Current Account
    — check status or history.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: quill
- id: d0f4c409-ee02-5899-9c28-731d518349b3
  title: get_statements tool reference
  body: 'The `get_statements` tool retrieves the transaction history for a specific
    account over a defined period. The agent performs this action by calling the tool
    directly after the customer''s identity has been verified.


    **Tool Signature:**

    `get_statements(account_id: string, start_date: string, end_date: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the account. This is typically obtained
    via the `get_accounts` tool.

    - `start_date`: The start date of the statement period (YYYY-MM-DD).

    - `end_date`: The end date of the statement period (YYYY-MM-DD).


    **Effect:**

    This tool queries the ledger for all transactions associated with the `account_id`
    between the two provided dates. The tool returns the statement data, which the
    agent then presents to the customer.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: quill
- id: ae9bd7d1-efe9-588b-b969-2c59f25cd30d
  title: When to use set_alerts
  body: "As part of our commitment to financial wellness, we provide users with the\
    \ ability to set proactive notifications regarding their account activity. The\
    \ `set_alerts` tool is used when a customer wants to establish triggers for balance\
    \ thresholds or specific transaction types to help them manage their spending\
    \ more effectively.\n\n**Procedure for Setting Alerts:**\n\n1. **Identity Verification:**\
    \ Perform the mandatory identity verification to ensure the agent is modifying\
    \ the correct user's notification settings.\n2. **Account Identification:** Use\
    \ the `get_accounts` tool to find the `account_id` for the account the user wishes\
    \ to monitor.\n3. **Configure Alert Criteria:** Discuss with the customer what\
    \ specific trigger they want. Common examples include:\n    - Balance alerts:\
    \ Notify the user when the balance drops below a certain amount.\n    - Deposit\
    \ alerts: Notify the user when a payment is received.\n    - High-value transaction\
    \ alerts: Notify the user when a payment exceeds a specific threshold.\n4. **Set\
    \ Thresholds:** Agree on the exact numeric value that will trigger the alert.\n\
    5. **Execution:** Call the `set_alerts` tool using the `account_id`, the chosen\
    \ `alert_type`, and the agreed-upon `threshold`.\n6. **Confirmation:** Confirm\
    \ to the customer that the alert is now active and will be delivered via in-app\
    \ notifications or email.\n\nFor further assistance with account preferences,\
    \ refer to: Quill Current Account — make a change or update."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: quill
- id: 3099a516-166c-5958-ba7c-202f4ac6818c
  title: set_alerts tool reference
  body: 'The `set_alerts` tool configures automated notifications for a customer''s
    account. The agent performs this action by calling the tool directly following
    identity verification.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_type: string, threshold: number)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, typically retrieved via
    `get_accounts`.

    - `alert_type`: The category of alert the customer wants (e.g., ''low_balance'',
    ''large_transaction'').

    - `threshold`: The numeric value that triggers the alert (e.g., 50 for a £50 balance
    alert).


    **Effect:**

    This tool creates or updates a notification trigger in the system. When the account
    state meets the specified threshold, the system will automatically send a notification
    to the customer. The tool returns a confirmation of the alert configuration.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: quill
- id: 640a1ee2-70be-595a-a496-292ae4740f8d
  title: When to use transfer_funds
  body: 'Moving money is a core function of the Quill experience. The `transfer_funds`
    tool is used when a customer wishes to move money between their own accounts (such
    as moving funds from a `current_account` into `instant_access_savings` pots) or
    to send a payment to another person or business.


    All transfers are subject to our security protocols and product limits. Specifically,
    for `payments`, there is a strict daily limit of £10,000. Agents must ensure that
    the requested transfer does not exceed this limit and that the customer has sufficient
    available funds to cover the transaction.


    **Procedure for Transferring Funds:**


    1. **Identity Verification:** Complete the mandatory identity verification process.
    Since this is a state-changing action involving the movement of money, biometric
    or multi-factor checks are required.

    2. **Source Account Identification:** Use the `get_accounts` tool to resolve the
    `account_id` from which the funds will be withdrawn.

    3. **Beneficiary Details:** Obtain the recipient''s details. For external transfers,
    this includes the name, sort code, and account number. We employ Confirmation
    of Payee to verify the recipient''s name matches the account details before the
    payment is sent.

    4. **Amount and Limit Check:** Confirm the exact amount to be transferred. The
    agent must verify that the total transfers for the day do not exceed the daily
    limit of £10,000.

    5. **Execution:** Call the `transfer_funds` tool with the source `account_id`,
    the destination details, and the amount.

    6. **Confirmation:** Provide the customer with a confirmation of the transfer
    and, if applicable, the estimated arrival time of the funds.


    For more information on payment limits and security, see: Quill Payments — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: quill
- id: b9ab31b0-f1db-586c-a77b-0cdb5a85c7e5
  title: transfer_funds tool reference
  body: 'The `transfer_funds` tool is used to move money between a customer''s Quill
    account and an external account. The agent performs this action by calling the
    tool directly once the customer''s identity has been verified.


    **Tool Signature and Arguments**

    - `from_account_id` (string): The unique identifier of the customer''s source
    account, obtained via `get_accounts`.

    - `to_account_number` (string): The recipient''s 8-digit account number.

    - `to_sort_code` (string): The recipient''s 6-digit sort code.

    - `to_account_name` (string): The full name of the recipient as provided by the
    customer.

    - `amount` (string): The total value to be transferred, formatted as a decimal
    (e.g., "100.00").

    - `currency` (string): The currency of the transfer (default is "GBP").


    **Effect**

    Calling this tool initiates a secure transfer of funds. All Quill Payments are
    processed with £0 fees. Agents must ensure the transfer does not exceed the daily
    limit of £10,000 per person. The tool integrates with Confirmation of Payee to
    verify the recipient''s name matches the account details before the payment is
    sent.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: quill
- id: 59ec4498-1ba6-53ee-9adf-d0697e702bf6
  title: When to use order_replacement_card
  body: 'We provide replacement cards to customers when their current Quill Debit
    Card is lost, stolen, or physically damaged. To ensure the security of our users''
    funds and adhere to our strict verification standards, agents must follow this
    procedure before initiating a replacement.


    **Applicable Scenarios**

    1. **Lost or Stolen**: If a customer reports their card missing, the agent must
    first ensure the card is frozen to prevent unauthorised transactions before ordering
    a replacement.

    2. **Damaged**: If the physical card is worn or the chip/magnetic strip is malfunctioning.

    3. **Expired**: While we typically send replacements automatically, an agent may
    manually trigger one if the customer has not received their new card.


    **Procedure for Agents**

    1. **Verify Identity**: Perform a rigorous identity verification using multi-factor
    authentication and in-app biometric checks as per our security protocol.

    2. **Resolve Account**: Use the `get_accounts` tool to retrieve the correct `account_id`
    associated with the customer''s last-4 digits of their account number.

    3. **Assess Card Status**: If the card is lost or stolen, call the `freeze_card`
    tool immediately to protect the account.

    4. **Execute Replacement**: Call the `order_replacement_card` tool, specifying
    the `account_id` and the reason for the replacement (e.g., ''lost'', ''stolen'',
    or ''damaged'').

    5. **Confirm Delivery**: Inform the customer that the replacement card will be
    delivered to their registered address on file.


    For more information on the features of the replacement card, including the £200
    monthly fee-free ATM allowance, refer to Quill Debit Card — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: quill
- id: 39247ad5-6f61-5cc3-9090-6414875d03db
  title: order_replacement_card tool reference
  body: 'The `order_replacement_card` tool allows agents to request a new physical
    Quill Debit Card for a customer. The agent performs this action by calling the
    tool directly in the conversation following identity verification.


    **Tool Signature and Arguments**

    - `account_id` (string): The unique identifier for the account linked to the card,
    retrieved via the `get_accounts` tool.

    - `reason` (string): The justification for the replacement. Acceptable values
    include ''lost'', ''stolen'', or ''damaged''.


    **Effect**

    Calling this tool triggers the production and dispatch of a new physical debit
    card to the customer''s verified postal address. If the reason is ''lost'' or
    ''stolen'', the system will automatically invalidate the previous card''s credentials
    if they were not already frozen. The new card will arrive in an inactive state
    and will require activation before it can be used for spending or ATM withdrawals.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: quill
- id: 4761aeab-fe96-519b-adb1-d7b655b2e6ce
  title: When to use pay_bill
  body: "The `pay_bill` functionality is designed to help customers settle one-off\
    \ invoices or utility bills directly from their Quill account. This is distinct\
    \ from setting up a recurring Direct Debit, as it handles a specific, immediate\
    \ payment request.\n\n**Applicable Scenarios**\n- A customer wishes to pay a specific\
    \ bill manually through an agent's assistance.\n- A customer needs to make a payment\
    \ to a service provider that does not support automated pull-payments (Direct\
    \ Debits).\n- A one-time payment is required for a professional service or utility.\n\
    \n**Procedure for Agents**\n1. **Verify Identity**: Confirm the customer's identity\
    \ using our mandatory multi-factor authentication and biometric verification process.\n\
    2. **Resolve Account**: Use the `get_accounts` tool to identify the correct `account_id`\
    \ from which the funds will be drawn.\n3. **Collect Payment Details**: Obtain\
    \ the following information from the customer:\n    - The full name of the bill\
    \ payee.\n    - The bill reference number (to ensure the payee can allocate the\
    \ payment correctly).\n    - The exact amount to be paid.\n4. **Execute Payment**:\
    \ Call the `pay_bill` tool using the gathered `account_id`, payee name, bill reference,\
    \ and amount.\n5. **Final Confirmation**: Confirm to the customer that the payment\
    \ has been submitted. Remind them that this is a manual payment and not a recurring\
    \ instruction.\n\nBecause we believe essential banking should be accessible, these\
    \ bill payment services are provided with £0 fees for users of the Quill Current\
    \ Account and Quill Plus. For more details on account costs, see Quill Current\
    \ Account — fee schedule."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: quill
- id: 6c4ff4fc-1bd3-5dfa-9cfc-495995274154
  title: pay_bill tool reference
  body: 'The `pay_bill` tool is used to process a one-time payment to a specified
    bill payee. The agent performs this action by calling the tool directly after
    the customer has been verified.


    **Tool Signature and Arguments**

    - `account_id` (string): The unique identifier of the customer''s account, obtained
    via `get_accounts`.

    - `bill_payee_name` (string): The name of the company or individual being paid.

    - `bill_reference` (string): The unique reference number provided by the payee
    for the invoice or account.

    - `amount` (string): The amount to be paid, formatted as a decimal (e.g., "45.50").


    **Effect**

    Calling this tool initiates an immediate transfer of the specified amount from
    the customer''s account to the bill payee. The payment is processed as a one-off
    transaction. Agents should be aware that this tool does not create a recurring
    payment schedule; for recurring payments, the customer should manage their Direct
    Debits via the app or by using the `stop_payment` tool to modify existing ones.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: quill
- id: 7b12af54-ab04-544e-975d-5f3e4af8f9ee
  title: When to use activate_card
  body: 'To maintain the highest standard of account security, all physical Quill
    Debit Cards are shipped in an inactive state. They must be activated before they
    can be used for any point-of-sale transactions or ATM withdrawals. Agents should
    guide customers through this process if they are unable to activate the card via
    the in-app biometric check.


    **Applicable Scenarios**

    - A customer has just received their first Quill Debit Card after opening a new
    account.

    - A customer has received a replacement card following a loss, theft, or damage
    report.


    **Procedure for Agents**

    1. **Verify Identity**: The agent must first verify the customer''s identity using
    rigorous multi-factor authentication. This is a mandatory state-changing action.

    2. **Collect Card Details**: Ask the customer for the last 4 digits of the physical
    card they have received. This ensures the agent is activating the correct piece
    of plastic.

    3. **Execute Activation**: Call the `activate_card` tool using the provided card
    identifiers.

    4. **Confirmation**: Once the tool returns a success message, inform the customer
    that their card is now active and ready for use.

    5. **Security Reminder**: Advise the customer to immediately set up their card
    controls in the app, including gambling blocks if desired, to enhance their financial
    wellness.


    For a step-by-step walkthrough of the overall onboarding and card process, customers
    can be referred to Quill Debit Card — set up and activate.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: quill
- id: 4cf500e6-7963-537a-87b5-45df933f4174
  title: activate_card tool reference
  body: 'The `activate_card` tool is used to change the status of a physical Quill
    Debit Card from inactive to active. The agent performs this action by calling
    the tool directly after identity verification is complete.


    **Tool Signature and Arguments**

    - `card_number_last_4` (string): The final four digits of the physical card the
    customer is attempting to activate.

    - `verification_token` (string): A temporary token generated by the system after
    a successful biometric or MFA check during the current session.


    **Effect**

    Calling this tool activates the specified card for immediate use. Once active,
    the card can be used for global payments with 0% foreign transaction fees. If
    the card was previously frozen or is a replacement for a stolen card, this action
    ensures that only the newest physical card is authorised for use, while all previous
    card versions remain permanently disabled.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: quill
- id: 849c3138-1b07-51c2-a72b-fc0581565354
  title: When to use dispute_status
  body: "Quill is committed to the rapid resolution of payment disputes. When a customer\
    \ has filed a dispute for a card payment via the chargeback process, they may\
    \ contact us to check the current progress of their claim. Agents use this procedure\
    \ to provide transparent updates on these requests.\n\n**Applicable Scenarios**\n\
    - A customer wants to know if their dispute has been reviewed.\n- A customer is\
    \ asking for the expected timeframe for a final response.\n- A customer wants\
    \ to know if any additional evidence is required to progress their claim.\n\n\
    **Procedure for Agents**\n1. **Verify Identity**: Perform a full identity verification\
    \ using our mandatory security checks.\n2. **Identify the Dispute**: \n    - If\
    \ the customer provides a dispute reference ID, use that.\n    - If they do not\
    \ have a reference, use the `get_account_transactions` tool to identify the disputed\
    \ transaction and locate the associated dispute ID.\n3. **Check Status**: Call\
    \ the `dispute_status` tool using the dispute ID to retrieve the current state\
    \ of the investigation.\n4. **Communicate Timeline**: Inform the customer of the\
    \ status. Explicitly state that we provide final responses for payment services\
    \ within 15 business days, in line with our commitment to rapid resolution.\n\
    5. **Next Steps**: If the status indicates a need for more information, guide\
    \ the customer on how to upload the required documents via the app.\n\nFor further\
    \ information on how we protect customers from fraud and the reimbursement of\
    \ authorised push payment scams up to £85,000, refer to Quill Payments — fraud\
    \ and unauthorised-activity protection."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: quill
- id: c857c5f4-bc0c-5e8b-b7c3-1ab67713ee37
  title: dispute_status tool reference
  body: 'The `dispute_status` tool provides the current progress and status of a transaction
    dispute filed through the card scheme''s chargeback process. The agent performs
    this action by calling the tool directly after identity verification.


    **Tool Signature and Arguments**

    - `dispute_id` (string): The unique reference identifier for the dispute, which
    can be provided by the customer or found via transaction history.


    **Effect**

    Calling this tool returns the current status of the dispute (e.g., ''Pending'',
    ''Under Review'', ''Resolved'' or ''Closed'') and any internal notes regarding
    the current stage of the chargeback process. This allows the agent to provide
    the customer with a clear, non-opaque update on their case. The tool does not
    allow the agent to change the outcome of a dispute; it is a read-only function
    intended for transparency and customer support.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: quill
