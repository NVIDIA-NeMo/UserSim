  body: 'Upgrading to Quill Plus is a frictionless process handled entirely within
    your secure conversation with us. Before you begin, please ensure you have your
    mobile device ready to complete the necessary biometric security checks.


    1. Tell us that you would like to upgrade your account to Quill Plus. We will
    then check your account eligibility and confirm the current subscription terms.


    2. We will prompt you to perform an in-app biometric check. This is a mandatory
    security step to verify your identity before we make any state-changing action
    to your account settings.


    3. We will present the final terms for your confirmation. You must explicitly
    agree to the monthly fee of £7 and acknowledge the minimum term of 3 months. Please
    confirm your agreement to these terms in the chat.


    4. Once your confirmation is received and your identity is verified, we will activate
    the premium tier. You will receive an instant notification in the app confirming
    that Quill Plus is now active on your account.


    5. You can now access the premium enhancements immediately. Your first monthly
    fee of £7 will be applied to your account balance according to our standard billing
    cycle.


    If you are comparing this process against other banking alternatives, you will
    find that our approach is designed for agility, removing the need for physical
    paperwork or lengthy waiting periods. For a detailed comparison of the costs and
    benefits, you may wish to see Quill Plus — vs. a similar product here.'
