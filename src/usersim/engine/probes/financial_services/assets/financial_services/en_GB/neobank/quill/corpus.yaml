- id: 8cfc671c-63e4-5ebb-8ba2-82f79234234d
  title: Quill Plus — a failed or pending action
  body: "If you have attempted to upgrade to Quill Plus and your request is showing\
    \ as 'pending' or has failed, it is usually due to one of three common reasons.\n\
    \n**Symptom: The upgrade is stuck in 'pending' status**\nThis most frequently\
    \ occurs if the identity verification process was not completed. Because upgrading\
    \ is a state-changing action, we require a successful biometric check. \n- **Check:**\
    \ Ensure you have responded to the biometric prompt in the app.\n- **Fix:** If\
    \ you missed the prompt, tell us to resend the verification request. Once you\
    \ complete the check, the status should update automatically.\n\n**Symptom: The\
    \ upgrade action failed immediately**\nThis is often caused by insufficient funds\
    \ to cover the initial subscription cost. \n- **Check:** Review your current balance\
    \ to ensure you have at least £7 available.\n- **Fix:** Top up your account balance\
    \ and then ask us to restart the upgrade process.\n\n**Symptom: Error during the\
    \ agreement phase**\nIf the action fails after you have confirmed the terms, it\
    \ may be due to a mismatch in the acknowledged minimum term.\n- **Check:** Ensure\
    \ you have explicitly agreed to the minimum term of 3 months.\n- **Fix:** Re-confirm\
    \ your agreement to both the £7 monthly fee and the 3-month minimum term in the\
    \ chat.\n\n**When to escalate**\nIf you have verified your funds, completed the\
    \ biometric check, and agreed to the 3-month term but the upgrade still fails,\
    \ we will escalate your query to our tiered specialist path. We will raise a technical\
    \ case on your behalf and notify you via email once the issue is resolved. You\
    \ can expect a response regarding the resolution within our standard regulatory\
    \ response timelines."
