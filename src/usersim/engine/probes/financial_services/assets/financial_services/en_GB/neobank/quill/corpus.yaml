- id: a2b77f10-a568-5fd4-ab1b-261f01907349
  title: Quill Debit Card — vs. a typical competitor offering
  body: "When comparing the Quill Debit Card to typical high-street bank offerings,\
    \ the primary differences lie in transparency and international utility.\n\nMost\
    \ traditional banks charge a non-sterling transaction fee, often ranging from\
    \ 2% to 3% on every purchase made abroad. In contrast, we offer a 0% foreign transaction\
    \ fee, making the Quill Debit Card the superior choice for frequent travellers\
    \ or those shopping from international websites.\n\nRegarding cash, many competitors\
    \ charge a flat fee for every single overseas ATM withdrawal. We provide a generous\
    \ £200 monthly fee-free ATM allowance. Only after this limit is exceeded do we\
    \ apply a 3% fee. \n\nQuill is the ideal choice for the digitally native user\
    \ who wants a frictionless, app-first experience with no hidden currency mark-ups.\
    \ A traditional bank may be better only for those who require physical branch\
    \ access for complex cash deposits, but for daily spending and global agility,\
    \ our structure is designed to be fairer and more transparent."
  domain: cards
  product_category: debit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: 029d1970-47de-597d-a507-bf439238e50b
  title: Quill Debit Card — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the use
    of the Quill Debit Card.


    Your funds are held in accounts that are protected by the Financial Services Compensation
    Scheme (FSCS), which guarantees eligible deposits up to £120,000 per person, per
    institution. This protection is a critical safety net provided under the supervision
    of the FCA and PRA.


    Users should be aware of the specific costs associated with cash withdrawals.
    While we provide a monthly allowance of £200 for fee-free ATM withdrawals abroad,
    any amount withdrawn in excess of this limit will incur a fee of 3%. This fee
    is variable based on the total amount withdrawn and can impact the overall cost
    of obtaining cash abroad.


    While we offer a 0% foreign transaction fee on purchases, please note that this
    does not eliminate the risk of exchange rate volatility. The value of your balance
    in Sterling may fluctuate based on the market rates at the time the transaction
    is processed.


    We operate under the Consumer Duty, meaning we are committed to delivering fair
    outcomes. We will never employ opaque jargon to hide costs. All fees, including
    the 3% ATM overage fee, are presented clearly in our fee schedules. For further
    information on our regulatory posture, please see Quill Current Account — regulatory
    disclosures.'
  domain: cards
  product_category: debit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: quill
- id: bd1eabf8-91fc-5c78-b90b-455bb57fde51
  title: Quill Debit Card — how rates are tiered and applied
  body: 'The Quill Debit Card utilises a transparent fee structure designed to eliminate
    common banking surcharges. Rates are applied as follows:


    Foreign Transaction Fee: A flat rate of 0% is applied to all purchases made in
    a non-sterling currency. This rate applies to all balances and all users, regardless
    of their account tier.


    ATM Withdrawal Rates (Abroad):

    - For the first £200 of withdrawals each calendar month: 0% fee.

    - For any amount withdrawn above the £200 monthly allowance: 3% fee.


    These rates are applied at the point of transaction. The 3% fee for ATM withdrawals
    is triggered automatically once the aggregate total of your overseas cash withdrawals
    for the month exceeds the £200 threshold. This is a flat percentage and does not
    scale further based on the amount withdrawn.'
  domain: cards
  product_category: debit_card
  document_type: rate_sheet
  source_authority: official
