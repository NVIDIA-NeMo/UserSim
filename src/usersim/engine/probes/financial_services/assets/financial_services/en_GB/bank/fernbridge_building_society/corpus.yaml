- id: 1845f84c-012a-583b-a7c1-9fc804b6d460
  title: Fernbridge Easy Access Saver — set up and activate
  body: 'Setting up your Fernbridge Easy Access Saver is a straightforward process
    designed to get you saving as quickly as possible. Before you begin, please ensure
    you have a valid form of government-issued photo identification and the details
    of your external current account.


    1. Request the opening of a Fernbridge Easy Access Saver account. We will begin
    by confirming your eligibility and the purpose of the account.

    2. Provide your identity documentation for verification. To ensure the security
    of all our members, we perform rigorous identity checks before any account is
    activated. This may include a request for a digital copy of your passport or driving
    licence.

    3. Specify your Nominated Bank Account. As we do not issue our own current accounts
    or cards, you must provide the details of the external current account where we
    will send your funds when you choose to withdraw them.

    4. Complete the multi-factor authentication process. We will send a verification
    code to your registered mobile device to ensure that you are the authorised account
    holder.

    5. Transfer the minimum opening deposit of £1 from your Nominated Bank Account
    to Fernbridge. This small initial payment activates your account and begins the
    process of earning interest.


    Once the transfer is received and the identity checks are finalised, we will confirm
    that your account is active. You will then be able to add further funds at any
    time to take advantage of the 3.6% interest rate. You can track your balance and
    interest growth through our secure digital messaging service during UK business
    hours. For more information on how to manage your account once it is active, you
    may find the Fernbridge Easy Access Saver — overview helpful.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: how_to_guide
  source_authority: official
