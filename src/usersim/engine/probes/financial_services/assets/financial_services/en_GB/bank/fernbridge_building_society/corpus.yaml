  title: Fernbridge Easy Access ISA — interest rate / AER schedule
  body: 'The Fernbridge Easy Access ISA provides a straightforward interest structure
    to ensure members know exactly how their money is growing.


    - Current Interest Rate: 3.85% AER

    - Application: This is a flat rate that applies to all balances within the account,
    from the first pound up to the maximum annual ISA allowance of £20,000.

    - Interest Crediting: Interest is calculated daily and credited to the account
    periodically.


    Because this is a variable rate account, the 3.85% AER is not fixed. It may be
    adjusted by Fernbridge Building Society in response to changes in the UK base
    rate or other market conditions. We are committed to maintaining a fair and competitive
    rate that reflects our mutual values. We will notify members via secure digital
    messaging should there be a change to the applicable rate.'
