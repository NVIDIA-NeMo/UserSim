- id: 399eaaad-381c-557e-97bb-93a7ab9dd469
  title: Fernbridge Easy Access Saver — overview
  body: 'The Fernbridge Easy Access Saver is designed as a flexible, low-barrier entry
    point for our members to grow their everyday savings. As a member-owned mutual,
    we prioritise your financial wellbeing over shareholder profit, ensuring that
    our products are built on fairness and accessibility. This account is particularly
    suited for those who wish to keep their funds available for unexpected needs while
    still earning a competitive return.


    We have removed the typical barriers to saving; for instance, you can open this
    account with a minimum opening deposit of £1. This ensures that anyone, regardless
    of their current financial standing, can begin their journey towards a more secure
    future with us. Once opened, your funds remain accessible, providing the liquidity
    you need for peace of mind.


    Currently, the account offers an interest rate of 3.6%. This rate is applied to
    your balance to help your savings grow steadily over time. Because we are a mutual,
    we maintain a transparent pricing structure where fees are kept to a minimum and
    only applied to cover direct operational costs, meaning you can focus on growing
    your nest egg without worrying about hidden charges.


    For members who are disciplined savers and looking for a higher-interest incentive
    for consistent monthly contributions, we also offer the Fernbridge Members'' Regular
    Saver. Alternatively, if you have a sum of money that you do not need for a full
    year, the Fernbridge One-Year Fixed Rate Bond may provide a higher yield. We encourage
    all members to consider which vehicle best aligns with their current goals, whether
    that is immediate accessibility or long-term growth.


    Your deposits with us are secure. As we operate under the authority of the PRA
    and regulation by the FCA, your funds are protected by the FSCS up to £120,000
    per person. Temporary high balances are further protected up to £1.4 million for
    six months, ensuring your hard-earned savings are safe under our care.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 4e04fbfa-7587-513a-91ab-2974e57248db
  title: Fernbridge Easy Access Saver — interest rate (AER) explained
  body: '### How is the interest rate on my Fernbridge Easy Access Saver calculated?


    Your account earns an interest rate of 3.6%. This figure is quoted as an AER,
    which stands for Annual Equivalent Rate. The AER is a standardised way of showing
    what the interest rate would be if interest was paid and compounded each year.
    This allows you to compare our rates fairly against other savings products in
    the market.


    ### Will my interest rate change?


    Because the Fernbridge Easy Access Saver is a variable-rate account, the 3.6%
    rate may change in response to market conditions or changes in the base rate.
    We are committed to transparency and will inform you of any significant changes
    to your rate.


    ### How can I find more details about the rates we offer?


    For a concise summary of the current rates, please refer to the Fernbridge Easy
    Access Saver — interest rate / AER schedule. If you have further questions about
    how your savings are growing, we are available via telephone and secure digital
    messaging during UK business hours.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: faq
