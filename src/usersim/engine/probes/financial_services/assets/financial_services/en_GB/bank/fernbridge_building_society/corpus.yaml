- id: e112e75f-2fd4-5f52-822c-0343f1df859a
  title: Fernbridge First Home Five-Year Fixed Mortgage — vs. a similar product here
  body: 'When choosing a mortgage, first-time buyers often compare a fixed-rate product
    like the Fernbridge First Home Five-Year Fixed Mortgage against a variable-rate
    alternative.


    Dimensions of Comparison:

    - Cost Stability: Our product offers a fixed rate of 6.39% for five years, meaning
    payments are guaranteed. A variable-rate mortgage fluctuates with the market,
    which can lead to unpredictable monthly costs.

    - Entry Cost: With a £0 product fee, our offering is specifically designed to
    be more accessible than many variable products that charge upfront arrangement
    fees.

    - Lock-in: Our fixed mortgage has an early repayment charge of 5% in the first
    year, whereas variable mortgages often offer more flexibility to exit without
    penalty.

    - LTV Accessibility: We allow up to 95% LTV, making it suitable for those with
    smaller deposits.


    Who it suits:

    The Fernbridge First Home Five-Year Fixed Mortgage is ideal for disciplined savers
    and first-time buyers who prioritise budget certainty and want to avoid the risk
    of rising interest rates during their first five years of homeownership. A variable
    product may be better for those who expect to pay off their loan very quickly
    or who prefer to gamble on falling interest rates.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: comparison
  source_authority: official
