- id: 37703f24-7ee7-5ce7-ac3b-499e7365ab38
  title: Fernbridge Easy Access ISA — regulatory disclosures
  body: 'Fernbridge Building Society is authorised by the Prudential Regulation Authority
    (PRA) and regulated by the Financial Conduct Authority (FCA). We operate strictly
    in accordance with the Consumer Duty to ensure that all members receive fair outcomes
    and transparent communication.


    Member deposits held within the Fernbridge Easy Access ISA are protected by the
    Financial Services Compensation Scheme (FSCS). This protection covers up to £120,000
    per person. In the event of a temporary high balance (such as from the sale of
    a property), protection is extended up to £1.4 million for a period of six months.


    This product is a Cash ISA. As such, it is subject to the rules set by HM Revenue
    & Customs (HMRC). The current annual ISA allowance is £20,000. It is the member''s
    responsibility to ensure they do not exceed this limit across all their ISA holdings.
    We note that the government has indicated a change to the cash ISA allowance from
    April 2027, which is expected to be £12,000.


    All fund movements are subject to rigorous identity verification and multi-factor
    authentication to prevent fraud and unauthorised access. We do not provide individualised
    tax, legal, or financial planning advice. The information provided regarding this
    account is for educational purposes to help members make informed choices based
    on their own financial situation.


    Any unresolved disputes regarding this account can be escalated to the Financial
    Ombudsman Service free of charge after our internal Member Relations team has
    provided a final response, or if eight weeks have passed since the initial complaint.'
