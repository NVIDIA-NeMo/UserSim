- id: e71a2715-2c1b-5008-a322-0717535158b2
  title: Fernbridge First Home Five-Year Fixed Mortgage — cancel, close, or downgrade
  body: 'If you wish to exit your Fernbridge First Home Five-Year Fixed Mortgage—whether
    through full repayment (closing), selling the property, or switching to a different
    product (downgrading)—please follow these steps:


    1. Notify us of your intent: Tell us whether you intend to pay off the mortgage
    in full, sell the property, or request a product transfer. We will then verify
    your identity using our multi-factor authentication process.


    2. Request a redemption statement: Ask us for a final settlement figure. This
    statement will include the outstanding principal and any accrued interest. Importantly,
    if you are within the first year of your fixed term and are repaying more than
    your 10% overpayment allowance, we will calculate the 5% early repayment charge
    and include it in the total.


    3. Arrange the fund transfer: Provide the details of the Nominated Bank Account
    or the solicitor''s account from which the funds will be sent. Once the funds
    are received and verified, we will process the discharge of the mortgage.


    4. Confirm completion: We will send you a confirmation message via secure digital
    messaging once the loan is closed and the legal charge on the property has been
    released.


    If you are comparing this process against other lenders, note that our transparent
    fee structure ensures you are only charged for direct operational costs and the
    applicable early repayment charges as defined in your agreement. For further details
    on the fees involved, see Fernbridge First Home Five-Year Fixed Mortgage — fee
    schedule.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: how_to_guide
  source_authority: official
