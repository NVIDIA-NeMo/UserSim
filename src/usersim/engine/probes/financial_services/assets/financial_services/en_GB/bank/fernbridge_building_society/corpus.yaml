- id: 2fc3b4d2-5b54-57e0-b121-277a90fb0947
  title: Fernbridge Cash Lifetime ISA — fee schedule
  body: 'In line with our commitment to transparency and member value, Fernbridge
    Building Society keeps fees to a minimum, charging only to cover direct operational
    costs. The following charges apply to the Fernbridge Cash Lifetime ISA:


    - Account Opening Fee: £0

    - Monthly Maintenance Fee: £0

    - Government Bonus Administration: £0

    - Unauthorised Withdrawal Charge: 25%


    The withdrawal charge of 25% is applied to any funds removed from the account
    for reasons other than the purchase of a first home (up to the property price
    cap of £450,000) or retirement. This charge is a regulatory requirement and may
    result in the member receiving back less than their original contribution.'
