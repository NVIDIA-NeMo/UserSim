- id: 89e9be91-7892-5a34-b301-112674615de3
  title: Fernbridge Easy Access Saver — when to switch or upgrade
  body: 'This guide helps agents determine when a member''s financial goals may be
    better served by transitioning from the Fernbridge Easy Access Saver to another
    of our products.


    Continue with the Easy Access Saver if:

    The member prioritises flexibility and needs to be able to withdraw funds at any
    time without penalty. The 3.6% interest rate is ideal for emergency funds or short-term
    goals.


    Suggest a switch to the Fernbridge Members'' Regular Saver if:

    The member is a disciplined saver who can commit to consistent monthly deposits.
    This product is designed to reward regularity with a higher interest incentive
    than the 3.6% offered by the Easy Access Saver.


    Suggest an upgrade to the Fernbridge One-Year Fixed Rate Bond if:

    The member has a lump sum they do not need to access for a full year. By committing
    their funds, they can secure a higher yield than the flexible 3.6% rate, providing
    greater certainty for their returns.


    Key Decision Factors:

    - Flexibility: Easy Access Saver (High) vs. Fixed Rate Bond (Low).

    - Saving Pattern: Lump sum (Easy Access/Bond) vs. Monthly habit (Regular Saver).

    - Goal: Liquidity (Easy Access) vs. Maximising yield (Bond/Regular Saver).'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 42f0a4da-40e0-5dfd-bef1-69a8cc4d4cf9
  title: Fernbridge Easy Access Saver — comparison vs. alternatives and when not to
    choose it
  body: 'The Fernbridge Easy Access Saver is designed for members who value liquidity
    and a low barrier to entry. With a minimum opening deposit of £1 and an annual
    interest rate of 3.6%, it serves as an ideal foundation for any savings strategy.
    However, it may not be the most efficient choice for every financial goal.


    When to choose the Fernbridge Easy Access Saver:

    - Emergency Funds: Because there are no withdrawal restrictions, this is the best
    place for funds that must be available instantly.

    - Starting Small: The £1 opening deposit makes it accessible for those just beginning
    to save.

    - Unpredictable Timelines: If you aren''t sure when you will need your money,
    the 3.6% rate provides a fair return without locking you in.


    When to consider alternatives:

    - For Tax Efficiency: If you are concerned about tax on your interest, you may
    prefer a Fernbridge Easy Access ISA. While the Easy Access Saver is a standard
    taxable account, an ISA respects your annual allowance to help you save more tax-efficiently.

    - For Higher Yields: If you can commit your funds for a set period, the Fernbridge
    One-Year Fixed Rate Bond typically offers a higher yield than 3.6% in exchange
    for the lack of flexibility.

    - For Disciplined Monthly Saving: If you intend to save a fixed amount every month,
    the Fernbridge Members'' Regular Saver is specifically engineered to reward that
    consistency with higher interest rates.


    In summary, do not choose the Easy Access Saver if your primary goal is the absolute
    highest possible yield or tax avoidance; choose it when accessibility, fairness,
    and flexibility are your priorities.


    For a detailed breakdown of our other options, see Fernbridge Easy Access Saver
    — overview.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: product_sheet
  source_authority: official
