  institution_id: fernbridge_building_society
- id: fb1174f0-df76-592f-981a-2837d6e65386
  title: Fernbridge Cash Lifetime ISA — privacy and data handling
  body: 'At Fernbridge Building Society, we are committed to the transparent and secure
    handling of your personal and financial data. This disclosure explains how we
    manage information specifically for the Fernbridge Cash Lifetime ISA, in accordance
    with our duties under the FCA and PRA.


    Data Collection and Purpose:

    We collect and process your personal data to manage your account, calculate the
    3.75% interest, and verify your eligibility for the government bonus. Because
    the Fernbridge Cash Lifetime ISA is a government-backed scheme, we are required
    to share specific data—including your contributions and identity details—with
    HM Revenue & Customs (HMRC) to ensure the 25% bonus is correctly applied and to
    prevent fraud.


    Verification and Security:

    To protect your funds, we employ rigorous identity verification and multi-factor
    authentication. Your data is stored using industry-standard encryption. We only
    disclose your account information to third parties when legally required, or when
    you have explicitly authorised us to do so, such as during the property purchase
    process to verify the funds for a home up to £450,000.


    Member Rights:

    As a member of our mutual, you have the right to request a copy of the data we
    hold about you. You may also request the correction of any inaccurate personal
    details. Any such requests should be made through our secure digital messaging
    service.


    Compliance:

    We strictly adhere to the Consumer Duty to ensure fair outcomes for all members.
    Your deposits remain protected by the FSCS up to £120,000 per person, ensuring
    that your data and your money are handled with the highest level of regulatory
    oversight.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 20ae66c1-8a0f-593b-a956-ecc7f43a58d6
  title: Fernbridge Cash Lifetime ISA — recognising scams targeting this product
  body: 'As you compare the Fernbridge Cash Lifetime ISA against other savings options,
    it is important to be aware of specific fraudulent patterns that target individuals
    saving for their first home. Because this account offers a generous 25% government
    bonus, scammers often attempt to exploit the excitement surrounding this incentive.


    Common scam patterns include:


    1. Bonus Acceleration Scams: You may receive emails or messages claiming they
    can ''fast-track'' your 25% government bonus or offer a higher percentage than
    the statutory rate if you pay a ''processing fee'' to a third party. Fernbridge
    Building Society and the government will never ask for a fee to release your bonus.

    2. Impersonation of Official Bodies: Fraudsters may contact you pretending to
    be from HMRC or the government, requesting your account details or multi-factor
    authentication (MFA) codes to ''verify'' your eligibility for the bonus. We will
    never ask you for your security codes or passwords over the phone or via email.

    3. Fake Property Investment Schemes: Scammers may suggest transferring your Lifetime
    ISA funds into a ''guaranteed high-yield'' property investment, claiming it is
    a better alternative to a traditional home purchase. These are often fraudulent
    schemes designed to steal your deposit.


    If you notice any suspicious activity or receive a request that seems unusual,
    please tell us immediately. The first action you should take is to notify us of
    the incident so we can secure your account. To protect your funds, we employ rigorous
    identity verification and multi-factor authentication for all state-changing actions.


    Remember, your deposits are protected by the FSCS up to £120,000 per person, and
    temporary high balances are protected up to £1.4 million for six months, providing
    you with peace of mind as you save for your future home.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 55f42de2-5333-5686-ac07-536083f2c1af
  title: Fernbridge Cash Lifetime ISA — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational limits and restrictions of the Fernbridge Cash Lifetime ISA.


    **Core Product Limits**

    - Annual Deposit Limit: Members can save up to a maximum of £4,000 per tax year.
    Any attempt to deposit funds exceeding this limit must be declined.

    - Maximum Opening Age: A member must be aged 39 or under at the time of account
    opening. Once a member reaches age 40, they can no longer open a new Lifetime
    ISA, although they may continue to contribute to an existing one until age 50.

    - Property Price Cap: The account is intended for first homes with a purchase
    price not exceeding £450,000.


    **Financial Incentives and Penalties**

    - Government Bonus: A 25% government bonus is applied to qualifying deposits,
    subject to the £4,000 annual limit.

    - Unauthorised Withdrawal Charge: A withdrawal charge of 25% applies to any funds
    withdrawn for reasons other than purchasing a first home (under £450,000) or retirement.
    This charge is designed to recoup the government bonus and a portion of the original
    investment.

    - Interest Rate: The account earns an interest rate of 3.75%.


    **Edge Cases and Support Logic**

    - Over-contribution: If a member accidentally deposits more than £4,000 in a single
    tax year, the excess must be returned to the member. This is not a ''withdrawal''
    in the sense of the penalty, but a correction of an over-contribution.

    - Property Value Fluctuations: If a property''s price rises above £450,000 between
    the time of the LISA application and completion, the member may no longer be eligible
    to use the funds without incurring the 25% withdrawal charge.

    - Account Closure: Closing the account for any reason other than a qualifying
    home purchase or retirement will trigger the 25% withdrawal charge on the total
    balance.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: deb50de6-af23-5661-b702-ac6f5c0e2833
  title: Fernbridge Cash Lifetime ISA — withdrawal charge on unauthorised withdrawals
    explained
  body: "**What is the withdrawal charge on a Fernbridge Cash Lifetime ISA?**\nTo\
    \ encourage long-term saving for a first home or retirement, the government provides\
    \ a 25% bonus on your deposits. Because of this, there is a 25% withdrawal charge\
    \ if you take money out of the account for any reason other than buying your first\
    \ home (up to a value of £450,000) or reaching retirement age.\n\n**How does the\
    \ 25% withdrawal charge affect my money?**\nThis charge is applied to the total\
    \ amount you withdraw, including the government bonus and the interest earned.\
    \ In practice, this often means you will receive back less than your original\
    \ deposit if you withdraw the funds unauthorised. \n\n**Are there any exceptions\
    \ to this charge?**\nThe charge is waived only if the funds are used for a qualifying\
    \ first home purchase (within the £450,000 price cap), if the account holder reaches\
    \ retirement age, or in cases of terminal illness. For more details on how we\
    \ manage these accounts, you may wish to review the Fernbridge Cash Lifetime ISA\
    \ — overview."
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: bb36d373-2c6b-5c89-aec2-e0a863c6c90b
  title: Fernbridge Cash Lifetime ISA — check status or history
  body: 'As an existing member, you can easily review your progress towards your home
    ownership goal by checking your account status and transaction history.


    **What you will need**

    Before we can disclose any account information, we must perform a rigorous identity
    verification. Please have your personal identification details and your account
    number ready.


    **Steps to check your status**

    1. Tell us that you would like a summary of your Fernbridge Cash Lifetime ISA
    status and history.

    2. Complete the multi-factor authentication process we initiate to verify your
    identity.

    3. We will then provide you with your current total balance, which includes your
    personal contributions, the 3.75% interest earned, and the accumulated government
    bonuses.

    4. If you require a detailed breakdown, ask us for your contribution history for
    the current tax year. We will confirm how much of your £4,000 annual limit you
    have used and the remaining amount you can contribute.

    5. If you wish to see the specific dates and amounts of the government bonuses
    credited to your account, ask for a ''bonus history report''. We will provide
    a list of all bonus payments received.


    **How you know it has worked**

    Your request is complete once we have provided the final balance and confirmed
    the specific figures regarding your annual limit and bonus history. You will have
    a clear understanding of exactly how much has been saved and the remaining capacity
    for the current tax year.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3186aa54-75d3-5f9b-84b2-e49d856ebd11
  title: Fernbridge Cash Lifetime ISA — a declined or blocked action
  body: 'If you are comparing the Fernbridge Cash Lifetime ISA with other products
    and find that a specific action—such as a deposit or a transfer—has been declined
    or blocked, it is usually due to a specific regulatory or product limit.


    **Common Symptoms**

    - A deposit request is rejected immediately.

    - An attempt to open an account is blocked during the application process.

    - A fund movement is halted after identity verification.


    **Likely Causes and Solutions**


    1. Exceeding the Annual Limit

    - **Cause:** You have already deposited £4,000 into your Lifetime ISA within the
    current tax year.

    - **Check:** Review your current year''s contribution total.

    - **Fix:** You cannot deposit further funds until the new tax year begins. Please
    plan your deposits to fit within the £4,000 limit.


    2. Age Eligibility

    - **Cause:** You are attempting to open a new account but are aged 40 or over.

    - **Check:** Verify the date of birth provided on the application.

    - **Fix:** Because the maximum opening age for this product is 39, we cannot open
    a new account for you. We suggest reviewing the Fernbridge Easy Access ISA — overview
    as a potential alternative.


    3. Verification Failure

    - **Cause:** The multi-factor authentication or identity check failed.

    - **Check:** Ensure the details provided match our records exactly.

    - **Fix:** We will guide you through a secondary verification process. Once your
    identity is confirmed, the action can be re-attempted.


    **When to escalate**

    If you believe a block has been applied in error (for example, if you have not
    reached the £4,000 limit), tell us. We will raise a priority case with our Member
    Relations team to review the restriction. You will receive a confirmation of the
    resolution within 15 business days for payment-related issues.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: baba3b0e-3a11-5351-80a3-8efb8e1e7d97
  title: Fernbridge Cash Lifetime ISA — when to switch or upgrade
  body: 'This guidance helps support agents advise members on whether switching from
    or to the Fernbridge Cash Lifetime ISA is appropriate based on their financial
    goals.


    **When to recommend a switch to the Fernbridge Cash Lifetime ISA**

    Recommend this product if the member is aged 39 or under, is a first-time buyer,
    and intends to purchase a home valued at £450,000 or less. The primary driver
    is the 25% government bonus on deposits up to £4,000 per year, which significantly
    outperforms standard savings accounts.


    **When to recommend a switch away from the Lifetime ISA**

    Advise the member to consider the Fernbridge Easy Access ISA if:

    - They are no longer certain they will purchase a first home.

    - They need the flexibility to withdraw funds without a penalty.

    - The property they are eyeing exceeds the £450,000 price cap.


    **Critical Warning for Agents**

    Before proceeding with a switch or closure, you must clearly explain that any
    withdrawal not used for a qualifying first home or retirement will incur a 25%
    withdrawal charge. This charge may result in the member receiving back less than
    their original principal. Ensure the member understands this cost before any state-changing
    action is authorised.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 71d3db22-ccf6-5bd8-8c09-f5f7eebdbdf2
  title: Fernbridge Cash Lifetime ISA — comparison vs. alternatives and when not to
    choose it
  body: 'The Fernbridge Cash Lifetime ISA is a specialist tool designed for a specific
    purpose: helping first-time buyers and those saving for retirement. However, it
    is not the right choice for everyone.


    **Comparison with the Fernbridge Easy Access ISA**

    - **The Incentive:** The Cash Lifetime ISA provides a 25% government bonus on
    your savings, whereas the Easy Access ISA does not. This makes the Lifetime ISA
    vastly more powerful for those who meet the eligibility criteria.

    - **The Return:** Our Cash Lifetime ISA currently offers an interest rate of 3.75%.

    - **The Access:** The Easy Access ISA allows you to withdraw funds at any time
    without penalty. The Cash Lifetime ISA restricts access to first home purchases
    (up to £450,000) or retirement.


    **When NOT to choose the Fernbridge Cash Lifetime ISA**

    We recommend avoiding this product and considering the Fernbridge Easy Access
    ISA instead if:


    1. **You Need Liquidity:** If you might need your money for an emergency or a
    different life event, the 25% withdrawal charge makes this account unsuitable.
    You could lose a portion of your own original savings if you withdraw unauthorised.

    2. **Your Home Budget is Higher:** If you are certain the property you wish to
    buy will cost more than £450,000, you will not be able to use the account for
    the purchase without triggering the 25% penalty.

    3. **You Have Already Passed the Age Limit:** If you are aged 40 or over, you
    are ineligible to open this account.


    **Summary Table**

    | Feature | Cash Lifetime ISA | Easy Access ISA |

    | :--- | :--- | :--- |

    | Gov. Bonus | 25% | None |

    | Annual Limit | £4,000 | Standard ISA Limit |

    | Penalty | 25% for unauthorised withdrawal | None |

    | Property Cap | £450,000 | N/A |

    | Interest Rate | 3.75% | See rate sheet |'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 972f8797-6681-5bbb-88fc-efed0fdc47b5
  title: Fernbridge Cash Lifetime ISA — maximum price of a first home bought with
    the Lifetime ISA explained
  body: '**What is the maximum property price for the Fernbridge Cash Lifetime ISA?**

    To use your account funds and the 25% government bonus without penalty, the property
    you are purchasing must have a total price of £450,000 or less.


    **What happens if the home I buy costs more than £450,000?**

    If the purchase price exceeds £450,000, the withdrawal is considered ''unauthorised''.
    This means a 25% withdrawal charge will be applied to the funds you take out.
    Because this charge applies to both your contributions and the government bonus,
    you will likely receive back less than the amount you originally saved.


    **Does this limit apply to the mortgage or the total price?**

    The £450,000 limit applies to the total purchase price of the property, regardless
    of how much of it is covered by a mortgage or your deposit. If you believe your
    property may exceed this value, we recommend reviewing the Fernbridge Cash Lifetime
    ISA — comparison vs. alternatives and when not to choose it to see if a different
    savings vehicle is more appropriate.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: d1cd7897-78c7-54bd-bb1d-3fffbf893903
  title: Fernbridge Cash Lifetime ISA — resolve a common request end-to-end
  body: 'A common request from members comparing their savings is to verify the exact
    amount of government bonus they have accrued and confirm their current eligibility
    for the 25% incentive.


    **What you will need**

    As with all account actions, we require full identity verification. Please have
    your account number and personal details ready for the multi-factor authentication
    process.


    **Steps to resolve the request**

    1. Tell us that you wish to verify your government bonus status and current eligibility.

    2. Complete the security verification process we initiate to ensure your account
    remains protected.

    3. We will then analyse your account records to determine the total amount of
    personal contributions made within the current tax year, up to the £4,000 limit.

    4. We will calculate the total 25% government bonus that has been credited to
    your account to date and provide you with this figure.

    5. We will confirm your remaining contribution capacity for the current tax year
    so you know exactly how much more you can save to maximise the bonus.

    6. If you have a specific property in mind, tell us the estimated price. We will
    then confirm whether that price falls within the £450,000 cap required for a penalty-free
    withdrawal.


    **How you know it has worked**

    The request is resolved when you have received three specific pieces of information:
    your total accrued bonus, your remaining annual deposit limit, and confirmation
    of your eligibility based on your target property price. You now have a complete
    picture of the value of your Fernbridge Cash Lifetime ISA.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3aae626c-37da-571b-8686-58255c7f9b98
  title: Fernbridge Cash Lifetime ISA — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting members who report a discrepancy
    in their Fernbridge Cash Lifetime ISA records, most commonly regarding a missing
    government bonus or an incorrect balance.


    **Symptom**

    - The member states that they have deposited funds but the 25% government bonus
    has not yet appeared in their balance.

    - The member believes their interest (3.75%) has been applied incorrectly.


    **What to check (in order)**


    1. **Bonus Timing**

    - **Check:** Verify the date of the deposit. Government bonuses are not credited
    instantly; there is typically a lag between the deposit and the bonus payment.

    - **Fix:** If the deposit was made recently, explain that the 25% bonus is processed
    in cycles and will appear shortly. Provide the member with the expected timeframe
    for the next bonus credit.


    2. **Annual Limit Breach**

    - **Check:** Review the total deposits for the current tax year.

    - **Fix:** If the member deposited more than the £4,000 annual limit, the bonus
    will only apply to the first £4,000. Any excess funds will not attract a bonus
    and may need to be returned to the member as a correction.


    3. **Interest Calculation**

    - **Check:** Verify that the 3.75% interest rate is being applied to the full
    balance, including the government bonuses.

    - **Fix:** If a calculation error is found, calculate the correct amount and apply
    a correction immediately.


    **When to escalate**

    If the bonus is significantly overdue (beyond the standard government processing
    window) or the balance discrepancy cannot be resolved through the checks above,
    escalate the matter to the Member Relations team. We will conduct a full audit
    of the account. The member should be informed that we aim to provide a final response
    regarding payment services within 15 business days.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 1b69688c-dd62-5847-ae12-5c4635681256
  title: Fernbridge First Home Five-Year Fixed Mortgage — overview
  body: "We understand that stepping onto the property ladder for the first time can\
    \ be daunting. To support our members, we offer the Fernbridge First Home Five-Year\
    \ Fixed Mortgage, a high-LTV solution specifically engineered to help first-time\
    \ buyers secure their first home with confidence and stability.\n\nAs a member-owned\
    \ mutual, we prioritise your financial wellbeing over profit. This commitment\
    \ is reflected in our transparent pricing; notably, this product carries a £0\
    \ product fee, removing a significant initial cost for those entering the market.\
    \ \n\nKey features of this mortgage include:\n- An initial fixed interest rate\
    \ of 6.39%, ensuring your monthly payments remain unchanged for the first five\
    \ years of your term.\n- A maximum Loan-to-Value (LTV) of 95%, allowing you to\
    \ secure a home with a smaller deposit.\n- An Annual Percentage Rate of Charge\
    \ (APRC) of 7.1%, representing the overall cost of the loan over its full term.\n\
    - A flexible overpayment allowance of 10% of the outstanding balance per year,\
    \ enabling you to pay down your debt faster without penalty.\n\nAfter the initial\
    \ five-year fixed period ends, the loan will automatically revert to our Standard\
    \ Variable Rate (SVR) of 7.24%, unless you choose to switch to a different product.\
    \ \n\nTo protect your financial stability, we always perform a rigorous affordability\
    \ assessment before recommending this credit product. Please be aware that if\
    \ you wish to repay the mortgage in full or switch products during the first year,\
    \ an early repayment charge of 5% will apply. \n\nFor more details on the costs\
    \ associated with this product, you may refer to the Fernbridge First Home Five-Year\
    \ Fixed Mortgage — fee schedule."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 57041b73-5f64-5411-a60c-9027a289547e
  title: Fernbridge First Home Five-Year Fixed Mortgage — initial fixed interest rate
    explained
  body: 'Q: What is the initial fixed interest rate for my mortgage, and how does
    it work?


    A: Your mortgage carries an initial fixed rate of 6.39%. This means that for the
    first five years of your mortgage term, the interest rate remains constant regardless
    of any changes to the wider market. This provides you with the certainty that
    your monthly repayments will not increase during this period.


    Q: What happens when the five-year fixed period expires?


    A: Once the fixed term ends, your mortgage will transition to our Standard Variable
    Rate (SVR), which is currently 7.24%. Because the SVR can fluctuate, your monthly
    payments may change at that point. We recommend reviewing your options towards
    the end of your fixed term to see if another product better suits your needs.


    For a full breakdown of all applicable rates, please see the Fernbridge First
    Home Five-Year Fixed Mortgage — interest rate / AER schedule.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 258cab33-6e98-5c57-b53e-edb131164968
  title: Fernbridge First Home Five-Year Fixed Mortgage — set up and activate
  body: 'Securing your first home is a significant milestone. To activate the Fernbridge
    First Home Five-Year Fixed Mortgage, please follow these steps:


    1. Provide Documentation: Share your current proof of identity, proof of address,
    and evidence of your deposit funds. You will also need to provide recent payslips
    or tax returns to verify your income.

    2. Undergo Affordability Assessment: We will conduct a thorough review of your
    financial circumstances. This ensures the mortgage is sustainable for you and
    adheres to our commitment to fair outcomes under the Consumer Duty.

    3. Arrange Property Valuation: We will arrange for a professional valuation of
    the property you intend to purchase. This is necessary to confirm the property''s
    value and ensure the Loan-to-Value (LTV) does not exceed 95%.

    4. Receive and Accept the Mortgage Offer: Once the assessment and valuation are
    complete, we will issue a formal mortgage offer. This document will confirm your
    fixed rate of 6.39% and the total loan amount.

    5. Legal Completion: Your solicitor will coordinate with us to finalise the legal
    transfer of the property. We will then release the funds to your solicitor to
    complete the purchase.


    Once the funds are released and the property title is registered, your mortgage
    is active. You will receive a confirmation letter detailing your repayment schedule
    and the date your fixed term expires.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 73481a82-bea3-5fbd-bf77-637dab8cec65
  title: Fernbridge First Home Five-Year Fixed Mortgage — fee schedule
  body: 'The following fees apply to the Fernbridge First Home Five-Year Fixed Mortgage.
    In line with our mutual philosophy, we keep fees to a minimum to support our members.


    - Product Fee: £0

    - Early Repayment Charge (Year One): 5% of the outstanding loan balance


    Note: The £0 product fee is designed to lower the barrier for first-time buyers
    entering the property market. The early repayment charge applies only if the loan
    is repaid in full or switched to another product within the first twelve months
    of the mortgage term.'
