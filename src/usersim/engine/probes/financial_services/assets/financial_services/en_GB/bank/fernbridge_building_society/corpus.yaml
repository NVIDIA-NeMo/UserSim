- id: af55f1f7-1486-5036-a018-059b2541d348
  title: Fernbridge Cash Lifetime ISA — vs. a similar product here
  body: 'When choosing between the Fernbridge Cash Lifetime ISA and the Fernbridge
    Easy Access ISA, the decision typically rests on your goal and your need for flexibility.


    Fernbridge Cash Lifetime ISA:

    - Primary Benefit: A 25% government bonus on all qualifying contributions.

    - Interest Rate: 3.75%.

    - Deposit Limit: £4,000 per tax year.

    - Lock-in: Funds are intended for a first home (up to £450,000) or retirement.
    Unauthorised withdrawals incur a 25% charge.

    - Best for: First-time buyers and long-term savers who are certain they will not
    need the funds until they buy a home or retire.


    Fernbridge Easy Access ISA:

    - Primary Benefit: High flexibility with no penalties for withdrawals.

    - Deposit Limit: Respects the standard annual ISA allowance.

    - Lock-in: None; funds can be accessed as needed.

    - Best for: Those who want tax-efficient savings but require the ability to withdraw
    money for emergencies or unplanned expenses.


    For more details on the latter, see the Fernbridge Easy Access ISA — overview.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c922cec3-9b17-5adc-a03e-945114f00a2e
  title: Fernbridge Cash Lifetime ISA — regulatory disclosures
  body: 'The Fernbridge Cash Lifetime ISA is provided by Fernbridge Building Society.
    We operate under the authority of the Prudential Regulation Authority (PRA) and
    are regulated by the Financial Conduct Authority (FCA). We are committed to the
    Consumer Duty, ensuring that all members receive fair outcomes and transparent
    communication.


    Deposit Protection:

    Member deposits are protected by the Financial Services Compensation Scheme (FSCS).
    This protection covers up to £120,000 per person. In the event of temporary high
    balances (such as from a house sale), protection is extended up to £1.4 million
    for a period of six months.


    Tax Treatment:

    This account is a tax-efficient vehicle. Interest earned is exempt from UK Income
    Tax. The government bonus of 25% is applied to qualifying contributions up to
    the annual limit of £4,000. Please note that we do not provide individualised
    tax, legal, or financial planning advice.


    Withdrawals and Charges:

    Members are cautioned that the Fernbridge Cash Lifetime ISA is a restricted product.
    A withdrawal charge of 25% applies to any funds removed for reasons other than
    the purchase of a first home (capped at £450,000) or retirement. This charge is
    designed to recover the government bonus and may result in a loss of the original
    principal.


    For further information on our general regulatory approach, please see Regulatory
    notes for Current accounts and savings.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: ca5231d9-ca15-5356-a65b-b4b51d458534
  title: Fernbridge Cash Lifetime ISA — interest rate / AER schedule
  body: 'The Fernbridge Cash Lifetime ISA features a simple, transparent interest
    structure to help our members grow their savings with confidence.


    Current Interest Rate:

    - Annual Equivalent Rate (AER): 3.75%


    Application of Rate:

    This is a flat rate that applies to all balances within the account, regardless
    of the amount saved. There are no tiers or minimum balance requirements to earn
    this rate.


    How it Works:

    Interest is calculated daily and credited to the account. Because this is an AER,
    the 3.75% reflects the actual interest you would earn over a year, including the
    effect of compounding.


    What could change the rate?

    As a mutual, we review our rates regularly to ensure they remain fair and competitive.
    Changes to the 3.75% rate may occur due to shifts in the base rate set by the
    Bank of England or changes in our own operational funding requirements. We will
    notify members of any changes via secure digital messaging.'
