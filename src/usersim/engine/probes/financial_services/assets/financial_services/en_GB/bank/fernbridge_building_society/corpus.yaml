- id: cf204b3f-fa90-5408-93ef-6b38ef353ac0
  title: Fernbridge Easy Access Saver — a failed or pending action
  body: 'If you experience an issue where a transaction is pending or an action appears
    to have failed, please follow these steps to identify the cause.


    **Symptom: The minimum opening deposit of £1 has been sent but the account is
    not yet active.**


    **Likely Causes:**

    - **Identity Verification Pending**: We perform rigorous identity checks on all
    new members. If your documentation was unclear or incomplete, the account activation
    will be paused.

    - **Nominated Bank Account Mismatch**: If the funds were sent from an account
    that does not match the name on your application, the transfer may be held for
    security reasons.

    - **Processing Times**: Transfers between different financial institutions can
    occasionally take longer than expected.


    **What to check in order:**

    1. Verify that the funds were sent from the exact Nominated Bank Account you provided
    during the setup process.

    2. Check your secure digital messages for any requests from us for additional
    identification or clarification.

    3. Confirm that the transfer amount was exactly £1 or more.


    **The Fix:**

    - If you find that your identity documents were missing or incorrect, provide
    the updated documents through our secure messaging channel. Once verified, we
    will activate the account immediately.

    - If the funds were sent from an incorrect account, we will return the money to
    the originating bank and ask you to resend it from the correct Nominated Bank
    Account.


    **When to escalate:**

    If the funds have left your external account but have not appeared in your Fernbridge
    balance after three business days, we will escalate the matter to the Member Relations
    team. They will perform a manual trace of the funds and provide a final response
    on the status of your deposit within 15 business days, as per our commitment to
    fair and urgent dispute handling.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 08443c4c-8719-5ee6-9412-05f4e7759e25
  title: Fernbridge Easy Access Saver — eligibility requirements
  body: 'To ensure fair outcomes for all members, the following eligibility criteria
    apply to the opening and maintenance of a Fernbridge Easy Access Saver account:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Membership Status | Must be a member of Fernbridge Building Society | Eligible
    to open account |

    | Initial Funding | Provide a minimum opening deposit of £1 | Account activation
    successful |

    | Identity Proof | Pass rigorous identity verification (KYC) | Account activated
    |

    | Funding Source | Must have a valid Nominated Bank Account | Able to deposit/withdraw
    funds |

    | Residency | Must be a UK resident | Eligible for account opening |


    If a prospective member cannot provide the minimum opening deposit of £1 or fails
    the mandatory identity verification process, we are unable to open the account.
    For details on the specific documents required to meet these criteria, please
    see Fernbridge Easy Access Saver — required documentation.'
  domain: retail_banking
