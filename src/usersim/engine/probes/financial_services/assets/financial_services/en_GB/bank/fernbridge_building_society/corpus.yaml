- id: 1a49d22f-4dcf-558b-b12d-2329247f09f3
  title: Fernbridge One-Year Fixed Rate Bond — account security best practices
  body: 'At Fernbridge Building Society, the security of your hard-earned savings
    is our highest priority. Because the Fernbridge One-Year Fixed Rate Bond requires
    you to commit your funds for 12 months, ensuring that only you have access to
    your account details is essential for your peace of mind.


    To keep your account secure, we employ rigorous identity verification and multi-factor
    authentication (MFA). This means that any state-changing action, such as updating
    your Nominated Bank Account or changing personal details, must be authorised by
    you through these secure channels. We recommend the following best practices:


    1. Protect Your Credentials: Never share your secure digital messaging passwords
    or MFA codes with anyone. Fernbridge staff will never ask you for your full password
    or a one-time passcode over the telephone.


    2. Be Wary of Phishing: Be cautious of emails or text messages that appear to
    be from us but ask you to click a link to ''verify'' your account. We will always
    use secure, official channels for important communications.


    3. Monitor Your Statements: Regularly check your account history via our secure
    messaging service to ensure all details remain correct.


    If you ever suspect that your account has been compromised, please inform us immediately.
    We treat all potential fraud with urgency and fairness, working to secure your
    funds as quickly as possible. Remember that your deposits are protected by the
    FSCS up to £120,000 per person, providing an extra layer of security for your
    4.45% yield investment.


    For further information on how we handle potential threats, you may refer to Fernbridge
    One-Year Fixed Rate Bond — fraud and unauthorised-activity protection. By adhering
    to these simple steps, we can work together to ensure your savings remain safe
    throughout the duration of your bond.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 961428ec-9c1b-5933-913f-31e249f939be
  title: Fernbridge One-Year Fixed Rate Bond — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of the Fernbridge One-Year Fixed Rate Bond. As a mutual, we strive for transparency
    and fairness in all our member agreements.


    Fixed Rate Guarantee: The primary feature of this product is the guaranteed interest
    rate of 4.45%. Once your account is opened with the minimum deposit of £1,000,
    this rate is fixed for the entire 12-month term. We will not reduce this rate
    during the term of the bond, providing you with certainty over your returns.


    Notification of Changes: While the core product features—such as the 12-month
    duration and the fixed rate—remain constant for the life of the bond, we may occasionally
    need to update our general terms of service or administrative procedures. In such
    events, we will provide you with written notice via secure digital messaging at
    least 30 days before the change takes effect.


    Right to Terminate: If a change in terms is deemed detrimental to your financial
    wellbeing, you have the right to request a review. However, because this is a
    fixed-term product, early closure of the bond to avoid a term change may result
    in the loss of interest, as detailed in the main account agreement.


    Regulatory Compliance: All changes to our terms are conducted under the authority
    of the PRA and regulation by the FCA, strictly adhering to the Consumer Duty.
    This ensures that any adjustments are fair and do not lead to poor outcomes for
    our members.


    If you are comparing this policy against other providers, please note that our
    commitment as a member-owned institution is to keep fees to a minimum and ensure
    that the terms of your 4.45% investment remain transparent and stable. For a full
    breakdown of your agreement, please see Fernbridge One-Year Fixed Rate Bond —
    account agreement.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: f11391f7-2d5a-5f17-b7ce-8bc2bd121afc
  title: Fernbridge One-Year Fixed Rate Bond — getting started walkthrough
  body: "This guide is intended for support agents to assist members in opening a\
    \ Fernbridge One-Year Fixed Rate Bond. Please ensure you follow these steps to\
    \ provide a warm and professional onboarding experience.\n\nProduct Overview\n\
    The Fernbridge One-Year Fixed Rate Bond is a secure, higher-yield option for members\
    \ who can commit their funds for a full year. \n- Interest Rate: 4.45%\n- Term:\
    \ 12 months\n- Minimum Deposit: £1,000\n\nWalkthrough Steps for the Member\n\n\
    1. Initial Eligibility Check: Confirm that the member has the minimum deposit\
    \ of £1,000 available. If they have funds in another Fernbridge account, such\
    \ as the Fernbridge Easy Access Saver, they may transfer these funds to meet the\
    \ requirement.\n\n2. Explaining the Commitment: Clearly explain that the funds\
    \ must remain in the account for the full 12-month term to earn the 4.45% rate.\
    \ Ensure the member understands that this is a 'fixed' product, meaning it is\
    \ less flexible than our regular saver options.\n\n3. Identity Verification: Perform\
    \ the mandatory rigorous identity verification. This must be completed before\
    \ the account is opened or any funds are moved. Ensure multi-factor authentication\
    \ is set up for the member's digital access.\n\n4. Funding the Bond: Coordinate\
    \ the transfer of the £1,000 (or more) into the new bond. If the funds are coming\
    \ from an external source, verify the Nominated Bank Account details.\n\n5. Confirmation:\
    \ Once the account is active, confirm the exact start date and the maturity date\
    \ (12 months from opening). Advise the member that they will receive a confirmation\
    \ via secure digital messaging.\n\nAgent Note: Always perform an affordability\
    \ assessment if the member is moving funds that might impact their other financial\
    \ commitments. We provide guidance on our product suite, but we do not provide\
    \ individualised financial planning advice."
