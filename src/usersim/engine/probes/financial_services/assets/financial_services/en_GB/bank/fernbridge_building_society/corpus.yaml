- id: 61b50e6c-20af-5e32-a792-19c800c25105
  title: Fernbridge First Home Five-Year Fixed Mortgage — a failed or pending action
  body: 'If you are applying for the Fernbridge First Home Five-Year Fixed Mortgage
    and find that your application is stalled, ''pending'', or has failed, please
    review the following common scenarios.


    Symptom: Application status is ''Pending'' for longer than expected.

    Likely Causes:

    - Missing Documentation: We may be awaiting a specific document, such as a verified
    payslip or a current proof of address.

    - Valuation Delay: There may be a delay in the third-party property valuation
    report reaching us.

    - Affordability Review: Your application may be undergoing a more detailed manual
    review to ensure the loan meets our strict affordability criteria.


    What to check:

    1. Review your secure digital messages to see if we have requested additional
    information.

    2. Confirm with your solicitor that all property-related documentation has been
    submitted.

    3. Ensure that your deposit funds are held in a verified account.


    How to resolve:

    If you find missing documents, provide them via secure digital messaging immediately.
    If the delay is due to the valuation, we will coordinate with the surveyor to
    expedite the report.


    When to escalate:

    If your application has remained in a pending state for more than 10 business
    days without an update, we will escalate the matter to the Member Relations team.
    They will perform a priority review of your file and provide you with a definitive
    status update within three business days.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: troubleshooting
  source_authority: official
