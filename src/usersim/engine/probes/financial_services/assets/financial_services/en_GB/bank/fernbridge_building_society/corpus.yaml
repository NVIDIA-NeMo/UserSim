  institution_id: fernbridge_building_society
- id: 3c4121b2-21c8-5efd-adb2-c8dd7247c86b
  title: Fernbridge First Home Five-Year Fixed Mortgage — who it is best for and common
    use cases
  body: 'The Fernbridge First Home Five-Year Fixed Mortgage is specifically engineered
    to help first-time buyers secure their first home with a focus on accessibility
    and long-term stability. As a mutual, we prioritise your financial wellbeing over
    profit, ensuring our entry barriers remain low.


    Who it is best for:

    - First-time buyers with smaller deposits: With a maximum loan-to-value (LTV)
    of 95%, this product is ideal for those who have a 5% deposit and wish to enter
    the property market sooner.

    - Members seeking budget certainty: The fixed interest rate of 6.39% for five
    years protects you from market volatility, meaning your monthly payments remain
    unchanged for the duration of the term.

    - Cost-conscious applicants: We have removed the barrier to entry by offering
    a product fee of £0.


    Common Use Cases:

    - Purchasing a first home with a 5% deposit: A member with a property value of
    £200,000 could secure a loan of up to £190,000, utilising the 95% maximum LTV.

    - Long-term planning: Members who prefer the security of knowing their exact housing
    costs for half a decade, avoiding the stress of frequent refinancing.


    Key Financial Figures:

    - Fixed Interest Rate: 6.39%

    - Maximum LTV: 95%

    - Product Fee: £0

    - APRC: 7.1%

    - Standard Variable Rate (post-fix): 7.24%

    - Overpayment Allowance: 10%

    - Early Repayment Charge (Year 1): 5%


    This product is designed to be fair and transparent, ensuring that those entering
    the property market are not burdened by high upfront costs while receiving a competitive,
    stable rate of interest.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: d43753a5-fe53-5a1a-ab87-4dfe267256fe
  title: Fernbridge First Home Five-Year Fixed Mortgage — maximum loan to value explained
  body: 'Q: What does the ''maximum loan to value'' mean for my Fernbridge First Home
    Five-Year Fixed Mortgage?


    A: Loan-to-Value (LTV) is the ratio between the amount you borrow and the total
    value of the property. For this specific product, the maximum LTV is 95%. This
    means we can lend you up to 95% of the property''s appraised value, requiring
    you to provide a minimum deposit of 5%.


    Q: How does the 95% maximum LTV affect my application?


    A: A higher maximum LTV makes it more accessible for first-time buyers to enter
    the market with a smaller cash deposit. However, we always perform a full affordability
    assessment before recommending any credit product to ensure the loan is sustainable
    for your financial circumstances.


    For more details on the costs associated with this mortgage, you can refer to
    Fernbridge First Home Five-Year Fixed Mortgage — product fee explained.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: faq
  source_authority: official
