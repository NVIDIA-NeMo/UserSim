  institution_id: fernbridge_building_society
- id: a573cac9-f886-520e-b395-de4e25a9e28b
  title: Fernbridge Easy Access ISA — choosing between tiers or options
  body: 'Choosing the right savings vehicle depends on your goals for accessibility
    and tax efficiency. Here is how the Fernbridge Easy Access ISA compares to our
    other primary savings options.


    **Fernbridge Easy Access ISA vs. Other Options**

    - **Tax Status:** The Easy Access ISA is the only option here that provides tax-free
    interest, provided you stay within the £20,000 annual allowance (reducing to £12,000
    for under-65s from 6 April 2027). Other accounts are subject to tax on interest
    earned above your personal allowance.

    - **Flexibility:** With an interest rate of 3.85%, the Easy Access ISA offers
    a balance of competitive yield and immediate availability. In contrast, our Fixed
    Rate Bonds offer higher yields but lock your funds for a full year.

    - **Saving Habits:** If you are looking to build a habit of consistent monthly
    saving, the Members'' Regular Saver is designed for that purpose, whereas the
    ISA is better for larger lump sums or general tax-efficient growth.


    **Which one suits you?**

    - **Choose the Easy Access ISA** if you want your savings to remain tax-free and
    need the ability to withdraw funds quickly.

    - **Choose a Fixed Rate Bond** if you have a lump sum you can commit for a year
    in exchange for a higher secure yield.

    - **Choose the Members'' Regular Saver** if you are focused on disciplined, monthly
    contributions.'
  domain: retail_banking
  product_category: cash_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 840c6fe3-0639-5a03-8478-354f20f44ffc
  title: Fernbridge Easy Access ISA — privacy and data handling
  body: 'Fernbridge Building Society is committed to the transparent and secure handling
    of your personal and financial data. As a member-owned mutual, we handle your
    information with the utmost care, adhering to the Consumer Duty to ensure fair
    and honest outcomes.


    **Data Collection and Usage**

    We collect necessary personal information—including your name, address, and identity
    documents—to comply with mandatory identity verification and anti-money laundering
    regulations. This data is used solely to manage your Fernbridge Easy Access ISA,
    process your withdrawals to your Nominated Bank Account, and ensure you do not
    exceed the annual ISA allowance of £20,000 (or the £12,000 limit for under-65s
    from 6 April 2027).


    **Regulatory Reporting**

    To maintain the tax-exempt status of your ISA, we are required to report your
    contributions and account status to HM Revenue & Customs (HMRC). We also operate
    under the authority of the PRA and regulation by the FCA, which may require us
    to provide data for regulatory auditing to ensure the stability and fairness of
    our mutual society.


    **Security and Protection**

    We employ multi-factor authentication to ensure that only you can authorise fund
    movements or changes to your personal details. We will never sell your data to
    third-party marketers. Your deposits are protected by the FSCS up to £120,000
    per person, and temporary high balances are protected up to £1.4 million for six
    months.


    **Your Rights**

    Under data protection laws, you have the right to request a copy of the data we
    hold about you and to request the correction of any inaccuracies. Any requests
    for data access should be made via our secure digital messaging service during
    UK business hours (GMT/BST).


    For further details on our overall regulatory posture, please refer to the Fernbridge
    Easy Access ISA — regulatory disclosures.'
  domain: retail_banking
  product_category: cash_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: f2efb710-88f5-5591-aa71-166a9a6f10de
  title: Fernbridge Easy Access ISA — recognising scams targeting this product
  body: "As you compare your options for tax-efficient savings, it is important to\
    \ be aware of how fraudsters may attempt to target individuals interested in ISAs.\
    \ Because the Fernbridge Easy Access ISA offers a competitive interest rate of\
    \ 3.85%, scammers may use this as a lure, posing as Fernbridge representatives\
    \ to trick you into moving your funds to an external, fraudulent account.\n\n\
    Common scam patterns targeting our members include:\n\n1. The 'Guaranteed Bonus'\
    \ Scam: You may receive an email or text claiming that you are eligible for a\
    \ special government bonus or an 'interest boost' beyond the 3.85% rate, provided\
    \ you move your funds to a 'verified' external account. We will never ask you\
    \ to move your ISA funds to a third-party account to unlock a bonus.\n2. Urgency\
    \ and Pressure: Fraudsters often create a sense of panic, claiming your ISA allowance\
    \ of £20,000 is at risk of being revoked or that your account has been compromised\
    \ and requires immediate movement of funds to a 'safe' account.\n3. Requesting\
    \ Security Credentials: Be vigilant if anyone asks for your multi-factor authentication\
    \ (MFA) codes, passwords, or full security answers. We employ rigorous identity\
    \ verification for all state-changing actions, but we will never ask you to disclose\
    \ your MFA codes over the phone or via text.\n\nIf you notice any suspicious activity\
    \ or receive a request that seems out of character for a mutual society, your\
    \ first action should be to notify us immediately through our secure digital messaging\
    \ or telephone channels. \n\nFor your peace of mind, remember that Fernbridge\
    \ Building Society is regulated by the FCA and the PRA. Your deposits are protected\
    \ by the Financial Services Compensation Scheme (FSCS) up to £120,000 per person,\
    \ with temporary high balances protected up to £1.4 million for six months. We\
    \ will never pressure you into making an immediate financial decision over the\
    \ phone."
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3e29bd03-382c-53c0-b3b0-3d44abeb319a
  title: Fernbridge Easy Access ISA — limits, restrictions, and edge cases
  body: "This document provides a technical breakdown of the limits and restrictions\
    \ associated with the Fernbridge Easy Access ISA to assist support agents in managing\
    \ member queries. \n\nFinancial Limits and Allowances:\n- Current Annual Allowance:\
    \ Members may deposit up to £20,000 within a single tax year. This is the maximum\
    \ amount that can be contributed to the account while maintaining its tax-efficient\
    \ status.\n- Future Allowance Change: Please note that the cash ISA allowance\
    \ is scheduled to change to £12,000 from April 2027. Agents should keep this future\
    \ threshold in mind when discussing long-term saving strategies with members.\n\
    - Interest Rate: The product currently offers an interest rate of 3.85%.\n\nOperational\
    \ Restrictions:\n- No Current Account Facility: Fernbridge does not issue current\
    \ accounts or debit cards. All funds withdrawn from the Fernbridge Easy Access\
    \ ISA must be sent to the member's Nominated Bank Account (the external current\
    \ account held by the member at another institution).\n- Withdrawal Flexibility:\
    \ As an 'Easy Access' product, there are no penalties for withdrawals; however,\
    \ any funds removed from the ISA wrapper cannot be replaced within the same tax\
    \ year if the £20,000 limit has already been reached.\n\nEdge Cases:\n- Over-contribution:\
    \ If a member exceeds the £20,000 annual limit, the excess funds must be removed\
    \ to avoid breaching HMRC rules. Agents should guide members to seek professional\
    \ tax advice if they have accidentally over-contributed.\n- Transfer-Ins: When\
    \ a member transfers an ISA from another provider, the transferred amount does\
    \ not count towards their £20,000 annual allowance for the current year.\n- Protection:\
    \ Deposits remain protected by the FSCS up to £120,000, with temporary high balances\
    \ protected up to £1.4 million for six months."
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9ba57f97-0737-55a5-83e5-0a7f412586e0
  title: Fernbridge Easy Access ISA — cost and charges
  body: 'How much does it cost to open and maintain a Fernbridge Easy Access ISA?


    Consistent with our commitment to fairness and accessibility, we maintain a transparent
    pricing structure where fees are kept to a minimum. There is no fee to open a
    Fernbridge Easy Access ISA, and there are no monthly maintenance or account management
    charges. We believe that growing your savings should not be hindered by unnecessary
    costs.


    Are there any charges for withdrawing my money?


    No. As this is an easy access product, you can withdraw your funds without incurring
    any exit fees or penalties. We only apply fees to cover direct operational costs,
    and in the case of this specific savings product, we do not charge for standard
    withdrawals to your Nominated Bank Account.


    For a full understanding of our fee philosophy across all our products, you may
    refer to Institution-wide fees and charges.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
