- id: 81564230-0dad-5c56-bafd-a5434cd4f691
  title: Fernbridge Easy Access Saver — how-to / step-by-step
  body: 'How do I add more money to my Fernbridge Easy Access Saver?

    Simply tell us you wish to make a deposit. We will verify your identity and then
    request a transfer from your Nominated Bank Account. Once the funds arrive, they
    will begin earning the 3.6% annual interest rate.


    How do I take money out of my account?

    Ask us to perform a withdrawal. After we have successfully completed a rigorous
    identity verification and MFA check, we will transfer the requested amount to
    your Nominated Bank Account.


    How can I update the details of the account I use to move funds?

    Tell us you need to update your Nominated Bank Account. For your security, this
    is a state-changing action that requires full identity verification. Once verified,
    we will update our records to ensure all future transfers are routed correctly.


    Where can I find more information on managing my account?

    Please refer to Fernbridge Easy Access Saver — make a change or update for a detailed
    guide.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: faq
