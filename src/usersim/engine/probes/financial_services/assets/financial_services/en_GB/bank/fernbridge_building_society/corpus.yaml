- id: 1a5d4b17-29df-5f70-90e0-c67bb6639842
  title: Fernbridge Members' Regular Saver — privacy and data handling
  body: 'Fernbridge Building Society is committed to the transparent and lawful handling
    of your personal and financial data. We operate under the authority of the PRA
    and regulation by the FCA, ensuring that our data practices adhere to the highest
    standards of the Consumer Duty.


    Data Usage

    We collect and process your data specifically to manage your Fernbridge Members''
    Regular Saver account. This includes verifying your identity, managing your monthly
    deposits of up to £250, and calculating the 6.5% interest earned over your 12-month
    term. We only share your data with third parties where required by law or to facilitate
    the transfer of funds to your Nominated Bank Account.


    Security Measures

    To prevent unauthorised access to your data and funds, we employ multi-factor
    authentication for all sensitive account changes. Your personal information is
    stored securely and is only accessible to authorised personnel during the course
    of providing our banking services.


    Deposit Protection

    As a member of the Financial Services Compensation Scheme (FSCS), your deposits
    in the Fernbridge Members'' Regular Saver are protected up to £120,000 per person.
    In the event of institutional failure, the FSCS ensures that your funds are safeguarded
    up to this limit. Temporary high balances (such as those resulting from a house
    sale) are protected up to £1.4 million for a period of six months.


    Your Rights

    You have the right to request access to the personal data we hold about you and
    to request corrections if that data is inaccurate. Any disputes regarding the
    handling of your account or data will be treated with urgency and fairness. If
    a dispute remains unresolved, you maintain the right to escalate the matter to
    the Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: disclosure
