  mentions_tools: []
  institution_id: fernbridge_building_society
- id: b2d84d83-12e5-5a5b-981d-f19c3afefa4f
  title: Fernbridge Easy Access ISA — make a change or update
  body: 'If you need to update your personal details, change your Nominated Bank Account,
    or update your beneficiary for your Fernbridge Easy Access ISA, please follow
    these steps. To ensure your funds remain secure, we require rigorous verification
    for all state-changing actions.


    **What you will need before starting**

    - Your Fernbridge member number.

    - A valid form of government-issued photo identification (if your identity needs
    re-verifying).

    - The new account details (if updating your Nominated Bank Account).


    **Step-by-Step Process**


    1. **Request the Change:** Tell us which specific detail you wish to update (e.g.,
    "I need to change my Nominated Bank Account" or "I would like to update my home
    address").

    2. **Identity Verification:** To protect your account, we will perform a security
    check. This will involve multi-factor authentication (MFA) and, in some cases,
    a request for you to provide a current piece of identification.

    3. **Provide New Details:** Once verified, provide the updated information. If
    you are changing your Nominated Bank Account, provide the sort code and account
    number of the external current account where you wish to receive your funds.

    4. **Review and Confirm:** We will read back the updated details to you to ensure
    accuracy and confirm the change in writing via our secure digital messaging service.

    5. **Confirmation of Success:** You will know the update is complete when you
    receive the secure confirmation message. Any subsequent fund movements will now
    be directed to your new Nominated Bank Account.


    If you encounter any issues during this process, such as difficulty with the MFA
    step, please refer to the Fernbridge Easy Access ISA — access or login problems
    for assistance.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9eeb1e82-3c7f-56a8-8ff6-a07a65555820
  title: Fernbridge Easy Access ISA — access or login problems
  body: 'If you are experiencing difficulties accessing your account information or
    completing a transaction for your Fernbridge Easy Access ISA, please follow the
    guidance below.


    **Symptom: Unable to log in or authenticate**

    This is most commonly caused by incorrect credentials, an expired session, or
    a failure in the multi-factor authentication (MFA) process.


    **What to check and how to fix it**

    1. **Check Credentials:** Ensure you are using the correct login details. Note
    that passwords are case-sensitive.

    2. **Verify MFA Device:** If you are not receiving your MFA code, ensure your
    registered mobile device has a stable network connection. If you have recently
    changed your phone number, you will need to undergo our identity verification
    process to update your records.

    3. **Clear Cache:** If using a digital interface, try clearing your browser cache
    or restarting the session to resolve temporary connectivity glitches.


    **Symptom: ''Action Denied'' or ''Verification Required'' messages**

    This occurs when a state-changing action (such as a large withdrawal) triggers
    a security flag, requiring additional identity confirmation to protect your 3.85%
    interest-bearing savings.


    **The Fix**

    Provide the requested identification via our secure digital messaging channel.
    Once our team has manually verified your identity, the restriction will be lifted.


    **When to Escalate**

    If you have completed the verification steps but still cannot access your funds
    or details, the matter will be escalated to our Member Relations team. They will
    investigate the block and provide a resolution. You will be notified of the outcome
    via secure message. For a general overview of our support model, see the institution-wide
    guidelines on how we handle member requests.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 07ebe53c-0c40-5989-b395-9c76ef55ce03
  title: Fernbridge Easy Access ISA — qualification tiers
  body: 'This matrix is for support agents to determine if a prospective member qualifies
    for a Fernbridge Easy Access ISA. All members must meet the ''Mandatory'' criteria
    before an account can be opened.


    | Criterion | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Residency** | Must be a current resident of the United Kingdom | **Mandatory**:
    Must meet to proceed |

    | **Age** | Must be 18 years of age or older | **Mandatory**: Must meet to proceed
    |

    | **Tax Status** | Must have remaining allowance within the current £20,000 ISA
    limit | **Mandatory**: Must meet to proceed |

    | **Identity** | Must provide valid government-issued ID and address verification
    | **Mandatory**: Must meet to proceed |

    | **Account Type** | Must have a valid external Nominated Bank Account | **Mandatory**:
    Must meet to proceed |

    | **Funding** | Initial deposit of any amount (within the £20,000 limit) | **Optional**:
    Account may be opened with zero balance if agreed |


    If a member does not meet any of the mandatory requirements, they are ineligible
    for this product. You may suggest alternative savings options, such as those found
    in the Fernbridge Easy Access Saver — overview.'
  domain: retail_banking
  product_category: cash_isa
  document_type: eligibility_matrix
  source_authority: official
