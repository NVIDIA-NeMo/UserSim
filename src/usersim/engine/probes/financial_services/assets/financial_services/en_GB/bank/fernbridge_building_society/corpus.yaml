- id: 33da0f09-276c-5482-9800-ed83c0411a7b
  title: Fernbridge Easy Access ISA — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Fernbridge
    Easy Access ISA. All members should read these carefully to understand the risks
    and limitations associated with this product.


    **Interest Rate Variability**

    The current interest rate of 3.85% is variable. This means the rate may increase
    or decrease over time based on market conditions and the society''s operational
    needs. We will notify members of any significant changes to the rate.


    **ISA Allowance and Tax Implications**

    The tax-free benefits of this account are contingent upon adhering to government
    ISA limits. The current annual allowance is £20,000. If you exceed this limit
    by depositing more than £20,000 in a single tax year, the excess funds may lose
    their tax-exempt status, and you may be liable for tax on the interest earned
    on those funds. Please be aware that from April 2027, the cash ISA allowance is
    scheduled to change to £12,000.


    **Deposit Protection**

    Your deposits are protected by the Financial Services Compensation Scheme (FSCS).
    The protection limit is £120,000 per person. In the event of a temporary high
    balance (such as a property sale), protection is extended up to £1.4 million for
    a period of six months.


    **Inflation Risk**

    While the Fernbridge Easy Access ISA provides a secure return of 3.85%, there
    is a risk that the rate of inflation may exceed the interest rate. In such a scenario,
    the real-term purchasing power of your savings may decrease over time.


    **Regulatory Oversight**

    Fernbridge Building Society operates under the authority of the PRA and is regulated
    by the FCA. We strictly adhere to the Consumer Duty, ensuring that our products
    are designed and managed to provide fair outcomes for all members. We do not provide
    individualised tax or financial planning advice; our guidance is for educational
    purposes to help you make informed choices.'
  domain: retail_banking
  product_category: cash_isa
  document_type: disclosure
  source_authority: official
