- id: 5dc6d2df-3be8-5072-9a8e-fb3d634da812
  title: Fernbridge First Home Five-Year Fixed Mortgage — an unexpected charge or
    amount
  body: 'This guide is for support agents assisting members who report an unexpected
    charge or an unfamiliar amount on their mortgage statement.


    Symptom: The member believes they have been overcharged or sees a fee they did
    not expect on their account.


    Likely Causes:

    1. Early Repayment Charge (ERC): If the member has made a lump sum repayment in
    the first year that exceeds their 10% overpayment allowance, a 5% early repayment
    charge will have been applied to the excess.

    2. Transition to SVR: If the five-year fixed term has expired, the interest rate
    has automatically shifted from 6.39% to the standard variable rate of 7.24%, resulting
    in a higher monthly payment.

    3. Misinterpretation of the Product Fee: While the product fee is £0, the member
    may be confusing this with external legal or valuation fees not paid to Fernbridge.


    Steps to Resolve:

    1. Check the loan start date: Determine if the member is still in the first year
    of the fixed term.

    2. Review payment history: Identify if any overpayments were made and if they
    exceeded the 10% limit.

    3. Verify the current applied rate: Check if the account is still on the 6.39%
    fixed rate or has moved to the 7.24% SVR.


    Resolution and Escalation:

    If the charge is correct, explain the specific term (e.g., the 5% ERC or the SVR
    transition) clearly to the member. If the charge appears to be a system error,
    raise a case with the Member Relations team. The member should be informed that
    we aim for a final response within eight weeks for these matters, although we
    strive to resolve them much sooner.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: bead1827-dca8-5aca-b4a9-b4d23a900edb
  title: Fernbridge First Home Five-Year Fixed Mortgage — required documentation
  body: 'To apply for the Fernbridge First Home Five-Year Fixed Mortgage, prospective
    members must provide the following documentation to allow us to perform the mandatory
    affordability assessment and identity verification:


    | Requirement | Required Documentation | Outcome if Missing |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or Driving Licence (plus MFA verification)
    | Application paused until verified |

    | Proof of Income | Last 3 months of payslips and most recent P60 | Unable to
    assess affordability |

    | Proof of Deposit | Bank statements showing funds for at least 5% of property
    value | Unable to meet 95% LTV requirement |

    | Property Details | Full address and current valuation/asking price | Unable
    to calculate LTV ratio |

    | Address History | Proof of residence for the last 3 years (e.g., utility bills)
    | Identity verification incomplete |


    We strictly adhere to the Consumer Duty to ensure all outcomes are fair. All documents
    must be provided in English (United Kingdom) or accompanied by a certified translation.'
