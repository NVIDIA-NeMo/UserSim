  institution_id: fernbridge_building_society
- id: d751cc98-8ead-5ebe-9834-c7b34c55475e
  title: Fernbridge Easy Access ISA — eligibility and setup
  body: 'Who is eligible to open a Fernbridge Easy Access ISA?


    To open this account, you must be a UK resident and aged 18 or over. As a member-owned
    mutual, we welcome all who meet these criteria and wish to benefit from tax-free
    savings. We will perform an identity verification check as part of the setup process
    to comply with PRA and FCA regulations.


    How do I set up my account?


    You can initiate the setup by contacting us via telephone or secure digital messaging.
    We will guide you through the application, verify your identity using multi-factor
    authentication, and help you establish your Nominated Bank Account for future
    transfers.


    Is there a limit to how much I can put in at the start?


    Yes, your total contributions must not exceed the annual ISA allowance of £20,000.
    If you are transferring an existing ISA from another provider, this does not count
    towards that £20,000 limit. Please be aware that the allowance is scheduled to
    change to £12,000 from April 2027.'
  domain: retail_banking
  product_category: cash_isa
