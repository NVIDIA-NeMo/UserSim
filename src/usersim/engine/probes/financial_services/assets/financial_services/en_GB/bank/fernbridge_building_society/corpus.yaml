- id: 78cbde50-41bf-5968-996e-f34cd0372598
  title: Fernbridge Easy Access ISA — fraud and unauthorised-activity protection
  body: 'At Fernbridge Building Society, we are committed to protecting your savings
    and ensuring your peace of mind. The Fernbridge Easy Access ISA is designed to
    be a secure environment for your tax-efficient savings, and we employ rigorous
    security measures to keep your funds safe.


    To prevent unauthorised activity, we utilise multi-factor authentication for all
    state-changing actions. This means that any movement of funds or changes to your
    personal details must be authorised by you through a secondary verification step,
    ensuring that only the account holder can manage the money.


    It is important to be aware of common fraud patterns targeting ISA holders. Scammers
    may attempt to impersonate our staff via telephone or digital messaging, claiming
    there is an issue with your tax-free allowance or suggesting you move funds to
    a ''safe account'' to avoid a penalty. Please be advised: Fernbridge Building
    Society will never ask you for your full password, your PIN, or for you to transfer
    money to an account that is not in your own name.


    If you notice any suspicious activity, such as an unexpected notification regarding
    a change to your account details or a transaction you do not recognise, you must
    inform us immediately. Timely reporting is critical to limiting your liability
    and allowing us to secure your account.


    For your protection, all member deposits in the Fernbridge Easy Access ISA are
    protected by the Financial Services Compensation Scheme (FSCS). This protects
    your funds up to £120,000 per person. In specific circumstances involving temporary
    high balances, protection is available up to £1.4 million for a period of six
    months.


    We treat all fraud reports with urgency and fairness. If a dispute arises regarding
    unauthorised activity, we aim to provide a final response within 15 business days
    for payment services. Should you feel we have not resolved the matter to your
    satisfaction, you maintain the right to escalate the dispute to the Financial
    Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: bfd0bebc-444a-56f9-90c4-0d2517c33888
  title: Fernbridge Easy Access ISA — account agreement
  body: 'This account agreement governs the relationship between Fernbridge Building
    Society (the ''Mutual'') and the member regarding the Fernbridge Easy Access ISA.
    As a member-owned institution, we prioritise your financial wellbeing over external
    shareholder profit.


    **1. Member Obligations**

    To open and maintain this account, the member must provide valid identity verification
    and proof of residency. All personal information provided must be accurate and
    kept up to date. The member agrees to adhere to the annual ISA allowance limits
    set by the government. Currently, the maximum amount that can be deposited into
    the ISA within a single tax year is £20,000.


    **2. Mutual Obligations**

    Fernbridge Building Society agrees to provide a secure, tax-efficient savings
    vehicle. We will apply an interest rate of 3.85% to the balance of the account.
    Interest is calculated daily and credited periodically, as detailed in our rate
    schedules. We commit to maintaining a transparent pricing structure and will notify
    members of any changes to terms or interest rates with reasonable notice.


    **3. Fund Movements**

    All funds entering or leaving the account must pass through a Nominated Bank Account
    held in the member''s name. To ensure security, multi-factor authentication is
    mandatory for all transfers.


    **4. Account Changes and Closure**

    Members may request to close their account or downgrade their holdings at any
    time. Upon closure, all remaining funds, including accrued interest, will be transferred
    to the member''s Nominated Bank Account. Fernbridge reserves the right to close
    an account if there is evidence of fraudulent activity or a breach of the ISA
    regulations.


    **5. Regulatory Standing**

    This account is operated under the authority of the PRA and regulation by the
    FCA. We strictly adhere to the Consumer Duty to ensure fair outcomes for all members.
    Deposits are protected by the FSCS up to £120,000 per person, with temporary high
    balances protected up to £1.4 million for six months.'
  domain: retail_banking
  product_category: cash_isa
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 5ad18625-2a31-5416-a74e-9eb94b355991
  title: Fernbridge Easy Access ISA — who it is best for and common use cases
  body: 'The Fernbridge Easy Access ISA is a flexible, tax-efficient savings account
    designed for members who want their money to grow without the restriction of a
    fixed term. By combining the benefits of an ISA with the liquidity of an easy-access
    account, it serves as an ideal tool for disciplined savers.


    **Who is this product best for?**

    This account is specifically engineered for those who prioritise accessibility
    and tax protection. It is ideal for:

    *   **Emergency Fund Builders:** Those who need a secure place for ''rainy day''
    funds that can be accessed immediately without tax penalties.

    *   **Short-term Goal Savers:** Members saving for a specific purchase within
    the next year or two who want to ensure their interest remains tax-free.

    *   **First-Time Buyers in Transition:** Those accumulating a deposit who may
    need to pivot their funds quickly as they enter the property market.


    **Common Use Cases**

    *   **Tax-Free Growth:** Members can deposit up to £20,000 per tax year, ensuring
    that the interest earned on these funds is not subject to UK income tax.

    *   **Competitive Returns:** With an interest rate of 3.85%, the account provides
    a meaningful return on savings while maintaining full liquidity.

    *   **Flexible Contributions:** Because there is no minimum monthly commitment,
    members can deposit lump sums or smaller amounts as their budget allows.


    **Key Product Details**

    *   **Interest Rate:** 3.85%

    *   **Annual ISA Allowance:** £20,000

    *   **Accessibility:** Full easy access to funds via secure digital messaging
    or telephone during UK business hours.

    *   **Protection:** Member deposits are protected by the FSCS up to £120,000 per
    person.


    For those who can commit their funds for a longer duration in exchange for a higher
    yield, we suggest reviewing the Fernbridge One-Year Fixed Rate Bond — overview.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 2151c985-29e8-5185-bcec-887fc2b0b52f
  title: Fernbridge Easy Access ISA — ISA allowance for the 2026/27 tax year explained
  body: '**What is my current ISA allowance for the 2026/27 tax year?**

    For the current period, the annual ISA allowance remains £20,000. This is the
    maximum amount you can deposit across all your cash and stocks-and-shares ISAs
    within the tax year without losing the tax-free status of your earnings.


    **Will the allowance change in the future?**

    Yes. We wish to notify our members that there is a planned change to the allowance.
    From April 2027, the cash ISA allowance is scheduled to decrease to £12,000.


    **How does this affect my existing savings?**

    Any funds already deposited into your Fernbridge Easy Access ISA before the change
    will remain tax-free. The new limit of £12,000 will apply only to new contributions
    made during the tax year starting in April 2027. We recommend reviewing your savings
    strategy to ensure you maximise your current £20,000 allowance before this change
    takes effect.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 5ba6da0c-4e8b-526f-8bd8-cd353c1a465b
  title: Fernbridge Easy Access ISA — cancel, close, or downgrade
  body: 'Whether you have reached your savings goal or your financial priorities have
    shifted, we make it straightforward to close or downgrade your Fernbridge Easy
    Access ISA. Please follow these steps to complete the process.


    **Before you begin**

    You will need the details of your Nominated Bank Account (the external current
    account where we will send your funds), as Fernbridge does not issue its own current
    accounts.


    **Steps to close or downgrade your account**

    1.  **Request the action:** Inform us via secure digital messaging or telephone
    that you wish to close your ISA or downgrade it to a non-tax-wrapped savings account.

    2.  **Identity Verification:** For your security, we will perform a rigorous identity
    check. This includes multi-factor authentication to ensure the request is authorised
    by the account holder.

    3.  **Confirm Destination:** Provide or confirm the details of your Nominated
    Bank Account. We will verify that this account is held in your name to prevent
    fraud.

    4.  **Final Balance Calculation:** We will calculate the final closing balance,
    which includes your principal deposits and any interest accrued up to the date
    of closure at the rate of 3.85%.

    5.  **Fund Transfer:** Once you provide final authorisation, we will transfer
    the full balance to your Nominated Bank Account.

    6.  **Confirmation:** You will receive a final statement via secure messaging
    confirming the account closure and the total amount transferred.


    **How you know it worked**

    You will see the funds arrive in your Nominated Bank Account, and your account
    status within our systems will be updated to ''Closed'' or ''Downgraded''.


    If you are comparing this process against other providers, please note that as
    a mutual, we aim to keep this transition transparent and free of exit fees.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 37b36c20-993a-5ad7-a99c-0538b5fb238a
  title: Fernbridge Easy Access ISA — an unexpected charge or amount
  body: 'This guide is for support agents assisting members who report that their
    Fernbridge Easy Access ISA balance or a specific transaction amount is not what
    they expected.


    **Symptom**

    The member states: "My balance is lower than I expected," or "I see a charge/deduction
    on my statement that I didn''t authorise."


    **Likely Causes**

    1.  **ISA Allowance Breach:** The member may have deposited more than the £20,000
    annual limit, leading to a correction or a requirement to move funds out of the
    ISA wrapper.

    2.  **Interest Calculation Timing:** The member may be expecting interest to be
    credited on a different date than our standard cycle, despite the 3.85% rate being
    applied daily.

    3.  **Incorrect Nominated Account:** A transfer may have been attempted to an
    incorrect Nominated Bank Account, resulting in a returned payment.


    **What to check and in what order**

    1.  **Transaction History:** Review the latest statement. Check if the ''unexpected
    amount'' is actually a transfer out to the Nominated Bank Account.

    2.  **Contribution Totals:** Sum all deposits for the current tax year. If the
    total exceeds £20,000, the member has exceeded their allowance, which requires
    immediate correction to maintain tax-free status.

    3.  **Rate Application:** Verify that the balance is accruing interest at the
    correct rate of 3.85%.


    **The Fix**

    *   **For Allowance Breaches:** Guide the member through the process of removing
    the excess funds to align with the £20,000 limit.

    *   **For Calculation Queries:** Explain the daily interest accrual process and
    when the next credit will appear.


    **When to escalate**

    If the member insists there is an unauthorised charge that cannot be explained
    by allowance limits or interest cycles, or if the member is distressed by the
    discrepancy, escalate the matter to the Member Relations team. They will investigate
    the transaction and aim to provide a final response within 15 business days for
    payment-related disputes.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 4924f28e-998c-525e-ba8e-6477a3ed9d48
  title: Fernbridge Easy Access ISA — required documentation
  body: 'To open a Fernbridge Easy Access ISA, all prospective members must provide
    documentation that satisfies our rigorous identity verification standards. The
    following requirements must be met before an account can be activated:


    | Requirement | Mandatory Documentation | Outcome |

    | :--- | :--- | :--- |

    | **Proof of Identity** | Valid Passport or UK Driving Licence | Identity Verified
    / Proceed to Address Check |

    | **Proof of Address** | Utility bill or Council Tax statement (dated within last
    3 months) | Residency Confirmed / Proceed to Tax Status |

    | **Tax Residency** | Valid National Insurance Number | ISA Eligibility Confirmed
    / Account Opening |

    | **Fund Source** | Details of a Nominated Bank Account in the member''s name
    | Funding Path Verified / Account Activated |


    Failure to provide any of the above will result in the application being held
    in a ''Pending'' state until the documentation is supplied. We perform these checks
    to ensure the security of our mutual and to comply with FCA regulations.'
