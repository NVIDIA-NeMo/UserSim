- id: 75608dc7-935b-591d-be47-da4342533faa
  title: Fernbridge Cash Lifetime ISA — eligibility requirements
  body: 'To ensure members achieve the best outcomes with the Fernbridge Cash Lifetime
    ISA, the following eligibility criteria must be met:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Age at Opening | 39 years old or younger | Eligible to open account |

    | Age at Opening | 40 years old or older | Ineligible to open account |

    | Annual Contribution | Up to £4,000 | Contribution accepted and bonus eligible
    |

    | Annual Contribution | Over £4,000 | Excess funds declined/returned |

    | Residency | UK Resident | Eligible to open account |

    | Target Property Price | Up to £450,000 | Bonus can be used for home purchase
    |

    | Target Property Price | Over £450,000 | Withdrawal treated as unauthorised (25%
    charge) |'
