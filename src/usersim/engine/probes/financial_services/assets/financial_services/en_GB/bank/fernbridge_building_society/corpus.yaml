- id: 5f0349e4-3c32-5eae-8aea-338f8539bad8
  title: Fernbridge Easy Access ISA — overview
  body: 'The Fernbridge Easy Access ISA is a tax-efficient savings vehicle designed
    for members who want their money to grow while maintaining the flexibility to
    withdraw funds when needed. As a member-owned mutual, we prioritise your financial
    wellbeing over shareholder profit, ensuring that the benefits of our growth are
    reflected in the accessibility and fairness of our products.


    This account is ideal for those who wish to save within the current government
    tax-free limits. For the current tax year, the ISA allowance is £20,000. It is
    important for members to note that this allowance is subject to change by the
    government; for instance, the cash ISA allowance from April 2027 is expected to
    be £12,000.


    We offer a competitive interest rate of 3.85% to help your savings accumulate
    more quickly. Because this is an ''easy access'' account, there are no lock-in
    periods or penalties for accessing your funds, making it a secure place for emergency
    funds or short-term goals.


    Our commitment to transparency means we keep costs to a minimum. There are no
    monthly maintenance fees associated with this account. To ensure the security
    of your funds, all withdrawals are sent to your Nominated Bank Account—the external
    current account you provide to us—as we do not issue our own current accounts
    or debit cards.


    Your peace of mind is paramount. Fernbridge Building Society is authorised by
    the PRA and regulated by the FCA. All member deposits are protected by the Financial
    Services Compensation Scheme (FSCS) up to £120,000 per person. In specific circumstances
    involving temporary high balances, protection is available up to £1.4 million
    for a period of six months.


    By choosing the Fernbridge Easy Access ISA, you are joining a community-centric
    institution dedicated to providing a fair and transparent banking experience.'
