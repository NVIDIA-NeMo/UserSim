- id: 1713e79f-5ad2-54e1-97b0-a7f847e3626e
  title: Fernbridge Members' Regular Saver — resolve a common request end-to-end
  body: 'A common request for our members is updating the monthly deposit amount or
    changing the Nominated Bank Account used to fund their Fernbridge Members'' Regular
    Saver. Here is how to resolve this request end-to-end:


    1. State your request: Let us know that you wish to either change the amount you
    are saving each month or update the bank account you are using for deposits. If
    you are changing the amount, please specify the new figure (ensuring it does not
    exceed the maximum monthly deposit of £250).


    2. Undergo identity verification: Because changing a Nominated Bank Account or
    modifying payment instructions is a state-changing action, we must perform rigorous
    identity verification. This will include multi-factor authentication to ensure
    the request is authorised by the account holder.


    3. Provide new account details: If you are changing your Nominated Bank Account,
    provide the new account number and sort code. We will verify that the account
    is held in your name to prevent fraud.


    4. Confirm the new limit: If you have requested an increase in your monthly deposit,
    we will confirm that the new amount is within the £250 monthly limit and that
    the 6.5% interest rate continues to apply to all funds deposited.


    5. Receive confirmation: We will send a final confirmation via secure digital
    messaging once the change has been applied. This confirmation will include the
    date the change takes effect and the updated funding details.


    6. Verify the first transaction: In the following month, check your account history
    to ensure the deposit from the new Nominated Bank Account (or for the new amount)
    has been successfully processed.


    This process ensures that your savings remain secure while giving you the flexibility
    to adjust your disciplined saving plan over the 12 month term.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: how_to_guide
