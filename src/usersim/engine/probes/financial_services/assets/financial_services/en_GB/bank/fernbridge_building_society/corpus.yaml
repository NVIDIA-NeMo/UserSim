- id: fc460cf3-b6c9-5fd1-bff7-f759531c878b
  title: Fernbridge Members' Regular Saver — a declined or blocked action
  body: 'It can be frustrating when a planned deposit into your Fernbridge Members''
    Regular Saver is declined. Because this account has strict operational limits,
    most blocked actions are caused by a few common factors.


    Symptom

    Your attempt to transfer funds from your Nominated Bank Account into your Regular
    Saver has failed, or you have received a notification that the transaction was
    declined.


    Likely Causes

    • Exceeding Monthly Limits: The most common cause is attempting to deposit more
    than the maximum monthly deposit of £250. If you have already deposited £250 this
    month, any further attempts will be blocked.

    • Incorrect Funding Source: Funds must be sent from your Nominated Bank Account.
    Transfers from other accounts or third parties are automatically declined for
    security and compliance reasons.

    • Verification Failure: If the transfer was initiated through a change in personal
    details or a new device, a failure in multi-factor authentication may have blocked
    the action.


    What to Check

    1. Review your current month''s total deposits. Ensure the new transfer does not
    push your total for the month over £250.

    2. Confirm that the funds are being sent from the exact bank account you registered
    as your Nominated Bank Account.

    3. Check that your identity verification is up to date and that you have successfully
    completed any required multi-factor authentication steps.


    How to Fix

    If you have exceeded the limit, simply wait until the start of the next calendar
    month to make further deposits. If the funding source is incorrect, ask us to
    update your Nominated Bank Account details, which will require a fresh identity
    verification process.


    When to Escalate

    If you have confirmed that the deposit is within the £250 limit and is coming
    from the correct account, but it is still being declined, let us know. We will
    raise the issue with our Member Relations team for a detailed investigation. You
    will typically receive a response or resolution within 15 business days for payment-related
    services.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 6a37c31d-41a5-57c9-863f-fe3b909a84c1
  title: Fernbridge Members' Regular Saver — when to switch or upgrade
  body: 'Determining whether to remain with the Fernbridge Members'' Regular Saver
    or move funds to another product depends on your current saving capacity and goals.


    Consider switching or augmenting your savings if:

    • You have a lump sum: The Regular Saver is capped at a maximum monthly deposit
    of £250. If you have a larger amount of capital ready to save immediately, the
    Fernbridge Easy Access Saver provides greater flexibility for larger deposits.

    • You need immediate liquidity: The Regular Saver is designed for a 12 month term.
    If you anticipate needing your funds frequently, an easy-access option is more
    appropriate.

    • You have reached the term limit: Once your 12 month term concludes, you may
    wish to move the balance into a higher-yield option if you no longer need the
    flexibility of monthly deposits.


    While the 6.5% rate is highly competitive, it is designed for disciplined, incremental
    saving. For those with larger existing balances, please see Fernbridge Easy Access
    Saver — overview to compare accessibility and limits.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: comparison
  source_authority: official
  placeholder: true
