  institution_id: fernbridge_building_society
- id: ff039a1d-a042-5c67-b93b-51b16db6b5e7
  title: Fernbridge One-Year Fixed Rate Bond — interest rate / AER schedule
  body: 'The Fernbridge One-Year Fixed Rate Bond offers a single, flat interest rate
    applicable to all qualifying balances. There are no tiered rates for this product.


    - **Annual Equivalent Rate (AER)**: 4.45%

    - **Applicable Balance**: All balances from the £1,000 minimum deposit upwards.


    **Rate Application**

    The 4.45% rate is fixed from the date of account activation and remains constant
    for the entire 12-month term. Unlike our variable products, this rate will not
    fluctuate based on changes to the Bank of England base rate or other market conditions
    during the term of the bond.


    **Interest Crediting**

    Interest is calculated daily and credited to the account. The AER provides a standardised
    measure of the yield you will receive over the year, assuming the interest remains
    within the bond for the full duration.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: rate_sheet
