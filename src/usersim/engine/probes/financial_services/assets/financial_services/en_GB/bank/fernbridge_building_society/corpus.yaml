  institution_id: fernbridge_building_society
- id: 9001e335-919d-5a28-9e24-faa2d2997dad
  title: Fernbridge Easy Access ISA — referral and loyalty offer
  body: 'We believe that our mutual strength comes from our members. That is why we
    are pleased to introduce our latest referral and loyalty initiative for the Fernbridge
    Easy Access ISA. We are inviting our existing members to introduce friends and
    family to a fairer way of banking, where the focus remains on member wellbeing
    rather than shareholder profit.


    By opening a Fernbridge Easy Access ISA, new members can immediately benefit from
    a competitive interest rate of 3.85%. This account is designed for those who value
    flexibility and transparency, allowing you to grow your savings within the current
    annual ISA allowance of £20,000 without locking your funds away.


    Whether you are looking for a secure place for your emergency fund or a tax-efficient
    way to save for the future, we provide a warm, professional environment to help
    you succeed. We encourage prospective members to join our community and enjoy
    the benefits of a member-owned society. For further details on our core product
    features, you may wish to review the Fernbridge Easy Access ISA — overview.'
  domain: retail_banking
  product_category: cash_isa
