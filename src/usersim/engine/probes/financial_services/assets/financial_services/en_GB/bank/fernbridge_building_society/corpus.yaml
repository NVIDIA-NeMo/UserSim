- id: a7806b9b-b4e7-5f28-8f7a-37a9c2d664d3
  title: Fernbridge Easy Access Saver — resolve a common request end-to-end
  body: 'This guide explains the end-to-end process for a prospective member to open
    and fund a Fernbridge Easy Access Saver.


    Before you begin:

    To complete this process, you will need a valid form of government-issued identification
    and the details of an external current account (which will become your Nominated
    Bank Account).


    Step-by-Step Process:


    1. Request to open the account: Tell us you would like to open a Fernbridge Easy
    Access Saver. We will explain the mutual nature of our society and the product''s
    3.6% interest rate.


    2. Provide identification: Present your identification documents as requested.
    We will perform a rigorous identity verification to comply with PRA and FCA regulations.


    3. Nominate your bank account: Provide the sort code and account number of the
    external current account you wish to use for funding and withdrawals. Since we
    do not issue our own cards or current accounts, this step is essential.


    4. Fund the account: To activate the account, you must provide the minimum opening
    deposit of £1. You can do this by asking us to pull the funds from your newly
    nominated account.


    5. Receive confirmation: Once the £1 deposit is processed and your identity is
    verified, we will confirm that your account is open and active.


    How you know it worked:

    You will receive a confirmation message stating that your Fernbridge Easy Access
    Saver is open, with a starting balance of at least £1, now earning interest at
    a rate of 3.6%.


    For a more detailed look at the requirements, see Fernbridge Easy Access Saver
    — eligibility requirements.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: b7fefb0c-232d-5a18-bbd2-0f3c40ada127
  title: Fernbridge Easy Access Saver — a discrepancy in your records or statement
  body: 'This guide assists agents in resolving member queries regarding discrepancies
    in balances, interest payments, or transaction history for the Fernbridge Easy
    Access Saver.


    Common Symptoms:

    - A member believes the interest credited is lower than expected based on the
    3.6% rate.

    - A deposit from the Nominated Bank Account is not appearing in the account history.

    - The closing balance on a statement does not match the member''s own records.


    Investigation Steps:


    1. Verify Interest Calculations: Confirm the balance held during the period. Ensure
    the member understands that the 3.6% rate is an annual rate (AER) and is credited
    according to the society''s schedule. If the balance fluctuated, the interest
    will reflect the average daily balance.


    2. Trace the Fund Movement: If a deposit is missing, verify the date and amount
    sent from the Nominated Bank Account. Check if the funds are currently in a pending
    state due to standard banking clearing cycles.


    3. Audit Identity Verification: Check if any requested transactions were blocked
    due to a failed MFA check or identity verification, which would prevent a transaction
    from being recorded.


    Resolution and Escalation:


    - If the discrepancy is a simple misunderstanding of the AER, explain the calculation
    clearly to the member.

    - If a technical error is found, correct the balance immediately and notify the
    member.

    - If the member remains dissatisfied or the discrepancy is complex, escalate the
    case to the Member Relations team. We aim to provide a final response within 15
    business days for payment services and eight weeks for other matters. Members
    should be reminded of their right to escalate unresolved disputes to the Financial
    Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: d333fff9-072a-5c97-98a5-2e3d73c60b0c
  title: Fernbridge Members' Regular Saver — overview
  body: "The Fernbridge Members' Regular Saver is a high-interest incentive designed\
    \ to reward our members for consistent monthly saving. As a member-owned mutual,\
    \ we prioritise your financial wellbeing over shareholder profit, and this product\
    \ reflects our commitment to helping disciplined savers build a secure future\
    \ through steady, incremental growth.\n\nThis account is particularly suited for\
    \ those who have a steady income and wish to set aside a portion of it each month\
    \ to benefit from a competitive return. By committing to a regular saving pattern,\
    \ you can take advantage of a significant interest rate of 6.5% on your balance.\
    \ To keep the account focused on disciplined saving, there is a maximum monthly\
    \ deposit of £250. This ensures that the high rate is used to build a habit of\
    \ saving rather than as a vehicle for large, one-off deposits.\n\nThe account\
    \ operates over a set term of 12 months. During this period, your funds grow steadily,\
    \ providing a secure way to reach your short-to-medium term financial goals. Because\
    \ we are a mutual, we keep our costs low and pass those benefits directly to you.\
    \ In line with our fee philosophy, this account carries no monthly maintenance\
    \ fees or product charges, ensuring that more of your money remains where it belongs—in\
    \ your savings.\n\nYour deposits are protected by the Financial Services Compensation\
    \ Scheme (FSCS), which covers up to £120,000 per person. In specific circumstances\
    \ involving temporary high balances, protection is available up to £1.4 million\
    \ for a period of six months. \n\nWe provide educational guidance to help you\
    \ decide if this is the right tool for your needs, although we do not provide\
    \ individualised financial planning advice. For those who require more flexibility\
    \ and immediate access to their funds without a monthly cap, you may wish to consider\
    \ the Fernbridge Easy Access Saver — overview."
  domain: retail_banking
  product_category: members_regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 16fc6494-7868-541e-a26b-575dc8998b00
  title: Fernbridge Members' Regular Saver — interest rate (AER) explained
  body: 'What exactly is the interest rate on my account?

    Your account earns an annual interest rate of 6.5%. This is quoted as the Annual
    Equivalent Rate (AER), which is a standardised way of showing what the interest
    rate would be if interest was paid and compounded each year. This allows you to
    compare our rate fairly against other savings products.


    How is the 6.5% interest applied?

    Interest is calculated on the balance of your account and is credited to you.
    Because you are depositing funds monthly up to the maximum monthly deposit of
    £250, the actual cash interest you earn over the 12 months will be based on the
    average balance held throughout the term.


    Can the interest rate change during my 12-month term?

    While the current rate is 6.5%, as a mutual institution, our rates are reviewed
    periodically to ensure they remain fair and competitive for our members. We will
    notify you clearly of any changes to your rate via secure digital messaging.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: faq
  source_authority: official
