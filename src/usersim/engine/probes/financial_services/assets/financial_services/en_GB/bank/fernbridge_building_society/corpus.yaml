- id: a6dd35b8-48b8-5a16-8935-aef22e244682
  title: Fernbridge First Home Five-Year Fixed Mortgage — choosing between tiers or
    options
  body: "When deciding on the right mortgage, first-time buyers often compare our\
    \ five-year fixed product against variable-rate options or shorter-term fixes.\
    \ \n\nFernbridge First Home Five-Year Fixed Mortgage:\n- Interest Rate: 6.39%\
    \ (Fixed for 5 years).\n- Cost: £0 product fee.\n- Stability: High. Your payments\
    \ are guaranteed for five years, protecting you from rate rises.\n- Flexibility:\
    \ Includes a 10% annual overpayment allowance, but carries a 5% early repayment\
    \ charge in year one.\n\nStandard Variable Rate (SVR) Option:\n- Interest Rate:\
    \ 7.24% (Current).\n- Stability: Low. The rate can change at any time, meaning\
    \ your monthly payments could increase.\n- Flexibility: Generally higher, as there\
    \ are typically no fixed-term early repayment charges.\n\nWho it suits:\nOur Five-Year\
    \ Fixed Mortgage is best for disciplined savers and first-time buyers who value\
    \ budget certainty and want to avoid the risk of rising payments during the early\
    \ years of homeownership. The SVR is generally only suitable for those who expect\
    \ to pay off their mortgage very quickly or who require absolute flexibility to\
    \ exit the loan without penalty."
  domain: lending_mortgage
  product_category: first_home_mortgage
