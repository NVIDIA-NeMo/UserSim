- id: ae14ce94-9616-5777-9952-0340560fbe31
  title: Fernbridge One-Year Fixed Rate Bond — set up and activate
  body: 'Setting up your Fernbridge One-Year Fixed Rate Bond is a straightforward
    process. Please ensure you have the details of your Nominated Bank Account (the
    external current account where we send funds) and your identification documents
    ready.


    1. Confirm your deposit amount: Tell us the total sum you wish to invest. This
    must be at least the minimum deposit of £1,000.

    2. Provide identity verification: We will perform a rigorous identity check. You
    will be asked to provide valid identification to ensure the security of your account.

    3. Verify your Nominated Bank Account: Provide the account number and sort code
    of the external account you wish to link to your bond for the eventual return
    of funds.

    4. Confirm the term: We will confirm that your funds will be committed for a fixed
    period of 12 months at the rate of 4.45%.

    5. Authorise the fund movement: We will use multi-factor authentication to ensure
    the transfer of your £1,000 (or more) from your nominated account into the bond.


    Once these steps are complete, we will provide you with a confirmation message
    via secure digital messaging, and your bond will be active. You will then earn
    interest at the fixed rate of 4.45% for the duration of the 12-month term.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: how_to_guide
