  institution_id: fernbridge_building_society
- id: 9df1a742-b8d2-5c4c-b94a-9fd26fc32897
  title: Fernbridge First Home Five-Year Fixed Mortgage — interest rate / AER schedule
  body: 'The Fernbridge First Home Five-Year Fixed Mortgage employs a two-stage interest
    rate structure:


    1. Initial Fixed Period:

    For the first five years of the mortgage term, a flat interest rate of 6.39% applies
    to the entire outstanding balance. This rate is guaranteed and will not change
    during this period.


    2. Post-Fixed Period:

    Upon the expiry of the five-year term, the interest rate will transition to the
    Standard Variable Rate (SVR) of 7.24%.


    Because this is a lending product, the rates are quoted as the cost of borrowing
    rather than a yield (AER). The overall cost of the mortgage over the full term
    is reflected in the APRC of 7.1%.'
