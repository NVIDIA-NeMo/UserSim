- id: 2e972f5e-8138-509d-956d-cec17b97d999
  title: Fernbridge Easy Access Saver — fraud and unauthorised-activity protection
  body: 'At Fernbridge Building Society, we believe that accessibility should never
    come at the cost of security. When choosing a savings home, it is important to
    understand how your funds are protected against unauthorised activity and fraud.


    Our security framework for the Fernbridge Easy Access Saver is built on rigorous
    identity verification. Before any state-changing action occurs—such as updating
    your personal details or moving funds—we mandate strict verification protocols.
    We employ multi-factor authentication (MFA) to ensure that all movements of money
    and changes to account information are authorised exclusively by the account holder.


    Members should be aware of common fraud patterns targeting flexible savings accounts.
    A typical scam involves ''spoofing'' or ''impersonation'', where a fraudster calls
    pretending to be from our security team, claiming your Fernbridge Easy Access
    Saver is at risk and urging you to move your money to a ''safe account''. Please
    be aware: we will never ask you to move your funds to a different account for
    security reasons, nor will we ever ask for your full security credentials or MFA
    codes over the telephone.


    If you notice any transaction you do not recognise, or if you receive a suspicious
    request for information, you must inform us immediately. Prompt reporting is essential
    to limit your potential liability and allows us to secure your account instantly.
    In the event of an unauthorised payment, we treat the matter with urgency and
    aim to provide a final response within 15 business days for payment services.


    Beyond our active security measures, your peace of mind is supported by the Financial
    Services Compensation Scheme (FSCS). Member deposits are protected by the FSCS
    up to £120,000 per person, with temporary high balances protected up to £1.4 million
    for six months. This ensures that even in the unlikely event of institutional
    failure, your disciplined savings remain secure.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: ee9364d1-a742-5dcf-adb2-75dd6d0db483
  title: Fernbridge Easy Access Saver — account agreement
  body: 'This agreement outlines the binding terms and obligations between the member
    and Fernbridge Building Society regarding the Fernbridge Easy Access Saver. As
    a member-owned mutual, we prioritise the financial wellbeing of our members over
    external shareholder profit.


    1. Account Opening and Maintenance

    To open a Fernbridge Easy Access Saver, the member must provide a minimum opening
    deposit of £1. This low threshold is designed to ensure our services remain accessible
    to all members of the community. The account is maintained for the benefit of
    the member, provided they adhere to our identity verification and security protocols.


    2. Interest and Application

    The society provides an interest rate of 3.6% on the balance of the account. This
    rate is variable and may be adjusted by the society to reflect changes in the
    wider economic environment or our internal operational costs. Interest is calculated
    daily and credited to the account according to our standard schedule.


    3. Fund Movements and Security

    All fund movements must be authorised via multi-factor authentication. We will
    only transfer funds to a verified Nominated Bank Account. Any request to change
    the Nominated Bank Account will be subject to rigorous identity verification to
    prevent unauthorised withdrawals.


    4. Protection and Regulation

    We operate under the authority of the PRA and regulation by the FCA. In accordance
    with the Consumer Duty, we commit to fair outcomes for all members. Deposits are
    protected by the FSCS up to £120,000 per person, with temporary high balances
    protected up to £1.4 million for a period of six months from the date of deposit.


    5. Termination and Closure

    Either the member or the society may close the account at any time. Upon closure,
    the remaining balance, including any accrued interest, will be transferred to
    the member''s Nominated Bank Account. We aim to process closure requests and final
    payments efficiently, ensuring members are not unfairly disadvantaged by the exit
    process.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 37781f7f-42c5-5d42-aab2-fdf13955b196
  title: Fernbridge Easy Access Saver — who it is best for and common use cases
  body: 'The Fernbridge Easy Access Saver is specifically designed as a flexible,
    low-barrier entry point for our members. Unlike complex financial products that
    require significant initial capital, this account is built for accessibility and
    fairness.


    Who is this account best for?

    This product is ideal for first-time buyers who are building their initial deposit
    but need to keep their funds liquid for unexpected costs. It is also highly suited
    for disciplined savers who want a secure place to grow their everyday savings
    without the restriction of a fixed-term lock-in. Because we are a mutual, this
    account serves those who value community-centric banking over corporate profit.


    Common Use Cases:

    - Emergency Funds: Because the account offers easy access, it is the perfect vehicle
    for a ''rainy day'' fund, providing a competitive return of 3.6% while ensuring
    money is available when life happens.

    - Stepping Stone Savings: Members often use this account to accumulate a larger
    sum before transitioning their funds into a more specialised vehicle, such as
    the Fernbridge Cash Lifetime ISA for a first home purchase.

    - Entry-Level Saving: With a minimum opening deposit of only £1, this account
    allows anyone to start their saving journey immediately, regardless of their current
    financial standing.


    Key Product Specifications:

    - Annual Interest Rate: 3.6%

    - Minimum Opening Deposit: £1

    - Access: Flexible, allowing members to withdraw or transfer funds as needed.

    - Protection: Member deposits are protected by the FSCS up to £120,000 per person
    (and up to £1.4 million for temporary high balances for six months).


    By removing high barriers to entry and maintaining a transparent, fair rate, we
    help our members build the financial resilience necessary for long-term stability.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 496b5ab2-75e0-5e5a-8ecf-9651ad7d22dc
  title: Fernbridge Easy Access Saver — minimum deposit to open explained
  body: 'Q: How much money do I need to open a Fernbridge Easy Access Saver?


    A: We believe that everyone should have the opportunity to save. To open this
    account, you only need a minimum opening deposit of £1. This ensures that our
    members can start growing their savings immediately, regardless of the amount
    they have available.


    Q: If I open the account with £1, can I add more money later?


    Yes, absolutely. Once your account is open, you can make further deposits of any
    amount at any time to take advantage of the 3.6% interest rate.


    Q: Does the £1 minimum apply to every deposit, or just the first one?


    The £1 requirement is specifically the minimum opening deposit required to establish
    the account. Subsequent deposits are subject to our standard transfer terms. For
    more details on our product features, please refer to the Fernbridge Easy Access
    Saver — who it is best for and common use cases document.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: ea9ee59f-344a-524e-aff0-f4f8dcf175e9
  title: Fernbridge Easy Access Saver — cancel, close, or downgrade
  body: 'If your financial goals have changed, you may wish to close your Fernbridge
    Easy Access Saver or move your funds into a different product. We aim to make
    this process transparent and straightforward.


    Before you begin:

    Ensure you have the details of your Nominated Bank Account ready. Since we do
    not issue our own current accounts or cards, all closing balances must be sent
    to an external account in your name.


    Steps to close your account:

    1. Request Account Closure: Inform us that you wish to close your Fernbridge Easy
    Access Saver. We will then begin the process of calculating your final balance.

    2. Identity Verification: To protect your funds, we will perform a rigorous identity
    verification check. This may include multi-factor authentication to ensure the
    request is authorised by the account holder.

    3. Confirm Nominated Bank Account: You will be asked to confirm the external current
    account where you wish the funds to be sent. We will verify that this account
    matches our records for your Nominated Bank Account.

    4. Final Balance Calculation: We will calculate the total balance, including any
    interest accrued up to the date of closure, at the current rate of 3.6%.

    5. Transfer of Funds: We will initiate the transfer of the total balance to your
    verified Nominated Bank Account.

    6. Final Confirmation: You will receive a confirmation via secure digital messaging
    that the account has been closed and the funds have been dispatched.


    If you wish to ''downgrade'' or move your funds to another Fernbridge product
    (such as moving from an easy access model to a fixed-term bond), you can follow
    these same steps but request a product transfer instead of a full closure. This
    allows you to keep your membership with our mutual society while changing your
    saving strategy.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 362f415c-d18f-50da-9ba6-ea64ef3b32bb
  title: Fernbridge Easy Access Saver — an unexpected charge or amount
  body: 'Members may occasionally notice a balance in their Fernbridge Easy Access
    Saver that differs from their own manual calculations. Because we maintain a transparent
    pricing structure and keep fees to a minimum, unexpected charges are rare, but
    discrepancies can occur.


    Symptom: The account balance is higher or lower than expected, or a transaction
    appears that the member does not recognise.


    Likely Causes:

    - Interest Crediting: The 3.6% interest may have been credited on a date different
    from the member''s expectation.

    - Pending Transfers: A transfer to or from a Nominated Bank Account may be in
    a pending state and not yet reflected in the available balance.

    - Accrued Interest Calculation: Interest is calculated daily, which can sometimes
    lead to small differences if the member is using a simple monthly estimate.


    What to check (in order):

    1. Review Recent Statements: Check the transaction history to see if a specific
    interest credit or transfer was applied on a particular date.

    2. Verify Transfer Status: Confirm whether a recent request to move funds is still
    processing.

    3. Check Nominated Bank Account: Ensure that any funds sent from Fernbridge have
    been successfully received by the external account.


    Resolution and Escalation:

    If the discrepancy remains unresolved after these checks, we will perform a full
    audit of the account transactions. If we identify an error on our part, we will
    correct the balance immediately.


    If the member believes the unexpected amount is due to unauthorised activity,
    the case will be escalated to the Member Relations team for a high-priority fraud
    investigation. We aim to provide a final response within 15 business days for
    payment-related disputes. Members are reminded that they have the right to escalate
    unresolved disputes to the Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: a84f60eb-6722-5604-962a-8b3a823559d3
  title: Fernbridge Easy Access Saver — required documentation
  body: 'To ensure fair outcomes and comply with PRA and FCA regulations, we require
