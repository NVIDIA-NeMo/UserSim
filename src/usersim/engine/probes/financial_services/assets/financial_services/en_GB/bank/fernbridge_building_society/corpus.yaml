- id: b0f71ef1-f523-5694-a264-64a1620d5eec
  title: Fernbridge Easy Access ISA — set up and activate
  body: 'Setting up your Fernbridge Easy Access ISA is a straightforward process designed
    to get your tax-efficient savings started quickly. Before you begin, please ensure
    you have your government-issued photo identification and the details of the external
    current account you wish to use as your Nominated Bank Account.


    1. Provide your personal details and identification: Tell us your full name, address,
    and date of birth. We will then perform a rigorous identity verification check,
    which may involve reviewing your photo ID to comply with regulatory requirements.


    2. Nominate your external bank account: Provide the sort code and account number
    for the external current account where you wish to receive your funds. Since we
    are a mutual society focused on savings and mortgages, we do not issue our own
    current accounts; this Nominated Bank Account is essential for all fund movements.


    3. Confirm your ISA eligibility: Confirm that you have not exceeded your annual
    ISA allowance of £20,000 for the current tax year. We will record this to ensure
    your account remains compliant with government regulations.


    4. Make your initial deposit: Tell us the amount you wish to transfer from your
    Nominated Bank Account into your new ISA. We will then initiate the transfer.
    Please remember that total contributions must stay within the £20,000 annual limit.


    5. Verification of activation: Once the funds have arrived, we will send you a
    secure digital message confirming that your Fernbridge Easy Access ISA is active
    and currently earning interest at 3.85%.


    Your account is now ready. You can manage your savings via telephone or secure
    digital messaging during UK business hours.'
