- id: 0287090c-1127-5a0d-9f86-ffa4bd61cada
  title: Fernbridge Members' Regular Saver — set up and activate
  body: 'Setting up your Fernbridge Members'' Regular Saver is a straightforward process
    designed to get you saving as quickly as possible. Please ensure you have the
    details of your Nominated Bank Account (the external current account we will use
    to move your funds) ready before you begin.


    1. Request the account opening

    Tell us that you wish to open a Fernbridge Members'' Regular Saver. We will then
    begin the process of creating your new savings vehicle.


    2. Complete identity verification

    To protect your security, we must perform rigorous identity verification. We will
    guide you through a multi-factor authentication process to ensure that you are
    the authorised account holder. This is a mandatory security step before we can
    activate any state-changing action on your profile.


    3. Provide your Nominated Bank Account details

    Provide us with the account number and sort code of the external current account
    you wish to link to your saver. Since Fernbridge does not issue its own current
    accounts or cards, this nominated account is where we will collect your monthly
    deposits and where we will send your funds at the end of the term.


    4. Define your monthly saving amount

    Tell us the exact amount you wish to save each month. This must be no more than
    the maximum monthly deposit of £250. We will confirm the amount and the date of
    the monthly transfer.


    5. Activation confirmation

    Once we have verified your details and linked your Nominated Bank Account, we
    will send you a confirmation via secure digital messaging. This message will confirm
    that your account is active, the 6.5% interest rate is applied, and your first
    deposit is scheduled. Your account is officially active once this confirmation
    is received.'
  domain: retail_banking
  product_category: members_regular_saver
