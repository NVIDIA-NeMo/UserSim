  institution_id: fernbridge_building_society
- id: 869ef261-c60e-517b-a750-e1d87e72765f
  title: Fernbridge Members' Regular Saver — how rates are tiered and applied
  body: 'The Fernbridge Members'' Regular Saver employs a flat-rate interest structure
    to ensure simplicity and fairness for all members. There are no balance tiers;
    the same rate applies to all eligible accounts regardless of the total balance.


    Annual Interest Rate: 6.5% (AER)


    Application of Rate:

    - The 6.5% rate is applied to the daily balance of the account.

    - Interest is credited to the account monthly, allowing members to benefit from
    compounding growth over the 12 month term.

    - To maintain eligibility for this rate, members must adhere to the maximum monthly
    deposit limit of £250.


    Changes to Rates:

    As a mutual, we review our rates regularly to ensure they remain competitive and
    reflect our commitment to member wellbeing. If the rate of 6.5% is adjusted, we
    will notify all members through secure digital messaging or post, ensuring transparency
    in accordance with our brand voice.'
