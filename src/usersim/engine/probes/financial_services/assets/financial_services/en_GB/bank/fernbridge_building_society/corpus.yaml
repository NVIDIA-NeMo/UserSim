  institution_id: fernbridge_building_society
- id: 1b835d40-c41b-524a-a52f-8830a1789f65
  title: Fernbridge Members' Regular Saver — comparison vs. alternatives and when
    not to choose it
  body: 'Choosing the right savings vehicle depends on your financial discipline and
    the amount of capital you wish to set aside. The Fernbridge Members'' Regular
    Saver is a specialist tool designed for those building a habit of consistent saving.


    Why Choose the Regular Saver?

    The primary draw is the high interest rate of 6.5%. This is significantly higher
    than what is typically offered on standard easy-access accounts, making it an
    ideal choice for members who can commit to saving a set amount each month over
    a 12 month term.


    When NOT to Choose this Product

    • Large Lump Sums: If you have £5,000 ready to save today, this product is not
    the right choice because of the maximum monthly deposit of £250. You would only
    be able to utilise a small fraction of your funds each month, leaving the rest
    in a lower-interest account. In this case, a product like the Fernbridge One-Year
    Fixed Rate Bond may be more suitable.

    • Need for Flexibility: If you are uncertain about your ability to commit to a
    12 month timeframe or if you may need to withdraw your funds on short notice,
    the restrictions of a regular saver may be too limiting. The Fernbridge Easy Access
    Saver is better suited for emergency funds.

    • Tax-Efficiency Goals: If your priority is protecting your savings from tax,
    you should consider our ISA range, such as the Fernbridge Easy Access ISA, rather
    than a standard saver.


    In summary, the Fernbridge Members'' Regular Saver is best for the disciplined
    saver who wants to maximise the growth of a monthly surplus. If you prefer to
    deposit a large sum once and let it grow, or if you require total flexibility,
    our other savings products will serve you better. For more information on different
    saving paths, see Fernbridge Easy Access Saver — overview.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: a1341b38-b800-58ad-98f7-81c5fa51514e
  title: Fernbridge Members' Regular Saver — eligibility and setup
  body: 'Q: Who is eligible to open a Fernbridge Members'' Regular Saver?


    A: This account is available to all existing members of our building society.
    As a mutual, we prioritise our members, and this product is specifically designed
    to help our community grow their savings through a 6.5% interest rate.


    Q: What do I need to provide to set up the account?


    A: To open the account, you will need to provide a Nominated Bank Account. This
    is the external current account from which we will receive your monthly deposits
    (up to the £250 limit). We will also perform a mandatory identity verification
    to secure your account.


    Q: How long does the setup process take?


    A: Once your identity is verified and your Nominated Bank Account is confirmed,
    the account is typically activated immediately. You can then begin your 12 month
    saving term. For more on our requirements, see Fernbridge Members'' Regular Saver
    — eligibility requirements.'
