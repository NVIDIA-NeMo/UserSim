- id: 90d1bd3c-8c3d-5b0c-a19e-ebc10dc36a45
  title: Fernbridge One-Year Fixed Rate Bond — vs. a typical competitor offering
  body: 'When comparing the Fernbridge One-Year Fixed Rate Bond to typical offerings
    from large shareholder-owned banks, the primary differences lie in the institutional
    structure and the certainty of return.


    Dimension | Fernbridge One-Year Fixed Rate Bond | Typical Competitor Offering

    :--- | :--- | :---es

    Ownership | Member-owned mutual | Shareholder-owned PLC

    Interest Rate | Guaranteed 4.45% for 12 months | Often variable or tiered

    Minimum Entry | £1,000 | Often higher for ''premium'' fixed rates

    Focus | Member wellbeing & community | Shareholder profit


    Fernbridge is the better choice for members who value transparency and want to
    know that their 4.45% yield is supported by a society that prioritises its members
    over external investors. Our commitment to fairness means our fees are kept to
    a minimum, only covering direct operational costs.


    A competitor''s offering might be preferable if the member requires a much larger
    term (e.g., 5 years) or if they need an integrated current account, as Fernbridge
    requires a Nominated Bank Account for all fund movements.'
