  institution_id: fernbridge_building_society
- id: 2829e8c4-a751-5ee5-bf57-48969795ddf4
  title: Fernbridge Members' Regular Saver — cancel, close, or downgrade
  body: 'If you need to close your Fernbridge Members'' Regular Saver before the 12
    month term has concluded, or wish to transition your funds to a different product,
    please follow these steps.


    Before you begin, ensure you have your account details and the details of your
    Nominated Bank Account ready for verification.


    1. Request Account Closure: Tell us that you wish to close your Fernbridge Members''
    Regular Saver. You can do this via secure digital messaging or telephone during
    UK business hours.

    2. Identity Verification: We will perform a rigorous identity verification process,
    including multi-factor authentication, to ensure the request is authorised by
    the account holder.

    3. Specify Fund Destination: Confirm that you wish the full balance, including
    any accrued interest at the 6.5% rate, to be transferred to your Nominated Bank
    Account. If you prefer to move the funds into another product, such as the Fernbridge
    Easy Access Saver, tell us at this stage.

    4. Final Balance Calculation: We will calculate the final balance. Please note
    that closing the account before the end of the 12 month term may affect the final
    interest paid, as per the account agreement.

    5. Confirmation: We will provide a confirmation message or email stating that
    the account is closed and the funds have been dispatched.

    6. Receipt of Funds: You will see the funds arrive in your Nominated Bank Account.
    Depending on the banking network, this usually occurs within one to three business
    days.


    If you are undecided about closing the account and are comparing your options,
    you may find it helpful to review Fernbridge Members'' Regular Saver — vs. a typical
    competitor offering to see if the 6.5% rate still provides the best value for
    your needs.'
  domain: retail_banking
