- id: 96b19906-88ef-5794-84b3-2317e09ad852
  title: Fernbridge Cash Lifetime ISA — set up and activate
  body: 'Setting up your Fernbridge Cash Lifetime ISA is a straightforward process
    designed to get your home-buying journey started quickly. Please follow these
    steps:


    1. Provide Personal Details: Tell us your full name, date of birth, and residential
    address. To be eligible, you must be under the maximum opening age of 39.

    2. Complete Identity Verification: We will perform a rigorous identity check.
    You will need to provide a valid form of government-issued photo identification
    and a recent proof of address. We will use multi-factor authentication to secure
    your new account details.

    3. Nominate Your Bank Account: Provide the details of the external current account
    you wish to use as your Nominated Bank Account. Since we do not issue our own
    current accounts, all funds will be moved between this account and your ISA.

    4. Initial Funding: Tell us how much you wish to deposit to start your account.
    Please remember that the annual limit is £4,000 per tax year.

    5. Confirmation: We will confirm once your account is active and provide you with
    your account number and the current interest rate of 3.75%.


    Once activated, your savings will start earning interest immediately, and the
    25% government bonus will be applied to your eligible contributions in accordance
    with government timescales.


    If you are deciding between different savings vehicles, you may find the Fernbridge
    Cash Lifetime ISA — vs. a similar product here helpful for comparing this account
    with our standard ISAs.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: how_to_guide
