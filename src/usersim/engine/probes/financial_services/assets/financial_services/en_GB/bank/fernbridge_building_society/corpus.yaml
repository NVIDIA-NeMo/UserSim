  institution_id: fernbridge_building_society
- id: e9253a6a-5c20-585a-afa7-efb7f4b8db91
  title: Fernbridge Easy Access Saver — change-of-terms policy
  body: 'As a mutual institution, Fernbridge Building Society manages the Fernbridge
    Easy Access Saver to prioritise the long-term financial wellbeing of our members.
    This document outlines our policy regarding changes to the terms and conditions
    of your account.


    Interest Rates: The interest rate of 3.6% is variable. We reserve the right to
    review and change this rate periodically to reflect market conditions and the
    operational needs of the society. When we change the rate, we will notify you
    through our secure digital messaging service or by post. Because we are a mutual,
    rate changes are determined by our commitment to fairness and community-centric
    banking rather than the desire for shareholder profit.


    Terms Amendments: We may amend the general terms of the account agreement, such
    as the minimum opening deposit of £1 or the methods of fund movement, if required
    by the PRA or FCA to ensure we are adhering to the Consumer Duty. We will provide
    you with a minimum of 21 days'' notice before any significant change to the terms
    takes effect.


    Member Rights: You have the right to close your account and withdraw your funds
    if you disagree with a change in terms. As this is an ''easy access'' product,
    you may do so without penalty, provided the identity verification process is completed
    for the transfer to your Nominated Bank Account.


    Termination: Fernbridge may terminate this agreement if we suspect fraudulent
    activity or if we can no longer verify your identity to the required regulatory
    standard. In such cases, funds will be returned to your Nominated Bank Account
    following a full compliance review.'
  domain: retail_banking
