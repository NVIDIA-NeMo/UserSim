- id: 414b3e1d-f46e-573b-aed5-43a0665b62a3
  title: Fernbridge Cash Lifetime ISA — risk disclosures
  body: 'This document provides essential regulatory and risk disclosures regarding
    the Fernbridge Cash Lifetime ISA. Please read these carefully before committing
    your funds.


    Withdrawal Risks and Penalties

    The Fernbridge Cash Lifetime ISA is a restricted-access account. The most significant
    risk is the withdrawal charge of 25%, which applies to any funds removed from
    the account for reasons other than purchasing a first home or reaching age 60.
    Because this charge is applied to the total amount withdrawn (including the government
    bonus), a non-qualifying withdrawal will result in the loss of the entire government
    bonus and a portion of your own original capital.


    Property Price Restrictions

    The government bonus can only be used towards the purchase of a first home if
    the property price does not exceed the property price cap of £450,000. If you
    purchase a property above this value, you cannot use the account for that purchase
    without incurring the 25% withdrawal charge.


    Contribution Limits

    The annual limit for deposits is £4,000 per tax year. Exceeding this limit across
    all your Lifetime ISAs may lead to complications with HMRC and the potential rejection
    of deposits.


    Age Constraints

    This account can only be opened by individuals up to the maximum opening age of
    39. If you are already over this age, you are ineligible for this product.


    Deposit Protection

    We operate under the authority of the PRA and regulation by the FCA. Your deposits
    are protected by the FSCS up to £120,000 per person, with temporary high balances
    protected up to £1.4 million for six months. This ensures that your savings are
    secure up to these limits.


    Interest Rate Volatility

    While the current interest rate is 3.75%, this is not fixed for the lifetime of
    the account and may change in accordance with our terms and conditions.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
