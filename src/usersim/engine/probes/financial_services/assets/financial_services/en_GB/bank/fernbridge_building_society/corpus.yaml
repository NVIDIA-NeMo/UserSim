  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 4e46a413-1bfc-5e20-9fe9-f3104df8fdf0
  title: Fernbridge One-Year Fixed Rate Bond — comparison vs. alternatives and when
    not to choose it
  body: 'When deciding where to place your savings, it is important to choose the
    product that aligns with your financial goals. The Fernbridge One-Year Fixed Rate
    Bond is a secure, higher-yield option that rewards members for their discipline
    in committing funds for a set period.


    **How it compares to our other products**

    - **Vs. Easy Access Saver:** While the Easy Access Saver provides total flexibility
    to withdraw your money whenever you need it, the One-Year Fixed Rate Bond offers
    a higher, guaranteed interest rate of 4.45%. The trade-off is that your funds
    are locked for 12 months.

    - **Vs. Members'' Regular Saver:** The Regular Saver is designed for those building
    a habit of consistent monthly saving. The One-Year Fixed Rate Bond, however, is
    intended for those who already have a lump sum of at least £1,000 and want to
    maximise their return on that specific amount.


    **When NOT to choose the Fixed Rate Bond**

    - **If you need liquidity:** If there is any chance you will need your money within
    the next year, this is not the right choice. Fixed-term bonds are not flexible,
    and early access to your funds can be costly.

    - **If you have less than £1,000:** Because this product requires a minimum deposit
    of £1,000, it is not available for smaller starting balances. We recommend our
    flexible savings options for those starting their savings journey.

    - **If you are saving for a first home:** While this bond grows your money, you
    may find the Fernbridge Cash Lifetime ISA more beneficial due to the 25% government
    bonus available for first-time buyers.


    By choosing this bond, you are opting for stability and a competitive 4.45% return,
    provided you can commit to the 12-month term.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: cdd1ea8f-a8f4-511d-b827-bc25720af457
  title: Fernbridge One-Year Fixed Rate Bond — eligibility and setup
  body: '**Who is eligible to open a Fernbridge One-Year Fixed Rate Bond?**

    This account is available to all current members of the Fernbridge Building Society.
    If you are not yet a member, you will first need to join our mutual society before
    opening a bond.


    **What are the requirements to set up the account?**

    To open the bond, you must provide a minimum initial deposit of £1,000. We will
    also perform a standard identity verification check using multi-factor authentication
    to ensure the security of your funds.


    **How long does the setup process take?**

    Once you have provided the minimum £1,000 deposit and successfully passed our
    identity checks, the account is typically established immediately. We will confirm
    the start of your 12-month term and your 4.45% interest rate during the setup
    conversation.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: e8bcc6bf-71ea-5614-8f9e-256977e4a017
  title: Fernbridge One-Year Fixed Rate Bond — resolve a common request end-to-end
  body: 'One of the most common requests for the Fernbridge One-Year Fixed Rate Bond
    is the closing of the account and the transfer of funds upon maturity (at the
    end of the 12-month term).


    To resolve this request from start to finish, please follow these steps:


    1. Notify us that your bond has reached its 12-month maturity date and you would
    like to close the account and receive your funds.

    2. Confirm the details of your Nominated Bank Account. This is the external current
    account where we will send your total balance, including the initial £1,000 deposit
    and all interest earned at the 4.45% rate.

    3. Complete our mandatory identity verification. We will use multi-factor authentication
    to ensure that the fund movement is authorised by the account holder.

    4. We will then perform a final calculation of the total balance and provide you
    with the exact amount that will be transferred.

    5. Once you confirm you are happy with the amount, we will initiate the transfer
    of funds to your Nominated Bank Account.


    You will know the request is complete when we provide you with a transfer confirmation
    reference and your bond account is officially closed in our records. The funds
    will then appear in your Nominated Bank Account according to standard banking
    processing times.


    If you are considering this product and want to know how it compares to others
    before committing your £1,000, you may find Fernbridge One-Year Fixed Rate Bond
    — comparison vs. alternatives and when not to choose it useful.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: cb94f4d5-c18f-57e7-a4ff-2904715ea55f
  title: Fernbridge One-Year Fixed Rate Bond — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting members who report that the balance
    or interest on their Fernbridge One-Year Fixed Rate Bond does not match their
    own records.


    **Symptom**

    The member claims the interest credited is lower than expected or the total balance
    is incorrect based on their initial £1,000+ deposit.


    **Likely Causes**

    - **AER Misunderstanding:** The member may be calculating interest on a daily
    or monthly basis without accounting for how the 4.45% Annual Equivalent Rate (AER)
    is compounded over the 12-month term.

    - **Timing of Crediting:** The member may be checking their statement before the
    interest has been officially credited to the account.

    - **Incorrect Initial Deposit Record:** There may be a discrepancy between the
    amount the member believes they deposited and the actual amount received in the
    Nominated Bank Account transfer.


    **Step-by-Step Resolution**

    1. **Verify the Opening Balance:** Confirm the exact amount of the initial deposit.
    Ensure it met the £1,000 minimum and check the date the funds were received.

    2. **Review the Interest Calculation:** Calculate the interest based on the 4.45%
    rate for the exact number of days the funds have been held. Explain the AER calculation
    to the member in plain English.

    3. **Check Statement Dates:** Confirm that the member is looking at the most recent
    statement and that no pending interest credits are awaiting processing.


    **Escalation**

    If the discrepancy cannot be resolved through these checks, escalate the case
    to the Member Relations team. They will perform a full audit of the account''s
    transaction history. The member should be informed that the Member Relations team
    will provide a final response regarding the discrepancy, typically within our
    standard timelines for non-payment disputes.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: troubleshooting
  source_authority: official
  placeholder: true
