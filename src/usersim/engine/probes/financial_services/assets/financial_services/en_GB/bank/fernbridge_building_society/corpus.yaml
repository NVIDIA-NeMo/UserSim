- id: f89c6670-0e24-5dcd-9522-41235ebb1924
  title: Fernbridge One-Year Fixed Rate Bond — vs. a similar product here
  body: 'When deciding where to place your savings, it is important to choose the
    product that matches your need for liquidity versus your desire for yield.


    **Fernbridge One-Year Fixed Rate Bond**

    - **Rate**: 4.45% AER (Fixed).

    - **Access**: Funds are locked for 12 months.

    - **Minimum**: £1,000 deposit.

    - **Best for**: Members who have a lump sum they do not need immediately and want
    a guaranteed, higher return.


    **Fernbridge Easy Access Saver**

    - **Rate**: Variable (refer to its own rate sheet).

    - **Access**: Flexible, low-barrier entry with immediate access to funds.

    - **Minimum**: Lower entry point than the Fixed Rate Bond.

    - **Best for**: Members building an emergency fund or those who require the flexibility
    to withdraw money at any time.


    If you prioritise maximum growth and can commit to the 12-month term, the Fernbridge
    One-Year Fixed Rate Bond is the superior choice. If you value flexibility and
    accessibility, the Fernbridge Easy Access Saver is the more appropriate option.'
  domain: retail_banking
