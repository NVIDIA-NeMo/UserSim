- id: cc27d5f0-4b73-5ee1-bb87-a5636cf89e94
  title: Fernbridge Cash Lifetime ISA — fraud and unauthorised-activity protection
  body: 'At Fernbridge Building Society, we are committed to protecting your savings
    and ensuring your journey towards homeownership or retirement is secure. Because
    the Fernbridge Cash Lifetime ISA attracts a significant government bonus, it can
    occasionally be a target for sophisticated fraud patterns.


    Common threats include ''bonus-acceleration'' scams, where fraudsters pose as
    government officials or bank representatives claiming they can fast-track your
    25% government bonus in exchange for a processing fee or your account credentials.
    Please be aware that the government bonus is applied automatically based on our
    reports to HMRC; we will never ask you to pay a fee to ''unlock'' or ''speed up''
    this bonus.


    Another common risk is phishing. You may receive messages that appear to be from
    us, urging you to verify your identity to avoid account suspension. We will never
    ask you to disclose your full password, multi-factor authentication codes, or
    your PIN via email or secure messaging. All identity verification is handled through
    our rigorous, authorised channels.


    If you notice any unauthorised activity—such as a withdrawal you did not initiate
    or a change to your Nominated Bank Account—you must inform us immediately. Prompt
    reporting is critical, as it allows us to freeze the account and mitigate potential
    losses. While we operate under the authority of the PRA and regulation by the
    FCA to ensure fair outcomes, your proactive reporting helps us protect your funds
    more effectively.


    Remember, as a member-owned mutual, we prioritise your financial wellbeing. We
    employ multi-factor authentication for all fund movements and personal detail
    changes to ensure that only you can authorise state-changing actions on your account.
    If a request feels urgent, unexpected, or asks for sensitive security details,
    treat it with suspicion and contact us through our official telephone or secure
    digital messaging services during UK business hours.'
