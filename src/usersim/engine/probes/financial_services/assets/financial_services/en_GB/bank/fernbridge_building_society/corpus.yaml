- id: 8f558b8e-c51d-59f9-a33b-6e41b3e4c488
  title: Fernbridge Members' Regular Saver — interest rate / AER schedule
  body: 'The Fernbridge Members'' Regular Saver offers a single, competitive interest
    rate designed to reward consistent saving habits over a fixed period.


    - Applicable Interest Rate: 6.5% (AER)

    - Application: This flat rate applies to all balances within the account, regardless
    of the amount saved, provided the account is maintained within the maximum monthly
    deposit of £250.

    - Term: The rate is applicable for the duration of the 12 months term.


    This rate is reviewed by our mutual board to ensure it remains fair and aligned
    with our commitment to member wellbeing. Should the rate change, we will notify
    you through your secure digital messaging channel. Interest is calculated daily
    and credited to the account to ensure you earn the full 6.5% on every pound you
    save.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: rate_sheet
