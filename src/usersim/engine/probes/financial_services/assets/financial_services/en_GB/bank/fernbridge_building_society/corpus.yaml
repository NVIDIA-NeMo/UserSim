- id: f7c5f6c2-aaaa-5841-93b8-f63bf635f8db
  title: Fernbridge Cash Lifetime ISA — qualification tiers
  body: 'The following matrix defines the eligibility requirements for members seeking
    to open a Fernbridge Cash Lifetime ISA. Support agents should use this to determine
    if a prospective member qualifies.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Age at Opening | 39 years old or under | Eligible |

    | Age at Opening | 40 years old or over | Ineligible |

    | Home Buyer Status | First-time buyer | Eligible for first home withdrawal |

    | Property Value | Up to £450,000 | Eligible for full bonus claim |

    | Property Value | Over £450,000 | Ineligible for bonus on home purchase |

    | Annual Contribution | Up to £4,000 | Eligible for government bonus |

    | Annual Contribution | Over £4,000 | Excess not eligible for bonus |


    For a full overview of the product features, please refer to Fernbridge Cash Lifetime
    ISA — overview.'
