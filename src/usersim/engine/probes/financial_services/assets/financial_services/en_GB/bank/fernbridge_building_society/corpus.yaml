- id: 25dd9e66-b9bb-5561-b913-e97933b0e2ef
  title: Fernbridge Cash Lifetime ISA — account agreement
  body: 'This agreement outlines the terms and conditions governing the Fernbridge
    Cash Lifetime ISA. By opening this account, you agree to abide by the following
    obligations.


    Account Eligibility and Limits

    To open this account, you must be aged 18 or over and no older than the maximum
    opening age of 39. We require rigorous identity verification before the account
    is activated. You may deposit up to the annual limit of £4,000 per tax year. Deposits
    exceeding this limit will not be accepted and may be returned to your Nominated
    Bank Account.


    Government Bonus

    We will apply a government bonus rate of 25% to your qualifying deposits. This
    bonus is credited to your account in accordance with HMRC guidelines and is intended
    to support first-time buyers or those saving for retirement.


    Withdrawals and Charges

    This account is designed for long-term goals. Withdrawals are permitted without
    penalty only for the purchase of a first home (up to the property price cap of
    £450,000) or upon reaching age 60. Any other withdrawal is considered unauthorised
    and will trigger a withdrawal charge of 25%. This charge is applied to the total
    amount withdrawn, which may result in you receiving back less than your original
    contribution.


    Interest and Payments

    We apply an interest rate of 3.75% to your balance. Interest is calculated and
    credited to the account according to our standard schedule. We do not issue current
    accounts or cards; therefore, all funds are moved via your Nominated Bank Account.


    Agreement Termination

    You may request to close your account at any time. However, unless the closure
    is for a qualifying reason (first home purchase or retirement), the withdrawal
    charge of 25% will apply to the remaining balance. We reserve the right to close
    the account if we suspect fraudulent activity or a breach of these terms.


    Regulatory Standing

    We operate under the authority of the PRA and regulation by the FCA. Your deposits
    are protected by the FSCS up to £120,000 per person, with temporary high balances
    protected up to £1.4 million for six months.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 41b274b9-b57a-54ac-a14b-881c9f6741a0
  title: Fernbridge Cash Lifetime ISA — who it is best for and common use cases
  body: 'The Fernbridge Cash Lifetime ISA is a specialist savings vehicle engineered
    to help our members reach significant life milestones faster. Because we are a
    member-owned mutual, we focus on accessibility and fairness, making this product
    ideal for those who are disciplined savers with a clear long-term objective.


    Who is this product best for?


    1. First-Time Buyers

    This account is specifically designed for those saving for their first property.
    The most compelling feature is the government bonus rate of 25%, which provides
    a substantial boost to your deposit. For example, if you save the full annual
    limit of £4,000, the government adds an additional £1,000.


    2. Retirement Planners

    For members who have already purchased a home or are planning exclusively for
    their later years, this account serves as a tax-efficient way to grow a retirement
    nest egg with the same 25% bonus applied to contributions.


    3. Disciplined Savers

    Because of the strict rules regarding withdrawals, this product is best for those
    who are certain they will not need access to these funds until they buy their
    first home or retire. The interest rate of 3.75% provides a steady return on your
    capital.


    Common Use Cases


    - The First Home Sprint: A member under the maximum opening age of 39 saves £4,000
    annually to maximise their government bonus, aiming to buy a property within the
    property price cap of £450,000.

    - The Long-Term Nest Egg: A member uses the account as a secondary savings tier
    to supplement their pension, benefiting from the tax-free nature of the ISA and
    the compound effect of the 3.75% interest.


    Crucial Considerations

    Please be aware that this is not a flexible savings account. Withdrawals for any
    reason other than a first home purchase or retirement will incur a withdrawal
    charge of 25%. For those requiring more flexibility, you may wish to explore the
    Fernbridge Easy Access Saver — overview.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c1e5b8b5-06dc-5da4-9e7d-aa23933c63b5
  title: Fernbridge Cash Lifetime ISA — Lifetime ISA limit each tax year explained
  body: "Q: How much can I deposit into my Fernbridge Cash Lifetime ISA each year?\n\
    A: You can deposit up to an annual limit of £4,000 per tax year. This limit applies\
    \ across all Lifetime ISAs you may hold; it is not per account. \n\nQ: What happens\
    \ if I try to deposit more than £4,000?\nA: To ensure you remain compliant with\
    \ HMRC rules, we will not accept deposits that exceed the £4,000 annual limit.\
    \ Any funds sent in excess of this amount will be returned to your Nominated Bank\
    \ Account.\n\nQ: Does the 25% government bonus count towards my £4,000 limit?\n\
    A: No, the annual limit applies only to your own personal contributions. The 25%\
    \ government bonus is added on top of your savings and does not reduce the amount\
    \ you can contribute each tax year. For further details on the bonus, please see\
    \ Fernbridge Cash Lifetime ISA — government bonus on payments in explained."
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 85952caa-1d33-5e7e-b9e1-1e3abc7a92c6
  title: Fernbridge Cash Lifetime ISA — cancel, close, or downgrade
  body: "Closing or cancelling your Fernbridge Cash Lifetime ISA is a significant\
    \ action, as it often triggers a government penalty. Please follow these steps\
    \ to ensure the process is handled correctly.\n\nBefore you begin\nEnsure you\
    \ have your account details and your Nominated Bank Account ready. Be aware that\
    \ if you are closing the account for any reason other than purchasing a first\
    \ home (up to £450,000) or retirement (age 60+), a withdrawal charge of 25% will\
    \ be applied to the balance.\n\nStep 1: Request closure\nTell us that you wish\
    \ to close your Fernbridge Cash Lifetime ISA. You must specify the reason for\
    \ the closure, as this determines whether the withdrawal charge applies. If you\
    \ are buying a home, you will need to provide the necessary property purchase\
    \ documentation.\n\nStep 2: Identity verification\nWe will perform a rigorous\
    \ identity verification check. This includes multi-factor authentication to ensure\
    \ that the request to move your funds is authorised by the account holder.\n\n\
    Step 3: Balance calculation and charge application\nWe will calculate the final\
    \ balance, including any accrued interest at the 3.75% rate. If the closure is\
    \ non-qualifying, we will apply the withdrawal charge of 25% to the total amount.\
    \ We will confirm the final amount to be transferred to you.\n\nStep 4: Fund transfer\n\
    Once you confirm the final amount, we will transfer the total balance to your\
    \ Nominated Bank Account. \n\nStep 5: Confirmation\nWe will send a final closing\
    \ statement via secure digital messaging confirming that the account is closed\
    \ and the funds have been dispatched.\n\nIf you wish to move your funds into a\
    \ more flexible product instead of closing them entirely, you may wish to compare\
    \ our other options in Fernbridge Easy Access Saver — overview."
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 99b8c397-1c6e-5f7d-a6a0-8262a164a942
  title: Fernbridge Cash Lifetime ISA — an unexpected charge or amount
  body: 'Symptom: A member reports that the balance in their Fernbridge Cash Lifetime
    ISA is lower than expected after a withdrawal, or they see a deduction they did
    not authorise.


    Likely Causes

    1. Non-Qualifying Withdrawal: The member has withdrawn funds for a reason other
    than purchasing a first home (under the £450,000 cap) or retirement. This triggers
    the mandatory withdrawal charge of 25%.

    2. Government Bonus Clawback: When a non-qualifying withdrawal occurs, the 25%
    charge effectively removes the government bonus and a portion of the member''s
    original principal.

    3. Incorrect Nominated Bank Account: Funds may have been sent to an outdated external
    account.


    What to check in order

    1. Review the Withdrawal Trigger: Check if the withdrawal was requested for a
    first home purchase or retirement. If not, the withdrawal charge of 25% is correct
    and expected.

    2. Verify Property Value: If the withdrawal was for a home, check if the property
    price exceeded the property price cap of £450,000. If the cap was exceeded, the
    withdrawal may be deemed non-qualifying.

    3. Audit the Transaction: Verify the date and amount of the withdrawal against
    the member''s request.


    How to fix

    - If the charge was applied correctly due to a non-qualifying withdrawal, explain
    to the member that the 25% charge is a regulatory requirement and not a Fernbridge
    fee.

    - If the member provided proof of a qualifying purchase but the charge was still
    applied, we will raise a case with the Member Relations team to reverse the charge.


    When to escalate

    If the member disputes the validity of the 25% charge despite the evidence, or
    if there is a suspected error in the calculation, escalate the matter to the Member
    Relations team. We aim for a final response within 15 business days for payment
    services and eight weeks for other matters. Members should be reminded of their
    right to escalate unresolved disputes to the Financial Ombudsman Service free
    of charge.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3705b07d-0b67-5cd9-ac02-764472d97d46
  title: Fernbridge Cash Lifetime ISA — required documentation
  body: 'To open a Fernbridge Cash Lifetime ISA, members must provide the following
    documentation to meet our security and regulatory requirements:


    | Requirement | Required Documentation | Outcome if Missing |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Driving Licence | Application paused
    until verified |

    | Proof of Address | Utility bill or Council Tax statement (last 3 months) | Application
    paused until verified |

    | Age Verification | Birth Certificate or Government ID | Application rejected
    if over the maximum opening age of 39 |

    | Funding Source | Details of the Nominated Bank Account | Unable to accept deposits
    |

    | First Home Status | Self-declaration of first-time buyer status | Account opened,
    but bonus usage restricted to qualified homes |


    All documents are subject to rigorous identity verification before any account
    is activated.'
  domain: retail_banking
