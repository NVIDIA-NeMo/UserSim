- id: 1964c7fc-2d54-5537-b14f-f578c90eb61d
  title: Fernbridge One-Year Fixed Rate Bond — recognising scams targeting this product
  body: 'As a member-owned mutual, we are committed to protecting your financial wellbeing.
    Because the Fernbridge One-Year Fixed Rate Bond offers a competitive interest
    rate of 4.45%, it can occasionally be used as a lure by fraudsters attempting
    to mimic our institution.


    Common scams targeting this product often involve ''rate-switching'' offers or
    ''exclusive'' bonuses. You may receive an unsolicited email, text, or phone call
    from someone claiming to be from Fernbridge, suggesting they can increase your
    yield beyond 4.45% if you move your funds to a new, ''secure'' account. Please
    be aware that we will never ask you to transfer your funds to a third-party account
    to ''verify'' your identity or to ''unlock'' a higher rate of interest.


    Another common tactic is the ''urgent'' request for security details. Fraudsters
    may create a sense of panic, claiming your bond is at risk of closure unless you
    provide a multi-factor authentication (MFA) code or your password immediately.
    We will never ask you to disclose your MFA codes, passwords, or full security
    credentials over the phone or via digital messaging.


    If you notice any suspicious activity, such as an unexpected request for personal
    information or a communication that feels uncharacteristically aggressive, please
    notify us immediately. Prompt reporting is essential to ensure we can take the
    necessary steps to protect your balance. While we employ rigorous identity verification
    and MFA for all state-changing actions, your vigilance is our best defence.


    For more information on how we protect your accounts, you may wish to refer to
    Fernbridge One-Year Fixed Rate Bond — fraud and unauthorised-activity protection.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 4df9e39f-0e8c-547b-bea3-c828cec9cebb
  title: Fernbridge One-Year Fixed Rate Bond — limits, restrictions, and edge cases
  body: 'This document provides guidance for support agents on the operational boundaries
    of the Fernbridge One-Year Fixed Rate Bond. This product is designed as a secure,
    higher-yield option for members who can commit their funds for a full year.


    Key Constraints and Limits:

    - Minimum Deposit: The account cannot be opened with less than £1,000. Any attempt
    to fund the bond below this threshold should be declined.

    - Term Length: The product has a fixed term of 12 months. This duration is non-negotiable.

    - Interest Rate: A flat rate of 4.45% is applied to the balance. This is not a
    tiered rate; it applies regardless of the total deposit amount.

    - Funding Restrictions: Unlike our flexible savings accounts, the Fernbridge One-Year
    Fixed Rate Bond does not allow for additional deposits after the initial account
    opening. It is a single-payment vehicle.


    Edge Cases and Handling:

    - Early Withdrawal: Because this is a fixed-rate product, members are committing
    their funds for the full 12 months. Requests for early closure should be handled
    with caution, as these typically result in a loss of interest or a penalty, as
    detailed in the account agreement.

    - Maturity Actions: Upon the completion of the 12-month term, the funds and accrued
    interest are typically transferred to the member''s Nominated Bank Account. Agents
    must ensure the Nominated Bank Account is fully verified before initiating this
    transfer.

    - Account Protection: Remind members that their deposits are protected by the
    FSCS up to £120,000 per person, providing peace of mind during the fixed term.


    For a broader overview of the product''s purpose, see Fernbridge One-Year Fixed
    Rate Bond — overview.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
