- id: 904737de-adc4-5995-8d3d-00a3575d1d94
  title: Fernbridge Cash Lifetime ISA — account security best practices
  body: 'Because the Fernbridge Cash Lifetime ISA is often a primary vehicle for your
    first home deposit, it is a high-value target for fraudulent activity. To protect
    your hard-earned savings and the 25% government bonus, we urge all members to
    adhere to the following security best practices.


    Multi-Factor Authentication (MFA) is mandatory for all state-changing actions.
    We will never ask you to disclose your MFA codes, full passwords, or PINs over
    the telephone or via secure digital messaging. If you receive a request for this
    information, it is a fraudulent attempt and should be ignored.


    Be vigilant regarding ''urgent'' messages claiming there is an issue with your
    government bonus or your annual limit of £4,000. We will always communicate officially
    through our secure messaging system or formal letters; we will never send a link
    via SMS asking you to ''verify'' your identity to avoid a withdrawal charge.


    Your deposits are protected by the FSCS up to £120,000 per person, providing peace
    of mind for your long-term goals. However, this protection does not prevent social
    engineering scams. If you notice any unauthorised movement of funds to a Nominated
    Bank Account that you do not recognise, or if you suspect your credentials have
    been compromised, you must notify us immediately through our secure channels.


    We employ rigorous identity verification before any personal detail changes are
    authorised. If you are asked to provide sensitive documents via an unencrypted
    email, stop the process and contact us directly to ensure you are speaking with
    a verified Fernbridge agent.


    For further information on how we protect your information, see Fernbridge Cash
    Lifetime ISA — privacy and data handling.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 1160701a-8842-5c53-9e6e-9818716af1a4
  title: Fernbridge Cash Lifetime ISA — change-of-terms policy
  body: 'This policy outlines how Fernbridge Building Society manages changes to the
    terms and conditions of the Fernbridge Cash Lifetime ISA. As a mutual, we strive
    for transparency and fairness in all our member agreements.


    Interest Rates: The interest rate of 3.75% is variable. We reserve the right to
    adjust this rate to reflect changes in the wider market or our operational costs.
    We will notify you of any rate changes via secure digital messaging or post at
    least 30 days before the change takes effect.


    Government Bonus and Limits: The government bonus rate of 25% and the annual contribution
    limit of £4,000 are set by UK government legislation. Any changes to these figures
    will be implemented in accordance with statutory requirements, and we will provide
    educational guidance to help you adjust your saving strategy accordingly.


    Withdrawal Charges: Members are reminded that the Fernbridge Cash Lifetime ISA
    is designed for first-time buyers (for properties up to £450,000) or retirement.
    Any unauthorised withdrawal—one that does not meet the government''s strict criteria—will
    incur a withdrawal charge of 25%. This charge is applied to the amount withdrawn
    to account for the reclamation of the government bonus and administrative costs.


    Closing the Account: You may close your account at any time. However, if the closure
    is not for a qualifying reason (such as purchasing a first home or reaching retirement
    age), the 25% withdrawal charge will apply to the total balance.


    Amendments to Terms: We may amend these terms to ensure compliance with the PRA
    and FCA regulations. We will provide you with written notice of any material changes
    to our service model or fee structure. Continued use of the account following
    the notice period constitutes acceptance of the revised terms.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: terms_conditions
  source_authority: official
