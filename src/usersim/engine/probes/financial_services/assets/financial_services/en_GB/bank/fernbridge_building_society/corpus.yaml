- id: 7fa4ecde-b76d-563a-a086-4c6455314b46
  title: Fernbridge Easy Access Saver — check status or history
  body: 'Follow these steps to review your Fernbridge Easy Access Saver balance, interest
    earned, or transaction history.


    Before you begin:

    Ensure you have your membership details ready and are prepared to complete a multi-factor
    authentication (MFA) check to verify your identity.


    Step-by-Step Process:


    1. Request an account summary: Tell us you would like to check the current status
    of your Fernbridge Easy Access Saver. We will then initiate the identity verification
    process.


    2. Complete verification: Follow the prompts to provide your MFA code. This ensures
    that your financial information is only disclosed to you.


    3. Specify the information required: Indicate whether you need your current balance,
    the total interest accrued at the 3.6% rate, or a history of your recent deposits
    and withdrawals.


    4. Receive the details: We will provide the requested information directly within
    your secure digital message or confirm it over the telephone.


    5. Request formal documentation: If you require a full record for your archives,
    ask us to generate a statement. We will confirm the period the statement should
    cover and send it to your registered address or via secure digital messaging.


    How you know it worked:

    You will have a confirmed balance and a clear view of your transaction history,
    allowing you to track how your savings are growing.


    For information on how to make changes to your account, see Fernbridge Easy Access
    Saver — make a change or update.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: how_to_guide
  source_authority: official
