- id: 815671d5-5c7e-552b-9f5b-8109a9af963e
  title: Fernbridge One-Year Fixed Rate Bond — fraud and unauthorised-activity protection
  body: 'At Fernbridge Building Society, the security of your savings is our primary
    concern. Because the Fernbridge One-Year Fixed Rate Bond requires a commitment
    of funds for 12 months, it can occasionally be targeted by sophisticated fraud
    patterns. We want our members to be aware of these risks when comparing our offering
    against other market alternatives.


    A common fraud pattern involves ''rate-switching'' scams. Fraudsters may contact
    you claiming to be from Fernbridge, suggesting that we have an unadvertised, higher-interest
    version of our bond and requesting that you move your funds to a ''temporary holding
    account'' to secure this rate. Please be aware that we will never ask you to move
    your money to an external account to access a better rate, nor will we ever ask
    for your full security credentials via telephone or digital messaging.


    We employ rigorous identity verification and multi-factor authentication for all
    fund movements. Any request to change your Nominated Bank Account—the external
    current account where we send your funds—will trigger a strict verification process
    to ensure the request is authorised by the account holder.


    If you notice any unauthorised activity or receive a suspicious communication,
    you must notify us immediately. Prompt reporting is essential for the effective
    recovery of funds and the mitigation of liability. Once notified, our Member Relations
    team will treat the matter with urgency, aiming for a resolution that adheres
    to the Consumer Duty and ensures a fair outcome for our members.


    For your peace of mind, all deposits in the Fernbridge One-Year Fixed Rate Bond
    are protected by the Financial Services Compensation Scheme (FSCS). This protection
    covers up to £120,000 per person, with temporary high balances protected up to
    £1.4 million for six months from the date of deposit. This ensures that even in
    the unlikely event of institutional failure, your disciplined savings remain secure
    up to these legal limits.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 1e882c13-9f21-56f6-a7f5-a6599b6a265f
  title: Fernbridge One-Year Fixed Rate Bond — account agreement
  body: "This account agreement outlines the binding terms between Fernbridge Building\
    \ Society (the Mutual) and the member regarding the Fernbridge One-Year Fixed\
    \ Rate Bond. \n\n1. Deposit and Term\nTo open this account, a minimum deposit\
    \ of £1,000 is required. By opening this account, the member agrees to keep the\
    \ deposited funds within the society for a full term of 12 months. The bond is\
    \ designed as a secure, higher-yield option for those who can commit their funds\
    \ for this duration.\n\n2. Interest Application\nInterest is applied at a rate\
    \ of 4.45%. This rate is fixed for the duration of the 12-month term and will\
    \ not fluctuate regardless of changes to the wider market or the society's standard\
    \ variable rates. Interest is calculated based on the balance and paid at the\
    \ end of the term, unless otherwise agreed during the account setup.\n\n3. Withdrawals\
    \ and Early Closure\nAs a fixed-rate product, this bond does not permit routine\
    \ withdrawals. Any request to close the account or withdraw funds before the 12-month\
    \ term has expired is considered an early exit. Such actions may result in a loss\
    \ of interest or a penalty charge, as defined in the society's fee structure,\
    \ to cover the operational costs of breaking the fixed term.\n\n4. Fund Disbursement\n\
    Upon maturity of the bond, or upon authorised closure, all funds and accrued interest\
    \ will be transferred to the member's Nominated Bank Account. This must be a valid\
    \ external current account, as Fernbridge Building Society does not issue its\
    \ own current accounts or debit cards.\n\n5. Changes to Terms\nWe operate with\
    \ transparency and will provide members with clear notice of any changes to these\
    \ terms. However, the interest rate of 4.45% and the term of 12 months are guaranteed\
    \ for the life of the specific bond agreement once the initial deposit of £1,000\
    \ is accepted.\n\n6. Governing Law\nThis agreement is governed by the laws of\
    \ England and Wales. We operate under the authority of the PRA and regulation\
    \ by the FCA."
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: ee46942e-814e-56ea-9197-325afc93054c
  title: Fernbridge One-Year Fixed Rate Bond — who it is best for and common use cases
  body: 'The Fernbridge One-Year Fixed Rate Bond is specifically engineered for members
    who have a lump sum of savings and are seeking a guaranteed return without the
    volatility of variable-rate accounts. Unlike our more flexible options, this product
    prioritises yield over accessibility.


    Who is this product best for?

    This bond is ideal for disciplined savers who are certain they will not require
    access to their capital for a full year. It is particularly suited for those who
    have already established an emergency fund in a more liquid account and are now
    looking to maximise the growth of their surplus cash.


    Common Use Cases:

    - Goal-Based Saving: Members saving for a specific purchase exactly one year away,
    such as a home improvement project or a significant anniversary.

    - Low-Risk Diversification: Those who wish to secure a guaranteed 4.45% return
    on a portion of their wealth while keeping other funds in more accessible vehicles.

    - First-Time Buyer Planning: Prospective buyers who have reached their minimum
    deposit of £1,000 and wish to lock in a competitive rate while they finalise their
    property search.


    Key Product Specifications:

    - Minimum Deposit: £1,000

    - Fixed Interest Rate: 4.45%

    - Term: 12 months


    Trade-offs to Consider:

    While the 4.45% rate is higher than what is typically offered on flexible accounts,
    the trade-off is the lack of immediate liquidity. If you anticipate needing your
    money sooner, you may find a more suitable option in the Fernbridge Easy Access
    Saver — overview, which offers greater flexibility for everyday saving needs.
    However, for those who can commit to the 12-month duration, the Fixed Rate Bond
    provides the certainty of a locked-in return and the security of a member-owned
    mutual.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 49e2c727-b0a6-5d20-b1c9-1af65d01ed56
  title: Fernbridge One-Year Fixed Rate Bond — minimum deposit explained
  body: 'Q: What is the minimum deposit required to open a Fernbridge One-Year Fixed
    Rate Bond?


    A: To open this account, you must make an initial deposit of at least £1,000.
    This minimum threshold ensures that the account can effectively generate a meaningful
    return at the fixed rate of 4.45% over the 12-month term.


    Q: Can I add more money to my bond after the initial deposit?


    A: No. The Fernbridge One-Year Fixed Rate Bond is a single-deposit product. The
    4.45% interest rate applies to the initial amount deposited (which must be at
    least £1,000). If you wish to save more regularly, we recommend looking at the
    Fernbridge Members'' Regular Saver — overview.


    Q: What happens if my balance falls below £1,000?


    A: Because this is a fixed-term bond, you cannot make partial withdrawals. Your
    balance will remain at or above £1,000 for the full 12 months unless the account
    is closed entirely, which may incur early exit penalties.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c509d7e0-a83f-5406-ab32-06504dd601b9
  title: Fernbridge One-Year Fixed Rate Bond — cancel, close, or downgrade
  body: 'Depending on whether your bond has reached its natural maturity or if you
    require your funds early, the process for closing your account differs. Please
    follow the steps below.


    Option 1: Closing at Maturity (End of 12 Months)

    When your bond reaches the end of its 12-month term, your funds and the accrued
    interest (calculated at 4.45%) are ready for disbursement.

    1. Tell us your preference for the maturity date: you can either request the full
    balance to be sent to your Nominated Bank Account or ask us to move the funds
    into a different Fernbridge savings product.

    2. We will confirm the final balance, including all interest earned.

    3. We will transfer the total amount to your Nominated Bank Account. You will
    know this is complete when the funds appear in your external current account.


    Option 2: Early Closure (Before 12 Months)

    If you must access your funds before the 12-month term expires, you can request
    an early closure. Please be aware that this may result in a loss of interest or
    a penalty charge to cover operational costs.

    1. Tell us that you wish to close your bond early and provide the reason for the
    request.

    2. We will perform a rigorous identity verification check to ensure the request
    is authorised.

    3. We will calculate the early exit penalty and provide you with the final amount
    that will be returned to you.

    4. Upon your confirmation of the penalty amount, we will close the account and
    transfer the remaining balance to your Nominated Bank Account.


    Option 3: Downgrading to a Flexible Account

    If you no longer wish to have your funds locked but do not want to leave the society,
    you can request to move your balance to a flexible account.

    1. Tell us you wish to transfer your bond balance into a flexible saver.

    2. As this is a closure of the fixed term, the early exit penalties described
    in Option 2 will apply.

    3. We will transfer the remaining balance directly into your new account, such
    as the Fernbridge Easy Access Saver — overview.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 5a1709ae-24f4-52c9-b398-f0eb9ace6b0f
  title: Fernbridge One-Year Fixed Rate Bond — an unexpected charge or amount
  body: 'As a support agent, use this guide to assist members who report that their
    Fernbridge One-Year Fixed Rate Bond balance or interest payment does not match
    their expectations.


    Symptom: Member reports an ''unexpected charge'' or a lower-than-expected final
    balance.


    Likely Causes:

    1. Early Exit Penalty: The member may have requested a closure of the account
    before the 12-month term ended. This triggers a penalty to cover operational costs
    and a potential reduction in the 4.45% interest earned.

    2. Incorrect Interest Calculation: The member may be calculating interest daily
    rather than annually (AER).

    3. Tax Withholding: While we provide the gross interest, the member may be confused
    about their own tax obligations on the earnings.


    What to check in order:

    1. Verify the Account Maturity Date: Check if the account has completed the full
    12 months. If it was closed early, locate the specific penalty applied.

    2. Review the Initial Deposit: Confirm that the original deposit was at least
    £1,000 and that no unauthorised attempts to withdraw funds were made.

    3. Calculate the Expected Interest: Apply the 4.45% rate to the principal for
    the exact duration the funds were held. Compare this to the amount credited.


    Resolution:

    - If the charge is a legitimate early exit penalty, explain the term of the bond
    and the associated costs clearly to the member.

    - If a calculation error is found, we will correct the balance immediately and
    provide a revised statement.

    - If the member disputes the penalty despite the terms, escalate the matter to
    the Member Relations team. We will treat the complaint with urgency and aim for
    a final response within eight weeks, informing the member of their right to escalate
    to the Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
