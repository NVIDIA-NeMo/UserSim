- id: 1e788259-95eb-592e-b28d-50e327ea239f
  title: Fernbridge Members' Regular Saver — referral and loyalty offer
  body: "At Fernbridge Building Society, we believe in rewarding the disciplined savers\
    \ who help our community grow. We are pleased to announce a loyalty-focused window\
    \ for our members to maximise their growth. From 1 November 2024 to 31 December\
    \ 2024, new accounts opened under our referral scheme will benefit from our most\
    \ competitive reward structure.\n\nThe Fernbridge Members' Regular Saver is designed\
    \ to help you build a substantial nest egg through consistent monthly contributions.\
    \ By committing to a saving habit, you can earn an interest rate of 6.5% on your\
    \ balance. To keep this product accessible and fair, we set a maximum monthly\
    \ deposit of £250. \n\nThis account runs for a fixed term of 12 months, making\
    \ it the ideal choice for those who want a guaranteed high return on their monthly\
    \ discipline. Whether you are saving for a first home or a rainy day, we are here\
    \ to support your financial wellbeing. For more details on how this compares to\
    \ our other options, you may wish to view Fernbridge Members' Regular Saver —\
    \ overview."
