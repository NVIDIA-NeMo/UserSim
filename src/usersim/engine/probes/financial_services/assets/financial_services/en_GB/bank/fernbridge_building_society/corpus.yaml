- id: e6803a52-30d0-53bf-944e-5d5937b7e528
  title: Fernbridge Easy Access ISA — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the transfer of an existing
    Cash ISA from another financial institution into the Fernbridge Easy Access ISA.
    To ensure your savings remain tax-free, it is essential to use the official transfer
    process rather than withdrawing the money yourself.


    What you need before starting:

    - The name of your current ISA provider.

    - Your current ISA account number.

    - Your membership details for Fernbridge Building Society.


    Steps to complete the transfer:


    1. Request the transfer: Tell us that you wish to transfer an existing Cash ISA
    into a Fernbridge Easy Access ISA. Provide us with the name of your current provider
    and your account number.

    2. Verification: We will perform a mandatory identity check using multi-factor
    authentication to ensure the security of your funds.

    3. Transfer initiation: We will contact your previous provider on your behalf
    to request the movement of your funds. This ensures the money moves directly between
    providers, preserving the tax-exempt status of the funds.

    4. Confirm the arrival: Once the funds arrive, we will notify you via secure messaging.
    We will confirm the final amount received and verify that it has been deposited
    into your account, earning the current interest rate of 3.85%.


    How you know it worked:

    - You will receive a confirmation message stating the transfer is complete. You
    will see the transferred balance reflected in your account history. Because this
    is a formal transfer, these funds will not count towards your current £20,000
    annual ISA allowance.


    If you have any questions about the transfer timeline or the annual allowance,
    you can review Fernbridge Easy Access ISA — limits, restrictions, and edge cases.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
