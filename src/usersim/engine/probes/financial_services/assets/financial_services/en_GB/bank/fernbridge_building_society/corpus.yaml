- id: 51647845-e40b-593e-a78f-9b20a9de939b
  title: Fernbridge Members' Regular Saver — a discrepancy in your records or statement
  body: 'When managing a disciplined saving plan, it is important that your records
    align perfectly with ours. If you notice a discrepancy in your Fernbridge Members''
    Regular Saver balance or interest, follow these steps to resolve it.


    Symptom

    Your personal records show a different balance than your statement, or the interest
    earned at the 6.5% rate appears lower than expected.


    Likely Causes

    • Timing of Deposits: Interest is calculated based on the funds held in the account.
    If a deposit from your Nominated Bank Account was delayed, the interest for that
    period will be proportionally lower.

    • Exceeding the Monthly Limit: If you attempted to deposit more than £250, the
    excess may have been returned to your bank account, leading to a lower balance
    than you anticipated.

    \u202• Term Calculation: Because the product has a 12 month term, interest may
    be credited in a way that reflects the daily balance rather than a flat monthly
    sum.


    What to Check

    1. Review your Nominated Bank Account statements to confirm the exact date and
    amount of every transfer made to the Regular Saver.

    2. Verify that no single month''s deposits exceeded the £250 limit.

    3. Check the date the account was opened to ensure the 12 month term has been
    calculated correctly.


    How to Fix

    If you find a missing deposit that was successfully sent from your bank, let us
    know. We will perform a trace on the funds to ensure they are correctly allocated
    to your account.


    When to Escalate

    If the discrepancy remains unresolved after reviewing your transactions, we will
    escalate the matter to our Member Relations team. For issues involving payment
    services and fund discrepancies, we aim to provide a final response within 15
    business days. For other administrative discrepancies, the resolution period may
    be up to eight weeks. You will be kept informed throughout the process and reminded
    of your right to escalate the matter to the Financial Ombudsman Service if you
    remain dissatisfied.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: a68db4b8-528d-5382-9aa9-3d8ea99172d5
  title: Fernbridge One-Year Fixed Rate Bond — overview
  body: "The Fernbridge One-Year Fixed Rate Bond is a secure, higher-yield savings\
    \ option designed for members who can commit their funds for a full year to achieve\
    \ a guaranteed return. As a member-owned mutual, we prioritise your financial\
    \ wellbeing, offering this bond as a disciplined way to grow your capital without\
    \ the volatility of variable rates.\n\nThis product provides a guaranteed annual\
    \ interest rate of 4.45%, providing certainty over the duration of the term. To\
    \ open this account, we require a minimum deposit of £1,000. Once the funds are\
    \ deposited, they are held for a fixed term of 12 months. \n\nBecause this is\
    \ a fixed-term commitment, this bond is best suited for those who have a specific\
    \ savings goal in the medium term and do not require immediate access to their\
    \ funds. By locking in your deposit, you benefit from a rate that remains unchanged\
    \ regardless of wider market fluctuations throughout the 12 months.\n\nIn line\
    \ with our commitment to fairness and accessibility, there are no product fees\
    \ to open this account. Your deposits are protected by the FSCS up to £120,000\
    \ per person, with temporary high balances protected up to £1.4 million for six\
    \ months, ensuring your hard-earned savings remain safe with us."
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: f6e8589c-46e9-566d-9fc1-feac42ad8d28
  title: Fernbridge One-Year Fixed Rate Bond — interest rate (AER) explained
  body: 'Q: What does the 4.45% interest rate on my bond actually mean?


    A: The 4.45% figure is the Annual Equivalent Rate (AER). This is a standardised
    way of showing what the interest rate would be if the interest were paid and compounded
    each year. It allows you to compare our bond fairly against other savings products
    in the market.


    Q: Will my interest rate change during the 12-month term?


    A: No. One of the primary benefits of the Fernbridge One-Year Fixed Rate Bond
    is that the rate is fixed. Your 4.45% AER is guaranteed for the entire 12 months,
    providing you with a predictable return on your investment.


    Q: Where can I see the full details of how this rate is applied?


    A: For a comprehensive breakdown, please refer to the Fernbridge One-Year Fixed
    Rate Bond — interest rate / AER schedule.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
