- id: a5f7b38c-75ce-59f1-873d-47da6ffb72bc
  title: Fernbridge Cash Lifetime ISA — choosing between tiers or options
  body: 'When deciding how to save, members often choose between the Fernbridge Cash
    Lifetime ISA and our Fernbridge Easy Access ISA. The right choice depends on your
    specific financial goals.


    Fernbridge Cash Lifetime ISA:

    - Reward: 25% government bonus on contributions.

    - Interest: 3.75%.

    - Limit: Annual contribution limit of £4,000.

    - Constraint: High penalty (25% withdrawal charge) for non-qualifying withdrawals.

    - Best for: First-time buyers looking for a home up to £450,000, or those saving
    specifically for retirement.


    Fernbridge Easy Access ISA:

    - Reward: No government bonus.

    - Constraint: Much greater flexibility; funds can be withdrawn without the 25%
    penalty associated with the LISA.

    - Best for: Those who may need their savings for unforeseen expenses or who do
    not meet the age requirement of 39 or under.


    If you are disciplined and certain that your funds are for a first home or retirement,
    the Lifetime ISA''s 25% bonus provides a significant advantage. If you require
    liquidity, the Easy Access ISA is the more appropriate choice.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: comparison
  source_authority: official
