- id: 60bcce7f-5361-56d7-afb8-6d6f2a3622f5
  title: Fernbridge Members' Regular Saver — fraud and unauthorised-activity protection
  body: 'At Fernbridge Building Society, the security of your savings is our primary
    concern. Because the Fernbridge Members'' Regular Saver is designed for consistent
    growth, it can occasionally be targeted by fraudsters using ''high-yield'' lures
    to deceive members.


    One common fraud pattern involves scammers contacting members via phone or email,
    claiming that their 6.5% interest rate has been ''upgraded'' or that they are
    eligible for a special bonus if they transfer funds to a ''temporary security
    account''. Please be aware that we will never ask you to move your funds to a
    different account to ''protect'' them or to verify your identity. We will never
    ask for your full password or your multi-factor authentication (MFA) codes over
    the phone.


    To protect your account, we employ rigorous identity verification and multi-factor
    authentication for all state-changing actions. This ensures that any changes to
    your personal details or fund movements are authorised only by you. If you receive
    a request that seems unusual, even if it appears to come from a Fernbridge email
    address, do not click any links or provide personal information.


    If you suspect that your account has been compromised or you have encountered
    suspicious activity, the first action you must take is to notify us immediately
    via our secure digital messaging service or telephone. Reporting unauthorised
    activity promptly is critical to limiting your liability and allowing us to secure
    your funds. We treat all reports of fraud with urgency and fairness, adhering
    to the Consumer Duty to ensure a fair outcome for our members.


    For those comparing our security measures against other providers, it is important
    to note that your deposits are protected by the FSCS up to £120,000 per person,
    providing a foundational layer of security alongside our active fraud prevention
    protocols. For a broader overview of our security approach, you may also wish
    to review the Fernbridge Members'' Regular Saver — account security best practices.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 6acbd793-b122-523e-8014-c46447e92841
  title: Fernbridge Members' Regular Saver — account agreement
  body: 'This account agreement outlines the binding terms between Fernbridge Building
    Society (the Mutual) and the member. By opening a Fernbridge Members'' Regular
    Saver, you agree to the following obligations:


    1. Deposit Limits and Frequency: You are permitted to make monthly deposits into
    the account. However, these deposits are strictly capped at a maximum monthly
    deposit of £250. Any attempt to deposit funds exceeding this limit in a single
    calendar month may result in the excess funds being rejected and returned to your
    Nominated Bank Account.


    2. Account Term: This account is opened for a fixed term of 12 months. The 6.5%
    interest rate is applicable for the duration of this term, provided the account
    remains open and active. Early closure of the account may be subject to the conditions
    outlined in our general terms, and you may lose a portion of the accrued interest.


    3. Mutual Nature: As a member-owned mutual, your account is held within an institution
    that prioritises member wellbeing over shareholder profit. You hold voting rights
    at the Annual General Meeting (AGM) as part of your membership.


    4. Fund Movements: All funds leaving the account must be directed to your verified
    Nominated Bank Account. Rigorous identity verification and multi-factor authentication
    are mandatory before any fund movements are authorised to ensure the security
    of your savings.


    5. Termination: This agreement ends automatically at the conclusion of the 12
    month term, at which point the balance and accrued interest will be transferred
    to your Nominated Bank Account, unless you choose to transition the funds into
    another Fernbridge product.


    6. Changes to Terms: We reserve the right to amend these terms to reflect regulatory
    changes from the PRA or FCA. We will provide clear, transparent notice of any
    such changes to ensure fair outcomes for all members.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: cdf0c2b7-e5fc-53cb-8cab-ef725b75419d
  title: Fernbridge Members' Regular Saver — who it is best for and common use cases
  body: 'The Fernbridge Members'' Regular Saver is a high-interest incentive account
    specifically designed to reward members who demonstrate disciplined saving habits.
    Unlike a lump-sum bond, this account focuses on the habit of monthly contribution,
    making it an ideal tool for those building a financial safety net or saving for
    a specific future goal.


    This product is best suited for:

    - First-Time Buyers: For those saving towards a deposit for a first home, this
    account provides a powerful way to grow funds quickly. When paired with the Fernbridge
    Cash Lifetime ISA, it can form a comprehensive strategy for entering the property
    market.

    - Disciplined Savers: Members who can commit to a monthly saving routine and do
    not require immediate access to these funds for the duration of the term.

    - Community-Minded Individuals: Those who prefer banking with a member-owned mutual
    that reinvests in its community rather than paying external shareholders.


    Common Use Cases:

    - The ''House Deposit'' Fund: Setting up a monthly standing order of £250 from
    a Nominated Bank Account to maximise the 6.5% interest rate over the 12 month
    term.

    - The ''Annual Goal'' Saver: Saving for a large yearly expense (such as a holiday
    or home improvement) by consistently contributing throughout the year.


    Key Product Specifications:

    - Interest Rate: 6.5%

    - Maximum Monthly Deposit: £250

    - Term: 12 months


    Because we operate with a transparent fee philosophy, there are no monthly maintenance
    fees on this account. Our goal is to lower the barriers to saving, ensuring that
    every penny of your £250 monthly contribution works hard for you. For more details
    on how this compares to our other options, see the Fernbridge Members'' Regular
    Saver — overview.'
