- id: 12c6df9b-4510-5be9-bd40-d425e6e9b3cd
  title: Fernbridge Members' Regular Saver — regulatory disclosures
  body: "Fernbridge Building Society operates under the authority of the Prudential\
    \ Regulation Authority (PRA) and is regulated by the Financial Conduct Authority\
    \ (FCA). We strictly adhere to the Consumer Duty to ensure that all members receive\
    \ fair outcomes and transparent communication regarding our products.\n\nMember\
    \ deposits held within the Fernbridge Members' Regular Saver are protected by\
    \ the Financial Services Compensation Scheme (FSCS). This protection applies up\
    \ to £120,000 per person. In the event of a temporary high balance—such as the\
    \ transfer of funds from another institution—protection is extended up to £1.4\
    \ million for a period of six months.\n\nAll movements of funds from your Nominated\
    \ Bank Account to this saver, and the eventual return of funds, are subject to\
    \ rigorous identity verification and multi-factor authentication to prevent fraud\
    \ and unauthorised access. \n\nWe treat all complaints with urgency and fairness.\
    \ For disputes relating to payment services, we aim to provide a final response\
    \ within 15 business days. For all other matters, our response time is within\
    \ eight weeks. If a dispute remains unresolved after this period, members have\
    \ the right to escalate the matter to the Financial Ombudsman Service free of\
    \ charge.\n\nPlease note that while we provide educational information and guidance\
    \ to help you make informed choices about the Fernbridge Members' Regular Saver,\
    \ we do not provide individualised tax, legal, or financial planning advice. We\
    \ recommend consulting a qualified professional for such requirements."
  domain: retail_banking
  product_category: members_regular_saver
  document_type: disclosure
  source_authority: official
