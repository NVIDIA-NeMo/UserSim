- id: c8d7bef3-5680-5c3f-9497-f03ab6fd7ef2
  title: Fernbridge Members' Regular Saver — vs. a typical competitor offering
  body: 'When comparing the Fernbridge Members'' Regular Saver to typical high-street
    competitor regular savers, there are several key trade-offs to consider.


    Fernbridge Members'' Regular Saver:

    - Interest Rate: 6.5%

    - Monthly Limit: £250

    - Term: 12 months

    - Structure: Member-owned mutual, prioritising wellbeing over profit.


    Typical Competitor Offering:

    - Interest Rate: Often ranges between 4.0% and 5.0%.

    - Monthly Limit: May offer higher monthly limits (e.g., £500), allowing for faster
    capital accumulation.

    - Term: Usually 12 months.

    - Structure: Shareholder-owned, with profit motives that may influence fee structures.


    Which should you choose?

    Choose the Fernbridge Members'' Regular Saver if your priority is the highest
    possible yield on your monthly savings and you are comfortable with a £250 monthly
    cap. It is the superior choice for disciplined savers who value a community-centric,
    mutual approach to banking.


    Choose a competitor offering if you need to save significantly more than £250
    per month and cannot place the excess funds in another high-yield account. For
    members who have already reached their £250 monthly limit here, we suggest looking
    at the Fernbridge Easy Access Saver — overview for additional flexible saving
    options.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 58c41cba-c332-5996-ac9a-ff7dde80846e
  title: Fernbridge Members' Regular Saver — risk disclosures
  body: 'This document provides essential regulatory and risk information regarding
    the Fernbridge Members'' Regular Saver. Please read these disclosures carefully
    when comparing this product against other financial alternatives.


    Liquidity and Access Risk:

    The Fernbridge Members'' Regular Saver is designed as a commitment-based account
    with a term of 12 months. While the 6.5% interest rate is highly competitive,
    it is intended for funds that do not need to be accessed immediately. Withdrawing
    funds before the end of the 12 month term may result in the loss of a portion
    of the interest earned. This product is not suitable for those requiring an emergency
    fund; for such needs, we recommend the Fernbridge Easy Access Saver.


    Deposit Protection:

    Member deposits at Fernbridge Building Society are protected by the Financial
    Services Compensation Scheme (FSCS). This means your funds are protected up to
    £120,000 per person. For those with temporary high balances (e.g., from a property
    sale), protection is available up to £1.4 million for a period of six months.


    Regulatory Oversight:

    We operate under the authority of the Prudential Regulation Authority (PRA) and
    are regulated by the Financial Conduct Authority (FCA). We strictly adhere to
    the Consumer Duty, which mandates that we act to deliver good outcomes for retail
    customers.


    Interest Rate Variable Nature:

    While the current rate is 6.5%, please be aware that interest rates can be subject
    to change in line with market conditions and regulatory requirements. We will
    provide transparent notice of any such changes to ensure members are not misled.


    For further information on our regulatory standing, please see the Regulatory
    notes for Current accounts and savings.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
