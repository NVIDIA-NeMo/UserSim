- id: 70214374-93e5-5806-b038-e39c6179ffc8
  title: Fernbridge First Home Five-Year Fixed Mortgage — account security best practices
  body: "Protecting your home and your financial wellbeing is our highest priority.\
    \ As a mortgage holder with the Fernbridge First Home Five-Year Fixed Mortgage,\
    \ you may be targeted by sophisticated fraud patterns designed to gain access\
    \ to your personal details or divert your funds. \n\nCommon fraud patterns targeting\
    \ mortgage members include 'rate-drop' scams, where fraudsters send emails or\
    \ texts claiming you are eligible for a lower rate than 6.39% if you click a link\
    \ to 'verify' your identity. Please remember: we will never ask you to provide\
    \ your full password, your multi-factor authentication (MFA) codes, or your full\
    \ security credentials via a link in an email or text message. \n\nTo keep your\
    \ account secure, we recommend the following best practices:\n1. Always use our\
    \ secure digital messaging system for sensitive enquiries; we will never request\
    \ state-changing information through standard email.\n2. Be cautious of unsolicited\
    \ calls claiming to be from our Member Relations team. We will always verify your\
    \ identity using rigorous, mandatory checks before disclosing account information.\n\
    3. Regularly review your mortgage statements for any unauthorised changes to your\
    \ Nominated Bank Account.\n\nIf you notice any suspicious activity—such as a request\
    \ for a payment to an unfamiliar account or a notification of a change you did\
    \ not authorise—you must inform us immediately. Any suspected fraud reported within\
    \ 24 hours of the occurrence allows us to act more swiftly to protect your funds.\
    \ We employ multi-factor authentication for all fund movements to ensure that\
    \ only you can authorise changes to your account.\n\nFor more information on general\
    \ protections, you may wish to review Fernbridge First Home Five-Year Fixed Mortgage\
    \ — regulatory disclosures."
