- id: 1e2f0da5-6a26-57d2-a1ec-99c66efbb4a7
  title: Fernbridge Easy Access ISA — a failed or pending action
  body: 'If you have attempted to move funds or change account details and the action
    is showing as ''pending'' or has failed, please follow these steps to resolve
    the issue.


    Common Symptom: You have requested a transfer from your ISA to your Nominated
    Bank Account, but the funds have not arrived, or you received a notification that
    the action was unsuccessful.


    Likely Causes:

    - Identity Verification: A state-changing action may be paused because further
    identity verification is required.

    - MFA Failure: The multi-factor authentication (MFA) process may not have been
    completed successfully.

    - Account Discrepancy: The details of the Nominated Bank Account may not match
    our records.


    Steps to Resolve:

    1. Check your secure messages: We will typically send a digital message if an
    action is pending due to a verification requirement. If you see a request for
    additional information, provide it immediately.

    2. Re-authenticate your identity: Ask us to trigger a new multi-factor authentication
    challenge. Once you successfully authorise this via your registered device, we
    can often push the pending action through.

    3. Verify Nominated Bank Account details: Confirm with us that the sort code and
    account number on file are correct. If they have changed, we will guide you through
    the secure process of updating your personal details.


    When to Escalate:

    If the action remains pending after you have completed identity verification and
    confirmed your bank details, we will escalate the matter to our Member Relations
    team. They will investigate the transaction and provide a final response. For
    payment-related disputes, we aim to provide a resolution within 15 business days.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
