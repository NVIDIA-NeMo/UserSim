- id: 9b0b2082-d5d0-525b-9f93-420067043aca
  title: Fernbridge Easy Access ISA — interest rate (AER) explained
  body: 'What is the interest rate for the Fernbridge Easy Access ISA?

    The current interest rate for this account is 3.85%. This is quoted as an Annual
    Equivalent Rate (AER).


    What does AER actually mean?

    Annual Equivalent Rate (AER) is a standardised way of showing what the interest
    rate would be if the interest was paid and compounded each year. This allows you
    to compare our rate of 3.85% fairly against other savings products in the market,
    regardless of how often interest is actually credited to your account.


    Is this rate guaranteed?

    No, the rate on the Fernbridge Easy Access ISA is variable. This means we may
    adjust the 3.85% rate upwards or downwards in response to changes in the wider
    economic environment or base rate shifts. We will always aim to keep you informed
    of any significant changes to your earnings.


    For more detailed information on how our rates are applied, please refer to Fernbridge
    Easy Access ISA — interest rate / AER schedule.'
