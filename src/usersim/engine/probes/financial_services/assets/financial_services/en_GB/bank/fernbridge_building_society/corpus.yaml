- id: 78e3224c-8855-5e79-bb24-25a932a9165e
  title: Fernbridge First Home Five-Year Fixed Mortgage — change-of-terms policy
  body: "This document outlines the policy regarding changes to the terms and conditions\
    \ of the Fernbridge First Home Five-Year Fixed Mortgage. As a mutual society,\
    \ we strive for transparency and fairness in all our member agreements.\n\nFixed\
    \ Rate Period\nYour mortgage is subject to a fixed interest rate of 6.39% for\
    \ a period of five years from the date of completion. During this period, the\
    \ interest rate will not change, regardless of fluctuations in the wider market.\
    \ \n\nTransition to Standard Variable Rate\nUpon the expiry of the five-year fixed\
    \ term, your mortgage will automatically transition to our standard variable rate,\
    \ which is currently 7.24%. This rate is variable and may increase or decrease\
    \ based on operational costs and market conditions. We will provide you with written\
    \ notice at least 60 days before your fixed term expires to discuss your options\
    \ for refinancing or switching to a new product.\n\nAmendments to Terms\nWe reserve\
    \ the right to amend the general terms and conditions of your mortgage agreement.\
    \ Such changes may include updates to our administrative processes or regulatory\
    \ requirements. We will notify you of any material changes via secure digital\
    \ messaging or post at least 30 days before the change takes effect. \n\nEarly\
    \ Repayment and Overpayments\nIf you wish to exit the mortgage or switch products\
    \ during the first year of your term, an early repayment charge of 5% will apply\
    \ to the outstanding balance. However, to support your financial progress, we\
    \ provide an overpayment allowance of 10% of the outstanding balance per year,\
    \ which can be paid without penalty.\n\nTermination\nThis agreement ends when\
    \ the mortgage is paid in full, the property is sold and the balance settled,\
    \ or upon the exercise of a legal right of redemption. All final settlements must\
    \ be conducted through your Nominated Bank Account."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
