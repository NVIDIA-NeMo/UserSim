- id: 81134f05-0dc6-5d06-8535-1ea97b7f0d0d
  title: Fernbridge One-Year Fixed Rate Bond — qualification tiers
  body: 'This matrix provides support agents with the requirements for a member to
    qualify for the Fernbridge One-Year Fixed Rate Bond. There are no tiered rates
    for this product; a single rate applies to all eligible deposits.


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Minimum Deposit | Balance ≥ £1,000 | Eligible to open account |

    | Minimum Deposit | Balance $<$ £1,000 | Ineligible (Suggest Easy Access Saver)
    |

    | Commitment Period | Able to lock funds for 12 months | Eligible |

    | Commitment Period | Requires immediate access | Ineligible (Suggest Easy Access
    Saver) |

    | Identity Status | Full KYC/Identity verification completed | Eligible |

    | Identity Status | Verification pending or failed | Ineligible until verified
    |


    **Key Product Figures for Agents:**

    - All eligible accounts receive an interest rate of 4.45%.

    - The term is strictly 12 months.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: eligibility_matrix
