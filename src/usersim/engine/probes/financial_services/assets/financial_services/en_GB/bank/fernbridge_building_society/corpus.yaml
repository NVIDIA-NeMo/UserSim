- id: a2e785e4-3209-5faa-9c7f-923dd4fcb1ea
  title: Fernbridge First Home Five-Year Fixed Mortgage — privacy and data handling
  body: 'Fernbridge Building Society operates under the authority of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We strictly adhere to the Consumer Duty to ensure that all members receive
    fair outcomes and transparent communication.


    Data Handling and Privacy

    In managing your Fernbridge First Home Five-Year Fixed Mortgage, we collect and
    process personal and financial data. This includes your income details, employment
    history, and property valuation data. This information is used exclusively to
    perform affordability assessments, maintain your account, and meet our regulatory
    reporting obligations. We employ rigorous security measures, including multi-factor
    authentication, to ensure your data is protected from unauthorised access.


    Your Right to Information

    Members have the right to request a copy of the data we hold about them. Such
    requests are handled by our first-line agents and, if complex, escalated to the
    Member Relations team. We commit to providing clear, plain-English explanations
    of how your data is used.


    Deposit Protection

    While this document concerns a lending product, we remind all members that their
    savings deposits with us are protected by the Financial Services Compensation
    Scheme (FSCS) up to £120,000 per person. For those with temporary high balances,
    protection is extended up to £1.4 million for a period of six months.


    Dispute Resolution

    We treat all complaints with urgency. For payment-related services, we aim to
    provide a final response within 15 business days; for other matters, the limit
    is eight weeks. If a dispute remains unresolved, you have the right to escalate
    the matter to the Financial Ombudsman Service free of charge.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: disclosure
  source_authority: official
