- id: fb7d9789-d2ca-5c78-a7e8-f80c323a70ad
  title: Fernbridge One-Year Fixed Rate Bond — access or login problems
  body: 'If you are experiencing difficulties accessing your account details or cannot
    log in to our secure messaging service to view your Fernbridge One-Year Fixed
    Rate Bond, please follow this guide.


    **Common Symptoms**

    - You receive an ''Incorrect Credentials'' error despite using your usual password.

    - You are not receiving the multi-factor authentication (MFA) code on your registered
    device.

    - The secure messaging portal fails to load your bond balance or interest accrual.


    **What to check and how to fix it**


    1. Verify Your Credentials: Ensure that your CAPS lock is off and that you are
    entering your membership number and password exactly as they were created. If
    you have forgotten your password, ask us to trigger a secure reset process.


    2. Check MFA Delivery: If the MFA code has not arrived, ensure your mobile device
    has a stable network connection. Wait 60 seconds before asking us to resend the
    code.


    3. Update Contact Details: If you have recently changed your phone number or email
    address, your MFA will fail. In this case, we will require you to undergo a full
    identity verification process over the telephone before we can update your records.


    4. Browser and Connection: If the portal is not loading, try clearing your browser
    cache or using a different secure browser to ensure it is not a local technical
    glitch.


    **When to escalate**

    If these steps do not resolve the issue, we will escalate your request to our
    Member Relations team. We will investigate whether there is a technical fault
    with your account profile or a security block that has been applied to protect
    your funds. You can expect an update on the status of your access within two business
    days.


    Our priority is to ensure you can monitor your 4.45% yield and your 12-month term
    securely. If you are comparing our digital accessibility to other institutions,
    please note that our rigorous verification is a deliberate choice to ensure the
    absolute security of your deposits.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: troubleshooting
  source_authority: official
