- id: e1f5fb05-75e1-58b5-aa35-bf66bf82c647
  title: Fernbridge Members' Regular Saver — fee schedule
  body: 'In accordance with our commitment to member-owned banking and our transparent
    pricing structure, the Fernbridge Members'' Regular Saver is designed to be a
    low-cost way to save. We only apply fees to cover direct operational costs.


    - Monthly Maintenance Fee: £0

    - Account Opening Fee: £0

    - Account Closure Fee: £0

    - Monthly Deposit Fee: £0


    There are no charges for maintaining this account or for making deposits up to
    the maximum monthly deposit of £250. Our goal is to remove barriers for our members,
    ensuring that the interest earned at the rate of 6.5% is not eroded by unnecessary
    administrative costs.'
