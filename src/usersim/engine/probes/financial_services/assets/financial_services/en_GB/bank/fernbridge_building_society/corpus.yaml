- id: aa13544a-69de-55cb-9756-0aca6b036a16
  title: Fernbridge Easy Access Saver — vs. a similar product here
  body: 'When choosing a savings vehicle, it is important to weigh flexibility against
    yield. Here is how the Fernbridge Easy Access Saver compares to the Fernbridge
    Members'' Regular Saver.


    **Fernbridge Easy Access Saver**

    - **Interest Rate**: 3.6% AER.

    - **Access**: Funds can be withdrawn at any time without penalty.

    - **Commitment**: Low; only a minimum opening deposit of £1 is required.

    - **Best For**: Those who need an emergency fund or a place to store money that
    may be needed on short notice.


    **Fernbridge Members'' Regular Saver**

    - **Interest Rate**: Higher than the Easy Access rate to reward consistency.

    - **Access**: More restricted; designed for long-term accumulation.

    - **Commitment**: High; requires regular monthly deposits.

    - **Best For**: Disciplined savers who can commit to a monthly saving goal and
    do not need immediate access to the funds.


    If you value liquidity and the ability to move money freely, the Easy Access Saver
    is the superior choice. If you are saving for a specific future goal and can commit
    to monthly deposits, the Members'' Regular Saver will provide a better return
    on your investment.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 77c91403-be12-551f-8a3b-2524bcbbf687
  title: Fernbridge Easy Access Saver — regulatory disclosures
  body: 'Fernbridge Building Society is a member-owned mutual operating under the
    authority of the Prudential Regulation Authority (PRA) and regulated by the Financial
    Conduct Authority (FCA). We strictly adhere to the Consumer Duty, which mandates
    that we act to deliver good outcomes for retail customers, ensuring that our products
    provide fair value and are fit for purpose.


    **Deposit Protection**

    All member deposits held within the Fernbridge Easy Access Saver are protected
    by the Financial Services Compensation Scheme (FSCS). This protection applies
    up to £120,000 per person. In the event of a temporary high balance (such as from
    a property sale), protection is extended up to £1.4 million for a period of six
    months.


    **Interest and Taxation**

    The current interest rate is 3.6% AER. Please be aware that while we provide educational
    guidance on our products to help you make informed choices, we do not provide
    individualised tax, legal, or financial planning advice. Members are responsible
    for their own tax liabilities resulting from interest earned on their savings.


    **Security and Verification**

    To protect our members from fraud, rigorous identity verification is mandatory
    before any state-changing action, such as the closure of an account or the change
    of a Nominated Bank Account. We employ multi-factor authentication for all fund
    movements and personal detail changes to ensure that all actions are authorised
    by the account holder.


    **Dispute Resolution**

    We treat all complaints with urgency. We aim to provide a final response within
    15 business days for payment services and eight weeks for other matters. If a
    dispute remains unresolved, members have the right to escalate the matter to the
    Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: b3f3f1b6-3716-530d-b7b6-f9d841d6893b
  title: Fernbridge Easy Access Saver — interest rate / AER schedule
  body: "The Fernbridge Easy Access Saver operates on a flat interest rate structure,\
    \ meaning there are no tiered balances or complex thresholds to manage. \n\n**Current\
    \ Interest Rate**: 3.6% AER\n\nThis single rate of 3.6% applies to all balances\
    \ from the initial minimum opening deposit of £1 upwards. Interest is calculated\
    \ daily and credited to the account periodically, allowing your savings to benefit\
    \ from compounding.\n\nBecause this is a variable rate account, the 3.6% figure\
    \ is not guaranteed for a fixed term and may be adjusted by the Society to reflect\
    \ changes in the wider economic environment or the base rate set by the Bank of\
    \ England. Any changes to the rate will be communicated to members with clarity\
    \ and transparency. For a more detailed explanation of how we calculate this rate,\
    \ please see Fernbridge Easy Access Saver — interest rate (AER) explained."
