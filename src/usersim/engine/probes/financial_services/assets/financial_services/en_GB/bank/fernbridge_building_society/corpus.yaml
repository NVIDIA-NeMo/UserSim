- id: 2d017c5a-b9f0-5b25-98de-44b6ebef6d3c
  title: Fernbridge Members' Regular Saver — current offer
  body: 'We are pleased to announce a current offer for our members to boost their
    savings for the upcoming year. From 1 January 2025 to 31 December 2025, new and
    existing members can open a Fernbridge Members'' Regular Saver with a highly competitive
    interest rate of 6.5%.


    This offer is designed to help you build a disciplined saving habit over a 12
    months term. To qualify for this rate, you must set up a monthly deposit from
    your Nominated Bank Account, with a maximum monthly deposit of £250.


    Take advantage of this mutual benefit today to ensure your money works harder
    for you. This offer is available for a limited time and is subject to the standard
    identity verification and multi-factor authentication processes to keep your funds
    secure.'
  domain: retail_banking
  product_category: members_regular_saver
