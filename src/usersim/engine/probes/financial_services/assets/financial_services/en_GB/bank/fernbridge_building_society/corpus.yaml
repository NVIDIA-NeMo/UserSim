- id: 92b45d75-3458-5bab-bbca-693302dc0af0
  title: Fernbridge Cash Lifetime ISA — how rates are tiered and applied
  body: 'The Fernbridge Cash Lifetime ISA employs a simple, transparent interest structure
    to ensure all members benefit equally regardless of their balance.


    Interest Rate

    A flat interest rate of 3.75% applies to all balances within the account. There
    are no tiers; whether you have a modest balance or have reached the annual limit
    of £4,000, the rate remains 3.75%.


    Application and Crediting

    Interest is calculated daily and credited to the account periodically. This rate
    is presented as an Annual Equivalent Rate (AER), meaning it shows what the interest
    rate would be if interest was paid and compounded each year.


    Factors Affecting the Rate

    - Mutual Adjustments: As a member-owned mutual, we review our rates regularly
    to balance competitive returns for members with the operational sustainability
    of the society.

    - Regulatory Changes: Changes in the base rate set by the Bank of England may
    influence our future rate adjustments.


    All interest is paid gross, and because this is an ISA, it remains tax-free, respecting
    the annual ISA allowance.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: rate_sheet
