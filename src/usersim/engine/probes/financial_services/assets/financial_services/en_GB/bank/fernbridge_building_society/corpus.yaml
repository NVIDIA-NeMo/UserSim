- id: 5b9a3262-91e8-5321-88da-faec5d7d1b9b
  title: Fernbridge Members' Regular Saver — an unexpected charge or amount
  body: 'If a member reports that their account balance is lower than expected or
    they believe they have seen an unexpected charge, support agents should guide
    the member through the following checks.


    Symptom: The member believes a fee has been deducted or a deposit has not been
    credited correctly.


    Likely Causes:

    1. Deposit Limit Breach: The member may have attempted to deposit more than the
    £250 maximum monthly deposit. In this case, the excess was not charged but rather
    rejected and returned to the Nominated Bank Account.

    2. Interest Calculation Timing: Interest is calculated based on the 6.5% AER.
    If the member is looking at a mid-month statement, the full monthly interest may
    not yet have been applied.

    3. External Bank Charges: Since we do not issue current accounts, the member''s
    own bank may have charged a fee for the standing order or transfer to Fernbridge.


    Steps to Resolve:

    1. Review Transaction History: Check the recent activity to see if any deposits
    were declined for exceeding the £250 limit.

    2. Verify Nominated Bank Account: Ask the member to check their external account
    for any returned funds from Fernbridge.

    3. Confirm Interest Accrual: Explain that the 6.5% rate is applied to the balance
    over the 12 month term and verify the date of the last interest credit.


    When to Escalate:

    If the discrepancy cannot be explained by the deposit limit or interest timing,
    or if the member insists a fee was taken by Fernbridge (which contradicts our
    minimal-fee philosophy), escalate the matter to the Member Relations team. We
    aim to provide a final response for payment-related disputes within 15 business
    days. Members should be reminded of their right to escalate unresolved disputes
    to the Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 90733494-cfed-57c7-9658-f815621ce5c4
  title: Fernbridge Members' Regular Saver — required documentation
  body: 'To open a Fernbridge Members'' Regular Saver and begin earning a 6.5% interest
    rate, all prospective members must provide the following documentation to satisfy
    our regulatory and security requirements:


    | Requirement | Mandatory Documentation | Outcome if Provided |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Driving Licence | Identity Verified
    |

    | Proof of Address | Recent Utility Bill or Council Tax Statement (last 3 months)
    | Residency Confirmed |

    | Fund Source | Valid UK Current Account details (Nominated Bank Account) | Account
    Linked |

    | Mutual Membership | Signed Membership Agreement / Voting Rights Acknowledgement
    | Member Status Granted |


    Failure to provide any of the above will result in the application being placed
    on hold. We perform these checks to adhere to FCA regulations and ensure the security
    of all member deposits.'
  domain: retail_banking
  product_category: members_regular_saver
