- id: 39ee2a8a-0401-5646-a523-d3abfca9f270
  title: Fernbridge Easy Access Saver — getting started walkthrough
  body: 'This guide is for support agents assisting members in opening a Fernbridge
    Easy Access Saver. Our goal is to make the entry point into saving as accessible
    and transparent as possible.


    Step 1: Eligibility and Intent

    Confirm the member wishes to open a flexible savings account. Explain that the
    Fernbridge Easy Access Saver is designed for everyday growth and requires no long-term
    lock-in. Ensure the member understands that we are a mutual society and that their
    deposits are protected by the FSCS up to £120,000 per person.


    Step 2: Account Opening Requirements

    Inform the member that the minimum opening deposit is £1. This low barrier ensures
    that any member, regardless of their current financial position, can start saving
    immediately.


    Step 3: Identity Verification

    Perform rigorous identity verification. This is mandatory before the account can
    be created. Explain to the member that this is for their own security and to comply
    with FCA regulations. Once identity is confirmed, the member should set up their
    multi-factor authentication (MFA).


    Step 4: Establishing the Nominated Bank Account

    Since Fernbridge does not provide current accounts or debit cards, the member
    must provide the details of their external Nominated Bank Account. This is where
    all future withdrawals and the final balance will be sent. Verify that the name
    on the external account matches the name on the Fernbridge account.


    Step 5: Funding and Rate Confirmation

    Confirm that the initial deposit of £1 (or more) has been received. Explicitly
    state that the account will earn an interest rate of 3.6%. Remind the member that
    they can manage their account via telephone or secure digital messaging during
    UK business hours.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: product_sheet
  source_authority: official
