- id: 3360da56-0240-5867-a89b-4b6616f46683
  title: Fernbridge One-Year Fixed Rate Bond — a failed or pending action
  body: 'If you encounter an issue while trying to open your bond or if your initial
    deposit is not showing as pending, please follow these steps to identify the cause.


    **Symptom**: The account remains ''Pending'' or the deposit of £1,000 or more
    has not arrived.


    **Likely Causes**:

    - **Authentication Failure**: The multi-factor authentication process for the
    fund movement was not completed.

    - **Verification Delay**: Your identity verification is still being processed
    by our security team.

    - **Nominated Bank Account Mismatch**: The details of the external account provided
    do not match the source of the funds.


    **What to check**:

    1. Check your secure digital messages to see if we have requested additional identification
    documents.

    2. Verify that the funds were sent from the exact Nominated Bank Account linked
    to your application.

    3. Ensure you have completed the multi-factor authentication prompt sent to your
    registered device.


    **Resolution**:

    If the authentication failed, simply ask us to re-trigger the MFA prompt. If there
    is a mismatch in account details, provide the correct Nominated Bank Account information
    for verification.


    **Escalation**:

    If the issue persists after these checks, we will escalate the matter to the Member
    Relations team for a priority review. You can expect an update on the status of
    your account within 15 business days for payment-related discrepancies.'
  domain: retail_banking
