- id: 1a6744f9-5d5f-5ecb-999a-41a2bfde689b
  title: Fernbridge First Home Five-Year Fixed Mortgage — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Fernbridge
    First Home Five-Year Fixed Mortgage. Please read these carefully to ensure you
    understand the risks associated with this credit product.


    Interest Rate Risk

    Your loan is subject to a fixed interest rate of 6.39% for a period of five years.
    While this provides stability, it also means you cannot benefit from any potential
    decreases in market interest rates during this term. At the end of the fixed period,
    your loan will revert to the standard variable rate of 7.24%, which may significantly
    increase your monthly repayments.


    Early Repayment and Overpayment Risks

    This product allows an overpayment allowance of 10% per year. If you exceed this
    limit, or if you wish to repay the loan in full during the first year of the fixed
    term, an early repayment charge of 5% will be applied to the excess amount. This
    can result in a substantial cost if you plan to move or refinance early.


    Overall Cost (APRC)

    The Annual Percentage Rate of Charge (APRC) for this product is 7.1%. This figure
    represents the total cost of the loan over its full term, including the interest
    and any applicable fees, and should be used as a baseline for comparing the total
    cost against other mortgage products.


    Property Value Risk

    By borrowing up to the maximum LTV of 95%, you are taking a high-LTV mortgage.
    If property prices in your area fall, there is a risk that the value of your home
    could become less than the amount you owe us (negative equity), which may make
    it difficult to switch products or sell the property.


    We operate under the authority of the PRA and regulation by the FCA, adhering
    to the Consumer Duty to ensure fair outcomes for all members.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 06634a14-b445-5fd6-8068-b10cccf120ce
  title: Fernbridge First Home Five-Year Fixed Mortgage — how rates are tiered and
    applied
  body: 'This rate sheet provides internal guidance for support agents on the application
    of interest rates for the Fernbridge First Home Five-Year Fixed Mortgage.


    Rate Application

    Unlike our savings products, this mortgage does not employ a tiered interest structure
    based on the balance of the loan. A single, flat rate applies to all members who
    qualify for this product, regardless of the total loan amount, provided they meet
    the maximum LTV of 95%.


    - Initial Fixed Rate: 6.39% (Applied for the first 60 months of the loan term).

    - Standard Variable Rate (SVR): 7.24% (Applied automatically upon the expiry of
    the five-year fixed term).


    Rate Changes

    - The 6.39% rate is contractually fixed and cannot be changed by the Society or
    the member during the five-year period.

    - The SVR of 7.24% is variable and may be adjusted by the Society in line with
    market conditions and operational costs. Members will be notified of any SVR changes
    in accordance with our standard notification policy.

    - If a member wishes to avoid the SVR after their fix ends, they should be guided
    towards a product transfer request.'
