  institution_id: fernbridge_building_society
- id: 9f81c947-7cb7-58bd-b266-e4f28294b71a
  title: Fernbridge Cash Lifetime ISA — getting started walkthrough
  body: 'This guide provides support agents with the necessary steps to assist a member
    in opening a Fernbridge Cash Lifetime ISA. Ensure the member understands the long-term
    nature of this product before proceeding.


    Step 1: Eligibility Verification

    Confirm that the member is currently aged 39 or under. This is the maximum opening
    age for this product. If the member exceeds this age, they are ineligible for
    this specific ISA.


    Step 2: Educational Guidance

    Explain the core benefits and restrictions. The member should be aware that they
    can save up to £4,000 per tax year and will receive a 25% government bonus on
    those contributions. Ensure they understand that the funds are intended for their
    first home (with a property price cap of £450,000) or for retirement.


    Step 3: Rate and Cost Disclosure

    Confirm the current interest rate of 3.75%. Clearly explain the 25% withdrawal
    charge that applies to any funds removed for non-qualifying reasons, as this is
    a critical risk factor for the member.


    Step 4: Identity and Account Setup

    Perform rigorous identity verification as per our security protocols. The member
    must provide a valid Nominated Bank Account for the movement of funds, as we do
    not issue our own current accounts. Use multi-factor authentication to finalise
    the account opening process.


    Step 5: Confirmation

    Once the account is active, provide the member with their account details and
    confirm the process for claiming the government bonus on their deposits.


    For a detailed breakdown of the requirements for different member types, refer
    to Fernbridge Cash Lifetime ISA — qualification tiers.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: bf4745e5-74a4-5822-a6c2-f6acf2bd4b21
  title: Fernbridge Cash Lifetime ISA — government bonus on payments in explained
  body: 'Q: How does the government bonus work on my Fernbridge Cash Lifetime ISA?


    A: For every pound you save in your account, the government adds a 25% bonus.
    This means if you save £1,000, the government will add £250 to your balance.


    Q: Is there a limit to how much bonus I can earn each year?


    A: Yes. The government bonus is applied to contributions up to the annual limit
    of £4,000. This means the maximum government bonus you can receive in a single
    tax year is £1,000.


    Q: When can I use the funds and the bonus?


    A: You can withdraw the full balance, including the bonus, without penalty if
    you are using the funds to purchase your first home (up to a property price cap
    of £450,000) or upon reaching retirement age. For more details on the product,
    see Fernbridge Cash Lifetime ISA — overview.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9068ee76-aeec-5bab-a703-a9ce45c89ff1
  title: Fernbridge Cash Lifetime ISA — make a change or update
  body: 'If you need to update your personal details or change the Nominated Bank
    Account associated with your Fernbridge Cash Lifetime ISA, please follow these
    steps.


    What you need before starting:

    - Your account number.

    - A valid form of government-issued photo identification (if requested for verification).

    - The new account details (Sort Code and Account Number) if you are updating your
    Nominated Bank Account.


    Step 1: Identity Verification

    Tell us which detail you wish to update. We will then perform a rigorous identity
    verification process. This may include answering security questions or providing
    specific account details to ensure we are speaking with the authorised account
    holder.


    Step 2: State the Update

    Clearly provide the new information you wish to register. For example, if you
    are changing your address or your Nominated Bank Account, provide the full new
    details precisely as they appear on your official documentation.


    Step 3: Multi-Factor Authentication (MFA)

    To authorise the change, we will send a secure verification code to your registered
    mobile device or email address. You must provide this code back to us during the
    conversation to confirm the request is genuine.


    Step 4: Confirmation

    We will process the update and provide a verbal confirmation during the call or
    a secure digital message confirming that your records have been amended.


    Your update is complete once you receive this confirmation. If you have questions
    about the limits of your account, such as the £4,000 annual limit, please ask
    during your update request.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3cdb5d4e-7dd4-5b1a-9e63-1f054865258d
  title: Fernbridge Cash Lifetime ISA — access or login problems
  body: 'Symptom: You are unable to access your account details or log in to our secure
    digital messaging service to view your Fernbridge Cash Lifetime ISA balance.


    Likely Causes:

    - Incorrect or expired multi-factor authentication (MFA) credentials.

    - Account lockout due to multiple failed login attempts.

    - Outdated contact information preventing the receipt of verification codes.


    What to check and how to fix:

    1. Verify Connection: Ensure you have a stable internet connection and that your
    device can receive SMS or emails for MFA.

    2. Identity Re-Verification: If you are locked out, tell us you are experiencing
    access issues. We will perform a rigorous identity verification to confirm your
    ownership of the account.

    3. Update Contact Details: If your phone number or email has changed, we will
    guide you through the process of updating your details securely so that MFA can
    function correctly.

    4. Reset Credentials: Once your identity is verified, we will trigger a secure
    reset of your access credentials. You will receive a temporary link or code to
    establish a new secure password.


    When to escalate:

    If we cannot verify your identity through standard means, or if you suspect your
    account has been accessed by a third party, we will escalate your case to the
    Member Relations team. They will conduct a high-priority review of your security
    logs. You can expect a response or a resolution path within 15 business days for
    payment-related access issues, or eight weeks for other complex matters. We will
    keep you informed of the progress via your secondary verified contact method.'
  domain: retail_banking
