- id: 8daa0daf-eae3-57e9-9644-e5a0580110a4
  title: Fernbridge Easy Access ISA — eligibility requirements
  body: 'To maintain the tax-advantaged status of the Fernbridge Easy Access ISA,
    members must meet the following criteria:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a UK resident for tax purposes | Eligible |

    | Age | Must be 18 years of age or older | Eligible |

    | ISA Allowance | Must have remaining allowance within the £20,000 annual limit
    | Eligible |

    | Identity | Must pass rigorous multi-factor identity verification | Eligible
    |

    | Bank Account | Must possess a valid UK current account for use as a Nominated
    Bank Account | Eligible |

    | Deposit Limit | Contributions must not exceed the annual limit (e.g., £20,000
    currently) | Eligible |


    Members who do not meet all the above criteria will be ineligible for this specific
    product but may be suited to other savings options, such as the Fernbridge Easy
    Access Saver.'
