- id: 77712352-aa82-5f68-8075-6d673c9f251f
  title: Fernbridge Easy Access Saver — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Fernbridge
    Easy Access Saver. It is designed to help prospective and current members make
    informed financial choices.


    Interest Rate Variability

    The current interest rate of 3.6% is a variable rate. This means it can increase
    or decrease based on changes in the market or the operational needs of the society.
    We commit to transparency and will inform members of any significant changes to
    the rate.


    Inflation Risk

    While the Fernbridge Easy Access Saver provides a competitive return of 3.6%,
    there is a risk that the rate of inflation may exceed the interest rate. In such
    scenarios, the real purchasing power of the funds held in the account may decrease
    over time.


    Deposit Protection

    Fernbridge Building Society operates under the authority of the PRA and is regulated
    by the FCA. We strictly adhere to the Consumer Duty to ensure fair outcomes for
    our members. Your deposits are protected by the Financial Services Compensation
    Scheme (FSCS) up to £120,000 per person. For those with temporary high balances
    (e.g., from a house sale), protection is extended up to £1.4 million for a period
    of six months.


    Liquidity and Access

    This product is designed for liquidity, meaning funds can be withdrawn without
    the penalties associated with fixed-term bonds. However, all fund movements are
    subject to our security and verification protocols, including multi-factor authentication,
    to ensure the safety of the account.


    Advice Boundaries

    We provide educational information and guidance on our product suite to help you
    make informed choices. Please note that we do not provide individualised tax,
    legal, or financial planning advice. Members are encouraged to seek professional
    advice if they have complex tax requirements regarding their savings.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 0f1081b5-e6a7-5ed9-94b8-9b626f77c269
  title: Fernbridge Easy Access Saver — how rates are tiered and applied
  body: 'The Fernbridge Easy Access Saver employs a simple, transparent pricing structure
    to ensure all members are treated fairly, regardless of the size of their savings.


    Interest Rate Application:

    There are no tiers associated with this product. A flat interest rate of 3.6%
    applies to all balances, from the initial opening deposit of £1 up to the maximum
    allowable balance. This means every pound in the account earns the same rate of
    return.


    How Rates are Applied:

    - Rate: 3.6%

    - Calculation: Interest is calculated on the daily balance of the account.

    - Crediting: Interest is credited to the account periodically (please refer to
    your account statement for the specific credit date).


    What would change the rate?

    Because this is a variable rate account, the 3.6% figure may be adjusted by the
    society. Such changes are usually driven by changes to the Bank of England base
    rate or adjustments to our internal operational costs. We will communicate any
    rate changes to members with clarity and transparency.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: rate_sheet
