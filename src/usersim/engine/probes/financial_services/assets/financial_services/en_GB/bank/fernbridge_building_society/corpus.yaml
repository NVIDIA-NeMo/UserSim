- id: d78d973b-dde7-5af3-9f4f-5b4ca64d9caf
  title: Fernbridge First Home Five-Year Fixed Mortgage — fraud and unauthorised-activity
    protection
  body: 'At Fernbridge Building Society, we are committed to protecting our members
    from the evolving threats of financial fraud. When considering the Fernbridge
    First Home Five-Year Fixed Mortgage, it is important to be aware of the specific
    fraud patterns that can target first-time buyers and homeowners.


    Common threats include ''payment redirection'' scams, where fraudsters impersonate
    solicitors or agents to divert your deposit or mortgage funds to an unauthorised
    account. You may also encounter ''impersonation fraud'', where a caller pretends
    to be a Fernbridge representative to request sensitive security details. Please
    be aware that we will never ask you for your full password, your multi-factor
    authentication (MFA) codes, or request that you move funds to a ''safe account''
    for security reasons.


    To ensure the safety of your funds and personal data, we employ rigorous identity
    verification and multi-factor authentication for any state-changing actions, such
    as changing your Nominated Bank Account or updating contact details. We recommend
    that you always verify the identity of any third party requesting payment via
    a trusted, independent channel before transferring any funds.


    If you notice any suspicious activity or believe you have been targeted by a scam,
    you must inform us immediately. Timely reporting is critical for us to take action
    to protect your account and may affect your liability for any unauthorised transactions.
    Our team treats all reports with urgency and fairness.


    As a member-owned mutual, we operate under the authority of the PRA and regulation
    by the FCA. For your peace of mind, member deposits are protected by the FSCS
    up to £120,000 per person, with temporary high balances protected up to £1.4 million
    for six months. For more information on how we secure our products, you may wish
    to review Fernbridge First Home Five-Year Fixed Mortgage — overview.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 115fdf36-b902-50ab-83ca-c0ed4faa4736
  title: Fernbridge First Home Five-Year Fixed Mortgage — account agreement
  body: 'This agreement sets out the binding terms and conditions governing the Fernbridge
    First Home Five-Year Fixed Mortgage. As a member-owned mutual, we provide this
    facility to support the financial wellbeing of our first-time buyers.


    1. Interest Rates and Charges

    For the initial five-year term, the loan is subject to a fixed interest rate of
    6.39%. Upon the expiry of this fixed term, the loan will automatically revert
    to our standard variable rate of 7.24% unless the member chooses to switch to
    a different product. The product fee for this mortgage is £0.


    2. Loan-to-Value (LTV) and Security

    The maximum loan-to-value ratio permitted for this product is 95%. The member
    must maintain the property as security for the loan and ensure it is adequately
    insured. Any significant changes to the property value or ownership must be disclosed
    to us immediately.


    3. Overpayments and Early Repayment

    Members are permitted an overpayment allowance of 10% of the remaining loan balance
    per year without penalty. If the loan is repaid in full or partially beyond this
    allowance during the first year of the fixed term, an early repayment charge of
    5% will be applied to the amount repaid over the allowance.


    4. Obligations and Default

    The member is obligated to make all monthly payments on time. Failure to do so
    may result in the loan being called in or the account being referred to the Member
    Relations team for dispute resolution. We adhere strictly to the Consumer Duty
    to ensure fair outcomes for all members.


    5. Amendments and Termination

    We reserve the right to amend these terms with reasonable notice. This agreement
    ends upon the full repayment of the loan, the sale of the secured property, or
    the transfer of the loan to another product. Members always retain the right to
    escalate unresolved disputes to the Financial Ombudsman Service free of charge.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: terms_conditions
  source_authority: official
