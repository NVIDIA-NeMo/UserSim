  institution_id: fernbridge_building_society
- id: 1ffcb7a8-f978-5d51-ab73-d3f824b82f22
  title: Fernbridge Easy Access Saver — access or login problems
  body: 'If you are unable to access your account details or cannot log in to our
    secure digital messaging service, please follow this troubleshooting guide.


    Symptom: ''Invalid credentials'' or ''Login failed'' message.

    Likely Causes: Incorrect password or an expired session.

    What to check:

    1. Ensure your Caps Lock is off and you are using the correct email address associated
    with your membership.

    2. Try clearing your browser cache or using a different secure browser.

    3. If you have forgotten your password, request a password reset. You will be
    required to complete identity verification via your MFA device before a new password
    can be set.


    Symptom: MFA code not received or ''Invalid code'' error.

    Likely Causes: Network delays, outdated phone number on file, or entering the
    code after it has expired.

    What to check:

    1. Wait 60 seconds for the network to deliver the message and try again.

    2. Check that your mobile device has a stable signal.

    3. Ensure you are entering the most recent code sent; previous codes are void
    immediately upon the issuance of a new one.


    When to Escalate:

    If you have attempted the above and still cannot gain access, or if you suspect
    your MFA device has been compromised, please tell us immediately. We will escalate
    the matter to our Member Relations team. We will perform a manual identity verification
    check and, if necessary, reset your security credentials. You will receive a notification
    via your registered alternative contact method once access has been restored.


    For those comparing our service to others, please note that our rigorous verification
    is a commitment to the Consumer Duty and the safety of your 3.6% interest-bearing
    savings.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 8c89c4ac-cd71-5387-a525-50be472354af
  title: Fernbridge Easy Access Saver — qualification tiers
  body: 'The Fernbridge Easy Access Saver is designed to be an inclusive product with
    a single qualification tier. This ensures all members have equal access to our
    competitive rates.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a UK resident | Eligible for account opening |

    | Identity | Must pass rigorous identity verification | Eligible for account opening
    |

    | Opening Deposit | Minimum of £1 | Account activated with 3.6% interest rate
    |

    | Account Link | Valid external Nominated Bank Account | Full fund movement capability
    |


    There are no higher tiers or balance-based requirements to achieve the 3.6% rate;
    it is applied consistently to all members who meet the basic opening requirements.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: eligibility_matrix
