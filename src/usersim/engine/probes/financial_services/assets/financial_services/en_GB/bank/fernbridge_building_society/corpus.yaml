  institution_id: fernbridge_building_society
- id: fcfa146e-33db-54e2-b004-3ff79ef5306a
  title: Fernbridge First Home Five-Year Fixed Mortgage — recognising scams targeting
    this product
  body: 'As you explore the Fernbridge First Home Five-Year Fixed Mortgage and compare
    it with other market options, it is vital to remain vigilant against fraudulent
    activity. Scammers often target first-time buyers by exploiting the excitement
    and complexity of securing a first home.


    One common tactic involves individuals posing as ''specialist brokers'' or Fernbridge
    representatives who claim they can offer a rate significantly lower than our published
    fixed rate of 6.39%. They may request an upfront ''administration'' or ''reservation''
    fee to secure this deal. Please be aware that our Fernbridge First Home Five-Year
    Fixed Mortgage carries a product fee of £0. We will never ask for a payment via
    gift cards, cryptocurrency, or an external link to ''unlock'' a better rate.


    Another pattern involves ''urgent'' requests for your security credentials. We
    employ multi-factor authentication for all state-changing actions; however, we
    will never ask you to disclose your full password or one-time passcodes over the
    telephone or via email. If you receive a communication asking for these details
    to ''verify your identity'' before proceeding with your mortgage application,
    it is a scam.


    If you encounter any suspicious requests or feel a communication is not aligned
    with our professional and transparent tone, please notify us immediately via our
    secure digital messaging service. Prompt reporting allows us to protect your account
    and alert other members to the threat. For further guidance on maintaining your
    account security, you may find the Fernbridge First Home Five-Year Fixed Mortgage
    — account security best practices helpful.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9b534148-17d7-5ca5-af01-bd93f0f051c7
  title: Fernbridge First Home Five-Year Fixed Mortgage — limits, restrictions, and
    edge cases
  body: 'This document provides support agents with the critical constraints and boundaries
    associated with the Fernbridge First Home Five-Year Fixed Mortgage to ensure accurate
    member guidance.


    **Lending Limits**

    - **Maximum LTV**: The maximum Loan-to-Value is 95%. Applications exceeding this
    ratio cannot be approved under this specific product.

    - **Product Fee**: This product is engineered for accessibility, featuring a product
    fee of £0.


    **Repayment and Overpayment Restrictions**

    - **Overpayment Allowance**: Members are permitted to overpay up to 10% of the
    outstanding mortgage balance per year without penalty.

    - **Early Repayment Charge (ERC)**: If a member exceeds the 10% overpayment allowance
    or chooses to redeem the mortgage fully within the first year, an early repayment
    charge of 5% applies to the amount being repaid over the allowance.


    **Interest Rate Transitions**

    - **Fixed Period**: The fixed rate of 6.39% is guaranteed for five years.

    - **SVR Reversion**: Upon the expiry of the five-year term, the loan automatically
    reverts to the standard variable rate, which is currently 7.24%.


    **Edge Cases for Agents**

    - **LTV Fluctuations**: If the property value drops, the LTV may increase beyond
    95%. This does not trigger a default but may impact the member''s ability to switch
    products at the end of the term.

    - **ERC Calculation**: The 5% charge for year one is calculated specifically on
    the portion of the repayment that exceeds the 10% annual allowance. Ensure members
    understand this distinction to avoid disputes during redemption.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: ed4d2f44-5106-568a-8dcb-2275d071b37c
  title: Fernbridge First Home Five-Year Fixed Mortgage — standard variable rate after
    the deal ends explained
  body: '**What happens to my mortgage payments after the five-year fixed period ends?**


    Once your five-year fixed term concludes, your mortgage does not simply vanish
    or automatically renew into another fixed deal. Instead, the interest rate will
    transition from the initial fixed rate of 6.39% to our standard variable rate
    (SVR).


    **What is the current standard variable rate?**


    The current standard variable rate is 7.24%. Because this is a variable rate,
    it can fluctuate over time based on the society''s operational costs and wider
    economic conditions, which means your monthly payments may increase or decrease
    accordingly.


    **Do I have to stay on the standard variable rate?**


    No. We encourage members to contact us before their fixed term expires to discuss
    switching to a new product that suits their current financial circumstances. We
    aim to ensure a fair outcome for all our members by providing educational guidance
    on our available suite of products to help you avoid the higher costs associated
    with the SVR.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 6634b721-4bf8-5928-b7be-84cf98a68108
  title: Fernbridge First Home Five-Year Fixed Mortgage — check status or history
  body: "To maintain a clear understanding of your home financing, you can request\
    \ a comprehensive update on the status and history of your Fernbridge First Home\
    \ Five-Year Fixed Mortgage. Please follow these steps:\n\n1. **Request Account\
    \ Details**: Tell us that you wish to view the current status or payment history\
    \ of your mortgage. We will then perform a rigorous identity verification using\
    \ multi-factor authentication to ensure your security.\n2. **Specify the Information\
    \ Needed**: Clarify whether you require a current balance snapshot, a history\
    \ of your monthly repayments, or a confirmation of any overpayments made within\
    \ your 10% annual allowance.\n3. **Review the Summary**: We will provide a detailed\
    \ breakdown including:\n    - Your current remaining balance.\n    - The date\
    \ your fixed rate of 6.39% is scheduled to expire.\n    - A log of all payments\
    \ received to date.\n4. **Confirm Receipt**: Once we have provided this information\
    \ via secure digital messaging or over the phone, confirm that the details match\
    \ your own records.\n\nIf you identify any inconsistencies while reviewing your\
    \ history, please let us know immediately so we can investigate the discrepancy.\
    \ For a more formal record, you can ask us to send a full mortgage statement to\
    \ your registered address or via our secure digital channel."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: how_to_guide
