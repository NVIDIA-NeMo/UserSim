- id: b4d951be-c379-5790-9de7-0c51723a90a3
  title: Fernbridge First Home Five-Year Fixed Mortgage — getting started walkthrough
  body: 'Getting started with the Fernbridge First Home Five-Year Fixed Mortgage is
    a structured process designed to ensure you are entering homeownership on a sustainable
    footing. This walkthrough explains the journey from initial enquiry to the keys
    in your hand.


    1. Affordability Assessment

    We begin with a thorough affordability assessment. This is a mandatory requirement
    to ensure the mortgage is sustainable for you. We review your income, existing
    debts, and disciplined saving habits to determine your maximum borrowing capacity.


    2. Loan-to-Value (LTV) Verification

    We verify that your deposit meets the requirements for this product. The Fernbridge
    First Home Five-Year Fixed Mortgage allows for a maximum LTV of 95%, meaning you
    need a minimum deposit of 5% of the property''s value.


    3. Valuation and Application

    Once a property is identified, we arrange for a professional valuation to confirm
    the property''s market value. We then formalise the application. Because we prioritise
    accessibility for first-time buyers, this product carries a product fee of £0.


    4. Offer and Legal Work

    After the valuation and affordability checks are satisfied, we issue a formal
    mortgage offer. This offer confirms your fixed rate of 6.39% and the overall cost
    for comparison (APRC) of 7.1%. You will then work with your legal representative
    to complete the property transfer.


    5. Completion

    Upon completion, the funds are disbursed. Your payments will remain fixed at 6.39%
    for the first five years, providing you with budget certainty during your first
    few years in your new home. After this period, the loan will revert to the standard
    variable rate of 7.24%.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3b5ff517-86d1-5404-93ce-34a750be9901
  title: Fernbridge First Home Five-Year Fixed Mortgage — product fee explained
  body: "Q: Is there a fee to set up the Fernbridge First Home Five-Year Fixed Mortgage?\n\
    A: No. We have set the product fee at £0 for this specific mortgage. \n\nQ: Why\
    \ does Fernbridge offer a £0 product fee for first-time buyers?\nA: As a member-owned\
    \ mutual, we prioritise the financial wellbeing of our members over profit. We\
    \ recognise that entering the property market is a significant challenge; by removing\
    \ the product fee, we lower the barrier to entry, allowing you to keep more of\
    \ your savings for your deposit or home improvements.\n\nQ: Are there any other\
    \ hidden costs I should be aware of?\nA: Our pricing is transparent. While there\
    \ is no upfront product fee, please be aware of the early repayment charge of\
    \ 5% applicable during the first year, should you wish to exit the agreement early.\
    \ For a full breakdown of costs, please refer to Fernbridge First Home Five-Year\
    \ Fixed Mortgage — overview."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
