- id: d29b5515-bb7e-534c-b8c5-6391f01a75dd
  title: Fernbridge Easy Access ISA — vs. a typical competitor offering
  body: 'When comparing the Fernbridge Easy Access ISA to typical high-street bank
    offerings, the primary distinctions lie in our mutual structure and our commitment
    to fairness.


    **Fernbridge Easy Access ISA**

    *   **Interest:** A competitive 3.85% AER.

    *   **Ownership:** Member-owned mutual; profits are reinvested to benefit members
    rather than external shareholders.

    *   **Fees:** Minimal, transparent structure designed only to cover operational
    costs.

    *   **Protection:** Full FSCS protection up to £120,000.


    **Typical Competitor Offering**

    *   **Interest:** May offer promotional ''teaser'' rates that drop significantly
    after a few months.

    *   **Ownership:** Shareholder-owned; profit is driven by dividends for external
    investors.

    *   **Fees:** May include monthly maintenance fees or charges for certain types
    of access.

    *   **Protection:** Similarly protected by FSCS, though service models may differ.


    **Which should you choose?**

    Choose Fernbridge if you value a warm, community-centric approach and want a stable,
    fair rate of 3.85% without the worry of hidden shareholder-driven fees. A typical
    competitor may be preferable only if you specifically require a current account
    bundled with your ISA, as Fernbridge uses a Nominated Bank Account model.'
