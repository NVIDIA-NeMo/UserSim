- id: f864d3d3-6060-53d0-834f-f5e030c8ac2b
  title: Fernbridge Cash Lifetime ISA — vs. a typical competitor offering
  body: 'When comparing the Fernbridge Cash Lifetime ISA to typical high-street competitor
    offerings, the primary distinctions lie in our mutual structure and our commitment
    to transparency.


    Dimensions of Comparison


    - Government Bonus: Like all LISAs, we provide a government bonus rate of 25%.
    This is a standard regulatory benefit, but we ensure the process is transparent
    and efficiently credited.

    - Interest Rates: We offer a competitive interest rate of 3.75%. While some competitors
    may offer slightly higher introductory rates, they often drop significantly after
    a few months. Our rate is designed for steady, disciplined growth.

    - Fees: In line with our fee philosophy, we maintain a transparent structure.
    We do not charge account maintenance fees; the only significant cost is the 25%
    withdrawal charge, which is a government-mandated penalty for non-qualifying withdrawals.

    - Access: We operate as a mutual, prioritising member wellbeing over profit. This
    means our support is warm and human, provided via telephone and secure messaging
    during UK business hours.


    Who each suits

    - Fernbridge Cash Lifetime ISA: Best for first-time buyers and retirement savers
    who value a community-centric, member-owned institution and a fair, stable interest
    rate.

    - Competitor Offerings: May suit those who prefer a full-service current account
    integrated into the same bank, as we rely on your own Nominated Bank Account for
    fund movements.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: comparison
