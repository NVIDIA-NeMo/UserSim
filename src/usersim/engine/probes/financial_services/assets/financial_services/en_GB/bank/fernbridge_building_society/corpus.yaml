- id: afb2eeda-4204-5794-9cf4-c604dc0f5ce5
  title: Fernbridge One-Year Fixed Rate Bond — a declined or blocked action
  body: 'If you have attempted to open or manage a Fernbridge One-Year Fixed Rate
    Bond and the action was declined or blocked, it is usually due to one of the following
    reasons.


    **Common Symptoms**

    - You are told that you cannot proceed with opening the bond.

    - A fund transfer into the bond has been rejected.

    - You are unable to access specific account details.


    **Likely Causes and Fixes**

    - **Insufficient Deposit:** The most common cause for a declined opening is a
    deposit amount below £1,000. Please ensure the initial funding amount is at least
    £1,000, as this is the mandatory minimum for this product.

    - **Identity Verification Failure:** For your security, we employ rigorous identity
    verification before any state-changing action. If the MFA process was not completed
    successfully, the action will be blocked. Please ensure you have access to your
    registered device to complete the authentication.

    - **Nominated Bank Account Issues:** If you are attempting to fund the bond from
    an external account, the transfer may be blocked if the Nominated Bank Account
    has not been fully verified or if the names on the accounts do not match.


    **What to do next**

    If you have verified that you have the minimum £1,000 deposit and have completed
    the MFA process, but the action remains blocked, please inform us. We will then
    escalate the matter to our Member Relations team for a priority review.


    Once the Member Relations team has investigated the block, we will contact you
    via your secure digital messaging channel with a resolution or a request for further
    documentation. You can expect an update on these requests within our standard
    business hours.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: troubleshooting
