- id: 0895984f-201c-5096-9383-0d46d3c86c4a
  title: Fernbridge Members' Regular Saver — term (months) explained
  body: 'What does the 12-month term mean for my savings?

    The term is the duration for which the account remains open and earns the specified
    interest rate of 6.5%. For the Fernbridge Members'' Regular Saver, this is 12
    months. This fixed period encourages a disciplined saving habit, allowing you
    to build a lump sum through monthly deposits of up to £250.


    What happens when the 12-month term ends?

    At the end of the 12 months, the account matures. We will transfer the total balance,
    including all your monthly contributions and the accrued interest, back to your
    Nominated Bank Account. At this point, you are welcome to open a new Regular Saver
    or move your funds into another product, such as the options detailed in Fernbridge
    Members'' Regular Saver — overview.


    Can I close the account before the 12 months are up?

    Yes, but doing so may affect the interest earned. We encourage members to complete
    the full term to maximise their savings growth.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 015e6b7f-bb26-5641-bc04-96a58b640427
  title: Fernbridge Members' Regular Saver — make a change or update
  body: 'If you need to update the details of your Fernbridge Members'' Regular Saver,
    such as changing your monthly deposit amount or updating your Nominated Bank Account,
    please follow these steps. These updates are handled directly by our team via
    telephone or secure digital messaging during UK business hours.


    Step 1: State the requested change

    Tell us exactly what you would like to update. For example, you might say, "I
    would like to increase my monthly deposit to £200," or "I need to change the external
    account we use for my savings transfers."


    Step 2: Identity Verification

    To protect your funds, we will perform rigorous identity verification. This involves
    multi-factor authentication and a series of security questions. We cannot proceed
    with any state-changing action until your identity is fully confirmed.


    Step 3: Review the limit

    If you are changing your deposit amount, we will confirm that the new figure is
    within our maximum monthly deposit limit of £250. If your request exceeds this
    amount, we will inform you that it cannot be processed.


    Step 4: Confirmation of update

    Once the change is processed, we will provide a confirmation message via your
    preferred secure channel. This confirmation will state the new deposit amount
    or the new Nominated Bank Account details and the date from which the change takes
    effect.


    Step 5: Verify the action

    We recommend checking your next monthly statement to ensure the change has been
    applied correctly. If you notice any discrepancies, please let us know immediately
    so we can resolve the matter fairly and urgently.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 7832005f-8d84-5bb3-870c-899cfda593ba
  title: Fernbridge Members' Regular Saver — access or login problems
  body: 'If you are experiencing difficulties accessing your account information or
    logging into our secure messaging service, please review the following guidance.
    We understand that consistent access is vital for managing your monthly contributions
    of up to £250.


    Symptom: You are unable to log in or are receiving an ''authentication failed''
    message.


    Likely Causes:

    - Incorrect credentials being entered.

    - A failure in the multi-factor authentication (MFA) process, such as an expired
    code or an unregistered device.

    - The account has been temporarily locked due to multiple unsuccessful login attempts
    as a security precaution.


    What to check in order:

    1. Check your connectivity: Ensure you have a stable internet connection to receive
    MFA codes.

    2. Verify credentials: Double-check that you are using the correct login details
    associated with your membership.

    3. Check for service updates: Ensure there are no known system-wide outages affecting
    our secure digital messaging.


    How to resolve:

    If you remain locked out, please contact us. We will initiate a rigorous identity
    verification process to confirm you are the account holder. Once verified, we
    will reset your access or update your MFA settings in the conversation.


    When to escalate:

    If we are unable to resolve the login issue during the initial contact, or if
    you suspect your access has been compromised by a third party, the matter will
    be escalated to our Member Relations team. This is a high-priority request. You
    will be informed of the progress, and we aim to resolve such access disputes with
    urgency and fairness. For those comparing our services, please note that this
    rigorous verification is a core part of our commitment to member security, as
    outlined in Fernbridge Members'' Regular Saver — account security best practices.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9fe1d8f8-0fca-5e1b-8e4f-2d461040795d
  title: Fernbridge Members' Regular Saver — qualification tiers
  body: 'The following matrix defines the eligibility requirements for members wishing
    to open a Fernbridge Members'' Regular Saver. Support agents should use this to
    determine if a member qualifies for the 6.5% interest rate product.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Membership Status | Must be a registered member of Fernbridge Building Society
    | Eligible to proceed |

    | Membership Status | Not yet a member | Must complete membership application
    first |

    | External Banking | Must provide a valid Nominated Bank Account | Eligible to
    proceed |

    | External Banking | No external current account available | Ineligible (product
    requires external transfers) |

    | Existing Accounts | Must not already hold a current Members'' Regular Saver
    | Eligible to proceed |

    | Existing Accounts | Already holds an active Members'' Regular Saver | Ineligible
    (limit of one account per member) |


    All eligible members can then set up their monthly saving plan with a maximum
    monthly deposit of £250 for the 12-month term.'
