- id: fdf1f4ca-3b08-5b3e-8316-4eee505efc85
  title: Fernbridge One-Year Fixed Rate Bond — risk disclosures
  body: 'This document provides essential risk disclosures for members considering
    the Fernbridge One-Year Fixed Rate Bond. Please read these carefully to ensure
    this product aligns with your financial objectives.


    Liquidity Risk

    The Fernbridge One-Year Fixed Rate Bond is a fixed-term investment. By depositing
    a minimum of £1,000, you agree to lock these funds for a duration of 12 months.
    Unlike a flexible account, these funds are not readily accessible. Any request
    for early withdrawal may result in a penalty charge and a reduction in the interest
    earned. We recommend that members maintain a separate emergency fund in a product
    like the Fernbridge Easy Access Saver — overview before committing to a fixed
    bond.


    Inflation Risk

    While the interest rate of 4.45% is guaranteed for the 12-month term, there is
    a risk that the rate of inflation may exceed this yield. In such an event, the
    real purchasing power of your savings may decrease, despite the nominal increase
    in the balance.


    Regulatory Protection

    Fernbridge Building Society operates under the authority of the PRA and regulation
    by the FCA. All member deposits are protected by the Financial Services Compensation
    Scheme (FSCS). This protection is limited to £120,000 per person. Temporary high
    balances (such as those resulting from the sale of a property) are protected up
    to £1.4 million for a period of six months.


    Advice Boundary

    We provide educational guidance on our product suite to help you make an informed
    choice. However, Fernbridge Building Society does not provide individualised tax,
    legal, or financial planning advice. We encourage members to consult a qualified
    professional regarding the tax implications of the interest earned on this bond.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: e6fb9f64-9d95-5c5c-a1b9-d05543559630
  title: Fernbridge One-Year Fixed Rate Bond — how rates are tiered and applied
  body: 'As a support agent, please use the following guidelines when explaining the
    interest application for the Fernbridge One-Year Fixed Rate Bond.


    Rate Structure:

    This product uses a flat-rate structure. There are no tiers based on balance.
    A single interest rate of 4.45% applies to all balances, provided the minimum
    deposit of £1,000 has been met.


    Application and Calculation:

    - Rate: 4.45% AER (Annual Equivalent Rate).

    - Duration: The rate is fixed for the full 12 months of the term.

    - Compounding: The AER is a standardised way of showing what the interest rate
    would be if interest was paid and compounded each year.


    What changes the rate?

    Because this is a fixed-rate bond, the rate of 4.45% cannot be changed by the
    society or the member during the 12-month term. The only way the effective yield
    is altered is if the member chooses to close the account early, which would trigger
    penalties and a loss of a portion of the accrued interest.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 40013727-9798-5bfb-8df0-c44ac9c8ac36
  title: Fernbridge One-Year Fixed Rate Bond — referral and loyalty offer
  body: "We are pleased to announce a special referral and loyalty initiative for\
    \ our members. If you are a prospective customer introduced to us by an existing\
    \ member, or a loyal member looking to diversify your savings, we invite you to\
    \ open a Fernbridge One-Year Fixed Rate Bond.\n\nThis product is designed for\
    \ those who can commit their funds for a full year to achieve a secure, higher\
    \ yield. By depositing a minimum of £1,000, you can benefit from a fixed interest\
    \ rate of 4.45% for the entire 12-month term. \n\nAs a member-owned mutual, we\
    \ believe in rewarding the community that sustains us. This offer is available\
    \ for new accounts opened between 1 November 2024 and 31 December 2024. To take\
    \ advantage of this loyalty incentive, simply mention your referrer's membership\
    \ number during your application process. We will ensure the account is set up\
