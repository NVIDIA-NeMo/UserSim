- id: b8183eb4-dd29-54d2-84c0-676c7895297b
  title: Fernbridge First Home Five-Year Fixed Mortgage — a declined or blocked action
  body: "If you have attempted to make a payment or a change to your Fernbridge First\
    \ Home Five-Year Fixed Mortgage and the action was declined, it is usually due\
    \ to a specific product restriction or a security safeguard.\n\n**Common Symptoms**\n\
    - An overpayment request is rejected or flagged as 'blocked'.\n- A request to\
    \ change personal details is declined during the verification stage.\n\n**Likely\
    \ Causes and Solutions**\n\n1. **Overpayment Limit Exceeded**: The most common\
    \ cause for a blocked payment is exceeding the 10% overpayment allowance. This\
    \ product allows you to pay off up to 10% of the outstanding balance per year\
    \ without penalty. If your requested payment exceeds this threshold, the system\
    \ may block the action to prevent you from inadvertently triggering the 5% early\
    \ repayment charge applicable in year one.\n    - **The Fix**: Review your total\
    \ overpayments for the current calendar year. If you have already used your 10%\
    \ allowance, you may choose to pay the remaining amount but must first acknowledge\
    \ and accept the 5% early repayment charge.\n\n2. **Verification Failure**: If\
    \ a state-changing action is blocked, it may be due to a failure in the multi-factor\
    \ authentication process.\n    - **The Fix**: Ensure you are using the most current\
    \ contact details registered with us. If the verification continues to fail, we\
    \ will need to conduct a manual identity check.\n\n**Escalation**\nIf the cause\
    \ of the block is not clear or you believe a mistake has been made, please notify\
    \ us. We will escalate the matter to our Member Relations team, who will investigate\
    \ and provide a response. Most payment-related disputes are addressed within 15\
    \ business days."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c6205454-0230-5431-bc89-82045a4a6447
  title: Fernbridge First Home Five-Year Fixed Mortgage — when to switch or upgrade
  body: 'This guide assists support agents in identifying the optimal timing for a
    member to switch from the Fernbridge First Home Five-Year Fixed Mortgage to another
    product.


    **When to Recommend a Switch**


    1. **End of Fixed Term**: The primary trigger for switching is the expiration
    of the five-year term. To avoid the reversion to the standard variable rate of
    7.24%, members should be encouraged to explore new fixed-rate options.

    2. **Significant LTV Reduction**: Because this product supports a maximum LTV
    of 95%, members who have significantly increased their equity (through house price
    growth or overpayments) may qualify for products with lower interest rates than
    6.39% by moving to a lower LTV bracket.


    **Constraints on Switching**


    - **Year One ERC**: Agents must warn members that switching or redeeming the mortgage
    fully during the first year will trigger an early repayment charge of 5% on any
    amount exceeding the 10% overpayment allowance. If the cost of the ERC outweighs
    the interest saving of the new product, switching is not financially advisable.

    - **Affordability**: Any switch to a different credit product requires a fresh
    affordability assessment to ensure the member''s financial wellbeing is protected,
    in line with Consumer Duty.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: d3c8b2c3-efea-533a-9f48-bbe3bb67005a
  title: Fernbridge First Home Five-Year Fixed Mortgage — comparison vs. alternatives
    and when not to choose it
  body: 'Choosing the right mortgage is a pivotal decision for any first-time buyer.
    The Fernbridge First Home Five-Year Fixed Mortgage is specifically engineered
    to lower the barriers to homeownership, but it may not be the right fit for every
    member.


    **Why Choose This Product?**

    - **Low Deposit Entry**: With a maximum LTV of 95%, this product is ideal for
    those who have a smaller deposit but a steady income.

    - **Cost Predictability**: The fixed rate of 6.39% ensures your payments remain
    unchanged for five years, providing stability during the early years of homeownership.

    - **Zero Upfront Cost**: To help you keep more of your savings for furniture or
    renovations, we have set the product fee at £0.


    **When to Consider Alternatives**

    - **Need for Short-Term Flexibility**: If you anticipate needing to pay off your
    mortgage in full or make very large lump-sum repayments within the first year,
    the 5% early repayment charge (applicable to amounts over the 10% annual allowance)
    may make this product less attractive than a tracker or a shorter-term fix.

    - **Higher Deposit Availability**: If you have a deposit that puts your LTV significantly
    below 95%, you may find other products that offer a lower interest rate than 6.39%
    in exchange for the lower risk associated with a larger deposit.

    - **Preference for Variable Rates**: If you believe interest rates will drop significantly
    in the near future, a variable-rate product might be preferable, though it lacks
    the certainty of our 6.39% fixed rate.


    Regardless of your choice, we always perform a thorough affordability assessment
    to ensure the mortgage is sustainable for you in the long term.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 802c2dad-2732-5de1-b9a8-02d2bf2a3537
  title: Fernbridge First Home Five-Year Fixed Mortgage — APRC (overall cost for comparison)
    on £200,000 over 25 years explained
  body: '**What does the APRC of 7.1% actually mean for my mortgage?**


    The APRC (Annual Percentage Rate of Charge) is a standardised figure that represents
    the total cost of the loan over its entire term, expressed as an annual percentage.
    Unlike the fixed rate of 6.39%, which only applies for the first five years, the
    APRC accounts for the fact that you will likely move to the standard variable
    rate (currently 7.24%) after the fixed period ends.


    **How is this calculated for a £200,000 loan over 25 years?**


    If you borrow £200,000 over a 25-year term, the APRC of 7.1% helps you compare
    the total cost of this mortgage against other lenders'' offerings. It assumes
    that the loan remains in place for the full 25 years and incorporates the initial
    6.39% rate, the transition to the SVR, and the £0 product fee. It is the most
    transparent way to see the long-term financial commitment of the loan, ensuring
    you can make an informed choice about your first home.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: faq
  source_authority: official
