- id: d39642e4-08f5-5dce-aa67-c44cdfe46da9
  title: Fernbridge Cash Lifetime ISA — referral and loyalty offer
  body: 'We are delighted to support our members in achieving the dream of homeownership.
    Between 1 October 2025 and 31 December 2025, we are offering a loyalty reward
    to help you get started with your first home journey.


    If you are an existing member of our mutual and open a Fernbridge Cash Lifetime
    ISA, or if you are referred to us by a current member, you will receive a one-time
    loyalty bonus of £50 credited to your account once your first deposit is confirmed.
    This is in addition to the competitive interest rate of 3.75% and the 25% government
    bonus on your contributions.


    To qualify, the account must be opened within the promotional period and the member
    must meet the standard eligibility criteria, including being aged 39 or under.
    This offer is designed to reward those who trust us with their disciplined saving
    goals.


    For more details on how this account helps you save for a home, please refer to
    the Fernbridge Cash Lifetime ISA — overview.'
