- id: 3aeb5950-cdbf-5d89-a89d-afdf50235be6
  title: Fernbridge First Home Five-Year Fixed Mortgage — resolve a common request
    end-to-end
  body: "A common request for members is making a voluntary overpayment to reduce\
    \ the total interest paid over the life of their mortgage. Here is the end-to-end\
    \ process for completing this request:\n\n1. **Verify Overpayment Capacity**:\
    \ Tell us you wish to make a lump-sum overpayment. We will first verify your identity\
    \ and then check your account to see how much of your 10% annual overpayment allowance\
    \ has already been used.\n2. **Specify the Amount**: State the exact amount you\
    \ wish to pay. \n    - If the amount is within the remaining 10% allowance, we\
    \ will proceed directly to the payment step.\n    - If the amount exceeds the\
    \ 10% allowance, we will notify you that a 5% early repayment charge will apply\
    \ to the excess amount (if you are in year one of the mortgage). You must explicitly\
    \ agree to this charge before we proceed.\n3. **Authorise the Fund Movement**:\
    \ Provide the details of the Nominated Bank Account from which the funds should\
    \ be drawn. We will use multi-factor authentication to ensure this fund movement\
    \ is authorised by you.\n4. **Confirmation of Action**: We will process the payment\
    \ and send a confirmation via secure digital messaging. This confirmation will\
    \ state the new outstanding balance of your mortgage and the remaining overpayment\
    \ allowance for the current year.\n\nBy completing this process, you effectively\
    \ reduce the principal balance of your loan, which can either reduce your future\
    \ monthly payments or shorten the overall term of your mortgage."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 29567d11-d77f-535d-ac48-224b71758f71
  title: Fernbridge First Home Five-Year Fixed Mortgage — a discrepancy in your records
    or statement
  body: 'When a member reports a discrepancy in their mortgage records or statement,
    support agents must follow a systematic verification process to resolve the issue
    fairly and accurately.


    **Symptom**

    The member claims that their remaining balance is incorrect, a payment has not
    been credited, or an early repayment charge has been applied in error.


    **Investigation Steps**


    1. **Payment Log Audit**: Compare the member''s provided evidence (e.g., bank
    statements from their Nominated Bank Account) against our internal payment logs.
    Verify if the payment was received and correctly allocated to the mortgage account.

    2. **Overpayment Allowance Check**: If the member is disputing a 5% early repayment
    charge, review the total overpayments made in the current calendar year. Calculate
    if the disputed payment exceeded the 10% overpayment allowance. If the total overpayments
    are within 10% of the balance, the charge was applied in error.

    3. **Interest Accrual Review**: Ensure the interest has been calculated correctly
    based on the fixed rate of 6.39% for the fixed period, or the standard variable
    rate of 7.24% if the deal has ended.


    **Resolution and Escalation**


    - **Simple Correction**: If a payment was misallocated, correct the record and
    provide the member with an updated balance immediately.

    - **Complex Dispute**: If the discrepancy cannot be resolved through a log audit,
    or if the member disagrees with the calculation of the 10% allowance, escalate
    the case to the Member Relations team.

    - **Timeline**: Inform the member that we aim to provide a final response within
    15 business days for payment-related services. Remind them of their right to escalate
    the matter to the Financial Ombudsman Service free of charge if they remain unsatisfied.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 46c751d9-b1ad-575f-b2c7-468c952a32f5
  title: Institution-wide fees and charges
  body: 'At Fernbridge Building Society, we believe in a fair and transparent approach
    to pricing. As a member-owned mutual, our priority is the financial wellbeing
    of our members rather than the generation of shareholder profit. Consequently,
    we maintain a pricing structure where fees are kept to an absolute minimum and
    are only applied to cover direct operational costs.


    Most of our core savings and ISA services are provided without monthly maintenance
    charges. We are particularly committed to supporting those entering the property
    market; for this reason, the Fernbridge First Home Five-Year Fixed Mortgage carries
    a £0 product fee, ensuring the barrier to homeownership is as low as possible.


    While certain specific products may have unique fee structures—such as charges
    for unauthorised withdrawals from specialist accounts—these are clearly detailed
    in the individual product terms. For a comprehensive list of all charges associated
    with a specific account, members should refer to the relevant product fee schedule.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 5e0cdb7c-3d37-5126-bc3a-da592344e368
  title: General frequently asked questions
  body: 'How can I contact Fernbridge Building Society for support?

    We provide support via telephone and secure digital messaging. Our teams are available
    to assist you during UK business hours (GMT/BST).


    What happens if I have a complex issue or a dispute?

    All queries are initially handled by our first-line agents. If a matter is complex
    or requires high-priority attention, it is escalated to our Member Relations team
    for a thorough review.


    How long does it take to resolve a complaint?

    We treat all complaints with urgency. We aim to provide a final response within
    15 business days for disputes relating to payment services, and within eight weeks
    for all other matters.


    What if I am not satisfied with the final response?

    Members are always informed of their right to escalate any unresolved disputes
    to the Financial Ombudsman Service free of charge. For more details on our internal
    processes, please see our respective policy documents.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9dcf8e8b-be8e-5fd0-98b8-2502a0e472e9
  title: Regulatory notes for Current accounts and savings
  body: "Fernbridge Building Society operates under the authority of the Prudential\
    \ Regulation Authority (PRA) and is regulated by the Financial Conduct Authority\
    \ (FCA). We strictly adhere to the Consumer Duty, which mandates that we act to\
    \ deliver good outcomes for our members, ensuring that our products provide fair\
    \ value and that our communications are clear and supportive.\n\nOne of the primary\
    \ protections for our members is the safety of their deposits. Member deposits\
    \ are protected by the Financial Services Compensation Scheme (FSCS) up to £120,000\
    \ per person. In specific instances where members hold temporary high balances,\
    \ this protection is extended up to £1.4 million for a period of six months.\n\
    \nAgents must ensure that all members are treated fairly and that no misleading\
    \ information is provided regarding the security of their funds. When discussing\
    \ account openings or fund movements, agents must strictly follow our security\
    \ and verification protocols, including multi-factor authentication, to ensure\
    \ that the account holder is the only person authorised to change personal details\
    \ or move funds. \n\nAdditionally, agents must remember that we provide educational\
    \ information and guidance on our product suite to help members make informed\
    \ choices. However, we do not provide individualised tax, legal, or financial\
    \ planning advice. If a member requests specific tax advice regarding their ISA\
    \ or savings, agents must clearly state our boundaries and suggest the member\
    \ consults a qualified professional."
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c9462482-5953-52e2-9a89-0b414d0ae8fa
  title: Regulatory notes for Loans and mortgages
  body: 'Our lending activities, specifically our mortgage products, are conducted
    under the authority of the PRA and regulated by the FCA. In alignment with the
    Consumer Duty, we are obligated to ensure that any credit product we offer is
    suitable for the member and that the borrowing is sustainable.


    Before recommending any credit product or proceeding with a mortgage application,
    agents must ensure that rigorous affordability assessments are performed. This
    is a mandatory requirement to protect the member from financial hardship and to
    ensure the loan is sustainable over the chosen term.


    It is critical that agents maintain a clear boundary between providing educational
    guidance and providing financial advice. While we can explain the features of
    the Fernbridge First Home Five-Year Fixed Mortgage, such as its high-LTV (Loan-to-Value)
    nature, we do not provide individualised financial planning or legal advice. Members
    should be encouraged to seek independent professional advice if they require a
    tailored financial strategy.


    Furthermore, all state-changing actions related to mortgage accounts—such as requesting
    a product transfer or making an overpayment—require rigorous identity verification.
    Agents must never disclose account-specific details or execute fund movements
    without first successfully completing the mandatory verification and multi-factor
    authentication process to prevent fraud and ensure the security of the member''s
    home financing.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 3efc97a2-a419-5ff9-8bc3-6850dd584761
  title: When to use transfer_isa_in
  body: 'The `transfer_isa_in` tool is used when a member wishes to move an existing
    ISA from another financial institution into a Fernbridge ISA. This process ensures
    that the funds retain their tax-free status throughout the transition.


    Agents must follow these steps to process a transfer:


    1. Verify the identity of the member using our mandatory rigorous verification
    and multi-factor authentication protocols.

    2. Use the `get_accounts` tool to identify the member''s existing Fernbridge ISA
    account_id based on the last four digits provided by the member.

    3. Confirm the details of the external ISA, including the current provider''s
    name and the total amount to be transferred.

    4. Confirm the specific type of ISA being transferred to ensure it matches the
    Fernbridge product (e.g., moving a Cash ISA into the Fernbridge Easy Access ISA).

    5. Execute the transfer by calling the `transfer_isa_in` tool with the required
    account_id, provider name, amount, and ISA type.


    Agents must inform the member that the transfer process may take several business
    days to complete depending on the external provider''s processing times. If the
    member is unsure about the tax implications of the transfer, remind them that
    we provide educational guidance but cannot offer individualised tax advice.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_in
  institution_id: fernbridge_building_society
- id: 338160e8-ef4e-55cf-bc45-c426d5582031
  title: transfer_isa_in tool reference
  body: 'The `transfer_isa_in` tool allows an agent to initiate the transfer of ISA
    funds from an external provider into a member''s Fernbridge ISA without losing
    the tax-free status of the funds.


    **Tool Signature:**

    `transfer_isa_in(account_id: string, provider_name: string, amount: string, isa_type:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier for the member''s Fernbridge ISA account
    (obtained via `get_accounts`).

    - `provider_name`: The full name of the external financial institution currently
    holding the ISA.

    - `amount`: The total sum of funds to be transferred, written in GBP (e.g., "£5,000").

    - `isa_type`: The type of ISA being transferred (e.g., "Cash ISA").


    **Effect:**

    This tool triggers the formal transfer request to the external provider. The agent
    performs this action by calling the tool directly within the conversation after
    the member''s identity has been verified.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_in
  institution_id: fernbridge_building_society
- id: e0972fe1-c066-51a6-8529-ae2048e329a3
  title: When to use claim_lisa_home_purchase
  body: 'The `claim_lisa_home_purchase` tool is used specifically for members using
    a Fernbridge Cash Lifetime ISA to purchase their first home. This tool facilitates
    the release of the member''s savings and the 25% government bonus directly to
    their legal representative.


    Agents must follow these steps to process the claim:


    1. Verify the identity of the member using rigorous verification and multi-factor
    authentication.

    2. Use the `get_accounts` tool to locate the specific account_id for the member''s
    Fernbridge Cash Lifetime ISA.

    3. Collect the full details of the member''s conveyancer, including their firm
    name and contact information.

    4. Confirm the total amount to be released, including the anticipated government
    bonus.

    5. Call the `claim_lisa_home_purchase` tool to authorise the payment from the
    ISA to the conveyancer.


    Agents must explain to the member that this action is irreversible. Once the funds
    are released to the conveyancer for a home purchase, they cannot be returned to
    the ISA. If the member is not using the funds for a first home purchase or retirement,
    they must be warned about the potential government withdrawal charges associated
    with unauthorised withdrawals.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - claim_lisa_home_purchase
  institution_id: fernbridge_building_society
- id: ce86ac67-a25c-5412-93dc-e54f5c3f2c3c
  title: claim_lisa_home_purchase tool reference
  body: 'The `claim_lisa_home_purchase` tool releases the savings and the associated
    25% government bonus from a member''s Lifetime ISA to their appointed conveyancer
    for the purchase of a first home.


    **Tool Signature:**

    `claim_lisa_home_purchase(account_id: string, conveyancer_details: string, amount:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier for the member''s Fernbridge Cash Lifetime
    ISA (obtained via `get_accounts`).

    - `conveyancer_details`: The full name and contact information of the legal professional
    handling the property purchase.

    - `amount`: The total amount to be released, including the government bonus, written
    in GBP (e.g., "£12,500").


    **Effect:**

    This tool initiates an irreversible payment of funds from the ISA to the specified
    conveyancer. The agent performs this action by calling the tool directly within
    the conversation after the member''s identity has been verified.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - claim_lisa_home_purchase
  institution_id: fernbridge_building_society
- id: 32d285f4-c996-5791-ab57-e3c14ca11951
  title: When to use make_mortgage_overpayment
  body: 'The `make_mortgage_overpayment` tool is used when a member wants to make
    a one-off or regular payment towards their mortgage balance above the scheduled
    monthly amount.


    Agents must follow these steps:


    1. Verify the identity of the member using rigorous verification and multi-factor
    authentication.

    2. Use the `get_accounts` tool to find the member''s mortgage account_id.

    3. Determine the amount the member wishes to overpay and the frequency (one-off
    or regular).

    4. Check the member''s yearly overpayment allowance. If the amount exceeds this
    allowance, the agent must first inform the member of the specific early repayment
    charge that will apply.

    5. Once the member has been informed of any charges and has agreed to proceed,
    call the `make_mortgage_overpayment` tool.


    Agents should remind members that while overpayments can reduce the overall interest
    paid and the term of the mortgage, they should ensure they maintain a sufficient
    emergency fund in a flexible account, such as the Fernbridge Easy Access Saver,
    before committing large sums to their mortgage.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_mortgage_overpayment
  institution_id: fernbridge_building_society
- id: 8847847f-54f9-5eea-9073-5538141ac325
  title: make_mortgage_overpayment tool reference
  body: 'The `make_mortgage_overpayment` tool processes a one-off or regular payment
    towards a mortgage principal, reducing the total balance faster than the standard
    schedule.


    **Tool Signature:**

    `make_mortgage_overpayment(account_id: string, amount: string, payment_frequency:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier for the member''s mortgage account (obtained
    via `get_accounts`).

    - `amount`: The sum to be overpaid, written in GBP (e.g., "£1,000").

    - `payment_frequency`: Specifies if the payment is a "one-off" or "regular" occurrence.


    **Effect:**

    This tool deducts the specified amount from the member''s nominated bank account
    and applies it to the mortgage balance. If the payment exceeds the yearly allowance,
    the tool will apply the relevant early repayment charge. The agent performs this
    action by calling the tool directly within the conversation after the member''s
    identity has been verified.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_mortgage_overpayment
  institution_id: fernbridge_building_society
- id: 9a3a9915-d377-50a5-ab82-084f20dfa528
  title: When to use request_product_transfer
  body: 'At Fernbridge Building Society, we aim to make the transition between mortgage
    deals as seamless as possible for our members. The request_product_transfer process
    is used when a member''s current mortgage deal is coming to an end and they wish
    to move onto a new fixed or tracker deal without the need for a full new mortgage
    application.


    This procedure should be initiated when the member''s existing product term is
    expiring, or within the window permitted by the current product terms. By using
    a product transfer, members can avoid the administrative burden of a new application
    and the costs associated with a full credit assessment, provided their circumstances
    remain stable.


    Agents must follow these steps to complete the request:


    1. Perform rigorous identity verification to ensure the member''s security.

    2. Use the get_accounts tool to identify the specific mortgage account and confirm
    the current deal end date.

    3. Discuss the available product options with the member, providing educational
    information on the interest rates and terms to help them make an informed choice.

    4. Confirm that the member understands the terms of the new deal, including any
    change in the monthly payment amount.

    5. Once the member has selected a new deal, execute the request_product_transfer
    tool to move the mortgage onto the new product.


    If the member requires a change in loan amount or a significant change to the
    mortgage term, this process is not appropriate, and a full application via the
    apply_mortgage tool should be pursued instead. For further technical details on
    the transfer mechanism, refer to the request_product_transfer tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_product_transfer
  institution_id: fernbridge_building_society
- id: f7a22de7-0157-5690-a80e-ce5f410e10ac
  title: request_product_transfer tool reference
  body: 'The request_product_transfer tool is used by agents to move an existing mortgage
    account from an expiring deal onto a new fixed or tracker deal without requiring
    a new mortgage application.


    Agent Action: The agent performs this action by calling the tool directly within
    the secure messaging or telephone support interface after the member''s identity
    has been verified.


    Parameters:

    - account_id: The unique identifier for the mortgage account, obtained via the
    get_accounts tool.

    - new_product_id: The identifier for the target mortgage product the member has
    selected (e.g., first_home_mortgage).


    Effect: The tool updates the mortgage account''s product association, applying
    the new interest rate and terms from the date specified by the system (typically
    the anniversary of the previous deal''s end).'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_product_transfer
  institution_id: fernbridge_building_society
- id: 040f66bf-ff31-570f-a350-93dce9cdbfc0
  title: When to use apply_mortgage
  body: 'The apply_mortgage procedure is used when a member wishes to start a new
    mortgage application or obtain an agreement in principle. This is the primary
    path for first-time buyers seeking to enter the property market or existing members
    looking for a mortgage that requires a full application process (such as a significant
    change in loan amount or term).


    In line with our commitment to financial wellbeing and the Consumer Duty, we always
    perform thorough affordability assessments before recommending credit products.
    We provide educational guidance on our product suite, such as the Fernbridge First
    Home Five-Year Fixed Mortgage, to ensure members are making a sustainable financial
    decision.


    Agents must follow these steps:


    1. Perform rigorous identity verification to ensure the member''s security.

    2. Collect the necessary initial details from the member, including the estimated
    property price, the deposit amount they have available, and the desired mortgage
    term.

    3. Conduct a preliminary affordability assessment based on the member''s provided
    financial information.

    4. Explain the features and benefits of the suitable mortgage products, ensuring
    all technical terms are explained in plain English.

    5. Once the member is satisfied with the proposed solution and the affordability
    check is satisfactory, execute the apply_mortgage tool to initiate the formal
    application or agreement in principle.


    For the technical specifications of this action, see the apply_mortgage tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_mortgage
  institution_id: fernbridge_building_society
- id: fdb61579-7bac-5baf-af6d-0ac149149670
  title: apply_mortgage tool reference
  body: 'The apply_mortgage tool is used by agents to initiate a formal mortgage application
    or to generate an agreement in principle for a member.


    Agent Action: The agent performs this action by calling the tool directly after
    the member''s identity is verified and an affordability assessment has been performed.


    Parameters:

    - full_name: The member''s full legal name as provided during the conversation.

    - date_of_birth: The member''s date of birth.

    - contact_details: The member''s current contact information (phone and email).

    - property_price: The total estimated value of the property being purchased.

    - deposit_amount: The amount of cash the member is contributing as a deposit.

    - mortgage_term: The length of the mortgage in years.


    Effect: The tool creates a new mortgage application record in the system and triggers
    the credit and underwriting workflow for the member.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_mortgage
  institution_id: fernbridge_building_society
- id: f7480b82-f063-59b6-afda-cea540546c2d
  title: When to use transfer_funds
  body: 'The transfer_funds procedure is the authorised method for members to withdraw
    money from their savings accounts or ISAs. At Fernbridge Building Society, we
    do not issue our own current accounts or cards; therefore, all withdrawals are
    sent to the member''s Nominated Bank Account.


    This procedure applies to any account allowing withdrawals, such as the Fernbridge
    Easy Access Saver or the Fernbridge Easy Access ISA, provided the member has the
    right to withdraw funds under the product''s terms.


    Agents must follow these steps:


    1. Perform rigorous identity verification and multi-factor authentication to ensure
    the fund movement is authorised by the account holder.

    2. Use the get_accounts tool to identify the source account and confirm the available
    balance.

    3. Verify the current Nominated Bank Account on file to ensure funds are being
    sent to the correct external account.

    4. Confirm the exact amount the member wishes to withdraw.

    5. Execute the transfer_funds tool to move the specified amount from the savings
    or ISA account to the Nominated Bank Account.


    If the member wishes to change where the funds are sent, the agent must first
    follow the update_beneficiary procedure before processing the transfer. For technical
    details, see the transfer_funds tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: fernbridge_building_society
- id: 2ee15881-5bbb-5143-b814-4407b4c4d533
  title: transfer_funds tool reference
  body: 'The transfer_funds tool is used by agents to withdraw money from a member''s
    savings account or ISA and send it to their Nominated Bank Account.


    Agent Action: The agent performs this action by calling the tool directly after
    the member''s identity is verified and MFA has been successfully completed.


    Parameters:

    - account_id: The unique identifier of the source savings or ISA account, obtained
    via the get_accounts tool.

    - amount: The specific sum of money to be transferred, written in GBP.


    Effect: The tool deducts the specified amount from the identified Fernbridge account
    and initiates a payment to the member''s registered Nominated Bank Account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: fernbridge_building_society
- id: e1f5b836-ad88-592c-8975-c71d37124665
  title: When to use update_beneficiary
  body: 'Because Fernbridge Building Society does not provide current accounts, we
    rely on a Nominated Bank Account to facilitate all outgoing payments. The update_beneficiary
    procedure is used when a member needs to change the external bank account where
    their withdrawals are sent.


    Given the risk of fraud and the sensitivity of fund movements, changing a Nominated
    Bank Account is a state-changing action that requires the highest level of security
    scrutiny.


    Agents must follow these steps:


    1. Perform rigorous identity verification to ensure the agent is speaking with
    the account holder.

    2. Collect the full details of the new Nominated Bank Account, including the account
    holder''s name, sort code, and account number.

    3. Employ multi-factor authentication (MFA) to ensure the change is explicitly
    authorised by the account holder.

    4. Once the new details are confirmed and identity is securely verified, execute
    the update_beneficiary tool.


    Agents should advise members that for their protection, there may be a brief cooling-off
    period before funds can be transferred to a newly nominated account. For technical
    implementation details, see the update_beneficiary tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: fernbridge_building_society
- id: 7ca657a6-b3fe-52fa-a236-200fd36f2715
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool is used by agents to change the Nominated Bank
    Account associated with a member''s profile for the purpose of receiving withdrawals.


    Agent Action: The agent performs this action by calling the tool directly after
    rigorous identity verification and multi-factor authentication have been completed.


    Parameters:

    - full_name: The member''s full legal name as provided during the conversation.

    - date_of_birth: The member''s date of birth.

    - contact_details: The member''s current contact information.

    - new_bank_account_details: The full details of the new external account (Account
    Name, Sort Code, and Account Number).


    Effect: The tool updates the member''s profile, replacing the old Nominated Bank
    Account with the new one for all future fund movements.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: fernbridge_building_society
- id: 107cd9a3-2adc-5bd6-bef8-4aeee1b62b29
  title: When to use manage_authorized_users
  body: 'The manage_authorized_users procedure is used to manage who has legal authority
    to act upon a member''s account. This includes registering a power of attorney
    or adding or removing a third-party mandate, allowing a trusted person to manage
    the account on the member''s behalf.


    To protect our members'' assets and adhere to the Consumer Duty, we require rigorous
    documentation and verification before any third party is granted access to account
    information or fund movement capabilities.


    Agents must follow these steps:


    1. Perform rigorous identity verification of the member (the account holder).

    2. Collect the full details of the person being added or removed, including their
    full name, date of birth, and contact information.

    3. For power of attorney requests, verify that the legal documentation has been
    received and validated by the Member Relations team.

    4. Clearly explain to the member the level of access the authorised user will
    have (e.g., read-only vs. full transaction authority).

    5. Execute the manage_authorized_users tool to register, update, or remove the
    authorisation.


    For technical details on how this is processed, see the manage_authorized_users
    tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: fernbridge_building_society
- id: 24fd514a-7d4c-5bd2-af94-26cd124ff805
  title: manage_authorized_users tool reference
  body: 'The manage_authorized_users tool is used by agents to register a power of
    attorney or to add or remove third-party mandates on a member''s account.


    Agent Action: The agent performs this action by calling the tool directly after
    the account holder''s identity has been verified and the necessary legal requirements
    have been met.


    Parameters:

    - account_id: The unique identifier of the account, obtained via the get_accounts
    tool.

    - person_details: The full name, date of birth, and contact information of the
    person being authorised or removed.

    - authorization_type: The type of access being granted or revoked (e.g., ''power_of_attorney'',
    ''third_party_mandate'').

    - action: Whether the authorised user is being ''added'' or ''removed''.


    Effect: The tool updates the account''s permission settings, allowing or restricting
    the specified individual''s ability to interact with the account and its funds.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: fernbridge_building_society
- id: 1516dda8-7520-5b22-a0cd-9591ba87b3b8
  title: When to use open_account
  body: "This procedure outlines the requirements and steps for agents when a member\
    \ wishes to open a new savings or investment account with Fernbridge Building\
    \ Society. As a mutual, we aim to keep the onboarding process accessible and transparent\
    \ for our members.\n\nAgents must use this process whenever a member expresses\
    \ interest in starting a new savings goal or moving funds into a tax-efficient\
    \ vehicle. Before proceeding with any account opening, the agent must ensure the\
    \ member's eligibility for the specific product, as some accounts may have specific\
    \ requirements for first-time buyers or disciplined savers.\n\nSteps for opening\
    \ an account:\n\n1. Perform rigorous identity verification using the `verify_identity`\
    \ tool. No account can be opened until the member's identity is fully confirmed\
    \ to meet our security and compliance standards.\n2. Identify the appropriate\
    \ product based on the member's needs. The options include:\n    - Fernbridge\
    \ Easy Access Saver for flexibility.\n    - Fernbridge Members' Regular Saver\
    \ for consistent monthly saving.\n    - Fernbridge One-Year Fixed Rate Bond for\
    \ a secure, higher-yield commitment.\n    - Fernbridge Easy Access ISA for tax-efficient\
    \ savings.\n    - Fernbridge Cash Lifetime ISA for those seeking a 25% government\
    \ bonus for a first home or retirement.\n3. Collect the member's full personal\
    \ details, including their full name, date of birth, and current contact information.\
    \ Ensure these details are captured exactly as provided by the member.\n4. Confirm\
    \ the member has a Nominated Bank Account (an external current account) to facilitate\
    \ future fund movements, as we do not issue our own current accounts or cards.\n\
    5. Call the `open_account` tool, providing the chosen product ID and the member's\
    \ verified personal details to complete the request.\n\nIf the member is interested\
    \ in a mortgage, they should be directed to the application process detailed in\
    \ When to use apply_mortgage. For those transferring an existing ISA, please refer\
    \ to When to use transfer_isa_in."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: fernbridge_building_society
- id: 31c1e687-2146-55d3-84da-a480f1a07d40
  title: open_account tool reference
  body: 'The `open_account` tool is used by agents to create a new savings account
    or ISA for a member. The agent performs this action by calling the tool directly
    within the secure messaging or telephone support session.


    **Signature**

    `open_account(product_id, member_details)`


    **Arguments**

    - `product_id`: The unique identifier for the account type being opened. Valid
    IDs include `easy_access_saver`, `members_regular_saver`, `fixed_rate_bond`, `cash_isa`,
    and `cash_lifetime_isa`.

    - `member_details`: An object containing the member''s full name, date of birth,
    and contact information as provided during the conversation.


    **Effect**

    Calling this tool establishes a new account record for the member. Once successful,
    the account is active and ready for fund deposits from the member''s nominated
    bank account. This action is state-changing and requires prior identity verification.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: fernbridge_building_society
- id: cb60d9b2-3955-57fd-9ba9-4719a20e5b8e
  title: When to use close_account
  body: 'Closing an account is an irreversible action. Agents must handle these requests
    with care to ensure members fully understand the implications, particularly regarding
    the loss of a specific interest rate or the impact on a tax-efficient ISA wrapper.


    As a member-owned mutual, we strive to ensure fair outcomes; therefore, agents
    should first verify if the member''s needs could be met by a different Fernbridge
    product before proceeding with a full closure.


    Steps for closing an account:


    1. Perform rigorous identity verification using the `verify_identity` tool. Due
    to the irreversible nature of account closure and the movement of funds, this
    step is mandatory.

    2. Use the `get_accounts` tool to retrieve a full list of the member''s active
    accounts. This allows the agent to resolve the specific account ID from the last
    four digits provided by the member.

    3. Confirm with the member which specific account they wish to close and ensure
    they understand that the balance will be paid out in full.

    4. Verify the details of the member''s Nominated Bank Account. All funds from
    the closed account will be transferred to this external current account.

    5. Call the `close_account` tool using the specific account ID. This will trigger
    the final balance payment and the formal closure of the account record.


    If a member is closing an account due to a dispute, the matter should be handled
    according to the priority levels and timescales managed by the Member Relations
    team. Members should be reminded that for unresolved disputes, they have the right
    to escalate to the Financial Ombudsman Service free of charge.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: fernbridge_building_society
- id: 5e085c06-72ef-50e2-aa8a-d9ef122d21f9
  title: close_account tool reference
  body: 'The `close_account` tool is used by agents to permanently shut down a savings
    account or ISA and distribute the remaining balance. The agent performs this action
    by calling the tool directly.


    **Signature**

    `close_account(account_id)`


    **Arguments**

    - `account_id`: The unique identifier of the account to be closed, which the agent
    must obtain using the `get_accounts` tool during the conversation.


    **Effect**

    This tool performs an irreversible action. It closes the specified account and
    initiates a full transfer of the remaining balance, including any accrued interest,
    to the member''s Nominated Bank Account. This action is strictly subject to successful
    multi-factor authentication and identity verification.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: fernbridge_building_society
- id: e0a4ad6c-748d-55b9-835e-8037b1b92b2e
  title: When to use get_accounts
  body: 'The `get_accounts` tool is the primary mechanism for agents to identify which
    products a member holds and to retrieve the unique account identifiers necessary
    for other state-changing actions.


    Because we do not issue our own current accounts or cards, members often identify
    their holdings by the product name or the last few digits of an account number.
    The agent must use this tool to translate that information into the precise `account_id`
    required by the system.


    Steps for retrieving account information:


    1. Perform rigorous identity verification using the `verify_identity` tool. Disclosure
    of account information is prohibited until the member''s identity is confirmed.

    2. Call the `get_accounts` tool to pull the comprehensive list of all accounts
    associated with the verified member.

    3. Match the results from the tool against the information provided by the member
    (e.g., matching a ''last-4'' digit sequence to the full account ID).

    4. Communicate the relevant account details to the member using the correct product
    names, such as the Fernbridge Easy Access ISA or the Fernbridge Cash Lifetime
    ISA, to ensure clarity.


    This tool should be used as a prerequisite for any action that requires a specific
    account ID, such as making a mortgage overpayment or requesting a statement. For
    more information on how to provide these statements to members, see When to use
    get_statements.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: fernbridge_building_society
- id: 4b0f42a3-7c33-5060-b2ce-92a189dcda3f
  title: get_accounts tool reference
  body: 'The `get_accounts` tool allows agents to retrieve a complete list of all
    accounts held by the member currently in the conversation. The agent performs
    this action by calling the tool directly.


    **Signature**

    `get_accounts()`


    **Arguments**

    This tool takes no arguments as it automatically retrieves the accounts associated
    with the member who has been verified in the current session.


    **Effect**

    Calling this tool returns a list of all active and dormant accounts held by the
    member, including the unique account ID, the product type, and the current balance.
    This is a read-only operation and is essential for resolving account identifiers
    before performing state-changing actions.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: fernbridge_building_society
- id: 4df269fa-b392-5041-adcf-8941733bccef
  title: When to use update_contact_info
  body: 'Maintaining accurate contact information is vital for the security of our
    members'' funds and for ensuring that regulatory communications are received.
    Agents must use this procedure whenever a member reports a change in address,
    telephone number, or email address.


    To prevent fraud and unauthorised account takeovers, any change to personal details
    is treated as a high-security event and requires full authentication.


    Steps for updating contact information:


    1. Perform rigorous identity verification using the `verify_identity` tool. We
    employ multi-factor authentication to ensure that all personal detail changes
    are authorised by the account holder.

    2. Collect the new contact details from the member. Agents must ensure the information
    is recorded clearly and accurately, avoiding any ambiguity in addresses or phone
    numbers.

    3. Confirm with the member which specific details are being updated (e.g., ''Updating
    your home address from X to Y'').

    4. Call the `update_contact_info` tool, passing the updated member details to
    the system.

    5. Advise the member that they will receive a confirmation of this change via
    their existing secure communication channels.


    If the member also needs to change the external account where we send their funds,
    the agent should not use this tool, but instead follow the procedure for updating
    the Nominated Bank Account by using the `update_beneficiary` tool.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: fernbridge_building_society
- id: 5f5c516c-f3b3-5161-9006-b2272f82f114
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool is used by agents to modify a member''s personal
    contact details in the system. The agent performs this action by calling the tool
    directly.


    **Signature**

    `update_contact_info(member_details)`


    **Arguments**

    - `member_details`: An object containing the updated contact information (e.g.,
    new email, telephone number, or residential address) as provided by the member
    during the conversation.


    **Effect**

    This tool updates the member''s record with the new contact information. This
    is a state-changing operation that requires a previously verified identity. Once
    updated, all future correspondence and security notifications will be sent to
    the new details provided.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: fernbridge_building_society
- id: f58e21af-7503-5554-a239-4c44d76ebef4
  title: When to use get_statements
  body: 'Members may request account statements for a variety of reasons, including
    personal record-keeping, tax reporting for ISAs, or as evidence for mortgage applications.
    Agents should facilitate these requests promptly and transparently.


    Because statements contain sensitive financial data, the request must be handled
    with strict adherence to our security and verification protocols.


    Steps for providing account statements:


    1. Perform rigorous identity verification using the `verify_identity` tool. No
    financial statements may be disclosed or generated until the member''s identity
    is confirmed.

    2. Use the `get_accounts` tool to retrieve the member''s active accounts. This
    ensures the agent can accurately identify the specific account for which the statement
    is required (e.g., distinguishing between a Fernbridge Easy Access Saver and a
    Fernbridge Easy Access ISA).

    3. Ask the member for the specific timeframe or period they require the statement
    to cover (e.g., ''the last financial year'' or ''January 2024 to June 2024'').

    4. Call the `get_statements` tool, providing the specific account ID and the requested
    date range.

    5. Confirm with the member how they wish to receive the statement, ensuring it
    is sent via secure digital messaging or to their registered address.


    If the member identifies a discrepancy in their statement during this process,
    the agent should assist them in resolving the issue, referring to the relevant
    product-specific troubleshooting guide for the account in question.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: fernbridge_building_society
- id: 1391290b-dfb4-5ad9-aa27-aaf5b9b7ed98
  title: get_statements tool reference
  body: 'The `get_statements` tool allows agents to retrieve historical transaction
    and balance records for a specific account over a defined period. The agent performs
    this action by calling the tool directly.


    **Signature**

    `get_statements(account_id, period)`


    **Arguments**

    - `account_id`: The unique identifier for the account, which must be retrieved
    using the `get_accounts` tool.

    - `period`: The specific date range or timeframe for which the statement is requested
    (e.g., ''2023-04-06 to 2024-04-05'').


    **Effect**

    Calling this tool generates a statement of all transactions, interest credited,
    and the closing balance for the requested account during the specified period.
    This is a read-only action and requires the member''s identity to be verified
    before execution.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: fernbridge_building_society
- id: f12b47aa-9948-536f-b759-92f655e1b018
  title: When to use set_alerts
  body: 'At Fernbridge Building Society, we believe that transparency and proactive
    communication are essential to the financial wellbeing of our members. We provide
    alerting services to help our members monitor their savings growth, track their
    progress towards first-time home ownership, and maintain a disciplined approach
    to their finances. The set_alerts tool should be used whenever a member requests
    automated notifications regarding their account activity or balance thresholds.


    Alerts are particularly useful for members using the Fernbridge Members'' Regular
    Saver who wish to be reminded of their monthly commitments, or those with a Fernbridge
    Easy Access Saver who want to be notified when their balance reaches a specific
    target.


    Because configuring alerts is a state-changing action that modifies account preferences,
    agents must strictly adhere to the following procedure to ensure security and
    compliance with our Consumer Duty obligations:


    1. Perform mandatory identity verification. Use the verify_identity tool to ensure
    the member is authorised to make changes to the account. No alert may be set until
    this process is successfully completed.

    2. Identify the target account. Since members may hold multiple products, use
    the get_accounts tool to retrieve the list of accounts associated with the member.
    This allows the agent to resolve the correct account_id based on the member''s
    description or the last four digits of the account number.

    3. Define the alert parameters. Confirm with the member exactly what trigger they
    require. This could be a specific balance threshold (e.g., a notification when
    the balance exceeds £5,000) or a notification regarding a specific type of transaction.

    4. Apply the alert. Once the account_id and the trigger conditions are confirmed,
    call the set_alerts tool to activate the notification.

    5. Confirm completion. Inform the member that the alert has been successfully
    configured and explain how they will receive the notification (via secure digital
    messaging or telephone, depending on their preferences).


    If the member expresses confusion regarding how these alerts interact with their
    specific product, agents should refer to the relevant product overview, such as
    the Fernbridge Easy Access Saver — overview, to provide a consistent and helpful
    experience.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: fernbridge_building_society
- id: 27c6cfb8-8903-536d-8e17-e5e1284eb813
  title: set_alerts tool reference
  body: 'The set_alerts tool is used by agents to configure automated notifications
    for a member''s account. The agent performs this action by calling the tool directly
    within the conversation interface after the member''s identity has been verified.


    **Tool Signature and Arguments:**

    - account_id: The unique internal identifier for the member''s account. This must
    be retrieved via the get_accounts tool before calling set_alerts.

    - alert_type: The specific category of notification the member wishes to receive
    (e.g., a balance threshold alert or a transaction notification).

    - trigger_value: The numerical value or condition that activates the alert. For
    balance alerts, this is the specific amount in GBP (e.g., £1,000) that triggers
    the notification.


    **Effect:**

    Upon successful execution, the tool updates the account''s notification settings.
    The system will then automatically generate an alert to the member''s registered
    contact method whenever the defined trigger_value is met. This is a state-changing
    operation and must only be performed for verified account holders.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: fernbridge_building_society
