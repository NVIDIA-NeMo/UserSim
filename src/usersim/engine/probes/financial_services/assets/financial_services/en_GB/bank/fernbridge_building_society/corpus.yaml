- id: 43a99980-7159-5f4b-9b0c-053d6aae81ef
  title: Fernbridge Easy Access ISA — account security best practices
  body: 'At Fernbridge Building Society, the security of your hard-earned savings
    is our absolute priority. As a member of the Fernbridge Easy Access ISA, we encourage
    you to remain vigilant against evolving fraud patterns that target tax-efficient
    savings accounts.


    **Common Fraud Patterns**

    Fraudsters may attempt to impersonate us via telephone or digital messaging, creating
    a sense of urgency to move your funds to a ''safe account'' due to a purported
    security breach. Please remember that Fernbridge will never ask you to move your
    money to a different account to ''protect'' it, nor will we ever ask for your
    full password or multi-factor authentication (MFA) codes over the phone.


    **Our Security Commitments**

    To protect your assets, we employ rigorous identity verification before any state-changing
    action is performed on your account. We use multi-factor authentication to ensure
    that all fund movements and changes to personal details are authorised exclusively
    by the account holder. Furthermore, your deposits are protected by the FSCS up
    to £120,000 per person, providing peace of mind that your savings are secure.


    **Best Practices for Members**

    1. **Protect Your Credentials:** Never share your login details or MFA codes with
    anyone, including individuals claiming to be from the FCA or PRA.

    2. **Verify the Source:** If you receive an unexpected request for information,
    terminate the contact and reach out to us via our official secure digital messaging
    channels.

    3. **Monitor Your Statements:** Regularly review your account history for any
    unauthorised activity.


    **Taking Immediate Action**

    If you suspect your account has been compromised or if you have accidentally shared
    sensitive information, please inform us immediately. We treat all reports of fraud
    with urgency and fairness. If a dispute arises regarding fraudulent activity,
    we aim to provide a final response within 15 business days for payment services.
    You always retain the right to escalate unresolved disputes to the Financial Ombudsman
    Service free of charge.'
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: edb86b9a-1b43-53c0-a526-98708e73f229
  title: Fernbridge Easy Access ISA — change-of-terms policy
  body: 'This document outlines the policy and procedures regarding changes to the
    terms and conditions of the Fernbridge Easy Access ISA. As a member-owned mutual,
    we are committed to transparency and fairness in how we manage our accounts.


    **Interest Rate Adjustments**

    The current interest rate of 3.85% is variable. This means we may adjust the rate
    upwards or downwards to reflect changes in the wider economic environment or our
    own operational requirements. We will notify members of any significant rate changes
    through our secure digital messaging system or via post, ensuring you have clear
    information to make informed decisions about your savings.


    **Changes to Statutory Allowances**

    The Fernbridge Easy Access ISA respects the annual ISA allowance set by the UK
    government. Currently, this allowance is £20,000. However, members should be aware
    of planned regulatory changes: from 6 April 2027, the cash ISA allowance for those
    under 65 is expected to change to £12,000. We will provide detailed guidance as
    this date approaches to ensure all members can manage their contributions in accordance
    with the law.


    **General Terms Modifications**

    We reserve the right to amend our general terms and conditions to comply with
    the Consumer Duty or updated regulations from the PRA and FCA. We will provide
    a minimum of 30 days'' notice before any material change to the account''s fee
    structure or operational terms takes effect.


    **Member Rights and Agreement**

    By maintaining an account with us, you agree to our identity verification and
    multi-factor authentication requirements for all fund movements. Should you disagree
    with a change in terms, you have the right to close your account or transfer your
    ISA funds to another provider. As a mutual, we prioritise your financial wellbeing;
    therefore, any changes will be implemented with a commitment to fairness and accessibility.
    For more information on the specific limits of the account, please refer to the
    Fernbridge Easy Access ISA — limits, restrictions, and edge cases.'
  domain: retail_banking
  product_category: cash_isa
  document_type: terms_conditions
  source_authority: official
