- id: da2642eb-548d-5802-b0a4-0f0171538b41
  title: Fernbridge One-Year Fixed Rate Bond — when to switch or upgrade
  body: 'Support agents should use the following guidance to help members decide when
    to switch their funds into the Fernbridge One-Year Fixed Rate Bond.


    **Switch to the Fixed Rate Bond when:**

    - The member has a lump sum of at least £1,000 that they do not need to access
    for at least 12 months.

    - The member prioritises a guaranteed yield (4.45%) over flexibility.

    - The member is moving funds from the Fernbridge Easy Access Saver but no longer
    requires the ability to withdraw funds instantly.


    **Do not switch (or maintain the current product) when:**

    - The member may need the funds for emergencies; the Easy Access Saver is better
    for liquidity.

    - The member wishes to save a small amount regularly each month; the Fernbridge
    Members'' Regular Saver is designed for that purpose.

    - The member cannot commit to a 12-month term, as early withdrawal from the bond
    may result in a loss of interest.


    In summary: choose the bond for guaranteed 4.45% growth on a stable lump sum;
    choose the Easy Access Saver for flexibility.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: comparison
  source_authority: official
