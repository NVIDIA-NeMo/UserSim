- id: b4da2e23-5cf1-529c-844e-acc57eac6d21
  title: Fernbridge Members' Regular Saver — a failed or pending action
  body: 'It can be frustrating when a scheduled action, such as your monthly deposit,
    does not appear to have processed correctly. If you notice a missing deposit or
    a ''pending'' status on your account, please follow these steps to identify the
    cause.


    Common Symptoms

    You may see that your balance has not increased on the expected date, or you may
    receive a notification that a transfer from your Nominated Bank Account has failed.


    Likely Causes

    1. Insufficient Funds: The most common cause is that the Nominated Bank Account
    did not have enough funds to cover the monthly deposit (up to £250) at the time
    of the transfer.

    2. Verification Issues: A security flag may have been raised during the multi-factor
    authentication process, causing the transaction to be held for review.

    3. Account Detail Mismatch: If the details of your Nominated Bank Account have
    changed recently, the transfer may have been rejected by the external bank.


    What to check in order

    - First, check the statement of your Nominated Bank Account to see if the funds
    left the account.

    - Second, verify that your Nominated Bank Account details on file with us are
    still current and accurate.

    - Third, check your secure digital messages to see if we have requested further
    identity verification.


    How to fix it

    If the failure was due to insufficient funds, simply ensure the funds are available
    and ask us to re-trigger the deposit for that month. If there is a detail mismatch,
    provide us with the updated account information and we will update your record
    immediately.


    When to escalate

    If the funds have left your Nominated Bank Account but are not appearing in your
    Fernbridge account after three business days, we will escalate the matter to the
    Member Relations team. They will conduct a full trace of the funds. You will receive
    an update on the resolution within 15 business days for payment-related disputes.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: c6c39418-5672-56b7-9203-7646e6d763cd
  title: Fernbridge Members' Regular Saver — eligibility requirements
  body: 'To ensure a fair outcome for all members, the following requirements must
    be met to open and maintain a Fernbridge Members'' Regular Saver:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Membership Status | Must be an active member of Fernbridge Building Society
    | Eligible to open account |

    | External Banking | Must hold a valid Nominated Bank Account in the UK | Eligible
    for fund transfers |

    | Monthly Deposit | Must be able to commit to a maximum monthly deposit of £250
    | Account active |

    | Identity | Must pass multi-factor authentication and rigorous ID checks | Account
    activation approved |

    | Account Term | Must agree to the fixed term of 12 months | Account opening permitted
    |'
  domain: retail_banking
