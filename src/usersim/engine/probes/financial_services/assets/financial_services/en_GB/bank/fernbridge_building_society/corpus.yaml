- id: 9223a022-c4e6-59e0-9ef3-9b87e1886b25
  title: Fernbridge Easy Access Saver — fee schedule
  body: 'At Fernbridge Building Society, we believe in a transparent pricing structure
    where fees are kept to a minimum and only applied to cover direct operational
    costs. For the Fernbridge Easy Access Saver, our commitment to member accessibility
    is reflected in the following schedule:


    - **Account Opening Fee**: £0

    - **Monthly Maintenance Fee**: £0

    - **Withdrawal Fee**: £0

    - **Account Closure Fee**: £0

    - **Minimum Opening Deposit**: £1 (This is the initial amount required to activate
    the account, not a fee).


    There are no hidden charges associated with the standard operation of this account.
    If a member requires a bespoke service that incurs a direct operational cost,
    this will be disclosed clearly and agreed upon before any charge is applied. For
    further details on our general pricing philosophy, please refer to Institution-wide
    fees and charges.'
