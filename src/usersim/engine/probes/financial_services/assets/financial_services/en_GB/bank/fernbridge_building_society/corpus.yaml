- id: d5d216d4-3fc1-5df5-b460-41838a9ec944
  title: Fernbridge One-Year Fixed Rate Bond — term (months) explained
  body: 'Questions about the duration of your investment?


    **What does the ''12-month term'' actually mean?**

    It means that when you open a Fernbridge One-Year Fixed Rate Bond, you agree to
    leave your deposit (minimum £1,000) with us for exactly 12 months. In exchange
    for this commitment, we provide a guaranteed interest rate of 4.45%.


    **Can I withdraw my money before the 12 months are up?**

    This product is designed for disciplined savers who do not need immediate access
    to their funds. While early closure may be possible in exceptional circumstances,
    it typically results in a penalty or loss of interest. If you need a more flexible
    option, you might consider the Fernbridge Easy Access Saver — overview.


    **What happens at the end of the 12 months?**

    At the end of the term, your original deposit plus the interest earned at 4.45%
    will be available for withdrawal or can be reinvested into another one of our
    savings products.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 1ae28785-7a9a-5d71-a6ac-b8e8dd920a1d
  title: Fernbridge One-Year Fixed Rate Bond — make a change or update
  body: 'If you need to update the details associated with your Fernbridge One-Year
    Fixed Rate Bond, we are here to help. Because this is a high-value savings account,
    we maintain rigorous security standards to protect your funds.


    **What you will need before starting**

    - Your membership number.

    - A valid form of government-issued photo identification (if you are updating
    significant personal details).

    - The details of your new Nominated Bank Account (if applicable).


    **Steps to update your account**


    1. Request the Change: Tell us which detail you wish to update. This could be
    your home address, telephone number, or the Nominated Bank Account where your
    funds will be sent upon the bond''s maturity.


    2. Identity Verification: To protect your account, we will perform a mandatory
    identity verification. This involves multi-factor authentication (MFA) to ensure
    that you are the authorised account holder.


    3. Provide New Details: Give us the updated information. For example, if updating
    your Nominated Bank Account, provide the account number and sort code of the external
    current account you wish us to use.


    4. Review and Confirm: We will repeat the updated details back to you to ensure
    there are no errors. Once you confirm the details are correct, we will apply the
    changes to your record.


    5. Final Confirmation: You will receive a notification through our secure digital
    messaging service confirming that the update has been completed successfully.


    If you have any questions about how this affects your 4.45% interest earnings
    or the 12-month term, please ask us during the process. For more information on
    our data practices, you can view Fernbridge One-Year Fixed Rate Bond — privacy
    and data handling.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: how_to_guide
