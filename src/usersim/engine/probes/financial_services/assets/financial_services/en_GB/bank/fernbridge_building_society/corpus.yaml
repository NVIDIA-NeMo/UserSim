- id: 4cd5486e-3902-5a9e-8354-95a258c5a538
  title: Fernbridge First Home Five-Year Fixed Mortgage — make a change or update
  body: "Whether you have moved house (if the mortgage is for a different property),\
    \ changed your legal name, or need to update your Nominated Bank Account, we are\
    \ here to help you keep your records accurate. \n\nBefore you begin, please ensure\
    \ you have your member number and a valid form of government-issued photo identification\
    \ ready for verification.\n\nStep 1: Provide the request\nTell us clearly what\
    \ you wish to update. For example, you might say, \"I need to update the Nominated\
    \ Bank Account for my mortgage payments\" or \"I have changed my legal name and\
    \ need to update my account details.\"\n\nStep 2: Identity Verification\nTo protect\
    \ your security, we will perform a rigorous identity verification. This involves\
    \ multi-factor authentication and, depending on the change, a request to provide\
    \ a digital copy of your identification. We must complete this step before any\
    \ state-changing action is authorised.\n\nStep 3: Submit Supporting Evidence\n\
    If you are changing a legal name, you must provide a marriage certificate or deed\
    \ poll. If you are updating your Nominated Bank Account, you must provide the\
    \ new account number and sort code. We will verify that the account is held in\
    \ your name.\n\nStep 4: Confirmation of Change\nOnce we have verified your identity\
    \ and the provided evidence, we will process the update. You will receive a confirmation\
    \ message via secure digital messaging stating that the change has been successfully\
    \ applied to your Fernbridge First Home Five-Year Fixed Mortgage account.\n\n\
    Step 5: Final Verification\nWe recommend checking your next mortgage statement\
    \ to ensure the changes are reflected correctly. If the update involved your Nominated\
    \ Bank Account, we will confirm the date the first payment will be drawn from\
    \ the new account."
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: how_to_guide
  source_authority: official
