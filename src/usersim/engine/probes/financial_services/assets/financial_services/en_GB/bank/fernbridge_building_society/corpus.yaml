- id: da42c2d3-389d-5a5e-9293-8404312556ee
  title: Fernbridge Easy Access Saver — account security best practices
  body: 'At Fernbridge Building Society, the security of your savings is our highest
    priority. Because the Fernbridge Easy Access Saver is designed for flexibility,
    it is essential that you take active steps to protect your funds from unauthorised
    access.


    To keep your account secure, we employ multi-factor authentication (MFA) for all
    state-changing actions. This means that even if someone discovers your password,
    they cannot move funds or change your personal details without a second form of
    verification. We strongly encourage you to keep your MFA devices secure and never
    share your unique codes with anyone.


    We want to be transparent about how we operate: Fernbridge staff will never ask
    you for your full password, your MFA code, or your PIN over the telephone or via
    secure digital messaging. If you receive a request for this information, please
    treat it as a fraudulent attempt and notify us immediately.


    Be mindful of the ''Nominated Bank Account'' linked to your saver. Since we do
    not issue our own current accounts, all your funds are moved to this external
    account. Always ensure that the details of your Nominated Bank Account are kept
    up to date and that the external account itself is protected by strong security
    measures.


    If you notice any unusual activity, such as a withdrawal you did not authorise
    or a change to your contact details that you did not request, please inform us
    immediately through our secure digital messaging service or by telephone. Prompt
    reporting is the most effective way to limit potential losses and allows us to
    take immediate action to freeze the account if necessary. For further information
    on how we protect you, please see Fernbridge Easy Access Saver — fraud and unauthorised-activity
    protection.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: security_advisory
  source_authority: official
