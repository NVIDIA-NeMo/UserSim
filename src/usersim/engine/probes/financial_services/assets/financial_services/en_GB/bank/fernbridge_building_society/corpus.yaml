  institution_id: fernbridge_building_society
- id: a41180d6-2fe4-5940-bcad-efd55a65f517
  title: Fernbridge Easy Access Saver — privacy and data handling
  body: "Fernbridge Building Society is committed to the transparent and lawful handling\
    \ of your personal data. When you open a Fernbridge Easy Access Saver, we collect\
    \ and process your information to provide our services and comply with our regulatory\
    \ obligations under the PRA and FCA.\n\nData Collection and Purpose:\nWe collect\
    \ your personal identity details, contact information, and the details of your\
    \ Nominated Bank Account. This data is used specifically to: \n1. Verify your\
    \ identity and prevent financial crime (AML/KYC).\n2. Calculate and pay your interest\
    \ at the rate of 3.6%.\n3. Ensure the secure movement of funds to your external\
    \ account.\n4. Communicate important changes to your account terms via secure\
    \ digital messaging.\n\nYour Data Rights:\nUnder the General Data Protection Regulation\
    \ (GDPR), you have the right to access the personal data we hold about you, request\
    \ corrections to inaccurate information, and, in certain circumstances, request\
    \ the deletion of your data. However, please note that we are legally required\
    \ to retain certain records for a specified period following the closure of your\
    \ account to satisfy regulatory audit requirements.\n\nData Security:\nWe employ\
    \ rigorous security measures, including multi-factor authentication, to ensure\
    \ that your data is not accessed by unauthorised parties. We do not sell your\
    \ data to third parties for marketing purposes; we are a mutual society and our\
    \ focus is on your financial wellbeing, not profit from data.\n\nFor more detailed\
    \ information on the risks associated with retail banking and our regulatory standing,\
    \ please see Fernbridge Easy Access Saver — regulatory disclosures."
  domain: retail_banking
  product_category: easy_access_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: a5c16464-7b54-5efb-9f93-51849a8b18db
  title: Fernbridge Easy Access Saver — recognising scams targeting this product
  body: 'As a member-owned mutual, we are committed to the financial wellbeing of
    our members. This means protecting your funds from fraudulent activity is our
    highest priority. Members of the Fernbridge Easy Access Saver should be aware
    of specific scams designed to target flexible savings accounts.


    Common fraud patterns include:


    1. Phishing and Smishing: You may receive emails or text messages appearing to
    be from Fernbridge Building Society, claiming that your account has been frozen
    or that you are eligible for an ''exclusive'' interest rate increase far exceeding
    our current 3.6% rate. These messages often contain links to fraudulent websites
    designed to steal your login credentials.


    2. Urgent Payment Requests: Scammers may pose as members of our team, creating
    a sense of urgency to move your funds to a ''safe account'' due to a supposed
    security breach. Please remember that Fernbridge will never ask you to move your
    money to a different account to keep it safe.


    3. Impersonation: Fraudsters may use professional-sounding language to convince
    you to share your multi-factor authentication (MFA) codes over the phone. Our
    staff will never ask you for your full password or your MFA code.


    What to do if something looks wrong:

    If you receive a suspicious request or notice an unauthorised transaction, inform
    us immediately via our secure digital messaging or telephone service. Prompt reporting
    is essential; depending on the circumstances, reporting delays may affect your
    liability for fraudulent losses. We treat all fraud reports with urgency and fairness,
    adhering to our commitment to a fair outcome for every member.


    For more information on our general security protocols, please see Fernbridge
    Easy Access Saver — fraud and unauthorised-activity protection.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 26e6839f-ab01-5a0f-ac17-9ab4472493e4
  title: Fernbridge Easy Access Saver — limits, restrictions, and edge cases
  body: 'This internal product sheet outlines the operational boundaries and restrictions
    for the Fernbridge Easy Access Saver to assist agents in providing accurate member
    support.


    Core Financial Parameters:

    - Opening Deposit: The minimum opening deposit required to establish the account
    is £1. This low barrier ensures the account remains accessible to all members.

    - Interest Rate: The account earns an annual interest rate of 3.6%. This is applied
    to the balance and credited to the account according to the standard schedule.


    Access and Withdrawal Restrictions:

    - Liquidity: As an ''easy access'' product, there are no penalties or restrictions
    on the frequency of withdrawals. Members may access their funds as needed, provided
    they pass the mandatory identity verification process.

    - Fund Movements: All funds are transferred to or from the member''s Nominated
    Bank Account. As we do not issue our own current accounts or debit cards, all
    movements must be routed through this external account.


    Edge Cases and Account Management:

    - Minimum Balance: While the account requires £1 to open, there is no minimum
    balance required to keep the account active. However, an account with a £0 balance
    may be subject to closure if inactive for an extended period.

    - Identity Verification: Any state-changing action, such as changing a Nominated
    Bank Account or requesting a large lump-sum withdrawal, requires rigorous identity
    verification and multi-factor authentication.

    - Dispute Escalation: If a member disputes an interest calculation or a transaction,
    first-line agents should investigate. Complex disputes must be escalated to the
    Member Relations team, who aim for a final response within 15 business days for
    payment services.


    For further details on standard features, refer to Fernbridge Easy Access Saver
    — overview.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 36bd6c76-fd45-5522-a58b-328f90c245a6
  title: Fernbridge Easy Access Saver — eligibility and setup
  body: 'How do I become eligible to open a Fernbridge Easy Access Saver?

    To open an account, you must be a member of our building society. We welcome all
    members who are looking for a flexible place to grow their everyday savings. Because
    we are a mutual, we prioritise accessibility and fairness for all our members.


    What is required to set up the account?

    Setting up your account is straightforward. You will need to provide valid identification
    for our mandatory verification process and provide the details of your Nominated
    Bank Account, as this is where we will send your funds since we do not provide
    current accounts.


    Is there a minimum amount I need to start saving?

    Yes, the Fernbridge Easy Access Saver can be opened with a minimum opening deposit
    of just £1, making it a low-barrier entry point for anyone starting their savings
    journey.


    Where can I find more details on the requirements?

    Please see Fernbridge Easy Access Saver — eligibility requirements for a full
    list of criteria.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: faq
  source_authority: official
