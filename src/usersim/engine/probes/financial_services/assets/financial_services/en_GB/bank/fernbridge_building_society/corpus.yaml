  institution_id: fernbridge_building_society
- id: 515991b7-532c-58d4-8aec-fed227afbc61
  title: Fernbridge Members' Regular Saver — getting started walkthrough
  body: "This guide is intended for support agents to assist members in successfully\
    \ opening and managing a Fernbridge Members' Regular Saver account. This product\
    \ is specifically engineered for disciplined savers who wish to grow their funds\
    \ over a set period.\n\nKey Product Specifications to Communicate:\n- Interest\
    \ Rate: 6.5% (AER)\n- Maximum Monthly Deposit: £250\n- Term: 12 months\n\nWalkthrough\
    \ for Account Opening:\n1. Member Verification: Begin by performing rigorous identity\
    \ verification. Ensure the member is an existing member of the society or is completing\
    \ the membership process, as this is a member-exclusive product.\n2. Nominated\
    \ Bank Account: Confirm the member has a valid external current account. As we\
    \ do not issue our own current accounts or cards, we require a Nominated Bank\
    \ Account to facilitate the monthly deposits and the eventual payout.\n3. Deposit\
    \ Schedule: Explain that the member can save up to £250 every month. Emphasise\
    \ that the 6.5% interest is designed to reward this consistency over the 12-month\
    \ term.\n4. Confirmation: Once the account is opened, provide the member with\
    \ their new account number and confirm the date their first monthly contribution\
    \ will be collected.\n\nAgent Tips:\n- If the member is unsure if this is the\
    \ right product, explain the trade-off: they get a higher rate (6.5%) in exchange\
    \ for the discipline of monthly saving and a 12-month commitment. \n- For those\
    \ seeking more flexibility, you might suggest they look at the Fernbridge Easy\
    \ Access Saver — overview.\n- Remind the member that their deposits are protected\
    \ by the FSCS up to £120,000 per person."
  domain: retail_banking
  product_category: members_regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
