- id: 88c6738c-1f7f-5fa2-8eff-ab345ccdec92
  title: Fernbridge Members' Regular Saver — account security best practices
  body: 'As a member-owned mutual, the security of your hard-earned savings is our
    highest priority. Because the Fernbridge Members'' Regular Saver rewards consistent
    saving, it can sometimes be a target for sophisticated phishing attempts where
    fraudsters mimic ''savings milestone'' alerts to steal your credentials.


    To protect your funds, we employ multi-factor authentication for all state-changing
    actions. This ensures that any movement of funds or changes to your personal details
    are authorised exclusively by you. Please be aware that Fernbridge Building Society
    will never ask you to disclose your full password, PIN, or multi-factor authentication
    codes over the telephone or via secure messaging.


    We urge you to remain vigilant. If you receive a message claiming to be from us
    that asks you to click a link to ''verify'' your account or update your Nominated
    Bank Account details urgently, do not engage with it. Instead, initiate a new
    conversation with us through our verified secure digital messaging channels.


    If you suspect your account has been compromised or you notice an unauthorised
    transaction, you must inform us immediately. The sooner we are notified, the more
    effectively we can secure your balance and initiate recovery processes. We treat
    all security concerns with urgency and fairness, adhering to the Consumer Duty
    to ensure you receive a fair outcome.


    Remember, we will always perform rigorous identity verification before disclosing
    any account information or executing a request to change your account settings.
    This mandatory process is in place to safeguard your assets and maintain the integrity
    of our mutual society. For further information on how we protect your data, please
    refer to Fernbridge Members'' Regular Saver — privacy and data handling.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: a8f1fe23-d132-5cb1-8107-10217923e69f
  title: Fernbridge Members' Regular Saver — change-of-terms policy
  body: "This document outlines the policy regarding modifications to the terms and\
    \ conditions of the Fernbridge Members' Regular Saver. As a mutual, we strive\
    \ for transparency and fairness in how we manage our member accounts.\n\nInterest\
    \ Rate Adjustments: The interest rate of 6.5% is variable. While we aim to provide\
    \ stable returns to reward your discipline, Fernbridge Building Society reserves\
    \ the right to amend this rate based on market conditions and the overall financial\
    \ wellbeing of the society. We will provide you with written notice via secure\
    \ digital messaging at least 30 days before any rate decrease takes effect.\n\n\
    Deposit Limit Changes: The current maximum monthly deposit of £250 is set to ensure\
    \ the product remains accessible to a wide range of members. Should we decide\
    \ to alter this limit, we will notify you 30 days in advance. Any deposits made\
    \ prior to the change will remain unaffected, but subsequent monthly contributions\
    \ must adhere to the new limit.\n\nTerm Modifications: The standard term of 12\
    \ months is a core feature of this product. We do not typically alter the term\
    \ of an existing account; however, any changes to the general policy for new accounts\
    \ will be reflected in our current product sheets.\n\nMember Rights: If you disagree\
    \ with a change in terms, you have the right to close your account. In such instances,\
    \ we will process the closure and transfer the full balance, including accrued\
    \ interest, to your Nominated Bank Account. \n\nRegulatory Compliance: All changes\
    \ to terms are conducted in strict adherence to the Consumer Duty, ensuring that\
    \ no member is unfairly disadvantaged. Our operations remain under the authority\
    \ of the PRA and regulation by the FCA. For a comprehensive look at our general\
    \ account rules, you may refer to Fernbridge Members' Regular Saver — account\
    \ agreement."
  domain: retail_banking
  product_category: members_regular_saver
  document_type: terms_conditions
  source_authority: official
