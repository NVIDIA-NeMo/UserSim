  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 9dc8569a-5abe-5207-a172-4dcf5703aa5b
  title: Fernbridge First Home Five-Year Fixed Mortgage — access or login problems
  body: 'If you are experiencing difficulties accessing your account details or using
    our secure digital messaging system, please follow these steps to resolve the
    issue.


    Symptom: "I cannot log in to my account" or "My MFA code is not arriving."


    Likely Causes:

    - Outdated browser cache or cookies.

    - Incorrect credentials entered.

    - MFA delivery delays due to network issues.

    - Account lock due to multiple unsuccessful login attempts.


    What to check in order:

    1. Credentials: Ensure you are using the correct member email and password. Remember
    that passwords are case-sensitive.

    2. Connection: Check that your mobile device has a stable signal to receive the
    multi-factor authentication (MFA) code.

    3. Browser: Try clearing your browser cache or accessing the system via a private/incognito
    window to rule out local cookie conflicts.


    How to fix:

    - If you have forgotten your password, use the ''Reset Password'' option. You
    will need to complete our mandatory identity verification process to regain access.

    - If your MFA code is not arriving, wait 60 seconds and request a new code. Ensure
    that the mobile number we have on file is current.


    When to escalate:

    If you have attempted the above steps and still cannot access your account, or
    if you suspect your login credentials have been compromised, let us know immediately.
    We will raise a high-priority case with the Member Relations team. They will perform
    a manual identity verification over the telephone to restore your access. You
    can expect a resolution and a confirmation of account restoration within one business
    day.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: fb7acfc2-3cbc-5ed5-a4a8-3ea096f0957a
  title: Fernbridge First Home Five-Year Fixed Mortgage — qualification tiers
  body: 'The following matrix defines the qualification tiers for the Fernbridge First
    Home Five-Year Fixed Mortgage. Support agents should use these thresholds to determine
    initial eligibility before proceeding to a full affordability assessment.


    | Criterion | Threshold / Requirement | Outcome |

    | :--- | :--- | :--- |

    | Loan-to-Value (LTV) | Up to 95% | Eligible for application |

    | Loan-to-Value (LTV) | Over 95% | Ineligible (Deposit too low) |

    | Home Buyer Status | First-time buyer | Eligible |

    | Home Buyer Status | Existing homeowner | Ineligible (Product specific) |

    | Credit History | Subject to affordability assessment | Pending verification
    |

    | Deposit Source | Verified funds / Gifted deposit | Eligible |


    Note: All eligible candidates must still pass a comprehensive affordability assessment
    to ensure the 6.39% fixed rate is sustainable for their financial circumstances.'
