- id: 1f971305-9a38-573f-af23-641fa373a30b
  title: Fernbridge Easy Access ISA — getting started walkthrough
  body: 'This walkthrough is intended for support agents assisting a member in opening
    a Fernbridge Easy Access ISA. Please follow these steps to ensure a fair outcome
    and adherence to our compliance posture.


    **Step 1: Initial Eligibility and Information**

    Begin by confirming the member''s basic eligibility. Ensure they are a UK resident
    and have not already exhausted their annual ISA allowance of £20,000 with another
    provider for the current tax year. Clearly explain the product''s primary benefit:
    a flexible savings vehicle with a current interest rate of 3.85%.


    **Step 2: Rigorous Identity Verification**

    Before proceeding to account creation, you must perform mandatory identity verification.
    Collect the required government-issued identification and verify the member''s
    address. Ensure the member understands that we employ multi-factor authentication
    (MFA) for all future fund movements and personal detail changes to keep their
    savings secure.


    **Step 3: Setting up the Nominated Bank Account**

    As we do not issue our own current accounts or cards, the member must provide
    a Nominated Bank Account. This is the external current account we will use to
    send funds when the member makes a withdrawal from their ISA.


    **Step 4: Funding the Account**

    Assist the member in making their initial deposit. Remind them that while they
    can save up to £20,000 per tax year, they should be mindful of the upcoming change
    from 6 April 2027, where the allowance for those under 65 will become £12,000.


    **Step 5: Final Confirmation and Disclosure**

    Confirm that the account is active and the 3.85% rate is being applied. Provide
    the member with their account details via secure digital messaging. Remind them
    that their deposits are protected by the FSCS up to £120,000 per person. If the
    member has further questions about how the interest is calculated, you can refer
    them to the Fernbridge Easy Access ISA — interest rate (AER) explained.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 247fe5f7-8a45-5c41-b9e6-ec25134e84a4
  title: Fernbridge Easy Access ISA — cash ISA allowance for under-65s from 6 April
    2027 explained
  body: '**What is the current annual ISA allowance?**

    Currently, members can deposit up to £20,000 into their Fernbridge Easy Access
    ISA within a single tax year without paying tax on the interest earned.


    **How will this change from 6 April 2027?**

    Under proposed regulatory changes, the cash ISA allowance for members under the
    age of 65 will be reduced to £12,000 starting from 6 April 2027.


    **Does this affect my existing savings?**

    No, this change applies only to the amount you can contribute (pay into) the account
    each year from that date onwards. Any funds already held in your Fernbridge Easy
    Access ISA will remain tax-free and will continue to earn interest at the prevailing
    rate, currently 3.85%.


    **Where can I find more information on current allowances?**

    For a detailed breakdown of the current tax year''s limits, please see the Fernbridge
    Easy Access ISA — ISA allowance for the 2026/27 tax year explained.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
