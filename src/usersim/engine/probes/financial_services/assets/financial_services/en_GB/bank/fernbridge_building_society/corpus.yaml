- id: c023eb88-a058-5ad5-9580-ca63f766dc5e
  title: Fernbridge Easy Access Saver — referral and loyalty offer
  body: 'We are pleased to announce a special loyalty and referral window for our
    members. From 1 January 2025 to 31 March 2025, we are inviting our current members
    to introduce friends and family to the mutual benefits of Fernbridge Building
    Society.


    Prospective members who open a Fernbridge Easy Access Saver during this period
    can begin their journey towards financial wellbeing with a minimum opening deposit
    of just £1. All accounts opened under this offer will benefit from our competitive
    interest rate of 3.6%.


    As a member-owned society, we believe that our growth should benefit our community.
    By referring a new member, you are helping us expand our mutual strength, ensuring
    we can continue to provide fair, accessible banking for all. If you or a referred
    friend are looking for a flexible way to grow everyday savings, there is no better
    time to join us.


    This offer is available to UK residents and is subject to our standard identity
    verification processes to ensure the security of all our members'' funds.'
  domain: retail_banking
