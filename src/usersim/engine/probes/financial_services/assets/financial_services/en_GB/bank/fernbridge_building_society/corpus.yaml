  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 58ad323f-c8f1-51dd-bb67-08d4c785c311
  title: Fernbridge Easy Access Saver — a declined or blocked action
  body: "If you have attempted to move funds or update details on your Fernbridge\
    \ Easy Access Saver and the action was declined or blocked, please review the\
    \ following guide.\n\nCommon Symptoms:\n- A request to withdraw funds to your\
    \ Nominated Bank Account is rejected.\n- An attempt to update personal details\
    \ is blocked.\n- You are unable to complete a transfer despite having sufficient\
    \ funds.\n\nLikely Causes and Solutions:\n\n1. Identity Verification Failure:\
    \ The most common cause is an unsuccessful multi-factor authentication (MFA) attempt.\
    \ \n   - Check: Ensure you are using the most recent MFA code sent to your registered\
    \ device.\n   - Fix: Ask us to trigger a new verification code and try the action\
    \ again.\n\n2. Nominated Bank Account Mismatch: If you are attempting to withdraw\
    \ funds to an account that does not match the one we have on file, the action\
    \ will be blocked for your security.\n   - Check: Confirm that the external account\
    \ details are correct.\n   - Fix: If you need to change your Nominated Bank Account,\
    \ you must first complete a full identity re-verification process before the update\
    \ can be authorised.\n\n3. Security Hold: We may temporarily block an action if\
    \ it appears unusual or deviates significantly from your normal banking patterns\
    \ to protect you from fraud.\n   - Fix: We will review the activity. If the action\
    \ was authorised by you, we will lift the hold once your identity is rigorously\
    \ verified.\n\nWhen to Escalate:\nIf the block persists after successful verification,\
    \ we will raise the matter with our Member Relations team for a priority review.\
    \ You will be notified of the outcome, and for payment-related issues, we aim\
    \ to provide a final response within 15 business days."
