    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Buyer Status | Must be a first-time buyer | Required for eligibility |

    | Loan-to-Value (LTV) | Maximum loan amount must be 95% of property value | Required
    for eligibility |

    | Affordability | Must pass our internal affordability assessment | Required for
    approval |

    | Identity | Must complete rigorous identity verification | Required for activation
    |


    If any of the above conditions are not met, we cannot offer this specific product.
    However, we can provide educational information on other options that may better
