- id: 539c8ee0-07cb-592c-b926-195ea1c1d91f
  title: Fernbridge Easy Access Saver — vs. a typical competitor offering
  body: 'When comparing the Fernbridge Easy Access Saver against typical high-street
    bank offerings, the primary differences lie in our mutual structure and our commitment
    to accessibility.


    Dimension | Fernbridge Easy Access Saver | Typical Competitor Offering

    :--- | :--- | :---es

    Interest Rate | 3.6% AER | Often varies; can be higher for limited durations or
    lower for basic accounts

    Opening Deposit | £1 | Frequently higher (e.g., £100 or £1,000)

    Ownership | Member-owned mutual | Shareholder-owned corporation

    Fees | Minimal (cost-recovery only) | May include monthly maintenance or tiered
    fees


    Who should choose Fernbridge?

    Those who prioritise fairness and community-centric banking, as well as first-time
    buyers and small-scale savers who need a low-barrier entry point (£1) and a competitive,
    transparent rate of 3.6%.


    Who might choose a competitor?

    Members who require a fully integrated current account with a debit card, as Fernbridge
    does not issue our own current accounts or cards and requires a Nominated Bank
    Account for all transfers.'
