- id: 2f6d7165-49e9-57d9-9361-95de940e5df2
  title: Fernbridge First Home Five-Year Fixed Mortgage — regulatory disclosures
  body: 'Fernbridge Building Society operates under the authority of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We strictly adhere to the Consumer Duty to ensure that all members receive
    fair outcomes and transparent communication.


    Financial Protection:

    Member deposits are protected by the Financial Services Compensation Scheme (FSCS)
    up to £120,000 per person. Temporary high balances are protected up to £1.4 million
    for a period of six months.


    Cost Disclosures:

    - The Annual Percentage Rate of Charge (APRC) for this product is 7.1%. This figure
    represents the total cost of the loan over its full term, including interest and
    fees, expressed as an annual percentage.

    - The initial fixed rate is 6.39%.

    - Following the five-year fixed term, the loan reverts to the Standard Variable
    Rate (SVR) of 7.24%.

    - An early repayment charge of 5% applies to the outstanding balance if the loan
    is settled or switched in the first year.


    Our commitment to fairness means we perform a full affordability assessment before
    recommending any credit product. We provide guidance to help you make an informed
    choice, but we do not provide individualised tax, legal, or financial planning
    advice. If you feel a dispute has not been resolved to your satisfaction, you
    have the right to escalate the matter to the Financial Ombudsman Service free
    of charge.'
  domain: lending_mortgage
  product_category: first_home_mortgage
  document_type: disclosure
  source_authority: official
  placeholder: true
