- id: 388b8ef8-ef8a-52b3-852b-2b3064afbc22
  title: Fernbridge Members' Regular Saver — maximum monthly payment in explained
  body: 'Q: What is the maximum I can deposit into my Fernbridge Members'' Regular
    Saver each month?

    A: The maximum monthly deposit is £250. This limit is in place to ensure the product
    remains accessible and fair for all our members.


    Q: What happens if I accidentally try to deposit more than £250 in one month?

    A: If a deposit exceeds the £250 limit, the transaction will be declined. The
    funds will remain in (or be returned to) your Nominated Bank Account. We recommend
    setting up a standing order for exactly £250 to avoid any payment failures.


    Q: Can I ''catch up'' on missed deposits by paying more in the following month?

    A: No. The £250 limit is a strict monthly cap. You cannot combine multiple months''
    worth of savings into a single payment. To maximise your earnings at the 6.5%
    interest rate, we encourage consistent monthly contributions.


    For further details on the account duration, please refer to Fernbridge Members''
    Regular Saver — term (months) explained.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: faq
  source_authority: official
