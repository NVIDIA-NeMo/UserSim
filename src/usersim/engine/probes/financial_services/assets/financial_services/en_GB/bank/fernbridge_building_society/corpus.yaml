  institution_id: fernbridge_building_society
- id: 0f82cbb4-60dc-555d-92fe-f3c60ccc7a23
  title: Fernbridge Easy Access Saver — cost and charges
  body: 'Q: Are there any monthly fees for maintaining a Fernbridge Easy Access Saver?


    A: No. In line with our fee philosophy, we do not charge monthly maintenance fees
    for this account. We keep our pricing transparent and only apply charges where
    they are necessary to cover direct operational costs.


    Q: Is there a charge to open the account?


    A: There is no product fee to open the Fernbridge Easy Access Saver. To get started,
    you only need to provide the minimum opening deposit of £1.


    Q: Will I be charged for withdrawing my own money?


    A: We do not charge fees for standard withdrawals to your Nominated Bank Account.
    We aim to ensure that your savings remain accessible to you without unfair barriers.


    For a complete list of all potential operational charges, please refer to Fernbridge
    Easy Access Saver — fee schedule.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 4ebbfb75-e197-5fa1-8d23-6ee3298add61
  title: Fernbridge Easy Access Saver — make a change or update
  body: 'Whether you have moved house or changed your external banking provider, keeping
    your details current ensures your funds remain secure and accessible. Follow these
    steps to update your account information.


    What you will need:

    - Your Fernbridge membership number.

    - The new details you wish to register (e.g., new address or new bank account
    details).

    - Access to your MFA device.


    Step 1: Request the update

    Tell us which specific detail you wish to change. For example, if you have changed
    the current account where you receive your funds, tell us you need to update your
    Nominated Bank Account.


    Step 2: Identity verification

    Because changing account details is a state-changing action, we must perform rigorous
    identity verification. We will ask you to complete an MFA challenge. You will
    receive a code on your registered device; please provide this code to us to confirm
    you are the account holder.


    Step 3: Provide new details

    Provide the new information. If updating a Nominated Bank Account, you will need
    to provide the sort code and account number of the external account. We will verify
    that this account is held in your name to prevent fraud.


    Step 4: Confirmation

    We will process the change and send a confirmation message via our secure digital
    messaging service. You will know the update was successful when you receive this
    notification and can see the updated details in your account summary.


    If you have any issues during this process, please refer to Fernbridge Easy Access
    Saver — access or login problems.'
  domain: retail_banking
  product_category: easy_access_saver
  document_type: how_to_guide
  source_authority: official
