  institution_id: fernbridge_building_society
- id: 96f99206-51cb-5a3d-b897-6d328b2b3fb0
  title: Fernbridge Easy Access ISA — a discrepancy in your records or statement
  body: "This guide is for support agents assisting members who believe there is an\
    \ error in their Fernbridge Easy Access ISA statements or interest calculations.\n\
    \nSymptom:\n- The member claims the interest paid is lower than expected based\
    \ on the 3.85% rate.\n- A deposit or withdrawal is missing from the transaction\
    \ history.\n- The balance shown does not align with the member's own records.\n\
    \nLikely Causes and What to Check:\n\n1. AER Compounding Misunderstanding: Members\
    \ may calculate interest as a simple flat percentage of the opening balance. Remind\
    \ the member that the 3.85% is an Annual Equivalent Rate (AER), which accounts\
    \ for how interest is compounded over the year.\n2. Timing of Deposits: Check\
    \ the exact date funds arrived from the Nominated Bank Account. Interest is calculated\
    \ daily; funds that arrived mid-month will not earn a full month of interest.\n\
    3. Pending Transactions: Ensure there are no pending transfers that have not yet\
    \ been posted to the statement.\n\nHow to resolve the issue:\n- Provide a detailed\
    \ breakdown of the daily interest accrual for the period in question to demonstrate\
    \ how the 3.85% rate was applied.\n- Cross-reference the transaction history with\
    \ the logs from the Nominated Bank Account to identify any missing entries.\n\n\
    When to escalate:\n- If the discrepancy cannot be resolved through calculation\
    \ reviews or if a transaction is genuinely missing, the matter must be escalated\
    \ to the Member Relations team. \n- For discrepancies related to payment services\
    \ (missing transfers), we aim to provide a final response within 15 business days.\n\
    - For other general record disputes, we will provide a final response within eight\
    \ weeks. \n- Always inform the member that if they remain dissatisfied with the\
    \ final response, they have the right to escalate the dispute to the Financial\
    \ Ombudsman Service free of charge."
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
