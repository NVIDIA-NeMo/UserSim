- id: f8ea2c98-08db-5d0c-9f5b-bd76df9b94d0
  title: Fernbridge One-Year Fixed Rate Bond — eligibility requirements
  body: 'To ensure fair outcomes for all our members, the following eligibility criteria
    apply to the Fernbridge One-Year Fixed Rate Bond:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Membership Status | Must be a member of Fernbridge Building Society | Eligible
    to apply |

    | Minimum Deposit | Deposit amount is £1,000 or greater | Eligible to open account
    |

    | Minimum Deposit | Deposit amount is less than £1,000 | Ineligible (Please see
    Fernbridge Easy Access Saver — overview) |

    | Identity Verification | Successfully passes multi-factor authentication and
    ID checks | Account Activation |

    | Identity Verification | Fails to provide mandatory identity documentation |
    Application Declined |

    | Residency | Must be a UK resident | Eligible to apply |'
  domain: retail_banking
