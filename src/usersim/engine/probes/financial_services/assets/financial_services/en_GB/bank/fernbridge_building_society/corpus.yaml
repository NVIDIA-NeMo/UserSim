- id: 5762b575-aa0d-556f-983b-3bd71e0891f6
  title: Fernbridge One-Year Fixed Rate Bond — choosing between tiers or options
  body: 'Deciding where to place your savings depends on when you need your money
    and how much growth you require. Here is how the Fernbridge One-Year Fixed Rate
    Bond compares to our more flexible options.


    **Fernbridge One-Year Fixed Rate Bond**

    - **Return:** A guaranteed interest rate of 4.45%.

    - **Access:** Funds are locked for a 12-month term.

    - **Requirement:** A minimum deposit of £1,000.

    - **Best for:** Disciplined savers who have a lump sum they do not need for a
    year and want a secure, higher yield.


    **Fernbridge Easy Access Saver**

    - **Return:** A variable rate that may change over time.

    - **Access:** High flexibility; funds can be withdrawn as needed.

    - **Requirement:** Lower barrier to entry for everyday savings.

    - **Best for:** Those building an emergency fund or who may need their money on
    short notice.


    If you can commit to the 12-month term and meet the £1,000 minimum, the Fixed
    Rate Bond is the superior choice for maximising your interest. However, if you
    value liquidity over a higher rate, the Easy Access Saver is the better option.
    For more details, see Fernbridge Easy Access Saver — overview.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: e68606ec-2062-533d-a889-0746d50d7633
  title: Fernbridge One-Year Fixed Rate Bond — privacy and data handling
  body: 'Fernbridge Building Society is committed to the transparent and ethical handling
    of your personal and financial data. As a member-owned mutual, we treat your information
    with the respect and care that our community deserves.


    **Data Collection and Use**

    To provide the Fernbridge One-Year Fixed Rate Bond, we collect essential information,
    including your identity documents, contact details, and Nominated Bank Account
    information. This data is used solely for the administration of your account,
    the payment of your 4.45% interest, and to comply with our legal obligations under
    the authority of the PRA and regulation by the FCA.


    **Security Measures**

    We employ rigorous identity verification and multi-factor authentication to ensure
    that your data is only accessed by you and authorised Fernbridge staff. We do
    not sell your data to third parties, nor do we use your financial information
    for unsolicited marketing.


    **Regulatory Compliance and Consumer Duty**

    In accordance with the Consumer Duty, we ensure that our data handling processes
    lead to fair outcomes for all members. We provide clear, plain-English explanations
    of how your data is used and allow you to update your information via our secure
    digital messaging service.


    **Protection of Funds**

    While this disclosure focuses on data, we remind members that their financial
    security is further bolstered by the FSCS, which protects deposits up to £120,000
    per person (and temporary high balances up to £1.4 million for six months).


    **Your Rights**

    Members have the right to request a copy of the data we hold about them and to
    request corrections to any inaccurate information. These requests should be made
    through our secure channels and will be handled with urgency and fairness. For
    more information on our general terms, please see Fernbridge One-Year Fixed Rate
    Bond — account agreement.'
  domain: retail_banking
  product_category: fixed_rate_bond
