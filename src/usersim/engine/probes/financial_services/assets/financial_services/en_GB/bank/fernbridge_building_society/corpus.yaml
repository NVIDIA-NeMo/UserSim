- id: 1a821c66-2705-5a52-af82-a142ece4def9
  title: Fernbridge Cash Lifetime ISA — a failed or pending action
  body: 'If you encounter an issue where a deposit or an account action appears to
    be failed or pending, please review the following common causes and solutions:


    Symptom: Deposit payment has failed or is showing as pending.


    1. Check Annual Limit: Verify if the deposit would push your total yearly contributions
    over the annual limit of £4,000. If the limit has been exceeded, the transaction
    will be declined.

    2. Verify Nominated Bank Account: Ensure that the funds are being sent from the
    Nominated Bank Account registered to your profile. For security, we cannot accept
    transfers from third-party accounts.

    3. Multi-Factor Authentication (MFA): Ensure you have completed the MFA prompt
    on your device. Fund movements cannot be authorised without this security step.

    4. Check Balance: Confirm that the sending account has sufficient funds to cover
    the transfer.


    Symptom: Application to open an account is pending.


    1. Identity Documents: Check if we have requested additional clarification regarding
    your photo ID or proof of address.

    2. Age Verification: Ensure your provided date of birth confirms you are within
    the maximum opening age of 39.


    If the issue persists after these checks, we will escalate the matter to our Member
    Relations team for a detailed investigation. We aim to resolve these discrepancies
    and provide a final response within 15 business days for payment-related issues.
    You will be notified via secure digital messaging once the resolution is complete.'
