- id: 2f7c11cb-1224-516c-af38-5bb9755d66ba
  title: Fernbridge Members' Regular Saver — recognising scams targeting this product
  body: 'As a member-owned mutual, Fernbridge Building Society is committed to the
    financial wellbeing of our members. Because the Fernbridge Members'' Regular Saver
    offers a competitive interest rate of 6.5%, it can unfortunately be used as a
    lure by fraudsters attempting to deceive people into sharing their personal details
    or transferring funds to fraudulent accounts.


    Common scam patterns targeting this product include ''exclusive'' offers promising
    interest rates significantly higher than 6.5%, or urgent messages claiming your
    account is suspended and requiring an immediate ''verification payment'' to reactivate
    it. Please be aware that we will never ask you to move your money to a ''safe
    account'' or request your full security credentials via email or text message.


    We employ rigorous identity verification and multi-factor authentication to ensure
    that all fund movements and changes to personal details are authorised by the
    account holder. If you receive a communication that asks you to bypass these security
    measures or provides a bank account that is not clearly identified as Fernbridge
    Building Society, treat it with extreme caution.


    If you notice any suspicious activity or believe you have been targeted by a scam,
    your first action should be to inform us immediately via telephone or secure digital
    messaging. The speed of your report is critical; early notification allows us
    to act quickly to protect your funds and secure your account. We treat all reports
    of fraud with urgency and fairness to ensure the best possible outcome for our
    members.


    For further information on how we keep your account safe, you may wish to refer
    to Fernbridge Members'' Regular Saver — fraud and unauthorised-activity protection.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: 2583c345-491a-5702-96b4-42f3a3301346
  title: Fernbridge Members' Regular Saver — limits, restrictions, and edge cases
  body: 'The Fernbridge Members'' Regular Saver is designed as a high-interest incentive
    to reward members for consistent monthly saving. To ensure fairness and accessibility
    for all our members, we apply specific limits and restrictions to this account.


    Monthly Deposit Limit

    The most significant restriction is the maximum monthly deposit of £250. This
    limit is a hard cap; we cannot accept deposits exceeding £250 in any single calendar
    month. If a member attempts to transfer more than this amount from their Nominated
    Bank Account, the excess may be rejected by our systems to ensure the account
    remains within its defined parameters.


    Account Term

    This product has a fixed term of 12 months. The 6.5% interest rate is applicable
    throughout this duration, provided the account remains open. It is important to
    note that this is a disciplined saving vehicle, and the primary goal is to maintain
    contributions throughout the 12 month period.


    Edge Cases and Restrictions

    • Missed Payments: While we encourage consistency, missing a monthly deposit does
    not result in a fee, but it does mean you miss out on the 6.5% interest that would
    have been earned on those funds.

    • Early Closure: Closing the account before the 12 month term ends may impact
    the interest earned. Members should review their specific terms for the exact
    impact of early withdrawal.

    • Funding Source: All deposits must originate from the member''s Nominated Bank
    Account. We do not accept cash deposits or transfers from third-party accounts
    to prevent fraud and ensure regulatory compliance.


    By adhering to these limits, we can maintain a sustainable and fair rate for our
    entire membership community. For a broader overview of the product''s features,
    please see Fernbridge Members'' Regular Saver — overview.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: b46a361d-8635-57cc-a255-b49b59037f6a
  title: Fernbridge Members' Regular Saver — cost and charges
  body: 'Q: Are there any monthly fees for maintaining a Fernbridge Members'' Regular
    Saver account?


    A: No. In line with our fee philosophy, we maintain a transparent pricing structure
    where fees are kept to a minimum. There are no monthly maintenance fees or account
    management charges for this product.


    Q: Is there a fee to open the account or a product fee associated with it?


    A: There is no fee to open a Fernbridge Members'' Regular Saver. We believe in
    removing barriers to disciplined saving, ensuring that every member can benefit
    from our 6.5% interest rate without upfront costs.


    Q: Will I be charged if I fail to make a monthly deposit?


    A: We do not apply penalties or fees for missed deposits. However, you will only
    earn interest on the funds actually held in the account. For more details on how
    the account operates, please refer to Fernbridge Members'' Regular Saver — overview.'
  domain: retail_banking
  product_category: members_regular_saver
  document_type: faq
