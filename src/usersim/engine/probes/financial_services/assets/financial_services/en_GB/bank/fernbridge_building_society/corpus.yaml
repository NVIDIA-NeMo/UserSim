  institution_id: fernbridge_building_society
- id: f3d4c568-ffd4-52cd-9252-eb2939a95c8c
  title: Fernbridge Cash Lifetime ISA — overview
  body: 'The Fernbridge Cash Lifetime ISA is a specialist savings account designed
    to help first-time buyers and those planning for retirement build a substantial
    nest egg. As a member-owned mutual, we provide this account to ensure the financial
    wellbeing of our members by combining competitive interest with a significant
    government incentive.


    Key Benefits and Features:

    - Government Bonus: Every pound you save is boosted by a 25% government bonus,
    helping your savings grow much faster than in a standard account.

    - Competitive Returns: Your balance earns a steady interest rate of 3.75%.

    - First Home Support: This account is specifically engineered for those buying
    their first home, provided the property price does not exceed the property price
    cap of £450,000.


    Account Limits and Requirements:

    - Annual Deposit Limit: You can save up to a maximum of £4,000 each tax year.
    This £4,000 limit applies to your total Lifetime ISA contributions across all
    providers.

    - Eligibility Age: To open this account, you must be within the maximum opening
    age of 39.


    Important Considerations:

    While the Fernbridge Cash Lifetime ISA is a powerful tool for long-term goals,
    it is less flexible than our other savings options. If you withdraw funds for
    any reason other than buying your first qualifying home or reaching retirement
    age, a withdrawal charge of 25% will be applied. This charge can result in you
    receiving less than your original deposit, so we encourage members to save only
    what they are confident they will not need for other purposes.


    For a full list of costs associated with this account, please refer to the Fernbridge
    Cash Lifetime ISA — fee schedule.'
  domain: retail_banking
  product_category: cash_lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: fernbridge_building_society
- id: dae86739-519b-57a5-8611-449eeb66c37e
  title: Fernbridge Cash Lifetime ISA — interest rate (AER) explained
  body: 'How is the interest on my Fernbridge Cash Lifetime ISA calculated?

    We apply a flat interest rate of 3.75% to your balance. This is quoted as an Annual
    Equivalent Rate (AER), which is a standardised way of showing what your interest
    rate would be if the interest was paid and compounded each year. This allows you
    to compare our rates fairly with other accounts.


    Does the government bonus affect my interest rate?

    No, the interest rate of 3.75% is separate from the government incentive. You
    earn interest on your own contributions and on the 25% government bonus that has
    been credited to your account.


    Will the interest rate change?

    As a mutual, we strive for fairness and transparency. While the current rate is
    3.75%, we may adjust this in response to changes in the wider economic environment.
    We will always notify you of any changes to your rate in advance.'
