- id: 12410087-199b-5675-8a4c-598416082476
  title: Fernbridge Easy Access ISA — how rates are tiered and applied
  body: 'This rate sheet provides the technical application of interest for the Fernbridge
    Easy Access ISA. This information is intended for support agents to ensure consistent
    communication with members.


    **Interest Rate Structure**

    The Fernbridge Easy Access ISA employs a flat-rate structure. There are no balance
    tiers; the same rate applies to all balances from the first pound up to the maximum
    allowed by the ISA regulations.


    *   **Current Annual Rate:** 3.85%


    **Application and Crediting**

    *   **Calculation:** Interest is calculated daily based on the end-of-day balance
    of the account.

    *   **AER:** The rate is quoted as an Annual Equivalent Rate (AER), which shows
    what the interest rate would be if interest was paid and compounded each year.

    *   **Crediting:** Interest is credited to the account periodically. Once credited,
    this interest forms part of the balance and earns further interest.


    **Factors Influencing the Rate**

    As a variable rate product, the 3.85% figure is subject to change. Adjustments
    are made by the society in response to Bank of England base rate changes or shifts
    in our mutual funding requirements. Members are notified of any rate changes via
    their preferred communication channel.'
  domain: retail_banking
  product_category: cash_isa
  document_type: rate_sheet
  source_authority: official
