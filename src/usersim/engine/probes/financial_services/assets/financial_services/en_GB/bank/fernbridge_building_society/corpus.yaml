- id: 357323f7-ae0f-5d9c-a7e8-3c277c3f442f
  title: Fernbridge Easy Access ISA — check status or history
  body: 'If you are an existing member and wish to review the current balance of your
    Fernbridge Easy Access ISA or examine your transaction history, please follow
    these steps.


    What you need before starting:

    - Your membership number.

    - Access to the device associated with your multi-factor authentication (MFA).


    Steps to check your status:


    1. Request your account details: Tell us that you would like to check the current
    balance or the transaction history for your Fernbridge Easy Access ISA. You can
    do this via telephone or secure digital messaging during UK business hours.

    2. Complete identity verification: We will perform a mandatory security check.
    This involves verifying your personal details and completing a multi-factor authentication
    challenge to ensure your account information is disclosed only to you.

    3. Specify the information required: Confirm whether you need the current available
    balance, the total interest earned at the current rate of 3.85%, or a full list
    of deposits and withdrawals for a specific period.

    4. Receive the information: We will then provide the requested figures or send
    a formal statement to your registered address or secure digital inbox.


    How you know it worked:

    - You will have received a clear statement of your balance or a detailed history
    of your account movements. If you requested a statement, you will receive a confirmation
    message once the document has been dispatched to you.


    If you notice any errors in the history provided, you can follow the steps outlined
    in Fernbridge Easy Access ISA — a discrepancy in your records or statement.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
  source_authority: official
