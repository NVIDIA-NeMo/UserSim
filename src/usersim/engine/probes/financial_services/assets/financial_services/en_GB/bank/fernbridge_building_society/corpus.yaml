- id: 4c9bc367-570a-589e-ab22-448481918c51
  title: Fernbridge One-Year Fixed Rate Bond — regulatory disclosures
  body: 'Fernbridge Building Society operates under the authority of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We strictly adhere to the Consumer Duty to ensure that all members receive
    fair outcomes and transparent communication.


    **Deposit Protection**

    All member deposits held within the Fernbridge One-Year Fixed Rate Bond are protected
    by the Financial Services Compensation Scheme (FSCS). This protection covers up
    to £120,000 per person. In the event of temporary high balances (such as a property
    sale), protection is extended up to £1.4 million for a period of six months.


    **Product Terms**

    This bond carries a fixed term of 12 months. By opening this account, the member
    agrees to commit the funds for the full duration to secure the 4.45% AER. Early
    withdrawal may be subject to restrictions or loss of interest; members are encouraged
    to review the full account agreement before depositing.


    **Advice Boundaries**

    We provide educational information regarding our product suite to help you make
    informed choices. Please note that Fernbridge Building Society does not provide
    individualised tax, legal, or financial planning advice. For specific guidance
    on how this bond fits into your overall tax position, we recommend consulting
    a qualified professional.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: disclosure
  source_authority: official
