- id: 8322af98-8c08-5e13-bec4-c20837910815
  title: Fernbridge Cash Lifetime ISA — current offer
  body: 'We are pleased to announce our current rate offering for the Fernbridge Cash
    Lifetime ISA, designed to support our members'' dreams of home ownership.


    Offer Period:

    This rate is guaranteed for all qualifying deposits made between 1 April 2024
    and 31 March 2025.


    Featured Rate:

    - Interest Rate (AER): 3.75%


    Combined with the 25% government bonus on contributions up to the annual limit
    of £4,000, this offer provides one of the most efficient ways to save for a first
    home. We invite our existing members to review their savings strategy to ensure
    they are maximising this incentive before the current tax year concludes.


    To make a contribution or check your remaining annual allowance, please message
    us via your secure digital portal.'
