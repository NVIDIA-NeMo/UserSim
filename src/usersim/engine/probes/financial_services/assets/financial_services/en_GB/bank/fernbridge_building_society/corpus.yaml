- id: a42c8252-9cc3-5362-81ba-2cca5873a831
  title: Fernbridge One-Year Fixed Rate Bond — cost and charges
  body: '**Are there any fees to open a Fernbridge One-Year Fixed Rate Bond?**

    No. In line with our fee philosophy, we keep costs to a minimum to ensure our
    members benefit most from their savings. There is no fee to open this account.


    **Is there a monthly maintenance charge?**

    We do not apply any monthly or annual maintenance fees to the Fernbridge One-Year
    Fixed Rate Bond. The only ''cost'' associated with this product is the opportunity
    cost of locking away your funds for 12 months.


    **Are there charges for withdrawing my money?**

    This bond is designed for those who can commit their funds for the full 12-month
    term to earn a rate of 4.45%. Withdrawing funds before the term ends may result
    in an early closure charge or a reduction in the interest earned. We recommend
    reviewing the Fernbridge One-Year Fixed Rate Bond — account agreement for full
    details on early withdrawal terms.'
  domain: retail_banking
  product_category: fixed_rate_bond
  document_type: faq
  source_authority: official
