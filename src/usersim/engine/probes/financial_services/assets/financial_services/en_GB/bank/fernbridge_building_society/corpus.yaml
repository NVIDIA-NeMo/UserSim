- id: 6dade3a2-9268-54b2-a040-cc71bead6818
  title: Fernbridge Members' Regular Saver — check status or history
  body: 'Monitoring your progress towards your saving goals is a key part of using
    the Fernbridge Members'' Regular Saver. Whether you want to verify that your most
    recent deposit was successful or check how much interest has accrued at the 6.5%
    rate, follow these steps:


    1. Request an account summary: Let us know that you would like to check the status
    or transaction history of your Regular Saver account. You can do this via secure
    digital messaging or by speaking with us over the phone.


    2. Complete identity verification: For your security, we will perform a mandatory
    identity verification. This will include multi-factor authentication to ensure
    that your account information is only disclosed to you.


    3. Specify the timeframe: Tell us if you require a snapshot of your current balance
    or a detailed history of deposits for the current 12 month term. For example,
    you may wish to see all deposits made since the account was opened to ensure they
    are all within the £250 monthly limit.


    4. Receive your details: We will then provide your current balance, the total
    interest earned to date, and a list of your recent deposits from your Nominated
    Bank Account.


    5. Confirm the details: Review the information provided. If you see any transactions
    that you do not recognise or if the balance does not align with your own records,
    let us know immediately so we can investigate.


    By regularly checking your status, you can ensure your disciplined saving habit
    is on track to reach the end of its 12 month term successfully. If you notice
    any discrepancies, you may refer to Fernbridge Members'' Regular Saver — a discrepancy
    in your records or statement for a resolution path.'
  domain: retail_banking
  product_category: members_regular_saver
