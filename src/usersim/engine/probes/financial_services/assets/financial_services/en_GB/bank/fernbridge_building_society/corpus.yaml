- id: ce7a5113-18f3-5e06-a7b3-92ce07a04447
  title: Fernbridge One-Year Fixed Rate Bond — check status or history
  body: "If you are an existing member with a Fernbridge One-Year Fixed Rate Bond,\
    \ you can easily check your balance, the interest you have earned, and your maturity\
    \ date through our support channels.\n\nTo check your bond's status, please follow\
    \ these steps:\n\n1. Tell us that you would like a status update or a history\
    \ report for your Fernbridge One-Year Fixed Rate Bond. \n2. Complete our rigorous\
    \ identity verification process. This will involve multi-factor authentication\
    \ to ensure your personal details are protected.\n3. Specify whether you require\
    \ a current balance summary or a detailed history of the interest credited to\
    \ your account since the opening date.\n4. We will then provide you with the following\
    \ details:\n    - Your current total balance (including the initial £1,000 minimum\
    \ deposit and any subsequent interest).\n    - The total interest accrued at the\
    \ 4.45% rate.\n    - The exact date your 12-month term expires (the maturity date).\n\
    \nOnce we have confirmed these details, we will ask if you would like a formal\
    \ statement sent to your registered contact address or via secure digital messaging.\
    \ You will know the process is complete when you receive the confirmation of your\
    \ balance and maturity date during the conversation or via your preferred delivery\
    \ method.\n\nIf you notice any unexpected figures in your history, you may find\
    \ it helpful to refer to Fernbridge One-Year Fixed Rate Bond — a discrepancy in\
    \ your records or statement."
  domain: retail_banking
