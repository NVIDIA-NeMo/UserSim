- id: 51b5f075-9d12-52d0-9e05-b0e4a014a8f4
  title: Wrenfield Easy Access Cash ISA — a discrepancy in your records or statement
  body: 'If you believe there is an error in your account balance or the interest
    credited to your Wrenfield Easy Access Cash ISA, we will work with you to resolve
    it quickly and transparently.


    **The Symptom**

    You notice that the interest paid into your account does not match your own calculations,
    or a transaction appears on your statement that you do not recognise.


    **Likely Causes**

    - **Calculation Timing:** Interest is calculated daily and credited periodically.
    If you have made recent large deposits or withdrawals, the interest amount may
    fluctuate as the balance changes.

    - **Rate Misunderstanding:** You may be calculating interest based on a different
    rate, whereas the Wrenfield Easy Access Cash ISA applies a steady rate of 2.85%.

    - **Processing Lag:** In rare instances, a transaction may take a short time to
    appear on a statement, creating a temporary discrepancy between your records and
    ours.


    **What to check in order**

    1. **Verify the rate:** Confirm that your calculations are based on the correct
    interest rate of 2.85%.

    2. **Review transaction dates:** Check the exact dates of your deposits and withdrawals
    to ensure the interest was calculated on the correct daily balance.

    3. **Cross-reference statements:** Compare your personal records against the official
    transaction history provided by us to identify the specific missing or extra entry.


    **The Fix**

    - **If it is a calculation error:** We will perform a full audit of the interest
    credited. If an underpayment is found, we will apply a correction to your balance
    immediately.

    - **If it is an unknown transaction:** We will initiate a formal investigation.
    As part of our ''verify-first'' stance, we will review the authentication used
    for that transaction.

    - **If it is a processing lag:** We will provide you with the current real-time
    balance to confirm that the funds are present, even if the statement has not yet
    updated.


    **When to escalate**

    If we cannot resolve the discrepancy during the initial conversation, we will
    route the issue to our senior management for a detailed review. We aim to provide
    a final response for all disputes within eight weeks.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7b345afd-2500-5b24-868d-2f4923113828
  title: Wrenfield Rewards Credit Card — overview
  body: 'Welcome to the Wrenfield Rewards Credit Card, a dependable financial tool
    designed to offer you flexibility and rewards for your everyday spending. We believe
    in transparency and stability, ensuring that you have a clear understanding of
    the costs and benefits associated with your account.


    This card is ideal for customers who want a rewards-focused experience backed
    by the security of a high-street institution. Every account includes Section 75
    protection, meaning we are jointly liable with the retailer for purchases between
    £100 and £30,000, providing you with an essential layer of security for larger
    spends.


    Key Financial Details:

    - Representative APR: 24.9%

    - Assumed Credit Limit: £1,200

    - Foreign Transaction Fee: 2.99% (applied to all spending in non-sterling currencies)

    - Balance Transfer Fee: 3.49%

    - Balance Transfer Duration: 24 months


    We operate under the strict authorisation of the PRA and regulation by the FCA,
    and we are committed to the Consumer Duty to ensure you are treated fairly. Your
    deposits and funds are protected by the FSCS up to £120,000 per person, with temporary
    high balances protected up to £1.4 million. All lending is subject to a strict
    affordability assessment to avoid foreseeable harm and ensure the borrowing remains
    sustainable for you.


    Whether you are using the card for daily rewards or managing a balance transfer
    over 24 months, we provide a professional and welcoming service through our branch
    network, telephone banking, and digital channels during standard UK business hours.'
  domain: cards
  product_category: credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: bd466ad6-88ef-5aae-ac33-a341652be667
  title: Wrenfield Rewards Credit Card — representative APR explained
  body: 'Q: What does the representative APR of 24.9% actually mean for my account?


    A: The Representative APR (Annual Percentage Rate) is a standard way of showing
    the cost of borrowing. For the Wrenfield Rewards Credit Card, the representative
    APR is 24.9%. This means that we must be able to offer this specific rate to at
    least 51% of the customers who are accepted for the product. Depending on your
    individual credit profile and our affordability assessment, your personal rate
    may be higher or lower than this figure.


    Q: How is this different from a fixed rate?


    A: Unlike a fixed-rate product, the representative APR serves as a benchmark for
    the majority of successful applicants. We use this transparency to ensure you
    can compare our products fairly against others in the market. For further details
    on how we price our credit products, you may refer to the Wrenfield Rewards Credit
    Card — interest rate / AER schedule.'
  domain: cards
  product_category: credit_card
