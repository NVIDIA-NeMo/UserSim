- id: 4857301b-2818-5992-9fd1-074165cc623f
  title: Wrenfield Everyday Saver — choosing between tiers or options
  body: 'When choosing how to save with us, the decision typically depends on whether
    you value total flexibility or a higher return for disciplined saving.


    **Wrenfield Everyday Saver**

    - **Interest Rate:** 2.1%

    - **Opening Deposit:** £1

    - **Access:** Fully flexible; no restrictions on withdrawals.

    - **Best for:** Those who want a dependable place for emergency funds or a low-barrier
    entry into saving.


    **Wrenfield Regular Saver**

    - **Interest Rate:** Higher than the Everyday Saver (refer to its specific rate
    sheet).

    - **Deposit Limit:** Maximum monthly deposit of £300.

    - **Access:** Designed for short-term goal saving rather than instant flexibility.

    - **Best for:** Those who can commit to a monthly saving habit in exchange for
    a better rate.


    **Which should you choose?**

    If you need to be able to withdraw your money at any moment without restriction
    and want to start with as little as £1, the **Wrenfield Everyday Saver** is the
    correct choice. If you have a steady monthly surplus of up to £300 and are saving
    for a specific future date, the **Wrenfield Regular Saver** will offer a more
    rewarding return.


    For more on how these differ from tax-efficient options, see Wrenfield Easy Access
    Cash ISA — overview.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: cf03c7a1-68a4-5414-a995-24ee3c834675
  title: Wrenfield Everyday Saver — privacy and data handling
  body: 'Wrenfield Bank is committed to the highest standards of data privacy and
    the protection of your personal information. This disclosure explains how we handle
    your data in relation to your Wrenfield Everyday Saver account.


    **Data Collection and Purpose**

    We collect and process personal data—including your name, address, date of birth,
    and financial history—to maintain your account, calculate your 2.1% interest,
    and comply with our legal obligations. Our ''verify-first'' security stance requires
    us to collect and store robust identity documentation to prevent fraud and unauthorised
    access to your assets.


    **Regulatory Compliance**

    We operate under the strict authorisation of the PRA and regulation by the FCA.
    This ensures that your data is handled according to the Consumer Duty, meaning
    we act to deliver good outcomes for retail customers. We maintain rigorous controls
    to ensure that your personal information is only accessed by authorised personnel
    during standard UK business hours.


    **Data Sharing**

    We do not sell your data to third parties. We only share information with external
    bodies when required by law, such as for tax reporting purposes or when requested
    by a regulatory authority during a formal investigation. We may also share data
    with the FSCS to ensure your deposits—up to £120,000 per person and temporary
    high balances up to £1.4 million—are correctly protected.


    **Your Rights**

    Under UK data protection laws, you have the right to request access to the personal
    data we hold about you, to request corrections to inaccurate data, and in certain
    circumstances, to request the deletion of your data. Please note that as a regulated
    financial institution, we are required to retain certain records for a minimum
    statutory period, even after an account is closed.


    For further information on the risks associated with your account, please see
    Wrenfield Everyday Saver — risk disclosures.'
  domain: retail_banking
  product_category: everyday_saver
