- id: 5ce84de0-5178-5361-b4b9-65df22b03c35
  title: Wrenfield Current Account — fraud and unauthorised-activity protection
  body: 'At Wrenfield Bank, the security of your assets is our primary concern. We
    maintain a rigorous ''verify-first'' stance, meaning we require full identity
    authentication before any state-changing action is taken or any account information
    is disclosed. This discipline ensures that your funds remain protected from unauthorised
    access.


    Customers should be particularly vigilant against Authorised Push Payment (APP)
    scams, where fraudsters trick you into sending money to an account they control.
    We proactively support victims of APP scams and work quickly to mitigate losses.
    Please remember that Wrenfield Bank will never ask you to move your money to a
    ''safe account'' or request your full security credentials via text or email.


    To provide peace of mind, we operate under the strict authorisation of the Prudential
    Regulation Authority (PRA) and are regulated by the Financial Conduct Authority
    (FCA). This ensures all our customers are treated fairly and according to the
    highest regulatory standards. Furthermore, your deposits are protected by the
    Financial Services Compensation Scheme (FSCS). Eligible deposits are protected
    up to £120,000 per person. In specific circumstances involving temporary high
    balances, this protection extends up to £1.4 million.


    If you notice any activity on your Wrenfield Current Account that you do not recognise,
    you must report it to us immediately. Rapid reporting is essential for the recovery
    of funds and the limitation of liability. For payment service complaints, we aim
    to provide a final response within 15 business days. For other types of disputes,
    we will provide a resolution within eight weeks. If we are unable to resolve the
    matter to your satisfaction, you have the right to escalate the issue to the Financial
    Ombudsman Service.


    For more details on how we keep your money safe, you may wish to review Wrenfield
    Current Account — account security best practices.'
  domain: retail_banking
  product_category: current_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 77f8ba9c-e1b0-5f3f-ab3d-b0d0abd26b75
  title: Wrenfield Current Account — account agreement
  body: 'This agreement sets out the terms and conditions governing the use of the
    Wrenfield Current Account. This contract is between Wrenfield Bank (''we'', ''us'')
    and the account holder (''you'').


    1. Account Fees and Costs

    We are committed to accessible banking. The Wrenfield Current Account carries
    a £0 monthly account fee. We reserve the right to review this fee structure, subject
    to providing you with the required regulatory notice period.


    2. Overdraft Facilities

    If you are granted an arranged overdraft, interest will be charged on the outstanding
    balance at a variable rate of 39.9%. This interest is calculated daily and applied
    monthly to the account. We may vary this rate in accordance with market conditions
    and regulatory risk, notifying you of any changes in advance.


    3. Obligations of the Account Holder

    You agree to provide accurate and up-to-date information for identity verification.
    You must notify us immediately of any lost or stolen debit cards or any suspected
    unauthorised activity. You are responsible for maintaining the security of your
    access credentials.


    4. Our Obligations

    We will operate your account in accordance with the Consumer Duty, ensuring you
    are treated fairly. We honour the Direct Debit Guarantee, providing immediate
    refunds for any errors made in the collection of Direct Debit payments.


    5. Termination and Closure

    Either party may terminate this agreement at any time. To close the account, you
    must ensure all outstanding balances, including any interest accrued on an arranged
    overdraft at 39.9%, are settled in full. We will provide a final statement and
    return any remaining credit to your nominated external account.


    6. Regulatory Framework

    This account is protected by the FSCS up to £120,000 per person (and up to £1.4
    million for temporary high balances). We are authorised by the PRA and regulated
    by the FCA.


    For information regarding how we update these terms, please refer to Wrenfield
    Current Account — change-of-terms policy.'
  domain: retail_banking
  product_category: current_account
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ed26cd16-d914-56d4-b6fd-0cef119927b9
  title: Wrenfield Current Account — who it is best for and common use cases
  body: 'The Wrenfield Current Account is designed as a dependable, high-street banking
    hub for retail customers who prioritise stability, transparency, and fair pricing.
    It is an ideal primary account for those who want a reliable place to manage their
    daily finances without the burden of monthly maintenance costs.


    Who This Account Suits Best:

    - Cost-Conscious Consumers: Because the Wrenfield Current Account carries a £0
    monthly account fee, it is perfect for customers who want a professional banking
    relationship without paying for the privilege of holding an account.

    - Switchers: Customers looking to move their banking to a more stable institution
    can benefit from our streamlined switch process and a £175 switching incentive.

    - Traditional Banking Users: Those who value a blend of digital access and the
    support of a physical branch network will find our service model well-suited to
    their needs.


    Common Use Cases:

    - Daily Spend and Income Management: Using the account to receive salaries and
    pay monthly bills via Direct Debit, benefiting from our commitment to the Direct
    Debit Guarantee for immediate error refunds.

    - Emergency Buffer: Utilising an arranged overdraft for short-term liquidity needs,
    with a transparent variable interest rate of 39.9%.

    - Gateway to Savings: Using the account as a central hub to distribute funds into
    other Wrenfield products, such as the Wrenfield Everyday Saver or a Cash ISA.


    Key Product Specifications:

    - Monthly Fee: £0

    - Switching Incentive: £175

    - Arranged Overdraft Rate: 39.9% (variable)

    - Regulatory Protection: FSCS protected up to £120,000


    For a comprehensive look at how to open your account, please see Wrenfield Current
    Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 79da6ba4-57a6-5941-9fdd-da0a19233b1d
  title: Wrenfield Current Account — arranged overdraft interest rate (EAR, variable)
    explained
  body: 'Q: What is the interest rate for an arranged overdraft on my Wrenfield Current
    Account?

    A: For customers who have been granted an arranged overdraft facility, the interest
    rate is 39.9%. This is a variable rate, meaning it may change over time based
    on operational costs and regulatory risk.


    Q: How is the 39.9% interest calculated and applied?

    A: Interest is calculated daily based on the amount you are overdrawn and is typically
    applied to your account on a monthly basis. This ensures you only pay for the
    exact amount and duration of the credit used.


    Q: Can the overdraft rate change?

    A: Yes, the 39.9% rate is variable. If we decide to change the rate, we will notify
    you in advance, ensuring transparency in line with our commitment to the Consumer
    Duty.


    For further details on costs, please see Wrenfield Current Account — cost and
    charges.'
  domain: retail_banking
  product_category: current_account
  document_type: faq
  source_authority: official
  placeholder: true
