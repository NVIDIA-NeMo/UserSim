- id: e07f95d0-dc81-5b40-8a90-f7fcd1fb36c4
  title: Wrenfield Current Account — comparison vs. alternatives and when not to choose
    it
  body: 'When choosing a primary bank account, it is important to understand where
    the Wrenfield Current Account fits in the market and who it serves best.


    **Why choose the Wrenfield Current Account?**

    We compete on fairness and transparency. Unlike many ''premium'' high-street accounts
    that charge monthly fees in exchange for perks, our account carries a £0 monthly
    account fee. This makes it an ideal choice for retail customers who want a dependable,
    no-nonsense hub for their daily finances without eroding their balance through
    maintenance charges.


    Furthermore, for those switching from another provider, we offer a highly competitive
    £175 switching incentive to make the transition to Wrenfield Bank rewarding and
    seamless.


    **Comparing the Value Proposition**

    - **Cost:** While some competitors offer ''interest-bearing'' current accounts,
    they often charge a monthly fee that outweighs the interest earned. Our £0 fee
    ensures your money stays yours.

    - **Stability:** We are authorised by the PRA and regulated by the FCA, and your
    deposits are protected by the FSCS up to £120,000 per person (and up to £1.4 million
    for temporary high balances).

    - **Borrowing:** We provide transparent pricing for arranged overdrafts at 39.9%,
    which is a standard rate for the accessibility and flexibility provided.


    **When NOT to choose this account**

    - **Specialised Financial Advice:** If you are looking for individualised tax
    or legal advice, we are not the right choice. We provide general financial education
    and product information, but we do not offer professional tax or legal consultancy.

    - **Complex Investment Needs:** This account is a daily banking hub. If your primary
    goal is sophisticated wealth management or high-yield investing, you may find
    our specialised savings products more appropriate.


    For more on who this account suits, see Wrenfield Current Account — who it is
    best for and common use cases.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 90e6412c-c7e4-5940-9867-b250ae649011
  title: Wrenfield Current Account — eligibility and setup
  body: '**Who is eligible to open a Wrenfield Current Account?**

    Our account is available to retail customers who are residents of the United Kingdom
    and meet our standard identity and affordability assessments. We ensure all customers
    are treated fairly in accordance with the Consumer Duty.


    **How can an existing customer set up an additional current account?**

    If you already bank with us, setting up an additional account is streamlined.
    You will simply need to confirm your current details and agree to the account
    terms. We will perform a quick review to ensure the new account meets our internal
    risk and compliance posture.


    **Can I receive the £175 incentive if I already have a Wrenfield account?**

    Generally, the £175 switching incentive is designed for new customers moving their
    primary banking to us from another institution via the Current Account Switch
    Service. Please check the specific terms of the current offer for eligibility.


    For full details on requirements, refer to Wrenfield Current Account — eligibility
    requirements.'
  domain: retail_banking
  product_category: current_account
