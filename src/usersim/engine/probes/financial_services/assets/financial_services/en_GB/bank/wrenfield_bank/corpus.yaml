- id: 9d54c532-34f0-5f33-9631-07c42c4f442d
  title: Wrenfield Two-Year Fixed Mortgage — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who have noticed an
    unexpected charge or a change in their monthly mortgage payment amount.


    Symptom: The customer reports that their monthly payment has increased or a one-off
    charge has appeared on their statement.


    Likely Causes and Checks:

    1. Expiry of Fixed Term: Check the start date of the mortgage. If the two-year
    period has elapsed, the interest rate has transitioned from the fixed rate of
    5.64% to the Standard Variable Rate of 7.49%. This increase in rate will lead
    to higher monthly payments.


    2. Early Repayment Charges (ERC): Check if the customer has made a large lump-sum
    payment. If they exceeded the 10% annual overpayment allowance, an ERC would be
    applied: 3% if in year one, or 2% if in year two.


    3. Product Fee Recovery: Check if the product fee of £999 was added to the loan
    balance at inception rather than paid upfront. This increases the principal and
    slightly raises the monthly interest cost.


    4. APRC Misunderstanding: Ensure the customer understands that the APRC of 7.4%
    is a representative figure for the overall cost, not the monthly interest rate
    they pay during the fixed term.


    Resolution:

    - If the rate has reverted to the Standard Variable Rate, explain the transition
    and offer to discuss current product transfer options.

    - If an ERC was correctly applied due to an overpayment exceeding 10%, explain
    the terms of the agreement.


    Escalation: If the charge cannot be explained by the above factors, raise a case
    to the senior management escalation path for a detailed billing review. The customer
    should receive a final response within eight weeks.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
