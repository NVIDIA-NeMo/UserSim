  institution_id: wrenfield_bank
- id: 2bb6010d-d03e-5ef6-9bb2-8e774cf5d06e
  title: Wrenfield Current Account — how rates are tiered and applied
  body: 'This document explains the application of interest rates for the Wrenfield
    Current Account. This is intended for use by support agents to ensure consistency
    in customer communication.


    Arranged Overdraft Rate

    There is no tiered structure for overdraft interest. A single, flat variable rate
    applies to all customers who have been granted an arranged overdraft facility:

    - Rate: 39.9%


    Application of the Rate:

    - Calculation: Interest is calculated on a daily basis based on the closing balance
    of the account when it is in an overdrawn position.

    - Crediting/Charging: The total interest accrued for the month is applied as a
    charge to the account monthly.

    - Variability: The 39.9% rate is variable. Changes to this rate are driven by
    operational costs and regulatory risk. Customers must be notified of any rate
    changes in accordance with our terms and conditions.


    Because the Wrenfield Current Account is a daily banking hub and not a savings
    vehicle, it does not accrue interest on credit balances. For interest-bearing
    options, refer the customer to Wrenfield Everyday Saver — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9694f789-c73e-5914-83af-84a36eff3821
  title: Wrenfield Current Account — referral and loyalty offer
  body: 'We are pleased to welcome new customers to the Wrenfield Bank family with
    a special incentive. If you choose to move your daily banking to us by opening
    a Wrenfield Current Account and using the Current Account Switch Service, we will
    provide a switching incentive of £175.


    This offer is designed to reward those who value stability and transparency in
    their banking. To qualify, you must complete the full switch process from another
    UK bank. Once the switch is successfully completed and your new account is active,
    the £175 payment will be credited directly to your balance.


    We believe that moving your finances should be a positive experience. Combined
    with our commitment to a £0 monthly account fee, this offer ensures you start
    your journey with us on the strongest possible footing. This loyalty incentive
    is available for a limited time; please ensure your application is submitted and
    the switch initiated to secure this payment.'
  domain: retail_banking
  product_category: current_account
  document_type: promo_notice
  source_authority: official
