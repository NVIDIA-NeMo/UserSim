- id: 749c5058-8c85-57d8-86b4-8315e0529f32
  title: Wrenfield Everyday Saver — fraud and unauthorised-activity protection
  body: 'At Wrenfield Bank, we are committed to ensuring your savings remain secure.
    For customers comparing the Wrenfield Everyday Saver against other options, it
    is important to understand the specific protections we provide and the fraud patterns
    that typically target flexible savings accounts.


    One common threat is the ''safe account'' scam. In this scenario, fraudsters impersonate
    our staff, claiming that your account has been compromised and urging you to move
    your funds into a ''safe'' account. Please be aware that we will never ask you
    to transfer money to a different account to keep it secure, nor will we ever ask
    for your full security credentials over the phone.


    To protect your assets, we maintain a rigorous ''verify-first'' stance. We require
    full identity authentication before any state-changing action is performed or
    any account information is disclosed. If you ever receive a request for funds
    or information that seems unusual, do not proceed. The first action you should
    take is to notify us immediately through our official channels so we can secure
    your funds.


    From a regulatory perspective, your deposits are protected. Eligible deposits
    in the Wrenfield Everyday Saver are protected by the Financial Services Compensation
    Scheme (FSCS) up to £120,000 per person. For those with temporary high balances,
    protection extends up to £1.4 million for a limited period.


    We also proactively support victims of Authorised Push Payment (APP) scams. If
    you believe you have been targeted, reporting the incident as soon as possible
    is critical to the recovery process. By combining our strict verification protocols
    with the security of the FSCS, we ensure that your path to saving—starting from
    as little as £1—is supported by a dependable and secure institutional framework.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ca7f6b2d-3346-5347-94b5-b47c06e7300f
  title: Wrenfield Everyday Saver — account agreement
  body: 'This account agreement outlines the binding terms between Wrenfield Bank
    (''we'', ''us'') and the account holder. These terms ensure transparency and stability
    for all retail customers using the Wrenfield Everyday Saver.


    1. Account Opening and Minimums

    To establish the account, the customer must provide a minimum opening deposit
    of £1. Failure to meet this initial funding requirement will result in the application
    being declined.


    2. Interest Application

    The account earns interest at a rate of 2.1%. This rate is variable, meaning we
    may adjust it in response to market conditions or regulatory changes. Interest
    is calculated daily and credited to the account according to our standard internal
    schedule.


    3. Customer Obligations

    The customer must provide accurate, current identity documentation and maintain
    a valid identity verification status. Any attempt to provide fraudulent information
    will lead to immediate account closure.


    4. Bank Obligations

    We agree to maintain the security of the funds, adhere to the Consumer Duty, and
    treat the customer fairly in all interactions. We will ensure that eligible deposits
    are protected by the FSCS up to £120,000 per person, with temporary high balances
    protected up to £1.4 million.


    5. Account Closure and Termination

    Either party may terminate this agreement. If the customer wishes to close the
    account, they must notify us. We will then calculate any outstanding interest
    accrued up to the date of closure and transfer the total remaining balance to
    a nominated account. We reserve the right to close the account with reasonable
    notice if we suspect fraudulent activity or a breach of these terms.


    6. Amendments to Terms

    We may change these terms to reflect changes in regulation or operational costs.
    We will provide the customer with clear, prominent notice of any such changes
    before they take effect.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 8d62b212-7304-5b27-bb97-b07987000207
  title: Wrenfield Everyday Saver — who it is best for and common use cases
  body: 'The Wrenfield Everyday Saver is designed for customers who prioritise accessibility,
    stability, and a low barrier to entry when growing their savings. Unlike more
    restrictive products, this account allows you to start saving with a minimal commitment.


    Who it is best for:

    - First-time savers: Because we only require a minimum opening deposit of £1,
    this account is ideal for those who are just beginning their savings journey.

    - Emergency fund builders: Its flexible nature makes it a dependable hub for funds
    that may need to be accessed quickly without penalty.

    - Customers valuing transparency: With a clear, single interest rate of 2.1%,
    there are no opaque tiers or complex conditions to track.


    Common Use Cases:

    - The ''Rainy Day'' Fund: Setting aside small amounts regularly to cover unexpected
    expenses while still earning a competitive rate of 2.1%.

    - A Stepping Stone to Higher Savings: Using this account to accumulate funds before
    moving them into a more structured product, such as the Wrenfield Regular Saver,
    which has a maximum monthly deposit limit of £300.

    - Complementing a Current Account: Pairing this with the Wrenfield Current Account
    to separate daily spending from long-term savings while ensuring the money remains
    liquid.


    Key Product Specifications:

    - Minimum Opening Deposit: £1

    - Interest Rate: 2.1%

    - Protection: FSCS protected up to £120,000 per person (and £1.4 million for temporary
    high balances).


    By focusing on fair pricing and accessibility, we ensure that the Wrenfield Everyday
    Saver serves as a reliable foundation for any retail customer''s financial wellbeing.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: product_sheet
  source_authority: official
