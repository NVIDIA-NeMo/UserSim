- id: 40a4519a-31f1-5b60-890f-1ef640d26348
  title: Wrenfield Current Account — payment for switching with the Current Account
    Switch Service explained
  body: 'Q: How do I qualify for the switching incentive when opening a Wrenfield
    Current Account?

    A: To receive the £175 switching incentive, you must use the Current Account Switch
    Service to move your account from another UK bank to us. This ensures a streamlined
    process where your direct debits and standing orders are moved automatically.


    Q: When will the £175 be paid into my account?

    A: The incentive is paid once the switch is fully completed and your new Wrenfield
    Current Account is active. We will credit the £175 directly to your balance.


    Q: Does the switching incentive affect the monthly cost of the account?

    A: No. The Wrenfield Current Account always carries a £0 monthly account fee,
    regardless of whether you received a switching incentive. For more details on
    our current promotions, see Wrenfield Current Account — current offer.'
  domain: retail_banking
  product_category: current_account
