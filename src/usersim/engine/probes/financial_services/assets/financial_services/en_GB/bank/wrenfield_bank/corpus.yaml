  institution_id: wrenfield_bank
- id: a00c6b3c-aa8c-507c-a064-2dbbb754b872
  title: Wrenfield Easy Access Cash ISA — interest rate (AER) explained
  body: 'Q: What is the interest rate on my Wrenfield Easy Access Cash ISA?

    A: We offer an interest rate of 2.85% on this account. This is quoted as an Annual
    Equivalent Rate (AER).


    Q: What does AER actually mean for my savings?

    A: AER stands for Annual Equivalent Rate. This is a standardised way of showing
    you the interest you would earn if your money was paid and compounded once a year.
    It allows you to compare our 2.85% rate fairly against other savings products
    across the market.


    Q: How is the interest applied to my balance?

    A: Interest is calculated daily based on your closing balance and is credited
    to your account annually. Because this is a Cash ISA, any interest earned at the
    2.85% rate is tax-free, meaning you keep the full amount generated by your savings.


    For more details on how our rates are structured, please refer to the Wrenfield
    Easy Access Cash ISA — interest rate / AER schedule.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
