- id: fdcee743-9691-5b87-8afb-283a9129ac88
  title: Wrenfield Regular Saver — who it is best for and common use cases
  body: 'The Wrenfield Regular Saver is specifically designed for customers who are
    disciplined savers and wish to grow their money steadily over a short, defined
    period. Unlike a general savings account, this product rewards the habit of monthly
    contributing with a highly competitive interest rate.


    Who is this product best for?

    This account is ideal for individuals who have a steady monthly surplus and a
    specific goal in mind for the next year—such as a holiday, a festive budget, or
    an emergency fund. It is best suited for those who do not need immediate access
    to their funds and can commit to a structured saving plan.


    Common Use Cases:

    - The ''Yearly Goal'' Saver: A customer who wants to save a maximum of £300 every
    month to reach a total of £3,600 (plus interest) by the end of the 12-month term.

    - The ''High-Yield'' Bridge: A customer who already has a primary hub for their
    money, such as the Wrenfield Current Account, and wants to move a portion of their
    monthly income into a higher-yielding environment.


    Key Product Specifications:

    - Interest Rate: 6%

    - Maximum Monthly Deposit: £300

    - Account Term: 12 months


    Comparison Note:

    If you require a level of flexibility where you can deposit any amount at any
    time without a monthly cap, the Wrenfield Everyday Saver may be more appropriate.
    However, for those seeking a significantly higher rate of return on their monthly
    contributions, the Wrenfield Regular Saver is the superior choice. For a full
    overview of our flexible options, see Wrenfield Everyday Saver — overview.'
  domain: retail_banking
  product_category: regular_saver
  document_type: product_sheet
