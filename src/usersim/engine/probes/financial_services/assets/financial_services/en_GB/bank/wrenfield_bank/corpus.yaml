- id: 57ca64de-7e2d-54ee-8909-d7f97c012110
  title: Wrenfield Rewards Credit Card — non-sterling transaction fee explained
  body: '**What is a non-sterling transaction fee?**

    This is a fee we apply whenever you use your Wrenfield Rewards Credit Card to
    pay for goods or services in a currency other than Pound Sterling (GBP). This
    includes both physical purchases made abroad and online shopping with foreign
    merchants.


    **How much is the fee?**

    For the Wrenfield Rewards Credit Card, the foreign transaction fee is 2.99%. This
    percentage is calculated based on the GBP equivalent of the transaction amount.


    **How does it appear on my statement?**

    The transaction will be converted to GBP using the prevailing exchange rate, and
    the 2.99% fee will be added to that amount. You will see the final total in Sterling
    on your statement.


    If you have questions about a specific charge, we recommend reviewing your history
    in the Wrenfield Rewards Credit Card — check status or history guide.'
  domain: cards
  product_category: credit_card
  document_type: faq
  source_authority: official
