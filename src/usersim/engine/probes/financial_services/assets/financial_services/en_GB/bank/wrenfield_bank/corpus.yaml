- id: 41f03934-ceb6-55e2-86e4-38114f0a28bc
  title: Wrenfield Easy Access Cash ISA — cancel, close, or downgrade
  body: 'If you are comparing your options and decide that the Wrenfield Easy Access
    Cash ISA no longer meets your financial needs, we provide a straightforward process
    to cancel, close, or downgrade your account. Please follow these steps to ensure
    your funds are moved securely.


    Before you begin, please ensure you have your account details ready and a nominated
    Wrenfield Current Account or another UK bank account to receive the balance.


    1. Request Closure: Inform us that you wish to close your Wrenfield Easy Access
    Cash ISA. We will then initiate our ''verify-first'' security protocol to confirm
    your identity.

    2. Identity Verification: Provide the required authentication as requested. This
    may include security questions or the presentation of a valid government-issued
    ID if you are visiting a branch.

    3. Specify Fund Destination: Tell us where you would like the final balance to
    be sent. You can request a transfer to your Wrenfield Current Account or provide
    the sort code and account number for an external UK institution.

    4. Confirm Balance and Interest: We will provide a final statement of the closing
    balance, which includes all interest accrued at the 2.85% rate up to the date
    of closure.

    5. Final Confirmation: We will process the closure and transfer the funds. You
    will receive a confirmation message once the account is officially closed and
    the funds have been dispatched.


    If you wish to ''downgrade'' by moving funds into a different savings product,
    such as the Wrenfield Everyday Saver, you can simply ask us to transfer a specific
    amount from your ISA. Please note that any funds moved out of the ISA into a non-ISA
    account lose their tax-free status and cannot be put back into the ISA allowance
    for that tax year.


    Once the process is complete, you will see the funds arrive in your nominated
    account, and your ISA will no longer appear in your active product list.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: e3135982-f6c6-5de8-819a-5b9c1ab58abf
  title: Wrenfield Easy Access Cash ISA — an unexpected charge or amount
  body: 'As a support agent, use this guide when a customer reports an ''unexpected
    charge'' or an ''incorrect amount'' appearing in their Wrenfield Easy Access Cash
    ISA. Since this is a tax-efficient account, discrepancies often relate to regulatory
    limits rather than bank fees.


    Symptom: The customer believes a charge has been deducted or the balance is lower
    than expected.


    Likely Causes:

    1. ISA Limit Breach: The customer may have deposited more than the £20,000 annual
    allowance. If we have corrected an over-contribution, the balance will decrease.

    2. Transfer Errors: A transfer from another provider may have been processed incorrectly,
    or a portion of the funds was ineligible for ISA status.

    3. Interest Calculation Confusion: The customer may be miscalculating the 2.85%
    interest, which is calculated daily but credited periodically.


    What to check in order:

    1. Transaction History: Review the recent ledger. Look for any entries labelled
    ''Adjustment'' or ''Correction''.

    2. Contribution Total: Sum all deposits made by the customer since the start of
    the current tax year. Check if this exceeds £20,000.

    3. Interest Credit Date: Check when the last interest payment was applied and
    verify the calculation against the 2.85% rate.


    Fix:

    - If it was a simple calculation error, explain the daily interest process to
    the customer.

    - If an over-contribution occurred, explain that the funds were removed to comply
    with HMRC regulations.


    When to Escalate:

    If the customer disputes a legitimate bank error or if the discrepancy cannot
    be explained by the above, we will raise a formal case. We will route the issue
    to the Senior Management escalation path. The customer should be informed that
    we aim to provide a final response for payment-related disputes within 15 business
    days, and other disputes within eight weeks.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 46003c02-d713-572c-8b39-432d29b3c263
  title: Wrenfield Easy Access Cash ISA — required documentation
  body: 'To open a Wrenfield Easy Access Cash ISA and begin benefiting from the 2.85%
    interest rate, all prospective customers must provide specific documentation to
    satisfy our ''verify-first'' security stance and regulatory obligations.


    | Document Required | Purpose | Requirement Detail |

    | :--- | :--- | :--- |

    | Valid Government Photo ID | Identity Verification | Current Passport or UK Driving
    Licence |

    | Proof of Address | Residency Verification | Utility bill or Council Tax statement
    dated within the last 3 months |

    | National Insurance Number | Tax Status Verification | Required for HMRC reporting
    of ISA allowances |

    | ISA Transfer Form | Transferring Existing Funds | Required if moving funds from
    another provider to protect the £20,000 allowance |


    Failure to provide any of the above will result in the application being paused
    until the documentation is received. For more on getting started, please see the
    Wrenfield Easy Access Cash ISA — overview.'
  domain: retail_banking
