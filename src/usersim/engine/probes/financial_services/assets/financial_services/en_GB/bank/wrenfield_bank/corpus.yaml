- id: 9b1ac99f-7f57-5e01-8011-d65622a70ac6
  title: Wrenfield Rewards Credit Card — privacy and data handling
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). This disclosure explains how we handle your data in relation to the Wrenfield
    Rewards Credit Card.


    **Data Collection and Use**

    We collect and process your personal and financial data to maintain your account,
    prevent fraud, and comply with our regulatory obligations. This includes the data
    used during our strict affordability assessment, which is necessary to ensure
    that the credit limit—such as the representative £1,200—and the representative
    APR of 24.9% are appropriate for your circumstances.


    **The ''Verify-First'' Principle**

    To protect your assets and prevent unauthorised access, we employ a rigorous ''verify-first''
    stance. We will not disclose account information or perform state-changing actions
    (such as updating a balance transfer fee of 3.49% or altering account details)
    without full identity authentication. This is a critical component of our commitment
    to the Consumer Duty.


    **Third-Party Sharing**

    We only share your data with third parties when required by law, for the prevention
    of crime (such as APP scams), or with credit reference agencies to assess your
    creditworthiness. We do not sell your data to marketing firms.


    **Your Rights**

    Under UK data protection laws, you have the right to request access to the data
    we hold about you and to ask for corrections to inaccurate information. We process
    all such requests during standard UK business hours. For more information on our
    regulatory posture, please refer to the Regulatory notes for Cards. Eligible deposits
    held within our bank are protected by the FSCS up to £120,000 per person, though
    this specifically applies to deposit accounts rather than credit facilities.'
  domain: cards
  product_category: credit_card
  document_type: disclosure
  source_authority: official
