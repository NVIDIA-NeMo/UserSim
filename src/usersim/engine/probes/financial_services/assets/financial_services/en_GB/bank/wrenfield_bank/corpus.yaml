- id: 26919d39-8c0a-5278-a378-9b83818b80eb
  title: Wrenfield Two-Year Fixed Mortgage — choosing between tiers or options
  body: 'When deciding on the right mortgage for your needs, it is important to compare
    the stability of a fixed rate against the flexibility of a variable rate.


    Wrenfield Two-Year Fixed Mortgage

    - Rate: 5.64% fixed for two years.

    - Cost Certainty: High. Your payments will not change for 24 months.

    - Lock-in: High. Repaying early triggers a charge of 3% in year one and 2% in
    year two.

    - Best for: Customers who value budget stability and want protection against rising
    interest rates.


    Wrenfield Standard Variable Rate (SVR)

    - Rate: 7.49% (variable).

    - Cost Certainty: Low. Payments can change if we adjust the SVR.

    - Lock-in: Low. Generally offers more flexibility for repayment without the same
    strict ERCs as a fixed deal.

    - Best for: Customers who anticipate needing to repay their loan quickly or those
    who believe market rates will drop significantly.


    For most retail customers seeking transparency and stability, the 5.64% fixed
    rate provides a significant advantage over the current 7.49% SVR. However, the
    choice depends on your individual financial circumstances and risk appetite.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: dbf4149b-7a7d-585a-bd4d-cbe021058021
  title: Wrenfield Two-Year Fixed Mortgage — privacy and data handling
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). This ensures that all customers, including those with a Wrenfield Two-Year
    Fixed Mortgage, are treated fairly and in accordance with the Consumer Duty.


    Data Protection: We collect and process your personal and financial data strictly
    for the purpose of managing your mortgage, conducting affordability assessments,
    and meeting our regulatory obligations. Your data is handled with the utmost confidentiality
    and is only disclosed to third parties, such as property valuers, when necessary
    to facilitate your loan.


    Deposit Protection: While the mortgage is a lending product, any associated deposits
    held with us are protected by the Financial Services Compensation Scheme (FSCS).
    Eligible deposits are protected up to £120,000 per person, with temporary high
    balances protected up to £1.4 million.


    Risk Disclosure: Borrowing secures a loan against your home. If you fail to keep
    up your repayments, you may lose your home. The APRC of 7.4% represents the total
    cost of the loan over the full term, including the product fee of £999 and the
    reversion to the Standard Variable Rate of 7.49% after the initial two-year period.


    We are committed to transparency and will provide clear, simple documentation
    regarding any changes to how your data is handled or how your loan is administered.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: disclosure
  source_authority: official
