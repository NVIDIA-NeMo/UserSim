- id: dbc0c043-d018-5b1e-a8ce-9788027abc31
  title: Wrenfield Easy Access Cash ISA — cash ISA allowance for under-65s from 6
    April 2027 explained
  body: 'Q: I have heard that the ISA allowance is changing in the future. How does
    this affect me?


    A: Currently, the annual ISA allowance for all eligible customers is £20,000.
    However, under planned regulatory changes, the cash ISA allowance for customers
    under the age of 65 will change to £12,000 starting from 6 April 2027.


    Q: Does this mean I have to withdraw money from my Wrenfield Easy Access Cash
    ISA?


    A: No. This change affects the amount you can *contribute* to your ISA each year
    starting from that date; it does not require you to remove funds already saved
    in your account. Your existing balance will continue to earn our current annual
    interest rate of 2.85%.


    Q: What happens if I contribute more than the new limit after April 2027?


    A: Contributions exceeding the then-current limit (which will be £12,000 for under-65s)
    may lose their tax-efficient status. We recommend reviewing your savings strategy
    as we approach the 6 April 2027 date to ensure you remain within the legal limits.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 213445b2-308b-5a2d-95b0-1a0af5acc1b2
  title: Wrenfield Easy Access Cash ISA — make a change or update
  body: 'Whether you have moved house, changed your name, or wish to update the beneficiaries
    on your Wrenfield Easy Access Cash ISA, we are here to help you keep your records
    accurate. To ensure the security of your 2.85% interest-bearing savings, we follow
    a strict verification process for all updates.


    To make a change, please follow these steps:


    1. Specify the update: Tell us exactly which piece of information needs to be
    changed (e.g., a new residential address or a change in contact telephone number).


    2. Provide supporting evidence: Depending on the nature of the change, provide
    the necessary documentation. For a name change, this would be a marriage certificate
    or deed poll; for an address change, a recent utility bill or council tax statement
    is required.


    3. Complete identity authentication: We will conduct a full security check to
    verify your identity. This is part of our ''verify-first'' stance to prevent unauthorised
    changes to your account.


    4. Review the confirmation: Once we have verified your details, we will confirm
    that the update has been processed. We will then provide you with a written confirmation
    of the change for your records.


    If you are updating your account and wish to check if you can further increase
    your savings, remember that your total annual contribution across all ISAs must
    not exceed the allowance of £20,000.'
  domain: retail_banking
  product_category: cash_isa
  document_type: how_to_guide
  source_authority: official
