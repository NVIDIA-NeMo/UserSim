- id: ba832527-83ad-5258-8a09-c732fb0da69f
  title: Wrenfield Current Account — monthly account fee explained
  body: 'How much does it cost to maintain my Wrenfield Current Account each month?

    We believe that essential banking should be accessible to everyone. Consequently,
    the Wrenfield Current Account carries a monthly account fee of £0. There are no
    hidden monthly charges for the basic upkeep of this account.


    Are there any conditions I must meet to keep the account fee at £0?

    No. The £0 monthly account fee is a standard feature of the Wrenfield Current
    Account and is not dependent on a minimum balance, a monthly deposit requirement,
    or any other specific usage patterns.


    Where can I find other charges associated with my account?

    While the monthly maintenance fee is £0, other services such as arranged overdrafts
    may incur charges. You can find a full list of these in the Wrenfield Current
    Account — fee schedule.'
  domain: retail_banking
