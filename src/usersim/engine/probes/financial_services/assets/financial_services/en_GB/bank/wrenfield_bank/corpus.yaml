  institution_id: wrenfield_bank
- id: 5f2efa18-5944-5ec7-bd87-5953ee4da586
  title: Wrenfield Personal Loan — fraud and unauthorised-activity protection
  body: "At Wrenfield Bank, we are committed to protecting your assets and ensuring\
    \ your borrowing experience is secure. Loan products can sometimes be targeted\
    \ by fraudsters using sophisticated tactics, and we encourage you to remain vigilant\
    \ to prevent unauthorised access to your funds.\n\nCommon fraud patterns targeting\
    \ personal loans often involve 'loan recovery' scams, where individuals pose as\
    \ representatives from a lending institution claiming you have an outstanding\
    \ balance or that a loan has been approved in your name without your knowledge.\
    \ They may request an 'upfront fee' or a 'processing payment' to release your\
    \ funds. Please be aware that we will never ask you to pay a fee to access a loan\
    \ you have applied for through our official channels.\n\nWe maintain a rigorous\
    \ 'verify-first' stance. This means we will always perform full identity authentication\
    \ before disclosing account information or performing any action that changes\
    \ the state of your loan. We will never ask you to share your full security credentials\
    \ or passwords via email or text message.\n\nIf you notice any unauthorised activity\
    \ or suspect that you have been the victim of an APP scam, the first action you\
    \ must take is to notify us immediately. Rapid reporting is essential for the\
    \ best possible outcome. In line with our commitment to fair treatment, we aim\
    \ for rapid resolution of all disputes. We provide final responses for payment\
    \ service complaints within 15 business days and resolve other disputes within\
    \ eight weeks. \n\nFor those comparing our services against alternatives, our\
    \ security posture is designed to provide stability and transparency. We operate\
    \ under the strict authorisation of the PRA and regulation by the FCA, ensuring\
    \ that your loan is managed within a secure, regulated framework that prioritises\
    \ the Consumer Duty."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 8917ae0c-2f5e-534d-ba59-cbdc33c53010
  title: Wrenfield Personal Loan — account agreement
  body: "This agreement outlines the binding terms between Wrenfield Bank ('we', 'us')\
    \ and the borrower regarding the Wrenfield Personal Loan. \n\n1. Loan Obligations\
    \ and Repayment\nThe borrower agrees to repay the principal loan amount plus interest\
    \ over the agreed term. For example, a loan of £10,000 with a term of 60 months,\
    \ at a representative APR of 6.9%, results in a monthly payment of £196.56 and\
    \ a total amount payable of £11,793.60. All payments must be made by the specified\
    \ due date each month.\n\n2. Borrowing Limits and Assessment\\The maximum loan\
    \ amount available is £35,000. All lending recommendations and final approvals\
    \ are subject to a strict affordability assessment. This is a mandatory requirement\
    \ to ensure a high standard of care and to avoid foreseeable harm to the borrower.\n\
    \n3. Right to Withdraw\\In accordance with our commitment to transparency, borrowers\
    \ have a 14-day right to withdraw from the loan agreement. If this right is exercised,\
    \ the borrower must repay the principal amount and any interest accrued up to\
    \ the date of early repayment.\n\n4. Changes to Terms\\We may amend the terms\
    \ of this agreement to reflect regulatory changes or operational costs. We will\
    \ provide clear and prominent notice of any such changes before they take effect.\n\
    \n5. Termination and Default\\The agreement ends when the total amount payable\
    \ is settled in full. In the event of a default, we will work with the borrower\
    \ to establish a fair repayment plan, adhering to FCA regulations on the fair\
    \ treatment of customers.\n\nThis agreement is governed by the laws of England\
    \ and Wales and is subject to the regulation of the FCA and the authorisation\
    \ of the PRA."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 53ca9a13-a51d-521c-a598-35e7f41d9162
  title: Wrenfield Personal Loan — who it is best for and common use cases
  body: 'The Wrenfield Personal Loan is designed for retail customers who seek a dependable,
    transparent borrowing solution for planned expenses. Because we compete on fair
    pricing and stability, this product is an ideal choice for those who prefer the
    certainty of a fixed repayment schedule over variable credit options.


    This loan is best suited for customers in the following scenarios:


    - Home Improvements: Whether you are updating a kitchen or insulating your loft,
    our loans provide the capital needed for renovations. With a maximum loan amount
    of £35,000, we can support significant project costs.

    - Debt Consolidation: For customers managing multiple high-interest debts, consolidating
    into a single, transparently priced loan can simplify monthly budgeting and potentially
    reduce overall interest costs.

    - Major Life Events: From wedding costs to essential family purchases, our loans
    offer a structured way to manage larger expenditures without relying on volatile
    credit card rates.


    To illustrate the cost of borrowing, our representative example features a loan
    of £10,000 over a duration of 60 months. At a representative APR of 6.9%, this
    results in a monthly payment of £196.56, with a total amount payable of £11,793.60.


    We ensure that all borrowers can comfortably manage their repayments through a
    strict affordability assessment, ensuring that our lending remains sustainable
    and supportive. For those who also require a hub for their daily finances, we
    recommend pairing this loan with the Wrenfield Current Account — overview.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 8664b482-2d74-5993-8bf4-24a894e4ef8d
  title: Wrenfield Personal Loan — amount of credit in the representative example
    explained
  body: 'Q: What does the £10,000 amount in the representative example mean for my
    own application?


    A: The £10,000 figure is used as a benchmark to help you compare our loan costs
    with other lenders. This ''representative amount'' allows us to show a consistent
    example of what a typical loan costs. However, you can apply for any amount up
    to our maximum loan amount of £35,000, subject to our affordability assessment.


    Q: Will I definitely receive a loan of £10,000 at 6.9% APR?


    A: Not necessarily. A ''Representative APR'' means that we must be able to offer
    that specific rate (6.9%) to at least 51% of successful applicants. Your actual
    rate may be higher or lower depending on your individual credit profile and the
    amount you borrow.


    For further details on how this impacts your total cost, you may wish to review
    the Wrenfield Personal Loan — risk disclosures.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ac3c8d56-b207-53fb-8f8c-6a45199a9c4d
  title: Wrenfield Personal Loan — cancel, close, or downgrade
  body: 'Depending on where you are in your loan journey, there are different ways
    to end or change your agreement with us. Please follow the steps below based on
    your current requirement.


    **To exercise your right to withdraw (within 14 days)**

    If you have recently taken out a loan and wish to cancel the agreement within
    the 14-day right to withdraw period:

    1. Tell us that you wish to exercise your legal right to withdraw from the loan
    agreement.

    2. We will calculate the exact principal amount and any accrued interest from
    the date the funds were disbursed to you.

    3. Provide the total repayment amount via your linked account.

    4. We will confirm in writing once the balance is £0 and the agreement is formally
    closed.


    **To close a loan early (after the 14-day period)**

    If you wish to settle your loan before the end of the term (for example, before
    the 60 months specified in our representative example):

    1. Ask us for a current ''settlement figure''. This is the total amount required
    to pay off the loan in full today.

    2. Once we provide this figure, arrange for the payment to be made.

    3. We will process the payment and provide a final statement confirming that the
    loan has been closed.


    **To downgrade or restructure**

    Because personal loans are fixed-term contracts, they cannot be ''downgraded''
    in the same way as a current account. If your financial circumstances change and
    you are struggling with your monthly payments (such as the £196.56 in our representative
    example), please tell us immediately. We will conduct a new affordability assessment
    to see if a restructured payment plan is possible to avoid foreseeable harm.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 38131c9c-ff36-5ef4-8b67-6d371d4b5c7e
  title: Wrenfield Personal Loan — an unexpected charge or amount
  body: "If a customer reports that they have seen an unexpected charge on their statement\
    \ or that their monthly repayment does not match their expectations, support agents\
    \ should follow this diagnostic path.\n\n**Symptom: Monthly payment differs from\
    \ the representative example**\nThe customer may be comparing their payment to\
    \ the £196.56 quoted in our representative example. \n- **Cause:** The £196.56\
    \ payment only applies to a loan of exactly £10,000 over 60 months at 6.9% APR.\
    \ If the customer borrowed a different amount (up to £35,000) or chose a different\
    \ term, the payment will differ.\n- **Fix:** Confirm the customer's actual loan\
    \ principal and term. Recalculate the payment based on their specific agreed APR\
    \ and explain the difference clearly.\n\n**Symptom: Unexpected fee or charge**\n\
    - **Cause:** This may be due to a missed payment or a late payment fee as outlined\
    \ in the loan agreement.\n- **Fix:** Review the payment history. If the charge\
    \ is a result of a missed payment, explain the fee. If the customer believes the\
    \ charge is an error, we will initiate a dispute process.\n\n**Escalation Path**\n\
    If the cause cannot be identified or the customer remains dissatisfied:\n1. We\
    \ will raise a formal case to the senior management team for review.\n2. The customer\
    \ will receive a response within the standard dispute timelines: 15 business days\
    \ for payment-related complaints and eight weeks for other disputes.\n3. If unresolved\
    \ after this period, we will provide the customer with the necessary information\
    \ to escalate the matter to the Financial Ombudsman Service."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 49f48383-b423-5a34-b2d1-3541a26f9391
  title: Wrenfield Personal Loan — required documentation
  body: "To apply for a Wrenfield Personal Loan, all prospective customers must provide\
    \ specific documentation to satisfy our 'verify-first' security stance and regulatory\
    \ requirements. \n\n| Requirement | Required Documentation | Outcome |\n| :---\
    \ | :--- | :--- |\n| **Identity Verification** | Valid Passport or UK Driving\
    \ Licence | Proceed to affordability check |\n| **Address Verification** | Recent\
    \ Utility Bill or Council Tax Statement (last 3 months) | Proceed to affordability\
    \ check |\n| **Income Verification** | Three months of payslips or most recent\
    \ P60 | Proceed to credit assessment |\n| **Max Loan Approval** | Comprehensive\
    \ proof of income and expenditure | Eligible for loans up to £35,000 (subject\
    \ to assessment) |\n| **Incomplete Documentation** | Any of the above missing\
    \ | Application paused until documents provided |\n\nAll documentation is reviewed\
    \ as part of a strict affordability assessment to ensure the loan is sustainable\
    \ for the borrower."
