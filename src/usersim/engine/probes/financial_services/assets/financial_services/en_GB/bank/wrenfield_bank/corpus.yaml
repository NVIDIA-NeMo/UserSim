  institution_id: wrenfield_bank
- id: 8286cc3f-9477-5ed6-a71c-307264dc844c
  title: Wrenfield Everyday Saver — cancel, close, or downgrade
  body: 'If you are comparing your options and decide that the Wrenfield Everyday
    Saver no longer meets your needs, we provide a straightforward process to close
    your account or move your funds. Please follow these steps to ensure your balance
    is handled correctly.


    1. Notify us of your intent

    Tell us that you wish to close your Wrenfield Everyday Saver account. If you are
    looking to move your funds to a different Wrenfield product instead of closing
    the account entirely, let us know so we can facilitate a transfer.


    2. Complete identity verification

    To ensure the security of your assets, we will perform a full identity authentication.
    This ''verify-first'' step is mandatory before we can execute any state-changing
    action on your account.


    3. Confirm the destination for your funds

    Provide the details of the account where you would like your remaining balance
    to be sent. We will confirm the total amount to be transferred, which will include
    your principal balance and any interest earned at the rate of 2.1% up to the date
    of closure.


    4. Await confirmation

    We will process the closure and transfer the funds. You will receive a final confirmation
    once the account is closed and the balance has been successfully moved.


    If you are closing this account because you require a different type of savings
    vehicle, you might consider the Wrenfield Regular Saver for high-interest short-term
    goals, provided you can commit to the monthly deposit structure.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
