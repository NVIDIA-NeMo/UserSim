  institution_id: wrenfield_bank
- id: 0e7d6e70-93e7-5577-b7e2-f67da3d74e6e
  title: Wrenfield Personal Loan — getting started walkthrough
  body: 'This walkthrough is designed for support agents to guide prospective customers
    through the onboarding process for the Wrenfield Personal Loan. Please ensure
    the customer understands that all lending is subject to a strict affordability
    assessment.


    **Step 1: Establishing Loan Needs**

    Discuss the customer''s borrowing requirements. Inform them that we offer a maximum
    loan amount of £35,000. To provide a clear example of our pricing, share the representative
    example: a loan of £10,000 over a term of 60 months with a representative APR
    of 6.9% results in a monthly payment of £196.56 and a total amount payable of
    £11,793.60.


    **Step 2: Application and Affordability**

    Guide the customer through the application. Explain that we must conduct a thorough
    affordability check to ensure the loan is sustainable for their budget. This is
    part of our commitment to the Consumer Duty and our goal to avoid foreseeable
    harm.


    **Step 3: Identity Verification**

    Execute our ''verify-first'' security protocol. The customer must provide full
    identity authentication. Ensure all documentation is verified before proceeding
    to the final offer stage.


    **Step 4: Finalising the Agreement**

    Once approved, confirm the exact APR and monthly repayment tailored to their specific
    credit profile. Remind the customer that they have a 14-day right to withdraw
    from the agreement if they change their mind.


    **Step 5: Funding**

    Upon acceptance, funds are disbursed to the customer''s nominated account. Advise
    them on how to monitor their balance and payments via our digital channels or
    in-branch during standard UK business hours.


    For further details on the representative pricing, see Wrenfield Personal Loan
    — representative APR explained.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 0bf1c41c-2cd8-5d27-bc3d-c01f4738dc2e
  title: Wrenfield Personal Loan — term in the representative example (months) explained
  body: '**What does the ''60 months'' term in the representative example mean?**

    In our representative example, 60 months refers to the duration of the loan agreement.
    This is the period over which you would repay the borrowed amount plus interest.
    In this specific scenario, borrowing £10,000 over 60 months allows for a monthly
    payment of £196.56, making the loan more manageable on a month-to-month basis.


    **Can I choose a different term for my loan?**

    Yes, the 60-month figure is for illustrative purposes. You can request a shorter
    or longer term depending on your needs and affordability. Please note that choosing
    a longer term may reduce your monthly payment but will increase the total amount
    payable over the life of the loan, whereas a shorter term will increase the monthly
    cost but reduce the total interest paid.


    For more information on the total cost, please see Wrenfield Personal Loan — total
    amount payable in the representative example explained.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
