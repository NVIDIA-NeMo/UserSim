- id: f9ff04be-8137-5823-a068-aac6220719da
  title: Wrenfield Two-Year Fixed Mortgage — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of the Wrenfield Two-Year Fixed Mortgage. This agreement is designed to provide
    stability and transparency for customers comparing their lending options.


    Fixed Rate Period: The interest rate of 5.64% is fixed for a period of two years
    from the date of completion. During this term, we will not alter this rate regardless
    of movements in the wider market.


    Reversion to Standard Variable Rate: Upon the expiry of the two-year fixed term,
    your mortgage will automatically revert to our Standard Variable Rate (SVR), which
    is currently 7.49%. Please note that the SVR is variable and may increase or decrease
    at our discretion, subject to regulatory requirements.


    Early Repayment Charges: If you choose to repay the mortgage in full or switch
    to another provider before the end of the fixed term, Early Repayment Charges
    (ERCs) will apply. For the first year of the term, the charge is 3% of the outstanding
    balance. In the second year, the charge is 2% of the outstanding balance.


    Policy Changes: We reserve the right to amend the general terms and conditions
    of our lending products. We will provide you with clear, written notice of any
    material changes to your account terms. If you do not agree to the changes, you
    may have the right to switch products, subject to an affordability assessment.


    This mortgage is subject to the strict authorisation of the PRA and regulation
    by the FCA, ensuring you are treated fairly throughout the life of your loan.'
