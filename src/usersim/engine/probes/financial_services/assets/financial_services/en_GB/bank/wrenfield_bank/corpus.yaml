- id: c97e3d34-581a-5960-849a-e56ba3a60e85
  title: Wrenfield Regular Saver — fraud and unauthorised-activity protection
  body: 'At Wrenfield Bank, we are committed to ensuring your savings remain secure.
    The Wrenfield Regular Saver is a popular choice for goal-oriented saving, but
    its structured nature can occasionally be targeted by fraudsters using specific
    tactics.


    One common pattern involves ''rate-boost'' scams. You may receive a message claiming
    that your interest rate of 6% can be increased if you move your funds to a different,
    external account or provide your security details. We will never ask you to move
    your savings to another institution to ''unlock'' a higher rate, nor will we ever
    ask for your full password or PIN via text, email, or telephone.


    We maintain a rigorous ''verify-first'' stance. This means that before we perform
    any action that changes the state of your account or disclose any sensitive information,
    we require full identity authentication. If you are contacted by someone claiming
    to be from Wrenfield Bank and they attempt to bypass these verification steps,
    please end the conversation immediately.


    If you suspect that your account has been accessed unauthorised or if you have
    fallen victim to an Authorised Push Payment (APP) scam, notify us immediately.
    We proactively support victims of APP scams and aim for a rapid resolution. For
    payment service complaints, we provide a final response within 15 business days.


    For your peace of mind, your deposits with us are protected by the Financial Services
    Compensation Scheme (FSCS). Eligible deposits are protected up to £120,000 per
    person. In specific circumstances involving temporary high balances, this protection
    can extend up to £1.4 million.


    To further secure your banking experience, we recommend reviewing our broader
    guidelines on account safety in Wrenfield Current Account — account security best
    practices.'
  domain: retail_banking
  product_category: regular_saver
  document_type: security_advisory
