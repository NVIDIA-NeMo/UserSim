  institution_id: wrenfield_bank
- id: 50134137-44f8-5aa8-8bd4-83f47381d055
  title: Wrenfield Easy Access Cash ISA — regulatory disclosures
  body: 'The Wrenfield Easy Access Cash ISA is provided by Wrenfield Bank. We operate
    under the strict authorisation of the Prudential Regulation Authority (PRA) and
    are regulated by the Financial Conduct Authority (FCA). This ensures that all
    customers are treated fairly and that our products meet rigorous industry standards.


    **Deposit Protection**

    Your deposits are protected by the Financial Services Compensation Scheme (FSCS).
    Eligible deposits are protected up to £120,000 per person. In the event of a temporary
    high balance (such as from a house sale), protection is extended up to £1.4 million
    for a limited period.


    **Tax Treatment**

    This account is an Individual Savings Account (ISA). The 2.85% interest earned
    is currently exempt from UK income tax. However, tax treatment depends on your
    individual circumstances and may be subject to change in the future. We provide
    general financial information, but we do not offer individualised tax or legal
    advice.


    **Allowance Changes**

    Customers are advised that the government sets the annual limits for ISA contributions.
    While the current allowance is £20,000, please be aware that the cash ISA allowance
    is scheduled to be £12,000 from April 2027. Exceeding these limits may result
    in the account losing its tax-exempt status or the bank rejecting further deposits.


    **Complaints and Disputes**

    We aim for a rapid resolution of any issues. For payment service complaints, we
    provide a final response within 15 business days. All other disputes are handled
    within eight weeks. If a resolution cannot be reached, customers have the right
    to escalate their case to the Financial Ombudsman Service.'
  domain: retail_banking
  product_category: cash_isa
