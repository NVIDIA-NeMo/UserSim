- id: dc7ba8d5-f8f0-5119-a549-3536767e2397
  title: Wrenfield Two-Year Fixed Mortgage — a failed or pending action
  body: 'Symptom: You have applied for a mortgage, but the status is listed as ''Pending''
    or you have received a notice that the action has ''Failed''.


    Likely Causes:

    1. Outstanding Documentation: We may be missing critical identity or income verification
    documents required for our ''verify-first'' security stance.

    2. LTV Threshold Exceeded: The professional valuation of the property may have
    resulted in a Loan to Value ratio higher than our maximum of 90%.

    3. Affordability Concerns: The initial assessment may have indicated that the
    loan amount exceeds sustainable limits, which would cause a failure to prevent
    foreseeable harm.


    What to check in order:

    1. Review your application checklist to ensure every requested document has been
    submitted and verified.

    2. Verify the property valuation figure; if the LTV is above 90%, consider increasing
    your deposit to meet the requirement.

    3. Confirm that all income figures provided are current and supported by recent
    payslips.


    Resolution:

    If the issue is related to documentation, provide the missing evidence and we
    will update the status. If the LTV is the primary cause, you may ask us to recalculate
    the loan based on a higher deposit.


    Escalation:

    If the application remains pending without a clear cause, we will route the case
    to a senior management underwriter for manual review. You will receive a final
    response regarding the decision within eight weeks.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 807cf952-ea3e-5a8f-908d-c9215706b3b2
  title: Wrenfield Two-Year Fixed Mortgage — eligibility requirements
  body: 'The following matrix outlines the requirements for eligibility for the Wrenfield
    Two-Year Fixed Mortgage. This is used for new applications and for existing customers
    reviewing product switches.


    | Requirement | Criteria | Outcome |

    | :--- | :--- | :--- |

    | Loan to Value (LTV) | 90% or lower | Eligible for consideration |

    | Loan to Value (LTV) | Above 90% | Ineligible |

    | Affordability Assessment | Pass | Eligible for consideration |

    | Affordability Assessment | Fail | Ineligible |

