  title: Wrenfield Easy Access Cash ISA — interest rate / AER schedule
  body: 'The Wrenfield Easy Access Cash ISA features a simplified interest structure
    to ensure transparency and fairness for all our retail customers.


    **Current Interest Rate**

    - **Annual Interest Rate:** 2.85%

    - **AER:** 2.85%


    **Application of Rates**

    This is a flat rate that applies to all balances within the account. There are
    no tiers or minimum balance requirements to earn this rate. Interest is calculated
    daily and credited to the account annually.


    **Rate Changes**

    The 2.85% rate is variable. This means that while we strive for stability, the
    rate may change based on wider market conditions or changes in the Bank of England
    base rate. If we decide to adjust the rate, we will notify you through our standard
    communication channels in accordance with the Consumer Duty to ensure you are
