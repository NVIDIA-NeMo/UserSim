- id: 61ac81a7-9667-538a-9194-3a7c1864f3ea
  title: Wrenfield Two-Year Fixed Mortgage — who it is best for and common use cases
  body: 'The Wrenfield Two-Year Fixed Mortgage is designed for retail customers who
    prioritise stability and budget certainty over a short-to-medium term horizon.
    By locking in a fixed rate, you protect yourself from the volatility of the wider
    financial markets for twenty-four months.


    This product is particularly well-suited for:

    - First-time buyers who need a predictable monthly payment while they establish
    their home-owning budget.

    - Homeowners who expect interest rates to rise in the near future and wish to
    hedge against higher costs.

    - Those with a deposit that aligns with our maximum LTV of 90%, allowing for a
    lower entry barrier to property ownership.


    Key Product Specifications:

    - Fixed Interest Rate: 5.64%

    - Duration of Fix: 2 Years

    - Product Fee: £999

    - Maximum LTV: 90%

    - APRC: 7.4%

    - Overpayment Allowance: 10% per annum

    - Post-Fix Rate: Standard Variable Rate of 7.49%


    Common use cases include bridging the gap until a homeowner expects a significant
    increase in income or until they anticipate a change in the economic climate that
    might make a longer-term fix more attractive. Because we provide a transparent
    fee structure and a commitment to the Consumer Duty, this mortgage serves as a
    dependable foundation for those who value a professional, high-street banking
    experience without hidden costs.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: product_sheet
  source_authority: official
