- id: 60f6f7cf-bd65-585f-b6d4-22ee809bc0ff
  title: Wrenfield Regular Saver — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our highest priority. As
    an existing holder of a Wrenfield Regular Saver, we ask that you remain vigilant
    and adhere to the following security best practices to protect your funds and
    personal information.


    **Our ''Verify-First'' Commitment**

    We maintain a rigorous verify-first stance. This means we will always require
    full identity authentication before performing any state-changing action or disclosing
    account information. Please be aware that Wrenfield Bank will never ask you to
    disclose your full password, PIN, or security codes over the telephone or via
    email.


    **Recognising Fraudulent Patterns**

    Be cautious of ''urgent'' requests for funds or prompts to move your savings into
    a ''safe account''. A genuine request from us will never pressure you into making
    an immediate transfer to a new account to avoid a security breach. If you receive
    a communication that seems suspicious, do not click any links or provide personal
    data.


    **Your Protections**

    We operate under the strict authorisation of the PRA and regulation by the FCA.
    Your eligible deposits in the Wrenfield Regular Saver are protected by the FSCS
    up to £120,000 per person, with temporary high balances protected up to £1.4 million.
    This ensures that your hard-earned savings remain secure.


    **Immediate Actions**

    If you suspect unauthorised access to your account or believe you have fallen
    victim to a scam, please notify us immediately. For payment service complaints
    or fraud reports, we aim for rapid resolution, providing final responses within
    15 business days. The sooner we are alerted, the more effectively we can secure
    your remaining balance and initiate the recovery process. Remember, we will never
    ask you to move your money to a different institution to ''protect'' it from a
    fraudster.'
  domain: retail_banking
  product_category: regular_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 996225e2-a47a-582c-bb19-82078a52cbb0
  title: Wrenfield Regular Saver — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of the Wrenfield Regular Saver. For customers comparing our offerings against
    alternatives, it is important to understand how we maintain transparency and stability
    in our product terms.


    **Notification of Changes**

    We reserve the right to amend the terms of the Wrenfield Regular Saver, including
    the interest rate of 6%, the maximum monthly deposit of £300, or the term of 12
    months. We commit to providing customers with clear and prominent notice of any
    such changes. Notice will be delivered via your preferred communication channel
    (digital or postal) and will be provided with a minimum of 30 days'' notice before
    the change takes effect.


    **Interest Rate Adjustments**

    While we strive for stability, the 6% interest rate may be subject to change based
    on market conditions or regulatory requirements. If the rate changes, we will
    notify you of the new rate and the date from which it will apply to your balance.


    **Deposit and Term Limits**

    The maximum monthly deposit of £300 is a binding limit of the account. Any attempt
    to deposit funds exceeding this amount may result in the excess being returned
    to your nominated account. The 12-month term is the fixed duration of the savings
    cycle; changes to this duration would require the opening of a new account under
    the then-current terms.


    **Customer Rights**

    If you do not agree to a change in terms, you have the right to close your account.
    We will handle such requests in accordance with our standard closure procedures,
    ensuring that any accrued interest is paid out fairly. All changes are governed
    by the Consumer Duty, ensuring that we treat our customers fairly and avoid foreseeable
    harm.'
  domain: retail_banking
  product_category: regular_saver
  document_type: terms_conditions
  source_authority: official
