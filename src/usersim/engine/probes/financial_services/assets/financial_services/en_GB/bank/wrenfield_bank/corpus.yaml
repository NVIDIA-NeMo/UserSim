- id: 1c1f4a43-4030-54f8-a3ee-d6610d08dd54
  title: Wrenfield Easy Access Cash ISA — vs. a similar product here
  body: 'When deciding where to place your savings, it is helpful to compare the Wrenfield
    Easy Access Cash ISA with our Wrenfield Everyday Saver. Both offer flexibility
    and stability, but they serve different financial purposes.


    **Wrenfield Easy Access Cash ISA**

    - **Interest Rate:** 2.85%

    - **Tax Status:** Tax-free. You do not pay income tax on the interest earned.

    - **Key Limit:** Subject to an annual deposit limit of £20,000.

    - **Best For:** Customers looking for long-term, tax-efficient growth who want
    to avoid tax on their interest.


    **Wrenfield Everyday Saver**

    - **Interest Rate:** Refer to the Wrenfield Everyday Saver — overview for current
    rates.

    - **Tax Status:** Taxable. Interest is subject to your personal tax allowance.

    - **Key Limit:** No annual deposit limit; requires only a £1 minimum opening deposit.

    - **Best For:** Customers who need a simple place for emergency funds or who have
    already utilised their annual ISA allowance.


    In summary, if you have not yet used your £20,000 allowance, the Easy Access Cash
    ISA is generally the more advantageous choice due to its tax-exempt status and
    2.85% rate.'
  domain: retail_banking
  product_category: cash_isa
  document_type: comparison
  source_authority: official
