- id: 7926ee45-7439-5196-9794-68c6b70d894f
  title: Wrenfield Regular Saver — vs. a typical competitor offering
  body: 'When comparing the Wrenfield Regular Saver to typical high-street competitor
    offerings, the primary trade-offs are between the interest rate and the deposit
    flexibility.


    Dimensions of Comparison:

    - Interest Rate: We offer a competitive 6% interest rate. Many typical competitors
    offer lower rates for their regular saver products, though some may offer higher
    rates for much smaller monthly caps.

    - Deposit Limit: Our maximum monthly deposit is £300. Competitors often vary this
    limit; some may allow higher monthly deposits but at a significantly lower interest
    rate.

    - Term: Our account has a fixed 12-month term. This is standard across the industry
    for regular saver products.

    - Stability: As a PRA authorised and FCA regulated institution, we provide stability
    and the protection of the FSCS up to £120,000 per person.


    Who each suits:

    - The Wrenfield Regular Saver is best for those who want a high, stable yield
    (6%) on a moderate monthly saving amount (£300) over a full year.

    - A competitor product may be better if you require the ability to deposit significantly
    more than £300 per month and are willing to accept a lower interest rate in exchange
    for that capacity.'
