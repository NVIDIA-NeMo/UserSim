- id: d6420c61-401b-5f65-80a3-48b5b7e34a08
  title: Wrenfield Personal Loan — set up and activate
  body: 'Setting up a Wrenfield Personal Loan is a straightforward process designed
    to ensure we lend responsibly while providing you with rapid access to funds.
    Please follow these steps to apply for and activate your loan.


    Before you begin, please ensure you have your National Insurance number, proof
    of address, and recent income details (such as payslips or tax returns) available.


    1. Request your loan amount: Tell us the amount you wish to borrow, up to the
    maximum loan amount of £35,000, and the duration you require for repayment (for
    example, 60 months).

    2. Provide identity verification: We will ask you to provide full identity authentication.
    This is part of our ''verify-first'' security stance to protect your assets and
    prevent unauthorised access.

    3. Complete the affordability assessment: We will review your financial circumstances.
    This is a mandatory step where we assess your income and expenditure to ensure
    the loan is affordable and will not cause you foreseeable harm.

    4. Review your personalised offer: Once we have assessed your application, we
    will provide you with a formal offer. This will include your specific APR, the
    monthly repayment amount, and the total amount payable. If you are offered the
    representative rate, this would be 6.9%.

    5. Sign the loan agreement: If you are happy with the terms, confirm your acceptance.
    You will then receive a copy of the agreement for your records.

    6. Receive your funds: Once the agreement is signed and verified, we will disburse
    the funds to your nominated account. You will receive a confirmation message once
    the transfer is complete.


    You will know the process is successful when the loan balance appears in your
    account overview and the first repayment date is confirmed. Remember that you
    have a 14-day right to withdraw from the agreement should you change your mind
    after the funds have been deposited.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7b66d6d0-4976-5fc7-bb70-3a8745ac7304
  title: Wrenfield Personal Loan — fee schedule
  body: 'At Wrenfield Bank, we believe in fair and transparent pricing. For the Wrenfield
    Personal Loan, we do not charge hidden administration or setup fees; the costs
    associated with the loan are integrated into the interest rate.


    - Loan Application Fee: £0

    - Monthly Account Maintenance Fee: £0

    - Representative APR (Cost of Credit): 6.9%

    - Early Repayment Charges: None (we allow you to settle your balance at any time
    without penalty)


    For customers using the loan in conjunction with a Wrenfield Current Account,
    there is a £0 monthly account fee for that account.


    As a reminder, we honour a 14-day right to withdraw, allowing customers to return
    the loan principal without penalty within two weeks of the agreement start date.
    If you have queries regarding specific payment disputes, please refer to our general
    dispute and fraud handling policies.'
  domain: lending_mortgage
