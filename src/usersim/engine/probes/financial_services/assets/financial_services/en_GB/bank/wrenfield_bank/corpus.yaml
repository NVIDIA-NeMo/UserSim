- id: c426b516-7933-50be-8bde-f73f11de8420
  title: Wrenfield Two-Year Fixed Mortgage — product fee explained
  body: 'Q: What is the product fee for the Wrenfield Two-Year Fixed Mortgage?

    A: The Wrenfield Two-Year Fixed Mortgage carries a one-time product fee of £999.
    This fee is used to cover the operational costs of setting up the mortgage and
    the regulatory risk associated with the lending process.


    Q: How is the £999 fee paid?

    A: You can choose to pay this fee upfront upon completion of your mortgage. Alternatively,
    if you prefer, we can add the £999 fee to your total loan balance, although this
    may increase the amount of interest you pay over the life of the mortgage.


    Q: Is this fee refundable if my application is unsuccessful?

    A: The product fee is typically applied upon the successful completion of the
    mortgage. Please refer to Wrenfield Two-Year Fixed Mortgage — eligibility requirements
    for more information on the qualification process.'
  domain: lending_mortgage
