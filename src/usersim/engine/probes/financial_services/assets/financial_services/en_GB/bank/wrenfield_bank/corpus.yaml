- id: 6a1d3436-d65a-5a50-b751-221cf916677a
  title: Wrenfield Rewards Credit Card — required documentation
  body: 'To apply for the Wrenfield Rewards Credit Card, all prospective customers
    must provide the following documentation to satisfy our ''verify-first'' security
    stance and PRA/FCA regulatory requirements:


    | Document Category | Requirement | Outcome of Failure |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Photocard Driving Licence | Application
    paused until verified |

    | Proof of Address | Utility bill or Council Tax statement (dated within 3 months)
    | Unable to proceed with application |

    | Income Verification | 3 months of consecutive payslips or most recent P60 |
    Subject to affordability assessment failure |

    | Residency Status | Confirmation of permanent UK residency | Ineligible for this
    product |


    All documentation is used to conduct a strict affordability assessment. This ensures
    that the representative APR of 24.9% and the credit limit (based on the £1,200
    assumed example) are appropriate for the customer''s financial situation.'
