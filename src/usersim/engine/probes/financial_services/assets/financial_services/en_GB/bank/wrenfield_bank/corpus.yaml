- id: 3843a11a-0747-517e-bdd7-0e9aa3d9a799
  title: Wrenfield Easy Access Cash ISA — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our highest priority. Because
    the Wrenfield Easy Access Cash ISA is designed for stability, it can sometimes
    be targeted by sophisticated fraud patterns. We urge all customers to remain vigilant
    to ensure their savings remain protected.


    Common threats include ''spoofing'' calls, where fraudsters pretend to be from
    our security team, claiming there is a problem with your ISA allowance of £20,000.
    They may pressure you to move your funds to a ''safe account'' to avoid a freeze.
    Please remember: Wrenfield Bank will never ask you to move your money to another
    account for security reasons, nor will we ever ask for your full security credentials
    over the phone.


    To maintain the integrity of your account, we follow a rigorous ''verify-first''
    stance. We will always require full identity authentication before any state-changing
    action or disclosure of account information occurs. This process is in place to
    prevent unauthorised access and protect your 2.85% interest-bearing balance.


    If you notice any unusual activity or receive a suspicious request, tell us immediately.
    Rapid reporting is essential to mitigate potential loss. For your peace of mind,
    please be aware that eligible deposits are protected by the FSCS up to £120,000
    per person, with temporary high balances protected up to £1.4 million.


    For more information on how we protect your data, please refer to the Wrenfield
    Easy Access Cash ISA — privacy and data handling document.'
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 5d9b1577-52eb-5409-bd19-0c73023265f2
  title: Wrenfield Easy Access Cash ISA — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of the Wrenfield Easy Access Cash ISA. We strive for transparency and stability,
    ensuring that any modifications to your account are communicated clearly and fairly.


    Interest Rates: The current annual interest rate of 2.85% is variable. This means
    we may increase or decrease the rate based on market conditions or changes in
    the regulatory environment. We will notify you of any significant rate changes
    through your preferred communication channel, ensuring you have sufficient time
    to review the impact on your savings.


    Allowances: The ISA allowance is subject to UK government legislation. While the
    current allowance is £20,000, we will update the account terms should the government
    change these limits. Specifically, customers should be aware of planned legislative
    shifts affecting those under 65, which we detail in our dedicated guidance.


    Notice Periods: For any changes to fees or fundamental account obligations, we
    will provide you with a minimum of 30 days'' notice before the changes take effect.
    If you do not agree to the new terms, you have the right to close your account
    without penalty before the change date.


    Account Closure: You may close your account at any time. We will ensure that all
    accrued interest, calculated at the applicable 2.85% rate up to the date of closure,
    is paid out in full. Any funds exceeding the current statutory allowance of £20,000
    that were deposited in error may be subject to HMRC correction, as required by
    law.'
  domain: retail_banking
  product_category: cash_isa
