- id: 413931aa-da17-5d53-b05f-f08e3cc094ce
  title: Wrenfield Two-Year Fixed Mortgage — set up and activate
  body: 'If you are comparing our options against other alternatives, here is the
    process for securing and activating the Wrenfield Two-Year Fixed Mortgage.


    1. Request a mortgage quote: Provide us with your current income details and the
    estimated value of the property you wish to purchase or refinance.

    2. Undergo an affordability assessment: We will conduct a thorough review of your
    finances to ensure the loan is sustainable and to avoid foreseeable harm, as part
    of our commitment to the Consumer Duty.

    3. Complete identity verification: We maintain a ''verify-first'' stance; you
    will need to provide full identity authentication and proof of address before
    we proceed.

    4. Arrange a property valuation: We will coordinate a valuation of the property
    to ensure the Loan to Value (LTV) ratio does not exceed our maximum limit of 90%.

    5. Pay the product fee: Once the application is approved, you must pay the product
    fee of £999 to activate the mortgage.

    6. Sign the final offer: After legal checks are completed and you have signed
    the offer documents, we will confirm that your mortgage is active.


    Your mortgage will then begin with the initial fixed rate of 5.64%. You will receive
    a confirmation notice detailing your repayment schedule and the date on which
    the loan will eventually transition to the standard variable rate of 7.49%.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: how_to_guide
  source_authority: official
