- id: abf928bb-8504-57aa-a516-83fd39e3613c
  title: Wrenfield Everyday Saver — minimum deposit to open explained
  body: 'Q: How much money do I need to open a Wrenfield Everyday Saver account?

    A: We believe essential banking should be accessible to everyone. Therefore, the
    minimum opening deposit required to open this account is just £1.


    Q: If I have already opened the account, can I drop my balance below £1?

    A: Yes. While a minimum opening deposit of £1 is required to activate the account,
    there is no minimum balance requirement to keep the account open thereafter.


    Q: Can I open the account without any initial deposit?

    A: No. To comply with our account opening procedures, a deposit of £1 must be
    made at the time of opening to establish the account.


    For more details on getting started, you may wish to review the Wrenfield Everyday
    Saver — overview.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: faq
  source_authority: official
  placeholder: true
