- id: a0f4fe99-0c64-58e9-ba7b-59ba8664e30e
  title: Wrenfield Two-Year Fixed Mortgage — vs. a similar product here
  body: 'When choosing between the Wrenfield Two-Year Fixed Mortgage and a variable-rate
    option, such as one based on our standard variable rate of 7.49%, the decision
    typically rests on your preference for stability versus flexibility.


    Wrenfield Two-Year Fixed Mortgage:

    - Rate: Fixed at 5.64% for two years.

    - Cost: Requires a £999 product fee.

    - Lock-in: Early repayment charges of 3% (Year 1) and 2% (Year 2) apply.

    - Best for: Customers who want to lock in their monthly costs and protect themselves
    from interest rate rises for two years.


    Variable Rate Option:

    - Rate: Currently 7.49% (subject to change).

    - Cost: Typically lower or no initial product fee.

    - Lock-in: No early repayment charges; higher flexibility to pay off the loan.

    - Best for: Customers who anticipate paying off the mortgage quickly or those
    who prefer not to pay an upfront product fee.


    Both options are subject to our maximum LTV of 90% and a strict affordability
    assessment.'
