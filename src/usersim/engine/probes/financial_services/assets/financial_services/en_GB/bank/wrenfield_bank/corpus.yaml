- id: 2edb0d30-bef8-5c91-84ee-899fe89b562d
  title: Wrenfield Everyday Saver — vs. a similar product here
  body: 'When deciding how to save with us, customers often compare the Wrenfield
    Everyday Saver with the Wrenfield Regular Saver. The choice depends entirely on
    your saving goals and the amount of capital you have available.


    Wrenfield Everyday Saver:

    - Opening Deposit: Only £1

    - Interest Rate: 2.1%

    - Flexibility: High; no limits on how much you can deposit monthly.

    - Best for: Customers who want a low-barrier, flexible account for general savings.


    Wrenfield Regular Saver:

    - Deposit Limits: Maximum monthly deposit of £300.

    - Interest Rate: Typically higher for short-term goals.

    - Flexibility: Lower; designed for disciplined, monthly contributions.

    - Best for: Customers with a steady monthly surplus who are saving for a specific
    short-term goal.


    If you require an account that allows you to deposit any amount at any time with
    a very low entry cost of £1, the Wrenfield Everyday Saver is the superior choice.
    If you are looking for a high-interest vehicle and can commit to a maximum of
    £300 per month, the Wrenfield Regular Saver may be more appropriate.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7867d8a9-9681-5c66-a76f-a3884db7879c
  title: Wrenfield Everyday Saver — regulatory disclosures
  body: 'The Wrenfield Everyday Saver is provided by Wrenfield Bank, a dependable
    high-street institution. We operate under the strict authorisation of the Prudential
    Regulation Authority (PRA) and are regulated by the Financial Conduct Authority
    (FCA). These regulatory frameworks ensure that we maintain high standards of capital
    adequacy and treat all customers fairly in accordance with the Consumer Duty.


    Security of Funds: We understand that the safety of your deposits is paramount.
    All eligible deposits held in the Wrenfield Everyday Saver are protected by the
    Financial Services Compensation Scheme (FSCS). This protection covers up to £120,000
    per person. In the event of temporary high balances (such as the proceeds from
    a house sale), protection is extended up to £1.4 million for a limited period.


    Verification Policy: To prevent unauthorised access and protect your assets, Wrenfield
    Bank maintains a rigorous ''verify-first'' stance. We require full identity authentication
    before any state-changing action is performed on the account or before any account
    information is disclosed to a third party. This protocol is essential for the
    security of your funds and the prevention of fraud.


    Interest and Rates: The current interest rate of 2.1% is variable and subject
    to change. We provide general financial education and product information; however,
    please be advised that we do not offer individualised tax or legal advice. Customers
    are responsible for understanding how interest earned on the Wrenfield Everyday
    Saver affects their personal tax liabilities.


    Dispute Resolution: We aim for rapid resolution of all concerns. For payment service
    complaints, we provide final responses within 15 business days. All other disputes
    are handled within eight weeks. If a resolution cannot be reached through our
    internal escalation path to senior management, customers have the right to refer
    their case to the Financial Ombudsman Service. For more details on the terms of
    use, see the Wrenfield Everyday Saver — account agreement.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9b994696-7ea9-5be3-aa95-dad7523b4256
  title: Wrenfield Everyday Saver — interest rate / AER schedule
  body: 'The Wrenfield Everyday Saver features a simplified interest structure to
    ensure transparency and ease of understanding for all our customers.


    - Current Interest Rate: 2.1%

    - Rate Type: Variable

    - Application: This rate applies to all balances held within the account, regardless
    of the total amount. There are no tiered interest levels; every pound in your
    account earns the same 2.1% AER.


    Interest is calculated on a daily basis and is credited to the account periodically.
    Because the rate is variable, we reserve the right to adjust it to reflect changes
    in the market or the Bank of England base rate. We will notify you of any such
    changes via your preferred contact method. For a detailed explanation of how this
    rate affects your savings, please see the Wrenfield Everyday Saver — interest
    rate (AER) explained.'
