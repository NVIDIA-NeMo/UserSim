- id: f0fad887-25c2-553f-ac1e-19ed3e0d91ab
  title: Wrenfield Two-Year Fixed Mortgage — interest rate / AER schedule
  body: 'The following interest rates apply to the Wrenfield Two-Year Fixed Mortgage:


    - Initial Fixed Rate: 5.64%

    This rate is fixed for the first two years of the mortgage term and applies to
