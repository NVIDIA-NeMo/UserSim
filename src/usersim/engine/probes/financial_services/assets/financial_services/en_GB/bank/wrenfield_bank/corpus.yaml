  institution_id: wrenfield_bank
- id: 0d6e585c-2670-51fc-8a7f-e67cb75a8f58
  title: Wrenfield Two-Year Fixed Mortgage — recognising scams targeting this product
  body: 'As you compare your mortgage options, it is important to remain vigilant
    against fraudulent activity. Scammers often target those in the process of securing
    a home loan by impersonating bank officials or legal representatives to steal
    personal data or funds.


    Common patterns targeting the Wrenfield Two-Year Fixed Mortgage include ''urgent''
    requests to pay a processing fee or a deposit into a new, unverified account to
    ''secure'' the 5.64% fixed rate. You may also receive emails or texts claiming
    that your application has been blocked due to a security breach and requesting
    your full security credentials to resolve it.


    At Wrenfield Bank, we maintain a rigorous ''verify-first'' stance. Please be aware
    that we will never ask you for your full online banking password, your PIN, or
    request that you move money to a ''safe account'' for verification purposes. We
    will never pressure you to make an immediate payment via a link in a text message
    to maintain a specific interest rate.


    If you encounter any communication that feels suspicious, the first action you
    should take is to cease all contact with the sender immediately. We recommend
    that you notify us through our official channels as soon as possible. For those
    who have already fallen victim to an Authorised Push Payment (APP) scam, we provide
    proactive support to help recover funds. To ensure the best possible chance of
    recovery and to limit your liability, we urge you to report the incident to us
    within 24 hours of the occurrence.


    For more general information on protecting your assets, you may wish to review
    Wrenfield Two-Year Fixed Mortgage — fraud and unauthorised-activity protection.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: security_advisory
