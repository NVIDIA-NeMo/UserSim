- id: 7c747679-549f-5516-b17c-d522b66ac51a
  title: Wrenfield Current Account — qualification tiers
  body: 'This matrix is for support agents to determine the qualification level for
    the Wrenfield Current Account. As this is a standardised retail product, there
    is a single qualification tier for all applicants.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a legal resident of the United Kingdom | Eligible for account
    opening |

    | Age | Must be 18 years of age or older | Eligible for account opening |

    | Identity | Must provide valid, government-issued ID | Account activation permitted
    |

    | Credit Assessment | Standard check for basic account | Eligible for £0 monthly
    fee account |

    | Credit Assessment | Strict affordability assessment | Eligible for arranged
    overdraft at 39.9% |


    All customers who meet these criteria are eligible for the Wrenfield Current Account
    and the associated £175 switching incentive if they use the Current Account Switch
    Service. For more detailed documentation requirements, see Wrenfield Current Account
    — required documentation.'
