- id: cbcb521a-00f5-5caf-ad34-f2714b0ae4eb
  title: Wrenfield Rewards Credit Card — fraud and unauthorised-activity protection
  body: "At Wrenfield Bank, we prioritise the security of your assets and the integrity\
    \ of your account. The Wrenfield Rewards Credit Card is protected by our rigorous\
    \ 'verify-first' stance; we will never disclose your account information or perform\
    \ state-changing actions without full identity authentication. \n\nOne of the\
    \ primary advantages of choosing our rewards card over alternatives is the legal\
    \ protection provided by Section 75 of the Consumer Credit Act. We ensure that\
    \ for any purchase made between £100 and £30,000, the bank is jointly liable with\
    \ the retailer. This means if the goods are faulty or the supplier goes out of\
    \ business, we can help you recover your money, providing a layer of security\
    \ that debit cards cannot match.\n\nWe are also proactively committed to supporting\
    \ victims of Authorised Push Payment (APP) scams. While credit cards are inherently\
    \ secure, fraudsters often use social engineering to trick customers into sharing\
    \ security codes or making payments. Please remember: we will never ask you for\
    \ your full PIN or password over the phone or via email.\n\nIf you notice any\
    \ unauthorised activity on your statement, or if you believe your card details\
    \ have been compromised, you must notify us immediately. Rapid reporting is essential\
    \ to limit your liability for fraudulent transactions. Once notified, we aim for\
    \ a rapid resolution of payment service complaints, providing a final response\
    \ within 15 business days. \n\nTo keep your account secure, we recommend reviewing\
    \ your transactions regularly through our digital channels. If you suspect fraud,\
    \ the first action you should take is to inform us so we can freeze the card and\
    \ prevent further unauthorised access. For more information on how we protect\
    \ your funds across all our products, you may wish to refer to Wrenfield Current\
    \ Account — fraud and unauthorised-activity protection."
