- id: cb1d2b8a-56a9-5b7b-ac76-4cb667e81c62
  title: Wrenfield Easy Access Cash ISA — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the transfer of an existing
    Cash ISA from another financial institution into a Wrenfield Easy Access Cash
    ISA. To ensure your savings remain tax-free, this must be done through a formal
    transfer process rather than a manual withdrawal and deposit.


    **What you will need before starting**

    - The name of your current ISA provider.

    - Your existing ISA account number.

    - The approximate balance you wish to transfer.


    **Steps to complete the ISA transfer**


    1. **Request an ISA transfer:** Tell us that you wish to move an existing Cash
    ISA from another provider to Wrenfield Bank. We will start the transfer application
    for you.


    2. **Provide provider details:** Give us the name of your current bank and your
    account number. We will use this information to contact the other institution
    and request the funds.


    3. **Specify the transfer amount:** Tell us if you wish to transfer the entire
    balance or only a specific portion. We will confirm the requested amount and explain
    that this does not count towards your £20,000 annual allowance for the current
    tax year.


    4. **Confirm the new account terms:** We will confirm that your transferred funds
    will be placed into a Wrenfield Easy Access Cash ISA and will earn an interest
    rate of 2.85%.


    5. **Await confirmation of receipt:** We will manage the communication with your
    previous provider. Once the funds have arrived, we will notify you that the transfer
    is complete and the balance is now available in your account.


    **How you know it worked**

    You will receive a final notification from us confirming that the funds have been
    successfully moved and that your new Wrenfield Easy Access Cash ISA is active
    with the correct balance and a 2.85% interest rate.


    If you have questions about the limits of your new account, please refer to Wrenfield
    Easy Access Cash ISA — limits, restrictions, and edge cases.'
  domain: retail_banking
  product_category: cash_isa
