  institution_id: wrenfield_bank
- id: 32160e11-458b-528a-9a7f-b339f0b92c27
  title: Wrenfield Rewards Credit Card — recognising scams targeting this product
  body: 'At Wrenfield Bank, we are committed to the security of your assets. Because
    the Wrenfield Rewards Credit Card is a popular choice for retail customers, it
    can sometimes be targeted by fraudsters using sophisticated methods to gain unauthorised
    access to your funds.


    One common pattern is the ''urgent alert'' scam. You may receive a phone call,
    text, or email claiming there has been suspicious activity on your card—perhaps
    a large transaction that you did not authorise. The scammer will often attempt
    to create a sense of panic, urging you to ''verify'' your identity or move your
    balance to a ''safe account'' to protect it. Please be aware that we will never
    ask you to transfer money to a different account for security purposes, nor will
    we ask for your full PIN or password over the phone.


    Another risk involves Authorised Push Payment (APP) scams, where you are tricked
    into making a payment to an account that the fraudster controls. We proactively
    support victims of APP scams, but the first and most effective line of defence
    is a ''verify-first'' approach. If you receive any unexpected communication claiming
    to be from us, hang up and contact us through our official telephone banking channels
    or visit a branch.


    If you believe you have fallen victim to a scam or have noticed unauthorised transactions
    on your Wrenfield Rewards Credit Card, you must notify us immediately. This allows
    us to freeze the card and begin an investigation. For any complaints regarding
    payment services, we aim to provide a final response within 15 business days.


    To further protect your spending, remember that your card offers Section 75 protection
    for qualifying purchases. However, this legal protection does not apply if you
    have been coerced into sending money via a direct bank transfer to a fraudster.
    Always ensure you are using the secure card payment mechanism for high-value purchases
    to maintain this layer of security.'
  domain: cards
  product_category: credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9506554a-0740-55e5-b4eb-9131d2ba0cab
  title: Wrenfield Rewards Credit Card — limits, restrictions, and edge cases
  body: 'This document provides technical guidance for support agents regarding the
    operational boundaries of the Wrenfield Rewards Credit Card.


    **Credit Limits and APR**

    The representative APR for this product is 24.9%. In our representative examples,
    we use an assumed credit limit of £1,200. However, actual limits are determined
    by a strict affordability assessment during the application process to avoid foreseeable
    harm to the customer. If a customer requests a limit increase, they must undergo
    a new assessment.


    **Transaction Restrictions and Protections**

    Customers benefit from Section 75 protection under the Consumer Credit Act. This
    makes Wrenfield Bank jointly liable for purchases made on the card between £100
    and £30,000. This protection does not apply to cash withdrawals or payments below
    £100.


    **Balance Transfers**

    The card allows customers to transfer balances from other providers. This action
    incurs a balance transfer fee of 3.49% of the amount transferred. Once the transfer
    is complete, the balance is subject to a 0% introductory period for 24 months.
    Agents should clarify that any balance remaining after 24 months will accrue interest
    at the standard rate.


    **International Usage**

    Transactions made in a currency other than sterling are permitted, but they attract
    a foreign transaction fee of 2.99%. This fee is applied to the converted GBP amount.


    **Edge Cases**

    - **Over-limit transactions:** If a customer exceeds their assigned limit (e.g.,
    the £1,200 assumed limit), the transaction may be declined. We maintain a ''verify-first''
    stance for any manual overrides of security blocks.

    - **Direct Debit Guarantee:** While the card is a credit product, any associated
    direct debits for repayment are covered by the Direct Debit Guarantee, ensuring
    immediate refunds if an error occurs in the collection process.'
  domain: cards
  product_category: credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 99f10e7e-7261-5282-acbc-ce2abf21a882
  title: Wrenfield Rewards Credit Card — 0% balance transfer period (months) explained
  body: '**How long does the 0% balance transfer period last?**

    If you transfer a balance from another credit provider to your Wrenfield Rewards
    Credit Card, you will pay 0% interest on that specific balance for 24 months from
    the date of the transfer.


    **Is there a cost to transfer my balance?**

    Yes. While you will not pay interest on the transferred amount for the first 24
    months, there is a balance transfer fee of 3.49% of the total amount you choose
    to transfer. This fee is applied at the time of the transfer.


    **What happens after the 24 months end?**

    Once the 0% introductory period expires, any remaining balance from the transfer
    will begin to accrue interest at the standard representative APR of 24.9%.


    For more information on how this fits with your overall costs, you can refer to
    the Wrenfield Rewards Credit Card — fee schedule.'
  domain: cards
  product_category: credit_card
