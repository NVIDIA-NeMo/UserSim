    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a resident of the United Kingdom | Eligible |

    | Existing Relationship | Must hold an active Wrenfield Current Account | Eligible
    |

    | Deposit Limit | Monthly deposits must not exceed £300 | Account remains compliant
    |

    | Term Commitment | Agreement to the 12 month fixed term | Eligible |

