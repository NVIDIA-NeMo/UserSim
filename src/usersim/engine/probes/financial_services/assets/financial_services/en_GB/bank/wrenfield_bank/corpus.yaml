- id: 735693e8-e24f-5784-8a5e-66526db77f04
  title: Wrenfield Regular Saver — choosing between tiers or options
  body: 'When deciding how to save with us, the choice usually depends on whether
    you prefer flexibility or a higher rate of return. Here is how the Wrenfield Regular
    Saver compares to the Wrenfield Everyday Saver.


    **Wrenfield Regular Saver**

    *   **Interest Rate:** 6%

    *   **Deposit Limit:** Maximum monthly deposit of £300

    *   **Commitment:** Fixed term of 12 months

    *   **Best for:** Customers with a steady monthly surplus who want to maximise
    their interest over a year.


    **Wrenfield Everyday Saver**

    *   **Interest Rate:** Lower than the Regular Saver (see ''Wrenfield Everyday
    Saver — overview'')

    *   **Deposit Limit:** No monthly maximum

    *   **Commitment:** Flexible, no fixed term

    *   **Best for:** Customers who need immediate access to their funds or who wish
    to deposit large, irregular sums.


    If you are looking for the highest possible return on a disciplined monthly saving
    of up to £300, the Wrenfield Regular Saver is the superior choice. For general,
    accessible savings, the Everyday Saver is more appropriate.'
  domain: retail_banking
  product_category: regular_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 0d1df848-83bf-5c8f-9f23-e1d68e47c9b0
  title: Wrenfield Regular Saver — privacy and data handling
  body: 'As an existing customer of the Wrenfield Regular Saver, we wish to provide
    full transparency regarding how your data is handled and the regulatory framework
    that protects your assets.


    **Regulatory Oversight**

    Wrenfield Bank operates under the strict authorisation of the Prudential Regulation
    Authority (PRA) and is regulated by the Financial Conduct Authority (FCA). We
    adhere to these standards to ensure all customers are treated fairly and that
    our operations remain stable and transparent.


    **Data Collection and Use**

    We collect and process your personal and financial data solely to manage your
    account, verify your identity, and ensure the secure application of your 6% interest
    rate. This includes monitoring your monthly deposits to ensure they do not exceed
    the £300 maximum. We do not sell your data to third parties for marketing purposes.


    **Asset Protection**

    Your funds in the Wrenfield Regular Saver are protected by the Financial Services
    Compensation Scheme (FSCS). Eligible deposits are protected up to £120,000 per
    person, with temporary high balances protected up to £1.4 million. This provides
    a critical safety net for your savings over the 12-month term of the account.


    **Your Rights**

    Under UK data protection laws, you have the right to request access to the data
    we hold about you and to request corrections where information is inaccurate.
    We handle all such requests through our structured verification process to ensure
    that account information is never disclosed to unauthorised parties. For further
    details on our general approach to customer data, please refer to our institution-wide
    privacy policies.'
  domain: retail_banking
  product_category: regular_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a053dd42-ae1d-518f-af18-c7c70e5b8e71
  title: Wrenfield Regular Saver — recognising scams targeting this product
  body: 'At Wrenfield Bank, we are committed to protecting your assets. Because the
    Wrenfield Regular Saver offers a competitive interest rate of 6%, it can sometimes
    be used as a lure by fraudsters attempting to mimic our services. We want to ensure
    you can distinguish our genuine communications from fraudulent attempts.


    Common scams targeting our savers often involve ''urgent'' messages via text or
    email claiming that your account has been suspended or that you are eligible for
    a ''bonus'' rate significantly higher than 6%. These messages often contain links
    to spoofed websites designed to steal your login credentials. Please remember
    that we will never ask you to move your money to a ''safe account'' or request
    your full PIN or password over the phone or via email.


    We maintain a rigorous ''verify-first'' stance. This means that before we perform
    any action that changes the state of your account or disclose sensitive information,
    we will require full identity authentication. If you receive a request that bypasses
    this standard or pressures you to act immediately, it is likely a scam.


    If you suspect you have been the victim of a scam or have shared your details,
    please inform us immediately. We proactively support victims of APP scams and
    aim for rapid resolution. For payment service complaints, we provide final responses
    within 15 business days. The sooner you report a suspicious interaction, the better
    the chance we have of securing your funds.


    When comparing our products with alternatives, always ensure you are dealing with
    a firm authorised by the PRA and regulated by the FCA. Your deposits with us are
    protected by the FSCS up to £120,000 per person, providing the stability and security
    you expect from a dependable high-street institution.'
  domain: retail_banking
  product_category: regular_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9590733d-835b-5926-875b-3d26a5a17128
  title: Wrenfield Regular Saver — limits, restrictions, and edge cases
  body: 'This document outlines the operational boundaries of the Wrenfield Regular
    Saver to assist support agents in guiding customers. This account is designed
    as a short-term goal-setting tool with a fixed term of 12 months.


    **Deposit Limits**

    The primary restriction on this account is the maximum monthly deposit of £300.
    This limit is absolute; any attempt to deposit funds exceeding £300 within a single
    calendar month will be declined. This ensures the product remains aligned with
    its purpose as a regular savings vehicle rather than a lump-sum investment account.


    **Interest Application**

    The account earns a competitive interest rate of 6%. Interest is calculated daily
    and credited to the account, allowing customers to see their savings grow consistently
    over the 12-month term.


    **Term and Maturity**

    The product has a fixed duration of 12 months. Upon the conclusion of this term,
    the account matures. At this point, the balance and accrued interest are typically
    transferred to the customer''s linked current account. Customers cannot extend
    the term of a specific Regular Saver account; to continue saving at the current
    rate, a new account must be opened if the product remains available.


    **Withdrawal Restrictions**

    As this is a regular saver intended for discipline and growth, withdrawals during
    the 12-month term may be restricted or may result in the closure of the account
    depending on the specific terms agreed at setup. Agents should refer customers
    to the account agreement for the specific impact of early withdrawals on the 6%
    interest earned.


    **Edge Cases**

    - **Over-depositing:** If a customer has a standing order for more than £300,
    the transaction will fail. The customer must adjust their standing order to £300
    or less.

    - **Account Closure:** If a customer closes their linked Wrenfield Current Account,
    the Regular Saver may be affected as it requires a hub account for funding.'
  domain: retail_banking
  product_category: regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 971b26bd-f5ff-5fb6-8d02-152da8697267
  title: Wrenfield Regular Saver — cost and charges
  body: '**Are there any monthly fees for holding a Wrenfield Regular Saver?**

    No. In line with our belief that essential banking should be accessible, there
    is no monthly account fee for the Wrenfield Regular Saver.


    **Is there a charge to open or close the account?**

    There are no charges to open or close a Wrenfield Regular Saver. We believe in
    transparent pricing and do not charge customers for the basic administration of
    this savings product.


    **Are there any penalties for not depositing the maximum amount each month?**

    There are no penalties if you deposit less than the maximum monthly deposit of
    £300, or if you miss a month entirely. Your interest rate of 6% will still apply
    to whatever balance is held in the account.


    For further details on how we price our products, you can review the Wrenfield
    Regular Saver — overview.'
  domain: retail_banking
  product_category: regular_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 47a13bb3-ab0d-575d-892c-cfd864b70ccc
  title: Wrenfield Regular Saver — check status or history
  body: 'If you are an existing customer, monitoring your progress towards your savings
    goal is simple. Follow these steps to check your current balance, interest earned,
    and deposit history for your Wrenfield Regular Saver.


    **What you will need:**

    - Your identity verification (to be completed during the interaction).

    - The account number of your Regular Saver (if not automatically linked to your
    profile).


    **Steps to check your status:**


    1. **Request an account summary:** Tell us that you would like to check the status
    of your Wrenfield Regular Saver. We will perform a security check to verify your
    identity first.

    2. **Review your current balance:** We will provide you with the total current
    balance of the account, including any interest accrued up to that date.

    3. **Request a transaction history:** Ask us for a list of your deposits for the
    current 12-month term. We will confirm how many months you have contributed and
    whether you have reached the maximum monthly deposit of £300 in those months.

    4. **Verify interest application:** Ask us to confirm the interest earned to date.
    We will verify that the 6% interest rate is being applied correctly to your balance.

    5. **Confirm maturity date:** Ask us for the exact date your 12-month term ends.
    We will provide the date the account will mature and the funds become fully available.


    **How you know it worked:**

    You will have a clear understanding of your total savings, the interest you have
    earned at the 6% rate, and exactly how many months remain until your 12-month
    term is complete.'
  domain: retail_banking
  product_category: regular_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7185974c-05e0-5a95-bf4b-c7627eaf9032
  title: Wrenfield Regular Saver — a declined or blocked action
  body: 'If you have attempted to move money into your Wrenfield Regular Saver and
    the transaction was declined or blocked, it is usually due to one of the following
    reasons.


    **Symptom: ''Deposit declined'' or ''Transaction blocked''**


    **Likely Cause 1: Maximum Monthly Deposit Exceeded**

    The most common reason for a blocked deposit is that you have already reached
    the maximum monthly deposit of £300 for the current calendar month. To prevent
    accidental over-funding and to maintain the product''s structure, we strictly
    enforce this limit.


    **What to check:**

    1. Review your transaction history for the current month.

    2. Add up all deposits made into the Wrenfield Regular Saver since the first day
    of the month.

    3. If the total is £300 or more, any further deposits will be automatically declined.


    **The Fix:**

    Wait until the first day of the next calendar month to make further deposits.
    If you have a standing order set up for an amount that exceeds £300, you will
    need to adjust the instruction to £300 or less to avoid future declines.


    **Likely Cause 2: Funding Account Issues**

    If you have not yet reached the £300 limit, the block may be originating from
    the account you are using to fund the saver (such as your current account).


    **What to check:**

    1. Verify that your funding account has sufficient cleared funds to cover the
    transfer.

    2. Check if there are any restrictions or freezes on your funding account.


    **The Fix:**

    Ensure your funding account is adequately funded and active. If you suspect a
    block on your current account, please refer to Wrenfield Current Account — a failed
    or pending action.


    **When to escalate:**

    If you have confirmed that you are under the £300 monthly limit and your funding
    account is healthy, but the deposit is still being blocked, please let us know.
    We will raise this as a technical case with our senior management team for investigation.'
  domain: retail_banking
  product_category: regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ebc97c62-a57f-5d1e-ab69-46dfbe3ca56b
  title: Wrenfield Regular Saver — when to switch or upgrade
  body: "As a support agent, you should help customers decide when the Wrenfield Regular\
    \ Saver is the right tool and when they should transition to another product.\
    \ \n\n**Wrenfield Regular Saver (6% interest)**\n- **Best for:** Customers with\
    \ a steady monthly surplus (up to £300) who are saving for a specific goal over\
    \ 12 months.\n- **Trade-off:** Limited monthly contributions and less flexibility\
    \ for lump-sum deposits.\n\n**Wrenfield Everyday Saver**\n- **Best for:** Customers\
    \ who have a large sum of money to deposit immediately or those who need total\
    \ flexibility to deposit and withdraw any amount at any time.\n- **Trade-off:**\
    \ A lower interest rate compared to the 6% offered by the Regular Saver.\n\n**When\
    \ to suggest a switch:**\n1. **Term Maturity:** When the 12-month term of the\
    \ Regular Saver ends, suggest moving the balance to a Wrenfield Everyday Saver\
    \ for continued accessibility or opening a new Regular Saver if they wish to continue\
    \ goal-based saving.\n2. **Increased Capacity:** If a customer wishes to save\
    \ more than £300 per month, they should keep their Regular Saver for the 6% yield\
    \ and place any additional funds into a Wrenfield Everyday Saver.\n\nRefer to\
    \ Wrenfield Everyday Saver — overview for more details on the alternative."
  domain: retail_banking
  product_category: regular_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4af90b86-3fef-5b8e-b42d-8503c5cf7e59
  title: Wrenfield Regular Saver — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right savings vehicle depends on your financial goals, the amount
    you intend to save, and how quickly you may need access to your money. The Wrenfield
    Regular Saver is a high-interest tool designed specifically for disciplined, incremental
    saving.


    **Why choose the Wrenfield Regular Saver?**

    The primary advantage is the interest rate. At 6%, this account offers a significantly
    higher yield than our more flexible options. It is ideal for those who can commit
    to saving a set amount each month for a duration of 12 months and want to maximise
    their returns on those specific funds.


    **Comparison vs. Alternatives**

    - **Vs. Wrenfield Everyday Saver:** While the Everyday Saver allows you to deposit
    any amount at any time with no upper limit, the Regular Saver caps your monthly
    contributions at £300. However, the Regular Saver provides a much higher interest
    rate (6%) in exchange for this restriction and the 12-month commitment.

    - **Vs. Cash ISA:** A Cash ISA provides tax-efficient savings for larger sums
    (up to the £20,000 annual allowance), whereas the Regular Saver is a non-tax-wrapped
    account for smaller, monthly contributions.


    **When NOT to choose this product:**

    - **Lump Sums:** If you have a large sum of money (e.g., £5,000) that you want
    to earn interest on immediately, the Regular Saver is not the right choice because
    you can only deposit a maximum of £300 per month. You would be better served by
    the Wrenfield Everyday Saver.

    - **Immediate Access Needs:** If you anticipate needing to withdraw your savings
    frequently or unpredictably during the year, the restrictions associated with
    the 12-month term and regular saving structure may be too limiting.

    - **Long-term Locking:** If you are looking for a multi-year fixed investment,
    the 12-month term of this account may be too short for your requirements.


    For a detailed look at our flexible option, see Wrenfield Everyday Saver — overview.'
  domain: retail_banking
  product_category: regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: aa46cc7c-80ee-5f72-b8b3-a5d26a06aa06
  title: Wrenfield Regular Saver — eligibility and setup
  body: '**Who is eligible to open a Wrenfield Regular Saver?**

    To open a Wrenfield Regular Saver, you must already hold a Wrenfield Current Account.
    This is because the Regular Saver is designed as a companion account, using your
    current account as the hub for monthly deposits and the eventual destination for
    your funds upon maturity.


    **How do I set up the account?**

    As an existing customer, you can request to open a Regular Saver through any of
    our standard channels. We will verify your identity, and once confirmed, we will
    open the account and link it to your current account immediately.


    **Can I open multiple Regular Saver accounts?**

    Generally, customers are limited to one Wrenfield Regular Saver at a time. This
    ensures that the 6% interest rate is used for its intended purpose of disciplined,
    monthly goal-saving.


    For a step-by-step guide on the process, please see Wrenfield Regular Saver —
    set up and activate.'
  domain: retail_banking
  product_category: regular_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 1543e39b-54dd-5961-a085-44ec95406921
  title: Wrenfield Regular Saver — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the closure of a Wrenfield Regular
    Saver once it has reached the end of its 12-month term. This process ensures your
    savings and the earned interest are safely returned to you.


    **What you will need:**

    - Confirmation that your 12-month term has concluded.

    - Your Wrenfield Current Account details (where the funds will be transferred).


    **Steps to resolve the account closure:**


    1. **Request account closure:** Tell us that your Wrenfield Regular Saver has
    matured and you would like to close the account. We will first perform a full
    identity authentication to ensure the security of your assets.

    2. **Confirm the destination account:** We will ask you to confirm the account
    where the funds should be sent. In most cases, this will be your linked Wrenfield
    Current Account, but we will verify this with you to prevent errors.

    3. **Verify final balance and interest:** We will provide you with the final closing
    balance, which includes all your monthly deposits (up to the £300 monthly limit)
    and the total interest earned at the 6% rate.

    4. **Execute the transfer:** Once you confirm you are happy with the final balance,
    we will close the Regular Saver and transfer the full amount to your designated
    account.

    5. **Receive confirmation:** We will provide a final confirmation that the account
    is closed and the funds have been moved.


    **How you know it worked:**

    You will see the full balance of your Wrenfield Regular Saver, plus the accrued
    6% interest, appear as a credit in your current account, and the Regular Saver
    will no longer appear in your list of active accounts.'
  domain: retail_banking
  product_category: regular_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 305b5b58-5748-5e89-8a75-5a26d1e960b5
  title: Wrenfield Regular Saver — a discrepancy in your records or statement
  body: 'If a customer reports that the balance or interest on their Wrenfield Regular
    Saver does not match their own records, follow these steps to resolve the discrepancy.


    **Symptom: ''My balance is lower than expected'' or ''The interest doesn''t seem
    right''**


    **Step 1: Verify the Deposit History**

    Check the transaction history for the 12-month term. Confirm that every intended
    deposit was successful. Remind the customer that any deposit attempt over the
    maximum monthly deposit of £300 would have been declined. If they attempted to
    deposit £400 and only £300 was accepted, their balance will be lower than their
    intended total.


    **Step 2: Validate Interest Calculations**

    Ensure the interest is being calculated based on the 6% rate. Interest is applied
    to the daily balance; therefore, a customer who deposits £300 on the 1st of the
    month will earn more interest than a customer who deposits £300 on the 28th of
    the month.


    **Step 3: Check for Early Withdrawals**

    Review if any withdrawals were made from the account. Early withdrawals can impact
    the final balance and may, depending on the account''s specific terms, affect
    the interest earned.


    **Step 4: Compare with Official Statements**

    Provide the customer with an official statement of the account to ensure they
    are not looking at a cached or outdated screen in a digital channel.


    **When to escalate:**

    If the deposit history is correct, the 6% rate has been applied to the daily balance,
    and no unauthorised withdrawals have occurred, but a discrepancy remains, this
    must be escalated. Raise a formal investigation case and route it to senior management.
    Inform the customer that we aim to resolve disputes within eight weeks, and if
    they remain unsatisfied, they may refer the matter to the Financial Ombudsman
    Service.'
  domain: retail_banking
  product_category: regular_saver
  document_type: troubleshooting
  source_authority: official
