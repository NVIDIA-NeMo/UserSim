- id: 2a98eaf7-363b-5feb-bc44-4314f11adc6a
  title: Wrenfield Rewards Credit Card — eligibility requirements
  body: 'The following matrix defines the requirements for eligibility for the Wrenfield
    Rewards Credit Card. We apply these standards to all applicants to maintain a
    high standard of care and stability.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a permanent UK resident | Mandatory for application |

    | Age | Must be 18 years of age or older | Mandatory for application |

    | Identity | Successful completion of ''verify-first'' authentication | Required
    for account activation |

    | Affordability | Must pass our strict affordability assessment | Determines approval
    and credit limit |

    | Credit History | Minimum internal credit score threshold met | Determines if
    Representative APR of 24.9% is applicable |


    Failure to meet any of the mandatory requirements will result in the application
    being declined. For those already using the product, these requirements are reviewed
    periodically during credit limit assessments.'
  domain: cards
