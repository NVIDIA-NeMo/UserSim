- id: 08ee2872-884d-5f8d-972d-fbf8ccd1e309
  title: Wrenfield Rewards Credit Card — a declined or blocked action
  body: 'If you have attempted to make a purchase or perform a balance transfer with
    your Wrenfield Rewards Credit Card and the action was declined or blocked, please
    review the following possibilities.


    **Common Symptoms**

    - A point-of-sale terminal displays ''Transaction Declined''.

    - An online checkout states that the payment method was not accepted.

    - A balance transfer request is rejected immediately.


    **Likely Causes and What to Check**

    1. **Credit Limit Exceeded:** Check if the transaction would push you over your
    credit limit. For example, if your limit is the representative £1,200 and your
    current balance is £1,150, a £100 purchase will be declined.

    2. **Security Block:** Our ''verify-first'' systems may block a transaction if
    it appears unusual, such as a large purchase in a new geographical location or
    a high-frequency series of small payments.

    3. **Incorrect Details:** Ensure the CVV and expiry date were entered correctly
    for online transactions.

    4. **Insufficient Funds for Fees:** For balance transfers, ensure there is enough
    available credit to cover both the transfer amount and the 3.49% balance transfer
    fee.


    **How to Fix It**

    If you believe the decline is an error, please let us know. We will perform a
    full identity authentication to verify your ownership of the card. Once verified,
    we can check the specific reason for the block and, if appropriate, lift the restriction
    to allow the transaction to proceed.


    **When to Escalate**

    If we are unable to resolve the block immediately during your call, we will raise
    a case with our senior security management. You will be notified of the outcome
    and the reason for the block within our standard dispute timelines. For payment-related
    complaints, we aim to provide a final response within 15 business days.'
  domain: cards
  product_category: credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 27f40618-e11a-5acf-b156-5970a9f109dd
  title: Wrenfield Rewards Credit Card — when to switch or upgrade
  body: 'This guidance helps support agents identify when the Wrenfield Rewards Credit
    Card is the most appropriate option for a customer compared to other borrowing
    solutions.


    **When to choose this card**

    This product is ideal for customers who want a flexible daily spending tool with
    the added security of Section 75 protection for purchases between £100 and £30,000.
    It is particularly suited for those looking to consolidate debt from other providers,
    thanks to the 24-month 0% balance transfer period (subject to a 3.49% fee).


    **When to suggest an alternative**

    - **For long-term fixed borrowing:** If a customer needs a large, lump-sum amount
    for a set period, a Wrenfield Personal Loan with its lower representative APR
    of 6.9% may be more cost-effective than a credit card with a 24.9% representative
    APR.

    - **For frequent international spenders:** Because this card charges a 2.99% foreign
    transaction fee, customers who travel extensively may find a specialist travel
    card more suitable.


    **Summary for Agents**

    Switch to this card when the customer values rewards and short-term 0% interest
    on transfers over the lowest possible long-term borrowing rate.'
  domain: cards
  product_category: credit_card
  document_type: comparison
  source_authority: official
