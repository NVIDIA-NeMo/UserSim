- id: 652e69a9-28d5-53dc-9fb6-ea9d953826b7
  title: Wrenfield Everyday Saver — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our highest priority. Because
    the Wrenfield Everyday Saver is designed for flexibility and frequent access,
    it is essential that you maintain rigorous security habits to prevent unauthorised
    access.


    We operate a strict ''verify-first'' stance. This means we will always perform
    full identity authentication before any state-changing action is taken on your
    account or any sensitive information is disclosed. You should expect this level
    of diligence every time you interact with us.


    **Fraud Patterns to Recognise**

    Be aware of ''social engineering'' scams where fraudsters pose as Wrenfield Bank
    staff. They may claim there is an urgent issue with your 2.1% interest accrual
    or suggest that your account is ''at risk'' and requires a transfer to a ''safe
    account''. Please remember: we will never ask you to move your money to a different
    account for security reasons, nor will we ever ask for your full password or PIN
    over the telephone.


    **Our Security Commitments**

    We will never ask you to provide your security credentials via email or SMS link.
    Any request to ''verify'' your identity through a third-party website is a red
    flag.


    **Immediate Action**

    If you notice any transaction you do not recognise, or if you have shared your
    security details with someone you now suspect is a fraudster, you must inform
    us immediately. Rapid reporting is critical to minimising loss. Once notified,
    we will take immediate steps to secure your funds, which may include freezing
    the account.


    Your deposits are protected by the FSCS up to £120,000 per person, and temporary
    high balances are protected up to £1.4 million, providing you with peace of mind
    regarding the stability of your savings. For more information on identifying specific
    threats, see Wrenfield Everyday Saver — recognising scams targeting this product.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a67c1d9b-33e0-5433-8842-4a86eafd38fe
  title: Wrenfield Everyday Saver — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    governing the Wrenfield Everyday Saver. By maintaining this account, you agree
    to be bound by these terms, which ensure all customers are treated fairly under
    the guidance of the FCA.


    **Right to Amend Terms**

    We reserve the right to amend the terms of the Wrenfield Everyday Saver. This
    includes, but is not limited to, changes to the interest rate of 2.1% or the minimum
    opening deposit of £1. Such changes may be necessitated by shifts in the wider
    economic environment, regulatory requirements from the PRA, or operational cost
    adjustments.


    **Notification Process**

    We are committed to transparency. Should we change a material term of your account,
    we will provide you with written notice. This notice will be sent via your preferred
    communication channel and will clearly state the nature of the change and the
    date it will take effect.


    **Notice Periods**

    For most changes, we will provide a minimum of 30 days'' notice. However, in exceptional
    circumstances where a change is required by law or by the regulator, the notice
    period may be shorter, or the change may take effect immediately.


    **Customer Rights Upon Change**

    If you do not agree to the new terms, you have the right to close your account.
    You may do this by following the procedures outlined in Wrenfield Everyday Saver
    — cancel, close, or downgrade. Any funds remaining in the account, including accrued
    interest, will be returned to you in full upon closure.


    **Agreement Termination**

    Either you or Wrenfield Bank may terminate this agreement at any time. We will
    provide a fair and reasonable notice period if we decide to close your account,
    unless the closure is triggered by a breach of our security and verification policies
    or suspected fraudulent activity.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4ac741f8-0ef2-55b4-a99a-c1711cedcfc2
  title: Wrenfield Everyday Saver — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in opening
    a Wrenfield Everyday Saver. This product is designed as a flexible, low-barrier
    entry point for retail customers valuing stability.


    **Product Core Specifications**

    - **Interest Rate:** 2.1% (Variable)

    - **Minimum Opening Deposit:** £1

    - **Protection:** FSCS protected up to £120,000 (standard) and £1.4 million (temporary
    high balances).


    **Walkthrough Steps for the Customer**


    1. **Eligibility Confirmation:** Confirm the customer is a UK resident and meets
    the standard age requirements for retail banking. If they do not already have
    a Wrenfield account, they will need to provide valid government-issued photo identification
    and proof of address.


    2. **Account Selection:** Guide the customer to select the Wrenfield Everyday
    Saver. Highlight that this is a flexible account with no monthly fees, complementing
    the Wrenfield Current Account if they require a daily banking hub.


    3. **Funding the Account:** Inform the customer that the minimum opening deposit
    is £1. They can fund this via a transfer from another Wrenfield account or via
    a payment from another UK financial institution.


    4. **Identity Verification:** Execute the ''verify-first'' protocol. Ensure all
    identity documents are authenticated before the account is finalised. This is
    a non-negotiable security step to prevent unauthorised access.


    5. **Finalisation and Confirmation:** Once verified and funded, confirm that the
    account is active. Inform the customer that their balance will begin earning interest
    at the current rate of 2.1% immediately.


    **Agent Notes**

    Remind the customer that while the Everyday Saver is highly flexible, if they
    are saving for a specific short-term goal with a maximum monthly deposit of £300,
    the Wrenfield Regular Saver may also be of interest. For further details on a
    customer''s options, see Wrenfield Everyday Saver — choosing between tiers or
    options.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6657c85d-7379-55da-bb9b-8de1b53ff23a
  title: Wrenfield Everyday Saver — cost and charges
  body: '**Are there any monthly fees for the Wrenfield Everyday Saver?**

    No. We believe essential saving should be accessible and transparent. There are
    no monthly account fees associated with the Wrenfield Everyday Saver.


    **Is there a cost to open the account?**

    There is no fee to open the account. You only need to provide a minimum opening
    deposit of £1 to activate it.


    **Are there any charges for withdrawing my money?**

    No, the Wrenfield Everyday Saver is designed for flexibility. You can access your
    funds without incurring a withdrawal penalty, ensuring your money remains available
    when you need it.


    **Does this account help me avoid other banking fees?**

    While the Everyday Saver is fee-free, it is separate from our daily banking products.
    For a fee-free daily hub, we recommend the Wrenfield Current Account, which also
    carries a £0 monthly account fee. You can find more details in Wrenfield Current
    Account — cost and charges.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 53482337-b870-5604-b54a-a2a5e5314955
  title: Wrenfield Everyday Saver — make a change or update
  body: 'If you need to update the details associated with your Wrenfield Everyday
    Saver, we provide a straightforward process to ensure your account remains current
    and secure. Please follow these steps to make a change:


    **What you need before starting**

    - Your account number and sort code.

    - A valid form of government-issued photo identification (if updating your legal
    name or address).

    - The new details you wish to apply to the account.


    **Steps to update your account**


    1. **State the Change:** Tell us specifically which detail you wish to update
    (e.g., your residential address, contact telephone number, or legal name).


    2. **Identity Verification:** We will perform a full identity authentication.
    This is part of our ''verify-first'' security stance. You will be asked to provide
    specific personal details or present a valid ID to ensure that we are only making
    changes at the request of the verified account holder.


    3. **Provide Documentation:** If you are changing your legal name or registered
    address, provide the necessary supporting evidence (such as a marriage certificate
    or a recent utility bill). We will confirm once these documents have been successfully
    reviewed.


    4. **Confirmation of Update:** We will apply the changes to your account records.
    We will then provide a confirmation message stating that the update to your Wrenfield
    Everyday Saver has been completed successfully.


    **How you know it worked**

    Once the process is complete, you will receive a notification (via your chosen
    communication method) confirming the update. You can also check that your new
    details are correctly reflected on your next account statement.


    For information on how we handle and protect the data you provide during this
    process, please refer to Wrenfield Everyday Saver — privacy and data handling.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 126ea6f6-271e-5f31-910e-19244c76a8de
  title: Wrenfield Everyday Saver — access or login problems
  body: 'If you are experiencing difficulties accessing your Wrenfield Everyday Saver,
    please refer to the following troubleshooting steps to identify and resolve the
    issue.


    **Symptom**

    "I cannot log in to view my balance," or "I am receiving an error message when
    trying to access my savings account."


    **Likely Causes**

    - Incorrect security credentials (password or PIN).

    - Account lock due to multiple failed authentication attempts.

    - Temporary system maintenance affecting digital channels.

    - Outdated identity verification documents causing a security flag.


    **What to check in order**

    1. **Credential Accuracy:** Double-check that you are entering your credentials
    exactly as they were provided. Ensure that caps lock is not accidentally enabled.

    2. **Account Status:** Check if you have received any notifications from us regarding
    a security hold on your account. Our ''verify-first'' stance may result in a temporary
    lock if unusual activity is detected.

    3. **Service Availability:** Check if other Wrenfield Bank services are operational.
    If we are undergoing scheduled maintenance, access may be temporarily limited.


    **The Fix**

    - **For forgotten passwords:** Ask us to trigger a secure password reset. We will
    verify your identity first and then provide you with the means to establish new
    credentials.

    - **For locked accounts:** Request an identity re-verification. Once we have successfully
    authenticated you, we will unlock the account immediately.


    **When to Escalate**

    If you have verified your credentials and the account is not locked, but you still
    cannot gain access, we will raise a technical case with our senior management
    and IT specialists. You will receive a case reference number, and we aim to provide
    a resolution or an update within our standard business hours.


    For more general assistance with account issues, you can refer to Wrenfield Everyday
    Saver — a failed or pending action.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9997b3da-2c19-5587-b158-5d4a7eda64db
  title: Wrenfield Everyday Saver — qualification tiers
  body: 'The Wrenfield Everyday Saver is designed for broad accessibility. Unlike
    tiered products, this account offers a consistent rate to all qualifying customers.
    Use the following matrix to determine account eligibility:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Residency** | Must be a legal UK resident | Eligible to apply |

    | **Identity** | Must pass full ''verify-first'' authentication | Account activation
    permitted |

    | **Initial Funding** | Minimum opening deposit of £1 | Account successfully opened
    |

    | **Account Balance** | Any balance from £1 upwards | Earns interest rate of 2.1%
    |


    **Agent Note:** Because there are no higher-balance tiers for this specific product,
    all customers who meet the minimum opening deposit of £1 will receive the same
    interest rate of 2.1%. For customers seeking higher interest through disciplined
    monthly saving, refer them to the Wrenfield Regular Saver.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: eligibility_matrix
  source_authority: official
