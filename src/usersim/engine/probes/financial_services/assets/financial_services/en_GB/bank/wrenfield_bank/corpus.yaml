- id: b9bea39c-8d24-569f-9a19-64c6e0a3d6d0
  title: Wrenfield Current Account — risk disclosures
  body: "Wrenfield Bank is committed to the Consumer Duty, ensuring all customers\
    \ are treated fairly and provided with clear, non-opaque information regarding\
    \ the risks associated with our products.\n\nOverdraft Risks\nThe Wrenfield Current\
    \ Account may include an arranged overdraft facility. It is important to understand\
    \ that borrowing via an overdraft is a form of credit. The interest rate for an\
    \ arranged overdraft is 39.9% (variable). Because this rate is variable, the cost\
    \ of borrowing may increase over time. High-interest debt can accumulate quickly;\
    \ we strongly encourage customers to use overdrafts only for short-term liquidity\
    \ needs. All lending is subject to a strict affordability assessment to avoid\
    \ foreseeable harm to the customer.\n\nRegulatory and Deposit Protection\nWrenfield\
    \ Bank operates under the strict authorisation of the Prudential Regulation Authority\
    \ (PRA) and is regulated by the Financial Conduct Authority (FCA). \n\nYour deposits\
    \ are protected by the Financial Services Compensation Scheme (FSCS). The protection\
    \ limit is up to £120,000 per person. In the event of a temporary high balance\
    \ (such as from a house sale), protection may extend up to £1.4 million for a\
    \ limited period. This protection is a statutory safeguard and is not a product\
    \ of the bank itself.\n\nPayment and Dispute Risks\nWhile we aim for rapid resolution\
    \ of all disputes, please be aware that the timeline for final responses varies\
    \ by type. Payment service complaints are generally resolved within 15 business\
    \ days, while other disputes may take up to eight weeks. \n\nBy opening a Wrenfield\
    \ Current Account, you acknowledge that you have read and understood these risks\
    \ and the terms of the account agreement. For further regulatory information,\
    \ please see Wrenfield Current Account — regulatory disclosures."
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
