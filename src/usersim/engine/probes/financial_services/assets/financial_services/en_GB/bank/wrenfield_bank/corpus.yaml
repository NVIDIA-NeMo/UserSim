    of £300 over a fixed term of 12 months.


    By referring a new customer to the Wrenfield Bank family, you help them access
    a transparent, high-street banking experience where their savings are protected
    by the FSCS up to £120,000. We believe in rewarding loyalty through fair pricing
    and the consistent delivery of our core products. Start your savings journey with
