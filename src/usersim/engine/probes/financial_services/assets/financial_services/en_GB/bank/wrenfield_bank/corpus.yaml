- id: 2ece1df7-701e-5c17-915a-f72b4f765d5d
  title: Wrenfield Easy Access Cash ISA — risk disclosures
  body: 'This document provides formal regulatory disclosures regarding the Wrenfield
    Easy Access Cash ISA. Customers comparing this product against alternatives should
    carefully consider the following risk factors.


    Interest Rate Risk: The interest rate of 2.85% is variable. This means the rate
    can increase or decrease based on market conditions and the bank''s internal pricing
    policy. While the current rate provides a steady return, there is no guarantee
    that this rate will remain constant over the life of the account. Changes to the
    rate may affect the overall growth of your savings.


    Tax Status Risk: The tax-free nature of the Wrenfield Easy Access Cash ISA is
    dependent on the customer adhering to the statutory limits set by the government.
    Currently, the annual allowance is £20,000. If you exceed this limit by contributing
    to multiple ISAs, you may be subject to tax on the excess interest or be required
    to withdraw the over-contribution. Please note that the allowance is scheduled
    to change to £12,000 from April 2027.


    Capital Protection: Your deposits are protected by the Financial Services Compensation
    Scheme (FSCS). Eligible deposits are protected up to £120,000 per person. In the
    event of a temporary high balance, protection extends up to £1.4 million. This
    protection ensures that your capital is secure up to these limits, regardless
    of the bank''s financial position.


    Regulatory Oversight: Wrenfield Bank is authorised by the Prudential Regulation
    Authority (PRA) and regulated by the Financial Conduct Authority (FCA). We operate
    under a strict Consumer Duty, ensuring that all customers are treated fairly and
    that our products are fit for purpose.


    For further information on the general protections provided by the bank, you may
    refer to the Wrenfield Easy Access Cash ISA — fraud and unauthorised-activity
    protection.'
  domain: retail_banking
  product_category: cash_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: e4f874bd-d758-5ec7-bfef-325286692135
  title: Wrenfield Easy Access Cash ISA — how rates are tiered and applied
  body: 'As a support agent, please use the following information to explain interest
    application to customers. The Wrenfield Easy Access Cash ISA does not utilise
    a tiered interest structure; therefore, the same rate applies regardless of the
    balance held in the account.


    Applicable Rate:

    - All Balances: 2.85%


    How the Rate is Applied:

    - Flat Rate: A single interest rate of 2.85% is applied to all funds held within
    the account. There are no lower or higher tiers based on the amount saved.

    - Calculation: Interest is calculated on a daily basis. This ensures that customers
    receive the full benefit of their deposits, even for short periods.

    - Crediting: Interest is credited to the account periodically. Once credited,
    this interest becomes part of the principal balance and earns further interest.


    What Would Change the Rate:

    Since this is a variable rate product, the 2.85% figure may be adjusted by the
    bank to reflect changes in the base rate set by the Bank of England or other macroeconomic
    factors. We will notify customers of any such changes in accordance with our account
    agreement.'
  domain: retail_banking
  product_category: cash_isa
  document_type: rate_sheet
  source_authority: official
