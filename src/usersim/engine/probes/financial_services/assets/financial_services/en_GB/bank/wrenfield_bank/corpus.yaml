- id: 538231c2-9c62-50b9-ba8e-a7eee8ad307d
  title: Wrenfield Two-Year Fixed Mortgage — how rates are tiered and applied
  body: 'This rate sheet provides the internal breakdown of how interest is applied
    to the Wrenfield Two-Year Fixed Mortgage. This product uses a flat-rate structure
    for the duration of the fixed term rather than tiered interest based on the loan
    balance.


    Initial Fixed Period (Months 1-24):

    A single fixed interest rate of 5.64% applies to all balances. This rate is guaranteed
    and will not change regardless of fluctuations in the Bank of England base rate
    during the first two years.


    Post-Fixed Period (Month 25 onwards):\Upon the expiry of the two-year fix, the
    loan automatically transitions to our Standard Variable Rate (SVR). The current
    SVR is 7.49%. This rate is variable and may be adjusted by the bank at any time.


    Overall Cost Indicator:

    The APRC for this product is 7.4%. This is the annual percentage rate of charge,
    which includes the interest rate and the £999 product fee, allowing for a standardised
    comparison of the total cost of borrowing over the lifetime of the mortgage.'
