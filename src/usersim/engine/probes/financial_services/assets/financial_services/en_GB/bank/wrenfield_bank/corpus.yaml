  institution_id: wrenfield_bank
- id: b9f9725c-ac22-5238-96c9-8ba53960a8f5
  title: Wrenfield Everyday Saver — set up and activate
  body: 'Setting up a Wrenfield Everyday Saver is a straightforward process designed
    to get you started with your savings as quickly as possible. Before you begin,
    please ensure you have a valid form of government-issued photo identification
    and a current utility bill or bank statement for address verification.


    1. Tell us that you wish to open a Wrenfield Everyday Saver account. We will then
    ask you to provide your full legal name, date of birth, and residential address
    to begin the application.


    2. Provide your identity and address verification documents. We will review these
    documents to complete our ''verify-first'' authentication process, ensuring your
    account is secure from the moment of inception.


    3. Once your identity is verified, we will confirm the account details and ask
    you to make the minimum opening deposit of £1. You can do this via a transfer
    from another account in your name.


    4. We will monitor for the arrival of your £1 deposit. Once these funds are received,
    we will formally activate the account.


    5. We will provide you with your unique account number and sort code, along with
    a confirmation that your Wrenfield Everyday Saver is now active and earning interest
    at the current rate of 2.1%.


    Your account is now ready for use. You may continue to add funds as you wish to
    grow your savings. If you have questions regarding whether you meet the requirements
    to open this account, you may wish to consult the Wrenfield Everyday Saver — eligibility
    requirements.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
