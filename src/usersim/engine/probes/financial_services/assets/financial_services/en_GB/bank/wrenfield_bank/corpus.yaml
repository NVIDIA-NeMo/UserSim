  institution_id: wrenfield_bank
- id: 9ec40edc-37d9-5e82-83c3-c79a1572ad0f
  title: Wrenfield Current Account — vs. a similar product here
  body: 'When choosing a daily banking hub, customers often compare the Wrenfield
    Current Account against traditional ''packaged'' accounts offered by other high-street
    institutions.


    Cost and Value

    Many competitor packaged accounts charge a monthly fee ranging from £5 to £15
    in exchange for perks like travel insurance. The Wrenfield Current Account takes
    a different approach: we charge a monthly account fee of £0. We believe essential
    banking should be free, allowing you to choose your own insurance or perks separately.


    Switching Incentives

    While some banks offer varying bonuses, we provide a clear, transparent switching
    incentive of £175 for customers who move their primary banking to us via the streamlined
    switch process.


    Borrowing Costs

    Our arranged overdraft rate is 39.9%. While some accounts may offer lower introductory
    rates, our pricing is transparent and designed to cover operational costs and
    regulatory risk across the board.


    Who suits each?

    - The Wrenfield Current Account is ideal for customers who value stability, transparency,
    and a fee-free experience without paying for bundled services they may not use.

    - A packaged account may be better for those who specifically want integrated
    insurance products and are comfortable paying a monthly fee for that convenience.'
  domain: retail_banking
  product_category: current_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ae8ae1aa-1424-53ab-bc79-6cc48317e122
  title: Wrenfield Current Account — regulatory disclosures
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We are committed to ensuring that all customers are treated fairly and
    that our products are marketed and managed in accordance with the Consumer Duty.


    Deposit Protection

    Eligible deposits held within the Wrenfield Current Account are protected by the
    Financial Services Compensation Scheme (FSCS). The protection limit is up to £120,000
    per person. In the event of a temporary high balance (such as from a house sale),
    protection is extended up to £1.4 million for a limited period.


    Lending and Risk

    All credit facilities, including the arranged overdraft which carries a rate of
    39.9%, are subject to a strict affordability assessment. This process is designed
    to ensure that customers can reasonably manage their repayments and to avoid foreseeable
    harm. We do not offer individualised tax or legal advice; any such requirements
    should be directed to a qualified professional.


    Complaints and Disputes

    We strive for a rapid resolution of all issues. For complaints relating to payment
    services, we aim to provide a final response within 15 business days. For all
    other disputes, our target is a resolution within eight weeks. If a dispute remains
    unresolved after our internal escalation path to senior management, customers
    may refer the matter to the Financial Ombudsman Service.


    Security Stance

    To protect customer assets, we employ a rigorous ''verify-first'' security posture.
    No state-changing action—such as changing an address or requesting a limit increase—or
    disclosure of account information will be performed without full identity authentication.'
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: d779dd31-6841-538a-8857-8d618fbb42d4
  title: Wrenfield Current Account — interest rate / AER schedule
  body: 'The Wrenfield Current Account is designed as a transactional hub for daily
    banking rather than a high-yield savings vehicle. Please find the applicable rates
    below.


    Credit Interest

    This account does not pay interest on credit balances. For customers seeking a
    return on their savings, we recommend exploring the Wrenfield Everyday Saver or
    the Wrenfield Regular Saver.


    Debit Interest (Borrowing)

    For customers who have been approved for a credit facility following our affordability
    assessment, the following rate applies:

    - Arranged Overdraft Rate: 39.9%


    This rate is the Annual Percentage Rate (APR) applied to the borrowed balance.
    It is a variable rate, meaning it may change in accordance with our standard terms
    and conditions. We will notify you of any changes to this rate within the notice
    periods specified in your account agreement.'
  domain: retail_banking
  product_category: current_account
  document_type: rate_sheet
  source_authority: official
  placeholder: true
