- id: 337f99d1-4414-5095-abf2-0192707ce917
  title: Wrenfield Rewards Credit Card — check status or history
  body: 'To check the current status, available credit, or transaction history of
    your Wrenfield Rewards Credit Card, please follow these steps while speaking with
    us.


    **What you need before starting**

    You will need your card number or the account number associated with your credit
    card. As we maintain a rigorous ''verify-first'' security stance, please be prepared
    to answer a series of identity authentication questions.


    **Step-by-step process**

    1. **Request your account details:** Tell us that you would like to check your
    current balance or view your recent transaction history. You should specify if
    you are looking for the total balance, the available credit, or a list of specific
    transactions from a certain date range.

    2. **Complete identity verification:** We will guide you through a full identity
    authentication process. This may include confirming personal details or answering
    security questions. We cannot disclose any account information until this verification
    is successfully completed.

    3. **Review the information:** Once verified, we will provide the requested details.
    This may include your current balance (e.g., whether you are close to your credit
    limit, such as the £1,200 representative limit), your last five transactions,
    or the date of your next payment.

    4. **Confirm receipt:** Let us know once you have noted the figures or if you
    require a full monthly statement to be sent to you.


    **How you know it worked**

    The process is complete when we have verbally confirmed your current balance and
    the status of your account, or when we have confirmed that a physical or digital
    statement has been dispatched to your registered address.'
  domain: cards
  product_category: credit_card
  document_type: how_to_guide
  source_authority: official
