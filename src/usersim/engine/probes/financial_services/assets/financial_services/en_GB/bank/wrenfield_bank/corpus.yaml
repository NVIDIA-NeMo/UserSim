- id: 0cfd6825-5650-5e43-a71b-72ee44453f3d
  title: Wrenfield Everyday Saver — recognising scams targeting this product
  body: "As you compare our savings options with other providers, it is vital to remain\
    \ vigilant against the evolving nature of financial fraud. At Wrenfield Bank,\
    \ we are committed to your security and want to ensure you can grow your savings\
    \ with confidence.\n\nA common scam targeting flexible savings accounts like the\
    \ Wrenfield Everyday Saver is the 'Safe Account' or 'Safe Haven' fraud. In this\
    \ scenario, a fraudster may contact you pretending to be from our security team,\
    \ claiming that your account has been compromised. They will insist that the only\
    \ way to protect your funds is to immediately transfer your balance—including\
    \ your 2.1% interest earnings—to a 'safe' account that they control. \n\nPlease\
    \ be aware: Wrenfield Bank will never ask you to move your money to a different\
    \ account to keep it safe. We will never ask for your full security password or\
    \ your PIN over the telephone or via email. Any request to move funds urgently\
    \ to avoid 'loss' is a primary indicator of a scam.\n\nIf you are ever unsure\
    \ about a communication you have received, do not provide any information. Instead,\
    \ end the conversation and speak with us through our verified channels. If you\
    \ believe you have been the victim of an APP scam, please notify us immediately;\
    \ we proactively support victims of such fraud to help recover lost funds where\
    \ possible.\n\nFor your peace of mind, remember that your deposits with us are\
    \ protected by the Financial Services Compensation Scheme (FSCS). Eligible deposits\
    \ are protected up to £120,000 per person, with temporary high balances protected\
    \ up to £1.4 million. This ensures that your stability is maintained regardless\
    \ of the external environment.\n\nTo protect your assets, we maintain a rigorous\
    \ 'verify-first' stance. We will always require full identity authentication before\
    \ any state-changing action or disclosure of account information. If a caller\
    \ asks you to bypass these security steps or claims they can 'override' them for\
    \ you, they are not representing Wrenfield Bank."
  domain: retail_banking
  product_category: everyday_saver
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 295544ed-5da6-5ceb-bc44-7cf789bc7f67
  title: Wrenfield Everyday Saver — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational limits and edge cases associated with the Wrenfield Everyday Saver.
    This account is designed for maximum flexibility and low-barrier entry, which
    necessitates specific handling of balance thresholds.


    **Opening Requirements**

    The account requires a minimum opening deposit of £1. Any attempt to open an account
    with a balance lower than £1 must be declined, as this is the baseline requirement
    to activate the product.


    **Interest Application**

    The account earns a variable interest rate of 2.1%. Interest is calculated daily
    and credited to the account. Agents should clarify to customers that while the
    rate is competitive for a flexible account, it is subject to change in line with
    our standard rate review policy.


    **Balance Edge Cases**

    - **Zero Balance:** If a customer withdraws their entire balance, the account
    remains open. However, no interest will be accrued on a balance of £0. There are
    no monthly fees for maintaining a zero balance, as we believe essential banking
    should be accessible.

    - **Minimum Balance Maintenance:** Unlike fixed-term products, there is no requirement
    to maintain the £1 minimum after the account has been opened. Customers may fluctuate
    their balance between £0 and their total savings without penalty.


    **Withdrawal and Deposit Limits**

    There are no restrictive limits on the number of withdrawals or deposits a customer
    can make. This is a flexible savings tool intended for daily use. However, unusually
    large transfers may be subject to our standard security and verification checks
    to prevent unauthorised access and protect the customer''s assets.


    **Account Closure**

    When closing an account, all accrued interest must be calculated up to the date
    of closure and paid out to the customer. Ensure that the final balance is transferred
    to a verified Wrenfield Current Account or an external account through our secure
    payment process.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6f237575-f836-5b2c-8b9b-087165507e0d
  title: Wrenfield Everyday Saver — eligibility and setup
  body: '**Who is eligible to open a Wrenfield Everyday Saver?**

    Any retail customer who holds a valid Wrenfield Bank identity profile and meets
    our standard residency requirements can open this account. It is designed to be
    an accessible entry point for all our customers.


    **What is required to set up the account?**

    To open the account, you will need to provide a minimum opening deposit of £1.
    Because we maintain a rigorous ''verify-first'' security stance, you must successfully
    complete our full identity authentication process before the account is activated.


    **How long does the setup process take?**

    Once your identity is verified and the £1 opening deposit is received, the account
    is typically active immediately. You will receive confirmation of the account
    opening and the current interest rate of 2.1% through your preferred communication
    channel.


    **Can I open this account if I do not have a current account with Wrenfield Bank?**

    We generally require customers to have a primary relationship with us. If you
    do not yet have one, we recommend looking at the Wrenfield Current Account — overview
    for details on starting your journey with us.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: faq
  source_authority: official
