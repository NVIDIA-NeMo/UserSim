- id: bf4a0ca4-b175-5880-b67a-a8db0b8cf788
  title: Wrenfield Two-Year Fixed Mortgage — make a change or update
  body: 'If you are an existing customer and wish to update your account details or
    manage your mortgage payments, please follow these steps.


    Updating Your Personal Information

    1. Tell us which specific details need updating (e.g., a change of residential
    address or contact telephone number).

    2. We will perform a full identity authentication to ensure the security of your
    assets, as per our ''verify-first'' stance.

    3. Once verified, we will update your records and provide a confirmation of the
    change.


    Making a Mortgage Overpayment

    1. State the amount you wish to pay towards your mortgage capital.

    2. We will check your current balance to ensure the payment falls within your
    annual overpayment allowance of 10%.

    3. If the payment is within the 10% limit, we will process the overpayment and
    confirm the new remaining balance of your loan.

    4. If the amount exceeds 10%, we will notify you that an Early Repayment Charge
    may apply—either 3% if you are in year one, or 2% if you are in year two—and ask
    if you wish to proceed.


    All changes are handled by our teams during standard UK business hours. If you
    have further questions regarding your rate, you can refer to Wrenfield Two-Year
    Fixed Mortgage — overview.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: how_to_guide
