- id: 60a75178-39f5-5e35-b070-f97257637ad0
  title: Wrenfield Rewards Credit Card — current offer
  body: 'We are pleased to offer our existing customers a limited-time opportunity
    to consolidate their external credit balances with the Wrenfield Rewards Credit
    Card.


    Offer Details:

    From 1 November 2025 to 31 January 2026, you can take advantage of our streamlined
    balance transfer offer. You can transfer balances from other eligible providers
    and benefit from a dedicated balance transfer period of 24 months.


    Associated Costs:

    A balance transfer fee of 3.49% will be applied to the total amount transferred.
    This fee is a one-time charge added to your account balance at the time of the
    transfer.


    To take advantage of this offer, simply request a balance transfer through your
    digital channel or via telephone banking. All transfers are subject to the available
    credit limit on your account and our standard affordability assessments to ensure
    your financial stability.'
  domain: cards
  product_category: credit_card
  document_type: promo_notice
  source_authority: official
