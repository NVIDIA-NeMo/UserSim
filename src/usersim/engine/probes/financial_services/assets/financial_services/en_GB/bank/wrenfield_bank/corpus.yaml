- id: 81085e4a-95dc-549d-843d-4707abdf3b69
  title: Wrenfield Everyday Saver — vs. a typical competitor offering
  body: 'For our existing customers evaluating whether to maintain their funds in
    the Wrenfield Everyday Saver or move them to a typical competitor''s easy-access
    account, we provide the following comparison.


    Wrenfield Everyday Saver:

    - Entry Barrier: Extremely low; requires only a £1 minimum opening deposit.

    - Interest Structure: A stable, flat rate of 2.1% applied across all balances.

    - Transparency: No monthly maintenance fees and a straightforward, non-tiered
    return.


    Typical Competitor Offerings:

    - Entry Barrier: Often require higher initial deposits (e.g., £100 or £1,000)
    to access advertised rates.

    - Interest Structure: Frequently use tiered rates, where the highest percentage
    only applies to the first few thousand pounds, with rates dropping significantly
    thereafter.

    - Transparency: May include conditions such as ''no withdrawals'' for a set period
    to maintain the rate.


    Which should you choose?

    The Wrenfield Everyday Saver is the superior choice for those who value simplicity
    and immediate accessibility without needing a large sum of money to start. A competitor''s
    product may be preferable only if the customer has a very large balance and is
    willing to accept complex tiered structures for a potentially higher marginal
    rate on a specific slice of their savings.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 96a95314-b180-50cc-9f26-0cb2bcbcd3f8
  title: Wrenfield Everyday Saver — risk disclosures
  body: 'This document provides essential regulatory disclosures for customers comparing
    the Wrenfield Everyday Saver with other financial products. Please read these
    carefully to understand the risks and protections associated with this account.


    Interest Rate Variability

    The current interest rate of 2.1% is variable. This means that while we strive
    for stability, we may increase or decrease this rate at our discretion based on
    market conditions. Changes to the rate will be communicated to customers in accordance
    with our standard notice periods.


    Deposit Protection

    We operate under the strict authorisation of the Prudential Regulation Authority
    (PRA) and are regulated by the Financial Conduct Authority (FCA). As such, eligible
    deposits in the Wrenfield Everyday Saver are protected by the Financial Services
    Compensation Scheme (FSCS). The protection limit is £120,000 per person. In specific
    circumstances involving temporary high balances (such as the sale of a property),
    protection may extend up to £1.4 million for a limited period.


    Advice Boundaries

    Wrenfield Bank provides general financial education and product information regarding
    the Everyday Saver. However, we do not offer individualised tax or legal advice.
    The tax treatment of interest earned on this account depends on your individual
    circumstances and may be subject to change in the future.


    Consumer Duty

    In line with the FCA''s Consumer Duty, we are committed to acting to deliver good
    outcomes for retail customers. We ensure that our products are fit for purpose,
    provide fair value, and are presented with transparency to avoid foreseeable harm.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 55c96310-5eb9-5552-8bb1-787e522e4671
  title: Wrenfield Everyday Saver — how rates are tiered and applied
  body: 'This rate sheet is intended for support agents to explain the interest structure
    of the Wrenfield Everyday Saver to customers.


    Interest Rate Structure:

    The Wrenfield Everyday Saver does not use a tiered interest structure. A single,
    flat interest rate of 2.1% applies to all balances regardless of the amount held
    in the account.


    Application of Rates:

    - Rate: 2.1%

    - Application: This rate is applied to the entire balance from the moment the
    account is opened with the minimum deposit of £1.

    - Frequency: Interest is calculated on a daily basis to ensure fairness and is
    credited to the account according to our standard internal cycle.


    What would change the rate?

    Because this is a variable rate account, the 2.1% figure may be adjusted by the
    bank in response to changes in the base rate set by the Bank of England or shifts
    in the broader economic environment. There are no customer-led actions (such as
    increasing the balance) that will trigger a higher rate, as the rate remains uniform
    for all users of this product.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
