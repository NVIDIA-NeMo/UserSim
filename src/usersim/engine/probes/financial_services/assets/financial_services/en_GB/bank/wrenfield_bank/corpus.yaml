- id: c4b9716e-e674-5a89-b58e-20fcf8c05ccc
  title: Wrenfield Two-Year Fixed Mortgage — qualification tiers
  body: 'The following matrix defines the qualification tiers for the Wrenfield Two-Year
    Fixed Mortgage. Support agents must verify these thresholds during the initial
    application phase.


    | Condition | Requirement/Threshold | Outcome |

    | :--- | :--- | :--- |

    | Loan to Value (LTV) | ≤ 90% | Eligible for consideration |

    | Loan to Value (LTV) | > 90% | Ineligible for this product |

    | Credit Standing | Pass Internal Risk Assessment | Eligible for consideration
    |

    | Credit Standing | Fail Internal Risk Assessment | Ineligible |

    | Affordability | Pass Affordability Assessment | Eligible for consideration |

    | Affordability | Fail Affordability Assessment | Ineligible |


    All eligible applicants will be subject to the same product fee of £999 and the
    fixed rate of 5.64%. No exceptions to the 90% LTV limit are permitted under current
    risk and compliance posture.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: eligibility_matrix
