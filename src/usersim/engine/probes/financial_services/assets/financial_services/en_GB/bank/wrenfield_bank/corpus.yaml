  institution_id: wrenfield_bank
- id: 80eb3831-1729-52ce-b332-0e0db6156307
  title: Wrenfield Personal Loan — make a change or update
  body: 'If you need to update the details associated with your Wrenfield Personal
    Loan, we provide a structured process to ensure your account remains secure and
    accurate.


    **Before you begin**

    To make any changes, you must be prepared to undergo our full identity authentication.
    We cannot perform state-changing actions without first verifying your identity
    to prevent unauthorised access.


    **Step 1: Request the Update**

    Tell us exactly which detail needs changing. This could be your residential address,
    telephone number, or the bank account you use for your monthly repayments.


    **Step 2: Identity Verification**

    We will guide you through a series of security questions or authentication steps.
    This ''verify-first'' approach is mandatory for all loan modifications.


    **Step 3: Provide Supporting Evidence**

    Depending on the change, we may ask you to provide documentation. For example,
    a change of address may require a recent utility bill or council tax statement.
    We will confirm once these documents have been reviewed and accepted.


    **Step 4: Confirmation of Change**

    Once verified, we will apply the update to your account. We will then provide
    you with a confirmation message or letter stating that the change has been completed.


    **Step 5: Review Your Statement**

    Check your next monthly statement to ensure the updated information is correctly
    reflected. If you are changing your payment date, we will confirm the date of
    your next scheduled repayment to ensure no payments are missed.


    If you encounter any issues while attempting to update your details digitally,
    please see Wrenfield Personal Loan — access or login problems.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: e9487241-d161-58e3-81d5-bb8c53c4c040
  title: Wrenfield Personal Loan — access or login problems
  body: 'If you are unable to access your loan details via our digital channels, please
    follow this troubleshooting guide to resolve the issue.


    **Symptom: ''Unable to authenticate'' or ''Account not found'' messages**

    This typically occurs when the digital security credentials do not match our internal
    records, or when a security lock has been placed on the account for your protection.


    **What to check in order:**

    1. **Credential Accuracy:** Ensure you are using the correct username and password.
    Please note that our systems are case-sensitive.

    2. **Account Status:** Check if you have recently changed your contact details.
    If your registered email or phone number is outdated, you may be unable to complete
    multi-factor authentication.

    3. **Browser/App Cache:** Try clearing your browser cache or restarting the application
    to ensure you are loading the most recent version of the login page.


    **The Fix**

    If the above checks do not resolve the problem, ask us to reset your digital access
    credentials. We will initiate a full identity verification process to ensure that
    we are speaking with the account holder. Once your identity is confirmed, we will
    issue a temporary secure access code to your registered mobile device or email.


    **When to Escalate**

    If you have successfully authenticated but your loan balance or payment schedule
    is not appearing correctly, we will raise a technical case with our senior management
    team. You can expect a resolution or a detailed update within eight weeks, as
    per our standard dispute and issue handling timelines.


    For general information on how to set up your account initially, see Wrenfield
    Personal Loan — overview.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 1f472837-2464-52f5-9aca-d97936b8e257
  title: Wrenfield Personal Loan — qualification tiers
  body: 'This matrix is for support agents to determine the potential loan outcomes
    based on a customer''s eligibility profile. All outcomes are subject to a final
    affordability assessment.


    | Customer Profile | Max Loan Amount | Representative APR | Outcome |

    | :--- | :--- | :--- | :--- |

    | High Credit Score / Low DTI | Up to £35,000 | 6.9% | Likely Approval |

    | Medium Credit Score / Moderate DTI | Up to £20,000 | Tiered > 6.9% | Subject
    to Review |

    | Low Credit Score / High DTI | Up to £5,000 | Tiered > 6.9% | High Risk / Likely
    Decline |

    | Non-UK Resident | N/A | N/A | Ineligible |


    *Note: DTI refers to Debt-to-Income ratio. All lending must adhere to our strict
