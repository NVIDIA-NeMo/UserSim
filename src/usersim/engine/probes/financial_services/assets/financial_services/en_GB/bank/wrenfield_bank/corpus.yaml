  institution_id: wrenfield_bank
- id: 9defe43f-ce14-5839-9a72-dc92d072262d
  title: Wrenfield Everyday Saver — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who report that their
    Wrenfield Everyday Saver balance is not what they expected, or who believe an
    unexpected charge has occurred.


    Symptom: The customer states their balance is lower than expected, or they see
    a transaction they do not recognise.


    Likely Causes:

    - Misunderstanding of interest credits: The customer may be expecting a different
    amount based on a misunderstanding of how the 2.1% interest is calculated and
    applied.

    - Pending transfers: A recent transfer out of the account may not have fully cleared,
    or a transfer in may be pending.

    - Errors in external transfers: A mistake in the amount transferred from another
    institution.


    What to check (in order):

    1. Review the transaction history: Check for any outgoing transfers or fees. Note
    that the Everyday Saver does not have a monthly account fee.

    2. Verify interest calculations: Ensure the 2.1% rate has been applied correctly
    to the average daily balance.

    3. Check for pending actions: Look for any authorised but uncompleted transfers.


    Resolution:

    - If the discrepancy is due to a misunderstanding, clearly explain how the interest
    is applied.

    - If a genuine error is found, we will initiate a correction. Depending on the
    case, we may apply a provisional credit to the account to ensure the customer
    is not disadvantaged while we investigate.


    Escalation:

    If the issue remains unresolved after these checks, the matter should be moved
    through our structured escalation path to senior management. We aim for rapid
    resolution and will provide a final response for payment service complaints within
    15 business days.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: d23705b5-ae54-5ce0-90e9-b9afcbc0e3a0
  title: Wrenfield Everyday Saver — required documentation
  body: 'To open a Wrenfield Everyday Saver account, prospective customers must provide
    specific documentation to satisfy our ''verify-first'' security stance. The following
    matrix outlines the requirements and the resulting outcomes.


    | Requirement | Documentation Provided | Outcome |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Driving Licence | Identity Verified
    |

    | Proof of Address | Recent Utility Bill or Council Tax Statement | Address Verified
    |

    | Initial Funding | Transfer of £1 or more | Account Activated |

    | Regulatory Check | Standard KYC/AML screening | Eligibility Confirmed |


    All documents must be current and valid. If any of the above requirements are
    not met, we cannot proceed with the account opening process to ensure we remain
    in compliance with PRA and FCA regulations.'
  domain: retail_banking
