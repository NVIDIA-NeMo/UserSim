  institution_id: wrenfield_bank
- id: 08f3e379-81ff-5cf9-9044-9309d1a7fef5
  title: Wrenfield Everyday Saver — check status or history
  body: 'If you wish to review the current balance of your Wrenfield Everyday Saver
    or examine your recent transaction history, please follow these steps. We ensure
    that all information is disclosed only after rigorous verification to keep your
    assets secure.


    **What you will need before starting**

    - Your account number or the full name associated with the account.

    - A valid form of identification or your security credentials for authentication.


    **Step-by-Step Process**


    1. **Request the Information:** Tell us that you would like to check the status
    or history of your Wrenfield Everyday Saver. Specify whether you need the current
    total balance, the interest accrued to date, or a list of recent transactions.


    2. **Complete Identity Verification:** To protect your funds, we will guide you
    through our ''verify-first'' authentication process. This may involve answering
    security questions or providing a one-time verification code. We will not proceed
    with the disclosure of account details until your identity is fully confirmed.


    3. **Review the Balance and Rates:** Once verified, we will provide your current
    balance. We will also confirm that your funds are currently earning an interest
    rate of 2.1%, allowing you to see how your savings are growing.


    4. **Request Transaction History:** If you require a history of your deposits
    and withdrawals, tell us the specific time period you are interested in (e.g.,
    ''the last 30 days'').


    5. **Receive the Statement Data:** We will then provide a clear, itemised list
    of your recent activity. This will include the date of each transaction, the amount,
    and the resulting balance.


    **How you know it worked**

    You have successfully completed this process when you have received a confirmed
    balance figure and a transaction list that matches your own records. If you notice
    any discrepancies in the history provided, please let us know immediately so we
    can investigate the matter for you.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 56113f6c-b3e4-59f5-aae8-7c8dfb07337f
  title: Wrenfield Everyday Saver — a declined or blocked action
  body: 'It can be frustrating when you are unable to move your funds or manage your
    savings. If you experience a declined or blocked action while using your Wrenfield
    Everyday Saver, please refer to the following guide to identify and resolve the
    issue.


    **The Symptom**

    You may receive a notification that a transfer is ''declined'', or you may find
    that your account is temporarily ''blocked'' from making withdrawals.


    **Likely Causes**

    1. **Verification Failure:** Our ''verify-first'' security stance means that if
    identity authentication is incomplete or unsuccessful, the action will be automatically
    blocked to prevent unauthorised access.

    2. **Security Flag:** Our systems may have detected a pattern of activity that
    appears unusual, triggering a protective block to shield your funds from potential
    fraud.

    3. **Insufficient Funds:** While the account allows a £0 balance, any request
    to withdraw more than the available balance (including accrued interest from the
    2.1% rate) will be declined.


    **What to Check and How to Fix**

    - **Check Your Authentication:** If the action was declined during a digital or
    telephone request, ensure you have completed all security prompts. If you are
    unsure, ask us to restart the verification process.

    - **Verify Recipient Details:** If a transfer is blocked, double-check that the
    destination account details are correct. Errors in account numbers often trigger
    security alerts.

    - **Confirm Balance:** Check your current available balance. Ensure you are not
    attempting to withdraw more than what is currently held in the account.


    **When to Escalate**

    If you have verified your identity and confirmed you have sufficient funds, but
    the action remains blocked, we will escalate the issue. We will raise a formal
    case with our security specialists to manually review the block. You can expect
    a resolution or a detailed update within our standard business hours. If the issue
    relates to a payment service complaint, we aim to provide a final response within
    15 business days.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: cd71736d-59f7-57d4-bba7-8920a0847484
  title: Wrenfield Everyday Saver — when to switch or upgrade
  body: 'Support agents should use this guide to help customers decide if the Wrenfield
    Everyday Saver remains the best fit for their needs or if an upgrade is appropriate.


    **When to stay with the Everyday Saver**

    This product is ideal for customers who value total flexibility and low barriers,
    as it only requires a £1 minimum opening deposit and earns 2.1% interest without
    any lock-in periods.


    **When to suggest a switch or upgrade**

    - **For Higher Interest Growth:** If the customer can commit to regular monthly
    savings (up to £300), they should consider the Wrenfield Regular Saver for a higher
    interest rate over a shorter term.

    - **For Tax Efficiency:** If the customer has a significant sum to save (up to
    the £20,000 annual allowance), suggest the Wrenfield Easy Access Cash ISA to protect
    their earnings from tax.

    - **For Daily Spending:** If the customer is using this account for frequent bill
    payments, remind them that the Wrenfield Current Account is the primary hub for
    daily banking and carries a £0 monthly account fee.


    Always ensure a full affordability assessment is conducted if the customer is
    moving funds towards a lending product.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: f4ce70a9-4c79-5873-8150-d6a535a25413
  title: Wrenfield Everyday Saver — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right savings vehicle depends on your financial goals, your
    need for liquidity, and your tax position. The Wrenfield Everyday Saver is designed
    as a dependable, flexible hub for your money, but it may not be the optimal choice
    for every scenario.


    **Why Choose the Wrenfield Everyday Saver?**

    This account is built for accessibility and stability. It is the best choice if:

    - **You are starting small:** With a minimum opening deposit of only £1, there
    is virtually no barrier to starting your savings journey.

    - **You need instant access:** Unlike fixed-term accounts, you can withdraw your
    funds at any time without penalty, all while earning a steady 2.1% interest rate.

    - **You want simplicity:** There are no complex tiers or monthly fees to manage.


    **When to Consider Alternatives**

    While the Everyday Saver is versatile, other Wrenfield products may offer better
    advantages depending on your circumstances:


    - **If you are saving for a specific short-term goal:** If you can commit to a
    disciplined monthly saving habit, our Regular Saver may offer a higher interest
    rate than the 2.1% provided here, provided you stay within the maximum monthly
    deposit limit of £300.

    - **If you want to protect your interest from tax:** If you have a larger sum
    to save, the Wrenfield Easy Access Cash ISA allows you to save up to £20,000 per
    tax year, ensuring your interest remains tax-free.

    - **If you are looking for a daily banking hub:** If your primary need is paying
    bills and receiving your salary, the Wrenfield Current Account is the appropriate
    choice, offering a £0 monthly account fee and a streamlined experience.


    **Summary Table**


    | Feature | Wrenfield Everyday Saver | Regular Saver | Cash ISA |

    | :--- | :--- | :--- | :--- |

    | **Opening Deposit** | £1 | Varies | Varies |

    | **Interest Rate** | 2.1% | Higher (Short-term) | Tax-efficient |

    | **Access** | Instant | Restricted/Goal-based | Instant |

    | **Key Limit** | None | £300 monthly max | £20,000 annual limit |


    We recommend assessing your monthly budget and tax bracket before choosing. We
    provide general financial education to help you decide, although we do not offer
    individualised tax or legal advice.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: afa47d1a-7555-5aae-aacf-4d8da3176cad
  title: Wrenfield Everyday Saver — how-to / step-by-step
  body: '**How do I add more money to my Wrenfield Everyday Saver?**

    You can add funds simply by asking us to transfer a specific amount from your
    Wrenfield Current Account into your saver. We will verify your identity, execute
    the transfer, and confirm the new balance, which will then earn 2.1% interest.


    **How do I withdraw money from this account?**

    To withdraw, tell us the amount you wish to move and the destination account (such
    as your current account). Once we have completed our ''verify-first'' authentication,
    we will move the funds immediately.


    **How can I see how much interest I have earned?**

    You can request a status update at any time. We will provide your current balance
    and the total interest accrued based on the 2.1% rate. For a full history, you
    can request a transaction statement for a specific period.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 665b7083-8182-5158-b573-a9b17e76e9e8
  title: Wrenfield Everyday Saver — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the transfer of funds from an
    external banking institution into a new Wrenfield Everyday Saver. This process
    allows you to consolidate your savings into a dependable high-street environment.


    **What you will need before starting**

    - The account details of your external bank (Account Number and Sort Code).

    - The amount you wish to transfer (ensuring it is at least the £1 minimum opening
    deposit if the account is not yet open).

    - Valid identification for our security verification.


    **Step-by-Step Process**


    1. **Initiate the Transfer Request:** Tell us that you wish to move funds from
    another bank into a Wrenfield Everyday Saver. If you do not yet have the account,
    tell us you would like to open one using this transfer as your initial deposit.


    2. **Provide Account Details:** Give us the necessary details of the external
    account from which the funds will be drawn. We will record these precisely to
    ensure the transfer is routed correctly.


    3. **Undergo Identity Authentication:** In line with our ''verify-first'' stance,
    we will perform a full identity check. This ensures that the request is legitimate
    and protects your assets from unauthorised access. We will not initiate any external
    fund movement until this is complete.


    4. **Confirm the Transfer Amount:** We will confirm the exact amount to be transferred.
    If this is a new account, we will verify that the amount meets or exceeds the
    £1 minimum opening deposit requirement.


    5. **Execution and Confirmation:** We will then process the transfer. Once the
    funds have arrived and the account is funded, we will provide you with your new
    account details and confirm that your balance is now earning a 2.1% interest rate.


    **How you know it worked**

    The process is complete when you receive confirmation that the funds have been
    successfully received and are now held within your Wrenfield Everyday Saver. You
    can then verify this by requesting a balance check as detailed in the Wrenfield
    Everyday Saver — check status or history guide.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: c505b0a9-5065-50b8-a414-d7a480813b48
  title: Wrenfield Everyday Saver — a discrepancy in your records or statement
  body: 'As a support agent, you may encounter customers who believe there is an error
    in their Wrenfield Everyday Saver balance or the interest credited to their account.
    Handling these discrepancies requires a methodical approach to ensure transparency
    and fairness.


    **The Symptom**

    A customer reports that their balance is lower than expected, or they believe
    the interest earned does not align with the quoted 2.1% rate.


    **Likely Causes**

    1. **AER Misunderstanding:** The customer may be confused about how the Annual
    Equivalent Rate (AER) is applied. Interest is calculated daily, so the monthly
    credit may seem lower than a simple division of the annual rate.

    2. **Pending Transactions:** A recent deposit or withdrawal may not yet be fully
    settled, leading to a temporary discrepancy in the visible balance.

    3. **Incorrect Calculation Period:** The customer may be looking at a statement
    period that does not align with the dates they are calculating in their own records.


    **What to Check and How to Fix**

    - **Review the Interest Rate:** Confirm that the account is correctly earning
    the 2.1% rate. Check for any recent changes in the variable rate that may have
    affected the accrual.

    - **Audit Transaction History:** Compare the customer''s reported transactions
    against the bank''s internal ledger. Verify the exact dates and amounts of all
    credits and debits.

    - **Explain the Accrual:** If the discrepancy is due to the AER calculation, clearly
    explain that interest is calculated daily. Use a simple example to show how the
    2.1% is applied to their specific balance over the period in question.


    **When to Escalate**

    If the audit reveals a genuine calculation error or a missing transaction that
    cannot be resolved immediately, you must escalate the issue through our structured
    path to senior management. We will open a formal investigation and notify the
    customer. We aim to provide a final response for all disputes within eight weeks,
    though we strive for much faster resolution to maintain the trust and stability
    our customers value.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6b338674-a250-51ad-b1cb-aeb319cc0bea
  title: Wrenfield Regular Saver — overview
  body: 'Welcome to the Wrenfield Regular Saver, a dependable savings tool designed
    for those who value stability and a structured approach to growing their wealth.
    We have developed this account to help our customers build a habit of consistent
    saving while benefiting from a competitive return on their deposits.


    The Wrenfield Regular Saver is built around a straightforward model: you commit
    to saving a set amount each month for a fixed period, and in return, we provide
    a significantly higher interest rate than a standard flexible account. This product
    is ideal for customers saving towards a specific short-term goal, such as a holiday,
    a home improvement project, or an emergency fund.


    Key Product Features:


    - Interest Rate: We offer a rewarding interest rate of 6% to help your savings
    grow faster.

    - Monthly Deposits: To encourage sustainable saving, we set a maximum monthly
    deposit of £300. This ensures the account remains a tool for regular accumulation
    rather than a lump-sum vehicle.

    - Account Term: The account operates over a fixed term of 12 months. At the end
    of this period, the term concludes, and you can decide whether to move your balance
    into another product or withdraw the funds.


    As part of our commitment to transparency and the Consumer Duty, we ensure that
    there are no hidden charges associated with the maintenance of this account. Furthermore,
    your peace of mind is our priority; as a regulated institution, eligible deposits
    in the Wrenfield Regular Saver are protected by the FSCS up to £120,000 per person,
    with temporary high balances protected up to £1.4 million.


    For those who may need a more flexible option where funds can be withdrawn at
    any time without a fixed term, we recommend exploring the Wrenfield Everyday Saver
    — overview. By combining the stability of our high-street presence with fair pricing,
    we aim to provide a saving experience that is both welcoming and effective.'
  domain: retail_banking
  product_category: regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b7f35d76-7e19-552a-988b-47788d79fbe3
  title: Wrenfield Regular Saver — interest rate (AER) explained
  body: 'Q: What does the 6% interest rate on my Wrenfield Regular Saver actually
    mean?


    A: The 6% rate is quoted as the Annual Equivalent Rate (AER). This is a standard
    industry measure that shows what the interest rate would be if interest was paid
    and compounded once a year. It allows you to compare our rate fairly against other
    savings products.


    Q: How is this interest applied to my balance?


    A: We calculate interest daily on the balance of your account and credit it to
    you at the end of the 12 month term. Because you are adding to your balance monthly—up
    to a maximum monthly deposit of £300—the actual cash interest you earn will be
    based on the timing of your deposits throughout the year.


    Q: Can the rate change during the term?


    A: The 6% rate for the Wrenfield Regular Saver is fixed for the duration of the
    12 month term, providing you with the stability and predictability we believe
    our customers value. For more details on costs, you may wish to review the Wrenfield
    Regular Saver — fee schedule.'
  domain: retail_banking
  product_category: regular_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 1ebc6737-a257-52fa-ad22-0b51fdf6620a
  title: Wrenfield Regular Saver — set up and activate
  body: 'Setting up your Wrenfield Regular Saver is a straightforward process. This
    guide outlines the steps required to move from a prospective customer to an active
    saver, ensuring you can begin earning a 6% interest rate as soon as possible.


    Before you begin, please ensure you have an active Wrenfield Current Account,
    as this is required to fund your monthly deposits.


    1. Request the Account: Tell us that you wish to open a Wrenfield Regular Saver.
    We will initiate the application process and confirm the current product terms
    with you.


    2. Define Your Savings Goal: Specify the amount you intend to deposit each month.
    Please note that we maintain a maximum monthly deposit of £300. We will confirm
    that your chosen amount falls within this limit.


    3. Complete Identity Verification: In line with our ''verify-first'' security
    stance, we will perform a full identity authentication. This may involve confirming
    personal details or providing specific identification documents to ensure the
    security of your assets.


    4. Confirm the Term: We will verify your agreement to the 12 month term of the
    account. You will be informed that the account will mature at the end of this
    12 month period.


    5. Establish the Funding Path: Ask us to set up a standing order from your Wrenfield
    Current Account to your new Regular Saver. This ensures your monthly deposits
    are automated and you never miss out on the 6% interest.


    6. Receive Activation Confirmation: We will provide a final confirmation once
    the account is active. You will see the Wrenfield Regular Saver appear in your
    account list, and your first deposit will be processed on the agreed date.


    If you are still deciding which product is right for you, you may find the Wrenfield
    Regular Saver — vs. a similar product here useful for comparing our options.'
  domain: retail_banking
  product_category: regular_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6995ff45-71b4-5a8f-a046-51c7cdc5d819
  title: Wrenfield Regular Saver — fee schedule
  body: 'Wrenfield Bank believes that essential saving tools should be accessible
    and transparent. Accordingly, the Wrenfield Regular Saver is designed as a low-cost
    vehicle for retail customers to grow their money.


    - Monthly Account Fee: £0

    - Account Opening Fee: £0

    - Account Closing Fee: £0

    - Monthly Deposit Fee: £0


    There are no operational charges or regulatory risk fees applied to the maintenance
    of the Wrenfield Regular Saver. All deposits up to the maximum monthly deposit
    of £300 are processed without charge. We maintain this fee-free structure to ensure
    our customers can focus entirely on their saving goals without eroding their returns.'
  domain: retail_banking
  product_category: regular_saver
  document_type: fee_schedule
  source_authority: official
