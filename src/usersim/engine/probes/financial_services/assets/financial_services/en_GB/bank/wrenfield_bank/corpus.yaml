- id: 72d0bbfd-edbd-59a6-a193-05df3f6993b5
  title: Wrenfield Easy Access Cash ISA — a declined or blocked action
  body: 'It can be frustrating when a transaction is declined or a feature is blocked.
    This guide helps you identify the cause and resolve the issue quickly.


    **The Symptom**

    You attempt to deposit funds into your account or perform a withdrawal, but the
    action is declined, or you receive a notification that the action is blocked.


    **Likely Causes**

    - **Allowance Breach:** You may have reached the annual ISA deposit limit of £20,000.
    Any further deposits in the same tax year will be automatically blocked by our
    systems to ensure regulatory compliance.

    - **Verification Failure:** Because we maintain a rigorous ''verify-first'' stance,
    an action may be blocked if our identity authentication process was not completed
    successfully.

    - **Account Freeze:** In rare cases, an account may be temporarily blocked if
    we detect activity that suggests unauthorised access or potential fraud.


    **What to check in order**

    1. **Check your total deposits:** Review your transaction history for the current
    tax year. If your total deposits have reached £20,000, the block is due to the
    legal ISA limit.

    2. **Verify your identity details:** Ensure that the personal information you
    provided during the verification step is current and matches our records.

    3. **Check for security notifications:** Review any recent communications from
    us to see if we have flagged a security concern on your account.


    **The Fix**

    - **If the limit is reached:** You must wait until the start of the next tax year
    to make further deposits. No further action is required to unblock the account
    for withdrawals.

    - **If verification failed:** Provide updated identity documentation as requested.
    Once we have fully authenticated you, the block on the action will be removed.

    - **If the account is frozen:** Confirm the recent transactions in question with
    us. Once we are satisfied the activity is legitimate, we will lift the freeze.


    **When to escalate**

    If the cause remains unclear after these checks, we will raise the matter to senior
    management for a structured review. You will receive a final response regarding
    the resolution within eight weeks.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7970e641-72b6-51e0-bdb7-7c106030460a
  title: Wrenfield Easy Access Cash ISA — when to switch or upgrade
  body: 'Depending on your savings goals, you may find that a different product better
    suits your needs. Here is when to consider switching from the Wrenfield Easy Access
    Cash ISA.


    **Switch to a Regular Saver if:**

    You are saving for a specific short-term goal and can commit to monthly deposits.
    The Wrenfield Regular Saver offers a high-interest short-term goal account, though
    it has a maximum monthly deposit of £300, whereas the Cash ISA allows you to deposit
    up to £20,000 per year.


    **Switch to an Everyday Saver if:**

    You need a low-barrier account for very small amounts of money. The Wrenfield
    Everyday Saver requires only a £1 minimum opening deposit, making it more flexible
    for those just starting to save, although it lacks the tax-efficient status of
    the Cash ISA''s 2.85% interest.


    **Remain with the Easy Access Cash ISA if:**

    You want the most tax-efficient way to save up to £20,000 per year while maintaining
    the ability to withdraw your money at any time without penalty. The 2.85% rate
    provides a stable return on a flexible, tax-free basis.


    For more on comparing our options, see Wrenfield Easy Access Cash ISA — comparison
    vs. alternatives and when not to choose it.'
  domain: retail_banking
  product_category: cash_isa
  document_type: comparison
  source_authority: official
  placeholder: true
