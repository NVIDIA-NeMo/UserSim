- id: 2fcaf9fe-4e89-5fba-94d5-aeaebfc43573
  title: Wrenfield Two-Year Fixed Mortgage — getting started walkthrough
  body: 'This walkthrough is intended for support agents assisting customers with
    the onboarding process for the Wrenfield Two-Year Fixed Mortgage. Please ensure
    all steps are followed to maintain our commitment to the Consumer Duty.


    Step 1: Initial Inquiry and Education

    Provide the customer with the core product details: a fixed rate of 5.64% for
    two years and an overall APRC of 7.4%. Ensure they understand that the loan is
    subject to a maximum LTV of 90%.


    Step 2: Affordability and Qualification

    Perform a strict affordability assessment to avoid foreseeable harm. Verify that
    the customer''s loan-to-value ratio does not exceed the 90% threshold. Explain
    that the product carries a product fee of £999, which can be paid upfront or added
    to the loan balance.


    Step 3: Application and Valuation

    Once affordability is confirmed, guide the customer through the formal application.
    We will then arrange for a professional valuation of the property to confirm the
    90% LTV limit is adhered to.


    Step 4: Offer and Completion

    Upon successful valuation and credit checks, we will issue a formal mortgage offer.
    The customer must be informed that if they wish to overpay during the term, they
    have an overpayment allowance of 10% per annum without incurring charges.


    Step 5: Post-Completion Guidance

    Advise the customer that after the two-year fixed period ends, the loan will transition
    to the Standard Variable Rate of 7.49%. For more details on long-term cost implications,
    refer them to Wrenfield Two-Year Fixed Mortgage — overall cost for comparison
    (APRC) explained.'
