  institution_id: wrenfield_bank
- id: 949dce9a-a997-5ffe-8bc3-64f19a45a303
  title: Wrenfield Easy Access Cash ISA — referral and loyalty offer
  body: 'We believe that the best way to grow our community is through the trust of
    our existing customers. We are pleased to introduce our loyalty and referral initiative
    for the Wrenfield Easy Access Cash ISA, designed to reward those who help others
    secure their financial future with us.


    If you refer a friend or family member who opens an account, both you and your
    referral can benefit from our commitment to stability and transparency. New customers
    can start their journey with an annual interest rate of 2.85%, ensuring their
    savings grow steadily in a dependable environment. We make it simple for your
    referrals to maximise their tax-efficient savings, supporting them in utilising
    their annual ISA allowance of £20,000.


    This offer is available for all successful referrals made between 1 November 2024
    and 31 March 2025. We invite you to share the benefit of fair pricing and a professional
    service with your network today. To learn more about how this fits with our broader
    product range, you may wish to see the Wrenfield Easy Access Cash ISA — overview.'
  domain: retail_banking
