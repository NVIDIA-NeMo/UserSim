- id: 41e3542a-bd7a-5e18-9a35-825eeed6e28a
  title: Wrenfield Rewards Credit Card — cancel, close, or downgrade
  body: 'If you have decided that the Wrenfield Rewards Credit Card no longer meets
    your needs, we provide a clear process for cancellation, closure, or downgrading
    your account.


    Before you begin, please ensure you have a current statement to verify your final
    balance, as all outstanding funds must be settled before an account can be closed.


    1. Request the Action: Tell us whether you wish to close the account entirely
    or downgrade to a different credit product. We will perform a full identity authentication
    to verify your identity before proceeding with this state-changing action.

    2. Settle the Outstanding Balance: We will confirm the total amount required to
    bring your balance to £0. This includes any remaining spend, accrued interest
    at the representative APR of 24.9%, and any pending fees, such as the 2.99% foreign
    transaction fee or the 3.49% balance transfer fee if applicable.

    3. Confirm the Final Settlement: Once the payment has been processed, we will
    confirm that your balance is clear. If you are downgrading, we will outline the
    new terms and limits of the lower-tier product.

    4. Receive Written Confirmation: We will provide you with a final closing statement
    or a confirmation of the downgrade. This serves as your proof that the account
    has been handled according to your request.


    If you are choosing to close this account because you are moving to a different
    type of banking relationship with us, you may find the process described in Wrenfield
    Current Account — cancel, close, or downgrade helpful for managing your other
    products.'
  domain: cards
  product_category: credit_card
  document_type: how_to_guide
  source_authority: official
