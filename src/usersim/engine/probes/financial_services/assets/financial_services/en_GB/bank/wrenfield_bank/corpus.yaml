- id: 0b897618-e2aa-551f-865d-ad2eba7bed2c
  title: Wrenfield Two-Year Fixed Mortgage — regulatory disclosures
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA), ensuring all customers are treated fairly in accordance with the Consumer
    Duty.


    The overall cost of the Wrenfield Two-Year Fixed Mortgage, encompassing both the
    interest rate and the associated fees, is represented by an Annual Percentage
    Rate of Charge (APRC) of 7.4%.


    All lending recommendations are subject to a rigorous affordability assessment.
    This is a mandatory requirement to ensure that the loan is sustainable for the
    borrower and to avoid foreseeable harm. This assessment considers your income,
    existing debts, and general expenditure.


    Please be advised that the initial fixed rate of 5.64% is guaranteed only for
    the first two years of the term. Following this period, the loan will transition
    to the standard variable rate of 7.49%.


    Early repayment charges apply if the loan is settled or switched before the end
    of the fixed term: 3% during the first year and 2% during the second year. We
    provide a limited overpayment allowance of 10% per year to assist customers in
    reducing their debt without penalty.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: disclosure
