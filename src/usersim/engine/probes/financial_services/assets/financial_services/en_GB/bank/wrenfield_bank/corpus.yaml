- id: 3419c0da-7d9b-52f7-8d42-177905e7d49e
  title: Wrenfield Easy Access Cash ISA — a failed or pending action
  body: 'It can be frustrating when a request to open or fund your ISA does not go
    through as expected. Below are the most common symptoms customers describe, the
    likely causes, and how we can resolve them.


    **Symptom: "I am unable to deposit funds into my ISA account"**

    - **Likely Cause:** You may have reached or exceeded the current annual ISA allowance
    of £20,000. If you have already contributed to other ISAs this tax year, this
    limit applies across all providers.

    - **What to check:** Review your total ISA contributions since 6 April of the
    current tax year.

    - **The Fix:** To resolve this, you must reduce the deposit amount to stay within
    the £20,000 limit. Once the amount is adjusted, we can process the transfer immediately.


    **Symptom: "My account application is showing as pending or failed"**

    - **Likely Cause:** Our ''verify-first'' security protocol may have encountered
    an issue with your identity documentation, or the provided address does not match
    our records.

    - **What to check:** Ensure the identification provided is current and that the
    address is exactly as it appears on your utility bills or government correspondence.

    - **The Fix:** Provide us with a clear, updated copy of your photo ID or a recent
    proof of address. We will then re-verify your details and activate the account.


    **When to escalate**

    If you have provided all requested documents and confirmed you are within the
    £20,000 limit, but the action remains pending for more than three business days,
    we will raise a case to our senior management team for a structured review. You
    will receive a status update via your preferred contact method within two business
    days of the escalation.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
