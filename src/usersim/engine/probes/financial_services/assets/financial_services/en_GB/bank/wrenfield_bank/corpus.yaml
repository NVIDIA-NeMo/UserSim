- id: 122d788c-e2d0-580b-856a-979471c64bc4
  title: Wrenfield Regular Saver — account agreement
  body: 'This agreement sets out the terms and conditions governing the Wrenfield
    Regular Saver. By opening this account, the customer agrees to the following obligations:


    1. Account Term and Deposits

    The account is opened for a fixed term of 12 months. To maintain the account in
    good standing, the customer may make monthly deposits. The maximum monthly deposit
    allowed is £300. Any attempts to deposit funds exceeding this £300 limit within
    a single calendar month may be rejected or returned to the source account.


    2. Interest Application

    We provide an interest rate of 6% on the balance of the account. Interest is calculated
    daily and credited to the account. This rate is subject to the bank''s general
    terms and conditions regarding interest payment schedules.


    3. Withdrawals and Account Closure

    This account is designed for regular saving over its 12-month term. While we allow
    for the closure of the account, early closure or withdrawals may affect the final
    interest earned. The agreement ends naturally at the conclusion of the 12-month
    period, at which point the balance and accrued interest are typically transferred
    to a nominated Wrenfield account.


    4. Bank Obligations

    We operate under the strict authorisation of the PRA and regulation by the FCA.
    We commit to treating all customers fairly and ensuring transparency in all pricing.
    Eligible deposits are protected by the FSCS up to £120,000 per person, with temporary
    high balances protected up to £1.4 million.


    5. Changes to Terms

    We reserve the right to amend these terms. Customers will be provided with notice
    of any material changes. For further information on how we handle updates to our
    agreements, please refer to Wrenfield Current Account — change-of-terms policy.'
