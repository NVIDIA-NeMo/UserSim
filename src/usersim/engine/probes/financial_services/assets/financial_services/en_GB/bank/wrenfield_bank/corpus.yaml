- id: f58b09f8-38a2-5a05-b405-bceeb4d05fc2
  title: Wrenfield Current Account — getting started walkthrough
  body: 'This walkthrough is intended for support agents assisting customers with
    the opening and initial setup of a Wrenfield Current Account. Our goal is to provide
    a professional and welcoming onboarding experience that emphasises transparency.


    Step 1: Identity Verification

    Before discussing account specifics or initiating an application, you must perform
    full identity authentication. Ensure the customer provides the required documentation
    as specified in Wrenfield Current Account — required documentation. We operate
    a ''verify-first'' policy to prevent unauthorised access.


    Step 2: Product Feature Confirmation

    Clearly explain the core benefits of the account to the customer:

    - Confirm that the Wrenfield Current Account carries a £0 monthly account fee,
    making essential banking accessible.

    - Discuss the arranged overdraft facility, noting the representative rate of 39.9%.

    - If the customer is switching from another institution, explain the £175 switching
    incentive and the streamlined process via the Current Account Switch Service.


    Step 3: Affordability and Eligibility

    Ensure the customer meets the basic requirements. If an overdraft is requested,
    you must conduct a strict affordability assessment to ensure the customer can
    manage the facility without foreseeable harm.


    Step 4: Activation and Finalisation

    Once the application is approved, guide the customer through the activation of
    their digital channels and the receipt of their debit card. Confirm that they
    understand how to monitor their balance and that their eligible deposits are protected
    by the FSCS up to £120,000 per person.


    For more detail on who this account is best suited for, refer to Wrenfield Current
    Account — who it is best for and common use cases.'
