- id: 55c5d9ff-d255-5b6f-816a-24cccc9e382e
  title: Wrenfield Regular Saver — how rates are tiered and applied
  body: 'The Wrenfield Regular Saver utilises a simplified, flat-rate interest structure
    to ensure transparency and fairness for all customers.


    Interest Rate: 6%


    Application of Rates:

    - No Tiering: There are no balance tiers for this product. The 6% interest rate
    applies to all balances held within the account, regardless of the amount, provided
    the account remains in good standing.

    - Monthly Deposit Limit: The rate applies to all deposits up to the maximum monthly
    deposit of £300. Deposits exceeding this limit are not permitted and will not
    earn interest.

    - Calculation: Interest is calculated on a daily basis and credited to the account.
    This ensures that customers earn interest on every pound saved from the moment
    it is deposited.

    - Term: This rate is applicable for the 12-month term of the account.


    Any adjustments to this rate would be communicated to the customer via our standard
    notice period as outlined in our general terms and conditions.'
