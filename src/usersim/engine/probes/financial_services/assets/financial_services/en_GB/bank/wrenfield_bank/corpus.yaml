  institution_id: wrenfield_bank
- id: 2e0dc40e-48a5-51a4-a717-a35ea5f0e170
  title: Wrenfield Current Account — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our highest priority. To
    protect your Wrenfield Current Account from unauthorised access, we maintain a
    rigorous ''verify-first'' stance. This means we will always require full identity
    authentication before performing any state-changing action on your account or
    disclosing sensitive information.


    To keep your account secure, we recommend the following best practices:


    1. Protect Your Credentials: Never share your online banking password, PIN, or
    one-time passcodes with anyone. We will never ask you for your full security credentials
    over the telephone or via email.


    2. Be Vigilant with Communications: Be wary of emails or text messages that create
    a sense of urgency or ask you to click a link to ''verify'' your account. Always
    access your account through our official channels.


    3. Monitor Your Statements: Regularly review your transaction history. If you
    notice any payment or withdrawal that you do not recognise, inform us immediately.


    4. Secure Your Devices: Ensure that the devices you use to access your banking
    are kept up to date with the latest security software and are protected by strong
    passwords or biometric locks.


    If you suspect that your security has been compromised, the first action you should
    take is to notify us immediately so that we can freeze your account and prevent
    further unauthorised activity. We aim for rapid resolution and will work with
    you to secure your funds. For more information on how we handle suspicious activity,
    please refer to Wrenfield Current Account — fraud and unauthorised-activity protection.'
  domain: retail_banking
  product_category: current_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 057c73aa-8c60-5f75-8047-9d6d3c49f16c
  title: Wrenfield Current Account — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    governing the Wrenfield Current Account. As a dependable institution, we strive
    for stability, but we reserve the right to amend our terms to reflect changes
    in regulatory requirements, operational costs, or market conditions.


    Notification of Changes

    We will provide you with clear, written notice of any material changes to your
    account terms. This notice will be delivered via your preferred communication
    channel and will specify the nature of the change and the date it becomes effective.
    For significant changes, such as the introduction of a fee where there was previously
    a £0 monthly account fee, we will provide ample notice to ensure you can make
    an informed decision about your banking.


    Interest Rates and Fees

    Our arranged overdraft rate is currently 39.9%. Because this is a variable rate,
    it may change based on the Bank of England base rate or other regulatory factors.
    We will notify you of any changes to this rate in accordance with our standard
    notification periods.


    Your Rights

    If you do not agree to the new terms provided in our notice, you have the right
    to close your account without penalty before the changes take effect. We will
    assist you in the closure process to ensure a smooth transition of your funds.


    This policy is designed to ensure transparency and fairness, adhering to the Consumer
    Duty to avoid foreseeable harm. For a full overview of your obligations and our
    commitments, please see Wrenfield Current Account — account agreement.'
  domain: retail_banking
  product_category: current_account
  document_type: terms_conditions
  source_authority: official
