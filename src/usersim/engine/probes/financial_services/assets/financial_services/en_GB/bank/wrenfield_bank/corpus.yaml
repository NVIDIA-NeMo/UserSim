- id: 8597a683-2695-5bb9-9448-a285f51fe1ed
  title: Wrenfield Rewards Credit Card — vs. a typical competitor offering
  body: 'When comparing the Wrenfield Rewards Credit Card to typical high-street competitor
    offerings, the choice depends on whether the customer prioritises immediate cost
    or long-term stability and protection.


    Dimension | Wrenfield Rewards Credit Card | Typical Competitor

    --- | --- |

    Representative APR | 24.9% | Often variable (19% - 35%)

    Balance Transfer Window | 24 months | Often shorter (12 - 18 months)

    Balance Transfer Fee | 3.49% | Varies (typically 1% - 5%)

    Foreign Transaction Fee | 2.99% | Varies (often 2.5% - 3%)

    Consumer Protection | Section 75 included | Standard (if Credit Card)


    Wrenfield is the better choice for customers who value a generous 24-month window
    to clear external debt and the security of a traditional institution that adheres
    strictly to the Consumer Duty. A competitor might be better for a customer who
    has an exceptionally high credit score and can qualify for a lower teaser APR,
    though these often come with more opaque terms. We compete on fair, transparent
    pricing and a commitment to avoiding foreseeable harm through rigorous affordability
    checks.'
