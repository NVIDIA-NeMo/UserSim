  institution_id: wrenfield_bank
- id: dba4e401-d211-53e4-b15f-783e96a8c981
  title: Wrenfield Two-Year Fixed Mortgage — limits, restrictions, and edge cases
  body: 'This document provides support agents with the critical constraints and limits
    associated with the Wrenfield Two-Year Fixed Mortgage to ensure accurate customer
    guidance.


    **Lending Limits and LTV**

    The maximum Loan to Value (LTV) for this product is 90%. Any application where
    the loan amount exceeds 90% of the appraised property value must be declined or
    the customer advised to increase their deposit.


    **Financial Obligations and Fees**

    A product fee of £999 applies to this mortgage. This is a one-time cost to cover
    operational and regulatory risk.


    **Repayment and Overpayment Constraints**

    Customers are permitted a yearly overpayment allowance of 10% of the outstanding
    balance. Overpayments exceeding this 10% threshold may trigger early repayment
    charges.


    **Early Repayment Charges (ERCs)**

    If a customer chooses to redeem the mortgage or switch products before the end
    of the fixed term, the following charges apply:

    - Year One: An early repayment charge of 3%.

    - Year Two: An early repayment charge of 2%.


    **Post-Fixed Term Transition**

    Once the two-year fixed period ends, the account automatically transitions to
    our Standard Variable Rate of 7.49% unless the customer successfully switches
    to a new product.


    **Compliance Note**

    All lending recommendations are subject to a strict affordability assessment.
    We must ensure a high standard of care to avoid foreseeable harm to the customer,
    in line with our commitment to the Consumer Duty.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4a40643c-7ebb-5fb0-828b-80e1bedbec8c
  title: Wrenfield Two-Year Fixed Mortgage — standard variable rate after the deal
    ends explained
  body: '**What happens to my mortgage payments after the two-year fixed term ends?**


    When your fixed-rate period concludes, your mortgage does not end; instead, it
    automatically moves to our Standard Variable Rate (SVR). For the Wrenfield Two-Year
    Fixed Mortgage, the current SVR is 7.49%.


    **Will my monthly payments change?**


    Yes. Because the SVR is typically higher than the initial fixed rate of 5.64%,
    you will likely see an increase in your monthly repayments once the transition
    occurs. Additionally, as a variable rate, the 7.49% can fluctuate based on market
    conditions and bank policy.


    **Do I have to stay on the Standard Variable Rate?**


    No, you do not. We encourage customers to review their options before the fixed
    term expires. You can ask us about switching to a new fixed-rate deal or another
    product that suits your current financial situation to avoid the higher costs
    associated with the SVR. We recommend starting this conversation a few months
    before your deal ends.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
