  body: 'To ensure fair treatment and regulatory compliance, we apply the following
    eligibility criteria for the Wrenfield Easy Access Cash ISA:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a legal UK resident | Eligible |

    | Age | Must be 18 years of age or older | Eligible |

    | Identity | Must pass full identity authentication | Eligible |

    | Annual Contribution | Total deposits must not exceed £20,000 per tax year |
    Eligible |

    | Annual Contribution | Total deposits exceed £20,000 per tax year | Ineligible
    |

    | Residency | Non-UK resident | Ineligible |


    Customers who meet all ''Eligible'' criteria can open the account and begin earning
