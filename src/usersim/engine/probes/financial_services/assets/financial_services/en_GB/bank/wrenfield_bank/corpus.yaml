- id: f410bf59-3661-5098-be9e-64018e8205cd
  title: Wrenfield Personal Loan — vs. a similar product here
  body: 'When deciding how to borrow, customers often compare the Wrenfield Personal
    Loan against the Wrenfield Rewards Credit Card. The right choice depends on the
    amount needed and the intended repayment timeline.


    Wrenfield Personal Loan:

    - Best for: Large, one-off expenses or long-term projects.

    - Cost: Representative APR of 6.9%.

    - Limits: Up to £35,000.

    - Structure: Fixed monthly repayments over a set term (e.g., 60 months), providing
    stability and a clear end date.


    Wrenfield Rewards Credit Card:

    - Best for: Smaller, everyday purchases and short-term flexibility.

    - Cost: Representative APR of 24.9%.

    - Structure: Revolving credit with the ability to pay only a minimum amount each
    month.

    - Added Value: Includes Section 75 protection for purchases between £100 and £30,000.


    Summary: The Personal Loan is the superior choice for stability and lower long-term
    cost for larger sums. The Credit Card is better for those needing a flexible,
    reusable credit line for smaller amounts, despite the higher cost of borrowing.
    For more on the card, see Wrenfield Rewards Credit Card — overview.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 0046e96f-0001-56b2-a11b-0059e53975d5
  title: Wrenfield Personal Loan — regulatory disclosures
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We are committed to ensuring all customers are treated fairly and that
    our lending practices adhere to the Consumer Duty.


    Regulatory Requirements for Lending:

    Every application for a Wrenfield Personal Loan is subject to a strict affordability
    assessment. We do this to ensure that our customers can comfortably meet their
    repayments without suffering foreseeable financial harm. We will not approve a
    loan that we believe is unsustainable for the borrower.


    Representative Example Disclosures:

    In accordance with regulatory standards, we provide a representative example to
    illustrate the costs of our loans. For a loan of £10,000 over a duration of 60
    months, with a representative APR of 6.9%, the monthly repayment is £196.56, resulting
    in a total amount payable of £11,793.60. Please note that the actual rate you
    are offered depends on your credit profile and may differ from this representative
    figure.


    Limits and Protections:

    - The maximum loan amount available is £35,000.

    - Customers are granted a statutory 14-day right to withdraw from the loan agreement
    after funds have been disbursed.

    - While loans themselves are not deposits, any funds held in a Wrenfield account
    are protected by the FSCS up to £120,000 per person, with temporary high balances
    protected up to £1.4 million.


    All lending recommendations are based on general financial education and product
    information; we do not offer individualised tax or legal advice. Our structured
    escalation path ensures that any unresolved disputes are handled by senior management
    and, if necessary, the Financial Ombudsman Service.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 1f711e75-efbb-51a1-bc74-cc6c0483b14d
  title: Wrenfield Personal Loan — interest rate / AER schedule
  body: 'The Wrenfield Personal Loan features a transparent interest structure to
    ensure you know exactly what your borrowing will cost.


    Representative APR: 6.9%


    This representative APR is a flat rate that we are able to offer to at least 51%
    of successful applicants. Because we tailor our lending to the individual''s risk
    profile, the actual rate applied to your loan may vary based on your credit score
    and the total amount borrowed.


    How the Rate is Applied:

    - The interest is calculated on the reducing balance of the loan.

    - Once your loan agreement is signed, the rate is fixed for the entire duration
    of the term (e.g., 60 months), meaning your monthly repayments will remain constant.


    Factors that influence the final rate:

    - Credit History: A strong history of timely repayments increases the likelihood
    of receiving the representative rate of 6.9%.

    - Loan Amount: The total amount borrowed, up to the maximum of £35,000, is considered
    during the underwriting process.

    - Affordability: Your debt-to-income ratio is reviewed to ensure the loan remains
    sustainable.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 45044fc6-5723-5a4c-81af-096e5a239c65
  title: Wrenfield Personal Loan — current offer
  body: 'We are pleased to offer an enhanced application window for our existing customers
    who are looking to consolidate debt or fund a new project. From 1 November 2024
    to 31 December 2024, existing Wrenfield Bank customers can apply for a Personal
    Loan with a streamlined affordability review.


    Our current offer features a representative APR of 6.9%.


    To illustrate the value, consider a loan of £10,000 taken over a term of 60 months.
    With this representative rate, your monthly repayments would be £196.56, and the
    total amount payable over the life of the loan would be £11,793.60.


    Whether you are planning home improvements or reorganising your finances, you
    can borrow up to our maximum loan amount of £35,000. As always, we maintain a
    high standard of care, and all offers are subject to our strict affordability
    assessment. You also retain your 14-day right to withdraw from the agreement should
    your circumstances change.'
  domain: lending_mortgage
  product_category: personal_loan
