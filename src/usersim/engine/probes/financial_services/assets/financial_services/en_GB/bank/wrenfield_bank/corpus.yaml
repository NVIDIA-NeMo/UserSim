- id: 2e3b0e72-5876-5720-bcfb-6ef350c9bb0e
  title: Wrenfield Regular Saver — risk disclosures
  body: 'This document provides important regulatory and risk disclosures regarding
    the Wrenfield Regular Saver. Please read these carefully when comparing our products
    against alternatives.


    Liquidity and Access Risk

    The Wrenfield Regular Saver is designed as a goal-based savings tool with a term
    of 12 months. While you can request to close your account at any time, this product
    is not intended for funds that may be required on short notice. Withdrawing funds
    before the end of the 12-month term may result in a reduction of the interest
    earned.


    Interest Rate Risk

    The current interest rate is 6%. Please be aware that interest rates are subject
    to change in accordance with our general terms and conditions. Any change in rate
    will be communicated to you in line with our commitment to transparency.


    Deposit Protection

    Wrenfield Bank operates under the strict authorisation of the PRA and regulation
    by the FCA. Your deposits are protected by the Financial Services Compensation
    Scheme (FSCS). Eligible deposits are protected up to £120,000 per person. In the
    event of a temporary high balance, protection is available up to £1.4 million.


    Affordability and Care

    While the Wrenfield Regular Saver is a deposit product, we encourage all customers
    to ensure their saving plan is sustainable. We provide general financial education,
    but we do not offer individualised tax or legal advice. We recommend consulting
    a qualified professional for specific tax implications regarding your savings
    interest.


    For further information on how we handle your data and the regulatory environment
    we operate in, please refer to Wrenfield Regular Saver — privacy and data handling.'
  domain: retail_banking
  product_category: regular_saver
  document_type: disclosure
  source_authority: official
