- id: 5efebdc7-bbff-5c2c-b359-edd9a6a4ef25
  title: Wrenfield Regular Saver — maximum monthly payment in explained
  body: 'Q: What is the maximum amount I can deposit into my Wrenfield Regular Saver
    each month?


    A: The maximum monthly deposit allowed for this account is £300. This limit applies
    to the total of all deposits made within a single calendar month.


    Q: What happens if I accidentally try to deposit more than £300 in one month?


    A: If a deposit causes you to exceed the £300 monthly limit, the transaction may
    be declined, or the excess amount may be returned to your source account. We recommend
    monitoring your monthly totals to ensure your savings plan remains on track.


    Q: Does the £300 limit include the interest I earn?


    A: No, the £300 limit applies only to the funds you actively deposit into the
    account. Interest earned at the rate of 6% does not count towards this monthly
    limit.


    For more details on the account duration, see Wrenfield Regular Saver — term (months)
    explained.'
