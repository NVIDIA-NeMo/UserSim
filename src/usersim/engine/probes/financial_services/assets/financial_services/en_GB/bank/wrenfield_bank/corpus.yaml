- id: 62d68b09-6594-58ae-9085-04826a2c2adb
  title: Wrenfield Current Account — a failed or pending action
  body: 'It can be frustrating when the process of opening an account or switching
    your banking does not proceed as expected. Below are the most common symptoms
    and how we resolve them.


    Symptom: "My account application is showing as ''pending'' for several days."

    Likely Cause: This usually occurs if the identity verification process is incomplete
    or if the documents provided were not clear enough to satisfy our ''verify-first''
    security requirements.

    What to check:

    1. Confirm that the address on your proof-of-address document matches the address
    provided in your application.

    2. Ensure that your photo ID is current and has not expired.

    Fix: Tell us that your application is pending. We will review the submitted documents
    and, if necessary, request a clearer copy or an alternative form of identification.
    Once verified, we will move your application to the final approval stage.


    Symptom: "My switch from another bank has stalled, and I haven''t received my
    £175 incentive."

    Likely Cause: The switch may be pending because the previous institution has not
    yet transferred the remaining balance, or there is a mismatch in the account details
    provided.

    What to check:

    1. Check if your old account is still open and contains a balance.

    2. Verify that the sort code and account number provided for the switch were correct.

    Fix: Tell us that your switch is pending. We will investigate the status of the
    transfer with the other institution. Once the switch is fully completed and all
    terms are met, we will credit the £175 switching incentive to your account.


    When to Escalate:

    If a pending action is not resolved within 15 business days for payment-related
    issues, or if you feel the delay is unreasonable, we will escalate the matter
    to senior management for a priority review. If we cannot reach a resolution, you
    have the right to refer the matter to the Financial Ombudsman Service.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b0a98c8e-3b55-5223-9883-f527daca34e0
  title: Wrenfield Current Account — eligibility requirements
  body: 'The following matrix outlines the requirements for maintaining or opening
    a Wrenfield Current Account. We apply these standards consistently to ensure regulatory
    compliance and the security of our customers'' assets.


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a legal resident of the United Kingdom | Eligible |

    | Age | Must be 18 years of age or older | Eligible |

    | Identity | Successful completion of ''verify-first'' authentication | Eligible
    |

    | Identity | Unable to provide valid government photo ID | Ineligible |

    | Financial Status | Successful affordability assessment (for overdrafts) | Approved
    for overdraft limit |

    | Financial Status | Unsuccessful affordability assessment | Account approved;
    Overdraft denied |

    | Switching | Full transfer of primary banking from another UK bank | Eligible
    for £175 incentive |

    | Switching | Partial transfer or internal account move | Ineligible for £175
    incentive |


    If you have questions regarding a specific requirement, please refer to the Wrenfield
    Current Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
