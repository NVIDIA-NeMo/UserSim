- id: 8952ce25-016a-52f9-902c-9dffa76619c7
  title: Wrenfield Personal Loan — a failed or pending action
  body: 'If you have applied for a Wrenfield Personal Loan and your application is
    showing as ''pending'' or has ''failed'', please review the following guide to
    identify the cause and find a resolution.


    Symptom: Application status is ''Pending'' for longer than three business days.


    Likely Causes:

    - Verification Delay: We may be unable to verify your identity documents immediately.

    - Manual Review: Some applications require a senior underwriter''s review to ensure
    the affordability assessment meets our high standard of care.


    What to check:

    - Confirm that all provided identity documents are clear and valid.

    - Check if we have requested additional proof of income via your secure notifications.


    Fix:

    - If we have requested further documentation, provide the updated files. We will
    then update your status within two business days.


    Symptom: Application status is ''Failed'' or ''Declined''.


    Likely Causes:

    - Affordability Criteria: The requested amount (up to £35,000) may exceed the
    sustainable borrowing limit based on your current income and expenditure.

    - Credit Profile: Your credit history may not meet the requirements for the representative
    APR of 6.9% or other available rates.


    Fix:

    - Review the loan amount you requested. You may wish to apply for a lower sum
    that better aligns with your monthly budget.

    - Ensure all financial details provided during the application were accurate.


    Escalation:


    If you believe a mistake has been made in the assessment, please tell us. We will
    raise a case for a formal review by our senior management team. If the issue remains
    unresolved after this review, you may take your complaint to the Financial Ombudsman
    Service.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b2753bf6-f00f-5e95-aad3-ea4c6d41b588
  title: Wrenfield Personal Loan — eligibility requirements
  body: 'To ensure the security of our assets and the fair treatment of our customers,
    all applicants for a Wrenfield Personal Loan must meet the following criteria:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a permanent UK resident | Mandatory for application |

    | Age | Must be 18 years of age or older | Mandatory for application |

    | Identity | Full identity authentication completed | Required for fund disbursement
    |

    | Affordability | Pass strict affordability assessment | Required for loan approval
    |

    | Loan Amount | Request between £1,000 and £35,000 | Must fall within this range
    |

    | Credit Profile | Sufficient credit history as per internal risk policy | Determines
    final APR offered |


    Failure to meet any of the mandatory conditions will result in an application
    decline. For existing customers, we recommend ensuring your contact and income
    details are up to date to expedite the affordability assessment process.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: eligibility_matrix
