  institution_id: wrenfield_bank
- id: 04d7dee4-faa5-56ff-b6f5-0a4d7921849d
  title: Wrenfield Two-Year Fixed Mortgage — maximum loan to value explained
  body: 'Q: What is the ''maximum loan to value'' for the Wrenfield Two-Year Fixed
    Mortgage?


    A: Loan to Value (LTV) is the ratio of the mortgage loan amount to the appraised
    value of the property. For this specific product, the maximum LTV is 90%. This
    means that we can lend up to 90% of the property''s value, and the borrower must
    provide a deposit of at least 10%.


    Q: Does the LTV affect my eligibility?


    A: Yes. If the appraised value of the property is lower than expected, your LTV
    may increase. If it exceeds 90%, you will not meet the requirements for this specific
    product and may need to provide a larger deposit or explore alternative lending
    options.


    Q: What happens if my property value drops after I have taken out the mortgage?


    A: While the 90% limit is a requirement for the initial granting of the loan,
    a drop in property value does not typically trigger a demand for immediate repayment,
    provided you continue to meet your monthly payment obligations. However, it may
    affect your options when you wish to remortgage or switch products.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: faq
  source_authority: official
