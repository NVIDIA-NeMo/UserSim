  mentions_tools: []
  institution_id: wrenfield_bank
- id: 920f7442-e92d-5e2e-aebf-9d2d885498c6
  title: Wrenfield Easy Access Cash ISA — overview
  body: 'The Wrenfield Easy Access Cash ISA is a tax-efficient savings tool designed
    for customers who want their money to grow without the worry of paying tax on
    their interest. This account provides a dependable way to build your savings while
    maintaining the flexibility to access your funds whenever you need them.


    We provide a competitive annual interest rate of 2.85% on all balances within
    the account. Because this is an Individual Savings Account (ISA), the interest
    you earn is exempt from UK income tax, making it a more effective way to save
    than a standard savings account.


    To ensure you make the most of your tax-free allowances, please be aware of the
    current contribution limits. At present, the annual ISA allowance is £20,000.
    This is the maximum amount you can deposit into your ISA across all providers
    within a single tax year. It is important to plan for future changes to these
    regulations; for instance, the cash ISA allowance is scheduled to change to £12,000
    from April 2027.


    This product is built for stability and transparency. We do not charge a monthly
    account fee, ensuring that your savings remain focused on growth. All deposits
    are held securely under our strict regulatory framework, providing peace of mind
    as you work towards your financial goals.


    For those who already hold a Wrenfield Current Account, this ISA can be easily
    managed alongside your daily banking. If you are looking for a way to store money
    that remains accessible while benefiting from tax-free interest, the Wrenfield
    Easy Access Cash ISA is an ideal choice.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
