- id: d863791d-e3ee-56c5-a69a-cf12a9096892
  title: Wrenfield Rewards Credit Card — set up and activate
  body: 'Setting up your Wrenfield Rewards Credit Card is a straightforward process.
    We maintain a rigorous ''verify-first'' stance to ensure your assets are secure
    from the moment you join us.


    Before you begin, please ensure you have your government-issued photo identification
    and a recent proof of address ready.


    1. Identity Authentication: Provide us with your full identity details. We will
    verify your documentation to ensure all security standards are met before any
    account state changes occur.

    2. Card Receipt: Once your application is approved and identity verified, we will
    send your physical card to your registered home address via secure post.

    3. Activation Request: Tell us that you have received your card and wish to activate
    it. We will perform a final security check to confirm your identity.

    4. PIN Selection: You will be asked to select a secure Personal Identification
    Number (PIN) for your card. We will confirm once this has been successfully updated
    in our systems.

    5. Confirmation: We will provide you with a confirmation that your card is active
    and ready for use, including a summary of your assumed credit limit of £1,200
    (subject to final credit approval).


    Once activated, you can begin using your card immediately. If you are managing
    this process alongside another account, you might find the Wrenfield Current Account
    — set up and activate guide useful for coordinating your banking hub.'
  domain: cards
  product_category: credit_card
  document_type: how_to_guide
