- id: d9d12809-a109-54ab-a2f9-7b0379d06cdc
  title: Wrenfield Rewards Credit Card — assumed credit limit in the representative
    example explained
  body: "Q: What does the 'assumed credit limit' of £1,200 mean in the product examples?\n\
    \nA: When we quote a representative APR of 24.9%, we use a standard example to\
    \ show how the cost of borrowing is calculated. The assumed credit limit of £1,200\
    \ is a benchmark figure used to ensure that our examples are consistent and comparable\
    \ across the industry. \n\nIt is important to note that £1,200 is not a guaranteed\
    \ limit. Your actual credit limit will be determined by our underwriting team\
    \ based on a strict affordability assessment. This ensures that the credit we\
    \ provide is sustainable for your specific financial circumstances, helping us\
    \ meet our commitment to the Consumer Duty and avoid causing you foreseeable harm.\
    \ Your final limit may be higher or lower than the assumed £1,200 used in our\
    \ marketing materials."
