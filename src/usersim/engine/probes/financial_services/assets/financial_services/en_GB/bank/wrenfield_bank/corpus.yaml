  institution_id: wrenfield_bank
- id: 2387f07e-688c-54cc-a07c-c98c9a99f606
  title: Wrenfield Rewards Credit Card — an unexpected charge or amount
  body: "Symptom: A customer reports a transaction on their Wrenfield Rewards Credit\
    \ Card that is higher than the purchase price, or a fee they did not expect to\
    \ see.\n\nLikely Causes:\n- Foreign Transaction Fee: If the purchase was made\
    \ in a non-sterling currency, a 2.99% foreign transaction fee has been applied\
    \ to the total.\n- Balance Transfer Fee: If the customer recently moved a balance\
    \ from another provider, a fee of 3.49% of the transferred amount has been charged.\n\
    - Interest Accrual: If the full balance was not paid by the due date, interest\
    \ has been applied based on the representative APR of 24.9%.\n\nSteps to Resolve:\n\
    1. Verify the Transaction: Review the transaction date and the currency of the\
    \ purchase. If it is a foreign transaction, confirm the 2.99% fee is present.\n\
    2. Check Transfer History: If the charge is a one-time fee following a balance\
    \ move, confirm that the 3.49% balance transfer fee matches the amount transferred.\n\
    3. Review Payment History: Check if the customer missed a payment window, triggering\
    \ interest charges at the 24.9% rate.\n\nResolution:\nIf the charge is a legitimate\
    \ fee as per the account agreement, explain the specific fee to the customer.\
    \ If the charge is an error or suspected fraud, we will initiate a dispute. \n\
    \nEscalation:\nIf the customer disagrees with the fee and a resolution cannot\
    \ be reached, we will raise the matter to senior management. We provide final\
    \ responses for payment service complaints within 15 business days. If the customer\
    \ remains dissatisfied, we will guide them towards the Financial Ombudsman Service."
  domain: cards
  product_category: credit_card
  document_type: troubleshooting
  source_authority: official
