- id: cc1ece6a-5793-5bfc-b2b0-67dc42fe4116
  title: Wrenfield Rewards Credit Card — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our highest priority. We
    maintain a rigorous ''verify-first'' stance, meaning we will always perform full
    identity authentication before any state-changing action is taken on your Wrenfield
    Rewards Credit Card account.


    **Common Fraud Patterns**

    Customers should be aware of ''social engineering'' scams where fraudsters pose
    as Wrenfield Bank employees. They may claim there is an urgent issue with your
    credit limit or a suspicious transaction and request your full card number, CVV,
    or online banking password to ''secure'' the account. Please remember: we will
    never ask you for your full password or PIN over the telephone.


    **Our Security Commitments**

    We will never ask you to move your balance to a ''safe account'' or request that
    you share a one-time passcode (OTP) to cancel a transaction. Any request to do
    so is a sign of fraudulent activity.


    **Immediate Actions**

    If you notice any unauthorised transactions or if you have accidentally shared
    your security details, you must inform us immediately. Prompt reporting is essential
    for the rapid resolution of disputes. We aim to provide final responses for payment
    service complaints within 15 business days. While we proactively support victims
    of APP scams, the speed of your report significantly impacts our ability to recover
    funds.


    **Best Practices**

    - Review your statements regularly for any unfamiliar charges, including the 2.99%
    foreign transaction fee on non-sterling spends.

    - Use strong, unique passwords for your digital access.

    - Be cautious of emails or texts containing links that ask you to ''verify'' your
    account details; we will always guide you through secure, authenticated channels
    during standard UK business hours.'
  domain: cards
  product_category: credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 47bee2cb-c211-50df-972d-339d310929a9
  title: Wrenfield Rewards Credit Card — change-of-terms policy
  body: "This document outlines the policy regarding changes to the terms and conditions\
    \ governing the Wrenfield Rewards Credit Card. Our agreement is based on the principle\
    \ of transparency and stability, ensuring you are never surprised by changes to\
    \ your credit facility.\n\n**Rate and Fee Adjustments**\nWe reserve the right\
    \ to amend the representative APR of 24.9% or the fees associated with the account,\
    \ such as the 3.49% balance transfer fee or the 2.99% foreign transaction fee.\
    \ Any such changes will be driven by operational costs or regulatory risk requirements.\
    \ \n\n**Notice Periods**\nWe will provide you with written notice of any significant\
    \ changes to your terms at least eight weeks before the change takes effect. This\
    \ notice will clearly state the current value, the new value, and the date of\
    \ the change. For example, if the balance transfer period of 24 months were to\
    \ be adjusted for new transfers, this would be communicated within the same timeframe.\n\
    \n**Customer Rights**\nIf you do not agree to the new terms, you have the right\
    \ to close your account without penalty, provided all outstanding balances—including\
    \ interest accrued at the representative APR of 24.9%—are paid in full. \n\n**Affordability\
    \ and Limits**\nAny request to increase your credit limit beyond the assumed £1,200\
    \ representative figure is subject to a strict affordability assessment. This\
    \ ensures a high standard of care and prevents foreseeable harm by ensuring the\
    \ borrowing remains sustainable for your specific financial circumstances.\n\n\
    **Termination**\nEither party may terminate this agreement. Upon termination,\
    \ all remaining funds must be settled. We will provide a final statement detailing\
    \ any remaining balance and applicable fees to ensure a clear and fair closure\
    \ of the facility."
  domain: cards
  product_category: credit_card
  document_type: terms_conditions
