- id: 9b15c062-bce0-5c2a-9916-6327bde5c62b
  title: Wrenfield Current Account — cancel, close, or downgrade
  body: 'If you decide that the Wrenfield Current Account no longer meets your needs,
    we provide a clear process for closing or downgrading your account. Please follow
    these steps to ensure a smooth transition.


    What you need before starting:

    - A record of all active Direct Debits and Standing Orders linked to the account.

    - The details of another valid UK bank account where your remaining balance can
    be transferred.

    - Confirmation that any outstanding overdraft balance has been paid.


    Steps to close your account:

    1. Clear your balance: Ensure your account is not overdrawn. If you have an arranged
    overdraft, pay the balance in full, including any interest accrued at the 39.9%
    rate.

    2. Redirect your payments: Notify your employer and any benefit providers of your
    new account details. Move your active Direct Debits and Standing Orders to your
    new provider.

    3. Request closure: Inform us that you wish to close your Wrenfield Current Account.
    We will verify your identity using our ''verify-first'' security protocol.

    4. Final balance transfer: Tell us the account details where you would like your
    remaining funds sent. We will transfer the closing balance to you.

    5. Receive confirmation: We will provide you with a final statement and a confirmation
    message once the account is officially closed.


    If you prefer to keep a relationship with Wrenfield Bank but no longer require
    the full features of this account, you may ask us to downgrade your account to
    a basic holding account. We will confirm the new terms and any changes to your
    facility limits during the conversation.


    For more information on the initial setup of our accounts, please refer to Wrenfield
    Current Account — set up and activate.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: de87a437-f536-557a-b507-e184c121db3e
  title: Wrenfield Current Account — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who have identified
    a charge or a balance discrepancy on their Wrenfield Current Account that they
    did not expect.


    Symptom

    The customer reports an unknown withdrawal, a fee they believe is incorrect, or
    a balance lower than expected.


    Likely Causes

    - Overdraft Interest: The customer may have dipped into an arranged overdraft,
    triggering interest charges at the variable rate of 39.9%.

    - Processing Errors: A technical error in a payment or a duplicate transaction.

    - Unauthorised Activity: Potential fraud or a scam payment.

    - Direct Debit Error: An incorrect amount collected via Direct Debit.


    What to Check (in order):

    1. Review Recent History: Check the transaction log for any entries matching the
    amount and date. Look specifically for entries labelled as ''Overdraft Interest''.

    2. Verify Overdraft Status: Check if the account balance went below £0. If so,
    confirm that the charge aligns with the 39.9% arranged overdraft rate.

    3. Check Direct Debit Status: If the charge is a Direct Debit, check if it aligns
    with the customer''s known mandates.


    How to Fix

    - If it is a Direct Debit error, we honour the Direct Debit Guarantee and can
    provide an immediate refund of the erroneous amount.

    - If it is a legitimate overdraft charge, explain the 39.9% rate to the customer.

    - If the transaction is unauthorised, immediately initiate the ''verify-first''
    protocol to secure the account and report the activity as potential fraud.


    When to Escalate

    If the cause cannot be determined or the customer disputes the findings, raise
    a formal case. We provide final responses for payment service complaints within
    15 business days and other disputes within eight weeks. If unresolved, the customer
    may be referred to the Financial Ombudsman Service.


    For guidance on failed transactions, see Wrenfield Current Account — a failed
    or pending action.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: dd120f03-35e4-5a5d-8d9c-627366b4e50c
  title: Wrenfield Current Account — required documentation
  body: 'To open a Wrenfield Current Account, we must adhere to strict regulatory
    requirements to verify your identity. The following documentation is required
    to achieve a ''verified'' status and proceed with account opening:


    | Documentation Provided | Outcome |

    | :--- | :--- |

    | Valid Government-issued Photo ID (e.g., Passport) AND Valid Proof of Address
    (e.g., Utility Bill < 3 months old) | Account Opening Approved |

    | Valid Government-issued Photo ID ONLY | Further Verification Required (Address
    Proof Needed) |

    | Valid Proof of Address ONLY | Further Verification Required (Photo ID Needed)
    |

    | No Valid ID or Address Proof | Application Declined |


    All documents must be original or certified copies. We maintain a ''verify-first''
    stance to ensure the security of all our customers'' assets. For general requirements,
    see Wrenfield Current Account — eligibility requirements.'
