- id: 8b21b068-0fdd-5786-ab9f-a907d9f2bc2c
  title: Wrenfield Current Account — fee schedule
  body: 'This fee schedule provides a transparent breakdown of the costs associated
    with the Wrenfield Current Account. We aim to cover operational costs and regulatory
    risk without imposing unfair burdens on our customers.


    Account Maintenance

    - Monthly account fee: £0


    Credit and Borrowing

    - Arranged overdraft rate: 39.9% (Annual Percentage Rate)


    Incentives

    - Switching incentive: £175 (payable upon successful completion of the switch
    process and meeting all terms and conditions)


    All fees are reviewed periodically to ensure they remain fair and transparent
    in line with our commitment to the Consumer Duty. If any fees are subject to change,
    we will provide notice in accordance with our standard communication policy.'
  domain: retail_banking
