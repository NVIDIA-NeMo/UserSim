- id: 5d942908-f8e5-508c-88df-18f4e46858ac
  title: Wrenfield Regular Saver — an unexpected charge or amount
  body: 'When a customer reports an unexpected charge or a discrepancy in the balance
    of their Wrenfield Regular Saver, support agents should follow this diagnostic
    path.


    Symptom: ''I have been charged a fee'' or ''My balance is lower than expected''.


    Likely Causes:

    - Excess Deposit Reversal: If the customer attempted to deposit more than the
    maximum monthly deposit of £300, the excess may have been reversed, which can
    look like a deduction in the transaction history.

    - Early Closure Adjustment: If the account was closed before the 12-month term
    ended, the final interest payout may differ from the projected 6% yield.

    - Incorrect Transfer: A transfer from another account may not have completed successfully.


    What to check in order:

    1. Transaction History: Review the recent history for any entries exceeding £300
    in a single month. Check if a corresponding ''Return'' or ''Reversal'' entry exists.

    2. Term Status: Verify if the account has reached its 12-month maturity. If closed
    early, check the specific date of closure.

    3. Interest Calculations: Confirm that the 6% interest is being applied correctly
    based on the daily balance.


    How to fix:

    - If a deposit was incorrectly rejected, advise the customer to ensure future
    monthly deposits remain at or below £300.

    - If there is a genuine calculation error, raise a case with the savings specialist
    team to perform a manual audit of the interest accrued.


    When to escalate:

    If the customer disputes the final balance after these checks, or if there is
    a suspected unauthorised transaction, escalate the issue to senior management.
    We aim to provide a final response for payment service complaints within 15 business
    days and other disputes within eight weeks.'
  domain: retail_banking
  product_category: regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
