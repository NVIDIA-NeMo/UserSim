- id: b3c1ab73-0f12-5fcd-8497-8934454a81f6
  title: Wrenfield Rewards Credit Card — account agreement
  body: 'This agreement sets out the binding terms between Wrenfield Bank (''we'',
    ''us'') and the cardholder. Use of the Wrenfield Rewards Credit Card constitutes
    acceptance of these terms.


    1. Credit Terms and Costs

    We provide credit subject to a representative APR of 24.9%. This rate is used
    to illustrate the cost of borrowing; your actual rate may vary based on your creditworthiness.
    The assumed credit limit for the representative example is £1,200, though your
    specific limit will be determined following our strict affordability assessment
    to ensure a high standard of care.


    2. Fees and Charges

    - Balance Transfers: We charge a balance transfer fee of 3.49% on the amount transferred
    from another provider. These transfers are subject to a promotional period of
    24 months.

    - Foreign Transactions: A foreign transaction fee of 2.99% applies to all transactions
    made in a currency other than GBP.


    3. Cardholder Obligations

    Users must maintain their account in good standing. We require full identity authentication
    before any account disclosures are made, in line with our security protocols.
    You are obligated to notify us immediately of any lost or stolen cards or suspected
    fraudulent activity.


    4. Changes to Terms

    We may amend the fees or interest rates associated with this account. We will
    provide you with clear, prominent notice of any such changes before they take
    effect, ensuring transparency and stability in our pricing.


    5. Termination

    Either party may terminate this agreement. Upon closure, the cardholder must settle
    all outstanding balances, including any accrued interest and applicable fees.
    If the account is closed during a balance transfer window, the remaining balance
    will be subject to the standard representative APR of 24.9% unless otherwise agreed.


    All disputes under this agreement are handled via our structured escalation path.
    If a dispute remains unresolved after our final response—typically within eight
    weeks for general disputes—you have the right to refer the matter to the Financial
    Ombudsman Service.'
  domain: cards
  product_category: credit_card
  document_type: terms_conditions
  source_authority: official
