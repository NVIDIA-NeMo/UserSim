- id: 910bd44d-dd07-5939-bbf4-c327ea324720
  title: Wrenfield Easy Access Cash ISA — choosing between tiers or options
  body: 'When deciding where to place your savings, it is important to understand
    the trade-offs between a tax-efficient ISA and a standard savings account. Here
    we compare the Wrenfield Easy Access Cash ISA with our Wrenfield Everyday Saver.


    Tax Efficiency: The Wrenfield Easy Access Cash ISA is a tax-efficient tool, meaning
    the interest you earn on your balance is exempt from UK income tax. The Wrenfield
    Everyday Saver is a taxable account, meaning any interest earned above your personal
    allowance may be subject to tax.


    Returns: The Wrenfield Easy Access Cash ISA offers a stable annual interest rate
    of 2.85%. While the Everyday Saver provides flexibility, the ISA is generally
    the superior choice for those looking to protect their growth from the taxman.


    Limits: The Cash ISA has a strict annual contribution limit of £20,000. The Everyday
    Saver has no such upper limit on deposits, making it better for those who wish
    to save more than the statutory ISA allowance in a single year.


    Who each suits:

    - The Wrenfield Easy Access Cash ISA is best for customers who want a tax-free
    environment for their savings and intend to stay within the £20,000 annual limit.

    - The Wrenfield Everyday Saver is better for those who need an unrestricted account
    for amounts exceeding the ISA limit or for those who have already exhausted their
    annual allowance.'
  domain: retail_banking
  product_category: cash_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7ffdc27c-f027-5f67-b2ce-e10b954df3f8
  title: Wrenfield Easy Access Cash ISA — privacy and data handling
  body: 'Wrenfield Bank is committed to the highest standards of data privacy and
    regulatory compliance. We operate under the strict authorisation of the Prudential
    Regulation Authority (PRA) and are regulated by the Financial Conduct Authority
    (FCA), ensuring that all customers are treated fairly and their data is handled
    with integrity.


    Data Collection: We collect and process your personal information specifically
    to manage your Wrenfield Easy Access Cash ISA, verify your identity under our
    ''verify-first'' security stance, and ensure you do not exceed the annual ISA
    allowance of £20,000. We do not sell your data to third parties for marketing
    purposes.


    Regulatory Reporting: As a regulated institution, we are required to report certain
    information to HM Revenue & Customs (HMRC) to confirm your ISA eligibility and
    your adherence to the £20,000 contribution limit. This ensures the tax-free status
    of your 2.85% interest earnings is maintained lawfully.


    Data Protection: Your data is stored using industry-standard encryption and is
    accessible only to authorised personnel required to service your account. We adhere
    strictly to the Consumer Duty, ensuring that our data handling processes do not
    cause foreseeable harm to our customers.


    Asset Protection: We remind customers that eligible deposits are protected by
    the Financial Services Compensation Scheme (FSCS) up to £120,000 per person, with
    temporary high balances protected up to £1.4 million. This protection is separate
    from our data privacy obligations but forms part of our commitment to your overall
    financial stability.'
  domain: retail_banking
  product_category: cash_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 597dfb94-7d82-549d-89b9-e0f8f3554f34
  title: Wrenfield Easy Access Cash ISA — recognising scams targeting this product
  body: "At Wrenfield Bank, we are committed to protecting your assets. Because the\
    \ Wrenfield Easy Access Cash ISA is a tax-efficient savings tool, it can occasionally\
    \ be targeted by fraudsters using sophisticated tactics to gain access to your\
    \ funds.\n\nOne common scam involves 'clone' firms. Fraudsters may contact you\
    \ pretending to be from Wrenfield Bank or a regulatory body, claiming that your\
    \ ISA allowance of £20,000 has been exceeded or that your account is 'at risk'\
    \ due to a technical error. They may pressure you to move your money into a 'safe'\
    \ account to avoid penalties. Please remember: we will never pressure you to move\
    \ your funds urgently or ask you to transfer money to a different institution\
    \ to 'protect' it.\n\nAnother pattern involves fake ISA transfer requests. You\
    \ might receive an email or text message that looks like an official notification,\
    \ asking you to click a link to 'verify' your identity before a transfer can be\
    \ completed. This is a phishing attempt to steal your login credentials. We will\
    \ never ask you to provide your full password, PIN, or security codes via a link\
    \ in a text or email.\n\nIf you encounter any communication that feels suspicious,\
    \ your first action should be to stop the conversation immediately and notify\
    \ us through your established banking channels. We maintain a rigorous 'verify-first'\
    \ stance to ensure the security of your assets. \n\nFor your peace of mind, we\
    \ operate under the strict authorisation of the PRA and regulation by the FCA.\
    \ Eligible deposits in your Wrenfield Easy Access Cash ISA are protected by the\
    \ FSCS up to £120,000 per person, with temporary high balances protected up to\
    \ £1.4 million. This ensures that your hard-earned savings remain secure under\
    \ the highest regulatory standards.\n\nTo learn more about our general security\
    \ practices, you may wish to review Wrenfield Easy Access Cash ISA — fraud and\
    \ unauthorised-activity protection."
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 337639bd-307c-5e1a-b991-89cb199489ce
  title: Wrenfield Easy Access Cash ISA — limits, restrictions, and edge cases
  body: 'This document provides detailed guidance for support agents regarding the
    operational limits and regulatory restrictions associated with the Wrenfield Easy
    Access Cash ISA.


    **Annual Deposit Limits**

    The primary restriction on this product is the annual ISA allowance. Currently,
    customers can deposit up to £20,000 within a single tax year. Any attempt to deposit
    funds exceeding this £20,000 threshold must be declined to prevent the customer
    from inadvertently breaching HMRC rules, which could lead to tax complications
    for the account holder.


    **Future Allowance Changes**

    Agents must be aware of a scheduled regulatory change. From 6 April 2027, the
    cash ISA allowance for under-65s is expected to change to £12,000. This reduction
    from the current £20,000 limit will affect how customers can fund their accounts
    from that date forward.


    **Interest and Access**

    The account provides a consistent interest rate of 2.85%. As an ''Easy Access''
    product, there are no penalties or restrictions on withdrawals. Customers may
    withdraw funds at any time without incurring a fee, although doing so will reduce
    the balance upon which the 2.85% interest is calculated.


    **Edge Cases and Transfers**

    - **ISA Transfers:** When a customer transfers an ISA from another provider, the
    amount transferred does not count towards their £20,000 annual allowance for the
    current tax year, provided the transfer is handled through the official ISA transfer
    process.

    - **Over-funding:** If a customer has already utilised their £20,000 allowance
    elsewhere, they cannot open or fund a Wrenfield Easy Access Cash ISA until the
    new tax year begins.

    - **Tax Status:** This account is designed for UK residents. If a customer''s
    residency status changes, they must notify us immediately as this may affect the
    tax-exempt status of the account.


    For further details on account opening, refer to Wrenfield Easy Access Cash ISA
    — eligibility and setup.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: bbd22c5a-a1dc-5c70-826d-a1585cb5446d
  title: Wrenfield Easy Access Cash ISA — cost and charges
  body: '**Are there any monthly fees to maintain my Wrenfield Easy Access Cash ISA?**

    No. We believe in fair and transparent pricing; therefore, there are no monthly
    account fees or maintenance charges associated with this product.


    **Do I have to pay a fee to deposit or withdraw my money?**

    No. Deposits and withdrawals from your Wrenfield Easy Access Cash ISA are free
    of charge. We ensure that your access to your savings remains uncomplicated and
    cost-effective.


    **Are there any hidden charges I should be aware of?**

    We avoid opaque jargon and hidden costs. There are no hidden administrative fees
    for this account. All our pricing is designed to be clear and stable, reflecting
    our commitment to the Consumer Duty.


    For a broader overview of our fee philosophy, you can view Institution-wide fees
    and charges.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
  placeholder: true
