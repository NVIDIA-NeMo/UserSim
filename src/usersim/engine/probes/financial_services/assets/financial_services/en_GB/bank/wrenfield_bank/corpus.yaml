- id: 176b05ff-33b6-53d1-aa52-40dcc7d502d8
  title: Wrenfield Personal Loan — referral and loyalty offer
  body: 'We are delighted to invite our valued customers to share the stability of
    Wrenfield Bank with their friends and family. From 1 November 2024 to 31 December
    2024, we are offering a loyalty reward to support your financial goals.


    If you refer a new customer who successfully opens a Wrenfield Personal Loan,
    we will credit your account with a referral bonus of £50. The new customer will
    also benefit from our transparent pricing, including a representative APR of 6.9%.


    This offer is available for a limited time and is subject to our standard affordability
    assessments to ensure we lend responsibly. To participate, simply ensure your
    referral mentions your name during their application process. Once the loan is
    active, we will apply the reward to your nominated account within 30 business
    days.


    For more details on our core lending terms, please refer to Wrenfield Personal
    Loan — overview.'
