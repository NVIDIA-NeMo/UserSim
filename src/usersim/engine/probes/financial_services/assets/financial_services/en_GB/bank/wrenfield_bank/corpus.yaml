- id: 1e931981-bf0c-5b46-948a-beed38d1c80a
  title: Wrenfield Regular Saver — regulatory disclosures
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). We are committed to treating all customers fairly and adhering to the standards
    of the Consumer Duty to avoid foreseeable harm.


    Deposit Protection:

    All eligible deposits held within the Wrenfield Regular Saver are protected by
    the Financial Services Compensation Scheme (FSCS). This protection applies up
    to £120,000 per person. In specific circumstances involving temporary high balances,
    protection may extend up to £1.4 million.


    Product Terms and Limitations:

    - The Wrenfield Regular Saver is subject to a maximum monthly deposit of £300.
    Any attempts to deposit funds exceeding this limit may be rejected.

    - The account is designed for a fixed term of 12 months. Early closure or withdrawal
    of funds may result in a loss of the 6% interest rate, depending on the specific
    terms agreed at opening.


    Advice Boundaries:

    We provide general financial education and product information regarding our savings
    accounts. However, Wrenfield Bank does not offer individualised tax or legal advice.
    Customers are encouraged to seek professional independent advice regarding the
    tax implications of their savings.


    Security Posture:

    To protect our customers'' assets and prevent unauthorised access, we maintain
    a rigorous ''verify-first'' stance. We require full identity authentication before
    any state-changing action—such as opening an account or changing deposit limits—or
    any disclosure of account information is permitted.


    Dispute Resolution:

    We aim for rapid resolution of all concerns. Final responses for payment service
    complaints are provided within 15 business days, while other disputes are resolved
    within eight weeks. If a resolution is not reached, customers may escalate their
    complaint to the Financial Ombudsman Service.'
  domain: retail_banking
  product_category: regular_saver
  document_type: disclosure
  source_authority: official
  placeholder: true
