- id: ff426a0d-7a9f-57c0-873c-4317fca7e9f2
  title: Wrenfield Rewards Credit Card — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers through the
    onboarding process for the Wrenfield Rewards Credit Card. Our goal is to ensure
    a professional, welcoming, and clear experience that adheres to our ''verify-first''
    security posture.


    **Phase 1: Identity Verification**

    Before discussing specific account limits or processing an application, you must
    perform full identity authentication. This is a non-negotiable security step to
    prevent unauthorised access to customer data.


    **Phase 2: Application and Affordability**

    Walk the customer through the application process. Explain that while our representative
    example uses an assumed credit limit of £1,200, the final limit will be determined
    by a strict affordability assessment. This assessment is a regulatory requirement
    to ensure the customer can manage the repayments without foreseeable harm.


    **Phase 3: Product Feature Overview**

    Clearly explain the core financial attributes of the card:

    - **Cost of Borrowing:** The representative APR is 24.9%.

    - **Balance Transfers:** Customers can transfer balances from other providers
    for a fee of 3.49%, with a promotional period of 24 months.

    - **International Use:** Inform the customer that a foreign transaction fee of
    2.99% applies to all non-sterling payments.

    - **Consumer Protection:** Remind the customer that the card offers Section 75
    protection for purchases between £100 and £30,000.


    **Phase 4: Card Activation**

    Once the card is delivered, the customer must be guided through the activation
    process. Ensure they understand how to set up their digital access for statement
    reviews. Confirm that they know the support hours are standard UK business hours
    and that complex issues are handled via a structured escalation path to senior
    management if unresolved.'
  domain: cards
  product_category: credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a96dd92a-ef2a-53dd-9489-c08489702ce7
  title: Wrenfield Rewards Credit Card — balance transfer fee explained
  body: '**What is the fee for transferring a balance to the Wrenfield Rewards Credit
    Card?**

    We charge a balance transfer fee of 3.49% of the total amount being transferred.
    This fee is transparently priced to cover our operational costs and regulatory
    risks.


    **How long does the balance transfer offer last?**

    Balances transferred to this account are subject to a promotional period of 24
    months. This allows you to manage your existing debt more effectively over a two-year
    window.


    **How does this affect my overall cost of borrowing?**

    While the balance transfer fee is a one-time percentage, any balance remaining
    on the card after the 24 months, or any new spend not covered by a promotion,
    will generally be subject to the representative APR of 24.9%. For a full overview
    of our pricing, please refer to the Wrenfield Rewards Credit Card — overview.'
  domain: cards
  product_category: credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 5c5d0830-9662-592a-b5fa-f4eb875f721f
  title: Wrenfield Rewards Credit Card — make a change or update
  body: 'Whether you have moved home or changed your legal name, we ensure the process
    of updating your account details is clear and secure. Follow these steps to make
    a change to your Wrenfield Rewards Credit Card account.


    **What you will need**

    - Your account identification details.

    - A valid form of government-issued photo ID.

    - A recent utility bill or council tax statement (if updating your residential
    address).


    **Step-by-Step Process**

    1. **Provide the Update:** Tell us exactly which detail needs changing (e.g.,
    ''I need to update my home address to 12 High Street, London'').

    2. **Identity Authentication:** We will conduct a full identity verification.
    This ''verify-first'' process ensures that no unauthorised changes are made to
    your account security or assets.

    3. **Submit Documentation:** Provide the required supporting evidence (such as
    your photo ID or proof of address) for our team to review.

    4. **Verification Review:** We will review the documents against our internal
    records to ensure they meet our regulatory standards.

    5. **Confirmation of Change:** Once verified, we will apply the update to your
    account and provide you with a confirmation message stating that the change is
    now active.


    **How you know it worked**

    You will receive a formal confirmation via your preferred communication channel.
    You can also check your account details during your next statement review to ensure
    the updated information is correctly reflected. If you have any issues with this
    process, our support is available during standard UK business hours.'
  domain: cards
  product_category: credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: db1ad20d-fadc-5a8a-8f5d-8630359aee14
  title: Wrenfield Rewards Credit Card — access or login problems
  body: 'If you are experiencing difficulties accessing your digital account for your
    Wrenfield Rewards Credit Card, please follow this guide. We provide a structured
    resolution path to ensure your account remains secure while restoring your access.


    **Symptom: ''Incorrect Credentials'' or ''Account Locked'' messages**

    This usually occurs after multiple failed login attempts or if the password has
    expired for security reasons.


    **What to check in order:**

    1. **Credential Accuracy:** Ensure there are no typographical errors and that
    ''Caps Lock'' is not accidentally enabled.

    2. **Connectivity:** Verify that you have a stable internet connection; a timed-out
    session can sometimes be misreported as a login failure.

    3. **Account Status:** Check if you have recently changed your contact details,
    as this can sometimes trigger a security hold on digital access.


    **The Fix**

    If you are locked out, we will initiate a secure identity restoration process:

    - Tell us you are unable to access your account.

    - We will perform a full ''verify-first'' identity authentication to ensure you
    are the account holder.

    - Once verified, we will reset your access credentials or unlock the account immediately.

    - You will then be prompted to create a new, secure password.


    **When to Escalate**

    If your identity cannot be verified through standard methods, or if you suspect
    your account has been compromised (e.g., you see unauthorised charges like unexpected
    2.99% foreign transaction fees), the issue will be escalated. We will route the
    case to our senior management team for a detailed security review. You will receive
    a notification once the review is complete and your access has been safely restored.
    Our resolution team operates during standard UK business hours to ensure you receive
    professional and timely support.'
  domain: cards
  product_category: credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: e5fae396-604a-5ff9-8957-4e64bcb269f1
  title: Wrenfield Rewards Credit Card — qualification tiers
  body: 'To ensure a high standard of care and avoid foreseeable harm, we apply specific
    qualification tiers for the Wrenfield Rewards Credit Card based on our strict
    affordability assessments.


    | Credit & Affordability Profile | Outcome | Detail |

    | :--- | :--- | :--- |

    | **Tier 1: High Stability** | Fully Eligible | Standard approval with a credit
    limit approximating the representative example of £1,200. |

    | **Tier 2: Moderate Stability** | Eligible with Review | Approval is subject
    to additional income verification to ensure the 24.9% representative APR is sustainable.
    |

    | **Tier 3: Low Stability** | Not Eligible | Application declined to protect the
    customer from potential financial distress. |

    | **Tier 4: Insufficient Data** | Referral | Application referred for manual review
    by senior management to determine suitability. |


    All approvals are subject to the final authorisation of the PRA and regulation
    by the FCA. We do not offer individualised legal or tax advice during this process.'
  domain: cards
  product_category: credit_card
  document_type: eligibility_matrix
