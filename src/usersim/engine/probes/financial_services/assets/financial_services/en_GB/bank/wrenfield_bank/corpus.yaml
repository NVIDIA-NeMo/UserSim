  institution_id: wrenfield_bank
- id: 42780077-bfb5-57d7-980e-50ebf3e0f3d3
  title: Wrenfield Two-Year Fixed Mortgage — cancel, close, or downgrade
  body: 'If you wish to exit your Wrenfield Two-Year Fixed Mortgage—whether to switch
    to another provider, pay off the balance in full, or move to a different product—please
    follow these steps.


    Before starting, be aware that exiting the fixed-term agreement may incur costs.
    Specifically, an Early Repayment Charge of 3% applies in year one and 2% in year
    two of the mortgage term.


    1. Request a Redemption Statement: Tell us that you wish to close or transfer
    your mortgage. We will provide you with a formal redemption statement, which calculates
    the total outstanding balance, including any accrued interest and applicable Early
    Repayment Charges.


    2. Review Overpayment Options: If you are not closing the account but wish to
    reduce the balance, check your overpayment allowance. You can pay up to 10% of
    the balance per year without penalty; any amount above this will be subject to
    the Early Repayment Charges mentioned above.


    3. Arrange Fund Transfer: Provide us with the details of the funds used for redemption.
    If you are switching to another lender, your new provider will typically handle
    the transfer of funds to us.


    4. Confirmation of Closure: Once we receive the full redemption amount, we will
    discharge the mortgage charge from the property title. We will then send you a
    final confirmation letter stating that the mortgage is closed and the security
    has been released.


    If you wish to move to another internal product rather than closing the account,
    please ask us about our product transfer options to avoid the full redemption
    process.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: how_to_guide
  source_authority: official
