  institution_id: wrenfield_bank
- id: d3838f39-d6ef-5bfa-b312-bd3f5c81e585
  title: Wrenfield Easy Access Cash ISA — eligibility and setup
  body: '**Who is eligible to open a Wrenfield Easy Access Cash ISA?**

    This account is available to individuals who are UK residents and meet our standard
    identity verification requirements. We follow a strict ''verify-first'' stance
    to ensure the security of all our customers'' assets.


    **How do I set up the account and fund it?**

    You can open the account by providing the required identification documents. Once
    verified, you can fund the account via a transfer from another bank or by transferring
    an existing ISA. You can deposit up to the current annual allowance of £20,000.


    **Can I open this account if I already have an ISA with another bank?**

    Yes. You can either open a new ISA and contribute up to your remaining annual
    allowance, or you can request a formal transfer of your existing ISA funds to
    us. We will handle the transfer process to ensure your tax-free status is maintained.


    For a detailed guide on transfers, see Wrenfield Easy Access Cash ISA — resolve
    a common request end-to-end.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
