- id: 1ab45b7d-2c8d-5ebc-9917-cd1978648825
  title: Wrenfield Current Account — make a change or update
  body: 'If you need to update your personal details or make a change to how your
    Wrenfield Current Account is managed, please follow these steps. We handle these
    requests through our branch network, telephone banking, and digital channels during
    standard UK business hours.


    1. Provide the Request: Tell us clearly what information needs to be updated (for
    example, a change of residential address, a name change due to marriage, or an
    update to your contact telephone number).


    2. Identity Authentication: Because we maintain a rigorous ''verify-first'' stance,
    we will ask you to complete a full identity verification process. This may involve
    answering security questions or providing a valid form of government-issued identification
    to ensure the security of your assets.


    3. Submit Supporting Evidence: For certain changes, such as a name change, we
    will ask you to provide a supporting document (e.g., a marriage certificate).
    We will confirm the details of the document you are providing.


    4. Confirmation of Update: Once we have verified your identity and reviewed the
    evidence, we will process the change. You will receive a confirmation message
    or letter stating that your account details have been successfully updated.


    If you are unsure about the documents required for your specific change, you can
    consult Wrenfield Current Account — required documentation. For those who are
    setting up a new account for the first time, please see Wrenfield Current Account
    — set up and activate.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
