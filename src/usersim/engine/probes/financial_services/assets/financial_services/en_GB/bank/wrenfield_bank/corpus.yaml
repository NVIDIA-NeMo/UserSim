    - Standard Variable Rate (SVR): 7.49%

    This rate applies automatically once the initial two-year fixed period has ended.


    - Annual Percentage Rate of Charge (APRC): 7.4%

    This represents the total cost of the mortgage over its full term, including the
    £999 product fee and interest.


    Rates are reviewed periodically in line with market conditions and regulatory
    requirements. Any changes to the standard variable rate will be communicated to
