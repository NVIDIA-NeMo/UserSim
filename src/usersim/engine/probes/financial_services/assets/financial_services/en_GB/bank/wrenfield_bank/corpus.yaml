- id: e127d47b-c2c6-5575-92d3-821c5f180e03
  title: Wrenfield Current Account — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the end-to-end process of switching
    your daily banking from another institution to the Wrenfield Current Account.
    Here is how that process works.


    **What you will need before starting**

    To begin the switch, you will need the sort code and account number of the account
    you wish to close, as well as your current identification documents for our ''verify-first''
    authentication process.


    **Step-by-Step Process**


    1. **Initiate the Switch:** Tell us that you wish to switch your account to Wrenfield
    Bank. We will ask you for the details of your existing account and your confirmation
    to use the Current Account Switch Service.

    2. **Identity Verification:** We will conduct a full identity authentication to
    ensure the security of the transfer and prevent unauthorised account openings.

    3. **The Transition Period:** We will work with your previous bank to migrate
    all your standing orders and direct debits. During this time, we will keep you
    updated on the progress of the switch.

    4. **Confirmation of Completion:** We will notify you once the switch is complete
    and your old account is closed. Your new Wrenfield Current Account will be fully
    active.

    5. **Payment of Incentive:** Once the switch is successfully finalised, we will
    credit your account with the £175 switching incentive.


    **How you know it worked**

    You will see the £175 incentive appear in your transaction history, and all your
    previous regular payments will now be operating seamlessly from your Wrenfield
    Current Account.


    For more information on this specific payment, see Wrenfield Current Account —
    payment for switching with the Current Account Switch Service explained.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 52a71f1c-110d-5359-9369-1237a0898cde
  title: Wrenfield Current Account — a discrepancy in your records or statement
  body: "This document guides support agents through resolving customer reports of\
    \ discrepancies in their Wrenfield Current Account records or monthly statements.\n\
    \n**Symptom: The customer reports a balance or transaction that does not match\
    \ their own records.**\n\n**Likely Causes**\n- **Pending Transactions:** The customer\
    \ may be viewing a 'current balance' rather than an 'available balance', overlooking\
    \ transactions that have been authorised but not yet settled.\n- **Overdraft Interest:**\
    \ The customer may be surprised by a debit for overdraft interest. Remind them\
    \ that arranged overdrafts carry a rate of 39.9%.\n- **Processing Delays:** Some\
    \ third-party payments may take several business days to appear on the statement.\n\
    - **Actual Error:** A genuine processing error or an unauthorised transaction.\n\
    \n**Resolution Steps for the Agent**\n1. **Verify Identity:** Ensure the customer\
    \ has passed full identity authentication before discussing any account specifics.\n\
    2. **Review Transaction History:** Compare the customer's reported discrepancy\
    \ against the ledger. Check for pending items and recent interest charges at 39.9%.\n\
    3. **Explain the Entry:** If the discrepancy is due to a standard banking process\
    \ (like pending settlements), explain this clearly to the customer.\n4. **Initiate\
    \ a Dispute:** If the entry remains unexplained or is suspected to be an error,\
    \ initiate the formal dispute process. \n\n**Escalation and Timelines**\n- **Payment\
    \ Service Complaints:** If the discrepancy relates to a payment service, we aim\
    \ to provide a final response within 15 business days.\n- **Other Disputes:**\
    \ For general account disputes, we provide a final response within eight weeks.\n\
    - **Unresolved Issues:** If the customer remains dissatisfied, we will provide\
    \ information on how to escalate the matter to the Financial Ombudsman Service.\n\
    \nFor guidance on similar issues, see Wrenfield Current Account — an unexpected\
    \ charge or amount."
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 07a423b8-5fb6-55c9-827d-9f64a26d5440
  title: Wrenfield Everyday Saver — overview
  body: 'Welcome to the Wrenfield Everyday Saver, a dependable savings solution designed
    for those who value stability and straightforwardness in their banking. We believe
    that starting a savings habit should be accessible to everyone, which is why we
    have removed the high barriers often associated with traditional savings accounts.
    This account serves as a flexible hub for your funds, allowing you to grow your
    money while maintaining the peace of mind that your assets are secure and readily
    available.


    One of the primary strengths of the Wrenfield Everyday Saver is its exceptional
    accessibility. To open an account, we require a minimum opening deposit of only
    £1, ensuring that any customer, regardless of their current financial standing,
    can begin their savings journey with us. This commitment to inclusivity is a core
    part of our service model, providing a low-barrier entry point into a secure banking
    environment.


    In terms of growth, the account provides a consistent and fair return on your
    deposits. We currently offer an interest rate of 2.1% on all balances held within
    the account. This rate is designed to provide a stable yield, helping your money
    keep pace with your goals without the complexity of tiered structures or restrictive
    conditions. Because we value transparency, we ensure that our rates are clearly
    communicated and applied consistently across all Everyday Saver accounts.


    Security and stability are the foundations of the Wrenfield Bank experience. The
    Wrenfield Everyday Saver is managed under the strict authorisation of the Prudential
    Regulation Authority (PRA) and the regulation of the Financial Conduct Authority
    (FCA). Furthermore, your deposits are protected by the Financial Services Compensation
    Scheme (FSCS) up to £120,000 per person, with temporary high balances protected
    up to £1.4 million, ensuring your hard-earned money is safe.


    Whether you are saving for a rainy day or simply looking for a transparent place
    to keep your surplus cash, the Wrenfield Everyday Saver offers the stability and
    fairness you expect from a high-street institution. For a detailed breakdown of
    how our interest is calculated and applied, please refer to the Wrenfield Everyday
    Saver — interest rate / AER schedule.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: d0abae75-2b86-5a97-a040-e1b1ba6e5cca
  title: Wrenfield Everyday Saver — interest rate (AER) explained
  body: 'How is the interest calculated on my Wrenfield Everyday Saver?

    We apply an interest rate of 2.1% to the balance of your account. This is quoted
    as an Annual Equivalent Rate (AER), which represents the interest you would earn
    if the interest were paid and compounded once per year. This standardisation allows
    you to compare our rate fairly against other savings products.


    Is the 2.1% rate fixed or variable?

    The rate on the Wrenfield Everyday Saver is variable. This means we may adjust
    the rate in response to changes in the wider economic environment or shifts in
    the base rate set by the Bank of England. We will notify you of any significant
    changes to your rate in accordance with our commitment to transparency.


    When will I see the interest credited to my account?

    Interest is calculated daily based on your balance and credited to your account
    periodically. You can view your accrued interest and the date of the next credit
    by reviewing your most recent statement or by checking the Wrenfield Everyday
    Saver — interest rate / AER schedule.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: faq
  source_authority: official
