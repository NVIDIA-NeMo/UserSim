- id: ebca4438-a2a5-5977-bd8d-67201e3f81cb
  title: Wrenfield Personal Loan — vs. a typical competitor offering
  body: 'When comparing the Wrenfield Personal Loan against typical high-street competitor
    offerings, the primary distinctions lie in our commitment to transparency and
    the Consumer Duty.


    Many competitors offer ''teaser'' rates that are only available to a tiny fraction
    of applicants. In contrast, our representative APR of 6.9% is a reliable benchmark,
    as we must offer it to at least 51% of successful applicants. While some competitors
    may offer higher maximum loan amounts than our £35,000 limit, we prioritise a
    strict affordability assessment to prevent customers from over-borrowing and facing
    foreseeable harm.


    Our model is built for stability; we provide clear, fixed repayment schedules
    (such as £196.56 per month for a £10,000 loan over 60 months) without hidden operational
    fees.


    **Who should choose Wrenfield:** Customers who value a dependable institution,
    transparent pricing, and a rigorous approach to financial well-being.

    **Who should choose a competitor:** Those requiring borrowing limits exceeding
    £35,000 or those seeking highly volatile, short-term promotional rates.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: edd3033d-fd63-5104-9b7d-1693c4b1ad40
  title: Wrenfield Personal Loan — risk disclosures
  body: 'Borrowing is a significant financial commitment. Before applying for a Wrenfield
    Personal Loan, please consider the following risk disclosures:


    **Cost of Credit**

    Interest is charged on the principal amount borrowed. For example, if you borrow
    £10,000 over 60 months at a representative APR of 6.9%, the total amount payable
    will be £11,793.60. This means the total cost of credit for this representative
    example is £1,793.60.


    **Affordability and Harm**

    To protect our customers, all loans up to our maximum limit of £35,000 are subject
    to a strict affordability assessment. Borrowing more than you can afford to repay
    can lead to significant financial distress and may result in your assets being
    at risk.


    **Impact on Credit Rating**

    Missing a scheduled monthly payment (such as the £196.56 in our representative
    example) can have a negative impact on your credit score. This may make it more
    difficult or more expensive for you to obtain credit in the future from us or
    other institutions.


    **Regulatory Protection**

    We operate under the strict authorisation of the PRA and regulation by the FCA.
    While loans themselves are not deposits and therefore not protected by the FSCS,
    our operational conduct is monitored to ensure all customers are treated fairly
    and in accordance with the Consumer Duty.


    We provide general financial education, but we do not offer individualised tax
    or legal advice regarding your borrowing strategy.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 372e40ff-9606-53e5-a9a3-f9073fc38ef9
  title: Wrenfield Personal Loan — how rates are tiered and applied
  body: "The interest rates for the Wrenfield Personal Loan are applied based on the\
    \ customer's individual creditworthiness and the specific terms of the loan.\n\
    \n**Representative APR**\nOur current representative APR is 6.9%. In accordance\
    \ with regulatory standards, we are able to offer this rate to at least 51% of\
    \ successful applicants. \n\n**How Rates are Determined**\nWe do not use a public\
    \ tiered table because the final rate is determined by a combination of:\n- **Credit\
    \ Profile:** A higher credit score generally allows for a lower APR.\n- **Affordability\
    \ Assessment:** The ratio of the loan amount (up to the £35,000 maximum) to the\
    \ customer's monthly disposable income.\n- **Loan Term:** The duration of the\
    \ loan (e.g., 60 months in our representative example) can influence the total\
    \ interest accrued.\n\nAll rates are fixed for the duration of the loan term,\
    \ meaning the monthly payment (e.g., £196.56 for a representative £10,000 loan)\
    \ will not change regardless of market fluctuations."
  domain: lending_mortgage
  product_category: personal_loan
