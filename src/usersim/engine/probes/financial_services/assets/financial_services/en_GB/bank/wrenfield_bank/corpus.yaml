- id: cd909c5e-8fea-58de-ade2-d9104773e717
  title: Wrenfield Current Account — set up and activate
  body: 'Setting up your Wrenfield Current Account is a straightforward process designed
    to get you banking with us as quickly as possible. Please follow these steps to
    activate your account.


    What you will need before starting:

    - A valid form of government-issued photo identification.

    - Proof of your current residential address (such as a recent utility bill or
    council tax statement).

    - The details of the account you wish to switch from, if you are claiming the
    switching incentive.


    Step 1: Identity Verification

    Tell us you wish to open a Wrenfield Current Account and provide your full legal
    name, date of birth, and residential address. We will then ask you to present
    your identification documents. We maintain a rigorous ''verify-first'' stance
    to ensure the security of your assets and prevent unauthorised access.


    Step 2: Switching Preferences

    If you are moving from another banking institution, let us know that you would
    like to use the switch process. We will confirm if you are eligible for the switching
    incentive of £175 and will coordinate the transfer of your direct debits and standing
    orders.


    Step 3: Account Configuration

    Specify if you require an arranged overdraft facility. If requested, we will conduct
    a strict affordability assessment. If approved, we will confirm your limit and
    the applicable arranged overdraft rate of 39.9%.


    Step 4: Confirmation and Activation

    We will review your application and perform the necessary regulatory checks. Once
    approved, we will confirm that your account is active. You will receive your account
    number and sort code, and your debit card will be dispatched to your verified
    address.


    Your account is successfully activated once you receive confirmation from us and
    can perform your first transaction. For more information on the requirements for
    this process, you may wish to review the Wrenfield Current Account — eligibility
    requirements.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
