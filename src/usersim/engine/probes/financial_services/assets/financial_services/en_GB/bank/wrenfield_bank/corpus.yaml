- id: 529a8c3c-7ac7-509e-a74f-bfa1635aeeb4
  title: Wrenfield Two-Year Fixed Mortgage — fee schedule
  body: 'This schedule outlines all applicable fees and charges for the Wrenfield
    Two-Year Fixed Mortgage. Support agents should use these exact figures when assisting
    customers.


    - Product Fee: £999

    - Early Repayment Charge (Year 1): 3%

    - Early Repayment Charge (Year 2): 2%


    Note: The early repayment charges apply to the remaining balance if the mortgage
    is closed or switched before the end of the two-year fixed term. Overpayments
    within the 10% annual allowance are exempt from these charges.'
