- id: 960c60aa-aa86-5317-b2c0-9e275d9b602f
  title: Wrenfield Two-Year Fixed Mortgage — a declined or blocked action
  body: 'If you are comparing mortgage products and find that your application or
    a specific request for the Wrenfield Two-Year Fixed Mortgage has been declined
    or blocked, please review the following guidance.


    **Symptom**

    You receive a notification that your mortgage application cannot proceed, or a
    request to change your loan terms has been blocked.


    **Likely Causes**

    - **LTV Threshold**: The loan amount requested exceeds the maximum LTV of 90%.
    If the property appraisal comes in lower than expected, the loan may be blocked.

    - **Affordability Assessment**: Our strict affordability checks may have indicated
    that the loan would cause foreseeable harm, leading to a decline in line with
    Consumer Duty standards.

    - **Authentication Failure**: A state-changing action may have been blocked because
    full identity authentication was not successfully completed.


    **What to Check and Fix**

    1. **Verify Loan-to-Value**: Check if your deposit is sufficient to keep the loan
    at or below 90% of the property value.

    2. **Review Documentation**: Ensure all provided income and expenditure documents
    are current and accurate to assist with the affordability assessment.

    3. **Re-authenticate**: If the action was blocked during a session, ask us to
    restart the identity verification process.


    **When to Escalate**

    If you believe the decline is based on incorrect data, tell us you wish to challenge
    the decision. We will then route the case to our senior management for a structured
    review. You will receive a formal response regarding the decision within eight
    weeks.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 7c42d306-3c45-5a56-97cd-f9d83995cea2
  title: Wrenfield Two-Year Fixed Mortgage — when to switch or upgrade
  body: 'This guide assists support agents in identifying the optimal time for a customer
    to switch from the Wrenfield Two-Year Fixed Mortgage to another product.


    **The Trigger for Switching**

    The primary catalyst for switching is the end of the two-year fixed term. At this
    point, the interest rate jumps from the fixed 5.64% to the Standard Variable Rate
    (SVR) of 7.49%. This represents a significant increase in monthly cost.


    **Comparing the Options**

    - **Stay on SVR (7.49%)**: Best for customers who need maximum flexibility to
    make large repayments without penalty and do not mind the higher rate.

    - **Switch to a new Fixed Rate**: Best for customers who value stability and wish
    to avoid the volatility of the 7.49% SVR. This locks in a predictable payment
    for another term.


    **The Cost of Switching Early**

    Agents must warn customers that switching before the two-year term ends triggers
    an Early Repayment Charge (ERC). This is 3% in the first year and 2% in the second
    year. A switch is only financially viable if the interest savings of the new product
    outweigh these charges.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 562e1d28-f4ba-5aef-90e5-13d55264472a
  title: Wrenfield Two-Year Fixed Mortgage — comparison vs. alternatives and when
    not to choose it
  body: 'When deciding on the right mortgage, it is essential to understand where
    the Wrenfield Two-Year Fixed Mortgage fits compared to other options.


    **Why Choose This Product?**

    This mortgage is designed for homeowners who value stability for a short-to-medium
    duration. By locking in a fixed rate of 5.64%, you are protected from interest
    rate rises for two years, allowing for precise budgeting. It is an excellent entry
    point for those who believe rates may rise in the near future but want the flexibility
    to remortgage relatively soon.


    **Trade-offs and Considerations**

    - **The Initial Cost**: This product carries a product fee of £999, which must
    be factored into the total cost of borrowing.

    - **Lock-in Period**: While stability is a benefit, you are committed to this
    rate for two years. If market rates drop significantly, you cannot switch without
    paying an early repayment charge (3% in year one, 2% in year two).

    - **The ''Cliff Edge''**: At the end of the term, you will move to the Standard
    Variable Rate of 7.49% unless you switch products.


    **When NOT to Choose This Product**

    - **If you need long-term certainty**: If you are uncomfortable with the idea
    of rates changing in two years, a longer-term fixed product would be more suitable.

    - **If you plan to move or pay off the loan soon**: Due to the early repayment
    charges (3% and 2% respectively), this product is not suitable for those who expect
    to settle their mortgage within the next 24 months.

    - **If you have a low deposit**: If your loan requirement exceeds 90% of the property''s
    value, this product will not be available as it has a maximum LTV of 90%.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 70749fb0-94b2-5016-b592-64b2023a2037
  title: Wrenfield Two-Year Fixed Mortgage — APRC (overall cost for comparison) on
    £200,000 over 25 years explained
  body: "**What is the APRC for the Wrenfield Two-Year Fixed Mortgage?**\n\nThe APRC\
    \ (Annual Percentage Rate of Charge) is 7.4%. \n\n**What does this figure actually\
    \ mean for me?**\n\nThe APRC is a representative figure that shows the total cost\
    \ of the loan over its entire duration, not just the initial fixed period. In\
    \ the example of a £200,000 loan over 25 years, the 7.4% APRC accounts for the\
    \ initial fixed rate of 5.64%, the product fee of £999, and the assumption that\
    \ the loan will revert to the Standard Variable Rate of 7.49% after the first\
    \ two years.\n\n**Why is the APRC higher than my fixed rate?**\n\nBecause the\
    \ APRC reflects the 'overall' cost. While you enjoy the lower 5.64% rate for the\
    \ first two years, the remaining 23 years of the mortgage are calculated using\
    \ the higher SVR of 7.49%. The APRC provides a transparent, standardised way for\
    \ you to compare the total cost of this mortgage against other lenders' products."
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
