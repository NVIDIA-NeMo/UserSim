- id: 736acdc5-c0a6-53d6-a624-d4ab57652f54
  title: Wrenfield Easy Access Cash ISA — set up and activate
  body: 'Setting up your Wrenfield Easy Access Cash ISA is a straightforward process.
    Whether you are moving funds from another provider or starting your tax-free savings
    journey with us, follow these steps to activate your account.


    **What you will need before starting**

    To ensure a smooth setup, please have your valid government-issued photo identification
    (such as a passport or driving licence) and a recent proof of address available.
    You should also know the exact amount you wish to deposit, ensuring it fits within
    your total annual ISA allowance of £20,000.


    **Step-by-step activation**

    1. Tell us that you would like to open a Wrenfield Easy Access Cash ISA. If you
    already have a Wrenfield Current Account, we can use your existing details to
    speed up the process.

    2. Provide your full legal name, date of birth, and current residential address
    for our records.

    3. We will then perform a full identity authentication. This is part of our ''verify-first''
    security stance to protect your assets and prevent unauthorised access.

    4. Specify the initial amount you wish to deposit into the account. We will check
    this against the current £20,000 allowance to ensure you remain compliant with
    tax regulations.

    5. We will confirm once the account has been successfully opened and provide you
    with your new ISA account number and sort code.


    **How you know it has worked**

    Your account is active once we provide you with the official account details and
    you see the initial deposit reflected in your balance. You can then begin earning
    the 2.85% annual interest immediately.


    If you are deciding between different savings options, you may find it helpful
    to view the Wrenfield Easy Access Cash ISA — vs. a similar product here.'
