- id: afe4be94-9983-5d7a-98c7-be71718a7c4a
  title: Wrenfield Regular Saver — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in the end-to-end
    setup of the Wrenfield Regular Saver. Ensure the customer is fully authenticated
    using our verify-first protocol before proceeding.


    **Step 1: Prerequisite Check**

    Confirm the customer holds a valid Wrenfield Current Account, as this is required
    to facilitate the monthly deposits. If they do not, refer them to the process
    outlined in ''Wrenfield Current Account — overview''.


    **Step 2: Account Opening**

    Once identity is verified, initiate the opening of the Wrenfield Regular Saver.
    Inform the customer that this is a short-term goal account with a fixed term of
    12 months.


    **Step 3: Establishing the Deposit Plan**

    Explain the deposit rules clearly. The customer may save up to a maximum monthly
    deposit of £300. Help the customer decide on their monthly contribution amount,
    ensuring it does not exceed this £300 limit. Advise them that a standing order
    or automated transfer from their current account is the most effective way to
    maintain this habit.


    **Step 4: Explaining the Returns**

    Confirm that the account carries an interest rate of 6%. Clarify that this rate
    is applied to the balance throughout the 12-month term. Remind the customer that
    this is a tool for disciplined saving and that the primary benefit is the high
    rate of return over the fixed duration.


    **Step 5: Final Confirmation**

    Confirm the account is active and the first deposit is scheduled. Provide the
    customer with their new account details and remind them that their deposits are
    protected by the FSCS up to £120,000. Once complete, the customer will see the
    Wrenfield Regular Saver listed alongside their other products in their digital
    overview.'
  domain: retail_banking
  product_category: regular_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: cf7e147d-f3fb-5129-9ff1-8ffa383f491e
  title: Wrenfield Regular Saver — term (months) explained
  body: '**What is the ''term'' of a Wrenfield Regular Saver?**

    The term refers to the fixed duration for which the account remains open and earns
    the specified high interest rate. For the Wrenfield Regular Saver, the term is
    12 months.


    **What happens when the 12-month term ends?**

    At the end of the 12 months, the account matures. The total balance, including
    the interest earned at the rate of 6%, will typically be transferred to your linked
    Wrenfield Current Account or another nominated savings product. You cannot continue
    to make deposits into the same account once the 12-month term has elapsed.


    **Can I close the account before the 12 months are up?**

    Yes, you can close the account early, but please be aware that doing so may affect
    the interest you earn. We recommend reviewing the full terms in ''Wrenfield Regular
    Saver — account agreement'' to understand the implications of early closure.'
  domain: retail_banking
  product_category: regular_saver
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4ea4ee43-ae77-51f4-a2e7-8f0c0caf4e56
  title: Wrenfield Regular Saver — make a change or update
  body: 'If you wish to adjust the amount you are saving each month in your Wrenfield
    Regular Saver, please follow these steps. We will handle the update for you during
    your conversation with us.


    **Prerequisites**

    You must be the primary account holder and have your identity verified through
    our standard security process.


    **Step 1: Request the Change**

    Tell us the new monthly amount you wish to deposit. Please remember that the maximum
    monthly deposit is £300. If you request an amount higher than £300, we will inform
    you that this exceeds the product limit and will ask you to choose an amount within
    the allowed threshold.


    **Step 2: Verification of Funds**

    We will check that your linked current account is capable of supporting the new
    monthly amount. If there are any concerns regarding affordability or balance,
    we will discuss these with you to ensure the change does not lead to foreseeable
    harm.


    **Step 3: Confirmation of Update**

    We will apply the change to your account settings. You will receive a confirmation
    from us (via your preferred digital or postal channel) stating the new monthly
    deposit amount and the date from which the new amount will be deducted.


    **Step 4: Final Check**

    Once you receive the confirmation, you can verify the change in your account overview.
    Your savings will continue to earn an interest rate of 6% throughout the remainder
    of your 12-month term.'
  domain: retail_banking
  product_category: regular_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9b5b8bd5-acb1-53a5-9ee9-29fada5f6712
  title: Wrenfield Regular Saver — access or login problems
  body: 'When choosing a banking partner, we understand that digital reliability and
    ease of access are primary considerations. If you are experiencing difficulties
    accessing your Wrenfield Regular Saver, please refer to the following troubleshooting
    steps.


    **Symptom: Account not visible in the digital overview**

    If you can log in to your banking portal but cannot see your Wrenfield Regular
    Saver alongside your other accounts, the most likely causes are a synchronisation
    delay or an authentication timeout.


    **What to check and in what order:**

    1. **Refresh Connection:** Completely log out of your session and log back in.
    This often resolves temporary display issues.

    2. **Verify Account Status:** Ensure that the 12-month term of your account has
    not expired. Once the term ends, the balance is transferred, and the account is
    closed.

    3. **Check for Notifications:** Look for any messages from us regarding account
    security or required identity updates that may have temporarily restricted your
    view.


    **The Fix**

    If the account remains missing, tell us you are unable to see your Regular Saver.
    We will perform a manual synchronisation of your profile and verify that the account
    is active and correctly linked to your primary customer ID.


    **When to Escalate**

    If we cannot restore visibility immediately, we will raise a technical case with
    our senior management team. You will be provided with a case reference number,
    and we will provide an update on the resolution within two business days. If the
    issue remains unresolved after this period, you may escalate the matter through
    our structured complaint path, leading ultimately to the Financial Ombudsman Service.'
  domain: retail_banking
  product_category: regular_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 75fbbf89-9df6-5a2e-964c-75123f05c569
  title: Wrenfield Regular Saver — qualification tiers
  body: 'This matrix is for support agents to determine a customer''s eligibility
    for the Wrenfield Regular Saver. This product operates on a single qualification
    tier.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Account Status | Must hold a Wrenfield Current Account | Eligible |

    | Residency | Must be a UK resident | Eligible |

    | Age | Must be 18 years of age or older | Eligible |

    | Identity | Must pass full identity authentication | Eligible |

    | Funding | Must be able to commit to a monthly deposit (up to £300) | Eligible
    |


    **Agent Note:** If any of the above requirements are not met, the customer is
    ineligible for the Wrenfield Regular Saver. In such cases, you may suggest the
    ''Wrenfield Everyday Saver — overview'' as a flexible alternative that requires
    only a £1 minimum opening deposit.'
  domain: retail_banking
  product_category: regular_saver
  document_type: eligibility_matrix
