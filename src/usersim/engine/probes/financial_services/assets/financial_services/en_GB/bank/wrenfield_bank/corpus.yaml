- id: 59ad9e91-c029-51a0-922b-82ba7e6fd7d9
  title: Wrenfield Current Account — access or login problems
  body: 'If you are experiencing difficulties accessing your Wrenfield Current Account
    via our digital channels, please follow this troubleshooting guide.


    Symptom: ''Incorrect credentials'' or ''Account locked'' message during login.


    Likely Causes:

    - Incorrect username or password entry.

    - Account lockout following too many unsuccessful login attempts.

    - Outdated security software or browser cache issues.


    What to check in order:

    1. Verify Input: Ensure that ''Caps Lock'' is off and that you are entering your
    credentials exactly as they were created. Try re-entering the information slowly.

    2. Check Connection: Ensure you have a stable internet connection and that you
    are using a supported browser.

    3. Reset Credentials: If you have forgotten your password, ask us to initiate
    a secure password reset process.


    How to fix it:

    If your account has been locked for security reasons, we will require you to undergo
    a full identity authentication process. Once we have verified your identity, we
    will unlock the account and, if necessary, help you establish new login credentials.


    When to escalate:

    If you have verified your credentials and passed our identity checks but still
    cannot access your account, tell us so we can escalate the issue. We will route
    your case to our senior technical management team for a detailed investigation.
    You will be notified of the progress and provided with a resolution timeline.
    For other types of operational errors, please refer to Wrenfield Current Account
    — a failed or pending action.'
  domain: retail_banking
  product_category: current_account
  document_type: troubleshooting
