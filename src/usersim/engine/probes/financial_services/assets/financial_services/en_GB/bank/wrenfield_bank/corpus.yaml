  title: Wrenfield Rewards Credit Card — fee schedule
  body: 'This schedule outlines the operational costs and regulatory risk fees associated
    with the Wrenfield Rewards Credit Card. Support agents should use these exact
    figures when assisting customers.


    - Monthly Account Fee: £0

    - Balance Transfer Fee: 3.49% of the amount transferred

    - Foreign Transaction Fee: 2.99% of the transaction value


    All fees are applied transparently to the customer''s statement. For disputes
