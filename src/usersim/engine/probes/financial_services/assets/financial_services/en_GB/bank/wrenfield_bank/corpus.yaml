- id: 86bca87c-36c5-5a7c-aa42-ee6642e3aad2
  title: Wrenfield Personal Loan — account security best practices
  body: 'At Wrenfield Bank, the security of your assets is our primary concern. We
    maintain a rigorous ''verify-first'' stance to protect your borrowing and personal
    data from unauthorised access. Please familiarise yourself with these best practices
    to keep your Wrenfield Personal Loan secure.


    **Recognising Loan-Related Scams**

    Be vigilant against ''loan recovery'' or ''advance fee'' scams. We will never
    ask you to pay a processing fee, insurance premium, or ''release charge'' upfront
    before the loan funds are disbursed to you. Any request for payment to ''unlock''
    your funds is a sign of fraudulent activity.


    **Our Communication Standards**

    We will never ask you to disclose your full security password, PIN, or one-time
    passcodes over the telephone or via email. If you receive a communication that
    appears to be from us but asks for this information, do not engage and report
    it to us immediately.


    **Action in Case of Suspicion**

    If you believe your identity has been compromised or you notice any unauthorised
    changes to your contact details, you must notify us without delay. Rapid reporting
    is essential to limit potential liability and allow us to secure your account.
    We recommend checking your monthly statements regularly for any discrepancies
    in your repayment amounts.


    **Verification Procedures**

    To protect you, we require full identity authentication before we perform any
    state-changing action on your loan or disclose account information. This may involve
    security questions or multi-factor authentication. While this adds a step to your
    interaction, it ensures that only you can manage your debt.


    For further guidance on spotting broader threats, you may find Wrenfield Personal
    Loan — recognising scams targeting this product helpful.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 3c33bc61-deed-5636-acf5-5cbd88959063
  title: Wrenfield Personal Loan — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms and
    conditions of your Wrenfield Personal Loan. As a dependable high-street institution,
    we strive for transparency and stability in our lending relationships.


    **Notice of Change**

    We reserve the right to amend the general terms of our lending products to reflect
    regulatory changes from the PRA or FCA, or to adjust our operational processes.
    Should we make a material change to the terms of your agreement, we will provide
    you with written notice at least 30 days before the change takes effect. This
    notice will clearly detail the current term and the proposed new term.


    **Fixed Terms vs. Variable Elements**

    For customers on a fixed-rate agreement, the representative APR of 6.9% is locked
    for the duration of the loan term. We will not increase this rate during the life
    of the loan. However, administrative terms, such as the method of notification
    or the structure of our dispute handling, may be updated.


    **Maximum Loan Limits**

    Our current maximum loan amount of £35,000 is subject to periodic review based
    on our risk appetite and regulatory requirements. Changes to this limit will apply
    to new applications and will not affect existing loan agreements.


    **Customer Rights**

    If a change to the general terms is unacceptable to you, you maintain the right
    to continue your repayments under the existing terms until the loan is settled,
    or to request a settlement figure to close the account early. All lending remains
    subject to our strict affordability assessments to avoid foreseeable harm.


    For a full breakdown of our lending obligations, please see Wrenfield Personal
    Loan — account agreement.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
