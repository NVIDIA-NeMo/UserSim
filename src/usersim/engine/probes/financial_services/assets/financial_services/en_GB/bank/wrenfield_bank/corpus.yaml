- id: 8822ef06-0e35-5708-ab93-1bce2c40c746
  title: Wrenfield Two-Year Fixed Mortgage — overview
  body: 'Welcome to Wrenfield Bank. We provide stability and transparency for your
    home financing through the Wrenfield Two-Year Fixed Mortgage. This product is
    designed for retail customers who value predictability in their monthly budgeting.


    For the first two years of your mortgage, we provide a fixed interest rate of
    5.64%. This means your monthly payments remain constant regardless of market fluctuations
    during this period. The total cost of the loan, including the interest and fees,
    is reflected in an APRC of 7.4%.


    To secure this stable rate, a product fee of £999 is applicable. We offer this
    mortgage to customers who can demonstrate a maximum Loan to Value (LTV) of 90%,
    ensuring a sustainable equity position in the property.


    We understand that financial circumstances can change. Therefore, we include an
    overpayment allowance of 10% per year, allowing you to pay down your mortgage
    balance faster without incurring penalties. However, should you wish to repay
    the mortgage in full or switch products before the two-year term ends, early repayment
    charges will apply: 3% during the first year and 2% during the second year.


    Once the initial two-year fixed term expires, the loan will automatically revert
    to our standard variable rate of 7.49%. To ensure a high standard of care and
    avoid foreseeable harm, all lending recommendations are subject to our strict
    affordability assessment. This process ensures the loan remains manageable throughout
    its duration.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a833415d-5e53-5036-b3cf-185bb6577e32
  title: Wrenfield Two-Year Fixed Mortgage — initial fixed interest rate explained
  body: 'Q: What does the initial fixed interest rate mean for my monthly payments?


    A: With the Wrenfield Two-Year Fixed Mortgage, you benefit from an initial fixed
    rate of 5.64%. This means that for the first two years of your mortgage, your
    interest rate is locked. Your payments will not increase or decrease, providing
    you with complete certainty for your household budgeting.


    Q: What happens to my interest rate after the two-year period ends?


    A: Once the two-year fixed term expires, your mortgage will automatically transition
    to our standard variable rate of 7.49%. At this point, your monthly payments may
    change. We recommend reviewing your financial goals at the end of the term to
    decide if another product, such as a new fixed-rate deal, would be more suitable.
    For more details, you can refer to the Wrenfield Two-Year Fixed Mortgage — overview.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
