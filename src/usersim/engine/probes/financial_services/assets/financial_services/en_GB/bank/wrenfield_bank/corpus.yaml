- id: 971a936c-da02-5098-9511-b8fbf575087b
  title: Wrenfield Easy Access Cash ISA — fraud and unauthorised-activity protection
  body: 'At Wrenfield Bank, we believe that the security of your life savings is paramount.
    When comparing our Wrenfield Easy Access Cash ISA against other market alternatives,
    it is important to understand the rigorous protections we have in place to safeguard
    your assets from fraud and unauthorised activity.


    We maintain a strict ''verify-first'' stance across all our services. This means
    we will always require full identity authentication before any state-changing
    action is performed on your account or any sensitive information is disclosed.
    This rigorous approach ensures that your funds remain secure and prevents unauthorised
    access by third parties.


    For your peace of mind, we operate under the strict authorisation of the Prudential
    Regulation Authority (PRA) and are regulated by the Financial Conduct Authority
    (FCA). This regulatory framework ensures that all our customers are treated fairly.
    Furthermore, your deposits are protected by the Financial Services Compensation
    Scheme (FSCS). Eligible deposits in your Wrenfield Easy Access Cash ISA are protected
    up to £120,000 per person. In specific circumstances involving temporary high
    balances, this protection extends up to £1.4 million.


    We are also committed to proactively supporting victims of Authorised Push Payment
    (APP) scams. If you believe you have been targeted by a scam or have noticed unusual
    activity on your account, you must report it to us immediately. Rapid reporting
    is essential for the best possible outcome in recovery efforts.


    To protect yourself, please remember that Wrenfield Bank will never ask you to
    move your money to a ''safe account'' or request your full security credentials
    via email or text message. If you receive a request that seems unusual, do not
    provide any information and notify us immediately through our verified channels.


    For more information on how we protect your funds generally, you may wish to refer
    to the Wrenfield Easy Access Cash ISA — regulatory disclosures.'
  domain: retail_banking
  product_category: cash_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 910a0989-65dc-54f0-a625-453bbf347a85
  title: Wrenfield Easy Access Cash ISA — account agreement
  body: 'This agreement sets out the binding terms and conditions governing the use
    of the Wrenfield Easy Access Cash ISA. As a support agent, please ensure the customer
    understands these obligations to maintain their account in good standing.


    1. Account Obligations: We agree to provide a tax-efficient savings vehicle with
    an annual interest rate of 2.85%. The customer is obligated to ensure that their
    total deposits across all their Cash ISAs in a single tax year do not exceed the
    statutory limit. Currently, the allowance is £20,000. Exceeding this limit may
    result in the account losing its tax-exempt status or requiring the removal of
    excess funds.


    2. Interest Application: Interest is calculated daily and credited to the account.
    The rate of 2.85% is variable, meaning we may change it in response to market
    conditions or regulatory shifts. We will provide notice of any such changes through
    our standard communication channels.


    3. Withdrawals and Access: As an ''Easy Access'' product, customers may withdraw
    funds at any time without penalty. However, we reserve the right to implement
    temporary security holds on large or unusual transactions to protect the account
    from fraud, in line with our ''verify-first'' security posture.


    4. Account Closure: A customer may close their account at any time. Upon closure,
    we will transfer the remaining balance, including accrued interest, to a nominated
    bank account. The customer must provide valid identity verification before this
    request can be processed.


    5. Regulatory Protection: This account is protected by the FSCS up to £120,000
    per person, with temporary high balances protected up to £1.4 million. This protection
    is subject to the terms of the Financial Services Compensation Scheme.


    6. Changes to Terms: We may amend these terms to reflect changes in legislation
    or bank policy. We will notify customers of any material changes with reasonable
    notice. Continued use of the account following such notice constitutes acceptance
    of the revised terms.'
  domain: retail_banking
  product_category: cash_isa
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 15d11c94-b81f-585a-8d1f-ae8c27dda023
  title: Wrenfield Easy Access Cash ISA — who it is best for and common use cases
  body: 'The Wrenfield Easy Access Cash ISA is designed for customers who seek a balance
    between tax-efficient growth and immediate liquidity. It is an ideal solution
    for those who want their savings to grow without the worry of paying income tax
    on the interest earned, while still maintaining the ability to access their funds
    whenever they are needed.


    This product is best suited for:


    - Emergency Fund Building: Because it provides a competitive interest rate of
    2.85% while remaining easy to access, it is a perfect home for an emergency fund.
    Customers can save up to the £20,000 annual allowance and know their money is
    available instantly for unexpected life events.

    - Short-to-Medium Term Goal Saving: For those saving for a holiday, a new car,
    or a home deposit, this account offers a secure environment where interest is
    protected from the taxman.


    Common Use Cases:


    - Tax-Efficient Transition: Customers who have reached the limit of their non-taxable
    savings allowances in standard accounts often move their funds here to ensure
    their returns remain tax-free.

    - Diversifying Savings: We often see customers pairing this account with our Wrenfield
    Regular Saver to combine the high-interest potential of a short-term goal account
    with the flexibility and tax-free status of a Cash ISA.


    Key Product Features:

    - Interest Rate: 2.85%

    - Annual Contribution Limit: £20,000

    - Access: Immediate withdrawal capability

    - Protection: FSCS protected up to £120,000 per person (and up to £1.4 million
    for temporary high balances)


    By choosing this account, you are opting for stability and transparency. We ensure
    that there are no hidden fees for maintaining the account, allowing you to focus
    on growing your savings with confidence.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 72cebc37-018c-5b1c-ba7e-d6e11d410ecf
  title: Wrenfield Easy Access Cash ISA — ISA allowance for the 2026/27 tax year explained
  body: 'Q: What is my current ISA allowance, and will it change soon?


    A: For the current tax year, your total ISA allowance is £20,000. This is the
    maximum amount you can deposit across all your ISAs without losing the tax-efficient
    status of the accounts.


    Q: I have heard the allowance might change in the future. Is this true?


    A: Yes, please be aware of upcoming regulatory changes. From April 2027, the cash
    ISA allowance is scheduled to change. The allowance from April 2027 will be £12,000.


    Q: Does this mean I have to withdraw money if I have already saved more than £12,000?


    A: No. The allowance applies to the amount you deposit into your ISA within a
    specific tax year. Funds already held within your Wrenfield Easy Access Cash ISA
    from previous years are not affected by changes to the annual contribution limit.


    For further details on how to manage your savings, you can refer to the Wrenfield
    Easy Access Cash ISA — overview.'
  domain: retail_banking
  product_category: cash_isa
  document_type: faq
  source_authority: official
