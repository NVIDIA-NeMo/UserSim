- id: b10b70ac-bac9-54f7-a55e-35b8a325af5e
  title: Wrenfield Rewards Credit Card — resolve a common request end-to-end
  body: 'One of the most common requests for this product is performing a balance
    transfer from another provider. Here is the end-to-end process for completing
    this request while speaking with us.


    **What you need before starting**

    You will need the account number and the name of the provider you are transferring
    the balance from, as well as the exact amount you wish to transfer. Ensure you
    have enough available credit on your Wrenfield Rewards Credit Card to cover both
    the transfer and the associated fee.


    **Step-by-step process**

    1. **Request the Balance Transfer:** Tell us that you would like to move a balance
    from another card to your Wrenfield Rewards Credit Card. Specify the amount you
    want to transfer.

    2. **Undergo Identity Verification:** Because this is a state-changing action,
    we will perform a full identity authentication. We cannot proceed with the transfer
    until your identity is fully verified according to our ''verify-first'' security
    policy.

    3. **Confirm the Transfer Fee:** We will inform you that a balance transfer fee
    of 3.49% applies to the amount being moved. You must acknowledge and accept this
    fee before we can execute the request.

    4. **Confirm the Terms:** We will confirm that the transferred amount will benefit
    from a 0% interest period for 24 months. We will also remind you that any balance
    remaining after this 24-month period will be subject to the representative APR
    of 24.9%.

    5. **Final Execution:** Once you provide final verbal consent, we will initiate
    the transfer with the other provider.


    **How you know it worked**

    The process is complete when we provide you with a confirmation reference number
    and verify that the transfer has been queued. You will see the transferred balance
    and the 3.49% fee appear on your next statement.'
  domain: cards
  product_category: credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 476492e2-b7b9-5359-8343-1747446a7502
  title: Wrenfield Rewards Credit Card — a discrepancy in your records or statement
  body: "This document assists agents in resolving customer queries regarding unexpected\
    \ charges or discrepancies on their Wrenfield Rewards Credit Card statements.\n\
    \n**Symptom**\nThe customer reports a charge they do not recognise, an amount\
    \ that differs from their receipt, or an unexpected fee appearing on their statement.\n\
    \n**Investigation Steps**\n1. **Identity Verification:** Before discussing any\
    \ specific transaction, perform a full identity authentication to ensure the security\
    \ of the account.\n2. **Verify Fee Types:** Check if the 'unexpected' charge is\
    \ actually a standard product fee:\n    - Is it a foreign transaction? If so,\
    \ the 2.99% foreign transaction fee applies.\n    - Was a balance transfer recently\
    \ performed? If so, the 3.49% balance transfer fee applies.\n3. **Check Transaction\
    \ Status:** Determine if the transaction is 'pending'. Pending transactions may\
    \ temporarily hold a different amount (common with hotels or car rentals) before\
    \ settling to the final figure.\n4. **Review Section 75 Eligibility:** If the\
    \ customer is disputing a purchase due to faulty goods or a failed service, check\
    \ if the transaction was between £100 and £30,000 to determine if Section 75 protection\
    \ applies.\n\n**Resolution and Fix**\n- **For Calculation Errors:** If a fee was\
    \ applied incorrectly, we will apply a correction to the balance immediately.\n\
    - **For Unauthorised Charges:** If the customer confirms the charge is fraudulent,\
    \ we will freeze the card and initiate the fraud recovery process.\n- **For Formal\
    \ Disputes:** If the customer wishes to formally dispute a transaction, we will\
    \ record the details and initiate our structured dispute process.\n\n**Escalation**\n\
    If the discrepancy cannot be resolved during the call, the issue must be escalated\
    \ to senior management. We aim to provide a final response for payment service\
    \ complaints within 15 business days, and other general disputes within eight\
    \ weeks."
  domain: cards
  product_category: credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
