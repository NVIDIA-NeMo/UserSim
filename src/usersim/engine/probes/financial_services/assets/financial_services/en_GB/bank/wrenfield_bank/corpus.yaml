  institution_id: wrenfield_bank
- id: 144be80f-a45a-5293-bf67-9f4a2aa4af27
  title: Wrenfield Easy Access Cash ISA — check status or history
  body: 'If you wish to review the current standing of your savings or examine your
    transaction history, please follow these steps. This process ensures you have
    full transparency regarding your balance and the interest you are earning.


    **What you will need before starting**

    To protect your assets, we require full identity authentication. Please have your
    account details ready and be prepared to answer our standard security verification
    questions.


    **Steps to check your status and history**


    1. **Request your current balance:** Ask us for the current total balance of your
    Wrenfield Easy Access Cash ISA. We will verify your identity and then provide
    the exact amount currently held in the account.


    2. **Request a transaction history:** Ask us to provide a list of recent activity.
    We will provide a chronological record of all deposits and withdrawals, including
    the dates and amounts for each transaction.


    3. **Verify interest accrual:** Ask us to confirm the total interest credited
    to your account for the current period. We will confirm the total amount paid
    and verify that the interest is being calculated at the rate of 2.85%.


    4. **Request a formal statement:** If you require a document for your records,
    ask us to generate a statement. We will confirm the statement period and notify
    you once the document has been produced and is available for your review.


    **How you know it worked**

    You will have received a verbal or written confirmation of your exact balance,
    a detailed list of your recent transactions, and a confirmation that your savings
    are growing at the agreed rate of 2.85%.


    If you notice any inconsistencies in your history, please refer to Wrenfield Easy
    Access Cash ISA — a discrepancy in your records or statement.'
