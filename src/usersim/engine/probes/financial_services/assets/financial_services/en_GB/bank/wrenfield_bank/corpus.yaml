- id: ad049804-657d-56a2-b4b0-4838641b2d96
  title: Wrenfield Two-Year Fixed Mortgage — account agreement
  body: "This agreement sets out the binding terms between Wrenfield Bank and the\
    \ borrower for the Wrenfield Two-Year Fixed Mortgage. \n\n1. Interest Rates and\
    \ Payments\nThe borrower agrees to pay interest at a fixed rate of 5.64% for the\
    \ initial two-year term. Following the expiry of this fixed period, the loan will\
    \ automatically revert to our Standard Variable Rate, which is currently 7.49%,\
    \ unless the borrower switches to a different product. The overall cost for comparison\
    \ is reflected in the APRC of 7.4%.\n\n2. Fees and Charges\nA product fee of £999\
    \ is applicable to this mortgage. This fee covers operational costs and regulatory\
    \ risk and must be paid at the point of completion unless otherwise agreed.\n\n\
    3. Overpayments and Early Repayment\nWe allow a flexible overpayment allowance\
    \ of 10% of the outstanding balance per year. Overpayments exceeding this threshold,\
    \ or the full redemption of the mortgage during the fixed term, will trigger an\
    \ Early Repayment Charge (ERC). The ERC is 3% of the balance during year one and\
    \ 2% during year two.\n\n4. Loan to Value (LTV)\nThe mortgage is granted subject\
    \ to a maximum LTV of 90%. The borrower must maintain the property's value to\
    \ ensure the loan remains within acceptable risk parameters as defined by our\
    \ affordability assessment.\n\n5. Termination\nThis agreement ends upon the full\
    \ repayment of the principal loan, accrued interest, and any outstanding fees.\
    \ We reserve the right to demand full repayment if the borrower breaches the terms\
    \ of the security or fails to maintain the property as required by the lending\
    \ criteria."
