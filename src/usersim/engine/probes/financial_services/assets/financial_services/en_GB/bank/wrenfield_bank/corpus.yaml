- id: d106294b-61b9-54c6-9488-a8c18128401b
  title: Wrenfield Two-Year Fixed Mortgage — fraud and unauthorised-activity protection
  body: 'At Wrenfield Bank, we are committed to protecting your home and your finances.
    Mortgage products can occasionally be targets for sophisticated fraud, and we
    encourage all customers—especially those comparing our offerings with other institutions—to
    be vigilant.


    Common fraud patterns targeting mortgage holders include ''deed fraud'' or identity
    theft, where unauthorised individuals attempt to alter property records or take
    out loans against your equity. You may also encounter ''payment redirection scams'',
    where fraudsters impersonate solicitors or bank officials to divert funds during
    a property transfer.


    To combat these threats, we maintain a rigorous ''verify-first'' stance. We will
    never ask you to disclose your full security credentials over the telephone or
    via email, nor will we ask you to move money to a ''safe account''. Any state-changing
    action on your mortgage, such as changing your payment details or requesting a
    redemption statement, requires full identity authentication before we can proceed.


    If you notice any unauthorised activity—such as unexpected correspondence regarding
    your property title or discrepancies in your mortgage balance—please inform us
    immediately. Rapid reporting is essential for the resolution of fraud claims.
    We proactively support victims of scams and work within the regulatory frameworks
    of the PRA and FCA to ensure you are treated fairly.


    For further guidance on general account security and the steps we take to protect
    your assets, you may wish to refer to Wrenfield Current Account — account security
    best practices.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: security_advisory
  source_authority: official
