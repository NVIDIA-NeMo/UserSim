  institution_id: wrenfield_bank
- id: fe164248-df0f-5df4-97d6-c9ced74dae8c
  title: Wrenfield Regular Saver — a failed or pending action
  body: 'If you are a prospective customer experiencing issues while attempting to
    set up your Wrenfield Regular Saver, please refer to the following guide to identify
    and resolve the problem.


    Symptom: The account application is listed as ''Pending'' or you have received
    a notification that the ''action failed''.


    Likely Causes:

    1. Identity Verification Gap: Our ''verify-first'' security policy requires full
    authentication. If the details provided do not match our records or the documents
    uploaded are unclear, the action will remain pending.

    2. Deposit Limit Breach: If you attempted to set a monthly deposit exceeding the
    maximum monthly deposit of £300, the system may block the activation.

    3. Missing Linked Account: The account cannot be activated without a valid Wrenfield
    Current Account to serve as the funding source.


    What to check in order:

    - First, review the deposit amount you requested. Ensure it is £300 or less.

    - Second, check if we have requested additional identity verification documents
    via your secure notifications.

    - Third, verify that your Wrenfield Current Account is open and active.


    How to fix it:

    - To resolve a limit issue, simply ask us to update your intended monthly deposit
    to an amount within the £300 limit.

    - To resolve a verification issue, provide the missing or updated identity documentation
    we have requested.


    When to escalate:

    If you have provided all requested documentation and your deposit amount is correct,
    but the account remains pending after three business days, we will escalate this
    to our senior management team. We will raise a priority case with our verification
    specialists and provide you with a reference number. You can expect a status update
    within 15 business days if the issue relates to a payment service, or within eight
    weeks for other general disputes.'
