- id: 36dbb80e-03e4-5afa-abee-1d1925558bfa
  title: Wrenfield Rewards Credit Card — a failed or pending action
  body: 'If you are a prospective customer and find that your application or activation
    is failing or remains in a ''pending'' state, please follow these steps to resolve
    the issue.


    Symptom: The application status is ''Pending'' or you have received a notification
    that the action could not be completed.


    Likely Causes:

    - Incomplete identity verification: Our ''verify-first'' policy requires full
    authentication before an account is opened.

    - Affordability Assessment: The application may be undergoing a more detailed
    review to ensure the lending does not cause foreseeable harm.

    - Documentation Mismatch: The provided address or ID may not match our records.


    What to check in order:

    1. Review your submitted documents: Ensure all photos of ID are clear and not
    expired.

    2. Verify contact details: Ensure your current address is entered exactly as it
    appears on your utility bills.

    3. Check for notification requests: We may have requested additional information
    via a secure channel.


    Resolution:

    Provide the missing or corrected documentation to us during the conversation.
    Once the updated information is received, we will re-trigger the verification
    process.


    Escalation:

    If the issue remains unresolved after documentation is provided, we will raise
    a formal case to our senior management team for a manual review. You will receive
    a status update within 5 business days regarding the outcome of this escalation.'
  domain: cards
  product_category: credit_card
  document_type: troubleshooting
  source_authority: official
