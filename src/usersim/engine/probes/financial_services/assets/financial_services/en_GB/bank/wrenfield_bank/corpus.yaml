- id: 07db46c4-b0e3-53a0-8a81-1b348d7b3bb5
  title: Wrenfield Personal Loan — choosing between tiers or options
  body: 'When deciding on the structure of your Wrenfield Personal Loan, the primary
    trade-off is between monthly affordability and the total cost of credit.


    **Option 1: Longer Term (e.g., 60 Months)**

    Choosing a longer term, such as the 60 months shown in our representative example,
    lowers your monthly commitment. For a loan of £10,000 at a representative APR
    of 6.9%, this results in a monthly payment of £196.56. This option is best for
    customers who value monthly cash-flow stability.


    **Option 2: Shorter Term**

    Opting for a shorter term increases the monthly payment but reduces the total
    interest you pay over the life of the loan. While the monthly cost is higher,
    the total amount payable will be less than the £11,793.60 seen in the 60-month
    example.


    **Which should you choose?**

    - Choose a **longer term** if you need to keep your monthly outgoings low and
    are comfortable paying more interest over time.

    - Choose a **shorter term** if you have a higher monthly budget and wish to clear
    your debt faster and more cheaply.


    Regardless of the term, our maximum loan amount remains £35,000. For a detailed
    look at our terms, see Wrenfield Personal Loan — account agreement.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6d09d9fc-8481-5b2c-9f81-1d2850fc29a0
  title: Wrenfield Personal Loan — privacy and data handling
  body: 'Wrenfield Bank operates under the strict authorisation of the PRA and regulation
    by the FCA. We are committed to handling your personal and financial data with
    the highest level of integrity and transparency.


    **Data Collection and Usage**

    To provide you with a Wrenfield Personal Loan, we collect personal information
    including your identity documents, employment status, and financial history. This
    data is used exclusively to perform mandatory affordability assessments and to
    ensure we comply with our regulatory obligation to treat customers fairly and
    avoid foreseeable harm.


    **Credit Referencing**

    When you apply for a loan up to our maximum amount of £35,000, we will perform
    a credit check. This involves accessing data from credit reference agencies to
    determine your representative APR, which is 6.9% for 51% of successful applicants.
    This process is essential for the stability of our lending portfolio and the protection
    of our retail customers.


    **Data Security**

    We employ a ''verify-first'' security posture. Your data is encrypted and access
    is strictly controlled. We will never disclose your account information to third
    parties without your explicit consent, unless required by law or regulatory authority.


    **Regulatory Protections**

    While FSCS protection typically applies to deposits (up to £120,000 per person),
    our lending products are governed by the Consumer Credit Act. This ensures you
    have a 14-day right to withdraw from your loan agreement and that all fees are
    transparently priced to cover operational costs and regulatory risk.


    For more information on our general risk posture, see Wrenfield Personal Loan
    — regulatory disclosures.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 290a72e0-9749-5f62-b172-9c5f227d2228
  title: Wrenfield Personal Loan — recognising scams targeting this product
  body: 'When comparing borrowing options, it is vital to remain vigilant against
    fraudulent activity. Scammers often target individuals seeking personal loans
    by posing as reputable lenders or ''loan brokers'' who promise guaranteed approval
    regardless of credit history. At Wrenfield Bank, we are committed to stability
    and transparency, and we want to ensure our customers can distinguish our legitimate
    processes from these scams.


    Common patterns to watch for include:


    1. Advance Fee Fraud: Be wary of any entity asking for an ''insurance fee'', ''processing
    fee'', or ''security deposit'' before the loan funds are released. We will never
    ask for an upfront payment to secure a loan.

    2. Pressure Tactics: Scammers often use artificial urgency, claiming a special
    rate is only available for a few hours. While we offer competitive pricing, we
    will never pressure you into a financial commitment.

    3. Unsolicited Offers: Be cautious of emails or text messages promoting loans
    with rates significantly lower than our representative APR of 6.9%. If an offer
    seems too good to be true, it usually is.


    Our security approach is based on a rigorous ''verify-first'' stance. We will
    never ask you to disclose your full password or PIN via email or text. Legitimate
    communication from us will always align with our professional and welcoming tone,
    and any state-changing action will require full identity authentication.


    If you suspect you have been targeted by a scam or have shared personal details
    with a fraudulent party, you must notify us immediately. Prompt reporting is the
    best way to secure your assets. If you have already transferred money as part
    of a scam, please let us know right away so we can provide proactive support,
    as we are dedicated to assisting victims of APP scams.


    For more information on how we protect your overall banking experience, you may
    wish to read Wrenfield Current Account — fraud and unauthorised-activity protection.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: c1191f05-cd2f-5230-8271-2078c61cc56e
  title: Wrenfield Personal Loan — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary constraints and
    regulatory boundaries for the Wrenfield Personal Loan to ensure accurate customer
    guidance.


    Financial Limits

    - Maximum Loan Amount: The absolute ceiling for any single personal loan is £35,000.
    Applications exceeding this limit cannot be processed under this product.

    - Representative Example: For standard quoting, we use a loan of £10,000 over
    a term of 60 months, which results in a monthly repayment of £196.56 and a total
    amount payable of £11,793.60, based on a representative APR of 6.9%.


    Underwriting and Restrictions

    - Affordability Assessment: All lending recommendations are subject to a strict
    affordability assessment. This is a mandatory step to ensure a high standard of
    care and to avoid foreseeable harm to the customer, in line with the Consumer
    Duty.

    - Use of Funds: Loans are intended for general retail purposes. Use of funds for
    speculative investments or gambling may be restricted based on our risk and compliance
    posture.

    - Right to Withdraw: In accordance with our commitment to fair pricing and transparency,
    all customers have a 14-day right to withdraw from their loan agreement after
    the funds have been disbursed.


    Regulatory Framework

    - Authorisation: We operate under the strict authorisation of the PRA and regulation
    by the FCA.

    - Pricing: Fees on our lending products are transparently priced to cover operational
    costs and regulatory risk, ensuring no hidden charges for the customer.


    When assisting customers, always ensure that full identity authentication is completed
    before disclosing specific account details or performing any action that changes
    the state of the loan, maintaining our ''verify-first'' security standard.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a6a74553-c3db-54ea-977f-79db9b106ec3
  title: Wrenfield Personal Loan — monthly repayment in the representative example
    explained
  body: 'Q: How is the monthly repayment calculated in your representative example?


    A: To help you understand the cost of borrowing, we provide a representative example.
    For a loan of £10,000 over a term of 60 months, the monthly repayment is £196.56.
    This figure is based on a representative APR of 6.9%.


    Q: Does everyone get this exact monthly payment?


    A: Not necessarily. The term ''representative'' means that we must be able to
    offer this rate (and therefore this monthly payment for the specified loan amount
    and term) to at least 51% of successful applicants. Your actual monthly repayment
    may vary based on your individual circumstances and the result of our affordability
    assessment.


    For more details on the overall cost of the loan, you may refer to Wrenfield Personal
    Loan — total amount payable in the representative example explained.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b0db53c2-a13b-5925-aac7-954ac49d0f51
  title: Wrenfield Personal Loan — check status or history
  body: 'If you are an existing customer, you can easily check the current status
    and payment history of your loan through our support channels.


    Before you begin, please ensure you have your account details ready and a form
    of valid government-issued identification if you are visiting a branch.


    1. Request a loan status update: Tell us that you would like to check the current
    status or payment history of your Wrenfield Personal Loan.

    2. Complete identity verification: Because we maintain a rigorous ''verify-first''
    stance, we will guide you through a full identity authentication process. This
    ensures your financial information remains secure.

    3. Review your current balance: We will provide you with the current outstanding
    balance of your loan, including any interest accrued since your last payment.

    4. Confirm payment history: We will confirm the date and amount of your last successful
    repayment and verify that all previous payments have been received on schedule.

    5. Verify remaining term: We will tell you how many months remain in your loan
    term (for example, if you are on the representative 60-month term, we will confirm
    how many of those payments are left).

    6. Confirm the next payment date: We will provide the exact date your next monthly
    repayment is due to be debited from your account.


    Once these steps are complete, you will have a comprehensive view of your loan''s
    progress and your remaining obligations to the bank.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 6f669154-e244-5543-b34b-2ff0cdbed404
  title: Wrenfield Personal Loan — a declined or blocked action
  body: 'It can be frustrating when a loan application is declined or a specific action
    on your account is blocked. Below are the most common causes and the steps we
    can take to resolve the issue.


    Symptom: You receive a notification that your loan application has been unsuccessful,
    or you are told that a request to increase your loan limit has been declined.


    Likely Causes:

    - Affordability Assessment: To prevent foreseeable harm and ensure a high standard
    of care, we perform a strict affordability assessment. If the requested loan amount
    (up to our maximum of £35,000) is deemed unsustainable based on your current income
    and outgoings, the action will be declined.

    - Identity Verification Failure: As a ''verify-first'' institution, we cannot
    proceed with any state-changing action if identity authentication is incomplete
    or inconsistent.

    - Credit Criteria: The applicant may not meet the internal criteria required to
    qualify for the representative APR of 6.9%.


    What to check in order:

    1. Documentation: Ensure all provided identity and income documents are current
    and legible.

    2. Application Accuracy: Double-check that the requested loan amount and term
    are correctly entered.

    3. Financial Details: Ensure that all income and expenditure figures provided
    for the affordability assessment are accurate and complete.


    How to fix it:

    If you believe there has been an error, you can ask us to review the application.
    We will re-verify your documentation and re-run the affordability assessment based
    on any updated information you provide.


    When to escalate:

    If you are unhappy with the outcome and the initial review does not resolve the
    issue, the matter can be escalated through our structured path to senior management.
    If a resolution is still not reached, you have the right to take your complaint
    to the Financial Ombudsman Service.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 71ca34eb-e5f4-55b0-b26f-293d4fc76c03
  title: Wrenfield Personal Loan — when to switch or upgrade
  body: "Support agents should use the following guidance to help customers determine\
    \ if switching to or upgrading a Wrenfield Personal Loan is the right move.\n\n\
    Switching for Cost Savings\nCustomers currently paying a higher interest rate\
    \ on a loan from another institution may benefit from switching to our product,\
    \ which offers a representative APR of 6.9%. This is significantly more cost-effective\
    \ than using a rewards-focused credit card for long-term borrowing, as the Wrenfield\
    \ Rewards Credit Card has a representative APR of 24.9%.\n\nUpgrading Loan Amounts\n\
    If a customer requires more capital for a significant project, they may upgrade\
    \ their borrowing if they have not yet reached our maximum loan amount of £35,000.\
    \ \n\nKey Decision Points:\n- Predictability: The Personal Loan is best for those\
    \ who want a fixed monthly cost (e.g., £196.56 for a £10,000 loan over 60 months).\n\
    - Flexibility: If the customer needs a revolving line of credit, a credit card\
    \ is the better choice.\n- Safety: Remind the customer of the 14-day right to\
    \ withdraw for any new loan agreements."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 37592027-5555-5f4d-a8da-a0b87ee2deaa
  title: Wrenfield Personal Loan — comparison vs. alternatives and when not to choose
    it
  body: 'When deciding how to fund a purchase or consolidate debt, it is important
    to choose the product that aligns with your financial goals. The Wrenfield Personal
    Loan is designed for stability and transparency.


    Comparing the Personal Loan to Alternatives


    1. Versus Credit Cards: Our personal loans generally offer a much lower cost of
    borrowing than credit cards. For example, our representative APR for personal
    loans is 6.9%, whereas the Wrenfield Rewards Credit Card carries a representative
    APR of 24.9%. If you are borrowing a large sum for a fixed period, a loan is typically
    the more economical choice.


    2. Predictability of Cost: Unlike revolving credit, a personal loan provides a
    fixed repayment schedule. In our representative example, a loan of £10,000 over
    60 months results in a consistent monthly repayment of £196.56, leading to a total
    amount payable of £11,793.60. This allows for precise budgeting.


    When NOT to choose a Wrenfield Personal Loan


    - For Small, Short-Term Spend: If you only need to borrow a small amount for a
    few weeks, a credit card may be more appropriate due to the flexibility of revolving
    payments.

    - For Variable Needs: If you do not have a specific sum in mind and need a credit
    line you can draw from as needed, this product is not the right fit, as loans
    are provided as a single lump sum up to a maximum of £35,000.

    - If You Cannot Commit to a Fixed Term: Because our loans are structured over
    a set duration (such as the 60 months in our representative example), they are
    not suited for those who require an open-ended borrowing arrangement.


    Regardless of the product you choose, we ensure all lending is subject to a strict
    affordability assessment to protect you from foreseeable financial harm.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b8b1e2f2-3208-52f3-a503-14f1a85f5545
  title: Wrenfield Personal Loan — total amount payable in the representative example
    explained
  body: 'Q: What does ''total amount payable'' mean in the loan representative example?


    A: The total amount payable is the sum of the original loan amount plus all the
    interest that will be charged over the full term of the loan. It represents the
    total cost of the credit.


    Q: What is the total amount payable for the representative example?


    A: In our representative example, if you borrow £10,000 over a term of 60 months
    at a representative APR of 6.9%, the total amount payable is £11,793.60. This
    means the total cost of borrowing for this specific example is £1,793.60 over
    the five-year period.


    Q: Will my total amount payable be different?


    A: Yes, it will likely differ based on the actual loan amount you borrow, the
    term you choose, and the APR you are offered following our affordability assessment.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 89825f98-dc9c-58a4-bfa8-a9e2869422e0
  title: Wrenfield Personal Loan — resolve a common request end-to-end
  body: 'A common request for our loan customers is the ''Early Settlement'' of their
    loan. This is the process of paying off the remaining balance of the loan before
    the original term ends.


    If you are considering this, please note that we operate with full transparency
    regarding the remaining balance and any applicable costs.


    1. Request a settlement figure: Tell us that you wish to settle your Wrenfield
    Personal Loan early. You should specify the date on which you intend to make the
    final payment.

    2. Complete identity verification: In line with our ''verify-first'' stance, we
    will perform a full identity authentication. This ensures that sensitive balance
    information is only disclosed to the account holder.

    3. Receive your settlement statement: We will provide you with a precise settlement
    figure. This figure includes the outstanding principal and any interest accrued
    up to your specified payment date.

    4. Make the final payment: Provide the funds to cover the settlement figure via
    your preferred payment method.

    5. Confirm account closure: Once the funds have been cleared, we will formally
    close the loan account and provide you with a confirmation statement showing a
    zero balance.


    By following these steps, you can clear your debt ahead of schedule. If you have
    recently taken out a loan and have changed your mind, remember that you also have
    a 14-day right to withdraw from the agreement entirely.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: cf4bdca9-0282-5cba-9153-db11451ba71f
  title: Wrenfield Personal Loan — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting customers who believe there is
    an error in their loan balance or payment history.


    Symptom: The customer claims that a monthly payment (e.g., the representative
    £196.56) was debited from their account but is not reflecting in the loan balance,
    or the remaining term appears incorrect.


    Likely Causes:

    - Processing Lag: There may be a delay between the funds leaving the customer''s
    account and the loan balance updating in our core systems.

    - Payment Misallocation: The payment may have been credited to a different account
    if the customer provided incorrect references.

    - Technical Discrepancy: A rare synchronisation error between the digital channel
    and the lending ledger.


    What to check in order:

    1. Transaction Logs: Verify the exact date and amount of the disputed payment
    in the customer''s current account or external bank statement.

    2. Loan Ledger: Check the loan account''s transaction history to see if the payment
    is listed as ''pending''.

    3. Account Details: Ensure the payment was sent to the correct loan account number.


    How to fix it:

    If the payment is found but not yet applied, we will manually trigger the update
    to the loan balance. If the payment is missing, we will initiate a payment trace.
    We aim for rapid resolution and will provide a final response for payment service
    complaints within 15 business days.


    When to escalate:

    If the discrepancy cannot be resolved through standard ledger checks, the case
    must be escalated to senior management for a formal review. If the customer remains
    dissatisfied after our final response, they should be informed of their right
    to contact the Financial Ombudsman Service.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9aedee2a-a815-5a67-bbcf-2733fa639cd3
  title: Institution-wide fees and charges
  body: 'At Wrenfield Bank, we are committed to fair pricing and financial transparency.
    We believe that essential banking should be accessible to everyone, which is why
    we do not charge a monthly account fee for the Wrenfield Current Account (£0 monthly
    fee).


    While our core current account is fee-free, other charges may apply depending
    on the products you use. Fees associated with our credit and mortgage products
    are transparently priced to ensure we cover our operational costs and necessary
    regulatory risk. These product-specific charges are designed to be straightforward
    and are detailed within each product''s respective fee schedule.


    We operate under a philosophy of stability and fairness, ensuring that no hidden
    charges are applied to your retail banking experience. For a comprehensive breakdown
    of costs associated with specific lending or savings tools, we recommend reviewing
    the individual product documentation.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 3b4dc1d3-c131-5ab4-80bd-3bbdfb9c0c25
  title: General frequently asked questions
  body: 'How can I contact Wrenfield Bank for support?

    We support our customers through our extensive branch network, via telephone banking,
    and through our digital channels. All support services are available during standard
    UK business hours.


    What happens if my issue cannot be resolved by the first point of contact?

    We employ a structured escalation path to ensure your concerns are addressed.
    Complex issues are escalated to senior management. If a resolution is still not
    reached, you have the right to take your complaint to the Financial Ombudsman
    Service.


    How does the bank ensure my account remains secure?

    We maintain a rigorous ''verify-first'' stance. We require full identity authentication
    before we perform any state-changing action on an account or disclose any private
    account information. This is essential to prevent unauthorised access and protect
    your assets.


    Where can I find more information on how to handle specific account disputes?

    To report a payment you don''t recognise, contact us in the app or by phone and we''ll
    help you dispute it.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 69f6ef6f-d95e-57ff-8ec2-ba4d9c08bb3f
  title: Regulatory notes for Current accounts and savings
  body: 'Wrenfield Bank operates under the strict authorisation of the Prudential
    Regulation Authority (PRA) and is regulated by the Financial Conduct Authority
    (FCA). This regulatory framework ensures that all our retail customers are treated
    fairly and that we maintain the stability and transparency that define our institution.


    In accordance with our commitment to the Consumer Duty, we design our current
    accounts and savings products to deliver good outcomes for customers, avoiding
    foreseeable harm and ensuring that our products provide fair value.


    Deposit Protection

    We ensure that our customers'' funds are secure. Eligible deposits held with Wrenfield
    Bank are protected by the Financial Services Compensation Scheme (FSCS). The protection
    limit is up to £120,000 per person. In specific circumstances involving temporary
    high balances, this protection can extend up to £1.4 million.


    Agent Obligations

    When discussing current accounts or savings products, agents must:

    1. Clearly state the nature of the account and any applicable restrictions (such
    as minimum opening deposits or maximum monthly contributions).

    2. Ensure that customers are aware of the FSCS protection limits to provide peace
    of mind regarding the safety of their deposits.

    3. Avoid providing individualised tax advice, as we only offer general financial
    education and product information. Customers should be directed to a qualified
    tax professional for personal tax planning.

    4. Present all regulatory disclaimers prominently and simply, avoiding opaque
    jargon that could mislead the customer.


    By adhering to these guidelines, we maintain our position as a dependable high-street
    institution and ensure full compliance with UK banking regulations.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 32f3933e-b458-529a-89bf-fb3b1b253529
  title: Regulatory notes for Cards
  body: 'The issuance and management of the Wrenfield Rewards Credit Card are governed
    by the regulations set forth by the Financial Conduct Authority (FCA) and the
    Consumer Credit Act. Our objective is to provide rewards-focused credit while
    ensuring transparent pricing and robust consumer protection.


    Section 75 Protection

    Under the Consumer Credit Act, the Wrenfield Rewards Credit Card provides Section
    75 protection. This is a critical legal protection that makes Wrenfield Bank jointly
    and severally liable with the retailer for any breach of contract or misrepresentation
    of the goods or services purchased. This protection applies to purchases with
    a value between £100 and £30,000. Agents must be able to explain this protection
    clearly to customers who are disputing a purchase within this price range.


    Transparency in Pricing

    We utilise a Representative APR to ensure customers can compare our credit products
    fairly. For the Wrenfield Rewards Credit Card, the representative APR is 24.9%.
    By definition, this means we must be able to offer this rate (or a better one)
    to at least 51% of successful applicants.


    Agent Obligations

    When assisting customers with credit card enquiries, agents must:

    1. Verify the customer''s identity fully before discussing credit limits or transaction
    history.

    2. Accurately explain the meaning of ''Representative APR'' to avoid confusion
    regarding the actual rate a customer might be assigned.

    3. Clearly outline the process for filing a Section 75 claim when a purchase between
    £100 and £30,000 is disputed due to retailer failure.

    4. Ensure that all communication remains professional and welcoming, avoiding
    technical jargon that obscures the customer''s legal rights.


    Failure to adhere to these standards may result in a breach of the Consumer Duty,
    which mandates that we act to deliver good outcomes for retail customers.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: ed072052-d884-5b73-9199-e704fa51f9bb
  title: Regulatory notes for Payments
  body: 'Payment services at Wrenfield Bank are conducted in strict accordance with
    the Payment Services Regulations and the oversight of the Financial Conduct Authority
    (FCA). We prioritise the rapid resolution of disputes and the protection of our
    customers from fraudulent activity.


    Handling Complaints and Disputes

    We are committed to a swift response time for all payment-related issues. For
    complaints specifically related to payment services, we aim to provide a final
    response within 15 business days. For all other types of disputes or general complaints,
    the final response will be provided within eight weeks.


    Fraud and Scam Protection

    We proactively support victims of Authorised Push Payment (APP) scams. We recognise
    the distress caused by these fraudulent activities and provide structured support
    to help recover lost funds where possible.


    Direct Debit Guarantee

    We fully honour the Direct Debit Guarantee. This ensures that if an error is made
    in the payment of a Direct Debit, the customer is entitled to an immediate refund
    of the amount paid. This refund is processed promptly to ensure the customer is
    not left out of pocket due to an administrative or technical error.


    Agent Obligations

    When managing payment queries, agents must:

    1. Adhere to the ''verify-first'' security stance before disclosing any payment
    details or initiating a refund.

    2. Clearly communicate the expected timelines for dispute resolution (15 business
    days for payment services, 8 weeks for others).

    3. Immediately guide victims of APP scams through the report_scam_payment process
    to initiate a reimbursement claim.

    4. Process Direct Debit Guarantee refunds immediately upon the identification
    of a valid error.

    5. Ensure that all payment actions are documented accurately to maintain a clear
    audit trail for regulatory review.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: a6ea42b1-56b9-5677-a2e5-0395bf79b844
  title: Regulatory notes for Loans and mortgages
  body: 'Lending products, including the Wrenfield Personal Loan and the Wrenfield
    Two-Year Fixed Mortgage, are provided under the regulation of the FCA and PRA.
    Our lending posture is defined by a commitment to responsible borrowing and the
    prevention of foreseeable harm to the customer.


    Affordability and Care

    All lending recommendations and approvals are subject to a strict affordability
    assessment. We do not grant credit based solely on the requested amount; instead,
    we evaluate the customer''s financial circumstances to ensure the loan is sustainable.
    This high standard of care is mandatory to avoid placing customers in financial
    distress.


    Specific Product Protections

    1. Personal Loans: To ensure transparency and customer flexibility, the Wrenfield
    Personal Loan comes with a 14-day right to withdraw. Customers may cancel the
    agreement within this window without penalty.

    2. Mortgages: For the Wrenfield Two-Year Fixed Mortgage, we maintain a maximum
    Loan to Value (LTV) of 90%. This limit is in place to manage regulatory risk and
    protect both the customer and the bank from excessive leverage.


    Advice Boundaries

    Agents must be extremely careful not to cross the line from providing product
    information to offering individualised advice. We provide general financial education
    and detailed information on our product features (such as the 5.64% fixed rate
    for our two-year mortgage). However, we do not offer individualised tax or legal
    advice. Customers seeking such guidance must be referred to a certified tax advisor
    or legal professional.


    Agent Obligations

    When handling lending enquiries, agents must:

    1. Explicitly state that any loan offer is subject to a credit check and affordability
    assessment.

    2. Inform personal loan applicants of their 14-day right to withdraw.

    3. Ensure mortgage applicants understand the LTV limit of 90% and how it affects
    their borrowing capacity.

    4. Maintain a professional and clear tone, ensuring all representative APRs (such
    as 6.9% for personal loans) are presented accurately and without misleading qualifiers.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: c22303a3-b377-51a3-9399-5d883579e4d9
  title: When to use get_account_transactions
  body: 'The `get_account_transactions` tool is used to retrieve a chronological list
    of debits and credits for a specific account. This is a read-only action and should
    be performed whenever a customer asks for their recent activity, needs to verify
    if a payment has been sent, or wishes to identify a specific transaction for a
    dispute.


    To ensure the security of customer assets and comply with our ''verify-first''
    policy, agents must follow these steps exactly:


    1. **Identity Verification**: Before calling any account-related tool, the agent
    must perform a full identity authentication of the customer using the `verify_identity`
    tool. No account information may be disclosed until this step is successfully
    completed.

    2. **Account Identification**: If the customer provides only a partial account
    number (e.g., the last four digits), the agent must first call `get_accounts`.
    This allows the agent to resolve the customer''s internal account_id from the
    provided last-4 digits.

    3. **Transaction Retrieval**: Once the account_id is confirmed, the agent calls
    the `get_account_transactions` tool. The agent should specify the required time
    frame or transaction types if requested by the customer.

    4. **Disclosure**: The agent then presents the transaction details to the customer
    in a clear, professional manner, avoiding jargon and ensuring the dates and amounts
    are read exactly as returned by the tool.


    This procedure ensures that we maintain a rigorous security posture and prevent
    unauthorised access to sensitive financial data while providing a welcoming and
    efficient service to our verified customers.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: wrenfield_bank
- id: 30e6047d-a35b-5eda-9810-0f070e08ba0b
  title: get_account_transactions tool reference
  body: 'The `get_account_transactions` tool retrieves the transaction history for
    a specific bank account. The agent performs this action by calling the tool directly
    within the conversation after the customer has been verified.


    **Signature**

    `get_account_transactions(account_id: string)`


    **Arguments**

    - `account_id`: The internal unique identifier for the customer''s account. This
    value must be obtained via the `get_accounts` tool using the customer''s provided
    account details.


    **Effect**

    Returns a list of recent transactions associated with the provided account_id,
    including dates, descriptions, and amounts (debits and credits). This is a read-only
    operation and does not modify the account state.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: wrenfield_bank
- id: ea964c0c-5409-5b80-a627-29b51bb1ff66
  title: When to use file_transaction_dispute
  body: 'The `file_transaction_dispute` tool is the authoritative mechanism for initiating
    a formal challenge to a transaction. This includes requesting a chargeback for
    debit card payments or initiating a Section 75 claim for credit card purchases.
    This is a state-changing action and must be handled with precision.


    Agents must follow these sequential steps:


    1. **Identity Verification**: The agent must first verify the customer''s identity
    using the `verify_identity` tool. No dispute can be filed without full authentication.

    2. **Account Resolution**: The agent must call `get_accounts` to resolve the customer''s
    account_id from the account details provided in the conversation.

    3. **Transaction Identification**: To ensure the correct payment is disputed,
    the agent must call `get_account_transactions` using the account_id. The agent
    and customer must agree on the exact transaction (date and amount) to be challenged.

    4. **Dispute Initiation**: The agent calls the `file_transaction_dispute` tool.
    When doing so, the agent must identify if the purchase was made via a debit card
    (triggering a chargeback) or the Wrenfield Rewards Credit Card (triggering a Section
    75 claim for purchases between £100 and £30,000).

    5. **Expectation Setting**: The agent must inform the customer of the resolution
    timelines: 15 business days for payment service complaints and up to eight weeks
    for other disputes.


    By following this structured path, we ensure that disputes are filed accurately
    and that we uphold our commitment to the Consumer Duty and fair treatment of all
    customers.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: wrenfield_bank
- id: 8a5d8d36-0868-5551-93de-cef6c5526593
  title: file_transaction_dispute tool reference
  body: 'The `file_transaction_dispute` tool is used to formally dispute a card payment.
    The agent performs this action by calling the tool directly; customers are not
    redirected to external forms for this process.


    **Signature**

    `file_transaction_dispute(account_id: string, transaction_id: string, dispute_type:
    string, reason: string)`


    **Arguments**

    - `account_id`: The internal identifier for the account (obtained via `get_accounts`).

    - `transaction_id`: The unique identifier for the specific transaction being disputed
    (obtained via `get_account_transactions`).

    - `dispute_type`: The category of dispute, either ''chargeback'' (for debit cards)
    or ''section_75'' (for credit cards).

    - `reason`: A clear, concise description of why the transaction is being disputed
    as provided by the customer.


    **Effect**

    Creates a formal dispute record and initiates the recovery process. This is a
    state-changing action that may result in a temporary credit or a formal investigation
    into the merchant.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: wrenfield_bank
- id: 1497bf54-065d-523a-821e-b2f4cc16b75f
  title: When to use freeze_card
  body: 'At Wrenfield Bank, we prioritise the security of our customers'' assets.
    The ability to immediately halt transactions on a payment card is a critical tool
    in preventing unauthorised access and mitigating the impact of fraud. We provide
    the freeze function as a flexible, reversible alternative to cancelling a card
    entirely.


    We advise using the freeze mechanism in the following scenarios:

    1. Misplaced Cards: When a customer cannot locate their card but believes it may
    still be in their home or vehicle and wishes to prevent use until it is found.

    2. Suspected Unauthorised Activity: When a customer notices a transaction they
    do not recognise and wants to stop further payments while we investigate the incident.

    3. Immediate Risk Mitigation: As an interim step while a customer is reporting
    a definitive theft or loss of their card.


    Because we maintain a rigorous ''verify-first'' stance, no card may be frozen
    until the customer''s identity is fully authenticated. Once verified, agents must
    follow these steps:


    1. Authenticate the customer using the standard verification process.

    2. Use the get_accounts tool to resolve the customer''s account identity and identify
    the specific card associated with the account they wish to secure.

    3. Confirm with the customer that they wish to temporarily freeze the card rather
    than report it as permanently lost or stolen.

    4. Execute the freeze_card tool to immediately block all further transactions
    on that specific card.

    5. Advise the customer that they can unfreeze the card through the same process
    if it is recovered, or they may request a replacement if the card is permanently
    lost.


    For further guidance on how we protect our customers from unauthorised activity,
    please refer to Wrenfield Current Account — fraud and unauthorised-activity protection.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: wrenfield_bank
- id: 8b66682f-2551-5f7f-8356-149e384c5dbe
  title: freeze_card tool reference
  body: 'The freeze_card tool allows an agent to immediately disable all transaction
    capabilities for a specific payment card. This action is reversible and does not
    permanently cancel the card or its associated account.


    The agent performs this action by calling the tool directly after the customer''s
    identity has been verified and the specific card has been identified.


    **Tool Signature and Arguments:**

    - account_id: The unique identifier for the account to which the card is linked
    (obtained via get_accounts).

    - card_id: The specific identifier for the card to be frozen.


    **Effect:**

    Upon successful execution, the card is placed in a ''frozen'' state. Any attempt
    to use the card for point-of-sale transactions, online payments, or ATM withdrawals
    will be declined. The account remains open and other payment methods (such as
    Direct Debits or bank transfers) are unaffected.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: wrenfield_bank
- id: c3201087-2a19-5c7e-b1ea-cf5d1683080c
  title: When to use initiate_account_switch
  body: 'We aim to make joining Wrenfield Bank as seamless as possible. The process
    of moving from another financial institution is managed through the Current Account
    Switch Service (CASS), which ensures a stable transition for the customer.


    Agents should use this process when a retail customer wishes to close their account
    with another provider and move their primary banking relationship to a Wrenfield
    Current Account. The primary benefits of this service are transparency and speed:
    the service moves the customer''s balance, Direct Debits, standing orders, and
    all incoming payments within seven working days.


    Additionally, we currently offer a £175 switching incentive to customers who complete
    this process, provided they meet the eligibility criteria. This commitment reflects
    our desire to welcome new customers with a fair and attractive offer.


    To initiate a switch, agents must follow these steps:


    1. Fully authenticate the customer to comply with our verify-first security stance.

    2. Use the get_accounts tool to identify the customer''s internal account identifier
    or confirm they are opening a new account.

    3. Gather the necessary details from the customer regarding their existing provider,
    including the sort code and account number of the account they wish to close.

    4. Execute the initiate_account_switch tool to trigger the CASS process.

    5. Inform the customer that the transfer of funds and payments will be completed
    within seven working days and explain the requirements for receiving the £175
    incentive.


    For more details on the incentive, see Wrenfield Current Account — current offer.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: wrenfield_bank
- id: 5d706bd5-afc1-501d-ac05-0ea982af87c9
  title: initiate_account_switch tool reference
  body: 'The initiate_account_switch tool is used to start the formal transfer of
    a customer''s banking relationship from another institution to Wrenfield Bank
    via the Current Account Switch Service (CASS).


    The agent performs this action by calling the tool directly once the customer''s
    identity is verified and the details of the external account are obtained.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the Wrenfield account receiving the funds (obtained
    via get_accounts).

    - external_sort_code: The six-digit sort code of the account being closed at the
    other institution.

    - external_account_number: The eight-digit account number of the account being
    closed at the other institution.


    **Effect:**

    This initiates the CASS protocol. The external provider is notified to move the
    remaining balance, active standing orders, and Direct Debits to the Wrenfield
    account. The process is completed within seven working days, and the external
    account is closed automatically upon completion.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: wrenfield_bank
- id: 8a847aee-eb7c-5984-8f0b-b9af2145d410
  title: When to use change_overdraft_limit
  body: 'Wrenfield Bank is committed to the Consumer Duty, ensuring we provide a high
    standard of care to avoid foreseeable harm to our customers. Consequently, any
    change to a customer''s borrowing capacity, including the adjustment of an arranged
    overdraft, must be handled with transparency and caution.


    Agents should use this procedure when a customer requests to:

    1. Apply for a new arranged overdraft facility.

    2. Increase their existing overdraft limit to accommodate changing financial needs.

    3. Reduce their limit to better manage their spending.

    4. Remove their overdraft facility entirely to avoid the risk of borrowing.


    In accordance with our risk and compliance posture, all requests to increase or
    establish a new overdraft limit are subject to a strict affordability assessment.
    We do not grant credit without ensuring the customer can sustainably manage the
    repayments.


    To process a limit change, agents must follow these steps:


    1. Authenticate the customer using our full identity verification process.

    2. Use the get_accounts tool to identify the correct account and the current limit
    in place.

    3. For requests to increase or apply for a limit, conduct the necessary affordability
    check as required by regulatory standards.

    4. Once affordability is confirmed, execute the change_overdraft_limit tool to
    apply the requested change.

    5. Confirm the new limit to the customer and provide clear information regarding
    any applicable interest rates.


    For further details on how overdraft interest is calculated, refer to Wrenfield
    Current Account — arranged overdraft interest rate (EAR, variable) explained.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: wrenfield_bank
- id: 3aa6f767-09f4-5e85-9a58-6bef956e04f5
  title: change_overdraft_limit tool reference
  body: 'The change_overdraft_limit tool is used to modify the maximum amount a customer
    can borrow via an arranged overdraft on their current account.


    The agent performs this action by calling the tool directly after identity verification
    and, where applicable, the completion of an affordability assessment.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the customer''s current account (obtained via
    get_accounts).

    - new_limit: The requested total amount of the arranged overdraft (e.g., £500).
    To remove the limit, this value is set to £0.


    **Effect:**

    Updates the account''s borrowing ceiling. If the limit is increased, the customer
    gains immediate access to additional funds up to the new limit. If decreased or
    removed, the available borrowing capacity is reduced. All changes are logged for
    regulatory compliance and the customer is notified of the update.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: wrenfield_bank
- id: 6d52761f-d1a1-5f6a-9511-b96198c6c8fe
  title: When to use report_scam_payment
  body: 'Wrenfield Bank proactively supports victims of Authorised Push Payment (APP)
    scams. We recognise that scam victims are often in a vulnerable position, and
    we aim for rapid resolution and support to help them recover their funds where
    possible.


    Agents must use this procedure when a customer reports that they have been deceived
    into making a payment to a fraudster. This is distinct from unauthorised transactions
    (where the customer did not make the payment); in APP scams, the customer is tricked
    into authorising the payment themselves.


    Because we operate under the strict authorisation of the PRA and regulation by
    the FCA, we treat these claims with urgency. Our goal is to protect the customer
    and coordinate with the receiving bank to attempt a recovery of the funds.


    To report a scam payment, agents must follow these steps:


    1. Fully authenticate the customer''s identity.

    2. Use the get_accounts tool to locate the account from which the funds were sent.

    3. Use the get_account_transactions tool to identify the specific transaction(s)
    that were part of the scam, noting the exact date and amount.

    4. Gather a detailed account of the scam from the customer, including any communications
    with the fraudster.

    5. Execute the report_scam_payment tool to formally log the incident and open
    a reimbursement claim.

    6. Advise the customer on the next steps, including the timeline for our final
    response, which we aim to provide for payment service complaints within 15 business
    days.


    For general advice on spotting scams, please see Wrenfield Current Account — recognising
    scams targeting this product.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_scam_payment
  institution_id: wrenfield_bank
- id: a5737872-fef2-5052-8fed-d51e660acb05
  title: report_scam_payment tool reference
  body: 'The report_scam_payment tool is used to formally register an Authorised Push
    Payment (APP) scam and initiate the internal reimbursement claim process.


    The agent performs this action by calling the tool directly after the customer''s
    identity is verified and the fraudulent transaction has been identified.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the account from which the funds were sent (obtained
    via get_accounts).

    - transaction_id: The unique identifier for the scam payment (obtained via get_account_transactions).

    - scam_details: A comprehensive description of the scam, including how the customer
    was contacted and the nature of the deception.


    **Effect:**

    Creates a formal scam report and triggers a claim for reimbursement. It alerts
    the fraud department to begin coordination with the receiving bank to freeze the
    funds if they are still available and starts the regulatory clock for the bank''s
    final response.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_scam_payment
  institution_id: wrenfield_bank
- id: 04b281a6-66fc-556e-bbe1-3015f002fd22
  title: When to use make_mortgage_overpayment
  body: 'Supporting our customers in managing their long-term debt is a key part of
    our service. We allow customers to make overpayments on their mortgages to help
    them reduce their total interest cost and shorten their loan term.


    Agents should use this procedure when a customer wishes to pay more than their
    scheduled monthly mortgage payment. Overpayments can be made as a one-off lump
    sum or as a regular additional payment.


    It is essential that agents provide clear information regarding the terms of the
    overpayment. Most of our products, including the Wrenfield Two-Year Fixed Mortgage,
    have a yearly overpayment allowance. Overpayments within this allowance are typically
    processed without penalty. However, if a customer exceeds this yearly limit, an
    early repayment charge may be applied. Agents must ensure the customer is aware
    of any such charges before the transaction is processed.


    To process an overpayment, agents must follow these steps:


    1. Authenticate the customer using the full identity verification process.

    2. Use the get_accounts tool to identify the specific mortgage account.

    3. Check the customer''s remaining yearly overpayment allowance and identify any
    applicable early repayment charges if the amount exceeds that limit.

    4. Confirm the exact amount to be paid and the frequency (one-off or regular)
    with the customer.

    5. Execute the make_mortgage_overpayment tool to apply the funds to the mortgage
    principal.

    6. Advise the customer how this payment affects their remaining balance and total
    term.


    For further information on mortgage costs, see Wrenfield Two-Year Fixed Mortgage
    — product fee explained.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_mortgage_overpayment
  institution_id: wrenfield_bank
- id: 4558f964-3069-56c9-ac98-e39717673ead
  title: make_mortgage_overpayment tool reference
  body: 'The make_mortgage_overpayment tool is used to apply additional funds to a
    mortgage balance beyond the standard contractual monthly payments.


    The agent performs this action by calling the tool directly after identity verification
    and a review of the customer''s overpayment allowance.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the mortgage account (obtained via get_accounts).

    - amount: The specific sum of money to be paid as an overpayment (e.g., £5,000).

    - frequency: Whether the payment is ''one-off'' or ''regular''.


    **Effect:**

    Reduces the principal balance of the mortgage. The tool automatically checks for
    any early repayment charges based on the yearly allowance. If a charge is applicable,
    it will be displayed to the agent to be communicated to the customer before the
    transaction is finalised. The overpayment is applied immediately to the outstanding
    balance.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_mortgage_overpayment
  institution_id: wrenfield_bank
- id: 1df0acac-c20f-5ece-a635-b814ec18f582
  title: When to use request_product_transfer
  body: 'At Wrenfield Bank, we strive to provide our mortgage customers with a seamless
    transition between lending products to ensure continued stability in their home
    financing. The request_product_transfer tool is the authoritative mechanism for
    moving an existing mortgage from its current deal onto a new fixed or tracker
    deal. This process is specifically designed for customers whose current deal is
    coming to an end, allowing them to secure a new rate without the need to undergo
    a full new mortgage application process.


    To ensure the security of our customers'' assets and adhere to our ''verify-first''
    stance, agents must follow these steps:


    1. Perform a full identity authentication of the customer using the verify_identity
    tool before discussing account details or initiating any state-changing action.

    2. Use the get_accounts tool to resolve the customer''s account_id based on the
    last four digits of the account provided by the customer.

    3. Confirm the details of the current mortgage deal and verify that the existing
    term is reaching its end. This ensures the customer is eligible for a product
    transfer rather than requiring a remortgage.

    4. Discuss available product options with the customer. If they are considering
    a product like the Wrenfield Two-Year Fixed Mortgage, ensure they understand the
    terms and conditions associated with the new rate.

    5. Once the customer has selected their preferred deal and consented to the transfer,
    call the request_product_transfer tool to execute the change.


    This procedure avoids the administrative burden of a new application and provides
    a streamlined experience for our retail customers. Please note that while we provide
    general product information, we do not offer individualised legal or tax advice
    regarding mortgage structures. For a comprehensive overview of our mortgage offerings,
    agents may refer to Wrenfield Two-Year Fixed Mortgage — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_product_transfer
  institution_id: wrenfield_bank
- id: 76a23c46-6c52-545c-aa31-c75edeb04181
  title: request_product_transfer tool reference
  body: 'The request_product_transfer tool is used to move an existing mortgage onto
    a new fixed or tracker deal when the current deal ends. This action is performed
    by the agent calling the tool directly within the conversation; the customer is
    not redirected to an external portal.


    **Tool Signature and Arguments:**

    - account_id: The unique identifier for the mortgage account (obtained via get_accounts).

    - target_product_id: The identifier of the new mortgage product the customer is
    transferring to (e.g., ''two_year_fixed_mortgage'').


    **Effect:**

    The tool updates the mortgage account''s product type and interest rate to match
    the target product. Because this is a product transfer, it does not trigger a
    full new mortgage application, providing a streamlined transition for the customer
    while maintaining the existing loan structure.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_product_transfer
  institution_id: wrenfield_bank
- id: ab30adfe-cbf9-57a4-a8ea-7244d9ffa355
  title: When to use apply_loan
  body: 'We provide the Wrenfield Personal Loan as a transparent borrowing solution
    for our retail customers. The apply_loan tool is used to initiate a formal application
    for this product. In accordance with our commitment to the Consumer Duty and our
    risk and compliance posture, every lending recommendation must be subject to a
    strict affordability assessment to ensure a high standard of care and avoid foreseeable
    harm to the customer.


    Agents must follow this structured sequence to process a loan application:


    1. Authenticate the customer''s identity using the verify_identity tool to ensure
    all subsequent data gathering and credit checks are performed on the correct individual.

    2. Gather the necessary application details from the customer: the requested loan
    amount, the desired term of the loan, and the specific purpose of the borrowing.

    3. Conduct a general affordability discussion. While the tool triggers a formal
    credit check, agents must ensure the customer''s stated needs align with a sustainable
    repayment plan.

    4. Inform the customer that a credit check will follow the submission of the application
    and that the Wrenfield Personal Loan carries a representative APR of 6.9%.

    5. Remind the customer of their 14-day right to withdraw from the agreement should
    they change their mind after the loan is granted.

    6. Execute the apply_loan tool using the gathered personal and loan details to
    submit the application for underwriting.


    This process ensures that we maintain our regulatory obligations under the PRA
    and FCA. For more details on the specific terms of this product, please see Wrenfield
    Personal Loan — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: wrenfield_bank
- id: 2f83e608-3027-5b82-99a8-687c272f0187
  title: apply_loan tool reference
  body: 'The apply_loan tool submits a formal application for a personal loan. The
    agent performs this action by calling the tool directly in the conversation after
    gathering all required information from the customer.


    **Tool Signature and Arguments:**

    - full_name: The customer''s full legal name as stated in the conversation.

    - date_of_birth: The customer''s date of birth.

    - contact_details: The customer''s current phone number and email address.

    - loan_amount: The total sum the customer wishes to borrow (e.g., £5,000).

    - loan_term: The duration of the loan in months.

    - purpose: The reason for the loan (e.g., ''home improvements'').


    **Effect:**

    The tool initiates the loan application process and triggers a mandatory credit
    check to determine eligibility and the final APR offered to the customer.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: wrenfield_bank
- id: 52124bd7-73c5-53b3-8316-8070671d6d77
  title: When to use update_beneficiary
  body: 'To maintain the security of our assets and prevent unauthorised access, Wrenfield
    Bank employs a rigorous ''verify-first'' stance regarding the management of payees.
    The update_beneficiary tool is the only authoritative method for agents to add,
    change, or delete a payee (beneficiary) on a customer''s Wrenfield Current Account.


    Agents must follow these steps precisely to update account beneficiaries:


    1. Complete a full identity authentication of the customer using the verify_identity
    tool. No beneficiary details may be disclosed or altered until identity is confirmed.

    2. Use the get_accounts tool to identify the correct account_id for the customer''s
    Wrenfield Current Account.

    3. Clearly identify the action the customer wishes to take: adding a new payee,
    amending the details of an existing payee, or removing a payee entirely.

    4. For additions or changes, collect the required details for the beneficiary:
    the full name, the sort code, and the account number. Ensure these are recorded
    exactly as provided by the customer.

    5. Confirm the details back to the customer to ensure accuracy and avoid payment
    errors.

    6. Call the update_beneficiary tool to apply the changes to the account.


    By following this structured path, we ensure that our customers'' funds are transferred
    only to intended recipients and that we comply with our internal security protocols.
    For further information on account management, agents can refer to Wrenfield Current
    Account — make a change or update.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: wrenfield_bank
- id: a74b1ea6-4396-5b8a-92ef-0520873e7a88
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool is used to manage payees on a Wrenfield Current
    Account. The agent calls this tool directly to modify the account''s beneficiary
    list; the customer is not asked to use a digital portal for this action.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the current account (obtained via get_accounts).

    - action: The specific operation to perform (''add'', ''change'', or ''delete'').

    - payee_name: The full name of the person or organisation being added or modified.

    - sort_code: The six-digit sort code of the beneficiary account.

    - account_number: The eight-digit account number of the beneficiary account.


    **Effect:**

    The tool modifies the list of authorised payees for the specified account. If
    the action is ''delete'', the payee is removed from the record. If ''add'' or
    ''change'', the specified payment details are stored for future transfers.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: wrenfield_bank
- id: 633018d8-8dd7-53cf-87c6-6a80d4ee3357
  title: When to use stop_payment
  body: 'Wrenfield Bank provides a dependable service for managing outgoing payments,
    ensuring customers have control over their funds. The stop_payment tool is used
    to cancel a Direct Debit, a standing order, or to stop a cheque that has been
    issued but not yet cashed.


    To process a payment cancellation, agents must adhere to the following procedure:


    1. Verify the customer''s identity using the verify_identity tool. This is a mandatory
    state-changing action that requires full authentication.

    2. Use the get_accounts tool to retrieve the account_id associated with the payment
    in question.

    3. Identify the specific payment type the customer wishes to stop. Agents must
    distinguish between a Direct Debit, a standing order, and a cheque, as the operational
    handling differs.

    4. Gather the necessary reference details for the payment. This may include the
    payee name, the amount, and the date the payment was scheduled or issued.

    5. Inform the customer that while we honour the Direct Debit Guarantee for immediate
    refunds of errors, stopping a future payment is a request to prevent the transaction
    from occurring.

    6. Call the stop_payment tool to cancel the instruction.


    If a customer is requesting a refund for an error via the Direct Debit Guarantee,
    this should be handled as a dispute. For guidance on payment errors and refunds,
    agents should refer to Regulatory notes for Payments.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: wrenfield_bank
- id: 912b9c64-2736-559f-9c93-ee1148b17cac
  title: stop_payment tool reference
  body: 'The stop_payment tool is used to cancel specific payment instructions from
    a customer''s account. The agent executes this action by calling the tool directly
    during the conversation.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the account from which the payment is being stopped
    (obtained via get_accounts).

    - payment_type: The category of payment to be cancelled (''direct_debit'', ''standing_order'',
    or ''cheque'').

    - payment_reference: The unique reference or specific details (such as payee and
    amount) used to identify the transaction.


    **Effect:**

    The tool instructs the core banking system to block the specified payment. For
    Direct Debits and standing orders, this prevents future scheduled withdrawals.
    For cheques, it places a stop on the cheque number to prevent it from being cleared
    upon presentation.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: wrenfield_bank
- id: f7fb9865-3c34-558f-b11e-f41b87f708a7
  title: When to use pay_bill
  body: 'We offer our retail customers a straightforward way to settle their obligations
    through our telephone and digital channels. The pay_bill tool allows agents to
    execute a bank transfer to pay a bill using the specific payment details provided
    on the customer''s invoice.


    To execute a bill payment, agents must follow this sequence:


    1. Perform full identity authentication via the verify_identity tool to ensure
    the agent is authorised to move funds from the customer''s account.

    2. Use the get_accounts tool to resolve the customer''s account_id for the source
    of the funds (typically the Wrenfield Current Account).

    3. Collect the precise payment details from the customer as they appear on the
    bill: the recipient''s sort code, the recipient''s account number, and the bill
    reference.

    4. Confirm the exact amount to be transferred and the reference string to ensure
    the bill is correctly attributed by the recipient.

    5. Verify that the account has sufficient cleared funds to cover the payment to
    avoid any unexpected charges or failed transactions.

    6. Call the pay_bill tool to complete the transfer.


    This process provides a welcoming and clear service for customers who prefer agent-assisted
    payments. For details on the fee-free nature of our daily banking hub, agents
    can refer to Wrenfield Current Account — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: wrenfield_bank
- id: bb8d5839-89a6-565c-95d9-bb4a1fafb34c
  title: pay_bill tool reference
  body: 'The pay_bill tool is used to make a bank transfer for the purpose of paying
    a bill. The agent performs this action by calling the tool directly; there is
    no requirement for the customer to use an external app or website.


    **Tool Signature and Arguments:**

    - account_id: The identifier for the account from which funds are being withdrawn
    (obtained via get_accounts).

    - sort_code: The six-digit sort code of the bill payee.

    - account_number: The eight-digit account number of the bill payee.

    - reference: The payment reference provided on the bill to ensure correct allocation.

    - amount: The total sum to be transferred (e.g., £45.50).


    **Effect:**

    The tool executes an immediate transfer of the specified amount from the customer''s
    account to the designated payee. The transaction is recorded in the customer''s
    account history with the provided reference.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: wrenfield_bank
- id: 71f46b90-c6b4-5eee-a411-5286884d1e7b
  title: When to use manage_authorized_users
  body: 'At Wrenfield Bank, we believe in providing flexible yet secure access to
    our customers'' funds. We use the manage_authorized_users tool when a customer
    needs to legally designate another person to act on their behalf or when an existing
    third-party arrangement must be terminated. This process is critical for maintaining
    the security of assets and ensuring that we only disclose information or execute
    state-changing actions for verified, authorised individuals.


    This procedure should be used in the following scenarios:

    1. Registering a legal Power of Attorney (PoA), ensuring the customer''s financial
    affairs are managed by a trusted representative.

    2. Adding a third-party mandate, which allows another person (such as a spouse
    or family member) to perform specific operations on the account.

    3. Removing an existing mandate or PoA when the arrangement is no longer required
    or the representative''s authority has ended.


    To complete this action, the agent must follow these steps:


    1. Perform a full identity authentication of the customer using the verify_identity
    tool. We maintain a rigorous ''verify-first'' stance to prevent unauthorised access.

    2. Use the get_accounts tool to identify the specific account(s) to which the
    authorisation will apply. If the customer provides only the last few digits of
    an account number, get_accounts must be used to resolve the full account_id.

    3. Collect the full details of the person being added or removed. This includes
    their full name, date of birth, and current contact information. We do not use
    internal IDs for new nominees; we rely on the details provided by the customer.

    4. Confirm the type of authorisation being established (e.g., Power of Attorney
    or Third-Party Mandate) and ensure the relevant legal documentation has been presented
    or verified via our standard compliance checks.

    5. Call the manage_authorized_users tool to execute the change in the system.


    Once the tool has been successfully called, the agent should confirm the change
    to the customer and advise them that the updated authorisation is now active across
    our branch network, telephone banking, and digital channels.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: wrenfield_bank
- id: 3b89d8aa-5b68-5320-b0ca-8fe0f63e87d0
  title: manage_authorized_users tool reference
  body: 'The manage_authorized_users tool is used by agents to register or remove
    legal access to a customer''s account for a third party. The agent performs this
    action by calling the tool directly after the primary account holder has been
    verified.


    **Tool Signature:**

    `manage_authorized_users(account_id, action, person_details, document_type)`


    **Arguments:**

    - `account_id`: The unique identifier for the account, obtained via the get_accounts
    tool.

    - `action`: The operation to perform. Valid values are ''add'' (to grant access)
    or ''remove'' (to revoke access).

    - `person_details`: The full identity details of the third party, including full
    name, date of birth, and contact information, as provided by the customer.

    - `document_type`: The legal basis for the authorisation. Valid values include
    ''Power of Attorney'' or ''Third-Party Mandate''.


    **Effect:**

    Updates the account''s authorisation records. When ''add'' is used, the specified
    person is granted the authority defined by the document_type. When ''remove''
    is used, all access for that specific individual is revoked immediately.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: wrenfield_bank
- id: 2e1cee38-455c-521e-a13d-49237dbd76b9
  title: When to use get_accounts
  body: 'The get_accounts tool is a fundamental read-only utility used to retrieve
    a comprehensive list of all banking products held by a customer at Wrenfield Bank.
    Because we operate with a strict ''verify-first'' security posture, this tool
    must only be used after the agent has successfully authenticated the customer''s
    identity.


    We use this tool in several primary contexts:

    1. **Account Identification:** When a customer refers to an account by a nickname
    (e.g., ''my savings'') or by the last four digits of the account number, the agent
    uses get_accounts to resolve these references into the precise account_id required
    by other state-changing tools.

    2. **Portfolio Overview:** When a customer asks for a summary of their relationship
    with us, such as wanting to know which of our products they currently hold (e.g.,
    whether they have a Wrenfield Current Account and a Wrenfield Everyday Saver).

    3. **Verification of Product Ownership:** Before applying for a product transfer
    or a loan, the agent uses get_accounts to confirm the customer''s existing product
    holdings and eligibility.


    To retrieve account information, the agent must follow these steps:


    1. Authenticate the customer using the verify_identity tool. No account information
    may be disclosed or retrieved until this step is complete.

    2. Call the get_accounts tool. This will return a list of all active and dormant
    accounts associated with the verified customer profile.

    3. Review the returned list to match the account_id with the customer''s request.
    If the customer is unsure which account they are referring to, the agent should
    provide the display names of the accounts found to help the customer identify
    the correct one.


    This tool provides the necessary foundation for almost all other customer service
    actions, as most subsequent tools require a specific account_id to function correctly.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: wrenfield_bank
- id: 27691c9b-826e-5fe0-8b7f-8645ea00bd3d
  title: get_accounts tool reference
  body: 'The get_accounts tool allows agents to retrieve a complete list of all accounts
    held by the currently authenticated customer. The agent performs this action by
    calling the tool directly during the conversation.


    **Tool Signature:**

    `get_accounts()`


    **Arguments:**

    This tool takes no arguments. It automatically retrieves the accounts associated
    with the identity of the customer who has been successfully verified via the verify_identity
    tool.


    **Effect:**

    Returns a list of all accounts linked to the customer profile. Each entry in the
    list typically includes the account_id, the product type (e.g., current_account,
    everyday_saver), the current balance, and the account status (e.g., ''active''
    or ''closed''). This information is used by agents to resolve account identifiers
    for subsequent tool calls.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: wrenfield_bank
- id: 96758dc9-5e96-5fbb-b3d0-fe59d7cc26b6
  title: When to use open_account
  body: 'Wrenfield Bank strives to make essential banking accessible. We use the open_account
    tool when a customer wishes to establish a new financial relationship with us
    or add a new product to their existing portfolio. This procedure ensures that
    all new accounts are opened with the correct product specifications and that the
    customer meets the necessary eligibility requirements.


    This process applies to all our retail products, including the Wrenfield Current
    Account, the Wrenfield Everyday Saver (which requires a £0 monthly account fee
    and only a £1 minimum opening deposit), and the Wrenfield Regular Saver.


    To open a new account, the agent must follow these steps:


    1. Perform full identity authentication using the verify_identity tool. If the
    customer is a new client, the agent must collect and verify their full legal name,
    date of birth, and residential address.

    2. Identify the specific product the customer wishes to open. The agent should
    provide general financial education on the product''s features (e.g., the £175
    switching incentive for the Wrenfield Current Account) to ensure the product meets
    the customer''s needs.

    3. For lending products or specific savers, the agent must confirm the customer''s
    eligibility. For loans, this includes a strict affordability assessment to avoid
    foreseeable harm.

    4. Collect any necessary opening details. For a Wrenfield Everyday Saver, this
    includes confirming the initial deposit of at least £1.

    5. Call the open_account tool, specifying the product_id and the customer''s verified
    details.


    After the tool is executed, the agent must inform the customer of the next steps,
    such as how to activate the account or when they can expect their debit card to
    arrive. If the customer is switching from another institution, the agent should
    then move to the process described in the initiate_account_switch tool sequence.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: wrenfield_bank
- id: 76aba49b-b7f4-5182-83c1-09ed20018776
  title: open_account tool reference
  body: 'The open_account tool is used by agents to create a new bank account for
    a customer. The agent performs this action by calling the tool directly after
    the customer''s identity has been verified and their eligibility confirmed.


    **Tool Signature:**

    `open_account(product_id, customer_details)`


    **Arguments:**

    - `product_id`: The identifier for the product to be opened. Examples include
    ''current_account'' for the Wrenfield Current Account or ''everyday_saver'' for
    the Wrenfield Everyday Saver.

    - `customer_details`: A comprehensive set of the customer''s personal information,
    including full legal name, date of birth, residential address, and contact details,
    as provided during the verification process.


    **Effect:**

    Creates a new account record in the bank''s core system. The tool returns the
    new account_id and the date of opening. The account is then subject to the standard
    terms and conditions of the chosen product.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: wrenfield_bank
- id: cb8f6dea-2bd8-52cd-b1f8-e75adfaf1e48
  title: When to use close_account
  body: "We respect our customers' right to manage their financial relationships as\
    \ they see fit. We use the close_account tool when a customer explicitly requests\
    \ to terminate a specific account. Because closing an account is an irreversible\
    \ action, we follow a strict procedure to ensure no funds are lost and all obligations\
    \ are met.\n\nClosing an account may be requested for any of our products, including\
    \ the Wrenfield Current Account, savings accounts, or ISAs. \n\nTo close an account,\
    \ the agent must follow these steps:\n\n1. Authenticate the customer using the\
    \ verify_identity tool to prevent unauthorised account closures.\n2. Use the get_accounts\
    \ tool to identify the correct account_id. If the customer provides a partial\
    \ account number, the agent must use this tool to resolve it to the full identifier.\n\
    3. Verify the current balance of the account. If the account contains a positive\
    \ balance, the agent must facilitate the transfer of funds to another nominated\
    \ account using the transfer_funds tool or issue a final payment.\n4. If the account\
    \ is a credit or loan product, the agent must ensure the balance is £0 and all\
    \ interest has been settled before proceeding.\n5. Confirm with the customer that\
    \ they understand the action is irreversible and that any associated services\
    \ (such as Direct Debits or standing orders on a Wrenfield Current Account) will\
    \ be terminated.\n6. Call the close_account tool using the verified account_id.\n\
    \nOnce the account is closed, the agent should provide the customer with a final\
    \ confirmation. If the customer is closing their account to move to another provider,\
    \ the agent should check if they would prefer to use the Current Account Switch\
    \ Service via the initiate_account_switch tool for a more streamlined transition."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: wrenfield_bank
- id: bceba992-c7e6-57f0-9263-cc105a2987c8
  title: close_account tool reference
  body: 'The close_account tool is used by agents to permanently terminate a customer''s
    account. The agent performs this action by calling the tool directly. This is
    an irreversible operation.


    **Tool Signature:**

    `close_account(account_id)`


    **Arguments:**

    - `account_id`: The unique identifier of the account to be closed, which must
    be resolved using the get_accounts tool prior to calling this tool.


    **Effect:**

    Immediately changes the status of the specified account to ''closed''. This prevents
    any further transactions from being processed against the account. Any remaining
    balance must be handled before this tool is called to ensure a clean closure.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: wrenfield_bank
- id: f0f3b922-de92-5bb4-a501-974fbe01565a
  title: When to use update_contact_info
  body: 'Maintaining accurate customer records is essential for security, regulatory
    compliance, and the delivery of essential banking services. We use the update_contact_info
    tool whenever a customer notifies us of a change to their personal details, such
    as a new home address, a new telephone number, or a change in email address.


    Accurate contact information is particularly vital for our ''verify-first'' security
    stance, as it ensures that security alerts and regulatory disclosures are sent
    to the correct destination. It also ensures that customers receive their statements
    and legal notices without delay.


    To update a customer''s contact information, the agent must follow these steps:


    1. Perform full identity authentication using the verify_identity tool. We will
    not change sensitive account details without first confirming the customer''s
    identity.

    2. Confirm which specific pieces of information need updating. The agent should
    ask the customer to state the new details clearly (e.g., the full new residential
    address, including the postcode).

    3. Verify the new information where possible. For address changes, we may require
    documentation if the change is for a high-value account or a mortgage product,
    such as the Wrenfield Two-Year Fixed Mortgage.

    4. Call the update_contact_info tool, passing the updated details. The tool updates
    the central customer profile, which applies across all the customer''s accounts
    (e.g., both their Wrenfield Current Account and any savings accounts).

    5. Confirm to the customer that their records have been updated and advise them
    that they will receive a confirmation notice via their previously registered contact
    method for security purposes.


    If the customer is updating their details as part of a broader account change,
    the agent should ensure all other relevant updates are handled in the same session
    to provide a streamlined experience.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: wrenfield_bank
- id: 77bc46b6-537c-5f4c-9614-da8dd1d134cf
  title: update_contact_info tool reference
  body: "The update_contact_info tool is used by agents to modify the personal contact\
    \ details of a verified customer. The agent performs this action by calling the\
    \ tool directly.\n\n**Tool Signature:**\n`update_contact_info(customer_details)`\n\
    \n**Arguments:**\n- `customer_details`: A set of updated contact fields. The agent\
    \ should only provide the fields that are changing. This can include:\n    - `full_address`:\
    \ The new residential address including postcode.\n    - `phone_number`: The new\
    \ primary telephone contact.\n    - `email_address`: The new primary email address.\n\
    \n**Effect:**\nUpdates the primary customer record in the bank's database. Because\
    \ this is a profile-level change, the updated information is automatically reflected\
    \ across all products held by the customer, ensuring consistency across their\
    \ entire banking relationship with Wrenfield Bank."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: wrenfield_bank
- id: a35fb928-cfc3-544b-a2ba-6552994c2c85
  title: When to use get_statements
  body: 'At Wrenfield Bank, we are committed to transparency and ensuring our customers
    have clear, accessible records of their financial activity. We provide account
    statements to help customers track their spending, provide proof of funds for
    lending applications, or reconcile their accounts for tax purposes. Agents should
    use the get_statements tool when a customer requests a formal record of transactions
    for a specific period.


    To ensure the security of our customers'' assets and prevent unauthorised access,
    agents must follow this structured procedure:


    1.  **Verify Identity**: Before discussing any account details or generating documents,
    perform a full identity authentication using the verify_identity tool. We maintain
    a rigorous ''verify-first'' stance for all state-changing actions and disclosures.

    2.  **Identify the Account**: Use the get_accounts tool to retrieve the list of
    accounts associated with the verified customer. If the customer provides only
    the last four digits of their account number, use the output of get_accounts to
    resolve the full account_id.

    3.  **Confirm the Period**: Ask the customer for the specific date range or the
    month and year of the statement they require. Ensure the request is clear to avoid
    generating unnecessary documentation.

    4.  **Generate Statement**: Once the account_id and the statement_period are confirmed,
    call the get_statements tool. The agent performs this action directly within the
    conversation to provide the requested data to the customer.


    This process applies to all our retail products, including the Wrenfield Current
    Account and our various savings options. If a customer reports a discrepancy in
    the statement they receive, refer them to the appropriate troubleshooting guidance,
    such as Wrenfield Current Account — a discrepancy in your records or statement.


    By following these steps, we ensure that sensitive financial data is only disclosed
    to the rightful account holder, upholding our commitment to the Consumer Duty
    and regulatory requirements set by the FCA.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: wrenfield_bank
- id: 32853616-ec19-53b6-b388-7d67d552f1f5
  title: get_statements tool reference
  body: 'The get_statements tool is used by agents to retrieve formal account statements
    for a customer. The agent performs this action by calling the tool directly during
    the interaction once the customer''s identity has been verified.


    **Signature**

    `get_statements(account_id, statement_period)`


    **Arguments**

    *   `account_id`: The unique internal identifier for the account. This must be
    obtained by the agent using the get_accounts tool based on the customer''s provided
    account details.

    *   `statement_period`: The specific time frame for which the statement is required
    (e.g., ''January 2024'' or ''2023-01-01 to 2023-06-30''). This value is provided
    by the customer during the conversation.


    **Effect**

    The tool retrieves the official transaction history and balance summary for the
    specified account and period. The output is then presented to the customer as
    a record of their banking activity.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: wrenfield_bank
- id: 69fbc362-383e-52a3-8887-3c7818dc819c
  title: When to use set_alerts
  body: "We believe that empowering our customers to monitor their finances in real-time\
    \ is a key part of our commitment to fair treatment and the Consumer Duty. The\
    \ set_alerts tool allows customers to stay informed about their account activity,\
    \ helping them avoid unexpected charges, such as overdraft interest, and providing\
    \ an extra layer of security against fraudulent activity.\n\nAgents should guide\
    \ customers to set up alerts if they express a desire for better balance management\
    \ or if they wish to be notified of large outgoing payments. To implement these\
    \ alerts, agents must adhere to the following steps:\n\n1.  **Verify Identity**:\
    \ In line with our 'verify-first' security posture, the agent must first authenticate\
    \ the customer using the verify_identity tool. No alerts can be configured until\
    \ the identity of the account holder is fully confirmed.\n2.  **Resolve Account\
    \ ID**: Call the get_accounts tool to identify the correct account_id for the\
    \ product the customer wishes to monitor, such as the Wrenfield Current Account\
    \ or a Wrenfield Everyday Saver.\n3.  **Define Alert Parameters**: Discuss with\
    \ the customer what they wish to monitor. This typically includes:\n    *   **Balance\
    \ Thresholds**: Notification when a balance drops below a certain amount.\n  \
    \  *   **Transaction Limits**: Notification when a single transaction exceeds\
    \ a specific value.\n4.  **Configure Alert**: Once the alert_type and trigger_value\
    \ are agreed upon, call the set_alerts tool to activate the notification.\n\n\
    By proactively offering this service, we help our customers maintain financial\
    \ stability and reduce the likelihood of foreseeable harm. For further details\
    \ on the types of alerts available and their technical implementation, see the\
    \ get_statements tool reference."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: wrenfield_bank
- id: 4b0a3e5c-15c2-5f88-98f2-4c2c8d789c1a
  title: set_alerts tool reference
  body: 'The set_alerts tool is used by agents to configure automated notifications
    for a customer''s account. The agent performs this action by calling the tool
    directly after completing identity verification.


    **Signature**

    `set_alerts(account_id, alert_type, trigger_value)`


    **Arguments**

    *   `account_id`: The unique internal identifier for the account, retrieved by
    the agent via the get_accounts tool.

    *   `alert_type`: The category of alert the customer wishes to receive (e.g.,
    ''low_balance'', ''high_transaction''). This is determined through conversation
    with the customer.

    *   `trigger_value`: The specific numerical threshold that will trigger the alert
    (e.g., ''£100.00''). This value is stated by the customer.


    **Effect**

    The tool creates a monitoring rule on the specified account. When the account
    activity meets the trigger_value for the chosen alert_type, a notification is
    sent to the customer via their preferred digital channel.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: wrenfield_bank
- id: 5d2cc567-c743-500f-bc9e-17312565c185
  title: When to use transfer_funds
  body: 'Wrenfield Bank provides a streamlined way for customers to manage their money
    across their various accounts. Whether a customer is moving funds from their Wrenfield
    Current Account into a Wrenfield Everyday Saver to earn interest, or transferring
    a lump sum into a Wrenfield Regular Saver, the transfer_funds tool is the authoritative
    mechanism for these movements.


    To maintain the security of assets and ensure all transactions are authorised,
    agents must follow this procedure:


    1.  **Verify Identity**: The agent must start by calling the verify_identity tool.
    We do not perform fund transfers without full identity authentication to prevent
    unauthorised access and potential fraud.

    2.  **Identify Source and Destination**: Use the get_accounts tool to retrieve
    the account_ids for both the source account (where the money is coming from) and
    the destination account (where the money is going). This is critical to ensure
    funds are moved between the correct products.

    3.  **Confirm Transfer Details**: Confirm the exact amount to be transferred and
    the currency (typically GBP). Ensure the customer is aware of any potential limits
    associated with the destination product, such as the £300 maximum monthly deposit
    for the Wrenfield Regular Saver.

    4.  **Execute Transfer**: Call the transfer_funds tool using the resolved account
    identifiers and the confirmed amount. The agent completes the transfer directly
    within the conversation.


    If the customer is attempting to move funds to an external institution, they should
    be guided towards the payment process or, if they are moving their entire relationship,
    the initiate_account_switch process. For internal movements, this transfer policy
    is the standard operating procedure. For technical details on the tool''s operation,
    refer to the transfer_funds tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: wrenfield_bank
- id: e40e7c75-a044-5a91-b96d-dd8ebf1d5218
  title: transfer_funds tool reference
  body: 'The transfer_funds tool allows agents to move money between two accounts
    held by the customer at Wrenfield Bank. The agent executes this transfer by calling
    the tool directly after identity verification.


    **Signature**

    `transfer_funds(source_account_id, destination_account_id, amount, currency)`


    **Arguments**

    *   `source_account_id`: The internal identifier for the account from which funds
    are withdrawn, obtained via get_accounts.

    *   `destination_account_id`: The internal identifier for the account receiving
    the funds, obtained via get_accounts.

    *   `amount`: The exact sum of money to be transferred (e.g., ''£50.00''). This
    is provided by the customer.

    *   `currency`: The currency of the transfer (e.g., ''GBP'').


    **Effect**

    The tool deducts the specified amount from the source account and credits it to
    the destination account instantaneously. Both accounts are updated in real-time.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: wrenfield_bank
- id: 503c4158-9048-5e63-8cf7-547dfb0df9b6
  title: When to use order_replacement_card
  body: "Ensuring our customers have uninterrupted access to their funds is a priority\
    \ for Wrenfield Bank. We provide replacement cards for those that have been lost,\
    \ stolen, or have become physically damaged over time. The order_replacement_card\
    \ tool is used to initiate the delivery of a new physical card to the customer's\
    \ registered address.\n\nAgents must follow this security-conscious procedure\
    \ to protect the customer's account:\n\n1.  **Verify Identity**: Before any card\
    \ is ordered, the agent must call the verify_identity tool. This prevents unauthorised\
    \ persons from redirecting cards to fraudulent addresses.\n2.  **Assess the Situation**:\
    \ Determine why a replacement is needed. \n    *   If the card is **damaged**,\
    \ the agent can proceed directly to ordering.\n    *   If the card is **lost or\
    \ stolen**, the agent must first call the freeze_card tool to prevent unauthorised\
    \ transactions and protect the customer's balance.\n3.  **Identify the Account**:\
    \ Use the get_accounts tool to find the account_id associated with the card that\
    \ needs replacing (e.g., the account linked to a Wrenfield Rewards Credit Card).\n\
    4.  **Order the Card**: Call the order_replacement_card tool, specifying the account_id\
    \ and the reason for the replacement (e.g., 'lost', 'stolen', or 'damaged').\n\
    \nOnce the order is placed, the customer will receive their new card by post.\
    \ We remind customers that new cards are delivered in an inactive state for security\
    \ reasons. Upon receipt, they will need to follow the activation process, as detailed\
    \ in the activate_card policy. For technical specifications of the ordering process,\
    \ see the order_replacement_card tool reference."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: wrenfield_bank
- id: 9e016c7d-0770-5dfe-86d3-c96cb680b84a
  title: order_replacement_card tool reference
  body: 'The order_replacement_card tool is used by agents to request a new physical
    payment card for a customer. The agent performs this action by calling the tool
    directly after verifying the customer''s identity.


    **Signature**

    `order_replacement_card(account_id, reason)`


    **Arguments**

    *   `account_id`: The unique internal identifier for the account linked to the
    card, retrieved via the get_accounts tool.

    *   `reason`: The reason for the replacement (e.g., ''lost'', ''stolen'', ''damaged'').
    This is provided by the customer during the conversation.


    **Effect**

    The tool triggers the production and dispatch of a new physical card to the customer''s
    address on file. If the reason provided is ''lost'' or ''stolen'', the system
    ensures the previous card''s details are invalidated to prevent further unauthorised
    use.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: wrenfield_bank
- id: 1c7371dc-31a7-5507-bb90-cd671e1d76e5
  title: When to use activate_card
  body: 'To protect our customers from theft during transit, all physical cards issued
    by Wrenfield Bank are sent in an inactive state. This means that while the customer
    possesses the card, it cannot be used for payments or ATM withdrawals until it
    is formally activated. The activate_card tool is the authoritative method for
    agents to enable a new card for use.


    Agents should use this tool when a customer calls to activate a card they have
    just received in the post. The following procedure must be followed:


    1.  **Verify Identity**: The agent must call the verify_identity tool first. This
    ensures that the person requesting activation is the legal account holder and
    not someone who may have intercepted the mail.

    2.  **Verify Card Possession**: The agent should ask the customer to confirm they
    have the physical card in their possession. For security, the customer should
    provide the last four digits of the card number.

    3.  **Resolve Account ID**: Use the get_accounts tool to identify the correct
    account_id associated with the card being activated.

    4.  **Perform Activation**: Call the activate_card tool using the resolved account_id
    and the last four digits of the card number. The agent completes this action directly
    in the conversation.


    Once the tool returns a success message, the card is immediately ready for use.
    If the activation fails, the agent should investigate whether the card has already
    been activated or if there is a block on the account. For further technical details,
    see the activate_card tool reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: wrenfield_bank
- id: 22e9480c-163b-5250-a4f5-6044d9adb538
  title: activate_card tool reference
  body: 'The activate_card tool is used by agents to enable a new or replacement physical
    card for use. The agent performs this action by calling the tool directly after
    the customer has been fully authenticated.


    **Signature**

    `activate_card(account_id, card_number_last_four)`


    **Arguments**

    *   `account_id`: The unique internal identifier for the account linked to the
    card, obtained via get_accounts.

    *   `card_number_last_four`: The final four digits of the physical card number.
    This value is provided by the customer from the card in their possession.


    **Effect**

    The tool updates the status of the specified card from ''inactive'' to ''active''.
    This allows the card to be used for transactions, including point-of-sale payments
    and cash withdrawals at ATMs.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: wrenfield_bank
- id: 9fdeabbc-9ddb-5b5e-a1ea-6c6795c6dea7
  title: When to use dispute_status
  body: 'At Wrenfield Bank, we are committed to transparency and stability, ensuring
    our customers are kept informed throughout the lifecycle of a payment or service
    dispute. We use the dispute_status tool to provide customers with real-time updates
    on the progress of their claims, reducing uncertainty and demonstrating our commitment
    to the Consumer Duty.


    This tool should be employed whenever a customer enquires about the current state
    of a dispute they have previously raised. As a reminder, our standard service
    levels for resolution are as follows: we aim to provide final responses for payment
    service complaints within 15 business days, and all other disputes within eight
    weeks. If a customer''s enquiry falls within these windows, the dispute_status
    tool is the authoritative source for the current internal stage of the investigation.


    To maintain the security of assets and prevent unauthorised access, we operate
    a rigorous ''verify-first'' stance. No information regarding a dispute may be
    disclosed until full identity authentication is complete.


    Follow these steps to provide a status update:


    1. Perform a full identity verification of the customer using the verify_identity
    tool.

    2. Use the get_accounts tool to resolve the customer''s account_id based on the
    last four digits of the account number they provide.

    3. Confirm the specific transaction or dispute reference the customer is enquiring
    about. If the customer does not have a reference, use get_account_transactions
    to help them identify the correct payment.

    4. Call the dispute_status tool using the verified account_id and the relevant
    transaction or dispute identifier.

    5. Clearly communicate the status to the customer in a professional and welcoming
    manner.


    If the tool indicates that the dispute is unresolved and the customer remains
    dissatisfied, or if the standard timeframes (15 business days or eight weeks)
    have been exceeded without a final response, the matter should be moved through
    our structured escalation path to senior management. If we are unable to resolve
    the issue internally, we must advise the customer of their right to take the matter
    to the Financial Ombudsman Service.


    For guidance on how to initiate a new claim, please refer to When to use file_transaction_dispute.'
