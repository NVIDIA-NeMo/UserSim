- id: 61b1ffd3-ec86-5569-ada4-1efdfb1041dd
  title: Wrenfield Easy Access Cash ISA — getting started walkthrough
  body: 'This walkthrough is intended for support agents to ensure a seamless onboarding
    experience for customers opening a Wrenfield Easy Access Cash ISA. Our goal is
    to provide a professional and clear introduction to the product''s benefits.


    Step 1: Eligibility Confirmation

    Verify that the customer is a UK resident and possesses a valid form of identity.
    Ensure they are aware of the current annual ISA allowance of £20,000. If they
    have already contributed to a Cash ISA elsewhere this tax year, confirm that the
    total across all providers will not exceed this £20,000 limit to avoid regulatory
    complications.


    Step 2: Product Value Proposition

    Clearly explain the key features of the account:

    - An annual interest rate of 2.85%, providing a stable return on their savings.

    - Easy access to funds, allowing for flexibility without the restrictions of a
    fixed-term bond.

    - Full protection of eligible deposits via the FSCS up to £120,000 per person
    (and up to £1.4 million for temporary high balances).


    Step 3: Account Opening

    Perform the full identity authentication process as per our ''verify-first'' security
    stance. Once authenticated, we will establish the account and confirm the initial
    deposit. Remind the customer that if they are under 65, there are upcoming changes
    to the allowance effective from April 2027.


    Step 4: Final Confirmation

    Provide the customer with a summary of their account, explicitly stating the 2.85%
    interest rate and their remaining allowance for the current tax year. For further
    details on who this product suits, refer to the Wrenfield Easy Access Cash ISA
    — overview.'
  domain: retail_banking
  product_category: cash_isa
  document_type: product_sheet
