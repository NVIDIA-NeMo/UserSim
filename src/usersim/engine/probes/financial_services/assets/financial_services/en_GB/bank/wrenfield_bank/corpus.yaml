- id: e052c77d-7f60-5855-8850-aada677e7685
  title: Wrenfield Two-Year Fixed Mortgage — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Wrenfield
    Two-Year Fixed Mortgage. Please read these carefully to understand the risks associated
    with this lending product.


    Interest Rate Risk: The fixed rate of 5.64% is only guaranteed for the first two
    years. After this period, your loan will revert to the Standard Variable Rate,
    currently 7.49%. This means your monthly payments will likely increase significantly
    at the end of the two-year term unless you remortgage or switch products.


    Early Exit Risk: This mortgage is designed for a two-year commitment. If you wish
    to repay the loan in full or switch providers before the end of the term, you
    will be subject to Early Repayment Charges. These are 3% of the balance in year
    one and 2% in year two. These charges can be substantial depending on your outstanding
    loan amount.


    LTV and Equity Risk: This product allows for a maximum LTV of 90%. Borrowers with
    a high LTV are more susceptible to ''negative equity'' if property prices fall,
    meaning the loan balance could exceed the value of the home.


    Overall Cost: The APRC of 7.4% represents the total cost of the loan over the
    full term, including interest and the £999 product fee. This figure is provided
    to help you compare the total cost against other mortgage products.


    All lending recommendations are subject to a strict affordability assessment to
    ensure a high standard of care and avoid foreseeable harm to the borrower.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: disclosure
