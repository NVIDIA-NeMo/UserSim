- id: f9006e72-5ba3-5d01-8d16-d1c4a36f6ad6
  title: Wrenfield Two-Year Fixed Mortgage — access or login problems
  body: 'This guide is for customers who have created a prospective account to track
    their mortgage application or comparison data and are unable to access their details.


    Symptom: You receive an ''Invalid Credentials'' error or are unable to bypass
    the authentication screen when trying to view your mortgage quote.


    Likely Causes:

    - Incorrect username or password entry.

    - Account lockout due to multiple failed authentication attempts.

    - Outdated browser cache interfering with our ''verify-first'' security protocols.


    What to check in order:

    1. Verify that your Caps Lock is off and that you are using the correct email
    address associated with your application.

    2. Clear your browser cache and cookies, then restart your browser before attempting
    to log in again.

    3. Ensure you are attempting access during standard UK business hours, as some
    secure verification systems may undergo maintenance outside of these times.


    How to fix:

    If you still cannot log in, tell us the specific error message you are seeing.
    We will then initiate a full identity authentication process to reset your access.
    Once your identity is verified, we will provide you with a temporary access code
    to regain entry to your account.


    When to escalate:

    If the login issue persists after a password reset, we will raise a case with
    our technical specialists. You will receive a reference number and a resolution
    timeline within 15 business days. For more general account issues, you can refer
    to Wrenfield Current Account — access or login problems.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: troubleshooting
  source_authority: official
