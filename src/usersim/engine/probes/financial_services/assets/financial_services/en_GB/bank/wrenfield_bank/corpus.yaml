- id: 8f18c14b-298a-556e-b1a5-a8c5f809de0f
  title: Wrenfield Regular Saver — cancel, close, or downgrade
  body: 'If you no longer wish to maintain your Wrenfield Regular Saver, you can request
    to close the account. Please follow these steps to ensure a smooth transition
    of your funds.


    What you need before starting:

    - Your account number for the Wrenfield Regular Saver.

    - The details of the account where you wish the remaining balance to be transferred.


    Steps to close your account:


    1. Request Closure: Tell us that you wish to close your Wrenfield Regular Saver.
    We will first perform a full identity authentication to ensure the security of
    your assets.


    2. Review Term and Interest: We will confirm the current balance and the interest
    accrued at the 6% rate. We will also notify you if you are closing the account
    before the 12-month term has concluded, as this may impact the final interest
    payment.


    3. Provide Destination Account: Tell us the account details where the final balance
    should be sent. If you have a Wrenfield Current Account, this is typically the
    simplest option.


    4. Confirmation of Transfer: We will execute the transfer of your funds and the
    closure of the account. You will receive a final confirmation that the account
    is closed and the funds have been dispatched.


    How you know it worked:

    Your Wrenfield Regular Saver will no longer appear in your list of active accounts,
    and the closing balance will appear as a credit in your nominated destination
    account.


    If you are undecided about closing and are considering other options, you may
    find it helpful to review Wrenfield Regular Saver — vs. a typical competitor offering.'
