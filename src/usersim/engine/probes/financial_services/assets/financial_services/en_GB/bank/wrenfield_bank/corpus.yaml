- id: c0e36bd2-8ca3-53ae-a760-ff7eb9493a4a
  title: Wrenfield Everyday Saver — a failed or pending action
  body: 'Symptom: You have attempted to open an account or transfer funds, but the
    action appears as ''pending'' or the balance has not updated to reflect your deposit.


    Likely Causes: The most common cause for a pending status during account activation
    is a delay in the verification of the minimum opening deposit of £1, or a mismatch
    in the name on the sending account and the Wrenfield Bank application.


    What to check in order:

    1. Verify the transfer receipt: Ensure the exact amount of £1 (or more) was sent
    from an account held in your legal name.

    2. Check the transaction date: Confirm that the transfer was initiated within
    the standard UK business hours, as transfers made over weekends may not reflect
    immediately.

    3. Review your identity status: Ensure we have successfully verified your documentation;
    an account cannot be activated until the ''verify-first'' process is complete.


    How to resolve it:

    Tell us that your deposit is not showing. We will track the transaction using
    your reference number and verify it against our incoming payment logs. If the
    funds were received but not credited, we will manually apply the balance to your
    account immediately.


    When to escalate:

    If we are unable to locate the funds within 3 business days of your transfer,
    we will raise a formal payment investigation case with the sending institution.
    We will provide you with a case reference number and update you on the status
    of your funds every two business days until the matter is resolved. For further
    guidance on the initial setup process, please see the Wrenfield Everyday Saver
    — set up and activate.'
  domain: retail_banking
  product_category: everyday_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: cc0fb705-f1c6-549c-a2a2-762fdff0f2bb
  title: Wrenfield Everyday Saver — eligibility requirements
  body: 'To ensure we treat all customers fairly and maintain regulatory compliance,
    the following eligibility criteria apply to the Wrenfield Everyday Saver:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Age | Must be 18 years of age or older | Eligible |

    | Residency | Must be a permanent resident of the United Kingdom | Eligible |

    | Identification | Must provide valid government photo ID and proof of address
    | Eligible |

    | Minimum Funding | Ability to provide a minimum opening deposit of £1 | Eligible
    |

    | Account Status | Must not have an active bankruptcy order | Eligible |

    | Identity Verification | Must pass our rigorous ''verify-first'' authentication
    | Eligible |


    If any of the above requirements are not met, we are unable to open a Wrenfield
    Everyday Saver account. For further details on the product''s features and the
    2.1% interest rate, please refer to the Wrenfield Everyday Saver — overview.'
  domain: retail_banking
