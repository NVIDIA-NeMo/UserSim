- id: 72b72751-dc91-520e-a31f-323c25fcecc1
  title: Wrenfield Current Account — when to switch or upgrade
  body: 'This guide assists support agents in determining when the Wrenfield Current
    Account is the optimal choice or when a customer should consider other options.


    **When to recommend the Wrenfield Current Account**

    This account is the best choice for customers who value stability and transparency.
    It is ideal for those who want a fee-free daily banking hub, as it carries a £0
    monthly account fee. It is also highly attractive to those moving from another
    institution, given our £175 switching incentive.


    **When to suggest an upgrade or alternative**

    - **For higher interest growth:** If a customer''s primary goal is saving rather
    than daily spending, suggest the Wrenfield Regular Saver for short-term goals
    or the Wrenfield Easy Access Cash ISA for tax-efficient growth.

    - **For credit needs:** If the customer finds the 39.9% arranged overdraft rate
    too high for a large, long-term borrowing need, suggest a Wrenfield Personal Loan
    with its representative APR of 6.9%.


    For more detailed comparisons, refer to Wrenfield Current Account — vs. a similar
    product here.'
  domain: retail_banking
  product_category: current_account
