- id: 9b62c74d-73ca-52ce-9dbe-45863af8bdc0
  title: Wrenfield Rewards Credit Card — vs. a similar product here
  body: 'When choosing between the Wrenfield Rewards Credit Card and the Wrenfield
    Personal Loan, the decision typically depends on whether you require flexible,
    revolving credit or a structured, lower-cost borrowing solution.


    Comparison Dimensions:

    - Cost: The Rewards Credit Card has a representative APR of 24.9%, whereas the
    Personal Loan offers a significantly lower representative APR of 6.9%.

    - Flexibility: The credit card allows for ongoing spend and repayment, with a
    balance transfer fee of 3.49%. The Personal Loan is a fixed amount borrowed over
    a set term.

    - Protection: The credit card provides Section 75 protection for purchases between
    £100 and £30,000, which is not applicable to personal loans.

    - Use Case: The credit card is ideal for daily spending, earning rewards, and
    short-term flexibility. The personal loan is better suited for large, one-off
    expenses where a lower interest rate and fixed repayment schedule are preferred.


    Who each suits:

    - Choose the Wrenfield Rewards Credit Card if you value the ability to spend and
    repay flexibly and want the added security of Section 75 for your shopping.

    - Choose the Wrenfield Personal Loan if you need to borrow a specific sum at the
    most competitive rate possible with a clear end date.'
  domain: cards
  product_category: credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 35656cb5-bea1-5537-9edb-eac6e66b92ae
  title: Wrenfield Rewards Credit Card — regulatory disclosures
  body: 'This document provides the necessary regulatory disclosures for the Wrenfield
    Rewards Credit Card. Support agents must ensure these points are communicated
    clearly to customers.


    Regulatory Standing:

    Wrenfield Bank operates under the strict authorisation of the Prudential Regulation
    Authority (PRA) and is regulated by the Financial Conduct Authority (FCA). We
    are committed to the Consumer Duty, ensuring that all retail customers are treated
    fairly and provided with transparent pricing.


    Deposit Protection:

    Eligible deposits held within the bank are protected by the Financial Services
    Compensation Scheme (FSCS) up to £120,000 per person. In the event of temporary
    high balances, protection extends up to £1.4 million.


    Credit Terms:

    The representative APR for this product is 24.9%. This figure is a benchmark;
    actual rates may vary based on the individual''s creditworthiness. All lending
    recommendations are subject to a strict affordability assessment to prevent foreseeable
    harm to the customer.


    Liability and Protection:

    Under the Consumer Credit Act, this card provides Section 75 protection, making
    the bank jointly liable for purchases between £100 and £30,000. We also honour
    the Direct Debit Guarantee for immediate refunds in the event of errors regarding
    monthly repayments.


    Dispute Resolution:

    We aim for rapid resolution of all disputes. Final responses for payment service
    complaints are provided within 15 business days. For other disputes, we provide
    a response within eight weeks. If a resolution is not reached, customers may escalate
    their complaint to the Financial Ombudsman Service.'
  domain: cards
  product_category: credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4b2ac2b4-1085-5ace-9339-71c18e02932f
  title: Wrenfield Rewards Credit Card — interest rate / AER schedule
  body: 'The Wrenfield Rewards Credit Card utilises a representative pricing model
    to ensure transparency for all prospective customers.


    - Representative APR: 24.9%


    This rate is a flat representative figure applicable to at least 51% of successful
    applicants. It encompasses the interest charged on balances not paid in full by
    the end of the billing cycle.


    Factors Affecting Your Rate:

    While 24.9% is our representative rate, the actual APR assigned to your account
    is determined by our internal credit scoring and the results of your affordability
    assessment. A higher credit score may result in a lower rate, while a higher risk
    profile may result in a rate above 24.9%.


    Interest Application:

    Interest is calculated daily and applied monthly to any outstanding balance. To
    avoid interest charges, customers should pay their statement balance in full by
    the due date each month. For details on fees associated with moving balances from
    other providers, see the Wrenfield Rewards Credit Card — fee schedule.'
  domain: cards
  product_category: credit_card
  document_type: rate_sheet
  source_authority: official
  placeholder: true
