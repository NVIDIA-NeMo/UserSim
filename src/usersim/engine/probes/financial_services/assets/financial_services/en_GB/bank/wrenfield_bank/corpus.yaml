- id: de1bd7de-a9ba-501d-b017-3f569d3fc281
  title: Wrenfield Two-Year Fixed Mortgage — check status or history
  body: 'If you are an existing customer, you can easily check the current status,
    balance, and payment history of your Wrenfield Two-Year Fixed Mortgage. Follow
    these steps to obtain your information:


    1. **Request an Account Summary**: Tell us that you would like to view the current
    status of your mortgage. We will perform a full identity authentication to ensure
    the security of your assets.

    2. **Specify the Information Required**: Let us know if you need the current outstanding
    balance, the date your fixed rate of 5.64% expires, or a confirmation of your
    most recent payment.

    3. **Review the Details**: We will provide the requested figures. If you are checking
    your history, we will confirm the date and amount of your last few repayments.

    4. **Confirm Accuracy**: Review the information provided. If the figures match
    your own records, the process is complete.


    **How you know it worked**

    You will have received a verbal or written confirmation of your current mortgage
    balance and the specific date when your account is scheduled to move from the
    fixed rate to the Standard Variable Rate of 7.49%.


    If you notice any discrepancies while checking your history, please refer to Wrenfield
    Two-Year Fixed Mortgage — a discrepancy in your records or statement.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
