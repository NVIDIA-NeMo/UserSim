- id: ac3d1852-af5e-551f-8afd-d8ad509f30c6
  title: dispute_status tool reference
  body: 'The dispute_status tool is a read-only function used to retrieve the current
    progress, internal stage, and final outcome (if applicable) of a transaction dispute.
    The agent performs this action by calling the tool directly within the conversation
    once the customer''s identity has been verified.


    **Tool Signature and Arguments:**

    - account_id: The unique identifier for the customer''s account, which the agent
    must first obtain via the get_accounts tool.

    - transaction_id: The unique identifier for the specific payment being disputed,
    obtained either from the customer or via the get_account_transactions tool.


    **Effect:**

    The tool returns the current status of the dispute (e.g., ''Under Investigation'',
    ''Pending Merchant Response'', ''Resolved - Refunded'', or ''Resolved - Declined'').
    This allows the agent to provide an accurate and transparent update to the customer
    regarding their claim, adhering to our commitment to fair pricing and regulatory
    transparency. This tool does not change the state of the account or the dispute;
    it only discloses existing information.'
