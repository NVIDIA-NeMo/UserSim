- id: 9316a62c-d93d-562d-a46c-05cf8961e010
  title: Wrenfield Two-Year Fixed Mortgage — resolve a common request end-to-end
  body: 'A common request for customers of the Wrenfield Two-Year Fixed Mortgage is
    making a voluntary overpayment to reduce the total debt. Here is how to complete
    this process end-to-end:


    1. **Initiate the Request**: Tell us that you would like to make a mortgage overpayment.
    We will then perform a full identity authentication to verify your account.

    2. **Specify the Amount**: State the exact amount you wish to pay. We will check
    this against your remaining annual overpayment allowance of 10% of the outstanding
    balance.

    3. **Confirm the Allowance**: We will confirm whether the payment falls within
    the 10% limit. If it exceeds this limit, we will inform you that an early repayment
    charge (3% in year one or 2% in year two) will apply to the excess amount.

    4. **Authorise the Transfer**: Once you are happy with the terms, instruct us
    to move the funds from your nominated account to the mortgage loan.

    5. **Receive Confirmation**: We will process the payment and provide you with
    a confirmation of the new, reduced outstanding balance.


    **How you know it worked**

    You will receive a confirmation message stating the exact amount paid and the
    updated balance of your mortgage, reflecting the reduction in your total debt.


    If you are still deciding whether to make an overpayment, you may wish to compare
    the costs in Wrenfield Two-Year Fixed Mortgage — when to switch or upgrade.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: dcea0053-a269-59de-b96e-9d1e5060c1d0
  title: Wrenfield Two-Year Fixed Mortgage — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting customers who have identified
    a discrepancy in their Wrenfield Two-Year Fixed Mortgage records or statements.


    **Symptom**

    The customer reports that the outstanding balance, the interest charged, or the
    recorded overpayments on their statement do not match their own calculations.


    **Likely Causes**

    - **SVR Transition**: The customer may be seeing the jump from 5.64% to the Standard
    Variable Rate of 7.49% and perceive it as a billing error.

    - **ERC Application**: An overpayment exceeding the 10% allowance may have triggered
    an early repayment charge (3% or 2%), which the customer did not expect.

    - **Fee Timing**: The £999 product fee may have been applied to the balance at
    a time the customer did not anticipate.


    **What to Check and Fix**

    1. **Audit the Interest Rate**: Check the date of the discrepancy. If it occurred
    after the two-year fixed term, confirm that the 7.49% SVR is being applied correctly.

    2. **Review Overpayment History**: Check if the customer exceeded the 10% annual
    allowance. If so, verify that the correct ERC (3% or 2%) was charged on the excess.

    3. **Verify Product Fees**: Confirm that the £999 product fee was applied only
    once at the start of the loan.


    **When to Escalate**

    If the error is not related to the above and appears to be a technical or administrative
    mistake, raise a formal dispute. We aim to provide a final response for these
    disputes within eight weeks. The customer should be informed that we are routing
    the case to senior management for a full reconciliation.'
  domain: lending_mortgage
  product_category: two_year_fixed_mortgage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 4cc3d13b-fe0e-596c-b99a-9d2998b215f6
  title: Wrenfield Personal Loan — overview
  body: 'The Wrenfield Personal Loan is designed for customers seeking a transparent
    and stable borrowing solution. We provide a dependable way to fund significant
    life events, home improvements, or debt consolidation, ensuring that the cost
    of borrowing is clear from the outset.


    We pride ourselves on fair pricing and a commitment to the Consumer Duty. This
    means we conduct strict affordability assessments on every application to ensure
    that the loan is sustainable for the customer and to avoid any foreseeable harm.


    Key Product Details:

    - Maximum Loan Amount: We offer borrowing up to a maximum loan amount of £35,000.

    - Representative APR: Our loans carry a representative APR of 6.9%.

    - Right to Withdraw: In line with our commitment to transparency, all customers
    have a 14-day right to withdraw from their loan agreement.


    To help you understand the potential costs, we provide the following representative
    example. This example illustrates the cost of a loan given to a typical customer:

    - Loan Amount: £10,000

    - Loan Duration: 60 months

    - Monthly Repayment: £196.56

    - Total Amount Payable: £11,793.60


    By using a fixed repayment structure, we provide the stability our customers value,
    with no hidden fees and a clear end date for the borrowing. For those who already
    have a Wrenfield Current Account, managing repayments is streamlined and simple.
    If you are considering this product to consolidate other debts or fund a specific
    project, we recommend reviewing our eligibility criteria to see if this solution
    meets your needs.


    For more detailed information on the requirements for this product, you may refer
    to Wrenfield Personal Loan — eligibility requirements.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b30057e9-ba45-509b-888e-ea48a89c0052
  title: Wrenfield Personal Loan — representative APR explained
  body: 'How does the representative APR of 6.9% work?


    The representative APR (Annual Percentage Rate) is a standard way of showing the
    cost of borrowing. By law, we must be able to offer the representative APR of
    6.9% to at least 51% of the customers who are accepted for the loan. Depending
    on your individual credit profile and the specific terms of your loan, the actual
    rate we offer you may be higher or lower than this figure.


    Why is the representative APR important for my loan?


    It allows you to compare our loan product with other lenders on a like-for-like
    basis. It includes not only the interest rate but also any mandatory charges,
    providing a comprehensive view of the cost. For a detailed breakdown of how our
    interest is applied, please see Wrenfield Personal Loan — interest rate / AER
    schedule.


    What happens if I am offered a different rate?


    We will disclose your specific APR clearly in your personalised offer before you
    sign the agreement. This ensures you have full transparency regarding the total
    cost of your borrowing.'
