- id: 9bb40b5e-fc42-52d1-bc7a-b3f8629c5b4c
  title: Wrenfield Everyday Saver — fee schedule
  body: 'The Wrenfield Everyday Saver is designed to be an accessible, low-barrier
    savings tool. In line with our philosophy that essential banking should be free
    and transparent, we do not charge monthly maintenance fees for this account.


    - Monthly Account Fee: £0

    - Account Opening Fee: £0

    - Account Closure Fee: £0

    - Balance Inquiry Fee: £0


    There are no hidden charges or operational costs passed on to the customer for
    the standard maintenance of the Wrenfield Everyday Saver. This ensures that the
    2.1% interest earned is not eroded by unnecessary fees. For information on fees
    related to other products, such as our credit or mortgage offerings, please refer
    to the Institution-wide fees and charges.'
