  mentions_tools: []
  institution_id: wrenfield_bank
- id: 379f9393-07d3-5e76-9dbb-d4f55a41b7fe
  title: Wrenfield Easy Access Cash ISA — access or login problems
  body: 'If you are experiencing difficulties accessing your Wrenfield Easy Access
    Cash ISA, please follow this guide to resolve the issue.


    Symptom: You are unable to log into your account or are receiving an ''Access
    Denied'' message.


    Likely Causes:

    - Incorrect login credentials or an expired password.

    - Your account has been temporarily locked due to multiple unsuccessful login
    attempts.

    - Security flags triggered by an unrecognised device or location.


    What to check and do:

    1. Verify credentials: Ensure that you are using the correct username and that
    your password is entered exactly as created. Remember that passwords are case-sensitive.

    2. Identity Verification: If you are locked out, tell us immediately. We will
    initiate our ''verify-first'' authentication process, requiring you to answer
    a series of security questions or provide secondary identification to prove ownership
    of the account.

    3. Device Check: If you are accessing your account from a new device, we may require
    an additional layer of authentication to ensure your 2.85% interest balance remains
    secure.


    Resolution:

    Once we have successfully verified your identity, we will unlock your account
    or reset your credentials. We will then confirm that your access has been restored,
    allowing you to manage your savings and monitor your £20,000 allowance.


    When to escalate:

    If your identity cannot be verified through standard means or if you suspect your
    account has been compromised, we will escalate the matter to our senior management
    team for a detailed security review. You will be notified of the outcome of this
    investigation within eight weeks.'
  domain: retail_banking
  product_category: cash_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
