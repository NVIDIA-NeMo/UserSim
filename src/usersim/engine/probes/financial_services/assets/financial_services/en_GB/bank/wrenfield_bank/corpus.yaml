- id: 5bf8030d-7af0-5ed0-b7fc-cd9fe153afd6
  title: Wrenfield Current Account — overview
  body: 'The Wrenfield Current Account is designed to be a dependable, transparent
    hub for your daily banking needs. We believe that accessing essential financial
    services should be straightforward and fair, which is why we have positioned this
    account as a stable foundation for our retail customers.


    One of the primary benefits of the Wrenfield Current Account is its cost-effectiveness;
    we charge a monthly account fee of £0, ensuring that you can manage your money
    without the burden of recurring maintenance costs. For those looking to move their
    primary banking relationship to us, we offer a streamlined switch process complemented
    by a switching incentive of £175, provided the eligibility criteria are met.


    We understand that flexibility is key to managing a household budget. While we
    encourage mindful spending, we provide arranged overdraft facilities to help you
    navigate short-term cash flow gaps. The arranged overdraft rate for this account
    is 39.9%. We ensure that all lending, including overdraft limits, is subject to
    a strict affordability assessment to protect you from foreseeable financial harm.


    As a customer, you will benefit from a high-street institution that prioritises
    the Consumer Duty. This means we are committed to providing clear information,
    fair pricing, and a level of service that helps you achieve your financial goals.
    Your deposits are secure, with eligible balances protected by the Financial Services
    Compensation Scheme (FSCS) up to £120,000 per person, and temporary high balances
    protected up to £1.4 million.


    Whether you are depositing your salary, paying bills, or managing your daily spend,
    the Wrenfield Current Account provides the stability of a traditional bank with
    the clarity of modern pricing. For a detailed breakdown of all costs associated
    with this account, please refer to the Wrenfield Current Account — fee schedule.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
