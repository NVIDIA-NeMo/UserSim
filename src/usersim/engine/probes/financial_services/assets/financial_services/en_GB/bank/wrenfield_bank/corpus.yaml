- id: d0204013-c9ee-5e6b-9a93-04d8f0b72314
  title: Wrenfield Rewards Credit Card — risk disclosures
  body: 'This document provides essential risk disclosures for the Wrenfield Rewards
    Credit Card. We provide this information to ensure all customers are treated fairly
    and can make informed decisions about their borrowing.


    Interest and Cost of Credit

    The representative APR of 24.9% is the annual percentage rate that we must be
    able to offer to at least 51% of successful applicants. However, borrowing at
    this rate can be expensive. If you do not pay your balance in full each month,
    interest will compound, increasing the total amount you owe. We strongly advise
    customers to only borrow what they can comfortably afford to repay.


    Impact on Credit Rating

    Your credit score is affected by how you manage this account. Missing payments
    or consistently utilising a high percentage of your credit limit (relative to
    the £1,200 assumed limit in our examples) may negatively impact your ability to
    obtain further credit in the future.


    Affordability and Harm

    In accordance with the Consumer Duty, all applications are subject to a strict
    affordability assessment. We do this to prevent foreseeable harm and ensure that
    the loan is sustainable. If you find yourself unable to meet your repayments,
    please inform us immediately so we can discuss support options.


    Fees

    Be mindful of the costs associated with specific actions: balance transfers incur
    a 3.49% fee, and transactions in foreign currencies incur a 2.99% fee. These costs
    are transparently priced to cover our operational and regulatory risks.


    Regulatory Protection

    Eligible deposits at Wrenfield Bank are protected by the FSCS up to £120,000 per
    person. While the credit card is a lending product and not a deposit, our operations
    remain strictly authorised by the PRA and regulated by the FCA.'
  domain: cards
  product_category: credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 27cfee6d-cb68-52f7-b40d-3663f0691c32
  title: Wrenfield Rewards Credit Card — how rates are tiered and applied
  body: 'The Wrenfield Rewards Credit Card utilises a transparent pricing structure.
    Unlike some products, we do not use complex tiered interest rates based on balance;
    instead, we apply the following standard rates and fees to all eligible accounts:


    - Representative APR: 24.9%

    This is the Annual Percentage Rate that we are able to offer to at least 51% of
    successful applicants. It represents the total cost of credit over a year, including
    interest and compulsory fees.


    - Balance Transfer Fee: 3.49%

    This is a flat percentage fee applied to the total value of any balance transferred
    from another institution. This fee is charged at the point of transfer and is
    applicable for the 24-month transfer window.


    - Foreign Transaction Fee: 2.99%

    This fee is applied to every transaction made in a currency other than GBP. It
    is calculated as a percentage of the transaction value converted to sterling.


    These rates are designed to cover our operational costs and regulatory risk while
    remaining fair and clear. Any changes to these rates will be communicated to customers
    in advance, following our stability and transparency positioning.'
  domain: cards
  product_category: credit_card
  document_type: rate_sheet
  source_authority: official
