- id: afe0db4f-df81-5bfd-b89b-3a340a972bdf
  title: Wrenfield Rewards Credit Card — who it is best for and common use cases
  body: 'The Wrenfield Rewards Credit Card is designed for retail customers who seek
    a dependable balance of rewards and flexible debt management. It is particularly
    well-suited for individuals who value transparency and the stability of a traditional
    high-street institution.


    Common Use Cases:

    - Debt Consolidation: For customers looking to move high-interest debt from other
    providers, our 24-month balance transfer period provides a significant window
    to reduce balances. This is subject to a balance transfer fee of 3.49%.

    - Daily Spending with Protection: The card is ideal for larger purchases between
    £100 and £30,000, as it offers Section 75 protection, making us jointly liable
    for the purchase should the vendor fail to deliver.

    - International Travel: While the card is convenient for global use, customers
    should be aware of the 2.99% foreign transaction fee applied to non-sterling spend.


    Key Product Specifications:

    - Representative APR: 24.9%

    - Assumed Credit Limit: £1,200 (used in representative examples)

    - Balance Transfer Window: 24 months

    - Balance Transfer Fee: 3.49%

    - Foreign Transaction Fee: 2.99%


    Who it is best for:

    This card is best for the ''disciplined spender'' who wants to earn rewards on
    their daily expenditure while having the option to move external debt into a structured
    24-month window. It is also a strong choice for those who prioritise consumer
    protection over the lowest possible interest rates. Because we operate under the
    strict authorisation of the PRA and regulation by the FCA, customers can trust
    that they are treated fairly and that their lending is subject to rigorous affordability
    checks to avoid foreseeable harm.'
  domain: cards
  product_category: credit_card
  document_type: product_sheet
  source_authority: official
