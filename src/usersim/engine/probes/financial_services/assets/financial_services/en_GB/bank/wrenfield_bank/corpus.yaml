  institution_id: wrenfield_bank
- id: 9e1d9bc4-a2a0-58bf-b440-42b354ca6fb8
  title: Wrenfield Current Account — privacy and data handling
  body: 'Wrenfield Bank is committed to the highest standards of data privacy and
    regulatory compliance. We operate under the strict authorisation of the Prudential
    Regulation Authority (PRA) and are regulated by the Financial Conduct Authority
    (FCA). This ensures that all customers using the Wrenfield Current Account are
    treated fairly and that their data is handled with integrity.


    Data Protection

    We process your personal and financial data in accordance with UK GDPR and the
    Data Protection Act. Your information is used solely to manage your account, prevent
    financial crime, and meet our regulatory obligations. We do not sell your data
    to third parties. All state-changing actions on your account are subject to our
    ''verify-first'' security protocol to prevent unauthorised access.


    Deposit Protection

    For your peace of mind, eligible deposits held within your Wrenfield Current Account
    are protected by the Financial Services Compensation Scheme (FSCS). This protection
    applies up to £120,000 per person. In specific circumstances, temporary high balances
    (such as the proceeds from a house sale) are protected up to £1.4 million for
    a limited period.


    Regulatory Transparency

    In line with the Consumer Duty, we provide all product information, including
    our arranged overdraft rate of 39.9% and our £0 monthly account fee, in a clear
    and prominent manner. We avoid opaque jargon to ensure you can make informed decisions
    about your finances.


    For further information on our legal obligations, please refer to Wrenfield Current
    Account — regulatory disclosures.'
  domain: retail_banking
  product_category: current_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: b76fa3e2-754e-5f41-b4d2-70206413806b
  title: Wrenfield Current Account — recognising scams targeting this product
  body: 'As you compare banking options, it is important to be aware of the specific
    ways fraudsters may attempt to target new and existing customers of the Wrenfield
    Current Account. We maintain a rigorous ''verify-first'' stance to protect your
    assets, but vigilance on your part is the first line of defence.


    One common tactic involves the £175 switching incentive. Scammers may contact
    you pretending to be from Wrenfield Bank, claiming there is an issue with your
    incentive payment and requesting your full security credentials or a ''verification
    code'' to release the funds. Please remember: we will never ask you for your full
    password, PIN, or a one-time passcode (OTP) over the phone or via text.


    Another prevalent threat is the ''safe account'' scam. You may receive a call
    from someone claiming to be from our fraud department, stating that your Wrenfield
    Current Account has been compromised. They will urge you to move your money to
    a ''safe account'' to protect it. We will never ask you to transfer your funds
    to a different account for security reasons.


    If you notice any suspicious activity or receive a request that feels unusual,
    the first action you must take is to notify us immediately. Rapid reporting is
    essential for our team to secure your account and limit potential liability. For
    your peace of mind, all eligible deposits in our accounts are protected by the
    FSCS up to £120,000 per person, with temporary high balances protected up to £1.4
    million.


    We are committed to supporting victims of APP scams and providing clear guidance
    on how to recover funds where possible. For more detailed information on how we
    safeguard your assets, we recommend reviewing Wrenfield Current Account — fraud
    and unauthorised-activity protection.'
  domain: retail_banking
  product_category: current_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 9d51d85e-9ef2-538f-bd35-40da3e7f083f
  title: Wrenfield Current Account — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary technical boundaries
    and restrictions associated with the Wrenfield Current Account to ensure accurate
    customer guidance.


    **Overdrafts and Interest**

    Customers may be eligible for an arranged overdraft. Any balance utilised within
    this arranged limit is subject to an interest rate of 39.9%. It is vital to remind
    customers that this rate is variable and applies to the daily overdrawn balance.


    **Switching Incentive Restrictions**

    The £175 switching incentive is subject to specific eligibility criteria. The
    incentive is only paid once the full switch process via the Current Account Switch
    Service is completed and all previous direct debits and standing orders have been
    successfully migrated. If a customer closes their old account manually rather
    than using the formal switch process, they will not be eligible for the £175 payment.


    **Payment and Transaction Limits**

    To prevent fraud and ensure stability, the Wrenfield Current Account has daily
    limits on outgoing transfers. While these are tailored to the customer''s typical
    usage, significant spikes in transaction volume or value may trigger a temporary
    hold for verification. Under our ''verify-first'' policy, full identity authentication
    is required before any state-changing action or the release of a blocked high-value
    payment.


    **Account Status Edge Cases**

    - **Dormancy:** Accounts with no customer-initiated activity for a prolonged period
    may be marked as dormant, restricting digital access until identity is re-verified.

    - **FSCS Protection:** Ensure customers are aware that their deposits are protected
    by the FSCS up to £120,000 per person, and up to £1.4 million for temporary high
    balances.

    - **Account Freezes:** We may freeze an account if we detect patterns indicative
    of APP scams or unauthorised access. These freezes are lifted only after rigorous
    identity authentication.


    For further details on the legal obligations of the bank and the customer, refer
    to Wrenfield Current Account — account agreement.'
  domain: retail_banking
  product_category: current_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 61f9a4ff-38ce-5803-96b2-29c7058c12f3
  title: Wrenfield Current Account — cost and charges
  body: '**Does the Wrenfield Current Account have a monthly maintenance fee?**

    No. We believe essential banking should be accessible to everyone, which is why
    the Wrenfield Current Account carries a £0 monthly account fee.


    **Are there costs associated with borrowing via an overdraft?**

    Yes. If you use an arranged overdraft, interest is charged on the amount borrowed
    at a rate of 39.9%. This interest is calculated daily and applied monthly.


    **Is there a cost to switch my account to Wrenfield Bank?**

    There is no cost to switch. In fact, we provide a £175 switching incentive to
    customers who move their banking to us using the streamlined switch process.


    For a full breakdown of all potential charges, please see Wrenfield Current Account
    — fee schedule.'
  domain: retail_banking
  product_category: current_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 1e50eb6c-6b62-5646-bd38-84cbd9d9fe95
  title: Wrenfield Current Account — check status or history
  body: 'If you need to review your recent spending or confirm your current balance
    for the Wrenfield Current Account, please follow these steps.


    **What you will need before starting**

    To ensure the security of your assets, you must be ready to complete our identity
    authentication process. Have your security credentials or a valid form of government-issued
    photo ID available if you are visiting a branch.


    **Step-by-Step Process**


    1. **Request the information:** Tell us that you would like to check your current
    balance or view your transaction history. You can do this through our digital
    channels or by speaking with us over the phone or in a branch.

    2. **Complete identity verification:** In line with our ''verify-first'' stance,
    we will ask you a series of security questions or request a digital authentication
    check. This is to prevent unauthorised access to your financial data.

    3. **Specify the timeframe:** Tell us the specific period you wish to review (e.g.,
    the last 30 days or a specific calendar month). If you require a formal document,
    ask for a monthly statement.

    4. **Receive your data:** We will then provide your current balance and the list
    of transactions. If you requested a statement, we will confirm the delivery method
    (digital or post).


    **How you know it worked**

    You will have a clear view of your available funds and a chronological list of
    your debits and credits. If you have received a statement, it will be stamped
    with the Wrenfield Bank seal and contain your account details and the period covered.


    For more information on the basic features of your account, you may refer to Wrenfield
    Current Account — overview.'
  domain: retail_banking
  product_category: current_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: wrenfield_bank
- id: 41d9f1c4-248d-58bd-9296-1550850e79b3
  title: Wrenfield Current Account — a declined or blocked action
  body: 'If you have attempted to make a payment or transfer from your Wrenfield Current
    Account and the action was declined or blocked, please review the following information.


    **Common Symptoms**

    - A digital transaction is marked as ''Declined'' or ''Failed''.

    - A payment is ''Pending'' for an unusually long time without completing.

    - You receive a notification that your account has been temporarily restricted.


    **Likely Causes**

    - **Security Trigger:** Our systems may have flagged the transaction as unusual
    or indicative of a scam, triggering an automatic block to protect your funds.

    - **Insufficient Funds:** The transaction may exceed your available balance, including
    any arranged overdraft limit.

    - **Verification Requirement:** A state-changing action may have been blocked
    because our ''verify-first'' protocol requires updated identity authentication.

    - **Daily Limits:** You may have reached the maximum daily transfer limit for
    the account.


    **How to Resolve**

    1. **Check your balance:** Ensure you have sufficient funds for the transaction.
    If you are relying on an overdraft, remember that these are subject to a 39.9%
    interest rate.

    2. **Verify your identity:** If the block is security-related, tell us you wish
    to authenticate your identity. Once we have successfully verified you, we can
    typically lift the restriction immediately.

    3. **Review the transaction details:** Ensure the recipient''s details are correct.
    If you suspect you have been targeted by a scam, tell us immediately so we can
    initiate our fraud protection protocols.


    **When to Escalate**

    If the block persists after verification, we will raise a case with our senior
    management team for a manual review. You will be notified of the outcome via your
    preferred contact method. For further guidance on staying safe, see Wrenfield
    Current Account — account security best practices.'
