  institution_id: wrenfield_bank
- id: 50d7bd46-8570-5c00-b908-0efb4e56ea64
  title: Wrenfield Easy Access Cash ISA — qualification tiers
  body: 'This matrix defines the eligibility requirements for opening and maintaining
    a Wrenfield Easy Access Cash ISA. Support agents should use these criteria to
    determine if a prospective customer can proceed with an application.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a permanent UK resident | Eligible to Apply |

    | Identity | Must provide valid, government-issued photo ID | Eligible to Apply
    |

    | Annual Contribution | Total contributions across all providers ≤ £20,000 | Eligible
    to Deposit |

    | Annual Contribution | Total contributions across all providers > £20,000 | Ineligible
    for further deposits this tax year |

    | Age (Standard) | 18 years or older | Eligible to Open |

    | Account Security | Must pass full ''verify-first'' authentication | Eligible
    for Account Activation |


    All eligible customers will receive an annual interest rate of 2.85% on their
    balance. For documentation requirements, please see the Wrenfield Easy Access
    Cash ISA — eligibility requirements document.'
