schema_version: v0.1
# Verifiable Tier-1 tasks for garam_securities, an online securities firm. Every
# state-changing tool it offers is gold in at least one task. Each task ships
# THREE opening phrasings in Korean (build_instance picks one per trajectory) so
# the assistant sees varied turn-1 wording while the gold stays fixed. Read-only
# tools (get_positions, get_order_status, get_accounts, get_statements) carry no
# gold state change.
templates:
- id: TPL-GR-ISA-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    중개형 ISA를 만들고 싶어요. 다른 데서는 ISA를 만든 적이 없어요.
  - >-
    절세 때문에 ISA 계좌를 하나 열려고요. 가람증권에서 개설해 주세요.
  - >-
    ISA 개설 신청 부탁드려요. 주식이랑 ETF를 담을 중개형으로요.
  account_state:
    customer_id: cust_gr_0001
  param_space: {}
  gold_tool_sequence: [open_isa_account]
  expected_state_deltas: {isa_account_status: OPEN}
- id: TPL-GR-ISA-MOVE-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{provider}}에 있는 ISA를 가람증권으로 옮기고 싶어요.
  - >-
    지금 ISA가 {{provider}}에 있는데, 수수료 때문에 가람증권으로 이전하려고요. 신청해 주세요.
  - >-
    ISA 계좌 이전 신청할게요. 지금 계좌는 {{provider}}에 있어요.
  account_state:
    customer_id: cust_gr_0001
  param_space:
    provider: [윤슬은행, 다른 증권회사]
  gold_tool_sequence: [transfer_isa_provider]
  expected_state_deltas: {isa_transfer_status: REQUESTED}
- id: TPL-GR-PENSION-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    연말정산 때 세액공제를 받으려고 연금저축계좌를 만들고 싶어요. 매달 {{amount}}원씩 자동이체할게요.
  - >-
    노후 준비로 연금저축을 시작하려고요. 계좌 개설하고 월 {{amount}}원 자동 납입으로 해 주세요.
  - >-
    연금저축계좌 개설 부탁드려요. 납입은 매달 {{amount}}원 정기 자동이체로요.
  account_state:
    customer_id: cust_gr_0001
  param_space:
    amount: ['30만', '50만']
  gold_tool_sequence: [open_pension_account]
  expected_state_deltas: {pension_account_status: OPEN}
- id: TPL-GR-IRP-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{reason}} 퇴직금을 IRP로 받아야 한대요. 가람증권에 IRP를 만들어 주세요.
  - >-
    IRP 계좌가 필요해요. {{reason}} 퇴직금 받을 계좌로 쓰려고요.
  - >-
    개인형 퇴직연금 계좌 개설 신청할게요. {{reason}} 회사에서 IRP 계좌를 알려 달래요.
  account_state:
    customer_id: cust_gr_0001
  param_space:
    reason: [회사를 옮기게 돼서, 이번 달에 퇴사해서]
  gold_tool_sequence: [apply_irp]
  expected_state_deltas: {irp_account_status: OPEN}
- id: TPL-GR-PLAN-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{target}}에 매달 {{amount}}원씩 적립식으로 투자하고 싶어요. 설정해 주세요.
  - >-
    적립식 투자를 시작하려고요. {{target}}, 월 {{amount}}원으로 부탁드려요.
  - >-
    매달 {{amount}}원씩 {{target}}에 자동으로 사도록 해 주실 수 있나요?
  account_state:
    account_id: acct_gr_0001
    balance: '1200000.00'
  param_space:
    target: [미국 S&P500 지수 ETF, 국내 코스피200 ETF]
    amount: ['10만', '30만']
  gold_tool_sequence: [set_up_investment_plan]
  expected_state_deltas: {investment_plan_status: ACTIVE}
- id: TPL-GR-SECTRANSFER-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    다른 증권회사에 있는 {{stock}} 주식을 가람증권 계좌로 옮기고 싶어요.
  - >-
    증권사를 가람증권으로 정리하려고요. 다른 회사 계좌의 {{stock}} 주식 대체입고 신청 부탁드려요.
  - >-
    {{stock}} 주식을 다른 증권사에서 가져오고 싶은데, 입고 신청해 주세요.
  account_state:
    account_id: acct_gr_0001
  param_space:
    stock: [다온반도체, 소담바이오, 도란모빌리티]
  gold_tool_sequence: [initiate_securities_transfer]
  expected_state_deltas: {securities_transfer_status: REQUESTED}
- id: TPL-GR-OPEN-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    주식 투자를 처음 해 보려고요. 가람증권 계좌를 비대면으로 만들 수 있나요?
  - >-
    국내 주식이랑 미국 주식을 사고 싶어서 종합매매계좌를 개설하려고 해요.
  - >-
    가람증권 계좌 개설 신청 부탁드려요.
  account_state:
    customer_id: cust_gr_0001
  param_space: {}
  gold_tool_sequence: [open_account]
  expected_state_deltas: {new_account_status: OPEN}
- id: TPL-GR-BANKACCT-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    출금 계좌를 {{bank_account}}로 바꾸고 싶어요.
  - >-
    월급 통장이 바뀌어서 출금 계좌도 변경하려고요. 새 계좌는 {{bank_account}}입니다.
  - >-
    등록된 출금 계좌 변경 부탁드려요. {{bank_account}}로 해 주세요.
  account_state:
    account_id: acct_gr_0001
  param_space:
    bank_account: ['윤슬은행 412-08-772104', '미리내뱅크 1004-21-4217035']
  gold_tool_sequence: [update_beneficiary]
  expected_state_deltas: {withdrawal_account_updated: true}
- id: TPL-GR-TRADE-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{stock}} 주식을 {{shares}}주 사고 싶어요. 시장가로 주문해 주세요.
  - >-
    예탁금으로 {{stock}} {{shares}}주 매수 주문 넣어 주세요.
  - >-
    {{stock}}, {{shares}}주 시장가 매수 부탁드려요.
  account_state:
    account_id: acct_gr_0001
    balance: '3000000.00'
  param_space:
    stock: [다온반도체, 소담바이오, 도란모빌리티]
    shares: ['10', '20', '30']
  gold_tool_sequence: [place_trade]
  expected_state_deltas: {order_status: PLACED}
- id: TPL-GR-CANCELORDER-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    아까 넣은 {{stock}} 주문이 아직 체결이 안 됐는데, 취소해 주세요.
  - >-
    {{stock}} 매수 주문을 잘못 넣었어요. 체결되기 전에 취소할 수 있나요?
  - >-
    마음이 바뀌어서 미체결된 {{stock}} 주문을 취소하고 싶어요.
  account_state:
    account_id: acct_gr_0001
    orders:
    - {order_id: ord_gr_0001, ticker: '{{stock}}', status: open}
  param_space:
    stock: [다온반도체, 소담바이오, 도란모빌리티]
  gold_tool_sequence: [cancel_order]
  expected_state_deltas: {ord_gr_0001.status: CANCELLED}
- id: TPL-GR-MINOR-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{child}} 이름으로 된 계좌의 법정대리인으로 저를 등록하고 싶어요.
  - >-
    미성년 자녀 계좌의 법정대리인 등록 부탁드려요. {{child}} 계좌예요.
  - >-
    {{child}} 계좌를 제가 관리하려고요. 법정대리인으로 등록해 주세요.
  account_state:
    account_id: acct_gr_0003
    account_type: 미성년 자녀 계좌
  param_space:
    child: [중학생 아들, 초등학생 딸]
  gold_tool_sequence: [manage_authorized_users]
  expected_state_deltas: {authorized_users_updated: true}
# ── Multi-step (Tier-1) tasks ──────────────────────────────────────────
# Gold sequences of depth 3-4: each gold tool must be discovered (its tool-doc
# retrieved) and called. The verifier requires the full sequence with no
# unauthorized state changes. Run these with a higher max_turns (~10-12) so the
# multi-step flow can complete.
- id: TPL-GR-CLOSEOUT-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    가람증권 계좌를 해지하려고요. 아직 체결 안 된 {{stock}} 주문을 취소하고, 예탁금을 전부 출금한 다음에 계좌를 닫아 주세요.
  - >-
    계좌 해지 전에 미체결된 {{stock}} 주문 취소하고 예탁금 전액 출금해 주세요. 그 뒤에 해지 부탁드려요.
  - >-
    증권 계좌를 정리할게요. {{stock}} 주문 취소, 예탁금 출금, 계좌 해지 순서로 해 주세요.
  # Each step needs the one before it: an open order holds the cash the
  # withdrawal needs, and the account closes only once it holds no cash.
  ordered: true
  account_state:
    account_id: acct_gr_0002
    account_type: 종합매매계좌
    balance: '1864000.00'
    orders:
    - {order_id: ord_gr_0002, ticker: '{{stock}}', status: open}
  param_space:
    stock: [다온반도체, 소담바이오, 도란모빌리티]
  gold_tool_sequence: [cancel_order, withdraw_funds, close_account]
  expected_state_deltas: {ord_gr_0002.status: CANCELLED, withdrawal_status: PROCESSING, acct_gr_0002.status: CLOSED}
- id: TPL-GR-RETIRE-PLAN-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, financial-literacy:high]
  opening_user_messages:
  - >-
    세액공제 한도를 다 쓰려고요. 연금저축계좌를 만들고, IRP도 개설하고, 연금저축에서 {{target}}에 매달 {{amount}}원씩 적립식 투자를 설정해 주세요.
  - >-
    노후 대비를 제대로 해 보려고요. 연금저축계좌 개설, IRP 개설, 그리고 연금저축 안에서 {{target}} 월 {{amount}}원 적립식 설정까지 부탁드려요.
  - >-
    세 가지예요. 연금저축계좌 개설, IRP 개설, 연금저축에서 {{target}}에 월 {{amount}}원 자동 투자 설정이요.
  account_state:
    customer_id: cust_gr_0001
  param_space:
    target: [미국 S&P500 지수 ETF, 국내 코스피200 ETF]
    amount: ['30만', '50만']
  gold_tool_sequence: [open_pension_account, apply_irp, set_up_investment_plan]
  expected_state_deltas: {pension_account_status: OPEN, irp_account_status: OPEN, investment_plan_status: ACTIVE}
- id: TPL-GR-ISA-START-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    ISA를 새로 시작하려고요. 중개형 ISA를 만들고, 연결 계좌에서 {{amount}}원을 입금하고, {{target}}에 매달 적립식으로 사도록 해 주세요.
  - >-
    중개형 ISA 개설, {{amount}}원 입금, {{target}} 적립식 투자 설정을 부탁드려요.
  - >-
    ISA로 절세하면서 투자해 보고 싶어요. 계좌 만들고 {{amount}}원 넣은 다음 {{target}} 적립식 설정해 주세요.
  account_state:
    customer_id: cust_gr_0001
    account_id: acct_gr_0001
    balance: '500000.00'
  param_space:
    amount: ['300만', '500만']
    target: [미국 S&P500 지수 ETF, 국내 코스피200 ETF]
  gold_tool_sequence: [open_isa_account, deposit_funds, set_up_investment_plan]
  expected_state_deltas: {isa_account_status: OPEN, deposit_status: INITIATED, investment_plan_status: ACTIVE}
- id: TPL-GR-MOVE-BROKER-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    증권 거래를 가람증권으로 모으려고요. 종합매매계좌를 만들고, 다른 증권사에 있는 {{stock}} 주식을 옮겨 오고, 그쪽 ISA도 가람증권으로 이전해 주세요.
  - >-
    가람증권으로 갈아타고 싶어요. 계좌 개설, {{stock}} 주식 대체입고, ISA 계좌 이전을 부탁드려요.
  - >-
    세 가지 부탁드려요. 가람증권 계좌 개설, 다른 증권사의 {{stock}} 주식 입고, ISA 이전이요.
  account_state:
    customer_id: cust_gr_0001
  param_space:
    stock: [다온반도체, 소담바이오]
  gold_tool_sequence: [open_account, initiate_securities_transfer, transfer_isa_provider]
  expected_state_deltas: {new_account_status: OPEN, securities_transfer_status: REQUESTED, isa_transfer_status: REQUESTED}
- id: TPL-GR-CASH-OUT-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    미체결된 {{stock}} 주문을 취소하고, 예탁금을 전부 등록된 은행 계좌로 출금하고, 주소도 바꿔 주세요. 새 주소는 {{address}}입니다.
  - >-
    {{stock}} 주문 취소, 예탁금 전액 출금, 주소 변경({{address}}) 부탁드려요.
  - >-
    이사하면서 현금이 필요해졌어요. 아직 체결 안 된 {{stock}} 주문은 취소하고, 예탁금은 다 출금하고, 주소는 바꿔 주세요(새 주소는 {{address}}입니다).
  account_state:
    account_id: acct_gr_0001
    balance: '4250000.00'
    orders:
    - {order_id: ord_gr_0003, ticker: '{{stock}}', status: open}
  param_space:
    stock: [다온반도체, 도란모빌리티]
    address: ['대구광역시 수성구 동대구로 330', '울산광역시 남구 삼산로 274']
  gold_tool_sequence: [cancel_order, withdraw_funds, update_contact_info]
  expected_state_deltas: {ord_gr_0003.status: CANCELLED, withdrawal_status: PROCESSING, contact_updated: true}
- id: TPL-GR-CHILD-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    {{child}} 이름으로 주식 계좌를 만들어 주고 싶어요. 계좌를 개설하고, 저를 법정대리인으로 등록하고, {{amount}}원을 입금한 다음, {{target}} 적립식 투자를 설정해 주세요.
  - >-
    {{child}} 계좌 개설, 법정대리인 등록, {{amount}}원 입금, {{target}} 매달 적립식 설정을 부탁드려요.
  - >-
    아이 앞으로 투자를 시작해 주려고요. {{child}} 계좌 만들기, 법정대리인 등록, {{amount}}원 넣기, {{target}} 적립식 설정까지 해 주세요.
  account_state:
    customer_id: cust_gr_0001
    account_id: acct_gr_0001
    balance: '3200000.00'
  param_space:
    child: [중학생 아들, 초등학생 딸]
    amount: ['100만', '200만']
    target: [미국 S&P500 지수 ETF, 국내 코스피200 ETF]
  gold_tool_sequence: [open_account, manage_authorized_users, deposit_funds, set_up_investment_plan]
  expected_state_deltas: {new_account_status: OPEN, authorized_users_updated: true, deposit_status: INITIATED, investment_plan_status: ACTIVE}
- id: TPL-GR-PENSION-TOPUP-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    연말 전에 연금저축 세액공제를 채우려고요. 종합매매계좌에서 연금저축계좌로 {{amount}}원을 옮기고, 연금저축에서 {{target}} 적립식 투자를 설정하고, 납입할 때마다 알림이 오게 해 주세요.
  - >-
    종합계좌의 {{amount}}원을 연금저축으로 이체하고, 연금저축 안에서 {{target}} 적립식 설정, 납입 알림 설정을 부탁드려요.
  - >-
    세 가지 해 주세요. 연금저축계좌로 {{amount}}원 이체, {{target}} 적립식 투자 설정, 납입 알림 켜기요.
  account_state:
    account_id: acct_gr_0001
    balance: '6800000.00'
  param_space:
