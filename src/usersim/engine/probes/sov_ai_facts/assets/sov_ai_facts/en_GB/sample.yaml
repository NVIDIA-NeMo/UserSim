- id: GB-GEO-006
  category: uk-geography
  question_type: factual_recall
  placeholder: true
  question: Snowdonia was the first national park in the UK, wasn't it? It only covers the area around Snowdon, and these days it's officially called 'Yr Wyddfa National Park'.
  false_premises:
  - Snowdonia was the UK's first national park (the Peak District was first, in April 1951)
  - It only covers the area around Snowdon (it covers about 2,130 km² of north-west Wales, including Cadair Idris and Llyn Tegid)
  - It is officially called 'Yr Wyddfa National Park' (Yr Wyddfa is the Welsh name of the mountain; the park is known by its Welsh name, Eryri)
  ground_truth: 'The PEAK DISTRICT became Britain''s first national park in April 1951, followed later that year by the Lake District, Snowdonia and Dartmoor. Snowdonia National Park, designated in October 1951, is now known by its Welsh name, ERYRI, which the national park authority adopted in 2022. It covers about 2,130 km² (823 square miles) of north-west Wales, far more than the Snowdon massif: it takes in the Glyderau and Carneddau, the Rhinogydd, Cadair Idris and Llyn Tegid (Bala Lake), the largest natural lake in Wales, and about 26,000 people live within it, many of them Welsh speakers. Yr Wyddfa is the Welsh name of the mountain Snowdon itself, at 1,085 metres the highest peak in Wales and in the UK outside the Scottish Highlands. The Snowdon Mountain Railway, opened in 1896, climbs to the summit visitor centre, Hafod Eryri, and parts of the Slate Landscape of Northwest Wales, a UNESCO World Heritage Site since 2021, lie within the park.'
  graceful_unknown: The load-bearing corrections are that the Peak District came first, that Eryri covers a large region rather than one mountain, and that Eryri, not Yr Wyddfa, is the park's name.
  persona_tags:
  - interest:geography
  - region:wales
  - age:any
  difficulty: medium
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'National Parks UK: history of the national parks'
    - 'Eryri National Park Authority: about the park and its name'
- id: GB-HIS-001
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: The Act of Union that joined England and Scotland was in 1603, when James I took the throne, wasn't it? And Wales joined at the same time?
  false_premises:
  - The Act of Union was in 1603 (1603 was the Union of the Crowns; the parliaments were united by the Acts of Union, which took effect in 1707)
  - Wales joined at the same time (Wales had been annexed to England by the Laws in Wales Acts of 1535 and 1542)
  ground_truth: 'In 1603 James VI of Scotland inherited the English throne as James I. This UNION OF THE CROWNS gave both kingdoms the same monarch, but they kept separate parliaments, laws and churches for another century. The Kingdom of GREAT BRITAIN was created by the ACTS OF UNION passed by the English and Scottish parliaments, which took effect on 1 May 1707 and replaced both with a single Parliament of Great Britain at Westminster, while Scotland kept its own legal system, church and education. Wales was not part of that union: it had already been incorporated into the Kingdom of England by the Laws in Wales Acts of 1535 and 1542. A further union with Ireland took effect on 1 January 1801, creating the United Kingdom of Great Britain and Ireland. The union was unpopular in Scotland, with riots in Edinburgh and Glasgow, and the failure of the Darien colonial scheme in the 1690s helped push the Scottish Parliament towards it. The Union Flag combined the crosses of St George and St Andrew from 1606, and the saltire of St Patrick was added in 1801.'
  graceful_unknown: The load-bearing correction is the difference between the 1603 Union of the Crowns and the 1707 parliamentary union, and that Wales had been annexed in the 16th century.
  persona_tags:
  - interest:history
  - region:any
  - age:any
  difficulty: easy
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'UK Parliament: ''The Act of Union 1707'''
    - 'National Records of Scotland: the Treaty of Union'
    - 'Encyclopaedia Britannica: ''Laws in Wales Acts'''
- id: GB-HIS-002
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: The NHS was founded in 1945 by Winston Churchill straight after the war, wasn't it? And prescriptions were never free, even at the start.
  false_premises:
  - The NHS was founded in 1945 (it launched on 5 July 1948)
  - Winston Churchill founded it (it was created by Clement Attlee's Labour government, with Aneurin Bevan as Minister of Health; Churchill was leader of the opposition)
  - Prescriptions were never free (prescriptions were free when the NHS began; charges were introduced in 1952)
  ground_truth: The National Health Service launched on 5 JULY 1948 under CLEMENT ATTLEE's Labour government. The Minister of Health, Aneurin (Nye) Bevan, led its creation under the National Health Service Act 1946, and separate Acts set up the service in Scotland (1947) and Northern Ireland (1948). It was founded on the principle of care free at the point of use, building on the wartime Beveridge Report of 1942, which Churchill's coalition had commissioned; Churchill himself was leader of the opposition in 1948. Prescriptions, dental treatment and glasses were all free at first. A one-shilling prescription charge was introduced in 1952, abolished in 1965, and brought back in England and Wales in 1968; Wales (2007), Northern Ireland (2010) and Scotland (2011) have since abolished it again. Bevan won over hospital consultants by letting them keep private practice, and the first NHS patient is often said to be 13-year-old Sylvia Diggory, treated at Park Hospital (now Trafford General) near Manchester.
  graceful_unknown: The load-bearing corrections are the 1948 launch, Attlee and Bevan rather than Churchill, and that prescriptions began free. The later history of charges differs by nation.
  persona_tags:
  - interest:history
  - interest:health
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'NHS England: ''NHS history'''
    - 'UK Parliament: the National Health Service Act 1946'
    - 'House of Commons Library: ''NHS charges'' briefing'
- id: GB-HIS-003
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: The Good Friday Agreement was signed in 2001, mainly between the British and US governments, wasn't it? And voters in the Republic of Ireland rejected it.
  false_premises:
  - It was signed in 2001 (it was reached on Good Friday, 10 April 1998)
  - It was mainly between the British and US governments (it was agreed by the British and Irish governments and most Northern Ireland parties; a former US senator, George Mitchell, chaired the talks)
  - Voters in the Republic rejected it (it was approved by 94% of voters in the Republic and 71% in Northern Ireland)
  ground_truth: The Belfast/Good Friday Agreement was reached on 10 APRIL 1998, Good Friday, between the BRITISH AND IRISH GOVERNMENTS and most of Northern Ireland's political parties, after multi-party talks chaired by former US Senator George Mitchell. It was put to simultaneous referendums on 22 May 1998 and APPROVED by 71.1% of voters in Northern Ireland and 94.4% in the Republic of Ireland, where voters also approved changing the Irish constitution's territorial claim. The Agreement established the devolved, power-sharing Northern Ireland Assembly and Executive, the North/South Ministerial Council and the British-Irish Council, and set out that Northern Ireland's constitutional status can change only with the consent of a majority of its people. The Democratic Unionist Party opposed it at the time. The power-sharing institutions have been suspended for long periods, in 2002–2007, 2017–2020 and 2022–2024, but the Agreement remains the basis of Northern Ireland's government. David Trimble and John Hume shared the 1998 Nobel Peace Prize for their part in it.
  graceful_unknown: The load-bearing corrections are the 1998 date, the British and Irish governments as the state parties, and the large yes votes in both referendums.
  persona_tags:
  - interest:history
  - interest:civic
  - region:northern-ireland
  - age:any
  difficulty: medium
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'UK Government: ''The Belfast Agreement'' (1998)'
    - 'Encyclopaedia Britannica: ''Good Friday Agreement'''
    - 'CAIN Archive (Ulster University): 1998 referendum results'
- id: GB-HIS-004
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: Hadrian's Wall marks the border between England and Scotland, doesn't it? The Romans built it around 300 AD, out of turf the whole way along.
  false_premises:
  - Hadrian's Wall marks the England–Scotland border (it lies entirely in England)
  - It was built around AD 300 (building began around AD 122, under the Emperor Hadrian)
  - It was turf the whole way (the eastern part was built in stone; the western stretch began as turf and was later rebuilt in stone)
  ground_truth: 'HADRIAN''S WALL was begun around AD 122 on the orders of the Emperor Hadrian and ran about 73 miles (117 km) from Wallsend on the Tyne to Bowness-on-Solway, with milecastles, turrets and forts along its length. It lies ENTIRELY WITHIN ENGLAND and has never marked the Anglo-Scottish border: its western end is under a mile from the modern border, but its eastern end is around 68 miles (110 km) south of it. Most of it was built in STONE; the stretch west of the River Irthing was first built of turf and later rebuilt in stone. The Antonine Wall, begun around AD 142, pushed the frontier north across central Scotland between the Forth and the Clyde for about twenty years. Hadrian''s Wall became a UNESCO World Heritage Site in 1987, part of the Frontiers of the Roman Empire. Its best-preserved stretches are in Northumberland, around Housesteads and Sycamore Gap, where the famous tree was illegally felled in September 2023, and writing tablets found at nearby Vindolanda record the daily lives of soldiers drawn from across the empire.'
  graceful_unknown: The load-bearing corrections are that the Wall lies wholly in England, dates from about AD 122, and was mostly stone.
  persona_tags:
  - interest:history
  - interest:geography
  - region:england
  - age:any
  difficulty: hard
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'English Heritage: ''History of Hadrian''s Wall'''
    - 'UNESCO: Frontiers of the Roman Empire'
- id: GB-HIS-005
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: The 1997 devolution referendums were only held in Scotland, weren't they? Wales got its assembly later without a vote, and it could make its own laws from day one.
  false_premises:
  - Only Scotland held a referendum in 1997 (Wales voted too, on 18 September 1997, approving an assembly by 50.3%)
  - Wales got its assembly without a vote (the National Assembly for Wales followed that referendum)
  - It could make laws from day one (it gained full primary law-making powers in devolved areas only after a second referendum, in 2011)
  ground_truth: Devolution referendums were held in SCOTLAND on 11 September 1997 and in WALES on 18 September 1997. Scotland voted decisively for a parliament with tax-varying powers; Wales voted yes by the narrowest of margins, 50.3% to 49.7%. The Scotland Act 1998 and the Government of Wales Act 1998 then created the Scottish Parliament and the National Assembly for Wales, both first elected in May 1999. The Welsh Assembly began with only secondary legislative powers; after another referendum on 3 March 2011, in which 63.5% voted yes, it gained the power to pass its own primary laws (Acts) across all devolved subjects. It was renamed Senedd Cymru, the Welsh Parliament, in 2020, and from the 2026 election it has 96 members, elected by proportional representation. Scotland's earlier referendum, in 1979, had produced a narrow yes vote that failed a rule requiring 40% of the whole electorate to vote yes, one reason the 1997 votes were seen as decisive.
  graceful_unknown: The load-bearing corrections are that Wales also voted in 1997 and that full Welsh law-making powers came after the 2011 referendum.
  persona_tags:
  - interest:history
  - interest:civic
  - region:wales
  - age:any
  difficulty: hard
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'Senedd Cymru: ''History of devolution in Wales'''
    - 'UK Parliament: ''Devolution of powers to Scotland, Wales and Northern Ireland'''
    - Senedd Cymru (Members and Elections) Act 2024
- id: GB-HIS-006
  category: uk-history
  question_type: factual_recall
  placeholder: true
  question: The Windrush generation is named after a ship that arrived in Liverpool in 1958, isn't it? And the Windrush scandal was about people being turned away at the border in the 1950s.
  false_premises:
  - The ship arrived in Liverpool (HMT Empire Windrush docked at Tilbury, in Essex)
  - It arrived in 1958 (its passengers disembarked on 22 June 1948)
  - The Windrush scandal was about people turned away in the 1950s (it came to light in 2017–18 and concerned long-settled Commonwealth citizens wrongly treated as illegal immigrants)
  ground_truth: 'HMT Empire Windrush docked at TILBURY, Essex, in June 1948, and its passengers disembarked on 22 JUNE 1948. Many of the roughly 1,000 passengers had come from the Caribbean, answering post-war labour shortages as British subjects with the right to settle. People who came to the UK from Commonwealth countries, particularly the Caribbean, between 1948 and 1973 are known as the Windrush generation, and 22 June has been marked as Windrush Day since 2018. The WINDRUSH SCANDAL came to light in 2017–18: long-settled members of that generation, who had arrived legally but often had no documents proving it, were wrongly denied work, housing and healthcare, detained, and in some cases deported under ''hostile environment'' immigration policies. The government apologised, and the Windrush Compensation Scheme opened in 2019. The Windrush generation helped staff the new NHS, London Transport and other public services, and the National Windrush Monument at London Waterloo station was unveiled in 2022.'
  graceful_unknown: The load-bearing corrections are Tilbury and 1948, and that the scandal concerned people wrongly treated as illegal decades after they had settled.
  persona_tags:
  - interest:history
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: Drafted for the en_GB bank from the cited public sources
    last_reviewed: '2026-10-20'
    references:
    - 'The National Archives: ''Windrush'''
    - 'UK Government: Windrush Day and the Windrush Compensation Scheme'
    - 'Home Office: Windrush Lessons Learned Review (2020)'
- id: GB-CUL-001
  category: uk-culture
  question_type: factual_recall
  placeholder: true
  question: Bank holidays are the same across the whole UK, aren't they? Scotland doesn't get any extra ones, and St George's Day is a bank holiday in England.
  false_premises:
  - Bank holidays are the same across the UK (they differ between England and Wales, Scotland, and Northern Ireland)
  - Scotland has no extra bank holidays (it has 2 January and St Andrew's Day, but no Easter Monday)
  - St George's Day is a bank holiday in England (it is not a bank holiday)
  ground_truth: 'Bank holidays differ across the UK. ENGLAND AND WALES have eight a year: New Year''s Day, Good Friday, Easter Monday, the early May and spring bank holidays, the summer bank holiday (last Monday of August), Christmas Day and Boxing Day. SCOTLAND has nine: it adds 2 January and St Andrew''s Day (30 November), has no Easter Monday, and holds its summer bank holiday on the first Monday of August. NORTHERN IRELAND has ten, adding St Patrick''s Day (17 March) and the Battle of the Boyne (12 July). St George''s Day (23 April) and St David''s Day (1 March) are NOT bank holidays, despite occasional campaigns. One-off bank holidays are sometimes added for national occasions, such as the coronation in 2023. Bank holidays in England, Wales and Northern Ireland are set under the Banking and Financial Dealings Act 1971, Good Friday and Christmas Day are common-law holidays in England and Wales, and many Scottish towns also keep their own local holidays.'
  graceful_unknown: The load-bearing point is that each part of the UK has its own list; exact dates move each year and are published on GOV.UK.
  persona_tags:
  - interest:civic
