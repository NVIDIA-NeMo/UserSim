- id: GB-LAB-002
  category: uk-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Full-time workers get 20 days' paid holiday a year by law, on top of all the bank holidays, don't they? Part-timers don't get paid holiday, and you lose anything you haven't taken when you leave a job.
  false_premises:
  - The minimum is 20 days on top of bank holidays (it is 5.6 weeks, 28 days for a five-day week, and bank holidays can be counted within it)
  - Part-timers don't get paid holiday (they get 5.6 weeks pro rata)
  - You lose untaken holiday when you leave (you must be paid for statutory holiday you have built up but not taken)
  ground_truth: Almost all workers in Great Britain are entitled to 5.6 WEEKS' paid holiday a year, which is 28 days for someone working five days a week, capped at 28 days. Employers can INCLUDE the bank and public holidays within that 28, so there is no legal right to bank holidays off on top, though many contracts give more. PART-TIME workers get the same 5.6 weeks PRO RATA, so someone working three days a week gets 16.8 days, and irregular-hours and part-year workers have accrued holiday calculated as 12.07% of hours worked for leave years from April 2024. When a job ends, the employer must PAY for any statutory holiday built up but not taken. Northern Ireland has an equivalent entitlement under its own regulations. Workers keep building up statutory holiday while on sick leave or family leave, and an employer can require workers to take holiday at particular times if it gives enough notice.
  graceful_unknown: The load-bearing points are the 5.6-week minimum including bank holidays, pro-rata rights for part-timers, and pay in lieu of untaken leave on leaving.
