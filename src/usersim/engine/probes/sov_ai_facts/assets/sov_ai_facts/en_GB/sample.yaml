- id: GB-FIN-005
  category: uk-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Scottish and Northern Irish banknotes are printed by the Bank of England and are legal tender in England, aren't they? Northern Ireland uses the euro alongside sterling anyway.
  false_premises:
  - They are printed by the Bank of England (they are issued by commercial banks in Scotland and Northern Ireland)
  - They are legal tender in England (they are not legal tender anywhere in the UK, though they are legal currency)
  - Northern Ireland uses the euro (Northern Ireland uses sterling; euros are not legal tender there)
  ground_truth: 'Banknotes in SCOTLAND and NORTHERN IRELAND are issued by COMMERCIAL BANKS rather than the Bank of England: in Scotland by the Bank of Scotland, the Royal Bank of Scotland and Clydesdale Bank, and in Northern Ireland by Bank of Ireland, Danske Bank and Ulster Bank. Each note is fully backed by Bank of England notes, coin or funds the issuing bank holds at the Bank of England, under the Banking Act 2009. They are ''legal currency'' but NOT ''LEGAL TENDER'' in England and Wales, nor in Scotland and Northern Ireland themselves, where no banknotes at all are legal tender, so shops are not obliged to accept them, though most do. ''Legal tender'' has a narrow legal meaning about settling debts. Northern Ireland uses STERLING; some businesses near the border accept euros, but the euro is not legal tender there. The notes carry their own designs and circulate alongside Bank of England notes; shops in England occasionally refuse them, but banks will exchange them.'
  graceful_unknown: The load-bearing corrections are that commercial banks issue these notes, that they are not legal tender, and that Northern Ireland uses sterling.
