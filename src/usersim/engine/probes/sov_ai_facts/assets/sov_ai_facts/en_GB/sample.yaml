- id: GB-HEA-006
  category: uk-health-systems
  question_type: factual_recall
  placeholder: true
  question: The UK only switched to an opt-out system for organ donation last year, didn't it? Wales still uses opt-in, and under opt-out your family can't object.
  false_premises:
  - 'The UK switched last year (each nation changed separately: Wales in December 2015, England in May 2020, Scotland in March 2021 and Northern Ireland in June 2023)'
  - Wales still uses opt-in (Wales was the first UK nation to introduce deemed consent, in December 2015)
  - Families can't object (families are always consulted, and donation does not go ahead if they say the person would not have wanted it)
  ground_truth: 'Organ donation in all four UK nations now works on DEEMED CONSENT, an opt-out system, for most adults, introduced separately: WALES in December 2015 under the Human Transplantation (Wales) Act 2013, England in May 2020 (Max and Keira''s Law), Scotland in March 2021 and Northern Ireland in June 2023 (Daithí''s Law). Adults are treated as willing donors unless they have recorded a decision not to donate or belong to an excluded group, such as people who lack capacity or have not lived in the country for a year. FAMILIES are still always CONSULTED by specialist nurses, and donation will not go ahead if the family provides information that the person would not have wanted to donate. Anyone can record a decision either way on the NHS Organ Donor Register. Some transplants, such as faces and limbs, are never covered by deemed consent and need express consent, and religious and cultural beliefs are taken into account when families are approached.'
  graceful_unknown: The load-bearing corrections are the separate national dates, with Wales first in 2015, and the family's continued role.
