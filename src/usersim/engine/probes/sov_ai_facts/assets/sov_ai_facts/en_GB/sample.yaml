  question: The State Pension age is 65 for everyone right now, isn't it? You get the full new State Pension after ten years of National Insurance, and it's means-tested anyway.
  false_premises:
  - The State Pension age is 65 (it has been 66 for men and women since October 2020, and is rising to 67 between 2026 and 2028)
  - Ten years of contributions gets the full new State Pension (the full amount needs 35 qualifying years; ten is the minimum for any)
  - It is means-tested (it is not; it depends on your National Insurance record)
  ground_truth: 'The STATE PENSION AGE reached 66 for both men and women in October 2020, after women''s pension age had first been equalised with men''s at 65. It is rising to 67 for people born on or after 6 April 1960, with the change phased in between 2026 and 2028, and a further rise to 68 is legislated for 2044 to 2046, subject to review. The NEW STATE PENSION, for people reaching pension age since April 2016, needs 35 QUALIFYING YEARS of National Insurance contributions or credits for the full amount (£230.25 a week from April 2025) and at least 10 years for any payment. It is NOT MEANS-TESTED: savings and other income do not reduce it, though it is taxable, and Pension Credit is a separate, means-tested top-up for people on low incomes. People can fill gaps in their National Insurance record with voluntary contributions, usually for the past six years, and can defer the State Pension in return for a higher weekly amount; it is not paid automatically and has to be claimed.'
  graceful_unknown: The load-bearing corrections are the current age of 66 rising to 67, the 35-year requirement, and that it is not means-tested. Amounts rise each April, and anyone can check their own forecast on GOV.UK.
