  ground_truth: 'Council tax bands in ENGLAND are still based on what a property would have sold for on 1 APRIL 1991, in eight bands from A to H, and SCOTLAND also uses 1991 values. WALES carried out a revaluation using values at 1 April 2003, in force since 2005, and has nine bands, A to I; the Welsh Government has legislated for a further revaluation. NORTHERN IRELAND has no council tax: households pay domestic rates based on capital values at 1 January 2005. Bills assume two adults: full-time STUDENTS are disregarded when counting residents, a home occupied only by full-time students is EXEMPT, and a single adult gets a 25% discount. People on low incomes may get council tax reduction from their council. England''s bands have never been revalued, so a newer home is placed in the band its estimated 1991 value would have fallen into. Owners who think their band is wrong can challenge it with the Valuation Office Agency in England and Wales, or their local assessor in Scotland.'
