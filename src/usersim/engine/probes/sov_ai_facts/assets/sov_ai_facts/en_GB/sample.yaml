- id: GB-EDU-004
  category: uk-education
  question_type: factual_recall
  placeholder: true
  question: In England you can leave education completely at 16 now, can't you? The leaving age went back down, and if you do stay on, it has to be A levels at a sixth form.
  false_premises:
  - You can leave education completely at 16 in England (young people must stay in education or training until 18, though they can leave school at 16)
  - The leaving age went back down (the participation age rose to 18 in 2015 and has not been lowered)
  - Staying on means A levels at a sixth form (apprenticeships, T levels, college courses and part-time study with work all count)
  ground_truth: 'In ENGLAND, young people can leave SCHOOL on the last Friday in June if they will be 16 by the end of the summer holidays, but they must then stay in some form of EDUCATION OR TRAINING until 18. The options are wide: full-time study at a school sixth form or college, including A levels, T levels or vocational qualifications; an APPRENTICESHIP or traineeship; or part-time education or training alongside at least 20 hours a week of work or volunteering. The participation age rose to 17 in 2013 and to 18 in 2015 and has NOT been lowered, though there are no fines for young people who do not take part. In Scotland, Wales and Northern Ireland, young people can leave education at 16. Councils must track young people''s participation and support those not in education, employment or training, and students aged 16 to 19 on low incomes can get help with costs from the 16 to 19 Bursary Fund.'
  graceful_unknown: The load-bearing corrections are the duty to stay in education or training to 18 in England and the range of routes that count.
