  - The English charge is about £15 an item (it is £9.90 an item, the level since May 2024)
  - Pensioners pay in England (everyone aged 60 or over gets free prescriptions in England)
  ground_truth: 'Prescriptions are FREE for everyone in Scotland (since 2011), Wales (since 2007) and Northern Ireland (since 2010). In ENGLAND there is a charge per item of £9.90, the level since May 2024, which was kept unchanged in 2025. Many people in England are exempt, and around nine in ten items are dispensed free: children under 16 and young people aged 16 to 18 in full-time education, everyone aged 60 or over, people who are pregnant or had a baby in the past 12 months, people on certain benefits or with low incomes, and people with certain medical conditions who hold a medical exemption certificate. A prescription prepayment certificate caps the cost for anyone who needs many items. Scotland, Wales and Northern Ireland phased their charges out over several years, while England''s charge is reviewed each spring. Since 2024, pharmacies in England have also been able to treat seven common conditions under Pharmacy First, including supplying some prescription-only medicines without a GP appointment.'
  graceful_unknown: The load-bearing points are that only England charges, the per-item amount, and the age-60 exemption. The charge is reviewed each year, so check the current figure on the NHS website.
