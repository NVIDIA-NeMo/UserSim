- id: GB-DIG-002
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: Under UK data protection law a company has 90 days to answer a subject access request, doesn't it? It can charge a £10 fee, and it can refuse if you won't say why you want the data.
  false_premises:
  - They have 90 days (they must respond within one month, extendable by up to two further months for complex or numerous requests)
  - They can charge a £10 fee (requests are normally free; the £10 fee ended in 2018)
  - They can refuse if you won't give a reason (you do not have to say why you are asking)
  ground_truth: 'Under the UK GDPR and the Data Protection Act 2018, everyone has the RIGHT OF ACCESS to their personal data. Organisations must respond to a subject access request without undue delay and at the latest within ONE MONTH, extendable by up to two further months if the request is complex or one of many, in which case they must say so within the first month. Requests are normally FREE: the £10 fee under the Data Protection Act 1998 ended in May 2018, though a reasonable fee can be charged for requests that are manifestly unfounded or excessive, or for extra copies. Requesters do NOT have to give a REASON, and a request can be made in writing, by email or verbally. Complaints go to the UK''s data protection regulator, the Information Commissioner. Organisations can withhold some information, for example where releasing it would reveal another person''s data or it is legally privileged, and requests can be made to any organisation holding your data, including employers and public bodies.'
  graceful_unknown: The load-bearing corrections are the one-month deadline, no standard fee, and no need to give a reason.
