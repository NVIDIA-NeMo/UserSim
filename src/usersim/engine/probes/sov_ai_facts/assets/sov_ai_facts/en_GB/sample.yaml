    - 'Information Commissioner''s Office: children and the UK GDPR'
- id: GB-DIG-006
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: Signing up to the Telephone Preference Service costs a small yearly fee, doesn't it? It blocks every unwanted call, including scam calls from abroad, and it stops marketing texts and emails too.
  false_premises:
  - TPS costs a yearly fee (registration is free)
  - It blocks every unwanted call (it makes unsolicited live sales calls to registered numbers unlawful without consent, but does not technically block calls, and scammers ignore it)
  - It stops marketing texts and emails (TPS covers calls; marketing texts and emails need prior consent under separate rules)
  ground_truth: 'The TELEPHONE PREFERENCE SERVICE is the UK''s FREE official register for opting out of unsolicited sales and marketing calls; registration takes up to 28 days to take effect. Under the Privacy and Electronic Communications Regulations, organisations must not make live marketing calls to registered numbers unless the person has consented, and the Information Commissioner can fine those that do. TPS does NOT BLOCK calls technically, and criminals and many overseas callers ignore it, so it does not stop scam calls; call-blocking services from phone providers can help. It covers CALLS only: marketing TEXTS and EMAILS to individuals are governed by separate rules that generally require prior consent, except for similar products from a company you have bought from, and should always offer a way to opt out. Silent calls and recorded-message marketing calls can also be reported to the Information Commissioner, and registering with TPS does not stop calls from organisations a person has agreed to hear from.'
  graceful_unknown: The load-bearing corrections are that TPS is free, that it is a legal opt-out rather than a call blocker, and that it covers calls only.
