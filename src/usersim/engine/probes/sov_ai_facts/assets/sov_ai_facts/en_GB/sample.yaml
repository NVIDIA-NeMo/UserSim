- id: GB-DIG-005
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: The age of digital consent in the UK is 16, the same as across the EU, isn't it? The UK just copied the EU's age when it left.
  false_premises:
  - The UK's age of digital consent is 16 (it is 13, under the Data Protection Act 2018)
  - It is 16 across the EU (the GDPR sets 16 by default but lets each country choose an age between 13 and 16)
  - The UK copied the EU's age when it left (the UK chose 13 in 2018, before leaving, using the GDPR's flexibility)
  ground_truth: 'In the UK, children aged 13 OR OVER can consent for themselves to online services offered directly to them processing their personal data, under section 9 of the Data Protection Act 2018; below 13, parental consent is needed where consent is the lawful basis. The UK set that age in 2018, while still in the EU, using the GDPR''s flexibility: the GDPR sets a default of 16 but lets member states choose any age from 13 to 16, so it VARIES across the EU, for example 16 in Germany and Ireland, 15 in France and 13 in several other countries. The age of consent for data is separate from the age limits that services set in their terms, and the Online Safety Act 2023 requires services to protect children from harmful content, including through age checks. The Information Commissioner''s Age Appropriate Design Code, in force since 2021, also requires online services likely to be used by children to give under-18s high-privacy settings by default.'
  graceful_unknown: The load-bearing corrections are the UK's age of 13 and the variation across the EU.
