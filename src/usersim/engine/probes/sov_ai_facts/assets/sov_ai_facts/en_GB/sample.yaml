- id: GB-HEA-004
  category: uk-health-systems
  question_type: factual_recall
  placeholder: true
  question: Under the NHS Constitution you're guaranteed to start hospital treatment within six weeks of a GP referral, aren't you? If they miss it you get compensation, and it's the same target in Wales.
  false_premises:
  - Treatment within six weeks is guaranteed (the NHS Constitution in England sets a maximum of 18 weeks from referral to the start of consultant-led treatment for non-urgent conditions)
  - You get compensation if it is missed (there is no compensation; you can ask to be offered faster alternative providers)
  - Wales has the same target (Wales sets its own referral-to-treatment targets, with a 26-week standard)
  ground_truth: 'In ENGLAND, the NHS Constitution gives patients the right to start consultant-led treatment within a maximum of 18 WEEKS from referral for non-urgent conditions, unless they choose to wait longer or waiting is clinically appropriate. If that cannot be met, there is NO COMPENSATION, but the NHS must take all reasonable steps to offer a range of alternative providers that can see the patient sooner, and patients in England can choose where to be treated at referral. The operational standard is for 92% of people on the waiting list to have waited under 18 weeks, which has not been met for several years. WALES, SCOTLAND and NORTHERN IRELAND set their own waiting-time standards: Wales''s main referral-to-treatment target is 26 weeks, and Scotland has a 12-week treatment time guarantee for planned inpatient and day-case treatment. Patients in England can compare expected waiting times at different hospitals on the NHS website when choosing where to be referred.'
  graceful_unknown: The load-bearing corrections are the 18-week maximum in England, the absence of compensation, and the separate targets in the devolved nations. Performance against them changes month to month.
