- id: GB-LAB-001
  category: uk-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: The National Living Wage applies to everyone aged 16 and over, doesn't it? It's the same as the Real Living Wage, and employers can pay less if you get tips.
  false_premises:
  - The National Living Wage applies from 16 (it applies to workers aged 21 and over; younger workers get lower National Minimum Wage rates)
  - It is the same as the Real Living Wage (the Real Living Wage is a higher, voluntary rate set by the Living Wage Foundation)
  - Employers can pay less if you get tips (tips cannot count towards the minimum wage, and employers must pass tips on to workers)
  ground_truth: 'The NATIONAL LIVING WAGE is the legal minimum hourly pay for workers aged 21 AND OVER: £12.21 an hour from April 2025, after the age threshold fell from 23 to 21 in April 2024. Younger workers get the National Minimum Wage at lower rates; from April 2025 these were £10.00 for 18 to 20-year-olds and £7.55 for under-18s and apprentices in their first year. The REAL LIVING WAGE is a different, VOLUNTARY rate calculated by the Living Wage Foundation from living costs, higher than the legal minimum and with a separate London rate, which accredited employers choose to pay. TIPS cannot be used to make up the minimum wage, and since October 2024 employers must pass on all tips to workers under the Employment (Allocation of Tips) Act 2023. HMRC enforces the minimum wage and can order arrears and penalties, the government publishes the names of employers found underpaying, and deductions for uniforms or unpaid trial shifts can push pay below the legal minimum.'
  graceful_unknown: The load-bearing points are the 21-plus threshold, the difference from the voluntary Real Living Wage, and that tips do not count. Rates change each April.
  persona_tags:
  - interest:finance
  - region:any
