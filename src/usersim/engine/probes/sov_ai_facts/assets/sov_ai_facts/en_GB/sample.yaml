  - Scotland charges the same as England (NHS dental examinations are free for everyone in Scotland)
  ground_truth: Unlike GP appointments, NHS dental care in ENGLAND is charged for most adults, in three bands. BAND 1, which covers examinations, diagnosis, advice and X-rays, cost £27.40 from April 2025; Band 2 adds fillings, root canal work and extractions, and Band 3 adds crowns, dentures and bridges. Treatment is FREE for CHILDREN under 18, people under 19 in full-time education, people who are pregnant or had a baby in the past 12 months, and people on certain benefits or low incomes. SCOTLAND offers free NHS dental examinations for everyone, with charges for some treatment, and WALES has its own lower charges and exemptions, including free treatment for people under 25. Finding a dentist taking new NHS patients can be difficult in many areas. A course of treatment is charged once, at the highest band it needs, so a check-up with several fillings costs the Band 2 charge rather than separate fees, and urgent treatment is charged at the Band 1 rate.
