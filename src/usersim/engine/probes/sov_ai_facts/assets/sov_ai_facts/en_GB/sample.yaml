    - Data Protection Act 2018
- id: GB-DIG-003
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: Confirmation of Payee means your bank guarantees to refund you if the name doesn't match, doesn't it? Scam reimbursement covers card payments too, and you have to report it within 24 hours.
  false_premises:
  - Confirmation of Payee guarantees a refund (it only checks the name against the account details before you pay and warns you of a mismatch)
  - Scam reimbursement covers card payments (it covers Faster Payments and CHAPS transfers; card payments have chargeback and Section 75 instead)
  - You must report within 24 hours (claims can be made up to 13 months after the last scam payment)
  ground_truth: 'CONFIRMATION OF PAYEE is a name-checking service: when you set up a new payee, your bank checks the name you enter against the name on the receiving account and tells you whether it matches, closely matches or does not match, before you send money. It is a WARNING, NOT a refund guarantee. Separately, since 7 October 2024 banks and payment firms have had to REIMBURSE most victims of AUTHORISED PUSH PAYMENT scams made by FASTER PAYMENTS or CHAPS, up to £85,000 per claim, with the cost split between the sending and receiving firms, unless the customer was grossly negligent or complicit. CARD payments are not covered by this scheme; they have chargeback and Section 75 instead. Claims can be made up to 13 MONTHS after the last payment, though reporting quickly gives the best chance of recovering money. Victims should contact their bank immediately, because banks can sometimes freeze money in the receiving account before it moves on.'
  graceful_unknown: The load-bearing corrections are that Confirmation of Payee is a warning, that reimbursement covers Faster Payments and CHAPS, and the 13-month window. The scheme's limits are set by the payments regulator and can change.
