- id: GB-DIG-001
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: You can forward scam texts to 999 to report them, can't you? Banks sometimes text a link to confirm your PIN, and replying STOP is the safest thing to do.
  false_premises:
  - Scam texts are reported to 999 (they should be forwarded, free, to 7726; 999 is for emergencies)
  - Banks text links to confirm your PIN (banks never ask for your full PIN or password by text or call)
  - Replying STOP is safest (replying confirms the number is active; forward the text to 7726 and delete it)
  ground_truth: In the UK a scam text can be reported by forwarding it FREE of charge to 7726, which spells SPAM on a keypad, so that the mobile network can block the sender; suspicious emails can be forwarded to the National Cyber Security Centre at report@phishing.gov.uk. 999 is for emergencies only. BANKS NEVER ask for a full PIN, password or one-time passcode by text, email or phone, and never ask customers to move money to a 'safe account'. Replying to a scam text, even with STOP, confirms the number is in use and can bring more messages, so it is safer not to reply, not to click links, and to contact the bank on the number on the back of the card. Anyone who has lost money should contact their bank straight away and report it to the police. Common scam texts in the UK pretend to come from Royal Mail or a delivery firm about a missed parcel, from HMRC about a tax refund, or from a family member writing from a new number, the 'Hi Mum' scam.
  graceful_unknown: The load-bearing corrections are 7726 rather than 999, that banks never ask for PINs, and not replying to scam texts.
