- id: GB-DIG-004
  category: uk-digital-services
  question_type: factual_recall
  placeholder: true
  question: Everything for Northern Ireland is on GOV.UK as well, isn't it? There's no separate government website there, driving licences come from the DVLA in Swansea, and Wales doesn't have its own site either.
  false_premises:
  - There is no separate Northern Ireland government website (nidirect is the official website for Northern Ireland services)
  - Northern Ireland driving licences come from the DVLA (they come from the Driver & Vehicle Agency, the DVA)
  - Wales has no site of its own (the Welsh Government's site is GOV.WALES)
  ground_truth: NORTHERN IRELAND has its own official government website, NIDIRECT (nidirect.gov.uk), run by the Northern Ireland Executive. It covers services that are devolved or run separately there, such as driving licences and MOTs from the DRIVER & VEHICLE AGENCY, health and social care, education, and benefits administered by the Department for Communities. GOV.UK covers UK-wide services such as passports, HMRC tax and the State Pension, and also serves England for devolved matters. The Welsh Government publishes guidance and services on GOV.WALES, in Welsh and English, and Scotland has mygov.scot for public services and gov.scot for the Scottish Government. Which site to use depends on whether a service is UK-wide or devolved. Many Northern Ireland services are run by its own departments and agencies, for example domestic rates by Land & Property Services, so following GOV.UK guidance written for England can give the wrong process.
  graceful_unknown: The load-bearing corrections are nidirect for Northern Ireland, the DVA for its licences, and separate Welsh and Scottish government sites.
