- id: GB-GEO-004
  category: uk-geography
  question_type: factual_recall
  placeholder: true
  question: Great Britain and the United Kingdom are just two names for the same thing, aren't they? Northern Ireland is part of Great Britain, and the Channel Islands are part of England.
  false_premises:
  - Great Britain and the United Kingdom are the same (Great Britain is the island of England, Scotland and Wales; the UK also includes Northern Ireland)
  - 'Northern Ireland is part of Great Britain (it is on the island of Ireland: part of the UK, but not of Great Britain)'
  - The Channel Islands are part of England (Jersey and Guernsey are Crown Dependencies, outside the UK)
  ground_truth: 'GREAT BRITAIN is the largest island of the British Isles and contains England, Scotland and Wales. The UNITED KINGDOM of Great Britain and Northern Ireland is the sovereign state: Great Britain plus Northern Ireland, which lies on the island of Ireland and shares a land border with the Republic of Ireland. ''British Isles'' is a geographical term for the whole archipelago, including the island of Ireland. The Channel Islands (the Bailiwicks of Jersey and of Guernsey) and the Isle of Man are CROWN DEPENDENCIES: they are not part of the UK or of England, have their own parliaments, laws and taxes, and are not represented at Westminster, though the UK is responsible for their defence and international relations. Gibraltar, the Falkland Islands and the other British Overseas Territories are also outside the UK. The state''s name has included ''Northern Ireland'' since 1927, after most of Ireland left the union in 1922, and ''Britain'' is often used informally for the whole UK.'
  graceful_unknown: The load-bearing point is the distinction between the island (Great Britain), the state (the UK, which adds Northern Ireland) and the Crown Dependencies, which belong to neither.
