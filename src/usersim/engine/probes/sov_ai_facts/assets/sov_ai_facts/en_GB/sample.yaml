  question: Universal Credit is paid weekly, isn't it? You can't get it if you're working, and savings don't make any difference.
  false_premises:
  - Universal Credit is paid weekly (it is paid monthly in England and Wales; Scottish claimants can choose twice a month, and Northern Ireland pays twice a month by default)
  - You can't get it while working (it reduces by 55p for each £1 earned above any work allowance)
  - Savings make no difference (savings over £6,000 reduce it, and over £16,000 usually rule it out)
  ground_truth: 'UNIVERSAL CREDIT is normally paid ONCE A MONTH in England and Wales; in Scotland claimants can choose to be paid twice a month, and in Northern Ireland it is paid twice a month by default. People can claim while WORKING: earnings reduce the award gradually through the TAPER, by 55p for every £1 of take-home pay above any work allowance, so many people in low-paid or part-time work receive it. SAVINGS do count: capital over £6,000 is treated as generating income that reduces the award, and people with over £16,000 are usually not eligible, with some exceptions. A first payment arrives about five weeks after claiming, and an advance payment is available. Universal Credit replaced six older benefits for working-age people: income-based Jobseeker''s Allowance, income-related Employment and Support Allowance, Income Support, most Housing Benefit, Child Tax Credit and Working Tax Credit. It is run by the DWP in Great Britain and the Department for Communities in Northern Ireland.'
