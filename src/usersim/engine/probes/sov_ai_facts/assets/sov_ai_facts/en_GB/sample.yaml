  ground_truth: 'Under the Elections Act 2022, voters in Great Britain must show accepted PHOTO ID at polling stations for UK Parliament elections, local elections in ENGLAND and Police and Crime Commissioner elections, a rule introduced from May 2023. A passport is only one option: driving licences (including provisional ones), Blue Badges, some concessionary travel passes such as an older person''s bus pass, and PASS cards are among the accepted IDs, expired ID is accepted if the photo still looks like you, and anyone without one can apply for a free Voter Authority Certificate. Photo ID is NOT required for Scottish Parliament or Senedd elections, or for local elections in Scotland and Wales, which are devolved; Northern Ireland has required photo ID for all elections since 2003. 16- and 17-year-olds can already vote in Scottish Parliament, Senedd and Scottish and Welsh local elections, and the UK government announced in July 2025 that it intends to lower the voting age to 16 for UK Parliament elections too.'
