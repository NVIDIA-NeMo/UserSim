- id: GB-HEA-005
  category: uk-health-systems
  question_type: factual_recall
  placeholder: true
  question: A&E has to see you within one hour by law, doesn't it? They see people in the order they arrive, and you need your GP to refer you first.
  false_premises:
  - A&E must see you within one hour by law (there is no legal time limit; the standard is that 95% of patients are admitted, transferred or discharged within four hours)
  - People are seen in order of arrival (patients are triaged and seen by clinical priority)
  - You need a GP referral (anyone can go to A&E without a referral)
  ground_truth: 'There is NO LEGAL right to be seen in A&E within a set time. The long-standing operational standard, used across the UK, is that 95% of patients should be admitted, transferred or discharged within FOUR HOURS of arriving; it has not been met nationally for years, and NHS England set interim goals of 78% by March 2025 and 82% by March 2026. Patients are TRIAGED on arrival and seen in order of CLINICAL NEED, so someone with chest pain is seen before someone who arrived earlier with a sprain. NO REFERRAL is needed: anyone can attend A&E or call 999 in an emergency. For urgent problems that are not emergencies, NHS 111, urgent treatment centres, pharmacies and GP practices are usually more appropriate. Performance figures are published every month, and many hospitals now stream patients with minor problems to an urgent treatment centre on the same site after triage.'
  graceful_unknown: The load-bearing corrections are the four-hour standard (not a legal one-hour right), triage by need, and no referral. Current performance figures are published monthly.
