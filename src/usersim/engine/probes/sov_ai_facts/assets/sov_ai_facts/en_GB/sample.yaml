- id: GB-FIN-006
  category: uk-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Stamp duty is the same tax across the whole UK when you buy a house, isn't it? First-time buyers get the same relief everywhere, and HMRC collects it all.
  false_premises:
  - Stamp duty applies across the UK (Stamp Duty Land Tax applies in England and Northern Ireland; Scotland and Wales have their own taxes)
  - First-time buyers get the same relief everywhere (Wales has no first-time buyer relief)
  - HMRC collects it all (Revenue Scotland and the Welsh Revenue Authority collect the Scottish and Welsh taxes)
  ground_truth: STAMP DUTY LAND TAX applies to property purchases in ENGLAND and NORTHERN IRELAND only, and is collected by HMRC. SCOTLAND replaced it with LAND AND BUILDINGS TRANSACTION TAX, collected by Revenue Scotland, from 1 April 2015, and WALES with LAND TRANSACTION TAX, collected by the Welsh Revenue Authority, from 1 April 2018. Each has its own rates, thresholds, surcharges for additional homes and reliefs. FIRST-TIME BUYER relief exists in England and Northern Ireland and in Scotland, but WALES has NONE, instead setting a higher starting threshold for all buyers of main residences. The tax is usually paid through the buyer's solicitor or conveyancer within a short deadline after completion. England's thresholds changed in April 2025, when the starting threshold for most buyers returned to £125,000 and first-time buyer relief to £300,000, so older guides may quote different figures.
  graceful_unknown: The load-bearing corrections are the three separate taxes, Wales's lack of first-time buyer relief, and the separate collecting authorities. Thresholds and rates change, so check each authority's calculator.
