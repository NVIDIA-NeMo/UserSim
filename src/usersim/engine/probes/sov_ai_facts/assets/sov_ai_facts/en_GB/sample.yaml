- id: GB-FIN-003
  category: uk-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: If you pay for something over £100 with a debit card and the company goes bust, Section 75 means your bank has to refund you, doesn't it? As long as you paid the whole amount on the card, and it covers things up to £100,000.
  false_premises:
  - Section 75 covers debit cards (it covers credit card purchases; debit card payments can only be disputed through the card scheme's chargeback process)
  - You must pay the whole amount on the card (paying even part, such as a deposit, on a credit card is enough)
  - It covers things up to £100,000 (it covers items with a cash price over £100 and up to £30,000)
  ground_truth: SECTION 75 of the Consumer Credit Act 1974 makes a CREDIT CARD provider jointly liable with the retailer when goods or services with a cash price over £100 and up to £30,000 are not supplied, are faulty or are misdescribed, for example when the trader goes bust before delivering. It applies even if only PART of the price, such as a deposit, was paid on the card. It does NOT apply to DEBIT CARDS, or usually to purchases made through some intermediaries. For debit card payments, and credit card purchases of £100 or less, the bank may be able to reverse the payment through CHARGEBACK, a card-scheme process with time limits, usually 120 days, rather than a legal right. Complaints about either can go to the Financial Ombudsman Service. The claim is made to the card provider, which can be pursued even after the retailer has gone out of business, but paying through an intermediary such as PayPal can break the direct link Section 75 needs.
  graceful_unknown: The load-bearing corrections are that Section 75 covers credit cards only, applies to part-payments, and has a £30,000 ceiling.
