  ground_truth: Since 17 SEPTEMBER 2023, the default speed limit on RESTRICTED ROADS in Wales, usually residential and other built-up streets with street lighting, has been 20 MPH instead of 30 mph, under the Restricted Roads (20 mph Speed Limit) (Wales) Order 2022. Wales was the first UK nation to change the default nationally. Motorways and most trunk roads are unaffected, and councils can keep or set 30 mph on suitable roads; after a review in 2024 the Welsh Government changed its guidance so that councils could return more roads to 30 mph, and many have consulted on doing so. In England, Scotland and Northern Ireland the statutory default on restricted roads remains 30 mph, although many councils have set 20 mph limits on particular streets. The Welsh Government cited evidence that lower speeds reduce collisions and casualties, and early figures showed fewer casualties on affected roads, while the change also drew one of the largest petitions the Senedd has received.
