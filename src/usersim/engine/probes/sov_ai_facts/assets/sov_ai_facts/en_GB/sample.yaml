- id: GB-EDU-005
  category: uk-education
  question_type: factual_recall
  placeholder: true
  question: In Wales, learning Welsh at school stops being compulsory after primary school, doesn't it? Welsh-medium schools don't teach English at all, and you can't sit GCSEs in Welsh.
  false_premises:
  - Welsh stops being compulsory after primary school (it is compulsory for all learners aged 3 to 16 in maintained schools)
  - Welsh-medium schools don't teach English (English is mandatory in the curriculum, from age 7 at the latest)
  - You can't sit GCSEs in Welsh (GCSEs and A levels can be taken through the medium of Welsh)
  ground_truth: 'WELSH is COMPULSORY for all learners aged 3 to 16 in maintained schools in Wales. It has been a compulsory subject up to 16 since 1999, and the Curriculum for Wales, introduced from 2022 under the Curriculum and Assessment (Wales) Act 2021, keeps Welsh mandatory throughout. In WELSH-MEDIUM schools most teaching is in Welsh, but ENGLISH is also a mandatory part of the curriculum, from age 7 at the latest, and pupils in Welsh-medium schools generally leave fully bilingual. Exams can be taken in Welsh: WJEC, the main awarding body in Wales, offers GCSEs and A levels through the medium of Welsh, and Welsh as a subject is taken at different levels depending on whether pupils are first- or second-language learners. Councils publish Welsh in Education Strategic Plans with targets for Welsh-medium places, as part of the Welsh Government''s aim of a million Welsh speakers by 2050.'
  graceful_unknown: The load-bearing corrections are compulsory Welsh to 16, English within Welsh-medium education, and exams available in Welsh.
