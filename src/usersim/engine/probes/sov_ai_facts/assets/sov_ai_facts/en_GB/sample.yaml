  ground_truth: Most school students in SCOTLAND take National 5 qualifications in S4, then HIGHERS, usually in S5 at around 16 or 17, and Advanced Highers in S6, all awarded by Scotland's national qualifications body. Scottish universities typically make offers on Highers, so many students apply after S5. A levels are the main post-16 qualifications in England, Wales and Northern Ireland, and only a few independent schools in Scotland offer them. Because students can enter at 17 with Highers, a Scottish undergraduate HONOURS degree usually takes FOUR years, and an ordinary degree three, while honours degrees elsewhere in the UK usually take three years. Scotland's curriculum, Curriculum for Excellence, covers ages 3 to 18, and students can also take Higher National Certificates and Diplomas at college, which can lead into the second or third year of a degree.
