- id: GB-HEA-002
  category: uk-health-systems
  question_type: factual_recall
  placeholder: true
  question: NHS 111 only exists in England, doesn't it? In Scotland you have to ring 999 for anything urgent, and 111 calls cost about 40p a minute anyway.
  false_premises:
  - 111 only exists in England (Scotland's NHS 24 and NHS 111 Wales also answer on 111)
  - In Scotland you must ring 999 for anything urgent (999 is for emergencies; NHS 24 on 111 handles urgent problems that are not life-threatening)
  - 111 calls cost about 40p a minute (they are free from landlines and mobiles)
  ground_truth: 'Dialling 111 reaches urgent, non-emergency health advice across most of the UK: NHS 111 in England, NHS 24 in SCOTLAND and NHS 111 Wales. It is for urgent problems that are not life-threatening, such as a worsening infection or advice on whether to go to A&E, and it can arrange out-of-hours GP appointments, call-backs from clinicians or urgent dental care; it also offers a mental health option. 999 is for emergencies such as chest pain, breathing difficulty, severe bleeding, signs of stroke or loss of consciousness. Calls to 111 are FREE from landlines and mobiles, and NHS 111 online offers the same triage on the web. In England, NHS 111 also gives access to urgent mental health help, and across Great Britain it is a route to out-of-hours GP care. Calling 999 when it is not an emergency can delay ambulances for people who need them.'
  graceful_unknown: The load-bearing corrections are that Scotland's service also answers on 111 and that calls are free.
