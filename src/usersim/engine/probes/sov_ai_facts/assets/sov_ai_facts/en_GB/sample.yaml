  ground_truth: A birth must be registered within 42 DAYS in England, Wales and Northern Ireland, and within 21 DAYS in Scotland. In England and Wales it is done at the REGISTER OFFICE for the area where the baby was born, or by declaration at another office, and some maternity units host registrars; in Scotland, at any registration office in Scotland. Parents who are married to each other or in a civil partnership can register on their OWN. Unmarried parents generally need to attend together for both names to be entered, or one can bring a statutory declaration from the other. Registration produces the birth certificate, and the baby's NHS number is issued separately at birth. In England and Wales a short birth certificate is free at registration and extra copies cost a fee, and failing to register a birth can be an offence, although registrars help with late registrations.
