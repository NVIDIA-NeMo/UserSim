- id: GB-EDU-006
  category: uk-education
  question_type: factual_recall
  placeholder: true
  question: Northern Ireland got rid of grammar schools and the eleven-plus years ago, like most of England, didn't it? Any test now is run by the Department of Education, and pupils take it at 14.
  false_premises:
  - Northern Ireland got rid of grammar schools and selection (it still has around 60 grammar schools, most of which select pupils by transfer test)
  - The test is run by the Department of Education (the state test ended in 2008; tests are set by an independent body, SEAG)
  - Pupils take it at 14 (it is taken in Primary 7, at 10 or 11)
  ground_truth: NORTHERN IRELAND still has around 60 GRAMMAR SCHOOLS, which educate a large share of its secondary pupils. The government-run eleven-plus, known as the transfer test, was abolished after 2008, but most grammar schools carried on SELECTING pupils by entrance tests set by INDEPENDENT bodies rather than the Department of Education. Since the test sat in late 2023 for entry in September 2024, there has been a single common test run by the Schools' Entrance Assessment Group (SEAG), replacing two separate tests. Pupils sit it in PRIMARY 7, aged 10 or 11, and taking it is optional. In England most areas have no grammar schools, but about 160 remain, and the law prevents new ones from opening. Supporters argue that selection lets able pupils from any background attend high-achieving schools, while critics, including successive education ministers, argue that it entrenches disadvantage; non-selective schools are usually called secondary schools.
  graceful_unknown: The load-bearing corrections are that Northern Ireland kept academic selection through unregulated transfer tests, that SEAG runs them, and that they are taken in P7.
