- id: GB-GEO-001
  category: uk-geography
  question_type: factual_recall
  placeholder: true
  question: Ben Nevis is the UK's highest mountain, but it's in the Lake District, isn't it? It's about 1,500 metres, and Snowdon is the second highest in the UK?
  false_premises:
  - Ben Nevis is in the Lake District (it is in the Scottish Highlands, above Fort William in Lochaber)
  - It is about 1,500 metres high (it is 1,345 metres)
  - Snowdon is the UK's second-highest mountain (the next highest peaks are all in Scotland, starting with Ben Macdui at 1,309 metres; Snowdon is the highest outside Scotland)
  ground_truth: Ben Nevis is the highest mountain in the United Kingdom at 1,345 metres (4,413 feet), the height Ordnance Survey confirmed in a 2016 resurvey. It stands in the SCOTTISH HIGHLANDS, at the western end of the Grampians above Fort William in Lochaber, not in England's Lake District. The Lake District's highest peak, Scafell Pike (978 metres), is the highest mountain in ENGLAND. The UK's second-highest mountain is Ben Macdui (1,309 metres) in the Cairngorms, and every UK summit above about 1,100 metres is in Scotland. Snowdon, or Yr Wyddfa (1,085 metres), is the highest mountain in Wales and the highest in the UK outside the Scottish Highlands, while Slieve Donard (850 metres) in the Mourne Mountains is the highest in Northern Ireland. Its summit plateau holds the ruins of a weather observatory that operated from 1883 to 1904, more than 100,000 people climb it each year, mostly by the Mountain Track from Glen Nevis, and its north face is one of Britain's main winter climbing venues.
  graceful_unknown: The load-bearing corrections are the location (Lochaber in the Scottish Highlands, not the Lake District) and that the UK's next-highest peaks are all Scottish. Exact heights are Ordnance Survey figures and can be checked there.
