- id: GB-EDU-003
  category: uk-education
  question_type: factual_recall
  placeholder: true
  question: GCSEs are still graded A* to G everywhere in the UK, aren't they? And in the new number grades a 9 is the lowest, with a 4 counting as a fail.
  false_premises:
  - GCSEs are graded A* to G everywhere (England uses numbers from 9 to 1; Wales and Northern Ireland use letters; Scotland does not use GCSEs)
  - A 9 is the lowest grade (9 is the highest)
  - A 4 is a fail (a 4 is a standard pass and a 5 a strong pass)
  ground_truth: 'ENGLAND''s reformed GCSEs, introduced between 2017 and 2020, are graded from 9 to 1, with 9 the HIGHEST, awarded to fewer students than the old A*. A grade 4 is a ''STANDARD PASS'', broadly equivalent to the old C, and a 5 a ''strong pass''; students in England without at least a 4 in English and maths must keep studying them after 16. WALES kept letter grades from A* to G for its GCSEs, which are being replaced by new made-for-Wales qualifications, and NORTHERN IRELAND uses A* to G with an added C* grade. SCOTLAND does not use GCSEs: students take National qualifications such as National 4 and National 5, followed by Highers. The reforms also moved most GCSEs to exams at the end of the two-year course, with less coursework, and exam boards set grade boundaries each year under Ofqual''s oversight. Colleges and employers often ask for a 4 or 5 in English and maths.'
  graceful_unknown: The load-bearing corrections are the different systems by nation, that 9 is the top grade, and that 4 is a pass.
