- id: GB-CUL-002
  category: uk-culture
  question_type: factual_recall
  placeholder: true
  question: Burns Night is on the anniversary of Robert Burns's death in July, isn't it? People eat haggis with chips and sing 'Flower of Scotland' to finish.
  false_premises:
  - Burns Night marks his death in July (it is held on or around 25 January, his birthday; he died on 21 July 1796)
  - Haggis is eaten with chips (it is traditionally served with neeps and tatties, mashed swede and potato)
