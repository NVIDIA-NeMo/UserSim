- id: GB-FIN-002
  category: uk-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: The FSCS protects up to £85,000 of your savings per account, so several accounts at the same bank are all covered, aren't they? And it covers money held on crypto exchanges as well.
  false_premises:
  - The limit is £85,000 (it rose to £120,000 on 1 December 2025)
  - It applies per account (it applies per person per banking licence, so several accounts or brands under one licence share the limit)
  - It covers crypto exchanges (cryptoassets are generally not protected by the FSCS)
  ground_truth: 'The FINANCIAL SERVICES COMPENSATION SCHEME protects eligible deposits up to £120,000 per person per authorised bank, building society or credit union; the limit rose from £85,000 on 1 DECEMBER 2025. It applies per BANKING LICENCE, not per account, so all of one person''s accounts with the same institution, including different brands that share a licence, count towards the same limit. Joint accounts are covered up to £240,000, and some temporary high balances, such as proceeds from a house sale, are protected up to £1.4 million for six months. CRYPTOASSETS are generally NOT protected: crypto exchanges are not banks, and losses from their failure or from price falls are not covered by the FSCS. The FSCS also protects investments held with authorised firms up to £85,000 if the firm fails, though not losses from investments falling in value, and it is funded by levies on the financial industry rather than by taxpayers.'
  graceful_unknown: The load-bearing corrections are the £120,000 limit, its application per banking licence, and the absence of crypto protection. Check whether brands share a licence on the FSCS website.
