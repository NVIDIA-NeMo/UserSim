  - You claim PIP from the DWP (claims in Scotland go to Social Security Scotland)
  - The Scottish Child Payment is available UK-wide (it is paid only in Scotland)
  ground_truth: In SCOTLAND, Personal Independence Payment has been replaced by ADULT DISABILITY PAYMENT, delivered by SOCIAL SECURITY SCOTLAND, an agency of the Scottish Government set up under the Social Security (Scotland) Act 2018. New claims have been made to Adult Disability Payment across Scotland since August 2022, and existing PIP awards for people living in Scotland were transferred without a new application. It has the same two components as PIP, daily living and mobility, paid at the same rates, but Social Security Scotland runs its own assessments and decisions. Social Security Scotland also pays benefits found only in Scotland, such as the SCOTTISH CHILD PAYMENT, worth £27.15 a week per eligible child from April 2025 for low-income families. People moving between Scotland and the rest of the UK have their award transferred between the two systems.
