  ground_truth: The GIANT'S CAUSEWAY lies on the north coast of COUNTY ANTRIM, near Bushmills, in Northern Ireland. It is made up of about 40,000 interlocking BASALT columns, many of them hexagonal, which formed NATURALLY when lava from intense volcanic activity cooled and contracted around 50 to 60 million years ago, cracking into columns. It was inscribed as a UNESCO World Heritage Site, together with the Causeway Coast, in 1986, and is Northern Ireland's only World Heritage Site; it is cared for by the National Trust and is one of Northern Ireland's most visited attractions. Legend says the giant Finn McCool (Fionn mac Cumhaill) built it as a path across the sea to Scotland, where similar columns appear at Fingal's Cave on Staffa. Walking on the stones is free, the visitor centre opened in 2012, and the columns' regular shapes come from the way the lava shrank as it cooled, much as drying mud cracks into polygons.
