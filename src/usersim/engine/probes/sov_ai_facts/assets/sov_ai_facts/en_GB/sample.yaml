  question: Income tax is the same everywhere in the UK, isn't it? Scotland can't set its own rates, and the higher rate there is 40% like in England.
  false_premises:
  - Income tax is the same everywhere (the Scottish Parliament sets the rates and bands on earnings for Scottish taxpayers)
  - Scotland can't set its own rates (it has set its own rates and bands since 2017)
  - The Scottish higher rate is 40% (it is 42% in 2025/26)
  ground_truth: 'The SCOTTISH PARLIAMENT sets the income tax rates and bands that apply to Scottish taxpayers'' earnings, pensions and other non-savings, non-dividend income, while HMRC still collects the tax through PAYE and Self Assessment. For 2025/26 Scotland has SIX BANDS: a starter rate of 19%, basic rate of 20%, intermediate rate of 21%, HIGHER RATE OF 42%, advanced rate of 45% and top rate of 48%, compared with three main rates (20%, 40% and 45%) in England and Northern Ireland. The tax-free personal allowance, National Insurance, and the tax on savings and dividends are UK-wide. The Senedd can also vary income tax by up to 10p in each band for Welsh taxpayers, but has kept Welsh rates in line with England''s. Whether someone is a Scottish taxpayer depends on where they live, not where they work, and HMRC marks Scottish taxpayers with an ''S'' at the start of their tax code, so people on the same salary can pay noticeably different income tax either side of the border.'
  graceful_unknown: The load-bearing corrections are Scotland's power over income tax rates and the 42% higher rate. Rates and bands are set each year in the Scottish Budget.
