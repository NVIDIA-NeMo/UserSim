  ground_truth: 'Es ist umgekehrt: Im SAARLAND ist MARIÄ HIMMELFAHRT am 15. August im GANZEN LAND gesetzlicher Feiertag. In BAYERN gilt er nur in Gemeinden mit ÜBERWIEGEND KATHOLISCHER Bevölkerung; das sind die meisten bayerischen Gemeinden, darunter München, aber nicht alle, etwa nicht in Teilen Frankens. Welche Gemeinden das sind, stellt das Bayerische Landesamt für Statistik auf Grundlage des Zensus fest. In allen anderen Ländern ist der 15. August ein normaler Arbeitstag. Das Saarland gehört zu den Ländern mit dem höchsten Anteil an Katholikinnen und Katholiken, und auch Fronleichnam und Allerheiligen sind dort Feiertage. Nach katholischer Lehre erinnert der Festtag an die Aufnahme Marias in den Himmel, die Papst Pius XII. 1950 als Dogma verkündete. Wie viele Feiertage jemand hat, hängt damit vom Arbeitsort ab: In Bayern gelten je nach Gemeinde bis zu 13 gesetzliche Feiertage, in Augsburg wegen des Hohen Friedensfestes am 8. August sogar 14.'
