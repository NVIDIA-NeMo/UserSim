  question: In Hessen konnte man bis 2018 noch zur Todesstrafe verurteilt werden, oder? Abgeschafft wurde sie in Deutschland ja erst 1990.
  false_premises:
  - In Hessen konnte bis 2018 die Todesstrafe verhängt werden (sie stand in der Landesverfassung, war aber seit 1949 durch Artikel 102 des Grundgesetzes ausgeschlossen)
  - Deutschland schaffte die Todesstrafe erst 1990 ab (die Bundesrepublik 1949, die DDR 1987)
  - Die Hessische Verfassung ist jünger als das Grundgesetz (sie stammt von 1946)
  ground_truth: 'Die HESSISCHE VERFASSUNG von 1946 ist älter als das Grundgesetz und enthielt in ARTIKEL 21 eine Bestimmung, die die Todesstrafe für besonders schwere Verbrechen zuließ. ANWENDBAR war sie nie mehr: Seit dem 24. Mai 1949 schafft ARTIKEL 102 des Grundgesetzes die Todesstrafe ab, und Bundesrecht bricht Landesrecht (Artikel 31). Gestrichen wurde der Satz erst durch eine VOLKSABSTIMMUNG am 28. OKTOBER 2018, zeitgleich mit der Landtagswahl; rund 83 Prozent stimmten dafür, zusammen mit weiteren Verfassungsänderungen. Seit Inkrafttreten des Grundgesetzes hat die Bundesrepublik kein Todesurteil mehr vollstreckt. Die DDR vollstreckte das letzte Todesurteil 1981 und schaffte die Todesstrafe 1987 ab. Deutschland hat sich zudem völkerrechtlich, etwa durch das 13. Zusatzprotokoll zur Europäischen Menschenrechtskonvention, auf ihren Ausschluss festgelegt.'
  graceful_unknown: Tragend sind Artikel 102 GG seit 1949 und die Streichung aus der Landesverfassung 2018. Eine ehrliche Antwort kann beim genauen Abstimmungsergebnis vorsichtig bleiben.
