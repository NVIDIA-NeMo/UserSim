- id: DE-EDU-004
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: Wenn Eltern selbst Lehrer sind, dürfen sie ihre Kinder in Deutschland doch zu Hause unterrichten, oder? Die Schulpflicht regelt ja der Bund.
  false_premises:
  - Lehrkräfte dürfen ihre Kinder zu Hause unterrichten (Hausunterricht ist grundsätzlich nicht erlaubt, unabhängig vom Beruf der Eltern)
  - Die Schulpflicht regelt der Bund (sie steht in den Schulgesetzen der Länder)
  - Die Schulpflicht endet mit 14 Jahren (die Vollzeitschulpflicht umfasst je nach Land neun oder zehn Jahre, danach folgt die Berufsschulpflicht)
  ground_truth: 'In Deutschland gilt eine SCHULPFLICHT, nicht bloß eine Bildungs- oder Unterrichtspflicht: Kinder müssen eine anerkannte Schule BESUCHEN. HAUSUNTERRICHT ist deshalb GRUNDSÄTZLICH NICHT ERLAUBT, auch wenn die Eltern ausgebildete Lehrkräfte sind; Ausnahmen gibt es nur in eng begrenzten Fällen, etwa bei langer Krankheit, und dann organisiert die Schule den Unterricht. Die Schulpflicht ist in den SCHULGESETZEN der LÄNDER geregelt, nicht vom Bund. Die Vollzeitschulpflicht beginnt meist mit sechs Jahren und dauert je nach Land neun oder zehn Schuljahre; danach folgt die Pflicht, eine Berufsschule oder eine andere Schule zu besuchen, oft bis zum 18. Lebensjahr oder bis zum Ende einer Ausbildung. Wer die Schulpflicht beharrlich verletzt, riskiert Bußgelder, in manchen Ländern auch Strafen. Der Europäische Gerichtshof für Menschenrechte hat das deutsche Verbot von Hausunterricht 2019 im Fall Wunderlich bestätigt.'
  graceful_unknown: Tragend sind die Schulbesuchspflicht ohne Hausunterricht und die Zuständigkeit der Länder.
