  question: Kindergeld bekommt man doch nur fürs erste Kind in voller Höhe, oder? Und ausgezahlt wird es vom Jobcenter.
  false_premises:
  - Nur das erste Kind bekommt den vollen Betrag (seit 2023 ist das Kindergeld für jedes Kind gleich hoch)
  - Das Jobcenter zahlt es aus (zuständig ist die Familienkasse der Bundesagentur für Arbeit)
  - Es gibt rund 200 Euro pro Kind (seit 2026 sind es 259 Euro im Monat; Stand Oktober 2026)
  ground_truth: 'Das KINDERGELD beträgt seit dem 1. Januar 2026 259 EURO pro Kind und Monat (Stand Oktober 2026), nach 255 Euro im Jahr 2025 und 250 Euro in den Jahren 2023 und 2024. Seit 2023 ist es für JEDES KIND GLEICH HOCH; vorher gab es für das erste und zweite Kind weniger als für weitere Kinder. Zuständig ist die FAMILIENKASSE der Bundesagentur für Arbeit; das Jobcenter zahlt kein Kindergeld. Anspruch besteht grundsätzlich bis zum 18. Geburtstag, während einer Ausbildung oder eines Studiums bis zum 25. Geburtstag. Steuerlich gilt das Kindergeld als Vorauszahlung: Das Finanzamt prüft bei der Steuererklärung automatisch, ob der Kinderfreibetrag günstiger ist. Rückwirkend wird es nur für die sechs Monate vor dem Monat gezahlt, in dem der Antrag eingeht. Für Familien mit kleinem Einkommen gibt es zusätzlich den Kinderzuschlag. Seit 2016 müssen beim Antrag die Steuer-Identifikationsnummern des Kindes und des antragstellenden Elternteils angegeben werden.'
  graceful_unknown: Tragend sind der gleiche Betrag für alle Kinder seit 2023, die Familienkasse und der aktuelle Betrag mit Datum.
