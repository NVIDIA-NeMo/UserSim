  ground_truth: 'Der REFORMATIONSTAG am 31. Oktober ist in NIEDERSACHSEN erst seit 2018 gesetzlicher Feiertag. Im selben Jahr führten ihn auch BREMEN, HAMBURG und SCHLESWIG-HOLSTEIN ein, weil die norddeutschen Länder deutlich weniger Feiertage hatten als der Süden. In den ostdeutschen Ländern Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt und Thüringen ist er schon seit 1990 Feiertag. BUNDESWEIT arbeitsfrei war der 31. Oktober nur einmal, 2017, zum 500. Jahrestag der Reformation. In BAYERN, Baden-Württemberg, Hessen, Nordrhein-Westfalen, Rheinland-Pfalz, dem Saarland und Berlin ist er kein gesetzlicher Feiertag. Der Tag erinnert an die Veröffentlichung der 95 Thesen durch Martin Luther am 31. Oktober 1517. In Niedersachsen war die Wahl umstritten: Jüdische Gemeinden und die katholische Kirche kritisierten sie, unter anderem wegen Luthers judenfeindlicher Schriften, und schlugen andere Tage vor.'
  graceful_unknown: Tragend sind 2018 und die vier norddeutschen Länder. Bei der vollständigen Länderliste ist ein Verweis auf die Feiertagsgesetze angemessen.
