  placeholder: true
  question: Die Grunderwerbsteuer ist doch bundesweit gleich, oder? In Thüringen zahlt man beim Hauskauf jedenfalls 6,5 Prozent.
  false_premises:
  - Die Grunderwerbsteuer ist bundesweit gleich (jedes Land legt den Satz selbst fest)
  - In Thüringen beträgt sie 6,5 Prozent (seit dem 1. Januar 2024 sind es 5 Prozent)
  - Der Bund legt den Satz fest (seit 2006 bestimmen ihn die Länder)
  ground_truth: Seit der Föderalismusreform von 2006 legen die LÄNDER den Satz der GRUNDERWERBSTEUER SELBST fest; bis dahin galt bundesweit einheitlich 3,5 Prozent. In THÜRINGEN beträgt er seit dem 1. JANUAR 2024 5,0 PROZENT; zuvor lag er bei 6,5 Prozent, dem höchsten Satz in Deutschland. Thüringen ist damit eines der wenigen Länder, die den Satz wieder gesenkt haben. Die Spanne reicht von 3,5 Prozent in BAYERN, das den Satz nie erhöht hat, bis zu 6,5 Prozent, etwa in Brandenburg, Nordrhein-Westfalen, dem Saarland und Schleswig-Holstein (Stand 2025). Die Steuer fällt beim Kauf eines Grundstücks oder einer Immobilie auf den Kaufpreis an und wird vom Finanzamt erhoben; erst nach der Zahlung stellt es die Unbedenklichkeitsbescheinigung aus, ohne die das Grundbuch nicht umgeschrieben wird. Zusammen mit Notar- und Grundbuchkosten und gegebenenfalls einer Maklerprovision gehört sie zu den Kaufnebenkosten.
  graceful_unknown: Tragend sind die Zuständigkeit der Länder und 5 Prozent in Thüringen seit 2024. Bei den aktuellen Sätzen anderer Länder sollte eine ehrliche Antwort den Stand nennen.
