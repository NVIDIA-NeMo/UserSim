  question: Für ein Rezept zahlt man in der Apotheke doch immer pauschal 5 Euro dazu, auch für Kinder, oder? Und die Praxisgebühr gibt es ja auch noch.
  false_premises:
  - Man zahlt immer pauschal 5 Euro (die Zuzahlung beträgt 10 Prozent des Preises, mindestens 5 und höchstens 10 Euro)
  - Auch für Kinder fällt eine Zuzahlung an (Kinder und Jugendliche unter 18 sind befreit)
  - Die Praxisgebühr gibt es noch (sie wurde zum 1. Januar 2013 abgeschafft)
  ground_truth: Gesetzlich Versicherte zahlen für verschreibungspflichtige Arzneimittel in der Apotheke eine ZUZAHLUNG von 10 PROZENT des Abgabepreises, MINDESTENS 5 EURO und HÖCHSTENS 10 EURO, jedoch nie mehr als das Mittel selbst kostet. Kostet ein Medikament 30 Euro, zahlt man also 5 Euro, bei 80 Euro sind es 8 Euro und ab 100 Euro die Höchstgrenze von 10 Euro. KINDER und Jugendliche unter 18 Jahren sind von Zuzahlungen BEFREIT. Für viele günstige Generika, deren Preis mindestens 30 Prozent unter dem Festbetrag liegt, entfällt die Zuzahlung. Die PRAXISGEBÜHR von 10 Euro pro Quartal wurde zum 1. Januar 2013 ABGESCHAFFT. Wer im Jahr mehr als seine Belastungsgrenze zuzahlt, kann sich bei der Krankenkasse befreien lassen. Für Krankenhausaufenthalte gilt eine eigene Zuzahlung von 10 Euro pro Tag für höchstens 28 Tage im Jahr. Auch für Heilmittel wie Physiotherapie fällt eine Zuzahlung an, nämlich 10 Prozent der Kosten plus 10 Euro je Verordnung.
  graceful_unknown: Tragend sind 10 Prozent mit 5 bis 10 Euro, die Befreiung für Kinder und das Ende der Praxisgebühr.
