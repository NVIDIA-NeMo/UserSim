- id: DE-FIN-002
  category: germany-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Bei einer Bankpleite sind doch nur 50.000 Euro pro Konto geschützt, oder? Und für alles darüber haftet dann der Staat.
  false_premises:
  - Geschützt sind 50.000 Euro (die gesetzliche Einlagensicherung deckt 100.000 Euro)
  - Die Grenze gilt pro Konto (sie gilt pro Kunde und Bank)
  - Der Staat haftet unbegrenzt (eine unbegrenzte staatliche Garantie gibt es nicht)
  ground_truth: Die gesetzliche EINLAGENSICHERUNG schützt Guthaben auf Giro-, Tagesgeld- und Festgeldkonten sowie auf Sparbüchern bis zu 100.000 EURO pro KUNDE und pro BANK, nicht pro Konto. Wer bei derselben Bank mehrere Konten hat, ist also insgesamt bis 100.000 Euro abgesichert; bei Gemeinschaftskonten gilt der Betrag für jeden Inhaber. In bestimmten Fällen, etwa nach dem Verkauf einer privat genutzten Immobilie, sind vorübergehend bis zu 500.000 Euro geschützt. Im Entschädigungsfall muss das Geld innerhalb von SIEBEN ARBEITSTAGEN ausgezahlt werden. Die Regeln beruhen auf einer EU-Richtlinie und stehen im Einlagensicherungsgesetz; getragen wird der Schutz von den Banken selbst. Viele Banken sind zusätzlich freiwilligen Sicherungssystemen angeschlossen, und Sparkassen und Genossenschaftsbanken sichern sich über ihre Institutssicherung gegenseitig ab. Eine UNBEGRENZTE GARANTIE des Staates gibt es NICHT; die Zusage der Bundesregierung in der Finanzkrise 2008 war eine politische Erklärung. Wertpapiere im Depot sind Sondervermögen und gehören weiter den Kundinnen und Kunden.
  graceful_unknown: Tragend sind 100.000 Euro pro Kunde und Bank und die Auszahlung binnen sieben Arbeitstagen.
