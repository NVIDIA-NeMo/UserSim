- id: DE-LAB-006
  category: germany-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Bildungsurlaub ist doch bundesweit einheitlich geregelt, oder? Und die Tage werden vom normalen Urlaub abgezogen.
  false_premises:
  - Bildungsurlaub ist bundesweit einheitlich geregelt (er ist Ländersache; in Hessen gilt das Hessische Bildungsurlaubsgesetz)
  - Die Tage werden vom Urlaub abgezogen (Bildungsurlaub kommt bei fortgezahltem Lohn zum Erholungsurlaub hinzu)
  - Jede Weiterbildung zählt (die Veranstaltung muss anerkannt sein)
  ground_truth: BILDUNGSURLAUB ist LÄNDERSACHE. In HESSEN haben Beschäftigte nach dem Hessischen Gesetz über den Anspruch auf Bildungsurlaub Anspruch auf FÜNF ARBEITSTAGE bezahlte Freistellung pro Kalenderjahr, bei einer Sechs-Tage-Woche auf sechs. Der Bildungsurlaub kommt ZUSÄTZLICH zum Erholungsurlaub; der Arbeitgeber zahlt den Lohn weiter, die Kursgebühren tragen in der Regel die Beschäftigten selbst. Die Veranstaltung muss ANERKANNT sein und der politischen Bildung, der beruflichen Weiterbildung oder der Qualifizierung für ein Ehrenamt dienen. Den Bildungsurlaub muss man rechtzeitig vorher beim Arbeitgeber beantragen, in Hessen mindestens sechs Wochen vor Beginn. Ähnliche Gesetze gibt es in den meisten Ländern, oft mit fünf Tagen im Jahr oder zehn Tagen in zwei Jahren; BAYERN und SACHSEN haben kein Bildungsurlaubsgesetz (Stand 2025). Ablehnen kann der Arbeitgeber den Bildungsurlaub nur aus dringenden betrieblichen Gründen, und er muss das rechtzeitig mitteilen.
  graceful_unknown: Tragend sind fünf Tage pro Jahr in Hessen zusätzlich zum Urlaub und dass Bildungsurlaub Ländersache ist.
