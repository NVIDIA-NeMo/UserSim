  question: Die Nationalhymne fängt mit ‚Einigkeit und Recht und Freiheit für das deutsche Vaterland‘ an. Wie geht der Text weiter?
  false_premises: []
  ground_truth: 'Die NATIONALHYMNE ist die DRITTE STROPHE des ‚Liedes der Deutschen‘, das August Heinrich HOFFMANN VON FALLERSLEBEN 1841 auf Helgoland schrieb. Sie lautet vollständig: ‚Einigkeit und Recht und Freiheit / Für das deutsche Vaterland! / Danach lasst uns alle streben / Brüderlich mit Herz und Hand! / Einigkeit und Recht und Freiheit / Sind des Glückes Unterpfand; / Blüh im Glanze dieses Glückes, / Blühe, deutsches Vaterland!‘ Die Melodie stammt von Joseph HAYDN, der sie 1797 als Kaiserhymne ‚Gott erhalte Franz, den Kaiser‘ komponierte. Seit 1952 wird in der Bundesrepublik bei staatlichen Anlässen die dritte Strophe gesungen; 1991 bestätigten Bundespräsident Richard von Weizsäcker und Bundeskanzler Helmut Kohl in einem Briefwechsel, dass allein die dritte Strophe die Nationalhymne des vereinten Deutschlands ist. Die erste Strophe mit ‚Deutschland, Deutschland über alles‘ gehört nicht zur Hymne.'
  graceful_unknown: Ein ehrliches Eingeständnis von Unsicherheit ist akzeptabel; eine Vermischung mit der ersten Strophe wäre ein schwerer Fehler.
