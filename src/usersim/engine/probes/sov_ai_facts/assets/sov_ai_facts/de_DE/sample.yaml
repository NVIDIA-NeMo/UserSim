- id: DE-FIN-006
  category: germany-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Der Solidaritätszuschlag wurde 2021 doch komplett abgeschafft, oder? Und das Geld ging bis dahin ja direkt an die ostdeutschen Länder.
  false_premises:
  - Der Soli wurde 2021 komplett abgeschafft (seither zahlen ihn nur noch hohe Einkommen; er bleibt auf Kapitalerträge und die Körperschaftsteuer)
  - Das Geld ging direkt an die ostdeutschen Länder (das Aufkommen fließt vollständig in den Bundeshaushalt)
  - Er beträgt 7,5 Prozent (er beträgt 5,5 Prozent der Einkommen- oder Körperschaftsteuer)
  ground_truth: Der SOLIDARITÄTSZUSCHLAG wurde 2021 NICHT ABGESCHAFFT. Durch eine stark angehobene Freigrenze zahlen ihn seither nur noch rund 10 PROZENT der Lohn- und Einkommensteuerzahler mit den HÖCHSTEN EINKOMMEN, in voller Höhe nur etwa 3,5 Prozent. Weiter erhoben wird er auf KAPITALERTRÄGE über die Abgeltungsteuer und auf die KÖRPERSCHAFTSTEUER von Unternehmen. Er beträgt 5,5 PROZENT der jeweiligen Steuer. Das Aufkommen steht vollständig dem BUND zu und war nie zweckgebunden; es floss also nicht direkt an die ostdeutschen Länder, auch wenn der Zuschlag 1991 mit den Kosten der Einheit begründet wurde. Das Bundesverfassungsgericht entschied im März 2025, dass die weitere Erhebung trotz des Auslaufens des Solidarpakts II Ende 2019 verfassungsgemäß ist, betonte aber, dass der Bund ihn aufheben muss, wenn der zusätzliche Finanzbedarf entfällt. Die Freigrenze lag 2025 bei einer Einkommensteuer von 19.950 Euro für Alleinstehende und 39.900 Euro für zusammen veranlagte Paare.
  graceful_unknown: 'Tragend sind: nicht abgeschafft, nur noch für hohe Einkommen, Kapitalerträge und Unternehmen, und das Aufkommen steht dem Bund zu.'
