- id: DE-EDU-003
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: Einen Rechtsanspruch auf einen Kitaplatz gibt es doch erst ab drei Jahren, oder? Und die Kita ist ja überall kostenlos.
  false_premises:
  - Der Rechtsanspruch beginnt mit drei Jahren (seit 2013 gilt er ab dem vollendeten ersten Lebensjahr)
  - Die Kita ist überall kostenlos (die Gebühren regeln Länder und Kommunen sehr unterschiedlich)
  - Der Anspruch gilt ab Geburt (er beginnt mit dem ersten Geburtstag)
  ground_truth: 'Seit dem 1. AUGUST 2013 haben Kinder ab dem vollendeten ERSTEN LEBENSJAHR einen RECHTSANSPRUCH auf frühkindliche Förderung in einer Kita oder in der Kindertagespflege; für Kinder ab drei Jahren gibt es einen Anspruch auf einen Kindergartenplatz schon seit 1996. Geregelt ist das in § 24 des Achten Buches Sozialgesetzbuch. Vor dem ersten Geburtstag besteht ein Anspruch nur unter bestimmten Voraussetzungen, etwa wenn die Eltern erwerbstätig sind. Wird kein Platz angeboten, können Eltern den Anspruch einklagen und unter Umständen Schadensersatz verlangen. Die KOSTEN legen Länder und Kommunen fest, und sie unterscheiden sich stark: In BERLIN ist die Kita seit 2018 beitragsfrei, andere Länder haben die letzten Kitajahre oder eine Grundbetreuung beitragsfrei gestellt, anderswo zahlen Eltern einkommensabhängige Beiträge. Ab August 2026 kommt schrittweise ein Rechtsanspruch auf Ganztagsbetreuung für Grundschulkinder hinzu, zunächst für die erste Klasse.'
  graceful_unknown: Tragend sind der Anspruch ab dem ersten Geburtstag seit 2013 und die je nach Land unterschiedlichen Kosten.
