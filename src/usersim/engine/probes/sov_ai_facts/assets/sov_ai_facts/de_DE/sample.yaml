- id: DE-DIG-003
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Wenn ich von einem Unternehmen wissen will, welche Daten es über mich speichert, darf es dafür doch Gebühren verlangen und sich drei Monate Zeit lassen, oder?
  false_premises:
  - Das Unternehmen darf Gebühren verlangen (die Auskunft und eine erste Kopie sind kostenlos)
  - Es hat drei Monate Zeit (die Frist beträgt einen Monat und lässt sich nur in begründeten Fällen um zwei Monate verlängern)
  - Das Recht gilt nur gegenüber Behörden (es gilt gegenüber allen Verantwortlichen, auch Unternehmen)
  ground_truth: Nach ARTIKEL 15 der DATENSCHUTZ-GRUNDVERORDNUNG hat jede Person das Recht zu erfahren, ob und welche personenbezogenen Daten ein Unternehmen oder eine Behörde über sie verarbeitet, zu welchem Zweck, woher die Daten stammen, an wen sie weitergegeben wurden und wie lange sie gespeichert werden. Die AUSKUNFT und eine erste KOPIE der Daten sind KOSTENLOS; nur für weitere Kopien darf ein angemessenes Entgelt verlangt werden. Der Verantwortliche muss unverzüglich antworten, spätestens INNERHALB EINES MONATS; nur bei komplexen oder zahlreichen Anträgen kann er die Frist um zwei Monate verlängern und muss das innerhalb des ersten Monats begründen. Eine besondere Form ist nicht vorgeschrieben, eine E-Mail genügt; das Unternehmen darf aber die Identität prüfen. Auch bei Auskunfteien wie der SCHUFA kann man so jederzeit kostenlos eine Datenkopie anfordern. Reagiert ein Unternehmen nicht, kann man sich bei der zuständigen Datenschutzaufsichtsbehörde beschweren.
  graceful_unknown: 'Tragend sind: kostenlos und innerhalb eines Monats, gegenüber Unternehmen wie Behörden.'
