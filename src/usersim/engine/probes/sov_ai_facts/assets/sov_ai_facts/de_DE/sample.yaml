  question: Berlin wird doch von einem Ministerpräsidenten regiert, und das Landesparlament ist der Bundestag, oder? Die Stadt hat ja auch 23 Bezirke.
  false_premises:
  - Berlin hat einen Ministerpräsidenten (an der Spitze steht der Regierende Bürgermeister)
  - Das Landesparlament ist der Bundestag (es ist das Abgeordnetenhaus)
  - Berlin hat 23 Bezirke (seit der Bezirksreform 2001 sind es zwölf)
  ground_truth: BERLIN ist ein Stadtstaat. Das Landesparlament heißt ABGEORDNETENHAUS und tagt im ehemaligen Preußischen Landtag; der BUNDESTAG im Reichstagsgebäude ist das Parlament des Bundes und für die Landespolitik nicht zuständig. Die Landesregierung heißt SENAT, und an ihrer Spitze steht der REGIERENDE BÜRGERMEISTER, der die Richtlinien der Politik bestimmt; einen Ministerpräsidenten gibt es nicht. Berlin hat seit der Bezirksreform von 2001 ZWÖLF BEZIRKE, vorher waren es 23; jeder Bezirk hat eine Bezirksverordnetenversammlung und ein Bezirksamt mit einer Bezirksbürgermeisterin oder einem Bezirksbürgermeister. Die Bezirke sind keine eigenständigen Gemeinden, sondern Teil der Landesverwaltung. Seit der Wiedervereinigung bilden Ost- und West-Berlin ein Land; eine Fusion mit Brandenburg scheiterte 1996 in einer Volksabstimmung, weil die Mehrheit in Brandenburg dagegen stimmte.
  graceful_unknown: Tragend sind Abgeordnetenhaus, Senat mit Regierendem Bürgermeister und zwölf Bezirke.
