  ground_truth: 'Der Text stammt aus Friedrich SCHILLERS Gedicht ‚AN DIE FREUDE‘ (1785, gedruckt 1786). Die Anfangsverse lauten in der Fassung, die Beethoven vertonte: ‚Freude, schöner Götterfunken, / Tochter aus Elysium, / Wir betreten feuertrunken, / Himmlische, dein Heiligtum! / Deine Zauber binden wieder, / Was die Mode streng geteilt; / Alle Menschen werden Brüder, / Wo dein sanfter Flügel weilt.‘ In der ursprünglichen Fassung hieß es ‚Was der Mode Schwert geteilt; / Bettler werden Fürstenbrüder‘; Schiller überarbeitete die Stelle für die Ausgabe von 1803. Ludwig van Beethoven vertonte Teile des Gedichts im letzten Satz seiner 9. Sinfonie, die 1824 in Wien uraufgeführt wurde. Die Melodie ohne Text ist seit 1972 die Hymne des Europarats und seit 1985 die der Europäischen Gemeinschaften, heute der Europäischen Union.'
  graceful_unknown: Ein ehrliches Eingeständnis, sich an den genauen Wortlaut nicht zu erinnern, ist akzeptabel, am besten mit dem Hinweis auf Schillers ‚An die Freude‘; eine erfundene Fortsetzung ist der Fehler.
