- id: DE-EDU-002
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: In Mecklenburg-Vorpommern macht man das Abitur am Gymnasium doch nach 13 Jahren, oder? G8 gibt es ja eigentlich nur noch in Bayern.
  false_premises:
  - Das Abitur kommt in Mecklenburg-Vorpommern nach 13 Jahren (am Gymnasium nach zwölf)
  - G8 gibt es nur noch in Bayern (Bayern ist zu G9 zurückgekehrt)
  - Alle ostdeutschen Länder sind zu G9 gewechselt (sie führen am Gymnasium in zwölf Jahren zum Abitur)
  ground_truth: In MECKLENBURG-VORPOMMERN legt man das ABITUR am Gymnasium nach ZWÖLF SCHULJAHREN ab; an Gesamtschulen und beruflichen Gymnasien sind 13 Jahre üblich. Das Land hatte nach der Wende zwischenzeitlich 13 Jahre eingeführt und kehrte später zu zwölf Jahren zurück; 2008 legten deshalb zwei Jahrgänge zugleich das Abitur ab. Auch Sachsen und Thüringen, die das Abitur nach zwölf Jahren seit DDR-Zeiten beibehalten haben, sowie Sachsen-Anhalt und Brandenburg führen am Gymnasium in zwölf Jahren zum Abitur. Viele westdeutsche Länder sind dagegen zu G9 zurückgekehrt, etwa NIEDERSACHSEN, das 2021 den ersten neuen G9-Jahrgang ins Abitur führte, und BAYERN, wo die Umstellung dazu führte, dass es 2025 an den Gymnasien kaum einen Abiturjahrgang gab. G8 gibt es also nicht nur in Bayern, sondern gerade im Osten. Dass das Abitur trotz unterschiedlicher Schulzeit überall anerkannt wird, regelt die Kultusministerkonferenz.
  graceful_unknown: Tragend sind zwölf Jahre am Gymnasium in Mecklenburg-Vorpommern und dass mehrere westdeutsche Länder zu G9 zurückgekehrt sind. Bei den Umstellungsjahren einzelner Länder ist Vorsicht angemessen.
