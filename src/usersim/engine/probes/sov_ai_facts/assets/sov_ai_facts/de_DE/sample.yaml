  question: Es gibt doch dieses Lied über den Rhein, das mit ‚Ich weiß nicht, was soll es bedeuten‘ anfängt. Wie geht die erste Strophe weiter?
  false_premises: []
  ground_truth: 'Die erste Strophe von Heinrich Heines Gedicht ‚DIE LORELEI‘ (1824) lautet: ‚Ich weiß nicht, was soll es bedeuten, / Daß ich so traurig bin; / Ein Märchen aus alten Zeiten, / Das kommt mir nicht aus dem Sinn.‘ Weiter heißt es: ‚Die Luft ist kühl und es dunkelt, / Und ruhig fließt der Rhein; / Der Gipfel des Berges funkelt / Im Abendsonnenschein.‘ Das Gedicht erschien 1827 im ‚Buch der Lieder‘ und erzählt von einer schönen Frau auf einem Felsen über dem Rhein, die mit ihrem Gesang die Schiffer ablenkt, bis sie an den Klippen zerschellen. Zum Volkslied wurde es durch die Vertonung von Friedrich Silcher aus dem Jahr 1837. Der Loreley-Felsen ragt bei Sankt Goarshausen in Rheinland-Pfalz rund 130 Meter über den Rhein; er liegt im Oberen Mittelrheintal, das seit 2002 zum UNESCO-Welterbe gehört.'
