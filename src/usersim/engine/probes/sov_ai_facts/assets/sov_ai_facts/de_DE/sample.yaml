  - Das Fest geht auf das Mittelalter zurück (das erste Oktoberfest fand 1810 statt)
  ground_truth: Das OKTOBERFEST auf der Münchner Theresienwiese beginnt im SEPTEMBER, in der Regel am Samstag nach dem 15. September, und endet am ersten Sonntag im Oktober; fällt dieser auf den 1. oder 2. Oktober, wird bis zum Tag der Deutschen Einheit verlängert. Eröffnet wird es mit dem Anstich des ersten Fasses durch den Münchner Oberbürgermeister und dem Ruf ‚O’zapft is!‘. Das erste Oktoberfest fand 1810 statt, als Pferderennen zur Hochzeit von Kronprinz Ludwig, dem späteren König Ludwig I., mit Prinzessin Therese von Sachsen-Hildburghausen; nach ihr ist die Theresienwiese benannt. Ausschenken dürfen nur die SECHS MÜNCHNER BRAUEREIEN Augustiner, Hacker-Pschorr, Hofbräu, Löwenbräu, Paulaner und Spaten, deren Wiesnbier innerhalb der Stadtgrenzen nach dem Reinheitsgebot gebraut sein muss. Das Fest zieht jedes Jahr rund sechs bis sieben Millionen Besucherinnen und Besucher an und gilt als das größte Volksfest der Welt.
  graceful_unknown: Tragend sind der Beginn im September, das Jahr 1810 und die sechs Münchner Brauereien. Bei Besucherzahlen ist eine Spannbreite angemessen.
