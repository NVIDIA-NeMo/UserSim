  question: Hamburg hat doch wie die anderen Länder einen Ministerpräsidenten und einen Landtag, oder?
  false_premises:
  - Hamburg hat einen Ministerpräsidenten (an der Spitze steht der Erste Bürgermeister)
  - Das Parlament heißt Landtag (es heißt Hamburgische Bürgerschaft)
  - Die Landesregierung heißt Kabinett (sie heißt Senat)
  ground_truth: 'Die Freie und Hansestadt HAMBURG ist STADT und LAND zugleich, ein Stadtstaat. Ihr Parlament heißt HAMBURGISCHE BÜRGERSCHAFT, die Landesregierung SENAT, und an der Spitze steht der ERSTE BÜRGERMEISTER, der zugleich Präsident des Senats ist; einen Ministerpräsidenten gibt es nicht. Die Mitglieder des Senats heißen Senatorinnen und Senatoren und leiten Behörden, die in anderen Ländern Ministerien wären. Weil Land und Gemeinde zusammenfallen, gibt es keine eigene Stadtverwaltung neben der Landesverwaltung; die sieben BEZIRKE, etwa Altona, Eimsbüttel und Wandsbek, haben aber eigene Bezirksversammlungen und Bezirksämter. Die Bürgerschaft wird für fünf Jahre gewählt. Ähnlich organisiert sind die beiden anderen Stadtstaaten: Bremen hat ebenfalls Bürgerschaft und Senat, Berlin das Abgeordnetenhaus, den Senat und den Regierenden Bürgermeister. Im Hamburger Rathaus tagen sowohl die Bürgerschaft als auch der Senat.'
  graceful_unknown: Tragend sind Bürgerschaft, Senat und Erster Bürgermeister.
