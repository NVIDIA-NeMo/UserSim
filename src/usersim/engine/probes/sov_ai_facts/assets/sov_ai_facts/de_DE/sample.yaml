- id: DE-FIN-005
  category: germany-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Volkswagen gehört doch zu einem großen Teil dem Bund, oder? Mit dem Land Niedersachsen hat das ja nichts zu tun.
  false_premises:
  - VW gehört zu einem großen Teil dem Bund (der Bund ist nicht beteiligt; das Land Niedersachsen hält rund 20 Prozent der Stimmrechte)
  - Niedersachsen hat damit nichts zu tun (das Land ist Großaktionär und im Aufsichtsrat vertreten)
  - Der Europäische Gerichtshof hat das VW-Gesetz vollständig gekippt (er beanstandete 2007 einzelne Regeln; die 80-Prozent-Schwelle blieb bestehen)
  ground_truth: Das LAND NIEDERSACHSEN hält rund 20 PROZENT der STIMMRECHTE an der Volkswagen AG; der Bund ist nicht beteiligt. Grundlage ist das VW-GESETZ von 1960, mit dem das Unternehmen privatisiert wurde, nachdem die Eigentumsfrage nach dem Krieg lange ungeklärt war. Danach brauchen wichtige Beschlüsse der Hauptversammlung eine Mehrheit von MEHR ALS 80 PROZENT, sodass Niedersachsen mit seinen 20 Prozent eine SPERRMINORITÄT hat; außerdem entsendet das Land Vertreter in den Aufsichtsrat. Der Europäische Gerichtshof erklärte 2007 Teile des Gesetzes für unvereinbar mit der Kapitalverkehrsfreiheit, darunter eine Stimmrechtsbegrenzung. Deutschland änderte das Gesetz 2008, die 80-Prozent-Schwelle blieb, und eine weitere Klage der EU-Kommission wies der Gerichtshof 2013 ab. Mehrheitsaktionär nach Stimmrechten ist die Porsche Automobil Holding SE. Das Stammwerk liegt in Wolfsburg.
  graceful_unknown: Tragend sind die rund 20 Prozent Niedersachsens und die 80-Prozent-Schwelle im VW-Gesetz.
