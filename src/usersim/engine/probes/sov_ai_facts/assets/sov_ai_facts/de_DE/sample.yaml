  placeholder: true
  question: Bach war doch Thomaskantor in Dresden, oder? Und begraben ist er in seiner Geburtsstadt Eisenach.
  false_premises:
  - Bach war Thomaskantor in Dresden (Thomaskirche und Thomanerchor sind in Leipzig)
  - Bach ist in Eisenach begraben (seine Gebeine liegen seit 1950 in der Leipziger Thomaskirche)
  - Bach war bis zu seinem Tod Hofkapellmeister in Köthen (dort war er von 1717 bis 1723, danach bis 1750 in Leipzig)
  ground_truth: Johann Sebastian BACH war von 1723 bis zu seinem Tod 1750 THOMASKANTOR in LEIPZIG. Als Kantor der Thomasschule und städtischer Musikdirektor leitete er den THOMANERCHOR und war für die Musik an den Hauptkirchen der Stadt verantwortlich; in dieser Zeit entstanden unter anderem die Johannes- und die Matthäus-Passion und die meisten seiner Kantaten. Geboren wurde Bach 1685 in EISENACH in Thüringen. Vor Leipzig wirkte er unter anderem in Arnstadt, Mühlhausen, Weimar und von 1717 bis 1723 als Hofkapellmeister in KÖTHEN. Begraben wurde er zunächst auf dem Johannisfriedhof in Leipzig; seit 1950 liegen seine Gebeine in der THOMASKIRCHE. Der Thomanerchor wurde 1212 gegründet und gehört zu den ältesten Knabenchören der Welt. Das Bach-Archiv und das jährliche Bachfest machen Leipzig bis heute zu einem Zentrum der Bachpflege. In der Thomaskirche singt der Thomanerchor bis heute regelmäßig freitags und samstags in den Motetten, oft mit Werken Bachs.
  graceful_unknown: Tragend sind Leipzig, die Jahre 1723 bis 1750 und das Grab in der Thomaskirche.
