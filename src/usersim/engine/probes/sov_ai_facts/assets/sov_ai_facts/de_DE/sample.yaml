  - Der Bremer Roland stammt aus dem 19. Jahrhundert (er wurde 1404 errichtet)
  ground_truth: 'Im Märchen der Brüder Grimm machen sich Esel, Hund, Katze und Hahn auf den Weg nach Bremen, um dort Stadtmusikanten zu werden, KOMMEN dort aber NIE AN: Unterwegs vertreiben sie Räuber aus einem Haus im Wald und bleiben dort. Trotzdem sind sie ein Wahrzeichen der Stadt; die Bronzefigur von Gerhard Marcks steht seit 1953 an der Westseite des Rathauses. Das BREMER RATHAUS, im Kern ein gotischer Bau aus den Jahren 1405 bis 1410 mit einer Schaufassade der Weserrenaissance aus dem frühen 17. Jahrhundert, überstand den ZWEITEN WELTKRIEG weitgehend UNBESCHÄDIGT. Zusammen mit dem steinernen ROLAND von 1404, einem Symbol städtischer Freiheit und Marktrechte, gehört es seit 2004 zum UNESCO-WELTERBE. Der Roland ist mit Baldachin rund zehn Meter hoch und gilt als die größte freistehende Statue des deutschen Mittelalters. Das Rathaus ist bis heute Sitz des Senats und des Bürgermeisters.'
  graceful_unknown: 'Tragend sind: Die Tiere erreichen Bremen nie, Rathaus und Roland sind seit 2004 Welterbe, und das Rathaus überstand den Krieg.'
