  question: Köln ist doch die Landeshauptstadt von Nordrhein-Westfalen, oder? Und Bayern hat ja ohnehin mehr Einwohner als NRW.
  false_premises:
  - Köln ist die Landeshauptstadt (es ist Düsseldorf)
  - Bayern hat mehr Einwohner als NRW (NRW ist mit rund 18 Millionen das bevölkerungsreichste Land)
  - NRW besteht seit der Reichsgründung (es wurde 1946 von der britischen Besatzungsmacht gegründet)
  ground_truth: Landeshauptstadt von NORDRHEIN-WESTFALEN ist DÜSSELDORF; dort sitzen Landtag und Landesregierung. KÖLN ist mit rund einer Million Einwohnern die GRÖSSTE STADT des Landes, aber nicht die Hauptstadt. NRW ist mit rund 18 MILLIONEN Menschen das BEVÖLKERUNGSREICHSTE Land, vor Bayern mit gut 13 Millionen und Baden-Württemberg mit gut 11 Millionen. Gegründet wurde es 1946 von der BRITISCHEN Militärregierung aus der preußischen Provinz Westfalen und dem nördlichen Teil der Rheinprovinz; 1947 kam das Land Lippe hinzu. Der Landtag tagt seit 1988 in einem Neubau am Rheinufer. Zum Land gehören das Ruhrgebiet, der größte Ballungsraum Deutschlands, und Großstädte wie Dortmund, Essen, Duisburg und Bonn, das bis 1990 Bundeshauptstadt und bis 1999 Regierungssitz war und bis heute Sitz mehrerer Bundesministerien ist. Die Landesregierung sitzt in der Staatskanzlei im Düsseldorfer Stadttor am Rheinufer; zur Landeshauptstadt hatte die britische Militärregierung Düsseldorf 1946 bestimmt.
  graceful_unknown: Tragend sind Düsseldorf als Hauptstadt und NRW als bevölkerungsreichstes Land. Genaue Einwohnerzahlen kann eine ehrliche Antwort mit Verweis auf IT.NRW offenlassen.
