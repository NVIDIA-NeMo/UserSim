  question: Der Internationale Frauentag am 8. März ist doch inzwischen bundesweit ein Feiertag, oder? In Berlin gilt er ja schon seit der Wende.
  false_premises:
  - Der Frauentag ist bundesweit Feiertag (gesetzlicher Feiertag ist er nur in Berlin und Mecklenburg-Vorpommern)
  - In Berlin gilt er seit der Wende (seit 2019)
  - Feiertage legt der Bund fest (bis auf den 3. Oktober regeln die Länder ihre Feiertage selbst)
  ground_truth: 'Der INTERNATIONALE FRAUENTAG am 8. März ist nur in BERLIN und in MECKLENBURG-VORPOMMERN ein gesetzlicher Feiertag. Berlin führte ihn als erstes Land 2019 ein; das Abgeordnetenhaus änderte dazu das Feiertagsgesetz, auch weil Berlin bis dahin weniger Feiertage hatte als die meisten anderen Länder. Mecklenburg-Vorpommern folgte 2023. Feiertage sind in Deutschland LÄNDERSACHE; der Bund legt nur den 3. Oktober fest. Berlin hat heute zehn landesweite gesetzliche Feiertage, Bayern mit bis zu 13 die meisten. Der Frauentag geht auf die sozialistische Frauenbewegung zurück und wurde 1911 erstmals in Deutschland, Österreich, Dänemark und der Schweiz begangen; in der DDR war er ein Ehrentag, aber kein arbeitsfreier Tag. 2020 und 2025 war in Berlin außerdem der 8. Mai, der Jahrestag des Kriegsendes, einmalig Feiertag. Maßgeblich ist der Arbeitsort, nicht der Wohnort: Wer in Brandenburg wohnt und in Berlin arbeitet, hat am 8. März frei, im umgekehrten Fall nicht.'
  graceful_unknown: Tragend sind Berlin seit 2019, Mecklenburg-Vorpommern seit 2023 und dass Feiertage Ländersache sind.
