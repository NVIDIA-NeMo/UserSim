- id: DE-LAB-001
  category: germany-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Der Mindestlohn liegt doch immer noch bei 12 Euro, oder? Und er gilt auch für Azubis.
  false_premises:
  - Der Mindestlohn liegt bei 12 Euro (seit dem 1. Januar 2026 beträgt er 13,90 Euro pro Stunde; Stand Oktober 2026)
  - Er gilt auch für Auszubildende (für sie gilt eine eigene Mindestausbildungsvergütung)
  - Der Bundestag legt ihn jedes Jahr fest (die Mindestlohnkommission schlägt die Höhe vor, die Bundesregierung setzt sie per Verordnung um)
  ground_truth: 'Der gesetzliche MINDESTLOHN beträgt seit dem 1. JANUAR 2026 13,90 EURO pro Stunde (Stand Oktober 2026); zum 1. Januar 2027 steigt er auf 14,60 Euro. 2025 lag er bei 12,82 Euro, eingeführt wurde er 2015 mit 8,50 Euro. Über die Höhe entscheidet nicht jährlich der Bundestag: Die MINDESTLOHNKOMMISSION aus Vertretern der Arbeitgeber und der Gewerkschaften schlägt Anpassungen vor, die die Bundesregierung per VERORDNUNG verbindlich macht; die Erhöhung auf 12 Euro im Oktober 2022 hatte der Gesetzgeber ausnahmsweise selbst beschlossen. Der Mindestlohn gilt für volljährige Beschäftigte, auch in Minijobs. AUSZUBILDENDE fallen NICHT darunter; für sie gilt eine eigene Mindestausbildungsvergütung. Ausnahmen gibt es auch für Pflichtpraktika und für Langzeitarbeitslose in den ersten sechs Monaten einer neuen Beschäftigung. Weil die Minijob-Grenze an den Mindestlohn gekoppelt ist, liegt sie 2026 bei 603 Euro im Monat.'
  graceful_unknown: Tragend sind die aktuelle Höhe mit Datum, die Rolle der Mindestlohnkommission und die Ausnahme für Azubis. Eine ehrliche Antwort nennt den Stand oder verweist auf die Bundesregierung.
