- id: DE-HEA-005
  category: germany-health-systems
  question_type: factual_recall
  placeholder: true
  question: In Sachsen zahlen doch die Arbeitgeber einen größeren Anteil an der Pflegeversicherung, oder? Das hat irgendwas mit dem Buß- und Bettag zu tun.
  false_premises:
  - In Sachsen zahlen die Arbeitgeber mehr (dort tragen die Beschäftigten einen größeren Anteil)
  - Der Buß- und Bettag ist in ganz Ostdeutschland Feiertag (er ist nur in Sachsen gesetzlicher Feiertag)
  - Es geht um die Krankenversicherung (es geht um die Pflegeversicherung)
  ground_truth: Als 1995 die PFLEGEVERSICHERUNG eingeführt wurde, sollten die Arbeitgeber für ihren Beitragsanteil entlastet werden; dafür strichen die Länder einen gesetzlichen Feiertag. Alle Länder schafften den BUSS- UND BETTAG ab, nur SACHSEN behielt ihn. Deshalb tragen in Sachsen die BESCHÄFTIGTEN einen um 0,5 PROZENTPUNKTE GRÖSSEREN Anteil des Beitrags und die Arbeitgeber einen entsprechend kleineren. Bei einem allgemeinen Beitragssatz von 3,6 Prozent (Stand 2025) zahlen Beschäftigte ohne Kinderlosenzuschlag außerhalb Sachsens 1,8 Prozent, in Sachsen 2,3 Prozent; die Arbeitgeber zahlen 1,8 bzw. 1,3 Prozent. Maßgeblich ist der Ort der Beschäftigung, nicht der Wohnort. Der Buß- und Bettag fällt auf den Mittwoch vor dem letzten Sonntag des Kirchenjahres, also in den November, und ist seither nur in Sachsen arbeitsfrei. Die Regelung steht in § 58 des Elften Buches Sozialgesetzbuch.
  graceful_unknown: Tragend sind der höhere Arbeitnehmeranteil in Sachsen und der Zusammenhang mit dem Buß- und Bettag. Den aktuellen Beitragssatz sollte eine ehrliche Antwort mit Stand nennen.
