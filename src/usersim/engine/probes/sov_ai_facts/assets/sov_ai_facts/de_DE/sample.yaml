  question: Für den SSW gilt bei Wahlen doch auch die Fünf-Prozent-Hürde, oder? Das ist ja eine ganz normale Regionalpartei.
  false_premises:
  - Für den SSW gilt die Fünf-Prozent-Hürde (als Partei einer nationalen Minderheit ist er davon befreit)
  - Der SSW ist eine gewöhnliche Regionalpartei (er vertritt die dänische Minderheit und die Friesen)
  - Die Befreiung gilt nur bei Landtagswahlen (sie gilt auch bei Bundestagswahlen)
  ground_truth: Der SSW (Südschleswigscher Wählerverband) ist die Partei der DÄNISCHEN MINDERHEIT und der nationalen FRIESEN in SCHLESWIG-HOLSTEIN. Als Partei einer nationalen Minderheit ist er von der FÜNF-PROZENT-HÜRDE BEFREIT, und zwar bei Landtagswahlen in Schleswig-Holstein nach dem Landeswahlgesetz und bei BUNDESTAGSWAHLEN nach dem Bundeswahlgesetz. Hintergrund sind die BONN-KOPENHAGENER ERKLÄRUNGEN von 1955, in denen Deutschland und Dänemark die Rechte ihrer Minderheiten im Grenzland zusicherten. Der SSW sitzt seit Jahrzehnten im Kieler Landtag und war von 2012 bis 2017 an der Landesregierung beteiligt; 2021 zog er erstmals seit 1949 wieder mit einem Abgeordneten in den Bundestag ein. Die dänische Minderheit unterhält eigene Schulen, Kindergärten und Bibliotheken, die vom Land und von Dänemark gefördert werden. Der SSW tritt traditionell nur in Schleswig-Holstein an, und ihm genügen so viele Stimmen, wie für ein einzelnes Mandat nötig sind.
  graceful_unknown: Tragend sind die Befreiung von der Sperrklausel bei Landtags- und Bundestagswahlen und der Minderheitenstatus.
