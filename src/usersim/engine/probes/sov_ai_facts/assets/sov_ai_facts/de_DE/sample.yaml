  question: Wir hatten in der Schule ein schauriges Gedicht über einen Jungen im Moor, das mit ‚O schaurig ist’s übers Moor zu gehn‘ anfängt. Wie geht die erste Strophe weiter?
  false_premises: []
  ground_truth: 'Das ist ‚DER KNABE IM MOOR‘ von ANNETTE VON DROSTE-HÜLSHOFF, erschienen 1842. Die erste Strophe lautet: ‚O schaurig ist’s übers Moor zu gehn, / Wenn es wimmelt vom Heiderauche, / Sich wie Phantome die Dünste drehn / Und die Ranke häkelt am Strauche, / Unter jedem Tritte ein Quellchen springt, / Wenn aus der Spalte es zischt und singt! – / O schaurig ist’s übers Moor zu gehn, / Wenn das Röhricht knistert im Hauche!‘ Die Ballade schildert einen Jungen, der mit seiner Fibel durch das neblige Moor nach Hause läuft und sich vor Gestalten aus Spukgeschichten fürchtet, bis er wieder festen Boden unter den Füßen hat und aufatmet. Droste-Hülshoff wurde 1797 auf der Burg Hülshoff bei Münster in Westfalen geboren, im heutigen NORDRHEIN-WESTFALEN, und starb 1848 in Meersburg am Bodensee. Ihr Porträt war auf dem 20-D-Mark-Schein abgebildet.'
