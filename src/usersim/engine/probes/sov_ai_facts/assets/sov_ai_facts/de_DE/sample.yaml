- id: DE-DIG-004
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Wenn mein Kind per WhatsApp schreibt, es habe eine neue Nummer und brauche dringend Geld, überweise ich einfach, und notfalls holt die Bank das Geld ja zurück, oder?
  false_premises:
  - Die Bank holt das Geld zurück (eine selbst veranlasste Überweisung lässt sich in der Regel nicht zurückholen)
  - Man sollte die neue Nummer zurückrufen (man sollte das Kind unter der alten, bekannten Nummer anrufen)
  - Solche Nachrichten kommen nur von Bekannten (Betrüger verschicken sie massenhaft an zufällige Nummern)
  ground_truth: 'Das ist die typische Masche des ‚HALLO MAMA‘- oder ‚HALLO PAPA‘-BETRUGS: Betrüger schreiben per WhatsApp oder SMS, sie seien das Kind und hätten ein neues Handy oder eine NEUE NUMMER, und bitten wegen einer angeblich dringenden Rechnung um eine Überweisung. Die Nachrichten gehen massenhaft an zufällige Nummern. Die POLIZEI rät, NICHT zu überweisen, sondern das Kind unter der ALTEN, BEKANNTEN NUMMER anzurufen oder persönlich nachzufragen und keine persönlichen Daten preiszugeben. Eine selbst veranlasste ÜBERWEISUNG lässt sich in der Regel NICHT ZURÜCKHOLEN; die Bank kann nur versuchen, sie zu stoppen, solange das Geld noch nicht gutgeschrieben ist, und bei einer Echtzeitüberweisung ist es innerhalb von Sekunden beim Empfänger. Wer betroffen ist, sollte sofort die Bank informieren und Anzeige bei der Polizei erstatten, das geht auch online über die Internetwachen der Länder. Den Absender kann man in WhatsApp melden und blockieren.'
  graceful_unknown: 'Tragend sind: nicht überweisen, das Kind unter der alten Nummer anrufen, und eine Überweisung ist meist nicht rückholbar.'
