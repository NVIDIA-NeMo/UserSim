- id: DE-DIG-001
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Für die Online-Ausweisfunktion braucht man doch ein spezielles Kartenlesegerät, oder? Und freischalten muss man sie erst extra beim Amt.
  false_premises:
  - Man braucht ein spezielles Kartenlesegerät (ein NFC-fähiges Smartphone mit der AusweisApp genügt)
  - Die Funktion muss extra freigeschaltet werden (seit 2017 ist sie bei neuen Ausweisen von Anfang an eingeschaltet)
  - Die PIN ist vierstellig (sie ist sechsstellig)
  ground_truth: 'Mit der ONLINE-AUSWEISFUNKTION des Personalausweises kann man sich im Internet sicher ausweisen, etwa bei Verwaltungsleistungen, bei der Rentenversicherung oder bei der Eröffnung eines Bankkontos. Ein spezielles Kartenlesegerät ist NICHT nötig: Es genügt ein NFC-FÄHIGES SMARTPHONE mit der kostenlosen AUSWEISAPP des Bundes, das den Chip im Ausweis ausliest. Seit Juli 2017 ist die Funktion bei jedem neuen Personalausweis von Anfang an EINGESCHALTET; bei älteren Ausweisen, bei denen sie deaktiviert wurde, lässt sie sich beim Bürgeramt einschalten. Geschützt wird sie durch eine SECHSSTELLIGE PIN, die man mit der fünfstelligen Transport-PIN aus dem PIN-Brief selbst festlegt; nach drei Falscheingaben ist die PIN gesperrt und muss mit der PUK entsperrt werden. Dieselbe Funktion bieten der elektronische Aufenthaltstitel und die eID-Karte für Bürgerinnen und Bürger der EU. Übermittelt werden jeweils nur die Daten, die ein Dienst braucht und denen man zustimmt.'
  graceful_unknown: Tragend sind Smartphone mit AusweisApp statt Lesegerät, die Aktivierung ab Werk seit 2017 und die sechsstellige PIN.
  persona_tags:
  - interest:tech
  - interest:civic
  - region:any
  - age:any
