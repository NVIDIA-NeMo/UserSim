- id: DE-DIG-002
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Für die Steuererklärung über ELSTER muss man doch Gebühren zahlen, oder? Das ist ja ein privater Anbieter, und abgeben muss man sie bis zum 31. Mai.
  false_premises:
  - ELSTER kostet Gebühren (es ist kostenlos)
  - ELSTER ist ein privater Anbieter (es ist das Portal der Steuerverwaltungen von Bund und Ländern)
  - Die Abgabefrist ist der 31. Mai (für Pflichtveranlagte ohne Steuerberatung ist es regulär der 31. Juli des Folgejahres)
  ground_truth: ELSTER (Elektronische Steuererklärung) ist das OFFIZIELLE und KOSTENLOSE Portal der STEUERVERWALTUNGEN von Bund und Ländern; über ‚Mein ELSTER‘ kann man die Einkommensteuererklärung und viele andere Formulare direkt an das Finanzamt übermitteln. Für die Anmeldung braucht man ein Benutzerkonto, das meist über eine Zertifikatsdatei abgesichert ist; alternativ geht es mit der Online-Ausweisfunktion. Viele Angaben wie die Lohnsteuerbescheinigung oder Renten- und Versicherungsbeiträge lassen sich über den Belegabruf vorausfüllen. Wer zur Abgabe einer Steuererklärung VERPFLICHTET ist und sie selbst macht, hat regulär bis zum 31. JULI des Folgejahres Zeit; mit Steuerberatung verlängert sich die Frist deutlich. Der 31. Mai galt bis zum Steuerjahr 2017. Wer freiwillig eine Erklärung abgibt, etwa weil er eine Erstattung erwartet, hat dafür vier Jahre Zeit. Kommerzielle Steuerprogramme nutzen im Hintergrund dieselbe Schnittstelle, sind aber kostenpflichtige Angebote privater Firmen.
  graceful_unknown: 'Tragend sind: kostenlos, staatlich und regulär der 31. Juli für Pflichtveranlagte.'
