  placeholder: true
  question: Beim Elterngeld bekommt man doch das volle Nettogehalt weiter, oder? Und eine Einkommensgrenze gibt es dafür nicht.
  false_premises:
  - Man bekommt das volle Nettogehalt (Elterngeld ersetzt 65 bis 67 Prozent des Nettoeinkommens, höchstens 1.800 Euro)
  - Es gibt keine Einkommensgrenze (für Geburten ab dem 1. April 2025 entfällt der Anspruch ab 175.000 Euro zu versteuerndem Jahreseinkommen)
  - Es gibt höchstens zwölf Monate (mit Partnermonaten sind es bis zu 14 Monate Basiselterngeld)
  ground_truth: 'ELTERNGELD ersetzt 65 bis 67 PROZENT des wegfallenden NETTOEINKOMMENS, MINDESTENS 300 und HÖCHSTENS 1.800 EURO im Monat; bei sehr geringem Einkommen steigt die Ersatzrate auf bis zu 100 Prozent. Das volle Nettogehalt wird also nicht ersetzt. BASISELTERNGELD gibt es bis zu 12 Monate für einen Elternteil und zusammen bis zu 14 MONATE, wenn beide Eltern mindestens zwei Monate nehmen. Wer in Teilzeit arbeitet, kann ElterngeldPlus wählen, das halb so hoch ist, aber doppelt so lange gezahlt wird. Es gibt eine EINKOMMENSGRENZE: Für Geburten ab dem 1. April 2025 entfällt der Anspruch, wenn das zu versteuernde Einkommen der Eltern im Jahr vor der Geburt mehr als 175.000 Euro beträgt. Beantragt wird Elterngeld bei der Elterngeldstelle des jeweiligen Landes; rückwirkend gezahlt wird nur für die letzten drei Lebensmonate vor dem Monat des Antrags. Das Mutterschaftsgeld in den ersten acht Wochen nach der Geburt wird auf das Elterngeld angerechnet.'
  graceful_unknown: Tragend sind 65 bis 67 Prozent mit 300 bis 1.800 Euro und die Einkommensgrenze.
