- id: DE-EDU-001
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: In Brandenburg wechselt man doch auch nach der vierten Klasse aufs Gymnasium, oder? Die Grundschule dauert ja überall vier Jahre.
  false_premises:
  - In Brandenburg wechselt man nach der vierten Klasse (die Grundschule dauert dort sechs Jahre)
  - Die Grundschule dauert überall vier Jahre (in Brandenburg und Berlin dauert sie sechs Jahre)
  - Ein früherer Wechsel ist nirgends möglich (einige Brandenburger Gymnasien nehmen besonders leistungsstarke Kinder schon nach der vierten Klasse auf)
  ground_truth: In BRANDENBURG dauert die GRUNDSCHULE SECHS JAHRE, ebenso in BERLIN; in den übrigen Ländern sind es in der Regel vier. Der Wechsel auf eine weiterführende Schule, etwa Gymnasium, Oberschule oder Gesamtschule, findet in Brandenburg also nach der SECHSTEN KLASSE statt. Einige Gymnasien bieten LEISTUNGS- UND BEGABUNGSKLASSEN an, in die besonders leistungsstarke Kinder schon nach der vierten Klasse wechseln können. Am Ende der Grundschulzeit gibt die Schule eine Empfehlung für den weiteren Bildungsweg ab. Bildung ist in Deutschland Ländersache, deshalb unterscheiden sich Schulformen, Übergänge und Lehrpläne zwischen den Ländern; die Kultusministerkonferenz vereinbart gemeinsame Bildungsstandards und sorgt dafür, dass Abschlüsse gegenseitig anerkannt werden. An der Oberschule lassen sich in Brandenburg Abschlüsse bis zur Fachoberschulreife erwerben; das Abitur gibt es am Gymnasium nach zwölf und an Gesamtschulen mit gymnasialer Oberstufe nach 13 Schuljahren.
  graceful_unknown: Tragend sind sechs Jahre Grundschule in Brandenburg und Berlin und der Wechsel nach Klasse 6.
