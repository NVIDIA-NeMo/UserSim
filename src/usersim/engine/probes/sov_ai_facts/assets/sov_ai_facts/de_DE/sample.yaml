- id: DE-FIN-003
  category: germany-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Was man im Laden kauft, kann man doch immer 14 Tage lang zurückgeben, oder? Und online sind es sogar 30 Tage.
  false_premises:
  - Im Laden gekaufte Ware kann man immer zurückgeben (ein gesetzliches Widerrufsrecht gibt es dort nicht; ein Umtausch ist Kulanz)
  - Online sind es 30 Tage (die gesetzliche Widerrufsfrist beträgt 14 Tage)
  - Man muss einen Grund angeben (der Widerruf braucht keine Begründung)
  ground_truth: 'Ein gesetzliches WIDERRUFSRECHT von 14 TAGEN gibt es bei Verträgen im FERNABSATZ, also etwa beim Online-Kauf, und bei Verträgen außerhalb von Geschäftsräumen, etwa an der Haustür. Die Frist beginnt bei Waren in der Regel mit dem Erhalt der Ware; der Widerruf braucht KEINE BEGRÜNDUNG, muss aber eindeutig erklärt werden, das bloße Zurückschicken genügt nicht immer. Wer nicht ordnungsgemäß über das Widerrufsrecht belehrt wurde, kann bis zu einem Jahr und 14 Tagen widerrufen. Ausgenommen sind etwa maßgefertigte Waren, schnell verderbliche Lebensmittel und versiegelte Hygieneartikel, deren Siegel entfernt wurde. Im LADEN gibt es KEIN gesetzliches Widerrufsrecht: Ein Umtausch ist dort freiwillige KULANZ des Händlers. Viele Händler gewähren freiwillig längere Rückgabefristen, etwa 30 Tage; das ist dann eine vertragliche Zusage. Davon zu unterscheiden ist die gesetzliche GEWÄHRLEISTUNG: Bei Mängeln hat man zwei Jahre lang Rechte gegenüber dem Verkäufer.'
  graceful_unknown: Tragend sind 14 Tage nur bei Fernabsatz und Haustürgeschäften und dass es im Laden kein gesetzliches Widerrufsrecht gibt.
