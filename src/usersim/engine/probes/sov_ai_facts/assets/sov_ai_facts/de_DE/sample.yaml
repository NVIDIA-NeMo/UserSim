- id: DE-HIS-005
  category: germany-history
  question_type: factual_recall
  placeholder: true
  question: Luther hat seine 95 Thesen doch 1521 in Erfurt veröffentlicht, oder? Wittenberg liegt ja in Sachsen.
  false_premises:
  - Die Thesen erschienen 1521 (Luther veröffentlichte sie am 31. Oktober 1517)
  - Sie wurden in Erfurt veröffentlicht (es war Wittenberg)
  - Wittenberg liegt in Sachsen (Lutherstadt Wittenberg liegt in Sachsen-Anhalt)
  ground_truth: Martin LUTHER veröffentlichte seine 95 THESEN gegen den Ablasshandel am 31. OKTOBER 1517 in WITTENBERG; ob er sie tatsächlich an die Tür der Schlosskirche schlug, ist unter Historikern umstritten. Sicher ist, dass er sie an diesem Tag an Erzbischof Albrecht von Brandenburg schickte. Die Thesen gelten als Beginn der Reformation, und der 31. Oktober ist deshalb Reformationstag. Die LUTHERSTADT WITTENBERG liegt heute in SACHSEN-ANHALT, ebenso wie Lutherstadt Eisleben, wo Luther 1483 geboren wurde und 1546 starb; die Lutherstätten in beiden Städten gehören seit 1996 zum UNESCO-Welterbe. 1521 ist das Jahr des Reichstags zu WORMS, auf dem Luther den Widerruf verweigerte; anschließend versteckte er sich auf der Wartburg bei Eisenach in Thüringen und übersetzte dort das Neue Testament ins Deutsche. In Erfurt hatte er studiert und war ins Augustinerkloster eingetreten.
  graceful_unknown: Tragend sind der 31. Oktober 1517, Wittenberg und Sachsen-Anhalt. Eine ehrliche Antwort sollte den umstrittenen Thesenanschlag nicht als gesichert darstellen.
