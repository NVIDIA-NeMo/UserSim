- id: DE-EDU-005
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: In Hamburg gibt es doch noch Haupt- und Realschulen, und die Grundschule dauert dort sechs Jahre, oder?
  false_premises:
  - In Hamburg gibt es Haupt- und Realschulen (nach der Grundschule gibt es nur Stadtteilschule und Gymnasium)
  - Die Grundschule dauert sechs Jahre (sie dauert vier Jahre; eine sechsjährige Primarschule scheiterte 2010 in einem Volksentscheid)
  - An der Stadtteilschule kann man kein Abitur machen (dort ist das Abitur nach 13 Jahren möglich)
  ground_truth: 'In HAMBURG gibt es nach der vierjährigen GRUNDSCHULE nur ZWEI weiterführende Schulformen: das GYMNASIUM, das in zwölf Jahren zum Abitur führt, und die STADTTEILSCHULE, an der man alle Abschlüsse bis zum ABITUR nach 13 Jahren erwerben kann. Haupt-, Real- und Gesamtschulen gingen 2010 in der Stadtteilschule auf. Der Senat wollte damals auch eine sechsjährige PRIMARSCHULE einführen; diesen Teil der Reform stoppte im Juli 2010 ein VOLKSENTSCHEID, den die Initiative ‚Wir wollen lernen‘ angestoßen hatte. Das Zwei-Säulen-Modell blieb, die Grundschule dauert weiterhin vier Jahre. Ähnliche Modelle gibt es in anderen Ländern, etwa in Bremen mit Oberschule und Gymnasium. Eltern entscheiden in Hamburg nach der Grundschule selbst über die Schulform; die Empfehlung der Schule ist nicht bindend. Die Stadtteilschulen arbeiten in der Regel als Ganztagsschulen, und viele haben eine eigene gymnasiale Oberstufe oder kooperieren dafür mit einer anderen Schule.'
  graceful_unknown: Tragend sind Stadtteilschule und Gymnasium als einzige weiterführende Formen und das gescheiterte Primarschul-Vorhaben von 2010.
