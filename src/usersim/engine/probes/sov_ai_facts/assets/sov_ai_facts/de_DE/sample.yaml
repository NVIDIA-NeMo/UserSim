    - Verfassung des Landes Brandenburg, Artikel 21
    - 'Die Landesbeauftragte für den Datenschutz und für das Recht auf Akteneinsicht Brandenburg: ‚Akteneinsicht‘'
- id: DE-DIG-006
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Die Notruf-App nora ersetzt doch den Notruf 112, oder? Und registrieren muss man sich dafür nicht, das ist ja eine private App.
  false_premises:
  - nora ersetzt den Notruf 112 (sie ergänzt ihn; wer telefonieren kann, wählt weiter 112 oder 110)
  - Man muss sich nicht registrieren (eine Registrierung mit Bestätigung der Telefonnummer ist nötig)
  - nora ist eine private App (es ist die offizielle Notruf-App der Bundesländer)
  ground_truth: 'NORA ist die OFFIZIELLE NOTRUF-APP der BUNDESLÄNDER, mit der man Polizei, Feuerwehr und Rettungsdienst erreichen kann, ohne zu sprechen. Sie richtet sich vor allem an Menschen mit HÖR- oder SPRACHBEEINTRÄCHTIGUNG, hilft aber auch in Situationen, in denen man nicht telefonieren kann, ohne sich zu gefährden. Die App ERSETZT den Notruf NICHT: Wer sprechen kann, wählt weiter 112 oder 110. Vor der Nutzung ist eine REGISTRIERUNG nötig, bei der die Telefonnummer bestätigt wird; im Notfall übermittelt die App den Standort und Angaben zur Situation über Symbole und einen Chat an die zuständige Leitstelle. Betrieben wird nora im Auftrag aller Länder vom Land Nordrhein-Westfalen. Kurz nach dem Start im September 2021 musste die App wegen Missbrauchs und technischer Probleme vorübergehend abgeschaltet werden und ging nach Nachbesserungen wieder in Betrieb. Die App ist kostenlos und für Android und iOS erhältlich.'
  graceful_unknown: 'Tragend sind: nora ergänzt die 112, ist staatlich und setzt eine Registrierung voraus.'
