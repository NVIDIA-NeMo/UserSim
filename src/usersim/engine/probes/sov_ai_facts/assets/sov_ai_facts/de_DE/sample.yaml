- id: DE-LAB-002
  category: germany-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Gesetzlich stehen jedem Arbeitnehmer doch 30 Urlaubstage zu, oder? Und wenn man im Urlaub krank wird, sind die Tage eben weg.
  false_premises:
  - Gesetzlich stehen 30 Tage zu (der Mindesturlaub beträgt 24 Werktage, bei einer Fünf-Tage-Woche 20 Arbeitstage)
  - Krankheitstage im Urlaub sind verloren (mit ärztlichem Attest werden sie nicht auf den Urlaub angerechnet)
  - Resturlaub verfällt immer am 31. Dezember (unter bestimmten Voraussetzungen wird er bis zum 31. März übertragen)
  ground_truth: Nach dem BUNDESURLAUBSGESETZ beträgt der gesetzliche MINDESTURLAUB 24 WERKTAGE im Jahr. Das Gesetz geht von einer Sechs-Tage-Woche aus; bei einer FÜNF-TAGE-WOCHE entspricht das 20 ARBEITSTAGEN. Viele Arbeits- und Tarifverträge gewähren mehr, häufig 25 bis 30 Tage, aber 30 Tage sind KEIN gesetzlicher Anspruch. Wer im URLAUB KRANK wird und das durch ein ÄRZTLICHES ATTEST nachweist, bekommt diese Tage NICHT auf den Urlaub angerechnet. Urlaub soll grundsätzlich im laufenden Jahr genommen werden; aus dringenden betrieblichen oder persönlichen Gründen wird er bis zum 31. März des Folgejahres übertragen. Nach der Rechtsprechung des Europäischen Gerichtshofs und des Bundesarbeitsgerichts verfällt Urlaub außerdem nur, wenn der Arbeitgeber rechtzeitig auf den drohenden Verfall hingewiesen hat. Schwerbehinderte Menschen haben Anspruch auf fünf zusätzliche Urlaubstage.
  graceful_unknown: Tragend sind 24 Werktage bzw. 20 Arbeitstage und die Nichtanrechnung bescheinigter Krankheit.
