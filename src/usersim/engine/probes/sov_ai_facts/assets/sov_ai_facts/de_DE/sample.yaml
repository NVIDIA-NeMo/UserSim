- id: DE-EDU-006
  category: germany-education
  question_type: factual_recall
  placeholder: true
  question: Studieren ist in Deutschland doch für alle kostenlos, auch in Baden-Württemberg, oder? Egal, woher man kommt.
  false_premises:
  - Studieren ist überall für alle gebührenfrei (Baden-Württemberg erhebt Gebühren von Studierenden aus Staaten außerhalb der EU)
  - Die Gebühren gelten auch für EU-Bürger (sie gelten nur für Studierende aus Staaten außerhalb von EU und EWR)
  - Es fallen gar keine Kosten an (alle Studierenden zahlen einen Semesterbeitrag)
  ground_truth: Ein Erststudium an staatlichen Hochschulen ist in Deutschland weitgehend GEBÜHRENFREI; die allgemeinen Studiengebühren wurden bis 2014 in allen Ländern wieder abgeschafft. BADEN-WÜRTTEMBERG erhebt jedoch seit dem Wintersemester 2017/18 Gebühren von 1.500 EURO pro Semester von INTERNATIONALEN Studierenden aus Staaten AUSSERHALB der EU und des Europäischen Wirtschaftsraums, mit Ausnahmen etwa für Geflüchtete und für Bildungsinländer, die ihre Hochschulzugangsberechtigung in Deutschland erworben haben. Für ein Zweitstudium verlangt das Land 650 Euro pro Semester. Unabhängig davon zahlen alle Studierenden einen SEMESTERBEITRAG für Studierendenwerk, Verwaltung und oft ein Semesterticket, je nach Hochschule meist einige hundert Euro. Inzwischen verlangen auch einzelne Hochschulen in anderen Ländern Gebühren von Studierenden aus Drittstaaten, etwa die Technische Universität München.
  graceful_unknown: Tragend sind 1.500 Euro für Nicht-EU-Studierende in Baden-Württemberg und der allgemeine Semesterbeitrag.
