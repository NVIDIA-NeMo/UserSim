  placeholder: true
  question: Das Rentenalter liegt in Deutschland doch bei 65, oder? Und mit 63 kann sowieso jeder abschlagsfrei in Rente gehen.
  false_premises:
  - Das Rentenalter liegt bei 65 (die Regelaltersgrenze steigt schrittweise auf 67)
  - Mit 63 kann jeder abschlagsfrei in Rente gehen (abschlagsfrei vorzeitig nur nach 45 Beitragsjahren, und auch diese Grenze steigt auf 65)
  - Die Rente mit 67 gilt erst ab Jahrgang 1970 (sie gilt für alle ab Jahrgang 1964)
  ground_truth: Die REGELALTERSGRENZE der gesetzlichen Rentenversicherung steigt seit 2012 schrittweise von 65 auf 67 JAHRE. Für alle, die 1964 oder später geboren sind, liegt sie bei 67; wer 1960 geboren wurde, erreicht sie mit 66 Jahren und 4 Monaten. Beschlossen wurde das 2007 mit dem RV-Altersgrenzenanpassungsgesetz. ABSCHLAGSFREI vorzeitig in Rente gehen können nur BESONDERS LANGJÄHRIG VERSICHERTE mit 45 Beitragsjahren; die oft zitierte ‚Rente mit 63‘ galt in dieser Form nur für ältere Jahrgänge, inzwischen steigt diese Altersgrenze schrittweise auf 65. Mit 35 Versicherungsjahren ist eine Rente ab 63 möglich, aber mit ABSCHLÄGEN von 0,3 Prozent für jeden Monat des früheren Rentenbeginns, höchstens 14,4 Prozent. Die Deutsche Rentenversicherung schickt Versicherten ab 27 Jahren jährlich eine Renteninformation mit der voraussichtlichen Rentenhöhe. Wer über die Regelaltersgrenze hinaus arbeitet und die Rente später beginnt, erhält für jeden Monat einen Zuschlag von 0,5 Prozent.
  graceful_unknown: Tragend sind 67 für Jahrgänge ab 1964 und dass ein abschlagsfreier früherer Beginn 45 Beitragsjahre voraussetzt.
