- id: DE-FIN-001
  category: germany-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Die Kirchensteuer beträgt doch überall in Deutschland 9 Prozent vom Bruttolohn, oder? Auch hier in Baden-Württemberg.
  false_premises:
  - Sie beträgt überall 9 Prozent (in Baden-Württemberg und Bayern sind es 8 Prozent)
  - Sie wird vom Bruttolohn berechnet (Bemessungsgrundlage ist die Lohn- bzw. Einkommensteuer)
  - Austreten kann man nur bei der Kirche (der Austritt wird beim Standesamt oder Amtsgericht erklärt)
  ground_truth: 'Die KIRCHENSTEUER beträgt in BADEN-WÜRTTEMBERG und BAYERN 8 PROZENT, in allen anderen Ländern 9 PROZENT. Berechnet wird sie NICHT vom Bruttolohn, sondern von der LOHN- bzw. EINKOMMENSTEUER: Wer 500 Euro Lohnsteuer im Monat zahlt, zahlt in Baden-Württemberg also 40 Euro Kirchensteuer, in Hessen 45 Euro. Erhoben wird sie von den evangelischen Landeskirchen, den katholischen Bistümern und einigen weiteren Religionsgemeinschaften; der Staat zieht sie über die Finanzämter und den Lohnsteuerabzug ein und erhält dafür eine Verwaltungsgebühr. Gezahlte Kirchensteuer ist als Sonderausgabe absetzbar, und in vielen Ländern gibt es auf Antrag eine Kappung auf einen Höchstanteil des zu versteuernden Einkommens. Den AUSTRITT erklärt man je nach Land beim STANDESAMT oder beim AMTSGERICHT, nicht bei der Kirche; dafür kann eine Gebühr anfallen. Rechtsgrundlage ist Artikel 140 des Grundgesetzes, der die Kirchenartikel der Weimarer Verfassung übernimmt.'
  graceful_unknown: Tragend sind 8 Prozent in Baden-Württemberg und Bayern, 9 Prozent sonst, berechnet auf die Einkommensteuer.
