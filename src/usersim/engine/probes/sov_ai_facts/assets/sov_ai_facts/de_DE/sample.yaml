    - 'Polizeiliche Kriminalprävention der Länder und des Bundes: ‚Betrug über Messenger-Dienste‘'
    - 'Verbraucherzentrale: ‚Hallo Mama, Hallo Papa: Betrug per Messenger‘'
- id: DE-DIG-005
  category: germany-digital-services
  question_type: factual_recall
  placeholder: true
  question: Das erste Informationsfreiheitsgesetz in Deutschland war doch das des Bundes von 2006, oder? Brandenburg hat so etwas gar nicht.
  false_premises:
  - Das erste Informationsfreiheitsgesetz war das des Bundes von 2006 (Brandenburg hatte schon 1998 ein solches Gesetz)
  - Brandenburg hat kein solches Gesetz (es hat das Akteneinsichts- und Informationszugangsgesetz)
  - Ein Recht auf Akteneinsicht steht in keiner Landesverfassung (die Brandenburger Verfassung von 1992 garantiert es)
  ground_truth: 'BRANDENBURG war das ERSTE Land in Deutschland mit einem allgemeinen Recht auf Zugang zu Behördeninformationen: Das AKTENEINSICHTS- UND INFORMATIONSZUGANGSGESETZ (AIG) trat 1998 in Kraft, acht Jahre vor dem INFORMATIONSFREIHEITSGESETZ des BUNDES von 2006. Grundlage ist ARTIKEL 21 der BRANDENBURGER VERFASSUNG von 1992, der als erste deutsche Verfassungsbestimmung ein solches Recht auf Akteneinsicht garantiert. Danach kann jede Person Einsicht in Akten von Landesbehörden und Kommunen verlangen, ohne ein besonderes Interesse begründen zu müssen, soweit keine Ausnahmen etwa zum Schutz personenbezogener Daten oder von Betriebsgeheimnissen greifen. Inzwischen haben die meisten Länder eigene Informationsfreiheits- oder Transparenzgesetze; HAMBURG verpflichtete seine Behörden 2012 als erstes Land, viele Informationen von sich aus in einem Online-Register zu veröffentlichen. Über die Einhaltung wacht in Brandenburg die Landesbeauftragte für den Datenschutz und für das Recht auf Akteneinsicht.'
  graceful_unknown: Tragend sind Brandenburg 1998 als erstes Land und das Bundesgesetz erst 2006.
  persona_tags:
  - interest:civic
  - interest:tech
