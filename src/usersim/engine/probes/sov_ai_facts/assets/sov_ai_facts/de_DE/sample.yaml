  - Thüringen hat dafür den Reformationstag gestrichen (der Reformationstag ist dort weiterhin Feiertag)
  ground_truth: In THÜRINGEN ist seit 2019 der WELTKINDERTAG am 20. SEPTEMBER ein gesetzlicher Feiertag; Thüringen ist das EINZIGE Land mit diesem Feiertag. Der Landtag beschloss ihn 2019, auch weil Thüringen weniger Feiertage hatte als die süddeutschen Länder. Der 1. JUNI ist der Internationale Kindertag, der in der DDR und in vielen osteuropäischen Ländern gefeiert wurde und in Ostdeutschland bis heute in Kitas und Schulen begangen wird, aber nirgends in Deutschland arbeitsfrei ist. Der Weltkindertag geht auf eine Empfehlung der Vereinten Nationen von 1954 zurück, einen Tag für die Kinder zu begehen; das Datum legten die Staaten selbst fest, in der Bundesrepublik setzte sich der 20. September durch, während die Vereinten Nationen den 20. November begehen. Der REFORMATIONSTAG am 31. Oktober ist in Thüringen, wie in den anderen ostdeutschen Ländern, weiterhin gesetzlicher Feiertag.
  graceful_unknown: Tragend sind der 20. September, Thüringen als einziges Land und das Jahr 2019.
