- id: DE-HEA-002
  category: germany-health-systems
  question_type: factual_recall
  placeholder: true
  question: Wenn man nachts hohes Fieber hat, ruft man doch die 116 117 an, das ist ja die Notrufnummer bei Lebensgefahr, oder?
  false_premises:
  - Die 116 117 ist die Notrufnummer bei Lebensgefahr (das ist die 112; unter 116 117 erreicht man den ärztlichen Bereitschaftsdienst)
  - Die 112 erreicht man nur mit Vorwahl (sie funktioniert ohne Vorwahl und in der ganzen EU)
  - Der Bereitschaftsdienst kommt nie nach Hause (in bestimmten Fällen sind Hausbesuche möglich)
  ground_truth: 'Die 116 117 ist die bundesweite Nummer des ÄRZTLICHEN BEREITSCHAFTSDIENSTES der Kassenärztlichen Vereinigungen. Man ruft sie an, wenn man außerhalb der Sprechzeiten ärztliche Hilfe braucht, die nicht bis zum nächsten Tag warten kann, aber keine Lebensgefahr besteht, etwa bei hohem Fieber oder starken Schmerzen; der Dienst vermittelt eine Bereitschaftspraxis oder in bestimmten Fällen einen Hausbesuch. Über die 116 117 und die zugehörige Website vermitteln die Terminservicestellen auch Facharzttermine. Bei LEBENSGEFAHR, etwa bei Verdacht auf Herzinfarkt oder Schlaganfall, starker Atemnot oder schweren Unfällen, wählt man die 112: Sie erreicht Feuerwehr und Rettungsdienst, ist KOSTENLOS, braucht KEINE VORWAHL und gilt in der ganzen Europäischen Union. Die 110 ist der Polizeinotruf. Notrufe sind auch mit einem Prepaid-Handy ohne Guthaben möglich. Für Kinder und Jugendliche gibt es in vielen Regionen eigene kinderärztliche Bereitschaftspraxen, die ebenfalls über die 116 117 vermittelt werden.'
  graceful_unknown: 'Tragend ist die Unterscheidung: 116 117 für den Bereitschaftsdienst, 112 bei Lebensgefahr.'
