  question: Zuzahlungen bei der Krankenkasse sind doch nach oben offen, oder? Eine Grenze gibt es da nicht.
  false_premises:
  - Zuzahlungen sind unbegrenzt (es gilt eine Belastungsgrenze von 2 Prozent der jährlichen Bruttoeinnahmen)
  - Die Grenze greift automatisch (man muss bei der Krankenkasse eine Befreiung beantragen)
  - Für chronisch Kranke gilt dieselbe Grenze (für sie liegt sie bei 1 Prozent)
  ground_truth: 'Für gesetzlich Versicherte gilt eine jährliche BELASTUNGSGRENZE: Zuzahlungen, etwa für Arzneimittel, Heilmittel oder Krankenhausaufenthalte, muss man nur bis zu 2 PROZENT der jährlichen BRUTTOEINNAHMEN zum Lebensunterhalt leisten. Für SCHWERWIEGEND CHRONISCH KRANKE liegt die Grenze bei 1 PROZENT. Maßgeblich ist das Einkommen aller Angehörigen im Haushalt, wobei für den Ehepartner und für jedes Kind Freibeträge abgezogen werden. Die Befreiung kommt NICHT AUTOMATISCH: Man sammelt die Quittungen und beantragt bei der Krankenkasse eine Befreiung, sobald die Grenze erreicht ist; zu viel Gezahltes wird erstattet. Wer absehbar über der Grenze liegt, kann bei vielen Kassen den Betrag auch zu Jahresbeginn vorauszahlen und erhält dann gleich einen Befreiungsausweis. Die Regelung steht in § 62 des Fünften Buches Sozialgesetzbuch. Als schwerwiegend chronisch krank gilt in der Regel, wer mindestens ein Jahr lang wegen derselben Krankheit mindestens einmal im Quartal ärztlich behandelt wurde und zusätzlich etwa einen hohen Pflegegrad oder einen hohen Grad der Behinderung hat oder dauerhaft versorgt werden muss.'
  graceful_unknown: Tragend sind 2 Prozent, 1 Prozent für chronisch Kranke und dass man die Befreiung beantragen muss.
