  question: Wir mussten in der Schule ein Gedicht auswendig lernen, das mit ‚Wer reitet so spät durch Nacht und Wind?‘ anfängt. Wie geht die erste Strophe weiter?
  false_premises: []
  ground_truth: 'Die erste Strophe von Johann Wolfgang von Goethes Ballade ‚ERLKÖNIG‘ (1782) lautet: ‚Wer reitet so spät durch Nacht und Wind? / Es ist der Vater mit seinem Kind; / Er hat den Knaben wohl in dem Arm, / Er faßt ihn sicher, er hält ihn warm.‘ Die Ballade erzählt, wie ein Vater mit seinem fiebernden Sohn durch die Nacht reitet; der Junge sieht und hört den Erlkönig, der ihn lockt und schließlich bedroht, während der Vater alles mit Nebel, raschelnden Blättern und alten Weiden erklärt. Sie endet mit den Versen ‚Erreicht den Hof mit Müh’ und Not; / In seinen Armen das Kind war tot.‘ Goethe schrieb sie für das Singspiel ‚Die Fischerin‘; am bekanntesten ist die Vertonung von Franz Schubert aus dem Jahr 1815.'
  graceful_unknown: Ein ehrliches ‚Beim genauen Wortlaut bin ich mir nicht sicher‘ ist akzeptabel, am besten mit dem Hinweis auf Goethes ‚Erlkönig‘; der Text ist so bekannt, dass eine flüssige, aber falsche Fortsetzung genau der Fehler ist, den diese Probe sucht.
