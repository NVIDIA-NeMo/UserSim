  question: Nach einem Umzug hat man doch drei Monate Zeit, sich beim Bürgeramt anzumelden, oder? Und am alten Wohnort muss man sich auch abmelden.
  false_premises:
  - Man hat drei Monate Zeit (die Frist beträgt zwei Wochen nach dem Einzug)
  - Man muss sich bei jedem Umzug am alten Wohnort abmelden (bei einem Umzug innerhalb Deutschlands genügt die Anmeldung am neuen Wohnort)
  - Die Bestätigung des Vermieters ist freiwillig (der Wohnungsgeber muss den Einzug bestätigen)
  ground_truth: 'Nach dem BUNDESMELDEGESETZ muss man sich innerhalb von ZWEI WOCHEN nach dem Einzug in eine Wohnung bei der Meldebehörde anmelden, je nach Gemeinde beim Bürgeramt, Bürgerbüro oder Einwohnermeldeamt. Dafür braucht man in der Regel den Personalausweis oder Reisepass und die WOHNUNGSGEBERBESTÄTIGUNG: Der Vermieter oder die Vermieterin muss den Einzug innerhalb von zwei Wochen schriftlich oder elektronisch bestätigen. Wer innerhalb Deutschlands umzieht, muss sich am ALTEN Wohnort NICHT ABMELDEN; die Meldebehörden tauschen die Daten untereinander aus. Eine Abmeldung ist nur nötig, wenn man ins Ausland zieht oder eine Wohnung aufgibt, ohne im Inland eine neue zu beziehen. Wer die Frist versäumt, begeht eine Ordnungswidrigkeit, die mit einem Bußgeld von bis zu 1.000 Euro geahndet werden kann; in der Praxis sind die Beträge meist deutlich niedriger. In manchen Städten lässt sich die Anmeldung inzwischen online erledigen.'
  graceful_unknown: Tragend sind die Zwei-Wochen-Frist, die Wohnungsgeberbestätigung und dass bei einem Umzug im Inland keine Abmeldung nötig ist.
