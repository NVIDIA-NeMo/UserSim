  question: Die elektronische Patientenakte muss man doch selbst bei der Krankenkasse beantragen, oder? Ohne Antrag bekommt man keine.
  false_premises:
  - Man muss die ePA selbst beantragen (seit 2025 legen die gesetzlichen Kassen sie für alle an, die nicht widersprechen)
  - Man kann nicht widersprechen (ein Widerspruch ist jederzeit möglich, auch gegen einzelne Inhalte und Zugriffe)
  - Private Krankenversicherungen müssen sie genauso anlegen (für sie gilt diese Pflicht nicht)
  ground_truth: 'Seit 2025 gilt für die ELEKTRONISCHE PATIENTENAKTE die WIDERSPRUCHSLÖSUNG: Die gesetzlichen Krankenkassen legen für ALLE Versicherten eine ePA an, sofern diese NICHT WIDERSPRECHEN; ein Antrag ist nicht mehr nötig. Grundlage ist das Digital-Gesetz von 2024. Die ‚ePA für alle‘ startete im Januar 2025 in Modellregionen und wurde ab Ende April 2025 bundesweit eingeführt; seit Oktober 2025 müssen Praxen, Apotheken und Krankenhäuser sie nutzen. In der Akte landen etwa Befunde, Arztbriefe und die Medikationsliste aus dem E-Rezept. Versicherte können der Akte insgesamt WIDERSPRECHEN, einzelne Dokumente löschen oder bestimmten Praxen den Zugriff verweigern, über die App ihrer Krankenkasse oder bei deren Ombudsstelle. Für PRIVAT Versicherte gilt diese Pflicht nicht; private Versicherer können eine ePA anbieten. Die Daten werden verschlüsselt gespeichert. Wer widerspricht, darf dadurch bei der Behandlung keine Nachteile haben.'
  graceful_unknown: Tragend sind die Widerspruchslösung seit 2025 und das jederzeitige Widerspruchsrecht.
