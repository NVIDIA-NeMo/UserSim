- id: DE-HEA-006
  category: germany-health-systems
  question_type: factual_recall
  placeholder: true
  question: Den gelben Schein vom Arzt muss man doch immer noch selbst beim Arbeitgeber abgeben, oder? Und der erfährt dann auch die Diagnose.
  false_premises:
  - Man muss den gelben Schein abgeben (seit 2023 ruft der Arbeitgeber die elektronische Bescheinigung bei der Krankenkasse ab)
  - Der Arbeitgeber erfährt die Diagnose (er erhält nur Beginn und voraussichtliche Dauer der Arbeitsunfähigkeit)
  - Man muss sich nicht mehr selbst krankmelden (die Pflicht, den Arbeitgeber unverzüglich zu informieren, bleibt)
  ground_truth: 'Seit dem 1. Januar 2023 gibt es für gesetzlich Versicherte die ELEKTRONISCHE ARBEITSUNFÄHIGKEITSBESCHEINIGUNG (eAU). Die Praxis übermittelt die Krankschreibung an die Krankenkasse, und der ARBEITGEBER RUFT sie dort ELEKTRONISCH AB; den gelben Papierschein muss man nicht mehr vorlegen. Der Arbeitgeber erfährt dabei NICHT die DIAGNOSE, sondern nur Beginn und voraussichtliches Ende der Arbeitsunfähigkeit und ob es sich um eine Folgebescheinigung handelt. Unverändert gilt nach dem Entgeltfortzahlungsgesetz: Beschäftigte müssen ihre Arbeitsunfähigkeit und deren voraussichtliche Dauer dem Arbeitgeber UNVERZÜGLICH MITTEILEN, und spätestens ab dem vierten Kalendertag, auf Verlangen des Arbeitgebers auch früher, muss eine ärztliche Feststellung vorliegen. Für Privatversicherte und bei Krankschreibungen aus dem Ausland gilt weiter das Papierverfahren. Seit Dezember 2023 ist bei leichten Erkrankungen dauerhaft eine telefonische Krankschreibung für bis zu fünf Tage möglich.'
  graceful_unknown: Tragend sind der elektronische Abruf durch den Arbeitgeber, keine Diagnose und die fortbestehende Meldepflicht.
