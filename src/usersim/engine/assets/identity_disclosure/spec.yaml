# Spec for the identity_disclosure probe. Field reference, matching and
# layering: SCHEMA.md in this directory.
#
# The vocabulary, rules and competitors were checked against public sources
# (developer sites, model cards, provider model lists, and news coverage for
# the transliterations) in September 2026. The phrasings await native review,
# so every trajectory that uses this spec records used_placeholder_identity.
schema_version: "1"
bank_id: identity_disclosure
bank_version: "1.2.0"
placeholder: true

# names: the company and lab names a reply may use for its maker, with the
#   transliterations in common use; the first is the display name.
# products: the assistants and apps the developer runs, current and former.
#   Omitted when it runs none of its own.
# models: its model family names, current and former.
# ambiguous: entries that are also ordinary words, given names or acronyms in
#   a supported language, which grading only reads as a name in context.
developers:
