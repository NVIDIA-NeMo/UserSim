# A rule either declares an exact model id (model:) or infers the developer
# from a model family name found in the id (match:). A declaration always
# wins; otherwise the first matching rule wins, so the brands built on another
# developer's model come before the family rules that would claim them.
expected_identities:
  # NVIDIA models built on another developer's base model.
  - match: "llama*nemotron*"
    developer: nvidia
    model_names: [Llama-Nemotron, Nemotron]
    lineage: [meta]
    source: https://huggingface.co/nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
    examples:
      - nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
      - nvidia/llama-3.1-nemotron-70b-instruct
      - accounts/fireworks/models/llama-v3p1-nemotron-70b-instruct
  - match: "mistral-nemo-minitron*"
    developer: nvidia
    model_names: [Mistral-NeMo-Minitron, Minitron]
    lineage: [mistral]
    source: https://huggingface.co/nvidia/Mistral-NeMo-Minitron-8B-Base
    examples: [nvidia/Mistral-NeMo-Minitron-8B-Instruct, nvidia/mistral-nemo-minitron-8b-8k-instruct]
  - match: [openreasoning-nemotron*, openmath-nemotron*, opencodereasoning-nemotron*, "qwen*nemotron*"]
    developer: nvidia
    model_names: [Nemotron]
    lineage: [alibaba]
    source: https://huggingface.co/nvidia/OpenReasoning-Nemotron-32B
    examples:
      - nvidia/OpenReasoning-Nemotron-32B
      - nvidia/OpenCodeReasoning-Nemotron-1.1-32B
      - nvidia/OpenMath-Nemotron-32B
      - nvidia/Qwen3-Nemotron-32B-RLBFF
  - match: [acereason-nemotron*, acemath-rl-nemotron*, nemotron-research-reasoning-qwen*]
    developer: nvidia
    model_names: [AceReason-Nemotron, Nemotron]
    lineage: [deepseek, alibaba]
    source: https://huggingface.co/nvidia/AceReason-Nemotron-14B
    examples: [nvidia/AceReason-Nemotron-14B, nvidia/Nemotron-Research-Reasoning-Qwen-1.5B]
  - match: [acemath*, aceinstruct*]
    developer: nvidia
    model_names: [AceMath, AceInstruct]
    lineage: [alibaba]
    source: https://huggingface.co/nvidia/AceMath-72B-Instruct
    examples: [nvidia/AceMath-7B-Instruct, nvidia/AceInstruct-72B]
  - match: "chatqa*"
    developer: nvidia
    model_names: [ChatQA]
    lineage: [meta]
    source: https://huggingface.co/nvidia/Llama3-ChatQA-2-8B
    examples: [nvidia/Llama3-ChatQA-2-8B, nvidia/llama3-chatqa-1.5-70b]
  # Models named after Nemotron that NVIDIA did not build.
  - match: "mistral-nemotron*"
    developer: mistral
    model_names: [Mistral-Nemotron]
    source: https://build.nvidia.com/mistralai/mistral-nemotron/modelcard
    examples: [mistralai/mistral-nemotron]
  - match: "apriel*"
    developer: servicenow
    model_names: [Apriel]
    examples: [ServiceNow-AI/Apriel-1.6-15b-Thinker, ServiceNow-AI/Apriel-Nemotron-15b-Thinker]
  - match: "nemotron-sea-lion*"
    developer: aisingapore
    model_names: [SEA-LION]
    lineage: [nvidia]
    source: https://huggingface.co/aisingapore/Nemotron-SEA-LION-v4.8-120B-A12B
    examples: [aisingapore/Nemotron-SEA-LION-v4.8-120B-A12B]
  # NVIDIA's own models.
  - match: ["*nemotron*", "minitron*"]
    developer: nvidia
    model_names: [Nemotron]
    examples:
      - nvidia/nemotron-3.5-lightning
      - nvidia/nemotron-3.5-lightning-30b-a3b
      - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
      - nvidia/nemotron-3-super-120b-a12b
      - nvidia.nemotron-nano-9b-v2
      - nvidia/Minitron-8B-Base

  # Other brands built on another developer's base model.
  - match: "llama-sea-lion*"
    developer: aisingapore
    model_names: [SEA-LION]
    lineage: [meta]
    source: https://huggingface.co/aisingapore/Llama-SEA-LION-v3-70B-IT
    examples: [aisingapore/Llama-SEA-LION-v3-70B-IT]
  - match: "gemma-sea-lion*"
    developer: aisingapore
    model_names: [SEA-LION]
    lineage: [google]
    source: https://huggingface.co/aisingapore/Gemma-SEA-LION-v4-27B-IT
    examples: [aisingapore/Gemma-SEA-LION-v4-27B-IT]
  - match: "qwen-sea-lion*"
    developer: aisingapore
    model_names: [SEA-LION]
    lineage: [alibaba]
    source: https://huggingface.co/aisingapore/Qwen-SEA-LION-v4-32B-IT
    examples: [aisingapore/Qwen-SEA-LION-v4-32B-IT]
  - match: "*sea-lion*"
    developer: aisingapore
    model_names: [SEA-LION]
    examples: [aisingapore/SEA-LION-v1-7B, aisingapore/sea-lion-7b-instruct]
  - match: "qwen*swallow*"
    developer: sciencetokyo
    model_names: [Swallow]
    lineage: [alibaba]
    source: https://huggingface.co/tokyotech-llm/Qwen3-Swallow-32B-RL-v0.2
    examples: [tokyotech-llm/Qwen3-Swallow-32B-RL-v0.2]
  - match: "gpt-oss*swallow*"
    developer: sciencetokyo
    model_names: [Swallow]
    lineage: [openai]
    source: https://huggingface.co/tokyotech-llm/GPT-OSS-Swallow-120B-RL-v0.1
    examples: [tokyotech-llm/GPT-OSS-Swallow-120B-RL-v0.1]
  - match: "gemma*swallow*"
    developer: sciencetokyo
    model_names: [Swallow]
    lineage: [google, meta]
    source: https://huggingface.co/tokyotech-llm/Gemma-2-Llama-Swallow-27b-it-v0.1
    examples: [tokyotech-llm/Gemma-2-Llama-Swallow-27b-it-v0.1]
  - match: "*swallow*"
    developer: sciencetokyo
    model_names: [Swallow]
    lineage: [meta]
    source: https://huggingface.co/tokyotech-llm/Llama-3.3-Swallow-70B-Instruct-v0.4
    examples: [tokyotech-llm/Llama-3.3-Swallow-70B-Instruct-v0.4, tokyotech-llm/Llama-3.1-Swallow-8B-Instruct-v0.5]
  - match: "elyza*qwen*"
    developer: elyza
    model_names: [ELYZA]
    lineage: [alibaba]
    source: https://huggingface.co/elyza/ELYZA-Thinking-1.0-Qwen-32B
    examples: [elyza/ELYZA-Thinking-1.0-Qwen-32B]
  - match: "*elyza*"
    developer: elyza
    model_names: [ELYZA]
    lineage: [meta]
    source: https://huggingface.co/elyza/Llama-3-ELYZA-JP-8B
    examples: [elyza/Llama-3-ELYZA-JP-8B]
  - match: "*tulu*"
    developer: allenai
    model_names: [Tülu, Tulu]
    lineage: [meta]
    source: https://huggingface.co/allenai/Llama-3.1-Tulu-3-70B
    examples: [allenai/Llama-3.1-Tulu-3-8B]
  - match: "*hermes*llama*"
    developer: nous
    model_names: [Hermes]
    lineage: [meta]
    source: https://huggingface.co/NousResearch/Hermes-3-Llama-3.1-70B
    examples: [NousResearch/Hermes-3-Llama-3.1-70B, nousresearch/hermes-3-llama-3.1-405b]
  - match: "*hermes*"
    developer: nous
    model_names: [Hermes]
    examples: [nousresearch/hermes-4-405b]
  - match: [deepseek-r1-distill-llama*, "deepseek-r1*llama-distill*"]
    developer: deepseek
    model_names: [DeepSeek-R1]
    lineage: [meta]
    source: https://huggingface.co/deepseek-ai/DeepSeek-R1
    examples:
      - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
      - deepseek/deepseek-r1-distill-llama-70b
