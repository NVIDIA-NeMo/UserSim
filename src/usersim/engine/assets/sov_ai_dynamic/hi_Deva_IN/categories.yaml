- id: india-geography
  invitation: आप अपनी आवाज़ में भारत के भूगोल से जुड़ा कुछ पूछना चाहते हैं। अपने राज्य, गाँव, गृहनगर या किसी जगह से जुड़ा वास्तविक सवाल लाइए।
  subtopic_hints:
  - केंद्र-राज्य अधिकार में अंतर — नदियाँ, वन, तटीय क्षेत्र (CRZ) और संरक्षित क्षेत्र
  - मानसून का समय और फसल चक्र (खरीफ बनाम रबी) में क्षेत्रीय अंतर
  - उत्तर-पूर्व भारत और इनर लाइन परमिट (ILP) से जुड़ा भ्रम
  - पर्वत-मैदान-रेगिस्तान का जीवन-शैली पर असर (हिमालय, पश्चिमी घाट, थार)
  - 2019 के बाद जम्मू-कश्मीर और लद्दाख के राज्य/केंद्र शासित प्रदेश के दर्जे में बदलाव
  - प्रशासनिक शब्दों का घालमेल (तालुक/तहसील/ब्लॉक/मंडल, पिन कोड बनाम जिला)
  - उत्तराखंड भूस्खलन, केरल बाढ़ या चक्रवात बिपरजॉय जैसी आपदाएँ और उनसे क्षेत्रीय बदलाव
  - जब सर्वे ऑफ इंडिया का नक्शा और गूगल मैप्स राज्य की सीमा पर अलग दिखाएँ तो क्या करें
- id: india-history
  invitation: आप अपनी आवाज़ में भारत के इतिहास से जुड़ा कुछ पूछना चाहते हैं। पारिवारिक कहानी, क्षेत्रीय परंपरा या किसी जगह की कहानी से जोड़कर पूछिए।
  subtopic_hints:
  - स्वतंत्रता संग्राम के वे नायक जिनकी भूमिका पाठ्यपुस्तकों में कम आती है (भगत सिंह से आगे)
  - बँटवारे का अनुभव — अपने राज्य या समुदाय की दृष्टि से
  - क्षेत्रीय राजवंश (विजयनगर, मराठा, अहोम, त्रावणकोर) जो स्कूल किताबों में कम दिखते हैं
  - 1857 की घटनाएँ — दिल्ली/लखनऊ/कानपुर के अलावा अन्य स्थानों पर
  - आर्थिक इतिहास के मोड़ — हरित क्रांति, लाइसेंस राज, 1991 का उदारीकरण
  - सिंधु घाटी सभ्यता के स्थल — भारत और पाकिस्तान दोनों ओर
  - दलित, आदिवासी, क्वीयर समुदायों का इतिहास और मुख्यधारा से उनका रिश्ता
  - जब परिवार की मौखिक स्मृति और औपनिवेशिक/राज्य अभिलेख अलग कहानी बताएँ तो क्या करें
- id: india-culture
  invitation: आप अपनी आवाज़ में भारतीय संस्कृति से जुड़ा कुछ पूछना चाहते हैं। अपने समुदाय, क्षेत्र या परिवार की किसी प्रथा से जुड़ा वास्तविक सवाल लाइए।
  subtopic_hints:
  - क्षेत्रीय व्यंजन (बंगाली मिठाई, कश्मीरी वज़वान, हैदराबादी बिरयानी, गोवा का विंदालू)
  - त्योहारों में अंतर (केरल का ओणम, तमिलनाडु का पोंगल, असम का बिहू, बिहार का छठ)
  - भाषा-राजनीति और हिंदी बनाम क्षेत्रीय भाषा का प्रश्न आपके राज्य में
  - पहनावा (साड़ी पहनने का तरीका, धोती, मुंडू) — समुदाय और अवसर के अनुसार
  - विवाह की रीतियाँ जो क्षेत्र या समुदाय के अनुसार बदलती हैं
  - समन्वयवादी पूजा-स्थल (सूफ़ी दरगाहें, मिश्रित परंपरा वाले गाँव-देवस्थल)
  - संयुक्त परिवार, अरेंज मैरिज, "आधुनिकता" पर पीढ़ी का तनाव
  - OBC, EWS, SC/ST जैसी श्रेणियों का व्यवहारिक अर्थ और राज्यवार सूचियों में अंतर
- id: india-poetry-and-music
  invitation: आप अपनी आवाज़ में भारतीय कविता, संगीत या गीतों से जुड़ा कुछ पूछना चाहते हैं। फ़िल्मी गाना, भजन, ग़ज़ल या आधा याद आता हुआ छंद लाइए।
  subtopic_hints:
  - रवींद्रनाथ टैगोर की गीतांजलि — बांग्ला मूल और अंग्रेज़ी अनुवाद का अंतर
  - हिंदुस्तानी और कर्नाटक शास्त्रीय संगीत — घराना, सम्प्रदाय, मूलभूत अंतर
  - सूफ़ी कविता परंपरा (बुल्ले शाह, अमीर खुसरो, कबीर के दोहे)
  - फ़िल्मी संगीत के स्वर्ण काल (आर.डी. बर्मन, इलैयाराजा, ए.आर. रहमान, नौशाद)
  - गीत "वंदे मातरम" का पूरा पाठ और आज कौन से अंश गाए जाते हैं
  - प्रार्थनाएँ और स्कूल असेंबली के गीतों के क्षेत्रीय रूप
  - मातृभाषा के कवि (तुलसीदास, कबीर, मीराबाई, सुभद्रा कुमारी चौहान, ग़ालिब, इक़बाल)
  - बचपन में याद किया गया कोई पंक्ति जब इंटरनेट पर अलग दिखे तो क्या करें
- id: india-public-services
  invitation: आप अपनी आवाज़ में किसी भारतीय सार्वजनिक सेवा के बारे में पूछना चाहते हैं। ऐसी असली स्थिति लाइए जहाँ नियम, पोर्टल और कर्मचारी का जवाब अलग-अलग हो।
  subtopic_hints:
  - आधार — नामांकन, अद्यतन (अपडेट), बायोमेट्रिक अस्वीकृति, मोबाइल नंबर लिंकिंग
  - मतदाता पहचान-पत्र और चुनाव से पहले मतदाता सूची में जुड़ाव
  - PDS राशन कार्ड — APL/BPL/अंत्योदय भेद और प्रवासन (पोर्टेबिलिटी)
  - आयुष्मान भारत (PMJAY) — पात्रता, ई-कार्ड, एम्पैनल्ड हॉस्पिटल खोज
  - LPG सब्सिडी (उज्ज्वला), DBT में बैंक अकाउंट गलत होने पर समाधान
  - DigiLocker — कौन सी एजेंसियाँ इसे प्रामाणिक मानती हैं
  - जिला स्तर शिकायत निवारण (CPGRAMS, राज्य पोर्टल)
  - केंद्र की योजना और राज्य की योजना के नियम टकराएँ तो क्या करें
- id: india-health-systems
  invitation: आप अपनी आवाज़ में भारत की स्वास्थ्य व्यवस्था से जुड़ा कुछ पूछना चाहते हैं। सरकारी अस्पताल, निजी अस्पताल, बीमा, जेनेरिक दवा — असली समस्या लाइए।
  subtopic_hints:
  - PMJAY/आयुष्मान भारत कवरेज सीमा और एम्पैनल्ड हॉस्पिटल सूची कैसे काम करती है
  - AIIMS, सरकारी मेडिकल कॉलेज अस्पताल, और PHC/CHC में अंतर
  - जेनेरिक बनाम ब्रांडेड दवा और जन औषधि योजना
  - निजी स्वास्थ्य बीमा क्लेम विवाद और IRDAI लोकपाल प्रक्रिया
  - ग्रामीण और शहरी पहुँच में अंतर (जिला अस्पताल बनाम महानगर का सुपर-स्पेशियलिटी)
  - CDSCO से दवा रिकॉल नोटिस और अपनी पर्ची कैसे मिलाएँ
  - मानसिक स्वास्थ्य — NIMHANS, जिला मनोरोग केंद्र, हेल्पलाइन (KIRAN, iCall)
  - निजी अस्पताल का बिल और बीमा कंपनी की प्री-ऑथराइज़ेशन में अंतर हो तो क्या करें
- id: india-education
  invitation: आप अपनी आवाज़ में भारतीय शिक्षा के बारे में पूछना चाहते हैं। बोर्ड परीक्षा, कॉलेज प्रवेश, छात्रवृत्ति, RTE — अपनी असली स्थिति लाइए।
  subtopic_hints:
  - CBSE बनाम राज्य बोर्ड (महाराष्ट्र, तमिलनाडु, पश्चिम बंगाल) — पाठ्यक्रम और कठिनाई
  - JEE / NEET / CUET / राज्य CET — कौन कब मायने रखता है
  - NEP 2020 के बदलाव (4-वर्षीय UG, बहु-विषयक, बाहर निकलने के विकल्प)
  - आरक्षण श्रेणियाँ और कट-ऑफ का राज्यवार अंतर
  - RTE अधिनियम के तहत निजी स्कूलों में सीटें और लॉटरी प्रक्रिया
  - कोचिंग पारिस्थितिकी (कोटा, हैदराबाद, चेन्नई) और इसकी लागत
  - विदेश में पढ़ाई — भारतीय डिग्रियों का US/UK/AU/CA में मूल्यांकन
  - स्कूल का स्थानांतरण-प्रमाणपत्र (TC) और नए स्कूल की माँग में अंतर हो तो क्या करें
- id: india-labor-and-benefits
  invitation: आप अपनी आवाज़ में भारत में काम, नौकरी या श्रम-लाभों के बारे में पूछना चाहते हैं। औपचारिक या अनौपचारिक क्षेत्र की असली स्थिति लाइए।
  subtopic_hints:
  - EPF (भविष्य निधि) बनाम EPS (कर्मचारी पेंशन योजना) — कब क्या वापस मिलता है
  - ESIC (कर्मचारी राज्य बीमा) पात्रता सीमा और लाभ
  - ग्रेच्युटी की गणना और 5-वर्ष के नियम (भुगतान-ग्रेच्युटी अधिनियम)
  - चार श्रम संहिताएँ — किस राज्य में अधिसूचित, किस में लंबित
  - MGNREGA रोज़गार-दिवस अधिकार और जॉबकार्ड प्रक्रिया
  - गिग/प्लेटफ़ॉर्म कर्मी (स्विगी, ज़ोमैटो, ऊबर) और सामाजिक सुरक्षा संहिता
  - मातृत्व अवकाश (मातृत्व लाभ अधिनियम बनाम निजी क्षेत्र की प्रथा) और पितृत्व नीति
  - ऑफ़र लेटर, अपॉइंटमेंट लेटर और HR पोर्टल में अंतर हो तो क्या करें
- id: india-finance-and-consumer
  invitation: आप अपनी आवाज़ में भारत में पैसे, बैंकिंग, टैक्स या उपभोक्ता विवाद के बारे में पूछना चाहते हैं। असली स्थिति लाइए।
  subtopic_hints:
  - ITR दाखिल करने की अंतिम तिथियाँ और ITR-1, ITR-2, ITR-3 में अंतर
  - GST पंजीकरण थ्रेशहोल्ड और छोटे कारोबारियों के लिए इन्वर्टेड-ड्यूटी रिफंड
  - PMJDY खाता, RuPay डेबिट कार्ड, UPI लाइट और शून्य-शेष नियम
  - म्यूचुअल फंड SIP बनाम एकमुश्त निवेश और STP तुलना
  - PPF बनाम EPF बनाम NPS — कौन कब बेहतर है
  - क्रेडिट स्कोर (CIBIL, Experian, Equifax, CRIF High Mark) और विवाद प्रक्रिया
  - उपभोक्ता न्यायालय (जिला/राज्य/राष्ट्रीय) और ऑनलाइन पोर्टल e-Daakhil
  - बैंक, RBI और व्यापारी सब अलग जवाब दें UPI विफलता पर तो क्या करें
- id: india-digital-services
  invitation: आप अपनी आवाज़ में भारत में डिजिटल सेवाओं या ऑनलाइन खातों के बारे में पूछना चाहते हैं। UPI, आधार-लिंक्ड सेवा, OTP — असली समस्या लाइए।
  subtopic_hints:
  - UPI विफलता — चार्जबैक समय और कौन सा ऐप विवाद संभालता है (PhonePe, GPay, Paytm)
  - आधार-लिंक्ड OTP नहीं आना और बायोमेट्रिक बनाम OTP प्रमाणीकरण
  - SIM-स्वैप धोखाधड़ी के संकेत और TRAI के नए मोबाइल पोर्टेबिलिटी नियम
  - DigiLocker बनाम mParivahan — DL और RC के लिए
  - DPDP अधिनियम 2023 — सहमति वापसी (consent withdrawal) व्यवहार में
  - भारत में आम ऑनलाइन ठगी (KYC अपडेट ठगी, बिजली बिल ठगी, पार्सल ठगी)
  - खाता रिकवरी जब आधार-लिंक्ड फ़ोन नंबर अब आपके पास नहीं हो
  - कोई सरकारी पोर्टल डेस्कटॉप पर तो काम करे लेकिन मोबाइल पर अटक जाए — क्या करें
