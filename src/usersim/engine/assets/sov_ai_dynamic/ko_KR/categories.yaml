categories:
- id: korea-geography
  invitation: 한국의 지리에 관해 자신의 말로 무언가 묻고 싶은 것을 이야기해 주세요. 사는 지역, 자주 다니는 길, 가족 고향, 최근 다녀온 곳 등 일상에 가까운 주제면 좋습니다.
  subtopic_hints:
  - 중앙정부, 광역지자체, 기초지자체 사이의 관할 차이(국립공원, 하천, 해안)
  - 서울특별시, 광역시, 특별자치시(세종), 도, 특별자치도의 차이
  - 수도권, 호남, 영남, 충청, 강원의 행정 구분과 통계청 분류
  - 비무장지대(DMZ)와 접경 지역, 출입 제한
  - 제주, 울릉, 독도, 가거도, 백령 같은 섬과 본토의 관계
  - 헷갈리기 쉬운 행정 용어(시·군·구, 동·읍·면, 자치구·자치시)
  - 산사태, 폭우, 태풍 등 최근 재난이 지역 지형에 미친 영향
  - 국토지리정보원의 지도와 네이버지도가 행정 경계에서 다를 때 어떻게 해야 할지
- id: korea-history
  invitation: 한국의 역사에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 가족사, 지역의 사적, 학교에서 배운 내용 가운데 잘 풀리지 않는 부분 등.
  subtopic_hints:
  - 교과서에 적게 다뤄지는 지역사(전라, 경상, 강원, 제주의 근현대사)
  - 일제강점기 경험 — 강제동원, 위안부, 친일·항일의 가족 기록
  - 한국전쟁의 지역별 양상과 피난·이산 경험
  - 4·19, 5·18, 6월 항쟁, 촛불혁명 등 민주화 운동의 흐름
  - 조선의 지방 사림과 현재의 행정구역 정합 관계
  - 경제사 전환점 — 새마을운동, 1997 IMF 외환위기, 2008 금융위기
  - 재일동포·중국 동포·고려인의 역사와 현재 위치
  - 가족사와 국가기록원·지방의 자료가 다를 때 어떻게 해야 할지
- id: korea-culture
  invitation: 한국 문화에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 지역 풍습, 가족 관습, 세대 차이, 외부 영향 등 실제로 본 것 중심으로.
  subtopic_hints:
  - 지역별 음식 문화(전라 한정식, 경상도 매운맛, 충청 슴슴함, 제주 향토식)
  - 사투리와 표준어, 신조어, 인터넷 언어
  - 명절(설, 추석)의 지역·세대 차이와 차례·제사 풍습
  - 결혼·장례·돌·환갑·고희 등 통과의례의 변화
  - 종교 풍경(개신교, 천주교, 불교, 무속)과 지역 분포
  - 한류·K-pop·K-드라마·웹툰의 한국 내 위치 vs 해외에서의 위치
  - 다문화 가정, 외국인 노동자 커뮤니티의 영향(중국, 베트남, 우즈베크 등)
  - 세대 간 "한국 문화"의 의미가 어떻게 달라지는지
- id: korea-poetry-and-music
  invitation: 한국의 시·노래·노랫말에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 어릴 적 부른 노래, 반쯤 기억나는 시, 좋아하는 노래 가사 등.
  subtopic_hints:
  - 김소월, 윤동주, 한용운, 김수영, 신경림 같은 시인과 그들의 대표작
  - 한국 가곡의 전통(가고파, 보리밭, 그리운 금강산)과 작곡가들
  - 트로트의 흐름(이미자, 나훈아, 임영웅) 그리고 가창 대회 영향
  - K-pop 세대론(서태지와 아이들 → H.O.T. → 동방신기 → 빅뱅·소시 → BTS·블랙핑크)
  - 민요·판소리·아리랑의 지역별 변형(밀양 아리랑, 진도 아리랑, 정선 아리랑)
  - 애국가의 가사·작곡 논란과 1·4절의 모든 절을 부르는 자리
  - 학교 교가, 군가, 노동가 등 공동체 노래의 위치
  - 어릴 때 외운 가사가 인터넷의 표기와 다를 때 어떻게 해야 할지
- id: korea-public-services
  invitation: 한국 공공서비스에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 규정, 홈페이지, 담당자 안내가 서로 다른 실제 상황을 들어 주세요.
  subtopic_hints:
  - 정부24와 민원24의 통합 이후 변경 사항, 발급 가능한 서류 목록
  - 주민등록등본, 가족관계증명서, 인감 증명에서 등록된 인감으로의 변경
  - 국민연금·공무원연금·사학연금의 차이와 가입 변경 처리
  - 국민건강보험과 직장가입자·지역가입자 전환
  - 기초생활보장(생계, 의료, 주거, 교육)의 수급 자격과 차상위 계층
  - 고용보험 실업급여(구직급여) 신청과 수급 조건
  - 장기요양보험 등급 판정과 재가·시설 급여 차이
  - 중앙부처 지침과 지자체 조례가 충돌할 때의 우선순위
- id: korea-health-systems
  invitation: 한국의 의료에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 건강보험, 의원·병원·종합병원, 약국, 비급여 등 구체적인 상황으로.
  subtopic_hints:
  - 건강보험 가입 형태(직장/지역/피부양자)와 본인부담금 차이
  - 의원·병원·종합병원·상급종합병원 단계와 진료 의뢰서 제도
  - 비급여 진료와 실손보험(실비) 보장 범위, 청구 절차
  - 제네릭(복제약)과 오리지널 약품, 처방전 변경 가능성
  - 정신건강의학과 진료, 정신건강복지센터, 자살예방상담전화 1393
  - 응급실 이용 — 119, 닥터헬기, 권역응급의료센터
  - 임산부·영유아 의료비 지원과 지역별 추가 지원
  - 병원 청구서와 보험사 지급내역이 일치하지 않을 때 어떻게 해야 할지
- id: korea-education
  invitation: 한국의 교육에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 수능, 입시, 학자금, 학교 선택 등 실제 결정 상황으로.
  subtopic_hints:
  - 수능과 학생부 종합전형(학종)·학생부 교과·논술의 차이
  - 자사고·외고·국제고·일반고·특목고의 위치와 정책 변화
  - 정시 vs 수시 — 비율 변화와 대학별 모집 단위 차이
  - 직업계 고등학교(특성화고, 마이스터고)의 진로
  - 한국장학재단의 학자금 대출, 국가장학금 등급
  - 대학 평준화·서열·인서울 담론과 지방국립대(거점국립대)
  - 해외 유학 — 한국 졸업장의 미국·영국·호주·캐나다 학력 인정
  - 학교 안내와 시도교육청·교육부의 지침이 다를 때 어떻게 해야 할지
- id: korea-labor-and-benefits
  invitation: 한국의 일·근로·사회보장에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 정규직·계약직·프리랜서·플랫폼 노동 등 실제 상황으로.
  subtopic_hints:
  - 정규직·계약직·파견·도급·프리랜서 — 4대 보험과 퇴직금 차이
  - 근로기준법의 연차·주휴수당·연장근로 한도
  - 포괄임금제와 실제 시간외수당 분쟁
  - 출산휴가·육아휴직·배우자 출산휴가 급여 산정
  - 산재보험 적용 범위와 출퇴근 재해 인정
  - 플랫폼 노동(배달·대리·라이더)에 대한 사회보험 적용
  - 퇴직 시 절차 — 이직확인서, 원천징수영수증, 건강보험 전환
  - 근로계약서와 취업규칙·인사규정이 다를 때 어떻게 해야 할지
- id: korea-finance-and-consumer
  invitation: 한국의 돈·은행·세금·소비자 분쟁에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 실제 상황으로.
  subtopic_hints:
  - 종합소득세 신고 일정과 근로소득자도 해야 하는 경우
  - 연말정산 — 부양가족 공제, 의료비·교육비 공제, 월세 세액공제
  - ISA·연금저축·IRP — 세제 혜택과 활용
  - 신용점수(NICE, KCB)와 신용회복위원회·법원의 개인회생·파산
  - 카드사 분쟁 — 부정사용, 할부 항변권, 청약 철회
  - 보이스피싱·스미싱·메신저피싱 등 한국에서 흔한 사기 패턴
  - 한국소비자원·금융감독원의 분쟁 조정과 소액 소송
  - 은행 앱·통장·홈택스 통지서의 숫자가 안 맞을 때 어떻게 해야 할지
- id: korea-digital-services
  invitation: 한국의 디지털 서비스·온라인 계정에 관해 자신의 말로 묻고 싶은 것을 이야기해 주세요. 공동인증서, 본인인증, 사기 등 실제 상황으로.
  subtopic_hints:
  - 공동인증서(구 공인인증서)·금융인증서·간편인증의 차이와 인증 갱신
  - 휴대폰 본인확인과 알뜰폰 사용자가 겪는 인증 문제
  - 정부24·홈택스·국민건강보험공단 등 공공포털 로그인 오류 처리
  - SIM 스왑·계정 탈취 등 사기 패턴과 통신사 신고 절차
  - 메신저(카카오톡)·SNS 스미싱과 가족 사칭 사기
  - 개인정보 보호법(2023 개정)에 따른 열람·삭제·이전 요구권
  - 중고거래(번개장터, 당근, 중고나라) 분쟁과 안전결제
  - 공공 서비스가 PC에서는 되는데 모바일에서는 막힐 때 어떻게 해야 할지
