- id: KR-CUL-001
  category: korea-culture
  question_type: factual_recall
  placeholder: true
  question: 김장 문화는 유네스코 세계유산에 등재된 건축물 같은 거죠? 그리고 김치는 원래부터 고춧가루가 들어간 형태였나요?
  false_premises:
  - 김장 문화가 건축물 같은 세계유산이다(유네스코 인류무형문화유산)
  - 김치가 원래부터 고춧가루 중심이었다(고추는 임진왜란 전후 이후 한반도에 전래되어 점차 보급)
  ground_truth: 김장 문화는 2013년 유네스코 인류무형문화유산 대표목록에 등재된 공동체적 음식문화입니다. 건축물이나 유적을 뜻하는 세계유산과는 다른 제도입니다. 또한 오늘날 대표적인 배추김치처럼 고춧가루를 많이 쓰는 형태는 고추가 한반도에 전래된 뒤 발전했습니다. 고추 전래 이전에도 채소를 소금 등에 절여 저장하는 김치류는 있었지만, 현재의 붉은 양념 김치와는 형태가 달랐습니다.
