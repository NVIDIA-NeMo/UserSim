- id: KOREA-FINA-B002
  category: korea-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 종합소득세는 1년에 한 번 12월에 신고하는 거고, 모든 회사원이 직접 신고해야 하는 거 맞죠? 세율도 모든 소득에 일률 30% 단일세율이라고 들었어요.
  false_premises:
  - '"12월 신고" (종합소득세 신고는 **다음해 5월 1일~5월 31일** ── 6월 말까지 성실신고확인서 제출 대상자(연소득 일정 기준 이상 사업자)는 6월 30일까지. "12월 신고"는 잘못 ── 12월은 한 해의 소득이 끝나기 전이므로 신고 자체가 불가능)'
  - '"모든 회사원 직접 신고" (회사원(근로소득자)은 **연말정산** 으로 처리되며 종합소득세 신고 불요 ── 회사가 매년 1월~2월 연말정산을 통해 1년 동안의 근로소득세 정산. **종합소득세 신고가 필요한 경우** = (a) 근로소득 외에 사업소득·이자소득·배당소득·기타소득(연 300만원 초과) 등 ; (b) 2개 이상 사업장 근로소득 ; (c) 연말정산 누락분 등이 있는 경우)'
  - '"30% 단일세율" (종합소득세는 **8단계 누진세율** ── 1,400만원 이하 6%, 5,000만원 이하 15%, 8,800만원 이하 24%, 1.5억원 이하 35%, 3억원 이하 38%, 5억원 이하 40%, 10억원 이하 42%, 10억원 초과 **45%** (2024년 기준). 단일세율 30%는 사실과 다름. 또한 **지방소득세** 가 종합소득세의 10% 부과되어 실효세율은 더 높음)'
  ground_truth: '한국의 **종합소득세(綜合所得稅)** 제도. **법적 근거**: **「소득세법」**. **소관**: **국세청 (nts.go.kr)**, **홈택스 (hometax.go.kr)**. **종합소득세 대상**: 1년 동안의 (1) **이자소득** + (2) **배당소득** + (3) **사업소득** + (4) **근로소득** + (5) **연금소득** + (6) **기타소득** 을 합산하여 누진세율을 적용. **세율(2024년 기준, 8단계 누진)**: (a) 1,400만원 이하 = **6%** ; (b) 5,000만원 이하 = **15%** ; (c) 8,800만원 이하 = **24%** ; (d) 1억 5천만원 이하 = **35%** ; (e) 3억원 이하 = **38%** ; (f) 5억원 이하 = **40%** ; (g) 10억원 이하 = **42%** ; (h) 10억원 초과 = **45%** ── 별도로 **지방소득세 10%** 가 종합소득세에 부가(예: 종소세율 24% → 지방소득세 2.4% → 합계 26.4%). **신고 기간**: **다음해 5월 1일 ~ 5월 31일** ── 성실신고확인 대상자(매출 기준)는 **6월 30일까지** 가능. **신고 의무자**: (1) **종합소득** 이 있는 자 일반 ; (2) 다만 **근로소득자** = 근로소득만 있고 다른 종합소득(이자·배당 2천만원 초과, 사업·기타 등) 없으면 **연말정산** 으로 종결 ── 종합소득세 신고 불요. **신고 방법**: (1) **홈택스(hometax.go.kr)** 전자신고 ; (2) **모바일 손택스 앱** ; (3) 세무서 직접 신고 ; (4) 세무사 위탁 ; **국세청 모두채움 자동신고** = 영세 사업자 일부 자동 안내. **연말정산** = **근로소득자** 의 1년 소득세 정산을 **다음해 1월~2월** 에 회사가 처리 ; 추가 환급·납부분은 2월~3월 급여에서. **공식 출처**: **국세청 (nts.go.kr), 홈택스 (hometax.go.kr)**.'
  graceful_unknown: 종합소득세는 1년 소득(이자·배당·사업·근로·연금·기타 6종)을 합산하여 다음해 5월 1일~5월 31일에 신고. 8단계 누진세율 6~45% (지방소득세 10% 별도). 회사원은 회사가 1~2월 연말정산으로 처리하고 추가 종합소득세 신고는 사업·기타 소득이 있는 경우에만. 신고는 홈택스(hometax.go.kr) 전자신고가 표준. 정확한 정보는 nts.go.kr.
