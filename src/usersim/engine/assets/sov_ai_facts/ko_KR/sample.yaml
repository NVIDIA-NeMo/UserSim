- id: KOREA-HEAL-B001
  category: korea-health-systems
  question_type: factual_recall
  placeholder: true
  question: 한국에서 건강보험은 가입이 자유 선택이고, 가입자만 병원에서 치료받을 수 있죠? 보험료도 모든 사람이 같은 금액을 내고요?
  false_premises:
  - '"가입이 자유 선택" (대한민국 **건강보험**은 **국민건강보험법** 에 따라 **전 국민 강제 가입(국민개보험)** ── 1989년 7월 도시지역 의료보험 적용으로 전국민 의료보험 시대 개막. **모든 국민과 일정 기간 거주 외국인** 도 의무 가입. 미가입 선택권 없음)'
  - '"보험료 모든 사람이 같은 금액" (건강보험료는 **소득·재산 등에 따라 차등 부과** ── (a) **직장가입자** = 보수월액 × 약 7.09%(2024년 기준, 노사 절반씩 부담, 본인 부담 약 3.545%) ; (b) **지역가입자** = 소득 + 재산(부동산 등)에 부과 점수로 산정 ; (c) **임의계속가입자** ; **장기요양보험료** 도 별도 부과(건강보험료의 약 12.95%, 2024). "모든 사람 같은 금액"은 사실과 정반대)'
  ground_truth: '대한민국 **건강보험제도** ── **국민건강보험법(1999년 통합)** 에 근거 ; **국민개보험(전 국민 의무 가입)** 은 **1989년 7월** 부터 시작. **운영 주체**: **국민건강보험공단(NHIS, nhis.or.kr)** ── 단일 공보험자 ; **건강보험심사평가원(HIRA, hira.or.kr)** ── 의료비 심사·평가. **소관**: **보건복지부 (mohw.go.kr)**. **가입자 구분**: (1) **직장가입자** ── 1인 이상 사업장 종사자, **보수월액의 약 7.09%(2024)** ── 사업주와 근로자 절반씩(본인 약 3.545%) 부담 ; **장기요양보험료**는 건강보험료의 약 12.95%(2024) 추가. (2) **지역가입자** ── 직장가입자 외 모든 가입자 ── **소득·재산·자동차** 등을 점수화하여 부과(2018년 7월 부과체계 1단계 개편, 2022년 9월 2단계 개편으로 자동차 부과는 점차 축소). (3) **피부양자** ── 직장가입자에 의해 부양받는 가족(소득·재산 등 일정 기준 충족). **보장 내용**: 외래·입원·약제·치과·한방·예방접종 일부 등 광범위 ; **본인부담률** ── 외래 종합병원 60%, 병원 50%, 의원 30% ; 입원 20%(중증환자는 5%) ; 약국 30% ; **본인부담상한제** ── 연간 본인부담금이 소득별 상한액 초과 시 환급. **외국인**: **6개월 이상 합법 거주** 외국인은 의무 가입(직장 또는 지역). **의료급여**: 차상위·기초생활보장 수급자는 **의료급여 1·2종** ── 의료비 거의 무상(국가가 대신 지급). **공식 출처**: **mohw.go.kr**, **nhis.or.kr**, **hira.or.kr**.'
  graceful_unknown: 한국 건강보험은 1989년부터 전 국민 의무 가입(국민개보험), 미가입 선택 불가. 직장가입자(보수의 7.09%, 노사 절반씩)·지역가입자(소득·재산 점수 산정)·피부양자로 구분. 외래·입원·약제 등 광범위 보장, 본인부담률 30~60%(병원 종류별), 본인부담상한제 적용. 운영은 국민건강보험공단(nhis.or.kr), 심사는 건강보험심사평가원(hira.or.kr), 소관은 보건복지부(mohw.go.kr).
