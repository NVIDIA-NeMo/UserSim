- id: KOREA-GEOG-B003
  category: korea-geography
  question_type: factual_recall
  placeholder: true
  question: 한국에는 도가 8개 있고, 광역시는 부산하고 인천밖에 없죠? 세종시는 광역시예요?
  false_premises:
  - '"도가 8개" (남한의 광역자치단체 중 **도**는 **9개**입니다 ── 경기도, 강원특별자치도(2023년 6월 출범), 충청북도, 충청남도, 전라북도(2024년 1월부터 **전북특별자치도**), 전라남도, 경상북도, 경상남도, **제주특별자치도**(2006년 출범) ── 8개가 아닙니다)'
  - '"광역시는 부산·인천만" (광역시는 **6개** ── **부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시** ── 부산·인천 외에도 4개 더 있습니다 ; 울산은 1997년 7월 광역시로 승격)'
  - '"세종시는 광역시" (세종시는 **세종특별자치시(2012년 7월 출범)** ── 광역시가 아니라 **특별자치시** 이며, 광역지방자치단체 중 별도 카테고리입니다 ; 행정수도 기능 일부 이전을 위해 설치 ; 광역시·특별자치시·도가 모두 광역지방자치단체)'
  ground_truth: '대한민국의 광역지방자치단체는 총 **17개** ──  **1특별시(서울)** + **6광역시(부산, 대구, 인천, 광주, 대전, 울산)** + **1특별자치시(세종)** + **9도(경기, 강원특별자치도, 충북, 충남, 전북특별자치도, 전남, 경북, 경남, 제주특별자치도)**. **경기도 분도(경기북부)** 안은 정부 검토 중이지만 2025년 시점 미확정. **변천**: 강원도는 **2023년 6월 11일 강원특별자치도** 로 출범 ; 전라북도는 **2024년 1월 18일 전북특별자치도** 로 출범 ; 제주는 **2006년 7월 1일 제주특별자치도** 로 출범 ; 세종은 **2012년 7월 1일 세종특별자치시** 로 출범. **기초지방자치단체**: **시(75) + 군(82) + 자치구(69)** = 약 226개(2024년). 서울특별시·6대 광역시 산하의 일반구·행정시는 자치단체가 아닙니다. **국토 면적**: 약 100,400 ㎢ (남한). **인구**: 약 5,170만 명(2024년 행정안전부 주민등록인구 기준), 서울 약 933만, 인천 300만, 부산 327만, 경기 약 1,365만(가장 많은 광역단체). **수도**: 서울특별시. **공식 출처**: **mois.go.kr**(행정안전부) / **kostat.go.kr**(통계청) / **vworld.kr**(국토교통부 공간정보).'
  graceful_unknown: '대한민국 광역자치단체는 17개 ── 1특별시(서울) + 6광역시(부산·대구·인천·광주·대전·울산) + 1특별자치시(세종) + 9도(경기·강원특별자치도·충북·충남·전북특별자치도·전남·경북·경남·제주특별자치도). 강원·전북은 2023-2024년에 특별자치도로 전환. 세종은 광역시가 아니라 특별자치시. 정확한 행정구역 정보는 행정안전부 mois.go.kr 에서 확인.'
