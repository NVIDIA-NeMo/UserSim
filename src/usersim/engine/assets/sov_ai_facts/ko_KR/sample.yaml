- id: KOREA-LABO-B005
  category: korea-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 실업급여(구직급여)는 자발적으로 회사를 그만둬도 자동으로 받을 수 있고, 무직 상태라면 평생 받을 수 있죠? 그리고 신청은 동사무소에서 하나요?
  false_premises:
  - '"자발적 퇴사 시 자동 수령" (실업급여(구직급여)는 **고용보험 가입자** 가 **이직 사유가 비자발적** 인 경우에만 원칙 수급 가능 ── 본인의 자발적 퇴사(권고사직 외)는 **수급 자격 없음** ; 다만 **‘정당한 이직사유’**(임금 체불, 직장 내 괴롭힘, 통근 곤란, 가족 돌봄 등)가 인정되면 자발적 사직도 수급 가능)'
  - '"평생 수령" (구직급여 **소정급여일수** 는 **이직 당시 연령 + 고용보험 가입기간** 으로 결정 ── **120일 ~ 270일(약 4-9개월)** ── 평생이 아님. 구직급여 종료 후 재취업되지 않으면 **국민취업지원제도(고용지원금)** 또는 다른 복지 프로그램으로 안내)'
  - '"동사무소 신청" (실업급여는 **고용센터(고용노동부 산하 고용지원센터, 워크넷 work.go.kr)** 에서 신청 ── 거주지 관할 또는 가까운 고용센터를 방문하거나, **고용보험 홈페이지(ei.go.kr)** 에서 온라인으로 ; 동사무소(주민센터)는 주민등록·복지 등을 담당하고 실업급여 신청을 받지 않음)'
  ground_truth: '한국의 **실업급여(구직급여)** 제도 ── **「고용보험법」** 에 근거. **소관**: **고용노동부 (moel.go.kr)** ; **운영**: **고용센터(전국 약 100여 개)** + **고용보험 (ei.go.kr)** + **워크넷 (work.go.kr)**. **수급 요건**: (1) **고용보험 가입 사업장에서 18개월 동안 180일 이상 피보험단위기간 충족** ; (2) **이직 사유가 비자발적**(권고사직·계약만료·구조조정·정년) 또는 **정당한 자발적 이직사유** 가 있을 것 ── 정당한 사유 = (a) 임금체불·연봉의 30% 이상 변경 ; (b) 사업장 위치 이전 또는 통근시간 왕복 3시간 이상 ; (c) 직장 내 괴롭힘·성희롱·임신 출산 차별 ; (d) 가족 간호 ; (e) 질병 등 불가피한 사유 ; (3) **재취업을 위한 노력**(구직활동) 적극적으로 할 것 ; (4) 근로 의사·능력 있을 것 ; (5) 이직 다음 날부터 12개월 이내 신청. **신청 절차**: (1) **퇴사 후 14일 이내 회사가 ‘이직확인서’ 신고** ; (2) 거주지 관할 **고용센터 방문** 또는 ei.go.kr 온라인으로 **수급자격 인정 신청 + 구직신청** ; (3) **수급자격 인정 교육(온라인)** 시청 ; (4) **수급자격 인정** 후 **2주마다 실업인정일에 출석** + 구직활동 증명. **구직급여 일액**: **이직 전 평균임금의 60%** (2024년 상한 66,000원/일, 하한 64,192원/일) ── 월 약 200만원 한도. **소정급여일수**(나이 + 가입기간 별 표): 50세 미만/1년 미만 = 120일 ; 50세 미만/10년 이상 = 240일 ; 50세 이상/10년 이상 = 270일 ; 등 다양. **부정수급**: 발견 시 환수 + 형사처벌. **공식 출처**: **moel.go.kr**, **ei.go.kr**(고용보험), **work.go.kr**(워크넷), **국번없이 1350**(고용노동부 고객상담).'
  graceful_unknown: 실업급여(구직급여)는 고용보험 가입 + 18개월 중 180일 이상 피보험기간 + 비자발적 이직(또는 정당한 자발적 이직 사유) 시 수급 가능. 평균임금의 60%(상한 6만 6천원/일), 소정급여일수 120-270일(연령 + 가입기간별). 신청은 거주지 고용센터 또는 ei.go.kr 온라인. 자발적 퇴사로 정당한 사유 없으면 수급 불가. 구직활동 + 2주마다 실업인정 필수. 정확한 정보는 ei.go.kr · 1350.
