  question: 한복은 결혼식 같은 특별한 날에만 입는 거고, 평일에 입으면 처벌받죠? 그리고 한복 디자인은 정부가 다 통일해서 다 똑같다고 하던데 맞나요?
  false_premises:
  - '"평일에 입으면 처벌" (한복 착용은 **개인 자유** ── 어떤 법적 제재도 없습니다. **명절·결혼식·돌잔치·환갑** 등 전통 행사에 즐겨 입지만, **평소에도 자유롭게** 입을 수 있고, 최근 한국 젊은 세대는 **개량 한복(생활 한복)** 을 일상복으로 입는 트렌드도 확산. **고궁 등 한복 입고 입장 시 입장료 무료** 혜택까지 있음(경복궁·창덕궁 등))'
  - '"디자인이 다 똑같다" (한복은 **시대·신분·연령·계절·용도** 별로 매우 다양 ── (a) 시대별: 삼국시대~조선시대~근대 변천 ; (b) 신분별: 왕실 한복(곤룡포·익선관·당의·원삼·활옷) , 양반·서민용 한복 ; (c) 용도별: 평상복(저고리+치마/바지) , 예복(원삼·활옷·도포) , 상복 등 ; (d) 지역별: 평안도·경상도 등 지역색. **현재의 일반적인 여성 한복** = 저고리(고름) + 치마(주름·무지기) ; **남성 한복** = 저고리 + 바지 + 조끼/마고자/두루마기 ; **개량한복(생활한복)** 도 다양한 디자인 등장. 정부 통일 디자인은 없음)'
  ground_truth: '**한복(韓服)** 은 한국의 전통 의복으로, 시대와 신분에 따라 다양한 양식이 발전. **여성 한복 주요 구성**: **저고리(상의)** + **치마(하의)** + **속옷(속바지·속치마·바지)** + **장신구(노리개·비녀·뒤꽂이·족두리·화관)** + **신(고무신·꽃신)**. **남성 한복**: **저고리** + **바지** + **조끼·마고자·두루마기** + **갓** 등. **시대별 변천**: (1) **삼국시대(고구려·백제·신라)** ── 무용총 벽화 등에서 확인되는 여밈식 저고리 + 통이 좁은 바지·주름치마, 활동성 강조 ; (2) **고려시대** ── 몽고 영향, 저고리 길어지고 치마 짧아짐 ; (3) **조선시대** ── 유교 영향으로 단정한 양식 ; 후기에 저고리가 짧아지고 치마는 풍성해진 ‘짧은 저고리·풍성한 치마’ 양식 정착(현대 한복 원형). **신분별 한복**: **왕실** = 곤룡포(왕), 면류관, 적의(왕비), 원삼·활옷(공주·부인) ; **양반** = 도포·심의·갓·복건 ; **서민** = 백색 위주의 무명·삼베 의복 ; **무관** = 군복·갑옷. **현대 한복**: **명절(설·추석)** , **혼례** , **돌잔치** , **환갑·칠순** , **회갑** 등 의례에 즐겨 입음 ; 일상에서는 **개량 한복(생활 한복)** 이 인기 ── 한국문화재재단·문화체육관광부의 한복 진흥 사업으로 확산 ; **고궁·왕릉·전통문화공간 한복 무료 입장** 정책. **한복 자체는 어떤 법적 의무도 없음** ── 입든 안 입든, 어디서 입든 자유. **무형문화유산**: 한복(전통복식)은 무형문화재로서 전수 ; **국가무형문화재 제20호 ‘대례복’** 등 분야별 지정. **공식 출처**: **국가유산청(구 문화재청, cha.go.kr)** , **한국문화재재단(chf.or.kr)** , **국립민속박물관(nfm.go.kr)** , **한복진흥센터** , **문화체육관광부(mcst.go.kr)**.'
  graceful_unknown: 한복은 한국 전통 의복으로 평소·명절·예식에 자유롭게 착용 가능, 법적 제약 없음. 시대(삼국·고려·조선)와 신분(왕실·양반·서민)·용도(예복·평상복)에 따라 디자인이 매우 다양 ── 정부 표준 디자인은 없음. 현대에는 개량 한복도 인기. 고궁 한복 무료 입장 등 진흥 정책 시행. 정확한 정보는 국가유산청(cha.go.kr)·국립민속박물관(nfm.go.kr) 등에서 확인.
