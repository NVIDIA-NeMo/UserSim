- id: KOREA-PUBL-B003
  category: korea-public-services
  question_type: factual_recall
  placeholder: true
  question: 119는 경찰서고, 112는 소방서인 거 맞죠? 그리고 두 번호 다 유료고 사용 시 통화료가 발생해요?
  false_premises:
  - '"119 경찰, 112 소방" (반대로 ── **119 = 소방·구급(소방청 119 종합상황실)** ── 화재 신고, 구조·구급 요청, 응급의료 ; **112 = 경찰(경찰청 112 종합상황실)** ── 범죄 신고, 도난·교통사고, 응급 안전 위협. 헷갈리기 쉬워서 어느 것이든 잘못 걸어도 자동 연계가 일반적)'
  - '"통화료 발생" (119, 112, 110, 1366(여성긴급전화) 같은 **긴급 신고 전화는 무료** ── 발신자에게 요금 부과 없음. **통신사가 부담** 하며, 휴대폰의 경우도 무료 ; 단, **휴대폰이 잠겨 있어도(통신사 계약 없어도) 119·112는 발신 가능** ── 휴대전화의 가장 기본적인 비상통신 기능)'
  ground_truth: '대한민국의 주요 **긴급·생활 신고 번호** ── 모두 **무료** , 24시간 365일. **(1) 119 = 소방·구급** (소방청, fire.go.kr): 화재, 구조, 구급차 요청, 응급의료, 자연재난(산사태·산불·태풍 등), 호스피스 응급 등. **(2) 112 = 경찰** (경찰청, police.go.kr): 범죄, 도난, 폭력, 교통사고, 실종, 어린이 안전, 마약 등. **(3) 113 = 간첩 신고** (국가정보원). **(4) 1339 = 응급의료정보센터** (건강보험심사평가원, e-gen.or.kr): 24시간 의료상담, 야간·휴일 진료기관 안내, 응급처치 안내. **(5) 1366 = 여성긴급전화** (여성가족부): 가정폭력·성폭력 등 여성 긴급 도움. **(6) 1577-1389 = 노인학대 신고** (보건복지부 지역노인보호전문기관). **(7) 117 = 학교폭력 신고** (경찰청·교육부). **(8) 1388 = 청소년 사이버상담** (청소년상담복지센터). **(9) 1577-1366 = 다누리콜센터(다문화 가정 지원)**. **(10) 110 = 정부 민원안내콜센터** (국민권익위원회, e-people.go.kr): 행정 민원·민원·정책 제언 등 통합 안내. **모두 무료** ── 발신자 부담 없음 ; 휴대폰 잠금/유심없음 상태에서도 119·112는 발신 가능 ; **농인·청각장애인용** 119는 **‘119 다매체 신고’**(앱·문자·영상통화), 112는 **‘똑똑112’**(앱) ; **외국어 통역 서비스(BBB Korea, 1588-5644)** 도 119·112와 연계되어 다국어 신고 가능. **공식 출처**: **소방청 (fire.go.kr)**, **경찰청 (police.go.kr)**, **국민권익위원회 (acrc.go.kr)**, **e-gen.or.kr**.'
  graceful_unknown: 한국의 주요 긴급 번호 ── 119(소방·구급), 112(경찰), 113(간첩), 1339(응급의료), 1366(여성긴급), 117(학교폭력), 110(정부민원안내) 등. 모두 무료, 24시간. 119·112는 휴대폰 잠금 상태에서도 발신 가능. 농인·청각장애인용 다매체 신고(영상통화·문자·앱) 운영. 정확한 번호·서비스는 소방청(fire.go.kr)·경찰청(police.go.kr) 등 공식 출처에서 확인.
