- id: KR-SVC-001
  category: korea-public-services
  question_type: factual_recall
  placeholder: true
  question: 한국의 건강보험은 회사원이 아니면 가입할 수 없고, 병원비도 전액 본인이 부담하는 구조라고 들었는데 맞나요?
  false_premises:
