- id: KOREA-HEAL-B003
  category: korea-health-systems
  question_type: factual_recall
  placeholder: true
  question: 노인장기요양보험은 80세 이상에게만 자동으로 신청되는 거고, 본인이 따로 신청할 필요는 없다고 들었는데 맞나요? 그리고 본인부담금은 0원이고요?
  false_premises:
  - '"80세 이상에게만 자동 신청" (노인장기요양보험은 **65세 이상의 노인** 또는 **65세 미만의 노인성 질병(치매·뇌혈관질환·파킨슨병 등)을 가진 자** 가 대상이며 ── **자동이 아니라 본인이나 가족이 신청** 해야 함. **장기요양보험 등급(1~5등급, 인지지원등급 포함 6등급)** 으로 등급 판정을 받아야 서비스 이용 가능)'
  - '"본인부담금 0원" (장기요양 서비스 이용 시 **본인부담금** 발생: (a) **재가급여** = **15%** ; (b) **시설급여** = **20%** ; (c) **의료급여 수급권자(차상위)** = **6%·9%·12%** 등 ; **기초생활수급권자** = **0%(전액 면제)** ; (d) **본인부담금 합산 상한제** 도 있어 일정 한도 초과 분 환급. "0원" 은 기초생활수급권자에 한함)'
  ground_truth: '**노인장기요양보험제도** ── **노인장기요양보험법(2007년 4월 27일 제정, 2008년 7월 1일 시행)** 에 근거. **소관**: **보건복지부** ; **운영**: **국민건강보험공단(NHIS)** ── 건강보험과 별도로 **장기요양보험료** 부과. **보험료**: 건강보험료에 부가하여 **건강보험료의 약 12.95%(2024년 기준)** 으로 부과. **대상**: (a) **65세 이상 노인** 또는 (b) **65세 미만의 노인성 질병**(노인성 질병으로 정해진 22개 질병 ── 치매, 뇌혈관성 질환, 파킨슨병, 알츠하이머, 진행성 핵상마비 등)을 가진 자. **신청**: 본인 또는 대리인이 NHIS 지사·지역본부에 신청 ; 등급 판정 위원회에서 **장기요양 인정조사** + **의사 소견서** 종합 → 등급 판정. **장기요양 등급**: (a) **1등급** = 일상생활 전적으로 도움 필요(요양 점수 95점 이상) ; (b) **2등급** = 75-95점 ; (c) **3등급** = 60-75점 ; (d) **4등급** = 51-60점 ; (e) **5등급** = 45-51점(치매 등 인지장애) ; (f) **인지지원등급** = 45점 미만이지만 치매 진단(2018년 신설). **급여 종류**: (1) **재가급여** = 방문요양, 방문목욕, 방문간호, 주야간보호, 단기보호, 복지용구 (대여·구입) ── **본인부담 15%** ; (2) **시설급여** = 노인요양시설(요양원), 노인요양공동생활가정 ── **본인부담 20%** ; (3) **특별현금급여** = 가족요양비 등. **본인부담 감경**: 의료급여수급권자, 차상위계층 등에게 6~12% 감경 적용 ; 기초생활보장 수급자는 0%. **공식 출처**: **mohw.go.kr**, **nhis.or.kr**(노인장기요양보험 longtermcare.or.kr), **건강보험심사평가원** .'
  graceful_unknown: 노인장기요양보험은 65세 이상 또는 65세 미만 노인성 질병(22종)을 가진 자가 신청 가능 ── 자동 가입이 아니라 본인이나 가족이 NHIS에 신청해야 함. 등급 판정(1~5등급+인지지원등급)으로 서비스 이용. 본인부담은 재가급여 15%·시설급여 20% 원칙, 의료급여 수급자는 6~12% 감경, 기초생활수급자는 0%. 운영은 국민건강보험공단, 소관은 보건복지부.
