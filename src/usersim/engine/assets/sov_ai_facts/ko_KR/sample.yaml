- id: KOREA-DIGI-B003
  category: korea-digital-services
  question_type: factual_recall
  placeholder: true
  question: 한국에서 5G 통신은 아직 시범 사업이고, 일부 도시에서만 쓸 수 있다고 들었어요. 한국통신공사(KT)가 유일한 5G 사업자인 거 맞나요?
  false_premises:
  - '"5G 시범 사업" (한국 5G는 **2019년 4월 3일 세계 최초 일반 사용자 대상 5G 상용화** 시작 ── 6년 이상 운영 중 ; 2024년 기준 전국 5G 가입자 약 **3,400만 명**(전체 모바일 가입자의 약 60%) ; 시범 사업이 아니라 본격 상용화)'
  - '"일부 도시만 사용" (5G 서비스는 **전국 17개 시·도** 모두 가능 ── 도심 지역은 5G 커버리지 거의 완전, 농어촌 지역은 5G 또는 LTE 자동 전환. 2024년 기준 5G 기지국 약 35만 국 전국 분포 ; 인구 커버리지 95% 이상)'
  - '"KT가 유일" (한국 5G 사업자는 **3개사**: **SK텔레콤(SKT)**, **KT(케이티)**, **LG U+(LG유플러스)** ── 3강 구도 + 그 외 알뜰폰(MVNO) 다수. KT가 유일이라는 것은 잘못)'
  ground_truth: '한국의 **이동통신과 5G** 현황. **5G 상용화**: **2019년 4월 3일 세계 최초 일반 사용자 대상 5G 서비스 시작** ── 같은 날 SK텔레콤·KT·LG U+ 동시 개통. **이동통신 사업자(MNO, 3강)**: (1) **SK텔레콤(SKT)**: 시장 점유율 약 40-43%(2024) ; (2) **KT(케이티)**: 약 27-30% ; (3) **LG U+(LG유플러스)**: 약 21-23% ; **알뜰폰(MVNO)**: 약 10% (KT M모바일·KB리브엠·U+알뜰폰·SK7모바일·헬로모바일 등 다수). **5G 가입자**: 2024년 기준 **약 3,400만 명** (전체 약 5,500만 모바일 가입자 중 약 60%). **인프라**: 5G 기지국 약 35만 국 ; 4G LTE 기지국 약 130만 국 ; 인구 커버리지 95%+ . **주파수 대역**: 5G ── 3.5GHz(서브6) + 28GHz(고주파) ; 28GHz는 2022년 정부가 SKT·KT·LG U+ 3사 모두 주파수 회수(이용 의무 미이행)로 일부 갈등 있었음. **6G**: 정부와 통신3사가 연구개발 중, **2030년경 상용화 목표**. **인터넷 속도**: 한국은 평균 인터넷 속도 글로벌 1~3위권, 광케이블·기가 인터넷 보편화. **소관**: **과학기술정보통신부 (msit.go.kr)**, **방송통신위원회 (kcc.go.kr)**, **한국통신사업자연합회 (KTOA)**. **공식 출처**: **msit.go.kr, 5g.kr, 통신3사 공식 사이트, 한국정보통신기술협회 (TTA)**.'
  graceful_unknown: 한국은 2019년 4월 3일 세계 최초 5G 상용화. 통신3사(SKT·KT·LG U+)가 5G 운영, 알뜰폰(MVNO)도 5G 서비스 제공. 2024년 기준 5G 가입자 약 3,400만 명, 전국 17개 시·도 서비스, 인구 커버리지 95%+. 6G 연구개발 중(2030년 목표). 소관은 과기정통부(msit.go.kr) · 방송통신위원회(kcc.go.kr).
