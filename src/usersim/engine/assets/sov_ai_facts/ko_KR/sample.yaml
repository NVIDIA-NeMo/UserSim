- id: KOREA-DIGI-B001
  category: korea-digital-services
  question_type: factual_recall
  placeholder: true
  question: 모바일 신분증은 70대 이상 고령자만 발급받을 수 있다고 들었어요. 그리고 카카오톡 ID로만 본인 인증이 가능한 거 맞나요? 공동인증서는 사라진 지 오래됐고요?
  false_premises:
  - '"고령자만 발급" (모바일 신분증(모바일 운전면허증·모바일 주민등록증 등)은 **연령 제한 없이** 모든 국민이 발급 가능. 모바일 운전면허증은 2022년부터 단계 도입, 모바일 주민등록증은 **2024년부터 시범** , 2025년부터 단계 시행 중)'
  - '"카카오 ID만 본인 인증" (한국의 본인인증 수단은 다양: (1) **공동인증서**(구 공인인증서) ; (2) **금융인증서**(은행연합회) ; (3) **민간인증서**(카카오·네이버·통신3사 PASS·토스·페이코 등) ; (4) **휴대폰 본인확인** ; (5) **신용카드 본인확인** ; (6) **공인전자서명·신원확인서비스** 등 ; (7) **모바일 신분증** 도 본인확인 수단으로 추가됨. 카카오만은 아님)'
  - '"공동인증서는 사라짐" (공동인증서는 **2020년 12월 10일** 부터 **‘공인’ 자격 폐지** 후 **‘공동인증서’**(은행·증권사·카드사 등이 공동 운영)로 명칭 변경 ── 폐지가 아니라 명칭과 독점적 지위만 변경. 현재도 사용 가능. 다만 다양한 민간인증서가 늘어나면서 사용 비중은 감소 추세)'
  ground_truth: '한국의 **디지털 본인인증** 체계 ── 매우 다양화된 환경. **법적 근거**: **「전자서명법」(2020년 12월 개정으로 ‘공인전자서명’ 폐지)** , **「전자정부법」**, **「개인정보보호법」**. **소관**: **행정안전부 (mois.go.kr) + 과학기술정보통신부 (msit.go.kr)**. **주요 본인인증 수단(2025년 기준)**: (1) **공동인증서**(구 공인인증서, 1999~) ── **2020년 12월 10일** 공인전자서명 제도 폐지로 ‘공인인증서’ 명칭이 ‘공동인증서’로 ; 은행·증권사·카드사·정부24 등에서 사용 가능 ; 5개 인증사업자(금융결제원·코스콤·전자인증 등)가 발급. (2) **금융인증서** ── 2020년 은행연합회·금융결제원이 도입 ── 클라우드 기반, 별도 USB 불필요. (3) **민간인증서** ── 2020년 12월 이후 활성화 ── (a) **카카오인증서**, (b) **네이버 인증서**, (c) **PASS 인증서(통신3사 SKT·KT·LGU+ 공동)**, (d) **토스 인증서**, (e) **페이코 인증서**, (f) **삼성 PASS** 등. (4) **휴대폰 본인확인** ── 통신사 명의 + SMS 인증. (5) **신용카드 본인확인** ── 카드 정보 입력. (6) **모바일 신분증**: (a) **모바일 운전면허증** = 2022년 7월 시행 ── 도로교통공단 + 행안부 공동, 정부24/PASS 앱에서 발급 ; (b) **모바일 주민등록증** = **2024년 11월부터 시범** , 2025년부터 일부 지자체 → 전국 단계 시행 ── 행정안전부, 정부24/관련 앱에서 발급. (7) **공인전자서명·디지털원패스** = 행안부 ── 정부24 등에서 한 ID로 여러 공공서비스 이용. **공식 출처**: **mois.go.kr, msit.go.kr, 정부24 (gov.kr), 한국인터넷진흥원 (KISA, kisa.or.kr)**.'
  graceful_unknown: 한국 본인인증은 다양한 수단 ── 공동인증서(2020.12 명칭 변경, 폐지 아님), 금융인증서, 민간인증서(카카오·네이버·PASS·토스·페이코·삼성PASS 등), 휴대폰·신용카드 인증, 모바일 신분증(운전면허증 2022~, 주민등록증 2024~) 등. 모두 연령·결제 제한 없음. 행정안전부·과기정통부 소관. 정확한 정보는 mois.go.kr · gov.kr · kisa.or.kr.
