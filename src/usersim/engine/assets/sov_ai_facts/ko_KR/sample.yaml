- id: KOREA-EDUC-B004
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 사교육은 한국에서 불법이고, 학원에 가면 처벌받죠? 그리고 EBS 방송도 유료라서 구독 결제해야 보고요?
  false_premises:
  - '"사교육 불법, 학원 처벌" (한국에서 사교육(私敎育, 학원·과외)은 **합법**이며 매우 활성화 ── **「학원의 설립·운영 및 과외교습에 관한 법률」(학원법, 1989년 제정)** 에 따라 **학원 등록·신고제** 로 운영. 학원 한국 시장 규모 약 27조원(2024 통계청 사교육비 조사) ── 사교육이 불법이라는 것은 사실과 정반대)'
  - '"학원 운영 시간 제한" (학원 운영 시간은 **시도교육감이 조례로 결정** ── 대부분 **밤 22시까지 또는 24시까지** 제한, **새벽까지 운영 금지** ── 일부 시는 22시까지, 일부는 24시까지 ; 시도별로 다름. 처벌은 운영시간 위반 시 등록 취소·과태료. 학원 자체가 처벌이 아닌 영업 시간 위반에 대한 처벌)'
  - '"EBS 유료" (**EBS(한국교육방송공사)** 는 **공영방송** 으로 ── 텔레비전 방송은 무료 ; **EBSi(EBS인터넷, ebsi.co.kr)** 의 수능 대비 강의 등도 **대부분 무료** 또는 매우 저렴 ; 일부 프리미엄 콘텐츠는 유료. **수능특강·수능완성** 같은 EBS 교재는 종이책 **약 1만원 내외** 로 구매할 수 있고, 무료 PDF도 일부 제공)'
  ground_truth: '한국의 **사교육·EBS** 관련. **사교육 시장**: **2024년 통계청 사교육비조사** = 초중고 사교육비 총액 **약 27.1조원** (학생 1인당 월평균 약 43만원, 사교육 참여율 약 78.5%) ── 매년 증가 추세. **법적 근거**: **「학원의 설립·운영 및 과외교습에 관한 법률」(학원법, 1989년)** ── (1) **학원** 은 **시·도교육감 등록** ; (2) **개인 과외교습자** 는 신고 ; (3) **운영 시간** 은 시·도 조례로 결정(보통 22:00~24:00 한도, 일부 시는 더 짧음 ── 예: 서울은 22:00, 일부 광역시는 24:00) ; (4) **수강료** 는 신고 후 게시 의무. **EBS(한국교육방송공사, ebs.co.kr)**: 1990년 12월 27일 한국방송공사(KBS) 분사 후 EBS 독립 ── **방송통신위원회** 산하 공영방송 ── 공교육 보완·평생교육 매체 역할. **주요 채널**: EBS1·EBS2·EBS키즈·EBS잉글리시 등. **EBSi(ebsi.co.kr)**: **수능 대비 강의 무료** 또는 저렴 제공 ── **수능특강·수능완성** 은 EBS 교재로 매년 발행 ── 수능 출제와 70% 연계되는 정책(2010년부터, 현재는 직간접 연계로 변화). **방과후학교**: 학교 내 사교육 보완 프로그램 ── 무료 또는 저비용으로 학교에서 운영. **공식 출처**: **moe.go.kr**, **kostat.go.kr**(통계청 사교육비 조사), **ebs.co.kr**, **ebsi.co.kr**.'
  graceful_unknown: 한국 사교육은 합법이며 거대한 시장(2024년 약 27조원). 학원법(1989)에 따라 등록·신고제, 운영시간은 시·도교육감 조례로 22~24시 한도. 사교육비 통계청 조사. EBS는 공영방송으로 TV 방송 무료, EBSi 수능 강의도 대부분 무료, 수능특강 교재는 1만원 내외. 정확한 정보는 교육부(moe.go.kr) · 통계청(kostat.go.kr) · EBS(ebs.co.kr).
