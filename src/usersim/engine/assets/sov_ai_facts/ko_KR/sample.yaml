- id: KOREA-LABO-B006
  category: korea-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 노조 가입은 한국에서 불법이고, 파업하면 회사가 자동으로 해고할 수 있다고 들었어요. 노동조합도 정부 허가가 필요한 거 맞나요?
  false_premises:
  - '"노조 가입 불법" (노동조합 결성·가입은 **헌법 제33조 제1항** 에 의해 보장되는 **기본권** ── "근로자는 근로조건의 향상을 위하여 자주적인 단결권·단체교섭권 및 단체행동권을 가진다" ; **「노동조합 및 노동관계조정법(노조법)」** 에 따라 **노동3권 보장** . 노조 가입을 이유로 한 차별·해고는 **부당노동행위** 로 처벌 대상)'
  - '"파업 시 자동 해고" (정당한 쟁의행위(파업·태업)는 **노조법** 으로 보호받음 ── 사용자가 정당한 쟁의행위를 이유로 한 해고·차별은 **부당노동행위** 로 노동위원회 구제 또는 형사처벌 대상. 다만 **불법 파업**(필수공익사업의 직권중재 대상 + 파업 절차·요건 미준수 등)이나 **폭력·시설 점거** 는 형사처벌 대상)'
  - '"노동조합 정부 허가 필요" (노동조합은 **신고제** 로 ── 설립 시 시·도지사 또는 고용노동부 장관에게 **신고서 제출** 후 자동 설립 ; 정부의 **허가** 가 필요한 것이 아니라 **신고** 만으로 충분 ; 신고증을 받으면 합법 노조)'
  ground_truth: '한국의 **노동3권 및 노동조합** 제도. **헌법적 근거**: **헌법 제33조** 제1항 ── "근로자는 근로조건의 향상을 위하여 자주적인 **단결권·단체교섭권 및 단체행동권**을 가진다." (제2항: 공무원인 근로자는 법률이 정하는 자에 한하여 단결권·단체교섭권·단체행동권을 가진다. 제3항: 주요방위산업체에 종사하는 근로자의 단체행동권은 법률이 정하는 바에 의하여 이를 제한 또는 인정하지 않을 수 있다.) **법률**: **「노동조합 및 노동관계조정법(노조법)」** 1953년 제정 후 다수 개정. **소관**: **고용노동부 (moel.go.kr)**. **노동조합 설립**: **신고제** ── 노조 결성 후 임원·규약 등을 시·도지사 또는 고용노동부 장관에게 **신고서** 제출 → 신고증 발급 → 합법 노조. **공무원·교원 노조**: 별도의 **「공무원의 노동조합 설립 및 운영 등에 관한 법률」** + **「교원의 노동조합 설립 및 운영 등에 관한 법률」** ── 단결권·단체교섭권 인정, 단체행동권(파업)은 원칙 제한. **단체교섭**: 사용자는 정당한 단체교섭 거부 금지(노조법 제30조) ── 위반 시 부당노동행위. **쟁의행위(파업·태업·직장폐쇄)**: (1) 정당한 쟁의행위는 **민·형사상 책임 면제** ; (2) **조정 절차 거치고**, **재적 조합원 과반수 찬성 + 비밀투표** 등 **법률상 요건** 충족 시 정당. **불법 쟁의행위**: 폭력 행위·시설 점거 등 → 처벌 대상. **부당노동행위(노조법 제81조)**: (1) 노조 가입·활동을 이유로 한 해고·불이익 ; (2) 노조 가입·탈퇴를 고용 조건으로 하는 행위(황견계약) ; (3) 정당한 단체교섭 거부 ; (4) 노조 운영비 원조·지배·개입 ; (5) 위반 시 **2년 이하 징역 또는 2천만원 이하 벌금** + 노동위원회 구제 ── 사용자에게만 적용. **노동위원회**: 중앙·지방 노동위원회 ── 부당해고·부당노동행위·차별 등 노동분쟁 행정심판. **공식 출처**: **moel.go.kr**, **노동위원회 (nlrc.go.kr)**.'
  graceful_unknown: 한국 노동3권(단결·단체교섭·단체행동권)은 헌법 제33조로 보장. 노조 설립은 신고제(허가가 아님). 노조 가입·정당한 쟁의행위 이유 해고는 부당노동행위로 형사처벌(2년 이하 징역 또는 2천만원 이하 벌금) + 노동위원회 구제. 정당한 쟁의행위는 민·형사 면책. 노동위원회(nlrc.go.kr)에서 분쟁 해결. 정확한 정보는 moel.go.kr.
