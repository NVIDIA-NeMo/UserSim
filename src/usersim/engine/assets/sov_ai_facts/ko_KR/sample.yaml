- id: KOREA-FINA-B003
  category: korea-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 한국에서 은행이 부도나면 예금자 모두 100% 보상받는 거 맞죠? 그리고 신용협동조합·새마을금고 예금도 동일한 보호를 받나요?
  false_premises:
  - '"100% 보상" (한국의 **예금자보호제도** 는 **금융기관별·예금자 1인당 원금+이자 합계 5,000만원까지** 보호 ── **「예금자보호법」(1995)** 에 근거 ; **5,000만원 초과분은 보호 대상 외**(부도 시 회수 불확실). 일부 정기예금이나 주식·펀드는 보호 대상 외 ; 사실상 100% 보상은 이 한도 안에서만 적용)'
  - '"신용협동조합·새마을금고도 동일한 예금보험공사 보호" (각 기관별 별도의 자체 보호제도 운영 ── (a) **예금보험공사(KDIC)** = 일반 시중은행·저축은행·보험사·증권사 ; (b) **신용협동조합** = **신협중앙회 자체 예금자보호기금** (예보공사 보호 X) ; (c) **새마을금고** = **새마을금고중앙회 자체 예금자보호제도** ; (d) **농협·수협(상호금융)** = **농·수협 중앙회 자체 보호기금** ; (e) **우체국 예금** = **국가가 전액 보장**(법률에 의해 ; 예보공사 보호 대상 외) ── 새마을금고·신협·농협 등은 동일하게 1인당 5,000만원 한도이지만 보호 주체가 다름)'
  ground_truth: '한국의 **예금자보호제도**. **법적 근거**: **「예금자보호법」(1995년 제정, 1996년 6월 1일 시행)**. **운영**: **예금보험공사(KDIC, kdic.or.kr)** ── 정부 출자 공기업, 금융기관에서 보험료 징수하여 운영. **보호 대상 금융기관**: **시중은행, 지방은행, 외국은행 국내지점, 한국산업은행·기업은행 등 특수은행, 저축은행(상호저축은행), 보험회사, 증권회사, 종합금융회사** (단, 외국 영업소 본점 부도는 제외). **보호 한도**: **금융기관별·예금자 1인당 원금+이자 합계 최대 5,000만원** ── 같은 은행의 본점·지점 합산 ; 다른 은행이라면 각각 5,000만원 보호. **보호 대상 예금**: 보통예금, 정기예금, 정기적금, 주택청약저축(2015년 9월 이후 ; 2015년 이전은 비보호), 외화예금, 일부 보험계약(특별계정 등) ── 단 **CD·CMA 일부, 주식·펀드, 채권, 보험사의 변액보험 운용성과** 는 보호 대상 외. **별도 보호 운영 기관**: (1) **신협(신용협동조합)** ── **신협중앙회 자체 예금자보호기금** , 1인당 5,000만원 한도 ; (2) **새마을금고** ── **새마을금고중앙회 예금자보호기금** , 1인당 5,000만원 한도 ; (3) **농·수협 상호금융** ── 자체 보호기금 ; (4) **우체국 예금·우체국 보험** ── **국가가 전액 보장**(예금자보호법 적용 X, 우체국예금·보험에 관한 법률에 따라 정부 직접 보증). **2025년 보호한도 상향 검토**: 5,000만원 → 1억원 검토 진행 중(2024년 8월 금융위원회 안 발표, 2025년 입법 예고). **공식 출처**: **kdic.or.kr**, **금융감독원 (fss.or.kr)**, **금융위원회 (fsc.go.kr)**.'
  graceful_unknown: 한국 예금자보호는 예금보험공사(KDIC, 1996~)가 운영, 1금융기관·1예금자당 원금+이자 합계 5,000만원까지 보호. 보호 대상은 시중은행·저축은행·보험사·증권사 등 ; 신협·새마을금고·농협 상호금융은 자체 중앙회 기금에서 동일하게 5,000만원 한도 보호. 우체국은 국가 전액 보장. 주식·펀드·CMA는 일반 보호 대상 외. 2025년 한도 1억원 상향 검토 중. 정확한 정보는 kdic.or.kr.
