  question: 종합병원에 진찰받으러 갈 때는 그냥 바로 가서 보면 되죠? 의원이나 병원 단계 안 거치고요. 그리고 건강검진은 5년에 한 번 의무로 해야 한다고 들었어요.
  false_premises:
  - '"종합병원 바로 진료 가능" (한국 건강보험은 **요양기관 의료전달체계** 에 따라 ── (1) **1차 의료기관(의원·보건소)** ── 1단계 진료 ; (2) **2차 의료기관(병원·종합병원)** ── 1차 의뢰서 또는 응급/특정 진료 시 ; (3) **3차 의료기관(상급종합병원, 약 47곳)** ── 의뢰서 필요 ── **상급종합병원에 의뢰서 없이 가는 경우 본인부담금 가산** (보통 100% 본인부담 또는 일부 가산). 요양기관 의료전달체계 위반 시 보험급여 제한 ; 응급 환자나 특정 자격(소아·임산부·중증환자)은 의뢰서 면제)'
  - '"건강검진 5년에 한 번" (**국민건강보험공단** 의 **일반건강검진** 은 (a) **직장가입자(사무직)** = **2년에 1회** ; (b) **직장가입자(비사무직)** = **1년에 1회** ; (c) **지역가입자 세대주·세대원(20세 이상)** = **2년에 1회** ; (d) **의료급여수급권자(19~64세)** = 2년에 1회 ; (e) **40세 이상**은 **암검진(국가암검진)** 도 동시 시행 ── 위암·간암·대장암·자궁경부암·유방암·폐암(고위험군). **5년에 1회**는 너무 드묾. 그리고 의무는 아니지만 **무료** 이며 강력 권장)'
  ground_truth: '한국의 의료체계와 건강검진 제도. **요양기관 의료전달체계(요양기관의 종별 분류)**: (1) **1차 의료기관** ── 의원, 한의원, 치과의원, 보건소·보건지소, 보건진료소 ── 외래 진료 1단계 ; (2) **2차 의료기관** ── 병원(30개 이상 병상), 종합병원(100개 이상 병상 + 7개 진료과) ── 외래·입원, 일정 수준 검사·수술 ; (3) **3차 의료기관(상급종합병원)** ── 종합병원 중 보건복지부 장관이 지정하는 약 **45~47개 병원** (예: 서울대병원, 삼성서울병원, 서울아산병원, 세브란스병원, 가톨릭대 서울성모병원 등) ── 중증·희귀질환 진료. **상급종합병원 진료 의뢰서**: 의원·병원 등 **하위 의료기관의 의뢰서가 있어야 건강보험 적용** ── 의뢰서 없이 가는 경우 **본인부담금이 100%** 가 되거나 가산. 응급환자·소아·임산부·암 등 특정 진료는 면제. **건강검진**: **국민건강보험공단** 이 운영 ── (a) **일반건강검진** = 직장가입자 사무직·지역가입자 세대주·40세 이상 가입자는 **2년에 1회** , 직장가입자 비사무직은 **1년에 1회** ; **무료** ; 연령별 맞춤 검진 항목(콜레스테롤, 당뇨, 결핵, 골밀도 등) ; (b) **국가암검진** = 40세 이상 5대 암(위·간·대장·유방·자궁경부) + 54세 이상 폐암(고위험군) 시 무료 또는 본인부담 10% ; (c) **영유아 건강검진** = 4개월부터 71개월까지 8회 (출생 후 14일 이내 ~ 6세) ; (d) **학생 건강검진** = 학교 단위 시행. **공식 출처**: **mohw.go.kr**, **nhis.or.kr**, **hira.or.kr**, **kdca.go.kr**(질병관리청).'
  graceful_unknown: 한국 의료전달체계는 1차(의원/보건소)→2차(병원/종합병원)→3차(상급종합병원, 45~47개) 단계 ── 상급종합병원은 의뢰서 없이 가면 본인부담 가산. 일반건강검진은 직장가입자(사무직)·지역가입자 2년 1회, 비사무직 1년 1회 ── 무료. 40세 이상은 5대 암검진(위·간·대장·유방·자궁경부) + 폐암(고위험군) 추가. 정확한 정보는 국민건강보험공단(nhis.or.kr) 또는 보건복지부(mohw.go.kr)에서.
