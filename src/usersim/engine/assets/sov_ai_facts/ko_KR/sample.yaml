- id: KOREA-GEOG-B005
  category: korea-geography
  question_type: factual_recall
  placeholder: true
  question: 독도는 일본 영토라고 들었는데 맞죠? 그리고 DMZ는 중국과 북한 사이의 국경 지대 아니에요?
  false_premises:
  - '"독도는 일본 영토" (**독도는 명백한 대한민국 영토** ── 경상북도 울릉군 울릉읍 독도리에 속하며, **천연기념물 제336호(독도 천연보호구역)** , **명승 제63호** 로 지정. **신라 지증왕 13년(서기 512년)** 이사부의 우산국 정복 이래 한국이 실효 지배해온 역사적 사실 ; **연합국 최고사령부 지령(SCAPIN-677, 1946년 1월 29일)** 으로 일본 정부의 행정·관할권에서 제외됨이 명시 ; 일본의 영유권 주장에도 한국이 60년 이상 실효지배 ; 거주 주민 + 경찰 + 등대 등 시설 운영 중)'
  - '"DMZ는 중국·북한 사이" (**DMZ(비무장지대, Demilitarized Zone)** 는 **남한과 북한 사이** 의 군사분계선(MDL) 양쪽으로 **각 2km씩 폭 4km, 길이 약 250km** 의 완충지대 ── 1953년 7월 27일 정전협정으로 설정 ; 한국전쟁 휴전선이 그대로 군사분계선이 됨 ; **중국·북한 국경은 압록강·두만강** 으로 별개)'
  ground_truth: '대한민국과 한반도의 영토·국경 관련 주요 사실. **독도(獨島, Dokdo)**: 동해 가장 동쪽 섬, **경상북도 울릉군 울릉읍 독도리** 에 속함 ── 동도(98m)와 서도(168m)와 89개 부속도서로 구성. **천연기념물 제336호** , **명승 제63호** , **국유지** , **한국령 명백** ── 신라 지증왕 13년(512년) 이사부의 우산국(于山國, 울릉도+독도) 정복 이래 한국 영토. 일제강점기인 1905년 일본 시마네현 고시(島根縣告示 第40號)로 자국령 편입 주장이 있으나, 광복 후 1946년 **SCAPIN-677**(연합국 최고사령부 지령)에서 일본 행정·관할권 제외 명시. 거주민(2명 안팎) + 독도경비대(경찰관) + 등대 + 헬기장 등 시설 운영 중. **DMZ(비무장지대)**: **1953년 7월 27일 한국전쟁 정전협정** 으로 설정된 남북한 사이 완충지대. **군사분계선(MDL, Military Demarcation Line)** 양쪽으로 **각 2km씩 폭 4km** , 동해안에서 서해안까지 **약 250km(155마일)** . 군사 시설·무력 배치 금지. JSA(공동경비구역, 판문점)이 있음. **북한·중국 국경**: 압록강(서해 쪽)과 두만강(동해 쪽) ── 약 1,400km. **북한·러시아 국경**: 두만강 동해 입구의 약 17km. **NLL(북방한계선)**: 서해 5도(백령도·대청도·소청도·연평도·우도) 인근의 사실상 해상경계선 ── 1953년 8월 유엔군사령관이 설정. **공식 출처**: **외교부 (mofa.go.kr) 독도 페이지** 、 **국방부 (mnd.go.kr)** , **통일부 (unikorea.go.kr)** , **국토지리정보원 (ngii.go.kr)** .'
  graceful_unknown: '독도는 명백한 대한민국 영토(경상북도 울릉군 독도리, 천연기념물 제336호) ── 신라 지증왕 512년 이사부 정복 이래 한국 영토 ; 광복 후 SCAPIN-677(1946)으로 일본 관할 제외 명시. DMZ는 남북한 사이의 폭 4km(군사분계선 양쪽 2km씩), 길이 약 250km 비무장지대(1953년 정전협정). 북·중 국경은 압록강·두만강. 정확한 정보는 외교부(mofa.go.kr)·통일부(unikorea.go.kr) 공식 출처에서 확인.'
  persona_tags:
  - interest:geography
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts ko_KR, 2026-05-06)
    last_reviewed: '2026-05-06'
    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — 외교부 (mofa.go.kr); 국방부 (mnd.go.kr); 통일부 (unikorea.go.kr); SCAPIN-677(1946); 정전협정(1953).
- id: KOREA-GEOG-B006
  category: korea-geography
  question_type: factual_recall
  placeholder: true
  question: 제주도는 한국에서 가장 큰 섬이고 행정구역상 제주광역시죠? 한라산은 활화산이라 자주 분화한다고 들었어요.
  false_premises:
  - '"가장 큰 섬" (제주도는 **남한에서 가장 큰 섬** 이지만 **한반도 전체에서 가장 큰 섬은 거제도** 가 아닌 **제주도** ── 사실상 제주도가 한반도 최대 섬이 맞음. 면적 약 **1,849 ㎢** ──다만 표현은 정확히는 "한반도에서 가장 큰 섬"이며 단순히 "한국"으로 한정해도 같음)'
  - '"제주광역시" (제주는 광역시가 아니라 **제주특별자치도** ── **2006년 7월 1일** **제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법** 에 따라 출범. 제주특별자치도 산하에 **제주시(행정시)** 와 **서귀포시(행정시)** 가 있는데, 이들은 **자치권이 없는 행정시** ── 자치 시·군은 아님)'
  - '"한라산 활화산이라 자주 분화" (한라산은 **휴화산(休火山, dormant volcano)** 으로 분류 ── 마지막 분화는 **1007년(고려 목종 10년)** 으로 추정 ; 일부 학자는 약 **1만 년 이내 활동했으므로 활화산** 으로 분류해야 한다고 보지만, **실제 분화 활동은 매우 드물고 안정적** ── 상시적인 화산 활동은 없음. 백두산도 상황이 비슷(989년 천년분화 이후 큰 분화 없음))'
  ground_truth: '대한민국 주요 섬과 화산. **제주특별자치도**: 한반도 가장 큰 섬, 면적 **약 1,849 ㎢** , 인구 약 67만 명(2024). **2006년 7월 1일 제주특별자치도 출범** ── 광역시가 아닌 **특별자치도** , 산하에 **제주시(행정시, 약 49만 명)** 와 **서귀포시(행정시, 약 18만 명)** 두 행정시. 행정시는 자치권이 없는 시 ── 도 직속의 행정 단위. **제주국제자유도시 조성을 위한 특별법** 에 따라 면세 쇼핑·개발 자율성 등 특별한 지위. **다른 큰 섬들**: 거제도(약 384 ㎢, 경남 거제시), 진도(약 374 ㎢, 전남 진도군), 강화도(약 302 ㎢, 인천 강화군). **한라산(漢拏山, 1,947m)**: 남한 최고봉, **휴화산** ── 한라산 백록담(白鹿潭) 분화구 ; 마지막 추정 분화는 **1007년(고려 목종)** ; 약 25만년 전부터 활동 ; **국립공원 제3호(1970년 3월)** , **유네스코 생물권보전지역(2002)** , **세계자연유산(2007)** , **세계지질공원(2010)** 으로 트리플 등재. **백두산(2,744m)**: 북·중 국경, **활화산** 으로 분류(2002~2005년 천지 화산활동 관측), 마지막 큰 분화는 **946년(천년분화)** ── 화산 폭발지수(VEI) 7급의 거대 분화로 추정. 천지 칼데라호 (둘레 14km, 깊이 384m). **울릉도(약 73 ㎢)**: 경상북도 울릉군 ── 동해의 화산섬, 사화산. **공식 출처**: **molit.go.kr (국토부)**, **kma.go.kr (기상청 화산정보)**, **ngii.go.kr (국토지리정보원)**.'
  graceful_unknown: 제주도(약 1,849 ㎢)는 한반도 최대 섬, 광역시가 아니라 **제주특별자치도(2006년 7월 출범)** ── 산하에 행정시(제주시·서귀포시)가 있지만 자치시 아님. 한라산(1,947m)은 휴화산(분류상 활화산이라는 견해도 있으나 실제 활동 매우 드묾, 마지막 추정 분화 1007년)이며 남한 최고봉, 유네스코 트리플 등재. 백두산은 북·중 국경의 활화산. 정확한 지리 정보는 국토부 molit.go.kr 등에서 확인.
