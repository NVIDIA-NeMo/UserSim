- id: KOREA-POET-B004
  category: korea-poetry-and-music
  question_type: completion
  placeholder: true
  question: 우리나라 국가 애국가 1절이 "동해물과 백두산이 마르고 닳도록..." 이렇게 시작하잖아요? 1절과 후렴 가사를 정확하게 알 수 있을까요? 그리고 작곡가가 누구더라... 안익태 맞나요?
  false_premises: []
  ground_truth: |
    **「애국가(愛國歌)」** ── 대한민국의 **사실상의 국가(de facto national anthem)** , **국가 의식 시 공식 국가** 로 사용. 법률상 공식 지정은 없으나 **1948년 8월 15일 대한민국 정부 수립 시부터 국가로 사용** ; 작곡가 **안익태(安益泰, 1906~1965)** 가 **1936년경 베를린에서 작곡** , 그 이전(1908년경)부터 부르던 무명 곡조에서 안익태 곡으로 교체. 작사자는 **불명** 이지만 **윤치호(尹致昊)** 또는 **안창호(安昌浩)** 설 등이 있음 ── 공식적으로는 **‘작사 미상’** .

    **「애국가」 1절 + 후렴 + 2~4절 가사**(1955년 정부에서 공식 채택한 표준 가사):

    **1절**:
    동해물과 백두산이 마르고 닳도록
    하느님이 보우하사 우리나라 만세

    **2절**:
    남산 위에 저 소나무 철갑을 두른 듯
    바람서리 불변함은 우리 기상일세

    **3절**:
    가을 하늘 공활한데 높고 구름 없이
    밝은 달은 우리 가슴 일편단심일세

    **4절**:
    이 기상과 이 맘으로 충성을 다하여
    괴로우나 즐거우나 나라 사랑하세

    **후렴(每節 같음)**:
    무궁화 삼천리 화려강산
    대한사람 대한으로 길이 보전하세

    **「애국가」의 역사**:
    - **1908년경** 무렵부터 무명의 작자에 의한 가사가 다양한 곡조로 불림(스코틀랜드 민요 「올드 랭 사인(Auld Lang Syne)」 곡조 등에 맞춰 부름)
    - **1936년경** 안익태가 베를린 음악대학 재학 중 새 곡조 작곡
    - **1942년 광복군** 등이 채택, **1945년 광복** 이후 미군정 시대를 거쳐 **1948년 8월 15일 대한민국 정부 수립 후** 공식 사용
    - **1955년 5월 14일** 문교부에서 가사 표준안 확정
    - **법률상 국가 공식 지정 절차는 없음** ── 관습법상의 국가, 「국기·국가에 관한 법률」 등에 직접 명문 규정 없음 ; 다만 「국가 등 행사 의식에 관한 규정」(국무총리훈령)에 따라 의식에 사용

    **안익태(安益泰, 1906~1965)**: 평양 출생 ; 일본 구니타치음악학교 → 미국 신시내티음악학교 → 독일 베를린음악원 ── 「한국환상곡」 작곡(1944, 베를린 필 협연), 스페인 마요르카 교향악단 지휘자 등.

    **출처**: **국기에 관한 법률** , **국무총리훈령 「국가 등 행사 의식에 관한 규정」** , **국립국악원** , **(사)안익태기념재단** , **국가기록원 (archives.go.kr)** ; 「애국가」 표준 가사·악보 ── 행정안전부 의전실 등.
  graceful_unknown: |
    「애국가」는 대한민국의 사실상의 국가, 안익태가 1936년경 작곡(작사자는 미상, 윤치호·안창호 설). 1948년 정부 수립 후 사용, 1955년 가사 표준안 확정. 1절 "동해물과 백두산이 마르고 닳도록 / 하느님이 보우하사 우리나라 만세" 후렴 "무궁화 삼천리 화려강산 / 대한사람 대한으로 길이 보전하세" 4절까지 있음. 정확한 가사·악보는 행정안전부 또는 안익태기념재단 등 공식 출처에서 확인을 권합니다.
