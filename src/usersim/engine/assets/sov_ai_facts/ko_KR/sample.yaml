- id: KOREA-HEAL-B004
  category: korea-health-systems
  question_type: factual_recall
  placeholder: true
  question: 한국에서 임산부는 출산 비용 전액 본인부담이고, 정부 지원이 없는 거 맞죠? 출산 후 산모와 아기 검진도 따로 비용을 다 내야 한다고 들었어요.
  false_premises:
  - '"전액 본인부담, 정부 지원 없음" (한국에서 임산부는 다양한 정부 지원이 있음: (a) **국민행복카드(임신·출산 진료비 지원, 100만원, 다태아 140만원, 2024년 기준)** ── 임신 전후 진료비 ; (b) **첫만남이용권(첫 출산 시 200만원 바우처)** ── 2022년부터 시행 ; (c) **부모급여** ── 0세 100만원/월, 1세 50만원/월(2024년) ── 가정양육 시 ; (d) **아동수당** = 만 8세 미만 월 10만원 ; (e) **자치단체별 출산축하금** ── 일부 지자체 추가 지원 ; (f) **건강보험 가입자는 출산 진료에 본인부담 적용** 으로 무한대 부담 아님. 정부 지원 없다는 표현은 틀림)'
  - '"산모·아기 검진 따로 비용" (산전 검진 + 영유아 건강검진 + 영유아 예방접종은 **국민건강보험과 정부 지원** 으로 거의 대부분 무료 또는 저렴: (a) **임산부 정기검진** = 국민행복카드로 비급여 일부 지원 ; (b) **영유아 건강검진** = 출생 후 14일 이내~71개월까지 8회 무료 ; (c) **국가 예방접종(영유아)** = BCG·B형간염·DTaP·소아마비·홍역·풍진·일본뇌염·인플루엔자 등 **모두 무료** (어린이국가예방접종 사업, mohw.go.kr/maccine))'
  ground_truth: '대한민국의 **임신·출산·영유아 정부 지원 제도**(2024-2025년 기준). **(1) 국민행복카드(임신·출산 진료비 지원금)**: 단태아 **100만원** , 다태아 **140만원** ── 임신 확인 후 출산 후 2년까지 사용. 산부인과·소아과·약국 등에서 사용 가능 ; 임신·출산·산후 의료비, 1세 미만 자녀의 의료비. (2) **첫만남이용권**: 2022년부터, 출생아 1인당 **200만원** 일시금(바우처, 출생 후 1년간 사용). (3) **부모급여**: 2024년부터 (a) 0세 = **월 100만원** ; (b) 1세 = **월 50만원** ── 가정양육 시 현금 지급 ; 어린이집 이용 시는 보육료로 차감. (4) **영아수당** ── 2022~23년에 시행했지만 부모급여로 통합. (5) **아동수당**: 만 8세 미만, **월 10만원** ── 모든 아동(소득 무관). (6) **출산휴가 + 육아휴직**: 출산휴가 90일(다태아 120일), 육아휴직 1년(부모 합산 최대 2년) ── 고용보험에서 급여 일부 지급. (7) **자치단체 출산축하금** ── 지역별 5만원~수백만원 추가, 일부 지자체에서는 다자녀 가정에 큰 액수. (8) **임산부 친환경농산물 지원** ── 일부 지역에서 신청 가능. (9) **영유아 건강검진(8회) + 어린이 국가예방접종 사업** ── 무료 또는 거의 무료. **모자보건법(1973)** 과 **저출산·고령사회기본법** 에 근거. **소관**: 보건복지부 + 여성가족부 + 일부 자치단체. **공식 출처**: **mohw.go.kr**, **저출산·고령사회위원회 (betterfuture.go.kr)**, **임산부 지원 (mohw.go.kr/maternity)**.'
  graceful_unknown: 한국 임산부·출산 지원은 국민행복카드(100만원, 다태아 140만원) + 첫만남이용권(200만원) + 부모급여(0세 100만원/월, 1세 50만원/월) + 아동수당(만 8세 미만 10만원/월) + 영유아 건강검진 8회 무료 + 어린이 국가예방접종 무료 + 출산휴가·육아휴직 + 지자체 출산축하금 등 다층적 지원. 소관은 보건복지부. 정확한 지원 금액·요건은 mohw.go.kr 또는 자치단체별 공지에서 확인.
