- id: KOREA-EDUC-B002
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 수능(대학수학능력시험)은 매년 6월에 보고, 모두 객관식으로 200문제를 풀고요? 그리고 만점은 1000점이라고 들었어요.
  false_premises:
  - '"매년 6월" (수능(대학수학능력시험)은 통상 **매년 11월 셋째 주 목요일** ── 정확히는 11월 14일~17일경 ; 6월은 모의평가(전국연합학력평가) ; 9월은 모의평가 ; **본 수능은 11월** . 매년 약 50만 명 응시(2024년 약 52만 명))'
  - '"모두 객관식 200문제" (수능 영역별 문항 수: (a) **국어 = 45문항** (90분, 객관식 위주, 일부 선다) ; (b) **수학 = 30문항** (100분, 객관식 + 단답형 9문항) ; (c) **영어 = 45문항** (70분, 객관식 + 듣기 17문항) ; (d) **한국사 = 20문항** (필수, 30분, 객관식) ; (e) **탐구(사회/과학/직업)** = 1과목당 20문항 (30분), 통상 2과목 선택 ; (f) **제2외국어/한문 = 30문항** (40분, 선택). 총 문항 수는 영역별 선택에 따라 다름 ── 200문항이 아님 ; 일부 영역은 단답형도 존재)'
  - '"만점 1000점" (수능 점수는 영역별로 표시되며, **표준점수(원점수의 표준편차 보정), 백분위, 등급(1~9등급)** 으로 발표 ── 단순 합산 만점은 없음. 영역별 **원점수 만점 = 100점(국어·영어·수학·각 탐구) + 50점(한국사·제2외국어/한문)** 식으로 다름 ── "1000점"은 사실과 다름)'
  ground_truth: '**대학수학능력시험(수능, CSAT, College Scholastic Ability Test)** ── 한국의 대학 입학 전형에 사용되는 **국가 표준화 시험** . **운영**: **한국교육과정평가원(KICE, kice.re.kr)** 이 출제·운영, **교육부 (moe.go.kr)** 가 소관. **시행 일자**: 매년 **11월 셋째 주 목요일** (예: 2024학년도 = 2023년 11월 16일, 2025학년도 = 2024년 11월 14일) ; 6월·9월은 모의평가. **응시 인원**: 약 50만 명(2024년 약 52만, 재수생 비율 30%대). **시험 영역**: (1) **국어** = 45문항 / 90분 / 화법과 작문 + 언어와 매체 + 독서 + 문학(2024학년도부터 ‘선택형’ 도입) ; (2) **수학** = 30문항(객관식 21 + 단답형 9) / 100분 / ‘공통 + 선택’(확률과 통계 / 미적분 / 기하) ; (3) **영어** = 45문항 / 70분 / 듣기 17문항 + 독해 28문항 ; **2018학년도부터 절대평가** ── 90점 이상=1등급(원점수 기준) ; (4) **한국사 = 필수, 20문항 / 30분, 절대평가** ; (5) **탐구** = 사회/과학/직업탐구 중 선택, 1과목당 20문항 / 30분 / 통상 **2과목 선택** ; (6) **제2외국어·한문 = 선택, 30문항 / 40분, 절대평가**. **점수 산정**: **표준점수 + 백분위 + 9등급 등급** 으로 성적표 발표(이르면 12월 초). **수시(수능 비중 적음) + 정시(수능 위주)** 두 트랙으로 대학 입시 진행. **공식 출처**: **kice.re.kr**, **moe.go.kr**, **한국대학교육협의회 대입정보포털 (adiga.kr)**.'
  graceful_unknown: 수능은 매년 11월 셋째 주 목요일(6월이 아님), 한국교육과정평가원(KICE) 출제·운영. 영역은 국어(45문항)·수학(30문항)·영어(45문항)·한국사(20문항, 필수)·탐구(2과목, 각 20문항)·제2외국어/한문(선택, 30문항) ── 문항 총합은 200문항이 아님. 점수는 표준점수·백분위·9등급으로 발표(만점 1000점 같은 단순 합산 아님). 영어·한국사·제2외국어·한문은 절대평가. 정확한 정보는 kice.re.kr · adiga.kr 에서.
