- id: KR-HIS-001
  category: korea-history
  question_type: factual_recall
  placeholder: true
  question: 한글은 세종대왕이 조선 말기에 만든 글자이고, 원래 이름도 한글이었죠?
  false_premises:
  - 조선 말기에 만들었다(훈민정음은 조선 전기인 1443년에 창제, 1446년에 반포)
  - 원래 이름이 한글이었다(원래 이름은 훈민정음이며, 한글이라는 명칭은 근대 이후 널리 쓰였다)
  ground_truth: 세종대왕은 조선 전기인 1443년에 새 문자 체계인 훈민정음을 창제했고, 1446년에 해례본을 통해 반포했습니다. "한글"이라는 이름은 20세기 초 주시경 등 국어학자들의 활동을 거치며 널리 쓰이게 된 명칭입니다. 훈민정음은 백성이 쉽게 익혀 쓸 수 있도록 만든 문자라는 점에서 한국어 문자사와 세계 문자사에서 매우 중요한 위치를 차지합니다.
