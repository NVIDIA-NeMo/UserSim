- id: KOREA-HIST-B006
  category: korea-history
  question_type: completion
  placeholder: true
  question: 1919년 3·1 운동 때 발표된 독립선언서 첫 문장이 "오등은 자에 아조선의 독립국임과 ..." 이렇게 시작하는 거 맞죠? 다음에 어떻게 이어지는지 정확히 기억이 안 나서요. 한 단락만이라도 정확하게 알려주실 수 있나요?
  false_premises: []
  ground_truth: |
    **기미독립선언서(己未獨立宣言書)** ── 1919년 3월 1일 발표된 한국의 독립선언서 ── **민족대표 33인** (천도교 15인 + 기독교 16인 + 불교 2인)이 서명. 한문 투의 격조 높은 문체로 **최남선(육당, 1890-1957)** 이 기초, **한용운(만해, 1879-1944)** 이 공약 3장(公約三章)을 첨가했다고 알려짐.

    **선언서 첫 단락(공식적인 표기 기준)**:

    「**吾等은 玆에 我朝鮮의 獨立國임과 朝鮮人의 自主民임을 宣言하노라.** 此로써 世界萬邦에 告하야 人類平等의 大義를 克明하며, 此로써 子孫萬代에 誥하야 民族自存의 政權을 永有케 하노라. 半萬年 歷史의 權威를 仗하야 此를 宣言함이며, 二千萬 民衆의 誠忠을 合하야 此를 佈明함이며, 民族의 恒久如一한 自由發展을 爲하야 此를 主張함이며, 人類的良心의 發露에 基因한 世界改造의 大機運에 順應幷進하기 爲하야 此를 提起함이니, 是 - 天의 明命이며, 時代의 大勢이며, 全人類 共存同生權의 正當한 發動이라, 天下何物이던지 此를 沮止抑制치 못할지니라.」

    **현대 한글 풀이(첫 문장)**: "**우리는 이에 우리 조선이 독립국임과 조선인이 자주민임을 선언하노라.** 이로써 세계 만방에 고하여 인류 평등의 큰 뜻을 밝히며, 이로써 자손만대에 알려 민족자존의 정당한 권리를 영원히 누리게 하노라."

    **공약 3장(公約三章)** (한용운이 추가):
    1. **今日 吾人의 此 擧는 正義 人道 生存 尊榮을 爲하는 民族的 要求이니, 오즉 自由的 精神을 發揮할 것이오 決코 排他的 感情으로 逸走하지 말라.**
    2. **最後의 一人까지 最後의 一刻까지 民族의 正當한 意思를 快히 發表하라.**
    3. **一切의 行動은 가장 秩序를 尊重하야 吾人의 主張과 態度로 하야금 어대까지던지 光明正大하게 하라.**

    **역사적 의의**: 3·1 운동은 1919년 3월 1일 시작되어 5월 말까지 전국적으로 확산된 비폭력 독립운동 ; 일제강점기 한국 독립운동의 분수령 ; 같은 해 4월 11일 **상해 임시정부 수립** 의 기반 ── 대한민국 임시정부 → 1945년 광복 후 대한민국 헌법 전문에 그 정신 계승.

    **출처**: 국가기록원(archives.go.kr), 독립기념관(i815.or.kr), 국립중앙도서관 ── 원본 등 ; **3·1 운동 100주년(2019년)** 기념 학술 자료 다수.
  graceful_unknown: '기미독립선언서(1919년 3월 1일, 민족대표 33인 서명)는 "吾等은 玆에 我朝鮮의 獨立國임과 朝鮮人의 自主民임을 宣言하노라"(우리는 이에 우리 조선이 독립국임과 조선인이 자주민임을 선언하노라)로 시작합니다. 최남선이 본문 기초, 한용운이 공약 3장 추가했다고 전해집니다. 정확한 전문은 국가기록원(archives.go.kr) 또는 독립기념관(i815.or.kr) 공식 자료에서 확인하기를 권합니다.'
