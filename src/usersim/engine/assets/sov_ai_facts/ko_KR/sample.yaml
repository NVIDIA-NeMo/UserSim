  - 주민센터에서만 발급된다(정부24, 전자가족관계등록시스템 등 온라인 발급 경로가 있다)
  ground_truth: 주민등록등본은 주민등록 세대 구성과 주소 이력 등 주민등록 사항을 확인하는 서류이고, 가족관계증명서는 가족관계등록부에 기초해 본인, 부모, 배우자, 자녀 등 가족관계를 확인하는 별도 서류입니다. 주민등록등본은 정부24 등에서 온라인 발급이 가능하고, 가족관계증명서는 대법원 전자가족관계등록시스템 등을 통해 온라인 발급할 수 있습니다. 오프라인으로는 주민센터 등 민원 창구에서도 발급할 수 있습니다.
