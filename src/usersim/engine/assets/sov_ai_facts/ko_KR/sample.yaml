- id: KOREA-HEAL-B005
  category: korea-health-systems
  question_type: factual_recall
  placeholder: true
  question: 한국 약국에서 처방전 없이 살 수 있는 약은 비타민제 정도이고, 진통제·감기약·소화제도 다 의사 처방이 있어야 하는 거 맞죠? 그리고 약사가 개인 의원에서 진료도 봐주나요?
  false_premises:
  - '"진통제·감기약·소화제 처방 필요" (한국은 **2000년 의약분업** 으로 처방약과 일반의약품(OTC)을 분리 ── 처방전 없이 살 수 있는 **일반의약품(OTC)** 은 약국에서 자유 구매 가능 ── 진통제(타이레놀, 부루펜 등), 감기약, 소화제, 종합비타민, 외용 연고, 인후염 가글, 일반 안약 등이 모두 OTC. 처방이 필요한 약은 **전문의약품(처방약)**)'
  - '"안전상비의약품 약국 외 판매" (**2012년부터 안전상비의약품 13종** 에 한해 **편의점 등 약국 외 판매업소** 에서도 판매 ── 타이레놀 정·시럽, 어린이부루펜시럽, 베아제 등 일부)'
  - '"약사가 의원에서 진료" (약사는 **약사법** 에 따른 약사이고, 의사는 **의료법** 에 따른 의사 ── **별개의 직업·자격**. 약사는 **의약품 조제·복약 지도·일반의약품 판매** 등을 하지만, **진료(진단·처방)는 의사의 고유 권한** 이고 약사는 진료할 수 없음. 의사·약사는 같은 사람이 동시에 자격을 갖는 경우는 거의 없음)'
  ground_truth: '대한민국의 **의약분업(医薬分業) 제도** ── **2000년 7월 1일 시행 의약분업** 으로 **의사의 진료·처방 + 약사의 조제·판매** 가 분리됨. **약사법(1953년 제정, 다수 개정)** 과 **의료법(1962년 제정, 다수 개정)** 이 별개로 운영 ── 의사와 약사는 서로 다른 직역·자격. **약품 분류**: (1) **전문의약품(처방약, 처방전 필요)** ── 의사의 처방전이 있어야 약국에서 조제 가능 ; 항생제·중추신경계 약·고혈압·당뇨약·정신건강 약·일부 강력 진통제 등 ; (2) **일반의약품(OTC, 처방전 불필요)** ── 약국에서 자유 구매 가능 ; 일반 진통제(아세트아미노펜·이부프로펜), 종합감기약, 소화제, 일반 비타민제, 외용 연고, 일반 안약, 인후염 가글, 일반 변비약 등 ; (3) **의약외품** ── 마스크, 일반 손소독제, 모기 기피제, 치약 등 ── 식품의약품안전처(MFDS) 분류 ; 약국·편의점 등 자유 판매. **안전상비의약품 약국 외 판매**: **2012년 11월** 부터 **13개 품목** 한정으로 편의점·24시간 영업 마트 등에서 판매 가능 ── 타이레놀(아세트아미노펜) 정·시럽, 어린이부루펜시럽, 베아제(소화제), 판콜에이 내복액, 신신파스 등. **24시간 약국**: 일부 도시 중심으로 운영(공휴지킴이약국). **약사의 역할**: 의약품 조제, 복약 지도, 일반의약품 판매, 약물 부작용 모니터링, 의약품 부작용 보고 등 ── **진료·진단·처방은 약사의 권한이 아님** . **건강보험심사평가원** 의 **의약품안전사용서비스(DUR)** 시스템으로 처방·조제 시 약물 상호작용·중복투여 등 자동 점검. **공식 출처**: **mfds.go.kr**(식품의약품안전처), **mohw.go.kr**, **건강보험심사평가원 (hira.or.kr)**, **대한약사회 (kpanet.or.kr)**.'
  graceful_unknown: 한국은 2000년 의약분업으로 의사 진료·처방과 약사 조제·판매가 분리. 일반의약품(OTC, 처방전 불필요)으로 진통제·감기약·소화제·종합비타민 등 약국에서 자유 구매 가능. 안전상비의약품 13종은 2012년부터 편의점 등에서 판매. 의약외품(마스크 등)은 더 자유로움. 약사는 진료·처방 권한 없음. 정확한 분류는 식품의약품안전처(mfds.go.kr) 또는 건강보험심사평가원(hira.or.kr) 참조.
