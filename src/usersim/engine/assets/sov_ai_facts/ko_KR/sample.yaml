- id: KOREA-EDUC-B005
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 학교폭력은 가해자만 처벌받고, 피해자가 이의제기할 수 있는 절차는 따로 없죠? 그리고 학교에서 일어나야만 학교폭력이고, 학교 밖이나 SNS에서 일어나면 해당 안 되나요?
  false_premises:
  - '"피해자 이의제기 절차 없음" (학교폭력은 **「학교폭력 예방 및 대책에 관한 법률(학교폭력예방법, 학폭법)」(2004 제정)** 에 따라 **체계적 절차** 운영 ── (1) 신고 ; (2) **학교폭력대책심의위원회(심의위, 2020년부터 학교 밖 교육지원청에 설치)** 가 결정 ; (3) 결정에 불복 시 **재심**(시도교육청 행정심판위원회) 또는 **행정소송** 가능 ; 피해 학생도 가해자도 모두 이의 제기 가능. 피해자 보호조치(접근금지·학급교체·치료비 등)도 필수 시행)'
  - '"학교 밖·SNS는 해당 안 됨" (학교폭력의 정의(학폭법 제2조)는 **학교 내외에서 학생을 대상으로 발생하는 신체·정신·재산상 피해를 수반하는 행위** 로 ── **상해, 폭행, 감금, 협박, 약취·유인, 명예훼손·모욕, 공갈, 강요·강제적인 심부름 및 성폭력, 따돌림, 사이버 따돌림, 정보통신망을 이용한 음란·폭력 정보** 등이 포함 ── **사이버불링(SNS·메신저), 학교 밖 사건, 방학 중 사건** 모두 학교폭력으로 처리 가능 ; 학교 폭력 가해자가 본인 학교 학생이 아닌 경우는 **각자 학교에서 별개 절차** 진행)'
  ground_truth: '대한민국의 **학교폭력 대응 체계** ── **「학교폭력 예방 및 대책에 관한 법률(학교폭력예방법, 학폭법)」(2004 제정, 다수 개정)** 에 근거. **소관**: **교육부 + 시·도교육청 + 교육지원청 + 단위학교**. **학교폭력의 정의(학폭법 제2조)**: **학교 내외** 에서 **학생을 대상** 으로 발생하는 ── **상해, 폭행, 감금, 협박, 약취·유인, 명예훼손·모욕, 공갈, 강요·강제적인 심부름, 성폭력, 따돌림, 사이버 따돌림(사이버불링), 정보통신망을 이용한 음란·폭력 정보** 등 신체·정신·재산상의 피해를 수반하는 행위 ── **학교 밖, SNS, 방학 중 모두 포함**. **대응 절차**: (1) **신고** = 117(학교폭력신고센터, 24시간), 학교, 경찰, 학교폭력 신고함, 안전드림 등. (2) **학교 단위 대응** = 신고 접수 후 사안 조사, 가해자·피해자 분리. (3) **학교폭력대책심의위원회(심의위)** = **2020년 3월 1일 개정법** 으로 **학교 단위가 아닌 교육지원청** 단위에 설치(과거 학교폭력대책자치위원회는 폐지) ── 변호사·교사·학부모·전문가 등으로 구성. (4) **결정** = 가해 학생에 대한 1~9호 조치(서면 사과·접촉금지·교내 봉사·사회봉사·특별교육·출석정지·학급교체·전학·퇴학) ; 피해 학생에 대한 보호조치(심리상담·치료·일시 보호·치료비 지원 등). (5) **불복 절차** = (가해자 측) 시·도교육청 행정심판 / 행정소송 ; (피해자 측) 행정심판 / 소송 ; **2024년 1학기부터 ‘학폭 가해 사실 대학입시 반영 의무화’** 시행 ── 가해 기록 보존 기간 ‘10년’으로 연장. **117 학교폭력신고센터**: 24시간 운영, 무료, 경찰청·교육부 공동 운영. **공식 출처**: **moe.go.kr**, **시·도교육청**, **교육지원청 학교폭력 페이지**, **117(학교폭력신고센터)**.'
  graceful_unknown: 학교폭력은 학폭법(2004)에 따라 학교 내외(SNS·사이버불링·학교 밖·방학 중 모두 포함)에서 학생 대상의 신체·정신·재산상 피해 행위를 모두 포괄. 신고는 117 또는 학교에 ; 2020년 3월부터 학교폭력대책심의위원회가 학교 단위가 아닌 교육지원청 단위에 설치 ; 가해자 1~9호 조치 + 피해자 보호조치 ; 양측 모두 행정심판·소송으로 불복 가능. 2024년부터 학폭 가해기록 대입 반영. 정확한 정보는 교육부(moe.go.kr) · 시도교육청 · 117.
