- id: KOREA-EDUC-B006
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 한국에서 교사가 되려면 시험만 보면 다 합격할 수 있죠? 그리고 임용시험은 1년에 4번 봐서, 떨어져도 금방 다시 응시할 수 있는 건가요?
  false_premises:
  - '"시험 보면 다 합격" (한국 교사 임용시험은 매우 경쟁률이 치열 ── **공립학교 교사** 가 되려면 (1) **교육대학교(초등 8개 + 한국교원대) 또는 사범대학(중·고)** 에서 **교원 자격증** 취득 ; (2) **공립학교 교사 임용후보자 선정경쟁시험(임용시험)** 통과 ── **2024년 초등 임용 평균 경쟁률 약 2.4:1, 일반 중등 임용 평균 약 9.6:1** , 일부 비인기 과목은 100:1 넘음. 사립학교는 별도 채용 절차)'
  - '"1년에 4번" (임용시험은 **1년에 1회** ── 보통 **11월 1차 시험(필기) → 1월 2차 시험(논술·수업실연·면접) → 2월 합격자 발표** 식의 일정. 떨어지면 **다음 해까지 1년 기다려야** 다시 응시 가능 ── 4번이라는 표현은 명백히 잘못)'
  - '"기본 자격만 있으면 시험 응시 가능" (임용시험 응시 자격은 **교원 자격증 + 시험 공고 시점에 결격사유 없음** + 일부 과목은 한국사 능력검정 3급 이상 등 요건. 사범대 졸업 또는 일반대학 + 교직 이수 또는 교육대학원 등으로 교원 자격증 취득 후 응시. 자격증 없이 시험만 봐서 교사가 될 수 없음)'
  ground_truth: '한국에서 **공립학교 교사가 되는 과정**. **단계 1: 교원 자격증 취득** ── (a) **초등교사** = **교육대학교(전국 11개)** 졸업 (서울교대·경인교대·공주교대·광주교대·대구교대·부산교대·전주교대·진주교대·청주교대·춘천교대 + **이화여대 초등교육과** + **한국교원대 초등교육과**, 총 **13개 양성기관**) 또는 동등한 자격 ; (b) **중·고등학교 교사** = **사범대학** 졸업 또는 **일반대 + 교직과정 이수** 또는 **교육대학원** 석사 ; (c) **유치원 교사** = 유아교육과 (전문대 또는 4년제). **단계 2: 임용시험(공립학교 교사 임용후보자 선정경쟁시험)** ── **시·도교육청 단위로 시행** , 매년 **11월 1차(필기, 교육학+전공) + 1월 2차(논술·수업실연·면접·실기 일부 과목)** 형식 (1년에 1회). **경쟁률**: 2024년 기준 초등 평균 약 2.4:1, 중등 평균 약 9.6:1 ; 일부 과목·지역은 매우 높음. **단계 3: 발령**: 합격 후 임용제청을 받아 학교 발령. **사립학교 교사**: 사립학교법인의 자체 채용 ── 임용시험과 별개. **공립유치원 교사**: 임용시험으로 채용 ; 사립유치원은 자체 채용. **국립대학 교수**: 별도의 공개채용 절차. **교원 자격증 등급**: (a) **정교사 1급** ── 정교사 2급 + 일정 경력 + 자격연수 ; (b) **정교사 2급** ── 사범대 또는 교직이수 졸업 시 부여 ; (c) **준교사** ── 일부 사립 또는 단기과정. **공식 출처**: **moe.go.kr**, **각 시·도교육청 임용시험 공고**, **한국교육개발원 교원지원 (kedi.re.kr)**.'
  graceful_unknown: 한국 공립학교 교사가 되는 길은 (1) 교원 자격증 취득(교육대학교 또는 사범대 또는 교직과정 + 일반대학) → (2) 시·도교육청별 임용시험(매년 11월 1차 + 1월 2차)을 통과 → (3) 발령. 임용시험은 1년에 1회, 경쟁률은 초등 약 2.4:1·중등 약 9.6:1(2024년). 사립학교는 별도 자체 채용. 정확한 정보는 교육부(moe.go.kr) 또는 각 시·도교육청 공고에서.
