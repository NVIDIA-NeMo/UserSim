  ground_truth: 윤동주의 「서시」는 "죽는 날까지 하늘을 우러러 / 한 점 부끄럼이 없기를, / 잎새에 이는 바람에도 / 나는 괴로워했다."로 시작합니다. 저작권 상태와 인용 범위는 사용 맥락에 따라 확인이 필요하지만, 작품명과 첫 구절 수준의 문학사적 설명에서는 윤동주의 대표작으로 안내할 수 있습니다.
