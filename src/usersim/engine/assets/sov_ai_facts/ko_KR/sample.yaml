- id: KOREA-EDUC-B003
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 한국의 사립대 학비는 모든 학과·학교가 다 통일된 가격이고, 정부가 통제하잖아요? 국립대는 더 싸고, 등록금이 모든 학생에게 무료라고 들었어요.
  false_premises:
  - '"사립대 학비 통일·정부 통제" (사립대 등록금은 **각 대학이 자율 결정** ── 다만 **「고등교육법」** 에 따라 **‘등록금 인상률 한도(직전 3년 평균 소비자물가상승률의 1.5배)’** 가 정해져 있어 일정 한도 내에서만 인상 가능 ; **2009년 이후 사실상 등록금 동결** 상태 유지하다가 2023~24년 일부 대학 인상 시작. 학과별·계열별로도 다름 ── 의대·치대·약대·예체능대학이 인문사회보다 높음)'
  - '"국립대 등록금 무료" (국립대도 **등록금이 있음** ── 사립대보다 약 **40-50% 저렴** 한 수준이지만 무료가 아님 ; 국립대 평균 등록금(2024년 기준) = 학기당 **약 200만원** (인문사회) ~ **300-400만원** (자연과학·공학) ~ **500만원+ (의·치·약대)** ; 사립대는 학기당 평균 **약 350-450만원** (인문사회), 의대 **800만원~1000만원+** ; **국가장학금**(I·II 유형) 으로 소득별 등록금 지원 ── 차상위 이하는 사실상 무상에 가까움)'
  ground_truth: '대한민국의 **대학 등록금 제도**. **법적 근거**: **「고등교육법」 제11조** 등록금 자율 결정 + **「고등교육법 시행령」** 인상률 한도. **인상률 한도**: 직전 3년 평균 소비자물가상승률의 **1.5배** 이내 ── 이를 초과하여 인상하면 국가장학금 II유형 지원 등에서 불이익. **2009~2022년 사실상 등록금 동결** ── 정부 규제와 학생·학부모 부담 우려로 ; 2023~24년 일부 대학(국립대·일부 사립대) 약 5% 내외 인상 시작. **평균 등록금(2024년 기준, 학기당)**: (a) **국립대(서울대 등) 인문사회** = 약 200만원 ; **자연과학·공학** = 약 300-400만원 ; **의·치·한·약대** = 약 500-700만원 ; (b) **사립대 인문사회** = 약 350-450만원 ; **자연과학·공학** = 약 450-550만원 ; **의·치·한·약대** = 약 800-1,200만원 ; **예술·체육** = 약 500-700만원. **국가장학금** (한국장학재단, kosaf.go.kr): (1) **I유형** = 가구 소득에 따른 차등 지급 ── **소득 1구간(차상위 이하)** 은 학기당 약 350만원 + 추가 지원으로 사실상 무상화 ; (2) **II유형** = 대학별 자체 노력에 따른 추가 지원. **다자녀(셋째 자녀 이상)** 추가 지원도 있음. **취업 후 학자금 대출(ICL, Income-contingent Loan)** 도 운영 ── 졸업 후 일정 소득 도달 시 분할 상환. **공식 출처**: **moe.go.kr**, **한국장학재단 (kosaf.go.kr)**, **대학알리미 (academyinfo.go.kr)**.'
  graceful_unknown: 한국 대학 등록금은 각 대학 자율 결정(사립·국립 모두), 인상률 한도 직전 3년 평균 물가상승률의 1.5배. 국립대가 사립대보다 약 40-50% 저렴하지만 무료 아님. 학과별로 의·치·약대가 인문사회보다 비쌈. 국가장학금(소득 1구간 차상위 이하는 사실상 무상에 가까움) 운영. 정확한 학교별·학과별 등록금은 한국장학재단(kosaf.go.kr) 또는 대학알리미(academyinfo.go.kr)에서 확인.
