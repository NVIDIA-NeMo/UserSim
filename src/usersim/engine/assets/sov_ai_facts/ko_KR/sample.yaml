- id: KOREA-POET-B005
  category: korea-poetry-and-music
  question_type: completion
  placeholder: true
  question: '한용운의 "님의 침묵" 첫 연이 "님은 갔습니다. 아아, 사랑하는 나의 님은 갔습니다..." 이렇게 시작하는 것 같은데, 정확한 1연 텍스트를 좀 알 수 있을까요? 또 시집은 1925년에 나온 것 맞죠?'
  false_premises: []
  ground_truth: |
    **한용운(韓龍雲, 1879~1944, 호는 만해(萬海·卍海))** 의 대표시집 **『님의 침묵』** 의 표제시 ── **1926년 5월 20일 회동서관(匯東書館)** 출간(1925년이 아님), 88편의 시를 수록. 일제강점기에 발표된 한국 현대시의 정전.

    **「님의 침묵」 1연 + 시 전체 핵심 부분**:

    님은 갔습니다. 아아, 사랑하는 나의 님은 갔습니다.
    푸른 산빛을 깨치고 단풍나무 숲을 향하여 난 작은 길을 걸어서, 차마 떨치고 갔습니다.
    황금의 꽃같이 굳고 빛나던 옛 맹세는 차디찬 티끌이 되어서, 한숨의 미풍에 날아갔습니다.
    날카로운 첫 키스의 추억은 나의 운명의 지침을 돌려놓고, 뒷걸음쳐서 사라졌습니다.
    나는 향기로운 님의 말소리에 귀먹고, 꽃다운 님의 얼굴에 눈멀었습니다.

    사랑도 사람의 일이라, 만날 때에 미리 떠날 것을 염려하고 경계하지 아니한 것은 아니지만, 이별은 뜻밖의 일이 되고 놀란 가슴은 새로운 슬픔에 터집니다.
    그러나 이별을 쓸데없는 눈물의 원천을 만들고 마는 것은 스스로 사랑을 깨치는 것인 줄 아는 까닭에, 걷잡을 수 없는 슬픔의 힘을 옮겨서 새 희망의 정수박이에 들이부었습니다.
    우리는 만날 때에 떠날 것을 염려하는 것과 같이, 떠날 때에 다시 만날 것을 믿습니다.

    아아, 님은 갔지마는 나는 님을 보내지 아니하였습니다.
    제 곡조를 못 이기는 사랑의 노래는 님의 침묵을 휩싸고 돕니다.

    **시 분석**:
    - **형식**: 산문시(자유시), 10행
    - **수미상관(首尾相關)** 와 **역설(逆說)** 적 마무리 ── “님은 갔지마는 나는 님을 보내지 아니하였습니다”
    - **‘님’의 다층적 의미**: 사랑하는 사람, 잃어버린 조국(일제강점기), 부처(불자로서의 깨달음), 진리·이상 등 여러 해석 가능
    - **주제**: 이별의 슬픔과 그 슬픔을 새로운 희망으로 승화 ── 불교의 윤회·재회 관념과 결합

    **한용운(1879~1944)**: 충남 홍성 출생, **승려·시인·독립운동가** ── **3·1 운동 민족대표 33인 중 한 사람**(불교계 대표) ; 호는 만해(萬海) ; **1926년 시집 『님의 침묵』** 발간 ; 다수의 불교 저술(『조선불교유신론』(1913), 『불교대전』(1914) 등) ; 평생 변절하지 않은 절개로 유명 ; 1944년 6월 29일 서울 성북동 심우장(尋牛莊)에서 입적(만 65세).

    **출처**: 시집 『님의 침묵』(회동서관, 1926); 만해 전집(여러 출판사); **만해문학관**(강원도 인제군), **심우장**(서울 성북구).
  graceful_unknown: |
    한용운의 「님의 침묵」은 1926년 5월 20일 회동서관 시집 『님의 침묵』(1925년 아님) 표제시. "님은 갔습니다. 아아, 사랑하는 나의 님은 갔습니다." 로 시작하는 산문시이며, "님은 갔지마는 나는 님을 보내지 아니하였습니다" 로 역설적으로 마무리됩니다. ‘님’은 연인·조국·부처·진리 등 다층적으로 해석. 작자 만해 한용운(1879~1944)은 3·1 운동 민족대표 33인 중 1인. 정확한 텍스트는 만해문학관 또는 만해 전집에서 확인을 권합니다.
