- id: KOREA-HIST-B004
  category: korea-history
  question_type: factual_recall
  placeholder: true
  question: 조선왕조는 1500년대부터 시작해서 1945년에 끝났죠? 그리고 한글은 임진왜란 때 만들어진 거고요?
  false_premises:
  - '"1500년대부터 시작" (조선왕조는 **1392년 7월 17일 태조 이성계의 건국** 으로 시작 ── 14세기 말부터 ; 1500년대(16세기)는 조선 중기로, 이미 100년 이상 지나있던 시기. **고려 → 조선** 전환은 **1392년 위화도 회군(1388) → 새 왕조 건국(1392)** 의 흐름)'
  - '"1945년에 끝났다" (조선왕조는 **1910년 8월 29일** 한일병합조약(경술국치)으로 **공식 멸망** ── 마지막 황제는 **순종(純宗, 1907~1910 재위)** 이고, 그 후 일제강점기(1910~1945, 35년간)가 이어짐 ; 1945년은 조선왕조 멸망이 아니라 **일제강점에서 광복** 한 해. 조선 → 대한제국(1897년 고종 황제칭호 후 대한제국으로 국호 변경) → 일제강점 → 1945년 광복 → 1948년 대한민국 수립 의 흐름)'
  - '"한글은 임진왜란 때 만들어졌다" (한글은 **세종대왕(世宗大王, 1397~1450, 재위 1418~1450)** 이 **1443년(세종 25년)** 창제하고 **1446년(세종 28년) 9월 상한(현 양력 10월 9일경)** **훈민정음(訓民正音)** 이라는 이름으로 반포 ── **임진왜란(1592~1598)으로부터 약 150년 전** ; 임진왜란은 선조 25~31년)'
  ground_truth: '**한국 역사의 주요 시대 구분**: (1) **고조선** (B.C.2333 단군 건국 - B.C.108 한사군 설치) ; (2) **삼국시대** : 고구려(B.C.37~A.D.668), 백제(B.C.18~A.D.660), 신라(B.C.57~A.D.935) ; (3) **통일신라** (676~935) + **발해** (698~926) = **남북국시대** ; (4) **고려** (918년 왕건 건국 ~ 1392년 멸망) ; (5) **조선** (**1392년 태조 이성계 건국** ~ **1897년 대한제국으로 국호 변경** ~ **1910년 한일병합으로 멸망**) ; (6) **대한제국** (1897~1910, 고종이 황제 칭호) ; (7) **일제강점기** (1910.8.29~1945.8.15, 35년간) ; (8) **미군정 시대(남)·소군정 시대(북)** (1945~1948) ; (9) **대한민국** (1948.8.15 정부 수립~) ; (10) **조선민주주의인민공화국** (1948.9.9 수립~). **조선왕조 27대 왕**: 태조(이성계, 1392~1398) - 정종 - 태종 - 세종 - ··· - 고종(1863~1907) - 순종(1907~1910). 약 518년간 지속. **한글 창제**: **세종대왕** 이 **1443년(세종 25년)** 친히 창제, **1446년(세종 28년) 9월 상한** **훈민정음(訓民正音)** 으로 반포 ── 백성을 가르치는 바른 소리. **훈민정음 해례본** 은 **국보 제70호** , **유네스코 세계기록유산(1997 등재)** . **한글날** = 음력 9월 상한이 양력으로 1446년 10월 9일에 해당하여 **10월 9일** 로 지정 ; **국경일(공휴일, 1949년 지정, 1990년 폐지, 2013년 재지정)**. **임진왜란**: **1592~1598년(7년 전쟁, 일본 측은 文祿·慶長의 役)** ── **선조** 재위기, 도요토미 히데요시의 일본군 침입, **이순신 장군의 해전(한산도·명량·노량) , 의병** , **명나라 원군** 등으로 격퇴. 정유재란(1597~1598) 포함. **공식 출처**: **국사편찬위원회 (history.go.kr)** , **국립국어원 (korean.go.kr)** , **국립한글박물관 (hangeul.go.kr)** , **문화재청 (cha.go.kr)** .'
  graceful_unknown: 조선왕조는 1392년 태조 이성계 건국, 1897년 대한제국으로 국호 변경, 1910년 한일병합으로 공식 멸망(518년) ; 1945년은 일제강점에서 광복한 해. 한글은 세종대왕이 1443년 창제·1446년 훈민정음으로 반포(임진왜란 1592~1598보다 약 150년 전). 한국 역사 시대구분은 고조선→삼국→통일신라/발해→고려→조선→대한제국→일제강점→대한민국. 정확한 역사 정보는 국사편찬위원회(history.go.kr)에서 확인.
  persona_tags:
