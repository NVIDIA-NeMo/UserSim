- id: KOREA-POET-B006
  category: korea-poetry-and-music
  question_type: completion
  placeholder: true
  question: 정지용의 "향수"가 "넓은 벌 동쪽 끝으로 옛이야기 지줄대는 실개천이 휘돌아 나가고..." 이렇게 시작하잖아요? 후렴구는 "그 곳이 차마 꿈엔들 잊힐리야" 였던 것 같은데... 시 전체 흐름을 좀 알 수 있을까요?
  false_premises: []
  ground_truth: |
    **정지용(鄭芝溶, 1902~1950)** 의 대표작 **「향수(鄕愁)」** ── **1927년 3월** 잡지 **『조선지광(朝鮮之光)』 65호** 에 처음 발표 ; **1935년 시문학사** 에서 첫 시집 **『정지용 시집』** 에 수록. **1989년 가수 이동원·박인수의 듀엣 곡** 으로 더 널리 알려져 국민애송시의 위치 ── 이동원(대중)·박인수(테너)의 합창 형식의 노래.

    **「향수」 전문 (5연)**:

    넓은 벌 동쪽 끝으로
    옛이야기 지줄대는 실개천이 휘돌아 나가고,
    얼룩백이 황소가
    해설피 금빛 게으른 울음을 우는 곳,

    ── 그 곳이 차마 꿈엔들 잊힐리야.

    질화로에 재가 식어지면
    뷔인 밭에 밤바람 소리 말을 달리고,
    엷은 졸음에 겨운 늙으신 아버지가
    짚베개를 돋아 고이시는 곳,

    ── 그 곳이 차마 꿈엔들 잊힐리야.

    흙에서 자란 내 마음
    파아란 하늘빛이 그리워
    함부로 쏜 화살을 찾으러
    풀섶 이슬에 함추름 휘적시던 곳,

    ── 그 곳이 차마 꿈엔들 잊힐리야.

    전설(傳說) 바다에 춤추는 밤물결 같은
    검은 귀밑머리 날리는 어린 누이와
    아무러치도 않고 여쁠 것도 없는
    사철 발벗은 안해가
    따가운 햇살을 등에 지고 이삭 줍던 곳,

    ── 그 곳이 차마 꿈엔들 잊힐리야.

    하늘에는 성근 별
    알 수도 없는 모래성으로 발을 옮기고,
    서리 까마귀 우지짖고 지나가는 초라한 지붕,
    흐릿한 불빛에 돌아 앉아 도란도란거리는 곳,

    ── 그 곳이 차마 꿈엔들 잊힐리야.

    **시 분석**:
    - **형식**: 5연 + 후렴(refrain) "그 곳이 차마 꿈엔들 잊힐리야" 가 매 연 후에 반복
    - **모티프**: 충북 옥천(작자 고향) 농촌 마을의 향토적 풍경 ── 실개천, 황소, 질화로, 늙은 아버지, 누이, 아내, 별, 까마귀, 초라한 지붕 등
    - **주제**: 잊을 수 없는 고향에 대한 향수와 그리움
    - **언어**: 토속어와 의성어·의태어의 조화("지줄대는", "해설피", "함추름", "도란도란")

    **정지용(1902~1950)**: 충북 옥천 출생 ; 휘문고보 → 일본 도시샤대학 영문과 ; 한국 모더니즘 시의 선구 ; 「유리창」, 「향수」, 「백록담」 등 대표작 ; 한국전쟁 중인 1950년 7월 행방불명, 정확한 사망 경위 미상(납북설 유력). 정지용의 시는 1988년 해금되기까지 한국에서 출간 금지였음.

    **노래화**: 1989년 **이동원(작사가)** 과 **박인수(테너)** 의 듀엣곡으로 발표 ; 김희갑 작곡 ── 시 자체보다 노래로 대중적 인지도가 더 높음.

    **출처**: 정지용 「향수」, 『조선지광』 65호 (1927.3); 『정지용 시집』 (시문학사, 1935); 『정지용 전집』 (민음사, 여러 판); **정지용문학관**(충북 옥천).
  graceful_unknown: |
    정지용(1902~1950)의 「향수」는 1927년 3월 『조선지광』 65호 발표, 1935년 첫 시집 『정지용 시집』 수록. 5연 + 후렴 "그 곳이 차마 꿈엔들 잊힐리야" 반복 구조. 시작은 "넓은 벌 동쪽 끝으로 옛이야기 지줄대는 실개천이 휘돌아 나가고..." 1989년 이동원·박인수의 듀엣 곡으로 더 유명. 정지용은 충북 옥천 출생, 한국 모더니즘 시의 선구이며 1950년 한국전쟁 중 행방불명. 정확한 텍스트는 정지용문학관 또는 『정지용 전집』에서 확인을 권합니다.
