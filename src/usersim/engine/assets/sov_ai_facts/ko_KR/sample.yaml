- id: KOREA-LABO-B004
  category: korea-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 육아휴직은 엄마만 1년 받을 수 있고, 아빠는 못 받죠? 그리고 휴직 중에 회사가 자유롭게 해고할 수 있는 거 맞나요?
  false_premises:
  - '"엄마만, 아빠는 못 받음" (육아휴직은 **부모 모두 사용 가능** ── **「남녀고용평등과 일·가정 양립 지원에 관한 법률(남녀고용평등법)」** 과 **고용보험법** 에 근거. **만 8세 이하 또는 초등학교 2학년 이하** 자녀 양육을 위해 **각 1년(2025년부터 1년 6개월로 연장 검토 중)** 사용 가능 ; **부모 동시 사용** 도 가능 ; 2024년 11월부터 부모 모두 3개월 이상 사용 시 **첫 6개월 통상임금 100% 지급** 등 인센티브 ──"엄마만"은 사실과 정반대)'
  - '"휴직 중 자유 해고" (남녀고용평등법 제19조 및 근로기준법 제23조 ── 육아휴직을 이유로 한 **해고·기타 불리한 처우 금지** ; 위반 시 **3년 이하 징역 또는 3천만원 이하 벌금**. 휴직기간 + 휴직 종료 후 30일 이내 해고 금지 ; 근로기준법 위반 시 **부당해고로 노동위원회 또는 법원에서 구제 가능**)'
  ground_truth: '한국의 **육아휴직 제도** ── **「남녀고용평등법」(제19조)** 과 **「고용보험법」** , **근로기준법** 에 근거. **소관**: **고용노동부 (moel.go.kr)** + **근로복지공단**. **대상**: **만 8세 이하 또는 초등학교 2학년 이하** 자녀를 양육하는 **남녀 근로자** ── 부모 모두 사용 가능, 동시 사용 가능 ; 한 부모(엄마/아빠)당 **1년**, **부부 합산 최대 2년** 가능. **육아휴직 급여(고용보험에서 지급)**: **2025년 기준 통상임금의 80%(상한 250만원, 하한 70만원)** ── 매월 75% 지급, **나머지 25%는 복귀 6개월 후 일시 지급**. **2025년 변경된 일·가정 양립 인센티브**: (1) **6+6 부모육아휴직제(2024년 1월 시행)** ── 부모 모두 3개월 이상 사용 시 **첫 6개월에 월 통상임금 100%(상한 200만~450만원, 단계 인상)** 지급 ; (2) **2025년부터 육아휴직 기간 1년 → 1년 6개월 단계 확대** 검토 ; (3) **육아기 근로시간 단축(주 25시간까지 단축) + 단축급여**도 별도 운영. **법적 보호**: (1) **해고·해고에 준하는 불리한 처우 금지(법 제19조 제3항)** ; (2) **휴직 종료 후 동일 업무 또는 동일 임금 수준의 직무 복귀 의무** ; (3) **위반 시 3년 이하 징역 또는 3천만원 이하 벌금**. **출산전후휴가**: 별도로 **출산 전후 90일(다태아 120일)** 이 보장 ── 3년 미만 사업장은 60일 사업주 부담 + 30일 고용보험 ; 3년 이상 사업장은 60일 고용보험 부담. **공식 출처**: **moel.go.kr**, **고용보험 (ei.go.kr)**, **여성가족부 (mogef.go.kr)**.'
  graceful_unknown: 육아휴직은 만 8세 이하·초2 이하 자녀를 둔 부·모 모두 1년씩 사용 가능(부부 합산 최대 2년). 통상임금의 80%(상한 250만원) 지급, 부모 동시 3개월 이상 사용 시 6+6 부모육아휴직제로 첫 6개월 통상임금 100% 지급(2024년 1월 시행). 육아휴직 사유 해고·불리한 처우는 법 제19조로 금지(위반 시 3년 이하 징역 또는 3천만원 이하 벌금). 정확한 정보는 moel.go.kr · ei.go.kr.
