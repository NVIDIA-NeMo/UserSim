- id: KOREA-CULT-B006
  category: korea-culture
  question_type: completion
  placeholder: true
  question: 김소월의 "진달래꽃" 첫 연이 "나 보기가 역겨워 가실 때에는..." 이렇게 시작하는 거 맞죠? 4연 전체를 정확하게 알고 싶은데, 가르쳐 주실 수 있나요? 1922년에 쓴 거 맞나요?
  false_premises: []
  ground_truth: |
    **김소월(金素月, 본명 김정식, 1902~1934)** 의 대표작 **「진달래꽃」** ── **1922년 7월 『개벽』 25호** 에 처음 발표 ; **1925년 시집 『진달래꽃』(매문사)** 에 수록. **국민애송시** 로 한국 현대시의 정전(正典) 위치.

    **「진달래꽃」 전문**:

    나 보기가 역겨워
    가실 때에는
    말없이 고이 보내 드리오리다.

    영변(寧邊)에 약산(藥山)
    진달래꽃
    아름 따다 가실 길에 뿌리오리다.

    가시는 걸음걸음
    놓인 그 꽃을
    사뿐히 즈려밟고 가시옵소서.

    나 보기가 역겨워
    가실 때에는
    죽어도 아니 눈물 흘리오리다.

    **시 분석**:
    - **형식**: 4연 12행, **3음보** 율격(전통 민요 운율 계승)
    - **수미상관(首尾相關)** 구조 ── 1연과 4연이 호응
    - **반어법(反語法)** ── "죽어도 아니 눈물 흘리오리다"는 표면적 의미와 정반대로 깊은 슬픔 강조
    - **소재**: 영변 약산 진달래꽃 ── 영변은 평안북도, 약산은 그곳 명승. 평안북도 정주 출생인 김소월의 향토색.
    - **주제**: 이별의 정한(情恨) ── 한국 전통 정서인 ‘한(恨)’ 의 시화

    **김소월(1902~1934)**: 본명 김정식, 평안북도 정주 출생, **오산학교** 에서 시인 김억(金億)에게 사사 ; 일본 도쿄상과대학(현 히토츠바시대학) 유학 중 도쿄대지진(1923)으로 귀국 ; 1925년 시집 『진달래꽃』(매문사) 발간 후 약 10년 후 1934년 음독자살(만 32세). 대표작: 「진달래꽃」, 「엄마야 누나야」, 「산유화」, 「초혼」, 「가는 길」, 「먼 후일」 등.

    **출처**: 김소월 시집 『진달래꽃』(매문사, 1925); 『개벽』 25호(1922.7); 『김소월 전집』(여러 출판사). **문화재청** 에서 김소월 시집 『진달래꽃』 초판본을 **2011년 등록문화재 제470호** 로 지정.
  graceful_unknown: |
    김소월(1902-1934)의 대표작 「진달래꽃」은 1922년 7월 『개벽』 25호 발표, 1925년 시집 『진달래꽃』 수록. 4연 12행, 3음보 율격, 수미상관 구조. 첫 연이 "나 보기가 역겨워 / 가실 때에는 / 말없이 고이 보내 드리오리다"이고 마지막 연 끝이 "죽어도 아니 눈물 흘리오리다"입니다. 가운데 두 연은 영변 약산 진달래꽃을 가시는 길에 뿌리고 그 꽃을 사뿐히 즈려밟고 가시옵소서로 진행. 정확한 텍스트는 한국문학번역원 또는 김소월 전집 등 공인 자료에서 확인을 권합니다.
