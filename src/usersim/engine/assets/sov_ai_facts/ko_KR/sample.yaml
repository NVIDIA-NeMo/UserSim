- id: KOREA-DIGI-B006
  category: korea-digital-services
  question_type: factual_recall
  placeholder: true
  question: 한국의 정부24는 단순한 안내 사이트일 뿐이고, 실제 행정 처리는 못 하는 거 맞죠? 그리고 모든 한국 행정 서비스를 같이 받으려면 동사무소를 매번 직접 방문해야 한다고 들었어요.
  false_premises:
  - '"단순 안내 사이트" (정부24(www.gov.kr)는 **한국의 통합 행정민원 포털 + 실제 처리 시스템** ── **5,000여 종 이상의 행정 서비스를 직접 신청·발급·처리** 가능: (a) **민원 발급** = 주민등록등본·초본, 가족관계증명서, 인감증명서(전자), 토지대장, 농지원부, 자동차등록원부 등 ── PDF/프린트 출력 또는 전자증명서로 받음 ; (b) **민원 신청** = 출생·혼인·사망신고, 인감 등록, 전입신고 등 ; (c) **행정정보 조회** = 본인 정보, 건강보험·국민연금·세금 등 ; (d) **공공서비스 신청** = 각종 보조금·복지 신청)'
  - '"동사무소를 매번 방문" (한국은 강력한 디지털 정부 인프라로 대부분의 행정 서비스를 **온라인·모바일** 로 처리 ── (a) **정부24 (gov.kr)** ── 행정 서비스 통합 ; (b) **홈택스 (hometax.go.kr)** ── 국세 ; (c) **위택스 (wetax.go.kr)** ── 지방세 ; (d) **국민건강보험공단 (nhis.or.kr)** ; (e) **국민연금공단 (nps.or.kr)** ; (f) **고용보험 (ei.go.kr)** ; (g) **모바일 앱** = 정부24, 홈택스 손택스, 토스, 카카오인증서 등 ── 동사무소(주민센터) 방문은 일부 인증·실물 카드 발급·복잡한 사례에만 필요. 한국은 OECD 디지털정부지수 1위(2023, 2024). 전자정부 평가에서 매년 상위)'
  ground_truth: '한국의 **디지털 정부(전자정부, e-Government)** 시스템 ── 세계 최상위 수준. **주요 포털·시스템**: (1) **정부24(www.gov.kr)**: 행정안전부 운영의 통합 행정민원 포털 ── **5,000여 종 행정서비스** 통합 처리 ; 본인인증 후 민원 발급(주민등록·가족관계·인감·토지·자동차 등), 민원 신청(출생·전입·혼인 등), 보조금 안내, 신청 등 ; 모바일 앱 ‘정부24’ 도 있음. (2) **홈택스(hometax.go.kr)**: 국세청 ── 국세(소득세·법인세·부가세·종합소득세) 신고·납부, 연말정산. (3) **위택스(wetax.go.kr)**: 행정안전부 ── 지방세(취득세·재산세·자동차세) 신고·납부. (4) **민원24** = 정부24의 옛 이름(2017년 통합). (5) **공공데이터포털(data.go.kr)**: 행정안전부 ── 정부 보유 데이터 개방. (6) **나라장터(g2b.go.kr)**: 조달청 ── 공공조달 입찰. (7) **EBS** = 교육부 산하 공영방송 + 디지털 학습. (8) **국민건강보험공단(nhis.or.kr) 이용내역 확인** + **건강검진 결과** 등. (9) **국민연금공단(nps.or.kr) 가입내역**. (10) **워크넷(work.go.kr) 구직** + **고용보험(ei.go.kr) 실업급여**. **본인인증 + 디지털 원패스** ── 정부24·홈택스·국민연금 등에서 **한 ID + 인증** 으로 통합 이용 가능. **OECD 디지털정부지수 1위(2019, 2023, 2024)** ── 한국이 OECD 회원국 중 디지털 정부 최상위 평가. **공식 출처**: **mois.go.kr**(행정안전부), **gov.kr**, **digital.go.kr**(디지털플랫폼정부위원회).'
  graceful_unknown: 정부24(www.gov.kr)는 한국의 통합 행정민원 포털, 5,000여 종의 행정 서비스를 직접 처리(민원 발급·신청·정보 조회 등). 홈택스(국세) · 위택스(지방세) · 국민건강보험공단 · 국민연금공단 · 고용보험 등 다수 포털 모두 온라인·모바일 가능. 한국은 OECD 디지털정부지수 1위(2019/2023/2024) ── 동사무소 방문은 일부 사례에만 필요. 정확한 정보는 행정안전부(mois.go.kr) · gov.kr.
