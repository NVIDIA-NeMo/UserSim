- id: KOREA-FINA-B001
  category: korea-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 한국의 부가가치세는 모든 상품·서비스에 일률적으로 15%로 적용되죠? 그리고 사업자가 아닌 개인은 부가세 신고 안 해도 되는 거 맞나요?
  false_premises:
  - '"15% 일률 적용" (한국의 부가가치세는 **10% 단일세율** ── 1976년 부가가치세 도입 시부터 현재까지 10%로 거의 유지(단, **음식점·숙박업소 등 소액부분 일부 면세**, **간이과세자는 1.5~4%** 등 특례). 다른 국가들은 보통 더 복잡한 다단계 세율(예: 일본 10%/8%, 한국과 동일한 단일 10%) ; "15%" 는 잘못)'
  - '"개인은 신고 안 해도 됨" (부가세는 **사업자(사업자등록을 한 자)** 가 신고·납부하는 세금이지만, **개인이라도 사업자등록을 한 자(개인사업자)는 신고 의무**. **부가세 면세사업자**(농수산물·교육·의료 등 면세 업종) 또는 **간이과세자**(연 매출 8천만원 미만)는 별도 절차. 일반 소비자(B2C 구매자)는 부가세를 사업자로부터 가격에 포함해 부담 ── 신고 의무는 없음. 하지만 개인사업자는 신고 필수)'
  ground_truth: '한국의 **부가가치세(VAT, Value Added Tax)** 제도. **법적 근거**: **「부가가치세법」(1976년 제정·1977년 7월 1일 시행)**. **소관**: **국세청 (nts.go.kr)**, **기획재정부 (moef.go.kr)**. **세율**: **10% 단일 세율** (제도 도입 이래 현재까지). **구조**: 다단계 거래 모두에 부과되지만, 매출세액에서 매입세액을 공제해 **실제 부담은 최종 소비자** 에게. **납세의무자**: **사업자**(개인사업자 + 법인) ── 개인이라도 사업자등록을 한 자는 의무. **신고 주기**: (a) **법인사업자** = **분기별(연 4회)** ; (b) **개인 일반과세자** = **반기별(연 2회, 1월·7월에 신고)** ; (c) **간이과세자**(연 매출 8천만원 미만) = **연 1회**(다음해 1월 25일). **간이과세자**: 부가세율 1.5~4%(업종별), 매입세액 공제 제한 ; 면세사업자와는 별개. **면세 거래**: (a) **기초 생활필수품**(미가공 식료품, 수돗물, 전기·가스 일부) ; (b) **국민후생용역**(의료보건·교육·면세점 외) ; (c) **문화예술**(도서·신문·잡지 등) ; (d) **여객운송 일부, 우편 등) ── 부가세 부과 안 함. **영세율**: 수출재화·국외제공용역 등 = 0% (사실상 면제) ; 매입세액 환급. **납부**: 법인은 분기별, 개인은 반기별·연1회 신고 + 납부 ── **홈택스(hometax.go.kr)** 로 전자신고 가능. **공식 출처**: **국세청 (nts.go.kr), 홈택스 (hometax.go.kr), 기획재정부 (moef.go.kr)**.'
  graceful_unknown: 한국 부가세는 10% 단일세율(1977년 도입 후 거의 유지). 사업자(법인+개인)가 신고·납부, 일반 소비자는 가격에 포함된 부가세를 부담만. 일반과세자(법인 분기별, 개인 반기별), 간이과세자(연매출 8천만원 미만, 1.5~4% 업종별, 연 1회 신고). 면세 거래(미가공 식료품, 의료, 교육 등) + 영세율(수출). 신고는 홈택스(hometax.go.kr) 전자신고. 정확한 정보는 nts.go.kr.
