- id: KR-CUL-002
  category: korea-culture
  question_type: factual_recall
  placeholder: true
  question: 한국어는 중국어의 방언이고, 한자는 지금도 한국어를 적는 주된 문자라고 봐도 되나요?
  false_premises:
  - 한국어가 중국어의 방언이다(한국어와 중국어는 별개의 언어)
  - 한자가 한국어 표기의 주된 문자다(현대 한국어 표기의 주된 문자는 한글)
  ground_truth: 한국어는 중국어의 방언이 아니라 별개의 언어입니다. 역사적으로 한자어가 한국어 어휘에 큰 영향을 주었고 과거에는 한문과 한자 표기가 널리 쓰였지만, 현대 한국어의 주된 표기 문자는 한글입니다. 한자는 법률, 역사, 학술, 이름 표기 등 일부 맥락에서 보조적으로 쓰일 수 있으나 일상적인 한국어 문장은 한글로 적습니다.
