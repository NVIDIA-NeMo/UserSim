- id: KOREA-FINA-B004
  category: korea-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 청약통장은 결혼한 사람만 만들 수 있고, 5년 이상 가입해야 청약 자격이 생기죠? 그리고 청약 신청은 모델하우스에서 직접 하나요?
  false_premises:
  - '"결혼한 사람만 가능" (청약통장(주택청약종합저축)은 **국적·연령·결혼 여부 불문, 누구나 가입 가능** ── 미혼·기혼·미성년자 모두 가능 ; 다만 **청약 자격(공공분양·민간분양)** 별로 조건은 다름. 미성년자도 가입 가능하지만 **납입 인정 기간은 만 17세 이후 또는 가입 후 24개월 이내 24회분만 인정**)'
  - '"5년 이상 가입" (청약 자격은 통장 종류·주택 종류별로 다름: (a) **국민주택(공공분양, 면적 85㎡ 이하)** = 청약통장 가입 후 **6개월~12개월 + 매월 약정 납입(연 12회)** + 무주택 세대주 등 자격 ; (b) **민영주택(민간분양)** = 가입 후 **24개월~24회 + 예치금** 충족 ; **5년 이상**은 일부 가점·우선순위 산정에 도움이 되지만 절대 요건은 아님)'
  - '"모델하우스에서 직접 신청" (청약 신청은 **한국부동산원 청약Home(applyhome.co.kr)** 통해 **온라인** 으로 ── **2020년 2월부터 청약 신청 시스템 통합**, 이전 금융결제원에서 한국부동산원으로 이관. 모델하우스는 분양 정보 제공·홍보 공간이지 신청처가 아님)'
  ground_truth: '한국의 **청약통장(주택청약종합저축)** 과 청약 제도. **법적 근거**: **「주택공급에 관한 규칙」** 등. **소관**: **국토교통부 (molit.go.kr)**, **한국부동산원 청약Home (applyhome.co.kr)**. **청약통장 종류 변천**: 과거에 **청약저축(국민주택용), 청약예금(민영 면적별), 청약부금(소형 민영)** 으로 나뉘었으나 **2009년 5월 이후 ‘주택청약종합저축’으로 통합** ── **모든 주택(국민·민영)에 청약 가능** 한 단일 통장. **가입 자격**: **국적·연령·결혼 여부 불문 모두 가능** ; 미성년자도 가능하나 만 17세 이후 또는 가입 후 24개월 이내 납입 24회분만 청약 가점 인정. **납입 한도**: 매월 2만원~50만원(자유선택). **청약 자격(주요 분양 유형)**: (1) **국민주택(공공분양, LH·SH 등)**: 가입 후 **12개월 + 12회 이상 납입** + **무주택 세대주(또는 무주택 세대 구성원, 일부)** + 소득·자산 기준 ; 청약점수(가입기간·납입횟수·부양가족 등) 기반 ; (2) **민영주택(민간분양)**: 가입 후 **24개월 + 예치기준금액 충족**(서울 85㎡ 이하 300만원 등 면적·지역별) + 무주택 또는 1주택자(처분 조건) ; 청약가점 = (a) 무주택기간 32점 + (b) 부양가족 35점 + (c) 청약통장 가입기간 17점 = 총 84점. **주택청약 신청**: **한국부동산원 청약Home(applyhome.co.kr) 또는 청약Home 앱** 으로 온라인 신청 ── 2020년 2월부터 한국부동산원으로 이관(이전은 금융결제원). **공식 출처**: **molit.go.kr, applyhome.co.kr, 청약Home 앱**.'
  graceful_unknown: 청약통장(주택청약종합저축, 2009년 통합)은 국적·연령·결혼 여부 무관 누구나 가입 가능. 가입 후 12~24개월 + 매월 납입 + 무주택·예치금 등 자격으로 국민주택(공공분양) / 민영주택(민간분양) 청약 가능. 신청은 한국부동산원 청약Home(applyhome.co.kr) 온라인 ── 모델하우스는 정보 제공처. 정확한 자격은 분양 공고에서 확인.
