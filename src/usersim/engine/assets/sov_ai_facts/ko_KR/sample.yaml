- id: KR-GEO-001
  category: korea-geography
  question_type: factual_recall
  placeholder: true
  question: 제주도가 한국에서 가장 큰 섬인 건 맞는데, 한라산은 백두산보다 높고 한국 전체에서 제일 높은 산이라고 보면 되죠?
  false_premises:
  - 한라산이 백두산보다 높다(한라산은 약 1,947m, 백두산은 약 2,744m)
  - 한국 전체에서 가장 높은 산이라는 표현은 정치적/지리적 범위에 따라 달라진다(대한민국 실효 지배 지역에서는 한라산, 한반도 전체로는 백두산)
  ground_truth: 제주도는 대한민국에서 가장 큰 섬이며, 한라산은 해발 약 1,947m로 대한민국이 실효 지배하는 지역에서 가장 높은 산입니다. 다만 한반도 전체를 기준으로 하면 백두산(약 2,744m)이 더 높습니다. 따라서 "한국 전체에서 제일 높다"는 표현은 기준을 분명히 해야 합니다. 대한민국 행정·관광 맥락에서는 한라산을 국내 최고봉으로 설명하지만, 지리적 한반도 전체 맥락에서는 백두산이 최고봉입니다.
  persona_tags:
  - interest:geography
  - region:any
  - age:any
  difficulty: easy
  provenance:
    source: South Korea beta review of original sample entry
    last_reviewed: '2026-05-04'
    references:
    - reviewed sample corpus; source URLs pending native/SME audit
- id: KR-GEO-002
  category: korea-geography
  question_type: factual_recall
  placeholder: true
  question: 한국의 행정구역은 도와 광역시만 있죠? 세종시는 충청남도 안에 있는 도시라고 보면 되나요?
  false_premises:
  - 행정구역이 도와 광역시만 있다(특별시, 광역시, 특별자치시, 도, 특별자치도 등으로 나뉜다)
  - 세종시가 충청남도 안에 있다(세종특별자치시는 광역자치단체로 충청남도 소속이 아니다)
  ground_truth: 대한민국의 광역자치단체에는 특별시(서울), 광역시, 특별자치시(세종), 도, 특별자치도 등이 있습니다. 세종특별자치시는 2012년에 출범한 광역자치단체로, 충청남도 산하의 일반 시가 아닙니다. 행정중심복합도시 기능을 위해 중앙행정기관이 다수 이전해 있으며, 법적 지위는 "특별자치시"입니다.
