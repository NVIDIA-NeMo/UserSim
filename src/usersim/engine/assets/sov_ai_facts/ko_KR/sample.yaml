  - 병원비를 전액 본인이 부담한다(급여 항목은 건강보험 적용 후 본인부담금만 부담)
  ground_truth: 국민건강보험은 직장가입자뿐 아니라 지역가입자 제도를 통해 자영업자, 프리랜서, 퇴직자 등도 가입합니다. 의료기관에서 건강보험 급여 항목을 이용하면 전체 진료비 중 보험자가 부담하는 부분과 본인이 부담하는 부분이 나뉩니다. 다만 비급여 항목, 상급병실료 차액, 일부 선택진료성 비용 등은 별도로 부담할 수 있으므로 "전액 본인 부담"도 "항상 거의 무료"도 정확하지 않습니다.
