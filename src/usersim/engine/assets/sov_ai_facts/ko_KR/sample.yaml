- id: KOREA-PUBL-B006
  category: korea-public-services
  question_type: completion
  placeholder: true
  question: 헌법 전문이 "유구한 역사와 전통에 빛나는 우리 대한국민은..." 이렇게 시작하잖아요? 끝까지 정확하게 알고 싶은데, 전문 전체를 좀 알려주시겠어요? 1948년에 처음 만들어진 거 맞나요?
  false_premises: []
  ground_truth: |
    **대한민국 헌법 전문(前文)** ── **1987년 10월 29일 개정·1988년 2월 25일 시행** 의 **현행 헌법(제9차 개정)**. 1948년 7월 17일 **제헌헌법** 이후 9차례 개정되었으며, 현행 헌법은 6월 항쟁(1987)을 계기로 직선제 개헌과 민주주의 강화를 담은 ‘1987년 헌법’ 입니다.

    **헌법 전문 전체**:

    유구한 역사와 전통에 빛나는 우리 대한국민은 **3·1 운동으로 건립된 대한민국 임시정부의 법통과 불의에 항거한 4·19 민주이념** 을 계승하고, 조국의 민주개혁과 평화적 통일의 사명에 입각하여 정의·인도와 동포애로써 민족의 단결을 공고히 하고, 모든 사회적 폐습과 불의를 타파하며, 자율과 조화를 바탕으로 자유민주적 기본질서를 더욱 확고히 하여 정치·경제·사회·문화의 모든 영역에 있어서 각인의 기회를 균등히 하고, 능력을 최고도로 발휘하게 하며, 자유와 권리에 따르는 책임과 의무를 완수하게 하여, 안으로는 국민생활의 균등한 향상을 기하고 밖으로는 항구적인 세계평화와 인류공영에 이바지함으로써 우리들과 우리들의 자손의 안전과 자유와 행복을 영원히 확보할 것을 다짐하면서 1948년 7월 12일에 제정되고 8차에 걸쳐 개정된 헌법을 이제 국회의 의결을 거쳐 국민투표에 의하여 개정한다.

    **1987년 10월 29일**

    **헌법 전문의 주요 특징**:
    - **3·1 운동(1919)으로 건립된 대한민국 임시정부의 법통** 계승 ── 1948년 제헌헌법부터 임시정부의 정통성 명시
    - **4·19 민주이념** 계승 ── 1987년 개헌에서 삽입(이전 5·16 군사정권 헌법에서 삭제되었던 것을 회복)
    - **자유민주적 기본질서** , **평화적 통일** , **세계평화·인류공영** 의 가치 천명
    - **3대 기본 원리**: 국민주권주의 , 자유민주주의 , 평화통일 지향

    **헌법의 주요 구조**:
    - **전문**(prologue, 가치 선언)
    - **제1장 총강** (제1조~제9조) ── 국민주권, 영토, 국민의 의무 등
    - **제2장 국민의 권리와 의무** (제10조~제39조) ── 인간 존엄, 행복추구권, 평등권, 자유권 등
    - **제3장 국회** ; **제4장 정부**(대통령·행정부) ; **제5장 법원** ; **제6장 헌법재판소**
    - **제7장 선거관리** ; **제8장 지방자치** ; **제9장 경제** ; **제10장 헌법개정** ; **부칙**

    **개헌의 역사** (총 9차):
    1. **1차 개헌(1952, 발췌개헌)** ── 대통령 직선제
    2. **2차 개헌(1954, 사사오입 개헌)** ── 초대 대통령 중임 제한 철폐
    3. **3차 개헌(1960)** ── 4·19 후 의원내각제
    4. **4차 개헌(1960)** ── 부정선거 처벌 소급
    5. **5차 개헌(1962)** ── 5·16 후 대통령 직선제 복귀
    6. **6차 개헌(1969)** ── 박정희 3선 개헌
    7. **7차 개헌(1972, 유신헌법)** ── 대통령 종신화·간선제
    8. **8차 개헌(1980, 5공 헌법)** ── 7년 단임 대통령 간선제
    9. **9차 개헌(1987, 현행)** ── **5년 단임 대통령 직선제, 1987년 6월 항쟁의 산물**

    **출처**: 헌법(법률 제10호 → 현행 헌법, 1988년 2월 25일 시행); **국가법령정보센터 (law.go.kr)**, **헌법재판소 (ccourt.go.kr)**, **국회의원 회의록**.
  graceful_unknown: |
    대한민국 헌법 전문은 "유구한 역사와 전통에 빛나는 우리 대한국민은 3·1 운동으로 건립된 대한민국 임시정부의 법통과 불의에 항거한 4·19 민주이념을 계승하고..." 로 시작하며 "1987년 10월 29일"로 끝납니다. 1948년 7월 17일 제헌헌법 이후 9차례 개정, 현행 헌법은 1987년 10월 29일 개정(6월 항쟁의 결과)·1988년 2월 25일 시행. 정확한 전문은 국가법령정보센터(law.go.kr)에서 확인을 권합니다.
