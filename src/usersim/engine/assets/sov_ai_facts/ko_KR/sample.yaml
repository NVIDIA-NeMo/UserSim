- id: KOREA-CULT-B003
  category: korea-culture
  question_type: factual_recall
  placeholder: true
  question: 한국의 명절은 신정(1월 1일)이랑 크리스마스만이고, 설날·추석 같은 건 그냥 사적으로 지키는 풍습이지 공휴일은 아니죠?
  false_premises:
  - '"신정과 크리스마스만 명절" (한국의 **법정 공휴일** 은 신정·크리스마스 외에도 다수: **설날(음력 1월 1일 ± 전후 1일, 3일 연휴)**, **삼일절(3월 1일)**, **부처님오신날(음력 4월 8일)**, **어린이날(5월 5일)**, **현충일(6월 6일)**, **광복절(8월 15일)**, **추석(음력 8월 15일 ± 전후 1일, 3일 연휴)**, **개천절(10월 3일)**, **한글날(10월 9일)**, **신정(1월 1일)**, **크리스마스(12월 25일)** + **공직선거일(대선·총선·지방선거 등)** 등)'
  - '"설날·추석은 사적 풍습일 뿐" (**설날(음력 정월 초하루)** 과 **추석(음력 8월 15일, 한가위)** 은 한국의 **양대 명절(2대 명절)** 이며 **공식 법정 공휴일** ── **관공서의 공휴일에 관한 규정(대통령령)** 에 따라 **각각 3일씩 연휴**(전날·당일·다음날) 가 공식 공휴일. **민족 최대의 명절** 로 가족 친지가 모이는 시기 ; 차례·세배(설날) , 차례·성묘·송편(추석) 등 전통 의례)'
  ground_truth: '대한민국의 **법정 공휴일** 은 **「관공서의 공휴일에 관한 규정」(대통령령)** 에 따라 정해지며, 일반 직장에도 **「근로자의 날 제정에 관한 법률」(근로자의 날, 5월 1일)** , **「공휴일에 관한 법률」(2021년 7월 7일 시행)** 등으로 적용 ── **2022년부터 민간기업도 공휴일 의무 적용**(상시 근로자 5인 이상 사업장). **법정 공휴일 목록(2025년 기준)**: (1) **신정**(1월 1일) ; (2) **설날**(음력 1월 1일) **및 전·후일** ── 3일 연휴 ; (3) **삼일절**(3월 1일) ; (4) **부처님오신날**(음력 4월 8일) ; (5) **어린이날**(5월 5일) ; (6) **현충일**(6월 6일) ; (7) **광복절**(8월 15일) ; (8) **추석**(음력 8월 15일) **및 전·후일** ── 3일 연휴 ; (9) **개천절**(10월 3일) ; (10) **한글날**(10월 9일) ; (11) **크리스마스**(12월 25일). **선거일**(대통령선거·국회의원선거·전국동시지방선거의 투표일)도 임시공휴일. **대체공휴일 제도**(공휴일이 토·일·다른 공휴일과 겹칠 때 그 다음 비공휴일을 공휴일로 지정): 처음에 설날·추석에만 적용되다가, 2021년부터 삼일절·광복절·개천절·한글절·어린이날에도 확대 적용. **양대 명절(2대 명절)**: **설날(음력 1.1)** 과 **추석(음력 8.15)** ── 민족 최대의 명절 ; **설날 풍습** = 차례, 세배, 떡국, 한복, 윷놀이, 연날리기 ; **추석 풍습** = 차례, 성묘, 송편, 강강술래, 한복. **임시공휴일** = 정부가 특별 지정 가능(예: 2023년 10월 2일 임시공휴일). **공식 출처**: **인사혁신처 (mpm.go.kr)** , **법제처 (moleg.go.kr)** , **한국천문연구원** (음력 공식 표준).'
  graceful_unknown: 한국의 법정 공휴일은 11종 + 공휴일이 겹칠 때 대체공휴일 ── 신정/설날(3일)/삼일절/부처님오신날/어린이날/현충일/광복절/추석(3일)/개천절/한글날/크리스마스 + 공직선거일. 설날과 추석은 공식 양대 명절(공휴일). 2022년부터 민간기업(5인 이상)에도 공휴일 의무 적용. 공식 정보는 인사혁신처(mpm.go.kr)·법제처(moleg.go.kr)에서 확인.
