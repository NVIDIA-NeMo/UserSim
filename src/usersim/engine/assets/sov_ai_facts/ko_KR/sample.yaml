- id: KR-PAM-002
  category: korea-poetry-and-music
  question_type: factual_recall
  placeholder: true
  question: 아리랑은 특정 한 사람이 1980년대에 만든 대중가요이고, 지역별 버전은 거의 없다고 보면 되죠?
  false_premises:
  - 한 사람이 1980년대에 만든 대중가요다(아리랑은 오래된 민요 계열)
  - 지역별 버전이 거의 없다(정선아리랑, 진도아리랑, 밀양아리랑 등 다양한 지역 변주가 있다)
  ground_truth: 아리랑은 한 개인이 1980년대에 만든 대중가요가 아니라, 오랜 기간 전승되어 온 한국의 대표적인 민요 계열입니다. 정선아리랑, 진도아리랑, 밀양아리랑 등 지역별로 선율과 가사, 전승 맥락이 다른 여러 변주가 있습니다. 2012년에는 "아리랑, 한국의 서정민요"가 유네스코 인류무형문화유산 대표목록에 등재되었습니다.
