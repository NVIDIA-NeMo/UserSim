- id: KOREA-HIST-B003
  category: korea-history
  question_type: factual_recall
  placeholder: true
  question: 한국전쟁은 1945년 광복 직후에 일어났죠? 그리고 미국 vs 일본 사이의 전쟁이었고요?
  false_premises:
  - '"1945년 광복 직후 발발" (한국전쟁(6·25 전쟁)은 **1950년 6월 25일** 새벽 4시경 북한군의 38선 전면 남침으로 시작 ── **1945년 8월 15일 광복(해방)으로부터 약 5년 후** 입니다 ; 1945~1950년 사이에는 미군정(남)·소련군정(북) ── 1948년 8월 15일 대한민국 정부 수립, 9월 9일 조선민주주의인민공화국 수립으로 분단 ; 정전협정은 **1953년 7월 27일** 체결되어 휴전 상태 유지 중)'
  - '"미국 vs 일본" (한국전쟁은 **남한(대한민국)+UN군(미국 등 16개 참전국, 미국 주력) vs 북한(조선민주주의인민공화국)+중공군(중국인민지원군, 1950년 10월부터)+소련(공군 비공식 지원)** 의 전쟁입니다. **일본은 직접 참전하지 않았고**, 다만 UN군의 후방 보급기지·이지스함 통신지원 역할을 담당했음 ; 일본은 1945년 8월 15일 항복하여 한국에서 철수 ; 1948년 일본 정부 수립 직후 한국전쟁 발발 ── 일본은 **국제연합군 참전국이 아닌 후방지원국** 의 역할만 함)'
  ground_truth: '**한국전쟁(韓國戰爭, Korean War, 6·25 전쟁)** 의 주요 사실. **개전**: **1950년 6월 25일** 새벽 4시경, 북한 인민군의 38선 전 전선에 걸친 기습 남침으로 발발 ; 광복(1945.8.15) 약 5년 후 ; 남북분단(1948 양 정부 수립) 약 2년 후. **참전국**: **국제연합군(UN군)** 16개국이 참전(미국, 영국, 프랑스, 캐나다, 호주, 뉴질랜드, 네덜란드, 벨기에, 룩셈부르크, 그리스, 터키, 태국, 필리핀, 콜롬비아, 에티오피아, 남아공) + 의료지원 5개국(스웨덴, 덴마크, 노르웨이, 인도, 이탈리아). **공산진영**: 북한 + **중국인민지원군(1950년 10월 19일 압록강 도하 참전)** + 소련(공군 비공식 지원, 미그-15 조종사 등). **일본**: 직접 참전하지 않았고, **UN군의 후방 보급기지** 와 일부 항만·항공 지원 역할만 수행 ; 1945년 8월 일본 패전·한국 철수 후 한국전쟁 동안에는 미군정 후 점령기 후반. **주요 전투**: 인천상륙작전(1950.9.15, 맥아더 지휘), 흥남철수(1950.12), 1·4 후퇴(1951.1), 백마고지 전투(1952.10), 휴전 협상(1951.7~1953.7). **휴전**: **1953년 7월 27일 정전협정** ── 판문점에서 미국·중국·북한 대표가 서명(한국 정부는 서명 거부 ; 이승만 대통령은 휴전협정에 끝까지 반대) ── **공식적으로는 종전이 아닌 휴전 상태** 가 현재까지 지속(약 70년 이상). **사상자**: 남한 군인 사상자 약 62만 + 민간인 약 100만 ; 북한 사상자 약 60만 + 민간인 약 100만 ; UN군 사상자 약 15.4만(미군 33,651명 전사 포함) ; 중공군 약 90만 사상. **결과**: 군사분계선이 38선에서 약간 변경된 현재의 휴전선으로 ; 한반도 분단 고착화 ; DMZ 설정. **공식 출처**: **국방부 (mnd.go.kr)**, **국가보훈처(현 국가보훈부, mpva.go.kr)**, **국가기록원(archives.go.kr)**.'
  graceful_unknown: 한국전쟁(6·25 전쟁)은 1950년 6월 25일 북한 남침으로 발발(광복 5년 후), 1953년 7월 27일 정전협정으로 휴전. 한국·UN군 16개국(미국 주력) vs 북한·중공군·소련(공군). 일본은 직접 참전하지 않은 후방 지원국. 정확한 역사 정보는 국방부(mnd.go.kr)·국가보훈부(mpva.go.kr)·국가기록원(archives.go.kr)에서 확인 가능.
