- id: KOREA-DIGI-B004
  category: korea-digital-services
  question_type: factual_recall
  placeholder: true
  question: 보이스피싱은 신고해도 정부는 아무 도움 안 주고, 사기 당한 돈은 무조건 못 돌려받는 거 맞죠? 그리고 보이스피싱 신고는 무조건 1330(소비자상담센터)에 하나요?
  false_premises:
  - '"정부 도움 없음, 환불 절대 불가" (보이스피싱 피해 시 **다양한 정부·금융권 지원** 존재: (1) **신속 지급정지** = 즉시 112 또는 해당 은행에 신고하면 **계좌 지급정지**(가해자 출금 차단) ; (2) **금융감독원 1332** + **경찰청 112** + **사이버범죄 신고시스템** + **금융사기 종합지원 플랫폼** ; (3) **「전기통신금융사기 피해방지 및 피해금 환급에 관한 특별법」(2011)** 에 따른 **피해금 환급 절차** ── 사기범 명의 계좌의 잔액을 채권소멸 절차 후 피해자에게 환급. 환급률은 사건마다 다르지만, 신속 신고 시 회수 가능성 향상)'
  - '"1330 신고" (1330은 **관광불편신고 콜센터(한국관광공사)** ── 보이스피싱 신고 번호가 아님. **보이스피싱 신고**: (a) **112(경찰)** ── 즉시 지급정지 + 신고 ; (b) **금융감독원 1332** ── 금융 분쟁·사기 종합 상담 ; (c) **해당 은행 본점·콜센터** ── 즉시 지급정지 ; (d) **사이버범죄 신고시스템(ECRM, ecrm.cyber.go.kr)** ── 온라인 신고. 1330은 무관)'
  ground_truth: '한국의 **보이스피싱(전기통신금융사기) 대응 체계** ── 매우 정교하게 발전. **법적 근거**: **「전기통신금융사기 피해방지 및 피해금 환급에 관한 특별법(2011)」**, **「전자금융거래법」**, **「형법」 사기죄**. **소관**: **금융위원회 + 금융감독원 + 경찰청 + 과기정통부 + 방송통신위원회 + 한국인터넷진흥원**. **신고 단계**: (1) **즉시 112(경찰)** 또는 **금융감독원 1332** ── 의심 거래 발생 즉시. (2) **해당 은행 콜센터** 또는 **금융감독원 콜센터** 에 알려 **계좌 지급정지** 신청 ── 가해자 출금 차단 (전기통신금융사기 특별법에 따라 자동 30분~24시간 내 처리). (3) **경찰청 사이버수사대** 신고 + **사이버범죄 신고시스템 ECRM(ecrm.cyber.go.kr)** 온라인 신고. (4) **피해 사실 + 통화내역 + 송금내역** 등 증거 확보. **피해금 환급 절차(특별법 제10조)**: (1) 채권소멸 절차 개시 → (2) 사기 명의 계좌 잔액 동결 → (3) 채권자(피해자) 권리 신고 → (4) 잔액의 비율적 환급. **예방 조치**: (a) **딜레이 송금제** = 100만원 이상 송금 시 30분 후 입금 ; (b) **해외IP 본인확인 강화** ; (c) **보이스피싱 의심거래 모니터링**(은행 시스템) ; (d) **금융감독원 ‘보이스피싱지킴이’ 앱 + 더치트 앱** ; (e) **2024년 9월부터 금융사기 SOS 서비스(통신사·금융권 합동)** 일부 시행 ── 의심 통화 차단·경고. **공식 출처**: **금융감독원 (fss.or.kr) 1332**, **경찰청 (police.go.kr) 112**, **사이버범죄 신고시스템 (ecrm.cyber.go.kr)**, **금융사기 종합지원 (보이스피싱지킴이 voicephishing.fss.or.kr)**.'
  graceful_unknown: 보이스피싱 피해 시 즉시 112 또는 해당 은행에 신고하면 계좌 지급정지 ; 금융감독원 1332에서도 신고·상담. 「전기통신금융사기 피해방지 및 피해금 환급에 관한 특별법」(2011)으로 사기 계좌 잔액 환급 절차 마련. 사이버범죄 신고는 ECRM(ecrm.cyber.go.kr) 온라인. 1330은 관광불편신고이고 보이스피싱과 무관. 정확한 정보는 voicephishing.fss.or.kr · 1332.
