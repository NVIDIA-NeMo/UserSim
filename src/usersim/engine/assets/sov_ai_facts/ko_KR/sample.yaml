  question: 윤동주의 "서시" 첫 두 행이 "죽는 날까지 하늘을 우러러 / 한 점 부끄럼이 없기를..." 이렇게 시작하는 거 맞죠? 시 전체를 정확하게 알려주실 수 있나요? 일제강점기 1939년 작 맞나요?
  false_premises: []
  ground_truth: |
    **윤동주(尹東柱, 1917~1945)** 의 대표작 **「서시(序詩)」** ── **1941년 11월 20일** 작성 ; **자선 시집 『하늘과 바람과 별과 시』** (1948년 1월, 정음사) 의 서시로 수록. 한국 현대시의 정전(正典)으로 국민애송시.

    **「서시」 전문**:

    죽는 날까지 하늘을 우러러
    한 점 부끄럼이 없기를,
    잎새에 이는 바람에도
    나는 괴로워했다.
    별을 노래하는 마음으로
    모든 죽어 가는 것을 사랑해야지.
    그리고 나한테 주어진 길을
    걸어가야겠다.

    오늘 밤에도 별이 바람에 스치운다.

    **시 분석**:
    - **형식**: 자유시, 9행 ; 1연 8행 + 2연 1행의 변형 구조 ── 마지막 행이 별도 연으로 처리되어 강조 효과
    - **시점**: 일제강점기 말기(1941), 식민지 지식인의 양심·자기성찰
    - **핵심 모티프**: **하늘** (절대적 가치·양심), **별** (이상·꿈), **바람** (시련·고난), **잎새** (작고 연약한 존재)
    - **주제**: 양심에 부끄럽지 않은 삶의 다짐 ── 절대적 윤리 의식

    **윤동주(1917~1945)**: 북간도 명동촌(중국 지린성 룽징시 출생), 연희전문 문과 졸업(1941), 일본 도시샤대학 영문과 유학 중 **1943년 7월** 사상범으로 체포(독립운동 협의), **1945년 2월 16일 일본 후쿠오카 감옥에서 순국**(만 27세). 사후 동생 윤일주와 친구 정병욱이 보존한 친필 시집 원고를 바탕으로 **1948년 1월 정음사** 에서 시집 **『하늘과 바람과 별과 시』** 31편을 출간. 대표작: 「서시」, 「별 헤는 밤」, 「자화상」, 「또 다른 고향」, 「쉽게 씌어진 시」, 「참회록」 등. **2017년 영화 『동주』** 등 대중적 재조명.

    **출처**: 시집 『하늘과 바람과 별과 시』(정음사, 1948); 윤동주 친필 원본은 **연세대학교** 보관, 일부는 **국립중앙도서관** 등에 영인본·디지털 자료 ; **윤동주문학관**(서울 종로구) , **연세대 윤동주기념관** , **명동촌 윤동주생가**(중국 룽징).
  graceful_unknown: |
    윤동주(1917~1945)의 「서시」는 1941년 11월 20일 작 (1939년이 아님), 사후 시집 『하늘과 바람과 별과 시』(1948년 1월 정음사 출간) 서시. 9행 자유시: "죽는 날까지 하늘을 우러러 / 한 점 부끄럼이 없기를, / 잎새에 이는 바람에도 / 나는 괴로워했다. / 별을 노래하는 마음으로 / 모든 죽어 가는 것을 사랑해야지. / 그리고 나한테 주어진 길을 / 걸어가야겠다. // 오늘 밤에도 별이 바람에 스치운다." 정확한 원문은 윤동주문학관 또는 연세대 윤동주기념관 자료에서 확인을 권합니다.
