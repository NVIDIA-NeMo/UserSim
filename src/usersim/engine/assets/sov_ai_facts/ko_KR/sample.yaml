- id: KR-HIS-002
  category: korea-history
  question_type: factual_recall
  placeholder: true
  question: 3.1운동은 1945년 해방 직전에 일어난 독립운동이고, 대한민국 임시정부도 그 다음 해에 세워진 거죠?
  false_premises:
  - 3.1운동이 1945년 해방 직전이었다(1919년 3월 1일 시작)
  - 대한민국 임시정부가 그 다음 해에 세워졌다(1919년 4월 상하이에서 수립)
  ground_truth: 3.1운동은 1919년 3월 1일을 기점으로 전국과 해외 한인 사회로 확산된 대규모 독립운동입니다. 대한민국 임시정부는 같은 해 1919년 4월 중국 상하이에서 수립되었습니다. 1945년은 일본의 패전과 한반도 해방의 해로, 3.1운동과 임시정부 수립보다 26년 뒤의 일입니다.
