- id: KOREA-DIGI-B002
  category: korea-digital-services
  question_type: factual_recall
  placeholder: true
  question: 한국에서 개인정보보호법은 아직 통과 안 됐고, 곧 입법될 거죠? 그리고 처벌도 약해서 위반해도 과태료 몇 만원 정도라고 들었는데 맞나요?
  false_premises:
  - '"아직 통과 안 됨" (한국 **개인정보보호법** 은 **2011년 3월 제정·9월 30일 시행** 후 **다수 개정**(2013, 2014, 2016, 2020 데이터3법, 2023 등) ── 14년 이상 시행 중. 통과되어 있음. **2020년 데이터3법(개인정보보호법·정보통신망법·신용정보법) 통합 개정**으로 데이터 활용 + 개인정보 보호 균형 강화. **2023년 9월 시행 개정** 으로 **개인정보 전송요구권(데이터이동권) 도입** , **마이데이터** 활성화, **글로벌 기업 처벌 강화** 등)'
  - '"위반 시 과태료 몇 만원" (개인정보보호법 위반 시 **매우 강력한 처벌**: (1) **형사처벌** = 5년 이하 징역 또는 5천만원 이하 벌금(개인정보 부정이용·유출 등) ; (2) **과징금** = 2023년 9월 개정으로 **위반행위 관련 매출액의 최대 3%** 부과 가능(이전은 부정수익 또는 위반관련 매출액의 3% 한도) ── **글로벌 IT기업 등에 100억대 과징금 부과 사례 다수** ; (3) **과태료** = 5천만원 이하 ; (4) **시정조치** + **공표명령**. "몇 만원" 은 사실과 정반대)'
  ground_truth: '대한민국 **개인정보보호법(Personal Information Protection Act, PIPA)** ── **2011년 3월 29일 제정, 2011년 9월 30일 시행**. **소관**: **개인정보보호위원회 (PIPC, pipc.go.kr)** ── 2020년 8월 5일 통합 출범한 독립 합의제 행정기관(국무총리 소속). **주요 개정 이력**: (1) **2014년 개정** = 주민등록번호 수집 제한 ; (2) **2020년 데이터3법** = 개인정보보호법 + 정보통신망법(개인정보 부분) + 신용정보법 통합 정비, **가명정보** 도입 ── 데이터 활용 활성화 ; (3) **2023년 3월 14일 개정·9월 15일 시행** = **개인정보 전송요구권(개인정보 이동권)** 도입 ── 마이데이터 본격 활성화, 동의 절차 합리화, **유럽 GDPR 수준 글로벌 처벌 강화**(과징금 매출액의 3% 등). **주요 원칙(법 제3조)**: (1) 명확한 목적·적법성 ; (2) 최소 수집 ; (3) 정확성·최신성 ; (4) 안전관리(암호화·접근통제 등) ; (5) 처리 방침 공개 ; (6) 정보주체 권리 보장 ; (7) 익명·가명 처리 권장. **정보주체 권리**: 열람·정정·삭제·처리정지 + **2024년부터 개인정보 전송요구권**. **위반 시 처벌**: (1) **5년 이하 징역 또는 5천만원 이하 벌금**(개인정보 부정 취득·이용·제3자 제공 등) ; (2) **3년 이하 징역 또는 3천만원 이하 벌금** ; (3) **2년 이하 징역 또는 2천만원 이하 벌금** ; (4) **과징금 = 2023년 9월부터 위반행위 관련 매출액의 최대 3%** ; (5) **5천만원 이하 과태료**. **글로벌 사례**: Meta·구글·테무·네이버 등에 거액 과징금 부과. **EU GDPR 수준 도달** ── 2024년 12월 GDPR과의 적정성 결정도 갱신 ; 한·유럽 간 데이터 이전 자유. **공식 출처**: **개인정보보호위원회 (pipc.go.kr), 한국인터넷진흥원 KISA (kisa.or.kr) e-개인정보 보호 종합 포털 (privacy.go.kr)**.'
  graceful_unknown: 한국 개인정보보호법은 2011년 9월 시행, 2023년 9월 개정으로 개인정보 전송요구권·마이데이터·과징금(매출액의 3%) 강화. 위반 시 5년 이하 징역, 5천만원 이하 벌금, 매출의 3% 과징금, 5천만원 이하 과태료, 시정조치·공표명령 가능. 소관은 개인정보보호위원회(pipc.go.kr, 2020년 통합 출범). EU GDPR 적정성 결정으로 한·유럽 데이터 이전 자유. 정확한 정보는 pipc.go.kr · privacy.go.kr.
