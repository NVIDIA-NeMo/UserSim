- id: KOREA-EDUC-B001
  category: korea-education
  question_type: factual_recall
  placeholder: true
  question: 한국 학제는 4-4-4-4(초·중·고·대 각 4년)이고, 의무교육은 고등학교까지 12년이죠? 그리고 6세에 모두 자동으로 초등학교 입학하나요?
  false_premises:
  - '"4-4-4-4 학제" (한국 학제는 **6-3-3-4** ── **초등학교 6년 + 중학교 3년 + 고등학교 3년 + 대학교 4년**(일부 단과대학·전문대학 2~3년). 의무교육은 **초등학교 6년 + 중학교 3년 = 9년**)'
  - '"의무교육 12년(고등학교까지)" (한국의 의무교육은 **9년(초등 6년 + 중학교 3년)** ── **고등학교는 의무가 아님** ; 다만 **2014년부터 단계적으로 고교무상교육 시행 → 2021년 전 학년 무상화** ── 무상이지만 의무는 아님 ; 진학률은 99%대로 매우 높음)'
  - '"6세 모두 자동 입학" (초등학교 입학은 **만 6세가 되는 날이 속하는 해의 다음 학년도(즉 만 6세 이후 첫 3월)** ── 통상 **만 7세** 가 입학할 때의 만 나이. 입학 통지서가 자동 발송되지만 **취학유예** 신청 시 1년 늦출 수 있음)'
  ground_truth: '대한민국의 **학제와 의무교육**. **소관**: **교육부 (moe.go.kr)** + 17개 시·도교육청 + 각 학교법인. **학제**: **6-3-3-4제** ── (1) **초등학교 6년** = 8세까지(만 7세 입학) ~ 만 12세 ; (2) **중학교 3년** ; (3) **고등학교 3년** = 일반고·특목고(과학고, 외국어고, 국제고)·자율형사립고(자사고)·특성화고(상업·공업·예술 등)·마이스터고 ; (4) **대학교 4년**(또는 의대·치대·한의대·약대 6년) + 전문대 2~3년. **의무교육 = 초등학교 6년 + 중학교 3년 = 9년** ── **「초·중등교육법」 제13조** ; 보호자에게 자녀를 취학시킬 의무, 위반 시 100만원 이하 과태료. **무상교육**: **2021년부터 고교 무상교육 전 학년 시행** ── 입학금·수업료·교과서비·학교운영지원비 등 무상. **취학 연령**: **만 6세가 되는 해의 다음 학년도(3월)** 에 초등학교 입학 ── 즉 만 7세 시점에 입학. **취학 통지서** 가 자동으로 발송 ; 취학유예·조기입학 신청 가능. **유아교육**: **3~5세 누리과정** = 어린이집·유치원에서 무상 보육·교육 ── 2013년부터 단계적 시행, 2024년 누리과정 개정. **고등교육**: 4년제 약 200개 대학(국립·공립·사립) ; 전문대 130여개 ; 대학원 다수. **공식 출처**: **교육부 (moe.go.kr)**, **한국교육개발원(kedi.re.kr)**, **한국교육과정평가원(kice.re.kr)**, **시·도교육청** .'
  graceful_unknown: 한국 학제는 6-3-3-4제(초 6년+중 3년+고 3년+대 4년). 의무교육은 9년(초·중)이며 고등학교는 의무 아니지만 2021년부터 무상교육 전 학년 시행. 초등학교 입학은 만 6세가 되는 해의 다음 학년도(만 7세 시점). 3-5세 누리과정 무상. 소관은 교육부(moe.go.kr) + 17개 시도교육청.
