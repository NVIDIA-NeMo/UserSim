- id: KOREA-CULT-B005
  category: korea-culture
  question_type: factual_recall
  placeholder: true
  question: K-팝(K-Pop)은 정부가 직접 운영하는 거고, BTS는 국영 그룹이죠? 그리고 K-팝 가수들은 모두 국가공무원 신분이고요?
  false_premises:
  - '"정부가 직접 운영" (K-팝(K-Pop) 산업은 **민간 엔터테인먼트 기업** 들이 주도 ── **하이브(HYBE, BTS·세븐틴·뉴진스·아일릿·투모로우바이투게더 등 소속)**, **SM 엔터테인먼트(에스파·NCT·EXO·소녀시대 등)**, **JYP 엔터테인먼트(스트레이키즈·트와이스 등)**, **YG 엔터테인먼트(블랙핑크·트레저 등)** 등 ── 모두 상장 또는 사기업. 정부의 역할은 **문화체육관광부의 한류 진흥 정책** , **콘텐츠진흥원(KOCCA)** 의 산업 지원 정도이며, 직접 운영 아님)'
  - '"BTS는 국영 그룹" (**BTS(방탄소년단)** 는 **하이브 산하 빅히트 뮤직(빅히트 엔터테인먼트)** 소속 그룹, **민간 기업이 매니지먼트** ── 2013년 6월 13일 데뷔 ; 멤버 7명: RM(리더), 진, 슈가, 제이홉, 지민, 뷔, 정국. **2020년 빌보드 핫100 1위**(Dynamite) 등 글로벌 기록 ; 2022~2025년 **멤버 군 입대로 활동 중단** , 2025년 6월부터 순차 전역. 국영 아님)'
  - '"K-팝 가수가 국가공무원" (K-팝 가수는 **민간 엔터테인먼트 회사 소속의 연예인** ── 일반 회사원에 가까운 계약직 직원이거나, 일정 정도 권한 있는 계약 자영업자. **국가공무원 아님** ; 단, 한국 남성은 일반 국민과 동일하게 **병역 의무**(현역 18개월 등)를 이행해야 하며, 이는 K-팝 가수도 동일 ── 현역병으로 입대하지 공무원이 되는 것은 아님)'
  ground_truth: '**K-팝(K-Pop, 한국 대중음악)** 은 **민간 엔터테인먼트 기업 주도의 음악 산업**. **주요 4대 메이저 엔터테인먼트사**: (1) **하이브(HYBE Co., Ltd., 2005년 빅히트 엔터테인먼트로 시작)** ── 방시혁 의장 ; **빅히트 뮤직(BTS·투모로우바이투게더)** , **플레디스 엔터테인먼트(세븐틴·뉴진스 사태 후 이탈)** , **소스 뮤직(르세라핌)** , **빌리프랩(엔하이픈·아일릿)** , **케이오즈(KOZ, 지코)** 등 다수 레이블 보유 ; KOSPI 상장. (2) **SM 엔터테인먼트** ── 1995년 이수만 설립, 2023년 카카오·HYBE 인수 경쟁 후 **카카오엔터테인먼트** 가 SM 대주주가 됨 ; **NCT·에스파·EXO·소녀시대** 등. (3) **JYP 엔터테인먼트** ── 1997년 박진영 설립 ; **스트레이키즈·트와이스·NIZIU(일본 합작)·니쥬·NMIXX** 등. (4) **YG 엔터테인먼트** ── 1996년 양현석 설립 ; **블랙핑크·트레저** 등. 그 외 **카카오엔터(IST·플레디스·스타쉽)** , **CJ ENM** 등이 있음. **BTS(방탄소년단)**: **2013년 6월 13일 데뷔**, 빅히트 뮤직(현 하이브 산하) 소속, 7인조 (RM·진·슈가·제이홉·지민·뷔·정국). 글로벌 인기로 **2020년 빌보드 핫100 1위 *Dynamite***, **그래미 후보** , **유엔 총회 연설(2018, 2020, 2021)** , **국가 공식 외교 활동 참여(문화훈장 수훈 2018, 미국 백악관 방문 2022)** 등. **2022년 6월 단체 활동 잠정 중단 발표** 후 멤버들 군 입대(현역병으로 정상 복무, 일부 사회복무요원), **2025년 6월부터 순차 전역** , 2025년 그룹 활동 재개 예정. **정부 정책**: **문화체육관광부(mcst.go.kr)** 의 한류 진흥 ; **한국콘텐츠진흥원(KOCCA, kocca.kr)** 의 산업 지원 ; 그러나 K-팝 그 자체는 **민간 산업** ── 가수는 일반 회사원/연예인 신분이며 국가공무원이 아님. **공식 출처**: 각 기획사 IR 자료, **한국콘텐츠진흥원 (kocca.kr)** , 문화체육관광부.'
  graceful_unknown: K-팝은 민간 엔터테인먼트 기업 주도 산업 ── 4대 메이저(HYBE, SM, JYP, YG) + 다수 레이블. BTS는 하이브 산하 빅히트 뮤직 소속(2013년 데뷔, 7인조), 민간 그룹이며 국영 아님. K-팝 가수는 연예인 신분이고 국가공무원 아님. 한국 남성은 누구나 병역 의무 이행. 정부의 역할은 한류 진흥(문체부, 콘텐츠진흥원). kocca.kr · mcst.go.kr 에서 공식 정보 확인 가능.
