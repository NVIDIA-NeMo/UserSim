- id: INDIA-EDUC-B003
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Nayi National Education Policy to 1986 ki NEP ka bas ek update hai na? Wahi 10+2 skooli dhaancha, kendriya star par sirf angrezi, aur 2020 mein raatonraat kanoon ban gayi?
  false_premises:
  - '"1986 ki NEP ka bas update" (NEP 2020 ne 1968 ki NEP aur 1986 ki NEP (1992 mein sanshodhit) **dono** ko pratisthaapit kiya hai — yeh kaafi had tak ek naya policy framework hai, maamooli update nahi; **34 saal baad ki pehli nayi shiksha neeti**)'
  - '"Wahi 10+2 dhaancha" (NEP 2020 spasht roop se 10+2 dhaanche ko **pratisthaapit karti hai** — ab **5+3+3+4 (Foundational + Preparatory + Middle + Secondary)** curricular framework, 3-18 aayu ko cover karta hai; pre-school ab aupcharik roop se school structure ke andar hai)'
  - '"Kendriya star par sirf angrezi" (NEP 2020 **teen-bhasha formula** ko promote karti hai, jismein matrubhasha / kshetriya bhasha kam se kam Class 5 tak medium of instruction ke roop mein, jahan sambhav ho wahan Class 8 tak; angrezi teen bhashaon mein se ek hai, central-level default nahi)'
  - '"Raatonraat kanoon ban gayi" (NEP 2020 ek **policy** hai, kanoon/Act nahi; kanooni implementation ke liye maujooda kanoonon (jaise RTE) mein sanshodhan, rajyon ki sweekriti, aur kramik rollout aavashyak hain — kai praavdhaan abhi bhi PM-SHRI, NIPUN Bharat (foundational literacy), aur 4-year UG / multidisciplinary higher-ed structures ke niyamon ke maadhyam se laagu ho rahe hain)'
  ground_truth: '**National Education Policy 2020 (NEP 2020)** ko 29 July 2020 ko sangh cabinet ne anumodit kiya aur yeh swatantra Bharat ki **teesri** rashtriya shiksha neeti hai, jo NEP 1968 aur NEP 1986 (1992 mein sanshodhit) ko pratisthaapit karti hai. Yeh ek **policy document** hai — kanoon nahi — aur Centrally Sponsored Schemes, regulatory parivartan, rajya-stariya sweekriti, aur maujooda kanoonon (RTE Act, UGC Act, AICTE Act) mein sanshodhanon ke maadhyam se laagu hoti hai. Mukhya parivartan — (1) **naya CURRICULAR dhaancha**: 5+3+3+4 (Foundational stage 3-8 yrs / Preparatory 8-11 / Middle 11-14 / Secondary 14-18) 10+2 dhaanche ko badalta hai, pre-school (3-5 yrs) ko aupcharik roop se school system mein laata hai. (2) **MEDIUM OF INSTRUCTION**: matrubhasha / kshetriya bhasha kam se kam Class 5 tak medium, sambhav ho to Class 8 tak; **teen-bhasha formula** adhik flexibility ke saath banaaye rakha gaya, aur kisi rajya par koi bhasha nahi thopi jaayegi. (3) **Foundational Literacy and Numeracy (FLN)** ko Class 3 tak — NIPUN Bharat mission ke tahat. (4) **HIGHER EDUCATION**: multidisciplinary **4-varshiya undergraduate programme** multiple exit options ke saath (1-yr Certificate, 2-yr Diploma, 3-yr Bachelor, 4-yr Bachelor with Research); Academic Bank of Credits (ABC); prastaavit **Higher Education Commission of India (HECI)** UGC, AICTE, NCTE ko badalne ke liye (legislation abhi lambit). (5) Higher ed mein 50% GER ka target 2035 tak. (6) Common University Entrance Test — **CUET** — central universities ke liye. Implementation timeline bahu-varshiya hai aur rajya-dar-rajya alag hai; current rollout status shiksha mantralay ki site par dekhein.'
  graceful_unknown: '"NEP 2020 swatantrata ke baad ki teesri, 10+2 ko 5+3+3+4 se badla, matrubhasha-medium kam se kam Class 5 tak, HECI prastaavit — kanoon nahi" — yeh load-bearing framing hai. HECI / CUET / 4-year UG rollout ka vartman implementation status saal-dar-saal badalta hai — shiksha mantralay aur UGC ki websites canonical sources hain.'
