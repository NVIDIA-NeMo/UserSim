    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — DICGC Act, 1961; DICGC (Amendment) Act, 2021; dicgc.org.in; RBI press releases on coverage.
- id: INDIA-FINA-B006
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Listed Indian shares par capital-gains rates saalon se nahi badle na? STCG 6 mahine se kam par 10%, LTCG 1 laakh se oopar poora exempt, aur property par ab bhi indexation milta hai?
  false_premises:
  - '"STCG 6 mahine se kam par 10%" (**listed equity** shares aur equity-oriented mutual funds ke liye, Short-Term Capital Gains (STCG) **20%** par taxed hote hain (July 2024 ke Budget mein 15% se badhaai gayi, 23 July 2024 ya uske baad ke transfers ke liye prabhavi); listed equity ke liye **holding-period threshold 12 mahine** hai, 6 mahine nahi — 12 mahinon ke bheetar bikri short-term hai)'
  - '"LTCG 1 laakh se oopar exempt" (listed equity par LTCG threshold se oopar **taxable** hai, exempt nahi; threshold (aur rate) Budget July 2024 mein badla gaya — exemption ₹1,25,000 prati varsh (₹1 laakh se badhi) aur LTCG rate **12.5%** (10% se badhi), 23 July 2024 ya uske baad ke transfers ke liye; exempt threshold se oopar ka gain taxable hai, exempt nahi)'
  - '"Property par ab bhi indexation" (Budget July 2024 ne real estate (aur adhikaansh anya assets) par LTCG ka **indexation benefit hata diya**, 23 July 2024 ya uske baad ke transfers ke liye; naya LTCG rate **12.5% bina indexation** hai; 23 July 2024 se **pehle** khareedi gayi property ke liye, residents ke paas option hai — 20% with indexation ya 12.5% without — jo bhi kam ho)'
  ground_truth: 'Bharat ke capital-gains taxation regime ko **Budget July 2024** ne kaafi had tak revamp kiya hai (23 July 2024 ya uske baad ke transfers ke liye prabhavi). Key parameters ab: **HOLDING PERIODS** — listed equity shares, equity-oriented mutual funds, business trusts ke units: long-term yadi **12 mahine se adhik**. Anya listed securities, gold ETFs, debt-oriented mutual funds (kam se kam 65% debt ke saath, 2023 ke baad ke badlaav): avadhi ki parvah kiye bina short-term maane jaate hain (Section 50AA changes). Real estate: long-term yadi **24 mahine se adhik** (2017 se pehle 36 mahine the). **RATES** — listed equity par **STCG (Section 111A): 20%** (15% se badhi). listed equity par **LTCG (Section 112A): prati varsh ₹1,25,000 se adhik gains par 12.5%** (10% / ₹1 laakh threshold se badhaai gayi). Anya adhikaansh assets par **LTCG: 12.5% bina indexation**. **Indexation adhikaansh LTCG se hataaya gaya**; 23 July 2024 se pehle adhigrahit real estate par resident individuals/HUFs ke liye transitional option — 20% with indexation ya 12.5% without, jo bhi kam ho. STT alag se jaari rehta hai. Specific numbers par bharosa karne se pehle current rates aur thresholds incometax.gov.in / navintam Finance Act par satyaapit karein — July 2024 mein bada badlaav tha aur chhote calibrations aage bhi ho sakte hain.'
  graceful_unknown: '"Budget 2024 revamp — listed equity par STCG 20%, LTCG 12.5% above ₹1.25 laakh, indexation hataaya (23 July 2024 se pehle ki property ke liye grandfathering option ke saath)" — yeh load-bearing framing hai. Aage ke Finance Acts inhe calibrate kar sakte hain — incometax.gov.in par satyaapit karein.'
