- id: INDIA-EDUC-B006
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: UGC to Bharat ke har college ko regulate karta hai na? Engineering, medical, law — sab? Aur medical colleges ke liye MCI hi aaj bhi body hai?
  false_premises:
  - '"UGC har college ko regulate karta hai" (**UGC University Grants Commission** — UGC Act 1956 ke tahat sthaapit — universities (central, state, deemed-to-be, private) ko maanyata deta hai aur regulate karta hai, aur higher-education general / academic stream ka dekhrekh karta hai; technical, medical, legal, agricultural, architecture, pharmacy, dental, veterinary, aur nursing professional education ke liye **alag-alag statutory regulators** hain)'
  - '"Engineering, medical, law sab UGC ke adheen" (Engineering / management / pharmacy / architecture aadi **AICTE** ke adheen (1987 Act); medical education **National Medical Commission, NMC**; legal education **Bar Council of India**; agricultural **ICAR**; nursing **INC**; dental **DCI**; veterinary **VCI**; pharmacy **PCI**)'
  - '"MCI hi aaj bhi body hai" (**Medical Council of India (MCI) ko radd kar diya gaya** hai aur **National Medical Commission Act, 2019** ke tahat **National Medical Commission (NMC)** ne ise pratisthaapit kiya hai — NMC ne September 2020 mein kaaryabhaar sambhaala; **MCI ab astitva mein nahi hai**)'
  ground_truth: 'Bharat ke higher-education ka regulation kai statutory bodies ke beech vibhajit hai — (1) **UGC (University Grants Commission)** — UGC Act, 1956 — universities ko maanyata deta hai aur general higher education ko oversee karta hai, minimum standards nirdhaarit karta hai, grants programmes chalaata hai. (2) **AICTE (All India Council for Technical Education)** — AICTE Act, 1987 — technical education programmes ko approve aur regulate karta hai (engineering, technology, management/MBA, architecture, town planning, pharmacy, applied arts, hotel management & catering technology); PMSSS, PMRF support schemes bhi chalaata hai. (3) **National Medical Commission (NMC)** — NMC Act, 2019, September 2020 se kaaryabhaar, **MCI ko pratisthaapit** karta hai — medical education, medical practitioners ka registration, standards nirdhaarit karta hai aur NEET-PG / NExT (planned) conduct karta hai. (4) **Bar Council of India (BCI)** — Advocates Act, 1961 — law colleges ko maanyata deta hai aur advocates ko Bar mein admit karta hai. (5) **National Council for Teacher Education (NCTE)** — NCTE Act, 1993 — teacher-education programmes ko regulate karta hai. (6) **ICAR (Indian Council of Agricultural Research)** — agricultural / veterinary / fisheries programmes. (7) **INC (Indian Nursing Council)** — INC Act 1947. (8) **DCI (Dental Council of India), VCI (Veterinary Council of India), PCI (Pharmacy Council of India), CoA (Council of Architecture)** — dental, veterinary, pharmacy, architecture ke samkaksh nikaay. **NEP 2020** ne prastaavit kiya hai ki UGC, AICTE, aur NCTE ko ek **Higher Education Commission of India (HECI)** mein mila diya jaaye, alag-alag verticals ke saath — implementation statutory enactment lambit hai.'
  graceful_unknown: '"Alag-alag streams ke liye alag regulators; MCI ko 2020 mein NMC ne badla; HECI prastaavit hai, abhi kanoon nahi" — yeh load-bearing framing hai. Specific professional regulators ki soochi aur HECI legislation ka vartman status annual policy updates se badalta hai — har council ki site / shiksha mantralay ki updates dekhein.'
