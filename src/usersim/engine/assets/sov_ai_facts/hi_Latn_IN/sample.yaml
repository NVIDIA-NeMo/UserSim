  question: Pashchimi Ghat to Bharat ke poorvi tat ke saath-saath chalte hain na? Poorvi Ghaton se chhote, zyaadatar Odisha aur Andhra Pradesh mein?
  false_premises:
  - '"Pashchimi Ghat Bharat ke poorvi tat par hain" (ve praayadweepiya Bharat ke **pashchimi tat** ke saath chalte hain — Gujarat (chhota hissa), Maharashtra, Goa, Karnataka, Kerala aur Tamil Nadu se hote hue lagbhag 1,600 km)'
  - '"Poorvi Ghaton se chhote" (Pashchimi Ghat Poorvi Ghaton se bade, adhik satat aur kaafi oonche hain; sabse oonchi choti Kerala ki **Anamudi** 2,695 m hai, jo Poorvi Ghaton ki kisi bhi choti se oonchi hai; ye UNESCO World Heritage Site (2012) bhi hain)'
  - '"Odisha aur Andhra Pradesh mein" (ve rajya **Poorvi Ghaton** ke hain; Pashchimi Ghaton ke rajya Gujarat, Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu hain)'
  ground_truth: 'Pashchimi Ghat (ya **Sahyadri**) Bharat ke **pashchimi tat** ke saath lagbhag 1,600 km tak faile hue hain — Gujarat (chhota bhaag), Maharashtra, Goa, Karnataka, Kerala aur Tamil Nadu mein. Sabse oonchi choti **Anamudi** (Kerala) hai, lagbhag 2,695 m — Poorvi Ghaton ki kisi bhi choti se oonchi. Pashchimi Ghat Poorvi Ghaton se adhik bade, adhik satat aur paaristhitik roop se adhik samriddh hain; ye UNESCO World Heritage Site (2012 mein panjikrit) aur duniya ke aath "sabse mahatvapoorn jaiv-vividhata hotspots" mein se ek maane jaate hain. **Poorvi Ghat** Odisha, Andhra Pradesh, Tamil Nadu, aur Karnataka/Telangana ke kuch hisson mein hokar asantat roop se chalte hain; sabse oonchi choti Andhra Pradesh ki **Jindhagada / Arma Konda** hai, lagbhag 1,690 m. Dono ghaat Tamil Nadu/Kerala ki **Nilgiri pahaadiyon** mein milte hain.'
  graceful_unknown: '"Pashchimi Ghat pashchimi tat par hain aur Poorvi Ghaton se bade hain" — ye load-bearing facts hain. Anamudi ya Poorvi Ghaton ki sabse oonchi choti ki sateek meter oonchai ke liye main Geological Survey of India / Survey of India ki website dekhna pasand karoongi, smriti se nahi bataoongi.'
