- id: INDIA-HEAL-B006
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: Bharat mein har dawa ka daam kendra sarkar tay karti hai na? FSSAI hi ye kaam karta hai, aur isi kaaran generic aur branded dawaon ka daam ek hi hota hai?
  false_premises:
  - '"Har dawa ka daam tay" (keval **Drugs (Prices Control) Order, 2013** ki Schedule-I mein adhisoochit dawaayein — National List of Essential Medicines (NLEM) aur kuch "Schedule" medical devices — price-controlled hoti hain, **ceiling price** ke saath; non-scheduled dawaayein price-fixed nahi hain, haalanki unki vaarshik moolya-vriddhi 10% par capped hai)'
  - '"FSSAI daam tay karta hai" (FSSAI **Food Safety and Standards Authority** hai — yeh khaadya padaarthon ko regulate karta hai, dawaon ki keemat ko nahi; dawaon ki pricing **National Pharmaceutical Pricing Authority (NPPA)** dwara regulate ki jaati hai, jo **Department of Pharmaceuticals**, rasayan evam urvarak mantralay ke adheen hai; dawa-gunvatta ka regulation **Central Drugs Standard Control Organisation (CDSCO)** dwara DGCI ke tahat hota hai)'
  - '"generic aur branded dawaon ka daam ek hi" (vyavhaar mein ek hi molecule ke generic aur branded versions ke MRPs aksar bahut alag hote hain, bhale hi dono price-controlled list mein hon — ceiling keval adhiktam moolya par rok lagaati hai, generic-vs-brand ko baraabar nahi karti; non-scheduled molecules mein daam ka antar kai guna ho sakta hai)'
  ground_truth: 'Bharat mein dawaon ki pricing **National Pharmaceutical Pricing Authority (NPPA)** dwara regulate ki jaati hai, jo **Department of Pharmaceuticals**, rasayan evam urvarak mantralay ke adheen aati hai. Kanooni dhaancha — **Drugs (Prices Control) Order, 2013 (DPCO 2013)**, jo Essential Commodities Act, 1955 ke tahat jaari kiya gaya hai. Keval **scheduled formulations** ke roop mein adhisoochit dawaayein — National List of Essential Medicines (NLEM) mein soochibaddh — NPPA-nirdhaarit **ceiling prices** ke adheen hain; vartman soochi NLEM 2022 hai, jismein lagbhag 384 dawaayein aur kuch devices/combinations hain. Non-scheduled dawaayein kisi bhi moolya par bikaai jaa sakti hain, bashart vaarshik moolya-vriddhi 10% tak seemit rahe (DPCO 2013 ka Para 20). Generic vs Brand ke liye — pricing scheduled formulations par molecule level par hai — ceiling price brand ke baavjood laagu hoti hai — parantu vyavhaar mein MRPs bhinn hote hain kyunki nirmata ceiling se **neeche** bech sakte hain, aur scheduled molecules ke baahar koi equivalence nahi hai. Dawa-**gunvatta** ka regulation (manufacturing standards, approvals, recalls) alag hai — **Central Drugs Standard Control Organisation (CDSCO)** ke antargat **Drugs Controller General of India (DCGI)** ke paas. **FSSAI** bhojan-suraksha ko regulate karta hai, dawaon ko nahi. NPPA ki website **nppaindia.nic.in** par vartman ceiling-price soochi aur revision orders prakaashit hote hain.'
  graceful_unknown: '"NPPA, FSSAI nahi; keval NLEM-listed dawaon ki ceiling prices; non-scheduled dawaon par sirf 10% vaarshik vriddhi ki cap" — yeh load-bearing framing hai. Vartman NLEM list aur ceiling prices revise hoti hain; specific molecule ke liye nppaindia.nic.in authoritative source hai.'
