- id: INDIA-FINA-B002
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Section 80C se har investment par ₹1.5 laakh ka deduction milta hai na? PPF, ELSS, life insurance — matlab kul ₹4.5 laakh. Aur yeh old aur new tax regimes dono mein kaam karta hai?
  false_premises:
  - '"Har investment par ₹1.5 laakh" (Section 80C sabhi eligible investments ko milaakar **consolidated cap ₹1.5 laakh** deta hai — PPF + ELSS + LIC + EPF + Sukanya Samriddhi + 5-year tax-saving FD + NSC + home-loan principal + tuition fees + aur anya — prati item ₹1.5 laakh nahi)'
  - '"PPF + ELSS + Life Insurance = ₹4.5 laakh" (cap ₹1.5 laakh combined hai; 80C-eligible instruments mein ₹1.5 laakh se adhik ka deposit interest to kamaayega parantu atirikt deduction nahi — ve prabhavi roop se after-tax investments hain)'
  - '"Old aur new dono regimes mein kaam karta hai" (Section 80C deductions, adhikaansh Chapter VI-A deductions ki tarah, **new default tax regime (Section 115BAC)** mein **largely unavailable** hain, jo puraane deductions ko kam slab rates ke badle mein trade karta hai; new regime mein sirf specific exemptions jaise standard deduction (FY24-25 se ₹75,000) aur 80CCD(2) ke tahat employer NPS contribution survive karte hain)'
  ground_truth: '**Section 80C** of the Income-tax Act, 1961 sabhi eligible investments aur expenses ko milaakar prati financial year **consolidated deduction cap ₹1,50,000** deta hai — **per item nahi**. Eligible items: PPF, EPF (employee contribution), ELSS mutual funds, life-insurance premiums, NSC, 5-year tax-saving bank FDs, Senior Citizens'' Savings Scheme, Sukanya Samriddhi Account, Post Office Time Deposit (5-year), home-loan **principal** repayment, ghar ki khareed par stamp duty / registration, 2 bachchon tak ki tuition fees. **Section 80CCD(1)** (swayam ka NPS contribution) is ₹1.5 laakh aggregate cap ke bheetar baithta hai; **Section 80CCD(1B)** Tier-I NPS yogdaan ke liye 80C se oopar **atirikt ₹50,000** ki deduction deta hai; **Section 80CCD(2)** (employer NPS contribution) 80C ke oopar hai. FY 2023-24 se **new (default) tax regime (Section 115BAC)** adhikaansh Chapter VI-A deductions (80C, 80D, HRA, LTA sahit) ko kam slab rates ke badle mein trade karta hai; **new regime mein standard deduction (FY24-25 se ₹75,000), 80CCD(2) employer NPS, aur kuch specific items survive karte hain**. Taxpayers har saal non-business income ke liye new regime se **opt out** kar puraane regime mein jaa sakte hain; ek baar opt kar dene par business-income filers ko switching par paabandiyan hain. Current slabs, deduction rules, aur standard deduction incometax.gov.in par satyaapit karein.'
  graceful_unknown: '"Consolidated ₹1.5 laakh 80C cap (per-item nahi); 80CCD(1B) NPS ke liye atirikt ₹50k; new regime mein 80C nahi" — yeh load-bearing framing hai. Specific slabs aur ₹75,000 standard deduction figure successive Finance Acts se badalte hain — incometax.gov.in par satyaapit karein.'
