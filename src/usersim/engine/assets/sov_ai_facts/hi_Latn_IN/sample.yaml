- id: INDIA-DIGI-B004
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: PM-KISAN to Bharat ke har kisaan ko mahine ke ₹6,000 deti hai na? Chhote aur bade dono bhu-swaami paatra hain, aur paisa gaon ki panchayat ke maadhyam se aata hai?
  false_premises:
  - '"Mahine ke ₹6,000" (PM-KISAN ₹6,000 **prati varsh** deti hai — mahine nahi — har chaar mahine par ₹2,000 ki teen samaan kiston mein; yeh mahine ke liye ₹500 ke baraabar hai, ₹6,000 nahi)'
  - '"Har kisaan" (paatrata "sabhi **bhumi-dhaarak kisaan parivaaron**" ke liye hai — parivar ki paribhasha pati, patni, aur naabaalig bachche hain — kai **exclusions** ke adheen: institutional landholders, holders of constitutional posts, sevaarat/sevanivritt kendra/rajya sarkar aur PSUs ke adhikari/karmchari (Group D / Class IV staff ke liye kuch exemptions ke saath), professionals jaise doctor / engineers / lawyers / chartered accountants / architects jo practice kar rahe hon, pichhle assessment year mein income tax bharne waale, ₹10,000 se adhik monthly pension paane waale)'
  - '"Paisa gaon ki panchayat ke maadhyam se" (PM-KISAN payments **Direct Benefit Transfer (DBT)** ke maadhyam se seedhe laabharthi ke **Aadhaar-linked bank khaate** mein hote hain, **Public Financial Management System (PFMS)** ke maadhyam se, krishi evam kisaan kalyaan mantralay dwara; **gram panchayat / patwari** bhumi records ke initial verification mein shaamil hote hain parantu paisa handle nahi karte)'
  ground_truth: '**Pradhan Mantri Kisaan Samman Nidhi (PM-KISAN)** ek kendriya kshetriya scheme hai, jo 24 February 2019 ko launched hui, aur paatra **bhumi-dhaarak kisaan parivaaron** ko aay-sahaayata ke roop mein **₹6,000 prati varsh** deti hai, har chaar mahine par ₹2,000 ki teen samaan kiston mein (aam taur par April-July, August-November, December-March cycles mein). Payment **Direct Benefit Transfer (DBT)** ke maadhyam se laabharthi ke Aadhaar-linked bank account mein hota hai, **PFMS** ke maadhyam se krishi evam kisaan kalyaan vibhag dwara processed. **Paatrata**: sabhi bhumi-dhaarak kisaan parivar (pati + patni + naabaalig bachche sanyukt roop se), **exclusions** ke adheen: institutional land-holders; constitutional posts ke dhaarak / serving ya former ministers / sansad / vidhaayak / mayors / zila panchayat ke adhyaksh; kendra/rajya sarkaron aur PSUs ke sevaarat/sevanivritt adhikari aur karmchari (Group D / multi-tasking staff / Class IV ke liye exemptions); pichhle assessment year mein income-tax bharne waale; professionals (doctor, engineers, lawyers, CAs, architects) professional bodies se registered aur apna professional kar rahe; ₹10,000 se adhik monthly pension paane waale superannuated/retired persons. **KYC aur verification** — Aadhaar seeding, eKYC, aur rajya revenue authorities dwara bhumi-records verification ke maadhyam se. **pmkisan.gov.in** par status / register karein.'
  graceful_unknown: '"₹6,000 prati varsh (mahine nahi) 3 kiston mein; specific eligibility kai professional/income-related exclusions ke saath; DBT to Aadhaar-linked bank account" — yeh load-bearing framing hai. Specific exclusion criteria aur periodic revisions ke liye pmkisan.gov.in par satyaapit karein.'
