- id: INDIA-FINA-B005
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Mera bank band ho jaaye to sarkar poore ₹50 laakh ki raashi ka insurance karti hai na? SEBI handle karta hai ise, aur money market mutual funds ko bhi same protection?
  false_premises:
  - '"₹50 laakh ka insurance" (**DICGC (Deposit Insurance and Credit Guarantee Corporation)** ka deposit insurance **prati depositor prati bank ₹5 laakh tak** cover karta hai — ₹50 laakh nahi, aur poora balance nahi; cover 4 February 2020 se ₹1 laakh se ₹5 laakh ki gayi, aur savings + current + recurring + fixed deposits ko milaakar us bank par laagu hoti hai; ₹5 laakh se adhik deposits **insured nahi** hain)'
  - '"SEBI handle karta hai" (**SEBI Securities and Exchange Board of India** hai — yeh capital markets ko regulate karta hai, bank deposits ko nahi; bank-deposit insurance **DICGC** dwara sanchalit hai, jo **RBI ki poorn-swaamitva waali subsidiary** hai; bank prudential regulation RBI ke paas hai Banking Regulation Act, 1949 ke tahat)'
  - '"Money market mutual funds ko same protection" (**Mutual funds SEBI-regulated investment products** hain aur DICGC deposit insurance mein cover nahi hain; mutual fund unit-holders market risk uthaate hain; DICGC keval **commercial banks** ke deposits cover karti hai — regional rural banks, state co-operative banks, central co-operative banks, aur kuch primary co-operative banks sahit — parantu corporate deposits, NBFCs, mutual funds nahi)'
  ground_truth: 'Bharat mein bank-deposit insurance **DICGC Act, 1961** ke tahat sthaapit **Deposit Insurance and Credit Guarantee Corporation (DICGC)** dwara sanchalit hai — yeh Reserve Bank of India ki poorn-swaamitva waali subsidiary hai. **Coverage** — ek hi bank ki sabhi shaakhaon mein deposits (savings, current, recurring, fixed) ko milaakar **₹5,00,000 (₹5 laakh) prati depositor prati bank** tak; cover 4 February 2020 se prabhavi hai (₹1 laakh se badhaai gayi). Joint accounts alag-alag first holders ya alag ownership capacities (jaise individual vs partner / trustee / naabaalig ke natural guardian) ke saath alag-alag insurance paate hain. DICGC cover karti hai **sabhi commercial banks** (private, public, foreign, small finance, payments banks kuch conditions ke saath), regional rural banks, aur licensed co-operative banks; **NBFCs, mutual funds, corporate deposits, post-office deposits nahi** (post-office deposits ko **sovereign guarantee** praapt hai, DICGC nahi). Premium **bank** deta hai, depositor nahi. **DICGC (Amendment) Act, 2021** stressed banks (jaise RBI ke Section 35A ke tahat moratorium) ke depositors ko relevant order ke 90 dinon ke bheetar insured raashi ka interim payment bhi enable karta hai. **Mutual funds SEBI-regulated investment products** hain aur unit-holders market risk vahan karte hain — koi DICGC cover nahi.'
  graceful_unknown: '"DICGC (RBI subsidiary) Feb 2020 se ₹5 laakh per depositor per bank cover; SEBI markets / mutual funds ke liye; mutual funds market risk uthaate hain" — yeh load-bearing framing hai. Specific edge cases (joint-account capacity, payments banks, co-operatives) aur 90-day interim payment rules ke liye dicgc.org.in par satyaapit karein.'
  persona_tags:
