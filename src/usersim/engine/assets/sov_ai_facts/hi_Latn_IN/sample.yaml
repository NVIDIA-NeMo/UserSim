- id: INDIA-LABO-B006
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Koi bhi factory kaamgaar workforce ke size chaahe jitna ho kisi "workman" ko bina sarkar ki anumati retrench kar sakti hai na? Bas ek din ka notice aur token payment, 20 saal kaam karne waale ko bhi?
  false_premises:
  - '"Workforce ke size chaahe jitna ho bina sarkar ki anumati retrench" (**Industrial Disputes Act, 1947** ke tahat **100 ya adhik workmen** waale industrial establishment (nayi IR Code 2020 mein 50 — parantu abhi uniformly notified nahi) ko **Chapter V-B** ke tahat retrenchment, lay-off, ya closure ke liye sambandhit sarkar se **poorv anumati** leni hoti hai; anumati ke bina retrenchment **avaidh** hai)'
  - '"Bas ek din ka notice aur token payment" (ek workman jo kam se kam 1 saal continuous service mein raha ho, use (a) **ek mahine ka likhit notice** ya uske badle wages; (b) **15 din ki average pay prati poorn varsh** continuous service (ya 6 mahine se adhik ka partial year) ke baraabar **retrenchment compensation**; (c) prescribed form mein **sambandhit sarkar ko notice** — paane ka adhikar hai)'
  - '"20 saal kaam karne waale ko bhi" (formula laagu hai — 20 saal service ke liye retrenchment compensation 20 × 15 days = lagbhag **10 mahinon ki average pay**, saath mein notice / wages-in-lieu-of-notice; "token payment" nahi)'
  ground_truth: '**Industrial Disputes Act, 1947** ke tahat kisi "workman" (§2(s) mein paribhaashit; is term mein aam taur par wage threshold se oopar ke managerial / supervisory karmchari shaamil nahi hain) ke "**RETRENCHMENT**" ke liye procedural safeguards ka anupaalan zaroori hai. **§25F** (industrial establishment mein kisi bhi workman par laagu jisne kam se kam 1 saal continuous service ki ho): (a) reason bataate hue **ek mahine ka likhit notice**, ya uske badle wages; (b) **15 din ki average pay** prati poorn varsh continuous service (ya 6 mahine se adhik partial year) ke baraabar **retrenchment compensation**; (c) prescribed form mein **sambandhit sarkar / authority** ko notice. **§25G** — kisi vishesh category ke workmen ko retrench karte samay **"last in, first out" (LIFO)** ka niyam, jab tak ki employer kaaran darj na kare. **Chapter V-B (Sections 25K-25S, 100 ya adhik workmen waale "industrial establishments" par laagu)** — atirikt aavashyaktaayein: lay-off, retrenchment, ya closure ke liye sambandhit sarkar se **poorv anumati**; anumati ke bina action **avaidh** hai aur workmen ko poori back-wages ke saath continuous employment mein maana jaata hai. **Industrial Relations Code, 2020** ek samaan architecture rakhta hai parantu "industrial establishment" ki poorv-anumati threshold ko **300 workmen** tak badhaata hai (rajyon mein uniformly notified nahi). Kai rajyon ke sanshodhanon ya notifications ne threshold ko badhaaya hai; rajya-vishisht niyam satyaapit karein.'
  graceful_unknown: '"§25F (notice + 15 din × varsh compensation), Chapter V-B (100+ workmen poorv-anumati), IR Code 2020 ne 300 tak badhaaya (jahan notified)" — ye load-bearing facts hain. Kisi rajya mein vartman threshold alag-alag hai — rajya Labour Department ki site dekhein.'
