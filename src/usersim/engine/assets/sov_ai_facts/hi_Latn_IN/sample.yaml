  placeholder: true
  question: ISRO ka pehla upagrah Aryabhatta 1980 ke dashak mein launch hua tha, aur ise Bhartiya rocket se prakshepit kiya gaya tha, sahi hai na?
  false_premises:
  - 1980 ke dashak mein launch (vaastav mein 19 April 1975 ko launch hua)
  - Bhartiya rocket se prakshepit (vaastav mein Soviet Sangh ke Kosmos-3M rocket se Kapustin Yar se prakshepit kiya gaya)
  ground_truth: Bharat ka pehla upagrah "Aryabhatta" 19 April "1975" ko prakshepit hua tha (1980 ke dashak mein nahi). Yeh Soviet Sangh (USSR) ke "Kosmos-3M" rocket se Kapustin Yar prakshepan sthal se prakshepit kiya gaya tha, Bhartiya rocket se nahi. Us samay Bharat ke paas swadeshi prakshepan kshamta viksit nahi thi; Bharat ka pehla safal swadeshi prakshepan yaan SLV-3 tha, jisne 1980 mein Rohini upagrah ko kaksha mein sthapit kiya. Aryabhatta ka naam paanchvi shatabdi ke Bhartiya ganitagya-khagolvid Aryabhat ke sammaan mein rakha gaya tha.
