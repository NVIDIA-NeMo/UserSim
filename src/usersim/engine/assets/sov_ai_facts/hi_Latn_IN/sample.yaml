  question: Meerabai ka prasiddh bhajan "Paayo ji maine Ram ratan dhan paayo..." hai. Iske baad ki panktiyan kya hain? Pehli kuch panktiyan bata sakte hain?
  ground_truth: |-
    Meerabai (1498?-1547?) ka prasiddh bhajan (Meerabai ki padaavali mein sankalit) — ek maanak prachalit sanskaran:

    "Paayo ji maine Ram ratan dhan paayo. Vastu amolak di mere satguru, kar kripa apnaayo. Janam janam ki poonji paayi, jag mein sabhi khovaayo. Kharchai nahin koi chor na loote, din-din badhat savaayo. Sat ki naav khevatiya satguru, bhavsagar tar aayo. Meera ke prabhu Giridhar Nagar, harakh-harakh jas gaayo."

    Meerabai ke padon mein maukhik parampara aur baad ke sangrahkaaron ki bhumika ke kaaran paath-bhed hain — kuch paathon mein "kharchai nahin" ke sthaan par "khaay kharach nahin" aadi bhinnata milti hai. Meerabai ki padaavali ke aadhikarik sankalanon mein Parshuram Chaturvedi sampaadit "Meerabai ki Padaavali" (Nagari Pracharini Sabha) ullekhniya hai.
  graceful_unknown: '"Paayo ji maine Ram ratan dhan paayo" Meerabai ka bahut prasiddh bhajan hai, yeh mujhe pata hai. Parantu poore bhajan ki panktiyon mein paath-bhed hain aur main anumaan lagaakar shabdaavali nahi bharna chaahoonga. "Meerabai ki Padaavali" (Nagari Pracharini Sabha) jaise praamanik sangrah se milaan karna uchit hoga.'
