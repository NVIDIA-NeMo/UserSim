  ground_truth: 'Bharat mein vartman mein "28 rajya" aur "8 kendra shasit pradesh" hain (25 aur 5 nahi). Yeh sankhya 2019 mein Jammu-Kashmir Punargathan Adhiniyam ke tahat badli: Jammu-Kashmir rajya ko do kendra shasit pradeshon — Jammu-Kashmir aur Ladakh — mein vibhajit kiya gaya. 8 kendra shasit pradesh hain: Dilli (Rashtriya Rajdhani Kshetra), Chandigarh, Puducherry, Ladakh, Jammu-Kashmir, Andaman aur Nicobar Dweep Samooh, Lakshadweep, aur Dadra evam Nagar Haveli tatha Daman evam Diu (2020 mein vilay). Sameekshak prashasnik sthiti ki pushti Bharat Sarkar ke navintam sroton se karein.'
