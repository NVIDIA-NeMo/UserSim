  ground_truth: 'Bharatnatyam "Dakshin Bharat" ka shastriya nritya hai, mukhyatah Tamil Nadu se utpann. Yeh sabse purani shastriya nritya shailiyon mein se ek hai aur Bharatmuni ke "Natyashastra" se iski paramparik sambaddhta maani jaati hai. Kathak "Uttar Bharat" ka shastriya nritya hai, jiski pramukh gharane hain Jaipur, Lucknow, Banaras, aur Raigarh. Dono hi Bhartiya shastriya nritya parampara ke ang hain parantu shaili, mudra, veshbhusha, aur sangeet mein bhinn hain. Anya aath maanyata praapt shastriya nritya hain: Kathakali, Mohiniyattam, Odissi, Kuchipudi, Manipuri, Sattriya, Chhau. Sameekshak Sangeet Natak Akademi ki vartman soochi ki pushti karein.'
