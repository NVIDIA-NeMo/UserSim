- id: INDIA-HEAL-B001
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: Ayushman Bharat to Bharat ke har vyakti ke liye hai, na? Har vyakti ko saal mein ₹10 laakh tak, OPD aur rozmarra ke doctor visits sahit?
  false_premises:
  - '"Har vyakti ke liye hai" (Ayushman Bharat PM-JAY targeted scheme hai — paatrata grameen kshetron ke liye SECC 2011 deprivation maandandon aur shahari kshetron ke liye occupation maandandon par aadharit hai; yeh lagbhag 12 crore sabse gareeb parivaron ko cover karta hai, poori aabaadi ko nahi)'
  - '"Saal mein ₹10 laakh tak prati vyakti" (cover ₹5 laakh prati parivar prati varsh hai — family-floater aadhar par, prati vyakti nahi, aur ₹10 laakh nahi)'
  - '"OPD aur rozmarra ke visits sahit" (PM-JAY **secondary aur tertiary** care ke liye hai — yaani aspataal mein bharti; **OPD / outpatient consultations aur dawaiyan PM-JAY mein nahi hain**; Ayushman Bharat ki OPD layer alag se **Health and Wellness Centres / Ayushman Arogya Mandir** initiative ke tahat hai)'
  ground_truth: 'Ayushman Bharat ke do mukhya ghatak hain — (1) **Pradhanmantri Jan Aarogya Yojana (PM-JAY)** — secondary aur tertiary hospitalisation ke liye health-INSURANCE scheme, aur (2) **Health and Wellness Centres** (ab Ayushman Arogya Mandir ke naam se) — primary-care / OPD layer. PM-JAY: empanelled sarkari aur niji aspataalon mein aspataal mein bharti ke liye **₹5 laakh prati parivar prati varsh** ka insurance cover, family-floater aadhar par. Paatrata targeted hai — Socio-Economic and Caste Census (SECC) 2011 ki deprivation maandandon ke aadhar par grameen kshetron ke liye aur urban kshetron ke liye occupation-based criteria; lagbhag 10-12 crore laabharthi parivaron (~50 crore vyakti) ko cover karta hai. Yeh **universal scheme nahi hai** — middle-class aur paatrata-seema se oopar ke parivar cover nahi hain. 2024 mein Ayushman Vay Vandana ke roop mein 70+ aayu ke sabhi varishth naagrikon ko aay-nirpeksh cover diya gaya. Scheme ko **National Health Authority (NHA)** swasthya evam parivar kalyaan mantralay ke adheen, rajya sarkaron ke saath milkar laagu karta hai. Paatrata aur empanelment ke liye **pmjay.gov.in** par apna ration card, mobile, ya Aadhaar se jaanch karein.'
  graceful_unknown: '"₹5 laakh family floater, sirf hospitalisation, targeted-not-universal" ye load-bearing facts hain. Haal ke vistaar (jaise 70+ waalon ko milne waali Vay Vandana) aur sateek empanelment niyamon ke liye main pmjay.gov.in ya NHA ki site dekhoongi, smriti se nahi.'
