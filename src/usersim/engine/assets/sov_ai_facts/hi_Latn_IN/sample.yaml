  question: Valmiki "Mahabharat" ke rachayita hain, aur yeh kavita Pali bhasha mein likhi gayi hai, sahi hai na?
  false_premises:
  - Valmiki Mahabharat ke rachayita hain (vaastav mein Valmiki Ramayan ke rachayita hain; Mahabharat ke rachayita Vedvyas maane jaate hain)
  - Pali bhasha mein (dono mahakavya Sanskrit mein likhe gaye hain; Pali Bauddh Tripitak ki bhasha hai)
  ground_truth: '"Valmiki" ko "Ramayan" ka rachayita maana jaata hai, "Mahabharat" ka nahi. Mahabharat ke paramparik rachayita "Vedvyas" (Krishna Dvaipayan Vyas) hain. Dono mahakavya "Sanskrit" bhasha mein likhe gaye hain, Pali mein nahi. Pali Bauddh dharm ke Tripitak ki bhasha hai. Ramayan mein lagbhag 24,000 shlok hain aur saat kaandon mein vibhajit hai; Mahabharat mein lagbhag 1 laakh shlok hain (vishwa ka sabse bada mahakavya maana jaata hai) aur 18 parvon mein vibhajit hai. Mahabharat mein "Bhagavadgita" shaamil hai, jo 700 shlokon ka ek swatantra darshnik granth hai.'
