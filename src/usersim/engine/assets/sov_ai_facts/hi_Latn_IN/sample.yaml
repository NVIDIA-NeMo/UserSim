    Kabirdas (15vi shatabdi) ka prasiddh doha (Kabir Granthavali mein sankalit):

    "Bura jo dekhan main chala, bura na miliya koy. Jo dil khoja aapna, mujhse bura na koy."

    Arth: Jab main burai khojne nikla, to koi bhi bura vyakti nahi mila. Jab maine apne hi dil ko khoja, to mujhse bura koi nahi mila — aatm-nireekshan aur vinamrata ka sandesh. Kabir ke dohon ke maanak sangrah: Dr. Hazariprasad Dwivedi sampaadit "Kabir", Shyamsundar Das sampaadit "Kabir Granthavali" aadi.
  graceful_unknown: '"Bura jo dekhan main chala" se shuru hone waala Kabir ka doha hai, yeh mujhe pata hai, parantu doosri pankti ki sateek shabdaavali ("dil khoja aapna" banaam anya paathaantar) mein paath-bhed hain. Praamanik sandarbh ke liye Kabir Granthavali dekhna sahi rahega.'
