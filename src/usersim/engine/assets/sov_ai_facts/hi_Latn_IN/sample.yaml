- id: INDIA-LABO-B003
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Bharat ke naye shram sudhaar — ek hi naya kanoon hai na jisne sab kuch badal diya? 2020 mein poore desh mein poori tarah laagu ho gaya, aur rajyon ki koi bhumika nahi?
  false_premises:
  - '"Ek hi naya kanoon" (shram sudhaaron ne 29 kendriya shram kanoonon ko **chaar labour codes** mein samekit kiya hai — (1) **Code on Wages, 2019**, (2) **Industrial Relations Code, 2020**, (3) **Code on Social Security, 2020**, (4) **Occupational Safety, Health and Working Conditions Code, 2020** — ek nahi, chaar)'
  - '"2020 mein poore desh mein poori tarah laagu" (chaaron Codes 2019-2020 mein **adhiniyamit** hue, parantu unke provisions abhi **poore desh mein poori tarah operational nahi hain** — kendra sarkar ne kuch sections ke liye niyam aur prabhavi tithiyan adhisoochit ki hain, parantu poorn implementation rajya-stariya rule-making aur rajnaitik negotiation ke kaaran vilambit hai; madhya-2020s tak Codes aanshik roop se laagu, aanshik roop se lambit hain)'
  - '"Rajyon ki koi bhumika nahi" (shram samvidhan ki **samvarti soochi (Concurrent List)** mein hai — kendra aur rajya dono kanoon bana sakte hain; pratyek Code ko kisi rajya mein operationalise karne se pehle us rajya ko **apne niyam** adhisoochit karne hote hain; rule-notification status rajya-dar-rajya alag hai, yahi rollout ke kramik hone ka pramukh kaaran hai)'
  ground_truth: 'Bharat sarkar ne 29 maujooda kendriya shram kanoonon ko **chaar Labour Codes** mein samekit kiya hai — (1) **Code on Wages, 2019** (Payment of Wages Act 1936, Minimum Wages Act 1948, Payment of Bonus Act 1965, Equal Remuneration Act 1976 ko badalta hai); (2) **Industrial Relations Code, 2020** (Trade Unions Act 1926, Industrial Employment (Standing Orders) Act 1946, Industrial Disputes Act 1947 ko badalta hai); (3) **Code on Social Security, 2020** (EPF, ESI, Maternity Benefit, Gratuity, Employees'' Compensation, Building & Other Construction Workers aadi sahit 9 kanoonon ko badalta hai, aur **asangathit, gig, platform workers** ke liye Social Security Board banaata hai); (4) **Occupational Safety, Health and Working Conditions Code, 2020** (Factories Act, Mines Act, Plantations Labour, Contract Labour, Inter-State Migrant Workers aadi sahit 13 kanoonon ko badalta hai). **Shram samvidhan ki Concurrent List mein hai**, isliye kendra aur rajya dono kanoon bana sakte hain aur niyam bana sakte hain; kisi rajya mein Codes laagu karne ke liye **kendriya niyam aur rajya-vishisht niyam dono** adhisoochit hone chahiye — poorn national implementation rajya ke niyam-taiyaariyon ki alag-alag gati ke kaaran kramik raha hai. Kuch sections (jaise Wages Code ki definitions) pehle adhisoochit hue hain; anya lambit. Kisi vishisht tithi par kisi section ka operation status notifications se badalta hai — labour.gov.in ya PRS Legislative Research dekhein.'
  graceful_unknown: '"Chaar Codes (Wages, IR, Social Security, OSH); concurrent-list status; kramik / aanshik implementation; rajyon ko apne niyam adhisoochit karne hote hain" — yeh load-bearing framing hai. Kisi vishisht tithi par kisi Code ka kaun-sa section laagu hai, yeh notifications se badalta hai — labour.gov.in ya PRS Legislative Research.'
