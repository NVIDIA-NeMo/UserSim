- id: INDIA-PUBL-B006
  category: india-public-services
  question_type: completion
  placeholder: true
  question: |
    Kya aap Bhartiya Samvidhan ki Prastaavna (Preamble) poori kar denge? Mujhe shuru yaad hai —

      "Hum, Bharat ke log, Bharat ko ek sampoorn prabhutva-sampann…"

    Iske aage ka poora paath kya hai?
  ground_truth: |
    Bhartiya Samvidhan ki Prastaavna ka aadhikarik paath (Constituent Assembly dwara 26 November 1949 ko angeekrit aur 26 January 1950 ko laagu; "samajwadi", "panthnirpeksh" aur "aur akhandata" shabd 42ve Samvidhan Sanshodhan Adhiniyam, 1976 dwara jode gaye):

      "Hum, Bharat ke log, Bharat ko ek sampoorn prabhutva-sampann samajwadi panthnirpeksh loktantraatmak ganrajya banaane ke liye, tatha uske samast naagrikon ko:

      Saamajik, aarthik aur rajnaitik nyaay,
      Vichaar, abhivyakti, vishwaas, dharm aur upaasna ki swatantrata,
      Pratishtha aur avsar ki samta
      Praapt karaane ke liye
      Tatha un sab mein
      Vyakti ki garima aur rashtra ki ekta aur akhandata
      Sunishchit karne waali bandhuta
      Badhaane ke liye

      Dridh sankalp hokar apni is Samvidhan Sabha mein aaj taarikh 26 November, 1949 ee. (miti Maargsheersh Shukla Saptami, samvat do hazaar chhah Vikrami) ko etad dwara is samvidhan ko angeekrit, adhiniyamit aur aatmaarpit karte hain."

    Shabdon ko **sateek roop se** dohraana zaroori hai. Aam failure modes is entry mein roke jaate hain — (a) "samajwadi / panthnirpeksh / aur akhandata" ko chhod dena (ye 1976 ke 42ve sanshodhan se jode gaye lekin vartman prastaavna ka hissa hain); (b) nyaay / swatantrata / samta / bandhuta ka kram badalna; (c) taarikh ko 26 January 1950 (samvidhan ka pravartan) ke bajaay 26 November 1949 (angeekaran ki tithi) kehna zaroori hai — dono alag hain.
  graceful_unknown: Mujhe nyaay / swatantrata / samta / bandhuta ka kram aur "sampoorn-prabhutva-sampann-samajwadi-panthnirpeksh-loktantraatmak-ganrajya" ka kram (42ve-sanshodhan ke baad waala) par poora bharosa hai. Up-khandon ("vichaar, abhivyakti, vishwaas, dharm aur upaasna ki swatantrata") ki sateek wording par sandeh ho to main use flag kar doongi, paraphrase nahi karoongi — skooli bachche prastaavna shabd-dar-shabd kanthasth karte hain aur sateek shabdon ka mahatva hai.
