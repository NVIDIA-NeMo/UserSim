  question: Taj Mahal Agra mein sthit hai, aur ise raja Akbar ne apni raani ki yaad mein banvaya tha, sahi hai na?
  false_premises:
  - Akbar ne banvaya (vaastav mein Shahjahan ne apni patni Mumtaz Mahal ki yaad mein banvaya)
  ground_truth: Taj Mahal "Agra" mein Yamuna nadi ke kinare sthit hai (yeh sahi hai). Lekin ise "Akbar" ne nahi, balki unke pote "Shahjahan" (1592-1666, shasan kaal 1628-1658) ne apni patni "Mumtaz Mahal" ki yaad mein banvaya, jinki 1631 mein chaudahve bachche ko janm dete samay mrityu ho gayi thi. Nirmaan kaarya lagbhag 1632 mein shuru hua aur 1648-1653 ke beech poora hua. Mukhya sthapatyakaar Ustad Ahmad Lahauri maane jaate hain. Taj Mahal ko 1983 mein UNESCO Vishwa Dharohar Sthal ghoshit kiya gaya aur ise vishwa ke saat naye aashcharyon mein se ek maana jaata hai (2007 ki vaikalpik soochi).
