  question: Ganga nadi Himalaya se nikalkar Arab Sagar mein girti hai, aur iski lambai lagbhag 5000 kilometer hai, sahi hai na?
  false_premises:
  - Ganga Arab Sagar mein girti hai (vaastav mein Bangal ki Khaadi mein girti hai)
  - Lambai 5000 kilometer (vaastav mein lagbhag 2,525 kilometer)
  ground_truth: Ganga nadi "Bangal ki Khaadi" mein girti hai, Arab Sagar mein nahi. Uttarakhand mein Gangotri glacier se nikalkar yeh Uttar Pradesh, Bihar, Jharkhand aur Pashchim Bengal se hokar behti hai, aur Bangladesh mein Brahmaputra nadi (Padma) se milkar Sundarban delta banati hai. Bharat mein iski lambai lagbhag 2,525 kilometer hai, 5000 nahi. Arab Sagar mein girne waali pramukh nadiyan Narmada, Tapti, Sabarmati aur Sindhu (jo mukhyatah Pakistan se hokar behti hai) hain.
