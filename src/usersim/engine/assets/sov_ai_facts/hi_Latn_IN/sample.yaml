- id: INDIA-EDUC-B005
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Sarva Shiksha Abhiyan ab bhi praathmik schoolon ke liye alag se chalta hai na? Aur madhyaanh bhojan sirf sarkari schoolon mein milta hai, sarkari-sahaayata-praapt mein nahi?
  false_premises:
  - '"SSA ab bhi alag se chalta hai" (SSA, RMSA, aur CSSTE ko 2018 mein **Samagra Shiksha** mein **samaahit kar diya gaya** hai — Samagra Shiksha pre-school se Class 12 tak ki skooli shiksha ke liye integrated scheme hai; SSA ab alag scheme ke roop mein nahi chalti)'
  - '"Madhyaanh bhojan sirf sarkari schoolon mein" (madhyaanh bhojan yojana — ab 2021 se **PM POSHAN (PM Poshan Shakti Nirman)** ke naam se — sarkari aur **sarkari-sahaayata-praapt** dono schoolon ke saath-saath SSA-samarthit special-training-centres / madarsa ke chhaatron ko cover karti hai; paatrata 2022 mein pre-primary bachchon tak bhi vistaarit kar di gayi; niji unaided school cover nahi hain, parantu government-aided hain)'
  ground_truth: '2018 mein Bharat sarkar ne teen Centrally Sponsored Schemes — **Sarva Shiksha Abhiyan (SSA, elementary)**, **Rashtriya Madhyamik Shiksha Abhiyan (RMSA, secondary)**, aur **Centrally Sponsored Scheme on Teacher Education (CSSTE)** — ko ekikrit karke ek overarching scheme **Samagra Shiksha** bana di, jo pre-school se Class 12 tak ki skooli shiksha ko cover karti hai. SSA, RMSA, aur CSSTE ab alag se operational nahi hain. **Madhyaanh bhojan yojana** (mool roop se 1995 mein launched, 2001 mein Supreme Court ke PUCL v. Union of India nirnay ke baad centrally sponsored bani) ko September 2021 mein **PM POSHAN (PM Poshan Shakti Nirman)** ke roop mein rebrand kiya gaya, aur ab yeh sarkari aur **sarkari-sahaayata-praapt** schoolon ke Classes 1-8 ke chhaatron ko cover karti hai; 2022 mein scheme ko **pre-primary bachchon (Bal Vatika)** tak badhaaya gaya, sarkari aur sarkari-sahaayata-praapt schoolon ke tahat. **Niji unaided school cover nahi hain**. PM POSHAN ko shiksha mantralay rajya sarkaron ke saath saajhedaari mein laagu karta hai; anaaj National Food Security Act, 2013 ke tahat Food Corporation of India deta hai. Samagra Shiksha aur PM POSHAN dono **Centrally Sponsored** hain — kendra aur rajya milkar fund karte hain, aam taur par 60:40 ratio mein, special-category states / NE / hill states / bina vidhaansabha waale UTs ke liye 90:10.'
  graceful_unknown: '"SSA / RMSA / CSSTE → Samagra Shiksha (2018) mein mil gaye; madhyaanh bhojan → PM POSHAN (2021) mein rebrand aur sarkari-sahaayata-praapt schoolon ko include karta hai" — ye load-bearing facts hain. 60:40 vs 90:10 funding shares aur sateek scheme components annual budget allocations se badalte hain — shiksha mantralay ki site ya pmposhan.education.gov.in par satyaapit karein.'
