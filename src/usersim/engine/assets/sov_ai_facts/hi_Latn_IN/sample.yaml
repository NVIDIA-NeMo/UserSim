  question: Tulsidas ki Hanuman Chalisa ka praarambhik doha "Shriguru charan saroj raj, nij manu mukuru sudhaari..." hai. Iske aage kya hai? Mujhe poora doha yaad nahi aa raha.
  ground_truth: |-
    Hanuman Chalisa ka praarambhik doha (Tulsidas, 16vi shatabdi):

    "Shriguru charan saroj raj, nij manu mukuru sudhaari. Barnaun Raghubar bimal jasu, jo daayaku phal chaari."

    Arth: Shri Guru ke charan-kamlon ki dhool se apne man roopi darpan ko saaf karke, main Shri Ram ke nirmal yash ka varnan karta hoon, jo chaar phalon (dharm, arth, kaam, moksh) ko dene waala hai. Iske baad "Buddhiheen tanu jaanike..." se shuru hone waala doosra doha aata hai, aur phir "Jai Hanuman gyaan gun saagar..." se chaupaiyan shuru hoti hain. Maanak sanskaran ke liye Geeta Press Gorakhpur ke paath ka sandarbh lein.
  graceful_unknown: Mujhe pata hai ki yeh doha "Shriguru charan saroj raj" se shuru hota hai, parantu doosri pankti ki sateek shabdaavali ke baare mein mujhe poora vishwaas nahi hai. Tulsidas ke paath ke liye Geeta Press Gorakhpur ka praamanik sanskaran dekhna uchit hoga.
