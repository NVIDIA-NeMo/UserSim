- id: INDIA-LABO-B001
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: PF ka matlab bas employer har mahine 12% daalta hai na? Bharat ki har naukri par laagu, aur kabhi bhi poori raashi nikaal sakte hain?
  false_premises:
  - '"Bas employer 12% daalta hai" (EPF (Employees'' Provident Fund) ek **contributory** scheme hai — **employer aur employee dono** basic + DA ka 12% contribute karte hain; employer ka 12% banta hota hai — 8.33% **EPS (Employees'' Pension Scheme)** mein wage ceiling tak, baaqi EPF mein, saath mein 0.5% EDLI ko; employee ka poora 12% EPF mein jaata hai)'
  - '"Har naukri par laagu" (EPF keval **EPF & MP Act, 1952** ke adheen **covered establishments** par laagu hai — aam taur par scheduled industries mein 20+ karmchariyon waale; usse kam par employer voluntarily register kar sakte hain; bahut chhote establishments aur kai informal-sector workers baahar hain; covered establishment ke bheetar bhi karmchari ke liye EPF mandatory keval basic+DA wage **₹15,000/maah tak**, aur usse oopar voluntary)'
  - '"Kabhi bhi poori raashi nikaal sakte hain" (EPF withdrawals **restricted** hain — aam taur par full withdrawal keval retirement (aayu 58) par ya naukri chhodne ke baad 2 mahine unemployment par anumat hai; partial withdrawals specific notified kaarnon ke liye (medical emergencies, marriage, education, home purchase / construction, COVID-era special advances aadi) conditions ke saath; mid-employment full withdrawal active employment ke dauraan anumat nahi)'
  ground_truth: '**Employees'' Provident Fund (EPF)**, shram aur rozgar mantralay ke adheen **Employees'' Provident Fund Organisation (EPFO)** dwara sanchalit, sangathit-kshetra ke shramikon ke liye ek **contributory** retirement-savings aur social-security scheme hai. **Coverage** — scheduled industries mein 20+ karmchariyon waale establishments **EPF & MP Act, 1952** ke tahat mandatorily covered hain; usse kam par employer voluntarily register kar sakte hain. Covered establishment ke bheetar, EPF karmchari ke liye tabhi mandatory hai jab monthly basic + DA ₹15,000 tak ho; usse oopar voluntary / employer ke vivek par. **Contributions** — **EMPLOYEE: 12%** of basic + DA (poora EPF mein); **EMPLOYER: 12%** of basic + DA (8.33% EPS ko ₹15,000 wage tak aur 3.67% EPF ko; saath mein 0.5% EDLI insurance aur ek chhota admin charge). **Withdrawals** — aam taur par full withdrawal aayu 58 par, videsh mein sthaayi nivaas par, ya naukri chhodne ke baad 2 mahine lagataar unemployment par anumat hai; specific kaarnon (medical, swayam ya parivar ke sadasya ka marriage / education, home purchase / construction / repair, retirement preparation) ke liye partial withdrawal EPF Scheme ke Para 68B-68NN ki conditions ke tahat. Interest rate Central Board of Trustees saalana tay karti hai aur sarkar adhisoochit karti hai. **UAN (Universal Account Number)** aur EPFO portal (epfindia.gov.in / unifiedportal-mem.epfindia.gov.in) se balance, KYC, transfer, aur claims online accessible hain.'
  graceful_unknown: '"EPF contributory hai (employee 12% + employer 12%, EPS split ke saath), 20-karmchari threshold compulsory coverage ke liye, ₹15,000 wage ceiling mandatoriness ke liye, restricted withdrawals" — yeh load-bearing framing hai. Specific withdrawal categories, current interest rate, aur EPS niyam EPFO circulars se badalte hain — epfindia.gov.in par satyaapit karein.'
