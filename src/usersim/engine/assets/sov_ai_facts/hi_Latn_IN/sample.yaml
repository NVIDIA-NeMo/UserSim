- id: INDIA-EDUC-B004
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Mere pote ke videsh mein MBBS ke liye kendra sarkar poora interest course-end tak degi na? ₹50 laakh tak, kisi bhi desh ke liye, aur UPSC hi loan handle karti hai?
  false_premises:
  - '"Kendra sarkar poora interest course-end tak degi" (**Central Sector Interest Subsidy Scheme (CSIS)** education loans par interest subsidy sirf **Bharat mein** padhai ke liye moratorium period (course duration + 1 saal ya job ke 6 mahine baad, jo pehle ho) ke dauraan deti hai — aur keval un chhaatron ke liye jinke parivar ki vaarshik aay **₹4.5 laakh tak** ho aur jo **notified institutions** mein padhai kar rahe hon; **videsh ki padhai CSIS mein cover nahi hai**)'
  - '"₹50 laakh, kisi bhi desh ke liye" (**Vidya Lakshmi ek portal hai, loan nahi** — actual loans **individual banks** RBI guidelines / **Indian Banks'' Association (IBA) Model Education Loan Scheme** ke tahat dete hain; aam taur par bank limits Bharat mein padhai ke liye ₹10-20 laakh aur videsh ke liye ₹20-30 laakh, bina collateral; uchch raashi par collateral; koi ek flat ₹50-laakh ceiling nahi)'
  - '"UPSC handle karti hai" (UPSC **Union Public Service Commission** hai — yeh civil services pariksha conduct karti hai, loan administration nahi; education loans **scheduled banks** dete hain; **Vidya Lakshmi portal (vidyalakshmi.co.in)**, 2015 mein launched, multiple banks mein education loans ke liye apply karne ka ekal online platform hai — **Department of Financial Services / NSDL e-Governance** dwara sanchalit; CSIS ke subsidy claims **Canara Bank** nodal bank ke roop mein manage karti hai)'
  ground_truth: 'Bhartiya education loans ki sanrachna — (1) **Loans** scheduled commercial banks dete hain **Indian Banks'' Association (IBA) Model Education Loan Scheme** ke broad framework ke tahat, bank-specific variations ke saath. Aam limits: Bharat mein padhai ke liye lagbhag ₹10 laakh tak (₹4 laakh tak koi collateral nahi, ₹4-7.5 laakh mein third-party guarantee, ₹7.5 laakh se oopar collateral); videsh ki padhai ke liye ₹20-30 laakh tak (₹7.5 laakh se oopar collateralised). Specific banks (aur PSU bank schemes) isse adhik bhi jaa sakte hain. (2) **Vidya Lakshmi Portal (vidyalakshmi.co.in)** — ekal online application portal, 2015 mein Department of Financial Services / NSDL e-Governance dwara launched; chhaatra ek form se kai banks mein apply kar sakte hain; applications aur disbursal ka tracking. (3) **Central Sector Interest Subsidy Scheme (CSIS)** — moratorium period (course + 1 saal, ya job ke 6 mahine baad, jo pehle ho) ke dauraan **poora interest subsidy**, un chhaatron ke liye jinke parivar ki vaarshik aay **₹4.5 laakh tak** ho aur jo **notified institutions mein Bharat mein** padhai kar rahe hon (videsh ki padhai CSIS mein cover nahi); Canara Bank nodal bank. (4) **Padho Pardesh** (alpsankhyakon ke videsh mein padhai ke liye interest subsidy) 2022 mein band kar di gayi. (5) Kuch rajya sarkarein kendriya subsidy ke oopar top up karti hain. UPSC asambandhit hai — yeh civil services ke liye kendriya bharti nikaay hai.'
  graceful_unknown: '"Vidya Lakshmi portal hai, loan nahi; banks loans dete hain; CSIS interest subsidy keval Bharat ki padhai par laagu hai, videsh par nahi; UPSC ki koi bhumika nahi" — yeh load-bearing framing hai. Specific limits (₹10 laakh / ₹20 laakh / aadi) aur CSIS aay-seemaayein badalti rehti hain — vidyalakshmi.co.in aur Department of Financial Services schemes page par satyaapit karein.'
