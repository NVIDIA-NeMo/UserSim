- id: INDIA-DIGI-B002
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: DigiLocker mein koi bhi dastaavez rakh sakte hain na? Bank statements, credit cards, sab? Aur jo dastaavez main khud upload karoon uska legal wazan sarkari jaari dastaavez ke baraabar?
  false_premises:
  - '"Koi bhi dastaavez" (DigiLocker mukhyatah **issued documents** store karta hai — participating sarkari aur partner agencies (UIDAI, CBSE, RTO, EPFO, Income Tax, bima regulators, kuch banks, university boards aadi) dwara **jaari** dastaavezon ki digitally signed copies; users apne scanned dastaavez "Uploaded" / "My Drive" section mein bhi upload kar sakte hain — 1 GB tak free storage, parantu issued documents se alag legal status ke saath)'
  - '"Bank statements, credit cards" (adhikaansh rozmarra ke banks bank statements / credit card statements DigiLocker mein push **nahi** karte; Issuer integrations specific document types — driving licence, RC, Aadhaar, PAN (selectively), school/college mark sheets, Voter ID aadi — ko cover karte hain; niji credit-card statements DigiLocker issuer ecosystem ka hissa nahi hain)'
  - '"Main upload karoon uska legal wazan sarkari jaari ke baraabar" (**IT Rules** ki Rule 9A aur DigiLocker framework ke tahat, **issued documents** in DigiLocker (issuing authority dwara digitally signed) verification uddeshyon ke liye **physical originals ke baraabar / ORIGINAL DOCUMENTS** maane jaate hain; user-**uploaded** scans ka yeh same legal status **nahi** hai — ve convenience copies hain)'
  ground_truth: '**DigiLocker** **Digital India** programme ke tahat ek pramukh initiative hai, jo digital documents ko store aur verify karne ke liye cloud-aadharit platform pradaan karta hai. Yeh **MeitY** ke **National e-Governance Division (NeGD)** dwara operate hai. **Mukhya visheshtaayein** — (1) **Issued documents**: participating issuers dwara user ke DigiLocker mein push kiye gaye digitally signed documents — issuer ke digital signature ke maadhyam se real time mein verifiable. Issuers mein **UIDAI** (e-Aadhaar), Ministry of Road Transport (driving licence aur RC via Parivahan / Sarathi), Income Tax Department (PAN selectively), EPFO, school aur university boards (CBSE/CISCE/state boards), Election Commission (Voter ID — EPIC), aur kai rajya sarkari vibhag aur chuninda banks/insurers shaamil hain. (2) **Uploaded documents**: users self-managed "My Drive" section mein apne scanned documents upload kar sakte hain (1 GB tak free); inki utility hai parantu issuer-pushed documents ke samaan **legal/verification status nahi**. (3) **Legal validity**: DigiLocker mein issued documents **IT (Preservation and Retention of Information by Intermediaries) Rules 2011** ki Rule 9A aur **IT Act ki Section 9** ke tahat maany hain — sarkari agencies dwara verification uddeshyon ke liye physical originals ke baraabar; kai niji sansthaayein bhi inhe sweekaar karti hain. (4) Aadhaar / mobile-OTP ke maadhyam se authentication. **DigiLocker mobile app aur digilocker.gov.in** aadhikarik entry points hain. Issuer integrations aur sweekrit document types vahaan listed hain.'
  graceful_unknown: '"Issued vs uploaded — alag legal status; specific issuers ecosystem mein; Rule 9A IT Rules / Section 9 IT Act issued documents ko maany karte hain" — yeh load-bearing framing hai. Issuers aur sweekrit documents ki soochi badhti rehti hai; aapke specific institute ke liye digilocker.gov.in dekhein.'
