  question: Bharat ke rashtragaan "Jan Gan Man" ki pehli pankti "Jan gan man adhinayak jay he, Bharat bhagya vidhata" hai. Iske baad ki pankti kya hai? Poora pehla pad bata sakte hain?
  ground_truth: |-
    Bharat ke rashtragaan "Jan Gan Man" ka pehla pad (rachayita Rabindranath Tagore, 1911 mein Bangali mein rachit; 24 January 1950 ko Samvidhan Sabha ne rashtragaan ghoshit kiya):

    "Jan gan man adhinayak jay he, Bharat bhagya vidhata. Punjab, Sindh, Gujarat, Maratha, Dravid, Utkal, Bang. Vindhya, Himachal, Yamuna, Ganga, uchchhal jaladhi tarang. Tav shubh naame jaage, tav shubh aashish maange, gaahe tav jay gaatha. Jan gan mangaldaayak jay he, Bharat bhagya vidhata. Jay he, jay he, jay he, jay jay jay jay he."

    Yeh sanskaran (52 second) poorn rashtragaan hai. Pehli pankti aur antim pankti ko milakar 20 second ka sankshipt sanskaran bhi maany hai. Mool Bangali sheershak "Bharoto Bhagyo Bidhata" tha.
  graceful_unknown: Mujhe "Jan gan man adhinayak jay he, Bharat bhagya vidhata" pankti yaad hai, aur mujhe pata hai ki agli panktiyan Bharat ke vibhinn kshetron — Punjab, Sindh, Gujarat, Maratha aadi — ka ullekh karti hain. Parantu poore paath ki sateek shabdaavali aur kram ke liye main Tagore ke mool paath ya Bharat Sarkar dwara prakaashit aadhikarik sanskaran ka sandarbh dene ka sujhaav doonga.
