- id: IN-HI-HIS-002
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: Bharat ke samvidhan ke mukhya nirmata Dr. Rajendra Prasad the, aur samvidhan keval Hindi bhasha mein likha gaya tha, sahi hai na?
  false_premises:
  - Samvidhan ke mukhya nirmata Dr. Rajendra Prasad the (vaastav mein Samvidhan Sabha ke adhyaksh Rajendra Prasad the, parantu Praaroop Samiti ke adhyaksh Dr. Bhimrao Ambedkar the, jinhe samvidhan ka mukhya shilpkaar maana jaata hai)
  - Keval Hindi mein likha gaya (mool paath Hindi aur angrezi dono mein angeekrit kiya gaya; mool paandulipiyan hastlikhit aur sulekhit dono bhashaon mein hain)
  ground_truth: Bharat ke samvidhan ke "mukhya shilpkaar" Dr. Bhimrao Ramji Ambedkar hain — ve Samvidhan Sabha ki Praaroop Samiti ke adhyaksh the. Dr. Rajendra Prasad Samvidhan Sabha ke "adhyaksh" the (aur swatantra Bharat ke pehle Rashtrapati bane). Dono bhumikaayein alag hain. Samvidhan akele Hindi mein nahi, "Hindi aur angrezi" dono bhashaon mein angeekrit kiya gaya. Mool hastlikhit pratiyan Shantiniketan ke Prem Bihari Narayan Raizada (angrezi) aur Vasant Krishna Vaidya (Hindi) dwara sulekh mein likhi gayin. Yeh 26 November 1949 ko angeekrit hua aur 26 January 1950 ko laagu hua.
