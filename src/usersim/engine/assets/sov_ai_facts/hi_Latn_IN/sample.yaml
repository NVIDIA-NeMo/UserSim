- id: INDIA-FINA-B004
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Senior Citizens' Savings Scheme ki limit ab bhi ₹15 laakh hi hai na? 50 saal se oopar ka koi bhi open kar sakta hai, aur interest income tax se apne-aap kat jaata hai?
  false_premises:
  - '"Limit ab bhi ₹15 laakh" (SCSS ki maximum-deposit ceiling **Budget 2023** mein ₹15 laakh se **doguna ₹30 laakh** ki gayi, 1 April 2023 se prabhavi; ek vyakti ke sabhi SCSS accounts milaakar vartman cap **₹30 laakh** hai)'
  - '"50 saal se oopar ka koi bhi" (SCSS paatrata — **60 saal ya usse adhik** ke vyakti; ya 55+ parantu 60 se kam jo superannuation / VRS ke tahat retired hue hon aur retirement ke 1 mahine ke bheetar account khola ho; ya **50+ retired defence services** karmchari retirement ke 1 mahine ke bheetar; saamanya 50 saal ke vyaktiyon ke liye open nahi)'
  - '"Interest income tax se apne-aap kat jaata hai" (SCSS se interest **poori tarah taxable** hai, slab rate par "income from other sources" ke roop mein; threshold se adhik hone par bank/post office **TDS at 10%** kaatta hai (varishth naagrikon ke liye vartman threshold Section 194A ke tahat ₹50,000); **deposit (interest nahi)** Section 80C deduction ke liye ₹1.5 laakh tak qualify karti hai)'
  ground_truth: '**Senior Citizens'' Savings Scheme (SCSS)**, Government Savings Promotion Act, 2018 ke tahat banks aur post offices ke maadhyam se operate, varishth naagrikon ke liye sarkar-samarthit savings scheme hai. **Mukhya visheshtaayein** — (1) **Paatrata**: **60 ya usse adhik** aayu; ya superannuation / VRS / Special VRS ke tahat retired 55-59 (retirement ke 1 mahine ke bheetar); ya **50 ya usse adhik defence services retired** (retirement ke 1 mahine ke bheetar). (2) **Maximum deposit**: ek vyakti ke sabhi SCSS accounts milaakar **₹30 laakh** (1 April 2023 se prabhavi, ₹15 laakh se badhaai gayi). Joint account keval jeevansaathi ke saath anumat. (3) Minimum ₹1,000; ₹1,000 ke multiples mein deposits. (4) **Tenure**: **5 saal**, **3 saal atirikt** extendable (maturity ke 1 saal ke bheetar ek-baar extension). (5) **Interest**: dar timaahi aadhar par sarkar tay aur notified karti hai; depositor ke linked savings account mein timaahi paid. (6) **Tax treatment**: deposit Section 80C deduction ke liye ₹1.5 laakh aggregate cap ke bheetar qualify karti hai; **interest poori tarah taxable** hai "income from other sources" ke roop mein, Section 194A threshold se adhik hone par institution dwara TDS (vartman varishth naagrikon ke liye ₹50,000); seniors **Form 15H** submit kar sakte hain nil TDS ke liye yadi kul taxable income basic-exemption limit se neeche ho. (7) **Premature withdrawal** 1 saal ke baad penalty ke saath anumat (1-2 vs 2-5 saal ke beech vibhinn notified penalty percentages). Vartman timaahi interest rate **National Savings Institute / Department of Posts / participating bank** par satyaapit karein.'
  graceful_unknown: '"₹30 laakh cap (Budget 2023 mein ₹15 laakh se badhi), 60+ paatrata (retirement / defence carve-outs ke saath 55+/50+), interest taxable + TDS, 80C deposit par" — yeh load-bearing framing hai. Timaahi interest rate notifications se badalti hai.'
