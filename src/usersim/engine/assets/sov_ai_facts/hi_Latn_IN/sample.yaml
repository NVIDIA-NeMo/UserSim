- id: INDIA-LABO-B005
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Bharat ke Maternity Benefit Act mein 12 hafton ki paid leave milti hai na? Keval 100+ karmchariyon waali companies mein mahilaon ko, aur adoption cover nahi?
  false_premises:
  - '"12 hafton ki paid leave" (**Maternity Benefit (Amendment) Act, 2017** ne paid maternity leave 12 hafton se badhaakar **26 hafte** kar di hai — un mahilaon ke liye jinke 2 se kam jeevit bachche hain; teesre ya uske baad ke bachche ke liye 12 hafte bane rehte hain; surrogacy ki commissioning maa aur 3 mahine se kam ke bachche ko adopt karne waali maa ko 12 hafte)'
  - '"100+ karmchariyon waali companies mein" (yeh Act un establishments par laagu hai jinmein **10 ya adhik** persons kaaryarat hon — factories, mines, plantations, shops aur establishments, sarkari establishments, aur anya; 100+ nahi)'
  - '"Adoption cover nahi" (2017 ke sanshodhan ne **adopting maaon** (jahan adopted bachcha 3 mahine se kam ka ho) aur surrogacy ki **commissioning maaon** ke liye **12-hafton ki paid leave** jodi; isliye adoption ab cover hai, conditions ke saath)'
  ground_truth: '**Maternity Benefit Act, 1961**, **Maternity Benefit (Amendment) Act, 2017** se sanshodhit, covered establishments ki mahila shramikon ko paid maternity leave pradaan karta hai. **Mukhya praavdhaan** — (1) **PAID LEAVE**: pehle do bachchon ke liye **26 hafte** (apekshit prasav tithi se 8 hafte pehle tak aur baaqi baad mein); teesre ya uske baad ke bachche ke liye **12 hafte**; **adopting maaon** (3 mahine se kam ke bachche ko adopt karne par) aur **commissioning maaon** (surrogacy) ke liye **12 hafte** — bachcha saunpe jaane ke din se gine jaate hain. (2) **Establishment threshold**: factories, mines, plantations, sarkari establishments, aur 10 ya adhik persons ko rozgaar dene waali shops aur establishments par laagu. (3) **Paatrata**: mahila ne apekshit prasav tithi se turant pehle ke 12 mahinon mein niyokta ke saath kam se kam **80 din** kaam kiya ho. (4) **WAGES**: chhutti ki avadhi ke dauraan **average daily wage** ki dar se payment. (5) **Work from home**: jahan kaarya ki prakriti anumati de, employer 26-saptaah ki chhutti ke baad work-from-home ki anumati aapasi sehmati par de sakta hai. (6) **Creche facility**: 50 ya adhik karmchariyon waale establishments ko creche facility deni hoti hai, maa ko din mein 4 baar jaane ki anumati. (7) **Nursing breaks, maternity ke aadhar par termination nahi**, maternity leave ke dauraan dismissal ka pratishedh. **Code on Social Security, 2020** in provisions ko shaamil karta hai aur kuch had tak sanshodhit karta hai; current notifications par satyaapit karein.'
  graceful_unknown: '"26 hafte paid (pehle/doosre bachche ke liye), 10-karmchari threshold, adoption / surrogacy 12 hafte cover, 80-din work eligibility" — ye load-bearing facts hain. Naye Code on Social Security 2020 ke full notification par kuch provisions thode badal sakte hain — labour.gov.in par satyaapit karein.'
