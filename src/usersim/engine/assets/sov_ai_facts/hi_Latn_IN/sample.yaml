- id: INDIA-DIGI-B005
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: Bharat mein ab bhi koi data-protection kanoon nahi hai na? Online privacy ko 2000 ka IT Act hi govern karta hai, aur personal data videsh mein bina kisi rok bheja jaa sakta hai?
  false_premises:
  - '"Ab bhi koi data-protection kanoon nahi" (**Digital Personal Data Protection Act, 2023 (DPDP Act)** August 2023 mein adhiniyamit hua; yeh Bharat ka pehla comprehensive horizontal data-protection kanoon hai; iske provisions ka commencement phased ho raha hai — poorn operational rollout niyamon aur Data Protection Board ke gathan par nirbhar hai, parantu Act notified hai)'
  - '"Online privacy ko 2000 ka IT Act hi govern karta hai" (DPDP ke laagu hone tak, **IT Act, 2000 ki Section 43A ke tahat SPDI Rules** principal data-protection framework tha; **DPDP Act 2023** poorn operational hone par inhe **supersede** karega, jabki IT Act ke cybersecurity / unauthorised access ke kuch provisions alag se jaari rahenge)'
  - '"Videsh mein bina rok" (DPDP Act cross-border data transfers ko **default roop se** anumati deta hai, parantu sarkar ko **negative list** adhisoochit karne ki shakti deta hai un deshon ki jinke liye personal data ka transfer pratibandhit hai; sectoral regulators (jaise payment data localisation ke liye RBI, bima ke liye IRDAI, sectoral health-data rules) **atirikt data-localisation aavashyaktaayein** laga sakte hain)'
  ground_truth: '**Digital Personal Data Protection Act, 2023 (DPDP Act)**, August 2023 mein adhiniyamit, digital personal data ke processing par Bharat ka pehla comprehensive cross-sectoral kanoon hai. Mukhya visheshtaayein — (1) **Data Principals** (vyaktiyon) ke digital personal data par laagu, chaahe India mein processed ho ya India mein sevaayein / saamaan provide karne ke sambandh mein baahar. (2) **Data Protection Board of India (DPBI)** — ek quasi-judicial nikaay — enforcement aur complaints ke liye sthaapit; Board ka gathan Act ke commencement ke samay ho raha hai. (3) **Data Fiduciaries ke kartavya** — valid consent praapt karna, notice dena, data accuracy, security safeguards, breach notification Board aur affected Data Principals ko, uddeshya poora hone par data delete karna aadi. (4) **Data Principals ke adhikar**: access, correction, erasure, grievance redressal, post-mortem successor nominate karna; grievance redressal ka adhikar aur DPBI ko complaint. (5) **Bachche**: bachchon (18 se kam) ke personal data ke processing ke liye **parental consent** aavashyak; bachchon ke liye kuch processing activities **prohibited**. (6) **"Significant Data Fiduciaries"** ke atirikt obligations — Data Protection Officer, audit, DPIA. (7) **Penalties** scheduled ke anusaar prati breach **₹250 crore tak**. (8) **Cross-border transfer**: default roop se anumat, restricted countries ke liye negative-list mechanism ke saath; sector-specific localisation rules (RBI payment data, sectoral health rules) atirikt roop se laagu. (9) IT Act 2000 ke cybercrime, unauthorised access, aur intermediary liability provisions alag se jaari rehte hain. Act ka poorn operational implementation rules notify hone par nirbhar hai — current status MeitY ki site par satyaapit karein.'
  graceful_unknown: '"DPDP Act 2023 adhiniyamit; SPDI Rules ko supersede karta hai; DPBI gathit ho raha hai; default cross-border with negative-list; ₹250 crore adhiktam penalty" — yeh load-bearing framing hai. Operational rules aur DPBI ke gathan ka sateek status notifications se badalta hai — meity.gov.in par satyaapit karein.'
