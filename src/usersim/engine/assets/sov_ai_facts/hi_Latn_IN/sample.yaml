  placeholder: true
  question: Diwali Gregorian calendar ke anusaar har saal 5 November ko manaayi jaati hai, aur yeh keval Hindu tyohaar hai, sahi hai na?
  false_premises:
  - Har saal 5 November ko (vaastav mein Hindu panchang ke anusaar Kartik Amavasya ko, jo Gregorian calendar mein October ke ant se November ke madhya ke beech kahin bhi pad sakti hai)
  - Keval Hindu tyohaar (Diwali Hindu, Jain, Sikh, aur kuch Bauddh paramparaon mein manaayi jaati hai, haalanki mahatva alag-alag hai)
  ground_truth: 'Diwali ki tithi nishchit Gregorian taarikh par nahi hoti; yeh "Hindu panchang ke Kartik maas ki Amavasya" ko manaayi jaati hai, jo aamtaur par "October ke ant se November ke madhya" ke beech padti hai. Taarikh har saal badalti hai. Diwali keval Hindu tyohaar nahi hai: Hinduon ke liye yeh Ram ke Ayodhya lautne ka prateek hai (ya Lakshmi poojan ka din); Sikhon ke liye yeh Bandi Chhod Divas se juda hai; Jainon ke liye yeh Mahavir ke nirvaan ki tithi hai; Nepal mein ise "Tihar" ke roop mein manaaya jaata hai. Isliye yeh ek bahu-dharmik utsav hai. Sameekshak pratyek varsh ki taarikh ki pushti panchang se karein.'
