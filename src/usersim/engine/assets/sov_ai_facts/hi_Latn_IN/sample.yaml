- id: INDIA-HEAL-B002
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: CGHS Bharat ke kisi bhi salaried vyakti ke liye hai na? Har zile mein milta hai, aur koi maasik contribution nahi dena padta?
  false_premises:
  - '"Kisi bhi salaried vyakti ke liye" (CGHS keval **kendra sarkar** ke karmchariyon, pensionron — jo Central Civil Estimates se vetan/pension paate hon — aur unke aashriton tak seemit hai; niji kshetra aur rajya sarkar ke karmchari paatra nahi hain — unke liye ESI, rajya yojanaayein, ya niyokta ka swasthya bima alag se hota hai)'
  - '"Har zile mein milta hai" (CGHS keval **CGHS-covered cities** mein chalta hai — madhya-2020s tak lagbhag 80 shahar, mukhyatah rajya ki rajdhaaniyan aur bade nagar; **har zile mein nahi**)'
  - '"Koi maasik contribution nahi" (paatra karmchari apne pay-level ke anusaar **maasik contribution** dete hain — slabs samay-samay par revise hote hain; pensioners vaarshik ya ekmusht lifetime contribution dekar seva-nivritti ke baad bhi coverage jaari rakh sakte hain)'
  ground_truth: '**Central Government Health Scheme (CGHS)** ek **contributory** swasthya-yojana hai, jo **kendra sarkar** ke karmchariyon, pensionron aur unke aashriton ke liye hai. Paatrata — Central Civil Estimates se vetan paane waale kendra sarkar ke karmchari, Central Civil Estimates se pension paane waale pensioner, sansad, poorv-sansad, Sarvochch Nyayalay aur Uchch Nyayalayon ke sevaarat/seva-nivritt nyaayadheesh, kuch swaayatt sansthaon ke karmchari, swatantrata-senani, aur paarivarik sadasya. **Paatra nahi hain** — rajya sarkar ke karmchari, niji kshetra ke karmchari, saamanya janta. CGHS **CGHS-covered cities** mein wellness centres ke maadhyam se chalta hai — madhya-2020s tak lagbhag 80 shahar, mukhyatah rajya ki rajdhaaniyan aur pramukh nagar. Laabharthi apne **pay-matrix level** ke anusaar **maasik contribution** dete hain (slabs samay-samay par revise hote hain); pensioner vaarshik ya ekmusht lifetime contribution de sakte hain. Coverage mein wellness centres par outpatient consultations, CGHS-empanelled / sarkari aspataalon mein CGHS-approved daron par hospitalisation, dawaiyan, lab investigations, aur diagnostic services shaamil hain. CGHS-net se baahar kam vetan waale shramikon ke liye alag **Employees'' State Insurance (ESI)** scheme hai; grameen/shahari gareeb ke liye PM-JAY.'
  graceful_unknown: '"CGHS = sirf kendra sarkar ke karmchari + pensioner + aashrit, covered cities mein, maasik contribution ke saath" ye load-bearing facts hain. CGHS-covered cities ki vartman soochi aur contribution slabs samay-samay par badalte hain — cghs.gov.in ya navintam Office Memorandum dekhein.'
