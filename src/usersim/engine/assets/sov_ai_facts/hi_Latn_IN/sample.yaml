- id: INDIA-FINA-B003
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: NPS Tier I aur Tier II accounts to basically ek hi hain na? Dono kabhi bhi withdrawable, dono par same tax deduction, aur retirement par poora corpus tax-free nikaal sakte hain?
  false_premises:
  - '"Tier I aur Tier II basically ek hain" (**Tier I** primary, retirement-locked account hai — statutory restrictions aur tax benefits waala; **Tier II** ek **optional voluntary savings facility** hai — flexible deposit/withdrawal, **saamanya subscribers ke liye koi tax deduction nahi** (kendra-sarkar ke karmchariyon ke liye limited 80C deduction 3-saal lock ke saath), liquid kisi regular investment account jaisa)'
  - '"Dono kabhi bhi withdrawable" (**Tier I age 60 tak locked** hai, specified uddeshyon ke liye limited partial withdrawals; Tier II kabhi bhi freely withdrawable hai)'
  - '"Dono par same tax deduction" (Tier I contributions Section 80CCD(1) ke tahat ₹1.5 laakh 80C cap ke bheetar **plus** 80CCD(1B) ke tahat atirikt ₹50,000 ke liye qualify karte hain; **Tier II saamanya subscribers ko 80C deduction nahi deta** — keval kendra-sarkar ke karmchari jo Tier-II contribution ko 3 saal lock karein wahi 80C claim kar sakte hain)'
  - '"Poora corpus retirement par tax-free" (60 ki aayu par Tier-I corpus ka **60% tak** Section 10(12A) ke tahat **tax-free** nikaala jaa sakta hai; **baaqi 40% ka annuity khareedna anivaarya** hai, aur annuity income praapti ke varsh mein ordinary income ke roop mein **taxable** hoti hai)'
  ground_truth: '**NPS mein do account types** — **Tier I** (mandatory primary retirement account) aur **Tier II** (optional voluntary savings facility). **Tier I** — withdrawals 60 ki aayu tak locked (specified uddeshyon jaise bachchon ki uchch shiksha / vivah, pehla ghar, gambhir bimari ka ilaaj ke liye limited partial withdrawals, 3 saal contribution ke baad). **Age 60 par**, corpus ka **kam se kam 40%** PFRDA-empanelled annuity service provider se **annuity** khareedne mein jaana hai; **60% tak lump sum**, Section 10(12A) ke tahat tax-free. **Annuity income** praapti ke varsh mein ordinary income ke roop mein taxed. **Tax benefits** — Section 80CCD(1) swayam contribution ₹1.5 laakh 80C cap ke bheetar; Section 80CCD(1B) **atirikt ₹50,000 deduction**; 80CCD(2) employer contribution (basic+DA ka 10%, govt ke liye 14%) 80C ceiling ke oopar. **Tier II** — voluntary, kabhi bhi freely withdrawable, saamanya subscribers ke liye koi lock-in nahi. **Tier II for saamanya subscribers ko koi tax deduction nahi** milti. **Kendra-sarkar ke karmchari** Tier II contributions par 80C deduction claim kar sakte hain yadi 3 saal lock karein (special "Tier II tax saver" facility). Dono accounts ek hi investment menu (Active Choice ya Auto Choice across asset classes E, C, G, A) ka upyog karte hain; investment management PFRDA dwara appoint kiye gaye Pension Fund Managers dwara. eNPS / PFRDA ki site par sateek thresholds aur current rules satyaapit karein.'
  graceful_unknown: '"Tier I = retirement-locked tax benefits ke saath; Tier II = liquid voluntary savings, adhikaansh ke liye 80C nahi; 60-40 rule annuity ke saath at 60 (annuity income taxable)" — yeh load-bearing framing hai. Specific tax treatment edge cases (jaise kendra-sarkar ke karmchariyon ke liye 3-saal-locked Tier II) PFRDA / CBDT clarifications se badal sakte hain.'
