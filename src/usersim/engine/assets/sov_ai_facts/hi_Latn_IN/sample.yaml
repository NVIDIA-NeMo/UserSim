    Yeh Bachchan ki "Madhushala" ki lagbhag 135 rubaaiyon mein se ek hai, jismein "haala" (sharab/prem), "pyaala", "saaki", "Madhushala" ke Sufi-vedantik prateekaatmak prayog ke maadhyam se saampradayik ekta ka sandesh hai. Rajkamal Prakashan ke sanskaran ko maanak maana jaata hai. Paath mein thode-bahut sanskaran-bhed ho sakte hain.
