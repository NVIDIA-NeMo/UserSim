  placeholder: true
  question: Bharat ke pehle pradhanmantri Mahatma Gandhi the, aur unka karyakaal keval kuch mahinon ka tha, sahi hai na?
  false_premises:
  - Pehle pradhanmantri Mahatma Gandhi the (vaastav mein Jawaharlal Nehru the; Gandhi ne kabhi koi pad nahi liya)
