- id: INDIA-LABO-B004
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: NPS to sirf sarkari karmchariyon ke liye hai na? Purani pension ki tarah — aakhri salary par aadharit guaranteed amount. Niji kshetra waale join nahi kar sakte?
  false_premises:
  - '"Sirf sarkari karmchariyon ke liye" (NPS **kendra sarkar** ke 1 January 2004 ko ya uske baad join karne waale karmchariyon ke liye mandatory hai (adhikaansh rajyon ne bhi apne karmchariyon ke liye aisi hi tithiyan apnaayin), parantu yeh **18-70 varsh aayu ke kisi bhi Bhartiya naagrik** ke liye voluntarily bhi open hai — niji kshetra ke karmchari aur self-employed sahit; corporate NPS mein employer-employee co-contribution ki anumati hai)'
  - '"Purani pension ki tarah — aakhri salary par guaranteed amount" (NPS ek **defined-contribution** scheme hai — retirement par pension yogdaan aur chune gaye investment options ke baazaar returns par nirbhar hai, **koi nishchit pension ki guarantee nahi**; **Old Pension Scheme (OPS)**, jise 2004 mein naye kendra sarkar recruits ke liye NPS ne badla, ek **defined-benefit** scheme thi jo aakhri draw kiye gaye basic pay ke lagbhag 50% ko maasik pension ke roop mein deti thi; haal mein ghoshit **UPS — Unified Pension Scheme** dono ke beech mein baithti hai)'
  - '"Niji kshetra join nahi kar sakte" (NPS 18-70 aayu ke kisi bhi individual ke liye open hai — All-Citizen Model Tier I aur Tier II accounts; corporates corporate NPS model ke tahat bhi karmchariyon ko enroll kar sakte hain)'
  ground_truth: '**National Pension System (NPS)** **PFRDA Act, 2013** ke tahat **Pension Fund Regulatory and Development Authority (PFRDA)** dwara sanchalit hai. Yeh ek **defined-contribution** pension scheme hai — retirement par corpus aur parinaami annuity yogdaan aur baazaar returns par nirbhar hain, **koi fixed pension ki guarantee nahi**. **Paatrata**: (a) kendra-sarkar ke 1 January 2004 ko ya uske baad join karne waale karmchariyon ke liye **mandatory** (rajyon ne alag-alag tithiyon par apnaaya), (b) 18-70 aayu ke kisi bhi Bhartiya naagrik ke liye **All-Citizen Model** ke tahat **voluntary**, (c) niji kshetra ke karmchariyon ke liye employer co-contribution ke saath **corporate NPS**. **Accounts**: **Tier I** — primary retirement account, contributions retirement (60) tak locked, specified uddeshyon ke liye partial withdrawals; **Tier II** — voluntary, kabhi bhi withdrawable. **Age 60 par withdrawal** — kam se kam 40% corpus se **annuity khareedni hogi** (jo maasik pension degi); 60% tak lump sum nikaala jaa sakta hai, Section 10(12A) ke tahat tax-free. **Tax benefits**: Section 80CCD(1) (₹1.5 laakh 80C cap ke bheetar), 80CCD(1B) — swayam ke NPS yogdaan ke liye atirikt ₹50,000 deduction, 80CCD(2) — employer ka yogdaan basic+DA ke 10% tak (govt karmchariyon ke liye 14%) employer ke liye deductible aur 80C cap ke baahar. **Old Pension Scheme (OPS)** — defined-benefit, aakhri drawn basic pay ka ~50% — 2004 se pehle recruited sarkari karmchariyon par laagu thi (kuch rajyon ne haal mein apne rajya karmchariyon ke liye OPS par waapas lautne ka nirnay liya hai: Rajasthan, Chhattisgarh, Punjab aadi). **Unified Pension Scheme (UPS)** 2024 mein kendra sarkar ke karmchariyon ke liye ghoshit — 25+ saal service waalon ke liye (aakhri 12 mahinon ke average basic pay ka) 50% ki assured pension ke saath hybrid.'
  graceful_unknown: '"NPS = defined contribution, niji kshetra / All-Citizen ke liye open, OPS defined benefit thi, UPS 2024 hybrid hai" — yeh load-bearing framing hai. Rajya-dar-rajya OPS-revival nirnay aur UPS implementation ki fine print badalti rehti hai — PFRDA (npscra.nsdl.co.in / pfrda.org.in) aur Department of Personnel ki latest notifications par satyaapit karein.'
