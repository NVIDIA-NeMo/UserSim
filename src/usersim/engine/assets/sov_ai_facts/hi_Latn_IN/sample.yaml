    School mein padha hua Kabir ka wo prasiddh doha — poora kar denge? Yeh aise shuru hota hai —

      "Dukh mein sumiran sab karein, sukh mein karein na koy…"

    Doosri pankti kya hai?
  ground_truth: |
    Kabir ka prasiddh doha (15vi shatabdi, sant parampara):

      "Dukh mein sumiran sab karein, sukh mein karein na koy.
       Jo sukh mein sumiran karein, dukh kaahe ko hoy."

    Hindi mein arth: "Dukh aane par sab Ishwar ko yaad karte hain, sukh mein koi yaad nahi karta. Jo sukh mein bhi yaad kare, use dukh kyun hoga?" Kabir (lagbhag 1440-1518 isvi) Uttar Bhartiya bhakti aur sant sahitya ke mool stambhon mein se ek hain; unke dohe aur pad Hindu bhakti parampara aur Sikh Guru Granth Sahib dono mein sankalit hain. Doosri pankti "Jo sukh mein sumiran karein, dukh kaahe ko hoy" ko **sateek roop mein** dohraana is entry ki maang hai; koi aur doosri pankti gadhna, ya dohe ko Tulsidas, Rahim, ya kisi anya bhakti kavi ke naam se jodna — yeh failure mode hai.
