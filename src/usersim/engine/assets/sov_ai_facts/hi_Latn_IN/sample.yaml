- id: INDIA-HEAL-B003
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: ESI to Bharat ke har salaried karmchari par apne-aap laagu hota hai na? Keval employer hi contribute karta hai, employee ka koi share nahi? Aur ₹50,000-prati-maah vetan-seema sab factories par ek jaisi hai?
  false_premises:
  - '"Har salaried karmchari par apne-aap" (ESI keval **covered establishments** ke karmchariyon par laagu hota hai — 10+ shramikon waali non-seasonal factories aur kuch anya notified establishments — jo vetan-seema se **neeche** kamaate hain; uchch-vetan waale karmchari aur kai sectors / establishment sizes baahar hain)'
  - '"Keval employer contribute karta hai, employee ka share nahi" (ESI ek **contributory** scheme hai — **employer aur employee dono** contribute karte hain; vartman darein **employer 3.25% aur employee 0.75%** hain; darein samay ke saath badli hain — 2019 ki kami se pehle 4.75% / 1.75% theen)'
  - '"₹50,000-prati-maah vetan-seema" (ESI coverage ki vetan-seema saamanya shramikon ke liye **₹21,000/maah** aur divyaang vyaktiyon ke liye **₹25,000/maah** hai — ₹50,000 nahi)'
  ground_truth: '**Employees'' State Insurance (ESI)** yojana, shram aur rozgar mantralay ke adheen **Employees'' State Insurance Corporation (ESIC)** dwara sanchalit, sangathit-kshetra ke vetan-seema se neeche ke shramikon ke liye ek **contributory** saamajik-suraksha aur swasthya-bima scheme hai. Paatrata — covered establishments ke karmchari jo gross vetan **₹21,000/maah** tak kamaate hon (divyaangon ke liye **₹25,000/maah**). Covered establishments — 10+ shramikon waali non-seasonal factories (state-by-state thresholds alag) aur notified establishments jaise dukaanein, hotel, restaurants, cinemas, road-transport undertakings, newspapers, niji chikitsa/shaikshik sansthaan jinmein 10+ karmchari hon (kuch rajyon mein 20+). **Contribution darein (2019 ke baad se)** — **employer 3.25% aur employee 0.75%** of monthly wages, kul milakar 4% (pehle 4.75% / 1.75% theen). **Laabh** — bimit vyakti aur parivar ke liye ESI aspataalon/dispensaries mein chikitsa seva; sickness, maternity, disablement, aur dependants'' benefits; asthaayi ya sthaayi viklaangta ke liye nakad laabh; antim-sanskaar vyay. Vartman vetan-seema, contribution darein, aur covered establishments **esic.gov.in** par satyaapit karein.'
  graceful_unknown: '"ESI contributory hai (employer + employee), vetan-seema-baddh, sirf covered establishments mein" ye load-bearing facts hain. Specific contribution percentages aitihasik roop se badle hain (2019 mein combined 6.5% → 4%) aur vetan-seema bhi pehle revise ho chuki hai — esic.gov.in par satyaapit karein.'
