- id: IN-HI-HIS-004
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: Mughal samrajya ki sthapna Akbar ne ki thi, aur uski rajdhani hamesha Dilli rahi, sahi hai na?
  false_premises:
  - Mughal samrajya ki sthapna Akbar ne ki (vaastav mein Babar ne 1526 mein Panipat ke pehle yuddh ke baad ki)
  - 'Rajdhani hamesha Dilli rahi (rajdhani samay-samay par badli: Agra, Fatehpur Sikri, Lahore, aur baad mein Shahjahanabad/Dilli)'
  ground_truth: 'Mughal samrajya ki sthapna "Babar" (1483-1530) ne 1526 mein Panipat ke pehle yuddh mein Ibrahim Lodi ko parajit karne ke baad ki thi, Akbar ne nahi. Akbar (1542-1605) teesra Mughal samrat tha (Babar → Humayun → Akbar). Mughal rajdhani "hamesha Dilli" nahi rahi: Babar ne Agra ko rajdhani banaya; Akbar ne Agra aur Fatehpur Sikri (1571-1585) mein darbaar kiya; Jahangir ke samay aksar Lahore mein darbaar raha; Shahjahan ne 1648 mein nayi rajdhani "Shahjahanabad" (purani Dilli) ki sthapna ki. Akbar ke kaal mein samrajya ka bahut vistaar hua aur prashasan sudridh hua.'
