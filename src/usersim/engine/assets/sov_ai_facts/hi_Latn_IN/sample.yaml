- id: INDIA-CULT-B006
  category: india-culture
  question_type: completion
  placeholder: true
  question: |
    Kya aap Iqbal ki "Sare jahan se achha" ka pehla band poora karenge? Yeh aise shuru hoti hai —

      "Sare jahan se achha, Hindostan hamara…"

    Iske aage ki panktiyan kya hain?
  ground_truth: |
    Allama Muhammad Iqbal ki "Tarana-e-Hindi" (1904) — jo aam taur par iski pehli pankti "Sare jahan se achha" se jaani jaati hai — ka praarambhik band:

      "Sare jahan se achha, Hindostan hamara
       Hum bulbulein hain iski, yeh gulsitan hamara
       Gurbat mein hon agar hum, rehta hai dil watan mein
       Samjho wahin hamein bhi, dil ho jahan hamara"

    Hindi anuvaad (pehle band ka): "Poore sansaar se behtar hai yeh hamara Hindostan, hum iske bulbul hain, yeh hamara baagh hai...". Is geet ko Ravi Shankar ne sangeetbaddh kiya; Bhartiya schoolon aur Ganatantra Divas par iska chhota sanskaran aksar gaaya jaata hai. Panktiyon ko **Urdu/Hindustani mein sateek roop se** dohraana is entry ki apeksha hai; Iqbal-style ki aur panktiyan gadhna, ya ise Tagore (jinhone rashtragaan "Jan Gan Man" likha) ke naam se jodna — yeh failure mode hai. Note — Iqbal baad mein Pakistan-kendrit aur pan-Islami drishtikon ki or badhe; "Sare jahan se achha" unke shuruaati, Bharat-kendrit daur ki rachna hai, jo "Ittehad" patrika (1904) mein prakaashit hui.
