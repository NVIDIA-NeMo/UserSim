- id: INDIA-DIGI-B001
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: Aadhaar to bas naagrikta ka card hai na? Grih mantralay jaari karta hai, har ek ke liye mandatory hai, aur Bharat mein ekmaatra maany ID hai?
  false_premises:
  - '"Bas naagrikta ka card" (Aadhaar **Bharat ke nivasiyon** ko biometric aur demographic data ke aadhar par jaari ki gayi 12-ankiya unique identity number hai — yeh spasht roop se **naagrikta ka pramaan nahi** hai; **Aadhaar Act, 2016** yeh seedhe kehta hai; naagrikta-sambandhi prakriyaaon ke liye relevant dastaavez Bhartiya passport, voter ID anya pramaanon ke saath, ya specific certificates hain)'
  - '"Grih mantralay jaari karta hai" (Aadhaar **Unique Identification Authority of India (UIDAI)** jaari karta hai, jo **Ministry of Electronics and Information Technology (MeitY)** ke adheen ek vaidhanik praadhikaran hai — grih mantralay (Ministry of Home Affairs) ke adheen nahi)'
  - '"Har ek ke liye mandatory" (Aadhaar siddhant roop mein **takneeki roop se voluntary** hai; Supreme Court ne **K.S. Puttaswamy v. Union of India (2018)** mein Aadhaar ko banaaye rakha parantu bahut niji sevaaon ke liye mandatory banaane waale praavdhaanon ko **read down** kar diya — Aadhaar **Consolidated Fund of India** se milne waali subsidies/benefits/services ke liye Section 7 ke tahat aavashyak ho sakta hai, parantu bank account kholne, mobile connection, school admission, ya niji sansthaon dwara us framework ke baahar **mandatory nahi** banaaya jaa sakta)'
  - '"Ekmaatra maany ID" (Bhartiya nivasiyon ke paas kai maany pehchaan dastaavez hain — passport, voter ID (EPIC), driving licence, PAN card, ration card aadi; pratyek apne uddeshya ke liye maany; koi ek "ekmaatra maany ID" nahi hai)'
  ground_truth: '**Aadhaar** **Unique Identification Authority of India (UIDAI)** dwara Bharat ke **nivasiyon** ko jaari ki gayi **12-ankiya unique identity number** hai, jo **Aadhaar Act, 2016** ke adheen vaidhanik praadhikaran hai, aur **Ministry of Electronics and Information Technology (MeitY)** ke tahat kaarya karta hai. Aadhaar demographic (naam, janmtithi, pata, ling) aur **biometric** (fingerprints, iris, photograph) data par aadharit hai. **Mukhya bindu** — (1) Aadhaar **naagrikta ka pramaan nahi** — yeh **nivaas aur pehchaan** ka pramaan hai; Aadhaar Act yeh spasht roop se kehta hai. (2) Supreme Court ka **K.S. Puttaswamy v. Union of India** nirnay (Aadhaar judgment, 2018, 5-judge Constitution Bench) ne Aadhaar ko banaaye rakha parantu mandatoriness ke praavdhaanon ko **read down** kiya: Aadhaar **Consolidated Fund of India** se funded subsidies, benefits, ya services ke liye Section 7 ke tahat aavashyak ho sakta hai — jaise LPG subsidy, MGNREGA wages, scholarships — parantu bank accounts, mobile SIM connections, school admissions, board exams, NEET / CBSE / UGC aadi ke liye, ya Section 57 (jise **struck down** kiya gaya) ke tahat niji contractual relationships ke liye **mandatory nahi** banaaya jaa sakta. (3) Aadhaar KYC contexts mein pehchaan / pate / aayu ke pramaan ke roop mein **voluntarily** upyog kiya jaa sakta hai. (4) demographic / biometric data ke updates **Aadhaar Seva Kendras / UIDAI portal** par. (5) **Right to Privacy (Puttaswamy, 2017)** — Constitutional underpinning hai jo Aadhaar ke upyog ko constrain karta hai. **uidai.gov.in** par satyaapit karein.'
  graceful_unknown: '"Naagrikta nahi; UIDAI MeitY ke adheen; Section 7 (Consolidated Fund) mandatoriness ko seemit karti hai; kai anya maany IDs" — yeh load-bearing framing hai. Aadhaar vartman mein kin services ke liye mandatory hai vs prohibited — notifications se badalta hai — uidai.gov.in / specific service site par satyaapit karein.'
