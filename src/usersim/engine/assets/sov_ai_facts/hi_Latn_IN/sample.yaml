- id: INDIA-HEAL-B005
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: Aatmahatya to IPC ke tahat aaj bhi apraadh hai na? Aur 1987 ka Mental Health Act hi maansik swasthya par laagu hota hai, aur kisi rishtedaar ki baat par hi vyakti ko maansik aspataal mein bharti kar diya jaata hai?
  false_premises:
  - '"IPC ke tahat aatmahatya aaj bhi apraadh" (IPC ki Section 309 aatmahatya ke prayaas ko apraadh maanti thi, parantu **Mental Healthcare Act, 2017** (prabhavi 2018) — Section 115 — ne aatmahatya ke prayaas ko **decriminalise** kar diya; ab aatmahatya ka prayaas karne waale vyakti par §309 ke tahat muqadma nahi chalaaya jaa sakta; kendriya kanoon ne us apraadh-nirdhaaran ko prabhavi roop se badal diya hai)'
  - '"1987 ka Mental Health Act laagu hai" (1987 ka Mental Health Act **radd** kar diya gaya hai aur ise **Mental Healthcare Act, 2017** ne **pratisthaapit** kiya hai (7 July 2018 se laagu) — aaj ka governing framework yahi naya kanoon hai)'
  - '"Rishtedaar ki baat par bharti kar diya jaata hai" (MHCA 2017 mein **right to mental healthcare**, **advance directives** (Nominated Representative niyukt karne ka adhikar), aur treatment ke liye **informed consent** sthaapit hain; Involuntary admission keval vishisht paristhitiyon mein, **Mental Health Review Boards** ki sameeksha ke saath anumat hai — kisi rishtedaar ke akele adhikar par nahi)'
  ground_truth: '**Mental Healthcare Act, 2017 (MHCA, prabhavi 7 July 2018)** ne 1987 ke Mental Health Act ko radd-pratisthaapit kiya aur Bharat ke maansik-swasthya kanooni dhaanche ko naya roop diya. Mukhya praavdhaan — (1) **Right to Mental Healthcare** — har vyakti ko sarkar dwara sanchalit ya vitt-poshit maansik swasthya sevaaon tak pahunch ka adhikar. (2) **Advance Directive** — maansik rog waala vyakti likhit advance directive bana sakta hai jismein yeh bataaya jaaye ki uska ilaaj kaise hona chahiye ya nahi hona chahiye, aur ek Nominated Representative niyukt kar sakta hai. (3) **aatmahatya ke prayaas ka decriminalisation** — Section 115 yeh anumaan karta hai ki aatmahatya ka prayaas karne waala vyakti "gambhir tanaav mein" hai aur §309 IPC ke tahat use dandit nahi kiya jaayega; rajya ka kartavya hai ki care, treatment aur rehabilitation de taaki punaraavritti na ho. (4) Rajya-stariya **Mental Health Review Boards (MHRBs)** involuntary admissions aur treatment nirnayon ki sameeksha karte hain. (5) Kroor/amaanviya treatment **nishiddh** — jismein unmodified ECT, naabaaligon par ECT, treatment ke roop mein nasbandi, treatment ke roop mein chained restraint shaamil hain. (6) **Bima** — har bimaakarta ko maansik rog ke liye shaaririk rog ke samaan aadhar par medical insurance pradaan karna anivaarya (IRDAI clarification 2018). Rajya-stariya implementation asamaan hai aur framework viksit hota rehta hai — swasthya evam parivar kalyaan mantralay ki site ya MHCA 2017 Bare Act dekhein.'
  graceful_unknown: '"MHCA 2017 ne 1987 Act ko badla; §115 ke tahat aatmahatya ke prayaas ka decriminalisation; advance directives aur Nominated Representatives core hain" yeh load-bearing framing hai. Rajya-dar-rajya implementation status (jaise MHRBs kisi rajya mein functional hain ya nahi) alag-alag hai — navintam vaarshik report, HRW, aur Rashtriya Maanavadhikar Aayog ki documentation sabse achchi source hain.'
