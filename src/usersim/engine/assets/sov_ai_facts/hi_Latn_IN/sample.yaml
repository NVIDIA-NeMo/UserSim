- id: INDIA-FINA-B001
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: PPF mein har saal jitna chaaho daal sakte hain na? Lock-in bas 5 saal ka hai, aur interest fixed deposit ki tarah taxable hota hai?
  false_premises:
  - '"Jitna chaaho daal sakte hain" (PPF mein minimum (₹500) aur maximum (₹1,50,000) dono vaarshik contribution seemaayein hain; ek financial year mein lump sum ya 12 instalments tak deposit kar sakte hain, parantu apne sabhi PPF accounts ko milaakar ₹1.5 laakh se adhik nahi ho sakta)'
  - '"Lock-in bas 5 saal" (PPF account ki **maturity 15 saal** hai; maturity ke baad, ise aage bhi 5-year blocks mein indefinitely **extend** kar sakte hain — aage contributions ke saath ya bina; **partial withdrawals 7ve saal se** anumat hain; loans 3rd-6th year mein uplabdh)'
  - '"Interest FD ki tarah taxable" (PPF ka tax status **EEE** hai — **Exempt-Exempt-Exempt**: contribution Section 80C ke tahat ₹1.5 laakh tak deductible hai, har saal arjit interest **tax-free** hai, aur maturity proceeds bhi **tax-free** hain)'
  ground_truth: '**Public Provident Fund (PPF)** ek long-term small-savings scheme hai, jo vitt mantralay dwara sanchalit aur post offices tatha adhikaansh banks ke maadhyam se operate hoti hai. **Mukhya visheshtaayein** — (1) **Maturity**: pehli deposit ke financial year ke ant se **15 saal**; uske baad 5-year blocks mein indefinitely **extend** kiya jaa sakta hai (aage fresh contributions ke saath ya bina). (2) **Contribution**: minimum ₹500, **maximum ₹1,50,000** prati financial year, lump sum ya 12 instalments tak; depositor ke sabhi PPF accounts ko milaakar consolidated cap. (3) **Interest**: dar timaahi aadhar par sarkar tay karti hai aur saalana credit hoti hai; har mahine ki 5 taarikh aur aakhri din ke beech ke nyoontam balance par calculate hoti hai (isliye 5 taarikh tak ki deposit us mahine ke liye interest kamaati hai). (4) **Tax status**: **EEE** — contribution Section 80C ke tahat deductible (₹1.5 laakh aggregate cap ke bheetar); interest tax-free; maturity proceeds tax-free. (5) **Partial withdrawals 7ve financial year se** aage, formula ke adheen. (6) **Loan against PPF** 3rd se 6th year ke beech, do saal pehle ke balance ke 25% tak. (7) NRIs naye PPF accounts nahi khol sakte; NRI banne se pehle khole gaye maujooda accounts maturity tak continue kar sakte hain parantu extend nahi ho sakte. (8) **Public Provident Fund Act, 1968** ki Section 9 ke tahat court-attachment se quasi-protection (ab Government Savings Promotion Act, 2018 ke antargat samaahit). Vartman interest rate **National Savings Institute / Department of Posts** ki site par dekhein.'
  graceful_unknown: '"₹1.5 laakh annual cap, 15-year maturity, EEE tax status, partial withdrawals 7ve saal se" — ye load-bearing facts hain. Timaahi interest rate Government notifications se badalti hai — nsi.org / nsiindia.gov.in ya Department of Posts par satyaapit karein.'
