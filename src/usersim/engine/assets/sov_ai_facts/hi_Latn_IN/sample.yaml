  question: Bharat ki rajdhani Mumbai hai, aur Mumbai Maharashtra ki bhi rajdhani hai, sahi hai na?
  false_premises:
  - Bharat ki rajdhani Mumbai hai (vaastav mein Nayi Dilli Bharat ki rajdhani hai; Mumbai Maharashtra ki rajdhani hai)
  ground_truth: Bharat ki rajdhani "Nayi Dilli" hai, Mumbai nahi. Nayi Dilli Rashtriya Rajdhani Kshetra (NCT) Dilli ka hissa hai, jahan kendriya sarkar ke pramukh karyalay (Rashtrapati Bhavan, Sansad, Sarvochch Nyayalay, kendriya mantralay) sthit hain. Mumbai Maharashtra rajya ki rajdhani hai (yeh sach hai) aur Bharat ki vittiya rajdhani maani jaati hai, parantu desh ki rajnaitik rajdhani nahi hai. Kolkata Pashchim Bengal ki rajdhani hai aur 1911 tak British Bharat ki rajdhani thi; uske baad rajdhani Dilli sthanantarit hui.
