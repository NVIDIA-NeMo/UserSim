- id: INDIA-EDUC-B001
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Right to Education Act to Class 12 tak ki poori skooli shiksha ko cover karta hai na? Yeh 1990s se laagu hai, aur iska paalan sirf sarkari schoolon ko karna hai?
  false_premises:
  - '"Class 12 tak poori skooli shiksha" (RTE Act, 2009 **6 se 14** varsh ki aayu ke bachchon ke liye free and compulsory education ko cover karta hai — yaani Classes 1 se 8 (elementary education); yeh maadhyamik ya uchch-maadhyamik (Classes 9-12) tak nahi failta)'
  - '"1990s se laagu" (RTE Act 2009 mein adhiniyamit hua aur **1 April 2010** se laagu hua, samvidhan mein Article 21A ke sammilan (86va sanshodhan, 2002) ke baad — 1990s nahi)'
  - '"Paalan sirf sarkari schoolon ko" (yeh Act sabhi schoolon par laagu hai — sarkari, sarkari-sahaayata-praapt, special-category, aur unaided niji school bhi; niji unaided schoolon ko aarthik roop se kamzor varg (EWS) aur disadvantaged groups ke bachchon ke liye Class-1 ki **kam se kam 25% seatein** aarakshit rakhni hoti hain, jiski pratipoorti rajya dwara adhisoochit daron par ki jaati hai)'
  ground_truth: '**Right of Children to Free and Compulsory Education Act, 2009 (RTE Act)** samvidhan ke Article 21A ko laagu karta hai (jo 86ve sanshodhan, 2002 se joda gaya tha aur jisne elementary education ko maulik adhikar banaya). Yeh Act **1 April 2010** se laagu hua. Yeh **6 se 14 varsh** aayu ke har bachche ke liye **free and compulsory education** ki guarantee deta hai (Classes 1-8 / elementary education). Mukhya visheshtaayein — (1) **aarakshan**: har unaided niji school ko Class 1 (ya jahan laagu ho, pre-primary) ki kam se kam **25% seatein** aarthik roop se kamzor varg (EWS) aur disadvantaged groups ke bachchon ke liye aarakshit karni hoti hain, aur sarkar adhisoochit daron par tuition fee ki pratipoorti karti hai. (2) **maandand**: pupil-teacher ratio, infrastructure norms (boundary wall, shauchaalay, peene ka paani, library, khel ka maidan), school working days, teacher training norms. (3) admissions mein **koi capitation fee ya screening nahi**; mool niyam ke anusaar Class 8 tak no detention tha (baad mein 2019 ke sanshodhan se Class 5/8 se niyamit detention ki anumati di gayi, rajya ke vivek par). (4) padosi ka local school. Yeh Act keval **elementary education** (Classes 1-8) ko cover karta hai — maadhyamik (Classes 9-10) aur uchch-maadhyamik (Classes 11-12) rajya neetiyon ke tahat aate hain aur kendriya RTE framework ka hissa nahi hain, haalanki **National Education Policy 2020** is adhikar ko 3-18 aayu tak badhaane ki kalpna karti hai.'
  graceful_unknown: '"Article 21A → 86va sanshodhan 2002 → RTE Act 2009 → 1 April 2010 se laagu" ka kram aur 6-14 aayu / Classes 1-8 ka scope — ye load-bearing facts hain. 25% EWS aarakshan aur pratipoorti daron ka rajya-dar-rajya implementation bahut alag hai; specific rajya ke liye rajya shiksha vibhag authoritative source hai.'
