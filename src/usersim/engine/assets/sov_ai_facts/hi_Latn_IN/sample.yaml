- id: INDIA-LABO-B002
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Gratuity to naukri ke bas 1 saal baad hi mil jaati hai na? 30 din prati varsh service ki dar se, aur poori raashi income ke roop mein taxable hoti hai?
  false_premises:
  - '"Bas 1 saal baad" (**Payment of Gratuity Act, 1972** ke tahat gratuity aam taur par **termination** (retirement, resignation, death, disablement) par dey hai, jab karmchari ne **5 saal ki nirantar seva** (continuous service) poori ki ho — 1 saal nahi; **death ya disablement** ki sthiti mein 5-saal ki shart laagu nahi hoti)'
  - '"30 din prati varsh service" (formula **15 din ki mazdoori prati poora varsh** service (ya 6 mahine se adhik ka partial year), **aakhri mazdoori** ke aadhar par; piece-rated workers aur seasonal establishments ke liye formula alag hai)'
  - '"Poori raashi taxable" (gratuity ek **ceiling tak tax-exempt** hai — Payment of Gratuity Act ke antargat non-government employees ke liye exemption limit **₹20 laakh** (2018 mein ₹10 laakh se badhaai gayi); sarkari karmchariyon ke liye gratuity **poori tarah exempt**; exemption limit se oopar ki raashi salary income ke roop mein taxable hoti hai)'
  ground_truth: '**Gratuity** ek statutory terminal benefit hai, jo **Payment of Gratuity Act, 1972** ke tahat governed hai. **Paatrata**: covered establishments (non-seasonal factories, mines, oilfields, plantations, ports, railways, 10+ karmchariyon waali shops/establishments) ke karmchariyon ko rozgaar samaapti ke baad dey — retirement, resignation, superannuation, ya termination ke maadhyam se **5 saal ki nirantar seva** ke baad; **mrityu ya disablement** ki sthiti mein kanooni uttaraadhikaariyon ko (jahan 5-saal continuous-service ki shart **laagu nahi** hoti). **Formula**: monthly-rated karmchariyon ke liye, **GRATUITY = (aakhri BASIC + DA) × 15/26 × poore varsh service** (antim partial year 6 mahine se adhik ho to round up). Piece-rated aur seasonal establishments ke liye alag formulae. **Ceiling**: maximum statutory gratuity **₹20 laakh** (2018 ke sanshodhan se non-government employees ke liye ₹10 laakh se badhaai gayi); employers contract ke tahat adhik bhi de sakte hain. **Tax treatment**: Income-tax Act ki Section 10(10) ke tahat gratuity **kendriya / rajya / sthaaniya sarkari karmchariyon ke liye poori tarah exempt**; Payment of Gratuity Act ke antargat karmchariyon ke liye (a) ₹20 laakh, (b) actual gratuity received, (c) 15 din ki mazdoori × poore varsh — inmein se **nyoontam** tak exempt; uske adhik ki raashi taxable. "Continuous service" ki paribhasha (Section 2A) mein lay-off, leave, ya maternity aadi ke dauraan anupasthiti shaamil hai.'
  graceful_unknown: '"5 saal continuous service, 15 din × varsh × aakhri basic+DA / 26, ₹20 laakh exempt cap, mrityu/disablement mein 5-saal chhoot" — yeh load-bearing framing hai. Specific calculation edge cases (piece-rated, seasonal) aur Code on Wages / Social Security Code ke naye provisions ke notification mein sambhavit badlaav — navintam gazette aur labour.gov.in par satyaapit karein.'
