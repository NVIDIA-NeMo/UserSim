- id: INDIA-EDUC-B002
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: NEET aur JEE to ek hi exam hain na? AICTE dono conduct karta hai, aur ek hi score se kisi bhi IIT, AIIMS, ya law school mein admission mil jaata hai?
  false_premises:
  - '"NEET aur JEE ek hi exam" (ye alag-alag streams ke liye alag-alag national entrance exams hain — **NEET-UG** undergraduate medical/dental admissions (MBBS, BDS, AYUSH, aadi) ke liye; **JEE Main aur JEE Advanced** engineering admissions ke liye — Main se NITs/IIITs/CFTIs mein, Advanced se IITs mein; syllabi, pattern, aur qualifying institutes alag hain)'
  - '"AICTE dono conduct karta hai" (NEET aur JEE **National Testing Agency (NTA)** dwara conduct hote hain, AICTE dwara nahi; **AICTE All India Council for Technical Education** hai — yeh technical education ko regulate karta hai aur engineering / management programmes ko approve karta hai, parantu entrance exams conduct nahi karta)'
  - '"Ek score se IIT, AIIMS, law school" (har ke liye alag exam — IITs **JEE Advanced** (JEE Main qualify karne ke baad) se; **AIIMS-MBBS** ab **NEET-UG** se admit karta hai (2020 se — pehle apni alag exam thi); national **law universities (NLUs)** mein admission **CLAT** se hota hai, jo poori tarah alag entrance hai)'
  ground_truth: 'Bhartiya higher-education entrance exams stream-specific hain aur alag-alag bodies dwara conduct hote hain. **NEET-UG (National Eligibility cum Entrance Test, Undergraduate)** — MBBS/BDS/AYUSH/Veterinary undergraduate seats mein admission ke liye ekal national exam; NTA dwara conduct; 2020 se AIIMS-MBBS aur JIPMER bhi ismein shaamil hain (pehle alag exams theen). **JEE Main** — NTA dwara conduct; NITs, IIITs, aur anya Centrally Funded Technical Institutions (CFTIs) ke liye qualifier, aur JEE Advanced ka qualifier bhi. **JEE Advanced** — host IIT (JAB ke adheen) har saal baari se conduct karta hai; IITs mein admission. **CLAT (Common Law Admission Test)** — Consortium of NLUs dwara conduct; adhikaansh national-level law programmes mein admission. **CUET-UG** — central universities ke liye common entrance (2022 se). **National Testing Agency (NTA)** — 2017 mein sthaapit — zyaadatar badi national-level entrance exams conduct karti hai; **AICTE** technical/management education ka regulator hai, exam-conducting body nahi. NEET-PG, NEET-MDS (postgraduate medical/dental ke liye) bhi NTA alag se conduct karta hai.'
  graceful_unknown: '"NEET ≠ JEE; NTA zyaadatar conduct karta hai; AICTE regulator hai, exam-conductor nahi; CLAT law ke liye alag hai" — yeh load-bearing framing hai. Haal ke badlaav (jaise AIIMS-MBBS ka NEET mein 2020 mein vilay) aur kisi vishisht institute ke liye vartman exam — sanstha ki admissions page ya nta.ac.in dekhein.'
