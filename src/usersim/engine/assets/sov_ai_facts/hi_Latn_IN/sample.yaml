- id: INDIA-HEAL-B004
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: Har Bhartiya varishth naagrik ko 60 ki umar hote hi ₹3,000 maasik vriddhaavastha pension apne-aap mil jaati hai na? Aur har jagah free aspataal care bhi?
  false_premises:
  - '"₹3,000 maasik har senior ko" (kendriya **Indira Gandhi National Old Age Pension Scheme (IGNOAPS)** — NSAP ke adheen — 60-79 aayu varg ke liye ₹200/maah aur 80+ ke liye ₹500/maah deti hai — ₹3,000 nahi; kai rajya (Kerala, Tamil Nadu, Andhra Pradesh, Delhi aadi) apni rajya yojanaaon se top-up dete hain, isliye vaastvik raashi rajya-dar-rajya kaafi alag hoti hai)'
  - '"60 ki umar hote hi apne-aap" (IGNOAPS targeted hai — **gareebi-rekha se neeche** ke vyaktiyon ke liye; paatrata rajya ke BPL maandandon ke viruddh tay hoti hai; non-BPL seniors swatah paatra nahi hain)'
  - '"Har jagah free aspataal care" (seniors ke liye free ya subsidised inpatient care specific schemes se aati hai — PM-JAY ka **Ayushman Vay Vandana** ab 70+ aayu ke sabhi naagrikon ko aay-nirpeksh cover (₹5 laakh family floater) deta hai; rajya yojanaayein alag-alag hain; OPD aur routine care niji suvidhaaon par aam taur par free nahi hain)'
  ground_truth: 'Bhartiya varishth naagrikon ke kalyaan aur swasthya ke liye kai alag-alag schemes hain — paatrata, raashi, aur coverage sab alag. (1) **Indira Gandhi National Old Age Pension Scheme (IGNOAPS)** — National Social Assistance Programme (NSAP) ke tahat, grameen vikas mantralay dwara — kendriya hissa BPL vyaktiyon ke liye 60-79 ki aayu mein ₹200/maah aur 80+ ke liye ₹500/maah; rajya apni schemes se ise kaafi badhate hain (kai rajya apne varishthon ko ₹1,000-3,000+ dete hain, IGNOAPS ke oopar parat ke roop mein). (2) **Ayushman Vay Vandana** (2024 mein ghoshit) — PM-JAY ka vistaar jo 70+ aayu ke **sabhi** naagrikon ko aay-nirpeksh cover karta hai, maanak ₹5 laakh family-floater hospitalisation cover ke saath. (3) **Rashtriya Vayoshri Yojana (RVY)** — BPL varishthon ke liye free assistive aids (chhadi, wheelchair, hearing aids, dentures, chashma). (4) Rajya vriddhaashram aur Senior Citizen Welfare Funds. (5) **Maintenance and Welfare of Parents and Senior Citizens Act, 2007** — santaan/rishtedaaron se bharan-poshan ka kanooni adhikar. Pension aur swasthya-cover schemes alag hain; specifics ke liye NSAP portal (nsap.nic.in), rajya samaj-kalyaan vibhag, pmjay.gov.in dekhein.'
  graceful_unknown: '"Alag-alag schemes alag cheezon ke liye — pension ₹200/500 (rajya-top-ups ke saath), 70+ ke liye swasthya PM-JAY/Vay Vandana se, aids RVY se" yeh load-bearing framing hai. Rajya-dar-rajya pension top-ups bahut alag hain; specific rajya ke liye rajya samaj-kalyaan vibhag ki site dekhein.'
