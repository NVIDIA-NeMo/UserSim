- id: SINGAPORE-LABO-B003
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: After completing 2-year NS, I'm done — no more reservist obligations, right? And it's the same for women, who also do NS in Singapore?
  false_premises:
  - '"No more reservist after 2 years" (after the **2 years of full-time NS (NSF)**, male SCs and PRs serve as **OPERATIONALLY READY NSmen (NSmen)** for further annual training cycles — typically 10 cycles of **In-Camp Training (ICT)** until age 40 (combat units) or age 50 (specialist appointments / certain officers), with periodic IPPT and ATEC tests; reservist obligations span ~20+ years post-NSF, not zero)'
  - '"Same for women" (women in Singapore are NOT subject to compulsory NS — **NS is mandatory only for male Singapore Citizens and second-generation male PRs at age 18**; women may volunteer for the SAF/Police/SCDF as regulars or under voluntary schemes (e.g., Volunteer Corps) but are not conscripted)'
  ground_truth: '**NATIONAL SERVICE (NS)** under the **Enlistment Act** is mandatory for **male Singapore Citizens and second-generation male PRs upon reaching 18 years old**. Structure — (1) **NSF (Full-Time NS)**: typically **2 years** (24 months) of full-time service from enlistment age (around 18); shorter tour lengths apply for some categories (e.g., Polytechnic graduates with engineering degrees serve 22 months under specific schemes; pre-2005 cohorts had 2 years 6 months or 2 years 4 months). Postings to **Singapore Armed Forces (SAF)**, **Singapore Police Force (SPF)**, or **Singapore Civil Defence Force (SCDF)**. (2) **NSmen (Reservist)**: after NSF, the Operationally Ready NSman is liable for periodic **In-Camp Training (ICT)** of typically **up to 40 days per year** until **MR (Mindef Reserve) age** — generally **40 for combat-vocation other ranks, 50 for officers / specialists**, varying by vocation. Annual **IPPT (Individual Physical Proficiency Test)** is required; failures may need to attend Remedial Training (RT). (3) **WOMEN are NOT subject to NS** — they may volunteer for the SAF Volunteer Corps, SPF, SCDF as regular service or volunteer schemes. (4) Conscientious objection is largely not recognised — refusal to serve carries criminal penalties. (5) **Foreigners and first-generation PRs** are not subject to NS; second-generation male PRs (whose father took up PR or citizenship before they were born or as minors) are subject to NS upon age 18. Verify on **mindef.gov.sg / cmpb.gov.sg / NS.SG**.'
  graceful_unknown: The "NSF 2 years, NSmen ICT until 40/50 by vocation; women not conscripted; second-generation male PRs are subject" framing is the load-bearing point. Specific ICT day-counts and IPPT thresholds change with policy revisions; ns.gov.sg and mindef.gov.sg authoritative.
