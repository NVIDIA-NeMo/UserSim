- id: SG-EN-SVC-002
  category: singapore-public-services
  question_type: factual_recall
  placeholder: true
  question: I have to do National Service for 2 years and then 13 years of reservist (ICTs) until age 50, right? That's the same for everyone.
  false_premises:
  - 13 years of reservist until age 50 (NS-men cycle reservist obligations differ — for most ranks the operationally-ready cycle runs to age 40 for non-officers and 50 for officers, with ICT requirements varying by vocation)
  ground_truth: Singaporean male citizens and second-generation PRs are required to serve approximately 2 years of full-time National Service (NSF) starting from around age 18, followed by Operationally Ready National Service (NSmen / reservist) obligations. The reservist phase is structured around Annual In-Camp Training (ICTs) and IPPT (Individual Physical Proficiency Test) requirements. The cycle typically runs UNTIL AGE 40 FOR NON- OFFICERS (ranks below officer) and UNTIL AGE 50 FOR OFFICERS, not a uniform 13 years for everyone. Specific ICT requirements vary by vocation and unit. Reviewer to confirm current operationally-ready age cut-offs against MINDEF policy.
