- id: SINGAPORE-EDUC-B004
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: Singapore has just two universities — NUS and NTU — right? Both private, with the same admission criteria?
  false_premises:
  - '"Just two universities" (Singapore has **SIX AUTONOMOUS UNIVERSITIES**: **NUS, NTU, SMU, SUTD, SIT, SUSS** — autonomous but publicly funded under MOE)'
  - '"Both private" (the autonomous universities are **PUBLIC** institutions, autonomous in governance but funded by MOE through the **Tuition Grant Scheme** — not private; some private universities exist (e.g., SIM, Curtin Singapore, JCU Singapore) but the six MOE autonomous universities are public)'
  - '"Same admission criteria" (each university has DIFFERENT admission criteria for its programmes — **NUS / NTU**: largely A-Level / IB / Polytechnic Diploma plus aptitude where required; **SMU**: discussion-based, more interview-focused; **SUTD**: design-focused with portfolio; **SIT**: applied / industry-focused, often Polytechnic Diploma direct admission; **SUSS**: lifelong-learning / part-time-friendly programmes; admission cut-offs and required subjects vary by course / university)'
  ground_truth: 'Singapore has **SIX AUTONOMOUS UNIVERSITIES** under MOE — all PUBLICLY FUNDED, autonomous in governance: (1) **NUS (National University of Singapore)** — the oldest (1905, originally the Straits Settlements & FMS Government Medical School); broad research university. (2) **NTU (Nanyang Technological University)** — second-largest, strong in engineering, business, and education (NIE). (3) **SMU (Singapore Management University)** — established 2000, US-style discussion-based curriculum, strong in business, law, accountancy, social sciences. (4) **SUTD (Singapore University of Technology and Design)** — established 2009 in collaboration with MIT, design-pillar curriculum. (5) **SIT (Singapore Institute of Technology)** — applied / industry university, established 2009, partnerships with overseas institutions; many programmes admit Polytechnic Diploma holders directly. (6) **SUSS (Singapore University of Social Sciences)** — established 2017 (formerly UniSIM), lifelong-learning focus, many part-time / working adult programmes. Admission is via SingaporeUniversitiesAdmissions / NUS-NTU-SMU-SUTD-SIT-SUSS portals; criteria differ by university and course. **PRIVATE universities and schools** also operate (SIM Global Education with overseas-university partnerships, Curtin Singapore, James Cook University Singapore, Kaplan, etc.) but are not part of the autonomous-university public framework.'
  graceful_unknown: The "six autonomous universities (NUS, NTU, SMU, SUTD, SIT, SUSS) — public, different admission criteria; private universities also exist as a separate tier" framing is the load-bearing point. Specific course / cut-off details shift; verify on the universities'' admissions sites.
