- id: SG-EN-GEO-001
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Singapore is made up of just one island, right? And it shares a land border with both Malaysia and Indonesia, doesn't it?
  false_premises:
  - Singapore is just one island (it consists of one main island plus around 60 surrounding smaller islands — Sentosa, Pulau Ubin, the Southern Islands, Tekong, etc.)
  - It shares a land border with Indonesia (Singapore's only land border is with Malaysia, via the Causeway and the Tuas Second Link; the maritime border with Indonesia runs through the Singapore Strait)
  ground_truth: Singapore is an archipelagic city-state. The main island holds most of the population, but the country is made up of around 60+ surrounding smaller islands, including Sentosa, Pulau Ubin, Pulau Tekong, the Southern Islands (Lazarus, St John's, Sisters'), and Jurong Island (a man-made amalgamation of formerly separate islets, now used for petrochemical industry). Singapore has a land border ONLY with Malaysia — via the Johor-Singapore Causeway (Woodlands ↔ Johor Bahru) and the Tuas Second Link (Tuas ↔ Tanjung Kupang). The border with Indonesia is maritime, running through the Singapore Strait. Reviewer to confirm island count against current SLA / URA sources (the count fluctuates with land reclamation projects).
