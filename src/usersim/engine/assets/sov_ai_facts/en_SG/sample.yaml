- id: SINGAPORE-FINA-B003
  category: singapore-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Singapore Savings Bonds are basically same as a fixed deposit, no? Locked for 10 years, can't redeem early, no maximum holding limit?
  false_premises:
  - '"Basically same as fixed deposit" (SSBs are **government-backed bonds** issued by **MAS / Singapore Government**, NOT bank fixed deposits; they have **STEP-UP interest rates** (lower in early years, higher later, designed to incentivise long-term holding) and pay coupons every 6 months — different mechanics from FDs which have flat rates)'
  - '"Can''t redeem early" (SSBs CAN be REDEEMED **monthly** at any time before the 10-year maturity, with **no penalty** — you get back face value plus accrued unpaid interest; this is a key differentiator from FDs which typically penalise early withdrawal)'
  - '"No maximum holding limit" (each individual is subject to a **maximum holding of S$200,000 in SSBs** (across all SSB issues combined); minimum subscription per issue is **S$500 in S$500 increments**; not unlimited)'
  ground_truth: '**Singapore Savings Bonds (SSBs)** are non-tradable government-backed retail bonds issued monthly by the **Singapore Government** under the **Government Securities Act**, distributed through the **Monetary Authority of Singapore (MAS)** to retail investors. KEY FEATURES — (1) **TENURE**: 10 years, with **STEP-UP interest rates** (lower in years 1-2, higher in years 9-10), so the longer held, the higher the average return. (2) **MIN/MAX**: minimum subscription **S$500** in **S$500 increments**; maximum holding **S$200,000 per individual** across all SSB issues combined. (3) **REDEMPTION**: REDEEMABLE MONTHLY at any time before maturity, no penalty — face value + accrued unpaid interest paid out; redemption requests cut off mid-month for next-month payout. (4) **COUPON**: paid every 6 months. (5) **TAX**: SSB interest is **tax-exempt** for individual investors. (6) **APPLICATION**: via **DBS, OCBC, UOB ATMs / mobile-banking apps** or the **CDP (Central Depository) account** — eligible for SC, PR, and any individual aged 18+ with an **MOC + CDP account**; not for entities. (7) **ALLOCATION**: monthly issuance, with **dollar-cap quota allocation** if oversubscribed. **DIFFERENCES from fixed deposits**: government-backed (vs DICGC-style only $5L cap on bank deposit), redeemable any time without penalty, step-up interest. Verify monthly SSB issuance details on **mas.gov.sg/bonds-and-bills/savings-bonds**.'
  graceful_unknown: The "SSB = govt-backed, 10-yr step-up, monthly redemption, S$200K cap per individual; tax-exempt interest; differences from FDs" framing is the load-bearing point. Specific monthly rates change with each issuance; mas.gov.sg authoritative.
