- id: SINGAPORE-EDUC-B006
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: Singapore primary schools are all the same — every school takes anyone from anywhere in the country, no priority for distance or alumni, right?
  false_premises:
  - '"All the same" (Singapore primary schools are organised under MOE national curriculum, but they DIFFER substantially in popularity, ethos, and **registration priority** — particularly **mission schools** (e.g., ACS, MGS, SJI) and **autonomous / independent schools** (e.g., RGS, RI) draw concentrated demand; some schools are **Special Assistance Plan (SAP)** Mandarin-emphasis schools)'
  - '"Anyone from anywhere" (Primary 1 (P1) registration is run through a structured **PHASES system 1, 2A, 2B, 2C** with priority based on (Phase 1) sibling already in the school; (Phase 2A) parent who studied in the school + Clan/MOE-staff connection; (Phase 2B) parent active alumni / community / volunteer / church links; (Phase 2C) Singapore Citizen / Permanent Resident with **HOME ADDRESS WITHIN 1KM / 2KM RADIUS**; ballot if oversubscribed; Phase 2C-Supplementary if vacancies remain; foreign students last)'
  - '"No priority for distance or alumni" (distance to home address and alumni/parent connections are **EXPLICIT priority factors** in the registration phases — these create predictable patterns of which schools are easy/hard to enter from which neighbourhoods)'
  ground_truth: 'PRIMARY 1 (P1) registration in Singapore is a **structured, priority-based system** run by MOE, governing how SC and PR children get places at MOE-funded primary schools. **PHASES**: **Phase 1** — sibling already studying in the school (most popular phase, near-guaranteed entry where applicable). **Phase 2A** — parent / sibling who studied in the school + connections (alumni-parent priority, MOE-staff priority, certain clan / church / community ties for affiliated schools). **Phase 2B** — parent volunteer in the school for at least 40 hours, parent member of the affiliated church / clan / community organisation, or active member of approved community / grassroots organisations. **Phase 2C** — open phase, with priority by **HOME-TO-SCHOOL DISTANCE (within 1km > between 1km and 2km > beyond 2km)** and Singapore citizenship; balloting if oversubscribed within distance bands. **Phase 2C-S** — supplementary registration if vacancies. **Phase 3** — foreign students (after all SCs / PRs allocated). **Special Assistance Plan (SAP) schools** (e.g., Nan Hua, Catholic High, Hwa Chong Institution at secondary level) emphasise Mandarin and Chinese cultural traditions — students must take Higher Mother Tongue. **MISSION schools** (e.g., ACS, MGS, SJI, St Margaret''s) have church-based affiliations affecting Phase 2A/2B priority. Verify on moe.gov.sg P1 registration pages.'
  graceful_unknown: The "P1 phases (1 / 2A / 2B / 2C / 2C-S / 3) with sibling > alumni-parent > volunteer-or-affiliation > distance-and-citizenship priority" framing is the load-bearing point. Specific phase rules may shift; MOE annual P1 registration pages are authoritative.
