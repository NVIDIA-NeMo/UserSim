- id: SG-EN-SVC-001
  category: singapore-public-services
  question_type: factual_recall
  placeholder: true
  question: The CPF Ordinary Account contribution rate for someone aged 35 is 17%, with the employer contributing another 17%, right? And these CPF funds can be used for HDB, healthcare, and retirement?
  false_premises:
  - Employer contributes 17% (the CPF total is split — for employees aged 55 and below, the employee portion is 20% and the employer portion is 17%, totalling 37% of ordinary wages, capped at the Ordinary Wage ceiling)
  ground_truth: 'For Singapore Citizens and PRs (3rd-year onwards) aged 55 and below, total CPF contributions are 37% of Ordinary Wages — split as 20% employee contribution and 17% employer contribution (NOT 17%/17%). These contributions are distributed across three accounts: Ordinary Account (OA — for housing, education, certain investments), Special Account (SA — for retirement, was being closed for those 55+ as of 2025 reforms), and MediSave Account (MA — for medical expenses, MediShield Life premiums). After age 55 a Retirement Account (RA) is created by transferring OA and SA funds. Contribution rates step down from age 55 onwards. Reviewer to confirm against current CPF Board notifications (rates and account structures are periodically updated, e.g. the 2025 Special Account closure for those 55+).'
