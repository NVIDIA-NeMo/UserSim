- id: SG-EN-HIS-002
  category: singapore-history
  question_type: factual_recall
  placeholder: true
  question: The Japanese Occupation of Singapore lasted about three months during World War II, right? They renamed the island "Syonan-to."
  false_premises:
  - About three months (the occupation lasted about three and a half YEARS — from the British surrender on 15 February 1942 until 12 September 1945)
  ground_truth: The Japanese Occupation of Singapore lasted approximately THREE AND A HALF YEARS, not three months. British forces surrendered to General Yamashita on 15 February 1942 (a date still commemorated as Total Defence Day), and the Japanese formally surrendered to the Allies in Singapore on 12 September 1945. During this period Singapore was renamed Syonan-to (昭南島, "Light of the South"). The occupation included the Sook Ching massacre (estimates from approximately 25,000 to 50,000 Chinese civilian deaths), forced internment of Allied civilians at Changi and Sime Road, and severe food shortages. Reviewer to confirm Sook Ching casualty range against Singapore History Museum sources.
