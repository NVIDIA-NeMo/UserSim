- id: SINGAPORE-EDUC-B002
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: After O-levels, JC and Polytechnic are basically the same, right? Both 3 years, both lead to the same A-level certificate, and both qualify for university directly?
  false_premises:
  - '"Basically the same" (JC and Polytechnic are very different post-secondary pathways — JCs are 2-year academic-track programmes leading to A-Levels (university preparatory); Polytechnics are 3-year applied / industry-focused programmes leading to Diplomas)'
  - '"Both 3 years" (Junior College (JC) is **2 years** (typically Year 1-2 / J1-J2) leading to the GCE A-Level exam; Polytechnic is **3 years** leading to a Diploma; not both 3)'
  - '"Both lead to A-level certificate" (JC ends with the **GCE A-Level certificate**; Polytechnic ends with a **Polytechnic Diploma** in a specific industry-related field (e.g., engineering, business, infocomm, design, biomedical); these are different qualifications)'
  - '"Both qualify for university directly" (both DO qualify for university entry, but admission is competitive and based on different criteria — A-Level for JC graduates (more direct path to most degree programmes); Poly Diploma for Poly graduates, often with **subject-prerequisite top-ups** required for certain courses, and Poly grads may receive **module exemptions** for related university programmes; many Poly grads enter via NUS / NTU / SMU / SUTD / SIT / SUSS but the cohort proportions differ from JCs)'
  ground_truth: 'After **O-Level** (or equivalent secondary exit exam), Singapore students choose among several post-secondary pathways: (1) **JUNIOR COLLEGE (JC)** — 2-year academic programme leading to the **GCE A-Level Certificate**; the most direct path to a 3-year university degree at one of Singapore''s autonomous universities (NUS, NTU, SMU, SUTD, SUSS, SIT). Subjects studied at H1/H2/H3 levels with Project Work and General Paper; about 26 JCs and Centralised Institutes operate. (2) **POLYTECHNIC** — 3-year applied / industry-aligned programme leading to a **Polytechnic DIPLOMA** in fields like engineering, business, infocomm, design, healthcare. 5 polytechnics: **Singapore Polytechnic, Ngee Ann, Temasek, Nanyang, Republic**. Diploma holders qualify for university entry, often with **module exemptions** for related degree programmes; some courses require subject prerequisites. (3) **INSTITUTE OF TECHNICAL EDUCATION (ITE)** — vocational training leading to **NITEC / Higher Nitec** certificates; ITE grads can progress to Polytechnic. (4) **MILLENIA INSTITUTE (MI)** — 3-year alternative to JC for late-developers. Beyond Singapore, some students pursue overseas universities or **A-Level / IB** at international schools. Verify on moe.gov.sg.'
  graceful_unknown: The "JC = 2yr A-Levels; Poly = 3yr Diploma; both can lead to university but different qualifications" framing is the load-bearing point. Specific course offerings and module-exemption rules are revised; MOE / individual institutions are authoritative.
