- id: SINGAPORE-HEAL-B006
  category: singapore-health-systems
  question_type: factual_recall
  placeholder: true
  question: Polyclinics and private GPs charge the same in Singapore, no? Both are open 24/7, and SingHealth runs all of them?
  false_premises:
  - '"Same charges" (polyclinics offer **HEAVILY SUBSIDISED** consultations and medications for SCs and PRs — typical adult SC consultation fee is around $15-20 at polyclinics vs $40-80+ at private GPs; subsidies for the elderly/PG/MG/CHAS Blue can be even lower; private GPs are NOT subsidised baseline (CHAS subsidies apply at participating private GPs))'
  - '"Open 24/7" (polyclinics typically operate **regular weekday hours (about 8am-4:30pm)** with limited Saturday hours; closed Sundays and public holidays; **NOT 24/7**; some have evening clinics. For after-hours, options are **A&E at restructured public hospitals** (24/7), private GP / 24-hour clinics, or **Urgent Care Centres**)'
  - '"SingHealth runs all of them" (polyclinics are operated by **THREE healthcare clusters** under MOH — **NHGP (National Healthcare Group Polyclinics)** for central / northern Singapore; **SingHealth Polyclinics** for eastern / south-eastern; and **NUP (National University Polyclinics)** for western / Jurong; not all under SingHealth)'
  ground_truth: 'Singapore''s primary care is split between **PUBLIC POLYCLINICS** and **PRIVATE GPs**. **POLYCLINICS** — heavily subsidised for SCs and PRs (with deeper subsidies for PG, MG, CHAS Blue), running operated by three regional **healthcare clusters** under MOH: **NHGP (National Healthcare Group Polyclinics)** (central / northern Singapore), **SingHealth Polyclinics** (eastern / south-eastern), and **NUP (National University Polyclinics)** (western / Jurong). Typical SC adult consultation $15-20, with chronic-disease and dental services at subsidised rates. **Operating hours** typically Mon-Fri 8am-4:30pm with reduced Sat hours, closed Sun and public holidays — NOT 24/7. **PRIVATE GPs** — about 1,400+ across Singapore; most are SOLO or small group practices; no baseline subsidy, but **CHAS subsidies apply at participating CHAS-accredited GPs** for eligible SCs. Consultation fees vary widely (~$40-80+ for an acute consultation). **AFTER-HOURS / 24-HOUR options** — Accident & Emergency (A&E) at the 7 restructured public hospital A&Es (24/7, but designed for emergency cases — high fees for non-urgent visits, ~$140+ for SC at most); 24-hour private GP clinics (e.g., some **Healthway**, **Raffles Medical**, dedicated 24-hour clinics like Drs Bain & Partners). **HealthHub** and **OneSG** apps support digital appointment / queue / records access; **NEHR (National Electronic Health Record)** allows authorised providers to view a patient''s public-sector medical history.'
  graceful_unknown: The "three polyclinic clusters (NHGP / SingHealth Polyclinics / NUP); subsidised vs private GP fees; not 24/7; A&E for after-hours" framing is the load-bearing point. Specific consultation fees and hours are revised; healthhub.sg / cluster sites authoritative.
