- id: SINGAPORE-HEAL-B001
  category: singapore-health-systems
  question_type: factual_recall
  placeholder: true
  question: CHAS card means free GP visits at any clinic in Singapore, no? Every Singaporean automatically has one, regardless of income?
  false_premises:
  - '"Free GP visits at any clinic" (CHAS provides SUBSIDIES — not free care — at PARTICIPATING (CHAS-accredited) GP and dental clinics; subsidy amount varies by tier and condition; private clinics that haven''t opted into CHAS don''t accept the card; visits to public polyclinics use a separate subsidy structure)'
  - '"Every Singaporean automatically" (CHAS is **MEANS-TESTED** — eligibility based on monthly per-capita household income and Annual Value of residence; not all Singaporeans qualify; **CHAS Blue** (lower income), **CHAS Orange** (middle income), **CHAS Green** (all SCs aged 65+ or specific chronic conditions, or post-Pioneer/Merdeka Generation eligibility); not automatic and not for all)'
  ground_truth: 'The **Community Health Assist Scheme (CHAS)**, run by the **Ministry of Health (MOH)**, provides means-tested subsidies for outpatient visits at participating (CHAS-accredited) **GP and dental clinics** for Singapore Citizens. **TIERS**: (1) **CHAS Blue** — lower-income households (per capita household income up to ~$1,500); higher subsidies. (2) **CHAS Orange** — middle-income households (up to ~$2,300 per capita); subsidies for chronic conditions only. (3) **CHAS Green** — all SCs not in Blue/Orange but with chronic conditions; lower subsidies. (4) **Pioneer Generation (PG)** and **Merdeka Generation (MG)** card-holders get additional subsidies layered on CHAS. Subsidy amount varies by service (acute vs chronic; GP vs dental; common vs complex chronic) and tier — typical acute GP visit subsidies range from ~$10 (Green) to ~$28 (Blue), with chronic-disease management higher. Not all clinics participate; check CHAS-accredited list on **chas.sg**. PRs and foreigners are not eligible.'
  graceful_unknown: The "CHAS = means-tested SC-only subsidy at participating clinics; Blue/Orange/Green tiers; PG/MG get extra layered subsidies" framing is the load-bearing point. Specific subsidy amounts and income thresholds are revised periodically; chas.sg is authoritative.
