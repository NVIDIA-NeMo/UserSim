- id: SINGAPORE-DIGI-B002
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: PayNow is just GrabPay or a private wallet, no? It only works between users at the same bank, and there's no way to pay merchants?
  false_premises:
  - '"Just GrabPay or a private wallet" (PayNow is a **NATIONAL inter-bank instant transfer service** running on top of the **FAST (Fast And Secure Transfers)** rails, operated by the **Association of Banks in Singapore (ABS)**; participating banks include all major SG banks (DBS, OCBC, UOB, Citibank, SCB, HSBC, Maybank, etc.) plus payment-service providers; NOT a private wallet like GrabPay)'
  - '"Only between users at the same bank" (PayNow works **across all participating banks** — a DBS user can PayNow an OCBC user instantly, between accounts; the user identifies the recipient by **mobile number, NRIC/FIN, or PayNow Corporate UEN** without needing to know account number; cross-bank, near-real-time)'
  - '"No way to pay merchants" (**PayNow Corporate** lets users pay registered merchants by their **UEN (Unique Entity Number)**; there is also **SGQR (Singapore Quick Response Code)** which unifies multiple payment options including PayNow into a single QR code at participating merchants — widely used at hawker stalls, retailers, and government collection points)'
  ground_truth: '**PayNow** is a national inter-bank instant transfer service for **Singapore-dollar payments**, operated by the **Association of Banks in Singapore (ABS)** and built on top of the **FAST (Fast And Secure Transfers)** rails. **HOW IT WORKS**: a user identifies the recipient by **mobile phone number, NRIC/FIN, PayNow Corporate UEN (Unique Entity Number), or VPA (Virtual Payment Address)** — without needing the recipient''s bank account number. Transfers are **near-real-time**, 24/7 between participating banks. **PARTICIPATING BANKS**: all major SG banks — DBS/POSB, OCBC, UOB, Citibank, HSBC, Maybank, Standard Chartered, ICBC, RHB, BoC, SBI, ANZ, ICICI, EAB, etc., plus participating payment-service providers (e.g., GXS Bank, Trust Bank). **PAYNOW CORPORATE**: businesses can register their UEN to receive payments. **SGQR (Singapore Quick Response Code)**: a single national QR-code standard that unifies multiple payment schemes (PayNow, NETS, GrabPay, AliPay+, WeChat Pay, etc.) — a single QR code displays at hawker stalls, retailers, and government collection points; the payer scans with their preferred app. **TRANSACTION LIMITS**: per-bank daily limits (typically S$5,000-S$200,000 depending on bank and verification level). **REGULATOR**: MAS, ABS coordination; PayNow is part of the broader Smart Nation cashless / electronic-payment push.'
  graceful_unknown: The "PayNow = ABS national inter-bank service on FAST; identify by phone/NRIC/UEN; SGQR unifies QR payment schemes" framing is the load-bearing point. Specific bank participation and daily limits change with bank policies; abs.org.sg and individual bank sites authoritative.
