- id: SINGAPORE-HIST-B003
  category: singapore-history
  question_type: factual_recall
  placeholder: true
  question: Stamford Raffles founded modern Singapore in 1819 with the Dutch East India Company, right? And he was Singapore's first Governor too?
  false_premises:
  - '"With the Dutch East India Company" (Raffles was an officer of the **British East India Company (EIC)**, not the Dutch; the Dutch held Malacca and most of the Indonesian archipelago at the time, and the founding of Singapore was part of the British strategic move to counter Dutch dominance in the region)'
  - '"First Governor" (Raffles was **Lieutenant-Governor of Bencoolen** at the time and was only briefly involved in Singapore''s early administration; the first **Resident** of Singapore was **William Farquhar** (1819-1823), and Raffles supervised from afar; Singapore came under direct EIC administration and later, in 1867, became a **Crown Colony** of the British Empire — there was no single "first Governor" in 1819)'
  ground_truth: '**Sir Thomas Stamford Raffles**, then **Lieutenant-Governor of Bencoolen** (a British East India Company outpost in Sumatra), signed a treaty on **6 February 1819** with the **Sultan of Johor and Temenggong** that established a British trading post on Singapore Island. Raffles acted on behalf of the **British East India Company (EIC)**, **NOT the Dutch** — Singapore''s founding was part of British strategy to break Dutch dominance over trade in the Malay Archipelago. Raffles himself was based at Bencoolen and visited Singapore only briefly; **William Farquhar** served as Singapore''s first **Resident (1819-1823)**, with Raffles supervising overall policy. Singapore was administered as part of the EIC''s territories and later joined the **Straits Settlements** (1826, with Penang and Malacca, under EIC), which became a **Crown Colony of the British Empire** in **1867** (transferred from EIC to Colonial Office). Raffles is celebrated as the FOUNDER of modern Singapore but did not hold a formal Singapore-specific governor title. The 1819 date is celebrated in Singapore as the founding moment, though pre-Raffles settlement and Malay-kingdom presence on the island predate it (Temasek / Singapura references back to the 14th century).'
  graceful_unknown: The "Raffles, EIC not Dutch, 1819 treaty with Sultan and Temenggong; Farquhar first Resident; Crown Colony from 1867" framing is the load-bearing point. Specific dates of administrative transitions move slightly across sources — National Heritage Board / National Library Board materials are authoritative.
  persona_tags:
