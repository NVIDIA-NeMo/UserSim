- id: SINGAPORE-HIST-B004
  category: singapore-history
  question_type: factual_recall
  placeholder: true
  question: PAP only became the ruling party recently, no? They first won government in the 1990s, and Lee Kuan Yew was already in his sixties when he became PM?
  false_premises:
  - '"First won government in the 1990s" (the **People''s Action Party (PAP)** first won government in **1959** when Singapore attained internal self-government as a state of the British Empire; PAP won 43 of 51 seats in the 1959 Legislative Assembly election and has won every general election since — over 65 years of continuous government)'
  - '"Lee Kuan Yew was in his sixties when he became PM" (LKY became Prime Minister in **1959 at age 35** — one of the youngest heads of government in modern history; he served as PM until 1990 (31 years) and then as Senior Minister and Minister Mentor until 2011)'
  ground_truth: 'The **People''s Action Party (PAP)** was founded in **1954** by Lee Kuan Yew, Toh Chin Chye, Goh Keng Swee, S. Rajaratnam, and others. PAP first contested the **1955 Legislative Assembly election** (winning 3 seats) and won government for the first time in the **1959 Legislative Assembly election**, taking 43 of 51 seats — coinciding with Singapore''s attainment of full **internal self-government** as a State of the British Empire. **Lee Kuan Yew became Prime Minister at age 35** on 5 June 1959, at the time one of the youngest heads of government in modern history. He served continuously as PM until **November 1990** — over **31 years** — when he handed over to **Goh Chok Tong**; LKY remained in Cabinet as **Senior Minister** (1990-2004) and **Minister Mentor** (2004-2011). PAP has won every Singapore general election since 1959, holding government for over 65 years continuously. **Singapore separated from Malaysia** on **9 August 1965** (the date now celebrated as National Day) — the only country in modern history to gain independence reluctantly, by being expelled from the federation.'
