  - '"They speak Mandarin" (Peranakans traditionally spoke **Baba Malay** — a Malay-based creole with heavy Hokkien Chinese loanwords — NOT Mandarin; many older Peranakans today speak English, with Baba Malay declining; Mandarin is a more recent acquisition, post-Speak-Mandarin-Campaign)'
  - '"Live mainly in HDB flats today" (the historic centres of Peranakan settlement in Singapore include **Joo Chiat / Katong / East Coast**, **Emerald Hill**, and parts of **Tanjong Katong** — many of these areas still have **conservation shophouses** with characteristic Peranakan architecture (pastel colours, intricate tile work, ornate facades); the **Peranakan Museum** sits on Armenian Street; while many Peranakans do live in HDB flats, the heritage shophouse zones are a defining marker of the culture)'
  ground_truth: '**PERANAKAN** culture (Malay for "locally born") is a distinct hybrid identity that emerged in the **Straits Settlements** (Singapore, Penang, Malacca) from the **15th century onward**, when early Chinese immigrants (predominantly Hokkien) married local Malay women, producing a fusion of Chinese and Malay traditions. The community is also known as **STRAITS CHINESE** or **BABA-NYONYA** (Baba = male, Nyonya = female). KEY MARKERS — **language**: traditionally **Baba Malay** (a Malay-based creole with heavy Hokkien borrowings), gradually replaced by English in modern times; not Mandarin. **Cuisine**: distinctive **NYONYA cuisine** (e.g., laksa, ayam buah keluak, kueh) — neither purely Chinese nor purely Malay. **Architecture**: ornate **shophouses** with pastel colours and intricate tile work, concentrated in **Joo Chiat / Katong / East Coast Road** and **Emerald Hill** in Singapore; many gazetted as **conservation areas** by URA. **Dress**: kebaya for women. **Religion**: predominantly Buddhist / Taoist with strong ancestor-worship traditions; some converted to Christianity. **Heritage**: the **Peranakan Museum** on Armenian Street, the **Baba House** (NUS) on Neil Road, and Joo Chiat / Katong''s **Peranakan-zone shophouses** are key heritage sites. The Singapore Peranakan Association preserves community heritage. Peranakan culture is also recognised as part of **UNESCO Intangible Cultural Heritage** elements of the region.'
  graceful_unknown: The "Peranakan ≠ Chinese culture; Baba Malay creole, not Mandarin; Joo Chiat / Katong / Emerald Hill heritage shophouses" framing is the load-bearing point. Specific UNESCO recognitions and the boundary between Singapore vs Penang vs Malacca Peranakan traditions are nuanced — the National Heritage Board and Peranakan Museum are authoritative.
