- id: SINGAPORE-DIGI-B006
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: Smart Nation is just a slogan, no? It's run by IMDA alone, and there's been no measurable digital-government output from it?
  false_premises:
  - '"Just a slogan" (Smart Nation is a **whole-of-government strategic initiative** launched by PM Lee Hsien Loong in **November 2014**, with concrete strategic-tech projects across digital identity, e-government, AI, sensors, smart-mobility, e-payments, etc.; not just branding — measurable outputs include SingPass, MyInfo, PayNow / SGQR, OneSG / LifeSG, NEHR, Sensors-Network, autonomous-vehicle pilots, the GovTech Open-Data portal, and many more)'
  - '"Run by IMDA alone" (Smart Nation is led by the **Smart Nation and Digital Government Group (SNDGG)** in the **Prime Minister''s Office**, with execution across **GovTech (Government Technology Agency)** and **IMDA (Infocomm Media Development Authority)**, plus partnerships across all ministries; SNDGG is the lead, not IMDA alone)'
  - '"No measurable digital-government output" (specific outputs include: SingPass NDI; MyInfo and Verify integrations across hundreds of services; PayNow and SGQR; LifeSG super-app; OneService and OneInbox; NDIA AI projects; the National Digital Identity Wallet for credentials like driving licence and CHAS card; Smart Nation Sensor Platform; and many open-data initiatives)'
  ground_truth: '**SMART NATION** is Singapore''s national programme to harness digital technology, data, and AI for citizen services, productivity, and economic competitiveness, launched by PM Lee Hsien Loong on **24 November 2014**. **GOVERNANCE**: led by the **Smart Nation and Digital Government Group (SNDGG)** in the **Prime Minister''s Office**, with implementation across **GovTech Singapore (Government Technology Agency)** and **IMDA (Infocomm Media Development Authority)**, in partnership with all ministries and statutory boards. **PILLARS / STRATEGIC PROJECTS**: (1) **Digital Identity** — SingPass / NDI / MyInfo / Singpass Mobile App; (2) **E-Payments** — PayNow, SGQR, Network for Electronic Transfers (NETS); (3) **National Sensor Platform** — Smart Lampposts, IoT for environment monitoring; (4) **OneSG / LifeSG** — citizen super-apps consolidating government services; (5) **CODEX** — government tech development platform; (6) **AI national strategy** — National AI Office (NAIO), AI in healthcare / public service / smart cities; (7) **Open Data** — data.gov.sg portal; (8) **Cybersecurity** — under CSA (Cyber Security Agency); (9) **5G + connectivity infrastructure** by IMDA; (10) **smart-mobility / autonomous vehicles** under LTA. **MEASURABLE OUTCOMES**: Singapore consistently ranks high in IMD World Digital Competitiveness, e-Government Development Index. Verify on **smartnation.gov.sg / sndgg.gov.sg / tech.gov.sg / imda.gov.sg**.'
  graceful_unknown: The "Smart Nation = SNDGG-led whole-of-government programme since 2014; concrete pillars (digital identity, e-payments, sensors, AI, open data); GovTech + IMDA + many agencies; not run by IMDA alone" framing is the load-bearing point. Specific projects evolve; sndgg.gov.sg / tech.gov.sg authoritative.
