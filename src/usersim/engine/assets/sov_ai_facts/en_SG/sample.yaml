- id: SINGAPORE-GEOG-B006
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Sentosa is the only off-shore island Singapore has, no? Pulau Ubin and Tekong are open for tourists too, and you can drive across to all three?
  false_premises:
  - '"Sentosa is the only off-shore island" (Singapore has more than **60 islands** off its main island, including **Sentosa, Pulau Ubin, Pulau Tekong, Jurong Island (consolidated), Pulau Bukom, the Southern Islands (Pulau Hantu, Lazarus, Kusu, St. John''s, Sisters'' Islands)**, and others)'
  - '"Pulau Tekong is open for tourists" (**Pulau Tekong is a RESTRICTED MILITARY AREA** used by the Singapore Armed Forces for **Basic Military Training (BMT)** — tourists and the general public are **not allowed** to visit; access is limited to NSmen and military personnel)'
  - '"Drive across to all three" (Sentosa is connected to mainland by a road causeway and the Sentosa Express monorail; **Pulau Ubin** is reachable only by **bumboat** from Changi Point Ferry Terminal — no road bridge; Pulau Tekong is restricted as above and accessed by military ferry)'
  ground_truth: 'Singapore consists of one main island plus over **60 smaller islands**. Among the notable ones — **SENTOSA**: a leisure / tourism island connected to the main island by a 710-m **causeway road and pedestrian boardwalk**, the **Sentosa Express monorail**, and a cable car; home to Universal Studios Singapore, Resorts World Sentosa, beaches, and Fort Siloso. **PULAU UBIN**: a kampung-style nature island northeast of the main island; reached by **BUMBOAT (≤ 12 passengers, ~$5 each, ad-hoc departures)** from **Changi Point Ferry Terminal**, no road connection; popular for cycling, kayaking, and Chek Jawa wetlands. **PULAU TEKONG**: the second-largest of Singapore''s islands; **RESTRICTED MILITARY AREA** used by SAF for **Basic Military Training (BMT)** — not open to the public. **JURONG ISLAND**: industrial petrochemical island, formed by reclamation linking 7 smaller islands; not a tourist destination. **THE SOUTHERN ISLANDS** (Kusu, Lazarus, St. John''s, Sisters'' Islands, Pulau Hantu): some accessible by ferry from Marina South Pier; Sisters'' Islands is a marine park (under MPA / NParks). **PULAU BUKOM**: Shell oil refinery, restricted access. The islands are administered by various agencies — Sentosa Development Corporation; Ministry of Defence for Tekong; NParks for Pulau Ubin and the Southern Islands marine park.'
  graceful_unknown: The "Sentosa = causeway-connected, Pulau Ubin = bumboat-only, Pulau Tekong = SAF restricted" three-way distinction is the load-bearing point. Number of islands and specific access routes shift with reclamation; verify on URA / NParks / SLA materials.
