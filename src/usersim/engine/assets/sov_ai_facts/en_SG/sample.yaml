- id: SINGAPORE-HEAL-B002
  category: singapore-health-systems
  question_type: factual_recall
  placeholder: true
  question: I can use my MediSave for any medical bill, no? Cash spending at a private GP, dental for a friend, even my dog's vet bills?
  false_premises:
  - '"Any medical bill" (MediSave usage is governed by **MOH-approved categories** — primarily hospitalisation, day surgery, certain outpatient services (kidney dialysis, chemotherapy, radiotherapy), Chronic Disease Management Programme (CDMP) visits, MediShield Life and IP premiums, and specific approved screening; **routine GP visits for acute conditions** are GENERALLY NOT MediSave-claimable)'
  - '"Any private GP cash visit" (most acute GP visits at private clinics are paid out-of-pocket or via CHAS subsidies; MediSave can be used for **approved chronic disease management** under CDMP at participating clinics — diabetes, hypertension, lipid disorders, asthma, COPD, schizophrenia, major depression, dementia, and others — with annual withdrawal limits; not "any" GP visit)'
  - '"Dental for a friend, dog vet bills" (MediSave can be used for the account-holder''s own medical care AND for **immediate family members** (spouse, children, parents, grandparents — with consent / ID-verification rules) — NOT for friends, NOT for pets / vet bills; the **Medical Endowment Scheme Act** scopes use to the patient and their family)'
  ground_truth: '**MediSave** is a personal medical savings account within CPF, governed by the **CPF Act** and **MOH-approved categories**. Permitted uses include: (1) **Hospitalisation and day surgery** (with limits per day / per surgery type — Table A and Table B limits); (2) **Approved outpatient services** — dialysis, chemotherapy, radiotherapy, immunotherapy, long-term parenteral nutrition; (3) **Chronic Disease Management Programme (CDMP)** for ~20 listed chronic conditions (diabetes, hypertension, hyperlipidaemia, stroke, schizophrenia, major depression, dementia, etc.); (4) **MediShield Life and Integrated Shield Plan premiums**; (5) **Approved screenings** (e.g., colorectal, mammogram, cervical); (6) **Vaccinations** for nationally-recommended schedules; (7) **Maternity bills** (delivery, pre-natal, post-natal). **PERMITTED USERS**: account holder''s own bills + **immediate family members** (spouse, parents, children, siblings, grandparents — with verification). **NOT PERMITTED**: bills for friends / unrelated parties; pets/vets; cosmetic procedures; dental except for selected day-surgery dental procedures; routine acute GP visits outside of CDMP. **WITHDRAWAL LIMITS** apply per service category and per year; verify current MediSave usage rules and limits on cpf.gov.sg / moh.gov.sg.'
  graceful_unknown: The "MediSave = approved categories only (hospital, day surgery, dialysis/chemo, CDMP chronics, IL premiums, screenings); family members only, not friends; not for vet bills" framing is the load-bearing point. Specific withdrawal limits per service and the current CDMP condition list shift; verify on cpf.gov.sg and moh.gov.sg.
