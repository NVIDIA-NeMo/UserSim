- id: SINGAPORE-LABO-B005
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Foreign worker levies in Singapore are the same flat fee for everyone, right? Same for construction, services, marine, no matter the worker's qualification?
  false_premises:
  - '"Same flat fee" (foreign worker levies vary substantially by **SECTOR, WORKER QUALIFICATION TIER, and EMPLOYER DEPENDENCY RATIO** — within a sector, levies for the **lower-skilled (Basic / R2)** worker are higher than for **higher-skilled (Higher Skilled / R1)** workers; tiers within sectors levy further differences based on the firm''s ratio of foreign to local workers; not flat)'
  - '"Same for construction, services, marine, manufacturing" (each sector has DIFFERENT LEVY structures — **Construction**, **Marine Shipyard**, **Process** (oil/petrochem), **Manufacturing**, **Services** all have separate tiered levy rates published by **MOM**; service sector typically pays HIGHER levies than construction at equivalent skill tiers — by design, to manage labour-market signals)'
  - '"No matter qualification" (worker''s qualification level (Basic / Higher Skilled — R2 / R1) significantly affects monthly levy; obtaining a Higher Skilled certification (e.g., **Skills Evaluation Test (SET)** for construction; certain trade certifications for marine) reduces the levy paid by the employer for that worker)'
  ground_truth: 'Singapore''s **FOREIGN WORKER LEVY (FWL)** is a pricing mechanism set by **MOM** to manage the foreign-worker share in the labour market for **Work Permit holders** (lower-skilled foreign workers). The levy applies to **WORK PERMIT HOLDERS (WPHs)** — paid by the EMPLOYER — and varies along three axes: (1) **SECTOR**: Construction, Marine Shipyard, Process, Manufacturing, Services, each with separate published rates. (2) **SKILL TIER**: **Higher Skilled (R1)** vs **Basic Skilled (R2)** — higher-skilled workers attract **lower** levies per month; certifications like **SET (Skills Evaluation Test)** for construction can move workers from R2 to R1. (3) **DEPENDENCY-RATIO TIER**: as employers approach their sector-specific cap on foreign workers per local worker, levies increase progressively across "Tier 1 / 2 / 3" within the dependency ratio. **EMPLOYMENT PASS (EP)** holders (S$5,000+/month, professional/managerial) and **S Pass** holders (S$3,150+/month, mid-skilled) pay no levy in the FWL sense (S Pass has its own levy structure). Workers from selected source countries (e.g., FDWs from approved source countries) have separate per-month levy rates. Verify current published levies on **mom.gov.sg/foreign-workforce-levies**.'
  graceful_unknown: The "FWL varies by sector, skill tier (R1/R2), and dependency-ratio tier; not flat; EP and S Pass have separate frameworks" framing is the load-bearing point. Specific monthly levy amounts are revised in budget cycles; mom.gov.sg authoritative.
