- id: SINGAPORE-LABO-B002
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: For my new baby coming, I get 16 weeks paid maternity leave, no? Same for fathers, both fully paid by my employer?
  false_premises:
  - '"Same for fathers" (paid maternity leave is **16 weeks for SC mothers** (12 for non-SC mothers); paternity leave is currently **2 weeks paid** (with plans for 4 weeks announced for some cohorts) — much shorter than maternity; the Government, not the employer, reimburses the additional weeks)'
  - '"Both fully paid by employer" (under the **Government-Paid Maternity Leave (GPML)** scheme, employer pays for the **first 8 weeks** of the 16-week SC entitlement; the **GOVERNMENT REIMBURSES the employer** for **weeks 9-16** (capped at S$10,000 per 4-week period including CPF); for paternity leave, the Government reimburses the FULL 2 weeks (capped))'
  ground_truth: 'Singapore''s **PARENTAL LEAVE** under the **Child Development Co-Savings Act (CDCA)** and Employment Act provides — (1) **GOVERNMENT-PAID MATERNITY LEAVE (GPML)**: **16 weeks paid for Singapore Citizen mothers** (8 weeks before delivery, 8 after — or other splits up to a year after birth with employer agreement); for **non-Citizen mothers** (PR, foreign), it is **12 weeks**. Under GPML, employer pays the first 8 weeks and the Government reimburses weeks 9-16 (capped at S$10,000 per 4-week block including CPF). (2) **GOVERNMENT-PAID PATERNITY LEAVE (GPPL)**: currently **2 weeks paid** for fathers of Singapore-Citizen children (with announced plans to extend to **4 weeks** by 2026); fully reimbursed by Government (capped). (3) **SHARED PARENTAL LEAVE**: father can share up to 4 weeks of mother''s 16 weeks with mother''s consent. (4) **GOVERNMENT-PAID ADOPTION LEAVE**: **12 weeks** for SC adoptive mother of a child below age 12 months. (5) **CHILDCARE LEAVE**: 6 days/year (up to age 7) and 2 days extended (age 7-12); paid. (6) **UNPAID INFANT-CARE LEAVE**: 6 days/year (under 2). (7) **SICK CHILDCARE LEAVE** is shared with general sick leave. Verify on **made-for-families.gov.sg / mom.gov.sg / msf.gov.sg**.'
  graceful_unknown: The "16 weeks GPML for SC mum (employer first 8, govt reimburses 9-16); 2 weeks GPPL for dad (with planned extension to 4); shared parental leave; childcare leave" framing is the load-bearing point. Caps and specific extension dates revised; verify on made-for-families.gov.sg.
