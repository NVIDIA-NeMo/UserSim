- id: SINGAPORE-FINA-B002
  category: singapore-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: With CPFIS, I can invest my entire CPF balance in any stock or crypto, no? OA and SA, all of it, anywhere I like?
  false_premises:
  - '"Entire CPF balance" (CPFIS allows investment of **OA balances above S$20,000** and **SA balances above S$40,000** (the "investible portion"); the first S$20,000 of OA and S$40,000 of SA must be **kept untouched** to ensure a base interest-earning floor; not the entire balance)'
  - '"Any stock or crypto" (CPFIS-approved products are a **regulated list** maintained by CPF Board — including selected unit trusts, investment-linked insurance, fixed deposits, Singapore Government Securities, ETFs (CPFIS-OA only), gold, and shares of MAS-listed Singapore companies; **CRYPTOCURRENCIES are NOT CPFIS-approved**; foreign-listed individual stocks are NOT directly investable)'
  - '"OA and SA, all of it" (CPFIS-OA (OA investments) and CPFIS-SA (SA investments) have **DIFFERENT product universes** — SA-investible products are a stricter, narrower list; SA self-investment was suspended for many product categories in 2025 onwards under reform proposals; OA has the broader list)'
  ground_truth: 'The **CPF Investment Scheme (CPFIS)**, administered by **CPF Board**, lets eligible CPF members invest a portion of their **Ordinary Account (OA)** and **Special Account (SA)** balances in approved products. **INVESTIBLE PORTION**: above the first **S$20,000 in OA** and **S$40,000 in SA** — those minimum balances must remain in the accounts to earn the standard CPF interest. **APPROVED PRODUCTS** (curated by CPF Board): selected **unit trusts**, **investment-linked insurance**, **annuities**, **endowment insurance**, **fixed deposits** (CPFIS-FDs), **Singapore Government Securities (SGS)**, **Treasury Bills**, **gold (CPFIS-OA only)**, **ETFs (CPFIS-OA only)**, and **shares of Singapore-listed companies** (limited to a sub-set, max 35% of investible OA balance for stocks). **NOT APPROVED**: cryptocurrencies, individual foreign stocks, derivatives. Investments are made through CPFIS-Approved Investment Operators / agent banks. **CPFIS-SA** universe is significantly narrower than CPFIS-OA, and SA self-investment in unit trusts was tightened from 2025 to refocus SA on long-term retirement savings. **TAX**: CPFIS investment returns are credited back to the originating CPF account; not taxable (CPF returns generally tax-exempt). Verify current product list and rules on **cpf.gov.sg**.'
  graceful_unknown: The "CPFIS = invest above S$20K OA / S$40K SA in approved products; no crypto; SA universe narrower than OA" framing is the load-bearing point. Specific rules (especially the 2025 SA reforms) shift; cpf.gov.sg authoritative.
