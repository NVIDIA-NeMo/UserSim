- id: SINGAPORE-DIGI-B001
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: SingPass is just for paying parking fines, no? It's optional, run by a private bank, and only for SCs?
  false_premises:
  - '"Just for paying parking fines" (**SingPass** is the **trusted digital identity** for accessing **HUNDREDS of e-government and partner private services** — including filing tax returns at IRAS, applying for HDB BTO, viewing CPF balance, accessing SingHealth records, signing legally binding documents (Sign with Singpass), accessing licensing and registration with various ministries, etc.; not "just parking fines")'
  - '"Optional" (in practice SingPass is the **default authentication for most digital interactions with Singapore Government services and many private partners** (banks for KYC, insurers, etc.); while alternative paper / counter access exists for some services, SingPass is functionally near-essential for SCs/PRs in the digital age)'
  - '"Run by a private bank" (SingPass is operated by **GovTech Singapore** (Government Technology Agency), a Singapore Government statutory board under the Smart Nation and Digital Government Group; not a private bank; the underpinning National Digital Identity (NDI) Office is also at GovTech)'
  - '"Only for SCs" (SingPass accounts are available to **Singapore Citizens, Permanent Residents, and certain Long-Term Pass holders** (including selected work-pass holders) — not just SCs; foreign residents with eligible passes can register)'
  ground_truth: '**SingPass** (Singapore Personal Access) is Singapore''s **trusted digital identity** for accessing government and partner services online. Operated by **GovTech Singapore** (Government Technology Agency, a statutory board under the Smart Nation and Digital Government Group), with backing from the **National Digital Identity (NDI) Office**. **WHO CAN HAVE A SINGPASS**: Singapore Citizens, Permanent Residents (PRs), and **eligible foreign-pass holders** (Employment Pass, S Pass, Dependant Pass, Long-Term Visit Pass with FIN, etc.). **WHAT YOU CAN DO WITH SINGPASS** (selected): file IRAS taxes, apply for HDB BTO and check application status, view CPF balance and statements, access SingHealth medical records via HealthHub, e-sign legally binding documents via **Sign with Singpass**, register a business with ACRA, manage MOM Work Pass applications, claim public benefits, log into participating private partners (banks for KYC, insurance, etc.) via **MyInfo**. **AUTHENTICATION**: 2FA via **SMS OTP** or the **Singpass mobile app** (more secure, PKI-based); biometric login (fingerprint / face) on mobile. Login attempts and the Singpass account lifecycle are governed by GovTech security policies. **MyInfo** lets users autofill verified personal data into participating service forms. Verify on **singpass.gov.sg / api.singpass.gov.sg**.'
  graceful_unknown: The "SingPass = GovTech-run national digital identity for SCs / PRs / eligible pass-holders; broad service coverage; MyInfo for autofill" framing is the load-bearing point. Specific eligible passes and partner services expand over time; singpass.gov.sg authoritative.
