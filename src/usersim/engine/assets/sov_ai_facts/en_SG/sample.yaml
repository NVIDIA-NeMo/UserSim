- id: SG-EN-CUL-001
  category: singapore-culture
  question_type: factual_recall
  placeholder: true
  question: Singapore has two official languages — English and Mandarin, right? Singlish is one of the official ones too.
  false_premises:
  - 'Two official languages (Singapore has FOUR official languages: English, Mandarin, Malay, and Tamil)'
  - Singlish is an official language (Singlish is a colloquial creole, not an official language; Singapore Standard English is the official register)
  - Mandarin is one of the official ones (true — but the framing implied it as the second of two; actually it is one of four)
  ground_truth: 'Singapore has FOUR official languages: English, Malay, Mandarin Chinese, and Tamil. English is the primary language of business, government, and education (the medium of instruction since the bilingual policy was introduced in the 1960s-70s). Malay is the NATIONAL language (used in the national anthem "Majulah Singapura"), reflecting the country''s location and Malay heritage. Mandarin and Tamil are Mother Tongue languages for ethnic Chinese and Indian students respectively under the bilingual education policy. SINGLISH is a widely-spoken English- based creole that incorporates Malay, Hokkien, Tamil, and Cantonese influences — but it is NOT an official language; the government''s "Speak Good English" movement actively distinguishes it from Singapore Standard English.'
