- id: SINGAPORE-LABO-B001
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Singapore's Employment Act covers absolutely everyone who works here, no? The standard week is 60 hours, and if I work overtime I get 3x pay automatically?
  false_premises:
  - '"Covers everyone" (the Employment Act applies to most employees but with **CARVE-OUTS** for managers/executives earning above S$4,500/month from certain rights (overtime, rest day, annual leave for absent purposes have specific limits), and certain occupational categories like seamen, domestic workers, public officers have **separate frameworks**; foreign domestic workers (FDWs) are governed by the Employment of Foreign Manpower Act, NOT the main Employment Act for many provisions)'
  - '"Standard week is 60 hours" (under the Employment Act, the **standard work week** is **44 HOURS** with normal working hours of 9 hours/day for 5-day weeks (or 8 hours/day for 6-day weeks); 60 hours is incorrect)'
  - '"3x pay automatically for overtime" (overtime pay rate under the Employment Act is **1.5x the basic hourly rate** (not 3x) for non-workman employees earning up to S$2,600/month; for workmen up to S$4,500/month; managers/executives are typically excluded from statutory overtime entitlement; on a public holiday or rest day worked, the multiplier is different (e.g., 2x for rest day worked beyond half-day))'
  ground_truth: 'The **Employment Act** (Cap. 91) is Singapore''s main labour-protection statute, administered by the **Ministry of Manpower (MOM)**. **COVERAGE**: applies to all employees in Singapore — local and foreign — under a contract of service, with **CARVE-OUTS** for managers/executives earning above S$4,500/month (excluded from Part IV — overtime, rest day, annual leave provisions) and special rules for **seamen, domestic workers, certain government employees**. **STANDARD WORKING HOURS** (Part IV): up to **44 HOURS/week**, with normal hours typically 9 hours/day (5-day work week) or 8 hours/day (6-day); maximum 12 hours/day including overtime. **OVERTIME RATE**: **1.5x basic hourly rate** for OT beyond standard hours, capped at 72 hours per month total OT. **REST DAY**: at least 1 day per week. **PUBLIC HOLIDAYS**: 11 paid public holidays; if required to work, additional day''s pay or off-in-lieu plus normal pay. **ANNUAL LEAVE**: minimum 7 days after 1 year''s service, increasing by 1 day per additional year up to 14 days (more for many employers under contract). **SICK LEAVE**: 14 days outpatient, 60 days hospitalisation per year (after 6 months). **SALARY PAYMENT**: monthly within 7 days of period end. **WRONGFUL DISMISSAL**: appealable to the **Tripartite Alliance for Dispute Management (TADM)** within 1 month. **MATERNITY LEAVE**: 16 weeks paid (12 weeks for non-Citizens). Foreign Domestic Workers, public officers, and certain other categories have their own frameworks.'
  graceful_unknown: The "44-hour standard week, 1.5x OT rate, 7-14 days annual leave, manager/exec carve-outs above $4,500" framing is the load-bearing point. Specific thresholds and amendments are revised; mom.gov.sg authoritative.
