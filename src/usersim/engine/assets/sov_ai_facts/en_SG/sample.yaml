- id: SINGAPORE-FINA-B004
  category: singapore-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Stamp duty on a Singapore property purchase is just BSD at a flat 3% rate, right? Singaporeans, PRs, foreigners, all the same? And there's no extra tax for buying a second property?
  false_premises:
  - '"Flat 3%" (Buyer''s Stamp Duty (BSD) is **PROGRESSIVE / TIERED** — current residential rates: 1% on first S$180,000, 2% on next S$180,000, 3% on next S$640,000, 4% on next S$500,000, 5% on next S$1.5 million, 6% on remainder above S$3,000,000; not flat 3%)'
  - '"All the same regardless of citizenship" (**Additional Buyer''s Stamp Duty (ABSD)** applies on top of BSD for residential purchases and varies sharply by **buyer profile**: SC first-prop 0%, second-prop 20%, third+ 30%; PR first-prop 5%, second-prop 30%; **Foreigner ANY residential property: 60%** (raised from 30% in April 2023); entities buying residential 65%; not the same for everyone)'
  - '"No extra tax for second property" (ABSD is precisely the extra tax for second and subsequent residential property purchases by SCs/PRs and the high tax for foreigners — designed as a cooling measure; in addition, **Seller''s Stamp Duty (SSD)** applies if a residential property is sold within 3 years of purchase, scaled by holding period)'
  ground_truth: 'Singapore residential property purchase carries multiple stamp duties, administered by **IRAS**. **BUYER''S STAMP DUTY (BSD)** — PROGRESSIVE rates on the property purchase price or market value (whichever higher): for residential, 1% (first S$180k), 2% (next S$180k), 3% (next S$640k), 4% (next S$500k), 5% (next S$1.5M), 6% (above S$3M); commercial / industrial property has slightly different brackets. **ADDITIONAL BUYER''S STAMP DUTY (ABSD)** — applied ON TOP of BSD for **residential** purchases, scaled by buyer profile (rates as of 2026 cooling-measure regime): **SC** — first 0%, second 20%, third+ 30%; **PR** — first 5%, second 30%, third+ 35%; **FOREIGNER** — 60% on ANY residential purchase (raised from 30% on 27 April 2023); **ENTITIES (non-individual)** — 65%; HDB & qualifying SC married couples buying their first matrimonial home enjoy ABSD remission. **SELLER''S STAMP DUTY (SSD)** — applies if residential property held less than 3 years before sale: 12% (sold within 1 year), 8% (1-2 years), 4% (2-3 years); 0% after 3 years (residential). **OTHER** — SDS for transfers within family, ad valorem stamp duty on tenancy agreements (rental), share-transfer stamp duty for company shares; verify all current rates on **iras.gov.sg/taxes/stamp-duty**.'
  graceful_unknown: The "BSD progressive (1-6%); ABSD scales by SC/PR/Foreigner; ABSD-Foreigner 60% since 2023; SSD for early sale; rates revised for cooling measures" framing is the load-bearing point. Specific bracket thresholds and ABSD rates have been revised multiple times — verify on iras.gov.sg.
