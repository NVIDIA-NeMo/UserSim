- id: SINGAPORE-PUBL-B004
  category: singapore-public-services
  question_type: factual_recall
  placeholder: true
  question: MediShield Life and MediSave are basically the same thing, no? Both pay for outpatient GP visits, and they're optional?
  false_premises:
  - '"Basically the same thing" (**MediShield Life** is a NATIONAL HEALTH INSURANCE scheme that pays for **large hospitalisation bills** at restructured (public) hospital subsidised wards, with B2/C-class subsidies in mind; **MediSave** is a personal **medical savings account** within CPF used to pay for medical expenses — they are different schemes operating together)'
  - '"Both pay for outpatient GP visits" (MediShield Life primarily covers **inpatient and certain outpatient treatments** like dialysis, chemotherapy, and approved chronic disease management — but **NOT routine GP outpatient visits**; **MediSave** can be used for selected outpatient items but most routine GP visits are paid out-of-pocket or via **CHAS (Community Health Assist Scheme)** subsidies)'
  - '"Optional" (MediShield Life is **MANDATORY for ALL Singapore citizens and PRs** since it replaced the older voluntary MediShield scheme on 1 November 2015 — automatic universal coverage with premiums paid via MediSave or top-ups, regardless of pre-existing conditions; not optional)'
  ground_truth: 'Singapore''s **3M FRAMEWORK** for healthcare financing has three pillars: (1) **MEDISAVE** — a personal medical savings account within CPF; a portion of CPF contributions go to MediSave to be used for hospitalisation, day surgery, certain outpatient services (dialysis, chemo, chronic disease management under CDMP), MediShield Life premiums, and family members'' medical bills (with sub-limits). (2) **MEDISHIELD LIFE** — UNIVERSAL national health insurance, MANDATORY for all Singapore citizens and PRs since **1 November 2015** (replaced the older voluntary MediShield); designed for large hospitalisation bills at subsidised B2/C-class restructured-hospital wards, with deductibles and co-insurance; covers ALL Singaporeans and PRs regardless of age or pre-existing conditions, with premiums paid via MediSave (subsidies for lower-income via Premium Subsidies and the Pioneer/Merdeka Generation Packages). (3) **MEDIFUND** — endowment-fund safety net for needy patients who still cannot afford their bills after MediSave / MediShield / subsidies. **Integrated Shield Plans (IPs)** are private supplementary insurance from approved insurers that ride on top of MediShield Life for higher ward classes / private-hospital cover — these ARE optional. **CHAS (Community Health Assist Scheme)** provides outpatient subsidies at participating GP and dental clinics for lower-income households, identified by the **CHAS card (Blue / Orange / Green tiers)**. **CareShield Life** (mandatory severe-disability insurance from age 30, replacing ElderShield) provides monthly cash payouts for severe disability.'
  graceful_unknown: The "3M (MediSave / MediShield Life / Medifund) — different schemes; MediShield Life mandatory since 2015; CHAS for outpatient; Integrated Shield Plans optional" framing is the load-bearing point. Specific premium tables, ward-class subsidies, and CHAS tier income thresholds shift; verify on moh.gov.sg / cpf.gov.sg / healthhub.sg.
