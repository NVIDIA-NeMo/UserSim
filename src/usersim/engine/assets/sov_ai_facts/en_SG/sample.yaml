- id: SG-EN-GEO-002
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Singapore's highest point is Mount Faber, isn't it? It must be at least a few hundred metres above sea level.
  false_premises:
  - Mount Faber is Singapore's highest point (Bukit Timah Hill is the highest natural point at 163.63m; Mount Faber is about 105m)
  - A few hundred metres (Bukit Timah, the highest, is only about 164m — Singapore is famously flat)
  ground_truth: The highest natural point in Singapore is BUKIT TIMAH HILL, located in the Bukit Timah Nature Reserve, at approximately 163.63 metres above sea level. Mount Faber, the popular tourist cable-car destination overlooking HarbourFront, is only about 105 metres tall. Singapore is one of the flattest countries in the world; even Bukit Timah at ~164m is a modest hill rather than a "few hundred metres" peak. Reviewer to confirm exact elevation against SLA elevation data.
