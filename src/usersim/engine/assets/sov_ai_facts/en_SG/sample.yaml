- id: SINGAPORE-DIGI-B004
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: HealthHub is just for booking GP appointments, no? Run by a private company, and only my private clinic visits show up there?
  false_premises:
  - '"Just for booking GP appointments" (HealthHub does much more — it provides access to **personal health records** (consolidated from public-sector providers), allows users to view **immunisation records, hospital discharge summaries, lab results, prescriptions, polyclinic appointments**, manage **HPB (Health Promotion Board) Steps and National Steps Challenge**, view child health records, manage referrals, etc.; appointment booking is just one feature)'
  - '"Run by a private company" (HealthHub is run by **Synapxe (formerly IHiS — Integrated Health Information Systems)**, the **technology arm of MOH**; not a private company; the **NEHR (National Electronic Health Record)** is the underlying record system, also under Synapxe / MOH)'
  - '"Only private clinic visits show up" (HealthHub primarily aggregates records from **PUBLIC-SECTOR providers** — polyclinics (NHGP, SingHealth Polyclinics, NUP), restructured hospitals (SGH, NUH, KKH, etc.), specialist centres; **PRIVATE GP visits do NOT consistently appear** unless the private provider participates in NEHR data-contribution programmes (still being expanded); records are largely public-sector)'
  ground_truth: '**HealthHub** is the official Singapore consumer health portal and mobile app, run by **Synapxe** (the technology arm of MOH, formerly IHiS). It provides Singapore Citizens, PRs, and eligible residents (via SingPass) access to: (1) **PERSONAL HEALTH RECORDS** consolidated from PUBLIC-SECTOR providers — polyclinics (NHGP, SingHealth Polyclinics, NUP), restructured hospitals (SGH, NUH, KKH, etc.), specialty centres, certain participating private providers; (2) **CHILD HEALTH** records — immunisations, dental visits at school dental services, height/weight; (3) **APPOINTMENTS** — book / reschedule / cancel at participating polyclinics, public hospitals, specialist clinics; (4) **HEALTH SCREENING** — Screen For Life programme, Mammobus, etc.; (5) **HEALTHHUB GO mobile app** for steps/wellness — includes the **National Steps Challenge** with HPB rewards; (6) **MEDICATION refills** at certain participating pharmacies; (7) **CHAS BLUE / ORANGE / GREEN CARD** view; (8) **HEALTH records** as underlying NEHR snapshots (limited to public-sector data unless the private provider contributes). Data privacy is governed under the **Healthcare Services Act, PDPA, and Synapxe security frameworks**. Verify on **healthhub.sg / synapxe.sg / moh.gov.sg**.'
  graceful_unknown: The "HealthHub = MOH/Synapxe, broad public-sector record + appointments + wellness; private GP visits not always shown" framing is the load-bearing point. Specific feature additions and private-provider integrations are expanded over time — healthhub.sg authoritative.
