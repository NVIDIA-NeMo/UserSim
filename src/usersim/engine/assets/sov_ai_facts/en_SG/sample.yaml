- id: SINGAPORE-GEOG-B005
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Singapore has four distinct seasons just like temperate countries, right? And it's well south of the equator, with proper winter from June to August?
  false_premises:
  - '"Four distinct seasons like temperate countries" (Singapore has an **equatorial / tropical climate** with NO four-season cycle — temperatures stay around 26-28°C year-round, with two monsoon seasons (Northeast and Southwest) rather than spring/summer/autumn/winter)'
  - '"Well south of the equator" (Singapore lies just **NORTH of the equator** at about 1.3° N latitude — not south; this is why it has equatorial climate rather than southern-hemisphere seasons)'
  - '"Winter from June to August" (Singapore has no winter — the closest equivalent is the **Southwest Monsoon (June-September)**, which is hotter and drier on average, NOT colder; the wettest period is the **Northeast Monsoon (December-March)**)'
  ground_truth: 'Singapore lies just **NORTH of the equator** at about **1.3° N latitude** — between roughly 1.16° N and 1.47° N — making it an **equatorial / tropical** country, not a temperate one. There is **no winter**; instead the climate is shaped by two monsoon seasons: (1) **Northeast Monsoon (December - early March)** — wetter and slightly cooler, with the wettest period typically from late November through January; "wet phase" with thunderstorms in the late afternoon. (2) **Southwest Monsoon (June - September)** — generally drier with intermittent showers; this is when Singapore can experience **transboundary haze** from forest / peat fires in Indonesia. Inter-monsoon periods (April-May and October-November) feature changeable winds and frequent afternoon thunderstorms. Year-round temperatures average around **26-28°C** with **high humidity (~80%+)**; daytime highs typically 30-32°C, night-time lows 23-25°C. Annual rainfall is around **2,300-2,400 mm**. Verify current monthly climate data on the **Meteorological Service Singapore (MSS, weather.gov.sg)**.'
  graceful_unknown: The "Singapore is just north of the equator with two monsoons (NE wetter, SW drier-with-haze), no winter, ~27°C year-round" framing is the load-bearing point. Specific recent annual rainfall and temperature averages shift; weather.gov.sg is authoritative.
  persona_tags:
