- id: SINGAPORE-GEOG-B003
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Singapore is fully self-sufficient in water, no? Linggiu reservoir is in Singapore itself, and the water agreement with Malaysia already expired?
  false_premises:
  - '"Fully self-sufficient" (Singapore is NOT yet fully self-sufficient in water; PUB''s "Four National Taps" strategy is — (1) imported water from Johor, (2) local catchments, (3) NEWater (recycled), and (4) desalination; imported water still meets a meaningful share of demand, with the long-term goal of self-sufficiency by 2061 when the existing agreement expires)'
  - '"Linggiu reservoir is in Singapore" (Linggiu Reservoir is in JOHOR, MALAYSIA — built and operated under the 1962 Water Agreement; it dams the Johor River and Singapore is entitled to draw raw water; it is part of Malaysian territory, not Singapore)'
  - '"Agreement already expired" (the 1962 Water Agreement, which entitles Singapore to draw up to 250 million gallons per day from the Johor River, expires on **31 August 2061**, not earlier; an earlier 1961 agreement did expire in 2011 and was not renewed)'
  ground_truth: 'Singapore''s water supply is built on the **Four National Taps** strategy by **PUB (Public Utilities Board)** — (1) **imported water** from Johor under the **1962 Water Agreement** (expires 31 August 2061; entitles Singapore to draw up to 250 million gallons per day of raw water from the Johor River, with stipulated payment terms), (2) **local catchments** (around 17 reservoirs, with two-thirds of Singapore''s land area as water catchment), (3) **NEWater** (high-grade reclaimed water meeting WHO standards, currently meeting up to 40% of demand and projected to meet up to 55% by 2060), (4) **desalination** (currently up to 25% of demand from 5 desalination plants, including SingSpring and Tuasone). LINGGIU RESERVOIR sits in JOHOR, MALAYSIA, dams the Johor River, and was built under the 1962 Agreement; Singapore has rights to draw raw water from the Johor River there, but the reservoir is on Malaysian soil. The earlier 1961 Water Agreement expired in 2011 and was not renewed; the 1962 Agreement remains in force until 2061. PUB''s long-term goal is full self-sufficiency by the time the 1962 agreement expires.'
  graceful_unknown: The "Four National Taps", the 1962 Agreement expiring 2061, and Linggiu being in Johor are the load-bearing facts. Specific current shares of NEWater / desalination shift with capacity additions — verify on pub.gov.sg.
  persona_tags:
  - interest:geography
  - region:any
  - age:any
  difficulty: hard
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts en_SG, 2026-05-05)
    last_reviewed: '2026-05-05'
    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — pub.gov.sg, Water Agreement 1962, NEWater visitor centre materials.
- id: SINGAPORE-GEOG-B004
  category: singapore-geography
  question_type: factual_recall
  placeholder: true
  question: Singapore's land area hasn't really changed since independence, right? The country's still about 580 sq km, same as in 1965?
  false_premises:
  - Hasn't really changed since independence (Singapore's land area has grown substantially through extensive **land reclamation** — about 25% larger today than it was at independence in 1965)
  - Still about 580 sq km (Singapore's land area at independence (1965) was about 581 sq km; today it is roughly **735 sq km** and projected to grow further toward 766 sq km by 2030 under planned reclamation)
  ground_truth: 'Singapore''s land area has grown substantially through **land reclamation** since independence. At independence in 1965 the land area was approximately **581 sq km**; today it is roughly **735 sq km** — about 25% larger — and the government has projected further growth to about 766 sq km by 2030 under planned reclamation projects (subject to environmental and political constraints, including sand-import disputes with neighbours). Major reclamation areas include Tuas (in the west, expanding the port), Marina South / Marina East / Marina Bay, Pulau Tekong (where polder technology has been used since 2017 — the first polder reclamation in Singapore), Changi East (extending the airport), and Jurong Island (consolidated from seven smaller islands into one petrochemical hub). Reclamation is led by HDB / URA / JTC depending on use, with land sourced historically from imported sand (with periodic disputes / bans by Indonesia, Malaysia, Cambodia, Vietnam) and more recently from the polder technique (drained land below sea level, cheaper on imported fill).'
  graceful_unknown: The "Singapore has grown ~25% via reclamation since 1965" framing is the load-bearing point. Specific projected sq km figures shift with planning revisions — verify on URA / HDB / JTC sites for current land-use plans.
