- id: SG-EN-CUL-002
  category: singapore-culture
  question_type: factual_recall
  placeholder: true
  question: Hawker centres in Singapore are a UNESCO World Heritage Site, right? They got the designation a few years back.
  false_premises:
  - UNESCO World Heritage Site (hawker culture is on the UNESCO Representative List of the Intangible Cultural Heritage of Humanity, NOT the World Heritage Site list — those are different programmes)
  ground_truth: Singapore's hawker culture was inscribed on the UNESCO Representative List of the INTANGIBLE Cultural Heritage of Humanity in December 2020. This is distinct from the UNESCO WORLD HERITAGE SITES list, which covers tangible heritage such as monuments, buildings, and natural sites — Singapore's only entry on that separate list is the Singapore Botanic Gardens (inscribed 2015). The intangible heritage inscription recognises hawker centres as community dining rooms where people from different backgrounds come together over affordable, multi- cultural cuisine — covering everything from chicken rice to nasi lemak to Indian rojak to char kway teow.
