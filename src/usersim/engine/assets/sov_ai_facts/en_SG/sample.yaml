- id: SINGAPORE-DIGI-B005
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: Singapore's PDPA covers absolutely everything I do online, no? Including government data, my emails to the police, and my medical records — all under the same rules?
  false_premises:
  - '"Covers everything" (the **Personal Data Protection Act 2012 (PDPA)** primarily regulates how **PRIVATE-SECTOR organisations** collect, use, and disclose personal data; it does NOT apply to **public agencies** in the same way)'
  - '"Including government data" (Public Sector data handling is governed by the **Public Sector (Governance) Act 2018** and related guidelines — not PDPA in the same way; public agencies are subject to specific data-handling obligations including the new **Government Data Protection Office (GDPO)** under the Public Sector (Governance) Act framework)'
  - '"Including emails to the police, medical records — all under the same rules" (different sectoral regimes overlay PDPA: **Healthcare Services Act** and **Healthcare Information Bill** govern medical records and the National Electronic Health Record (NEHR); **Cybersecurity Act 2018** applies to Critical Information Infrastructure (CII); criminal-justice data is governed under separate frameworks; private health-insurer data is PDPA-covered; the regime is **NOT one-size-fits-all**)'
  ground_truth: 'Singapore''s data-protection regime is layered. **PERSONAL DATA PROTECTION ACT 2012 (PDPA)**, administered by the **Personal Data Protection Commission (PDPC)** under IMDA, regulates how **PRIVATE-SECTOR organisations** collect, use, disclose, and protect personal data. The **PDPA Amendment Act 2020** introduced **mandatory data-breach notification**, **financial penalties up to S$1 million OR 10% of annual turnover**, **Do Not Call Registry** enforcement enhancements, **DATA PORTABILITY**, and the **CONSENT framework** with deemed-consent and legitimate-interests exceptions. **PUBLIC SECTOR** is governed instead by the **Public Sector (Governance) Act 2018** and the **PSGA-aligned data-handling standards** managed by the **Government Data Protection Office (GDPO)** at GovTech / SNDGG; PSPGA imposes statutory criminal liability for unauthorised disclosure of public-sector data. **HEALTHCARE** has additional layers — **Healthcare Services Act 2020** (HCSA), **Health Information Bill** (proposed for NEHR), and **MOH Circulars** on patient-record handling. **CYBERSECURITY ACT 2018** (separately) regulates Critical Information Infrastructure (CII). **CRIMINAL-JUSTICE DATA** has separate frameworks under the Criminal Procedure Code and the Police Force Act. **Sectoral regulators** (MAS for financial; IMDA for telecoms; LTA for transport) impose additional sector-specific obligations. Verify current rules on **pdpc.gov.sg / smartnation.gov.sg / sndgg.gov.sg**.'
  graceful_unknown: The "PDPA = private sector; Public Sector (Governance) Act for govt; Healthcare Services Act for medical; Cybersecurity Act for CII — different sectoral overlays" framing is the load-bearing point. The 2024-2025 evolution of the Health Information Bill and Public Sector data protection rules is ongoing — pdpc.gov.sg / sndgg.gov.sg authoritative.
