- id: SINGAPORE-EDUC-B005
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: Edusave is for university tuition, no? Parents put in their own money each month, and only PR / SC kids in private schools qualify?
  false_premises:
  - '"For university tuition" (Edusave is primarily for **PRIMARY and SECONDARY** school enrichment; specific schemes within Edusave (e.g., Edusave Awards, Edusave Scholarships) extend to JC and Polytechnic; **NOT for university** — tertiary needs are handled by **MOE Tuition Fee Loan, CPF Education Scheme, MOE Bursaries, scholarships**, etc.)'
  - '"Parents put in monthly" (the **Edusave Pupils Fund** is **GOVERNMENT-funded** — MOE makes annual contributions to each Singapore Citizen child''s Edusave account from age 7 until end of secondary school (and additional top-ups for JC / poly etc. through different sub-schemes); parents do NOT contribute monthly)'
  - '"Only SC/PR in private schools" (Edusave is for **SINGAPORE CITIZEN children** in **MOE-funded mainstream schools** — government, government-aided, autonomous, independent, and specialised schools; **PRs are NOT eligible** for the main Edusave Pupils Fund; not for private schools outside the MOE ecosystem)'
  ground_truth: '**Edusave** is a **government-funded education savings scheme** for Singapore Citizen children, established in 1993, administered by MOE. KEY FEATURES — (1) **Edusave Pupils Fund** — annual contributions credited automatically to a SC child''s Edusave account (from age 7 to end of secondary school, with extensions for JC/Poly via different schemes) — currently around S$230-340 per year depending on level (P1-P6 lower, secondary higher). (2) **USE**: parents draw on Edusave to pay for **MOE-approved enrichment programmes, school-organised CCAs, school camps, second-tier subjects, supplementary materials**, etc.; can NOT be withdrawn as cash. (3) **Edusave Awards** — for top-performers in each level (Edusave Merit Bursary, Edusave Scholarships, EAGLES Award for character/leadership). (4) **Edusave Character Award (ECHA)** — for character development. (5) **Edusave Account** balance can be used by **siblings** if approved. (6) **POST-SECONDARY EDUSAVE** continues for JC and Polytechnic via the **Post-Secondary Education Account (PSEA)** — automatic conversion of unused Edusave at end of secondary; PSEA can also be used for tuition fees at MOE-approved post-secondary institutions and for siblings. **Eligibility**: Singapore Citizen children only. PRs and foreigners are NOT eligible. Verify on moe.gov.sg / cpf.gov.sg PSEA pages.'
  graceful_unknown: The "Edusave = government-funded SC-only scheme for primary/secondary enrichment; PSEA is the post-secondary continuation; not for university" framing is the load-bearing point. Specific annual contribution amounts revised periodically.
