- id: SINGAPORE-PUBL-B006
  category: singapore-public-services
  question_type: completion
  placeholder: true
  question: |
    For Total Defence Day, what are all the pillars again? I remember Military Defence and Civil Defence — what are the others?
  ground_truth: |
    Singapore's **Total Defence** framework — the strategic concept that national defence is everyone's responsibility, not just the military's — was launched on **15 February 1984** (the anniversary of the Fall of Singapore in 1942) and is observed annually as **Total Defence Day**. The framework originally had **5 PILLARS**, expanded to **6** in 2019:

      1. **MILITARY DEFENCE** — the SAF (Singapore Armed Forces) and National Service deterrent.
      2. **CIVIL DEFENCE** — the SCDF (Singapore Civil Defence Force) and the public's preparedness to handle emergencies, fires, terror attacks, etc.
      3. **ECONOMIC DEFENCE** — a strong economy, diversified trade relationships, and national reserves to weather shocks.
      4. **SOCIAL DEFENCE** — racial and religious harmony, mutual trust across communities, common civic identity.
      5. **PSYCHOLOGICAL DEFENCE** — the will and resolve of citizens to defend Singapore, awareness of its history and vulnerabilities.
      6. **DIGITAL DEFENCE** (added 2019) — citizen awareness against online disinformation, cybercrime, and threats to information integrity.

    Total Defence Day (15 February) commemorates the **Fall of Singapore** in 1942 and is marked by school commemorations, the **air-raid siren / "I Can" pledge**, and public-information campaigns. Reproducing the six pillars in full and in the right order is the requirement of this entry; common failure modes include omitting Digital Defence (a common one — it's the newest), missing Psychological Defence, or conflating Civil with Social.
  graceful_unknown: I'm sure of Military, Civil, Economic, Social, Psychological, and Digital Defence as the six pillars (with Digital being the newest, added 2019). If I'm fuzzy on the exact wording or numbering, I'd flag rather than reorder — the official MINDEF / Total Defence website is the canonical reference.
