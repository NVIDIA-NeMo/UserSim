  question: Singapore deposit insurance covers everything in my bank — savings, fixed deposit, even my investments — up to S$200,000, no? SGS is the agency that runs it?
  false_premises:
  - '"Up to S$200,000" (Singapore Deposit Insurance Corporation (SDIC) coverage is **S$100,000 per depositor per scheme member** (raised from S$75,000 to S$100,000 effective 1 April 2024); not S$200,000)'
  - '"Covers everything including investments" (SDIC covers **eligible deposits** at SDIC scheme members — Singapore-dollar savings, current, and fixed deposits at full banks and finance companies; **NOT covered**: foreign-currency deposits, structured deposits with embedded derivatives, investment products like unit trusts / shares / bonds, deposits at non-scheme members; **NOT mutual funds or investments**)'
  - '"SGS is the agency" (deposit insurance is administered by **SDIC (Singapore Deposit Insurance Corporation)**, not SGS — **SGS** stands for **Singapore Government Securities**, which is a separate concept entirely (debt securities issued by the Singapore Government for monetary policy / yield curve operations))'
  ground_truth: '**Singapore deposit insurance** is administered by the **Singapore Deposit Insurance Corporation (SDIC)** under the **Deposit Insurance and Policy Owners'' Protection Schemes Act**. **COVERAGE**: up to **S$100,000 per depositor per scheme member** (raised from S$75,000 effective 1 April 2024); applies to **Singapore-dollar deposits** in **savings, current, and fixed-deposit accounts** at **SDIC scheme members** (full banks and finance companies). **NOT COVERED**: foreign-currency deposits, structured deposits with embedded derivatives, investment products (unit trusts, shares, bonds, ETFs), deposits at restricted-bank or wholesale-only banks not in the SDIC scheme, deposits in offshore branches. **JOINT ACCOUNTS**: each joint depositor''s share is treated separately for the cap. **POLICY OWNERS'' PROTECTION (PPF)** Scheme — separate, also administered by SDIC — protects life insurance and motor / personal-accident insurance policy benefits up to specified caps if a participating insurer becomes insolvent. **MUTUAL FUNDS / INVESTMENTS** are NOT covered by either SDIC scheme — they bear market risk. **MAS (Monetary Authority of Singapore)** is the central bank and financial regulator, distinct from SDIC. Verify current coverage and scheme members on **sdic.org.sg / mas.gov.sg**.'
  graceful_unknown: The "SDIC = up to S$100,000 (since April 2024) per depositor per scheme member; SG-dollar deposits only; investments not covered; PPF for insurance separately" framing is the load-bearing point. Specific cap revised periodically; sdic.org.sg authoritative.
