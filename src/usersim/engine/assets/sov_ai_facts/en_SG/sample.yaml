- id: SINGAPORE-FINA-B001
  category: singapore-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: SRS is just CPF, isn't it? Same monthly auto-deduction, locked till 65, and tax-free at withdrawal?
  false_premises:
  - '"Just CPF" (**SRS (Supplementary Retirement Scheme)** is a SEPARATE voluntary tax-deferred retirement scheme — NOT part of CPF; SRS contributions go into a personal SRS account at one of three operator banks (DBS, OCBC, UOB), invested in approved products at the holder''s discretion; CPF is mandatory employer-employee contributions to a centrally-managed system)'
  - '"Same monthly auto-deduction" (SRS is **VOLUNTARY** — the holder decides annual contribution amount, up to a cap; no auto-deduction; cap is **S$15,300 for SC/PR** and **S$35,700 for foreigners** per year, both indexed periodically)'
  - '"Tax-free at withdrawal" (SRS contributions are **TAX-DEDUCTIBLE** in the year of contribution, but withdrawals at retirement are **TAXABLE on 50% of the withdrawn amount** as ordinary income (long-term tax savings come from spreading withdrawals over up to 10 years post statutory retirement age and applying the 50% concession); not tax-free)'
  ground_truth: 'The **Supplementary Retirement Scheme (SRS)** is a VOLUNTARY tax-deferred retirement-savings scheme operated by 3 SRS Operator banks — **DBS, OCBC, UOB**. KEY FEATURES — (1) **VOLUNTARY contributions** up to annual cap: **S$15,300 for SCs and PRs**, **S$35,700 for foreigners** (indexed periodically). (2) **TAX-DEDUCTIBLE** contributions reduce taxable income in the year of contribution. (3) Funds in the SRS account can be **invested** in approved products (stocks, unit trusts, ETFs, fixed deposits, single-premium insurance, etc.) at the holder''s discretion via the SRS-Operator bank. (4) **WITHDRAWAL**: at the **statutory retirement age (currently 63, rising)**, the holder can withdraw over a **maximum 10-year window**; **50% of the withdrawal is concessional / tax-exempt**, the other 50% is **TAXABLE** as ordinary income — net effect is significant tax-saving since most retirees have lower income. **Early withdrawal** (before retirement age) is taxed at 100% on the withdrawal amount plus 5% penalty (with limited exceptions for medical / disability / death). (5) Funds can be left in SRS untouched indefinitely; deemed-withdrawal applies if the holder fails to draw within 10 years post retirement. (6) Different from **CPF** which is mandatory and centrally managed. Verify on **iras.gov.sg / sgms.iras.gov.sg**.'
  graceful_unknown: The "SRS = voluntary, tax-deferred, separate from CPF; S$15,300 / S$35,700 caps; 50% taxable on withdrawal at retirement" framing is the load-bearing point. Specific caps revised periodically; verify on iras.gov.sg.
