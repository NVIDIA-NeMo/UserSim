- id: SINGAPORE-LABO-B006
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Workfare Income Supplement is just a tax rebate, right? Pays out only at the end of the year, and only Singapore Citizens above 60 qualify?
  false_premises:
  - '"Just a tax rebate" (Workfare Income Supplement (WIS) is a **DIRECT CASH TRANSFER** plus **CPF top-ups** — not a tax rebate; it is paid via direct deposits to the worker''s bank account and CPF (medisave) contribution; you do not have to be paying income tax to receive it)'
  - '"Pays at end of year" (WIS is paid in **MONTHLY tranches** for employees (matching their work months) — not a single annual lump sum; for self-employed persons, payment is annual after Net Trade Income (NTI) declaration to IRAS)'
  - '"Only SCs above 60" (WIS eligibility is for **SC workers AGED 30 and above** (lower for persons with disabilities) earning UP TO S$3,000 (gross monthly) and meeting work / contribution criteria; not 60+; payouts are higher for older workers (e.g., 60+ get the top tier))'
  ground_truth: '**Workfare Income Supplement (WIS)** is a wage-supplement scheme administered by **CPF Board** to support lower-wage Singaporean workers. **ELIGIBILITY**: Singapore Citizens aged **30+** (lower threshold for persons with disabilities), earning up to **S$3,000 monthly** in gross income, with property and Annual-Value caps, who have worked for at least 1 calendar quarter (employees) or 6 months (self-employed). **PAYOUT STRUCTURE**: per work month — tiered by age band (30-34 has lower, 60+ has highest tier) — comprising a **CASH TRANSFER (around 40%)** to the worker''s bank account and **CPF TOP-UPS (around 60%)** to the worker''s CPF accounts. Maximum annual WIS payouts have been raised over time — currently up to several thousand dollars per year for the highest age tier. **EMPLOYEES**: paid monthly to align with work; **SELF-EMPLOYED**: paid annually after NTI declaration to IRAS and required MediSave contributions. **ALONGSIDE**: similar **Workfare Skills Support (WSS)** for training-related supplements, and **Progressive Wage Model (PWM)** for sector-specific minimum wages in cleaning, security, landscape, lift maintenance, retail, food services. Verify current rates and eligibility on **workfare.gov.sg / cpf.gov.sg**.'
  graceful_unknown: The "WIS = direct cash + CPF top-ups; SC 30+ earning ≤S$3,000; monthly for employees, annual for SE; tiered by age (60+ highest)" framing is the load-bearing point. Specific maximum amounts and age tiers revised in budget cycles; workfare.gov.sg authoritative.
