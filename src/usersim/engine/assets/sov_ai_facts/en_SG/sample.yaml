- id: SINGAPORE-EDUC-B001
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: PSLE is just one big exam at the end of Primary 4, no? Tested in 2 subjects, and the score is a percentage out of 100?
  false_premises:
  - '"End of Primary 4" (PSLE — Primary School Leaving Examination — is taken at the end of **Primary 6**, after 6 years of primary education; not Primary 4)'
  - '"Tested in 2 subjects" (PSLE tests **4 subjects**: English Language, Mother Tongue Language (Chinese / Malay / Tamil — and the Higher Mother Tongue option), Mathematics, and Science)'
  - '"Score is a percentage out of 100" (since 2021, PSLE uses **Achievement Levels (ALs)** from AL1 (best) to AL8 (lowest), with the overall PSLE Score being the **sum of ALs** across the 4 subjects (range 4-32, lower is better) — replacing the previous T-score system; not a percentage)'
  ground_truth: '**PSLE (Primary School Leaving Examination)** is the national examination taken by Primary 6 students in Singapore, conducted by the **Ministry of Education (MOE)** in collaboration with the **Singapore Examinations and Assessment Board (SEAB)**. Subjects: **English Language, Mother Tongue Language** (Chinese / Malay / Tamil — with Higher Mother Tongue as an option), **Mathematics**, **Science**; Foundation-level versions of these subjects are also available for less academically inclined students. **From 2021**, PSLE moved from the older **T-score** system (a normed score relative to cohort) to the **Achievement Levels (ALs)** system: AL1-AL8 per subject (AL1 best, AL8 lowest), with **PSLE Score = sum of ALs across 4 subjects (range 4-32, lower is better)**. The reform was intended to reduce excessive fine-grained ranking competition. PSLE Score is used (along with school choice) to allocate students to **Secondary 1** under the **Secondary One Posting** exercise; cut-off points vary by school and stream. Direct School Admission (DSA) and other pathways exist for sports / arts / academic talent admissions.'
  graceful_unknown: The "PSLE = end of P6, 4 subjects, AL1-8 / score-sum 4-32 since 2021" framing is the load-bearing point. Specific cut-offs by school change yearly; MOE publishes posting cut-offs annually.
