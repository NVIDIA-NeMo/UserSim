- id: SINGAPORE-HEAL-B003
  category: singapore-health-systems
  question_type: factual_recall
  placeholder: true
  question: An Integrated Shield Plan covers 100% of my hospital bill, no? With the rider, no co-payment at all, and any private hospital is fully covered?
  false_premises:
  - '"Covers 100%" (an **Integrated Shield Plan (IP)** covers above what MediShield Life covers, but with **deductibles** and **co-insurance**; not 100%)'
  - '"With rider, no co-payment at all" (since **1 April 2021**, ALL new IP riders MUST require AT LEAST 5% CO-PAYMENT by the policyholder (capped at $3,000 per policy year for the standard plans); the previous "as-charged" / no-co-payment riders are not allowed for new policies; existing pre-2021 riders that still operate without 5% co-payment are being phased out)'
  - '"Any private hospital fully covered" (IPs come in tiers — restructured-public-hospital ward A1, private-hospital ward, etc. — premium and coverage differ by tier; cover at private hospitals is subject to the **Pre-authorisation Framework** and the **MAHC (Medical Advisory Council)** guidance on appropriate care; "as-charged" cover at private hospitals depends on plan and the IP insurer''s pre-authorisation; not unconditional)'
  ground_truth: '**Integrated Shield Plans (IPs)** are PRIVATE supplementary insurance products that "ride on top" of **MediShield Life** to provide higher ward-class cover. Offered by 7 MOH-approved insurers (AIA, Great Eastern, HSBC Life, Income Insurance/NTUC Income, Prudential, Raffles Health Insurance, Singlife with Aviva). **STRUCTURE**: each IP includes the basic MediShield Life premium PLUS the additional private premium for higher-ward / private-hospital cover. **RIDERS** (additional policies that pay deductibles + co-insurance) are sold separately. **2021 REGULATORY CHANGE**: from 1 April 2021, all NEW IP riders must require AT LEAST **5% CO-PAYMENT** by the policyholder (capped at S$3,000 per policy year for standard plans), to address moral-hazard concerns from "as-charged" zero-co-pay riders that fed cost inflation; pre-existing zero-co-pay riders are being phased out / re-priced. **PRE-AUTHORISATION FRAMEWORK** (MOH 2018) requires advance approval from insurers for elective procedures above certain bill sizes at private hospitals; **MAHC** publishes appropriate-care guidance. IP TIERS — typically restructured-public-hospital ward A1 / private hospital / private hospital deluxe — premium scales accordingly. Premiums can be paid via **MediSave** up to **Additional Withdrawal Limits (AWL)**, with cash for any excess. Over-65 premiums escalate sharply; switching IPs is allowed during the **annual switching window** but pre-existing conditions trigger underwriting on switch.'
  graceful_unknown: The "IP rides on MediShield Life; 5% co-pay floor since 2021; pre-authorisation for high-bill private; tier-based; MediSave for premium up to AWL" framing is the load-bearing point. Specific premium tables and the post-2021 rider rules are still being phased in for legacy policies — verify on the IP insurer''s site and moh.gov.sg.
