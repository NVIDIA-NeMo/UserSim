- id: SINGAPORE-FINA-B005
  category: singapore-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Singapore is a tax haven — residents pay zero income tax up to a million dollars, no? And the top rate is just 15% above that?
  false_premises:
  - '"Zero income tax up to a million" (Singapore has **PROGRESSIVE personal income tax**; tax-resident individuals pay 0% on the first **S$20,000** of chargeable income, with rising rates from there — 2%, 3.5%, 7%, 11.5%, 15%, 18%, 19%, 19.5%, 20%, 22%, 23%, 24% — the top **24% rate** kicks in on chargeable income above **S$1,000,000** since 2024; not "zero up to a million")'
  - '"Top rate 15%" (the top marginal rate on personal income for tax-residents was 22%, but was raised to **23%** for chargeable income S$500,000-S$1,000,000 and **24%** for above S$1,000,000 from **YA2024**; not 15%)'
  - '"Tax haven" (Singapore has competitive but NOT zero personal income tax; **corporate tax** is **17% headline** with significant exemptions for SMEs and start-ups; **GST 9%** since 2024; the "tax haven" framing is incorrect for residents earning above the basic threshold)'
  ground_truth: 'Singapore''s **PERSONAL INCOME TAX** for **tax residents** is progressive, administered by **IRAS** under the **Income Tax Act**. **TAX-RESIDENT** rates (from Year of Assessment 2024) — **0%** on first S$20,000; **2%** S$20,001-30,000; **3.5%** S$30,001-40,000; **7%** S$40,001-80,000; **11.5%** S$80,001-120,000; **15%** S$120,001-160,000; **18%** S$160,001-200,000; **19%** S$200,001-240,000; **19.5%** S$240,001-280,000; **20%** S$280,001-320,000; **22%** S$320,001-500,000; **23%** S$500,001-1,000,000; **24%** above S$1,000,000 (top rate raised from 22% in YA2024). **NON-TAX-RESIDENT individuals** (in Singapore < 183 days) — 15% flat OR resident rates whichever higher, with director''s fees / fees / interest at 22% (raised to 24% in YA2024). **CORPORATE TAX**: 17% headline, with partial tax exemption (75% on first S$10K, 50% on next S$190K) and start-up exemption schemes. **GST**: 9% since 1 Jan 2024. **PROPERTY TAX**: ad valorem on Annual Value, owner-occupier rates lower than non-owner rates. **NO CAPITAL GAINS TAX** for individuals on personal investments. **NO INHERITANCE / ESTATE DUTY** (abolished from 15 February 2008). Verify current bands and rates on iras.gov.sg.'
  graceful_unknown: The "progressive resident rates 0-24% (top 24% above S$1M from YA2024); corporate 17% with SME exemptions; GST 9%; no CGT; no estate duty since 2008" framing is the load-bearing point. Annual rate adjustments published in the Budget — iras.gov.sg authoritative.
