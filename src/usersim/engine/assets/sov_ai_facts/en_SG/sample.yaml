  - '"Launch in 2007" (GST was introduced in Singapore on **1 April 1994** at **3%** — 30 years ago, not 2007; the rate has risen over time: 3% (1994), 4% (2003), 5% (2004), 7% (2007), 8% (2023), 9% (2024))'
  - '"Food and groceries are exempt" (most goods and services are subject to GST at the standard rate, including food and groceries; **EXEMPT** supplies are limited (financial services, sale and lease of residential property, supply of investment-grade gold/silver/platinum, etc.); **ZERO-RATED** are exports and international services; everyday food and groceries from shops and supermarkets are taxed at 9%, with a separate **GST Voucher scheme** providing offsetting cash and U-Save / MediSave top-ups to lower-income households)'
  ground_truth: 'Singapore''s **Goods and Services Tax (GST)** is a broad-based value-added tax administered by **IRAS (Inland Revenue Authority of Singapore)**. KEY RATES — **introduced 1 April 1994 at 3%**; raised to **4%** (1 Jan 2003), **5%** (1 Jan 2004), **7%** (1 July 2007), **8%** (1 Jan 2023), and **9%** (1 Jan 2024). **EXEMPTIONS** are narrow — financial services, sale and lease of residential property, supply of investment-grade gold/silver/platinum, digital payment tokens. **ZERO-RATED** supplies — exports, international services. Everyday food and groceries from shops and supermarkets are taxed at the standard rate. To **offset GST''s regressivity**, the government runs the **GST Voucher (GSTV) scheme** providing cash payments, U-Save utility-bill rebates, MediSave top-ups, and S&CC rebates to lower-income citizens; and the **Assurance Package** (S$10 billion+ over multiple years) was introduced to cushion the 2023-24 GST hike. **GST Registration** is mandatory for businesses with annual taxable turnover above S$1 million; below that, voluntary. Tourists can claim GST refunds on certain purchases through the **Electronic Tourist Refund Scheme (eTRS)** at Changi Airport.'
  graceful_unknown: The "GST is at 9% since 2024 (introduced 1994 at 3%); few exemptions; food and groceries are taxed; GSTV / Assurance Package offsets" framing is the load-bearing point. Specific historical-rate years and current registration thresholds are stable; for current GST scheme details and rates, iras.gov.sg is authoritative.
