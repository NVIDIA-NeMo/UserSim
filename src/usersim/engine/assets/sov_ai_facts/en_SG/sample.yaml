- id: SINGAPORE-PUBL-B005
  category: singapore-public-services
  question_type: factual_recall
  placeholder: true
  question: For HDB BTO flats, anyone over 21 can apply on their own, no? Singles, foreigners, anyone? Income ceiling is just $5,000 a month, and you can sell after 1 year?
  false_premises:
  - '"Anyone over 21 can apply on their own" (BTO eligibility rules differ by **eligibility scheme**: under the **Public Scheme** an applicant must form a **family nucleus** (married couple, fiancé/fiancée, parents-children, etc.); under the **Single Singapore Citizen Scheme** singles must be **at least 35 years old** to buy a 2-room or 4-room BTO in selected non-mature estates (or 5-room+ resale flat); not "anyone over 21 alone")'
  - '"Singles, foreigners, anyone" (HDB BTO is restricted to **Singapore Citizens** (with at least one applicant being SC); **PRs cannot buy NEW BTO** flats and have many other restrictions; **foreigners (non-PR) cannot buy HDB flats** at all (except in certain limited resale situations); the "anyone" framing is wrong)'
  - '"Income ceiling just $5,000" (income ceilings depend on flat type — for **2-room Flexi**: $7,000 (currently); **3-room**: $7,000 in non-mature estates; **4-room and larger**: $14,000 (with PLH and ECs having different ceilings up to $16,000 / $21,000 for ECs); the $5,000 figure is outdated; income ceilings have been raised periodically)'
  - '"Can sell after 1 year" (HDB has a **MINIMUM OCCUPATION PERIOD (MOP)** of typically **5 YEARS** before owners can sell on the open market or rent out the whole flat; certain new schemes (PLH — Prime Location Public Housing) have **10-year MOP**; not 1 year)'
  ground_truth: 'HDB **Build-To-Order (BTO)** flats are subsidised public housing. ELIGIBILITY: applicants must apply under one of several eligibility schemes — **Public Scheme** (family nucleus: married couples, fiancé/fiancée, parents+children, etc.); **Fiancé/Fiancée Scheme**; **Single Singapore Citizen Scheme** (single, at least 35 years old, citizen, can buy 2-room Flexi BTO in selected non-mature estates, and 5-room+ flats on resale); **Joint Singles Scheme** (two or more SCs aged 35+); **Non-Citizen Spouse Scheme**; etc. **Citizenship**: at least one applicant must be a Singapore Citizen for new BTO; PRs and foreigners have heavy restrictions and generally cannot buy NEW BTO (PRs can buy resale HDB after a 3-year wait following PR grant). **Income ceilings**: 2-room Flexi up to $7,000 monthly household income; 3-room up to $7,000 (non-mature) / $14,000 elsewhere; 4-room and larger up to $14,000; PLH (Prime Location Public Housing) and Executive Condos (ECs) have higher ceilings ($16,000 / $21,000 for ECs); revised periodically. **MINIMUM OCCUPATION PERIOD (MOP)**: typically 5 years before owners can sell on open market or rent out whole flat (subletting rooms allowed earlier, with HDB approval); PLH flats have 10-year MOP; subsidised flats sold during MOP only back to HDB or with HDB approval and resale levy. **Resale Levy** applies when a second-time subsidised flat is bought — must be paid back to HDB on second BTO/EC purchase. Verify current eligibility and ceilings on hdb.gov.sg.'
  graceful_unknown: The "schemes (Public / Single 35+ / etc.); citizenship requirement; tiered income ceilings up to ~$14k; 5-year MOP (10 for PLH)" framing is the load-bearing point. Specific income ceilings and PLH/EC rules are revised; verify on hdb.gov.sg before specific eligibility decisions.
