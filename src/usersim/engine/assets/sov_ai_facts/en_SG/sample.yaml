- id: SINGAPORE-EDUC-B003
  category: singapore-education
  question_type: factual_recall
  placeholder: true
  question: All Singapore secondary schools take the IB Diploma now, right? Replaced the GCE O-Level entirely?
  false_premises:
  - '"All schools take IB" (IB Diploma is offered at a SMALL minority of Singapore schools — mainly **independent and private** schools (e.g., **Anglo-Chinese School (Independent), St Joseph''s Institution (SJI), United World College of South East Asia (UWCSEA), School of the Arts (SOTA)**, and some others); it is NOT the default; the vast majority of secondary schools follow the **MOE national curriculum** ending with **Singapore-Cambridge GCE N(A)/N(T)/O-Level** exams)'
  - '"Replaced GCE O-Level entirely" (the GCE O-Level (O-Levels) is still the principal national secondary-exit certification for the majority of Singapore students; it has been COMPLEMENTED by the **Singapore-Cambridge Secondary 4 Examinations (SEC4)** subjects and is being progressively reformed as part of **Full Subject-Based Banding (Full SBB)**, which replaces the old streaming (Express / Normal Academic / Normal Technical) with subject-level banding — but O-Level itself is NOT replaced by IB)'
  ground_truth: 'Singapore secondary education is dominated by the **MOE national curriculum** ending in the **Singapore-Cambridge General Certificate of Education (GCE) Normal (Academic), Normal (Technical), or Ordinary (O-Level)** examinations, depending on the student''s subject-banding. Recent reform: the previous **streaming** system (Express / Normal-Academic / Normal-Technical introduced 1980s) has been REPLACED by **FULL SUBJECT-BASED BANDING (Full SBB)** from 2024, which removes streams and instead lets students take individual subjects at G1 / G2 / G3 levels (corresponding loosely to old N(T) / N(A) / O-Level standards) based on subject-by-subject performance; ending in the new **Singapore-Cambridge Secondary 4 Examinations (SEC4)** which replaces the older split. **IB DIPLOMA** is offered at a small minority of schools — mainly INDEPENDENT and PRIVATE — including ACS (Independent), SJI, UWCSEA (East and Dover campuses), Hwa Chong International, SOTA, NUS High School (modified), Methodist Girls'' (in Year 5-6 programme), and a few others; not in MOE government-funded mainstream secondary schools. Students at IB schools end with the **IB Diploma** instead of GCE A-Level / O-Level. Universities accept both qualifications. International schools (e.g., Stamford American, Tanglin Trust, Australian International School) follow various international curricula (US, UK, Australian) for their (mostly expat) student base.'
  graceful_unknown: The "Singapore mainstream is GCE O/A-Level under MOE national curriculum; Full SBB replaced streaming in 2024; IB only at select independent/private schools" framing is the load-bearing point. Full-SBB rollout details and individual-school IB offerings shift; MOE and the school websites are authoritative.
