  - '"Only official language" (Singapore has **FOUR official languages**: **English, Malay, Mandarin Chinese, and Tamil** — all four enjoy equal official status under the Constitution)'
  - '"Tamil isn''t one of the four" (Tamil IS one of the four official languages, alongside English, Malay, and Mandarin)'
  ground_truth: 'Under Article 153A of the **Constitution of Singapore**, **MALAY** is the **NATIONAL LANGUAGE** (a status that reflects Singapore''s position in the Malay-speaking world and the historical sovereignty of Malay populations on the island). The **FOUR OFFICIAL LANGUAGES** are **English, Malay, Mandarin Chinese, and Tamil** — all of equal official status. Practical use varies by domain: **English** is the language of administration, business, the Common Curriculum in schools (medium of instruction), and inter-ethnic communication. **Mandarin Chinese** is taught as Mother Tongue to Chinese students (the "Speak Mandarin Campaign" since 1979 promoted Mandarin over Chinese dialects like Hokkien, Teochew, Cantonese, Hakka). **Malay** is taught as MT to Malay students; military words of command and the National Anthem are in Malay. **Tamil** is taught as MT to most Indian students (other Indian languages — Hindi, Bengali, Punjabi, Urdu, Gujarati — are also offered as official Mother Tongues). **SINGLISH** (the local English-based creole) is widely spoken but **NOT an official language**; the government has run a **Speak Good English Movement** since 2000 to promote standard English alongside Singlish.'
