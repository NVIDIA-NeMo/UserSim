- id: SINGAPORE-LABO-B004
  category: singapore-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Retirement age in Singapore is 60, no? After that, my employer can just terminate me without notice, right?
  false_premises:
  - '"Retirement age is 60" (the statutory **RETIREMENT AGE in Singapore is 63** (raised from 62 to 63 effective **1 July 2022**); it is scheduled to rise to **64 (by 2026) and 65 (by 2030)** under the Retirement and Re-employment Act roadmap)'
  - '"Employer can just terminate without notice after retirement" (under the **Retirement and Re-employment Act (RRA)**, employers must **OFFER RE-EMPLOYMENT** to eligible employees who reach the retirement age, until the **RE-EMPLOYMENT AGE of 68** (raised from 67, effective 1 July 2022; will rise to 69 (2026) and 70 (2030)); employers cannot simply dismiss at 63 without a fair re-employment offer or explanation; **EAP (Employment Assistance Payment)** of S$5,500-13,000 is the alternative if no suitable role can be offered)'
  ground_truth: 'Singapore''s **RETIREMENT AND RE-EMPLOYMENT ACT (RRA)** sets a **statutory retirement age** and an **expanded re-employment age** beyond it, intended to keep older workers in employment longer. **CURRENT (as of 2026)**: **RETIREMENT AGE = 63** (raised from 62 to 63 effective 1 July 2022), **RE-EMPLOYMENT AGE = 68** (raised from 67). Roadmap: retirement age to rise to **64 by 2026 and 65 by 2030**; re-employment age to **69 by 2026 and 70 by 2030**. **EMPLOYER OBLIGATIONS**: (a) cannot dismiss an employee on grounds of age before retirement age; (b) MUST OFFER **RE-EMPLOYMENT** to eligible employees who reach retirement age and continue performing satisfactorily, on reasonable terms, until the re-employment age; (c) if no suitable role is available, may offer the **Employment Assistance Payment (EAP)** of **S$5,500-13,000** (for employees who served at least 2 years with the same employer at retirement age), or transfer with the employee''s consent to an associated employer. (d) WAGE/job/responsibility ADJUSTMENTS during re-employment are permitted with mutual agreement, subject to fairness. **CPF contribution rates** taper down progressively for older workers. The **Tripartite Alliance for Fair and Progressive Employment Practices (TAFEP)** handles age-related complaints. Verify current ages and rules on mom.gov.sg.'
  graceful_unknown: The "retirement 63, re-employment 68 (rising to 65/70 by 2030); employer must offer re-employment or EAP; CPF tapers" framing is the load-bearing point. Specific roadmap years can shift; mom.gov.sg and the RRA roadmap are authoritative.
