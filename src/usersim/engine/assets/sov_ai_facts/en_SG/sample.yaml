- id: SINGAPORE-HEAL-B004
  category: singapore-health-systems
  question_type: factual_recall
  placeholder: true
  question: ElderShield is still the active disability insurance, right? Optional, kicks in at age 65, and it's a one-time lump sum payout?
  false_premises:
  - '"Still ElderShield" (**ElderShield** has been REPLACED by **CareShield Life** since **1 October 2020** for new entrants; existing ElderShield policyholders can choose to continue or switch to CareShield Life)'
  - '"Optional" (**CareShield Life is MANDATORY for all SCs and PRs born in 1980 or later**, automatic enrolment from age 30; for those born 1979 or earlier (i.e., over 40 in 2020 launch), CareShield Life is voluntary as opt-in; ElderShield was voluntary but with auto-enrolment opt-out)'
  - '"Kicks in at age 65" (CareShield Life payouts begin when the insured is **certified by an MOH-accredited assessor as having Severe Disability** — defined as inability to perform AT LEAST 3 of 6 Activities of Daily Living (ADLs: washing, dressing, feeding, toileting, mobility, transferring) — at any age, not at 65)'
  - '"One-time lump sum" (CareShield Life pays **monthly cash payouts** that LAST AS LONG AS the disability persists — open-ended, indexed for inflation in early years; not a lump sum)'
  ground_truth: '**CareShield Life**, launched **1 October 2020**, replaced **ElderShield (1 January 2002)** as Singapore''s national long-term-care insurance for **severe disability**. KEY FEATURES — (1) **MANDATORY for SCs and PRs born in 1980 or later** (auto-enrolment from age 30); voluntary opt-in for those born 1979 or earlier (eligible in initial cohort if existing ElderShield policyholders or aged 30-67 in 2020). (2) **MONTHLY CASH PAYOUT** ($600/month at launch in 2020, increasing yearly until age 67, then fixed) — paid for as long as disability persists, no maximum claim period (vs ElderShield 300/400 which had 60- or 72-month caps). (3) **TRIGGER**: assessment as having SEVERE DISABILITY — unable to perform AT LEAST 3 of 6 **Activities of Daily Living (ADLs)** (washing, dressing, feeding, toileting, mobility, transferring) — by an **MOH-accredited Severe Disability Assessor**. (4) **PREMIUM**: paid annually from age 30 to 67 via MediSave (up to limits) or cash; premiums depend on age of joining and increase by 2% / year for first few years to keep pace with payouts. (5) **CARESHIELD LIFE SUPPLEMENTS** — optional private top-ups offered by 3 approved insurers (Aviva, Great Eastern, NTUC Income) for higher monthly payouts. **ElderShield existing policyholders** can choose to continue with ElderShield or switch to CareShield Life. **MediFund Silver** and **Pioneer/Merdeka Generation Disability Assistance Scheme** provide additional support for needy older citizens.'
  graceful_unknown: The "CareShield Life replaced ElderShield Oct 2020; mandatory for those born 1980+ from age 30; severe-disability (3-of-6 ADLs) trigger; monthly payouts open-ended" framing is the load-bearing point. Specific payout amounts and premium tables shift; verify on careshieldlife.gov.sg.
