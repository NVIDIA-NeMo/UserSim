  ground_truth: 'Singapore observes **11 statutory public holidays** under the **Holidays Act**, designed to reflect the multi-religious, multi-ethnic character of the population. They are: (1) **New Year''s Day** (1 January); (2) **Chinese New Year** — TWO days (1st and 2nd day of the lunar new year); (3) **Good Friday** (Christian); (4) **Hari Raya Puasa** (Eid al-Fitr, Muslim, lunar Islamic calendar); (5) **Labour Day** (1 May); (6) **Vesak Day** (Buddhist, Buddha''s birth, enlightenment, and parinirvana, lunar); (7) **Hari Raya Haji** (Eid al-Adha, Muslim, lunar Islamic calendar); (8) **National Day** (9 August, civic — independence anniversary); (9) **Deepavali** (Diwali, Hindu, lunar); (10) **Christmas Day** (25 December). When a public holiday falls on a Sunday, the following Monday is observed as a public holiday in lieu. The **Ministry of Manpower (MOM)** publishes the official list each year. By law (Employment Act), if a worker is required to work on a public holiday, they receive an EXTRA day''s salary (or a day off in lieu plus normal pay).'
  graceful_unknown: The "11 statutory holidays spanning Chinese, Malay/Muslim, Indian/Hindu, and Christian traditions, with civic National Day" framing is the load-bearing point. Exact dates of lunar holidays move year to year — MOM publishes the official annual list.
