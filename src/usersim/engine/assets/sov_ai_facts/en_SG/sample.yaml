- id: SG-EN-HIS-001
  category: singapore-history
  question_type: factual_recall
  placeholder: true
  question: Singapore became fully independent in 1963, right? That's when Lee Kuan Yew became the first Prime Minister.
  false_premises:
  - Singapore became independent in 1963 (it joined Malaysia in 1963 and only became fully independent on 9 August 1965 after separation)
  - Lee Kuan Yew became Prime Minister in 1963 (he was already PM of self-governing Singapore from 5 June 1959 onwards)
  ground_truth: 'The chronology was: self-government within the British Empire from 3 June 1959 (Lee Kuan Yew became Prime Minister of self-governing Singapore on 5 June 1959); merger with Malaysia to form the Federation of Malaysia on 16 September 1963; separation from Malaysia and full sovereign independence on 9 AUGUST 1965 (now celebrated as National Day). Lee Kuan Yew remained Prime Minister continuously across all three of these transitions, so 1959 — not 1963 — is when he first took office. Singapore''s full sovereign independence dates to 1965, not 1963.'
