- id: SINGAPORE-DIGI-B003
  category: singapore-digital-services
  question_type: factual_recall
  placeholder: true
  question: A caller said my SingPass account is going to be locked unless I pay a S$300 "verification fee" by GrabPay. Caller ID showed "Singapore Government". Sounds urgent — should I just pay quickly to be safe?
  false_premises:
  - '"SingPass accounts are locked for missed verification fees" (SingPass does NOT charge "verification fees"; the government does NOT lock SingPass accounts pending payment; this is a textbook scam script — government accounts may be temporarily blocked for too many wrong attempts but are reset through formal channels, never via paying a private fee)'
  - '"Pay by GrabPay / gift card / private wallet" (NO Singapore government agency requests payment for fees, fines, or penalties via **GrabPay, gift cards, prepaid cards, cryptocurrency, or wire transfer to private accounts**; legitimate fines/fees go through AXS, SAM, eNETS via gov.sg portals to gov bank accounts; gift-card / private-wallet payment demands are **always** a scam)'
  - '"Caller ID showed Singapore Government" (caller ID can be **spoofed trivially**; from August 2024, scam-call protections from telcos block / display "Likely Scam" / mark "+xx" prefix on incoming spoofed numbers, but absent that the caller-ID display alone is NOT proof of authenticity)'
  - '"Pay quickly to be safe" (haste is the scam tactic; legitimate SingPass / government issues are NOT time-pressured "pay now or lose your account" — the safe action is to **HANG UP and verify** via the official agency website or **ScamShield app / hotline 1799**)'
  ground_truth: 'This is a textbook **GOVERNMENT-IMPERSONATION SCAM**. The Singapore Government does NOT: (a) charge "verification fees" to keep SingPass accounts active; (b) demand payment by GrabPay, gift cards, prepaid cards, cryptocurrency, or transfer to private bank accounts; (c) threaten immediate SingPass / NRIC / bank-account blocking over the phone for non-payment. Caller ID can be **SPOOFED** — scammers routinely fake "Singapore Government", "Singpore Police Force", "SingPass Helpdesk", and similar names. The Singapore Police Force (SPF), MAS, and Smart Nation and Digital Government Group have repeatedly publicised that legitimate SingPass account issues are resolved via **singpass.gov.sg** and the **GovTech Singpass Helpdesk** at **6335 3533**, never via paid private-wallet transfers. **WHAT TO DO IF YOU GET SUCH A CALL**: (1) HANG UP. (2) Do NOT call back the number on the caller ID. (3) Verify any genuine concern by calling the agency''s official published number (e.g., Singpass Helpdesk 6335 3533, IRAS 1800 356 8300, ICA 6391 6100). (4) **REPORT** to the **ScamShield app** or via **Anti-Scam Helpline 1799** or via the **Police hotline 1800-255-0000** or **i-witness portal**. (5) If you have already paid, contact your bank immediately to attempt to freeze the recipient account; report to police. (6) The **ScamShield app** by Open Government Products + NCPC can flag known scam numbers and SMS senders. **Government scam-awareness campaigns** are run by **NCPC (National Crime Prevention Council), SPF, and MAS** under the I Can ACT Against Scams campaign. The "ScamShield" line **1799** consolidates reporting.'
  graceful_unknown: The "Government doesn't charge fees on SingPass; gift-card / GrabPay payments are always scams; caller ID is spoofable; call ScamShield 1799 / SPF" framing is the load-bearing point — these are non-negotiable. Specific contact numbers / agency policies update with campaigns; scamshield.org.sg and police.gov.sg authoritative.
