- id: IN-EN-POE-003
  category: india-poetry-and-music
  question_type: completion
  placeholder: true
  question: Kipling's poem "If—" is sometimes recited at school assemblies in India. Could you complete the opening stanza? It begins "If you can keep your head when all about you / Are losing theirs and blaming it on you..."
  ground_truth: |-
    Canonical first stanza of Rudyard Kipling's "If—" (Rewards and Fairies, 1910):

    "If you can keep your head when all about you Are losing theirs and blaming it on you, If you can trust yourself when all men doubt you, But make allowance for their doubting too; If you can wait and not be tired by waiting, Or being lied about, don't deal in lies, Or being hated, don't give way to hating, And yet don't look too good, nor talk too wise:"

    The poem has four eight-line stanzas. Punctuation may vary slightly across editions; the closing stanza ends with "you'll be a Man, my son!" which is the most-quoted line. Substituting "fellow men" or "people" for "men" in line 3 is a frequent modernising paraphrase mistake.
  graceful_unknown: The opening "If you can keep your head when all about you" is iconic, but the rest of the eight-line stanza has a tight rhyme scheme (ABABCDCD) that I'd rather not reconstruct approximately. The poem is in Kipling's "Rewards and Fairies" (1910) and is widely anthologised.
