- id: INDIA-GEOG-B006
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: The Western Ghats run along India's east coast, no? Smaller than the Eastern Ghats, mostly in Odisha and Andhra Pradesh?
  false_premises:
  - The Western Ghats run along India's east coast (they run along the WEST coast of the peninsula — roughly from south of the Tapti river through Maharashtra, Goa, Karnataka, Kerala, and into Tamil Nadu)
  - Smaller than the Eastern Ghats (the Western Ghats are larger, more continuous, and significantly higher than the Eastern Ghats; they''re older, run for about 1,600 km, and rise to 2,695 m at Anamudi in Kerala — taller than any peak in the Eastern Ghats)
  - Mostly in Odisha and Andhra Pradesh (those are the EASTERN Ghats states; Western Ghats span Gujarat, Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu)
  ground_truth: The WESTERN GHATS (also called Sahyadri) run along the WEST COAST of peninsular India for roughly 1,600 km — through parts of Gujarat (small section), Maharashtra, Goa, Karnataka, Kerala, and ending in Tamil Nadu. The highest peak is ANAMUDI in Kerala at 2,695 m — taller than any peak in the Eastern Ghats. The Western Ghats are older, more continuous, and ecologically richer than the Eastern Ghats; they''re a UNESCO World Heritage Site (inscribed 2012) and one of the world''s eight "hottest hotspots" of biological diversity. The EASTERN GHATS run discontinuously along India''s east coast through Odisha, Andhra Pradesh, Tamil Nadu, and parts of Karnataka and Telangana, with the highest peak being Jindhagada / Arma Konda in Andhra Pradesh at about 1,690 m. The two ranges meet at the Nilgiri Hills in Tamil Nadu / Kerala.
