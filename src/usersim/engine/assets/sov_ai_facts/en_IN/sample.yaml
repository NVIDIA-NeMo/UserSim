- id: IN-EN-CUL-003
  category: india-culture
  question_type: factual_recall
  placeholder: true
  question: Onam is a Tamil harvest festival celebrated mainly in January, and it commemorates the birth of King Asoka, right?
  false_premises:
  - Tamil festival (Onam is the principal festival of Kerala / the Malayali community, not Tamil)
  - Mainly in January (Onam falls in the Malayalam month of Chingam, which corresponds to August-September in the Gregorian calendar)
  - Commemorates the birth of Asoka (Onam commemorates the legendary King Mahabali's annual visit to his subjects, in Kerala folklore)
  ground_truth: Onam is the principal festival of "Kerala" and the global Malayali community, not Tamil Nadu. It is celebrated in the Malayalam month of CHINGAM (the first month of the Malayalam calendar), which corresponds to mid-August to mid-September in the Gregorian calendar — not January. The 10-day festival commemorates the legendary visit of King MAHABALI to his former subjects in Kerala; according to the legend, Mahabali was a benevolent Asura king whose reign was a golden age, who was sent to the underworld by Vishnu's Vamana avatar but is allowed to visit his people once a year. Onam is not connected to Emperor Ashoka, who was a Mauryan historical figure of the 3rd century BCE. Onam is celebrated across communities in Kerala, irrespective of religion.
