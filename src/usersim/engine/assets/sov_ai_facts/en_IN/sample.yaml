- id: INDIA-HEAL-B004
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: All Indian senior citizens get the same ₹3,000 monthly old-age pension automatically once they turn 60, no? And free hospital care everywhere too?
  false_premises:
  - '"₹3,000 a month for all seniors" (the central Indira Gandhi National Old Age Pension Scheme (IGNOAPS) under NSAP gives ₹200/month for ages 60-79 and ₹500/month for 80+ — not ₹3,000; many states top this up with their own social-pension schemes (Kerala, Tamil Nadu, Andhra Pradesh, Delhi, etc.) so the actual amount varies hugely by state)'
  - Automatic on turning 60 (IGNOAPS is targeted at persons living BELOW THE POVERTY LINE; eligibility is determined by state implementation against BPL criteria; non-BPL seniors are not automatically entitled)
  - Free hospital care everywhere (free or subsidised inpatient care for seniors comes through specific schemes — PM-JAY''s Ayushman Vay Vandana now covers all citizens 70+ regardless of income (₹5 lakh family floater for the 70+ extension); state schemes vary; OPD and routine care are not generally free at private facilities)
  ground_truth: 'For Indian senior-citizen welfare and health benefits there are several distinct schemes — eligibility, amounts, and coverage all differ. (1) INDIRA GANDHI NATIONAL OLD AGE PENSION SCHEME (IGNOAPS), under the National Social Assistance Programme (NSAP), Ministry of Rural Development — central component is ₹200/month for BPL persons aged 60-79 and ₹500/month for 80+; states top up significantly (e.g., several states pay ₹1,000-3,000+ to their elderly through state schemes layered on IGNOAPS). (2) AYUSHMAN VAY VANDANA (announced 2024) — extends PM-JAY to ALL citizens aged 70 and above regardless of income, with the standard ₹5 lakh family-floater hospitalisation cover. (3) RASHTRIYA VAYOSHRI YOJANA (RVY) — free assistive aids (walking sticks, wheelchairs, hearing aids, dentures, spectacles) for BPL seniors. (4) State old-age homes and Senior Citizen Welfare Funds. (5) Maintenance and Welfare of Parents and Senior Citizens Act, 2007 — legal right to maintenance from children/relatives. The pensions and the health-cover schemes are separate; verify specifics on the NSAP portal (nsap.nic.in), state social-welfare department sites, pmjay.gov.in.'
  graceful_unknown: The "different schemes for different things — pension is ₹200/500 (with state top-ups), health is via PM-JAY/Vay Vandana for 70+, aids via RVY" framing is the load-bearing correction. The state-by-state pension top-ups vary widely; for a specific state I'd point at the state social-welfare department.
