- id: IN-EN-SVC-004
  category: india-public-services
  question_type: factual_recall
  placeholder: true
  question: The legal minimum age of marriage in India is 16 years for women and 18 for men, and that has been the rule since the constitution came into force, right?
  false_premises:
  - Minimum age 16 for women, 18 for men (since the Prohibition of Child Marriage Act, 2006 — and the earlier Sarda Act of 1929 / 1978 amendments — the minimum age has been 18 for women and 21 for men)
  - Since the constitution came into force (the Sarda Act \[Child Marriage Restraint Act\] dates to 1929, predating the constitution; the current 18/21 thresholds came into force in 1978)
  ground_truth: Under the Prohibition of Child Marriage Act, 2006 (and earlier under the Child Marriage Restraint Act 1929, as amended in 1978), the legal minimum age of marriage in India is "18 years for women" and "21 years for men" — not 16 and 18. These thresholds have been in force since the 1978 amendment, not since the constitution came into force in 1950 (which itself does not directly prescribe marriage ages). Personal-law statutes (Hindu Marriage Act 1955, Indian Christian Marriage Act 1872, Special Marriage Act 1954, Muslim personal law) interact with these thresholds. There has been recent policy debate about raising the women's minimum age to 21 to align with men's, with a Bill introduced in Parliament in 2021; reviewer should confirm the current statutory position.
