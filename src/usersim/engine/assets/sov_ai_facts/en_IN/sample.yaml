  - Learner's licence not required (a learner's licence is required first; the permanent licence test can be taken after 30 days and within 180 days of the learner's licence being issued)
  ground_truth: 'Indian driving licence age requirements (Motor Vehicles Act): The MINIMUM age for a Light Motor Vehicle (LMV / car) licence is "18 years", not 16. The age of 16 applies only to certain "non-geared two-wheelers" with engine capacity up to 50cc / 4 kW (a category that has been progressively phased out in many states). For commercial vehicles (transport licence), the minimum age is typically 20 years (after recent amendments). A "learner''s licence" IS required before applying for a permanent licence: it is valid for 6 months, and the permanent licence test can be taken between 30 days and 180 days from the learner''s licence date. Reviewer to confirm current rules against the Ministry of Road Transport and Highways notification, as thresholds and categories have been revised periodically.'
