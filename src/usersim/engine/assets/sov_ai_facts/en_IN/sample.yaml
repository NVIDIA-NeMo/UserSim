- id: INDIA-LABO-B005
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: India's Maternity Benefit Act gives 12 weeks of paid leave, no? Only women in companies with 100+ employees get it, and adoption isn't covered?
  false_premises:
  - '"12 weeks of paid leave" (the Maternity Benefit (Amendment) Act, 2017 INCREASED paid maternity leave from 12 weeks to 26 WEEKS for women with fewer than 2 surviving children; mothers of 3rd or later child remain at 12 weeks; commissioning mothers (surrogacy) and adopting mothers of children below 3 months get 12 weeks)'
  - '"Only in companies with 100+ employees" (the Act applies to ESTABLISHMENTS employing 10 OR MORE persons — factories, mines, plantations, shops and establishments, government establishments, and others; not 100+)'
  - '"Adoption isn''t covered" (the 2017 amendment added 12-WEEK paid leave for ADOPTING mothers (where the adopted child is below 3 months) and COMMISSIONING mothers in surrogacy; so adoption is now covered, with conditions)'
  ground_truth: 'The MATERNITY BENEFIT ACT, 1961, as amended by the MATERNITY BENEFIT (AMENDMENT) ACT, 2017, provides paid maternity leave to women workers in covered establishments. KEY PROVISIONS — (1) PAID LEAVE: 26 WEEKS for the first two children (up to 8 weeks before the expected delivery date and the rest after); 12 WEEKS for the third or any subsequent child; 12 WEEKS for adopting mothers (where adopted child is below 3 months) and commissioning mothers (surrogacy) — counted from the day the child is handed over. (2) ESTABLISHMENT THRESHOLD: applies to factories, mines, plantations, government establishments, shops and establishments employing 10 OR MORE persons. (3) ELIGIBILITY: woman must have worked for the employer for at least 80 DAYS in the 12 months immediately preceding the expected date of delivery. (4) WAGES: paid at the rate of average daily wage during the leave period. (5) WORK FROM HOME: where the nature of work permits, the employer may agree to allow work-from-home after the 26-week leave on mutually agreeable terms. (6) CRECHE FACILITY: establishments with 50 OR MORE employees must provide a creche facility, with mother allowed visits 4 times a day. (7) NURSING BREAKS, NO TERMINATION ON GROUND OF MATERNITY, prohibition on dismissal during maternity leave. The Code on Social Security, 2020 incorporates and partly modifies these provisions; verify current notifications.'
  graceful_unknown: The "26 weeks paid (for 1st/2nd child), 10-employee threshold, adoption / surrogacy covered for 12 weeks, 80-day work eligibility" facts are the load-bearing corrections. The interaction with the new Code on Social Security 2020 may slightly modify some provisions on full notification — verify on labour.gov.in.
