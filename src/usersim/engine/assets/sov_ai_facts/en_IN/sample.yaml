- id: INDIA-LABO-B002
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Gratuity, I get it after just 1 year on the job, no? It's 30 days' wages per year of service, and the entire amount is taxable as income?
  false_premises:
  - '"Gratuity after 1 year on the job" (gratuity under the Payment of Gratuity Act, 1972 is generally payable on TERMINATION (retirement, resignation, death, disablement) AFTER the employee has rendered 5 YEARS OF CONTINUOUS SERVICE — not 1 year; on death or disablement the 5-year requirement does NOT apply)'
  - '"30 days'' wages per year of service" (the formula is 15 DAYS'' WAGES per completed year of service (or part thereof in excess of 6 months), based on the LAST DRAWN WAGES; the formula varies for piece-rated workers and seasonal establishments)'
  - '"Entire amount is taxable" (gratuity is TAX-EXEMPT up to a CEILING — for non-government employees covered under the Payment of Gratuity Act, the exemption limit is ₹20 LAKH (raised from ₹10 lakh in 2018); for government employees, gratuity is FULLY EXEMPT; only the amount above the exemption limit is taxable as salary income)'
  ground_truth: 'GRATUITY is a statutory terminal benefit governed by the PAYMENT OF GRATUITY ACT, 1972. ELIGIBILITY: payable to employees in covered establishments (non-seasonal factories, mines, oilfields, plantations, ports, railways, shops/establishments with 10+ employees) on termination of employment after FIVE YEARS OF CONTINUOUS SERVICE — through retirement, resignation, superannuation, or termination, including for the legal heirs in case of DEATH or DISABLEMENT of the employee (where the 5-year continuous-service requirement does NOT apply). FORMULA: for monthly-rated employees, GRATUITY = (LAST DRAWN BASIC + DA) × 15/26 × COMPLETED YEARS OF SERVICE (years rounded up if last partial year exceeds 6 months). Different formulas apply for piece-rated and seasonal establishments. CEILING: maximum statutory gratuity is ₹20 LAKH (raised from ₹10 lakh by the 2018 amendment for non-government employees covered under the Act); employers may pay more under contract. TAX TREATMENT: under Section 10(10) of the Income-tax Act, gratuity is FULLY EXEMPT for central / state / local government employees; for employees covered under the Payment of Gratuity Act, exempt up to the LEAST of (a) ₹20 lakh, (b) actual gratuity received, (c) 15 days'' wages × completed years; only the excess is taxable. The "Continuous service" definition (Section 2A) covers absence due to lay-off, leave, or maternity etc., and includes a deemed-continuity for service interruption due to no fault of the employee.'
  graceful_unknown: The "5 years continuous service, 15 days × years × last-drawn-basic+DA / 26, ₹20 lakh exempt cap, death/disablement waives 5-year rule" framing is the load-bearing point. Specific calculation edge cases (piece-rated, seasonal) and possible changes when the new Code on Wages / Social Security Code provisions are notified — verify against the latest gazette and labour.gov.in.
