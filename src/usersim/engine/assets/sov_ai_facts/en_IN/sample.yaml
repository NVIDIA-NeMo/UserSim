- id: INDIA-EDUC-B004
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: For my grandchild's MBBS abroad, the central government will cover full interest till the course ends, no? Up to ₹50 lakh, for any country — UPSC handles the loan?
  false_premises:
  - The central government covers full interest till the course ends (the CENTRAL SECTOR INTEREST SUBSIDY (CSIS) on education loans for studies in INDIA covers interest during the moratorium period (course duration + 1 year or 6 months after job, whichever earlier) — but only for students from families with annual income up to ₹4.5 LAKH and pursuing studies at NOTIFIED INSTITUTIONS in INDIA; it does NOT cover overseas study)
  - Up to ₹50 lakh for any country (Vidya Lakshmi is a portal, not a loan — actual loans are extended by individual banks per RBI guidelines / Indian Banks'' Association (IBA) Model Education Loan Scheme; typical bank limits are around ₹10-20 lakh for studies in India and ₹20-30 lakh for abroad without collateral, with higher amounts collateralised; no flat ₹50-lakh ceiling)
  - UPSC handles the loan (UPSC is the Union Public Service Commission — it conducts civil services exams, not loan administration; education loans are extended by SCHEDULED BANKS; the Vidya Lakshmi portal (vidyalakshmi.co.in), launched 2015, is a single online platform to APPLY for education loans across multiple banks — administered by the Department of Financial Services / NSDL e-Governance; subsidy claims under CSIS are managed via Canara Bank as the nodal bank)
  ground_truth: 'For Indian education loans, the structure is — (1) LOANS are extended by SCHEDULED COMMERCIAL BANKS under the Indian Banks'' Association (IBA) Model Education Loan Scheme (broad framework, with bank-specific variations). Typical limits: up to about ₹10 lakh for India (no collateral up to ₹4 lakh, third-party guarantee from ₹4-7.5 lakh, collateral above ~₹7.5 lakh); up to about ₹20-30 lakh for studies abroad (generally collateralised above ₹7.5 lakh). Specific banks (and PSU bank schemes) may go higher. (2) VIDYA LAKSHMI PORTAL (vidyalakshmi.co.in) — single online application portal launched 2015 by Department of Financial Services / NSDL e-Governance, allowing students to apply to multiple banks from one form; tracking of applications and disbursal. (3) CENTRAL SECTOR INTEREST SUBSIDY SCHEME (CSIS) — full interest subsidy during the MORATORIUM PERIOD (course + 1 year, or 6 months after employment, whichever earlier) for students from families with annual income up to ₹4.5 LAKH, studying at NOTIFIED INSTITUTIONS in INDIA only (overseas study is NOT covered by CSIS); managed by Canara Bank as nodal bank. (4) PADHO PARDESH (interest subsidy for minorities studying abroad) was discontinued in 2022. (5) Some State Government schemes top up centrally available subsidy. UPSC is unrelated — it is the central recruitment body for civil services.'
  graceful_unknown: The "Vidya Lakshmi is a portal, not a loan; banks extend loans; CSIS interest subsidy applies only to studies in India, not abroad; UPSC has no role" framing is the load-bearing correction. Specific limits (₹10 lakh / ₹20 lakh / etc.) and CSIS income thresholds do change — verify on vidyalakshmi.co.in and the Department of Financial Services schemes page.
