- id: IN-EN-HIS-002
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: Emperor Ashoka belonged to the Gupta dynasty and ruled in the 5th century AD, right?
  false_premises:
  - Belonged to the Gupta dynasty (Ashoka was a Mauryan emperor, not a Gupta)
  - Ruled in the 5th century AD (Ashoka ruled in the 3rd century BCE, roughly 268-232 BCE — over 700 years before the Gupta era)
  ground_truth: Ashoka the Great belonged to the MAURYAN dynasty (founded by his grandfather Chandragupta Maurya), not the Gupta dynasty. He ruled from approximately 268 BCE to 232 BCE — in the 3rd century BCE — not in the 5th century AD. The Mauryan and Gupta periods are separated by about 700 years (the Gupta empire flourished circa 320-550 CE). Ashoka is best known for his patronage of Buddhism after the Kalinga conflict, his rock and pillar edicts spread across the subcontinent (the earliest surviving substantial epigraphic corpus in India), and the Lion Capital of Sarnath, which became independent India's national emblem in 1950.
