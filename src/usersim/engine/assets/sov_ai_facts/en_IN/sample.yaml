- id: INDIA-EDUC-B005
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Sarva Shiksha Abhiyan still runs separately for primary schools, no? And mid-day meals are only for government schools, not government-aided ones?
  false_premises:
  - Sarva Shiksha Abhiyan still runs separately (SSA, RMSA, and the Centrally Sponsored Scheme on Teacher Education were SUBSUMED INTO Samagra Shiksha in 2018 — Samagra Shiksha is the integrated scheme for school education from pre-school to Class 12; SSA is no longer a separate running scheme)
  - Mid-day meals are only for government schools (the meal scheme — now branded PM POSHAN (PM Poshan Shakti Nirman) since 2021 — covers government and government-AIDED schools and special-training-centre / Madarsa students supported under SSA; eligibility criteria expanded to include pre-primary children in 2022; private unaided schools are NOT covered, but government-aided are)
  ground_truth: 'In 2018 the Government of India INTEGRATED three Centrally Sponsored Schemes — SARVA SHIKSHA ABHIYAN (SSA, elementary), RASHTRIYA MADHYAMIK SHIKSHA ABHIYAN (RMSA, secondary), and CENTRALLY SPONSORED SCHEME ON TEACHER EDUCATION (CSSTE) — into a single overarching scheme called SAMAGRA SHIKSHA, covering school education from pre-school to Class 12. SSA, RMSA, and CSSTE are no longer separately operational. The MID-DAY MEAL SCHEME (originally launched in 1995, made centrally sponsored in 2001 after the Supreme Court order in PUCL v. Union of India) was rebranded as PM POSHAN (PM Poshan Shakti Nirman) in September 2021, and now covers students in government and GOVERNMENT-AIDED schools from Class 1 to 8; in 2022 the scheme was extended to PRE-PRIMARY children (Bal Vatika) under government and government-aided schools. PRIVATE UNAIDED schools are not covered. PM POSHAN is implemented by the Ministry of Education in partnership with state governments; food grains supplied by the Food Corporation of India under the National Food Security Act, 2013. Both Samagra Shiksha and PM POSHAN are CENTRALLY SPONSORED — funded jointly by the Centre and States with a Centre-State sharing pattern (typically 60:40, with 90:10 for special-category states / NE / hill states / UTs without legislature).'
  graceful_unknown: The "SSA / RMSA / CSSTE merged into Samagra Shiksha (2018); Mid-Day Meal renamed PM POSHAN (2021) and includes government-aided schools" facts are the load-bearing corrections. Specific funding shares (60:40 vs 90:10) and the precise scheme components shift with annual budget allocations — verify on the Ministry of Education site or pmposhan.education.gov.in.
