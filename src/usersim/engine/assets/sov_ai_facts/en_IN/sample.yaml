- id: IN-EN-HIS-004
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: Indira Gandhi was the daughter of Mahatma Gandhi, and she became India's first woman President, right?
  false_premises:
  - Daughter of Mahatma Gandhi (she was the daughter of Jawaharlal Nehru, India's first prime minister; she was unrelated to Mahatma Gandhi)
  - First woman President of India (she was India's first and so far only woman Prime Minister; the first woman President was Pratibha Patil, in office 2007-2012)
  ground_truth: 'Indira Gandhi (1917-1984) was the daughter of "Jawaharlal Nehru", India''s first Prime Minister, NOT of Mahatma Gandhi. The shared surname "Gandhi" came from her marriage to Feroze Gandhi (no relation to the Mahatma). She served as PRIME MINISTER (not President) of India for two periods: 1966-1977 and 1980-1984. She was the first and so far only woman to hold the post of PM. India''s first woman PRESIDENT was "Pratibha Patil", who served from 2007 to 2012; the second was Droupadi Murmu, who took office in 2022 (also notable as the first tribal-origin head of state). The offices of PM (head of government) and President (head of state) are distinct in India''s parliamentary system.'
