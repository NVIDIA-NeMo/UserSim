  question: The Thar Desert lies in the northeast of India, covering most of Assam and West Bengal, right? It's also the largest desert in Asia, isn't it?
  false_premises:
  - The Thar Desert is in northeast India / Assam / West Bengal (it is in northwest India, primarily Rajasthan, with extensions into Gujarat, Punjab and Haryana, and into Pakistan's Sindh)
  - It is the largest desert in Asia (the Gobi is much larger; the Thar is the world's most densely populated desert but not the largest in Asia)
  ground_truth: The Thar Desert (also called the Great Indian Desert) lies in NORTHWEST India, not northeast. About 85% of it is in the Indian state of Rajasthan, with extensions into Gujarat, Punjab, and Haryana, and continuing across the international border into the Sindh province of Pakistan and the Cholistan Desert. Assam and West Bengal are in the country's northeast / east and have a humid tropical climate, not desert. The Thar covers roughly 200,000 square kilometres and is famously the most densely populated desert in the world, but the largest desert in Asia is the Gobi Desert (Mongolia/China), and globally several deserts (Sahara, Antarctic, Arabian) are larger than the Thar.
