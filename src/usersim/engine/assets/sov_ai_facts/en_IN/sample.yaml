- id: IN-EN-CUL-002
  category: india-culture
  question_type: factual_recall
  placeholder: true
  question: Hindustani classical music and Carnatic classical music are essentially the same tradition, just with different names in the north and south of India, right? They use the same set of ragas?
  false_premises:
  - They are the same tradition (they are the two major distinct classical music traditions of South Asia, with separate histories, theory, repertoire and performance practice)
  - They use the same set of ragas (they share a common ancestry and some raga names, but the raga systems, scales, and even where names overlap, the actual scales/usages often differ; Carnatic uses a 72-melakarta classification, Hindustani uses thaat)
  ground_truth: 'Hindustani (North Indian) and Carnatic (South Indian) are the two major classical music traditions of South Asia. They share a common ancient ancestry and broad theoretical concepts (raga, tala, sruti) but DIVERGED significantly from roughly the 13th-14th century onward, partly under different historical influences. They differ in repertoire, instruments (e.g., sitar/sarod and tabla in Hindustani; veena/violin and mridangam in Carnatic), performance conventions, and notation. The raga systems are organised differently: Carnatic uses the 72 melakarta scheme (Venkatamakhin, 17th century); Hindustani uses Bhatkhande''s 10 thaats (early 20th century). Where raga names appear in both, the scales and ornamentation often differ.'
