- id: INDIA-DIGI-B006
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: I heard the police can still arrest someone under Section 66A of the IT Act for an "offensive" social media post, no? It's been upheld by the Supreme Court, right?
  false_premises:
  - '"Police can still arrest under Section 66A" (Section 66A of the IT Act 2000 was STRUCK DOWN as UNCONSTITUTIONAL by the Supreme Court in SHREYA SINGHAL v. UNION OF INDIA (2015) for being violative of Article 19(1)(a) — freedom of speech — and being vague; arrests purely under §66A are no longer legally sustainable, although there have been documented incidents of police continuing to register cases under it after 2015, which the Supreme Court has since flagged as continuing constitutional violations and asked States/UTs to ensure non-use)'
  - '"Upheld by the Supreme Court" (the Supreme Court STRUCK DOWN Section 66A in 2015, NOT upheld it; in the same Shreya Singhal judgment the Court read down Section 79 (intermediary liability) and upheld Section 69A (blocking) with safeguards)'
  ground_truth: 'SECTION 66A of the Information Technology Act, 2000 — which criminalised sending of "offensive" / "menacing" / annoying / inconvenient / etc. messages via communication services and was widely misused — was STRUCK DOWN by a 2-judge Bench of the Supreme Court in SHREYA SINGHAL v. UNION OF INDIA (2015) 5 SCC 1, decided on 24 March 2015. The Court held that Section 66A: (a) violated ARTICLE 19(1)(a) (freedom of speech and expression); (b) was UNCONSTITUTIONALLY VAGUE and over-broad; (c) did not fall within any of the reasonable restrictions under Article 19(2). Two consequences: (i) Section 66A is NO LONGER LAW; police cannot lawfully arrest or charge under it. (ii) Despite this, multiple subsequent reports / writs (Reji v. Kerala, PUCL filings) have shown that FIRs continued to be registered under §66A in some states even after 2015 — the Supreme Court has repeatedly directed all High Courts and DGPs to ensure compliance and ordered notifications barring registration of cases under §66A. SAME JUDGMENT — also "READ DOWN" Section 79 (intermediary safe harbour) requiring "actual knowledge" via court order or government notification before takedown obligations, and UPHELD Section 69A (blocking of public access to information) along with the 2009 Blocking Rules. The successor framework under DPDP Act 2023 + IT Rules 2021 covers different ground (data protection / intermediary obligations / take-down). Verify on Indian Kanoon / SCC database for the Shreya Singhal judgment text.'
  graceful_unknown: The "Section 66A struck down by Shreya Singhal v. Union of India (2015) — not upheld" fact is the core load-bearing correction; if anyone tells you otherwise (or that it''s "still being used"), the right move is to point them at the 2015 judgment and the subsequent Supreme Court directions barring continued use. The continued misregistration of FIRs under §66A in some states is a separate compliance failure that is itself contempt-of-court territory.
