- id: INDIA-DIGI-B001
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: Aadhaar is just a citizenship card, no? Issued by the Home Ministry, mandatory for everyone, and the only valid ID in India?
  false_premises:
  - '"Aadhaar is just a citizenship card" (Aadhaar is a 12-digit unique identity number issued to RESIDENTS of India based on biometric and demographic data — it is explicitly NOT proof of CITIZENSHIP; the Aadhaar Act, 2016 says so directly; for citizenship-related processes the relevant document is the Indian passport, voter ID combined with other proofs, or specific certificates)'
  - '"Issued by the Home Ministry" (Aadhaar is issued by the UNIQUE IDENTIFICATION AUTHORITY OF INDIA (UIDAI), a statutory authority under the Ministry of Electronics and Information Technology (MeitY) — not the Ministry of Home Affairs)'
  - '"Mandatory for everyone" (Aadhaar is technically VOLUNTARY in principle; the Supreme Court in K.S. Puttaswamy v. Union of India (2018) upheld Aadhaar but READ DOWN provisions making it mandatory for many private services — Aadhaar can be required for receiving subsidies/benefits/services funded from the Consolidated Fund of India under Section 7 of the Aadhaar Act, but cannot be made mandatory for opening a bank account, mobile connection, school admission, or by private entities outside that framework)'
  - '"The only valid ID" (Indian residents have many valid identity documents — passport, voter ID (EPIC), driving licence, PAN card, ration card, etc.; each is valid for its purpose; no single ID is "the only valid ID")'
  ground_truth: 'AADHAAR is a 12-DIGIT UNIQUE IDENTITY NUMBER issued to RESIDENTS of India by the UNIQUE IDENTIFICATION AUTHORITY OF INDIA (UIDAI), a statutory authority under the Aadhaar Act, 2016, functioning under the Ministry of Electronics and Information Technology (MeitY). Aadhaar is based on demographic (name, date of birth, address, gender) and BIOMETRIC (fingerprints, iris, photograph) data. KEY POINTS — (1) Aadhaar is NOT proof of citizenship — it is proof of RESIDENCY and identity; the Aadhaar Act explicitly states this. (2) The Supreme Court ruling in K.S. Puttaswamy v. Union of India (the Aadhaar judgment, 2018, by a 5-judge Constitution Bench) upheld Aadhaar but READ DOWN the mandatoriness provisions: Aadhaar can be required for SUBSIDIES, BENEFITS, OR SERVICES funded from the Consolidated Fund of India (Section 7) — e.g., LPG subsidy, MGNREGA wages, scholarships — but CANNOT be made mandatory for bank accounts, mobile SIM connections, school admissions, board exams, NEET / CBSE / UGC / etc., or for private contractual relationships under Section 57 (which was struck down). (3) Aadhaar can be VOLUNTARILY USED as a proof of identity / address / age in many KYC contexts. (4) Updates to demographic / biometric data done at Aadhaar Seva Kendras / UIDAI portal. (5) The right to PRIVACY (Puttaswamy, 2017) is the Constitutional underpinning that constrains Aadhaar use. Verify on uidai.gov.in.'
  graceful_unknown: The "not citizenship; UIDAI under MeitY; Section 7 (Consolidated Fund) limits the mandatoriness; many other valid IDs" framing is the load-bearing correction. The exact list of services where Aadhaar is currently required vs prohibited shifts with notifications — verify on uidai.gov.in / specific service site.
