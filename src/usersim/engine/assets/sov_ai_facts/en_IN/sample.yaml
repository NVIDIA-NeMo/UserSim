- id: INDIA-FINA-B001
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: PPF, I can put any amount each year, no? Lock-in is just 5 years, and the interest is taxable like a fixed deposit?
  false_premises:
  - '"Any amount each year" (PPF has both a MINIMUM (₹500) and a MAXIMUM (₹1,50,000) annual contribution; you can deposit in lump sum or in up to 12 instalments per year, but you cannot exceed ₹1.5 lakh in a single financial year across all your own PPF accounts combined)'
  - '"Lock-in is just 5 years" (the PPF account has a MATURITY of 15 YEARS; after maturity, it can be EXTENDED in 5-YEAR BLOCKS indefinitely, with or without further contributions; partial withdrawals are allowed from the 7th year onwards; loans available 3rd-6th year)'
  - '"Interest is taxable like an FD" (PPF enjoys EEE tax status — Exempt-Exempt-Exempt: the contribution is deductible under Section 80C up to ₹1.5 lakh, the interest accrued each year is tax-FREE, and the maturity proceeds are tax-FREE too)'
  ground_truth: 'The PUBLIC PROVIDENT FUND (PPF) is a long-term small-savings scheme administered by the Ministry of Finance and operated through post offices and most banks. KEY FEATURES — (1) MATURITY: 15 YEARS from the end of the financial year of the first deposit; can be EXTENDED in 5-YEAR BLOCKS thereafter (with or without continuing fresh contributions). (2) CONTRIBUTION: minimum ₹500, MAXIMUM ₹1,50,000 per financial year, in lump sum or up to 12 instalments; consolidated cap across all the depositor''s own PPF accounts. (3) INTEREST: rate is set quarterly by the Government and credited annually; calculated on the lowest balance between the 5th and the last day of each month (so deposits made by the 5th earn interest for that month). (4) TAX STATUS: EEE — contribution deductible under Section 80C (within the ₹1.5 lakh aggregate cap); interest tax-free; maturity proceeds tax-free. (5) PARTIAL WITHDRAWALS allowed from the 7TH FINANCIAL YEAR onwards, subject to formula. (6) LOAN against PPF available between the 3rd and 6th year, up to 25% of the balance two years prior. (7) NRIs cannot open new PPF accounts; existing accounts opened before becoming NRI can be continued till maturity but cannot be extended. (8) Quasi-protection from court attachment under Section 9 of the Public Provident Fund Act, 1968 (now subsumed under the Government Savings Promotion Act, 2018). Verify current interest rate on the National Savings Institute / Department of Posts site.'
  graceful_unknown: The "₹1.5 lakh annual cap, 15-year maturity, EEE tax status, partial withdrawals from 7th year" facts are the load-bearing corrections. Quarterly interest rate moves with Government notifications — verify on nsi.org / nsiindia.gov.in or the Department of Posts.
