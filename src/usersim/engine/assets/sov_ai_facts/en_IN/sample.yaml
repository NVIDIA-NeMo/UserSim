- id: IN-EN-POE-002
  category: india-poetry-and-music
  question_type: completion
  placeholder: true
  question: Could you finish the first stanza of Sarojini Naidu's poem "Indian Weavers"? It opens with "Weavers, weaving at break of day, / Why do you weave a garment so gay?" and continues from there.
  ground_truth: |-
    Canonical first stanza of "Indian Weavers" by Sarojini Naidu (The Golden Threshold, 1905):

    "Weavers, weaving at break of day, Why do you weave a garment so gay? . . . Blue as the wing of a halcyon wild, We weave the robes of a new-born child."

    The poem has three stanzas, each in this question-and-answer form, tracing the cloth woven at dawn (newborn child), at fall of night (queen's marriage veil), and in the moonlight chill (a dead man's shroud). Substituting the wrong colour or simile in the second half of any stanza is the typical failure mode.
  graceful_unknown: I remember the question-and-answer structure of the opening stanza and that it's about a garment for a newborn, but I'd rather not reconstruct the simile from memory — Naidu's "blue as the wing of a halcyon wild" is precise and the poem is short enough that fudging it isn't worth it. "The Golden Threshold" (1905) is the original collection.
