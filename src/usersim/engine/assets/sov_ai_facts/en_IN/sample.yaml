- id: INDIA-LABO-B003
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: India's new labour reforms — that's a single new law that replaced everything, no? Came into force fully across the country in 2020, and the states have no say in implementation?
  false_premises:
  - A single new law (the labour reforms consolidated 29 central labour laws into FOUR LABOUR CODES — (1) Code on Wages, 2019, (2) Industrial Relations Code, 2020, (3) Code on Social Security, 2020, (4) Occupational Safety, Health and Working Conditions Code, 2020 — not a single law)
  - '"Came into force fully across the country in 2020" (the four Codes were ENACTED in 2019-2020 but their PROVISIONS are NOT YET FULLY OPERATIONAL nationwide — the central government has notified rules and dates of effect for some sections, but full implementation has been delayed pending state-level rule-making and political negotiation; as of mid-2020s the Codes are partly in force, partly pending)'
  - '"States have no say in implementation" (labour is on the CONCURRENT LIST of the Constitution — both Centre and States can legislate; STATES need to NOTIFY their own RULES under each Code before it can be operationalised in that state; rule-notification status varies state by state, which is a major reason rollout has been gradual)'
  ground_truth: 'The Government of India consolidated 29 existing central labour laws into FOUR LABOUR CODES — (1) CODE ON WAGES, 2019 (replaces Payment of Wages Act 1936, Minimum Wages Act 1948, Payment of Bonus Act 1965, Equal Remuneration Act 1976); (2) INDUSTRIAL RELATIONS CODE, 2020 (replaces Trade Unions Act 1926, Industrial Employment (Standing Orders) Act 1946, Industrial Disputes Act 1947); (3) CODE ON SOCIAL SECURITY, 2020 (replaces 9 laws including EPF, ESI, Maternity Benefit, Gratuity, Employees'' Compensation, Building & Other Construction Workers, etc., and creates a Social Security Board for unorganised, gig, platform workers); (4) OCCUPATIONAL SAFETY, HEALTH AND WORKING CONDITIONS CODE, 2020 (replaces 13 laws including Factories Act, Mines Act, Plantations Labour, Contract Labour, Inter-State Migrant Workers, etc.). LABOUR is on the CONCURRENT LIST of the Indian Constitution, so both Centre and States can legislate and make rules; for the Codes to come into force in a state, both the Central rules AND the state-specific rules must be notified — full national implementation has been gradual due to varying readiness of state rule-notifications. Some sections (e.g., parts of the Wages Code on definitions) have been notified earlier; others remain pending. Verify the current notification status on labour.gov.in or the relevant state Labour Department site before assuming a Code section is in operation.'
  graceful_unknown: The "FOUR Codes (Wages, IR, Social Security, OSH); concurrent-list status; gradual / partial implementation; states must notify their rules" framing is the load-bearing correction. The exact list of which sections of which Code are in force on a given date moves with notifications — verify on labour.gov.in or PRS Legislative Research at the time of any specific question.
