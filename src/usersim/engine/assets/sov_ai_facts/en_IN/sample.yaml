- id: INDIA-DIGI-B004
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: PM-KISAN gives every farmer in India ₹6,000 a month, no? Both small farmers and big landowners qualify, and the money comes through the village panchayat?
  false_premises:
  - '"₹6,000 a month" (PM-KISAN gives ₹6,000 PER YEAR — not per month — paid in three equal instalments of ₹2,000 each, every four months; that''s ₹500 per month equivalent, not ₹6,000)'
  - '"Every farmer" (eligibility is for "all LAND-HOLDING FARMER FAMILIES" — a family being defined as husband, wife, and minor children — subject to several EXCLUSIONS: institutional landholders, holders of constitutional posts, serving/retired officers/employees of central/state government and PSUs (with some exemptions for Group D / Class IV staff), professionals like doctors / engineers / lawyers / chartered accountants / architects who are practicing, persons paying income tax in the last assessment year, those drawing monthly pension > ₹10,000)'
  - '"Comes through the village panchayat" (PM-KISAN payments are made via DIRECT BENEFIT TRANSFER (DBT) directly to the beneficiary''s AADHAAR-LINKED BANK ACCOUNT through the PFMS (Public Financial Management System), Ministry of Agriculture & Farmers Welfare; the Gram Panchayat / village patwari is involved in initial verification of land records but does not handle the money)'
  ground_truth: 'PRADHAN MANTRI KISAN SAMMAN NIDHI (PM-KISAN) is a Central Sector Scheme launched on 24 February 2019, providing income support of ₹6,000 PER YEAR to eligible LAND-HOLDING FARMER FAMILIES, paid in THREE EQUAL INSTALMENTS of ₹2,000 each — every four months (typically April-July, August-November, December-March cycles). Payment is made via DIRECT BENEFIT TRANSFER (DBT) to the Aadhaar-linked bank account of the beneficiary, processed through the PFMS by the Department of Agriculture & Farmers Welfare. ELIGIBILITY: all land-holding farmer families (defined as husband + wife + minor children jointly), subject to EXCLUSIONS: institutional land-holders; holders of constitutional posts / sitting or former ministers / MPs / MLAs / mayors / chairpersons of district panchayats; serving/retired officers and employees of central/state governments and PSUs (with exemptions for Group D / multi-tasking staff / Class IV); income-tax payers in the last assessment year; professionals (doctors, engineers, lawyers, CAs, architects) registered with professional bodies and carrying out their profession; superannuated/retired persons drawing monthly pension > ₹10,000. KYC AND VERIFICATION — through Aadhaar seeding, eKYC, and land-record verification by the state revenue authorities. Verify status / register on pmkisan.gov.in.'
  graceful_unknown: The "₹6,000 PER YEAR (not per month) in 3 instalments; specific eligibility with several professional/income-related exclusions; DBT to Aadhaar-linked bank account" framing is the load-bearing correction. Specific exclusion criteria and any periodic revisions — verify on pmkisan.gov.in.
