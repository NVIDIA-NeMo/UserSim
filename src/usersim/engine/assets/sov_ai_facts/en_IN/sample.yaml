- id: IN-EN-SVC-003
  category: india-public-services
  question_type: factual_recall
  placeholder: true
  question: The Voter ID card (EPIC) and Aadhaar card are basically the same document issued by the same authority, right? Both let me cast my vote at the polling booth?
  false_premises:
  - Same document issued by the same authority (the Voter ID / EPIC is issued by the Election Commission of India; Aadhaar is issued by UIDAI — different authorities, different purposes)
  - Both let me cast a vote (the prescribed identity document for voting is the EPIC; Aadhaar can be used as a backup ID at the polling booth in some elections, alongside other accepted IDs, but the voter must be enrolled and the EPIC remains the primary voting identity document)
  ground_truth: 'The Voter ID card (officially the Elector''s Photo Identity Card, or EPIC) and Aadhaar are DIFFERENT documents issued by DIFFERENT authorities for DIFFERENT purposes: - EPIC: issued by the "Election Commission of India" via the state Chief Electoral Officer; tied to your enrolment in a specific Assembly constituency''s electoral roll; the primary identity document for casting a vote. - Aadhaar: issued by the "Unique Identification Authority of India" (UIDAI); a 12-digit unique identification number tied to biometric and demographic data; a general identity proof for many services but NOT a voter-enrolment document on its own. To vote, you must first be enrolled on the electoral roll of your constituency. At the polling booth, the EPIC is the primary ID, but if it is not available the Election Commission allows certain other photo IDs as alternatives (Aadhaar, passport, driving licence, PAN card, etc.). The Election Laws (Amendment) Act 2021 allows voluntary linking of Aadhaar with the electoral roll for verification, but Aadhaar is not mandatory for voting and does not by itself enrol you as a voter.'
