- id: IN-EN-SVC-005
  category: india-public-services
  question_type: factual_recall
  placeholder: true
  question: MGNREGA guarantees 365 days of paid work per year to every household in urban India, right? It was launched in the year 2000 by the central government.
  false_premises:
  - 365 days per year (MGNREGA guarantees up to 100 days of wage employment in a financial year per rural household)
  - Urban India (MGNREGA is for RURAL households; there is no equivalent national urban scheme of the same scope, though pilot urban employment schemes exist in some states like Kerala's Ayyankali scheme)
  - Launched in 2000 (the Act was enacted in 2005, came into force in 2006; renamed Mahatma Gandhi NREGA in 2009)
  ground_truth: MGNREGA (Mahatma Gandhi National Rural Employment Guarantee Act) guarantees up to "100 days of wage employment per financial year" to every "rural" (not urban) household whose adult members volunteer to do unskilled manual work. Originally enacted as NREGA in 2005, it came into force in February 2006 (rolled out in phases), and was renamed Mahatma Gandhi NREGA in October 2009 — not launched in 2000. Wages are paid at notified state-specific rates. The scheme is administered jointly by the central Ministry of Rural Development and state governments, and includes provisions for women's participation, social audits, and grievance redressal. Reviewer to confirm current rate notifications and any policy updates.
