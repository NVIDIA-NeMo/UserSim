- id: INDIA-EDUC-B001
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: The Right to Education Act covers all schooling till Class 12, no? It's been there since the 1990s, and only government schools have to follow it?
  false_premises:
  - '"Covers all schooling till Class 12" (the RTE Act, 2009 covers FREE and COMPULSORY education for children aged 6 TO 14 — that is, Classes 1 to 8 (elementary education); it does NOT extend to secondary or higher-secondary (Classes 9-12))'
  - '"Been there since the 1990s" (the RTE Act was enacted in 2009 and came into force on 1 APRIL 2010, following the insertion of Article 21A in the Constitution by the 86th Amendment, 2002 — not the 1990s)'
  - '"Only government schools have to follow it" (the Act applies to all schools — government, government-aided, special-category, and unaided private schools; private unaided schools must reserve at LEAST 25% of Class-1 seats for children from economically weaker sections (EWS) and disadvantaged groups, with reimbursement from the government per state-notified rates)'
  ground_truth: 'The RIGHT OF CHILDREN TO FREE AND COMPULSORY EDUCATION ACT, 2009 (RTE Act) implements Article 21A of the Constitution (added by the 86th Amendment, 2002), which made elementary education a fundamental right. The Act came into force on 1 APRIL 2010. It guarantees FREE AND COMPULSORY EDUCATION to every child between AGES 6 AND 14 (Classes 1-8 / elementary education). Key features — (1) Reservation: every unaided private school must reserve AT LEAST 25% of seats in Class 1 (or pre-primary, where applicable) for children from economically weaker sections and disadvantaged groups, with the government reimbursing tuition at notified rates. (2) Norms: pupil-teacher ratio, infrastructure norms (boundary wall, toilets, drinking water, library, playground), school working days, teacher training norms. (3) NO CAPITATION FEE OR SCREENING in admissions; no detention up to Class 8 was the original rule (later amended in 2019 to allow regular detention from Class 5/8 onwards at state discretion). (4) Local school in the neighbourhood. The Act covers ELEMENTARY education (Classes 1-8) only — secondary (Classes 9-10) and higher-secondary (Classes 11-12) are governed by state policies and are not part of the central RTE Act framework, though the National Education Policy 2020 envisions extending the right to age 3-18.'
  graceful_unknown: The "Article 21A → 86th Amendment 2002 → RTE Act 2009 came into force 2010" sequence and the age-6-to-14 / Class-1-to-8 scope are the load-bearing facts. State-by-state implementation of the 25% EWS reservation and reimbursement rates vary widely; for state-specific details, the State Education Department is the authoritative source.
