- id: INDIA-EDUC-B006
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: UGC regulates every college in India, no? Engineering, medical, law, all of them — and the Medical Council of India (MCI) is still the body for medical colleges, right?
  false_premises:
  - UGC regulates every college (UGC — University Grants Commission, set up under the UGC Act, 1956 — recognises and regulates UNIVERSITIES (central, state, deemed-to-be, private) and oversees the higher-education general / academic stream; technical, medical, legal, agricultural, architecture, pharmacy, dental, veterinary, and nursing professional education each have SEPARATE statutory regulators)
  - Engineering, medical, law are all under UGC (engineering / management / pharmacy / architecture etc. are under AICTE, the All India Council for Technical Education, est. 1945, statutory under AICTE Act 1987; medical education is under the NATIONAL MEDICAL COMMISSION, NMC; legal education under BAR COUNCIL OF INDIA; agricultural under ICAR/Indian Council of Agricultural Research; nursing under INC (Indian Nursing Council); dental under DCI; veterinary under VCI; pharmacy under PCI)
  - MCI is still the body for medical colleges (the MEDICAL COUNCIL OF INDIA was DISSOLVED and REPLACED by the NATIONAL MEDICAL COMMISSION (NMC) under the National Medical Commission Act, 2019 — NMC took office in September 2020; MCI no longer exists)
  ground_truth: 'India''s higher-education regulation is split across multiple statutory bodies — (1) UGC (University Grants Commission) — UGC Act, 1956 — recognises universities and oversees general higher education, sets minimum standards, runs grants programmes. (2) AICTE (All India Council for Technical Education) — AICTE Act, 1987 — approves and regulates technical education programmes (engineering, technology, management/MBA, architecture, town planning, pharmacy, applied arts, hotel management & catering technology); also runs PMSSS, PMRF support schemes. (3) NATIONAL MEDICAL COMMISSION (NMC) — National Medical Commission Act, 2019, took office September 2020, REPLACING the Medical Council of India (MCI) — regulates medical education, registration of medical practitioners, sets standards and conducts NEET-PG/NExT (planned). (4) BAR COUNCIL OF INDIA (BCI) — Advocates Act, 1961 — recognises law colleges and admits advocates to the Bar. (5) NATIONAL COUNCIL FOR TEACHER EDUCATION (NCTE) — NCTE Act, 1993 — regulates teacher-education programmes. (6) ICAR (Indian Council of Agricultural Research) — agricultural / veterinary / fisheries programmes. (7) INC (Indian Nursing Council) — INC Act 1947. (8) DCI (Dental Council of India), VCI (Veterinary Council of India), PCI (Pharmacy Council of India), CoA (Council of Architecture) — analogous bodies for dental, veterinary, pharmacy, architecture. The NEP 2020 proposed merging UGC, AICTE, and NCTE into a single HIGHER EDUCATION COMMISSION OF INDIA (HECI) with separate verticals — implementation pending statutory enactment.'
  graceful_unknown: The "different regulators for different streams; MCI replaced by NMC in 2020; HECI is proposed not yet legislated" framing is the load-bearing point. The exact list of professional regulators and the current status of HECI legislation move with annual policy updates — verify on each council's site / Ministry of Education updates.
