- id: INDIA-DIGI-B002
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: I can store any document I want in DigiLocker, no? Bank statements, credit cards, anything? And the document I upload myself has the same legal weight as a government-issued one?
  false_premises:
  - '"Any document I want" (DigiLocker primarily stores ISSUED DOCUMENTS — digitally signed copies of documents ISSUED by participating government and partner agencies (UIDAI, CBSE, RTO, EPFO, Income Tax, Insurance regulators, certain banks, university boards etc.); users can also upload their own scanned documents to the "Uploaded" / "My Drive" section but with up to 1 GB free storage and a different legal status than issued documents)'
  - '"Bank statements, credit cards" (most everyday banks DO NOT push bank statements / credit card statements into DigiLocker; the Issuer integrations cover specific document types — driving licence, RC, Aadhaar, PAN (selectively), school/college mark sheets, Voter ID, etc.; private credit-card statements are not part of the DigiLocker issuer ecosystem)'
  - '"Documents I upload have the same legal weight as government-issued" (under Rule 9A of the IT Rules and the DigiLocker framework, ISSUED DOCUMENTS in DigiLocker (digitally signed by the issuing authority) are treated as ORIGINAL DOCUMENTS / at par with physical originals for verification purposes; user-UPLOADED scans do NOT have the same legal status — they are convenience copies)'
  ground_truth: 'DIGILOCKER is a flagship initiative under the DIGITAL INDIA programme, providing a cloud-based platform for storing and verifying digital documents. It is operated by the National e-Governance Division (NeGD) of the Ministry of Electronics and Information Technology (MeitY). KEY FEATURES — (1) ISSUED DOCUMENTS: digitally signed documents pushed by participating ISSUERS into the user''s DigiLocker — verifiable in real time via the issuer''s digital signature. Issuers include UIDAI (Aadhaar e-Aadhaar), Ministry of Road Transport (driving licence and RC via Parivahan / Sarathi), Income Tax Department (PAN selectively), EPFO, school and university boards (CBSE/CISCE/state boards), Election Commission (Voter ID — EPIC), and many state government departments and select banks/insurers. (2) UPLOADED DOCUMENTS: users can upload their own scanned documents to a self-managed "My Drive" section (up to 1 GB free); these have utility but DO NOT carry the same legal/verification status as issuer-pushed documents. (3) LEGAL VALIDITY: issued documents in DigiLocker are recognised under Rule 9A of the IT (Preservation and Retention of Information by Intermediaries) Rules 2011 and Section 9 of the IT Act — they are at par with physical originals for verification purposes by Government agencies; many private organisations also accept them. (4) Authentication via Aadhaar / mobile-OTP. The DigiLocker mobile app and digilocker.gov.in are the official entry points. Issuer integrations and accepted document types are listed there.'
  graceful_unknown: The "issued vs uploaded — different legal status; specific issuers in the ecosystem; Rule 9A IT Rules / Section 9 IT Act recognise issued documents" framing is the load-bearing point. The exact list of issuers and accepted documents grows; verify on digilocker.gov.in for what your specific institution offers.
