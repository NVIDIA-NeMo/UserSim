- id: IN-EN-CUL-001
  category: india-culture
  question_type: factual_recall
  placeholder: true
  question: '"Bollywood" is the official industry name used in Mumbai for the Hindi film industry, and the Marathi and Tamil film industries are sub-branches of it, right?'
  false_premises:
  - Bollywood is the official industry name (it is an informal portmanteau of Bombay + Hollywood; the industry has no single official corporate label)
  - Marathi and Tamil films are sub-branches of Bollywood (these are independent regional film industries — Marathi cinema is its own industry based in Maharashtra; Tamil cinema is centred in Chennai and often informally called "Kollywood" after the Kodambakkam neighbourhood)
  ground_truth: '"Bollywood" is an INFORMAL nickname (Bombay + Hollywood) for the Hindi-language film industry historically based in Bombay/Mumbai. It is not an official industry designation; producer guilds, regulators, and industry bodies typically use terms like "the Hindi film industry". Indian cinema is a federation of many regional language industries — Tamil ("Kollywood", named for Kodambakkam in Chennai), Telugu ("Tollywood", a name shared with the Bengali industry historically based in Tollygunge, Kolkata), Malayalam (Mollywood), Kannada (Sandalwood), Marathi, Bhojpuri, Punjabi, Bengali, etc. These are independent industries, not sub-branches of Bollywood. By total annual film output, India is one of the largest producers of films in the world.'
