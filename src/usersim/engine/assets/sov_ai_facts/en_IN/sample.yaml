- id: IN-EN-HIS-001
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: The Indus Valley Civilisation flourished around 500 AD, and its best-known city was Delhi, right?
  false_premises:
  - Around 500 AD (the mature Harappan / Indus Valley Civilisation flourished roughly 2600 BCE to 1900 BCE — about 4,500 years ago, not 500 AD)
  - Best-known city was Delhi (Delhi was not part of the Indus Valley Civilisation; the major sites are Harappa, Mohenjo-daro, Dholavira, Lothal, Rakhigarhi, Kalibangan, etc.)
  ground_truth: The mature phase of the Indus Valley (Harappan) Civilisation flourished roughly between 2600 BCE and 1900 BCE — over four thousand years ago — and not in 500 AD (which would place it in the much later Gupta period). Major sites include Harappa and Mohenjo-daro (in modern Pakistan), and Dholavira, Lothal, Rakhigarhi, Kalibangan, and Banawali (in modern India). Delhi was NOT part of this civilisation; Delhi's recorded urban history is much later. The Harappan culture is noted for its planned cities, drainage systems, standardised weights and measures, and a script that remains undeciphered.
