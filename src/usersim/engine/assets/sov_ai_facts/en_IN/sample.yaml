- id: INDIA-FINA-B004
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: For Senior Citizens' Savings Scheme, the limit is still ₹15 lakh, no? Open to anyone above 50 years, and the interest gets deducted from my income tax automatically?
  false_premises:
  - '"Limit is still ₹15 lakh" (the maximum-deposit ceiling for SCSS was DOUBLED from ₹15 LAKH to ₹30 LAKH in Budget 2023, effective 1 April 2023; the current cap (across all SCSS accounts of one individual combined) is ₹30 LAKH)'
  - '"Open to anyone above 50 years" (eligibility for SCSS — INDIVIDUALS aged 60 OR ABOVE; or 55+ but below 60 if retired under superannuation / VRS and account opened within 1 month of retirement; or 50+ for retired DEFENCE SERVICES personnel within 1 month of retirement; not open to general persons aged 50)'
  - '"Interest gets deducted from my income tax automatically" (interest from SCSS is FULLY TAXABLE as income from other sources at the slab rate; the BANK/POST OFFICE deducts TDS at 10% if interest exceeds the threshold (currently ₹50,000 for senior citizens under Section 194A); the DEPOSIT (not the interest) qualifies for SECTION 80C DEDUCTION up to ₹1.5 lakh)'
  ground_truth: 'The SENIOR CITIZENS'' SAVINGS SCHEME (SCSS), administered through banks and post offices under the Government Savings Promotion Act, 2018, is a Government-backed savings scheme for senior citizens. KEY FEATURES — (1) ELIGIBILITY: individuals aged 60 OR ABOVE; OR retired under superannuation / VRS / Special VRS aged 55-59 (within 1 month of retirement); OR retired DEFENCE SERVICES personnel aged 50 or above (within 1 month of retirement). (2) MAXIMUM DEPOSIT: ₹30 LAKH per individual across all SCSS accounts (raised from ₹15 lakh effective 1 April 2023). Joint account is allowed only with spouse. (3) MINIMUM ₹1,000; deposits in multiples of ₹1,000. (4) TENURE: 5 YEARS, EXTENDABLE by an additional 3 years (one-time extension within 1 year of maturity). (5) INTEREST: rate set quarterly by the Government and notified; paid quarterly into the depositor''s linked savings account. (6) TAX TREATMENT: deposit qualifies for SECTION 80C deduction within the ₹1.5 lakh aggregate cap; INTEREST is fully TAXABLE as income from other sources, with TDS by the institution if it exceeds Section 194A threshold (presently ₹50,000 for senior citizens); seniors can submit Form 15H for nil TDS if total tax-able income is below the basic-exemption limit. (7) PREMATURE WITHDRAWAL allowed with penalty (after 1 year, with notified penalty percentages depending on completion of 1-2 vs 2-5 years). Verify current quarterly interest rate on the National Savings Institute / Department of Posts / participating bank.'
  graceful_unknown: The "₹30 lakh cap (raised from ₹15 lakh in Budget 2023), 60+ (with 55+/50+ exceptions for retired/defence), interest taxable + TDS, 80C on deposit" framing is the load-bearing correction. Specific quarterly interest rate moves with notifications.
