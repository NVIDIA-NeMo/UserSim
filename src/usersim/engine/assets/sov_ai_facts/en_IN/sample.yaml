  - Introduced in 1995 (GST was rolled out on 1 July 2017)
  ground_truth: 'The Goods and Services Tax (GST) in India was rolled out on "1 July 2017" — not 1995 — replacing a fragmented system of central and state indirect taxes (excise, service tax, VAT, etc.). It is NOT a single-rate tax: the main slabs are 0% (exempt / essential items), 5%, 12%, 18%, and 28% (for so-called luxury or sin goods). Additional special rates apply to specific goods — e.g., 0.25% for rough diamonds, 3% for gold. There are also two cesses (compensation cess on certain items, and an additional cess on tobacco). The GST Council, comprising the Union and state finance ministers, sets and periodically revises rates. Reviewer to confirm current rate structure against CBIC notifications.'
