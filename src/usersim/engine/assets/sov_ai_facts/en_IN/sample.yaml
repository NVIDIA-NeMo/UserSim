- id: INDIA-DIGI-B005
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: India still has no data-protection law, no? It's still the IT Act of 2000 that governs online privacy, and personal data can be sent abroad freely without restriction?
  false_premises:
  - '"Still no data-protection law" (the DIGITAL PERSONAL DATA PROTECTION ACT, 2023 (DPDP Act) was enacted in August 2023; it is India''s first comprehensive horizontal data-protection law; commencement of its provisions is being phased — full operational rollout depends on rules and the Data Protection Board being constituted, but the Act has been notified)'
  - '"Still IT Act 2000 governing online privacy" (until DPDP came into force, the SPDI Rules under Section 43A of the IT Act, 2000 were the principal data-protection framework; the DPDP Act 2023 will SUPERSEDE these once fully operational, while certain IT Act provisions on cybersecurity / unauthorised access continue separately)'
  - '"Personal data can be sent abroad freely without restriction" (the DPDP Act allows cross-border data transfers BY DEFAULT, but empowers the Government to NOTIFY a NEGATIVE LIST of countries to which transfer of personal data is restricted; sectoral regulators (e.g., RBI for payment data localisation, IRDAI for insurance, sectoral health-data rules) may impose ADDITIONAL data-localisation requirements)'
  ground_truth: 'The DIGITAL PERSONAL DATA PROTECTION ACT, 2023 (DPDP Act), enacted in August 2023, is India''s first comprehensive cross-sectoral law on the processing of digital personal data. Key features — (1) Applies to digital personal data of "Data Principals" (individuals) processed in India OR processed outside India in connection with offering goods or services in India. (2) Establishes the DATA PROTECTION BOARD OF INDIA (DPBI) — a quasi-judicial body — to handle enforcement and complaints; the Board is being constituted at the time of the Act''s commencement. (3) DUTIES OF DATA FIDUCIARIES include obtaining valid consent, providing notice, ensuring data accuracy, security safeguards, breach notification to Board and affected Data Principals, deleting data on completion of purpose, etc. (4) RIGHTS OF DATA PRINCIPALS: access, correction, erasure, grievance redressal, nominate post-mortem successor; right to grievance redressal and complaint to DPBI. (5) CHILDREN: parental consent required for processing children''s (under 18) personal data; certain processing activities for children are prohibited. (6) "SIGNIFICANT DATA FIDUCIARIES" face additional obligations including Data Protection Officer, audit, DPIA. (7) PENALTIES up to ₹250 CRORE per breach as scheduled. (8) CROSS-BORDER TRANSFER: permitted by default, with negative-list mechanism for restricted countries; sector-specific localisation rules (RBI payment data, sectoral health rules) apply additionally. (9) IT Act 2000 provisions on cybercrime, unauthorised access, and intermediary liability continue separately. The Act''s full operational implementation depends on rules being notified — verify current status on the MeitY site.'
  graceful_unknown: The "DPDP Act 2023 enacted; supersedes SPDI Rules; DPBI being constituted; cross-border by default with negative-list; ₹250 cr maximum penalty" framing is the load-bearing point. The exact status of operational rules and the DPBI''s constitution moves with notifications — verify on meity.gov.in.
