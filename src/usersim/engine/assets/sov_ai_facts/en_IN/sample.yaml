- id: INDIA-HEAL-B006
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: The price of every medicine in India is fixed by the central government, no? It's the FSSAI that does this, and that's why generic and branded medicines cost the same?
  false_premises:
  - Every medicine's price is fixed (only drugs notified in the SCHEDULE-I of the Drugs (Prices Control) Order, 2013 — the National List of Essential Medicines (NLEM) and a few "Schedule" medical devices — are price-controlled with a CEILING PRICE; non-scheduled drugs are NOT price-fixed, though their annual price increase is capped at 10%)
  - FSSAI fixes the price (FSSAI is the FOOD SAFETY and Standards Authority — it regulates food, not drug prices; drug pricing is regulated by the NATIONAL PHARMACEUTICAL PRICING AUTHORITY (NPPA) under the Department of Pharmaceuticals, Ministry of Chemicals & Fertilizers; drug-quality regulation is by the Central Drugs Standard Control Organisation (CDSCO) under DGCI)
  - Generic and branded medicines cost the same (in practice generic and branded versions of the same molecule often have very different MRPs even when both are in the price-controlled list — the ceiling caps maximum price but doesn''t equalise generic vs brand; for non-scheduled molecules the price difference can be severalfold)
  ground_truth: 'Drug pricing in India is regulated by the NATIONAL PHARMACEUTICAL PRICING AUTHORITY (NPPA), which sits under the DEPARTMENT OF PHARMACEUTICALS, Ministry of Chemicals & Fertilizers. The legal instrument is the DRUGS (PRICES CONTROL) ORDER, 2013 (DPCO 2013), issued under the Essential Commodities Act, 1955. Only drugs notified as "scheduled formulations" in the National List of Essential Medicines (NLEM) — currently NLEM 2022 with around 384 medicines plus certain devices and combinations — are subject to NPPA-fixed CEILING PRICES; non-scheduled drugs may be sold at any price subject to a yearly increase cap of 10% (Para 20 of DPCO 2013). For generic vs brand: pricing is at the molecule level for scheduled formulations — the ceiling price applies regardless of brand — but in practice MRPs vary because manufacturers can sell BELOW the ceiling, and outside scheduled molecules there is no equivalence. Regulation of drug QUALITY (manufacturing standards, approvals, recalls) sits separately with the Central Drugs Standard Control Organisation (CDSCO) under the Drugs Controller General of India (DCGI). FSSAI regulates FOOD safety, not pharmaceuticals. NPPA''s site (nppaindia.nic.in) publishes the current ceiling-price list and revision orders.'
  graceful_unknown: The "NPPA, not FSSAI; only NLEM-listed drugs have ceiling prices; non-scheduled drugs are capped only at 10% annual increase" framing is the load-bearing point. The current NLEM list and ceiling prices are revised; for a specific molecule, nppaindia.nic.in is authoritative.
