- id: IN-EN-HIS-005
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: The Indian Premier League (IPL) cricket tournament was launched in the late 1990s by the BCCI, and the very first season was played in England, right?
  false_premises:
  - Launched in the late 1990s (the IPL was launched in 2008)
  - First season played in England (the inaugural season in 2008 was played entirely in India; only the 2009 season — clashing with the Indian general election — was held in South Africa)
  ground_truth: The Indian Premier League (IPL) was launched by the Board of Control for Cricket in India (BCCI) in 2008, not the late 1990s. The inaugural season (IPL 2008) was played entirely in INDIA, and was won by the Rajasthan Royals under Shane Warne's captaincy. The 2009 season was held in SOUTH AFRICA because it clashed with the Indian general election (security considerations); part of the 2014 season was held in the UAE for similar reasons. The IPL has never been hosted in England. The IPL preceded the rival Indian Cricket League (ICL, 2007), which was unsanctioned by BCCI and folded after a couple of years.
