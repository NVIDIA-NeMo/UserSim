- id: IN-EN-HIS-003
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: Swami Vivekananda gave his famous "Sisters and Brothers of America" speech in New York in 1903, right? It opened the World's Columbian Exposition.
  false_premises:
  - Speech in New York (it was delivered in Chicago)
  - In 1903 (it was on 11 September 1893)
  - Opened the World's Columbian Exposition (the Exposition opened in May 1893; Vivekananda spoke at the Parliament of the World's Religions, which was a separate event held alongside the Exposition that September)
  ground_truth: Swami Vivekananda's famous "Sisters and Brothers of America" address was given in CHICAGO (not New York), on 11 September 1893 (not 1903). It was delivered at the Parliament of the World's Religions, which was held in Chicago alongside (but distinct from) the World's Columbian Exposition. The Exposition itself opened on 1 May 1893, four months earlier. The Parliament of the World's Religions was the first formal gathering of representatives of Eastern and Western spiritual traditions, and Vivekananda's address is widely credited with introducing Vedanta and Indian philosophy to a Western mass audience.
