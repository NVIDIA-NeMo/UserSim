- id: INDIA-DIGI-B003
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: UPI is run directly by RBI, no? There's a flat ₹10 lakh per-day P2P limit for everyone, and merchants always have to pay the MDR, even on small payments?
  false_premises:
  - '"UPI is run directly by RBI" (UPI is operated by the NATIONAL PAYMENTS CORPORATION OF INDIA (NPCI), an umbrella organisation for retail payments and settlement systems in India, INCORPORATED UNDER THE COMPANIES ACT 2013 by RBI and the Indian Banks'' Association under the framework of the Payment and Settlement Systems Act, 2007; RBI is the REGULATOR, but NPCI runs UPI day-to-day)'
  - '"Flat ₹10 lakh per-day P2P limit for everyone" (default UPI P2P transaction limit is ₹1,00,000 (₹1 LAKH) per transaction, with bank-specific daily caps; specific use-cases have HIGHER caps notified by NPCI — capital markets / collections / tax payments / education / health insurance and certain merchant payments have higher per-transaction limits (e.g., ₹2 lakh for some, ₹5 lakh for capital markets and tax payments); not a flat ₹10 lakh)'
  - '"Merchants always pay MDR" (since January 2020 — Section 269SU of the Income-tax Act and CGST notifications — UPI and RuPay debit-card transactions for businesses with turnover above ₹50 crore have ZERO MDR (merchant discount rate); the small-merchant ecosystem has been zero-MDR for UPI / RuPay; in 2023 NPCI introduced an interchange fee of 1.1% on merchant transactions ABOVE ₹2,000 only for UPI Wallet (PPI) transactions — bank account-funded UPI remains zero-MDR; so the "always" is wrong)'
  ground_truth: 'UPI (Unified Payments Interface) is operated by the NATIONAL PAYMENTS CORPORATION OF INDIA (NPCI), incorporated under the Companies Act 2013 by RBI and the Indian Banks'' Association, under the legal framework of the Payment and Settlement Systems Act, 2007 (RBI is the regulator). KEY POINTS — (1) DEFAULT TRANSACTION LIMITS: ₹1,00,000 per transaction for general P2P / P2M; bank-specific daily caps apply. NPCI has notified HIGHER LIMITS for specific use cases — ₹2,00,000 for capital markets, collections, insurance, foreign inward remittances; ₹5,00,000 for capital markets / tax payments / IPO collections. UPI Lite has small-value caps. International UPI is enabled in select corridors. (2) MDR (MERCHANT DISCOUNT RATE): for bank-funded UPI and RuPay debit transactions, MDR is ZERO since 1 January 2020 (Section 269SU IT Act, CBDT Notification 2019). For UPI WALLET / PPI-funded merchant transactions ABOVE ₹2,000, NPCI introduced an INTERCHANGE FEE of 0.5%-1.1% in 2023 (paid by acquirer to issuer; typically not passed to consumer). (3) SECURITY: 2-FA via UPI PIN (4-6 digit) and device-binding. (4) KEY APPS: BHIM (NPCI''s own), plus PhonePe, Google Pay, Paytm, Amazon Pay, etc. — all are UPI-enabled apps that interface with the user''s bank account. Verify current limits and rules on npci.org.in.'
  graceful_unknown: The "NPCI runs UPI (RBI is regulator); ₹1 lakh default P2P limit (with higher caps for specific use cases); zero MDR for bank-funded UPI" framing is the load-bearing point. Specific transaction limits and the precise MDR / interchange treatment for various flavours of UPI shift with NPCI circulars — verify on npci.org.in.
