- id: INDIA-LABO-B004
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: NPS is just for government employees, no? Same as the old pension — guaranteed amount based on last salary. Private-sector workers can't join?
  false_premises:
  - '"NPS is just for government employees" (NPS is mandatory for CENTRAL GOVERNMENT employees who joined service on or after 1 January 2004 (and most states have adopted similar dates for their state-government employees), but it is ALSO open VOLUNTARILY to any Indian citizen aged 18-70, including private-sector employees and self-employed; corporate NPS allows employer-employee co-contribution)'
  - '"Same as the old pension — guaranteed amount based on last salary" (NPS is a DEFINED-CONTRIBUTION scheme — the pension at retirement depends on the contributions and the market returns of the investment options chosen, with no guarantee of a fixed pension; the OLD PENSION SCHEME (OPS), which NPS replaced for new central government recruits in 2004, was a DEFINED-BENEFIT scheme paying ~50% of last drawn basic pay as monthly pension; the recently announced UPS — Unified Pension Scheme — sits between the two)'
  - '"Private-sector workers can''t join" (NPS is open to any individual aged 18-70 — All-Citizen Model Tier I and Tier II accounts; corporates can also enroll employees under the corporate NPS model)'
  ground_truth: 'The NATIONAL PENSION SYSTEM (NPS) is administered by the PENSION FUND REGULATORY AND DEVELOPMENT AUTHORITY (PFRDA) under the PFRDA Act, 2013. It is a DEFINED-CONTRIBUTION pension scheme — the corpus at retirement and the resulting annuity depend on contributions plus market returns, with no fixed pension guarantee. ELIGIBILITY: (a) MANDATORY for central-government employees joining service on/after 1 January 2004 (states followed at varying dates), (b) VOLUNTARY for any Indian citizen aged 18-70 under the All-Citizen Model, (c) corporate NPS for private-sector employees with employer co-contribution. ACCOUNTS: TIER I — primary retirement account, contributions locked till retirement (60), partial withdrawals for specified purposes; TIER II — voluntary, withdrawable any time. WITHDRAWAL AT 60 — at least 40% of the corpus must be used to purchase an ANNUITY (which gives the monthly pension); up to 60% can be withdrawn as a lump sum, tax-free under Section 10(12A). TAX BENEFITS: Section 80CCD(1) (within ₹1.5 lakh 80C cap), 80CCD(1B) — additional ₹50,000 deduction for own NPS contribution, 80CCD(2) — employer contribution up to 10% of basic+DA (14% for govt employees) deductible to employer not capped under 80C. The OLD PENSION SCHEME (OPS) — defined-benefit, ~50% of last drawn basic pay — applied to government employees recruited before 2004 (some states have reverted to OPS in recent years for state employees: Rajasthan, Chhattisgarh, Punjab, etc.). The UNIFIED PENSION SCHEME (UPS) was announced in 2024 for central-government employees, offering a hybrid with assured pension at 50% of average basic pay (last 12 months) for 25+ years of service.'
  graceful_unknown: The "NPS = defined contribution, open to private sector / All-Citizen, OPS was defined benefit, UPS is a 2024 hybrid" framing is the load-bearing correction. State-by-state OPS-revival decisions and the fine print of UPS implementation evolve — verify on PFRDA (npscra.nsdl.co.in / pfrda.org.in) and the latest Ministry of Finance / Department of Personnel notifications.
