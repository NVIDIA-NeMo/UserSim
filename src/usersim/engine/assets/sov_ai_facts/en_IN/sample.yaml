  ground_truth: |
    Canonical text of the Preamble to the Constitution of India (as adopted by the Constituent Assembly on 26 November 1949 and entered into force on 26 January 1950, with the words "SOCIALIST", "SECULAR", and "and integrity" added by the 42nd Amendment, 1976):

      "WE, THE PEOPLE OF INDIA, having solemnly resolved to constitute India into a SOVEREIGN SOCIALIST SECULAR DEMOCRATIC REPUBLIC and to secure to all its citizens:

      JUSTICE, social, economic and political;
      LIBERTY of thought, expression, belief, faith and worship;
      EQUALITY of status and of opportunity;
      and to promote among them all
      FRATERNITY assuring the dignity of the individual and the unity and integrity of the Nation;

      IN OUR CONSTITUENT ASSEMBLY this twenty-sixth day of November, 1949, do HEREBY ADOPT, ENACT AND GIVE TO OURSELVES THIS CONSTITUTION."

    Reproducing the exact wording is the requirement of this entry. Common failure modes the entry guards against — (a) leaving out "SOCIALIST" / "SECULAR" / "and integrity" (which were added later by the 42nd Amendment, 1976, but are part of the present Preamble), (b) misordering the four nouns Justice / Liberty / Equality / Fraternity, or (c) misstating the date as Republic Day (26 January 1950 — the Constitution''s commencement) rather than the adoption date (26 November 1949).
