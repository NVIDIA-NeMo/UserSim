- id: INDIA-HEAL-B002
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: CGHS is for any salaried person in India, isn't it? Available in every district, with no monthly contribution?
  false_premises:
  - CGHS is for any salaried person (it is restricted to CENTRAL GOVERNMENT employees and pensioners drawing pay/pension from Central Civil Estimates, plus their dependants; private-sector and state-government staff are not eligible — they have separate schemes like ESI, state-government schemes, or employer health insurance)
  - Available in every district (CGHS operates only in CGHS-COVERED CITIES — around 80 cities as of mid-2020s, mainly state capitals and other major towns; it is NOT available in every district)
