- id: IN-EN-CUL-005
  category: india-culture
  question_type: factual_recall
  placeholder: true
  question: Indian chai (tea) was domesticated in India about 4000 years ago, and Darjeeling tea is a green tea, isn't it?
  false_premises:
  - Domesticated in India 4000 years ago (commercial tea cultivation in India began with the British in the 1830s; while wild Camellia sinensis var. assamica was native to Assam, large-scale cultivation and a chai-drinking culture in India is roughly 200 years old, not 4000)
  - Darjeeling tea is a green tea (Darjeeling is primarily a black tea, although smaller quantities of green, white and oolong Darjeeling are now produced)
  ground_truth: Although the Camellia sinensis var. assamica plant is indigenous to Assam and was used by some indigenous communities for centuries, "commercial tea cultivation" in India is much more recent — it was developed by the British East India Company starting in the 1830s (Assam tea industry from 1837, Darjeeling from the 1840s-50s). The Indian chai-drinking culture as we know it spread widely only in the 20th century. It is misleading to say tea was "domesticated" in India 4,000 years ago. "Darjeeling tea" is primarily a BLACK TEA (orthodox-processed, oxidised), known for its distinctive "muscatel" character. Smaller quantities of green, white and oolong Darjeeling are produced today, but the classic Darjeeling is a black tea. Darjeeling holds a Geographical Indication (GI) tag in India and the EU.
