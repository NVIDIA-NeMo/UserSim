- id: IN-EN-GEO-004
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: The Tropic of Cancer passes through India from south to north, cutting through Tamil Nadu and Kerala on its way, right?
  false_premises:
  - 'The Tropic of Cancer cuts through Tamil Nadu and Kerala (it passes through 8 Indian states, all in central / north-central India: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram. Tamil Nadu and Kerala are well south of it)'
  - Passes from south to north (latitude lines like the Tropic of Cancer run east-west, not north-south)
  ground_truth: 'The Tropic of Cancer (~23.5° N) is a latitude line and therefore runs EAST-WEST, not north-south. In India it passes through 8 states: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, and Mizoram — broadly across central and north-central India. Tamil Nadu and Kerala are in the deep south, well south of the Tropic of Cancer (Kerala is roughly between 8° and 12° N), so the Tropic does not cross them. Cities very close to the Tropic include Gandhinagar, Udaipur, Bhopal, Ranchi, and Agartala. India''s territory spans roughly 8°N to 37°N latitude.'
