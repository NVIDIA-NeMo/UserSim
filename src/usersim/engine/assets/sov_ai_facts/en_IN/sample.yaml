  placeholder: true
  question: Lakshadweep is a state located in the Bay of Bengal, isn't it? It's larger than Goa in area, right?
  false_premises:
  - Lakshadweep is a state (it is a Union Territory, not a state)
  - Located in the Bay of Bengal (it is in the Arabian Sea, off Kerala's western coast)
  - Larger than Goa (Lakshadweep is about 32 sq km in land area; Goa is about 3,702 sq km — Goa is much larger)
  ground_truth: Lakshadweep is a "Union Territory" (UT), not a state, of India, and is located in the ARABIAN SEA off the southwestern coast of Kerala — not in the Bay of Bengal. It is the smallest UT by land area, comprising roughly 32 square kilometres of land spread across 36 islands (only 10 of which are inhabited). Goa, by contrast, is a state (not a UT) on the western coast and covers about 3,702 square kilometres — over 100 times larger than Lakshadweep in land area. Andaman and Nicobar Islands UT is the Indian island group that lies in the Bay of Bengal. Reviewer to confirm administrative classification against current Government of India sources.
