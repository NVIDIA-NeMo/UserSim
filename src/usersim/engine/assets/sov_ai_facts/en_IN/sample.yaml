- id: INDIA-FINA-B006
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: For listed Indian shares, the capital-gains rates haven't changed in years, no? STCG is 10% if held under 6 months, LTCG is fully exempt above 1 lakh, and indexation still applies to property?
  false_premises:
  - '"STCG is 10% if held under 6 months" (for LISTED EQUITY shares and equity-oriented mutual funds, Short-Term Capital Gains (STCG) are taxed at 20% (raised from 15% in Budget July 2024 effective for transfers on/after 23 July 2024); the holding-period threshold for listed equity is 12 MONTHS, not 6 months — sale within 12 months is short-term)'
  - '"LTCG is fully exempt above 1 lakh" (LTCG on listed equity beyond a threshold is TAXABLE; the threshold (and the rate) was changed in Budget July 2024 — exemption raised to ₹1,25,000 per year (from ₹1 lakh) and the LTCG rate raised to 12.5% (from 10%) for transfers on/after 23 July 2024; gains above the exempt threshold are taxable, not exempt)'
  - '"Indexation still applies to property" (Budget July 2024 REMOVED the INDEXATION BENEFIT for LTCG on real estate (and most other assets) for transfers on/after 23 July 2024; the new LTCG rate is 12.5% WITHOUT indexation; for property purchased before 23 July 2024, residents have an option of paying 20% with indexation or 12.5% without — whichever is lower)'
  ground_truth: 'India''s capital-gains taxation regime was substantially revamped by Budget July 2024 (effective for transfers on/after 23 July 2024). Key parameters now: HOLDING PERIODS — listed equity shares, equity-oriented mutual funds, units of business trusts: long-term if held > 12 MONTHS. Other listed securities, gold ETFs, debt-oriented mutual funds (with at least 65% debt, post-2023 changes): treated as short-term irrespective of period (Section 50AA changes). Real estate: long-term if > 24 MONTHS (was 36 months pre-2017). RATES — STCG on listed equity (Section 111A): 20% (raised from 15%). LTCG on listed equity (Section 112A): 12.5% on gains exceeding ₹1,25,000 per year (raised from 10% / ₹1 lakh threshold). LTCG on most other assets: 12.5% WITHOUT INDEXATION. INDEXATION REMOVED for most LTCG; transitional option for resident individuals/HUFs on real estate acquired BEFORE 23 July 2024 — pay either 20% with indexation or 12.5% without, whichever is lower. STT continues separately. Verify current rates and thresholds on incometax.gov.in / latest Finance Act before relying on specific numbers — these were a major change in July 2024 and minor calibrations may follow.'
  graceful_unknown: 'The "Budget 2024 revamp — STCG 20% on listed equity, LTCG 12.5% above ₹1.25 lakh, indexation removed (with grandfathering option for pre-23-July-2024 property)" framing is the load-bearing correction. Subsequent Finance Acts may calibrate these — verify on incometax.gov.in.'
