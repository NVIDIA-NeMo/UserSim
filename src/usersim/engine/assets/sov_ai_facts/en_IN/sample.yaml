- id: INDIA-EDUC-B003
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: The new National Education Policy is just an update of the 1986 NEP, right? Same 10+2 schooling structure, English-only at the central level, and it became law overnight in 2020?
  false_premises:
  - '"Just an update of the 1986 NEP" (NEP 2020 replaces both the 1968 NEP and the 1986 NEP (revised 1992) — it is a substantially new policy framework, not a minor update; first new education policy in 34 years)'
  - '"Same 10+2 schooling structure" (NEP 2020 explicitly REPLACES the 10+2 structure with a 5+3+3+4 (Foundational + Preparatory + Middle + Secondary) curricular framework, covering ages 3-18; pre-school is now formally inside the school structure)'
  - '"English-only at the central level" (NEP 2020 promotes a THREE-LANGUAGE FORMULA, with mother tongue / regional language as the medium of instruction up to at least Class 5, preferably till Class 8 wherever possible; English is one of three languages, not the central-level default)'
  - '"Became law overnight" (NEP 2020 is a POLICY, not a law/Act; legal implementation requires amendments to existing laws (e.g., RTE), state buy-in, and gradual rollout — many provisions are still being implemented through Centrally Sponsored Schemes like PM-SHRI, NIPUN Bharat (foundational literacy), and rules around 4-year UG / multidisciplinary higher-ed structures)'
  ground_truth: 'The NATIONAL EDUCATION POLICY 2020 (NEP 2020) was approved by the Union Cabinet on 29 July 2020 and is the THIRD national education policy of India, replacing the NEP 1968 and the NEP 1986 (revised 1992). It is a POLICY DOCUMENT — not a statute — and is implemented through Centrally Sponsored Schemes, regulatory changes, state-level buy-in, and amendments to existing laws (e.g., RTE Act, UGC Act, AICTE Act). Key shifts — (1) New CURRICULAR STRUCTURE: 5+3+3+4 (Foundational stage 3-8 yrs / Preparatory 8-11 / Middle 11-14 / Secondary 14-18) replaces the 10+2 structure, formally bringing pre-school (ages 3-5) into the school system. (2) MEDIUM OF INSTRUCTION: mother tongue / regional language as medium of instruction up to at least Class 5, preferably till Class 8; the THREE-LANGUAGE FORMULA preserved with greater flexibility, and no language imposed on any state. (3) FOUNDATIONAL LITERACY AND NUMERACY (FLN) by Class 3 — implemented through the NIPUN Bharat mission. (4) HIGHER EDUCATION: multidisciplinary 4-YEAR UNDERGRADUATE programme with multiple exit options (1-yr Certificate, 2-yr Diploma, 3-yr Bachelor, 4-yr Bachelor with Research); Academic Bank of Credits (ABC); Higher Education Commission of India (HECI) proposed to replace UGC, AICTE, NCTE (still pending legislation as of mid-2020s). (5) Target gross enrolment ratio (GER) in higher ed of 50% by 2035. (6) Common University Entrance Test — CUET — for central universities. Implementation timeline is multi-year and varies by state; verify current rollout status on the Ministry of Education site.'
  graceful_unknown: The "third NEP since independence; replaces the 10+2 with 5+3+3+4; mother-tongue medium up to at least Class 5; HECI is proposed not legislated" framing is the load-bearing correction. The current implementation status of HECI / CUET / 4-year UG rollout shifts year to year — the Ministry of Education and UGC websites are the canonical sources.
