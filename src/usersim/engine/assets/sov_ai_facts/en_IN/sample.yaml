- id: INDIA-FINA-B002
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Section 80C lets me claim ₹1.5 lakh deduction per investment, no? PPF, ELSS, life insurance — that's ₹4.5 lakh total. And it works under both old and new tax regimes?
  false_premises:
  - '"₹1.5 lakh deduction per investment" (Section 80C provides a CONSOLIDATED CAP of ₹1.5 LAKH across ALL eligible investments combined — PPF + ELSS + LIC + EPF + Sukanya Samriddhi + 5-year tax-saving FD + NSC + home-loan principal + tuition fees + and others — not ₹1.5 lakh per item)'
  - '"PPF + ELSS + Life Insurance = ₹4.5 lakh total" (the cap is ₹1.5 lakh combined; deposits beyond ₹1.5 lakh into 80C-eligible instruments still earn interest but DO NOT GET ADDITIONAL DEDUCTION — they''re effectively after-tax investments)'
  - '"Works under both old and new tax regimes" (Section 80C deductions, like most Chapter VI-A deductions, are LARGELY UNAVAILABLE under the NEW DEFAULT TAX REGIME (Section 115BAC), which trades the old deductions for lower slab rates; only specific exemptions like the standard deduction (₹75,000 from FY24-25) and employer NPS contribution under 80CCD(2) survive in the new regime)'
  ground_truth: 'SECTION 80C of the Income-tax Act, 1961 provides a CONSOLIDATED DEDUCTION CAP of ₹1,50,000 PER FINANCIAL YEAR across all eligible investments and expenses combined — NOT per item. Eligible items include: PPF, EPF (employee contribution), ELSS mutual funds, life-insurance premiums, NSC, 5-year tax-saving bank FDs, Senior Citizens'' Savings Scheme, Sukanya Samriddhi Account, Post Office Time Deposit (5-year), home-loan PRINCIPAL repayment, stamp duty / registration on house purchase, tuition fees for up to 2 children. SECTION 80CCD(1) (own NPS contribution) sits within this ₹1.5 lakh aggregate cap; Section 80CCD(1B) provides an ADDITIONAL ₹50,000 deduction for NPS Tier-I contributions, on top of 80C; Section 80CCD(2) (employer NPS contribution) is over and above 80C. From FY 2023-24 the NEW (DEFAULT) TAX REGIME under Section 115BAC trades most Chapter VI-A deductions (including 80C, 80D, HRA, LTA) for LOWER SLAB RATES; only the standard deduction (₹75,000 from FY24-25), 80CCD(2) employer NPS, and a few specific items survive. Taxpayers can OPT OUT of the new regime in favour of the old regime annually for non-business income; once opted, business-income filers face restrictions on switching back. Verify current slabs, deduction rules, and standard deduction on incometax.gov.in.'
  graceful_unknown: The "consolidated ₹1.5 lakh 80C cap (not per item); 80CCD(1B) gives extra ₹50k for NPS; new regime largely without 80C" framing is the load-bearing correction. Specific slabs and the ₹75,000 standard deduction figure change with successive Finance Acts — verify on incometax.gov.in.
