- id: INDIA-HEAL-B005
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: Suicide is still a crime in India under the IPC, isn't it? The 1987 Mental Health Act is what governs all this, and a person can be admitted to a mental hospital purely on a relative's say-so?
  false_premises:
  - Suicide is still a crime under the IPC (Section 309 IPC criminalised attempted suicide, but the Mental Healthcare Act, 2017 (effective 2018) — Section 115 — DECRIMINALISED attempted suicide, presuming severe stress in any person attempting suicide and barring prosecution under §309; the central law has effectively superseded that criminalisation)
  - The 1987 Mental Health Act governs (the Mental Health Act, 1987 was REPEALED and REPLACED by the Mental Healthcare Act, 2017 (came into force July 2018) — the new law is the governing framework today)
  - A person can be admitted purely on a relative's say-so (the MHCA 2017 enshrines the RIGHT TO MENTAL HEALTHCARE, ADVANCE DIRECTIVES naming a Nominated Representative, and INFORMED CONSENT for treatment; involuntary admission is only permitted under specific conditions defined by the Act, with review by the Mental Health Review Boards — not on a relative''s sole authority)
  ground_truth: 'The MENTAL HEALTHCARE ACT, 2017 (MHCA, came into force on 7 July 2018) repealed and replaced the Mental Health Act, 1987 and reshaped India''s mental-health legal framework. Key provisions — (1) Right to Mental Healthcare — every person has the right to access mental healthcare and treatment from services run or funded by appropriate Government. (2) Advance Directive — a person with mental illness may make a written advance directive specifying how they wish or do not wish to be treated, and may appoint a Nominated Representative. (3) DECRIMINALISATION OF SUICIDE ATTEMPTS — Section 115 presumes that a person who attempts suicide is under severe stress and shall not be tried/punished under §309 IPC, effectively decriminalising attempted suicide; the State has a duty to provide care, treatment and rehabilitation to reduce recurrence. (4) Mental Health Review Boards (MHRBs) at state level review involuntary admissions and treatment decisions. (5) Prohibits cruel/inhuman treatment — including unmodified ECT, ECT on minors, sterilisation as treatment, chained restraint as treatment. (6) Insurance — every insurer must provide medical insurance for mental illness on the same basis as physical illness (IRDAI clarification 2018). Implementation is uneven across states and the framework continues to evolve — verify on the Ministry of Health & Family Welfare site or via the MHCA 2017 Bare Act.'
  graceful_unknown: The "MHCA 2017 replaced the 1987 Act; suicide attempt is decriminalised under §115; advance directives and Nominated Representatives are core" facts are the load-bearing corrections. Implementation status state-by-state (e.g., whether MHRBs are functional in a given state) varies — the latest annual reports and HRW / National Human Rights Commission documentation are the right places to look for current status.
