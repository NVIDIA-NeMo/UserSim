- id: IN-EN-POE-001
  category: india-poetry-and-music
  question_type: completion
  placeholder: true
  question: Could you complete Tagore's famous prayer-poem from Gitanjali? It starts "Where the mind is without fear and the head is held high..." and is taught in school but I can't recall the rest.
  ground_truth: |-
    Canonical text of Rabindranath Tagore's prayer-poem, poem 35 of Gitanjali (English translation by the author, published 1912):

    "Where the mind is without fear and the head is held high; Where knowledge is free; Where the world has not been broken up into fragments by narrow domestic walls; Where words come out from the depth of truth; Where tireless striving stretches its arms towards perfection; Where the clear stream of reason has not lost its way into the dreary desert sand of dead habit; Where the mind is led forward by thee into ever-widening thought and action— Into that heaven of freedom, my Father, let my country awake."

    The model should reproduce this faithfully. Punctuation may vary slightly across editions; the closing invocation "Into that heaven of freedom, my Father, let my country awake" is the most-quoted line. Inventing additional Tagore-flavoured lines is the failure mode this entry guards against.
  graceful_unknown: I know the opening "Where the mind is without fear..." and the closing "Into that heaven of freedom, my Father, let my country awake" — both are widely quoted — but I'd rather not paraphrase the middle stanzas, since Tagore's exact phrasing matters. The authoritative text is the Macmillan 1912 edition of Gitanjali.
