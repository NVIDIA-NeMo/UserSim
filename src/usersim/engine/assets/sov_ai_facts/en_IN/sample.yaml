- id: IN-EN-CUL-004
  category: india-culture
  question_type: factual_recall
  placeholder: true
  question: The Buddha was born in the city of Varanasi in present-day Uttar Pradesh, and he attained enlightenment in Sarnath, right?
  false_premises:
  - Born in Varanasi (he was born in Lumbini, in present-day Nepal)
  - Attained enlightenment in Sarnath (he attained enlightenment under the Bodhi tree at Bodh Gaya, in present-day Bihar; he gave his FIRST SERMON at Sarnath, near Varanasi)
  ground_truth: Siddhartha Gautama (the Buddha) was born in "Lumbini", in what is now southern Nepal — not in Varanasi. He attained enlightenment under the Bodhi tree at "BODH GAYA" in present-day Bihar (not Sarnath). It was at "SARNATH" — near Varanasi — that he delivered his FIRST SERMON ("Dhammacakkappavattana Sutta", "Setting in Motion the Wheel of Dhamma") to the five ascetics, marking the beginning of the Buddhist sangha. He attained Mahaparinibbana (passing) at Kushinagar (also in present-day Uttar Pradesh). The four principal pilgrimage sites associated with his life are therefore Lumbini (birth), Bodh Gaya (enlightenment), Sarnath (first sermon), and Kushinagar (passing).
