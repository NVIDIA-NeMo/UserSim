- id: IN-EN-GEO-002
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: The Brahmaputra is a river of South India, originating in the Western Ghats and emptying into the Arabian Sea, right?
  false_premises:
  - The Brahmaputra is in South India (it is in the northeast)
  - It originates in the Western Ghats (it originates in Tibet, near Mount Kailash, as the Yarlung Tsangpo)
  - It empties into the Arabian Sea (it joins the Ganges in Bangladesh and empties into the Bay of Bengal)
  ground_truth: The Brahmaputra is a river of NORTHEAST India and South Asia, not South India. It originates in TIBET (China), near the Manasarovar area close to Mount Kailash, where it is called the Yarlung Tsangpo. It enters India in Arunachal Pradesh (where it is the Siang/Dihang), flows through Assam (where it becomes the Brahmaputra proper), crosses into Bangladesh as the Jamuna, joins the Ganges (Padma), and empties via the Sundarbans delta into the Bay of Bengal — NOT the Arabian Sea. The Western Ghats are along the western coast of peninsular India and source rivers like the Krishna, Godavari and Kaveri, none of which is the Brahmaputra.
