- id: INDIA-FINA-B003
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: NPS Tier I and Tier II accounts are basically the same, no? Both withdrawable any time, both giving the same tax deduction, and the entire corpus comes out tax-free at retirement?
  false_premises:
  - Tier I and Tier II are basically the same (TIER I is the primary, retirement-locked account — the one with statutory restrictions and tax benefits; TIER II is an OPTIONAL voluntary savings facility — flexible deposit/withdrawal, NO tax deduction for general subscribers (limited 80C deduction only for central-government employees with a 3-year lock), liquid like a regular investment account)
  - '"Both withdrawable any time" (Tier I is LOCKED until age 60 with limited partial withdrawals for specified purposes; Tier II is freely withdrawable any time)'
  - '"Both give the same tax deduction" (Tier I contributions qualify for Section 80CCD(1) within the ₹1.5 lakh 80C cap PLUS additional ₹50,000 under 80CCD(1B); Tier II for general subscribers does NOT enjoy 80C deduction — only central-government employees who lock the Tier-II contribution for 3 years can claim 80C on it)'
  - '"Entire corpus tax-free at retirement" (at age 60, up to 60% of the Tier-I corpus can be withdrawn TAX-FREE under Section 10(12A); the REMAINING 40% MUST BE USED to PURCHASE AN ANNUITY, and the annuity income is TAXABLE in the year received as ordinary income)'
  ground_truth: 'NPS has two account types — TIER I (mandatory primary retirement account) and TIER II (optional voluntary savings facility). TIER I — withdrawals locked until age 60 (with limited partial withdrawals for specified purposes such as higher education / marriage of children, purchase of first house, treatment of critical illness, after 3 years of contribution). At age 60, AT LEAST 40% of the corpus must be used to purchase an ANNUITY from a PFRDA-empanelled annuity service provider; UP TO 60% can be withdrawn as a LUMP SUM, TAX-FREE under Section 10(12A). Annuity income is TAXED as ordinary income in the year of receipt. Tax benefits — Section 80CCD(1) own contribution within ₹1.5 lakh 80C cap; Section 80CCD(1B) ADDITIONAL ₹50,000 deduction; 80CCD(2) employer contribution (10% of basic+DA, 14% for govt) over and above 80C ceiling. TIER II — voluntary, freely withdrawable any time, no lock-in for general subscribers. Tier II for GENERAL SUBSCRIBERS gets NO TAX DEDUCTION. CENTRAL-GOVERNMENT EMPLOYEES can claim 80C deduction on Tier II contributions if locked for 3 years (special "Tier II tax saver" facility). Both accounts use the same investment menu (Active Choice or Auto Choice across asset classes E, C, G, A); investment management is done by PFRDA-appointed Pension Fund Managers. Verify exact thresholds and current rules on the eNPS / PFRDA site.'
  graceful_unknown: The "Tier I = retirement-locked with tax benefits; Tier II = liquid voluntary savings without 80C for most; 60-40 rule with annuity at 60 (annuity income taxable)" framing is the load-bearing point. Specific tax treatment edge cases (e.g., the 3-year-locked Tier II for central-government employees) may shift with PFRDA / CBDT clarifications.
