  question: Ayushman Bharat is for everyone in India, no? Up to ₹10 lakh per person per year, including OPD and routine doctor visits?
  false_premises:
  - It's "for everyone" (Ayushman Bharat PM-JAY is targeted — eligibility is based on the SECC 2011 deprivation criteria for rural and occupation criteria for urban; it covers roughly 12 crore poorest families, not the whole population)
  - Up to ₹10 lakh per person per year (the cover is ₹5 LAKH per FAMILY per year on a family-floater basis, not per individual, and not ₹10 lakh)
  - Including OPD / routine doctor visits (PM-JAY is for SECONDARY and TERTIARY care — hospitalisation; outpatient/OPD consultations and medicines are NOT covered under PM-JAY; the OPD layer of Ayushman Bharat is the separate Health and Wellness Centres / Ayushman Arogya Mandir initiative)
  ground_truth: 'Ayushman Bharat has two main components — (1) Pradhan Mantri Jan Arogya Yojana (PM-JAY), a health-INSURANCE scheme for SECONDARY and TERTIARY hospitalisation, and (2) Health and Wellness Centres (now branded Ayushman Arogya Mandir), the primary-care / OPD layer. PM-JAY: provides an INSURANCE COVER OF ₹5 LAKH PER FAMILY PER YEAR on a family-floater basis for hospitalisation in empanelled public and private hospitals. Eligibility is targeted — based on Socio-Economic and Caste Census (SECC) 2011 deprivation criteria for rural areas and occupation-based criteria for urban areas; covers roughly 10-12 crore beneficiary families (around 50 crore individuals). NOT a universal scheme — middle-class and other families above the eligibility threshold are not covered. Also expanded to include all senior citizens aged 70 and above (Ayushman Vay Vandana, 2024) regardless of income. The scheme is implemented by the National Health Authority (NHA) under the Ministry of Health & Family Welfare, jointly with state governments. Verify eligibility on the PM-JAY beneficiary portal (pmjay.gov.in) using ration card, mobile, or Aadhaar.'
  graceful_unknown: The "₹5 lakh family floater, hospitalisation only, targeted not universal" facts are the load-bearing corrections. Specific recent expansions (e.g., the 70+ extension) and the precise empanelment rules I'd verify on pmjay.gov.in or the NHA site rather than from memory.
