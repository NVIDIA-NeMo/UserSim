- id: IN-EN-GEO-005
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: The Sundarbans mangrove forest is shared between India and Sri Lanka, and lies along India's western coast, right?
  false_premises:
  - Shared between India and Sri Lanka (it is shared between India and Bangladesh)
  - Along India's western coast (it is along the eastern coast, in the Ganges-Brahmaputra delta region of West Bengal and Bangladesh)
  ground_truth: The Sundarbans is the world's largest contiguous mangrove forest, and it is shared between India and BANGLADESH (not Sri Lanka). Roughly 60% of the forest area is in Bangladesh and 40% in India (West Bengal). It lies in the Ganges-Brahmaputra-Meghna delta region, on the eastern coast of India where the rivers empty into the Bay of Bengal — not along India's western coast (which has the Western Ghats and the Arabian Sea, with mangroves in places like the Gulf of Kutch but not the Sundarbans). The Sundarbans is famous for being one of the last natural habitats of the Royal Bengal tiger and is a UNESCO World Heritage Site (the Indian Sundarbans National Park was inscribed in 1987).
