- id: INDIA-LABO-B001
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: PF means just my employer puts in 12% every month, no? Mandatory for every job in India. And I can take the whole amount out any time?
  false_premises:
  - Just my employer puts in 12% (EPF (Employees' Provident Fund) is a CONTRIBUTORY scheme — both EMPLOYER and EMPLOYEE contribute 12% of basic + DA each; the employer's 12% is split, with 8.33% going to the EPS (Employees' Pension Scheme) up to a wage ceiling and the remainder to the EPF, plus 0.5% to EDLI; the employee's full 12% goes to EPF)
  - Mandatory for every job (EPF applies only to ESTABLISHMENTS covered under the EPF & MP Act, 1952 — typically those with 20+ employees in scheduled industries; below that threshold employers may register voluntarily; very small establishments and many informal-sector workers fall outside; coverage threshold for an employee within a covered establishment is mandatory only up to a basic+DA wage of ₹15,000/month, and voluntary above that)
  - Take the whole amount out any time (EPF withdrawals are RESTRICTED — full withdrawal is generally allowed only on retirement (age 58) or 2 months of unemployment after leaving a job; partial withdrawals are permitted for specific notified purposes (medical emergencies, marriage, education, home purchase / construction, COVID-era special advances etc.) with conditions; mid-employment full withdrawal is not permitted while in active employment)
  ground_truth: 'The Employees'' Provident Fund (EPF), administered by the EMPLOYEES'' PROVIDENT FUND ORGANISATION (EPFO) under the Ministry of Labour & Employment, is a CONTRIBUTORY retirement-savings and social-security scheme covering organised-sector workers. Coverage — establishments with 20+ EMPLOYEES in scheduled industries are mandatorily covered under the Employees'' Provident Funds and Miscellaneous Provisions Act, 1952; below that, employers may register voluntarily. Within a covered establishment, EPF is mandatory for employees with monthly basic + DA up to ₹15,000; above that threshold employees may continue to contribute voluntarily / at the employer''s discretion. CONTRIBUTIONS — EMPLOYEE: 12% of basic + DA (entire amount goes to EPF); EMPLOYER: 12% of basic + DA (split as 8.33% to EPS up to ₹15,000 wage and 3.67% to EPF; plus 0.5% to EDLI insurance and a small admin charge). WITHDRAWALS — full withdrawal generally allowed at age 58, on permanent settlement abroad, or after 2 months of continuous unemployment after leaving a job; partial withdrawal for specific purposes (medical, marriage / education of self or family, home purchase / construction / repair, retirement preparation) under conditions in Para 68B-68NN of EPF Scheme. Interest rate is set annually by the Central Board of Trustees and notified by the Government. UAN (Universal Account Number) and the EPFO portal (epfindia.gov.in / unifiedportal-mem.epfindia.gov.in) make balance, KYC, transfer, and claims accessible online.'
  graceful_unknown: The "EPF is contributory (employee 12% + employer 12%, with EPS split), 20-employee threshold for compulsory coverage, ₹15,000 wage ceiling for mandatoriness, restricted withdrawals" framing is the load-bearing point. Specific withdrawal categories, current interest rate, and EPS rules shift with EPFO circulars — verify on epfindia.gov.in.
