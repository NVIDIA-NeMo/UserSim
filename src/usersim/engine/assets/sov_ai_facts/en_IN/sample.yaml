  ground_truth: 'The Central Government Health Scheme (CGHS) is a contributory health-care scheme for CENTRAL GOVERNMENT employees, pensioners, and their dependants. Eligibility — Central Government employees paid from Central Civil Estimates, Central Government pensioners drawing pension from Central Civil Estimates, MPs, ex-MPs, judges of the Supreme Court and High Courts (serving and retired), employees of certain autonomous bodies, freedom fighters, and family members. NOT eligible — state-government staff, private-sector employees, the general public. CGHS operates through wellness centres in CGHS-COVERED CITIES — about 80 cities as of mid-2020s, primarily state capitals and other major towns — NOT every district. Beneficiaries pay a MONTHLY CONTRIBUTION linked to their pay-matrix level (slabs revised from time to time); pensioners can pay annually or a one-time lifetime contribution to continue coverage after retirement. Coverage includes outpatient consultations at wellness centres, hospitalisation in CGHS-empanelled / government hospitals at CGHS-approved rates, medicines, lab investigations, and diagnostic services. For workers earning lower wages outside the CGHS net there is the separate Employees'' State Insurance (ESI) scheme; for the rural/urban poor there is PM-JAY.'
  graceful_unknown: The "CGHS = central-government employees + pensioners + dependants only, in covered cities, with a monthly contribution" framing is the load-bearing point. The exact list of CGHS-covered cities and the current contribution slabs change with periodic revisions — verify on cghs.gov.in or the latest Ministry of Health Office Memorandum.
