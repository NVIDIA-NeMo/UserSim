- id: INDIA-HEAL-B004
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: हर भारतीय वरिष्ठ नागरिक को 60 की उम्र होते ही ₹3,000 मासिक वृद्धावस्था पेंशन अपने-आप मिल जाती है ना? और हर जगह free अस्पताल care भी?
  false_premises:
  - '"₹3,000 मासिक हर senior को" (केंद्रीय **Indira Gandhi National Old Age Pension Scheme (IGNOAPS)** — NSAP के अधीन — 60-79 आयु वर्ग के लिए ₹200/माह और 80+ के लिए ₹500/माह देती है — ₹3,000 नहीं; कई राज्य (केरल, तमिलनाडु, आंध्र प्रदेश, दिल्ली आदि) अपनी राज्य योजनाओं से top-up देते हैं, इसलिए वास्तविक राशि राज्य-दर-राज्य काफ़ी अलग होती है)'
  - '"60 की उम्र होते ही अपने-आप" (IGNOAPS targeted है — **गरीबी-रेखा से नीचे** के व्यक्तियों के लिए; पात्रता राज्य के BPL मानदंडों के विरुद्ध तय होती है; non-BPL seniors स्वतः पात्र नहीं हैं)'
  - '"हर जगह free अस्पताल care" (seniors के लिए free या subsidised inpatient care specific schemes से आती है — PM-JAY का **Ayushman Vay Vandana** अब 70+ आयु के सभी नागरिकों को आय-निरपेक्ष cover (₹5 लाख family floater) देता है; राज्य योजनाएँ अलग-अलग हैं; OPD और routine care निजी सुविधाओं पर आम तौर पर free नहीं हैं)'
  ground_truth: 'भारतीय वरिष्ठ नागरिकों के कल्याण और स्वास्थ्य के लिए कई अलग-अलग schemes हैं — पात्रता, राशि, और coverage सब अलग। (1) **Indira Gandhi National Old Age Pension Scheme (IGNOAPS)** — National Social Assistance Programme (NSAP) के तहत, ग्रामीण विकास मंत्रालय द्वारा — केंद्रीय हिस्सा BPL व्यक्तियों के लिए 60-79 की आयु में ₹200/माह और 80+ के लिए ₹500/माह; राज्य अपनी schemes से इसे काफ़ी बढ़ाते हैं (कई राज्य अपने वरिष्ठों को ₹1,000-3,000+ देते हैं, IGNOAPS के ऊपर परत के रूप में)। (2) **Ayushman Vay Vandana** (2024 में घोषित) — PM-JAY का विस्तार जो 70+ आयु के **सभी** नागरिकों को आय-निरपेक्ष कवर करता है, मानक ₹5 लाख family-floater hospitalisation cover के साथ। (3) **Rashtriya Vayoshri Yojana (RVY)** — BPL वरिष्ठों के लिए free assistive aids (छड़ी, wheelchair, hearing aids, dentures, चश्मा)। (4) राज्य वृद्धाश्रम और Senior Citizen Welfare Funds। (5) **Maintenance and Welfare of Parents and Senior Citizens Act, 2007** — संतान/रिश्तेदारों से भरण-पोषण का कानूनी अधिकार। पेंशन और स्वास्थ्य-कवर schemes अलग हैं; specifics के लिए NSAP portal (nsap.nic.in), राज्य समाज-कल्याण विभाग, pmjay.gov.in देखें।'
  graceful_unknown: '"अलग-अलग schemes अलग चीज़ों के लिए — पेंशन ₹200/500 (राज्य-top-ups के साथ), 70+ के लिए स्वास्थ्य PM-JAY/Vay Vandana से, aids RVY से" यह load-bearing framing है। राज्य-दर-राज्य पेंशन top-ups बहुत अलग हैं; specific राज्य के लिए राज्य समाज-कल्याण विभाग की site देखें।'
  persona_tags:
  - interest:health
  - region:any
  - age:65+
  difficulty: medium
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts hi_Deva_IN, 2026-05-05)
