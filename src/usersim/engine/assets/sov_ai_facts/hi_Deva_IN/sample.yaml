- id: INDIA-FINA-B005
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: मेरा bank बंद हो जाए तो सरकार पूरे ₹50 लाख की राशि का insurance करती है ना? SEBI handle करता है इसे, और money market mutual funds को भी same protection?
  false_premises:
  - '"₹50 लाख का insurance" (**DICGC (Deposit Insurance and Credit Guarantee Corporation)** का deposit insurance **प्रति depositor प्रति bank ₹5 लाख तक** cover करता है — ₹50 लाख नहीं, और पूरा balance नहीं; cover 4 फ़रवरी 2020 से ₹1 लाख से ₹5 लाख की गई, और savings + current + recurring + fixed deposits को मिलाकर उस bank पर लागू होती है; ₹5 लाख से अधिक deposits **insured नहीं** हैं)'
  - '"SEBI handle करता है" (**SEBI Securities and Exchange Board of India** है — यह capital markets को regulate करता है, bank deposits को नहीं; bank-deposit insurance **DICGC** द्वारा संचालित है, जो **RBI की पूर्ण-स्वामित्व वाली subsidiary** है; bank prudential regulation RBI के पास है Banking Regulation Act, 1949 के तहत)'
  - '"money market mutual funds को same protection" (**Mutual funds SEBI-regulated investment products** हैं और DICGC deposit insurance में cover नहीं हैं; mutual fund unit-holders market risk उठाते हैं; DICGC केवल **commercial banks** के deposits cover करती है — regional rural banks, state co-operative banks, central co-operative banks, और कुछ primary co-operative banks सहित — परन्तु corporate deposits, NBFCs, mutual funds नहीं)'
  ground_truth: 'भारत में bank-deposit insurance **DICGC Act, 1961** के तहत स्थापित **Deposit Insurance and Credit Guarantee Corporation (DICGC)** द्वारा संचालित है — यह Reserve Bank of India की पूर्ण-स्वामित्व वाली subsidiary है। **Coverage** — एक ही bank की सभी शाखाओं में deposits (savings, current, recurring, fixed) को मिलाकर **₹5,00,000 (₹5 लाख) प्रति depositor प्रति bank** तक; cover 4 फ़रवरी 2020 से प्रभावी है (₹1 लाख से बढ़ाई गई)। Joint accounts अलग-अलग first holders या अलग ownership capacities (जैसे individual vs partner / trustee / नाबालिग के natural guardian) के साथ अलग-अलग insurance पाते हैं। DICGC cover करती है **सभी commercial banks** (private, public, foreign, small finance, payments banks कुछ conditions के साथ), regional rural banks, और licensed co-operative banks; **NBFCs, mutual funds, corporate deposits, post-office deposits नहीं** (post-office deposits को **sovereign guarantee** प्राप्त है, DICGC नहीं)। Premium **bank** देता है, depositor नहीं। **DICGC (Amendment) Act, 2021** stressed banks (जैसे RBI के Section 35A के तहत moratorium) के depositors को relevant order के 90 दिनों के भीतर insured राशि का interim payment भी enable करता है। **Mutual funds SEBI-regulated investment products** हैं और market risk बेकर हैं — कोई DICGC cover नहीं।'
  graceful_unknown: '"DICGC (RBI subsidiary) Feb 2020 से ₹5 लाख per depositor per bank cover; SEBI markets / mutual funds के लिए; mutual funds market risk उठाते हैं" — यह load-bearing framing है। Specific edge cases (joint-account capacity, payments banks, co-operatives) और 90-day interim payment rules के लिए dicgc.org.in पर सत्यापित करें।'
