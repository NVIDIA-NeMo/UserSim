- id: INDIA-DIGI-B003
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: UPI को सीधे RBI चलाता है ना? सब के लिए flat ₹10 लाख प्रति-दिन का P2P limit है, और merchants को छोटे payments पर भी हमेशा MDR देना पड़ता है?
  false_premises:
  - '"सीधे RBI चलाता है" (UPI **National Payments Corporation of India (NPCI)** द्वारा operate है, जो RBI और Indian Banks'' Association द्वारा **Companies Act 2013 के तहत incorporated** एक umbrella organisation है, **Payment and Settlement Systems Act, 2007** के framework के तहत; **RBI regulator** है, परन्तु day-to-day NPCI चलाता है)'
  - '"flat ₹10 लाख प्रति-दिन का P2P limit सब के लिए" (default UPI P2P transaction limit **प्रति transaction ₹1,00,000 (₹1 लाख)** है, bank-specific daily caps के साथ; specific use-cases के लिए NPCI ने **उच्च caps** notify किए हैं — capital markets / collections / tax payments / education / health insurance और कुछ merchant payments के लिए higher per-transaction limits (जैसे कुछ के लिए ₹2 लाख, capital markets और tax payments के लिए ₹5 लाख); flat ₹10 लाख नहीं)'
  - '"merchants हमेशा MDR देते हैं" (जनवरी 2020 से — Income-tax Act की Section 269SU और CGST notifications के तहत — UPI और RuPay debit-card transactions for businesses with turnover above ₹50 करोड़ पर **zero MDR** (merchant discount rate) है; छोटे-merchant ecosystem UPI / RuPay के लिए zero-MDR रहा है; 2023 में NPCI ने **केवल UPI Wallet (PPI) transactions** ₹2,000 से ऊपर के merchant transactions पर 1.1% interchange fee लगाई — bank account-funded UPI zero-MDR रहती है; इसलिए "हमेशा" ग़लत है)'
  ground_truth: '**UPI (Unified Payments Interface)** **NPCI (National Payments Corporation of India)** द्वारा operate है, जो RBI और Indian Banks'' Association द्वारा **Companies Act 2013 के तहत incorporated**, **Payment and Settlement Systems Act, 2007** के कानूनी framework के तहत है (RBI regulator है)। **मुख्य बिंदु** — (1) **DEFAULT TRANSACTION LIMITS**: सामान्य P2P / P2M के लिए **प्रति transaction ₹1,00,000**; bank-specific daily caps लागू। NPCI ने specific use cases के लिए **उच्च limits** notify किए हैं — capital markets, collections, insurance, foreign inward remittances के लिए ₹2,00,000; capital markets / tax payments / IPO collections के लिए ₹5,00,000। UPI Lite पर छोटे-मूल्य caps। चुनिंदा corridors में **International UPI** सक्षम है। (2) **MDR (Merchant Discount Rate)**: bank-funded UPI और RuPay debit transactions के लिए MDR **zero** है, 1 जनवरी 2020 से (Section 269SU IT Act, CBDT Notification 2019)। **UPI Wallet / PPI-funded merchant transactions ₹2,000 से ऊपर** पर NPCI ने 2023 में **0.5%-1.1% interchange fee** introduce की (issuer को acquirer द्वारा paid; आम तौर पर consumer पर pass नहीं)। (3) **Security**: UPI PIN (4-6 अंक) और device-binding के माध्यम से 2-FA। (4) **मुख्य apps**: BHIM (NPCI''s own), साथ में PhonePe, Google Pay, Paytm, Amazon Pay आदि — सभी UPI-enabled apps हैं जो user के bank account से interface करते हैं। npci.org.in पर current limits और rules सत्यापित करें।'
  graceful_unknown: '"NPCI UPI चलाता है (RBI regulator); ₹1 लाख default P2P limit (specific use cases के लिए higher caps); bank-funded UPI के लिए zero MDR" — यह load-bearing framing है। Specific transaction limits और UPI के विभिन्न flavours का सटीक MDR / interchange treatment NPCI circulars से बदलते हैं — npci.org.in पर सत्यापित करें।'
