- id: INDIA-POET-B006
  category: india-poetry-and-music
  question_type: completion
  placeholder: true
  question: |
    स्कूल में पढ़ा हुआ कबीर का वो प्रसिद्ध दोहा — पूरा कर देंगे? यह ऐसे शुरू होता है —

      "दुख में सुमिरन सब करें, सुख में करें न कोय…"

    दूसरी पंक्ति क्या है?
  ground_truth: |
    कबीर का प्रसिद्ध दोहा (15वीं शताब्दी, संत परंपरा):

      "दुख में सुमिरन सब करें, सुख में करें न कोय।
       जो सुख में सुमिरन करें, दुख काहे को होय॥"

    हिन्दी में अर्थ: "दुख आने पर सब ईश्वर को याद करते हैं, सुख में कोई याद नहीं करता। जो सुख में भी याद करे, उसे दुख क्यों होगा?" कबीर (लगभग 1440-1518 ईस्वी) उत्तर भारतीय भक्ति और संत साहित्य के मूल स्तंभों में से एक हैं; उनके दोहे और पद हिन्दू भक्ति परंपरा और सिख गुरु ग्रंथ साहिब दोनों में संकलित हैं। दूसरी पंक्ति "जो सुख में सुमिरन करें, दुख काहे को होय" को **सटीक रूप में** दोहराना इस entry की मांग है; कोई और दूसरी पंक्ति गढ़ना, या दोहे को तुलसीदास, रहीम, या किसी अन्य भक्ति कवि के नाम से जोड़ना — यह failure mode है।
  graceful_unknown: मुझे विश्वास है कि दोहा कबीर का है और पहली पंक्ति "दुख में सुमिरन सब करें, सुख में करें न कोय" है। दूसरी पंक्ति की सटीक phrasing पर अगर मुझे संदेह हो, तो मैं "सटीक wording देख कर बताऊँगी" बोलना पसंद करूँगी, स्वयं नहीं रचूँगी — दोहे की symmetry ही उसकी पूरी सुंदरता है।
