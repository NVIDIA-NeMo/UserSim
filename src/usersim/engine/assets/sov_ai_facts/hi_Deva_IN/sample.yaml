- id: INDIA-FINA-B006
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Listed Indian shares पर capital-gains rates सालों से नहीं बदले ना? STCG 6 महीने से कम पर 10%, LTCG 1 लाख से ऊपर पूरा exempt, और property पर अब भी indexation मिलता है?
  false_premises:
  - '"STCG 6 महीने से कम पर 10%" (**listed equity** shares और equity-oriented mutual funds के लिए, Short-Term Capital Gains (STCG) **20%** पर taxed होते हैं (जुलाई 2024 के Budget में 15% से बढ़ाई गई, 23 जुलाई 2024 या उसके बाद के transfers के लिए प्रभावी); listed equity के लिए **holding-period threshold 12 महीने** है, 6 महीने नहीं — 12 महीनों के भीतर बिक्री short-term है)'
  - '"LTCG 1 लाख से ऊपर exempt" (listed equity पर LTCG threshold से ऊपर **taxable** है, exempt नहीं; threshold (और rate) Budget July 2024 में बदला गया — exemption ₹1,25,000 प्रति वर्ष (₹1 लाख से बढ़ी) और LTCG rate **12.5%** (10% से बढ़ी), 23 जुलाई 2024 या उसके बाद के transfers के लिए; exempt threshold से ऊपर का gain taxable है, exempt नहीं)'
  - '"property पर अब भी indexation" (Budget July 2024 ने real estate (और अधिकांश अन्य assets) पर LTCG का **indexation benefit हटा दिया**, 23 जुलाई 2024 या उसके बाद के transfers के लिए; नया LTCG rate **12.5% बिना indexation** है; 23 जुलाई 2024 से **पहले** ख़रीदी गई property के लिए, residents के पास option है — 20% with indexation या 12.5% without — जो भी कम हो)'
  ground_truth: 'भारत के capital-gains taxation regime को **Budget July 2024** ने काफ़ी हद तक revamp किया है (23 जुलाई 2024 या उसके बाद के transfers के लिए प्रभावी)। Key parameters अब: **HOLDING PERIODS** — listed equity shares, equity-oriented mutual funds, business trusts के units: long-term यदि **12 महीने से अधिक**। अन्य listed securities, gold ETFs, debt-oriented mutual funds (कम से कम 65% debt के साथ, 2023 के बाद के बदलाव): अवधि की परवाह किए बिना short-term माने जाते हैं (Section 50AA changes)। Real estate: long-term यदि **24 महीने से अधिक** (2017 से पहले 36 महीने थे)। **RATES** — listed equity पर **STCG (Section 111A): 20%** (15% से बढ़ी)। listed equity पर **LTCG (Section 112A): प्रति वर्ष ₹1,25,000 से अधिक gains पर 12.5%** (10% / ₹1 लाख threshold से बढ़ाई गई)। अन्य अधिकांश assets पर **LTCG: 12.5% बिना indexation**। **Indexation अधिकांश LTCG से हटाया गया**; 23 जुलाई 2024 से पहले अधिग्रहित real estate पर resident individuals/HUFs के लिए transitional option — 20% with indexation या 12.5% without, जो भी कम हो। STT अलग से जारी रहता है। Specific numbers पर भरोसा करने से पहले current rates और thresholds incometax.gov.in / नवीनतम Finance Act पर सत्यापित करें — जुलाई 2024 में बड़ा बदलाव था और छोटे calibrations आगे भी हो सकते हैं।'
  graceful_unknown: '"Budget 2024 revamp — listed equity पर STCG 20%, LTCG 12.5% above ₹1.25 लाख, indexation हटाया (23 जुलाई 2024 से पहले की property के लिए grandfathering option के साथ)" — यह load-bearing framing है। आगे के Finance Acts इन्हें calibrate कर सकते हैं — incometax.gov.in पर सत्यापित करें।'
