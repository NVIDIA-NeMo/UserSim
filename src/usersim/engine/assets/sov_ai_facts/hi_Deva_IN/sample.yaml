  question: नई National Education Policy तो 1986 की NEP का बस एक update है ना? वही 10+2 स्कूली ढाँचा, केंद्रीय स्तर पर सिर्फ़ अंग्रेज़ी, और 2020 में रातोंरात कानून बन गई?
  false_premises:
