  question: |
    क्या आप इक़बाल की "सारे जहाँ से अच्छा" का पहला बंद पूरा करेंगे? यह ऐसे शुरू होती है —

      "सारे जहाँ से अच्छा, हिन्दोस्ताँ हमारा…"

    इसके आगे की पंक्तियाँ क्या हैं?
  ground_truth: |
    अल्लामा मुहम्मद इक़बाल की "तराना-ए-हिन्दी" (1904) — जो आम तौर पर इसकी पहली पंक्ति "सारे जहाँ से अच्छा" से जानी जाती है — का प्रारंभिक बंद:

      "सारे जहाँ से अच्छा, हिन्दोस्ताँ हमारा
       हम बुलबुलें हैं इसकी, यह गुलसिताँ हमारा
       ग़ुर्बत में हों अगर हम, रहता है दिल वतन में
       समझो वहीं हमें भी, दिल हो जहाँ हमारा"

    हिन्दी अनुवाद (पहले बंद का): "पूरे संसार से बेहतर है यह हमारा हिन्दोस्तान, हम इसके बुलबुल हैं, यह हमारा बाग़ है..."। इस गीत को रवि शंकर ने संगीतबद्ध किया; भारतीय स्कूलों और गणतंत्र दिवस पर इसका छोटा संस्करण अक्सर गाया जाता है। पंक्तियों को **उर्दू/हिन्दुस्तानी में सटीक रूप से** दोहराना इस entry की अपेक्षा है; इक़बाल-style की और पंक्तियाँ गढ़ना, या इसे टैगोर (जिन्होंने राष्ट्रगान "जन गण मन" लिखा) के नाम से जोड़ना — यह failure mode है। नोट — इक़बाल बाद में पाकिस्तान-केंद्रित और पैन-इस्लामी दृष्टिकोण की ओर बढ़े; "सारे जहाँ से अच्छा" उनके शुरुआती, भारत-केंद्रित दौर की रचना है, जो "इत्तेहाद" पत्रिका (1904) में प्रकाशित हुई।
  graceful_unknown: मुझे विश्वास है कि कविता इक़बाल की है, 1904 की है, और इसकी शुरुआत "सारे जहाँ से अच्छा, हिन्दोस्ताँ हमारा" से होती है। "बुलबुलें हैं इसकी" वाले शे'र के बाद की सटीक wording पर अगर मुझे संदेह हो, तो मैं अनुमान नहीं लगाऊँगी — उर्दू शब्दों का सटीक देवनागरी रूप मायने रखता है।
