- id: INDIA-EDUC-B006
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: UGC तो भारत के हर college को regulate करता है ना? Engineering, medical, law — सब? और medical colleges के लिए MCI ही आज भी body है?
  false_premises:
  - '"UGC हर college को regulate करता है" (**UGC University Grants Commission** — UGC Act 1956 के तहत स्थापित — universities (central, state, deemed-to-be, private) को मान्यता देता है और regulate करता है, और higher-education general / academic stream का देखरेख करता है; technical, medical, legal, agricultural, architecture, pharmacy, dental, veterinary, और nursing professional education के लिए **अलग-अलग statutory regulators** हैं)'
  - '"Engineering, medical, law सब UGC के अधीन" (Engineering / management / pharmacy / architecture आदि **AICTE** के अधीन (1987 Act); medical education **National Medical Commission, NMC**; legal education **Bar Council of India**; agricultural **ICAR**; nursing **INC**; dental **DCI**; veterinary **VCI**; pharmacy **PCI**)'
  - '"MCI ही आज भी body है" (**Medical Council of India (MCI) को रद्द कर दिया गया** है और **National Medical Commission Act, 2019** के तहत **National Medical Commission (NMC)** ने इसे प्रतिस्थापित किया है — NMC ने सितंबर 2020 में कार्यभार संभाला; **MCI अब अस्तित्व में नहीं है**)'
  ground_truth: 'भारत के higher-education का regulation कई statutory bodies के बीच विभाजित है — (1) **UGC (University Grants Commission)** — UGC Act, 1956 — universities को मान्यता देता है और general higher education को oversee करता है, minimum standards निर्धारित करता है, grants programmes चलाता है। (2) **AICTE (All India Council for Technical Education)** — AICTE Act, 1987 — technical education programmes को approve और regulate करता है (engineering, technology, management/MBA, architecture, town planning, pharmacy, applied arts, hotel management & catering technology); PMSSS, PMRF support schemes भी चलाता है। (3) **National Medical Commission (NMC)** — NMC Act, 2019, सितंबर 2020 से कार्यभार, **MCI को प्रतिस्थापित** करता है — medical education, medical practitioners का registration, standards निर्धारित करता है और NEET-PG / NExT (planned) conduct करता है। (4) **Bar Council of India (BCI)** — Advocates Act, 1961 — law colleges को मान्यता देता है और advocates को Bar में admit करता है। (5) **National Council for Teacher Education (NCTE)** — NCTE Act, 1993 — teacher-education programmes को regulate करता है। (6) **ICAR (Indian Council of Agricultural Research)** — agricultural / veterinary / fisheries programmes। (7) **INC (Indian Nursing Council)** — INC Act 1947। (8) **DCI (Dental Council of India), VCI (Veterinary Council of India), PCI (Pharmacy Council of India), CoA (Council of Architecture)** — dental, veterinary, pharmacy, architecture के समकक्ष निकाय। **NEP 2020** ने प्रस्तावित किया है कि UGC, AICTE, और NCTE को एक **Higher Education Commission of India (HECI)** में मिला दिया जाए, अलग-अलग verticals के साथ — implementation statutory enactment लंबित है।'
  graceful_unknown: '"अलग-अलग streams के लिए अलग regulators; MCI को 2020 में NMC ने बदला; HECI प्रस्तावित है, अभी कानून नहीं" — यह load-bearing framing है। Specific professional regulators की सूची और HECI legislation का वर्तमान status annual policy updates से बदलता है — हर council की site / शिक्षा मंत्रालय की updates देखें।'
