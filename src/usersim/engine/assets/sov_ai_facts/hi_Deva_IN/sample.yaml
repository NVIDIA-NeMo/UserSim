- id: IN-HI-GEO-004
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: हिमालय की सबसे ऊँची चोटी माउंट एवरेस्ट भारत में स्थित है, और इसकी ऊँचाई लगभग 6000 मीटर है, सही है ना?
  false_premises:
  - एवरेस्ट भारत में स्थित है (वास्तव में नेपाल-तिब्बत/चीन सीमा पर है, भारत में नहीं)
  - ऊँचाई लगभग 6000 मीटर (वास्तव में लगभग 8,849 मीटर)
  ground_truth: 'माउंट एवरेस्ट (नेपाली: सगरमाथा, तिब्बती: चोमोलुङ्मा) "नेपाल और तिब्बत (चीन)" की सीमा पर स्थित है, भारत में नहीं। इसकी ऊँचाई लगभग "8,849 मीटर" है (2020 के संयुक्त नेपाल-चीन सर्वेक्षण के अनुसार), 6000 नहीं। भारत में हिमालय की सबसे ऊँची चोटी "कंचनजंगा" है (8,586 मीटर, सिक्किम में), जो विश्व की तीसरी सबसे ऊँची चोटी है। अन्य प्रमुख भारतीय हिमालयी चोटियाँ हैं नंदा देवी (7,816 मीटर, उत्तराखंड) और कामेट (7,756 मीटर, उत्तराखंड)।'
