- id: INDIA-FINA-B003
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: NPS Tier I और Tier II accounts तो basically एक ही हैं ना? दोनों कभी भी withdrawable, दोनों पर same tax deduction, और retirement पर पूरा corpus tax-free निकाल सकते हैं?
  false_premises:
  - '"Tier I और Tier II basically एक हैं" (**Tier I** primary, retirement-locked account है — statutory restrictions और tax benefits वाला; **Tier II** एक **optional voluntary savings facility** है — flexible deposit/withdrawal, **सामान्य subscribers के लिए कोई tax deduction नहीं** (केंद्र-सरकार के कर्मचारियों के लिए limited 80C deduction 3-साल lock के साथ), liquid किसी regular investment account जैसा)'
  - '"दोनों कभी भी withdrawable" (**Tier I age 60 तक locked** है, specified उद्देश्यों के लिए limited partial withdrawals; Tier II कभी भी freely withdrawable है)'
  - '"दोनों पर same tax deduction" (Tier I contributions Section 80CCD(1) के तहत ₹1.5 लाख 80C cap के भीतर **plus** 80CCD(1B) के तहत अतिरिक्त ₹50,000 के लिए qualify करते हैं; **Tier II सामान्य subscribers को 80C deduction नहीं देता** — केवल केंद्र-सरकार के कर्मचारी जो Tier-II contribution को 3 साल lock करें वही 80C claim कर सकते हैं)'
  - '"पूरा corpus retirement पर tax-free" (60 की आयु पर Tier-I corpus का **60% तक** Section 10(12A) के तहत **tax-free** निकाला जा सकता है; **बाक़ी 40% का annuity ख़रीदना अनिवार्य** है, और annuity income प्राप्ति के वर्ष में ordinary income के रूप में **taxable** होती है)'
  ground_truth: '**NPS में दो account types** — **Tier I** (mandatory primary retirement account) और **Tier II** (optional voluntary savings facility)। **Tier I** — withdrawals 60 की आयु तक locked (specified उद्देश्यों जैसे बच्चों की उच्च शिक्षा / विवाह, पहला घर, गंभीर बीमारी का इलाज के लिए limited partial withdrawals, 3 साल contribution के बाद)। **Age 60 पर**, corpus का **कम से कम 40%** PFRDA-empanelled annuity service provider से **annuity** ख़रीदने में जाना है; **60% तक lump sum**, Section 10(12A) के तहत tax-free। **Annuity income** प्राप्ति के वर्ष में ordinary income के रूप में taxed। **Tax benefits** — Section 80CCD(1) स्वयं contribution ₹1.5 लाख 80C cap के भीतर; Section 80CCD(1B) **अतिरिक्त ₹50,000 deduction**; 80CCD(2) employer contribution (basic+DA का 10%, govt के लिए 14%) 80C ceiling के ऊपर। **Tier II** — voluntary, कभी भी freely withdrawable, सामान्य subscribers के लिए कोई lock-in नहीं। **Tier II for सामान्य subscribers को कोई tax deduction नहीं** मिलती। **केंद्र-सरकार के कर्मचारी** Tier II contributions पर 80C deduction claim कर सकते हैं यदि 3 साल lock करें (special "Tier II tax saver" facility)। दोनों accounts एक ही investment menu (Active Choice या Auto Choice across asset classes E, C, G, A) का उपयोग करते हैं; investment management PFRDA द्वारा appoint किए गए Pension Fund Managers द्वारा। eNPS / PFRDA की site पर सटीक thresholds और current rules सत्यापित करें।'
  graceful_unknown: '"Tier I = retirement-locked tax benefits के साथ; Tier II = liquid voluntary savings, अधिकांश के लिए 80C नहीं; 60-40 rule annuity के साथ at 60 (annuity income taxable)" — यह load-bearing framing है। Specific tax treatment edge cases (जैसे केंद्र-सरकार के कर्मचारियों के लिए 3-साल-locked Tier II) PFRDA / CBDT clarifications से बदल सकते हैं।'
