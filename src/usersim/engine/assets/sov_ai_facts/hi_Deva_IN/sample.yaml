- id: INDIA-DIGI-B001
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: आधार तो बस नागरिकता का कार्ड है ना? गृह मंत्रालय जारी करता है, हर एक के लिए mandatory है, और भारत में एकमात्र मान्य ID है?
  false_premises:
  - '"बस नागरिकता का कार्ड" (आधार **भारत के निवासियों** को biometric और demographic data के आधार पर जारी की गई 12-अंकीय unique identity number है — यह स्पष्ट रूप से **नागरिकता का प्रमाण नहीं** है; **Aadhaar Act, 2016** यह सीधे कहता है; नागरिकता-संबंधी प्रक्रियाओं के लिए relevant दस्तावेज़ भारतीय passport, voter ID अन्य प्रमाणों के साथ, या specific certificates हैं)'
  - '"गृह मंत्रालय जारी करता है" (आधार **Unique Identification Authority of India (UIDAI)** जारी करता है, जो **Ministry of Electronics and Information Technology (MeitY)** के अधीन एक वैधानिक प्राधिकरण है — गृह मंत्रालय (Ministry of Home Affairs) के अधीन नहीं)'
  - '"हर एक के लिए mandatory" (आधार सिद्धांत रूप में **तकनीकी रूप से voluntary** है; Supreme Court ने **K.S. Puttaswamy v. Union of India (2018)** में आधार को बनाए रखा परन्तु बहुत निजी सेवाओं के लिए mandatory बनाने वाले प्रावधानों को **read down** कर दिया — आधार **Consolidated Fund of India** से मिलने वाली subsidies/benefits/services के लिए Section 7 के तहत आवश्यक हो सकता है, परन्तु bank account खोलने, mobile connection, school admission, या निजी संस्थाओं द्वारा उस framework के बाहर **mandatory नहीं** बनाया जा सकता)'
  - '"एकमात्र मान्य ID" (भारतीय निवासियों के पास कई मान्य पहचान दस्तावेज़ हैं — passport, voter ID (EPIC), driving licence, PAN card, ration card आदि; प्रत्येक अपने उद्देश्य के लिए मान्य; कोई एक "एकमात्र मान्य ID" नहीं है)'
  ground_truth: '**आधार** **Unique Identification Authority of India (UIDAI)** द्वारा भारत के **निवासियों** को जारी की गई **12-अंकीय unique identity number** है, जो **Aadhaar Act, 2016** के अधीन वैधानिक प्राधिकरण है, और **Ministry of Electronics and Information Technology (MeitY)** के तहत कार्य करता है। आधार demographic (नाम, जन्मतिथि, पता, लिंग) और **biometric** (fingerprints, iris, photograph) data पर आधारित है। **मुख्य बिंदु** — (1) आधार **नागरिकता का प्रमाण नहीं** — यह **निवास और पहचान** का प्रमाण है; Aadhaar Act यह स्पष्ट रूप से कहता है। (2) Supreme Court का **K.S. Puttaswamy v. Union of India** निर्णय (आधार judgment, 2018, 5-judge Constitution Bench) ने आधार को बनाए रखा परन्तु mandatoriness के प्रावधानों को **read down** किया: आधार **Consolidated Fund of India** से funded subsidies, benefits, या services के लिए Section 7 के तहत आवश्यक हो सकता है — जैसे LPG subsidy, MGNREGA wages, scholarships — परन्तु bank accounts, mobile SIM connections, school admissions, board exams, NEET / CBSE / UGC आदि के लिए, या Section 57 (जिसे **struck down** किया गया) के तहत निजी contractual relationships के लिए **mandatory नहीं** बनाया जा सकता। (3) आधार KYC contexts में पहचान / पते / आयु के प्रमाण के रूप में **voluntarily** उपयोग किया जा सकता है। (4) demographic / biometric data के updates **Aadhaar Seva Kendras / UIDAI portal** पर। (5) **Right to Privacy (Puttaswamy, 2017)** — Constitutional underpinning है जो आधार के उपयोग को constrain करता है। **uidai.gov.in** पर सत्यापित करें।'
  graceful_unknown: '"नागरिकता नहीं; UIDAI MeitY के अधीन; Section 7 (Consolidated Fund) mandatoriness को सीमित करती है; कई अन्य मान्य IDs" — यह load-bearing framing है। आधार वर्तमान में किन services के लिए mandatory है vs prohibited — notifications से बदलता है — uidai.gov.in / specific service site पर सत्यापित करें।'
