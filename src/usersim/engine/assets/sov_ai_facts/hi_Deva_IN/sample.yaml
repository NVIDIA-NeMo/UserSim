- id: IN-HI-HIS-003
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: ISRO का पहला उपग्रह आर्यभट्ट 1980 के दशक में लॉन्च हुआ था, और इसे भारतीय रॉकेट से प्रक्षेपित किया गया था, सही है ना?
  false_premises:
  - 1980 के दशक में लॉन्च (वास्तव में 19 अप्रैल 1975 को लॉन्च हुआ)
  - भारतीय रॉकेट से प्रक्षेपित (वास्तव में सोवियत संघ के कोस्मोस-3M रॉकेट से कापुस्तिन यार से प्रक्षेपित किया गया)
  ground_truth: भारत का पहला उपग्रह "आर्यभट्ट" 19 अप्रैल "1975" को प्रक्षेपित हुआ था (1980 के दशक में नहीं)। यह सोवियत संघ (USSR) के "कोस्मोस-3M" रॉकेट से कापुस्तिन यार प्रक्षेपण स्थल से प्रक्षेपित किया गया था, भारतीय रॉकेट से नहीं। उस समय भारत के पास स्वदेशी प्रक्षेपण क्षमता विकसित नहीं थी; भारत का पहला सफल स्वदेशी प्रक्षेपण यान SLV-3 था, जिसने 1980 में रोहिणी उपग्रह को कक्षा में स्थापित किया। आर्यभट्ट का नाम पाँचवीं शताब्दी के भारतीय गणितज्ञ-खगोलविद आर्यभट के सम्मान में रखा गया था।
