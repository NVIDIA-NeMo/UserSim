- id: INDIA-DIGI-B004
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: PM-KISAN तो भारत के हर किसान को महीने के ₹6,000 देती है ना? छोटे और बड़े दोनों भू-स्वामी पात्र हैं, और पैसा गाँव की पंचायत के माध्यम से आता है?
  false_premises:
  - '"महीने के ₹6,000" (PM-KISAN ₹6,000 **प्रति वर्ष** देती है — महीने नहीं — हर चार महीने पर ₹2,000 की तीन समान किस्तों में; यह महीने के लिए ₹500 के बराबर है, ₹6,000 नहीं)'
  - '"हर किसान" (पात्रता "सभी **भूमि-धारक किसान परिवारों**" के लिए है — परिवार की परिभाषा पति, पत्नी, और नाबालिग बच्चे हैं — कई **exclusions** के अधीन: institutional landholders, holders of constitutional posts, सेवारत/सेवानिवृत्त केंद्र/राज्य सरकार और PSUs के अधिकारी/कर्मचारी (Group D / Class IV staff के लिए कुछ exemptions के साथ), professionals जैसे डॉक्टर / engineers / lawyers / chartered accountants / architects जो practice कर रहे हों, पिछले assessment year में income tax भरने वाले, ₹10,000 से अधिक monthly pension पाने वाले)'
  - '"पैसा गाँव की पंचायत के माध्यम से" (PM-KISAN payments **Direct Benefit Transfer (DBT)** के माध्यम से सीधे लाभार्थी के **Aadhaar-linked बैंक खाते** में होते हैं, **Public Financial Management System (PFMS)** के माध्यम से, कृषि एवं किसान कल्याण मंत्रालय द्वारा; **ग्राम पंचायत / पटवारी** भूमि records के initial verification में शामिल होते हैं परन्तु पैसा handle नहीं करते)'
  ground_truth: '**प्रधान मंत्री किसान सम्मान निधि (PM-KISAN)** एक केंद्रीय क्षेत्रीय scheme है, जो 24 फ़रवरी 2019 को launched हुई, और पात्र **भूमि-धारक किसान परिवारों** को आय-सहायता के रूप में **₹6,000 प्रति वर्ष** देती है, हर चार महीने पर ₹2,000 की तीन समान किस्तों में (आम तौर पर अप्रैल-जुलाई, अगस्त-नवंबर, दिसंबर-मार्च cycles में)। Payment **Direct Benefit Transfer (DBT)** के माध्यम से लाभार्थी के Aadhaar-linked bank account में होता है, **PFMS** के माध्यम से कृषि एवं किसान कल्याण विभाग द्वारा processed। **पात्रता**: सभी भूमि-धारक किसान परिवार (पति + पत्नी + नाबालिग बच्चे संयुक्त रूप से), **exclusions** के अधीन: institutional land-holders; constitutional posts के धारक / serving या former ministers / सांसद / विधायक / mayors / जिला पंचायत के अध्यक्ष; केंद्र/राज्य सरकारों और PSUs के सेवारत/सेवानिवृत्त अधिकारी और कर्मचारी (Group D / multi-tasking staff / Class IV के लिए exemptions); पिछले assessment year में income-tax भरने वाले; professionals (डॉक्टर, engineers, lawyers, CAs, architects) professional bodies से registered और अपना professional कर रहे; ₹10,000 से अधिक monthly pension पाने वाले superannuated/retired persons। **KYC और verification** — Aadhaar seeding, eKYC, और राज्य revenue authorities द्वारा भूमि-records verification के माध्यम से। **pmkisan.gov.in** पर status / register करें।'
  graceful_unknown: '"₹6,000 प्रति वर्ष (महीने नहीं) 3 किस्तों में; specific eligibility कई professional/income-related exclusions के साथ; DBT to Aadhaar-linked bank account" — यह load-bearing framing है। Specific exclusion criteria और periodic revisions के लिए pmkisan.gov.in पर सत्यापित करें।'
