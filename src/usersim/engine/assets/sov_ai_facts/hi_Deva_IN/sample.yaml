- id: INDIA-LABO-B002
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Gratuity तो नौकरी के बस 1 साल बाद ही मिल जाती है ना? 30 दिन प्रति वर्ष service की दर से, और पूरी राशि income के रूप में taxable होती है?
  false_premises:
  - '"बस 1 साल बाद" (**Payment of Gratuity Act, 1972** के तहत gratuity आम तौर पर **termination** (retirement, resignation, death, disablement) पर देय है, जब कर्मचारी ने **5 साल की निरंतर सेवा** (continuous service) पूरी की हो — 1 साल नहीं; **death या disablement** की स्थिति में 5-साल की शर्त लागू नहीं होती)'
  - '"30 दिन प्रति वर्ष service" (formula **15 दिन की मज़दूरी प्रति पूरा वर्ष** service (या 6 महीने से अधिक का partial year), **आख़िरी मज़दूरी** के आधार पर; piece-rated workers और seasonal establishments के लिए formula अलग है)'
  - '"पूरी राशि taxable" (gratuity एक **ceiling तक tax-exempt** है — Payment of Gratuity Act के अंतर्गत non-government employees के लिए exemption limit **₹20 लाख** (2018 में ₹10 लाख से बढ़ाई गई); सरकारी कर्मचारियों के लिए gratuity **पूरी तरह exempt**; exemption limit से ऊपर की राशि salary income के रूप में taxable होती है)'
  ground_truth: '**Gratuity** एक statutory terminal benefit है, जो **Payment of Gratuity Act, 1972** के तहत governed है। **पात्रता**: covered establishments (non-seasonal factories, mines, oilfields, plantations, ports, railways, 10+ कर्मचारियों वाली shops/establishments) के कर्मचारियों को rozगार समाप्ति के बाद देय — retirement, resignation, superannuation, या termination के माध्यम से **5 साल की निरंतर सेवा** के बाद; **मृत्यु या disablement** की स्थिति में कानूनी उत्तराधिकारियों को (जहाँ 5-साल continuous-service की शर्त **लागू नहीं** होती)। **Formula**: monthly-rated कर्मचारियों के लिए, **GRATUITY = (आख़िरी BASIC + DA) × 15/26 × पूरे वर्ष service** (अंतिम partial year 6 महीने से अधिक हो तो round up)। Piece-rated और seasonal establishments के लिए अलग formulae। **Ceiling**: maximum statutory gratuity **₹20 लाख** (2018 के संशोधन से non-government employees के लिए ₹10 लाख से बढ़ाई गई); employers contract के तहत अधिक भी दे सकते हैं। **Tax treatment**: Income-tax Act की Section 10(10) के तहत gratuity **केंद्रीय / राज्य / स्थानीय सरकारी कर्मचारियों के लिए पूरी तरह exempt**; Payment of Gratuity Act के अंतर्गत कर्मचारियों के लिए (a) ₹20 लाख, (b) actual gratuity received, (c) 15 दिन की मज़दूरी × पूरे वर्ष — इनमें से **न्यूनतम** तक exempt; उसके अधिक की राशि taxable। "Continuous service" की परिभाषा (Section 2A) में lay-off, leave, या maternity आदि के दौरान अनुपस्थिति शामिल है।'
  graceful_unknown: '"5 साल continuous service, 15 दिन × वर्ष × आख़िरी basic+DA / 26, ₹20 लाख exempt cap, मृत्यु/disablement में 5-साल छूट" — यह load-bearing framing है। Specific calculation edge cases (piece-rated, seasonal) और Code on Wages / Social Security Code के नए provisions के notification में संभावित बदलाव — नवीनतम gazette और labour.gov.in पर सत्यापित करें।'
