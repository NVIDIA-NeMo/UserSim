  - '"वही 10+2 ढाँचा" (NEP 2020 स्पष्ट रूप से 10+2 ढाँचे को **प्रतिस्थापित करती है** — अब **5+3+3+4 (Foundational + Preparatory + Middle + Secondary)** curricular framework, 3-18 आयु को कवर करता है; pre-school अब औपचारिक रूप से school structure के अंदर है)'
  - '"केंद्रीय स्तर पर सिर्फ़ अंग्रेज़ी" (NEP 2020 **तीन-भाषा फ़ॉर्मूला** को promote करती है, जिसमें मातृभाषा / क्षेत्रीय भाषा कम से कम Class 5 तक medium of instruction के रूप में, जहाँ संभव हो वहाँ Class 8 तक; अंग्रेज़ी तीन भाषाओं में से एक है, central-level default नहीं)'
  - '"रातोंरात कानून बन गई" (NEP 2020 एक **policy** है, कानून/Act नहीं; कानूनी implementation के लिए मौजूदा कानूनों (जैसे RTE) में संशोधन, राज्यों की स्वीकृति, और क्रमिक rollout आवश्यक हैं — कई प्रावधान अभी भी PM-SHRI, NIPUN Bharat (foundational literacy), और 4-year UG / multidisciplinary higher-ed structures के नियमों के माध्यम से लागू हो रहे हैं)'
  ground_truth: '**National Education Policy 2020 (NEP 2020)** को 29 जुलाई 2020 को संघ कैबिनेट ने अनुमोदित किया और यह स्वतंत्र भारत की **तीसरी** राष्ट्रीय शिक्षा नीति है, जो NEP 1968 और NEP 1986 (1992 में संशोधित) को प्रतिस्थापित करती है। यह एक **policy document** है — कानून नहीं — और Centrally Sponsored Schemes, regulatory परिवर्तन, राज्य-स्तरीय स्वीकृति, और मौजूदा कानूनों (RTE Act, UGC Act, AICTE Act) में संशोधनों के माध्यम से लागू होती है। मुख्य परिवर्तन — (1) **नया CURRICULAR ढाँचा**: 5+3+3+4 (Foundational stage 3-8 yrs / Preparatory 8-11 / Middle 11-14 / Secondary 14-18) 10+2 ढाँचे को बदलता है, pre-school (3-5 yrs) को औपचारिक रूप से school system में लाता है। (2) **MEDIUM OF INSTRUCTION**: मातृभाषा / क्षेत्रीय भाषा कम से कम Class 5 तक medium, संभव हो तो Class 8 तक; **तीन-भाषा फ़ॉर्मूला** अधिक flexibility के साथ बनाए रखा गया, और किसी राज्य पर कोई भाषा नहीं थोपी जाएगी। (3) **Foundational Literacy and Numeracy (FLN)** को Class 3 तक — NIPUN Bharat mission के तहत। (4) **HIGHER EDUCATION**: multidisciplinary **4-वर्षीय undergraduate programme** multiple exit options के साथ (1-yr Certificate, 2-yr Diploma, 3-yr Bachelor, 4-yr Bachelor with Research); Academic Bank of Credits (ABC); प्रस्तावित **Higher Education Commission of India (HECI)** UGC, AICTE, NCTE को बदलने के लिए (legislation अभी लंबित)। (5) Higher ed में 50% GER का target 2035 तक। (6) Common University Entrance Test — **CUET** — central universities के लिए। Implementation timeline बहु-वर्षीय है और राज्य-दर-राज्य अलग है; current rollout status शिक्षा मंत्रालय की site पर देखें।'
  graceful_unknown: '"NEP 2020 स्वतंत्रता के बाद की तीसरी, 10+2 को 5+3+3+4 से बदला, मातृभाषा-medium कम से कम Class 5 तक, HECI प्रस्तावित — कानून नहीं" — यह load-bearing framing है। HECI / CUET / 4-year UG rollout का वर्तमान implementation status साल-दर-साल बदलता है — शिक्षा मंत्रालय और UGC की websites canonical sources हैं।'
