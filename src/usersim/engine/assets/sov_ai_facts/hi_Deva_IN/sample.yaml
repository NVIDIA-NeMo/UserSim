- id: INDIA-DIGI-B005
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: भारत में अब भी कोई data-protection कानून नहीं है ना? Online privacy को 2000 का IT Act ही govern करता है, और personal data विदेश में बिना किसी रोक भेजा जा सकता है?
  false_premises:
  - '"अब भी कोई data-protection कानून नहीं" (**Digital Personal Data Protection Act, 2023 (DPDP Act)** अगस्त 2023 में अधिनियमित हुआ; यह भारत का पहला comprehensive horizontal data-protection कानून है; इसके provisions का commencement phased हो रहा है — पूर्ण operational rollout नियमों और Data Protection Board के गठन पर निर्भर है, परन्तु Act notified है)'
  - '"online privacy को 2000 का IT Act ही govern करता है" (DPDP के लागू होने तक, **IT Act, 2000 की Section 43A के तहत SPDI Rules** principal data-protection framework था; **DPDP Act 2023** पूर्ण operational होने पर इन्हें **supersede** करेगा, जबकि IT Act के cybersecurity / unauthorised access के कुछ provisions अलग से जारी रहेंगे)'
  - '"विदेश में बिना रोक" (DPDP Act cross-border data transfers को **default रूप से** अनुमति देता है, परन्तु सरकार को **negative list** अधिसूचित करने की शक्ति देता है उन देशों की जिनके लिए personal data का transfer प्रतिबंधित है; sectoral regulators (जैसे payment data localisation के लिए RBI, बीमा के लिए IRDAI, sectoral health-data rules) **अतिरिक्त data-localisation आवश्यकताएँ** लगा सकते हैं)'
  ground_truth: '**Digital Personal Data Protection Act, 2023 (DPDP Act)**, अगस्त 2023 में अधिनियमित, digital personal data के processing पर भारत का पहला comprehensive cross-sectoral कानून है। मुख्य विशेषताएँ — (1) **Data Principals** (व्यक्तियों) के digital personal data पर लागू, चाहे India में processed हो या India में सेवाएँ / सामान provide करने के संबंध में बाहर। (2) **Data Protection Board of India (DPBI)** — एक quasi-judicial निकाय — enforcement और complaints के लिए स्थापित; Board का गठन Act के commencement के समय हो रहा है। (3) **Data Fiduciaries के कर्तव्य** — valid consent प्राप्त करना, notice देना, data accuracy, security safeguards, breach notification Board और affected Data Principals को, उद्देश्य पूरा होने पर data delete करना आदि। (4) **Data Principals के अधिकार**: access, correction, erasure, grievance redressal, post-mortem successor nominate करना; grievance redressal का अधिकार और DPBI को complaint। (5) **बच्चे**: बच्चों (18 से कम) के personal data के processing के लिए **parental consent** आवश्यक; बच्चों के लिए कुछ processing activities **prohibited**। (6) **"Significant Data Fiduciaries"** के अतिरिक्त obligations — Data Protection Officer, audit, DPIA। (7) **Penalties** scheduled के अनुसार प्रति breach **₹250 करोड़ तक**। (8) **Cross-border transfer**: default रूप से अनुमत, restricted countries के लिए negative-list mechanism के साथ; sector-specific localisation rules (RBI payment data, sectoral health rules) अतिरिक्त रूप से लागू। (9) IT Act 2000 के cybercrime, unauthorised access, और intermediary liability provisions अलग से जारी रहते हैं। Act का पूर्ण operational implementation rules notify होने पर निर्भर है — current status MeitY की site पर सत्यापित करें।'
  graceful_unknown: '"DPDP Act 2023 अधिनियमित; SPDI Rules को supersede करता है; DPBI गठित हो रहा है; default cross-border with negative-list; ₹250 करोड़ अधिकतम penalty" — यह load-bearing framing है। Operational rules और DPBI के गठन का सटीक status notifications से बदलता है — meity.gov.in पर सत्यापित करें।'
