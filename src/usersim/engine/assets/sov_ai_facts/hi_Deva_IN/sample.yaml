- id: INDIA-LABO-B001
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: PF का मतलब बस employer हर महीने 12% डालता है ना? भारत की हर नौकरी पर लागू, और कभी भी पूरी राशि निकाल सकते हैं?
  false_premises:
  - '"बस employer 12% डालता है" (EPF (Employees'' Provident Fund) एक **contributory** scheme है — **employer और employee दोनों** basic + DA का 12% contribute करते हैं; employer का 12% बँटा होता है — 8.33% **EPS (Employees'' Pension Scheme)** में wage ceiling तक, बाक़ी EPF में, साथ में 0.5% EDLI को; employee का पूरा 12% EPF में जाता है)'
  - '"हर नौकरी पर लागू" (EPF केवल **EPF & MP Act, 1952** के अधीन **covered establishments** पर लागू है — आम तौर पर scheduled industries में 20+ कर्मचारियों वाले; उससे कम पर employer voluntarily register कर सकते हैं; बहुत छोटे establishments और कई informal-sector workers बाहर हैं; covered establishment के भीतर भी कर्मचारी के लिए EPF mandatory केवल basic+DA wage **₹15,000/माह तक**, और उससे ऊपर voluntary)'
  - '"कभी भी पूरी राशि निकाल सकते हैं" (EPF withdrawals **restricted** हैं — आम तौर पर full withdrawal केवल retirement (आयु 58) पर या नौकरी छोड़ने के बाद 2 महीने unemployment पर अनुमत है; partial withdrawals specific notified कारणों के लिए (medical emergencies, marriage, education, home purchase / construction, COVID-era special advances आदि) conditions के साथ; mid-employment full withdrawal active employment के दौरान अनुमत नहीं)'
  ground_truth: '**Employees'' Provident Fund (EPF)**, श्रम और रोज़गार मंत्रालय के अधीन **Employees'' Provident Fund Organisation (EPFO)** द्वारा संचालित, संगठित-क्षेत्र के श्रमिकों के लिए एक **contributory** retirement-savings और social-security scheme है। **Coverage** — scheduled industries में 20+ कर्मचारियों वाले establishments **EPF & MP Act, 1952** के तहत mandatorily covered हैं; उससे कम पर employer voluntarily register कर सकते हैं। Covered establishment के भीतर, EPF कर्मचारी के लिए तभी mandatory है जब monthly basic + DA ₹15,000 तक हो; उससे ऊपर voluntary / employer के विवेक पर। **Contributions** — **EMPLOYEE: 12%** of basic + DA (पूरा EPF में); **EMPLOYER: 12%** of basic + DA (8.33% EPS को ₹15,000 wage तक और 3.67% EPF को; साथ में 0.5% EDLI insurance और एक छोटा admin charge)। **Withdrawals** — आम तौर पर full withdrawal आयु 58 पर, विदेश में स्थायी निवास पर, या नौकरी छोड़ने के बाद 2 महीने लगातार unemployment पर अनुमत है; specific कारणों (medical, स्वयं या परिवार के सदस्य का marriage / education, home purchase / construction / repair, retirement preparation) के लिए partial withdrawal EPF Scheme के Para 68B-68NN की conditions के तहत। Interest rate Central Board of Trustees सालाना तय करती है और सरकार अधिसूचित करती है। **UAN (Universal Account Number)** और EPFO portal (epfindia.gov.in / unifiedportal-mem.epfindia.gov.in) से balance, KYC, transfer, और claims online accessible हैं।'
  graceful_unknown: '"EPF contributory है (employee 12% + employer 12%, EPS split के साथ), 20-कर्मचारी threshold compulsory coverage के लिए, ₹15,000 wage ceiling mandatoriness के लिए, restricted withdrawals" — यह load-bearing framing है। Specific withdrawal categories, current interest rate, और EPS नियम EPFO circulars से बदलते हैं — epfindia.gov.in पर सत्यापित करें।'
