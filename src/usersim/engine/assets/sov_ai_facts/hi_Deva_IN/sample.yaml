- id: INDIA-FINA-B002
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Section 80C से हर investment पर ₹1.5 लाख का deduction मिलता है ना? PPF, ELSS, life insurance — मतलब कुल ₹4.5 लाख। और यह old और new tax regimes दोनों में काम करता है?
  false_premises:
  - '"हर investment पर ₹1.5 लाख" (Section 80C सभी eligible investments को मिलाकर **consolidated cap ₹1.5 लाख** देता है — PPF + ELSS + LIC + EPF + सुकन्या समृद्धि + 5-year tax-saving FD + NSC + home-loan principal + tuition fees + और अन्य — प्रति item ₹1.5 लाख नहीं)'
  - '"PPF + ELSS + Life Insurance = ₹4.5 लाख" (cap ₹1.5 लाख combined है; 80C-eligible instruments में ₹1.5 लाख से अधिक का deposit interest तो कमाएगा परन्तु अतिरिक्त deduction नहीं — वे प्रभावी रूप से after-tax investments हैं)'
  - '"old और new दोनों regimes में काम करता है" (Section 80C deductions, अधिकांश Chapter VI-A deductions की तरह, **new default tax regime (Section 115BAC)** में **largely unavailable** हैं, जो पुराने deductions को कम slab rates के बदले में trade करता है; new regime में सिर्फ़ specific exemptions जैसे standard deduction (FY24-25 से ₹75,000) और 80CCD(2) के तहत employer NPS contribution survive करते हैं)'
  ground_truth: '**Section 80C** of the Income-tax Act, 1961 सभी eligible investments और expenses को मिलाकर प्रति financial year **consolidated deduction cap ₹1,50,000** देता है — **per item नहीं**। Eligible items: PPF, EPF (employee contribution), ELSS mutual funds, life-insurance premiums, NSC, 5-year tax-saving bank FDs, Senior Citizens'' Savings Scheme, सुकन्या समृद्धि Account, Post Office Time Deposit (5-year), home-loan **principal** repayment, घर की ख़रीद पर stamp duty / registration, 2 बच्चों तक की tuition fees। **Section 80CCD(1)** (स्वयं का NPS contribution) इस ₹1.5 लाख aggregate cap के भीतर बैठता है; **Section 80CCD(1B)** Tier-I NPS योगदान के लिए 80C से ऊपर **अतिरिक्त ₹50,000** की deduction देता है; **Section 80CCD(2)** (employer NPS contribution) 80C के ऊपर है। FY 2023-24 से **new (default) tax regime (Section 115BAC)** अधिकांश Chapter VI-A deductions (80C, 80D, HRA, LTA सहित) को कम slab rates के बदले में trade करता है; **new regime में standard deduction (FY24-25 से ₹75,000), 80CCD(2) employer NPS, और कुछ specific items survive करते हैं**। Taxpayers हर साल non-business income के लिए new regime से **opt out** कर पुराने regime में जा सकते हैं; एक बार opt कर देने पर business-income filers को switching पर पाबंदियाँ हैं। Current slabs, deduction rules, और standard deduction incometax.gov.in पर सत्यापित करें।'
  graceful_unknown: '"consolidated ₹1.5 लाख 80C cap (per-item नहीं); 80CCD(1B) NPS के लिए अतिरिक्त ₹50k; new regime में 80C नहीं" — यह load-bearing framing है। Specific slabs और ₹75,000 standard deduction figure successive Finance Acts से बदलते हैं — incometax.gov.in पर सत्यापित करें।'
