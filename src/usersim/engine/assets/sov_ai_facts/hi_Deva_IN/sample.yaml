  question: Senior Citizens' Savings Scheme की limit अब भी ₹15 लाख ही है ना? 50 साल से ऊपर का कोई भी open कर सकता है, और interest income tax से अपने-आप कट जाता है?
  false_premises:
  - '"limit अब भी ₹15 लाख" (SCSS की maximum-deposit ceiling **Budget 2023** में ₹15 लाख से **दोगुना ₹30 लाख** की गई, 1 अप्रैल 2023 से प्रभावी; एक व्यक्ति के सभी SCSS accounts मिलाकर वर्तमान cap **₹30 लाख** है)'
  - '"50 साल से ऊपर का कोई भी" (SCSS पात्रता — **60 साल या उससे अधिक** के व्यक्ति; या 55+ परन्तु 60 से कम जो superannuation / VRS के तहत retired हुए हों और retirement के 1 महीने के भीतर account खोला हो; या **50+ retired defence services** कर्मचारी retirement के 1 महीने के भीतर; सामान्य 50 साल के व्यक्तियों के लिए open नहीं)'
  - '"interest income tax से अपने-आप कट जाता है" (SCSS से interest **पूरी तरह taxable** है, slab rate पर "income from other sources" के रूप में; threshold से अधिक होने पर bank/post office **TDS at 10%** काटता है (वरिष्ठ नागरिकों के लिए वर्तमान threshold Section 194A के तहत ₹50,000); **deposit (interest नहीं)** Section 80C deduction के लिए ₹1.5 लाख तक qualify करती है)'
  ground_truth: '**Senior Citizens'' Savings Scheme (SCSS)**, Government Savings Promotion Act, 2018 के तहत banks और post offices के माध्यम से operate, वरिष्ठ नागरिकों के लिए सरकार-समर्थित savings scheme है। **मुख्य विशेषताएँ** — (1) **पात्रता**: **60 या उससे अधिक** आयु; या superannuation / VRS / Special VRS के तहत retired 55-59 (retirement के 1 महीने के भीतर); या **50 या उससे अधिक defence services retired** (retirement के 1 महीने के भीतर)। (2) **Maximum deposit**: एक व्यक्ति के सभी SCSS accounts मिलाकर **₹30 लाख** (1 अप्रैल 2023 से प्रभावी, ₹15 लाख से बढ़ाई गई)। Joint account केवल जीवनसाथी के साथ अनुमत। (3) Minimum ₹1,000; ₹1,000 के multiples में deposits। (4) **Tenure**: **5 साल**, **3 साल अतिरिक्त** extendable (maturity के 1 साल के भीतर एक-बार extension)। (5) **Interest**: दर तिमाही आधार पर सरकार तय और notified करती है; depositor के linked savings account में तिमाही paid। (6) **Tax treatment**: deposit Section 80C deduction के लिए ₹1.5 लाख aggregate cap के भीतर qualify करती है; **interest पूरी तरह taxable** है "income from other sources" के रूप में, Section 194A threshold से अधिक होने पर institution द्वारा TDS (वर्तमान वरिष्ठ नागरिकों के लिए ₹50,000); seniors **Form 15H** submit कर सकते हैं nil TDS के लिए यदि कुल taxable income basic-exemption limit से नीचे हो। (7) **Premature withdrawal** 1 साल के बाद penalty के साथ अनुमत (1-2 vs 2-5 साल के बीच विभिन्न notified penalty percentages)। वर्तमान तिमाही interest rate **National Savings Institute / Department of Posts / participating bank** पर सत्यापित करें।'
  graceful_unknown: '"₹30 लाख cap (Budget 2023 में ₹15 लाख से बढ़ी), 60+ पात्रता (retirement / defence carve-outs के साथ 55+/50+), interest taxable + TDS, 80C deposit पर" — यह load-bearing framing है। तिमाही interest rate notifications से बदलती है।'
