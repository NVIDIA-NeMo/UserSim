- id: INDIA-EDUC-B004
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: मेरे पोते के विदेश में MBBS के लिए केंद्र सरकार पूरा interest course-end तक देगी ना? ₹50 लाख तक, किसी भी देश के लिए, और UPSC ही loan handle करती है?
  false_premises:
  - '"केंद्र सरकार पूरा interest course-end तक देगी" (**Central Sector Interest Subsidy Scheme (CSIS)** education loans पर interest subsidy सिर्फ़ **भारत में** पढ़ाई के लिए moratorium period (course duration + 1 साल या job के 6 महीने बाद, जो पहले हो) के दौरान देती है — और केवल उन छात्रों के लिए जिनके परिवार की वार्षिक आय **₹4.5 लाख तक** हो और जो **notified institutions** में पढ़ाई कर रहे हों; **विदेश की पढ़ाई CSIS में cover नहीं है**)'
  - '"₹50 लाख, किसी भी देश के लिए" (**Vidya Lakshmi एक portal है, loan नहीं** — actual loans **individual banks** RBI guidelines / **Indian Banks'' Association (IBA) Model Education Loan Scheme** के तहत देते हैं; आम तौर पर bank limits भारत में पढ़ाई के लिए ₹10-20 लाख और विदेश के लिए ₹20-30 लाख, बिना collateral; उच्च राशि पर collateral; कोई एक flat ₹50-लाख ceiling नहीं)'
  - '"UPSC handle करती है" (UPSC **Union Public Service Commission** है — यह civil services परीक्षा conduct करती है, loan administration नहीं; education loans **scheduled banks** देते हैं; **Vidya Lakshmi portal (vidyalakshmi.co.in)**, 2015 में launched, multiple banks में education loans के लिए apply करने का एकल online platform है — **Department of Financial Services / NSDL e-Governance** द्वारा संचालित; CSIS के subsidy claims **Canara Bank** nodal bank के रूप में manage करती है)'
  ground_truth: 'भारतीय education loans की संरचना — (1) **Loans** scheduled commercial banks देते हैं **Indian Banks'' Association (IBA) Model Education Loan Scheme** के broad framework के तहत, bank-specific variations के साथ। आम limits: भारत में पढ़ाई के लिए लगभग ₹10 लाख तक (₹4 लाख तक कोई collateral नहीं, ₹4-7.5 लाख में third-party guarantee, ₹7.5 लाख से ऊपर collateral); विदेश की पढ़ाई के लिए ₹20-30 लाख तक (₹7.5 लाख से ऊपर collateralised)। Specific banks (और PSU bank schemes) इससे अधिक भी जा सकते हैं। (2) **Vidya Lakshmi Portal (vidyalakshmi.co.in)** — एकल online application portal, 2015 में Department of Financial Services / NSDL e-Governance द्वारा launched; छात्र एक form से कई banks में apply कर सकते हैं; applications और disbursal का tracking। (3) **Central Sector Interest Subsidy Scheme (CSIS)** — moratorium period (course + 1 साल, या job के 6 महीने बाद, जो पहले हो) के दौरान **पूरा interest subsidy**, उन छात्रों के लिए जिनके परिवार की वार्षिक आय **₹4.5 लाख तक** हो और जो **notified institutions में भारत में** पढ़ाई कर रहे हों (विदेश की पढ़ाई CSIS में cover नहीं); Canara Bank nodal bank। (4) **Padho Pardesh** (अल्पसंख्यकों के विदेश में पढ़ाई के लिए interest subsidy) 2022 में बंद कर दी गई। (5) कुछ राज्य सरकारें केंद्रीय subsidy के ऊपर top up करती हैं। UPSC असंबंधित है — यह civil services के लिए केंद्रीय भर्ती निकाय है।'
  graceful_unknown: '"Vidya Lakshmi portal है, loan नहीं; banks loans देते हैं; CSIS interest subsidy केवल भारत की पढ़ाई पर लागू है, विदेश पर नहीं; UPSC की कोई भूमिका नहीं" — यह load-bearing framing है। Specific limits (₹10 लाख / ₹20 लाख / आदि) और CSIS आय-सीमाएँ बदलती रहती हैं — vidyalakshmi.co.in और Department of Financial Services schemes page पर सत्यापित करें।'
