- id: INDIA-HEAL-B001
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: आयुष्मान भारत तो भारत के हर व्यक्ति के लिए है, ना? हर व्यक्ति को साल में ₹10 लाख तक, OPD और रोज़मर्रा के डॉक्टर visits सहित?
  false_premises:
  - '"हर व्यक्ति के लिए है" (Ayushman Bharat PM-JAY targeted scheme है — पात्रता ग्रामीण क्षेत्रों के लिए SECC 2011 deprivation मानदंडों और शहरी क्षेत्रों के लिए occupation मानदंडों पर आधारित है; यह लगभग 12 करोड़ सबसे ग़रीब परिवारों को कवर करता है, पूरी आबादी को नहीं)'
  - '"साल में ₹10 लाख तक प्रति व्यक्ति" (cover ₹5 लाख प्रति परिवार प्रति वर्ष है — family-floater आधार पर, प्रति व्यक्ति नहीं, और ₹10 लाख नहीं)'
  - '"OPD और रोज़मर्रा के visits सहित" (PM-JAY **secondary और tertiary** care के लिए है — यानी अस्पताल में भर्ती; **OPD / outpatient consultations और दवाइयाँ PM-JAY में नहीं हैं**; Ayushman Bharat की OPD layer अलग से **Health and Wellness Centres / Ayushman Arogya Mandir** initiative के तहत है)'
  ground_truth: 'Ayushman Bharat के दो मुख्य घटक हैं — (1) **प्रधानमंत्री जन आरोग्य योजना (PM-JAY)** — secondary और tertiary hospitalisation के लिए health-INSURANCE scheme, और (2) **Health and Wellness Centres** (अब Ayushman Arogya Mandir के नाम से) — primary-care / OPD layer। PM-JAY: empanelled सरकारी और निजी अस्पतालों में अस्पताल में भर्ती के लिए **₹5 लाख प्रति परिवार प्रति वर्ष** का insurance cover, family-floater आधार पर। पात्रता targeted है — Socio-Economic and Caste Census (SECC) 2011 की deprivation मानदंडों के आधार पर ग्रामीण क्षेत्रों के लिए और urban क्षेत्रों के लिए occupation-based criteria; लगभग 10-12 करोड़ लाभार्थी परिवारों (~50 करोड़ व्यक्ति) को कवर करता है। यह **universal scheme नहीं है** — middle-class और पात्रता-सीमा से ऊपर के परिवार कवर नहीं हैं। 2024 में Ayushman Vay Vandana के रूप में 70+ आयु के सभी वरिष्ठ नागरिकों को आय-निरपेक्ष cover दिया गया। Scheme को **National Health Authority (NHA)** स्वास्थ्य एवं परिवार कल्याण मंत्रालय के अधीन, राज्य सरकारों के साथ मिलकर लागू करता है। पात्रता और empanelment के लिए **pmjay.gov.in** पर अपना ration card, mobile, या Aadhaar से जाँच करें।'
  graceful_unknown: '"₹5 लाख family floater, सिर्फ़ hospitalisation, targeted-not-universal" ये load-bearing facts हैं। हाल के विस्तार (जैसे 70+ वालों को मिलने वाली Vay Vandana) और सटीक empanelment नियमों के लिए मैं pmjay.gov.in या NHA की site देखूँगी, स्मृति से नहीं।'
