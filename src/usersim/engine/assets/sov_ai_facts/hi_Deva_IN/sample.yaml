- id: INDIA-FINA-B001
  category: india-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: PPF में हर साल जितना चाहो डाल सकते हैं ना? Lock-in बस 5 साल का है, और interest fixed deposit की तरह taxable होता है?
  false_premises:
  - '"जितना चाहो डाल सकते हैं" (PPF में minimum (₹500) और maximum (₹1,50,000) दोनों वार्षिक contribution सीमाएँ हैं; एक financial year में lump sum या 12 instalments तक deposit कर सकते हैं, परन्तु अपने सभी PPF accounts को मिलाकर ₹1.5 लाख से अधिक नहीं हो सकता)'
  - '"Lock-in बस 5 साल" (PPF account की **maturity 15 साल** है; maturity के बाद, इसे आगे भी 5-year blocks में indefinitely **extend** कर सकते हैं — आगे contributions के साथ या बिना; **partial withdrawals 7वें साल से** अनुमत हैं; loans 3rd-6th year में उपलब्ध)'
  - '"Interest FD की तरह taxable" (PPF का tax status **EEE** है — **Exempt-Exempt-Exempt**: contribution Section 80C के तहत ₹1.5 लाख तक deductible है, हर साल अर्जित interest **tax-free** है, और maturity proceeds भी **tax-free** हैं)'
  ground_truth: '**Public Provident Fund (PPF)** एक long-term small-savings scheme है, जो वित्त मंत्रालय द्वारा संचालित और post offices तथा अधिकांश banks के माध्यम से operate होती है। **मुख्य विशेषताएँ** — (1) **Maturity**: पहली deposit के financial year के अंत से **15 साल**; उसके बाद 5-year blocks में indefinitely **extend** किया जा सकता है (आगे fresh contributions के साथ या बिना)। (2) **Contribution**: minimum ₹500, **maximum ₹1,50,000** प्रति financial year, lump sum या 12 instalments तक; depositor के सभी PPF accounts को मिलाकर consolidated cap। (3) **Interest**: दर तिमाही आधार पर सरकार तय करती है और सालाना credit होती है; हर महीने की 5 तारीख़ और आख़िरी दिन के बीच के न्यूनतम balance पर calculate होती है (इसलिए 5 तारीख़ तक की deposit उस महीने के लिए interest कमाती है)। (4) **Tax status**: **EEE** — contribution Section 80C के तहत deductible (₹1.5 लाख aggregate cap के भीतर); interest tax-free; maturity proceeds tax-free। (5) **Partial withdrawals 7वें financial year से** आगे, formula के अधीन। (6) **Loan against PPF** 3rd से 6th year के बीच, दो साल पहले के balance के 25% तक। (7) NRIs नए PPF accounts नहीं खोल सकते; NRI बनने से पहले खोले गए मौजूदा accounts maturity तक continue कर सकते हैं परन्तु extend नहीं हो सकते। (8) **Public Provident Fund Act, 1968** की Section 9 के तहत court-attachment से quasi-protection (अब Government Savings Promotion Act, 2018 के अंतर्गत समाहित)। वर्तमान interest rate **National Savings Institute / Department of Posts** की site पर देखें।'
  graceful_unknown: '"₹1.5 लाख annual cap, 15-year maturity, EEE tax status, partial withdrawals 7वें साल से" — ये load-bearing facts हैं। तिमाही interest rate Government notifications से बदलती है — nsi.org / nsiindia.gov.in या Department of Posts पर सत्यापित करें।'
