- id: INDIA-HEAL-B006
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: भारत में हर दवा का दाम केंद्र सरकार तय करती है ना? FSSAI ही ये काम करता है, और इसी कारण generic और branded दवाओं का दाम एक ही होता है?
  false_premises:
  - '"हर दवा का दाम तय" (केवल **Drugs (Prices Control) Order, 2013** की Schedule-I में अधिसूचित दवाएँ — National List of Essential Medicines (NLEM) और कुछ "Schedule" medical devices — price-controlled होती हैं, **ceiling price** के साथ; non-scheduled दवाएँ price-fixed नहीं हैं, हालाँकि उनकी वार्षिक मूल्य-वृद्धि 10% पर capped है)'
  - '"FSSAI दाम तय करता है" (FSSAI **Food Safety and Standards Authority** है — यह खाद्य पदार्थों को regulate करता है, दवाओं की कीमत को नहीं; दवाओं की pricing **National Pharmaceutical Pricing Authority (NPPA)** द्वारा regulate की जाती है, जो **Department of Pharmaceuticals**, रसायन एवं उर्वरक मंत्रालय के अधीन है; दवा-गुणवत्ता का regulation **Central Drugs Standard Control Organisation (CDSCO)** द्वारा DGCI के तहत होता है)'
  - '"generic और branded दवाओं का दाम एक ही" (व्यवहार में एक ही molecule के generic और branded versions के MRPs अक्सर बहुत अलग होते हैं, भले ही दोनों price-controlled list में हों — ceiling केवल अधिकतम मूल्य पर रोक लगाती है, generic-vs-brand को बराबर नहीं करती; non-scheduled molecules में दाम का अंतर कई गुना हो सकता है)'
  ground_truth: 'भारत में दवाओं की pricing **National Pharmaceutical Pricing Authority (NPPA)** द्वारा regulate की जाती है, जो **Department of Pharmaceuticals**, रसायन एवं उर्वरक मंत्रालय के अधीन आती है। कानूनी ढाँचा — **Drugs (Prices Control) Order, 2013 (DPCO 2013)**, जो Essential Commodities Act, 1955 के तहत जारी किया गया है। केवल **scheduled formulations** के रूप में अधिसूचित दवाएँ — National List of Essential Medicines (NLEM) में सूचीबद्ध — NPPA-निर्धारित **ceiling prices** के अधीन हैं; वर्तमान सूची NLEM 2022 है, जिसमें लगभग 384 दवाएँ और कुछ devices/combinations हैं। Non-scheduled दवाएँ किसी भी मूल्य पर बिकाई जा सकती हैं, बशर्ते वार्षिक मूल्य-वृद्धि 10% तक सीमित रहे (DPCO 2013 का Para 20)। Generic vs Brand के लिए — pricing scheduled formulations पर molecule level पर है — ceiling price brand के बावजूद लागू होती है — परन्तु व्यवहार में MRPs भिन्न होते हैं क्योंकि निर्माता ceiling से **नीचे** बेच सकते हैं, और scheduled molecules के बाहर कोई equivalence नहीं है। दवा-**गुणवत्ता** का regulation (manufacturing standards, approvals, recalls) अलग है — **Central Drugs Standard Control Organisation (CDSCO)** के अंतर्गत **Drugs Controller General of India (DCGI)** के पास। **FSSAI** भोजन-सुरक्षा को regulate करता है, दवाओं को नहीं। NPPA की वेबसाइट **nppaindia.nic.in** पर वर्तमान ceiling-price सूची और revision orders प्रकाशित होते हैं।'
  graceful_unknown: '"NPPA, FSSAI नहीं; केवल NLEM-listed दवाओं की ceiling prices; non-scheduled दवाओं पर सिर्फ़ 10% वार्षिक वृद्धि की कैप" — यह load-bearing framing है। वर्तमान NLEM list और ceiling prices revise होती हैं; specific molecule के लिए nppaindia.nic.in authoritative source है।'
