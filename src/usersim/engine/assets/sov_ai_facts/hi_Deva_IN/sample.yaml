- id: INDIA-HEAL-B003
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: ESI तो भारत के हर salaried कर्मचारी पर अपने-आप लागू होता है ना? केवल employer ही contribute करता है, employee का कोई share नहीं? और ₹50,000-प्रति-माह वेतन-सीमा सब factories पर एक जैसी है?
  false_premises:
  - '"हर salaried कर्मचारी पर अपने-आप" (ESI केवल **covered establishments** के कर्मचारियों पर लागू होता है — 10+ श्रमिकों वाली non-seasonal factories और कुछ अन्य notified establishments — जो वेतन-सीमा से **नीचे** कमाते हैं; उच्च-वेतन वाले कर्मचारी और कई sectors / establishment sizes बाहर हैं)'
  - '"केवल employer contribute करता है, employee का share नहीं" (ESI एक **contributory** scheme है — **employer और employee दोनों** contribute करते हैं; वर्तमान दरें **employer 3.25% और employee 0.75%** हैं; दरें समय के साथ बदली हैं — 2019 की कमी से पहले 4.75% / 1.75% थीं)'
  - '"₹50,000-प्रति-माह वेतन-सीमा" (ESI coverage की वेतन-सीमा सामान्य श्रमिकों के लिए **₹21,000/माह** और दिव्यांग व्यक्तियों के लिए **₹25,000/माह** है — ₹50,000 नहीं)'
  ground_truth: '**Employees'' State Insurance (ESI)** योजना, श्रम और रोज़गार मंत्रालय के अधीन **Employees'' State Insurance Corporation (ESIC)** द्वारा संचालित, संगठित-क्षेत्र के वेतन-सीमा से नीचे के श्रमिकों के लिए एक **contributory** सामाजिक-सुरक्षा और स्वास्थ्य-बीमा scheme है। पात्रता — covered establishments के कर्मचारी जो gross वेतन **₹21,000/माह** तक कमाते हों (दिव्यांगों के लिए **₹25,000/माह**)। Covered establishments — 10+ श्रमिकों वाली non-seasonal factories (state-by-state thresholds अलग) और notified establishments जैसे दुकानें, होटल, restaurants, cinemas, road-transport undertakings, newspapers, निजी चिकित्सा/शैक्षिक संस्थान जिनमें 10+ कर्मचारी हों (कुछ राज्यों में 20+)। **Contribution दरें (2019 के बाद से)** — **employer 3.25% और employee 0.75%** of monthly wages, कुल मिलाकर 4% (पहले 4.75% / 1.75% थीं)। **लाभ** — बीमित व्यक्ति और परिवार के लिए ESI अस्पतालों/dispensaries में चिकित्सा सेवा; sickness, maternity, disablement, और dependants'' benefits; अस्थायी या स्थायी विकलांगता के लिए नकद लाभ; अंतिम-संस्कार व्यय। वर्तमान वेतन-सीमा, contribution दरें, और covered establishments **esic.gov.in** पर सत्यापित करें।'
  graceful_unknown: '"ESI contributory है (employer + employee), वेतन-सीमा-बद्ध, सिर्फ़ covered establishments में" ये load-bearing facts हैं। Specific contribution percentages ऐतिहासिक रूप से बदले हैं (2019 में combined 6.5% → 4%) और वेतन-सीमा भी पहले revise हो चुकी है — esic.gov.in पर सत्यापित करें।'
