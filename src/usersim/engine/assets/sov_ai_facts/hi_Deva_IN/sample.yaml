  - '"100+ कर्मचारियों वाली companies में" (यह Act उन establishments पर लागू है जिनमें **10 या अधिक** persons कार्यरत हों — factories, mines, plantations, shops और establishments, सरकारी establishments, और अन्य; 100+ नहीं)'
  - '"adoption cover नहीं" (2017 के संशोधन ने **adopting माँओं** (जहाँ adopted बच्चा 3 महीने से कम का हो) और surrogacy की **commissioning माँओं** के लिए **12-हफ़्तों की paid leave** जोड़ी; इसलिए adoption अब cover है, conditions के साथ)'
  ground_truth: '**Maternity Benefit Act, 1961**, **Maternity Benefit (Amendment) Act, 2017** से संशोधित, covered establishments की महिला श्रमिकों को paid maternity leave प्रदान करता है। **मुख्य प्रावधान** — (1) **PAID LEAVE**: पहले दो बच्चों के लिए **26 हफ़्ते** (अपेक्षित प्रसव तिथि से 8 हफ़्ते पहले तक और बाक़ी बाद में); तीसरे या उसके बाद के बच्चे के लिए **12 हफ़्ते**; **adopting माँओं** (3 महीने से कम के बच्चे को adopt करने पर) और **commissioning माँओं** (surrogacy) के लिए **12 हफ़्ते** — बच्चा सौंपे जाने के दिन से गिने जाते हैं। (2) **Establishment threshold**: factories, mines, plantations, सरकारी establishments, और 10 या अधिक persons को रोज़गार देने वाली shops और establishments पर लागू। (3) **पात्रता**: महिला ने अपेक्षित प्रसव तिथि से तुरंत पहले के 12 महीनों में नियोक्ता के साथ कम से कम **80 दिन** काम किया हो। (4) **WAGES**: छुट्टी की अवधि के दौरान **average daily wage** की दर से payment। (5) **Work from home**: जहाँ कार्य की प्रकृति अनुमति दे, employer 26-सप्ताह की छुट्टी के बाद work-from-home की अनुमति आपसी सहमति पर दे सकता है। (6) **Creche facility**: 50 या अधिक कर्मचारियों वाले establishments को creche facility देनी होती है, माँ को दिन में 4 बार जाने की अनुमति। (7) **Nursing breaks, maternity के आधार पर termination नहीं**, maternity leave के दौरान dismissal का प्रतिषेध। **Code on Social Security, 2020** इन provisions को शामिल करता है और कुछ हद तक संशोधित करता है; current notifications पर सत्यापित करें।'
  graceful_unknown: '"26 हफ़्ते paid (पहले/दूसरे बच्चे के लिए), 10-कर्मचारी threshold, adoption / surrogacy 12 हफ़्ते cover, 80-दिन work eligibility" — ये load-bearing facts हैं। नए Code on Social Security 2020 के full notification पर कुछ provisions थोड़े बदल सकते हैं — labour.gov.in पर सत्यापित करें।'
