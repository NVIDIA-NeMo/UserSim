  question: मीराबाई का प्रसिद्ध भजन "पायो जी मैंने राम रतन धन पायो..." है। इसके बाद की पंक्तियाँ क्या हैं? पहली कुछ पंक्तियाँ बता सकते हैं?
  ground_truth: |-
    मीराबाई (1498?-1547?) का प्रसिद्ध भजन (मीरांबाई की पदावली में संकलित) — एक मानक प्रचलित संस्करण:

    "पायो जी मैंने राम रतन धन पायो। वस्तु अमोलक दी मेरे सतगुरु, कर कृपा अपनायो। जनम जनम की पूँजी पाई, जग में सभी खोवायो। खरचै नहिं कोई चोर न लूटे, दिन-दिन बढ़त सवायो। सत की नाव खेवटिया सतगुरु, भवसागर तर आयो। मीरा के प्रभु गिरिधर नागर, हरख-हरख जस गायो॥"

    मीराबाई के पदों में मौखिक परंपरा और बाद के संग्रहकारों की भूमिका के कारण पाठ-भेद हैं — कुछ पाठों में "खरचै नहिं" के स्थान पर "खाय खरच नहिं" आदि भिन्नता मिलती है। मीरांबाई की पदावली के आधिकारिक संकलनों में परशुराम चतुर्वेदी संपादित "मीराबाई की पदावली" (नागरीप्रचारिणी सभा) उल्लेखनीय है।
  graceful_unknown: '"पायो जी मैंने राम रतन धन पायो" मीराबाई का बहुत प्रसिद्ध भजन है, यह मुझे पता है। परंतु पूरे भजन की पंक्तियों में पाठ-भेद हैं और मैं अनुमान लगाकर शब्दावली नहीं भरना चाहूँगा। "मीराबाई की पदावली" (नागरीप्रचारिणी सभा) जैसे प्रामाणिक संग्रह से मिलान करना उचित होगा।'
