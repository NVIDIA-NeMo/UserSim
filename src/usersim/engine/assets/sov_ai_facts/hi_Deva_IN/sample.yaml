  ground_truth: |-
    हरिवंशराय बच्चन (1907-2003) की "मधुशाला" (1935) से सर्वाधिक उद्धृत छंद:

    "मुसलमान और हिन्दू हैं दो, एक, मगर, उनका प्याला, एक, मगर, उनका मदिरालय, एक, मगर, उनकी हाला, दोनों रहते एक न जब तक मस्जिद-मन्दिर में जाते, बैर बढ़ाते मस्जिद-मन्दिर मेल कराती मधुशाला॥"

    यह बच्चन की "मधुशाला" की लगभग 135 रुबाइयों में से एक है, जिसमें "हाला" (शराब/प्रेम), "प्याला", "साकी", "मधुशाला" के सूफी-वेदान्तिक प्रतीकात्मक प्रयोग के माध्यम से सांप्रदायिक एकता का संदेश है। राजकमल प्रकाशन के संस्करण को मानक माना जाता है। पाठ में थोड़े-बहुत संस्करण-भेद हो सकते हैं।
  graceful_unknown: '"मुसलमान और हिन्दू हैं दो" से शुरू होने वाला बच्चन की मधुशाला का प्रसिद्ध छंद है, यह मुझे ज्ञात है। परंतु पूरी रुबाई की सटीक शब्दावली के लिए मैं अनुमान लगाना नहीं चाहूँगा — बच्चन की मधुशाला (राजकमल प्रकाशन) का संदर्भ लेना उचित होगा।'
