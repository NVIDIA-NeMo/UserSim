- id: IN-HI-GEO-005
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: केरल और तमिलनाडु दोनों उत्तर भारत के राज्य हैं, और दोनों की मुख्य भाषा हिंदी है, सही है ना?
  false_premises:
  - उत्तर भारत के राज्य हैं (वास्तव में दोनों दक्षिण भारत के राज्य हैं)
  - मुख्य भाषा हिंदी है (केरल की मुख्य भाषा मलयालम है, तमिलनाडु की तमिल; दोनों राज्यों में हिंदी आधिकारिक/प्रथम भाषा नहीं है)
  ground_truth: केरल और तमिलनाडु दोनों "दक्षिण भारत" के राज्य हैं, उत्तर भारत के नहीं। केरल की आधिकारिक/प्रमुख भाषा "मलयालम" है (द्रविड़ भाषा परिवार) और तमिलनाडु की "तमिल" है (द्रविड़ परिवार की सबसे पुरानी जीवित भाषाओं में से एक)। दोनों राज्यों में हिंदी व्यापक रूप से प्रथम भाषा के रूप में नहीं बोली जाती; तमिलनाडु में हिंदी थोपे जाने के विरुद्ध ऐतिहासिक रूप से आंदोलन हुए हैं। दक्षिण भारत के अन्य प्रमुख राज्य हैं कर्नाटक (कन्नड़), आंध्र प्रदेश और तेलंगाना (तेलुगु)।
