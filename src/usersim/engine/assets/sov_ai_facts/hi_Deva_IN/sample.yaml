- id: INDIA-LABO-B004
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: NPS तो सिर्फ़ सरकारी कर्मचारियों के लिए है ना? पुरानी पेंशन की तरह — आख़िरी salary पर आधारित guaranteed amount। निजी क्षेत्र वाले join नहीं कर सकते?
  false_premises:
  - '"सिर्फ़ सरकारी कर्मचारियों के लिए" (NPS **केंद्र सरकार** के 1 जनवरी 2004 को या उसके बाद ज्वाइन करने वाले कर्मचारियों के लिए mandatory है (अधिकांश राज्यों ने भी अपने कर्मचारियों के लिए ऐसी ही तिथियाँ अपनाईं), परन्तु यह **18-70 वर्ष आयु के किसी भी भारतीय नागरिक** के लिए voluntarily भी open है — निजी क्षेत्र के कर्मचारी और self-employed सहित; corporate NPS में employer-employee co-contribution की अनुमति है)'
  - '"पुरानी पेंशन की तरह — आख़िरी salary पर guaranteed amount" (NPS एक **defined-contribution** scheme है — retirement पर पेंशन योगदान और चुने गए investment options के बाज़ार returns पर निर्भर है, **कोई निश्चित पेंशन की गारंटी नहीं**; **Old Pension Scheme (OPS)**, जिसे 2004 में नए केंद्र सरकार recruits के लिए NPS ने बदला, एक **defined-benefit** scheme थी जो आख़िरी draw किए गए basic pay के लगभग 50% को मासिक पेंशन के रूप में देती थी; हाल में घोषित **UPS — Unified Pension Scheme** दोनों के बीच में बैठती है)'
  - '"निजी क्षेत्र join नहीं कर सकते" (NPS 18-70 आयु के किसी भी individual के लिए open है — All-Citizen Model Tier I और Tier II accounts; corporates corporate NPS model के तहत भी कर्मचारियों को enroll कर सकते हैं)'
  ground_truth: '**National Pension System (NPS)** **PFRDA Act, 2013** के तहत **Pension Fund Regulatory and Development Authority (PFRDA)** द्वारा संचालित है। यह एक **defined-contribution** पेंशन scheme है — retirement पर corpus और परिणामी annuity योगदान और बाज़ार returns पर निर्भर हैं, **कोई fixed पेंशन की गारंटी नहीं**। **पात्रता**: (a) केंद्र-सरकार के 1 जनवरी 2004 को या उसके बाद ज्वाइन करने वाले कर्मचारियों के लिए **mandatory** (राज्यों ने अलग-अलग तिथियों पर अपनाया), (b) 18-70 आयु के किसी भी भारतीय नागरिक के लिए **All-Citizen Model** के तहत **voluntary**, (c) निजी क्षेत्र के कर्मचारियों के लिए employer co-contribution के साथ **corporate NPS**। **Accounts**: **Tier I** — primary retirement account, contributions retirement (60) तक locked, specified उद्देश्यों के लिए partial withdrawals; **Tier II** — voluntary, कभी भी withdrawable। **Age 60 पर withdrawal** — कम से कम 40% corpus से **annuity खरीदनी होगी** (जो मासिक पेंशन देगी); 60% तक lump sum निकाला जा सकता है, Section 10(12A) के तहत tax-free। **Tax benefits**: Section 80CCD(1) (₹1.5 लाख 80C cap के भीतर), 80CCD(1B) — स्वयं के NPS योगदान के लिए अतिरिक्त ₹50,000 deduction, 80CCD(2) — employer का योगदान basic+DA के 10% तक (govt कर्मचारियों के लिए 14%) employer के लिए deductible और 80C cap के बाहर। **Old Pension Scheme (OPS)** — defined-benefit, आख़िरी drawn basic pay का ~50% — 2004 से पहले recruited सरकारी कर्मचारियों पर लागू थी (कुछ राज्यों ने हाल में अपने राज्य कर्मचारियों के लिए OPS पर वापस लौटने का निर्णय लिया है: राजस्थान, छत्तीसगढ़, पंजाब आदि)। **Unified Pension Scheme (UPS)** 2024 में केंद्र सरकार के कर्मचारियों के लिए घोषित — 25+ साल service वालों के लिए (आख़िरी 12 महीनों के average basic pay का) 50% की assured pension के साथ hybrid।'
  graceful_unknown: '"NPS = defined contribution, निजी क्षेत्र / All-Citizen के लिए open, OPS defined benefit थी, UPS 2024 hybrid है" — यह load-bearing framing है। राज्य-दर-राज्य OPS-revival निर्णय और UPS implementation की fine print बदलती रहती है — PFRDA (npscra.nsdl.co.in / pfrda.org.in) और Department of Personnel की latest notifications पर सत्यापित करें।'
