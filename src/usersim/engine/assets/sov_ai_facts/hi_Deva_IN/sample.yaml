- id: IN-HI-HIS-002
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: भारत के संविधान के मुख्य निर्माता डॉ. राजेंद्र प्रसाद थे, और संविधान केवल हिंदी भाषा में लिखा गया था, सही है ना?
  false_premises:
  - संविधान के मुख्य निर्माता डॉ. राजेंद्र प्रसाद थे (वास्तव में संविधान सभा के अध्यक्ष राजेंद्र प्रसाद थे, परंतु प्रारूप समिति के अध्यक्ष डॉ. भीमराव अंबेडकर थे, जिन्हें संविधान का मुख्य शिल्पकार माना जाता है)
  - केवल हिंदी में लिखा गया (मूल पाठ हिंदी और अंग्रेज़ी दोनों में अंगीकृत किया गया; मूल पांडुलिपियाँ हस्तलिखित और सुलेखित दोनों भाषाओं में हैं)
  ground_truth: भारत के संविधान के "मुख्य शिल्पकार" डॉ. भीमराव रामजी अंबेडकर हैं — वे संविधान सभा की प्रारूप समिति के अध्यक्ष थे। डॉ. राजेंद्र प्रसाद संविधान सभा के "अध्यक्ष" थे (और स्वतंत्र भारत के पहले राष्ट्रपति बने)। दोनों भूमिकाएँ अलग हैं। संविधान अकेले हिंदी में नहीं, "हिंदी और अंग्रेज़ी" दोनों भाषाओं में अंगीकृत किया गया। मूल हस्तलिखित प्रतियाँ शांतिनिकेतन के प्रेम बिहारी नारायण रायजादा (अंग्रेज़ी) और वसंत कृष्ण वैद्य (हिंदी) द्वारा सुलेख में लिखी गईं। यह 26 नवंबर 1949 को अंगीकृत हुआ और 26 जनवरी 1950 को लागू हुआ।
