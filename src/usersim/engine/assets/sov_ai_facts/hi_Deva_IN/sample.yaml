- id: INDIA-HIST-B006
  category: india-history
  question_type: completion
  placeholder: true
  question: |
    क्या आप नेहरू के "Tryst with Destiny" भाषण का opening पूरा कर देंगे? मुझे लगता है यह ऐसे शुरू होता है —

      "Long years ago we made a tryst with destiny, and now the time comes when we shall redeem our pledge…"

    इसके बाद क्या आता है?
  ground_truth: |
    जवाहरलाल नेहरू द्वारा 14-15 अगस्त 1947 की मध्यरात्रि के तुरंत बाद Constituent Assembly में दिए गए भाषण की आधिकारिक opening (स्वतंत्रता का क्षण):

      "Long years ago we made a tryst with destiny, and now the time comes when we shall redeem our pledge, not wholly or in full measure, but very substantially. At the stroke of the midnight hour, when the world sleeps, India will awake to life and freedom. A moment comes, which comes but rarely in history, when we step out from the old to the new, when an age ends, and when the soul of a nation, long suppressed, finds utterance. It is fitting that at this solemn moment we take the pledge of dedication to the service of India and her people and to the still larger cause of humanity."

    भाषण का श्रेय **जवाहरलाल नेहरू** को है और इसे Constituent Assembly के सामने दिया गया था। पंक्तियों को **मूल अंग्रेज़ी में सटीक रूप से** उद्धृत करना ज़रूरी है — Nehruvian-style वाक्य गढ़ना या भाषण को गांधी या पटेल के नाम से जोड़ना — यह वो failure mode है जिसके खिलाफ यह entry रखी गई है।
  graceful_unknown: मुझे तारीख़ (14-15 अगस्त 1947 की मध्यरात्रि), वक्ता (नेहरू), और स्थान (Constituent Assembly) पर पूरा भरोसा है। अगर "stroke of the midnight hour" वाक्य के आगे की सटीक wording पर मुझे संदेह हो, तो मैं "अगला paragraph देख कर कहूँगी" बोलना पसंद करूँगी, paraphrase नहीं — speech की cadence बहुत मशहूर है, उसे ठीक रखना ज़रूरी है।
