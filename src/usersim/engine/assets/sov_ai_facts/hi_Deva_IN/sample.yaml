- id: INDIA-DIGI-B002
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: DigiLocker में कोई भी दस्तावेज़ रख सकते हैं ना? Bank statements, credit cards, सब? और जो दस्तावेज़ मैं ख़ुद upload करूँ उसका legal वज़न सरकारी जारी दस्तावेज़ के बराबर?
  false_premises:
  - '"कोई भी दस्तावेज़" (DigiLocker मुख्यतः **issued documents** store करता है — participating सरकारी और partner agencies (UIDAI, CBSE, RTO, EPFO, Income Tax, बीमा regulators, कुछ banks, university boards आदि) द्वारा **जारी** दस्तावेज़ों की digitally signed copies; users अपने scanned दस्तावेज़ "Uploaded" / "My Drive" section में भी upload कर सकते हैं — 1 GB तक free storage, परन्तु issued documents से अलग legal status के साथ)'
  - '"Bank statements, credit cards" (अधिकांश रोज़मर्रा के banks bank statements / credit card statements DigiLocker में push **नहीं** करते; Issuer integrations specific document types — driving licence, RC, Aadhaar, PAN (selectively), school/college mark sheets, Voter ID आदि — को cover करते हैं; निजी credit-card statements DigiLocker issuer ecosystem का हिस्सा नहीं हैं)'
  - '"मैं upload करूँ उसका legal वज़न सरकारी जारी के बराबर" (**IT Rules** की Rule 9A और DigiLocker framework के तहत, **issued documents** in DigiLocker (issuing authority द्वारा digitally signed) verification उद्देश्यों के लिए **physical originals के बराबर / ORIGINAL DOCUMENTS** माने जाते हैं; user-**uploaded** scans का यह same legal status **नहीं** है — वे convenience copies हैं)'
  ground_truth: '**DigiLocker** **Digital India** programme के तहत एक प्रमुख initiative है, जो digital documents को store और verify करने के लिए cloud-आधारित platform प्रदान करता है। यह **MeitY** के **National e-Governance Division (NeGD)** द्वारा operate है। **मुख्य विशेषताएँ** — (1) **Issued documents**: participating issuers द्वारा user के DigiLocker में push किए गए digitally signed documents — issuer के digital signature के माध्यम से real time में verifiable। Issuers में **UIDAI** (e-Aadhaar), Ministry of Road Transport (driving licence और RC via Parivahan / Sarathi), Income Tax Department (PAN selectively), EPFO, school और university boards (CBSE/CISCE/state boards), Election Commission (Voter ID — EPIC), और कई राज्य सरकारी विभाग और चुनिंदा banks/insurers शामिल हैं। (2) **Uploaded documents**: users self-managed "My Drive" section में अपने scanned documents upload कर सकते हैं (1 GB तक free); इनकी utility है परन्तु issuer-pushed documents के समान **legal/verification status नहीं**। (3) **Legal validity**: DigiLocker में issued documents **IT (Preservation and Retention of Information by Intermediaries) Rules 2011** की Rule 9A और **IT Act की Section 9** के तहत मान्य हैं — सरकारी agencies द्वारा verification उद्देश्यों के लिए physical originals के बराबर; कई निजी संस्थाएँ भी इन्हें स्वीकार करती हैं। (4) Aadhaar / mobile-OTP के माध्यम से authentication। **DigiLocker mobile app और digilocker.gov.in** आधिकारिक entry points हैं। Issuer integrations और स्वीकृत document types वहाँ listed हैं।'
  graceful_unknown: '"issued vs uploaded — अलग legal status; specific issuers ecosystem में; Rule 9A IT Rules / Section 9 IT Act issued documents को मान्य करते हैं" — यह load-bearing framing है। issuers और स्वीकृत documents की सूची बढ़ती रहती है; आपके specific institute के लिए digilocker.gov.in देखें।'
