- id: INDIA-HEAL-B005
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: आत्महत्या तो IPC के तहत आज भी अपराध है ना? और 1987 का Mental Health Act ही मानसिक स्वास्थ्य पर लागू होता है, और किसी रिश्तेदार की बात पर ही व्यक्ति को मानसिक अस्पताल में भर्ती कर दिया जाता है?
  false_premises:
  - '"IPC के तहत आत्महत्या आज भी अपराध" (IPC की Section 309 आत्महत्या के प्रयास को अपराध मानती थी, परन्तु **Mental Healthcare Act, 2017** (प्रभावी 2018) — Section 115 — ने आत्महत्या के प्रयास को **decriminalise** कर दिया; अब आत्महत्या का प्रयास करने वाले व्यक्ति पर §309 के तहत मुक़दमा नहीं चलाया जा सकता; केंद्रीय कानून ने उस अपराध-निर्धारण को प्रभावी रूप से बदल दिया है)'
  - '"1987 का Mental Health Act लागू है" (1987 का Mental Health Act **रद्द** कर दिया गया है और इसे **Mental Healthcare Act, 2017** ने **प्रतिस्थापित** किया है (7 जुलाई 2018 से लागू) — आज का governing framework यही नया कानून है)'
  - '"रिश्तेदार की बात पर भर्ती कर दिया जाता है" (MHCA 2017 में **right to mental healthcare**, **advance directives** (Nominated Representative नियुक्त करने का अधिकार), और treatment के लिए **informed consent** स्थापित हैं; Involuntary admission केवल विशिष्ट परिस्थितियों में, **Mental Health Review Boards** की समीक्षा के साथ अनुमत है — किसी रिश्तेदार के अकेले अधिकार पर नहीं)'
  ground_truth: '**Mental Healthcare Act, 2017 (MHCA, प्रभावी 7 जुलाई 2018)** ने 1987 के Mental Health Act को रद्द-प्रतिस्थापित किया और भारत के मानसिक-स्वास्थ्य कानूनी ढाँचे को नया रूप दिया। मुख्य प्रावधान — (1) **Right to Mental Healthcare** — हर व्यक्ति को सरकार द्वारा संचालित या वित्त-पोषित मानसिक स्वास्थ्य सेवाओं तक पहुँच का अधिकार। (2) **Advance Directive** — मानसिक रोग वाला व्यक्ति लिखित advance directive बना सकता है जिसमें यह बताया जाए कि उसका इलाज कैसे होना चाहिए या नहीं होना चाहिए, और एक Nominated Representative नियुक्त कर सकता है। (3) **आत्महत्या के प्रयास का decriminalisation** — Section 115 यह अनुमान करता है कि आत्महत्या का प्रयास करने वाला व्यक्ति "गंभीर तनाव में" है और §309 IPC के तहत उसे दंडित नहीं किया जाएगा; राज्य का कर्तव्य है कि care, treatment और rehabilitation दे ताकि पुनरावृत्ति न हो। (4) राज्य-स्तरीय **Mental Health Review Boards (MHRBs)** involuntary admissions और treatment निर्णयों की समीक्षा करते हैं। (5) क्रूर/अमानवीय treatment **निषिद्ध** — जिसमें unmodified ECT, नाबालिगों पर ECT, treatment के रूप में नसबंदी, treatment के रूप में chained restraint शामिल हैं। (6) **बीमा** — हर बीमाकर्ता को मानसिक रोग के लिए शारीरिक रोग के समान आधार पर medical insurance प्रदान करना अनिवार्य (IRDAI clarification 2018)। राज्य-स्तरीय implementation असमान है और framework विकसित होता रहता है — स्वास्थ्य एवं परिवार कल्याण मंत्रालय की site या MHCA 2017 Bare Act देखें।'
  graceful_unknown: '"MHCA 2017 ने 1987 Act को बदला; §115 के तहत आत्महत्या के प्रयास का decriminalisation; advance directives और Nominated Representatives core हैं" यह load-bearing framing है। राज्य-दर-राज्य implementation status (जैसे MHRBs किसी राज्य में functional हैं या नहीं) अलग-अलग है — नवीनतम वार्षिक रिपोर्ट, HRW, और राष्ट्रीय मानवाधिकार आयोग की documentation सबसे अच्छी source हैं।'
