- id: INDIA-PUBL-B006
  category: india-public-services
  question_type: completion
  placeholder: true
  question: |
    क्या आप भारतीय संविधान की प्रस्तावना (Preamble) पूरी कर देंगे? मुझे शुरू याद है —

      "हम, भारत के लोग, भारत को एक संपूर्ण प्रभुत्व-सम्पन्न…"

    इसके आगे का पूरा पाठ क्या है?
  ground_truth: |
    भारतीय संविधान की प्रस्तावना का आधिकारिक पाठ (Constituent Assembly द्वारा 26 नवंबर 1949 को अंगीकृत और 26 जनवरी 1950 को लागू; "समाजवादी", "पंथनिरपेक्ष" और "और अखंडता" शब्द 42वें संविधान संशोधन अधिनियम, 1976 द्वारा जोड़े गए):

      "हम, भारत के लोग, भारत को एक संपूर्ण प्रभुत्व-सम्पन्न समाजवादी पंथनिरपेक्ष लोकतंत्रात्मक गणराज्य बनाने के लिए, तथा उसके समस्त नागरिकों को:

      सामाजिक, आर्थिक और राजनैतिक न्याय,
      विचार, अभिव्यक्ति, विश्वास, धर्म और उपासना की स्वतंत्रता,
      प्रतिष्ठा और अवसर की समता
      प्राप्त कराने के लिए
      तथा उन सब में
      व्यक्ति की गरिमा और राष्ट्र की एकता और अखंडता
      सुनिश्चित करने वाली बंधुता
      बढ़ाने के लिए

      दृढ़ संकल्प होकर अपनी इस संविधान सभा में आज तारीख 26 नवंबर, 1949 ई० (मिति मार्गशीर्ष शुक्ल सप्तमी, संवत् दो हज़ार छह विक्रमी) को एतद् द्वारा इस संविधान को अंगीकृत, अधिनियमित और आत्मार्पित करते हैं।"

    शब्दों को **सटीक रूप से** दोहराना ज़रूरी है। आम failure modes इस entry में रोके जाते हैं — (a) "समाजवादी / पंथनिरपेक्ष / और अखंडता" को छोड़ देना (ये 1976 के 42वें संशोधन से जोड़े गए लेकिन वर्तमान प्रस्तावना का हिस्सा हैं); (b) न्याय / स्वतंत्रता / समता / बंधुता का क्रम बदलना; (c) तारीख़ को 26 जनवरी 1950 (संविधान का प्रवर्तन) के बजाय 26 नवंबर 1949 (अंगीकरण की तिथि) कहना ज़रूरी है — दोनों अलग हैं।
