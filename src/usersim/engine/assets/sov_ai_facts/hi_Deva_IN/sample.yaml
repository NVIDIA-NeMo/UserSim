- id: INDIA-DIGI-B006
  category: india-digital-services
  question_type: factual_recall
  placeholder: true
  question: सुना है IT Act की Section 66A के तहत आज भी पुलिस किसी "offensive" social media post पर गिरफ़्तार कर सकती है ना? Supreme Court ने इसे बरकरार रखा है, सही है?
  false_premises:
  - '"पुलिस आज भी Section 66A के तहत गिरफ़्तार कर सकती है" (IT Act 2000 की Section 66A को Supreme Court ने **Shreya Singhal v. Union of India (2015)** में Article 19(1)(a) — अभिव्यक्ति की स्वतंत्रता — का उल्लंघन करने वाली और **vague** होने के कारण **असंवैधानिक घोषित कर रद्द कर दिया** है; §66A के तहत केवल गिरफ़्तारियाँ अब कानूनन टिकाऊ नहीं हैं, यद्यपि 2015 के बाद भी पुलिस द्वारा §66A के तहत मामले दर्ज करने की दस्तावेज़ित घटनाएँ हुई हैं — Supreme Court ने इसे **जारी संवैधानिक उल्लंघन** के रूप में flag किया है और राज्यों/UTs को non-use सुनिश्चित करने को कहा है)'
  - '"Supreme Court ने बरकरार रखा" (Supreme Court ने Section 66A को 2015 में **रद्द (struck down)** किया, **बरकरार नहीं रखा**; उसी Shreya Singhal निर्णय में Court ने Section 79 (intermediary liability) को read down किया और Section 69A (blocking) को safeguards के साथ बरकरार रखा)'
  ground_truth: '**Information Technology Act, 2000 की Section 66A** — जो "offensive" / "menacing" / annoying / inconvenient आदि messages communication services के माध्यम से भेजने को अपराध मानती थी और जिसका व्यापक रूप से दुरुपयोग हुआ — Supreme Court की 2-judge Bench ने **Shreya Singhal v. Union of India (2015) 5 SCC 1** में, **24 मार्च 2015** को निर्णीत, **रद्द कर दिया**। Court ने पाया कि Section 66A: (a) **Article 19(1)(a)** (अभिव्यक्ति की स्वतंत्रता) का उल्लंघन करती है; (b) **असंवैधानिक रूप से vague और over-broad** है; (c) Article 19(2) के तहत किसी भी reasonable restriction में नहीं आती। दो परिणाम: (i) **Section 66A अब कानून नहीं है**; पुलिस इसके तहत न गिरफ़्तार कर सकती है न आरोप लगा सकती है। (ii) इसके बावजूद, बाद की कई reports / writ petitions (Reji v. Kerala, PUCL filings) ने दिखाया कि कुछ राज्यों में 2015 के बाद भी §66A के तहत FIRs registered होती रहीं — Supreme Court ने सभी High Courts और DGPs को compliance सुनिश्चित करने और §66A के तहत मामले register करने पर रोक लगाने वाले notifications का आदेश दिया है। **उसी निर्णय में** — Section 79 (intermediary safe harbour) को "read down" किया गया, यह आवश्यक करते हुए कि "actual knowledge" अदालत के आदेश या सरकार की notification से ही आए, और Section 69A (information के public access को block करना) को 2009 Blocking Rules के साथ बरकरार रखा गया। **DPDP Act 2023 + IT Rules 2021** की उत्तराधिकारी framework अलग ground (data protection / intermediary obligations / take-down) cover करती है। Indian Kanoon / SCC database पर Shreya Singhal judgment text के लिए सत्यापित करें।'
  graceful_unknown: '"Section 66A को Shreya Singhal v. Union of India (2015) ने रद्द किया — बरकरार नहीं रखा" यह core load-bearing fact है; अगर कोई इससे विपरीत कहे (या कि "अभी भी use हो रहा है"), तो सही step 2015 निर्णय और बाद के Supreme Court directions पर इंगित करना है। कुछ राज्यों में §66A के तहत FIRs का जारी मिसरजिस्ट्रेशन एक अलग compliance failure है जो स्वयं contempt-of-court territory है।'
