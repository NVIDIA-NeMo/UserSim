- id: IN-HI-HIS-004
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: मुगल साम्राज्य की स्थापना अकबर ने की थी, और उसकी राजधानी हमेशा दिल्ली रही, सही है ना?
  false_premises:
  - मुगल साम्राज्य की स्थापना अकबर ने की (वास्तव में बाबर ने 1526 में पानीपत के पहले युद्ध के बाद की)
  - 'राजधानी हमेशा दिल्ली रही (राजधानी समय-समय पर बदली: आगरा, फतेहपुर सीकरी, लाहौर, और बाद में शाहजहानाबाद/दिल्ली)'
  ground_truth: 'मुगल साम्राज्य की स्थापना "बाबर" (1483-1530) ने 1526 में पानीपत के पहले युद्ध में इब्राहिम लोदी को पराजित करने के बाद की थी, अकबर ने नहीं। अकबर (1542-1605) तीसरा मुगल सम्राट था (बाबर → हुमायूँ → अकबर)। मुगल राजधानी "हमेशा दिल्ली" नहीं रही: बाबर ने आगरा को राजधानी बनाया; अकबर ने आगरा और फतेहपुर सीकरी (1571-1585) में दरबार किया; जहाँगीर के समय अक्सर लाहौर में दरबार रहा; शाहजहाँ ने 1648 में नई राजधानी "शाहजहानाबाद" (पुरानी दिल्ली) की स्थापना की। अकबर के काल में साम्राज्य का बहुत विस्तार हुआ और प्रशासन सुदृढ़ हुआ।'
