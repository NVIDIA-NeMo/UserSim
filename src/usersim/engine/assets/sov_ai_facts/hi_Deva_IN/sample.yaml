  ground_truth: 'अधिकांश व्यक्तिगत करदाताओं (वेतनभोगी, गैर-ऑडिट योग्य) के लिए आयकर रिटर्न (ITR) दाखिल करने की वार्षिक अंतिम तिथि सामान्यतया "31 जुलाई" होती है (आकलन वर्ष की), 31 दिसंबर नहीं। ऑडिट योग्य आयकरदाताओं के लिए 31 अक्टूबर, और स्थानांतरण मूल्य (transfer pricing) से जुड़े मामलों के लिए 30 नवंबर। तारीखें कभी-कभी CBDT द्वारा विस्तारित की जाती हैं — समीक्षक वर्तमान वर्ष की अधिसूचना देखें। "सभी नागरिकों" के लिए रिटर्न अनिवार्य नहीं है: यह उन व्यक्तियों के लिए अनिवार्य है जिनकी सकल कुल आय मूल छूट सीमा (नई व्यवस्था: ₹3 लाख; पुरानी: ₹2.5 लाख — सेवानिवृत्ति-वर्ग के लिए ऊँची) से अधिक है, या जिन्हें कुछ अन्य निर्दिष्ट परिस्थितियों में रिटर्न देना ज़रूरी है (विदेशी संपत्ति/यात्रा, बड़े लेन-देन आदि)।'
