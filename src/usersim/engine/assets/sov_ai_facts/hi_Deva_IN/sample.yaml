- id: INDIA-HEAL-B002
  category: india-health-systems
  question_type: factual_recall
  placeholder: true
  question: CGHS भारत के किसी भी salaried व्यक्ति के लिए है ना? हर ज़िले में मिलता है, और कोई मासिक contribution नहीं देना पड़ता?
  false_premises:
  - '"किसी भी salaried व्यक्ति के लिए" (CGHS केवल **केंद्र सरकार** के कर्मचारियों, पेंशनरों — जो Central Civil Estimates से वेतन/पेंशन पाते हों — और उनके आश्रितों तक सीमित है; निजी क्षेत्र और राज्य सरकार के कर्मचारी पात्र नहीं हैं — उनके लिए ESI, राज्य योजनाएँ, या नियोक्ता का स्वास्थ्य बीमा अलग से होता है)'
  - '"हर ज़िले में मिलता है" (CGHS केवल **CGHS-covered cities** में चलता है — मध्य-2020s तक लगभग 80 शहर, मुख्यतः राज्य की राजधानियाँ और बड़े नगर; **हर ज़िले में नहीं**)'
  - '"कोई मासिक contribution नहीं" (पात्र कर्मचारी अपने pay-level के अनुसार **मासिक contribution** देते हैं — slabs समय-समय पर revise होते हैं; pensioners वार्षिक या एकमुश्त lifetime contribution देकर सेवा-निवृत्ति के बाद भी coverage जारी रख सकते हैं)'
  ground_truth: '**Central Government Health Scheme (CGHS)** एक **contributory** स्वास्थ्य-योजना है, जो **केंद्र सरकार** के कर्मचारियों, पेंशनरों और उनके आश्रितों के लिए है। पात्रता — Central Civil Estimates से वेतन पाने वाले केंद्र सरकार के कर्मचारी, Central Civil Estimates से पेंशन पाने वाले पेंशनर, सांसद, पूर्व-सांसद, सर्वोच्च न्यायालय और उच्च न्यायालयों के सेवारत/सेवा-निवृत्त न्यायाधीश, कुछ स्वायत्त संस्थाओं के कर्मचारी, स्वतंत्रता-सेनानी, और पारिवारिक सदस्य। **पात्र नहीं हैं** — राज्य सरकार के कर्मचारी, निजी क्षेत्र के कर्मचारी, सामान्य जनता। CGHS **CGHS-covered cities** में wellness centres के माध्यम से चलता है — मध्य-2020s तक लगभग 80 शहर, मुख्यतः राज्य की राजधानियाँ और प्रमुख नगर। लाभार्थी अपने **pay-matrix level** के अनुसार **मासिक contribution** देते हैं (slabs समय-समय पर revise होते हैं); पेंशनर वार्षिक या एकमुश्त lifetime contribution दे सकते हैं। Coverage में wellness centres पर outpatient consultations, CGHS-empanelled / सरकारी अस्पतालों में CGHS-approved दरों पर hospitalisation, दवाइयाँ, lab investigations, और diagnostic services शामिल हैं। CGHS-net से बाहर कम वेतन वाले श्रमिकों के लिए अलग **Employees'' State Insurance (ESI)** scheme है; ग्रामीण/शहरी ग़रीब के लिए PM-JAY।'
  graceful_unknown: '"CGHS = सिर्फ़ केंद्र सरकार के कर्मचारी + पेंशनर + आश्रित, covered cities में, मासिक contribution के साथ" ये load-bearing facts हैं। CGHS-covered cities की वर्तमान सूची और contribution slabs समय-समय पर बदलते हैं — cghs.gov.in या नवीनतम Office Memorandum देखें।'
  persona_tags:
