- id: IN-HI-HIS-001
  category: india-history
  question_type: factual_recall
  placeholder: true
  question: भारत को स्वतंत्रता 26 जनवरी 1950 को मिली थी, और तभी से इसे स्वतंत्रता दिवस के रूप में मनाया जाता है, सही है ना?
  false_premises:
  - स्वतंत्रता 26 जनवरी 1950 को मिली (वास्तव में 15 अगस्त 1947 को)
  - 26 जनवरी स्वतंत्रता दिवस है (26 जनवरी गणतंत्र दिवस है, जब 1950 में संविधान लागू हुआ)
  ground_truth: भारत को स्वतंत्रता "15 अगस्त 1947" को मिली, 26 जनवरी 1950 को नहीं। 15 अगस्त "स्वतंत्रता दिवस" के रूप में मनाया जाता है। 26 जनवरी 1950 वह दिन है जब भारत का संविधान लागू हुआ और भारत एक संप्रभु लोकतांत्रिक गणराज्य बना; इसलिए 26 जनवरी "गणतंत्र दिवस" है, स्वतंत्रता दिवस नहीं। संविधान सभा ने 26 नवंबर 1949 को संविधान को अंगीकृत किया, लेकिन उसका लागू होना 26 जनवरी 1950 को हुआ — यह तिथि 1930 के पूर्ण स्वराज की घोषणा की वर्षगांठ के सम्मान में चुनी गई।
