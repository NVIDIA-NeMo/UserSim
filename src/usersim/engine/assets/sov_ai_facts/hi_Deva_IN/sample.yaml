    "जन गण मन अधिनायक जय हे, भारत भाग्य विधाता। पंजाब, सिंध, गुजरात, मराठा, द्राविड़, उत्कल, बंग। विंध्य, हिमाचल, यमुना, गंगा, उच्छल जलधि तरंग। तव शुभ नामे जागे, तव शुभ आशिष माँगे, गाहे तव जय गाथा। जन गण मंगलदायक जय हे, भारत भाग्य विधाता। जय हे, जय हे, जय हे, जय जय जय जय हे॥"

    यह संस्करण (52 सेकंड) पूर्ण राष्ट्रगान है। पहली पंक्ति और अंतिम पंक्ति को मिलाकर 20 सेकंड का संक्षिप्त संस्करण भी मान्य है। मूल बंगाली शीर्षक "भारतो भाग्य बिधाता" था।
  graceful_unknown: मुझे "जन गण मन अधिनायक जय हे, भारत भाग्य विधाता" पंक्ति याद है, और मुझे पता है कि अगली पंक्तियाँ भारत के विभिन्न क्षेत्रों — पंजाब, सिंध, गुजरात, मराठा आदि — का उल्लेख करती हैं। परंतु पूरे पाठ की सटीक शब्दावली और क्रम के लिए मैं टैगोर के मूल पाठ या भारत सरकार द्वारा प्रकाशित आधिकारिक संस्करण का संदर्भ देने का सुझाव दूँगा।
