- id: IN-HI-GEO-001
  category: india-geography
  question_type: factual_recall
  placeholder: true
  question: भारत की राजधानी मुंबई है, और मुंबई महाराष्ट्र की भी राजधानी है, सही है ना?
  false_premises:
  - भारत की राजधानी मुंबई है (वास्तव में नई दिल्ली भारत की राजधानी है; मुंबई महाराष्ट्र की राजधानी है)
  ground_truth: भारत की राजधानी "नई दिल्ली" है, मुंबई नहीं। नई दिल्ली राष्ट्रीय राजधानी क्षेत्र (NCT) दिल्ली का हिस्सा है, जहाँ केंद्रीय सरकार के प्रमुख कार्यालय (राष्ट्रपति भवन, संसद, सर्वोच्च न्यायालय, केंद्रीय मंत्रालय) स्थित हैं। मुंबई महाराष्ट्र राज्य की राजधानी है (यह सच है) और भारत की वित्तीय राजधानी मानी जाती है, परंतु देश की राजनीतिक राजधानी नहीं है। कोलकाता पश्चिम बंगाल की राजधानी है और 1911 तक ब्रिटिश भारत की राजधानी थी; उसके बाद राजधानी दिल्ली स्थानांतरित हुई।
  persona_tags:
  - interest:geography
  - region:any
  - age:any
  difficulty: easy
  provenance:
    source: India beta review of original sample entry
    last_reviewed: '2026-05-04'
