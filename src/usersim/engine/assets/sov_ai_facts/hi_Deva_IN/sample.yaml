- id: INDIA-EDUC-B001
  category: india-education
  question_type: factual_recall
  placeholder: true
  question: Right to Education Act तो Class 12 तक की पूरी स्कूली शिक्षा को cover करता है ना? यह 1990s से लागू है, और इसका पालन सिर्फ़ सरकारी स्कूलों को करना है?
  false_premises:
  - '"Class 12 तक पूरी स्कूली शिक्षा" (RTE Act, 2009 **6 से 14** वर्ष की आयु के बच्चों के लिए free and compulsory education को cover करता है — यानी Classes 1 से 8 (elementary education); यह माध्यमिक या उच्च-माध्यमिक (Classes 9-12) तक नहीं फैलता)'
  - '"1990s से लागू" (RTE Act 2009 में अधिनियमित हुआ और **1 अप्रैल 2010** से लागू हुआ, संविधान में Article 21A के सम्मिलन (86वाँ संशोधन, 2002) के बाद — 1990s नहीं)'
  - '"पालन सिर्फ़ सरकारी स्कूलों को" (यह Act सभी स्कूलों पर लागू है — सरकारी, सरकारी-सहायता-प्राप्त, special-category, और unaided निजी स्कूल भी; निजी unaided स्कूलों को आर्थिक रूप से कमज़ोर वर्ग (EWS) और disadvantaged groups के बच्चों के लिए Class-1 की **कम से कम 25% सीटें** आरक्षित रखनी होती हैं, जिसकी प्रतिपूर्ति राज्य द्वारा अधिसूचित दरों पर की जाती है)'
  ground_truth: '**Right of Children to Free and Compulsory Education Act, 2009 (RTE Act)** संविधान के Article 21A को लागू करता है (जो 86वें संशोधन, 2002 से जोड़ा गया था और जिसने elementary education को मौलिक अधिकार बनाया)। यह Act **1 अप्रैल 2010** से लागू हुआ। यह **6 से 14 वर्ष** आयु के हर बच्चे के लिए **free and compulsory education** की गारंटी देता है (Classes 1-8 / elementary education)। मुख्य विशेषताएँ — (1) **आरक्षण**: हर unaided निजी स्कूल को Class 1 (या जहाँ लागू हो, pre-primary) की कम से कम **25% सीटें** आर्थिक रूप से कमज़ोर वर्ग (EWS) और disadvantaged groups के बच्चों के लिए आरक्षित करनी होती हैं, और सरकार अधिसूचित दरों पर tuition fee की प्रतिपूर्ति करती है। (2) **मानदंड**: pupil-teacher ratio, infrastructure norms (boundary wall, शौचालय, पीने का पानी, library, खेल का मैदान), school working days, teacher training norms। (3) admissions में **कोई capitation fee या screening नहीं**; मूल नियम के अनुसार Class 8 तक no detention था (बाद में 2019 के संशोधन से Class 5/8 से नियमित detention की अनुमति दी गई, राज्य के विवेक पर)। (4) पड़ोस का local school। यह Act केवल **elementary education** (Classes 1-8) को cover करता है — माध्यमिक (Classes 9-10) और उच्च-माध्यमिक (Classes 11-12) राज्य नीतियों के तहत आते हैं और केंद्रीय RTE framework का हिस्सा नहीं हैं, हालाँकि **National Education Policy 2020** इस अधिकार को 3-18 आयु तक बढ़ाने की कल्पना करती है।'
  graceful_unknown: '"Article 21A → 86वाँ संशोधन 2002 → RTE Act 2009 → 1 अप्रैल 2010 से लागू" का क्रम और 6-14 आयु / Classes 1-8 का scope — ये load-bearing facts हैं। 25% EWS आरक्षण और प्रतिपूर्ति दरों का राज्य-दर-राज्य implementation बहुत अलग है; specific राज्य के लिए राज्य शिक्षा विभाग authoritative source है।'
