- id: INDIA-LABO-B003
  category: india-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: भारत के नए श्रम सुधार — एक ही नया कानून है ना जिसने सब कुछ बदल दिया? 2020 में पूरे देश में पूरी तरह लागू हो गया, और राज्यों की कोई भूमिका नहीं?
  false_premises:
  - '"एक ही नया कानून" (श्रम सुधारों ने 29 केंद्रीय श्रम कानूनों को **चार labour codes** में समेकित किया है — (1) **Code on Wages, 2019**, (2) **Industrial Relations Code, 2020**, (3) **Code on Social Security, 2020**, (4) **Occupational Safety, Health and Working Conditions Code, 2020** — एक नहीं, चार)'
  - '"2020 में पूरे देश में पूरी तरह लागू" (चारों Codes 2019-2020 में **अधिनियमित** हुए, परन्तु उनके provisions अभी **पूरे देश में पूरी तरह operational नहीं हैं** — केंद्र सरकार ने कुछ sections के लिए नियम और प्रभावी तिथियाँ अधिसूचित की हैं, परन्तु पूर्ण implementation राज्य-स्तरीय rule-making और राजनीतिक negotiation के कारण विलंबित है; मध्य-2020s तक Codes आंशिक रूप से लागू, आंशिक रूप से लंबित हैं)'
  - '"राज्यों की कोई भूमिका नहीं" (श्रम संविधान की **समवर्ती सूची (Concurrent List)** में है — केंद्र और राज्य दोनों कानून बना सकते हैं; प्रत्येक Code को किसी राज्य में operationalise करने से पहले उस राज्य को **अपने नियम** अधिसूचित करने होते हैं; rule-notification status राज्य-दर-राज्य अलग है, यही rollout के क्रमिक होने का प्रमुख कारण है)'
  ground_truth: 'भारत सरकार ने 29 मौजूदा केंद्रीय श्रम कानूनों को **चार Labour Codes** में समेकित किया है — (1) **Code on Wages, 2019** (Payment of Wages Act 1936, Minimum Wages Act 1948, Payment of Bonus Act 1965, Equal Remuneration Act 1976 को बदलता है); (2) **Industrial Relations Code, 2020** (Trade Unions Act 1926, Industrial Employment (Standing Orders) Act 1946, Industrial Disputes Act 1947 को बदलता है); (3) **Code on Social Security, 2020** (EPF, ESI, Maternity Benefit, Gratuity, Employees'' Compensation, Building & Other Construction Workers आदि सहित 9 कानूनों को बदलता है, और **असंगठित, gig, platform workers** के लिए Social Security Board बनाता है); (4) **Occupational Safety, Health and Working Conditions Code, 2020** (Factories Act, Mines Act, Plantations Labour, Contract Labour, Inter-State Migrant Workers आदि सहित 13 कानूनों को बदलता है)। **श्रम संविधान की Concurrent List में है**, इसलिए केंद्र और राज्य दोनों कानून बना सकते हैं और नियम बना सकते हैं; किसी राज्य में Codes लागू करने के लिए **केंद्रीय नियम और राज्य-विशिष्ट नियम दोनों** अधिसूचित होने चाहिए — पूर्ण national implementation राज्य के नियम-तैयारियों की अलग-अलग गति के कारण क्रमिक रहा है। कुछ sections (जैसे Wages Code की definitions) पहले अधिसूचित हुए हैं; अन्य लंबित। किसी विशिष्ट तिथि पर किसी section का operation status notifications से बदलता है — labour.gov.in या PRS Legislative Research देखें।'
  graceful_unknown: '"चार Codes (Wages, IR, Social Security, OSH); concurrent-list status; क्रमिक / आंशिक implementation; राज्यों को अपने नियम अधिसूचित करने होते हैं" — यह load-bearing framing है। किसी विशिष्ट तिथि पर किसी Code का कौन-सा section लागू है, यह notifications से बदलता है — labour.gov.in या PRS Legislative Research।'
