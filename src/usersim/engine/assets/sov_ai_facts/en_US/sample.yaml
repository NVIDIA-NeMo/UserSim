- id: US-SVC-002
  category: usa-public-services
  question_type: factual_recall
  placeholder: true
  question: You can start collecting Social Security at 62, and your full retirement age is 65, regardless of when you were born — right?
  false_premises:
  - 'Full retirement age is 65 regardless of birth year (FRA varies: 66 for those born 1943-1954; gradually rising to 67 for those born 1960 or later)'
  ground_truth: 'Early retirement reduced benefits do start at 62 (correct), but Full Retirement Age (FRA) is NOT 65 for everyone. FRA depends on birth year: - Born 1937 or earlier: 65 - Born 1938-1942: gradually 65 + 2 months to 65 + 10 months - Born 1943-1954: 66 - Born 1955-1959: gradually 66 + 2 months to 66 + 10 months - Born 1960 or later: 67 Claiming before FRA permanently reduces the monthly benefit; delayed retirement credits up to age 70 increase it. Reviewer should confirm against the Social Security Administration''s current published schedule before any production claim.'
