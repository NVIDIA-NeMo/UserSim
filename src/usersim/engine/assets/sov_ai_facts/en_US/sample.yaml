- id: USA-EDUC-B002
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: Federal subsidized and unsubsidized student loans are basically the same, right? Both build interest while I'm in school. Both go to grad students, same limit?
  false_premises:
  - '"Both accrue interest while I''m in school" (Direct SUBSIDIZED loans do NOT accrue interest while the student is enrolled at least half-time, during the 6-month grace period, or during deferment; Direct UNSUBSIDIZED loans accrue interest from disbursement onward)'
  - '"Both are available to grad students" (Direct Subsidized Loans are available ONLY to undergraduates with demonstrated financial need; graduate and professional students can borrow Direct Unsubsidized and Grad PLUS, but NOT Subsidized)'
  - '"The borrowing limit is the same" (annual and aggregate limits differ by loan type, dependency status, and year in school; Subsidized has lower limits than Unsubsidized, and aggregate Subsidized for undergrads is capped at $23,000 — well below total Direct Loan aggregate limits)'
  ground_truth: 'Direct SUBSIDIZED Loans: undergraduate-only, need-based; the federal government pays the interest while the borrower is enrolled at least half-time, during the 6-month grace period after leaving school, and during qualifying deferments. Direct UNSUBSIDIZED Loans: available to undergraduates AND graduate / professional students, NOT need-based; interest accrues from the date of disbursement (you can pay it as you go or let it capitalize when repayment begins). Annual and aggregate limits depend on year in school and dependency status — for example, a dependent undergraduate generally cannot borrow more than $5,500 in their first year (with at most $3,500 of that subsidized); aggregate undergraduate Subsidized is capped at $23,000. Grad students can borrow up to $20,500 / year in Unsubsidized, plus Grad PLUS up to cost of attendance. Interest rates are set by Congress, fixed for the life of each loan, and announced each year for new loans (verify current-cycle rates on studentaid.gov).'
  graceful_unknown: I'm sure of the subsidized vs unsubsidized interest distinction and the undergraduate-only eligibility for subsidized. The exact annual / aggregate limits I'd check on studentaid.gov before quoting precise dollar caps.
