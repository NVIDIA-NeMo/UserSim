- id: USA-FINA-B004
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: I have to start RMDs from my retirement accounts at 70½, right? All accounts, my Roth IRA included? And missing one is a 10% penalty?
  false_premises:
  - '"At age 70½" (the RMD start age was 70½ for many years, but the SECURE Act of 2019 raised it to 72, and SECURE 2.0 (2022) raised it to 73 for those reaching 72 in 2023 or later, with a further increase to 75 scheduled for those reaching 74 after 2032)'
  - '"All retirement accounts including my Roth IRA" (ROTH IRAs do NOT require RMDs during the original owner''s lifetime; SECURE 2.0 also eliminated lifetime RMDs from Roth 401(k)s starting in 2024; RMDs apply to Traditional IRA, SEP IRA, SIMPLE IRA, and most employer retirement plans (401(k), 403(b), governmental 457(b) — including pre-tax balances))'
  - '"10% penalty" (the historical excise tax on missed RMDs was 50%; SECURE 2.0 reduced it to 25%, and to 10% if corrected within a 2-year window — so the right answer is 25% generally, with 10% only after timely correction)'
  ground_truth: 'Required Minimum Distributions (RMDs) are mandatory minimum withdrawals from most tax-deferred retirement accounts, calculated each year based on the prior year-end balance and IRS Uniform Lifetime Table (or Joint Life table for spouses with a >10-year age gap). The starting AGE for RMDs has been raised twice in recent years: SECURE Act (2019) moved the age from 70½ to 72; SECURE 2.0 (2022) raised it to 73 for individuals who reach age 72 in 2023 or later, with a further rise to 75 for those who reach 74 after 2032. RMDs apply to Traditional IRAs, SEP IRAs, SIMPLE IRAs, and most employer plans (401(k), 403(b), governmental 457(b)). ROTH IRAs do NOT require RMDs during the original owner''s lifetime; under SECURE 2.0, Roth 401(k) accounts also no longer require RMDs during the owner''s lifetime starting in 2024. The first RMD can be deferred until April 1 of the year after you turn 73, but subsequent RMDs are due by Dec 31 each year. The MISSED-RMD EXCISE TAX was 50% historically; SECURE 2.0 reduced it to 25%, with reduction to 10% if the shortfall is corrected within a 2-year corrective window (and a Form 5329 is filed). Inherited IRAs follow separate "10-year rule" / Eligible Designated Beneficiary rules.'
  graceful_unknown: The "Roth IRAs are exempt from lifetime RMDs" and "age has risen to 73 (heading to 75)" facts are the load-bearing corrections. Specific calculation tables and edge cases for inherited IRAs I'd verify in IRS Publication 590-B.
