- id: USA-FINA-B002
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: As long as I pay the minimum on my credit card every month, I avoid all interest, right? And the minimum's enough to clear the balance in about a year anyway?
  false_premises:
  - '"Pay the minimum and avoid all interest" (interest is avoided only by paying the FULL STATEMENT BALANCE by the due date each cycle (and only on purchases that have a grace period — cash advances and balance transfers usually have NO grace period); paying just the minimum keeps the account in good standing but interest accrues on the unpaid balance)'
  - '"Pay off in about a year" (typical minimum payments are designed to be small (commonly 1-3% of the balance, or a flat $25-$35, whichever is greater); paying only the minimum on a meaningful balance often takes MANY YEARS and costs MORE in interest than the original principal)'
  ground_truth: 'In the U.S., to avoid INTEREST CHARGES on credit-card PURCHASES, you must pay the FULL STATEMENT BALANCE by the payment due date each cycle. This works because U.S. cards typically offer a "grace period" on purchases when the prior month''s balance was paid in full. CASH ADVANCES, BALANCE TRANSFERS, and certain other transactions usually have NO grace period — interest accrues from the transaction date. Paying only the MINIMUM PAYMENT keeps the account in good standing and avoids late fees, but does NOT avoid interest — interest accrues on the unpaid portion. Minimum payments are typically a small percentage (commonly 1-3% of the balance, with a floor like $25-$35); the Credit CARD Act of 2009 requires statements to include a "minimum payment warning" box estimating how long it would take to pay off the balance making only minimum payments and the total cost — for typical revolving balances this is many years and substantially more interest than principal. CFPB enforces consumer credit-card rules.'
  graceful_unknown: The "minimum payment ≠ interest-free" point and the grace-period mechanic are the load-bearing facts. The exact minimum-payment formula varies by issuer and is disclosed in the card agreement.
