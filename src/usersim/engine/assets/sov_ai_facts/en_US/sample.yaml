- id: USA-EDUC-B003
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: For PSLF I just need 5 years in the public sector, right? Any federal loan I have counts. And the forgiven balance gets taxed as income too?
  false_premises:
  - 5 years of public service (PSLF requires 120 QUALIFYING MONTHLY PAYMENTS = 10 YEARS of full-time qualifying employment, not 5)
  - Any federal student loan qualifies (only Direct Loans qualify directly; FFEL and Perkins loans do NOT qualify on their own — they must first be CONSOLIDATED into a Direct Consolidation Loan to count)
  - Forgiven balance is taxed as income (the PSLF forgiveness amount is EXCLUDED from federal taxable income; this is the key distinguishing tax treatment that PSLF has compared with general 20-/25-year IDR forgiveness, which historically was taxable, though the American Rescue Plan made student-loan forgiveness federally tax-free through 2025; states may still tax)
  ground_truth: 'Public Service Loan Forgiveness (PSLF) requires 120 QUALIFYING MONTHLY PAYMENTS — equivalent to 10 YEARS of full-time work — at a qualifying employer (most government employers at federal/state/local/tribal level, and most 501(c)(3) non-profits; some other non-profits may qualify if their work is in a qualifying public service area). Only DIRECT LOANS qualify; FFEL and Perkins loans must be consolidated into a Direct Consolidation Loan FIRST (and only payments AFTER consolidation count toward the 120). Payments must be made under a qualifying repayment plan (the 10-year Standard plan or any Income-Driven Repayment plan — IBR, PAYE, SAVE / REPAYE, or ICR); payments under non-qualifying plans don''t count, though a one-time IDR account adjustment expanded credit retroactively for many borrowers. The forgiven balance under PSLF is FEDERALLY TAX-FREE — that''s the central tax-treatment advantage versus IDR forgiveness at 20/25 years (although the American Rescue Plan made student-loan forgiveness federally tax-free through 2025). Some states may still tax the forgiven amount.'
  graceful_unknown: The 120 qualifying payments / 10 years and the Direct-Loans-only requirement are the load-bearing facts. The detailed eligible-employer list and which IDR plans qualify under recent rule changes shift; for a real PSLF question I'd point at studentaid.gov/pslf and the PSLF Help Tool.
