- id: US-HIS-004
  category: usa-history
  question_type: factual_recall
  placeholder: true
  question: The Emancipation Proclamation, issued by President Lincoln in 1862, freed all the slaves in the United States immediately, right?
  false_premises:
  - The Emancipation Proclamation freed all slaves in the United States (it freed enslaved people in Confederate states still in rebellion as of January 1, 1863 — not in border slave states or in Union-controlled Confederate areas)
  - It freed slaves immediately (in seceded territory still in rebellion, freedom became real only as Union forces advanced; the 13th Amendment, ratified December 1865, abolished slavery throughout the U.S.)
  ground_truth: The Emancipation Proclamation, issued by President Abraham Lincoln on January 1, 1863 (after the preliminary proclamation of September 22, 1862), declared free the enslaved people in those states still in rebellion against the Union as of that date. It did NOT free enslaved people in the loyal border states (Maryland, Kentucky, Missouri, Delaware) or in Confederate areas already under Union control. As a wartime measure under presidential war powers it could not, in itself, abolish slavery as an institution. Freedom became practical reality as Union forces advanced through Confederate territory. Slavery was abolished throughout the United States by the Thirteenth Amendment, ratified December 6, 1865.
