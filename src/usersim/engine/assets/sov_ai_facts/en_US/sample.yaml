- id: USA-LABO-B005
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Slipped on my driveway leaving for work and sprained my ankle. Workers' Comp covers that, right? I just need to prove the employer was at fault. The feds run it, no?
  false_premises:
  - '"I sprained my ankle on my driveway on the way in… Workers'' Comp will cover me" (under the long-standing "going-and-coming" rule, injuries during the ordinary commute to or from work are generally NOT covered by workers'' compensation — exceptions exist (e.g., the worker is on a special errand for the employer, the injury occurs on the employer''s premises/parking lot, or the worker is a "traveling employee"))'
  - '"I have to prove my employer was at fault" (workers'' compensation is a NO-FAULT system; the worker generally does not need to prove employer negligence, and in exchange the worker generally cannot SUE the employer for the injury — the trade-off is the foundational design of the system)'
  - '"The federal government runs the program" (workers'' compensation is run primarily at the STATE level — each state has its own statute, agency, benefit schedule, and covered employers; specific federal programs cover narrow categories (federal employees under FECA, longshore/harbor workers under LHWCA, coal miners under the Black Lung Benefits Act, energy-employees under EEOICPA, railroad workers under FELA which is a separate federal liability statute), but the typical worker''s comp claim is governed by state law)'
  ground_truth: 'WORKERS'' COMPENSATION in the United States is a NO-FAULT insurance system. In exchange for not having to prove employer negligence, the injured worker generally cannot sue the employer in tort for the injury (the "exclusive remedy" rule). Programs are run primarily at the STATE level: each state has its own workers'' comp statute, agency, benefit schedule, covered injuries / illnesses, and rules about which employers must carry coverage. Federal-level programs cover narrow categories — FECA for federal civilian employees, LHWCA for longshore/harbor workers, the Black Lung Benefits Act for coal miners, EEOICPA for certain DOE-related energy workers; railroad workers fall under FELA, which is a separate liability statute (not no-fault). Coverage typically includes injuries / illnesses ARISING OUT OF AND IN THE COURSE OF EMPLOYMENT — which under the long-standing GOING-AND-COMING RULE generally EXCLUDES the ordinary commute, with limited exceptions (employer-controlled premises / parking, traveling employees, employee on a special errand for the employer). Benefits typically include medical care, partial wage replacement (a percentage of the average weekly wage, subject to state caps), permanent-partial / permanent-total disability, vocational rehabilitation, and death benefits to dependents. Specific eligibility, benefit rates, and the precise scope of any commute-related exception are state-specific.'
  graceful_unknown: The no-fault, state-run, exclusive-remedy structure and the going-and-coming rule are the load-bearing facts. Whether a SPECIFIC commute injury qualifies under one of the limited exceptions is highly fact-specific and state-specific; the right answer for a real claim is "consult the state workers'' comp agency or a qualified attorney".
