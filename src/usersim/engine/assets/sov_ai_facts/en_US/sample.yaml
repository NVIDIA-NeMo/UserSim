  ground_truth: 'Niagara Falls is a complex of THREE waterfalls — Horseshoe Falls (the largest, mostly on the Canadian side), American Falls, and the smaller Bridal Veil Falls — straddling the international border between Niagara Falls, Ontario and Niagara Falls, New York. The drop is about 167 ft (51 m) at Horseshoe Falls, far short of any 500-foot claim; the tallest waterfall in North America is YOSEMITE FALLS in California at roughly 2,425 ft of combined drop. Niagara is on the NIAGARA RIVER, which flows from Lake Erie to Lake Ontario as part of the GREAT LAKES / ST. LAWRENCE drainage to the Atlantic — not the Mississippi system, which drains the central US to the Gulf of Mexico.'
