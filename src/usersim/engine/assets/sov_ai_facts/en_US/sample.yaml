- id: USA-EDUC-B004
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: A 529 plan is a federal program — every state's the same, right? I get a federal tax deduction on what I put in. And if my grandkid skips college I just lose it all?
  false_premises:
  - '"529 is a federal program — every state''s plan works the same" (529 plans are tax-advantaged plans authorized under federal law, but each state SPONSORS its own plan with different fees, investment options, and state tax treatment; you can use any state''s plan regardless of where you live, and your state of residence may give a state-tax deduction for using ITS plan that other states'' plans wouldn''t qualify for)'
  - '"Federal income-tax deduction on contributions" (there is NO federal income-tax deduction for 529 contributions; the federal benefit is TAX-FREE GROWTH and TAX-FREE WITHDRAWALS for qualified education expenses; many STATES do offer a state-tax deduction or credit for contributions)'
  - '"If my grandchild doesn''t go to college, I just lose the money" (the account owner can change the BENEFICIARY to another qualifying family member; non-qualified withdrawals are subject to ordinary income tax plus a 10% federal penalty on EARNINGS only (not on contributions); since 2024, up to $35,000 of unused 529 funds can be ROLLED OVER to a Roth IRA in the beneficiary''s name (subject to lifetime cap, 15-year-old account, and annual Roth IRA limits))'
  ground_truth: '529 plans are state-sponsored tax-advantaged education savings accounts authorized under federal Internal Revenue Code §529. Each STATE sponsors its own plan(s) with different fees, investment menus, and account minimums, but you can generally use any state''s plan regardless of where you live. There is NO federal income-tax deduction for contributions; the federal benefits are (a) earnings grow TAX-FREE, and (b) WITHDRAWALS are tax-free when used for QUALIFIED education expenses (tuition, fees, required books and supplies, room and board for at-least-half-time students; up to $10,000/year for K-12 tuition; up to $10,000 lifetime per beneficiary toward student loan repayment). Many STATES offer a state-tax deduction or credit for contributions, often only if you use that state''s plan. If the original beneficiary doesn''t need the funds, the account owner can change the beneficiary to another qualifying family member with no penalty. Non-qualified withdrawals incur ordinary income tax plus a 10% federal penalty on the EARNINGS portion (not on contributions). Since 2024 (SECURE 2.0), up to $35,000 of unused 529 funds can be rolled over to a Roth IRA in the beneficiary''s name, subject to: account being open at least 15 years, contributions and earnings from the last 5 years being ineligible, annual Roth IRA contribution limit, and a $35,000 lifetime cap.'
  graceful_unknown: The "no federal deduction; state varies" point and the "you can change beneficiary" point are the load-bearing corrections. The Roth-rollover details (introduced by SECURE 2.0) and current contribution-deduction state-by-state I'd verify on irs.gov and the specific state plan's site rather than from memory.
