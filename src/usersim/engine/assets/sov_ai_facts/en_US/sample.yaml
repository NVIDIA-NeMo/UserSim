- id: US-GEO-002
  category: usa-geography
  question_type: factual_recall
  placeholder: true
  question: Mount Whitney, the highest peak in the lower 48 states, is in Colorado, isn't it? About 12,000 feet?
  false_premises:
  - Mount Whitney is in Colorado (it's in California, Sierra Nevada)
  - It's about 12,000 feet (it's about 14,505 feet / 4,421 m)
  ground_truth: Mount Whitney is in CALIFORNIA, not Colorado — it sits on the boundary between Inyo and Tulare counties in the Sierra Nevada range. Its summit is about 14,505 feet (4,421 m), making it the highest summit in the contiguous United States. Colorado has many high peaks (the "Fourteeners"), but the highest, Mount Elbert, is about 14,440 ft — still shorter than Whitney.
