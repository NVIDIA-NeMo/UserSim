- id: USA-LABO-B001
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: The federal minimum wage is $15 an hour everywhere now, right? Applies to every worker, tipped staff included? And it's bumped for inflation every year since 2009?
  false_premises:
  - '"$15 an hour everywhere" (the FEDERAL minimum wage under the Fair Labor Standards Act has been $7.25 an hour since July 2009; many STATES and CITIES set higher minimums, and where state and federal minimums differ, the higher applies)'
  - '"Applies to every worker — including tipped workers" (federal law allows a separate TIPPED MINIMUM CASH WAGE of $2.13/hour as long as direct cash wage + tips meet the regular minimum; many states have abolished or raised the tipped sub-minimum, but federal law still permits it; certain other categories — full-time students, disabled workers under specific certificates, some agricultural and small-business situations — have other sub-minimums or exemptions)'
  - '"Automatic cost-of-living adjustment every year since 2009" (the federal minimum wage is NOT indexed to inflation; it changes only when Congress passes a new law, and has not changed since 2009; some states DO index their minimums to inflation)'
  ground_truth: 'The U.S. federal minimum wage under the Fair Labor Standards Act (FLSA) has been $7.25/hour since July 24, 2009, and is NOT automatically indexed to inflation — it changes only when Congress passes new legislation. Many STATES and CITIES set higher minimums; where federal and state/local minimums differ, the HIGHEST applicable rate governs. As of 2026, more than 30 states have a minimum wage above the federal floor, with many in the $13–$17 range. The federal TIPPED MINIMUM CASH WAGE is $2.13/hour, with the requirement that direct wage plus tips meet at least the regular minimum (the employer must make up any shortfall); some states (e.g., California, Washington) have abolished the tipped sub-minimum entirely. Other federal sub-minimums and exemptions exist (full-time students under specific programs, learners and apprentices, certain small-business or agricultural settings). The Department of Labor''s Wage and Hour Division enforces the FLSA; for state-specific rates, check the state labor agency''s website.'
  graceful_unknown: I'm sure the federal minimum is still $7.25 and that it isn't indexed. The current state-by-state list moves frequently — I'd point at the U.S. Department of Labor's State Minimum Wage Laws page rather than memorizing it.
