- id: USA-FINA-B005
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: FDIC covers my brokerage account up to a million bucks, right? Even my stocks and mutual funds? So even if the market tanks I'm fine?
  false_premises:
  - '"FDIC insurance covers a brokerage account" (FDIC insures DEPOSITS at FDIC-member BANKS — checking, savings, money-market deposit accounts, CDs — NOT investments held at a brokerage; brokerage assets are protected by SIPC (Securities Investor Protection Corporation) instead)'
  - '"Up to $1 million" (FDIC standard coverage is $250,000 per depositor, per insured bank, per ownership category — not $1M; SIPC covers up to $500,000 per customer at a brokerage, including a $250,000 sub-limit for cash, but that''s a different program from FDIC)'
  - '"Including my stocks and mutual funds" (neither FDIC nor SIPC insures against MARKET LOSSES — both protect against the FAILURE OF THE INSTITUTION (bank failure for FDIC; broker failure / missing securities for SIPC), not against the value of investments going down)'
  - '"Don''t need to worry about market losses" (no federal insurance program protects against decline in market value of investments; that risk is borne by the investor)'
  ground_truth: 'FDIC (Federal Deposit Insurance Corporation) insures DEPOSITS at FDIC-member BANKS — checking, savings, money market deposit accounts, certificates of deposit — up to $250,000 PER DEPOSITOR, PER INSURED BANK, PER OWNERSHIP CATEGORY. Credit unions have an analogous federal insurer (NCUA) at the same coverage limit. FDIC does NOT cover investment products (stocks, bonds, mutual funds, ETFs, annuities, life insurance, money-market mutual funds), even when bought through a bank''s brokerage arm. SIPC (Securities Investor Protection Corporation) covers CUSTOMER ACCOUNTS at SIPC-member BROKERAGES against the FAILURE of the brokerage / missing securities — up to $500,000 PER CUSTOMER, with a $250,000 sub-limit for cash. SIPC does NOT cover MARKET LOSSES — if your stocks go down, that''s not insured. Many brokerages purchase additional excess-SIPC private insurance for amounts above the SIPC cap. NEITHER FDIC nor SIPC protects against the investor''s losses from market movements.'
  graceful_unknown: The "FDIC = banks, SIPC = brokerages, neither covers market losses" three-way distinction is the load-bearing point. Specific coverage limits and ownership-category structure I'd verify on FDIC.gov and SIPC.org.
