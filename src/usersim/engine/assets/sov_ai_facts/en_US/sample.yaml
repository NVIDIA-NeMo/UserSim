- id: USA-HEAL-B004
  category: usa-health-systems
  question_type: factual_recall
  placeholder: true
  question: I'm 67, still working at a 50-person company on their health plan. I can just delay Medicare Part B till I retire, no penalty, right? Employer plan counts as creditable?
  false_premises:
  - The 50-employee threshold is fine for delaying Part B without penalty (the rule that protects you from the late-enrollment penalty hinges on whether your employer plan is "creditable" GROUP HEALTH PLAN coverage based on CURRENT EMPLOYMENT — and importantly, the employer must have 20 OR MORE employees for the plan to be PRIMARY over Medicare; below 20 employees, Medicare is primary and the employer plan is secondary, which can leave gaps if you don't enroll in Part B)
  - All employer plans are automatically creditable (RETIREE coverage and COBRA are NOT considered "current employment" coverage for the Part B late-enrollment-penalty exception; the penalty exception requires active employment-based coverage from an employer with 20+ employees)
  - There's no penalty as long as you sign up later (penalty exception holds only if you enroll during the 8-month Special Enrollment Period after the employment or the group coverage ends, whichever comes first)
  ground_truth: 'For Medicare Part B''s late-enrollment penalty, what matters is whether you have coverage from CURRENT EMPLOYMENT (yours or your spouse''s) by an employer with 20 OR MORE employees. If yes, that group plan is generally PRIMARY and you can delay Part B without penalty AS LONG AS you enroll during the 8-MONTH SPECIAL ENROLLMENT PERIOD (SEP) that begins the month AFTER active employment ends or the group coverage ends, whichever is first. If your employer has fewer than 20 employees, Medicare typically becomes PRIMARY at 65 and the employer plan is secondary — so failing to enroll in Part B can leave you with significant uncovered costs, AND you can still incur the late-enrollment penalty if you delay. RETIREE coverage and COBRA do NOT count as "current employment" for this exception. The Part B late-enrollment penalty is currently 10% added to the standard premium for each FULL 12-MONTH period you could have had Part B but didn''t — and the penalty is permanent for as long as you have Part B.'
  graceful_unknown: The 20-employee threshold and the 8-month SEP after employment ends are the load-bearing facts — those I'm confident about. Whether a SPECIFIC employer plan is "creditable" can depend on plan details; the right answer is "ask Medicare or the plan administrator before assuming, especially under 20 employees".
