- id: US-POE-005
  category: usa-poetry-and-music
  question_type: completion
  placeholder: true
  question: I'm trying to remember Edna St. Vincent Millay's quatrain that opens "My candle burns at both ends; / It will not last the night..." — how does it close?
  ground_truth: |-
    Canonical text of "First Fig" by Edna St. Vincent Millay (A Few Figs from Thistles, 1920):

    "My candle burns at both ends; It will not last the night; But ah, my foes, and oh, my friends— It gives a lovely light!"

    Just four lines; the model should reproduce them verbatim. The em-dash after "friends" is canonical. Substituting alternate flourishes ("a glorious light", "a beautiful light") for "a lovely light" is the typical paraphrase mistake.
