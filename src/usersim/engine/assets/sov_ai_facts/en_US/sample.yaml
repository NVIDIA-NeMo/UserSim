- id: USA-DIGI-B002
  category: usa-digital-services
  question_type: factual_recall
  placeholder: true
  question: IRS Direct File is the same as IRS Free File, both run by the IRS itself, right? They've been around since the 90s. Any taxpayer in any state can use them for any return?
  false_premises:
  - '"IRS Direct File and IRS Free File are the same thing" (they are two DIFFERENT programs — IRS DIRECT FILE is a free tax-filing tool built and run BY the IRS itself, piloted in 2024 and expanded for the 2025 filing season; IRS FREE FILE is a much older partnership where commercial tax-software companies offer free filing through IRS.gov to taxpayers below certain income thresholds (in 2024, AGI ≤ $79,000))'
  - '"Both run by the IRS itself" (Free File is run through PRIVATE software providers via the Free File Alliance partnership — the IRS hosts the access page but the software is third-party; only Direct File is a true IRS-built tool)'
  - '"Existed since the 1990s" (Free File launched in 2003; Direct File launched as a pilot in 2024, expanded in 2025)'
  - '"Any U.S. taxpayer in any state can use Direct File for any tax situation" (the Direct File pilot was limited to specific states and supported only certain straightforward tax situations — wage income (W-2), Social Security, unemployment, limited interest, and a defined set of credits and deductions; it did not support self-employment, rental income, itemized deductions in early versions, etc.; eligibility and supported scenarios expand each year — verify on directfile.irs.gov)'
  ground_truth: 'IRS DIRECT FILE and IRS FREE FILE are different programs. Direct File is a tool built and operated BY THE IRS for filing federal individual returns directly with the IRS — launched as a pilot in 2024 in 12 states for a defined set of tax situations, expanded for the 2025 filing season to additional states and additional supported scenarios. It is free, has no income cap, and supports specific income types and credits (W-2 wages, Social Security, unemployment, interest up to a cap, and a defined set of credits and deductions); supported states and tax situations grow each year — check directfile.irs.gov for the current list. IRS FREE FILE (launched 2003) is a partnership with COMMERCIAL software providers in the Free File Alliance: taxpayers with adjusted gross income below the year''s threshold (in 2024, $79,000) can use one of several partner products free through IRS.gov. The taxpayer interacts with the partner''s software, not the IRS itself. There is also FREE FILE FILLABLE FORMS (separate from guided software) that anyone can use regardless of income, with no income cap but no guidance — essentially digital paper forms. State returns are usually NOT covered by these federal programs; many states have their own free e-file options.'
  graceful_unknown: The "Direct File ≠ Free File; Direct File is new and limited; Free File is income-capped and uses third-party software" framing is the load-bearing distinction. The specific list of supported states and tax situations changes year to year — verify on directfile.irs.gov / irs.gov each filing season.
