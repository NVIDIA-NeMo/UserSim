- id: USA-FINA-B001
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: There's just one credit score everyone has, right? Runs 0 to 1000, calculated by the federal government? And you have to pay to see it?
  false_premises:
  - '"Just one credit score" (consumers actually have MULTIPLE credit scores — different scoring models (FICO, VantageScore) and different score versions, plus separate scores at each of the three major credit bureaus (Equifax, Experian, TransUnion) — and lenders may use industry-specific variants like FICO Auto or FICO Bankcard scores)'
  - '"Runs 0 to 1000" (FICO and VantageScore generally run 300-850; some industry-specific FICO variants run 250-900, but neither standard model uses 0-1000)'
  - '"The federal government calculates it" (credit scores are calculated by PRIVATE companies — FICO (Fair Isaac Corporation) and VantageScore (a joint venture of the three credit bureaus); the data they score is reported by lenders to the three bureaus; the federal government regulates the system (Fair Credit Reporting Act, enforced by CFPB and FTC) but does not produce credit scores)'
  - '"Have to pay to see it" (consumers can get one FREE credit report from each of the three bureaus annually under the FCRA via annualcreditreport.com; many credit cards and banks now provide a free score, and the CFPB and many financial institutions provide free score-monitoring tools)'
  ground_truth: 'In the U.S., consumers have MULTIPLE credit scores rather than one universal number. The two dominant scoring models are FICO (Fair Isaac Corporation) and VantageScore — each with multiple versions, calculated separately at each of the three major credit bureaus (EQUIFAX, EXPERIAN, TRANSUNION). Standard FICO and VantageScore both use a range of 300-850 (higher = better); industry-specific FICO variants can use 250-900 ranges. Scoring inputs broadly include payment history (about 35% of FICO), amounts owed / utilization (about 30%), length of credit history (about 15%), credit mix (about 10%), and new credit (about 10%). The federal government does NOT compute the scores — credit reporting and scoring are private-sector activities regulated under the FAIR CREDIT REPORTING ACT (FCRA), enforced by the CFPB and FTC. Consumers are entitled to one FREE CREDIT REPORT per year from each of the three bureaus via annualcreditreport.com (the only government-mandated source); many cards and banks also offer free score access.'
  graceful_unknown: The "many scores, 300-850 range, private companies, free annualcreditreport.com" facts are the load-bearing corrections. Specific FICO weightings move version to version; the canonical source for the percentages is myfico.com or the CFPB.
