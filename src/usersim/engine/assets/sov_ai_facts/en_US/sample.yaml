- id: USA-EDUC-B006
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: K–12 schooling here's run mainly by the federal government, right? They set the national curriculum and fund most of it. The U.S. Department of Education wrote Common Core, didn't they?
  false_premises:
  - '"Run mainly by the federal government" (K-12 education in the U.S. is primarily a STATE and LOCAL responsibility; states set most education policy and funding rules through their own departments of education, and individual school districts handle day-to-day operations and curriculum decisions)'
  - '"Uniform national curriculum" (there is NO federally mandated national curriculum; standards and curricula are set at the state level — states adopt their own learning standards, with significant variation across states)'
  - '"Federal government pays for most school operating costs" (the federal share of K-12 funding is small — historically about 8-10% of total K-12 spending; the rest comes from state (roughly 47%) and local (roughly 45%) sources, primarily local property taxes for the local share)'
  - '"U.S. Department of Education writes Common Core" (the Common Core State Standards Initiative was a STATE-LED effort coordinated by the National Governors Association and the Council of Chief State School Officers, NOT written by the federal Department of Education; the federal government incentivized adoption through Race to the Top grants, but did not author the standards)'
  ground_truth: 'K-12 education in the U.S. is primarily a STATE and LOCAL responsibility. The U.S. Constitution does not enumerate education as a federal power, so it falls to the states under the Tenth Amendment. Each state has its own department of education that sets standards, curricula, graduation requirements, and oversight; LOCAL school districts (traditionally with elected school boards) handle day-to-day operations. The federal share of K-12 funding is roughly 8-10% of total spending; the rest is split roughly evenly between state and local sources (local funding is heavily reliant on property taxes, which contributes to inter-district funding inequality). The federal role is mostly through TARGETED programs — Title I (services for low-income students under ESSA, the Every Student Succeeds Act, 2015, which replaced No Child Left Behind), IDEA (Individuals with Disabilities Education Act, special education), school nutrition (USDA), civil-rights enforcement (Office for Civil Rights), and student data (NCES) — not through general operating funds or curriculum mandates. The COMMON CORE State Standards (for English and Math) were a STATE-LED initiative coordinated by the National Governors Association and the Council of Chief State School Officers, released in 2010; they were NOT written by the U.S. Department of Education, though the Obama administration encouraged adoption through Race to the Top competitive grants.'
  graceful_unknown: The state-and-local-primary structure of K-12 funding and authority is the load-bearing correction. The exact federal-share percentage and the most recent ESSA / IDEA reauthorization details I'd verify on ed.gov / NCES rather than committing to specifics.
