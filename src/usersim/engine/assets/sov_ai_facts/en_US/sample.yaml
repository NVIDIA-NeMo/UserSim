- id: US-POE-004
  category: usa-poetry-and-music
  question_type: completion
  placeholder: true
  question: Could you complete Frost's "Stopping by Woods on a Snowy Evening"? I know the famous closing — "And miles to go before I sleep, / And miles to go before I sleep" — but I want the full last stanza, not just the closing repetition.
  ground_truth: |-
    Canonical last stanza of "Stopping by Woods on a Snowy Evening" by Robert Frost (New Hampshire, 1923):

    "The woods are lovely, dark and deep, But I have promises to keep, And miles to go before I sleep, And miles to go before I sleep."

    The model should reproduce this verbatim. The famous double-line ending is the most-quoted closing in American poetry; the standard mistake is to truncate after a single "miles to go" or to alter "promises to keep" to "miles to keep" or similar.
  graceful_unknown: I know the closing repetition is "miles to go before I sleep" twice, but I'd rather not guess the exact wording of the rest of the stanza ("dark and deep" vs. similar variants are easy to muddle). The poem is in Frost's "New Hampshire" (1923) — that edition has the canonical text.
