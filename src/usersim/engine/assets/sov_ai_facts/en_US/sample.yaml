- id: USA-LABO-B006
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: '"Right-to-work" laws ban unions at the state level, right? They''ve been on the books in every state since Taft-Hartley back in 1935. And the NLRB is what enforces them?'
  false_premises:
  - '"Ban unions outright" ("right-to-work" laws do NOT ban unions or collective bargaining; they prohibit "union security" agreements that would require workers in a unionized workplace to PAY union dues or fees as a condition of employment — meaning workers in covered workplaces can opt out of paying without losing their job, but the union is still legally obligated to represent them)'
  - '"In every state since 1935" (right-to-work laws exist in roughly half the states (about 27, depending on the year and recent changes); they are STATE laws, not federal; the federal Taft-Hartley Act of 1947 (not 1935) Section 14(b) is what AUTHORIZES states to enact right-to-work laws if they choose; the Wagner Act / National Labor Relations Act was 1935)'
  - '"The NLRB enforces right-to-work" (the National Labor Relations Board administers the National Labor Relations Act for private-sector workers (excluding railway / airline workers, who fall under the Railway Labor Act); state right-to-work laws are enforced by STATE governments, not the NLRB)'
  ground_truth: '"Right-to-work" laws are STATE laws that prohibit "UNION SECURITY" agreements requiring workers in a unionized bargaining unit to pay union dues or "agency fees" as a condition of employment. They DO NOT ban unions or collective bargaining — workers can still vote to unionize, the union still bargains and represents the bargaining unit, but each individual worker may opt out of paying without losing their job. The legal foundation is Section 14(b) of the TAFT-HARTLEY ACT of 1947 (an amendment to the Wagner Act / NATIONAL LABOR RELATIONS ACT of 1935), which permits states to enact such laws. As of the mid-2020s, roughly 27 states have right-to-work laws on the books — concentrated in the South, Mountain West, and several states in the Midwest; coverage shifts over time (Michigan repealed its law effective 2024). The NATIONAL LABOR RELATIONS BOARD (NLRB) administers the NLRA for most private-sector employers and unions; railroad and airline workers are governed instead by the Railway Labor Act, administered by the National Mediation Board. Under JANUS v. AFSCME (2018), public-sector workers nationwide cannot be required to pay agency fees as a condition of employment — a Supreme Court ruling that effectively makes the public sector right-to-work everywhere.'
  graceful_unknown: The "right-to-work bans dues requirements, not unions" framing is the load-bearing correction; Taft-Hartley §14(b) being the federal authorization is also key. The exact current count of right-to-work states shifts; for that I'd point at the National Right to Work Legal Defense Foundation or BLS for an up-to-date list rather than commit to a specific number.
