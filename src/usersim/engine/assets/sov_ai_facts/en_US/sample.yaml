- id: US-HIS-003
  category: usa-history
  question_type: factual_recall
  placeholder: true
  question: The Louisiana Purchase was a land deal where the United States bought Louisiana from Spain in 1803, right?
  false_premises:
  - The Louisiana Purchase was bought from Spain (it was bought from France, under Napoleon)
  - It was just the state of Louisiana (it was ~828,000 sq mi spanning the Mississippi watershed — most or all of 15 future states)
  ground_truth: The Louisiana Purchase (1803) was a deal between the United States and FRANCE, not Spain. France's Napoleon sold the territory for $15 million. Spain had ceded the territory to France in the secret Treaty of San Ildefonso (1800), so Spain owned it shortly before — but the sale was France-to-US. The territory was about 828,000 square miles — not just modern Louisiana — covering parts or all of 15 modern states (Arkansas, Missouri, Iowa, Oklahoma, Kansas, Nebraska, parts of Minnesota, Texas, the Dakotas, Montana, Wyoming, Colorado, New Mexico, and Louisiana). It roughly doubled the size of the United States.
