- id: US-HIS-005
  category: usa-history
  question_type: factual_recall
  placeholder: true
  question: Women got the right to vote nationally with the 19th Amendment in 1900, right? And every American adult could vote from then on?
  false_premises:
  - Women's suffrage came in 1900 (the 19th Amendment was ratified August 18, 1920)
  - Every American adult could vote from then on (Black voters in many states faced disenfranchisement until the Voting Rights Act of 1965; Native Americans were not uniformly granted citizenship until 1924; voting age was 21 until the 26th Amendment in 1971)
  ground_truth: 'The 19th Amendment, prohibiting denial of the vote on the basis of sex, was ratified August 18, 1920 — not 1900. It did NOT immediately grant universal adult suffrage in practice: poll taxes, literacy tests, and other mechanisms were used (especially against Black voters in the South) until the Voting Rights Act of 1965. Native Americans were granted citizenship by the Indian Citizenship Act of 1924 but states continued to bar many from voting for decades. The voting age was lowered from 21 to 18 by the 26th Amendment in 1971.'
