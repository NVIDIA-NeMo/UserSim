- id: US-HIS-001
  category: usa-history
  question_type: factual_recall
  placeholder: true
  question: The U.S. Constitution was signed in Philadelphia in 1776, the same year as the Declaration of Independence, right? And it took effect immediately?
  false_premises:
  - The Constitution was signed in 1776 (signed September 17, 1787; the Declaration is the 1776 document)
  - It took effect immediately (it required ratification by 9 states; took effect March 4, 1789 after the 9th ratification in 1788)
  ground_truth: 'The Declaration of Independence is the 1776 document; the U.S. Constitution was signed at the Constitutional Convention in Philadelphia on September 17, 1787 — eleven years later. It did NOT take effect immediately: ratification by 9 of the 13 states was required (Article VII). New Hampshire became the 9th state to ratify on June 21, 1788; the Constitution went into effect on March 4, 1789. The Bill of Rights (the first 10 amendments) was ratified December 15, 1791.'
