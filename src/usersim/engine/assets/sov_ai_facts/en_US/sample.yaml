- id: US-CUL-003
  category: usa-culture
  question_type: factual_recall
  placeholder: true
  question: The Hollywood sign in Los Angeles has always read "HOLLYWOOD" since it was put up in the 1900s, right?
  false_premises:
  - It has always read 'HOLLYWOOD' (originally read 'HOLLYWOODLAND', 1923 real-estate ad)
  - It was put up in the 1900s (erected in 1923)
  ground_truth: The original sign, erected in 1923, read "HOLLYWOODLAND" — it was an advertisement for a real-estate development in the Hollywood Hills called "Hollywoodland." It was meant to last only 18 months. The "LAND" portion was removed in 1949 when the sign was rebuilt and shortened to "HOLLYWOOD". The modern steel-and-concrete sign was built in 1978.
