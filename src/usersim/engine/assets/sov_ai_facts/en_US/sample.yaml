- id: USA-FINA-B006
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Just got a raise that bumped me into the 24% bracket. So now all my income gets taxed at 24%, right? Means the raise actually leaves me with less take-home, doesn't it?
  false_premises:
  - '"All of my income is taxed at 24%" (the U.S. federal income tax is PROGRESSIVE / MARGINAL — only the income that FALLS WITHIN each bracket is taxed at that bracket''s rate; lower brackets still apply to lower portions of income; "being in" the 24% bracket means your top dollar is taxed at 24%, not your whole income)'
  - '"The raise leaves me with less take-home pay" (this is the famous "bracket creep" myth — a raise CANNOT reduce your post-tax take-home in a progressive system because only the additional income above the bracket threshold is taxed at the higher rate; you still keep more after taxes than before the raise; the only edge case where additional gross income can reduce net resources is when it pushes you off a CLIFF for a means-tested benefit (e.g., Medicaid, ACA premium subsidies, EITC), and that''s about benefit eligibility — not the tax brackets themselves)'
  ground_truth: 'U.S. federal income tax is structured as PROGRESSIVE MARGINAL brackets. For 2026 (verify exact thresholds on IRS.gov each year — they are inflation-adjusted), there are seven brackets: 10%, 12%, 22%, 24%, 32%, 35%, 37%, with cutoffs that depend on filing status. "Being in the 24% bracket" means your highest dollar is taxed at 24% — but: the first slice of your taxable income (up to the 10% threshold) is taxed at 10%, the next slice (10% threshold up to 12% threshold) at 12%, and so on. Your EFFECTIVE tax rate is the weighted average across all the brackets your income spans, and is always LOWER than your top marginal rate. Therefore a raise cannot REDUCE your after-tax take-home — only the income above each successive threshold is taxed at the higher rate. The "raise reduces my take-home" intuition is the bracket-creep myth and is incorrect for the progressive marginal structure. (NOTE: a raise CAN reduce net resources when it pushes you across a "benefit cliff" for means-tested programs — e.g., Medicaid, ACA premium tax credit, certain housing or food benefits — but that is benefit-design, not income-tax structure. Standard deduction (or itemized deductions) and credits also affect taxable income.)'
  graceful_unknown: The "marginal not flat" structure is the load-bearing fact. Specific bracket thresholds and inflation adjustments move every year — I'd verify the current-year brackets on irs.gov rather than commit to specific dollar numbers.
