- id: USA-DIGI-B006
  category: usa-digital-services
  question_type: factual_recall
  placeholder: true
  question: The US has had a comprehensive federal data-privacy law since the 90s, basically America's GDPR, right? Every American can access and delete their personal data and stop the sale of it, no matter the state?
  false_premises:
  - '"Comprehensive national data-privacy law since the 1990s" (the United States has NO single, comprehensive federal data-privacy law akin to the EU GDPR; the U.S. uses a SECTORAL approach with topic-specific federal statutes — HIPAA (health), GLBA (financial), COPPA (children under 13), FCRA (consumer credit), FERPA (education), Section 5 of the FTC Act (general unfair / deceptive practices), TCPA (telemarketing/SMS), CAN-SPAM (email), Privacy Act (federal-government-held data) — but no single overarching consumer-data-protection law)'
  - '"Same thing as GDPR" (GDPR (EU, 2018) is a comprehensive cross-sector law applying to virtually all processing of EU/EEA personal data; U.S. federal law has no equivalent; STATE laws vary widely — CCPA/CPRA (California), Virginia CDPA, Colorado CPA, Connecticut CTDPA, and many other state comprehensive privacy laws have rolled out since 2020, each with similar but DIFFERING definitions, rights, and applicability thresholds)'
  - '"Every American has the right to access, delete, restrict sale regardless of state" (these consumer rights exist for residents of states that have passed comprehensive privacy laws (and for Californians notably, under CCPA/CPRA), but residents of states WITHOUT such laws do not have a federal-level statutory right to access/delete from a private company outside the sectoral statutes; coverage depends on the state of residence and the controller''s footprint)'
  ground_truth: 'The United States has NO single comprehensive federal consumer data-privacy law equivalent to the EU GDPR. Federal law is SECTORAL: HIPAA (Health Insurance Portability and Accountability Act, 1996) for health information held by covered entities; GLBA (Gramm-Leach-Bliley Act, 1999) for financial institutions'' customer information; COPPA (Children''s Online Privacy Protection Act, 1998) for under-13 data online; FCRA (Fair Credit Reporting Act, 1970) for consumer reporting; FERPA (Family Educational Rights and Privacy Act, 1974) for student records; the Privacy Act of 1974 for records HELD BY federal agencies; FTC Act §5 for unfair / deceptive practices generally; sector laws for telemarketing (TCPA), email (CAN-SPAM), drivers'' license records (DPPA), and others. STATE comprehensive privacy laws have proliferated since 2018: California (CCPA 2018, CPRA 2020), Virginia, Colorado, Connecticut, Utah, Iowa, Indiana, Tennessee, Texas, Oregon, Montana, Delaware, New Jersey, New Hampshire, Kentucky, Maryland, Minnesota, and others (the precise list and effective dates change frequently). Each state law has its own scope, applicability thresholds, consumer rights (access, deletion, correction, opt-out of sale / targeted advertising / profiling), and enforcement mechanism. Federal proposals like the American Privacy Rights Act (APRA) have been introduced but as of 2026 have not become law. Verify current status via the IAPP US State Privacy Legislation tracker.'
  graceful_unknown: The "no comprehensive federal law; sectoral federal + patchwork state" structure is the load-bearing point. The exact list of states with comprehensive privacy laws and their effective dates moves quickly — the IAPP tracker is the canonical source.
