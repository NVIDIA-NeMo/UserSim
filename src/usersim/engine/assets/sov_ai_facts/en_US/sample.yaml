- id: USA-FINA-B003
  category: usa-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Roth IRA and Traditional IRA are basically interchangeable, right? Anyone can contribute to either at any income? And both give a tax deduction up to the limit?
  false_premises:
  - '"Basically interchangeable" (they have very different tax treatment — Traditional IRA contributions may be PRE-TAX (deductible) and the account grows tax-deferred, with withdrawals taxed as ordinary income in retirement; Roth IRA contributions are AFTER-TAX (no deduction) and qualified withdrawals (including all earnings) are TAX-FREE)'
  - '"Contribute regardless of income" (Roth IRA direct contributions are subject to MAGI-based phase-outs; in 2026 single filers begin to phase out around $150K MAGI and are fully ineligible above ~$165K (verify current-year IRS thresholds); Traditional IRA contributions are always allowed up to the limit if you have earned income, but the DEDUCTIBILITY is phased out if you (or your spouse) are covered by a workplace retirement plan)'
  - '"Tax deduction for both" (Roth IRA contributions are NOT tax-deductible — the trade-off is tax-free growth and tax-free qualified distributions; Traditional IRA contributions may or may not be deductible depending on income and workplace-plan coverage)'
  - '"Up to the annual limit" (the COMBINED contribution limit across BOTH Traditional and Roth IRAs is the same single annual cap — for 2026 the IRS adjusts annually; in recent years it has been $7,000 with a $1,000 catch-up for age 50+; verify the current-year limit)'
  ground_truth: 'Traditional and Roth IRAs are tax-advantaged retirement accounts with DIFFERENT tax structures. TRADITIONAL IRA: contributions may be tax-DEDUCTIBLE (full, partial, or none, depending on income and whether you or your spouse are covered by a workplace retirement plan); the account grows TAX-DEFERRED; withdrawals in retirement are taxed as ORDINARY INCOME; subject to Required Minimum Distributions starting at age 73 (rising to 75 for those born 1960 or later under SECURE 2.0). ROTH IRA: contributions are AFTER-TAX (NO deduction); the account grows TAX-FREE; QUALIFIED withdrawals (after age 59½ AND the account being open at least 5 tax years, with some exceptions) are TAX-FREE; NO RMDs during the original owner''s lifetime. Roth direct contributions are subject to MAGI-BASED PHASE-OUTS (in 2026 phase-out ranges are around $150K-$165K for single, $236K-$246K for MFJ — verify on irs.gov each year); Traditional IRA contributions are allowed up to the limit if you have earned income, but the DEDUCTIBILITY phases out at workplace-plan-covered levels. The COMBINED annual contribution limit across both is a single cap (recent years $7,000, plus a $1,000 catch-up for age 50+; IRS adjusts annually). High earners can contribute to a Traditional IRA non-deductibly and convert to Roth (the "backdoor Roth"), subject to pro-rata rules.'
  graceful_unknown: The structural difference (deduction now vs tax-free later, RMDs vs no RMDs, MAGI phase-outs only on Roth) is the load-bearing answer. Specific dollar amounts (contribution caps, phase-out thresholds, RMD ages) move year to year — for those, verify on irs.gov.
