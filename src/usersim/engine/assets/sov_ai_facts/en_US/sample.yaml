  ground_truth: 'U.S. adult passport renewal by MAIL uses Form DS-82, not DS-11. DS-11 is for first-time applicants, minors, and certain other cases that must be filed in person at an acceptance facility. To use DS-82 you must meet the eligibility rules (most-recent passport in your possession, undamaged, issued within the last 15 years when you were 16+, issued in your current name or with proof of name change). Standard application fee for an adult passport book in 2026 is $130; an in-person filing adds a $35 execution fee; expedited service costs an additional $60. Routine processing typically takes several weeks; expedited 2-3 weeks (verify the State Department''s posted current times before booking — they shift). For international travel, many destinations require at least SIX MONTHS of remaining validity beyond your planned date of entry — a passport that is still technically valid but expires within six months may be rejected at the destination or by your airline.'
