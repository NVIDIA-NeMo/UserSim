- id: US-CUL-005
  category: usa-culture
  question_type: factual_recall
  placeholder: true
  question: The Empire State Building in New York was designed by Frank Lloyd Wright, right? In the 1960s?
  false_premises:
  - Empire State Building was designed by Frank Lloyd Wright (designed by Shreve, Lamb & Harmon)
  - It was built in the 1960s (completed in 1931)
  ground_truth: The Empire State Building was designed by the architectural firm SHREVE, LAMB & HARMON, with William F. Lamb as the principal designer — not Frank Lloyd Wright. Construction began March 17, 1930, and the building was officially opened May 1, 1931 (not the 1960s). Frank Lloyd Wright is famous for buildings like Fallingwater (1935-1939), the Solomon R. Guggenheim Museum in New York (designed 1943-59, opened 1959), and the Robie House (1909) — but not the Empire State Building.
