- id: USA-DIGI-B004
  category: usa-digital-services
  question_type: factual_recall
  placeholder: true
  question: For open enrollment I just use any site with "Medicare" in the URL — that's the official tool, right? And those "Medicare experts" who keep calling me unsolicited work directly for Medicare?
  false_premises:
  - '"Any site with ''Medicare'' in the URL is official" (the OFFICIAL government site is medicare.gov; many private broker, insurance-marketing, and lead-generation websites use "medicare" in their domain (e.g., MedicareXyz.com, MedicareAdvantage[xyz].com) and are NOT government sites — they may steer toward plans that pay them commissions rather than the best plan for you)'
  - '"''Medicare experts'' calling me work directly for Medicare" (the Medicare program does NOT make unsolicited sales calls; CMS rules generally PROHIBIT unsolicited contact from agents/brokers without prior consent; unsolicited calls and door-knocks selling Medicare plans are usually from private brokers — and high-pressure or suspicious calls may be outright scams; Medicare also publishes the "TPMO" disclaimer rules requiring third-party marketing organisations to identify themselves and disclose they don''t offer every plan in the area)'
  - '"Open enrollment is the only time" (Medicare has multiple enrollment periods — Initial Enrollment Period at age 65; Annual Election Period (Oct 15–Dec 7) for Medicare Advantage and Part D plan changes; Medicare Advantage Open Enrollment Period (Jan 1–Mar 31) for switching back to Original Medicare or to a different MA plan; Special Enrollment Periods for qualifying life events like moving or losing other coverage)'
  ground_truth: 'For unbiased Medicare plan comparisons, the OFFICIAL tool is the Medicare Plan Finder at MEDICARE.GOV/plan-compare. Many third-party websites use "Medicare" in their domain or branding to look authoritative — these are NOT the official government tool, and many are operated by insurance brokers or marketing organisations that earn commissions when you enroll through them; their "comparisons" may be limited to plans whose carriers compensate them. Medicare itself does NOT make UNSOLICITED phone calls or visits to sell plans; CMS rules generally PROHIBIT agents and brokers from making unsolicited contact without prior consent. Third-Party Marketing Organisations (TPMOs) must follow CMS marketing rules, including disclaiming "We do not offer every plan available in your area..." in advertisements. Enrollment periods include: Initial Enrollment Period (3 months before through 3 months after the 65th-birthday month); Annual Election Period for MA and Part D (Oct 15–Dec 7); Medicare Advantage Open Enrollment Period (Jan 1–Mar 31); various Special Enrollment Periods. For free, unbiased counselling, every state has a SHIP (State Health Insurance Assistance Program) — find local SHIP via shiphelp.org. Report Medicare fraud to 1-800-MEDICARE.'
  graceful_unknown: The "medicare.gov is the only official tool; unsolicited Medicare sales calls are not from Medicare; SHIP for free unbiased help" facts are the load-bearing points. Specific enrollment-period dates I''m confident on but should be confirmed for any acutal plan change.
