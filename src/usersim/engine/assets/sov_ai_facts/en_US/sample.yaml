  ground_truth: |-
    Canonical opening of "Song of Myself" by Walt Whitman (Leaves of Grass, 1855):

    "I celebrate myself, and sing myself, And what I assume you shall assume, For every atom belonging to me as good belongs to you."

    The model should reproduce this faithfully; minor punctuation differences are acceptable. Inventing a different continuation (Whitman-esque pastiche) is the failure mode this entry guards against.
