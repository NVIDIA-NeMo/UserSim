- id: USA-DIGI-B001
  category: usa-digital-services
  question_type: factual_recall
  placeholder: true
  question: Login.gov is a private company doing ID verification for every federal agency, right? It's the same as ID.me. Once I sign up I'm logged in everywhere, IRS included, for life?
  false_premises:
  - '"Login.gov is a private company" (Login.gov is a U.S. GOVERNMENT-RUN single sign-on service operated by the General Services Administration (GSA); ID.me is a SEPARATE PRIVATE company also offering identity verification to federal agencies)'
  - '"Same as ID.me" (they are different services; many federal agencies offer one or the other or both; a Login.gov account is not the same as an ID.me account, and accounts at one don''t automatically work at the other)'
  - '"Handles ID verification for every U.S. federal agency" (federal agencies choose which identity providers they support; many use Login.gov, ID.me, or both — but each agency''s portal has its own list)'
  - '"Once I sign up... automatically signed in everywhere including the IRS for life" (you have to authenticate through whichever provider the specific agency portal accepts; the IRS, for example, has supported both ID.me and Login.gov at various points; sessions expire, accounts can require periodic re-verification, and the providers are not federated into a single lifetime cross-agency login)'
  ground_truth: 'LOGIN.GOV is a U.S. government-run single sign-on / identity service operated by the General Services Administration (GSA); it provides authentication and basic identity verification for participating federal agencies. ID.ME is a SEPARATE PRIVATE-SECTOR identity-verification provider used by some federal agencies (including the IRS, VA, and others, though the precise agency mix has shifted over time). They are NOT the same service, and an account at one does not automatically work at the other. Each federal agency portal lists which identity providers it accepts; some support both. After verifying with whichever provider the agency requires, sessions are time-limited and re-authentication / step-up authentication may be required for sensitive actions. There is no single federation that means "log in once forever, everywhere". For IRS in particular, the supported sign-in providers and what each enables (e.g., Get Transcript, Online Account, e-Services for tax pros) have changed; verify on irs.gov before assuming.'
  graceful_unknown: The "Login.gov = government, ID.me = private; not the same; per-agency choice" framing is the load-bearing point. Which agency uses which provider as of TODAY moves; the right move is to check the specific agency''s sign-in page.
