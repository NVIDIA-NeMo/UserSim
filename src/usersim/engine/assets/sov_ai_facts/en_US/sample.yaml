- id: USA-EDUC-B001
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: FAFSA's just for the federal Pell Grant, right? File it once for college and you're set. Only worth doing if you're under the income cutoff anyway?
  false_premises:
  - '"Only matters for federal Pell Grants" (the FAFSA is the gateway to the federal Pell Grant, federal Direct Loans (subsidized and unsubsidized), federal Work-Study, AND most state aid AND most institutional aid offered by colleges; many schools require a FAFSA on file before they will award their own scholarships and grants)'
  - '"File it once" (the FAFSA must be RE-FILED EVERY ACADEMIC YEAR to receive federal aid for that year)'
  - '"Only families below a strict income cutoff should bother" (there is NO strict income cutoff that disqualifies you; need-based aid like the Pell Grant has thresholds, but unsubsidized Direct Loans, parent PLUS loans, and most institutional / merit aid do not — and many colleges require FAFSA simply to be considered for any aid at all)'
  ground_truth: 'The Free Application for Federal Student Aid (FAFSA) is the gateway to ALL federal student aid — Pell Grants, federal Direct Subsidized and Unsubsidized Loans, Federal Work-Study, federal Parent PLUS Loans — and is also used by most state aid programs and most colleges'' own institutional aid programs. The FAFSA must be FILED EACH ACADEMIC YEAR to receive aid for that year. There is NO universal income cutoff that disqualifies a family from filing — need-based programs like Pell have their own thresholds (which depend on family size, number in college, and the new Student Aid Index since the FAFSA Simplification Act took effect for 2024-25), but unsubsidized loans, PLUS loans, and most merit / institutional aid do not require demonstrated financial need. The FAFSA opens each year (recently in October–December for the following academic year, but timing has shifted; check studentaid.gov for the current cycle); state and institutional priority deadlines vary widely and are often EARLIER than the federal deadline, so checking the school''s and state''s deadlines is critical.'
  graceful_unknown: The "every year, not once" and the "FAFSA gates more than just Pell" points are the load-bearing facts. Specific dollar amounts and the current-cycle opening date I'd verify on studentaid.gov rather than quote from memory.
