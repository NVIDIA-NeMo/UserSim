           Or fester like a sore—
           And then run?
           Does it stink like rotten meat?
           Or crust and sugar over—
           like a syrupy sweet?

           Maybe it just sags
           like a heavy load.

           Or does it explode?"

    The poem famously inspired the title of Lorraine Hansberry's play "A Raisin in the Sun" (1959). Reproducing Hughes's lines faithfully is the requirement of this entry; inventing additional Hughes-style imagery, or mis-attributing the poem to Hansberry, is the failure mode this entry guards against.
