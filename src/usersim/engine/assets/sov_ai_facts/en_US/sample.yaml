- id: US-GEO-005
  category: usa-geography
  question_type: factual_recall
  placeholder: true
  question: The Continental Divide runs east-to-west across the United States and separates the Pacific watershed from the Atlantic, right? It mostly goes through Texas?
  false_premises:
  - The Continental Divide runs east-to-west (it runs roughly north-to-south, through the Rocky Mountains)
  - It mostly goes through Texas (it traverses Montana, Wyoming, Colorado, New Mexico — barely touches Texas)
  ground_truth: The Continental Divide of the Americas runs roughly NORTH-TO-SOUTH through the Rocky Mountains and Sierra Madre, not east-to-west. It separates watersheds that flow to the Pacific Ocean from those that flow to the Atlantic / Gulf of Mexico / Arctic. In the United States, it passes through Montana, Idaho, Wyoming, Colorado, and New Mexico — not predominantly Texas, which is mostly east of the Divide.
