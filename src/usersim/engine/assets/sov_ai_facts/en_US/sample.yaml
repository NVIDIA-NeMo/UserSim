- id: USA-LABO-B002
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: At-will employment means they can fire me for any reason — even discrimination — with no recourse, right? But federal law still requires two weeks' notice and a written reason?
  false_premises:
  - '"Including discriminating against me, with no recourse" (at-will employment means termination can be for any reason OR no reason — but NOT for an UNLAWFUL reason; federal civil-rights laws (Title VII of the Civil Rights Act of 1964, ADEA, ADA, GINA, PDA) prohibit termination based on protected categories, and other federal and state laws prohibit retaliation for whistleblowing, exercising statutory rights, etc.)'
  - '"Federal law requires two weeks'' notice" (there is NO general federal requirement that employers provide advance notice of termination to individual employees; the WARN Act requires 60-day notice only for MASS LAYOFFS / plant closings at qualifying employers (typically 100+ employees, with 50+ workers affected within 30 days); a few states have additional notice rules, but no general two-week notice mandate)'
  - '"Reason in writing" (federal law generally does NOT require an employer to provide a written reason for termination, though some states require providing a "service letter" or similar on request, and unemployment-insurance proceedings may require employers to state a reason)'
  ground_truth: 'AT-WILL EMPLOYMENT is the default rule in 49 U.S. states (Montana is the major exception, requiring "good cause" after a probationary period) and means either side may end the employment relationship at any time, for any reason or no reason — but NOT for an UNLAWFUL reason. Unlawful reasons include termination based on a PROTECTED CHARACTERISTIC (race, color, religion, sex/pregnancy/sexual orientation/gender identity, national origin, age 40+, disability, genetic information — federally; states often add more), RETALIATION for protected activity (filing a complaint, whistleblowing, FMLA leave, jury duty, lawful concerted activity under the NLRA, etc.), or violation of public policy. There is NO general federal requirement that an employer give advance notice or a written reason for an INDIVIDUAL termination. The WARN Act requires 60-day advance notice of MASS LAYOFFS at qualifying employers (100+ employees, with 50+ affected). Some states have additional employee-protection laws — verify state-specific rules for accurate guidance.'
  graceful_unknown: The "at-will but with major statutory exceptions" framing is the load-bearing correction. Specific state variations (Montana's good-cause rule, state-level mini-WARN, additional protected categories beyond federal) I'd verify per state.
