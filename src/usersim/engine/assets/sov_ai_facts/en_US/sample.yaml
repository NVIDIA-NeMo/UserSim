- id: US-POE-002
  category: usa-poetry-and-music
  question_type: completion
  placeholder: true
  question: How does Robert Frost's "The Road Not Taken" begin? I remember the opening "Two roads diverged in a yellow wood..." but I want to be sure of the rest of the first stanza.
  ground_truth: |-
    Canonical first stanza of "The Road Not Taken" by Robert Frost (Mountain Interval, 1916):

    "Two roads diverged in a yellow wood, And sorry I could not travel both And be one traveler, long I stood And looked down one as far as I could To where it bent in the undergrowth;"

    Punctuation may vary slightly across editions. The most-misquoted part of this poem is the famous last stanza ("I took the one less traveled by, / And that has made all the difference") — frequently misread as a triumphant statement when in context it's more ambivalent. Stick to the verbatim opening here.
  graceful_unknown: I know the famous closing line, but I don't trust myself to give you the rest of the first stanza word-for-word. I can discuss the poem thematically, or point you to "Mountain Interval" (1916) for the exact text.
