- id: USA-EDUC-B005
  category: usa-education
  question_type: factual_recall
  placeholder: true
  question: If I switch to an IDR plan, my payment drops to 10% of my income, right? Balance gets forgiven after 10 years, recertify every 5. And it works for my private loans too?
  false_premises:
  - '"10% of my entire income" (IDR plans calculate the monthly payment based on DISCRETIONARY INCOME — adjusted gross income minus a percentage (typically 150–225%) of the federal poverty guideline for the borrower''s family size — not gross or total income; the percentage of discretionary income varies by plan (10–20%); some plans like SAVE protect a higher poverty-line amount before counting income)'
  - '"Forgiven after 10 years" (standard IDR forgiveness is at 20 OR 25 YEARS depending on the plan and the loans; 10-year forgiveness applies under PSLF for public-service workers, not for general IDR forgiveness)'
  - '"Recertify every 5 years" (income and family size must be RECERTIFIED EVERY 12 MONTHS for IDR plans)'
  - '"Covers private student loans too" (IDR plans are FEDERAL programs and apply ONLY to ELIGIBLE FEDERAL student loans; PRIVATE student loans are not covered)'
  ground_truth: 'Income-Driven Repayment (IDR) plans set monthly payments based on the borrower''s DISCRETIONARY INCOME — adjusted gross income (AGI) minus a poverty-guideline-based protection (150% to 225% of the federal poverty guideline for the borrower''s family size, depending on plan). The percentage of discretionary income paid is typically 10% (PAYE, REPAYE/SAVE for undergraduate-only borrowers in transition rules) up to 20% (ICR), with intermediate levels per plan. Forgiveness for the remaining balance occurs at 20 or 25 YEARS of qualifying repayment depending on plan and loan type — NOT 10 years. (PSLF is a separate program offering 10-year forgiveness for public-service employees.) Borrowers must RECERTIFY income and family size annually (every 12 months); failure to recertify on time can result in being moved off the IDR plan and unpaid interest being capitalised. IDR plans apply ONLY to ELIGIBLE FEDERAL Direct Loans (some FFEL loans qualify after consolidation); PRIVATE student loans are NOT eligible for federal IDR. Specific plans (PAYE, IBR, REPAYE/SAVE, ICR) have evolved frequently — verify current eligibility, formulas, and forgiveness timelines on studentaid.gov; some plans have been subject to litigation and rule changes.'
  graceful_unknown: The discretionary-income concept (not "all my income"), the 20/25-year forgiveness for IDR vs PSLF's 10 years, the annual recertification, and federal-only scope are the load-bearing corrections. The specific plan formulas and which IDR plans are currently open / accepting enrollments shift; for a real decision the right move is to check studentaid.gov and the Loan Simulator tool.
