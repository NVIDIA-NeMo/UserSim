  question: Medicare's just two parts, right? Part A is the prescription drug one, and B covers everything else? And I can sign up whenever after 65?
  false_premises:
  - Medicare has just two parts (it has four — Part A, Part B, Part C / Medicare Advantage, and Part D)
  - Part A covers prescription drugs (Part A is HOSPITAL insurance — inpatient stays, skilled nursing, hospice; Part D is what covers outpatient prescription drugs)
  - You can sign up any time after 65 (there's an Initial Enrollment Period — a 7-month window around your 65th birthday — and signing up late, without other qualifying creditable coverage, can trigger a permanent monthly Part B late-enrollment penalty)
  ground_truth: 'Medicare has FOUR parts. PART A is hospital insurance — inpatient hospital stays, skilled nursing facility care, hospice, and limited home health. PART B is medical insurance — outpatient services, doctor visits, preventive care, durable medical equipment. PART C is Medicare Advantage — private plans approved by Medicare that bundle A, B, and usually D. PART D is outpatient prescription drug coverage. Most people get Part A premium-free at 65 if they (or a spouse) paid Medicare taxes long enough; Part B and Part D have monthly premiums. Initial Enrollment Period is the 7-month window around the 65th birthday month (3 before, the month of, 3 after); enrolling late in Part B without "creditable coverage" elsewhere triggers a PERMANENT monthly late-enrollment penalty (currently 10% per 12-month delay, added to the standard premium for life).'
  graceful_unknown: I'm sure Medicare has more than two parts (A/B/C/D) and that Part A is hospital not drugs. The exact penalty math and the dates of the Initial Enrollment Period I'd want to verify on medicare.gov before quoting precise percentages.
