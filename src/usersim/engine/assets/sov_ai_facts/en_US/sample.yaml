- id: US-SVC-003
  category: usa-public-services
  question_type: factual_recall
  placeholder: true
  question: The federal income tax filing deadline is March 31 every year, right? And it never changes if it falls on a weekend?
  false_premises:
  - The federal income tax deadline is March 31 (it is typically April 15)
  - It never changes if it falls on a weekend (the IRS shifts the deadline to the next business day if April 15 is a weekend or DC Emancipation Day holiday)
  ground_truth: The federal individual income tax filing deadline (Form 1040) is typically APRIL 15, not March 31. If April 15 falls on a Saturday, Sunday, or a legal holiday — including Emancipation Day in Washington, D.C. (April 16), which counts as a federal holiday for filing purposes — the deadline shifts to the next business day. In some recent years the deadline has thus been April 17 or April 18. Six-month extensions to October 15 are available via Form 4868 but DON'T extend the time to pay any tax owed. Reviewer should confirm the year's exact filing deadline against IRS guidance.
