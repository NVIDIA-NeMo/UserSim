- id: USA-LABO-B003
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: FMLA gives every worker 12 weeks of paid leave a year, right? Any health or family reason, every employer has to offer it. Even on day one of a new job?
  false_premises:
  - '"12 weeks of PAID leave" (FMLA leave is UNPAID; the law guarantees JOB PROTECTION and continued group-health coverage during the leave but does not require payment; some employers offer paid leave of their own, and some states (CA, NY, NJ, MA, etc.) have separate state-level paid-family-leave programs)'
  - '"For any health or family reason" (FMLA covers SPECIFIC qualifying reasons: birth/adoption/foster placement of a child; care for a spouse, child, or parent with a serious health condition; the employee''s own serious health condition; specific military caregiver and qualifying-exigency reasons; not "any" health or family reason)'
  - '"Every employer regardless of size" (FMLA applies to private employers with 50+ EMPLOYEES within 75 miles, and to public agencies and public/private elementary and secondary schools; smaller employers are not federally covered)'
  - '"During my first month at a new job" (employees must have worked for the covered employer for AT LEAST 12 MONTHS (not necessarily consecutive) AND at least 1,250 hours during the prior 12 months to be eligible)'
  ground_truth: 'The Family and Medical Leave Act (FMLA, 1993) provides eligible employees up to 12 WORKWEEKS of UNPAID, JOB-PROTECTED leave in a 12-month period (26 weeks for military caregiver leave) for qualifying reasons: birth, adoption, or foster placement of a child; care for a spouse, child, or parent with a serious health condition; the employee''s own serious health condition; qualifying exigencies arising from a family member''s active military duty; or military caregiver leave. ELIGIBILITY: the employee must work for a covered employer (private with 50+ employees within 75 miles, OR public agency, OR public/private elementary/secondary school), have been employed at least 12 MONTHS (need not be consecutive), and have worked at least 1,250 HOURS in the previous 12 months. During FMLA leave, the employer must maintain GROUP HEALTH COVERAGE on the same terms as if the employee were working. FMLA leave is UNPAID at the federal level, though employees may be required (or permitted) to use accrued paid leave concurrently. State paid-family-leave programs in CA, NY, NJ, MA, RI, WA, CO, OR, CT, DC and others provide partial wage replacement separate from federal FMLA — coverage and benefits vary widely by state. Federal: enforced by U.S. Dept of Labor Wage and Hour Division.'
  graceful_unknown: The 12 weeks UNPAID + job-protected, 50-employee threshold, 12-month/1,250-hour eligibility, and qualifying-reason list are the load-bearing facts. State paid-family-leave program details I'd verify per state — they vary widely.
