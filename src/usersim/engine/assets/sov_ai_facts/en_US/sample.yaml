- id: USA-LABO-B004
  category: usa-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Unemployment insurance is federal, so it works the same everywhere, right? Even if I quit, I'd still get 26 weeks at the same benefit rate?
  false_premises:
  - '"Run by the federal government" (UI is a JOINT federal-state program; the federal level (FUTA, U.S. Dept. of Labor) sets baseline rules and provides funding for administration and extended benefits; STATES run their own UI programs with state-specific eligibility, benefit formulas, and durations)'
  - '"Anyone who loses a job — even by quitting voluntarily — qualifies" (eligibility generally requires the unemployment to be through NO FAULT of the worker — typically layoff or reduction in force; voluntary quits without "good cause" and terminations for serious misconduct generally DISQUALIFY; "good cause" is defined by state law)'
  - '"26 weeks of benefits" (regular UI duration varies by state; while many historically offered up to 26 weeks, several states have reduced regular maximums (e.g., Florida and North Carolina have offered as low as 12-16 weeks at times); some federally funded extensions have applied during recessions)'
  - '"At the same rate nationwide" (weekly benefit amounts are set by EACH STATE based on the worker''s prior earnings within state-specific formulas and CAPPED at state-specific maximums that vary widely — from the low $200s in some states to over $1,000 in others)'
  ground_truth: 'Unemployment Insurance (UI) in the United States is a JOINT federal-state program. The federal government, through the Federal Unemployment Tax Act (FUTA) and the Social Security Act, sets baseline rules and provides administrative funding and extended-benefit support; STATES run their own UI programs, set eligibility rules, benefit formulas, and benefit durations within the federal framework. ELIGIBILITY generally requires: (a) being unemployed through no fault of your own (typically layoff, reduction in force, position elimination); voluntary quits without state-defined "good cause" and terminations for misconduct are usually DISQUALIFIED; (b) meeting state-specific work-history and earnings requirements during a "base period" (typically the first four of the last five completed calendar quarters); (c) being able and available to work and actively seeking work. WEEKLY BENEFIT AMOUNTS are calculated from prior earnings using state-specific formulas, subject to state minimum and maximum caps that vary widely. REGULAR DURATION varies by state — many states historically offered up to 26 weeks, but several have reduced this in recent years (some as low as 12-16 weeks). Federal extended benefits and pandemic-era programs have temporarily extended durations in past recessions. Apply through the relevant state UI agency.'
  graceful_unknown: The federal-state joint structure is the most important correction. Specific state benefit amounts, durations, and quit / good-cause rules vary widely; for a real claim, the state UI agency is the authoritative source.
