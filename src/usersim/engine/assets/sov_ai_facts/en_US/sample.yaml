- id: US-POE-003
  category: usa-poetry-and-music
  question_type: completion
  placeholder: true
  question: Could you finish the opening stanza of that Emily Dickinson poem about hope? I remember it starts "Hope is the thing with feathers / That perches in the soul..." — what comes after?
  ground_truth: |-
    Canonical first stanza of Emily Dickinson's "Hope is the thing with feathers" (poem 254 / J 314, written ~1861, published posthumously):

    "Hope is the thing with feathers - That perches in the soul - And sings the tune without the words - And never stops - at all -"

    Dickinson uses idiosyncratic dashes; minor punctuation/capitalization variation is expected across editions. The Franklin and Johnson editions disagree on small details. Inventing a fluent-sounding continuation is the failure mode here.
  graceful_unknown: I know the iconic opening but Dickinson's exact line breaks and dashes vary by edition, and I'd rather not misquote her. I can talk about the poem and her general style, or point you to the Franklin or Johnson edition for the precise text.
