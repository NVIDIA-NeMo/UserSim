- id: US-GEO-003
  category: usa-geography
  question_type: factual_recall
  placeholder: true
  question: The Great Lakes are six lakes — Superior, Michigan, Huron, Erie, Ontario, and Champlain, right? Lake Champlain is the largest one?
  false_premises:
  - The Great Lakes are six in number (there are five)
  - Lake Champlain is one of the Great Lakes (it's a separate lake on the NY-VT-Quebec border)
  - Lake Champlain is the largest of them (Lake Superior is the largest of the actual Great Lakes by area)
  ground_truth: 'The Great Lakes are FIVE: Superior, Michigan, Huron, Erie, and Ontario. Lake Champlain is a separate body of water on the New York / Vermont border (extending into Quebec) and is NOT one of the Great Lakes — though it was briefly designated a "Great Lake" by US legislative quirk in 1998 before that was reversed. By area, Lake Superior is the largest of the five (~31,700 sq mi), and is the largest freshwater lake in the world by surface area.'
