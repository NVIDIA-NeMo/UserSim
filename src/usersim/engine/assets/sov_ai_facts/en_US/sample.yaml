- id: US-HIS-002
  category: usa-history
  question_type: factual_recall
  placeholder: true
  question: The Civil War ended at Appomattox when Robert E. Lee surrendered to William Tecumseh Sherman, right? Sometime in 1864?
  false_premises:
  - Lee surrendered to Sherman (Lee surrendered to Ulysses S. Grant; Sherman accepted Joseph E. Johnston's surrender separately at Bennett Place, NC)
  - It happened in 1864 (Appomattox surrender was April 9, 1865)
  ground_truth: Robert E. Lee surrendered the Army of Northern Virginia to ULYSSES S. GRANT (not Sherman) at Appomattox Court House, Virginia, on April 9, 1865 — not 1864. William Tecumseh Sherman, who had famously marched through Georgia in late 1864, accepted the larger surrender of Confederate forces under Joseph E. Johnston at Bennett Place near Durham, North Carolina on April 26, 1865 — a separate event. The Civil War formally ended over the following weeks as remaining Confederate forces surrendered.
