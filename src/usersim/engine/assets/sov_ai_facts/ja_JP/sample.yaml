  question: 高額療養費制度って、毎月100万円以上医療費がかかった場合だけ使える制度ですよね？収入に関係なく月10万円まで自己負担で、申請しないとお金が戻ってこないんでしたっけ？
  false_premises:
  - '"100万円以上だけ" (高額療養費制度は **医療費の総額** ではなく **自己負担額** が **月の上限額(自己負担限度額)** を超えた場合に適用される。所得によって異なるが、 **月数万円〜十数万円** が上限。70歳未満の標準報酬月額28万-50万円(年収約370〜770万円)の場合、自己負担限度額は約 **80,100円 + (医療費 - 267,000円) × 1%** 程度。「医療費100万円以上」が条件ではない)'
  - '"収入に関係なく月10万円" (自己負担限度額は **所得区分** により大きく異なる: 70歳未満で5区分(年収約1,160万円超は **約25万円**、約770万-1,160万円は約16.7万円、約370-770万円は約8.0万円、約370万円未満は **57,600円**、住民税非課税世帯は **35,400円**)、70歳以上は別の区分。「収入に関係なく10万円」は誤り)'
  - '"申請しないとお金が戻ってこない" (現在は **「限度額適用認定証」** の事前申請、もしくは **マイナ保険証(マイナンバーカードの保険証利用)** により、 **窓口で自己負担限度額までしか支払わない仕組み** が広く運用されている。事後申請(後で払い戻し)も可能だが、事前手続きすれば窓口での立替が不要)'
  ground_truth: '**高額療養費制度** は健康保険法に基づく自己負担軽減制度で、 **1か月(月初〜月末)の医療費の自己負担額** が **所得別の自己負担限度額(高額療養費の支給算定基準額)** を超えた場合、超過分が還付される制度。**70歳未満の所得区分**(2025年現在): 区分ア(標準報酬月額83万円以上、年収約1,160万円超) → **252,600円 + (医療費 - 842,000円)×1%** ; 区分イ(月額53万-79万円、約770万-1,160万円) → **167,400円 + (医療費 - 558,000円)×1%** ; 区分ウ(月額28万-50万円、約370-770万円) → **80,100円 + (医療費 - 267,000円)×1%** ; 区分エ(月額26万円以下、約370万円未満) → **57,600円** ; 区分オ(住民税非課税) → **35,400円** 。**多数該当**(同一世帯で過去12か月以内に3回以上高額療養費に該当している場合)、 **4回目以降** はさらに低い限度額が適用(例: 区分ウは **44,400円**) 。**70歳以上** にはさらに細かい区分。**世帯合算**: 同じ世帯で同じ月に複数の医療機関で自己負担が21,000円を超える場合、合算して限度額計算可能。**事前手続き**: (a) **限度額適用認定証** を保険者に申請 → 窓口提示で自己負担限度額のみ支払 ; (b) **マイナ保険証** ( **マイナンバーカードの保険証利用** ) → オンライン資格確認で自動的に限度額適用 ; どちらも事前手続き不要で窓口立替を回避できる。**事後申請** (払い戻し) も可能で、診療月から **2年以内** に保険者に申請。**対象とならないもの**: 入院時食事療養費の標準負担額、差額ベッド代、先進医療、保険適用外治療、自由診療、健診・予防接種、出産費用など。**詳細**は厚生労働省 (mhlw.go.jp) や加入する健康保険組合・協会けんぽ・市町村国保の窓口で確認。'
  graceful_unknown: 高額療養費制度は、月の自己負担額が所得区分別の限度額(70歳未満で約3.5〜25万円、平均的なサラリーマンで約8万円)を超えた場合、超過分が後日還付されます。マイナ保険証または限度額適用認定証を使えば窓口での立替も不要。世帯合算・多数該当などで上限がさらに下がる仕組みもあり。詳しくは加入する保険者または厚生労働省 (mhlw.go.jp) で確認。
  persona_tags:
