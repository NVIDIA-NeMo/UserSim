- id: JAPAN-FINA-B005
  category: japan-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 確定申告って、収入があれば誰でも毎年絶対やる必要ありますよね？申告期限は5月末で、税務署に直接書類を持っていくしかなくて、会社員も全員自分で申告するんでしたっけ？
  false_premises:
  - '"収入があれば誰でも絶対" (確定申告の **必要性は所得の種類・金額で異なる** : (a) **会社員(給与所得者)** は通常 **年末調整** で完結し、 **原則として確定申告不要** ; (b) **確定申告が必要な場合** = 給与年収2,000万円超、給与以外の所得が20万円超、2か所以上から給与受給、住宅ローン控除初年度、医療費控除、寄付金控除、ふるさと納税(ワンストップ特例使わない場合)、譲渡所得・退職所得等の特殊な所得など。「誰でも絶対」は誤り)'
  - '"5月末" (所得税の確定申告期限は **2月16日〜3月15日(原則)** 。「5月末」は誤り。 **消費税の個人事業主分は3月31日** までで別期限 ; 法人は事業年度終了から2か月以内)'
  - '"税務署に直接持参" (確定申告の方法は (1) **e-Tax(電子申告、国税庁オンラインシステム)** ── マイナンバーカード+ICカードリーダー or マイナポータル連携でスマホ申告も可能、添付書類省略可、24時間提出可 ; (2) **郵送** ── 消印有効 ; (3) **税務署への持参・投函** ── 営業時間内・時間外時間外収受箱投函可。 **直接持参のみ** ではない)'
  ground_truth: '日本の **確定申告** は **所得税法・国税通則法** 等に基づき、 **1暦年(1月1日-12月31日)の所得に対する所得税(復興特別所得税含む)を翌年3月15日までに自ら計算・申告・納付** する手続き。**所管**: **国税庁** ; 各 **税務署** (国税局の下部組織)が所轄。**確定申告が必要な人**: (1) **給与所得者(会社員)で確定申告が必要な場合**: (a) 給与年収 **2,000万円超** ; (b) 給与以外の所得(副業・株式譲渡益等で **特定口座(源泉徴収あり)** 以外・暗号資産・不動産所得等)が **年20万円超** ; (c) 2か所以上から給与を受け、年末調整されない給与+他所得が **年20万円超** ; (d) 災害減免法・住宅ローン控除初年度・医療費控除・雑損控除・寄付金控除(ふるさと納税ワンストップ特例外)等を受ける場合 ; (e) 退職所得で「退職所得の受給に関する申告書」未提出 ; (f) 同族会社の役員等で、その会社からの給与以外に貸付金利息等あり ; (2) **個人事業主・フリーランス** は事業所得・雑所得を申告(青色申告 or 白色申告) ; (3) **公的年金等収入が400万円超 or 公的年金以外の所得20万円超** の年金受給者 ; (4) **株式・投資信託の譲渡損失** を翌年以降3年間繰越控除する場合 等。**確定申告期間(所得税)**: **2月16日〜3月15日** (土日休日は翌平日)。**振替納税** = 4月20日前後に銀行口座から自動引落。**還付申告**(税金が戻る場合)は **1月初旬から5年間** いつでも提出可能。**消費税(個人事業主)** = **3月31日** まで(別期限) 。**提出方法**: (1) **e-Tax(電子申告)** = マイナンバーカード方式、ID・パスワード方式 ; (2) **郵送** (消印有効) ; (3) **税務署窓口** 持参 ; (4) **e-Tax/マイナポータル連携** で **マイナンバーカード読取り対応スマホ + マイナポータルアプリ** で申告可能(2024年以降、ますます機能拡大)。**確認・支援**: **国税庁ホームページ「確定申告書等作成コーナー」** (kakushin.nta.go.jp) ── 自動計算機能で書類作成 ; 確定申告期間中は **税務署・確定申告会場** での相談・申告(混雑緩和でLINE予約制が一般化)。 **所得控除14種** ・ **税額控除** の正確な適用は税理士相談も推奨(複雑な場合)。詳細は **nta.go.jp** で。'
  graceful_unknown: 所得税の確定申告期間は2月16日〜3月15日(消費税の個人事業主は3月31日まで)。会社員は通常年末調整で完結し申告不要、給与年収2,000万円超・副業20万円超・住宅ローン控除初年度・医療費控除等で必要に。提出はe-Tax(マイナンバーカード)、郵送、税務署窓口、スマホ申告(マイナポータル連携)が選べる。所管は国税庁、窓口は各税務署。詳しくは nta.go.jp で。
