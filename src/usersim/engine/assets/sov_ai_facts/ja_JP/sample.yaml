    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — 国税通則法 ; 電子帳簿保存法 ; 国税庁 (nta.go.jp); e-Tax (e-tax.nta.go.jp); マイナポータル (myna.go.jp).
- id: JAPAN-DIGI-B005
  category: japan-digital-services
  question_type: factual_recall
  placeholder: true
  question: 日本のサイバーセキュリティ対策って、警察庁だけが担当ですよね？個人がフィッシング被害に遭ったら、すべて警察に通報するのが正しいルートで、政府には通報窓口はないんでしたっけ？
  false_premises:
  - '"警察庁だけが担当" (サイバーセキュリティは **複数の組織が分担** : (1) **NISC(内閣サイバーセキュリティセンター)** = 政府機関・重要インフラの戦略・調整 ; (2) **警察庁(サイバー警察局・サイバー特別捜査隊)** = サイバー犯罪の捜査・摘発 ; (3) **総務省・経済産業省** = 通信・産業セキュリティ ; (4) **個人情報保護委員会** = 個人情報保護 ; (5) **JPCERT/CC** = 民間のCSIRT統括(JPCERTコーディネーションセンター) ; (6) **IPA(情報処理推進機構)** = 民間情報セキュリティ全般・脆弱性情報 ; 警察庁単独ではない)'
  - '"政府には通報窓口がない" (政府関連の **多数の通報・相談窓口** がある: (a) **警察相談ダイヤル「#9110」** ; (b) **都道府県警察のサイバー犯罪相談窓口** ; (c) **国民生活センター・消費生活センター(消費者ホットライン188)** = フィッシング・ネット詐欺被害相談 ; (d) **IPA「情報セキュリティ安心相談窓口」** ; (e) **フィッシング対策協議会** (jpcap.or.jp) = フィッシングサイト報告窓口、メール送信報告 antiphish@antiphishing.jp ; (f) **金融機関への被害連絡** = 不正送金・カード被害は速やかに金融機関へ。「政府窓口なし」は誤り)'
  ground_truth: '日本の **サイバーセキュリティ体制** は **「重層的な分業」** が特徴で、複数の組織が役割分担。**国家戦略・調整**: **NISC(内閣サイバーセキュリティセンター)** ── 内閣官房に設置(2014年)、政府機関と重要インフラのセキュリティ統括・戦略策定 ; **2025年4月から「能動的サイバー防御(active cyber defense)」体制への移行** が検討されており、より権限のある組織への発展案を法案化中(法案名「重要電子計算機に対する不正な行為による被害の防止に関する法律案」、2024年内閣提出予定)。**法律基盤**: **サイバーセキュリティ基本法(2014年公布、2015年施行)** ── 国の責務、官民連携、人材育成等を規定。**主な組織と役割**: (1) **NISC** = 戦略・調整・政府機関統括(GSOC運用) ; (2) **警察庁サイバー警察局・サイバー特別捜査隊(2022年4月設置)** = サイバー犯罪捜査・摘発 ; (3) **デジタル庁** = 政府情報システムのセキュリティ標準・調達 ; (4) **総務省** = 通信事業者規制・国民へのリテラシー啓発 ; (5) **経済産業省** = 産業界のセキュリティ・ISMS・サプライチェーン対策 ; (6) **個人情報保護委員会** = 個人情報漏えい対応 ; (7) **金融庁** = 金融機関セキュリティ ; (8) **IPA(独立行政法人情報処理推進機構)** = 民間向け情報セキュリティ普及啓発・SECURITY ACTION・脆弱性情報届出制度 ; (9) **JPCERT/CC(一般社団法人JPCERTコーディネーションセンター)** = 民間CSIRTのHub、インシデント対応調整、脆弱性情報のCVE発行協力 ; (10) **フィッシング対策協議会** = フィッシング情報集約・啓発(antiphishing.jp) 。**個人や中小企業がサイバー被害に遭った場合の通報・相談窓口**: (a) **金融機関 直ちに連絡** (不正送金・カード被害) ; (b) **警察相談ダイヤル #9110** または **都道府県警察サイバー犯罪相談窓口** ; (c) **消費者ホットライン 188** ; (d) **IPA「情報セキュリティ安心相談窓口」** ; (e) **フィッシング対策協議会** = 報告先 reportphishing@antiphishing.jp ; (f) **JPCERT/CCインシデント報告フォーム** (info@jpcert.or.jp) ── 主に技術的事案 ; (g) **個人情報保護委員会** ── 個人情報漏えい等の場合。詳細は **nisc.go.jp** ・ **ipa.go.jp** ・ **jpcert.or.jp** で確認。'
  graceful_unknown: 日本のサイバーセキュリティ体制は重層的な分業 ── NISC(内閣サイバーセキュリティセンター、戦略・政府機関統括)、警察庁サイバー警察局(犯罪捜査)、デジタル庁・総務省・経産省・個情委・金融庁、IPA(民間啓発)、JPCERT/CC(民間CSIRTハブ)、フィッシング対策協議会等。個人の被害通報は警察相談 #9110、消費者ホットライン188、IPA、フィッシング対策協議会等。詳しくは nisc.go.jp、ipa.go.jp、jpcert.or.jp で。
