- id: JAPAN-EDUC-B002
  category: japan-education
  question_type: factual_recall
  placeholder: true
  question: 大学受験は今でも「センター試験」でしたっけ？2回まで受験できて、結果は1点単位で大学に直接送られるシステムでしたっけ？
  false_premises:
  - '"今もセンター試験" (大学入試センター試験は **2020年1月** を最後に廃止、 **2021年1月** から **大学入学共通テスト** に名称・形式が変更された。新しい試験は思考力・判断力を重視し、記述式問題は当初導入予定だったが、採点公平性の懸念から **国語と数学への記述式は2020年12月に見送り** が決定。「センター試験」の名称は現在は誤り)'
  - '"2回まで受験" (共通テストは **年1回(1月中旬の土・日2日間)** のみ実施。同一年度内に複数回の受験機会はない。1月の本試験のほか、病気・公共交通機関の遅延等で本試験を受けられなかった人向けの **追試験** (1月下旬-2月上旬)があるが、これは **救済措置** であって自由に2回受験できるわけではない)'
  - '"1点単位で大学に直接送られる" (得点は **1点単位** だが、 **共通テストの得点提供** は受験生本人にも翌年度4月以降にしか開示されず(自己採点で出願)、大学にも自動送付される仕組みだが、 **大学側は独自に2次試験(個別学力検査)** を行い、 **共通テスト得点 + 2次試験 + 調査書** などで総合判定。「1点単位で送られて即合否」は不正確)'
  ground_truth: '日本の **大学入試** は **2021年1月実施分** から **大学入学共通テスト** に移行(主催: **独立行政法人 大学入試センター** 、 **文部科学省所管**) 。**変遷**: (1) 1979-1989年 = **共通第一次学力試験** (国公立大学のみ対象) ; (2) **1990-2020年 = 大学入試センター試験** (国公立・私立を問わず利用可能) ; (3) **2021年〜 = 大学入学共通テスト** (思考力・判断力重視へシフト) 。**現行制度(共通テスト)の特徴**: (1) **年1回、1月中旬の土曜・日曜** の2日間実施 (本試験) 、 **追試験** は約2週間後 ; (2) 受験科目: 6教科30科目から最大8科目選択 (新課程対応の **2025年度入試** から「情報I」が新教科として追加、計7教科21科目体系へ移行) ; (3) **1点単位での得点** ; (4) **記述式問題は2020年に見送り** 決定、現行はマークシート方式 ; (5) **英語民間試験活用は2019年に見送り** 、共通テスト英語(リーディング100点 + リスニング100点)で実施。**大学入試の3形態**: (1) **一般選抜(旧・一般入試)** ── 共通テスト + 大学独自の **個別学力検査(2次試験)** で合否判定。国公立は前期日程・後期日程・(中期日程)に分かれる。私立はパターン多様 ; (2) **学校推薦型選抜(旧・推薦入試)** ── 高校長推薦が必要、 **指定校制** または **公募制** ; (3) **総合型選抜(旧・AO入試)** ── 大学が求める学生像(アドミッション・ポリシー)に基づき、調査書・小論文・面接・実技などで総合判定。**出願時期**: 大学入試センター(共通テスト)は **9月下旬-10月初旬** 出願 ; 国公立2次試験は **1月下旬-2月上旬** 出願、 **2月下旬** 前期試験 、 **3月中旬** 後期試験 ; 私立は10月-2月で大学ごとに異なる。**合格発表**: 国公立前期は3月初旬、後期は3月20日前後。**所管**: **文部科学省** ; **大学入試センター** (dnc.ac.jp) 。詳しくは **dnc.ac.jp** および各大学の入試サイトで確認。'
  graceful_unknown: 大学入試センター試験は2020年1月で廃止、2021年1月から「大学入学共通テスト」に。年1回の1月実施(本試験+追試験)、マークシート方式、記述式問題と英語民間試験は見送り。2025年度から「情報I」が新教科で追加。一般選抜は共通テスト+各大学2次試験+調査書、学校推薦型・総合型もある。所管は文部科学省、実施は大学入試センター(dnc.ac.jp)。
