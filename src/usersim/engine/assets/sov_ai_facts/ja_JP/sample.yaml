- id: JP-GEO-004
  category: japan-geography
  question_type: factual_recall
  placeholder: true
  question: 琵琶湖は日本で2番目に大きい湖で、関東地方にあるんですよね？
  false_premises:
  - 琵琶湖は2番目に大きい湖（実際は最大の湖）
  - 関東地方にある（実際は近畿地方の滋賀県）
  ground_truth: 琵琶湖は日本で「最大」の湖(面積約669平方km)で、2番目ではあり ません。所在地は近畿地方の滋賀県で、関東地方ではありません。 関東地方で最大の湖は霞ヶ浦(茨城県、面積約168平方km)で、これは 日本で2番目に大きい湖です。琵琶湖は約400万年以上の歴史を持つ 古代湖で、世界でも有数の長寿命の湖のひとつ。固有種を多く擁し、 生物地理学的にも重要です。京阪神地域の上水源としても機能して います。
