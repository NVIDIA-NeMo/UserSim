  question: 百人一首の有名な歌で、紀貫之の「人はいさ心も知らず…」 で始まる歌があったと思います。下の句がどうしても出てこない のですが、続きを教えてください。
  ground_truth: |-
    『古今和歌集』巻第一・春歌上、紀貫之(きのつらゆき、872年頃- 945年頃)の歌で、『百人一首』第三十五番:

    「人はいさ心も知らずふるさとは花ぞ昔の香に匂ひける」 (ひとはいさ こころもしらず ふるさとは はなぞむかしの かににおいける)

    旧知の宿に久しぶりに訪れた際、主人に「昔と変わらず」と冗談 めかして言われた返しの歌として知られます。「いさ」(さあ どうだろうか、知らない、の意)の用法が和歌的雅趣として 重要です。古今集の「仮名序」を書いた貫之は、和歌史において 最重要人物のひとりに位置付けられます。
  graceful_unknown: 百人一首にあるのは確かで、上の句「人はいさ心も知らず」までは 自信がありますが、下の句の細部(「花ぞ」か「花の」か、 「香に匂ひける」の表記など)を正確に思い出せないので、 『古今和歌集』『百人一首』のテクストを直接参照されることを お勧めします。
