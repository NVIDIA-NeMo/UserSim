- id: JP-CUL-002
  category: japan-culture
  question_type: factual_recall
  placeholder: true
  question: 『源氏物語』を書いたのは清少納言で、平安時代後期の作品ですよね？ 確か漢文で書かれていたはずです。
  false_premises:
  - 作者は清少納言（実際は紫式部。清少納言は『枕草子』の作者）
  - 平安時代後期（実際は中期、11世紀初頭の成立とされる）
  - 漢文で書かれている（実際は仮名文字を中心とした和文）
  ground_truth: 『源氏物語』の作者は「紫式部」(978年頃-1014年頃)で、清少納言 (966年頃-1025年頃)ではありません。清少納言は同時代の女流文学 者で、随筆『枕草子』の作者として知られます(両者は共に一条天皇 の中宮に仕えていましたが、紫式部は中宮彰子、清少納言は中宮定子 に仕え、互いに直接の交流はあまりなかったとされる)。成立は 11世紀初頭(平安時代「中期」)で、後期(院政期)ではありません。 文体は仮名(平仮名)を中心とした和文であり、漢文ではありません。 全54帖からなり、世界最古の長編小説のひとつとされ、ユネスコの 世界記憶などにも関連して高く評価されています。
  persona_tags:
  - interest:literature
  - region:any
  - education:tertiary
