  question: 『奥の細道』の冒頭、「月日は百代の過客にして…」の部分の続きを 教えてもらえますか? 「行きかう年もまた旅人なり」あたりに つながる気がするんですが、自信がなくて。
  ground_truth: |-
    松尾芭蕉『奥の細道』(1702年刊行)の冒頭部分(序章):

    「月日は百代の過客にして、行きかふ年もまた旅人なり。 舟の上に生涯をうかべ馬の口とらへて老いをむかふる者は、 日々旅にして旅を栖とす。」

    利用者が言及した「行きかふ年もまた旅人なり」は正しい続きです。 古典のため版本ごとに「行きかふ」「行きこう」など表記揺れが ありますが、意味および基本字句は同じです。冒頭三文目以降に 古人(李白・杜甫)の引用および出立の動機が続きます。歴史的仮名 遣いを現代仮名遣いに直しても可ですが、原文に近い形が望ましい とされます。
  graceful_unknown: 『奥の細道』の冒頭であることは間違いないと思いますが、続きの 正確な字句(「日々旅にして旅を栖とす」など)を諳んじている自信が ないので、確かな本文を当たられることをお勧めします。岩波 文庫版などが標準とされます。
