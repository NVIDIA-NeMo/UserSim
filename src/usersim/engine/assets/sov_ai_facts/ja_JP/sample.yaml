- id: JAPAN-HEAL-B004
  category: japan-health-systems
  question_type: factual_recall
  placeholder: true
  question: 健康診断は国が国民全員に毎年無料でやってくれて、結果がガンだったら自動で治療も国費でカバーされるんでしたっけ？市町村で受ける健診と職場の健診は同じ内容ですよね？
  false_premises:
  - '"国民全員に無料" (健診は **対象者によって制度が異なる** : (1) 会社員等は **労働安全衛生法** に基づき **事業者に実施義務** (一般健康診断、雇入時・定期、原則無料) ; (2) 40〜74歳は **特定健康診査(特定健診、メタボ健診)** ── 高齢者医療確保法に基づき各保険者(健保・協会けんぽ・国保等)に実施義務、 **無料または少額負担** ; (3) 75歳以上は **後期高齢者医療制度** で健診 ; (4) 市町村住民健診(各種がん検診・骨粗鬆症健診など)は市町村ごとに対象・自己負担額が異なる(数百〜数千円の自己負担あり)。「国が無料で全員に」は不正確)'
  - '"ガンだったら治療も国費でカバー" (がん治療は通常の **公的医療保険** で給付され、 **自己負担3割** (現役世代)が原則。 **高額療養費制度** で月の自己負担に上限あり。「自動で国費全額」は誤り。一部の **指定難病** や **小児慢性特定疾病** は別の医療費助成制度があるが、 **がんは原則一般疾病扱い** )'
  - '"市町村と職場の健診は同じ内容" (実施根拠・項目が異なる: (a) **職場健診(労働安全衛生法に基づく定期健康診断)** ── 業務関連性重視、年1回 ; (b) **特定健診(40-74歳、保険者実施)** ── メタボリックシンドロームのリスク評価が中心、特定保健指導につなげる仕組み ; (c) **市町村がん検診** (胃・肺・大腸・子宮頸・乳の5がん検診、対象年齢・受診間隔は厚労省指針で異なる) ── がん早期発見が目的。同じではない)'
  ground_truth: '日本の健康診断・がん検診制度は **複数の根拠法に基づき重層的** に運営され、対象者・実施者・無料か有料かが異なる。**主な健診**: (1) **職場の定期健康診断** (労働安全衛生法第66条) ── 事業者に実施義務、雇入時健診と1年に1回の定期健診 ; 全費用は事業者負担 ; 主項目は身長・体重・血圧・尿検査・胸部X線・聴力・視力・血液検査(GOT/GPT/γ-GTP/HDL/LDL/中性脂肪/血糖等)・心電図(40歳以上)など; (2) **特定健康診査(特定健診)・特定保健指導** (高齢者医療確保法、 **2008年4月開始**) ── **40〜74歳** の医療保険加入者が対象、各保険者(健保組合・協会けんぽ・国保等)が実施義務、メタボリックシンドローム(腹囲、血圧、脂質、血糖)に着目 ; 無料または少額負担 ; リスク該当者には **特定保健指導** (動機付け支援・積極的支援) ; (3) **市町村がん検診** (健康増進法第19条の2) ── 市町村が住民を対象に実施、 **5がん検診** : 胃がん検診(50歳以上、2年に1回、内視鏡または胃X線) 、 **肺がん検診** (40歳以上、年1回、胸部X線+喀痰細胞診) 、 **大腸がん検診** (40歳以上、年1回、便潜血検査2日法) 、 **子宮頸がん検診** (20歳以上女性、2年に1回、細胞診) 、 **乳がん検診** (40歳以上女性、2年に1回、マンモグラフィ) ; 自己負担は市町村ごとに異なる(無料〜数千円) ; (4) **後期高齢者医療制度の健診** (75歳以上); (5) **乳幼児健診** (母子保健法、市町村実施); (6) **学校健診** (学校保健安全法、各学校)。**所管**: 厚生労働省 ; 一部は市町村・教育委員会・事業者。**がんと診断された場合の医療**: 原則、 **公的医療保険** で給付され、自己負担は3割(現役世代)、 **高額療養費制度** で月の自己負担に上限。 **がん診療連携拠点病院** (国指定、各都道府県に複数)で集学的治療提供。 **指定難病** (国指定の難病、約340疾病、医療費助成あり、自己負担割合・限度額は所得別)とは別制度。詳しくは **mhlw.go.jp**(厚生労働省) 、 **ganjoho.jp**(国立がん研究センター) 、各市町村窓口で確認。'
  graceful_unknown: 日本の健診は4本柱 ── (1)職場の定期健診(労安法、事業者実施)、(2)特定健診(40-74歳、保険者実施、メタボ重視)、(3)市町村がん検診(5がん、健康増進法)、(4)乳幼児・学校健診。無料または少額負担で内容も対象も別。がん治療は通常の公的医療保険+高額療養費制度。指定難病は別制度。詳しくは厚労省や各保険者・市町村で。
  persona_tags:
  - interest:health
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts ja_JP, 2026-05-06)
    last_reviewed: '2026-05-06'
    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — 労働安全衛生法 ; 高齢者医療確保法 ; 健康増進法 ; 母子保健法 ; 厚生労働省 (mhlw.go.jp); 国立がん研究センター (ganjoho.jp).
- id: JAPAN-HEAL-B005
  category: japan-health-systems
  question_type: factual_recall
  placeholder: true
  question: 救急車って、軽症でも「119」で呼べばどこでも無料ですよね？それとも今は呼ぶたびに料金が発生する地域もあるんでしたっけ？医者にかかれない夜間は #7119 という別番号もあるんですか？
  false_premises:
  - '"軽症でも無料、どこでも" (救急車自体の搬送料は **原則無料** だが、近年 **不要不急の利用抑制** のため、 **三重県松阪市** や **茨城県内の一部医療機関** などで、緊急性が低いと判断された搬送に **選定療養費(7,700円程度)** を救急搬送先病院での請求として加算する仕組みが2024年から段階的に導入された地域がある。「全国どこでも無料」は今後変動する見込み)'
  - '"#7119 は夜間専用" (#7119(救急安心センター事業)は **24時間対応** の電話相談窓口で、 **夜間専用ではない** 。看護師や相談員が体調や症状を聴き取り、(a)救急車を呼ぶべきか、(b)今すぐ受診すべきか、(c)翌朝・通常診療まで様子をみてよいか、を助言する。夜間に限らず日中も利用可能。地域差あり ── 全国一律展開ではなく、東京・大阪・横浜・札幌など主要都市・一部県のみ運用、未導入地域も多い)'
  ground_truth: '日本の救急医療体制と関連窓口について。**救急車(119番通報)**: (1) **総務省消防庁** が全国の消防本部を通じて運営、 **24時間365日** 対応 ; (2) **搬送料は原則無料** (公的サービス) ; (3) **2024年度** 以降、 **三重県松阪市** などで **緊急性が低いと判断された搬送について「選定療養費」(7,700円程度)** を搬送先病院から請求する仕組みを導入(救急車自体の料金ではないが、軽症・不要不急の利用抑制が目的) ; 全国に拡大の動きあり。**救急安心センター事業 #7119**: 総務省消防庁が推進する **電話相談窓口** で、 **24時間対応** (一部地域は時間限定) 。看護師・救急隊員OB・医師の助言で、(a)119番通報の必要性、(b)医療機関受診の必要性、(c)応急手当の方法 等を助言。 **2025年現在の実施地域**: 東京都・大阪府・神奈川県(横浜市・川崎市など)・北海道(札幌市・函館市など)・宮城県・福岡県(福岡市・北九州市)など主要都市と一部県、地域差あり。 **未導入地域** では地元の救急電話相談ダイヤルや夜間救急センターを利用。**子ども医療電話相談 #8000**: 厚生労働省事業、 **小児の急病時の電話相談** ; 全国都道府県で実施(時間帯は地域差あり、夜間や休日中心が多い) 。**ドクターヘリ事業**: 厚生労働省・総務省消防庁・各都道府県事業、医師・看護師同乗の救急ヘリ、約50機(2024年度)が全国配置。**救急医療体制(三段階)**: (1) **初期救急(休日夜間急患センター・在宅当番医)**: 軽症 ; (2) **二次救急(病院群輪番制等の救急告示病院)**: 入院・手術が必要 ; (3) **三次救急(救命救急センター)**: 重症・複合外傷など、約300施設。詳細は **fdma.go.jp**(消防庁) 、 **mhlw.go.jp**(厚生労働省) 、各市町村消防本部・都道府県の医療政策課で確認。'
  graceful_unknown: 救急車(119)は原則無料・24時間。 #7119(救急安心センター)は24時間電話相談で東京・大阪・横浜などで実施(地域差あり)。 #8000は子ども医療電話相談(夜間・休日中心、全国)。一部地域(松阪市など)では2024年度以降、軽症の救急搬送先病院で選定療養費(7,700円程度)を加算する仕組みが導入。詳しくは消防庁(fdma.go.jp)・厚労省(mhlw.go.jp)で。
