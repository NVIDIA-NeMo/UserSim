- id: JAPAN-POET-B006
  category: japan-poetry-and-music
  question_type: completion
  placeholder: true
  question: 文部省唱歌の「故郷(ふるさと)」って、「うさぎ追いし かの山〜」で始まる歌、ありますよね。1番と2番、3番の歌詞を教えてもらえますか？昭和初期の作詞家が作ったものでしたっけ？
  false_premises: []
  ground_truth: |
    **「故郷」(ふるさと、文部省唱歌)** ── 大正3年(1914年)6月発行の文部省編纂 **『尋常小学唱歌』第六学年用** に発表。**作詞: 高野辰之(1876-1947、長野県下水内郡豊田村(現・中野市)出身、国文学者・東京帝国大学教授); 作曲: 岡野貞一(1878-1941、鳥取県鳥取市出身、東京音楽学校(現・東京藝術大学)教授)**。

    **3番までの全歌詞**(原文):

    **1番**:
    兎(うさぎ)追(お)いし かの山
    小鮒(こぶな)釣りし かの川
    夢は今も めぐりて
    忘れがたき 故郷(ふるさと)

    **2番**:
    如何(いか)に在(い)ます 父母
    恙(つつが)無しや 友がき
    雨に風に つけても
    思い出(い)ずる 故郷

    **3番**:
    志(こころざし)を はたして
    いつの日にか 帰らん
    山は青き 故郷
    水は清(きよ)き 故郷

    **背景・特徴**:
    (1) **作詞者高野辰之** の故郷である長野県豊田村の風景を題材としたとされる。村内には「故郷」記念館がある。
    (2) **「うさぎ追いし」の "おいし"** は **「追いし」(過去の連体形、追った)** であり、「**美味しい(おいしい)**」ではない。よく誤解される。
    (3) 文部省唱歌は **明治-昭和初期** に学校で歌われた歌で、当初は文部省編纂、戦後は教科書会社編集、現在は学習指導要領に基づく音楽教科書に多くが採録。「故郷」は **小学校学習指導要領(昭和55年)** で **「歌唱共通教材」(必修)** に指定され、現在も小学6年生で歌う共通教材の一つ。
    (4) **2008年の北京オリンピック** で日本の選手応援歌として歌われたり、**東日本大震災(2011年)** 復興支援イベントなどで広く歌われ、「日本人の心の歌」とされている。
    (5) 高野辰之は他にも「春の小川」「春が来た」「朧月夜」「もみじ」など、いずれも文部省唱歌の代表作の作詞を手がけた。

    **出典**: 文部省編 『尋常小学唱歌』第六学年用 (1914);各種唱歌集・音楽教科書;中野市『高野辰之記念館』 (nakano-takanotatsuyuki.com)。
  graceful_unknown: '「故郷(ふるさと)」は大正3年(1914)の文部省『尋常小学唱歌』第六学年用に収録された唱歌で、作詞・高野辰之、作曲・岡野貞一。1番「うさぎ追いし かの山〜」、2番「如何に在ます 父母〜」、3番「志をはたして〜」の3番構成。1980年から小学校6年の歌唱共通教材に指定されています。「うさぎ追いし」の「おいし」は「追った」の意味で「美味しい」ではありません。'
