- id: JAPAN-FINA-B006
  category: japan-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: iDeCoって、20歳から始められて毎月いくらでも積み立てできる完全自由な貯蓄ですよね？60歳前にいつでも引き出せて、税金も全くかからないんでしたっけ？
  false_premises:
  - '"いくらでも積み立て可能" (iDeCo(個人型確定拠出年金)は **拠出限度額** が職業等で異なる: (a) 自営業者(国民年金第1号被保険者) = **月額68,000円(年816,000円)** (国民年金基金との合算) ; (b) 会社員(企業年金なし) = **月額23,000円** ; (c) 会社員(企業型DC加入) = **月額20,000円** (合算上限あり) ; (d) 会社員(企業型DC + DB両方加入) = **月額12,000円** ; (e) 公務員等 = **月額12,000円** ; (f) 専業主婦/主夫(第3号被保険者) = **月額23,000円** 。「いくらでも」は誤り。 **2024年12月の制度改正で全員月20,000-62,000円水準に再編予定**)'
  - '"60歳前にいつでも引き出せる" (iDeCo は **老齢給付として原則60歳まで引き出せない** ── これは大きな制約。例外的に **加入者が高度障害状態 / 死亡 / 一定要件の脱退一時金請求** の場合のみ60歳前受給可。 **60歳から70歳までの間に受給開始** を選択 ; 2022年4月から **75歳まで延長可能** に。「いつでも引き出せる」は誤り)'
  - '"税金も全くかからない" (iDeCo の **3段階の税優遇** : (a) **拠出時** = **掛金が全額所得控除(小規模企業共済等掛金控除)** で所得税・住民税が軽減 ; (b) **運用時** = **運用益が非課税** ; (c) **受取時** = 一時金受取は **退職所得控除** 、年金受取は **公的年金等控除** ── ただし完全非課税ではなく、 **退職所得控除を超える分には所得税** がかかる。「税金全くかからない」は誤り。総じて優遇は厚い)'
  ground_truth: '**iDeCo(イデコ、個人型確定拠出年金、Individual-type Defined Contribution pension plan)** ── 老後資金を自分で運用しながら積み立てる **私的年金制度** 。 **2017年1月** に対象者拡大(全国民が原則加入可能に)、人気上昇。 **2024年12月** から拠出限度額の制度改正実施。**所管**: **厚生労働省** ; **国民年金基金連合会** が実施機関 ; **金融機関(運営管理機関)** が窓口。**加入対象** = **20歳以上65歳未満の国民年金被保険者** (一部例外あり、海外在住者・国民年金未納者は除外) 。**拠出限度額(月額・2024年現在)**: (a) 自営業者(第1号被保険者) = **68,000円** (国民年金基金 + 付加年金との合算) ; (b) 専業主婦/主夫(第3号) = **23,000円** ; (c) 会社員(企業年金なし、第2号) = **23,000円** ; (d) 会社員(企業型DCのみあり) = **20,000円** (企業型DCとの合算月額55,000円以内) ; (e) 会社員(企業型DC + DB両方) = **12,000円** ; (f) 公務員(第2号) = **12,000円** 。 **2024年12月から制度改正** : (a) 第2号被保険者(会社員・公務員)の拠出限度額が原則 **月20,000円〜62,000円水準に統一**(企業年金との合算で計算) 、(b) 第1号は変わらず月68,000円。**3段階の税優遇**: (1) **拠出時** = 全額 **小規模企業共済等掛金控除** で所得から控除(所得税・住民税が軽減 ; 例: 年収500万円・月23,000円拠出で年間約55,800円の節税) ; (2) **運用時** = **運用益(分配金・売却益)に課税なし** (通常は20.315%の課税) ; (3) **受取時** = **一時金 = 退職所得控除** 、 **年金 = 公的年金等控除** 適用 ── 退職所得控除超過分や公的年金合算で課税対象になる場合あり。**運用商品** = 各運営管理機関(SBI証券・楽天証券・マネックス証券・大和証券・三菱UFJ銀行等)が提供する **元本確保型(定期預金・保険)** + **元本変動型(投資信託、約30〜40本)** から選択 ; 商品変更(スイッチング)・拠出割合変更可能。**手数料**: 加入時2,829円(国民年金基金連合会)、運用期間中は月171円(国基連 + 信託銀行) + 運営管理機関手数料(0〜数百円/月)。**受取**: 60歳から(加入期間10年未満は段階延長、最短60歳・最長65歳開始)、 **75歳までに受取開始** 必須(2022年4月改正)。**NISA との違い**: NISA = いつでも引き出し可・拠出時所得控除なし ; iDeCo = 60歳まで引き出し不可・拠出時所得控除あり。詳しくは **www.ideco-koushiki.jp**(iDeCo公式サイト) や **mhlw.go.jp** で。'
  graceful_unknown: iDeCo(個人型確定拠出年金)は20-65歳の国民年金被保険者が加入可、拠出限度額は職業別(自営業68,000円〜公務員12,000円/月、2024年12月制度改正で第2号は20,000-62,000円水準に再編)。原則60歳まで引き出し不可。3段階税優遇(拠出時所得控除・運用益非課税・受取時控除)。NISAとは別制度。所管は厚生労働省、運営は国民年金基金連合会、窓口は金融機関(運営管理機関)。詳しくは ideco-koushiki.jp で。
  persona_tags:
