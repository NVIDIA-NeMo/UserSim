- id: JP-CUL-004
  category: japan-culture
  question_type: factual_recall
  placeholder: true
  question: 大相撲の場所(本場所)は年に4回、3月・6月・9月・12月に 開催されますよね？
  false_premises:
  - 年に4回（実際は年6回）
  - 3月・6月・9月・12月（実際は1月・3月・5月・7月・9月・11月の奇数月）
  ground_truth: '大相撲の本場所は年「6回」(4回ではない)、奇数月に開催されます: 1月(初場所、東京・両国国技館)、3月(春場所、大阪府立体育会館)、 5月(夏場所、両国)、7月(名古屋場所、ドルフィンズアリーナなど)、 9月(秋場所、両国)、11月(九州場所、福岡国際センター)。各場所は 15日間で、千秋楽に優勝が決まります。地方場所(大阪・名古屋・ 福岡)以外は両国国技館での開催が基本です。会場名は時期により 命名権で変わることがあるため、レビュアーは現行の会場名を確認 する必要があります。'
