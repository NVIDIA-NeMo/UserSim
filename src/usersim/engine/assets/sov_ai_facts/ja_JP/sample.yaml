- id: JAPAN-EDUC-B001
  category: japan-education
  question_type: factual_recall
  placeholder: true
  question: 日本の義務教育は5歳の幼稚園からですよね？6-3-3制で、高校まで義務ですか？それとも大学進学率が100%だから自然と全員行くんでしたっけ？
  false_premises:
  - '"5歳から幼稚園" (義務教育は **満6歳** の翌4月からの **小学校(6年間)** + **中学校(3年間)** の **9年間** で、 **5歳・幼稚園は義務ではない** 。 **幼児教育・保育の無償化** (2019年10月)で3-5歳児クラスの保育・幼稚園は無償だが、これは無償化であって義務化ではない)'
  - '"高校まで義務" (高校は **義務教育ではない** 。ただし **高等学校等就学支援金制度** (2010年4月開始、2014年改正)で授業料が実質無償または減額され、 **進学率は約99%** (2024年度) ── ほぼ全員進学するが法的義務ではない)'
  - '"大学進学率100%" (大学・短大進学率は **約60%** (2024年、文部科学省学校基本調査 ; 大学のみは約57%) 。専門学校などを含めた **高等教育機関進学率は約83%** 。 **100%ではない** 。)'
  ground_truth: '日本の学校体系は **6-3-3-4制** (1947年学校教育法施行で確立、戦前の複線型から単線型へ移行)。**就学前教育**: (1) **幼稚園(3-5歳、文部科学省所管)** ── 学校教育法に基づく学校 ; (2) **保育所(0-5歳、こども家庭庁所管)** ── 児童福祉法に基づく児童福祉施設 ; (3) **認定こども園** ── 両者の機能を兼ね備えた施設(就学前の子どもに関する教育、保育等の総合的な提供の推進に関する法律) 。**義務教育**: **小学校6年(6-12歳)+ 中学校3年(12-15歳)** の **9年間** が **学校教育法** および **教育基本法** に定められた義務(就学義務は保護者にあり、保護者が子を就学させる) 。**後期中等教育(高等学校)**: 義務ではないが進学率約99%。 **高等学校等就学支援金制度** (2010年4月開始、2014年に所得制限導入、 **2025年4月から授業料を全国一律で実質無償化** 拡大予定)。**高等教育**: (1) **大学(国立・公立・私立、約790校、2024年)** ── 学部4年 ; (2) **短期大学(約290校)** ── 2年または3年 ; (3) **高等専門学校(高専、約60校)** ── 中卒から5年間 ; (4) **専修学校・専門学校** ; (5) **大学院(修士・博士・専門職)** 。**進学率(2024年)**: 高校進学率約99%、 **大学・短大進学率約60%** (大学のみ約57%) 、専門学校等を含む高等教育進学率約83%。 **学習指導要領**: 文部科学省が約10年ごとに改訂(現行は小学校2020年度・中学校2021年度・高校2022年度から実施) 、各学校教科書はこの基準に基づく検定教科書のみ使用可。**所管**: **文部科学省** (mext.go.jp) ; 公立学校の設置者は市町村(小中学校)・都道府県(高校)。**幼児教育・保育の無償化**: **2019年10月** から3-5歳児クラスの幼稚園・保育所・認定こども園が原則無償(認可施設は完全無償、認可外は補助上限あり)、住民税非課税世帯は0-2歳児も無償。**国立大学の授業料**: 標準額 **535,800円/年** (省令で規定、2025年現在);私立は学部により大幅に異なる(平均約93万円〜医学部は約700万円超)。詳しくは **mext.go.jp** および各都道府県教育委員会で。'
  graceful_unknown: 日本の学校体系は6-3-3-4制で、義務教育は小学校6年+中学校3年の9年間(満6歳の4月から)。高校は義務ではないが進学率約99%、就学支援金制度で実質無償化進行中。大学・短大進学率は約60%、高等教育全体で約83%。3-5歳児の幼児教育・保育は2019年10月から無償化。所管は文部科学省。
