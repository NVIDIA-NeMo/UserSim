- id: JAPAN-EDUC-B005
  category: japan-education
  question_type: factual_recall
  placeholder: true
  question: GIGAスクール構想って、2030年から始まる新しい計画ですよね？小学生・中学生に1人1台のタブレットを支給する予定で、現状はまだ計画段階ですか？
  false_premises:
  - '"2030年から始まる" (GIGA(Global and Innovation Gateway for All)スクール構想は **2019年12月** に閣議決定、 **2020年度から本格スタート** 。COVID-19パンデミック対応で **前倒し** され、 **2020年度補正予算** で大幅加速、 **2021年度末までに小中学生に1人1台端末整備** が完了済み。「2030年から」は誤り)'
  - '"現状は計画段階" (GIGAスクール構想は **すでに第1期(2020-2024年度)が実施済み** で、全国の公立小中学校で **児童生徒1人1台の学習用端末** 配備が完了。 **第2期 GIGAスクール構想(2025年度〜)** として、初代端末の更新時期到来に対応するための予算措置が進行中。「計画段階」は誤り)'
  - '"小学生・中学生だけ" (GIGAスクール構想は **公立小・中学校** が中心だが、 **特別支援学校・高等学校(段階的)・特別支援教育を必要とする児童生徒** も含む。「小中学生だけ」は不正確 ── 高等学校でも自治体・学校が独自に「1人1台」体制を整備、 **特別支援学校** は早期から推進)'
  ground_truth: '**GIGAスクール構想** ── 文部科学省主導の教育情報化推進政策。**経緯**: (1) **2019年12月** 閣議決定 ── 全国の児童生徒に **1人1台の学習用端末** と **高速ネットワーク** を整備、 **個別最適化された創造性を育む教育** ICT環境を実現 ; (2) **2020年度** 当初予算でスタート ; (3) **COVID-19パンデミック対応(2020年4月-)** で **大幅前倒し** され、 **2020年度補正予算** で加速 ; (4) **2021年度末までに、ほぼ全自治体・公立小中学校で1人1台端末整備完了** 。**端末構成**: 自治体ごとに選定 ── ChromeOS(Google Chromebook)、Windows、iPadOS のいずれか。 **OS別シェア(2024年現在)**: Chromebook 約44% 、 Windows 約27% 、 iPad 約26% 。**学校通信ネットワーク**: 各学校に **校内 LAN** + 高速インターネット接続を整備 ; **学習者用デジタル教科書** (2024年度から本格導入)、 **eライブラリ・教育クラウド** 等の利活用を推進。**第2期 GIGAスクール構想**: **2025年度** 以降の更新フェーズ ── 初代端末(2020-2021年度に整備、耐用年数5-6年)の更新が必要となる時期に向け、 **2024年度補正予算 + 2025年度予算** で **新たな国費補助** を計画 ; 文部科学省が「第2期 GIGAスクール構想」として、より高度な ICT 活用と新端末整備を推進。**学校種別**: (1) **小学校・中学校** = 完了 ; (2) **高等学校** = 段階的整備、自治体・学校独自の取組(都立高校はBYOD型で実施、神奈川・大阪・愛知などは公費整備)、生徒・保護者負担とのバランス模索中 ; (3) **特別支援学校** = 早期から推進、合理的配慮にも資する。**所管**: **文部科学省** (mext.go.jp) ; ** **デジタル庁** との連携。**周辺施策**: ICT 支援員の配置 、 教員研修 (CBT 対応 等)、 **MEXCBT(メクビット)** = CBT 用問題プラットフォーム、 **NEXT GIGA** などの構想。詳細は **mext.go.jp** および各都道府県教育委員会で。'
  graceful_unknown: GIGAスクール構想は2019年12月閣議決定、2020年度本格スタート、COVID-19で前倒しされ2021年度末までに公立小中学校で1人1台端末整備完了。OSはChromebook(約44%)、Windows、iPad に分かれる。第2期(2025年度〜)で初代端末更新を計画中。高等学校・特別支援学校でも整備推進。所管は文部科学省、デジタル庁と連携。
  persona_tags:
