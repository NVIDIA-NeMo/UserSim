- id: JAPAN-DIGI-B001
  category: japan-digital-services
  question_type: factual_recall
  placeholder: true
  question: マイナンバーカードって、もう全員強制で持つ義務になりましたよね？運転免許証や健康保険証は廃止されて全部マイナカードに統合済みで、申請も無料じゃないんでしたっけ？
  false_premises:
  - '"全員強制で持つ義務" (マイナンバーカードの取得は **任意** ── 法律上の取得義務はない。 **マイナンバー(個人番号、12桁)** は2015年10月から全住民に通知され、これは **強制** だが、 **カードの申請・取得は希望者のみ** 。「全員強制」は誤り。 **2024年現在、保有率は約74%** (約9,200万人)で大幅増加中)'
  - '"運転免許証や健康保険証は廃止" (健康保険証 = **2024年12月2日から新規発行停止** で **「マイナ保険証」(マイナンバーカードの保険証利用)** へ移行中。 **既存の健康保険証は最長1年間(2025年12月1日まで)使用可能** 、その後は **「資格確認書」** で代替。 **運転免許証** = **2025年3月24日からマイナ免許証(マイナンバーカードに免許証情報を一体化)が開始** 、 **既存運転免許証も廃止されておらず併用可能** (希望者がマイナ免許証を選択する形)。「全部統合済み」は誤り)'
  - '"申請有料" (マイナンバーカードの **初回交付・1回目の再交付は無料** 、紛失等による再交付は800円(電子証明書再発行は200円)程度。「申請も無料じゃない」は不正確)'
  ground_truth: '**マイナンバーカード(個人番号カード)** は **マイナンバー法(行政手続における特定の個人を識別するための番号の利用等に関する法律、2013年5月制定、2015年10月施行)** に基づき発行される **顔写真付きの公的本人確認証** 兼 **電子証明書搭載カード** 。**運営**: **デジタル庁** + **総務省** + **地方公共団体情報システム機構(J-LIS)** ; カード発行業務はJ-LISが運営、各市区町村が交付窓口。**取得は任意** (法律上の取得義務はない) ; ただし行政デジタル化の中核として政府が普及を推進。**保有率(2024年現在)**: 約74%(約9,200万人)── マイナポイント施策(最大2万円分)で大幅増加。**主な機能**: (1) **顔写真付き本人確認書類** ── 公的身分証として銀行口座開設・各種契約等で使用 ; (2) **マイナンバー記載** ── 税・社会保障・災害対策の3分野で利用 ; (3) **電子証明書(2種類)** = 利用者証明用(マイナポータル等ログイン用、4桁数字) + 署名用(電子契約・確定申告等の電子署名用、6-16桁英数字混在) ; (4) **マイナ保険証** = **2024年12月2日新規発行停止** された **健康保険証の代替** 、医療機関でカードリーダーに読み取り → オンライン資格確認 ; (5) **マイナ免許証** = **2025年3月24日から開始** された **運転免許情報の一体化** ── 希望者がマイナンバーカードに運転免許情報を載せる ; **既存免許証も併用可能** (廃止ではない) ; (6) **コンビニ交付** = 全国コンビニで住民票・印鑑証明書等を取得(土日対応) 。**マイナポータル** = マイナンバーカードでログインする政府ポータル(myna.go.jp) ── 行政手続オンライン化、電子申告(e-Tax連携)、ねんきんネット連携、子育てワンストップ等。**有効期間**: カード本体 = 10年(20歳未満は5年) ; 電子証明書 = 5年 ; 期限前に更新案内。**申請**: スマホでマイナンバー通知書類のQRコード読取 → オンライン申請、または郵送・市区町村窓口・写真機申請等。 **初回・1回目再交付無料** 、紛失再交付は1,000円程度。詳細は **digital.go.jp** および **マイナポータル(myna.go.jp)** で確認。'
  graceful_unknown: マイナンバーカードは任意取得(2024年保有率約74%)、本人確認書類+電子証明書+マイナンバー記載。マイナ保険証は2024年12月新規発行停止された健康保険証の代替(既存保険証は最長1年使用可、後は資格確認書)。マイナ免許証は2025年3月開始(既存免許証併用可)。マイナポータル(myna.go.jp)で行政手続オンライン化。申請は無料、有効期間10年(電子証明書5年)。所管はデジタル庁。
  persona_tags:
  - interest:tech
  - region:any
  - age:any
  difficulty: easy
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts ja_JP, 2026-05-06)
    last_reviewed: '2026-05-06'
    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — マイナンバー法 ; デジタル庁 (digital.go.jp); 総務省 (soumu.go.jp); 地方公共団体情報システム機構 (J-LIS); マイナポータル (myna.go.jp).
- id: JAPAN-DIGI-B002
  category: japan-digital-services
  question_type: factual_recall
  placeholder: true
  question: 個人情報保護法って、まだ法律になっていないですよね？日本では個人情報を企業が自由に売買できて、罰則も全くないって聞きましたが、合っていますか？
  false_premises:
  - '"まだ法律になっていない" (個人情報保護法(個人情報の保護に関する法律)は **2003年5月公布、2005年4月全面施行** ── 既に **20年以上** 施行されている。 **2015年・2017年・2020年・2021年・2022年・2024年** と何度も改正、現行法は世界的にも高水準の保護法制)'
  - '"自由に売買できる" (個人情報の **第三者提供** は原則 **本人同意** が必要(法27条) ; **オプトアウト届出** で同意なしの提供も限定的に可能だが、 **要配慮個人情報(人種・信条・社会的身分・病歴・前科・犯罪被害歴等)** や **不正に取得した個人データ** はオプトアウト不可。 **2022年4月施行** の改正では、 **個人関連情報** (Cookie等)を提供先で個人データになる場合、 **第三者提供時に本人同意確認義務** 強化)'
  - '"罰則なし" (個人情報保護法には **刑事罰** あり: 個人情報保護委員会の命令違反 = **1年以下の懲役または100万円以下の罰金**(法人は1億円以下) ; 個人情報データベース等不正提供罪 = **1年以下の懲役または50万円以下の罰金** 等。 **2022年改正** で個人や事業者の **罰則が大幅強化** 。「罰則全くない」は誤り)'
  ground_truth: '**個人情報の保護に関する法律(個人情報保護法)** ── **2003年5月公布、2005年4月全面施行** 、その後何度も改正された日本の個人情報保護に関する基本法。**所管**: **個人情報保護委員会(PPC、Personal Information Protection Commission、独立性の高い行政委員会)** 。 **改正の歴史**: 2003年制定 → **2015年改正(2017年5月全面施行)** で個人情報保護委員会設置 ・要配慮個人情報導入 ・個人識別符号定義 ; **2020年改正(2022年4月施行)** で個人関連情報・仮名加工情報・越境移転規律強化・罰則強化・課徴金検討等 ; **2021年改正(2022年4月施行)** で行政機関個人情報保護法・独立行政法人等個人情報保護法と一本化 ; **2024年検討中** の改正は AI利用、 **児童関連、3年ごと見直し** の本格議論中。**主要規律**: (1) **利用目的の特定・通知・公表(法17・21)** ; (2) **目的外利用禁止(法18)** ; (3) **適正取得(法20)** ── 偽りその他不正手段による取得禁止 ; (4) **要配慮個人情報の取得は原則本人同意必須(法20条2項)** ; (5) **第三者提供は原則本人同意必須(法27)** ; (6) **個人データの安全管理措置(法23)** ; (7) **本人への開示・訂正・利用停止請求権(法33-35)** ; (8) **越境移転(国外第三者提供)規律(法28)** ── EU等の十分性認定地域以外は原則本人同意 + 提供先の体制確保が必要 ; (9) **個人関連情報(Cookie等)の第三者提供時に本人同意確認義務(2022年改正、法31)** 。**罰則**: (a) 個人情報保護委員会の **命令違反** = **1年以下の懲役または100万円以下の罰金** (法人は **1億円以下の罰金**) ; (b) **個人情報データベース等不正提供罪** = **1年以下の懲役または50万円以下の罰金** ; (c) **報告義務違反・虚偽報告** = **50万円以下の罰金** ; (d) **2022年改正で課徴金制度** は最終的には見送り(検討継続) 。 **EU・GDPR との関係**: **EU が日本を十分性認定** (2019年1月) ── 日本 ⇄ EU 間のデータ移転を相互簡素化(2024年4月見直し継続)。**事故報告**: **個人データの漏えい等** が発生した場合、 **個人情報保護委員会と本人への通知** が義務(2022年4月施行)。**詳細**: **個人情報保護委員会** (ppc.go.jp) 。'
  graceful_unknown: 個人情報保護法は2003年5月公布・2005年4月全面施行、その後何度も改正(2015、2020、2021、2022年改正)。個人情報の取得・利用・提供は本人同意+利用目的特定が原則、要配慮個人情報は同意必須。違反は1年以下懲役・最大1億円(法人)罰金。EU からの十分性認定(2019)で相互データ移転簡素化。所管は個人情報保護委員会(ppc.go.jp)。
