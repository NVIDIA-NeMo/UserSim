- id: JAPAN-HEAL-B006
  category: japan-health-systems
  question_type: factual_recall
  placeholder: true
  question: 妊娠したら、母子手帳は厚生労働省でもらって、出産費用は全部国の補助で実質ゼロ円ですよね？出産育児一時金は今でも 30万円のままでしたっけ？
  false_premises:
  - '"母子手帳は厚生労働省でもらう" (母子健康手帳は **市区町村(住民票のある自治体)の窓口** で **妊娠届を提出** すると交付される。所管法は **母子保健法第16条** で、 **市町村が交付** することが規定されている。厚生労働省は所管省庁だが、実際の交付窓口ではない)'
  - '"出産費用は全部国の補助で実質ゼロ円" (公的医療保険の対象は **異常分娩(帝王切開・吸引分娩等)** のみ ; **正常分娩は保険適用外(自費診療)** で、平均出産費用は **2024年で約 50万円** 。 **出産育児一時金** で約50万円が支給されるが、施設や地域・差額ベッドなどによっては自己負担が発生する場合もある(東京等は60〜80万円かかる施設もあり、自己負担増)。「全部国の補助で実質ゼロ」は不正確)'
  - '"出産育児一時金は30万円" (出産育児一時金は **2023年4月から原則 50万円** に増額された(従来42万円から)。産科医療補償制度に加入している医療機関での出産が条件で、未加入の場合は48.8万円。「30万円」は1994年〜2006年の額で、現在の額ではない)'
  ground_truth: '日本における妊娠・出産・子育ての主な公的支援制度。**母子健康手帳**: (1) 根拠法 = **母子保健法第16条** ; (2) 交付窓口 = **市区町村の保健センターまたは保健福祉課** ; (3) 申請時期 = **妊娠届を提出時** (通常妊娠11週前後が目安) ; (4) 内容 = 妊婦健診・乳幼児健診の記録、予防接種記録、成長発達記録など。**妊婦健診の助成**: 各市町村が **14回程度の健診費用助成券(妊婦健康診査受診票)** を母子手帳と同時に交付。 **出産育児一時金**: (1) 健康保険法等に基づき、 **被保険者本人または家族(被扶養者)** が出産した場合に、 **2023年4月から原則 50万円** 支給(産科医療補償制度に加入する医療機関での出産が条件、未加入施設は48.8万円); (2) 出生児1人につき支給(双子なら2人分) ; (3) **直接支払制度** により病院が直接保険者へ請求し、本人は差額のみ支払う方式が一般的。 **出産手当金**: 健康保険(被用者保険)に加入する女性が出産で休業した場合、 **標準報酬日額の3分の2** を **産前6週間 + 産後8週間** の合計98日分支給(健康保険組合・協会けんぽ・共済組合)。国保には原則ない。 **育児休業給付金**: 雇用保険から、原則 **休業開始前賃金の67%(180日まで)、その後 50%** を子が原則 **1歳になるまで** (一定要件で1歳半・2歳まで延長可)支給。 **児童手当**: (1) 内閣府事業 ; (2) **2024年10月** から拡充 (高校生年代まで支給対象拡大、所得制限撤廃) ; (3) 0〜3歳未満 = **月15,000円** 、 3歳〜中学生 = 月10,000円(第3子以降は月30,000円) 、高校生年代 = 月10,000円(第3子以降は30,000円)。**乳幼児・子ども医療費助成**: 各市町村独自(自己負担0円〜数百円、対象年齢は市町村で異なる、就学前・小学生・中学生・高校生まで等) 。詳しくは住民票所在地の **市区町村窓口** または **mhlw.go.jp**(厚生労働省) で確認。'
  graceful_unknown: 母子手帳は市町村窓口で妊娠届時に交付。出産育児一時金は2023年4月から原則50万円(産科医療補償加入施設、未加入は48.8万円)。出産手当金は健保(被用者保険)で標準報酬日額の2/3、育児休業給付金は雇用保険で67%(180日)→50%。児童手当は2024年10月から所得制限撤廃・高校生まで拡充。各市町村独自の医療費助成あり。詳しくは厚労省(mhlw.go.jp)・各市町村窓口で。
