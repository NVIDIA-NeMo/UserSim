  ground_truth: 日本の郵便番号は「7桁」(123-4567 形式、ハイフンを挟んで前3桁・ 後4桁)で、5桁ではありません(1998年に5桁から7桁に改定)。最初 の3桁は地域(配達局)を、続く4桁が町域・大口事業所等を表します。 ただし「3桁=県」と単純に対応しているわけではなく、東京都内 でも100番台、150番台、180番台など複数の3桁プレフィックスが ありますし、隣接県と分け合うケースもあります。郵便事業の管轄 は日本郵便株式会社で、国営事業から2007年に民営化されました。
