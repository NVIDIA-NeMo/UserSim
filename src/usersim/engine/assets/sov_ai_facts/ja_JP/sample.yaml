- id: JAPAN-HEAL-B003
  category: japan-health-systems
  question_type: factual_recall
  placeholder: true
  question: 介護保険って60歳から強制加入で、保険料は給与から全部引かれて自己負担はゼロですよね？要介護認定は厚生労働省の窓口でやるんでしたっけ？
  false_premises:
  - '"60歳から強制加入" (介護保険の **被保険者** は **40歳以上** から: (a) **第1号被保険者** = **65歳以上**(全員); (b) **第2号被保険者** = **40〜64歳の医療保険加入者** 。65歳以上は原因問わず要介護認定で給付、40〜64歳は **特定疾病(16疾病、加齢に伴う疾病)** に該当する場合のみ給付対象。「60歳から」は誤り)'
  - '"自己負担ゼロ" (介護サービス利用時の **自己負担** は所得に応じて (a) **1割** (一般)、 (b) **2割** (一定以上所得者)、 (c) **3割** (現役並み所得者) ── 介護保険では2015年に2割負担、2018年に3割負担が導入。 **支給限度額** (要介護度別の月間上限) を超えた利用は全額自己負担)'
  - '"厚生労働省の窓口で要介護認定" (要介護認定の申請窓口は **市区町村の介護保険担当課または地域包括支援センター** 。市区町村が **認定調査(訪問調査)** を行い、 **主治医意見書** とあわせて **介護認定審査会(市区町村が設置)** で審査・判定。厚生労働省は制度全体の所管だが、認定の実務は **市区町村レベル** で行われる)'
  ground_truth: '**介護保険制度** は、高齢者の介護を社会全体で支える社会保険制度として、 **2000年4月** に施行(介護保険法、1997年制定)。**所管**: 厚生労働省 ; **保険者**: 市区町村(東京特別区を含む) 。**被保険者**: (a) **第1号被保険者** = **65歳以上の住民全員** ; (b) **第2号被保険者** = **40〜64歳の医療保険加入者** 。**保険料**: 第1号は市区町村ごとに保険料率が決まり、 **特別徴収(年金からの天引き)** または普通徴収。第2号は加入する医療保険の保険料に上乗せして徴収。**要介護認定の手続き**: (1) **市区町村の介護保険担当課または地域包括支援センター** に申請 ; (2) 市区町村の **認定調査員** が訪問調査(基本調査74項目+特記事項) ; (3) **主治医意見書** を取得 ; (4) **介護認定審査会** で1次判定(コンピュータ判定)・2次判定(専門家による判定) ; (5) **要支援1・2** または **要介護1〜5** に区分(7段階) 、または **非該当(自立)** ; (6) 認定結果を申請者に通知 (申請から原則30日以内)。**サービス**: (a) **居宅サービス** (訪問介護、通所介護、ショートステイ、福祉用具貸与など) ; (b) **施設サービス** (特別養護老人ホーム、介護老人保健施設、介護医療院など) ; (c) **地域密着型サービス** (グループホーム、小規模多機能型居宅介護など) ; (d) **介護予防サービス** (要支援1・2向け) 。**自己負担**: 原則 **1割** ; **一定以上所得者は2割** (2015年〜) ; **現役並み所得者は3割** (2018年〜) 。**支給限度基準額**: 要介護度別の月額限度(例: 要介護5は約36万円分のサービス) 、超過分は全額自己負担。 **第2号被保険者の特定疾病(16疾病)**: がん末期、関節リウマチ、筋萎縮性側索硬化症(ALS)、後縦靱帯骨化症、骨折を伴う骨粗鬆症、初老期における認知症、進行性核上性麻痺・大脳皮質基底核変性症・パーキンソン病、脊髄小脳変性症、脊柱管狭窄症、早老症、多系統萎縮症、糖尿病性神経障害・糖尿病性腎症・糖尿病性網膜症、脳血管疾患、閉塞性動脈硬化症、慢性閉塞性肺疾患、両側の膝関節又は股関節に著しい変形を伴う変形性関節症 ── これらに該当しない若年(40-64歳)疾病は介護保険対象外。詳細は厚生労働省 (mhlw.go.jp) または各市区町村窓口で確認。'
  graceful_unknown: 介護保険は40歳以上が被保険者(40-64歳は第2号、65歳以上は第1号)。要介護認定は市区町村の介護保険担当課または地域包括支援センターで申請、訪問調査+主治医意見書をもとに介護認定審査会で判定。自己負担は1〜3割(所得別)。第2号被保険者は16の特定疾病に該当する場合のみ給付対象。詳しくは厚労省 (mhlw.go.jp) または市区町村窓口で。
  persona_tags:
