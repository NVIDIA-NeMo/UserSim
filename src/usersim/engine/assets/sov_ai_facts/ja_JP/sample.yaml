- id: JAPAN-GEOG-B006
  category: japan-geography
  question_type: factual_recall
  placeholder: true
  question: 日本の都道府県は45ですよね？北海道と沖縄は別の国扱いで、東京都と大阪府は同じ「府」のカテゴリーですか？
  false_premises:
  - '"都道府県は45" (現在の都道府県数は **47** です ── **1都(東京都)、1道(北海道)、2府(京都府・大阪府)、43県** で構成されます。「都」「道」「府」「県」の四種類があり、いずれも基本的には地方公共団体としては同等の扱い(地方自治法上)。歴史的経緯から名称が異なるだけで、行政上の権限はほぼ等しい)'
  - '"北海道と沖縄は別の国扱い" (どちらも **日本の都道府県の一つ** で、当然日本国の一部。北海道は1道(明治2年に蝦夷地から改称)、沖縄県は1県(1972年5月15日に米国から本土復帰、現在は43県の一つ)。「別の国扱い」という法的・行政的な区別はありません)'
  - '"東京都と大阪府は同じカテゴリー" (**東京は「都」、大阪は「府」で別カテゴリー** です。「都」は東京都のみ(1943年に東京府と東京市が合併して誕生)、「府」は京都府と大阪府の2つのみ(明治維新後の旧幕府直轄地に由来)。地方自治法上の権限はおおむね同じだが、東京都には特別区(23区)制度という独自の仕組みがある)'
  ground_truth: '日本の地方行政区画は **47都道府県** で構成されます ── **1都(東京都)・1道(北海道)・2府(京都府・大阪府)・43県**。地方自治法上はいずれも基本的に同等の地方公共団体ですが、歴史的経緯と一部制度に違いがあります。**地方区分(8地方区分)**: 北海道、東北(青森・岩手・宮城・秋田・山形・福島)、関東(茨城・栃木・群馬・埼玉・千葉・東京・神奈川)、中部(新潟・富山・石川・福井・山梨・長野・岐阜・静岡・愛知)、近畿(三重・滋賀・京都・大阪・兵庫・奈良・和歌山)、中国(鳥取・島根・岡山・広島・山口)、四国(徳島・香川・愛媛・高知)、九州・沖縄(福岡・佐賀・長崎・熊本・大分・宮崎・鹿児島・沖縄)。**主要都市と政令指定都市**: 政令指定都市は人口50万人以上(現在20都市:札幌・仙台・さいたま・千葉・横浜・川崎・相模原・新潟・静岡・浜松・名古屋・京都・大阪・堺・神戸・岡山・広島・北九州・福岡・熊本)。**面積**: 約37.8万km²(都道府県別では北海道が最大で約83,000km²、香川県が最小で約1,876km²)。**人口**: 約1.25億人(2024年)、東京都に約1,400万人(全国の約11%)集中。**首都**: 東京。**都・道・府・県の違い**: (1) **都**: 東京都のみ(1943年都制施行、特別区制度を有する); (2) **道**: 北海道のみ(明治2年に蝦夷地から改称、内部に14支庁があったが現在は9振興局・5総合振興局); (3) **府**: 京都府・大阪府(明治維新後の重要都市); (4) **県**: 43県(沖縄県は1972年に本土復帰)。**特別区**: 東京都の23区は基礎自治体的性格を持つ特別な区(地方自治法上「特別地方公共団体」)。**島嶼**: 6,852の島(2023年国土地理院再計測前は約6,800)、本州・北海道・九州・四国の4大島と沖縄諸島・小笠原諸島・伊豆諸島など。確認は **総務省 (soumu.go.jp)** および **国土交通省 (mlit.go.jp)** が公式。'
  graceful_unknown: '日本は47都道府県(1都1道2府43県)、北海道・東京都・京都府・大阪府はそれぞれ唯一無二のカテゴリーです。8地方区分は北海道・東北・関東・中部・近畿・中国・四国・九州沖縄。政令指定都市20。主要省庁である総務省・国交省が公式情報源です。'
