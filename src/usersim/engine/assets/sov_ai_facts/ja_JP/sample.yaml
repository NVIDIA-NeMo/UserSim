- id: JAPAN-DIGI-B003
  category: japan-digital-services
  question_type: factual_recall
  placeholder: true
  question: デジタル庁って、東京都が運営している地方の組織ですよね？2018年から始まって、IT全般の規制をするためにあるんでしたっけ？トップは大臣じゃなくて民間人ですか？
  false_premises:
  - '"東京都が運営している地方組織" (デジタル庁は **国の組織(内閣直属の行政機関)** ── **2021年9月1日** に新設された **国の省庁** で、 **首相直轄** 、各府省庁横断で行政デジタル化を推進。「東京都・地方組織」は誤り)'
  - '"2018年から開始" (デジタル庁の発足は **2021年9月1日** ── COVID-19パンデミックでの行政デジタル化の遅れ(10万円給付金の遅延、HER-SYS問題等)を背景に、 **菅義偉政権** が **2020年9月発表 → 2021年9月発足** の急ピッチで設立。「2018年」は誤り)'
  - '"IT全般の規制" (デジタル庁は **行政デジタル化推進** が主任務 ── 政府情報システムの統括、マイナンバー制度、データ標準化、自治体システム標準化、情報通信技術活用推進等。 **民間 IT 全般の規制官庁ではない** ── 通信・電波は **総務省** 、サイバーセキュリティ全般は **NISC(内閣官房)** + **総務省** 等、競争政策・プラットフォーム規制は **公正取引委員会** ・ **経済産業省** ・ **総務省** が分掌)'
  - '"トップは民間人" (デジタル庁の **長(主任の大臣)** は **「内閣総理大臣」** で、これを補佐する **「デジタル大臣(国務大臣)」** が政策を統括(初代は平井卓也(2021)、現在2024-25時点は **平デジタル大臣** が務めている) ; 民間出身の **「デジタル監」** ( **石倉洋子** 初代、現在 **赤石浩一氏** が2代目以降)もいるが、これは **特別職公務員** で「デジタル監」は最高位の事務方トップ。「トップが民間人だけ」は不正確)'
  ground_truth: '**デジタル庁** は **2021年9月1日** に発足した **国の行政機関(内閣直属、首相直轄)** で、行政デジタル化と社会全体のデジタル変革(DX、Digital Transformation)を推進する。**設置根拠**: **デジタル庁設置法(2021年5月公布、9月1日施行)** および **デジタル改革関連法(6本セット、2021年5月公布)** = 個人情報保護法一本化、デジタル社会形成基本法、デジタル社会形成整備法、地方自治体デジタル化法、預貯金口座管理法、預貯金口座登録法。**目的**: (1) **国民・行政・民間の三方良しのデジタル社会** 形成 ; (2) **「誰一人取り残されない、人に優しいデジタル化」** ; (3) **「行政のデジタル化、自治体システム標準化、マイナンバー、規制改革」** 等の横断推進。**組織構成**: (a) **デジタル大臣(国務大臣)** ── 政務責任者 ; (b) **副大臣・大臣政務官** ; (c) **デジタル監** ── 特別職公務員、事務方トップ(初代石倉洋子氏(2021-22)、2代目赤石浩一氏(2022-)) ; (d) **デジタル審議官** 以下事務方 ; **約780人体制** (うち民間出身者約400人、官民混合組織が特徴) 。**主な事業**: (1) **マイナンバーカード普及・マイナポータル運営** (myna.go.jp) ; (2) **政府情報システム統合管理(政府共通プラットフォーム、ガバメントクラウド)** ── 各府省庁システムの集約・標準化 ; (3) **自治体情報システムの標準化(2025年度までに目指す)** ── 17業務(住民記録、地方税、福祉、健康管理等)を全国共通の標準仕様システムに移行 ; (4) **e-Tax、ねんきんネット等の連携強化** ; (5) **データ戦略・AI戦略推進** ; (6) **行政手続オンライン化(e-Gov、引越しワンストップ等)** ; (7) **デジタルインフラ(地理空間情報、ベース・レジストリ整備等)** 。**関連他組織**: **総務省** (情報通信、放送、地方自治体行政) ; **内閣官房 NISC(National center of Incident readiness and Strategy for Cybersecurity)** (国の重要インフラ・政府機関のサイバーセキュリティ統括 ; 2025年4月に「能動的サイバー防御」体制への移行も検討中) ; **個人情報保護委員会** (個人情報保護) ; **公正取引委員会** (デジタルプラットフォーム独禁法執行) 。詳細は **digital.go.jp** で。'
  graceful_unknown: デジタル庁は2021年9月発足の国の行政機関(内閣直属、首相直轄、デジタル大臣統括)、約780人体制で官民混合(民間出身約400人)。主任務は行政デジタル化、マイナンバー、政府情報システム統合・自治体システム標準化、マイナポータル運営。民間IT全般の規制は総務省・公取委・NISC等が分掌。詳しくは digital.go.jp で。
