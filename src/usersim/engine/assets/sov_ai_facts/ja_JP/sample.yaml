- id: JP-CUL-001
  category: japan-culture
  question_type: factual_recall
  placeholder: true
  question: 千利休は江戸時代の俳人で、茶道を始めた人ですよね？
  false_premises:
  - 千利休は江戸時代の人物（実際は安土桃山時代）
  - 俳人である（実際は茶人。俳人としては松尾芭蕉が知られる）
  - 茶道を始めた人（茶の湯は鎌倉時代以来の伝統で、利休は侘び茶を大成した人物）
  ground_truth: 千利休(1522-1591)は安土桃山時代の茶人で、江戸時代の俳人では ありません。江戸時代は利休没後の1603年から始まります。利休は 茶道(茶の湯)の「創始者」というより、村田珠光・武野紹鷗を経て 発展してきた侘び茶を大成した人物です。織田信長、豊臣秀吉に 仕え、茶頭(さどう)として活躍しました。代表的な茶室「待庵」 (国宝)は利休の作と伝わります。俳人としては松尾芭蕉(1644-1694) が江戸時代の代表的存在です。
  persona_tags:
