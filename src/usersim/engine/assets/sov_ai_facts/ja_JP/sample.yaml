  placeholder: true
  question: マイナンバーは8桁の数字でしたっけ？それから、運転免許証と 同じ役割を兼ねていますよね？
  false_premises:
  - マイナンバーは8桁（実際は12桁）
  - 運転免許証と同じ役割（マイナンバー〔個人番号〕は社会保障・税・災害対策での識別番号で、運転資格を証明するものではない；ただし「マイナ免許証」として運転免許情報を一体化する制度は別途整備中）
  ground_truth: マイナンバー(個人番号)は「12桁」の数字で、8桁ではありません。 用途は社会保障(年金・医療・介護等)、税務、災害対策の3分野 に法律で限定されています。マイナンバー「カード」は本人確認 書類としても使えますが、これ自体は運転免許証ではありません。 ただし2024年(令和6年)から、希望者がマイナンバーカードに運転 免許情報を一体化する「マイナ免許証」の制度が始まりました (2025年3月の運用開始予定など、レビュアーは現行の制度状況を 確認する必要があります)。
