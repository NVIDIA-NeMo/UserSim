  question: 日本国憲法の第9条は戦争放棄の条文ですよね。「日本国民は、正義と秩序を基調とする国際平和を誠実に希求し...」で始まるんですけど、その先がうろ覚えで、第1項と第2項を正確に教えてもらえますか？1947年5月3日施行で合っていますか？
  false_premises: []
  ground_truth: |
    **日本国憲法 第9条** ── 戦争の放棄と戦力不保持を定める条文。**第二章「戦争の放棄」** に唯一所属する条文です。

    **第1項**: 「日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、**国権の発動たる戦争と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを放棄する**。」

    **第2項**: 「**前項の目的を達するため、陸海空軍その他の戦力は、これを保持しない。国の交戦権は、これを認めない**。」

    **背景・解釈**:
    (1) **公布**: 昭和21年(1946年)11月3日(明治節、現在の文化の日);
    (2) **施行**: 昭和22年(1947年)5月3日(現在の憲法記念日)── 質問の日付は正確;
    (3) **前文** で平和主義を宣言したうえで、第9条で具体化。
    (4) **解釈の歴史**: 自衛権(個別的・集団的)、自衛隊の合憲性、PKO参加、安保関連法(2015年)などを巡って多様な解釈・論争が続いている。日本政府の公式解釈は「**自衛のための必要最小限度の実力**は『戦力』に当たらず、自衛隊は合憲」というもの(芦田修正論・砂川判決(1959)・長沼ナイキ訴訟など参照)。
    (5) **改憲論議**: 自民党などによる改憲案が議論されているが、2025年現在まで一度も改正されていない。

    **出典**: 日本国憲法(昭和21年憲法)、衆議院・参議院・内閣官房等の公式テキスト、e-Gov 法令検索 (elaws.e-gov.go.jp)。
  graceful_unknown: 日本国憲法第9条は2項からなり、第1項で戦争・武力による威嚇・武力行使を「国際紛争を解決する手段としては永久に放棄」、第2項で「陸海空軍その他の戦力は保持せず、交戦権を認めない」と定めています。1947年5月3日施行で、これまで一度も改正されていません。正確な引用は e-Gov 法令検索や内閣官房の公式テキストでの確認をおすすめします。
