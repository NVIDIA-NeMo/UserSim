- id: JAPAN-LABO-B004
  category: japan-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 育児休業って、母親だけが取れて1年限りですよね？給与は休業中ゼロで、復職時に元の役職に戻れる保証もないんでしたっけ？
  false_premises:
  - '"母親だけが取れる" (育児休業は **男女問わず** 取得可能。 **2022年10月から「産後パパ育休(出生時育児休業)」** という父親(配偶者出産後)向けの新制度も導入(子の出生後8週間以内に4週間まで、2回に分割可能、休業中の就業も労使協定で可)。 **男性育休取得率は2023年度で約30%** (2024年7月公表、過去最高、対前年+13ポイント)で増加傾向)'
  - '"1年限り" (育児休業は子が **1歳に達するまで** が原則だが、 **保育所に入所できない等の理由** で **1歳6か月、さらに2歳まで延長可能** 。 **両親で交代取得する場合(パパ・ママ育休プラス)** は子が **1歳2か月まで** 期間を延ばすことも可能。「1年限り」は不正確)'
  - '"給与ゼロ" (育児休業中は **雇用保険から「育児休業給付金」** が支給される: (a) **休業開始から180日(6か月)まで** = **休業開始時賃金の67%** ; (b) **181日目以降** = **50%** 。 **2025年4月から、両親とも14日以上育休を取得した場合は最初の28日間「出生後休業支援給付金」を上乗せして実質80%相当(手取りで約100%)** に拡充。「給与ゼロ」は誤り)'
  - '"復職時に元の役職に戻れる保証なし" (育児・介護休業法第22条に **「育児休業等を理由とする不利益取扱いの禁止」** 規定あり。 **復職時の元職復帰原則** および解雇・降格・減給・配置転換等の不利益処分禁止 ; 違反は厚生労働大臣の助言・指導・勧告・公表の対象)'
  ground_truth: '日本の **育児休業制度** は **育児・介護休業法(育介法、1991年制定、複数回改正)** に基づき、 **男女問わず取得可能** な制度。**通常の育児休業**: (1) **対象** = 1歳未満の子を養育する労働者(雇用形態問わず、 **有期契約労働者は引き続き雇用されることが見込まれる場合** ── 2022年4月から要件大幅緩和 ; 日々雇用は除外) ; (2) **期間** = 原則 **子が1歳に達するまで** 、保育所未入所等の場合 **1歳6か月** または **2歳** まで延長可 ; (3) **回数** = **2回まで分割取得可能** (2022年10月改正)。**産後パパ育休(出生時育児休業、2022年10月新設)**: **子の出生後8週間以内** に **4週間まで** 取得可能、 **2回まで分割可** 、労使協定で就業可能。通常の育休とは別枠。**パパ・ママ育休プラス**: 両親が共に育児休業を取得する場合、子が **1歳2か月** まで休業期間延長可能(各人の上限は1年)。**給付金(雇用保険から)**: (a) **育児休業給付金** ── 休業開始180日まで **67%** 、181日目以降 **50%** (休業開始時賃金日額×支給日数) ; (b) **2025年4月から「出生後休業支援給付金」** ── 両親とも14日以上育休取得時、出生後8週間以内の **28日間に休業前賃金の13%相当を上乗せ** 、実質80%相当(手取りで約100%)に。**社会保険料免除**: 育児休業中の本人・事業主負担の **健康保険料・厚生年金保険料は免除** (厚生年金は保険料納付済とみなされる、将来の年金額に影響なし) 。**法的保護**: (1) **育介法第22条**: 育児休業等を理由とする解雇・降格等の **不利益取扱い禁止** ; (2) **男女雇用機会均等法第9条**: 妊娠・出産・育児休業を理由とする不利益取扱い禁止(マタハラ・パタハラ防止) ; (3) **復職時** = 原則として元職に復帰、復職困難な場合も同等の地位の職を与えるよう企業に努力義務。**所管**: **厚生労働省** (mhlw.go.jp) ; 違反は労働局雇用環境・均等部の指導対象 ; 育児休業給付金は **ハローワーク経由** で雇用保険から。**男性育休取得率(2023年度)** = **約30.1%** (2024年7月公表、過去最高、政府目標2025年50% / 2030年85%)。詳細は **mhlw.go.jp/seisakunitsuite/bunya/koyou_roudou/koyoukintou/ikuji** で確認。'
  graceful_unknown: 育児休業は男女問わず取得可、子1歳まで(延長で最大2歳)、有期契約も2022年4月から要件緩和。給付金は休業開始180日67%・以降50%(雇用保険)、2025年4月から「出生後休業支援給付金」で実質80%相当に。社会保険料は免除。産後パパ育休(2022年10月新設、出生後8週間以内4週間)・パパ・ママ育休プラス(1歳2か月延長)あり。所管は厚生労働省、給付はハローワーク経由。
