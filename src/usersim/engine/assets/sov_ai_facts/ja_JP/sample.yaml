- id: JAPAN-LABO-B002
  category: japan-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 最低賃金って全国一律で時給1500円ですよね？毎年4月に内閣府が決めるんでしたっけ？適用はフルタイム正社員のみで、アルバイトやパート・派遣社員には別の規則があるんですよね？
  false_premises:
  - '"全国一律1500円" (最低賃金は **都道府県ごとに地域別最低賃金が決定** ── 2024年10月発効分で時給839円(沖縄)〜1,163円(東京)、 **全国加重平均は1,055円** 。一律ではない。 **2025年度は全国加重平均1,121円(目安)** が中央最低賃金審議会で議論中(全国平均1,500円を目指す方針 ; 政府目標は「2030年代半ば」までに1,500円達成))'
  - '"4月に内閣府が決定" (最低賃金は **厚生労働省所管** で、 **中央最低賃金審議会** (公益委員・労働者委員・使用者委員)が **目安** を議論し( **8月初旬** に答申)、各都道府県の **地方最低賃金審議会** が **地域別最低賃金** を答申、各 **都道府県労働局長** が決定・告示。改定は **10月初旬から発効** が一般。「内閣府」「4月」は誤り)'
  - '"フルタイム正社員のみ" (最低賃金は **すべての労働者** に適用 ── 正社員、アルバイト、パートタイマー、契約社員、派遣社員、嘱託社員、外国人労働者を含む。雇用形態を問わず、 **その地域・職種の最低賃金額を下回る賃金は違法** で、 **罰則(50万円以下の罰金)** あり)'
  ground_truth: '日本の **最低賃金制度** は **最低賃金法** に基づき、 **すべての労働者(雇用形態を問わず)** に適用される。**2種類の最低賃金**: (1) **地域別最低賃金** ── 都道府県別、産業を問わず適用 ; (2) **特定最低賃金** ── 関係労使の申出に基づき、特定の産業について全国的または都道府県別に設定(地域別より高い水準)。**改定プロセス**: (a) **中央最低賃金審議会** (厚生労働省所管、公益・労働・使用者の三者構成)が **8月初旬** に **目安額(A〜D の地域ランク別)** を厚生労働大臣に答申 ; (b) **地方最低賃金審議会** (各都道府県労働局所管)が地域実情を踏まえ **地域別最低賃金額** を答申 ; (c) 各 **都道府県労働局長** が決定・告示 ; (d) **10月1日〜10月中旬** に発効。**2024年10月発効分**: 全国加重平均 **1,055円** ; 都道府県別範囲 = **839円(沖縄等)〜1,163円(東京)** 。**地域ランク** : **A** (東京、神奈川、愛知、大阪等)、 **B** (京都、千葉、埼玉等)、 **C** (北海道、東北、九州沖縄一部等) ── ただし2023年度から **3区分(A・B・C)** に簡素化(従来は4区分)。**政府目標**: **2023年8月決定** の **「最低賃金1,000円」目標は2024年に達成** ; **新目標 = 2030年代半ばまでに全国加重平均1,500円** を目指す。**罰則**: 最低賃金未満で雇用 = **50万円以下の罰金** (使用者) 。**例外**: (a) 精神又は身体の障害により著しく労働能力の低い者(都道府県労働局長許可) ; (b) 試用期間中の者(同) ; (c) 軽易な業務に従事する者(同) ── 3つは厚生労働大臣・都道府県労働局長の **減額特例許可** が必要、許可なしの減額は違法。**支払うべき賃金** : 基本給+諸手当(精皆勤手当・通勤手当・家族手当・時間外手当・休日手当・深夜手当を **除く** 月給)を時間換算して最低賃金以上であることが必要。詳細は **mhlw.go.jp** および各都道府県労働局で確認。'
  graceful_unknown: 最低賃金は都道府県別に決定(2024年10月発効分で時給839〜1,163円、全国加重平均1,055円)。改定は厚生労働省・中央最低賃金審議会の目安+各都道府県の地方最低賃金審議会の答申で、10月発効が一般的。すべての雇用形態(正社員・パート・アルバイト・派遣など)に適用、違反は50万円以下の罰金。政府目標は2030年代半ばまでに全国平均1,500円。詳しくは厚労省 (mhlw.go.jp) で。
