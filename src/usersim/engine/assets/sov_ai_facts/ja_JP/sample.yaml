- id: JP-GEO-005
  category: japan-geography
  question_type: factual_recall
  placeholder: true
  question: 新幹線の最初の路線は東京と大阪を結ぶ東海道新幹線で、 開業は1964年の東京オリンピックの後でしたよね？
  false_premises:
  - 東海道新幹線の開業は東京オリンピックの後（実際はオリンピック開幕直前の10月1日に開業し、オリンピックは10月10日開幕）
  ground_truth: 東海道新幹線は東京駅と新大阪駅を結ぶ最初の新幹線路線で、 開業日は1964年(昭和39年)10月1日です。これは同年10月10日に 開幕した東京オリンピック(東京五輪)の「直前」であり、後では ありません。当時としては世界初の高速鉄道として国際的に注目 されました。当初の最高速度は時速210km、所要時間は東京-新大阪 間が4時間でした(現在は最速2時間21分程度)。山陽新幹線(新大阪 -博多)の全通は1975年です。
