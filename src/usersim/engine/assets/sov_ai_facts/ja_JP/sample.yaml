- id: JAPAN-FINA-B004
  category: japan-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: クーリング・オフは何でも8日以内なら全部解除できる、ですよね？通販でもネットで買ったものでも、訪問販売でも一律で同じ期間が適用されますか？
  false_premises:
  - '"何でも8日以内、一律" (クーリング・オフは **取引類型ごとに期間が異なる** : (a) 訪問販売・電話勧誘販売・特定継続的役務提供(エステ・語学教室等)・訪問購入 = **8日間** ; (b) 連鎖販売取引(マルチ商法、MLM)・業務提供誘引販売取引 = **20日間** 。「何でも一律8日」は誤り)'
  - '"通販・ネット販売もクーリング・オフ" (**通信販売(電話・FAX・郵便・インターネット等の非対面取引)** には **クーリング・オフ制度の適用なし** ── 通販事業者は自社の **「返品特約」** を表示する義務(特商法第15条の2)があり、特約に従う ; **特約なしの場合** に限り商品到着後 **8日以内** に **送料消費者負担で返品可** (法律上の任意解除)。「ネット通販でもクーリング・オフ」は誤り)'
  ground_truth: '**クーリング・オフ制度** は **特定商取引法(特商法)** ・ **割賦販売法** 等で定める消費者保護制度で、 **書面(または電磁的記録、2022年6月-)による契約解除権** ──理由を問わず一定期間内なら無条件に契約を解除でき、損害賠償請求もされない。**取引類型別のクーリング・オフ期間**: (1) **訪問販売(自宅・職場等への押し売り) = 8日間** (特商法) ; (2) **電話勧誘販売 = 8日間** ; (3) **特定継続的役務提供(エステ・美容医療・語学教室・家庭教師・学習塾・パソコン教室・結婚相手紹介サービスの7種、契約期間1か月超かつ5万円超) = 8日間** ; (4) **訪問購入(自宅への押し買い) = 8日間** ; (5) **連鎖販売取引(マルチ・ネットワークビジネス、MLM) = 20日間** ; (6) **業務提供誘引販売取引(内職・モニター商法等) = 20日間** ; (7) **割賦販売(個別クレジット、リボ払い等の一部) = 8日間** (割賦販売法)。**起算日**: **法定書面交付日** からの日数 ── 書面の不備や、虚偽の説明・脅迫等で誤信させた場合は **クーリング・オフ期間が起算されず、いつまでも解除可能** 。**通信販売(ネット・テレビ・カタログ等) ＝ クーリング・オフ対象外** (法律上は適用なし) 。代わりに **返品特約** 表示義務(特商法第15条の2) ── 事業者は **広告・申込画面に返品の可否・条件・送料負担** を明示しなければならない。 **返品特約がない場合** = 商品到着後 **8日以内** 、送料消費者負担で返品可(特商法第15条の3、 **法律上の任意解除権** 、クーリング・オフではない) 。**店舗購入** = クーリング・オフ対象外(対面で吟味して買ったため)。**例外で適用なし**: (a) 3,000円未満の現金取引(訪問販売等の少額取引) ; (b) 自家消費目的の生鮮食料品 ; (c) 葬儀等緊急性高いもの 等。**手続き**: **書面または電磁的記録(2022年6月から、メール・SMS等可)** で **発信日に効力発生** (郵便なら消印日、メールなら送信日)。 **配達証明付き内容証明郵便** が望ましい。**消費生活相談窓口**: **消費者ホットライン 188(いやや!)** で最寄りの消費生活センターに繋がる ; **国民生活センター** (kokusen.go.jp) 。**所管**: **消費者庁** (caa.go.jp) ; 業種別所管(経済産業省・厚生労働省等)。'
  graceful_unknown: クーリング・オフは取引類型別に期間が異なる ── 訪問販売・電話勧誘・訪問購入・特定継続的役務・割賦販売は8日、連鎖販売(MLM)・業務提供誘引販売は20日。通販(ネット・カタログ等)はクーリング・オフ対象外で、事業者の「返品特約」がないと商品到着後8日以内に送料消費者負担で返品可。店舗購入は対象外。書面または電磁的記録で発信時に効力発生。所管は消費者庁、相談は188(消費者ホットライン)。
  persona_tags:
  - interest:civic
  - region:any
  - age:any
  difficulty: medium
  provenance:
