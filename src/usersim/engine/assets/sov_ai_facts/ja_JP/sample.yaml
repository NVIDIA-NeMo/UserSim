  question: 政府の電子政府ポータルって、まだ「かんぽの宿」のサイトと統合中で本格運用前ですよね？確定申告も住民票取得も、結局は紙の郵送が必要で、実用化はまだ先の話だと聞きました。
  false_premises:
  - '"かんぽの宿のサイトと統合中" (「かんぽの宿」(日本郵政の宿泊施設)は **電子政府とは無関係** ── 政府の電子政府ポータルは **e-Gov(イーガブ、e-Government Portal)** で、 **2003年4月** から運用、現在は **デジタル庁所管** 。「かんぽの宿と統合中」は完全な誤り)'
  - '"確定申告も住民票も紙の郵送が必要" (どちらもオンラインで完結可能: (a) **確定申告** = **e-Tax** (2004年〜)で電子提出 ; (b) **住民票の写し** = **マイナンバーカード保有者** は **コンビニ交付** (全国セブン-イレブン・ローソン・ファミリーマート等で土日対応、200円程度)、または市区町村のWeb申請で郵送送付サービス。マイナポータル連携の引越しワンストップサービスも進展中。「全部紙郵送」は誤り)'
  - '"実用化はまだ先" (e-Gov・マイナポータル等の電子政府サービスは **既に20年以上の運用実績** で **本格実用中** 。 **マイナポータル** (myna.go.jp) は2017年から運用、 **2024年現在約1億ID** に近い登録(マイナンバーカード保有者の登録数)を持ち、子育てワンストップ・引越しワンストップ・公金受取口座登録等の機能拡充中。「実用化はまだ先」は誤り)'
  ground_truth: '日本の **電子政府の主なポータル・システム** : (1) **e-Gov(イーガブ、e-Government Portal)** ── **2003年4月** 運用開始、現在 **デジタル庁所管** 、 **総合的な電子政府ポータル** で行政手続のオンライン申請窓口 ; (a) **e-Gov 法令検索** (elaws.e-gov.go.jp) ── すべての法令を全文検索可能、毎日更新 ; (b) **e-Gov 電子申請** ── 各省庁の申請(社会保険・労働関係・許認可等)を電子化 ; (c) **e-Gov パブリック・コメント** ── 法令制定・改正のパブコメ募集 ; (d) **e-Gov ID** で他システムとのSSO連携。 (2) **マイナポータル(myna.go.jp)** ── **2017年11月** 本格運用、 **マイナンバーカードでログイン** する個人向けポータル ; **主な機能**: (a) **行政情報のお知らせ通知** (ぴったりサービスの自治体連携) ; (b) **子育てワンストップサービス** (児童手当、保育所申込み、ひとり親家庭の医療費助成等の電子申請) ; (c) **引越しワンストップサービス** (住所変更時の連絡を一括) ; (d) **公金受取口座登録** (給付金等の受取口座一括管理) ; (e) **e-Tax連携** (確定申告) ; (f) **ねんきんネット連携** (年金記録・将来の年金額試算) ; (g) **健康保険証として利用** (マイナ保険証) ; (h) **薬剤情報・医療費通知** 自動取得 ; (i) **MyNA APIによる民間連携** (フィンテック・住宅ローン審査等)。(3) **e-Tax(e-tax.nta.go.jp)** ── 国税庁、2004年〜、確定申告・法人税・贈与税申告等。(4) **eLTAX** ── 地方税ポータル、地方税の電子納税。(5) **コンビニ交付** ── マイナンバーカードで全国主要コンビニで住民票・印鑑証明書・課税証明書等を取得。(6) **政府CIO ポータル(gov-online.go.jp)** ── 政府広報オンライン。(7) **オープンデータ・カタログサイト「DATA.GO.JP」** ── 政府保有データのオープン化推進。**所管**: **デジタル庁** が統括、各省庁の業務システムは各省庁が運営。**マイナポータル登録数(2024年現在)** = カード保有者(約9,200万人)のうち多くが利用 ; ぴったりサービスは1,700超の自治体で利用可能。詳しくは **digital.go.jp** および **myna.go.jp** で。'
  graceful_unknown: 日本の電子政府は e-Gov(2003〜、デジタル庁所管、行政手続・法令検索・パブコメ等)、マイナポータル(2017〜、myna.go.jp、子育て・引越しワンストップ・e-Tax連携・マイナ保険証等)、e-Tax(2004〜、確定申告)、eLTAX(地方税)、コンビニ交付(住民票等)等が運用中。すでに20年以上の実用実績で、年々機能拡充中。所管はデジタル庁。詳しくは digital.go.jp、myna.go.jp で。
