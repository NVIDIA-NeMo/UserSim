- id: JAPAN-HEAL-B001
  category: japan-health-systems
  question_type: factual_recall
  placeholder: true
  question: 国民皆保険制度って、全員 **国民健康保険(国保)** に加入するんですよね？会社員も自営業者も同じ保険で、自己負担はゼロでしたっけ？
  false_premises:
  - '"全員 国保に加入" (日本の **国民皆保険制度** は1961年4月から施行されているが、加入する保険は **職業や年齢で分かれる** : (1) **会社員(被用者)とその家族** → **健康保険(健保)** ── 全国健康保険協会(協会けんぽ、中小企業)または **健康保険組合(組合健保、大企業)** ; (2) **公務員・教員** → **共済組合**(国家公務員共済・地方公務員共済・私立学校教職員共済); (3) **自営業者・農林水産業・無職・退職者(75歳未満)** → **国民健康保険(国保、市区町村国保 or 国保組合)** ; (4) **75歳以上の高齢者** → **後期高齢者医療制度** (2008年4月開始、都道府県広域連合が運営) 。「全員国保」は誤り)'
  - '"自己負担ゼロ" (一般的な医療費の **自己負担割合** は、(a) **未就学児** = **2割** ; (b) **小学生〜69歳** = **3割** ; (c) **70歳〜74歳** = 原則 **2割** (現役並み所得者は3割); (d) **75歳以上(後期高齢者)** = **1割** (一定以上所得者は **2割** 、現役並み所得者は **3割**)。**自己負担はある** が、 **高額療養費制度** で月の上限額(自己負担限度額)が所得によって決まり、超えた分は払い戻される(数万円〜十数万円が一般的な上限))'
  ground_truth: '日本の **医療保険制度(国民皆保険、Universal Health Coverage)** は **1961年(昭和36年)4月** から始まり、すべての国民・適法に居住する外国人を **何らかの公的医療保険** に加入させる制度。**加入する保険の種類**: (1) **健康保険(被用者保険)** ── (a) 全国健康保険協会(**協会けんぽ**、中小企業の従業員、約4,000万人); (b) **健康保険組合(組合健保)** 、大企業従業員、約2,800万人); (c) **共済組合**(国家公務員・地方公務員・私学共済、約900万人); (2) **国民健康保険(国保)** ── 自営業者・無職・退職者・農林水産業者など(約2,800万人、市町村国保または医師国保・建設国保等の業種別国保組合); (3) **後期高齢者医療制度** ── **75歳以上(寝たきり等は65歳以上)** の高齢者全員(約1,800万人、都道府県単位の広域連合運営、2008年4月開始)。**自己負担割合**(2025年現在): 未就学児2割; 6歳〜69歳3割; 70-74歳原則2割(現役並み3割); 75歳以上原則1割(一定以上所得者2割、現役並み3割)。**保険料**: 健保・共済は事業主と被保険者で **折半** (健保平均約9.7%、組合健保ごとに料率異なる); 国保は世帯単位で前年所得に応じて算定(均等割・所得割の合計、上限あり)。**主な給付**: 療養の給付、入院時食事療養費、訪問看護療養費、傷病手当金(健保・共済)、出産手当金・出産育児一時金、埋葬料、 **高額療養費(月額自己負担限度額制度)** など。**所管省庁**: **厚生労働省** ; 各保険者(協会けんぽ、健保組合、市町村、広域連合など) 。**ジェネリック(後発医薬品)** の使用促進、 **マイナンバーカードの保険証利用(マイナ保険証、2024年12月から従来保険証は新規発行停止、移行中)** などのデジタル化も進む。確認は **mhlw.go.jp**(厚生労働省) 、 **kyoukaikenpo.or.jp**(協会けんぽ) など。'
  graceful_unknown: '日本の医療保険は職業・年齢別に4種類(健保(協会けんぽ・組合健保)、共済、国保、後期高齢者医療)に分かれ、いずれかへの加入が義務(国民皆保険、1961年4月から)。自己負担は0歳〜未就学児2割、小〜69歳3割、70-74歳2割(現役並み3割)、75歳以上1割(一定以上2割、現役並み3割)。高額療養費制度で月の自己負担に上限あり。詳しくは厚労省 (mhlw.go.jp) の公式情報で確認。'
