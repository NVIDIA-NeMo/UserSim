- id: JP-CUL-005
  category: japan-culture
  question_type: factual_recall
  placeholder: true
  question: 宮崎駿監督の代表作『千と千尋の神隠し』は、確かカンヌ映画祭で パルム・ドールを受賞しましたよね？
  false_premises:
  - カンヌ映画祭でパルム・ドールを受賞（実際はベルリン国際映画祭で金熊賞、米アカデミー賞で長編アニメーション映画賞）
  ground_truth: 『千と千尋の神隠し』(2001年公開、宮崎駿監督、スタジオジブリ)が 受賞したのは「カンヌ映画祭」のパルム・ドール「ではなく」、 2002年の「ベルリン国際映画祭」で金熊賞(最高賞)を受賞しました。 また、2003年の第75回アカデミー賞で長編アニメーション映画賞を 受賞しています(日本作品およびアジア作品で初の同賞受賞)。 カンヌ映画祭の パルム・ドールはまた別の最高賞で、宮崎作品で パルム・ドール受賞作はありません。日本人監督では今村昌平 『楢山節考』『うなぎ』、是枝裕和『万引き家族』などが パルム・ドール受賞者として知られます。
  persona_tags:
  - interest:music
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: Japan beta review of original sample entry
