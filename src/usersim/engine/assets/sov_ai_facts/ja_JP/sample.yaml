  ground_truth: |-
    小林一茶(1763-1828)の代表的な一句、『七番日記』(文化13年/ 1816年頃)所収:

    「やせ蛙負けるな一茶これにあり」(やせがえる まけるないっさ これにあり)

    季語は「蛙」(春)。蛙の闘い(蛙合戦)を題材に、痩せた一匹の 蛙を一茶自身が応援する、ユーモラスかつ自己投影的な作風で、 小林一茶らしい人間味が現れた句として知られます。一茶は飢饉や 家庭の不幸を多く経験した俳人で、その境遇が反映された素朴で 温かい句が多いとされます。
  graceful_unknown: 「やせ蛙」で始まる一茶の句があるのは存じていますが、中・下七 の細部(語順や送り仮名)に自信がないので、迂闊に補完するのは 避けたいです。『七番日記』(文化年間)が出典として知られます。
