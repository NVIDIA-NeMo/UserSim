- id: JAPAN-DIGI-B004
  category: japan-digital-services
  question_type: factual_recall
  placeholder: true
  question: e-Taxは2024年から始まった新しい仕組みですよね？マイナンバーカードがないと使えなくて、利用には毎年5,000円の登録料が必要なんでしたっけ？
  false_premises:
  - '"2024年から始まった" (e-Tax(国税電子申告・納税システム)は **2004年6月** から運用開始 ── 既に **20年以上の実績** 。「2024年から」は誤り)'
  - '"マイナンバーカードがないと使えない" (e-Tax の認証方式は **2種類** : (a) **マイナンバーカード方式** (推奨) ; (b) **ID・パスワード方式** ── 税務署で本人確認 + ID・パスワード発行を受けて利用、 **マイナンバーカードなしでもOK** 。「マイナカードないと使えない」は不正確)'
  - '"毎年5,000円の登録料" (e-Tax の利用は **完全無料** ── 国税庁が運営する公的サービス。「登録料あり」は誤り)'
  ground_truth: '**e-Tax(国税電子申告・納税システム)** ── **国税庁** が運営する **2004年6月** から運用の電子申告・電子納税のオンラインシステム。所得税確定申告・法人税申告・消費税申告・贈与税申告等の各種申告 ・申請・届出を **PCやスマホ** から提出可能。**主な特徴**: (1) **24時間提出可能(メンテナンス時除く)** ; (2) **完全無料** ; (3) **添付書類の一部省略可能** ── 医療費領収書、源泉徴収票、寄附金受領証明書等を提出原本省略可(原本5年保管義務あり) ; (4) **還付金が早い** ── 紙申告(1〜1.5か月)よりe-Tax(3週間程度)が早い ; (5) **青色申告特別控除65万円** はe-Tax提出または電子帳簿保存が必要(2020年改正で紙提出は55万円に減額)。**認証方式(2種類)**: (1) **マイナンバーカード方式** (推奨)── マイナンバーカード + (a) ICカードリーダー or (b) **対応スマートフォン** (NFCで読取り)で認証。 **マイナポータルアプリ** からのスマホ申告 が **2024年から大幅機能拡充** 。(2) **ID・パスワード方式** ── 税務署で本人確認後、 **e-Tax用のID・パスワード** が発行され、マイナンバーカードなしでも利用可能(ただし暫定的措置で、将来は廃止方針)。**スマホ申告の対応範囲(2024年版)**: 給与所得・公的年金・株式譲渡・配当・一時所得・雑所得・ふるさと納税・住宅ローン控除・医療費控除等、ほぼフルカバー。**準備するもの(マイナカード方式)**: マイナンバーカード+利用者証明用電子証明書暗証番号(4桁) + 署名用電子証明書暗証番号(6-16桁) + 対応スマホまたはPC+ICカードリーダー。**マイナポータル連携**: マイナポータルから連携で、 **保険料控除証明書(生命保険)、ふるさと納税寄付金控除証明書、医療費通知** 等が **自動入力** される(2024年から拡充) ── 「事前準備セットアップ」が必要。**確認**: **国税庁ホームページ** (nta.go.jp) → **「確定申告書等作成コーナー」** (kakushin.nta.go.jp) ── ブラウザだけで完結する申告作成・送信 ; **e-Taxホームページ** (e-tax.nta.go.jp) で詳細手続案内。'
  graceful_unknown: e-Tax は2004年6月から運用、国税庁の電子申告・納税システム、利用無料・24時間提出可・添付書類一部省略可。認証はマイナンバーカード方式(推奨)とID・パスワード方式の2種類。スマホ申告は2024年から大幅拡充、マイナポータル連携で控除証明書等自動入力。「確定申告書等作成コーナー」(kakushin.nta.go.jp)でブラウザだけで完結。所管は国税庁 (nta.go.jp)。
  persona_tags:
  - interest:tech
  - region:any
  - age:any
  difficulty: easy
  provenance:
