- id: JAPAN-FINA-B002
  category: japan-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 消費税は全部のものに15%で、店も商品も同じ税率ですよね？飲食店だけ8%とかいう話もあるんですか？個人事業主は消費税納める必要なしですか？
  false_premises:
  - '"全部15%" (消費税の **標準税率は10%** (うち地方消費税2.2%) ; 「15%」は誤り。 **消費税率の変遷**: 1989年4月導入 = 3% → 1997年4月 = 5% → 2014年4月 = 8% → **2019年10月 = 10%(軽減税率8%併用導入)**)'
  - '"飲食店だけ8%" (軽減税率8%は **酒類・外食を除く飲食料品(イートイン除外、テイクアウト・出前・宅配は8%)** + **新聞(週2回以上発行・定期購読契約)** が対象。 **外食(店内飲食)は標準税率10%、テイクアウト・宅配は軽減8%** という分け方。「飲食店全体が8%」は誤り)'
  - '"個人事業主は納税義務なし" (個人事業主も消費税の **課税事業者となる場合は納税義務あり** : (a) 基準期間(個人は前々年、法人は前々事業年度)の **課税売上高が1,000万円超** で課税事業者 ; (b) **特定期間(個人は前年1-6月)** の課税売上高または給与等支払額が1,000万円超でも課税事業者 ; (c) **インボイス制度(2023年10月1日開始)** 以降、 **適格請求書発行事業者** に登録した場合は売上規模問わず課税事業者となる。「個人事業主は納税義務なし」は誤り)'
  ground_truth: '日本の **消費税** は **消費税法** に基づく付加価値税で、 **国税庁** 所管。**税率(2019年10月から)**: (1) **標準税率 = 10%** (うち国の消費税7.8% + 地方消費税2.2%) ── ほとんどの商品・サービス ; (2) **軽減税率 = 8%** (うち国6.24% + 地方1.76%) ── (a) **酒類・外食を除く飲食料品** (米・野菜・肉・魚・パン・菓子・ミネラルウォーター等)、 (b) **新聞(週2回以上発行で定期購読契約)** 。 **「酒類」** = 酒税法上の酒類(アルコール度数1度以上)は10% ; **「外食」** = テーブル・椅子等飲食設備があるところでの食事提供は10%、 **テイクアウト・宅配・出前は8%** 。 **コンビニのイートイン** = 顧客が店内飲食を選択した場合10%、テイクアウトの意思表示で8%(店側は確認義務)。**納税義務者**: 課税事業者が販売時に消費税を上乗せして受け取り、税務署に納付する仕組み(間接税)。**事業者の納税義務**: (a) **基準期間(個人=前々年、法人=前々事業年度)の課税売上高1,000万円超** で課税事業者 ; (b) **特定期間(個人=前年1-6月、法人=前事業年度上半期)の課税売上高または給与等支払額が1,000万円超** でも課税事業者 ; (c) **資本金1,000万円以上の新設法人** は設立当初から課税事業者 ; (d) **適格請求書発行事業者(インボイス登録)** = 売上規模問わず課税事業者(2023年10月制度開始) 。**インボイス制度(適格請求書等保存方式、2023年10月1日開始)**: **消費税の仕入税額控除** を受けるためには、原則 **適格請求書(インボイス)** の保存が必要。免税事業者(基準売上1,000万円以下)は適格請求書を発行できず、その取引相手の仕入税額控除に支障 ── このため多くの個人事業主が課税事業者へ移行(2割特例・少額特例等の経過措置あり)。**確定申告**: 個人事業主は翌年3月31日まで(消費税)、所得税は3月15日まで(振替納税は4月以降)。**確認**: **国税庁** (nta.go.jp) 、 **国税局・税務署** ; **インボイス制度サイト** (kokuzeicho.invoice.gov.jp/inv/)。'
  graceful_unknown: 消費税は標準税率10%(国7.8%+地方2.2%)・軽減税率8%(飲食料品・新聞、酒類と外食を除く)。テイクアウトは8%、店内飲食は10%。個人事業主は基準期間売上1,000万円超または適格請求書発行事業者登録で課税事業者に。インボイス制度は2023年10月開始。所管は国税庁(nta.go.jp)。
