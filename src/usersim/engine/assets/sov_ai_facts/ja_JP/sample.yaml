- id: JAPAN-EDUC-B006
  category: japan-education
  question_type: factual_recall
  placeholder: true
  question: 日本の不登校って、2024年にはほぼゼロになったと聞きました。スクールカウンセラーは全部の学校に常駐していて、フリースクールも文部科学省が認可する正式な学校扱いになりましたよね？
  false_premises:
  - '"2024年にほぼゼロ" (文部科学省「児童生徒の問題行動・不登校等生徒指導上の諸課題に関する調査」によると、 **小・中学校の不登校児童生徒数は2023年度で約34.6万人** と過去最多 (10年連続増加、2013年度の約12万人から約3倍 ; 高校生も含めると約40万人超) 。「ほぼゼロ」は誤り、社会課題として深刻化している)'
  - '"スクールカウンセラーは全校常駐" (スクールカウンセラー(SC)・スクールソーシャルワーカー(SSW)は **配置拡大中** だが **完全配置されていない** : 公立中学校はほぼ100%配置(週1日が多い)、 **公立小学校は約75%(2024年度、文部科学省)** 、配置時間も学校により大きな差。常駐している学校は限られる。 **教職員定数化されていない非常勤** が多い。「全校常駐」は誤り)'
  - '"フリースクールが文部科学省認可の正式学校" (フリースクールは **学校教育法第1条に基づく学校(いわゆる「一条校」)ではない** ── 民間団体・NPO が運営する **学校外の学びの場** 。ただし **教育機会確保法(義務教育の段階における普通教育に相当する教育の機会の確保等に関する法律、2017年2月施行)** により、不登校児童生徒の **学校以外の学習も学校長判断で出席扱いとできる** 仕組みは整備された。「文科省認可の正式学校扱い」は誤り)'
  ground_truth: '日本の **不登校児童生徒** の現状と支援制度。**統計(2023年度、文部科学省「児童生徒の問題行動・不登校等生徒指導上の諸課題に関する調査」、2024年10月公表)**: (a) **小学校 = 約13万人** ; (b) **中学校 = 約21.6万人** ; (c) 合計 **約34.6万人** ── 過去最多、 **10年連続増加** (2013年度約12万人から約3倍に) 。 **高校生不登校 = 約6.8万人** で合計約41万人超。 **不登校の定義** = 「何らかの心理的、情緒的、身体的あるいは社会的要因・背景により、児童生徒が登校しないあるいはしたくともできない状況にあるため年間 **30日以上** 欠席した者(病気や経済的理由を除く)」。**支援制度**: (1) **教育機会確保法(2017年2月施行)** ── 不登校児童生徒に対する **多様な学びの機会** を確保。学校以外の場(フリースクール、教育支援センター(適応指導教室)、ICT利用学習)の活用を推進。 **学校外で学ぶ場合も、一定要件の下で学校長判断で出席扱い** とできる。(2) **教育支援センター(適応指導教室)** ── 各市町村教育委員会が設置(設置率約75%、2024年度) 、不登校児童生徒に学習・カウンセリングを提供。(3) **フリースクール** ── 民間団体・NPO等が運営する **学校外の学びの場** ── 学校教育法第1条の「学校(一条校)」ではないが、教育機会確保法によりその役割が法的に位置付けられた。(4) **スクールカウンセラー(SC)** ── 1995年度配置開始、 **公立中学校はほぼ100%配置** (週1日程度が多い) 、 **公立小学校配置率は約75%** (2024年度) 、高校も配置進行中。(5) **スクールソーシャルワーカー(SSW)** ── 2008年度配置開始、福祉的支援が必要なケースに対応 ; 配置率は SC より低い。(6) **24時間子供SOSダイヤル**(0120-0-78310) 、 **24時間子供の人権110番** (0120-007-110) 、 **チャイルドライン** (0120-99-7777) などの相談窓口。**夜間中学(中学校夜間学級)**: 義務教育を修了していない人や形式的に卒業したが学び直しを希望する人(不登校だった人含む)向け、全国に約45校(2024年度、文部科学省)。**所管**: 文部科学省(mext.go.jp) 。詳細は **文部科学省「不登校への対応について」** ページで確認。'
  graceful_unknown: 日本の不登校児童生徒は2023年度で小中合計約34.6万人(過去最多、10年連続増加)。教育機会確保法(2017)で学校外の学びの場(フリースクール・教育支援センター)も活用を推進、出席扱いも条件次第で可能。フリースクールは民間運営で学校教育法第1条の学校ではない。スクールカウンセラーは公立中学ほぼ100%(週1程度)・小学校約75%配置。詳しくは文部科学省 (mext.go.jp) で。
