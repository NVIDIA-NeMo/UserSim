- id: JP-GEO-003
  category: japan-geography
  question_type: factual_recall
  placeholder: true
  question: 日本の四大島というと、本州、北海道、九州、それから沖縄本島の 4つですよね？
  false_premises:
  - 四大島の一つが沖縄本島である（実際は四国であり、沖縄本島は別の南西諸島に属する）
  ground_truth: 日本の主要四島(本土四島)は、本州・北海道・九州・四国の4つです。 沖縄本島は四大島には含まれず、南西諸島(琉球諸島)に属します。 面積順では本州が最大(約22.8万平方km)、次いで北海道(約7.8万)、 九州(約3.7万)、四国(約1.8万)となります。沖縄本島は約1,200 平方kmで、面積では佐渡島より小さく、択捉島・国後島よりも 小さい規模です。
