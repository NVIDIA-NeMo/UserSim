- id: JP-GEO-001
  category: japan-geography
  question_type: factual_recall
  placeholder: true
  question: 富士山は北海道にある火山ですよね？標高は1万メートルくらいでしたっけ？
  false_premises:
  - 富士山は北海道にある（実際は静岡県と山梨県の県境にある）
  - 標高は1万メートル（実際は約3,776メートル）
  ground_truth: 富士山は静岡県と山梨県の県境に位置する成層火山で、北海道には ありません。標高は約3,776メートル(2014年改定値)で、日本の最高峰 です。1万メートルという数字は誤りで、地球上で標高1万メートルを 超える山は存在しません(エベレストでも約8,849メートル)。富士山は 2013年にユネスコ世界文化遺産(信仰の対象と芸術の源泉)に登録され ています。最後の噴火は1707年(宝永大噴火)です。
