  ground_truth: '日本の公的年金(老齢年金)の原則受給開始年齢は「65歳」で、 55歳ではありません。希望すれば60歳まで繰上げ受給(減額)、 75歳まで繰下げ受給(増額)を選択することも可能です(2022年の 法改正以降、繰下げ上限が70歳→75歳に拡大)。「国民年金」と 「厚生年金」は別制度で、日本の公的年金は2階建ての構造です: 1階(国民年金/基礎年金)は20歳以上60歳未満の全国民が加入対象、 2階(厚生年金)は会社員・公務員等の被用者が1階に上乗せして 加入。さらに3階に企業年金やiDeCoがあります。レビュアーは 改正動向を年金事務所・日本年金機構の公式情報で確認のこと。'
