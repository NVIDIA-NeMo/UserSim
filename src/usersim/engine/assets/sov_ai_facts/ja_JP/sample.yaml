- id: JAPAN-LABO-B003
  category: japan-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: 公的年金は60歳から自動的に満額もらえるんですよね？国民年金と厚生年金は同じ金額で、加入したことなくても65歳になったら誰でも受け取れますか？
  false_premises:
  - '"60歳から自動的に満額" (公的年金の **支給開始年齢は原則65歳** (2025年現在)。 **繰上げ受給(60歳から)** は可能だが減額(月0.4%減、最大24%減 ; 2022年4月から減額率緩和) ; **繰下げ受給(66歳以降〜75歳まで)** で増額(月0.7%増、最大75歳まで75%増 ; 2022年4月から75歳まで延長)。「60歳から自動・満額」は誤り。 **特別支給の老齢厚生年金** は経過措置で生年月日に応じて60歳〜65歳支給だが、 **男性は1961年4月2日以降生まれ・女性は1966年4月2日以降生まれは支給なし**)'
  - '"国民年金と厚生年金は同じ金額" (両者は別の制度で金額が異なる: (a) **国民年金(基礎年金)** ── 自営業者・学生・無職等が加入、保険料は **月額16,980円(2024年度)** で年間約20.4万円、 **満額年金(40年加入時)は年816,000円(月額68,000円、2024年度)** ; (b) **厚生年金** ── 会社員・公務員等が加入、報酬比例で保険料は **標準報酬月額の18.3%** (労使折半で本人負担9.15%) 、 **基礎年金(国民年金部分)に厚生年金の報酬比例部分が上乗せ** される構造)'
  - '"加入したことなくても誰でも受け取れる" (年金は **保険料納付期間** が **10年以上(2017年8月から、それ以前は25年)** 必要。免除・猶予期間も納付期間に算入できるが、 **未加入・未納の期間が長く合計10年に満たない場合は受給資格なし** 。「加入したことなくても誰でも」は誤り)'
  ground_truth: '日本の公的年金制度は **国民皆年金** (1961年から)で、 **2階建て構造** (公務員等は3階建て: 国民年金 + 厚生年金 + 退職等年金給付/旧共済年金)。**1階 = 国民年金(基礎年金)** ── 20歳以上60歳未満の **全国民が加入(被保険者)** : (a) **第1号被保険者** = 自営業・学生・無職等、保険料月額16,980円(2024年度) ; (b) **第2号被保険者** = 会社員・公務員、厚生年金保険料に基礎年金分が含まれる ; (c) **第3号被保険者** = 第2号被保険者の被扶養配偶者(20-59歳、年収130万円未満等)、保険料負担なし(第2号配偶者の年金から拠出) 。**満額**(40年加入時、2024年度) = **年816,000円(月68,000円)** 。**2階 = 厚生年金保険** ── 会社員・公務員等が加入、 **標準報酬月額の18.3%** が保険料(労使折半、本人負担9.15%) 、 **報酬比例** で年金額決定 ; 基礎年金に上乗せして支給。 **支給開始年齢**: **原則65歳** ; **繰上げ受給**(60-64歳、減額月0.4%、最大24%減) ; **繰下げ受給**(66-75歳、増額月0.7%、最大75歳で84%増)。**特別支給の老齢厚生年金**: 経過措置で生年月日と性別に応じて60歳〜64歳支給(男性は1961年4月2日以降、女性は1966年4月2日以降生まれは特別支給なし)。**受給資格期間**: **10年以上** (2017年8月から、それ以前は25年)── 国民年金保険料納付期間+免除・猶予期間+合算対象期間の合計。**主な給付**: (1) **老齢年金**(老齢基礎年金 + 老齢厚生年金) ; (2) **障害年金**(障害基礎年金 + 障害厚生年金、1〜3級) ; (3) **遺族年金**(遺族基礎年金 + 遺族厚生年金) ; (4) **付加年金**(第1号被保険者のみ、月400円追加で受給時に200円×納付月数加算) 。**所管**: **厚生労働省** ; **日本年金機構** (nenkin.go.jp) が運営。**ねんきんネット**: マイナポータル連携でオンライン年金記録・見込額確認可能。**iDeCo(個人型確定拠出年金、3階部分)** や **企業年金** は別制度(任意加入)。詳細は **nenkin.go.jp** および年金事務所窓口で確認。'
  graceful_unknown: 日本の公的年金は国民皆年金の2階建て(基礎年金=国民年金 + 厚生年金)。支給開始は原則65歳、繰上げ(60-64歳、最大24%減)・繰下げ(66-75歳、最大84%増)選択可。受給には保険料納付10年以上必要(2017年〜)。国民年金満額は2024年度で年81.6万円(月6.8万円)。厚生年金は報酬比例で上乗せ。所管は厚生労働省、運営は日本年金機構(nenkin.go.jp)。
