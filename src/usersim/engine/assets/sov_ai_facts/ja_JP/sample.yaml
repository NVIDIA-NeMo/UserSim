- id: JAPAN-EDUC-B004
  category: japan-education
  question_type: factual_recall
  placeholder: true
  question: 日本の教育制度の改革って、毎年文部科学大臣の判断で全部変えるんですよね？教科書も毎年違うものに切り替わって、私立学校だけは政府の関与なしで自由に運営しているんでしたっけ？
  false_premises:
  - '"毎年大臣判断で全部変える" (日本の教育課程は **学習指導要領** によって決まり、 **約10年に1度** 改訂(国の教育課程の基準を文部科学大臣が **告示** で定める ; 中央教育審議会(中教審)の答申を経て決定 ; 改訂の準備・告示・移行期間・全面実施まで通常 **5-7年** かかる)。「毎年」は誤り。直近では **小学校2017年告示・2020年度全面実施、中学2017年告示・2021年度全面実施、高校2018年告示・2022年度入学生から年次進行で全面実施** )'
  - '"教科書は毎年違うもの" (検定教科書の **教科書採択** は **4年に1度** (小学校・中学校)実施。教科書会社は文部科学省の **教科書検定** を経て、各都道府県教育委員会(公立)・各国立学校設置者・各私立学校(設置者)が採択。「毎年違うものに切り替わる」は誤り。)'
  - '"私立学校は政府の関与なし" (私立学校も学校教育法・私立学校法・私立学校振興助成法等に基づき **設置認可・指導監督** を受ける。 **学習指導要領** にも準拠する義務 ; 教科書も検定教科書を使用 ; **私学助成** (国・都道府県の経常費補助、約50%が公費)も受ける。「政府の関与なし」は誤り)'
  ground_truth: '日本の **教育制度** は **教育基本法** (1947年制定、2006年改正) ・ **学校教育法** (1947年) ・ **教育公務員特例法** ・ **学校保健安全法** ・ **学校給食法** ・ **私立学校法** など多数の法令に基づく。**学習指導要領**: 文部科学大臣が **告示** で定める **国の教育課程の基準** ; 約10年に1度改訂 ; 中央教育審議会(中教審)が文科大臣の諮問に対して答申、これを踏まえて改訂 ; 公立・私立を問わず **全国の学校に適用** 。**教科書制度**: (1) **検定** ── 教科書会社が編集し、文部科学省の **教科用図書検定調査審議会** (検定審議会)が審査 ; (2) **採択** ── 公立学校(小中)は **教科書発行法・無償措置法** に基づき市町村教育委員会が **共同採択地区** ごとに採択(4年に1度)、公立高校は学校別、国立は国立大学法人、私立は学校設置者が採択 ; (3) **無償給与** ── 義務教育段階(小中)は無償 ; (4) **デジタル教科書** ── 2024年度から段階的に学習者用デジタル教科書を本格導入。**所管**: **文部科学省** (mext.go.jp) ; 学校設置者は市町村(小中)、都道府県(高校)、国(国立大学法人)、学校法人(私立)。**学校設置主体**: (1) **国立** = 国立大学法人(国立大学法人法、2004年法人化) ; (2) **公立** = 地方公共団体(都道府県・市町村) ; (3) **私立** = **学校法人** (私立学校法に基づき設立認可)。**私学に対する規制と支援**: 学校教育法・私立学校法に基づく設立認可・指導監督 ; 学習指導要領遵守 ; 検定教科書使用 ; **私学助成** (経常費補助金、施設整備費補助金 等)。**現行学習指導要領のキーワード**: 「主体的・対話的で深い学び(アクティブ・ラーニング)」「カリキュラム・マネジメント」「プログラミング教育」「外国語教育の早期化(小3-4で外国語活動、小5-6で教科として英語)」「道徳の教科化」「情報I」(高校、新教科)、 **特別支援教育** など。**こども家庭庁** (2023年4月発足)が0-2歳の保育・幼児教育の一部を所管。詳細は **mext.go.jp** および各都道府県教育委員会で。'
  graceful_unknown: 学習指導要領は約10年ごとに文部科学大臣が告示で改訂、中央教育審議会の答申を踏まえる。教科書は検定+採択(4年に1度の地区採択)+無償給与の3制度。私立学校も学校教育法・私立学校法に基づき認可・監督を受け、学習指導要領・検定教科書に従い、私学助成も受ける。所管は文部科学省、設置主体は国立(法人)・公立(自治体)・私立(学校法人)。
