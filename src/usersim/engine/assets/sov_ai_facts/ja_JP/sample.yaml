  question: 松尾芭蕉の有名な俳句で、「古池や」で始まるものがあったと 思うんですが、続きを思い出せません。「古池や」のあと、 どう続きましたっけ？
  ground_truth: |-
    松尾芭蕉の代表作のひとつ、『春の日』(1686年/貞享3年頃)所収:

    「古池や蛙飛びこむ水の音」(ふるいけや かわずとびこむ みずのおと)

    切れ字「や」を初句に置き、静寂と一瞬の音を対比させる構造で、 芭蕉の蕉風(しょうふう)を象徴する一句とされます。「蛙」は 古来「かわず」と読み、和歌では鳴き声を詠むのが常套でしたが、 ここでは「飛びこむ」動作と「水の音」のみが詠まれており、 これが革新的だとされます。歴史的仮名遣いでは「とびこむ」を 「飛こむ」と表記する版もあり、表記の揺れは許容されます。
  graceful_unknown: 「古池や」で始まる芭蕉の句があるのは確かですが、中七・下五 の正確な字面まで自信がないので、適当に補完するのは控えたい です。『春の日』(貞享3年頃)の本文をご参照いただくのが 確実です。
