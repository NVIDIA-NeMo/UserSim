- id: JP-HIS-002
  category: japan-history
  question_type: factual_recall
  placeholder: true
  question: 平安京に都が移されたのは奈良時代の終わりで、 移したのは聖徳太子ですよね？
  false_premises:
  - 移したのは聖徳太子（実際は桓武天皇による794年の遷都）
  - 奈良時代の終わり（厳密には平安京遷都〔794年〕をもって平安時代の始まりとされ、奈良時代の終焉と一致するが、聖徳太子〔574-622年頃〕の時代とは200年近く隔たる）
  ground_truth: 平安京への遷都は794年(延暦13年)、桓武天皇(737-806、在位 781-806)によって行われました。聖徳太子(574-622年頃)の時代 とは200年近く隔たっています。聖徳太子は飛鳥時代の人物で、 推古天皇の摂政を務め、十七条憲法・冠位十二階・遣隋使派遣 などで知られますが、平安京遷都には関与していません。平安京 は京都の前身で、長岡京(784-794年)を経てここに都が定められ、 明治維新まで実質的な日本の首都として機能しました。
  persona_tags:
