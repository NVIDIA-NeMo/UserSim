- id: JAPAN-CULT-B006
  category: japan-culture
  question_type: completion
  placeholder: true
  question: '松尾芭蕉の超有名な俳句で、「古池や」で始まるやつ、ありますよね？真ん中と最後の句が思い出せなくて...全文を教えてもらえますか？確か『おくのほそ道』に入っているんですよね？'
  false_premises: []
  ground_truth: |
    **松尾芭蕉(1644-1694)** の代表作の一つで、最も有名な俳句:

    「**古池や 蛙飛びこむ 水の音**」

    ── ふるいけや かわずとびこむ みずのおと

    **典拠と背景**:
    (1) **初出**: 貞享3年(1686年)、芭蕉43歳の時、弟子たちと共著した俳諧撰集 **『春の日』** に収録。
    (2) **出典書**: その後、各務支考の **『葛の松原』(1692年)** に成立秘話が記され、「古池や」が **下五句から発想された** ことが伝えられている(支考が芭蕉に「蛙飛びこむ水の音」と七五を提示した際、芭蕉が上五を「古池や」と置いたとする逸話)。
    (3) **形式**: 5・7・5 の17音(伝統的な俳句の定型)。「古池や」(5音)・「蛙飛びこむ」(7音)・「水の音」(5音)。「**や**」は **切れ字** で、上五句で意味を切る・余情を残す働きを持つ。
    (4) **意義**: 芭蕉の **「蕉風」(わび・さび・閑寂)** の境地を体現。日常的・身近な題材から深い静寂・無常を引き出す表現として、近代俳句・俳文学にも大きな影響を与えた。
    (5) **『おくのほそ道』との関係**: 質問の前提は誤り。『おくのほそ道』は芭蕉が弟子の河合曾良と共に1689年(元禄2年)に約150日間にわたって陸奥・出羽から北陸を経て大垣まで旅した紀行文(1702年刊)。「古池や」は **『おくのほそ道』には収録されていない**。

    **解釈例**: 静かな古池の周りに、突然蛙が水中に飛び込み、ぽちゃんという音が静寂を破る。その後再び訪れる無音 ── その対比から無常・閑寂の美を感じさせる、と一般的に解釈される。

    **出典**: 『春の日』(1686); 『葛の松原』(1692); 各種芭蕉全集(岩波書店『芭蕉全句』など)。
  graceful_unknown: '芭蕉の有名な「古池や」の句は「古池や 蛙飛びこむ 水の音」の5・7・5 形式で、貞享3年(1686年)の俳諧撰集『春の日』が初出です。『おくのほそ道』(1702年刊行の紀行文)とは別作品で、収録されていません。「や」が切れ字、蕉風の代表作とされます。岩波書店『芭蕉全句』などの公式テキストで確認できます。'
