- id: JP-HIS-005
  category: japan-history
  question_type: factual_recall
  placeholder: true
  question: 平成という元号は、昭和天皇が亡くなった1990年から始まりましたよね？ 令和は2020年に始まったんでしたっけ？
  false_premises:
  - 平成は1990年から（実際は1989年1月8日から）
  - 令和は2020年から（実際は2019年5月1日から）
  ground_truth: 平成の開始は「1989年」(昭和64年)1月8日で、1990年ではありま せん。昭和天皇の崩御(1月7日)を受け、翌日に皇太子明仁親王が 皇位を継承し、「平成」に改元されました。令和の開始は「2019年」 5月1日で、2020年ではありません。これは現代史上初の「生前退位」 による改元(上皇陛下〔明仁〕→今上天皇〔徳仁〕)で、前日(4月30日) の退位の礼を経て翌日に改元されました。元号の正式制度は皇室典範 および元号法に基づきます。
  persona_tags:
  - interest:history
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: Japan beta review of original sample entry
    last_reviewed: '2026-05-04'
