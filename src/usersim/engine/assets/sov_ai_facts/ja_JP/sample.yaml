- id: JAPAN-FINA-B001
  category: japan-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: 新NISAって、毎年100万円までで、5年間限定の制度ですよね？利益が出たら20%課税されて、生涯で500万円まで投資できるんでしたっけ？
  false_premises:
  - '"毎年100万円まで" (新NISA(2024年1月から開始)の年間投資枠は **「つみたて投資枠120万円 + 成長投資枠240万円 = 合計360万円/年」** ── 100万円ではない)'
  - '"5年間限定" (新NISAの **非課税保有期間は無期限** ── 「5年間限定」は **旧NISA(2014-2023年)の一般NISA** の制限。新NISAは **制度自体も恒久化** され、保有期間も無期限化された)'
  - '"利益に20%課税" (NISA口座内の **譲渡益・配当・分配金は非課税** ── これがNISAの最大のメリット。「20%課税」は **特定口座・一般口座** での通常課税(所得税15.315%+住民税5%=合計20.315%)と混同 ; 新NISAでは非課税)'
  - '"生涯500万円まで" (新NISAの **生涯投資枠(非課税保有限度額)** = **1,800万円(うち成長投資枠は1,200万円まで)** ── 500万円ではない。 **売却すれば翌年に枠が復活** する仕組みもあり、長期運用に有利)'
  ground_truth: '**新NISA(少額投資非課税制度)** ── **2024年1月** から開始された **拡充・恒久化** された個人投資家向けの非課税投資制度。**所管**: **金融庁** ; **新NISA口座** は証券会社・銀行等で開設(1人1口座、原則1金融機関のみ)。**主な制度設計(新NISA、2024年〜)**: (1) **非課税保有期間 = 無期限** ; (2) **制度恒久化** = 永続的な制度 ; (3) **年間投資枠** = **つみたて投資枠120万円 + 成長投資枠240万円 = 計360万円/年** ; (4) **非課税保有限度額(生涯投資枠)** = **1,800万円(うち成長投資枠は1,200万円まで)** ; (5) **売却分の枠復活** = 売却した翌年に **取得価額(=非課税保有限度額)が復活** する仕組み(年間投資枠360万円の制限内で再投資可能) ; (6) **両投資枠の併用可** ; (7) **対象商品**: つみたて投資枠 = 金融庁指定の **長期・積立・分散投資** に適した投信(約290本 ; ノーロード・低コスト・分配金頻度が低い等の要件) ; 成長投資枠 = 上場株式・投資信託等(高レバレッジ商品・毎月分配型・整理銘柄等は除外) 。**旧NISA(2023年末まで)** との関係: (a) **一般NISA(年120万円・5年間)** は2023年末で **新規買付終了** ; (b) **つみたてNISA(年40万円・20年)** も2023年末で新規買付終了 ; (c) **ジュニアNISA** は2023年末で完全終了 ; (d) **旧NISAで保有中の商品は、購入時から非課税期間終了まで保有可能** (一般NISAは購入から5年、つみたてNISAは20年) 。**iDeCo(個人型確定拠出年金)** とは別制度: iDeCo = 拠出時所得控除 + 運用益非課税 + 受取時退職所得控除/公的年金控除、ただし **60歳まで引き出し不可** 。NISAは出金自由。**確認窓口**: **金融庁 NISA特設サイト**(fsa.go.jp/policy/nisa2/index.html) 、各証券会社・銀行のNISA口座開設窓口。'
  graceful_unknown: 新NISA(2024年〜)は年間360万円(つみたて120万+成長投資240万)、生涯投資枠1,800万円(成長投資枠は内1,200万)、非課税保有期間無期限・制度恒久化・売却分は翌年枠復活。旧NISA(一般120万円×5年/つみたて40万円×20年)は2023年末で新規買付終了済み。所管は金融庁、口座は証券会社・銀行で開設(1人1口座)。iDeCoとは別制度。fsa.go.jp/policy/nisa2 で確認。
