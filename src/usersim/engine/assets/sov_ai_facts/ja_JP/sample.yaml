  ground_truth: |-
    与謝野晶子(1878-1942)『みだれ髪』(1901年/明治34年)所収の 代表歌:

    「やは肌のあつき血汐にふれも見でさびしからずや道を説く君」 (やははだの あつきちしおに ふれもみで さびしからずや みちをとくきみ)

    五・七・五・七・七の三十一文字で、当時としては挑戦的な官能性 と批評性を併せ持つ歌として『みだれ髪』を象徴する一首と されます。歴史的仮名遣いでは「やは肌」「ちしほ」表記もあり ますが、岩波文庫版などの標準テクストに準じます。
  graceful_unknown: 『みだれ髪』の代表歌で、「やは肌の」で始まることは確かですが、 下の句の正確な字句に自信がないため、原典の確認をお勧めします。 岩波文庫の『みだれ髪』が標準的な参照本です。
