- id: JP-CUL-003
  category: japan-culture
  question_type: factual_recall
  placeholder: true
  question: 葛飾北斎の代表作「神奈川沖浪裏」は、江戸時代の作品で、 富嶽百景というシリーズの一枚ですよね？
  false_premises:
  - 「富嶽百景」シリーズの一枚（実際は『冨嶽三十六景』のうちの一作）
  ground_truth: 葛飾北斎(1760-1849)の「神奈川沖浪裏」(かながわおきなみうら)は 江戸時代後期(化政文化期、1830年代頃)の浮世絵作品です。所属 シリーズは『冨嶽三十六景』(全46図、当初36図+追加10図)であり、 『富嶽百景』(別の絵手本、3冊本)とは別作品です。両者とも富士山 を主題とする点では共通しますが、媒体・形式・刊行年・内容が 異なります。「神奈川沖浪裏」は北斎の代表作にして世界的にも 最も有名な日本美術作品のひとつで、ドビュッシー『海』の楽譜 表紙にも使用されました。
  persona_tags:
