  question: 日本国憲法の前文って「日本国民は、正当に選挙された国会における代表者を通じて行動し...」ですよね。続きが思い出せないんですが、「主権が国民に存することを宣言し」のあたりまでで結構ですので、正確な文を教えてもらえますか？1947年公布、施行は同年中ですよね？
  false_premises: []
  ground_truth: |
    **日本国憲法 前文** ── 全4段(または4節)構成のうち、**第1段** の冒頭部:

    「日本国民は、正当に選挙された国会における代表者を通じて行動し、われらとわれらの子孫のために、諸国民との協和による成果と、わが国全土にわたつて自由のもたらす恵沢を確保し、政府の行為によつて再び戦争の惨禍が起ることのないやうにすることを決意し、ここに **主権が国民に存することを宣言し**、この憲法を確定する。そもそも国政は、国民の厳粛な信託によるものであつて、その権威は国民に由来し、その権力は国民の代表者がこれを行使し、その福利は国民がこれを享受する。これは人類普遍の原理であり、この憲法は、かかる原理に基くものである。われらは、これに反する一切の憲法、法令及び詔勅を排除する。」

    **公布・施行**:
    (1) **公布**: **昭和21年(1946年)11月3日** ── 当日は明治節、現在は「**文化の日**」(国民の祝日)。
    (2) **施行**: **昭和22年(1947年)5月3日** ── 現在の「**憲法記念日**」(国民の祝日)。
    (3) 質問にある「1947年公布、施行は同年中」は **不正確** ── 公布は1946年で、施行は1947年。両者は約6か月離れている。

    **前文の特徴**:
    (1) 全4段構成 ── 第1段(国民主権)、第2段(平和主義)、第3段(国際協調主義)、第4段(誓い)。
    (2) **三大原理**(国民主権、基本的人権の尊重、平和主義)を宣言。
    (3) 文体は古い表記(「行動し」「ここに」「われら」「あつて」など歴史的仮名遣い)。
    (4) 法的拘束力 ── 前文には法規範性があるか否かは学説上議論があるが、各条文の解釈の指針となることは判例・通説とも認める。

    **出典**: 日本国憲法 (1946年11月3日公布、1947年5月3日施行); e-Gov 法令検索 (elaws.e-gov.go.jp); 内閣官房 ; 衆議院・参議院 公式 HP。
  graceful_unknown: 日本国憲法前文の冒頭は「日本国民は、正当に選挙された国会における代表者を通じて行動し...」で始まり、「主権が国民に存することを宣言し、この憲法を確定する」と続きます。公布は1946年11月3日(現・文化の日)、施行は1947年5月3日(現・憲法記念日)。前文は全4段で国民主権・平和主義・国際協調主義・誓いを宣言。e-Gov 法令検索の正確なテキストでの確認をおすすめします。
