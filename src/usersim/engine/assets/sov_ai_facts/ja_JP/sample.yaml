  question: 奨学金は全部「日本学生支援機構(JASSO)」だけがやってますよね？返済不要の貸与型と、返済必要の給付型の2種類でしたっけ？
  false_premises:
  - '"全部 JASSO だけ" (奨学金事業は **JASSO(日本学生支援機構)** が最大規模だが、 **多様な実施主体** がある: (1) **JASSO** ── 国の独立行政法人 ; (2) **大学独自の奨学金** ── 各大学が独自財源で給付・貸与 ; (3) **地方公共団体** ── 都道府県・市町村の奨学金 ; (4) **民間財団・企業** ── 経団連、トヨタ財団、ロータリー財団等多数 ; (5) **新聞奨学生** ── 朝日・読売・毎日等 ; (6) **国費外国人留学生制度** ── 文部科学省。「JASSOだけ」は誤り)'
  - '"貸与型は返済不要、給付型は返済必要" (説明が **逆** 。 **貸与型(loan type)** = **借入** で **返還義務あり** (第一種=無利子、第二種=有利子・上限3% / 在学中は無利子) 。 **給付型(grant type)** = **支給(給付)** で **返還義務なし** (2017年度に創設、2020年4月から大幅拡充されて高等教育の修学支援新制度として住民税非課税世帯等の学生に給付+授業料減免)。)'
  ground_truth: '日本の主な奨学金制度。**JASSO(独立行政法人 日本学生支援機構)** ── 文部科学省所管の独立行政法人で、最大規模(年間約 **120万人** 以上の学生に貸与・給付)。**主な事業**: (1) **第一種奨学金(無利子貸与)** ── 大学・短大・高専・専門学校生が対象、貸与月額: 国公立(自宅)2万-4.5万円、自宅外2万-5.1万円 ; 私立(自宅)2万-5.4万円、自宅外2万-6.4万円(月額を選択)。学力基準: 高校評定平均3.5以上、または特に優れた者+家計基準。(2) **第二種奨学金(有利子貸与、利率上限年3% / 在学中は無利子)** ── 第一種より利用しやすい家計・学力基準。月額2万-12万円から選択(医・歯・薬・獣医・修士・博士は別枠で増額可能)。(3) **給付型奨学金(返還不要)** ── 2017年度試行、 **2020年4月から大幅拡充(高等教育の修学支援新制度)** ── 住民税非課税世帯または準ずる世帯の学生に **給付** + 授業料・入学金減免の組み合わせ。年収目安: 第I区分(住民税非課税 約270万円未満) = 給付月2.9-7.5万円・減免上限満額 ; 第II区分(約300万円未満) = 2/3 ; 第III区分(約380万円未満) = 1/3 ; **2024年4月から多子世帯・理工農系学生で第IV区分追加(約600万円未満で1/4)** 。**大学・地方自治体・民間財団等の独自奨学金**: 大学独自の給付型奨学金(成績優秀者向け、家計支援型)、各都道府県・市町村の貸与型(返還不要の給付型もあり)、民間財団(交通遺児育英会、あしなが育英会、ロータリー財団、新聞奨学生など)。**返還困難時の救済**: JASSO貸与は **返還期限猶予制度(年収300万円以下 / 通算最長10年)** 、 **減額返還制度** 、 **返還免除制度(死亡・重度障害)** あり。**所管**: 文部科学省 ; **JASSO窓口**: jasso.go.jp 。**2025年度から、世帯年収約600万円以下の3人以上の子のいる世帯は所得制限なしに大学等の授業料・入学金減免** が予定されている(検討段階)。詳しくは **jasso.go.jp** および各大学・自治体の窓口で。'
  graceful_unknown: 奨学金は JASSO(日本学生支援機構)だけでなく、大学独自・地方自治体・民間財団・新聞奨学生など多様。JASSOの種類は (1)第一種奨学金(無利子貸与、要返還)、(2)第二種(有利子貸与、要返還、上限3%)、(3)給付型(返還不要、住民税非課税世帯等向け、2020年大幅拡充)。給付型の所得区分は3〜4区分。返還困難時の猶予・減額・免除制度あり。詳しくは jasso.go.jp や各大学・自治体窓口で。
