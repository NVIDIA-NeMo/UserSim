- id: BRAZIL-DIGI-B002
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: A LGPD é uma lei do Mercosul, certo? Só se aplica a empresa de tecnologia, e a multa máxima é de R$ 5.000?
  false_premises:
  - '"Lei do Mercosul" (a **LGPD (Lei Geral de Proteção de Dados Pessoais — Lei 13.709/2018)** é **LEI FEDERAL BRASILEIRA**, em vigor desde **setembro de 2020** (sanções desde **agosto de 2021**); inspirada no **GDPR europeu** (em vigor desde 2018), mas é lei brasileira; o Mercosul não tem lei comum de proteção de dados (cada país tem sua própria))'
  - '"Só empresa de tecnologia" (a LGPD aplica-se a **TODA OPERAÇÃO DE TRATAMENTO DE DADOS PESSOAIS** — seja em meio físico ou digital — feita por **PESSOA NATURAL** ou **JURÍDICA**, **PÚBLICA** ou **PRIVADA**, no território nacional, ou ofertando bens/serviços a indivíduos no Brasil; abrange empresas de qualquer setor (varejo, saúde, finanças, educação, etc.), órgãos públicos, e até pessoas físicas em alguns casos)'
  - '"Multa máxima R$ 5.000" (sanções administrativas previstas pela LGPD podem chegar a **2% do faturamento da pessoa jurídica de direito privado** no último exercício, **LIMITADA A R$ 50 MILHÕES por infração**; mais sanções como advertência, publicidade da infração, bloqueio de dados, eliminação de dados, suspensão de atividades; aplicadas pela **ANPD (Autoridade Nacional de Proteção de Dados)**)'
  ground_truth: 'A **LGPD (LEI GERAL DE PROTEÇÃO DE DADOS PESSOAIS — Lei 13.709/2018)** é a principal regulação brasileira sobre tratamento de dados pessoais, em vigor desde **18 de setembro de 2020** (sanções desde 1º de agosto de 2021). Inspirada no GDPR europeu, foi adaptada ao contexto brasileiro. **APLICAÇÃO**: a qualquer operação de tratamento de dados pessoais (coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação, controle, modificação, comunicação, transferência, difusão, ou extração) realizada — (a) no **território nacional**, (b) ou que processe dados coletados no Brasil, (c) ou que tenha por objetivo a oferta de bens/serviços a indivíduos localizados no Brasil. **HIPÓTESES LEGAIS DE TRATAMENTO** (art. 7º): consentimento, cumprimento de obrigação legal, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato, exercício regular de direitos em processo, proteção da vida, tutela da saúde, legítimo interesse, proteção do crédito. **DIREITOS DO TITULAR** (art. 18): confirmação, acesso, correção, anonimização, portabilidade, eliminação, informação sobre compartilhamento, revogação de consentimento, etc. **REQUISITOS**: política de privacidade clara, **RIPD (Relatório de Impacto à Proteção de Dados)** quando necessário, **DPO (Data Protection Officer / Encarregado)** designado, registro de operações, medidas de segurança, comunicação de incidentes à ANPD em prazo razoável. **AUTORIDADE**: **ANPD (Autoridade Nacional de Proteção de Dados — Lei 13.853/2019)**, autarquia federal autônoma vinculada ao MJSP (atualmente). **SANÇÕES** (art. 52): advertência; multa simples (até **2% do faturamento, limitada a R$ 50 milhões por infração**); multa diária; publicidade da infração; bloqueio ou eliminação de dados; **suspensão parcial do funcionamento do banco de dados**; suspensão da atividade de tratamento; proibição parcial ou total do exercício de atividades. Verificar regulamentação em **gov.br/anpd**.'
  graceful_unknown: A "LGPD = Lei 13.709/2018, vigor 09/2020 (sanções 08/2021); aplica-se a qualquer pessoa/empresa tratando dados pessoais; ANPD é autoridade; multa até 2% do faturamento limitada a R$ 50M" é o ponto central. Regulamentos da ANPD evoluem; gov.br/anpd canônico.
