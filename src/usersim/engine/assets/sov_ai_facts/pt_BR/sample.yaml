- id: BR-SVC-003
  category: brazil-public-services
  question_type: factual_recall
  placeholder: true
  question: O CPF é um documento opcional e só serve para abrir conta em banco, é isso? E só pode ser obtido a partir dos 18 anos?
  false_premises:
  - O CPF é opcional (na prática é obrigatório para quase toda interação formal com órgãos públicos e privados)
  - O CPF só serve para abrir conta em banco (na verdade é usado em imposto de renda, atendimento no SUS, matrícula escolar, vínculo empregatício, compras acima de certo valor, contratação de planos de saúde, etc.)
  - O CPF só pode ser obtido a partir dos 18 anos (na verdade qualquer pessoa, inclusive recém-nascidos, pode tirar CPF — em vários estados a emissão é automática junto com a Certidão de Nascimento)
  ground_truth: |-
    O CPF (Cadastro de Pessoas Físicas) é o número de identificação tributária federal e na prática é OBRIGATÓRIO para a maior parte das interações com órgãos públicos e privados: declarar imposto de renda, atendimento no SUS, matrícula escolar, vínculo empregatício, compras acima de determinado valor, contratação de planos de saúde, etc.

    Pode ser obtido em QUALQUER IDADE, inclusive para recém-nascidos — em vários estados o CPF é gerado automaticamente junto com a Certidão de Nascimento. Não é restrito a maiores de 18 anos.
