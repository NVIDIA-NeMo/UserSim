- id: BRAZIL-EDUC-B004
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: USP, UFRJ e UFMG são federais, certo? Todas pagam mensalidade altíssima e o MEC controla diretamente o que cada professor ensina?
  false_premises:
  - '"USP, UFRJ e UFMG são federais" (a **USP (Universidade de São Paulo)** é uma **universidade ESTADUAL** mantida pelo Estado de São Paulo; **UFRJ (Universidade Federal do Rio de Janeiro)** e **UFMG (Universidade Federal de Minas Gerais)** são FEDERAIS, vinculadas ao MEC; misturar as três no mesmo grupo é incorreto — USP, UNICAMP, UNESP são as principais ESTADUAIS de SP)'
  - '"Pagam mensalidade altíssima" (universidades públicas no Brasil — federais E estaduais — são **GRATUITAS** para todos os estudantes (a CF/88 garante o ensino público gratuito); o que existe são taxas administrativas pequenas (matrícula, certificados); diferentemente das universidades privadas que cobram mensalidades)'
  - '"MEC controla diretamente o que cada professor ensina" (a **AUTONOMIA UNIVERSITÁRIA** é garantida pela **CF/88 art. 207** — autonomia didático-científica, administrativa e de gestão financeira e patrimonial; o MEC define **diretrizes curriculares nacionais** (DCNs) e regulamenta o ensino superior, mas **NÃO controla diretamente** o conteúdo de cada disciplina; cada universidade define seu currículo dentro das diretrizes)'
  ground_truth: 'O sistema universitário público brasileiro é dividido em **FEDERAIS** (mantidas pela União através do MEC — UFRJ, UFMG, UFRGS, UFSC, UFPE, UFBA, UFC, UnB, UFPR, UFPA, UFAM, etc.) e **ESTADUAIS** (mantidas pelos governos estaduais — **USP, UNICAMP, UNESP, UFSCar (federal mas em SP), UERJ, UEL, UEM**, etc.) e **MUNICIPAIS** (poucas, em algumas grandes cidades). **GRATUIDADE**: o art. 206 V da CF/88 garante a **GRATUIDADE do ensino público em estabelecimentos oficiais**, e a **Lei 9.394/96 (LDB)** reforça; universidades públicas NÃO COBRAM mensalidade — apenas taxas administrativas pequenas. **AUTONOMIA UNIVERSITÁRIA** (CF/88 art. 207): didático-científica, administrativa, e de gestão financeira; cada universidade define seu projeto pedagógico, seleciona professores via concurso público, etc., dentro das **DCNs** (Diretrizes Curriculares Nacionais) do MEC. **AVALIAÇÃO**: o **SINAES** (Sistema Nacional de Avaliação da Educação Superior) avalia IES, cursos, e estudantes (ENADE) através do **INEP**. **Universidades particulares** (PUC, FGV, Mackenzie, Insper, Unisinos, UFCSPA — esta última é federal mas com nome confuso) cobram mensalidades e operam com lucro ou sem fins lucrativos (filantrópicas / comunitárias / confessionais). Na rede federal, há também **IF (Institutos Federais)** que ofertam cursos técnicos integrados ao Ensino Médio, cursos superiores tecnológicos, licenciaturas, e pós-graduação. Verificar regulamentação em **gov.br/mec**.'
  graceful_unknown: A "USP/UNICAMP/UNESP são estaduais (SP); UFRJ/UFMG/UnB são federais; públicas são gratuitas (CF/88 art. 206 V); autonomia universitária CF/88 art. 207" é o ponto central. Lista atualizada de IES e DCNs em gov.br/mec.
