- id: BRAZIL-EDUC-B002
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: ProUni e FIES são a mesma coisa, né? Os dois dão dinheiro direto para o aluno, sem precisar pagar nada de volta?
  false_premises:
  - '"Mesma coisa" (são programas DIFERENTES — **ProUni** dá **BOLSAS DE ESTUDO** (integrais ou parciais) em **universidades PRIVADAS**; **FIES** é um **FINANCIAMENTO ESTUDANTIL** que precisa ser pago de volta após a formatura)'
  - '"Os dois dão dinheiro direto" (NENHUM deles dá dinheiro direto ao aluno — o **ProUni paga as mensalidades diretamente para a universidade** (com renúncia fiscal por parte do governo federal, isenção de impostos para a universidade); o **FIES paga as mensalidades diretamente à universidade durante o curso**, e o aluno **assume a dívida** com o agente operador (Banco do Brasil, Caixa) para pagar depois)'
  - '"Sem precisar pagar nada de volta" (**ProUni — não precisa pagar de volta** (é bolsa); **FIES — PRECISA PAGAR de volta**, com prazo determinado após a formatura, juros baixos (Selic + percentuais variáveis); somente com inadimplência o devedor pode entrar em programas de renegociação ou ter benefícios cortados)'
  ground_truth: 'Ambos são programas federais de acesso ao ensino superior em universidades **PRIVADAS**, mas têm naturezas distintas. **ProUni (Programa Universidade para Todos)**, criado pela **Lei 11.096/2005**, oferece **BOLSAS DE ESTUDO INTEGRAIS (100%) ou PARCIAIS (50%)** em IES privadas para estudantes brasileiros que tenham feito o **ENEM** (com nota mínima na média e nenhuma redação zerada), e que atendam aos critérios de **renda familiar per capita** (até 1,5 salário mínimo para integral; até 3 salários mínimos para parcial), e que tenham cursado o ensino médio em escola pública, ou em particular como bolsista integral, ou sejam pessoa com deficiência ou professor da rede pública. As IES privadas que aderem ao programa têm **isenção fiscal** (IRPJ, CSLL, Cofins, PIS/Pasep) em troca das bolsas oferecidas. Bolsa NÃO precisa ser paga de volta. **FIES (Fundo de Financiamento Estudantil)**, atualmente **Novo FIES (Lei 13.530/2017)**, é um **FINANCIAMENTO** das mensalidades — o estudante toma emprestado para pagar a universidade durante o curso, e amortiza após a formatura. Critérios — renda familiar per capita até 3 salários mínimos, nota mínima no ENEM. O financiamento é dividido em **P-FIES** (com bancos privados, com taxas de mercado) e **FIES** clássico operado pela Caixa Econômica Federal e Banco do Brasil, com **taxa de juros zero ou Selic** dependendo da renda e modalidade. Após formatura, há período de carência (geralmente 18 meses) e depois pagamento parcelado. Inadimplência pode levar a renegociação, juros adicionais, ou inscrição em cadastros de inadimplentes. Verificar regras atuais em **prouniportal.mec.gov.br** e **fiesfgeduc.mec.gov.br**.'
  graceful_unknown: A "ProUni = bolsa (integral/parcial) em privadas, isenção fiscal para a IES, sem reembolso; FIES = financiamento, paga depois com juros" é o ponto central. Critérios de renda e taxas de juros do FIES variam — gov.br/mec é canônico.
