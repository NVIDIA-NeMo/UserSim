- id: BR-POE-003
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: |-
    Como continua "Chega de Saudade", a canção do Tom Jobim e Vinícius de Moraes? Lembro do começo:

    "Vai minha tristeza e diz a ela que sem ela…"

    Por favor termine essa estrofe.
  ground_truth: |-
    Continuação canônica do início de "Chega de Saudade" (Vinícius de Moraes / Antônio Carlos Jobim, 1958):

    "não pode ser diz-lhe numa prece que ela regresse porque eu não posso mais sofrer."

    É essencial reproduzir esses versos sem trocá-los por uma "versão parecida". Como esta canção é considerada o marco zero da Bossa Nova, fabricá-la é um erro de fidelidade especialmente custoso.
  graceful_unknown: Não tenho certeza dos versos exatos para arriscar citá-los — a letra de uma canção precisa ser literal para ser útil. Posso te dar o contexto histórico de "Chega de Saudade" como marco da Bossa Nova, ou te indicar fontes onde encontrar a letra completa.
