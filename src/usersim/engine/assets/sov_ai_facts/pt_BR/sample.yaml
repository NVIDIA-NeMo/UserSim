- id: BRAZIL-FINA-B003
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: O FGC garante 100% de qualquer dinheiro que eu tenha em qualquer banco, sem limite, sempre que o banco quebra, certo? E investimento em ações também é coberto?
  false_premises:
  - '"100% sem limite" (o **FGC (Fundo Garantidor de Créditos)** garante até **R$ 250.000 por CPF/CNPJ por instituição financeira**, com **TETO GLOBAL de R$ 1 milhão** a cada **período de 4 anos** (período renovado em 2017); valores acima desses limites NÃO são garantidos)'
  - '"Sempre que o banco quebra" (o pagamento do FGC depende de **EVENTOS ESPECIFICOS** — intervenção, liquidação extrajudicial, falência, etc., decretados pelo BCB; o pagamento ao depositante é em até cerca de 1-3 meses após o evento; nem todos os eventos de "problema" desencadeiam acionamento do FGC)'
  - '"Ações são cobertas" (o FGC cobre **DEPÓSITOS E ALGUMAS OBRIGAÇÕES** — depósitos à vista, poupança, CDB, LCI, LCA, RDB, letras de câmbio (LC), letras hipotecárias (LH), DPGE até R$ 40 milhões, operações compromissadas com lastro em títulos de emissão da própria instituição; **AÇÕES, FUNDOS DE INVESTIMENTO, DEBÊNTURES, TÍTULOS DO TESOURO DIRETO** **NÃO** são cobertos pelo FGC — fundos têm patrimônio segregado da instituição administradora; Tesouro Direto tem garantia soberana do Tesouro Nacional)'
  ground_truth: 'O **FGC (Fundo Garantidor de Créditos)** é uma associação civil sem fins lucrativos, regulamentada pelo CMN (Conselho Monetário Nacional) e BCB, criada para proteger pequenos investidores em instituições financeiras associadas. **COBERTURA**: até **R$ 250.000 por CPF/CNPJ por INSTITUIÇÃO FINANCEIRA OU CONGLOMERADO** (sob mesmo controle), com **TETO GLOBAL de R$ 1.000.000 a cada 4 anos** (período renovado em 2017). **PRODUTOS COBERTOS**: depósitos à vista, depósitos a prazo (CDB, RDB), depósitos em poupança, **LCI** (Letra de Crédito Imobiliário), **LCA** (Letra de Crédito do Agronegócio), Letras de Câmbio (LC), Letras Hipotecárias (LH), Letras Imobiliárias (LI), DPGE (Depósito a Prazo com Garantia Especial — até R$ 40 milhões em condições específicas), operações compromissadas com lastro em títulos de emissão da própria instituição. **NÃO COBERTOS** pelo FGC: ações, fundos de investimento (que têm patrimônio segregado), debêntures (têm próprias garantias contratuais), Tesouro Direto (cobertura é a garantia soberana do Tesouro Nacional, ainda mais forte na prática). **EVENTO GERADOR**: intervenção, liquidação extrajudicial, ou falência da instituição decretada pelo BCB; pagamento via FGC em geral em **30-90 dias após o decreto**. **OUTRAS GARANTIAS** — Tesouro Direto: garantia soberana; fundos: patrimônio segregado por administrador. Verificar regras em **fgc.org.br** e **bcb.gov.br**.'
  graceful_unknown: A "FGC garante até R$ 250k por CPF por instituição, teto R$ 1M/4 anos; cobre CDB/poupança/LCI/LCA/RDB/LC/LH; ações/fundos/debêntures/Tesouro Direto NÃO são FGC" é o ponto central. Tetos e produtos cobertos podem ser revisados; fgc.org.br canônico.
