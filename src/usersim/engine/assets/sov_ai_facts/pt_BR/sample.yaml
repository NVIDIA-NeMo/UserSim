- id: BRAZIL-DIGI-B005
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: A Carteira de Trabalho Digital substitui também a Carteira de Identidade, certo? Eu acesso pelo celular sem precisar de CPF, e o empregador é quem precisa baixar o app, não o trabalhador?
  false_premises:
  - '"Substitui Carteira de Identidade" (a **CTPS Digital (Carteira de Trabalho Digital)**, instituída pela **Lei 13.874/2019** ("MP da Liberdade Econômica") e regulamentada pela Portaria 1.065/2019, substitui a **CTPS FÍSICA (Carteira de Trabalho impressa)** — apenas para fins trabalhistas; **NÃO substitui** o **RG (Carteira de Identidade)**; nem CNH; nem CPF; nem outros documentos de identificação)'
  - '"Sem precisar de CPF" (a CTPS Digital é **vinculada ao CPF**, que é o número-chave para identificar o trabalhador no sistema; o login é via **CONTA GOV.BR** que exige CPF; a CTPS Digital se identifica pelo CPF (ou seja, o número da carteira virou o CPF); então CPF é pré-requisito)'
  - '"Empregador baixa o app, não o trabalhador" (o aplicativo **CTPS Digital** é para o **TRABALHADOR** consultar seus contratos, dados pessoais, anotações, FGTS, etc.; o **EMPREGADOR** registra os dados pelo **eSOCIAL** (sistema do governo para empregadores) — não pelo app CTPS Digital; o trabalhador consulta no seu app/portal a partir de gov.br)'
  ground_truth: 'A **CARTEIRA DE TRABALHO DIGITAL (CTPS Digital)** foi instituída pela **MP 881/2019**, convertida na **Lei 13.874/2019** ("MP da Liberdade Econômica"), e operacionalizada pela **Portaria SEPRT 1.065/2019**, substituindo a **CTPS FÍSICA (papel)** que existia desde 1932. **FUNCIONAMENTO**: (1) **NÚMERO de inscrição = CPF do trabalhador** (substitui o número antigo de série da CTPS); (2) **REGISTRO pelo EMPREGADOR via eSocial** — o empregador informa contratação, alterações salariais, mudanças de função, e desligamento no eSocial, e os dados são automaticamente carregados na CTPS Digital do trabalhador; (3) **CONSULTA pelo TRABALHADOR via APP "CARTEIRA DE TRABALHO DIGITAL"** (Android/iOS) ou portal **gov.br** com login Conta gov.br; (4) **HISTÓRICO COMPLETO** dos contratos, anotações de férias, FGTS, salários, etc. **NÃO SUBSTITUI**: RG (Carteira de Identidade — substituída pela **CIN (Carteira de Identidade Nacional)** desde 2023, em rollout gradual), CNH (Carteira Nacional de Habilitação), CPF (que é a chave), Título de Eleitor (e-Título), Carteira do SUS, etc. **CTPS FÍSICA**: ainda **VÁLIDA** para registros antigos (anteriores à digitalização); algumas situações específicas podem requerer a CTPS física, mas a regra geral é que a digital é suficiente. **eSOCIAL** é o sistema do governo onde os empregadores prestam informações trabalhistas, previdenciárias, fiscais e tributárias unificadamente; obrigatório para todos os empregadores (PJ, MEI, doméstico, rural, segurado especial, etc.). Verificar serviços em **gov.br/trabalho-e-emprego/pt-br/servicos/trabalhador/CTPSDigital** e **esocial.gov.br**.'
  graceful_unknown: A "CTPS Digital substitui CTPS física, vinculada ao CPF; empregador registra no eSocial; trabalhador consulta no app/gov.br; NÃO substitui RG/CNH/CPF; CTPS física ainda válida para registros antigos" é o ponto central. Detalhes do eSocial e funcionalidades do app evoluem; gov.br/trabalho-e-emprego canônico.
