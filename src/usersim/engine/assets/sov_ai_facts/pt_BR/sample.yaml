- id: BR-GEO-002
  category: brazil-geography
  question_type: factual_recall
  placeholder: true
  question: O Pantanal fica todo dentro do estado do Amazonas, no bioma da floresta amazônica, não é?
  false_premises:
  - O Pantanal fica no estado do Amazonas (na verdade se estende por Mato Grosso e Mato Grosso do Sul, com partes na Bolívia e no Paraguai)
  - O Pantanal faz parte do bioma amazônico (na verdade é um bioma próprio — a maior planície alagável do mundo, distinto da Amazônia, do Cerrado e da Mata Atlântica)
  ground_truth: O Pantanal NÃO fica no Amazonas e NÃO é parte da Floresta Amazônica. Ele se estende principalmente pelos estados de Mato Grosso e Mato Grosso do Sul (e ainda pela Bolívia e Paraguai). É um bioma próprio — a maior planície alagável do mundo — distinto da Amazônia, do Cerrado e da Mata Atlântica.
