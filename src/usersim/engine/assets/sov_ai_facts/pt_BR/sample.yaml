- id: BRAZIL-DIGI-B003
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: O Marco Civil da Internet diz que provedores podem ler todas as mensagens dos usuários, certo? E pra remover qualquer post da rede social, basta pedir educadamente, sem decisão judicial?
  false_premises:
  - '"Provedores podem ler todas as mensagens" (o **MCI (Marco Civil da Internet — Lei 12.965/2014)** estabelece justamente o **OPOSTO** — protege a **PRIVACIDADE e a INTIMIDADE** das comunicações eletrônicas; provedores **NÃO PODEM** acessar conteúdo de comunicações privadas exceto por **DETERMINAÇÃO JUDICIAL** (art. 7º III; art. 10); a guarda do conteúdo da comunicação é proibida fora de comando judicial específico)'
  - '"Pedido educado remove conteúdo, sem judicial" (o MCI estabelece o **REGIME DE INTERMEDIÁRIOS** com o conceito de **INDISPENSABILIDADE DE ORDEM JUDICIAL** para responsabilização — a regra geral (art. 19) é que provedores de aplicação SÓ são responsabilizados por conteúdo de terceiros após **ORDEM JUDICIAL ESPECÍFICA** que determine a remoção; exceção: vingança pornográfica/nudez não consentida (art. 21) com comunicação simples; não há remoção por mero pedido educado)'
  ground_truth: 'O **MARCO CIVIL DA INTERNET (MCI) — Lei 12.965/2014** é a "Constituição da Internet brasileira" — estabelece princípios, garantias, direitos e deveres para o uso da Internet no Brasil. **PRINCÍPIOS** (art. 3º): garantia da liberdade de expressão; proteção da privacidade; proteção dos dados pessoais (depois consolidada na LGPD); preservação e garantia da neutralidade de rede; preservação da estabilidade, segurança e funcionalidade da rede; responsabilização dos agentes de acordo com suas atividades; preservação da natureza participativa da rede; liberdade dos modelos de negócios. **DIREITOS DO USUÁRIO** (art. 7º): inviolabilidade da intimidade e da vida privada; inviolabilidade e sigilo do fluxo das comunicações pela internet (salvo ordem judicial); **NÃO SUSPENSÃO da conexão à internet, salvo por débito** decorrente de seu uso; informações claras e completas sobre coleta, uso, armazenamento, tratamento e proteção dos dados; consentimento expresso para tratamento dos dados; etc. **NEUTRALIDADE DE REDE** (art. 9º): provedores de conexão não podem discriminar pacotes de dados em razão de conteúdo, origem, destino, serviço, terminal, ou aplicação; tratamento isonômico salvo em casos de requisitos técnicos. **GUARDA DE REGISTROS**: provedores de **CONEXÃO** devem guardar **REGISTROS DE CONEXÃO** (não conteúdo) por **1 ANO**; provedores de **APLICAÇÃO** devem guardar **REGISTROS DE ACESSO A APLICAÇÕES** por **6 MESES** (a partir do uso); apenas dados de log, NÃO o conteúdo das comunicações. **RESPONSABILIDADE de PROVEDORES DE APLICAÇÃO** (art. 19): provedores SÓ são responsabilizados por dano por conteúdo de terceiros se, após **ORDEM JUDICIAL ESPECÍFICA**, NÃO tomarem providências para remover; objetiva proteger liberdade de expressão e evitar censura privada. EXCEÇÃO (art. 21) — divulgação não consentida de imagens/vídeos íntimos (revenge porn): comunicação extrajudicial simples obriga remoção. **ATENÇÃO**: a **CONSTITUCIONALIDADE do art. 19** está em discussão no STF (julgamento iniciado, modulação possível) — pode haver mudanças. **PL 2630/2020** (PL das Fake News, em discussão) propõe alterações. Verificar texto vigente em **planalto.gov.br** e jurisprudência atualizada.'
  graceful_unknown: A "MCI Lei 12.965/2014; protege privacidade, neutralidade de rede, sigilo das comunicações; provedores guardam só logs; responsabilidade de provedores SÓ após ordem judicial (art. 19), exceto revenge porn (art. 21); STF analisa constitucionalidade do art. 19" é o ponto central. STF e PL 2630 podem alterar o panorama; planalto.gov.br canônico.
