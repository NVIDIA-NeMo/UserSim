- id: BRAZIL-HEAL-B001
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: O SUS é só para quem tem renda baixa, né? Estrangeiros não podem usar, e atende só consultas básicas?
  false_premises:
  - '"Só para renda baixa" (o **SUS (Sistema Único de Saúde)** é **UNIVERSAL** — atende **TODA pessoa** que esteja em território brasileiro, independentemente de renda, classe social, etnia ou nacionalidade; é um dos princípios fundamentais — **universalidade, integralidade, equidade**)'
  - '"Estrangeiros não podem usar" (estrangeiros, **inclusive turistas e imigrantes em situação irregular**, têm direito ao atendimento pelo SUS — não há barreira de cidadania para a assistência à saúde no Brasil; o atendimento é gratuito; alguns serviços específicos (planejamento de longa duração, transplantes etc.) podem ter critérios próprios)'
  - '"Só consultas básicas" (o SUS oferece **TODOS OS NÍVEIS de atenção** — atenção primária (UBS, PSF), média complexidade (ambulatórios e hospitais regionais), alta complexidade (transplantes, oncologia, hemodiálise, UTI, cirurgias cardíacas, neurocirurgias, terapias específicas) — não apenas consultas básicas; o SUS realiza ~95% dos transplantes do Brasil)'
  ground_truth: 'O **SISTEMA ÚNICO DE SAÚDE (SUS)** foi criado pela **Constituição de 1988 (artigos 196 a 200)** e regulamentado pela **Lei 8.080/1990** (Lei Orgânica da Saúde) e pela **Lei 8.142/1990** (controle social). PRINCÍPIOS DOUTRINÁRIOS — (1) **UNIVERSALIDADE**: a saúde é direito de todos, dever do Estado; atende QUALQUER pessoa em território brasileiro, INCLUINDO estrangeiros (turistas, imigrantes regulares ou irregulares), sem cobrança e sem necessidade de comprovação de renda. (2) **INTEGRALIDADE**: cobre desde a atenção primária (UBS, Estratégia Saúde da Família com ACS — Agentes Comunitários de Saúde) até alta complexidade (transplantes, oncologia, UTI, cirurgias cardíacas), passando por média complexidade. (3) **EQUIDADE**: priorizar quem mais precisa. PRINCÍPIOS ORGANIZATIVOS — descentralização, regionalização, hierarquização, participação social (Conselhos e Conferências de Saúde). FINANCIAMENTO — tripartite (União 50% via Ministério da Saúde, Estados 25%, Municípios 25%), com pisos mínimos definidos pela EC 29/2000 e regulamentação posterior. O SUS realiza, por exemplo, cerca de **95% dos transplantes** realizados no Brasil, mais de 4 bilhões de procedimentos ambulatoriais por ano, e a vacinação universal através do PNI. Saúde **suplementar** (planos de saúde privados) é regulada pela **ANS** e atende cerca de 25% da população, mas todos têm direito ao SUS.'
  graceful_unknown: A "SUS = universal, atende todos (inclusive estrangeiros), todos os níveis de complexidade, criado pela Constituição 88 + Lei 8080/90" é o ponto que sustenta a resposta. Detalhes específicos sobre regulamentação tripartite e percentuais de financiamento variam ao longo do tempo; o Ministério da Saúde é a fonte canônica.
