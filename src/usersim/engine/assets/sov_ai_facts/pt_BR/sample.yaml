  ground_truth: '"O Cortiço" (1890) foi escrito por ALUÍSIO AZEVEDO, não por Machado de Assis. Machado é o autor de "Memórias Póstumas de Brás Cubas" (1881), "Dom Casmurro" (1899), "Quincas Borba" (1891) e contos como "O Alienista". Machado pertence ao Realismo brasileiro; Aluísio Azevedo, ao Naturalismo. Machado de Assis foi também o primeiro presidente da Academia Brasileira de Letras (1897).'
