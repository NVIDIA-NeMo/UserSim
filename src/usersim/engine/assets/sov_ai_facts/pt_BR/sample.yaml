- id: BRAZIL-HEAL-B002
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: Plano de saúde no Brasil é regulado pelo SUS direto, né? E plano de saúde tem cobertura igual em qualquer lugar do país, sem carência, e cobre só doenças listadas na Constituição?
  false_premises:
  - '"Regulado pelo SUS direto" (planos de saúde — ou **SAÚDE SUPLEMENTAR** — são regulados pela **ANS (Agência Nacional de Saúde Suplementar)**, autarquia vinculada ao Ministério da Saúde, criada pela Lei 9.961/2000; o SUS é o sistema público; a ANS regula o setor privado de saúde)'
  - '"Cobertura igual em qualquer lugar" (depende do **TIPO de cobertura contratado** — Plano Ambulatorial, Hospitalar (com ou sem obstetrícia), Referência, Odontológico — e da **ABRANGÊNCIA GEOGRÁFICA** (Municipal, Grupo de Municípios, Estadual, Grupo de Estados, Nacional); planos com abrangência limitada não cobrem fora da área contratada exceto em emergências)'
  - '"Sem carência" (a Lei 9.656/1998 prevê **PRAZOS DE CARÊNCIA** que o plano pode exigir — máximo de 24 horas para urgência/emergência, 300 dias para parto, 180 dias para a maioria dos demais procedimentos, 24 meses para doenças e lesões preexistentes (CPT — Cobertura Parcial Temporária); na portabilidade entre planos, há regras de aproveitamento de carência)'
  - '"Só doenças listadas na Constituição" (a cobertura mínima obrigatória é definida pelo **ROL DE PROCEDIMENTOS E EVENTOS EM SAÚDE da ANS** — atualizado periodicamente pela Resolução Normativa; a Lei 14.454/2022 estabeleceu critérios para procedimentos e medicamentos fora do rol, com base em evidência científica e parecer da Conitec)'
  ground_truth: 'A **SAÚDE SUPLEMENTAR no Brasil** — ou seja, **planos de saúde privados** — é regulada pela **ANS (AGÊNCIA NACIONAL DE SAÚDE SUPLEMENTAR)**, autarquia vinculada ao Ministério da Saúde, criada pela Lei 9.961/2000. **PRINCIPAIS NORMAS** — Lei 9.656/1998 (planos privados de assistência à saúde), Lei 14.454/2022 (rol exemplificativo). **TIPOS de plano**: Ambulatorial, Hospitalar com ou sem obstetrícia, Referência (mais completo), e Odontológico. **ABRANGÊNCIA GEOGRÁFICA**: pode ser Municipal, Grupo de Municípios, Estadual, Grupo de Estados, ou Nacional — afeta cobertura fora da área. **CARÊNCIAS (Lei 9.656/1998 art. 12)**: máximo 24h urgência/emergência; 300 dias parto; 180 dias para demais; 24 meses para Doenças e Lesões Preexistentes (DLP) declaradas (CPT). **PORTABILIDADE** entre planos sem novas carências sob condições (RN ANS). **ROL DA ANS** define cobertura mínima obrigatória, atualizado periodicamente; a Lei 14.454/2022 estabelece critérios para a inclusão de procedimentos / medicamentos fora do rol (rol exemplificativo, com fundamentação por evidência e/ou recomendação da Conitec). **REAJUSTES**: planos individuais e familiares têm reajuste anual definido pela ANS; planos coletivos seguem regras contratuais e de proteção do consumidor. **REGISTRO**: planos vendidos no Brasil precisam de registro na ANS, sob risco de suspensão de comercialização. Verificar regulamentação atual em **gov.br/ans**.'
  graceful_unknown: A "ANS (não SUS) regula planos privados; carências definidas pela Lei 9.656/1998; rol da ANS exemplificativo (Lei 14.454/2022); abrangência geográfica e tipo de plano definem cobertura" é o ponto central. Detalhes específicos do rol e prazos de carência são revisados — gov.br/ans é a fonte canônica.
