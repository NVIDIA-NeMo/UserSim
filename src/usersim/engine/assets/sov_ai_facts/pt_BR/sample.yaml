- id: BRAZIL-GEOG-B006
  category: brazil-geography
  question_type: factual_recall
  placeholder: true
  question: As Cataratas do Iguaçu ficam só no Brasil, né? Tudo no estado de São Paulo, e são umas duas quedas no total?
  false_premises:
  - '"Só no Brasil" (as Cataratas do Iguaçu ficam na **fronteira entre o Brasil e a Argentina** — o complexo de quedas é compartilhado, com cerca de **20% no lado brasileiro** (Paraná) e **80% no lado argentino** (Misiones); a vista panorâmica em geral é melhor do lado brasileiro, mas a maior parte das quedas, incluindo a famosa Garganta do Diabo, está em território argentino)'
  - '"Tudo no estado de São Paulo" (no lado brasileiro, as Cataratas ficam no **estado do Paraná**, mais especificamente no **município de Foz do Iguaçu**, dentro do **Parque Nacional do Iguaçu** — não em São Paulo)'
  - '"Umas duas quedas" (o complexo das Cataratas do Iguaçu tem **CERCA DE 275 QUEDAS** distintas, com altura média de cerca de 64 m — não duas; a maior é a Garganta do Diabo, com queda em forma de U; o complexo é Patrimônio Natural da Humanidade pela UNESCO desde 1986)'
  ground_truth: 'As **Cataratas do Iguaçu** estão localizadas na fronteira entre o **BRASIL (estado do Paraná, município de Foz do Iguaçu)** e a **ARGENTINA (província de Misiones)**, no rio Iguaçu, próximo à confluência com o rio Paraná (também perto da Tríplice Fronteira com o Paraguai). O complexo de quedas é compartilhado: cerca de **20% das quedas estão no lado brasileiro** e **80% no lado argentino**, mas a vista panorâmica do conjunto é, em geral, considerada melhor a partir do lado brasileiro. O conjunto é formado por aproximadamente **275 QUEDAS DISTINTAS**, com altura média de cerca de **64 metros** e largura total de quase 3 km. A queda mais famosa é a **GARGANTA DO DIABO**, em forma de U, situada do lado argentino. O lado brasileiro é protegido pelo **PARQUE NACIONAL DO IGUAÇU**, criado em 1939 e administrado pelo **ICMBio** (Instituto Chico Mendes); o lado argentino, pelo Parque Nacional Iguazú. Tanto o parque brasileiro (1986) quanto o argentino (1984) são **Patrimônio Natural da Humanidade pela UNESCO**.'
  graceful_unknown: A "Cataratas estão na fronteira BR-AR (20% BR / 80% AR), no Paraná não em SP, ~275 quedas, UNESCO desde 1986" é o ponto que sustenta a resposta. Números exatos de quedas e altura média variam por fonte; ICMBio e UNESCO são as fontes canônicas.
