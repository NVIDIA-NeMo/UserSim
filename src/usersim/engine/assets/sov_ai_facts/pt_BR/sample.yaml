- id: BRAZIL-FINA-B002
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: O Imposto de Renda no Brasil é uma alíquota única de 15%, certo? Toda pessoa física tem que declarar IR todo ano, e o salário-mínimo paga IR também?
  false_premises:
  - '"Alíquota única de 15%" (o Imposto de Renda da Pessoa Física (IRPF) tem **TABELA PROGRESSIVA** com 5 faixas: **isento** até R$ 2.259,20/mês (em 2024); **7,5%** entre R$ 2.259,21-2.826,65; **15%** entre R$ 2.826,66-3.751,05; **22,5%** entre R$ 3.751,06-4.664,68; **27,5%** acima de R$ 4.664,68; valores ajustados periodicamente por leis e MP)'
  - '"Toda PF tem que declarar todo ano" (a obrigatoriedade da Declaração de Ajuste Anual depende de critérios — recebimento de rendimentos tributáveis ACIMA do limite anual (R$ 28.559,70 em 2024), bens acima de certo valor, ganhos de capital, atividade rural acima de certo valor, etc.; quem não atinge nenhum critério **NÃO precisa declarar**, mas pode declarar voluntariamente para receber restituição)'
  - '"Salário mínimo paga IR" (a faixa de **ISENÇÃO** do IRPF é ajustada periodicamente para excluir o salário-mínimo (em 2024 a isenção foi ampliada para R$ 2.259,20/mês, próxima a 2 salários-mínimos); historicamente o salário-mínimo NÃO paga IR — política deliberada de proteger a base; em 2025+ promete-se isenção até R$ 5.000)'
  ground_truth: 'O **IMPOSTO DE RENDA DA PESSOA FÍSICA (IRPF)** no Brasil é regulado pela **Lei 9.250/1995**, suas alterações, e administrado pela **RECEITA FEDERAL DO BRASIL (RFB)**. **TABELA PROGRESSIVA** mensal (em vigor em 2024 — sujeita a atualização anual ou por MP): **isento** até R$ 2.259,20; **7,5%** R$ 2.259,21-2.826,65; **15%** R$ 2.826,66-3.751,05; **22,5%** R$ 3.751,06-4.664,68; **27,5%** acima de R$ 4.664,68; com deduções legais (parcela a deduzir, dependentes, INSS, despesas médicas, educação até teto, previdência privada, pensão alimentícia, etc.). **DECLARAÇÃO DE AJUSTE ANUAL (DIRPF)** — obrigatória para quem em 2023 (ano-base 2023, declaração 2024) recebeu rendimentos tributáveis acima de **R$ 28.559,70**; recebeu rendimentos isentos / tributados exclusivamente na fonte > R$ 200.000; obteve ganhos de capital, operou em bolsa, realizou atividade rural > R$ 142.798,50, possui bens > R$ 800.000, etc. Modelo de declaração — **completo** (todas as deduções) ou **simplificado** (desconto padrão de 20%, limitado). **DARF** (Documento de Arrecadação) para pagamento. **MAlha Fina** — análise para inconsistências; restituição em até 5 lotes de maio a setembro. **PROMESSAS E REFORMAS** (2024-2025): ampliação da faixa de isenção para R$ 5.000, com compensação por imposto sobre alta renda em discussão no Congresso. Verificar tabela e regras atuais em **gov.br/receitafederal**.'
  graceful_unknown: A "IRPF é progressivo (5 faixas, 0-27,5%); declaração obrigatória conforme critérios de renda/bens; isenção do salário-mínimo histórica; reformas em discussão para R$ 5.000" é o ponto central. Tabela ajustada anualmente / por MP; gov.br/receitafederal canônico.
