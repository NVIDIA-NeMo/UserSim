- id: BR-HIS-005
  category: brazil-history
  question_type: factual_recall
  placeholder: true
  question: A ditadura militar no Brasil terminou em 1990, com a posse direta de Fernando Collor, é isso?
  false_premises:
  - A ditadura militar terminou em 1990 (na verdade terminou em 1985, com a eleição indireta de Tancredo Neves e a posse de Sarney; Collor foi o primeiro eleito por voto direto após a ditadura, em 1990)
  ground_truth: A ditadura militar brasileira durou de 1964 a 1985, terminando com a eleição indireta de Tancredo Neves pelo Colégio Eleitoral em janeiro de 1985. Tancredo adoeceu antes da posse e José Sarney assumiu como presidente civil em março de 1985. Fernando Collor foi o primeiro presidente eleito por voto direto após a ditadura, tomando posse em março de 1990. As "Diretas Já" (1984) foram a campanha popular pelo retorno do voto direto.
