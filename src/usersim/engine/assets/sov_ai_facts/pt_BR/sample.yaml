- id: BRAZIL-FINA-B001
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: O Pix é um banco do governo, certo? Cobra taxa em qualquer transferência, e só funciona pra brasileiro com mais de 30 anos?
  false_premises:
  - '"Banco do governo" (o **Pix** é um **SISTEMA DE PAGAMENTOS INSTANTÂNEOS** criado e operado pelo **Banco Central do Brasil (BCB)** — entrou em operação em **novembro de 2020**; NÃO é um banco; é uma infraestrutura de pagamento gerenciada pelo BCB e usada por todas as instituições financeiras autorizadas)'
  - '"Cobra taxa em qualquer transferência" (Pix entre **PESSOAS FÍSICAS é GRATUITO** por norma do BCB; PJs (pessoas jurídicas) podem ter cobrança da instituição financeira; transferências PF→PJ podem ter cobrança ao recebedor; entre PF→PF (e a maioria PF→PJ baixo valor) não há cobrança ao remetente)'
  - '"Só pra brasileiro com mais de 30 anos" (Pix está disponível para **TODOS os correntistas / titulares de contas** em instituições financeiras autorizadas no Brasil — incluindo MENORES (com conta autorizada por responsáveis), idosos, e estrangeiros com CPF e conta em banco brasileiro; não há restrição de idade ou nacionalidade brasileira)'
  ground_truth: 'O **PIX** é o sistema brasileiro de **PAGAMENTOS INSTANTÂNEOS**, criado e operado pelo **BANCO CENTRAL DO BRASIL (BCB)**, com entrada em operação em **16 de novembro de 2020**. **CARACTERÍSTICAS**: (1) **TRANSFERÊNCIAS 24/7/365** — funciona qualquer hora, qualquer dia, em poucos segundos. (2) **GRATUIDADE para PF**: Pix entre pessoas físicas é gratuito por norma do BCB; instituições NÃO podem cobrar de remetente PF. PJ pode pagar tarifa cobrada pela instituição. (3) **CHAVES PIX**: identificação por **CPF/CNPJ**, **email**, **telefone celular**, ou **chave aleatória** (UUID); permite transferência sem precisar saber agência/conta. (4) **PIX COBRANÇA**: QR Code dinâmico ou estático para receber pagamentos (substitui boleto em muitos casos). (5) **PIX SAQUE/TROCO**: saque de dinheiro em estabelecimentos comerciais via Pix. (6) **PIX AUTOMÁTICO** (lançado 2025): pagamentos recorrentes automatizados, substituindo débito automático em muitos casos. (7) **MED (Mecanismo Especial de Devolução)**: para transferências fraudulentas em até 80 dias. (8) **LIMITES** de transação configurados pelo usuário com a instituição financeira; horário noturno tem limites mais baixos por padrão (medida anti-fraude). (9) **ELEGÍVEIS**: qualquer correntista de instituição financeira autorizada pelo BCB; CPF é obrigatório (acesso para estrangeiros com CPF e conta em banco brasileiro). Verificar regulamentação em **bcb.gov.br/pix**.'
  graceful_unknown: A "Pix = sistema do BCB (não banco), gratuito PF, instantâneo 24/7, chaves CPF/email/celular/aleatória; MED para fraude; Pix Automático em 2025" é o ponto central. Detalhes de tarifas PJ e funcionalidades novas mudam; bcb.gov.br/pix é canônico.
