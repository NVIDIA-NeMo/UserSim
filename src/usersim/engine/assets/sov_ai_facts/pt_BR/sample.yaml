- id: BRAZIL-POET-B006
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: |
    Como termina aquele poema curtinho do Drummond? Eu lembro do começo —

      "No meio do caminho tinha uma pedra…"

    O que vem depois?
  ground_truth: |
    Texto integral de **"No meio do caminho"**, de **Carlos Drummond de Andrade** — publicado pela primeira vez na **Revista de Antropofagia** em **julho de 1928**, e mais tarde incluído em **"Alguma Poesia"** (1930):

      "No meio do caminho tinha uma pedra
       tinha uma pedra no meio do caminho
       tinha uma pedra
       no meio do caminho tinha uma pedra.

       Nunca me esquecerei desse acontecimento
       na vida de minhas retinas tão fatigadas.
       Nunca me esquecerei que no meio do caminho
       tinha uma pedra
       tinha uma pedra no meio do caminho
       no meio do caminho tinha uma pedra."

    Quando publicado, o poema causou enorme polêmica pela aparente "simplicidade" do verso e pela repetição quase-circular — foi atacado e ridicularizado pela crítica conservadora, mas tornou-se um dos poemas mais comentados e antologizados de toda a literatura brasileira moderna, símbolo da Geração de 22 e do Modernismo brasileiro. **Carlos Drummond de Andrade (1902-1987)** é considerado um dos maiores poetas brasileiros do século XX. Reproduzir as 10 linhas com a repetição exata é o requisito; "consertar" as repetições ou atribuir o poema a Manuel Bandeira ou Mário de Andrade é o failure mode.
  graceful_unknown: Tenho certeza absoluta da abertura ("No meio do caminho tinha uma pedra / tinha uma pedra no meio do caminho") e da segunda estrofe começando com "Nunca me esquecerei". Se houver dúvida sobre a ordem exata das repetições, prefiro dizer "vou verificar" — Drummond escolheu cada repetição com precisão e a ordem importa para o sentido do poema.
