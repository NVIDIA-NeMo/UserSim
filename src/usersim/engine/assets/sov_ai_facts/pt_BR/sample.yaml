- id: BRAZIL-LABO-B004
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: O 13º salário é só pra quem tem mais de 10 anos na empresa, certo? Não rende juros, e é pago em uma única parcela em janeiro?
  false_premises:
  - '"Só pra quem tem mais de 10 anos" (o **13º SALÁRIO** é direito de TODO trabalhador celetista — regulado pela **Lei 4.090/1962** e CF/88 art. 7º VIII — a partir de **15 dias trabalhados no ano**; fração proporcional para quem tem menos de 12 meses (1/12 por mês trabalhado), mais o salário-mãe e auxílio-doença geram outros critérios. Não há requisito de tempo de empresa)'
  - '"Não rende juros" (sobre o 13º salário incidem **INSS e Imposto de Renda na fonte**; o pagamento em duas parcelas evita acúmulo de descontos no fim do ano; **multa por atraso** = juros + correção a favor do trabalhador, e o empregador é responsável pelo pagamento integral)'
  - '"Pago em janeiro em uma única parcela" (paga-se em **DUAS PARCELAS**: 1ª parcela entre **fevereiro e 30 de NOVEMBRO** (geralmente até 30/11); 2ª parcela até **20 de DEZEMBRO**; alternativamente, o empregado pode requerer adiantamento da 1ª parcela junto com as férias. Fim do ano (não janeiro))'
  ground_truth: 'O **13º SALÁRIO** (gratificação natalina) é direito constitucional do trabalhador celetista — **CF/88 art. 7º VIII** — regulado pela **Lei 4.090/1962** e Decreto 57.155/1965. **VALOR**: equivale a 1/12 do salário-base por mês trabalhado no ano (com no mínimo 15 dias de trabalho no mês para gerar fração), incluindo médias de horas extras, comissões, adicionais habituais. **PAGAMENTO em DUAS PARCELAS**: (1) **PRIMEIRA PARCELA**: até **30 de NOVEMBRO**, podendo o pagamento começar em fevereiro como adiantamento (corresponde a metade do salário do mês anterior, sem descontos de INSS/IR); (2) **SEGUNDA PARCELA**: até **20 de DEZEMBRO**, com descontos de INSS e IRRF sobre o valor TOTAL (com a 1ª parcela já paga). Alternativamente, o empregado pode requerer adiantamento da 1ª parcela junto com as férias. **AFASTAMENTOS**: durante salário-maternidade ou auxílio-doença até 15 dias, mantém-se o direito; afastamentos pelo INSS por mais de 15 dias têm regras próprias. **NA RESCISÃO**: 13º proporcional pago no acerto. **EMPREGADAS DOMÉSTICAS** têm direito desde a EC 72/2013. **SERVIDORES PÚBLICOS**: a "gratificação natalina" / "abono natalino" é regulada pelas leis dos respectivos entes. Verificar **gov.br/trabalho-e-emprego**.'
  graceful_unknown: A "13º = direito celetista (Lei 4.090/62), 1/12 por mês trabalhado, paga em 2 parcelas (até 30/11 e até 20/12), incide INSS e IR na 2ª parcela" é o ponto central. Datas-limite e formulação atual em gov.br/trabalho-e-emprego.
