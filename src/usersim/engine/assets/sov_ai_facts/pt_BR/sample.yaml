- id: BRAZIL-LABO-B006
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: O seguro-desemprego é direito automático pra todo trabalhador demitido, certo? Recebe sempre 5 parcelas iguais ao último salário, qualquer um que pediu demissão pode pegar?
  false_premises:
  - '"Direito automático pra todo demitido" (o seguro-desemprego só é devido em caso de **DEMISSÃO SEM JUSTA CAUSA**, e exige outras condições: ter recebido salários consecutivos por **número mínimo de meses** (12, 9, ou 6 conforme a periodicidade da solicitação), não receber benefício previdenciário continuado (com algumas exceções), não ter renda própria suficiente para sustento, etc.; demissão por justa causa, pedido de demissão, ou rescisão por acordo NÃO geram seguro-desemprego)'
  - '"Sempre 5 parcelas" (são **3, 4 ou 5 PARCELAS**, dependendo do **TEMPO DE TRABALHO** dos últimos 36 meses — 6-11 meses → 3 parcelas; 12-23 meses → 4 parcelas; ≥ 24 meses → 5 parcelas; e há também o caso da 2ª solicitação que tem regras próprias)'
  - '"Iguais ao último salário" (o valor é calculado por **FAIXAS** — sobre a média dos últimos 3 salários: até R$ X, alíquota Y% (com piso do salário-mínimo); valor máximo limitado a um teto definido a cada ano; **NÃO** é igual ao último salário — é geralmente menor que o salário pleno)'
  - '"Pedido de demissão pode pegar" (quem **PEDE DEMISSÃO** NÃO recebe seguro-desemprego; rescisão por acordo entre patrão e empregado (Reforma Trabalhista 2017) também NÃO dá direito ao seguro)'
  ground_truth: 'O **SEGURO-DESEMPREGO** é direito do trabalhador celetista demitido sem justa causa, regulado pela **Lei 7.998/1990** e administrado pelo **Ministério do Trabalho e Emprego** com pagamento pela **Caixa Econômica Federal**. **REQUISITOS**: (1) ter sido **dispensado SEM JUSTA CAUSA**; (2) ter recebido salários consecutivos por **6 meses** (3ª+ solicitação), **9 meses** (2ª solicitação), ou **12 meses** (1ª solicitação) nos últimos 36 meses; (3) não receber benefício previdenciário continuado (exceto pensão por morte ou auxílio-acidente); (4) não ter renda própria suficiente para sustento; (5) ser empregado celetista regular (modalidades específicas para pescador artesanal e empregado doméstico). **NÚMERO DE PARCELAS** (depende do tempo de trabalho nos últimos 36 meses): 6-11 meses → 3 parcelas; 12-23 meses → 4 parcelas; ≥ 24 meses → 5 parcelas. **VALOR**: calculado em faixas sobre a média dos 3 últimos salários — alíquotas progressivas-decrescentes (até a primeira faixa: 80% sobre o salário; faixa intermediária: + 50% sobre o excedente até nova faixa; teto fixo); piso = salário-mínimo, teto definido anualmente. **MODALIDADES ESPECIAIS**: (a) **Empregado doméstico** desde EC 72/2013 e LC 150/2015; (b) **Pescador artesanal** durante defeso; (c) **Trabalhador resgatado** de condição análoga à escravidão (Lei 7.998/90). **PEDIDO DE DEMISSÃO** ou **RESCISÃO POR ACORDO** (Reforma Trabalhista 2017) **NÃO** geram direito ao seguro-desemprego. **PORTAL OFICIAL**: gov.br/empregabrasil ou app **Carteira de Trabalho Digital** (CTPS Digital) ou Caixa.'
  graceful_unknown: A "seguro-desemprego só para demissão sem justa causa; 3-5 parcelas conforme tempo de trabalho; valor é faixa sobre média dos 3 últimos salários (não pleno); pedido de demissão ou acordo não dá direito" é o ponto central. Valores das faixas e teto são revisados anualmente; gov.br/trabalho-e-emprego canônico.
