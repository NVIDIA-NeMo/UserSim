- id: BRAZIL-EDUC-B005
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: O FUNDEB é só pra escolas particulares, certo? Tem prazo pra acabar, e a União é quem coloca todo o dinheiro?
  false_premises:
  - '"Só pra escolas particulares" (o **FUNDEB (Fundo de Manutenção e Desenvolvimento da Educação Básica)** financia exclusivamente a **EDUCAÇÃO BÁSICA PÚBLICA** — Educação Infantil, Ensino Fundamental e Ensino Médio — em redes municipais, estaduais e federais; **NÃO inclui escolas particulares**, salvo no caso de creches conveniadas com o poder público em algumas situações específicas)'
  - '"Tem prazo pra acabar" (o FUNDEB foi criado pela **EC 53/2006** com vigência até 2020; foi **TORNADO PERMANENTE pela EC 108/2020**, com regras revisadas — não tem mais prazo de extinção; a Lei 14.113/2020 regulamentou o Novo FUNDEB permanente)'
  - '"União coloca todo o dinheiro" (o FUNDEB é financiado por **CONTRIBUIÇÕES DE ESTADOS, MUNICÍPIOS e DISTRITO FEDERAL** (sobre suas receitas tributárias), com **COMPLEMENTAÇÃO DA UNIÃO** — após a EC 108/2020 essa complementação subiu progressivamente para **23% do total dos fundos estaduais até 2026** (era 10% antes), distribuída em três modalidades: VAAF (Valor Aluno-Ano Federal), VAAT (Valor Aluno-Ano Total), VAAR (Valor Aluno-Ano Resultado))'
  ground_truth: 'O **FUNDEB (Fundo de Manutenção e Desenvolvimento da Educação Básica e de Valorização dos Profissionais da Educação)** é o principal mecanismo de financiamento da **EDUCAÇÃO BÁSICA PÚBLICA** no Brasil — Educação Infantil, Fundamental e Médio — em redes municipais, estaduais e federais. Foi criado pela **EC 53/2006** (substituindo o FUNDEF de 1996, que cobria apenas o Fundamental), com prazo até 2020; foi **TORNADO PERMANENTE pela EC 108/2020**, regulamentado pela **Lei 14.113/2020**. **FINANCIAMENTO**: estados e municípios contribuem com **20% das suas receitas de impostos e transferências constitucionais** (FPE, FPM, ICMS, IPVA, ITCMD, IPI-Exp, ITR transferido) para fundos estaduais; **União complementa** essa contribuição quando o valor por aluno fica abaixo do mínimo nacional. **EC 108/2020** elevou a complementação federal de 10% para **23%** progressivamente (12% em 2021, 15% em 2022, 17% em 2023, 19% em 2024, 21% em 2025, **23% a partir de 2026**), distribuída em **três modalidades**: (1) **VAAF (Valor Aluno-Ano por aluno do Fundo)** — 10% — para estados / municípios mais pobres; (2) **VAAT (Valor Aluno-Ano Total)** — 10,5% — considera receita total per capita; (3) **VAAR (Valor Aluno-Ano por Resultados)** — 2,5% — vinculado a melhoria de indicadores de qualidade. **MÍNIMO 70%** dos recursos do FUNDEB devem ser destinados ao **PAGAMENTO DOS PROFISSIONAIS DA EDUCAÇÃO** em efetivo exercício (professores e demais profissionais). Verificar regulamentação atual em **fnde.gov.br** e **gov.br/mec**.'
  graceful_unknown: A "FUNDEB = financiamento da educação básica pública (não particulares); permanente desde EC 108/2020; complementação da União 23% a partir de 2026; ≥70% para profissionais" é o ponto central. Detalhes do VAAF/VAAT/VAAR e percentuais anuais transitórios variam até a estabilização em 2026; fnde.gov.br é canônico.
