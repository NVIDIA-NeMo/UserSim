- id: BRAZIL-FINA-B004
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: O Tesouro Direto é só pra investidor profissional, certo? Tem investimento mínimo de R$ 50.000, e o IR só é cobrado se eu sacar antes dos 5 anos?
  false_premises:
  - '"Só pra investidor profissional" (o **Tesouro Direto** é uma plataforma de **VAREJO** criada justamente para o pequeno investidor — qualquer pessoa física com CPF e conta em corretora pode investir; é um dos investimentos mais democráticos do Brasil)'
  - '"Mínimo R$ 50.000" (o **valor MÍNIMO** para investir é em torno de **R$ 30 a R$ 50** (depende do título — equivale a **1% (0,01)** de uma fração de título; o título inteiro custa R$ 1.000+, mas o investidor pode comprar frações); é, na prática, **acessível a partir de poucos reais**)'
  - '"IR só se sacar antes de 5 anos" (sobre o rendimento do Tesouro Direto incide **IMPOSTO DE RENDA na fonte com tabela REGRESSIVA** — quanto mais tempo se mantém, MENOR a alíquota: 22,5% (até 180 dias) → 20% (181-360) → 17,5% (361-720) → 15% (acima de 720 dias / 2 anos); aplicado sobre o LUCRO no resgate; **sempre incide IR**, nunca é zero — só fica menor com o tempo; também há **IOF regressivo** se sacar nos primeiros 30 dias)'
  ground_truth: 'O **TESOURO DIRETO** é o programa de venda de **TÍTULOS PÚBLICOS FEDERAIS** ao **VAREJO**, criado pelo **TESOURO NACIONAL** em parceria com a **B3** em **2002**. Permite que pessoas físicas comprem títulos da dívida pública diretamente via corretoras, com transparência e baixo custo. **TIPOS DE TÍTULOS** — (1) **TESOURO SELIC (LFT)**: pós-fixado, atrelado à Selic — boa liquidez para reserva de emergência; (2) **TESOURO PREFIXADO (LTN/NTN-F)**: taxa fixa contratada na compra, valor fixo no vencimento; (3) **TESOURO IPCA+ (NTN-B)**: rentabilidade = inflação (IPCA) + juro real fixo; protege poder de compra. Há também variantes com pagamento de cupom semestral. **VALOR MÍNIMO**: cerca de **R$ 30-50 por aplicação** (frações de 0,01 do título, com mínimo regulamentar atualmente próximo a R$ 30); **VALOR MÁXIMO**: R$ 1 milhão por mês por CPF. **CUSTÓDIA**: gratuita para títulos do Tesouro Direto desde 2020 (taxa B3 zerada para até R$ 10.000 em LFT/NTN; isenção total para LFT). **TRIBUTAÇÃO** — **IR REGRESSIVO sobre o ganho** no resgate: 22,5% (até 180 dias), 20% (181-360), 17,5% (361-720), 15% (>720 dias = 2 anos); **IOF** regressivo nos primeiros 30 dias. **GARANTIA**: garantia soberana do Tesouro Nacional (mais forte que FGC). **LIQUIDEZ**: o Tesouro garante recompra diária dos títulos a preços de mercado (permite saída antecipada, mas com possível "marcação a mercado" — pode haver perda se o título for vendido antes do vencimento em condições adversas, especialmente em prefixados e IPCA+). Verificar tabelas e títulos atuais em **tesourodireto.com.br**.'
  graceful_unknown: A "Tesouro Direto = varejo, mínimo ~R$ 30, garantia soberana, IR regressivo 22,5%→15%, marcação a mercado em saída antecipada para prefixado/IPCA+" é o ponto central. Tabelas e taxas mudam; tesourodireto.com.br canônico.
