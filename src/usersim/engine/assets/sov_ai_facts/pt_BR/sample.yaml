- id: BRAZIL-LABO-B005
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Bolsa Família e Auxílio Brasil são programas iguais, certo? Os dois ainda estão funcionando ao mesmo tempo, dão R$ 1.500 fixo por família, e qualquer pessoa pode se cadastrar?
  false_premises:
  - '"Programas iguais funcionando ao mesmo tempo" (são DIFERENTES programas que se sucederam: **BOLSA FAMÍLIA original (2003-2021)** sob Lula/Dilma; **AUXÍLIO BRASIL (2021-2022)** sob Bolsonaro substituindo o Bolsa Família; **NOVO BOLSA FAMÍLIA (a partir de março de 2023)** sob Lula 3, com regras ampliadas; eles NÃO funcionam ao mesmo tempo — cada um substituiu o anterior)'
  - '"R$ 1.500 fixo por família" (o **NOVO BOLSA FAMÍLIA** atual tem **valor MÍNIMO de R$ 600 por família** (acrescido de adicionais por composição familiar): **R$ 150 por criança de 0-6 anos**, **R$ 50 por gestante**, **R$ 50 por nutriz**, **R$ 50 por adolescente de 7-18 anos**; valor total varia conforme a composição; não é R$ 1.500 fixo)'
  - '"Qualquer pessoa pode se cadastrar" (eligibilidade restrita por **CRITÉRIOS DE RENDA** — famílias em situação de extrema pobreza (renda per capita até R$ 218 mensal — em 2024) ou pobreza com presença de gestantes, nutrizes, crianças, ou adolescentes; cadastro no **CadÚnico** é obrigatório, e seleção via critérios; não é "qualquer pessoa")'
  ground_truth: 'O **PROGRAMA BOLSA FAMÍLIA** atual (Novo Bolsa Família, restabelecido em **MARÇO DE 2023** pela Medida Provisória 1.164/2023, convertida na **Lei 14.601/2023**) é o programa de transferência de renda condicionada do Governo Federal. Histórico — (1) **BOLSA FAMÍLIA ORIGINAL** (Lei 10.836/2004, sob Lula): unificou Bolsa Escola, Bolsa Alimentação, Cartão Alimentação, Auxílio Gás; (2) **AUXÍLIO BRASIL** (2021-2022, Lei 14.284/2021, sob Bolsonaro): substituiu temporariamente o Bolsa Família com regras alteradas; (3) **NOVO BOLSA FAMÍLIA** (a partir de março de 2023): retoma o nome e amplia regras. **VALOR ATUAL** — **VALOR MÍNIMO de R$ 600 por família**, com adicionais: **R$ 150** por criança de 0-6 anos, **R$ 50** por gestante, **R$ 50** por nutriz (lactante), **R$ 50** por criança e adolescente de 7-18 anos. **CRITÉRIOS DE ELIGIBILIDADE** — situação de pobreza (renda per capita até R$ 218/mês em 2024, ajustada periodicamente) com gestante / nutriz / criança / adolescente; ou extrema pobreza independentemente de composição familiar; **CADASTRO ÚNICO (CadÚnico)** é obrigatório, atualizado nas Prefeituras. **CONDICIONALIDADES**: frequência escolar (≥ 75% para crianças e adolescentes), vacinação infantil em dia, pré-natal para gestantes, acompanhamento de saúde de nutrizes; descumprimento pode levar à advertência e suspensão temporária. Pagamento via **CARTÃO BOLSA FAMÍLIA** ou app **Caixa Tem**. **REGRA DE PROTEÇÃO**: famílias que aumentem a renda dentro de certo limite mantêm o benefício parcialmente por até 24 meses. Verificar regras atuais em **gov.br/mds** e **caixa.gov.br/bolsafamilia**.'
  graceful_unknown: A "Novo Bolsa Família desde março/2023; valor mínimo R$ 600 + adicionais por composição familiar; CadÚnico obrigatório; condicionalidades de saúde e educação" é o ponto central. Valores e thresholds são revisados; gov.br/mds canônico.
