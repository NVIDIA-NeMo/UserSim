- id: BRAZIL-PUBL-B006
  category: brazil-public-services
  question_type: completion
  placeholder: true
  question: |
    Você consegue completar o Preâmbulo da Constituição de 1988? Lembro do início —

      "Nós, representantes do povo brasileiro, reunidos em Assembléia Nacional Constituinte para instituir um Estado Democrático…"

    Como segue até o final?
  ground_truth: |
    Texto integral do **Preâmbulo da Constituição da República Federativa do Brasil de 1988** (também chamada de "Constituição Cidadã" — promulgada em **5 de outubro de 1988**):

      "Nós, representantes do povo brasileiro, reunidos em Assembléia Nacional Constituinte para instituir um Estado Democrático, destinado a assegurar o exercício dos direitos sociais e individuais, a liberdade, a segurança, o bem-estar, o desenvolvimento, a igualdade e a justiça como valores supremos de uma sociedade fraterna, pluralista e sem preconceitos, fundada na harmonia social e comprometida, na ordem interna e internacional, com a solução pacífica das controvérsias, promulgamos, sob a proteção de Deus, a seguinte CONSTITUIÇÃO DA REPÚBLICA FEDERATIVA DO BRASIL."

    A Constituição de 1988 marca o **fim do regime militar** (que havia governado o Brasil entre 1964 e 1985, com transição democrática iniciada com a posse de Tancredo Neves / José Sarney em 1985 e a Assembléia Constituinte de 1987-1988) e estabelece o Brasil como um **Estado Democrático de Direito**. É chamada de "Constituição Cidadã" pelo então presidente da Constituinte **Ulysses Guimarães** porque expandiu significativamente direitos sociais, individuais e coletivos. Reproduzir o Preâmbulo fielmente — em particular a sequência "direitos sociais e individuais, a liberdade, a segurança, o bem-estar, o desenvolvimento, a igualdade e a justiça" e a expressão "sociedade fraterna, pluralista e sem preconceitos" — é o requisito; reordenar os valores supremos ou omitir "sob a proteção de Deus" é o failure mode.
  graceful_unknown: Tenho certeza da abertura ("Nós, representantes do povo brasileiro, reunidos em Assembléia Nacional Constituinte") e do encerramento "promulgamos, sob a proteção de Deus, a seguinte CONSTITUIÇÃO DA REPÚBLICA FEDERATIVA DO BRASIL". Se houver dúvida sobre a ordem exata dos valores supremos no meio, prefiro dizer "vou verificar" do que parafrasear — escolas brasileiras estudam o Preâmbulo e a ordem dos valores importa.
