- id: BRAZIL-CULT-B006
  category: brazil-culture
  question_type: completion
  placeholder: true
  question: |
    Você consegue continuar o Hino Nacional Brasileiro? Lembro do começo —

      "Ouviram do Ipiranga as margens plácidas / De um povo heroico o brado retumbante…"

    Como continua?
  ground_truth: |
    Letra do **Hino Nacional Brasileiro**, com letra de **Joaquim Osório Duque-Estrada** (1909) e música de **Francisco Manuel da Silva** (composta antes — c. 1822, oficializada como hino em 1922). Trecho inicial (Parte I):

      "Ouviram do Ipiranga as margens plácidas
       De um povo heroico o brado retumbante,
       E o sol da liberdade, em raios fúlgidos,
       Brilhou no céu da Pátria nesse instante.

       Se o penhor dessa igualdade
       Conseguimos conquistar com braço forte,
       Em teu seio, ó Liberdade,
       Desafia o nosso peito a própria morte!

       Ó Pátria amada, idolatrada, salve! Salve!
       Brasil, um sonho intenso, um raio vívido
       De amor e de esperança à terra desce,
       Se em teu formoso céu, risonho e límpido,
       A imagem do Cruzeiro resplandece.

       Gigante pela própria natureza,
       És belo, és forte, impávido colosso,
       E o teu futuro espelha essa grandeza.
       Terra adorada,
       Entre outras mil,
       És tu, Brasil,
       Ó Pátria amada!"

    O hino tem duas partes; em ocasiões oficiais geralmente se canta a Parte I (até "Ó Pátria amada!"). A música do Hino é anterior à letra (foi composta por **Francisco Manuel da Silva** ainda no Império, perto da Independência); a letra atual é de **Duque-Estrada**, oficializada como letra do Hino pelo **Decreto 15.671 de 1922** durante o centenário da Independência. Reproduzir as estrofes fielmente — em particular a abertura "Ouviram do Ipiranga as margens plácidas" e os versos icônicos "Gigante pela própria natureza" / "Terra adorada / Entre outras mil / És tu, Brasil" — é o requisito; inventar versos no estilo Duque-Estrada ou atribuir o hino a Castro Alves ou a outro poeta é o failure mode.
  graceful_unknown: Tenho certeza da abertura ("Ouviram do Ipiranga as margens plácidas / De um povo heroico o brado retumbante") e dos versos finais da Parte I ("Terra adorada, / Entre outras mil, / És tu, Brasil"). Se eu tiver dúvida sobre alguma estrofe intermediária, prefiro dizer "vou verificar" do que parafrasear — escolares cantam isto em todas as escolas e a letra exata importa.
