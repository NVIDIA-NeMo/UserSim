- id: BR-GEO-005
  category: brazil-geography
  question_type: factual_recall
  placeholder: true
  question: O Rio São Francisco corta a região Sul do Brasil, certo? E ele atravessa principalmente a floresta amazônica?
  false_premises:
  - O São Francisco corta a região Sul (na verdade corta o Sudeste e o Nordeste, atravessando MG, BA, PE, AL e SE)
  - O São Francisco atravessa a Floresta Amazônica (na verdade atravessa principalmente os biomas Cerrado e Caatinga)
  ground_truth: O Rio São Francisco NÃO atravessa a região Sul nem a Amazônia. Nasce em Minas Gerais (Sudeste), corre rumo ao Norte/Nordeste atravessando Bahia, Pernambuco, Alagoas e Sergipe, e desagua no Oceano Atlântico. Atravessa principalmente os biomas Cerrado e Caatinga, e tem cerca de 2.700 km de extensão. É conhecido como o "Velho Chico".
