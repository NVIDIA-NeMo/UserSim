- id: BRAZIL-LABO-B003
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: A aposentadoria do INSS continua igual desde 2010, certo? Homens e mulheres se aposentam aos 60 anos com 25 anos de contribuição, e o valor é sempre o último salário?
  false_premises:
  - '"Continua igual desde 2010" (a **REFORMA DA PREVIDÊNCIA (EC 103/2019)**, que entrou em vigor em **13 de novembro de 2019**, mudou substancialmente as regras — fim da aposentadoria por tempo de contribuição (com regras de transição), idades mínimas, fórmulas de cálculo, regras especiais; "continua igual desde 2010" é incorreto)'
  - '"Homens e mulheres aos 60 anos com 25 anos" (após a EC 103/2019, regra geral nova é: **HOMENS — 65 anos de idade + 20 anos de contribuição**; **MULHERES — 62 anos de idade + 15 anos de contribuição**; com regras de transição (Pedágio 50%, Pedágio 100%, Pontos, Idade Progressiva) para quem já contribuía em 2019)'
  - '"Valor é sempre o último salário" (o cálculo do **VALOR DO BENEFÍCIO** sob a EC 103/2019 é mais complexo — a média **DE TODOS** os salários de contribuição desde **julho de 1994** (Plano Real), atualizada monetariamente, multiplicada por **60% + 2% por ano de contribuição além de 20 anos (homem) ou 15 anos (mulher)** — não simplesmente o "último salário")'
  ground_truth: 'A **REFORMA DA PREVIDÊNCIA — EC 103/2019**, em vigor desde **13 de novembro de 2019**, alterou substancialmente as regras de aposentadoria do **RGPS (Regime Geral de Previdência Social, INSS)** e do RPPS (servidores públicos). **REGRA GERAL** (após Reforma): **HOMENS — 65 anos de idade + 20 anos de contribuição**; **MULHERES — 62 anos de idade + 15 anos de contribuição** (filiados a partir da reforma; 15 anos só para quem já tinha contribuição até 13/11/2019; novos filiados precisam de 20 anos). **REGRAS DE TRANSIÇÃO** para quem já contribuía em 13/11/2019 — (1) **Pontos** (idade + tempo de contribuição = 96 mulher / 101 homem em 2026, +1 ponto por ano); (2) **Idade Mínima Progressiva** (chega a 62 mulher / 65 homem em 2031); (3) **Pedágio 50%** (faltava ≤ 2 anos: idade mínima 100 ou 105 + 50% pedágio); (4) **Pedágio 100%** (idade mínima 57 mulher / 60 homem + dobro do tempo restante). **CÁLCULO DO BENEFÍCIO** (regra após EC 103): média ARITMÉTICA SIMPLES de TODOS os salários-de-contribuição desde julho de 1994 (atualizada), multiplicada por **(60% + 2% por ano de contribuição além de 20 anos H / 15 anos M)** — antes, descartava-se 20% das menores; agora se considera todas. **TETO** atual do INSS é cerca de R$ 8.157,40 (2025; reajustado anualmente). **REGIMES ESPECIAIS** — professor (idade reduzida em 5 anos), pessoa com deficiência (idade/tempo reduzidos), atividade insalubre/perigosa (aposentadoria especial). Verificar regras vigentes em **gov.br/inss** e **dataprev.gov.br**.'
  graceful_unknown: 'A "EC 103/2019 mudou as regras — H 65/20, M 62/15 + regras de transição (Pontos, Idade Progressiva, Pedágios); cálculo é média desde 1994 × (60%+2% por ano extra)" é o ponto central. Detalhes de transição evoluem; gov.br/inss canônico.'
