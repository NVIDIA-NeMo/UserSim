- id: BR-SVC-005
  category: brazil-public-services
  question_type: factual_recall
  placeholder: true
  question: O RG (Carteira de Identidade) é emitido pela Receita Federal e tem validade nacional automaticamente, mas só vale 5 anos, certo?
  false_premises:
  - O RG é emitido pela Receita Federal (na verdade é emitido pelos Institutos de Identificação estaduais, ligados às Secretarias de Segurança Pública — por exemplo IIRGD em São Paulo, IFP no Rio de Janeiro)
  - O RG tinha validade de 5 anos (na verdade o RG tradicional não tinha prazo de validade; a nova CIN — Carteira de Identidade Nacional — tem prazo que varia conforme a faixa etária do titular)
  ground_truth: |-
    A Carteira de Identidade tradicional (RG) é EMITIDA POR ÓRGÃOS ESTADUAIS (Institutos de Identificação ligados às Secretarias de Segurança Pública dos estados, como o IIRGD em São Paulo ou o IFP no Rio). Não é a Receita Federal — esta cuida do CPF.

    Historicamente o RG tradicional não tinha validade. A nova Carteira de Identidade Nacional (CIN), em implantação progressiva desde 2022 com base no número do CPF, tem prazo de validade que varia conforme a faixa etária do titular (mais curto para crianças, mais longo para adultos, indeterminado para idosos a partir de certa idade — confirme as faixas vigentes na regulamentação atual do CNJ / Ministério da Justiça).

