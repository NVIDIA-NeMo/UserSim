- id: BRAZIL-HEAL-B004
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: A vacinação no Brasil é totalmente paga, certo? Mas só vale para quem tem plano de saúde, e cobre só vacinas para crianças até os 5 anos?
  false_premises:
  - '"Só para quem tem plano de saúde" (o **PROGRAMA NACIONAL DE IMUNIZAÇÕES (PNI)**, criado em 1973, oferece **VACINAS GRATUITAS pelo SUS** a TODA a população — independentemente de plano de saúde, renda ou nacionalidade; aplicação em UBS (Unidades Básicas de Saúde) e postos credenciados; estrangeiros também são atendidos)'
  - '"Só vacinas para crianças até 5 anos" (o **CALENDÁRIO NACIONAL DE VACINAÇÃO** abrange TODAS as faixas etárias — crianças (BCG ao nascer, pentavalente, polio, tríplice viral / varicela / HPV no calendário infantil); adolescentes (HPV 9-14 anos, dT, meningocócica ACWY); adultos (Hepatite B, Tríplice Viral, Febre Amarela em áreas endêmicas, dT a cada 10 anos); gestantes (dTpa, hepatite B, influenza); idosos 60+ (Influenza anual, Pneumocócica 23, Herpes Zóster, dT); povos indígenas e populações específicas; campanhas anuais (Influenza, Polio, MR Sarampo, COVID-19))'
  ground_truth: 'O **PROGRAMA NACIONAL DE IMUNIZAÇÕES (PNI)**, criado em 1973 e formalizado pela **Lei 6.259/1975**, oferece vacinas gratuitamente a toda a população através do **SUS**. Aplicação em **UBS (Unidades Básicas de Saúde)** e postos credenciados em todo o território nacional. **CALENDÁRIO NACIONAL** abrange todas as faixas etárias — atualizado periodicamente pelo Ministério da Saúde. **CRIANÇAS** (calendário básico): **BCG** (ao nascer), **Hepatite B** (ao nascer), **Pentavalente** (DTP+Hib+HepB) e **VIP/VOP** (poliomielite) aos 2/4/6/15 meses; **Pneumocócica 10**, **Rotavírus**, **Meningocócica C**; **Tríplice Viral (sarampo, caxumba, rubéola)** aos 12 meses e reforço aos 15 meses; **Hepatite A**; **Varicela**; **Tetra Viral** (15 meses); **HPV** (meninas e meninos a partir dos 9 anos). **ADOLESCENTES**: HPV, dT, Meningocócica ACWY, Hepatite B (se não vacinado). **ADULTOS**: dT a cada 10 anos, Tríplice Viral até 49 anos (esquema completo), Hepatite B, Febre Amarela (áreas com recomendação), Influenza (gestantes, idosos, etc.). **GESTANTES**: dTpa a cada gestação, Hepatite B, Influenza. **IDOSOS 60+**: Influenza anual, Pneumocócica 23, Herpes Zóster (em campanha), dT. **CAMPANHAS** anuais (Influenza, Multivacinação, Polio, COVID-19). **VACINAS ESPECIAIS** para grupos com indicação clínica disponíveis em **CRIE (Centros de Referência para Imunobiológicos Especiais)**. O Brasil é referência mundial em programas de imunização. Verificar calendário atualizado em **gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/calendario-nacional-de-vacinacao**.'
  graceful_unknown: A "PNI = vacinas gratuitas pelo SUS para todas as faixas etárias; UBS aplicam; calendário atualizado pelo Ministério da Saúde" é o ponto central. Datas exatas de doses no calendário infantil mudam com revisões; gov.br/saude é a fonte canônica.
