- id: BRAZIL-FINA-B005
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: A Selic é uma alíquota só do governo federal pra IR, certo? E o BCB define ela mensalmente, sempre olhando pra inflação americana?
  false_premises:
  - '"Alíquota de IR" (a **SELIC (Sistema Especial de Liquidação e de Custódia)** NÃO é uma alíquota tributária — é a **TAXA BÁSICA DE JUROS DA ECONOMIA BRASILEIRA**, definida pelo **COPOM** (Comitê de Política Monetária do BCB) como instrumento principal da política monetária; serve para perseguir a meta de inflação fixada pelo CMN)'
  - '"BCB define mensalmente" (o COPOM se reúne **OITO VEZES POR ANO** (aproximadamente a cada 45 dias) para definir a Selic; reuniões extraordinárias possíveis, mas o calendário regular é de 8/ano — não mensal)'
  - '"Olhando pra inflação americana" (o BCB persegue a **META DE INFLAÇÃO BRASILEIRA**, fixada anualmente pelo **CMN (Conselho Monetário Nacional)** — atualmente meta contínua de **3,0% com tolerância de ±1,5 pp**; a inflação medida pelo IPCA do IBGE; inflação americana ou de outros países pode influenciar via câmbio/expectativas mas não é o alvo)'
  ground_truth: 'A **SELIC (Sistema Especial de Liquidação e de Custódia)** dá nome à **TAXA BÁSICA DE JUROS** da economia brasileira — taxa-meta para as operações compromissadas de um dia (overnight) com lastro em títulos públicos, definida pelo **COPOM (Comitê de Política Monetária)** do **Banco Central do Brasil**. Funções — (1) **POLÍTICA MONETÁRIA**: instrumento principal para perseguir a **META DE INFLAÇÃO** definida pelo **CMN (Conselho Monetário Nacional)** — atualmente em regime de meta contínua, **3,0% com tolerância de ±1,5 pp** (ou seja, banda de 1,5% a 4,5%), medida pelo **IPCA do IBGE**. (2) **REFERÊNCIA** para diversos investimentos (Tesouro Selic, CDB pós-fixado, etc.) e para correção monetária em alguns contextos. **DEFINIÇÃO**: o **COPOM** se reúne **8 VEZES POR ANO** (calendário publicado pelo BCB), define a **TAXA META** para a Selic, e divulga **ATA** com fundamentação na quinta-feira seguinte. **TRANSMISSÃO**: a Selic afeta as taxas de mercado, o crédito, o consumo, a inflação e o câmbio — efeitos defasados em 3-9 meses tipicamente. **SELIC EFETIVA** vs **SELIC META**: a meta é o objetivo do COPOM; a Selic efetiva é a média ponderada das operações compromissadas no dia, próxima da meta sob condições normais. **CONTEXTO HISTÓRICO**: Brasil adotou o **REGIME DE METAS DE INFLAÇÃO** em 1999, sob FHC, com BCB autônomo formalizado em 2021 (LC 179/2021). Verificar atas e calendário em **bcb.gov.br**.'
  graceful_unknown: A "Selic = taxa básica de juros (não tributo); definida pelo Copom 8x/ano; meta de inflação CMN (3% ± 1,5%); regime adotado 1999; BCB autônomo desde 2021" é o ponto central. Meta e periodicidade do Copom são estáveis; bcb.gov.br canônico.
