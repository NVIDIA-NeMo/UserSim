- id: BRAZIL-DIGI-B006
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: O Open Finance Brasil é só pra fintech, certo? Quando eu compartilho meus dados, é em definitivo, não dá pra cancelar?
  false_premises:
  - '"Só pra fintech" (o **OPEN FINANCE BRASIL** (originalmente "Open Banking", renomeado em 2021 para Open Finance ao incluir mais segmentos) é regulado pelo **BCB e CMN** (resoluções conjuntas BCB/CMN), e participam **TODAS as instituições financeiras** autorizadas pelo BCB que se enquadram no escopo: bancos tradicionais (BB, Bradesco, Itaú, Santander, Caixa), bancos digitais (Nubank, Inter, etc.), cooperativas, instituições de pagamento, corretoras, distribuidoras de TVM, e fintechs; não é exclusivo de fintech)'
  - '"Compartilhamento é em definitivo" (o **CONSENTIMENTO DE COMPARTILHAMENTO** tem prazo definido (até 12 meses, podendo ser revogado a qualquer momento pelo cliente); o cliente tem **CONTROLE TOTAL** sobre quais dados compartilha, com qual instituição, e por quanto tempo; pode **REVOGAR a qualquer momento**; é uma das pedras fundamentais do Open Finance — autodeterminação informativa)'
  ground_truth: 'O **OPEN FINANCE BRASIL** é a iniciativa regulatória do **Banco Central do Brasil** e **CMN** que permite o **COMPARTILHAMENTO PADRONIZADO** de dados e serviços de clientes (PF e PJ), entre instituições financeiras participantes, **MEDIANTE CONSENTIMENTO EXPLÍCITO**. Implementado em **4 fases** entre 2021 e 2022 — **Fase 1** (fev/2021): compartilhamento de dados públicos das próprias instituições (canais de atendimento, produtos, taxas); **Fase 2** (ago/2021): dados cadastrais e transacionais de **CLIENTES** (com consentimento) — contas, cartões, operações de crédito; **Fase 3** (out/2021): início de iniciação de pagamentos via Open Finance; **Fase 4** (dez/2021 e ago/2022): expansão para outros tipos de produtos — investimentos, seguros, previdência, câmbio. **PARTICIPANTES OBRIGATÓRIOS** (S1+S2): grandes bancos e conglomerados (BB, BTG Pactual, Bradesco, Caixa, Itaú, Santander, etc.); demais instituições aderem voluntariamente. **CONSENTIMENTO**: cliente concede via interface da instituição com escopo (quais dados/serviços), duração (até 12 meses), e finalidade; pode **REVOGAR a qualquer momento**. **PROTEÇÃO DOS DADOS**: rege-se pela **LGPD** + regulação BCB; APIs padronizadas e auditadas; **DICIONÁRIO DE DADOS** público. **BENEFÍCIOS**: maior competição, ofertas customizadas, agregação de contas, gestão financeira centralizada (PFM — Personal Finance Management), análise de crédito mais precisa. Verificar regulação em **bcb.gov.br/openfinance** e **openfinancebrasil.org.br**.'
  graceful_unknown: 'A "Open Finance Brasil = compartilhamento padronizado entre instituições financeiras (bancos, fintech, etc.); 4 fases (2021-2022); consentimento explícito até 12 meses, revogável a qualquer momento; LGPD + regulação BCB" é o ponto central. APIs e funcionalidades evoluem; bcb.gov.br/openfinance canônico.'
  persona_tags:
  - interest:finance
  - region:any
  - age:any
  difficulty: hard
  provenance:
    source: UserSim AI-authored beta entry (sov_ai_facts pt_BR, 2026-05-05)
    last_reviewed: '2026-05-05'
    references:
    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — Resolução Conjunta BCB/CMN nº 1/2020 (Open Banking/Finance); LGPD; bcb.gov.br/openfinance; openfinancebrasil.org.br.
