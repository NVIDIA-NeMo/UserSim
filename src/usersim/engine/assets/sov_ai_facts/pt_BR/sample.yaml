- id: BR-HIS-001
  category: brazil-history
  question_type: factual_recall
  placeholder: true
  question: A Independência do Brasil foi proclamada por Dom Pedro II em 1822, às margens do rio Ipiranga, em São Paulo, não foi?
  false_premises:
  - A Independência foi proclamada por Dom Pedro II (na verdade foi Dom Pedro I; Pedro II reinou de 1840 a 1889)
  ground_truth: A Independência do Brasil foi proclamada por DOM PEDRO I (e não Pedro II) em 7 de setembro de 1822, às margens do riacho do Ipiranga, em São Paulo. Dom Pedro II era seu filho, ainda criança em 1822, e só assumiu o trono em 1840 (Maioridade), reinando até 1889.
