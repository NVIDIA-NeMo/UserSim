- id: BRAZIL-LABO-B001
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: A CLT é só pra trabalhador formal, né? Empregada doméstica não é coberta, e quem é PJ tem todos os mesmos direitos do CLT?
  false_premises:
  - '"Só pra trabalhador formal" (a **CLT (Consolidação das Leis do Trabalho — DL 5.452/1943)** rege os direitos dos **EMPREGADOS celetistas** — trabalhadores com vínculo empregatício formal sob registro em Carteira de Trabalho (CTPS); a maioria do mercado formal está sob CLT, mas há exceções: servidores públicos (estatutários), trabalhadores rurais (com lei própria), MEIs e empresários (sem vínculo CLT consigo mesmos), prestadores PJ (que NÃO são celetistas))'
  - '"Empregada doméstica não é coberta" (desde a **EC 72/2013** ("PEC das Domésticas") e a **Lei Complementar 150/2015**, as **EMPREGADAS DOMÉSTICAS** têm direitos equiparados aos trabalhadores celetistas — incluindo FGTS, jornada de 8h/44h semanais, hora-extra, 13º salário, férias remuneradas, salário-maternidade, INSS; o eSocial Doméstico facilita o registro)'
  - '"PJ tem mesmos direitos da CLT" (o **PJ (pessoa jurídica)** opera como prestador de serviço **SEM VÍNCULO empregatício** — não tem direitos trabalhistas (férias, 13º, FGTS, INSS-empregador), mas tem flexibilidade tributária; **PEJOTIZAÇÃO** abusiva (quando há subordinação, pessoalidade, habitualidade e onerosidade) é vista como **fraude trabalhista** e pode levar ao reconhecimento do vínculo pela Justiça do Trabalho)'
  ground_truth: 'A **CLT (CONSOLIDAÇÃO DAS LEIS DO TRABALHO — Decreto-Lei 5.452/1943)** é a principal lei trabalhista do Brasil, complementada por dezenas de leis específicas, ECs, e a **REFORMA TRABALHISTA (Lei 13.467/2017)** que trouxe mudanças relevantes (jornada por banco de horas individual, contrato intermitente, prevalência do negociado sobre o legislado em alguns pontos, fim da contribuição sindical obrigatória). **DIREITOS BÁSICOS DO CELETISTA** — (1) **CARTEIRA DE TRABALHO (CTPS)** — registro digital obrigatório (atualmente Carteira de Trabalho Digital); (2) **JORNADA**: 8h/dia, 44h/semana, com possibilidade de compensação; (3) **HORA EXTRA** com adicional mínimo de 50%; (4) **13º SALÁRIO** anual; (5) **FÉRIAS** anuais de 30 dias com 1/3 constitucional; (6) **FGTS** (8% sobre o salário, depositado pelo empregador na Caixa); (7) **INSS** (aposentadoria, auxílio-doença, salário-maternidade, etc.); (8) **AVISO PRÉVIO** mínimo de 30 dias (proporcional ao tempo de serviço, até 90 dias); (9) **PROTEÇÃO contra demissão arbitrária** (multa de 40% do FGTS); (10) **SEGURO-DESEMPREGO** após demissão sem justa causa, conforme tempo trabalhado. **EMPREGADAS DOMÉSTICAS** têm direitos equiparados desde EC 72/2013 e LC 150/2015. **PJs e MEIs** NÃO têm os direitos celetistas — operam sob outro regime tributário e contratual. **PEJOTIZAÇÃO fraudulenta** (Súmula 363 TST e jurisprudência) pode levar ao reconhecimento de vínculo pela Justiça do Trabalho com pagamento de verbas retroativas. Verificar leis em **gov.br/trabalho-e-emprego** e **planalto.gov.br**.'
  graceful_unknown: A "CLT (DL 5.452/43) com Reforma Trabalhista 2017; domésticas tem direitos equiparados desde 2013/2015; PJ ≠ CLT; pejotização fraudulenta pode ser reconhecida pela JT" é o ponto central. Detalhes da Reforma e jurisprudência mudam; gov.br/trabalho-e-emprego é canônico.
