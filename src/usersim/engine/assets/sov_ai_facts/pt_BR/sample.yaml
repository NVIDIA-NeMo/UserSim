- id: BRAZIL-LABO-B002
  category: brazil-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: O FGTS é só pra comprar imóvel, né? O empregado deposita do bolso dele todo mês, e ele só pode sacar depois dos 65 anos?
  false_premises:
  - '"Só pra comprar imóvel" (o **FGTS (Fundo de Garantia do Tempo de Serviço)** pode ser usado em DIVERSAS situações: **DEMISSÃO SEM JUSTA CAUSA**, aposentadoria, falecimento do trabalhador, doenças graves (câncer, HIV/AIDS, etc.), idade igual ou superior a 70 anos, financiamento ou compra de imóvel residencial, calamidade pública, **FGTS-SAQUE-ANIVERSÁRIO** (modalidade desde 2020), conta inativa há 3+ anos, fim do contrato por tempo determinado, etc.)'
  - '"Empregado deposita" (o **FGTS é depositado pelo EMPREGADOR**, não pelo empregado — **8% do salário bruto** mensal (mais 3,2% adicional para empregados domésticos para compensar a multa de 40%) na conta vinculada do trabalhador na **Caixa Econômica Federal**; é direito celetista — não desconto do salário do trabalhador)'
  - '"Só pode sacar depois dos 65 anos" (o saque tem várias hipóteses listadas — **demissão sem justa causa** é a mais comum (recebe FGTS + multa de 40% do empregador); aposentadoria, doenças graves, calamidade, compra de imóvel, e desde 2020 o **SAQUE-ANIVERSÁRIO** (anualmente, no mês do aniversário, com troca permanente para essa modalidade — quem opta perde direito ao saque por demissão); a partir dos **70 anos** é possível sacar o saldo integral mesmo sem demissão; não é "65 anos")'
  ground_truth: 'O **FGTS (Fundo de Garantia do Tempo de Serviço)** é um direito celetista regulado pela **Lei 8.036/1990**. O **EMPREGADOR** deposita mensalmente **8% do salário bruto do empregado** em conta vinculada na **Caixa Econômica Federal** (mais 3,2% adicional no caso de empregados domésticos sob contrato regular para compensar a multa rescisória); **NÃO é desconto do empregado**. O saldo rende **TR (Taxa Referencial) + 3% ao ano**, com distribuição de lucros pela Caixa. **HIPÓTESES DE SAQUE** — (a) demissão sem justa causa (com multa de 40% paga pelo empregador); (b) aposentadoria; (c) falecimento do trabalhador (saque pelos dependentes); (d) doenças graves (câncer, HIV/AIDS, neoplasia maligna, etc.) do trabalhador ou dependentes; (e) compra ou financiamento de IMÓVEL RESIDENCIAL urbano (com regras específicas — Sistema Financeiro Habitacional, programas oficiais como Minha Casa Minha Vida); (f) calamidade pública (em municípios com decreto de calamidade); (g) **SAQUE-ANIVERSÁRIO** (modalidade desde 2020) — saque parcial anualmente no mês do aniversário, em troca de NÃO PODER sacar em caso de demissão; (h) idade igual ou superior a 70 anos (saque integral); (i) conta inativa há 3+ anos (regras transitórias); (j) fim de contrato por tempo determinado. O **FGTS DIGITAL** e o app FGTS facilitam consulta de saldo e movimentações. Verificar regras atuais em **fgts.gov.br** e **caixa.gov.br/fgts**.'
  graceful_unknown: A "FGTS = depositado pelo empregador (8% do salário); várias hipóteses de saque (demissão, aposentadoria, imóvel, doenças, saque-aniversário, 70+ anos)" é o ponto central. Regras específicas do saque-aniversário e modalidade-transição são revisadas; fgts.gov.br é canônico.
