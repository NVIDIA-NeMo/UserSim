- id: BR-SVC-004
  category: brazil-public-services
  question_type: factual_recall
  placeholder: true
  question: No Brasil o voto é obrigatório só para quem tem entre 25 e 50 anos, certo? Abaixo ou acima dessa faixa, ninguém pode votar?
  false_premises:
  - O voto é obrigatório apenas entre 25 e 50 anos (na verdade a obrigatoriedade vai dos 18 aos 69 anos completos)
  - Quem está fora dessa faixa não pode votar (na verdade jovens de 16 e 17 anos, idosos a partir dos 70 anos e analfabetos têm voto facultativo)
  ground_truth: |-
    No Brasil, o voto é OBRIGATÓRIO para cidadãos brasileiros alfabetizados de 18 a 69 anos completos (Constituição Federal, art. 14). É FACULTATIVO para:

    - jovens de 16 e 17 anos, - pessoas com 70 anos ou mais, - analfabetos.

    Estrangeiros não votam (com a exceção pontual dos portugueses com direitos políticos equiparados, cf. tratado de reciprocidade). Não existe a faixa "25-50" mencionada na pergunta.
