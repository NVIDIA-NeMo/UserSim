  ground_truth: O Pão de Açúcar (~396 m) é um cartão-postal carioca, mas está longe de ser o ponto mais alto do Brasil. O cume mais elevado é o Pico da Neblina (~2.995 m), no estado do Amazonas, na Serra do Imeri, perto da fronteira com a Venezuela.
