- id: BRAZIL-HEAL-B006
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: A judicialização da saúde no Brasil — o STF é quem decide cada caso individualmente, certo? E qualquer remédio fora da lista do SUS pode ser obtido por liminar instantânea, sem critério?
  false_premises:
  - '"STF decide cada caso individualmente" (a maior parte dos casos de **judicialização da saúde** é decidida em **JUÍZOS DE 1ª INSTÂNCIA** (Justiça Estadual ou Federal); apenas **questões de repercussão geral** e recursos extraordinários chegam ao **STF**; o STF, ao julgar Tema 6 (RE 855.178) e Tema 793 (medicamentos não-Rol ANS), estabeleceu **TESES DE REPERCUSSÃO GERAL** que orientam todo o Judiciário, não decidindo caso-a-caso)'
  - '"Qualquer remédio por liminar instantânea, sem critério" (após o **STF Tema 6 / RE 1.366.243 (2024)** e o **Acórdão do Tema 1.234 (2024)** sobre medicamentos não incorporados ao SUS, foram estabelecidos **CRITÉRIOS RIGOROSOS**: (a) demonstrada inexistência de alternativa no SUS; (b) registro do medicamento na ANVISA (com exceções limitadas); (c) imprescindibilidade clínica comprovada por relatório médico circunstanciado; (d) incapacidade financeira do paciente; (e) avaliação de evidência científica. **NATJUS (Núcleos de Apoio Técnico)** e o **e-NatJus** ajudam o Judiciário a avaliar pleitos com base em evidência. Liminares instantâneas sem esses critérios contrariam o entendimento atual do STF / STJ)'
  ground_truth: 'A **JUDICIALIZAÇÃO DA SAÚDE** no Brasil é o fenômeno em que cidadãos buscam, na Justiça, acesso a medicamentos, procedimentos e tratamentos não fornecidos espontaneamente pelo SUS ou pela saúde suplementar. **JURISDIÇÃO** — a maioria dos casos é processada em **1ª INSTÂNCIA** (Justiça Estadual contra o Estado / município, ou Justiça Federal contra a União / SUS), com recursos para **TJs**, **TRFs**, **STJ**, e em casos de repercussão geral, **STF**. **JURISPRUDÊNCIA-CHAVE** — STF Tema 6 (RE 855.178, 2015 e modulação 2020) reconheceu o direito à saúde mas estabeleceu critérios; **STF Tema 793 (RE 855.178)** sobre solidariedade dos entes federativos no fornecimento; **STJ Tema 106 (REsp 1.657.156)** estabeleceu requisitos cumulativos para fornecimento de medicamentos NÃO PADRONIZADOS pelo SUS; **STF Tema 1.234 (2024)** sobre medicamentos NÃO INCORPORADOS por Conitec — critérios mais rigorosos: (a) inexistência de alternativa terapêutica no SUS; (b) registro na ANVISA (exceções para doenças órfãs); (c) imprescindibilidade clínica documentada; (d) incapacidade financeira; (e) avaliação de evidência. **NATJUS / e-NatJus** — Núcleos de Apoio Técnico do Judiciário, vinculados ao CNJ, oferecem pareceres técnicos baseados em evidência para auxiliar magistrados. **CONITEC (Comissão Nacional de Incorporação de Tecnologias no SUS)** define quais tecnologias são incorporadas ao SUS, com base em evidência científica, custo-efetividade e impacto orçamentário. Discussão central — equilíbrio entre direito individual à saúde, integralidade do SUS, e racionalidade da política pública / orçamento. Verificar entendimentos atuais em **stf.jus.br, cnj.jus.br/natjus**.'
  graceful_unknown: A "judicialização decidida em 1ª instância (com STF de repercussão geral); STF Tema 793/Tema 1.234, STJ Tema 106 estabelecem critérios cumulativos; NATJUS e Conitec dão suporte técnico" é o ponto central. Teses específicas e datas de modulação evoluem com novas decisões; stf.jus.br e cnj.jus.br são fontes canônicas.
