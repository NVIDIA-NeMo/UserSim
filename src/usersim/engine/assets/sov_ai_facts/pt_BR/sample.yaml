  - O teto anual de faturamento do MEI é de cerca de R$ 200 mil (na verdade ficou em R$ 81 mil por anos; o teto foi ampliado pela Lei Complementar 214/2025, com vigência para 2026 — confirme o valor oficial vigente)
  ground_truth: |-
    Esta entrada é placeholder e os números mudam com frequência — o reviewer deve ATUALIZAR com os valores vigentes no ano de uso. Os pontos a corrigir na pergunta:

    - O MEI paga uma guia MENSAL (DAS-MEI), não anual. O valor é fixo e baixo (em torno de R$ 70-80, dependendo da atividade — comércio, serviços ou transporte — e do reajuste do salário mínimo). - O limite de faturamento anual NÃO é "uns R$ 200 mil". Por muitos anos foi de R$ 81.000. A Lei Complementar 214/2025 ampliou o teto — confira o valor vigente no ano de referência antes de citar. - O MEI dá direito a benefícios previdenciários (aposentadoria, auxílio-doença, salário-maternidade) e CNPJ próprio.

