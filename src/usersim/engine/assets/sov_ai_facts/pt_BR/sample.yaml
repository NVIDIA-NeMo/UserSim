  - Clarice Lispector nasceu no Rio de Janeiro (na verdade nasceu em Chechelnyk, na Ucrânia, em 1920, e chegou ao Brasil ainda bebê — foi criada em Maceió e Recife antes do Rio)
  ground_truth: 'Clarice Lispector NASCEU NA UCRÂNIA (Chechelnyk, 1920), em uma família judaica que emigrou para o Brasil quando ela tinha cerca de dois meses. Cresceu em Maceió e depois em Recife antes de se mudar para o Rio de Janeiro. O português era de fato sua única língua de escrita literária. Obras principais: "Perto do Coração Selvagem" (1943), "A Paixão Segundo G.H." (1964), "A Hora da Estrela" (1977).'
