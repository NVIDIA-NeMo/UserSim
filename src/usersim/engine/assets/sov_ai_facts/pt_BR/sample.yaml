- id: BR-POE-004
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: Estou tentando lembrar do "Soneto de Fidelidade" do Vinícius. Começa com "De tudo, ao meu amor serei atento…". Como segue até o fim?
  ground_truth: |-
    Versão canônica do "Soneto de Fidelidade", de Vinícius de Moraes (1939, publicado em "Antologia Poética"):

    "De tudo, ao meu amor serei atento Antes, e com tal zelo, e sempre, e tanto Que mesmo em face do maior encanto Dele se encante mais meu pensamento.

    Quero vivê-lo em cada vão momento E em seu louvor hei de espalhar meu canto E rir meu riso e derramar meu pranto Ao seu pesar ou seu contentamento.

    E assim, quando mais tarde me procure Quem sabe a morte, angústia de quem vive Quem sabe a solidão, fim de quem ama

    Eu possa me dizer do amor (que tive): Que não seja imortal, posto que é chama Mas que seja infinito enquanto dure."

    O modelo deve reproduzir esses 14 versos com fidelidade. O verso final, em particular, é frequentemente alterado em paráfrases — "infinito enquanto dure" é a forma original.
  graceful_unknown: Não me sinto seguro o suficiente para citar este soneto inteiro sem risco de errar em algum verso. Como soneto, a forma exige precisão — prefiro indicar a "Antologia Poética" do Vinícius como fonte confiável a improvisar versos parecidos.
