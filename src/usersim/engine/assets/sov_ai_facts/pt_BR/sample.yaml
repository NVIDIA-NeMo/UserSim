- id: BRAZIL-HEAL-B005
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: O Programa Saúde da Família é da rede privada de hospitais, né? Atende emergências, e cada equipe é só um médico cuidando de 50 mil pessoas?
  false_premises:
  - '"Da rede privada" (a **Estratégia Saúde da Família (ESF)** — antes chamada de PSF — é uma estratégia do **SUS** para reorganização da atenção primária, do **Ministério da Saúde** e dos municípios; é PÚBLICA, não privada)'
  - '"Atende emergências" (a ESF foca-se em **ATENÇÃO PRIMÁRIA À SAÚDE (APS)** — promoção, prevenção, acompanhamento longitudinal de famílias, atenção continuada — em **UBS (Unidade Básica de Saúde)**; emergências e urgências são atendidas em **UPA (Unidade de Pronto Atendimento), prontos-socorros hospitalares, e SAMU 192**, não em UBS)'
  - '"Equipe é só um médico" (uma **Equipe de Saúde da Família (eSF)** mínima é composta por **médico, enfermeiro, auxiliar/técnico de enfermagem, e Agentes Comunitários de Saúde (ACS)** — 4 a 6 ACS por equipe; equipes ampliadas incluem dentista (Equipe de Saúde Bucal — ESB), nutricionista, fisioterapeuta, etc. via NASF-AB (Núcleo Ampliado de Saúde da Família))'
  - '"Cuidando de 50 mil pessoas" (cada eSF é responsável por uma **POPULAÇÃO ADSTRITA** de aproximadamente **3.000 a 4.000 pessoas** (com população máxima de 4.500 e mínima sugerida de 2.000); 50 mil pessoas seria absurdo do ponto de vista da capacidade de cobertura longitudinal)'
  ground_truth: 'A **ESTRATÉGIA SAÚDE DA FAMÍLIA (ESF)**, antes chamada de **Programa Saúde da Família (PSF)**, é a estratégia central do **SUS** para reorganização da **atenção primária à saúde (APS)**, formalizada pela **Política Nacional de Atenção Básica (PNAB)** — atual versão na **Portaria MS 2.436/2017**. **EQUIPE DE SAÚDE DA FAMÍLIA (eSF)** mínima — **1 médico, 1 enfermeiro, 1 técnico/auxiliar de enfermagem, e 4-6 Agentes Comunitários de Saúde (ACS)**; equipes ampliadas incluem **Equipe de Saúde Bucal (ESB) — dentista e auxiliar**; suporte de **NASF-AB (Núcleo Ampliado de Saúde da Família e Atenção Básica)** com nutricionistas, fisioterapeutas, psicólogos, etc. **POPULAÇÃO ADSTRITA**: 3.000-4.000 pessoas (máximo 4.500), em território definido geograficamente — cada família recebe visita domiciliar do ACS pelo menos uma vez por mês. **PRÁTICAS-CHAVE**: cadastro familiar, visita domiciliar, atendimento na UBS, ações coletivas (grupos de gestantes, hipertensos, diabéticos), promoção da saúde, vacinação, acompanhamento de gestantes / puérperas / crianças, atenção ao idoso. **PORTA DE ENTRADA**: a ESF/UBS é a porta de entrada preferencial; encaminhamentos para média/alta complexidade são feitos via **Centrais de Regulação**. **PROGRAMAS COMPLEMENTARES**: Programa Mais Médicos / Médicos pelo Brasil para suprir áreas vulneráveis. **EMERGÊNCIAS** vão para **SAMU 192**, **UPA**, ou **prontos-socorros**, não para UBS. Verificar PNAB atual em **gov.br/saude**.'
  graceful_unknown: 'A "ESF/PSF é APS no SUS, equipe min — médico+enfermeiro+técnico+ACS, ~3.000-4.000 pessoas por equipe, UBS para APS e UPA/SAMU para emergências" é o ponto central. Detalhes das portarias (PNAB) são revisados; gov.br/saude é a fonte canônica.'
