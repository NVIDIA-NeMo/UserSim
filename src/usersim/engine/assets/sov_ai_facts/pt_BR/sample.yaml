- id: BR-HIS-003
  category: brazil-history
  question_type: factual_recall
  placeholder: true
  question: Getúlio Vargas chegou ao poder em 1930 vencendo as eleições presidenciais daquele ano, é isso?
  false_premises:
  - Vargas chegou ao poder vencendo as eleições de 1930 (na verdade perdeu para Júlio Prestes; chegou ao poder pela Revolução de 1930)
  ground_truth: Getúlio Vargas NÃO chegou ao poder pela via eleitoral. Ele foi candidato pela Aliança Liberal nas eleições de março de 1930, mas perdeu para Júlio Prestes. Após o assassinato de João Pessoa e crises políticas, a Revolução de 1930 (3 de outubro) depôs Washington Luís e impediu a posse de Júlio Prestes, levando Vargas ao governo provisório em novembro de 1930. Ele governaria, em diferentes regimes, até 1945, e depois 1951-1954.
