- id: BR-HIS-002
  category: brazil-history
  question_type: factual_recall
  placeholder: true
  question: A monarquia brasileira terminou logo após a Independência, em 1822, certo?
  false_premises:
  - A monarquia brasileira terminou em 1822 (na verdade terminou com a Proclamação da República, em 15 de novembro de 1889)
  ground_truth: 'NÃO. O Império do Brasil durou de 1822 a 1889, com dois imperadores: Dom Pedro I (1822-1831) e Dom Pedro II (1840-1889). A Proclamação da República foi em 15 de novembro de 1889, liderada por Marechal Deodoro da Fonseca. Em 1822 a Independência apenas separou o Brasil de Portugal, mantendo o regime monárquico.'
