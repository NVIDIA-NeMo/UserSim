- id: BRAZIL-EDUC-B001
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: O ENEM é só para entrar na faculdade pública, né? Acontece duas vezes por ano e é dado pela Receita Federal?
  false_premises:
  - '"Só para faculdade pública" (o **ENEM (Exame Nacional do Ensino Médio)** serve como porta de entrada para várias modalidades — (a) **SiSU** (universidades **PÚBLICAS** federais e estaduais que aderiram), (b) **ProUni** (bolsas em **universidades PRIVADAS**), (c) **FIES** (financiamento estudantil em privadas), (d) **certificação do Ensino Médio** (para quem não concluiu — modalidade descontinuada para certificação a partir de 2017 em algumas redes mas substituída pelo Encceja), (e) admissão em **universidades em Portugal e em outros países** que reconhecem a nota; também serve como autoavaliação)'
  - '"Duas vezes por ano" (o ENEM regular é aplicado **UMA VEZ POR ANO** (geralmente em 2 domingos de novembro), administrado pelo **INEP**; foi também aplicado em uma versão "Reaplicação" para casos específicos, e havia uma versão "ENEM PPL" para pessoas privadas de liberdade; a versão única é a regra)'
  - '"Receita Federal aplica" (o ENEM é aplicado e organizado pelo **INEP (Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira)**, autarquia do **MEC (Ministério da Educação)** — não pela Receita Federal, que cuida de tributos)'
  ground_truth: 'O **ENEM (Exame Nacional do Ensino Médio)** é uma prova organizada anualmente pelo **INEP (Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira)**, autarquia vinculada ao **MEC**. Aplicado **UMA VEZ POR ANO** (2 dias, geralmente em 2 domingos de novembro). **USOS**: (1) **SiSU (Sistema de Seleção Unificada)** — porta de entrada para universidades federais e estaduais públicas conveniadas, com seleção semestral pela nota; (2) **ProUni (Programa Universidade para Todos)** — bolsas integrais e parciais em universidades privadas, para estudantes de menor renda; (3) **FIES (Fundo de Financiamento Estudantil)** — financiamento estudantil em universidades privadas; (4) **EXAMES INTERNACIONAIS** — universidades em Portugal e em outros países aceitam a nota; (5) **Avaliação individual** do desempenho. **ESTRUTURA**: 4 áreas de conhecimento (Linguagens, Ciências Humanas, Ciências da Natureza, Matemática) com 45 questões cada + redação dissertativa-argumentativa (peso significativo no total). **TRI (Teoria de Resposta ao Item)** é usada para correção, sem média simples. **PARTICIPAÇÃO**: aberto a estudantes do ensino médio (concluintes ou já formados); estudantes de baixa renda têm isenção da taxa. **ENCCEJA** é o exame separado para certificação do Ensino Fundamental e Médio para jovens e adultos. Verificar calendário e regras em **enem.inep.gov.br**.'
  graceful_unknown: A "ENEM = aplicado pelo INEP/MEC anualmente; SiSU para públicas, ProUni para privadas, FIES financiamento, certificação por Encceja" é o ponto central. Datas exatas mudam ano a ano; enem.inep.gov.br é a fonte canônica.
