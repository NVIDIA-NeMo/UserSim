- id: BRAZIL-DIGI-B004
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: O e-Título eleitoral substitui completamente a urna física, certo? Posso votar por ele de qualquer lugar do mundo, e ele já é obrigatório pra eleitor com mais de 60 anos?
  false_premises:
  - '"Substitui a urna física" (o **E-TÍTULO** é a **VERSÃO DIGITAL DO TÍTULO DE ELEITOR**, NÃO substitui a votação na urna eletrônica; serve como documento de identificação no momento de votar e oferece serviços eleitorais (consulta de zona/seção, certidão de quitação, etc.); o eleitor ainda precisa comparecer à seção eleitoral física e votar na urna eletrônica — exceto eleitores fora do domicílio que podem votar em algumas situações via "voto em trânsito" mas ainda em urna física)'
  - '"Voto de qualquer lugar do mundo" (NÃO há voto pela internet no Brasil; eleitores no exterior podem votar somente para **PRESIDENTE/VICE** em **EMBAIXADAS E CONSULADOS** brasileiros, em urnas eletrônicas físicas; eleitores no Brasil que estejam em trânsito podem usar **voto em trânsito** apenas para presidente/vice, em algumas zonas eleitorais previamente cadastradas, mas com inscrição prévia)'
  - '"Obrigatório para 60+" (o e-Título NÃO é obrigatório para qualquer faixa etária — é uma facilidade opcional; o **TÍTULO DE ELEITOR FÍSICO** está em desuso, não sendo mais emitido como cartão impresso (apenas em casos específicos), mas o e-Título é uma das formas de comprovar a inscrição)'
  ground_truth: 'O **E-TÍTULO** é o aplicativo do **TSE (Tribunal Superior Eleitoral)** para **smartphones** que oferece a versão digital do título de eleitor brasileiro e diversos serviços eleitorais. **FUNCIONALIDADES**: (1) **VERSÃO DIGITAL DO TÍTULO** — válida para identificação no momento da votação (deve ser apresentada junto com documento oficial com foto se a foto não estiver no e-Título); (2) **CONSULTA** ao local de votação (zona, seção, endereço); (3) **JUSTIFICATIVA DE AUSÊNCIA**; (4) **CERTIDÃO DE QUITAÇÃO ELEITORAL** (digital com QR Code); (5) **EMISSÃO DE CERTIDÕES** (de quitação, de regularidade); (6) **CONSULTA DE INFORMAÇÕES BIOMÉTRICAS** e regularidade. **VOTO NO BRASIL**: realizado em **URNA ELETRÔNICA FÍSICA** nas seções eleitorais; o e-Título **NÃO é** voto online — é apenas documento e portal de serviços. **VOTO NO EXTERIOR** (Lei 6.996/82 e Resoluções TSE): possível para eleitores brasileiros residentes ou em trânsito em mais de 100 países, em **EMBAIXADAS, CONSULADOS e POSTOS** indicados pelo TSE; voto apenas para **PRESIDENTE/VICE** em **URNA ELETRÔNICA FÍSICA**; precisa **TRANSFERIR DOMICÍLIO ELEITORAL** para o exterior antecipadamente. **VOTO EM TRÂNSITO**: para eleitores dentro do Brasil que estarão fora de seu domicílio no dia da eleição, em zonas eleitorais previamente preparadas, mediante inscrição antecipada (cerca de 4 meses antes da eleição) — somente para Presidente/Vice. **BIOMETRIA**: o cadastro biométrico é gradativamente expandido em todo o país; eleitor com biometria pode usar identificação biométrica na urna em zonas habilitadas. Verificar serviços e calendário em **tse.jus.br**.'
  graceful_unknown: A "e-Título = título digital, NÃO é voto online; voto no Brasil em urna eletrônica física; voto no exterior apenas para Presidente/Vice em embaixadas/consulados (urna física); voto em trânsito disponível para eleitores fora do domicílio dentro do Brasil" é o ponto central. Resoluções do TSE e funcionalidades do app evoluem; tse.jus.br canônico.
