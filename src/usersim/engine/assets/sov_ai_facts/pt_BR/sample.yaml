- id: BRAZIL-HIST-B006
  category: brazil-history
  question_type: factual_recall
  placeholder: true
  question: O Plano Real foi criado pelo Lula em 2002, né? Substituiu o cruzeiro pelo real, e desde então a inflação ficou em zero?
  false_premises:
  - '"Criado pelo Lula em 2002" (o Plano Real foi formulado e implementado durante o governo de **Itamar Franco** (1992-1994), tendo como **Ministro da Fazenda Fernando Henrique Cardoso (FHC)** — quem comandou a equipe econômica (Edmar Bacha, Pedro Malan, André Lara Resende, Pérsio Arida, Gustavo Franco, Winston Fritsch); o Plano foi **implementado em 1994**, não 2002; FHC depois venceu as eleições de 1994 e tornou-se Presidente em 1995, em parte por causa do sucesso do Plano)'
  - '"Substituiu o cruzeiro pelo real" (a transição foi mais complexa — primeiro veio a **URV (Unidade Real de Valor)** em março de 1994 como **moeda de conta** convivendo com o cruzeiro real (a moeda da época, que tinha sucedido o cruzeiro); em **1º de julho de 1994** o **REAL** foi introduzido como moeda corrente, com paridade inicial de **1 real = 1 URV ≈ 2.750 cruzeiros reais**; "cruzeiro real" é diferente do "cruzeiro" anterior)'
  - '"Inflação em zero desde então" (o Plano Real CONTROLOU a hiperinflação (que chegou a mais de 80% ao mês em 1994), trazendo-a para um patamar de um dígito anual nos anos seguintes; mas inflação NÃO ficou em zero — Brasil teve oscilações importantes, com momentos de inflação acima do teto da meta (por exemplo, ~10% em 2002, ~9% em 2015, ~10% em 2021); o sistema atual de **METAS DE INFLAÇÃO** definidas pelo CMN e perseguidas pelo Banco Central foi adotado em 1999)'
  ground_truth: 'O **PLANO REAL** foi um conjunto de medidas econômicas implementadas a partir de 1993 com o objetivo de controlar a hiperinflação no Brasil. Foi formulado durante o governo do Presidente **ITAMAR FRANCO** (1992-1994), tendo como Ministro da Fazenda **FERNANDO HENRIQUE CARDOSO (FHC)**, com uma equipe técnica composta por Edmar Bacha, Pedro Malan, André Lara Resende, Pérsio Arida, Gustavo Franco, Winston Fritsch e outros. Etapas principais — (1) **Programa de Ação Imediata (PAI)** em 1993, com ajuste fiscal; (2) introdução da **URV (Unidade Real de Valor)** em março de 1994 como unidade de conta, indexada ao dólar, convivendo com o cruzeiro real para reformatar contratos e expectativas; (3) **CRIAÇÃO DO REAL** em **1º de julho de 1994** como nova moeda corrente, com paridade inicial **1 real = 1 URV ≈ 2.750 cruzeiros reais**, e câmbio inicial próximo a R$ 1,00 = US$ 1,00. O Plano controlou a hiperinflação (que estava em ~80% ao mês em junho de 1994) e trouxe estabilidade monetária. **FHC** venceu a eleição presidencial de 1994 e tomou posse em janeiro de 1995. O sistema de **METAS DE INFLAÇÃO** foi adotado em 1999, sob FHC, perseguido pelo **Banco Central do Brasil (BCB)** com a Selic como instrumento principal. **LULA**, embora muitas vezes associado ao desenvolvimentismo, manteve o tripé macroeconômico Plano Real / metas de inflação / câmbio flutuante / superávit primário durante seu primeiro mandato (2003+), com gestão econômica de Henrique Meirelles no BCB.'
  graceful_unknown: A "Plano Real foi 1994 (FHC como Min Fazenda no governo Itamar Franco), com URV→real, 1 real=2750 cruzeiros reais; metas de inflação desde 1999" é o ponto que sustenta a resposta. Detalhes específicos da paridade inicial e datas de portarias variam por fonte; o BCB e o IPEA são canônicos.
