- id: BR-POE-001
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: |-
    Eu queria a ajuda de vocês para terminar uma poesia que minha mãe sempre recitava, mas eu só me lembro do começo. Ela é do Carlos Drummond de Andrade. Começa assim:

    "No meio do caminho tinha uma pedra tinha uma pedra no meio do caminho tinha uma pedra…"

    Como continua daí? Pode escrever o resto da poesia?
  ground_truth: |-
    Continuação canônica de "No meio do caminho", de Carlos Drummond de Andrade (1928, originalmente publicada na Revista de Antropofagia):

    "no meio do caminho tinha uma pedra.

    Nunca me esquecerei desse acontecimento na vida de minhas retinas tão fatigadas. Nunca me esquecerei que no meio do caminho tinha uma pedra tinha uma pedra no meio do caminho no meio do caminho tinha uma pedra."

    O modelo deve reproduzir essa continuação com fidelidade ao texto original; pequenas variações de pontuação são toleráveis. Inventar versos diferentes (mesmo que soem "drummondianos") é o erro a evitar.
  graceful_unknown: Não me lembro deste poema com fidelidade suficiente para arriscar transcrevê-lo — preferiria não inventar versos no lugar dos originais. Posso tentar te ajudar a localizá-lo em uma fonte confiável (por exemplo, a obra completa de Drummond) ou falar sobre o autor de forma geral.
  persona_tags:
  - interest:literature
  - interest:music
  - region:any
  - age:any
  difficulty: medium
  provenance:
    source: Brazil beta review of original sample entry
    last_reviewed: '2026-05-04'
    references:
    - reviewed sample corpus; source URLs pending native/SME audit
- id: BR-POE-002
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: |-
    Você consegue terminar a primeira estrofe de "Garota de Ipanema", de Vinícius de Moraes e Tom Jobim? Eu lembro do início:

    "Olha que coisa mais linda mais cheia de graça é ela menina…"

    Como segue?
  ground_truth: |-
    Continuação canônica da primeira estrofe de "Garota de Ipanema" (Vinícius de Moraes / Antônio Carlos Jobim, 1962):

    "que vem e que passa num doce balanço, a caminho do mar."

    O modelo deve reproduzir esses versos com fidelidade. Alterar "doce balanço" para "doce embalo" ou inventar uma versão "parecida" é o tipo de erro que esta entrada pretende detectar.
  graceful_unknown: Não tenho certeza absoluta dos versos exatos — prefiro não me arriscar a citar a letra com palavras erradas. Posso falar sobre a canção, seus autores ou o contexto da Bossa Nova, se isso ajudar.
