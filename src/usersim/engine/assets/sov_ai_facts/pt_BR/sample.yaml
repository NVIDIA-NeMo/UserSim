- id: BRAZIL-FINA-B006
  category: brazil-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: O Código de Defesa do Consumidor é uma lei estadual de São Paulo, certo? Só protege quem comprou em loja física no estado, e o prazo de garantia é sempre 6 meses?
  false_premises:
  - '"Lei estadual de São Paulo" (o **CDC (Código de Defesa do Consumidor — Lei 8.078/1990)** é **LEI FEDERAL**, aplica-se em **todo território nacional**; complementa direitos consumeristas previstos na CF/88 art. 5º XXXII e art. 170 V, e dialoga com o Código Civil)'
  - '"Só loja física" (o CDC se aplica a **TODA RELAÇÃO DE CONSUMO** — produtos e serviços de qualquer natureza, em qualquer canal (loja física, e-commerce, telemarketing, porta-a-porta), incluindo serviços bancários, planos de saúde, transportes, etc.; o **e-commerce** tem proteções adicionais na lei do **arrependimento de 7 dias** (Decreto 7.962/2013) que reforça o direito previsto no CDC art. 49)'
  - '"Garantia sempre 6 meses" (a **GARANTIA LEGAL** do CDC art. 26 é de **30 DIAS para produtos não duráveis** (alimentos, perfume, etc.) e **90 DIAS para produtos duráveis** (eletrônicos, eletrodomésticos, veículos, móveis, etc.); a **GARANTIA CONTRATUAL** (do fabricante ou vendedor) é separada e adicional; muitos vendedores oferecem 1 ano, mas isso é contratual; o prazo NÃO é de 6 meses)'
  ground_truth: 'O **CÓDIGO DE DEFESA DO CONSUMIDOR (CDC)** é a **LEI 8.078/1990** — federal, aplicável em todo território nacional. Estabelece direitos e deveres em todas as relações de consumo (produtos e serviços de qualquer natureza, em qualquer canal de venda). **PRINCIPAIS DIREITOS** — (1) **PROTEÇÃO contra publicidade enganosa ou abusiva** (art. 36-37); (2) **VÍCIOS de qualidade e quantidade** — direito a substituição, devolução, ou abatimento; (3) **GARANTIA LEGAL**: 30 dias para não duráveis, 90 dias para duráveis (art. 26); (4) **DIREITO DE ARREPENDIMENTO**: prazo de **7 DIAS** para desistência de compras feitas FORA do estabelecimento (e-commerce, telemarketing, porta-a-porta), com restituição integral (art. 49); reforçado pelo **Decreto 7.962/2013** (e-commerce); (5) **INVERSÃO DO ÔNUS DA PROVA** em favor do consumidor quando hipossuficiente (art. 6º VIII); (6) **VEDAÇÃO de cláusulas abusivas** em contratos (art. 51); (7) **REPARAÇÃO INTEGRAL de danos** (art. 6º VI). **PRAZOS**: prescrição de 5 anos para reclamar reparação por fato do produto/serviço; decadência de 30/90 dias para reclamar vícios (art. 26). **ÓRGÃOS DE PROTEÇÃO**: **PROCONS** estaduais e municipais; **DPDC** (Departamento de Proteção e Defesa do Consumidor) do Ministério da Justiça; **JUSTIÇA COMUM** e **Juizados Especiais Cíveis (JEC)** para causas de baixo valor sem advogado obrigatório (até 20 salários-mínimos); **consumidor.gov.br** plataforma de mediação online; **REGULADORES SETORIAIS** (ANS para saúde, ANATEL para telecom, ANEEL para energia, etc.). Verificar texto atualizado e atos em **planalto.gov.br** e **gov.br/mj/pt-br/assuntos/seus-direitos/consumidor**.'
  graceful_unknown: A "CDC = lei federal 8.078/90; aplica-se a toda relação de consumo (loja física, e-commerce, etc.); garantia legal 30 dias não-duráveis / 90 duráveis; arrependimento 7 dias; PROCONs e Juizados Especiais Cíveis" é o ponto central. Detalhes específicos do CDC e de regulação setorial em gov.br/mj canônico.
