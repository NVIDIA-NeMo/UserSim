- id: BRAZIL-HEAL-B003
  category: brazil-health-systems
  question_type: factual_recall
  placeholder: true
  question: A ANVISA é uma empresa privada, certo? Só mexe com remédios, não com alimentos ou produtos de saúde, e o registro de medicamento dura para sempre, sem renovação?
  false_premises:
  - '"Empresa privada" (a **ANVISA (Agência Nacional de Vigilância Sanitária)** é uma **AUTARQUIA federal** vinculada ao Ministério da Saúde, criada pela **Lei 9.782/1999**; é uma agência reguladora **PÚBLICA**, não uma empresa privada)'
  - '"Só mexe com remédios" (a ANVISA regula muito além de medicamentos — também **alimentos, cosméticos, saneantes, produtos para a saúde / produtos médicos, derivados do tabaco, agrotóxicos (em conjunto com IBAMA e MAPA), serviços de saúde (vigilância sanitária em hospitais, clínicas, laboratórios), terminais portuários e aéreos, fronteiras**)'
  - '"Não com alimentos" (alimentos estão sob ANVISA — registro de alimentos para fins especiais, suplementos, novos alimentos / novos ingredientes, rotulagem nutricional (RDC 429/2020), avaliação de segurança; a ANVISA divide a competência com **MAPA (Ministério da Agricultura)** que cuida dos alimentos de origem animal e vegetal in natura, mas a parte de processamento, regulamentação e segurança alimentar industrial é da ANVISA)'
  - '"Registro dura para sempre" (registros de medicamentos têm **VALIDADE de 5 anos**, devendo ser **revalidados** pela ANVISA conforme a Lei 6.360/1976 e regulamentação RDC; renovação é exigida com apresentação de relatório periódico de farmacovigilância e atualização de informações; os mesmos prazos quinquenais aplicam-se a outros produtos sob registro)'
  ground_truth: 'A **ANVISA (Agência Nacional de Vigilância Sanitária)** é uma autarquia especial federal vinculada ao Ministério da Saúde, criada pela **Lei 9.782/1999** (transformou a antiga Secretaria de Vigilância Sanitária em agência reguladora). **ESCOPO REGULATÓRIO** abrange — (1) **MEDICAMENTOS**: registro, controle, fiscalização, farmacovigilância, autorização para ensaios clínicos, regulamentação de fármacos e produtos farmacêuticos; (2) **ALIMENTOS**: alimentos para fins especiais, suplementos alimentares, novos alimentos / novos ingredientes, rotulagem nutricional (RDC 429/2020 e RDC 75/2020), aditivos, contaminantes; competência compartilhada com MAPA para alimentos in natura de origem animal e vegetal; (3) **PRODUTOS PARA A SAÚDE**: equipamentos médicos, materiais de uso médico, kits de diagnóstico in vitro; (4) **COSMÉTICOS, PERFUMES, PRODUTOS DE HIGIENE PESSOAL**; (5) **SANEANTES** (desinfetantes, alvejantes, etc.); (6) **DERIVADOS DO TABACO** (fiscalização de propaganda, embalagem, ingredientes); (7) **AGROTÓXICOS** (em conjunto com IBAMA, MAPA); (8) **SERVIÇOS DE SAÚDE**: vigilância sanitária em hospitais, clínicas, laboratórios; (9) **PORTOS, AEROPORTOS E FRONTEIRAS**: fiscalização sanitária. **REGISTROS** de medicamentos têm validade de **5 anos** e devem ser **revalidados** com apresentação de relatórios de farmacovigilância e demais documentação (Lei 6.360/1976 e regulamentação RDC). A ANVISA é financiada por taxas e dotação orçamentária, com diretoria colegiada e processo regulatório com consultas públicas. Verificar atos atuais em **gov.br/anvisa**.'
  graceful_unknown: A "ANVISA = autarquia federal (não privada); regula medicamentos + alimentos processados + cosméticos + saneantes + agrotóxicos + serviços de saúde + portos/aeroportos; registro 5 anos com renovação" é o ponto central. Detalhes regulatórios mudam com novas RDCs; gov.br/anvisa é a fonte canônica.
