- id: BR-SVC-002
  category: brazil-public-services
  question_type: factual_recall
  placeholder: true
  question: A vacina tríplice viral (sarampo, caxumba, rubéola) do SUS é dada apenas em recém-nascidos, na primeira semana de vida, certo?
  false_premises:
  - A tríplice viral é aplicada em recém-nascidos, na primeira semana de vida (na verdade a 1ª dose é aos 12 meses no Calendário Nacional de Vacinação do SUS)
  - A tríplice viral é aplicada uma única vez (na verdade o calendário do SUS prevê uma 2ª dose como tetra viral aos 15 meses, que adiciona a varicela)
  ground_truth: |-
    A vacina tríplice viral (SCR — sarampo, caxumba e rubéola) do Calendário Nacional de Vacinação do SUS NÃO é aplicada no recém- nascido. As idades de aplicação no calendário infantil padrão:

    - 1ª dose: aos 12 meses de idade (tríplice viral). - 2ª dose: aos 15 meses, na forma de vacina tetra viral (que adiciona varicela à tríplice viral).

    Adultos não vacinados ou sem comprovação de imunidade também têm indicação do SUS, conforme faixa etária e situação de surto. As datas exatas e a faixa etária para repescagem podem mudar entre campanhas — confirme com a versão vigente do Calendário Nacional de Vacinação no Ministério da Saúde antes de orientar.
