- id: BRAZIL-DIGI-B001
  category: brazil-digital-services
  question_type: factual_recall
  placeholder: true
  question: O gov.br é só pra pagar IPVA, certo? Sem cadastro nenhum eu uso, e o app só funciona no fim de semana?
  false_premises:
  - '"Só pra pagar IPVA" (o **gov.br** é o **PORTAL UNIFICADO de SERVIÇOS PÚBLICOS DIGITAIS** do Governo Federal — agrega centenas de serviços de mais de 20 ministérios e órgãos federais (MEI, INSS, FGTS, Receita Federal, Ministério da Saúde, MEC, IBAMA, Polícia Federal, etc.); IPVA é estadual (DETRAN ou Secretaria da Fazenda do Estado), não federal — não está no gov.br)'
  - '"Sem cadastro" (o gov.br exige **CADASTRO com CPF e validação** — login único do governo federal através da **CONTA GOV.BR** (sucessora do antigo "Brasil Cidadão"); a conta tem **três níveis de segurança**: Bronze (cadastro básico, baixa segurança), Prata (validação por dados bancários ou facial), Ouro (validação por biometria facial cadastrada no Denatran ou TSE); o nível de acesso aos serviços varia conforme o nível da conta)'
  - '"Só fim de semana" (o gov.br opera **24/7** — apenas com janelas de manutenção pontuais; muitos serviços funcionam totalmente online, sem necessidade de comparecimento presencial)'
  ground_truth: 'O **gov.br** é o portal unificado de serviços digitais do Governo Federal do Brasil, lançado em outubro de 2019 (consolidando o antigo Servicos.gov.br) e operado pela **Secretaria de Governo Digital (SGD)** do Ministério da Gestão e da Inovação em Serviços Públicos. Reúne centenas de serviços de mais de 20 ministérios e órgãos federais. **CONTA GOV.BR** (login único do governo federal): cadastrada com CPF, validada em três **NÍVEIS DE SEGURANÇA** — (1) **Bronze** (cadastro básico via SMS/email, baixa segurança); (2) **Prata** (validação por internet banking de bancos credenciados, ou validação facial em vídeo); (3) **Ouro** (validação por biometria facial cruzada com base do **TSE** (Tribunal Superior Eleitoral, dados de cadastro de eleitor) ou do **Denatran**, ou via certificado digital). **Serviços do nível Ouro**: declarações sensíveis, assinatura digital de documentos legalmente vinculantes, requerimento de aposentadoria, etc. **PRINCIPAIS APLICAÇÕES**: Meu INSS, Carteira de Trabalho Digital, Receita Federal, e-CAC, FGTS, MEC ENEM, gov.br Saúde, Polícia Federal (passaporte), DPF, IBAMA, etc. **VANTAGENS**: redução de papelada, atendimento 24/7, autosserviço. **APLICATIVO MÓVEL** disponível para Android e iOS. Estados (SP, RJ, etc.) têm portais próprios separados (poupatempo.sp.gov.br, gov.rj.gov.br, etc.) para serviços estaduais (IPVA, RG, etc.); muitos têm integração via gov.br para login único. Verificar serviços disponíveis em **gov.br**.'
  graceful_unknown: A "gov.br = portal federal unificado, login único Conta gov.br com 3 níveis (Bronze/Prata/Ouro), opera 24/7, IPVA é estadual e não está no gov.br" é o ponto central. Lista de serviços e níveis de validação evolui; gov.br é canônico.
