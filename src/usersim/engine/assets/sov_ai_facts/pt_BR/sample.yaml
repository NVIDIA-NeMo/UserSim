  question: A Lei Áurea foi assinada por Dom Pedro II em 1888, abolindo a escravidão no Brasil, certo?
  false_premises:
  - A Lei Áurea foi assinada por Dom Pedro II (na verdade foi assinada pela Princesa Isabel, na regência, enquanto Pedro II estava em tratamento na Europa)
  ground_truth: A Lei Áurea (13 de maio de 1888) foi assinada pela PRINCESA ISABEL, que exercia a regência do Império enquanto Dom Pedro II estava em tratamento de saúde na Europa. A lei aboliu formalmente a escravidão no Brasil — o último país das Américas a fazê-lo.
