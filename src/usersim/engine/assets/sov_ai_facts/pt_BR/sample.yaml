- id: BRAZIL-EDUC-B006
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: A pós-graduação no Brasil é regulada pelo MEC direto, certo? Mestrado e doutorado têm a mesma duração e os mesmos requisitos, e a Capes só dá bolsas para estrangeiros?
  false_premises:
  - '"MEC regula direto" (a pós-graduação **stricto sensu** (mestrado e doutorado) é regulada pela **CAPES (Coordenação de Aperfeiçoamento de Pessoal de Nível Superior)**, fundação vinculada ao MEC, mas com atribuições específicas; a CAPES avalia, credencia e fomenta os programas; o **CNE (Conselho Nacional de Educação)** estabelece diretrizes e a homologação do credenciamento é feita pelo MEC, mas a operação prática é da CAPES)'
  - '"Mestrado e doutorado mesma duração e requisitos" (são níveis DIFERENTES: **MESTRADO** dura tipicamente **24 meses (2 anos)**, exige defesa de **DISSERTAÇÃO**, contribuição original mas com escopo mais limitado; **DOUTORADO** dura tipicamente **48 meses (4 anos)**, exige defesa de **TESE**, contribuição original mais aprofundada e, em geral, publicações; o **MESTRADO PROFISSIONAL** é uma terceira modalidade, voltada para aplicação em prática profissional)'
  - '"Capes só dá bolsas para estrangeiros" (a CAPES dá **BOLSAS DE MESTRADO E DOUTORADO** para **brasileiros e estrangeiros**, em programas no Brasil e no exterior; existem também outras agências que financiam pós-graduação — **CNPq** (Conselho Nacional de Desenvolvimento Científico e Tecnológico), **FAPESP** (em SP), **FAPERJ** (no RJ), e outras FAPs estaduais; a CAPES NÃO restringe bolsas a estrangeiros)'
  ground_truth: 'A **PÓS-GRADUAÇÃO STRICTO SENSU** no Brasil (mestrado, doutorado, pós-doutorado) é regulada pela **CAPES (Coordenação de Aperfeiçoamento de Pessoal de Nível Superior)**, fundação pública vinculada ao **MEC**, criada em 1951. A CAPES — (1) **AVALIA E CREDENCIA** programas de pós-graduação a cada quadriênio (Avaliação Quadrienal), com notas de 1 a 7; cursos com nota inferior a 3 são descredenciados; notas 6-7 são para programas de excelência internacional; (2) **CONCEDE BOLSAS** de mestrado, doutorado, doutorado-sanduíche, pós-doutorado, em parceria com instituições e governos estrangeiros; (3) **FOMENTA INTERCÂMBIO** com universidades estrangeiras (PrInt, PDSE, etc.); (4) **EDITA DIRETRIZES** para a formação de mestres e doutores. **MESTRADO ACADÊMICO**: ~24 meses, dissertação, foco em pesquisa. **MESTRADO PROFISSIONAL**: ~24 meses, com produto técnico-tecnológico (não dissertação convencional); voltado para aplicação prática. **DOUTORADO**: ~48 meses, tese com contribuição original, geralmente publicações em periódicos qualificados pelo Qualis CAPES. **PÓS-DOUTORADO**: período de pesquisa após doutorado, sem grau adicional. **CNPq** (vinculado ao MCTI) também concede bolsas de pesquisa, produtividade, iniciação científica, e financia projetos. **FAPs estaduais** (FAPESP, FAPERJ, FAPEMIG, FAPESPA, etc.) complementam o fomento estadual. Verificar regulamentação em **gov.br/capes**, **cnpq.br**.'
  graceful_unknown: A "CAPES (vinculada ao MEC) regula pós-graduação stricto sensu; mestrado ~2 anos, doutorado ~4 anos; bolsas para brasileiros e estrangeiros; CNPq + FAPs estaduais complementam fomento" é o ponto central. Detalhes de avaliação e bolsas mudam por edital; gov.br/capes é canônico.
