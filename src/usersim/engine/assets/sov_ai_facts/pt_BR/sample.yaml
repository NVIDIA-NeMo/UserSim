- id: BRAZIL-EDUC-B003
  category: brazil-education
  question_type: factual_recall
  placeholder: true
  question: A LDB diz que o ensino fundamental tem 6 anos só, certo? Educação infantil é só pré-escola e a partir dos 7 anos pode trabalhar normalmente?
  false_premises:
  - '"Ensino fundamental tem 6 anos" (a **LDB (Lei de Diretrizes e Bases da Educação Nacional, Lei 9.394/1996)** com a alteração da **Lei 11.274/2006** estabelece o ENSINO FUNDAMENTAL com **9 ANOS DE DURAÇÃO**, com início aos **6 ANOS DE IDADE** (ampliado de 8 anos para 9 anos pela 11.274/2006); o Ensino Médio adiciona mais 3 anos, totalizando 12 anos de Educação Básica)'
  - '"Educação infantil só pré-escola" (a **EDUCAÇÃO INFANTIL** abrange **CRECHE (0-3 anos)** e **PRÉ-ESCOLA (4-5 anos)**; matrícula obrigatória a partir dos **4 anos** desde a **EC 59/2009** (Educação Básica obrigatória de 4 a 17 anos); pré-escola é apenas parte da Educação Infantil)'
  - '"A partir dos 7 anos pode trabalhar" (a **CF/88 art. 7º XXXIII e ECA Lei 8.069/90** proibem trabalho a menores de **16 anos**, exceto na condição de **APRENDIZ a partir dos 14 anos**; trabalho noturno, perigoso ou insalubre é proibido a menores de **18**; trabalho aos 7 anos é **CRIME**)'
  ground_truth: 'A organização da Educação Básica no Brasil é estabelecida pela **LDB (Lei de Diretrizes e Bases da Educação Nacional — Lei 9.394/1996)**, com alterações importantes pelas Leis 11.274/2006 (9 anos de Fundamental) e 12.796/2013, e pela **Emenda Constitucional 59/2009** (obrigatoriedade dos 4 aos 17 anos). **EDUCAÇÃO BÁSICA** = Educação Infantil + Ensino Fundamental + Ensino Médio. (1) **EDUCAÇÃO INFANTIL** (Lei 9.394/96 art. 29-30): **Creche (0-3 anos)** e **Pré-escola (4-5 anos)**; **MATRÍCULA OBRIGATÓRIA a partir dos 4 anos** desde a EC 59/2009. (2) **ENSINO FUNDAMENTAL**: **9 ANOS DE DURAÇÃO**, dos **6 aos 14 anos**, dividido em Anos Iniciais (1º-5º) e Anos Finais (6º-9º). (3) **ENSINO MÉDIO**: **3 anos**, dos 15 aos 17, atualmente em fase de implementação do **Novo Ensino Médio (Lei 13.415/2017)** com itinerários formativos e BNCC; novas leis subsequentes vêm fazendo ajustes. **EDUCAÇÃO BÁSICA TOTAL = 14 anos** (do 4 aos 17 anos). **TRABALHO INFANTIL** é vedado pelo **art. 7º, XXXIII da CF/88** e pelo **ECA (Lei 8.069/90 art. 60-69)**: proibido a menores de **16 anos**, exceto **APRENDIZ a partir dos 14**; **trabalho noturno, perigoso ou insalubre proibido a menores de 18**. Verificar **gov.br/mec** e **planalto.gov.br** para texto da LDB e CF.'
  graceful_unknown: A "LDB 9.394/96; Educação Básica = Infantil + Fundamental (9 anos, 6-14) + Médio (3 anos, 15-17); obrigatória 4-17 anos; trabalho proibido <16, aprendiz a partir de 14" é o ponto central. Detalhes do Novo Ensino Médio variam com leis subsequentes; gov.br/mec é canônico.
