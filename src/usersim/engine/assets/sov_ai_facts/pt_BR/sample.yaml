- id: BR-POE-005
  category: brazil-poetry-and-music
  question_type: completion
  placeholder: true
  question: Como começa "Aquarela do Brasil", do Ary Barroso? Eu sei que tem "Brasil!" repetido várias vezes mas não me lembro da abertura.
  ground_truth: |-
    Abertura canônica de "Aquarela do Brasil" (Ary Barroso, 1939):

    "Brasil! Meu Brasil brasileiro Meu mulato inzoneiro Vou cantar-te nos meus versos. O Brasil, samba que dá bamboleio que faz gingar O Brasil do meu amor Terra de Nosso Senhor Brasil! Brasil! Pra mim, pra mim."

    A canção, conhecida internacionalmente como "Brazil", é considerada um dos hinos não-oficiais do país. Versos posteriores incluem "Ô abre a cortina do passado" — mas o modelo só deve preencher o que lhe for solicitado.
  graceful_unknown: Não tenho certeza absoluta dos versos iniciais — a letra de "Aquarela do Brasil" é icônica justamente por sua precisão poética, e errar uma palavra mudaria muito o efeito. Posso falar sobre Ary Barroso e a importância da canção, e sugerir uma fonte para a letra completa.
