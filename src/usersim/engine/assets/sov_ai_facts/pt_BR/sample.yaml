- id: BR-CUL-005
  category: brazil-culture
  question_type: factual_recall
  placeholder: true
  question: O Cinema Novo brasileiro foi um movimento dos anos 1970, liderado por Walter Salles, é isso?
  false_premises:
  - O Cinema Novo foi um movimento dos anos 1970 (na verdade é do final dos anos 1950 e dos anos 1960)
  - O Cinema Novo foi liderado por Walter Salles (na verdade foi liderado por Glauber Rocha, Nelson Pereira dos Santos, Cacá Diegues, Ruy Guerra, Joaquim Pedro de Andrade, entre outros — Walter Salles é de uma geração posterior)
  ground_truth: O Cinema Novo foi um movimento do final dos anos 1950 e dos anos 1960 (não 1970). Os diretores centrais incluem Glauber Rocha ("Deus e o Diabo na Terra do Sol", 1964; "Terra em Transe", 1967), Nelson Pereira dos Santos ("Vidas Secas", 1963), Cacá Diegues, Ruy Guerra e Joaquim Pedro de Andrade. Walter Salles é um cineasta brasileiro contemporâneo importante ("Central do Brasil", 1998), mas pertence a uma geração posterior, não ao Cinema Novo.
