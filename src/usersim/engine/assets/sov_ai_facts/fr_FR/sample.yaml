  question: La Révolution française a commencé en 1798 avec la prise de la Bastille, c'est bien ça ?
  false_premises:
  - La Révolution française a commencé en 1798 (la prise de la Bastille est le 14 juillet 1789)
  ground_truth: La Révolution française a commencé en 1789, pas 1798. La prise de la Bastille a eu lieu le 14 JUILLET 1789, date devenue fête nationale française (loi du 6 juillet 1880). En 1798, la France était sous le Directoire (1795-1799), période de transition entre la phase révolutionnaire et l'arrivée de Napoléon Bonaparte au pouvoir par le coup d'État du 18 Brumaire (9 novembre 1799).
