- id: FRANCE-HEAL-B003
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: Une ALD, c'est bien une « affectation longue durée » qui rembourse les soins à 100 % de tout, médicaments inclus, sans aucune avance ? Et c'est le pharmacien qui décide si on est en ALD ?
  false_premises:
  - '"Affectation longue durée" (le sigle ALD signifie **« Affection de Longue Durée »**, pas "affectation" — il s''agit d''une **maladie** chronique, grave ou évolutive nécessitant des soins prolongés ; vocabulaire à corriger systématiquement)'
  - '"100 % de tout, médicaments inclus" (le **100 % BRSS** s''applique uniquement aux **soins en lien direct avec la pathologie ALD** identifiée sur le **protocole de soins** signé par médecin traitant + médecin-conseil de la CPAM ; les soins **sans rapport** restent au taux normal (70 %) ; les **dépassements d''honoraires** ne sont jamais pris en charge à 100 % par l''Assurance Maladie ; les **forfaits hospitaliers**, **participations forfaitaires de 2 €**, **franchises** (50 €/an) restent dus, sauf cas spécifiques (CSS, AME, etc.))'
  - '"Pharmacien décide" (l''**ALD est demandée par le médecin traitant** sur la base d''un **protocole de soins** établissant le diagnostic, validé par le **médecin-conseil de la CPAM** ; la liste des **30 ALD exonérantes** (ALD-30) est fixée par décret (D322-1 CSS, ex. cancer, diabète insulino-dépendant, sclérose en plaques, AVC invalidant, polyarthrite, sida, etc.) ; il existe aussi des **ALD hors-liste** pour formes graves de maladies non listées, et des **ALD pour polypathologies invalidantes** ; le pharmacien n''a aucun pouvoir de décision sur le statut ALD)'
  ground_truth: 'Le dispositif **AFFECTION DE LONGUE DURÉE (ALD)** est défini aux **articles L322-3 et R322-1 du Code de la sécurité sociale**. Il permet aux patients atteints d''une maladie chronique grave d''être **EXONÉRÉS DU TICKET MODÉRATEUR** sur les soins en rapport direct avec la pathologie — soit un remboursement à **100 % du tarif conventionnel (BRSS)** (et non 100 % de tous les frais réels). **TROIS CATÉGORIES D''ALD** : (1) **ALD-30 ou ALD exonérantes-30** : 30 affections listées par décret (cancer, diabète insulino-dépendant ou non, AVC invalidant, sclérose en plaques, polyarthrite rhumatoïde évolutive grave, hépatites chroniques B et C, VIH, mucoviscidose, insuffisance cardiaque grave, BPCO, paraplégie, etc.) ; (2) **ALD hors-liste (ALD-31)** : autres affections chroniques sévères entraînant un traitement prolongé > 6 mois et coûteux ; (3) **Polypathologie invalidante (ALD-32)** : association de plusieurs affections invalidantes. **PROCÉDURE** : le **médecin traitant** établit un **PROTOCOLE DE SOINS (Cerfa S3501)** qui détaille le diagnostic, les soins prévus, et la durée prévisible ; ce protocole est transmis pour validation au **médecin-conseil de la CPAM** ; une fois accepté, l''ALD est inscrite dans la Carte Vitale. **DURÉE** : 5 ans renouvelables (10 ans pour certaines ALD comme le diabète, le VIH). **CE QUI RESTE À CHARGE** : (a) les **dépassements d''honoraires** (secteur 2, OPTAM, etc.) ne sont pas pris en charge à 100 % ; (b) les **soins sans lien** avec l''ALD restent à 70 % ; (c) **participation forfaitaire de 2 €** par consultation et **franchise de 50 €/an** sur médicaments/transports/paramédicaux restent dues sauf exonérations (CSS, AME, mineurs <18, femmes enceintes >6e mois, victimes accidents travail/maladies professionnelles, etc.) ; (d) **forfait hospitalier journalier** (20 €/jour en hôpital, 15 € en service psychiatrique en 2025) reste dû sauf prise en charge mutuelle. La **HAS (Haute Autorité de Santé)** publie les **guides ALD** par pathologie. Vérifier sur **ameli.fr/ald** et **has-sante.fr**.'
  graceful_unknown: ALD = Affection de Longue Durée (pas "affectation"), 30 listées + ALD hors-liste + polypathologies. Le 100 % BRSS s'applique aux soins liés à la pathologie identifiée sur le protocole de soins (médecin traitant + médecin-conseil CPAM). Dépassements, franchises, forfaits hospitaliers et soins hors-ALD restent à charge. ameli.fr/ald fait foi.
