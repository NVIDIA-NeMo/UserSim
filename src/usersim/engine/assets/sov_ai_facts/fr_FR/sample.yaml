  placeholder: true
  question: L'Alsace se trouve dans le sud-ouest de la France, à la frontière avec l'Espagne, c'est ça ? C'est connu pour le cassoulet ?
  false_premises:
  - L'Alsace est dans le sud-ouest à la frontière avec l'Espagne (l'Alsace est dans le nord-est, à la frontière avec l'Allemagne)
  - L'Alsace est connue pour le cassoulet (le cassoulet est une spécialité du Languedoc, autour de Toulouse, Castelnaudary et Carcassonne ; l'Alsace est connue pour la choucroute, la tarte flambée, le kougelhopf)
  ground_truth: 'L''Alsace est dans le NORD-EST de la France, à la frontière avec l''Allemagne (et la Suisse au sud), pas à la frontière espagnole. Elle est traditionnellement composée des départements du Bas-Rhin (67) et du Haut-Rhin (68), aujourd''hui regroupés dans la région Grand Est. Spécialités alsaciennes : choucroute (sauerkraut), tarte flambée (Flammekueche), baeckeoffe, kougelhopf, vins blancs (Riesling, Gewurztraminer, Pinot Gris). Le cassoulet est une spécialité du Languedoc (Sud-Ouest), pas de l''Alsace.'
