- id: FRANCE-LABO-B004
  category: france-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Pôle emploi existe toujours, non ? Et les chômeurs touchent 100 % de leur ancien salaire pendant 3 ans automatiquement, sans démarche ?
  false_premises:
  - '"Pôle emploi existe toujours" (depuis le **1er janvier 2024** (loi du 18 décembre 2023 dite **« France Travail »**), Pôle emploi est officiellement renommé **« FRANCE TRAVAIL »** ; ce changement est plus qu''un rebranding — il intègre Pôle emploi avec les **missions locales**, **Cap emploi** (handicap), et coordonne avec les départements pour le **RSA** ; objectif : guichet unique pour tous les demandeurs d''emploi)'
  - '"100 % de leur ancien salaire" (l''**ARE (Allocation d''aide au Retour à l''Emploi)** versée par France Travail (UNEDIC) varie : (a) **57 % à 75 % du salaire journalier de référence (SJR)** selon la formule de calcul ; le calcul retient en général le maximum entre **40,4 % du SJR + 13,11 € ($/jour, 2024)** et **57 % du SJR** ; les **CADRES À HAUT REVENU** ont une **dégressivité** depuis 2019 (réduction de 30 % au 7e mois) ; il y a aussi un **plafond mensuel** ; donc loin de 100 %)'
  - '"3 ans automatiquement, sans démarche" (la **DURÉE D''INDEMNISATION** dépend de l''âge et de la durée travaillée, et n''est pas automatique : il faut **S''INSCRIRE comme demandeur d''emploi**, fournir des justificatifs (attestation employeur), **ACTUALISER** mensuellement sa situation, et **RECHERCHER ACTIVEMENT** un emploi (PPAE — Projet Personnalisé d''Accès à l''Emploi). Durées maximales en 2024 (réformes 2019/2023) : **18 mois** pour < 53 ans (avec ajustement à la conjoncture économique : -25 % depuis 2023 si chômage < 9 %, donc 18 mois deviennent 13,5) ; **22,5 mois** pour 53-54 ans ; **27 mois** pour ≥ 55 ans)'
  ground_truth: 'Le système d''assurance chômage en France est géré par l''**UNEDIC** (organisme paritaire syndicats-employeurs) et opérationnalisé par **FRANCE TRAVAIL** (ex-Pôle emploi depuis le 1er janvier 2024 — Loi du 18 décembre 2023). L''indemnisation est conditionnelle et limitée. **CONDITIONS D''ACCÈS À L''ARE** (Allocation d''aide au Retour à l''Emploi) : (a) **involontaire** privation d''emploi (licenciement non pour faute grave/lourde, fin de CDD, rupture conventionnelle individuelle, démission légitime — ex. déménagement pour suivi conjoint, formation professionnelle après projet validé "démission-reconversion", etc.) ; (b) avoir travaillé **au moins 6 mois (130 jours ou 910h)** dans les 24 derniers mois (réforme 2019, post-2023 contracyclicité) ; (c) être **inscrit comme demandeur d''emploi** ; (d) avoir un **PPAE** (Projet Personnalisé d''Accès à l''Emploi) ; (e) **rechercher activement** un emploi ; (f) ne pas avoir atteint l''âge légal de la retraite. **MONTANT** : **57 % à 75 % du SJR (Salaire Journalier de Référence)** ; calcul = max(40,4 % SJR + 13,11 €/jour ; 57 % SJR) (montants 2024) ; plafond mensuel ~7 000 € brut. **DURÉE** : (a) **18 mois** pour < 53 ans ; (b) **22,5 mois** pour 53-54 ans ; (c) **27 mois** pour ≥ 55 ans. **CONTRACYCLICITÉ** depuis 2023 : ces durées sont **RÉDUITES DE 25 %** quand le chômage national est < 9 % (situation 2024-2025), donc **13,5 mois / 16,9 / 20,2** dans la pratique récente. **DÉGRESSIVITÉ** pour les hauts revenus (cadres > ~4 800 €/mois) : -30 % au 7e mois. **AUTRES PRESTATIONS** : (a) **ASS** (Allocation de Solidarité Spécifique) : pour chômeurs en fin de droits, sous conditions ; (b) **RSA** (Revenu de Solidarité Active, géré par les départements et France Travail) : minimum social pour personnes sans ressources ; (c) **AAH**, **prime d''activité**, **APL**, etc. **OBLIGATIONS DU CHÔMEUR** : actualisation mensuelle obligatoire ; entretiens avec conseiller France Travail ; recherche active sous peine de **radiation** (suspension de l''ARE pour 1, 2, 4, 6 ou 12 mois selon la nature du manquement). Vérifier sur **francetravail.fr** et **unedic.org**.'
  graceful_unknown: Pôle emploi → France Travail depuis 1/1/2024 (loi 18/12/2023). ARE = 57-75 % du SJR (salaire journalier de référence), durée 18-27 mois selon âge, réduite de 25 % depuis 2023 si chômage < 9 %. Conditions strictes (6 mois travaillés en 24, inscription, PPAE, recherche active, actualisation). francetravail.fr fait foi.
