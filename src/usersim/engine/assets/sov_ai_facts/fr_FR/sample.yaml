- id: FRANCE-FINA-B006
  category: france-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Le délai de rétractation après un achat en ligne, c'est 7 jours, comme partout en Europe ? Et ça marche même pour les vols d'avion et les hôtels ? Et il faut payer les frais de retour ?
  false_premises:
  - '"7 jours" (le **DÉLAI DE RÉTRACTATION** pour les achats en ligne (vente à distance) est de **14 JOURS** depuis la **directive 2011/83/UE** transposée par la **loi Hamon du 17 mars 2014** (art. L221-18 du Code de la consommation) ; depuis 2014, le délai est passé de 7 à **14 JOURS** uniformément dans l''Union européenne)'
  - '"Même pour vols et hôtels" (de **NOMBREUSES EXCEPTIONS** sont prévues à l''art. L221-28 du Code de la consommation : (a) **billets de transport** (vols, trains, bus à date/horaire fixe) — **PAS DE RÉTRACTATION** ; (b) **hôtels et hébergements** à date fixe — pas de rétractation ; (c) services exécutés intégralement avant fin du délai ; (d) biens personnalisés ou périssables ; (e) journaux/magazines ; (f) jeux et loteries ; (g) contrats conclus aux enchères publiques ; (h) produits scellés non retournables après ouverture (hygiène, etc.) ; (i) services financiers ; (j) immobilier ; (k) certains contrats énergie ; etc.)'
  - '"Frais de retour à payer" (par défaut, le **CONSOMMATEUR PAIE LES FRAIS DE RETOUR**, **SAUF** : (a) si le **professionnel ne l''a pas informé clairement** de cette obligation avant l''achat (auquel cas frais à la charge du professionnel) ; (b) si le professionnel **propose lui-même un système gratuit** ; (c) en cas de **non-conformité ou défaut** du produit (le coût est sur le professionnel) ; le consommateur dispose de **14 JOURS** pour renvoyer après notification de la rétractation, et le professionnel doit **REMBOURSER sous 14 jours** (peut retenir le remboursement jusqu''à réception du produit retourné))'
  ground_truth: 'Le **DROIT DE RÉTRACTATION** dans la **VENTE À DISTANCE** (e-commerce, télévente, démarchage à domicile depuis 2014) est régi par les **arts. L221-18 et suivants du Code de la consommation**, transposant la **directive européenne 2011/83/UE relative aux droits des consommateurs**. Mis en place en France par la **loi Hamon du 17 mars 2014** (entrée en vigueur le **13 juin 2014**). **DÉLAI DE 14 JOURS** : le consommateur dispose de **14 JOURS CALENDAIRES** à compter de : (a) la **réception du bien** (vente de biens) ; (b) la **conclusion du contrat** (vente de services) ; pour exercer son droit de rétractation **SANS MOTIF** ni pénalité. **EXTENSION SI INFO MANQUANTE** : si le professionnel n''a pas correctement informé le consommateur de son droit de rétractation, le délai est étendu de **12 mois** supplémentaires (jusqu''à 12 mois + 14 jours de la date de connaissance du droit). **EXCEPTIONS** (art. L221-28) : pas de droit de rétractation pour (a) contrats de service exécutés en totalité avant la fin du délai (avec accord exprès consommateur) ; (b) **biens et services dont le prix dépend des fluctuations sur le marché financier** ; (c) biens **personnalisés** ou **confectionnés** sur mesure ; (d) biens **périssables** ; (e) biens **scellés** ne pouvant être renvoyés pour raisons d''hygiène ou de protection de la santé une fois descellés ; (f) journaux/magazines hors abonnement ; (g) jeux et paris ; (h) contrats conclus à l''occasion d''**enchères publiques** ; (i) **HÉBERGEMENTS, transport, location de voitures, restauration, loisirs** à date ou période d''exécution déterminée ; (j) **télévision/radio à la demande, fichiers numériques** une fois le contenu téléchargé ; (k) services financiers (régime distinct, art. L222-1) ; (l) immobilier. **MODALITÉS** : le consommateur informe le professionnel de sa décision (par lettre ou formulaire type) ; renvoi du bien dans les **14 jours** suivant la communication ; **FRAIS DE RETOUR à la charge du consommateur** par défaut (sauf si le professionnel a omis de l''informer ou a accepté de les prendre à sa charge) ; **REMBOURSEMENT** par le professionnel **sous 14 jours** maximum, par le même moyen de paiement (sauf accord du consommateur) ; possibilité de retenir le remboursement jusqu''à récupération du bien. **DROIT DE RÉTRACTATION 30 JOURS** dans certains cas spécifiques : démarchage à domicile dans secteurs réglementés (énergie, etc.). **JURIDICTION** : DGCCRF, signal-conso.gouv.fr, médiateur de la consommation, juridiction civile (Tribunal judiciaire). Vérifier sur **service-public.fr** et **economie.gouv.fr** (rubrique consommation).'
  graceful_unknown: Délai de rétractation = 14 jours calendaires (loi Hamon 2014, directive 2011/83/UE) à compter de la réception (biens) ou de la conclusion (services). Exceptions nombreuses — billets transport date fixe, hôtels date fixe, biens personnalisés, périssables, hygiène, services exécutés. Frais de retour à charge du consommateur sauf info manquante. Remboursement professionnel < 14 jours. service-public.fr fait foi.
