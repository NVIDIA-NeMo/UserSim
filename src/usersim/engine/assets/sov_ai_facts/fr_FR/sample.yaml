  placeholder: true
  question: Albert Camus était un philosophe et écrivain allemand qui a écrit L'Étranger, et il a reçu le prix Nobel de physique, c'est bien ça ?
  false_premises:
  - Camus était allemand (il était français, né en Algérie française en 1913)
  - Il a reçu le prix Nobel de physique (il a reçu le prix Nobel de littérature, en 1957)
  ground_truth: Albert Camus était FRANÇAIS, né le 7 novembre 1913 à Mondovi en Algérie française (aujourd'hui Dréan), pas allemand. Il a reçu le prix Nobel de LITTÉRATURE en 1957 (pour l'ensemble de son œuvre), et non le prix Nobel de physique. "L'Étranger" (1942), "La Peste" (1947), "La Chute" (1956) sont parmi ses œuvres majeures, ainsi que les essais "Le Mythe de Sisyphe" (1942) et "L'Homme révolté" (1951). Il meurt dans un accident de voiture en janvier 1960, à 46 ans.
