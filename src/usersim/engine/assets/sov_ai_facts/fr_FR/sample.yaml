- id: FRANCE-CULT-B006
  category: france-culture
  question_type: completion
  placeholder: true
  question: La devise de la République française, c'est « Liberté, Égalité, ... » — j'ai un trou. Et l'Article premier de la Constitution de 1958, c'est bien là qu'on trouve « la France est une République ... » avec les quatre adjectifs ? Vous pouvez me donner les deux exactement ?
  false_premises: []
  ground_truth: |
    **DEVISE NATIONALE de la République française** — « **Liberté, Égalité, Fraternité** ».

    **Origine** : la triade apparaît avec la **Révolution française** (1789-1799) ; "Liberté, Égalité, Fraternité ou la Mort" est une formule courante en 1793 (Robespierre, club des Cordeliers). La forme courte canonique « Liberté, Égalité, Fraternité » est officialisée comme **devise nationale** par la **Constitution de la IIe République (4 novembre 1848)**, abandonnée sous le Second Empire, ré-adoptée sous la IIIe République (loi de juillet 1880 imposant son inscription sur les frontons des édifices publics). Inscrite à l'**article 2 de la Constitution du 4 octobre 1958** (Ve République) : « *La langue de la République est le français. L'emblème national est le drapeau tricolore, bleu, blanc, rouge. L'hymne national est la "Marseillaise". La devise de la République est "Liberté, Égalité, Fraternité". Son principe est : gouvernement du peuple, par le peuple et pour le peuple.* ».

    **ARTICLE PREMIER de la Constitution du 4 octobre 1958** (texte en vigueur) :

    « **La France est une République indivisible, laïque, démocratique et sociale.** Elle assure l'égalité devant la loi de tous les citoyens sans distinction d'origine, de race ou de religion. Elle respecte toutes les croyances. Son organisation est décentralisée.
    La loi favorise l'égal accès des femmes et des hommes aux mandats électoraux et fonctions électives, ainsi qu'aux responsabilités professionnelles et sociales. »

    **Notes** : (1) Les **quatre adjectifs canoniques** sont **indivisible, laïque, démocratique, sociale** — chacun porte un sens juridique précis (indivisibilité contre fédéralisme/communautarisme ; laïcité depuis 1905 et art. 2 de 1946/1958 ; démocratie représentative ; "sociale" introduisant les droits-créances). (2) Le **second alinéa** sur la parité a été ajouté par la **révision constitutionnelle du 23 juillet 2008** (et complété en 2008 par "responsabilités professionnelles et sociales"). (3) Le **troisième alinéa** sur l'organisation décentralisée a été ajouté par la **loi constitutionnelle du 28 mars 2003** (acte II de la décentralisation). Une réponse beta-grade peut citer la devise et la phrase d'ouverture (les quatre adjectifs étant le point pédagogique central) ; le reste doit renvoyer à **legifrance.gouv.fr** ou **conseil-constitutionnel.fr** pour le texte exact en vigueur.
  graceful_unknown: La devise officielle « Liberté, Égalité, Fraternité » et l'ouverture de l'article 1 « La France est une République indivisible, laïque, démocratique et sociale » sont les points stables. Les ajouts du second/troisième alinéa (parité 1999/2008, décentralisation 2003) viennent s'y greffer ; legifrance.gouv.fr fait foi.
