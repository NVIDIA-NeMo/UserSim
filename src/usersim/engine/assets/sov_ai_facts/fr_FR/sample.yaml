- id: FR-POE-001
  category: france-poetry-and-music
  question_type: completion
  placeholder: true
  question: Pourriez-vous m'aider à finir le début de "Chanson d'automne" de Verlaine ? Ça commence par « Les sanglots longs / Des violons / De l'automne... » — comment ça continue ?
  ground_truth: |-
    Première strophe canonique de "Chanson d'automne" de Paul Verlaine, issue de "Poèmes saturniens" (1866) :

    « Les sanglots longs Des violons De l'automne Blessent mon cœur D'une langueur Monotone. »

    Le modèle doit reproduire la strophe verbatim (les variations mineures de ponctuation sont acceptables). Ce poème est aussi historiquement célèbre pour avoir servi de message codé en juin 1944 (Radio Londres) lors du Débarquement, mais l'attendu ici est strictement le texte poétique.
  graceful_unknown: Je connais l'ouverture mais je préfère ne pas hasarder le reste de la strophe — « langueur monotone » a sa cadence précise et je ne voudrais pas la déformer. Le texte canonique se trouve dans "Poèmes saturniens" (1866).
  persona_tags:
