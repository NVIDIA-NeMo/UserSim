- id: FRANCE-DIGI-B005
  category: france-digital-services
  question_type: factual_recall
  placeholder: true
  question: Le CPF (Compte Personnel de Formation), c'est gratuit pour tout le monde sans rien faire ? On peut l'utiliser pour acheter un ordinateur ou s'offrir un voyage culturel ? Et il est valable seulement en France ?
  false_premises:
  - '"Gratuit, sans rien faire" (le **CPF (Compte Personnel de Formation)** est **CRÉDITÉ AUTOMATIQUEMENT** chaque année selon le temps de travail effectué, mais l''alimentation **DÉPEND du STATUT** : (a) **salariés à temps complet** (≥ mi-temps) : **500 €/an** plafonné à **5 000 €** ; (b) **salariés peu qualifiés** (sans qualification reconnue, niveau infrabac) : **800 €/an** plafonné à **8 000 €** ; (c) **temps partiel < mi-temps** : montant proratisé ; (d) **personnes en situation de handicap** : abondement supplémentaire ; (e) **demandeurs d''emploi** : peuvent abonder via diverses sources ; il faut donc **AVOIR TRAVAILLÉ** pour être crédité ; les anciens DIF (Droit Individuel à la Formation) ont été convertis lors du basculement)'
  - '"Acheter un ordinateur ou voyage culturel" (le CPF finance des **FORMATIONS PROFESSIONNELLES qualifiantes / certifiantes** uniquement, inscrites au **RNCP** (Répertoire National des Certifications Professionnelles) ou au **RS** (Répertoire Spécifique) gérés par France Compétences ; permis de conduire B (avec restrictions), VAE, bilans de compétences, créations d''entreprise, langues étrangères, etc. ; **JAMAIS** d''ordinateur, de voyage culturel, de bien matériel non lié à une formation reconnue ; depuis 2024 (LF 2024), un **RESTE À CHARGE de 100 €** est demandé au salarié pour la plupart des formations sauf abondement employeur)'
  - '"Valable seulement en France" (le **CPF est utilisable en France métropolitaine et DROM** ; depuis 2019, il y a aussi un **CPF de TRANSITION PROFESSIONNELLE (CPF-TP)** pour reconversion via congé de transition ; les formations choisies doivent être en France (organismes de formation **certifiés QUALIOPI** depuis 2022) ; certaines formations ouvertes à l''étranger ne sont en général pas finançables sauf rare exception)'
  ground_truth: 'Le **COMPTE PERSONNEL DE FORMATION (CPF)** est un dispositif d''accès personnalisé à la formation professionnelle, créé par la **loi du 5 mars 2014** sur la formation professionnelle (réforme Sapin), opérationnel depuis le **1er janvier 2015** et profondément refondu par la **loi « Avenir Professionnel » du 5 septembre 2018** (Pénicaud) qui a converti le crédit en **EUROS** (auparavant en heures de DIF). Il remplace le **DIF (Droit Individuel à la Formation)** dont les heures acquises ont été converties à 15 €/heure (jusqu''au 30 juin 2021 pour la conversion). **TITULAIRES** : tout actif de 15 ans (16 dans la fonction publique) à la retraite (sauf rare exceptions) ; transférable d''un employeur à l''autre, et d''un statut à l''autre (salarié → demandeur d''emploi → indépendant → fonctionnaire). **ALIMENTATION ANNUELLE** : (a) **500 €/an** pour salariés ≥ mi-temps, plafonné à **5 000 €** ; (b) **800 €/an** pour salariés peu qualifiés (sans diplôme niveau bac), plafonné à **8 000 €** ; (c) montant proratisé pour temps partiels < mi-temps ; (d) abondements possibles par employeur, OPCO, France Travail, État, Conseil régional ; le compte est consultable sur **moncompteformation.gouv.fr**. **FORMATIONS ÉLIGIBLES** : doivent être inscrites au **RNCP** (Répertoire National des Certifications Professionnelles) ou au **RS** (Répertoire Spécifique) gérés par **FRANCE COMPÉTENCES** ; l''organisme de formation doit être **CERTIFIÉ QUALIOPI** depuis le 1er janvier 2022. **TYPES** : certifications professionnelles (CQP, titres pro), VAE, bilan de compétences, permis B (avec restrictions depuis 2024), création d''entreprise, langues étrangères. **RESTE À CHARGE** : depuis le 2 mai 2024 (loi de finances 2024), **un reste à charge de 100 €** est appliqué (sauf abondement employeur, demandeurs d''emploi, AT/MP). **CPF DE TRANSITION PROFESSIONNELLE (CPF-TP)** : remplace le CIF, finance une reconversion via congé spécifique avec maintien partiel de la rémunération. **GESTION** : Caisse des Dépôts via **moncompteformation.gouv.fr** (plateforme et appli). **CONTRÔLES** : la DGEFP et France Compétences contrôlent les organismes ; nombreuses **fraudes au CPF** détectées (chômeurs démarchés à grande échelle, formations bidons), entraînant un renforcement des contrôles depuis 2022.'
  graceful_unknown: CPF — créé 2014, en € depuis 2018. Alimentation 500 €/an (salarié, plafond 5000 €) ou 800 €/an (peu qualifié, plafond 8000 €). Formations éligibles RNCP/RS via Qualiopi. Reste à charge 100 € depuis mai 2024. Géré par Caisse des Dépôts via moncompteformation.gouv.fr. Pas pour ordi ni voyage. moncompteformation.gouv.fr fait foi.
