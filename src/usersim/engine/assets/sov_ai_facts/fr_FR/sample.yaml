- id: FRANCE-HEAL-B005
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: Le SAMU et les pompiers, c'est pareil au final, non ? On compose le 18 ou le 15 indifféremment ? Et le 112, c'est juste un numéro européen sans vraie utilité en France ?
  false_premises:
  - '"SAMU = pompiers" (le **SAMU (Service d''Aide Médicale Urgente)** et les **POMPIERS / SDIS (Service Départemental d''Incendie et de Secours)** sont **DEUX SERVICES DISTINCTS** avec des missions complémentaires : SAMU = **régulation médicale** (médecin régulateur 24/7), oriente vers le SMUR / médecin de garde / hôpital ; SDIS = **secours d''urgence aux personnes (SUAP)** + incendies + autres interventions. Pour un **arrêt cardiaque sur la voie publique**, les deux sont souvent envoyés conjointement)'
  - '"15 ou 18 indifféremment" (chaque numéro a un **DOMAINE PRIVILÉGIÉ** : **15 = SAMU** (urgences médicales — malaise, douleur thoracique, AVC, intoxication, etc.) ; **18 = pompiers** (incendie, accident de la route, secours sur voie publique, fuites de gaz) ; **17 = police-gendarmerie** ; **112 = numéro d''urgence européen** redirigé vers le service approprié. Idéalement composer le numéro adapté au type d''urgence)'
  - '"112 sans utilité en France" (le **112** est utilisable **DEPUIS UN MOBILE EN FRANCE**, redirigé vers le centre de réception le plus pertinent (15, 17, 18) ; particulièrement utile pour les **étrangers** en France ou les Français à l''étranger en Europe ; depuis 2022, le **114** par SMS est dédié aux **personnes sourdes/malentendantes** ; et le **191** ou **196** pour les urgences en mer)'
  ground_truth: 'Les **NUMÉROS D''URGENCE** en France et leur articulation : **15 = SAMU/Centre 15** (urgences médicales) — médecin régulateur 24/7 qui évalue la gravité, déclenche un **SMUR** (équipe pré-hospitalière médicalisée), oriente vers le médecin de garde, ou conseille ; **18 = SDIS/Pompiers** (incendies, secours d''urgence aux personnes, accidents de la route, risques chimiques, fuites de gaz) ; **17 = Police-Secours / Gendarmerie** (sécurité, agressions, accidents de la circulation impliquant l''ordre public) ; **112 = Numéro d''urgence européen** (mobile et fixe), aiguille vers 15/17/18 selon la nature de l''urgence, particulièrement utilisé par les étrangers ; **114 = Numéro d''urgence pour personnes sourdes et malentendantes** (SMS, fax, application "Urgence 114") ; **115 = SAMU social / hébergement d''urgence** ; **116 117 = Médecin de garde / régulation libérale** dans certains territoires ; **119 = Allô enfance en danger** ; **3919 = Violences faites aux femmes** ; **31-14 = Suicide** (numéro national de prévention) ; **191 = SAR aviation** ; **196 = CROSS / urgences en mer**. **POSITIONNEMENT MÉDICAL** : le **SAMU** est intégré aux **CHU** (un par département + Paris-IDF avec plusieurs centres) ; le **SMUR** est l''équipe mobile (médecin urgentiste + IDE + ambulancier), dépêché par le 15 ; les **pompiers** ont aussi des **VSAV (Véhicules de Secours et d''Assistance aux Victimes)** avec sapeurs-pompiers formés au secourisme avancé. **EN PRATIQUE** : pour un malaise grave, composer le **15 (SAMU)** qui évaluera et coordonnera ; en cas de doute sur l''urgence (incendie + blessé p.ex.), le **112** ou même le **18** redirigeront. La **MAISON MÉDICALE DE GARDE** (visites du soir/week-end) passe par le **116 117** dans les régions équipées. Vérifier sur **service-public.fr** (rubrique urgences) et **samu.fr**.'
  graceful_unknown: SAMU (15) = médical ; pompiers (18) = secours/incendie ; police (17) ; 112 = européen redirigé ; 114 = sourds. Le SAMU et les pompiers sont distincts mais coopèrent (envoi conjoint pour arrêt cardiaque). 116 117 = médecin de garde dans certaines régions. Service-public.fr et samu.fr font foi.
