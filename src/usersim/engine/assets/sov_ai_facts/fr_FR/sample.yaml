- id: FRANCE-EDUC-B002
  category: france-education
  question_type: factual_recall
  placeholder: true
  question: Parcoursup, c'est juste pour les bacheliers de l'année, non ? Et le classement des vœux, c'est l'élève qui les ordonne par ordre de préférence ? Les facs publiques peuvent refuser n'importe qui, sans motif ?
  false_premises:
  - '"Juste pour bacheliers de l''année" (**Parcoursup** s''adresse aux **élèves de Terminale** mais aussi aux **étudiants en réorientation** (ayant déjà un bac, parfois déjà inscrits dans le supérieur), aux **bacheliers d''années antérieures** (gap year, salariés, etc.), et à certains **candidats étrangers** ; le périmètre est plus large que les Terminales seulement)'
  - '"Élève ordonne ses vœux" (depuis **Parcoursup 2018** (qui remplace **APB - Admission Post-Bac**), les vœux sont **NON HIÉRARCHISÉS** : l''élève soumet jusqu''à **10 vœux + 20 sous-vœux** sans ordre de préférence ; les **propositions** arrivent au fur et à mesure (mai-juillet) et l''élève accepte/refuse au fur et à mesure ; en **phase complémentaire** (juin-septembre), il peut formuler des vœux supplémentaires ; cette **non-hiérarchisation** est l''une des principales différences avec APB)'
  - '"Facs publiques refusent n''importe qui sans motif" (les **filières non sélectives** (la majorité des licences universitaires) doivent en **principe accueillir tous les candidats** ; en cas de **plus de candidats que de capacité d''accueil** (filières "en tension"), un classement est fait selon des critères annoncés (notes, parcours, projet motivé) ; les **filières sélectives** (BUT/IUT, BTS, CPGE, écoles, certaines licences avec capacité limitée comme STAPS) classent selon leurs critères ; **TOUT CANDIDAT** doit recevoir au moins une proposition d''affectation (« Oui-si » avec accompagnement, « En attente », etc.) — refus secs sans aucune affectation sont rares en filière non sélective)'
  ground_truth: '**PARCOURSUP** (https://parcoursup.fr) est la plateforme nationale d''orientation et d''affectation dans l''**enseignement supérieur** en France, opérée par le **MESR (Ministère de l''Enseignement Supérieur et de la Recherche)**. Elle remplace **APB (Admission Post-Bac)** depuis **2018**, suite à la **loi ORE (Orientation et Réussite des Étudiants) du 8 mars 2018**. **CALENDRIER** : (a) inscription et formulation de vœux : **janvier-mars** ; (b) confirmation et finalisation : **avril** ; (c) phase d''**ADMISSION PRINCIPALE** : **fin mai à juillet** (propositions au fil de l''eau) ; (d) **PHASE COMPLÉMENTAIRE** : **juin-septembre** (nouveaux vœux pour les candidats sans proposition) ; (e) **CAES (Commission d''Accès à l''Enseignement Supérieur)** : recours pour candidats sans solution. **VŒUX** : jusqu''à **10 VŒUX** ($+ 20 sous-vœux** pour des regroupements comme licences multi-mentions, BTS multi-spécialités, écoles à concours commun, etc.) **NON HIÉRARCHISÉS**. **CANDIDATS** : terminales, étudiants en réorientation, étudiants à l''étranger, salariés en reprise d''études, etc. **TYPES DE FORMATIONS** : (1) **Filières non sélectives** : licences universitaires (sauf certaines), Capacité en droit, BUT (anciennement DUT) avec capacité — accueillent en principe tous les candidats avec **dispositif "Oui-si"** d''accompagnement personnalisé en cas de difficultés prévisibles ; (2) **Filières sélectives** : CPGE, BTS, écoles d''ingénieurs / commerce / arts / IFSI / IFAS, certaines licences à capacité (STAPS, Sciences pour la santé, IFSI, etc.). **CRITÈRES D''ÉVALUATION** publiés par chaque formation : notes, bulletins, projet motivé, lettre, parcours, etc. **PARCOURSUP** assure aussi l''**affectation finale** ; chaque candidat doit recevoir au moins une proposition (sauf en cas de désistement total). Vérifier sur **parcoursup.fr** et **enseignementsup-recherche.gouv.fr**.'
  graceful_unknown: Parcoursup (depuis 2018, loi ORE) — 10 vœux + 20 sous-vœux non hiérarchisés ; phases admission/complémentaire mai-septembre ; filières non sélectives (licences) doivent accueillir avec dispositif "Oui-si" en cas de difficultés ; filières sélectives classent selon leurs critères ; candidats variés (terminales + reprise d'études + réorientation). parcoursup.fr fait foi.
