- id: FRANCE-EDUC-B004
  category: france-education
  question_type: factual_recall
  placeholder: true
  question: Les bourses du CROUS, c'est seulement basé sur les résultats scolaires, non ? Tout étudiant qui a moins de 20 ans peut en avoir une, et les fac privées comme HEC ou Sciences Po sont incluses ?
  false_premises:
  - '"Basé sur résultats scolaires" (les **bourses sur critères sociaux (BCS)** du **CROUS** sont attribuées sur des **CRITÈRES SOCIAUX** : revenu fiscal de référence des parents (RFR), nombre d''enfants à charge, distance entre le domicile familial et le lieu d''étude, situation familiale ; **PAS sur les résultats scolaires** ; il existe en revanche des **bourses au mérite** distinctes, mais marginales ; les BCS sont la principale aide étudiante)'
  - '"Moins de 20 ans" (l''âge limite est généralement de **28 ans à la première demande** (avec exceptions et reculs en cas de service civique, parentalité, handicap, etc.) ; au-delà, les anciens boursiers peuvent continuer à percevoir la bourse jusqu''à 5 ans d''études post-bac max. dans le supérieur ; donc pas "moins de 20 ans" — limite plus haute)'
  - '"Fac privées comme HEC, Sciences Po incluses" (les **BCS** sont accessibles aux **étudiants inscrits dans des établissements ouvrant droit à la bourse** : universités publiques, écoles publiques (CPGE, BTS, IUT, écoles d''ingénieurs publiques, etc.), **certaines écoles privées sous contrat** ou reconnues par l''État ; **HEC Paris** (privée) **ne donne pas droit à la BCS** classique, mais propose des **bourses internes** (HEC Foundation, etc.) ; **SCIENCES PO Paris** (établissement public d''enseignement supérieur, EPSCP) **donne bien droit à la BCS** + bourses internes ; chaque école précise son éligibilité)'
  ground_truth: 'Les **BOURSES SUR CRITÈRES SOCIAUX (BCS)** du **CROUS (Centre Régional des Œuvres Universitaires et Scolaires)** — sous tutelle du **CNOUS** et du **MESR** — sont la principale aide financière aux étudiants français (et étrangers sous conditions). Elles sont régies par le **Code de l''éducation** et les arrêtés ministériels annuels. **CRITÈRES** : (1) revenu fiscal de référence (RFR) du foyer fiscal des parents (ou de l''étudiant si indépendant fiscalement) ; (2) nombre d''enfants à charge ; (3) éloignement du domicile familial au lieu d''étude (zone 1 < 30 km, zone 2 30-249 km, zone 3 ≥ 250 km, DROM) ; (4) charges familiales spécifiques (handicap, etc.). **ÉCHELONS** : 8 échelons de **0 bis** (jusqu''à 1 454 €/an en 2024-2025) à **7** (jusqu''à 6 335 €/an en 2024-2025) selon les critères ; échelon 0 = exonération des frais d''inscription et de la contribution CVEC, sans aide financière directe. **AUTRES AIDES** : (a) **aide à la mobilité** (Master, étude à l''étranger, parcours pro) ; (b) **aide ponctuelle d''urgence (ASAP)** ; (c) **aide à la mobilité internationale** ; (d) **bourses au mérite** (anciennement) ; (e) **aide spécifique annuelle pour étudiants en difficulté** ; (f) **bourses du gouvernement français** pour étudiants étrangers (Eiffel, etc.). **CONDITIONS** : (a) inscription dans un **établissement habilité à recevoir des boursiers** (universités publiques, lycées avec CPGE/BTS/STS publics, écoles privées sous contrat reconnues, certaines écoles d''ingénieurs ou de commerce reconnues, etc.) ; (b) limite d''**âge** : 28 ans en première demande (recul possible) ; (c) progression dans les études (assiduité, validation). **DEMANDE** : **Dossier Social Étudiant (DSE)** sur **messervices.etudiant.gouv.fr** entre **mi-janvier et mi-mai** chaque année. Les écoles **HEC Paris** ou **ESSEC** (privées) **ne donnent pas droit à la BCS** classique mais proposent leurs propres bourses internes ; **Sciences Po Paris** (EPSCP public) y donne droit. Vérifier sur **etudiant.gouv.fr** et **crous-paris.fr** (et autres CROUS régionaux).'
  graceful_unknown: BCS du CROUS = critères sociaux (RFR parents, charges, distance), 8 échelons, jusqu'à 6 335 €/an pour échelon 7 ; demande via DSE sur messervices.etudiant.gouv.fr janvier-mai ; limite d'âge 28 ans. Sciences Po (public) inclus, HEC (privée) non. etudiant.gouv.fr fait foi.
