- id: FRANCE-LABO-B005
  category: france-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Le congé maternité, c'est 6 semaines avant l'accouchement et 6 semaines après, payé à 50 %, et c'est valable pour tous les contrats, même CDD ?
  false_premises:
  - '"6 semaines avant et 6 après" (le congé maternité légal de **base** est **6 SEMAINES PRÉNATALES + 10 SEMAINES POSTNATALES = 16 SEMAINES** pour le **1er ou 2e enfant** ; **8 SEMAINES PRÉNATALES + 18 POSTNATALES = 26 semaines** pour le **3e enfant ou plus** ; **NAISSANCES MULTIPLES** : jumeaux = 12+22 = 34 semaines ; triplés ou + = 24+22 = 46 semaines ; pas 6+6 dans aucune configuration)'
  - '"Payé à 50 %" (les **INDEMNITÉS JOURNALIÈRES MATERNITÉ (IJ)** versées par la **CPAM (Sécurité sociale)** sont calculées à **100 % du salaire JOURNALIER de base** (salaires des 3 mois précédents / 91,25), **PLAFONNÉ** au plafond journalier de la Sécurité sociale (~95 € brut/jour en 2024) ; en pratique, beaucoup d''entreprises ou de conventions collectives versent un **complément** pour atteindre le salaire net habituel ; certaines ont un maintien du salaire intégral pendant le congé)'
  - '"Valable pour tous, même CDD" (le congé maternité est un **DROIT pour tous les contrats** (CDI, CDD, intérim, fonction publique) ; **MAIS** : (a) en CDD, le **CONTRAT NE PEUT PAS ÊTRE ROMPU** pour cause de maternité (protection légale jusqu''à 10 semaines après le congé) ; (b) le **CDD se termine à son terme normal** même si le congé n''est pas terminé (la salariée perd alors les indemnités du congé restant car elle n''est plus salariée — sauf si déjà en cumul d''emploi) ; (c) les **AUTOENTREPRENEURS / INDÉPENDANTS** sont couverts par leur régime spécifique avec des règles différentes (URSSAF, IRCEC, etc.) ; (d) les **CHÔMEUSES** indemnisées peuvent bénéficier des IJ sous conditions)'
  ground_truth: 'Le **CONGÉ DE MATERNITÉ** est régi par les **arts. L1225-17 et suivants du Code du travail** et **arts. L331-3 et suivants du Code de la sécurité sociale**. **DURÉE LÉGALE** : (a) **1er ou 2e enfant** : **16 semaines** = **6 prénatales + 10 postnatales** ; (b) **3e enfant ou plus** : **26 semaines** = **8 prénatales + 18 postnatales** ; (c) **JUMEAUX** : 34 semaines = **12 prénatales + 22 postnatales** ; (d) **TRIPLÉS ou plus** : 46 semaines = **24 prénatales + 22 postnatales**. **REPORT POSSIBLE** de jusqu''à **3 semaines** prénatales sur la période postnatale (sur certificat médical). **PROLONGATION en cas d''ACCOUCHEMENT PRÉMATURÉ** : congé étendu pour atteindre la durée totale légale ; **HOSPITALISATION** de l''enfant > 6 semaines après naissance : congé reportable à la sortie de l''hôpital. **INDEMNITÉS JOURNALIÈRES MATERNITÉ (IJ)** versées par la **CPAM** : **100 % du salaire journalier de base** (moyenne sur les 3 mois précédents le congé), **PLAFONNÉ** au plafond mensuel de la Sécurité sociale (3 864 € en 2024 = 95,12 €/jour brut max). En pratique, **beaucoup de conventions collectives ou accords d''entreprise prévoient un complément** par l''employeur pour maintenir 100 % du net habituel pendant le congé (avec subrogation : l''employeur reçoit les IJ et verse le salaire complet). **PROTECTION DE L''EMPLOI** : interdiction de **LICENCIER** pendant la grossesse, le congé de maternité, et **10 SEMAINES après la fin** du congé (sauf faute grave non liée à la grossesse, ou impossibilité de maintenir le contrat pour motif étranger à la grossesse) — art. L1225-4. **DROIT À RETROUVER SON POSTE** ou un poste similaire à la fin du congé (art. L1225-25). **CONGÉ PARENTAL** complémentaire possible jusqu''aux 3 ans de l''enfant (non rémunéré sauf PreParE/PrePareCo de la CAF). **CONGÉ PATERNITÉ ET D''ACCUEIL** : **25 jours** (28 si naissance multiple) depuis le **1er juillet 2021**, dont 7 jours obligatoires juste après la naissance. Vérifier sur **service-public.fr** et **ameli.fr** (rubrique maternité).'
  graceful_unknown: Congé maternité légal — 16 semaines pour 1er/2e enfant (6+10), 26 pour 3e+ (8+18), 34 jumeaux, 46 triplés. IJ Sécurité sociale 100 % du salaire journalier plafonné (~95 €/jour brut, 2024) ; complément employeur fréquent par convention. Congé paternité 25-28 jours depuis 2021. Protection contre licenciement pendant + 10 semaines après. service-public.fr fait foi.
