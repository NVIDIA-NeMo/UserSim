- id: FRANCE-EDUC-B006
  category: france-education
  question_type: factual_recall
  placeholder: true
  question: La laïcité à l'école, ça vient de la loi de 2004 qui a interdit le port de la soutane, c'est ça ? Et ça s'applique partout, y compris à l'université ? Et les profs peuvent porter des signes religieux discrets ?
  false_premises:
  - '"Loi 2004 a interdit la soutane" (la **loi du 15 mars 2004** interdit, dans les **écoles, collèges et lycées PUBLICS**, le port de **« signes ou tenues par lesquels les élèves manifestent ostensiblement une appartenance religieuse »** — voile islamique, kippa, grande croix chrétienne ostensible, turban sikh, etc. ; elle ne vise pas spécifiquement la soutane et concerne les **ÉLÈVES**, pas les agents publics ; la loi de 1905 sur la séparation des Églises et de l''État + loi du 9 décembre 1905 codifient le cadre général de la laïcité)'
  - '"S''applique partout, y compris à l''université" (la **loi du 15 mars 2004** s''applique aux **écoles, collèges et lycées publics** (1er et 2e degré) ; elle **NE S''APPLIQUE PAS À L''UNIVERSITÉ** où les **étudiants** (adultes) bénéficient de la **liberté d''expression religieuse** (port du voile autorisé, p.ex.) ; en revanche, les **AGENTS PUBLICS** (enseignants, BIATSS) sont soumis à la **stricte neutralité religieuse** dans l''exercice de leurs fonctions, partout (école, université, hôpital public, etc.) — depuis l''avis du Conseil d''État Marteaux (2000) et confirmé par jurisprudence constante)'
  - '"Profs peuvent porter signes religieux discrets" (les **agents publics** sont soumis à une **OBLIGATION DE NEUTRALITÉ RELIGIEUSE STRICTE** dans l''exercice de leurs fonctions ; cela **INTERDIT** tout signe religieux, **MÊME DISCRET** (différence majeure avec les élèves de 2004 qui sont seulement contraints sur les signes "ostensibles") ; cette interdiction s''applique aux enseignants, personnels administratifs, médecins de l''hôpital public, etc. ; elle découle de l''art. 1 de la Constitution + jurisprudence du Conseil d''État (CE Marteaux 2000, Mme Christine X 2013, etc.) + statut de la fonction publique)'
  ground_truth: 'La **LAÏCITÉ EN FRANCE** repose sur un cadre juridique multi-strates. **FONDEMENTS** : (1) **Loi du 9 décembre 1905 concernant la séparation des Églises et de l''État** : la République ne reconnaît, ne salarie, ni ne subventionne aucun culte ; principe de **NEUTRALITÉ DE L''ÉTAT** ; en Alsace-Moselle, régime concordataire spécifique préservé. (2) **Constitution du 4 octobre 1958 art. 1** : « La France est une République indivisible, **laïque**, démocratique et sociale » — valeur constitutionnelle. **À L''ÉCOLE PUBLIQUE** : (a) **Loi du 15 mars 2004** dite « loi sur les signes religieux » : interdit aux **élèves** des **ÉCOLES, COLLÈGES, LYCÉES publics** de porter des « signes ou tenues par lesquels [ils] manifestent ostensiblement une appartenance religieuse » ; vise les **signes ostensibles** (voile islamique, kippa, grande croix, turban sikh) et **PAS les discrets** (petite croix sous vêtements, médaille, etc.) ; concerne aussi les **abayas/qamis** depuis circulaire d''août 2023. (b) **NE S''APPLIQUE PAS** aux **établissements d''enseignement supérieur** publics (universités, IUT, etc.) où les étudiants ont la liberté d''expression religieuse. (c) **NE S''APPLIQUE PAS** aux **établissements privés sous contrat** (qui peuvent avoir leurs propres règles dans le respect du contrat) ni aux **établissements privés hors contrat** (catholiques, juifs, musulmans). **POUR LES AGENTS PUBLICS** (enseignants, fonctionnaires de l''Éducation nationale, médecins hospitaliers, etc.) : **OBLIGATION DE NEUTRALITÉ RELIGIEUSE STRICTE** dans l''exercice de leurs fonctions (avis CE Marteaux du 3 mai 2000, jurisprudence constante) — interdit **tout signe religieux, même discret** ; loi confortant les principes de la République 24 août 2021 a renforcé ce cadre (extension du principe de neutralité aux délégataires de service public, p.ex. crèches privées délégataires, transports publics, etc.). **POUR LES PARENTS ACCOMPAGNATEURS** de sortie scolaire : statut intermédiaire — la jurisprudence (CE 2013, etc.) considère qu''ils n''ont **pas** d''obligation stricte de neutralité, étant simples collaborateurs occasionnels du service public. Vérifier sur **education.gouv.fr** (rubrique "Laïcité"), **vie-publique.fr**, et **le Conseil des sages de la laïcité (CSL)**.'
  graceful_unknown: Lai̇cité = loi 1905 + Constitution 1958 art. 1. Loi du 15 mars 2004 vise les ÉLÈVES de l'école/collège/lycée public (signes ostensibles). NE s'applique PAS à l'université ni au privé. Pour les AGENTS PUBLICS (profs, fonctionnaires) = neutralité stricte y compris signes discrets, partout. Loi 2021 a étendu aux délégataires de service public. education.gouv.fr fait foi.
  persona_tags:
  - interest:civic
  - region:any
  - age:any
  difficulty: hard
