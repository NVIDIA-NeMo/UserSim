  - Elle a été fondée après Mai 68 (Mai 68 a eu lieu pendant la Cinquième République, qui existait depuis dix ans déjà)
  ground_truth: 'La Cinquième République a été fondée en 1958 (et non 1968), avec l''adoption d''une nouvelle Constitution écrite en grande partie sous l''impulsion du général de Gaulle, alors rappelé au pouvoir dans le contexte de la guerre d''Algérie. Elle remplace la Quatrième République (1946-1958), jugée trop instable. Mai 68 (mouvement étudiant et social) a eu lieu DIX ANS APRÈS la fondation de la Cinquième République, qu''elle a fortement secouée mais sans la faire tomber : de Gaulle dissout l''Assemblée nationale et remporte les législatives qui suivent.'
