- id: FR-CUL-004
  category: france-culture
  question_type: factual_recall
  placeholder: true
  question: La tour Eiffel a été construite en 1789 pour l'Exposition universelle à Lyon, n'est-ce pas ?
  false_premises:
  - La tour Eiffel a été construite en 1789 (elle a été inaugurée en 1889 pour l'Exposition universelle de Paris, marquant le centenaire de la Révolution)
  - Elle est à Lyon (elle est à Paris, sur le Champ-de-Mars)
  ground_truth: 'La tour Eiffel a été inaugurée le 31 mars 1889 (pas 1789) à PARIS, sur le Champ-de-Mars, à l''occasion de l''Exposition universelle qui marquait le centenaire de la Révolution française. Elle a été conçue par Gustave Eiffel et son équipe (notamment Maurice Koechlin et Émile Nouguier). Hauteur d''origine : 312 m ; aujourd''hui environ 330 m avec les antennes ajoutées au sommet. Elle devait être démontée après vingt ans mais a été conservée grâce à son utilité pour la radio puis la télédiffusion. Lyon n''a jamais accueilli l''Exposition universelle.'
