- id: FRANCE-DIGI-B003
  category: france-digital-services
  question_type: factual_recall
  placeholder: true
  question: La carte d'identité électronique (CNIe), c'est obligatoire depuis 2010, non ? Et l'ancienne carte papier n'est plus valable pour voyager en Europe ? Le passeport, lui, n'a pas changé depuis l'an 2000 ?
  false_premises:
  - '"Obligatoire depuis 2010" (la **NOUVELLE CARTE NATIONALE D''IDENTITÉ ÉLECTRONIQUE (CNIe)**, format carte bancaire avec **PUCE NFC** et **CACHET ÉLECTRONIQUE VISIBLE**, est délivrée depuis le **2 août 2021** (et non 2010) suite au **règlement européen 2019/1157** sur la sécurité des cartes d''identité ; le **renouvellement** de l''ancienne CNI plastifiée n''est pas obligatoire avant son expiration ; pas obligatoire de demander une CNIe spontanément si l''ancienne est valide ; possession non obligatoire en France (mais utile pour identification))'
  - '"Ancienne carte papier plus valable en Europe" (les **ANCIENNES CNI plastifiées de format A7** délivrées avant le 2 août 2021 restent **VALABLES jusqu''à leur date d''expiration imprimée** (15 ans pour les majeurs émises depuis 2014, 10 ans avant), **DANS LA LIMITE de 2031** pour les titres délivrés à partir de 2014 (à cause d''une extension de validité accordée par la France en 2014, contestée par certains pays comme le Royaume-Uni, l''Italie, etc., qui n''acceptent pas la prolongation 5 ans tacite) ; voyager dans l''espace Schengen avec une ancienne CNI prolongée reste possible mais avec **précautions** ; à partir de **2031**, toutes les anciennes seront définitivement périmées)'
  - '"Passeport pas changé depuis 2000" (le **PASSEPORT BIOMÉTRIQUE FRANÇAIS** est délivré depuis **juin 2009** (règlement UE 2252/2004 sur les passeports biométriques) ; il intègre une **PUCE RFID** avec photo + 2 empreintes digitales (à partir de 12 ans) ; remplace les passeports précédents non-biométriques ; **VALIDITÉ** : 10 ans pour majeurs, 5 ans pour mineurs ; donc changements majeurs en 2009)'
  ground_truth: 'Les **TITRES D''IDENTITÉ FRANÇAIS** ont connu plusieurs évolutions importantes. **CARTE NATIONALE D''IDENTITÉ ÉLECTRONIQUE (CNIe)** : nouveau format délivré depuis le **2 août 2021** (anciens titres restent valides jusqu''à leur expiration), suite au **règlement (UE) 2019/1157** harmonisant la sécurité des cartes d''identité dans l''UE. **CARACTÉRISTIQUES** : (a) format **carte bancaire ID-1** (vs. ancien format A7 papier plastifié) ; (b) **PUCE NFC** électronique contenant les données d''identité, photo numérique, 2 empreintes digitales (depuis 2021) ; (c) **CACHET ÉLECTRONIQUE VISIBLE (CEV)** = code-barres 2D au verso authentifiant les données ; (d) compatible **eIDAS** au niveau **substantiel** ; (e) bilingue (français + anglais) ; (f) **VALIDITÉ** : 10 ans pour majeurs (avec la nouvelle CNIe), 10 ans pour mineurs aussi. **ANCIENNE CNI** : titres plastifiés délivrés avant le 2 août 2021, validité 15 ans pour majeurs (depuis 2014, **prolongation tacite de 5 ans** controversée pour les CNI émises entre 2004 et 2013, donc **expiration de fait jusqu''en 2031** ; certains pays UE comme RU, Italie, n''ont pas accepté cette prolongation), 10 ans pour mineurs. **PASSEPORT BIOMÉTRIQUE** : délivré depuis **juin 2009** (règlement UE 2252/2004), intègre puce RFID avec photo + 2 empreintes (à partir de 12 ans) ; validité **10 ans** majeurs / **5 ans** mineurs ; émis par les mairies habilitées (autorités centrales = ANTS et préfectures pour cas spéciaux). **DEMANDE** : pré-demande en ligne sur **ANTS (Agence Nationale des Titres Sécurisés) - ants.gouv.fr** avec photo numérique, puis rendez-vous en mairie pour prise d''empreintes et signature (pour CNIe et passeport) ; **GRATUIT** pour la CNIe ; **86 €** pour passeport adulte (en 2025), 42 € (15-17 ans), 17 € (<15). **POSSESSION OBLIGATOIRE** : aucune obligation légale de posséder une CNI ou un passeport en France (sauf dans certaines situations administratives) ; en revanche, en contrôle d''identité par autorité, il faut pouvoir justifier de son identité par tout moyen. **eIDAS européen** : la CNIe française a été notifiée niveau substantiel en 2024 ; le **portefeuille européen d''identité numérique (EUDI Wallet)** prévu par eIDAS 2 (2024) sera disponible en 2026. Vérifier sur **service-public.fr** et **ants.gouv.fr**.'
  graceful_unknown: CNIe (depuis 2 août 2021) = carte bancaire avec puce NFC + cachet électronique visible, conforme règlement UE 2019/1157, eIDAS substantiel. Anciennes CNI plastifiées valides jusqu'à expiration imprimée + prolongation tacite 5 ans (limite 2031). Passeport biométrique depuis juin 2009 (règlement UE 2252/2004). Demande sur ants.gouv.fr + RDV en mairie. service-public.fr fait foi.
