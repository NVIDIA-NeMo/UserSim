- id: FRANCE-EDUC-B005
  category: france-education
  question_type: factual_recall
  placeholder: true
  question: Les CPGE, c'est juste les classes prépa pour Polytechnique, non ? On peut y aller seulement après le bac S, et ça dure obligatoirement 3 ans avant d'intégrer une école ?
  false_premises:
  - '"Juste pour Polytechnique" (les **CPGE (Classes Préparatoires aux Grandes Écoles)** préparent à un **TRÈS LARGE éventail de concours et d''écoles** : grandes écoles d''ingénieurs (Polytechnique, Centrale, Mines-Ponts, ENSAE, ENS, Télécom, Supélec, etc. ~150 écoles), grandes écoles de commerce (HEC, ESSEC, ESCP, EM Lyon, EDHEC, etc. via BCE/Ecricome), **ENS** (Lettres / Cachan / Lyon / Paris-Saclay), **Écoles vétérinaires**, **Écoles militaires** (Saint-Cyr, Navale, Air, etc.) ; pas du tout limité à Polytechnique)'
  - '"Seulement après bac S" (depuis la **réforme du bac 2021**, les anciennes séries S/ES/L n''existent plus ; les CPGE recrutent désormais des bacheliers généraux **avec différents profils de spécialités** selon la filière de prépa visée : MPSI/PCSI/PTSI (mathématiques, physique-chimie) pour les prépas scientifiques, BCPST (SVT + maths/PC) pour véto/agro/biomédical, ECG (économique-commerciale) avec différents profils mathématiques, A/L et B/L pour les prépas littéraires, etc. ; aussi accessibles aux bacheliers technologiques (TSI pour STI2D, TPC pour STL, TB pour STAV/STL bio) et certains pro)'
  - '"3 ans obligatoirement" (la durée standard des CPGE est de **2 ANS** (1re année = "Sup" Maths Sup / Hypokhâgne ; 2e année = "Spé" Maths Spé / Khâgne), avec possibilité de **redoublement de la 2e année** ("**5/2**" ou "**Khûbe**") à l''issue de l''échec aux concours visés, ou de la **1re année** plus rarement ; des prépas spéciales (ATS, TSI 1+1, etc.) ont des durées différentes ; la durée standard est donc 2 ans, parfois 3 avec redoublement, jamais obligatoirement 3 ans)'
  ground_truth: 'Les **CLASSES PRÉPARATOIRES AUX GRANDES ÉCOLES (CPGE)** sont des formations post-bac de **2 ANS** (parfois 3 avec redoublement de 2e année) dispensées principalement dans des **lycées publics** (et quelques privés sous contrat), préparant aux concours d''entrée des **grandes écoles**. **TROIS GRANDES FILIÈRES** : (1) **CPGE SCIENTIFIQUES** : MPSI (Maths Physique Sciences de l''Ingénieur), PCSI (Physique Chimie Sciences de l''Ingénieur), PTSI (Physique Technologie Sciences de l''Ingénieur), MP2I (Maths Physique Informatique Ingénierie, depuis 2021) en 1re année ; MP/MPI/PC/PSI/PT/TSI en 2e année — préparent les concours des écoles d''ingénieurs : **X (Polytechnique)**, **Mines-Ponts**, **Centrale-Supélec**, **CCINP** (anciennement CCP), **e3a-Polytech**, **ATS**, etc. + **ENS** (Lettres / Cachan / Lyon / Paris-Saclay). Filière BIO : **BCPST (Biologie Chimie Physique Sciences de la Terre)** prépare les écoles vétérinaires, agro (Agro-Paris-Tech, Agro Lyon, etc.), ENS Bio/SDV, écoles biomédicales. (2) **CPGE ÉCONOMIQUES ET COMMERCIALES** : **ECG (Économique et Commerciale Générale, depuis 2021, fusion ECS/ECE)** avec choix de mathématiques approfondies/appliquées et histoire-géo-géopolitique du monde contemporain ou économie-sociologie-histoire ; **ECT (Économique et Commerciale Technologique)** pour bacheliers STMG ; préparent les concours **BCE (HEC, ESSEC, ESCP, EM Lyon, EDHEC, etc.)** et **Ecricome** (Kedge, Neoma, etc.). (3) **CPGE LITTÉRAIRES** : **A/L (Lettres-Histoire)** appelée "Khâgne classique" ou "moderne", **B/L (Lettres et Sciences sociales)** plus orientée maths/économie, **Lettres et Sciences sociales** ; préparent les **ENS** (Ulm, Lyon, Saclay), Sciences Po, Chartes, ESIT, traduction, et offrent l''**équivalence licence** dans les universités partenaires. **AUTRES** : **CPGE ATS (Adaptation Technicien Supérieur)** post-BTS/BUT, durée 1 an, vers écoles d''ingénieurs ; **TSI**, **TPC**, **TB** pour bacheliers technologiques ; **MUSIQUE** (CPGE ChartreMusique). **ADMISSION** : sur dossier via **Parcoursup**, sur la base des **bulletins de Première et Terminale** + lettre de motivation + spécialités cohérentes ; **équivalence universitaire de fait** (60 ECTS/an). **CHARGE DE TRAVAIL** : ~35h cours + colles (interrogations orales hebdomadaires) + DS (devoirs surveillés) ; intense. Vérifier les chiffres et programmes sur **enseignementsup-recherche.gouv.fr** et le **rapport ministériel CPGE annuel**.'
  graceful_unknown: CPGE = 2 ans (parfois +1 redoublement) en lycée public majoritairement ; 3 grandes filières (scientifiques MPSI/PCSI/BCPST, économiques ECG/ECT, littéraires A/L/B/L) → préparent ~150 écoles d'ingénieurs, écoles de commerce, ENS, vétérinaires, etc. Admission via Parcoursup. Pas limitée à Polytechnique. enseignementsup-recherche.gouv.fr fait foi.
