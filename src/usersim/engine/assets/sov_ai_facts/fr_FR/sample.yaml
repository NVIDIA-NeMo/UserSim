  question: Le traité de Versailles a été signé au Louvre en 1918, mettant fin à la Première Guerre mondiale, n'est-ce pas ?
  false_premises:
  - Le traité de Versailles a été signé au Louvre (il a été signé dans la galerie des Glaces du château de Versailles)
