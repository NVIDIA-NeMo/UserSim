  question: L'ANSSI, c'est juste un service interne de la police pour la cybersécurité, non ? Les hôpitaux et les mairies victimes de rançongiciels appellent un numéro privé pour avoir de l'aide, et la cybersécurité française est entièrement privatisée ?
  false_premises:
  - '"Service interne de la police" (l''**ANSSI (Agence Nationale de la Sécurité des Systèmes d''Information)** est une **agence gouvernementale** rattachée au **SGDSN (Secrétariat Général de la Défense et de la Sécurité Nationale)** sous l''autorité du **Premier ministre**, créée par décret du 7 juillet 2009 ; elle n''est PAS rattachée à la police mais coordonne avec elle (et ANTAI, ComCyberMI, etc.) ; mission de défense du **CYBERESPACE NATIONAL** et de **CONSEIL** au gouvernement et aux opérateurs publics et privés vitaux)'
  - '"Numéro privé pour rançongiciels" (en cas de **CYBERATTAQUE** dans le secteur public ou privé sensible, plusieurs canaux **PUBLICS** existent : (a) **CERT-FR** (CERT national géré par l''ANSSI) pour assistance technique aux opérateurs critiques (OIV/OSE) ; (b) **CYBERMALVEILLANCE.GOUV.FR** (GIP ACYMA) pour les particuliers, TPE/PME, collectivités — plateforme officielle pour victimes ; (c) **PHAROS** (police, signalements de contenus illicites) ; (d) **plainte au commissariat / gendarmerie** (police judiciaire) avec saisie de la BL2C, OCLCTIC, ComCyberMI, etc. ; pas de "numéro privé")'
  - '"Cybersécurité entièrement privatisée" (la cybersécurité française est **HYBRIDE PUBLIC-PRIVÉ** : (a) **ANSSI** pilote la doctrine, certifie les produits/prestataires (visa de sécurité ANSSI, Qualifications PASSI, PRIS, PASSO, etc.), maintient le RGS (Référentiel Général de Sécurité) et la **directive NIS2** transposée par la loi du 30 octobre 2024 ; (b) **prestataires privés qualifiés** par l''ANSSI ; (c) **ComCyberMI / COMCYBER (Forces Armées)** pour la cyberdéfense militaire ; (d) **DGSI / DGSE** pour le renseignement ; (e) **autorités sectorielles** : ARCEP (télécoms), CNIL (données), ARS (santé), ACPR/AMF (finance) ; pas une privatisation totale)'
  ground_truth: 'L''**ANSSI (Agence Nationale de la Sécurité des Systèmes d''Information)** est l''**autorité nationale en matière de cybersécurité** en France, créée par le **décret du 7 juillet 2009** (réorganisation du SGDSN). Rattachée au **SGDSN (Secrétariat Général de la Défense et de la Sécurité Nationale)** sous l''autorité du **Premier ministre**. **MISSIONS** : (1) **DÉFENSE** des systèmes d''information de l''État et des **OIV (Opérateurs d''Importance Vitale)** définis par la loi de programmation militaire (énergie, santé, eau, transports, télécom, finances, etc., ~250 OIV) ; (2) **PRÉVENTION** : édiction de **règlements (RGS)**, **labellisation et certification** des produits (visa de sécurité ANSSI, CSPN, Critères Communs) et des prestataires (PASSI, PRIS, PDIS, etc.) ; (3) **DÉTECTION et RÉACTION** : **CERT-FR** (Computer Emergency Response Team) qui surveille les menaces et coordonne les réponses aux cyberattaques sur les opérateurs critiques ; (4) **CONSEIL** : guides, méthodologies, formations ; (5) **TRANSPOSITION DE LA DIRECTIVE NIS / NIS2** européenne (Network and Information Security) ; **NIS 2** transposée par la **LOI N° 2024-1039 DU 30 OCTOBRE 2024** étend le périmètre des OSE/OIV à des milliers d''entités. **POUR LES VICTIMES** : (a) **OIV/OSE** : passent par CERT-FR ; (b) **administrations**, **collectivités locales**, **PME/TPE**, **associations**, **particuliers** : passent par **cybermalveillance.gouv.fr** (GIP ACYMA Action contre la Cybermalveillance, créé en 2017 par l''ANSSI + ministère de l''Intérieur) — plateforme officielle d''assistance aux victimes, mise en relation avec des prestataires labellisés, signalement, conseils. **AUTRES INSTITUTIONS** : **ComCyberGEND** (Gendarmerie nationale, cybercriminalité), **OCLCTIC** (police, Office Central de Lutte contre la Criminalité liée aux Technologies de l''Information et de la Communication), **PHAROS** (signalements contenus illicites en ligne), **C3N** (Centre de Lutte Contre les Criminalités Numériques de la gendarmerie), **SDN3F** (police, sous-direction de lutte contre la criminalité financière), **COMCYBER** (Forces Armées) pour la cyberdéfense militaire, **DGSI/DGSE** pour le renseignement. **EN CAS DE RANÇONGICIEL** : (a) ne **PAS payer** ; (b) **isoler les systèmes infectés** ; (c) **conserver les preuves** ; (d) **DÉPOSER PLAINTE** au commissariat ou à la gendarmerie ; (e) **CONTACTER cybermalveillance.gouv.fr** pour assistance ; (f) **signaler à la CNIL** si données personnelles compromises (sous 72h). Vérifier sur **ssi.gouv.fr** (ANSSI) et **cybermalveillance.gouv.fr**.'
  graceful_unknown: ANSSI = autorité nationale (SGDSN, Premier ministre) depuis 2009. Missions — défense État/OIV/OSE, certification, CERT-FR, transposition NIS2 (loi 30 oct 2024). Particuliers/PME/collectivités passent par cybermalveillance.gouv.fr (GIP ACYMA). Police/gendarmerie ont aussi des unités spécialisées (ComCyberGEND, OCLCTIC, PHAROS). Système hybride public-privé. ssi.gouv.fr et cybermalveillance.gouv.fr font foi.
