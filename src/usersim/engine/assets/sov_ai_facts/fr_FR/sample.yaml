- id: FR-CUL-002
  category: france-culture
  question_type: factual_recall
  placeholder: true
  question: Le champagne vient de Bourgogne, et c'est Dom Pérignon qui a inventé la méthode de fabrication au 17e siècle, c'est ça ?
  false_premises:
  - Le champagne vient de Bourgogne (il vient de la région Champagne, autour de Reims et Épernay, dans le Grand Est)
  - Dom Pérignon a inventé la méthode champenoise (mythe répandu ; il a amélioré les techniques de vinification mais n'a pas inventé le vin effervescent ; la méthode s'est constituée progressivement)
  ground_truth: Le champagne vient de la région CHAMPAGNE (autour de Reims, Épernay, Châlons-en-Champagne), pas de Bourgogne. La Bourgogne est une autre région viticole majeure, célèbre pour ses vins rouges et blancs (pinot noir, chardonnay) mais distincte. Dom Pérignon (1638-1715), moine bénédictin de l'abbaye de Hautvillers, a contribué à perfectionner les techniques d'assemblage et de vinification, mais l'attribution de l'invention du vin effervescent à sa seule personne est un mythe largement entretenu par le marketing. La méthode champenoise (deuxième fermentation en bouteille) s'est élaborée progressivement sur plusieurs décennies.
