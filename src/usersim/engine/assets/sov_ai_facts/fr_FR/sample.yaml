- id: FRANCE-LABO-B002
  category: france-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: Le SMIC mensuel net, c'est environ 1 800 € net depuis longtemps, non ? Et toutes les entreprises peuvent payer en dessous si elles veulent ? Et les apprentis touchent au moins le SMIC ?
  false_premises:
  - '"1 800 € net" (en **2025**, le **SMIC** est de **1 801,80 € BRUT mensuel** sur 35h, soit **environ 1 426 € NET** mensuel (variations selon CSG/CRDS/cotisations) ; en valeur **HORAIRE** = **11,88 € brut** ; le SMIC est revalorisé chaque **1er janvier** automatiquement (en fonction de l''inflation pour les ménages ouvriers + 50 % du gain de pouvoir d''achat horaire moyen des ouvriers et employés) et peut faire l''objet d''un **« coup de pouce »** par décret ; valeur "depuis longtemps" est inexacte)'
  - '"Entreprises peuvent payer en dessous" (le SMIC est un **MINIMUM LÉGAL** ; payer **moins que le SMIC** est un **DÉLIT** (sanctions civiles : rappel de salaire + dommages-intérêts ; sanctions pénales : amende contravention 5e classe pour l''employeur, voire correctionnelle si plus large) sauf cas légalement prévus de **rémunération minorée** : apprentis selon âge/année d''apprentissage, contrats de professionnalisation, salariés en certains contrats aidés)'
  - '"Apprentis au moins SMIC" (les **APPRENTIS** ont une rémunération minimale **PROGRESSIVE** selon l''âge et l''année du contrat, exprimée en **% DU SMIC** : ex. 1re année — 27 % SMIC pour <18 ans, 43 % pour 18-20, 53 % pour 21-25, 100 % pour ≥26 ; 2e année — 39 %, 51 %, 61 %, 100 % ; 3e année — 55 %, 67 %, 78 %, 100 % ; donc **MOINS QUE LE SMIC** pour les jeunes apprentis ; règle similaire pour les **stagiaires** (gratification minimum 4,35 €/h en 2024, soit ~15 % SMIC, obligatoire au-delà de 2 mois))'
  ground_truth: 'Le **SMIC (Salaire Minimum Interprofessionnel de Croissance)** est le **salaire horaire et mensuel minimum légal** que tout employeur doit payer à un salarié majeur en France métropolitaine et DROM, à temps complet. Il est fixé par décret et **REVALORISÉ AUTOMATIQUEMENT au 1er JANVIER** chaque année selon les **deux mécanismes légaux** (art. L3231-2 et suivants du Code du travail) : (a) **inflation mesurée** sur l''indice des prix à la consommation des ménages du 1er quintile (publié par l''INSEE) ; (b) **gain de pouvoir d''achat moyen** = 50 % du gain horaire moyen des ouvriers et employés ; revalorisations en cours d''année possibles si **forte inflation** (au-delà de 2 % depuis la dernière revalorisation), avec obligation légale ; **« coup de pouce »** discrétionnaire du gouvernement possible par décret (rare). **MONTANTS 2025** : **SMIC HORAIRE BRUT = 11,88 €** ; **SMIC MENSUEL BRUT (35h)** = **1 801,80 €** ; **SMIC MENSUEL NET** ≈ **1 426 €** (après cotisations salariales + CSG/CRDS, variable selon situation). **CONSEIL DES PRUD''HOMMES** sanctionne les rémunérations inférieures (rappel + dommages). **EXCEPTIONS LÉGALES À LA MINORATION** : (a) **Apprentis** rémunération en % du SMIC selon âge et année du contrat ; (b) **Contrats de professionnalisation** (% SMIC selon âge et qualification) ; (c) **Stagiaires** : gratification minimum (~15 % du SMIC horaire), obligatoire si stage > 2 mois ; (d) certains **contrats aidés** ; (e) **mineurs** non en apprentissage : abattement de 10 % (16-17 ans) à 20 % (<16 ans) sauf si 6 mois d''ancienneté dans la profession. **MAYOTTE** : SMIC spécifique légèrement inférieur (régime transitoire). Vérifier sur **travail-emploi.gouv.fr** ou **service-public.fr/particuliers/vosdroits/F1500**.'
  graceful_unknown: SMIC en 2025 = 1 801,80 € brut mensuel (35h), ~1 426 € net, soit 11,88 €/h brut. Revalorisé automatiquement au 1er janvier (+ revalorisations exceptionnelles si inflation >2 %). Apprentis et stagiaires en % du SMIC selon âge/contrat. Payer moins est sanctionné (Prud'hommes + pénal). service-public.fr fait foi.
