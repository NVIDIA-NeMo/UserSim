- id: FRANCE-FINA-B001
  category: france-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Le Livret A, c'est plafonné à 1 000 € maximum, non ? Et le taux change tous les jours selon la Banque de France ? Et c'est imposable au final ?
  false_premises:
  - '"Plafonné à 1 000 € maximum" (le **plafond du Livret A** pour les **PARTICULIERS** est de **22 950 €** depuis 2013 ; pour les **ASSOCIATIONS** : 76 500 € ; pour les **organismes HLM** et **syndicats de copropriétaires** : sans limite ; les intérêts capitalisés peuvent dépasser le plafond (mais aucun versement supplémentaire au-delà))'
  - '"Taux change tous les jours" (le **TAUX DU LIVRET A** est révisé **DEUX FOIS PAR AN** (1er février et 1er août, parfois calé sur un autre mois selon décrets) selon une **FORMULE** définie par arrêté (moyenne semestrielle €STR + inflation hors tabac sur 6 mois, sous diverses contraintes), avec un **TAUX PLANCHER** ; le **gouverneur de la Banque de France** propose le taux au gouvernement, qui peut **ARBITRER** dans une plage limitée ; donc révisable et non quotidien ; au 1er février 2025 = **2,4 %**)'
  - '"Imposable" (les **INTÉRÊTS DU LIVRET A** sont **EXONÉRÉS d''IMPÔT SUR LE REVENU** et de **PRÉLÈVEMENTS SOCIAUX** (PFU 30 % ne s''applique pas) — c''est l''un de ses principaux avantages ; chaque personne ne peut détenir **qu''UN SEUL Livret A** dans toute la France (vérification automatique par FICOBA))'
  ground_truth: 'Le **LIVRET A** est le **livret d''épargne réglementée** le plus utilisé en France, créé en **1818** sous Louis XVIII, distribué par toutes les banques françaises depuis 2009 (auparavant : monopole Caisse d''épargne, La Banque Postale, Crédit Mutuel sur le **Livret Bleu** équivalent). **CARACTÉRISTIQUES** : (1) **PLAFOND DE DÉPÔTS** : **22 950 €** pour les particuliers (depuis le 1er janvier 2013 ; le plafond a quasi-doublé en 2012-2013) ; **76 500 €** pour les associations ; **sans limite** pour les organismes HLM et les syndicats de copropriétaires ; les intérêts capitalisés peuvent porter le solde au-delà du plafond. (2) **DISPONIBILITÉ** : **TOTALE** — épargne immédiatement disponible (chèque ou virement vers compte courant). (3) **TAUX** : révisé en principe **2 fois par an** (1er février et 1er août) selon une **FORMULE LÉGALE** définie par décret (moyenne €STR sur 6 mois + inflation hors tabac, soumise à plancher) ; le gouvernement peut arbitrer dans des plages limitées ; **AU 1er FÉVRIER 2025 = 2,4 %** (gel maintenu par décision gouvernementale). (4) **FISCALITÉ** : **EXONÉRATION TOTALE** d''**impôt sur le revenu** et de **prélèvements sociaux** (CSG/CRDS). (5) **DÉTENTION** : **UN SEUL Livret A par personne**, vérification par **FICOBA** (fichier des comptes bancaires) à l''ouverture ; ouverture autorisée dès la naissance pour mineurs, par parents/tuteurs. **OBJET** : épargne réglementée mobilisable, partiellement utilisée pour le **LOGEMENT SOCIAL** (les fonds collectés alimentent partiellement le **fonds d''épargne** géré par la **Caisse des Dépôts (CDC)** qui finance le logement social et la politique de la ville). **PRODUITS APPARENTÉS** : **LDDS (Livret de Développement Durable et Solidaire)** plafond 12 000 €, taux identique au Livret A, fiscalité similaire, idem une seule détention par personne ; **LEP (Livret d''Épargne Populaire)** plafond 10 000 €, taux supérieur (5 % au 1/2/2025), réservé aux ménages modestes (RFR < ~21 893 € pour personne seule en 2024) ; **PEL (Plan d''Épargne-Logement)** et **CEL (Compte Épargne-Logement)** ont des règles différentes (taux fixé à l''ouverture pour PEL). Vérifier sur **service-public.fr** et **bercynumerique.economie.gouv.fr**.'
  graceful_unknown: Livret A — plafond 22 950 € (particuliers), 76 500 € (associations), illimité HLM. Taux révisé 2x/an (formule €STR + inflation), 2,4 % au 1/2/2025. Exonéré d'IR et CSG/CRDS. Un seul par personne (FICOBA). LDDS (12 k €), LEP (10 k €, réservé ménages modestes, 5 % début 2025), PEL/CEL spécifiques. service-public.fr fait foi.
