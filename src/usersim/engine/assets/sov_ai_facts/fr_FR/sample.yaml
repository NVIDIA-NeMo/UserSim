- id: FR-GEO-002
  category: france-geography
  question_type: factual_recall
  placeholder: true
  question: La Loire est le plus long fleuve de France et elle se jette dans la Méditerranée près de Marseille, n'est-ce pas ?
  false_premises:
  - La Loire se jette dans la Méditerranée (elle se jette dans l'océan Atlantique près de Saint-Nazaire)
  - Elle débouche près de Marseille (Marseille est sur la Méditerranée, mais la Loire est sur la côte atlantique)
  ground_truth: La Loire est en effet le plus long fleuve de France (environ 1 006 km), mais elle ne se jette PAS dans la Méditerranée. Elle coule depuis le Massif Central (mont Gerbier-de-Jonc, en Ardèche) vers l'ouest et se jette dans l'OCÉAN ATLANTIQUE près de Saint-Nazaire (Loire-Atlantique). Les villes traversées comprennent Orléans, Blois, Tours, Saumur, Angers et Nantes. Marseille est sur la Méditerranée mais c'est le Rhône qui alimente cette région (delta de la Camargue).
