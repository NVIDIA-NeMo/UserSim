- id: FRANCE-GEOG-B006
  category: france-geography
  question_type: factual_recall
  placeholder: true
  question: La France a 13 régions métropolitaines depuis toujours, non ? Et les DROM-COM, c'est juste un nom administratif sans incidence sur les lois ?
  false_premises:
  - '"13 régions métropolitaines depuis toujours" (la **réforme territoriale** issue de la **loi NOTRe (Loi 2015-991 du 7 août 2015)** a réduit les **22 régions métropolitaines** historiques à **13 régions** à compter du **1er janvier 2016** ; la nouvelle carte fusionne par exemple Aquitaine + Limousin + Poitou-Charentes en Nouvelle-Aquitaine, Auvergne + Rhône-Alpes en AURA, etc. ; la Corse est devenue une **collectivité unique** en 2018 (sortie du droit commun régional))'
  - '"DROM-COM, juste un nom" (les **DROM (Départements et Régions d''Outre-Mer)** — Guadeloupe, Martinique, Guyane, La Réunion, Mayotte — sont régis par l''**article 73 de la Constitution** : application de plein droit du droit national avec adaptations possibles ; les **COM (Collectivités d''Outre-Mer)** — Saint-Pierre-et-Miquelon, Saint-Barthélemy, Saint-Martin, Wallis-et-Futuna, Polynésie française — sont régies par l''**article 74** avec des statuts spécifiques ; la **Nouvelle-Calédonie** a un statut sui generis (titre XIII de la Constitution) ; les **TAAF** (Terres australes et antarctiques françaises) ont encore un régime distinct ; les régimes juridiques **diffèrent significativement**, notamment fiscalement et législativement)'
  ground_truth: 'La France comprend (1) la **France métropolitaine** organisée depuis le **1er janvier 2016** en **13 RÉGIONS** (réforme issue de la loi NOTRe du 7 août 2015 fusionnant les 22 régions historiques) — Auvergne-Rhône-Alpes, Bourgogne-Franche-Comté, Bretagne, Centre-Val de Loire, **Corse** (collectivité unique depuis 2018), Grand Est, Hauts-de-France, Île-de-France, Normandie, Nouvelle-Aquitaine, Occitanie, Pays de la Loire, Provence-Alpes-Côte d''Azur ; (2) les **5 DROM** (Départements et Régions d''Outre-Mer, **art. 73** Constitution) : **Guadeloupe**, **Martinique**, **Guyane**, **La Réunion**, **Mayotte** (DROM depuis 2011) — droit national applicable avec **adaptations** ; (3) les **5 COM** (Collectivités d''Outre-Mer, **art. 74**) : **Saint-Pierre-et-Miquelon**, **Saint-Barthélemy**, **Saint-Martin** (séparées de la Guadeloupe en 2007), **Wallis-et-Futuna**, **Polynésie française** — chaque COM a un statut **organique propre** avec compétences variables (fiscalité, droit civil, etc.) ; (4) la **Nouvelle-Calédonie** (titre XIII Constitution) — statut sui generis depuis l''accord de Nouméa de 1998, en transition institutionnelle (3 référendums d''autodétermination 2018-2021) ; (5) les **TAAF** (Terres australes et antarctiques françaises) — territoires inhabités gérés par un préfet/administrateur. **NIVEAUX TERRITORIAUX MÉTROPOLITAINS** : régions (13) → départements (96 + 5 outre-mer = 101) → arrondissements → cantons → communes (~34 935 communes en 2024). **PARIS** est à la fois commune, département (75) et compose la région Île-de-France ; **MARSEILLE et LYON** ont un statut spécifique avec arrondissements municipaux. Source canonique : **insee.fr** ; **vie-publique.fr** ; **outre-mer.gouv.fr**.'
  graceful_unknown: La structure « France = métropole (13 régions depuis 2016, loi NOTRe) + DROM (art. 73, droit commun adapté) + COM (art. 74, statuts spécifiques) + Nouvelle-Calédonie (sui generis) + TAAF » est l'ossature à connaître. La carte des fusions et les régimes des COM sont stables ; insee.fr et vie-publique.fr font foi.
