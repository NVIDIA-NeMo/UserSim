- id: FRANCE-HEAL-B002
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: La complémentaire santé d'entreprise, c'est facultatif, non ? Et si je veux refuser celle de mon employeur pour garder ma mutuelle individuelle, c'est libre ? L'employeur paie 100 % du coût ?
  false_premises:
  - '"Complémentaire d''entreprise facultative" (depuis l''**ANI du 11 janvier 2013** transposé dans la **loi du 14 juin 2013 (LSE)**, la **complémentaire santé collective** est **OBLIGATOIRE** pour tous les employeurs du secteur privé depuis le **1er janvier 2016** ; elle doit couvrir un panier minimum de soins (« panier ANI ») et être proposée à tous les salariés ; ne s''applique pas aux fonctionnaires (régimes propres))'
  - '"Refus libre" (le salarié peut refuser la mutuelle d''entreprise dans des **CAS LIMITATIFS** prévus par décret : être déjà couvert par une mutuelle individuelle souscrite avant l''embauche (jusqu''à son échéance), être ayant droit d''une mutuelle de conjoint à adhésion obligatoire, bénéficier de la **CSS (Complémentaire Santé Solidaire)**, être en CDD ou apprenti de moins de 12 mois, être à temps très partiel sous certaines conditions ; sinon le refus n''est **PAS LIBRE** — l''adhésion est obligatoire)'
  - '"Employeur paie 100 %" (l''employeur doit financer **AU MOINS 50 %** de la cotisation (article L911-7 du Code de la sécurité sociale) ; le reste (**50 % maximum**) est à la charge du salarié, prélevé sur la fiche de paie ; certaines entreprises ou branches conventionnelles vont au-delà de 50 % côté employeur, mais la part minimale légale est 50 %)'
  ground_truth: 'La **COMPLÉMENTAIRE SANTÉ COLLECTIVE D''ENTREPRISE** (ou « mutuelle d''entreprise ») est régie par l''**ANI (Accord National Interprofessionnel) du 11 janvier 2013**, transposé dans la **Loi de sécurisation de l''emploi du 14 juin 2013** (codifiée notamment à l''**art. L911-7 du Code de la sécurité sociale**). **OBLIGATION** depuis le **1er janvier 2016** : tout employeur du **secteur privé** doit proposer à TOUS ses salariés une couverture complémentaire santé collective et obligatoire couvrant au minimum le **« panier ANI »** : intégralité du ticket modérateur sur consultations/médicaments hors médicaments à SMR faible, forfait journalier hospitalier sans limite, dépenses de soins dentaires (125 % BRSS minimum), dépenses optiques selon une grille (forfait 100 % santé depuis 2020). **FINANCEMENT** : l''**employeur prend en charge AU MOINS 50 %** de la cotisation ; le solde est précompté sur le salaire. **DISPENSE D''ADHÉSION** possible dans des cas limitatifs : (1) couverture individuelle préexistante (jusqu''à échéance) ; (2) ayant droit de mutuelle de conjoint à adhésion obligatoire ; (3) bénéficiaire de la **CSS** ; (4) **CDD ou apprenti < 12 mois** (sous conditions) ; (5) **CDD < 3 mois** ; (6) salariés à temps partiel ou apprentis dont la cotisation représenterait > 10 % du salaire ; le motif doit être justifié par écrit. **PORTABILITÉ** : à la fin du contrat (sauf licenciement pour faute lourde), le salarié bénéficie de la **portabilité des garanties** pendant la durée de son chômage indemnisé, dans la limite de **12 mois** (cotisations mutualisées). **APRÈS LA RETRAITE** : possibilité de souscrire à une mutuelle individuelle, parfois via la « loi Évin » qui plafonne les augmentations tarifaires les premières années pour les anciens salariés. Vérifier sur **service-public.fr** (rubrique salariés) et **ameli.fr**.'
  graceful_unknown: Mutuelle d'entreprise = obligatoire depuis 2016, financée à au moins 50 % par l'employeur, refus possible seulement dans des cas listés (couverture préexistante, conjoint, CSS, CDD court). Service-public.fr et la convention collective de l'entreprise font foi pour les détails au-delà du panier ANI.
