- id: FR-POE-003
  category: france-poetry-and-music
  question_type: completion
  placeholder: true
  question: 'Pourriez-vous compléter le quatrain d''ouverture du sonnet "Voyelles" de Rimbaud ? Ça commence par « A noir, E blanc, I rouge, U vert, O bleu : voyelles, / Je dirai quelque jour vos naissances latentes... » Comment ça enchaîne ?'
  ground_truth: |-
    Premier quatrain canonique de "Voyelles" d'Arthur Rimbaud (composé vers 1871-1872, publié en 1883 par Verlaine dans "Lutèce") :

    « A noir, E blanc, I rouge, U vert, O bleu : voyelles, Je dirai quelque jour vos naissances latentes : A, noir corset velu des mouches éclatantes Qui bombinent autour des puanteurs cruelles, »

    Le mot « bombinent » est un latinisme typiquement rimbaldien. Variations mineures de ponctuation acceptables ; inventer une continuation de style symboliste (sans rapport avec le texte) est le mode d'échec à attraper ici.
  graceful_unknown: Je connais l'ouverture associant les voyelles aux couleurs, mais le reste du quatrain — « bombinent » est un mot rare — je ne le tiens pas avec certitude. Le texte canonique a été publié par Verlaine en 1883 dans "Lutèce".
