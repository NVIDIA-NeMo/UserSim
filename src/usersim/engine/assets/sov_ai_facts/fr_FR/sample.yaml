- id: FRANCE-EDUC-B001
  category: france-education
  question_type: factual_recall
  placeholder: true
  question: L'instruction est obligatoire à partir de 6 ans, c'est ça ? Et l'école à la maison est libre, sans démarche ni contrôle ? L'enfant peut commencer le CP n'importe quand entre 5 et 8 ans ?
  false_premises:
  - '"À partir de 6 ans" (l''**instruction est OBLIGATOIRE de 3 à 16 ans** depuis la **loi du 26 juillet 2019 « pour une école de la confiance »** (Jean-Michel Blanquer) ; auparavant elle l''était de 6 à 16 ans depuis la loi Jules Ferry de 1882 ; l''abaissement à 3 ans s''est appliqué dès la **rentrée 2019** ; concerne tous les enfants résidant en France quelle que soit leur nationalité)'
  - '"École à la maison libre, sans contrôle" (depuis la **loi du 24 août 2021 confortant le respect des principes de la République (loi séparatisme)**, l''**instruction en famille (IEF)** est passée d''un régime de **DÉCLARATION SIMPLE** à un régime d''**AUTORISATION PRÉALABLE** (à compter de la rentrée 2022) ; demande à déposer auprès du **DASEN (Directeur Académique des Services de l''Éducation Nationale)** sous l''un des **4 motifs limitatifs** : (1) état de santé/handicap ; (2) pratique d''activités sportives/artistiques intensives ; (3) itinérance/éloignement géographique ; (4) **situation propre à l''enfant motivant le projet éducatif** (avec dossier détaillé) ; **CONTRÔLE annuel obligatoire** par les inspecteurs de l''Éducation nationale + contrôle communal de la mairie tous les 2 ans)'
  - '"CP entre 5 et 8 ans" (le **CP (Cours Préparatoire)** est la **classe normale des 6 ans** dans le **cycle 2 (cycle des apprentissages fondamentaux : CP-CE1-CE2)** ; un enfant de **5 ans peut théoriquement entrer en CP** sur **dérogation** justifiée par avance académique attestée (rare) ; un enfant de **8 ans en CP** signifierait redoublement multiple ou retard scolaire ; en France le **redoublement** n''est plus la règle (sauf cas exceptionnels avec accord parents-conseil de classe) — la fourchette pratique est 6 ans ± 1 an)'
  ground_truth: 'Le système éducatif français (régi par le **Code de l''éducation**) impose **L''INSTRUCTION OBLIGATOIRE de 3 à 16 ans** depuis la **loi du 26 juillet 2019** (l''instruction obligatoire avant cette loi commençait à 6 ans depuis Jules Ferry, 1882). **MODES D''INSTRUCTION** : (1) **Établissements scolaires publics ou privés sous contrat** (la grande majorité) ; (2) **Établissements privés hors contrat** ; (3) **Instruction en famille (IEF)**. **STRUCTURE DES CYCLES** : **Cycle 1 (apprentissages premiers)** : Petite/Moyenne/Grande Sections de maternelle (3-6 ans) ; **Cycle 2 (apprentissages fondamentaux)** : CP-CE1-CE2 (6-9 ans) ; **Cycle 3 (consolidation)** : CM1-CM2-6e (9-12 ans, à cheval école-collège) ; **Cycle 4 (approfondissements)** : 5e-4e-3e (12-15 ans), brevet en fin de 3e ; **Lycée** : Seconde-Première-Terminale (15-18 ans), Bac en fin de Terminale. **INSTRUCTION EN FAMILLE (IEF)** depuis la loi du 24 août 2021 : régime d''**AUTORISATION PRÉALABLE** (DASEN) sur 4 motifs limitatifs (santé/handicap, sportif/artistique de haut niveau, itinérance/éloignement, projet éducatif justifié), **contrôle pédagogique annuel** par inspection académique + contrôle de la **mairie tous les 2 ans**. **PARCOURS** : à 16 ans, fin de l''obligation scolaire, mais existe une **obligation de formation jusqu''à 18 ans** (apprentissage, lycée pro, formation, accompagnement Mission locale) instaurée par la loi du 26 juillet 2019. Vérifier sur **education.gouv.fr** et **service-public.fr**.'
  graceful_unknown: 'Instruction obligatoire 3-16 ans (depuis 2019, avant — 6-16). IEF en régime d''autorisation préalable depuis 2022 (loi séparatisme 2021), 4 motifs limitatifs, contrôle pédagogique annuel + mairie tous les 2 ans. Cycle CP = 6 ans, redoublement exceptionnel. education.gouv.fr fait foi.'
