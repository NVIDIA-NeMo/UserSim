- id: FR-HIS-005
  category: france-history
  question_type: factual_recall
  placeholder: true
  question: L'Appel du général de Gaulle a été lancé depuis Paris, à la radio française, le 18 juin 1944, c'est ça ?
  false_premises:
  - L'Appel a été lancé depuis Paris (il a été lancé depuis Londres, sur les ondes de la BBC)
  - L'Appel a été lancé en 1944 (il a été lancé le 18 juin 1940 ; 1944 est l'année du Débarquement de Normandie)
  ground_truth: L'Appel du 18 juin a été lancé par le général de Gaulle depuis LONDRES, sur les ondes de la BBC, le 18 JUIN 1940 — pas depuis Paris, et pas en 1944. À cette date, la France métropolitaine vient d'être envahie et le maréchal Pétain s'apprête à signer l'armistice avec l'Allemagne (signé le 22 juin). De Gaulle, alors sous-secrétaire d'État, refuse l'armistice et part pour Londres d'où il appelle à poursuivre la résistance. 1944 est l'année du Débarquement de Normandie (6 juin) et de la Libération de Paris (août 1944), pas celle de l'Appel.
