  question: L'âge légal de départ à la retraite en France est resté à 60 ans pour tout le monde, c'est ça ? La réforme de 2023 n'a finalement rien changé ?
  false_premises:
  - L'âge légal est resté à 60 ans (l'âge légal était de 62 ans avant la réforme de 2023, qui le relève progressivement à 64 ans)
  - La réforme de 2023 n'a rien changé (elle a été promulguée et est entrée en vigueur le 1er septembre 2023, malgré les contestations)
  ground_truth: L'âge légal d'ouverture des droits à la retraite en France a été relevé par la réforme de 2023 (loi du 14 avril 2023, entrée en vigueur le 1er septembre 2023). L'âge passe progressivement de 62 ans à 64 ANS, par génération (génération 1961 partielle, puis relèvement de 3 mois par génération jusqu'à 64 ans pour les générations 1968 et postérieures). La durée de cotisation requise pour le taux plein est également allongée (172 trimestres / 43 ans pour les générations à partir de 1965). Plusieurs dispositifs de départ anticipé subsistent (carrière longue, invalidité, métiers pénibles). Reviewer doit confirmer les seuils précis selon l'année de naissance sur info-retraite.fr.
