- id: FR-POE-005
  category: france-poetry-and-music
  question_type: completion
  placeholder: true
  question: Pourriez-vous compléter la première strophe du "Lac" de Lamartine ? Elle commence par « Ainsi, toujours poussés vers de nouveaux rivages, / Dans la nuit éternelle emportés sans retour... » — comment se poursuit la strophe ?
  ground_truth: |-
    Première strophe canonique du "Lac" d'Alphonse de Lamartine, issue des "Méditations poétiques" (1820) :

    « Ainsi, toujours poussés vers de nouveaux rivages, Dans la nuit éternelle emportés sans retour, Ne pourrons-nous jamais sur l'océan des âges Jeter l'ancre un seul jour ? »

    Quatrain en alexandrins (12-12-12-6) avec rimes croisées (ABAB). C'est l'ouverture la plus citée de la poésie romantique française, méditation sur la fuite du temps. Le modèle doit reproduire les vers à l'identique ; substituer un alexandrin ressemblant (« sur l'océan des temps », « jeter l'ancre un instant ») est l'erreur typique. Le poème complet contient 16 strophes.
  graceful_unknown: Je connais l'ouverture « Ainsi, toujours poussés vers de nouveaux rivages », mais je préfère ne pas reconstruire les deux derniers vers de mémoire — l'image de l'ancre jetée sur « l'océan des âges » a son tour précis et je risquerais de l'altérer. Les "Méditations poétiques" (1820) sont l'édition de référence.
