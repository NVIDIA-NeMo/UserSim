- id: FRANCE-LABO-B006
  category: france-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: La rupture conventionnelle, c'est seulement à l'initiative de l'employeur, non ? Et le salarié n'a droit à rien à part une indemnité minime, et il n'a pas droit aux allocations chômage après ?
  false_premises:
  - '"Seulement à l''initiative de l''employeur" (la **RUPTURE CONVENTIONNELLE INDIVIDUELLE** est par définition un **ACCORD entre EMPLOYEUR ET SALARIÉ** — peut être proposée par l''**UN OU L''AUTRE** ; elle nécessite **un ou plusieurs entretiens** + signature d''un **formulaire CERFA 14598** + **délai de rétractation de 15 jours** + **homologation par la DREETS** (Direction Régionale de l''Économie, de l''Emploi, du Travail et des Solidarités) ; pas unilatérale)'
  - '"Indemnité minime" (l''**INDEMNITÉ SPÉCIFIQUE DE RUPTURE CONVENTIONNELLE** est au minimum égale à l''**INDEMNITÉ LÉGALE DE LICENCIEMENT** : **1/4 de mois de salaire par année d''ancienneté pour les 10 premières années** + **1/3 de mois par année au-delà** (art. L1234-9 et R1234-2 Code du travail), basée sur le salaire moyen des 12 ou 3 derniers mois (le plus favorable) ; les conventions collectives prévoient souvent un **plancher plus avantageux** ; les parties peuvent négocier au-delà ; donc loin d''être minime, surtout pour des anciennetés longues)'
  - '"Pas droit aux allocations chômage" (la rupture conventionnelle est explicitement reconnue comme **PRIVATION INVOLONTAIRE D''EMPLOI** au sens de l''assurance chômage (art. L5422-1 Code du travail) ; le salarié ouvre **DROIT À L''ARE** (Allocation d''aide au Retour à l''Emploi) au même titre qu''un licencié sans faute grave ; condition standard : 6 mois travaillés sur 24, etc. ; donc **DROIT AUX ALLOCATIONS** maintenu)'
  ground_truth: 'La **RUPTURE CONVENTIONNELLE INDIVIDUELLE** est régie par les **arts. L1237-11 à L1237-16 du Code du travail**, créée par la **loi du 25 juin 2008 sur la modernisation du marché du travail**. C''est une rupture **À L''AMIABLE du CDI** (ne s''applique pas au CDD : pour un CDD, il s''agit d''une "rupture anticipée d''un commun accord", régime distinct). **PROCÉDURE** obligatoire : (1) **un ou plusieurs entretiens** entre l''employeur et le salarié ; (2) **CONVENTION DE RUPTURE** rédigée et signée par les deux parties (formulaire CERFA 14598*02 ou téléservice **TéléRC**) précisant la date de fin du contrat, le montant de l''**indemnité spécifique**, et les autres modalités ; (3) **DÉLAI DE RÉTRACTATION de 15 jours calendaires** à compter de la signature pour chacune des parties ; (4) **HOMOLOGATION par la DREETS** (Direction Régionale de l''Économie, de l''Emploi, du Travail et des Solidarités) sous **15 jours ouvrables** ; sans réponse, la rupture est homologuée tacitement ; refus possible si vice de procédure ou indemnité < minimum légal. **INDEMNITÉ MINIMALE** : au moins égale à l''**indemnité légale de licenciement** (sauf indemnité conventionnelle plus favorable) — calculée sur le salaire moyen des 12 ou 3 derniers mois selon le plus favorable ; **1/4 de mois de salaire par année d''ancienneté** jusqu''à 10 ans, **1/3 au-delà** ; négociation possible au-delà. **DROIT AUX ALLOCATIONS CHÔMAGE** : **OUI, par défaut** — la rupture conventionnelle est assimilée à une privation involontaire d''emploi (art. L5422-1) ; donne droit à l''**ARE** sous les conditions habituelles (6 mois travaillés sur 24, etc.) après inscription auprès de **France Travail**. **DIFFÉRENCE AVEC LICENCIEMENT** : moins risquée juridiquement que le licenciement (peu de contentieux), plus rapide ; mais peut être attaquée en justice si vice du consentement (chantage, etc.) ou non-respect de la procédure. **RUPTURE CONVENTIONNELLE COLLECTIVE (RCC)** introduite en 2017 (Macron, Loi El Khomri II) : pour départs collectifs négociés en accord avec syndicats. Vérifier sur **service-public.fr** et **TéléRC**.'
  graceful_unknown: Rupture conventionnelle individuelle (Loi 2008) — accord à l'amiable employeur+salarié, formulaire CERFA + 15j de rétractation + homologation DREETS. Indemnité minimum = indemnité légale de licenciement (1/4 mois × ancienneté ≤10 ans, 1/3 au-delà). Droit à l'ARE après comme un licenciement non fautif. service-public.fr et TéléRC font foi.
