- id: FRANCE-FINA-B003
  category: france-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: Le PEA, c'est juste un compte-titres comme les autres, taxé pareil ? Je peux y mettre des actions américaines et chinoises ? Et après 2 ans c'est défiscalisé ?
  false_premises:
  - '"Compte-titres comme les autres, taxé pareil" (le **PEA (Plan d''Épargne en Actions)** est un **dispositif d''épargne fiscalement avantageux** distinct du compte-titres ordinaire (CTO) ; après **5 ans**, les **plus-values et dividendes sont EXONÉRÉS d''IR** (mais pas des prélèvements sociaux à 17,2 %) ; avant 5 ans, retrait anticipé entraîne **clôture** et imposition à 12,8 % (avant 2019 : 22,5 % avant 2 ans, 19 % entre 2 et 5))'
  - '"Actions américaines et chinoises" (le PEA est **LIMITÉ aux actions et OPCVM européens** : titres d''**émetteurs ayant leur siège dans un État de l''Union européenne ou de l''EEE** (Islande, Norvège, Liechtenstein) **HORS Suisse, UK depuis Brexit, USA, Chine** ; pour des actions américaines/chinoises, il faut un **Compte-Titres Ordinaire (CTO)** ; certains OPCVM "PEA-éligibles" peuvent contenir une part minoritaire de titres extra-européens, mais l''ossature reste UE/EEE)'
  - '"Après 2 ans c''est défiscalisé" (l''**EXONÉRATION D''IR** (mais pas des prélèvements sociaux 17,2 %) commence après **5 ANS** de détention du PEA, **PAS 2 ans** ; avant 5 ans, retrait = clôture + imposition (12,8 % depuis 2018) ; depuis 2019, retrait après 5 ans n''entraîne plus de clôture (seulement avant 5 ans))'
  ground_truth: 'Le **PEA (Plan d''Épargne en Actions)** est un dispositif d''**épargne fiscalement avantageux** créé par la **loi du 16 juillet 1992**, destiné à financer l''économie européenne. **TYPES DE PEA** : (1) **PEA classique** (bancaire ou assurance) : plafond de versements **150 000 €** ; (2) **PEA-PME** créé en 2014 : plafond **225 000 €** (PEA classique + PEA-PME, les versements sont cumulés sans dépasser 225 000 € au total) ; investit dans les ETI/PME européennes ; (3) **PEA Jeunes** (depuis 2019) pour 18-25 ans rattachés au foyer fiscal des parents : plafond 20 000 €, transformé automatiquement en PEA classique au détachement. **CARACTÉRISTIQUES** : (a) **TITRES ÉLIGIBLES** : actions et certificats d''investissement de **sociétés ayant leur siège dans l''UE ou l''EEE** (Islande, Norvège, Liechtenstein) ; OPCVM (FCP, SICAV) investis à **75 % minimum** en titres éligibles ; ETF « PEA-compatibles » via réplication synthétique (ex. ETF Amundi PEA Monde) ; **EXCLUSIONS** : Suisse, USA, Chine, Asie, UK depuis Brexit (sauf période transitoire) ; **également exclus** : SCPI, OPCI, parts de SARL, obligations directes, bons du Trésor. (b) **FISCALITÉ AVANTAGEUSE après 5 ANS** : exonération d''**IR** sur plus-values et dividendes en cas de retrait ou rachat partiel après 5 ans ; **PRÉLÈVEMENTS SOCIAUX (17,2 %)** dus sur les gains. (c) **RETRAIT AVANT 5 ANS** : clôture obligatoire + plus-values imposées au **PFU (12,8 % IR + 17,2 % PS = 30 %)** ou option barème progressif ; sauf cas exceptionnels (licenciement, invalidité 2e/3e cat, retraite anticipée). (d) **DEPUIS 2019 (loi PACTE)** : retraits partiels après 5 ans **n''entraînent plus la clôture** ; possibilité de **continuer à verser** après 5 ans même en ayant déjà retiré. (e) **TRANSFERT** entre établissements possible. (f) **DÉCÈS** : clôture du PEA, mais possibilité de transmission des titres au **conjoint survivant** sans plus-value imposable. Vérifier sur **economie.gouv.fr** et **impots.gouv.fr** (rubrique épargne).'
  graceful_unknown: PEA — plafond 150 k € (classique) / 225 k € (avec PEA-PME). Titres UE/EEE uniquement (pas USA/Chine/UK/Suisse). Exonération IR après 5 ans (mais pas PS 17,2 %) ; avant 5 ans, retrait = clôture + PFU 30 %. Loi PACTE 2019 a assoupli les règles post-5 ans. Pas confondre avec CTO (compte-titres ordinaire) qui accepte tous les marchés mais sans avantage fiscal. economie.gouv.fr fait foi.
