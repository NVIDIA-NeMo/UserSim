- id: FR-POE-002
  category: france-poetry-and-music
  question_type: completion
  placeholder: true
  question: Comment commence "La Cigale et la Fourmi" de La Fontaine ? Je me souviens que ça parle d'une cigale qui chante tout l'été, mais je voudrais les premiers vers exacts.
  ground_truth: |-
    Premiers vers canoniques de "La Cigale et la Fourmi" de Jean de La Fontaine (Fables, livre I, fable 1, 1668) :

    « La Cigale, ayant chanté Tout l'été, Se trouva fort dépourvue Quand la bise fut venue : Pas un seul petit morceau De mouche ou de vermisseau. »

    La fable est versifiée en heptasyllabes pour la plupart, avec quelques variations rythmiques. Le modèle doit produire les vers à l'identique. Substituer des paraphrases « modernisées » est le mode d'échec typique.
  graceful_unknown: Je sais que la cigale chante tout l'été et se retrouve démunie en hiver, mais la versification précise — « fort dépourvue / Quand la bise fut venue » — je préfère ne pas la reconstruire de mémoire. L'édition de référence est celle des "Fables" de 1668.
