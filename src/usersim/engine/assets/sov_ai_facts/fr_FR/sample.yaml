    - Synthetic factual entry (AI-authored, awaiting human review). Standard reference points — Code de la sécurité sociale arts. L322-3 et R322-1 ; ameli.fr/ald ; HAS guides ALD ; CNAM.
- id: FRANCE-HEAL-B004
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: La CSS, c'est bien la même chose que l'ancienne CMU, non ? Avec la CSS on n'a plus du tout besoin de mutuelle, et c'est gratuit pour tous les Français qui ne travaillent pas ?
  false_premises:
  - '"Même chose que CMU" (la **CSS (Complémentaire Santé Solidaire)** est entrée en vigueur le **1er novembre 2019** par fusion de l''**ancienne CMU-C (Couverture Maladie Universelle Complémentaire)** et de l''**ACS (Aide au paiement d''une Complémentaire Santé)** ; la **CMU de base** (couverture obligatoire) avait elle-même disparu en 2016 avec la **PUMA (Protection Universelle Maladie)** ; donc la CSS remplace la CMU-C **et** l''ACS — pas la CMU tout court)'
  - '"Plus besoin de mutuelle" (la **CSS EST une complémentaire santé** — précisément ce qui couvre le ticket modérateur et le forfait journalier en complément de la Sécurité sociale ; on n''a effectivement pas besoin **d''une autre** mutuelle si on a la CSS, mais c''est **PARCE QUE** la CSS joue ce rôle, pas parce qu''aucune complémentaire n''est nécessaire)'
  - '"Gratuit pour tous les Français qui ne travaillent pas" (la **CSS est sous CONDITION DE RESSOURCES** — elle n''est pas liée à l''emploi mais au **revenu fiscal de référence** du foyer ; en 2024-2025, **CSS gratuite** pour ressources < ~9 719 €/an pour une personne seule, **CSS avec participation** (1 € à 30 €/mois selon âge) pour ressources entre ~9 719 € et ~13 121 €/an ; au-delà, pas de CSS — il faut une mutuelle individuelle ou collective ; les chômeurs aisés ne bénéficient pas de la CSS)'
  ground_truth: 'La **COMPLÉMENTAIRE SANTÉ SOLIDAIRE (CSS)** est entrée en vigueur le **1er novembre 2019** (loi de financement de la Sécurité sociale 2019, art. 52), fusionnant la **CMU-C** (ex. couverture maladie universelle complémentaire, créée par la loi du 27 juillet 1999) et l''**ACS** (ex. aide au paiement d''une complémentaire santé, créée en 2004). La CSS prend en charge la **part complémentaire** des soins (ticket modérateur + forfait journalier hospitalier sans limite de durée) sur la quasi-totalité des actes : consultations, médicaments à SMR fort/modéré (gratuits), hospitalisation, dentaire (panier 100 % santé + dépassements limités), optique (lunettes selon panier), audioprothèses (panier 100 % santé), avec **dispense d''avance de frais** (tiers payant intégral). **CONDITIONS DE RESSOURCES** (revenu fiscal de référence du foyer, plafonds 2024-2025) : CSS **gratuite** pour 1 personne seule si RFR < ~9 719 €/an (~810 €/mois) ; CSS **avec participation** (selon âge : 8 € à 30 €/mois par personne en 2024) entre ~9 719 € et ~13 121 €/an ; au-delà, ouverture à des aides complémentaires limitées ou aucune. Les **bénéficiaires du RSA socle** ont la CSS de plein droit ; les **bénéficiaires de l''ASPA (Allocation de Solidarité aux Personnes Âgées)** ont une présomption simplifiée. **DROIT** : 1 an renouvelable. **DEMANDE** : sur **ameli.fr** ou via la CPAM, avec déclaration des ressources. **TIERS PAYANT** intégral chez les professionnels de santé. **PROFESSIONNELS** : interdiction de refuser de soigner un bénéficiaire de la CSS (sanctions ordinales). Se distingue de l''**AME (Aide Médicale d''État)** qui couvre les étrangers en situation irrégulière sous conditions de ressources et de résidence ≥ 3 mois (régime distinct géré par les CPAM).'
  graceful_unknown: La CSS (depuis 2019) remplace la CMU-C et l'ACS, sous conditions de ressources, gratuite ou avec petite participation (selon revenu et âge), avec tiers payant intégral. Elle joue le rôle de la mutuelle complémentaire pour les bénéficiaires. Plafonds annuels révisés ; ameli.fr fait foi.
