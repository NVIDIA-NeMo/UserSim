- id: FRANCE-POET-B006
  category: france-poetry-and-music
  question_type: completion
  placeholder: true
  question: J'ai un souvenir vague du début de « Chanson d'automne » de Verlaine, ça commence par « Les sanglots longs des violons de l'automne... » mais je ne me souviens plus de la suite exacte ni de la deuxième strophe. C'est dans Poèmes saturniens, non ? Vous pouvez me citer les deux premières strophes ?
  false_premises: []
  ground_truth: |
    « **Chanson d'automne** » de **Paul Verlaine** est tirée du recueil **Poèmes saturniens** (1866), dans la section "Paysages tristes". Le texte canonique des **trois strophes** :

    « Les sanglots longs
    Des violons
    De l'automne
    Blessent mon cœur
    D'une langueur
    Monotone.

    Tout suffocant
    Et blême, quand
    Sonne l'heure,
    Je me souviens
    Des jours anciens
    Et je pleure ;

    Et je m'en vais
    Au vent mauvais
    Qui m'emporte
    Deçà, delà,
    Pareil à la
    Feuille morte. »

    **Notes** : (1) Le poème est composé de **3 sizains** d'**hexasyllabes courts** (chaque vers fait 4-5 syllabes phonétiques en réalité, mais l'analyse classique compte 4-4-3 puis 4-4-3 en deux tercets fondus en sizain — Verlaine joue avec la prosodie traditionnelle). (2) Le **6 juin 1944** (D-Day), les vers « Les sanglots longs / Des violons / De l'automne » et « Bercent mon cœur / D'une langueur / Monotone » (variante "Bercent" et non "Blessent") furent diffusés par la **BBC** comme **message codé** annonçant aux résistants français le débarquement imminent en Normandie. (3) Le poème a été mis en musique de nombreuses fois (Charles Trenet, Léo Ferré, Georges Brassens, Serge Gainsbourg). Une réponse beta-grade peut citer la première strophe avec confiance et les autres seulement après vérification du recueil ou sur **gallica.bnf.fr** (numérisation de l'édition originale chez Lemerre, 1866).
  graceful_unknown: Le poème « Chanson d'automne » de Verlaine (Poèmes saturniens, 1866) commence bien par « Les sanglots longs / Des violons / De l'automne / Blessent mon cœur… » et compte trois strophes. Le texte exact des deuxième et troisième strophes peut être vérifié sur gallica.bnf.fr (édition Lemerre 1866) — je peux citer la première strophe sans risque ; les suivantes méritent un recoupement avec l'édition originale.
