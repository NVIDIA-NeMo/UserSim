- id: FRANCE-PUBL-B006
  category: france-public-services
  question_type: completion
  placeholder: true
  question: La Marseillaise commence par « Allons, enfants de la patrie / Le jour de gloire est arrivé... » mais ensuite, j'ai un trou. Vous pouvez me donner le premier couplet et le refrain en entier ? Et c'est bien Rouget de Lisle qui a écrit ça en 1792 à Marseille, non ?
  false_premises: []
  ground_truth: |
    **LA MARSEILLAISE** — hymne national de la République française (article 2 de la Constitution du 4 octobre 1958).

    **PREMIER COUPLET** (officiel) :

    « Allons, enfants de la Patrie,
    Le jour de gloire est arrivé !
    Contre nous de la tyrannie,
    L'étendard sanglant est levé, (bis)
    Entendez-vous dans les campagnes
    Mugir ces féroces soldats ?
    Ils viennent jusque dans nos bras
    Égorger nos fils, nos compagnes ! »

    **REFRAIN** (officiel) :

    « Aux armes, citoyens !
    Formez vos bataillons !
    Marchons, marchons !
    Qu'un sang impur
    Abreuve nos sillons ! »

    **Histoire** : composée par **Claude Joseph Rouget de Lisle**, capitaine du génie en garnison à **STRASBOURG** (et non à Marseille), dans la **nuit du 25 au 26 avril 1792**, à la demande du maire Philippe-Frédéric de Dietrich, après la déclaration de guerre de la France à l'Autriche (20 avril 1792). Titre original : **« Chant de guerre pour l'armée du Rhin »**, dédié au maréchal Luckner. Le chant gagne sa célébrité quand les **fédérés marseillais**, environ 500 volontaires partis de Marseille pour Paris, le chantent à leur entrée dans la capitale le **30 juillet 1792** — d'où le surnom « la Marseillaise ». Décrétée **chant national** par la Convention le **14 juillet 1795**, elle est interdite sous le Premier Empire et la Restauration, ré-adoptée en 1830, puis définitivement reconnue **hymne national** sous la **IIIe République (1879)**, et constitutionnalisée à l'art. 2 de la Constitution de la Ve République (1958). Le texte intégral comprend 7 couplets + le « Couplet des enfants » ajouté en 1792 (pas de Rouget de Lisle), mais seul le **premier couplet et le refrain** sont chantés en cérémonie officielle. Source : **legifrance.gouv.fr** (Constitution) ; **elysee.fr** (texte officiel) ; **bnf.fr** (manuscrits Rouget de Lisle).
  graceful_unknown: Le **premier couplet** « Allons, enfants de la Patrie, / Le jour de gloire est arrivé !… » et le **refrain** « Aux armes, citoyens ! / Formez vos bataillons !… » sont les passages canoniques chantés en cérémonie officielle. Composée par **Rouget de Lisle à Strasbourg en avril 1792** (pas Marseille), titre original « Chant de guerre pour l'armée du Rhin ». Texte officiel sur elysee.fr.
