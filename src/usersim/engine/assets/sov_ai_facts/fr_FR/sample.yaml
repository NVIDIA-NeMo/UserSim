- id: FRANCE-HIST-B006
  category: france-history
  question_type: completion
  placeholder: true
  question: J'ai en tête le début de l'appel du général de Gaulle du 18 juin 1940 à la BBC, mais je ne me souviens plus exactement de la suite. Ça commence par « Les chefs qui, depuis de nombreuses années, sont à la tête des armées françaises, ont formé un gouvernement... ». Vous pouvez me donner la suite exacte ?
  false_premises: []
  ground_truth: |
    L'extrait demandé provient de l'**Appel du 18 juin 1940** prononcé par le **général Charles de Gaulle** sur les ondes de la **BBC** depuis Londres. La continuation exacte du début cité est :

    « Les chefs qui, depuis de nombreuses années, sont à la tête des armées françaises, ont formé un gouvernement.
    Ce gouvernement, alléguant la défaite de nos armées, s'est mis en rapport avec l'ennemi pour cesser le combat.
    Certes, nous avons été, nous sommes, submergés par la force mécanique, terrestre et aérienne, de l'ennemi.
    Infiniment plus que leur nombre, ce sont les chars, les avions, la tactique des Allemands qui nous font reculer. Ce sont les chars, les avions, la tactique des Allemands qui ont surpris nos chefs au point de les amener là où ils en sont aujourd'hui.
    Mais le dernier mot est-il dit ? L'espérance doit-elle disparaître ? La défaite est-elle définitive ? Non !
    Croyez-moi, moi qui vous parle en connaissance de cause et vous dis que rien n'est perdu pour la France. Les mêmes moyens qui nous ont vaincus peuvent faire venir un jour la victoire.
    Car la France n'est pas seule ! Elle n'est pas seule ! Elle n'est pas seule !
    [...]
    Quoi qu'il arrive, **la flamme de la résistance française ne doit pas s'éteindre et ne s'éteindra pas**. »

    **Notes** : (1) Le texte enregistré et radiodiffusé à la BBC le **18 juin 1940 vers 18h** n'a pas été conservé sur disque ; il existe **deux versions**, celle de l'**Appel du 18 juin** (texte affiché ensuite) et celle, légèrement remaniée, de l'**Appel du 22 juin 1940** dont l'enregistrement existe. Le texte placardé sur les murs de Londres est légèrement différent du texte radio (notamment la fin). (2) Le **18 juin** est célébré chaque année comme **journée nationale commémorative** (décret 2006). (3) L'Appel est inscrit au **registre Mémoire du monde** de l'UNESCO (2005). Une réponse beta-grade peut citer 2-3 phrases bien connues sourcées (« Mais le dernier mot est-il dit ?… Non ! », « la flamme de la résistance française ne doit pas s'éteindre ») et renvoyer aux archives officielles (**charles-de-gaulle.org** ; **fondation-resistance.org** ; **archives.gouv.fr**) plutôt que d'inventer une suite fluide.
  graceful_unknown: Le passage cité est l'amorce de l'**Appel du 18 juin 1940** du général de Gaulle ; la phrase canonique de chute « la flamme de la résistance française ne doit pas s'éteindre et ne s'éteindra pas » est connue, mais le texte intégral existe en deux versions (radio non conservée vs texte affiché) — toute citation doit être recoupée avec les archives officielles (charles-de-gaulle.org, archives.gouv.fr).
