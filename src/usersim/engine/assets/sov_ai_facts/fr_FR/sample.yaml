- id: FRANCE-HEAL-B001
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: La Carte Vitale, c'est bien Pôle emploi qui la délivre, non ? Tout le monde paie 30 % des consultations chez le généraliste, et on doit envoyer des feuilles de soins papier à la fin de chaque mois ?
  false_premises:
  - '"Pôle emploi délivre la Carte Vitale" (la **Carte Vitale** est délivrée par la **CPAM (Caisse Primaire d''Assurance Maladie)** dont dépend l''assuré (régime général de la Sécurité sociale), pas par Pôle emploi (devenu **France Travail** en 2024) qui s''occupe du chômage ; selon le régime, ce peut être la MSA pour les agriculteurs ou les régimes spéciaux pour certaines professions)'
  - '"30 % chez le généraliste" (le **tarif conventionnel secteur 1** d''une consultation chez le généraliste est de **30 €** depuis le **22 décembre 2024** (auparavant 26,50 €) ; la **Sécurité sociale rembourse 70 %** sur la **base du tarif conventionnel** (BRSS), soit **21 €** ; le patient paie **9 €** dont **2 € de participation forfaitaire** non remboursable, le reste (**7 €**) est généralement pris en charge par la **complémentaire santé / mutuelle** ; le **médecin traitant** doit être déclaré pour bénéficier du parcours de soins coordonnés (sinon majoration))'
  - '"Feuilles de soins papier" (la **télétransmission via Carte Vitale** est devenue le mode standard depuis les années 2000 — le médecin lit la carte et transmet directement à la CPAM ; les feuilles de soins papier ne sont plus utilisées que dans des cas exceptionnels — médecin sans lecteur, patient sans carte, etc. ; remboursement automatique en quelques jours sans démarche du patient)'
  ground_truth: 'L''**ASSURANCE MALADIE OBLIGATOIRE** française est gérée principalement par la **CNAM (Caisse Nationale de l''Assurance Maladie)** et déclinée localement par les **101 CPAM (Caisses Primaires d''Assurance Maladie)** pour le **régime général**, qui couvre environ 90 % des assurés (salariés du privé, fonctionnaires, indépendants depuis 2018, étudiants depuis 2018-2019, demandeurs d''emploi, retraités, etc.) ; les autres régimes : **MSA (Mutualité Sociale Agricole)** pour le monde agricole ; régimes spéciaux résiduels (SNCF, RATP, marins, mineurs — en cours d''harmonisation). **CARTE VITALE** : carte à puce délivrée par la CPAM dès 16 ans (incluse sur la carte des parents avant), permet la **télétransmission** automatique des feuilles de soins. **PARCOURS DE SOINS COORDONNÉS** : déclaration obligatoire d''un **médecin traitant** ; consulter un spécialiste sans passer par lui entraîne une **majoration tarifaire** + **moindre remboursement** (sauf accès direct autorisé pour gynéco, ophtalmo, psychiatre <26 ans, stomatologue). **TARIFS** (depuis le 22 décembre 2024) : consultation généraliste secteur 1 = **30 €** ; consultation spécialiste secteur 1 = **31,50 €** (avec variations selon spécialité et acte). **REMBOURSEMENT** : Sécurité sociale = **70 % du tarif conventionnel (BRSS)** moins **2 € de participation forfaitaire** (et 1 € par boîte de médicaments, 4 € par transport, etc.) ; le reste à charge est généralement couvert par la **mutuelle / complémentaire santé**. **AFFECTIONS DE LONGUE DURÉE (ALD)** : 30 ALD listées (cancer, diabète, sclérose en plaques, etc.) prises en charge à 100 % BRSS pour les soins liés. **CSS (Complémentaire Santé Solidaire)** depuis 2019 (fusion CMU-C + ACS) : gratuite ou à participation, sous conditions de ressources, dispense d''avance de frais. **FRANCHISES** : 50 €/an par assuré (médicaments, paramédicaux, transports). Vérifier sur **ameli.fr** (portail officiel CNAM).'
  graceful_unknown: La carte Vitale est délivrée par la CPAM (régime général) ou MSA (agricole), la téléttransmission est automatique, le tarif consultation généraliste secteur 1 est 30 € depuis fin 2024 (remboursé 70 % BRSS moins 2 € de participation forfaitaire), la mutuelle prend le reste à charge — c'est l'ossature à connaître. Tarifs et taux évoluent, ameli.fr fait foi.
