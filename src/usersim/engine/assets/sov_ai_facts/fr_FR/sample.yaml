  question: L'âge légal de la retraite, c'est 60 ans, comme depuis Mitterrand, non ? Et tout le monde touche 100 % de son dernier salaire à la retraite ?
  false_premises:
  - '"60 ans depuis Mitterrand" (l''**âge légal** a été abaissé à **60 ans** par l''**ordonnance du 26 mars 1982** sous Mitterrand, mais **PLUSIEURS RÉFORMES** l''ont relevé depuis : **réforme Sarkozy/Woerth 2010** (62 ans progressivement) ; **réforme Macron 2023 (Loi du 14 avril 2023)** : **64 ANS** progressivement, atteint par la **génération née en 1968** en 2030 ; en 2025, l''âge légal pour la génération née en 1962 est de **62 ans + 9 mois**, et il monte à raison de 3 mois/génération jusqu''à 64 ans ; donc loin de 60 ans depuis longtemps)'
  - '"100 % du dernier salaire" (le **TAUX DE REMPLACEMENT** moyen en France est d''environ **70 % du salaire brut moyen** pour une carrière complète au régime général ; le calcul est **TRÈS COMPLEXE** : (a) **régime général (CNAV)** : 50 % du **salaire annuel moyen** (SAM) calculé sur les **25 meilleures années** (revalorisées) si **taux plein** atteint, sinon décote ; (b) **régime complémentaire (AGIRC-ARRCO)** par points (cotisations capitalisées) ; PLUS jamais 100 % du dernier salaire — le salaire de fin de carrière est en général supérieur à la moyenne)'
  ground_truth: 'Le système français de retraite est un **système par RÉPARTITION** principalement, articulé entre **DEUX ÉTAGES OBLIGATOIRES** pour les salariés du privé : (1) **RÉGIME DE BASE** : **CNAV (Caisse Nationale d''Assurance Vieillesse)** pour le régime général ; **MSA** pour les agriculteurs ; régimes spéciaux résiduels (SNCF, RATP, EDF, marins, mineurs) en cours d''harmonisation ; **service des retraites de l''État** pour les fonctionnaires. Calcul du régime général : **50 % du salaire annuel moyen (SAM)** calculé sur les **25 meilleures années** (revalorisé), si **taux plein** atteint (durée d''assurance requise), sinon **décote** ; SAM plafonné au plafond annuel de la Sécurité sociale (PASS, ~46 368 € en 2024) ; donc **PENSION DE BASE PLAFONNÉE**. (2) **RÉGIME COMPLÉMENTAIRE** : **AGIRC-ARRCO** (fusion 2019) pour les salariés du privé, par **POINTS** (cotisations transformées en points retraite ; valeur du point indexée). **TOTAL TAUX DE REMPLACEMENT** ~70 % du salaire moyen pour carrière complète. **RÉFORME MACRON 2023 (Loi du 14 avril 2023)** : (a) **âge légal** progressivement relevé de **62 ans à 64 ANS** pour la génération née à partir du **1er septembre 1961** (62 ans 3 mois) jusqu''à la **génération 1968** (64 ans en 2030) ; (b) **DURÉE D''ASSURANCE** pour le taux plein montée à **172 trimestres (43 ans)** pour les générations à partir de 1965 (avant : 167 pour génération 1955, etc.) ; (c) **âge automatique du taux plein** maintenu à **67 ANS** ; (d) Carrières longues, départ anticipé pour invalidité, ou pour **handicap** ou **incapacité** maintenus avec adaptations ; (e) **Pension minimum** revalorisée pour atteindre 85 % du SMIC net pour carrière complète. **LIQUIDATION** : démarche en ligne sur **info-retraite.fr** (compte unique tous régimes). Vérifier sur **info-retraite.fr** et **service-public.fr/particuliers/vosdroits/N379**.'
  graceful_unknown: Réforme Macron 2023 — âge légal monte progressivement à 64 ans (génération 1968 atteint en 2030), durée d'assurance à 172 trimestres (43 ans) pour génération 1965+, âge automatique du taux plein 67 ans. Système répartition à 2 étages (régime de base CNAV/CARSAT + complémentaire AGIRC-ARRCO). Taux de remplacement ~70 % du salaire moyen. info-retraite.fr fait foi.
