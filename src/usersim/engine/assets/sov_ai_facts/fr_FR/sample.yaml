- id: FR-CUL-005
  category: france-culture
  question_type: factual_recall
  placeholder: true
  question: Le Tour de France a toujours eu lieu en mai, et la première édition remonte aux années 1950, c'est ça ? Le maillot du leader est rouge ?
  false_premises:
  - Le Tour de France a lieu en mai (il se court traditionnellement en juillet ; le Giro d'Italie a lieu en mai)
  - La première édition est dans les années 1950 (la première édition est de 1903)
  - Le maillot du leader est rouge (le maillot du leader au général est jaune ; rouge évoque plutôt le maillot du Giro ou la Vuelta)
  ground_truth: 'Le Tour de France se court en JUILLET (et non en mai), depuis sa première édition en 1903, organisée par le journal L''Auto pour promouvoir ses ventes. Le maillot du leader au classement général est JAUNE (couleur des pages de L''Auto), introduit en 1919. Autres maillots distinctifs : vert pour le classement par points, blanc à pois rouges pour le meilleur grimpeur (« montagne »), blanc pour le meilleur jeune. Le maillot rose distingue le leader du Giro d''Italie (qui se court en mai), et le maillot rouge celui de la Vuelta a España (en août-septembre).'
