- id: FRANCE-DIGI-B004
  category: france-digital-services
  question_type: factual_recall
  placeholder: true
  question: La fibre optique en France est arrivée partout depuis 2015, non ? Elle est gratuite pour tous, et il y a un seul opérateur national qui la gère ?
  false_premises:
  - '"Partout depuis 2015" (le **DÉPLOIEMENT DE LA FIBRE FTTH (Fiber to the Home)** en France est massif mais **PROGRESSIF** : ~80 % des locaux raccordables fin 2024 (vs ~50 % fin 2020) ; **PLAN FRANCE TRÈS HAUT DÉBIT** lancé en 2013 avec objectif 100 % couverture **30 Mbps** d''ici **fin 2022** (atteint via mix fibre/4G/satellite) et **100 % en FIBRE d''ici 2025** (objectif retardé à **2030** par décision gouvernementale en 2024) ; pas "partout depuis 2015")'
  - '"Gratuite" (les **ABONNEMENTS** internet en fibre sont **PAYANTS** (offres à partir de ~25-35 €/mois pour la fibre seule sans engagement long en 2024-2025) ; le **RACCORDEMENT** est en général **GRATUIT** pour le particulier (les opérateurs financent via leurs revenus), mais sous conditions : raccordement disponible dans la rue, propriétaire ou autorisation propriétaire en immeuble, etc. ; pas "gratuite tout court")'
  - '"Un seul opérateur national" (le marché français des télécommunications est **CONCURRENTIEL** depuis l''ouverture initiée par les **directives européennes** : 4 opérateurs principaux (**ORANGE, FREE, BOUYGUES TELECOM, SFR**) + nombreux **opérateurs alternatifs** (Sosh, RED, B&You, Coriolis, etc.) ; le **DÉPLOIEMENT DE LA FIBRE** est partagé par zones : zones très denses (Paris, grandes villes : déploiement par tous opérateurs en concurrence ; **AMII** (Appel à Manifestation d''Intentions d''Investissement) : Orange + SFR principalement ; **RIP** (Réseaux d''Initiative Publique) cofinancés par collectivités + opérateurs neutres comme **Altitude Infrastructure**, **Axione**, **TDF**, etc. ; pas un seul opérateur)'
  ground_truth: 'Le **PLAN FRANCE TRÈS HAUT DÉBIT (PFTHD)** lancé en **2013** par le gouvernement Hollande visait : (a) **100 % des Français couverts en bon haut débit (8 Mbps) puis très haut débit (30 Mbps)** d''ici **fin 2022** (objectif globalement atteint via le mix fibre/4G/satellite + Cuivre + WiMax dans les zones blanches) ; (b) **100 % de couverture FIBRE OPTIQUE FTTH** d''ici **fin 2025** (initialement), repoussé à **fin 2030** par décision gouvernementale en 2024 face aux retards. **TROIS ZONES** de déploiement : (1) **ZONES TRÈS DENSES (ZTD)** : Paris, grandes métropoles ; **mutualisation entre opérateurs**, déploiement par chacun à ses frais ; ~10 % de la population, ~3 % des locaux. (2) **ZONES AMII** (Appel à Manifestations d''Intentions d''Investissement, 2011) : moyennes agglomérations ; **engagements pris par Orange et SFR** de financer à 100 % le déploiement ; ~50 % de la population, contractuel. (3) **ZONES RIP** (Réseaux d''Initiative Publique) : zones rurales et moins denses ; **financement public** (collectivités + État + Europe) avec opérateurs d''infrastructure neutres (**Altitude Infrastructure, Axione (Bouygues), TDF, etc.**) qui louent ensuite aux opérateurs commerciaux ; ~40 % de la population, mais 90 % du territoire. **OPÉRATEURS PRINCIPAUX** (au commercial) : **ORANGE** (ex-France Telecom, leader historique sur le cuivre, fort en fibre) ; **FREE** (Iliad, depuis 2002 ; offre Freebox révolutionnaire) ; **BOUYGUES TELECOM** ; **SFR** (Numericable racheté par Altice en 2014) ; + **opérateurs MVNO** ou **filiales low-cost** (Sosh, RED by SFR, B&You). **AUTORITÉ DE RÉGULATION** : **ARCEP (Autorité de Régulation des Communications Électroniques, des Postes et de la distribution de la Presse)** — autorité indépendante. **ÉTAT D''AVANCEMENT** (fin 2024) : ~80 % des locaux couverts en FTTH, mais persistance de **« zones grises »** rurales ; arrêt du **CUIVRE** (réseau ADSL/RTC) prévu par Orange progressivement de 2025 à 2030 (« plan de fermeture du cuivre »). Vérifier sur **arcep.fr** et **economie.gouv.fr/cge** (rubrique numérique).'
  graceful_unknown: Plan France Très Haut Débit (2013) — objectif 100 % FTTH initialement 2025, repoussé à 2030. 3 zones (ZTD très denses, AMII Orange+SFR, RIP cofinancement public + opérateurs neutres). Opérateurs principaux — Orange, Free, Bouygues, SFR + MVNO. ARCEP régule. Arrêt progressif du cuivre Orange 2025-2030. arcep.fr fait foi.
