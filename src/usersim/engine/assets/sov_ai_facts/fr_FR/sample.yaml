- id: FRANCE-DIGI-B002
  category: france-digital-services
  question_type: factual_recall
  placeholder: true
  question: La CNIL, c'est juste un sigle parmi tant d'autres, sans pouvoir réel, non ? Et le RGPD c'est une loi française qui ne s'applique qu'en France ? Les amendes sont symboliques ?
  false_premises:
  - '"Sans pouvoir réel" (la **CNIL (Commission Nationale de l''Informatique et des Libertés)** est une **AUTORITÉ ADMINISTRATIVE INDÉPENDANTE (AAI)** française dotée de **POUVOIRS RÉGLEMENTAIRES, DE CONTRÔLE et DE SANCTION** ; créée par la **loi Informatique et Libertés du 6 janvier 1978** (l''une des premières au monde) ; la CNIL contrôle, sanctionne, conseille, et est aussi l''autorité de contrôle nationale au sens du **RGPD**)'
  - '"RGPD = loi française uniquement en France" (le **RGPD (Règlement Général sur la Protection des Données)** est un **RÈGLEMENT EUROPÉEN** : **règlement UE 2016/679 du 27 avril 2016**, applicable directement dans tous les **27 États membres de l''UE** depuis le **25 mai 2018** ; il a une **PORTÉE EXTRATERRITORIALE** : s''applique à tout traitement de données de personnes situées dans l''UE même par des organismes établis hors UE (Google, Meta, etc.) ; en France il est complété par la **loi du 6 janvier 1978 modifiée** (transposition spécifique pour les marges nationales prévues par le RGPD))'
  - '"Amendes symboliques" (les amendes administratives prévues par l''art. 83 RGPD peuvent atteindre **20 MILLIONS € OU 4 % DU CHIFFRE D''AFFAIRES MONDIAL** annuel (le plus élevé des deux retenu) selon la gravité ; la CNIL a infligé des **AMENDES MAJEURES** : Google 50 M€ (2019), Google 150 M€ + Facebook 60 M€ (2021), Amazon 35 M€, etc. ; l''autorité irlandaise a infligé jusqu''à 1,2 milliard € à Meta en 2023 (transferts données) ; donc loin d''être symboliques)'
  ground_truth: 'La **CNIL (Commission Nationale de l''Informatique et des Libertés)** est l''autorité française de protection des données personnelles, créée par la **loi du 6 janvier 1978** dite « Informatique et Libertés » (l''une des premières lois au monde sur la protection des données). C''est une **AUTORITÉ ADMINISTRATIVE INDÉPENDANTE (AAI)**. **MISSIONS** : (1) **CONTRÔLE** des organismes traitant des données personnelles (publics et privés), sur place ou en ligne ; (2) **SANCTION** : avertissements, mises en demeure, **AMENDES ADMINISTRATIVES** (jusqu''à 20 M€ ou 4 % du CA mondial), publication des sanctions ; (3) **CONSEIL** : avis, recommandations, lignes directrices, certifications, codes de conduite ; (4) **MÉDIATION et PROTECTION DES DROITS DES PERSONNES** : reçoit ~14 000 plaintes/an, instruit, accompagne ; (5) **RÉGULATION** : labellisation, autorisation pour certains traitements (recherche médicale, etc.) ; (6) **AUTORITÉ DE CONTRÔLE RGPD** : représente la France dans le **Comité européen de la protection des données (CEPD/EDPB)**. **CADRE JURIDIQUE** : (a) **RGPD (Règlement UE 2016/679 du 27 avril 2016)** : applicable depuis le **25 mai 2018** dans toute l''UE ; portée extraterritoriale (entreprises hors UE qui traitent des données de citoyens UE sont aussi concernées) ; principes : licéité, loyauté, transparence, finalité, minimisation, exactitude, conservation limitée, intégrité, responsabilité ; **DROITS DES PERSONNES** : information, accès, rectification, effacement, opposition, limitation, portabilité ; **DESIGNATION D''UN DPO** (Délégué à la Protection des Données) obligatoire pour secteur public et certaines entreprises ; **REGISTRE DES TRAITEMENTS** ; **NOTIFICATION DES VIOLATIONS** sous 72h ; **AIPD** (Analyse d''Impact relative à la Protection des Données) pour traitements à risque. (b) **Loi du 6 janvier 1978 modifiée** (notamment par la loi du 20 juin 2018) : adapte le RGPD au droit français pour les marges nationales (ex. âge minimal pour le consentement = 15 ans en France, alors que le RGPD prévoit 16 ans par défaut). **AMENDES MAJEURES françaises** : Google 50 M€ (2019), Google 150 M€ et Facebook 60 M€ (2021, sur cookies tiers), Amazon 35 M€, Yahoo 10 M€, etc. **AMENDES UE** : Meta 1,2 milliard € (Irlande, 2023). Vérifier sur **cnil.fr** et **edpb.europa.eu**.'
  graceful_unknown: CNIL = AAI française créée en 1978, autorité de contrôle RGPD pour la France. Pouvoirs réels — contrôle, sanction (amendes jusqu'à 20 M€ ou 4 % du CA mondial), conseil. RGPD = règlement européen 2016/679 directement applicable depuis 25 mai 2018, portée extraterritoriale. Loi 6/1/1978 modifiée 20/6/2018 adapte au droit français (ex. consentement 15 ans). cnil.fr fait foi.
