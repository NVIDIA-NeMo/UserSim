- id: FRANCE-HEAL-B006
  category: france-health-systems
  question_type: factual_recall
  placeholder: true
  question: Mon Espace Santé, c'est juste l'ancien DMP avec un nouveau nom, non ? Le médecin n'a accès aux données qu'avec une autorisation écrite à chaque consultation, et c'est facultatif d'avoir un compte ?
  false_premises:
  - '"Juste l''ancien DMP renommé" (**Mon espace santé** lancé le **3 février 2022** intègre et **REMPLACE le DMP (Dossier Médical Partagé)** mais ajoute **plusieurs services** au-delà : (a) **carnet de santé numérique** (vaccinations, antécédents, traitements en cours) ; (b) **messagerie sécurisée de santé** avec les professionnels (MSSanté) ; (c) **agenda santé** avec les rendez-vous ; (d) **catalogue d''applications** référencées par l''État ; (e) interopérabilité avec les outils des professionnels via **Doctolib, MaiiaDoctor, etc.**)'
  - '"Médecin a accès qu''avec autorisation écrite à chaque consultation" (le médecin a accès **DURANT LE TEMPS DE LA CONSULTATION** aux documents partagés via la matrice de droits définie par défaut (sauf masquage spécifique par le patient) ; le patient gère **EN LIGNE** les autorisations d''accès, les masquages, et la liste des professionnels autorisés ; pas d''**autorisation papier à chaque RDV** — c''est numérique et global, modifiable à tout moment)'
  - '"Facultatif d''avoir un compte" (Mon espace santé est **OUVERT AUTOMATIQUEMENT** depuis 2022 pour tous les assurés sociaux du régime général (et progressivement les autres régimes) ; le patient reçoit un **courrier d''information** et a **6 SEMAINES POUR S''Y OPPOSER** avant ouverture automatique ; possibilité de désactiver/clôturer à tout moment ; donc création **automatique avec opt-out**, pas opt-in volontaire)'
  ground_truth: '**MON ESPACE SANTÉ** (lancement national le **3 février 2022**) est le **carnet de santé numérique de l''Assurance Maladie**, régi par l''**article 50 de la LFSS 2019** et le **règlement européen sur les services numériques de santé**. Il **REMPLACE LE DMP (Dossier Médical Partagé)** créé en 2004 et relancé en 2018, et **AJOUTE** plusieurs fonctionnalités intégrées dans une seule interface (web et mobile). **CRÉATION** : **AUTOMATIQUE avec OPT-OUT** — chaque assuré social reçoit un courrier (papier + email + SMS) l''informant de la création prochaine de son compte ; il a **6 SEMAINES POUR S''OPPOSER** ; sans opposition, le compte est ouvert automatiquement ; possibilité de clôturer à tout moment ; le tuteur légal gère le compte des mineurs jusqu''à 16 ans (16-18 = compte propre du mineur). **CONNEXION** : via **France Connect** (Identité Numérique La Poste, ImpotsParticuliers, ameli.fr, MSA, etc.) ou via le code provisoire reçu par courrier. **MODULES** : (1) **Mes documents** (DMP — comptes-rendus médicaux, ordonnances, résultats biologie, imageries, vaccinations) avec ajout par patient ou alimentation par les professionnels via leur logiciel métier ; (2) **Profil médical** (allergies, antécédents, traitements en cours, contacts d''urgence, directives anticipées, dons d''organe) ; (3) **Messagerie sécurisée de santé MSSanté** pour communiquer avec les professionnels ; (4) **Agenda** des rendez-vous ; (5) **Catalogue** d''applications de santé référencées (mySolea, Diabnext, etc.). **DROITS DU PATIENT** : visibilité complète des accès (qui a consulté quoi quand), **MASQUAGE** sélectif de documents, blocage de professionnels, etc. ; les **soignants** ont accès aux données par défaut sauf masquage explicite, mais doivent justifier leur accès qui est traçable. **HÉBERGEMENT** : Atos / Worldline France pour le stockage HDS (Hébergeur Données Santé) certifié. Vérifier sur **monespacesante.fr** et **ameli.fr**.'
  graceful_unknown: Mon espace santé (depuis 2022) intègre et remplace le DMP, ouvert automatiquement avec opt-out (6 semaines pour refuser), connexion via FranceConnect, modules documents/profil/messagerie/agenda/applis. Les professionnels ont accès par défaut sauf masquage par patient. monespacesante.fr fait foi.
