- id: FRANCE-FINA-B005
  category: france-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: La TVA en France, c'est 20 % sur tout, sans exception, non ? Et c'est l'employeur qui paie la TVA, pas le consommateur ?
  false_premises:
  - '"20 % sur tout" (la TVA française a **PLUSIEURS TAUX** : (a) **TAUX NORMAL 20 %** (la majorité des biens et services) ; (b) **TAUX RÉDUIT 10 %** (restauration, transports, travaux d''entretien dans logements anciens, billetterie événementielle, médicaments non remboursables, etc.) ; (c) **TAUX RÉDUIT 5,5 %** (alimentaires de base, livres, abonnements gaz/électricité, gaz, équipements et services pour personnes handicapées, certains travaux dans logements anciens) ; (d) **TAUX SUPER-RÉDUIT 2,1 %** (médicaments remboursables, presse, certains spectacles vivants premières représentations) ; (e) **EXONÉRATIONS** : services médicaux, enseignement, locations immobilières nues à usage d''habitation, etc.)'
  - '"Employeur paie la TVA" (la TVA (Taxe sur la Valeur Ajoutée) est un **IMPÔT À LA CONSOMMATION** payé par le **CONSOMMATEUR FINAL** ; les entreprises sont **REDEVABLES** : elles **collectent** la TVA sur leurs ventes (TVA collectée), **déduisent** la TVA payée sur leurs achats (TVA déductible), et **REVERSENT au TRÉSOR** la différence (mensuellement, trimestriellement, ou annuellement selon régime) ; pour l''entreprise, la TVA est **NEUTRE** économiquement (sauf cas particuliers) ; pour le particulier, c''est un **coût final**)'
  ground_truth: 'La **TVA (TAXE SUR LA VALEUR AJOUTÉE)** est un **IMPÔT INDIRECT** sur la consommation, créé en France par **Maurice Lauré (1954)**, aujourd''hui pierre angulaire de la fiscalité française et européenne (directive TVA 2006/112/CE). **TAUX FRANÇAIS** (en métropole, en 2025) : (1) **TAUX NORMAL : 20 %** — la majorité des biens et services ; (2) **TAUX RÉDUIT : 10 %** — restauration sur place et à emporter, transports de voyageurs, travaux d''entretien dans logements de + 2 ans, billetterie de spectacles/musées/parcs, médicaments non remboursables, certains produits agricoles ; (3) **TAUX RÉDUIT : 5,5 %** — produits alimentaires (hors boissons alcoolisées et certaines confiseries), livres (papier ou numérique), abonnements gaz/électricité (avec énergies renouvelables), équipements et services pour personnes handicapées, transport public de voyageurs au début 2024, billetterie spectacles vivants/cinéma, livres scolaires, certains travaux dans logements anciens (rénovation énergétique) ; (4) **TAUX PARTICULIER : 2,1 %** — médicaments remboursables, presse, redevance audiovisuelle (avant suppression), spectacles vivants premières représentations. **TAUX EN OUTRE-MER** : Guadeloupe, Martinique, La Réunion : taux normal 8,5 %, réduit 2,1 %, particulier 1,75 %/1,05 % ; Guyane et Mayotte : TVA non applicable. **EXONÉRATIONS** : services médicaux, enseignement (sauf privé hors contrat), assurances, certaines opérations bancaires, **locations immobilières NUES** à usage d''habitation, etc. (art. 261 et suivants CGI). **REDEVABLES** : entreprises et professionnels (sauf **micro-entrepreneurs en franchise en base** : seuils ~85 800 € pour ventes, ~34 400 € pour services en 2024). **MÉCANISME** : entreprise **collecte** la TVA sur ses ventes ; **déduit** la TVA sur ses achats ; **reverse** la différence ; au final, c''est **le consommateur final** qui supporte la TVA. **DÉCLARATIONS** : mensuelles (régime réel normal, CA > certain seuil) ou trimestrielles (TVA à payer < 4 000 €/an) ou annuelles (régime simplifié RSI). Vérifier sur **impots.gouv.fr** (rubrique professionnels/TVA) et **economie.gouv.fr**.'
  graceful_unknown: TVA = impôt à la consommation supporté par le consommateur final. Plusieurs taux — 20 % (normal), 10 % (restauration/transport), 5,5 % (alimentaire base, livres, gaz), 2,1 % (médicaments remboursables, presse). Outre-mer = taux différents. Entreprises sont redevables (collectent + déduisent + reversent). Micro-entrepreneurs en franchise en base. impots.gouv.fr fait foi.
