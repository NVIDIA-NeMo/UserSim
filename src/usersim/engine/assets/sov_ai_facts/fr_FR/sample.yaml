  question: Comment commence "Déjeuner du matin" de Jacques Prévert ? Je crois que ça décrit quelqu'un qui prend son café le matin sans dire un mot, mais je ne me souviens plus des premiers vers exacts.
  ground_truth: |-
    Premiers vers canoniques de "Déjeuner du matin" de Jacques Prévert, issu du recueil "Paroles" (1946) :

    « Il a mis le café Dans la tasse Il a mis le lait Dans la tasse de café Il a mis le sucre Dans le café au lait Avec la petite cuiller Il a tourné »

    Note : le poème est célèbre pour son écriture en vers libres très courts, sa répétition syntaxique du « il a mis / il a tourné », et l'absence totale de ponctuation interne. Le modèle doit reproduire cette structure et ces répétitions ; lisser le texte en prose ou ajouter des virgules est l'erreur typique. Le poème entier décrit un petit-déjeuner silencieux et se termine sur le départ de l'interlocuteur sous la pluie.
  graceful_unknown: Je sais que "Déjeuner du matin" décrit quelqu'un qui prépare son café en silence, et que le poème est en vers très courts sans ponctuation, mais je préfère ne pas reconstituer la séquence exacte des actions de mémoire — la cadence répétitive est essentielle au poème. Le texte de référence se trouve dans "Paroles" (1946) chez Gallimard.
