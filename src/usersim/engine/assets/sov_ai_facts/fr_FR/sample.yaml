- id: FRANCE-FINA-B004
  category: france-finance-and-consumer
  question_type: factual_recall
  placeholder: true
  question: La garantie des dépôts bancaires en France, c'est l'État qui paie tout sans limite si une banque fait faillite, non ? Et ça couvre tous les comptes, y compris les actions et le PEA ?
  false_premises:
  - '"L''État paie tout sans limite" (la **GARANTIE DES DÉPÔTS** est gérée par le **FGDR (Fonds de Garantie des Dépôts et de Résolution)**, organisme **PRIVÉ** financé par les banques (pas l''État) ; le plafond est de **100 000 € par déposant et par banque** (régime européen harmonisé depuis 2010, art. 312-1 et suivants Code monétaire et financier) ; au-delà, perte totale possible sauf intervention spécifique de l''État pour banque systémique)'
  - '"Tous les comptes y compris actions et PEA" (la garantie FGDR sur les **DÉPÔTS** = comptes courants, livrets bancaires, dépôts à terme, PEL, CEL, etc. = **100 000 €** ; les **TITRES (actions, OPCVM, PEA, CTO)** sont protégés par un **autre dispositif** : **Garantie des Titres FGDR** = jusqu''à **70 000 € par déposant et par établissement** en cas de défaillance et de non-restitution des titres déposés ; les titres demeurent en principe propriété de l''investisseur, donc le risque ne se concrétise que si la banque les a perdus/utilisés indûment ; les **CONTRATS D''ASSURANCE-VIE** sont dans un autre fonds (**FGAP**) à hauteur de **70 000 € par assureur**)'
  ground_truth: 'Le **FONDS DE GARANTIE DES DÉPÔTS ET DE RÉSOLUTION (FGDR)** est l''organisme français de garantie des dépôts bancaires, organisme **PRIVÉ** financé par les **cotisations obligatoires des banques** adhérentes (toutes les banques agréées en France), institué par la **loi du 25 juin 1999** transposant la directive européenne 94/19/CE (puis 2014/49/UE). Régi par les **articles L312-1 et suivants du Code monétaire et financier**. **TROIS GARANTIES PRINCIPALES** : (1) **GARANTIE DES DÉPÔTS** : couvre les dépôts en compte courant, comptes d''épargne (livrets, PEL, CEL, etc.), dépôts à terme, lettres de change, jusqu''à **100 000 € par déposant et par établissement** ; régime harmonisé européen depuis 2010 ; **DÉLAI DE REMBOURSEMENT** : 7 jours ouvrables après défaillance (depuis 2024). Sont **EXCLUS** : Livret A, LDDS, LEP (qui sont garantis directement par l''**État** via le mécanisme spécifique du Fonds d''épargne CDC) ; OPCVM (parts de SICAV/FCP) ; titres détenus en CTO/PEA. (2) **GARANTIE DES TITRES** : couvre la non-restitution des titres confiés (actions, obligations, OPCVM, parts de PEA et CTO) en cas de défaillance de l''établissement ; plafond **70 000 € par déposant et par établissement**. (3) **GARANTIE DES CAUTIONS** : pour les bénéficiaires d''engagements de caution émis par établissements défaillants, plafond 90 % du montant cauté avec un plafond global. **DISPOSITIONS SPÉCIFIQUES** : (a) **PROTECTION TEMPORAIRE de DÉPÔTS EXCEPTIONNELS** (vente de bien immobilier, indemnités, etc.) jusqu''à **500 000 €** pendant **3 mois** ; (b) **comptes joints** : la garantie de 100 000 € s''applique **pour chaque cotitulaire** (donc 200 000 € pour un compte joint à 2). **AUTRES FONDS** : **FGAP (Fonds de Garantie des Assurances de Personnes)** pour assurance-vie (70 000 € par assureur, **40 000 € pour les rentes**, par bénéficiaire) ; régi à part. **PRESCRIPTION** : la garantie est due dans les 5 ans suivant la défaillance. Vérifier sur **garantiedesdepots.fr** et **fgaip.fr** (assurance-vie).'
  graceful_unknown: 'Garantie des dépôts FGDR (organisme privé financé par banques, pas État) — 100 k € par déposant par banque. Garantie des titres = 70 k €. Comptes joints doublés. Livret A/LDDS/LEP garantis par État (Caisse des Dépôts). Assurance-vie — FGAP 70 k € par assureur. garantiedesdepots.fr fait foi.'
