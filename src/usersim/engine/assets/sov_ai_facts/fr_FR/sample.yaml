- id: FRANCE-LABO-B001
  category: france-labor-and-benefits
  question_type: factual_recall
  placeholder: true
  question: La durée légale du travail, c'est 35 heures pour tout le monde, non ? Et pas une minute de plus sans heures sup ? Les cadres aussi sont à 35h ?
  false_premises:
  - '"35 heures pour tout le monde" (la **durée LÉGALE du travail** est de **35 HEURES par semaine** depuis les **lois Aubry** (Loi du 13 juin 1998 + Loi du 19 janvier 2000) ; mais c''est un **seuil de déclenchement des heures supplémentaires**, **PAS un plafond** ni un standard pour tout le monde — durée maximale légale 48h/semaine ; certaines branches/conventions ont des durées hebdomadaires différentes ; les **cadres au forfait jours** ne sont pas comptés en heures)'
  - '"Pas une minute de plus sans heures sup" (au-delà de 35h, on bascule en **HEURES SUPPLÉMENTAIRES** majorées de **+25 % les 8 premières (36e à 43e h)** et **+50 % au-delà** (par défaut, modulable par accord d''entreprise/branche jusqu''à un plancher de +10 %) ; ces heures sup peuvent être **payées** ou **compensées en repos** ; le **CONTINGENT ANNUEL** est typiquement de 220h/an, modulable par accord)'
  - '"Cadres aussi à 35h" (les **CADRES AU FORFAIT JOURS** (le plus souvent les **cadres dirigeants ou autonomes**) sont rémunérés sur la base d''un **NOMBRE DE JOURS TRAVAILLÉS PAR AN** (typiquement **218 jours/an**, plafond légal) et **NE SONT PAS COMPTÉS EN HEURES** ; ils bénéficient du **droit à la déconnexion** (loi El Khomri 2016) et du repos quotidien/hebdomadaire ; les **cadres dirigeants** (poste à très large autonomie, rémunération élevée, place hiérarchique) sont quasi-exemptés de toutes les règles sur la durée du travail ; les autres cadres (intermédiaires, exécution) sont à 35h comme tout le monde)'
  ground_truth: 'La **DURÉE LÉGALE DU TRAVAIL** en France est fixée à **35 HEURES PAR SEMAINE** par les **lois Aubry I et II** (Loi 1998-461 du 13 juin 1998 et Loi 2000-37 du 19 janvier 2000) — **art. L3121-27 du Code du travail**. C''est un **SEUIL DE DÉCLENCHEMENT** des heures supplémentaires, pas un plafond strict ni un volume identique pour tous. **HEURES SUPPLÉMENTAIRES** (art. L3121-28 et suivants) : majoration légale de **+25 % pour les 8 premières heures supplémentaires** (36e à 43e heure) et **+50 % au-delà** (44e h et plus) ; modulable par convention/accord d''entreprise jusqu''à un **plancher de +10 %** ; **CONTINGENT ANNUEL** par défaut de **220h** par salarié, modulable. Les heures sup peuvent être **payées en argent** ou **compensées en REPOS COMPENSATEUR** ; **EXONÉRATION** sociales et fiscales (jusqu''à un plafond annuel) depuis la **loi TEPA 2007** ré-introduite en 2019 (loi du 24 décembre 2018 mesures d''urgence économiques et sociales). **DURÉES MAXIMALES** : **10h/jour** (sauf accord), **48h/semaine** (60h dans des cas exceptionnels), **44h/semaine en moyenne sur 12 semaines**. **REPOS** : minimum **11h consécutives par 24h** (repos quotidien) ; **35h consécutives par semaine** (24h + 11h, repos hebdomadaire). **CADRES** : (a) **Cadres dirigeants** : exclus des règles sur la durée du travail (sauf congés payés) ; (b) **Cadres au forfait JOURS** : décompte du temps en jours travaillés/an (max 218 jours/an au plafond légal) ; (c) **Cadres au forfait HEURES** : sur base hebdomadaire, mensuelle ou annuelle ; (d) cadres intégrés (sans autonomie) : 35h/sem comme les non-cadres. **CONVENTIONS COLLECTIVES** : peuvent fixer des durées différentes (en plus ou en moins selon les branches), aménagement du temps de travail (modulation, annualisation, RTT, etc.). Vérifier sur **travail-emploi.gouv.fr** et **legifrance.gouv.fr** (Code du travail).'
  graceful_unknown: La durée légale = 35h/sem (lois Aubry 1998-2000), seuil de déclenchement des HS (+25 % puis +50 % par défaut, contingent 220h/an). Cadres au forfait jours (max 218 j/an) ou cadres dirigeants (exclus des règles horaires). Maxi 48h/sem (44h en moyenne sur 12 sem), 10h/jour. Repos 11h/24h, 35h/sem. travail-emploi.gouv.fr fait foi.
