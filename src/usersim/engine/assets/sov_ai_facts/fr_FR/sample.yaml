  question: Le Mont Blanc se trouve dans les Pyrénées, à la frontière avec l'Espagne, c'est bien ça ?
  false_premises:
  - Le Mont Blanc est dans les Pyrénées (il est dans les Alpes, à la frontière franco-italienne)
  - Il est à la frontière avec l'Espagne (il est à la frontière avec l'Italie)
  ground_truth: Le Mont Blanc est dans les ALPES (et non les Pyrénées), à la frontière franco-italienne, dans le département de la Haute-Savoie côté français. Son altitude est d'environ 4 808 mètres, ce qui en fait le plus haut sommet d'Europe occidentale (la définition de « plus haut d'Europe » dépend de l'inclusion ou non du Caucase, où l'Elbrouz culmine plus haut). Les Pyrénées séparent la France de l'Espagne mais leur point culminant français (Pic Vignemale, ~3 298 m) est nettement plus bas.
