- id: FRANCE-DIGI-B001
  category: france-digital-services
  question_type: factual_recall
  placeholder: true
  question: FranceConnect, c'est juste pour les impôts, non ? Et il faut payer un abonnement pour l'utiliser ? Il sert seulement aux Français qui habitent en France ?
  false_premises:
  - '"Juste pour les impôts" (FranceConnect est un **DISPOSITIF D''IDENTIFICATION UNIQUE** (single sign-on / SSO) pour des **CENTAINES de services en ligne** de l''administration française : impôts.gouv.fr, ameli.fr, mes-services-en-ligne, France Travail, mon-compte-formation.fr, service-public.fr, ANTS (carte grise/permis), Mon espace santé, CAF, ENT scolaires, mairies, etc. ; pas limité aux impôts)'
  - '"Payant" (FranceConnect est un service **GRATUIT** pour les usagers ; financé par l''État (DINUM = Direction Interministérielle du Numérique) ; les **fournisseurs d''identité** (impôts.gouv.fr, ameli.fr, La Poste-Identité Numérique, MSA, etc.) sont également gratuits ; aucun frais à payer)'
  - '"Français habitant en France" (FranceConnect est accessible à **TOUTE PERSONNE** ayant créé une identité chez un fournisseur partenaire, **PEU IMPORTE LA NATIONALITÉ** : Français à l''étranger, étrangers résidant en France ; les fournisseurs d''identité standard requièrent généralement un **NIR** (Numéro d''Inscription au Répertoire / sécu) ou un **CPF** ; **FranceConnect+** (avec L''Identité Numérique La Poste) est désormais conforme **eIDAS niveau substantiel** et reconnu au niveau européen)'
  ground_truth: 'FranceConnect est le **service d''identification numérique unique** de l''État français pour accéder à plus de **1 700 services en ligne** des administrations publiques, opérationnel depuis **2016** et géré par la **DINUM (Direction Interministérielle du Numérique)** du Premier ministre. **PRINCIPE** : se connecter à un service en ligne en utilisant **les identifiants d''un service partenaire** (ex. impôts.gouv.fr, ameli.fr, La Poste-Identité Numérique, MSA, Yris) plutôt qu''un nouveau compte. **FOURNISSEURS D''IDENTITÉ** (FI) en 2025 : impots.gouv.fr (DGFiP), ameli.fr (CNAM), L''Identité Numérique La Poste (avec ou sans contrôle d''identité physique), MSA, Yris, Pôle/France Travail. **NIVEAUX** : (1) **FranceConnect "standard"** (niveau eIDAS faible/substantiel selon FI) — la majorité des services ; (2) **FranceConnect+** lancé en **2022** : adossé à **L''Identité Numérique La Poste** avec contrôle d''identité face-à-face, permet d''accéder à des **services à enjeu fort** (carte grise/permis ANTS, Mon espace santé, démarches notariales, etc.) ; conforme **eIDAS niveau SUBSTANTIEL** (notifié au Conseil européen). **GRATUIT** pour les usagers. **PRINCIPE EUROPÉEN** : **eIDAS** (Electronic IDentification, Authentication and trust Services) — règlement UE 910/2014, révisé par le règlement eIDAS 2 du 11 avril 2024 (notamment vers le **portefeuille européen d''identité numérique** prévu pour 2026). **DONNÉES PARTAGÉES** : le service auquel vous vous connectez reçoit du fournisseur d''identité un ensemble strictement limité de données d''identité (nom, prénoms, date et lieu de naissance, sexe, parfois email) ; **JOURNAL DES CONNEXIONS** consultable sur franceconnect.gouv.fr/historique. **ACCESSIBILITÉ** : aux Français en France, à l''étranger, aux étrangers résidant en France ayant un fournisseur d''identité partenaire. Vérifier sur **franceconnect.gouv.fr** et **numerique.gouv.fr**.'
  graceful_unknown: FranceConnect = SSO (single sign-on) gratuit pour 1 700+ services administratifs (impôts, ameli, France Travail, ANTS, Mon espace santé, CAF, etc.). Fournisseurs — impots.gouv.fr, ameli.fr, La Poste-Identité Numérique, MSA, Yris. FranceConnect+ depuis 2022 (eIDAS substantiel) pour services à enjeu fort. Conforme règlement européen eIDAS. franceconnect.gouv.fr fait foi.
