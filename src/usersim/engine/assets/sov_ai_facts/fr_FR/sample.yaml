  ground_truth: 'Le traité de Versailles a été signé dans la GALERIE DES GLACES du CHÂTEAU DE VERSAILLES (et non au Louvre), le 28 JUIN 1919 (et non en 1918). C''est l''armistice du 11 novembre 1918 qui marque la fin des combats ; le traité formalise les conditions de paix sept mois plus tard. Le choix de la galerie des Glaces avait une portée symbolique : c''est dans cette même salle qu''avait été proclamé l''Empire allemand en janvier 1871.'
