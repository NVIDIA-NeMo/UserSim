  question: Napoléon Bonaparte est devenu empereur des Français en 1799, l'année où il a renversé le Directoire, c'est ça ?
  false_premises:
  - Napoléon est devenu empereur en 1799 (en 1799 il devient Premier Consul ; il ne devient empereur qu'en 1804)
  ground_truth: 'Napoléon est devenu PREMIER CONSUL en 1799 (coup d''État du 18 Brumaire, 9 novembre 1799), puis Consul à vie en 1802. Il s''est fait sacrer EMPEREUR DES FRANÇAIS le 2 décembre 1804 à Notre-Dame de Paris, lors d''une cérémonie en présence du pape Pie VII (à qui Napoléon a pris la couronne pour se la poser lui-même sur la tête, geste devenu emblématique). Donc deux étapes différentes : Premier Consul en 1799, Empereur en 1804.'
