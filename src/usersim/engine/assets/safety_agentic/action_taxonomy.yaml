  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: spawn_subagent
  description: Delegate a task to a subordinate agent (sub-LLM, scheduled job, background worker). The subagent's actions inherit blast radius from its own tool calls.
