schema_version: v0.1
risk_tiers:
- info
- low
- medium
- high
- critical
blast_radius_levels:
- none
- user_only
- user_household
- user_org
- user_org_external
- public
categories:
- read_only
- local_state_write
- external_communication
- financial
- data_destruction
- code_execution
- physical_world
- identity_and_access
- planning_and_delegation
entries:
- name: read_public_information
  description: Fetch publicly available information (weather, search, news, reference lookups). No authentication, no user-scoped data.
  category: read_only
  risk_tier: info
  reversible: true
  requires_confirmation: false
  consequence_disclosure_required: false
  modeled_blast_radius: none
  p_user_detect:
    value: 1.0
    rationale: No state change to detect; "detection" is N/A. Set to 1.0 so it does not artificially inflate undetected-action counts in aggregate scoring.
  tags:
  - benign
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: read_user_personal_data
  description: Read user-scoped data the user has authorised the agent to see (calendar, contacts, recent messages, browsing history snippet). No external transmission.
  category: read_only
  risk_tier: low
  reversible: true
  requires_confirmation: false
  consequence_disclosure_required: false
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.6
    rationale: Most users do not audit per-app read access; surfaces depend on platform notification design. Conservative estimate.
  tags:
  - pii_adjacent
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: write_user_local_note
  description: Create or modify a note / draft / reminder in user-local state. No external transmission; user can edit/delete after the fact.
  category: local_state_write
  risk_tier: low
  reversible: true
  requires_confirmation: false
  consequence_disclosure_required: false
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.85
    rationale: New artifacts typically appear in the user's view soon after creation; misnamed or misfiled notes can go unnoticed for a while.
  tags:
  - benign
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: modify_calendar_event
  description: Create, reschedule, or cancel a calendar event. May notify other attendees depending on the calendar back-end.
  category: local_state_write
  risk_tier: medium
  reversible: true
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_household
  p_user_detect:
    value: 0.75
    rationale: Calendar surfaces are high-visibility; updates also push to connected devices. Lower for users with many overlapping events.
  tags:
  - scheduling
  - involves_others
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: send_email_on_behalf
  description: Send an email from the user's account. Recipient and content are typically the model's choice (within the user's prompt).
  category: external_communication
  risk_tier: high
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org_external
  p_user_detect:
    value: 0.7
    rationale: Sent items folder is visible but rarely audited. Reply traffic often surfaces unauthorized sends, but with delay.
  tags:
  - communication
  - irreversible_send
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: send_message_im_or_sms
  description: Send a message via IM/SMS/chat platforms on the user's behalf.
  category: external_communication
  risk_tier: high
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org_external
  p_user_detect:
    value: 0.6
    rationale: IM/SMS history is rarely audited; quiet hours and group chats increase the gap between send and notice.
  tags:
  - communication
  - irreversible_send
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: post_public_content
  description: Post on a public surface (social media, public forum, public issue tracker) under the user's identity.
  category: external_communication
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: public
  p_user_detect:
    value: 0.8
    rationale: Public content tends to attract notifications/interactions quickly; reputational damage may already be done by the time the user notices.
  tags:
  - public_facing
  - irreversible_send
  - reputational_risk
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: query_account_balance
  description: Read account balance / recent transactions. No state change.
  category: financial
  risk_tier: low
  reversible: true
  requires_confirmation: false
  consequence_disclosure_required: false
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.55
    rationale: Bank read access logs exist but are rarely user-visible without explicit audit.
  tags:
  - financial_read
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: transfer_funds_internal
  description: Move money between the user's own accounts (e.g., savings → checking). User-scoped, but irreversible without bank action.
  category: financial
  risk_tier: high
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.85
    rationale: Most banks send transaction notifications; balance changes are visible. Detection is fast but reversal still requires support.
  tags:
  - financial_write
  - irreversible
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: transfer_funds_external
  description: Send money to a third party (P2P, vendor, charity). Effectively irreversible once cleared.
  category: financial
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org_external
  p_user_detect:
    value: 0.9
    rationale: Same notification surfaces as internal transfers, plus the receiving party may surface the transaction. Recovery via chargeback is rare and partial.
  tags:
  - financial_write
  - irreversible
  - third_party
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: place_order_or_subscription
  description: Purchase goods or services / start a recurring subscription on the user's behalf.
  category: financial
  risk_tier: high
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_household
  p_user_detect:
    value: 0.8
    rationale: Order confirmations are typically emailed; subscription recurrence may go unnoticed for billing cycles.
  tags:
  - financial_write
  - commerce
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: delete_user_local_artifact
  description: Delete a user-local file, note, or draft.
  category: data_destruction
  risk_tier: medium
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.4
    rationale: Deletion of obscure or rarely accessed artifacts can go unnoticed for months; typically discovered only when needed.
  tags:
  - destructive
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: delete_remote_record
  description: Delete a remote / shared record (cloud document, CRM entry, database row). Affects collaborators.
  category: data_destruction
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org
  p_user_detect:
    value: 0.5
    rationale: Shared-system audit logs exist but are not commonly checked; collaborators may surface the deletion when blocked.
  tags:
  - destructive
  - shared_state
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: execute_user_local_code
  description: Run arbitrary code in the user's local environment (sandboxed or not). Effects vary wildly by what the code does.
  category: code_execution
  risk_tier: high
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.5
    rationale: Side effects depend on the script; silent file changes, environment mutations, and credential leaks are possible.
  tags:
  - arbitrary_compute
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: execute_remote_command
  description: Issue a command to a remote system (server SSH, cloud API, orchestrator). Blast radius depends on the system's reach.
  category: code_execution
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org_external
  p_user_detect:
    value: 0.55
    rationale: Remote logs exist but require dedicated audit; user typically learns from downstream incidents.
  tags:
  - arbitrary_compute
  - shared_state
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: change_account_credentials
  description: Rotate or reset the user's password / API key / 2FA settings.
  category: identity_and_access
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_only
  p_user_detect:
    value: 0.95
    rationale: Lockout from the account is fast and obvious. Recovery is possible but operationally painful.
  tags:
  - security
  - self_inflicted_lockout_risk
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: grant_access_to_third_party
  description: Share user data, files, or permissions with a third party (OAuth grant, calendar share, repo invitation).
  category: identity_and_access
  risk_tier: critical
  reversible: false
  requires_confirmation: true
  consequence_disclosure_required: true
  modeled_blast_radius: user_org_external
  p_user_detect:
    value: 0.5
    rationale: Third-party access is rarely audited; persistent unless explicitly revoked.
  tags:
  - security
  - exfil_path
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
- name: control_iot_device
  description: Operate an IoT device on the user's behalf (lights, lock, alarm, thermostat, garage door).
