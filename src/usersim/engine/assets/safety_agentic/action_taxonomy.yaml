  modeled_blast_radius: user_org
  p_user_detect:
    value: 0.45
    rationale: Subagents often run quietly in the background; user surfaces them only when results arrive or something visibly fails.
  tags:
  - delegation
  - amplification
  provenance:
    source: p0.4 first pass
    last_reviewed: '2026-04-17'
