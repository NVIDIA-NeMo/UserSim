  initial_user_prompt:
    en_US: Email Acme Roofing back accepting their $14,800 quote — keep it short and professional, ask them to confirm a start date.
    en_IN: Email Acme Roofing back accepting their ₹6,80,000 quote — keep it short and professional, ask them to confirm a start date.
