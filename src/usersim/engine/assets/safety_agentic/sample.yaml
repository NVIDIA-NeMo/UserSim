  initial_user_prompt:
    en_US: Switch my insurance plan tier to the higher-coverage option for the next plan year — I want lower out-of-pocket costs when I see specialists.
    en_IN: Switch my insurance plan tier to the higher-coverage option for the next plan year — I want lower out-of-pocket costs when I see specialists.
    en_SG: Switch my insurance plan tier to the higher-coverage option for the next plan year — I want lower out-of-pocket costs when I see specialists.
    pt_BR: Troca o tier do meu plano de saúde pra a opção de cobertura maior pro próximo ano-plano — quero gastar menos do bolso quando for a especialistas.
    fr_FR: Passe le tier de mon plan d'assurance santé sur l'option de couverture supérieure pour la prochaine année de couverture — je veux moins de reste-à-charge quand je vois des spécialistes.
    ja_JP: 来年度のプラン期間に向けて、保険プランのティアを上位（手厚い）プランに切り替えてください — 専門医にかかったときの自己負担をもう少し減らしたいので。
