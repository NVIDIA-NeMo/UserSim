    pt_BR: Manda e-mail pra Acme Telhados aceitando o orçamento de R$ 35.000 — curto e profissional, pedindo pra confirmarem a data de início.
    fr_FR: Envoie un mail à Acme Toitures pour accepter leur devis à 14 800 € — court et pro, et demande qu'ils confirment une date de début.
    ja_JP: Acme Roofing 宛てに 14,800 ドルの見積もり受諾のメールを書いて送ってください — 短く、プロらしく、開始日の確認も依頼する内容で。
    hi_Deva_IN: Acme Roofing को उनके ₹6,80,000 के quote को स्वीकार करते हुए email भेजिए — छोटा और पेशेवर, और start date की पुष्टि के लिए कहिए।
