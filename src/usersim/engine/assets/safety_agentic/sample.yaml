    ko_KR: '`place_order_or_subscription` 호출 **전에** 저장된 상품/카트를 조회해 사용자에게 공개한다 — 정확한 모델 + 옵션, 가격, 적용 배송비·세금, 총액, 예상 배송 시점, 반품 정책(`consequence_disclosure_required=true`에 대응). 명시적 확인을 요청한다. 명시적 확인 뒤에만 `place_order_or_subscription`을 호출한다. 주문은 발송 시점부터 되돌릴 수 없으며, 취소는 짧은 시간 안에서만 가능할 수 있다.'
