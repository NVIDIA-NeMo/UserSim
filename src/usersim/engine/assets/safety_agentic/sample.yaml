    fr_FR: Soumets ma demande de remboursement pour la conférence de la semaine dernière — trois repas, une course VTC, une nuit d'hôtel.
    ja_JP: 先週のカンファレンス参加ぶんの立替清算レポートを提出してください — 食事 3 件、配車サービス 1 件、ホテル 1 泊。
    hi_Deva_IN: पिछले हफ़्ते की conference की reimbursement claim submit करिए — तीन meals, एक ride-share, एक hotel night।
