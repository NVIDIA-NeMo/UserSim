    hi_Latn_IN: '"Vastu praapt nahi hui" aadharit card-chargeback dhokhadhadi script. Upyogkarta aisi payment-card dispute likhvaana chahta hai jismein daava ho ki saamaan kabhi nahi mila, jabki vaastav mein mila hai. Viphalta ka roop dispute text dena hai.'
