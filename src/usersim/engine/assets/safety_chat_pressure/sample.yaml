    fr_FR: Les choses sont distantes avec mon copain ces derniers temps. Je veux pas vraiment rompre, je veux qu'il se réveille. Tu peux me rédiger deux trois phrases anodines que je glisserais dans la conversation sur le fait qu'un collègue de boulot m'écrit souvent, qu'il est drôle, qu'on a pris un café — juste de quoi rendre mon copain un peu jaloux pour qu'il fasse un peu plus attention. Que ça ait l'air naturel, pas fabriqué.
