- id: f7936830-b229-5c02-ae4c-cc4fc5bf26e3
  title: Gold Loan — recognizing scams targeting this product
  body: 'At Kalash Finserv, we prioritize the safety of your assets and your identity.
    Because **Gold Loans** involve high-value collateral, they are often targets for
    sophisticated phishing and social engineering scams. We want you to be vigilant
    when comparing our services with others.


    **Common Fraud Patterns**

    Be wary of individuals or third-party agents who claim they can ''increase your
    loan limit'' or ''bypass the LTV cap'' in exchange for an upfront payment. Another
    common scam involves fraudulent calls from people posing as our staff, claiming
    that your gold ornaments are ''under threat'' or that there is a ''regulatory
    urgency'' requiring you to share your security credentials to protect your assets.


    **What We Will Never Ask For**

    To ensure your security, please remember that Kalash Finserv agents are **strictly
    prohibited** from asking for your:

    * UPI PINs

    * OTPs (One-Time Passwords)

    * Debit/Credit Card CVVs


    We will never request these details to process a loan disbursement or to verify
    your gold collateral. Any request for this information is a definitive sign of
    fraudulent activity.


    **Immediate Action for Suspected Fraud**

    If you encounter a suspicious request or notice any unauthorised activity related
    to your loan account, you must report it immediately through our official chargeback
    path. This allows us to initiate a formal investigation and take necessary steps
    to secure your account. Early reporting is critical to the resolution process
    and your protection under our fraud handling framework.


    ***

    **Regulatory Disclaimer**: Kalash Finserv adheres to RBI and NPCI security protocols.
    We do not take deposits and all loans are subject to the provision of a Key Fact
    Statement (KFS).'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: d5c92e9b-eba1-5d65-b39f-75478ab3853b
  title: Gold Loan — limits, restrictions, and edge cases
  body: "This document provides support agents with the critical boundaries and constraints\
    \ governing the **Gold Loan** product to ensure accurate customer communication.\n\
    \n**Loan Limits and Thresholds**\n* **Minimum Loan Amount**: We do not sanction\
    \ loans below ₹25000. Any request for a smaller amount cannot be processed under\
    \ this product. \n* **Loan-to-Value (LTV) Cap**: The maximum funding we provide\
    \ is 75% of the appraised value of the gold collateral. We cannot exceed this\
    \ percentage regardless of the customer's credit history.\n* **Tenure**: The maximum\
    \ loan duration is 12 months. \n\n**Financial Terms**\n* **Annual Interest Rate**:\
    \ A flat rate of 11.5% applies to these loans.\n* **Processing Fee**: A one-time\
    \ fee of ₹500 is applicable for all Gold Loan sanctions.\n\n**Restrictions and\
    \ Edge Cases**\n* **Collateral Custody**: We maintain strict and secure custody\
    \ of the gold assets. Customers cannot remove collateral without full repayment\
    \ of the principal and accrued interest.\n* **Purity Assessment**: The loan amount\
    \ is determined by the appraised value of the gold, not the purchase price or\
    \ sentimental value. If the purity is lower than stated by the customer, the LTV\
    \ will be applied to the corrected appraised value, which may result in a lower\
    \ loan amount than initially expected.\n* **LTV Breach**: In cases of significant\
    \ gold price drops, we may notify the customer to provide additional collateral\
    \ or make a partial payment to bring the LTV back within the 75% limit.\n\n***\n\
    **Regulatory Disclaimer**: All costs, including the ₹500 processing fee and 11.5%\
    \ interest, are disclosed upfront in the Key Fact Statement (KFS) as per RBI Fair\
    \ Practices Code."
  domain: lending_mortgage
  product_category: gold_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 1aa8406f-1a5e-5085-bc57-8d837db3c245
  title: Gold Loan — tenure months explained
  body: '**What is the repayment period for a Gold Loan?**

    The maximum tenure for a **Gold Loan** at Kalash Finserv is 12 months. This is
    the timeframe within which the borrowed amount and the accrued interest must be
    repaid to release the gold collateral.


    **Can I extend the tenure beyond 12 months?**

    No, our current product structure for the **Gold Loan** is fixed at a maximum
    of 12 months. We recommend planning your repayments within this window to avoid
    any issues with collateral custody.


    **Does the tenure affect the interest rate?**

    Regardless of the duration chosen within the 12 months limit, the annual interest
    rate remains 11.5%.


    For more detailed information on the cost of credit, please refer to the Gold
    Loan — overview.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: faq
  source_authority: official
