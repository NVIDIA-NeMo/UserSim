  institution_id: kalash_finserv
- id: ad5082ac-e267-596c-935d-64a2900844ae
  title: Two-Wheeler Loan — down payment pct explained
  body: '**What is the down payment requirement for a Two-Wheeler Loan?**

    To ensure a balanced risk-to-equity ratio, we require a **down payment of 15%**
    of the vehicle''s total cost. This amount is paid by you directly to the dealership,
    and we finance the remaining 85% of the eligible value.


    **Can I increase my down payment to reduce my EMI?**

    Yes, while 15% is the minimum required, you may pay a higher percentage upfront.
    This reduces the principal loan amount, thereby reducing your monthly EMI over
    the **36 months** tenure.


    **Does the down payment cover the processing fee?**

    No. The **down payment of 15%** is separate from the **processing fee of ₹1500**.
    The processing fee is a one-time charge for the administrative costs of sanctioning
    your loan.


    For a full breakdown of costs, please refer to the Two-Wheeler Loan — overview.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 76c0b4b6-70d9-5057-b20c-5fecb7795761
  title: Two-Wheeler Loan — cancel, close, or downgrade
  body: 'If you wish to end your loan agreement or change your current terms, please
    follow these steps.


    **Scenario A: Closing the Loan (Foreclosure)**

    Use this process if you have the funds to pay off the entire remaining balance
    before the **36 months** tenure expires.

    1.  Tell us that you wish to foreclose your Two-Wheeler Loan.

    2.  We will provide you with a final settlement amount, which includes the remaining
    principal and any accrued interest up to the date of payment.

    3.  Confirm your acceptance of the **Foreclosure Charge** as disclosed in your
    **Key Fact Statement (KFS)**.

    4.  Make the full payment. Once verified, we will issue a No Objection Certificate
    (NOC) and release the hypothecation on your vehicle.


    **Scenario B: Cancelling a Loan Application**

    Use this process if you have applied but the loan has not yet been disbursed.

    1.  Inform us that you wish to withdraw your application for the Two-Wheeler Loan.

    2.  We will verify the status of the application. If funds have not been moved,
    we will cancel the request.

    3.  We will confirm the cancellation via your registered contact method. Note
    that any processing fees already deducted may be subject to our refund policy
    based on the stage of processing.


    **Scenario C: Downgrading/Modifying Terms**

    Because the Two-Wheeler Loan is a structured product with a fixed **annual interest
    rate of 12.9%** and a **36 months** tenure, ''downgrading'' typically requires
    closing the existing loan and applying for a new one with different parameters.


    ***

    **Note:** All closure requests are handled with a ''customer-first'' philosophy,
    ensuring transparent communication of final dues.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 910bac7d-7e26-500d-9c9d-7ae0f0485be2
  title: Two-Wheeler Loan — an unexpected charge or amount
  body: '**Symptom:** You notice a charge on your bank statement that does not match
    your expected monthly EMI or a fee you don''t recognise.


    **Likely Causes**

    1.  **EMI Bounce Charge:** The most common cause is a failed repayment due to
    insufficient funds or a mandate issue.

    2.  **Processing Fee:** A one-time charge of **₹1500** applied at the start of
    the loan.

    3.  **Interest Accrual:** An adjustment due to a payment made after the due date.


    **What to check in order**

    1.  **Check your repayment date:** Compare the date of the charge with your scheduled
    EMI date. If the charge appeared shortly after a failed payment attempt, it is
    likely an **EMI Bounce Charge**.

    2.  **Review your KFS:** Check your **Key Fact Statement (KFS)** to see if the
    charge matches the **processing fee of ₹1500** or other disclosed costs.

    3.  **Verify Balance:** Ensure the amount aligns with the **annual interest rate
    of 12.9%** applied to your outstanding principal.


    **The Fix**

    *   If the charge is an **EMI Bounce Charge**, ensure your account is funded and
    the repayment mandate is active to avoid future penalties.

    *   If you believe the charge is an error, tell us the specific date and amount
    of the transaction.


    **When we escalate**

    If the charge cannot be reconciled during the conversation, we will raise a formal
    dispute case. This is handled following the RBI''s harmonised turn-around-time
    (TAT) framework. You will receive a ticket number and a resolution timeline via
    your registered email.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9d717f90-06c8-5d53-a159-b0bcc6b43524
  title: Two-Wheeler Loan — required documentation
  body: 'To proceed with a Two-Wheeler Loan, the following documentation is mandatory
    for KYC verification and credit appraisal:


    | Requirement | Mandatory Documents | Outcome if Missing |

    | :--- | :--- | :--- |

    | **Identity Proof** | Aadhaar Card, PAN Card, or Passport | Application paused
    until verified |

    | **Address Proof** | Voter ID, Utility Bill, or Registered Rent Agreement | Application
    paused until verified |

    | **Income Proof** | Last 3 months'' salary slips and 6 months'' bank statements
    | Credit limit/eligibility may be reduced |

    | **Vehicle Quote** | Proforma Invoice from an authorised dealer | Loan amount
    cannot be sanctioned |

    | **Down Payment** | Proof of **15%** payment to the dealer | Fund disbursement
    will not occur |


    ***

    **Note:** All documents must be clear and valid. Multi-factor authentication (MFA)
    is required during the digital submission process.'
