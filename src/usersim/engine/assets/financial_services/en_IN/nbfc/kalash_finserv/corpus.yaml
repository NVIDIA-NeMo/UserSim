    | Requirement | Tier 1 (Preferred) | Tier 2 (Standard) | Outcome |

    | :--- | :--- | :--- | :--- |

    | **Credit Score** | 750+ | 650 - 749 | Sanctioned |

    | **Employment** | Salaried (2+ years) | Salaried (6 months+) | Sanctioned |

    | **Income Stability** | High | Moderate | Sanctioned |

    | **Down Payment** | 15% (Mandatory) | 15% (Mandatory) | Sanctioned |

    | **Documentation** | Full KYC + 3mo Payslips | Full KYC + 1mo Payslip | Sanctioned
    |


    **Key Constants for all Tiers:**

    - **Annual Interest Rate:** 12.9%

    - **Tenure:** 36 months

