- id: 527b5a00-d962-57c4-8b84-e04b91928dab
  title: Gold Loan — cancel, close, or downgrade
  body: "If you wish to close your Gold Loan account before the end of the tenure\
    \ or cancel an application, please follow these steps. Note that once funds are\
    \ disbursed, 'cancellation' is treated as 'foreclosure'.\n\n**To Close (Foreclose)\
    \ an Active Loan:**\n1. **Request Total Outstanding**: Tell us you wish to foreclose\
    \ your loan. We will provide the exact total outstanding amount, which includes\
    \ the remaining principal and accrued interest up to the current date.\n2. **Confirm\
    \ Foreclosure Charges**: We will disclose the applicable **Foreclosure Charge**\
    \ as per your **Key Fact Statement (KFS)**. You must confirm your acceptance of\
    \ this charge to proceed.\n3. **Remit Final Payment**: Provide the total payment\
    \ (Principal + Interest + Foreclosure Charge). We will confirm receipt of the\
    \ funds and update your loan status to 'Closed'.\n4. **Collateral Retrieval**:\
    \ We will coordinate the physical return of your gold assets. You will be required\
    \ to undergo KYC verification again before the gold is handed back.\n\n**To Cancel\
    \ a Pending Application:**\n1. **Request Cancellation**: Tell us you wish to withdraw\
    \ your application for a Gold Loan.\n2. **Confirmation of No Disbursement**: We\
    \ will verify that no funds have been disbursed to your account. If the loan was\
    \ not sanctioned, the application is cancelled immediately.\n3. **Asset Return**:\
    \ If you have already deposited gold for appraisal, we will arrange for the immediate\
    \ return of your assets.\n\n**To Downgrade/Modify Loan Amount:**\n1. **Request\
    \ Modification**: Tell us you wish to reduce your loan amount. \n2. **Partial\
    \ Repayment**: You must pay back the difference between your current loan and\
    \ the desired lower amount.\n3. **Revised Terms**: We will provide a revised repayment\
    \ schedule reflecting the new principal balance."
  domain: lending_mortgage
  product_category: gold_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: acfba9c9-a19f-595a-b7f3-844fba260ca8
  title: Gold Loan — an unexpected charge or amount
  body: '**Symptom**: You notice a charge on your statement or a deduction from your
    account that you did not expect.


    **Likely Causes**

    * **EMI Bounce Charge**: The most common cause is a failed repayment due to insufficient
    funds or a mandate issue, triggering a penalty.

    * **Accrued Interest**: Interest calculated at **11.5%** per annum may appear
    higher if there were delays in previous payments.

    * **Processing Fee**: A one-time charge of **₹500** is applied at the start of
    the loan; this may appear as a deduction from the disbursed amount.


    **What to Check**

    1. **Check your KFS**: Review your **Key Fact Statement (KFS)** to verify all
    agreed-upon fees and the **11.5%** interest rate.

    2. **Verify Repayment Date**: Check if your bank account had sufficient funds
    on the scheduled EMI date to rule out an **EMI Bounce Charge**.

    3. **Review Loan Tenure**: Ensure the charge is not a result of the loan exceeding
    the **12 months** tenure.


    **The Fix**

    * **For Incorrect Charges**: Tell us which specific charge is unexpected. We will
    review your transaction history against the product terms.

    * **For Failed Mandates**: If the charge was a bounce fee, ensure your account
    is funded and ask us to re-trigger the repayment mandate.


    **When We Escalate**

    If we cannot resolve the discrepancy immediately, we will raise a formal case
    with our finance team. You will receive a case reference number and a resolution
    timeline following the RBI''s harmonised TAT framework. If the issue remains unresolved,
    the matter will be routed to our designated Nodal Officer.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 3afda7ca-63a3-5856-afb2-60e6bb55dc37
  title: Gold Loan — required documentation
  body: 'To ensure a speed of sanction and compliance with RBI guidelines, the following
    documentation is required to qualify for a Gold Loan.


    | Requirement | Documentation Needed | Outcome |

    | :--- | :--- | :--- |

    | **Identity Verification** | Valid Govt ID (Aadhaar, PAN, Voter ID, or Passport)
    | Mandatory for KYC compliance |

    | **Address Proof** | Recent Utility Bill, Rental Agreement, or Aadhaar | Mandatory
    for disbursement |

    | **Asset Verification** | Physical Gold Assets for appraisal | Determines loan
    amount via **75% LTV** |

    | **Minimum Funding** | Application for at least **₹25,000** | Necessary to meet
    minimum loan threshold |

    | **Repayment Setup** | Bank Account details for mandate setup | Required for
    the **12 months** tenure |


    ***

    **Note**: All documents must be original for verification. Multi-factor authentication
    (MFA) will be used to verify your identity digitally during the application process.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: eligibility_matrix
