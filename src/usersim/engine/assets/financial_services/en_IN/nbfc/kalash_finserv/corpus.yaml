- id: 19b13663-4ce1-5c2b-a158-d7dd40e65001
  title: Personal Loan — account security best practices
  body: 'At Kalash Finserv, the security of your financial data is our highest priority.
    As a user of our **Personal Loan** product, we urge you to maintain strict vigilance
    over your account credentials to prevent unauthorised access.


    **Essential Security Rules**

    We adhere to strict RBI and NPCI security protocols. Please remember that Kalash
    Finserv agents will **never** ask you for the following:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * Your Debit/Credit Card CVV


    If any individual claiming to be from our institution requests these details,
    it is a fraudulent attempt. Do not share this information under any circumstances.


    **Safe Account Management**

    We mandate Multi-factor authentication (MFA) and KYC verification for all state-changing
    actions, such as updating your repayment mandate or requesting a loan top-up.
    We recommend that you regularly review your statements for any unfamiliar transactions.


    **Reporting Fraudulent Activity**

    If you suspect your account has been compromised or notice an unauthorised transaction,
    you must report it to us immediately. Please initiate a report through the official
    chargeback path. This allows us to start a formal investigation and take corrective
    action to secure your funds.


    **Our Commitment**

    We follow a ''customer-first'' philosophy in handling disputes, adhering to the
    RBI''s harmonised turn-around-time (TAT) framework for all resolutions. For further
    details on how we protect your account, please refer to Personal Loan — fraud
    and unauthorized-activity protection.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 569b0147-8c74-54c5-b38e-fe3e879ed186
  title: Personal Loan — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms and
    conditions of your **Personal Loan** agreement with Kalash Finserv.


    **1. Right to Modify Terms**

    We reserve the right to amend the terms of your loan agreement, including changes
    to the annual interest rate of 14.5%, the processing fee of 2%, or the EMI Bounce
    Charge of ₹500. Such changes may be necessitated by regulatory shifts, RBI mandates,
    or changes in the cost of funds.


    **2. Notice Period**

    We commit to transparency. In the event of a change in terms, we will provide
    you with a written notice at least 30 days prior to the effective date of the
    change. This notice will clearly state the previous term and the revised term.


    **3. Acceptance and Termination**

    By continuing your repayments after the notice period, you are deemed to have
    accepted the revised terms. If you find the new terms unacceptable, you have the
    right to foreclose your loan. Please note that a **Foreclosure Charge** of 4%
    will apply to the remaining principal balance upon early closure.


    **4. Regulatory Alignment**

    All changes to terms will strictly adhere to the RBI Fair Practices Code and Digital
    Lending Guidelines. We will provide a revised **Key Fact Statement (KFS)** if
    the overall cost of credit is significantly impacted by the term change.


    **5. Dispute Resolution**

    Any disagreements regarding the application of new terms will be routed through
    our tiered support system, escalating to the designated Nodal Officer if the issue
    remains unresolved within the RBI-mandated TAT framework.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 299c48c3-8119-5f70-a2ff-4a6976a8f82d
  title: Personal Loan — getting started walkthrough
  body: "This guide is intended for support agents to assist customers in navigating\
    \ the journey from application to disbursement for a **Personal Loan**. \n\n**Step\
    \ 1: Initial Inquiry and Eligibility**\nGuide the customer through their expressed\
    \ needs. Confirm they are looking for flexible, unsecured funding. Ensure they\
    \ understand that we recommend products based on credit eligibility without guaranteeing\
    \ specific outcomes. Refer them to Personal Loan — eligibility requirements for\
    \ baseline criteria.\n\n**Step 2: Disclosure and KFS**\nBefore any sanction, the\
    \ customer must be provided with a **Key Fact Statement (KFS)**. You must explicitly\
    \ disclose the all-in cost of credit, which includes:\n* An annual interest rate\
    \ of 14.5%\n* A processing fee of 2%\n* The potential for a **Foreclosure Charge**\
    \ of 4% if they pay off the loan early\n* The **EMI Bounce Charge** of ₹500 for\
    \ failed repayments\n\n**Step 3: Verification and KYC**\nExplain that Multi-factor\
    \ authentication (MFA) and mandatory KYC verification are required. Remind the\
    \ customer that no agent will ask for their OTP or UPI PIN during this process.\n\
    \n**Step 4: Loan Finalisation**\nOnce the customer accepts the KFS and passes\
    \ credit checks, confirm the tenure (up to 60 months). Ensure the repayment mandate\
    \ is set up to avoid the ₹500 bounce charge.\n\n**Step 5: Disbursement**\nAfter\
    \ final verification, funds are disbursed to the customer's verified account.\
    \ Remind them that support is available Monday to Saturday, 9:00 AM to 7:00 PM\
    \ IST. For issues with the first payment, refer to Personal Loan — a failed or\
    \ pending action."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
