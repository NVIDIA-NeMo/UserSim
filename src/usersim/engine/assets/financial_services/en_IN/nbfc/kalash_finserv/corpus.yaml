- id: 0a50a07b-049b-52b0-b074-ae192ae0a8c7
  title: EMI Repayment Mandate — account security best practices
  body: 'Your financial security is our priority at Kalash Finserv. Because the **EMI
    Repayment Mandate** involves automated debits from your bank account, it is critical
    to maintain strict security hygiene to prevent unauthorised access.


    **Our Uncompromising Security Protocols**

    We adhere to RBI and NPCI security standards. Please be aware that Kalash Finserv
    agents will **never** ask you for the following information under any circumstances:

    - Your UPI PIN

    - One-Time Passwords (OTPs)

    - Your Card CVV


    If any individual claiming to be from our institution requests these details to
    ''verify'' or ''update'' your mandate, treat it as a fraudulent attempt and do
    not share the information.


    **Best Practices for Customers**

    1. **Monitor Notifications**: We send a pre-debit notification 24 hours before
    the funds are withdrawn. If you receive a notification for an amount you do not
    recognise, alert us immediately.

    2. **Secure Your MFA**: Multi-factor authentication (MFA) is mandatory for all
    state-changing actions. Never share your MFA codes with anyone.

    3. **Review Statements**: Regularly check your bank statements for any unexpected
    **EMI Bounce Charges** of ₹500, which may indicate a mandate failure or attempted
    unauthorised debit.


    **Immediate Action for Fraud**

    If you suspect fraudulent activity related to your repayment mandate, you must
    report it immediately through our official chargeback path. This allows us to
    initiate a formal investigation and protect your funds. We follow the RBI''s harmonised
    turn-around-time (TAT) framework to ensure your disputes are resolved with a customer-first
    approach.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 5cf257bf-1515-5ae4-ab47-92a0e72e5121
  title: EMI Repayment Mandate — change-of-terms policy
  body: "This document outlines the policies regarding modifications to the terms\
    \ governing the **EMI Repayment Mandate** at Kalash Finserv. By opting for this\
    \ automated payment engine, the customer agrees to the following binding terms:\n\
    \n**Right to Amend Terms**\nWe reserve the right to amend the operational terms,\
    \ including fees and notification timelines, to ensure the long-term sustainability\
    \ of our lending pool and compliance with RBI Scale Based Regulations. \n\n**Specific\
    \ Financial Terms**\n- **Bounce Charges**: A penalty fee of ₹500 will be levied\
    \ whenever a scheduled Equated Monthly Instalment (EMI) repayment fails due to\
    \ insufficient funds or mandate issues. This fee is non-negotiable except under\
    \ exceptional, documented circumstances.\n- **Notification Window**: We commit\
    \ to providing a pre-debit notification 24 hours before the scheduled withdrawal.\
    \ Any change to this window will be communicated in writing.\n- **Processing Time**:\
    \ Any request to amend the mandate is subject to a processing period of 3 days.\n\
    \n**Notice of Change**\nIn the event of a change in terms, We will provide the\
    \ customer with a clear, transparent notice via registered email or SMS. If the\
    \ customer does not terminate the mandate or provide a written objection within\
    \ 30 days of such notice, the amended terms shall be deemed accepted.\n\n**Termination**\n\
    Customers may request to cancel the mandate provided all outstanding loan balances\
    \ are settled. We will provide a final confirmation once the mandate is deactivated\
    \ in our systems. For detailed steps on how to initiate this, please refer to\
    \ EMI Repayment Mandate — cancel, close, or downgrade."
  domain: payments
  product_category: emi_repayment_mandate
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: eb66a79c-8be3-583f-9e1c-b3a6e37f557d
  title: EMI Repayment Mandate — getting started walkthrough
  body: "This guide is for support agents assisting customers in onboarding with the\
    \ **EMI Repayment Mandate**, our automated payment engine designed for timely\
    \ repayments.\n\n**Product Overview**\n The mandate ensures that EMIs are deducted\
    \ automatically from the customer's linked bank account, reducing the risk of\
    \ late payments and maintaining the customer's credit health.\n\n**Step-by-Step\
    \ Onboarding Walkthrough**\n1. **KYC & Verification**: Ensure the customer has\
    \ completed mandatory KYC and MFA. We cannot initiate a mandate without verified\
    \ identity documents.\n2. **Bank Account Linking**: The customer provides the\
    \ bank account details from which the EMI will be debited. Ensure these details\
    \ match the verified KYC documents.\n3. **Mandate Authorization**: The customer\
    \ authorizes the mandate (via e-mandate or physical form). Explain that this is\
    \ a legal authorization for Kalash Finserv to collect the specific EMI amount\
    \ monthly.\n4. **KFS Disclosure**: Provide the customer with the **Key Fact Statement\
    \ (KFS)**. This is mandatory and must disclose the all-in annualized cost of credit,\
    \ including any potential **EMI Bounce Charges** of ₹500.\n5. **Confirmation**:\
    \ Once the bank confirms the mandate registration, notify the customer. \n\n**Critical\
    \ Operational Constants for Agents**\n- **Pre-Debit Notice**: Inform the customer\
    \ they will receive a notification 24 hours before each debit.\n- **Amendment\
    \ Period**: If the customer needs to change their bank account later, inform them\
    \ that the processing time for mandate amendments is 3 days.\n- **Penalty Awareness**:\
    \ Clearly state that any failed payment due to insufficient funds results in a\
    \ bounce charge of ₹500 to avoid future disputes."
  domain: payments
  product_category: emi_repayment_mandate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 07c7247b-b7c9-50ff-9a2d-84b747784dc3
  title: EMI Repayment Mandate — mandate amendment processing days explained
  body: '**How long does it take to update my bank account details for the EMI Repayment
    Mandate?**

    When you request a change to your linked bank account or mandate details, we require
    3 days for processing. This ensures that the new mandate is correctly registered
    with your bank and our payment engine to avoid any payment failures.


    **Will my EMI be delayed if I request a change?**

    If you request an amendment within 3 days of your scheduled EMI date, there is
    a risk that the current month''s payment may still be attempted from the old account.
    We recommend initiating updates well in advance of your payment date.


    **What happens if I don''t update my mandate in time?**

    If the payment fails due to an outdated mandate or insufficient funds, an **EMI
    Bounce Charge** of ₹500 will be applied. Please refer to EMI Repayment Mandate
    — bounce charge explained for more details.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: ba1eb3a7-452d-5452-bfc4-98c781e11b73
  title: EMI Repayment Mandate — make a change or update
  body: 'If you need to change the bank account linked to your **EMI Repayment Mandate**
    or update the mandate details, please follow these steps:


    **Prerequisites**

    - A valid, KYC-verified bank account in your name.

    - Current loan account number.


    **Steps to Update Your Mandate**

    1. **Request the Change**: Tell us that you wish to update your repayment bank
    account. Provide the new account number and IFSC code.

    2. **Identity Verification**: We will perform a mandatory MFA (Multi-Factor Authentication)
    check to verify your identity before any state-changing action is processed.

    3. **New Mandate Authorization**: We will send a mandate request to your new bank.
    You will need to authorize this request through your bank''s secure channel (e.g.,
    NetBanking or Debit Card authentication).

    4. **Processing Period**: Once you have authorized the new mandate, we will process
    the update. This takes 3 days to be fully implemented in our system.

    5. **Confirmation**: We will send you a confirmation notice once the new mandate
    is active and the old one is deactivated.


    **Important Note on Timing**

    To avoid an **EMI Bounce Charge** of ₹500, ensure this process is completed at
    least 5 business days before your next scheduled EMI date. If the update is still
    in the 3 days processing window when the EMI is due, the debit may still be attempted
    from your previous account.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: c2a2b1ae-ddff-5b97-99e7-2373d6e07c80
  title: EMI Repayment Mandate — access or login problems
  body: 'If you are experiencing issues accessing your mandate details or cannot complete
    an update to your **EMI Repayment Mandate**, please follow these troubleshooting
    steps:


    **Symptom: Unable to authorize new mandate or view current status**


    **Potential Causes**

    - Outdated KYC information.

    - MFA (Multi-Factor Authentication) failure.

    - Bank-side technical downtime during the authorization process.


    **Resolution Steps**

    1. **Check KYC Status**: Ensure your KYC is current. If your documents have expired,
    we cannot process state-changing actions. Ask us to verify your current KYC status.

    2. **Retry MFA**: If you are not receiving the authentication code, ensure your
    registered mobile number is active and has signal. Request a fresh OTP.

    3. **Verify Bank Connectivity**: If the bank''s authorization page fails to load,
    check if your bank''s servers are down. Wait 30 minutes and try the authorization
    step again.

    4. **Clear Session**: If the interface is frozen, we will reset your active session
    from our end to allow a fresh login.


    **When to Escalate**

    If the issue persists after these steps, we will raise a technical case with our
    payment engine team. You will receive a case reference number via SMS. Our team
    will investigate the API connectivity between Kalash Finserv and your bank. We
    aim to resolve technical access issues within 48 hours. If unresolved, the matter
    is escalated to our designated Nodal Officer.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 6837a1d1-514c-5eca-adef-b88065045c29
  title: EMI Repayment Mandate — qualification tiers
  body: 'The **EMI Repayment Mandate** is a mandatory requirement for all credit products
    at Kalash Finserv to ensure structured repayments. Qualification is based on the
    following criteria:


    | Customer Tier | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Standard Salaried** | Verified Bank Account + Completed KYC + MFA | Eligible
    for Standard Mandate |

    | **Emerging Middle Class** | Verified Bank Account + Completed KYC + MFA | Eligible
    for Standard Mandate |

    | **Unverified Account** | Missing KYC or Non-matching Account Name | Not Eligible
    (Must complete KYC first) |

    | **High-Risk Account** | Account with frequent bounce history (Internal Review)
    | Conditional Approval (May require higher down-payment on loan) |


    All eligible customers are provided a **Key Fact Statement (KFS)** disclosing
    the all-in cost, including the ₹500 **EMI Bounce Charge**, before the mandate
    is activated.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 71c40c95-3951-5866-8af3-65950868874b
  title: EMI Repayment Mandate — choosing between tiers or options
  body: 'When managing your repayments, you may consider our **EMI Repayment Mandate**
    versus manual payment options (where permitted for specific loan types).


    **EMI Repayment Mandate (Automated)**

    - **Cost**: No setup fee; however, a bounce charge of ₹500 applies if funds are
    insufficient.

    - **Convenience**: Fully automated; no need to remember dates.

    - **Risk**: Risk of bounce charges if the account is not funded.

    - **Best For**: Salaried professionals and customers who prefer a ''set and forget''
    approach to credit discipline.


    **Manual Repayment (Where Applicable)**

    - **Cost**: No bounce charges, but potential late payment penalties as per the
    specific loan product.

    - **Convenience**: Requires manual action every month.

    - **Risk**: High risk of missing a date, which negatively impacts your credit
    score.

    - **Best For**: Customers with irregular income streams who prefer to time their
    payments manually.


    We recommend the **EMI Repayment Mandate** for most customers to ensure timely
    repayments and avoid the stress of manual tracking. Remember, we provide a pre-debit
    notification 24 hours in advance to help you maintain sufficient balances.'
