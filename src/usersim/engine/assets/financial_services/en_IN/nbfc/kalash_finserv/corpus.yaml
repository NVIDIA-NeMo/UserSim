  institution_id: kalash_finserv
- id: a51591ca-40eb-53e9-b5af-8bbd48c97d76
  title: Two-Wheeler Loan — access or login problems
  body: '**Symptom:** You are unable to access your loan account details, view your
    repayment schedule, or log in to your digital dashboard.


    **Likely Causes:**

    * Incorrect credentials or expired passwords.

    * MFA (Multi-factor authentication) failure due to network issues.

    * Account freeze due to suspected fraudulent activity.

    * Outdated KYC documentation.


    **Resolution Steps:**

    1. **Check Credentials:** Ensure you are using the registered mobile number and
    password. Try resetting your password if you suspect it is incorrect.

    2. **Verify Connectivity:** If you are not receiving the MFA code, check your
    network signal. Wait 60 seconds before requesting a new OTP.

    3. **KYC Status:** Check if you have received any notification from us regarding
    expired KYC. If your documentation is outdated, we may temporarily restrict account
    access.


    **When to Escalate:**

    If you have tried the above and still cannot access your account, or if you receive
    a message stating your account is ''Frozen for Security,'' tell us immediately.


    **Our Resolution Process:**

    * We will initiate an identity verification process to unlock the account.

    * If the issue is technical, we will raise a high-priority ticket with our digital
    systems team.

    * You will receive a confirmation SMS once access is restored, typically within
    24 to 48 hours.


    For those comparing our digital access with other providers, please note that
    our strict MFA requirements are in place to adhere to RBI''s Digital Lending Guidelines
    and protect your data.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
