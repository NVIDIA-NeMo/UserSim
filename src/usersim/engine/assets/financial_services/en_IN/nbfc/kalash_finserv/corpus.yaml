  title: Gold Loan — eligibility requirements
  body: 'To qualify for a **Gold Loan**, the following conditions must be met:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Collateral Value** | Gold must be appraised at $\ge$ ₹33,334 | Eligible for
    minimum loan of ₹25000 (at 75% LTV) |

    | **Minimum Loan Request** | Request $\ge$ ₹25000 | Eligible for processing |

    | **Verification** | Valid KYC + MFA completion | Eligible for disbursement |

    | **Asset Status** | Gold must be unencumbered | Eligible for pledge |


    *Failure to meet the minimum loan amount of ₹25000 based on the 75% LTV cap will
    result in the application being declined.*'
