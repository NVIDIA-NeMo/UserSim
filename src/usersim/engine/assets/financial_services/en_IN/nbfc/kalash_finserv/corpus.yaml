- id: 3b3b2d00-d2fb-5b49-8f3f-f76c6d4f1be9
  title: Two-Wheeler Loan — check status or history
  body: 'If you are an existing customer, you can easily track your repayment progress
    and check the current status of your Two-Wheeler Loan by following these steps:


    **Requirements before starting**

    - Your registered mobile number for MFA verification.

    - Your loan account number (found on your initial sanction letter).


    **Steps to check your status**

    1. **Request Account Summary**: Tell us that you would like to check the status
    of your Two-Wheeler Loan. We will then trigger a Multi-factor authentication (MFA)
    request to your registered mobile number.

    2. **Verify Identity**: Confirm the MFA code provided to you. This ensures your
    financial data remains secure.

    3. **Review Loan Details**: Once verified, we will provide your current outstanding
    balance, the number of EMIs paid, and the remaining tenure out of your total **36
    months** term.

    4. **Request Transaction History**: If you need a detailed list of payments, ask
    us for your repayment history. We will provide a chronological list of all debits
    made via your repayment mandate.

    5. **Confirm Statement Delivery**: If you require an official document for tax
    or record-keeping purposes, ask us to send your latest loan statement to your
    registered email address. We will confirm once the email has been dispatched.


    **How you know it worked**

    You will receive a clear summary of your remaining balance and a confirmation
    message once your detailed statement has been emailed to you.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 7193fb07-f326-58b7-a496-e88923a6408f
  title: Two-Wheeler Loan — a declined or blocked action
  body: '**Symptom**: You are informed that your loan application is declined, or
    a specific action (such as a top-up or tenure change) is blocked.


    **Likely Causes**

    - **KYC Discrepancy**: Your documents may not match the details provided, or the
    mandatory KYC verification was incomplete.

    - **Down Payment Shortfall**: The provided down payment is less than the required
    **15%** of the vehicle''s value.

    - **Credit Eligibility**: Your current credit profile may not meet the minimum
    requirements for the **12.9% annual interest rate** product.

    - **Authentication Failure**: A failure in the MFA process during a state-changing
    request.


    **What to check in order**

    1. **Verify Documentation**: Ensure all submitted identity and address proofs
    are current and clearly legible.

    2. **Confirm Down Payment**: Check that the amount paid as a down payment exactly
    meets or exceeds **15%** of the appraised vehicle value.

    3. **Review Mandate Status**: If the action is a payment-related block, ensure
    your repayment mandate is active and has sufficient funds to avoid an **EMI Bounce
    Charge**.


    **The Fix**

    - **For KYC/Docs**: Provide the missing or updated documents to us directly. We
    will re-initiate the verification process.

    - **For Down Payment**: Pay the remaining difference to reach the **15%** threshold.

    - **For Authentication**: Request a new MFA code and ensure you are using the
    registered mobile device.


    **When to escalate**

    If you have provided all correct documents and met the **15% down payment** requirement
    but the action remains blocked, we will raise a formal case with our credit underwriting
    team. You will receive a final decision or a request for further clarification
    within the RBI-mandated turn-around-time (TAT).'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 7843d70f-396f-561b-8dcb-6dfb46d8770f
  title: Two-Wheeler Loan — when to switch or upgrade
  body: 'Our support agents should use this guide to help customers determine if the
    Two-Wheeler Loan is still the right fit or if another product is more appropriate.


    **When to stay with the Two-Wheeler Loan**

    This product is ideal for customers who need a structured, asset-backed loan with
    a clear **36 months** tenure and a predictable annual interest rate of **12.9%**,
    provided they can afford the initial **15% down payment**.


    **When to consider switching or upgrading**

    - **Need for Unsecured Funds**: If the customer no longer requires vehicle financing
    but needs flexible funding for diverse needs without collateral, refer them to
    the Personal Loan — overview. Note that Personal Loans may have different tenure
    options compared to our **36 months** vehicle limit.

    - **Urgent Liquidity**: If the customer has gold assets and needs faster liquidity
    without a down payment requirement, the Gold Loan — overview is a better alternative.

    - **Short-term Electronics**: For small-ticket purchases of appliances rather
    than a vehicle, the Consumer Durable EMI — overview provides interest-free short-term
    credit.


    **Summary for Agent**

    Switch to another product if the customer''s need has shifted from ''mobility''
    to ''general liquidity'' or ''consumer electronics''.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 444f045c-039f-56a5-ab9f-5a1001dabfeb
  title: Two-Wheeler Loan — comparison vs. alternatives and when not to choose it
  body: 'Choosing the right financing depends on your assets, your immediate cash
    flow, and the purpose of the loan. Here is how our Two-Wheeler Loan compares to
    other options at Kalash Finserv.


    **Two-Wheeler Loan Specifications**

    - **Annual Interest Rate**: **12.9%**

    - **Down Payment**: **15%**

    - **Tenure**: **36 months**

    - **Processing Fee**: **₹1500**


    **Comparison vs. Alternatives**

    - **Vs. Personal Loans**: Unlike a Personal Loan, our Two-Wheeler Loan is secured
    by the vehicle. This typically makes the approval process specific to the asset''s
    value. While a Personal Loan offers more flexibility in use, it does not provide
    the structured mobility financing found here.

    - **Vs. Gold Loans**: A Gold Loan requires gold collateral and focuses on quick
    liquidity. If you have gold assets, you can avoid the **15% down payment** required
    for a Two-Wheeler Loan, but you must pledge physical gold.

    - **Vs. Consumer Durable EMI**: This is for electronics and appliances. It is
    generally interest-free and short-term, whereas the Two-Wheeler Loan is a longer-term
    commitment of **36 months** at **12.9%** interest.


    **When NOT to choose this product**

    - **If you cannot afford the down payment**: If you are unable to provide the
    **15% down payment** upfront, this product will not be suitable.

    - **If you need a longer tenure**: If you require a repayment period longer than
    **36 months**, you may need to explore other lending options.

    - **If you need unsecured credit**: If you do not want the vehicle to be hypothecated
    to the bank, a Personal Loan is the appropriate choice.


    ***

    **Standard of Care**: We recommend products based on your expressed needs and
    credit eligibility. We provide financial education but do not offer individualized
    tax, legal, or investment advice.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4343d443-bcf0-55cf-bb3c-5ad4fa795529
  title: Two-Wheeler Loan — cost and charges
  body: '**What are the primary costs associated with my Two-Wheeler Loan?**

    The primary costs are the annual interest rate of **12.9%** and a one-time processing
    fee of **₹1500** charged at the start of the loan.


    **Is there a down payment requirement?**

    Yes, we require a **15% down payment** of the vehicle''s value before the loan
    can be sanctioned.


    **What happens if I miss an EMI payment?**

    If a scheduled repayment fails due to insufficient funds or mandate issues, an
    **EMI Bounce Charge** will be levied. We encourage you to maintain sufficient
    balance to avoid these penalties.


    **Where can I see the total cost of my loan?**

    All costs, including interest, processing fees, and potential foreclosure charges,
    are clearly listed in your **Key Fact Statement (KFS)**, which we provide before
    the loan is sanctioned.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: db24f2be-8ff3-5bb7-908b-9075d3fe1cf8
  title: Two-Wheeler Loan — resolve a common request end-to-end
  body: 'This guide explains how to request and complete the full foreclosure (early
    payoff) of your Two-Wheeler Loan.


    **Requirements before starting**

    - Your loan account number.

    - Sufficient funds in your bank account to cover the remaining principal, accrued
    interest, and applicable foreclosure charges.


    **Steps to resolve the request**

    1. **Request Foreclosure Quote**: Tell us that you wish to pay off your Two-Wheeler
    Loan in full. We will calculate the exact outstanding amount, including the remaining
    principal and interest up to the current date.

    2. **Review the Key Fact Statement (KFS)**: We will provide you with the final
    settlement figure, which includes any **Foreclosure Charges** as disclosed in
    your original **Key Fact Statement (KFS)**.

    3. **Confirm Payment Method**: Tell us the account from which you wish to make
    the final payment. We will then trigger a final payment request via your secure
    payment channel.

    4. **Complete Authentication**: Perform the mandatory MFA verification to authorize
    the full disbursement of the settlement amount.

    5. **Receive Closure Confirmation**: Once the payment is successfully processed,
    we will provide a confirmation of loan closure.

    6. **Request No Objection Certificate (NOC)**: Ask us to issue the NOC for your
    vehicle. We will process this and send the digital copy to your registered email,
    followed by the physical copy via post to remove the hypothecation from your vehicle
    registration.


    **How you know it worked**

    You will receive a ''Loan Closed'' status in your account summary and a formal
    NOC document confirming that Kalash Finserv no longer holds a lien on your two-wheeler.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: f7cf2b32-1b63-5d91-aec9-11fdabe694cd
  title: Two-Wheeler Loan — a discrepancy in your records or statement
  body: '**Symptom**: A customer reports that their loan statement shows an incorrect
    balance, a missing payment, or an unexpected charge.


    **Likely Causes**

    - **Payment Latency**: A payment made via the repayment mandate may take 24-48
    hours to reflect in the statement.

    - **EMI Bounce Charge**: A failed repayment attempt may have triggered an **EMI
    Bounce Charge** that the customer has not noticed.

    - **Interest Calculation**: Confusion regarding how the **12.9% annual interest
    rate** is applied to the reducing balance.

    - **Processing Fee Error**: A discrepancy in the initial **₹1500** processing
    fee application.


    **What to check in order**

    1. **Verify Payment Date**: Check the date of the missing payment. If it was within
    the last 48 hours, advise the customer that it is likely still in transit.

    2. **Audit Bounce History**: Review the account for any failed mandate attempts
    that would justify an **EMI Bounce Charge**.

    3. **Cross-Reference KFS**: Compare the charged fees against the original **Key
    Fact Statement (KFS)** to ensure the **₹1500** processing fee was applied correctly.

    4. **Recalculate Interest**: Verify that the interest being charged aligns with
    the **12.9%** annual rate on the current outstanding principal.


    **The Fix**

    - **For Latency**: Provide the customer with the expected date of reflection.

    - **For Missing Payments**: If the customer can provide a bank-stamped proof of
    payment that is not reflecting after 48 hours, we will manually reconcile the
    account.

    - **For Incorrect Charges**: If an **EMI Bounce Charge** was applied in error,
    we will initiate a correction.


    **When to escalate**

    If the discrepancy cannot be resolved through transaction history and KFS verification,
    the agent must route the issue to the designated Nodal Officer. The customer will
    be notified of the investigation, and a resolution will be provided following
    the RBI''s harmonised TAT framework.'
