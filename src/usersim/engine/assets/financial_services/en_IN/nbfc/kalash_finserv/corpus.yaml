- id: a8d2ec21-eceb-5f03-ad77-7bdeb79d81a5
  title: Personal Loan — fraud and unauthorized-activity protection
  body: "At Kalash Finserv, we are committed to protecting your financial wellbeing.\
    \ As you compare our Personal Loan with other market offerings, please be aware\
    \ of specific fraud patterns targeting unsecured credit. \n\n**Common Fraud Patterns**\n\
    Fraudsters may pose as Kalash Finserv agents, offering 'instant approval' or 'pre-approved\
    \ limit increases' in exchange for an upfront processing fee paid via a personal\
    \ UPI ID. We will never ask you to transfer fees to an individual's account. Another\
    \ common scam involves phishing links that mimic our application page to steal\
    \ your KYC documents.\n\n**Our Security Promise**\nTo ensure the safety of your\
    \ funds and data, we adhere to strict RBI and NPCI security protocols. Our agents\
    \ are **strictly prohibited** from asking you for the following:\n* Your UPI PIN\n\
    * Your OTP (One-Time Password)\n* Your Debit/Credit Card CVV\n\nAll state-changing\
    \ actions and fund disbursements require mandatory **Multi-factor authentication\
    \ (MFA)** and **KYC verification**. If an individual claiming to be from Kalash\
    \ Finserv asks for these details, treat the interaction as fraudulent.\n\n**Immediate\
    \ Action for Unauthorized Activity**\nIf you suspect fraudulent activity or notice\
    \ an unauthorized transaction on your loan account, you must report it immediately\
    \ through our official chargeback path. Prompt reporting is critical to initiate\
    \ a formal investigation and mitigate your liability. \n\nWe follow a 'customer-first'\
    \ philosophy in resolving disputes, adhering to the RBI's harmonised turn-around-time\
    \ (TAT) framework for all refunds and resolutions. For more details on the cost\
    \ of your loan, please refer to the Personal Loan — overview."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: bc6bdc4f-341b-58c7-a4e1-9d94cba64967
  title: Personal Loan — account agreement
  body: 'This account agreement outlines the binding obligations between Kalash Finserv
    and the borrower for the Personal Loan product.


    **1. Interest and Repayment**

    We provide funding at an **annual interest rate of 14.5%**. Borrowers agree to
    repay the principal and interest over a maximum **tenure of 60 months**. Repayments
    are managed via an automated mandate; any failure in the scheduled Equated Monthly
    Instalment (EMI) due to insufficient funds or mandate issues will trigger an **EMI
    Bounce Charge of ₹500** per instance.


    **2. Fees and Charges**

    * **Processing Fee**: A non-refundable fee of **2%** of the loan amount is applicable
    at the time of sanction.

    * **Foreclosure**: Borrowers may pay off the remaining loan balance before the
    end of the tenure, subject to a **Foreclosure Charge of 4%** of the outstanding
    principal.


    **3. Obligations and Standard of Care**

    We recommend products based on the customer''s expressed needs and credit eligibility.
    While we strive for transparency, we do not guarantee specific financial outcomes.
    All costs are disclosed upfront in the **Key Fact Statement (KFS)**; we maintain
    a ''no hidden charges'' policy. Waivers of the above fees are granted only under
    exceptional, documented circumstances.


    **4. Termination and Defaults**

    This agreement ends upon the full repayment of all principal, interest, and applicable
    charges. In the event of a default, we adhere strictly to the RBI Fair Practices
    Code and Digital Lending Guidelines, ensuring all collection practices are non-coercive.


    **5. Changes to Terms**

    Kalash Finserv reserves the right to modify these terms. Notice of such changes
    will be provided to the borrower as per regulatory requirements. For details on
    how we handle modifications, see Personal Loan — change-of-terms policy.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4affdb92-ba98-5cb7-9f64-dfb256ee052b
  title: Personal Loan — who it is best for and common use cases
  body: 'The Kalash Finserv Personal Loan is designed as a flexible, unsecured funding
    solution specifically for the emerging middle class and salaried professionals
    in India who require quick liquidity without the need for collateral.


    **Who This Product Suits Best**

    This loan is ideal for individuals with a steady income who value transparency
    and speed of sanction over the lowest possible rate. It is best for those who
    need a structured repayment plan over a medium-to-long term horizon (up to **60
    months**).


    **Common Use Cases**

    * **Debt Consolidation**: Combining multiple high-interest short-term debts into
    a single monthly payment at an **annual interest rate of 14.5%**.

    * **Home Improvement**: Funding essential renovations or repairs.

    * **Medical Emergencies**: Accessing immediate funds for unplanned healthcare
    expenses.

    * **Life Events**: Financing weddings, travel, or educational milestones.


    **Financial Summary**

    To ensure full transparency, we disclose all costs upfront. Our fee structure
    is designed to cover operational costs and risk management:

    * **Annual Interest Rate**: 14.5%

    * **Processing Fee**: 2% of the loan amount

    * **Foreclosure Charge**: 4% of the outstanding balance

    * **EMI Bounce Charge**: ₹500

    * **Maximum Tenure**: 60 months


    We provide a **Key Fact Statement (KFS)** before the loan is sanctioned, which
    details the all-in cost of credit. For those seeking a broader overview, refer
    to Personal Loan — overview.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
