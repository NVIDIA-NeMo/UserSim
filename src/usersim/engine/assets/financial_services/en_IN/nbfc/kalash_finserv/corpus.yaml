- id: d794f5e9-477d-5a39-8c3d-6bba26f984ba
  title: EMI Repayment Mandate — a failed or pending action
  body: '### Troubleshooting Mandate Issues


    **Symptom:** You have attempted to set up or update your mandate, but it is showing
    as ''Pending'' or ''Failed''.


    **Likely Causes:**

    - **MFA Failure:** The multi-factor authentication process was not completed or
    the session timed out.

    - **Incorrect Bank Details:** A mismatch in the IFSC code or account number provided.

    - **Bank-End Rejection:** The lending bank has declined the mandate request due
    to account restrictions (e.g., dormant account).

    - **KYC Pending:** Mandatory KYC verification has not been completed successfully.


    **What to check (in order):**

    1. **Check Connection:** Ensure you have a stable internet connection if completing
    a digital authentication step.

    2. **Verify Account Details:** Double-check that the account number and IFSC provided
    match your bank passbook exactly.

    3. **Verify Balance:** Ensure the account is active and not frozen or dormant.

    4. **Review MFA Prompts:** Check if you missed an OTP or a secure authorization
    request.


    **The Fix:**

    - For detail errors, provide us with the corrected bank information. We will then
    re-initiate the process.

    - For MFA issues, we will trigger a new authentication request to your registered
    mobile number.

    - For KYC issues, provide the missing documentation we request to clear the verification.


    **When to Escalate:**

    If the mandate remains ''Pending'' for more than **3 days** after a correction,
    we will raise a formal case with our internal payments team. You will receive
    a ticket number and a resolution update via SMS/Email within the RBI harmonised
    TAT framework.


    For issues regarding specific charges on your account, please refer to Personal
    Loan — an unexpected charge or amount.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9b4f247e-e089-579a-8eb3-49534b174f25
  title: EMI Repayment Mandate — eligibility requirements
  body: 'To activate an **EMI Repayment Mandate**, the following eligibility criteria
    must be met:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | **Bank Account Status** | Must be an active Savings or Current account in India
    | Eligible for Mandate |

    | **KYC Status** | Fully verified as per Kalash Finserv and RBI guidelines | Eligible
    for Mandate |

    | **Authentication** | Ability to complete Multi-Factor Authentication (MFA) |
    Eligible for Mandate |

    | **Account Ownership** | Account must be in the name of the primary loan borrower
    | Eligible for Mandate |

    | **Bank Support** | Bank must support NACH/e-Mandate protocols | Eligible for
    Mandate |

    | **Documentation** | Valid bank proof (cancel cheque/statement) provided | Eligible
    for Mandate |


    Failure to meet any of the above conditions will result in the mandate being declined.
    For further details on the documents required for the overall loan, please see
    Personal Loan — required documentation.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: eligibility_matrix
  source_authority: official
