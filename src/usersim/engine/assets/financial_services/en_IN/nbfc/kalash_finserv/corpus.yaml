- id: 9e3427ba-a160-5931-9776-d5546b64d581
  title: Consumer Durable EMI — account security best practices
  body: 'At Kalash Finserv, your financial security is our priority. As an existing
    user of our **Consumer Durable EMI** facility, we urge you to adopt these essential
    security practices to protect your account from unauthorised access.


    **Our Strict Security Protocols**

    We follow RBI and NPCI security guidelines. Please remember that Kalash Finserv
    agents will **never** ask you for the following:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * Your Card CVV

    * Your Net Banking Password


    If any individual claiming to be from our institution requests this information,
    it is a fraudulent attempt. We use **Multi-factor authentication (MFA)** for all
    state-changing actions; do not share your MFA codes with anyone, including our
    staff.


    **Recognising Phishing and Fraud**

    Be wary of urgent messages claiming your EMI payment has failed or that you owe
    a **late payment charge of ₹350** unless you have verified this through our official
    communication channels. Fraudsters often use the threat of a credit score drop
    to coerce customers into sharing sensitive data.


    **Immediate Action for Fraud**

    If you notice any unauthorised transaction or suspect your account has been compromised,
    you must report it immediately. Please initiate the official chargeback path through
    our support channels to start a formal investigation. Prompt reporting is critical
    to mitigating loss and ensuring a resolution following the RBI''s harmonised turn-around-time
    (TAT) framework.


    For further details on how we protect your account, you may refer to Consumer
    Durable EMI — fraud and unauthorized-activity protection.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 8d57fb52-4be0-5798-9021-5160cd690a22
  title: Consumer Durable EMI — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms and
    conditions of the **Consumer Durable EMI** product. As a borrower, it is important
    to understand how changes to costs and obligations are managed.


    **Right to Amend Terms**

    Kalash Finserv reserves the right to modify the fees associated with this product.
    This includes, but is not limited to, the **processing fee of ₹499** or the **late
    payment charge of ₹350**. Any such changes will be implemented to cover operational
    costs and risk management to ensure the sustainability of our lending pool.


    **Notice Period and Transparency**

    We adhere to the RBI Fair Practices Code. We will provide you with a minimum of
    30 days'' notice before any change in fees or terms becomes effective. This notice
    will be delivered via your registered email and SMS. In accordance with our ''no
    hidden charges'' policy, all updated costs will be clearly disclosed.


    **Impact on Existing Loans**

    Changes to terms typically apply to new loan applications. For loans already sanctioned
    with an **annual interest rate of 0%** and a tenure of 9 months, the original
    financial terms will be honoured until the end of that specific loan tenure, unless
    the change is mandated by regulatory authorities (RBI).


    **Customer Recourse**

    If you disagree with a change in terms, you have the right to close your account
    or foreclose the loan. Please be aware that while the interest rate remains 0%,
    other operational fees apply as per the sanctioned **Key Fact Statement (KFS)**.


    **Termination of Agreement**

    This agreement ends upon the successful repayment of all principal and applicable
    charges. Failure to pay may result in the application of the **late payment charge
    of ₹350** per occurrence until the balance is cleared.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 7d738af1-b43f-52c6-a375-84711b1483f7
  title: Consumer Durable EMI — getting started walkthrough
  body: 'This guide is for support agents to assist customers in navigating the application
    process for the **Consumer Durable EMI** product. Our goal is to ensure speed
    of sanction and complete transparency.


    **Step-by-Step Onboarding**

    1. **Need Assessment**: Confirm the customer is looking for short-term, interest-free
    financing for electronics or appliances.

    2. **Eligibility Check**: Verify the customer''s credit eligibility and salaried
    professional status.

    3. **Cost Disclosure**: Explicitly inform the customer that the product has an
    **annual interest rate of 0%**, but requires a one-time **processing fee of ₹499**.

    4. **Tenure Confirmation**: Confirm the fixed tenure of 9 months for the repayment
    schedule.

    5. **KYC & MFA**: Ensure the customer completes the mandatory KYC verification
    and sets up Multi-factor authentication (MFA) before any fund disbursement.

    6. **KFS Issuance**: Provide the **Key Fact Statement (KFS)**. You must ensure
    the customer understands the all-in cost, including the processing fee and the
    potential **late payment charge of ₹350** if an EMI is missed.


    **Key Product Specifications for Agents**

    * **Interest Rate**: 0% annually.

    * **Tenure**: 9 months.

    * **Processing Fee**: ₹499 (upfront).

    * **Late Fee**: ₹350 per missed payment.


    **Compliance Reminders**

    Agents must strictly follow the RBI Digital Lending Guidelines. Ensure the customer
    knows that Kalash Finserv takes no deposits. We must maintain a non-coercive approach
    throughout the collection and sanction process. If the customer has further questions
    about their repayment setup, you may guide them using the EMI Repayment Mandate
    — overview.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 0fcaedb2-716d-5c04-8673-d7d39778287e
  title: Consumer Durable EMI — interest rate annual explained
  body: '**What is the annual interest rate for the Consumer Durable EMI?**

    We offer this product with an **annual interest rate of 0%**. This means you do
    not pay any interest on the principal amount borrowed for your electronics or
    appliances.


    **If the interest is 0%, is the loan completely free?**

    While there is no interest, there is a one-time **processing fee of ₹499** to
    cover the operational costs of sanctioning the loan. Additionally, if a payment
    is missed, a **late payment charge of ₹350** will apply. We believe in a ''no
    hidden charges'' policy, and all these details are listed in your **Key Fact Statement
    (KFS)**.


    **How long do I have to repay the loan?**

    All **Consumer Durable EMI** plans have a fixed tenure of 9 months.


    For a full breakdown of all costs, please refer to Consumer Durable EMI — fee
    schedule.'
