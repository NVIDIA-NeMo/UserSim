- id: 5fc6438a-e539-5642-8a2d-8780b9c3560c
  title: Two-Wheeler Loan — recognizing scams targeting this product
  body: 'At Kalash Finserv, we are committed to your financial safety. As you compare
    our Two-Wheeler Loan against other market offerings, please be vigilant against
    common fraudulent patterns targeting vehicle financing.


    **Common Scam Patterns**

    Fraudsters often pose as loan agents promising ''instant approval'' or ''zero
    down payment'' schemes that bypass our standard **15% down payment** requirement.
    Be wary of individuals who claim they can reduce our fixed **12.9% annual interest
    rate** in exchange for an upfront ''processing advance'' paid to a personal account.
    We will never ask you to transfer funds to an individual to secure a loan.


    **Our Security Guardrails**

    To protect your identity and funds, we adhere to strict RBI and NPCI security
    protocols. Please remember:

    - We will **never** ask for your UPI PIN, OTPs, or CVVs over a call or message.

    - All official communications regarding your loan status will come through our
    verified channels.

    - Multi-factor authentication (MFA) and KYC verification are mandatory before
    any fund disbursement occurs.


    **Immediate Action for Fraud**

    If you encounter a suspicious request or believe your account has been compromised,
    you must report the activity immediately through our official chargeback path.
    This allows us to initiate a formal investigation and secure your credit profile.
    Following the RBI''s harmonised turn-around-time (TAT) framework, we treat all
    fraud reports with the highest priority to ensure a customer-first resolution.


    ***

    **Regulatory Disclaimer**: Kalash Finserv takes no deposits. All loans are subject
    to credit eligibility and the provision of a Key Fact Statement (KFS) disclosing
    the all-in annualised cost of credit.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 28962eb9-7ce4-5220-86f3-e7e950cfdcb1
  title: Two-Wheeler Loan — limits, restrictions, and edge cases
  body: 'This guide provides support agents with the necessary technical constraints
    and operational boundaries for the Two-Wheeler Loan product to ensure accurate
    customer communication.


    **Core Product Constraints**

    - **Down Payment**: A mandatory **15% down payment** of the vehicle cost is required.
    Loans cannot be sanctioned for 100% financing.

    - **Tenure Limit**: The maximum repayment period is strictly **36 months**. Extensions
    beyond this limit are not permitted under current product guidelines.

    - **Pricing**: The product carries a flat annual interest rate of **12.9%**.

    - **Upfront Costs**: A one-time processing fee of **₹1500** is applicable at the
    time of sanction.


    **Operational Restrictions and Edge Cases**

    - **Credit Eligibility**: Disbursement is contingent upon successful KYC and MFA
    verification. If a customer fails the mandatory KYC, the application must be blocked
    regardless of the down payment provided.

    - **Asset Hypothecation**: The vehicle serves as collateral. The loan cannot be
    closed until the No Objection Certificate (NOC) is issued following full repayment
    of the principal and interest.

    - **Foreclosure**: While customers may pay off the balance early, they must be
    informed of any applicable **Foreclosure Charges** as detailed in their **Key
    Fact Statement (KFS)**.

    - **Payment Failures**: Any failure in the repayment mandate resulting in an **EMI
    Bounce Charge** must be communicated to the customer immediately to avoid further
    delinquency.


    **Agent Note**: Always ensure the customer has received and understood their **Key
    Fact Statement (KFS)** before final sanction, as this document outlines the all-in
    cost of the loan including the **₹1500** processing fee.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 70f2207a-4161-58ca-a881-289ad1deae36
  title: Two-Wheeler Loan — processing fee explained
  body: '**What is the processing fee for a Two-Wheeler Loan?**

    We charge a one-time processing fee of **₹1500**. This fee covers the operational
    costs associated with verifying your documents, evaluating credit eligibility,
    and sanctioning the loan.


    **When is this fee paid?**

    This fee is applied at the start of the loan process and is disclosed upfront
    in your **Key Fact Statement (KFS)** to ensure complete transparency.


    **Can the processing fee be waived?**

    In line with our fee philosophy, charges are structured to ensure the sustainability
    of our lending pool. Therefore, waivers for the **₹1500** fee are granted only
    under exceptional, documented circumstances and are not standard.


    For a full breakdown of all costs, please refer to the Two-Wheeler Loan — fee
    schedule.'
