- id: a339486b-6cae-548c-b092-41448af81c48
  title: EMI Repayment Mandate — who it is best for and common use cases
  body: 'The **EMI Repayment Mandate** is the automated payment engine that powers
    the repayment of our credit products. It is designed to remove the stress of manual
    payments, ensuring your credit score remains healthy by preventing missed due
    dates.


    **Who is this best for?**

    * **Salaried Professionals:** Ideal for those with a fixed monthly pay cycle who
    want their loan repayments handled automatically without manual intervention.

    * **Digital-First Borrowers:** Perfect for customers who prefer a ''set-and-forget''
    approach to financial management.

    * **Multiple Loan Holders:** If you have a Personal Loan or a Two-Wheeler Loan
    with us, a single mandate ensures consistency across your obligations.


    **Common Use Cases**

    * **Preventing Late Fees:** By automating the debit, you avoid the risk of forgetting
    a due date and incurring an **EMI Bounce Charge** of ₹500.

    * **Cash Flow Management:** With a pre-debit notification sent **24 hours** before
    the actual withdrawal, you can ensure your account is funded just in time.

    * **Simplified Account Changes:** For those who switch salary accounts, our mandate
    amendment process (which takes **3 days** to process) allows for a structured
    transition of your payment source.


    **Key Financial Details**

    * **Bounce Charge:** ₹500 (applied per failed repayment attempt).

    * **Notification Lead Time:** **24 hours** pre-debit.

    * **Amendment Timeline:** **3 days** for processing changes.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: e018701e-7cc4-5fe2-9e36-445d889a4834
  title: EMI Repayment Mandate — bounce charge explained
  body: '**What is an EMI Bounce Charge?**

    An **EMI Bounce Charge** is a penalty fee of ₹500 levied when a scheduled repayment
    attempt fails. This typically happens due to insufficient funds in your linked
    bank account or issues with the mandate authorization.


    **Why is this charge applied?**

    These fees are structured to cover our operational costs and the risk management
    required to maintain our lending pool. You can find this detail listed in your
    **Key Fact Statement (KFS)**.


    **How can I avoid this charge?**

    We send a pre-debit notification **24 hours** before the repayment is due. We
    recommend using this window to ensure your account has sufficient funds to avoid
    the ₹500 penalty.


    For more details on how this interacts with your loan, please refer to **EMI Repayment
    Mandate — overview**.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: e628df28-42b7-55de-b70a-bd65102b4f69
  title: EMI Repayment Mandate — cancel, close, or downgrade
  body: 'If you wish to cancel or close your **EMI Repayment Mandate**, please follow
    these steps. Note that a mandate cannot be closed if there is an active outstanding
    loan balance unless a replacement payment method is established.


    **Requirements before starting:**

    * Your loan account number.

    * A valid reason for the mandate closure (e.g., loan foreclosure or switching
    bank accounts).

    * If switching accounts, the new bank account details and a cancelled cheque.


    **Steps to close or change your mandate:**

    1. **Submit Request:** Tell us that you wish to cancel or amend your existing
    repayment mandate. If you are changing accounts, provide the new bank details
    at this time.

    2. **Verification:** We will perform a mandatory KYC verification and multi-factor
    authentication (MFA) to ensure the request is legitimate.

    3. **Processing Period:** For amendments or replacements, we will initiate the
    change. Please note that mandate amendment processing takes **3 days** to complete.

    4. **Confirmation:** We will notify you once the mandate has been successfully
    cancelled or the new mandate is active.


    **How you know it worked:**

    * For closure: You will receive a confirmation notice that the mandate is inactive.
    If your loan is still active, we will provide instructions on how to make manual
    payments to avoid an **EMI Bounce Charge** of ₹500.

    * For amendments: You will receive a confirmation that the new account is linked,
    and you will see the pre-debit notification (**24 hours** before the due date)
    arriving for the new account on the next cycle.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 98dc00f5-d96c-5d5c-b35f-b42b79bb54bc
  title: EMI Repayment Mandate — an unexpected charge or amount
  body: '**Symptom:** You notice a charge on your bank statement from Kalash Finserv
    that you did not expect, or the amount differs from your scheduled EMI.


    **Likely Causes:**

    1. **Failed Repayment:** The most common cause is a failed EMI attempt, resulting
    in an **EMI Bounce Charge** of ₹500.

    2. **Combined Payments:** If you have multiple loans, the debit may be a combined
    amount of several EMIs.

    3. **Processing Lag:** A mandate amendment requested recently may have overlapped
    with a scheduled debit.


    **What to check in order:**

    1. **Check Notifications:** Look back at your messages from **24 hours** before
    the debit date to see the exact amount we notified you would be withdrawn.

    2. **Check Balance:** Verify if your account had sufficient funds at the exact
    time of the scheduled debit.

    3. **Review Loan Statements:** Check if you have any pending dues or previous
    bounce charges that were recovered in the current cycle.


    **The Fix:**

    * If the charge is a valid **EMI Bounce Charge** of ₹500 due to insufficient funds,
    ensure the account is funded for the next cycle to avoid further penalties.

    * If you believe the charge is an error (e.g., you had funds and received the
    notification but were still charged a bounce fee), tell us the date and amount
    of the transaction.


    **Escalation:**

    If the issue is not resolved during our conversation, we will raise a formal case
    and route it to our payments specialist team. You will receive a resolution or
    a status update following the RBI''s harmonised turn-around-time (TAT) framework.
    If still unresolved, the matter will be escalated to our designated Nodal Officer.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4e72ab5f-e5e6-523a-977c-2a5fe472d79a
  title: EMI Repayment Mandate — required documentation
  body: 'To set up or amend an **EMI Repayment Mandate**, the following documentation
    and conditions must be met:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | **Identity Verification** | Valid KYC documents (Aadhaar/PAN) | Mandatory for
    setup/amendment |

    | **Bank Account Proof** | Cancelled cheque or latest bank statement | Required
    to verify account details |

    | **Authentication** | Successful Multi-factor Authentication (MFA) | Required
    for fund disbursement or state-change |

    | **Account Status** | Active savings/current account with NACH/e-mandate capability
    | Eligible for automation |

    | **Mandate Change** | Request submitted for amendment | Processed within **3
    days** |


    All mandates are tied to the loan''s **Key Fact Statement (KFS)**, which outlines
    the costs and the ₹500 bounce charge policy.'
