- id: 5e5ad3fd-7910-50c2-92d5-c1f80046c90a
  title: Personal Loan — privacy and data handling
  body: 'This disclosure explains how Kalash Finserv handles your personal and financial
    data in relation to your **Personal Loan** account. We are committed to the highest
    standards of data privacy and regulatory compliance.


    **Data Collection and Purpose**

    We collect your identity documents, income proofs, and credit history to assess
    your eligibility and determine the loan terms. This data is used solely for the
    purpose of credit underwriting, loan servicing, and regulatory reporting as mandated
    by the RBI.


    **Information Sharing**

    We share your repayment data with Credit Information Companies (CICs) as required
    by law. Your data is never sold to third-party marketing agencies. Any sharing
    of data with our internal recovery or service partners is strictly limited to
    the information necessary to manage your loan and is governed by non-disclosure
    agreements.


    **Security Measures**

    To protect your data, we employ Multi-factor authentication (MFA) for all account
    access and state-changing actions. We ensure that sensitive information is encrypted
    both in transit and at rest. In alignment with RBI protocols, our agents are strictly
    prohibited from asking for your UPI PIN, OTP, or CVV.


    **Customer Rights**

    You have the right to request a copy of the data we hold about you and to seek
    corrections to any inaccuracies in your records. All such requests are handled
    through our tiered support system.


    **Regulatory Framework**

    Our data handling practices are designed to comply with the RBI Fair Practices
    Code and Digital Lending Guidelines. We ensure that the **Key Fact Statement (KFS)**
    provided to you contains all the necessary disclosures regarding the cost of your
    loan, including the 14.5% annual interest rate and the 2% processing fee.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: f926e579-85e9-595c-90ec-3aea84f33561
  title: Personal Loan — recognizing scams targeting this product
  body: 'As you compare financing options, it is vital to remain vigilant against
    fraudulent actors who often target individuals seeking quick liquidity. At Kalash
    Finserv, we prioritise your security and transparency.


    **Common Scam Patterns**

    Be wary of ''loan agents'' who contact you via WhatsApp or unsolicited emails
    claiming to offer guaranteed approval for a Personal Loan regardless of your credit
    score. A common tactic involves asking for an ''upfront processing fee'' or ''GST
    payment'' to be transferred to a personal UPI ID before the loan is disbursed.
    **We will never ask you to transfer fees to a personal account.** All our charges,
    including the processing fee of 2%, are handled through official banking channels
    and disclosed in your Key Fact Statement (KFS).


    **Our Security Promise**

    To protect your funds and identity, we adhere to strict RBI and NPCI security
    protocols. Our representatives will **never** ask you for the following:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * Your Card CVV


    We utilise Multi-factor authentication (MFA) and mandatory KYC verification before
    any fund disbursement occurs. If an agent asks for these credentials to ''speed
    up'' your sanction, they are not representing Kalash Finserv.


    **Immediate Action for Fraud**

    If you suspect you have been targeted by a scam or notice unauthorised activity,
    you must report it immediately through our official chargeback path. This allows
    us to initiate a formal investigation and secure your account. Remember, any request
    for payment outside of the official loan agreement is a red flag.


    ***

    **Regulatory Disclaimer:** Kalash Finserv is a non-banking financial company (NBFC)
    and does not take deposits. All lending is subject to credit eligibility and RBI
    guidelines.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 3ed78af7-b010-538d-98f5-cc5884b03fc8
  title: Personal Loan — limits, restrictions, and edge cases
  body: 'This guide provides support agents with the critical constraints and boundary
    conditions for the Personal Loan product to ensure accurate customer communication.


    **Core Financial Parameters**

    * **Annual Interest Rate:** 14.5%

    * **Processing Fee:** 2% of the loan amount

    * **Foreclosure Charge:** 4% of the remaining principal

    * **EMI Bounce Charge:** ₹500 per failed instalment

    * **Maximum Tenure:** 60 months


    **Restrictions and Limitations**

    1. **Tenure Cap:** The maximum repayment duration is strictly 60 months. No extensions
    beyond this period are permitted under standard product terms.

    2. **Processing Fee Application:** The 2% processing fee is a one-time charge
    applied at the time of sanctioning and cannot be waived except under exceptional,
    documented circumstances as per our fee philosophy.

    3. **Foreclosure Terms:** Customers may close their loan early, but a foreclosure
    charge of 4% will apply to the outstanding balance. This ensures the sustainability
    of our lending pool.

    4. **Payment Failures:** Any failure in the EMI repayment mandate due to insufficient
    funds or technical issues triggers an immediate EMI Bounce Charge of ₹500.


    **Edge Cases for Agents**

    * **Partial Prepayments:** Customers often ask about partial payments; ensure
    they understand that the 4% foreclosure charge applies to the specific amount
    being prepaid if it constitutes a partial foreclosure.

    * **Credit Eligibility:** Recommendations must be based on the customer''s expressed
    needs and credit eligibility. We provide the product information but do not guarantee
    specific financial outcomes.

    * **KFS Requirement:** A Key Fact Statement (KFS) must be provided to every customer
    before the loan is sanctioned, disclosing the all-in annualised cost of credit.


    For a broader overview of the product, refer to Personal Loan — overview.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 26e03a1d-094e-5f53-bc34-9691a322941b
  title: Personal Loan — tenure months explained
  body: '**What is the maximum tenure available for a Personal Loan?**

    We offer a transparent and flexible maximum tenure of 60 months. This allows you
    to spread your repayments over a longer period, making your monthly instalments
    more manageable.


    **Can I choose a shorter tenure than 60 months?**

    Yes, the 60 months limit is the maximum available. Depending on your credit eligibility
    and the loan amount, you can opt for a shorter duration that fits your monthly
    budget.


    **Does the tenure affect my interest cost?**

    While the annual interest rate remains 14.5%, a longer tenure increases the total
    interest paid over the life of the loan. We recommend reviewing your Key Fact
    Statement (KFS) to understand the total cost of credit for your chosen duration.


    For more details on the costs associated with your loan, please see Personal Loan
    — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 5c203b21-405d-5660-95fc-f2a7eed2ce08
  title: Personal Loan — check status or history
  body: "If you are an existing customer and wish to track your loan progress or review\
    \ your repayment history, follow these steps:\n\n**Prerequisites**\nEnsure you\
    \ have your registered mobile number and loan account number ready for verification.\n\
    \n**Steps to Check Status and History**\n1. **Request Status Update:** Tell us\
    \ that you would like to check the current status or the repayment history of\
    \ your Personal Loan. \n2. **Identity Verification:** We will perform a mandatory\
    \ security check. You will be asked to verify your identity via Multi-factor authentication\
    \ (MFA) to ensure your data remains secure.\n3. **Specify the Detail Required:**\
    \ Let us know if you need the 'Current Status' (e.g., Active, Closed, or Pending)\
    \ or the 'Repayment History' (a list of all instalments paid and any pending dues).\n\
    4. **Review the Information:** We will provide you with a summary of your account.\
    \ This will include:\n    * Your total disbursed amount.\n    * The remaining\
    \ principal balance.\n    * A record of all successful EMI payments.\n    * Any\
    \ EMI Bounce Charges of ₹500 that may have been levied on your account.\n5. **Confirm\
    \ Receipt:** Once we provide the details, confirm if the information matches your\
    \ records.\n\n**How you know it worked**\n The process is complete when you have\
    \ received a clear confirmation of your current loan standing or a detailed list\
    \ of your payment history in the conversation.\n\nFor information on how to modify\
    \ your loan, see Personal Loan — make a change or update."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: d49aeeee-194f-546f-bd26-462dc5570cbe
  title: Personal Loan — a declined or blocked action
  body: 'If you are attempting to apply for a Personal Loan or perform an action on
    an existing account and receive a ''Declined'' or ''Blocked'' notification, please
    follow this guide.


    **Likely Causes**

    * **Credit Eligibility:** Your current credit profile may not meet the required
    thresholds for the requested amount or tenure.

    * **KYC Discrepancies:** Missing or expired documentation during the mandatory
    KYC verification process.

    * **Security Flag:** A blocked action often occurs if Multi-factor authentication
    (MFA) fails or if the system detects a security risk.

    * **Mandate Issues:** A blocked payment action may be due to an inactive or failed
    EMI repayment mandate.


    **What to check in order**

    1. **Verification Status:** Check if you have completed all KYC requirements.
    Ensure your documents are current and valid.

    2. **MFA Accuracy:** If the action was blocked during login or fund transfer,
    ensure you are using the registered mobile number for authentication.

    3. **Account Balance:** If a payment was declined, verify that the account linked
    to your EMI repayment mandate has sufficient funds to cover the instalment and
    avoid an EMI Bounce Charge of ₹500.


    **The Fix**

    * **For KYC/Security blocks:** Provide the updated documents or re-attempt the
    MFA process as guided by our representative.

    * **For Eligibility declines:** You may request a review of your application.
    We will assess if a lower loan amount or a different tenure (up to 60 months)
    would be acceptable based on your credit profile.


    **When to Escalate**

    If the block persists after updating KYC and MFA, we will raise a formal case
    with our credit and compliance team. You will receive a resolution or a detailed
    explanation for the decline within the RBI''s harmonised turn-around-time (TAT)
    framework.'
  domain: lending_mortgage
