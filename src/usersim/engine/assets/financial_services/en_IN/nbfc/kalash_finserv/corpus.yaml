- id: e400c3de-06b7-5691-b5d0-4c6f83aba4d3
  title: Gold Loan — a failed or pending action
  body: '**Symptom**: Your loan disbursement is marked as ''Pending'' or has ''Failed''
    after you submitted your gold and KYC documents.


    **Likely Causes**:

    - **KYC Mismatch**: The name on your gold ownership documents or ID proof does
    not match your bank account details.

    - **Authentication Failure**: Multi-factor authentication (MFA) was not completed
    successfully.

    - **Minimum Threshold Not Met**: The appraised value of the gold, when multiplied
    by the 75% **Loan-to-Value (LTV)** cap, resulted in a loan amount below the minimum
    loan amount of ₹25000.


    **What to check in order**:

    1. **Check your notifications**: Look for a request to re-verify your identity
    or complete an MFA prompt.

    2. **Verify Bank Details**: Ensure the bank account provided is active and matches
    the name on your KYC documents.

    3. **Review Appraised Value**: Check if the final appraised value of your gold
    is sufficient to cover the ₹25000 minimum loan requirement at a 75% LTV.


    **The Fix**:

    - If it is a KYC/MFA issue, provide the corrected documents or re-trigger the
    authentication process through us.

    - If the loan amount is below ₹25000, you may provide additional gold collateral
    to meet the minimum threshold.


    **When we escalate**:

    If the issue is not resolved within 2 business days, we will raise a formal case
    to our internal operations team. You will receive a case reference number and
    a resolution timeline following the RBI''s harmonised turn-around-time (TAT) framework.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: troubleshooting
  source_authority: official
