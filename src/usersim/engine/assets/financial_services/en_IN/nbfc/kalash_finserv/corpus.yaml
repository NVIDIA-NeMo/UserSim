- id: a04e859d-d3dd-5401-b2ec-9e9301070819
  title: Gold Loan — account security best practices
  body: 'At Kalash Finserv, the safety of your assets and personal data is our highest
    priority. Because Gold Loans involve physical collateral and digital disbursements,
    we urge you to follow these essential security practices to protect your account.


    **Protecting Your Access**

    We employ Multi-factor authentication (MFA) for all state-changing actions. Never
    share your MFA codes, passwords, or login credentials with anyone, including individuals
    claiming to be Kalash Finserv employees. If you receive an unsolicited request
    for your credentials, treat it as a security threat.


    **Recognising Fraudulent Requests**

    Our agents are strictly prohibited from asking for your UPI PIN, OTPs, or CVVs.
    We will never ask you to transfer money to a personal account to ''release'' your
    gold collateral or to ''verify'' your identity. Any request for payment via an
    unofficial channel is fraudulent.


    **Collateral Safety**

    Your gold is held in secure custody. Always ensure you receive an official receipt
    and a **Key Fact Statement (KFS)** during the loan sanction process. Do not hand
    over your original documents or gold assets to any individual who cannot provide
    official Kalash Finserv identification and a verified appointment confirmation.


    **Immediate Action for Suspected Fraud**

    If you notice any unauthorised activity or receive a suspicious call regarding
    your loan, report it immediately. Fraudulent activity must be reported through
    our official chargeback path to initiate a formal investigation. Timely reporting
    is critical to mitigating loss and initiating the recovery process under RBI guidelines.


    For more details on our overall safety posture, you may refer to Gold Loan — fraud
    and unauthorized-activity protection.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 3073c532-30b5-59ee-b137-094406b0fa91
  title: Gold Loan — change-of-terms policy
  body: 'This policy outlines the conditions under which Kalash Finserv may modify
    the terms of your Gold Loan agreement. We are committed to transparency and adherence
    to the RBI Fair Practices Code.


    **Right to Modify Terms**

    We reserve the right to adjust the annual interest rate, which is currently 11.5%,
    and other fee structures, including the processing fee of ₹500, to reflect changes
    in market risk or regulatory requirements. Any such change will be communicated
    to the borrower with a minimum notice period of 30 days.


    **LTV Maintenance**

    The **Loan-to-Value (LTV)** cap is set at 75%. If the market value of the pledged
    gold assets drops significantly, resulting in an LTV that exceeds 75%, we may
    require the borrower to provide additional collateral or make a partial principal
    repayment to bring the loan back within the permitted LTV threshold. Failure to
    do so may trigger a default event as per the primary loan agreement.


    **Fee Adjustments**

    While we maintain a ''no hidden charges'' policy, operational costs may necessitate
    updates to our fee schedule. Any changes to the **EMI Bounce Charge** or **Foreclosure
    Charge** will be disclosed upfront in a revised **Key Fact Statement (KFS)** provided
    to the customer.


    **Termination and Closure**

    This agreement ends upon the full repayment of the principal, accrued interest
    at 11.5% per annum, and any applicable fees. Upon successful closure and verification
    of identity via mandatory KYC, we will release the collateral assets to the registered
    owner. Waivers of foreclosure charges are granted only under exceptional, documented
    circumstances.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: e0791074-189e-5bb1-bfe8-58ef9db41a52
  title: Gold Loan — getting started walkthrough
  body: 'This guide is for support agents to assist customers in navigating the Gold
    Loan application process. Our goal is speed of sanction and total transparency.


    **Step 1: Initial Eligibility Check**

    Confirm the customer is seeking a loan amount of at least ₹25000. Explain that
    the loan is secured against gold assets, with a maximum **Loan-to-Value (LTV)**
    of 75% of the appraised value.


    **Step 2: Collateral Appraisal**

    Guide the customer to bring their gold assets for professional valuation. Once
    the appraisal is complete, calculate the maximum eligible loan based on the 75%
    LTV cap. Clearly communicate the appraised value and the resulting loan limit
    to the customer.


    **Step 3: Cost Disclosure**

    Before sanctioning the loan, you must provide the customer with a **Key Fact Statement
    (KFS)**. This document must explicitly disclose:

    - The annual interest rate of 11.5%.

    - The one-time processing fee of ₹500.

    - The total loan tenure of 12 months.

    - The all-in annualised cost of credit.


    **Step 4: KYC and Verification**

    Perform mandatory KYC verification and Multi-factor authentication (MFA). Ensure
    the customer understands that we will never ask for their UPI PIN or OTP during
    this process.


    **Step 5: Disbursement**

    Once the KFS is signed and KYC is verified, the funds are disbursed. Remind the
    customer that the gold will remain in secure collateral custody until the loan
    is closed.


    **Quick Reference Summary:**

    - Minimum Loan: ₹25000

    - LTV Cap: 75%

    - Interest Rate: 11.5% annual

    - Processing Fee: ₹500

    - Tenure: 12 months


    For a broader overview of the product, refer to Gold Loan — overview.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 85d7b22e-91dd-5499-8f77-96d7bb4044be
  title: Gold Loan — processing fee explained
  body: '**What is the processing fee for a Gold Loan?**

    We charge a one-time processing fee of ₹500 for all Gold Loans. This fee covers
    the operational costs of collateral appraisal, secure vaulting, and loan documentation.


    **When is this fee paid?**

    The processing fee of ₹500 is typically deducted from the loan amount at the time
    of disbursement or collected upfront, as specified in your **Key Fact Statement
    (KFS)**.


    **Can the processing fee be waived?**

    In alignment with our fee philosophy, the ₹500 fee is standard to ensure the sustainability
    of our lending pool. Waivers are granted only under exceptional, documented circumstances
    and require senior management approval.


    For more information on all costs associated with your loan, please refer to Gold
    Loan — fee schedule.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 760e4c38-bd8b-50c3-93ea-e912a0bff355
  title: Gold Loan — make a change or update
  body: 'If you have an active Gold Loan and need to update your account details or
    modify your repayment arrangements, follow these steps. All updates require strict
    identity verification to ensure the security of your collateral.


    **Updating Contact Information**

    1. Tell us which specific detail needs updating (e.g., mobile number, email address,
    or residential address).

    2. Provide a valid government-issued ID as proof for the change.

    3. We will perform a mandatory KYC verification and Multi-factor authentication
    (MFA) check.

    4. We will confirm once the records are updated in our system.


    **Changing Repayment Mandates**

    1. Tell us that you wish to change the bank account linked to your repayment mandate.

    2. Provide the new bank account details, including the IFSC code and account number.

    3. We will initiate a new mandate verification process. You will be asked to authenticate
    this through your bank''s secure channel.

    4. We will confirm once the new mandate is active. Note that any failed payments
    during this transition may incur an **EMI Bounce Charge**.


    **Requesting a Loan Top-up**

    1. Tell us you wish to increase your loan amount based on your existing gold collateral.

    2. We will perform a fresh appraisal of the gold assets to determine the current
    market value.

    3. We will check if the new total loan amount still adheres to the **Loan-to-Value
    (LTV)** cap of 75%.

    4. If eligible, we will issue a revised **Key Fact Statement (KFS)** showing the
    new interest and fees before disbursing the additional funds.


    For information on closing your account entirely, see Gold Loan — cancel, close,
    or downgrade.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 29470c1f-c350-5ff4-81c0-b304c67ae200
  title: Gold Loan — access or login problems
  body: '**Symptom:** You are unable to access your loan account details or the digital
    dashboard to check your balance and repayment schedule.


    **Likely Causes:**

    - Incorrect credentials or expired session.

    - MFA (Multi-factor authentication) failure due to network issues or outdated
    mobile numbers.

    - Account lock due to multiple failed login attempts.


    **What to check in order:**

    1. **Credential Verification:** Ensure you are using the mobile number registered
    during your KYC process. Check for typos in your password.

    2. **MFA Connectivity:** Ensure your mobile device has a stable network connection
    to receive the OTP. If you have changed your number recently, your MFA will fail.

    3. **Account Status:** If you have attempted to log in more than five times unsuccessfully,
    your account may be temporarily locked for security.


    **The Fix:**

    - **For Password Issues:** Tell us you have forgotten your password. We will trigger
    a secure reset link to your registered email and mobile number after MFA verification.

    - **For MFA/Number Issues:** Tell us your registered mobile number has changed.
    We will require a fresh KYC verification and a valid ID proof to update your records
    and restore access.

    - **For Account Locks:** Tell us your account is locked. We will verify your identity
    through a series of security questions and MFA, then manually unlock the account.


    **When we escalate:**

    If the login problem persists after these steps, we will raise a technical ticket
    with our digital systems team. You will receive a case number and a resolution
    update via SMS/email within 48 hours. For unresolved grievances, the matter will
    be routed to our designated Nodal Officer as per our service model.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 508fd81c-a000-5212-a8ab-5eaddf0c0499
  title: Gold Loan — qualification tiers
  body: 'Support agents should use this matrix to determine if a customer qualifies
    for a Gold Loan disbursement. All loans are subject to final appraisal and KYC
    verification.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Minimum Loan Amount** | $\ge$ ₹25000 | Eligible for processing |

    | **Minimum Loan Amount** | $<$ ₹25000 | Ineligible for Gold Loan product |

    | **Collateral Value** | Appraised Gold Value $\times$ 75% $\ge$ Requested Amount
    | Loan amount approved within LTV cap |

    | **Collateral Value** | Appraised Gold Value $\times$ 75% $<$ Requested Amount
    | Loan amount capped at 75% of value |

    | **KYC Status** | Verified & MFA complete | Proceed to disbursement |

    | **KYC Status** | Unverified/Incomplete | Application on hold |

    | **Tenure Request** | $\le$ 12 months | Standard terms apply |

    | **Tenure Request** | $>$ 12 months | Ineligible (Max tenure is 12 months) |


    **Note:** All eligible loans carry a flat annual interest rate of 11.5% and a
    processing fee of ₹500.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: c4ad642d-e26f-5182-95d6-3a1d3b89d090
  title: Gold Loan — choosing between tiers or options
  body: 'When choosing how to fund your requirements, it is important to weigh the
    benefits of a Gold Loan against other options like a Personal Loan.


    **Gold Loan (Secured)**

    - **Cost:** Annual interest rate of 11.5% with a ₹500 processing fee.

    - **Access:** Speed of sanction is high because it is backed by physical collateral.

    - **Risk:** The primary risk is the pledge of gold assets; failure to repay may
    lead to the sale of collateral.

    - **Limit:** Based on a **Loan-to-Value (LTV)** cap of 75% of your gold''s value.

    - **Best for:** Customers who have gold assets and want quick liquidity without
    relying solely on a credit score.


    **Personal Loan (Unsecured)**

    - **Cost:** Typically higher interest rates as there is no collateral.

    - **Access:** Based strictly on credit eligibility and income documents.

    - **Risk:** No collateral risk, but higher impact on credit score upon default.

    - **Limit:** Based on income and existing debt obligations.

    - **Best for:** Salaried professionals who do not wish to pledge assets and have
    a strong credit history.


    For a detailed look at our unsecured offering, refer to Personal Loan — overview.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: comparison
  source_authority: official
  placeholder: true
