- id: 6bb74d62-1c59-5efb-8db7-81f86e2f70a0
  title: EMI Repayment Mandate — vs. a typical competitor offering
  body: 'When comparing the **EMI Repayment Mandate** at Kalash Finserv with typical
    NBFC offerings in India, the primary differences lie in transparency and notification
    timing.


    | Feature | Kalash Finserv | Typical Competitor |

    | :--- | :--- | :--- |

    | **Pre-debit Alert** | **24 hours** notice | Often no notice or <12 hours |

    | **Bounce Charge** | ₹500 (Transparently stated) | Often variable or hidden in
    T&Cs |

    | **Amendment Speed** | **3 days** processing | Often 7-14 business days |

    | **Disclosure** | Full KFS provided upfront | Partial disclosure of penalties
    |


    **Which one to choose?**

    * **Choose Kalash Finserv** if you value predictability and transparency. Our
    **24 hours** pre-debit notification gives you a clear window to manage your funds
    and avoid the ₹500 bounce charge.

    * **Choose a competitor** if you require specialized payment modes (like post-dated
    cheques) that we may not support in our digitally-forward model.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: comparison
  source_authority: official
