- id: 38611f5d-800a-54d3-a7d2-dce5ad2dd28a
  title: Consumer Durable EMI — resolve a common request end-to-end
  body: "This guide explains how to resolve a request to update your repayment mandate\
    \ to avoid the ₹350 late payment charge.\n\n**Prerequisites**\n- New bank account\
    \ details (Account number and IFSC).\n- Registered mobile number for Multi-factor\
    \ authentication (MFA).\n\n**Steps to Update Your Repayment Mandate**\n1. **Initiate\
    \ the Request:** Tell us that you need to change the bank account linked to your\
    \ Consumer Durable EMI repayments. \n2. **Identity Verification:** We will send\
    \ an MFA request to your registered mobile number. Provide the OTP to us to proceed.\n\
    3. **Submit New Details:** Provide the new account number and IFSC code. We will\
    \ verify these details against the NPCI registry to ensure the account is valid.\n\
    4. **Confirm Mandate Terms:** We will confirm that the updated mandate will continue\
    \ to cover your remaining instalments for the 9 month tenure at 0% interest.\n\
    5. **Acknowledge the Processing Time:** We will inform you of the time required\
    \ for the bank to activate the new mandate. During this transition, we will advise\
    \ you on how to make a manual payment to avoid the late payment charge of ₹350.\n\
    6. **Final Confirmation:** Once the mandate is active, we will provide a confirmation\
    \ message. You will then see the updated mandate details in your loan record.\n\
    \n**How you know it worked**\nYou will receive a confirmation that your repayment\
    \ mandate has been successfully updated. Your next EMI will be debited from the\
    \ new account, and you will no longer be at risk of the ₹350 late payment charge\
    \ due to issues with the previous account."
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 835ff8bf-32ff-50cc-9f6e-c1e211516c15
  title: Consumer Durable EMI — a discrepancy in your records or statement
  body: "As a support agent, use this guide to resolve customer queries regarding\
    \ discrepancies in their Consumer Durable EMI statements or repayment records.\n\
    \n**Symptom**\nThe customer claims they have paid an EMI, but the statement shows\
    \ it as unpaid, or they are questioning a charge they do not recognise.\n\n**Investigation\
    \ Path**\n1. **Verify the Charge:** Check if the disputed amount is the one-time\
    \ processing fee of ₹499 or a late payment charge of ₹350. \n2. **Validate Payment\
    \ Date:** Compare the customer's bank statement date with the expected EMI date\
    \ for the 9 month tenure.\n3. **Check Mandate Status:** Determine if the repayment\
    \ failed due to insufficient funds, which would automatically trigger the ₹350\
    \ late payment charge.\n4. **Cross-Reference MFA Logs:** Ensure the transaction\
    \ in question was authorised via the mandatory Multi-factor authentication (MFA)\
    \ process.\n\n**Resolution Steps**\n- **For Missing Payments:** If the customer\
    \ provides a valid UTR number and bank statement proving payment, we will manually\
    \ reconcile the account and remove any incorrectly applied late payment charges\
    \ of ₹350.\n- **For Fee Queries:** Explain that the ₹499 is a mandatory processing\
    \ fee disclosed in the Key Fact Statement (KFS) and the 0% interest rate ensures\
    \ no additional cost over the tenure.\n- **For Duplicate Charges:** If a technical\
    \ error caused a double debit, we will initiate a refund following the RBI's harmonised\
    \ turn-around-time (TAT) framework.\n\n**Escalation Process**\nIf the discrepancy\
    \ cannot be resolved through record reconciliation, we will raise a formal investigation\
    \ case. The customer should be informed that the case will be tracked and resolved\
    \ within the prescribed TAT. If the customer remains dissatisfied, the matter\
    \ will be escalated to the Nodal Officer."
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 57973dd4-c7c6-5052-9c55-73f4c50712b9
  title: EMI Repayment Mandate — overview
  body: 'Welcome to Kalash Finserv. To ensure your loan repayments are seamless and
    stress-free, we provide the **EMI Repayment Mandate**. This is our automated payment
    engine designed to handle your scheduled repayments accurately, ensuring you never
    miss a due date and helping you maintain a healthy credit score.


    By setting up a mandate, you authorise us to automatically debit the Equated Monthly
    Instalment (EMI) from your chosen bank account. We believe in complete transparency,
    which is why we provide a **Key Fact Statement (KFS)** before your loan is sanctioned,
    disclosing the all-in annualised cost of credit.


    **Key Features and Costs:**

    - **Pre-Debit Notifications:** We value your financial planning. We will send
    you a notification **24 hours** before the funds are debited from your account,
    allowing you to ensure sufficient balance is available.

    - **Bounce Charges:** In the event a scheduled repayment fails due to insufficient
    funds or mandate issues, an **EMI Bounce Charge of ₹500** will be levied. This
    fee helps us manage the operational risks associated with failed collections.

    - **Mandate Updates:** Should you need to amend your mandate details, we process
    these requests within **3 days**.


    Our approach is built on a ''no hidden charges'' policy. All fees are structured
    to cover operational costs and ensure the sustainability of our lending pool.
    We encourage all customers to review their repayment schedules to avoid unnecessary
    charges. For more details on how this works with our other offerings, you may
    refer to Personal Loan — overview.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 5d3e0733-f934-5bdf-87b1-43364594f951
  title: EMI Repayment Mandate — mandate pre debit notification hours explained
  body: '### Frequently Asked Questions


    **When will I be notified before my EMI is debited?**

    We provide a pre-debit notification **24 hours** before the scheduled repayment
    date. This alert is designed to help you ensure your account is sufficiently funded
    to avoid any payment failures.


    **What happens if I don''t see the notification?**

    While we strive for 100% delivery, we recommend keeping track of your loan due
    date as mentioned in your repayment schedule. If you have not received your notice
    **24 hours** prior to the debit, please ensure your registered mobile number is
    updated.


    **Can I change the timing of these notifications?**

    Currently, the notification window is standardised at **24 hours** for all customers
    to maintain operational consistency across our payment engine.


    For a deeper dive into all associated costs, please see EMI Repayment Mandate
    — fee schedule.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9ebb8ad2-e476-53b6-87d2-ea1b6ff1a9f2
  title: EMI Repayment Mandate — set up and activate
  body: 'Setting up your **EMI Repayment Mandate** is a straightforward process that
    ensures your loan repayments are handled automatically. Please follow these steps
    to activate your mandate:


    1. **Provide Bank Account Details:** Tell us the bank account number and IFSC
    code from which you wish the EMI to be debited. We require this to initiate the
    mandate request.

    2. **Complete KYC Verification:** We will perform a mandatory KYC verification.
    Depending on your account type, this may involve a digital verification process
    or a penny-drop validation to confirm account ownership.

    3. **Multi-Factor Authentication (MFA):** You will be asked to authorise the mandate.
    This is done via MFA (such as an OTP or NetBanking login). **Important:** Our
    agents will never ask you for your UPI PIN, OTP, or CVV. Please provide these
    only through the secure authentication prompt.

    4. **Review the Key Fact Statement (KFS):** We will provide you with a **Key Fact
    Statement (KFS)**. Review this document to confirm the all-in cost of your loan,
    including interest and any applicable fees.

    5. **Confirm Activation:** Once you provide your final consent, we will initiate
    the mandate with your bank. We will confirm once the mandate is active and the
    automated payment engine is linked to your loan account.


    **How you know it worked:**

    You will receive a confirmation message stating that your **EMI Repayment Mandate**
    is now active. Additionally, you will start receiving pre-debit notifications
    **24 hours** before your first scheduled EMI date.


    If you are deciding between different loan types, you may find Personal Loan —
    set up and activate helpful.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: how_to_guide
  source_authority: official
