    **Factors that may affect the total cost of credit**:

    While the interest rate is fixed, the total amount payable is influenced by the
    **15% down payment** (which reduces the principal) and the one-time **processing
    fee of ₹1500**. Any late payments or failed mandates will incur an **EMI Bounce
    Charge**, increasing the overall cost of the loan. All such costs are detailed
    in the **Key Fact Statement (KFS)** provided at the time of sanction.'
