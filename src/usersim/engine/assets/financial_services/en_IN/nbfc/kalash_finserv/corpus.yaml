- id: 7fb2d359-eaa3-5508-b6fd-f7dd34186062
  title: Gold Loan — set up and activate
  body: 'Setting up a **Gold Loan** with us is a streamlined process designed for
    speed and transparency. Follow these steps to activate your funding:


    1. **Request a Loan Quote**: Tell us the approximate weight and purity of the
    gold you wish to pledge. We will provide an initial estimate based on our 75%
    **Loan-to-Value (LTV)** cap.

    2. **Physical Gold Appraisal**: Bring your gold assets to our authorized center.
    Our appraisers will verify the purity and weight to determine the final market
    value.

    3. **KYC Verification**: Provide your identity and address proof. We will perform
    mandatory KYC verification and multi-factor authentication (MFA) to secure your
    account.

    4. **Review the Key Fact Statement (KFS)**: We will present you with the **Key
    Fact Statement (KFS)**. Review this carefully as it outlines the all-in cost,
    including the annual interest rate of 11.5% and the processing fee of ₹500.

    5. **Loan Sanction and Disbursement**: Once you sign the KFS and loan agreement,
    we will sanction the loan (provided it meets the minimum loan amount of ₹25000).
    The funds will be disbursed directly to your verified bank account.


    **How you know it worked:**

    You will receive a confirmation notification via SMS/Email once the funds are
    credited to your account, and you will be handed a secure gold deposit receipt
    for your collateral.'
