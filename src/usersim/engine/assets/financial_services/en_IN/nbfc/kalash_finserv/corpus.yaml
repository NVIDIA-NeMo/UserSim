- id: 4bf50e5c-c093-579d-9a48-a056e29261b2
  title: EMI Repayment Mandate — resolve a common request end-to-end
  body: 'This guide explains how to resolve a request to change the bank account linked
    to your <b>EMI Repayment Mandate</b>.


    <b>Prerequisites</b>

    - Details of the new bank account (Account Number and IFSC).

    - A cancelled cheque or a recent bank statement for the new account for verification.

    - Your registered mobile phone for MFA verification.


    <b>Steps to Update Your Mandate</b>

    1. <b>Initiate Request:</b> Tell us that you wish to change the bank account linked
    to your <b>EMI Repayment Mandate</b>.

    2. <b>Provide New Details:</b> Give us the new account number and IFSC code. We
    will ask you to share the cancelled cheque or statement to verify ownership.

    3. <b>Identity Verification:</b> We will trigger an MFA (Multi-factor authentication)
    request to your registered mobile number. Confirm the prompt to authorise the
    change.

    4. <b>Acknowledgement of Timeline:</b> We will inform you that the amendment requires
    <b>3 days</b> to be processed. We will confirm if the upcoming EMI will be debited
    from the old or new account based on this window.

    5. <b>Final Confirmation:</b> Once the <b>3 days</b> have passed, we will send
    you a confirmation message stating that your new bank account is now successfully
    linked.


    <b>How you know it worked</b>

    You will receive a final confirmation message, and your next <b>24 hours</b> pre-debit
    notification will reflect the updated bank account details.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: d1e073b1-cb41-5ec1-81eb-9227c40a9748
  title: EMI Repayment Mandate — a discrepancy in your records or statement
  body: 'This procedure guides agents in resolving customer disputes regarding discrepancies
    in their repayment statements, specifically concerning mandate failures and associated
    fees.


    <b>Symptom:</b> The customer claims they had sufficient funds, yet their statement
    shows a failed EMI and an <b>EMI Bounce Charge of ₹500</b>.


    <b>Investigation Steps for the Agent:</b>

    1. <b>Verify Debit Attempt:</b> Check the system logs to confirm the exact date
    and time the automated engine attempted the debit.

    2. <b>Check Notification Timestamp:</b> Verify that the pre-debit notification
    was sent <b>24 hours</b> before the attempt.

    3. <b>Analyse Bank Response Code:</b> Check the specific error code returned by
    the customer''s bank (e.g., ''Insufficient Funds'', ''Account Frozen'', ''Invalid
    Mandate'').

    4. <b>Cross-Reference Statement:</b> Compare the internal logs with the customer''s
    provided bank statement for that specific date.


    <b>Resolution Paths:</b>

    - <b>Case A: Bank Error:</b> If the bank statement proves sufficient funds were
    available and the bank erroneously rejected the debit, we will initiate a reversal
    of the <b>₹500</b> bounce charge once the customer provides a formal letter/email
    from their bank admitting the error.

    - <b>Case B: Timing Issue:</b> If funds were deposited *after* the debit attempt,
    the <b>₹500</b> charge stands as per our fee philosophy, as the operational cost
    of the failure was still incurred.

    - <b>Case C: Mandate Issue:</b> If the failure was due to an expired or incorrect
    mandate that we failed to notify the customer about, the fee will be waived.


    <b>Escalation:</b>

    If the customer remains dissatisfied after the investigation, the matter will
    be escalated to our designated Nodal Officer for a final review following RBI''s
    harmonised TAT framework.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 53f4a616-5762-58b4-af0e-76148f0e8381
  title: Institution-wide fees and charges
  body: 'At Kalash Finserv, we believe in absolute transparency. We maintain a **''no
    hidden charges'' policy**, ensuring that every cost is disclosed to you upfront.
    Our fees are structured specifically to cover operational costs and risk management,
    which allows us to maintain the long-term sustainability of our lending pool.


    **General Fee Principles:**

    - **Standard Charges:** All products incur specific fees such as processing fees
    and foreclosure charges, which are detailed in the product-specific schedules.

    - **EMI Bounce Charge:** A penalty fee is levied across all loan products when
    a scheduled Equated Monthly Instalment repayment fails due to insufficient funds
    or mandate issues.

    - **Waivers:** We grant fee waivers only under exceptional and documented circumstances.


    Before any loan is sanctioned, we provide a **Key Fact Statement (KFS)**. This
    standardized document provides the all-in cost of the loan, including interest
    and all applicable fees, ensuring you have a complete picture of your financial
    commitment.'
  domain: lending_mortgage
  product_category: general
  document_type: fee_schedule
  source_authority: official
