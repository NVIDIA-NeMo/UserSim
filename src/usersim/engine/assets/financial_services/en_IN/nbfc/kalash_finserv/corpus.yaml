- id: 2cb057ca-5804-5b67-8551-2711fea3e975
  title: Consumer Durable EMI — vs. a similar product here
  body: 'When deciding between our credit options, customers often compare the **Consumer
    Durable EMI** with our **Personal Loan**.


    **Key Differences:**

    - **Cost:** The Consumer Durable EMI features an annual interest rate of 0%, making
    it significantly cheaper than the Personal Loan for short-term needs. However,
    it carries a specific processing fee of ₹499.

    - **Tenure:** The Consumer Durable EMI is restricted to a short-term window of
    9 months, whereas the Personal Loan offers a more flexible tenure of up to 60
    months.

    - **Purpose:** Consumer Durable EMI is specifically for electronics and appliances,
    while the Personal Loan is unsecured funding for diverse needs.


    **Who should choose which?**

    - **Choose Consumer Durable EMI** if you are purchasing a specific appliance or
    electronic device and can comfortably repay the balance within 9 months to take
    advantage of the 0% interest.

    - **Choose Personal Loan** if you need a larger sum of money for varied purposes
    and require a longer repayment period (up to 60 months) to keep monthly instalments
    lower.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 362e5ca3-c4f4-52f6-a5b6-9819e1730090
  title: Consumer Durable EMI — regulatory disclosures
  body: "Kalash Finserv operates as a digitally-forward NBFC and adheres strictly\
    \ to the RBI Fair Practices Code, the Digital Lending Guidelines, and Scale Based\
    \ Regulation. \n\n**Regulatory Mandates:**\n- **Non-Deposit Institution:** We\
    \ explicitly state that Kalash Finserv takes no deposits from the public.\n- **Transparency:**\
    \ We mandate the provision of a **Key Fact Statement (KFS)** to every borrower.\
    \ The KFS discloses the all-in annualised cost of credit, including the 0% annual\
    \ interest rate and the ₹499 processing fee.\n- **Collection Practices:** We ensure\
    \ non-coercive collection practices in accordance with regulatory standards.\n\
    \n**Financial Obligations:**\nBorrowers are obligated to ensure timely repayment\
    \ of the loan over the 9 month tenure. Failure to maintain sufficient funds for\
    \ the automated repayment mandate will result in a late payment charge of ₹350\
    \ per occurrence. These fees are structured to cover risk management and operational\
    \ costs.\n\n**Security Protocols:**\nIn alignment with RBI and NPCI security protocols,\
    \ all fund disbursements require Multi-factor authentication (MFA) and KYC verification.\
    \ We maintain a strict policy where agents are prohibited from asking for UPI\
    \ PINs, OTPs, or CVVs.\n\n**Advice Boundary:**\nWe provide financial education\
    \ and product information regarding the Consumer Durable EMI but do not offer\
    \ individualized tax, legal, or investment advice. Our recommendations are based\
    \ on customer needs and credit eligibility without guarantees of specific financial\
    \ outcomes."
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: disclosure
