- id: 68467a3b-5520-5669-921b-8ec81647a370
  title: Personal Loan — set up and activate
  body: "If you are looking for unsecured funding, we have streamlined the process\
    \ to ensure a fast sanction. Follow these steps to apply for and activate your\
    \ **Personal Loan**.\n\n**Prerequisites**\nBefore starting, ensure you have your\
    \ digital KYC documents (PAN and Aadhaar) and your last three months' salary slips\
    \ or bank statements ready.\n\n**Steps to Activate**\n1. **Submit Application**:\
    \ Provide us with your required loan amount and preferred tenure (up to **60 months**).\
    \ \n2. **KYC Verification**: We will perform mandatory KYC verification and Multi-factor\
    \ authentication (MFA) to secure your identity. Note: Our agents will never ask\
    \ for your UPI PIN, OTP, or CVV.\n3. **Review Key Fact Statement (KFS)**: We will\
    \ provide you with a **Key Fact Statement (KFS)**. Review this document carefully\
    \ as it discloses the **annual interest rate of 14.5%**, the **processing fee\
    \ of 2%**, and other applicable charges.\n4. **Acceptance and Mandate**: Confirm\
    \ your acceptance of the terms and set up your **EMI Repayment Mandate**. This\
    \ automated engine ensures your payments are timely and helps you avoid the **EMI\
    \ Bounce Charge of ₹500**.\n5. **Fund Disbursement**: Once the mandate is active\
    \ and verification is complete, we will disburse the loan amount directly to your\
    \ verified bank account.\n\n**How you know it worked**\nYou will receive a confirmation\
    \ notification once the funds are credited to your account, and your loan account\
    \ will appear as 'Active' in your records."
  domain: lending_mortgage
  product_category: personal_loan
