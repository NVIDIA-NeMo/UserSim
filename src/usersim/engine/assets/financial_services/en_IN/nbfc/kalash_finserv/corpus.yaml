  title: Personal Loan — interest rate / APY schedule
  body: 'The **Personal Loan** follows a transparent, flat-rate pricing model for
    all eligible borrowers to ensure consistency and fairness.


    **Current Rate Schedule**

    * **Annual Interest Rate**: 14.5%


    This rate applies to all loan balances throughout the duration of the loan. It
    is quoted as a nominal annual rate and is calculated on a monthly reducing balance.


    **Factors Influencing the Rate**

    While the standard rate is 14.5%, this is the baseline for the product. The final
    effective cost of your loan (the Annual Percentage Rate) will include the **processing
    fee of 2%** and any other applicable charges as detailed in your **Key Fact Statement
    (KFS)**.


    **Rate Changes**

    Any adjustments to the interest rate will be made in accordance with regulatory
