- id: d6034f66-994e-5ecf-b9dd-bc55258cf909
  title: Personal Loan — when to switch or upgrade
  body: "Support agents should use this guide to help customers decide if they should\
    \ maintain their current Personal Loan or transition to another product.\n\n**When\
    \ to stay with the Personal Loan**\nCustomers should keep their current plan if\
    \ they value unsecured funding with a long-term repayment window (up to 60 months)\
    \ and can manage the 14.5% annual interest rate.\n\n**When to consider switching/upgrading**\n\
    * **Availability of Collateral:** If a customer has gold assets and wants a lower\
    \ cost of credit, they may switch to a Gold Loan. This provides quick liquidity\
    \ but requires collateral custody, unlike the unsecured Personal Loan.\n* **Specific\
    \ Purchase Needs:** If the customer is looking to buy a vehicle or electronics,\
    \ suggest the Two-Wheeler Loan or Consumer Durable EMI, as these are structured\
    \ for those specific assets.\n* **High Foreclosure Costs:** If a customer has\
    \ a significant balance, remind them that switching involves a 4% foreclosure\
    \ charge on the remaining principal of the Personal Loan.\n\n**Summary for Agents**\n\
    * **Personal Loan:** Best for general-purpose, unsecured needs. (Rate: 14.5%).\n\
    * **Gold Loan:** Best for those with assets seeking potentially different terms.\
    \ \n\nRefer to Personal Loan — vs. a similar product here for a more detailed\
    \ side-by-side analysis."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: aed4b365-0b32-5695-bd9e-fee71ff63bc4
  title: Personal Loan — comparison vs. alternatives and when not to choose it
  body: 'Choosing the right credit product depends on your assets, your needs, and
    your repayment capacity. Our Personal Loan is designed as a flexible, unsecured
    funding solution for the emerging middle class and salaried professionals.


    **Personal Loan Key Terms**

    * **Annual Interest Rate:** 14.5%

    * **Processing Fee:** 2%

    * **Foreclosure Charge:** 4%

    * **Maximum Tenure:** 60 months

    * **EMI Bounce Charge:** ₹500


    **Comparison with Alternatives**

    * **Vs. Gold Loan:** While a Gold Loan requires you to pledge assets, the Personal
    Loan is unsecured. Choose the Personal Loan if you do not wish to lock away your
    gold assets, though you will accept the 14.5% interest rate.

    * **Vs. Consumer Durable EMI:** If your goal is specifically to buy electronics,
    the Consumer Durable EMI product is often more cost-effective as it provides interest-free
    short-term credit. The Personal Loan is better for diverse, multi-purpose needs.

    * **Vs. Two-Wheeler Loan:** For mobility needs, the Two-Wheeler Loan is a structured
    financing option. The Personal Loan is preferable if you prefer a longer tenure
    (up to 60 months) and an unsecured structure.


    **When NOT to choose a Personal Loan**

    1. **If you have a very short-term need:** For a purchase that can be cleared
    in a few months, an interest-free Consumer Durable EMI is a better choice.

    2. **If you have gold assets and seek maximum liquidity:** A Gold Loan may be
    more suitable depending on the LTV (Loan-to-Value) and interest terms.

    3. **If you are highly sensitive to interest costs:** Since this is an unsecured
    product, it carries a 14.5% annual interest rate to manage risk. If you cannot
    sustain this rate, a secured loan is recommended.


    ***

    **Note:** We provide financial education and product information but do not offer
    individualized tax, legal, or investment advice.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: c2fc1ea9-f5eb-53a1-85c2-8c61fa7e4e7e
  title: Personal Loan — emi bounce charge explained
  body: '**What is an EMI Bounce Charge?**

    An **EMI Bounce Charge** is a penalty fee of ₹500 levied when a scheduled Equated
    Monthly Instalment (EMI) repayment fails. This usually happens due to insufficient
    funds in your linked bank account or issues with the repayment mandate.


    **How is the charge applied?**

    Whenever your bank declines the debit request from our automated payment engine,
    the ₹500 charge is automatically added to your outstanding dues.


    **Can this charge be waived?**

    In line with our fee philosophy, fees are structured to cover operational costs
    and risk. Waivers are granted only under exceptional, documented circumstances.
    We recommend maintaining sufficient balance to avoid these charges.


    For a full list of costs, please see Personal Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: f1772e9b-0f6a-5f3f-96d9-aa0b4dd7978f
  title: Personal Loan — resolve a common request end-to-end
  body: "One of the most common requests is the **Foreclosure of a Loan**, where a\
    \ customer wishes to pay off the entire remaining balance before the end of the\
    \ 60-month tenure.\n\n**Prerequisites**\n* Your registered mobile number for MFA\
    \ verification.\n* Sufficient funds to cover the remaining principal plus the\
    \ foreclosure fee.\n\n**End-to-End Resolution Steps**\n1. **Request Foreclosure\
    \ Quote:** Tell us that you wish to foreclose your Personal Loan. \n2. **Identity\
    \ Verification:** We will verify your identity using Multi-factor authentication\
    \ (MFA) to ensure the request is authorised.\n3. **Calculation of Total Due:**\
    \ We will calculate the total payout amount. This includes:\n    * The remaining\
    \ principal balance.\n    * The **Foreclosure Charge of 4%** applied to the outstanding\
    \ principal.\n    * Any accrued interest up to the date of payment.\n4. **Receive\
    \ the Quote:** We will provide you with the exact total amount required to close\
    \ the loan and the validity date of this quote.\n5. **Execute Payment:** You confirm\
    \ the payment. We will then process the transaction through the official payment\
    \ channel.\n6. **Confirmation of Closure:** Once the payment is cleared, we will\
    \ provide you with a confirmation that the loan is closed and initiate the process\
    \ to issue a No Objection Certificate (NOC).\n\n**How you know it worked**\n The\
    \ request is resolved when you receive the final foreclosure amount, make the\
    \ payment, and receive a confirmation of loan closure.\n\nFor more on the costs\
    \ involved, see Personal Loan — fee schedule."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 57a4994a-efa5-5ec3-98d9-8a3e69188ab1
  title: Personal Loan — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting customers who report a discrepancy
    in their loan statements or repayment records for a Personal Loan.


    **Symptom**

    The customer states that a payment made is not reflecting in their balance, or
    they see an unexpected charge (such as a ₹500 EMI Bounce Charge) that they believe
    is incorrect.


    **Investigation Steps (In Order)**

    1. **Verify Payment Date and Channel:** Ask the customer for the exact date and
    the transaction reference number of the payment in question.

    2. **Cross-Reference Mandate Logs:** Check the EMI repayment mandate logs to see
    if the debit request was successful or if the bank returned a ''failure'' code,
    which would justify the ₹500 EMI Bounce Charge.

    3. **Check for Processing Lag:** Verify if the payment was made during a weekend
    or public holiday, as these may result in a slight delay in the statement update.

    4. **Validate Interest Calculations:** Ensure the interest is being applied at
    the correct annual rate of 14.5%.


    **The Fix**

    * **Payment Reflection:** If a payment is confirmed via reference number but not
    reflecting, we will manually trigger a record refresh and update the balance.

    * **Wrongly Applied Bounce Charge:** If the customer provides documented proof
    that the bank account had sufficient funds and the failure was a bank-side technical
    error, we will evaluate the request for a waiver under our ''exceptional circumstances''
    policy.


    **When to Escalate**

    If the discrepancy cannot be resolved through basic record verification, we will
    route the issue to the designated Nodal Officer. The customer will be notified
    of the case number and can expect a resolution following the RBI''s harmonised
    turn-around-time (TAT) framework.


    For further guidance on fees, refer to Personal Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: ddd8f8d1-2973-5429-85d8-a49346f392eb
  title: Gold Loan — overview
  body: 'We provide a **Gold Loan** designed to give you quick liquidity by leveraging
    your gold assets. This product is ideal for those seeking immediate funds without
    the lengthy documentation associated with unsecured credit, while ensuring your
    collateral remains in secure custody.


    **Key Product Details:**

    - **Minimum Loan Amount**: We offer funding starting from a minimum of ₹25000.

    - **Interest Rate**: The loan carries an annual interest rate of 11.5%.

    - **Tenure**: The loan is provided for a fixed duration of 12 months.

    - **Loan-to-Value (LTV)**: To manage risk and ensure sustainability, we cap the
    loan amount at 75% of the appraised value of your gold collateral.

    - **Processing Fee**: A one-time processing fee of ₹500 is applicable at the time
    of sanction.


    **Our Commitment to Transparency**

    At Kalash Finserv, we follow a ''no hidden charges'' policy. Before your loan
    is sanctioned, we will provide you with a **Key Fact Statement (KFS)**. This standardized
    document discloses the all-in annualised cost of credit, including the 11.5% interest
    and the ₹500 processing fee, ensuring you have a clear understanding of your financial
    obligation.


    **Security and Process**

    Your gold is held in secure, audited custody. Disbursement is subject to mandatory
    KYC verification and multi-factor authentication (MFA) to ensure the highest security
    standards. We adhere strictly to the RBI Fair Practices Code to ensure a non-coercive
    and professional experience.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: product_sheet
  source_authority: official
