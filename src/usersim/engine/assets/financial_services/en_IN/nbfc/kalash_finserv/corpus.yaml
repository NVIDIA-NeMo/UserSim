- id: eeaf48ff-0a29-5536-adb4-79196456bb51
  title: Two-Wheeler Loan — risk disclosures
  body: 'This document provides essential risk disclosures regarding the Two-Wheeler
    Loan. Please read these carefully before committing to the credit facility.


    **1. Interest and Cost Risk**

    The loan carries an **annual interest rate of 12.9%**. This rate is applied to
    the outstanding principal over a **tenure of 36 months**. Any delay in repayment
    will not only attract interest but may also result in an **EMI Bounce Charge**
    if the repayment mandate fails.


    **2. Collateral and Ownership Risk**\The vehicle financed serves as security for
    the loan. Until the loan is fully repaid—including the principal, interest, and
    the **processing fee of ₹1500**—the vehicle will be hypothecated to Kalash Finserv.
    Failure to maintain repayments may lead to the repossession of the asset in accordance
    with the RBI Fair Practices Code.


    **3. Down Payment Obligation**\A **down payment of 15%** is a mandatory prerequisite
    for disbursement. Kalash Finserv does not provide 100% financing for this product.


    **4. Prepayment Risk**\While you may close the loan early, be advised that a **Foreclosure
    Charge** will apply. This charge is disclosed in your **Key Fact Statement (KFS)**
    and is designed to cover the risk management costs of the lending pool.


    ***

    **Regulatory Disclaimer:** Kalash Finserv operates as an NBFC and does not accept
    deposits. We adhere to Digital Lending Guidelines and Scale Based Regulation to
    ensure all collection practices remain non-coercive.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 8dcf5ca3-b4d3-5343-91c9-6eb0d7f11954
  title: Two-Wheeler Loan — how rates are tiered and applied
  body: 'For the Two-Wheeler Loan, Kalash Finserv employs a simplified, transparent
    pricing model. Unlike products with complex tiers, we apply a flat rate to ensure
    consistency for our customers.


    **Applicable Rate**

    A single **annual interest rate of 12.9%** applies to all eligible borrowers for
    this product. This rate is quoted on a reducing balance basis and is consistent
    regardless of the final loan amount sanctioned.


    **Application and Calculation**

    *   **Interest Calculation:** The **12.9%** annual rate is calculated on the outstanding
    principal balance of your loan.

    *   **Tenure Impact:** The rate is applied over a fixed **tenure of 36 months**.

    *   **Fees:** This rate is exclusive of the one-time **processing fee of ₹1500**.


    **What would change this rate?**

    This rate is fixed for the duration of the loan agreement. However, in accordance
    with Scale Based Regulation, Kalash Finserv may adjust rates for new loans based
    on updated RBI guidelines or significant changes in the cost of funds. Any such
    change would be reflected in the **Key Fact Statement (KFS)** of the new application.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: rate_sheet
