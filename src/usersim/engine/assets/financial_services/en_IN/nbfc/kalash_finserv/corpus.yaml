- id: 6f04bdd1-9316-5104-8310-1878e66ee2f0
  title: Two-Wheeler Loan — make a change or update
  body: 'If you are an existing **Two-Wheeler Loan** customer and need to update your
    account details or repayment preferences, please follow these steps:


    **Updating Personal Information (Address, Email, Phone)**

    1. Tell us which specific contact detail you wish to change (e.g., ''I want to
    update my registered mobile number'').

    2. Provide the new details and a valid supporting document for verification (such
    as an Aadhaar card or utility bill).

    3. We will perform a KYC verification check to ensure the request is legitimate.

    4. Once verified, we will confirm the update via an SMS and email to both your
    old and new contact points.


    **Updating Your Repayment Mandate**

    1. Inform us that you wish to change the bank account from which your monthly
    instalments are debited.

    2. Provide the new bank account number and the IFSC code.

    3. We will send a mandate request to your new bank. You will need to approve this
    through your bank''s secure channel (via MFA).

    4. We will confirm once the new mandate is active. Ensure this is completed at
    least 10 days before your next EMI date to avoid an **EMI Bounce Charge**.


    **Requesting a Statement of Account**

    1. Request a current statement for your **Two-Wheeler Loan**.

    2. We will verify your identity using Multi-factor authentication (MFA).

    3. We will provide a digital statement showing your remaining principal, the interest
    paid at 12.9% annually, and your upcoming payment schedule.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
