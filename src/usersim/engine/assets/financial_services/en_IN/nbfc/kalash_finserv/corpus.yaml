- id: 95c9b077-c13a-5e12-8e41-642bb52c39de
  title: Consumer Durable EMI — tenure months explained
  body: '**How long do I have to repay my Consumer Durable EMI?**

    All loans under this product carry a fixed repayment tenure of 9 months. This
    duration is designed to provide a balance between affordable monthly instalments
    and a quick path to full ownership of your asset.


    **Can I extend the tenure beyond 9 months?**

    No, the tenure for the Consumer Durable EMI is standardized at 9 months to maintain
    the interest-free nature of the product. If you require longer-term flexible funding,
    you may wish to explore our Personal Loan — overview.


    **What happens if I want to pay off the balance before the 9 months are over?**

    We allow early repayments. Please refer to our Consumer Durable EMI — fee schedule
    for details on any applicable charges for closing the loan early.'
