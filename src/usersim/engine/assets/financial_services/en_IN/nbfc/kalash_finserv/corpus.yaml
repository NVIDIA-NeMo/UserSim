- id: c2502ae6-828d-5469-8c78-cafb7cca5383
  title: Gold Loan — check status or history
  body: 'As an existing customer, you can easily track the status of your **Gold Loan**,
    including your current outstanding balance and repayment history.


    **Requirements before starting**

    Ensure you have your registered mobile number and loan account number ready for
    verification.


    **Steps to check your status**

    1. **Request Loan Details**: Tell us that you would like to check the current
    status of your Gold Loan. We will then perform a mandatory KYC verification to
    ensure your security.

    2. **Review Current Balance**: We will provide you with your current outstanding
    principal and the interest accrued at the annual rate of 11.5%.

    3. **Request Statement of Account**: Ask us for your detailed payment history.
    We will generate a statement showing all repayments made toward your 12-month
    tenure.

    4. **Verify Collateral Status**: Ask for confirmation of your collateral custody.
    We will confirm that your gold assets are securely stored and mapped to your loan
    account.


    **How you know it worked**

    You will receive a clear confirmation of your remaining balance, a list of successful
    repayments, and the current status of your gold assets (e.g., ''Held in Custody'').


    ***

    **Regulatory Disclaimer**: All account summaries provided are based on the terms
    disclosed in your original Key Fact Statement (KFS).'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: how_to_guide
  source_authority: official
