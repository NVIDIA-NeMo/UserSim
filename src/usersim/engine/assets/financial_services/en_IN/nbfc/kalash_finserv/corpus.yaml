- id: dbd425b0-c435-5e63-8f52-fbe4620d71dc
  title: Gold Loan — who it is best for and common use cases
  body: 'Our Gold Loan is designed for individuals who possess gold assets and require
    quick, transparent liquidity without the lengthy waiting periods associated with
    unsecured credit. It is an ideal solution for the emerging middle class and salaried
    professionals who prefer leveraging their own assets to secure a lower cost of
    credit.


    **Who is this best for?**

    * **Emergency Fund Seekers**: Those needing immediate cash for medical emergencies
    or urgent repairs.

    * **Short-term Business Gap-fillers**: Small business owners managing temporary
    working capital shortages.

    * **Strategic Borrowers**: Individuals who prefer a secured loan to maintain a
    better credit profile than relying on high-interest credit cards.


    **Common Use Cases**

    * **Education Expenses**: Paying semester fees or certification costs quickly.

    * **Home Improvement**: Funding urgent renovations or appliance upgrades.

    * **Debt Consolidation**: Clearing higher-interest short-term debts with a structured
    12-month plan.


    **Product Specifications**

    * **Minimum Loan Amount**: ₹25,000

    * **Loan-to-Value (LTV)**: Capped at 75% of the appraised gold value.

    * **Annual Interest Rate**: 11.5%

    * **Processing Fee**: ₹500

    * **Max Tenure**: 12 months


    We ensure complete transparency by providing a **Key Fact Statement (KFS)** before
    the loan is sanctioned, disclosing the all-in annualised cost of credit. This
    ensures there are no hidden charges, aligning with our commitment to customer-centric
    credit accessibility.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 1baf40dd-4028-511a-b410-20e00b45796d
  title: Gold Loan — interest rate annual explained
  body: '**How is the annual interest rate calculated for my Gold Loan?**

    We apply a flat annual interest rate of **11.5%** on the principal amount of your
    loan. This rate is used to calculate the interest accruing on your outstanding
    balance over the course of your tenure.


    **Does the interest rate change during my loan tenure?**

    For the duration of your **12 months** tenure, the rate of **11.5%** remains consistent
    as per your initial agreement. Any changes to the interest rate structure would
    be communicated in accordance with our change-of-terms policy and reflected in
    your updated statements.


    **Where can I see the total interest I will pay?**

    You can find the total interest and the all-in cost of your loan in the **Key
    Fact Statement (KFS)** provided to you before the loan was sanctioned. For further
    details on cost structures, you may refer to the **Gold Loan — fee schedule**.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: faq
  source_authority: official
  placeholder: true
