- id: 56775dd4-4fb5-572c-887e-7d4729288f89
  title: Consumer Durable EMI — make a change or update
  body: 'If you are an existing customer and need to update your details or modify
    your repayment preferences for your **Consumer Durable EMI** plan, please follow
    these steps:


    **Updating Contact Information**

    1. Tell us which specific detail needs updating (e.g., mobile number, email address,
    or residential address).

    2. Provide the new details and a valid supporting document for the change (such
    as an Aadhaar card or utility bill for address changes).

    3. We will verify the request using **Multi-factor authentication (MFA)** to ensure
    the security of your account.

    4. We will confirm once the records are updated in our system.


    **Updating Repayment Mandates**

    1. Inform us that you wish to change the bank account from which your EMIs are
    debited.

    2. Provide the new bank account details, including the account number and IFSC
    code.

    3. We will initiate a new KYC verification for the updated bank account to comply
    with RBI guidelines.

    4. We will notify you once the new mandate is active. Please ensure this is done
    before your next payment date to avoid a **late payment charge of ₹350**.


    **Requesting a Balance Statement**

    1. Ask us for an updated statement of your **Consumer Durable EMI** account.

    2. We will generate and send the statement to your registered email address.

    3. You can use this statement to track your remaining tenure within the 9 month
    period.


    If you encounter any issues during this process, we will route your request through
    our tiered support system to ensure a resolution.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: cbafc50a-6c0f-5a13-bf49-9c39daab71d4
  title: Consumer Durable EMI — access or login problems
  body: 'If you are unable to access your account details or login to view your **Consumer
    Durable EMI** schedule, please follow these troubleshooting steps:


    **Symptom**: "I cannot log in to my account or I am not receiving my MFA codes."


    **Potential Causes**

    * Incorrect credentials (mobile number or password).

    * Network latency affecting the delivery of the One-Time Password (OTP).

    * Account lock due to multiple failed login attempts.

    * Outdated KYC information causing a security block.


    **Resolution Steps**

    1. **Verify Credentials**: Double-check that you are using the mobile number registered
    with Kalash Finserv during your loan application.

    2. **Check Connectivity**: Ensure you have a stable cellular signal to receive
    the MFA code. Wait 60 seconds before requesting a new OTP.

    3. **Clear Cache**: If using a digital interface, clear your browser cache and
    attempt to log in again.

    4. **Identity Verification**: If you are still locked out, tell us your registered
    mobile number and provide a valid government ID for verification.


    **What Happens Next**

    If we cannot resolve the login issue immediately, we will:

    * Raise a technical case with our backend team.

    * Verify your identity through an alternative MFA method if available.

    * Provide you with a provisional update on when access will be restored.


    **Escalation**

    If the issue remains unresolved after 48 hours, we will escalate the matter to
    our designated Nodal Officer. You will receive a notification regarding the status
    of your grievance via your registered email. For concerns regarding charges during
    this downtime, please refer to Consumer Durable EMI — an unexpected charge or
    amount.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
