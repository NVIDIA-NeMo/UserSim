- id: 2d5b73d5-7e71-55b0-afeb-5f02acd68b88
  title: Consumer Durable EMI — fraud and unauthorized-activity protection
  body: "At Kalash Finserv, we are committed to ensuring your credit experience is\
    \ secure. As you compare our Consumer Durable EMI offering with others, please\
    \ be aware of specific fraud patterns targeting short-term electronics financing.\
    \ Scammers often pose as 'loan approval agents' or 'verification officers' claiming\
    \ your application is pending a small 'activation fee' or 'security deposit' to\
    \ unlock your 0% interest rate.\n\n**Crucial Security Protocols**\nWe adhere strictly\
    \ to RBI and NPCI security protocols. To protect your funds and identity, please\
    \ remember:\n\n* **We will never ask** for your UPI PIN, OTPs, or CVVs over the\
    \ phone, email, or SMS.\n* **No upfront payments** are requested via personal\
    \ UPI IDs for loan sanctioning.\n* All legitimate fund disbursements and mandates\
    \ are processed only after mandatory **Multi-factor authentication (MFA)** and\
    \ **KYC verification**.\n\n**Identifying Unauthorized Activity**\nIf you notice\
    \ a loan sanction you did not apply for, or if you receive a notification for\
    \ a mandate you did not authorize, treat this as a security breach. \n\n**Immediate\
    \ Action Required**\nFraudulent activity must be reported immediately through\
    \ our official chargeback path to initiate a formal investigation. Rapid reporting\
    \ is essential to minimize your liability and allow us to freeze unauthorized\
    \ transactions.\n\nWe provide a transparent and secure path to ownership. If any\
    \ individual claiming to represent Kalash Finserv asks for your private security\
    \ credentials, terminate the communication immediately and report it to us."
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: fb095def-999a-5906-84c5-fbc5c6b1a5dc
  title: Consumer Durable EMI — account agreement
  body: 'This Account Agreement governs the use of the Consumer Durable EMI facility
    provided by Kalash Finserv. By opting for this product, the borrower agrees to
    the following binding terms:


    **1. Credit Terms and Repayment**

    The borrower is granted a credit facility for the purchase of consumer durables
    with a fixed **tenure of 9 months**. The facility is provided at an **annual interest
    rate of 0%**. Repayment shall be made in equal monthly instalments as per the
    schedule provided in the Key Fact Statement (KFS).


    **2. Fees and Charges**

    * **Processing Fee**: A non-refundable one-time processing fee of **₹499** is
    applicable at the time of loan sanctioning. This fee covers operational costs
    and risk management.

    * **Late Payment**: In the event of a repayment failure or delay, a **late payment
    charge of ₹350** will be levied. This is in addition to any EMI Bounce Charges
    that may be applied by the payment engine as per the EMI Repayment Mandate terms.


    **3. Obligations and Defaults**

    The borrower mandates the provision of a valid repayment mandate. Failure to maintain
    sufficient funds for the scheduled EMI constitutes a default. We reserve the right
    to initiate non-coercive collection practices in accordance with the RBI Fair
    Practices Code.


    **4. Termination and Closure**\The agreement ends upon the successful payment
    of all 9 monthly instalments and any applicable charges. Early closure options
    are subject to the terms disclosed in the KFS.


    **5. Amendments**\Kalash Finserv may amend these terms to comply with RBI Digital
    Lending Guidelines or Scale Based Regulation. Notice of such changes will be provided
    to the borrower via registered communication channels.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: ae873bd2-d9c5-549b-8492-7de2585bb798
  title: Consumer Durable EMI — who it is best for and common use cases
  body: 'The Consumer Durable EMI is designed for the emerging middle class and salaried
    professionals who wish to upgrade their lifestyle without the burden of high-interest
    debt. It is an interest-free short-term credit solution specifically tailored
    for essential electronics and appliances.


    **Who is this product best for?**

    This facility is ideal for individuals who prefer structured, predictable payments
    over a short horizon and wish to avoid the traditional interest costs associated
    with personal loans. It is best suited for those with a stable monthly income
    who can commit to a **9 months** repayment cycle.


    **Common Use Cases**

    * **Home Appliances**: Purchasing a new refrigerator, washing machine, or air
    conditioner to improve home efficiency.

    * **Personal Electronics**: Upgrading to a professional laptop or smartphone for
    work or education.

    * **Essential Gadgets**: Acquiring home theatre systems or kitchen appliances
    without a large upfront cash outflow.


    **Financial Overview**

    We ensure total transparency with a ''no hidden charges'' policy. The cost of
    the credit is limited to a one-time **processing fee of ₹499**. The cost of borrowing
    is kept at an **annual interest rate of 0%**, making it one of the most accessible
    ways to acquire durables.


    **Key Constraints**

    To maintain the sustainability of our lending pool, we apply a **late payment
    charge of ₹350** for any missed schedules. All borrowers will receive a **Key
    Fact Statement (KFS)** before sanction, disclosing the all-in cost of the loan.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 561fe5d8-a885-5e05-880e-435dff598bf3
  title: Consumer Durable EMI — processing fee explained
  body: '**What is the processing fee for the Consumer Durable EMI?**

    We charge a one-time processing fee of **₹499**. This fee is applied at the beginning
    of your loan tenure to cover the operational costs of credit assessment, documentation,
    and the administration of your account.


    **Is this fee refundable if I pay my loan early?**

    No, the processing fee of **₹499** is non-refundable as it covers the initial
    cost of sanctioning the loan. We maintain a transparent fee structure to ensure
    the long-term sustainability of our lending pool.


    **How is the processing fee different from interest?**

    Unlike interest, which is a cost of borrowing over time, the processing fee is
    a flat administrative charge. For this specific product, you benefit from an **annual
    interest rate of 0%**, meaning you only pay the upfront processing fee and the
    principal amount of your purchase.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 184a502f-316b-5dc5-ac12-a76ded3e91cb
  title: Consumer Durable EMI — cancel, close, or downgrade
  body: 'Whether you wish to close your loan early or cancel a pending application,
    we provide a straightforward process to manage your Consumer Durable EMI account.


    **Closing an Active Loan (Foreclosure)**

    If you wish to pay off your remaining balance before the end of your **9 months**
    tenure:

    1. Tell us that you wish to foreclose your Consumer Durable EMI loan.

    2. We will calculate the total outstanding principal remaining on your account.

    3. We will provide you with the final settlement amount, including any applicable
    charges as disclosed in your **Key Fact Statement (KFS)**.

    4. Once you make the full payment, we will issue a closure confirmation and update
    your credit records.


    **Cancelling a Loan Application**

    If you have applied but the loan has not yet been sanctioned:

    1. Inform us that you wish to withdraw your application.

    2. We will verify your identity via MFA.

    3. We will cancel the application process and confirm the cancellation to you
    via your registered contact method.


    **Downgrading or Changing Terms**

    Because the Consumer Durable EMI is a fixed-term product with a specific **annual
    interest rate of 0%** and a set **tenure of 9 months**, the terms of an existing
    loan cannot be ''downgraded'' or restructured. If you require a different credit
    product, such as a Personal Loan, you would need to apply for a new facility separately.


    **Confirmation**

    You will know the process is complete when you receive a formal ''No Dues Certificate''
    or a cancellation notice in your registered email/SMS.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 1d5b00e7-9e07-5665-9cfa-3b145ceba196
  title: Consumer Durable EMI — an unexpected charge or amount
  body: '**Symptom**: You notice a charge on your statement that does not match your
    expected monthly instalment or you see an additional fee you did not anticipate.


    **Likely Causes**

    1. **Late Payment**: The most common cause is a missed or delayed payment, triggering
    a **late payment charge of ₹350**.

    2. **Payment Failure**: If your mandate failed due to insufficient funds, you
    may see an **EMI Bounce Charge** (as managed by our repayment engine).

    3. **Initial Setup**: For new loans, the one-time **processing fee of ₹499** is
    charged at the start.


    **What to Check**

    1. **Payment Date**: Check if your instalment was debited on the scheduled date.
    If it was delayed, the **late payment charge of ₹350** is automatically applied.

    2. **KFS Review**: Refer to your **Key Fact Statement (KFS)** to confirm the all-in
    cost of your loan, including the **₹499** processing fee.

    3. **Bank Statement**: Verify if your bank charged a separate fee for a failed
    mandate (Bounce Charge).


    **Resolution**

    * If the charge is a valid late fee, ensure your account is funded for the next
    cycle to avoid further penalties.

    * If you believe the charge was applied in error (e.g., payment was made on time
    but a fee was still levied), provide us with the transaction reference number
    of your payment.


    **Escalation**

    If we cannot resolve the discrepancy immediately, we will raise a formal case
    and route it to our internal billing specialists. You will receive a resolution
    update within the RBI''s harmonised turn-around-time (TAT) framework. Unresolved
    grievances can be escalated to our designated Nodal Officer.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: ad46b0d5-47c3-5aa9-bda9-490a2f67d7b9
