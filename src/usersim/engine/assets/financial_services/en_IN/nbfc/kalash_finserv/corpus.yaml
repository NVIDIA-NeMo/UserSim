- id: 6e77c593-ec43-5db6-9913-85303b2ac888
  title: Gold Loan — a declined or blocked action
  body: '**Symptom**: You are attempting to apply for a **Gold Loan** or perform an
    action on an existing loan, but the request is declined or blocked.


    **Likely Causes**

    * **Below Minimum Amount**: You are requesting a loan amount less than ₹25000.

    * **LTV Violation**: The requested loan amount exceeds 75% of the appraised value
    of your gold.

    * **Verification Failure**: Mandatory Multi-factor authentication (MFA) or KYC
    verification was not completed successfully.

    * **Ineligible Collateral**: The gold provided does not meet our purity or weight
    standards during appraisal.


    **What to check in order**

    1. **Check the Loan Amount**: Ensure your requested amount is at least ₹25000.
    If it is lower, the system will automatically block the request.

    2. **Review the Appraised Value**: Check if your request is within the 75% **Loan-to-Value
    (LTV)** cap. For example, if your gold is appraised at ₹1,00,000, the maximum
    loan possible is ₹75,000.

    3. **Verify KYC Status**: Ensure your identity documents are up to date. We cannot
    disburse funds without completed KYC.


    **The Fix**

    * If the amount is too low, increase your request to ₹25000 or above.

    * If the LTV is too high, either reduce the requested loan amount or provide additional
    gold collateral to increase the appraised value.

    * If verification failed, provide the updated KYC documents we request during
    the conversation.


    **When to escalate**

    If you have met the ₹25000 minimum and 75% LTV requirements and provided all KYC,
    but the action is still blocked, we will raise a case for our credit underwriting
    team. You will receive a resolution or a request for further documentation within
    the RBI''s harmonised turn-around-time (TAT) framework.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9e16866e-83a8-507c-adee-58069d6f226a
  title: Gold Loan — when to switch or upgrade
  body: 'For support agents: Use this guide to help customers decide if a **Gold Loan**
    is the right choice compared to other Kalash Finserv products.


    **When to recommend a Gold Loan**

    * **When the customer has gold assets**: If they seek quick liquidity and can
    provide gold collateral, this is ideal as it offers a structured 12-month tenure
    and an 11.5% annual interest rate.

    * **When speed is priority**: Gold Loans typically have faster sanction times
    than unsecured loans because the LTV of 75% provides immediate security.


    **When to suggest a switch (e.g., to Personal Loan)**

    * **No Collateral**: If the customer is uncomfortable pledging gold, refer them
    to the Personal Loan — overview for unsecured options.

    * **Higher Amount Needs**: If the customer''s gold appraisal is too low to meet
    their needs (due to the 75% LTV cap) and they have a strong credit profile, an
    unsecured personal loan may be better.

    * **Longer Tenure**: If the customer cannot repay within 12 months, a Personal
    Loan may offer a more flexible tenure (up to 60 months).


    **Summary for Agent**

    Choose **Gold Loan** for collateral-backed speed and a ₹500 processing fee. Choose
    **Personal Loan** for unsecured flexibility.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 8dccae25-b62c-553e-ad7c-1f163aee79f4
  title: Gold Loan — comparison vs. alternatives and when not to choose it
  body: 'Choosing the right credit product depends on your assets, your timeline,
    and your comfort with collateral. The **Gold Loan** is designed for those who
    need quick liquidity by leveraging their gold assets.


    **How the Gold Loan Compares**

    * **Cost of Credit**: With an annual interest rate of 11.5% and a one-time processing
    fee of ₹500, this is often more affordable than some unsecured credit lines, provided
    you have the collateral.

    * **Accessibility**: Unlike personal loans that rely heavily on credit scores,
    the **Gold Loan** is primarily based on the value of your gold, subject to a **Loan-to-Value
    (LTV)** cap of 75%.

    * **Speed**: Because the loan is secured, the sanction process is generally faster
    than unsecured products.


    **When NOT to choose a Gold Loan**

    * **If you cannot part with your assets**: Since we maintain secure custody of
    your gold for the 12-month tenure, this is not for you if you need the jewellery
    for an upcoming event.

    * **If you need a very small amount**: We have a minimum loan amount of ₹25000.
    For smaller, essential electronics or appliance needs, our Consumer Durable EMI
    may be a better fit.

    * **If you need a long-term repayment plan**: This product has a maximum tenure
    of 12 months. If you require a longer window to pay back the loan (e.g., up to
    60 months), you should consider a personal loan.


    **Quick Summary Table**

    | Feature | Gold Loan | Unsecured Alternatives |

    | :--- | :--- | :--- |

    | **Collateral** | Gold Required | None |

    | **Max LTV** | 75% of gold value | N/A |

    | **Interest Rate** | 11.5% annual | Typically higher |

    | **Min. Amount** | ₹25000 | Varies |

    | **Max Tenure** | 12 months | Often longer |


    ***

    **Regulatory Disclaimer**: All loan terms are provided in a Key Fact Statement
    (KFS) before sanction to ensure full transparency of the all-in cost of credit.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 8badd607-252d-502b-8159-138e681df03e
  title: Gold Loan — minimum loan amount explained
  body: '**What is the minimum amount I can borrow with a Gold Loan?**

    The minimum loan amount for a **Gold Loan** at Kalash Finserv is ₹25000. We cannot
    sanction any gold-backed loans below this threshold.


    **What if my gold appraisal is too low to reach ₹25000?**

    Since the loan amount is capped at 75% of the appraised value (LTV), your gold
    must be appraised at a minimum of ₹33,334 for you to qualify for the ₹25000 minimum
    loan. If your appraisal falls below this, you may need to provide additional gold
    assets to reach the minimum threshold.


    **Can I increase my loan amount later?**

    Yes, if you have additional gold to pledge or if the value of your current collateral
    has increased, you may request a top-up. Please refer to Gold Loan — overview
    for more details on our product structure.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: bfef0129-6ad0-522c-8622-7602ed566217
  title: Gold Loan — resolve a common request end-to-end
  body: 'This guide explains how to complete the process of obtaining a **Gold Loan**,
    from the initial appraisal to the disbursement of funds.


    **Requirements before starting**

    * Physical gold ornaments for appraisal.

    * Valid KYC documents (Aadhaar, PAN, etc.).

    * A bank account in your name for fund disbursement.


    **Steps to resolve your loan request**

    1. **Submit Gold for Appraisal**: Provide your gold assets to our authorised appraiser.
    We will determine the market value and purity of the gold.

    2. **Receive Loan Offer**: Based on the appraisal, we will offer you a loan amount
    up to 75% of the gold''s value (the **Loan-to-Value** cap), ensuring the amount
    is at least ₹25000.

    3. **Review the Key Fact Statement (KFS)**: We will provide you with a **Key Fact
    Statement (KFS)**. Review this carefully as it discloses the annual interest rate
    of 11.5%, the one-time processing fee of ₹500, and the 12-month tenure.

    4. **Complete KYC and MFA**: Provide your KYC documents and complete the mandatory
    multi-factor authentication (MFA) to verify your identity.

    5. **Final Approval and Disbursement**: Once the KFS is signed and KYC is verified,
    we will secure your gold in our custody and disburse the funds directly to your
    bank account.


    **How you know it worked**

    You will receive a notification that the funds have been credited to your account,
    and you will be given a secure receipt confirming that Kalash Finserv has taken
    custody of your gold collateral.


    ***

    **Regulatory Disclaimer**: We adhere to the RBI Fair Practices Code; no coercive
    practices are used, and all fees are disclosed upfront.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 888b59e6-e687-540e-a4ef-e776a75bfce3
  title: Gold Loan — a discrepancy in your records or statement
  body: '**Symptom**: A customer reports that the interest charged, the remaining
    principal, or the recorded weight of their gold collateral in their statement
    does not match their own records.


    **Likely Causes**

    * **Interest Calculation Timing**: The customer may be calculating interest on
    a different cycle than our annual 11.5% rate application.

    * **Processing Fee Oversight**: The customer may have forgotten that a one-time
    processing fee of ₹500 was deducted from the disbursement or added to the loan.

    * **Appraisal Variance**: A misunderstanding of the difference between the ''market
    value'' and the ''appraised value'' used to calculate the 75% LTV.

    * **Unposted Payment**: A recent repayment may not have yet reflected in the statement.


    **What to check in order**

    1. **Review the KFS**: Check the original **Key Fact Statement (KFS)** to confirm
    the agreed-upon interest rate (11.5%) and the processing fee (₹500).

    2. **Verify Transaction Dates**: Check the date of the last repayment against
    the statement date to see if there is a lag in posting.

    3. **Compare Appraised vs. Market Value**: Verify the specific weight and purity
    recorded during the appraisal process to ensure the 75% LTV was applied correctly.


    **The Fix**

    * **For Interest/Fee Queries**: Provide a breakdown showing how the 11.5% annual
    rate and the ₹500 fee were applied to the principal.

    * **For Payment Discrepancies**: Ask the customer for the payment reference number
    and manually verify the transaction in our ledger.

    * **For Collateral Queries**: Re-confirm the appraised weight and purity from
    the signed appraisal slip.


    **When to escalate**

    If the discrepancy persists after these checks, we will route the issue to the
    designated Nodal Officer. We follow the RBI''s harmonised turn-around-time (TAT)
    framework for all grievance resolutions. The customer will be notified once the
    investigation is complete and any necessary corrections are applied to the records.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 77b3553e-fe6c-5b9a-a209-ff20d7d7480c
  title: Two-Wheeler Loan — overview
  body: 'Welcome to Kalash Finserv. We provide accessible financing for mobility through
    our **Two-Wheeler Loan**, designed specifically for the emerging middle class
    and salaried professionals in India. Whether you are commuting to work or upgrading
    your ride, we ensure a transparent and speedy sanction process.


    Our Two-Wheeler Loan allows you to acquire your vehicle with a structured payment
    plan. To ensure a sustainable lending pool and manageable debt levels, we require
    a **down payment of 15%** of the vehicle''s value. The remaining balance is funded
    at an **annual interest rate of 12.9%**.


    To facilitate the processing and administration of your credit, a one-time **processing
    fee of ₹1500** is applicable at the time of sanction. We offer a clear repayment
    window with a fixed **tenure of 36 months**, allowing you to plan your monthly
    budget with certainty.


    At Kalash Finserv, we adhere to a ''no hidden charges'' policy. Before your loan
    is sanctioned, we will provide you with a **Key Fact Statement (KFS)**. This document
    is essential as it discloses the all-in annualised cost of credit, including the
    interest and all applicable fees, ensuring you have complete transparency before
    committing to the loan.


    ***

    **Regulatory Disclaimer**: Kalash Finserv is an NBFC and does not take deposits.
    All loans are subject to credit eligibility and the RBI Fair Practices Code.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 504e79a7-b354-5b39-9a30-9b5d11cbab3e
  title: Two-Wheeler Loan — interest rate annual explained
  body: '**What is the interest rate applicable to my Two-Wheeler Loan?**

    Your loan carries a fixed **annual interest rate of 12.9%**. This rate is used
    to calculate the interest component of your monthly repayments over the life of
    the loan.


    **How is the interest calculated and applied?**

    Interest is calculated on the reducing balance of your principal amount. This
    means as you pay off your loan over the **36 months** tenure, the interest is
    charged only on the remaining outstanding principal.


    **Can the interest rate change during my tenure?**

    As per our current product structure for the Two-Wheeler Loan, the rate is fixed
    for the duration of the loan. For more details on costs, you may refer to the
    Two-Wheeler Loan — fee schedule.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 7fd0f3bc-f0c3-5989-b58c-7803277221cb
  title: Two-Wheeler Loan — set up and activate
  body: 'If you are looking for a transparent and fast way to finance your new ride,
    follow these steps to set up your **Two-Wheeler Loan** with us.


    **Prerequisites**:

    * Valid KYC documents (Aadhaar, PAN).

    * Income proof (Salary slips/Bank statements).

    * The proforma invoice of the two-wheeler you intend to purchase.


    **Steps to Activate Your Loan**:

    1. **Application**: Provide us with your identity and income details. We will
    conduct a credit eligibility check based on your expressed needs.

    2. **Down Payment**: Arrange for a **down payment of 15%** of the vehicle''s appraised
    value. This amount is paid directly to the dealer or as instructed in your sanction
    letter.

    3. **KFS Review**: We will share a **Key Fact Statement (KFS)** with you. Review
    this document carefully as it lists the **annual interest rate of 12.9%**, the
    **processing fee of ₹1500**, and the total cost of credit.

    4. **Verification**: Complete the mandatory Multi-factor authentication (MFA)
    and KYC verification process. Please remember that we will never ask for your
    UPI PIN, OTP, or CVV.

    5. **Processing Fee Payment**: Pay the one-time **processing fee of ₹1500** to
    initiate the disbursement.

    6. **Disbursement**: Once verified, we will disburse the loan amount to the vehicle
    dealer. You will receive a confirmation notice once the fund transfer is complete.

    7. **Repayment Setup**: Set up your repayment mandate to ensure your monthly instalments
    are paid on time over the **36 months** tenure.


    Your loan is now active, and you can proceed to collect your vehicle from the
    dealership.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 73226448-2373-5bc9-b7f3-6c525c828be8
  title: Two-Wheeler Loan — fee schedule
  body: 'This schedule outlines the operational costs associated with the **Two-Wheeler
    Loan**. All fees are disclosed upfront to maintain our ''no hidden charges'' policy.


    * **Processing Fee**: ₹1500 (One-time fee charged at the time of loan sanction).

    * **Down Payment**: 15% of the vehicle value (Required upfront payment).

    * **EMI Bounce Charge**: Applicable as per the RBI harmonised framework if a repayment
    fails due to insufficient funds.

    * **Foreclosure Charge**: Applicable if the borrower chooses to pay off the remaining
    loan balance before the end of the **36 months** tenure.


    Fees are structured to cover risk management and operational costs. Waivers are
    granted only under exceptional, documented circumstances.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: c1794c25-057c-54c6-a736-f9b80dc03525
  title: Two-Wheeler Loan — a failed or pending action
  body: '**Symptom**: Your loan application is marked as ''Pending'' or the fund disbursement
    to the dealer has failed.


    **Likely Causes**:

    * **KYC Mismatch**: The details provided during application do not match the official
    documents.

    * **Down Payment Unverified**: The dealer has not confirmed receipt of the **15%
    down payment**.

    * **MFA Failure**: The Multi-factor authentication process was not completed successfully.

    * **Processing Fee Pending**: The **processing fee of ₹1500** has not been credited
    to our account.


    **Resolution Steps**:

    1. **Verify Payment**: Check your bank statement to ensure the **processing fee
    of ₹1500** and the **15% down payment** were successfully debited.

    2. **Re-verify KYC**: Ensure that the PAN and Aadhaar details provided are current
    and that the MFA was completed using the registered mobile number.

    3. **Confirm with Dealer**: Ask the dealer if they have received the payment confirmation
    from Kalash Finserv.


    **When to Escalate**:

    If the payments are successful and KYC is verified but the status remains ''Pending''
    for more than 2 business days, tell us to raise a formal investigation. We will
    then route the issue through our tiered support system. You will receive a ticket
    number and a resolution timeline following the RBI''s harmonised turn-around-time
    (TAT) framework.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: dfac103c-7243-5252-9523-2c0a30066e2d
  title: Two-Wheeler Loan — eligibility requirements
  body: 'The following matrix defines the requirements for securing a **Two-Wheeler
    Loan**. Eligibility is based on creditworthiness and the ability to meet the initial
    capital requirement.


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | **Down Payment** | Ability to pay **15%** of vehicle value | Mandatory for loan
    approval |

    | **Employment** | Salaried professional or emerged middle class | Eligible for
    application |

    | **Credit Score** | Meets internal credit eligibility thresholds | Loan sanctioned
    at **12.9%** annual interest |

    | **Documentation** | Valid KYC and Income Proof provided | Proceed to MFA and
    disbursement |

    | **Tenure Agreement** | Agreement to **36 months** repayment | Eligible for loan
    structure |


    Failure to meet the **15% down payment** threshold will result in the application
    being declined.'
