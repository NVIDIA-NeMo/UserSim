- id: 45c2b62b-bf92-546a-8be5-6545760c6b71
  title: Consumer Durable EMI — privacy and data handling
  body: 'This disclosure explains how Kalash Finserv handles your personal and financial
    data in relation to the **Consumer Durable EMI** product. We are committed to
    transparency and strict adherence to the RBI Digital Lending Guidelines.


    **Data Collection and Purpose**

    To process your application for a 0% interest loan over 9 months, we collect mandatory
    KYC information, including your PAN, Aadhaar, and employment details. This data
    is used solely for:

    * Verifying your identity and credit eligibility.

    * Sanctioning the loan and issuing the **Key Fact Statement (KFS)**.

    * Managing the **emi_repayment_mandate** to ensure timely collections.


    **Data Security**

    We employ **Multi-factor authentication (MFA)** to protect your account from unauthorised
    access. Your data is encrypted and stored in compliance with Indian data protection
    laws. We strictly prohibit our agents from asking for your UPI PIN, CVV, or OTPs.


    **Sharing of Information**

    We share your repayment data with Credit Information Companies (CICs) as required
    by regulatory mandates. Your data is never sold to third-party marketers. Any
    sharing for the purpose of loan recovery is conducted through non-coercive practices
    in line with the RBI Fair Practices Code.


    **Your Rights**

    As a customer, you have the right to request a copy of the data we hold about
    you. If you notice any discrepancy in your records, you may follow the process
    in Consumer Durable EMI — a discrepancy in your records or statement.


    **Fee Transparency**

    All costs, including the **processing fee of ₹499** and the **late payment charge
    of ₹350**, are disclosed upfront in the KFS to ensure there are no hidden charges
    in our relationship.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 749385cf-a48f-578b-818a-30038238450e
  title: Consumer Durable EMI — recognizing scams targeting this product
  body: 'At Kalash Finserv, we are committed to your financial safety. Because the
    Consumer Durable EMI is a popular choice for quick electronics upgrades, scammers
    often target customers with fraudulent offers. We urge you to remain vigilant
    against the following patterns:


    **Common Scam Indicators**

    - **The ''Pre-Approved'' Refund:** Scammers may contact you claiming you are eligible
    for a refund on your processing fee of ₹499, asking you to click a link or provide
    a UPI PIN to ''receive'' the money.

    - **Urgent Credit Limit Increases:** Be wary of messages claiming your EMI limit
    has been increased, but requiring an immediate ''verification fee'' to activate
    it.

    - **Fake Approval Agents:** Individuals posing as Kalash Finserv employees who
    promise to waive the late payment charge of ₹350 in exchange for your account
    OTP.


    **Our Security Commitment**

    To protect your assets, we adhere to strict RBI and NPCI security protocols. **We
    will never ask you for your UPI PIN, OTP, or CVV.** Any request for these details
    is a clear sign of fraudulent activity.


    **Mandatory Verification**

    We require Multi-factor authentication (MFA) and KYC verification before any state-changing
    action or fund disbursement. If an agent or a message asks you to bypass these
    steps, terminate the communication immediately.


    **What to do if you suspect fraud**

    If you encounter a suspicious request or notice unauthorised activity on your
    account, you must report it immediately through our official chargeback path.
    This allows us to initiate a formal investigation and secure your funds. Timely
    reporting is critical to mitigating your liability and ensuring a swift resolution.


    ***

    **Regulatory Disclaimer:** Kalash Finserv adheres to the RBI Fair Practices Code
    and Digital Lending Guidelines. We do not take deposits.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 0e373f04-f765-598c-adb2-37bcf632eafe
  title: Consumer Durable EMI — limits, restrictions, and edge cases
  body: 'This guide provides support agents with the necessary technical boundaries
    and restriction parameters for the Consumer Durable EMI product to ensure accurate
    customer communication.


    **Core Product Constraints**

    - **Fixed Tenure:** The product is strictly limited to a tenure of 9 months. No
    extensions or reductions of this duration are permitted once the loan is sanctioned.

    - **Interest Structure:** This is a 0% annual interest rate product. Agents must
    clearly communicate that while the interest is 0%, other operational fees apply.

    - **Processing Fee:** A non-refundable one-time processing fee of ₹499 is mandatory
    for all sanctions.


    **Operational Restrictions**

    - **Payment Defaults:** If a scheduled payment fails, a late payment charge of
    ₹350 is applied. This charge is automated and non-negotiable unless documented
    exceptional circumstances are approved by management.

    - **Collateral Nature:** Unlike the Gold Loan, this is unsecured credit for electronics
    and appliances; however, it is bound by strict credit eligibility checks.


    **Edge Cases and Handling**

    - **Early Settlement:** While the product is designed for a 9 month cycle, customers
    may inquire about early closure. Refer to the Key Fact Statement (KFS) for specific
    foreclosure terms.

    - **Mandate Failures:** If the automated payment engine fails to debit the EMI,
    the customer is immediately liable for the late payment charge of ₹350.

    - **KYC Blocks:** No fund disbursement will occur if the mandatory KYC verification
    or Multi-factor authentication (MFA) is incomplete.


    **Compliance Reminder**

    Always ensure the customer has received and understands the **Key Fact Statement
    (KFS)**, which discloses the all-in annualised cost of credit including the ₹499
    processing fee and any potential ₹350 late payment charges.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: a3148903-17ca-5f39-a6c8-c5f4b689b925
  title: Consumer Durable EMI — late payment charge explained
  body: '**What happens if I miss an EMI payment for my Consumer Durable EMI?**

    If your scheduled repayment is not received by the due date—typically due to insufficient
    funds in your linked bank account or a mandate issue—a **late payment charge of
    ₹350** will be levied on your account. This fee is structured to cover the operational
    risks associated with payment defaults.


    **Is there any way to avoid this charge?**

    We recommend ensuring your repayment account is sufficiently funded at least 24
    hours before the due date. While we maintain a ''no hidden charges'' policy, waivers
    for the ₹350 charge are granted only under exceptional, documented circumstances.


    **How is this different from other fees?**

    Unlike the one-time processing fee of ₹499 paid at the start, the late payment
    charge of ₹350 is a penalty fee triggered only by a payment failure. For a complete
    breakdown of all costs, please refer to the Consumer Durable EMI — overview.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: b2117319-4813-598d-b5a9-7d5d82880e2f
  title: Consumer Durable EMI — check status or history
  body: 'To maintain transparency and keep track of your repayments, we provide a
    clear path for you to review your loan status and transaction history.


    **Prerequisites**

    - Your registered mobile number for Multi-factor authentication (MFA).

    - Your loan account number (found on your Key Fact Statement).


    **Steps to Review Your Account**

    1. **Request Account Summary:** Tell us that you wish to check the current status
    of your Consumer Durable EMI. We will then trigger a Multi-factor authentication
    (MFA) request to your registered mobile number to verify your identity.

    2. **Confirm Identity:** Provide the OTP received on your mobile device. Once
    verified, we will retrieve your active loan details.

    3. **Review Repayment History:** Ask us for your payment history. We will provide
    a detailed list of all EMIs paid to date, including the date of debit and the
    amount.

    4. **Verify Outstanding Balance:** Request the current outstanding balance. We
    will confirm the remaining principal amount and the number of remaining months
    out of your total 9 month tenure.

    5. **Check for Charges:** Ask if any penalties have been applied. We will explicitly
    confirm if any late payment charges of ₹350 have been levied against your account.


    **How you know it worked**

    You will receive a clear confirmation of your remaining tenure (out of 9 months),
    a confirmation of your 0% interest rate, and a line-by-line history of your repayments
    and any applicable fees like the initial ₹499 processing fee.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4f59b0da-32fc-5c6a-bf24-eabe6eb1e2f8
  title: Consumer Durable EMI — a declined or blocked action
  body: 'If you have attempted to apply for or modify your Consumer Durable EMI and
    the action was declined or blocked, please follow this guide to identify the cause
    and resolve the issue.


    **Symptom**

    You receive a notification that your application is ''Declined'', ''Blocked'',
    or ''Pending Verification''.


    **Likely Causes**

    1. **KYC Incompletion:** The most common cause is a failure in the mandatory KYC
    verification process.

    2. **MFA Failure:** Multi-factor authentication (MFA) was not completed within
    the required timeframe.

    3. **Credit Eligibility:** The request does not meet our internal credit eligibility
    standards for the 9 month tenure.

    4. **Incorrect Documentation:** The documents provided do not match the registered
    details.


    **Resolution Steps**

    1. **Check Verification Status:** Ask us to verify if your KYC is marked as complete.
    If it is pending, provide the updated identity documents requested.

    2. **Retry Authentication:** If the block was due to an MFA timeout, request a
    new authentication trigger and ensure you enter the OTP immediately.

    3. **Review Eligibility:** Ask us to clarify if the decline is based on credit
    eligibility. We can then review your expressed needs and current credit standing.

    4. **Verify Details:** Confirm that the bank details for the repayment mandate
    are correct to ensure the 0% interest rate product can be sanctioned without risk.


    **When to Escalate**

    If you have provided all documents and completed MFA, but the action remains blocked,
    we will raise a formal case with our internal compliance team. You will receive
    a ticket number and a resolution update within the RBI''s harmonised turn-around-time
    (TAT) framework. For further unresolved grievances, your case will be routed to
    our designated Nodal Officer.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: fbbd9bfb-0b05-5851-90c5-1bc8ba5c1a47
  title: Consumer Durable EMI — when to switch or upgrade
  body: 'Understanding when to move from a Consumer Durable EMI to another credit
    product depends on your funding needs and the nature of your purchase.


    **Comparison: Consumer Durable EMI vs. Personal Loan**

    - **Cost:** Consumer Durable EMI offers a 0% annual interest rate, making it significantly
    cheaper than a Personal Loan for specific asset purchases. However, it has a fixed
    tenure of 9 months, whereas a Personal Loan offers a more flexible 60-month tenure.

    - **Purpose:** Consumer Durable EMI is restricted to electronics and appliances.
    If you require funding for diverse personal needs (travel, medical, weddings),
    you should switch to a Personal Loan.

    - **Upfront Cost:** Both products carry processing fees; however, the nature of
    the Personal Loan is unsecured funding rather than asset-linked financing.


    **Who should choose what?**

    - **Choose Consumer Durable EMI if:** You are buying a specific appliance, prefer
    0% interest, and can comfortably repay the amount within 9 months.

    - **Choose Personal Loan if:** You need a larger sum of money, require a longer
    repayment window (up to 60 months), or have needs that extend beyond consumer
    electronics.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 18af5b8b-d47e-5f3c-8349-01d26c76cba9
  title: Consumer Durable EMI — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right credit product is essential for long-term financial health.
    The Consumer Durable EMI is designed for specific, short-term asset acquisitions.


    **Product Value Proposition**

    Our Consumer Durable EMI provides interest-free short-term credit to make essential
    electronics and appliances affordable. Its primary advantage is an annual interest
    rate of 0%, ensuring you pay only for the product and the operational cost of
    the loan.


    **Key Cost Metrics**

    - **Annual Interest Rate:** 0%

    - **Tenure:** 9 months

    - **Processing Fee:** ₹499

    - **Late Payment Charge:** ₹350


    **When NOT to choose this product**

    While the 0% interest rate is attractive, this product is not suitable in the
    following scenarios:

    1. **Long-term Financing Needs:** If you cannot clear the balance within 9 months,
    the short tenure may put undue pressure on your monthly cash flow. In such cases,
    a product with a longer tenure (like our Personal Loan) is more sustainable.

    2. **Multi-purpose Funding:** This product is strictly for consumer durables.
    If you need liquidity for general expenses, this is not the appropriate tool.

    3. **Avoidance of All Upfront Fees:** If you are unwilling to pay a processing
    fee of ₹499, you may find this product unsuitable, as this fee is mandatory to
    cover operational costs.


    **Comparison with Alternatives**

    Compared to a standard Personal Loan, the Consumer Durable EMI removes the interest
    burden entirely but restricts the tenure and the usage of funds. Compared to a
    Gold Loan, it requires no collateral but is subject to stricter credit eligibility
    checks rather than Loan-to-Value (LTV) caps.


    ***

    **Regulatory Note:** All costs are disclosed upfront in the Key Fact Statement
    (KFS). Kalash Finserv adheres to the RBI Fair Practices Code.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: da812173-bbfb-513f-b067-3f4cb944ae1e
  title: Consumer Durable EMI — cost and charges
  body: '**What are the total costs associated with the Consumer Durable EMI?**

    The primary cost is a one-time **processing fee of ₹499**, which is charged at
    the time of loan sanction. Because the **annual interest rate is 0%**, you do
    not pay any interest over the 9 month tenure.


    **Are there any other possible charges?**

    Yes, if a repayment is missed or delayed, a **late payment charge of ₹350** is
    applied to your account. We maintain a strict ''no hidden charges'' policy, and
    all these figures are clearly stated in your Key Fact Statement (KFS).


    **Can I get the processing fee waived?**

    Fees are structured to ensure the sustainability of our lending pool. Therefore,
    the ₹499 processing fee is standard, and waivers are granted only under exceptional,
    documented circumstances.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: faq
  source_authority: official
