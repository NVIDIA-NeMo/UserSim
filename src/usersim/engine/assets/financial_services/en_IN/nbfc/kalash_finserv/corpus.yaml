- id: 2c7b7432-448d-5a3f-b65a-f265c61c86c8
  title: EMI Repayment Mandate — privacy and data handling
  body: 'At Kalash Finserv, we handle your payment data with the highest standards
    of confidentiality and in strict accordance with the RBI''s Digital Lending Guidelines.


    **Data Collection and Purpose**

    To operate the **EMI Repayment Mandate**, we collect and process specific data,
    including your bank account number, IFSC code, and mandate authorization tokens.
    This data is used exclusively for the purpose of facilitating the automated recovery
    of your loan instalments.


    **Data Security and MFA**

    We employ bank-grade encryption to protect your financial identifiers. Multi-factor
    authentication (MFA) is mandatory before any state-changing action, such as updating
    your linked bank account. We strictly prohibit our agents from asking for your
    UPI PIN, OTPs, or CVVs; any such request is a violation of our security policy.


    **Third-Party Sharing**

    Your data is shared only with the necessary payment aggregators and your sponsoring
    bank to execute the NACH/e-mandate process. We do not sell your repayment data
    to third-party marketing agencies.


    **Customer Rights and Transparency**

    We maintain a ''no hidden charges'' policy. All fees associated with the mandate,
    specifically the **EMI Bounce Charge** of ₹500, are disclosed upfront in your
    **Key Fact Statement (KFS)**. You have the right to request a copy of the data
    we hold regarding your mandate authorizations.


    **Handling of Disputes**

    In case of any discrepancy or unauthorised debit, complaints are handled via our
    customer-first philosophy, following the RBI''s harmonised turn-around-time (TAT)
    framework. Fraudulent activity must be reported immediately through the official
    chargeback path to initiate a formal investigation.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: d590c230-f8c8-594b-801c-02b0944e0298
  title: EMI Repayment Mandate — recognizing scams targeting this product
  body: "At Kalash Finserv, we prioritise the security of your repayments. As you\
    \ compare our automated systems with other payment methods, please be aware of\
    \ specific scams targeting the <b>EMI Repayment Mandate</b> process. \n\nFraudsters\
    \ often impersonate our representatives, claiming there is an 'issue' with your\
    \ mandate or a 'pending failure' that requires immediate rectification to avoid\
    \ a <b>bounce charge of ₹500</b>. They may attempt to trick you into 're-verifying'\
    \ your account by asking for sensitive credentials.\n\n<b>What we will NEVER ask\
    \ for:</b>\nTo remain compliant with RBI and NPCI security protocols, our agents\
    \ will never ask you for your <b>UPI PIN, OTPs, or CVVs</b>. Any request for these\
    \ details is a definitive sign of a scam.\n\n<b>Common Red Flags:</b>\n- Urgent\
    \ threats of legal action if a mandate isn't 'updated' via a provided external\
    \ link.\n- Requests to transfer funds to a personal account to 'clear' a failed\
    \ EMI.\n- Pressure to share a screen via third-party apps to 'assist' with mandate\
    \ setup.\n\n<b>Immediate Action Plan:</b>\nIf you encounter any suspicious activity\
    \ or believe your mandate details have been compromised, you must report the incident\
    \ immediately through our official chargeback path. This allows us to initiate\
    \ a formal investigation and secure your funds.\n\nRemember, we use <b>Multi-factor\
    \ authentication (MFA)</b> and mandatory KYC verification before any state-changing\
    \ action occurs on your account. If a communication does not align with these\
    \ secure practices, do not engage."
  domain: payments
  product_category: emi_repayment_mandate
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 55e2f96a-dcb6-55a7-ad9a-7d5876397b6a
  title: EMI Repayment Mandate — limits, restrictions, and edge cases
  body: 'This guide provides support agents with the necessary technical boundaries
    and restrictions governing the <b>EMI Repayment Mandate</b> to ensure accurate
    customer assistance.


    <b>Operational Limits and Timelines</b>

    - <b>Pre-Debit Notifications:</b> We provide a mandatory notification to the customer
    <b>24 hours</b> before the scheduled debit occurs. If a customer claims they were
    not notified, verify if their contact details are current.

    - <b>Amendment Window:</b> Any request to amend an existing mandate (such as changing
    the bank account) requires a processing period of <b>3 days</b>. Changes requested
    within this window may not apply to the immediate next EMI cycle.


    <b>Financial Restrictions</b>

    - <b>Failure Penalties:</b> If a scheduled repayment fails due to insufficient
    funds or mandate issues (such as a blocked account), an <b>EMI Bounce Charge of
    ₹500</b> is levied. This fee is non-negotiable except under exceptional, documented
    circumstances as per our fee philosophy.

    - <b>Mandate Scope:</b> The mandate is strictly tied to the loan''s Equated Monthly
    Instalment. It cannot be used for arbitrary transfers or non-loan related debits.


    <b>Edge Cases for Agent Handling</b>

    - <b>Account Closure:</b> If a customer closes the bank account linked to the
    mandate without notifying us, the resulting failure will trigger the <b>₹500</b>
    charge. Agents should guide the customer to update their mandate immediately to
    avoid recurring penalties.

    - <b>Partial Funds:</b> Our automated engine cannot perform ''partial debits''.
    If the account balance is less than the full EMI amount, the mandate will fail,
    and the <b>EMI Bounce Charge of ₹500</b> will be applied.


    For a broader overview of how this product fits into our payments domain, refer
    to EMI Repayment Mandate — overview.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 499bd068-0c7a-5084-ae6c-4f8665f440a6
  title: EMI Repayment Mandate — cost and charges
  body: '<b>Are there any fees for setting up an EMI Repayment Mandate?</b>

    Setting up the mandate is part of our commitment to a ''no hidden charges'' policy.
    We do not charge a setup fee for the automated payment engine.


    <b>What happens if my bank account has insufficient funds on the EMI date?</b>

    If a scheduled repayment fails due to insufficient funds or mandate-related issues,
    a penalty known as an <b>EMI Bounce Charge of ₹500</b> will be levied on your
    account.


    <b>Can the EMI Bounce Charge be waived?</b>

    Fees are structured to cover our operational costs and risk management. Consequently,
    waivers for the <b>₹500</b> bounce charge are granted only under exceptional and
    documented circumstances.


    For more details on other potential loan costs, please refer to the Key Fact Statement
    (KFS) provided during your loan sanction.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: db6f0cc8-52f6-5daa-808e-1b5d2e595f53
  title: EMI Repayment Mandate — check status or history
  body: 'As an existing customer, you can easily track your automated repayments and
    verify the status of your mandate to ensure your credit health remains strong.


    <b>Prerequisites</b>

    - Your registered mobile number or customer ID.

    - A valid identity verification (via MFA) to access your records.


    <b>Steps to Check Status and History</b>

    1. <b>Request Mandate Status:</b> Ask us for the current status of your <b>EMI
    Repayment Mandate</b>. We will confirm if the mandate is ''Active'', ''Pending'',
    or ''Expired''.

    2. <b>Verify Linked Account:</b> Ask us to confirm the last four digits of the
    bank account currently linked to the mandate to ensure payments are being drawn
    from the correct source.

    3. <b>Request Repayment History:</b> Ask for your repayment history for the current
    financial year. We will provide a list of all successful debits and any failed
    attempts.

    4. <b>Review Bounce Instances:</b> If you notice any gaps in your history, ask
    us to check for any <b>EMI Bounce Charges of ₹500</b> that may have been applied
    due to insufficient funds.

    5. <b>Confirm Next Debit:</b> Ask us for the date and amount of your next scheduled
    debit. We will confirm this and remind you that you will receive a notification
    <b>24 hours</b> prior to the transaction.


    <b>How you know it worked</b>

    You will receive a clear summary of your mandate''s current state, a confirmation
    of your linked bank account, and a detailed list of past transactions including
    any penalties incurred.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 6bd1c54a-c77d-5d7f-aacc-a07dccdd34ab
  title: EMI Repayment Mandate — a declined or blocked action
  body: 'If you are attempting to set up or amend your <b>EMI Repayment Mandate</b>
    and the action is declined or blocked, please follow this guide to resolve the
    issue.


    <b>Symptom:</b> You receive a notification that your mandate request has been
    ''Declined'' or ''Blocked by Bank''.


    <b>Likely Causes:</b>

    - <b>KYC Mismatch:</b> The name on your Kalash Finserv account does not exactly
    match the name on the bank account provided.

    - <b>Unsupported Account Type:</b> Certain restrictive account types (e.g., some
    basic savings accounts or dormant accounts) may not support automated mandates.

    - <b>MFA Failure:</b> The Multi-factor authentication process was not completed
    successfully.

    - <b>Bank-side Block:</b> Your bank may have blocked the mandate request due to
    their own internal security filters.


    <b>What to check (in order):</b>

    1. <b>Verify Account Details:</b> Double-check that the account number and IFSC
    code provided are correct.

    2. <b>Check Account Status:</b> Ensure the bank account is active and has a sufficient
    balance to handle a small verification debit if required.

    3. <b>Confirm KYC:</b> Ensure your KYC documents submitted to us match the records
    at your bank.


    <b>The Fix:</b>

    - If it is a detail error, provide us with the corrected bank details. We will
    restart the mandate process.

    - If the account is blocked by the bank, contact your bank''s branch manager to
    ''whitelist'' Kalash Finserv for automated debits.


    <b>When to escalate:</b>

    If the bank confirms the account is eligible but the mandate still fails, we will
    raise a formal technical ticket with our banking partner. You will receive a tracking
    number and a resolution update within 3 working days.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9e79d805-1cb3-5581-a6a2-80dbd9e754b9
  title: EMI Repayment Mandate — when to switch or upgrade
  body: 'This guide helps agents advise customers on whether to continue with their
    current <b>EMI Repayment Mandate</b> or switch to a different repayment arrangement.


    <b>Current State: EMI Repayment Mandate</b>

    - <b>Mechanism:</b> Fully automated debit from a linked bank account.

    - <b>Benefit:</b> No need to remember dates; prevents accidental defaults.

    - <b>Risk:</b> Incurring a <b>bounce charge of ₹500</b> if the account is underfunded.

    - <b>Notification:</b> Standard <b>24 hours</b> pre-debit alert.


    <b>When to advise a switch or update:</b>

    - <b>Account Changes:</b> If the customer has closed their primary salary account,
    they must switch the mandate to a new account. Note that mandate amendment processing
    takes <b>3 days</b>.

    - <b>Frequent Bounces:</b> If a customer consistently incurs the <b>₹500</b> charge
    due to timing mismatches with their salary, suggest they update the mandate to
    an account with a higher average balance.

    - <b>Full Foreclosure:</b> If the customer intends to pay off the loan entirely,
    the mandate should be cancelled following the loan closure process.


    <b>Recommendation:</b>

    Stay with the automated mandate for maximum convenience and credit score protection.
    Switch only when the linked funding source is no longer viable.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: be8045c6-06da-582a-8346-f3019649327c
  title: EMI Repayment Mandate — comparison vs. alternatives and when not to choose
    it
  body: 'When choosing how to manage your loan repayments, it is important to understand
    how the <b>EMI Repayment Mandate</b> compares to manual payment methods.


    <b>EMI Repayment Mandate (Automated)</b>

    - <b>How it works:</b> We automatically withdraw the EMI from your designated
    bank account on the scheduled date.

    - <b>Key Advantage:</b> Speed and reliability. You don''t have to manually initiate
    a transfer every month, reducing the risk of forgetting a payment.

    - <b>Transparency:</b> We provide a clear notification <b>24 hours</b> before
    the debit occurs.

    - <b>Cost of Failure:</b> If the payment fails due to insufficient funds, an <b>EMI
    Bounce Charge of ₹500</b> is applied.


    <b>Manual Repayments (Alternative)</b>

    - <b>How it works:</b> You manually transfer the EMI amount via UPI, NetBanking,
    or Cheque each month.

    - <b>Key Advantage:</b> Total control over the exact moment the funds leave your
    account.

    - <b>Trade-off:</b> Higher risk of human error or forgetfulness, which can lead
    to late payment penalties and negatively impact your credit score.


    <b>When NOT to choose the EMI Repayment Mandate:</b>

    - <b>Irregular Income:</b> If your income arrives on unpredictable dates and you
    cannot maintain a minimum balance, the risk of triggering the <b>₹500</b> bounce
    charge may be too high.

    - <b>Strict Account Controls:</b> If you use a bank account with very restrictive
    debit rules that frequently block automated mandates.


    <b>Summary:</b>

    For most salaried professionals, the <b>EMI Repayment Mandate</b> is the superior
    choice for maintaining a healthy credit history. We recommend it for those who
    prefer a ''set and forget'' approach to their financial obligations.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 5cca0c3f-3541-57fe-bcf1-b73fc13b8f3c
  title: EMI Repayment Mandate — eligibility and setup
  body: '<b>Who is eligible to set up an EMI Repayment Mandate?</b>

    Any customer with an active loan at Kalash Finserv who possesses a valid savings
    or current account in an RBI-regulated bank in India is eligible.


    <b>What documents are required for the setup?</b>

    To set up the mandate, we require your bank account number, the correct IFSC code,
    and a successful KYC verification. MFA (Multi-factor authentication) is mandatory
    to authorise the mandate.


    <b>How long does it take for the mandate to become active?</b>

    While the initial setup is fast, please note that any subsequent amendments to
    your mandate (such as changing the linked account) require <b>3 days</b> for processing.


    <b>Will I know when the money is being debited?</b>

    Yes, we ensure transparency by sending a pre-debit notification <b>24 hours</b>
    before the scheduled repayment is processed.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
