- id: 77783e76-4d72-5081-bba7-d9448eb79582
  title: Gold Loan — loan to value cap explained
  body: '**What is the Loan-to-Value (LTV) cap for my Gold Loan?**

    We maintain a strict **Loan-to-Value (LTV)** cap of 75%. This means the maximum
    amount we can lend you is 75% of the current appraised market value of the gold
    assets you provide as collateral.


    **Why is there a limit on how much I can borrow against my gold?**

    The 75% cap is a risk management measure that protects both the borrower and our
    lending pool. Gold prices can fluctuate; by limiting the loan to 75% of the value,
    we reduce the likelihood of the loan exceeding the collateral value, which helps
    in maintaining a sustainable lending environment.


    **How does the LTV affect my loan amount?**

    If your gold is appraised at ₹1,00,000, the maximum loan amount you can receive
    is ₹75,000. For more details on the costs associated with this limit, please refer
    to Gold Loan — overview.'
