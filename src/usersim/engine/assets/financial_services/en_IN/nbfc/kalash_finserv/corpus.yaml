- id: c083599f-d965-5e7e-bc56-2569ae44459c
  title: Gold Loan — vs. a typical competitor offering
  body: 'When comparing the Kalash Finserv Gold Loan with typical competitor offerings
    in the NBFC sector, the primary differences lie in transparency and cost structure.


    **Comparison Dimensions**

    * **Cost of Credit**: We offer a competitive annual interest rate of **11.5%**.
    While some competitors may quote lower ''teaser'' rates, they often include hidden
    administrative charges. We maintain a ''no hidden charges'' policy.

    * **Loan Access**: Our **Loan-to-Value (LTV)** is capped at **75%**, which is
    aligned with regulatory prudence to protect the customer from over-leveraging.
    Competitors may offer slightly higher LTVs but often accompany them with significantly
    higher interest rates.

    * **Upfront Costs**: We charge a transparent, one-time processing fee of **₹500**.
    Competitors may use percentage-based fees that increase as your loan amount grows.

    * **Speed and Process**: We leverage a digitally-forward approach for faster sanctions
    compared to traditional gold loan providers.


    **Which one suits you?**

    * **Kalash Finserv Gold Loan**: Best for the salaried professional or middle-class
    borrower who values a fixed **12 months** tenure, transparent pricing via a **Key
    Fact Statement (KFS)**, and secure collateral custody.

    * **Typical Competitors**: May be preferable for those who require an LTV higher
    than **75%** and are willing to accept higher interest rates or less transparent
    fee structures to achieve it.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: c6fa0f0c-6e87-5b99-87ec-217640ec3701
  title: Gold Loan — risk disclosures
  body: 'Please read the following risk disclosures carefully before entering into
    a Gold Loan agreement with Kalash Finserv.


    **Collateral Risk**

    Your gold assets serve as the primary security for the loan. In the event of a
    sustained default in repayment of the principal or the **11.5%** annual interest,
    Kalash Finserv reserves the right to auction the collateral to recover the outstanding
    dues. This process is conducted in strict adherence to the RBI Fair Practices
    Code and non-coercive collection guidelines.


    **LTV and Market Volatility**

    The loan amount is provided up to a **Loan-to-Value (LTV) of 75%** based on the
    gold price at the time of appraisal. Because gold prices fluctuate daily, a drop
    in market value may result in your LTV exceeding the regulatory cap. In such cases,
    we may request additional collateral or a partial repayment to bring the loan
    back within the **75%** limit.


    **Cost of Credit**

    All costs, including the **₹500** processing fee and any potential **Foreclosure
    Charges**, are disclosed in the **Key Fact Statement (KFS)**. We emphasize that
    the all-in annualised cost of credit is the true measure of the loan''s expense.


    **Repayment Risk**

    Failure to ensure sufficient funds for repayments will result in an **EMI Bounce
    Charge**. We recommend setting up a robust repayment mandate to avoid these penalties
    and protect your credit score.


    ***

    **Regulatory Disclaimer**: Kalash Finserv is an NBFC and does not take deposits.
    We provide financial education but not individualized legal or investment advice.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 70ca199a-172a-5b25-a6ec-15048e190f83
  title: Gold Loan — how rates are tiered and applied
  body: 'At Kalash Finserv, we believe in simplicity and transparency. Unlike complex
    tiered structures, our Gold Loan operates on a single, flat rate apply to all
    eligible borrowers.


    **Applicable Interest Rate**

    A flat annual interest rate of **11.5%** is applied to all Gold Loans, regardless
    of the loan amount (provided it meets the minimum requirement of **₹25,000**).


    **Application and Calculation**

    * **Rate Type**: Fixed Annual Rate.

    * **Basis**: The **11.5%** rate is quoted against the principal amount sanctioned.

    * **Accrual**: Interest accrues daily based on the outstanding principal over
    the **12 months** tenure.


    **Factors that May Change the Cost of Credit**

    While the base interest rate is flat, the ''all-in cost'' may be affected by:

    1. **Processing Fee**: A one-time fee of **₹500** applied at sanction.

    2. **Payment Discipline**: Any **EMI Bounce Charge** incurred due to failed repayments
    will increase the total amount payable.

    3. **Early Closure**: Paying off the loan before the **12 months** tenure may
    trigger a **Foreclosure Charge**.


    All final costs are documented in the **Key Fact Statement (KFS)**.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
