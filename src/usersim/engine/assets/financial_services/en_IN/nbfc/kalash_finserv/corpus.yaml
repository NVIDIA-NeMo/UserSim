- id: cd670a25-8786-59f0-888d-35df8a62ff7e
  title: EMI Repayment Mandate — vs. a similar product here
  body: 'Customers often compare the **EMI Repayment Mandate** (automated debit) against
    manual repayments (paying via a payment link or app each month).


    | Feature | EMI Repayment Mandate | Manual Repayments |

    | :--- | :--- | :--- |

    | **Convenience** | Fully automated; no monthly action required | Requires manual
    action every month |

    | **Payment Security** | Secure, bank-authorised mandate | Manual entry of payment
    details each time |

    | **Risk of Default** | Low (provided funds are available) | Higher risk of forgetting
    the due date |

    | **Failure Cost** | **₹500** EMI Bounce Charge if funds are low | Late payment
    fees as per loan agreement |

    | **Notification** | Pre-debit alert **24 hours** before | Reminder alerts based
    on due date |


    **Who it suits:**

    - **EMI Repayment Mandate** is best for salaried professionals and middle-class
    customers who prefer a ''set and forget'' system to ensure their credit score
    remains untarnished.

    - **Manual Repayments** may suit those with highly irregular income streams who
    prefer total control over the exact day of disbursement, though they must be diligent
    about deadlines.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 40f4174f-8f9d-5af2-a431-5e95562b5079
  title: EMI Repayment Mandate — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the **EMI
    Repayment Mandate** administered by Kalash Finserv. We adhere strictly to the
    RBI Fair Practices Code and the Digital Lending Guidelines.


    **Mandate Authorization and Execution:**

    By activating this mandate, you provide an irrevocable authorization to Kalash
    Finserv to debit your specified bank account for the loan repayments as outlined
    in your repayment schedule. All such debits are governed by the National Automated
    Clearing House (NACH) or e-Mandate guidelines.


    **Fee Disclosure:**

    We maintain a ''no hidden charges'' policy. Any failure in the automated debit
    process due to insufficient funds, account freezes, or mandate cancellations will
    result in an **EMI Bounce Charge of ₹500**. This fee is applied to cover the operational
    risk and cost of managing failed credit recovery.


    **Timelines and Amendments:**

    Any request to amend the bank account linked to your mandate is subject to verification
    and will be processed within **3 days**. We provide a pre-debit notification **24
    hours** before the fund transfer to ensure transparency.


    **Security Protocols:**

    In accordance with RBI and NPCI security protocols, Kalash Finserv employs Multi-Factor
    Authentication (MFA) for mandate setup. Our agents are strictly prohibited from
    requesting your UPI PIN, OTP, or CVV. Any such request should be reported immediately.


    **Regulatory Standard of Care:**

    Kalash Finserv provides financial product information but does not offer individualized
    tax, legal, or investment advice. We mandate the provision of a **Key Fact Statement
    (KFS)** to all borrowers, disclosing the all-in annualised cost of credit, including
    interest, processing fees, and foreclosure charges, ensuring you are fully aware
    of your obligations before the loan is sanctioned.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 86f43cc8-63fa-5e25-a968-d67155c131a7
  title: EMI Repayment Mandate — interest rate / APY schedule
  body: 'The **EMI Repayment Mandate** is a payment facilitation service and not a
    credit or investment product; therefore, it does not carry an interest rate, annual
    percentage yield (APY), or a cost of carry.


    There is no interest charged for using the automated payment engine. All interest
    rates associated with your loan are separate from the mandate itself and are detailed
    in your specific loan agreement and the **Key Fact Statement (KFS)**.


    While the mandate service is free to use, please be aware that failure to maintain
    sufficient funds in your account to honour the mandate will result in an **EMI
    Bounce Charge of ₹500**. This is a penalty fee and not an interest charge. For
    information on the interest rates applied to your actual loan, please refer to
    the rate sheet of your specific loan product, such as Personal Loan — interest
    rate / APY schedule.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: rate_sheet
  source_authority: official
