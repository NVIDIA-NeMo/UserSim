- id: 29d043db-e4c4-58d0-9d2b-467c86f742d4
  title: EMI Repayment Mandate — fraud and unauthorized-activity protection
  body: "At Kalash Finserv, we prioritize the security of your repayments. The **EMI\
    \ Repayment Mandate** is designed to automate your credit obligations, but this\
    \ convenience can be targeted by fraudsters. \n\n**Common Fraud Patterns**\nBe\
    \ vigilant against 'mandate verification' scams. Fraudsters may contact you claiming\
    \ there is an issue with your automated repayment and ask you to 're-verify' your\
    \ account by providing sensitive codes. They may use urgency, claiming that failure\
    \ to do so will result in immediate legal action or a massive penalty beyond the\
    \ standard **EMI Bounce Charge** of ₹500.\n\n**Our Security Promise**\nTo protect\
    \ your funds, we adhere to strict RBI and NPCI security protocols. We will **never**\
    \ ask you for the following via phone, SMS, or email:\n* Your UPI PIN\n* One-Time\
    \ Passwords (OTPs)\n* Your Debit/Credit Card CVV\n\n**What to do if you suspect\
    \ fraud**\nIf you notice an unauthorized change to your mandate or receive a suspicious\
    \ request for your PIN or OTP, you must report it immediately. Please follow the\
    \ official chargeback path to initiate a formal investigation. Prompt reporting\
    \ is essential to protect your liability and ensure a swift resolution under our\
    \ 'customer-first' philosophy.\n\nWe recommend monitoring your bank statements\
    \ for any unexpected debits. While we provide a pre-debit notification **24 hours**\
    \ before the funds are withdrawn to help you maintain sufficient balances, any\
    \ transaction that looks unfamiliar should be reported to us instantly."
  domain: payments
  product_category: emi_repayment_mandate
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 54965e97-a106-5108-9865-6306cbd3ee1f
  title: EMI Repayment Mandate — account agreement
  body: "This agreement governs the use of the **EMI Repayment Mandate** for the automated\
    \ collection of loan repayments at Kalash Finserv.\n\n**1. Obligations of the\
    \ Customer**\n The customer agrees to maintain sufficient funds in the linked\
    \ bank account to cover the scheduled Equated Monthly Instalment (EMI). We will\
    \ provide a notification **24 hours** prior to the debit attempt to facilitate\
    \ this.\n\n**2. Failed Repayments**\nIf a scheduled repayment fails due to insufficient\
    \ funds or mandate issues, a penalty known as an **EMI Bounce Charge** of ₹500\
    \ will be levied for each failure. This charge covers the operational costs and\
    \ risk management associated with payment failures.\n\n**3. Amendments to the\
    \ Mandate**\nAny request to change the bank account linked to the repayment mandate\
    \ is subject to a processing period. All mandate amendments require **3 days**\
    \ for processing before they become effective. Repayments scheduled during this\
    \ window must be managed via the previous mandate or alternative approved methods.\n\
    \n**4. Termination and Closure**\nThis agreement terminates upon the full repayment\
    \ of the underlying loan or the successful migration to a new repayment method.\
    \ Closure of the mandate without a valid replacement may lead to loan delinquency.\n\
    \n**5. General Provisions**\nWe reserve the right to modify these terms in accordance\
    \ with RBI's Fair Practices Code. All fees, including the ₹500 bounce charge,\
    \ are disclosed upfront in the **Key Fact Statement (KFS)** provided at the time\
    \ of loan sanction."
  domain: payments
  product_category: emi_repayment_mandate
  document_type: terms_conditions
  source_authority: official
