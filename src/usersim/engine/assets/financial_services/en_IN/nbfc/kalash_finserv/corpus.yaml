- id: 5dd0456c-c03f-5890-9eb9-ed8e5291a761
  title: Consumer Durable EMI — set up and activate
  body: "If you are comparing financing options, the Consumer Durable EMI is our most\
    \ efficient path to acquiring electronics with 0% interest. Here is how we set\
    \ up and activate your credit line:\n\n1. **Submit Application Details:** Provide\
    \ us with the details of the durable asset you wish to purchase and your basic\
    \ professional information. \n2. **KYC Verification:** Complete the mandatory\
    \ KYC process. We will verify your identity and address using government-approved\
    \ documents to ensure compliance with RBI Digital Lending Guidelines.\n3. **Review\
    \ the Key Fact Statement (KFS):** We will share a **Key Fact Statement (KFS)**\
    \ with you. Review this carefully as it discloses the all-in cost, including the\
    \ ₹499 processing fee and the 0% annual interest rate.\n4. **Authentication:**\
    \ Perform the required Multi-factor authentication (MFA). This is a mandatory\
    \ security step before any funds are disbursed.\n5. **Mandate Setup:** Confirm\
    \ the setup of your automated repayment engine. This ensures your monthly instalments\
    \ are paid on time and helps you avoid the ₹350 late payment charge.\n6. **Confirmation\
    \ of Activation:** Once the mandate is active and MFA is complete, we will notify\
    \ you that the loan is sanctioned and the funds have been disbursed to the merchant.\n\
    \nYour account is now active. You can track your remaining balance and upcoming\
    \ payments through your statement. For more on managing payments, see EMI Repayment\
