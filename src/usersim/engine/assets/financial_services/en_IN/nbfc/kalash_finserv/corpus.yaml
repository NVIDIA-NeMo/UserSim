- id: 24a58808-c2bc-56d5-bb94-92b3370d2f92
  title: Two-Wheeler Loan — privacy and data handling
  body: 'This disclosure outlines how Kalash Finserv handles the personal and financial
    data of customers using the **Two-Wheeler Loan** product. We adhere strictly to
    the RBI Fair Practices Code and Digital Lending Guidelines.


    **Data Collection and Usage**

    To process your loan application and manage your account, we collect identity
    proof, income documents, and credit history. This data is used solely for:

    * Determining credit eligibility for the annual interest rate of 12.9%.

    * Verifying the 15% down payment contribution.

    * Managing the 36-month repayment schedule.


    **Security Measures**

    We implement Multi-factor authentication (MFA) and mandatory KYC verification
    for all state-changing actions. Your data is encrypted in transit and at rest.
    We strictly prohibit our agents from requesting your UPI PIN, OTP, or CVV.


    **Third-Party Sharing**

    We share your data only with:

    * Credit Bureaus (for reporting repayment history).

    * Authorized KYC verification agencies.

    * The vehicle dealership (for disbursement of the loan amount).


    **Customer Rights**

    You have the right to request a copy of the data we hold about you and to update
    any inaccuracies. All comprehensive costs, including the ₹1500 processing fee,
    are disclosed upfront in the **Key Fact Statement (KFS)** to ensure complete transparency.


    **Regulatory Compliance**

    Kalash Finserv is a non-banking financial company (NBFC) and does not accept deposits.
    All collection practices are non-coercive, and we operate within the legal frameworks
    mandated by the RBI.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: disclosure
  source_authority: official
