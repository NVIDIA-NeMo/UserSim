  title: Consumer Durable EMI — choosing between tiers or options
  body: "When deciding how to finance your electronics, it is important to compare\
    \ the **Consumer Durable EMI** with other credit options. \n\n**Consumer Durable\
    \ EMI**\n* **Cost**: **annual interest rate of 0%** with a one-time **processing\
    \ fee of ₹499**.\n* **Tenure**: Fixed at 9 months.\n* **Penalty**: **late payment\
    \ charge of ₹350** for missed EMIs.\n* **Best For**: Customers who want to split\
    \ the cost of a specific appliance without paying interest and can commit to a\
    \ 9-month repayment window.\n\n**Personal Loan**\n* **Structure**: Generally offers\
    \ longer tenures (up to 60 months) and carries an annual interest rate (refer\
    \ to Personal Loan — overview for current rates).\n* **Flexibility**: Funds are\
    \ unsecured and can be used for any purpose, whereas our EMI product is for specific\
    \ durables.\n* **Best For**: Customers needing larger sums of money or more extended\
    \ repayment periods.\n\nIf you are looking for immediate liquidity against assets\
    \ rather than a purchase plan, you may also consider the Gold Loan — overview."
