- id: c69ddf54-7aa4-5869-9885-6948b3701378
  title: Two-Wheeler Loan — account security best practices
  body: 'At Kalash Finserv, your financial security is our priority. As an existing
    **Two-Wheeler Loan** customer, it is essential to maintain strict hygiene regarding
    your account access and personal data.


    **Critical Security Protocols**

    We employ Multi-factor authentication (MFA) for all state-changing actions. To
    protect your account, please remember that we will **never** ask you for the following
    via phone, SMS, or email:

    * Your UPI PIN

    * Your OTP (One-Time Password)

    * Your Debit/Credit Card CVV


    **Common Fraud Patterns**

    Be wary of ''loan top-up'' or ''interest reduction'' scams where fraudsters pose
    as Kalash Finserv agents. They may claim that by paying a small ''processing charge''
    via a UPI link, they can reduce your annual interest rate of 12.9%. We do not
    operate via unsolicited UPI links for fee collection.


    **Immediate Action for Fraud**

    If you notice any unauthorised transaction or receive a suspicious request for
    your credentials, you must report it immediately through our official chargeback
    path. This allows us to initiate a formal investigation and secure your funds.


    **Maintaining Your Account**

    Ensure that the mobile number and email address linked to your loan are current.
    We use these channels to send your **Key Fact Statement (KFS)** and repayment
    reminders. If you suspect your account has been compromised, inform us immediately
    so we can freeze further disbursements or changes to your repayment mandate.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 3d55c10a-36aa-5c2d-aa95-70ac780fb94b
  title: Two-Wheeler Loan — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms of
    your **Two-Wheeler Loan**. By entering into this agreement, you acknowledge the
    following binding conditions:


    **1. Interest Rate and Fees**

    The loan is sanctioned at an annual interest rate of 12.9%. This rate is subject
    to change in accordance with RBI guidelines and the institution''s risk management
    framework. Any change in the interest rate will be communicated to you with a
    minimum notice period of 30 days.


    **2. Repayment and Tenure**

    The agreed tenure for the loan is 36 months. Any request to extend or shorten
    this tenure must be documented and may be subject to a revised credit assessment.
    A one-time **processing fee** of ₹1500 is charged at the time of sanction and
    is non-refundable.


    **3. Down Payment Obligation**\The borrower is obligated to provide a down payment
    of 15% of the vehicle cost before the loan amount is disbursed. Failure to provide
    this amount will result in the cancellation of the loan sanction.


    **4. Modification of Terms**\Kalash Finserv reserves the right to amend the terms
    of service. Such changes will be provided in writing. Continued repayment of the
    loan after the notice period constitutes acceptance of the new terms.


    **5. Termination and Foreclosure**\The agreement ends upon the full repayment
    of the principal and accrued interest. If you choose to pay off the balance before
    the end of the 36 months, a **Foreclosure Charge** may apply as detailed in your
    **Key Fact Statement (KFS)**.


    **6. Default and Penalties**\Failure to maintain sufficient funds for the monthly
    repayment will trigger an **EMI Bounce Charge**, as per our institutional fee
    policy.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4bc6600f-3994-5475-8b14-01d67604b17f
  title: Two-Wheeler Loan — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in the onboarding
    process for a **Two-Wheeler Loan**. Our goal is to ensure a speed-of-sanction
    advantage while maintaining full transparency.


    **Step 1: Initial Eligibility Check**\Confirm the customer''s identity and credit
    eligibility. Inform the customer that they will be required to make a down payment
    of 15% of the vehicle''s cost. This is a mandatory requirement for mobility financing.


    **Step 2: Product Disclosure**\Before the sanction, provide the customer with
    the **Key Fact Statement (KFS)**. You must clearly explain the all-in cost of
    credit, which includes:

    * An annual interest rate of 12.9%

    * A one-time **processing fee** of ₹1500

    * The total tenure of 36 months


    **Step 3: Verification and KYC**\Execute mandatory KYC verification. Ensure that
    Multi-factor authentication (MFA) is set up for the customer''s account. Remind
    the customer that agents will never ask for their UPI PIN or OTP.


    **Step 4: Down Payment and Disbursement**\Once the customer provides the 15% down
    payment and the documents are verified, the loan is sanctioned. The funds are
    disbursed directly to the dealership or as per the sanctioned mandate.


    **Step 5: Mandate Setup**\Assist the customer in setting up their automated payment
    engine. This ensures timely repayments and helps the customer avoid an **EMI Bounce
    Charge**.


    **Summary Table for Agents:**

    - **Interest Rate:** 12.9% (Annual)

    - **Down Payment:** 15%

    - **Tenure:** 36 Months

    - **Processing Fee:** ₹1500'
