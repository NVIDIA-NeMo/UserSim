- id: dd77148e-fd07-51cd-848c-37e92324b76f
  title: General frequently asked questions
  body: '### How do I get in touch with Kalash Finserv support?

    We provide support via our digital channels and phone from **9:00 AM to 7:00 PM
    IST, Monday to Saturday**. Our team is here to assist you with any queries regarding
    your loans or mandates.


    ### What happens if I have a complaint that isn''t being resolved?

    We follow a ''customer-first'' philosophy. Issues are routed through a tiered
    support system. If your grievance remains unresolved by first-level agents, it
    will be escalated to our designated **Nodal Officer** for final resolution.


    ### How does Kalash Finserv handle fraudulent activity?

    Security is our priority. If you notice any fraudulent activity, please report
    it immediately through the official chargeback path so we can initiate a formal
    investigation. For more details on our security protocols, please refer to the
    relevant security advisories for your product.'
  domain: lending_mortgage
  product_category: general
  document_type: faq
  source_authority: official
