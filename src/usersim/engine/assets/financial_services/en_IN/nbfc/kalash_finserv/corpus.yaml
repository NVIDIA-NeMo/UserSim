- id: ae482d8d-32f8-5114-a160-518deadddd0e
  title: Personal Loan — risk disclosures
  body: 'This document provides essential risk disclosures regarding the Personal
    Loan product. Please read these carefully as they impact your financial obligations.


    **1. Interest Rate Risk**

    The Personal Loan carries an **annual interest rate of 14.5%**. This interest
    accrues on the outstanding principal balance. Borrowers should be aware that failure
    to make timely payments will result in continued interest accrual and potential
    impact on their credit score.


    **2. Repayment and Default Risks**

    Repayment is mandatory over the agreed **tenure of 60 months**. Any failure in
    the repayment mandate will result in an **EMI Bounce Charge of ₹500**. Repeated
    defaults may lead to recovery actions conducted strictly according to the RBI
    Fair Practices Code and Digital Lending Guidelines. We emphasize that our collection
    practices are non-coercive.


    **3. Early Closure Costs**

    Closing the loan before the end of the tenure is permitted but incurs a **Foreclosure
    Charge of 4%** of the remaining principal. This fee is structured to ensure the
    long-term sustainability of our lending pool.


    **4. No Guarantee of Outcome**

    While we provide financial education and product information, Kalash Finserv does
    not offer individualized tax, legal, or investment advice. We recommend this product
    based on your expressed needs and credit eligibility, but we cannot guarantee
    specific financial outcomes.


    **5. Regulatory Compliance**

    Kalash Finserv is an NBFC and does **not** take deposits. We are committed to
    transparency; therefore, a **Key Fact Statement (KFS)** is mandated for every
    loan, disclosing the all-in annualised cost of credit, including the **2% processing
    fee**, interest, and foreclosure charges.


    For further regulatory details, please see Personal Loan — regulatory disclosures.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 189e9642-4ac9-56c3-92aa-e97851d19f51
  title: Personal Loan — how rates are tiered and applied
  body: 'At Kalash Finserv, we maintain a transparent and simplified pricing model
    for our Personal Loan to ensure all customers understand their costs.


    **Applied Interest Rate**

    We apply a flat **annual interest rate of 14.5%** to all approved Personal Loans.
    We do not use a tiered interest rate system based on loan amount; this single
    rate applies regardless of whether the loan is for a small emergency or a larger
    consolidation need.


    **How the Rate is Applied**

    * **Calculation**: Interest is calculated on a monthly reducing balance basis.
    This means as you pay off the principal, the interest portion of your EMI decreases.

    * **Quoting**: This rate is quoted as an annual percentage and is clearly disclosed
    in your **Key Fact Statement (KFS)**.


    **Factors That May Affect Cost**

    While the interest rate remains constant at **14.5%**, the total cost of your
    loan is influenced by:

    * The **processing fee of 2%** applied at the start.

    * The chosen **tenure** (up to **60 months**).

    * Any **EMI Bounce Charges of ₹500** incurred due to payment failures.

    * The **4% foreclosure charge** if the loan is closed early.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
