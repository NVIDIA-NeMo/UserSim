- id: 05d0bc0f-5ae0-58c1-bbd6-92bab9c6da35
  title: Gold Loan — regulatory disclosures
  body: 'This disclosure is provided to ensure full transparency and compliance with
    the RBI Fair Practices Code and Digital Lending Guidelines.


    **Cost of Credit Disclosure**

    Kalash Finserv mandates the provision of a **Key Fact Statement (KFS)** to every
    borrower. The KFS discloses the all-in annualised cost of credit. For the **Gold
    Loan**, this includes an annual interest rate of 11.5% and a processing fee of
    ₹500. All other charges, including any applicable foreclosure charges or EMI bounce
    charges, are disclosed upfront; we maintain a strict ''no hidden charges'' policy.


    **Collateral and LTV**

    Loans are granted against gold collateral with a strict **Loan-to-Value (LTV)**
    cap of 75%. The loan amount is determined by the professional appraisal of the
    asset. We ensure secure custody of all pledged gold.


    **Operational Boundaries**

    We provide financial education and product information but do not offer individualized
    tax, legal, or investment advice. Our standard of care is to recommend products
    based on expressed needs and credit eligibility without guaranteeing specific
    financial outcomes.


    **Regulatory Compliance**

    Kalash Finserv takes no deposits. We adhere to Scale Based Regulation and ensure
    non-coercive collection practices. All fund disbursements are preceded by mandatory
    KYC verification and multi-factor authentication (MFA). Agents are strictly prohibited
    from asking for UPI PINs, OTPs, or CVVs, in alignment with RBI and NPCI security
    protocols.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 3db7ab65-2e52-5823-9e48-ad337a7deba8
  title: Gold Loan — interest rate / APY schedule
  body: 'The interest rate for the **Gold Loan** is a flat rate applied to all eligible
    borrowers, regardless of the loan amount, provided the minimum loan amount of
    ₹25000 is met.


    - **Annual Interest Rate**: 11.5%


    **Application of Rate**:

    This rate is quoted as a per annum percentage and is applied to the outstanding
    principal balance of the loan. It is credited and calculated on a daily reducing
    balance basis.


    **What may change the rate?**:

    While the current rate is 11.5%, Kalash Finserv reserves the right to modify interest
    rates in accordance with RBI guidelines and changes in the cost of funds. Any
    such changes will be communicated to the customer with a formal notice period
    as per the account agreement. All applicable rates and the final cost of credit
    will be explicitly stated in your **Key Fact Statement (KFS)** before the loan
    is sanctioned.'
