- id: e13e027e-e42c-55b1-873f-4e6333155d4c
  title: Personal Loan — overview
  body: 'We offer the **Personal Loan** as a flexible, unsecured funding solution
    designed for the emerging middle class and salaried professionals in India. Whether
    you are managing an unexpected expense or funding a personal milestone, we provide
    quick access to credit with a transparent structure and no hidden charges.


    **Key Product Features**

    Our Personal Loan is designed for accessibility and speed of sanction, ensuring
    you get the funds you need without the requirement of collateral. We provide a
    structured repayment window with a **tenure of 60 months**, allowing you to manage
    your monthly outflows effectively.


    **Cost and Fee Structure**

    We believe in complete transparency. Every loan is accompanied by a **Key Fact
    Statement (KFS)**, which discloses the all-in annualised cost of credit before
    the loan is sanctioned. The specific costs associated with this product are:


    *   **Annual Interest Rate**: 14.5%

    *   **Processing Fee**: 2% of the loan amount

    *   **Foreclosure Charge**: 4% of the outstanding principal

    *   **EMI Bounce Charge**: ₹500 per failed instalment


    **Our Commitment**

    We adhere strictly to the RBI Fair Practices Code and Digital Lending Guidelines.
    This means we employ non-coercive collection practices and ensure that all terms
    are disclosed upfront. Please note that Kalash Finserv takes no deposits.


    ***

    **Regulatory Disclaimer**: We provide financial education and product information
    but do not offer individualized tax, legal, or investment advice. Our recommendations
    are based on your expressed needs and credit eligibility without guaranteeing
    specific financial outcomes.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 955b37d1-35ec-5cd7-b4d6-64e7210e7f6f
  title: Personal Loan — interest rate annual explained
  body: '**How is the interest on my Personal Loan calculated?**

    We apply an **annual interest rate of 14.5%** to your loan. This rate is calculated
    on a reducing balance basis, meaning as you pay off your principal through your
    monthly instalments, the interest component of your EMI decreases over time.


    **Is the interest rate fixed or variable?**

    The rate of 14.5% is the standard annual rate applicable to the Personal Loan
    product. Any changes to the interest rate environment that may affect your loan
    will be communicated to you in accordance with our regulatory obligations.


    **Where can I find the total cost of my loan?**

    You can refer to your **Key Fact Statement (KFS)** provided at the time of sanction,
    which details the all-in cost including the 14.5% annual interest. For a full
    breakdown of other costs, please refer to the Personal Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
