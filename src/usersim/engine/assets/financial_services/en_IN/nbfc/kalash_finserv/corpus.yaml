  mentions_tools: []
  institution_id: kalash_finserv
- id: 1540efe6-797b-5a88-a131-3341812b976a
  title: Regulatory notes for lending_mortgage
  body: 'All lending activities at Kalash Finserv are governed by a strict compliance
    posture to protect our customers and the institution. Agents must ensure absolute
    adherence to the following frameworks:


    **1. RBI Fair Practices Code & Digital Lending Guidelines:**

    We strictly adhere to the RBI Fair Practices Code and Digital Lending Guidelines.
    This includes the mandate for non-coercive collection practices. Agents must never
    use pressure tactics or harassment during the recovery process.


    **2. Disclosure Requirements:**

    It is mandatory to provide a **Key Fact Statement (KFS)** to every borrower before
    a loan is sanctioned. The KFS must clearly disclose the all-in annualised cost
    of credit, which includes:

    - The applicable interest rate.

    - All processing fees.

    - Any applicable foreclosure charges.


    **3. Scale Based Regulation:**

    Our operational workflows are aligned with the RBI''s Scale Based Regulation to
    ensure stability and transparency in our NBFC operations.


    **4. Deposit Prohibition:**

    Agents must be explicitly clear with customers that **Kalash Finserv takes no
    deposits**. We are a non-banking financial company focused on credit accessibility,
    not a deposit-taking institution.


    **5. Product-Specific Limits:**

    For collateral-based lending, such as our gold loans, agents must strictly adhere
    to the **Loan-to-Value (LTV)** caps to manage risk and remain compliant with internal
    and regulatory thresholds.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 0e03348a-e905-56cf-9ffb-da56a8390926
  title: Regulatory notes for payments
  body: 'Payment processing and mandate management at Kalash Finserv are subject to
    stringent regulatory oversight to ensure the safety of customer funds and data.


    **1. Security & Verification Protocols:**

    In alignment with RBI and NPCI security protocols, **Multi-factor authentication
    (MFA)** and **KYC verification** are mandatory before any state-changing action
    (such as updating a mandate) or fund disbursement occurs. Agents are strictly
    prohibited from asking customers for their **UPI PINs, OTPs, or CVVs** under any
    circumstances.


    **2. Dispute and Fraud Handling:**

    We operate under a ''customer-first'' philosophy regarding payment disputes. All
    complaints must be handled following the **RBI''s harmonised turn-around-time
    (TAT) framework** for refunds and resolutions. This ensures that customers receive
    their funds or a formal resolution within the regulator-mandated window.


    **3. Repayment Mandates:**

    When managing the **EMI Repayment Mandate**, agents must ensure that all notifications
    regarding bounce charges are transparent and delivered according to the established
    timelines. Any change to a payment mandate must be verified via MFA to prevent
    unauthorized alterations to the customer''s banking instructions.


    **4. Transparency in Charges:**

    Any penalty, such as an **EMI Bounce Charge**, must be disclosed upfront. We ensure
    there are no hidden charges in the payment lifecycle, and any waiver of such charges
    must be documented and approved under exceptional circumstances.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 26303412-28c8-5dca-8614-734667fa1e13
  title: When to use get_repayment_schedule
  body: 'The `get_repayment_schedule` tool is used to provide customers with a comprehensive
    view of their upcoming and past loan payments. This is essential for transparency
    and helping customers plan their finances.


    **Applicable Scenarios:**

    - When a customer asks for their next payment date.

    - When a customer wants to know how many instalments are remaining in their tenure.

    - When a customer disputes a specific payment amount or date.

    - When a customer needs a full breakdown of principal and interest components
    for their repayments.


    **Procedural Steps for Agents:**

    1. **Verify Identity:** Ensure the customer has successfully passed MFA and KYC
    verification.

    2. **Identify Account:** Use the `get_accounts` tool to resolve the customer''s
    specific account_id if they have provided only a partial account number (last
    4 digits).

    3. **Retrieve Schedule:** Call the `get_repayment_schedule` tool using the identified
    account_id.

    4. **Communicate:** Clearly present the repayment dates and amounts to the customer
    in English (India), ensuring that any upcoming deadlines are highlighted.


    Agents must not guess payment dates or refer customers to external portals for
    this information; the tool is the authoritative source for the current state of
    the loan.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_repayment_schedule
  institution_id: kalash_finserv
- id: 53ff4851-1504-5605-85a2-3d46925eb1e5
  title: get_repayment_schedule tool reference
  body: 'The `get_repayment_schedule` tool retrieves the complete amortization and
    payment timeline for a specific loan account.


    **Tool Signature:**

    - **Input:** `account_id` (The unique identifier for the loan account).

    - **Output:** A detailed list of all scheduled instalments, including payment
    dates, principal amounts, interest components, and payment status (Paid/Pending/Overdue).


    **Agent Execution:**

    The agent performs this action by calling the tool directly within the conversation
    interface. The agent must first verify the customer''s identity before executing
    this request to ensure data privacy.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_repayment_schedule
  institution_id: kalash_finserv
- id: e73e747e-ca1a-52b0-8c24-33d19da76aad
  title: When to use request_gold_loan_topup
  body: 'The `request_gold_loan_topup` tool is used when an existing Gold Loan customer
    wishes to increase their loan amount based on the existing collateral or additional
    gold assets.


    **Applicable Scenarios:**

    - When the market value of the gold collateral has increased, allowing for a higher
    loan amount within the **Loan-to-Value (LTV)** caps.

    - When a customer has made significant repayments and wishes to withdraw further
    liquidity against the same assets.


    **Procedural Steps for Agents:**

    1. **Verify Identity:** Perform mandatory MFA and KYC verification.

    2. **Account Identification:** Use `get_accounts` to retrieve the specific Gold
    Loan account_id.

    3. **Eligibility Check:** Review the current LTV status via `get_loan_details`
    to ensure the requested top-up does not exceed regulatory and internal LTV caps.

    4. **Initiate Request:** Call the `request_gold_loan_topup` tool with the account_id
    and the requested top-up amount.

    5. **Disclosure:** Remind the customer that a new **Key Fact Statement (KFS)**
    will be issued for the revised loan terms, detailing any new processing fees or
    interest adjustments.


    Agents must not guarantee the approval of a top-up; the tool initiates the request
    which is then subject to final credit and appraisal approval.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_gold_loan_topup
  institution_id: kalash_finserv
- id: 72125c15-26df-5abb-ab98-389ef700557e
  title: request_gold_loan_topup tool reference
  body: 'The `request_gold_loan_topup` tool submits a formal request to increase the
    loan limit on an existing Gold Loan account.


    **Tool Signature:**

    - **Input:** `account_id` (The unique identifier for the Gold Loan), `requested_amount`
    (The additional amount the customer wishes to borrow).

    - **Output:** Confirmation of the request submission and a tracking reference
    number.


    **Agent Execution:**

    The agent performs this action by calling the tool directly. This is a state-changing
    action and strictly requires prior identity verification. The agent must not direct
    the customer to a branch or website to initiate this request.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_gold_loan_topup
  institution_id: kalash_finserv
- id: bfa42044-871f-51fe-8d1d-281442f22496
  title: When to use get_accounts
  body: 'The `get_accounts` tool is a primary utility used to identify all financial
    products and accounts associated with a verified customer. It serves as the gateway
    for almost all subsequent account-specific actions.


    **Applicable Scenarios:**

    - When a customer provides only a partial account number (e.g., "the loan ending
    in 1234") and the agent needs the full `account_id` to call other tools.

    - When a customer asks, "What loans do I have with Kalash Finserv?"

    - When an agent needs to confirm which products (e.g., Personal Loan, Gold Loan,
    Two-Wheeler Loan) are active for a user.


    **Procedural Steps for Agents:**

    1. **Verify Identity:** Ensure the customer has completed MFA and KYC verification.
    This tool cannot be called for unverified users.

    2. **Execute Search:** Call the `get_accounts` tool.

    3. **Map Account:** Match the returned list of accounts to the customer''s request
    using the account numbers or product types.

    4. **Proceed:** Use the retrieved `account_id` to perform further actions, such
    as calling `get_loan_details` or `get_repayment_schedule`.


    This tool must be used whenever the full internal `account_id` is not already
    present in the conversation context.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kalash_finserv
- id: a593742e-c677-5c2b-9329-e74a403b1d8e
  title: get_accounts tool reference
  body: 'The `get_accounts` tool retrieves a list of all accounts associated with
    the authenticated customer.


    **Tool Signature:**

    - **Input:** No input parameters required (operates on the authenticated session).

    - **Output:** A list of accounts, including `account_id`, `product_id` (e.g.,
    `personal_loan`, `gold_loan`), account status, and the account number.


    **Agent Execution:**

    The agent performs this action by calling the tool directly. This is a read-only
    operation used to resolve account identities before performing state-changing
    actions.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kalash_finserv
- id: 318fe884-6b5a-5c87-9374-b7807b3f0317
  title: When to use open_account
  body: 'At Kalash Finserv, we aim to provide speed of sanction and a customer-centric
    approach to credit. The process of onboarding a new customer or initiating a new
    credit facility is handled through a strict verification and documentation pipeline
    to ensure compliance with the RBI Fair Practices Code.


    **Policy Guidelines**

    We only initiate account opening once the customer has expressed a specific need
    for one of our products (such as a Personal Loan or Gold Loan) and has passed
    the initial eligibility check. We ensure that no deposits are taken, as Kalash
    Finserv is an NBFC and does not accept public deposits.


    **Procedure for Agents**

    To open a new account for a customer, follow these steps:


    1. **Verify Identity**: Perform mandatory Multi-factor authentication (MFA) and
    KYC verification. This is a non-negotiable security requirement before any state-changing
    action.

    2. **Confirm Product Choice**: Ensure the customer understands the product they
    are applying for and that they have received a **Key Fact Statement (KFS)** disclosing
    the all-in annualised cost of credit, including interest and processing fees.

    3. **Account Identification**: If the customer has existing relations but needs
    a new product account, use `get_accounts` to retrieve the primary customer ID.

    4. **Execute Opening**: Once all compliance checks are complete, call the `open_account`
    tool to formally create the account in our system.


    **Important Security Note**: Agents are strictly prohibited from asking for UPI
    PINs, OTPs, or CVVs during this process. Any request for such information is a
    violation of RBI and NPCI security protocols.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kalash_finserv
- id: 35a69f94-2c1f-5998-b4c6-0d1c278ee4be
  title: open_account tool reference
  body: "The `open_account` tool is used by agents to formally create a new credit\
    \ account for a customer within the Kalash Finserv ecosystem. \n\n**Tool Signature**\n\
    `open_account(product_id: string, loan_amount: number, tenure_months: integer)`\n\
    \n**Effect**\nThis tool performs a state-changing action that establishes a formal\
    \ lending relationship. It triggers the final sanctioning process and allocates\
    \ a unique account identifier to the customer for the specified product (e.g.,\
    \ `personal_loan` or `gold_loan`). \n\n**Agent Execution**\nThe agent performs\
    \ this action by calling the tool directly within the conversation interface.\
    \ The agent must not redirect the customer to an external portal or app to complete\
    \ this step; the tool is the authoritative mechanism for account creation after\
    \ identity verification is complete."
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kalash_finserv
- id: e0aed95e-04c0-5e87-a742-dc45ea62d7ff
  title: When to use close_account
  body: 'Account closure at Kalash Finserv is an irreversible action. We handle these
    requests with transparency, ensuring the customer is fully aware of the implications,
    particularly regarding any outstanding dues or penalties.


    **Policy Guidelines**

    A loan account can only be closed once the total outstanding balance, including
    all accrued interest and applicable fees, has been paid in full. For products
    like the Gold Loan, the account is closed only after the collateral is successfully
    released to the customer. We adhere to a ''no hidden charges'' policy, meaning
    all closure-related costs must be disclosed upfront.


    **Procedure for Agents**

    To close a customer''s account, follow these steps:


    1. **Verify Identity**: Perform mandatory MFA and KYC verification to prevent
    unauthorised account closures.

    2. **Check Outstanding Balance**: Use `get_loan_details` or `get_accounts` to
    ensure the current balance is ₹0. If there is an outstanding amount, the customer
    must first use `pay_emi` or `foreclose_loan` to clear the debt.

    3. **Confirm Irreversibility**: Explicitly inform the customer that calling the
    closure tool is an irreversible action and the account cannot be reopened once
    closed.

    4. **Execute Closure**: Call the `close_account` tool to terminate the account
    and trigger any necessary final notifications or collateral release workflows.


    Failure to verify the zero-balance status before closure will result in a compliance
    breach under our risk management framework.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kalash_finserv
- id: fa5826aa-3d84-562e-a8cf-3eae835e2a9f
  title: close_account tool reference
  body: 'The `close_account` tool is used by agents to permanently terminate a customer''s
    loan account.


    **Tool Signature**

    `close_account(account_id: string)`


    **Effect**

    This is an **irreversible** state-changing action. It marks the account as ''Closed''
    in the system, stops all future EMI mandates, and initiates the final reconciliation
    process. If the account is a Gold Loan, it triggers the secure collateral return
    workflow.


    **Agent Execution**

    The agent performs this action by calling the tool directly. The agent must never
    instruct the customer to visit a branch or use a web form to close the account;
    the tool is the definitive method for executing this request in the conversation
    flow.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kalash_finserv
- id: d847d09d-b7d0-59a2-96fd-658364e2f95c
  title: When to use update_contact_info
  body: 'Maintaining accurate contact information is critical for the delivery of
    mandatory notifications, such as **EMI Bounce Charge** alerts and regulatory disclosures.
    We ensure that all updates to customer data are handled securely to prevent identity
    theft and fraud.


    **Policy Guidelines**

    Customers may update their phone number, email address, or residential address
    at any time. However, because this is a state-changing action that could be exploited
    by fraudsters to divert communications, we require strict verification before
    any change is committed.


    **Procedure for Agents**

    To update a customer''s contact information, follow these steps:


    1. **Verify Identity**: Execute mandatory MFA and KYC verification. This ensures
    the request is coming from the actual account holder.

    2. **Identify Account**: If the customer provides only a partial account number,
    use `get_accounts` to resolve the correct `account_id`.

    3. **Collect New Details**: Clearly confirm the new contact details (email, phone,
    or address) with the customer to avoid typographical errors.

    4. **Execute Update**: Call the `update_contact_info` tool with the verified details.

    5. **Confirmation**: Notify the customer that the update has been successful and
    that they will receive a confirmation on both their old and new contact points
    (where applicable).


    Agents must never bypass the MFA step for ''urgent'' updates, as this violates
    our security and verification posture.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kalash_finserv
- id: d6a60841-c5d3-5bed-90af-2211b6a416fa
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool allows agents to modify the registered contact
    details of a customer.


    **Tool Signature**

    `update_contact_info(account_id: string, email: string, phone: string, address:
    string)`


    **Effect**

    This is a state-changing action that updates the customer''s profile in the central
    database. All future communications, including repayment reminders and legal notices,
    will be sent to these updated coordinates.


    **Agent Execution**

    The agent performs this action by calling the tool directly after the customer''s
    identity has been verified via MFA. The agent must not direct the customer to
    an external profile settings page; the tool is the primary method for updating
    information during a support session.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kalash_finserv
- id: 3c84652d-f95b-5b3a-abab-79ff45da6efb
  title: When to use get_statements
  body: 'Transparency is a core pillar of Kalash Finserv. We provide customers with
    easy access to their loan statements to ensure they can track their repayments,
    interest accruals, and any fees applied to their account.


    **Policy Guidelines**

    Statements must be provided upon request or as part of a dispute resolution process.
    In alignment with the RBI''s harmonised turn-around-time (TAT) framework, we ensure
    that customers can access their financial records without undue delay. Statements
    should be used to help customers understand their **Key Fact Statement (KFS)**
    and how the all-in cost of credit is being applied over the tenure.


    **Procedure for Agents**

    To provide a loan statement to a customer, follow these steps:


    1. **Verify Identity**: Perform mandatory MFA and KYC verification to protect
    the customer''s financial privacy.

    2. **Retrieve Account**: Use `get_accounts` to identify the specific `account_id`
    the customer is enquiring about.

    3. **Specify Period**: Ask the customer for the specific date range or statement
    type (e.g., monthly, annual, or since inception) they require.

    4. **Execute Retrieval**: Call the `get_statements` tool to generate the statement
    data.

    5. **Review and Delivery**: Present the statement information to the customer
    clearly, highlighting key figures such as total paid and remaining principal.


    If a customer disputes a charge found in the statement, agents must immediately
    transition to the fraud or complaint handling path as per our ''customer-first''
    philosophy.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kalash_finserv
- id: f2120626-d888-5ce8-b800-f73723aced24
  title: get_statements tool reference
  body: 'The `get_statements` tool retrieves the transaction history and balance statements
    for a specific loan account.


    **Tool Signature**

    `get_statements(account_id: string, start_date: string, end_date: string)`


    **Effect**

    This is a read-only action. It fetches a detailed log of all debits (EMIs, fees)
    and credits applied to the account for the requested period, allowing the agent
    to share the transaction history with the customer.


    **Agent Execution**

    The agent performs this action by calling the tool directly. The agent should
    not tell the customer to download the statement from a portal or app; they should
    use the tool to provide the information immediately within the conversation after
    identity verification.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kalash_finserv
- id: 2a961a35-e1f0-5092-9051-a0d5f662edcc
  title: When to use update_beneficiary
  body: 'For certain credit products, particularly those involving collateral or insurance,
    maintaining an updated beneficiary is essential for the legal and financial protection
    of the customer''s estate.


    **Policy Guidelines**

    We allow customers to update their nominated beneficiary to ensure that any payouts
    or collateral releases (in the event of the primary borrower''s demise) are handled
    according to their current wishes. This process is treated as a high-sensitivity
    state-changing action due to the legal implications of beneficiary designation.


    **Procedure for Agents**

    To update the beneficiary on an account, follow these steps:


    1. **Verify Identity**: Perform mandatory MFA and KYC verification. This is critical
    to prevent fraudulent attempts to change legal nominees.

    2. **Identify Account**: Use `get_accounts` to ensure the correct account is being
    modified.

    3. **Collect Nominee Details**: Obtain the full legal name, relationship to the
    borrower, and contact details of the new beneficiary.

    4. **Execute Update**: Call the `update_beneficiary` tool to commit the change
    to the account records.

    5. **Confirm Changes**: Confirm to the customer that the beneficiary has been
    updated and advise them to keep a record of this change for their legal documentation.


    Agents must ensure that they do not provide legal advice regarding the choice
    of beneficiary, as our boundaries restrict us to providing product information
    and education only.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kalash_finserv
- id: 4561de5b-b61e-5578-9451-dc6ddb272491
  title: update_beneficiary tool reference
  body: 'The `update_beneficiary` tool is used to change the designated nominee or
    beneficiary associated with a customer''s account.


    **Tool Signature**

    `update_beneficiary(account_id: string, beneficiary_name: string, relationship:
    string, contact_info: string)`


    **Effect**

    This is a state-changing action that updates the legal nomination records for
    the account. This information is used for the secure release of collateral (such
    as in Gold Loans) or the settlement of accounts in extreme circumstances.


    **Agent Execution**

    The agent performs this action by calling the tool directly. This must be done
    only after rigorous MFA and KYC verification. The agent must not direct the customer
    to a separate form or branch unless the tool fails or additional physical documentation
    is legally required.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kalash_finserv
- id: 98054f84-b0d7-50ee-8f62-076c5c4aefc8
  title: When to use set_alerts
  body: 'At Kalash Finserv, we believe in empowering our customers with timely information
    to help them manage their credit health and avoid unnecessary costs such as the
    **EMI Bounce Charge**. We provide a mechanism for customers to receive notifications
    regarding their account activity and payment deadlines.


    Agents must follow these steps when a customer expresses a desire to be notified
    of upcoming payments, balance changes, or account alerts:


    1. **Verify Identity**: Ensure the customer''s identity is fully verified using
    the mandatory multi-factor authentication (MFA) and KYC protocols before proceeding
    with any state-changing action.

    2. **Identify Account**: Use the `get_accounts` tool to retrieve the correct account
    identifier if the customer provides only a partial account number.

    3. **Confirm Alert Preferences**: Determine the specific events the customer wishes
    to be alerted about (e.g., payment reminders, loan disbursement notifications).

    4. **Execute Request**: Call the `set_alerts` tool to update the customer''s notification
    preferences in the system.

    5. **Confirmation**: Confirm to the customer that their alerts have been successfully
    configured.


    We maintain a professional and transparent approach to all communications. By
    utilizing these alerts, customers can better align their funds to ensure the long-term
    sustainability of our lending pool and avoid the operational costs associated
    with failed repayments.


    ***

    **Regulatory Disclaimer**: All alerts are subject to the delivery capabilities
    of the registered communication channels. Kalash Finserv is not liable for delays
    caused by third-party telecom providers.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kalash_finserv
- id: b65e840e-227a-5dea-8af3-6c1a20994a02
  title: set_alerts tool reference
  body: 'The `set_alerts` tool is used by agents to modify the notification settings
    for a customer''s account. The agent performs this action by calling the tool
    directly within the conversation interface.


    **Tool Signature**: `set_alerts(account_id: string, alert_type: string, enabled:
    boolean)`


    **Arguments**:

    - `account_id`: The unique identifier of the customer''s account.

    - `alert_type`: The category of alert to be configured (e.g., ''payment_reminder'',
    ''transaction_alert'').

    - `enabled`: A boolean value where `true` activates the alert and `false` deactivates
    it.


    **Effect**: This is a state-changing action that updates the customer''s communication
    preferences in the core banking system. Once executed, the system will automatically
    trigger notifications based on the selected criteria.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kalash_finserv
- id: b36e4db1-612b-5abb-9a1a-3426b33e51a4
  title: When to use get_loan_details
  body: 'Transparency is a cornerstone of Kalash Finserv''s positioning. We ensure
    that every customer has immediate access to the specifics of their credit facility,
    including the all-in cost of credit as outlined in their **Key Fact Statement
    (KFS)**.


    Agents should use the following procedure when a customer inquires about their
    current loan balance, interest rate, tenure, or specific terms of their **Personal
    Loan**, **Gold Loan**, **Two-Wheeler Loan**, or **Consumer Durable EMI**:


    1. **Verify Identity**: Confirm the customer''s identity through MFA and KYC verification
    to protect sensitive financial data.

    2. **Retrieve Account ID**: If the account ID is not already present in the session,
    use `get_accounts` to resolve the account based on the customer''s details.

    3. **Fetch Details**: Call the `get_loan_details` tool using the specific account
    identifier.

    4. **Communicate Transparently**: Provide the requested information clearly. If
    the customer asks about the total cost of the loan, refer back to the **Key Fact
    Statement (KFS)** logic to ensure they understand the annualised cost of credit.


    We do not provide individualized investment or tax advice; we simply provide the
    factual data regarding the product as sanctioned. If a customer is confused about
    a specific charge, such as a **Foreclosure Charge**, the agent should explain
    the fee''s purpose in covering operational costs and risk management.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: kalash_finserv
- id: 01e4b75e-5dbc-5970-9ef9-3649ba2322dd
  title: get_loan_details tool reference
  body: 'The `get_loan_details` tool allows agents to retrieve the comprehensive current
    state of a customer''s loan account. The agent performs this action by calling
    the tool directly.


    **Tool Signature**: `get_loan_details(account_id: string)`


    **Arguments**:

    - `account_id`: The unique identifier of the loan account.


    **Effect**: This is a read-only action. It returns a data object containing the
    current outstanding principal, the applied interest rate, the remaining tenure
    in months, the original loan amount, and any applicable fee structures associated
    with the account.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: kalash_finserv
- id: dc57a0e7-c921-5b59-9626-e7ad62aa5c5f
  title: When to use apply_loan
  body: 'Kalash Finserv is committed to credit accessibility for the emerging middle
    class and salaried professionals. We use a digitally-forward approach to ensure
    speed of sanction while maintaining strict risk management.


    When a customer wishes to apply for a new credit facility—whether it be a **Personal
    Loan**, **Gold Loan**, **Two-Wheeler Loan**, or **Consumer Durable EMI**—agents
    must follow this protocol:


    1. **Needs Assessment**: Identify the customer''s requirements to recommend the
    appropriate product based on their expressed needs.

    2. **Eligibility Check**: Briefly verify if the customer meets the basic criteria
    (e.g., salaried status for personal loans or collateral availability for gold
    loans). For gold loans, explain the **Loan-to-Value (LTV)** caps.

    3. **Identity Verification**: Complete mandatory KYC and MFA verification to prevent
    fraud.

    4. **KFS Disclosure**: Before sanctioning, we must ensure the customer is aware
    of the **Key Fact Statement (KFS)**, which discloses the all-in annualised cost
    of credit, including interest and processing fees.

    5. **Submit Application**: Call the `apply_loan` tool with the necessary product
    and customer details.


    We do not guarantee specific financial outcomes, but we ensure a transparent process
    where all costs are disclosed upfront. Agents are strictly prohibited from asking
    for UPI PINs or OTPs during the application process, in alignment with RBI and
    NPCI security protocols.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: kalash_finserv
- id: 527a0f7f-a0ea-5069-bc9a-f753c94b48a8
  title: apply_loan tool reference
  body: 'The `apply_loan` tool is the mechanism used to initiate a formal loan application
    in the system. The agent performs this action by calling the tool directly.


    **Tool Signature**: `apply_loan(product_id: string, loan_amount: number, tenure_months:
    number)`


    **Arguments**:

    - `product_id`: The internal ID of the product (e.g., `personal_loan`, `gold_loan`,
    `two_wheeler_loan`, `consumer_durable_emi`).

    - `loan_amount`: The requested principal amount in ₹.

    - `tenure_months`: The requested duration of the loan in months.


    **Effect**: This is a state-changing action that submits the application for credit
    underwriting. It triggers the internal risk assessment engine to determine eligibility
    and sanction limits.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: kalash_finserv
- id: 91b83e5e-2a91-5565-b5cb-083b3fd95e9b
  title: When to use pay_emi
  body: 'Ensuring timely repayments is critical for the sustainability of our lending
    pool. While the **EMI Repayment Mandate** automates this process, we provide a
    manual payment option for customers who wish to make an immediate payment or resolve
    a missed instalment.


    Agents must follow these steps to facilitate a manual payment:


    1. **Verify Identity**: Perform full MFA and KYC verification to ensure the security
    of the transaction.

    2. **Account Identification**: Use `get_accounts` to find the correct loan account
    if the customer is unsure of the ID.

    3. **Amount Verification**: Use `get_loan_details` to confirm the exact EMI amount
    due, including any applicable **EMI Bounce Charge** if a previous payment failed.

    4. **Execute Payment**: Call the `pay_emi` tool to process the repayment.

    5. **Confirmation**: Inform the customer that the payment has been received and
    provide a reference number.


    We adhere to a ''no hidden charges'' policy; any fee applied during the payment
    process must be disclosed upfront. If a customer disputes a charge, we follow
    the RBI''s harmonised turn-around-time (TAT) framework for resolutions, treating
    the customer first.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: kalash_finserv
- id: 27694184-bf4f-5dbf-a36c-95eb14646ddb
  title: pay_emi tool reference
  body: 'The `pay_emi` tool allows agents to trigger a manual repayment of a loan
    instalment. The agent performs this action by calling the tool directly.


    **Tool Signature**: `pay_emi(account_id: string, amount: number)`


    **Arguments**:

    - `account_id`: The unique identifier of the loan account.

    - `amount`: The amount to be paid in ₹.


    **Effect**: This is a state-changing action that debits the customer''s linked
    payment method and credits the loan account, reducing the outstanding principal
    and interest. It also updates the repayment history to reflect the payment.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: kalash_finserv
- id: 8d1cd86f-784d-5162-aae1-58d71a1f7f96
  title: When to use foreclose_loan
  body: 'Foreclosure occurs when a borrower chooses to pay off the entire remaining
    loan balance before the end of the tenure. At Kalash Finserv, we allow this flexibility,
    though it may attract a **Foreclosure Charge** to cover our operational costs
    and risk management.


    Agents must follow these strict steps to process a foreclosure:


    1. **Verify Identity**: Because foreclosure is an irreversible action, strict
    MFA and KYC verification are mandatory.

    2. **Calculate Payoff**: Use `get_loan_details` to determine the current outstanding
    principal and accrued interest.

    3. **Disclose Fees**: Clearly inform the customer of the applicable **Foreclosure
    Charge**. This must be done transparently, as per our ''no hidden charges'' policy.

    4. **Confirm Intent**: Ensure the customer understands that this action will close
    the loan account entirely.

    5. **Execute Foreclosure**: Call the `foreclose_loan` tool to settle the account.

    6. **Final Notification**: Confirm that the loan is closed and advise the customer
    on when they will receive their No Objection Certificate (NOC).


    ***

    **Regulatory Note**: We adhere strictly to the RBI Fair Practices Code. Foreclosure
    must be handled non-coercively, and all charges must align with the terms disclosed
    in the **Key Fact Statement (KFS)** provided at the time of sanction.'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: kalash_finserv
- id: d5e67007-63a8-5940-b055-a033fb38d86c
  title: foreclose_loan tool reference
  body: 'The `foreclose_loan` tool is used to permanently close a loan account by
    paying off the total outstanding balance. The agent performs this action by calling
    the tool directly.


    **Tool Signature**: `foreclose_loan(account_id: string)`


    **Arguments**:

    - `account_id`: The unique identifier of the loan account to be closed.


    **Effect**: This is an **irreversible** state-changing action. It calculates the
    final settlement amount (including principal, interest, and the **Foreclosure
    Charge**), triggers the payment process, and changes the account status to ''Closed''.
    Once called, the loan cannot be reopened.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: kalash_finserv
- id: b7e38889-a492-577c-bd1b-fa3f73b70bec
  title: When to use update_repayment_mandate
  body: "At Kalash Finserv, we ensure that our customers can maintain their credit\
    \ health by providing a seamless way to update their payment instructions. The\
    \ **EMI Repayment Mandate** is the automated payment engine that ensures timely\
    \ repayments; if a customer's bank account changes or a mandate fails, it is critical\
    \ to update these details promptly to avoid an **EMI Bounce Charge**.\n\n**Policy\
    \ Guidelines**\nWe allow customers to update their repayment mandates when they\
    \ have changed their primary salary account or when the existing mandate has been\
    \ revoked by the bank. To maintain security and adhere to RBI Digital Lending\
    \ Guidelines, agents must never ask for UPI PINs, OTPs, or CVVs. All changes must\
    \ be preceded by mandatory Multi-factor authentication (MFA) and KYC verification.\n\
    \n**Procedure for Agents**\nWhen a customer requests to change the account from\
    \ which their EMIs are debited, follow these steps:\n\n1. **Verify Identity**:\
    \ Use the `verify_identity` tool to ensure the customer is authenticated via MFA.\n\
    2. **Retrieve Account Details**: Use `get_accounts` to identify the specific loan\
    \ account associated with the customer's request (e.g., resolving a last-4 digit\
    \ account number to a full account_id).\n3. **Confirm New Details**: Collect the\
    \ new bank account details and mandate preferences from the customer.\n4. **Execute\
    \ Update**: Call the `update_repayment_mandate` tool to apply the changes to the\
    \ system. \n5. **Confirmation**: Inform the customer that the update has been\
    \ initiated and advise them on the processing timeline as per the RBI's harmonised\
    \ turn-around-time (TAT) framework.\n\nFor further details on the costs associated\
    \ with failed payments, please refer to the EMI Repayment Mandate — bounce charge\
    \ explained."
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: kalash_finserv
- id: 4187b83b-b2ba-5b72-887e-40f8695e0d79
  title: update_repayment_mandate tool reference
  body: 'The `update_repayment_mandate` tool is the authoritative mechanism used by
    agents to modify the automated payment instructions for a customer''s loan. This
    tool updates the bank account and mandate details used by the **EMI Repayment
    Mandate** engine to pull scheduled instalments.


    **Tool Execution**

    The agent performs this action by calling the tool directly within the conversation
    interface after the customer''s identity has been successfully verified. The agent
    does not redirect the customer to an external app or website to perform this update.


    **Parameters**

    - `account_id`: The unique identifier of the loan account being updated.

    - `new_bank_details`: The updated banking credentials (Account Number, IFSC) for
    the repayment mandate.

    - `mandate_type`: The type of mandate (e.g., e-NACH, Physical).


    **Effect**

    Upon successful execution, the system updates the repayment record, ensuring that
    future EMIs are debited from the new specified account, thereby helping the customer
    avoid an **EMI Bounce Charge**.'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: kalash_finserv
