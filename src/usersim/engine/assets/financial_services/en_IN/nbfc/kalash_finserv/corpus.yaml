- id: 40b320ee-75ce-5024-a76d-9dc7487ced50
  title: Two-Wheeler Loan — choosing between tiers or options
  body: 'When choosing the right financing for your vehicle, it is important to compare
    the structure of the **Two-Wheeler Loan** against other options.


    **Two-Wheeler Loan vs. Personal Loan**

    * **Cost:** The **Two-Wheeler Loan** has a specific annual interest rate of 12.9%
    and a processing fee of ₹1500. A Personal Loan may have different rates based
    on your credit profile.

    * **Structure:** The **Two-Wheeler Loan** requires a mandatory down payment of
    15% and has a fixed tenure of 36 months. In contrast, a Personal Loan is unsecured
    and does not require a down payment but may offer different tenure options.

    * **Purpose:** Our **Two-Wheeler Loan** is specifically structured for mobility,
    ensuring the asset is financed efficiently.


    **Who should choose the Two-Wheeler Loan?**

    This is the best choice for salaried professionals who have 15% of the vehicle
    cost available as a down payment and prefer a structured 36-month repayment plan
    with a transparent, fixed cost of credit.


    **Who should choose a Personal Loan?**

    If you cannot provide a down payment or require a loan for a purpose other than
    a vehicle, the Personal Loan is the more suitable option.'
