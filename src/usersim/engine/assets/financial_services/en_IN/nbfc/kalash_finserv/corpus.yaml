- id: f21761ac-898c-5b7e-b3e7-3f6d09d192a5
  title: Personal Loan — vs. a similar product here
  body: 'When choosing between our credit products, it is important to understand
    the difference between a **Personal Loan** and a **Gold Loan**.


    **Personal Loan**

    * **Collateral**: Unsecured (no assets required).

    * **Cost**: Annual interest rate of 14.5% and a processing fee of 2%.

    * **Flexibility**: Longer tenure of up to **60 months**.

    * **Best For**: Salaried professionals who need quick liquidity for diverse needs
    without pledging assets.


    **Gold Loan**

    * **Collateral**: Secured by gold assets.

    * **Cost**: Typically lower interest rates due to the security of collateral.

    * **Flexibility**: Shorter term, governed by strict **Loan-to-Value (LTV)** caps.

    * **Best For**: Customers who have gold assets and prefer lower interest costs
    over tenure flexibility.


    While the **Personal Loan** has a higher cost of 14.5% compared to secured options,
    it offers the distinct advantage of not requiring any collateral, making it the
    better choice for those who value asset liquidity.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 6cd535c4-ae4f-5036-9b5f-1bddee521e66
  title: Personal Loan — regulatory disclosures
  body: 'This document provides the formal regulatory disclosures for the **Personal
    Loan** product at Kalash Finserv. We operate in strict adherence to the RBI Fair
    Practices Code, Scale Based Regulation, and the Digital Lending Guidelines.


    **Cost Disclosure**

    We maintain a ''no hidden charges'' policy. The all-in annualised cost of credit
    is explicitly disclosed in the **Key Fact Statement (KFS)** provided to every
    borrower. The standard costs for this product are:

    * An **annual interest rate of 14.5%**.

    * A **processing fee of 2%**.

    * A **foreclosure charge of 4%** on the remaining principal if the loan is paid
    off early.

    * An **EMI Bounce Charge of ₹500** for failed repayments.


    **Fair Practices and Collections**

    Kalash Finserv is committed to non-coercive collection practices. We do not employ
    any methods of recovery that violate the dignity of the customer. All grievances
    are handled with a ''customer-first'' philosophy, following the RBI''s harmonised
    turn-around-time (TAT) framework for resolutions.


    **Security and Privacy**

    Multi-factor authentication (MFA) and KYC verification are mandatory before any
    fund disbursement. In accordance with RBI and NPCI protocols, our agents are strictly
    prohibited from asking for your UPI PIN, OTP, or CVV.


    **Institutional Status**

    Please be advised that Kalash Finserv is a Non-Banking Financial Company (NBFC)
    and takes no deposits from the public.


    ***

    **Disclaimer**: We provide financial education and product information but do
    not offer individualized tax, legal, or investment advice. Our standard of care
    is to recommend products based on the customer''s expressed needs and credit eligibility
    without guaranteeing specific financial outcomes.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
