- id: de72e193-fb63-5785-b26e-0a29c8742181
  title: Consumer Durable EMI — risk disclosures
  body: 'This document provides essential risk disclosures regarding the Consumer
    Durable EMI facility. Please read these carefully before committing to a credit
    agreement.


    **Financial Obligations**

    By taking this loan, you commit to a repayment schedule spanning **9 months**.
    While the **annual interest rate is 0%**, the loan is not ''free''. A one-time
    **processing fee of ₹499** is charged, which is an absolute cost of the credit.


    **Credit Risk and Penalties**

    Failure to maintain sufficient funds in your linked bank account for the monthly
    instalment can lead to financial penalties. A **late payment charge of ₹350**
    is levied on any overdue amount. Additionally, your bank may charge you an **EMI
    Bounce Charge** for failed mandates. Frequent defaults can negatively impact your
    credit score, affecting your future eligibility for loans.


    **Regulatory Compliance**

    Kalash Finserv operates as an NBFC and adheres to the RBI Fair Practices Code
    and Digital Lending Guidelines. We do not take deposits. Every borrower is provided
    with a **Key Fact Statement (KFS)**, which is the definitive document for the
    all-in annualised cost of credit, including the **₹499** processing fee and any
    potential charges.


    **No Guaranteed Outcome**

    While we recommend products based on your expressed needs and credit eligibility,
    Kalash Finserv does not guarantee specific financial outcomes. The provision of
    credit is subject to our internal risk assessment and mandatory KYC verification.


    **Disclaimer**: We provide financial education and product information but do
    not offer individualized tax, legal, or investment advice.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: cef68304-61ef-57fd-af9d-8d75f9622c4a
  title: Consumer Durable EMI — how rates are tiered and applied
  body: 'The Consumer Durable EMI is designed as a simplified, low-cost credit tool.
    Unlike our larger loan products, this facility does not use a tiered interest
    structure based on credit score or loan amount.


    **Applicable Rate**

    A flat **annual interest rate of 0%** applies to all eligible borrowers, regardless
    of the purchase value or the customer''s profile. This rate is constant throughout
    the **9 months** tenure of the loan.


    **When is this rate applied?**

    The 0% rate is applied to the principal amount of the consumer durable purchased,
    ensuring that the total of your monthly instalments equals the principal amount,
    provided all payments are made on time.


    **What would change the cost?**

    While the interest rate remains 0%, the total cost of credit is affected by:

    1. **Upfront Fees**: The mandatory one-time **processing fee of ₹499**.

    2. **Penalty Charges**: Any delay in payment will trigger a **late payment charge
    of ₹350**, which increases the total amount payable over the life of the loan.'
  domain: lending_mortgage
  product_category: consumer_durable_emi
  document_type: rate_sheet
  source_authority: official
  placeholder: true
