- id: 57b032ca-9b49-5158-8b84-3b1f7f2f8c50
  title: Gold Loan — fraud and unauthorized-activity protection
  body: 'At Kalash Finserv, we prioritise the safety of your assets and your identity.
    When comparing our Gold Loan against other market alternatives, it is vital to
    understand the security protocols that protect your collateral and your funds.


    **Common Fraud Patterns**

    Be vigilant against ''doorstep valuation'' scams where unauthorised individuals
    pose as our agents to collect gold for appraisal. We only conduct gold valuations
    through verified channels. Additionally, beware of phishing messages claiming
    your loan is overdue or offering ''instant top-ups'' in exchange for sensitive
    data.


    **Our Non-Negotiable Security Standards**

    To protect your account, we adhere to strict RBI and NPCI security protocols.
    Please remember that Kalash Finserv agents are **strictly prohibited** from asking
    you for the following:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * Your Card CVV


    Any request for these details is a red flag for fraudulent activity. We mandate
    **Multi-factor authentication (MFA)** and rigorous **KYC verification** before
    any fund disbursement or state-changing action on your account.


    **Immediate Action for Unauthorized Activity**

    If you suspect any fraudulent activity or notice an unauthorised transaction,
    you must report it immediately through our official chargeback path. This allows
    us to initiate a formal investigation and secure your account. Our ''customer-first''
    philosophy ensures that complaints are handled following the RBI''s harmonised
    turn-around-time (TAT) framework for resolutions.


    ***

    **Regulatory Disclaimer**: Kalash Finserv adheres to the RBI Fair Practices Code
    and Digital Lending Guidelines. We do not take deposits.'
  domain: lending_mortgage
  product_category: gold_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: cf8071d2-731f-5c6d-a00b-f7516f86555f
  title: Gold Loan — account agreement
  body: "This agreement governs the relationship between Kalash Finserv and the borrower\
    \ for the Gold Loan product. By opting for this facility, both parties agree to\
    \ the following binding terms:\n\n**1. Loan Disbursement and Collateral**\nWe\
    \ provide liquidity based on the appraised value of your gold assets. The loan\
    \ amount is strictly capped at a **Loan-to-Value (LTV) of 75%**. The borrower\
    \ must provide a minimum loan amount of **₹25,000** to initiate this facility.\
    \ All gold collateral will remain in secure custody until the loan is fully repaid.\n\
    \n**2. Financial Obligations**\n* **Interest**: The borrower agrees to pay an\
    \ annual interest rate of **11.5%**. \n* **Fees**: A one-time processing fee of\
    \ **₹500** is applicable and deducted at the time of sanction.\n* **Tenure**:\
    \ The loan is sanctioned for a maximum tenure of **12 months**.\n\n**3. Repayment\
    \ and Defaults**\nRepayments must be made as per the agreed schedule. Failure\
    \ to maintain sufficient funds for a scheduled repayment will result in an **EMI\
    \ Bounce Charge**. We adhere to the RBI Fair Practices Code, ensuring all collection\
    \ practices are non-coercive.\n\n**4. Foreclosure and Closing**\nBorrowers may\
    \ pay off the remaining balance before the end of the 12-month tenure. Such actions\
    \ are subject to a **Foreclosure Charge**, as detailed in the **Key Fact Statement\
    \ (KFS)** provided before sanction.\n\n**5. Changes to Terms**\nWe reserve the\
    \ right to modify these terms in accordance with Scale Based Regulation. Any changes\
    \ will be communicated to the borrower within the mandated notice period. This\
    \ agreement ends upon the full repayment of the principal and interest and the\
    \ subsequent release of the gold collateral.\n\n***\n**Regulatory Disclaimer**:\
    \ We provide product information but do not offer individualized tax, legal, or\
    \ investment advice."
