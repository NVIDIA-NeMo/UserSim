- id: 296f381a-9b4f-53d7-bc6e-2fc00b5d370e
  title: Two-Wheeler Loan — tenure months explained
  body: '**What is the repayment tenure for a Two-Wheeler Loan?**

    Our **Two-Wheeler Loan** comes with a structured repayment tenure of 36 months.
    This duration is designed to keep your monthly instalments affordable while ensuring
    the loan is closed within a reasonable timeframe.


    **Can I choose a different tenure?**\Currently, the standard tenure for this product
    is fixed at 36 months to maintain the sustainability of our lending pool and offer
    a consistent interest rate of 12.9%.


    **What happens if I want to close the loan before 36 months?**\You may pay off
    your loan early. Please refer to your **Key Fact Statement (KFS)** to understand
    the applicable **Foreclosure Charge** for early settlement. We recommend reviewing
    the Two-Wheeler Loan — overview for general product details.'
