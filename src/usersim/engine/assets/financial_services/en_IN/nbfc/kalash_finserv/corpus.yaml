- id: 3b0f6f1d-c8d6-526b-89c6-d0b94b276e89
  title: Consumer Durable EMI — a failed or pending action
  body: "**Symptom:** Your loan application is marked as 'Pending' or a disbursement\
    \ action has failed.\n\n**Likely Causes:**\n- Incomplete KYC documentation.\n\
    - MFA (Multi-factor authentication) failure or timeout.\n- Issues with the automated\
    \ repayment mandate setup.\n- Discrepancy in the provided professional or income\
    \ details.\n\n**Resolution Steps:**\n1. **Check KYC Status:** Verify if all submitted\
    \ documents are clear and valid. If we have requested additional documentation,\
    \ provide it immediately.\n2. **Retry Authentication:** If the MFA process failed,\
    \ initiate the authentication step again. Ensure you are using the registered\
    \ mobile number.\n3. **Verify Mandate:** Ensure your bank account has sufficient\
    \ funds for the initial mandate verification and that the mandate was correctly\
    \ authorised.\n4. **Review KFS Acceptance:** Confirm that you have digitally acknowledged\
    \ the **Key Fact Statement (KFS)**, as disbursement cannot occur without this\
    \ confirmation.\n\n**When to Escalate:**\nIf the action remains 'Pending' for\
    \ more than 3 business days after you have completed the above steps, we will\
    \ raise a formal case with our credit operations team. You will receive a ticket\
    \ number via SMS/Email. If unresolved, the matter will be routed to our designated\
    \ Nodal Officer following the RBI's harmonised turn-around-time (TAT) framework.\
    \ \n\nFor issues regarding specific charges on your account, please refer to Consumer\
    \ Durable EMI — fee schedule."
