- id: 2f48c2b2-9972-5232-a6f2-e90b59009d08
  title: Two-Wheeler Loan — fraud and unauthorized-activity protection
  body: 'At Kalash Finserv, we are committed to protecting your financial journey.
    As you compare our Two-Wheeler Loan against other market offerings, please be
    aware of specific fraud patterns targeting vehicle financing. Scammers may pose
    as our agents, promising ''instant approval'' or ''zero down payment'' in exchange
    for an upfront processing fee paid to a personal account.


    **Crucial Security Protocols**

    We strictly adhere to RBI and NPCI security guidelines. To protect your account,
    please remember that Kalash Finserv agents are **strictly prohibited** from asking
    for your **UPI PIN, OTPs, or CVVs**. Any request for these details is a clear
    sign of fraudulent activity.


    **Verification Requirements**

    Before any fund disbursement or state-changing action on your loan, we mandate
    **Multi-factor authentication (MFA)** and **KYC verification**. This ensures that
    the person accessing the credit is the rightful applicant.


    **What to do if you suspect fraud**

    If you notice any unauthorized activity or receive a suspicious request for your
    credentials, you must report it to us immediately. To initiate a formal investigation,
    please follow the official chargeback path. Rapid reporting is essential to mitigate
    potential losses and secure your identity.


    ***

    **Regulatory Disclaimer:** Kalash Finserv does not take deposits. All lending
    activities are conducted in strict adherence to the RBI Fair Practices Code and
    Digital Lending Guidelines.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 45b5faf9-0b8e-54dd-a9a5-112df95802be
  title: Two-Wheeler Loan — account agreement
  body: 'This agreement outlines the binding obligations between Kalash Finserv and
    the borrower for the Two-Wheeler Loan.


    **1. Financial Obligations**

    The borrower agrees to repay the principal amount along with an **annual interest
    rate of 12.9%**. Repayments are structured over a fixed **tenure of 36 months**.
    A one-time **processing fee of ₹1500** is applicable at the time of loan sanctioning.


    **2. Down Payment Requirement**

    Loan disbursement is contingent upon the borrower providing a **down payment of
    15%** of the vehicle''s on-road price. This amount must be documented and paid
    to the dealer before the loan is funded.


    **3. Repayment and Default**

    Repayments must be made via the mandated payment engine. If a scheduled Equated
    Monthly Instalment (EMI) fails due to insufficient funds or mandate issues, an
    **EMI Bounce Charge** will be levied. We follow the RBI''s harmonised turn-around-time
    (TAT) framework for all resolution and refund requests.


    **4. Prepayment and Closure**

    Borrowers may pay off the remaining balance before the 36-month tenure ends. Such
    actions will trigger a **Foreclosure Charge**, the details of which are disclosed
    in the **Key Fact Statement (KFS)** provided before sanction.


    **5. Amendments and Termination**

    Kalash Finserv reserves the right to modify terms in accordance with Scale Based
    Regulation. Notice of changes will be provided as per regulatory requirements.
    This agreement terminates upon full repayment of the principal, interest, and
    all applicable fees, or upon the exercise of recovery rights due to prolonged
    default.


    ***

    **Regulatory Disclaimer:** We adhere strictly to the RBI Fair Practices Code,
    ensuring non-coercive collection practices.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 8d548e77-b77b-59c5-aa47-7b24a7d6e26f
  title: Two-Wheeler Loan — who it is best for and common use cases
  body: 'The Two-Wheeler Loan from Kalash Finserv is designed as accessible financing
    for mobility, specifically tailored for the emerging middle class and salaried
    professionals in India who require a reliable mode of transport for commuting
    or business.


    **Who is this best for?**

    This product is ideal for individuals who prefer a structured repayment plan over
    a medium term and have the capacity to make a modest initial investment in their
    vehicle.


    **Common Use Cases**

    *   **Daily Commuting:** Professionals moving to a new city who need a cost-effective
    way to reach their workplace.

    *   **Gig Economy Professionals:** Delivery partners and freelancers who require
    a vehicle to generate income.

    *   **Student Mobility:** Individuals needing independent transport for educational
    purposes.


    **Key Product Specifications**

    *   **Annual Interest Rate:** 12.9%

    *   **Loan Tenure:** 36 months

    *   **Required Down Payment:** 15%

    *   **One-time Processing Fee:** ₹1500


    **Our Commitment to Transparency**

    We maintain a ''no hidden charges'' policy. Before your loan is sanctioned, we
    provide a **Key Fact Statement (KFS)** which discloses the all-in annualised cost
    of credit, ensuring you know exactly what you are paying.


    ***

    **Disclaimer:** We provide financial education and product information but do
    not offer individualized tax, legal, or investment advice. Product recommendations
    are based on expressed needs and credit eligibility without guaranteeing specific
    financial outcomes.'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
