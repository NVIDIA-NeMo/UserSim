  institution_id: kalash_finserv
- id: 9a1bfc94-1f1f-5918-b0cd-2746c197e445
  title: Personal Loan — processing fee explained
  body: '**What is the processing fee for my Personal Loan?**

    We charge a processing fee of **2%** of the total loan amount. This fee is used
    to cover the operational costs associated with the credit appraisal, KYC verification,
    and loan documentation process.


    **When is this fee deducted?**

    The processing fee is typically deducted from the loan disbursement amount, meaning
    you will receive the loan principal minus the **2%** fee.


    **Can the processing fee be waived?**

    In line with our fee philosophy, we maintain a ''no hidden charges'' policy to
    ensure the sustainability of our lending pool. Therefore, processing fees are
    generally non-refundable and waivers are granted only under exceptional, documented
    circumstances.


    For a full list of all costs associated with your loan, please refer to Personal
    Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 9b25a79d-b68e-5411-8e15-5ca3aaab36ee
  title: Personal Loan — cancel, close, or downgrade
  body: 'If you wish to end your credit relationship with us or change your loan structure,
    please follow these steps. Note that since this is a disbursed loan, ''cancelling''
    refers to the foreclosure (early closure) of the account.


    **Requirements before starting**

    * Your registered mobile number for authentication.

    * The current outstanding principal balance of your loan.

    * Funds available in your account to cover the final settlement and the **4% foreclosure
    charge**.


    **Steps to Close Your Loan (Foreclosure)**

    1. **Request a Foreclosure Statement**: Ask us for your final settlement amount.
    We will provide a statement including the remaining principal and the **4% foreclosure
    charge**.

    2. **Confirm the Settlement Amount**: Review the statement to ensure all figures
    match your records.

    3. **Initiate Final Payment**: Provide us with the confirmation of the full payment
    of the settlement amount via your linked bank account.

    4. **Receive Closure Confirmation**: Once the payment is cleared, we will issue
    a No Objection Certificate (NOC) or a Loan Closure Letter via your registered
    email.


    **Steps to Downgrade/Restructure**

    1. **Request a Review**: Tell us that you wish to modify your current tenure or
    amount.

    2. **Eligibility Check**: We will evaluate your current repayment history and
    credit eligibility to see if a restructure is possible.

    3. **New Terms Agreement**: If approved, we will provide a new **Key Fact Statement
    (KFS)** detailing the revised terms.

    4. **Confirm Acceptance**: Once you agree to the new terms, we will update your
    repayment mandate.


    For more information on the costs of early closure, see Personal Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 80a07fd9-fadf-56fa-9f18-91e3cca3ee85
  title: Personal Loan — an unexpected charge or amount
  body: '**Symptom**: You notice a charge on your bank statement or loan account that
    you did not expect, or the EMI amount differs from your initial understanding.


    **Likely Causes**

    * **Repayment Failure**: If an EMI was missed or failed due to insufficient funds,
    an **EMI Bounce Charge of ₹500** has been applied.

    * **Early Repayment**: If you paid off the loan early, a **Foreclosure Charge
    of 4%** of the outstanding principal was applied.

    * **Interest Calculation**: The **annual interest rate of 14.5%** is calculated
    on a reducing balance basis, which may lead to differing interest components each
    month.


    **What to Check**

    1. **Check your Repayment Date**: Verify if the EMI was debited successfully on
    the scheduled date. If it failed, the ₹500 charge is correct.

    2. **Review your KFS**: Check the **Key Fact Statement (KFS)** provided at the
    start of the loan to confirm the agreed-upon fees and interest rate.

    3. **Verify Payment History**: Check for any partial payments or late payments
    that might have affected the balance.


    **The Fix**

    * **For Bounce Charges**: Ensure your account is funded before the next EMI date
    to avoid further **₹500** charges.

    * **For Discrepancies**: Provide us with the specific transaction date and amount
    you are questioning. We will conduct a reconciliation of your account.


    **When we will escalate**

    If we cannot resolve the discrepancy during the conversation, we will raise a
    formal dispute case. This will be routed to our specialized billing team, and
    you will receive a resolution update within the RBI''s harmonised turn-around-time
    (TAT) framework. For more on general errors, see Personal Loan — a failed or pending
    action.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
