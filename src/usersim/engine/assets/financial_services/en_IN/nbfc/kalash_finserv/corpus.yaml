  body: "Welcome to Kalash Finserv. We offer the **Consumer Durable EMI** plan, designed\
    \ to make essential electronics and home appliances affordable for the emerging\
    \ middle class and salaried professionals through interest-free short-term credit.\n\
    \nOur approach is built on transparency and speed. We ensure that you can acquire\
    \ the technology and appliances you need without the burden of accumulating interest\
    \ over time. \n\n**Key Product Specifications:**\n- **Annual Interest Rate:**\
    \ 0%\n- **Repayment Tenure:** 9 months\n- **One-time Processing Fee:** ₹499\n\
    - **Late Payment Charge:** ₹350 (applied per instance of late payment)\n\nWe adhere\
    \ to a strict 'no hidden charges' policy. Before your loan is sanctioned, we will\
    \ provide you with a **Key Fact Statement (KFS)**, which is a standardized document\
    \ disclosing the all-in cost of your credit, including the processing fee and\
    \ any applicable charges. \n\nTo ensure security and compliance with RBI guidelines,\
    \ all applicants must undergo mandatory KYC verification and Multi-factor authentication\
    \ (MFA) before fund disbursement. Please remember that Kalash Finserv agents will\
    \ never ask for your UPI PIN, OTP, or CVV. \n\nOur goal is to provide accessible\
    \ financing that fits your monthly budget while maintaining the long-term sustainability\
    \ of our lending pool. Whether you are upgrading your kitchen or investing in\
    \ a new laptop for work, the Consumer Durable EMI provides a structured, cost-effective\
