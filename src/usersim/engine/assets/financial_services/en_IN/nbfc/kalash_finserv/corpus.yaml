  institution_id: kalash_finserv
- id: 394231cd-2d3f-5ef4-8b01-00c3eb68851f
  title: Personal Loan — make a change or update
  body: 'If you need to update your personal details or modify your repayment settings
    for your **Personal Loan**, please follow these steps. We ensure all updates are
    handled securely via MFA.


    **Updating Contact Information**

    1. Tell us which specific detail needs updating (e.g., mobile number, email address,
    or residential address).

    2. Provide the new details and a valid supporting document for the change (e.g.,
    a recent utility bill or Aadhaar update).

    3. We will trigger a Multi-factor authentication (MFA) request to your registered
    device to verify your identity.

    4. Once verified, we will confirm that your records have been updated.


    **Modifying your Repayment Mandate**

    1. Tell us that you wish to change the bank account from which your EMIs are debited.

    2. Provide the new account details, including the account number and IFSC code.

    3. We will initiate a new KYC verification process for the new account to ensure
    security.

    4. Once the new mandate is authorised, we will confirm the date of the first debit
    from the new account.


    **Important Notes**

    * Ensure these updates are completed at least 10 working days before your next
    EMI date to avoid an **EMI Bounce Charge** of ₹500.

    * All updates are performed within our support hours: Monday to Saturday, 9:00
    AM to 7:00 PM IST.


    For guidance on closing your account entirely, please see Personal Loan — cancel,
    close, or downgrade.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 4774265f-cef9-59be-97dc-1b3d4497ea49
  title: Personal Loan — access or login problems
  body: "**Symptom**: You are unable to access your loan account details, view your\
    \ balance, or log in to the digital service portal.\n\n**Likely Causes**\n* Incorrect\
    \ credentials or an expired password.\n* MFA (Multi-factor authentication) failure\
    \ due to network issues or a change in registered mobile number.\n* Account lock\
    \ due to multiple failed login attempts.\n\n**Steps to Resolve**\n1. **Check Credentials**:\
    \ Ensure you are using the registered mobile number and correct password. Double-check\
    \ for typos.\n2. **Verify Connectivity**: Ensure your mobile device has a stable\
    \ network connection to receive the MFA code.\n3. **Reset Password**: If you have\
    \ forgotten your password, tell us you need a reset. We will send a verification\
    \ link to your registered email/mobile.\n4. **Update Mobile Number**: If you no\
    \ longer have access to the registered mobile number, tell us. We will initiate\
    \ a fresh KYC verification to update your contact details before restoring access.\n\
    \n**When to Escalate**\nIf you have completed the steps above and still cannot\
    \ access your account, or if you suspect your account was locked due to unauthorised\
    \ activity, we will raise a formal ticket with our technical security team. \n\
    \n**What happens next**\nWe will investigate the access logs and notify you via\
    \ your registered email once the access is restored or if further physical verification\
    \ is required. You can expect a resolution update within the RBI's harmonised\
    \ TAT framework. For issues related to specific payment failures, please refer\
    \ to Personal Loan — a failed or pending action."
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 06ad2ca7-3c9a-5453-8021-325396a86b12
  title: Personal Loan — qualification tiers
  body: 'This matrix helps support agents determine the qualification tier for a **Personal
    Loan** based on the customer''s profile. All tiers are subject to final credit
    approval and the issuance of a **Key Fact Statement (KFS)**.


    | Customer Profile | Credit Score | Income Stability | Outcome |

    | :--- | :--- | :--- | :--- |

    | Salaried Professional | High | $\ge$ 2 Years | **Preferred Tier**: Fast-track
    sanction, tenure up to 60 months, interest rate 14.5% |

    | Emerging Middle Class | Medium | $\ge$ 1 Year | **Standard Tier**: Standard
    sanction timeline, tenure up to 60 months, interest rate 14.5% |

    | New to Credit | N/A | $\ge$ 6 Months | **Basic Tier**: Subject to additional
    verification, tenure up to 60 months, interest rate 14.5% |

    | High Risk/Low Score | Low | Variable | **Ineligible**: Unable to offer unsecured
    funding at this time |


    **Key Terms for All Approved Tiers**:

    * Processing Fee: 2%

    * Foreclosure Charge: 4%

    * EMI Bounce Charge: ₹500'
