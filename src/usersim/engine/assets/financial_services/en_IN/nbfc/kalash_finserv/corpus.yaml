  institution_id: kalash_finserv
- id: 49f70aa4-f599-5833-8f4c-849093a01610
  title: EMI Repayment Mandate — risk disclosures
  body: 'This document provides essential risk disclosures regarding the **EMI Repayment
    Mandate**. Please read these carefully as they impact your financial obligations.


    **Repayment Risk and Penalties**

    Automated debits are dependent on the availability of funds in your linked bank
    account. Failure to maintain a sufficient balance will result in a failed transaction.
    In accordance with our fee philosophy, which ensures the sustainability of our
    lending pool, a penalty of ₹500 will be applied as an **EMI Bounce Charge** for
    every failed attempt.


    **Notification and Responsibility**

    We provide a pre-debit notification **24 hours** before the scheduled withdrawal.
    However, the ultimate responsibility for ensuring sufficient funds rests with
    the customer. A failure of the notification system does not waive the ₹500 bounce
    charge if the account is unfunded.


    **Amendment Timelines**

    Requests to change your repayment bank account are not instantaneous. There is
    a mandatory processing period of **3 days** for mandate amendments. If a loan
    repayment falls due during this **3 days** window, the debit will be attempted
    from the original account.


    **Regulatory Compliance**

    Kalash Finserv adheres strictly to the RBI Fair Practices Code and Digital Lending
    Guidelines. We do not take deposits. All costs associated with this mandate, including
    the bounce charges, are disclosed in the **Key Fact Statement (KFS)**. We employ
    non-coercive collection practices and mandate multi-factor authentication (MFA)
    for all account changes.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 479b327c-f215-5b79-99ef-53463b43584f
  title: EMI Repayment Mandate — how rates are tiered and applied
  body: 'The **EMI Repayment Mandate** is a payment service and does not carry an
    interest rate; however, it is governed by a flat fee structure for failures to
    ensure operational sustainability.


    **Applicable Charges**

    * **EMI Bounce Charge:** A flat fee of ₹500 is applied to every failed repayment
    attempt.


    **Application Logic**

    This charge is not tiered by loan amount or customer profile; it is applied uniformly
    to all customers regardless of the loan product (Personal, Gold, or Two-Wheeler
    Loan). The charge is triggered the moment the banking partner returns a ''failure''
    status for the debit request due to insufficient funds or mandate issues.


    **Changes to Fees**

    Any change to the ₹500 bounce charge will be communicated in accordance with our
    change-of-terms policy and will be reflected in the **Key Fact Statement (KFS)**
    for new loans.'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: rate_sheet
  source_authority: official
