- id: bbe2d8df-6b96-5791-be66-b905e15eddc5
  title: Personal Loan — foreclosure charge explained
  body: '**What is a Foreclosure Charge?**

    A **Foreclosure Charge** is a fee applied when a borrower chooses to pay off the
    entire remaining principal balance of their loan before the end of the agreed
    tenure (which is up to 60 months for our Personal Loan).


    **How much is the foreclosure charge for a Personal Loan?**

    At Kalash Finserv, the **Foreclosure Charge** for a Personal Loan is 4% of the
    outstanding principal balance at the time of closure.


    **Why does Kalash Finserv charge for foreclosure?**

    As per our fee philosophy, these charges are structured to cover operational costs
    and risk management, ensuring the long-term sustainability of our lending pool.
    All such charges are disclosed upfront in the **Key Fact Statement (KFS)**.


    For more information on all costs associated with your loan, please refer to Personal
    Loan — fee schedule.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
