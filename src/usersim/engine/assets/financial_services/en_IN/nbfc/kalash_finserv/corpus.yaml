  title: EMI Repayment Mandate — fee schedule
  body: 'The following fees apply to the **EMI Repayment Mandate**. In line with our
    transparency policy, these charges are disclosed upfront and are used to cover
    risk management and operational costs.


    | Fee Name | Amount | Condition |

    | :--- | :--- | :--- |

    | **EMI Bounce Charge** | **₹500** | Applied when a scheduled EMI repayment fails
    due to insufficient funds or mandate issues. |


    **Note to Agents:**

    - All fees are inclusive of applicable taxes unless stated otherwise.

    - Waivers for the **EMI Bounce Charge** are granted only under exceptional, documented
