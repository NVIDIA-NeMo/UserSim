- id: d37b000e-a736-5a73-92a5-10ed023ae585
  title: Personal Loan — a failed or pending action
  body: '**Symptom: Loan application is stuck in ''Pending'' or disbursement has failed.**


    If your **Personal Loan** application is not progressing or the funds have not
    arrived in your account, it is usually due to a verification or mandate issue.


    **Likely Causes**

    * **KYC Mismatch**: The details provided do not match the government records during
    the mandatory KYC verification.

    * **Mandate Failure**: The **EMI Repayment Mandate** was not successfully registered
    with your bank.

    * **MFA Timeout**: The multi-factor authentication process was not completed within
    the required timeframe.


    **What to check in order**

    1. **Verify Document Clarity**: Ensure that the uploaded images of your PAN and
    Aadhaar are clear and legible.

    2. **Check Bank Account Status**: Confirm that the bank account provided for disbursement
    is active and capable of receiving electronic transfers.

    3. **Confirm Mandate Status**: Check if you have received a confirmation from
    your bank regarding the activation of the repayment mandate.


    **The Fix**

    * If documents were rejected, provide us with fresh, clear copies of your KYC
    credentials.

    * If the mandate failed, we will help you re-initiate the mandate setup process
    to ensure your loan can be sanctioned.


    **When to Escalate**

    If you have completed all verification steps and the loan remains pending for
    more than 3 business days, we will raise a formal case with our credit operations
    team. You will receive a status update via your registered contact channel within
    48 hours.'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
