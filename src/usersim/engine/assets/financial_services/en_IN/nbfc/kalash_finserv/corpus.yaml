- id: b873b380-4d77-50bc-84da-1288e2af22e9
  title: Gold Loan — privacy and data handling
  body: "Kalash Finserv is committed to the protection of your personal and financial\
    \ data in accordance with Indian regulatory standards and the Digital Lending\
    \ Guidelines.\n\n**Data Collection and Purpose**\nWe collect personal identification\
    \ data through mandatory KYC and Multi-factor authentication (MFA) to prevent\
    \ fraud and ensure compliance with RBI's Scale Based Regulation. This data is\
    \ used exclusively for loan processing, credit eligibility assessment, and the\
    \ management of your Gold Loan account.\n\n**Collateral Documentation**\nDetails\
    \ regarding the weight, purity, and appraised value of your gold assets are recorded\
    \ and stored securely. This information is used to calculate your loan amount\
    \ based on the **Loan-to-Value (LTV)** cap of 75% and is referenced in your **Key\
    \ Fact Statement (KFS)**.\n\n**Third-Party Sharing**\nWe do not sell your personal\
    \ data. Information may be shared with: \n1. Credit bureaus for reporting repayment\
    \ history.\n2. Regulatory bodies (such as the RBI) as mandated by law.\n3. Approved\
    \ third-party appraisers solely for the purpose of valuing your gold collateral.\n\
    \n**Your Rights**\nCustomers have the right to access their data and request corrections\
    \ to their contact information. All data handling processes are designed to be\
    \ transparent, ensuring you are informed of the annual interest rate of 11.5%\
    \ and the processing fee of ₹500 without any hidden charges.\n\n**Security Safeguards**\n\
    We employ industry-standard encryption for all digital transactions. To maintain\
    \ security, remember that Kalash Finserv agents will never ask for your UPI PIN,\
    \ OTP, or CVV. Any such request should be treated as a breach of security and\
    \ reported immediately through our official chargeback path."
  domain: lending_mortgage
  product_category: gold_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
