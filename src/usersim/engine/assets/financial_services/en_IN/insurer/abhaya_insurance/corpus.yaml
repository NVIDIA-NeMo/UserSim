- id: c14d1367-f161-51dc-910b-ba2ae663c0df
  title: ULIP Wealth Plan — risk disclosures
  body: 'The following disclosures are provided in accordance with IRDAI regulations
    to ensure the ''Protection of Policyholders'' Interests''.


    Market Risk Disclosure:

    The ULIP Wealth Plan is a market-linked product. The investment risk is borne
    entirely by the policyholder. We ensure that no insurance product is misrepresented
    as a guaranteed-return investment. The fund value will fluctuate based on the
    performance of the underlying market assets.


    Liquidity Constraints:

    This plan features a mandatory lock-in period of 5 years. Funds cannot be withdrawn
    or the policy surrendered prior to the end of this period. Policyholders must
    ensure they have sufficient liquidity outside of this plan for short-term needs.


    Fee Disclosure:

    To maintain professional portfolio stewardship and operational sustainability,
    the following charges apply:

    - A premium allocation charge of 3% is deducted from the premium paid.

    - A fund management charge of 1.35% is applied to the fund value.


    Premium Obligation:

    The plan is designed with an annual premium of ₹50000. Non-payment of premiums
    may affect the life cover and the eventual maturity value of the policy.


    Advice Boundary:

    While we provide comprehensive product education and suitability guidance, Abhaya
    Insurance does not provide specific legal or tax advice. We strongly recommend
    consulting a qualified professional for tax planning related to your ULIP investments.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0f80f990-2350-5535-9b9f-87bcfa4e4c68
  title: ULIP Wealth Plan — how rates are tiered and applied
  body: 'The ULIP Wealth Plan employs a flat-fee structure rather than tiered rates,
    ensuring transparency for all policyholders regardless of their total fund value.


    Applicable Rates:

    - Premium Allocation Charge: 3%. This is a one-time deduction applied to each
    premium payment of ₹50000 before the funds are allocated to your investment choice.

    - Fund Management Charge: 1.35%. This is an ongoing annual charge, calculated
    on the average fund value and deducted proportionally to cover professional stewardship.


    Application:

    These rates are applied uniformly across all ULIP Wealth Plan accounts. They are
    not subject to change based on the age of the policyholder or the performance
    of the market. Any future regulatory changes mandated by the IRDAI may result
    in an update to these rates, which will be communicated to you in writing.'
