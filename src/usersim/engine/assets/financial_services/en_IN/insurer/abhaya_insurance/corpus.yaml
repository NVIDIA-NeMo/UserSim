- id: a15f3325-8d28-5ced-b917-949c22b4a3e4
  title: Motor Own-Damage Cover — access or login problems
  body: '**Symptom:** You are unable to access your policy documents or the digital
    portal to review your Motor Own-Damage Cover details.


    **Likely Causes:**

    - Incorrect login credentials or an expired password.

    - MFA (Multi-factor authentication) failure due to an outdated mobile number.

    - Account lockout following multiple unsuccessful login attempts.


    **Steps to Resolve:**

    1. **Verify Credentials:** Ensure you are using the registered email address and
    the correct password. If you have forgotten your password, ask us to initiate
    a password reset.

    2. **Check MFA Connectivity:** If you are not receiving the MFA code, confirm
    that the mobile number we have on file is correct. If it is outdated, we will
    require you to undergo a full KYC verification to update your contact details.

    3. **Clear Browser Cache:** If the portal is failing to load despite correct credentials,
    please clear your browser cache and attempt to log in again.


    **When to Escalate:**

    If you have completed the steps above and still cannot access your account, tell
    us. We will then raise a technical support case with our IT security team to investigate
    a potential account block. You will receive an update on the status of your access
    within 2 business days. For urgent matters, such as needing to perform a Claim
    Intimation, we can verify your identity via our helpline during IST business hours
    to assist you manually.'
