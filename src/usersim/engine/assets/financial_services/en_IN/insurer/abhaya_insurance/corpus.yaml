- id: 15c8f2ec-8e49-5a7e-a321-c0749367b49c
  title: Family Health Indemnity — cancel, close, or downgrade
  body: 'If you find that your health insurance needs have changed or you are comparing
    this against alternatives and decide to move on, follow these steps to cancel,
    close, or downgrade your Family Health Indemnity policy.


    Prerequisites:

    You will need your policy number and a valid government-issued ID for KYC verification.


    Steps to Close or Downgrade:

    1. State your intent to cancel, close, or downgrade your policy. If you are downgrading,
    tell us the new sum insured you wish to move to.

    2. Provide your identity for verification. We will perform a mandatory KYC check
    and send a Multi-factor authentication (MFA) request to your registered mobile
    number to prevent unauthorised changes.

    3. Confirm the effective date of the change. We will inform you if this falls
    within the Free-look Period (if applicable), which would allow for a full refund
    of your ₹9,500 premium.

    4. Review the impact on your waiting periods. We will explain how a downgrade
    or a break in policy may reset your initial waiting period of 30 days or your
    Pre-existing Disease (PED) waiting period of 36 months.

    5. Receive the formal confirmation. We will provide a closing statement or a revised
    policy schedule reflecting the new terms and any pro-rata refund due.


    Once you receive the confirmation document, your request is complete. For information
    on how to initiate a claim before closing, please see Family Health Indemnity
    — overview.'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
