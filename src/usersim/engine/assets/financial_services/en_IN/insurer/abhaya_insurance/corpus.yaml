- id: b1d86fd9-5110-5477-8e4a-fe768f526b80
  title: ULIP Wealth Plan — privacy and data handling
  body: 'At Abhaya Insurance, we prioritize the ''Protection of Policyholders'' Interests''
    through transparent data privacy practices and strict adherence to IRDAI regulations.


    **Data Collection and Purpose**

    To manage your ULIP Wealth Plan, we collect personal identifiers, financial records,
    and KYC documentation. This data is used exclusively for:

    1. Verifying your identity via Multi-factor authentication (MFA) for state-changing
    actions.

    2. Managing your investment portfolio and calculating the fund management charge
    of 1.35%.

    3. Ensuring the precise capture of nominee details for the disbursement of life
    cover benefits.

    4. Processing the annual premium of ₹50,000 and applying the premium allocation
    charge of 3%.


    **Data Security and Access**

    We maintain a zero-trust stance regarding identity validation. No employee or
    third party can initiate a fund withdrawal or policy amendment without the completion
    of mandatory MFA and KYC verification. Your data is encrypted and stored according
    to the highest industry standards to prevent unauthorized access.


    **Third-Party Disclosure**

    We do not sell your personal data. Information may only be shared with:

    - Regulatory authorities (such as IRDAI) for compliance and reporting.

    - Law enforcement agencies in the event of fraudulent claims, which we handle
    with a zero-tolerance policy.

    - Authorized fund managers necessary for the professional portfolio stewardship
    of your ULIP investments.


    **Your Rights**

    You have the right to review your data and request corrections. Any changes to
    your contact information or nominees must follow the secure update process to
    ensure the integrity of your policy. For more information on our general terms,
    see ULIP Wealth Plan — account agreement.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 687c6215-74ff-59d4-81ef-4c82302d7e53
  title: ULIP Wealth Plan — recognizing scams targeting this product
  body: "As you evaluate the ULIP Wealth Plan alongside other investment and insurance\
    \ options, please be vigilant against fraudulent schemes that specifically target\
    \ hybrid products. Because our plan combines life cover with market-linked growth,\
    \ scammers often attempt to mimic this structure to deceive prospective customers.\n\
    \nCommon fraud patterns include:\n- **Guaranteed Return Promises**: You may encounter\
    \ third-party agents claiming that the ULIP Wealth Plan offers a 'guaranteed'\
    \ high-percentage return. We explicitly state that this is a market-linked product;\
    \ any representation of guaranteed returns is a red flag. We ensure no insurance\
    \ product is misrepresented as a guaranteed-return investment.\n- **Urgency Scams**:\
    \ Fraudsters may pressure you to transfer funds immediately to 'lock in' a special\
    \ rate or bypass the mandatory 5 lock-in years. \n- **Payment Redirection**: Be\
    \ wary of requests to send your annual premium of ₹50000 to an individual's personal\
    \ account or a non-Abhaya Insurance corporate entity.\n\n**What We Will Never\
    \ Ask For**\nWe will never ask for your Multi-factor authentication (MFA) codes,\
    \ your passwords, or request that you transfer premiums to a private bank account\
    \ via a phone call or unsecured email.\n\n**Immediate Action**\nIf you encounter\
    \ a suspicious offer or believe your identity has been compromised, notify us\
    \ immediately. We maintain a zero-tolerance policy toward fraud, involving rigorous\
    \ investigation and reporting to regulatory authorities. Rapid reporting is essential\
    \ to protect your interests and ensures we can take swift action to secure your\
    \ potential policy.\n\n***\n**Disclaimer**: This advisory is for educational purposes.\
    \ For a full understanding of the risks associated with market-linked plans, please\
    \ review the ULIP Wealth Plan — risk disclosures."
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1015fe14-06a2-5f4c-986f-28e42de11e5f
  title: ULIP Wealth Plan — limits, restrictions, and edge cases
  body: 'This document provides support agents with the critical limits and restrictions
    governing the ULIP Wealth Plan to ensure accurate customer guidance.


    **Core Financial Parameters**

    - **Annual Premium**: The plan requires a consistent annual premium of ₹50000.

    - **Lock-in Period**: There is a mandatory lock-in period of 5 years. No partial
    withdrawals or full surrenders are permitted before this duration is complete.

    - **Premium Allocation Charge**: A charge of 3% is applied to the premium before
    it is allocated to the chosen funds.

    - **Fund Management Charge**: To ensure professional portfolio stewardship, an
    annual charge of 1.35% is levied on the fund value.


    **Restrictions and Edge Cases**

    - **Early Exit**: Requests for fund withdrawal prior to the completion of the
    5 lock-in years must be declined, except in cases mandated by IRDAI regulations
    (e.g., terminal illness).

    - **Payment Defaults**: If the annual premium of ₹50000 is not received within
    the grace period, the policy may lapse, affecting the life cover and the investment
    growth.

    - **Market Volatility**: As a market-linked hybrid vehicle, the fund value can
    fluctuate. Agents must not guarantee a specific yield; they should focus on the
    long-term wealth creation objective.

    - **Switching Limits**: While fund switching is permitted, it must be performed
    according to the plan''s specific frequency limits to avoid excessive churn.


    **Compliance Note**

    Always emphasize the Free-look Period (typically 15 days) during which the policyholder
    can review the terms and return the policy for a refund. Ensure that the nominee
    capture is precise during the application process to avoid future settlement disputes.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 06cdb272-fafd-5a0b-b1bc-d2ea82e01f06
  title: ULIP Wealth Plan — premium allocation charge explained
  body: "**What is the Premium Allocation Charge?**\nThe Premium Allocation Charge\
    \ is a one-time fee deducted from the premium you pay before the remaining amount\
    \ is invested in your chosen funds. This charge covers the initial costs of processing\
    \ your application, underwriting the risk, and establishing your policy.\n\n**How\
    \ much is the charge for the ULIP Wealth Plan?**\nFor the ULIP Wealth Plan, the\
    \ premium allocation charge is 3% of the premium paid. \n\n**How does this affect\
    \ my investment?**\nIf you pay an annual premium of ₹50000, the 3% charge (amounting\
    \ to ₹1500) is deducted first, and the remaining ₹48500 is allocated toward your\
    \ investment funds and life cover. This ensures that the administrative overhead\
    \ of setting up your policy is covered while the bulk of your capital works toward\
    \ your long-term wealth goals."
  domain: insurance
  product_category: ulip_wealth_plan
