- id: 8e1442cc-1d49-54ec-a4c9-9e723b769d91
  title: Abhaya Term Life Cover — set up and activate
  body: 'Activating your Abhaya Term Life Cover is a streamlined process designed
    to move you from application to protection as quickly as possible. Follow these
    steps to secure your coverage:


    1. **Submit Personal and Financial Details:** Provide us with your age, income
    proof, and medical history. Ensure all Pre-existing Diseases (PED) are disclosed
    accurately to avoid future claim disputes.

    2. **Nominee Designation:** Clearly state the name and relationship of the person(s)
    who should receive the Sum Assured of ₹10000000. Precise nominee capture is a
    mandatory regulatory requirement.

    3. **Underwriting and Medical Examination:** Based on your profile, we will notify
    you if a medical check-up is required. We will handle the coordination of these
    tests to ensure a professional assessment of risk.

    4. **Premium Payment:** Once the proposal is accepted, pay the annual premium
    of ₹12000. Your coverage begins from the date the first premium is received and
    the policy is issued.

    5. **Policy Review (Free-look):** Upon receiving your policy documents, you have
    a period of 15 days to review the terms. If you are satisfied, no further action
    is needed. If not, you may request a refund within this window.


    **How you know it worked:**

    Your activation is complete when you receive the formal Policy Schedule document
    and a confirmation email stating your policy is ''Active''. This document will
    explicitly list your Sum Assured of ₹10000000 and your policy term of 30 years.'
