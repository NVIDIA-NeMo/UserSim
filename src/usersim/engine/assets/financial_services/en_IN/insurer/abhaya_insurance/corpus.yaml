- id: a0d917a7-1fac-5bce-a47f-3cce7d49a528
  title: Family Health Indemnity — a failed or pending action
  body: 'If you are experiencing an issue with your policy activation or a pending
    amendment, please refer to the following guide. We aim to resolve all disputes
    with neutrality and speed.


    **Symptom: ''Policy activation is pending'' or ''Premium payment failed''**


    **Likely Causes:**

    1. **KYC Discrepancy:** The documents provided did not match the identity details
    entered.

    2. **MFA Failure:** The multi-factor authentication step was not completed successfully.

    3. **Payment Gateway Timeout:** The transaction for the ₹9,500 premium was initiated
    but not confirmed by the bank.


    **Steps to Resolve:**

    1. **Check Payment Status:** Verify if the amount of ₹9,500 has been debited from
    your account. If debited but the policy is pending, provide us with the transaction
    reference number.

    2. **Re-verify KYC:** Ensure that the uploaded documents are clear and current.
    If we find a mismatch, we will request a fresh upload of your identity proof.

    3. **Retry MFA:** If the identity validation failed, we will trigger a new authentication
    request to your registered mobile number.


    **When we escalate:**

    If the issue is not resolved through these steps, we will raise a formal case
    with our underwriting and compliance team. You will receive a case reference number
    and a status update within 3 business days. For persistent grievances, the matter
    can be escalated to our Grievance Redressal Officer and, if necessary, the Insurance
    Ombudsman.'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
