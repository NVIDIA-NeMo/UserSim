- id: e3b7cc5b-b982-5947-b81e-edf1017857cb
  title: Family Health Indemnity — account security best practices
  body: 'At Abhaya Insurance, we maintain a zero-trust stance regarding identity validation,
    particularly for sensitive actions like claim settlements or policy amendments.
    To protect your Family Health Indemnity coverage, we urge you to follow these
    security best practices.


    **Understanding our Verification Process**

    We mandate Multi-factor authentication (MFA) and rigorous KYC verification before
    any state-changing action is performed on your account. Whether you are updating
    your nominee or requesting a fund withdrawal, these steps are non-negotiable to
    prevent unauthorised access.


    **Common Fraud Patterns**

    Be vigilant against ''Urgency Scams'' where fraudsters pose as insurance agents
    claiming your policy will lapse unless a payment is made immediately to a personal
    account. Remember, all premiums for your Family Health Indemnity plan, including
    the annual premium of ₹9,500, should only be paid through our official verified
    channels.


    **What We Will Never Ask For**

    Abhaya Insurance will never ask you for your MFA passwords, PINs, or full credit
    card details via SMS or email. Any request for such sensitive data should be treated
    as a fraudulent attempt.


    **Immediate Action Steps**

    If you notice any suspicious activity—such as an unauthorised change to your contact
    details or an unexpected notification regarding your sum insured of ₹5,00,000—you
    must notify us within 24 hours. Prompt reporting is critical to limiting your
    liability and allowing our investigation team to freeze the account.


    Our zero-tolerance policy toward fraud ensures that any fraudulent claims are
    reported directly to the regulatory authorities. By adhering to these protocols,
    we can collectively ensure the integrity of your health protection.'
  domain: insurance
  product_category: health_indemnity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 33ad4ec5-67d3-589a-9a7c-5c67427302d0
  title: Family Health Indemnity — change-of-terms policy
  body: 'This document outlines the conditions under which the terms of your Family
    Health Indemnity policy may be amended. As a provider committed to transparency
    and IRDAI regulations, we ensure that any modification to your coverage is communicated
    clearly and fairly.


    **Right to Amend**

    Abhaya Insurance reserves the right to modify policy terms, including the annual
    premium of ₹9,500, the sum insured of ₹5,00,000, or the room rent cap of 1% of
    the sum insured, to reflect changes in medical inflation or risk profiles. Such
    changes will be applied during the annual renewal cycle.


    **Notice Period**

    We will provide a minimum of 30 days'' written notice prior to any material change
    in terms or premiums. This notice allows you to review the updated terms and decide
    whether to continue with the coverage.


    **Acceptance and Opt-out**

    Payment of the renewed premium constitutes acceptance of the revised terms. If
    you find the new terms unsuitable, you may choose not to renew the policy. Please
    note that any gap in coverage may reset the waiting periods, such as the 30 days
    initial waiting period or the 36 months waiting period for Pre-existing Diseases
    (PED).


    **Dispute Resolution**

    Any disputes arising from a change in terms will be handled with neutrality and
    speed. We aim for resolution within the defined IRDAI timelines. If a resolution
    is not reached, you may escalate the matter to our Grievance Redressal Officer
    and subsequently to the Insurance Ombudsman.


    **Termination**

    Either party may terminate this agreement. Policyholders may exercise their right
    to return the policy for a refund during the Free-look Period, provided the request
    is made within the specified window (e.g., 15 days) of receiving the policy document.'
