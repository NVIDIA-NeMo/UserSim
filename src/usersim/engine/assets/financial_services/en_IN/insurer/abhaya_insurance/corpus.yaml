- id: 01182b1d-5fc6-512d-8a57-4fce5a19d134
  title: Abhaya Term Life Cover — risk disclosures
  body: 'This document provides essential risk disclosures for the Abhaya Term Life
    Cover in accordance with IRDAI guidelines. Please read these carefully before
    committing to the policy.


    1. Pure Protection Nature:

    The Abhaya Term Life Cover is a pure life insurance product. It is NOT an investment
    or a guaranteed-return vehicle. The annual premium of ₹12000 is paid solely for
    the risk cover of ₹10000000. If the policy expires at the end of the 30 years
    term without the occurrence of the insured event, no maturity value or premium
    refund is payable.


    2. Underwriting and Disclosure:

    Coverage is subject to the truthfulness of the information provided. Any non-disclosure
    of material facts, such as Pre-existing Diseases (PED), smoking habits, or high-risk
    hobbies, may lead to the repudiation of a claim. We emphasize the importance of
    precise nominee capture to avoid legal disputes during settlement.


    3. Lapsing and Grace Period:

    To keep the sum assured of ₹10000000 active, premiums must be paid on time. While
    we provide a grace period of 30 days, any payment made after this window will
    result in the policy lapsing, and coverage will cease immediately.


    4. The Free-look Window:

    Policyholders are entitled to a 15 days free-look period from the date of receipt
    of the policy. This is the only window during which the policy can be returned
    for a refund of premiums paid, minus costs associated with medical exams and stamp
    duty.


    5. Regulatory Compliance:

    We adhere to the ''Protection of Policyholders'' Interests'' regulations. All
    claims are processed based on the evidence provided and are subject to rigorous
    investigation to prevent fraud.


    For more information on how we handle your data, please see Abhaya Term Life Cover
    — privacy and data handling.'
