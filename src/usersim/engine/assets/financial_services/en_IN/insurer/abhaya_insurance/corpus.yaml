- id: e9bb68b6-434b-5502-a36c-2ebc808ee22a
  title: Motor Own-Damage Cover — no claim bonus first year explained
  body: '**What is the No Claim Bonus (NCB) for the first year of the Motor Own-Damage
    Cover?**

    For policyholders who do not file a claim during their first policy year, we offer
    a No Claim Bonus of 20%. This serves as a reward for safe driving and reduces
    the cost of subsequent renewals.


    **How is the NCB applied?**

    The bonus is applied as a discount on the premium for the following year, provided
    the policy is renewed on time and no claims were made. If a claim is filed, the
    bonus for that period is forfeited.


    **Does this affect my initial annual premium?**

    No, the initial annual premium of ₹7500 is the base cost. The No Claim Bonus of
    20% is an earned benefit that applies to your future renewals based on your claim
    history with Abhaya Insurance.'
