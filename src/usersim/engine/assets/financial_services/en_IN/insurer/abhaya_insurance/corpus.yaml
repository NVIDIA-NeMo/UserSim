- id: 03c18adf-7997-5eaa-8599-3e1cb84b603d
  title: ULIP Wealth Plan — a declined or blocked action
  body: '**Symptom**

    You attempted to withdraw funds, switch funds, or amend your policy details, but
    the request was declined or blocked.


    **Likely Causes**

    - **Lock-in Period Constraint**: The most common cause is attempting a withdrawal
    before the 5 lock-in years have elapsed. Per the plan terms, funds are unavailable
    until this period expires.

    - **Verification Failure**: The action was blocked because Multi-factor authentication
    (MFA) or KYC verification was not successfully completed. We maintain a zero-trust
    stance regarding identity validation for all state-changing actions.

    - **Payment Default**: A pending annual premium of ₹50000 may have caused the
    policy to enter a ''lapsed'' or ''inactive'' state, blocking fund switches.


    **What to Check**

    1. **Check the Policy Date**: Verify if 5 full years have passed since the policy
    inception. If not, the withdrawal is blocked by design.

    2. **Verify KYC Status**: Confirm if your KYC documents are up to date. If they
    have expired, the action will be blocked.

    3. **Payment Status**: Review your last payment to ensure the annual premium was
    successfully processed.


    **The Fix**

    - **For Lock-in**: If you are within the 5 lock-in years, you must wait until
    the period expires before requesting a withdrawal.

    - **For Verification**: Provide the requested KYC documents or re-attempt the
    MFA process during your conversation with us.

    - **For Lapsed Policies**: Arrange for the payment of any outstanding annual premiums
    of ₹50000 to reinstate the policy.


    **When to Escalate**

    If you have completed the 5 lock-in years and passed all MFA checks but the action
    is still blocked, we will raise a high-priority case with our technical operations
    team. You will receive a resolution or a detailed explanation within the standard
    IRDAI timelines.'
