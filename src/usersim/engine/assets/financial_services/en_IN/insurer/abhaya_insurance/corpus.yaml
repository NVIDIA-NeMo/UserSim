- id: 82ef97bb-3f7c-5eb9-8584-262b7f552989
  title: Motor Own-Damage Cover — privacy and data handling
  body: 'Abhaya Insurance is committed to the ''Protection of Policyholders'' Interests''
    and adheres strictly to IRDAI regulations regarding data privacy and handling
    for the Motor Own-Damage Cover.


    **Data Collection and Use**

    We collect personal identifiers, vehicle registration details, and KYC documentation
    to perform fair underwriting and prevent fraud. This data is used exclusively
    for policy administration, risk assessment, and the processing of claim intimations.
    We do not sell your personal data to third-party marketing agencies.


    **Verification and Security**

    To prevent identity theft and fraudulent claims, we maintain a zero-trust stance.
    Multi-factor authentication (MFA) is required for all state-changing actions.
    We perform rigorous investigations into all claim settlements to ensure the integrity
    of our fund pool, which allows us to maintain a competitive annual premium of
    ₹7500.


    **Disclosure of Limits**

    In accordance with regulatory mandates, we clearly disclose all policy limitations.
    This includes the compulsory deductible of ₹1000, which is the policyholder''s
    responsibility for every claim. We also disclose that the No Claim Bonus of 20%
    is only applicable if no claims are filed during the policy year.


    **Data Retention and Rights**

    Your data is retained for the duration of the policy and for a subsequent period
    as required by IRDAI for audit and legal purposes. You have the right to request
    a summary of the data we hold about you. Any disputes regarding data handling
    will be treated with neutrality and speed, following our tiered escalation path
    from customer support to the Insurance Ombudsman.'
