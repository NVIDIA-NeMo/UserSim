- id: d5e4d5fe-8309-5fe2-a70f-4dea4f7bb169
  title: Family Health Indemnity — qualification tiers
  body: 'The following matrix outlines the qualification and underwriting outcomes
    for the Family Health Indemnity plan. All applicants must pass basic KYC verification
    to be considered.


    | Applicant Condition | Underwriting Outcome | Coverage Note |

    | :--- | :--- | :--- |

    | No Pre-existing Diseases (PED) | Standard Approval | Full sum insured of ₹5,00,000
    applies after 30 days initial waiting period. |

    | Declared PED (Low Risk) | Approved with Waiting Period | Sum insured of ₹5,00,000
    applies to PED after 36 months. |

    | Declared PED (High Risk) | Approved with Loading | Annual premium of ₹9,500
    may be increased based on risk profile. |

    | Undisclosed PED (Discovered) | Claim Rejection / Termination | Zero-tolerance
    policy; claim rejected and potential policy cancellation. |

    | Age outside standard bracket | Special Underwriting | May require medical screening
    before granting ₹5,00,000 cover. |'
