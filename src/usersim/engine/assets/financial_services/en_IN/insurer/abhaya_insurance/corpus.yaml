- id: cf3f2972-252d-596c-80c6-422dad2a3fb3
  title: Abhaya Term Life Cover — privacy and data handling
  body: 'Abhaya Insurance adheres to a strict risk and compliance posture, prioritizing
    the protection of policyholders'' interests in accordance with IRDAI regulations.
    This disclosure explains how we handle your data for the Abhaya Term Life Cover.


    **Data Collection and Purpose**

    We collect personal, financial, and medical data to perform fair underwriting
    and ensure that the annual premium of ₹12,000 is risk-aligned. This data is essential
    to maintain the validity of the ₹1,000,000,00 sum assured and to process claims
    accurately for your nominees.


    **Identity Verification and Zero-Trust**

    We employ a zero-trust stance regarding identity validation. Multi-factor authentication
    (MFA) and KYC verification are mandatory before any state-changing action—such
    as amending the 30 years policy term or updating nominee details—to prevent fraudulent
    activity.


    **Data Sharing and Confidentiality**

    Your data is shared only with authorized regulatory bodies (such as IRDAI) or
    third-party medical examiners required for underwriting. We do not sell policyholder
    data to external marketing agencies.


    **Policyholder Rights**

    Under our transparency commitment, you have the right to request a summary of
    the data we hold about you. During your 15 days Free-look Period, you may choose
    to terminate the policy, upon which your data will be handled according to statutory
    retention periods required by law.


    **Dispute Handling**

    Any disputes regarding data handling or policy administration are treated with
    neutrality and speed, with a target resolution within defined IRDAI timelines.
    Escalations are handled via the Grievance Redressal Officer and the Insurance
    Ombudsman.'
