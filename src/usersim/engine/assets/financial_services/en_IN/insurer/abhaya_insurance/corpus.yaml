- id: c0cfebce-bcd4-56ed-bd7c-341f7032813b
  title: ULIP Wealth Plan — check status or history
  body: "Follow these steps to review the current valuation and payment history of\
    \ your ULIP Wealth Plan.\n\n**Prerequisites**\n- Your registered mobile number\
    \ for Multi-factor authentication (MFA).\n- Your Policy Number.\n\n**Steps to\
    \ Check Status**\n1. **Request Policy Overview**: Tell us that you wish to see\
    \ the current status and history of your ULIP Wealth Plan. \n2. **Identity Verification**:\
    \ We will trigger a Multi-factor authentication (MFA) request to your registered\
    \ mobile device. Confirm this request to validate your identity.\n3. **Review\
    \ Premium History**: We will provide a summary of all premiums paid, including\
    \ the confirmation of your annual premium of ₹50000 for the current cycle.\n4.\
    \ **Check Fund Value**: We will share the current market value of your invested\
    \ units, after the deduction of the 1.35% fund management charge.\n5. **Verify\
    \ Lock-in Status**: We will confirm how many years remain of your 5 lock-in years\
    \ period, which determines when you can first access your funds.\n\n**How you\
    \ know it worked**\nYou will receive a comprehensive summary including your total\
    \ premiums paid, the current fund value, and the exact date your lock-in period\
    \ expires. If you notice any discrepancy in these figures, you may request a detailed\
    \ statement for the current financial year."
