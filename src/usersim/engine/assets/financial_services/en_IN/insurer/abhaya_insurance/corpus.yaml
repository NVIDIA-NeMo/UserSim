- id: 3d4437e4-0c61-50f8-8416-ff54331ed5d6
  title: Family Health Indemnity — an unexpected charge or amount
  body: 'It can be concerning to see a charge or a claim deduction that you did not
    expect. For the Family Health Indemnity plan, this usually relates to specific
    policy caps rather than billing errors.


    Symptom: ''My hospital bill was fully covered by the sum insured, but Abhaya Insurance
    did not reimburse the full room rent.''


    Likely Causes:

    1. Room Rent Sub-limit: The most common cause is the room rent cap, which is 1%
    of the sum insured. For your ₹500,000 sum insured, the maximum we pay for room
    rent is ₹5,000 per day. Any amount exceeding this is a customer liability.

    2. Initial Waiting Period: If the claim occurred within 30 days of policy inception,
    it may have been declined (unless it was an accident).

    3. Pre-existing Disease (PED): If the treatment was for a condition diagnosed
    before the policy started and the 36 months waiting period has not elapsed, the
    claim will not be payable.


    What to check in order:

    1. Check the hospital bill for the daily room rate. Is it above ₹5,000?

    2. Check the date of admission. Was it within 30 days of the policy start date?

    3. Review the diagnosis. Was this condition present before you joined Abhaya Insurance?


    Resolution:

    - If the deduction is due to the 1% room rent cap or waiting periods, the charge
    is correct as per the account agreement.

    - If you believe there is a clerical error, tell us the specific bill date and
    amount. We will raise a case with our claims auditing team.

    - Once audited, we will provide a detailed settlement sheet within the standard
    IRDAI timelines. If an error is found, we will apply a corrective payment to your
    registered bank account.'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
