- id: c277b5ca-5ab2-5e59-80d3-0a56a82a0260
  title: Family Health Indemnity — getting started walkthrough
  body: 'This guide is designed to assist support agents in onboarding customers to
    the Family Health Indemnity plan. This product provides comprehensive medical
    coverage for the family with a focus on transparency and fair underwriting.


    **Core Product Specifications**

    Ensure the customer is aware of the following primary values:

    - **Sum Insured:** ₹5,00,000

    - **Annual Premium:** ₹9,500

    - **Room Rent Cap:** 1% of the sum insured (which equates to ₹5,000 per day).


    **The Onboarding Workflow**

    1. **KYC and Verification:** Begin by conducting mandatory KYC verification. No
    policy can be issued without valid identity and address proof.

    2. **Medical Declaration:** Carefully capture all Pre-existing Diseases (PED).
    Explain that these are subject to a mandatory waiting period of 36 months before
    coverage applies.

    3. **Premium Payment:** Facilitate the payment of the ₹9,500 annual premium. Confirm
    the payment and issue the policy schedule.

    4. **The Free-look Window:** Explicitly inform the customer about the Free-look
    Period (typically 15 days). Explain that they can review all terms, including
    the room rent cap and exclusions, and return the policy for a refund if unsatisfied.

    5. **Waiting Period Education:** Clarify that there is an initial waiting period
    of 30 days from the date of inception; no claims (except for accidents) are admissible
    during this time.


    **Support Tips**

    If the customer asks about higher coverage, refer them to Family Health Indemnity
    — choosing between tiers or options. Always emphasize that Abhaya Insurance adheres
    strictly to IRDAI regulations to protect the policyholder''s interests.'
