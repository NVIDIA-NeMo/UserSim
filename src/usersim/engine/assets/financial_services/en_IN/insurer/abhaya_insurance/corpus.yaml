- id: 8dea1ae5-7a2e-59b3-b86c-adc4d652e1f1
  title: Abhaya Term Life Cover — sum assured explained
  body: '**What exactly is the Sum Assured in my Abhaya Term Life Cover?**

    The Sum Assured is the guaranteed amount that we pay to your designated nominees
    in the event of the policyholder''s death during the policy term. For this specific
    plan, the Sum Assured is ₹10000000.


    **Does the Sum Assured increase over the 30 years of the policy term?**

    No, the Sum Assured for this product remains constant at ₹10000000 throughout
    the duration of the policy. It is designed to provide a stable, high-value safety
    net for your family.


    **Can I change the Sum Assured after the policy has been issued?**

    Changes to the core coverage amount typically require a fresh underwriting process.
    We recommend reviewing your needs during the 15 days provided in the Free-look
    Period as detailed in Abhaya Term Life Cover — overview.'
  domain: insurance
  product_category: term_life_cover
