- id: 494e4ef0-a047-5ff9-ad9e-13b114e92e57
  title: Family Health Indemnity — vs. a similar product here
  body: 'When choosing between health and life protection, it is important to understand
    the structural differences. We compare the Family Health Indemnity plan against
    the Abhaya Term Life Cover.


    **Family Health Indemnity**

    * **Purpose:** Medical reimbursement and hospitalization.

    * **Cost:** Annual premium of ₹9,500.

    * **Benefit:** Sum insured of ₹500,000 used to offset hospital bills.

    * **Key Constraint:** 30-day initial waiting period and 1% room rent cap.

    * **Best for:** Those seeking a shield against rising healthcare costs and hospital
    bills.


    **Abhaya Term Life Cover**

    * **Purpose:** Financial security for dependents upon the death of the insured.

    * **Benefit:** A high-value death benefit (sum assured).

    * **Key Constraint:** Pure protection; no maturity benefit.

    * **Best for:** Those looking to secure their family''s long-term financial future
    against the risk of untimely demise.


    While one protects your health and the other protects your family''s future, using
    both provides a comprehensive safety net.'
  domain: insurance
  product_category: health_indemnity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 7aa9de21-a83d-5e51-8add-31d16aa05b70
  title: Family Health Indemnity — regulatory disclosures
  body: 'Abhaya Insurance is committed to the ''Protection of Policyholders'' Interests''
    as mandated by IRDAI. This document provides mandatory disclosures for the Family
    Health Indemnity product.


    **1. Coverage Limitations and Sub-limits**

    Policyholders must be aware that not all expenses are covered up to the full sum
    insured of ₹500,000. Specifically, we apply a **sub-limit on room rent**, which
    is capped at 1% of the sum insured. Any room charges exceeding this percentage
    will be treated as a co-payment and must be borne by the insured.


    **2. Mandatory Waiting Periods**

    To prevent adverse selection and ensure fair underwriting, the following periods
    apply:

    * **Initial Waiting Period:** A window of 30 days from the date of policy inception
    during which no claims are payable, except for accidents.

    * **PED Waiting Period:** Any Pre-existing Disease (PED) diagnosed or treated
    prior to the policy inception is subject to a mandatory waiting period of 36 months.


    **3. Policy Review and Cancellation**

    We emphasize the **Free-look Period**, during which the policyholder can review
    the terms and conditions. If the product does not meet your needs, you may return
    the policy within this window for a refund, subject to standard processing charges.


    **4. Professional Advice**

    We provide product education and suitability guidance. However, we defer specific
    legal or tax advice to qualified professionals. We ensure that no health insurance
    product is misrepresented as a guaranteed-return investment.


    **5. Fraud Policy**

    Abhaya Insurance maintains a zero-tolerance policy toward fraudulent claims. All
    claims are subject to rigorous investigation; fraud will be reported to regulatory
    authorities.'
  domain: insurance
  product_category: health_indemnity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: beefa496-c7fc-54ce-9777-53456561dc7f
  title: Family Health Indemnity — interest rate / APY schedule
  body: "The Family Health Indemnity plan is a pure indemnity product, not an investment\
    \ or savings vehicle. Consequently, it does not accrue interest, provide an Annual\
    \ Percentage Yield (APY), or offer any guaranteed returns.\n\n**Premium Structure:**\n\
    A flat annual premium of ₹9,500 applies to this policy for a sum insured of ₹500,000.\
    \ \n\n**Factors Affecting Costs:**\nWhile the base premium is ₹9,500, the actual\
    \ cost to the policyholder may change based on:\n* **Government Taxes:** Applicable\
    \ GST as per current Indian tax laws.\n* **Riders:** Any additional optional covers\
    \ added to the base policy.\n* **Underwriting Adjustments:** Potential loading\
    \ of premiums based on medical screening results during the application process.\n\
    \nBecause this is not a wealth-creation product, there are no interest rates to\
    \ quote. For market-linked wealth options, please refer to the ULIP Wealth Plan\
    \ — overview."
  domain: insurance
  product_category: health_indemnity
