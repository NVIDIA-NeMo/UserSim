- id: a628b653-c303-57b9-8e38-0f936091d37a
  title: Motor Own-Damage Cover — check status or history
  body: 'Follow these steps to review the current status of your Motor Own-Damage
    Cover or access your policy history.


    **Prerequisites:**

    - Your policy number or registered mobile number.

    - Successful completion of Multi-factor authentication (MFA) for security verification.


    **Steps to Check Status/History:**

    1. Provide us with your policy number and the specific information you are looking
    for (e.g., current coverage status, previous claim history, or premium payment
    records).

    2. We will initiate a mandatory KYC verification to ensure you are the authorized
    policyholder.

    3. Once verified, ask us for the ''Current Policy Status''. We will confirm if
    your cover is active, lapsed, or pending renewal, and we will confirm the current
    annual premium of ₹7500 if applicable.

    4. To view your history, ask us for your ''Claim History''. We will provide a
    list of all past claims, including the dates of claim intimation and the final
    settlement amounts minus the compulsory deductible of ₹1000 per claim.

    5. For financial records, ask us for your ''Premium Payment History''. We will
    list all payments made and any no claim bonus of 20% that was applied to your
    account.


    **Confirmation of Success:**

    You will know the process is complete when we provide a detailed summary of your
    policy''s current state and a historical ledger of your claims and payments.'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 91d123a2-d395-53dc-a69e-c18ec5fcac8d
  title: Motor Own-Damage Cover — a declined or blocked action
  body: 'If you are attempting to make a change to your Motor Own-Damage Cover or
    initiate a claim and the action is declined or blocked, please follow these troubleshooting
    steps.


    **Common Symptoms:**

    - You receive a notification that the ''action is blocked''.

    - You are unable to update nominee details or change the vehicle information.

    - A claim intimation is rejected immediately upon submission.


    **Likely Causes:**

    - **Identity Verification Failure:** Our zero-trust stance requires successful
    Multi-factor authentication (MFA) and KYC verification before any state-changing
    action. If these failed, the action is blocked.

    - **Policy Lapse:** If the annual premium of ₹7500 has not been paid by the due
    date, certain policy actions (like filing a claim) are blocked.

    - **Pending Investigations:** If a previous claim is under rigorous investigation
    for fraud, further actions on the policy may be temporarily suspended.


    **Resolution Steps:**

    1. **Check Verification Status:** Confirm if you have received and entered the
    MFA code correctly. If not, ask us to resend the verification request.

    2. **Verify Premium Payment:** Ask us to check your payment status. If the policy
    has lapsed, we will guide you through the payment of the ₹7500 premium to reactivate
    your cover.

    3. **Review Documentation:** Ensure all KYC documents are up to date. If they
    have expired, provide us with the updated documents for verification.


    **When to Escalate:**

    If the action remains blocked after verification and payment, we will raise a
    formal case with our internal compliance team. You will receive a case reference
    number and a resolution update within our standard service timelines. For further
    grievances, the matter can be escalated to the Grievance Redressal Officer.'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 64df26bc-a960-5d7c-8e0b-c61b9292656f
  title: Motor Own-Damage Cover — when to switch or upgrade
  body: 'Support agents should use this guide to help customers decide when the Motor
    Own-Damage Cover is the right choice or when an upgrade is necessary.


    **When to Choose Motor Own-Damage Cover:**

    This product is ideal for vehicle owners who seek a transparent, risk-aligned
    protection plan. With an annual premium of ₹7500 and a clear compulsory deductible
    of ₹1000, it suits the Indian middle-class professional who wants predictable
    costs and a rewarding no claim bonus of 20% for safe driving.


    **When to Switch or Upgrade:**

    - **Higher Value Assets:** If the customer''s vehicle value has increased significantly,
    they may need to adjust their sum insured to avoid under-insurance, which could
    affect their claim settlement.

    - **Lower Deductible Preference:** If the customer finds the compulsory deductible
    of ₹1000 too high for their budget during a claim, they should inquire about available
    add-ons (if applicable) to reduce out-of-pocket expenses.

    - **Comprehensive Wealth Goals:** If the customer is looking for more than just
    vehicle protection and wants to build a market-linked corpus, we recommend they
    look at the ULIP Wealth Plan — overview, though this serves a completely different
    purpose than motor insurance.'
  domain: insurance
  product_category: motor_own_damage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 595a0508-aa1c-5987-a6e2-7925b2549631
  title: Motor Own-Damage Cover — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right insurance requires understanding where a product fits
    and where it does not. This guide helps prospective customers compare the Motor
    Own-Damage Cover against other options.


    **Product Highlights:**

    - **Annual Premium:** ₹7500

    - **Compulsory Deductible:** ₹1000

    - **First Year No Claim Bonus:** 20%

    - **Claim Settlement Target:** 30 days


    **Comparing Against Alternatives:**

    - **Third-Party Only Insurance:** Third-party cover is a legal requirement but
    does not cover damage to your own vehicle. Our Motor Own-Damage Cover is an essential
    addition for those who want protection against accidental damage to their own
    car, rather than just liability toward others.

    - **Comprehensive Bundles:** Some providers bundle multiple assets. We focus on
    transparency and fair underwriting for individual assets. By choosing our cover,
    you get a dedicated risk-aligned premium of ₹7500 specifically for your vehicle''s
    protection.


    **When NOT to Choose This Product:**

    - **Very Low-Value Vehicles:** If the market value of the vehicle is only slightly
    above the compulsory deductible of ₹1000, the cost of the ₹7500 annual premium
    may not be economically viable compared to the potential payout.

    - **Strict Budget Constraints:** If you cannot afford the ₹1000 out-of-pocket
    expense during a claim, this product''s structure may not suit your current financial
    liquidity.

    - **Investment Goals:** This is a pure protection product. If you are seeking
    a vehicle for wealth creation, this is not the right choice; instead, refer to
    our hybrid offerings like the ULIP Wealth Plan.


    **The Abhaya Advantage:**

    We compete on transparency. We ensure no insurance product is misrepresented as
    a guaranteed-return investment. Our Motor Own-Damage Cover is designed for those
    who value professional stewardship of their risk and clear, upfront pricing.'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 5ddd59f4-cec1-5481-98a1-5c06fbe72195
  title: Motor Own-Damage Cover — cost and charges
  body: 'Questions regarding the pricing and costs associated with the Motor Own-Damage
    Cover.


    **What is the total cost to maintain this cover annually?**

    The annual premium for the Motor Own-Damage Cover is ₹7500. This price is risk-aligned
    and includes the administrative overhead required to ensure professional stewardship
    of your policy.


    **Are there any other costs I should be aware of during a claim?**

    Yes, this policy includes a compulsory deductible of ₹1000. This means for every
    claim you file, you will contribute the first ₹1000 of the loss, and Abhaya Insurance
    will cover the remaining admissible amount.


    **How can I reduce my premium cost in the future?**

    We reward safe driving through our No Claim Bonus. In the first year, you can
    receive a no claim bonus of 20%, which reduces the effective cost of your protection
    provided no claims are filed during the period.'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: fa738121-43aa-54dc-8405-fb403b779f75
  title: Motor Own-Damage Cover — resolve a common request end-to-end
  body: 'This guide explains how to resolve a request to update your vehicle details
    or policy information for your Motor Own-Damage Cover.


    **Prerequisites:**

    - Your existing policy number.

    - New vehicle documentation (e.g., updated registration certificate) if the vehicle
    has changed.

    - Ability to pass MFA (Multi-factor authentication) verification.


    **Steps to Resolve the Request:**

    1. Tell us that you need to update your policy details for your Motor Own-Damage
    Cover and specify what information has changed.

    2. We will perform a mandatory KYC verification and MFA check to ensure you are
    the authorized policyholder.

    3. If you are updating vehicle details, provide us with the new registration documents.
    We will review these to ensure the risk profile remains aligned with our underwriting
    standards.

    4. We will then calculate if the change affects your annual premium. If the risk
    remains the same, the premium stays at ₹7500; otherwise, we will provide a revised
    quote.

    5. Ask us to confirm the impact on your no claim bonus. We will verify if your
    current no claim bonus of 20% is still applicable to the updated vehicle.

    6. We will process the amendment and send you a confirmation of the updated policy
    terms.


    **Confirmation of Success:**

    The request is resolved when you receive the updated policy document showing the
    correct vehicle details and the confirmed annual premium of ₹7500 (or the adjusted
    amount), along with a confirmation of your current no claim bonus percentage.'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 49fb5335-4e29-5e42-8a04-4d3e9757fe8d
  title: Motor Own-Damage Cover — a discrepancy in your records or statement
  body: 'If you notice a discrepancy in your policy statement or claim records for
    your Motor Own-Damage Cover, please follow these steps to resolve the issue.


    **Common Symptoms:**

    - Your statement shows an annual premium different from the agreed ₹7500.

    - A claim payout is lower than expected, and you believe the compulsory deductible
    of ₹1000 was applied incorrectly.

    - Your no claim bonus of 20% is not reflected in your renewal quote despite having
    no claims.


    **What to Check:**

    1. **Premium Verification:** Review your initial policy schedule. Confirm if there
    were any add-ons selected that would increase the base annual premium of ₹7500.

    2. **Deductible Review:** Check the ''Claim Settlement Summary''. Ensure the total
    loss was correctly calculated and that the ₹1000 compulsory deductible was only
    subtracted once.

    3. **NCB Eligibility:** Verify that no ''zero-value'' or ''small-value'' claims
    were filed. Any claim intimation, regardless of the payout, can void the no claim
    bonus of 20%.


    **Resolution Process:**

    1. Provide us with the specific transaction ID or claim number where the discrepancy
    appears.

    2. We will conduct a neutral review of your account history and the corresponding
    settlement workflow.

    3. If an error is found—such as an incorrect deductible application or a missing
    no claim bonus of 20%—we will apply the correction to your account immediately.


    **When to Escalate:**

    If we cannot resolve the discrepancy during the conversation, we will escalate
    the matter to the Grievance Redressal Officer. We treat all disputes with neutrality
    and speed, aiming for resolution within defined IRDAI timelines. You will receive
    a written explanation of the finding and the corrective action taken.'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1b4d879d-a0ca-59cd-aceb-7859e0b09c38
  title: Institution-wide fees and charges
  body: 'At Abhaya Insurance, we believe in pricing that is competitive and risk-aligned.
    Our premiums are designed to reflect the actual cost of risk and the administrative
    overhead required to maintain a high standard of care for our policyholders.


    **General Fee Structure**

    - **Administrative Charges:** Standard operational fees are baked into the premiums
    of our protection products to ensure sustainability.

    - **Professional Stewardship:** For wealth-linked products, fund management charges
    are applied to ensure professional portfolio stewardship and operational sustainability.

    - **Product-Specific Fees:** Certain charges, such as premium allocation or policy-specific
    administrative costs, vary based on the chosen plan.


    We maintain full transparency regarding all costs. For a detailed breakdown of
    charges applicable to a specific plan, please refer to the individual product
    fee schedules, such as the ULIP Wealth Plan — fee schedule.'
