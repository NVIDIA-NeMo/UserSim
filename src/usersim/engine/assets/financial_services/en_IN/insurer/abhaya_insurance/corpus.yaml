- id: 97cb8f7c-db7f-558f-9a51-55b554283b47
  title: ULIP Wealth Plan — a discrepancy in your records or statement
  body: '**Symptom**

    A customer reports that the fund value on their statement does not match their
    calculations, or a premium payment is not reflecting in their history.


    **Likely Causes**

    - **Timing of Charges**: The customer may have forgotten to account for the 1.35%
    fund management charge, which is deducted periodically from the fund value.

    - **Allocation Gap**: The customer may be calculating based on the total premium
    paid, neglecting the 3% premium allocation charge deducted at the start.

    - **Payment Processing Lag**: A recent payment of the ₹50000 annual premium may
    still be in the clearing cycle and not yet updated in the policy ledger.


    **What to Check (In Order)**

    1. **Verify Premium Allocation**: Check if the invested amount matches the premium
    minus the 3% charge. (e.g., For ₹50000, the invested amount should be ₹48500).

    2. **Check Charge Logs**: Review the fund management charge deductions to ensure
    the 1.35% has been applied correctly against the average fund value.

    3. **Confirm Payment Date**: Check the date of the last ₹50000 premium payment
    and compare it with the statement generation date.


    **The Fix**

    - **For Calculation Errors**: Walk the customer through the deduction of the 3%
    allocation charge and the 1.35% management fee to align their expectations with
    the actual fund value.

    - **For Missing Payments**: If the payment was made but not reflected, ask the
    customer to provide the transaction reference number. We will then manually reconcile
    the payment with our bank statements.


    **When to Escalate**

    If a payment is confirmed as received by our bank but remains unallocated to the
    policy after 3 business days, or if there is a clear mathematical error in the
    fund valuation, we will route the case to the Grievance Redressal Officer for
    a formal audit. The customer will be notified of the resolution within the prescribed
    IRDAI timelines.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ad3b3685-7db7-5dec-a518-34bec0687998
  title: Motor Own-Damage Cover — overview
  body: 'We are pleased to offer the Motor Own-Damage Cover, an essential vehicle
    protection plan designed for the Indian middle-class and emerging professionals.
    This product provides comprehensive security against accidental damage to your
    own vehicle, ensuring that unexpected mishaps do not become financial burdens.


    At Abhaya Insurance, we believe in transparency and fair underwriting. This cover
    is structured to provide high-quality protection while remaining affordable. Our
    pricing is risk-aligned, reflecting the actual cost of risk and the necessary
    administrative overhead required to maintain professional stewardship of your
    policy.


    Key Financial Details:

    - Annual Premium: ₹7500

    - Compulsory Deductible: ₹1000 (This is the fixed amount the policyholder bears
    for each claim)

    - First Year No-Claim Bonus: 20% (A reward for safe driving, applied if no claims
    are made during the first year)

    - Claim Settlement Timeline: 30 days


    We adhere strictly to IRDAI regulations to ensure the ''Protection of Policyholders''
    Interests''. This includes a mandatory Free-look Period, during which you may
    review the terms and return the policy for a refund if it does not meet your needs.
    We also maintain a zero-tolerance policy toward fraudulent claims, which are subject
    to rigorous investigation and regulatory reporting.


    Whether you are protecting a family car or a professional commute vehicle, the
    Motor Own-Damage Cover provides the reassurance that your asset is secure. We
    encourage you to review the specific exclusions and sub-limits provided in your
    policy document to fully understand your coverage.'
