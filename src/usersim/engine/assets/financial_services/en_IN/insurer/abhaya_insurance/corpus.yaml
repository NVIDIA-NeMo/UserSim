- id: b4b9e991-8e08-5a5f-952c-110c2b123faa
  title: Motor Own-Damage Cover — how rates are tiered and applied
  body: 'The Motor Own-Damage Cover operates on a risk-aligned pricing model to ensure
    sustainability and fairness for the Indian middle-class professional.


    Annual Premium:

    A flat annual premium of ₹7500 is applied to the standard base vehicle profile.
    This rate covers the operational overhead and the cost of risk associated with
    accidental damage protection.


    No-Claim Bonus (NCB):

    To reward safe driving, we apply a No-Claim Bonus of 20% in the first year. This
    percentage is deducted from the applicable premium for the subsequent term, provided
    no claims were filed during the previous policy year.


    Rate Adjustments:

    While the base rate is ₹7500, the final premium may be adjusted based on:

    - Vehicle Age and Model: Older vehicles may have different risk profiles.

    - Geographic Location: Higher-risk zones may incur adjusted rates.

    - Add-on Covers: Any additional riders selected by the customer will increase
    the total premium beyond the base amount.'
