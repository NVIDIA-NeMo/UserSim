- id: ad307322-15db-5b05-a235-daa2ccb200ae
  title: Abhaya Term Life Cover — free look days explained
  body: '**What is the Free-look Period for the Abhaya Term Life Cover?**

    The Free-look Period is a specified window of 15 days starting from the date you
    receive your policy documents. This period is designed to give you ample time
    to review the terms and conditions, exclusions, and policy details to ensure the
    product meets your expectations.


    **What happens if I decide to return the policy during this time?**

    If you are not satisfied with the terms, you may return the policy within these
    15 days for a refund of the premium paid, subject to standard regulatory deductions
    for medical examinations or stamp duty.


    **Can I request a change to the policy instead of canceling it?**

    Yes, you can request amendments to your policy. However, if you feel the product
    is fundamentally unsuitable, the Free-look Period is your guaranteed window for
    a refund. For more details on your coverage, see Abhaya Term Life Cover — overview.'
