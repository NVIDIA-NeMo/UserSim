- id: 80184c0a-7539-5417-973a-4604ba564dc2
  title: ULIP Wealth Plan — fund management charge explained
  body: '**What is the fund management charge for the ULIP Wealth Plan?**

    To ensure professional portfolio stewardship and operational sustainability, we
    apply a fund management charge of 1.35%. This fee covers the costs of expert fund
    management and the administration of the market-linked portion of your plan.


    **How is this charge different from the premium allocation charge?**

    While the fund management charge is an ongoing fee for managing your investments,
    the premium allocation charge of 3% is a one-time deduction from each premium
    payment before it is invested in the fund.


    **Why are these fees necessary?**

    Our fee philosophy is based on providing competitive, risk-aligned pricing. These
    charges allow us to maintain high standards of professional oversight and ensure
    that your wealth creation vehicle is managed by qualified experts.


    For a full breakdown of all costs, please see ULIP Wealth Plan — cost and charges.'
