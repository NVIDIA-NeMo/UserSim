- id: 51505573-96e0-520e-b6ac-09e0b9085957
  title: ULIP Wealth Plan — when to switch or upgrade
  body: 'This guide helps support agents determine if a customer should remain with
    the ULIP Wealth Plan or move to a different product.


    **Switch to Abhaya Term Life Cover if:**

    The customer''s primary goal has shifted from wealth creation to pure, high-value
    protection. While the ULIP Wealth Plan provides life cover, it is a hybrid vehicle.
    If the customer requires maximum family security at the most affordable cost without
    the 5 lock-in years restriction, the Term Life Cover is the superior choice.


    **Upgrade/Stay with ULIP Wealth Plan if:**

    The customer seeks a combination of insurance and market-linked growth and is
    comfortable with the annual premium of ₹50000 and the 1.35% fund management charge.
    This plan is ideal for those with a long-term horizon who can commit to the 5
    lock-in years.


    **Comparison Summary**

    - **ULIP Wealth Plan**: Hybrid (Life Cover + Investment), ₹50000 annual premium,
    5-year lock-in, 1.35% fund management charge.

    - **Term Life Cover**: Pure Protection, focused on high sum assured, no investment
    lock-in period.


    **Recommendation**: If the customer is under pressure for liquidity, steer them
    toward pure protection. If they have a surplus for long-term wealth, the ULIP
    Wealth Plan remains the optimal choice.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: comparison
  source_authority: official
