- id: b2321465-bad4-589b-924d-7d7be1b298ac
  title: ULIP Wealth Plan — make a change or update
  body: 'Whether you need to update your personal details, change your nominee, or
    switch your investment funds, we ensure the process is secure and transparent.
    Because the ULIP Wealth Plan involves both insurance and investment assets, all
    changes require strict verification.


    **What you will need:**

    - Your policy number.

    - A valid government-issued ID for KYC re-verification if the change is significant
    (e.g., change of address or nominee).


    **Steps to update your policy:**


    1. **State the change:** Tell us exactly what you wish to update. For example,
    ''I want to change my nominee'' or ''I wish to switch my fund allocation.''

    2. **Identity Verification:** We will trigger a Multi-factor authentication (MFA)
    request to your registered mobile number or email. You must provide the code to
    proceed.

    3. **Provide Documentation:** If you are updating a nominee or contact information,
    provide the necessary supporting documents (such as a nominee''s ID proof). We
    will verify these against our KYC standards.

    4. **Review the Impact:** For fund switches, we will provide a summary of the
    current allocation versus the proposed allocation and confirm if any regulatory
    limits apply.

    5. **Confirmation:** Once verified, we will process the update and send you a
    formal confirmation notice via your registered contact method. This document serves
    as the legal record of the change.


    If you encounter any issues during the login or verification stage, please refer
    to ULIP Wealth Plan — access or login problems.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
