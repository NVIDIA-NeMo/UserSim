- id: 0dd2f220-6280-500d-ba0a-90025f778e0e
  title: ULIP Wealth Plan — resolve a common request end-to-end
  body: 'This guide explains how to request a partial withdrawal from your ULIP Wealth
    Plan once the lock-in period has ended.


    **Prerequisites**

    - The policy must have completed the mandatory 5 lock-in years.

    - A valid bank account in the policyholder''s name.

    - Registered mobile number for MFA.


    **Steps to Resolve Withdrawal Request**

    1. **Initiate Withdrawal Request**: Tell us the specific amount you wish to withdraw
    from your fund value.

    2. **Lock-in Verification**: We will verify the policy inception date. If the
    5 lock-in years have not elapsed, we will inform you of the remaining duration
    and decline the request.

    3. **Identity Authentication**: We will send a Multi-factor authentication (MFA)
    code to your registered mobile number. Confirm this code to proceed.

    4. **Bank Detail Confirmation**: We will ask you to confirm the bank account where
    the funds should be transferred. For security, we verify that the account matches
    the KYC records.

    5. **Final Review and Submission**: We will provide a summary of the withdrawal
    amount and any applicable taxes or charges. Once you give your final consent,
    we will trigger the settlement workflow.


    **How you know it worked**

    You will receive a confirmation message stating that the withdrawal request has
    been processed. The funds will be credited to your verified bank account within
    the standard settlement timeline. You can then check your updated fund value,
    which will reflect the deduction of the withdrawn amount, via the process outlined
    in ULIP Wealth Plan — check status or history.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
