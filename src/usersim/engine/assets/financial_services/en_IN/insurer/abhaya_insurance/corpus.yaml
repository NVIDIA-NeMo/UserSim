- id: 8de61c68-b648-5c31-ad6e-8e85a84d35ad
  title: Family Health Indemnity — risk disclosures
  body: 'This document provides mandatory regulatory disclosures for the Family Health
    Indemnity plan, prioritising the ''Protection of Policyholders'' Interests'' as
    per IRDAI regulations.


    Risk and Coverage Limitations:

    - Sum Insured Cap: Total liability of Abhaya Insurance under this policy is strictly
    capped at the sum insured of ₹500,000. Any expenses beyond this amount are the
    sole responsibility of the policyholder.

    - Room Rent Sub-limit: Be advised that room rent is subject to a sub-limit of
    1% of the sum insured. This means a maximum of ₹5,000 per day is payable. Selecting
    a room more expensive than this will result in a proportionate deduction from
    other admissible claim components.

    - Waiting Period Risks: Coverage is not immediate. No claims are payable during
    the initial waiting period of 30 days, except for accidental injuries. Furthermore,
    any condition identified as a Pre-existing Disease (PED) will not be covered until
    36 months of continuous coverage have been completed.

    - Premium Obligations: The annual premium of ₹9,500 must be paid in full to maintain
    the continuity of the waiting periods. A lapse in the policy may reset the 36
    months PED clock.


    We provide product education and suitability guidance but defer specific legal
    or tax advice to qualified professionals. We hold ourselves to a high standard
    of care, ensuring that this health indemnity product is not misrepresented as
    a guaranteed-return investment; it is a pure protection product designed to indemnify
    the policyholder against medical losses.'
  domain: insurance
  product_category: health_indemnity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 27a45105-09fa-595c-8380-4b4dc0ebad3e
  title: Family Health Indemnity — how rates are tiered and applied
  body: "For the Family Health Indemnity plan, we employ a simplified, transparent\
    \ pricing model to ensure accessibility for the emerging professional. \n\nAnnual\
    \ Premium:\nA flat annual premium of ₹9,500 applies to this specific product configuration.\
    \ Unlike some tiered products, this rate is fixed for the current policy term\
    \ for the defined sum insured of ₹500,000.\n\nHow the Rate is Applied:\n- Billing\
    \ Cycle: The premium is billed annually. \n- Risk Alignment: This rate reflects\
    \ the actuarial cost of the ₹500,000 risk pool and the administrative overhead\
    \ required for professional portfolio stewardship.\n- Changes to Rates: While\
    \ the current rate is ₹9,500, premiums may be adjusted at the time of renewal\
    \ based on changes in IRDAI regulations, overall claim experience of the product\
    \ pool, or changes in the policyholder's risk profile during underwriting.\n\n\
    All premium payments are subject to mandatory KYC and MFA verification to ensure\
    \ fund security."
