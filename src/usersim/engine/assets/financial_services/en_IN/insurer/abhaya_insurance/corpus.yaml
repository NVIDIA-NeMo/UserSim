- id: 7aced9df-dd2f-58f2-91ba-c4bce69173ef
  title: Family Health Indemnity — a declined or blocked action
  body: 'If you find that a request to amend your policy or a claim submission for
    your Family Health Indemnity plan has been declined or blocked, please follow
    this guide.


    **Common Symptoms**

    *   An error message stating ''Action Blocked: Verification Failed''.

    *   A notification that a claim has been declined due to ''Waiting Period Restrictions''.

    *   Unable to update nominee details or contact information.


    **Potential Causes and Fixes**

    1.  **Verification Failure:** Most blocks occur due to failed multi-factor authentication
    (MFA). Check if your registered mobile number is active. If you have changed your
    number, we must first complete a fresh KYC verification before any state-changing
    action can be performed.

    2.  **Initial Waiting Period:** If a claim for a non-accidental illness is declined
    shortly after policy inception, check if you are still within the initial waiting
    period of 30 days. Coverage for general illnesses only begins after this window.

    3.  **PED Waiting Period:** If a claim is declined for a chronic condition, check
    if the condition was pre-existing. Such conditions are blocked from coverage until
    the 36 months waiting period has been completed.

    4.  **Incomplete KYC:** Certain policy amendments are blocked if your KYC documents
    are expired or incomplete.


    **When to Escalate**

    If you believe the block is an error (e.g., the 36 months waiting period has passed
    but the claim is still declined), we will raise a formal case with our underwriting
    team. You will receive a case reference number, and we aim for a resolution within
    the defined IRDAI timelines. If the issue remains unresolved, the matter can be
    escalated to the Grievance Redressal Officer.'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 36b324ea-747d-5155-a7b3-138b9b8d6af4
  title: Family Health Indemnity — when to switch or upgrade
  body: 'Deciding whether to maintain your current Family Health Indemnity plan or
    move to an alternative depends on your evolving life stage and risk appetite.


    **When to Stay with Family Health Indemnity**

    This plan is ideal for those who value a balance of cost and coverage. With an
    annual premium of ₹9,500 and a sum insured of ₹500,000, it provides a stable safety
    net for the Indian middle class without excessive overhead.


    **When to Upgrade or Switch**

    *   **Increased Coverage Needs:** If your family size grows or medical inflation
    makes ₹500,000 insufficient, you should switch to a higher sum insured tier to
    avoid out-of-pocket expenses.

    *   **Premium Room Requirements:** If you prefer luxury hospital rooms, the current
    room rent cap of 1% of the sum insured (which equals ₹5,000 per day) may be too
    restrictive. An upgrade to a plan with no room rent sub-limits would be more suitable.

    *   **Immediate Coverage Needs:** While our 36 months waiting period for pre-existing
    diseases is standard and fair, those requiring faster coverage may need to look
    at specialized plans, though these typically come with significantly higher premiums.


    We recommend reviewing your coverage annually to ensure it aligns with your current
    financial goals.'
  domain: insurance
  product_category: health_indemnity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 6b5c10dd-dbea-5c39-bf7a-dd9ed7260dd3
  title: Family Health Indemnity — comparison vs. alternatives and when not to choose
    it
  body: 'To ensure you select the most suitable protection, we provide a transparent
    comparison of the Family Health Indemnity plan against other market alternatives.


    **Product Specifications**

    *   **Sum Insured:** ₹500,000

    *   **Annual Premium:** ₹9,500

    *   **Initial Waiting Period:** 30 days

    *   **PED Waiting Period:** 36 months

    *   **Room Rent Cap:** 1% of sum insured (₹5,000 per day)


    **Comparison vs. Alternatives**


    1.  **Vs. Basic Government Schemes:** While government schemes offer lower costs,
    Family Health Indemnity provides a higher sum insured of ₹500,000 and a more comprehensive
    network of private hospitals, ensuring faster access to quality care for emerging
    professionals.

    2.  **Vs. Premium High-End Plans:** Premium plans may offer ''Zero Waiting Period''
    or ''No Room Rent Caps''. However, these come with premiums often double or triple
    our ₹9,500 rate. Family Health Indemnity is designed for those who prefer risk-aligned
    pricing over luxury add-ons.

    3.  **Vs. Pure Term Life:** Unlike the Abhaya Term Life Cover — overview, which
    provides a lump sum upon death, this product is an indemnity plan that pays for
    actual medical expenses incurred.


    **When NOT to Choose This Product**

    *   **High-End Hospitalisation Preference:** If you exclusively use premium suites
    in tertiary care hospitals, the room rent cap of 1% will lead to significant co-payments.
    You should seek a plan with no sub-limits.

    *   **Immediate Chronic Care:** If you require immediate coverage for a pre-existing
    condition and cannot wait for the 36 months period, this product will not meet
    your immediate needs.

    *   **Ultra-Low Budget:** If a premium of ₹9,500 exceeds your annual budget, you
    may need to explore basic micro-insurance options, although the sum insured will
    be considerably lower than ₹500,000.'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 75089494-972f-52d8-ba1b-fcaa2cefce89
  title: Family Health Indemnity — room rent cap pct of si explained
  body: '**What is a room rent cap?**

    A room rent cap, or sub-limit, is a maximum amount that Abhaya Insurance will
    pay per day for your hospital room charges. Any amount spent above this limit
    is borne by the policyholder.


    **How is the cap calculated for my Family Health Indemnity plan?**

    The cap is set at 1% of your total sum insured. Since your sum insured is ₹500,000,
    your daily room rent limit is ₹5,000 (1% of ₹500,000).


    **What happens if I choose a room that costs more than ₹5,000 per day?**

    If you opt for a room exceeding the 1% cap, you will not only pay the difference
    in room rent but may also be subject to ''proportionate deduction''. This means
    other medical expenses (like surgeon fees or nursing charges) may be reduced proportionally
    because you chose a higher category of room than the policy allows.'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ebc46d2e-3cba-5663-804c-9a94f4a1625f
  title: Family Health Indemnity — resolve a common request end-to-end
  body: 'This guide outlines the end-to-end process for updating your nominee details
    for your Family Health Indemnity policy, a critical step in ensuring your benefits
    reach the right person.


    **Prerequisites**

    *   Full name and relationship of the new nominee.

    *   Date of birth and government-issued ID proof of the new nominee.

    *   Access to your registered mobile number for MFA.


    **Steps to Update Nominee**

    1.  Inform us that you wish to update the nominee on your Family Health Indemnity
    policy. Provide the new nominee''s full name and their relationship to you.

    2.  We will send a multi-factor authentication (MFA) request to your registered
    mobile number. Please confirm this request to verify your identity.

    3.  Provide the nominee''s date of birth and upload/share a copy of their government-issued
    ID (e.g., Aadhaar or PAN card) for our KYC verification process.

    4.  We will review the documents to ensure the nominee''s details are precise
    and valid. Once verified, we will update the records in our system.

    5.  We will provide you with a confirmation message and an updated policy schedule
    reflecting the new nominee.


    **Confirmation of Success**

    Your request is complete when you receive the updated policy schedule showing
    the new nominee''s name and details, and a confirmation that the change has been
    formally recorded in your policy file.'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 72d1ba2d-24d2-5e29-8216-c87a19886532
  title: Family Health Indemnity — a discrepancy in your records or statement
  body: 'If you notice a discrepancy in your policy statement, such as an incorrect
    premium amount or an error in the sum insured for your Family Health Indemnity
    plan, follow these steps.


    **Common Symptoms**

    *   The statement shows a premium other than the standard ₹9,500.

    *   The sum insured is listed as an amount other than ₹500,000.

    *   The waiting period start date for pre-existing diseases is incorrectly recorded.


    **What to Check and Resolve**

    1.  **Verify Payment Date:** If the premium amount seems wrong, check the date
    of your last payment. Ensure you are looking at the current policy year statement
    and not a previous year''s quote.

    2.  **Review Policy Endorsements:** If the sum insured differs from ₹500,000,
    check if you recently requested a policy amendment or upgrade that was processed.

    3.  **Check Inception Date:** If the PED waiting period looks incorrect, verify
    your policy inception date. The 36 months period is calculated strictly from the
    date the policy became active.


    **Resolution Process**

    If the discrepancy persists, tell us exactly which value is incorrect and provide
    the supporting document (e.g., a payment receipt for the ₹9,500 premium).


    **Our Next Steps**

    1.  We will conduct a rigorous investigation of our internal records and payment
    logs.

    2.  We will raise a rectification case with our operations team to correct the
    record.

    3.  Once corrected, we will issue a revised policy statement and send you a confirmation
    notice.


    If the discrepancy involves a financial dispute, we aim for resolution within
    the defined IRDAI timelines, ensuring neutrality and speed in our investigation.'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
