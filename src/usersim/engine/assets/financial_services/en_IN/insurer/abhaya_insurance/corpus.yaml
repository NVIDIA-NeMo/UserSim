- id: c9ff9c2d-487c-52a1-b6bf-28162bf7babb
  title: Family Health Indemnity — referral and loyalty offer
  body: 'We believe that protecting your family''s health is a journey best shared.
    We are pleased to announce our ''Secure Together'' referral initiative, running
    from 1st November 2024 to 31st January 2025.


    If you are a prospective customer being referred by an existing Abhaya Insurance
    policyholder, you are eligible for a one-time welcome discount of ₹500 on your
    first annual premium of ₹9,500 when you enroll in the Family Health Indemnity
    plan. Similarly, the referring member will receive a loyalty credit of ₹500 toward
    their next renewal.


    This offer applies specifically to new policies with a sum insured of ₹5,00,000.
    Please ensure your referral code is provided at the time of application to avail
    of these benefits. We look forward to welcoming you to the Abhaya family and ensuring
    your loved ones have the comprehensive medical coverage they deserve.'
  domain: insurance
