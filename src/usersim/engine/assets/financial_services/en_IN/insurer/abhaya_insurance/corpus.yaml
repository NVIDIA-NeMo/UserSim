  institution_id: abhaya_insurance
- id: 7c97ab95-3bd0-5ce0-8909-81bde4b30693
  title: Motor Own-Damage Cover — who it is best for and common use cases
  body: 'The Motor Own-Damage Cover is an essential vehicle protection product designed
    specifically for the Indian middle-class and emerging professionals who seek transparency
    and fair underwriting. This cover provides protection against accidental damage
    to your own vehicle, ensuring that the financial burden of repairs does not disrupt
    your household stability.


    This product is best suited for:

    - New Vehicle Owners: Those who want to protect their significant investment from
    the unpredictability of city traffic and accidents.

    - Budget-Conscious Professionals: Individuals looking for a competitive, risk-aligned
    annual premium of ₹7500.

    - Disciplined Drivers: Those who can leverage our No-Claim Bonus, which offers
    20% in the first year for maintaining a claim-free record.


    Common Use Cases:

    - Accidental Collision: If your vehicle is damaged in a road accident, we cover
    the repair costs minus the compulsory deductible of ₹1000.

    - Natural Calamities: Protection against damage caused by floods, storms, or other
    natural disasters that might otherwise lead to expensive out-of-pocket repairs.

    - Fire and Theft: Security against the total loss of the asset due to fire or
    theft, providing a reassuring safety net.


    Our service model ensures that support is available via a 24/7 digital portal
    for immediate assistance. We pride ourselves on a streamlined process where claim
    settlement days are capped at 30, ensuring you get back on the road as quickly
    as possible. For a full breakdown of costs, please see Motor Own-Damage Cover
    — fee schedule.'
