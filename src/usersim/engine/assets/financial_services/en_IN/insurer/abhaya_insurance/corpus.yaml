- id: 647ae2a2-d2e8-5cfc-9896-25d0cda10784
  title: ULIP Wealth Plan — lock in years explained
  body: 'Q: What does the ''lock-in period'' mean for my ULIP Wealth Plan?

    A: The lock-in period is a mandatory duration of 5 years from the date of inception
    during which you cannot withdraw funds or surrender the policy. This ensures the
    plan serves its purpose as a long-term wealth creation vehicle.


    Q: Can I make any partial withdrawals before the 5 years are up?

    A: No. In accordance with the product terms and IRDAI regulations, the 5 years
    lock-in period is absolute. Access to the fund value is only permitted after this
    period expires.


    Q: What happens if I stop paying my annual premium of ₹50000 during the lock-in
    period?

    A: If premiums are not paid, the policy may move to a ''discontinued'' status.
    While the fund value remains locked for the remainder of the 5 years, the life
    cover may be reduced or terminated depending on the fund availability to cover
    mortality charges. For more details, see ULIP Wealth Plan — cost and charges.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: e2408c03-240e-523f-953f-e6a591b070af
  title: ULIP Wealth Plan — cancel, close, or downgrade
  body: 'Depending on when you wish to exit or modify your ULIP Wealth Plan, the process
    and outcomes differ significantly due to the mandatory lock-in period.


    Scenario A: Cancellation within the Free-look Period

    If you have just received your policy and wish to cancel:

    1. Tell us that you wish to exercise your Free-look right.

    2. Provide the original policy document and a cancelled cheque for the refund
    account.

    3. We will process the refund of your premium (minus applicable statutory charges)
    and confirm the cancellation in writing.


    Scenario B: Closing the Policy (Surrendering) after the Lock-in

    If the mandatory lock-in period of 5 years has passed:

    1. Tell us you wish to surrender your policy for the current fund value.

    2. Complete the mandatory KYC verification and MFA (Multi-Factor Authentication)
    process to validate your identity.

    3. We will calculate the final surrender value, deduct any outstanding charges,
    and transfer the balance to your verified bank account.


    Scenario C: Downgrading or Modifying the Plan

    If you find the annual premium of ₹50000 too high:

    1. Tell us you wish to explore premium modification or downgrade options.

    2. We will review your policy''s current status and eligibility for premium reduction.

    3. Upon your agreement to the new terms, we will update the policy and provide
    a revised premium schedule.


    Important: Please note that you cannot ''close'' the policy for a fund payout
    before the 5 years lock-in period has elapsed. For further guidance on the costs
    associated with these changes, see ULIP Wealth Plan — cost and charges.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0d600b0c-d978-5d5f-8078-9f021e1b2e25
  title: ULIP Wealth Plan — an unexpected charge or amount
  body: "If you notice that the amount invested in your fund is lower than the premium\
    \ paid, or if you see deductions you did not expect, please follow these steps\
    \ to identify the cause.\n\nSymptom: 'My invested fund value is less than my annual\
    \ premium of ₹50000.'\n\nLikely Causes:\n1. Premium Allocation Charge: A charge\
    \ of 3% is deducted from every premium payment before it is invested. For a premium\
    \ of ₹50000, this means ₹1,500 is deducted upfront.\n2. Fund Management Charges:\
    \ A charge of 1.35% is deducted periodically from the total fund value to cover\
    \ professional portfolio stewardship.\n\nWhat to check in order:\n1. Review your\
    \ latest policy statement to see the 'Premium Allocation' line item. Check if\
    \ the 3% deduction has been applied.\n2. Review the 'Charges' section of your\
    \ statement to see the impact of the 1.35% fund management charge over the period.\n\
    3. Compare the net invested amount against the expected value after these two\
    \ specific deductions.\n\nHow to resolve:\nIf the charges on your statement exceed\
    \ 3% for allocation or 1.35% for fund management, tell us the specific dates and\
    \ amounts of the discrepancies. \n\nWhen we escalate:\nIf a calculation error\
    \ is found, we will raise a case with our finance team to rectify the fund value.\
    \ You will receive a corrected statement and a confirmation of the credit adjustment\
    \ within the defined IRDAI timelines for grievance resolution."
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
