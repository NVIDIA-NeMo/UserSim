- id: b55c2318-6226-5a57-ac85-7f43bedc0334
  title: Abhaya Term Life Cover — make a change or update
  body: 'If you need to update your personal details or policy preferences, please
    follow these steps. To protect your ₹1,000,000,00 sum assured, we require strict
    verification for all changes.


    **Requirements before starting:**

    - Your Policy Number.

    - A valid government-issued ID (for KYC re-verification).

    - Updated details (e.g., new address, new nominee name, or updated contact number).


    **Steps to update your policy:**


    1. Provide the specific detail you wish to change. For example, tell us ''I want
    to update my nominee'' or ''I need to change my permanent address''.

    2. Provide the new information exactly as it appears on your official documentation.

    3. Undergo identity verification. We will initiate a Multi-Factor Authentication
    (MFA) request. You must provide the code sent to your registered mobile number
    to proceed.

    4. Submit supporting documents. If you are changing a nominee or a legal name,
    we will ask you to share a digital copy of the supporting legal document.

    5. Review the confirmation. We will confirm the change in the conversation and
    send a formal notification to your registered email and mobile number.


    **How you know it worked:**

    You will receive a confirmation message stating that the amendment to your Abhaya
    Term Life Cover has been processed. You can then request an updated policy schedule
    to verify that the changes are reflected correctly.


    Note: Changes to the policy term of 30 years or the sum assured are not permitted
    under the standard terms of this product.'
