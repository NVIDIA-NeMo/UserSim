- id: 3fe9290e-0f77-5194-82aa-8846c00628d6
  title: Family Health Indemnity — initial waiting period days explained
  body: '**What is the initial waiting period for the Family Health Indemnity plan?**

    For every new policy, there is an initial waiting period of 30 days. This is a
    standard window during which most illnesses are not covered to ensure the policy
    is not bought specifically to treat an existing acute condition.


    **Are there any exceptions to this 30 days period?**

    Yes. In the event of an accidental injury, the initial waiting period of 30 days
    does not apply, and coverage is provided immediately upon policy inception.


    **How does this differ from the PED waiting period?**

    While the initial waiting period is 30 days for general illnesses, conditions
    diagnosed as Pre-existing Diseases (PED) are subject to a longer mandatory waiting
    period of 36 months before they are covered under the ₹5,00,000 sum insured.'
  domain: insurance
  product_category: health_indemnity
