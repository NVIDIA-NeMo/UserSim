- id: db520073-ef63-51ab-8557-53aca60111de
  title: update_policy tool reference
  body: 'The `update_policy` tool allows the agent to modify specific parameters of
    an existing insurance policy. We use this tool to ensure that policyholder details
    and coverage options remain current and accurate.


    **Tool Signature & Arguments**

    - `policy_id` (required): The unique identifier for the insurance policy being
    amended.

    - `updates` (required): A structured set of fields to be modified (e.g., coverage
    limits, policy options, or plan tiers).


    **Effect and Execution**

    Calling this tool results in a state-changing action that updates the policy record
    in our core systems. The agent performs this action by calling the tool directly
    after the customer''s identity has been strictly validated via mandatory multi-factor
    authentication (MFA) and KYC verification. We maintain a zero-trust stance regarding
    identity validation for all state-changing actions to protect our policyholders.


    For guidance on when this tool is appropriate for specific customer requests,
    please refer to When to use update_policy.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
