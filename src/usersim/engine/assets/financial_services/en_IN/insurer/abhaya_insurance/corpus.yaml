- id: 3557bb09-714c-5f08-97df-8fc182939229
  title: Motor Own-Damage Cover — account security best practices
  body: "At Abhaya Insurance, we prioritise the security of your policy details and\
    \ personal data. To maintain the integrity of your Motor Own-Damage Cover, we\
    \ urge all policyholders to adopt the following security best practices.\n\n**Mandatory\
    \ Verification Standards**\nWe employ a zero-trust stance regarding identity validation.\
    \ Please be aware that Multi-factor authentication (MFA) and KYC verification\
    \ are mandatory before any state-changing action is performed on your account.\
    \ This includes, but is not limited to, updating your registered mobile number,\
    \ amending policy coverage, or initiating fund withdrawals from any linked accounts.\n\
    \n**Recognising Fraudulent Requests**\nBe vigilant against phishing attempts.\
    \ Abhaya Insurance will never ask you to share your MFA codes, passwords, or full\
    \ KYC documents via an unsecured email or SMS. Any request asking you to transfer\
    \ funds to an individual's account for 'policy activation' or 'claim acceleration'\
    \ is fraudulent. \n\n**First Action for Suspicious Activity**\nIf you notice any\
    \ unauthorised attempt to access your account or receive a notification for a\
    \ change you did not request, notify us immediately. All security breaches should\
    \ be reported within 24 hours to ensure we can freeze the policy and prevent fraudulent\
    \ claim intimation.\n\n**Claim Settlement Security**\nTo prevent fraud, we conduct\
    \ rigorous investigations into all claims. Any attempt to misrepresent the facts\
    \ of a loss is handled with our zero-tolerance policy, which involves reporting\
    \ the incident to the relevant regulatory authorities. By adhering to these standards,\
    \ we ensure that the benefits of your policy—including the annual premium of ₹7500—are\
    \ protected against bad actors."
