- id: 1dd9e8a1-9935-5762-bf32-05f66fc2b771
  title: Family Health Indemnity — annual premium explained
  body: 'Q: What is the exact annual premium for the Family Health Indemnity plan?

    A: The annual premium for this plan is ₹9,500. This amount is risk-aligned, reflecting
    the actual cost of risk and our administrative overhead to ensure sustainable
    policy stewardship.


    Q: Does the premium cover all medical expenses?

    A: The premium is the cost to maintain your coverage. The actual medical expenses
    are covered up to the sum insured of ₹500,000, subject to the terms, conditions,
    and sub-limits (such as the room rent cap) detailed in your policy document.


    Q: When is the annual premium due?

    A: Your premium is due annually on the anniversary of your policy inception. We
    recommend timely payment to avoid any break in coverage, especially regarding
    the 36 months waiting period for pre-existing diseases.'
