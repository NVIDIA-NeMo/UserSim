- id: 7d52b28d-9e8f-5de7-98bb-c23b004e4ac1
  title: ULIP Wealth Plan — fraud and unauthorized-activity protection
  body: "At Abhaya Insurance, we are committed to the security of your wealth creation\
    \ journey. The ULIP Wealth Plan, by virtue of its market-linked nature and significant\
    \ fund values, can occasionally be targeted by sophisticated fraud patterns. \n\
    \nCommon threats targeting this product include 'phishing' emails or messages\
    \ that mimic our official communications, claiming there is an urgent need to\
    \ update your KYC or that your fund performance requires immediate action to avoid\
    \ a loss. Fraudsters may also impersonate our relationship managers to request\
    \ 'urgent transfers' to external accounts to secure 'exclusive' investment opportunities.\n\
    \nPlease be assured that Abhaya Insurance will NEVER ask you for your passwords,\
    \ MFA (Multi-Factor Authentication) codes, or request that you transfer policy\
    \ funds to a personal bank account for 'optimisation'. We maintain a zero-trust\
    \ stance regarding identity validation; any state-changing action, such as fund\
    \ withdrawals or policy amendments, will strictly require MFA and KYC verification.\n\
    \nIf you notice any unauthorised activity or receive a suspicious request, the\
    \ first action you must take is to notify us immediately through our official\
    \ channels. Prompt reporting is critical, as timely notification allows us to\
    \ freeze the account and mitigate potential losses. We treat all fraudulent claims\
    \ with a zero-tolerance policy, involving rigorous investigation and reporting\
    \ to the relevant regulatory authorities.\n\nTo further understand how we protect\
    \ your assets, you may also refer to the ULIP Wealth Plan — account security best\
    \ practices."
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 22e84256-9388-536e-b06f-df86b448ceed
  title: ULIP Wealth Plan — account agreement
  body: "This agreement governs the relationship between Abhaya Insurance ('We', 'Us')\
    \ and the Policyholder regarding the ULIP Wealth Plan. \n\n1. Premium Obligations:\
    \ The Policyholder agrees to pay an annual premium of ₹50000. Failure to pay premiums\
    \ within the stipulated grace period may result in the policy lapsing, subject\
    \ to IRDAI regulations.\n\n2. Charges and Deductions: The Policyholder acknowledges\
    \ and accepts the following fee structure:\n- A premium allocation charge of 3%\
    \ shall be deducted from the premium paid before the funds are allocated to the\
    \ chosen investment portfolio.\n- A fund management charge of 1.35% will be applied\
    \ to the fund value to ensure professional portfolio stewardship and operational\
    \ sustainability.\n\n3. Lock-in Period: This product is a hybrid vehicle with\
    \ a mandatory lock-in period of 5 years. No withdrawals or surrenders are permitted\
    \ before the completion of this duration, except in cases specifically mandated\
    \ by law or regulatory authority.\n\n4. Fund Value and Risk: The Policyholder\
    \ understands that the ULIP Wealth Plan is market-linked. We do not guarantee\
    \ a specific rate of return, and the fund value may fluctuate based on market\
    \ performance.\n\n5. Amendments and Termination: Any state-changing amendments\
    \ to the policy require mandatory KYC verification and Multi-factor authentication.\
    \ The agreement ends upon the maturity of the policy, the death of the policyholder,\
    \ or the exercise of the Free-look Period (as defined in our glossary) for a full\
    \ refund of premiums minus applicable statutory charges.\n\n6. Dispute Resolution:\
    \ All disputes will be handled with neutrality and speed. Escalations follow a\
    \ tiered path from customer support to the Grievance Redressal Officer, and finally\
    \ to the Insurance Ombudsman, aiming for resolution within defined IRDAI timelines."
