- id: 1ff84f41-aea2-56ca-b6cc-c49b16173be9
  title: Motor Own-Damage Cover — limits, restrictions, and edge cases
  body: 'This internal guide provides the necessary details for support agents to
    manage customer expectations regarding the limits and restrictions of the Motor
    Own-Damage Cover.


    Financial Thresholds and Limits:

    - Annual Premium: The standard cost for this cover is ₹7500. Agents should ensure
    the customer understands that this premium reflects the actual cost of risk and
    administrative overhead.

    - Compulsory Deductible: Every claim is subject to a compulsory deductible of
    ₹1000. This is the fixed amount the policyholder must bear before the insurance
    coverage kicks in for any single event.

    - No Claim Bonus (NCB): In the first year, eligible policyholders can benefit
    from a no claim bonus of 20%. This is a reward for safe driving and is calculated
    based on the vehicle''s insured declared value.


    Restrictions and Edge Cases:

    - Deductible Application: The compulsory deductible of ₹1000 applies regardless
    of the claim size. If a repair costs less than ₹1000, no claim payout will be
    made.

    - NCB Forfeiture: Please remind customers that the no claim bonus of 20% is typically
    lost if a claim is filed during the policy year.

    - Settlement Timeline: We aim for a claim settlement window of 30 days. Delays
    may occur if documentation is incomplete or if a rigorous investigation into fraudulent
    activity is required.


    Regulatory Compliance:

    Agents must prominently disclose all exclusions and the compulsory deductible
    to the customer to adhere to IRDAI guidelines on the ''Protection of Policyholders''
    Interests''. Ensure the customer is aware of the Free-look Period for reviewing
    these terms.'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 74c35a02-dfe0-5f95-9873-84f83e8eb69d
  title: Motor Own-Damage Cover — claim settlement days explained
  body: 'Frequently Asked Questions regarding the claim timeline for Motor Own-Damage
    Cover.


    **How long does it take to settle a motor insurance claim with Abhaya Insurance?**

    We strive for efficiency and transparency in our settlement process. The standard
    duration for claim settlement is 30 days from the date of final document submission
    and approval. This timeframe allows us to ensure a fair assessment of the damage
    and verify all details.


    **What happens if my claim takes longer than 30 days?**

    While we aim for resolution within 30 days, some cases may require more time if
    there are discrepancies in the records or if the claim is flagged for further
    investigation. We treat all disputes with neutrality and speed, aiming for resolution
    within the defined IRDAI timelines. You can track your progress by requesting
    a status update from us.'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
