- id: 2b30778f-d580-5b8a-9337-c3306ed29ed4
  title: Abhaya Term Life Cover — recognizing scams targeting this product
  body: 'At Abhaya Insurance, we are committed to protecting our policyholders from
    fraudulent activities. Because the Abhaya Term Life Cover provides a high sum
    assured of ₹10000000, it can occasionally be a target for sophisticated scams
    targeting both prospective and existing customers.


    **Common Scam Patterns**

    1. **The ''Premium Waiver'' Scam**: Fraudsters may contact you claiming that due
    to a regulatory change or a special loyalty reward, your annual premium of ₹12000
    has been waived or significantly reduced. They will ask you to ''verify'' your
    identity by providing your MFA codes or bank passwords to process the refund.

    2. **The ''Urgent Policy Lapse'' Notice**: You may receive a message claiming
    your policy is about to lapse and demanding an immediate payment to a non-official
    account to keep the coverage active.

    3. **The ''Guaranteed Return'' Pitch**: Be wary of anyone claiming that this pure
    protection plan can be converted into a guaranteed-return investment. As per our
    institutional standards, we never misrepresent protection products as investment
    vehicles.


    **What We Will Never Do**

    - We will never ask for your multi-factor authentication (MFA) codes, passwords,
    or PINs over the phone or via email.

    - We will never request that premiums be paid into a personal bank account instead
    of the official Abhaya Insurance corporate account.


    **Immediate Actions to Take**

    If you encounter a suspicious request or believe your policy details have been
    compromised, notify us immediately. Prompt reporting is essential for our rigorous
    investigation process. We maintain a zero-tolerance policy toward fraud and will
    report all verified instances to the relevant regulatory authorities.


    For more on protecting your account, please refer to Abhaya Term Life Cover —
    account security best practices.'
  domain: insurance
  product_category: term_life_cover
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 860bd738-99c1-5817-8dab-f89c79030885
  title: Abhaya Term Life Cover — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary details regarding
    the operational limits and restrictions of the Abhaya Term Life Cover to ensure
    accurate customer guidance.


    **Core Policy Parameters**

    - **Sum Assured**: The maximum payout is fixed at ₹10000000.

    - **Policy Term**: The coverage extends for a duration of 30 years.

    - **Annual Premium**: The cost of risk and administration is ₹12000 per year.


    **Critical Restrictions and Limits**

    - **Free-look Period**: Customers have a window of 15 days from the receipt of
    the policy document to review terms and request a full refund if they are dissatisfied.

    - **Grace Period**: To prevent immediate lapse, a grace period of 30 days is provided
    following the premium due date.

    - **Underwriting Limits**: Coverage is subject to fair underwriting. Any Pre-existing
    Disease (PED) must be disclosed and is subject to a mandatory waiting period before
    coverage applies.


    **Edge Cases for Support Handling**

    - **Premium Defaults**: If a premium is not paid within the 30 days grace period,
    the policy may lapse, terminating the ₹10000000 protection.

    - **Early Termination**: If a customer wishes to cancel after the 15 days free-look
    period, they should be guided through the formal closure process, noting that
    this is a pure protection plan without a maturity value.

    - **Nominee Updates**: Precise nominee capture is mandatory for all policies to
    ensure the sum assured reaches the intended beneficiaries without legal dispute.


    For comprehensive regulatory details, refer to Abhaya Term Life Cover — regulatory
    disclosures.'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
