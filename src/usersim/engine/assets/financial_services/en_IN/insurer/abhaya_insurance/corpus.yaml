- id: 25df4a7c-3bb4-5369-ad77-3ed15579999c
  title: Family Health Indemnity — privacy and data handling
  body: 'Abhaya Insurance is committed to the highest standards of data privacy and
    regulatory compliance. This disclosure outlines how we handle your sensitive health
    and personal information in relation to your Family Health Indemnity policy.


    **Data Collection and Purpose**

    We collect personal identifiers and medical history to perform fair underwriting
    and determine your annual premium of ₹9,500. This data is used strictly to manage
    your sum insured of ₹5,00,000 and to evaluate claim admissibility based on the
    30 days initial waiting period and 36 months PED waiting period.


    **Data Security Measures**

    To prevent unauthorised access, we implement a zero-trust identity validation
    framework. Access to your policy data is protected by mandatory Multi-factor authentication
    (MFA) and KYC verification. No state-changing action, such as modifying a nominee
    or initiating a claim, can occur without these security layers.


    **Third-Party Sharing**

    We share your data only with authorised entities, such as network hospitals for
    cashless settlement and regulatory bodies as mandated by IRDAI. We do not sell
    your health data to third-party marketers.


    **Your Rights**

    In accordance with Indian data protection guidelines, you have the right to review
    the data we hold about you. You may request a correction of your records through
    our formal update process. Please be aware that any misrepresentation of health
    data during the application process is treated under our zero-tolerance fraud
    policy and may lead to the immediate termination of your coverage.


    **Regulatory Adherence**

    We prioritise the ''Protection of Policyholders'' Interests'' by ensuring all
    sub-limits, such as the room rent cap of 1% of the sum insured, are disclosed
    prominently before policy issuance.'
  domain: insurance
  product_category: health_indemnity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1f7f45b6-3176-5f2a-8590-74eb141fabb6
  title: Family Health Indemnity — recognizing scams targeting this product
  body: 'At Abhaya Insurance, we are committed to the protection of our policyholders.
    As you compare health insurance options, please be aware of specific fraudulent
    patterns designed to target individuals seeking comprehensive medical coverage.


    **Common Scam Patterns**

    Fraudsters may contact you posing as Abhaya Insurance representatives, claiming
    that your Family Health Indemnity policy is eligible for an ''instant premium
    refund'' or a ''sum insured upgrade'' without additional medical underwriting.
    They may pressure you to pay a small ''processing fee'' to unlock these benefits.
    Please remember that we will never ask you to transfer funds to a personal account
    to upgrade your coverage.


    Another common tactic involves fake ''claim acceleration'' services. Scammers
    may claim they can bypass the initial waiting period of 30 days or the pre-existing
    disease waiting period of 36 months for a fee. This is a fraudulent claim; these
    timelines are regulatory and contractual requirements that cannot be bypassed
    through third-party payments.


    **Our Security Commitment**

    We will never ask for your full password, OTP, or MFA codes over a phone call
    or email. Any state-changing action, such as a change in nominee or a fund withdrawal,
    requires mandatory multi-factor authentication and KYC verification.


    **Immediate Actions if Scammed**

    If you encounter a suspicious request or believe your data has been compromised:

    1. Immediately notify us through our official channels to freeze any pending policy
    amendments.

    2. Report the incident to your local cyber-crime cell and the regulatory authorities.

    3. Change your digital portal credentials immediately.


    We maintain a zero-tolerance policy toward fraud. All fraudulent claims and attempts
    to manipulate policy terms are subject to rigorous investigation and mandatory
    reporting to the IRDAI.'
  domain: insurance
  product_category: health_indemnity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8f6e7b05-05ff-5847-a775-213b1435f27b
  title: Family Health Indemnity — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary technical constraints
    and limits for the Family Health Indemnity plan to ensure accurate customer guidance.


    **Core Financial Limits**

    *   **Sum Insured:** The maximum liability of the insurer for a policy year is
    ₹500,000.

    *   **Annual Premium:** The standard cost for this coverage is ₹9,500.


    **Waiting Period Restrictions**

    Agents must clearly communicate that coverage is not immediate for all conditions:

    *   **Initial Waiting Period:** There is a mandatory window of 30 days from the
    policy inception date. No claims (except for accidental injuries) are admissible
    during these 30 days.

    *   **Pre-existing Disease (PED) Period:** Any condition diagnosed or treated
    prior to the policy inception is subject to a waiting period of 36 months before
    coverage applies.


    **Hospitalisation Constraints**

    *   **Room Rent Sub-limit:** The policy imposes a cap on room rent. This sub-limit
    is 1% of the sum insured. Based on the ₹500,000 sum insured, the maximum admissible
    room rent is ₹5,000 per day. If a customer chooses a room exceeding this limit,
    proportionate deductions will apply to other associated medical expenses.


    **Edge Cases and Compliance**

    *   **Free-look Period:** Policyholders have a 15-day window from the receipt
    of the policy document to review terms and return the policy for a refund.

    *   **Claim Intimation:** To trigger the settlement workflow, the formal process
    of notifying Abhaya Insurance about a loss must be completed as per the guidelines
    in Family Health Indemnity — overview.


    Failure to disclose pre-existing conditions during the underwriting process may
    lead to claim rejection under our zero-tolerance fraud policy.'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 9c3b480d-fea7-5cb5-a54d-604d03653d86
  title: Family Health Indemnity — pre existing waiting months explained
  body: '**What is a Pre-existing Disease (PED) and how does it affect my coverage?**

    A Pre-existing Disease (PED) is any medical condition that was diagnosed or treated
    before your Family Health Indemnity policy began. To ensure fair underwriting,
    these conditions are not covered immediately upon joining.


    **How long must I wait before a pre-existing disease is covered?**

    For the Family Health Indemnity plan, there is a mandatory waiting period of 36
    months. Once you have continuously held the policy for 36 months, the pre-existing
    conditions disclosed at the time of application become eligible for coverage,
    subject to the terms of your policy.


    **What happens if I do not disclose a pre-existing condition?**

    Transparency is a core value at Abhaya Insurance. Non-disclosure of a PED can
    lead to the rejection of your claim or the cancellation of your policy. We encourage
    all prospective customers to be thorough during the application process to ensure
    a smooth claim settlement experience.'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
