- id: 425e05b5-1171-5197-928f-151068fb9834
  title: Abhaya Term Life Cover — change-of-terms policy
  body: 'This document outlines the conditions under which the terms of the Abhaya
    Term Life Cover may be modified. We are committed to transparency and fair underwriting
    for the Indian middle-class professional.


    1. Fixed Terms: The core benefit of the policy—the sum assured of ₹1,000,000,00—and
    the policy term of 30 years are fixed upon issuance and cannot be unilaterally
    increased by the policyholder without fresh underwriting and potential premium
    adjustments.


    2. Premium Adjustments: The annual premium of ₹12,000 is locked for the duration
    of the policy term, provided all payments are made within the grace period of
    30 days. Failure to pay the premium within this window may lead to the policy
    lapsing, necessitating a reinstatement process subject to our current underwriting
    guidelines.


    3. Right to Amend: Abhaya Insurance reserves the right to amend administrative
    procedures or data privacy protocols to comply with evolving IRDAI regulations.
    We will provide a minimum of 30 days'' notice for any change that materially affects
    the policyholder''s obligations.


    4. Free-look Rights: Every policyholder has a statutory Free-look Period of 15
    days from the date of receipt of the policy document. During this window, you
    may review the terms and return the policy for a refund, minus proportional risk
    cover and stamp duty.


    5. Termination: This agreement ends upon the expiry of the 30-year term, the payment
    of the sum assured to the nominee upon the death of the life assured, or the voluntary
    surrender of the policy by the holder. As a pure protection product, there is
    no maturity value upon the completion of the term.'
