- id: 5770b5bf-47c7-56b2-a299-3dedb269219a
  title: Abhaya Term Life Cover — check status or history
  body: 'To maintain full transparency over your protection, we provide a straightforward
    way to review your policy status and payment history. Please follow these steps:


    **Requirements before starting**

    - Your policy number.

    - Valid identification for KYC verification.


    **Steps to check your status**

    1. **Request Policy Summary**: Tell us that you would like to check the current
