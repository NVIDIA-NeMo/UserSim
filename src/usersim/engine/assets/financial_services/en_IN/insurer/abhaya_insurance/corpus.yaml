- id: ccef533d-a136-57b4-a9db-29599af904aa
  title: Motor Own-Damage Cover — recognizing scams targeting this product
  body: 'At Abhaya Insurance, we are committed to protecting your assets and your
    peace of mind. As you compare your vehicle insurance options, please be vigilant
    against fraudulent schemes that often target motorists during the policy purchase
    or claim process.


    Common Fraud Patterns:

    1. The ''Instant Discount'' Scam: Fraudsters may pose as agents offering an annual
    premium significantly lower than our standard ₹7500 by claiming they have ''insider
    access'' to hidden discounts. We maintain a transparent, risk-aligned pricing
    model; any legitimate premium adjustment will be reflected in your official quote
    from us.

    2. The ''Urgent Settlement'' Phish: You may receive messages claiming your claim
    is approved but requiring a small ''processing fee'' to release the funds. We
    will never ask for an upfront payment to settle a claim.

    3. Fake Policy Issuance: Some bad actors provide forged policy documents that
    look like our official Motor Own-Damage Cover. Always verify your policy status
    through our official channels.


    What We Will Never Ask For:

    - We will never ask for your MFA (Multi-Factor Authentication) codes or your KYC
    passwords over a phone call or SMS.

    - We will never request payment into a personal bank account; all premiums are
    paid to Abhaya Insurance.


    Immediate Action:

    If you encounter a suspicious request or believe your identity has been compromised,
    notify us immediately. To maintain our zero-trust stance on identity validation
    for claim settlements, any suspected fraud is handled with a zero-tolerance policy
    and reported to the relevant regulatory authorities. Rapid reporting is essential
    to protect your liability and ensure the integrity of your coverage.'
