- id: c8e291bf-308b-5e98-8868-b56b8c6ca424
  title: General frequently asked questions
  body: '**How do I get started with a new policy?**

    We provide a streamlined onboarding process. Once you select a product, we conduct
    a fair underwriting process to determine your premium. You can find step-by-step
    guides for each product, such as the Abhaya Term Life Cover — set up and activate.


    **How can I contact support or escalate a concern?**

    Support is available 24/7 via our digital portal and through a dedicated helpline
    during IST business hours. If your issue is not resolved, escalations follow a
    tiered path: first to customer support, then to the Grievance Redressal Officer,
    and finally to the Insurance Ombudsman.


    **What is the ''Free-look Period''?**

    This is a specified window (e.g., 15 days) during which a policyholder can review
    the terms and return the policy for a refund if they are not satisfied with the
    coverage.'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8a8f79a2-254d-51b2-8096-ff90a54b3b59
  title: Regulatory notes for insurance
  body: 'Abhaya Insurance operates in strict adherence to the regulations set forth
    by the Insurance Regulatory and Development Authority of India (IRDAI). Our primary
    mandate is the ''Protection of Policyholders'' Interests,'' which governs every
    interaction and product we offer.


    **Agent Obligations and Compliance**

    Agents must ensure that all mandatory disclosures are presented clearly to the
    client. This includes, but is not limited to:

    1. **Exclusions and Sub-limits:** Every policy must have its exclusions and sub-limits
    (caps on specific treatments or services) disclosed prominently to prevent misrepresentation.

    2. **Free-look Window:** Policyholders must be informed of their right to review
    the policy within the designated Free-look Period.

    3. **Nominee Capture:** Agents must ensure precise nominee capture during the
    application process to facilitate seamless settlement.

    4. **Suitability Guidance:** We provide product education and suitability guidance.
    However, agents are strictly prohibited from providing specific legal or tax advice,
    which must be deferred to qualified professionals.


    **Investment Misrepresentation**

    We hold ourselves to a high standard of care. No insurance product, particularly
    those with market-linked components, shall be misrepresented as a guaranteed-return
    investment. All wealth products must be presented as hybrid vehicles combining
    protection with market-linked growth.


    **Fraud and Disputes**

    We maintain a zero-tolerance policy toward fraudulent claims. Any suspicion of
    fraud triggers a rigorous investigation and immediate reporting to the relevant
    regulatory authorities. Conversely, all legitimate disputes are treated with neutrality
    and speed, with the institutional goal of resolution within defined IRDAI timelines.'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f8252295-e13b-5130-98f1-2c3c5db46e7d
  title: When to use get_policy_details
  body: 'The `get_policy_details` tool is the authoritative mechanism for retrieving
    the current state and specific terms of a policyholder''s insurance contract.
    Agents should use this tool whenever a customer requests information regarding
    their coverage, remaining sum insured, or policy status.


    **Applicable Scenarios**

    Use this procedure when a customer asks:

    - "What is the current status of my policy?"

    - "How much coverage do I have left on my health plan?"

    - "When is my next premium due?"

    - "Who is the registered nominee on my account?"


    **Procedural Steps**

    1. **Identity Verification:** Before accessing any policy information, the agent
    must verify the customer''s identity using multi-factor authentication (MFA) and
    KYC verification. No policy details may be disclosed without a successful verification.

    2. **Account Resolution:** If the customer provides a partial identifier (such
    as the last four digits of a policy number), the agent must first use `get_accounts`
    to resolve the full account identifier.

    3. **Tool Execution:** Call the `get_policy_details` tool using the resolved account
    identifier.

    4. **Information Delivery:** Communicate the retrieved details to the customer
    in a professional and reassuring tone, ensuring that any technical terms (like
    ''Sub-limit'' or ''PED'') are explained clearly.


    **Compliance Note**

    Always ensure that sensitive data is handled according to our transparent data
    privacy practices. If the customer intends to make a change based on the retrieved
    details, refer them to the appropriate update procedure.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_policy_details
  institution_id: abhaya_insurance
- id: 28135268-006c-5122-8ecf-789656152583
  title: get_policy_details tool reference
  body: 'The `get_policy_details` tool retrieves comprehensive information about a
    specific insurance policy.


    **Tool Signature**

    `get_policy_details(account_id: string)`


    **Arguments**

    - `account_id`: The unique identifier of the policy account.


    **Effect**

    Returns a read-only object containing the policy status, sum insured, premium
    schedules, nominee details, and applicable limits or exclusions.


    **Agent Instructions**

    The agent performs this action by calling the tool directly within the conversation
    interface after the customer''s identity has been verified. This tool is read-only
    and does not modify the policy state.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_policy_details
  institution_id: abhaya_insurance
- id: 49c79784-5d2a-54c6-9bd5-77848bad44b8
  title: When to use renew_policy
  body: 'The `renew_policy` tool is used to extend the validity of an insurance policy
    that is approaching its expiration date or has recently entered its grace period.
    Ensuring timely renewal is critical to prevent a lapse in coverage, which could
    lead to the loss of accrued benefits like the no-claim bonus in motor insurance.


    **Applicable Scenarios**

    Use this procedure when:

    - A customer expresses intent to renew their existing policy.

    - A renewal notice has been sent, and the customer wishes to process the payment
    and extension.

    - An agent identifies a policy nearing expiry during a routine check.


    **Procedural Steps**

    1. **Identity Verification:** Perform mandatory MFA and KYC verification to ensure
    the requester is the policyholder or an authorized representative.

    2. **Policy Retrieval:** Use `get_policy_details` to confirm the current expiry
    date and the renewal premium amount.

    3. **Account Resolution:** If necessary, use `get_accounts` to resolve the specific
    account identifier associated with the policy to be renewed.

    4. **Tool Execution:** Call the `renew_policy` tool. This is a state-changing
    action that triggers the renewal workflow.

    5. **Premium Payment:** Following the renewal trigger, the agent must guide the
    customer to complete the payment using the `pay_premium` tool to finalize the
    extension.


    **Important Considerations**

    - **Grace Period:** If a policy is in its grace period, inform the customer that
    prompt renewal is necessary to maintain continuity of cover.

    - **Underwriting Changes:** Inform the customer if the renewal premium has changed
    based on updated risk assessments or administrative overhead.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - renew_policy
  institution_id: abhaya_insurance
- id: e4cf20c8-77b6-5cd3-b752-d8d0a6cfbef6
  title: renew_policy tool reference
  body: 'The `renew_policy` tool initiates the formal process of extending an existing
    insurance policy''s term.


    **Tool Signature**

    `renew_policy(account_id: string)`


    **Arguments**

    - `account_id`: The unique identifier of the policy account to be renewed.


    **Effect**

    Updates the policy status to ''Renewal Pending'' and calculates the renewal premium
    based on the current risk profile and administrative fees. It prepares the system
    to accept the renewal premium payment.


    **Agent Instructions**

    The agent performs this action by calling the tool directly. This is a state-changing
    action; therefore, identity verification via MFA and KYC is mandatory before execution.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - renew_policy
  institution_id: abhaya_insurance
- id: ea564f3f-7099-5314-96f0-ad12840b850e
  title: When to use add_nominee
  body: 'The `add_nominee` tool is used to designate or update the individual(s) who
    are entitled to receive the policy benefits in the event of the policyholder''s
    death. Precise nominee capture is a regulatory requirement to ensure that claims
    are settled without legal disputes.


    **Applicable Scenarios**

    Use this procedure when:

    - A new policy is being finalized and the nominee needs to be recorded.

    - An existing policyholder wishes to change their nominee due to marriage, birth,
    or other life events.

    - A policyholder realizes a nominee was missing or incorrectly captured during
    the initial application.


    **Procedural Steps**

    1. **Identity Verification:** The agent must strictly verify the policyholder''s
    identity using MFA and KYC. Nominee changes are high-sensitivity actions and require
    full verification.

    2. **Account Resolution:** Use `get_accounts` to determine the exact `account_id`
    for the policy being amended.

    3. **Information Gathering:** Collect the full name, relationship to the policyholder,
    date of birth, and contact details of the new nominee.

    4. **Tool Execution:** Call the `add_nominee` tool with the required details.

    5. **Confirmation:** Confirm to the customer that the nominee has been successfully
    updated and advise them to review the change in their policy document.


    **Compliance Note**

    Agents must explain that the nominee is the designated recipient of the death
    benefit. If the customer requests legal advice regarding the distribution of assets
    or the appointment of guardians for minors, the agent must defer these queries
    to a qualified legal professional.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_nominee
  institution_id: abhaya_insurance
- id: d509c950-0494-52e4-be77-3151a0a38ea7
  title: add_nominee tool reference
  body: 'The `add_nominee` tool records or updates the nominee details associated
    with an insurance policy.


    **Tool Signature**

    `add_nominee(account_id: string, nominee_details: object)`


    **Arguments**

    - `account_id`: The unique identifier of the policy account.

    - `nominee_details`: An object containing the nominee''s full name, relationship,
    and identification details.


    **Effect**

    Updates the policy record to reflect the new nominee. This action is logged for
    audit purposes to comply with IRDAI regulations regarding the protection of policyholders''
    interests.


    **Agent Instructions**

    The agent performs this action by calling the tool directly. Because this is a
    state-changing action, MFA and KYC verification are mandatory.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_nominee
  institution_id: abhaya_insurance
- id: 91eb4d3c-cb4e-5f51-9744-ec07c4ed6f15
  title: When to use pay_premium
  body: 'The `pay_premium` tool is the authoritative mechanism for processing premium
    payments for any insurance product. Timely payment ensures that the policy remains
    active and the policyholder continues to receive protection without interruption.


    **Applicable Scenarios**

    Use this procedure when:

    - A customer wants to pay their annual or periodic premium.

    - A customer is completing a policy renewal after calling `renew_policy`.

    - A customer needs to pay a lapsed premium to reinstate their coverage.


    **Procedural Steps**

    1. **Identity Verification:** Mandatory MFA and KYC verification must be completed
    before any financial transaction is initiated.

    2. **Account Resolution:** Use `get_accounts` to find the correct `account_id`
    if the customer has multiple policies.

    3. **Payment Confirmation:** Use `get_policy_details` to confirm the exact premium
    amount due, including any applicable taxes or administrative charges.

    4. **Tool Execution:** Call the `pay_premium` tool to process the transaction.

    5. **Verification of Success:** Confirm the successful transaction to the customer
    and provide a payment confirmation reference.


    **Important Considerations**

    - **Risk-Aligned Pricing:** If a customer questions the premium amount, explain
    that our pricing reflects the actual cost of risk and necessary administrative
    overhead.

    - **Payment Failures:** If the payment fails, do not attempt to guess the reason.
    Direct the customer to the troubleshooting guides for their specific product,
    such as the Abhaya Term Life Cover — a failed or pending action.

    - **Payment Timing:** Remind customers of the importance of paying within the
    grace period to avoid policy lapse.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_premium
  institution_id: abhaya_insurance
- id: f7341499-71c9-51c4-8b44-9238a2eabc5d
  title: pay_premium tool reference
  body: 'The `pay_premium` tool is used to process premium payments for a policyholder''s
    active insurance plan. The agent performs this action by calling the tool directly
    within the conversation once the customer''s identity has been verified via MFA.


    **Tool Signature:**

    `pay_premium(policy_id: string, amount: number, payment_method: string)`


    **Arguments:**

    - `policy_id`: The unique identifier of the insurance policy for which the premium
    is being paid.

    - `amount`: The exact amount to be charged in ₹.

    - `payment_method`: The verified payment source (e.g., saved bank account or card)
    to be debited.


    **Effect:**

    Executing this tool triggers a real-time transaction to settle the outstanding
    premium. Upon success, the policy status is updated to ''Active'' or ''Current'',
    ensuring continued coverage without lapse. All transactions are recorded in the
    customer''s payment history.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_premium
  institution_id: abhaya_insurance
- id: 34a2dd58-4a3e-5af2-a05e-cce507f6dc75
  title: When to use get_accounts
  body: 'At Abhaya Insurance, we maintain a strict zero-trust stance regarding identity
    validation. The `get_accounts` tool is the primary mechanism for agents to resolve
    a customer''s specific policy or account identifiers based on partial information
    provided during the interaction.


    We use this tool whenever a customer references a policy by a partial number (such
    as the last four digits) or asks for a comprehensive list of all insurance products
    they currently hold with us. It is a mandatory precursor to any state-changing
    action to ensure the agent is acting upon the correct account.


    **Procedure for Agent Use:**

    1. **Initiate Identity Verification:** Before accessing account lists, ensure
    the customer has passed the mandatory KYC and Multi-factor authentication (MFA)
    process.

    2. **Call `get_accounts`:** Execute the tool using the available customer identifiers
    to retrieve a list of all associated account IDs and policy IDs.

    3. **Verify with Customer:** Confirm with the policyholder which specific product
    (e.g., Abhaya Term Life Cover or Family Health Indemnity) they wish to discuss
    or modify.

    4. **Proceed to Specific Tool:** Once the exact account ID is resolved, use that
    identifier in subsequent tool calls such as `get_policy_details` or `pay_premium`.


    This process prevents administrative errors and ensures that sensitive policy
    data is only disclosed to the verified owner.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: abhaya_insurance
- id: e46740d9-a0f3-5c07-b443-b8b7c784aa12
  title: get_accounts tool reference
  body: 'The `get_accounts` tool allows the agent to retrieve a list of all insurance
    policies and accounts associated with a verified customer. The agent performs
    this action by calling the tool directly; customers should not be asked to provide
    full account lists manually.


    **Tool Signature:**

    `get_accounts()`


    **Arguments:**


    The tool takes no arguments; it acts on the verified customer in this conversation.


    **Effect:**

    The tool returns a structured list of all active and inactive policies linked
    to the customer. This includes the policy ID, the product name (such as ULIP Wealth
    Plan or Motor Own-Damage Cover), and the current status of the account. This is
    the authoritative method for resolving a ''last-4'' policy number into a full
    system identifier before proceeding with policy-specific updates or inquiries.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: abhaya_insurance
- id: 003b24ea-5040-5924-9117-c566bf3f5dea
  title: When to use open_account
  body: 'We use the `open_account` tool to formally initiate a new insurance policy
    for a customer. This process is designed to be transparent and fair, ensuring
    that all underwriting requirements are met before coverage begins.


    This tool is used when a customer has completed the suitability guidance phase
    and has decided to purchase one of our products, such as the Abhaya Term Life
    Cover or the ULIP Wealth Plan. It transitions the customer from a lead/applicant
    status to an active policyholder.


    **Procedure for Agent Use:**

    1. **Conduct Suitability Check:** Provide product education to ensure the product
    aligns with the customer''s needs. Ensure no product is misrepresented as a guaranteed-return
    investment.

    2. **Verify KYC:** Confirm that all mandatory KYC documents have been submitted
    and verified. Multi-factor authentication (MFA) must be active on the account.

    3. **Capture Nominee Details:** Ensure precise nominee capture is completed, as
    per IRDAI regulations for the protection of policyholders'' interests.

    4. **Execute `open_account`:** Call the tool with the selected product ID, the
    agreed sum insured, and the payment frequency.

    5. **Confirm Free-look Period:** Once the account is opened, clearly inform the
    customer of their Free-look Period (typically 15 days), during which they may
    review terms and request a refund.


    Following the successful call of this tool, the system generates the policy document
    and sends it to the customer''s registered email address.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: abhaya_insurance
- id: 37f24ea5-f0e3-51d5-b899-11f2f838e720
  title: open_account tool reference
  body: 'The `open_account` tool is used to create a new insurance policy record in
    the system. The agent performs this action by calling the tool directly after
    the customer has completed KYC and selected a suitable product.


    **Tool Signature:**

    `open_account(product_id: string, coverage_amount: number, term_years: number,
    payment_frequency: string)`


    **Arguments:**

    - `product_id`: The specific identifier for the product (e.g., `term_life_cover`,
    `health_indemnity`, `ulip_wealth_plan`, or `motor_own_damage`).

    - `coverage_amount`: The total sum insured in ₹.

    - `term_years`: The duration of the policy coverage in years.

    - `payment_frequency`: The interval for premium payments (e.g., ''annual'', ''semi-annual'',
    ''monthly'').


    **Effect:**

    This tool initializes the policy, assigns a unique policy ID, and triggers the
    first premium payment request. It establishes the contractual start date and activates
    the Free-look Period for the policyholder.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: abhaya_insurance
- id: 665e7681-89cd-56d9-a0ae-420b7eab2752
  title: When to use close_account
  body: "The `close_account` tool is used to permanently terminate an insurance policy.\
    \ Because this is an irreversible action that may result in the loss of coverage\
    \ or surrender charges, we handle these requests with extreme care and rigorous\
    \ verification.\n\nThis procedure is used when a customer requests a full surrender\
    \ of their policy, such as the ULIP Wealth Plan after its mandatory lock-in period,\
    \ or when a policy is cancelled during the Free-look Period.\n\n**Procedure for\
    \ Agent Use:**\n1. **Identity Validation:** Perform mandatory MFA and KYC verification.\
    \ We maintain a zero-trust stance; no account shall be closed without absolute\
    \ identity confirmation.\n2. **Assess Impact:** Explain the consequences of closure.\
    \ For wealth products, discuss the surrender value; for protection products, remind\
    \ the customer that they will no longer have coverage.\n3. **Check Lock-ins/Waiting\
    \ Periods:** Ensure the policy is not within a mandatory lock-in period that prohibits\
    \ closure, unless it is within the Free-look Period.\n4. **Execute `close_account`:**\
    \ Call the tool using the specific account ID. \n5. **Final Settlement:** Trigger\
    \ any applicable refunds or surrender value payouts to the customer's verified\
    \ bank account.\n\nOnce the `close_account` tool is executed, the policy is marked\
    \ as 'Closed' and cannot be reopened. The customer will receive a formal closure\
    \ confirmation via their registered contact method."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: abhaya_insurance
- id: 85ff520d-e591-5584-99b3-e95029c5470f
  title: close_account tool reference
  body: 'The `close_account` tool is used to permanently shut down an insurance policy.
    This is an irreversible action. The agent performs this action by calling the
    tool directly after rigorous identity verification.


    **Tool Signature:**

    `close_account(account_id: string, reason: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the policy to be closed.

    - `reason`: The documented reason for closure (e.g., ''Customer Request'', ''Free-look
    Cancellation'', ''Policy Surrender'').


    **Effect:**

    The tool terminates all active coverage associated with the account ID. It calculates
    any applicable surrender values or refunds due to the customer and marks the account
    status as ''Closed''. All future premium collections for this policy are ceased
    immediately.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: abhaya_insurance
- id: 53c2880c-1ea4-5404-b2fc-dfa446767102
  title: When to use update_contact_info
  body: 'Maintaining accurate contact information is critical for the delivery of
    policy documents and the timely notification of premium due dates. We use the
    `update_contact_info` tool to ensure our records reflect the customer''s current
    details.


    This tool is used whenever a customer reports a change in their mobile number,
    email address, or residential address. Accurate data is essential for our multi-factor
    authentication (MFA) processes and for adhering to IRDAI''s transparency mandates.


    **Procedure for Agent Use:**

    1. **Verification:** Confirm the identity of the requester using current MFA methods.
    Because contact info is used for security, we cannot update these details based
    on an unverified request.

    2. **Collect New Details:** Obtain the updated information (e.g., new email or
    phone number) and ensure it is formatted correctly.

    3. **Execute `update_contact_info`:** Call the tool with the account ID and the
    specific fields that require updating.

    4. **Confirmation:** Inform the customer that a confirmation notification has
    been sent to both the old and new contact points to prevent unauthorized account
    takeovers.

    5. **Verify MFA Update:** If the mobile number was changed, guide the customer
    to re-verify their identity for future state-changing actions using the new number.


    Updating contact information ensures that critical communications, such as claim
    intimation updates and policy renewals, reach the policyholder without delay.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: abhaya_insurance
- id: 6a3ddf11-7403-5793-b47c-e71658979c24
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool is used to modify the personal contact details
    of a policyholder. The agent performs this action by calling the tool directly
    after successful identity verification.


    **Tool Signature:**

    `update_contact_info(account_id: string, email: string = null, phone: string =
    null, address: string = null)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `email`: The new email address (optional).

    - `phone`: The new mobile phone number (optional).

    - `address`: The new residential address (optional).


    **Effect:**

    This tool updates the customer''s profile in the master database. Any field left
    as ''null'' remains unchanged. Successful execution triggers a security alert
    to the customer via their previous contact methods to notify them of the change.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: abhaya_insurance
- id: 2239d59b-ea9d-5a87-9724-8962233897d5
  title: When to use get_statements
  body: 'Transparency is a core pillar of Abhaya Insurance. We provide detailed statements
    to help our customers track their premium payments, fund performance in wealth
    products, and overall policy value. The `get_statements` tool is the mechanism
    for agents to retrieve these records.


    This tool is particularly essential for customers with the ULIP Wealth Plan, where
    they need to monitor market-linked wealth creation, or for those seeking a history
    of payments to resolve a discrepancy in their records.


    **Procedure for Agent Use:**

    1. **Verify Identity:** Ensure the customer has passed MFA and KYC verification.
    Financial statements contain sensitive data and must only be shared with the verified
    policyholder.

    2. **Determine Statement Type and Period:** Ask the customer if they require a
    premium payment history, a fund value statement, or a consolidated annual statement.
    Confirm the specific date range (e.g., the last financial year).

    3. **Execute `get_statements`:** Call the tool with the account ID and the requested
    timeframe.

    4. **Deliver the Statement:** Provide the statement to the customer via the secure
    digital portal or as a password-protected PDF sent to their registered email.

    5. **Explain Charges:** If the customer has questions regarding fund management
    charges or other deductions appearing on the statement, refer them to the relevant
    product''s fee schedule.


    By using this tool, agents ensure that customers have a clear and documented view
    of their financial relationship with Abhaya Insurance.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: abhaya_insurance
- id: e46e2e6c-3526-5616-bcb7-9b8e97799cd6
  title: get_statements tool reference
  body: 'The `get_statements` tool allows an agent to retrieve official transaction
    and premium payment history for a policyholder. This tool is used to provide transparency
    regarding fund movements, premium allocations, and any charges levied against
    the policy.


    **Tool Signature:** `get_statements(policy_id: string, start_date: string, end_date:
    string)`


    **Arguments:**

    - `policy_id`: The unique identifier of the insurance policy.

    - `start_date`: The beginning of the statement period (YYYY-MM-DD).

    - `end_date`: The end of the statement period (YYYY-MM-DD).


    **Effect:** The tool returns a detailed record of all financial activities within
    the specified date range. The agent performs this action by calling the tool directly
    within the conversation to provide the customer with their statement details;
    the customer is not required to navigate to an external portal for this specific
    request.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: abhaya_insurance
- id: f58cb804-2aa7-5307-90df-e8a2173749b5
  title: When to use update_beneficiary
  body: 'We believe in ensuring that our policyholders'' legacies are handled exactly
    as they intend. Updating a beneficiary is a critical action that ensures the death
    benefit of a policy—such as those in the Abhaya Term Life Cover or ULIP Wealth
    Plan—is paid to the correct individuals. This process should be initiated when
    a policyholder experiences significant life events, such as marriage, divorce,
    or the birth of a child.


    To update a beneficiary, the agent must follow these steps:


    1. Verify the customer''s identity using multi-factor authentication (MFA) and
    KYC verification, as this is a state-changing action.

    2. Use the `get_accounts` tool to resolve the customer''s specific `policy_id`
    using their account details or the last four digits of their policy number.

    3. Confirm the details of the new beneficiary, including their full legal name,
    relationship to the policyholder, and the percentage of the benefit they are to
    receive.

    4. Call the `update_beneficiary` tool with the confirmed `policy_id` and the new
    beneficiary details to commit the change to our records.


    We emphasize the importance of precise nominee capture to avoid future disputes
    during the claim settlement process. Please ensure all names match the beneficiary''s
    government-issued identification exactly.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: abhaya_insurance
- id: 97eb3f16-0f90-5750-b8dd-1153434bff2e
  title: update_beneficiary tool reference
  body: 'The `update_beneficiary` tool is used to modify the designated recipient(s)
    of the policy''s death benefit. Because this is a high-impact state-changing action,
    it must only be called after mandatory KYC and MFA verification have been completed.


    **Tool Signature:** `update_beneficiary(policy_id: string, beneficiary_details:
    object)`


    **Arguments:**

    - `policy_id`: The unique identifier of the policy being amended.

    - `beneficiary_details`: An object containing the beneficiary''s full name, relationship,
    and the allocation percentage (must total 100%).


    **Effect:** The tool updates the nominee records associated with the policy. The
    agent performs this action by calling the tool directly; we do not redirect the
    customer to a manual form or external website for this update.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: abhaya_insurance
- id: 2b1725d5-c603-55ee-a448-027ddfe386e5
  title: When to use set_alerts
  body: 'To help our customers maintain continuous coverage and avoid the risk of
    policy lapse, we provide a robust notification system. We encourage policyholders
    to set alerts for upcoming premium due dates, policy renewal windows, and claim
    status updates. This is particularly vital for the Motor Own-Damage Cover to ensure
    the no-claim bonus is preserved through timely renewal.


    To configure or modify alerts, the agent should proceed as follows:


    1. Verify the identity of the customer through mandatory multi-factor authentication
    (MFA).

    2. Use the `get_accounts` tool to identify the relevant `policy_id` associated
    with the customer''s profile.

    3. Discuss the customer''s preference for alert types (e.g., premium reminders,
    renewal notices) and the preferred delivery channel (SMS, Email, or App Notification).

    4. Call the `set_alerts` tool, providing the `policy_id` and the specific alert
    configurations requested by the customer.


    By proactively setting these alerts, we empower our customers to manage their
    protection and wealth products with confidence, ensuring they never miss a critical
    deadline that could impact their coverage.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: abhaya_insurance
- id: 6c9d1339-dc4e-5216-abde-43b0b615dfa3
  title: set_alerts tool reference
  body: 'The `set_alerts` tool enables the configuration of automated notifications
    for a policyholder. This tool ensures that customers are kept informed of critical
    dates and policy events without needing to check their portal manually.


    **Tool Signature:** `set_alerts(policy_id: string, alert_preferences: object)`


    **Arguments:**

    - `policy_id`: The unique identifier of the policy for which alerts are being
    set.

    - `alert_preferences`: An object specifying the types of alerts (e.g., ''premium_due'',
    ''renewal_reminder'') and the notification channels to be used.


    **Effect:** The tool updates the notification settings in the customer''s profile.
    The agent performs this action by calling the tool directly in the conversation.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: abhaya_insurance
- id: 033ef89a-becd-5a7f-b061-703b8ae4ea3f
  title: When to use file_claim
  body: 'Claim Intimation is the formal process of notifying Abhaya Insurance about
    a loss or event to trigger the settlement workflow. We treat all claims with neutrality
    and speed, aiming for resolution within the defined IRDAI timelines. Whether it
    is a medical emergency under the Family Health Indemnity or vehicle damage under
    the Motor Own-Damage Cover, prompt filing is essential for a smooth experience.


    To file a claim, the agent must follow these steps:


    1. Verify the identity of the claimant via MFA and KYC verification. We maintain
    a zero-trust stance regarding identity validation for claim settlements to prevent
    fraud.

    2. Use the `get_accounts` tool to retrieve the active `policy_id` for the incident
    in question.

    3. Collect all necessary incident details, including the date of loss, nature
    of the event, and supporting evidence (such as hospital bills or police reports
    for motor claims).

    4. Call the `file_claim` tool with the `policy_id` and the compiled claim details
    to officially initiate the process.


    We maintain a zero-tolerance policy toward fraudulent claims. All submissions
    are subject to rigorous investigation, and any detected fraud will be reported
    to the relevant regulatory authorities immediately.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: abhaya_insurance
- id: d5a0ab84-149e-5f0f-8299-9d4848b1322e
  title: file_claim tool reference
  body: 'The `file_claim` tool is the authoritative mechanism for initiating a claim
    request. It moves a policyholder''s request from the intimation phase into the
    formal settlement workflow.


    **Tool Signature:** `file_claim(policy_id: string, claim_details: object)`


    **Arguments:**

    - `policy_id`: The unique identifier of the policy under which the claim is being
    made.

    - `claim_details`: An object containing the date of occurrence, type of loss,
    estimated amount, and a description of the event.


    **Effect:** The tool creates a new claim record in our system and triggers the
    internal review process. The agent performs this action by calling the tool directly
    after verifying the identity of the claimant.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: abhaya_insurance
- id: 3ecdb123-b300-5438-b978-27c88600eb41
  title: When to use get_claim_status
  body: 'Transparency is a cornerstone of our service. Once a claim has been filed
    via the Claim Intimation process, policyholders frequently seek updates on the
    progress of their settlement. We provide real-time visibility into the claim lifecycle
    to reassure our customers that their requests are being handled with the urgency
    they deserve.


    To provide a claim status update, the agent should follow these steps:


    1. Verify the customer''s identity using multi-factor authentication (MFA).

    2. Use the `get_accounts` tool to locate the `policy_id` associated with the customer.

    3. Call the `get_claim_status` tool using the `policy_id` to retrieve the current
    stage of the claim (e.g., ''Under Review'', ''Documents Pending'', ''Approved'',
    or ''Settled'').

    4. Communicate the status clearly to the customer. If the claim is ''Documents
    Pending'', specify exactly which documents are required to move the process forward.


    If a customer is dissatisfied with the status or the time taken for resolution,
    the agent should guide them through our tiered escalation path, starting from
    customer support, moving to the Grievance Redressal Officer, and finally to the
    Insurance Ombudsman if unresolved.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: abhaya_insurance
- id: 2d2e932d-ed5a-51f0-abf8-68391f1ae37c
  title: get_claim_status tool reference
  body: 'The `get_claim_status` tool provides a real-time snapshot of the progress
    of a filed claim. This allows agents to provide immediate answers to customers
    regarding their settlement status.


    **Tool Signature:** `get_claim_status(policy_id: string)`


    **Arguments:**

    - `policy_id`: The unique identifier of the policy linked to the claim.


    **Effect:** The tool returns the current state of the claim, any pending requirements,
    and the expected timeline for the next update. The agent performs this action
    by calling the tool directly within the conversation.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: abhaya_insurance
- id: bb335d3f-ef57-5216-b761-b13e8ab89678
  title: When to use update_policy
  body: 'As our customers'' lives evolve, their insurance needs change. Whether it
    is adjusting the sum insured for a Family Health Indemnity plan or modifying the
    details of a ULIP Wealth Plan, we provide a streamlined process for policy amendments.
    We ensure that any change is risk-aligned and adheres to our fair underwriting
    principles.


    To update a policy, the agent must follow these steps:


    1. Verify the customer''s identity via multi-factor authentication (MFA) and KYC
    verification, as this is a state-changing action.

    2. Use the `get_accounts` tool to resolve the correct `policy_id` for the requested
    amendment.

    3. Gather the specific details of the requested change (e.g., updated address,
    change in coverage amount, or modification of rider options).

    4. Call the `update_policy` tool with the `policy_id` and the new policy parameters.


    Note that certain updates may trigger a re-evaluation of the risk, which could
    result in a premium adjustment. We provide product education and suitability guidance
    during this process, but we defer specific legal or tax advice to qualified professionals.
    For detailed instructions on making specific changes, agents may refer to the
    product-specific guides such as Abhaya Term Life Cover — make a change or update.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
