- id: 6a72131b-4059-5859-8656-2ac20be8a987
  title: Abhaya Term Life Cover — overview
  body: 'We believe that true peace of mind comes from knowing your loved ones are
    secure, no matter what the future holds. The Abhaya Term Life Cover is a high-value
    pure protection plan designed to provide maximum family security at an affordable
    cost, ensuring that your dependents maintain their standard of living in your
    absence.


    This product is structured to offer substantial coverage without the complexity
    of investment-linked plans. By focusing solely on protection, we are able to keep
    premiums competitive and risk-aligned.


    **Core Policy Details**

    - **Sum Assured:** ₹10000000

    - **Annual Premium:** ₹12000

    - **Policy Term:** 30 years


    **Key Policy Features**

    To ensure transparency and fairness, we provide a Free-look Period of 15 days
    from the date of receipt of the policy document. During this window, you may review
    the terms and conditions; if they do not meet your requirements, you can return
    the policy for a refund.


    Additionally, we understand that life can be unpredictable. We provide a grace
    period of 30 days for the payment of premiums to ensure your coverage does not
    lapse due to a momentary delay.


    **Important Considerations**

    Please be aware that any Pre-existing Disease (PED) must be disclosed at the time
    of application. Such conditions are subject to a mandatory waiting period before
    coverage applies. We adhere strictly to IRDAI regulations to prioritize the protection
    of our policyholders'' interests.


    ***

    **Disclaimer:** Abhaya Insurance provides product education and suitability guidance.
    We defer specific legal or tax advice to qualified professionals. This product
    is a pure protection plan and is not a guaranteed-return investment.'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
