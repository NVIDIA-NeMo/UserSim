- id: 276b3542-edf0-5714-b3f1-888060ed6a91
  title: ULIP Wealth Plan — set up and activate
  body: 'Setting up your ULIP Wealth Plan is a structured process designed to ensure
    your identity is verified and your investment preferences are correctly recorded.
    Please follow these steps to activate your policy.


    Prerequisites:

    Before beginning, please have your PAN card, Aadhaar card, and a cancelled cheque
    for the bank account you wish to link for premium payments.


    Step 1: Provide your personal and nominee details

    Tell us your full legal name, date of birth, and the details of your chosen nominee.
    Precise nominee capture is a mandatory requirement for your family''s security.


    Step 2: Complete KYC Verification

    Submit your KYC documents. We perform mandatory KYC verification and use multi-factor
    authentication (MFA) to ensure the security of your account before any policy
    is issued.


    Step 3: Select your investment fund preference

    Tell us how you wish to allocate your funds among the available market-linked
    options. We will provide education on the different fund risks to help you make
    an informed choice.


    Step 4: Pay the initial annual premium

    Make the first payment of ₹50,000. We will confirm receipt of the funds and provide
    a payment acknowledgment.


    Step 5: Review the policy document

    We will issue your policy document. You now enter the Free-look Period (typically
    15 days), during which you can review the terms. If you are not satisfied, you
    may return the policy for a refund.


    Step 6: Activation Confirmation

    Once the Free-look Period expires or you provide your acceptance, we will send
    a final activation notice. Your 5 years lock-in period begins from the date of
    policy inception.'
