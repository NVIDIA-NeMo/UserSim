- id: f36f5209-4804-543e-9480-557923a468aa
  title: Abhaya Term Life Cover — when to switch or upgrade
  body: 'Understanding when to maintain your current coverage or seek an upgrade is
    key to long-term financial security.


    **Current Plan (Abhaya Term Life Cover)**

    - **Sum Assured**: ₹10000000

    - **Cost**: ₹12000 annual premium

    - **Duration**: 30 years term

    - **Focus**: Maximum pure protection for family security.


    **When to stay with this product**

    This product is ideal if your primary goal is high-value life cover at an affordable
    cost and you do not require a maturity benefit or an investment component.


    **When to consider switching or upgrading**

    - **Wealth Creation Needs**: If you now require a hybrid vehicle that combines
    life cover with market-linked growth, you may consider moving toward the ULIP
    Wealth Plan. Note that this involves a mandatory lock-in period and fund management
    charges, unlike the pure protection model of the term cover.

    - **Increased Liability**: If your financial obligations (e.g., a larger home
    loan) exceed the ₹10000000 sum assured, you should ask us about increasing your
    cover.


    For a detailed look at wealth-linked options, see ULIP Wealth Plan — overview.'
