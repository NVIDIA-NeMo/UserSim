- id: 88ccc780-23e2-5f0c-93d3-5606d04035bf
  title: ULIP Wealth Plan — access or login problems
  body: 'If you are unable to access your account to view your fund performance or
    policy details, please follow these steps to resolve the issue.


    **Symptom:** "I cannot log in to my account" or "My MFA code is not arriving."


    **Likely Causes:**

    - Outdated contact information (mobile/email) preventing MFA delivery.

    - Account lock due to multiple incorrect password attempts.

    - Browser cache or compatibility issues with our security protocols.


    **Resolution Steps:**

    1. **Verify Connectivity:** Ensure you have a stable network connection and check
    if your registered mobile device is capable of receiving SMS.

    2. **Request a New Code:** If the MFA code hasn''t arrived, ask us to trigger
    a fresh code. We will verify your identity through secondary security questions
    before doing so.

    3. **Credential Reset:** If you have forgotten your password, tell us you need
    a reset. We will guide you through a secure identity verification process, followed
    by an MFA challenge, after which you can set a new password.

    4. **KYC Status Check:** In some cases, access is restricted if your KYC documentation
    has expired. Ask us to check your KYC status; if expired, we will request the
    updated documents from you immediately.


    **When to Escalate:**

    If these steps do not restore access, we will raise a high-priority ticket with
    our technical security team. You will receive a case reference number and an email
    update within 24 to 48 hours. For systemic disputes regarding account access,
    we follow the tiered path from customer support to the Grievance Redressal Officer,
    and finally to the Insurance Ombudsman.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
