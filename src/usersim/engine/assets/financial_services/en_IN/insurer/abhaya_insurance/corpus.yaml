  title: Motor Own-Damage Cover — set up and activate
  body: 'Activating your Motor Own-Damage Cover is a streamlined process. Before starting,
    please ensure you have your vehicle registration certificate (RC), a valid driving
    licence, and your KYC documents ready.


    1. Provide us with your vehicle details, including the make, model, and registration
