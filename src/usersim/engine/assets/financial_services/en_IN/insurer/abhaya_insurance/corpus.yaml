- id: 292715bd-7fba-5b91-8e33-659f657e0728
  title: ULIP Wealth Plan — interest rate / APY schedule
  body: "Unlike traditional fixed-income insurance products, the ULIP Wealth Plan\
    \ does not have a flat, guaranteed interest rate or a fixed APY. \n\nInvestment\
    \ Nature:\nBecause this is a market-linked hybrid vehicle, the growth of your\
    \ investment is determined by the performance of the funds you select. There is\
    \ no single interest rate that applies to all balances; instead, the value of\
    \ your policy increases or decreases based on the Net Asset Value (NAV) of the\
    \ underlying market assets.\n\nFactors Affecting Value:\n- Fund Performance: The\
    \ primary driver of your wealth creation is the performance of the equity or debt\
    \ markets.\n- Deductions: The fund value is net of the 1.35% fund management charge,\
    \ which is applied to ensure professional portfolio stewardship.\n- Allocation:\
    \ The initial investment is reduced by a 3% premium allocation charge.\n\nFor\
    \ customers seeking guaranteed returns, we recommend reviewing our traditional\
    \ protection products, though they do not offer the same market-linked growth\
    \ potential as the ULIP Wealth Plan."
