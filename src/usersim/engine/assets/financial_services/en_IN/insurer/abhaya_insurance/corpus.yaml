- id: 56d31281-a92a-586a-a1d5-d50a5e0e9dac
  title: ULIP Wealth Plan — cost and charges
  body: '**What are the primary costs associated with my ULIP Wealth Plan?**

    Your plan has two main charges that ensure operational sustainability and professional
    management of your funds:

    1. **Premium Allocation Charge**: A 3% charge deducted from your premium before
    the money is invested.

    2. **Fund Management Charge**: An annual charge of 1.35% of the fund value, which
    covers the cost of expert portfolio stewardship.


    **How is the annual premium structured?**

    The plan is based on a fixed annual premium of ₹50000.


    **Why are these fees charged?**

    Our pricing is risk-aligned. The allocation charge covers the cost of policy issuance
    and administration, while the fund management charge ensures that your investments
    are managed by qualified professionals to optimize long-term wealth creation.
    For further details, you may refer to the ULIP Wealth Plan — fee schedule.'
