- id: 076f516b-bce0-5126-8eb3-2f5ae9086b4c
  title: ULIP Wealth Plan — a failed or pending action
  body: 'If you encounter an issue where a premium payment, fund switch, or policy
    amendment appears as ''Failed'' or ''Pending'', please follow these troubleshooting
    steps.


    Common Symptoms:

    - The annual premium of ₹50,000 has been debited from your bank but not reflected
    in the policy.

    - A request to change fund allocation is showing as ''Pending''.

    - Access to fund withdrawal is blocked despite the policy being active.


    What to check in order:

    1. Verification Status: Ensure your KYC is up to date. We maintain a zero-trust
    stance regarding identity; if your KYC has expired, state-changing actions will
    be paused.

    2. Lock-in Period: If you are attempting a withdrawal, check if your 5 years lock-in
    period has been completed. Withdrawals are not permitted before this duration
    expires.

    3. Payment Gateway Lag: For premium payments, allow 48 business hours for the
    banking system to sync with our records.


    How to resolve:

    - For KYC issues: Provide us with your updated identity documents. We will verify
    them and unlock the account functions.

    - For payment discrepancies: Provide the transaction reference number. We will
    manually reconcile the payment with our bank statements.

    - For pending switches: Confirm the request details with us; we will trigger a
    re-validation of the request.


    When we will escalate:

    If the issue is not resolved within 3 business days, we will raise a formal case
    to our internal operations team. You will receive a case reference number via
    SMS/Email. If the resolution remains pending beyond IRDAI timelines, you may escalate
    the matter to our Grievance Redressal Officer.'
