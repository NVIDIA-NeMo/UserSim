- id: c25b232a-001f-568b-bc4f-15a797e27cdb
  title: Motor Own-Damage Cover — risk disclosures
  body: 'In adherence to IRDAI regulations and our commitment to the ''Protection
    of Policyholders'' Interests'', Abhaya Insurance provides the following mandatory
    disclosures for the Motor Own-Damage Cover.


    Financial Obligations:

    The policy requires a fixed annual premium of ₹7500. This premium is calculated
    based on the actual cost of risk and administrative overhead. Please note that
    this is a protection product and should not be viewed as an investment.


    Coverage Limitations and Exclusions:

    - Compulsory Deductible: Every claim under this policy is subject to a compulsory
    deductible of ₹1000. This amount is non-reimbursable and must be borne by the
    policyholder for every claim event.

    - NCB Forfeiture: The No-Claim Bonus of 20% (applicable in the first year) is
    contingent upon the policy remaining claim-free. Filing a claim will result in
    the forfeiture of this bonus for the subsequent renewal period.

    - Waiting Periods: Certain components of the cover may be subject to mandatory
    waiting periods as per the policy schedule.


    Settlement Timelines:

    While we aim for neutrality and speed, the official window for claim settlement
    is 30 claim settlement days. This period begins only after the complete set of
    required documents has been submitted and verified via our zero-trust identity
    validation process.


    Regulatory Compliance:

    We strictly follow IRDAI guidelines. Policyholders are encouraged to utilise the
    Free-look Period (typically 15 days) to review these terms. Any misrepresentation
    of vehicle details during the application process may lead to the rejection of
    claims or termination of the policy.


    For further guidance on how these terms are applied in a contract, please see
    Motor Own-Damage Cover — account agreement.'
