- id: 386c21d5-e1d0-59e0-b5e2-3c03598ef480
  title: Abhaya Term Life Cover — comparison vs. alternatives and when not to choose
    it
  body: "Choosing the right insurance product requires understanding the trade-offs\
    \ between pure protection and wealth-building instruments. The Abhaya Term Life\
    \ Cover is designed as a pure protection tool.\n\n**Product Specifications**\n\
    - **Sum Assured**: ₹10000000\n- **Annual Premium**: ₹12000\n- **Policy Term**:\
    \ 30 years\n- **Free-look Period**: 15 days\n\n**Comparison vs. Alternatives**\n\
    \n1. **vs. ULIPs (Unit Linked Insurance Plans)**\n   - **Structure**: The Term\
    \ Life Cover is 'pure risk' coverage. If the policyholder survives the 30 years\
    \ term, there is no maturity payout. A ULIP combines life cover with market-linked\
    \ investments.\n   - **Cost**: The annual premium of ₹12000 is significantly lower\
    \ than a ULIP of similar life cover because there is no investment component.\n\
    \   - **Liquidity**: Term insurance has no surrender value; ULIPs have a mandatory\
    \ lock-in period but allow partial withdrawals thereafter.\n\n2. **vs. Whole Life\
    \ Insurance**\n   - **Duration**: This plan covers you for 30 years. Whole life\
    \ plans cover you until death (usually age 99 or 100), typically at a much higher\
    \ premium.\n\n**When NOT to choose the Abhaya Term Life Cover**\n- **If you want\
    \ a return on investment**: If you are looking for a product that acts as a savings\
    \ vehicle or provides a guaranteed corpus upon maturity, this is not the right\
    \ choice. We ensure no pure protection product is misrepresented as a guaranteed-return\
    \ investment.\n- **If you need lifelong coverage**: Since this policy expires\
    \ after 30 years, it is not suitable for those seeking cover that lasts their\
    \ entire natural life regardless of the term.\n\nFor more on how we handle wealth-hybrid\
    \ products, refer to ULIP Wealth Plan — overview."
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a5684c23-8c91-5608-927a-99daec256d3c
  title: Abhaya Term Life Cover — grace period days explained
  body: '**What is the grace period for my Abhaya Term Life Cover?**

    We provide a grace period of 30 days from the date your annual premium of ₹12000
    is due. This ensures that your family''s ₹10000000 sum assured protection remains
    active even if you miss the exact payment date.


    **Does my cover remain active during the grace period?**

    Yes, the policy remains in force during these 30 days. If an insured event occurs
    during the grace period, the claim will be processed as per the policy terms.


    **What happens if I do not pay within the 30 days?**

    If the premium is not received by the end of the 30 days grace period, the policy
    will lapse. This means the coverage is terminated, and the sum assured of ₹10000000
    will no longer be available. To avoid this, we recommend setting up alerts for
    your premium dates. For more on payment, see Abhaya Term Life Cover — annual premium
    explained.'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: cac24053-4176-5938-a0bd-1204404ef165
  title: Abhaya Term Life Cover — resolve a common request end-to-end
  body: 'A common request for the Abhaya Term Life Cover is the update of a nominee
    to ensure the ₹10000000 sum assured is correctly allocated. Here is the end-to-end
    process:


    **Requirements before starting**

    - Your policy number.

    - Full name, date of birth, and relationship of the new nominee.

    - A valid KYC document (e.g., Aadhaar or PAN card) for the new nominee.


    **Steps to update your nominee**

    1. **Initiate Request**: Tell us that you wish to update the nominee for your
    Abhaya Term Life Cover. We will first perform a mandatory KYC verification and
    multi-factor authentication (MFA) to confirm your identity.

    2. **Provide Nominee Details**: Give us the new nominee''s full name, date of
    birth, and their relationship to you. We will record these details precisely to
    avoid future settlement disputes.

    3. **Submit KYC Documents**: Provide the KYC document for the new nominee. We
    will review this to ensure the identity is validated according to our zero-trust
    security stance.

    4. **Confirmation of Change**: Once the documents are verified, we will confirm
    that the nominee has been updated. You will receive a revised policy endorsement
    reflecting the change.


    **How you know it worked**

    You will receive a formal confirmation message and an updated policy document
    showing the new nominee''s name. You can also verify this by following the steps
    in Abhaya Term Life Cover — check status or history.'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
