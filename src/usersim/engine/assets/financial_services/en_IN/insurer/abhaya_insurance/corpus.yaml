- id: b1eba663-1b25-5a35-9f3c-df4b5e5d9b09
  title: Motor Own-Damage Cover — an unexpected charge or amount
  body: 'It can be concerning to see a charge on your statement that does not align
    with your expectations. If you notice an unexpected amount related to your Motor
    Own-Damage Cover, please follow these steps to resolve the issue.


    Symptom: ''I see a charge that is not the expected ₹7500 annual premium'' or ''My
    claim payout is lower than the total repair bill.''


    Likely Causes:

    - Compulsory Deductible: The most common cause for a lower claim payout is the
    deduction of the ₹1000 compulsory deductible, which is the policyholder''s responsibility.

    - Tax Adjustments: The amount paid may include GST or other regulatory taxes on
    top of the base annual premium of ₹7500.

    - Policy Amendments: If you recently added riders or amended the policy, the premium
    may have been adjusted.


    What to check in order:

    1. Check the Policy Schedule: Verify if the charge matches the annual premium
    of ₹7500 plus applicable taxes.

    2. Review Claim Settlement Note: If the issue is with a payout, check the settlement
    breakdown to see if the ₹1000 compulsory deductible was applied.

    3. Verify Transaction Date: Ensure the charge is not a renewal premium for the
    upcoming year.


    Resolution:

    If the charge is still unexplained, tell us the transaction date and amount. We
    will conduct a detailed review of your billing history. If we find an error, we
    will apply a correction to your account or issue a refund to your verified bank
    account within our standard operational timelines.


    Escalation:

    If the resolution is not satisfactory, we will raise a formal case with our billing
    specialist team. You will receive a case reference number and a resolution update
    within the timelines defined by the IRDAI.'
