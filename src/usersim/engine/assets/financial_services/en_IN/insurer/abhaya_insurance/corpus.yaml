  institution_id: abhaya_insurance
- id: 91e4c814-a115-566b-bf78-462f2bde7e17
  title: ULIP Wealth Plan — overview
  body: 'Welcome to the ULIP Wealth Plan, a hybrid financial vehicle from Abhaya Insurance
    designed for the Indian middle-class and emerging professionals. This plan is
    crafted to provide a balanced approach to your financial future, combining the
    security of a life cover with the growth potential of market-linked wealth creation.


    We understand that planning for the future requires both protection and growth.
    The ULIP Wealth Plan allows you to build a corpus over time while ensuring your
    family remains secure. To maintain this balance and ensure professional portfolio
    stewardship, the plan involves specific costs and structures.


    Key Financial Details:

    - Annual Premium: ₹50,000

    - Lock-in Period: 5 years (The mandatory window during which funds cannot be withdrawn)

    - Premium Allocation Charge: 3% (A fee deducted from the premium before it is
    invested in the funds)

    - Fund Management Charge: 1.35% (An annual fee for the professional management
    of your investment portfolio)


    Important Considerations:

    Our commitment to transparency means we want you to be aware that this is a market-linked
    product. While we provide suitability guidance, the returns are not guaranteed.
    We adhere strictly to IRDAI regulations, ensuring all exclusions and charges are
    disclosed upfront.


    ***

    Disclaimer: The ULIP Wealth Plan is a life insurance product with an investment
    component. It is not a guaranteed-return investment. Please consult a qualified
    tax or legal professional for specific advice regarding your financial situation.

    ***'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
  source_authority: official
