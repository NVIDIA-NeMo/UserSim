- id: 2c3ee3a7-55ba-5395-b740-88796a24028b
  title: ULIP Wealth Plan — choosing between tiers or options
  body: 'When deciding on your protection and investment strategy, you may be comparing
    the ULIP Wealth Plan against our pure protection offering, the Abhaya Term Life
    Cover.


    **Key Comparison Dimensions:**

    - **Objective:** The ULIP Wealth Plan is a hybrid vehicle designed for both life
    cover and market-linked wealth creation. The Abhaya Term Life Cover is focused
    on high-value pure protection.

    - **Cost Structure:** The ULIP Wealth Plan requires an annual premium of ₹50,000
    and includes a premium allocation charge of 3% and a fund management charge of
    1.35%. The Term Life Cover generally has lower premiums as it lacks an investment
    component.

    - **Liquidity:** The ULIP Wealth Plan has a mandatory lock-in period of 5 years.
    The Term Life Cover is a protection product and does not have a lock-in period
    as there is no accumulated fund to withdraw.

    - **Risk:** ULIP returns are market-linked and not guaranteed, whereas Term Life
    provides a guaranteed sum assured to nominees.


    **Which one should you choose?**

    - Choose the **ULIP Wealth Plan** if you are an emerging professional seeking
    a disciplined way to build wealth while maintaining family security.

    - Choose the **Abhaya Term Life Cover** if your primary goal is maximum family
    security at the most affordable cost without the need for an investment component.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: comparison
