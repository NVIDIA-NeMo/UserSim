- id: c35bc804-7445-5bd9-a3a6-4bb6e587b25e
  title: Abhaya Term Life Cover — policy term years explained
  body: 'Questions regarding the duration of your cover:


    **What is the policy term for the Abhaya Term Life Cover?**

    The standard policy term for this plan is 30 years. This means you are covered
    for the entire duration of these 30 years, provided your annual premiums are paid
    on time.


    **Can I extend the policy term after the 30 years have passed?**

    No, the Abhaya Term Life Cover is a fixed-term protection product. Once the 30
    years term expires, the cover ceases. If you require further protection at that
    stage, you would need to apply for a new policy subject to the underwriting and
    medical requirements of that time.


    **What happens if I pay my premiums for the full 30 years but do not pass away
    during the term?**

    As this is a ''pure protection'' plan, there is no maturity benefit. The annual
    premium of ₹12,000 is paid specifically to maintain the ₹1,000,000,00 sum assured
    for your family''s security during the term.'
