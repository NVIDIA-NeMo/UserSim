- id: ba7da299-7877-531e-b6dd-885cd8875f0a
  title: Abhaya Term Life Cover — vs. a similar product here
  body: 'When choosing between the Abhaya Term Life Cover and our ULIP Wealth Plan,
    the decision rests on whether you seek pure protection or a hybrid of insurance
    and investment.


    **Abhaya Term Life Cover**

    - **Primary Goal:** High-value pure protection.

    - **Cost:** Low annual premium of ₹12000.

    - **Benefit:** A guaranteed Sum Assured of ₹10000000 paid on death.

    - **Structure:** No maturity value; pure risk cover for a 30 year term.


    **ULIP Wealth Plan**

    - **Primary Goal:** Wealth creation with a life cover component.

    - **Cost:** Higher premiums as a portion is invested in market-linked funds.

    - **Benefit:** Life cover plus potential market-linked returns.

    - **Structure:** Includes a mandatory lock-in period and fund management charges.


    **Which one suits you?**

    Choose the Abhaya Term Life Cover if you want maximum financial security for your
    family at the lowest possible cost. Choose the ULIP Wealth Plan if you are looking
    for a vehicle that combines protection with long-term wealth accumulation.'
  domain: insurance
  product_category: term_life_cover
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ebf7dfcc-7b0a-5d0a-808a-85de220aac08
  title: Abhaya Term Life Cover — regulatory disclosures
  body: 'Abhaya Insurance operates in strict accordance with IRDAI regulations, ensuring
    the ''Protection of Policyholders'' Interests'' is our primary objective. This
    document provides the mandatory disclosures regarding the Abhaya Term Life Cover.


    **Coverage and Limits**

    The policy provides a Sum Assured of ₹10000000, payable only upon the occurrence
    of the insured event during the 30 year policy term. This is a pure protection
    product and does not accrue any cash value or investment returns.


    **Mandatory Disclosures**

    1. **Free-look Period:** Policyholders are entitled to a 15 days window from the
    receipt of the policy document to review the terms. Requests for cancellation
    within this period will be processed for a refund, minus proportionate risk premium
    and stamp duty.

    2. **Grace Period:** We allow a period of 30 days beyond the premium due date
    to make the payment. Failure to pay the annual premium of ₹12000 within this grace
    period will result in the policy lapsing.

    3. **Pre-existing Diseases (PED):** All medical conditions diagnosed prior to
    policy inception must be disclosed. Such conditions are subject to a mandatory
    waiting period before coverage applies. Non-disclosure may lead to the rejection
    of claims.

    4. **Exclusions:** Please refer to the detailed policy wordings for specific exclusions
    (e.g., suicide within a specific period from inception) which are mandated by
    regulatory guidelines.


    **Data and Privacy**

    We employ Multi-factor authentication (MFA) and strict KYC verification for all
    state-changing actions. We maintain a zero-trust stance regarding identity validation
    to prevent fraudulent claim settlements.


    ***

    **Disclaimer:** We provide suitability guidance but defer specific legal or tax
    advice to qualified professionals. No insurance product is represented as a guaranteed-return
    investment.'
  domain: insurance
  product_category: term_life_cover
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1c8c6743-abcc-5e41-a903-71b2d98114c4
  title: Abhaya Term Life Cover — interest rate / APY schedule
  body: 'The Abhaya Term Life Cover is a pure protection (term) insurance product.
    As such, it does not feature an annual percentage yield (APY), interest rate,
    or any form of accumulation of funds.


    **Pricing Structure**

    Instead of an interest rate, this product is governed by a fixed annual premium
    based on the risk profile at the time of underwriting:

    - **Annual Premium:** ₹12000


    This premium is a flat rate for the specified Sum Assured of ₹10000000 over the
    30 year policy term. The premium is designed to cover the cost of risk and administrative
    overhead. Because this is not an investment product, there are no credited interest
    rates or dividends associated with the policy.'
  domain: insurance
  product_category: term_life_cover
