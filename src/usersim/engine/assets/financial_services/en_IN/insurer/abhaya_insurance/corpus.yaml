- id: d4986702-7ae8-5571-8bff-85220e72219b
  title: Abhaya Term Life Cover — cancel, close, or downgrade
  body: 'Depending on your current policy stage, you may choose to cancel your policy
    during the review window or surrender it later. Please follow these steps:


    Scenario 1: Cancelling during the Free-look Period

    1. State your intent to cancel the policy within the first 15 days of receiving
    your documents.

    2. Provide the original policy document and a signed cancellation request.

    3. We will verify your identity via KYC and MFA.

    4. We will process the refund of your premium (minus proportionate risk cover
    and stamp duty) and confirm the closure of the policy.


    Scenario 2: Closing/Surrendering a Policy after the Free-look Period

    1. Request a formal surrender of your Abhaya Term Life Cover.

    2. Provide your policy number and a valid government-issued ID for KYC verification.

    3. We will perform a mandatory MFA check to ensure the request is authorised.

    4. We will confirm the closure of the policy. Please note that as this is a pure
    protection term plan with a sum assured of ₹10000000 and no savings component,
    there is typically no surrender value payable.


    Scenario 3: Downgrading the Sum Assured

    1. Request a reduction in your sum assured from the current ₹10000000 to a lower
    amount.

    2. We will calculate the revised annual premium based on the new risk level.

    3. We will send you a revised policy schedule for your approval via MFA.

    4. Once you confirm, we will apply the changes and notify you of the new annual
    premium amount.


    For a detailed view of the financial implications of these changes, refer to Abhaya
    Term Life Cover — fee schedule.'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 2350fbca-acaf-5c39-a6c6-f3cc45cb7be7
  title: Abhaya Term Life Cover — an unexpected charge or amount
  body: 'If you notice a charge on your account that does not match your expected
    annual premium of ₹12000, please follow these steps to identify the cause.


    Possible Symptoms:

    - A deduction higher than ₹12000 for your annual premium.

    - A charge appearing shortly after the grace period of 30 days has ended.

    - A deduction for a policy you believe was cancelled during the 15 days free-look
    period.


    What to check in order:

    1. Verify the Date: Check if the charge coincides with your annual premium due
    date. If you are within the 30 days grace period, this is likely your standard
    annual premium.

    2. Check for Tax: Ensure you are not confusing the base premium of ₹12000 with
    the total amount including applicable government taxes (GST).

    3. Review Modification History: Check if you recently requested a change to your
    sum assured (originally ₹10000000), which would have altered the premium.


    How to resolve:

    - Provide us with the transaction date and the exact amount deducted.

    - We will cross-reference this with your policy schedule and payment history.

    - If the charge was a duplicate or an error, we will initiate a reversal and provide
    a transaction reference number.


    When we escalate:

    If the discrepancy is due to a systemic billing error or an unauthorised third-party
    charge, we will raise a formal case with our billing specialist team. You will
    receive a case number and a resolution timeline (typically within 7-10 business
    days). For persistent billing issues, you may refer to the escalation path in
    Abhaya Term Life Cover — account agreement.'
  domain: insurance
  product_category: term_life_cover
