- id: b9a31201-c583-5171-a413-6fcb9e0b9130
  title: Motor Own-Damage Cover — vs. a typical competitor offering
  body: 'When comparing Abhaya Insurance''s Motor Own-Damage Cover against typical
    mid-market competitors, the primary differences lie in transparency and settlement
    predictability.


    Dimensions of Comparison:

    - Cost: Our pricing is risk-aligned with an annual premium of ₹7500. While some
    competitors may offer lower introductory rates, they often hide costs in higher
    deductibles.

    - Out-of-Pocket Expense: We maintain a clear compulsory deductible of ₹1000. Competitors
    may have variable deductibles that increase based on the type of accident, leading
    to unpredictability during a claim.

    - Rewards: We provide a straightforward 20% No-Claim Bonus in the first year,
    ensuring safe drivers are rewarded immediately.

    - Speed: We commit to a settlement window of 30 claim settlement days, whereas
    many competitors provide vague ''subject to survey'' timelines.


    Who should choose Abhaya:

    Customers who value certainty, fair underwriting, and a professional, empathetic
    service experience. If you prefer a transparent cost structure where you know
    exactly what the ₹1000 deductible means for your wallet, we are the right choice.


    Who should choose a competitor:

    Those looking for the absolute lowest possible premium regardless of higher deductibles
    or longer settlement timelines may find other budget-tier providers more appealing.'
