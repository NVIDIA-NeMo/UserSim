  title: Motor Own-Damage Cover — a failed or pending action
  body: 'If you experience an issue where your policy activation is pending or a payment
    has failed, please follow these steps to resolve the matter.


    Symptom: ''My policy is still showing as pending'' or ''Payment was deducted but
    the policy is not active''.


    Possible Causes:

    1. Pending KYC verification: Your documents may be under review.

    2. MFA failure: The Multi-Factor Authentication step was not completed successfully.

    3. Payment gateway lag: The transaction may be pending at the bank''s end.


    Resolution Steps:

    1. Verify if you have received a request for additional KYC documentation. If
    so, provide the requested files to us immediately.

    2. Ensure that you have completed the MFA prompt sent to your registered mobile
    number or email.

    3. If the premium of ₹7500 was deducted but the status is not updated, provide
    us with the transaction reference number. We will reconcile this with our accounts
    team.


    Escalation Path:

    If the issue remains unresolved after 3 business days, we will raise a formal
    case with our operations team. You will receive a case reference number and a
    status update via email. If you are unsatisfied with the resolution, you may escalate
    the matter to our Grievance Redressal Officer and, subsequently, to the Insurance
    Ombudsman.'
