- id: 3a8b92d6-d89c-565c-95ce-c8902c1316ca
  title: Motor Own-Damage Cover — make a change or update
  body: 'If you need to update your vehicle details, change your contact information,
    or amend your nominee for your Motor Own-Damage Cover, please follow these steps:


    1. **Provide the Request:** Tell us exactly what detail needs to be updated (e.g.,
    "I have changed my primary mobile number" or "I need to update the nominee for
    my policy").

    2. **Submit Supporting Documentation:** For state-changing actions, provide the
    necessary evidence. For a nominee change, provide the new nominee''s full name
    and relationship; for address changes, provide a valid government-issued proof
    of residence.

    3. **Complete Identity Verification:** To protect your account, we will initiate
    a mandatory KYC verification and Multi-factor authentication (MFA) process. You
    will receive a secure code which you must confirm back to us.

    4. **Review the Adjustment:** We will inform you if the change affects your risk
    profile. For instance, certain vehicle modifications may result in an adjustment
    to your annual premium of ₹7500.

    5. **Receive Confirmation:** Once verified and processed, we will provide you
    with an updated policy schedule via your registered email. You will know the process
    is complete when you receive this document and see the updated details in your
    policy records.


    Note: All updates are subject to our zero-trust identity validation policy to
    ensure your coverage remains secure.'
