- id: 1e3f5683-d0a7-5de9-86d7-b292a78c51bd
  title: Motor Own-Damage Cover — compulsory deductible explained
  body: 'Q: What is a compulsory deductible, and how does it affect my claim?


    A: A compulsory deductible is a fixed amount that you, the policyholder, agree
    to pay toward any claim before Abhaya Insurance covers the remaining costs. For
    the Motor Own-Damage Cover, the compulsory deductible is ₹1000. For example, if
    a repair costs ₹5,000, you pay ₹1000 and we cover the remaining ₹4,000.


    Q: Can I waive this deductible to get full coverage?


    A: No, the ₹1000 deductible is mandatory for this specific product to ensure risk-aligned
    pricing and maintain the affordability of the annual premium for all our customers.


    Q: Is this different from the annual premium?


    A: Yes. The annual premium of ₹7500 is the cost you pay to keep the policy active
    each year, whereas the deductible is only paid at the time a claim is made.'
