- id: d81b73cf-524d-5eee-bac2-a938db37dd2b
  title: ULIP Wealth Plan — annual premium explained
  body: 'Q: What is the required annual premium for the ULIP Wealth Plan?

    A: To maintain your policy and continue the wealth creation process, the annual
    premium is ₹50,000. This amount is due yearly as per your policy schedule.


    Q: How is my annual premium utilized?

    A: A portion of your ₹50,000 premium is used to provide your life cover and cover
    operational costs, while the remainder is invested in your chosen funds. Specifically,
    a premium allocation charge of 3% is applied before the funds are allocated to
    your investment portfolio.


    Q: What happens if I miss a premium payment?

    A: We encourage you to review your specific policy terms regarding grace periods.
    Consistent payments are essential to maximize the benefit of the 5 years lock-in
    period and the long-term growth potential of the plan. For a detailed breakdown
    of all costs, you may refer to the ULIP Wealth Plan — fee schedule.'
