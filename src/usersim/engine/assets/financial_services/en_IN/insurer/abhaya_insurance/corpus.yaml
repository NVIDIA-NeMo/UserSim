- id: 24046137-dae0-5e04-ae45-fccdec226465
  title: ULIP Wealth Plan — account security best practices
  body: 'Protecting your wealth and your family''s future is our highest priority.
    As a holder of the ULIP Wealth Plan, you manage a hybrid account that combines
    insurance protection with investment funds. This makes your account a potential
    target for sophisticated phishing and social engineering attempts.


    **Common Threat Patterns**

    Fraudsters may contact you pretending to be Abhaya Insurance representatives,
    claiming your fund performance has dropped or that you are eligible for an early
    withdrawal before your 5 years lock-in period expires. They may pressure you to
    share ''verification codes'' or transfer funds to a ''temporary safety account''
    to avoid charges.


    **Our Zero-Trust Security Standards**

    To ensure your assets remain secure, we adhere to a zero-trust stance regarding
    identity validation. Please be aware of the following:

    1. We will NEVER ask for your password, MFA (Multi-Factor Authentication) codes,
    or full KYC documents over a phone call or SMS.

    2. Any state-changing action—such as fund withdrawals, switching your investment
    portfolio, or amending your nominee—strictly requires Multi-factor authentication
    (MFA) and KYC verification.

    3. We will never ask you to transfer money to a personal bank account to ''unlock''
    your policy benefits.


    **Immediate Action Steps**

    If you receive a suspicious communication or notice an unauthorised attempt to
    change your policy details, notify us immediately. All fraudulent claims or activity
    are handled with a zero-tolerance policy, involving rigorous investigation and
    reporting to regulatory authorities. Prompt reporting is essential to protect
    your liability and ensure a speedy investigation.


    For further details on how we protect your information, please refer to ULIP Wealth
    Plan — privacy and data handling.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c3d6e735-21d0-5d9e-ac96-c123b731be5e
  title: ULIP Wealth Plan — change-of-terms policy
  body: 'This document outlines the conditions under which Abhaya Insurance may modify
    the terms of your ULIP Wealth Plan. By entering into this agreement, you acknowledge
    that the plan is designed for long-term wealth creation and family security.


    **1. Fee Adjustments**

    We strive to keep our pricing competitive and risk-aligned. However, to ensure
    professional portfolio stewardship and operational sustainability, we reserve
    the right to adjust the fund management charge (currently 1.35%) and the premium
    allocation charge (currently 3%). Any change to these percentages will be communicated
    to the policyholder with a minimum notice period of 30 days.


    **2. Premium Obligations**

    The policyholder is obligated to pay the annual premium of ₹50,000 to keep the
    cover active and continue the wealth-building process. Failure to pay premiums
    within the grace period may lead to the policy lapsing, subject to IRDAI regulations.


    **3. Lock-in and Withdrawals**

    As a fundamental term of this hybrid vehicle, a mandatory lock-in period of 5
    years applies. No partial withdrawals or full surrenders are permitted before
    the completion of these 5 years, except in cases mandated by regulatory authorities.


    **4. Termination and Refunds**

    Policyholders may exercise their right to review the terms during the Free-look
    Period. If the policy is returned within this window, a refund will be processed
    as per the standard guidelines. After this period, termination is governed by
    the surrender value calculations and the 5 years lock-in restriction.


    **5. Regulatory Alignment**

    We adhere strictly to IRDAI regulations. In the event of a conflict between these
    terms and a new IRDAI mandate regarding the ''Protection of Policyholders'' Interests'',
    the regulatory mandate shall prevail.'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: terms_conditions
  source_authority: official
