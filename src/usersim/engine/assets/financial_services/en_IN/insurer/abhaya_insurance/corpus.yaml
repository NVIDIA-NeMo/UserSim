- id: 491d43ee-5d8a-51c0-9e6d-757eb27e3609
  title: Abhaya Term Life Cover — how rates are tiered and applied
  body: 'The Abhaya Term Life Cover operates on a risk-aligned pricing model. For
    the standard profile associated with this plan, a flat annual premium of ₹12000
    is applied to provide a sum assured of ₹10000000 over a 30 years term.


    Application of Rates:

    - Fixed Rate: The premium of ₹12000 is fixed at the time of policy inception and
    does not increase with the age of the policyholder during the term.

    - Risk Alignment: This rate is calculated based on standard mortality tables,
    age, and health status at the time of underwriting.


    Factors that would change the rate:

    - Sum Assured Modification: If the policyholder requests to increase the sum assured
    above ₹10000000, the annual premium will be adjusted upward proportionally to
    reflect the increased risk.

    - Rider Additions: Adding optional riders (such as critical illness or accidental
    death benefits) will result in an additional charge over the base ₹12000 premium.

    - Underwriting Loadings: In cases where the applicant has certain health risks,
    a ''loading'' fee may be applied, increasing the annual premium above the standard
    rate.'
