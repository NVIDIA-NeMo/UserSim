- id: 883a41ba-6c5f-5a82-b902-ba2bd0a686c6
  title: Abhaya Term Life Cover — account security best practices
  body: 'At Abhaya Insurance, the security of your policy data and the integrity of
    your beneficiaries'' future is our highest priority. We maintain a zero-trust
    stance regarding identity validation to ensure that the sum assured of ₹1,000,000,00
    reaches the intended nominees without interference.


    To keep your account secure, please adhere to the following best practices:


    1. Mandatory Multi-Factor Authentication (MFA): We require MFA for all state-changing
    actions. This includes updating your nominee details, changing your contact information,
    or amending your policy term of 30 years. Never share your MFA codes with anyone,
    including individuals claiming to be Abhaya Insurance employees.


    2. KYC Integrity: Your Know Your Customer (KYC) verification is the bedrock of
    your policy security. If we detect any discrepancy in your identity documents,
    we may temporarily suspend policy amendments until re-verification is complete.


    3. Guard Your Policy Number: While your policy number is used for communication,
    avoid sharing it on public forums or social media, as it is a key identifier for
    your annual premium payments of ₹12,000.


    4. Verify Official Communication: We will never ask for your password or full
    bank account details via SMS or email. All official requests for documentation
    will follow a secure, verified channel.


    If you suspect any unauthorised access to your account or notice a change in your
    policy details that you did not initiate, notify us immediately. Rapid reporting
    is essential to mitigate risk and ensure the continued validity of your cover.


    For more information on how we handle fraudulent activity, please refer to Abhaya
    Term Life Cover — fraud and unauthorized-activity protection.'
