- id: 9981d63e-14ce-595e-bf83-0ac596967a56
  title: Motor Own-Damage Cover — cancel, close, or downgrade
  body: 'If you wish to cancel your policy, close your account with us, or downgrade
    your coverage level, please follow these steps. Note that we prioritize the ''Protection
    of Policyholders'' Interests'' and will ensure you are aware of the coverage gaps
    created by these actions.


    1. Request Initiation: State your intent to cancel, close, or downgrade your Motor
    Own-Damage Cover. If you are cancelling within the Free-look Period (typically
    15 days from policy receipt), please specify this to determine your refund eligibility.


    2. Identity Verification: To protect your account, we will perform a mandatory
    KYC verification and Multi-factor authentication (MFA). You will be asked to verify
    your identity via the secure method registered with us.


    3. Documentation Submission: For closures or downgrades, provide the current policy
    number and the reason for the change. If you are downgrading, tell us the specific
    coverage limits you are seeking.


    4. Review of Impact: We will provide a summary of what you will lose upon cancellation
    or downgrade, including the loss of any accrued No-Claim Bonus (which is 20% in
    the first year) and the cessation of protection against accidental damage.


    5. Confirmation of Action: Once you confirm you wish to proceed after the review,
    we will process the request. You will receive a formal confirmation notice via
    your registered email or SMS.


    6. Final Settlement: If a pro-rata refund is applicable (based on the annual premium
    of ₹7500 and the remaining policy term), we will credit the amount to your verified
    bank account. You will receive a notification once the transaction is complete.'
