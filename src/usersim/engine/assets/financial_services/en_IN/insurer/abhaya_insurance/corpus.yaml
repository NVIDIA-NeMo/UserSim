- id: a6d82e14-720a-5822-80aa-fcac9fbd525b
  title: Family Health Indemnity — check status or history
  body: 'Follow these steps to review your current policy status, coverage details,
    or your historical claim records for your Family Health Indemnity plan.


    **Prerequisites**

    Ensure you have your policy number and your registered mobile device available
    for identity verification.


    **Steps to Check Status and History**

    1. Provide us with your policy number and the specific information you wish to
    retrieve (e.g., ''I want to check my current sum insured'' or ''I need my claim
    history for the last year'').

    2. We will initiate a mandatory identity verification. You will receive a multi-factor
    authentication (MFA) prompt on your registered mobile number; please confirm the
    request to proceed.

    3. Once verified, we will provide a summary of your policy status, confirming
    that your current sum insured is ₹500,000 and your annual premium of ₹9,500 is
    up to date.

    4. To view history, ask us for a detailed statement of claims. We will then list
    all previous Claim Intimations, the date of the event, the amount claimed, and
    the final settlement amount.

    5. We will conclude the request by asking if you need a formal PDF statement of
    these records for your personal files.


    **Confirmation of Success**

    Your request is successful when we provide the specific numeric values of your
    coverage or a dated list of your claim history, and you have received the confirmation
    that your identity was verified via MFA.'
  domain: insurance
  product_category: health_indemnity
