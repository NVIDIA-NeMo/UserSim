- id: b91e81f1-876b-5610-a8e9-6577095f124e
  title: ULIP Wealth Plan — regulatory disclosures
  body: 'This document serves as the formal regulatory disclosure for the ULIP Wealth
    Plan. Abhaya Insurance operates in strict adherence to IRDAI guidelines to prioritize
    the ''Protection of Policyholders'' Interests''.


    Financial Disclosures:

    - The annual premium is fixed at ₹50,000. Any changes to this structure will be
    communicated as per the change-of-terms policy.

    - The plan carries a premium allocation charge of 3% and a fund management charge
    of 1.35%. These fees are essential for the operational sustainability of the plan
    and the professional stewardship of your portfolio.

    - A mandatory lock-in period of 5 years applies. No fund withdrawals are permitted
    prior to the completion of this period.


    Risk and Suitability:

    - Market Risk: As a market-linked product, the fund value may fluctuate based
    on market performance. We do not guarantee any specific rate of return.

    - Advice Boundary: We provide product education and suitability guidance. However,
    we defer all specific legal or tax advice to qualified professionals.


    Policyholder Rights:

    - Free-look Period: Every policyholder is entitled to a Free-look Period (usually
    15 days) to review the terms. If the product is found unsuitable, the policy can
    be returned for a refund.

    - Grievance Redressal: Disputes are handled with neutrality and speed. If a resolution
    is not reached via our support teams, the matter may be escalated to the Grievance
    Redressal Officer and subsequently to the Insurance Ombudsman.


    ***

    Disclaimer: This product is not a guaranteed-return investment. All investments
    are subject to market risks. Please read the official policy document carefully
    before investing.

    ***'
