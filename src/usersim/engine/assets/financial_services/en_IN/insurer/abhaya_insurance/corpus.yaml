- id: bba17b98-845b-544c-a40c-d0cf48d5fd0b
  title: ULIP Wealth Plan — qualification tiers
  body: 'The ULIP Wealth Plan is tailored for the Indian middle-class and emerging
    professionals. Eligibility is determined by the following criteria:


    | Requirement | Threshold / Condition | Outcome |

    | :--- | :--- | :--- |

    | Minimum Annual Premium | ₹50,000 | Eligible for Policy Issuance |

    | Premium Contribution | Below ₹50,000 | Ineligible (Does not meet minimum threshold)
    |

    | KYC Verification | Completed & Valid | Eligible for Fund Allocation |

    | KYC Verification | Pending/Incomplete | Policy Issuance Deferred |

    | Commitment Period | 5 years lock-in accepted | Eligible for Investment Component
    |

    | Commitment Period | Lock-in not accepted | Ineligible (Product structure is
    mandatory) |

    | Identity Validation | MFA Enabled | Eligible for state-changing actions |

    | Identity Validation | MFA Disabled | Restricted to read-only access |'
