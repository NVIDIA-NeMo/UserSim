- id: 05c3162b-241f-5861-9881-89690747348e
  title: Family Health Indemnity — overview
  body: "Welcome to Abhaya Insurance. We understand that protecting your family's\
    \ health is a priority, which is why we have designed the Family Health Indemnity\
    \ plan. This is a comprehensive medical coverage solution tailored for the Indian\
    \ middle-class and emerging professionals, ensuring that a medical emergency does\
    \ not derail your financial stability.\n\nOur plan provides a robust safety net\
    \ with a sum insured of ₹500,000, designed to cover hospitalization and associated\
    \ medical expenses. To maintain this high standard of protection, the annual premium\
    \ for this policy is ₹9,500. \n\nWe believe in complete transparency regarding\
    \ when your coverage begins. Please note that there is an initial waiting period\
    \ of 30 days from the policy inception date before most claims can be made. For\
    \ those with a Pre-existing Disease (PED), we apply a mandatory waiting period\
    \ of 36 months before coverage for those specific conditions applies.\n\nTo ensure\
    \ the sustainable management of our healthcare network and fair pricing for all,\
    \ we implement a room rent cap. This is a sub-limit set at 1% of the sum insured.\
    \ This means your eligible room rent is capped at 1% of your total cover, regardless\
    \ of the total hospital bill.\n\n***\n**Important Disclosures**\n* **Waiting Periods:**\
    \ 30 days for general ailments; 36 months for Pre-existing Diseases.\n* **Room\
    \ Rent:** Limited to 1% of the sum insured.\n* **Regulatory Compliance:** This\
    \ product adheres strictly to IRDAI regulations to protect policyholder interests."
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 14461641-5e6f-50bf-9a6b-36912891e9bc
  title: Family Health Indemnity — sum insured explained
  body: '**What exactly is the ''sum insured'' in my Family Health Indemnity policy?**

    The sum insured is the maximum amount Abhaya Insurance will pay for covered medical
    expenses in a policy year. For your current plan, the sum insured is ₹500,000.
    This acts as a cap on the total benefits you can claim during the year.


    **Does the sum insured cover my room rent fully?**

    No. While the sum insured covers the overall cost of treatment, room rent is subject
    to a specific sub-limit. As detailed in the Family Health Indemnity — overview,
    room rent is capped at 1% of the sum insured. For a sum insured of ₹500,000, this
    means the eligible room rent limit is ₹5,000 per day.


    **If I exceed the sum insured, will Abhaya Insurance pay the difference?**

    Once the total claims for the year reach the sum insured of ₹500,000, the policy
    is exhausted for that period, and further expenses must be borne by the policyholder
    unless a restoration benefit is applicable.'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 41501825-4dab-56b3-9270-baa163a49f1b
  title: Family Health Indemnity — set up and activate
  body: 'Activating your Family Health Indemnity plan is a straightforward process.
    We ensure that all security and regulatory checks are completed to protect your
    interests from day one.


    **Requirements before starting:**

    * Valid KYC documents (Aadhar, PAN, or Passport).

    * Accurate medical history declarations for all family members being covered.

    * A valid payment method for the annual premium.


    **Steps to activate your cover:**

    1. **Provide Policy Details:** Tell us the names and ages of the family members
    you wish to include under the cover. We will then capture the precise nominee
    details as required by IRDAI.

    2. **Submit Health Declarations:** Share the medical history of all applicants.
    Be precise about any Pre-existing Diseases (PED), as these are subject to a waiting
    period of 36 months.

    3. **Complete KYC Verification:** Provide your identity and address proofs. We
    use mandatory multi-factor authentication (MFA) to verify your identity before
    finalizing the policy.

    4. **Pay the Premium:** Settle the annual premium of ₹9,500. We will confirm receipt
    of payment immediately.

    5. **Receive Policy Document:** We will issue your policy schedule. Review the
    terms carefully; you have a Free-look Period (typically 15 days) to review the
    terms and return the policy for a refund if you are not satisfied.


    **How you know it is active:**

    You will receive a formal policy issuance email and a digital policy certificate.
    Please note that while the policy is ''active'', the initial waiting period of
    30 days applies before most claims can be filed.'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
