- id: ab093287-2d81-505d-af2d-849da0bee905
  title: Abhaya Term Life Cover — a failed or pending action
  body: '**Symptom:** You have attempted to pay your premium or submit a policy amendment,
    but the status remains ''Pending'' or you have received a ''Failed'' notification.


    **Likely Causes:**

    - **Authentication Failure:** Mandatory Multi-factor authentication (MFA) or KYC
    verification was not completed.

    - **Payment Gateway Timeout:** A technical disconnect between the bank and our
    systems during the ₹12000 premium transaction.

    - **Document Discrepancy:** Submitted KYC documents were blurred or expired, preventing
    the ''Active'' status update.


    **What to check in order:**

    1. **Verification Status:** Confirm that your latest KYC documents are up to date.
    We maintain a zero-trust stance regarding identity validation.

    2. **Bank Statement:** Check if the amount of ₹12000 has been debited. If debited
    but the policy shows ''Pending'', please provide us with the transaction reference
    number.

    3. **MFA Completion:** Ensure you have responded to the security prompt sent to
    your registered mobile number/email.


    **The Fix:**

    - For payment failures, we will initiate a reconciliation with the bank. If the
    payment failed at the source, we will guide you to re-attempt the transaction.

    - For pending amendments, provide the missing or corrected KYC document directly
    to us in the conversation.


    **When to escalate:**

    If the status is not resolved within 3 business days, we will raise a formal case
    with our internal operations team. You will receive a case reference number via
    email, and the matter will be tracked until the policy status is updated to ''Active''.'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
