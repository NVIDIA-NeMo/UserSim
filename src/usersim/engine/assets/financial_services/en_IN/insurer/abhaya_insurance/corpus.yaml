- id: ce6feebd-5a9e-5cc9-84c4-a52d47dac864
  title: Abhaya Term Life Cover — a discrepancy in your records or statement
  body: 'If you notice a discrepancy in your policy statement—such as an incorrect
    premium amount or an error in the sum assured—please follow this guide to resolve
    it.


    **Symptom**

    Your policy statement shows an annual premium other than ₹12000, or the sum assured
    is listed as something other than ₹10000000.


    **Likely Causes**

    1. **Data Entry Error**: A clerical error may have occurred during the policy
    issuance or an amendment process.

    2. **Unprocessed Payments**: A premium payment may have been made but not yet
    credited to your account, leading to an ''overdue'' status despite your payment.

    3. **Plan Misinterpretation**: Confusion between the sum assured (the payout)
    and the annual premium (the cost).


    **What to check and how to fix**

    1. **Verify Payment Proof**: Locate your bank statement showing the debit of ₹12000
    for the annual premium. Provide us with the transaction reference number.

    2. **Cross-Reference Original Schedule**: Check your original policy schedule.
    If the sum assured was agreed at ₹10000000 but the statement shows otherwise,
    provide us with the original signed application.

    3. **Request Rectification**: Ask us to align your statement with the verified
    transaction or original policy terms. We will conduct an internal audit of your
    account.


    **When we will escalate**

    If the discrepancy cannot be resolved through simple document verification, we
    will route the matter to our Grievance Redressal Officer. We treat all disputes
    with neutrality and speed, aiming for resolution within defined IRDAI timelines.
    You will be notified once the corrected statement is generated.'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a16bb744-5b9e-55b0-bd3b-a72a7afbb7f7
  title: Family Health Indemnity — fraud and unauthorized-activity protection
  body: "At Abhaya Insurance, we are committed to protecting your family's health\
    \ security. As you compare health plans, please be aware that the Family Health\
    \ Indemnity product is sometimes targeted by fraudulent actors using sophisticated\
    \ social engineering. \n\nCommon fraud patterns include 'premium refund scams,'\
    \ where bad actors contact you claiming an overpayment of your ₹9,500 annual premium\
    \ and ask for bank details to process a refund, or 'urgent claim' scams, where\
    \ they pretend to be hospital administrators requesting payment to 'release' a\
    \ patient under your policy.\n\nWe maintain a zero-trust stance regarding identity\
    \ validation for claim settlements. To ensure your security, we will never ask\
    \ you for your password, Multi-factor authentication (MFA) codes, or full credit\
    \ card details via phone or email. Any state-changing action, such as amending\
    \ your policy or requesting a fund payout, strictly requires mandatory KYC verification\
    \ and MFA.\n\nIf you notice any unauthorised activity or receive a suspicious\
    \ request, your first action should be to notify us immediately through our 24/7\
    \ digital portal or helpline. Prompt reporting is essential; any delays in reporting\
    \ suspected fraud may impact the timeline for dispute resolution. We treat all\
    \ fraudulent claims with a zero-tolerance policy, involving rigorous investigation\
    \ and reporting to the relevant regulatory authorities to protect the pool of\
    \ insured members.\n\nFor more information on our security standards, you may\
    \ refer to Family Health Indemnity — account security best practices."
  domain: insurance
  product_category: health_indemnity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 5f663891-2168-56bc-9680-54101fb3a463
  title: Family Health Indemnity — account agreement
  body: 'This agreement outlines the binding terms between Abhaya Insurance and the
    Policyholder for the Family Health Indemnity plan.


    1. Obligation of Payment: The Policyholder agrees to pay an annual premium of
    ₹9,500. Failure to pay the premium within the grace period may lead to the lapse
    of the policy and loss of accumulated benefits.


    2. Coverage Limits: We provide a sum insured of ₹500,000. All claims are subject
    to this cap. Specifically, room rent is subject to a sub-limit of 1% of the sum
    insured, meaning the maximum payable amount for room rent is ₹5,000 per admissible
    day.


    3. Waiting Periods: Coverage is not immediate. A mandatory initial waiting period
    of 30 days applies to all claims except those arising from accidents. Any Pre-existing
    Disease (PED) is subject to a mandatory waiting period of 36 months before coverage
    applies.


    4. Policy Amendments: Any changes to the policy, including nominee updates or
    address changes, require mandatory KYC verification and MFA. We reserve the right
    to adjust premiums based on risk-aligned pricing and administrative overhead.


    5. Termination and Refunds: The Policyholder may exercise the Free-look Period
    (usually 15 days) to review terms and return the policy for a refund. Either party
    may terminate the agreement with written notice, subject to the settlement of
    any outstanding claims.


    6. Dispute Resolution: All disputes are handled with neutrality and speed, aiming
    for resolution within defined IRDAI timelines. Escalations follow the tiered path
    from customer support to the Grievance Redressal Officer, and finally to the Insurance
    Ombudsman.'
  domain: insurance
  product_category: health_indemnity
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d691c53b-72b0-52b2-8177-48af22496f5a
  title: Family Health Indemnity — who it is best for and common use cases
  body: 'The Family Health Indemnity plan is a comprehensive medical coverage solution
    tailored for the Indian middle-class and emerging professionals who seek a balance
    between affordable premiums and reliable protection.


    Who This Is Best For:

    - Young families looking for their first comprehensive health shield.

    - Professionals who want to supplement corporate insurance with a personal family
    plan.

    - Individuals seeking transparent underwriting with clearly defined sub-limits.


    Common Use Cases:

    - Unexpected Hospitalisation: For acute illnesses or accidents, the plan provides
    a sum insured of ₹500,000 to cover medical expenses.

    - Planned Surgeries: For non-emergency procedures, the plan is ideal for those
    who can manage the initial waiting period of 30 days.

    - Long-term Health Management: For families with known health histories, the plan
    provides a clear path to coverage for Pre-existing Diseases (PED) after the mandatory
    36 months waiting period.


    Key Financial Specifications:

    - Annual Premium: ₹9,500

    - Sum Insured: ₹500,000

    - Room Rent Cap: 1% of the sum insured (₹5,000)

    - Initial Waiting Period: 30 days

    - Pre-existing Disease Waiting Period: 36 months


    This product competes on fairness and transparency, ensuring that you know exactly
    what is covered and what the limits are before you file a claim. For a detailed
    breakdown of what these terms mean, please see Family Health Indemnity — overview.'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
