- id: f8f715d2-5445-509f-b67b-3d3419c69e4b
  title: ULIP Wealth Plan — who it is best for and common use cases
  body: "The ULIP Wealth Plan is a hybrid financial vehicle designed for emerging\
    \ professionals and the Indian middle-class who seek a balanced approach to life\
    \ protection and long-term wealth creation. \n\nWho It Is Best For:\nThis plan\
    \ is ideal for individuals who have a moderate to high risk appetite and are looking\
    \ for market-linked growth rather than guaranteed returns. It suits those who\
    \ can commit to a long-term financial discipline, as evidenced by the mandatory\
    \ lock-in period of 5 years.\n\nCommon Use Cases:\n- Long-term Wealth Accumulation:\
    \ For professionals saving for a milestone (such as a child's higher education\
    \ or a home down-payment) while ensuring their family is protected by a life cover.\n\
    - Disciplined Saving: The structure encourages a consistent annual premium of\
    \ ₹50000, helping the policyholder build a substantial corpus over time.\n- Diversified\
    \ Portfolio: By leveraging our professional stewardship, users can access market-linked\
    \ growth with the added safety of an insurance shield.\n\nKey Financial Terms:\n\
    - Annual Premium: ₹50000\n- Lock-in Period: 5 years\n- Premium Allocation Charge:\
    \ 3%\n- Fund Management Charge: 1.35%\n\nWe provide suitability guidance to ensure\
    \ this product aligns with your goals, though we defer specific tax advice to\
    \ qualified professionals. For those seeking high-value pure protection without\
    \ the wealth component, you may wish to explore the Abhaya Term Life Cover — overview."
