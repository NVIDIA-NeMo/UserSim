- id: cebfb8b6-0265-5e40-ab12-4a73ae3de9c2
  title: Family Health Indemnity — vs. a typical competitor offering
  body: 'When comparing Family Health Indemnity to typical mid-market competitor offerings,
    the distinction lies in our commitment to transparency regarding limits and waiting
    periods.


    | Feature | Family Health Indemnity | Typical Competitor |

    | :--- | :--- | :--- |

    | Annual Premium | ₹9,500 | Often varies by age-band |

    | Sum Insured | ₹500,000 | Similar range (₹3L - ₹5L) |

    | Room Rent Limit | Fixed 1% of SI (₹5,000) | Often ''Standard Room'' (vague)
    |

    | PED Waiting Period | 36 months | Varies between 24-48 months |

    | Initial Waiting Period | 30 days | Usually 30 days |


    Family Health Indemnity is the better choice for customers who value certainty;
    by stating a 1% room rent cap (₹5,000), we remove the ambiguity of ''standard''
    or ''semi-private'' definitions that often lead to disputes with other insurers.


    A competitor offering might be better if they provide a shorter waiting period
    for specific pre-existing diseases (e.g., 24 months instead of our 36 months),
    but they may offset this with higher premiums or more restrictive sub-limits on
    other services.'
