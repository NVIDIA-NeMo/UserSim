    - **Annual Premium:** ₹7500

    - **Compulsory Deductible:** ₹1000 (This is the fixed amount the policyholder
    must pay toward any claim before the insurance coverage kicks in).


    **Step 3: Highlighting the No Claim Bonus (NCB)**

    Educate the customer on the reward for safe driving. For the first year of the
    policy, a No Claim Bonus of 20% is applicable, provided no claims are made during
