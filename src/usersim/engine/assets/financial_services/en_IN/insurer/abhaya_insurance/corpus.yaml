    2. We will perform a risk assessment of the vehicle and confirm the applicable
    annual premium of ₹7500.

    3. Confirm your acceptance of the policy terms, including the compulsory deductible
    of ₹1000 and the 30 days claim settlement window.

    4. Make the premium payment of ₹7500 through your preferred secure payment method.

    5. We will conduct a mandatory KYC verification and MFA (Multi-Factor Authentication)
    check to secure your account.

    6. We will issue your policy document electronically. You will receive a confirmation
    message and a digital copy of your certificate of insurance.


    Once the policy is issued, your Free-look Period begins. This is a specified window
    (typically 15 days) during which you can review the terms and return the policy
