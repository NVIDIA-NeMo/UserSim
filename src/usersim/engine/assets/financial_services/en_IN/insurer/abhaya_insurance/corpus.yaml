- id: 69f7a7ba-23d4-5254-83f1-3f63d3740659
  title: Motor Own-Damage Cover — fraud and unauthorized-activity protection
  body: 'At Abhaya Insurance, we are committed to protecting your assets through rigorous
    security protocols. When managing your Motor Own-Damage Cover, it is essential
    to remain vigilant against fraud and unauthorized activities that target vehicle
    insurance policyholders.


    Common fraud patterns include ''phishing'' attempts where bad actors pose as Abhaya
    Insurance employees to request your policy details or bank credentials under the
    guise of a premium refund or a claim update. Please be aware that we will never
    ask for your password, multi-factor authentication (MFA) codes, or full credit
    card details via email or SMS. Another common risk involves third-party ''claim
    agents'' who promise to accelerate your settlement in exchange for an upfront
    fee; these are unauthorised and often fraudulent.


    To ensure the integrity of your policy, we mandate KYC verification and MFA before
    any state-changing action, such as policy amendments or the processing of claim
    settlements. We maintain a zero-trust stance regarding identity validation to
    ensure your benefits are never diverted to an unauthorized party.


    If you notice any suspicious activity—such as an unexpected change in your nominee
    details or a notification for a claim you did not file—you must notify us immediately.
    Prompt reporting is critical, as it allows us to freeze the policy and prevent
    fraudulent payouts. Any claim found to be fraudulent will be handled with our
    zero-tolerance policy, involving a rigorous investigation and immediate reporting
    to the relevant regulatory authorities.


    For a detailed look at our overall commitment to policyholder safety, you may
    also refer to Motor Own-Damage Cover — regulatory disclosures.'
  domain: insurance
  product_category: motor_own_damage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d4a81124-06fa-524f-a17f-df958a2413ca
  title: Motor Own-Damage Cover — account agreement
  body: 'This agreement outlines the binding terms between Abhaya Insurance and the
    Policyholder regarding the Motor Own-Damage Cover. By maintaining this policy,
    both parties agree to the following obligations:


    1. Premium Obligations: The Policyholder agrees to pay an annual premium of ₹7500.
    Failure to pay the premium by the due date may result in a lapse of coverage,
    meaning any loss occurring after the grace period will not be indemnified.


    2. Deductible Application: In the event of a claim, a compulsory deductible of
    ₹1000 applies. This amount is the first portion of any loss that the Policyholder
    must bear personally before Abhaya Insurance provides coverage for the remaining
    balance of the loss.


    3. No-Claim Bonus (NCB): We reward safe driving through the No-Claim Bonus. For
    the first year of the policy, a bonus of 20% is applicable, subject to the policy
    remaining claim-free during the preceding period as per our underwriting guidelines.


    4. Claim Settlement: Abhaya Insurance commits to resolving claims within 30 claim
    settlement days from the date of final documentation submission, provided all
    verification requirements are met. This timeline aligns with our commitment to
    speed and neutrality in dispute handling.


    5. Policy Changes and Termination: Any amendments to the policy require mandatory
    KYC verification. The Policyholder may terminate this agreement by providing written
    notice. We reserve the right to terminate the cover if fraudulent activity is
    detected or if there is a material misrepresentation of the vehicle''s condition
    at the time of inception.


    6. Dispute Resolution: All disputes are handled neutrally and within IRDAI timelines.
    Escalations follow a tiered path: from customer support to the Grievance Redressal
    Officer, and finally to the Insurance Ombudsman.'
  domain: insurance
  product_category: motor_own_damage
  document_type: terms_conditions
  source_authority: official
