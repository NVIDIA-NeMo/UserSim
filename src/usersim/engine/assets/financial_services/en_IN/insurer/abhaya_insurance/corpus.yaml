- id: 3b11ed88-81bf-5c25-b361-99371b3e3d6e
  title: Abhaya Term Life Cover — fraud and unauthorized-activity protection
  body: 'At Abhaya Insurance, we are committed to protecting your family''s future.
    Because the Abhaya Term Life Cover provides a high sum assured of ₹10000000, it
    can unfortunately be a target for sophisticated fraud attempts. We wish to alert
    you to common patterns so you can safeguard your policy.


    Common Fraud Patterns:

    1. Impersonation Scams: Fraudsters may pose as Abhaya Insurance representatives
    claiming your policy is about to lapse or that a premium refund is due. They may
    pressure you to share your KYC details or MFA codes to ''verify'' your identity.

    2. Phishing for Nominee Details: Be wary of unsolicited requests for your nominee''s
    bank details or Aadhaar information outside of our official, secure channels.

    3. False ''Premium Waiver'' Offers: Be cautious of third-party agents promising
    to lower your annual premium of ₹12000 in exchange for an upfront ''processing
    fee'' paid to a private account.


    Our Security Commitment:

    We will never ask you for your password, MFA (Multi-Factor Authentication) codes,
    or full credit card details over a phone call or email. All state-changing actions,
    including policy amendments or beneficiary updates, strictly require mandatory
    MFA and KYC verification. We maintain a zero-trust stance regarding identity validation
    for all claim settlements to ensure funds reach the rightful heirs.


    Immediate Action Steps:

    If you notice any unauthorised activity, such as a change in your contact details
    or an unexpected request for information, notify us immediately. Rapid reporting
    is essential for us to freeze the policy and prevent fraudulent alterations. All
    fraudulent claims are handled with a zero-tolerance policy, involving rigorous
    investigation and mandatory reporting to the relevant regulatory authorities.


    For a detailed understanding of how we handle your information, you may refer
    to Abhaya Term Life Cover — privacy and data handling.'
  domain: insurance
  product_category: term_life_cover
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1f5ee00d-309a-582b-889e-b04d9a950a46
  title: Abhaya Term Life Cover — account agreement
  body: 'This agreement outlines the binding terms between Abhaya Insurance (''We'')
    and the policyholder regarding the Abhaya Term Life Cover.


    1. Coverage and Obligations:

    We agree to provide a sum assured of ₹10000000 to the designated nominee upon
    the occurrence of the insured event, provided the policy remains in force. The
    policyholder is obligated to pay an annual premium of ₹12000. Failure to pay the
    premium by the due date may lead to policy lapse, although a grace period of 30
    days is provided to ensure continuous coverage.


    2. Policy Duration and Term:

    The policy is issued for a fixed period of 30 years. Coverage ceases automatically
    at the end of this term unless extended through a mutually agreed renewal process.


    3. Right of Review (Free-look Period):

    The policyholder has a mandatory window of 15 days from the receipt of the policy
    documents to review the terms. If the product is found unsuitable, the policy
    may be returned for a refund, subject to applicable regulatory deductions.


    4. Amendments and Verifications:

    Any change to the policy, including the appointment of a new nominee or change
    in address, requires successful Multi-Factor Authentication (MFA) and updated
    KYC verification. We reserve the right to request fresh medical evidence if the
    sum assured is modified.


    5. Termination:

    This agreement ends upon the payment of the sum assured, the expiration of the
    30 years term, or the voluntary surrender of the policy by the holder. We may
    terminate the policy if it is discovered that material facts were suppressed during
    the underwriting process.


    6. Dispute Resolution:

    Any disputes arising from this agreement will be handled with neutrality and speed,
    aiming for resolution within defined IRDAI timelines. Escalations follow a tiered
    path from our support team to the Grievance Redressal Officer, and finally to
    the Insurance Ombudsman.'
  domain: insurance
  product_category: term_life_cover
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: abbe796e-0902-59ad-803d-335e60732b5a
  title: Abhaya Term Life Cover — who it is best for and common use cases
  body: 'The Abhaya Term Life Cover is a high-value pure protection plan designed
    for maximum family security at an affordable cost. Unlike hybrid plans, this product
    focuses solely on providing a substantial financial safety net without an investment
    component.


    Who This Product Is Best For:

    - Emerging Professionals: Individuals starting their careers who wish to secure
    a high life cover early in life to lock in lower premiums.

    - Primary Breadwinners: Those with significant financial dependents (spouses,
    children, or elderly parents) who need to ensure their family''s lifestyle is
    maintained.

    - Debt Holders: Individuals with long-term liabilities, such as home loans or
    education loans, where a high sum assured is required to clear the debt in the
    event of their demise.


    Common Use Cases:

    - Mortgage Protection: By securing a sum assured of ₹10000000, a policyholder
    can ensure that their home loan is fully settled, leaving the property debt-free
    for their heirs.

    - Child''s Future Education: Creating a guaranteed fund that can cover the future
    university costs of children, regardless of when the insured event occurs.

    - Income Replacement: Replacing the annual earning capacity of the breadwinner
    for a period of 30 years, providing the family with a structured financial cushion.


    Key Financial Parameters:

    - Sum Assured: ₹10000000

    - Annual Premium: ₹12000

    - Policy Term: 30 years

    - Free-look Period: 15 days

    - Grace Period: 30 days


    By choosing this pure protection model, you ensure that your family is not left
    with a financial void. For more details on the specific payout structure, please
    see Abhaya Term Life Cover — sum assured explained.'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0aa39c31-812f-5c49-8bc2-e02553456ad0
  title: Abhaya Term Life Cover — annual premium explained
  body: 'Q: What is the exact annual premium for my Abhaya Term Life Cover?


    A: The annual premium for this specific plan is ₹12000. This amount reflects the
    actual cost of risk based on your underwriting profile and the administrative
    overhead required to maintain the policy.


    Q: Does the annual premium of ₹12000 change over the 30 years term?


    A: No, for this product, the premium is locked in for the duration of the 30 years
    policy term, ensuring you have predictable costs for your family''s protection.


    Q: What happens if I miss the due date for my ₹12000 premium payment?


    A: We provide a grace period of 30 days from the due date. If the payment is received
    within this window, your coverage remains continuous. If the payment is not made
    after the 30 days, the policy may lapse. For more on this, see Abhaya Term Life
    Cover — grace period days explained.'
  domain: insurance
  product_category: term_life_cover
