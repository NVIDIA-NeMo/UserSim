- id: 40a62140-89ac-526a-9121-ce7166032e8a
  title: Motor Own-Damage Cover — regulatory disclosures
  body: 'Abhaya Insurance operates in strict accordance with the guidelines laid down
    by the Insurance Regulatory and Development Authority of India (IRDAI). This document
    serves as a mandatory disclosure for the Motor Own-Damage Cover.


    Policy Financials:

    - The annual premium is ₹7500, which is risk-aligned to ensure sustainability
    and fair pricing.

    - A compulsory deductible of ₹1000 applies to every claim. This amount is not
    reimbursable.

    - We commit to a claim settlement process that aims for resolution within 30 days
    from the date of final document submission.


    Policyholder Rights:

    - Free-look Period: You are entitled to a specified window (e.g., 15 days) to
    review the policy terms. If you find them unsuitable, you may return the policy
    for a refund.

    - Grievance Redressal: All disputes are treated with neutrality. If a resolution
    is not reached through customer support, you may approach the Grievance Redressal
    Officer and finally the Insurance Ombudsman.


    Compliance and Fraud:

    - We maintain a zero-tolerance policy toward fraudulent claims. Any attempt to
    misrepresent a loss will result in a rigorous investigation and reporting to the
    relevant regulatory authorities.

    - Security: To protect your data and prevent unauthorized amendments, Multi-factor
    authentication (MFA) and KYC verification are mandatory for all state-changing
    actions, including policy amendments and claims.


    Disclaimer: This insurance product is a protection tool and should not be misrepresented
    as a guaranteed-return investment. We provide product education but defer specific
    legal or tax advice to qualified professionals.'
  domain: insurance
  product_category: motor_own_damage
  document_type: disclosure
