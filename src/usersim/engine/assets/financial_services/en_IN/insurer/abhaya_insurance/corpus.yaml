- id: 8d2054b1-bf67-5c2c-a88d-fa32a17eb99f
  title: Abhaya Term Life Cover — access or login problems
  body: 'If you are having difficulty accessing your policy details or managing your
    annual premium of ₹12,000 via our digital channels, please follow this guide.


    **Symptom:** "I cannot log in to my account," or "I am not receiving my MFA code
    for policy amendments."


    **Likely Causes:**

    - Outdated contact information (mobile/email) in our records.

    - Network latency preventing the delivery of the MFA code.

    - Account lockout due to multiple incorrect password attempts.

    - Browser cache or compatibility issues with the digital portal.


    **What to check and do in order:**


    1. **Verify Contact Details:** Ensure you are checking the mobile number and email
    address originally registered with your policy. If these have changed, the MFA
    code will not reach you.

    2. **Network Refresh:** Wait 60 seconds and request a new MFA code. Ensure your
    device has a strong signal to receive the SMS.

    3. **Identity Re-validation:** If you are locked out, provide us with your policy
    number and complete a manual KYC verification check. We will verify your identity
    through a set of security questions.


    **The Fix:**

    Once your identity is verified, we will reset your access credentials or update
    your registered mobile number. You will then be able to log in and manage your
    cover, including checking the status of your ₹1,000,000,00 sum assured.


    **When to escalate:**

    If identity verification fails or if you suspect your account has been compromised,
    we will immediately freeze all state-changing actions on the policy. We will then
    raise a formal case with our security team and route you to the Grievance Redressal
    Officer for a resolution within IRDAI timelines.'
