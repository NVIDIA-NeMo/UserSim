- id: de0cfaf8-2704-5056-acca-0e77079fcd16
  title: ULIP Wealth Plan — getting started walkthrough
  body: 'This guide is designed for support agents to assist customers in the seamless
    onboarding and initial setup of the ULIP Wealth Plan. This product is a hybrid
    vehicle combining life cover with market-linked wealth creation.


    **Step 1: Application and KYC**

    Guide the customer through the mandatory KYC verification process. Ensure that
    the nominee capture is precise, as this is a critical requirement for life insurance
    protection. Explain that we maintain a zero-trust stance on identity validation
    for all future claim settlements.


    **Step 2: Premium Contribution**

    Confirm the payment of the annual premium of ₹50,000. Explain the premium allocation
    charge of 3%, which is deducted from the premium amount before the balance is
    invested in the chosen funds.


    **Step 3: Fund Selection**

    Assist the customer in selecting their investment funds. Clarify that a fund management
    charge of 1.35% is applied to ensure professional portfolio stewardship and the
    sustainability of the fund''s operations.


    **Step 4: Understanding the Lock-in**

    Clearly communicate that the ULIP Wealth Plan has a mandatory lock-in period of
    5 years. The customer must understand that funds cannot be withdrawn before this
    duration is complete.


    **Step 5: Policy Issuance and Free-look**

    Once the policy is issued, remind the customer of the Free-look Period (typically
    15 days). This is their window to review the terms and return the policy for a
    refund if the product does not meet their needs.


    **Agent Note:** Always remind the customer that while we provide suitability guidance,
    we are not providing specific tax or legal advice, and this product should not
    be misrepresented as a guaranteed-return investment.'
