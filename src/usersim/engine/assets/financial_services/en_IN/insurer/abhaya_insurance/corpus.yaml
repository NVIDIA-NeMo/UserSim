- id: bba701ba-393d-57bb-8a61-bf5468e62c10
  title: Abhaya Term Life Cover — a declined or blocked action
  body: 'You may occasionally find that an action—such as updating a nominee or requesting
    a policy change—is declined or blocked. Here is how to resolve this.


    **Symptom**

    You receive a notification that your request has been ''declined'' or ''blocked''
    due to verification failure or policy restrictions.


    **Likely Causes**

    1. **Identity Verification Failure**: Our zero-trust stance requires mandatory
    MFA and KYC verification before any state-changing action. If the details provided
    do not match our records, the action is blocked.

    2. **Policy Status Issues**: If your policy has lapsed because the annual premium
    of ₹12000 was not paid within the 30 days grace period, certain amendments may
    be blocked until the policy is reinstated.

    3. **Incorrect Documentation**: If you are attempting to change a beneficiary,
    any discrepancy in the nominee''s KYC documents can lead to a declined request.


    **What to check and how to fix**

    1. **Check Verification**: Ensure you are using the mobile number and email address
    registered with us. If you have changed your contact details, ask us to update
    your contact information first.

    2. **Verify Premium Status**: Confirm if your policy is currently active. If it
    has lapsed, ask us for the process to pay the overdue premium and reinstate your
    ₹10000000 cover.

    3. **Review Documentation**: Ensure that all uploaded KYC documents are clear
    and current.


    **When we will escalate**

    If the verification details are correct but the action remains blocked, we will
    raise a case with our internal compliance team. You will receive a reference number
    and a resolution update within the defined IRDAI timelines.'
