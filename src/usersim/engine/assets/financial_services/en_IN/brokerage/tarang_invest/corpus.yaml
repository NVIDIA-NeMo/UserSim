- id: 5ea98407-f416-5c69-b6f6-f37fdc400434
  title: Margin Trading Facility — when to switch or upgrade
  body: 'As a trader, deciding between using your own capital (Standard Delivery)
    and utilizing the Margin Trading Facility depends on your risk appetite and capital
    availability.


    Standard Delivery:

    - Cost: ₹0 delivery brokerage (as per our lean cost structure).

    - Capital: Requires 100% of the investment upfront.

    - Risk: Limited to the amount invested; no interest costs.

    - Best for: Long-term investors seeking steady growth without the pressure of
    interest payments.


    Margin Trading Facility:

    - Cost: Annual interest rate of 14.99% on borrowed funds and a pledge charge per
    scrip of ₹20.

    - Capital: Requires a minimum margin of 25%.

    - Risk: Higher; losses are amplified and interest must be paid regardless of stock
    performance. All investments are subject to market risks.

    - Best for: Active traders who want to amplify their buying power and have a high
    conviction in short-to-medium term price movements.


    Switch when your strategy shifts from passive wealth building to active trading,
    or when you have identified an opportunity where the projected gain exceeds the
    14.99% annual cost of borrowing.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 37a77324-7d96-5a21-87b9-375629e2ee61
  title: Margin Trading Facility — comparison vs. alternatives and when not to choose
    it
  body: 'The Margin Trading Facility (MTF) is a strategic leverage tool designed for
    active traders. However, it is not suitable for every investor. Understanding
    when to avoid this product is key to sustainable investing.


    Comparison with Alternatives:


    1. Standard Equity Delivery:

    In a standard delivery trade, you pay 100% of the stock value. While you don''t
    get the amplified buying power of MTF, you also avoid the annual interest rate
    of 14.99% and the pledge charge per scrip of ₹20. This is the safer, cost-effective
    choice for those not trading on leverage.


    2. Mutual Fund SIPs:

    If your goal is disciplined, long-term wealth building rather than active trading,
    a Mutual Fund SIP is superior. It removes the need for constant monitoring of
    margin levels and the risk of margin calls, focusing instead on flexible, long-term
    growth.


    When NOT to choose the Margin Trading Facility:

    - Low Risk Tolerance: If the idea of losing more than your initial investment
    or facing a margin call is stressful, avoid MTF. Because you only provide a minimum
    margin of 25%, price drops can quickly erode your equity.

    - Long-Term Passive Holding: If you intend to hold a stock for many years, the
    annual interest rate of 14.99% will likely outweigh the benefits of leverage,
    making it more expensive than simple delivery.

    - Limited Monitoring Capacity: MTF requires active tracking. If you cannot monitor
    your portfolio daily, you risk forced liquidation if your margin falls below 25%.


    Summary of Costs for MTF:

    - Interest: 14.99% annually.

    - Pledge Fee: ₹20 per scrip.

    - Minimum Requirement: 25% margin.


    Remember, we provide educational resources but strictly defer individualized financial
    planning advice. All investments are subject to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 09cdd08c-9ddf-5634-bf06-cc42f20c3bf1
  title: Margin Trading Facility — eligibility and setup
  body: 'Q: Who is eligible to use the Margin Trading Facility?

    A: Any customer with a verified Demat & Trading Account who completes the mandatory
    e-KYC and multi-factor authentication (MFA) process is eligible, provided they
    maintain the minimum margin of 25%.


    Q: How do I set up the facility for my account?

    A: Simply tell us you wish to activate the Margin Trading Facility. We will guide
    you through the identity verification and pledge agreement. Once verified, you
    can leverage your approved securities.


    Q: Do I need to provide any additional documents?

    A: As long as your e-KYC is up to date in your Demat & Trading Account, no further
    physical documentation is required. However, each scrip you leverage will incur
    a pledge charge per scrip of ₹20.


    For more details on account requirements, see Demat & Trading Account — eligibility
    requirements.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: faq
