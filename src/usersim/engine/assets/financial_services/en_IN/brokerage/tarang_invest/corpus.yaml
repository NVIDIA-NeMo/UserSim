- id: fdf7ceb8-002d-57fb-9020-f5eb4af996ee
  title: ELSS Tax-Saver Fund — who it is best for and common use cases
  body: 'The ELSS Tax-Saver Fund is a strategic investment designed for Indian taxpayers
    who wish to reduce their taxable income while growing their wealth through equity
    markets.


    Who it is best for:

    - Salaried Professionals: Ideal for those looking to maximize their tax deduction
    under Section 80C, which has a cap of ₹150000.

    - Long-term Wealth Builders: Since the product has a mandatory lock-in period
    of 3 years, it is best suited for investors with a medium-to-long-term horizon
    who are disciplined about not needing immediate liquidity.

    - First-time Investors: With a low minimum investment of ₹500, it is an accessible
    entry point for those new to equity-linked savings.


    Common Use Cases:

    - Tax Planning: An investor invests ₹150000 in the financial year to claim the
    full Section 80C benefit, effectively reducing their taxable income.

    - Forced Saving: An investor uses the 3 years lock-in period as a mechanism to
    prevent impulsive withdrawals, ensuring their capital stays invested in the market.

    - Diversification: Adding an ELSS fund to a portfolio that already includes a
    Mutual Fund SIP for more flexible goals.


    Key Product Specifications:

    - Minimum Investment: ₹500

    - Statutory Lock-in: 3 years

    - Section 80C Deduction Cap: ₹150000


    Disclaimer: Mutual fund investments are subject to market risks. Please read all
    scheme-related documents carefully. We provide educational resources but strictly
    defer individualized tax or financial planning advice.'
