- id: 5a7e17e1-a920-5cc3-ae07-89c6e4070562
  title: Margin Trading Facility — privacy and data handling
  body: 'At Tarang Invest, we adhere to strict data privacy norms and compliance frameworks
    steered by SEBI, AMFI, NSE, and BSE. This disclosure explains how we handle your
    data when you use the Margin Trading Facility.


    Data Collection and Usage:

    To provide leverage, we collect and process specific financial data, including
    your portfolio holdings, the market value of your pledged scrips, and your transaction
    history. This data is used exclusively to calculate your available buying power,
    monitor the minimum margin of 25%, and accrue the annual interest rate of 14.99%.


    Third-Party Sharing:

    Your data is shared with depositories and regulatory bodies only as required by
    law to process the pledge of your securities. Every time a scrip is pledged, a
    record is created with the depository, for which a pledge charge of ₹20 per scrip
    is levied.


    Security Measures:

    All state-changing actions—such as increasing your leverage or withdrawing pledged
    assets—require mandatory multi-factor authentication (MFA) and e-KYC. This ensures
    that your collateral cannot be manipulated by unauthorised parties.


    Your Rights:

    You may request a summary of the data we hold regarding your pledged assets. Any
    disputes regarding the calculation of your 25% margin or interest charges will
    be acknowledged within 24 hours and resolved within a standard 7-15 business day
    window.


    Compliance Statement: We prioritise investor protection and fair treatment. Please
    be aware that while we secure your data, the investments themselves are subject
    to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: disclosure
  source_authority: official
