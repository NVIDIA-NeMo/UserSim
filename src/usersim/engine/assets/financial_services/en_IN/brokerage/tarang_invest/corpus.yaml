- id: 9b05560a-e295-50c6-acaf-cd0758473754
  title: ELSS Tax-Saver Fund — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in onboarding
    for the ELSS Tax-Saver Fund. The ELSS Tax-Saver Fund is a strategic investment
    for tax deduction under Section 80C, combining long-term growth potential with
    immediate tax benefits.


    Key Product Specifications:

    - Minimum Investment: ₹500

    - Statutory Lock-in Period: 3 years

    - Tax Benefit: Deductions available under Section 80C up to a cap of ₹150000


    Walkthrough Steps for Customer Assistance:

    1. Account Verification: Ensure the customer has a valid Demat & Trading Account.
    If not, refer them to the process for opening one. e-KYC is mandatory before any
    investment can be placed.


    2. Investment Selection: Confirm the customer understands the 3-year lock-in period.
    This means capital cannot be withdrawn under any circumstances until 3 years have
    passed from the date of each investment.


    3. Funding the Investment: The customer must ensure their linked account has at
    least the minimum investment amount of ₹500.


    4. Execution: Once the customer confirms the amount (up to the ₹150000 tax cap),
    execute the purchase. Confirm the transaction ID and the expected date of unit
    allotment.


    5. Final Confirmation: Remind the customer that while they get a tax break, the
    investment is subject to market risks. Ensure they are aware that we provide educational
    resources but strictly defer individualized tax or financial planning advice.


    For detailed regulatory information, refer to ELSS Tax-Saver Fund — regulatory
    disclosures.'
