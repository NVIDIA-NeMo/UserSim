- id: baa288c7-ae0e-5e2f-a79e-61e191b8f3b7
  title: Demat & Trading Account — who it is best for and common use cases
  body: 'The Demat & Trading Account is the foundational gateway for equity investing
    at Tarang Invest. It is designed for retail investors and active traders who value
    a lean cost structure and institutional-grade tools.


    **Who is this best for?**

    - **Long-term Investors:** Because we offer equity delivery brokerage of ₹0, this
    account is ideal for those building a long-term portfolio who want to avoid the
    erosion of returns caused by high transaction costs.

    - **Intraday Traders:** For those who buy and sell within the same day, our fixed
    intraday brokerage of ₹20 per order provides cost-visibility, allowing traders
    to calculate their break-even points accurately.

    - **Cost-Conscious Users:** With a transparent annual maintenance charge of ₹300
    and a fixed DP Charge of ₹13.5 per sell transaction, there are no hidden fees.


    **Common Use Cases:**

    - **Wealth Accumulation:** Regularly buying blue-chip stocks and holding them
    for years with zero delivery costs.

    - **Active Speculation:** Using the account for high-frequency intraday trades
    while keeping costs predictable with a flat per-order fee.

    - **Portfolio Diversification:** Managing a mix of equity holdings across different
    sectors using our streamlined DP operations.


    *Disclaimer: Investments in the securities market are subject to market risks.
    Read all related documents carefully before investing.*'
  domain: brokerage_investing
  product_category: demat_trading_account
