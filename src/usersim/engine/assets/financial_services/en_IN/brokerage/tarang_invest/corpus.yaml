  institution_id: tarang_invest
- id: 43fad546-234f-53c6-9829-771ec3c4c08d
  title: Margin Trading Facility — who it is best for and common use cases
  body: 'The Margin Trading Facility (MTF) is a strategic leverage tool designed for
    active traders and experienced retail investors in India who wish to amplify their
    buying power using pledged securities.


    Who is it best for?

    This product is ideal for traders who have a high conviction in a particular stock''s
    short-to-medium term growth but lack the immediate liquid capital to take a full
    position. It is for those comfortable with the risks of leverage and the cost
    of borrowing.


    Common Use Cases:

    - Positioning for Expected Rallies: If you expect a stock to rise, you can use
    the facility to buy more shares than your available cash would allow, potentially
    increasing your returns.

    - Capital Efficiency: Instead of selling existing long-term holdings, you can
    pledge them to get the funding needed for new tactical trades.

    - Strategic Averaging: Traders use MTF to average their buy price in a volatile
    market without exhausting their entire cash reserve.


    Key Financials:

    - Minimum Margin: You must contribute 25% of the investment value.

    - Cost of Funding: An annual interest rate of 14.99% applies to the borrowed amount.

    - Setup Cost: A pledge charge of ₹20 per scrip is applicable for each security
    used as collateral.


    Disclaimer: Investments in the securities market are subject to market risks.
    Leverage can amplify both gains and losses.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 867ae8dd-484d-56e0-a1bc-cdfe662048ce
  title: Margin Trading Facility — minimum margin explained
  body: 'Q: What is the minimum margin for the Margin Trading Facility?

    A: To use this facility, you must maintain a minimum margin of 25%. This means
    that for every ₹100 worth of shares you wish to purchase, you must provide ₹25
    as your own capital (either in cash or through eligible pledged securities), and
    Tarang Invest provides the remaining ₹75.


    Q: What happens if my margin falls below 25%?

    A: If market fluctuations cause the value of your holdings to drop, your margin
    percentage may fall below the required 25%. In such cases, we will issue a margin
    call, asking you to add more funds or securities to bring the account back to
    the required level. If not rectified, we may liquidate part of your holdings to
    cover the gap.


    For more details on costs, please refer to Margin Trading Facility — fee schedule.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 21285e82-a529-5184-b236-2d1cf17b84bc
  title: Margin Trading Facility — cancel, close, or downgrade
  body: "If you no longer wish to use leverage or want to move back to a standard\
    \ delivery account, follow these steps to close or downgrade your Margin Trading\
    \ Facility:\n\nPrerequisites:\n- All outstanding loan amounts must be calculated.\n\
    - Ensure you have sufficient liquid funds in your trading account to cover the\
    \ principal and accrued interest.\n\nStep-by-Step Process:\n1. Request the Total\
    \ Payoff Amount: Ask us for the exact total amount required to clear your margin\
    \ loan, including the principal and the interest accrued at the annual interest\
    \ rate of 14.99%.\n2. Clear the Dues: Provide the necessary funds to settle the\
    \ total payoff amount. We will confirm once the outstanding balance is zero.\n\
    3. Request Pledge Release: Once the loan is cleared, ask us to release the pledged\
    \ securities. We will process the unpledging of your scrips from the depository.\n\
    4. Confirm Facility Closure: Ask us to formally deactivate the Margin Trading\
    \ Facility on your account. \n\nHow you know it worked:\n- You will receive a\
    \ confirmation notification that your margin loan balance is ₹0.\n- Your pledged\
    \ securities will reappear as 'free' holdings in your demat account (as seen in\
    \ Demat & Trading Account — overview).\n- You will no longer see the option to\
    \ place 'Margin' orders when buying equities."
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: how_to_guide
  source_authority: official
