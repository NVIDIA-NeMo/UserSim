- id: 108893a7-fb51-5852-ac54-1ad937ea1a1d
  title: ELSS Tax-Saver Fund — limits, restrictions, and edge cases
  body: 'This document provides essential guidance for support agents handling technical
    queries and edge cases for the ELSS Tax-Saver Fund.


    Investment Limits & Thresholds:

    - Minimum Investment: The entry barrier for this product is a minimum investment
    of ₹500. Any request to invest an amount lower than this must be declined.

    - Tax Benefit Cap: While customers can invest more, the tax deduction under Section
    80C is capped at ₹150000. Agents should remind customers that investments beyond
    this amount do not provide additional tax benefits under this specific section.


    Strict Restrictions:

    - Lock-in Period: Every single investment made in the ELSS Tax-Saver Fund is subject
    to a mandatory lock-in period of 3 years. This is a statutory requirement.

    - Redemption Block: Redemption requests made before the completion of the 3 year
    lock-in period for a specific unit must be automatically blocked by the system.
    There are no exceptions for personal emergencies, as this is a regulatory mandate.


    Edge Cases:

    - Partial Redemptions: For customers who have made multiple investments over time
    (e.g., via SIP), the lock-in period of 3 years applies to each individual instalment
    from its respective date of investment. Only units that have completed their 3
    year tenure are available for redemption.

    - Tax Filing: We provide the necessary statements for tax filing, but we do not
    provide individualized tax advice. Customers should be directed to a qualified
    tax consultant for filing their returns.


    Compliance Note: All communications must emphasize that investments are subject
    to market risks. Agents must verify identity via MFA before processing any portfolio
    changes.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: product_sheet
  source_authority: official
