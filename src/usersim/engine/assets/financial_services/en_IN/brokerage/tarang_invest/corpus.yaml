- id: 13a8316d-2c96-5bd5-a697-3fc89ea5ff75
  title: Mutual Fund SIP — an unexpected charge or amount
  body: 'Symptom: A customer notices a deduction that is higher than the SIP amount
    or a charge appearing during the redemption of units.


    Likely Causes:

    1. Exit Load Application: The most common cause for a lower-than-expected redemption
    amount is the exit load of 1% applied to units redeemed within 365 days.

    2. Bank Charges: The linked bank may have charged a penalty for a failed SIP installment
    due to insufficient funds.

    3. Amount Mismatch: A recent request to upgrade the SIP amount may have been processed.


    What to check in order:

    1. Check the redemption date: Were the units sold within 365 days of purchase?
    If yes, the 1% exit load is correct.

    2. Verify the SIP amount: Check the latest modification request to see if the
    monthly commitment was increased above the ₹500 minimum.

    3. Review bank statements: Check if the ''unexpected charge'' is a bank-level
    penalty rather than a Tarang Invest fee.


    Resolution:

    - If the charge is a valid 1% exit load or a requested SIP amount change, no further
    action is needed.

    - If the charge is an error, tell us the transaction date and the exact amount
    in question.


    Escalation:

    If the discrepancy remains unresolved, we will raise a formal dispute case. We
    acknowledge these queries within 24 hours and aim for a full resolution within
    our standard 7-15 business day window.'
