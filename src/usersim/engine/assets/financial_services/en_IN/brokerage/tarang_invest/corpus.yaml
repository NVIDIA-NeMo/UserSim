- id: a98b1557-f794-5454-b5ff-f6b8479f38c9
  title: Margin Trading Facility — vs. a similar product here
  body: 'When deciding how to fund your trades, you may compare the Margin Trading
    Facility with the Demat & Trading Account (Standard Delivery).


    - Cost: Standard delivery has ₹0 delivery brokerage. The Margin Trading Facility
    involves an annual interest rate of 14.99% and a pledge charge per scrip of ₹20.

    - Capital Requirement: Standard delivery requires 100% of the trade value upfront.
    The Margin Trading Facility only requires a minimum margin of 25%.

    - Risk: Standard delivery carries only market risk. The Margin Trading Facility
    adds leverage risk, where losses can exceed your initial margin.


    Standard delivery is best for long-term investors seeking to build wealth without
    the burden of interest costs. The Margin Trading Facility is best for active traders
    who wish to amplify their buying power and have a high-conviction, short-to-medium
    term strategy.'
