    \ any pending MFA/OTP requests from the depository.\n3. Verify if the scrip is\
    \ currently listed as 'Margin Eligible' in our approved list.\n\nHow to fix:\n\
    - If the margin is low, you can add more funds to your account or pledge additional\
    \ eligible securities. \n- If the authorization is pending, re-trigger the MFA\
    \ request through us.\n\nWhen to escalate:\nIf you have completed the authorization\
    \ and maintain the minimum margin of 25%, but the action still fails, tell us.\
