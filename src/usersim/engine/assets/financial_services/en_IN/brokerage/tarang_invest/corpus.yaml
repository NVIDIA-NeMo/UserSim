- id: 0be814f6-c489-536a-8cbb-7129ae50a9c9
  title: Demat & Trading Account — check status or history
  body: 'Maintaining visibility over your investments is key to disciplined trading.
    Follow these steps to review your account status and transaction history.


    **Prerequisites**

    - An active Demat & Trading Account.

    - Successful completion of Multi-factor authentication (MFA) for secure access.


    **Steps to Check Status and History**

    1. Tell us that you would like to view your current portfolio status or your transaction
    history for a specific period.

    2. We will verify your identity via our mandatory MFA protocol to ensure account
    security.

    3. Once verified, we will provide a detailed summary of your current holdings,
    including the number of shares and the current market value of your equities.

    4. If you requested history, we will generate a report showing all buy and sell
    transactions, including the equity delivery brokerage of ₹0 and any intraday brokerage
    of ₹20 per order applied to your trades.

    5. For sell transactions, the report will explicitly show the DP Charges of ₹13.5
    levied per transaction.


    **How you know it worked**

    You will receive a comprehensive digital statement or a summary in the chat reflecting
    your exact holdings and a chronological list of all charges and trades. If you
    require a formal PDF, you can request a consolidated account statement.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 472cced0-8988-5079-b03a-be00f17eec44
  title: Demat & Trading Account — a declined or blocked action
  body: "If you find that a trade, fund withdrawal, or portfolio change has been declined\
    \ or blocked, it is usually due to a security or compliance safeguard.\n\n**Likely\
    \ Causes**\n- **MFA Failure:** State-changing actions require mandatory Multi-factor\
    \ authentication (MFA). If the code was not entered or expired, the action will\
    \ be blocked.\n- **KYC Non-Compliance:** If your e-KYC documents have expired\
    \ or were flagged by SEBI, NSE, or BSE, your account may be restricted to 'sell-only'\
    \ or blocked entirely.\n- **Insufficient Funds:** A trade may be declined if the\
    \ account lacks the necessary margin, including the required intraday brokerage\
    \ of ₹20 per order.\n- **DP Block:** Sell orders may fail if there is a discrepancy\
    \ in the demat holdings or a lock-in restriction.\n\n**What to check in order**\n\
    1. **Authentication:** Confirm if you successfully completed the MFA prompt. If\
    \ not, try the action again.\n2. **KYC Status:** Ask us to check if your e-KYC\
    \ is current. If it is outdated, we will guide you through the re-verification\
    \ process.\n3. **Balance:** Ensure you have sufficient funds to cover both the\
    \ trade value and the associated charges, such as the ₹13.5 DP Charges for sells.\n\
    \n**The Fix**\nOnce the missing document is provided or the MFA is completed,\
    \ we will lift the block immediately. \n\n**When to Escalate**\nIf the block persists\
    \ despite valid KYC and funds, we will raise a case with our Compliance Officer.\
    \ You will receive an acknowledgement within 24 hours, and the issue will be resolved\
    \ within the standard 7-15 business day window."
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 04f314d3-99b7-53c7-b455-68885a4b4d8e
  title: Demat & Trading Account — when to switch or upgrade
  body: "As a support agent, use these guidelines to help customers decide if they\
    \ should maintain their current Demat & Trading Account or move to a specialized\
    \ tool.\n\n**Continue with Demat & Trading Account if:**\nThe customer is a retail\
    \ investor focused on long-term wealth (benefiting from ₹0 equity delivery brokerage)\
    \ or a casual trader comfortable with a flat intraday brokerage of ₹20 per order.\n\
    \n**Upgrade to Margin Trading Facility (MTF) if:**\nThe customer is an active\
    \ trader who needs to amplify their buying power. While the standard account is\
    \ a gateway, MTF allows them to use pledged securities as leverage. \n\n**Switch\
    \ to Mutual Fund SIP if:**\nThe customer prefers disciplined, automated investing\
    \ over active stock picking. SIPs offer lower entry barriers and a structured\
    \ approach to growth compared to the manual nature of a trading account.\n\n**Summary\
    \ for Agent**\n- Long-term/Retail $\rightarrow$ Demat & Trading Account\n- Leverage/Active\
    \ $\rightarrow$ Margin Trading Facility\n- Disciplined/Passive $\rightarrow$ Mutual\
    \ Fund SIP"
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: comparison
  source_authority: official
  placeholder: true
