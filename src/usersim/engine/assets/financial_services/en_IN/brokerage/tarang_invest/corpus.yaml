- id: ad96182a-0b9c-5ec8-b96f-a58ca4b61392
  title: Margin Trading Facility — how rates are tiered and applied
  body: 'Tarang Invest follows a ''cost-visibility'' philosophy. For the Margin Trading
    Facility, we do not use complex tiers or hidden scales. The following flat rates
    apply to all eligible customers regardless of the loan amount:


    - Annual Interest Rate: 14.99%

    - Pledge Charge: ₹20 per scrip


    Application of Rates:

    - The annual interest rate of 14.99% is applied to the actual amount borrowed
    from us. It is calculated on a daily basis and charged to your account. This rate
    is subject to change only in accordance with SEBI or exchange regulatory updates,
    in which case we will provide due notice.

    - The pledge charge of ₹20 per scrip is a fixed operational fee levied at the
    time the security is pledged to the depository to secure your margin.


    These rates are designed to ensure operational sustainability while remaining
    lean for the active trader.'
