- id: ffa0f930-b8db-522a-8032-7c41d1e9c500
  title: ELSS Tax-Saver Fund — comparison vs. alternatives and when not to choose
    it
  body: 'The ELSS Tax-Saver Fund is a strategic investment designed for those who
    want to combine equity growth with tax efficiency. However, it is not the right
    tool for every investor.


    Comparison vs. Alternatives:

    1. vs. Standard Mutual Funds: While both offer market-linked returns, the ELSS
    Tax-Saver Fund comes with a mandatory lock-in period of 3 years, whereas standard
    funds offer higher liquidity. The trade-off for this lock-in is the ability to
    claim a deduction under Section 80C.

    2. vs. Fixed Income Tax Savers (e.g., PPF/NSC): Unlike fixed-income options, ELSS
    is equity-oriented, meaning it has higher growth potential but also carries higher
    volatility. All investments are subject to market risks.


    When NOT to choose the ELSS Tax-Saver Fund:

    - Short-term Goals: If you anticipate needing your capital within the next 3 years,
    do not choose this product. The lock-in period of 3 years is absolute and cannot
    be waived.

    - Risk Aversion: If you cannot tolerate market fluctuations, an equity-based tax
    saver may not be suitable. We provide educational resources but strictly defer
    individualized financial planning advice.

    - Tax Limit Reached: If you have already invested ₹150000 in other Section 80C
    instruments (like LIC or PPF), you will not receive additional tax benefits from
    this fund.


    Key Specifications:

    - Minimum Investment: ₹500

    - Lock-in Period: 3 years

    - Tax Deduction Cap: ₹150000 under Section 80C


    In summary, choose this product if you are a long-term investor looking to reduce
    your taxable income. Avoid it if you require immediate liquidity or cannot accept
    market risks.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: ea6ca827-d797-5fcb-8ffb-9aa438245c2b
  title: ELSS Tax-Saver Fund — eligibility and setup
  body: 'Q: Who is eligible to invest in the ELSS Tax-Saver Fund?

    A: Any individual with a valid PAN and a Tarang Invest account is eligible. To
    ensure a seamless setup, you must have completed the mandatory e-KYC and MFA (Multi-factor
    authentication) processes.


    Q: What is the minimum amount I need to start?

    A: You can start your investment with a minimum investment of ₹500.


    Q: Can I set up a regular investment instead of a one-time payment?

    A: Yes, you can invest via a Systematic Investment Plan (SIP). Please note that
    each SIP instalment will have its own mandatory lock-in period of 3 years from
    the date of that specific investment.


    Q: How do I ensure I get the tax benefit?

    A: Ensure your total investment across all 80C instruments does not exceed the
    ₹150000 deduction cap to maximize efficiency. We provide statements to help you
    track this, but we defer to your tax advisor for final filings.'
