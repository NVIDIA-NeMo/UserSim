- id: dbb3b3ac-d1a3-5274-a278-53d35c683405
  title: Mutual Fund SIP — a declined or blocked action
  body: 'If you find that you cannot start a new SIP, modify an existing one, or pause
    your investment, follow these steps to resolve the issue.


    Symptom: ''Transaction Declined'' or ''Action Blocked'' message when managing
    your Mutual Fund SIP.


    Likely Causes:

    1. Below Minimum Threshold: You are attempting to set a SIP amount lower than
    ₹500.

    2. Maximum Pause Exceeded: You are trying to pause a SIP that has already been
    paused for 6 months.

    3. Verification Pending: Your e-KYC is incomplete or your identity verification
    has expired.

    4. Insufficient Funds: Your linked bank account does not have enough balance for
    the current installment.


    What to check in order:

    1. Amount Check: Ensure the investment amount is ₹500 or more.

    2. Pause History: Check if you have already utilised the maximum pause duration
    of 6 months for this specific SIP.

    3. KYC Status: Check if there are any pending alerts regarding your identity verification.


    How to fix it:

    - If the amount was too low, simply request the change again with an amount of
    at least ₹500.

    - If the pause limit was reached, you must either resume the SIP or cancel it
    and start a new one.

    - If KYC is pending, provide the requested documents to us to complete the e-KYC
    process.


    When we escalate:

    If the cause is a technical glitch or a bank mandate failure that we cannot resolve
    immediately, we will raise a case with our internal operations team. Most such
    queries are acknowledged within 24 hours and resolved within a standard 7-15 business
    day window.


    ***Disclaimer: Mutual fund investments are subject to market risks; read all scheme
    related documents carefully.***'
