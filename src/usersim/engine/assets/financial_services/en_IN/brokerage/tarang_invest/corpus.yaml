- id: 13fbd1a2-c613-5c7c-ac94-de3dce4ef475
  title: ELSS Tax-Saver Fund — fraud and unauthorized-activity protection
  body: "At Tarang Invest, we prioritise the safety of your long-term tax savings.\
    \ Because the ELSS Tax-Saver Fund involves a statutory lock-in period of 3 years,\
    \ fraud attempts often target the 'unlocking' or 'premature withdrawal' process\
    \ through social engineering.\n\nCommon Fraud Patterns:\n1. The 'Urgent Tax Refund'\
    \ Scam: Fraudsters may contact you claiming that your Section 80C deduction of\
    \ ₹150000 is under review by tax authorities and that you must move your funds\
    \ to a 'safe account' to avoid penalties.\n2. The 'Lock-in Bypass' Offer: Scammers\
    \ may claim they have a back-door method to bypass the 3 years lock-in period\
    \ for a fee. This is impossible; the lock-in is a statutory requirement.\n\nWhat\
    \ we will NEVER ask for:\nWe will never ask you for your MFA (Multi-Factor Authentication)\
    \ codes, your e-KYC passwords, or your bank account PIN via phone, email, or chat.\
    \ We will never ask you to transfer funds to a personal account to 'verify' your\
    \ ELSS investment.\n\nImmediate Action Steps:\nIf you notice an unauthorised investment\
    \ or receive a suspicious request:\n1. Notify us immediately via our digital chat\
    \ or email. \n2. Report the incident within 24 hours to ensure the fastest possible\
    \ intervention.\n\nOur Response:\nWe maintain a zero-tolerance policy towards\
    \ fraud. Once reported, we acknowledge the dispute within 24 hours and work to\
    \ resolve the matter within a standard 7-15 business day window. Please remember\
    \ that all identity verification is strictly enforced to prevent unauthorised\
    \ account access."
