  institution_id: tarang_invest
- id: a370b077-2e23-5233-a233-f1fa20146482
  title: Demat & Trading Account — make a change or update
  body: 'To maintain the security of your assets and comply with SEBI regulations,
    any changes to your Demat & Trading Account details must follow a strict verification
    process.


    Before you begin: Ensure you have your registered mobile device available for
    MFA and a digital copy of your updated supporting document (e.g., a new address
    proof or a new bank passbook).


    Steps to update your account:

    1. Tell us which specific detail you wish to change (e.g., "I want to update my
    registered email address" or "I need to change my primary bank account").

    2. Provide the new information along with the supporting digital document for
    verification.

    3. Complete the mandatory multi-factor authentication (MFA) prompt. Because this
    is a state-changing action, we cannot proceed without this identity verification.

    4. We will review the submitted documents and the MFA confirmation. We will then
    confirm via email once the update has been processed.


    How you know it worked:

    You will receive a confirmation notification stating that your account details
    have been successfully updated. You can then verify the changes by requesting
    your latest account profile summary.


    For requests regarding the closure of your account, please refer to the Demat
    & Trading Account — cancel, close, or downgrade guide.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
