- id: 2c4e497a-75ad-5cc2-b5b8-be96a745d21d
  title: ELSS Tax-Saver Fund — account security best practices
  body: 'At Tarang Invest, the security of your long-term tax-saving investments is
    our priority. Because the ELSS Tax-Saver Fund involves a 3-year lock-in period,
    unauthorised access to your account can disrupt your tax planning and financial
    goals. We urge all customers to follow these essential security practices:


    1. Mandatory Multi-Factor Authentication (MFA): We require MFA for all state-changing
    actions. Never share your One-Time Password (OTP) or MFA codes with anyone, including
    individuals claiming to be Tarang Invest employees. We will never ask for your
    password or OTP over a phone call or email.


    2. Verify Identity Requests: Before any fund withdrawals (after the 3-year lock-in
    expires) or portfolio changes, e-KYC and identity verification are strictly enforced.
    Be wary of any communication asking you to ''re-verify'' your KYC via a third-party
    link.


    3. Monitor Your Portfolio: Regularly review your holdings. If you notice any unauthorised
    attempt to change your linked bank account or contact details, notify us immediately.


    4. Reporting Fraud: We maintain a zero-tolerance policy towards fraud. If you
    suspect unauthorised access, inform us immediately. Most security queries are
    acknowledged within 24 hours and resolved within a standard 7-15 business day
    window.


    Remember, since the ELSS Tax-Saver Fund is designed for Section 80C benefits,
    any unauthorised change to your account details could impact your tax filing accuracy.


    Disclaimer: Mutual fund investments are subject to market risks.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: security_advisory
