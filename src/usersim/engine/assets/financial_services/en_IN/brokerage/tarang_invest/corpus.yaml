- id: 1d257503-8ced-57d2-ae88-20c46eea0233
  title: Demat & Trading Account — fraud and unauthorized-activity protection
  body: "At Tarang Invest, we prioritise the safety of your assets. For our Demat\
    \ & Trading Account users, fraud typically manifests as 'phishing' or 'impersonation,'\
    \ where bad actors pretend to be brokerage employees to gain access to your portfolio.\
    \ \n\nWe want to be very clear: we will never ask you for your password, your\
    \ Multi-factor authentication (MFA) codes, or your e-KYC credentials via a phone\
    \ call, SMS, or email. No employee of Tarang Invest will ever request that you\
    \ transfer funds to a personal account to 'activate' a feature or 'verify' your\
    \ identity. Any such request is a fraudulent attempt.\n\nTo prevent unauthorised\
    \ activity, we strictly enforce MFA and e-KYC before any state-changing action,\
    \ such as fund withdrawals or changing your linked bank account. If you notice\
    \ any transaction you did not authorise, or if you receive a notification for\
    \ a login you did not initiate, you must notify us immediately. \n\nWe maintain\
    \ a zero-tolerance policy towards fraud. Once you report a suspicious activity,\
    \ we will acknowledge the query within 24 hours. Most disputes are resolved within\
    \ our standard 7-15 business day window. Prompt reporting is essential to limit\
    \ your liability and allow us to freeze the account to prevent further unauthorised\
    \ outflows. Remember, your security is a shared responsibility; never share your\
    \ login credentials with anyone, regardless of who they claim to be."
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 43ba2e00-947e-5e4b-be03-872dcb0dba6c
  title: Demat & Trading Account — account agreement
  body: 'This agreement governs the relationship between Tarang Invest and the account
    holder for the Demat & Trading Account. By opening this account, you agree to
    the following terms:


    1. Fee Obligations: The account holder is liable for the annual maintenance charge
    of ₹300. This fee is billed periodically to ensure operational sustainability.
    For every sell transaction, a DP Charge of ₹13.5 will be levied to process the
    transfer of shares from the demat account. For active traders, an intraday brokerage
    of ₹20 per order applies. Equity delivery brokerage is provided at ₹0.


    2. Operational Requirements: All users must complete mandatory e-KYC and enable
    Multi-factor authentication (MFA). We reserve the right to restrict account activity
    if verification documents are found to be expired or inaccurate.


    3. Changes to Terms: Tarang Invest may modify the fee structure or terms of service.
    We will provide notice of such changes in accordance with SEBI and exchange guidelines.
    Continued use of the account after the notice period constitutes acceptance of
    the new terms.


    4. Account Closure: An account may be closed upon request, provided all outstanding
    dues, including the annual maintenance charge and any pending brokerage, are settled
    in full. All remaining securities must be transferred or sold before the account
    can be formally closed.


    5. Regulatory Compliance: This account is steered by the frameworks of SEBI, AMFI,
    NSE, and BSE. We adhere to strict data privacy norms to protect investor information.'
