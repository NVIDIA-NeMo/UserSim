- id: 646c1c57-4c0c-5208-a909-1d780a61694a
  title: ELSS Tax-Saver Fund — an unexpected charge or amount
  body: 'Symptom: You notice a charge you didn''t expect or the redemption amount
    is lower than your calculated portfolio value.


    Likely Causes:

    1. DP Charges: When you sell or redeem units from your demat account, DP Charges
    are levied per sell transaction for processing the transfer. This is a fixed cost
    for essential infrastructure.

    2. Exit Load: Some ELSS schemes may apply an Exit Load if units are redeemed within
    a specific timeframe (though they must first clear the 3 years lock-in).

    3. Market Fluctuations: Since ELSS is equity-linked, the value of your investment
    changes daily based on market performance.


    What to check in order:

    1. Check your transaction statement for ''DP Charges''—these are standard per-transaction
    fees.

    2. Review the fund''s specific Exit Load terms to see if a fee was applied upon
    redemption.

    3. Compare the current NAV (Net Asset Value) with the value at the time of your
    last statement to see the impact of market movement.


    How to resolve:

    - If you believe a DP Charge was applied incorrectly, tell us the transaction
    ID. We will review the ledger and, if an error is found, we will apply a correction
    to your account.

    - If you have a dispute regarding the amount, we will acknowledge the query within
    24 hours.


    When we escalate:

    If the discrepancy is due to a systemic error or a regulatory miscalculation,
    we will raise a case with the Compliance Officer or Grievance Redressal Officer.
    You will receive a resolution update within the standard 7-15 business day window.'
