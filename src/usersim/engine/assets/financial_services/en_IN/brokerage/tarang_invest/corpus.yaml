- id: 68078a28-a836-5b37-bc40-aea443dc8a17
  title: Margin Trading Facility — fraud and unauthorized-activity protection
  body: "At Tarang Invest, we prioritise the security of your leveraged positions.\
    \ Because the Margin Trading Facility allows for amplified buying power, it can\
    \ be a target for sophisticated fraud patterns. \n\nCommon threats include 'impersonation\
    \ scams,' where bad actors pose as Tarang Invest compliance officers claiming\
    \ your margin account is under review and requesting an immediate fund transfer\
    \ to a 'safe' account to avoid liquidation. Please remember: we will never ask\
    \ you to transfer funds to a personal account or a third-party entity to maintain\
    \ your margin requirements. We will also never ask for your MFA (Multi-factor\
    \ Authentication) codes or e-KYC passwords over a phone call or email.\n\nUnauthorized\
    \ activity in a margin account can lead to rapid financial loss due to the leveraged\
    \ nature of the product. If you notice any trade you did not authorise or an unexpected\
    \ pledge of your securities, you must notify us immediately. Our zero-tolerance\
    \ policy towards fraud means we act swiftly to freeze affected accounts. \n\n\
    To ensure your protection, all state-changing actions—such as modifying your pledged\
    \ collateral or withdrawing funds—require mandatory MFA and identity verification.\
    \ If you suspect fraudulent activity, report it to us instantly; the sooner we\
    \ are notified, the more effectively we can engage our structured dispute resolution\
    \ process to protect your assets.\n\nDisclaimer: Investments in the securities\
    \ market are subject to market risks. Read all related documents carefully before\
    \ investing."
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: f8fd3eda-fb59-562f-aec6-04c7c9b35af0
  title: Margin Trading Facility — account agreement
  body: 'This agreement governs the use of the Margin Trading Facility provided by
    Tarang Invest. By activating this facility, you agree to the following binding
    terms:


    1. Margin Obligations: You are required to maintain a minimum margin of 25% of
    the total value of the leveraged position. If the value of your collateral falls
    below this threshold, we reserve the right to initiate a margin call or liquidate
    securities to recover the shortfall.


    2. Cost of Borrowing: You agree to pay an annual interest rate of 14.99% on the
    funds provided by Tarang Invest. This interest accrues daily and is charged to
    your account periodically.


    3. Collateral and Pledging: To avail of the facility, you must pledge eligible
    securities. A pledge charge of ₹20 per scrip will be levied for each security
    pledged to secure the margin loan.


    4. Termination and Closure: Either party may terminate this facility. You may
    request to close your margin account provided all outstanding interest and the
    principal loan amount are cleared in full. Upon closure, we will release the pledged
    securities to your demat account.


    5. Compliance: This facility is operated under the frameworks of SEBI, NSE, and
    BSE. We maintain strict data privacy norms and require mandatory e-KYC and MFA
    for all fund withdrawals or portfolio changes.


    6. Default: Failure to meet the minimum margin of 25% within the specified notice
    window constitutes a default, allowing Tarang Invest to sell the pledged securities
    without further notice to recover dues.


    Disclaimer: Investments in the securities market are subject to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: terms_conditions
  source_authority: official
