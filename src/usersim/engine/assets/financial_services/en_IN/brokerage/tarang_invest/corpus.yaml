- id: 5a583eeb-b8c5-55ba-bcdb-80447aab7ece
  title: ELSS Tax-Saver Fund — check status or history
  body: 'Follow these steps to review your investment history and track the lock-in
    status of your ELSS Tax-Saver Fund units.


    Prerequisites:

    - An active Tarang Invest account.

    - Successful completion of MFA (Multi-factor authentication) for secure access.


    Steps:

    1. Request your current portfolio statement for the ELSS Tax-Saver Fund. We will
    then provide you with a detailed view of all your holdings.

    2. Review the ''Investment Date'' for each unit or SIP instalment. Since this
    product has a mandatory lock-in period of 3 years, the date of investment determines
    when the units become available.

    3. Identify the ''Lock-in Expiry Date'' listed next to each investment. This is
    the exact date after which you are eligible to redeem those specific units.

    4. If you wish to see the total amount invested towards your Section 80C limit,
    ask us for a ''Tax Summary Report.'' We will generate a document showing your
    total contributions, which can be compared against the ₹150000 deduction cap.

    5. For a full history of transactions, including the date and amount of every
    investment (minimum ₹500 per transaction), request your ''Transaction Ledger.''


    How you know it worked:

    You will receive a digital statement or a summary in the chat confirming your
    total invested value, the specific dates your units unlock, and your total contribution
    toward the ₹150000 tax limit.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
