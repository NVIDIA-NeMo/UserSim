- id: c54bb595-1bfe-51d6-87bf-bb188ac1994e
  title: ELSS Tax-Saver Fund — make a change or update
  body: 'If you need to update the details associated with your ELSS Tax-Saver Fund
    investment or your overall account, follow these steps. Please note that while
    you can update account details, the 3-year lock-in period on the invested capital
    cannot be changed or bypassed.


    Prerequisites:

    - Valid MFA (Multi-Factor Authentication) access.

    - Updated identity documents if you are changing your legal name or address.


    Steps to update your investment preferences or account details:

    1. Specify the Change: Tell us exactly what you wish to update (e.g., updating
    your registered email, mobile number, or linked bank account for future redemptions).

    2. Identity Verification: We will initiate a mandatory identity verification process.
    This may involve e-KYC or a request for a digital copy of a government-approved
    ID to prevent unauthorised account access.

    3. Provide Documentation: If the update is for a bank account or address, provide
    the new cancelled cheque or address proof as requested in the conversation.

    4. Confirmation of Update: We will process the request and send a confirmation
    notification to your registered contact details once the change is reflected in
    our systems.


    Note: If you are attempting to ''change'' your investment by withdrawing funds,
    we will check the date of investment. If the 3-year lock-in period has not lapsed,
    the request will be declined as per statutory requirements.


    For issues with accessing your account to make these changes, see ELSS Tax-Saver
    Fund — access or login problems.'
