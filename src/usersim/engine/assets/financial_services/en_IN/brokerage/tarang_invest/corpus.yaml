- id: dceb869d-0619-5ff5-a401-47e6e77c45e6
  title: Mutual Fund SIP — set up and activate
  body: 'Setting up a Mutual Fund SIP is a straightforward process designed to get
    your wealth-building journey started quickly. Please ensure you have your bank
    account details and a completed e-KYC process before beginning.


    1. Tell us which mutual fund scheme you wish to invest in and the amount you want
    to commit. Note that the minimum sip amount is ₹500.

    2. Specify your preferred investment date (e.g., the 5th of every month) and the
    duration of the SIP.

    3. Provide your mandate approval. Since we require multi-factor authentication
    (MFA) for state-changing actions, we will send a verification request to your
    registered device.

    4. Confirm the approval of the mandate. Once confirmed, we will link your bank
    account for the automated monthly debit.

    5. We will provide a confirmation notice once the SIP is activated, including
    the date of your first installment.


    You will know the setup was successful when you see the active SIP reflected in
    your portfolio dashboard with the scheduled next payment date. If you are comparing
    this to other options, you may find the differences in Mutual Fund SIP — vs. a
    similar product here.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: how_to_guide
  source_authority: official
