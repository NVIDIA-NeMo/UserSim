  mentions_tools: []
  institution_id: tarang_invest
- id: 85a252b8-8354-5f87-b77f-e1b85fe06eb4
  title: Margin Trading Facility — an unexpected charge or amount
  body: 'Symptom: You notice a deduction in your account balance or a charge on your
    statement that you did not anticipate.


    Likely Causes:

    - Accrued Interest: The Margin Trading Facility carries an annual interest rate
    of 14.99%. This is not a one-time fee but a recurring cost based on the duration
    the funds were borrowed.

    - Pledging Fees: Every time a new security is pledged to support your margin,
    a pledge charge of ₹20 per scrip is applied.

    - Margin Shortfall Penalty: If your account fell below the minimum margin of 25%,
    there may be associated regulatory or processing charges.


    What to check:

    1. Review your ''Margin Ledger'' to see the daily interest accrual.

    2. Check the number of scrips you pledged recently to see if the ₹20 per scrip
    charge matches your activity.

    3. Verify if a market dip caused your margin to drop below 25%, triggering a mandatory
    top-up or liquidation.


    Resolution:

    If the charges still seem incorrect, tell us the specific transaction date and
    amount. We will review the ledger. If a technical error is found, we will raise
    a case with our billing team to apply a correction. You can expect a resolution
    within our standard 7-15 business day window.


    Disclaimer: Investments in the securities market are subject to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: troubleshooting
  source_authority: official
