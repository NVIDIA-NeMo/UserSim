- id: 292a7c3f-89fe-58a7-880a-5f8a96b26ff7
  title: ELSS Tax-Saver Fund — how rates are tiered and applied
  body: 'The ELSS Tax-Saver Fund does not have a fixed interest rate or a tiered yield,
    as it is an equity-linked investment product. Instead, its value is determined
    by the Net Asset Value (NAV) of the underlying assets.


    How Value is Applied:

    - Returns: The returns are variable and depend on market performance. We do not
    guarantee any specific percentage of return.

    - Minimum Investment: A flat minimum of ₹500 applies to all investors regardless
    of their account tier.

    - Tax Deduction: The Section 80C deduction is applied on the principal invested,
    up to a maximum cap of ₹150000 per financial year.

    - Lock-in: A flat 3 years lock-in period applies to every single investment made
    in this fund.


    What changes the value:

    - Market Movement: Changes in the equity market directly impact the NAV.

    - Expenses: The fund''s expense ratio (managed by the AMC) is deducted from the
    NAV, which is reflected in the daily value of your units.'
