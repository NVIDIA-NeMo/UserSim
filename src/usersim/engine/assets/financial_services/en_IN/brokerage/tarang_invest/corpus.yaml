- id: 8c20cf00-21a5-5814-a2ef-f9ab8aa86ed1
  title: Margin Trading Facility — recognizing scams targeting this product
  body: 'At Tarang Invest, we prioritise your protection. The Margin Trading Facility
    is a powerful tool for amplifying buying power, but its complexity can be exploited
    by fraudsters. We urge you to remain vigilant against specific scams targeting
    active traders.


    Common Fraud Patterns:

    1. The ''Guaranteed Return'' Pitch: Scammers may contact you claiming they can
    manage your Margin Trading Facility to guarantee specific profits. We never project
    or guarantee returns on any investment. Any individual promising a fixed percentage
    gain using our leverage tools is a fraudster.

    2. Urgent Margin Call Spoofing: You may receive fake emails or messages claiming
    your account is facing an immediate liquidation due to a margin shortfall, demanding
    an urgent transfer to a ''temporary recovery account.'' We will never ask you
    to transfer funds to any account other than your verified Tarang Invest account.

    3. Recovery Service Scams: If you have suffered a loss, ''recovery agents'' may
    claim they can reverse margin-funded trades for a fee. This is impossible.


    What We Will Never Ask For:

    We will never ask for your multi-factor authentication (MFA) codes, your e-KYC
    passwords, or your login credentials over a phone call or email. These are mandatory
    for your security and should never be shared.


    Immediate Action Steps:

    If you notice any unauthorised trade or receive a suspicious request:

    1. Immediately notify us via our digital chat or email during business hours (9:00
    AM to 6:00 PM IST).

    2. Change your account password and review your linked bank details.


    We maintain a zero-tolerance policy towards fraud. All reported incidents are
    acknowledged within 24 hours and typically resolved within a 7-15 business day
    window. Remember, all investments are subject to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 898c5772-bc8b-51fe-91f8-02a12e2465b8
  title: Margin Trading Facility — limits, restrictions, and edge cases
  body: "This document provides essential operational boundaries for the Margin Trading\
    \ Facility to assist support agents in guiding customers. \n\nCore Limits and\
    \ Financials:\n- Minimum Margin: A minimum margin of 25% is mandatory. This is\
    \ the portion of the total trade value that the customer must provide from their\
    \ own funds; we provide the remaining leverage.\n- Cost of Leverage: The facility\
    \ carries an annual interest rate of 14.99% on the borrowed amount. This interest\
    \ accrues daily and is charged to the account.\n- Operational Charges: A pledge\
    \ charge per scrip of ₹20 is applied whenever securities are pledged to secure\
    \ the margin.\n\nRestrictions and Edge Cases:\n- Eligible Securities: Not all\
    \ stocks are eligible for pledging. Leverage is restricted to a specific list\
    \ of approved scrips as per SEBI and exchange frameworks. If a customer attempts\
    \ to use the facility for a non-approved scrip, the action will be blocked.\n\
    - Margin Shortfalls: If the value of the pledged securities drops such that the\
    \ margin falls below 25%, a margin call is triggered. The customer must either\
    \ deposit additional funds or sell a portion of the holdings to restore the minimum\
    \ margin.\n- Pledging Requirements: Securities must be successfully pledged via\
    \ the e-KYC and MFA process before leverage can be utilised. Any failure in the\
    \ pledge process will result in the trade being treated as a standard delivery\
    \ trade (requiring 100% funding).\n\nCompliance Note: All operations must adhere\
    \ to the guidelines set by SEBI, AMFI, NSE, and BSE. Ensure the customer understands\
    \ that while this tool amplifies buying power, it also amplifies potential losses.\
    \ Investments are subject to market risks."
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: product_sheet
