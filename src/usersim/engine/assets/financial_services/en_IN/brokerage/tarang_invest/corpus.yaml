- id: eb5635cb-c0ba-5a1f-b490-2592d9216c36
  title: Mutual Fund SIP — resolve a common request end-to-end
  body: 'A common request we handle is the ''SIP Pause''—allowing you to temporarily
    stop investments during a financial crunch without cancelling your entire plan.


    Prerequisites:

    - An active Mutual Fund SIP currently running in your portfolio.

    - Verified identity through our secure authentication process.


    Steps to pause your SIP:

    1. Tell us which specific Mutual Fund SIP you wish to pause.

    2. We will verify your identity using Multi-factor authentication (MFA) to ensure
    the request is authorised.

    3. Specify the duration for which you want to pause the investment. Please note
    that the maximum pause duration is 6 months.

    4. We will confirm the start and end dates of the pause period and inform you
    of the next date the SIP will automatically resume.

    5. We will send you a confirmation notice once the pause has been successfully
    registered with the fund house.


    How you know it worked:

    - You will receive a confirmation message stating the SIP is ''Paused''.

    - Your upcoming monthly deductions (of ₹500 or more) will stop for the specified
    period.

    - Your existing units will continue to stay invested and grow (or fluctuate) based
    on market performance.


    ***Disclaimer: Mutual fund investments are subject to market risks; read all scheme
    related documents carefully.***'
