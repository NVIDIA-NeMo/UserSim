- id: cf23c52f-fd1f-5a31-8f53-0a85c588fabf
  title: Margin Trading Facility — access or login problems
  body: 'Symptom: You are unable to access the Margin Trading Facility features or
    are seeing a ''Login Restricted'' message when attempting to pledge securities.


    Likely Causes:

    1. Pending e-KYC: Your identity verification may have expired or is incomplete.

    2. MFA Failure: Your multi-factor authentication device is not synced or the code
    was entered incorrectly.

    3. Compliance Block: Your account may be temporarily restricted due to a margin
    shortfall (falling below the minimum margin of 25%).


    What to check in order:

    1. Check your registered email for any notifications regarding e-KYC updates.
    If pending, provide the requested documents to us in the chat.

    2. Reset your MFA. If you have changed your phone number, ask us to update your
    contact details and re-trigger the MFA setup.

    3. Review your current portfolio value. If the market value of your pledged assets
    has dropped, causing your margin to fall below 25%, you will be restricted from
    taking new leveraged positions.


    How to fix it:

    - For e-KYC or MFA issues: Provide the necessary verification details, and we
    will reactivate your access immediately.

    - For margin shortfalls: Deposit additional funds or pledge more securities (subject
    to the ₹20 pledge charge per scrip) to bring your margin back to 25%.


    When to escalate:

    If you have met the 25% margin requirement and your MFA is active, but you still
    cannot access the facility, we will raise a technical ticket with our systems
    team. You will receive an update on the resolution within 24 hours.'
