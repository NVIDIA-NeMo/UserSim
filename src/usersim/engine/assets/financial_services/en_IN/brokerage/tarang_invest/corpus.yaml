- id: 19722023-144c-5613-a9b7-03b4609c8e30
  title: Demat & Trading Account — recognizing scams targeting this product
  body: "At Tarang Invest, your security is our priority. As you compare our Demat\
    \ & Trading Account with other offerings, it is vital to understand the specific\
    \ fraud patterns targeting retail investors in India. \n\nCommon scams include\
    \ 'guaranteed return' schemes where fraudsters pose as relationship managers,\
    \ promising unrealistic profits if you transfer your portfolio or provide account\
    \ access. Be wary of 'urgent' messages claiming your account will be frozen unless\
    \ you verify your credentials via a third-party link. \n\nCrucially, we will never\
    \ ask you for your password, MFA (Multi-Factor Authentication) codes, or your\
    \ e-KYC documents over a phone call or unsecured email. We also never guarantee\
    \ specific returns on equity investments, as all such investments are subject\
    \ to market risks. \n\nIf you notice any unauthorised activity or receive a suspicious\
    \ request, your first action should be to notify us immediately. We maintain a\
    \ zero-tolerance policy towards fraud. For most security queries, we provide an\
    \ acknowledgement within 24 hours and aim for resolution within a standard 7-15\
    \ business day window. Prompt reporting is essential to protect your assets and\
    \ limit liability for unauthorised transactions."
