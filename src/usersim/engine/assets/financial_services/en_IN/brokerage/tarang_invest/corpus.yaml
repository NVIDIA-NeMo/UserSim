- id: dfd9b330-3c86-5dc9-a75d-916aecae8a59
  title: Demat & Trading Account — overview
  body: 'Welcome to Tarang Invest. Our Demat & Trading Account is the foundational
    gateway for equity investing, designed to provide retail investors and active
    traders in India with institutional-grade tools and a lean cost structure.


    We believe in ''cost-visibility,'' which is why we have eliminated delivery brokerage
    to help you build long-term wealth without unnecessary friction. Whether you are
    investing for the first time or managing a high-volume portfolio, our account
    structure ensures you only pay for essential infrastructure and regulatory requirements.


    **Fee Structure**

    - Equity Delivery Brokerage: ₹0

    - Intraday Brokerage: ₹20 per order

    - DP Charges: ₹13.5 per sell transaction (levied for processing the transfer of
    shares from your demat account)

    - Annual Maintenance Charge: ₹300


    **Key Features**

    - Zero-brokerage on delivery trades to encourage long-term investing.

    - Fixed-cost intraday trading for predictable operational expenses.

    - Streamlined DP operations for efficient share transfers.


    *Disclaimer: Investments in the securities market are subject to market risks.
    Read all related documents carefully before investing. We provide educational
    resources and product information but strictly defer individualized tax, legal,
    or financial planning advice. We never project or guarantee returns on any investment.*'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: product_sheet
  source_authority: official
