- id: 27997a1b-4bd1-5855-ba55-f2a54bdd0513
  title: ELSS Tax-Saver Fund — regulatory disclosures
  body: 'This document provides the formal regulatory framework and disclosures governing
    the ELSS Tax-Saver Fund offered by Tarang Invest. Compliance is steered by SEBI,
    AMFI, NSE, and BSE frameworks, prioritizing investor protection and fair treatment.


    Market Risk Warning:

    Investments in the ELSS Tax-Saver Fund are subject to market risks. The value
    of the investments may go up or down based on market fluctuations. Past performance
    is not an indicator of future results. We never project or guarantee returns on
    any investment.


    Taxation and Statutory Terms:

    1. Section 80C: Investments are eligible for tax deductions under Section 80C
    of the Income Tax Act, up to a section 80c deduction cap of ₹150000 per financial
    year.

    2. Lock-in Period: There is a mandatory statutory lock-in period of 3 years. Units
    cannot be redeemed or transferred before the expiry of 3 years from the date of
    allotment.

    3. Minimums: The minimum investment required to initiate a transaction is ₹500.


    Advice Posture:

    Tarang Invest provides educational resources and product information only. We
    strictly defer individualized tax, legal, or financial planning advice. Customers
    are encouraged to consult with a certified tax professional to understand how
    the Section 80C deduction applies to their specific financial situation.


    Data Privacy and Security:

    All transactions are subject to strict data privacy norms. Multi-factor authentication
    (MFA) and e-KYC are mandatory for all state-changing actions to prevent unauthorized
    access.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: disclosure
  source_authority: official
