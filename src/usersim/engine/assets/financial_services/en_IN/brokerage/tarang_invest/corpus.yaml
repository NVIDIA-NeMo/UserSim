- id: 317605ce-79e4-548c-af9a-f3dd9c87d4d8
  title: Margin Trading Facility — regulatory disclosures
  body: 'This Margin Trading Facility is governed by the frameworks established by
    SEBI, AMFI, NSE, and BSE. Tarang Invest operates this facility with a commitment
    to investor protection and fair treatment.


    Regulatory Requirements:

    1. Margin Maintenance: As per regulatory norms, investors must maintain a minimum
    margin of 25%. If the value of the pledged collateral falls below this threshold
    due to market volatility, Tarang Invest reserves the right to initiate a margin
    call. Failure to replenish the margin may lead to the liquidation of the pledged
    securities to recover the outstanding loan.

    2. Cost Transparency: The annual interest rate of 14.99% is non-negotiable and
    applies to the funded portion of the trade. A pledge charge per scrip of ₹20 is
    levied for processing the collateral transfer.

    3. No Guaranteed Returns: In accordance with our transparency standards, we never
    project or guarantee returns on any investment funded via this facility. Leverage
    increases both the potential for profit and the potential for loss.


    Data Privacy: All identity verification and e-KYC data used for the activation
    of this facility are handled under strict data privacy norms.


    ***Mandatory Market-Risk Warning: Investments in the securities market are subject
    to market risks. The use of leverage through the Margin Trading Facility can significantly
    increase the risk of loss. Please ensure you understand the risks before proceeding.***'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 06ca5bc2-8969-5509-b5ab-eb2f41aada3f
  title: Margin Trading Facility — interest rate / APY schedule
  body: 'Tarang Invest applies a simplified, flat-rate pricing model for the Margin
    Trading Facility to ensure operational sustainability and cost-visibility for
    our clients.


    - Annual Interest Rate: 14.99%


    This rate applies to all balances borrowed under the facility, regardless of the
    total loan amount or the duration of the trade. The interest is quoted as a nominal
    annual rate and is applied to the daily outstanding balance of the funded amount.


    Factors that may affect your total cost:

    - Daily Balance: Because interest is calculated daily, the total amount paid depends
    on how long you hold the leveraged position.

    - Pledge Volume: While the interest rate is flat, the total cost of setting up
    the facility depends on the number of different securities pledged, as a pledge
    charge per scrip of ₹20 is applied to each.'
