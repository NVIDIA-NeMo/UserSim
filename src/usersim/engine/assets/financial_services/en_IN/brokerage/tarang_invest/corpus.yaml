  mentions_tools: []
  institution_id: tarang_invest
- id: bef9c333-f930-5be2-a1a0-be22c89861ba
  title: Demat & Trading Account — a discrepancy in your records or statement
  body: 'If a customer reports that their statement does not match their records,
    support agents should follow this systematic verification process.


    **Common Symptoms**

    - Customer claims a trade was executed but is not appearing in the history.

    - Customer disputes the amount of charges levied on a specific date.

    - Holding quantity in the demat account differs from the customer''s personal
    log.


    **Verification Steps**

    1. **Check Trade Timing:** Confirm the trade date and time. If the trade was executed
    after market hours or is pending settlement (T+1/T+2), it may not yet reflect
    in the final statement.

    2. **Audit Brokerage Charges:** Verify if the trade was Delivery or Intraday.
    Ensure the equity delivery brokerage of ₹0 was applied for delivery, or the fixed
    ₹20 per order for intraday.

    3. **Verify DP Charges:** For every sell transaction, confirm that the DP Charges
    of ₹13.5 were correctly applied. Customers often mistake these regulatory/processing
    fees for brokerage.

    4. **Review Maintenance Fees:** Check if the annual maintenance charge of ₹300
    was debited during the billing cycle, as this is a frequent source of ''unexpected''
    balance drops.


    **The Fix**

    If a calculation error is found, we will rectify the ledger and apply a correction
    entry immediately. If the discrepancy is due to a misunderstanding of fees, explain
    the ''cost-visibility'' philosophy using the figures above.


    **When to Escalate**

    If the records still do not align after a full audit, escalate the matter to the
    Grievance Redressal Officer. We will acknowledge the dispute within 24 hours and
    resolve it within the standard 7-15 business day window.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
