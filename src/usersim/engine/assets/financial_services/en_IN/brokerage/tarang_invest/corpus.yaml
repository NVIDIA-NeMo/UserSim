- id: bae61afa-cc64-551c-bfab-fc1ab095b60d
  title: ELSS Tax-Saver Fund — risk disclosures
  body: 'Investment in the ELSS Tax-Saver Fund involves specific risks and regulatory
    constraints that investors must understand.


    Market Risk Disclosure:

    Mutual fund investments are subject to market risks. The value of the investments
    can go up or down based on the performance of the underlying equity assets. Past
    performance is not a guarantee of future returns. We strictly adhere to a policy
    of transparency and never project or guarantee returns on any investment.


    Liquidity Risk and Lock-in:

    This product features a mandatory statutory lock-in period of 3 years. During
    this window, the invested capital cannot be withdrawn under any circumstances.
    Investors should only commit funds that they do not require for immediate liquidity.


    Taxation Disclosure:

    While the investment allows for a deduction under Section 80C up to a cap of ₹150000,
    the tax treatment of gains upon redemption is subject to the current Income Tax
    Act of India. We provide educational information regarding these caps but strictly
    defer individualized tax or legal advice to qualified professionals.


    Compliance:

    Our operations are steered by SEBI, AMFI, NSE, and BSE frameworks. We prioritise
    investor protection and fair treatment. All state-changing actions are protected
    by mandatory Multi-factor authentication (MFA) and e-KYC to ensure data privacy
    and prevent unauthorised access.'
  domain: brokerage_investing
  product_category: elss_tax_saver
