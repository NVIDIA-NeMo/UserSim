- id: 3310f352-bc6f-536c-8ef7-027e2a373bd6
  title: Margin Trading Facility — a declined or blocked action
  body: 'Symptom: You attempted to place a trade using the Margin Trading Facility
    or attempted to pledge a security, but the action was declined or blocked.


    Likely Causes:

    1. Insufficient Margin: Your account may not meet the minimum margin of 25% required
    for the total trade value.

    2. Ineligible Scrip: The specific stock you are trying to buy or pledge may not
    be approved for the Margin Trading Facility by SEBI or the exchanges.

    3. Pending Verification: Your e-KYC or MFA verification may have expired or failed
    during the state-changing action.

    4. Unpaid Interest: There may be overdue interest charges (at the annual interest
    rate of 14.99%) that must be cleared before new leverage is granted.


    What to check in order:

    1. Check your available funds: Ensure you have at least 25% of the trade value
    available as a margin.

    2. Verify the scrip: Ask us if the specific stock is eligible for the Margin Trading
    Facility.

    3. Check your verification status: Confirm that your MFA is active and your identity
    is verified.


    How to fix:

    - If funds are low: Deposit the required amount to reach the 25% minimum margin.

    - If the scrip is ineligible: You must fund the trade 100% using a standard delivery
    trade.

    - If verification failed: Re-complete the MFA or e-KYC process as prompted in
    the conversation.


    When to escalate:

    If you have the required 25% margin and the scrip is eligible, but the action
    is still blocked, tell us. We will then raise a case with our Compliance Officer
    to review the restriction. You will receive an update on the resolution within
    7-15 business days.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
