  title: Mutual Fund SIP — eligibility requirements
  body: 'To maintain compliance with SEBI and AMFI frameworks, the following eligibility
    criteria apply to Mutual Fund SIP accounts:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Identity Verification | Completed e-KYC | Eligible to start SIP |

    | Identity Verification | Pending/Incomplete KYC | Ineligible for investment |

    | Investment Amount | ₹500 or above | Account Setup Permitted |

