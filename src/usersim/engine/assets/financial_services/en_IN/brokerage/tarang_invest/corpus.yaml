  institution_id: tarang_invest
- id: 0ee69168-6427-556b-afdb-3c085c3f876d
  title: Demat & Trading Account — cost and charges
  body: "**What are the recurring costs for my account?**\nTo ensure operational sustainability,\
    \ we charge an annual maintenance charge of ₹300. \n\n**How much do I pay when\
    \ I sell shares?**\nApart from any applicable taxes, there is a DP Charge of ₹13.5\
    \ levied per sell transaction for processing the transfer of shares from your\
    \ demat account.\n\n**Are there any brokerage fees?**\nIt depends on your trade\
