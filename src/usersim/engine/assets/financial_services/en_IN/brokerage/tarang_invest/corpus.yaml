- id: ae315867-9dc7-59c2-9597-4c066db93040
  title: Margin Trading Facility — fee schedule
  body: 'This schedule outlines the fixed costs associated with using the Margin Trading
    Facility at Tarang Invest. We adhere to a ''cost-visibility'' philosophy, ensuring
    no hidden charges.


    - Annual Interest Rate: 14.99% (Applied to the borrowed amount)

    - Pledge Charge per Scrip: ₹20 (Levied per security pledged as collateral)

    - Minimum Margin Requirement: 25% (The portion of the trade value the investor
    must provide)


