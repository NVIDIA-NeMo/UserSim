- id: 6f6bb59d-1ce1-54c7-a2cb-b1abe29cd6eb
  title: Mutual Fund SIP — how rates are tiered and applied
  body: 'The Mutual Fund SIP does not have a tiered interest rate as it is an investment
    product, not a deposit. Instead, the ''rates'' associated with this product refer
    to the entry and exit costs.


    - Minimum Entry Rate: A flat minimum SIP amount of ₹500 applies to all investors
    regardless of their account balance or portfolio size.

    - Exit Load Rate: A flat rate of 1% is applied to the value of units redeemed
    within 365 days of the purchase date. This is a non-tiered charge; it applies
    equally to all redemptions meeting the time criteria.

    - Pause Limit: A maximum of 6 months is the standard allowance for pausing SIP
    installments across all accounts.


    These rates are aligned with SEBI and AMFI guidelines. Any changes to these figures
    will be communicated via the registered email address in accordance with our change-of-terms
    policy.'
