- id: a42142e0-0deb-5b0c-8045-5263f114ff6b
  title: Demat & Trading Account — intraday brokerage per order explained
  body: "**What is intraday brokerage?**\nIntraday brokerage is the fee charged when\
    \ you buy and sell a stock within the same trading day, without taking delivery\
    \ of the shares. \n\n**How much does Tarang Invest charge for intraday trades?**\n\
    We believe in cost-visibility. We charge a fixed intraday brokerage of ₹20 per\
    \ order. This ensures there are no hidden costs regardless of your trade volume.\
    \ \n\n**How is this different from delivery brokerage?**\nUnlike intraday trading,\
    \ if you choose to hold your shares for the long term, we offer equity delivery\
    \ brokerage of ₹0. \n\nFor a complete overview of all account costs, please refer\
    \ to the Demat & Trading Account — overview."
