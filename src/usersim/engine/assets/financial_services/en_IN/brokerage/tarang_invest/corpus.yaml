  institution_id: tarang_invest
- id: f4c91a00-93b2-5ae9-833a-0b4d8347cfc4
  title: Demat & Trading Account — access or login problems
  body: 'If you are unable to access your Demat & Trading Account, please follow these
    steps to identify and resolve the issue.


    Symptom: "I cannot log in to my account" or "My MFA code is not arriving."


    Likely Causes:

    1. Incorrect credentials or expired password.

    2. Network latency affecting the delivery of the MFA code.

    3. Account freeze due to pending e-KYC updates or regulatory compliance checks.


    What to check in order:

    1. Verify your internet connectivity and ensure you are using the latest version
    of our interface.

    2. Check your registered mobile number''s signal strength to ensure the MFA SMS
    can be delivered.

    3. Confirm if you have received any notifications from us regarding mandatory
    documentation updates or account freezes.


    Resolution:

    - For password issues: Tell us you have forgotten your password. We will initiate
    a secure reset process requiring MFA verification. Once completed, you will receive
    a temporary password to log in and set a new one.

    - For MFA delays: Wait 60 seconds and then ask us to resend the code. If the issue
    persists, we will verify your identity through an alternative secure method.

    - For account freezes: Provide the requested missing documentation. Once we verify
    the documents, we will lift the freeze.


    When to escalate:

    If the login issue is not resolved after these steps, we will raise a technical
    ticket with our backend engineering team. You will receive a ticket number, and
    we will provide a resolution update within 24 to 48 hours.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
