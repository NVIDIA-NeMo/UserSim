- id: a41d7fef-ae82-5d1b-96b1-d6ef58898605
  title: ELSS Tax-Saver Fund — cancel, close, or downgrade
  body: 'Closing or cancelling an investment in the ELSS Tax-Saver Fund is different
    from other products due to statutory regulations.


    What you need before starting:

    - Your registered account details.

    - Confirmation that your investment has completed the mandatory lock-in period
    of 3 years.


    Steps to Close/Redeem:

    1. Tell us that you wish to redeem your units from the ELSS Tax-Saver Fund.

    2. We will verify the date of your investment. If the 3 years lock-in period has
    not yet elapsed, we will inform you of the remaining duration, as statutory law
    prohibits premature closure.

    3. If the 3 years lock-in period is complete, we will ask you to confirm the redemption
    amount (full or partial).

    4. Provide your MFA (Multi-Factor Authentication) to authorise the state-changing
    action.

    5. We will process the redemption request. You will receive a confirmation once
    the units are sold and the funds are credited to your linked bank account.


    How you know it worked:

    - You will receive a transaction confirmation notification.

    - The ELSS Tax-Saver Fund units will no longer appear in your portfolio holdings.

    - The redemption proceeds will be visible in your bank statement.


    Note: Because this is a statutory product, ''downgrading'' is not applicable;
    you either hold the units for the full 3 years lock-in period or redeem them once
    they become free.'
