- id: ae8408a6-797c-5d50-8940-d65924cb121d
  title: Mutual Fund SIP — sip pause max months explained
  body: '**What happens if I need to stop my SIP payments temporarily?**

    We understand that financial priorities can shift. You can pause your Mutual Fund
    SIP to stop monthly deductions without cancelling the entire investment. However,
    there is a limit: you can pause your SIP for a maximum of 6 months.


    **Does pausing my SIP affect my existing investments?**

    No. Pausing only stops future contributions. Your existing units remain invested
    and continue to be subject to market risks. No penalties are charged for using
    the pause feature.


    **What happens after the 6 months pause period ends?**

    Once the limit of 6 months is reached, your SIP will automatically resume on its
    scheduled date, provided the mandate is still active. If you need a longer break,
    you may need to cancel the SIP and start a new one later.


    For more details on setup, please see Mutual Fund SIP — overview.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: faq
