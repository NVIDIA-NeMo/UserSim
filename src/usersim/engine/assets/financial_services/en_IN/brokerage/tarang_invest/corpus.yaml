- id: be2e71f4-35b7-5a95-96ef-9ffd7788238d
  title: ELSS Tax-Saver Fund — a failed or pending action
  body: 'If you encounter an issue while investing in the ELSS Tax-Saver Fund, such
    as a ''Transaction Failed'' or ''Pending'' status, please follow these steps:


    Symptom: The investment was not processed, or the amount was debited from the
    bank but units are not showing in the portfolio.


    Likely Causes:

    1. Insufficient funds in the linked bank account.

    2. KYC status is expired or incomplete.

    3. Investment amount is below the minimum investment of ₹500.

    4. Temporary downtime with the fund house or payment gateway.


    What to check in order:

    1. Check your bank balance to ensure the amount was actually debited.

    2. Verify your KYC status in your account profile; multi-factor authentication
    (MFA) must be active for all state-changing actions.

    3. Confirm that the investment amount entered was at least ₹500.


    How to fix:

    - If the amount was not debited, please re-initiate the investment ensuring the
    amount meets the minimum requirement.

    - If the amount was debited but units are not reflected, tell us the transaction
    ID and date. We will track the payment with the fund house.


    When we escalate:

    If the issue is not resolved within 24 hours of your report, we will raise a formal
    case with the fund house and our internal Compliance Officer. You will receive
    an update on the resolution progress within our standard window of 7-15 business
    days.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: troubleshooting
