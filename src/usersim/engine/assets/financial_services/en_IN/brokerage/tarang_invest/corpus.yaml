- id: 5714b234-ce5b-5c39-a2f6-fe3a93fdf4ef
  title: Margin Trading Facility — cost and charges
  body: 'Q: What are the primary costs associated with using the Margin Trading Facility?

    A: The main costs include an annual interest rate of 14.99% on the funds we provide
    to amplify your buying power and a pledge charge per scrip of ₹20 for processing
    the pledge of your securities.


    Q: Is there a cost for the initial setup?

    A: We believe in cost-visibility. There is no separate setup fee for the facility,
    but you must maintain a minimum margin of 25% to qualify for the leverage.


    Q: How is the interest calculated?

    A: The annual interest rate of 14.99% is calculated based on the actual amount
    borrowed and the duration for which the facility is utilised.


    For a full breakdown of all applicable costs, please refer to the Margin Trading
    Facility — fee schedule.'
