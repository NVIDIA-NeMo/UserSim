- id: 7cc5641b-ec0f-5be7-b962-54a9ad6b8224
  title: ELSS Tax-Saver Fund — a declined or blocked action
  body: 'Symptom: You attempted to redeem units from your ELSS Tax-Saver Fund, but
    the request was declined or blocked by the system.


    Likely Causes:

    1. Lock-in Period Not Completed: The most common cause is that the units have
    not yet completed the mandatory lock-in period of 3 years from the date of investment.

    2. Insufficient Amount: You may be attempting to redeem an amount that exceeds
    the currently unlocked portion of your portfolio.

    3. Verification Failure: The action may have been blocked due to a failure in
    the mandatory MFA (Multi-factor authentication) or e-KYC verification.


    What to check in order:

    1. Check the Investment Date: Look at your statement and verify if exactly 3 years
    have passed since the date of the investment you are trying to withdraw.

    2. Check Unlockable Balance: Confirm if you have any units that have passed their
    3 year anniversary. Remember, if you invested via SIP, each instalment has its
    own separate lock-in timer.

    3. Check Verification Status: Ensure your account is fully KYC compliant and your
    MFA is active.


    How to fix:

    - If the lock-in period has not ended, the action cannot be overridden. You must
    wait until the 3 year period is complete.

    - If you believe the units should be unlocked but are still blocked, tell us the
    specific investment date and transaction ID. We will manually review the record
    against the regulatory timestamp.


    When to escalate:

    If we cannot resolve the block during the conversation despite the 3 year period
    being complete, we will raise a formal case with our Compliance Officer. You will
    receive a case reference number, and we will resolve the discrepancy within a
    standard 7-15 business day window.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: troubleshooting
  source_authority: official
