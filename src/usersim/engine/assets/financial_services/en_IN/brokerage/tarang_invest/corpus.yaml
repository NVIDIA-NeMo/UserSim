- id: bd4255b1-8cf9-5bdd-9fdc-2f13618bffea
  title: Margin Trading Facility — check status or history
  body: 'To maintain a disciplined trading strategy, it is important to regularly
    monitor your leveraged positions and the costs incurred. Follow these steps to
    check your status and history:


    Prerequisites:

    You must have an active Demat & Trading Account and have previously activated
    the Margin Trading Facility.


    Steps to Check Status and History:

    1. Request your current margin positions: Tell us you would like to see your active
    Margin Trading Facility positions. We will provide a list of all scrips currently
    held under leverage, the amount borrowed for each, and the current value of the
    pledged securities.

    2. Verify your margin level: Ask us for your current margin percentage. We will
    confirm if you are meeting the minimum margin of 25% requirement or if you are
    nearing a margin call threshold.

    3. Review interest charges: Ask us for the total interest accrued on your margin
    positions. We will provide the amount calculated at the annual interest rate of
    14.99% for the current period.

    4. Check pledge history: Request a history of your pledge transactions. We will
    list every scrip pledged and the corresponding pledge charge per scrip of ₹20
    that was applied.


    How you know it worked:

    You will receive a detailed summary in the chat or via email showing your leveraged
    holdings, the precise interest costs, and a confirmation that your margin levels
    are compliant with the 25% minimum.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: how_to_guide
  source_authority: official
