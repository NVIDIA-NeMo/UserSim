- id: 7d4b34e6-7d62-54d8-a951-b530dd7cb640
  title: Mutual Fund SIP — current offer
  body: "Boost your long-term savings with our 'Disciplined Investor' reward! \n\n\
    From 1st November 2023 to 31st December 2023, any existing customer who activates\
    \ a new Mutual Fund SIP with a monthly commitment of ₹2,000 or more will receive\
    \ a one-time loyalty bonus of ₹250 credited to their trading account wallet.\n\
