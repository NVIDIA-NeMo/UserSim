- id: 96369b2e-ea06-5450-9917-0b30bba3173b
  title: ELSS Tax-Saver Fund — overview
  body: 'Welcome to a smarter way of saving for the future while reducing your tax
    burden today. The ELSS Tax-Saver Fund is a strategic investment designed for retail
    investors in India who wish to grow their wealth through equity markets while
    claiming tax deductions under Section 80C of the Income Tax Act.


    We offer this fund as a disciplined gateway to equity investing, combining the
    potential for long-term capital appreciation with statutory tax benefits. To ensure
    the product remains accessible to all, we have set a minimum investment of ₹500,
    allowing you to start your tax-saving journey with a modest amount.


    Key features of the ELSS Tax-Saver Fund include:


    1. Tax Benefits: You can claim a deduction of up to ₹150000 under Section 80C,
    reducing your taxable income for the financial year.

    2. Statutory Lock-in: In accordance with regulatory norms, this fund carries a
    mandatory lock-in period of 3 years. This means your invested capital cannot be
    withdrawn until this period expires from the date of investment.

    3. Market Exposure: As an equity-oriented fund, it provides exposure to a diversified
    portfolio of stocks managed by professionals.


    Important Information:

    We believe in full transparency. Please note that all mutual fund investments
    are subject to market risks. We provide educational resources to help you understand
    these products, but we strictly defer individualized tax, legal, or financial
    planning advice. We never project or guarantee specific returns on any investment.


    Whether you are looking to start your first investment or optimize your tax portfolio,
    the ELSS Tax-Saver Fund provides a structured path toward long-term growth.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 8a1e2f1a-a6e6-5573-a2e8-4d70d94d73e4
  title: ELSS Tax-Saver Fund — lock in years explained
  body: 'Questions about the ELSS Tax-Saver Fund lock-in period:


    Q: What is the lock-in period for this fund?

    A: The ELSS Tax-Saver Fund has a mandatory lock-in period of 3 years. This is
    a statutory requirement for all funds offering tax benefits under Section 80C.


    Q: Can I withdraw my money if I have an emergency before 3 years?

    A: No, the lock-in period is absolute. Your capital cannot be withdrawn until
    the 3 years have elapsed from the date of each specific investment.


    Q: How does the lock-in work if I invest via a Systematic Investment Plan (SIP)?

    A: Each individual installment you invest is treated as a separate investment.
    Therefore, each installment has its own 3 years lock-in period starting from the
    date that specific payment was made.


    For more details on how this compares to other growth tools, please refer to Mutual
    Fund SIP — overview.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: faq
