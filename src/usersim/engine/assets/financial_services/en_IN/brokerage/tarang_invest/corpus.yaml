- id: d7f331cc-1fcd-5063-a4f8-a2aade8e2c89
  title: Demat & Trading Account — account security best practices
  body: "At Tarang Invest, the safety of your assets is our highest priority. Your\
    \ Demat & Trading Account holds significant value, making it a target for sophisticated\
    \ phishing and social engineering attacks. To protect your holdings, we require\
    \ all users to adhere to these security best practices.\n\nFirst, multi-factor\
    \ authentication (MFA) is mandatory for all state-changing actions. This includes\
    \ fund withdrawals, changing your registered mobile number, or modifying your\
    \ portfolio. We will never ask you to share your MFA code, password, or PIN over\
    \ a phone call, SMS, or email. If anyone claiming to be from Tarang Invest asks\
    \ for these details, it is a fraud attempt.\n\nSecond, be cautious of 'guaranteed\
    \ return' schemes. We maintain a strict standard of transparency and will never\
    \ project or guarantee returns on any investment. Any communication promising\
    \ fixed profits from equity trading is a red flag.\n\nThird, regularly review\
    \ your account statements for any unauthorised transactions. If you notice any\
    \ discrepancy, report it to us immediately. Our structured dispute resolution\
    \ process ensures that queries are acknowledged within 24 hours and resolved within\
    \ a standard 7-15 business day window. \n\nFinally, ensure your e-KYC details\
    \ are current. Identity verification is strictly enforced to prevent unauthorised\
    \ account access. If you suspect your account has been compromised, notify us\
    \ immediately to freeze your trading capabilities and protect your securities.\
    \ Remember, equity investments are subject to market risks."
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5f61c884-7e27-5779-9c3f-cd613778c9d7
  title: Demat & Trading Account — change-of-terms policy
  body: 'This document outlines the policy governing changes to the terms and conditions
    of your Demat & Trading Account. By maintaining an account with Tarang Invest,
    you agree to the following binding terms regarding fee and policy modifications.


    We reserve the right to modify our fee structure to ensure operational sustainability.
    This includes changes to the annual maintenance charge of ₹300, the DP Charges
    of ₹13.5 per sell transaction, or the intraday brokerage per order of ₹20. While
    we strive to maintain our ₹0 equity delivery brokerage, regulatory changes may
    necessitate adjustments.


    Notification of Change: We will provide notice of any material change to these
    terms at least 30 calendar days before the change takes effect. Notification will
    be sent via your registered email and may be displayed as a prominent notice within
    our digital interface.


    Acceptance of Terms: Your continued use of the account after the notice period
    expires constitutes your acceptance of the new terms. If you do not agree to the
    modified terms, you have the right to close your account. In such cases, you must
    ensure all outstanding dues are cleared and your holdings are transferred to another
    depository participant.


    Termination: Either party may terminate this agreement. Upon termination, Tarang
    Invest will process the transfer of shares from your demat account, subject to
    the applicable DP Charges of ₹13.5 per sell transaction/transfer. All closures
    are subject to SEBI and exchange frameworks to ensure investor protection.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5b3cd135-2e41-5710-8817-c4180d65352d
  title: Demat & Trading Account — getting started walkthrough
  body: "This walkthrough is designed for support agents to guide new users through\
    \ the onboarding and initial usage of the Demat & Trading Account. The goal is\
    \ to ensure a seamless transition from registration to their first trade.\n\n\
    Step 1: Onboarding & Verification\nAssist the user in completing the mandatory\
    \ e-KYC process. Verify that their PAN, Aadhaar, and bank account details are\
    \ correctly linked. Remind the user that multi-factor authentication (MFA) must\
    \ be configured before they can perform any fund withdrawals or portfolio changes.\n\
    \nStep 2: Funding the Account\nGuide the user to deposit funds into their trading\
    \ ledger. Explain that while there are no charges for depositing funds, the account\
    \ is subject to an annual maintenance charge of ₹300 to cover essential infrastructure.\n\
    \nStep 3: Understanding the Cost Structure\nEnsure the user understands our 'cost-visibility'\
    \ philosophy. Clearly state the following charges:\n- Equity Delivery Brokerage:\
    \ ₹0 (no cost for long-term investments).\n- Intraday Brokerage: ₹20 per order\
    \ for active trades closed within the same day.\n- DP Charges: ₹13.5 levied per\
    \ sell transaction for processing the transfer of shares from the demat account.\n\
    \nStep 4: Executing the First Trade\nHelp the user navigate to the trading terminal.\
    \ Explain the difference between a 'Delivery' order (₹0 brokerage) and an 'Intraday'\
    \ order (₹20 per order). \n\nStep 5: Compliance Reminder\nEnd the session by reminding\
    \ the user that all investments are subject to market risks and that Tarang Invest\
    \ provides educational resources but does not provide individualized financial\
    \ planning advice."
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 3bb17fe8-21f7-5354-909e-d5759f6889f3
  title: Demat & Trading Account — equity delivery brokerage explained
  body: 'Q: What is equity delivery brokerage, and how much does Tarang Invest charge
    for it?

    A: Equity delivery occurs when you buy shares and hold them in your demat account
    for more than one trading day. We believe in providing a foundational gateway
    for long-term wealth building, which is why we charge ₹0 equity delivery brokerage.
    This allows you to invest in companies for the long term without your returns
    being eroded by entry fees.


    Q: If delivery brokerage is ₹0, are there any other costs when I sell my shares?

    A: Yes. While the brokerage is ₹0, you will be charged DP Charges of ₹13.5 per
    sell transaction. These are depository participant charges levied for the operational
    process of transferring shares from your demat account. You can find a full breakdown
    in the Demat & Trading Account — fee schedule.


    Disclaimer: All investments in the equity market are subject to market risks.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: faq
  source_authority: official
  placeholder: true
