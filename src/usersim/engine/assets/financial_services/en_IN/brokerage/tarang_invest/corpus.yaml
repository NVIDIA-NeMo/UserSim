- id: 578389d1-10a8-54ff-bfc0-813e246fed88
  title: ELSS Tax-Saver Fund — choosing between tiers or options
  body: 'When deciding how to approach your tax savings, you may compare the ELSS
    Tax-Saver Fund against our other wealth-building tool, the Mutual Fund SIP.


    Comparison Dimensions:

    - Lock-in: The ELSS Tax-Saver Fund has a mandatory 3-year lock-in period. In contrast,
    a standard Mutual Fund SIP generally does not have a statutory lock-in, though
    it may have an Exit Load if redeemed within 365 days.

    - Tax Benefit: The ELSS Tax-Saver Fund allows for a deduction under Section 80C
    up to a cap of ₹150000. Standard Mutual Fund SIPs do not offer this specific tax
    deduction.

    - Entry Barrier: Both products are accessible, with the ELSS Tax-Saver Fund requiring
    a minimum investment of ₹500.


    Who should choose what?

    - Choose ELSS Tax-Saver Fund if your primary goal is reducing your taxable income
    under Section 80C and you are comfortable committing your capital for 3 years.

    - Choose Mutual Fund SIP if you require higher liquidity (the ability to withdraw
    funds sooner) and are focusing on long-term growth without the need for an immediate
    tax break.


    Disclaimer: Mutual fund investments are subject to market risks.'
