- id: 5710dae1-7d2c-507c-bf41-ef26c3613dd5
  title: ELSS Tax-Saver Fund — account agreement
  body: 'This agreement governs the investment in the ELSS Tax-Saver Fund through
    Tarang Invest.


    1. Investment Obligations: The investor agrees to a minimum investment of ₹500
    to initiate a position. Any investment intended for tax benefits under Section
    80C is subject to a maximum deduction cap of ₹150000 per financial year.


    2. Statutory Lock-in: By investing in this product, the investor acknowledges
    and accepts a mandatory lock-in period of 3 years from the date of investment.
    No withdrawals, redemptions, or transfers are permitted before the expiry of this
    3 years duration, as per SEBI and statutory frameworks.


    3. Verification and Security: All transactions, including the initial investment
    and eventual redemption after the lock-in, require successful Multi-factor authentication
    (MFA) and valid e-KYC. Tarang Invest reserves the right to block transactions
    if identity verification is not strictly enforced.


    4. Fees and Costs: Charges for this product follow our ''cost-visibility'' philosophy.
    All applicable fees are fixed to ensure operational sustainability. Any processing
    of shares or units from the demat account upon maturity will attract standard
    DP Charges.


    5. Termination: This agreement ends upon the full redemption of all units following
    the completion of the 3 years lock-in period. Tarang Invest may terminate the
    account if fraudulent activity is detected, adhering to our zero-tolerance fraud
    policy.


    6. Amendments: We may update these terms to align with SEBI or AMFI frameworks.
    Notice of such changes will be provided to the investor via registered email.'
