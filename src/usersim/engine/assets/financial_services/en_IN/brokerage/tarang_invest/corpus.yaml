- id: 12fc999f-84ea-5f1b-bc73-e84a762a67f5
  title: Demat & Trading Account — risk disclosures
  body: 'Investment in the securities market is subject to market risks. Read all
    related documents carefully before investing. Tarang Invest provides educational
    resources and product information but strictly defers individualized tax, legal,
    or financial planning advice. We do not project or guarantee returns on any investment.


    **Risk Factors associated with the Demat & Trading Account:**

    1. **Market Volatility:** The value of equity shares can fluctuate significantly.
    You may lose a portion or all of your invested capital.

    2. **Liquidity Risk:** Certain securities may become illiquid, making it difficult
    to sell them at the desired price.

    3. **Operational Costs:** While equity delivery brokerage is ₹0, users are still
    responsible for the annual maintenance charge of ₹300 and the DP Charge of ₹13.5
    per sell transaction. These costs must be factored into your overall investment
    strategy.

    4. **Intraday Leverage:** Trading on an intraday basis carries higher risk due
    to volatility. An intraday brokerage of ₹20 per order applies to these trades.


    **Regulatory Compliance:**

    Our operations are governed by the frameworks of SEBI, AMFI, NSE, and BSE. We
    prioritise investor protection and fair treatment. All account holders must undergo
    mandatory e-KYC and maintain Multi-factor authentication (MFA) to ensure the security
    of their holdings. Data privacy is handled in strict accordance with national
    regulatory norms.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: disclosure
  source_authority: official
  placeholder: true
