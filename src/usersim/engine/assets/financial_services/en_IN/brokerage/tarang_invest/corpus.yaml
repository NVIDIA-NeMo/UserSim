- id: 3e0ca0df-5498-523d-a3cd-08c9acd6f290
  title: ELSS Tax-Saver Fund — resolve a common request end-to-end
  body: 'This guide explains how to complete a tax-saving investment in the ELSS Tax-Saver
    Fund to ensure you meet your Section 80C goals for the financial year.


    Prerequisites:

    - A funded Tarang Invest account.

    - Completed e-KYC and active MFA.

    - Knowledge of your remaining limit under the ₹150000 Section 80C cap.


    Steps:

    1. Tell us the amount you wish to invest in the ELSS Tax-Saver Fund. Ensure this
    amount is at least ₹500, as this is the minimum investment required.

    2. Confirm whether this is a one-time (lumpsum) investment or if you wish to start
    a regular SIP.

    3. We will perform a security check via MFA. You will need to provide the authentication
    code sent to your registered device to authorise the fund movement.

    4. We will then process the investment and provide you with a confirmation of
    the units allocated and the NAV (Net Asset Value) applied.

    5. Request a ''Lock-in Schedule.'' We will provide a document stating the exact
    date your investment will unlock (exactly 3 years from the date of investment).

    6. Once the transaction is complete, ask for an updated ''Tax Contribution Statement''
    to see how this investment contributes toward your ₹150000 deduction cap.


    How you know it worked:

    You will receive a transaction confirmation, an updated portfolio view showing
    your ELSS holdings, and a statement confirming the investment date and the corresponding
    3 year unlock date.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 6613543c-d973-5279-9ced-fdb92356d8b3
  title: ELSS Tax-Saver Fund — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that their statement shows an incorrect investment
    amount, a missing transaction, or an incorrect lock-in expiry date for their ELSS
    Tax-Saver Fund.


    Likely Causes:

    1. Pending Settlement: The investment may have been made recently and is still
    in the settlement window, meaning units haven''t been credited yet.

    2. Multiple Folios: The customer may have investments across different folios
    that are not aggregated in the current view.

    3. Data Sync Lag: A temporary delay between the fund house and the Tarang Invest
    display interface.


    What to check in order:

    1. Verify Transaction Date: Check if the investment was made within the last 3-5
    business days. If so, inform the customer that units may take time to reflect.

    2. Cross-reference Amount: Check if the invested amount meets the minimum investment
    of ₹500. If a lower amount was attempted, the transaction may have failed.

    3. Validate Lock-in Date: Calculate exactly 3 years from the transaction date.
    If the statement shows a different date, it is a genuine discrepancy.

    4. Review MFA Logs: Ensure the transaction was successfully authenticated via
    MFA at the time of placement.


    How to fix:

    - For sync lags, trigger a manual refresh of the portfolio data from the backend.

    - For missing transactions, request the customer to provide the bank debit SMS
    or reference ID. We will then trace the funds with the AMC (Asset Management Company).


    When to escalate:

    If a financial discrepancy is confirmed (e.g., funds debited but units not credited),
    the agent must escalate the matter to the Grievance Redressal Officer. We will
    acknowledge the dispute within 24 hours and work to resolve the record discrepancy
    within 7-15 business days.'
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 322c7c92-e7df-5863-9fe3-93aacee6ec59
  title: Margin Trading Facility — overview
  body: "The Margin Trading Facility is a leverage tool for active traders to amplify\
    \ their buying power through pledged securities. By allowing you to borrow funds\
    \ against your existing holdings, we enable you to take larger positions in the\
    \ market than your available cash would otherwise permit.\n\nTo maintain a position\
    \ using this facility, we require a minimum margin of 25%. This means you must\
    \ provide 25% of the total trade value as collateral, while we provide the remaining\
    \ funding.\n\nTransparency in costs is central to our philosophy. The funding\
    \ provided under this facility carries an annual interest rate of 14.99%. Additionally,\
    \ for the processing of collateral, a pledge charge per scrip of ₹20 is applicable.\
    \ \n\nThis facility is designed for traders who have a high conviction in their\
    \ strategy and the capacity to manage the associated risks. Please note that while\
    \ leverage can amplify gains, it can also amplify losses. \n\n***Disclaimer: Investments\
    \ in the securities market are subject to market risks. Read all related documents\
    \ carefully before investing.***\n\nFor more detailed information on how this\
    \ compares to standard equity delivery, you may refer to Demat & Trading Account\
    \ — overview."
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 217b6039-61b6-5281-90aa-d6f2eff610bb
  title: Margin Trading Facility — interest rate annual explained
  body: 'Q: How is the interest calculated on my Margin Trading Facility?


    A: We apply an annual interest rate of 14.99% on the amount funded by Tarang Invest.
    Interest is calculated on a daily basis based on the outstanding borrowed amount
    and is debited from your account periodically. This ensures you only pay for the
    exact duration and amount of the leverage you utilize.


    Q: Does the interest rate change based on the amount I borrow?


    A: No, we maintain a flat annual interest rate of 14.99% for all users of the
    Margin Trading Facility to ensure cost-visibility and fairness across our trading
    community.


    Q: Where can I see the total interest accrued on my positions?


    A: You can track your accrued interest and total outstanding liability through
    your portfolio dashboard. For a full breakdown of all associated costs, please
    refer to Margin Trading Facility — fee schedule.'
  domain: brokerage_investing
