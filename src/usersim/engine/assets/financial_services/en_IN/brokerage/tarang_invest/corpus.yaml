- id: abc61e8f-5587-5a15-8b35-b8a76dc5c808
  title: Mutual Fund SIP — a discrepancy in your records or statement
  body: 'This guide assists support agents in resolving cases where a customer reports
    a mismatch between their expected SIP balance and the actual statement.


    Symptom: Customer claims a monthly installment was deducted from their bank but
    is not reflecting in their Mutual Fund SIP unit balance.


    Likely Causes:

    1. Settlement Lag: Mutual fund units are not credited instantly. There is a standard
    time window for the fund house to allot units after the money is received.

    2. Exit Load Deduction: The customer may be looking at the redemption value and
    noticing it is lower than the principal due to the 1% exit load applied to units
    held for less than 365 days.

    3. Failed Mandate: The bank may have debited the amount, but the transaction failed
    at the fund house level, leading to a pending refund.


    What to check in order:

    1. Transaction Date: Check if the deduction occurred within the last 3-5 business
    days. If yes, explain the settlement lag.

    2. Redemption History: Check if the customer recently withdrew funds. Verify if
    any units were redeemed within 365 days, triggering the 1% exit load.

    3. Bank Confirmation: Verify the transaction status from the fund house''s end
    to see if the payment is ''Pending'' or ''Rejected''.


    How to fix it:

    - For settlement lags, provide the customer with the expected date of unit allotment.

    - For exit load queries, provide a detailed breakdown showing the 1% charge applied
    to the specific units.

    - For failed mandates, initiate the reconciliation process to track the refund
    from the fund house to the customer''s bank.


    When we escalate:

    If the funds are missing and the fund house cannot locate the transaction, we
    will escalate the matter to our Compliance Officer or Grievance Redressal Officer.
    We acknowledge such disputes within 24 hours and aim for resolution within 7-15
    business days.


    ***Disclaimer: Mutual fund investments are subject to market risks; read all scheme
    related documents carefully.***'
