- id: d1948332-8ee5-5fae-97c6-fa466a9572ce
  title: Margin Trading Facility — vs. a typical competitor offering
  body: 'When comparing Tarang Invest''s Margin Trading Facility to typical competitor
    offerings in the Indian market, the primary differences lie in cost-visibility
    and transparency.


    Typical Competitors often use floating interest rates or hidden ''processing fees''
    that are not clearly stated upfront. In contrast, we maintain a fixed annual interest
    rate of 14.99% and a transparent pledge charge of ₹20 per scrip, ensuring you
    know exactly what your leverage costs.


    While some competitors may offer slightly different minimum margin requirements,
    our standard minimum margin of 25% is designed to balance buying power with risk
    management for the retail investor.


    Who should choose what?

    - Choose Tarang Invest if you value a lean cost structure, zero-brokerage delivery
    (as detailed in Demat & Trading Account — faq_3), and clear, fixed rates without
    hidden surprises.

    - A competitor may be preferable if they offer a specific temporary promotional
    rate for a very short window, though these often revert to higher costs later.'
