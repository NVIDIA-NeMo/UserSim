- id: 1c87fb8a-0496-5a56-a95a-bad8c7ff3ccd
  title: When to use start_sip
  body: 'The `start_sip` tool is used to establish a Systematic Investment Plan for
    a customer, enabling a disciplined method of investing a fixed sum regularly in
    a mutual fund. This is a state-changing action that modifies the customer''s financial
    commitments.


    **Usage Scenarios:**

    - When a customer wants to start a new monthly investment in a specific mutual
    fund.

    - When a customer expresses interest in the ''Mutual Fund SIP'' product for long-term
    wealth building.


    **Procedure:**


    1. **Identity Verification**: Because this is a state-changing action, MFA (Multi-Factor
    Authentication) must be active. Call `verify_identity` to ensure the customer
    is authorised to make changes to their portfolio.

    2. **Account Resolution**: Use `get_accounts` to identify the correct `account_id`
    for the customer.

    3. **Collect SIP Details**: Gather the necessary parameters from the customer,
    including the mutual fund identifier, the fixed amount to be invested per instalment,
    and the preferred frequency/date.

    4. **Execute SIP Setup**: Call the `start_sip` tool with the required parameters
    to activate the plan.

    5. **Confirmation**: Inform the customer that the SIP has been successfully scheduled.
    Remind the customer that mutual fund investments are subject to market risks.


    **Compliance Requirements:**

    - Agents must not suggest specific funds or project guaranteed returns. Provide
    educational information about the fund but defer financial planning to a professional.

    - Ensure the customer is aware of the potential for an Exit Load if units are
    redeemed within 365 days.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - start_sip
  institution_id: tarang_invest
- id: a2bfed3b-18d7-5636-b5e7-dc49eb4e0583
  title: start_sip tool reference
  body: 'The `start_sip` tool is used to create and activate a new Systematic Investment
    Plan for a customer.


    **Tool Signature:**

    `start_sip(account_id: string, fund_id: string, amount: number, frequency: string,
    start_date: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `fund_id`: The identifier for the chosen mutual fund.

    - `amount`: The fixed sum to be invested in each interval (e.g., ₹500).

    - `frequency`: The interval of investment (e.g., ''monthly'').

    - `start_date`: The date the first instalment should be processed.


    **Effect:**

    This is a state-changing operation. It sets up a recurring instruction to invest
    the specified amount into the chosen fund from the customer''s linked account.


    **Execution:**

    The agent performs this action by calling the tool directly. This requires mandatory
    MFA and e-KYC verification before the tool can be executed.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - start_sip
  institution_id: tarang_invest
- id: c149bc57-337b-5ff8-b22a-10e5704b2428
  title: When to use redeem_mutual_fund
  body: 'The `redeem_mutual_fund` tool is used to process the sale of mutual fund
    units from a customer''s portfolio, converting those holdings back into cash.


    **Usage Scenarios:**

    - When a customer requests to withdraw their money from a mutual fund.

    - When a customer wants to sell a specific portion of their mutual fund units.


    **Procedure:**


    1. **Verify Identity**: This is a state-changing action. Execute `verify_identity`
    to ensure the customer is authenticated via MFA.

    2. **Account Resolution**: Call `get_accounts` to retrieve the correct `account_id`.

    3. **Check Positions**: Use `get_positions` to verify that the customer actually
    holds units of the mutual fund they wish to redeem.

    4. **Determine Redemption Amount**: Confirm with the customer whether they wish
    to redeem all units or a specific amount/number of units.

    5. **Execute Redemption**: Call the `redeem_mutual_fund` tool with the `account_id`,
    `fund_id`, and the amount/units to be redeemed.

    6. **Final Confirmation**: Notify the customer that the redemption request has
    been initiated.


    **Important Compliance Checks:**

    - **Lock-in Periods**: If the fund is an ELSS Tax-Saver Fund, the agent must verify
    if the mandatory 3-year statutory lock-in period has passed. Redemption is not
    possible before this period ends.

    - **Exit Load**: Inform the customer that if they redeem units within 365 days
    of investment, an Exit Load may be applicable.

    - **Risk Reminder**: Remind the customer that the final redemption value depends
    on the current Net Asset Value (NAV), as mutual funds are subject to market risks.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - redeem_mutual_fund
  institution_id: tarang_invest
- id: f5613199-2636-5643-b50b-fd785ab2b5da
  title: redeem_mutual_fund tool reference
  body: 'The `redeem_mutual_fund` tool is used to initiate the redemption of units
    from a mutual fund investment.


    **Tool Signature:**

    `redeem_mutual_fund(account_id: string, fund_id: string, amount: number, units:
    number)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `fund_id`: The identifier for the mutual fund to be redeemed.

    - `amount`: The specific monetary value to be redeemed (optional if units are
    specified).

    - `units`: The number of units to be sold (optional if amount is specified).


    **Effect:**

    This is a state-changing operation. It triggers the sale of the specified mutual
    fund holdings. The resulting funds are credited to the customer''s linked bank
    account after processing.


    **Execution:**

    The agent performs this action by calling the tool directly. Mandatory identity
    verification (MFA) must be completed before this tool can be used.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - redeem_mutual_fund
  institution_id: tarang_invest
- id: 2f3d1d8b-36c6-5346-a031-3d129115589b
  title: When to use initiate_dis
  body: 'The `initiate_dis` tool is used to start a formal dispute resolution process
    for customers who have encountered unauthorised transactions, fraud, or billing
    discrepancies.


    **Usage Scenarios:**

    - When a customer reports a transaction they did not authorise.

    - When a customer disputes a fee or charge appearing on their statement.

    - When a customer reports a failure in a fund transfer or redemption that has
    not been resolved through standard support.


    **Procedure:**


    1. **Identity Verification**: Call `verify_identity` to ensure the request is
    coming from the legitimate account holder.

    2. **Gather Evidence**: Collect the transaction ID, the date of the incident,
    the amount in question, and a clear description of the discrepancy from the customer.

    3. **Initiate Dispute**: Call the `initiate_dis` tool with the customer''s `account_id`
    and the detailed dispute information.

    4. **Set Expectations**: Inform the customer that Tarang Invest has a zero-tolerance
    policy towards fraud. Advise them that their query will be acknowledged within
    24 hours.

    5. **Timeline Disclosure**: Clearly state that most disputes are resolved within
    a standard 7-15 business day window.


    **Escalation Path:**

    If the issue cannot be resolved by frontline support, the dispute is escalated
    to the Compliance Officer or the Grievance Redressal Officer to ensure a fair
    and transparent resolution in accordance with SEBI and AMFI guidelines.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_dis
  institution_id: tarang_invest
- id: 220cc52e-04d7-5219-9e34-1a70cd347c3b
  title: initiate_dis tool reference
  body: 'The `initiate_dis` tool is used by the agent to formally lodge a dispute
    regarding a transaction or a fee on behalf of a customer. This action initiates
    our structured dispute resolution process, which adheres to our zero-tolerance
    policy towards fraud.


    **Tool Signature:** `initiate_dis(account_id: string, transaction_id: string,
    dispute_reason: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account where the disputed
    transaction occurred.

    - `transaction_id`: The specific identifier of the transaction being contested.

    - `dispute_reason`: A detailed explanation of why the customer is disputing the
    charge or transaction.


    **Effect:**

    Calling this tool creates a formal dispute ticket in the system. Once initiated,
    we acknowledge most queries within 24 hours and aim for resolution within a standard
    7-15 business day window. The agent performs this action by calling the tool directly
    within the conversation; the customer is not required to submit a separate external
    form.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_dis
  institution_id: tarang_invest
- id: 93bb1d4a-62b5-5de5-b742-c5ea215add91
  title: When to use get_accounts
  body: 'To maintain strict data privacy and security, agents must never guess or
    assume account identifiers. The `get_accounts` tool is the authoritative mechanism
    for retrieving the correct `account_id` associated with a customer''s profile
    before performing any state-changing action.


    **Procedure for Account Identification:**

    1. **Verify Identity:** Perform mandatory multi-factor authentication (MFA) and
    e-KYC verification to ensure the requester is the authorised account holder.

    2. **Request Identifier:** Ask the customer for a known identifier, such as the
    last 4 digits of their account number or their registered mobile number.

    3. **Execute Retrieval:** Call the `get_accounts` tool using the provided identifier
    to retrieve the full, system-valid `account_id` and the list of products held
    (e.g., Demat & Trading Account or Mutual Fund SIP).

    4. **Confirm Match:** Verify that the retrieved account details match the customer''s
    identity before proceeding with further requests.


    This step is mandatory for all subsequent tool calls that require an `account_id`.
    By using `get_accounts` first, we ensure that funds, portfolio changes, or personal
    information are accessed only for the verified owner, adhering to SEBI and AMFI
    frameworks for investor protection.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tarang_invest
- id: 4addd16c-5395-5a7d-8227-f3384bb309e7
  title: get_accounts tool reference
  body: 'The `get_accounts` tool allows the agent to retrieve a list of all accounts
    and their associated IDs for a specific customer. This is a read-only operation
    essential for resolving account identifiers before performing any transactions.


    **Tool Signature:** `get_accounts()`


    **Arguments:**


    The tool takes no arguments; it acts on the verified customer in this conversation.


    **Effect:**

    The tool returns a list of all active and inactive accounts held by the customer,
    including the `account_id` and the product type (e.g., `demat_trading_account`).
    The agent performs this action by calling the tool directly. This is the primary
    method for the agent to map a customer''s spoken account reference (like ''my
    trading account'') to the specific ID required by other system tools.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tarang_invest
- id: 3e104480-fb83-553f-acb5-ad5b66921940
  title: When to use open_account
  body: 'We aim to make the onboarding process for our retail investors as seamless
    as possible. The `open_account` tool is used when a customer wishes to start a
    new investment journey with Tarang Invest, whether for active trading or long-term
    wealth building.


    **Procedure for Opening an Account:**

    1. **Eligibility Check:** Confirm the customer meets the basic eligibility requirements
    for the chosen product (e.g., a Demat & Trading Account or an ELSS Tax-Saver Fund).

    2. **Identity Verification:** Complete the mandatory e-KYC process. The agent
    must ensure all identity documents are verified to prevent unauthorised account
    access.

    3. **Product Selection:** Confirm which product the customer wishes to open. Options
    include our zero-brokerage delivery account or specific mutual fund tools.

    4. **Execute Opening:** Call the `open_account` tool with the customer''s verified
    details and the selected `product_id`.


    **Compliance Note:**

    Agents must remind the customer that all investments are subject to market risks.
    We provide educational resources and product information but strictly defer individualized
    tax, legal, or financial planning advice. Once the `open_account` tool is successfully
    called, the account is provisioned in the system, and the customer can proceed
    to deposit funds.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tarang_invest
- id: 479442db-d525-59cc-a9cd-e91518f0f044
  title: open_account tool reference
  body: 'The `open_account` tool is a state-changing operation used to create a new
    investment account for a verified customer.


    **Tool Signature:** `open_account(product_id: string, details: object)`


    **Arguments:**

    - `product_id`: The ID of the product to be opened (e.g., `demat_trading_account`,
    `mutual_fund_sip`, `elss_tax_saver`, or `margin_trading_facility`).

    - `details`: An object containing necessary account configuration and KYC markers.


    **Effect:**

    Calling this tool triggers the backend provisioning of the specified investment
    product. The agent performs this action directly in the conversation after MFA
    and e-KYC are completed. A successful call results in the creation of a new `account_id`
    for the customer.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tarang_invest
- id: 1ad4c6b5-cd3a-5236-9793-2a07b9ba09e1
  title: When to use close_account
  body: 'Closing an account is an irreversible action. We must ensure that all regulatory
    obligations are met and that the customer is fully aware of the consequences before
    proceeding with the `close_account` tool.


    **Procedure for Account Closure:**

    1. **Verify Identity:** Mandatory multi-factor authentication (MFA) must be completed.
    Due to the irreversible nature of this action, identity verification is strictly
    enforced.

    2. **Resolve Balance:** Use `get_accounts` to find the `account_id` and ensure
    that the account balance is ₹0. Any remaining funds must be withdrawn via `withdraw_funds`
    first.

    3. **Clear Obligations:** Ensure there are no pending trades, open positions,
    or outstanding DP charges. For Mutual Fund SIPs, ensure no active mandates are
    pending.

    4. **Final Confirmation:** Explicitly confirm with the customer that they wish
    to permanently close the account.

    5. **Execute Closure:** Call the `close_account` tool using the `account_id`.


    **Warning:**

    Once the `close_account` tool is called, the account cannot be reopened. Agents
    must inform the customer that any historical statements should be downloaded via
    `get_statements` prior to closure, as access will be revoked immediately upon
    successful execution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tarang_invest
- id: 4f67e99b-ccfa-5ae0-ad38-99e57ef96c7d
  title: close_account tool reference
  body: 'The `close_account` tool is an irreversible, state-changing operation that
    permanently shuts down a customer''s specific investment account.


    **Tool Signature:** `close_account(account_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account to be closed.


    **Effect:**

    Executing this tool terminates the account and prevents any further transactions
    or access to that specific account''s features. The agent performs this action
    by calling the tool directly after strict MFA and identity verification. Because
    this is an irreversible action, it should only be called after the agent has confirmed
    the account balance is ₹0 and all positions are closed.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tarang_invest
- id: a4824c82-85cf-5bae-a7b8-34e501bca55a
  title: When to use update_contact_info
  body: 'Maintaining accurate contact information is critical for regulatory compliance
    and the delivery of essential statements. The `update_contact_info` tool is used
    to modify a customer''s registered communication details.


    **Procedure for Updating Contact Information:**

    1. **Verify Identity:** The agent must perform mandatory multi-factor authentication
    (MFA) to prevent unauthorised account access and identity theft.

    2. **Collect New Details:** Obtain the updated information (e.g., new mobile number,
    email address, or residential address) from the customer.

    3. **Validate Format:** Ensure the provided details are in the correct format
    (e.g., valid Indian mobile number) to avoid system errors.

    4. **Execute Update:** Call the `update_contact_info` tool with the new data fields.

    5. **Confirm Change:** Notify the customer that the changes have been applied
    and that a confirmation notice will be sent to both the old and new contact points
    for security.


    This process ensures we adhere to strict data privacy norms and SEBI guidelines
    regarding the maintenance of client records. Any changes to primary contact details
    may trigger a temporary hold on certain state-changing actions as a security precaution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tarang_invest
- id: 451bce65-5eaf-534e-9fe2-7395be08e5b4
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool is a state-changing operation used to modify
    the personal contact details of a customer in our records.


    **Tool Signature:** `update_contact_info(contact_fields: object)`


    **Arguments:**

    - `contact_fields`: An object containing the specific fields to be updated (e.g.,
    `email`, `phone_number`, `address`).


    **Effect:**

    Calling this tool updates the customer''s profile in the central database. The
    agent performs this action by calling the tool directly after the customer has
    passed mandatory MFA. This ensures that all future communications, including regulatory
    notices and account statements, are sent to the correct destination.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tarang_invest
- id: 243d2b8b-acc7-5c0b-b1ed-b277017cd636
  title: When to use get_statements
  body: 'Transparency is a core pillar of Tarang Invest. We provide customers with
    clear access to their transaction history and holding statements. The `get_statements`
    tool is the authoritative way for agents to retrieve these documents for the customer.


    **Procedure for Retrieving Statements:**

    1. **Verify Identity:** Perform mandatory MFA and e-KYC to ensure the requester
    is authorised to view the account''s financial data.

    2. **Identify Account:** Use `get_accounts` to resolve the correct `account_id`
    if the customer has multiple products.

    3. **Define Scope:** Determine the type of statement required (e.g., monthly,
    quarterly, or annual) and the specific date range requested by the customer.

    4. **Execute Retrieval:** Call the `get_statements` tool using the `account_id`,
    the statement type, and the date range.

    5. **Deliver Document:** Provide the retrieved statement to the customer via the
    approved digital channel.


    Agents should encourage customers to review these statements to ensure all charges,
    such as DP charges on sell transactions or Exit Loads on mutual fund redemptions,
    are clearly understood. If a customer notices a discrepancy in their records,
    they should be guided toward the process described in the dispute resolution framework,
    where most queries are resolved within 7-15 business days.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: tarang_invest
- id: aaa1893f-9ebe-5658-ad35-fbf15655be8d
  title: get_statements tool reference
  body: 'The get_statements tool allows the agent to retrieve official account statements
    for a customer. This tool is used to provide transaction histories, holding reports,
    or tax-related statements directly within the conversation.


    **Tool Signature:**

    `get_statements(account_id: string, statement_type: string, period: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `statement_type`: The category of statement requested (e.g., ''transaction'',
    ''holding'', ''tax'').

    - `period`: The time frame for the statement (e.g., ''monthly'', ''quarterly'',
    ''annual'').


    **Effect:**

    Retrieves the requested document in a readable format. The agent performs this
    action by calling the tool directly after the customer''s identity has been verified
    via MFA; the agent does not redirect the customer to an external portal for these
    documents.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: tarang_invest
- id: f42b341e-cabc-526d-9a49-c7980943def8
  title: When to use update_beneficiary
  body: 'At Tarang Invest, we ensure that your assets are protected and transitioned
    according to your wishes. Updating a nominee or beneficiary is a critical account
    maintenance task that must be handled with strict security protocols to prevent
    unauthorised changes to account ownership rights.


    **Policy Guidelines:**

    Beneficiary updates are permitted for all account types, including the Demat &
    Trading Account and Mutual Fund SIP. Because this is a state-changing action,
    we mandate multi-factor authentication (MFA) and e-KYC verification before any
    changes are processed. We do not provide legal advice on estate planning; we simply
    execute the update as requested by the verified account holder.


    **Agent Procedure:**

    1. Use get_accounts to resolve the customer''s full account_id using their provided
    last-4 digits or registered mobile number.

    2. Initiate the mandatory identity verification process via verify_identity to
    ensure the request is authentic.

    3. Collect the new beneficiary''s full name, relationship to the account holder,
    and date of birth.

    4. Confirm the details with the customer to ensure accuracy.

    5. Call the update_beneficiary tool to commit the changes to the system.


    All updates are processed in real-time upon successful tool execution. If the
    customer encounters an error during this process, please refer them to Demat &
    Trading Account — a failed or pending action.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: tarang_invest
- id: 5bbeacff-a91d-50ae-a8a3-ca542b4491ba
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool is used to modify the nominee details associated
    with a customer''s investment account. This is a state-changing action that requires
    prior identity verification.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: object)`


    **Arguments:**

    - `account_id`: The unique identifier of the account being updated.

    - `beneficiary_details`: An object containing the new nominee''s full name, relationship,
    and age/date of birth.


    **Effect:**

    Updates the legal nominee on record for the specified account. The agent performs
    this action by calling the tool directly in the chat interface. Once executed,
    the system logs the change for compliance purposes in accordance with SEBI frameworks.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: tarang_invest
- id: 4e535408-b812-5f13-a248-aa1effe78d6a
  title: When to use set_alerts
  body: 'Tarang Invest provides robust notification tools to help our traders and
    investors stay informed about their portfolios without needing to monitor screens
    constantly. We encourage the use of alerts to maintain disciplined trading and
    investment habits.


    **Policy Guidelines:**

    Customers may set alerts for price movements, deposit confirmations, or SIP due
    dates. Alerts are provided as a convenience and do not constitute financial advice
    or guaranteed triggers for trade execution. We maintain a standard of transparency;
    while alerts notify you of market conditions, they do not guarantee specific returns.
    All alerts are subject to the data privacy norms we adhere to for investor protection.


    **Agent Procedure:**

    1. Use get_accounts to identify the specific account_id for which the alert is
    being set.

    2. Verify the customer''s identity using verify_identity to ensure the alert is
    being set on the correct profile.

    3. Determine the trigger condition (e.g., a specific stock price for a Demat &
    Trading Account or a payment date for a Mutual Fund SIP).

    4. Identify the preferred notification channel (Email, SMS, or Push Notification).

    5. Call the set_alerts tool to activate the notification.


    If a customer wishes to change their contact details to receive these alerts,
    the agent should first follow the process outlined in the update_contact_info
    tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: tarang_invest
- id: 441f3c4b-1f8c-5669-bbeb-4740610d383a
  title: set_alerts tool reference
  body: 'The set_alerts tool enables the agent to configure automated notifications
    for a customer based on specific account or market triggers.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_type: string, trigger_value: string, channel:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `alert_type`: The type of alert (e.g., ''price_threshold'', ''balance_low'',
    ''sip_reminder'').

    - `trigger_value`: The specific value or date that triggers the alert.

    - `channel`: The delivery method (e.g., ''sms'', ''email'', ''app_push'').


    **Effect:**

    Schedules an automated notification in the system. The agent performs this action
    by calling the tool directly. This is a state-changing action and requires the
    agent to have verified the user''s identity previously in the session.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: tarang_invest
- id: fbf87ce2-fe3d-5d7d-a79c-bab90a0a42fc
  title: When to use transfer_funds
  body: 'Managing capital flow efficiently is essential for active traders and long-term
    investors. We provide a streamlined process for moving funds between internal
    accounts or towards external verified bank accounts, ensuring cost-visibility
    and operational sustainability.


    **Policy Guidelines:**

    Fund transfers are state-changing actions and are treated with the highest security
    priority. We enforce mandatory multi-factor authentication (MFA) and e-KYC for
    all transfer requests. To prevent fraud, transfers can only be made to bank accounts
    that have been previously verified and linked to the customer''s profile. We maintain
    a zero-tolerance policy towards fraud; any suspicious transfer patterns will be
    flagged for review by our Compliance Officer.


    **Agent Procedure:**

    1. Use get_accounts to resolve the account_id from which the funds will be debited.

    2. Use verify_identity to complete the mandatory security check.

    3. Confirm the exact amount to be transferred and the destination account details.

    4. Verify that the available balance is sufficient to cover the transfer and any
    applicable regulatory charges.

    5. Call the transfer_funds tool to execute the movement of capital.


    Most transfer queries are acknowledged within 24 hours. If a transfer is disputed,
    it will be handled via our structured dispute resolution process and resolved
    within a standard 7-15 business day window. For more on account-specific costs,
    see Institution-wide fees and charges.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: tarang_invest
- id: b833b593-b2bc-50e3-9f6b-864a4fc1ca3f
  title: transfer_funds tool reference
  body: 'The transfer_funds tool is used to move money from one account to another,
    either internally between Tarang Invest accounts or externally to a linked bank
    account.


    **Tool Signature:**

    `transfer_funds(source_account_id: string, destination_account_id: string, amount:
    number, currency: string)`


    **Arguments:**

    - `source_account_id`: The ID of the account the funds are leaving.

    - `destination_account_id`: The ID of the receiving account.

    - `amount`: The total sum of money to be moved.

    - `currency`: The currency of the transfer (e.g., ''INR'').


    **Effect:**

    Initiates the movement of funds. The agent performs this action by calling the
    tool directly. This is a state-changing action; therefore, the agent must ensure
    verify_identity has been successfully completed before calling this tool.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: tarang_invest
- id: b43f0896-8b83-55f3-8121-5df2c940ea57
  title: When to use cancel_order
  body: 'In the fast-moving Indian markets, the ability to quickly revoke an order
    is vital for risk management. We provide our users with the tools to cancel pending
    orders to avoid unintended executions.


    **Policy Guidelines:**

    Orders can only be cancelled if they have not yet been executed or matched on
    the exchange (NSE/BSE). Once an order is ''Filled'' or ''Partially Filled'', the
    remaining quantity may be cancelled, but the executed portion cannot be reversed.
    All order management is steered by SEBI and exchange frameworks to ensure fair
    treatment of all market participants.


    **Agent Procedure:**

    1. Use get_accounts to identify the customer''s trading account_id.

    2. Use get_order_status to find the specific order_id that needs to be cancelled
    and confirm it is still in a ''Pending'' or ''Open'' state.

    3. Perform a verify_identity check to ensure the request is coming from the authorised
    account holder.

    4. Confirm with the customer the specific order details (asset, quantity, and
    price) to avoid cancelling the wrong trade.

    5. Call the cancel_order tool to request the revocation of the order from the
    exchange.


    If the tool returns a failure because the order was executed milliseconds before
    the request, the agent should inform the customer that the trade is now complete
    and cannot be cancelled. For further tracking, refer to Demat & Trading Account
    — check status or history.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: tarang_invest
- id: ecabe9ed-17e0-5abb-95ae-c8aaf729c8c3
  title: cancel_order tool reference
  body: 'The cancel_order tool is used to revoke a pending order that has not yet
    been executed on the exchange.


    **Tool Signature:**

    `cancel_order(order_id: string, account_id: string)`


    **Arguments:**

    - `order_id`: The unique identifier of the order to be cancelled.

    - `account_id`: The unique identifier of the trading account associated with the
    order.


    **Effect:**

    Sends a cancellation request to the exchange. The agent performs this action by
    calling the tool directly. If the order is already filled, the tool will return
    an error indicating the order cannot be cancelled. This is a state-changing action
    requiring prior identity verification.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: tarang_invest
- id: 30406061-e88b-5918-898d-79933f1ea0f9
  title: When to use get_order_status
  body: 'Transparency in trade execution is a cornerstone of our service. We provide
    real-time visibility into the lifecycle of every order, from the moment it is
    placed until it is settled or cancelled.


    **Policy Guidelines:**

    Order status information is considered sensitive account data. While it does not
    change the state of the account, it provides critical information about holdings
    and capital commitment. We adhere to strict data privacy norms, ensuring that
    order details are only disclosed to the verified account holder or their legally
    authorised representatives.


    **Agent Procedure:**

    1. Use get_accounts to resolve the trading account_id from the customer''s provided
    details.

    2. Use verify_identity to confirm the customer''s identity before disclosing any
    order details.

    3. If the customer provides a specific order_id, use that to fetch the precise
    status. If not, the agent can retrieve the most recent order history.

    4. Call the get_order_status tool to retrieve the current state (e.g., Pending,
    Executed, Cancelled, or Rejected).

    5. Explain the status to the customer in accessible language, avoiding excessive
    jargon.


    If an order is ''Rejected'', the agent should explain the likely reason (e.g.,
    insufficient funds or incorrect price band) and guide the customer on how to rectify
    it. For detailed steps on managing these events, see Demat & Trading Account —
    a failed or pending action.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: tarang_invest
- id: 2a8b4cf3-6453-5c0f-a276-28aa7b5fd0cb
  title: get_order_status tool reference
  body: 'The `get_order_status` tool allows the agent to retrieve the real-time execution
    state of a specific trade order placed by the client. The agent performs this
    action by calling the tool directly within the conversation to provide the customer
    with immediate clarity on their transaction.


    **Tool Signature:**

    `get_order_status(order_id: string)`


    **Arguments:**

    - `order_id`: The unique identifier of the order being queried.


    **Effect:**

    Returns the current status of the order (e.g., Pending, Executed, Cancelled, or
    Rejected). This tool is a read-only operation and does not modify the state of
    the order or the account balance. It is primarily used to resolve queries regarding
    whether a buy or sell instruction has been processed by the exchange.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: tarang_invest
- id: 25b61d87-923c-55f1-97cf-be0013a08fce
  title: When to use deposit_funds
  body: 'We use the `deposit_funds` procedure when a client wishes to add capital
    to their trading or investment account to enable new purchases or meet margin
    requirements. At Tarang Invest, we ensure a transparent process where funds are
    credited to the account to support the client''s investment goals.


    **Procedure:**

    1. **Identity Verification**: The agent must first verify the client''s identity
    using mandatory multi-factor authentication (MFA) and e-KYC protocols.

    2. **Account Identification**: Use `get_accounts` to resolve the correct `account_id`
    based on the client''s provided details (such as the last four digits of the account).

    3. **Amount Confirmation**: Confirm the exact amount in ₹ the client intends to
    deposit and the source of funds to ensure compliance with SEBI and AML guidelines.

    4. **Execution**: Once details are confirmed, the agent calls the `deposit_funds`
    tool to initiate the transfer of capital into the client''s account.

    5. **Confirmation**: Inform the client that the deposit has been initiated and
    provide the expected timeline for the funds to reflect in their available balance.


    All deposits are handled according to our strict data privacy norms. For detailed
    steps on monitoring these transactions, refer to Demat & Trading Account — check
    status or history.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: tarang_invest
- id: d5f1a612-4d91-566b-a401-cd83cf973f1e
  title: deposit_funds tool reference
  body: 'The `deposit_funds` tool is used to credit a specified amount of money into
    a client''s account. The agent performs this action by calling the tool directly
    to facilitate the movement of funds from the client''s linked bank account to
    their brokerage account.


    **Tool Signature:**

    `deposit_funds(account_id: string, amount: number, currency: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account receiving the funds.

    - `amount`: The numeric value of the deposit.

    - `currency`: The currency code (must be ''INR'' for ₹).


    **Effect:**

    Initiates a state-changing transaction that increases the available cash balance
    of the specified account. This action requires prior identity verification via
    MFA to prevent unauthorised account access.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: tarang_invest
- id: ba26cd38-5405-512c-93d2-94441bd27827
  title: When to use withdraw_funds
  body: 'The `withdraw_funds` procedure is utilised when a client requests to move
    their available cash balance from their Tarang Invest account back to their verified
    bank account. Because this is an irreversible action, we maintain rigorous security
    checks to protect client assets.


    **Procedure:**

    1. **Identity Verification**: Due to the irreversible nature of withdrawals, the
    agent must strictly enforce identity verification using multi-factor authentication
    (MFA) and e-KYC.

    2. **Account Identification**: Use `get_accounts` to identify the correct `account_id`
    associated with the client.

    3. **Balance Check**: Verify that the client has sufficient ''withdrawable'' funds.
    The agent must ensure that funds are not locked due to pending settlements or
    margin requirements.

    4. **Amount and Destination**: Confirm the exact amount in ₹ to be withdrawn and
    verify that the destination bank account matches the verified records on file.

    5. **Execution**: Call the `withdraw_funds` tool to trigger the payout process.

    6. **Final Notification**: Advise the client that the request is being processed.
    In case of any issues, queries are typically acknowledged within 24 hours and
    resolved within a standard 7-15 business day window.


    For more information on account security, see Demat & Trading Account — account
    security best practices.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: tarang_invest
- id: 6bb27240-b096-52da-ad3f-3ad75c942f6d
  title: withdraw_funds tool reference
  body: 'The `withdraw_funds` tool facilitates the transfer of cash from a client''s
    Tarang Invest account to their registered bank account. The agent performs this
    action by calling the tool directly after all security clearances are met.


    **Tool Signature:**

    `withdraw_funds(account_id: string, amount: number, currency: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account from which funds are being
    withdrawn.

    - `amount`: The numeric value of the withdrawal.

    - `currency`: The currency code (must be ''INR'' for ₹).


    **Effect:**

    This is an irreversible state-changing operation that reduces the available balance
    of the account. It triggers the payout workflow to the client''s verified bank
    account. MFA is mandatory before this tool can be executed.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: tarang_invest
- id: 5ed1fa31-79ab-5070-8de7-7f86bcbe27a4
  title: When to use manage_authorized_users
  body: 'We use the `manage_authorized_users` procedure to allow the primary account
    holder to grant or revoke access permissions for other individuals. This ensures
    that while account management can be shared, it remains under the strict control
    of the primary owner in accordance with our security and verification norms.


    **Procedure:**

    1. **Primary Identity Verification**: The agent must verify the identity of the
    primary account holder using multi-factor authentication (MFA) and e-KYC. Access
    permissions cannot be modified by a non-primary user.

    2. **Account Identification**: Use `get_accounts` to resolve the `account_id`
    for the primary holder.

    3. **Action Specification**: Determine if the client wishes to add a new authorised
    user or remove an existing one. If adding, collect the necessary identification
    details for the new user.

    4. **Permission Level**: Confirm the scope of access being granted (e.g., read-only
    vs. transaction-capable) to prevent unauthorised account access.

    5. **Execution**: The agent calls the `manage_authorized_users` tool to update
    the access control list associated with the account.

    6. **Audit Notification**: Confirm to the primary holder that the changes have
    been applied and that a notification has been sent to all affected users.


    For guidance on preventing scams related to account access, please refer to Demat
    & Trading Account — recognizing scams targeting this product.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: tarang_invest
- id: fd37ab7c-1a45-560f-9d61-4c028e57b6ac
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool is used to modify the list of individuals
    who have permission to access or operate a specific account. The agent performs
    this action by calling the tool directly upon the request of the primary account
    holder.


    **Tool Signature:**

    `manage_authorized_users(account_id: string, user_details: object, action: string,
    permissions: list)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `user_details`: The person''s full name, date of birth and contact details,
    exactly as the account holder gives them.

    - `action`: The operation to perform (e.g., ''ADD'' or ''REMOVE'').

    - `permissions`: A list of specific access rights being granted or revoked.


    **Effect:**

    Updates the security settings and access logs of the account. This is a state-changing
    operation and requires MFA from the primary account holder before execution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: tarang_invest
- id: 530a85cd-1f03-5f39-8e83-bdd934df717a
  title: Mutual Fund SIP — fraud and unauthorized-activity protection
  body: 'At Tarang Invest, we prioritise the safety of your wealth. When using our
    Mutual Fund SIP services, it is critical to recognize that fraudsters often target
    regular investment patterns to gain trust or steal credentials.


    Common fraud patterns targeting SIP investors include ''guaranteed return'' scams,
    where third parties claim they can manipulate your SIP to ensure a specific profit,
    or phishing attempts where you receive emails appearing to be from us, asking
    you to ''re-verify'' your bank mandate by clicking a link.


    Please be aware that we will never ask you for your login password, MFA (Multi-Factor
    Authentication) codes, or your full bank account details over a phone call or
    email. Any request for these details is a fraudulent attempt.


    To protect your account, we enforce mandatory MFA and e-KYC for all state-changing
    actions, including changes to your SIP amount or fund withdrawals. If you notice
    any unauthorised transaction or receive a suspicious request in the name of Tarang
    Invest, notify us immediately. Early reporting is essential for our fraud team
    to freeze unauthorised activity and initiate the dispute process.


    We maintain a zero-tolerance policy towards fraud. Once a dispute is reported,
    we acknowledge it within 24 hours and work towards a resolution within our standard
    7-15 business day window. Always ensure you are communicating with us through
    our official digital chat, email, or phone channels during business hours (9:00
    AM to 6:00 PM IST).'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 22357f54-160e-5b3f-9dcd-a13e61503acb
  title: Mutual Fund SIP — account agreement
  body: 'This agreement governs the use of the Mutual Fund SIP product provided by
    Tarang Invest. By initiating a Systematic Investment Plan, you agree to the following
    binding terms:


    1. Investment Obligations: The investor agrees to maintain a minimum SIP amount
    of ₹500 per installment. Failure to maintain sufficient funds in the linked bank
    account may lead to failed transactions and potential bank penalties.


    2. Redemption and Charges: You acknowledge that redeeming units within 365 days
    of investment will trigger an exit load of 1%. This charge is deducted from the
    redemption proceeds by the fund house.


    3. SIP Pause Facility: We provide the flexibility to pause your SIP contributions.
    However, this pause is limited to a maximum of 6 months. After this period, the
    SIP must either be resumed or formally cancelled.


    4. Compliance and Regulation: All operations are steered by SEBI and AMFI frameworks.
    We reserve the right to freeze account activity if mandatory e-KYC or identity
    verification is found to be lapsed or inaccurate.


    5. Termination: Either party may terminate the SIP agreement. The investor may
    stop the SIP at any time; however, the terms regarding the 1% exit load for units
    held for less than 365 days remain applicable to the underlying assets.


    6. Amendments: Tarang Invest may modify these terms to comply with regulatory
    changes from SEBI, NSE, or BSE. Notice of such changes will be provided to the
    registered email address of the investor.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 4b7848ba-691b-5b15-9ec2-cbca3396b8ab
  title: Mutual Fund SIP — who it is best for and common use cases
  body: 'The Mutual Fund SIP is a disciplined wealth-building tool designed for investors
    who prefer consistency over timing the market. By automating investments, it allows
    for long-term growth with low entry barriers.


    Who is it best for?

    - First-time Investors: Those who want to start their investment journey without
    needing a large lump sum, thanks to a minimum SIP amount of ₹500.

    - Salaried Professionals: Individuals looking to automate their savings immediately
    after receiving their monthly pay.

    - Long-term Goal Seekers: Those saving for milestones (like a home or education)
    who benefit from rupee-cost averaging over several years.


    Common Use Cases:

    - Monthly Wealth Creation: Setting up a recurring transfer of ₹500 or more into
    a diversified equity fund to build a corpus over a decade.

    - Financial Discipline: Using the automated nature of the SIP to ensure savings
    happen before discretionary spending.

    - Tactical Pausing: Using the pause feature for up to 6 months during temporary
    financial constraints to avoid cancelling the entire plan.


    Key Product Metrics:

    - Minimum Investment: ₹500 per SIP installment.

    - Early Exit Penalty: An exit load of 1% applies if units are redeemed within
    365 days.

    - Flexibility: Ability to pause installments for a maximum of 6 months.


    Disclaimer: Mutual fund investments are subject to market risks. Please read all
    scheme-related documents carefully before investing.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 60d056d2-461a-5eda-83dd-e3f0f733d952
  title: Mutual Fund SIP — exit load within 365 days explained
  body: 'Q: What is an exit load, and why is it charged?


    A: An exit load is a fee charged when an investor redeems mutual fund units within
    a specific timeframe. It is designed to discourage short-term trading in funds
    meant for long-term growth. For our Mutual Fund SIP, an exit load of 1% is applied
    if you redeem your units within 365 days of the investment date.


    Q: How is the 1% exit load calculated?


    A: The 1% charge is applied to the current net asset value (NAV) of the units
    being redeemed, provided those specific units were purchased less than 365 days
    ago. Units held longer than 365 days generally do not attract this load.


    For more details on costs, please refer to Mutual Fund SIP — fee schedule.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: faq
  source_authority: official
