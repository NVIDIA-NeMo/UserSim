- id: 0aa7cea0-1dad-51ca-a04e-fc1e168112a7
  title: ELSS Tax-Saver Fund — privacy and data handling
  body: 'Tarang Invest is committed to the highest standards of data privacy and regulatory
    compliance. This disclosure explains how we handle your information in relation
    to the ELSS Tax-Saver Fund.


    1. Data Collection and Usage:

    To facilitate investments in the ELSS Tax-Saver Fund, we collect personal identification
    data, financial records, and PAN details. This data is used exclusively for e-KYC,
    executing trades, and ensuring compliance with SEBI, AMFI, NSE, and BSE frameworks.


    2. Sharing with Third Parties:

    Your data is shared only with necessary regulatory bodies and the fund house managing
    the ELSS scheme. We do not sell your personal investment data to third-party marketers.


    3. Security Measures:

    We implement strict security protocols, including mandatory Multi-Factor Authentication
    (MFA) and encryption, to protect your portfolio data. Access to your investment
    records is restricted to authorised personnel and requires identity verification.


    4. Statutory Reporting:

    As the ELSS Tax-Saver Fund provides tax deductions under Section 80C (up to the
    ₹150000 cap), we may be required to report transaction details to the Income Tax
    Department of India as per prevailing law.


    5. Retention Policy:

    We retain your investment and KYC records for the duration of your account activity
    and for the period required by law, which extends beyond the 3-year lock-in period
    of the fund.


    Disclaimer: Mutual fund investments are subject to market risks. We maintain a
    standard of transparency and never project or guarantee returns on any investment.'
