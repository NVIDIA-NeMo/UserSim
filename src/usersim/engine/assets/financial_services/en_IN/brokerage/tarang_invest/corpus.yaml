- id: d828ee37-9916-599e-813b-07affc73af7a
  title: Demat & Trading Account — dp charge per sell explained
  body: '**What are DP Charges and why am I being charged?**

    DP Charges are Depository Participant charges levied per sell transaction for
    processing the transfer of shares from your demat account to the exchange. This
    is a standard regulatory requirement for moving securities.


    **How much is the DP Charge at Tarang Invest?**

    We charge a fixed DP Charge of ₹13.5 per sell transaction. This ensures cost-visibility
    for our users, as the fee remains the same regardless of the quantity of shares
    sold in that specific transaction.


    **Is this different from brokerage?**

    Yes. Brokerage is the fee for executing the trade, whereas the DP charge is for
    the administrative movement of shares from your holding. For instance, while equity
    delivery brokerage is ₹0, the DP Charge of ₹13.5 still applies when you sell those
    shares. For more details, please refer to Demat & Trading Account — fee schedule.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 7534f65c-3aca-5708-8635-df06099e59a6
  title: Demat & Trading Account — cancel, close, or downgrade
  body: 'If you wish to close your Demat & Trading Account, please follow these steps
    to ensure a smooth exit:


    1. **Clear Outstanding Dues:** Ensure your account balance is sufficient to cover
    any pending charges, including the annual maintenance charge of ₹300 and any applicable
    intraday brokerage of ₹20 per order. We cannot close accounts with negative balances.


    2. **Handle Existing Holdings:** You must decide what to do with your shares.
    You can either sell them (noting that a DP Charge of ₹13.5 will apply per sell
    transaction) or request to transfer them to another depository participant.


    3. **Submit Closure Request:** Tell us that you want to close your account. We
    will verify your identity using our mandatory MFA and e-KYC protocols to prevent
    unauthorised closures.


    4. **Final Verification:** We will conduct a final check to ensure no open positions
    or pending settlements exist in your trading account.


    5. **Confirmation:** Once processed, we will provide you with a formal account
    closure confirmation. You will receive a final statement showing a zero balance
    and the successful closure of your demat and trading links.


    If you only wish to stop certain activities rather than closing the account entirely,
    please ask us about our account status options.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5461c05a-5059-59ec-967d-04ce358f4bd6
  title: Demat & Trading Account — an unexpected charge or amount
  body: '**Symptom:** You notice a deduction in your ledger that you did not expect
    or a charge that seems incorrect.


    **Likely Causes:**

    - **DP Charges:** Many users forget that while delivery brokerage is ₹0, a DP
    Charge of ₹13.5 is levied every time shares are sold.

    - **Annual Maintenance:** The annual maintenance charge of ₹300 may have been
    debited on your account anniversary.

    - **Intraday Fees:** If a trade was executed as an intraday position, a fee of
    ₹20 per order was applied.


    **What to check in order:**

    1. **Transaction Type:** Check if you sold shares recently. If yes, the ₹13.5
    charge is the standard DP fee.

    2. **Date of Charge:** Check if the charge aligns with your account opening date
    (indicating the ₹300 annual fee).

    3. **Order Type:** Review your trade history to see if the order was marked as
    ''Intraday,'' which triggers the ₹20 per order charge.


    **The Fix:**

    If the charge does not align with the above, tell us which specific transaction
    you are disputing. We will investigate the ledger entry.


    **Escalation:**

    If we cannot resolve the discrepancy immediately, we will raise a formal dispute
    case. You will receive an acknowledgement within 24 hours, and the matter will
    be resolved within 7-15 business days. If you are still unsatisfied, the issue
    will be routed to our Grievance Redressal Officer.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
