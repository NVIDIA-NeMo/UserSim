- id: 15579717-8027-5fc8-ab59-42009362d965
  title: ELSS Tax-Saver Fund — recognizing scams targeting this product
  body: 'As you compare tax-saving instruments, please be aware of specific fraudulent
    schemes that target investors seeking Section 80C benefits. Because the ELSS Tax-Saver
    Fund has a mandatory lock-in period of 3 years, scammers often exploit this ''frozen''
    nature of the investment to deceive users.


    Common Red Flags:

    1. Guaranteed Returns: We strictly defer from projecting or guaranteeing returns
    on any investment. Any individual or entity claiming a ''guaranteed 15% return''
    or ''risk-free growth'' on your ELSS investment is fraudulent.

    2. Early Unlock Offers: You may encounter scammers claiming they can bypass the
    statutory lock-in period of 3 years for a fee. This is impossible; the lock-in
    is a regulatory requirement. Anyone offering to ''unlock'' your funds early is
    attempting to steal your money or account credentials.

    3. Request for MFA Codes: We will never ask you for your Multi-factor authentication
    (MFA) codes, passwords, or e-KYC details over a phone call or email to ''verify''
    your tax deduction.


    What to do if you suspect fraud:

    If you receive a suspicious communication or notice an unauthorised attempt to
    move funds, notify us immediately via our digital chat or email. We maintain a
    zero-tolerance policy towards fraud. Once reported, our structured dispute resolution
    process begins; we acknowledge most queries within 24 hours and aim for resolution
    within a standard 7-15 business day window.


    Remember: All investments in the ELSS Tax-Saver Fund are subject to market risks.
    Always ensure you are communicating with Tarang Invest through our official business
    channels during IST business hours (9:00 AM to 6:00 PM).'
