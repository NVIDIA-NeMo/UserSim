- id: 50be1a5a-60ed-5518-a6b2-1fd864b59c19
  title: Margin Trading Facility — make a change or update
  body: "If you are already using the Margin Trading Facility, you may need to update\
    \ your pledged collateral or modify your margin levels. Follow these steps:\n\n\
    Prerequisites:\n- An active account with MFA enabled.\n- Sufficient holdings in\
    \ your demat account if you are adding new collateral.\n\nSteps to update your\
    \ pledge or margin:\n1. Tell us which specific scrips you wish to add to or remove\
    \ from your pledge list. \n2. If adding new scrips, we will calculate the new\
    \ available buying power based on the current market value and the mandatory minimum\
    \ margin of 25%.\n3. For every new scrip added to the pledge, we will apply a\
    \ pledge charge of ₹20 per scrip. Confirm your acceptance of these charges.\n\
    4. If you are removing a pledge, tell us the quantity of shares to be unpledged.\
    \ We will verify that your remaining collateral still satisfies the minimum margin\
    \ of 25% for your open positions.\n5. Once the changes are processed, we will\
    \ send a confirmation notification. You can then see the updated buying power\
    \ and the updated interest accrual based on the annual interest rate of 14.99%\
    \ in your portfolio view.\n\nHow you know it worked:\nYou will receive a digital\
    \ confirmation and your 'Available Margin' balance will update to reflect the\
    \ changes in your pledged assets."
