- id: de231ece-3274-5e5d-ae7c-dd2bc27d66b4
  title: Mutual Fund SIP — vs. a similar product here
  body: 'When deciding between a Mutual Fund SIP and an ELSS Tax-Saver Fund, the choice
    depends on your primary objective: wealth growth or tax saving.


    Mutual Fund SIP:

    - Minimum Amount: ₹500

    - Lock-in: None (though an exit load of 1% applies if redeemed within 365 days).

    - Flexibility: Offers a sip pause max months of 6.

    - Best for: Long-term disciplined growth and liquid wealth accumulation.


    ELSS Tax-Saver Fund:

    - Lock-in: Mandatory 3-year statutory lock-in period.

    - Tax Benefit: Eligible for deduction under Section 80C.

    - Best for: Investors seeking to reduce taxable income while investing in equity.


    Choose Mutual Fund SIP if you value liquidity and the ability to pause investments.
    Choose the ELSS Tax-Saver Fund if your priority is achieving tax efficiency under
    the Indian Income Tax Act.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: a104de4b-a324-5a74-b2bc-519e7e579273
  title: Mutual Fund SIP — regulatory disclosures
  body: 'This document constitutes the formal regulatory disclosure for Mutual Fund
    SIP services provided by Tarang Invest. All operations are conducted in strict
    accordance with the frameworks established by SEBI, AMFI, NSE, and BSE.


    Market Risk Warning: Mutual fund investments are subject to market risks. The
    value of your investment can go up or down depending on the performance of the
    underlying assets. Past performance is not a guarantee of future results. We strictly
    adhere to a standard of transparency; therefore, Tarang Invest will never project
    or guarantee specific returns on any investment.


    Fee Disclosure: Investors are subject to an exit load of 1% if units are redeemed
    within 365 days of purchase. All charges are disclosed upfront to ensure cost-visibility.


    Advice Boundary: The information provided by Tarang Invest is for educational
    purposes and product transparency. We do not provide individualized financial
    planning, tax advice, or legal counsel. We recommend consulting a certified financial
    planner for personalized strategies.


    Data Privacy & Security: To protect investor assets, multi-factor authentication
    (MFA) and e-KYC are mandatory for all state-changing actions, including fund withdrawals
    and portfolio modifications. All data is handled according to strict privacy norms
    to prevent unauthorised account access.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 78d58425-8289-5b77-a2ae-7111e63a5bd8
  title: Mutual Fund SIP — interest rate / APY schedule
  body: "Mutual Fund SIPs do not offer a fixed interest rate or a guaranteed Annual\
    \ Percentage Yield (APY). Unlike fixed-income deposits, the returns on a Mutual\
    \ Fund SIP are derived from the Net Asset Value (NAV) of the underlying assets\
    \ in the chosen scheme.\n\nThe value of your investment fluctuates daily based\
    \ on market performance. Because these returns are market-linked, we do not quote\
    \ a flat rate. The actual yield is determined by the fund manager's performance\
    \ and the market conditions of the equity or debt instruments held by the fund.\
    \ \n\nAny changes in the return profile are driven by market volatility and the\
    \ expense ratio of the specific fund chosen. For information on the costs associated\
    \ with exiting a fund, please refer to Mutual Fund SIP — fee schedule."
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
