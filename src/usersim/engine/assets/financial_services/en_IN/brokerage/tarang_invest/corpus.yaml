  mentions_tools: []
  institution_id: tarang_invest
- id: b73354ac-312f-5f72-ae46-8af6d21b002f
  title: Mutual Fund SIP — fee schedule
  body: 'At Tarang Invest, we adhere to a philosophy of ''cost-visibility.'' Below
    are the specific charges associated with the Mutual Fund SIP product:


    - Entry Load: ₹0 (Nil)

    - Exit Load: 1% (This fee is charged when an investor redeems mutual fund units
    within 365 days of the investment date).

    - SIP Setup Fee: ₹0 (Nil)


    Please note that while Tarang Invest provides the brokerage infrastructure, the
    underlying mutual funds may have an Expense Ratio charged by the Asset Management
    Company (AMC), which is reflected in the fund''s Net Asset Value (NAV). For a
    broader view of our charges, see Institution-wide fees and charges.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
