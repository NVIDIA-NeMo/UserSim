- id: 38439fdc-9c24-564b-bd61-afb6a137d392
  title: Margin Trading Facility — choosing between tiers or options
  body: 'When deciding how to fund your trades at Tarang Invest, you generally choose
    between a standard Demat & Trading Account (full cash) and the Margin Trading
    Facility (leveraged).


    Comparison Dimensions:

    - Capital Requirement: In a standard delivery trade, you provide 100% of the capital.
    With the Margin Trading Facility, you only need to provide a minimum margin of
    25%.

    - Cost: Standard delivery has ₹0 brokerage. The Margin Trading Facility incurs
    an annual interest rate of 14.99% on the borrowed amount and a pledge charge of
    ₹20 per scrip.

    - Risk: Standard delivery carries only the market risk of the asset. Margin Trading
    amplifies both potential gains and potential losses due to leverage.


    Who it suits:

    - Standard Delivery: Best for long-term investors who prefer to own assets outright
    without incurring interest costs.

    - Margin Trading Facility: Best for active traders who wish to amplify their buying
    power and can manage the risk associated with a 14.99% annual interest rate.


    Disclaimer: Investments are subject to market risks.'
