- id: 5745eb05-fc0e-55eb-ad72-0287fb5c05da
  title: Demat & Trading Account — a failed or pending action
  body: '**Symptom**: You have attempted to open an account, withdraw funds, or change
    portfolio settings, but the action is marked as ''Pending'' or ''Failed''.


    **Likely Causes**

    - **Verification Gap**: Mandatory e-KYC or Multi-factor authentication (MFA) was
    not completed successfully.

    - **Documentation Issue**: The uploaded bank proof or identity document was blurred
    or expired.

    - **System Sync**: A temporary delay between the exchange (NSE/BSE) and our internal
    ledger.


    **What to Check**

    1. **MFA Status**: Check if you received and entered the MFA code within the valid
    time window.

    2. **KYC Status**: Ensure your Aadhaar is linked to your current mobile number;
    otherwise, the e-KYC will fail.

    3. **Document Clarity**: Review your uploaded documents to ensure all edges are
    visible and text is legible.


    **The Fix**

    If the action failed due to documentation, simply provide the updated or clearer
    document directly in the chat. If the action is ''Pending'' due to verification,
    we will re-trigger the MFA request upon your confirmation.


    **When to Escalate**

    If an action remains pending for more than 24 hours despite correct documentation,
    we will raise a formal case with our Compliance Officer. You will receive an acknowledgement
    within 24 hours, and the matter will be resolved within our standard 7-15 business
    day window.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
