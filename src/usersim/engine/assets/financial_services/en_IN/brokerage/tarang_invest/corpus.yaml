- id: b6bb2123-140c-5dc0-a57d-178ec946c993
  title: ELSS Tax-Saver Fund — set up and activate
  body: 'Setting up your ELSS Tax-Saver Fund is a straightforward process. Before
    you begin, ensure you have completed your e-KYC and have a linked bank account
    with sufficient funds.


    Follow these steps to activate your investment:


    1. Tell us you wish to invest in the ELSS Tax-Saver Fund. Please specify if you
    are making a one-time lump sum investment or setting up a regular contribution.

    2. Confirm the investment amount. Note that the minimum investment required is
    ₹500.

    3. Provide your confirmation for the 3 years mandatory lock-in period. We will
    remind you that these funds cannot be withdrawn until this duration is complete.

    4. Authorise the payment. We will trigger the payment request through your linked
    bank account via the secure payment gateway.

    5. Receive your investment confirmation. Once the transaction is successful, we
    will provide you with the number of units allotted and the date of investment,
    which marks the start of your 3 years lock-in.


    How you know it worked:

    You will receive a transaction confirmation message and an updated portfolio view
    showing your holding in the ELSS Tax-Saver Fund. You can also request a statement
    to verify the exact date of investment for your tax records.


    If you are undecided between this and a standard SIP, you may find it helpful
    to review Mutual Fund SIP — overview to compare the liquidity trade-offs.'
