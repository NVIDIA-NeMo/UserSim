  mentions_tools: []
  institution_id: tarang_invest
- id: 42f8c1d3-ab5b-5d15-8625-c4f7aa51f804
  title: Mutual Fund SIP — limits, restrictions, and edge cases
  body: "This document provides support agents with the critical boundaries and constraints\
    \ governing the Mutual Fund SIP product to ensure accurate customer guidance.\n\
    \nInvestment Limits:\n- Minimum SIP Amount: The absolute lowest amount a customer\
    \ can set for a regular investment is ₹500. Any request to start a SIP below this\
    \ threshold must be declined.\n\nWithdrawal & Exit Restrictions:\n- Exit Load:\
    \ We maintain a cost-visibility philosophy. If a customer redeems their mutual\
    \ fund units within 365 days of investment, an exit load of 1% is applied. This\
    \ is a standard fee for early redemption.\n- Redemption Processing: All redemption\
    \ requests are subject to standard settlement cycles as per SEBI and AMFI frameworks.\n\
    \nFlexibility and Pausing:\n- SIP Pause: To support customers during temporary\
    \ financial constraints, we allow them to pause their SIP. \n- Maximum Pause Duration:\
    \ An investment can be paused for a maximum of 6 months. Once this limit is reached,\
    \ the SIP must either be resumed or cancelled; it cannot be extended further.\n\
    \nEdge Cases:\n- Insufficient Funds: If the linked bank account has insufficient\
    \ funds on the SIP date, the transaction will fail. This does not cancel the SIP,\
    \ but recurring failures may lead to the fund house stopping the mandate.\n- Bank\
    \ Mandate Delays: e-KYC and bank mandates are mandatory. Any delay in the bank's\
    \ approval process will prevent the first SIP installment from being processed.\n\
    \n***Disclaimer: Mutual fund investments are subject to market risks; read all\
    \ scheme related documents carefully.***"
