- id: 45e6ca99-6010-587a-a059-981a7aedcac0
  title: Demat & Trading Account — regulatory disclosures
  body: 'This document provides formal regulatory disclosures for the Demat & Trading
    Account, in accordance with the frameworks established by SEBI, AMFI, NSE, and
    BSE.


    **Market Risk Disclosure**

    Investments in the securities market are subject to market risks. The value of
    investments may go up or down, and there is no guarantee of returns. Tarang Invest
    strictly adheres to a policy of transparency and will never project or guarantee
    specific returns on any investment.


    **Fee Transparency**

    To ensure operational sustainability without hidden costs, we charge the following
    fixed fees:

    - A delivery brokerage of ₹0.

    - Intraday brokerage of ₹20 per order.

    - DP Charges of ₹13.5 per sell transaction for the transfer of shares from the
    demat account.

    - An annual maintenance charge of ₹300.


    **Compliance and Security**

    We prioritise investor protection and fair treatment. All account state-changing
    actions, including fund withdrawals or portfolio changes, require mandatory Multi-factor
    authentication (MFA) and e-KYC. All personal data is handled according to strict
    data privacy norms.


    **Advice Boundaries**

    Tarang Invest provides educational resources and product information. We do not
    provide individualized tax, legal, or financial planning advice. Clients are encouraged
    to consult with a certified professional for personalised financial strategies.'
