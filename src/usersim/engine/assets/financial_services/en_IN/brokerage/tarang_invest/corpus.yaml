- id: 3e179c04-7c94-53bc-8ddc-d8a0161674b7
  title: ELSS Tax-Saver Fund — section 80c deduction cap explained
  body: 'Questions regarding tax benefits for the ELSS Tax-Saver Fund:


    Q: How much can I claim as a tax deduction using this fund?


    A: Under Section 80C of the Income Tax Act, you can claim a deduction for investments
    made in the ELSS Tax-Saver Fund, but this is subject to an overall section 80c
    deduction cap of ₹150000 per financial year. This cap includes other 80C investments
    like PPF or LIC.


    Q: What happens if I invest more than ₹150000?


    A: You can invest more than ₹150000 if you wish to grow your wealth; however,
    only the amount up to ₹150000 will be eligible for tax deduction under Section
    80C. All invested funds, regardless of the amount, remain subject to the 3-year
    lock-in period.


    Q: Does Tarang Invest provide a certificate for this deduction?


    A: Yes, we provide the necessary investment statements that you can use to claim
    your deduction. Please note that we provide product information but strictly defer
    individualized tax advice; we recommend consulting a tax professional for your
    specific filings.'
