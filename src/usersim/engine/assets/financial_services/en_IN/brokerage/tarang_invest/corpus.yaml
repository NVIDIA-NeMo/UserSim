- id: e545f382-8dfe-58dc-8cf8-e4308f9aebe2
  title: Demat & Trading Account — set up and activate
  body: 'Setting up your Demat & Trading Account with Tarang Invest is a streamlined
    digital process. We prioritise security and compliance with SEBI, NSE, and BSE
    frameworks to ensure your investments are protected.


    **Prerequisites**

    Before starting, please ensure you have your PAN card, Aadhaar card (linked to
    your mobile number), and a cancelled cheque or bank statement for the account
    you wish to link.


    **Steps to Activate Your Account**

    1. **Submit Identity Details**: Provide your PAN and Aadhaar details. We will
    perform a mandatory e-KYC (Electronic Know Your Customer) process to verify your
    identity.

    2. **Complete Digital Verification**: You will be required to complete Multi-factor
    authentication (MFA). This involves verifying your identity through a secure code
    sent to your registered mobile number.

    3. **Link Bank Account**: Provide your bank account details and upload a supporting
    document (cancelled cheque or statement). We will verify this link to ensure secure
    fund withdrawals and deposits.

    4. **Digital Signature**: Electronically sign the account opening agreement, which
    outlines our fee philosophy and regulatory obligations.

    5. **Final Review**: We will review your submission. Once our compliance team
    approves the verification, we will notify you that your account is active.


    **Confirmation**

    You will receive a confirmation message containing your unique Client ID. Once
    you see this ID in your dashboard, you can begin investing with ₹0 delivery brokerage.'
