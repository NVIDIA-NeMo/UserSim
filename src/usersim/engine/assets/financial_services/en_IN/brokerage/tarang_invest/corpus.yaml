- id: 3534ffbf-cfab-5d6a-9bbf-32d37c0cd30c
  title: Margin Trading Facility — set up and activate
  body: "Setting up the Margin Trading Facility allows you to amplify your buying\
    \ power by pledging your existing securities. Before starting, ensure you have\
    \ a funded Demat & Trading Account and sufficient eligible securities in your\
    \ holdings to meet the margin requirements.\n\n1. Tell us that you wish to activate\
    \ the Margin Trading Facility. We will then verify your account status and eligibility\
    \ based on SEBI and exchange frameworks.\n2. Provide the details of the specific\
    \ securities (scrips) you wish to pledge as collateral. \n3. Confirm your agreement\
    \ to the annual interest rate of 14.99% and the pledge charge per scrip of ₹20.\n\
    4. We will initiate the pledge process through the depository. You will receive\
    \ a request for digital authorization via your registered MFA (Multi-Factor Authentication)\
    \ channel; please approve this request to complete the pledge.\n5. Once the pledge\
    \ is confirmed, we will notify you that your margin limit has been increased.\n\
    6. You can now place buy orders selecting the 'Margin' option, provided you maintain\
    \ the minimum margin of 25% for the transaction.\n\nYou will know the process\
    \ is successful when you see the 'Available Margin' increase in your trading dashboard\
    \ and receive a confirmation notification of the pledged quantity."
