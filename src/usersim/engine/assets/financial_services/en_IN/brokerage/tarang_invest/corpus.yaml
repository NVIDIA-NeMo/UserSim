- id: 831fb8a6-3b3a-5cdd-8cbb-cf664e5a4c32
  title: Mutual Fund SIP — make a change or update
  body: 'Updating your Mutual Fund SIP is a straightforward process. Whether you wish
    to change the monthly investment amount or the date of deduction, follow these
    steps:


    **Prerequisites**

    Ensure you have access to your registered mobile device for Multi-factor authentication
    (MFA), as any change to your investment portfolio is a state-changing action.


    **Steps to Update Your SIP**

    1. Tell us which active SIP you wish to modify and the specific change you want
    to make (e.g., ''I want to increase my monthly SIP amount'').

    2. If you are changing the amount, ensure the new value is at least ₹500, as this
    is our minimum SIP amount.

    3. Provide the new preferred date for the monthly deduction.

    4. We will send an MFA verification request to your registered device. Confirm
    the request to authorise the change.

    5. We will confirm once the update has been processed. You will receive a revised
    SIP schedule via email.


    **How you know it worked**

    - You will receive an immediate digital confirmation in the chat.

    - An updated investment schedule will appear in your portfolio summary.

    - Your next monthly deduction will reflect the updated amount or date.


    Note: If you wish to stop payments for a short while instead of changing the amount,
    you may pause your SIP for a maximum of 6 months. Please refer to Mutual Fund
    SIP — sip pause max months explained for more details.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: how_to_guide
