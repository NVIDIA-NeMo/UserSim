- id: fa63147b-bd0e-5e03-85fb-b318e2007c6f
  title: Mutual Fund SIP — access or login problems
  body: '**Symptom**

    ''I cannot access my account to check my SIP status'' or ''My login attempts are
    being rejected.''


    **Likely Causes**

    - Incorrect credentials or expired session.

    - MFA (Multi-factor authentication) failure due to network issues.

    - Account locked due to multiple failed login attempts to prevent unauthorised
    access.


    **What to check in order**

    1. **Connectivity:** Ensure you have a stable internet connection to receive MFA
    codes.

    2. **Credentials:** Verify that you are using the registered email/mobile number
    associated with your Tarang Invest account.

    3. **Device Sync:** Ensure your device''s date and time are set to ''Automatic''
    to prevent MFA token mismatch.


    **The Fix**

    If you have forgotten your password or are locked out, tell us you need a credential
    reset. We will initiate a secure e-KYC verification process. Once your identity
    is verified via our mandatory security protocols, we will reset your access and
    you will receive a temporary password via your registered email.


    **When to escalate**

    If you suspect your account has been compromised or if the reset process fails,
    we will escalate the matter to our Compliance Officer. You will be notified of
    the escalation immediately. We aim to resolve all access-related disputes within
    a standard 7-15 business day window, though security lockouts are typically handled
    faster to ensure investor protection.


    Disclaimer: All account access is steered by SEBI and data privacy norms.'
