- id: 3bb8983c-8720-5f55-84ea-a2e342a63b54
  title: Demat & Trading Account — how rates are tiered and applied
  body: 'Tarang Invest employs a flat-fee structure for the Demat & Trading Account
    to ensure absolute transparency. There are no tiered slabs based on volume or
    account balance; the same rates apply to all retail users.


    **Applicable Rates:**

    - **Equity Delivery Brokerage:** ₹0 (Applied to all buy/sell trades where shares
    are held overnight).

    - **Intraday Brokerage:** ₹20 per order (Applied to all trades closed within the
    same trading session).

    - **DP Charges:** ₹13.5 per sell transaction (Applied whenever shares are transferred
    out of the demat account upon sale).

    - **Annual Maintenance Charge:** ₹300 (A flat annual fee for infrastructure and
    regulatory maintenance).


    These rates are fixed to ensure operational sustainability without hidden costs.
    Any changes to these rates will be communicated to the user in advance as per
    our change-of-terms policy.'
