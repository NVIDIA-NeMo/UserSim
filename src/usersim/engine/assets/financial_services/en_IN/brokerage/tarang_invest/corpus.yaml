- id: 989b0f63-7d5d-57ce-985b-15650a845be1
  title: ELSS Tax-Saver Fund — fee schedule
  body: 'The following fee structure applies to the ELSS Tax-Saver Fund. We adhere
    to a ''cost-visibility'' philosophy, ensuring all charges are transparent and
    essential for regulatory and operational sustainability.


    • Investment Amount: Minimum investment of ₹500 per transaction.

    • Brokerage Fee: ₹0 (Zero brokerage on delivery/investment).

    • Management Fees: These are built into the Net Asset Value (NAV) of the fund
    as per the fund house''s expense ratio and are not charged as a separate bill
    to the customer.

    • Withdrawal/Exit Load: Not applicable during the lock-in period, as withdrawals
    are prohibited for 3 years.


    For general account charges such as DP fees, please refer to Demat & Trading Account
    — fee schedule.'
