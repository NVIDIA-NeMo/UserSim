- id: 03e7d506-2e17-534a-8a30-145e8e97ad98
  title: Mutual Fund SIP — account security best practices
  body: 'At Tarang Invest, the security of your investments is our highest priority.
    As you manage your Mutual Fund SIP, we urge you to adhere to these essential security
    practices to protect your portfolio from unauthorised access.


    **Our Security Standard**

    We enforce mandatory Multi-factor authentication (MFA) and e-KYC for all state-changing
    actions. This means any request to withdraw funds or change your SIP portfolio
    will require a secondary verification step. This is a non-negotiable layer of
    protection designed to prevent fraudulent transfers.


    **What We Will NEVER Ask For**

    To maintain a secure environment, please be aware that Tarang Invest employees
    will never ask you for the following via phone, email, or chat:

    1. Your account password or MFA OTPs.

    2. Your full bank account details or PINs.

    3. Immediate payment to a personal account to ''unlock'' a mutual fund return.


    **Recognising Fraudulent Patterns**

    Be wary of ''guaranteed return'' schemes. We hold a strict standard of transparency
    and will never project or guarantee returns on any investment. Any communication
    promising fixed profits from a Mutual Fund SIP is a red flag.


    **Immediate Action Steps**

    If you notice any unauthorised change to your SIP date, amount, or if you receive
    an MFA notification you did not trigger, notify us immediately. Our zero-tolerance
    policy towards fraud ensures that we act swiftly. Most security queries are acknowledged
    within 24 hours, and we work to resolve disputes within a standard 7-15 business
    day window.


    Disclaimer: Mutual fund investments are subject to market risks. All communications
    adhere to strict data privacy norms as steered by SEBI and AMFI frameworks.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: security_advisory
  source_authority: official
