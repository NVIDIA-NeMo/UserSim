- id: 2c179056-abc1-5460-8652-dd5d7e89c552
  title: Demat & Trading Account — choosing between tiers or options
  body: "When deciding how to use your Demat & Trading Account, you should choose\
    \ your strategy based on your financial goals: long-term wealth building or active\
    \ short-term trading.\n\nFor Long-Term Investors:\nIf your goal is to buy and\
    \ hold shares for months or years, our Delivery option is the best fit. You benefit\
    \ from ₹0 equity delivery brokerage, meaning you pay nothing to enter a position.\
    \ Your only recurring cost is the annual maintenance charge of ₹300, and a DP\
    \ Charge of ₹13.5 only when you eventually sell.\n\nFor Active Traders:\nIf you\
    \ prefer to buy and sell within the same day to capitalise on volatility, the\
    \ Intraday option is designed for you. While you pay a fixed brokerage of ₹20\
    \ per order, you gain the ability to move quickly in the market. \n\nWho each\
    \ suits:\n- The delivery route suits the disciplined investor seeking long-term\
    \ growth with minimal costs.\n- The intraday route suits the experienced trader\
    \ who prioritises institutional-grade tools and high-frequency execution over\
    \ zero-cost brokerage.\n\nRegardless of your choice, please remember that all\
    \ equity investments are subject to market risks."
