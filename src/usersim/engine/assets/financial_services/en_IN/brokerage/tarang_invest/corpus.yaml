    2. Investment Thresholds: A minimum investment of ₹500 is required to initiate
    a purchase. We reserve the right to modify this minimum threshold upon providing
    30 days'' notice.


    3. Tax Deduction Limits: While we provide the infrastructure for investing, the
    tax benefit is subject to the prevailing laws of India. Currently, the deduction
    cap under Section 80C is ₹150000. Any change in the statutory cap by the Government
    of India will automatically supersede the terms mentioned here.


    4. Modification of Terms: Tarang Invest may amend these terms to comply with new
    mandates from SEBI, AMFI, NSE, or BSE. We will notify you of any material changes
