- id: 432b2271-c067-5151-a11a-ed97eb345e33
  title: Demat & Trading Account — limits, restrictions, and edge cases
  body: "This internal guide outlines the operational limits and restrictions for\
    \ the Demat & Trading Account to assist support agents in managing customer expectations.\n\
    \n**Operational Limits & Restrictions**\n- **Delivery Trading:** We offer ₹0 equity\
    \ delivery brokerage, encouraging long-term retail investing. However, these accounts\
    \ must adhere to SEBI-mandated margin requirements for all trades.\n- **Intraday\
    \ Trading:** For active traders, we charge a fixed intraday brokerage of ₹20 per\
    \ order. Support agents should clarify that this is a flat fee regardless of the\
    \ order size.\n- **Sell Transactions:** Every sell transaction attracts DP Charges\
    \ of ₹13.5. This is a mandatory charge for processing the transfer of shares from\
    \ the demat account and cannot be waived.\n- **Maintenance:** An annual maintenance\
    \ charge of ₹300 is levied to ensure the sustainability of the account infrastructure.\n\
    \n**Edge Cases**\n- **Inactive Accounts:** Accounts with zero balance and no activity\
    \ for extended periods may be flagged for dormant status. Re-activation requires\
    \ a fresh e-KYC process.\n- **Pledged Securities:** While the Demat & Trading\
    \ Account is the gateway, users seeking to amplify buying power must move to the\
    \ Margin Trading Facility. \n- **Regulatory Blocks:** Accounts may be temporarily\
    \ blocked by SEBI, NSE, or BSE due to compliance discrepancies or missing mandatory\
    \ documentation. \n\nAll communications must remind customers that investments\
    \ are subject to market risks. For a full breakdown of costs, refer to the Demat\
    \ & Trading Account — fee schedule."
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: product_sheet
