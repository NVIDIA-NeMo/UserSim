- id: d391683c-b886-5267-98bd-95c9f94751b5
  title: Mutual Fund SIP — getting started walkthrough
  body: 'This guide is for support agents to assist customers in initiating a Mutual
    Fund SIP. The Mutual Fund SIP is a disciplined wealth-building tool designed for
    long-term growth with low entry barriers.


    **Step 1: Eligibility and KYC Check**

    Confirm the customer has a completed e-KYC and a verified Demat & Trading Account.
    Refer to Demat & Trading Account — eligibility requirements for baseline prerequisites.


    **Step 2: Fund Selection and Amount**

    Assist the customer in selecting a fund. Inform them that the minimum SIP amount
    is ₹500. Ensure they understand that we provide product information but do not
    offer individualized financial planning advice.


    **Step 3: Setting the Mandate**

    Help the customer set the SIP date and frequency. Explain that they can pause
    their SIP for a maximum of 6 months if they face temporary liquidity issues.


    **Step 4: Cost Disclosure**

    Clearly communicate the cost structure to ensure cost-visibility:

    - **Entry:** No brokerage for delivery investments.

    - **Exit:** An Exit Load of 1% is applicable if units are redeemed within 365
    days.


    **Step 5: Confirmation**

    Once the setup is complete, the customer will receive a confirmation notification.
    Remind the customer that investments are subject to market risks and that Tarang
    Invest never guarantees returns.


    **Key Product Summary**

    - Minimum Investment: ₹500

    - Max SIP Pause: 6 months

    - Exit Load (<365 days): 1%

    - Regulatory Framework: SEBI, AMFI, NSE, BSE'
