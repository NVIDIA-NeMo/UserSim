- id: 2fcb8074-ff3a-514b-8bfb-b5a3c36e443f
  title: Margin Trading Facility — risk disclosures
  body: 'IMPORTANT REGULATORY DISCLOSURE: The Margin Trading Facility is a leveraged
    financial product. Leverage increases both the potential for profit and the potential
    for loss.


    Market Risk: Investments in the securities market are subject to market risks.
    If the value of the securities purchased using this facility declines, your losses
    will be amplified. You may lose more than your initial investment of 25% minimum
    margin.


    Liquidation Risk: Tarang Invest is obligated to maintain the minimum margin of
    25%. If the value of your collateral falls below this threshold and you are unable
    to provide additional funds or securities immediately, we will liquidate your
    positions. This liquidation may occur at a price significantly lower than your
    purchase price.


    Cost of Leverage: This facility is not free. You will incur an annual interest
    rate of 14.99% on the borrowed capital. Additionally, a pledge charge of ₹20 per
    scrip is applied to the securities used as collateral. These costs must be factored
    into your overall trade profitability.


    Regulatory Oversight: This facility is provided in compliance with SEBI, AMFI,
    NSE, and BSE frameworks. All clients must undergo mandatory e-KYC and MFA verification
    to prevent unauthorised access and ensure investor protection.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: disclosure
  source_authority: official
