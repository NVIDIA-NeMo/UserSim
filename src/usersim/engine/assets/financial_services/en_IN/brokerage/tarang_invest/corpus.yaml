- id: 5f4c5572-5e15-5312-8a4b-7ff5574c54a7
  title: Mutual Fund SIP — a failed or pending action
  body: 'Symptom: ''My monthly SIP installment was not debited'' or ''My SIP status
    is showing as Pending.''


    Likely Causes:

    1. Insufficient funds in the linked bank account on the scheduled date.

    2. An expired or rejected bank mandate.

    3. A technical timeout during the multi-factor authentication (MFA) process.


    Steps to resolve:

    1. Check your bank balance to ensure it meets or exceeds your committed monthly
    amount (which must be at least ₹500).

    2. Verify if you received a notification from your bank regarding a mandate failure.

    3. If the action is ''Pending'' due to a verification error, try re-triggering
    the authentication request via our digital chat.


    Fix:

    If the failure was due to insufficient funds, you can make a one-time manual top-up
    to keep your investment goal on track. If the mandate has expired, you will need
    to provide a new electronic mandate for approval.


    When to escalate:

    If funds were debited from your bank but your portfolio has not been updated after
    3 business days, we will raise a case with the fund house and the clearing bank.
    We acknowledge most queries within 24 hours and aim to resolve such discrepancies
    within a standard 7-15 business day window. You will receive an email update once
    the units are credited to your account.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
