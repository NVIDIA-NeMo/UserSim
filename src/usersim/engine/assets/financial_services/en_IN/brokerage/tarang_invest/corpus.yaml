- id: 02e4f04f-e22e-565c-90e4-6267389405a5
  title: ELSS Tax-Saver Fund — minimum investment explained
  body: 'Q: What is the lowest amount I can invest in the ELSS Tax-Saver Fund?

    A: The minimum investment required to start your investment in the ELSS Tax-Saver
    Fund is ₹500. This ensures that tax-saving equity investments are accessible to
    all retail investors.


    Q: If I invest the minimum of ₹500, do I still get the tax benefit?

    A: Yes, any amount invested in this fund is eligible for a tax deduction under
    Section 80C, provided it is within the overall deduction cap of ₹150000 for the
    financial year.


    Q: Can I increase my investment after the initial ₹500?

    A: Absolutely. You can make additional investments at any time to reach your desired
    tax-saving goal, keeping in mind the Section 80C limit. For more details on costs,
    please refer to ELSS Tax-Saver Fund — fee schedule.'
