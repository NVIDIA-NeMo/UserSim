- id: 43abdb91-72b0-5099-935b-08de47d5935b
  title: Mutual Fund SIP — risk disclosures
  body: 'Important Regulatory Disclosures regarding Mutual Fund SIP investments:


    Market Risk Warning: Mutual fund investments are subject to market risks. The
    value of your investment can go up or down depending on the performance of the
    underlying assets. Past performance is not a guarantee of future results. We never
    project or guarantee returns on any investment.


    Liquidity and Exit Loads: While SIPs offer flexibility, redeeming your investment
    prematurely may incur costs. Specifically, an exit load of 1% is applicable if
    you redeem units within 365 days of investment. Please plan your liquidity needs
    accordingly to avoid this charge.


    Investment Limits: To maintain the viability of the product, a minimum SIP amount
    of ₹500 is required for all installments.


    Pause Limitations: The facility to pause your SIP is provided for temporary relief
    and is capped at a maximum of 6 months. Exceeding this period may result in the
    automatic cancellation of the SIP mandate.


    Regulatory Oversight: All services are provided in accordance with the frameworks
    established by SEBI, AMFI, NSE, and BSE. Tarang Invest adheres to strict data
    privacy norms and mandatory e-KYC protocols to protect investor interests.


    Professional Advice: We provide educational resources and product information.
    However, we strictly defer individualized tax, legal, or financial planning advice
    to certified professionals.'
