  institution_id: tarang_invest
- id: 6f11c386-0dc1-5722-9d91-f480a5c937d8
  title: Demat & Trading Account — annual maintenance charge explained
  body: '**What is the Annual Maintenance Charge (AMC)?**

    The AMC is a fixed fee we charge to cover the costs of maintaining your account
    infrastructure, ensuring your holdings are secure and your account remains compliant
    with regulatory standards. For the Demat & Trading Account, this charge is ₹300
    per year.


    **When is this fee debited from my account?**

    This fee is applied annually. We ensure full transparency regarding this charge,
    and you will see it reflected in your account statements as a standard maintenance
    cost.


    **Is there a way to waive this charge?**

    To maintain operational sustainability and provide ₹0 delivery brokerage, the
    annual maintenance charge of ₹300 is a fixed requirement for all account holders.


    For a full breakdown of all costs, please refer to Demat & Trading Account — fee
    schedule.'
