- id: 2386b1b7-3d49-5890-952a-7f36cd7a54c1
  title: Margin Trading Facility — resolve a common request end-to-end
  body: 'A common request for Margin Trading Facility users is the ''Partial De-leveraging''
    of a position—where you pay back a portion of the borrowed funds to reduce interest
    costs while still holding the asset.


    Prerequisites:

    You must have an active leveraged position and sufficient funds in your trading
    account to cover the repayment amount.


    Steps to Resolve Partial De-leveraging:

    1. Identify the position: Tell us which scrip you wish to partially de-leverage
    and the exact amount of the loan you want to repay.

    2. Confirm available funds: We will check your account balance to ensure you have
    the requested amount available for repayment.

    3. Authorise the transaction: Since this is a state-changing action, we will trigger
    a multi-factor authentication (MFA) request. Confirm the prompt to authorise the
    fund transfer from your balance to the margin loan.

    4. Verify the new balance: We will confirm the new, lower borrowed amount and
    provide you with the updated daily interest calculation based on the annual interest
    rate of 14.99%.

    5. Final Confirmation: We will send a confirmation message stating the total amount
    repaid and the remaining leverage on that specific scrip.


    How you know it worked:

    You will see a reduction in the ''Borrowed Amount'' for that scrip in your portfolio,
    and your subsequent interest charges will decrease accordingly. You will also
    receive a transaction receipt for the repayment amount.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 869da0b5-dfad-5078-a8c3-6e64042a4285
  title: Margin Trading Facility — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that the interest charged or the pledge fees
    on their statement do not match their own calculations.


    Likely Causes:

    1. Calculation Misunderstanding: The customer may be applying the annual interest
    rate of 14.99% linearly rather than on a daily accrual basis.

    2. Pledge Fee Oversight: The customer may have overlooked the pledge charge per
    scrip of ₹20, which is applied per single scrip pledged, not per transaction.

    3. Timing Differences: Interest is calculated on the daily closing balance of
    the borrowed amount; trades made mid-day may result in interest charges that seem
    mismatched if not viewed daily.

    4. Minimum Margin Adjustment: A temporary dip in stock value may have triggered
    a margin call or required additional funding, affecting the interest base.


    What to check in order:

    1. Review the Daily Balance: Check the closing balance of the borrowed funds for
    each day of the statement period.

    2. Recalculate Interest: Apply the annual interest rate of 14.99% divided by 365
    days to the daily borrowed balance.

    3. Count the Scrips: Count the total number of unique scrips pledged and multiply
    by ₹20 to verify the total pledge charges.


    How to fix:

    - If it is a misunderstanding: We will provide a detailed walkthrough of the daily
    interest calculation to the customer.

    - If a genuine error is found: We will initiate a correction. If the error resulted
    in an overcharge, we will apply a credit to the account.


    When to escalate:

    If the discrepancy remains unresolved after the walkthrough, we will escalate
    the matter to our Grievance Redressal Officer. The customer will be notified that
    a formal review is underway, with a resolution provided within the standard 7-15
    business day window.'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 6e31f0bf-e59b-5e4a-84fb-ebb34b0009e0
  title: Institution-wide fees and charges
  body: 'At Tarang Invest, we operate on a philosophy of ''cost-visibility''. We ensure
    that our retail investors and active traders encounter no hidden costs, charging
    only for essential infrastructure and regulatory requirements.


    Our institutional fee structure includes:


    1. **Fixed Regulatory Charges**: These are mandatory costs levied by regulatory
    bodies and exchanges that apply to all accounts regardless of the product used.

    2. **Infrastructure Fees**: We charge fixed fees for operational sustainability,
    such as DP Charges. DP Charges are depository participant charges levied per sell
    transaction for processing the transfer of shares from the demat account.

    3. **Product-Specific Costs**: While some infrastructure costs are universal,
    other charges depend on the asset class. For example, intraday brokerage is fixed
    for active traders, and certain mutual fund transactions may attract an Exit Load
    (a fee charged when an investor redeems mutual fund units within a specific timeframe,
    typically 365 days).


    For detailed breakdowns of costs associated with specific accounts, please refer
    to the individual product fee schedules.'
  domain: brokerage_investing
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 6f55dea3-e417-5473-bebc-2bc8c0466e01
  title: General frequently asked questions
  body: '### How do I get started with Tarang Invest?

    To begin investing, you must complete our mandatory e-KYC and set up multi-factor
    authentication (MFA) for security. Once verified, you can open a Demat & Trading
    Account to start trading in equities or set up a Mutual Fund SIP for disciplined
    wealth building.


    ### How can I contact support and what are the timings?

    Our support team is available via digital chat, email, and phone during Indian
    Standard Time (IST) business hours, from 9:00 AM to 6:00 PM.


    ### What happens if I have a dispute or report fraud?

    We maintain a zero-tolerance policy towards fraud. Most queries are acknowledged
    within 24 hours and are typically resolved within a standard 7-15 business day
    window. For formal grievances, please see When to use initiate_dis for our escalation
    process.


    ### Does Tarang Invest provide financial planning advice?

    We provide educational resources and product information to help you learn. However,
    we strictly defer individualized tax, legal, or financial planning advice to certified
    professionals.'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: e3076ac3-491c-569d-a086-f3e1b3792831
  title: Regulatory notes for brokerage_investing
  body: 'All operations at Tarang Invest are steered by the frameworks established
    by the Securities and Exchange Board of India (SEBI), the Association of Mutual
    Funds in India (AMFI), the National Stock Exchange (NSE), and the Bombay Stock
    Exchange (BSE). Our primary mandate is to prioritise investor protection and ensure
    the fair treatment of all retail clients.


    **Agent Obligations for Compliance:**


    1. **Market Risk Disclosures**: It is mandatory to inform clients that all investments
    are subject to market risks. This must be prominently stated in all communications
    regarding mutual funds and equity trading. Agents must never project or guarantee
    returns on any investment, as transparency is our core standard.

    2. **Identity Verification**: To prevent unauthorised account access and ensure
    compliance with Anti-Money Laundering (AML) laws, agents must ensure multi-factor
    authentication (MFA) and e-KYC are completed. No state-changing action—such as
    fund withdrawals or portfolio changes—may be executed without strict identity
    verification.

    3. **Data Privacy**: Agents must adhere to strict data privacy norms. Client information
    must only be accessed for the purpose of completing the requested service.

    4. **Advice Boundaries**: Agents are prohibited from providing individualized
    tax, legal, or financial planning advice. You may share educational materials
    and factual product information, but you must explicitly defer specific planning
    queries to the client''s personal professional advisors.

    5. **Fair Treatment**: Every client must be treated equitably. Any suspected fraudulent
    activity must be reported immediately through our structured dispute resolution
    process to maintain our zero-tolerance posture towards fraud.'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: d9efe717-3922-5c50-beea-050f5bf22f9c
  title: When to use get_positions
  body: 'The `get_positions` tool is used to retrieve a real-time snapshot of a customer''s
    current holdings across their brokerage accounts. This is a read-only action and
    does not alter the state of the portfolio.


    **Usage Scenarios:**

    - When a customer asks, "What shares do I currently own?"

    - When a customer wants to know the current quantity or average price of a specific
    security in their portfolio.

    - When a customer asks for a summary of their invested assets before deciding
    to sell or add more funds.


    **Procedure:**


    1. **Identify the Customer**: Begin by confirming the customer''s identity. If
    the customer has not been verified in the current session, execute the `verify_identity`
    process.

    2. **Resolve Account ID**: Use the `get_accounts` tool to find the correct `account_id`
    associated with the customer''s profile (e.g., by matching the last four digits
    of their account number).

    3. **Retrieve Holdings**: Call the `get_positions` tool using the resolved `account_id`
    to fetch the current list of securities and their respective quantities.

    4. **Present Information**: Communicate the holdings to the customer in a clear,
    professional manner. Ensure that you do not provide any investment advice or return
    projections based on these positions, as per our transparency standards.


    **Constraints:**

    - This tool provides the current state of holdings but does not provide historical
    performance or profit/loss analytics. For detailed historical data, the agent
    should direct the customer to the statements section via `get_statements`.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: tarang_invest
- id: 00657417-0705-53c7-8601-3240b8d6a82c
  title: get_positions tool reference
  body: "The `get_positions` tool allows the agent to fetch the current investment\
    \ holdings for a specific account. \n\n**Tool Signature:**\n`get_positions(account_id:\
    \ string)`\n\n**Arguments:**\n- `account_id`: The unique identifier of the customer's\
    \ trading or investment account.\n\n**Effect:**\nThis is a read-only operation.\
    \ It returns a list of all active positions (securities, mutual fund units, etc.)\
    \ currently held in the specified account, including the symbol, quantity, and\
    \ average purchase price.\n\n**Execution:**\nThe agent performs this action by\
    \ calling the tool directly within the conversation interface after the customer's\
    \ identity has been verified. The agent does not redirect the customer to a portal\
    \ to check their positions."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
