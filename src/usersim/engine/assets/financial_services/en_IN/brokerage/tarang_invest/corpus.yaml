- id: 77364ce9-a0d1-5e6f-8114-183d622ddab3
  title: Demat & Trading Account — privacy and data handling
  body: 'Tarang Invest is committed to the highest standards of data privacy and regulatory
    compliance, steered by the frameworks of SEBI, AMFI, NSE, and BSE. This disclosure
    explains how we handle your personal and financial data in relation to your Demat
    & Trading Account.


    Data Collection and Purpose:

    We collect personal identification (PAN, Aadhaar), financial records, and trading
    patterns. This data is used exclusively for mandatory e-KYC, identity verification,
    and to ensure the fair treatment of investors. We strictly enforce these verification
    steps to prevent unauthorised account access.


    Data Protection and Security:

    To prevent data breaches, we employ institutional-grade encryption. All state-changing
    actions—such as fund withdrawals, portfolio changes, or updating contact information—require
    mandatory multi-factor authentication (MFA). We do not sell your trading data
    to third-party marketing agencies.


    Regulatory Sharing:

    We are legally obligated to share your transaction data, including the payment
    of the annual maintenance charge of ₹300 and the intraday brokerage per order
    of ₹20, with regulatory bodies like SEBI and the respective stock exchanges (NSE/BSE)
    for auditing and surveillance purposes.


    User Rights:

    You have the right to request a copy of the data we hold about you. Any disputes
    regarding data handling are processed through our structured resolution system,
    with acknowledgement within 24 hours and resolution within 7-15 business days.


    Final Notice: Equity investments are subject to market risks. Tarang Invest provides
    product information but does not provide individualized tax, legal, or financial
    planning advice.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 81b163cf-595c-5524-b739-678bdcb99400
  title: Mutual Fund SIP — overview
  body: 'Welcome to Mutual Fund SIP by Tarang Invest. A Systematic Investment Plan
    (SIP) is a disciplined wealth-building tool that allows you to invest a fixed
    sum regularly in a mutual fund, rather than deploying a large lump sum at once.
    This approach helps you average the cost of your investments over time and lowers
    the barrier to entry for long-term growth.


    We have designed our Mutual Fund SIP to be accessible and flexible. You can start
    your investment journey with a minimum sip amount of ₹500. To ensure our operational
    sustainability, we maintain a lean cost structure, though certain fund-specific
    charges apply. Specifically, if you choose to redeem your units early, an exit
    load of 1% is applicable if the redemption occurs within 365 days of the investment.


    We understand that financial situations can change. Therefore, we offer flexible
    pause options, allowing you to stop your contributions for a sip pause max months
    of 6 before the mandate must be resumed or restarted.


    Important Risk Disclosure: Mutual fund investments are subject to market risks.
    Please read all scheme-related documents carefully before investing. We provide
    educational resources and product information but strictly defer individualized
    tax, legal, or financial planning advice. We never project or guarantee returns
    on any investment.


    Whether you are a retail investor starting small or an active trader diversifying
    your portfolio, our platform provides the institutional-grade tools needed to
    track and manage your growth efficiently.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 92fa14f7-61e0-5e6d-8aaa-2fe4f9459e46
  title: Mutual Fund SIP — minimum sip amount explained
  body: 'Q: What is the lowest amount I can commit to for a monthly investment?


    A: To make wealth creation accessible to everyone, we have set a minimum sip amount
    of ₹500. This allows you to start building your portfolio with a modest sum while
    maintaining a disciplined investment habit.


    Q: Can I invest less than ₹500 if I am a student or a first-time investor?


    A: No, the minimum sip amount of ₹500 is a fixed threshold required to initiate
    a Systematic Investment Plan through our platform.


    Q: Does this minimum apply to every single fund available on Tarang Invest?


    A: While our platform standard is a minimum sip amount of ₹500, we recommend reviewing
    the specific fund''s product sheet to ensure there are no higher requirements
    set by the fund house. For more details on costs, please refer to Mutual Fund
    SIP — fee schedule.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: faq
  source_authority: official
  placeholder: true
