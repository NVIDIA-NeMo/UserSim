- id: a58704c1-3822-577b-8c42-604c0b58b392
  title: Margin Trading Facility — pledge charge per scrip explained
  body: 'Q: What is a pledge charge per scrip in the Margin Trading Facility?

    A: A pledge charge is a fixed fee of ₹20 charged for each unique stock (scrip)
    you pledge as collateral to secure your margin loan. This fee covers the operational
    and regulatory costs of marking the lien on your shares with the depository.


    Q: Is this charge applied every time I buy shares?

    A: No, it is applied specifically when you pledge securities to amplify your buying
    power. For standard delivery trades without leverage, please refer to Demat &
    Trading Account — faq_2 for details on DP charges.


    Q: Can I avoid this charge?

    A: The ₹20 charge is a fixed infrastructure cost for processing the pledge. If
    you choose not to use the Margin Trading Facility and instead use your own capital
    for 100% of the trade, no pledge charge is applicable.


    Disclaimer: Investments are subject to market risks.'
  domain: brokerage_investing
  product_category: margin_trading_facility
