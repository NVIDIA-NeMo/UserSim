- id: f289ed45-f6d4-5ba4-a5ac-75fd1a86030d
  title: Margin Trading Facility — getting started walkthrough
  body: 'This guide is for support agents assisting customers in activating the Margin
    Trading Facility (MTF). MTF is a leverage tool for active traders to amplify their
    buying power through pledged securities.


    Key Product Specifications:

    - Annual Interest Rate: 14.99%

    - Minimum Margin Required: 25%

    - Pledge Charge: ₹20 per scrip


    Walkthrough for Customer Onboarding:

    Step 1: Verification

    Ensure the customer has a completed and active Demat & Trading Account. Verify
    that their e-KYC is up to date, as MFA is mandatory for the activation of leverage
    tools.


    Step 2: Eligibility Check

    Confirm the customer understands the risk of leverage. Explain that they must
    provide a minimum margin of 25% of the total trade value to initiate a position.


    Step 3: Pledging Securities

    Assist the customer in selecting the securities they wish to pledge. Inform them
    that a pledge charge of ₹20 per scrip will be applied for processing this action.


    Step 4: Funding and Execution

    Confirm that the required 25% margin is available in their ledger. Once confirmed,
    the customer can execute trades using the amplified buying power.


    Step 5: Maintenance Awareness

    Educate the customer on the cost of carry. Explain that the annual interest rate
    of 14.99% will accrue on the funded portion of their trade.


    Compliance Note: Remind the customer that all investments are subject to market
    risks. We do not guarantee any returns on leveraged positions.'
