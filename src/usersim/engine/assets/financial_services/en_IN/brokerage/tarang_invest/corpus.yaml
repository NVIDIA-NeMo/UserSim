- id: 00bb0769-63e2-50af-ae07-749434a5d040
  title: ELSS Tax-Saver Fund — cost and charges
  body: 'Q: Are there any hidden charges when investing in the ELSS Tax-Saver Fund?

    A: No, we follow a philosophy of ''cost-visibility.'' We charge only for essential
    infrastructure and regulatory requirements. You will find all applicable costs
    clearly listed in the ELSS Tax-Saver Fund — fee schedule.


    Q: Will I be charged a fee when I withdraw my money?

    A: Depending on the specific fund''s rules, an Exit Load (a fee charged when an
    investor redeems mutual fund units within a specific timeframe, typically 365
    days) may apply. However, please note that for the ELSS Tax-Saver Fund, you cannot
    redeem any units until the mandatory lock-in period of 3 years has passed.


    Q: Is there a cost for maintaining the account where my ELSS units are held?

    A: Yes, standard DP Charges (Depository Participant charges levied per sell transaction
    for processing the transfer of shares from the demat account) apply when you sell
    units after the lock-in period. For more details on account maintenance, see Demat
    & Trading Account — annual maintenance charge explained.'
