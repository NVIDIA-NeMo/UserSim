- id: d3da86f4-9643-5355-9763-286f118475a8
  title: Mutual Fund SIP — cancel, close, or downgrade
  body: 'If you wish to stop your investments or reduce your commitment, follow these
    steps to cancel, close, or downgrade your Mutual Fund SIP.


    Prerequisites:

    - Access to your registered account via MFA.

    - Clear knowledge of the specific SIP folio you wish to modify.


    Steps to Cancel or Downgrade:

    1. Tell us which active SIP you wish to modify (cancel or downgrade) and the effective
    date for the change.

    2. Provide the new monthly amount if you are downgrading (ensuring it is not below
    the minimum SIP amount of ₹500).

    3. Confirm the request through a mandatory MFA verification to ensure the security
    of your portfolio.

    4. We will process the request and provide a confirmation notification once the
    SIP is stopped or the amount is reduced.


    Steps to Close (Redeem All Units):

    1. Ask us to redeem all existing units in your Mutual Fund SIP folio.

    2. We will inform you of any applicable exit loads; specifically, if any units
    are redeemed within 365 days, a 1% exit load will be applied.

    3. Confirm the redemption via MFA.

    4. We will initiate the transfer of funds to your registered bank account. You
    will receive a transaction confirmation once the units are liquidated.


    Your request is successful when you receive the formal confirmation notice in
    your registered email or via our secure chat history.'
