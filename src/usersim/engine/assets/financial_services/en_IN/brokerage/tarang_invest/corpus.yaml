- id: 9f12df33-fb9d-5ff7-b219-b63fcf5e8b3f
  title: Margin Trading Facility — account security best practices
  body: "Using the Margin Trading Facility involves leveraging your assets, which\
    \ makes the security of your account paramount. To protect your portfolio and\
    \ your pledged securities, we require all customers to adhere to strict security\
    \ protocols.\n\nAt Tarang Invest, we employ multi-factor authentication (MFA)\
    \ and e-KYC for all state-changing actions. This means any request to withdraw\
    \ funds, change your portfolio allocation, or modify your margin settings will\
    \ require a second layer of verification. \n\nCrucial Security Guidelines:\n1.\
    \ We will never ask you for your MFA codes, passwords, or e-KYC pins over the\
    \ phone, email, or chat. Any person requesting these details is attempting a fraudulent\
    \ act.\n2. Be wary of 'guaranteed return' schemes. We hold a standard of transparency\
    \ and never project or guarantee returns on any investment, including those made\
    \ via margin leverage.\n3. Regularly monitor your pledge status and interest accruals\
    \ (calculated at an annual interest rate of 14.99%) to ensure all activity is\
    \ authorised.\n\nWhat to do if you suspect unauthorised access:\nIf you notice\
    \ an unexpected pledge or a transaction you did not initiate, inform us immediately\
    \ via our secure chat or email. We maintain a zero-tolerance policy towards fraud.\
    \ Once reported, our team will acknowledge the query within 24 hours, and we aim\
    \ to resolve the dispute within a standard 7-15 business day window.\n\nImmediate\
    \ action: If you suspect your account is compromised, ask us to freeze all outgoing\
    \ transfers and margin withdrawals instantly while we conduct a security audit."
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 462c974d-d9d4-5232-8742-1b54070fe636
  title: Margin Trading Facility — change-of-terms policy
  body: "This document outlines the policy regarding modifications to the terms governing\
    \ the Margin Trading Facility at Tarang Invest. By using this facility, you agree\
    \ to the following conditions:\n\n1. Rate and Fee Adjustments: We reserve the\
    \ right to modify the annual interest rate of 14.99%, the minimum margin requirement\
    \ of 25%, and the pledge charge per scrip of ₹20. Any such changes are driven\
    \ by regulatory updates from SEBI, NSE, or BSE, or by essential infrastructure\
    \ costs to maintain operational sustainability.\n\n2. Notice Period: In the event\
    \ of a change to fees or interest rates, we will provide a minimum of 30 calendar\
    \ days' notice via your registered email and our digital communication channels.\
    \ \n\n3. Client Obligations: The client is obligated to maintain the minimum margin\
    \ of 25% at all times. Failure to maintain this threshold may trigger a margin\
    \ call, requiring the immediate deposit of funds or the sale of securities to\
    \ cover the shortfall.\n\n4. Acceptance of Terms: Continued use of the Margin\
    \ Trading Facility after the notice period expires constitutes your formal acceptance\
    \ of the new terms. If you do not agree to the changes, you must ask us to close\
    \ your margin account or liquidate your leveraged positions before the effective\
    \ date.\n\n5. Termination: Either party may terminate this agreement with written\
    \ notice. Upon termination, all outstanding interest calculated at the prevailing\
    \ annual interest rate of 14.99% and any pending pledge charges of ₹20 per scrip\
    \ must be settled in full before securities are unpledged.\n\nDisclaimer: Investments\
    \ are subject to market risks. We provide educational resources but defer individualized\
    \ financial planning advice."
