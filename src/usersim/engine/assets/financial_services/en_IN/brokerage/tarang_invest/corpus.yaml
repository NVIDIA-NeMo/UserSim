- id: d2b39c72-2ad8-5ee4-b9aa-bc73811169f8
  title: ELSS Tax-Saver Fund — when to switch or upgrade
  body: "Determining whether to maintain your ELSS Tax-Saver Fund or move towards\
    \ other wealth-building tools depends on your tax needs and liquidity requirements.\n\
    \nWhen to stay with ELSS Tax-Saver Fund:\n- You are actively seeking a tax deduction\
    \ under Section 80C (up to the ₹150000 cap).\n- You have a long-term horizon and\
    \ are comfortable with a mandatory lock-in period of 3 years.\n\nWhen to switch\
    \ or add other products:\n- If you need liquidity: Switch to a Mutual Fund SIP,\
    \ which does not have a statutory 3 year lock-in (though it may have a shorter\
    \ Exit Load period). \n- If you have already exhausted the ₹150000 Section 80C\
    \ limit: Further investments in ELSS provide no additional tax benefit. In this\
    \ case, moving additional capital to a standard Mutual Fund SIP or a Demat & Trading\
    \ Account for equity delivery may be more appropriate.\n\nComparison Summary:\n\
    - ELSS Tax-Saver Fund: 3 year lock-in, tax benefits up to ₹150000, market-linked\
    \ growth.\n- Mutual Fund SIP: No statutory lock-in, no specific Section 80C tax\
    \ benefit, flexible pause options.\n\nWho it suits:\nELSS is best for salaried\
    \ individuals in taxable brackets. Standard SIPs are better for those prioritizing\
    \ flexibility and liquidity."
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: comparison
