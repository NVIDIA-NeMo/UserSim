- id: 44eb0498-524e-5d4c-ac35-18ea4fa1e964
  title: Mutual Fund SIP — choosing between tiers or options
  body: 'When choosing how to build your wealth, you may be deciding between a Mutual
    Fund SIP and a one-time lump sum investment.


    **Mutual Fund SIP**

    - **Cost:** Low entry barrier with a minimum SIP amount of ₹500.

    - **Flexibility:** High. You can pause your investments for a maximum of 6 months.

    - **Risk:** Averages the cost of purchase over time (Rupee Cost Averaging), reducing
    the impact of market volatility.

    - **Exit:** 1% Exit Load applies if redeemed within 365 days.


    **Lump Sum Investment**

    - **Cost:** Higher initial capital required.

    - **Flexibility:** Low; once invested, the capital is deployed immediately.

    - **Risk:** High exposure to the market price at the specific time of investment.

    - **Exit:** Similar Exit Load of 1% applies if redeemed within 365 days.


    **Which one should you choose?**

    - **Mutual Fund SIP** is best for retail investors who prefer disciplined, regular
    saving and wish to mitigate market timing risks.

    - **Lump Sum** is better for those with a large windfall who have a high risk
    appetite and believe the current market is undervalued.


    Disclaimer: All mutual fund investments are subject to market risks.'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 65ff986b-8c28-51ed-b81f-b09d39aec28c
  title: Mutual Fund SIP — privacy and data handling
  body: 'At Tarang Invest, we adhere to strict data privacy norms and compliance frameworks
    steered by SEBI and AMFI to ensure the protection of our investors.


    **Data Collection and Use**

    To facilitate your Mutual Fund SIP, we collect and process your personal identity
    details, bank account information for mandates, and e-KYC documentation. This
    data is used exclusively for the execution of trades, regulatory reporting, and
    identity verification.


    **Verification Protocols**

    We employ mandatory Multi-factor authentication (MFA) and e-KYC before any state-changing
    action is performed. This ensures that requests to change your SIP amount (minimum
    ₹500), pause your SIP (up to 6 months), or redeem units are authorised by the
    account holder.


    **Third-Party Sharing**

    Your data is shared only with necessary regulatory bodies (such as SEBI, NSE,
    and BSE) and the respective Asset Management Companies (AMCs) managing the mutual
    funds in which you invest. We never sell your personal investment data to third-party
    marketers.


    **Data Security and Disputes**

    We maintain a zero-tolerance policy towards fraud. In the event of a data dispute
    or unauthorised account activity, we acknowledge the query within 24 hours and
    strive for resolution within 7-15 business days. All records are maintained according
    to statutory retention periods required by Indian law.


    **Market Risk Disclosure**

    Mutual fund investments are subject to market risks. Please note that the Exit
    Load of 1% for redemptions within 365 days is a cost of the fund and not a fee
    charged by Tarang Invest for its infrastructure. We provide educational resources
    but strictly defer individualized financial planning advice.'
