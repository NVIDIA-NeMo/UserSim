- id: e220e3ec-05ef-5909-8a44-b9cfd0f4d6ff
  title: ELSS Tax-Saver Fund — access or login problems
  body: 'If you are unable to access your account to view your ELSS Tax-Saver Fund
    portfolio, follow these steps to resolve the issue.


    Symptom: ''I cannot log in to my account'' or ''My MFA code is not arriving''.


    Likely Causes:

    - Incorrect credentials or expired session.

    - Network latency affecting OTP/MFA delivery.

    - Account freeze due to pending e-KYC updates.


    What to check and do:

    1. Verify Credentials: Ensure you are using the correct registered mobile number
    and password. Try triggering a password reset if you suspect the password is incorrect.

    2. Check MFA Delivery: Ensure your device has a stable network connection. Wait
    60 seconds before requesting a new OTP to avoid system conflicts.

    3. Review KYC Status: Check if you have received any notices regarding expired
    documentation. If your identity verification has lapsed, MFA may be temporarily
    restricted for security.


    Fixing the issue:

    - If it is a credential issue, we will guide you through a secure password reset
    process involving your registered email and phone.

    - If it is an MFA failure, we can trigger a manual verification via your registered
    email to grant temporary access.

    - If the account is frozen for KYC, we will initiate a fresh e-KYC process during
    the conversation.


    Escalation:

    If the issue persists after these steps, we will raise a high-priority ticket
    to our technical team. You will receive an acknowledgement within 24 hours, and
    the access issue will be resolved within our standard 7-15 business day window.
    Our Compliance Officer will be notified if the lock-out is due to a regulatory
    freeze.'
