- id: 3cfbab69-df39-5b44-bc6f-57dc23a8509b
  title: Mutual Fund SIP — recognizing scams targeting this product
  body: "At Tarang Invest, we are committed to your financial safety. Because a Mutual\
    \ Fund SIP is a disciplined, long-term wealth-building tool, fraudsters often\
    \ target these accounts using 'guaranteed return' lures. \n\nCommon Scam Patterns:\n\
    1. The 'Assured Return' Promise: You may receive messages from individuals claiming\
    \ to be advisors who guarantee a specific percentage of return on your SIP. We\
    \ strictly adhere to a standard of transparency and never project or guarantee\
    \ returns on any investment. Any promise of a fixed profit is a red flag.\n2.\
    \ The Urgent Account Verification: Scammers may call claiming your SIP is about\
    \ to be cancelled due to a KYC failure, asking you to click a link to 'verify'\
    \ your identity. We will never ask you to share your password, MFA codes, or OTPs\
    \ via a link or phone call.\n3. Third-Party Payment Requests: You might be asked\
    \ to transfer your SIP amount to a personal bank account instead of the official\
    \ fund house or through our secure platform. Always ensure funds move through\
    \ authorized channels.\n\nWhat we will NEVER ask for:\n- Your login password or\
    \ Multi-factor authentication (MFA) codes.\n- Payments to be made to an individual's\
    \ personal account for your Mutual Fund SIP.\n- Immediate action based on a 'guaranteed'\
    \ profit opportunity.\n\nFirst Action to Take:\nIf you encounter any suspicious\
    \ communication or notice an unauthorized change in your SIP settings, notify\
    \ us immediately via our digital chat or email. All security-related reports are\
    \ acknowledged within 24 hours. For detailed account protection steps, you may\
    \ refer to Mutual Fund SIP — fraud and unauthorized-activity protection.\n\n***Disclaimer:\
    \ Mutual fund investments are subject to market risks; read all scheme related\
    \ documents carefully.***"
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: security_advisory
  source_authority: official
