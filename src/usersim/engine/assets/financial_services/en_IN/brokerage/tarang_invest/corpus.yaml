- id: 9d5e1b32-57a7-5e0d-b47c-84aca3123e98
  title: Demat & Trading Account — resolve a common request end-to-end
  body: 'One of the most common requests is the closure of a Demat & Trading Account.
    Here is the end-to-end process to ensure a clean exit.


    **Prerequisites**

    - All open positions must be squared off (closed).

    - Your account balance must be zero, or you must specify where to transfer remaining
    funds.

    - All pledged securities must be unpledged.


    **Steps to Close Your Account**

    1. Tell us that you wish to close your Demat & Trading Account.

    2. We will initiate a mandatory identity verification via MFA to prevent unauthorised
    account closure.

    3. We will then check for any outstanding dues, such as an unpaid annual maintenance
    charge of ₹300 or pending intraday brokerage of ₹20 per order.

    4. You will be asked to either withdraw your remaining balance or transfer your
    existing shares to another depository participant. Note that any final sell transactions
    to clear the account will incur the standard DP Charges of ₹13.5 per transaction.

    5. Once the account is clear of holdings and dues, we will process the closure
    request according to SEBI and exchange frameworks.


    **How you know it worked**

    We will provide a final closure confirmation and a closing statement. You will
    receive a notification once the account is officially deactivated and you can
    no longer execute trades.'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
