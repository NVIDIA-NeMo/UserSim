- id: 065026bd-37bf-5691-88f2-919891d00a69
  title: Recurring Deposit — vs. a similar product here
  body: 'When choosing between a Recurring Deposit and a 1-Year Fixed Deposit, the
    primary decision factor is how you wish to invest your capital.


    **Recurring Deposit**

    - **Investment Style**: Periodic monthly savings.

    - **Entry Point**: Minimum monthly installment of ₹500.

    - **Returns**: 6.8% interest rate.

    - **Commitment**: 24 months tenure.

    - **Best For**: Those who want to build a corpus from their monthly salary.


    **1-Year Fixed Deposit**

    - **Investment Style**: One-time lump sum deposit.

    - **Entry Point**: Requires a single upfront deposit (refer to 1-Year Fixed Deposit
    — minimum deposit explained).

    - **Returns**: Fixed rate for a shorter 12-month horizon.

    - **Best For**: Those who already have a lump sum and want guaranteed returns
    over a shorter period.


    Choose the Recurring Deposit if you prefer a disciplined, gradual saving approach.
    Choose the 1-Year Fixed Deposit if you have immediate capital to deploy.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: df17f794-ee43-5230-9695-f5533d858016
  title: Recurring Deposit — regulatory disclosures
  body: 'This document provides the regulatory framework and disclosures governing
    the Recurring Deposit product at Chandrika Bank.


    **Deposit Protection**

    In accordance with Indian regulatory standards, all deposits held within this
    Recurring Deposit account are protected by the Deposit Insurance and Credit Guarantee
    Corporation (DICGC). This insurance covers up to ₹5,00,000 per depositor, including
    both principal and interest.


    **Interest and Taxation**

    Interest is credited at a rate of 6.8%. Please note that interest earned on Recurring
    Deposits is subject to Tax Deducted at Source (TDS) as per the prevailing Income
    Tax Act of India. We provide financial education regarding these products but
    do not offer individualised tax or legal advice.


    **Payment Discipline**

    To maintain the agreed-upon maturity value and tenure of 24 months, installments
    must be paid promptly. A missed installment penalty of ₹10 is applied to each
    payment missed. Frequent defaults may impact the final interest payout calculation.


    **Regulatory Compliance**

    Chandrika Bank adheres strictly to RBI and NPCI frameworks. All disputes related
    to this product are handled according to the RBI''s harmonised turn-around-time
    (TAT) framework to ensure prompt resolution. If a dispute remains unresolved through
    our internal nodal officers, customers may approach the RBI Integrated Ombudsman
    Scheme.


    ***

    Legal Disclaimer: This disclosure is for informational purposes. Detailed binding
    obligations are contained in the Recurring Deposit — account agreement.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8205406e-2b45-5407-8a05-327b924c4fc0
  title: Recurring Deposit — interest rate / APY schedule
  body: "We offer a transparent and competitive return on your disciplined savings.\
    \ \n\n**Current Interest Rate**\nFor the Recurring Deposit product, a flat interest\
    \ rate of 6.8% applies to all account holders, regardless of the monthly installment\
    \ amount, provided the minimum of ₹500 is met.\n\n**Application of Rate**\nThis\
    \ rate is applied to the principal amount deposited monthly over the total tenure\
    \ of 24 months. Interest is compounded as per bank policy and credited upon the\
    \ maturity of the deposit.\n\n**Factors Affecting Returns**\n- **Consistency**:\
    \ While the rate remains 6.8%, the actual interest earned is dependent on the\
    \ timely payment of installments. Each missed installment may incur a penalty\
    \ of ₹10 and reduce the total interest accrued on that specific portion of the\
    \ principal.\n- **Premature Withdrawal**: Withdrawing funds before the 24 months\
    \ tenure ends may result in a lower interest rate or a penalty, as outlined in\
    \ the account agreement."
