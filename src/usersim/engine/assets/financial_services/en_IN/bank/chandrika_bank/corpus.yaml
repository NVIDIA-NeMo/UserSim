- id: 590d425c-d0ff-5049-a165-566557f1a39b
  title: Regular Savings Account — vs. a typical competitor offering
  body: 'When comparing the Regular Savings Account to typical market offerings, the
    choice depends on your preference for stability and digital ease.


    **Chandrika Bank Regular Savings Account**

    - **Cost:** Monthly Average Balance (MAB) of ₹10,000; below MAB charge of ₹500.

    - **Yield:** A steady savings interest rate of 3.5%.

    - **Access:** 5 free ATM transactions per month and a ₹250 annual debit card fee.

    - **Security:** Strictly follows RBI/NPCI frameworks with DICGC insurance up to
    ₹5,00,000.


    **Typical Competitor Offerings**

    Competitors may offer ''Zero Balance'' accounts, which remove the MAB pressure
    but often come with lower interest rates or more restrictive debit card limits
    and higher transaction fees.


    **Which one suits you?**

    - **Choose Chandrika Bank** if you are a salaried professional or middle-income
    household who values a traditional, trust-centric institution and can maintain
    ₹10,000 to ensure a seamless, fee-free experience.

    - **Choose a Competitor** if you cannot commit to a minimum balance and are willing
    to trade off higher stability or better interest for the flexibility of a zero-balance
    structure.'
