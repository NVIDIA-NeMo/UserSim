- id: 567c5b79-0252-5121-838c-af3550d9cc69
  title: 1-Year Fixed Deposit — fraud and unauthorized-activity protection
  body: 'At Chandrika Bank, the security of your long-term savings is our highest
    priority. When comparing our 1-Year Fixed Deposit against other investment alternatives,
    it is important to understand how we protect your principal and the specific fraud
    patterns to watch for.


    Fraudsters often target fixed deposit holders by pretending to be bank officials
    offering ''special'' interest rates higher than our standard 7.1% in exchange
    for an upfront processing fee or account access. Please be aware that Chandrika
    Bank will never ask you for your UPI PIN, OTPs, or CVVs to manage or renew your
    deposit. Any request for these sensitive credentials is a clear sign of fraudulent
    activity.


    Another common tactic involves ''phishing'' emails or messages claiming your 1-Year
    Fixed Deposit has matured prematurely or requires urgent verification to avoid
    a penalty. We will never ask you to click an external link to provide PAN details
    or passwords to ''save'' your deposit.


    If you notice any unauthorized activity or receive a suspicious request, you must
    report it immediately through our dedicated fraud reporting path. Under the RBI''s
    harmonised turn-around-time (TAT) framework, prompt reporting is essential to
    minimize your liability. The sooner the fraud is reported, the higher the likelihood
    of recovering funds and ensuring a swift resolution.


    Your deposits are further secured by the DICGC Insurance scheme, which protects
    your funds up to ₹5,00,000 per depositor, providing a layer of stability that
    many unregulated investment alternatives cannot offer.


    ***

    Disclaimer: This advisory is for educational purposes. Protection is subject to
    the timely reporting of fraud as per bank and RBI guidelines.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b80548c0-609f-5e64-879d-7fde313b3f60
  title: 1-Year Fixed Deposit — account agreement
  body: 'This agreement outlines the binding terms between Chandrika Bank and the
    depositor for the 1-Year Fixed Deposit product.


    1. Deposit Obligations: The customer agrees to deposit a minimum deposit of ₹10,000
    to open the account. Funds must be held for a tenure of 12 months to qualify for
    the full maturity value.


    2. Interest Accrual: We agree to provide a standard interest rate of 7.1%. For
    eligible senior citizens, an additional senior citizen extra rate of 0.5% will
    be applied to the base rate.


    3. Premature Withdrawal: The depositor may request to close the deposit before
    the 12-month tenure expires. Such an action is termed a Premature Withdrawal and
    will incur a premature withdrawal penalty of 1% deducted from the applicable interest
    rate.


    4. Regulatory Compliance: This account is governed by RBI and NPCI frameworks.
    All deposits are insured by the DICGC up to a limit of ₹5,00,000 per depositor.


    5. Amendments: Chandrika Bank reserves the right to modify these terms with prior
    notice to the customer. Continued maintenance of the deposit after such notice
    constitutes acceptance of the new terms.


    6. Termination: The agreement ends naturally upon the completion of the 12-month
    tenure and payment of the principal and interest, or upon the execution of a Premature
    Withdrawal.


    ***

    Disclaimer: This document is a legal agreement. Please ensure all terms are understood
    before booking the deposit.'
