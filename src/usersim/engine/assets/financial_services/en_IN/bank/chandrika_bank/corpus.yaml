- id: b5c81a83-9c2d-5c3b-8761-7b97baced4e9
  title: Recurring Deposit — a failed or pending action
  body: 'If you notice that your monthly installment has not been debited or is showing
    as ''pending'' in your records, please follow these steps to resolve the issue.


    **Symptom**: The monthly deposit amount has not been deducted from the linked
    savings account, or you have received a notification regarding a missed payment.


    **Likely Causes**

    - Insufficient funds in the linked Regular Savings Account on the due date.

    - An expired or inactive mandate for the automatic transfer.

    - Technical delays on the NPCI rails if the transfer was triggered via a digital
    payment suite.


    **Resolution Steps**

    1. **Check Balance**: Verify that your linked savings account has at least the
    minimum monthly installment of ₹500 plus any applicable fees.

    2. **Review Mandate**: Confirm with us that your auto-debit instruction is still
    active and has not expired.

    3. **Manual Payment**: If the auto-debit failed, you may ask us to process a manual
    installment immediately to prevent further delays.


    **Escalation**

    If you have sufficient funds and a valid mandate but the payment still fails,
    please notify us immediately. We will raise a technical investigation case with
    our back-end team. You will receive a case reference number and a resolution update
    within the RBI''s harmonised turn-around-time (TAT) framework. If the failure
    was due to a bank error, we will waive the missed installment penalty of ₹10 for
    that specific period.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 34e587de-70d9-5ec3-8d12-d3f3c9913055
  title: Recurring Deposit — eligibility requirements
  body: 'To open or maintain a Recurring Deposit, customers must meet the following
    criteria:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Identity Verification | Valid PAN and completed KYC | Eligible to open account
    |

    | Funding Source | Active Chandrika Bank Savings Account | Eligible for auto-debit
    setup |

    | Monthly Commitment | Minimum ₹500 per month | Account activation approved |

    | Account Status | No active fraud blocks on profile | Eligible for deposit products
    |


    Customers who do not meet the minimum monthly installment of ₹500 will be unable
    to open a Recurring Deposit account. For documentation requirements, please refer
    to Recurring Deposit — required documentation.'
