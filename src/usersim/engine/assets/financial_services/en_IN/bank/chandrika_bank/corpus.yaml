- id: 68834472-0f76-53dd-b510-62de48b3cc74
  title: Recurring Deposit — referral and loyalty offer
  body: 'We are pleased to introduce our Loyalty Rewards Program for the Recurring
    Deposit. From 1 November 2024 to 31 January 2025, we are offering a special incentive
