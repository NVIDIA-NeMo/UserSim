- id: 556ef80a-6d1f-5720-b637-b3a04c3a56d5
  title: 1-Year Fixed Deposit — who it is best for and common use cases
  body: 'The 1-Year Fixed Deposit is a low-risk, high-yield investment designed for
    stability and guaranteed returns over a twelve-month horizon. Unlike a liquid
    savings account, this product is built for funds you do not need for immediate
    daily expenses but wish to keep safe and growing.


    Who is this best for?

    - Salaried professionals seeking a safe place to park their annual bonus.

    - Middle-income households saving for a specific goal one year away (e.g., annual
    insurance premiums or school fees).

    - Senior citizens looking for a secure, guaranteed income stream with enhanced
    yields.

    - First-time investors who prefer the stability of traditional deposits over market-linked
    instruments.


    Common Use Cases:

    - Emergency Fund Layering: Keeping a portion of your safety net in a 1-Year Fixed
    Deposit to earn more than a regular savings account while keeping the tenure manageable.

    - Short-term Target Saving: Setting aside a minimum deposit of ₹10,000 to ensure
    a disciplined saving habit for a future purchase.


    Key Product Specifications:

    - Tenure: 12 months

    - Interest Rate: 7.1%

    - Senior Citizen Bonus: An extra 0.5% interest rate

    - Minimum Deposit: ₹10,000

    - Premature Withdrawal Penalty: 1%

    - Protection: DICGC insurance covers up to ₹5,00,000


    For those who need more flexibility for daily spending, we recommend reviewing
    the Regular Savings Account — overview.'
