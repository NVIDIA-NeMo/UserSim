- id: 1ff94c59-b52d-541b-95d6-7ebc8674005b
  title: Chandrika Everyday Credit Card — cancel, close, or downgrade
  body: 'If you wish to stop using your Chandrika Everyday Credit Card, please follow
    these steps to ensure a clean closure of your account:


    1. Clear Outstanding Dues: Before requesting closure, ensure all pending transactions,
    including the monthly finance charge of 3.5% on any carried-over balances, are
    paid in full. We will confirm the exact final settlement amount to you.

    2. Request Closure: Tell us that you wish to close your credit card account. For
    security, we will perform a multi-factor authentication check to verify your identity.

    3. Confirm Waiver Status: If you have already met the ₹150,000 spend milestone,
    we will confirm that no further annual fees of ₹500 are pending.

    4. Card Disposal: Once we confirm the account is closed, you are required to physically
    destroy the card by cutting through the magnetic stripe and the EMV chip.

    5. Receive Confirmation: We will provide a formal closure confirmation via your
    registered communication channel. This document serves as proof that you have
    no further liabilities toward this card.


    If you find the annual fee of ₹500 too high but wish to keep a credit line, you
    may ask us about downgrading to a different product if eligible.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 13cc082b-e654-507e-baaa-96c7cbac8c05
  title: Chandrika Everyday Credit Card — an unexpected charge or amount
  body: 'If you notice a charge on your statement that you do not recognise or an
    amount that seems incorrect, please follow these steps:


    1. Verify the Transaction: Check if the charge is a recurring subscription or
    a pending authorisation. Confirm if the amount matches the purchase price plus
    any applicable taxes.

    2. Check for Finance Charges: If you did not pay your previous statement in full,
    you will see a monthly finance charge of 3.5%. Check if the ''unexpected'' amount
    aligns with this percentage of your outstanding balance.

    3. Review Fee Milestones: If you see a charge of ₹500, check if it is the joining
    fee (for new cards) or the annual fee. If you believe you spent ₹150,000 and should
    have received a waiver, verify your total annual spend in your statements.

    4. Report the Discrepancy: Tell us the specific transaction date and amount. We
    will then investigate the charge.


    Resolution Process:

    - For billing errors: We will review the merchant data. If an error is found,
    we will apply a reversal to your account.

    - For disputes: We handle disputes according to the RBI''s harmonised turn-around-time
    (TAT) framework to ensure prompt resolution and compensation.

    - For fraud: If the charge is unauthorised, we will route the case through our
    dedicated fraud reporting path to minimise your liability.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
