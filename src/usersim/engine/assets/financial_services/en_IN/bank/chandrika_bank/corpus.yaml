- id: 3ce47162-5f3a-5d13-91c9-20292284e4ad
  title: UPI & Bill Payments — vs. a typical competitor offering
  body: 'When comparing Chandrika Bank''s UPI & Bill Payments with typical market
    competitors, the primary differences lie in stability and integrated limits.


    While many competitors offer basic UPI, we integrate our service deeply with our
    trust-centric retail banking, ensuring that your deposits are protected by DICGC
    insurance up to ₹5,00,000.


    Key Comparison Points:

    - Transaction Limits: We provide a robust per transaction limit of ₹100000 and
    a daily limit of ₹100000, which is competitive for retail users.

    - Micro-payments: Our UPI Lite per transaction limit of ₹500 is aligned with NPCI
    standards for speed and convenience.

    - Automated Payments: We offer autopay mandates with a clear ₹15000 cap for those
    without Additional Factor Authentication (AFA), providing a balance of convenience
    and security.


    Who it suits:

    - Our offering is best for customers who prefer the security of a traditional
    bank with the agility of modern NPCI rails.

    - A competitor''s standalone wallet might suit those who do not wish to link a
    bank account, but they lack the stability and insurance of our integrated approach.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cfb84d5a-77e5-53cc-a63e-23ff853d514c
  title: UPI & Bill Payments — risk disclosures
  body: "This disclosure provides essential information regarding the risks associated\
    \ with using UPI & Bill Payments.\n\n1. Operational Risk: UPI & Bill Payments\
    \ operate on the NPCI rails. Any downtime, technical failure, or maintenance within\
    \ the National Payments Corporation of India infrastructure may result in transaction\
    \ delays or failures.\n\n2. Limit Risks: Users are subject to a per transaction\
    \ limit of ₹100000 and a daily limit of ₹100000. Failure to account for these\
    \ limits may lead to declined payments for urgent needs.\n\n3. Autopay Risks:\
    \ By setting up an autopay mandate, you authorise the bank to debit funds automatically.\
    \ For mandates without Additional Factor Authentication (AFA), these are capped\
    \ at ₹15000. It is the customer's responsibility to monitor these mandates to\
    \ avoid unintended debits.\n\n4. UPI Lite Risks: UPI Lite is designed for small-value\
    \ transactions with a per transaction limit of ₹500. Funds moved to the UPI Lite\
    \ wallet are held separately from the main account and may have different reconciliation\
    \ timelines.\n\n5. Fraud Risk: Digital payments are susceptible to phishing and\
    \ social engineering. Chandrika Bank enforces a 'Verify First' policy; however,\
    \ the customer remains responsible for the secrecy of their UPI PIN. \n\nAll disputes\
    \ are handled in strict accordance with the RBI's harmonised turn-around-time\
    \ (TAT) framework to ensure fair treatment and prompt resolution."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8d114760-eb3e-578e-875a-2e3f3b6e5d7c
  title: UPI & Bill Payments — how rates are tiered and applied
  body: 'UPI & Bill Payments is designed as a utility service to facilitate seamless
    digital transactions. As such, there are no tiered interest rates or yields associated
    with the payment suite itself.


    Standard Usage:

    - Person-to-Person (P2P) and Person-to-Merchant (P2M) transactions are processed
    without a service fee for the customer, regardless of the amount, up to the per
    transaction limit of ₹100000.

    - UPI Lite transactions (up to ₹500) are similarly processed without a per-transaction
    fee.

    - Autopay mandates, including those capped at ₹15000 without AFA, do not incur
    separate setup fees from the bank.


    Factors that may affect costs:

    While Chandrika Bank does not charge for these UPI services, certain third-party
    billers may apply their own convenience fees for bill payments. These are external
    to the bank''s rate structure. To maintain the account used for these payments
    without incurring account maintenance fees, please refer to Regular Savings Account
    — monthly average balance explained.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d4ca644a-540e-51fa-9722-d177e6fa4209
  title: Institution-wide fees and charges
  body: "At Chandrika Bank, we structure our fees to ensure the long-term sustainability\
    \ of our accounts and to encourage disciplined financial habits among our customers.\
    \ \n\nOur general fee philosophy focuses on rewarding active engagement. For instance,\
    \ we encourage the maintenance of the Monthly Average Balance (MAB) to ensure\
    \ fee-free utility across our retail offerings. To reward our loyal customers\
    \ and those who meet specific spending milestones, we offer targeted fee waivers.\n\
    \nWhile some charges are standard across all account types to cover basic administrative\
    \ costs, many fees are product-specific. For detailed breakdowns of costs associated\
    \ with a particular account, please refer to the specific fee schedule for that\
    \ product, such as the Regular Savings Account — fee schedule or the Chandrika\
    \ Everyday Credit Card — fee schedule. We remain committed to transparency and\
    \ will notify customers of any changes to our fee structures in accordance with\
    \ regulatory guidelines."
