- id: 8d0e3ab2-9e4f-562e-a68a-5455961dea65
  title: Recurring Deposit — set up and activate
  body: 'Setting up your Recurring Deposit is a straightforward process designed to
    integrate seamlessly with your existing banking relationship with us.


    **Prerequisites**

    Before beginning, please ensure you have an active Regular Savings Account with
    Chandrika Bank and a valid PAN for KYC verification.


    **Steps to Activate**

    1. Tell us that you wish to open a Recurring Deposit. We will first verify your
    identity using your PAN-based KYC and multi-factor authentication to ensure your
    security.

    2. Specify the monthly amount you wish to save. Please note that the minimum monthly
    installment is ₹500.

    3. Confirm the tenure of the deposit. Our standard Recurring Deposit is set for
    a duration of 24 months.

    4. Instruct us on the funding source. We recommend selecting your Regular Savings
    Account for automatic monthly debits to avoid the missed installment penalty of
    ₹10.

    5. Review the interest rate of 6.8% and the final maturity value we provide.

    6. Provide your digital consent to the terms and conditions.


    **Confirmation**

    Once the process is complete, we will provide you with a Deposit Advice document
    containing your account number, the monthly installment amount, the 24 months
    tenure, and the maturity date. You will see the first installment debited from
    your savings account immediately upon activation.'
