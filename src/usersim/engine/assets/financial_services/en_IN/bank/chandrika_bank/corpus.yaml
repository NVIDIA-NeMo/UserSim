- id: c12a763d-1b20-53ca-9495-d451aa518fd0
  title: Chandrika Everyday Credit Card — fraud and unauthorized-activity protection
  body: 'At Chandrika Bank, we are committed to ensuring your spending remains secure.
    The Chandrika Everyday Credit Card is a target for specific fraud patterns, including
    ''phishing'' via SMS or email where attackers pretend to be bank officials claiming
    your card has been blocked, or ''vishing'' calls requesting your details to ''update''
    your KYC.


    To protect your account, please remember that we follow a strict ''Verify First''
    policy. We will never ask you for sensitive credentials, including your UPI PIN,
    OTPs, or the CVV on the back of your card. Any request for these details is a
    fraudulent attempt and should be ignored immediately.


    If you notice any unauthorized transactions or suspect your card details have
    been compromised, the first action you must take is to ask us to freeze your card
    immediately to prevent further loss. Prompt reporting is critical; fraudulent
    activity is routed through a dedicated reporting path to minimise your liability
    based on reporting timelines, in accordance with RBI guidelines.


    ***

    Legal Disclaimer: Liability for unauthorized transactions is determined by the
    timeline of reporting as per RBI frameworks and the bank''s internal security
    policies.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ba23491d-cffd-5ff6-b862-8d338cc03b3b
  title: Chandrika Everyday Credit Card — account agreement
  body: 'This account agreement governs the use of the Chandrika Everyday Credit Card.
    By activating the card, you agree to the following terms:


    1. Fees and Charges: A joining fee of ₹500 is applicable upon account opening.
    Subsequently, an annual fee of ₹500 will be charged to the account. We provide
    a waiver of this annual fee if the cardholder achieves a total annual spend of
    ₹150,000 or more.


    2. Interest and Finance Charges: Any balance remaining unpaid after the due date
    will attract a monthly finance charge of 3.5%, which equates to an annualised
    finance charge of 42%. These charges are calculated on the outstanding balance
    from the date of the transaction.


    3. Rewards: Cardholders earn rewards at a reward rate of 1% on eligible spends,
    subject to the bank''s internal reward terms.


    4. Obligations: The cardholder is obligated to maintain a valid PAN-based KYC
    and provide multi-factor authentication for state-changing actions. The bank reserves
    the right to modify fees or interest rates with prior notice to the customer.


    5. Termination: This agreement ends upon the closure of the credit account by
    either the bank or the customer. All outstanding balances, including accrued finance
    charges, must be cleared in full before the account is officially closed.


    ***

    Legal Disclaimer: This document constitutes a binding agreement. Please refer
    to the Chandrika Everyday Credit Card — regulatory disclosures for further legal
    information.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 11e03787-db86-5541-ae5f-191bcc470b76
  title: Chandrika Everyday Credit Card — who it is best for and common use cases
  body: "The Chandrika Everyday Credit Card is designed as a versatile spending tool,\
    \ ideal for middle-income Indian households and salaried professionals who seek\
    \ a balance between credit flexibility and rewarding daily usage. \n\nThis card\
    \ is best suited for:\n- The Disciplined Spender: Those who pay their bills in\
    \ full every month to avoid the monthly finance charge of 3.5% (42% annualised)\
    \ while benefiting from the 1% reward rate.\n- The High-Utility User: Customers\
    \ who spend more than ₹150,000 annually, allowing them to enjoy the card's benefits\
    \ with a full annual fee waiver.\n- The Budget-Conscious Professional: Those looking\
    \ for a stable credit line for lifestyle expenses without complex tier structures.\n\
    \nCommon Use Cases:\n- Daily Grocery and Fuel: Use the card for routine household\
    \ expenses to accumulate rewards at a rate of 1%.\n- Large Annual Purchases: Leveraging\
    \ the credit limit for electronics or travel, while managing repayments to avoid\
    \ finance charges.\n- Building Credit History: For salaried professionals establishing\
    \ a footprint with a traditional-voice institution.\n\nKey Financials:\n- Joining\
    \ Fee: ₹500\n- Annual Fee: ₹500\n- Annual Fee Waiver Threshold: ₹150,000 spend\n\
    - Reward Rate: 1%\n- Monthly Finance Charge: 3.5%\n- Annualised Finance Charge:\
    \ 42%"
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
