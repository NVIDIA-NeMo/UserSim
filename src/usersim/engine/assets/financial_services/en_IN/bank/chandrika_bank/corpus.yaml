- id: 0f3574b1-335d-537f-8d4b-15b13a6f7ed2
  title: 1-Year Fixed Deposit — cancel, close, or downgrade
  body: 'If your financial needs change, you may request to close your 1-Year Fixed
    Deposit before its 12-month maturity. This process is handled as a Premature Withdrawal.


    Before you begin:

    - Ensure you have your account details and PAN-based KYC verification ready.

    - Be aware that closing the account early will trigger a premature withdrawal
    penalty of 1% on the interest.


    Steps to close your deposit:

    1. Tell us that you wish to prematurely close your 1-Year Fixed Deposit. Provide
    the specific deposit account number you wish to liquidate.

    2. We will verify your identity using multi-factor authentication as per our ''Verify
    First'' policy.

    3. We will calculate the final payout, which includes your original principal
    (minimum ₹10,000 or more) and the accrued interest minus the 1% premature withdrawal
    penalty.

    4. Confirm the destination account (usually your linked savings account) where
    the funds should be transferred.

    5. We will process the closure and provide you with a confirmation of the total
    amount credited to your account.


    How you know it worked:

    - You will receive a transaction notification for the credit of the principal
    and adjusted interest.

    - The 1-Year Fixed Deposit will no longer appear as an active holding in your
    account summary.


    If you are considering this because you need more liquidity, you may want to compare
    this action against the options in Regular Savings Account — how to guide 2.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e945d856-67b7-58cb-b1d9-304aa44a946b
  title: 1-Year Fixed Deposit — an unexpected charge or amount
  body: "Customers may sometimes notice that the amount credited upon the closure\
    \ of their 1-Year Fixed Deposit is lower than the projected maturity value. \n\
    \nSymptom: \"My deposit matured or was closed, but the interest amount is less\
    \ than what I expected.\"\n\nLikely Causes:\n1. Premature Withdrawal: The most\
    \ common cause is closing the account before the 12-month tenure. This triggers\
    \ a premature withdrawal penalty of 1% on the interest earned.\n2. Tax Deductions\
    \ (TDS): As per government regulations, tax may be deducted at source from the\
    \ interest earned.\n3. Incorrect Tenure: The account may have been closed at a\
    \ point where the 12-month tenure was not yet complete.\n\nWhat to check in order:\n\
    1. Check the closure date: Was the deposit held for the full 12 months? If not,\
    \ the 1% penalty applies.\n2. Review the interest rate applied: Was the standard\
    \ 7.1% used, or the senior citizen rate (7.1% + 0.5%)?\n3. Check for TDS entries\
    \ in your transaction history.\n\nResolution:\n- If the amount is lower due to\
    \ a Premature Withdrawal, we will provide a breakdown showing the original interest\
    \ minus the 1% penalty.\n- If there is a calculation error, tell us the discrepancy.\
    \ We will review the transaction and, if an error is found, we will route the\
