- id: 511fc4f4-e48f-53c0-b3e8-ebc933b2b71b
  title: Regular Savings Account — monthly average balance explained
  body: 'Q: What exactly is the Monthly Average Balance (MAB) for my Regular Savings
    Account?

    A: The MAB is the average amount of funds maintained in your savings account over
    a calendar month. For the Regular Savings Account, this required average is ₹10000.


    Q: How is the MAB calculated?

    A: We calculate this by adding the closing balance of your account for every day
    of the month and dividing that total by the number of days in that month.


    Q: What happens if I do not maintain the MAB of ₹10000?

    A: To ensure account sustainability, a below MAB charge of ₹500 is levied if the
    average balance for the month falls below the required threshold. For more details
    on costs, please refer to the Regular Savings Account — fee schedule.'
  domain: retail_banking
  product_category: savings_regular
