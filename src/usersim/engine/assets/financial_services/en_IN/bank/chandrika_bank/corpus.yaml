- id: ac70b1b0-f5b2-5f91-b8f4-f2fbaad1fe16
  title: Recurring Deposit — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the process of opening a new
    Recurring Deposit to start a disciplined saving plan. Here is the end-to-end process:


    What you need before starting:

    - A valid PAN card for KYC verification.

    - An active savings account with Chandrika Bank to facilitate monthly transfers.

    - A decided monthly contribution amount (must be at least ₹500).


    Steps to complete the request:

    1. Tell us you wish to open a Recurring Deposit. We will first verify your identity
    using our ''Verify First'' policy, which involves PAN-based KYC and multi-factor
    authentication.

    2. Confirm your monthly installment amount. Ensure this is ₹500 or more. We will
    then confirm the interest rate of 6.8% and the tenure of 24 months.

    3. Specify the date of the month you wish the installment to be debited from your
    savings account. We will set up the standing instruction for you.

    4. We will provide a summary of the account terms, including the ₹10 missed installment
    penalty, for your final agreement.

    5. Once you provide your consent, we will activate the account and provide you
    with your unique deposit account number.


    How you know it worked:

    You will receive a confirmation message containing your account number, the monthly
    debit date, and the maturity date after the 24 months tenure. Your first installment
    of at least ₹500 will be debited on the scheduled date.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4eb23199-9b96-594b-ad34-d39114b71e17
  title: Recurring Deposit — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that their Recurring Deposit statement shows
    an incorrect balance, a missing installment, or an unexpected charge.


    Likely Causes:

    - Timing Differences: The installment may have been debited from the savings account
    but not yet credited to the deposit ledger due to NPCI rails processing delays.

    - Penalty Application: The customer may see a charge of ₹10, which is the standard
    missed installment penalty for a payment not made by the due date.

    - Interest Calculation: The customer may be miscalculating the 6.8% interest,
    which is applied based on the timing of each monthly installment rather than the
    total corpus at the end.


    Steps to resolve:

    1. Review the customer''s transaction history for the specific period in question.
    Compare the debits in the linked savings account with the credits in the Recurring
    Deposit account.

    2. Identify if any payments were missed. If a payment was missed, explain that
    the ₹10 charge is the mandated missed installment penalty.

    3. Verify the tenure elapsed. If the account has not yet reached its 24 months
    maturity, clarify that the full interest is realized upon maturity.


    When to escalate:

    If the records show a debit from the savings account but no corresponding credit
    to the deposit after 3 business days, or if there is a clear calculation error
    in the interest, we will raise a formal dispute. We handle these disputes according
    to the RBI''s harmonised turn-around-time (TAT) framework. The customer will be
    notified of the resolution and any applicable compensation via their registered
    contact method.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b61c0a6d-ad82-5eca-9e91-3bddec6636a9
  title: Chandrika Everyday Credit Card — overview
  body: 'Welcome to a simpler way of managing your daily expenses. The Chandrika Everyday
    Credit Card is designed as a versatile spending tool, offering you both rewards
    and credit flexibility to handle your everyday lifestyle needs while maintaining
    the stability of a traditional banking relationship.


    We believe in transparency regarding the cost of credit. To get started with your
    card, there is a joining fee of ₹500. To maintain the account, an annual fee of
    ₹500 is applicable. However, we reward our active customers; we will waive the
    annual fee entirely if your total spending reaches ₹150,000 within the year.


    For those who prefer to carry a balance, our finance charges are clearly defined.
    We apply a monthly finance charge of 3.5%, which results in an annualised finance
    charge of 42%. We encourage our customers to pay their balances in full to avoid
    these costs and maintain disciplined financial habits.


    To help you get more value from every purchase, the card comes with a reward rate
    of 1%, allowing you to accumulate benefits as you spend on your daily essentials.


    ***

    Disclaimer: We provide financial education and product information but do not
    offer individualised tax, legal, or investment advice. Credit is subject to approval
    based on our internal credit policy and KYC verification.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3829e6fc-4208-5227-83cb-1100ed5aff0f
  title: Chandrika Everyday Credit Card — joining fee explained
  body: 'Q: What is the joining fee for the Chandrika Everyday Credit Card, and when
    is it charged?


    A: The joining fee is a one-time charge of ₹500. This fee is applied to your first
    billing statement upon the successful issuance and activation of your card.


    Q: Is the joining fee refundable if I close my account early?


    A: No, the joining fee is a non-refundable charge for the administrative costs
    of setting up your credit facility.


    Q: How does the joining fee differ from the annual fee?


    A: The joining fee of ₹500 is a one-time cost at the start, whereas the annual
    fee of ₹500 is a recurring yearly charge. You can find more details on these costs
    in the Chandrika Everyday Credit Card — fee schedule.'
  domain: cards
