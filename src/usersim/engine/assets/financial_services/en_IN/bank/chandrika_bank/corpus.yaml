- id: 09da7bd3-7334-5fa0-bdd8-5d5cd368ba6b
  title: 1-Year Fixed Deposit — check status or history
  body: 'Follow these steps to review the current status, interest accrued, or transaction
    history of your 1-Year Fixed Deposit.


    Prerequisites:

    - Your registered PAN-based KYC must be up to date.

    - You must have your account identification details ready.


    Steps to check your status:

    1. Request a status update for your 1-Year Fixed Deposit. We will initiate a multi-factor
    authentication check to verify your identity.

    2. Once verified, we will provide you with the current status of your deposit,
    including the date of inception and the scheduled maturity date (12 months from
    the start date).

    3. To see your earnings, ask for the ''accrued interest'' on your deposit. We
    will confirm the amount earned based on your applicable rate (7.1% for standard
    customers or 7.6% for senior citizens).

    4. If you require a full record of movements, ask for a deposit statement. We
    will provide a detailed history of the principal deposit and any interest payouts.


    How you know it worked:

    You will receive a confirmation message or a digital statement clearly listing
    your principal amount, the current interest earned, and the exact date the funds
    will become available for withdrawal.'
