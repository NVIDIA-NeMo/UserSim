- id: a157c3c1-d0a8-59a6-96e8-b3a987468908
  title: 1-Year Fixed Deposit — overview
  body: 'Welcome to Chandrika Bank. We are pleased to offer the 1-Year Fixed Deposit,
    a low-risk, high-yield investment designed for those seeking guaranteed returns
    over a twelve-month horizon. This product provides a secure way to grow your savings
    while enjoying the stability of a traditional deposit structure.


    Our 1-Year Fixed Deposit is built on transparency and trust. By committing your
    funds for a set period, we provide you with a competitive interest rate that is
    locked in for the duration of the term. This makes it an ideal choice for salaried
    professionals and households looking to park surplus funds safely.


    Key Product Details:

    - Tenure: 12 months

    - Interest Rate: 7.1%

    - Senior Citizen Benefit: An additional 0.5% is provided to senior citizens, bringing
    their effective rate to 7.6%.

    - Minimum Deposit: ₹10,000

    - Premature Withdrawal Penalty: A penalty of 1% is applied if the deposit is closed
    before the 12-month tenure is complete.


    Your deposits with us are protected by the DICGC Insurance scheme, covering up
    to ₹5,00,000 per depositor, ensuring your hard-earned money remains safe.


    ***

    Disclaimer: We provide financial education and product information but do not
    offer individualised tax, legal, or investment advice. Please consult a professional
    for specific tax implications regarding interest income.'
