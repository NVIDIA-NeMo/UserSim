  institution_id: chandrika_bank
- id: e74f2c2e-3acd-5327-899d-dd0d9b55079e
  title: 1-Year Fixed Deposit — a declined or blocked action
  body: 'This guide addresses situations where a request related to your 1-Year Fixed
    Deposit—such as opening a new account or requesting a premature withdrawal—is
    declined or blocked.


    Symptoms:

    You may receive a notification stating ''Action Declined,'' ''Account Blocked,''
    or be told that the transaction cannot be completed at this time.


    Likely Causes:

    1. KYC Non-Compliance: Our ''Verify First'' policy requires active PAN-based KYC.
    If your documentation has expired, state-changing actions are blocked.

    2. Insufficient Funds: For new deposits, the linked account may not have the required
    minimum deposit of ₹10,000.

    3. Authentication Failure: Failure to complete multi-factor authentication will
    result in a blocked request for security reasons.

    4. Administrative Hold: A temporary hold may be placed by our compliance team
    for regulatory review.


    Resolution Steps:

    1. Verify KYC Status: Ask us to check if your PAN-based KYC is current. If it
    is outdated, we will guide you through the update process.

    2. Confirm Balance: Ensure your funding account has at least ₹10,000 available
    before attempting to book the deposit again.

    3. Retry Authentication: If the block occurred during a security check, restart
    the process and ensure you provide the correct multi-factor codes.


    When we escalate:

    If the issue persists after these checks, we will raise a formal case to our nodal
    officers. You will receive a case reference number and a resolution timeline in
    accordance with the RBI''s harmonised turn-around-time (TAT) framework.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 61e9f4b7-4117-5cd9-a644-6d7d7418c8ff
  title: 1-Year Fixed Deposit — when to switch or upgrade
  body: "This guide helps agents determine when a customer should transition from\
    \ the 1-Year Fixed Deposit to another product.\n\nSwitch to Regular Savings Account\
    \ if:\nThe customer requires immediate liquidity. The 1-Year Fixed Deposit locks\
    \ funds for 12 months; switching to a Regular Savings Account allows daily access,\
    \ though it requires maintaining a Monthly Average Balance (MAB) to avoid fees.\n\
    \nSwitch to Recurring Deposit if:\nThe customer cannot commit a lump sum of ₹10,000\
    \ upfront but wants to build a corpus through disciplined monthly contributions.\n\
    \nUpgrade to longer-term deposits if:\nThe customer has a longer investment horizon\
    \ than 12 months and is seeking potentially different yield structures. \n\nKey\
    \ Trade-off:\nThe 1-Year Fixed Deposit is best for those with a lump sum who want\
    \ a guaranteed 7.1% interest rate (or 7.6% for senior citizens) with a known end\
    \ date. Switching away prematurely triggers a 1% premature withdrawal penalty."
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 80ec9dfa-d9d5-5ec0-a2c1-8e0889fcdbb2
  title: 1-Year Fixed Deposit — comparison vs. alternatives and when not to choose
    it
  body: 'The 1-Year Fixed Deposit is designed for stability and guaranteed growth
    over a short-to-medium term. However, it is not the right choice for every financial
    goal.


    Comparison with Alternatives:


    1. vs. Regular Savings Account:

    - Yield: The 1-Year Fixed Deposit offers a significantly higher guaranteed rate
    of 7.1% compared to standard savings rates.

    - Access: Savings accounts provide instant liquidity. The 1-Year Fixed Deposit
    locks your money for 12 months.

    - Cost: Savings accounts focus on maintaining MAB; the Fixed Deposit focuses on
    tenure adherence.


    2. vs. Recurring Deposit:

    - Funding: Fixed Deposits require a one-time lump sum of at least ₹10,000. Recurring
    Deposits are built through monthly installments.

    - Purpose: Fixed Deposits are for existing wealth preservation; Recurring Deposits
    are for wealth creation.


    When NOT to choose this product:

    - If you need your money within the next few months: Closing this account early
    incurs a premature withdrawal penalty of 1%.

    - If you cannot meet the minimum entry point: This product requires a minimum
    deposit of ₹10,000.

    - If you seek high-risk, high-reward equity growth: This is a low-risk retail
    banking product.


    Product Summary for Prospective Customers:

    - Tenure: 12 months

    - Standard Interest Rate: 7.1%

    - Senior Citizen Rate: 7.6% (7.1% + 0.5% extra)

    - Minimum Entry: ₹10,000

    - Exit Penalty: 1% for premature withdrawal


    ***

    Legal Disclaimer: Your deposits are safe and protected by DICGC Insurance up to
    ₹5,00,000 per depositor.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 0c12bfbf-2da4-52ea-9f91-66c709aa9f9f
  title: 1-Year Fixed Deposit — premature withdrawal penalty explained
  body: 'Q: What happens if I need to close my 1-Year Fixed Deposit before the 12
    months are up?

    A: We allow you to close your deposit early, but this is termed a Premature Withdrawal.
    Doing so will incur a premature withdrawal penalty of 1%.


    Q: How is the 1% penalty calculated?

    A: The 1% premature withdrawal penalty is applied to the interest rate applicable
    for the period the deposit actually remained with the bank, rather than the original
    7.1% (or 7.6% for senior citizens) rate.


    Q: Will I lose my principal amount if I withdraw early?

    A: No, the penalty applies to the interest earned. Your original principal deposit
    remains safe, though the final interest payout will be lower than if you had completed
    the full 12-month tenure.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2b7d1383-828e-5d5b-8f12-61702a2fa08a
  title: 1-Year Fixed Deposit — resolve a common request end-to-end
  body: 'This guide explains how to complete a request to open a new 1-Year Fixed
    Deposit from start to finish.


    Prerequisites:

    - A valid Chandrika Bank account for funding.

    - A minimum of ₹10,000 available in your source account.

    - Completed PAN-based KYC.


    Step-by-Step Process:

    1. Tell us you wish to open a 1-Year Fixed Deposit. We will ask you to specify
    the amount you wish to deposit (ensuring it is at least ₹10,000).

    2. We will then confirm your identity using multi-factor authentication to satisfy
    our ''Verify First'' policy.

    3. We will confirm the applicable interest rate: 7.1% for standard customers or
    7.6% for senior citizens (which includes the 0.5% extra rate).

    4. We will ask you to confirm the 12-month tenure and acknowledge that a premature
    withdrawal penalty of 1% applies if the funds are withdrawn early.

    5. Once you provide your final consent, we will move the funds from your linked
    account into the deposit.


    How you know it worked:

    We will provide you with a Deposit Confirmation Advice. This document will list
    your principal amount, the 12-month tenure, the 7.1% or 7.6% interest rate, and
    the exact date of maturity.


    ***

    Note: For more details on protections, refer to the DICGC insurance coverage of
    up to ₹5,00,000 per depositor mentioned in our general disclosures.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 43c2753e-fc5c-55bc-a475-9d826f411db9
  title: 1-Year Fixed Deposit — a discrepancy in your records or statement
  body: 'Use this guide if you notice an error in your 1-Year Fixed Deposit balance,
    interest payout, or maturity date on your statement.


    Symptoms:

    - The interest credited is lower than the expected 7.1% (or 7.6% for senior citizens).

    - The maturity date is listed incorrectly (not 12 months from the start date).

    - The principal amount shown does not match your original deposit of ₹10,000 or
    more.


    Likely Causes:

    1. Premature Withdrawal Application: A penalty of 1% may have been applied if
    the account was closed early, reducing the final payout.

    2. Senior Citizen Status Not Updated: If you are entitled to the 0.5% extra rate
    but it wasn''t applied, your KYC may not reflect your age.

    3. TDS Deductions: Tax Deducted at Source (TDS) may have been subtracted from
    the interest earned as per government regulations.


    Resolution Steps:

    1. Review the Transaction History: Ask us for a detailed breakdown of interest
    credits and any penalties applied.

    2. Verify Rate Application: Confirm if the base rate of 7.1% was used or if the
    senior citizen rate of 7.6% should have been applied.

    3. Check Tax Certificates: Request your TDS certificate to see if the discrepancy
    is due to tax withholdings.


    When we escalate:

    If the discrepancy cannot be resolved through these checks, we will route the
    issue to our nodal officers for a formal audit. We adhere to the RBI''s harmonised
    turn-around-time (TAT) framework, and you will be notified of the resolution and
    any applicable compensation for errors.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 58c4348b-0b9c-5093-b0a2-cd120a5c54e9
  title: Recurring Deposit — overview
  body: 'We invite you to build your future with the Chandrika Bank Recurring Deposit,
    a disciplined monthly saving tool designed to build a corpus over time with competitive
    interest. This product is ideal for salaried professionals and middle-income households
    who wish to save a fixed sum regularly rather than as a lump sum.


    To get started, we require a minimum monthly installment of ₹500. By committing
    to this regular saving habit, you benefit from a guaranteed interest rate of 6.8%.
    The standard tenure for this product is 24 months, providing a balanced horizon
    to grow your wealth while maintaining a steady saving rhythm.


    To ensure the health of your savings plan, we encourage timely deposits. Please
    be aware that a missed installment penalty of ₹10 is applicable for each payment
    not received by the due date. This structure is designed to encourage disciplined
    financial habits, ensuring you reach your financial goals on schedule.


    Your deposits with us are safe and secure. As a trust-centric institution, all
    customer deposits are protected by the DICGC Insurance scheme, covering up to
    ₹5,00,000 per depositor.


    ***

    Legal Disclaimer: We provide financial education and product information but do
    not offer individualised tax, legal, or investment advice. All deposits are subject
    to the terms and conditions of Chandrika Bank.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 84c3cbcd-14b9-5191-bcf5-831e52ef7168
  title: Recurring Deposit — minimum monthly installment explained
  body: 'Q: What is the lowest amount I can commit to save each month in my Recurring
    Deposit?


    A: To maintain a Recurring Deposit account with us, the minimum monthly installment
    is ₹500. We have set this threshold to make disciplined saving accessible while
    ensuring the account remains sustainable.


    Q: Can I change my monthly installment amount after the account is opened?


    A: The installment amount is typically fixed for the tenure of the deposit. If
    you wish to increase your monthly savings, we recommend opening an additional
    Recurring Deposit account. For detailed information on how to manage your accounts,
    please refer to Recurring Deposit — make a change or update.


    Q: What happens if I cannot meet the minimum installment for one month?


    A: While we encourage consistency, a missed payment will incur a missed installment
    penalty of ₹10. We recommend linking your Recurring Deposit to your Regular Savings
    Account to automate these payments.'
