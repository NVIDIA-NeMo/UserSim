- id: 6fe9f9e5-cfd2-500c-a8e6-3fffef3dc4fb
  title: 1-Year Fixed Deposit — recognizing scams targeting this product
  body: 'As you evaluate the 1-Year Fixed Deposit against other investment options,
    it is important to remain vigilant against fraudulent schemes that mimic high-yield
    banking products. At Chandrika Bank, we prioritise your security and transparency.


    Common Scam Patterns:

    1. The ''Guaranteed Bonus'' Bait: Scammers may contact you claiming that your
    1-Year Fixed Deposit is eligible for an unofficial ''bonus rate'' or ''loyalty
    top-up'' if you transfer funds to a different account or provide your credentials.
    We will never ask you to move funds to a third-party account to ''unlock'' a higher
    interest rate.

    2. Urgent Maturity Alerts: You may receive messages stating your deposit has matured
    prematurely or is ''at risk,'' demanding immediate action via a link. Always verify
    your account status directly with us.

    3. Impersonation of Nodal Officers: Fraudsters may pose as bank officials offering
    to waive the 1% premature withdrawal penalty in exchange for your security codes.


    Our Security Promise:

    We follow a strict ''Verify First'' policy. Our agents will never request your
    UPI PIN, OTPs, or CVVs under any circumstances. Any request for these credentials
    is a definitive sign of a scam.


    What to do if you suspect fraud:

    If you encounter a suspicious request or notice unauthorised activity, report
    it to us immediately through our dedicated reporting path. Reporting timelines
    are critical; the promptness of your report helps minimise your liability for
    fraudulent activity.


    ***

    Legal Disclaimer: Customer deposits are protected by the DICGC insurance scheme
    up to ₹5,00,000 per depositor.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: security_advisory
  source_authority: official
