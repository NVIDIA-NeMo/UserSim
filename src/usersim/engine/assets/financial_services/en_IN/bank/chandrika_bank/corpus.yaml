- id: efade504-7cad-5f25-bb9e-410bb0967d76
  title: Chandrika Everyday Credit Card — vs. a typical competitor offering
  body: 'When comparing the Chandrika Everyday Credit Card to typical market offerings,
    the primary differences lie in the transparency of the fee structure and the reward
    simplicity.


    - Cost Structure: While some competitors offer ''lifetime free'' cards with very
    low limits, we provide a clear value proposition with a joining fee of ₹500 and
    an annual fee of ₹500, which is waived entirely if you spend ₹150,000 annually.
    This rewards active users rather than offering a generic low-limit tool.

    - Rewards: Many competitors use complex point-conversion systems. We offer a straightforward
    reward rate of 1% on spends, making it easier for you to calculate your actual
    savings.

    - Cost of Credit: Our monthly finance charge of 3.5% (42% annualised) is competitive
    within the traditional retail banking sector for unsecured credit.


    Who should choose what:

    - Choose the Chandrika Everyday Credit Card if you want a stable, trust-centric
    product with a clear path to fee waivers and transparent rewards.

    - Choose a competitor''s ''free'' card if you are a very low-volume spender who
    cannot meet the ₹150,000 threshold and does not mind lower credit limits.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 285ec947-0474-5eeb-a67f-56fe578b57b6
  title: Chandrika Everyday Credit Card — risk disclosures
  body: 'This document provides essential risk disclosures regarding the use of the
    Chandrika Everyday Credit Card. Please read these carefully to understand the
    financial implications of credit usage.


    1. Interest Risk: Credit cards are high-cost borrowing tools if not managed disciplinedly.
    Any balance not paid by the due date will incur a monthly finance charge of 3.5%,
    leading to an annualised finance charge of 42%. This can lead to a rapid increase
    in the total amount owed.


    2. Fee Obligations: The account is subject to a joining fee of ₹500 and a recurring
    annual fee of ₹500. While a waiver is available for annual spends of ₹150,000
    or more, failure to meet this milestone will result in the fee being charged to
    the account.


    3. Credit Score Impact: Timely repayment of the monthly dues is critical. Late
    payments may be reported to credit bureaus, which can negatively impact your credit
    score and future borrowing capacity.


    4. Liability: While we provide fraud protection, your liability for unauthorised
    transactions depends on the timeline of reporting as per RBI''s harmonised TAT
    framework. Delayed reporting may increase the customer''s financial liability.


    ***

    Legal Disclaimer: Chandrika Bank provides financial education but does not offer
    individualised tax, legal, or investment advice. We adhere strictly to RBI and
    NPCI frameworks to ensure fair treatment and transparency.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b40ced2e-4f0e-5cc8-ae96-f3b4c9e0cd3f
  title: Chandrika Everyday Credit Card — how rates are tiered and applied
  body: 'The Chandrika Everyday Credit Card applies a flat rate structure to ensure
    transparency and simplicity for our customers. There are no tiered interest rates
    based on balance or spend levels.


    - Finance Charges: A flat monthly finance charge of 3.5% is applied to all outstanding
    balances that remain unpaid after the due date. This results in an annualised
    finance charge of 42%.

    - Reward Rate: A flat reward rate of 1% is applied to all eligible spends, regardless
    of the transaction amount or category.


    These rates are applied to the account balance at the end of the billing cycle.
    The finance charge is calculated on the daily average outstanding balance from
    the date of transaction until the date of payment. These rates are subject to
    change in accordance with RBI guidelines and bank policy, with prior notice provided
    to the cardholder.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 351eb21b-c313-5e70-8622-68b771d22ff0
  title: Chandrika Everyday Credit Card — referral and loyalty offer
  body: 'We are pleased to reward our community for growing the Chandrika Bank family.
    From 1 November 2024 to 31 January 2025, existing cardholders who refer a new
    customer to the Chandrika Everyday Credit Card will receive a loyalty bonus of
    ₹1,000 credited to their statement upon the successful activation of the referred
    card.


    For the new customer, we are offering a limited-time welcome benefit: the joining
    fee of ₹500 will be waived if the first transaction of ₹2,000 or more is completed
    within 30 days of card issuance. This is a wonderful opportunity to experience
    a versatile spending tool that offers a reward rate of 1% on eligible spends.


    Terms and conditions apply. This offer is valid for residents of India with a
    valid PAN for KYC verification.'
