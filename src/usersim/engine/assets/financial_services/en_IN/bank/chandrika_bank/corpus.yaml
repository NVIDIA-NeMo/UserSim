- id: 7be66d2e-b70d-5b68-9259-9dc17968b497
  title: 1-Year Fixed Deposit — limits, restrictions, and edge cases
  body: 'This guide outlines the operational boundaries and restrictions for the 1-Year
    Fixed Deposit to assist in accurate customer support.


    Deposit Constraints:

    - Minimum Deposit: The minimum amount required to open this account is ₹10,000.
    Requests for amounts below this threshold cannot be processed for this specific
    product.

    - Tenure: This product is strictly locked for a duration of 12 months.


    Interest Rate Framework:

    - Standard Rate: A base interest rate of 7.1% applies to all eligible deposits.

    - Senior Citizen Benefit: Customers qualifying as senior citizens receive an additional
    0.5% over the standard rate.


    Withdrawal Restrictions and Penalties:

    - Maturity: Funds are intended to remain untouched for the full 12 months to earn
    the quoted interest.

    - Premature Withdrawal: While we allow the closing of a deposit before the agreed
    tenure, this action is subject to a premature withdrawal penalty of 1%.


    Compliance and Insurance:

    - All deposits are held in strict adherence to RBI and NPCI frameworks.

    - Safety: Every deposit is covered by DICGC Insurance up to a maximum of ₹5,00,000
    per depositor.


    Edge Case Handling:

    If a customer wishes to withdraw funds before the 12-month mark, the 1% penalty
    is applied to the applicable interest earned, not the principal amount. Ensure
    the customer is aware that premature withdrawal alters the final yield of the
    investment.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
