- id: 645fd042-dcdb-5163-9144-7e3871ed3a7c
  title: Recurring Deposit — missed installment penalty explained
  body: 'Q: What happens if I miss a monthly payment for my Recurring Deposit?

    A: To encourage disciplined saving habits, we apply a missed installment penalty
    of ₹10 for every installment that is not paid by the due date. We recommend setting
    up an automated transfer from your savings account to ensure you never miss a
    payment.


    Q: Will a missed payment cancel my account?

    A: No, a single missed payment will not close your account, but the ₹10 penalty
    will be charged. However, consistent defaults may affect the final maturity value
    of your investment.


    For more details on the costs associated with this product, please refer to Recurring
    Deposit — cost and charges.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
