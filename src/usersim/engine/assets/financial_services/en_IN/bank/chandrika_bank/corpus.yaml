- id: 34dc8748-7228-5222-ba86-3454674ce067
  title: Chandrika Everyday Credit Card — annual fee explained
  body: 'Q: How much is the annual fee for the Chandrika Everyday Credit Card and
    when is it charged?

    A: The card carries an annual fee of ₹500, which is billed to your account on
    the anniversary of your card issuance.


    Q: Is there any way to avoid paying the annual fee?

    A: Yes, we reward our active customers. If your total spending on the card reaches
    or exceeds ₹150,000 within the year, the annual fee of ₹500 will be waived.


    Q: Does the joining fee count towards the annual fee waiver?

    A: No, the joining fee of ₹500 is a one-time charge at the start of the relationship.
    The waiver applies specifically to the recurring annual fee based on your annual
    spend milestones.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
