- id: 3b6851b1-de2b-5b71-b6e2-7248d477bf73
  title: 1-Year Fixed Deposit — risk disclosures
  body: 'This document provides essential risk disclosures regarding the 1-Year Fixed
    Deposit product. Please read these carefully to understand the trade-offs of this
    investment.


    Liquidity Risk:

    By placing funds in a 1-Year Fixed Deposit, you are committing your capital for
    a tenure of 12 months. While the funds are not completely locked, accessing them
    before maturity is considered a Premature Withdrawal. This action results in a
    financial loss in the form of a premature withdrawal penalty of 1% applied to
    the interest earned. This product is therefore not suitable for funds required
    for immediate emergency use.


    Interest Rate Risk:

    The interest rate of 7.1% (and the senior citizen rate of 7.6%) is fixed at the
    time of booking. If market interest rates rise during your 12-month tenure, your
    deposit will continue to earn the original rate, and you will not benefit from
    the increase unless you close the account (paying the 1% penalty) and reinvest
    at the new rate.


    Credit and Deposit Insurance:

    Your deposits are protected under the Deposit Insurance and Credit Guarantee Corporation
    (DICGC) scheme. This insurance covers up to ₹5,00,000 per depositor. Amounts exceeding
    this limit are subject to the general credit risk of the institution.


    Regulatory Adherence:

    We operate strictly under the frameworks provided by the RBI and NPCI. Any changes
    to these regulatory frameworks may necessitate changes to the product''s terms
    and conditions.


    ***

    Disclaimer: Chandrika Bank provides financial education and product information
    but does not offer individualised tax, legal, or investment advice.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 6955f03c-5adb-5e6f-8f84-187b1f319039
