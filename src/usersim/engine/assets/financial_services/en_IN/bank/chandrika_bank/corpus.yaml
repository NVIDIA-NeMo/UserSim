- id: bdaecfb8-6c1d-562c-9f7c-af5bea08c18d
  title: Recurring Deposit — choosing between tiers or options
  body: 'When deciding how to grow your savings, it is important to choose the product
    that matches your cash flow. Here is how the Recurring Deposit compares to our
    other primary deposit tool.


    **Recurring Deposit vs. 1-Year Fixed Deposit**


    * **Funding Structure:** The Recurring Deposit allows you to save in smaller increments
    (minimum monthly installment of ₹500) over 24 months. The 1-Year Fixed Deposit
    requires a single lump-sum deposit at the start.

    * **Returns:** The Recurring Deposit offers an interest rate of 6.8%. While both
    are low-risk, the Fixed Deposit is better for those who already have a large sum
    of money, whereas the Recurring Deposit is better for salaried professionals saving
    from their monthly income.

    * **Lock-in:** The Recurring Deposit has a longer commitment of 24 months compared
    to the 12-month horizon of our standard Fixed Deposit.

    * **Risk:** Both products are equally safe, with deposits protected by DICGC Insurance
    up to ₹5,00,000.


    **Who should choose what?**

    * **Choose Recurring Deposit if:** You want to build a habit of monthly saving
    and cannot commit a large lump sum upfront.

    * **Choose 1-Year Fixed Deposit if:** You have an existing corpus and want a guaranteed
    return over a shorter, twelve-month period.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 95fb047d-dffb-52c9-a84a-788296f16869
  title: Recurring Deposit — privacy and data handling
  body: 'This disclosure outlines how Chandrika Bank handles your personal and financial
    data in relation to your Recurring Deposit account. We are committed to transparency
    and strict adherence to RBI and NPCI frameworks.


    **Data Collection and Purpose**

    To maintain your Recurring Deposit, we collect and process your PAN-based KYC
    details, contact information, and transaction history. This data is used exclusively
    for:

    * Verifying your identity as part of our ''Verify First'' policy.

    * Managing the monthly auto-debit of your installment (minimum ₹500).

    * Calculating and crediting interest at the rate of 6.8%.

    * Communicating missed installment penalties of ₹10.


    **Data Protection and Sharing**

    Your data is encrypted and stored in secure environments. We do not sell your
    personal information to third parties. Data may be shared only with regulatory
    authorities (such as the RBI) or credit bureaus as required by Indian law.


    **Customer Rights and Access**

    As a customer, you have the right to request a summary of the data we hold about
    your deposit and the history of your installments over the 24 months tenure. You
    may request this through our omnichannel digital platforms during IST business
    hours.


    **Regulatory Safeguards**

    We ensure that your deposits are protected by the DICGC insurance scheme up to
    ₹5,00,000 per depositor. Any disputes regarding data handling or account discrepancies
    are handled according to the RBI''s harmonised turn-around-time (TAT) framework
    to ensure prompt resolution.


    For further information on how we handle data across all retail products, you
    may refer to Regular Savings Account — privacy and data handling.'
