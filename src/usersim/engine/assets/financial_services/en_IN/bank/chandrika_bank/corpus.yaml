- id: 283a269a-7ebc-5a08-911c-dcead8bb0691
  title: 1-Year Fixed Deposit — interest rate explained
  body: 'Q: What is the current interest rate for the 1-Year Fixed Deposit?

    A: The standard interest rate for this product is 7.1% for a tenure of 12 months.


    Q: Are there any special rates for older customers?

    A: Yes, we provide a senior citizen extra rate of 0.5%, which is added to the
    standard 7.1% rate for eligible depositors.


    Q: Does the interest rate change if I withdraw my money early?

    A: If you opt for a Premature Withdrawal, a premature withdrawal penalty of 1%
