- id: d600fa71-c909-5905-a8da-75b1c78723b0
  title: Regular Savings Account — savings interest rate explained
  body: '**What is the current interest rate for the Regular Savings Account?**

    We provide a savings interest rate of 3.5% on the funds maintained in your account.
    This allows your money to grow while remaining fully liquid for your daily needs.


    **How is the interest calculated and credited?**

    Interest is calculated on your daily balance and is typically credited to your
    account on a quarterly basis. The exact amount credited depends on the average
    balance held throughout the quarter.


    **Will the interest rate change?**

    Interest rates are subject to change based on RBI guidelines and the bank''s internal
    monetary policy. We will notify you of any changes through our standard communication
    channels. For a detailed view of our current rates, please refer to Regular Savings
    Account — rate sheet.'
