  body: 'The 1-Year Fixed Deposit utilizes a straightforward interest structure. There
    are no balance-based tiers; a single flat rate applies to all deposits meeting
    the minimum deposit of ₹10,000.


    Standard Rate:

    An interest rate of 7.1% is applied to all standard accounts for the 12-month
    tenure.


    Senior Citizen Rate:

    Eligible senior citizens receive an additional senior citizen extra rate of 0.5%,
    bringing their total applicable interest rate to 7.6%.


    Application and Adjustments:

    - The rate is locked at the moment of booking and remains constant for the 12-month
    duration.

    - If a Premature Withdrawal occurs, the interest paid is reduced by a premature
    withdrawal penalty of 1%.

    - Interest is calculated based on the principal amount and credited upon maturity
    or closure.'
