- id: 45f5403b-1430-5c0b-93d7-a718ebd702fc
  title: 1-Year Fixed Deposit — privacy and data handling
  body: 'Chandrika Bank is committed to the highest standards of transparency and
    data privacy in accordance with RBI and NPCI frameworks. This disclosure explains
    how we handle your data in relation to your 1-Year Fixed Deposit.


    **Data Collection and Use**

    To facilitate your 12 months tenure deposit, we collect and process the following
    information:

    * **Identity Data:** PAN and KYC documents used for the ''Verify First'' policy
    to prevent fraud and ensure regulatory compliance.

    * **Financial Data:** Transaction history from your linked savings account to
    facilitate the minimum deposit of ₹10000.

    * **Contact Data:** Registered mobile number and email for multi-factor authentication
    and maturity notifications.


    **Data Sharing and Protection**

    We do not sell your personal data to third parties. Your information is shared
    only with authorized regulatory bodies, such as the RBI, or for the purpose of
    providing DICGC insurance, which protects your deposits up to ₹5,00,000.


    **Security Measures**

    Your data is encrypted and accessible only to authorized personnel. We enforce
    a strict policy where agents are prohibited from requesting sensitive credentials,
    including UPI PINs or OTPs, to ensure your account remains secure.


    **Your Rights**

    Customers have the right to request a summary of the data we hold or to update
    their information through our official channels. All data handling is conducted
    to ensure fair treatment and transparency.


    ***

    Disclaimer: This disclosure is provided for informational purposes and does not
    supersede the binding terms found in 1-Year Fixed Deposit — account agreement.
    ***'
