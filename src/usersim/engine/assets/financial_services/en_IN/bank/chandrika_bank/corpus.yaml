- id: f15a51c4-c011-5bc1-acd6-a77270cb28b3
  title: Regular Savings Account — choosing between tiers or options
  body: 'When choosing the right liquid account, it is important to balance access
    with cost. The Regular Savings Account is designed for salaried professionals
    and households who can maintain a steady balance.


    **Regular Savings Account Highlights**

    * **Maintenance**: Requires a Monthly Average Balance (MAB) of ₹10,000.

    * **Cost of Low Balance**: A charge of ₹500 if MAB is not met.

    * **Returns**: A savings interest rate of 3.5%.

    * **Access**: 5 free ATM transactions per month and an annual debit card fee of
    ₹250.


    **Choosing the Right Option**

    * **Choose the Regular Savings Account if**: You seek a foundational account for
    daily banking and can comfortably maintain ₹10,000 to avoid monthly charges. It
    is ideal for those who prefer the stability of traditional deposits combined with
    modern UPI rails.

    * **Choose an Alternative if**: You cannot commit to a minimum average balance
    or require higher yields for long-term savings (in which case, our Fixed Deposit
    products may be more suitable).


    For a more detailed comparison against other specific offerings, see Regular Savings
    Account — vs. a similar product here.'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c353f7c9-28a9-5f2a-b9c6-651afe777344
  title: Regular Savings Account — privacy and data handling
  body: "Chandrika Bank is committed to the highest standards of transparency and\
    \ data privacy. This disclosure outlines how we handle your information in relation\
    \ to your Regular Savings Account.\n\n**Data Collection and Purpose**\nWe collect\
    \ personal and financial data—including your PAN, contact details, and transaction\
    \ history—solely for the purpose of providing banking services, complying with\
    \ RBI regulatory frameworks, and performing mandatory KYC checks. Your data is\
    \ used to calculate your Monthly Average Balance (MAB) of ₹10,000 and to apply\
    \ the savings interest rate of 3.5% to your balance.\n\n**Data Protection and\
    \ Security**\nWe employ a 'Verify First' policy, ensuring that no sensitive information\
    \ is disclosed or changed without multi-factor authentication and PAN verification.\
    \ Your data is stored using industry-standard encryption to prevent unauthorised\
    \ access.\n\n**Third-Party Sharing**\nWe do not sell your personal data to third\
    \ parties. Data is only shared with authorised regulatory bodies (such as the\
    \ RBI) or technical infrastructure providers like the NPCI for the processing\
    \ of UPI and other payment rail transactions.\n\n**Customer Rights**\nAs an account\
    \ holder, you have the right to request a copy of the data we hold about you and\
    \ to request corrections to any inaccuracies. \n\n**Regulatory Protection**\n\
    Your deposits in the Regular Savings Account are protected by the DICGC insurance\
    \ scheme, covering up to ₹5,00,000 per depositor. \n\n***\nDisclaimer: This disclosure\
    \ is provided in accordance with Indian banking regulations. For a full legal\
    \ breakdown of our terms, please refer to Regular Savings Account — account agreement."
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 107dbb96-f151-5a28-8829-34b23a4b8594
  title: Regular Savings Account — recognizing scams targeting this product
  body: "At Chandrika Bank, we prioritise the safety of your hard-earned money. Because\
    \ the Regular Savings Account is often used for daily expenses, it is a frequent\
    \ target for scammers who use social engineering to gain access to your funds.\
    \ \n\nCommon scams targeting this account include:\n1. **KYC Update Threats**:\
    \ You may receive messages claiming your account will be blocked unless you update\
    \ your KYC immediately. These often lead to fake websites designed to steal your\
    \ credentials.\n2. **Reward/Lottery Scams**: Messages claiming you have won a\
    \ prize and need to pay a 'processing fee' or provide account details to receive\
    \ the funds.\n3. **Payment Request Scams**: Scammers may send you a UPI payment\
    \ request, claiming it is for a refund or a prize, tricking you into authorizing\
    \ a payment out of your account.\n\n**What We Will Never Ask For**\nTo ensure\
    \ your security, please remember that Chandrika Bank agents will never ask you\
    \ for the following sensitive credentials:\n* Your UPI PIN\n* One-Time Passwords\
    \ (OTPs)\n* Your Debit Card CVV\n* Your Net Banking Password\n\n**Immediate Action\
    \ Steps**\nIf you notice any unauthorized transaction or suspect that you have\
    \ shared your details with a fraudster, please notify us immediately. Under the\
    \ RBI's harmonised turn-around-time (TAT) framework, prompt reporting is critical.\
    \ Your liability for fraudulent activity is minimized when reported within the\
    \ timelines specified by the regulator.\n\n***\n*Disclaimer: All deposits are\
    \ protected by the DICGC insurance scheme up to ₹5,00,000 per depositor.***"
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 235b0188-9da7-5a91-b232-1f09ebbf2107
  title: Regular Savings Account — limits, restrictions, and edge cases
  body: "This guide provides the detailed operational limits and restrictions for\
    \ the Regular Savings Account to assist in providing accurate support to customers.\n\
    \n**Balance Requirements & Penalties**\n* **Monthly Average Balance (MAB):** Customers\
    \ must maintain a minimum Monthly Average Balance of ₹10,000. \n* **Below MAB\
    \ Charge:** If the MAB falls below ₹10,000, a charge of ₹500 will be applied to\
    \ the account.\n\n**Transaction & Card Limits**\n* **ATM Access:** The account\
    \ allows for 5 free ATM transactions per month. Any transactions exceeding this\
    \ limit may attract fees as per the standard schedule.\n* **Debit Card Costs:**\
    \ A debit card annual fee of ₹250 is applicable for the maintenance of the card\
    \ associated with this account.\n\n**Interest Accrual**\n* **Interest Rate:**\
    \ The account earns a savings interest rate of 3.5%.\n\n**Edge Cases and Restrictions**\n\
    * **Dormancy:** Accounts with no customer-induced transactions for a period of\
    \ two years may be classified as inoperative, requiring a fresh KYC process to\
    \ reactivate.\n* **Negative Balance:** While the account is intended for savings,\
    \ certain automated charges (like the ₹500 below MAB charge) could potentially\
    \ push the balance into a negative state if funds are insufficient.\n* **DICGC\
    \ Coverage:** Ensure customers are aware that their deposits are insured by the\
    \ DICGC up to a maximum of ₹5,00,000.\n\nFor a general overview of the account\
    \ features, please refer to Regular Savings Account — overview."
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 45f8e17c-9942-50c2-b286-5054140ca185
  title: Regular Savings Account — debit card annual fee explained
  body: '**What is the annual fee for the debit card provided with a Regular Savings
    Account?**

    We charge a debit card annual fee of ₹250. This fee covers the cost of card issuance,
    security infrastructure, and the ability to access your funds via ATMs and POS
    terminals.


    **When is this fee deducted from my account?**

    The fee is typically deducted once every twelve months from your account balance.
    We recommend maintaining sufficient funds to ensure the fee is processed without
    affecting your Monthly Average Balance.


    **Can this fee be waived?**

    We offer waivers based on loyalty and spending milestones to reward our active
    customers. Please refer to Regular Savings Account — fee schedule for more details
    on our fee philosophy.'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4b0ca416-4925-5fe9-abdb-d37e624d4f75
  title: Regular Savings Account — check status or history
  body: "Whether you need to verify a specific payment or check your current balance\
    \ against the MAB requirement, follow these steps to review your account status\
    \ and history.\n\n**What you need before starting**\n* Your account number or\
    \ registered mobile number.\n* Valid identity verification (as per our 'Verify\
    \ First' policy, we will require PAN-based KYC or multi-factor authentication).\n\
    \n**Steps to check your status and history**\n1. **Request Account Summary**:\
    \ Ask us for your current available balance and your Monthly Average Balance (MAB)\
    \ for the current calendar month. We will confirm if you are currently meeting\
    \ the ₹10,000 MAB threshold.\n2. **Request Transaction History**: Specify the\
    \ time period you wish to review (e.g., the last 30 days or the last quarter).\
    \ \n3. **Review Specific Entries**: We will provide a list of credits and debits.\
    \ If you are checking for fees, look for the debit card annual fee of ₹250 or\
    \ the below MAB charge of ₹500.\n4. **Verify Interest Credits**: You can ask us\
    \ to confirm the interest credited to your account based on the 3.5% savings interest\
    \ rate.\n5. **Confirm Statement Delivery**: If you require a formal document,\
    \ ask us to send a monthly statement to your registered email address.\n\n**How\
    \ you know it worked**\nYou will have a clear understanding of your current balance,\
    \ a detailed list of your recent transactions, and confirmation of whether your\
    \ account is in good standing regarding balance requirements."
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f9b03a9e-5453-5ddb-9af2-018609422e73
  title: Regular Savings Account — a declined or blocked action
  body: "It can be frustrating when a transaction is declined or an account feature\
    \ is blocked. Here is how to identify the cause and resolve the issue.\n\n**Symptom:\
    \ 'Transaction Declined' at an ATM or POS**\n* **Check the Cause**: \n    1. **Insufficient\
    \ Funds**: Ensure your balance covers the transaction amount.\n    2. **ATM Limit**:\
    \ Have you already used your 5 free ATM transactions per month? While exceeding\
    \ the limit usually incurs a fee rather than a decline, certain card limits may\
    \ apply.\n    3. **Incorrect PIN**: Ensure the correct PIN was entered.\n* **The\
    \ Fix**: If the issue is a limit or a block, we can review your account restrictions\
    \ and lift them after successful multi-factor authentication.\n\n**Symptom: 'Account\
    \ Blocked' or 'Unable to Transfer'**\n* **Check the Cause**:\n    1. **KYC Expiry**:\
    \ Your account may be temporarily restricted if your PAN-based KYC has expired.\n\
    \    2. **Security Freeze**: We may have blocked the account due to suspected\
    \ fraudulent activity to protect your funds.\n    3. **Dormancy**: The account\
    \ may be inactive due to a long period of no transactions.\n* **The Fix**: \n\
    \    1. Provide updated KYC documents as requested.\n    2. Complete the security\
    \ verification process with us to unfreeze the account.\n\n**When to Escalate**\n\
    If we cannot resolve the block during your interaction, we will raise an internal\
    \ case for our compliance team to review. You will receive a reference number\
    \ and an update via your registered contact details within the RBI's harmonised\
    \ TAT framework.\n\nFor more information on account safety, see Regular Savings\
    \ Account — fraud and unauthorized-activity protection."
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3944e6e7-1a6d-593e-b57b-52e61f81d1f1
  title: Regular Savings Account — when to switch or upgrade
  body: 'The Regular Savings Account is a foundational liquid account designed for
    daily banking. However, depending on your financial goals, an upgrade or a different
    product may be more suitable.


    **Stay with the Regular Savings Account if:**

    * You need immediate access to your funds for daily expenses.

    * You can comfortably maintain a Monthly Average Balance (MAB) of ₹10,000 to avoid
    the ₹500 below MAB charge.

    * Your primary goal is liquidity with a steady savings interest rate of 3.5%.


    **Consider switching or adding another product if:**

    * **For Guaranteed Higher Returns**: If you have a lump sum you don''t need for
    a year, our 1-Year Fixed Deposit offers higher yields than the 3.5% savings rate.

    * **For Disciplined Saving**: If you prefer saving a fixed amount monthly, a Recurring
    Deposit is a better tool for building a corpus.

    * **For Higher Spend/Rewards**: If you find yourself needing more credit flexibility
    than your liquid balance allows, the Chandrika Everyday Credit Card provides versatile
    spending options.


    We recommend a combination of these products to balance liquidity and growth.'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4bf50793-4a25-543d-a726-e7ac5a909973
  title: Regular Savings Account — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right account depends on your financial habits. The Regular
    Savings Account is designed as a high-liquidity hub for your daily financial life,
    but it is not the right tool for every objective.


    **Comparison with Other Chandrika Bank Products**

    * **Vs. Fixed Deposits**: While the Regular Savings Account offers a savings interest
    rate of 3.5% and instant access, a Fixed Deposit provides a higher, guaranteed
    return in exchange for locking your funds for a set tenure. Choose the Regular
    Savings Account for emergency funds; choose Fixed Deposits for wealth preservation.

    * **Vs. Recurring Deposits**: The Regular Savings Account is for flexible deposits
    and withdrawals. A Recurring Deposit is for disciplined, monthly contributions.
    Use the Regular Savings Account for your salary landing; use a Recurring Deposit
    to save for a specific future goal.


    **When NOT to choose the Regular Savings Account**

    * **If you cannot maintain the MAB**: If your cash flow makes it difficult to
    maintain a Monthly Average Balance of ₹10,000, the ₹500 below MAB charge may outweigh
    the interest earned.

    * **If you seek maximum yield**: If your goal is to maximize interest on a large
    sum of money, the 3.5% rate will be lower than what our term deposit products
    offer.

    * **If you only need a payment tool**: If you only require digital payments via
    NPCI rails without needing a full savings vehicle, our UPI-specific services may
    be sufficient.


    **Key Financial Summary**

    * **Interest Rate**: 3.5%

    * **MAB Requirement**: ₹10,000

    * **Below MAB Fee**: ₹500

    * **Debit Card Fee**: ₹250

    * **Free ATM Limit**: 5 per month


    ***

    *Disclaimer: Customer deposits are protected by the DICGC insurance scheme up
    to ₹5,00,000 per depositor.***'
