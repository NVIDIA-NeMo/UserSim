- id: 22a59481-2595-58ec-bfb1-07b310bf73b7
  title: Regular Savings Account — account security best practices
  body: "At Chandrika Bank, the security of your hard-earned money is our highest\
    \ priority. To keep your Regular Savings Account safe, we urge you to follow these\
    \ essential security practices.\n\n**Our 'Verify First' Commitment**\nWe employ\
    \ a strict verification policy. We will always require PAN-based KYC and multi-factor\
    \ authentication before performing any state-changing action on your account.\
    \ \n\n**What We Will NEVER Ask For**\nRegardless of the channel you use to communicate\
    \ with us, our agents will never request the following sensitive credentials:\n\
    * Your UPI PIN\n* One-Time Passwords (OTPs)\n* Your Debit Card CVV\n* Your Net\
    \ Banking password\n\nIf anyone claiming to be from Chandrika Bank asks for these\
    \ details, please end the communication immediately. These are signs of a phishing\
    \ attempt.\n\n**Protecting Your Funds**\nTo minimise your liability in the event\
    \ of fraudulent activity, prompt reporting is critical. Under the RBI's harmonised\
    \ framework, reporting unauthorised transactions immediately helps in limiting\
    \ your financial loss. If you notice any transaction you did not authorise, notify\
    \ us immediately through our dedicated fraud reporting path. \n\n**Daily Habits\
    \ for Security**\n1. Regularly monitor your account statements to identify any\
    \ discrepancies early.\n2. Change your digital banking passwords every 90 days.\n\
    3. Avoid using public Wi-Fi when accessing your account details.\n\nFor more detailed\
    \ information on how we protect your assets, please refer to Regular Savings Account\
    \ — fraud and unauthorized-activity protection."
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 301c5c81-feff-541b-823a-96a8371d6e29
  title: Regular Savings Account — change-of-terms policy
  body: "This document outlines the policy regarding modifications to the terms and\
    \ conditions of the Regular Savings Account. \n\n**Right to Modify Terms**\nChandrika\
    \ Bank reserves the right to amend the terms of this account, including interest\
    \ rates, fee structures, and balance requirements, to ensure account sustainability\
    \ and alignment with RBI guidelines. \n\n**Specific Numeric Adjustments**\nChanges\
    \ may apply to the following key parameters:\n* The Monthly Average Balance (MAB)\
    \ requirement, currently set at ₹10,000.\n* The below MAB charge, currently ₹500.\n\
    * The annual debit card fee, currently ₹250.\n* The savings interest rate, currently\
    \ 3.5%.\n* The limit of free ATM transactions per month, currently 5.\n\n**Notice\
    \ Period and Communication**\nWe commit to transparency in all our disclosures.\
    \ We will provide you with a minimum of 30 days' notice before any change to fees\
    \ or balance requirements becomes effective. Notification will be sent via your\
    \ registered email address or through a formal notice in your account statement.\
    \ \n\n**Acceptance of Changes**\nYour continued use of the Regular Savings Account\
    \ after the effective date of a change constitutes your acceptance of the revised\
    \ terms. If you find the new terms unsuitable, you have the right to close your\
    \ account without penalty, provided all outstanding dues are cleared. \n\n**Termination\
    \ of Agreement**\nEither party may terminate the account agreement. Upon closure,\
    \ we will pay the remaining balance plus any accrued interest at the rate of 3.5%,\
    \ minus any applicable charges for failing to maintain the ₹10,000 MAB in the\
    \ final cycle."
  domain: retail_banking
  product_category: savings_regular
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f8a2a466-3309-5eaf-a700-0396697c21aa
  title: Regular Savings Account — getting started walkthrough
  body: 'This guide is designed to assist agents in walking a new customer through
    the onboarding process for the Regular Savings Account. The goal is to ensure
    the customer understands their obligations and the benefits of the account.


    **Step 1: Requirement Verification**

    Ensure the customer understands the foundational nature of this account. Confirm
    they are aware of the Monthly Average Balance (MAB) of ₹10,000, which is essential
    for fee-free utility. Explain that the account offers a savings interest rate
    of 3.5%.


    **Step 2: Documentation and KYC**

    Explain our ''Verify First'' policy. The customer must provide a valid PAN for
    KYC purposes. This is a non-negotiable requirement before the account can be activated.


    **Step 3: Fee Disclosure**

    Be transparent about the cost of maintaining the account. Clearly state:

    * An annual debit card fee of ₹250 will be applied.

    * A below MAB charge of ₹500 will be levied if the average balance falls below
    ₹10,000 in a calendar month.


    **Step 4: Explaining Access and Limits**

    Inform the customer that they are entitled to 5 free ATM transactions per month.
    Beyond this limit, standard charges will apply.


    **Step 5: Safety Assurance**

    Reassure the customer that their deposits are secure. Explain that their funds
    are protected by the DICGC insurance scheme up to ₹5,00,000 per depositor.


    **Step 6: Final Confirmation**

    Once the customer agrees to the terms, proceed with the account opening. Confirm
    the account is active and the customer is now ready to begin their banking relationship
    with Chandrika Bank.'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 448ee5ea-eff0-5043-a705-a5da28d29be6
  title: Regular Savings Account — free atm transactions per month explained
  body: '**How many free ATM withdrawals do I get with my Regular Savings Account?**

    We provide 5 free ATM transactions per month to help you manage your cash needs.
    These transactions include both cash withdrawals and balance inquiries performed
    at an ATM.


    **What happens if I exceed the limit of 5 free transactions?**

    Once you exceed 5 free ATM transactions in a single calendar month, a standard
    transaction fee will be applied to each subsequent withdrawal. These fees are
    structured to ensure account sustainability.


    **Do these free transactions apply only to Chandrika Bank ATMs?**

    These transactions are available across our network. For a full list of costs
    associated with exceeding your limits, please refer to Regular Savings Account
    — fee schedule.'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 159c448a-97bf-5709-839e-e36742109125
  title: Regular Savings Account — make a change or update
  body: "If you need to update your personal details or change the preferences associated\
    \ with your Regular Savings Account, please follow these steps.\n\n**Requirements\
    \ Before Starting**\nTo ensure the security of your account, you must have your\
    \ valid PAN card and the mobile device registered for multi-factor authentication\
    \ (MFA) ready.\n\n**Step-by-Step Process**\n1. **State the Update Needed**: Tell\
    \ us exactly which detail you wish to change (e.g., updated residential address,\
    \ new mobile number, or change in email ID).\n2. **Provide Identification**: Provide\
    \ your account number and PAN. We will perform a 'Verify First' check to ensure\
    \ you are the authorised account holder.\n3. **Submit Supporting Documents**:\
    \ If you are changing your address or name, provide a digital copy of a government-approved\
    \ document (such as Aadhaar or a Passport). We will review these documents for\
    \ authenticity.\n4. **Authentication**: We will send a secure OTP to your registered\
    \ mobile number. Tell us the OTP to confirm the request.\n5. **Confirmation**:\
    \ We will update the records in our system and provide you with a confirmation\
    \ reference number. \n\n**How You Know It Worked**\nOnce the update is complete,\
    \ you will receive a confirmation SMS and email stating that your account details\
    \ have been updated. You can also check your updated profile in your next monthly\
    \ statement.\n\nFor changes regarding account closure or downgrades, please refer\
    \ to Regular Savings Account — cancel, close, or downgrade."
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d175c664-9933-52b6-a4f7-126f02b55061
  title: Regular Savings Account — access or login problems
  body: '**Symptom**: You are unable to log in to your digital banking portal or are
    receiving ''Authentication Failed'' messages when trying to access your Regular
    Savings Account.


    **Likely Causes**

    * Incorrect credentials (password or User ID).

    * Expired password due to our 90-day security policy.

    * Multi-factor authentication (MFA) failure due to network issues.

    * Account locked due to multiple incorrect password attempts.


    **What to Check in Order**

    1. **Verify Credentials**: Ensure there are no typos and that your Caps Lock is
    off.

    2. **Check Connectivity**: Ensure your registered mobile phone has a stable network
    connection to receive the OTP.

    3. **Password Age**: Recall if you have changed your password in the last 90 days;
    if not, it may have expired.


    **The Fix**

    * **Password Reset**: Tell us you need to reset your password. We will initiate
    the ''Verify First'' process, requiring your PAN and an OTP sent to your registered
    mobile. Once verified, we will provide a temporary password to allow you to regain
    access.

    * **Account Unlock**: If your account is locked, we will verify your identity
    using your PAN and registered details to unlock the account immediately during
    the conversation.


    **When to Escalate**

    If the login problem persists after a password reset or if you suspect your credentials
    have been compromised, we will escalate the matter to our security team. They
    will freeze your digital access as a precaution and route a specialist to investigate.
    You will receive a case number and an update within 24 to 48 hours via your registered
    email.'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 591307f9-8bdc-5a53-b415-14e1c04c4a67
  title: Regular Savings Account — qualification tiers
  body: 'This matrix assists support agents in determining the account status and
    applicable charges for the Regular Savings Account based on the customer''s balance
    maintenance.


    | Condition | Outcome / Account Status |

    | :--- | :--- |

    | Maintains Monthly Average Balance (MAB) $\ge$ ₹10,000 | Fee-free utility; no
    below MAB charges applied. |

    | Maintains Monthly Average Balance (MAB) $<$ ₹10,000 | Subject to a below MAB
    charge of ₹500 for that calendar month. |

    | Valid PAN provided during KYC | Eligible for account activation and full transaction
    capabilities. |

    | No valid PAN provided | Account cannot be opened; ineligible for Regular Savings
    Account. |

    | Balance maintained $\ge$ ₹0 | Eligible for savings interest rate of 3.5% on
    daily balance. |'
  domain: retail_banking
  product_category: savings_regular
  document_type: eligibility_matrix
  source_authority: official
