- id: 4304bcf9-51dc-5328-b410-2a7bef8385c7
  title: 1-Year Fixed Deposit — tenure months explained
  body: 'Questions regarding the duration of your 1-Year Fixed Deposit:


    Q: What is the exact duration of this deposit?

    A: The 1-Year Fixed Deposit has a fixed tenure of 12 months. This means your funds
    are committed for one full calendar year from the date of booking.


    Q: Can I change the tenure after the deposit is created?

    A: No, the tenure is fixed at 12 months upon inception. If you need access to
    your funds earlier, you may perform a Premature Withdrawal, though this will incur
    a penalty of 1% as detailed in 1-Year Fixed Deposit — fee schedule.


    Q: What happens at the end of the 12 months?

    A: Upon maturity, the principal amount and the accrued interest are credited back
    to your linked account, unless you choose to renew the deposit.'
