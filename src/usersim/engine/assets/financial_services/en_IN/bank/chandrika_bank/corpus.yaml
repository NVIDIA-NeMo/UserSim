    | Requirement | Document Needed | Outcome if Missing |

    | :--- | :--- | :--- |

    | Identity Proof | PAN Card (Mandatory) | Application Rejected |

    | Address Proof | Aadhaar / Voter ID / Utility Bill | Application Pending |

    | KYC Status | PAN-based KYC Verification | Account cannot be opened |

