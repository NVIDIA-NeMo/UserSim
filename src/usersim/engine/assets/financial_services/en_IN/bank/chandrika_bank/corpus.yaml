- id: 1dd28d94-aebb-5cfa-ab50-145b2376caf0
  title: 1-Year Fixed Deposit — vs. a typical competitor offering
  body: 'When comparing the Chandrika Bank 1-Year Fixed Deposit to typical competitor
    offerings in the Indian retail market, the primary differences lie in the balance
    of yield, stability, and penalties.


    Chandrika Bank 1-Year Fixed Deposit:

    - Interest: A competitive flat rate of 7.1% (with an extra 0.5% for senior citizens).

    - Minimum Entry: Low barrier to entry with a minimum deposit of ₹10,000.

    - Lock-in: Fixed 12-month tenure.

    - Penalty: A transparent 1% premature withdrawal penalty.

    - Security: Full DICGC insurance up to ₹5,00,000.


    Typical Competitor Offering:

    - Interest: May vary; some offer slightly higher rates but require much higher
    minimum deposits.

    - Lock-in: Similar 12-month structures, but some may have more complex penalty
    tiers (e.g., penalties that vary based on how early the withdrawal occurs).

    - Access: May lack the seamless integration with UPI-led payment rails that we
    provide.


    Who should choose what?

    - Choose the Chandrika Bank 1-Year Fixed Deposit if you value transparency, need
    a low minimum entry of ₹10,000, and want the peace of mind provided by our stability
    and DICGC protection.

    - A competitor product might be preferable if you are depositing very large sums
    where a fractional difference in interest rate outweighs the convenience of our
    integrated ecosystem.'
