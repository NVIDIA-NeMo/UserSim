- id: b7251556-7efc-50aa-b07d-9a99a1e4a5af
  title: 1-Year Fixed Deposit — make a change or update
  body: 'If you need to update the details associated with your 1-Year Fixed Deposit,
    please follow these steps. Note that the core terms, such as the 7.1% interest
    rate and the 12 months tenure, cannot be changed once the deposit is booked.


    **Prerequisites**

    * Your registered PAN and mobile number for multi-factor authentication.

    * Valid identification if you are updating your legal name or address.


    **Steps to Update Account Details**


    1. **Request the Change:** Tell us which specific detail you wish to update (e.g.,
    your contact email, nominee details, or maturity instructions).

    2. **Identity Verification:** We will perform a security check using PAN-based
    KYC and a multi-factor authentication (MFA) prompt sent to your registered mobile
    number.

    3. **Submit Documentation:** For name or address changes, provide us with the
    updated government-issued identification. We will verify the documents to ensure
    they match our ''Verify First'' standards.

    4. **Confirm the Update:** We will process the change and provide you with a confirmation
    message or an updated account statement reflecting the modification.


    **Updating Maturity Instructions**

    If you wish to change whether the principal and interest are credited back to
    your savings account or paid out via a different method upon the completion of
    the 12 months tenure:


    1. **Specify Instruction:** Tell us your preferred payout method (e.g., ''Credit
    to Savings'' or ''Issue Pay-order'').

    2. **Verification:** We will verify your identity through our standard security
    protocol.

    3. **Confirmation:** We will confirm that your maturity instructions have been
    updated in our records.


    For information on closing your account entirely, please refer to 1-Year Fixed
    Deposit — cancel, close, or downgrade.'
