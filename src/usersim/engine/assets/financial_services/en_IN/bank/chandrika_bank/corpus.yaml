- id: 3e4b0f9c-abbc-5edd-99a6-3cfe97e33b78
  title: 1-Year Fixed Deposit — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in booking
    a 1-Year Fixed Deposit. This product is a low-risk, high-yield investment designed
    for guaranteed returns over a twelve-month horizon.


    **Product Specifications**

    * **Tenure:** 12 months

    * **Standard Interest Rate:** 7.1%

    * **Senior Citizen Benefit:** An additional 0.5% (Total 7.6%)

    * **Minimum Deposit:** ₹10000

    * **Premature Withdrawal Penalty:** 1% of the interest earned


    **Step-by-Step Booking Walkthrough**


    1. **Identity Verification:** Begin by confirming the customer''s identity using
    our ''Verify First'' policy. Ensure the customer has a valid PAN for KYC purposes.

    2. **Funding Source:** Confirm that the customer has sufficient funds in their
    linked savings account (refer to Regular Savings Account — overview) to cover
    the minimum deposit of ₹10000.

    3. **Selection of Tenure:** Confirm the customer understands the lock-in period
    is 12 months. Explicitly mention that any withdrawal before this date will incur
    a premature withdrawal penalty of 1%.

    4. **Rate Application:** Check if the customer qualifies as a senior citizen.
    If yes, apply the extra rate of 0.5% to the base 7.1%.

    5. **Booking Execution:** Process the deposit. The system will generate a Fixed
    Deposit Receipt (FDR) detailing the principal, the 7.1% (or 7.6%) rate, and the
    maturity date.

    6. **Confirmation:** Provide the customer with the FDR and confirm that the funds
    have been debited from their savings account.


    **Compliance Note:** Remind the customer that their deposit is protected by DICGC
    insurance up to ₹5,00,000. Agents must not coerce the customer into higher deposit
    amounts beyond their stated needs.'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4f009584-0238-504d-8715-a3979df40c41
  title: 1-Year Fixed Deposit — senior citizen extra rate explained
  body: '**What is the extra rate for senior citizens on the 1-Year Fixed Deposit?**

    We offer a preferential interest rate to our senior citizen customers to provide
    them with higher returns on their retirement savings. Senior citizens receive
    an extra rate of 0.5% above the standard interest rate.


    **How does this affect the overall yield?**

    Since the standard interest rate for the 1-Year Fixed Deposit is 7.1%, a senior
    citizen will earn a total interest rate of 7.6% for the 12 months tenure.


    **How do I qualify for this higher rate?**

    To qualify, you must provide valid age proof during the PAN-based KYC process.
    We will verify your eligibility before booking the deposit to ensure the correct
    rate is applied. For more details on overall rates, please refer to 1-Year Fixed
    Deposit — rate sheet.'
