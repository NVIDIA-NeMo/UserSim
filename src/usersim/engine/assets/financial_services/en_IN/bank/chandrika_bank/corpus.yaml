- id: b4ceaa40-8f9f-5be9-ba57-988a1019226e
  title: Recurring Deposit — limits, restrictions, and edge cases
  body: "This internal guide outlines the operational limits and edge cases for the\
    \ Recurring Deposit to ensure accurate customer assistance.\n\nCore Parameters:\n\
    - Minimum Monthly Installment: Every account must maintain a minimum monthly contribution\
    \ of ₹500. Requests to open an account with a lower amount should be declined.\n\
    - Tenure: The standard product duration is 24 months. \n- Interest Rate: A flat\
    \ interest rate of 6.8% is applied to the deposits.\n\nRestrictions and Penalties:\n\
    - Missed Payments: If a customer fails to pay a monthly installment on time, a\
    \ missed installment penalty of ₹10 is charged per occurrence.\n- Premature Withdrawal:\
    \ While customers may close their deposit before the 24 months tenure ends, this\
    \ is classified as a Premature Withdrawal and will incur a penalty as per bank\
    \ policy.\n\nEdge Cases for Agents:\n- Low Balance in Linked Account: If the linked\
    \ savings account has insufficient funds for the ₹500 minimum installment, the\
    \ system will trigger the ₹10 penalty. Agents should advise customers to maintain\
    \ sufficient funds to avoid these charges.\n- DICGC Coverage: Always remind customers\
    \ that their total deposits across the bank, including this Recurring Deposit,\
    \ are insured by the DICGC up to ₹5,00,000.\n\nFor a general overview of the product,\
    \ refer to Recurring Deposit — overview."
