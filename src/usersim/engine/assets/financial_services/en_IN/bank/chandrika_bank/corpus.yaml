- id: c50c8d18-16a1-5191-ac0c-3803b8e2f2ec
  title: Regular Savings Account — a discrepancy in your records or statement
  body: "If you notice a transaction you don't recognise or a balance that doesn't\
    \ seem correct, follow these steps to resolve the discrepancy.\n\n**Symptom: 'My\
    \ balance is lower than expected'**\n* **Check the Cause**:\n    1. **MAB Charges**:\
    \ Check if your balance fell below the Monthly Average Balance of ₹10,000. If\
    \ so, a below MAB charge of ₹500 may have been applied.\n    2. **Annual Fees**:\
    \ Look for the debit card annual fee of ₹250, which is deducted yearly.\n    3.\
    \ **Pending Transactions**: Some transactions may be authorised but not yet fully\
    \ settled.\n* **The Fix**: If the charge is a below MAB fee and you believe you\
    \ maintained the balance, we will recalculate the average for the month and reverse\
    \ the charge if an error is found.\n\n**Symptom: 'I see a transaction I did not\
    \ authorise'**\n* **Check the Cause**:\n    1. **Automatic Payments**: Check for\
    \ recurring mandates or bill payments.\n    2. **Fraudulent Activity**: If the\
    \ transaction is genuinely unknown, it may be a result of unauthorised access.\n\
    * **The Fix**: \n    1. We will immediately block your card or account access\
    \ to prevent further loss.\n    2. We will initiate a dispute process following\
    \ the RBI's harmonised turn-around-time (TAT) framework.\n\n**When to Escalate**\n\
    If the discrepancy cannot be resolved through a simple review of the statement,\
    \ we will route the issue to our nodal officers for a formal investigation. You\
    \ will receive a written response and a resolution timeline. If the matter remains\
    \ unresolved, you may then approach the RBI Integrated Ombudsman Scheme.\n\nFor\
    \ more on how we handle these issues, see Regular Savings Account — fee schedule."
