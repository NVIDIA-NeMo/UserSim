- id: 0176ceca-5c00-5909-801c-61823c566dc6
  title: Chandrika Everyday Credit Card — vs. a similar product here
  body: 'When deciding between our credit offering and our primary liquid account,
    the choice depends on whether you need a spending tool or a foundational savings
    tool.


    Chandrika Everyday Credit Card:

    - Cost: Joining fee of ₹500 and annual fee of ₹500 (waivable at ₹150,000 spend).

    - Benefit: 1% reward rate on spends and credit flexibility.

    - Cost of Credit: Monthly finance charge of 3.5%.

    - Best For: Customers who want to manage daily lifestyle expenses and earn rewards
    while using a credit line.


    Regular Savings Account:

    - Cost: No joining fee, but requires maintaining a Monthly Average Balance (MAB)
    for fee-free utility.

    - Benefit: Liquid access to your own funds and stability.

    - Best For: Customers seeking a safe place for daily banking and fund accumulation.


    While the savings account is the better choice for wealth preservation, the Chandrika
    Everyday Credit Card is the superior tool for those seeking short-term liquidity
    and reward-based spending.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ede6074c-5aad-505b-ba89-f80094113068
  title: Chandrika Everyday Credit Card — regulatory disclosures
  body: 'This document provides the necessary regulatory disclosures for the Chandrika
    Everyday Credit Card in accordance with RBI and NPCI frameworks.


    Financial Obligations:

    Customers are obligated to pay the minimum amount due by the statement date. Failure
    to do so will result in the application of a monthly finance charge of 3.5%, which
    equates to an annualised finance charge of 42%. These charges are applied to the
    outstanding balance from the date of transaction until the date of payment.


    Fee Disclosures:

    - A joining fee of ₹500 is charged upon account opening.

    - An annual fee of ₹500 is charged yearly. This fee is waived only if the customer
    achieves a total annual spend of ₹150,000.


    Consumer Protections:

    We adhere strictly to the RBI''s harmonised turn-around-time (TAT) framework for
    the resolution of disputes. In cases of fraudulent activity, liability is minimised
    for the customer based on the timeline of reporting through our dedicated reporting
    path.


    Security Notice:

    In line with our ''Verify First'' policy, all state-changing actions require PAN-based
    KYC and multi-factor authentication. Chandrika Bank agents are strictly prohibited
    from requesting your UPI PIN, OTP, or CVV.


    ***

    Disclaimer: We provide financial education and product information but do not
    offer individualised tax, legal, or investment advice. The terms mentioned here
    are subject to periodic updates as per regulatory mandates.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5237225c-f28d-5f20-b233-628bbc283971
  title: Chandrika Everyday Credit Card — interest rate / APY schedule
  body: 'The Chandrika Everyday Credit Card applies the following rates to all accounts.
    These are flat rates and do not vary based on the credit limit or customer tier.


    - Monthly Finance Charge: 3.5%

    - Annualised Finance Charge: 42%

    - Reward Rate: 1%


    Application of Rates:

    - The Monthly Finance Charge of 3.5% is applied to any unpaid balance remaining
    after the interest-free period has elapsed. This is calculated on a daily basis
    on the outstanding amount.

    - The Reward Rate of 1% is credited to your rewards balance based on eligible
    retail spends.


    These rates are subject to change in accordance with RBI guidelines and the bank''s
    internal cost of funds. Any change in the finance charges will be communicated
    to the customer as per the notice period defined in the Chandrika Everyday Credit
    Card — account agreement.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: rate_sheet
  source_authority: official
