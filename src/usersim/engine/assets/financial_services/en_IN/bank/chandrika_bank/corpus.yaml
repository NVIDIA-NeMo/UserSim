  title: Chandrika Everyday Credit Card — fee schedule
  body: 'The following fees apply to the Chandrika Everyday Credit Card. All charges
    are inclusive of applicable taxes.


    - Joining Fee: ₹500 (One-time)

    - Annual Fee: ₹500 (Recurring yearly)

    - Annual Fee Waiver Threshold: ₹150,000 (Annual spend required for waiver)

    - Monthly Finance Charge: 3.5% (Applied to outstanding balances)

    - Annualised Finance Charge: 42% (The yearly equivalent of the monthly charge)

    - Reward Rate: 1% (Earned on eligible spends)'
