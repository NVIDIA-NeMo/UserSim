  institution_id: chandrika_bank
- id: fbbfb95a-9482-5489-b836-6e3817460e96
  title: Chandrika Everyday Credit Card — recognizing scams targeting this product
  body: 'At Chandrika Bank, we are committed to protecting your financial well-being.
    As you compare our Chandrika Everyday Credit Card with other market offerings,
    it is vital to understand the specific fraud patterns targeting credit card users
    in India.


    Common Scams to Recognise:

    1. The ''Limit Increase'' Trap: Scammers may call or message you claiming they
    can instantly increase your credit limit or waive your ₹500 annual fee if you
    provide a verification code. We will never ask for an OTP to perform these actions.

    2. The ''Reward Points'' Phishing: You may receive alerts stating your 1% reward
    rate has earned you a large cash prize that requires a ''processing fee'' to unlock.
    We do not ask for upfront payments to credit your rewards.

    3. The ''Card Blocked'' Scare: Fraudsters often impersonate bank officials, claiming
    your card is blocked due to a technical error and requesting your CVV or UPI PIN
    to ''unblock'' it.


    Our Strict Security Policy:

    We enforce a ''Verify First'' policy. Chandrika Bank agents are strictly prohibited
    from requesting sensitive credentials, including your UPI PIN, OTPs, or CVV. Any
    request for these details is a definitive sign of a scam.


    What to do if you suspect fraud:

    If you notice any unauthorised transaction or receive a suspicious request, tell
    us immediately. Fraudulent activity must be reported through our dedicated reporting
    path. Your liability is minimised based on how quickly you report the incident,
    following the RBI''s guidelines to ensure your protection.


    ***

    Legal Disclaimer: Card security is a shared responsibility. Ensure your registered
    mobile number is current to receive real-time transaction alerts.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 737259eb-20d5-57ec-a1b5-e37767bfd60b
  title: Chandrika Everyday Credit Card — limits, restrictions, and edge cases
  body: 'This internal guide assists support agents in explaining the boundaries and
    restrictions of the Chandrika Everyday Credit Card to customers.


    Fee Structures and Waivers:

    - Joining Fee: A one-time charge of ₹500 is applied upon card issuance.

    - Annual Fee: A recurring fee of ₹500 is charged yearly.

    - Fee Waiver: The annual fee is waived only if the customer reaches an annual
    spend milestone of ₹1,50,000.


    Interest and Finance Charges:

    - Monthly Finance Charge: A rate of 3.5% is applied to the outstanding balance
    if the full amount is not paid by the due date.

    - Annualised Finance Charge: This equates to an annual rate of 42%.


    Rewards Boundary:

    - Reward Rate: Customers earn rewards at a flat rate of 1% on eligible spends.


    Edge Cases and Restrictions:

    - Spend Calculation: Only successful, non-reversed transactions count toward the
    ₹1,50,000 annual fee waiver threshold.

    - Finance Charge Application: The 3.5% monthly charge is calculated on the average
    daily balance of the outstanding amount.

    - Non-Payment: Failure to pay the minimum amount due may result in card suspension
    and reporting to credit bureaus.


    Compliance Note:

    All card operations must adhere to RBI and NPCI frameworks. Agents must ensure
    the customer has completed PAN-based KYC before discussing specific limit increases
    or state-changing actions.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9db068dd-7a9d-5940-ad59-45258e1177b0
  title: Chandrika Everyday Credit Card — finance charge monthly explained
  body: 'Q: What is the monthly finance charge on the Chandrika Everyday Credit Card?

    A: If you do not pay your total statement balance by the due date, we apply a
    monthly finance charge of 3.5% on the remaining outstanding balance. This charge
    is added to your next statement.


    Q: How can I avoid paying this 3.5% monthly charge?

    A: You can avoid all finance charges by paying the full statement balance on or
    before the due date every month. This allows you to use the credit flexibility
    of the card without incurring interest costs.


    For more details on costs, please refer to the Chandrika Everyday Credit Card
    — fee schedule.'
