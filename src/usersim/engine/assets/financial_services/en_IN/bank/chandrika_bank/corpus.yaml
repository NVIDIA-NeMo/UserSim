- id: 7f9abe7c-2ec0-5b63-b944-401483b77dfc
  title: Chandrika Everyday Credit Card — set up and activate
  body: 'To begin using your Chandrika Everyday Credit Card, please follow these steps
    to ensure your account is secure and ready for transactions.


    Prerequisites:

    - Your physical credit card delivered to your registered address.

    - Your registered mobile phone for receiving authentication codes.

    - A valid PAN for KYC verification.


    Steps to Activate:

    1. Provide us with your credit card number and your PAN. We will verify these
    against your application records to ensure a secure ''Verify First'' match.

    2. We will send a multi-factor authentication (MFA) code to your registered mobile
    number. Please share this code with us to confirm your identity.

    3. Tell us your preferred credit card PIN. We will securely set this in our system.
    Remember, we will never ask you to reveal this PIN once it is set.

    4. We will confirm once the card status is updated to ''Active''. You will receive
    a confirmation notification on your registered mobile number.


    Your card is now ready for use. You can now start spending to earn your 1% reward
    rate. If you wish to manage your card''s security settings in the future, you
    may refer to the Chandrika Everyday Credit Card — account agreement.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
