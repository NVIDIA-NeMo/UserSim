  institution_id: chandrika_bank
- id: 1966728b-765f-5211-9d06-ea4d56af525d
  title: Regular Savings Account — regulatory disclosures
  body: 'This document provides the mandatory regulatory disclosures regarding the
    Regular Savings Account at Chandrika Bank.


    Deposit Insurance:

    All customer deposits held in the Regular Savings Account are protected by the
    Deposit Insurance and Credit Guarantee Corporation (DICGC) insurance scheme. This
    covers up to ₹5,00,000 per depositor in the event of a bank failure.


    Fee Disclosures:

    We believe in transparency. The Regular Savings Account is subject to a below
    MAB charge of ₹500 if the Monthly Average Balance falls below ₹10000. Additionally,
    a debit card annual fee of ₹250 is applicable. These fees are reviewed periodically
    and are designed to ensure account sustainability.


    Interest and Taxation:

    Interest is credited to the account at a savings interest rate of 3.5%. Please
    note that interest earned on savings accounts may be subject to Tax Deducted at
    Source (TDS) as per the prevailing Income Tax Act of India.


    Compliance and Resolution:

    Chandrika Bank adheres strictly to RBI and NPCI frameworks. Any disputes regarding
    transactions are handled according to the RBI''s harmonised turn-around-time (TAT)
    framework. If a dispute remains unresolved through our nodal officers, customers
    may approach the RBI Integrated Ombudsman Scheme.


    ***

    Legal Disclaimer: We provide financial education and product information but do
    not offer individualised tax, legal, or investment advice. Our standard of care
    is to recommend products based on stated customer needs without coercive upselling.'
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
