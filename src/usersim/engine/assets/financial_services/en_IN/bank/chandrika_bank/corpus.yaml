- id: 45dd7190-02b7-58d5-be38-fc2cef8cd2f1
  title: Regular Savings Account — referral and loyalty offer
  body: "We are pleased to invite you to join the Chandrika Bank family. To welcome\
    \ you and reward your trust, we are offering a limited-time loyalty bonus for\
    \ new customers who open a Regular Savings Account between 1st November 2024 and\
    \ 31st December 2024. \n\nIf you are referred by an existing customer, both you\
    \ and the referrer will receive a loyalty credit of ₹500 into your accounts upon\
    \ the successful maintenance of the Monthly Average Balance (MAB) of ₹10,000 for\
    \ the first two consecutive months. \n\nThis account provides you with a steady\
    \ savings interest rate of 3.5% and the stability of a traditional banking partner.\
    \ Start your journey with us today to build a disciplined financial future for\
    \ your household. \n\n***\nDisclaimer: This offer is valid for first-time account\
