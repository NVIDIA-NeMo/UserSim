- id: 101eb8c4-ccfe-5ad3-a0ba-00f00033f58d
  title: Chandrika Everyday Credit Card — privacy and data handling
  body: 'Chandrika Bank is committed to the highest standards of data privacy and
    transparency in accordance with RBI and NPCI frameworks. This disclosure explains
    how we handle your information regarding the Chandrika Everyday Credit Card.


    **Data Collection and Purpose**

    We collect personal and financial data, including your PAN, income details, and
    spending patterns, to perform the following:

    - **KYC Compliance:** To adhere to the ''Verify First'' policy and regulatory
    mandates.

    - **Credit Assessment:** To determine your credit limit and assess the risk of
    lending.

    - **Reward Calculation:** To track your spending against the ₹1,50,000 annual
    threshold for the annual fee waiver and to calculate your 1% reward rate.


    **Data Sharing and Security**

    Your data is shared with credit bureaus to report your payment history. We employ
    multi-factor authentication to protect your account from unauthorised access.
    We will never share your sensitive credentials, such as your CVV or UPI PIN, with
    third parties.


    **Customer Rights**

    You have the right to request a copy of the data we hold about you and to correct
    any inaccuracies. We ensure that all data processing is transparent and non-coercive.


    **Liability and Protection**

    While the credit card is a liability-based product, any associated deposits in
    your linked accounts are protected by DICGC insurance up to ₹5,00,000 per depositor.
    Please refer to the Regular Savings Account — regulatory disclosures for more
    information on deposit protection.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
