- id: d946f489-304a-545e-b8dc-d2366378403e
  title: General frequently asked questions
  body: '### How do I get started with a new account at Chandrika Bank?

    We offer a seamless onboarding process. You can open an account through our digital
    platforms or by visiting any of our branches during IST business hours. All new
    accounts require PAN-based KYC and multi-factor authentication to ensure security.


    ### How can I contact customer support if I have an issue?

    Support is available via our omnichannel digital platforms and in-person branch
    visits. Our front-line agents are trained to assist you with most queries immediately.


    ### What happens if my issue is not resolved by the front-line staff?

    We have a clear escalation path. Issues are moved from front-line agents to our
    Nodal Officers. If a resolution is still not reached, customers may approach the
    RBI Integrated Ombudsman Scheme.


    ### How do I report fraudulent activity on my account?

    Fraudulent activity is routed through a dedicated reporting path. We urge you
    to report such incidents immediately to minimise your liability based on reporting
    timelines.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 95bd3351-e6ac-583c-baf1-435455771c03
  title: Regulatory notes for retail_banking
  body: 'Chandrika Bank operates in strict adherence to the frameworks established
    by the Reserve Bank of India (RBI). Our retail banking operations are designed
    to ensure the fair treatment of customers and absolute transparency in all financial
    disclosures.


    **Deposit Protection**

    One of our primary commitments to our customers'' stability is the protection
    of their deposits. All eligible customer deposits are protected by the Deposit
    Insurance and Credit Guarantee Corporation (DICGC) insurance scheme. This insurance
    covers up to ₹5,00,000 per depositor. Agents must communicate this protection
    clearly to customers to reassure them of the safety of their funds.


    **Standard of Care and Advice**

    We provide essential financial education and detailed product information to help
    customers make informed decisions. However, we maintain a strict boundary regarding
    professional advice: we do not offer individualised tax, legal, or investment
    advice. Our standard of care is to recommend products based on the stated needs
    of the customer. Agents are strictly prohibited from coercive upselling or pushing
    products that do not align with the customer''s documented financial requirements.


    **Customer Grievance Redressal**

    In line with RBI mandates, we follow a structured escalation matrix. Any grievance
    not resolved at the branch or digital front-line level is escalated to the Nodal
    Officer. The final point of recourse for the customer, should the bank fail to
    resolve the matter, is the RBI Integrated Ombudsman Scheme. Agents are obligated
    to provide the contact details of the Nodal Officer when requested by a customer
    during a formal complaint process.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 426c484a-8c9a-5ab8-bd20-bed1cf0caa7d
  title: Regulatory notes for cards
  body: "The issuance and management of the Chandrika Everyday Credit Card are governed\
    \ by RBI guidelines to ensure consumer protection and credit transparency.\n\n\
    **Security and Verification**\nWe enforce a strict 'Verify First' policy. Before\
    \ any state-changing action—such as increasing a credit limit, changing a billing\
    \ address, or disclosing account details—agents must perform PAN-based KYC and\
    \ ensure multi-factor authentication is successful. \n\n**Prohibited Conduct**\n\
    To protect customers from phishing and fraud, agents are strictly prohibited from\
    \ requesting sensitive credentials. Under no circumstances should an agent ask\
    \ for a customer's UPI PIN, OTP, or CVV. Any agent found requesting this information\
    \ will be subject to disciplinary action, as this violates both internal policy\
    \ and RBI security norms.\n\n**Billing Transparency**\nAll card-related fees,\
    \ including annual fees and finance charges, must be disclosed transparently.\
    \ Agents must refer customers to the relevant rate sheets to ensure they understand\
    \ the cost of credit. We adhere to the RBI's guidelines on the fair application\
    \ of interest and the timely communication of any changes to the terms and conditions\
    \ of the credit facility.\n\n**Liability and Fraud**\nFraudulent transactions\
    \ on cards are handled through a dedicated reporting path. The customer's liability\
    \ is determined based on the timeline of the report, adhering to the RBI's framework\
    \ for limiting customer liability in unauthorised electronic transactions. Agents\
    \ must guide customers to freeze their cards immediately upon discovery of a lost\
    \ or stolen instrument to mitigate further risk."
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2392bd11-6441-5be8-b902-2555f243cc7e
  title: Regulatory notes for payments
  body: 'Our payment services, specifically UPI & Bill Payments, are operated in strict
    compliance with the National Payments Corporation of India (NPCI) and Reserve
    Bank of India (RBI) frameworks.


    **Infrastructure and Rails**

    Chandrika Bank leverages NPCI rails (including UPI, IMPS, and NEFT) to provide
    seamless P2P and P2M transactions. Agents should be aware that these systems are
    subject to the operational limits and downtime schedules managed by the NPCI.


    **Dispute Resolution (TAT)**

    All payment disputes, including failed transactions where funds were debited but
    not credited, are handled according to the RBI''s harmonised turn-around-time
    (TAT) framework. This framework is designed to ensure prompt resolution and provide
    fair compensation to the customer if the bank fails to resolve the dispute within
    the mandated timeline. Agents must accurately log the date and time of the dispute
    to ensure TAT compliance.


    **Authentication Protocols**

    Payment actions are subject to multi-factor authentication. The ''Verify First''
    policy is paramount here; agents cannot override security protocols to facilitate
    a payment. The use of the customer''s UPI PIN is a private action performed by
    the customer on their device; agents must never solicit this PIN.


    **Transparency in Charges**

    Any fees associated with the use of payment rails must be clearly disclosed. While
    many UPI services are provided to encourage digital adoption, any applicable charges
    for specific bill payment categories must be presented to the customer before
    the transaction is initiated, ensuring no hidden costs are incurred during the
    payment process.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 631169e9-b2dc-5c2a-af11-5d193791c773
  title: When to use get_account_transactions
  body: 'The `get_account_transactions` tool is the authoritative mechanism for retrieving
    a customer''s transaction history. It should be used whenever a customer requests
    a review of recent activity, asks about a specific debit or credit, or reports
    a discrepancy in their balance.


    **Usage Policy**

    1. **Identity Verification**: Before calling this tool, the agent must successfully
    verify the customer''s identity using the `verify_identity` tool. No transaction
    data may be disclosed without multi-factor authentication.

    2. **Account Identification**: If the customer provides only a partial account
    number (e.g., the last 4 digits), the agent must first use `get_accounts` to resolve
    the full `account_id`.

    3. **Scope of Inquiry**: The tool should be used to answer specific questions
    about transaction dates, amounts, and descriptions. Agents should not read out
    entire long histories unless specifically requested, but rather filter for the
    relevant transactions.


    **Procedure**

    1. Greet the customer and identify the nature of their inquiry (e.g., "I don''t
    see my salary credit").

    2. Call `verify_identity` to ensure the caller is the authorised account holder.

    3. Call `get_accounts` to retrieve the correct `account_id` associated with the
    customer''s profile.

    4. Call `get_account_transactions` using the `account_id` and any applicable date
    filters to locate the transaction in question.

    5. Communicate the findings to the customer in a professional and reassuring tone.


    If the transaction history reveals a fraudulent charge, the agent must immediately
    transition to the fraud reporting path as detailed in our security advisories.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: chandrika_bank
- id: dd15614f-3808-5c4d-bb7b-82b4daf9d351
  title: get_account_transactions tool reference
  body: "The `get_account_transactions` tool retrieves a detailed list of credits\
    \ and debits for a specified account. \n\n**Signature**\n`get_account_transactions(account_id:\
    \ string, start_date: string, end_date: string)`\n\n**Arguments**\n- `account_id`:\
    \ The unique identifier of the account for which transactions are being requested.\n\
    - `start_date`: The beginning date for the transaction look-back period (YYYY-MM-DD).\n\
    - `end_date`: The ending date for the transaction look-back period (YYYY-MM-DD).\n\
    \n**Effect**\nThis is a read-only tool. It returns a list of transactions including\
    \ the amount, date, transaction type, and description. The agent performs this\
    \ action by calling the tool directly within the conversation flow after the customer's\
    \ identity has been verified. It does not change any state on the account."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: chandrika_bank
- id: 0940e0a8-8ab8-5867-9789-fd204bd3dc5a
  title: When to use make_upi_payment
  body: 'The `make_upi_payment` tool is used to execute a fund transfer from a customer''s
    account to a recipient via NPCI rails. This is a state-changing action and must
    be handled with extreme caution.


    **Usage Policy**

    1. **Strict Verification**: The agent must call `verify_identity` and complete
    multi-factor authentication before initiating any payment. This is non-negotiable.

    2. **Consent**: The agent must explicitly confirm the payment amount and the recipient''s
    VPA (Virtual Payment Address) with the customer before calling the tool.

    3. **Credential Safety**: Agents must never ask for the customer''s UPI PIN. The
    tool handles the backend execution via the bank''s authenticated session; the
    agent''s role is to trigger the request based on verified customer intent.


    **Procedure**

    1. Identify the customer''s intent to make a payment.

    2. Call `verify_identity` to authenticate the session.

    3. Call `get_accounts` to identify the source `account_id` from which funds will
    be debited.

    4. Confirm the recipient''s VPA and the exact amount to be transferred (e.g.,
    "Confirming you wish to send ₹1,500 to recipient@upi").

    5. Call `make_upi_payment` with the `account_id`, `recipient_vpa`, and `amount`.

    6. Inform the customer once the transaction is successfully processed or if it
    has failed.


    If the transaction fails, the agent should advise the customer on the RBI''s TAT
    framework for resolution.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: chandrika_bank
- id: 256b37a6-8176-529d-a533-64dc11ad49ba
  title: make_upi_payment tool reference
  body: 'The `make_upi_payment` tool initiates an instant digital fund transfer using
    NPCI rails.


    **Signature**

    `make_upi_payment(account_id: string, recipient_vpa: string, amount: number)`


    **Arguments**

    - `account_id`: The unique identifier of the source account.

    - `recipient_vpa`: The Virtual Payment Address of the receiver.

    - `amount`: The numeric value of the currency to be transferred.


    **Effect**

    This is a state-changing tool. It debits the specified amount from the customer''s
    account and credits it to the recipient''s VPA. The agent performs this action
    by calling the tool directly after verifying the customer''s identity and obtaining
    explicit consent for the amount and recipient.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: chandrika_bank
- id: f72a9c53-c27f-594f-a483-8cc88974e7c0
  title: When to use book_fixed_deposit
  body: "The `book_fixed_deposit` tool is used to open a new 1-Year Fixed Deposit\
    \ for a customer, converting liquid funds into a low-risk, high-yield investment.\n\
    \n**Usage Policy**\n1. **Identity and Funding**: The agent must verify the customer\
    \ via `verify_identity` and ensure the source account has sufficient funds using\
    \ `get_account_transactions` or `get_accounts`.\n2. **Product Suitability**: Agents\
    \ must ensure the customer understands the nature of the product—specifically\
    \ that it is a 12-month horizon investment. \n3. **Disclosure**: Agents must inform\
    \ the customer about the implications of a Premature Withdrawal, noting that closing\
    \ the deposit before the agreed tenure usually incurs a penalty.\n\n**Procedure**\n\
    1. Confirm the customer's desire to invest in a 1-Year Fixed Deposit.\n2. Call\
    \ `verify_identity` to authenticate the customer.\n3. Call `get_accounts` to determine\
    \ the available `account_id` for funding.\n4. Confirm the investment amount and\
    \ the 12-month duration with the customer.\n5. Call `book_fixed_deposit` using\
    \ the `account_id` and the `amount`.\n6. Provide the customer with the confirmation\
    \ details of the deposit and remind them that the funds are protected by DICGC\
    \ insurance up to ₹5,00,000.\n\nAgents should avoid coercive upselling and only\
    \ proceed if the product matches the customer's stated need for guaranteed returns\
    \ over a one-year period."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - book_fixed_deposit
  institution_id: chandrika_bank
- id: 576db5da-9597-5aeb-859e-73a1f5ff1c7b
  title: book_fixed_deposit tool reference
  body: 'The book_fixed_deposit tool allows agents to create a new fixed deposit account
    for a customer. The agent performs this action by calling the tool directly within
    the conversation once the customer''s identity is verified.


    **Tool Signature and Arguments:**

    - `account_id`: The unique identifier of the funding source account.

    - `amount`: The principal sum to be deposited (in ₹).

    - `tenure_months`: The duration of the deposit in months.


    **Effect:**

    Upon successful execution, the tool debits the specified amount from the source
    account and creates a new fixed deposit record with the assigned interest rate
    for the chosen tenure. This tool is primarily used for the 1-Year Fixed Deposit
    product and other tenure-based deposit instruments. Agents must ensure the customer
    has sufficient funds in their source account before attempting this action.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - book_fixed_deposit
  institution_id: chandrika_bank
- id: ee55555f-8d1c-5892-9e3c-054483944e44
  title: When to use file_transaction_dispute
  body: 'We are committed to resolving transaction discrepancies promptly and transparently.
    This policy outlines the procedure for agents to initiate a formal dispute for
    a customer''s transaction. All disputes are handled according to the RBI''s harmonised
    turn-around-time (TAT) framework to ensure prompt resolution and compensation.


    **Applicability**

    Agents should use this process when a customer reports:

    1. Duplicate debits for a single transaction.

    2. Transactions that failed but where funds were not reversed.

    3. Unauthorised transactions (though fraud reporting paths may also be required).

    4. Incorrect transaction amounts.


    **Procedure**

    1. **Verify Identity**: Perform multi-factor authentication and PAN-based KYC
    verification as per our ''Verify First'' policy.

    2. **Identify Account**: Use `get_accounts` to resolve the customer''s account_id
    from their provided account details or last-4 digits.

    3. **Review History**: Use `get_account_transactions` to locate the specific transaction
    and confirm the date, amount, and status.

    4. **Gather Details**: Confirm the exact transaction ID and the reason for the
    dispute from the customer.

    5. **Execute Dispute**: Call the `file_transaction_dispute` tool providing the
    transaction ID and the dispute category.


    Once filed, the customer can track the progress of their request. If the issue
    remains unresolved after the nodal officer''s review, the customer may escalate
    the matter via the RBI Integrated Ombudsman Scheme.


    For further details on tracking a request, refer to When to use dispute_status.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: chandrika_bank
- id: eb0431fd-c9da-5451-ba71-322a3a947117
  title: file_transaction_dispute tool reference
  body: 'The file_transaction_dispute tool is used to formally register a customer''s
    objection to a specific transaction. The agent performs this action by calling
    the tool directly; the customer is not required to fill out external forms for
    the initial filing.


    **Tool Signature and Arguments:**

    - `transaction_id`: The unique identifier of the transaction being disputed.

    - `reason_code`: A standardised code representing the nature of the dispute (e.g.,
    duplicate charge, failed transaction).

    - `amount`: The specific amount in ₹ that is being contested.


    **Effect:**

    This tool initiates a dispute case in the backend system. It flags the transaction
    for investigation under the RBI''s harmonised turn-around-time (TAT) framework.
    This ensures the case is routed to the appropriate investigation team for resolution
    and potential compensation.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: chandrika_bank
- id: fa1d97cc-eab5-535a-8f8e-fec9ff03e82a
  title: When to use freeze_card
  body: 'To protect our customers from unauthorised spending and potential fraud,
    we provide an immediate card-freezing mechanism. This action is a preventative
    measure to minimise customer liability based on reporting timelines.


    **Applicability**

    Agents must use the freeze function immediately when a customer reports:

    1. A lost or stolen Chandrika Everyday Credit Card.

    2. Suspected fraudulent activity on the card.

    3. Misplacement of the card where the customer wishes to secure the account while
    searching for it.


    **Procedure**

    1. **Verify Identity**: Strictly enforce the ''Verify First'' policy using PAN-based
    KYC and multi-factor authentication.

    2. **Identify Card**: Use `get_accounts` to retrieve the customer''s active card
    profiles and confirm which card needs to be frozen.

    3. **Freeze Card**: Call the `freeze_card` tool using the specific card identifier.

    4. **Confirm Action**: Inform the customer that the card is now inactive and no
    further transactions can be processed.

    5. **Next Steps**: If the card is permanently lost or stolen, advise the customer
    on the process for a replacement.


    **Security Note**

    Agents are strictly prohibited from requesting sensitive credentials such as UPI
    PINs, OTPs, or CVVs during this process. Our focus is on securing the account,
    not accessing the credentials.


    For replacing a frozen card, refer to When to use order_replacement_card.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: chandrika_bank
- id: b551deb6-0729-5496-8919-bb6b9d3ced90
  title: freeze_card tool reference
  body: 'The freeze_card tool is used to instantly disable all transaction capabilities
    of a specific credit or debit card. The agent performs this action by calling
    the tool directly within the conversation.


    **Tool Signature and Arguments:**

    - `card_id`: The unique identifier of the card to be frozen.


    **Effect:**

    Calling this tool places an immediate block on the card. Any subsequent attempts
    to use the card for POS, Online, or ATM transactions will be declined. This action
    is reversible if the card is found and the customer requests an unfreeze through
    the verified channels, or it can be followed by a permanent cancellation and replacement
    order.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: chandrika_bank
- id: 08273398-10fe-58ab-88b2-110de6cd9ab4
  title: When to use get_accounts
  body: 'To ensure accuracy and security, agents must always have a comprehensive
    view of a customer''s relationship with Chandrika Bank before performing state-changing
    actions. The `get_accounts` tool serves as the primary discovery mechanism for
    account identifiers.


    **Applicability**

    Agents should use this tool in the following scenarios:

    1. When a customer provides only a partial account number (e.g., the last 4 digits)
    and the agent needs the full `account_id` for another tool.

    2. To verify which products a customer currently holds (e.g., checking if they
    have a Regular Savings Account or a Recurring Deposit).

    3. To confirm the current status of an account (Active, Dormant, or Frozen).

    4. Before initiating fund transfers or booking deposits to ensure the funding
    account exists and is eligible.


    **Procedure**

    1. **Verify Identity**: The agent must first complete PAN-based KYC and multi-factor
    authentication. No account details should be retrieved without a verified identity.

    2. **Request Details**: Ask the customer for the account they are referring to
    or their registered mobile number/customer ID.

    3. **Retrieve Accounts**: Call the `get_accounts` tool.

    4. **Confirm with Customer**: Once the list is retrieved, confirm with the customer
    which specific account they wish to operate on based on the product type and last
    few digits.


    This tool is a read-only operation and does not alter any account states. It is
    the essential first step for nearly all subsequent account-based operations.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: chandrika_bank
- id: 8d39c279-ef0a-5c60-817f-5c1ac23120dc
  title: get_accounts tool reference
  body: 'The get_accounts tool retrieves a list of all financial accounts associated
    with a verified customer. The agent performs this action by calling the tool directly
    to resolve account identifiers for further operations.


    **Tool Signature and Arguments:**

    - No arguments are typically required as the tool identifies accounts based on
    the currently authenticated customer session.


    **Effect:**

    The tool returns a list of accounts, including the `account_id`, product type
    (e.g., savings_regular, fixed_deposit_1yr), current balance, and account status.
    This is a read-only tool and has no side effects on the customer''s funds or account
    configuration.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: chandrika_bank
- id: 967e0519-dbf8-5a09-a8a6-f81b54dc5feb
  title: When to use open_account
  body: 'Chandrika Bank focuses on providing stability for middle-income households.
    Opening a new account requires strict adherence to regulatory frameworks and the
    ''Verify First'' security policy.


    **Applicability**

    Agents should use this process when a customer wishes to:

    1. Open a Regular Savings Account for daily banking needs.

    2. Start a Recurring Deposit to build a corpus over time.

    3. Establish a new account relationship after passing initial eligibility checks.


    **Procedure**

    1. **Verify Identity**: Perform full PAN-based KYC and multi-factor authentication.
    This is mandatory before any account opening can proceed.

    2. **Assess Needs**: Determine the customer''s objective to recommend the correct
    product (e.g., liquid daily banking vs. disciplined monthly savings) without coercive
    upselling.

    3. **Check Eligibility**: Ensure the customer meets the requirements specified
    in the relevant eligibility matrix.

    4. **Collect Configuration**: Determine the initial deposit amount and, for recurring
    deposits, the monthly installment amount.

    5. **Execute Opening**: Call the `open_account` tool with the required product_id
    and initial funding details.

    6. **Disclosure**: Clearly inform the customer about the Monthly Average Balance
    (MAB) requirements for savings accounts and the protection provided by DICGC insurance
    covering up to ₹5,00,000.


    **Compliance Note**

    Agents must ensure that all regulatory disclosures are presented clearly. For
    more information on the specific requirements for different accounts, refer to
    Regular Savings Account — eligibility requirements.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: chandrika_bank
- id: cdad43fd-5fa0-5c25-af1f-704944dc2ef3
  title: open_account tool reference
  body: 'The open_account tool is used to instantiate a new bank account for a verified
    customer. The agent performs this action by calling the tool directly.


    **Tool Signature and Arguments:**

    - `product_id`: The identifier of the product to be opened (e.g., ''savings_regular'',
    ''recurring_deposit'').

    - `initial_deposit`: The amount in ₹ to be deposited at the time of opening.

    - `funding_account_id`: The account_id from which the initial deposit will be
    debited.


    **Effect:**

    This is a state-changing operation. Upon success, the tool creates a new account
    record, assigns an account number, and transfers the initial deposit from the
    funding account to the new account. The account is then marked as active and available
    for use.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: chandrika_bank
- id: ac9a413f-b682-5cbf-97cb-86bdaa70fff7
  title: When to use close_account
  body: "Closing an account is an irreversible action. We aim to ensure that customers\
    \ are fully aware of the implications, including the loss of interest and any\
    \ applicable penalties for premature withdrawal of deposits.\n\n**Applicability**\n\
    Agents should use this process when a customer explicitly requests to close:\n\
    1. A Regular Savings Account.\n2. A Fixed Deposit or Recurring Deposit (noting\
    \ this constitutes a Premature Withdrawal if done before the tenure ends).\n\n\
    **Procedure**\n1. **Verify Identity**: Enforce a strict 'Verify First' policy\
    \ using PAN-based KYC and multi-factor authentication. Given the irreversible\
    \ nature of this action, verification must be flawless.\n2. **Identify Account**:\
    \ Use `get_accounts` to find the exact `account_id` of the account to be closed.\n\
    3. **Balance Settlement**:\n    - Determine the remaining balance in the account.\n\
    \    - Ask the customer for a destination account to transfer the remaining funds.\n\
    \    - Use `transfer_funds` to clear the balance to ₹0.\n4. **Confirm Finality**:\
    \ Warn the customer that the action is irreversible. For fixed deposits, explicitly\
    \ mention the penalty for Premature Withdrawal.\n5. **Execute Closure**: Call\
    \ the `close_account` tool using the `account_id`.\n\n**Post-Closure**\nInform\
    \ the customer that the account is now closed. If the customer was maintaining\
    \ a Monthly Average Balance (MAB) to avoid fees, remind them that this benefit\
    \ ceases upon closure.\n\nFor details on penalties associated with closing deposits\
    \ early, refer to 1-Year Fixed Deposit — premature withdrawal penalty explained."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: chandrika_bank
- id: 814e8b0a-39ca-5a56-a348-de3e243d0cae
  title: dispute_status tool reference
  body: "The `dispute_status` tool allows agents to retrieve the current progress\
    \ and resolution state of a previously filed transaction dispute. We use this\
    \ tool to provide customers with transparent updates on their claims, ensuring\
    \ alignment with the RBI's harmonised turn-around-time (TAT) framework.\n\n**Tool\
    \ Signature:** `dispute_status(dispute_id: string)`\n\n**Arguments:**\n- `dispute_id`:\
    \ The unique alphanumeric identifier assigned to the dispute at the time of filing.\n\
    \n**Effect:**\nCalling this tool retrieves the current status (e.g., Under Review,\
    \ Resolved, More Information Required) and any associated notes or resolution\
    \ outcomes for the specific dispute ID provided. \n\nThe agent performs this action\
    \ by calling the tool directly within the conversation to inform the customer\
    \ of the status; the agent must not redirect the customer to an external portal\
    \ to check this information themselves."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: chandrika_bank
- id: e237dc82-5fe7-58de-b254-b6c859591e59
  title: When to use manage_authorized_users
  body: 'We provide the ability for primary account holders to grant specific access
    rights to other individuals. This is common for joint household management or
    assisting elderly family members with their banking needs. To ensure security,
    we enforce a strict ''Verify First'' policy, requiring PAN-based KYC and multi-factor
    authentication before any changes to account access are made.


    **Procedure for Managing Authorized Users:**


    1. **Identity Verification:** The agent must first verify the identity of the
    primary account holder using the `verify_identity` tool. No changes to authorized
    users may be performed without successful multi-factor authentication.

    2. **Account Identification:** Use the `get_accounts` tool to resolve the correct
    `account_id` based on the customer''s provided account details or last-four digits.

    3. **Request Validation:** Confirm whether the customer wishes to add a new authorized
    user, remove an existing one, or modify the permissions of a current user.

    4. **Credential Collection:** Collect the necessary details for the authorized
    user, ensuring all mandatory KYC information is present as per RBI guidelines.

    5. **Execution:** The agent completes the request by calling the `manage_authorized_users`
    tool with the required account and user parameters.

    6. **Confirmation:** Inform the customer that the change has been processed and
    provide a confirmation reference number.


    Agents are strictly prohibited from requesting sensitive credentials such as UPI
    PINs, OTPs, or CVVs during this process. If the customer is unsure about the risks
    of adding an authorized user, agents should provide general financial education
    on account security without offering individualised legal advice.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: chandrika_bank
- id: eaee2017-a7e3-509f-821d-57067b328c24
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool is used to add, remove, or update the
    access permissions of individuals authorized to operate a customer''s account.
    We use this to facilitate secure, delegated account management.


    **Tool Signature:** `manage_authorized_users(account_id: string, user_details:
    object, action: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account being modified.

    - `user_details`: An object containing the authorized user''s identity information
    (e.g., name, PAN, contact details).

    - `action`: The specific operation to perform; valid values are ''ADD'', ''REMOVE'',
    or ''UPDATE''.


    **Effect:**

    Executing this tool updates the account''s authorization registry in our core
    banking system. This change takes effect immediately, allowing or restricting
    the specified user''s ability to perform actions on the account.


    The agent performs this action by calling the tool directly in the conversation
    after completing the mandatory identity verification process. The agent must not
    instruct the customer to visit a branch or use a web form for this specific action.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: chandrika_bank
- id: fd614c25-69c4-5952-b4e6-fce378244eed
  title: UPI & Bill Payments — referral and loyalty offer
  body: "We are pleased to reward our community for helping us grow. From 1st November\
    \ 2024 to 31st January 2025, we are offering a loyalty bonus to our existing customers.\
    \ \n\nIf you refer a friend or family member to open an account and activate UPI\
    \ & Bill Payments, we will credit a referral bonus of ₹200 to your account once\
    \ the new user completes their first transaction of at least ₹100. \n\nAs a thank\
    \ you for your continued trust in Chandrika Bank, users who maintain an active\
    \ UPI profile and perform more than 20 bill payments within this promotional period\
    \ will receive an additional loyalty reward of ₹100. \n\nWe invite you to share\
    \ the seamless experience of our NPCI-led payment rails with your loved ones.\
    \ This offer is subject to our standard terms and conditions."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 1d9d46ce-d493-52ce-9c0a-158f5ae62050
  title: UPI & Bill Payments — account security best practices
  body: "At Chandrika Bank, we prioritise the safety of your funds. As you use UPI\
    \ & Bill Payments, please remain vigilant against evolving fraud patterns. \n\n\
    Common Scams to Avoid:\n1. Request Money Scams: Be aware that you never need to\
    \ enter your UPI PIN to receive money. If someone asks you to 'verify' a payment\
    \ by entering your PIN, it is a fraudulent attempt to withdraw funds from your\
    \ account.\n2. Fake QR Codes: Only scan QR codes from trusted merchants. Fraudsters\
    \ often send QR codes via SMS or email claiming you have won a prize.\n3. Screen\
    \ Sharing Apps: Never download remote access apps at the request of someone claiming\
    \ to be a bank official.\n\nOur Strict Security Promise:\nWe follow a 'Verify\
    \ First' policy. Chandrika Bank agents will NEVER ask you for your UPI PIN, One-Time\
    \ Passwords (OTPs), or CVVs. Any request for these credentials is a sign of fraud.\n\
    \nImmediate Action Steps:\nIf you notice any unauthorised transaction or suspect\
    \ your account has been compromised, please notify us immediately. Under the RBI's\
    \ harmonised turn-around-time (TAT) framework, reporting fraudulent activity promptly\
    \ is critical to minimising your liability. \n\nTo secure your account, we recommend\
    \ using the UPI Lite feature for small-value payments, which limits your transaction\
    \ exposure to ₹500 per transaction. For further details on general account protection,\
    \ you may refer to Regular Savings Account — account security best practices."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c8a20122-bc0c-5d69-a152-a6d0ba6875dc
  title: UPI & Bill Payments — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms governing
    UPI & Bill Payments at Chandrika Bank.


    Right to Modify: We reserve the right to amend the transaction limits and operational
    guidelines of our payment services to remain compliant with RBI and NPCI frameworks.
    This includes changes to the current per transaction limit of ₹100,000 and the
    daily limit of ₹100,000.


    Notice Period: We will provide you with a minimum of 30 days'' notice before any
    material change to fees or restrictive limits becomes effective. Notice will be
    delivered via your registered email or mobile number.


    Acceptance of Terms: Your continued use of the UPI & Bill Payments service after
    the notice period expires constitutes your legal acceptance of the revised terms.
    If you do not agree to the changes, you may request to deactivate your UPI profile.


    Mandate Caps: Terms regarding automated payments are strictly governed by NPCI
    rails. Specifically, the cap for autopay mandates without additional factor authentication
    (AFA) is fixed at ₹15,000. Any change to this regulatory threshold will be reflected
    in our terms immediately upon NPCI notification.


    Termination: We may suspend your access to payment services if we detect activity
    that violates our risk and compliance posture or if your KYC documents are found
    to be expired. Such actions are taken to protect your deposits and ensure institutional
    stability.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: terms_conditions
  source_authority: official
