  institution_id: chandrika_bank
- id: 11b86ea8-88fa-5888-8ca0-96edfda9c0d9
  title: Recurring Deposit — check status or history
  body: 'If you have an active Recurring Deposit, you can easily track your contributions
    and accrued interest by following these steps:


    What you need before starting:

    - Your registered mobile number or customer ID for verification.


    Steps to check your status:

    1. Request your current Recurring Deposit status. We will perform a mandatory
    multi-factor authentication to verify your identity.

    2. Specify if you want a summary of the total amount deposited to date or a detailed
    history of all monthly installments.

    3. We will then provide your current balance, the number of installments completed
    out of the 24 months tenure, and the total interest earned at the 6.8% rate.

    4. If you are looking for specific dates of payments, ask us for your transaction
    history for this product. We will provide a chronological list of all credits
    and any missed installment penalties of ₹10 that may have been applied.


    How you know it worked:

    You will receive a clear statement showing your total principal invested, the
    current accrued interest, and the date of maturity for your 24-month term.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
