- id: 70327772-9414-511f-a3c8-29a631857356
  title: Recurring Deposit — recognizing scams targeting this product
  body: 'At Chandrika Bank, we are committed to protecting your hard-earned savings.
    As you evaluate different saving options, please be aware of specific fraud patterns
    that target disciplined saving products like the Recurring Deposit.


    Common Scam Patterns:

    1. The ''Bonus Interest'' Trap: Scammers may contact you claiming that your Recurring
    Deposit is eligible for an ''exclusive'' interest rate hike above our standard
    6.8%, provided you transfer a lump sum to a ''verification account''.

    2. The Maturity Acceleration Scam: You may receive messages claiming your 24 months
    tenure can be shortened if you pay a processing fee via a third-party link.

    3. Impersonation: Fraudsters may pose as bank officials requesting your credentials
    to ''update your KYC'' to avoid a missed installment penalty.


    Our Absolute Security Promise:

    We will never ask you for your UPI PIN, OTP, CVV, or any other sensitive passwords.
    Our staff will never request that you move funds to a private account to ''unlock''
    higher returns or speed up the maturity of your deposit.


    What to do if something looks wrong:

    If you receive a suspicious request or notice an unauthorized transaction, report
    it to us immediately through our dedicated fraud reporting path. Your liability
    is minimized based on how quickly you report the activity; prompt reporting ensures
    we can act swiftly to secure your funds.


    ***

    Disclaimer: All customer deposits are protected by the DICGC insurance scheme
    up to ₹5,00,000 per depositor.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
