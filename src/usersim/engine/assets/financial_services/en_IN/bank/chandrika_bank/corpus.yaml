- id: 7c16149b-937b-502f-85b9-9d3ad78b7c63
  title: 1-Year Fixed Deposit — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the 1-Year
    Fixed Deposit product offered by Chandrika Bank.


    Deposit Insurance:

    All customer deposits in the 1-Year Fixed Deposit are protected by the Deposit
    Insurance and Credit Guarantee Corporation (DICGC). This insurance covers up to
    ₹5,00,000 per depositor, including both principal and interest.


    Regulatory Compliance:

    Chandrika Bank adheres strictly to the frameworks established by the Reserve Bank
    of India (RBI) and the National Payments Corporation of India (NPCI). We ensure
    fair treatment and transparency in all disclosures and transaction processing.


    Interest and Taxation:

    Interest is credited as per the product terms at a rate of 7.1% for general customers
    and 7.6% for senior citizens. Please be advised that interest earned on fixed
    deposits is subject to Tax Deducted at Source (TDS) as per the prevailing Income
    Tax Act of India. The bank is mandated to deduct tax if the interest exceeds the
    threshold prescribed by the government.


    Withdrawals:

    While we encourage holding the deposit for the full 12 months tenure, premature
    withdrawal is permitted. In such cases, a premature withdrawal penalty of 1% will
    be applied to the interest payable.


    ***

    Disclaimer: We provide financial education and product information but do not
    offer individualised tax, legal, or investment advice. Our standard of care is
    to recommend products based on stated customer needs without coercive upselling.'
