- id: a8e37605-eb25-5acc-adee-a0507df66046
  title: 1-Year Fixed Deposit — a failed or pending action
  body: 'If you have attempted to open a 1-Year Fixed Deposit and the action appears
    as ''failed'' or ''pending'', please follow these steps to resolve the issue.


    Common Symptoms:

    - An error message stating ''Insufficient Funds''.

    - The deposit does not appear in your active holdings despite a debit from your
    savings account.

    - A ''KYC Pending'' notification.


    What to check:

    1. Balance Check: Ensure your linked account has at least ₹10,000 plus any applicable
    taxes, as the minimum deposit is ₹10,000.

    2. KYC Status: Confirm that your PAN-based KYC is complete. If your documents
    have expired, the system will block state-changing actions.

    3. Authentication: Ensure you have completed the multi-factor authentication step
    during the request.


    How we resolve it:

    - If funds were debited but the deposit was not created, tell us the transaction
    date and amount. We will initiate a reconciliation check. If a system error is
    found, we will either complete the booking or reverse the funds to your account
    within the RBI''s harmonised turn-around-time (TAT).

    - If KYC is the blocker, we will guide you through the document submission process
    to reactivate your profile.


    If the issue remains unresolved after these checks, we will escalate the matter
    to our nodal officers for a priority resolution.'
