- id: f034ac9b-2749-5c3b-a192-04d0b91624de
  title: 1-Year Fixed Deposit — set up and activate
  body: 'Setting up your 1-Year Fixed Deposit is a straightforward process. Please
    ensure you have a funded account with us and your PAN-based KYC is up to date
    before beginning.


    Steps to activate your deposit:


    1. Tell us that you wish to open a 1-Year Fixed Deposit and specify the amount
    you wish to invest. Please note that the minimum deposit required is ₹10,000.

    2. We will verify your identity through our multi-factor authentication process
    to ensure your account security.

    3. Confirm the deposit details we provide, including the 12 months tenure and
    the applicable interest rate of 7.1% (or 7.6% if you are a senior citizen).

    4. Provide your consent to debit the chosen amount from your linked savings account.

    5. We will then process the booking and provide you with a Fixed Deposit Advice/Certificate
    containing your deposit account number and the maturity date.


    Your deposit is now active. You can verify the booking by checking your account
    balance or requesting a current list of your active deposits. For those who prefer
    a liquid account for daily needs, you may also refer to Regular Savings Account
    — overview.'
