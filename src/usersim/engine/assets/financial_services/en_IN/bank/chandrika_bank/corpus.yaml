- id: 6ad44c67-d82d-51f9-a17c-555f7303f0bc
  title: 1-Year Fixed Deposit — account security best practices
  body: 'At Chandrika Bank, the security of your hard-earned savings is our highest
    priority. To ensure your 1-Year Fixed Deposit remains protected, we urge you to
    follow these essential security practices.


    **Recognising Fraudulent Patterns**

    Fraudsters often target fixed deposit holders by claiming that your deposit has
    ''matured prematurely'' or that you are eligible for an ''unclaimed bonus'' that
    requires immediate verification. They may attempt to create a sense of urgency
    to trick you into revealing sensitive data.


    **Our Strict Security Policy**

    We operate a ''Verify First'' policy. While we may ask for PAN-based KYC to verify
    your identity, Chandrika Bank agents will NEVER ask you for the following:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * Your Debit Card CVV

    * Your Net Banking password


    If any individual claiming to be from our bank requests these details, terminate
    the communication immediately.


    **Immediate Action for Suspected Fraud**

    If you notice any unauthorised change to your account or receive a suspicious
    request, notify us immediately. To minimise your liability, fraudulent activity
    must be reported through our dedicated reporting path as soon as it is discovered.
    Prompt reporting ensures we can freeze the affected accounts and initiate a recovery
    process according to RBI guidelines.


    **Safe Management**

    Always ensure that you are using our official omnichannel digital platforms for
    checking your deposit status. Avoid clicking on links sent via SMS or unofficial
    emails that claim to lead to your account dashboard.


    ***

    Disclaimer: Security of funds is also supported by DICGC insurance covering up
    to ₹5,00,000 per depositor. ***'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b9fd42fc-e799-503a-a010-df7894f32a06
  title: 1-Year Fixed Deposit — change-of-terms policy
  body: 'This document outlines the policies regarding the modification of terms for
    the 1-Year Fixed Deposit. By booking this deposit, you agree to the following
    binding terms:


    **1. Interest Rate Modifications**

    The standard interest rate of 7.1% is locked for the duration of the 12 months
    tenure. We do not alter the interest rate of an existing fixed deposit once it
    has been booked. However, we reserve the right to change the rates offered for
    new deposits based on market conditions and RBI guidelines.


    **2. Senior Citizen Provisions**

    Customers qualifying as senior citizens are entitled to an extra rate of 0.5%
    over the standard rate. This eligibility is verified at the time of booking via
    PAN-based KYC. Any change in residency or citizenship status that affects this
    eligibility must be disclosed to us immediately.


    **3. Premature Withdrawal**

    While we encourage maintaining the deposit for the full 12 months, we allow premature
    withdrawal. Please note that such actions trigger a premature withdrawal penalty
    of 1% deducted from the applicable interest rate. This penalty is applied to ensure
    the sustainability of our deposit products.


    **4. Minimum Deposit Requirement**

    To maintain the account, a minimum deposit of ₹10000 is required at inception.
    Deposits falling below this threshold will not be accepted for this specific product.


    **5. Notice of Changes**

    Chandrika Bank will provide a minimum of 30 days'' notice for any changes to the
    general terms and conditions of our retail banking services. Such notices will
    be sent via your registered email or SMS.


    **6. Termination**

    This agreement ends upon the maturity of the 12 months tenure and the subsequent
    payout of the principal and interest, or upon the completion of a premature withdrawal
    request.'
