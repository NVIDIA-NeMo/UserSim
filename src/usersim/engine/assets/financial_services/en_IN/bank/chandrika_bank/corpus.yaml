- id: cbfed784-976a-5bfb-9033-cc997dbefa28
  title: 1-Year Fixed Deposit — access or login problems
  body: "**Symptom:** You are unable to view your 1-Year Fixed Deposit details on\
    \ our digital platforms or cannot access the account dashboard.\n\n**Likely Causes**\n\
    * **KYC Expiry:** Your PAN-based KYC may have expired or requires a periodic update.\n\
    * **Authentication Failure:** Multi-factor authentication (MFA) errors due to\
    \ an outdated mobile number.\n* **System Maintenance:** Temporary downtime of\
    \ the bank's digital interface.\n\n**What to Check and How to Fix**\n\n1. **Check\
    \ Connectivity:** Ensure you have a stable internet connection and that you are\
    \ using the official Chandrika Bank application or portal.\n2. **Verify Credentials:**\
    \ Ensure you are using the correct login credentials. If you have forgotten your\
    \ password, request a reset. We will send a secure link to your registered email.\n\
    3. **Confirm Mobile Number:** If you are not receiving the MFA OTP, verify that\
    \ your current mobile number is the one registered with us. If it has changed,\
    \ you must undergo a fresh identity verification process.\n4. **KYC Status:**\
    \ If your account is locked due to KYC requirements, provide us with your updated\
    \ PAN details. Once we verify these, your access will be restored.\n\n**When We\
    \ Escalate**\nIf the issue persists after verifying your credentials and KYC status,\
    \ we will escalate the matter to our technical nodal officers. \n\n* **Action:**\
    \ We will raise a technical support ticket to investigate potential database synchronisation\
    \ errors.\n* **Timeline:** You will receive an update on the status of your access\
    \ within 2 to 3 business days.\n* **Resolution:** Once resolved, you will receive\
    \ a notification via SMS and will be able to view your 12 months tenure deposit\
    \ and the 7.1% interest accruals again."
