- id: a7894c32-e221-5063-ab01-8f17fc8e66f4
  title: Recurring Deposit — account security best practices
  body: "At Chandrika Bank, the security of your hard-earned savings is our highest\
    \ priority. As you build your corpus through your Recurring Deposit, we urge you\
    \ to follow these essential security practices to protect your funds.\n\n**Recognising\
    \ Fraudulent Patterns**\nFraudsters often target disciplined savers by pretending\
    \ to be bank officials offering 'special bonus interest rates' or 'immediate maturity'\
    \ if you provide your credentials. Be aware that we will never contact you to\
    \ ask for sensitive information to 'verify' your deposit.\n\n**Our Strict 'Verify\
    \ First' Policy**\nWe adhere to a strict security protocol. Please remember that\
    \ Chandrika Bank agents will NEVER ask you for the following:\n* Your UPI PIN\n\
    * One-Time Passwords (OTPs)\n* Your Debit Card CVV\n* Your Net Banking password\n\
    \nAny request for these details is a fraudulent attempt and should be ignored\
    \ immediately.\n\n**Immediate Actions for Compromised Accounts**\nIf you notice\
    \ any unauthorised transaction or receive a suspicious request for your credentials,\
    \ you must report it to us immediately. According to RBI guidelines, reporting\
    \ fraudulent activity promptly is critical to minimising your liability. \n\n\
    To secure your account, tell us to freeze your linked savings account or block\
    \ your digital access immediately. We will then route your case through our dedicated\
    \ fraud reporting path to ensure a swift investigation and resolution.\n\nFor\
    \ more information on protecting your overall banking experience, you may refer\
    \ to Regular Savings Account — account security best practices."
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 6c87a1d0-26cc-5fe3-883e-5fb2b50bf67f
  title: Recurring Deposit — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of the Recurring Deposit at Chandrika Bank. By maintaining an account, you agree
    to the following binding terms:


    **1. Modification of Terms**

    We reserve the right to modify the terms of this product, including the interest
    rate of 6.8% and the missed installment penalty of ₹10. Any such changes will
    be communicated to you via your registered email or SMS at least 30 days prior
    to the effective date.


    **2. Interest Rate Stability**

    For the duration of your 24 months tenure, the interest rate is generally locked;
    however, regulatory changes mandated by the RBI may necessitate adjustments to
    the yield structure.


    **3. Obligations Regarding Installments**

    Customers are obligated to maintain the minimum monthly installment of ₹500. Failure
    to remit the installment by the agreed date will trigger a penalty of ₹10 per
    missed installment, which will be deducted from the final maturity amount.


    **4. Premature Closure**

    If you choose to close the account before the 24 months tenure is complete, the
    act of Premature Withdrawal will be subject to a penalty, which may result in
    a lower interest rate than the original 6.8%.


    **5. Termination of Agreement**

    This agreement ends upon the maturity of the 24 months tenure and the subsequent
    payout of the principal and interest, or upon the formal closure of the account
    by either party.


    **6. Regulatory Compliance**

    All deposits are protected by DICGC Insurance covering up to ₹5,00,000 per depositor.
    We strictly adhere to the RBI''s harmonised turn-around-time (TAT) framework for
    any disputes arising from changes in terms.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 77143b39-21ea-5885-8a57-051cf8bf9e67
  title: Recurring Deposit — getting started walkthrough
  body: 'This guide is designed for support agents to assist customers in opening
    a Recurring Deposit. The Recurring Deposit is a disciplined monthly saving tool
    designed to build a corpus over time with competitive interest.


    **Product Specifications**

    * **Minimum Monthly Installment:** ₹500

    * **Tenure:** 24 months

    * **Interest Rate:** 6.8%

    * **Missed Installment Penalty:** ₹10


    **Walkthrough Steps for the Customer**

    1. **Eligibility Check:** Ensure the customer has an active savings account with
    us. If not, guide them to open one as per Regular Savings Account — eligibility
    requirements.

    2. **KYC Verification:** Confirm the customer''s PAN-based KYC is up to date.
    We follow a ''Verify First'' policy; do not proceed without valid identification.

    3. **Amount Selection:** Ask the customer to specify their monthly installment
    amount. Remind them that the minimum is ₹500.

    4. **Tenure Confirmation:** Confirm the customer understands the commitment to
    a 24 months term.

    5. **Funding Source:** Confirm that the linked savings account will be used for
    the monthly auto-debit of the installment.

    6. **Final Review:** Read back the interest rate of 6.8% and the ₹10 penalty for
    any missed installments to ensure full transparency.

    7. **Execution:** Once the customer provides verbal or digital consent, we will
    process the account opening.


    **Post-Opening Confirmation**

    Once the account is active, we will provide the customer with a Recurring Deposit
    receipt detailing the start date, the monthly installment amount, the 24 months
    tenure, and the projected maturity value. Remind the customer that their deposits
    are safe and covered by DICGC Insurance up to ₹5,00,000.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cd573bec-e387-57da-89a2-094acdef1c65
  title: Recurring Deposit — interest rate explained
  body: '**How is the interest calculated on my Recurring Deposit?**

    We provide a competitive interest rate of 6.8% for our Recurring Deposit. Interest
    is compounded based on the monthly installments you contribute over the 24 months
    tenure, ensuring your money grows steadily.


    **Will my interest rate change during the 24 months tenure?**

    No, the interest rate of 6.8% is fixed for the duration of your 24 months tenure,
    providing you with guaranteed returns regardless of market fluctuations.


    **What happens to my interest if I miss an installment?**

    While the 6.8% rate remains, a missed installment penalty of ₹10 will be applied
    for each single payment missed. This does not change the rate but reduces the
    final amount you receive at maturity.


    For a detailed look at our other saving options, you may review Recurring Deposit
    — overview.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 60426f6e-e7eb-55e4-9357-171211f9f2e8
  title: Recurring Deposit — make a change or update
  body: 'If you need to update the details of your existing Recurring Deposit, please
    follow these steps. Note that some fundamental terms, such as the 24 months tenure,
    cannot be altered once the account is active.


    **Requirements before starting**

    * Your account number.

    * Valid PAN-based KYC (must be current).

    * Multi-factor authentication (your registered mobile device for OTP).


    **Steps to update your Recurring Deposit**

    1. **Identity Verification:** Provide your account details. We will perform a
    security check and send an OTP to your registered mobile number to verify your
    identity.

    2. **Request the Change:** Tell us which detail you wish to update. Common updates
    include changing the linked savings account used for the monthly installment.

    3. **Provide New Details:** If you are changing the funding source, provide the
    new savings account number. We will verify that this account is also held in your
    name.

    4. **Review the Impact:** We will confirm if the change affects your current status.
    For example, we will remind you that the minimum monthly installment must remain
    at least ₹500.

    5. **Confirmation:** Once the update is processed, we will provide you with a
    confirmation notification via SMS and email.


    **How you know it worked**

    You will receive a digital amendment advice in your registered email, and the
    next monthly installment will be debited from the updated source account.


    If you wish to close the account entirely instead of updating it, please refer
    to Recurring Deposit — cancel, close, or downgrade.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 431d9e03-3938-5414-8596-a0983213abc8
  title: Recurring Deposit — access or login problems
  body: "If you are unable to view your Recurring Deposit details or access your account\
    \ via our digital platforms, please follow these troubleshooting steps.\n\n**Symptom:\
    \ 'Account Not Visible' or 'Login Failed'**\n\n**Likely Causes**\n* Incorrect\
    \ credentials or expired password.\n* KYC documents have expired, leading to a\
    \ temporary account freeze.\n* Technical synchronisation issues with the NPCI\
    \ rails or our internal ledger.\n\n**Steps to Resolve**\n1. **Verify Credentials:**\
    \ Ensure you are using the correct user ID and password. If you have forgotten\
    \ your password, ask us to trigger a password reset link to your registered email.\n\
    2. **Check KYC Status:** Ask us to verify if your PAN-based KYC is still valid.\
    \ If it has expired, we will guide you through the re-verification process.\n\
    3. **Authentication Check:** Ensure you have access to your registered mobile\
    \ number to complete the multi-factor authentication. If you have changed your\
    \ number, we must update your contact info first.\n4. **System Status:** Ask us\
    \ to check if there is a known service outage affecting the digital view of deposit\
    \ products.\n\n**When to Escalate**\nIf the credentials are correct and KYC is\
    \ valid but the Recurring Deposit is still not visible, we will escalate this\
    \ to our technical backend team. \n\n**What happens next**\nWe will raise a high-priority\
    \ ticket with our technical specialists. You will receive a ticket reference number\
    \ and a resolution timeline (typically 2-3 business days). Once resolved, you\
    \ will receive a notification via SMS confirming that your account access has\
    \ been restored.\n\nFor general access issues with your main account, you may\
    \ also look at Regular Savings Account — access or login problems."
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ad6f3f6e-be52-5be7-8242-8d14834d6fbb
  title: Recurring Deposit — qualification tiers
  body: 'The following matrix defines the qualification requirements for opening a
    Recurring Deposit at Chandrika Bank. This is for internal support use to ensure
    customer eligibility.


    | Requirement | Threshold / Condition | Outcome |

    | :--- | :--- | :--- |

    | **Identity Proof** | Valid PAN-based KYC | Eligible to proceed |

    | **Account Status** | Active Chandrika Bank Savings Account | Eligible to proceed
    |

    | **Minimum Monthly Commitment** | $\geq$ ₹500 | Account can be opened |

    | **Minimum Monthly Commitment** | $<$ ₹500 | Ineligible (Below minimum threshold)
    |

    | **Account Tenure** | Fixed at 24 months | Eligible for standard rate of 6.8%
    |

    | **Authentication** | Multi-factor Authentication (MFA) enabled | Eligible for
    digital account opening |


    All eligible customers receive the same interest rate of 6.8% regardless of the
    installment amount, provided the minimum of ₹500 is met.'
