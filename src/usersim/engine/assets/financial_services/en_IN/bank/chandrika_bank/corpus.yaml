- id: c99df3be-867e-5de4-b8e0-aea63577c990
  title: 1-Year Fixed Deposit — choosing between tiers or options
  body: "When deciding how to save, you may be choosing between our 1-Year Fixed Deposit\
    \ and other disciplined saving tools. \n\n**1-Year Fixed Deposit vs. Recurring\
    \ Deposit**\n* **Deposit Structure:** The 1-Year Fixed Deposit requires a one-time\
    \ lump sum minimum deposit of ₹10000. In contrast, the Recurring Deposit (see\
    \ Recurring Deposit — overview) is designed for monthly contributions.\n* **Returns:**\
    \ The 1-Year Fixed Deposit offers a guaranteed interest rate of 7.1% (or 7.6%\
    \ for senior citizens) on the entire principal for the 12 months tenure.\n* **Lock-in:**\
    \ Both products have lock-in periods, but the 1-Year Fixed Deposit is best for\
    \ those who already have a corpus and want a high, guaranteed yield without monthly\
    \ effort.\n\n**Who should choose the 1-Year Fixed Deposit?**\nThis product is\
    \ ideal for salaried professionals and households who have a lump sum of at least\
    \ ₹10000 and seek a stable, low-risk environment for their money with a fixed\
    \ return for exactly one year.\n\n**Who should choose the Recurring Deposit?**\n\
    If you prefer to build your corpus over time through monthly savings rather than\
    \ a single upfront payment, the Recurring Deposit is the better choice."
