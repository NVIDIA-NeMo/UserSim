  title: Recurring Deposit — current offer
  body: "Boost your savings with our Limited Time Loyalty Bonus! \n\nWe are rewarding\
    \ our existing customers who demonstrate exceptional saving discipline. From 1st\
    \ November 2024 to 31st January 2025, any customer who opens a new Recurring Deposit\
