- id: bf533173-1a3a-5fd6-9772-5b2f0776f397
  title: Recurring Deposit — vs. a typical competitor offering
  body: 'When comparing the Chandrika Bank Recurring Deposit with typical competitor
    offerings in the Indian retail market, the primary differences lie in our commitment
    to stability and transparent penalty structures.


    Dimensions of Comparison:

    - Interest Rate: We offer a competitive rate of 6.8% for a 24-month tenure. While
    some competitors may offer slightly higher ''teaser'' rates, we provide a stable,
    guaranteed return for the entire duration.

    - Entry Barrier: Our minimum monthly installment is ₹500, making it highly accessible
    for middle-income households compared to some institutional products that require
    higher minimums.

    - Penalties: We maintain a transparent missed installment penalty of ₹10. Some
    competitors use complex percentage-based penalties that can be harder to predict.

    - Security: Your funds are protected by DICGC Insurance up to ₹5,00,000, providing
    a layer of safety common to traditional banks but often missing in non-banking
    financial company (NBFC) alternatives.


    Who each suits:

    - The Chandrika Bank Recurring Deposit is best for those who value predictability,
    traditional banking security, and a low-barrier entry point.

    - A competitor offering might be better for those seeking extremely high-risk/high-reward
    instruments or those who can commit to much larger monthly sums for specialized
    corporate rates.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ff3a7493-9738-5686-a563-0ca4f10b2922
  title: Recurring Deposit — risk disclosures
  body: 'This document provides essential risk and regulatory disclosures regarding
    the Recurring Deposit product at Chandrika Bank.


    Investment Risk: The Recurring Deposit is a low-risk investment product. Unlike
    equity-linked instruments, the return is guaranteed at an interest rate of 6.8%
    for the 24-month tenure, provided all terms of the agreement are met.


    Liquidity Risk: This product is designed for long-term disciplined saving. Withdrawing
    funds before the 24-month maturity period constitutes a Premature Withdrawal.
    This action will trigger a penalty and a reduction in the interest rate applied
    to your deposits, meaning you will receive less than the projected maturity amount.


    Default Risk and Insurance: In the highly unlikely event of institutional failure,
    customer deposits are protected by the Deposit Insurance and Credit Guarantee
    Corporation (DICGC) insurance scheme. This covers up to ₹5,00,000 per depositor,
    including both principal and interest.


    Regulatory Compliance: Chandrika Bank operates under the strict guidelines of
    the Reserve Bank of India (RBI). All interest calculations and penalty applications,
    including the ₹10 missed installment penalty, are performed in adherence to RBI''s
    fair treatment of customers framework.


    Taxation: Please be advised that interest earned on Recurring Deposits is subject
    to Tax Deducted at Source (TDS) as per the prevailing Income Tax Act of India.
    We provide financial education on our products but do not offer individualised
    tax, legal, or investment advice. We recommend consulting a qualified tax professional
    for your specific situation.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7eaedfbf-c221-5a0d-aaf3-24ab7ccc8dba
  title: Recurring Deposit — how rates are tiered and applied
  body: 'The Recurring Deposit offers a straightforward, flat interest structure to
    ensure transparency for all our customers.


    Interest Rate: A flat interest rate of 6.8% applies to all Recurring Deposit accounts
    regardless of the monthly installment amount, provided the minimum monthly installment
    of ₹500 is met.


    Application of Rate:

    - The 6.8% rate is applied to the balance of the account throughout the 24-month
    tenure.

    - Interest is compounded as per the bank''s standard quarterly cycle and credited
    upon maturity of the deposit.


    Factors that can change the rate:

    - Premature Withdrawal: If you close the account before the 24-month tenure, the
    6.8% rate will no longer apply. Instead, the interest will be recalculated based
    on the actual period the funds remained with the bank, minus a premature withdrawal
    penalty.

    - Regulatory Changes: Any changes in the RBI''s monetary policy that mandate an
    adjustment in deposit rates will be communicated to you and applied according
    to regulatory timelines.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
