- id: de0ff5b1-721d-57a1-928d-d6b9ae0ee53b
  title: Recurring Deposit — who it is best for and common use cases
  body: 'The Recurring Deposit is a disciplined monthly saving tool designed for middle-income
    Indian households and salaried professionals who wish to build a substantial corpus
    over time without committing a large lump sum upfront.


    Who it is best for:

    - Salaried individuals who want to automate their savings from their monthly paycheque.

    - First-time savers who prefer a structured approach to wealth creation.

    - Customers seeking a low-risk investment with guaranteed returns, avoiding the
    volatility of the stock market.


    Common Use Cases:

    - Saving for an annual insurance premium or festival expenses.

    - Building a dedicated fund for a child''s education or a family vacation.

    - Creating an emergency buffer while earning a higher rate than a standard savings
    account.


    Product Specifications:

    - Minimum Monthly Installment: ₹500

    - Fixed Tenure: 24 months

    - Interest Rate: 6.8%

    - Missed Installment Penalty: ₹10


    By committing to a monthly contribution of at least ₹500, you ensure a steady
    growth of your wealth over the 24-month period. This product provides a stable
    alternative to liquid accounts, offering a competitive interest rate of 6.8% while
    maintaining the safety of DICGC Insurance up to ₹5,00,000.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: bbe32df8-a1c0-5870-a191-4dcd8c1ab8f5
  title: Recurring Deposit — tenure months explained
  body: "Q: What is the fixed duration for my Recurring Deposit? \nA: The standard\
    \ tenure for this specific Recurring Deposit product is 24 months. This means\
    \ you commit to making monthly installments for a period of two years to reach\
    \ maturity.\n\nQ: Can I change the tenure after the account is opened? \nA: No,\
    \ the tenure of 24 months is fixed at the time of account opening. If you need\
    \ access to your funds earlier, you would need to opt for a Premature Withdrawal,\
    \ which may involve a penalty and a reduction in the interest earned.\n\nQ: What\
    \ happens at the end of the 24 months? \nA: Once the tenure is complete, your\
    \ total accumulated principal plus the interest earned at 6.8% will be paid out\
    \ to you.\n\nFor more information on the costs associated with this product, please\
    \ see Recurring Deposit — cost and charges."
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9f608beb-cb67-5960-96a1-cd09eed8f0e9
  title: Recurring Deposit — cancel, close, or downgrade
  body: 'If you find that your financial needs have changed and you can no longer
    maintain your Recurring Deposit, you may request to close the account. Please
    note that because this is a fixed-term product, ''downgrading'' is not applicable;
    you must either maintain the account or close it.


    Steps to close your Recurring Deposit:


    1. Request Closure: Tell us that you wish to perform a Premature Withdrawal of
    your Recurring Deposit. You will need to provide your account number and a valid
    reason for the closure.


    2. Verification: We will perform a identity check following our ''Verify First''
    policy, which includes PAN-based KYC verification and multi-factor authentication
    to ensure the request is legitimate.


    3. Penalty Calculation: We will calculate the final payout. This includes the
    total installments paid, minus the premature withdrawal penalty, and the adjusted
    interest (which may be lower than the original 6.8% depending on how long the
    account was active).


    4. Confirmation of Payout: We will provide you with a final settlement amount.
    Once you confirm your agreement to the calculated payout, we will process the
    closure.


    5. Funds Transfer: We will transfer the balance amount to your linked savings
    account. You will receive a confirmation notification once the funds have been
    credited.


    Your account is considered closed once the final settlement is credited and the
    Recurring Deposit record is marked as inactive in our system.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 731a10cb-fd6d-50b7-88b2-d9716be8d27b
  title: Recurring Deposit — an unexpected charge or amount
  body: 'Symptom: You notice a deduction from your account that you did not authorize,
    or your final maturity amount is lower than you expected.


    Likely Causes:

    - Missed Installment Penalty: If a monthly installment was not funded by the due
    date, a penalty of ₹10 has been applied.

    - Premature Withdrawal Penalty: If the account was closed before the 24-month
    tenure, a penalty was applied to the principal or interest.

    - Tax Deducted at Source (TDS): Interest earned above certain thresholds may be
    subject to government tax.


    What to check in order:

    1. Review your transaction history: Check if any monthly installment was missed.
    If a payment was skipped, the ₹10 charge is a standard penalty.

    2. Check the closure date: If you closed the account before the end of the 24-month
    tenure, verify the Premature Withdrawal terms.

    3. Verify interest calculation: Ensure you are calculating interest based on the
    6.8% rate applied to the monthly balance, not a lump sum.


    Resolution:

    - If the charge is a valid ₹10 missed installment penalty, no further action is
    needed; ensure future installments are funded on time.

    - If you believe a penalty was charged in error (e.g., funds were available but
    not debited), tell us. We will investigate the transaction logs.


    Escalation:

    - If we cannot resolve the discrepancy immediately, we will raise a formal case.
    You will receive a case number and a resolution timeline based on the RBI''s harmonised
    turn-around-time (TAT) framework. If unresolved, the matter can be escalated to
    our nodal officer and eventually the RBI Integrated Ombudsman Scheme.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
