- id: 128ffd83-ed0b-5df0-9469-3abee5c96184
  title: Chandrika Everyday Credit Card — comparison vs. alternatives and when not
    to choose it
  body: 'Choosing the right credit tool depends on your spending habits and financial
    discipline. Here is how the Chandrika Everyday Credit Card compares to other options.


    Key Features of Chandrika Everyday Credit Card:

    - Costs: A joining fee of ₹500 and an annual fee of ₹500.

    - Rewards: A consistent 1% reward rate on spends.

    - Flexibility: An annual fee waiver is available if you spend ₹1,50,000 or more
    in a year.

    - Cost of Credit: A monthly finance charge of 3.5% (42% annualised) on outstanding
    balances.


    When this card is the best choice:

    - You are a salaried professional looking for a reliable tool for daily expenses.

    - You typically spend at least ₹12,500 per month (averaging ₹1,50,000 per year),
    making the card effectively free of annual charges.

    - You prefer a traditional, trust-centric institution with clear transparency
    on fees.


    When you should consider alternatives:

    - If you struggle with credit discipline: With a high annualised finance charge
    of 42%, this card is not suitable for those who cannot pay their balances in full.
    A debit-led approach via our UPI suite may be safer.

    - If you spend very little: If your annual spend is well below ₹1,50,000, the
    ₹500 annual fee may outweigh the benefits of the 1% reward rate.

    - If you seek high-yield investments: If your goal is growth rather than spending,
    consider our 1-Year Fixed Deposit — overview or Recurring Deposit — overview instead.


    ***

    Legal Disclaimer: Credit card approval is subject to credit score checks and internal
    bank policy.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 14f615d8-9ebe-5545-aa5c-edf45e180a5e
  title: Chandrika Everyday Credit Card — finance charge annualised explained
  body: 'Q: What does ''annualised finance charge'' mean for my credit card?

    A: While we apply interest on a monthly basis, the annualised finance charge represents
    the total cost of borrowing over a full year. For the Chandrika Everyday Credit
    Card, the annualised rate is 42%.


    Q: Why is the annualised rate 42% when the monthly charge is 3.5%?

    A: The annualised rate is the monthly charge of 3.5% multiplied by the 12 months
    in a year (3.5% x 12 = 42%). This figure helps you compare the cost of this credit
    card against other long-term loans or credit products.


    Q: How do I stop the 42% annualised interest from accumulating?

    A: The most effective way is to pay your total statement balance in full every
    month. When you do this, you avoid the finance charges entirely.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8cb50680-7bc8-5195-bfc7-097eb1fad3ea
  title: Chandrika Everyday Credit Card — resolve a common request end-to-end
  body: 'This guide explains how to request and confirm an annual fee waiver for your
    Chandrika Everyday Credit Card.


    Prerequisites:

    - Your card account number.

    - A total annual spend of at least ₹1,50,000 in the preceding 12-month cycle.


    Steps to resolve your fee waiver request:

    1. Tell us that you wish to apply for the annual fee waiver based on your spending
    milestone.

    2. We will verify your identity using PAN-based KYC and multi-factor authentication.

    3. We will then review your transaction history for the last 12 months to confirm
    that your total spends have reached or exceeded ₹1,50,000.

    4. If the criteria are met, we will apply the waiver to the ₹500 annual fee currently
    charged or pending on your account.

    5. We will provide you with a confirmation reference number for the waiver.

    6. We will send an updated statement or a notification email showing the reversal
    of the ₹500 charge.


    You will know the request is resolved when the ₹500 fee no longer appears as ''Due''
    on your current statement and you have received the confirmation email.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8beb638c-eac9-50da-8561-ff0283cf3066
  title: Chandrika Everyday Credit Card — a discrepancy in your records or statement
  body: 'Symptom: You have noticed an unfamiliar transaction, an incorrect finance
    charge, or a missing reward credit on your Chandrika Everyday Credit Card statement.


    Likely Causes:

    - Merchant Processing Delay: A transaction may be listed under a parent company
    name different from the shop''s brand.

    - Interest Calculation: The 3.5% monthly finance charge may seem high if the balance
    was not cleared on time.

    - Reward Latency: The 1% reward credit may take one billing cycle to appear.

    - Duplicate Billing: A merchant may have accidentally processed the same transaction
    twice.


    What to check in order:

    1. Merchant Name: Compare the transaction date and amount with your own receipts
    to see if it matches a known purchase.

    2. Payment Date: Check if your previous payment was credited before the due date
    to verify if the 3.5% monthly charge was applied correctly.

    3. Reward Terms: Ensure the transaction was an ''eligible spend'' that qualifies
    for the 1% reward rate.


    How to resolve:

    - For unfamiliar transactions: Tell us the specific transaction details. We will
    immediately initiate a freeze on the card if you suspect fraud and start a dispute
    process.

    - For incorrect charges: Provide us with the supporting evidence (e.g., payment
    confirmation). We will review the entry against our records.


    When to escalate:

    If we cannot resolve the discrepancy during the conversation, we will route the
    issue to our nodal officers. We handle all such disputes according to the RBI''s
    harmonised turn-around-time (TAT) framework. If the matter remains unresolved
    after following our internal escalation path, you may approach the RBI Integrated
    Ombudsman Scheme.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7fa950f4-1740-579b-99e2-f37105379221
  title: UPI & Bill Payments — overview
  body: 'Welcome to UPI & Bill Payments, our instant, digital-first payment suite
    designed to make your daily transactions effortless. By leveraging NPCI rails,
    we provide you with a seamless way to handle person-to-person (P2P) and person-to-merchant
    (P2M) payments, as well as your utility bills, all from the comfort of your mobile
    device.


    We believe in providing a stable yet modern banking experience. This service is
    integrated with your Chandrika Bank account, ensuring that your funds move securely
    and instantly. Whether you are paying a local vendor or settling a monthly electricity
    bill, our system is built for reliability and speed.


    To ensure the security of your funds and the stability of the network, we have
    established the following transaction limits:


    • Standard UPI Transaction Limit: You can send up to ₹100000 per transaction.

    • Daily UPI Limit: Your total transfers across all UPI transactions are capped
    at ₹100000 per day.

    • UPI Lite Limit: For small, frequent payments, our UPI Lite feature allows for
    a per-transaction limit of ₹500.

    • Autopay Mandates: For recurring payments where Additional Factor Authentication
    (AFA) is not required, there is a cap of ₹15000.


    Our service is designed to be transparent and accessible, providing you with the
    agility of modern fintech backed by the trust of a traditional retail institution.
    We encourage you to use these tools to maintain a disciplined financial routine
    while enjoying the convenience of instant payments.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f8af7706-5bd8-5a4f-a7c8-2d945b7feedd
  title: UPI & Bill Payments — upi per transaction limit explained
  body: 'Q: What is the maximum amount I can send in a single UPI transaction?


    A: For standard transactions using UPI & Bill Payments, the limit is ₹100000 per
    transaction. Please note that this is subject to your overall daily limit as well.


    Q: If I try to send more than ₹100000 in one go, what will happen?


    A: The transaction will be declined by the system to adhere to the safety and
    regulatory limits set for the product. You may split your payment into smaller
    amounts, provided the total does not exceed your daily cap.


    Q: Does the per-transaction limit apply to UPI Lite as well?


    A: No, UPI Lite is designed for micro-payments and has a much lower per-transaction
    limit of ₹500. For a detailed breakdown of all limits, please refer to UPI & Bill
    Payments — overview.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c8f71652-67ab-58f7-ad6f-a1f33c544e12
  title: UPI & Bill Payments — set up and activate
  body: 'Setting up your UPI & Bill Payments suite is a straightforward process. Before
    you begin, please ensure you have your active Chandrika Bank account details and
    the mobile number linked to your bank account currently inserted in your device.


    Step 1: Provide us with your registered mobile number. We will send a verification
    SMS to your device to confirm your identity.


    Step 2: Complete the PAN-based KYC verification. This is a mandatory requirement
    under our ''Verify First'' policy to ensure the security of your account.


    Step 3: Select the bank account you wish to link to the UPI service. We will then
    verify the account details via the NPCI rails.


    Step 4: Set your secure UPI PIN. You will need your debit card details to create
    this PIN. Please remember that we will never ask you for this PIN, your OTP, or
    your CVV.


    Step 5: Create your unique Virtual Payment Address (VPA), such as ''name@chandrikabank''.


    Once these steps are complete, we will confirm that your UPI profile is active.
    You can now start making payments up to the per-transaction limit of ₹100000.
    For further details on how to manage your funds, you may also look at Regular
    Savings Account — overview.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f9fb04b9-55b1-5340-a46d-b01ed4c0553b
  title: UPI & Bill Payments — fee schedule
  body: 'At Chandrika Bank, we aim to encourage the adoption of digital payments to
    foster disciplined financial habits. Our fee structure for UPI & Bill Payments
    is as follows:


    • UPI Transaction Fee (P2P): ₹0

    • UPI Transaction Fee (P2M): ₹0

    • UPI Lite Transaction Fee: ₹0

    • Bill Payment Processing Fee: ₹0

    • Autopay Mandate Setup Fee: ₹0


    We provide these digital payment services free of charge to our customers to ensure
    a seamless and cost-effective banking experience. All transactions are processed
    via NPCI rails without any additional levies from the bank.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 76b57a4a-1857-55a1-8623-4cf41fe790aa
  title: UPI & Bill Payments — a failed or pending action
  body: 'It can be concerning when a payment does not go through as expected. If you
    experience a failed or pending transaction, please follow these steps:


    Symptom: Your account has been debited, but the recipient has not received the
    funds, or the transaction status is ''Pending''.


    1. Check your internet connectivity and ensure the NPCI rails are not experiencing
    a general downtime.

    2. Verify the transaction amount. Ensure it does not exceed the per-transaction
    limit of ₹100000 or the UPI Lite limit of ₹500 for Lite payments.

    3. Confirm that the total amount sent today does not exceed the daily limit of
    ₹100000.

    4. Review the recipient''s VPA for any typing errors.


    If the transaction remains ''Pending'' or ''Failed'' after 24 hours:


    We will initiate a formal trace of the funds. Once you notify us of the issue,
    we will route the dispute through our dedicated reporting path. In accordance
    with the RBI''s harmonised turn-around-time (TAT) framework, we will work to resolve
    the issue and ensure any eligible compensation is provided promptly.


    If the funds are not reversed automatically within the RBI-mandated timeframe,
    we will escalate the matter to our nodal officer. As a final recourse, customers
    may approach the RBI Integrated Ombudsman Scheme. For more on how we protect your
    account, see Regular Savings Account — fraud and unauthorized-activity protection.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 889d656e-135a-56d9-bd78-c7fc932c5d44
  title: UPI & Bill Payments — eligibility requirements
  body: 'To use UPI & Bill Payments, customers must meet the following criteria:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Account Status | Active Savings or Current Account | Eligible |

    | Identity Verification | Completed PAN-based KYC | Eligible |

    | Mobile Linking | Mobile number registered with bank | Eligible |

    | Device Security | Multi-factor authentication enabled | Eligible |

    | KYC Status | Pending or Expired KYC | Ineligible |

    | Account Type | Non-UPI enabled account | Ineligible (Must upgrade) |'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 28ddc482-aaac-55da-8bd0-bb2840882473
  title: UPI & Bill Payments — vs. a similar product here
  body: 'When deciding how to manage your daily spend, you may compare UPI & Bill
    Payments with the Chandrika Everyday Credit Card.


    UPI & Bill Payments is a debit-led system. It uses funds available in your account
    and is subject to a daily limit of ₹100000 and a per-transaction limit of ₹100000.
    It is best for those who prefer using their own funds and want instant, free P2P
    transfers.


    Chandrika Everyday Credit Card offers a credit line, allowing for deferred payments
    and rewards on lifestyle expenses. Unlike UPI, it does not rely on a daily transfer
    limit from a savings account but on a pre-approved credit limit.


    Choose UPI & Bill Payments for daily utility bills, small vendor payments (using
    the ₹500 UPI Lite limit), and instant transfers to friends. Choose the credit
    card for larger purchases and credit flexibility.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9c9b931b-05d3-5be3-9e22-f89186684b3e
  title: UPI & Bill Payments — regulatory disclosures
  body: "This service is provided in strict adherence to the frameworks established\
    \ by the Reserve Bank of India (RBI) and the National Payments Corporation of\
    \ India (NPCI). \n\nTransactions conducted via UPI & Bill Payments are governed\
    \ by the NPCI operating rules. We ensure transparency in all disclosures and adhere\
    \ to the RBI's harmonised turn-around-time (TAT) framework for the resolution\
    \ of all payment disputes. \n\nLimits are enforced to mitigate risk and protect\
    \ customer deposits. These include a per-transaction limit of ₹100000, a total\
    \ daily limit of ₹100000, and a specific limit of ₹500 for UPI Lite transactions.\
    \ For automated recurring payments, the cap for mandates without Additional Factor\
    \ Authentication (AFA) is ₹15000.\n\n***\nLegal Disclaimer: Chandrika Bank acts\
    \ as the facilitating institution. While we strive for 100% uptime, the availability\
    \ of the service depends on the underlying NPCI rails. We are not liable for delays\
    \ caused by third-party technical failures, provided we act within the RBI-mandated\
    \ TAT for resolution.\n***\n\nAll customers are required to undergo PAN-based\
    \ KYC and multi-factor authentication to prevent fraudulent activity. Our 'Verify\
    \ First' policy is non-negotiable for all state-changing actions."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2f3c6a9e-7c2a-5e33-927a-8a193d2af223
  title: UPI & Bill Payments — interest rate / APY schedule
  body: 'UPI & Bill Payments is a payment facilitation service and does not earn interest.
    It is a tool used to move funds from your existing accounts.


    Because this product does not hold a balance of its own (it is a gateway to your
    savings or current account), there is no APY or interest rate associated with
    it. Any interest earned on the funds used for these payments is governed by the
    terms of your underlying account. For example, if you use funds from a regular
    savings account, please refer to Regular Savings Account — interest rate explained
    for details on how your balance earns interest.'
