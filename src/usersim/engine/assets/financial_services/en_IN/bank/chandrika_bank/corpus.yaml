  institution_id: chandrika_bank
- id: 585037df-268b-5ab2-9b98-96aa99b55994
  title: Regular Savings Account — how rates are tiered and applied
  body: 'The Regular Savings Account operates on a flat interest structure to ensure
    simplicity and transparency for all our retail customers.


    **Current Interest Rate**

    - **Applicable Rate:** 3.5% per annum.

    - **Tiers:** There are no balance-based tiers for this product; a flat rate of
    3.5% applies to all balances maintained in the account, regardless of the amount.


    **Application and Crediting**

    - **Calculation:** Interest is calculated on the daily closing balance of the
    account.

    - **Crediting Cycle:** Interest is credited to the account periodically. The exact
    date of credit is determined by the bank''s internal quarterly or half-yearly
    cycle.


    **Factors Affecting Your Rate**

    The rate of 3.5% is subject to change based on the monetary policy updates from
    the Reserve Bank of India (RBI) and the bank''s internal liquidity requirements.
    We will notify you of any changes to this rate via your registered contact details.'
  domain: retail_banking
  product_category: savings_regular
  document_type: rate_sheet
