- id: 432e2314-4d8e-5549-a94d-5561c3f1b599
  title: Chandrika Everyday Credit Card — a failed or pending action
  body: 'If you experience a failed transaction or a pending status on your Chandrika
    Everyday Credit Card, please follow these steps to resolve the issue.


    Symptom: ''Transaction Declined'' or ''Payment Pending'' at the merchant terminal.


    Likely Causes:

    - Incorrect PIN entry or expired card.

    - Transaction exceeding your assigned credit limit.

    - Security block due to unusual spending patterns.

    - Temporary downtime on the NPCI rails or merchant gateway.


    What to check in order:

    1. Verify the Card Status: Check if your card is currently active. If you recently
    received the card, ensure you have completed the activation steps detailed in
    the Chandrika Everyday Credit Card — set up and activate guide.

    2. Confirm Balance: Ensure you have sufficient available credit for the transaction
    amount.

    3. Review Security Alerts: Check your registered mobile for any notifications
    from us asking you to confirm a suspicious transaction.


    Resolution:

    - If the card is inactive, we will guide you through the activation process immediately.

    - If there is a security block, we will verify your identity through MFA and lift
    the block upon your confirmation.

    - If the transaction is pending due to a technical error, we will check the transaction
    status on the payment rails.


    Escalation:

    If the issue remains unresolved, we will raise a formal dispute case. We handle
    all disputes according to the RBI''s harmonised turn-around-time (TAT) framework
    to ensure prompt resolution and appropriate compensation.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
