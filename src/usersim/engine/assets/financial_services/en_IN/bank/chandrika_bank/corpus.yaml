- id: c24a3384-a445-5c57-9743-290c2259b1ca
  title: Regular Savings Account — a failed or pending action
  body: 'If you experience a failed or pending action—such as a transfer that hasn''t
    arrived or a debit card activation that is stuck—please follow these steps to
    resolve the issue.


    Common Symptoms:

    - ''Transaction Pending'' status in your account history.

    - ''Action Failed'' message during a fund transfer.

    - Debit card not working despite activation request.


    What to check in order:

    1. Check your current balance: Ensure you have sufficient funds for the transaction.
    If your balance is very low, it may affect certain automated services.

    2. Verify Authentication: Ensure you have completed the multi-factor authentication
    (OTP) requested during the action.

    3. Check NPCI Rails Status: If the action involved UPI or IMPS, there may be a
    temporary delay in the National Payments Corporation of India infrastructure.


    How to fix:

    - For pending transfers: Wait for 24 to 48 hours. Most pending transactions are
    either settled or reversed automatically by the system.

    - For failed activations: Provide us with the specific error code you received,
    and we will re-trigger the activation process for you.


    When we escalate:

    If the issue is not resolved within the standard window, we will raise a formal
    case with our backend operations team. For transaction disputes, we handle resolutions
    according to the RBI''s harmonised turn-around-time (TAT) framework. You will
    receive a reference number and a status update via SMS or email once the investigation
    is complete.


    If you believe a charge was applied in error, please refer to the Regular Savings
    Account — fee schedule to verify the charge type.'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
