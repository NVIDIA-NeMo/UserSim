- id: 5c2d26ad-ad2b-5de2-9422-6764a68cae22
  title: 1-Year Fixed Deposit — vs. a similar product here
  body: 'When choosing between our investment options, customers often compare the
    1-Year Fixed Deposit with the Recurring Deposit.


    1-Year Fixed Deposit:

    - Funding: One-time lump sum deposit of at least ₹10,000.

    - Return: Fixed interest rate of 7.1% (standard) or 7.6% (senior citizens).

    - Lock-in: Funds are committed for 12 months; early withdrawal incurs a 1% penalty.

    - Best for: Customers who have a lump sum available and want guaranteed returns
    with no further monthly commitment.


    Recurring Deposit:

    - Funding: Small, disciplined monthly installments.

    - Return: Competitive interest rates designed to build a corpus over time.

    - Lock-in: Structured over the chosen tenure.

    - Best for: Salaried professionals who prefer to save a portion of their monthly
    income regularly.


    Both products offer the stability of traditional deposits and are protected by
    DICGC insurance up to ₹5,00,000.'
