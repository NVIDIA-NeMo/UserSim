- id: 8a60c7dd-a26f-501f-9dbc-8441ed8b9980
  title: UPI & Bill Payments — fraud and unauthorized-activity protection
  body: 'At Chandrika Bank, we prioritise the security of your digital transactions.
    As you consider your payment options, it is important to understand the specific
    fraud patterns that target UPI services and how we protect you.


    A common scam involves fraudsters posing as representatives or merchants and asking
    you to ''receive'' money by entering your UPI PIN. Please remember: you never
    need to enter your UPI PIN to receive funds; the PIN is only required for sending
    money or authorizing a payment. Be wary of urgent requests to scan QR codes or
    click links to ''verify'' your account.


    Our ''Verify First'' policy ensures your funds are safe. We will never ask you
    for sensitive credentials, including your UPI PIN, OTPs, or CVVs. Any request
    for such information is fraudulent.


    If you notice any unauthorised activity or suspect a fraud, you must report it
    to us immediately. To minimise your liability, reporting timelines are critical.
    We handle all disputes according to the RBI''s harmonised turn-around-time (TAT)
    framework, ensuring a prompt resolution and appropriate compensation based on
    when the fraud was reported. The sooner we are notified, the better we can secure
    your account and attempt to recover funds.


    For a broader look at how we secure all your holdings, you may also refer to Regular
    Savings Account — fraud and unauthorized-activity protection.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 97724979-65a9-530d-9a0c-e3ba77dc778f
  title: UPI & Bill Payments — account agreement
  body: 'This agreement outlines the terms governing the use of UPI & Bill Payments
    provided by Chandrika Bank. By activating this service, you agree to the following
    binding terms:


    1. Transaction Limits: We impose a per transaction limit of ₹100000 and a daily
    limit of ₹100000. Any attempt to exceed these thresholds will result in a transaction
    decline. For small-value offline payments via UPI Lite, a per transaction limit
    of ₹500 applies.


    2. Autopay Mandates: For recurring payments, you may set up autopay mandates.
    For mandates that do not require Additional Factor Authentication (AFA), a cap
    of ₹15000 is applicable.


    3. User Obligations: You are responsible for maintaining the confidentiality of
    your UPI PIN. You agree to adhere to the NPCI rails'' operational guidelines.
    Any breach of security due to the sharing of credentials may impact your liability
    for unauthorised transactions.


    4. Bank Obligations: We commit to processing transactions via NPCI rails with
    due diligence and adhering to the RBI''s harmonised turn-around-time (TAT) framework
    for the resolution of failed or disputed transactions.


    5. Amendments: We reserve the right to modify these limits or terms to ensure
    account sustainability or comply with regulatory changes. We will provide notice
    of such changes through our standard communication channels.


    6. Termination: Either party may terminate the UPI linkage at any time. Upon closure,
    all active autopay mandates will be revoked.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4aadcf4e-100f-5c9d-8354-d780ba58b661
  title: UPI & Bill Payments — who it is best for and common use cases
  body: 'UPI & Bill Payments is designed for the modern Indian household and salaried
    professionals who value speed, transparency, and the elimination of cash for daily
    needs. It is an instant, digital-first payment suite leveraging NPCI rails for
    seamless P2P (Person-to-Person) and P2M (Person-to-Merchant) transactions.


    This product is best for customers who:

    - Frequently make small to mid-sized payments at local vendors or online stores.

    - Prefer a consolidated way to pay utility bills without managing multiple apps.

    - Require a high-capacity digital transfer method for larger personal payments.


    Common Use Cases:

    - Daily Shopping: Use the standard UPI feature for payments up to ₹100000 per
    transaction, subject to a total daily limit of ₹100000.

    - Micro-payments: For very small transactions, UPI Lite allows for a per transaction
    limit of ₹500, reducing the need for constant PIN entry.

    - Automated Utilities: Set up recurring bill payments using autopay mandates;
    for those without Additional Factor Authentication (AFA), the limit is capped
    at ₹15000.

    - Peer Transfers: Send money instantly to friends or family using their VPA or
    mobile number.


    To get the most out of this service, we recommend pairing it with a Regular Savings
    Account — overview to ensure you maintain the necessary Monthly Average Balance
    (MAB) for a fee-free banking experience.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4458b9fa-f163-5811-b426-245c7c822924
  title: UPI & Bill Payments — upi daily limit explained
  body: 'Q: What is the maximum amount I can send using UPI in a single day?

    A: For your security and to manage risk, we have set a daily limit of ₹100000.
    This is the cumulative total of all transactions performed via UPI within a 24-hour
    window.


    Q: Does the daily limit apply to individual transactions as well?

    A: Yes. While your total daily spending is capped at ₹100000, we also enforce
    a per transaction limit of ₹100000. This means a single transaction can potentially
    exhaust your entire daily limit.


    Q: Are there different limits for different types of UPI payments?

    A: Yes. For example, UPI Lite is intended for smaller, faster payments and has
    a per transaction limit of ₹500. For more details on all limits, please refer
    to UPI & Bill Payments — account agreement.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2ac57e5e-32ab-5cb0-b32a-c55e15922e20
  title: UPI & Bill Payments — cancel, close, or downgrade
  body: 'If you wish to stop using UPI & Bill Payments or modify your service level,
    follow these steps:


    1. Specify the action: Tell us whether you want to deregister your specific UPI
    ID, cancel a particular autopay mandate, or completely disable the UPI service
    for your account.

    2. Provide verification: Provide your registered mobile number and PAN. We will
    perform a multi-factor authentication check to verify your identity, as per our
    ''Verify First'' policy.

    3. Confirm the scope: If you are cancelling an autopay mandate, specify the merchant
    or biller. If you are closing the service, confirm that you are aware that all
    existing mandates (including those under the ₹15000 AFA cap) will be terminated.

    4. Receive confirmation: We will process the request through the NPCI rails. You
    will receive a confirmation message via SMS and an in-app notification once the
    deregistration or cancellation is successful.


    If you are comparing this against other options and find the limits too restrictive,
    you may wish to explore our other liquidity options. For guidance on managing
    your primary account, see Regular Savings Account — cancel, close, or downgrade.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c62966b9-f7d5-5d6c-852b-dd73a42fb93d
  title: UPI & Bill Payments — an unexpected charge or amount
  body: "Symptom: You notice a transaction in your statement for an amount you do\
    \ not recognise, or the amount debited is different from what you authorised.\n\
    \nLikely Causes:\n- Pending settlement from a merchant where a partial refund\
    \ was issued.\n- An autopay mandate triggered for a subscription (check if it\
    \ falls under the ₹15000 non-AFA cap).\n- A technical glitch on the NPCI rails\
    \ leading to a duplicate debit.\n- Unauthorised fraudulent activity.\n\nWhat to\
    \ check in order:\n1. Transaction History: Check the exact timestamp and merchant\
    \ name in your transaction logs.\n2. Mandate Settings: Review your active autopay\
    \ mandates to see if a scheduled payment occurred.\n3. UPI Lite Balance: If the\
    \ amount is ₹500 or less, check if the transaction was processed via UPI Lite.\n\
    \nThe Fix:\n- If it is a duplicate debit, we will initiate a reconciliation with\
    \ the merchant bank. \n- If it is an unauthorised charge, we will immediately\
    \ freeze the UPI linkage to prevent further loss.\n\nWhen to escalate:\nIf the\
    \ amount is not reversed within the RBI's harmonised turn-around-time (TAT) framework,\
    \ we will route the issue to our nodal officer. You will receive a case reference\
    \ number and a timeline for the final resolution. For similar issues with your\
    \ main account, see Regular Savings Account — an unexpected charge or amount."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
