- id: 70ded9c6-a93e-56da-a7fe-122bb941564a
  title: Chandrika Everyday Credit Card — check status or history
  body: 'Follow these steps to review your credit card''s current standing, available
    limit, and past transactions.


    Prerequisites:

    - Your registered mobile number for multi-factor authentication.

    - Your PAN details for identity verification.


    Steps to check your status and history:

    1. Provide us with your card account number or registered mobile number.

    2. We will verify your identity using a multi-factor authentication process (OTP
    sent to your registered mobile) and PAN-based KYC check.

    3. Specify whether you wish to see your current outstanding balance, your available
    credit limit, or a history of recent transactions.

    4. We will then provide the requested details, including the date, merchant name,
    and amount for each transaction in your history.

    5. If you require a formal document, ask us to generate a statement for a specific
    period (e.g., last 3 months).

    6. We will confirm once the statement has been sent to your registered email address.


    You will know the process is complete when you receive the real-time balance update
    in the conversation or the statement PDF in your email inbox.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
