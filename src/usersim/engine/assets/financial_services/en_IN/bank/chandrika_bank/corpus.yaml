  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2247c2ef-68d8-5a0c-bfe1-a144ce995b13
  title: Chandrika Everyday Credit Card — a declined or blocked action
  body: 'Symptom: You attempted to make a purchase or a payment, but the transaction
    was declined, or you received a notification that your card is blocked.


    Likely Causes:

    - Credit Limit Exceeded: The transaction amount exceeds your available credit
    limit.

    - Security Block: The transaction triggered a fraud alert due to an unusual pattern
    or high value.

    - Expired Card: The card has passed its validity date.

    - KYC Pending: Your account requires updated PAN-based KYC documentation.


    What to check in order:

    1. Balance Check: Verify if your current outstanding balance plus the new transaction
    exceeds your total credit limit.

    2. Card Validity: Check the ''Valid Thru'' date on your physical card.

    3. Transaction Type: Check if the merchant is in a category or region that you
    have previously restricted.


    How to resolve:

    - If the limit is exceeded: Pay a portion of your outstanding balance to free
    up credit; we will confirm the updated limit immediately.

    - If the card is blocked for security: We will perform a multi-factor authentication
    check to verify you are the authorised user and then unblock the card.

    - If KYC is pending: Provide us with your updated PAN and address proof; we will
    update your records and restore card functionality.


    When to escalate:

    If the card remains blocked after verification or if a payment was deducted despite
    a ''declined'' message, we will raise a formal dispute case. We follow the RBI''s
    harmonised turn-around-time (TAT) framework to ensure prompt resolution and compensation
    if an error occurred on our end.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f9045612-def2-5b08-9d37-5a39acf97da1
  title: Chandrika Everyday Credit Card — when to switch or upgrade
  body: "As a support agent, use these guidelines to determine if a customer should\
    \ remain with the Chandrika Everyday Credit Card or move to another product.\n\
    \nStay with Chandrika Everyday Credit Card if:\n- The customer is a middle-income\
    \ professional using the card for daily lifestyle expenses.\n- The customer spends\
    \ more than ₹1,50,000 annually, allowing them to enjoy a full waiver of the ₹500\
    \ annual fee.\n- The customer values a simple 1% reward rate on everyday spends.\n\
    \nConsider switching or upgrading if:\n- The customer's annual spend is significantly\
    \ below ₹1,50,000 and they find the ₹500 annual fee burdensome.\n- The customer\
    \ requires a specialized card for high-value travel or luxury spends where a 1%\
    \ reward rate is insufficient.\n- The customer prefers a liquid account for daily\
    \ transactions without credit risk; in this case, suggest the Regular Savings\
    \ Account — overview.\n\nDecision Matrix:\n- Spend > ₹1,50,000 $\rightarrow$ Keep\
    \ Card (Fee waived).\n- Spend < ₹1,50,000 $\rightarrow$ Evaluate against low-cost\
    \ alternatives.\n- Need for liquid funds $\rightarrow$ Shift focus to savings\
    \ products."
  domain: cards
