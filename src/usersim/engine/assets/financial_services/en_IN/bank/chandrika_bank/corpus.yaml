- id: ea4a7cba-68bf-56f2-9439-e16024c8e0c1
  title: Recurring Deposit — a declined or blocked action
  body: 'Symptom: You are attempting to open a Recurring Deposit or make a monthly
    contribution, but the action is being declined or blocked.


    Likely Causes:

    - Insufficient Funds: The linked account does not have the minimum monthly installment
    of ₹500.

    - KYC Non-Compliance: Your PAN-based KYC is outdated or incomplete, triggering
    our ''Verify First'' security policy.

    - Authentication Failure: Multi-factor authentication was not completed successfully.


    Steps to resolve:

    1. Check your available balance in your linked savings account. Ensure you have
    at least ₹500 plus any applicable taxes to cover the installment.

    2. Verify your KYC status with us. If your documents are outdated, we will guide
    you through the PAN-based verification process.

    3. Re-attempt the authentication process, ensuring you have access to your registered
    mobile device for the OTP.


    When to escalate:

    If you have confirmed that you have the necessary funds and your KYC is up to
    date, but the transaction is still blocked, tell us. We will then raise a formal
    case with our technical team to investigate the block. You will receive a reference
    number for this request and a resolution update within the timelines defined by
    the RBI''s harmonised turn-around-time (TAT) framework.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 49d9256f-5d57-5f0d-b835-23f64d07b58f
  title: Recurring Deposit — when to switch or upgrade
  body: 'For agents: Use this guide to help customers decide if the Recurring Deposit
    still meets their financial needs or if they should transition to another product.


    Switch to 1-Year Fixed Deposit if:

    The customer has a lump sum available now rather than monthly savings. The 1-Year
    Fixed Deposit is better for those seeking a low-risk, high-yield investment over
    a twelve-month horizon without the need for monthly contributions.


    Switch to Regular Savings Account if:

    The customer requires immediate liquidity for daily expenses. While the Recurring
    Deposit offers 6.8% for a 24 months tenure, the Regular Savings Account provides
    a foundational liquid account for daily banking.


    Stay with Recurring Deposit if:

    The customer wants a disciplined monthly saving tool to build a corpus over time.
    It is the ideal choice for those who can commit to a minimum monthly installment
    of ₹500 and want a guaranteed return over 24 months.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e1f55988-7770-5daf-8a7a-c2134909da43
  title: Recurring Deposit — comparison vs. alternatives and when not to choose it
  body: 'Choosing the right savings tool depends on your current financial habits
    and goals. The Recurring Deposit is designed as a disciplined monthly saving tool,
    but it may not be the right fit for every scenario.


    When to choose the Recurring Deposit:

    Choose this product if you wish to build a corpus over time through regular contributions.
    It is ideal for salaried professionals who can commit to a minimum monthly installment
    of ₹500 over a 24 months tenure to earn a steady interest rate of 6.8%.


    When to choose an alternative:

    - If you have a large sum of money ready for investment: A Fixed Deposit is a
    more efficient choice as it earns interest on the entire principal from day one,
    whereas the Recurring Deposit earns interest on increments.

    - If you need your money to be available at any moment: A Regular Savings Account
    is superior for liquidity. While a Recurring Deposit is stable, withdrawing funds
    before the 24 months tenure is considered a Premature Withdrawal and usually incurs
    a penalty.

    - If you cannot guarantee a monthly payment: If your income is irregular, you
    may find the missed installment penalty of ₹10 disruptive. In such cases, a flexible
    savings account is better.


    Summary of key values for comparison:

    - Commitment: ₹500 per month

    - Duration: 24 months

    - Return: 6.8% interest rate

    - Penalty: ₹10 for missed installments


    ***

    Disclaimer: All deposits are protected by the DICGC insurance scheme up to ₹5,00,000
    per depositor.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ddce46d7-f0ce-5c48-bab0-4321a068f545
  title: Recurring Deposit — cost and charges
  body: 'Q: Are there any monthly fees to maintain a Recurring Deposit?

    A: No, there are no monthly maintenance fees. However, the product is designed
    to reward disciplined saving; therefore, a missed installment penalty of ₹10 is
    charged if a monthly payment is skipped.


    Q: Is there a cost for closing my account early?

    A: Yes. Closing the account before the agreed 24 months tenure is a Premature
    Withdrawal, which usually incurs a penalty. This may reduce the effective interest
    earned on your deposit.


    Q: What is the minimum amount I must commit to?

    A: To open and maintain the account, the minimum monthly installment is ₹500.


    For more on the product structure, see Recurring Deposit — overview.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
