- id: 199e60ee-6e54-526d-b937-0a70e4db14b3
  title: Regular Savings Account — set up and activate
  body: 'Setting up your Regular Savings Account with Chandrika Bank is a straightforward
    process. Please follow these steps to get started:


    Prerequisites:

    You will need a valid PAN card and a government-approved address proof to complete
    our mandatory KYC process.


    Steps to Activate:

    1. Provide us with your PAN and KYC documents. We enforce a strict ''Verify First''
    policy to ensure your account security.

    2. Tell us your preferred communication preferences (email and mobile number)
    for multi-factor authentication.

    3. Deposit the initial funds into your account. We recommend starting with at
    least ₹10000 to satisfy the Monthly Average Balance (MAB) requirement from the
    first month.

    4. We will verify your documents and activate your account. You will receive a
    confirmation notification once the account is live.

    5. Request your debit card. Please note that a debit card annual fee of ₹250 applies
    to this service.

    6. Confirm the activation of your account by performing a small test transaction
    or checking your balance through our digital platforms.


    Once these steps are complete, your Regular Savings Account is fully active. You
    can now enjoy a savings interest rate of 3.5% on your deposits and use your 5
    free ATM transactions per month.


    For a detailed look at the costs associated with your new account, you may refer
    to the Regular Savings Account — fee schedule.'
