- id: 98c8a3cb-a4f9-54c5-83f8-4d6fbe5113d7
  title: Regular Savings Account — vs. a similar product here
  body: 'When choosing between our deposit products, it is important to understand
    the difference between the Regular Savings Account and the Recurring Deposit.


    Regular Savings Account:

    - Access: Highly liquid; funds can be withdrawn at any time.

    - Requirement: Requires a Monthly Average Balance (MAB) of ₹10000 to avoid a ₹500
    charge.

    - Returns: Earns a savings interest rate of 3.5%.

    - Best for: Daily spending, emergency funds, and salaried professionals needing
    a primary liquid account.


    Recurring Deposit:

    - Access: Low liquidity; funds are locked for a specific tenure.

    - Requirement: Disciplined monthly installments rather than a minimum average
    balance.

    - Returns: Typically offers competitive interest rates designed to build a corpus
    over time.

    - Best for: Goal-based saving and customers who prefer a disciplined monthly saving
    tool.


    While the Regular Savings Account is the best choice for flexibility and daily
    utility, the Recurring Deposit is superior for those looking to grow a specific
    sum of money without the risk of spending it.'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
