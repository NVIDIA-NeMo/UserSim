- id: 4ba6993c-88e5-5725-a1da-e3ded15ce979
  title: Recurring Deposit — fraud and unauthorized-activity protection
  body: 'At Chandrika Bank, we prioritize the safety of your hard-earned savings.
    When comparing our Recurring Deposit to other investment alternatives, it is important
    to understand that the security of your funds is backed by our strict ''Verify
    First'' policy and regulatory protections. Your deposits are protected by the
    DICGC Insurance scheme, covering up to ₹5,00,000 per depositor.


    Fraudsters often target disciplined savers by posing as bank officials. Please
    be aware that Chandrika Bank will never ask you for your UPI PIN, OTPs, or CVVs.
    Any request for these sensitive credentials is a clear sign of fraudulent activity.
    We will never ask you to transfer funds to a ''safe account'' or provide your
    passwords to ''update'' your Recurring Deposit.


    If you notice any unauthorized activity or receive a suspicious request, the first
    action you must take is to notify us immediately. Fraudulent activity is routed
    through a dedicated reporting path to minimize your liability; the speed of your
    reporting is critical to the recovery of funds and the limitation of your liability
    based on reporting timelines.


    We adhere strictly to RBI and NPCI frameworks to ensure that your money remains
    secure. By maintaining your savings with us, you benefit from a traditional, trust-centric
    institution that combines stability with modern security protocols. For more details
    on how we handle disputes, please refer to our general service model and the RBI''s
    harmonised turn-around-time (TAT) framework.'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 558ffa94-43a9-57a3-9046-a98feeaab471
  title: Recurring Deposit — account agreement
  body: 'This account agreement governs the relationship between Chandrika Bank and
    the customer regarding the Recurring Deposit product.


    1. Customer Obligations: The customer agrees to deposit a minimum monthly installment
    of ₹500 into the account. These deposits must be made consistently throughout
    the agreed tenure of 24 months to ensure the account remains in good standing
    and earns the stipulated interest.


    2. Bank Obligations: Chandrika Bank agrees to apply an interest rate of 6.8% to
    the deposits. Interest is calculated and credited according to the bank''s standard
    schedule for recurring deposits.


    3. Penalties and Fees: In the event of a missed installment, a missed installment
    penalty of ₹10 will be levied per instance. This fee is structured to encourage
    disciplined financial habits and ensure account sustainability.


    4. Term and Maturity: The standard tenure for this product is 24 months. Upon
    maturity, the principal amount plus accrued interest will be credited to the customer''s
    linked account.


    5. Premature Withdrawal: The customer may request to close the account before
    the 24-month tenure. Such a Premature Withdrawal will incur a penalty as per the
    bank''s prevailing schedules, and the interest rate may be adjusted downwards
    to reflect the actual duration the funds were held.


    6. Amendments: We reserve the right to modify terms and conditions. Any changes
    to fees or interest rates will be communicated to the customer in accordance with
    RBI transparency guidelines.


    7. Termination: This agreement ends upon the maturity of the deposit or the successful
    processing of a premature closure request.'
