- id: f719541e-7776-5eec-b768-714e1b703ef5
  title: Regular Savings Account — overview
  body: 'Welcome to Chandrika Bank. We are pleased to introduce the Regular Savings
    Account, a foundational liquid account designed for your daily banking needs.
    This account provides a secure place for your funds while ensuring you have immediate
    access to your money for everyday expenses.


    We focus on helping our customers maintain disciplined financial habits. To ensure
    your account remains fee-free for basic utility, we require a Monthly Average
    Balance (MAB) of ₹10000. This balance helps us maintain the sustainability of
    your account services.


    Key Features and Benefits:

    - Earnings: Your deposits earn a savings interest rate of 3.5%.

    - ATM Access: We provide 5 free ATM transactions per month to help you manage
    your cash needs conveniently.

    - Security: Your deposits are protected by DICGC Insurance covering up to ₹5,00,000
    per depositor.


    Associated Costs:

    - Maintenance: If the Monthly Average Balance falls below ₹10000, a below MAB
    charge of ₹500 will be applied.

    - Debit Card: There is a debit card annual fee of ₹250.


    Whether you are a salaried professional or managing a household, the Regular Savings
    Account offers the stability of a traditional bank combined with the ease of modern
    banking. We encourage you to maintain your balance to enjoy a seamless, cost-effective
    banking experience.


    ***

    Legal Disclaimer: We provide financial education and product information but do
    not offer individualised tax, legal, or investment advice. All accounts are subject
    to our standard terms and conditions.'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
