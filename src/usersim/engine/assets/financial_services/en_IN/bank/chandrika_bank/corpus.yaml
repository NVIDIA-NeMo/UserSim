- id: 724f571b-0163-5e02-adc1-e8e306c006f8
  title: Chandrika Everyday Credit Card — current offer
  body: "Special Offer for our Valued Customers!\n\nWe are pleased to announce a limited-time\
    \ reward booster for existing Chandrika Everyday Credit Card holders. \n\nOffer\
    \ Period: From 1st November 2023 to 31st December 2023.\n\nDuring this period,\
    \ we are offering an additional reward incentive for all spends exceeding ₹25,000\
    \ in a single calendar month. While your standard reward rate remains 1%, customers\
    \ who hit this milestone will receive a one-time loyalty bonus of ₹500 credited\
    \ to their rewards account in the following billing cycle.\n\nContinue using your\
    \ card for your everyday lifestyle expenses and take advantage of this window\
    \ to maximize your returns. This offer is subject to the standard terms and conditions\
    \ of the Chandrika Everyday Credit Card — account agreement."
