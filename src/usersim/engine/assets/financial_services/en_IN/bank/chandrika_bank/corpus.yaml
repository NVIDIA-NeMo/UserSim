- id: 1158d138-7918-545f-b453-7aa5f8df2f4d
  title: Regular Savings Account — resolve a common request end-to-end
  body: 'A common request for Regular Savings Account holders is the replacement of
    a lost or damaged debit card. Here is the end-to-end process to resolve this.


    **What you need before starting**

    * Your account number.

    * A valid government-issued ID for verification.

    * Confirmation of your current mailing address.


    **Steps to replace your debit card**

    1. **Report the Card Status**: Tell us whether the card is lost, stolen, or damaged.
    If it is lost or stolen, we will immediately block the existing card to prevent
    unauthorised transactions.

    2. **Verify Identity**: We will perform a ''Verify First'' check, which includes
    PAN-based KYC and multi-factor authentication to ensure the request is legitimate.

    3. **Request New Card**: Ask us to issue a replacement debit card. We will confirm
    the card type associated with your Regular Savings Account.

    4. **Confirm Charges**: We will inform you of any applicable replacement fees.
    Note that the standard debit card annual fee of ₹250 applies to the card''s yearly
    maintenance.

    5. **Confirm Delivery Address**: Provide your current address. We will verify
    this against our records to ensure the card is sent to the correct location.

    6. **Receive Confirmation**: We will provide a request reference number and an
    estimated delivery timeline.


    **How you know it worked**

    You will receive a confirmation notification once the new card is dispatched.
    Once the card arrives, you can follow the activation process to regain access
    to your 5 free ATM transactions per month and other card services.'
