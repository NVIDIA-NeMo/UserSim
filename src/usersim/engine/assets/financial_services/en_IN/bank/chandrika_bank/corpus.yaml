- id: 67a0196b-574b-56a6-94e2-4635d7126690
  title: Chandrika Everyday Credit Card — account security best practices
  body: 'Protecting your financial well-being is our highest priority. As a user of
    the Chandrika Everyday Credit Card, we urge you to remain vigilant against evolving
    fraud patterns, such as phishing emails or fraudulent calls claiming to be from
    our card department.


    **What We Will Never Ask For**

    To ensure your account remains secure, please remember that Chandrika Bank agents
    are strictly prohibited from requesting the following sensitive credentials:

    - Your UPI PIN

    - One-Time Passwords (OTPs)

    - Your card''s CVV

    - Your full credit card number via unsecured channels


    **Best Practices for Cardholders**

    - Regularly review your monthly statements for any unauthorised transactions.

    - Set up transaction alerts to monitor your spending in real-time.

    - Avoid using your card on unsecured public Wi-Fi networks for online shopping.

    - Use strong, unique passwords for any digital banking access associated with
    your card.


    **Immediate Action in Case of Fraud**

    If you notice a transaction you did not authorise, or if your card is lost or
    stolen, inform us immediately. Under the RBI''s harmonised turn-around-time (TAT)
    framework, reporting fraudulent activity promptly is essential to minimise your
    liability. The sooner the report is filed, the lower the potential loss you may
    bear.


    We recommend that all customers familiarise themselves with our broader security
    posture by reviewing the Regular Savings Account — fraud and unauthorized-activity
    protection document for general account safety tips.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 13a7cdf0-28c4-528c-a64a-f1c7fe5d2295
  title: Chandrika Everyday Credit Card — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms and
    conditions governing the Chandrika Everyday Credit Card. By using the card, you
    agree to these binding terms.


    **Right to Modify Terms**

    We reserve the right to amend the fees, interest rates, and reward structures
    associated with your card. This includes, but is not limited to, changes to the
    joining fee of ₹500, the annual fee of ₹500, the reward rate of 1%, or the finance
    charges (currently 3.5% monthly and 42% annualised).


    **Notice Period**

    We will provide you with a minimum of 30 days'' notice before any change to fees
    or interest rates becomes effective. This notice will be delivered via your registered
    email address or as a statement insert. If you find the revised terms unacceptable,
    you have the right to close your account without penalty before the effective
    date of the change.


    **Annual Fee Waiver Terms**

    The annual fee of ₹500 is subject to a waiver if you achieve a total annual spend
    of ₹1,50,000. This threshold is calculated based on the total cleared transactions
    in a membership year. Failure to meet this milestone will result in the annual
    fee being charged to your statement.


    **Termination of Agreement**

    Either party may terminate this agreement at any time. Upon closure, all outstanding
    balances, including any accrued finance charges at the rate of 3.5% monthly, must
    be settled in full before the account is officially closed.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 31d35b08-ce2f-5f4a-bcd0-f0e9f06d3124
  title: Chandrika Everyday Credit Card — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in the onboarding
    and initial setup of the Chandrika Everyday Credit Card.


    **Step 1: Application and KYC**

    Ensure the customer provides a valid PAN. We enforce a strict ''Verify First''
    policy, requiring PAN-based KYC and multi-factor authentication before the card
    is issued.


    **Step 2: Card Delivery and Activation**

    Once the card is delivered, the customer must activate it. Remind them that a
    joining fee of ₹500 will be applied to their first statement.


    **Step 3: Understanding the Fee Structure**

    Explain the recurring costs to the customer clearly:

    - **Annual Fee:** ₹500, charged yearly.

    - **Annual Fee Waiver:** We reward active customers by waiving the ₹500 annual
    fee if they spend ₹1,50,000 or more in a year.


    **Step 4: Rewards and Interest**

    Inform the customer that they will earn rewards at a rate of 1% on their eligible
    spending. It is crucial to emphasize the importance of timely payments to avoid
    finance charges:

    - **Monthly Finance Charge:** 3.5%

    - **Annualised Finance Charge:** 42%


    **Step 5: Integration with Other Services**

    If the customer also holds a savings account, remind them that they can link their
    card for easier payments. For more information on basic account management, refer
    to the Regular Savings Account — getting started walkthrough.


    **Agent Note:** Do not suggest this card as a primary investment tool; it is a
    versatile spending tool designed for lifestyle expenses and credit flexibility.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7c19c490-9858-590d-b8a9-7b56ed83e171
  title: Chandrika Everyday Credit Card — annual fee waiver spend explained
  body: '**How does the annual fee waiver work for the Chandrika Everyday Credit Card?**

    We want to reward our most active customers. While the card has a standard annual
    fee of ₹500, we will waive this fee entirely if your total spending on the card
    reaches ₹1,50,000 within the membership year.


    **What counts toward the ₹1,50,000 spending limit?**

    Most retail purchases and lifestyle expenses count toward this milestone. However,
    cash advances or balance transfers may be excluded. Please check your monthly
    statement to track your progress toward the waiver.


    **What happens if I do not reach the spend threshold?**

    If your total annual spend is less than ₹1,50,000, the annual fee of ₹500 will
    be charged to your account at the end of the year. To understand other costs,
    you may refer to the Chandrika Everyday Credit Card — fee schedule.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d9365828-74d8-5827-a23a-d47c42fb12f5
  title: Chandrika Everyday Credit Card — make a change or update
  body: 'If you need to update your account details or modify your card preferences,
    please follow these steps. We ensure a secure process by verifying your identity
    at every stage.


    **Prerequisites**

    - Your registered mobile phone for multi-factor authentication.

    - Your PAN card details for verification.


    **Step-by-Step Process**

    1. **Request the Update:** Tell us which detail you wish to change (e.g., your
    residential address, contact number, or billing cycle).

    2. **Identity Verification:** We will perform a security check using your PAN
    and send a verification code to your registered mobile number. Provide this code
    to us to proceed.

    3. **Provide New Information:** Give us the updated details. If you are changing
    your address, we may ask you to provide a digital copy of a valid address proof.

    4. **Confirmation of Change:** We will process the update in our systems and provide
    you with a confirmation reference number immediately.

    5. **Verification of Update:** You will receive an SMS and an email notification
    once the change is successfully reflected in your account records.


    **Updating Credit Limits**

    If you wish to request a credit limit increase, tell us the desired limit and
    provide your latest three months'' salary slips or latest ITR. We will review
    your eligibility and notify you of the decision within 7 working days.


    For general updates to your banking profile, you may also find the Regular Savings
    Account — make a change or update guide useful.'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8188ae57-6e49-5e8d-b841-460f6da4002f
  title: Chandrika Everyday Credit Card — access or login problems
  body: "If you are unable to access your credit card account details or manage your\
    \ card through our digital channels, please follow this troubleshooting guide.\n\
    \n**Symptom: 'Invalid Credentials' or Login Failure**\n- **Likely Cause:** Incorrect\
    \ password, locked account due to multiple failed attempts, or an expired session.\n\
    - **What to Check:**\n  1. Ensure that your Caps Lock is off and you are using\
    \ the correct registered email/username.\n  2. Check if you have received an account\
    \ lockout notification via email.\n- **The Fix:** If the password is forgotten,\
    \ request a password reset. We will send a secure reset link to your registered\
    \ mobile number and email. Follow the prompts to create a new password.\n\n**Symptom:\
    \ Multi-Factor Authentication (MFA) Code Not Received**\n- **Likely Cause:** Network\
    \ congestion, incorrect mobile number on file, or SMS blocking services.\n- **What\
    \ to Check:**\n  1. Check your mobile network strength.\n  2. Verify that you\
    \ are checking the device linked to your PAN-based KYC.\n- **The Fix:** Ask us\
    \ to trigger the OTP again. If the issue persists, we will verify your identity\
    \ using alternative security questions to manually unlock your access.\n\n**Symptom:\
    \ Card Details Not Reflecting After Activation**\n- **Likely Cause:** Sync delay\
    \ between the card issuance system and the digital dashboard.\n- **The Fix:**\
    \ We will refresh your account status on our backend. You should see your current\
    \ balance and the joining fee of ₹500 reflected within 24 hours.\n\n**When to\
    \ Escalate**\nIf these steps do not resolve your access issues, we will raise\
    \ a high-priority technical ticket to our IT operations team. You will receive\
    \ a ticket number and a resolution update via SMS within 2 business days."
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 577aaf79-9bed-51f2-84c1-9fa9f32071e2
  title: Chandrika Everyday Credit Card — qualification tiers
  body: 'The following matrix outlines the qualification tiers for the Chandrika Everyday
    Credit Card. All applicants must undergo PAN-based KYC and multi-factor authentication.


    | Customer Segment | Minimum Monthly Income | Credit Score Requirement | Outcome
    |

    | :--- | :--- | :--- | :--- |

    | Salaried Professional | ₹25,000 | 750+ | Approved (Standard Limit) |

    | Salaried Professional | ₹25,000 | 700 - 749 | Approved (Conditional Limit) |

    | Self-Employed | ₹50,000 | 750+ | Approved (Standard Limit) |

    | Existing Bank Customer | ₹20,000 | 650+ | Approved (Based on Internal Rating)
    |

    | General Applicant | Below ₹20,000 | Any | Not Eligible |


    *Note: Approval is subject to a full credit check and verification of income documents.
    All approved cards carry a joining fee of ₹500 and an annual fee of ₹500.*'
