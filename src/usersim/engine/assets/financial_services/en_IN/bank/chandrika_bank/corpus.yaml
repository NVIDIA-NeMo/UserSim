- id: 118acc7e-cbe1-5a18-a403-350c2c2960cd
  title: UPI & Bill Payments — getting started walkthrough
  body: "This guide is intended for support agents to assist customers in onboarding\
    \ for UPI & Bill Payments. Our service leverages NPCI rails to provide instant\
    \ P2P and P2M transactions.\n\nOnboarding Steps:\n1. KYC Verification: Ensure\
    \ the customer has a valid PAN-based KYC on file. This is a mandatory requirement\
    \ under our 'Verify First' policy.\n2. Device Binding: The customer must use a\
    \ mobile number registered with the bank. The system will perform a silent SMS\
    \ verification to bind the device.\n3. UPI ID Creation: Assist the customer in\
    \ creating a unique Virtual Payment Address (VPA). \n4. PIN Setup: The customer\
    \ must set up their UPI PIN using their active debit card details. Remind the\
    \ customer that this PIN is secret and should never be shared with anyone, including\
    \ bank staff.\n\nKey Operational Limits for Customer Reference:\n- Standard UPI\
    \ Transaction Limit: ₹100,000 per transaction.\n- Daily Transaction Limit: ₹100,000\
    \ per day.\n- UPI Lite Limit: ₹500 per transaction (ideal for small payments).\n\
    - Autopay Mandate Limit: ₹15,000 for payments without additional factor authentication\
    \ (AFA).\n\nPayment Options:\n- P2P: Sending money to other individuals using\
    \ their VPA or mobile number.\n- P2M: Paying merchants via QR codes or VPAs.\n\
    - Bill Payments: Integrated utility payments for electricity, water, and broadband.\n\
    \nFor customers wanting to link this to a primary account, refer them to Regular\
    \ Savings Account — set up and activate."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9d5df8c0-d470-5b29-be73-a6e7c08eeef6
  title: UPI & Bill Payments — upi lite per transaction limit explained
  body: "Q: What is UPI Lite and how does its limit work?\nA: UPI Lite is a digital\
    \ wallet feature designed for small, frequent payments that do not require a UPI\
    \ PIN for every transaction. To ensure security for these 'on-device' payments,\
    \ we have a UPI Lite per transaction limit of ₹500.\n\nQ: Why is there a limit\
    \ on UPI Lite transactions?\nA: This limit is set according to NPCI guidelines\
    \ to minimise the risk associated with payments that bypass the standard PIN authentication\
    \ process, ensuring your main account balance remains secure.\n\nQ: Can I send\
    \ more than ₹500 using UPI Lite?\nA: No. For any amount exceeding ₹500, you must\
    \ use the standard UPI payment flow, which allows for transactions up to ₹100,000\
    \ per transaction, provided you authenticate with your UPI PIN. \n\nFor more on\
    \ standard limits, please see UPI & Bill Payments — overview."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 6e1ad457-fac8-5ec9-b855-1b78ec2a48c2
  title: UPI & Bill Payments — make a change or update
  body: 'If you need to update your UPI settings or change your security credentials,
    please follow these steps:


    Updating your UPI PIN:

    1. Tell us that you wish to reset your UPI PIN.

    2. Provide the last six digits of your registered debit card and the card''s expiry
    date.

    3. We will send a one-time verification code to your registered mobile number.

    4. Once you provide the code, we will prompt you to enter and confirm your new
    UPI PIN.

    5. You will receive a confirmation message once the PIN has been successfully
    updated.


    Changing your Linked Account:

    1. Tell us which account you would like to set as your primary for UPI payments.

    2. We will verify your identity via multi-factor authentication.

    3. We will update the primary account mapping in our system.

    4. We will confirm the change via a notification, and you may now use your UPI
    ID with the new account.


    Updating Autopay Mandates:

    1. Provide the details of the existing mandate you wish to modify or the new biller
    you wish to add.

    2. For mandates exceeding ₹15,000, we will require additional factor authentication
    (AFA).

    3. We will process the request and send you a mandate confirmation receipt.


    If you are also updating your contact details, please refer to Regular Savings
    Account — make a change or update.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e21fdf15-cc83-5fa9-9ccd-1a267b5e9ad2
  title: UPI & Bill Payments — access or login problems
  body: 'Symptom: You are unable to access UPI services, the app fails to bind to
    your device, or you are receiving a ''Login Failed'' error.


    Likely Causes:

    1. SIM Card Mismatch: The mobile number registered with Chandrika Bank is not
    in the primary slot of the device.

    2. Network Issues: Unstable data connection preventing communication with NPCI
    rails.

    3. KYC Expiry: Your PAN-based KYC has expired, leading to a temporary suspension
    of digital services.

    4. Device Binding Error: A previous session was not closed correctly on a different
    device.


    What to check in order:

    1. Verify that the registered SIM card is active and has sufficient balance to
    send the required verification SMS.

    2. Switch from Wi-Fi to Mobile Data to ensure the device can be uniquely identified
    by the network.

    3. Confirm your KYC status with us to ensure your account is fully operational.


    How to fix it:

    - If it is a binding error, tell us to ''Refresh Device Binding''. We will clear
    the previous session and send a new activation trigger to your phone.

    - If your KYC is expired, provide your updated PAN card details. We will verify
    them and restore your access within 24 hours.


    When to escalate:

    If the issue persists after these steps, we will raise a technical ticket with
    our nodal officers. You will receive a ticket number and a resolution update via
    SMS within 48 hours. For failures related to funds not being credited, refer to
    UPI & Bill Payments — a failed or pending action.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3998d5fe-932e-5d75-8d0c-0089749e3d2b
  title: UPI & Bill Payments — qualification tiers
  body: 'The following matrix determines the access level and limits available to
    customers using UPI & Bill Payments. Access is granted based on the verification
    level of the account.


    | Verification Status | Access Level | Transaction Limit (Per/Daily) | Autopay
    (Non-AFA) Limit |

    | :--- | :--- | :--- | :--- |

    | Full PAN-KYC Completed | Standard | ₹100,000 / ₹100,000 | ₹15,000 |

    | Minimal KYC / Pending | Restricted | Not Available | Not Available |

    | Account Frozen/Blocked | None | Not Available | Not Available |


    All eligible customers also have access to the UPI Lite feature with a fixed per
    transaction limit of ₹500, regardless of their standard tier, provided they have
    a linked Regular Savings Account.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7398b17e-018f-58f5-98b9-cca242b2efbb
  title: UPI & Bill Payments — choosing between tiers or options
  body: 'When using our payment suite, you can choose between Standard UPI and UPI
    Lite based on your transaction needs.


    Standard UPI

    - Limit: Up to ₹100,000 per transaction and ₹100,000 daily.

    - Security: Requires a UPI PIN for every transaction.

    - Best for: High-value transfers, monthly rent, or large bill payments.


    UPI Lite

    - Limit: Up to ₹500 per transaction.

    - Security: PIN-less transactions for faster checkout.

    - Best for: Small daily expenses like tea, snacks, or quick commutes.


    Choosing the right option depends on the amount. For amounts up to ₹500, UPI Lite
    offers superior speed. For anything above ₹500, Standard UPI is the only option.
    Both operate on the same secure NPCI rails. If you are deciding on a foundational
    account to link these to, see Regular Savings Account — choosing between tiers
    or options.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2e13a379-23db-5aaf-bb91-6b4910c26475
  title: UPI & Bill Payments — privacy and data handling
  body: 'Chandrika Bank is committed to the transparent handling of your financial
    data in accordance with RBI guidelines and NPCI frameworks.


    Data Collection: When you use UPI & Bill Payments, we collect and process your
    mobile number, device ID, and transaction history. This data is essential for
    device binding and the execution of payments over NPCI rails.


    Data Sharing: Your transaction data is shared with the National Payments Corporation
    of India (NPCI) and the respective remitter/beneficiary banks to facilitate the
    transfer of funds. We do not sell your transaction patterns to third-party marketers.


    Security Measures: We employ multi-factor authentication and strict PAN-based
    KYC to prevent identity theft. All data in transit is encrypted to ensure that
    sensitive information cannot be intercepted.


    Limits and Oversight: We monitor transactions against the daily limit of ₹100,000
    and the per transaction limit of ₹100,000 to detect and prevent unusual activity.
    Automated payments are monitored against the non-AFA cap of ₹15,000 to protect
    customers from unauthorised recurring charges.


    Customer Rights: You have the right to request a history of your UPI transactions.
    We ensure that all disputes are handled according to the RBI''s harmonised turn-around-time
    (TAT) framework to ensure prompt resolution.


    For further information on how we handle your general account data, please refer
    to Regular Savings Account — privacy and data handling.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5eff3455-4188-54e7-8432-7f73ef3b8a90
  title: UPI & Bill Payments — recognizing scams targeting this product
  body: "At Chandrika Bank, we prioritize your financial safety. As you consider our\
    \ UPI & Bill Payments suite, it is essential to recognize the common tactics used\
    \ by fraudsters to target UPI users. \n\nOne of the most frequent scams is the\
    \ 'Request Money' fraud. In this scenario, a scammer sends a payment request to\
    \ your device, claiming you have won a prize or a lottery. They will insist that\
    \ you enter your UPI PIN to 'receive' the money. Please remember: You never need\
    \ to enter your UPI PIN to receive funds. A PIN is only required for sending money\
    \ or authorizing a debit from your account.\n\nAnother common tactic involves\
    \ fake customer support. Fraudsters may pose as bank officials or NPCI representatives,\
    \ claiming there is an issue with your account limits. They may ask you to download\
    \ screen-sharing apps or provide sensitive details to 'verify' your identity.\n\
    \nWe enforce a strict 'Verify First' policy. To protect your funds, Chandrika\
    \ Bank agents will never ask you for your UPI PIN, OTPs, or CVVs under any circumstances.\
    \ If anyone requesting these details claims to be from our bank, they are not.\n\
    \nIf you notice any unauthorized activity or suspect a scam, notify us immediately.\
    \ According to the RBI's harmonised turn-around-time (TAT) framework, prompt reporting\
    \ is critical to minimize your liability. Fraudulent activity routed through our\
    \ dedicated reporting path ensures that we can act quickly to secure your account.\n\
    \n***\nDisclaimer: Customer deposits are protected by the DICGC insurance scheme\
    \ up to ₹5,00,000 per depositor."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f5c92493-4322-5fe0-a34b-f45bdb70d8c8
  title: UPI & Bill Payments — limits, restrictions, and edge cases
  body: 'This guide provides the technical boundaries and transaction limits for UPI
    & Bill Payments to assist in customer support and query resolution.


    Transaction Limits:

    - Standard UPI Transaction Limit: The maximum amount allowed for a single transaction
    is ₹1,00,000.

    - Daily UPI Limit: The total aggregate value of transactions in a single day is
    capped at ₹1,00,000.

    - UPI Lite Limit: For small-value, offline-style payments, the per-transaction
    limit for UPI Lite is ₹500.

    - Autopay Mandate (Without AFA): For recurring payments where Additional Factor
    Authentication (AFA) is not required for every instance, the cap is ₹15,000.


    Restrictions and Edge Cases:

    - NPCI Rails: All transactions are processed via NPCI rails. Any downtime or technical
    latency at the NPCI level may result in ''Pending'' statuses regardless of account
    balance.

    - Account Linkage: The UPI suite must be linked to a valid Chandrika Bank account.
    If the underlying account is frozen or dormant, UPI transactions will be declined.

    - Verification: In accordance with our security posture, PAN-based KYC and multi-factor
    authentication are mandatory before enabling UPI services.

    - Mandate Failures: Autopay mandates will fail if the account balance is insufficient
    at the time of the scheduled debit, which may impact the customer''s standing
    with the biller.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 23af5ef0-7581-5917-b9d9-02c5430a90df
  title: UPI & Bill Payments — autopay mandate without afa cap explained
  body: 'Q: What is an autopay mandate without AFA, and what is its limit?


    A: An autopay mandate allows you to automate recurring payments (such as utility
    bills or subscriptions) without needing to provide Additional Factor Authentication
    (AFA), like an OTP or PIN, for every single transaction. To ensure security and
    prevent large unauthorized debits, we have set a cap of ₹15,000 for such mandates.
    Any recurring payment exceeding ₹15,000 will require a full authentication process.


    Q: How does this differ from a standard UPI payment?


    A: A standard UPI payment is a one-time action that always requires your PIN and
    is subject to the per-transaction limit of ₹1,00,000, as detailed in UPI & Bill
    Payments — overview.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: da610247-c62d-5b58-a92a-ea9b42536640
  title: UPI & Bill Payments — check status or history
  body: 'To monitor your spending and verify that your payments have reached the intended
    recipient, follow these steps to check your transaction status or history.


    Prerequisites:

    - Your mobile device must be registered and authenticated with your Chandrika
    Bank account.

    - You must have an active internet connection to communicate with NPCI rails.


    Steps to check history:

    1. State to us that you wish to view your recent UPI transactions or bill payment
    history.

    2. Provide the specific time frame you are interested in (e.g., ''last 30 days''
    or ''current calendar month'').

    3. We will retrieve the transaction log, which will include the date, the recipient''s
    VPA (Virtual Payment Address) or biller name, the amount in ₹, and the current
    status (Success, Pending, or Failed).

    4. For any ''Pending'' transaction, we will provide the current state of the request
    as reported by the NPCI rails.


    How you know it worked:

    You will receive a detailed list of your transactions. If a specific payment was
    successful, you will see a ''Success'' confirmation and a corresponding debit
    in your account balance. If the transaction failed, you will see a ''Failed''
    status, and the funds will typically be reversed to your account according to
    RBI timelines.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 684f5bfc-0527-580b-86b7-d1a5e9a7f651
  title: UPI & Bill Payments — a declined or blocked action
  body: 'If you are experiencing a declined or blocked transaction while using UPI
    & Bill Payments, please use the following guide to identify the cause.


    Symptoms:

    - You receive an ''Insufficient Funds'' error despite having a balance.

    - The transaction is declined with a message like ''Limit Exceeded''.

    - Your account is blocked from initiating new UPI payments.


    Likely Causes & Checks:

    1. Check Transaction Limits: Ensure the payment does not exceed the per-transaction
    limit of ₹1,00,000 or the daily aggregate limit of ₹1,00,000. If using UPI Lite,
    ensure the amount is ₹500 or less.

    2. Verify Mandate Caps: If an autopay is failing, check if the amount exceeds
    the ₹15,000 cap for mandates without AFA.

    3. Check Account Status: Ensure your linked account is active. If you have not
    maintained the Monthly Average Balance (MAB), refer to Regular Savings Account
    — monthly average balance explained to see if restrictions have been applied.

    4. NPCI Rail Issues: Sometimes the failure is not with the bank but with the NPCI
    rails. Check if other UPI apps are experiencing similar delays.


    Resolution:

    - If the limit was exceeded, please split the payment into smaller amounts (within
    daily limits) or use an alternative transfer method.

    - If the account is blocked due to security reasons, we will perform a PAN-based
    KYC re-verification to restore access.


    Escalation:

    If the cause is not apparent, we will raise a technical case with the NPCI. You
    will receive a ticket number, and we will provide a resolution update within the
    RBI''s harmonised turn-around-time (TAT) framework.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 57dfa04d-d964-549a-96e2-b062e01b9d95
  title: UPI & Bill Payments — when to switch or upgrade
  body: 'As a support agent, use this guide to help customers decide if UPI & Bill
    Payments is the right tool for their current transaction size or if they need
    an alternative.


    Switch to/Stay with UPI & Bill Payments when:

    - The customer is making frequent, low-to-mid value payments (up to ₹1,00,000
    per day).

    - Small, instant payments under ₹500 are frequent (best use of UPI Lite).

    - The customer wants to automate bills under ₹15,000 via autopay mandates.


    Upgrade to alternative methods (like NEFT/RTGS via NetBanking) when:

    - The transaction exceeds the ₹1,00,000 daily limit.

    - The customer is transferring very large sums for property or business purchases
    that exceed the standard UPI rails'' capacity.

    - The customer requires a formal bank-issued confirmation for high-value corporate
    transfers.


    UPI is best for speed and daily lifestyle expenses; traditional transfers are
    better for high-value stability.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e187b04f-eadd-59d9-ac92-a6ea00e143a0
  title: UPI & Bill Payments — comparison vs. alternatives and when not to choose
    it
  body: 'UPI & Bill Payments is designed for the modern, fast-paced needs of salaried
    professionals and households. However, it is not the ideal tool for every financial
    scenario.


    When to choose UPI & Bill Payments:

    - Daily Utility: It is the gold standard for P2P (person-to-person) and P2M (person-to-merchant)
    transactions due to its speed.

    - Low-Value Convenience: With UPI Lite, you can handle payments up to ₹500 almost
    instantly.

    - Automated Billing: It is ideal for regular bills up to ₹15,000 using autopay
    mandates.


    When NOT to choose it (and what to use instead):

    - High-Value Transfers: If you need to move more than ₹1,00,000 in a single day,
    UPI is not the right choice. We recommend our traditional transfer rails (NEFT/RTGS)
    for these needs.

    - Credit-Based Spending: UPI debits funds directly from your savings. If you prefer
    a grace period to pay or wish to earn lifestyle rewards on your spend, the Chandrika
    Everyday Credit Card is the superior option.

    - Long-Term Saving: UPI is a payment tool, not a saving tool. For guaranteed returns,
    consider our 1-Year Fixed Deposit or Recurring Deposit.


    Comparison Summary:

    - vs. Credit Card: UPI is for immediate debit; Credit Card is for flexible credit
    and rewards.

    - vs. Traditional Transfers: UPI is for convenience and speed up to ₹1,00,000;
    Traditional transfers are for high-value stability.

    - vs. Deposits: UPI moves money; Deposits grow money.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: eed6c67b-2101-50eb-aa2e-ad0037c56068
  title: UPI & Bill Payments — cost and charges
  body: 'Q: Are there any fees for sending money via UPI?


    A: No, we do not charge customers for standard P2P (person-to-person) or P2M (person-to-merchant)
    UPI transactions. This allows you to maintain a disciplined financial habit without
    worrying about per-transaction costs.


    Q: Are there charges for setting up autopay mandates?


    A: Setting up and managing autopay mandates for your bills is free of charge.
    However, please ensure your account has sufficient funds to avoid any potential
    penalties from your service provider (the biller).


    Q: Does using UPI affect my Monthly Average Balance (MAB)?


    A: While using UPI is free, the money sent is debited from your savings account.
    To avoid fees associated with a low balance, please refer to Regular Savings Account
    — monthly average balance explained.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3ae481f1-87e9-5767-94c7-54219f102f7d
  title: UPI & Bill Payments — resolve a common request end-to-end
  body: 'This guide explains how to set up a recurring autopay mandate for a utility
    bill to ensure your payments are always on time.


    Prerequisites:

    - A funded savings account with Chandrika Bank.

    - The VPA (Virtual Payment Address) or registered biller ID of the service provider.


    Steps to resolve:

    1. Tell us you wish to set up a new autopay mandate for a specific biller.

    2. Provide the biller''s details and the maximum amount you are willing to authorize
    for each debit. Note that for mandates without AFA, the cap is ₹15,000.

    3. We will initiate the mandate request via NPCI rails. You will be asked to authenticate
    this primary request using your UPI PIN.

    4. Once you enter the PIN, we will confirm that the mandate has been successfully
    registered with the biller.

    5. We will provide you with the mandate reference number and the date of the first
    expected debit.


    How you know it worked:

    - You will receive a confirmation message stating that the autopay mandate is
    active.

    - On the next billing date, the amount will be debited automatically from your
    account (provided it is within the ₹15,000 limit for non-AFA mandates), and you
    will receive a transaction notification.'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: edfa90fe-b761-5ab3-a7a4-35d2a98599e8
  title: UPI & Bill Payments — a discrepancy in your records or statement
  body: "As a support agent, use this process when a customer reports that their account\
    \ statement does not match their UPI transaction history or a biller claims non-payment\
    \ despite a debit.\n\nSymptoms:\n- Customer sees a debit in their statement, but\
    \ the recipient claims the money was not received.\n- The UPI app shows 'Success',\
    \ but the bank statement shows 'Pending' or 'Failed'.\n- A duplicate debit has\
    \ occurred for a single bill payment.\n\nVerification Steps:\n1. Validate the\
    \ Transaction ID: Ask the customer for the 12-digit UPI transaction ID. Check\
    \ this against the NPCI rails to see the final settlement status.\n2. Compare\
    \ Statement vs. App: Confirm if the discrepancy is a matter of 'shadow limits'\
    \ (where funds are blocked but not yet debited). \n3. Check Mandate Logs: For\
    \ autopay issues, verify if the debit was within the ₹15,000 non-AFA cap. If it\
    \ exceeded this, the transaction may have been blocked by the system.\n\nResolution\
    \ Path:\n- For 'Success' in the bank but 'Failure' at the merchant: We will initiate\
    \ a payment trace with the recipient bank to locate the funds.\n- For duplicate\
    \ debits: We will verify the duplicate transaction IDs and initiate a reversal\
    \ if the second debit was an error.\n\nEscalation:\nIf the discrepancy is not\
    \ resolved through a trace, we will guide the customer to file a formal dispute.\
    \ This will be handled according to the RBI's harmonised turn-around-time (TAT)\
    \ framework to ensure prompt resolution and compensation. We will then route the\
    \ case to the nodal officer if required."
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ff4bde7a-9c08-53d4-83d1-383b76b1fe12
  title: close_account tool reference
  body: 'The close_account tool is used by agents to permanently terminate a customer''s
    relationship with a specific account. This is an irreversible action.


    **Tool Signature:**

    `close_account(account_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account to be closed.


    **Effect:**

    Calling this tool triggers the full closure of the designated account. All remaining
    balances must be settled or transferred before this tool is executed to avoid
    processing failures. Once the agent calls this tool, the account is deactivated
    and cannot be reopened. The agent performs this action directly within the conversation
    after the customer''s identity has been strictly verified via PAN-based KYC and
    multi-factor authentication.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: chandrika_bank
- id: 81af8291-e92d-5d30-bca5-c40c676b5fb5
  title: When to use update_contact_info
  body: 'We ensure that our customers receive timely alerts and regulatory communications
    by maintaining accurate contact details. The update_contact_info tool must be
    used whenever a customer requests a change to their registered mobile number,
    email address, or residential correspondence address.


    To maintain our ''Verify First'' security posture, agents must follow these steps:


    1. Authenticate the customer using the standard multi-factor authentication process
    and PAN-based KYC verification.

    2. Use the get_accounts tool to identify the correct account_id associated with
    the customer''s profile if they provide only a partial account number.

    3. Confirm the specific piece of information that requires updating (e.g., new
    mobile number or updated email).

    4. Clearly state the new details back to the customer to ensure accuracy and avoid
    clerical errors.

    5. Execute the update_contact_info tool with the verified account_id and the new
    contact parameters.

    6. Confirm to the customer that the records have been updated and advise them
    that a confirmation notification will be sent to both the old and new contact
    points for security reasons.


    Agents are strictly prohibited from updating contact information based on email
    requests or without full identity verification. For guidance on managing specific
    account types, refer to Regular Savings Account — make a change or update.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: chandrika_bank
- id: 36300772-78fe-5fcf-964b-c0f57f040667
  title: update_contact_info tool reference
  body: 'The update_contact_info tool allows agents to modify the customer''s registered
    communication details in the core banking system.


    **Tool Signature:**

    `update_contact_info(account_id: string, contact_fields: object)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `contact_fields`: A set of key-value pairs containing the fields to be updated
    (e.g., phone_number, email_address, residential_address).


    **Effect:**

    Updating these fields ensures that all future OTPs, transaction alerts, and legal
    notices are routed to the correct destination. The agent performs this action
    by calling the tool directly after successful identity verification. This is a
    state-changing action that is logged for audit purposes to comply with RBI transparency
    standards.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: chandrika_bank
- id: 1d378971-d314-51b2-afb6-778996442f44
  title: When to use get_statements
  body: 'Providing transparent access to transaction history is fundamental to our
    trust-centric approach. The get_statements tool is used to generate and provide
    account statements for a specific period, allowing customers to review their spending,
    interest credits, or Monthly Average Balance (MAB) trends.


    Agents must follow these procedural steps:


    1. Verify the customer''s identity using PAN-based KYC and multi-factor authentication.

    2. Use the get_accounts tool to retrieve the specific account_id for the product
    the customer is enquiring about (e.g., Regular Savings Account).

    3. Identify the required statement period (e.g., last month, last quarter, or
    a custom date range).

    4. Call the get_statements tool using the account_id and the requested date parameters.

    5. Deliver the statement to the customer via their preferred secure channel as
    defined in their profile.


    If a customer identifies a discrepancy while reviewing their statement, agents
    should guide them toward the appropriate dispute process. For example, if a charge
    is unexpected, refer to Regular Savings Account — an unexpected charge or amount.
    For systemic errors, the agent should follow the internal escalation path from
    front-line support to the nodal officer.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: chandrika_bank
- id: 3928eca0-0e43-56fd-b627-b599f850a962
  title: get_statements tool reference
  body: 'The get_statements tool retrieves the official transaction record for a specific
    account over a defined timeframe.


    **Tool Signature:**

    `get_statements(account_id: string, start_date: date, end_date: date)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `start_date`: The beginning date of the statement period.

    - `end_date`: The ending date of the statement period.


    **Effect:**

    The tool generates a read-only statement of all debits, credits, and balance snapshots
    for the specified duration. The agent performs this action by calling the tool
    directly. This ensures the customer receives a consistent and accurate record
    of their financial activity as per RBI transparency frameworks.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: chandrika_bank
- id: 8c069af0-47c1-521e-b40d-d50083a3d005
  title: When to use update_beneficiary
  body: 'To facilitate seamless fund transfers via NPCI rails, we allow customers
    to manage their list of approved beneficiaries. The update_beneficiary tool is
    used to add new recipients, modify existing beneficiary details, or remove old
    ones to prevent erroneous transfers.


    Agents must adhere to the following steps:


    1. Enforce the ''Verify First'' policy by completing PAN-based KYC and multi-factor
    authentication.

    2. Use the get_accounts tool to resolve the account_id for the customer''s funding
    account.

    3. Collect the necessary beneficiary details, including the recipient''s full
    name, account number, and IFSC code.

    4. Verify that the details provided are complete and formatted correctly to avoid
    transaction failures.

    5. Call the update_beneficiary tool to commit the changes to the customer''s profile.

    6. Inform the customer of any applicable cooling-off periods during which transfer
    limits to the new beneficiary may be restricted for security reasons.


    By ensuring that beneficiaries are correctly updated, we help customers maintain
    disciplined financial habits and reduce the risk of fraud. For more information
    on how to move money once a beneficiary is set, refer to When to use transfer_funds.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: chandrika_bank
- id: 581696c5-d04a-5384-a662-fffc6d11b520
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool manages the list of authorized recipients for
    fund transfers associated with a customer''s account.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: object, action: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `beneficiary_details`: An object containing the recipient''s name, account number,
    and IFSC.

    - `action`: The type of modification being performed (e.g., ''ADD'', ''UPDATE'',
    ''DELETE'').


    **Effect:**

    This tool updates the approved beneficiary list in the banking system. The agent
    performs this action by calling the tool directly. This prevents the need for
    customers to navigate complex menus and ensures that high-security verification
    is performed before any change to payment destinations occurs.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: chandrika_bank
- id: 68d4d4ed-8032-509c-86cb-21449c3dc99b
  title: When to use set_alerts
  body: 'We encourage our customers to stay informed about their account activity
    to ensure security and maintain their Monthly Average Balance (MAB). The set_alerts
    tool is used to configure notifications for specific events, such as low balance
    warnings, large transaction alerts, or monthly statement availability.


    Agents should follow these steps to assist the customer:


    1. Complete the mandatory identity verification using PAN-based KYC and multi-factor
    authentication.

    2. Use the get_accounts tool to identify the account_id for which the alerts are
    being set.

    3. Discuss the customer''s needs to determine which alerts are most useful (e.g.,
    an alert when the balance drops near the MAB threshold to avoid fees).

    4. Define the alert trigger (e.g., ''balance below ₹5,000'') and the preferred
    delivery method (SMS or Email).

    5. Execute the set_alerts tool with the account_id and the selected alert configurations.

    6. Confirm the active alerts to the customer and explain how these notifications
    help in monitoring account health.


    Setting appropriate alerts is a key part of our service model to help middle-income
    households manage their finances with stability. For details on the specific charges
    related to balance maintenance, refer to Regular Savings Account — monthly average
    balance explained.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: chandrika_bank
- id: af98687e-bcc0-5033-a6b6-41e0a7bc57f8
  title: set_alerts tool reference
  body: 'The set_alerts tool configures the automated notification system for a customer''s
    account.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_preferences: object)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `alert_preferences`: An object specifying the types of alerts to enable, the
    trigger thresholds, and the notification channels.


    **Effect:**

    Once called, the system will automatically monitor the account and send notifications
    when the specified conditions are met. The agent performs this action by calling
    the tool directly. This proactive approach helps customers avoid fees and detect
    fraudulent activity early by receiving real-time updates on their fund movements.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: chandrika_bank
- id: e7539fe1-7d7b-5403-9cd5-a8c7a7202335
  title: When to use transfer_funds
  body: 'Moving money securely and efficiently is a core requirement for our salaried
    professional and middle-income customers. The transfer_funds tool is used to move
    money between internal accounts or to external accounts using NPCI rails (such
    as NEFT, IMPS, or UPI).


    Agents must follow these strict steps for every transfer request:


    1. Perform full identity verification via PAN-based KYC and multi-factor authentication.

    2. Use the get_accounts tool to retrieve the account_id of the source account
    and confirm that sufficient funds are available for the transfer.

    3. Verify that the destination beneficiary is already registered. If not, the
    agent must first use the update_beneficiary tool.

    4. Confirm the exact amount to be transferred and the purpose of the payment to
    ensure the transaction is legitimate.

    5. Call the transfer_funds tool with the source account_id, destination details,
    and the exact amount.

    6. Provide the customer with the transaction reference number and the estimated
    time of credit based on the rail used.


    Agents must never request the customer''s UPI PIN or OTP to complete this action;
    the tool is executed based on the agent''s authenticated session and the customer''s
    verified consent. For instant, digital-first payments specifically using UPI,
    refer to UPI & Bill Payments — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: chandrika_bank
- id: 4d2b75aa-aaa7-53ff-b273-25da01caffa6
  title: transfer_funds tool reference
  body: 'The transfer_funds tool is used by the agent to move money between accounts
    or to an external beneficiary. The agent performs this action by calling the tool
    directly once the customer''s identity is verified.


    **Tool Signature:**

    `transfer_funds(from_account_id, to_account_id, amount, currency, remarks)`


    **Arguments:**

    - `from_account_id`: The unique identifier of the source account.

    - `to_account_id`: The unique identifier of the destination account.

    - `amount`: The total value to be transferred.

    - `currency`: The currency of the transaction (e.g., INR).

    - `remarks`: A brief description or note for the transaction.


    **Effect:**

    This tool executes a real-time debit from the source account and a credit to the
    destination account. It is a state-changing operation that updates the account
    balances immediately upon successful execution.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: chandrika_bank
- id: 585e5acc-77a8-5b13-b497-89f106ec2778
  title: When to use order_replacement_card
  body: 'We provide replacement cards to ensure our customers maintain uninterrupted
    access to their funds and credit facilities. This procedure applies to the Chandrika
    Everyday Credit Card and debit cards associated with the Regular Savings Account.


    **Applicable Scenarios:**

    1. **Lost or Stolen Cards:** When a customer reports a card missing to prevent
    unauthorised use.

    2. **Damaged Cards:** When the physical card is worn, the chip is malfunctioning,
    or the magnetic stripe is unreadable.

    3. **Expiry:** When a card is nearing its expiration date and a new one has not
    been automatically dispatched.


    **Agent Procedure:**

    1. Verify the customer''s identity using PAN-based KYC and multi-factor authentication
    as per our ''Verify First'' policy.

    2. Use the `get_accounts` tool to identify the specific account and associated
    card linked to the customer''s profile.

    3. Confirm the reason for replacement (e.g., theft vs. damage) to determine if
    the old card must be frozen first.

    4. If the card is lost or stolen, the agent must first execute the `freeze_card`
    tool to secure the account.

    5. Call the `order_replacement_card` tool to initiate the printing and dispatch
    of the new card to the registered address.

    6. Inform the customer of the expected delivery timeline and any applicable replacement
    fees as outlined in the Institution-wide fees and charges.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: chandrika_bank
- id: 020be177-f4b9-5291-8bbf-ab0fd8604233
  title: order_replacement_card tool reference
  body: 'The order_replacement_card tool is used by the agent to request a new physical
    card for a customer. The agent performs this action by calling the tool directly;
    customers cannot trigger this specific backend request through self-service menus.


    **Tool Signature:**

    `order_replacement_card(card_id, reason, shipping_address_override)`


    **Arguments:**

    - `card_id`: The unique identifier of the card being replaced.

    - `reason`: The justification for the replacement (e.g., ''LOST'', ''STOLEN'',
    ''DAMAGED'', ''EXPIRED'').

    - `shipping_address_override`: Optional. A different address for delivery if the
    registered address is no longer valid.


    **Effect:**

    This tool triggers the card issuance workflow. It logs the request in the system,
    initiates the physical production of the card, and schedules delivery via the
    bank''s logistics partner. The existing card may be marked for replacement in
    the system.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: chandrika_bank
- id: 59777fd2-8803-51d5-8cb3-18b91244f705
  title: When to use stop_payment
  body: 'A stop payment request is a critical security and financial control measure.
    We allow customers to halt the processing of a specific payment to prevent the
    loss of funds due to errors or suspected fraud.


    **Applicable Scenarios:**

    1. **Check-based Payments:** When a physical cheque has been lost, stolen, or
    issued to a party with whom a dispute has since arisen.

    2. **Scheduled Transfers:** When a pre-authorised or scheduled fund transfer needs
    to be cancelled before it is processed.

    3. **Erroneous Instructions:** When a customer realises they have provided incorrect
    payment details for a pending transaction.


    **Agent Procedure:**

    1. Perform strict identity verification using PAN-based KYC and multi-factor authentication.

    2. Use `get_accounts` to resolve the customer''s account details and `get_account_transactions`
    to locate the specific pending payment or cheque number.

    3. Confirm with the customer the exact transaction details (amount, date, and
    beneficiary) to avoid stopping the wrong payment.

    4. Execute the `stop_payment` tool to place a hold on the transaction.

    5. Advise the customer that stop payment requests are subject to the terms and
    conditions of their account and may incur a fee as detailed in the Institution-wide
    fees and charges.

    6. If the stop payment is due to fraudulent activity, the agent must route the
    customer through the dedicated fraud reporting path as per the bank''s dispute
    and fraud handling guidelines.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: chandrika_bank
- id: 90b1a74f-4795-5958-9bb6-98a77b675c1d
  title: stop_payment tool reference
  body: 'The stop_payment tool allows an agent to prevent a specific transaction from
    being cleared or processed. The agent performs this action by calling the tool
    directly after verifying the customer''s identity.


    **Tool Signature:**

    `stop_payment(account_id, transaction_reference, payment_type)`


    **Arguments:**

    - `account_id`: The identifier of the account from which the payment is originating.

    - `transaction_reference`: The unique cheque number or transaction ID of the payment
    to be stopped.

    - `payment_type`: The category of payment (e.g., ''CHEQUE'', ''SCHEDULED_TRANSFER'').


    **Effect:**

    This tool places a ''stop'' flag on the specified transaction in the core banking
    system. If the payment is presented for clearing, the system will automatically
    reject it, and the funds will remain in the customer''s account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: chandrika_bank
- id: d31f8dcb-6250-531d-aed4-c3800a582536
  title: When to use pay_bill
  body: 'Chandrika Bank provides integrated bill payment services via our UPI & Bill
    Payments suite to help customers manage their utility and lifestyle expenses efficiently.


    **Applicable Scenarios:**

    1. **Utility Payments:** Payment of electricity, water, or gas bills.

    2. **Telecom & Broadband:** Settling mobile post-paid or internet bills.

    3. **Insurance Premiums:** Paying monthly or annual premiums for various insurance
    policies.

    4. **Taxes and Government Levies:** Processing approved government bill payments.


    **Agent Procedure:**

    1. Verify the customer''s identity through PAN-based KYC and multi-factor authentication.

    2. Use `get_accounts` to determine the available balance in the customer''s Regular
    Savings Account to ensure sufficient funds.

    3. Collect the biller details (Biller ID or Consumer Number) and the exact amount
    to be paid from the customer.

    4. Call the `pay_bill` tool to execute the transaction via NPCI rails.

    5. Once the tool confirms success, provide the customer with the transaction reference
    number for their records.

    6. If the payment fails, refer to UPI & Bill Payments — a failed or pending action
    for the appropriate troubleshooting steps.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: chandrika_bank
- id: 3c78fb96-11be-5f2e-83b5-542eedc6edf4
  title: pay_bill tool reference
  body: 'The pay_bill tool enables the agent to facilitate the payment of a utility
    or service bill on behalf of the customer. The agent performs this action by calling
    the tool directly.


    **Tool Signature:**

    `pay_bill(account_id, biller_id, consumer_number, amount, currency)`


    **Arguments:**

    - `account_id`: The source account from which the funds will be debited.

    - `biller_id`: The unique identifier of the service provider/biller.

    - `consumer_number`: The customer''s specific account or consumer number with
    the biller.

    - `amount`: The total amount to be paid.

    - `currency`: The currency of the payment (INR).


    **Effect:**

    This tool initiates a payment request through the NPCI rails to the designated
    biller. Upon successful processing, it debits the customer''s account and provides
    a confirmation of payment.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: chandrika_bank
- id: 673a6789-679f-5c75-ad85-372fd27d9b9b
  title: When to use activate_card
  body: 'For security reasons, all new or replacement cards—including the Chandrika
    Everyday Credit Card and debit cards for the Regular Savings Account—are dispatched
    in an inactive state. Activation is required before the card can be used for ATM
    withdrawals, POS transactions, or online shopping.


    **Applicable Scenarios:**

    1. **New Account Opening:** When a customer receives their first card after opening
    a new account.

    2. **Card Replacement:** After a replacement card has been delivered following
    a loss or damage report.

    3. **Card Upgrade:** When a customer has been upgraded to a different card tier.


    **Agent Procedure:**

    1. Strictly adhere to the ''Verify First'' policy by performing PAN-based KYC
    and multi-factor authentication.

    2. Use `get_accounts` to locate the customer''s card profile and confirm that
    a card is currently in ''Inactive'' or ''Pending Activation'' status.

    3. Confirm that the customer has the physical card in their possession.

    4. Call the `activate_card` tool using the specific card identifier.

    5. Once activated, advise the customer to set their secure PIN via the digital
    platform. Remind them that agents will never ask for their UPI PIN, OTPs, or CVVs.

    6. Encourage the customer to review the Chandrika Everyday Credit Card — overview
    for details on rewards and spending flexibility.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: chandrika_bank
- id: c0a03b03-baf3-51d4-bed1-78c9f2f32083
  title: activate_card tool reference
  body: 'The activate_card tool is used by the agent to change the status of a physical
    card from inactive to active. The agent performs this action by calling the tool
    directly after identity verification.


    **Tool Signature:**

    `activate_card(card_id)`


    **Arguments:**

    - `card_id`: The unique identifier of the card to be activated.


    **Effect:**

    This tool updates the card status in the core banking system to ''Active''. This
    enables the card for all authorised transactions across ATM, POS, and e-commerce
    channels, subject to any default spending limits set on the account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: chandrika_bank
- id: 8615fa3f-4e1e-520b-a8ef-5300c240b610
  title: When to use dispute_status
  body: 'Chandrika Bank is committed to transparency in resolving transaction discrepancies.
    We handle all disputes according to the RBI''s harmonised turn-around-time (TAT)
    framework to ensure customers receive prompt resolutions and appropriate compensation.


    **Applicable Scenarios:**

    1. **Tracking Progress:** When a customer wants to know the current stage of an
    existing dispute (e.g., ''Under Investigation'', ''Resolved'', ''Rejected'').

    2. **Resolution Clarification:** When a customer has been notified of a resolution
    but requires a detailed explanation of the outcome.

    3. **TAT Monitoring:** When the promised resolution date has passed, and the customer
    is seeking an update.


    **Agent Procedure:**

    1. Verify the customer''s identity using PAN-based KYC and multi-factor authentication.

    2. Ask the customer for the dispute reference number provided at the time of filing
    the claim via the `file_transaction_dispute` tool.

    3. Execute the `dispute_status` tool to retrieve the real-time status of the claim
    from the dispute management system.

    4. Communicate the current status clearly to the customer. If the dispute is still
    ''Under Investigation'', reassure them of the RBI-mandated TAT.

    5. If the dispute is unresolved and has exceeded the TAT, the agent should provide
    information on escalating the matter to the nodal officer and eventually to the
    RBI Integrated Ombudsman Scheme if necessary.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: chandrika_bank
