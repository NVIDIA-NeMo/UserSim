- id: bf53b95b-838f-5901-aa0e-e5c8a062ebc0
  title: Regular Savings Account — fraud and unauthorized-activity protection
  body: 'At Chandrika Bank, the security of your hard-earned money is our highest
    priority. As you compare your banking options, we want you to understand the specific
    protections and protocols we use to keep your Regular Savings Account safe.


    **Common Fraud Patterns**

    Customers are often targeted by ''phishing'' or ''vishing'' scams where fraudsters
    pretend to be bank officials. They may claim your account is blocked or that you
    have won a prize, urging you to ''verify'' your details to resolve the issue.
    Be wary of any urgent request that asks you to move funds or share security codes.


    **Our Strict ''Verify First'' Policy**

    We adhere to a rigorous security standard. Please remember that Chandrika Bank
    agents will NEVER ask you for the following sensitive credentials:

    - Your UPI PIN

    - One-Time Passwords (OTPs)

    - Your Debit Card CVV

    - Your Net Banking Password


    If anyone requesting these details claims to be from our institution, it is a
    fraudulent attempt. We use PAN-based KYC and multi-factor authentication for all
    state-changing actions to ensure that only you can access your funds.


    **Immediate Action and Liability**

    If you notice any unauthorised transaction or suspect your account has been compromised,
    notify us immediately. According to the RBI''s harmonised turn-around-time (TAT)
    framework, reporting fraudulent activity promptly is critical to minimising your
    liability. The sooner you report the incident through our dedicated fraud reporting
    path, the better we can protect your balance.


    ***

    *Disclaimer: Customer deposits are protected by the DICGC insurance scheme up
    to ₹5,00,000 per depositor.*'
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ae91b943-0b34-5ce9-a757-a12daeff7d2c
  title: Regular Savings Account — account agreement
  body: 'This agreement outlines the binding terms between Chandrika Bank and the
    account holder for the Regular Savings Account.


    **1. Balance Obligations**

    To ensure account sustainability, the customer is obligated to maintain a Monthly
    Average Balance (MAB) of ₹10,000. The MAB is calculated as the average of the
    daily closing balances throughout the calendar month. Failure to maintain this
    threshold will result in a below MAB charge of ₹500 per month.


    **2. Interest and Credits**

    We provide a savings interest rate of 3.5% per annum. Interest is calculated on
    the daily balance and credited to the account periodically as per bank policy.


    **3. Debit Card and ATM Usage**

    Accounts are issued a debit card subject to an annual fee of ₹250. The account
    holder is entitled to 5 free ATM transactions per month. Transactions exceeding
    this limit will attract charges as per our standard fee schedule.


    **4. Bank’s Right to Modify Terms**

    Chandrika Bank reserves the right to modify interest rates, fees, and charges.
    We will provide notice of such changes through our official communication channels.
    Continued use of the account after the notice period constitutes acceptance of
    the new terms.


    **5. Account Closure**

    Customers may request to close their account at any time. All outstanding dues
    must be cleared, and the debit card must be surrendered or destroyed before the
    final balance is disbursed.


    ***

    *Disclaimer: All accounts are governed by RBI guidelines. Deposits are insured
    by the DICGC up to ₹5,00,000.*'
  domain: retail_banking
  product_category: savings_regular
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f8a559d8-3533-55e4-be32-443c695310bc
  title: Regular Savings Account — who it is best for and common use cases
  body: 'The Regular Savings Account is designed as a foundational liquid account
    for middle-income Indian households and salaried professionals who seek a balance
    between stability and modern accessibility.


    **Who is this account for?**

    This account is ideal for individuals who maintain a steady monthly surplus and
    require a secure place for their daily operating funds while earning a modest
    return. It is best suited for those who can comfortably maintain a Monthly Average
    Balance (MAB) of ₹10,000 to enjoy fee-free utility.


    **Common Use Cases**

    - **Salary Management:** An excellent primary account for receiving monthly paychecks
    and managing monthly bills.

    - **Emergency Fund Storage:** A safe haven for liquid funds that need to be accessible
    instantly via NPCI rails (UPI, IMPS, NEFT).

    - **Daily Spending:** Using the integrated debit card for lifestyle expenses with
    a predictable cost structure.


    **Product Specifications**

    - **Interest Earned:** Your funds grow at a savings interest rate of 3.5%.

    - **MAB Requirement:** ₹10,000 (Maintaining this avoids the below MAB charge of
    ₹500).

    - **ATM Access:** 5 free ATM transactions per month to ensure easy cash access.

    - **Annual Maintenance:** A debit card annual fee of ₹250.


    By combining traditional trust with seamless digital payments, we ensure your
    money remains both safe and available.'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 27ab323b-7b16-5c98-8321-37005f81303f
  title: Regular Savings Account — below mab charge explained
  body: '**What exactly is the ''below MAB charge''?**

    The below MAB charge is a fee of ₹500 applied to your account if the Monthly Average
    Balance (MAB) falls below the required threshold of ₹10,000 during a calendar
    month.


    **How is this charge calculated?**

    We calculate the MAB by adding the closing balance of each day in the month and
    dividing it by the number of days in that month. If this final average is less
    than ₹10,000, the charge is applied.


    **Can this charge be avoided?**

    Yes, by ensuring your average balance stays at or above ₹10,000. We encourage
    disciplined financial habits to help you maintain this balance and avoid the ₹500
    fee. For more details, you may refer to Regular Savings Account — monthly average
    balance explained.'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e1d79070-f8bc-5665-af47-9a9527f3fe3b
  title: Regular Savings Account — cancel, close, or downgrade
  body: 'If you wish to stop using your Regular Savings Account, either by closing
    it entirely or downgrading to a different product, please follow these steps:


    **Prerequisites**

    - Ensure all pending cheques or standing instructions are cleared.

    - Bring your physical debit card and a valid government ID (PAN card).


    **Steps to Close or Downgrade**

    1. **Submit Request:** Tell us whether you wish to close the account fully or
    downgrade it to another account type. We will verify your identity using your
    PAN-based KYC.

    2. **Clear Dues:** We will check for any outstanding charges, such as a pending
    debit card annual fee of ₹250 or any unpaid below MAB charges of ₹500. You must
    settle these before proceeding.

    3. **Surrender Collateral:** Hand over your physical debit card to the agent for
    secure destruction.

    4. **Withdraw Balance:** Specify how you would like to receive the remaining funds
    (e.g., via a demand draft, transfer to another account, or cash within permissible
    limits).

    5. **Final Confirmation:** We will process the request and provide you with a
    formal account closure advice or a confirmation of the downgrade.


    **How you know it worked**

    For a closure, you will receive a closure certificate and your balance will be
    zero. For a downgrade, you will see the new account features and MAB requirements
    reflected in your account status.'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 79b98129-b3fc-5b74-bad0-8f5040849014
  title: Regular Savings Account — an unexpected charge or amount
  body: "**Symptom:** You notice a deduction in your account balance that you did\
    \ not authorise or an amount that does not match your records.\n\n**Potential\
    \ Causes**\n- **MAB Non-Compliance:** A deduction of ₹500 due to the Monthly Average\
    \ Balance falling below ₹10,000.\n- **Annual Fees:** The yearly debit card annual\
    \ fee of ₹250 being debited.\n- **ATM Limits:** Charges applied after exceeding\
    \ the 5 free ATM transactions per month.\n- **Unauthorised Activity:** A fraudulent\
    \ transaction.\n\n**What to check in order**\n1. **Review Statement:** Check the\
    \ transaction description. If it mentions 'MAB Charge', verify if your average\
    \ balance for the previous month was under ₹10,000.\n2. **Check Date:** If the\
    \ charge is ₹250 and occurs once a year, it is likely the debit card annual fee.\n\
    3. **Count ATM Visits:** Total your ATM withdrawals for the month; if they exceed\
    \ 5, the extra charges are valid.\n\n**The Fix**\n- If the charge is a legitimate\
    \ fee (MAB or Card), we can explain the calculation to you. \n- If the charge\
    \ is truly unexpected or unauthorised, we will immediately initiate a dispute.\n\
    \n**Escalation**\nWe will route the issue through our dedicated reporting path.\
    \ We handle disputes according to the RBI's harmonised turn-around-time (TAT)\
    \ framework. You will receive a ticket number and a resolution timeline. If unresolved,\
    \ the matter can be escalated to our nodal officers and eventually the RBI Integrated\
    \ Ombudsman Scheme."
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
