- id: 59224394-7dba-5239-b94c-82e0058cff7a
  title: Regular Savings Account — risk disclosures
  body: 'This document provides essential risk disclosures regarding the Regular Savings
    Account to ensure full transparency for our customers.


    **Deposit Protection**

    Your deposits with Chandrika Bank are protected by the Deposit Insurance and Credit
    Guarantee Corporation (DICGC). This insurance covers up to ₹5,00,000 per depositor.
    Any amount exceeding this limit is subject to the general credit risk of the institution.


    **Interest Rate Risk**

    The savings interest rate of 3.5% is variable. While we aim for stability, this
    rate may be adjusted upwards or downwards based on RBI guidelines and market conditions.
    Changes will be communicated to you as per our terms.


    **Liquidity and Fees**

    While the Regular Savings Account provides high liquidity, the utility is ''fee-free''
    only if the Monthly Average Balance (MAB) of ₹10,000 is maintained. A failure
    to do so results in a financial penalty of ₹500 per month, which can erode the
    interest earned on smaller balances.


    **Operational Risks**

    Transactions made via NPCI rails (UPI, IMPS, NEFT) are subject to the technical
    availability of the underlying infrastructure. We are not liable for delays caused
    by third-party technical failures, though we adhere to the RBI''s TAT framework
    for resolution and compensation in cases of failed transactions.


    ***

    *Disclaimer: We provide financial education and product information but do not
    offer individualised tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
