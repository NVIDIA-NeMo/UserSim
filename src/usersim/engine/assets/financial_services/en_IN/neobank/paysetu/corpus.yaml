- id: 576b8826-227a-5bc1-a69a-8eb89bda5868
  title: PaySetu Digital Savings — an unexpected charge or amount
  body: '**Symptom:** You notice a deduction or a balance discrepancy in your <b>PaySetu
    Digital Savings</b> account that you did not authorise or expect.


    **Likely Causes**

    1. **Automated Mandates:** A recurring payment via <b>bill_autopay</b> or a previously
    authorised <b>Mandate</b> may have been triggered.

    2. **Payment Rail Lag:** A transaction via UPI, IMPS, or NEFT may have been delayed,
    showing a temporary discrepancy in the available balance.

    3. **Unauthorized Activity:** In rare cases, an unauthorized third party may have
    attempted a transaction.


    **What to check (in order)**

    1. **Transaction History:** Review your recent ledger. Check if the amount matches
    any of your recurring subscriptions or automated bills.

    2. **Mandate Status:** Verify your active <b>Mandates</b> to see if a scheduled
    debit occurred on that date.

    3. **Notification Log:** Check for any alerts regarding failed transactions that
    may have caused a temporary hold on funds.


    **The Fix**

    - If the charge was an accidental <b>Mandate</b>, you can request to revoke that
    specific instruction for future cycles.

    - If the amount is due to a <b>Payment Rail</b> failure, we will adhere to the
    RBI''s harmonised turn-around-time (TAT) to ensure your funds are returned.


    **When to Escalate**

    If you cannot identify the transaction and suspect fraud, notify us immediately.
    We will route the case through our formal reporting and chargeback path. You will
    receive a ticket number and updates on the resolution progress via chat.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
