- id: 2f200650-bf56-5826-9b0a-cebf62ba01e0
  title: Bill Autopay — vs. a similar product here
  body: 'When deciding how to manage your payments, you may compare **Bill Autopay**
    with the **PaySetu Wallet & UPI** manual payment flow.


    **Bill Autopay** is a ''set-it-and-forget-it'' tool. It uses a **Mandate** to
    automate payments, providing a **24 hours** pre-debit notice and allowing seamless
    transfers up to **₹15000** without AFA. It is best for fixed monthly overheads
    like electricity, rent, or software subscriptions where missing a date results
    in penalties.


    **PaySetu Wallet & UPI** is a high-velocity hub for on-demand spends. It requires
    manual initiation for every transaction and is better suited for irregular payments
    or merchants where you prefer to review the exact amount before sending funds.


    **Decision Guide**:

    - Choose **Bill Autopay** if you value time and want to eliminate the risk of
    forgetting a due date.

    - Choose **PaySetu Wallet & UPI** if you prefer total manual control over every
    single rupee leaving your account in real-time.'
  domain: payments
  product_category: bill_autopay
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 69d1fe4b-10bc-5c7f-9c5e-1e48be52f2d6
  title: Bill Autopay — regulatory disclosures
  body: 'This disclosure governs the use of **Bill Autopay** and is provided to ensure
    full transparency regarding the automation of your funds.


    **Mandate Authorization**

    By activating Bill Autopay, you are creating a legal **Mandate** that authorises
    PaySetu to debit your account on behalf of a third-party biller. This mandate
    is subject to the rules laid down by the RBI and NPCI. For your protection, a
    **mandate cap of ₹15000** is applied to all transactions that do not utilize Additional
    Factor Authentication (AFA).


    **Notification and Timing**

    PaySetu commits to providing a pre-debit notification **24 hours** before the
    execution of any automated payment. However, the finality of the payment is subject
    to the availability of funds and the operational status of the underlying **Payment
    Rail**.


    **Fees and Liability**

    While core banking is free, a **late bill convenience fee of ₹20** may be levied
    under specific service conditions. In the event of a failed transaction, PaySetu
    adheres to the RBI''s harmonised turn-around-time (TAT) for the reversal of funds.
    All retail deposits used to fund these payments are insured by the DICGC up to
    ₹5,00,000 per depositor.


    **Customer Responsibility**

    Customers are responsible for maintaining sufficient balances to avoid payment
    failures. PaySetu is not liable for penalties imposed by billers due to insufficient
    funds. We maintain a strict ''verify-before-action'' policy; agents will never
    ask for your UPI PIN or OTP to ''fix'' a failed autopay.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 3388e8de-a32b-5608-938e-b9253ce4f558
  title: Bill Autopay — interest rate / APY schedule
  body: '**Bill Autopay** is a payment orchestration tool and does not inherently
    earn interest or offer a yield. It is a utility for moving funds from your account
    to a biller.


    Funds held in the account used to fuel your autopay mandates may earn interest
    if they are kept in a **PaySetu Digital Savings** account. The interest rates
    for those deposits are governed by the separate rate schedule for that product.
    Bill Autopay itself does not apply any interest rate, APY, or percentage-based
    yield to the transactions it processes.


    Any changes to the pricing of the convenience services associated with this product
    will be communicated to you in advance as per our change-of-terms policy.'
