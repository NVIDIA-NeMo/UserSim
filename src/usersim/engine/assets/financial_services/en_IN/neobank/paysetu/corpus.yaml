- id: bc9751d7-33f7-537f-aa3c-3a3fd130ef21
  title: PaySetu Digital Savings — overview
  body: 'Welcome to **PaySetu Digital Savings**, the secure, interest-bearing foundation
    for your digital wealth. Designed for the digital-native generation, this account
    removes the traditional barriers to banking, allowing you to grow your money without
    the stress of hidden charges or rigid requirements.


    **Core Highlights**


    *   **Zero Balance Entry**: We believe in a zero-barrier entry to banking. Your
    **minimum balance** requirement is ₹0, meaning you will never be penalised for
    having a low balance.

    *   **Competitive Growth**: Your funds work for you with a **savings interest
    rate** of 3.5%.

    *   **Digital-First Onboarding**: Get started instantly. While basic features
    are available immediately, completing your **Full-KYC** (comprehensive identity
    verification via PAN/Aadhaar) unlocks higher limits and the full suite of banking
    features.

    *   **Safety First**: Your peace of mind is our priority. All retail deposits
    are secure and insured by the DICGC up to ₹5,00,000 per depositor.


    **Key Specifications**


    *   **Minimum Balance**: ₹0

    *   **Interest Rate**: 3.5%

    *   **Full-KYC Timeline**: You have 30 days to complete the **Full-KYC** process
    to maintain full account functionality.


    Whether you are building an emergency fund or simply need a safe place for your
    monthly savings, PaySetu Digital Savings provides the transparency and flexibility
    you need to manage your financial orchestration seamlessly.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: product_sheet
  source_authority: official
