  institution_id: paysetu
- id: cb2e2c52-5f2a-5376-8580-84de644c55a3
  title: PaySetu Digital Savings — regulatory disclosures
  body: 'This document provides formal regulatory disclosures for **PaySetu Digital
    Savings**. All accounts are governed by the laws of India and the guidelines issued
    by the Reserve Bank of India (RBI) and the National Payments Corporation of India
    (NPCI).


    **Deposit Insurance**

    Retail deposits in PaySetu Digital Savings are secure and insured by the Deposit
    Insurance and Credit Guarantee Corporation (DICGC). The insurance covers up to
    ₹5,00,000 per depositor, including both principal and interest.


    **KYC Compliance**

    In accordance with RBI''s ''Know Your Customer'' (KYC) norms, all users must undergo
    identity verification. Users starting with **Minimum-KYC** are granted limited
    functionality. To maintain full account features and avoid restriction, **Full-KYC**
    (verification of PAN and Aadhaar) must be completed within 30 days of account
    opening.


    **Interest Application**

    Interest is calculated based on the daily balance and credited to the account
    periodically. The current **savings interest rate** is 3.5% per annum. This rate
    is subject to change based on RBI''s monetary policy and internal review; customers
    will be notified of any changes via the app.


    **Account Maintenance**

    PaySetu adheres to a lean pricing model. There is a **minimum balance** requirement
    of ₹0 for this account. No fees are charged for maintaining a zero balance.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. All operations are subject to the final terms
    of the account agreement.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: disclosure
  source_authority: official
  placeholder: true
