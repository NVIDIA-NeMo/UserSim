  body: 'PaySetu operates on a lean pricing model to ensure digital banking remains
    accessible. For **Bill Autopay**, we do not charge for the setup, maintenance,
    or execution of standard mandates.


    **Applied Fees:**

    - **Standard Mandate Execution:** ₹0

    - **Late Bill Convenience Fee:** ₹20


    **When the fee is applied:**

    The late bill convenience fee of ₹20 is applied only when a customer utilizes
