- id: d3209e9b-e801-5c6a-968a-015ca871dcff
  title: PaySetu Digital Savings — how rates are tiered and applied
  body: 'The <b>PaySetu Digital Savings</b> account follows a simplified, flat-rate
    interest structure to maintain transparency and accessibility.


    **Applicable Rate**

    - **Annual Interest Rate:** 3.5%


    **How it is applied**

    There are no tiered balance requirements for this rate. Whether your balance is
    the minimum balance of ₹0 or significantly higher, the savings interest rate of
    3.5% applies uniformly to all eligible funds in the account.


    **Calculation and Crediting**

    Interest is calculated on the daily closing balance and is credited to the account
    periodically. This ensures that customers benefit from the time-value of their
    money regardless of the frequency of their deposits or withdrawals.


    **Factors that may change the rate**

    - Changes in the Reserve Bank of India (RBI) benchmark rates.

    - Adjustments to PaySetu''s internal lean pricing model.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
