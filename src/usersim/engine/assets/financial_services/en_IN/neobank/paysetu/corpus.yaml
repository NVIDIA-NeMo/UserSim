- id: 89b34c2f-2524-55c1-b613-684a6cb68db2
  title: PaySetu Prepaid Forex Card — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the **PaySetu
    Prepaid Forex Card**. Use this information to ensure customers are fully informed
    of the terms and costs before onboarding.


    **Regulatory Framework**

    The PaySetu Prepaid Forex Card operates strictly under the guidelines set by the
    Reserve Bank of India (RBI) and the National Payments Corporation of India (NPCI)
    regarding Prepaid Payment Instruments (PPI). Compliance is framed as customer
    protection; therefore, **Full-KYC** is a mandatory prerequisite for the issuance
    of this card to ensure adherence to anti-money laundering (AML) and combatting
    the financing of terrorism (CFT) standards.


    **Fee Transparency**

    In accordance with our lean pricing model, fees are applied only to recover direct
    costs. The following charges are applicable:

    - An issuance fee of ₹150.

    - A reload fee of ₹100 per instance.

    - A cross currency markup of 2% on transactions involving currencies other than
    the card''s primary load.

    - An ATM withdrawal fee abroad of ₹200 per transaction.


    **Customer Protection**

    All retail deposits held within the PaySetu ecosystem are secure and insured by
    the Deposit Insurance and Credit Guarantee Corporation (DICGC) up to ₹5,00,000
    per depositor. In the event of suspected fraud, PaySetu follows a ''fair-and-fast''
    philosophy, routing reports through formal chargeback paths to limit customer
    liability.


    **Service and Escalation**

    Support is available 24/7 IST. Escalations follow a tiered path: first-level digital
    support, then the Grievance Redressal Officer, and finally the RBI Integrated
    Ombudsman Scheme.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
