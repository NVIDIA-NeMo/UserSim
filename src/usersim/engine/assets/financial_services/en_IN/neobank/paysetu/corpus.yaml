- id: 408ccb1e-56bd-509b-88d4-bbaa85a56ce1
  title: Bill Autopay — account security best practices
  body: 'Your financial security is our priority. Because **Bill Autopay** manages
    automated debits via a **Mandate**, it is essential to maintain strict hygiene
    regarding your account credentials.


    **Common Threat Patterns**

    Fraudsters may attempt ''social engineering'' by posing as PaySetu support or
    a utility provider, claiming there is an issue with your automated payment. They
    may ask you to ''verify'' your account by sharing a code or clicking a suspicious
    link to ''reactivate'' a failed mandate.


    **The PaySetu Golden Rule**

    Our agents will **never** request the following sensitive credentials:

    - Your UPI PIN

    - One-Time Passwords (OTPs)

    - CVV numbers

    - Your full account password


    **Best Practices for Autopay Users**

    1. **Monitor Notifications**: PaySetu sends a pre-debit notification **24 hours**
    before any automated payment is processed. If you receive a notification for a
    transaction you did not authorise, act immediately.

    2. **Review Mandates**: Periodically review your active mandates in the app to
    ensure no obsolete subscriptions are still authorised.

    3. **Verify the Source**: Always ensure any communication regarding your payments
    comes from an official PaySetu channel.


    **What to do if you suspect fraud**

    If you notice an unauthorised debit or receive a suspicious request for your PIN/OTP,
    inform us immediately via in-app chat. Suspected fraud is immediately routed through
    our formal reporting and chargeback path to limit your liability. We follow RBI''s
    harmonised turn-around-time (TAT) for all failed transactions and refunds to ensure
    a fair-and-fast resolution.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 7c6026f4-9be0-5259-8a67-83c76b6f66b8
  title: Bill Autopay — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms governing
    **Bill Autopay**. By using this service, you agree to the binding nature of these
    terms.


    **Right to Modify**

    PaySetu reserves the right to update the terms of service, including fee structures
    and operational limits. Any changes to the **mandate cap without AFA** (currently
    ₹15,000) or the **late bill convenience fee** (currently ₹20) will be communicated
    to the user prior to implementation.


    **Notification Period**

    Users will be notified of any material changes to the terms via in-app notification
    or registered email. Such changes will typically take effect 30 days after the
    notice is issued, unless required by regulatory mandates from the RBI or NPCI.


    **User Obligations**

    - **Funding**: Users are responsible for ensuring sufficient funds are available
    in the linked account to avoid payment failures.

    - **Mandate Accuracy**: Users must ensure the details provided during the creation
    of a **Mandate** are accurate to prevent misrouted payments.


    **Termination of Service**

    Either party may terminate a specific autopay mandate at any time. PaySetu may
    suspend **Bill Autopay** functionality if the account fails to meet **Full-KYC**
    requirements or if fraudulent activity is detected.


    **Dispute Resolution**

    All disputes regarding automated debits are handled under our ''fair-and-fast''
    philosophy, adhering to RBI''s harmonised TAT. Escalations follow a tiered path:
    First-level digital support $\rightarrow$ Grievance Redressal Officer $\rightarrow$
    RBI Integrated Ombudsman Scheme.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
