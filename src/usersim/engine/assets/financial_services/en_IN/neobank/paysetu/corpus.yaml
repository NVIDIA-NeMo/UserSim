- id: ff062600-8f85-5d39-9de2-c8c464eeebc7
  title: PaySetu Prepaid Forex Card — resolve a common request end-to-end
  body: 'One of the most common requests is loading funds onto the <b>PaySetu Prepaid
    Forex Card</b> to prepare for a trip. Here is the end-to-end process to resolve
    this request.


    **Prerequisites:**

    - An active <b>PaySetu Prepaid Forex Card</b>.

    - Sufficient funds in your linked PaySetu account or wallet.

    - <b>Full-KYC</b> completion for higher loading limits.


    **Steps to reload your card:**

    1. **Specify Reload Amount:** Tell us the exact amount of money you wish to load
    onto your card and specify the target currency (e.g., USD, EUR, GBP).

    2. **Confirm Fee Acknowledgement:** We will inform you that a reload fee of ₹100
    will be applied to this transaction. Confirm that you accept this charge to proceed.

    3. **Authorise the Transfer:** Tell us to proceed with the debit from your linked
    account. We will use the appropriate <b>Payment Rail</b> (such as UPI or IMPS)
    to move the funds.

    4. **Verify the Load:** Once the process is complete, we will confirm the total
    amount debited (Amount + ₹100 reload fee) and the final balance now available
    on your <b>PaySetu Prepaid Forex Card</b> in the chosen currency.


    **How you know it worked:**

    - You will receive a confirmation message with the transaction ID.

    - Your available card balance will reflect the new funds immediately.

    - Your transaction history will show the debit for the load amount and the separate
    ₹100 reload fee.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: cards
