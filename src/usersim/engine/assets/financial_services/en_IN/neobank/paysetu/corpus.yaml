- id: 7f7d5078-4e84-5b67-ab49-aa149cb6f66a
  title: PaySetu Wallet & UPI — an unexpected charge or amount
  body: '**Symptom:** You notice a transaction in your history that you do not recognise,
    or the amount debited is different from what you expected.


    **Likely Causes**

    * **Pending Merchant Settlement:** Some merchants may hold a temporary authorisation
    amount.

    * **Failed Transaction Lag:** A transaction may have failed at the payment rail,
    but the balance has not yet been restored.

    * **Unauthorized Activity:** A third party may have gained access to your credentials.


    **What to check in order**

    1. **Transaction Status:** Check if the transaction is marked as ''Pending'' or
    ''Failed''.

    2. **Merchant Receipt:** Compare the PaySetu transaction amount with the merchant''s
    final invoice.

    3. **Account History:** Review your recent activity for any other unfamiliar debits.


    **The Fix**

    * **For Failed Transactions:** If the transaction failed but money was debited,
    we adhere to the RBI''s harmonised TAT. These funds are typically restored within
    5 days.

    * **For Amount Discrepancies:** Provide us with the merchant receipt. We will
    initiate a reconciliation process with the payment rail.

    * **For Unauthorized Charges:** Immediately tell us to freeze your UPI access.
    We will then route the issue through the formal reporting and chargeback path
    to limit your liability.


    **When to Escalate**

    If the funds are not restored after 5 days for a failed transaction, or if the
    merchant reconciliation is unsuccessful, we will raise a formal dispute case.
    You will receive a unique dispute ID and regular updates until the resolution
    is reached.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
