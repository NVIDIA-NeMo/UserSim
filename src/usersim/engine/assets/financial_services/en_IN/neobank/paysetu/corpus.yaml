- id: b49ada27-ea4b-5f7f-a884-e175a3560d64
  title: PaySetu Digital Savings — fraud and unauthorized-activity protection
  body: "At PaySetu, we treat compliance and security as your primary layer of protection.\
    \ Your <b>PaySetu Digital Savings</b> account is built on a strict 'verify-before-action'\
    \ framework to ensure your funds remain secure.\n\n**Common Fraud Patterns**\n\
    Digital savings accounts are often targeted by 'social engineering' scams. Be\
    \ wary of messages claiming your account is blocked or that you have won a lottery,\
    \ requesting a 'verification fee' or your account credentials to unlock a prize.\
    \ Another common tactic involves fraudsters posing as PaySetu employees to 'help'\
    \ you complete your <b>Full-KYC</b> process.\n\n**Our Absolute Zero-Tolerance\
    \ Policy**\nTo protect your wealth, PaySetu agents will **never** request the\
    \ following sensitive credentials:\n- Your UPI PIN\n- One-Time Passwords (OTPs)\n\
    - Your Debit Card CVV\n- Your account passwords\n\nIf anyone asking to be from\
    \ PaySetu requests these, it is a fraud attempt. Terminate the communication immediately.\n\
    \n**What to do if you suspect fraud**\nIf you notice an unauthorised transaction\
    \ or suspect your credentials have been compromised, notify us immediately via\
    \ our in-app chat. We follow a 'fair-and-fast' philosophy; suspected fraud is\
    \ immediately routed through our formal reporting and chargeback path to limit\
    \ your personal liability. \n\n**Safety Guarantee**\nFor your peace of mind, all\
    \ retail deposits in your <b>PaySetu Digital Savings</b> account are secure and\
    \ insured by the DICGC up to ₹5,00,000 per depositor.\n\n*Disclaimer: PaySetu\
    \ provides financial literacy and product education, not individualised tax, legal,\
    \ or investment advice.*"
  domain: retail_banking
  product_category: digital_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: bb98a8c0-20e6-53c4-baa6-a0a39011a8d7
  title: PaySetu Digital Savings — account agreement
  body: 'This account agreement governs the relationship between PaySetu and the customer
    regarding the <b>PaySetu Digital Savings</b> product.


    **1. Account Maintenance and Balance**

    PaySetu maintains a lean pricing model. The <b>PaySetu Digital Savings</b> account
    requires a minimum balance of ₹0. No penalties are levied for maintaining a zero
    balance, ensuring a zero-barrier entry to your digital banking experience.


    **2. Interest Accrual**

    Funds held in the account earn a savings interest rate of 3.5%. Interest is calculated
    on the daily balance and credited to the account according to our internal payout
    cycle. PaySetu reserves the right to modify this rate based on RBI guidelines
    or market conditions, provided notice is given to the customer.


    **3. Verification Obligations**

    To access full banking features and higher limits, customers must complete the
    <b>Full-KYC</b> process. Users are obligated to provide valid PAN and Aadhaar
    verification. All <b>Full-KYC</b> completion days must be finalized within 30
    days of account opening to avoid account restrictions or downgrades to <b>Minimum-KYC</b>
    status.


    **4. Termination and Closure**

    Customers may request to close their account at any time. Upon closure, all remaining
    balances, including accrued interest, will be transferred to a nominated external
    account via the preferred <b>Payment Rail</b> (UPI, IMPS, or NEFT).


    **5. Liability and Insurance**

    Retail deposits are insured by the DICGC up to ₹5,00,000 per depositor. PaySetu
    adheres to RBI''s harmonised turn-around-time (TAT) for all failed transactions
    and refunds.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 20f68f36-220b-552d-8255-7c2677d2c2f6
  title: PaySetu Digital Savings — who it is best for and common use cases
  body: '<b>PaySetu Digital Savings</b> is the secure, interest-bearing foundation
    for your digital wealth. It is designed specifically for tech-savvy millennials
    and Gen Z users who want their money to work for them without the friction of
    traditional banking.


    **Who is this best for?**

    - **The Digital Native:** If you prefer managing your entire financial life via
    a smartphone and despise visiting physical branches.

    - **The Low-Barrier Starter:** Individuals who want a savings account without
    the stress of maintaining a high average balance.

    - **The UPI Power-User:** Those who need a stable, interest-earning base to fund
    their high-velocity daily spends.


    **Common Use Cases**

    - **Emergency Fund Hub:** Store your ''rainy day'' money where it earns a savings
    interest rate of 3.5% while remaining liquid.

    - **UPI Funding Source:** Use this account as the primary anchor for your <b>upi_wallet</b>,
    moving money seamlessly across <b>Payment Rails</b>.

    - **Automated Savings:** Pair this account with <b>bill_autopay</b> to ensure
    your monthly obligations are met while the remainder earns interest.


    **Core Product Specifications**

    - **Minimum Balance:** ₹0 (No monthly average balance requirements).

    - **Annual Interest Rate:** 3.5%.

    - **KYC Timeline:** <b>Full-KYC</b> completion days must be within 30 days to
    maintain full feature access.

    - **Deposit Insurance:** Insured by DICGC up to ₹5,00,000 per depositor.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: product_sheet
  source_authority: official
