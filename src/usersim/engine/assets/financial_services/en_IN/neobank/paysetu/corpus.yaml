- id: be9b02c5-a936-5b6a-8b88-49827b28e5bf
  title: PaySetu Wallet & UPI — regulatory disclosures
  body: 'This document provides formal regulatory disclosures for **PaySetu Wallet
    & UPI**. PaySetu operates strictly within the frameworks established by the Reserve
    Bank of India (RBI) and the National Payments Corporation of India (NPCI).


    **KYC and Balance Limits:**

    In compliance with PPI (Prepaid Payment Instrument) guidelines, accounts are tiered
    based on verification. **Minimum-KYC** accounts are restricted to a wallet balance
    cap of ₹10000. Accounts that have completed **Full-KYC** are permitted a wallet
    balance cap of ₹200000. These limits are mandated to ensure customer protection
    and systemic security.


    **Transaction Limits:**

    UPI transactions are subject to a UPI per transaction limit of ₹100000. These
    limits may be further modified by NPCI or the underlying **Payment Rail** providers
    without prior notice.


    **Fund Security:**

    All retail deposits held within the PaySetu ecosystem are secure and insured by
    the Deposit Insurance and Credit Guarantee Corporation (DICGC) up to ₹5,00,000
    per depositor.


    **Refunds and TAT:**

    PaySetu adheres to the RBI''s harmonised turn-around-time (TAT) for failed transactions.
    The established failed refund turnaround days for this product is 5 days.


    **Standard of Care:**

    PaySetu provides financial literacy and product education. It does not provide
    individualised tax, legal, or investment advice. Customers are encouraged to review
    all terms before onboarding to ensure product suitability.


    *Disclaimer: Compliance is framed as customer protection. All operations are subject
    to RBI and NPCI audits.*'
  domain: payments
  product_category: upi_wallet
  document_type: disclosure
  source_authority: official
