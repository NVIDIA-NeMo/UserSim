  body: "This Account Agreement governs the use of **PaySetu Wallet & UPI**. By activating\
    \ this product, you agree to the following terms:\n\n**1. Balance Limits and KYC\
    \ Obligations**\nYour wallet balance is subject to your verification tier. Users\
    \ with **Minimum-KYC** are restricted to a wallet balance cap of ₹10,000. Upon\
    \ completion of **Full-KYC** (PAN/Aadhaar verification), this cap is increased\
    \ to ₹200,000. It is the user's responsibility to maintain valid KYC status to\
    \ avoid service restrictions.\n\n**2. Transaction Limits**\nTo mitigate risk,\
    \ a per-transaction limit of ₹100,000 applies to all UPI transfers. Any attempt\
    \ to exceed this amount in a single transaction will be declined by the payment\
    \ rail.\n\n**3. Fund Movement and Refunds**\nPaySetu adheres to RBI guidelines\
    \ for failed transactions. In the event of a failed payment where funds are debited,\
    \ the refund will be processed according to the harmonised TAT, with a target\
    \ turnaround of 5 days.\n\n**4. Obligations and Liability**\nUsers are solely\
    \ responsible for maintaining the confidentiality of their UPI PIN and device\
    \ security. PaySetu is not liable for losses resulting from the voluntary disclosure\
    \ of PINs or OTPs to third parties.\n\n**5. Termination and Changes**\nPaySetu\
    \ reserves the right to modify these terms or the applicable limits with prior\
    \ notice. Users may close their wallet at any time, provided all outstanding balances\
    \ are settled or withdrawn. \n\n*Disclaimer: PaySetu provides financial literacy\
    \ and product education, not individualised tax, legal, or investment advice.*"
  domain: payments
