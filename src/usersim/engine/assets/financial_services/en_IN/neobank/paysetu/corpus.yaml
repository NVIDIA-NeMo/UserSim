- id: 026b809c-35d8-557a-b83a-406218323d0a
  title: PaySetu Wallet & UPI — a failed or pending action
  body: '**Symptom:** A UPI payment is showing as ''Pending'' or has ''Failed'', but
    funds have been debited from the wallet.


    **Likely Causes:**

    - Temporary disruption in the UPI **Payment Rail** (NPCI/Bank servers).

    - Transaction exceeding the UPI per transaction limit of ₹100000.

    - Insufficient balance in the wallet relative to the transaction amount.


    **What to check in order:**

    1. **Transaction Limit:** Ensure the amount does not exceed ₹100000.

    2. **Balance:** Check if your current balance is within your KYC tier cap (₹10000
    for **Minimum-KYC** or ₹200000 for **Full-KYC**).

    3. **Network Status:** Check for any known outages in the UPI ecosystem.


    **The Fix:**

    - If the transaction failed and funds were debited, most cases resolve automatically.
    We adhere to RBI''s harmonised turn-around-time (TAT). For failed transactions,
    the refund is processed within a failed refund turnaround days of 5 days.


    **When to Escalate:**

    - If the funds are not credited back after 5 days, tell us the transaction ID.
    We will raise a formal dispute case. You will receive a tracking number and a
    resolution update via in-app chat or email. If unresolved, the case is routed
    to our Grievance Redressal Officer.


    *Disclaimer: PaySetu follows a ''fair-and-fast'' philosophy for all refunds.*'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
