- id: 1f93ec5a-902d-5475-bc1b-3781da04f8a1
  title: PaySetu Prepaid Forex Card — limits, restrictions, and edge cases
  body: 'This document provides support agents with the necessary technical parameters
    and restrictions for the <b>PaySetu Prepaid Forex Card</b> to assist customers
    accurately.


    **Operational Limits & Costs:**

    - **Issuance:** Every new card carries a one-time issuance fee of ₹150.

    - **Funding:** Each reload of the card incurs a reload fee of ₹100.

    - **Currency Conversion:** Transactions made in a currency other than the one
    loaded on the card are subject to a cross currency markup of 2%.

    - **Cash Access:** ATM withdrawals made abroad are subject to an ATM withdrawal
    fee abroad of ₹200 per transaction.


    **Restrictions & Edge Cases:**

    - **KYC Dependencies:** Full functionality of the card, including higher loading
    limits, is dependent on the customer achieving <b>Full-KYC</b> status (PAN/Aadhaar
    verification). Customers with <b>Minimum-KYC</b> will face significantly lower
    balance caps.

    - **Payment Rails:** The card operates on a prepaid infrastructure; ensure the
    customer understands that funds must be loaded via our supported <b>Payment Rail</b>
    (e.g., UPI, IMPS) before the card can be used abroad.

    - **Zero-Balance State:** If the card balance reaches zero, the card remains active,
    but the customer must pay the reload fee of ₹100 to add further funds.

    - **International Block:** Cards can be frozen via the app. If a customer reports
    a ''declined'' transaction despite having a sufficient balance, verify if a security
    freeze is active.


    **Compliance Note:** All retail deposits are secure and insured by the DICGC up
    to ₹5,00,000 per depositor.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
