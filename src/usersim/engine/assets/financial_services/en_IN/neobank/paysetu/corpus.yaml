- id: b6ee994b-24e0-5e60-bc29-6432342cc645
  title: PaySetu Digital Savings — minimum balance explained
  body: '**Do I need to keep a certain amount of money in my PaySetu Digital Savings
    account to avoid fees?**

    No. PaySetu maintains a lean pricing model. The **minimum balance** for this account
    is ₹0. You can maintain any balance from zero upwards without incurring any non-maintenance
    charges.


    **Will my account be closed if the balance hits ₹0?**

    No, your account remains active even with a ₹0 balance. However, to ensure you
    have access to all high-value features, we recommend completing your **Full-KYC**
    within 30 days of opening.


    **Are there any other hidden costs for maintaining the account?**

    Core banking is free. Fees are only applied to recover direct costs for specialised
    services. For a complete list of potential charges, please refer to PaySetu Digital
    Savings — fee schedule.'
  domain: retail_banking
  product_category: digital_savings
