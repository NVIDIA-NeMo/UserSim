- id: 988a0a7d-be54-5e87-92f5-705d5f8001b2
  title: PaySetu Prepaid Forex Card — an unexpected charge or amount
  body: '**Symptom**: You notice a transaction amount on your statement that is higher
    than the price listed at the merchant, or you see an unfamiliar fee.


    **Likely Causes**

    1. **Cross Currency Markup**: If you spent in a currency different from the one
    loaded on your card, a **cross currency markup of 2%** was applied.

    2. **ATM Fees**: If you withdrew cash abroad, a flat **atm withdrawal fee abroad
    of ₹200** was charged.

    3. **Reloading Costs**: If you recently added funds, a **reload fee of ₹100**
    was deducted.

    4. **Merchant/Network Fees**: Some foreign ATMs or merchants apply their own independent
    surcharges which are outside of PaySetu''s control.


    **What to Check**

    * Verify if the transaction was in the primary card currency. If not, the 2% markup
    is expected.

    * Check if the transaction was an ATM withdrawal. If yes, the ₹200 fee is standard.

    * Review the transaction date to see if it aligns with a recent fund top-up (₹100
    fee).


    **The Fix**

    If the charge does not align with the above (e.g., you were charged for an ATM
    withdrawal but didn''t use one), tell us the specific transaction ID. We will
    investigate the **Payment Rail** logs.


    **Escalation Path**

    If we cannot resolve the discrepancy immediately, we will raise a formal dispute
    case. We follow the RBI''s harmonised TAT for refunds. You will receive a case
    ID and status updates via in-app chat.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
