- id: c1a0a48a-e948-5a26-8b32-b6db9680aa6c
  title: PaySetu Wallet & UPI — min kyc wallet balance cap explained
  body: '**What is the balance limit for a Minimum-KYC account?**

    If you have completed only the basic verification tier, your **PaySetu Wallet
    & UPI** account has a wallet balance cap of ₹10000. This allows you to get started
    quickly with limited wallet functionality.


    **How can I increase my wallet balance limit?**

    To move beyond the ₹10000 limit, you must complete **Full-KYC**. Once verified
    with your PAN and Aadhaar, your wallet balance cap increases to ₹200000.


    **Does the Minimum-KYC limit affect my UPI transaction limit?**

    No, the wallet balance cap refers to the total amount you can hold in the wallet.
    The UPI per transaction limit remains ₹100000, provided you have sufficient funds
    available.


    For more details on requirements, please refer to PaySetu Wallet & UPI — eligibility
    requirements.'
