- id: f7dfdf5a-0cb1-52d2-aef9-a65eafb21c7b
  title: PaySetu Prepaid Forex Card — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting customers who notice a difference
    between their expected spend and the actual debits on their <b>PaySetu Prepaid
    Forex Card</b> statement.


    **Symptom:**

    Customer claims they were ''overcharged'' or that a transaction amount does not
    match the merchant''s receipt.


    **Investigation Path:**

    1. **Check for Currency Markup:** Determine if the transaction was made in a currency
    different from the one loaded on the card. If so, explain that a cross currency
    markup of 2% was applied to the exchange rate.

    2. **Check for ATM Fees:** If the discrepancy occurs during a cash withdrawal,
    verify if the customer accounted for the ATM withdrawal fee abroad of ₹200. Clarify
    that this is a PaySetu fee and is separate from any fees charged by the foreign
    ATM owner.

    3. **Verify Reload Charges:** If the balance is lower than the ''loaded'' amount,
    confirm if the reload fee of ₹100 was deducted at the time of funding.

    4. **Identify Pending Authorisations:** Check for ''holds'' or pending authorisations
    (common in hotels or car rentals) that may temporarily reduce the available balance
    without being a final charge.


    **The Fix:**

    - **If the charge is valid:** Provide the customer with a detailed breakdown showing
    the Base Amount + Markup/Fee = Total Debit.

    - **If the charge is an error:** If the 2% markup was applied incorrectly or a
    fee was double-charged, we will initiate a correction to credit the difference
    back to the card.


    **When to escalate:**

    If the customer disputes a transaction they did not authorise, this must be immediately
    routed through the formal reporting and chargeback path. We follow the RBI''s
    harmonised turn-around-time (TAT) for such disputes to ensure a fair-and-fast
    resolution.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: cards
  product_category: prepaid_forex_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: fa19214f-0954-5469-906c-117999a3ead3
  title: Bill Autopay — overview
  body: "Welcome to **Bill Autopay**, the 'set-it-and-forget-it' utility for automated\
    \ recurring payments. Designed for the digital-native user, Bill Autopay removes\
    \ the friction of manual monthly transfers, ensuring your utilities, subscriptions,\
    \ and bills are settled on time, every time.\n\nBy setting up a **Mandate**, you\
    \ authorise PaySetu to handle your recurring debits through a secure **Payment\
    \ Rail**. This system is built to give you complete control while automating the\
    \ mundane. To ensure transparency and prevent surprises, we provide a **pre-debit\
    \ notification 24 hours** before any funds are moved from your account.\n\n**Key\
    \ Limits and Costs**\nTo keep your account secure, we have implemented a specific\
    \ threshold for automated payments. For transactions that do not require Additional\
    \ Factor Authentication (AFA), there is a **mandate cap of ₹15000**. Payments\
    \ exceeding this amount will require further verification to protect your funds.\n\
    \nIn line with our lean pricing model, core banking and the setup of autopay are\
    \ free. However, to recover direct costs for specialised convenience, a **late\
    \ bill convenience fee of ₹20** is applied if a payment is processed after the\
    \ due date due to specific service requests. \n\n**Security and Protection**\n\
    Your experience is governed by a strict 'verify-before-action' stance. All setups\
    \ require multi-factor authentication. Furthermore, as part of our commitment\
    \ to customer protection, all retail deposits held with us are secure and insured\
    \ by the DICGC up to ₹5,00,000 per depositor.\n\n*Disclaimer: PaySetu provides\
    \ financial literacy and product education, not individualised tax, legal, or\
    \ investment advice.*"
  domain: payments
  product_category: bill_autopay
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: a01c93e7-f13d-53e7-8215-2b83b4dc8df8
  title: Bill Autopay — mandate cap without afa explained
  body: '**What is the mandate cap without AFA?**

    For your security, PaySetu limits the amount that can be automatically debited
    without requiring an additional layer of authentication (such as a PIN or OTP).
    The **mandate cap without AFA is ₹15000**. Any recurring bill that exceeds this
    amount will trigger a request for Additional Factor Authentication to ensure the
    transaction is authorised by you.


    **Does this limit apply to every single bill?**

    Yes, this is a security ceiling for any single transaction processed under a mandate
    where AFA is not explicitly invoked. If your bill is below ₹15000, it will process
    seamlessly as per your mandate instructions.


    **Can I increase this limit?**

    These limits are set in adherence to NPCI and RBI frameworks to protect customers
    from unauthorised large-value debits. For bills above this threshold, the system
    will simply prompt you for verification at the time of payment.


    For more details on costs, please refer to Bill Autopay — fee schedule.'
  domain: payments
  product_category: bill_autopay
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 74d13354-6336-5980-9519-f0c191be3dcb
  title: Bill Autopay — set up and activate
  body: 'Setting up your **Bill Autopay** is a seamless process that ensures you never
    miss a payment deadline. Follow these steps to activate your automated payments:


    **Prerequisites**

    Before you begin, ensure you have the biller''s unique identifier (such as a Customer
    ID or Account Number) and that your PaySetu account has completed **Minimum-KYC**
    or **Full-KYC** to support the required payment rails.


    **Step-by-Step Activation**

    1. **Provide Biller Details**: Tell us which biller you wish to automate and provide
    the necessary account identifier. We will verify the biller''s validity through
    our integrated system.

    2. **Define the Mandate**: Specify the maximum amount you are comfortable authorising
    for this recurring payment. Note that for amounts up to **₹15000**, payments can
    proceed without Additional Factor Authentication (AFA).

    3. **Authorise the Mandate**: You will be prompted to provide multi-factor authentication
    (such as your UPI PIN) to electronically sign the **Mandate**. This is a one-time
    action that authorises future debits.

    4. **Confirmation**: Once authorised, we will provide a confirmation message and
    a unique mandate reference number. You will now receive a notification **24 hours**
    before every scheduled debit.


    **How you know it worked**

    You will see the active mandate listed in your ''Scheduled Payments'' section.
    Your first automated payment will occur on the next billing date specified by
    the biller, provided there are sufficient funds in your account.'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
