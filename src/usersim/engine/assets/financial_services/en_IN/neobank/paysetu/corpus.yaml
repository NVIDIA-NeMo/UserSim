- id: 32ec4710-9e31-5a1c-a1b2-89815ab2316b
  title: dispute_status tool reference
  body: 'The `dispute_status` tool allows agents to retrieve the current progress
    and resolution state of a customer''s reported transaction error or fraud claim.
    This tool provides real-time visibility into the ''fair-and-fast'' resolution
    pipeline, ensuring adherence to RBI''s harmonised turn-around-time (TAT) for failed
    transactions and refunds.


    **Tool Signature**

    - **Function Name**: `dispute_status`

    - **Parameters**: Requires a unique dispute reference ID or the associated transaction
    ID.

    - **Effect**: Returns the current status (e.g., Pending, Under Review, Resolved),
    the expected resolution date, and any internal notes regarding the chargeback
    process.


    **Agent Execution**

    Agents perform this action by calling the tool directly within the chat or email
    interface. Agents must not direct customers to external portals to check their
    status; the agent is responsible for retrieving this information and communicating
    it clearly to the user. For guidance on when to trigger this lookup, refer to
    When to use dispute_status.'
