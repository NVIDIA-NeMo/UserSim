- id: c6bd276f-eb26-5f6e-bdf2-8adad1398ca1
  title: Bill Autopay — choosing between tiers or options
  body: 'When deciding how to manage your recurring payments, the choice usually comes
    down to whether you prefer manual control or the seamless nature of **Bill Autopay**.


    **Manual Payments vs. Bill Autopay**

    - **Control**: Manual payments give you a per-transaction decision, whereas **Bill
    Autopay** uses a **Mandate** for a ''set-it-and-forget-it'' experience.

    - **Friction**: Manual payments require a UPI PIN for every single bill. **Bill
    Autopay** allows payments up to the **mandate cap without AFA** of ₹15,000 to
    occur automatically without repeated PIN entry.

    - **Cost**: Both are core banking features and are free. However, manual payments
    risk late fees from the biller, while **Bill Autopay** ensures timeliness, though
    a **late bill convenience fee** of ₹20 may apply in specific recovery scenarios.

    - **Visibility**: **Bill Autopay** provides a guaranteed pre-debit notification
    **24 hours** before the transaction.


    **Who it suits**

    - **Manual Payments**: Suit users who have highly variable bill amounts and prefer
    to review every single rupee before it leaves their account.

    - **Bill Autopay**: Suits tech-savvy millennials and Gen Z who value time and
    want a frictionless, automated ecosystem for their utilities.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
