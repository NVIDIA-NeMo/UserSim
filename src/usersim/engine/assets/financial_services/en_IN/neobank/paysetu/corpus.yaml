- id: ab7f4d1e-fec4-5026-9c36-cf1be5c2186e
  title: PaySetu Wallet & UPI — failed refund turnaround days explained
  body: '**What happens if my UPI payment fails but the money is deducted from my
    account?**

    Don''t worry. We follow a ''fair-and-fast'' philosophy. If a transaction fails,
    the refund process is initiated automatically. The failed refund turnaround days
    is 5 days, adhering to the RBI''s harmonised TAT for failed transactions.


    **Do I need to do anything to get my refund?**

    In most cases, no. The system detects the failure and routes the refund back to
    your source account. However, if you don''t see the credit after 5 days, please
    reach out to us with the transaction ID.


    **Where can I track the status of my failed payment?**

    You can view the real-time status of all your transactions in the app. For more
    details on how to do this, see PaySetu Wallet & UPI — check status or history.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
