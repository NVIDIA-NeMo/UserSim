- id: 491e70a8-d6e5-5d1a-a6dc-ab77b98d6d58
  title: PaySetu Digital Savings — a failed or pending action
  body: '**Symptom**: You attempted to fund your account or upgrade your KYC status,
    but the action is showing as ''Pending'' or ''Failed''.


    **Likely Causes**:

    1.  **Payment Rail Delay**: Issues with the underlying **Payment Rail** (UPI,
    IMPS, NEFT) used to move the money.

    2.  **KYC Documentation Mismatch**: Data provided during the **Full-KYC** process
    does not match government records.

    3.  **Authentication Timeout**: The multi-factor authentication session expired
    before completion.


    **What to check in order**:

    1.  **Check Transaction Status**: If it was a fund transfer, check if the money
    was debited from the source account. If debited but not credited, wait for the
    RBI-mandated turn-around-time (TAT).

    2.  **Verify KYC Details**: Ensure your PAN and Aadhaar are active and the details
    provided are current.

    3.  **Network Stability**: Ensure you have a stable internet connection and retry
    the action once.


    **The Fix**:

    *   For funding failures: If the transaction remains pending beyond the standard
    TAT, tell us the transaction ID. We will track the fund movement via the **Payment
    Rail** and resolve the credit.

    *   For KYC failures: Provide the corrected document or clear photograph of your
    ID. We will re-trigger the verification process.


    **When we escalate**:

    If the issue is not resolved after a retry, we will raise a formal case with our
    backend operations team. You will receive an update via in-app chat within 24-48
    hours. If the issue pertains to a failed transaction, we follow a ''fair-and-fast''
    philosophy to ensure refunds are processed per RBI timelines.'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
