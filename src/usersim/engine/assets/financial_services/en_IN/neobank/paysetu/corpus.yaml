- id: dfa04606-6811-5b66-b13a-6fb457f10343
  title: PaySetu Prepaid Forex Card — a failed or pending action
  body: '**Symptom**: You attempted a transaction or a reload on your **PaySetu Prepaid
    Forex Card**, but the action is showing as ''Failed'' or ''Pending''.


    **Likely Causes**

    - **Insufficient Funds**: The transaction amount, plus applicable fees (such as
    the ₹100 reload fee or 2% cross currency markup), exceeds your current balance.

    - **KYC Limitations**: Your account may have reverted to a limited state if documentation
    requires updating.

    - **Payment Rail Delay**: A temporary lag in the underlying infrastructure (UPI,
    IMPS, NEFT) used to move funds.

    - **Security Block**: The transaction was flagged by our ''verify-before-action''
    security protocol.


    **Steps to Resolve**

    1. **Check Balance**: Verify that you have enough funds to cover both the transaction
    and the associated fees (e.g., ensure an extra ₹200 is available for international
    ATM withdrawals).

    2. **Verify KYC Status**: Confirm that your **Full-KYC** status is still active
    and valid.

    3. **Review Transaction History**: Check if the amount has been debited despite
    the ''failed'' status.


    **Resolution and Escalation**

    If the funds were debited but the action failed, tell us the transaction details.
    We follow a ''fair-and-fast'' philosophy adhering to RBI''s harmonised turn-around-time
    (TAT) for refunds. If we cannot resolve the issue immediately, we will raise a
    formal case for you. You will receive a case reference number and an estimated
    resolution date via email.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
