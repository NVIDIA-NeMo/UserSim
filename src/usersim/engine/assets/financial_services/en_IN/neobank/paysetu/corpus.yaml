- id: e8611a49-5020-5a00-a150-07cbe2a2e075
  title: PaySetu Digital Savings — access or login problems
  body: '**Symptom:** You are unable to log into your **PaySetu Digital Savings**
    account or are receiving ''Access Denied'' messages.


    **Likely Causes**

    - Incorrect credentials or expired session tokens.

    - Device mismatch triggering security blocks.

    - Account restriction due to incomplete **Full-KYC** (exceeding the **30 days**
    limit).

    - Network connectivity issues with the **Payment Rail** infrastructure.


    **What to check (in order)**

    1. **Credentials:** Double-check your login ID. Ensure you are not using an outdated
    password.

    2. **App Version:** Ensure your PaySetu app is updated to the latest version to
    avoid compatibility bugs.

    3. **KYC Status:** Check if you received a notification regarding the expiration
    of your **full-KYC completion days**. If you haven''t completed verification within
    **30 days**, your access may be limited.

    4. **Connectivity:** Switch between Wi-Fi and mobile data to rule out local network
    failures.


    **The Fix**

    - **For Password Issues:** Ask us to initiate a password reset. We will verify
    your identity via MFA and guide you through creating a new secure password.

    - **For KYC Blocks:** If your account is restricted due to the **30 days** window,
    provide your PAN/Aadhaar details to us now. We will start the verification process
    and notify you once access is restored.

    - **For Technical Glitches:** Tell us the exact error code displayed. We will
    refresh your session on the backend and ask you to attempt a fresh login.


    **When to Escalate**

    If login issues persist after these steps, we will raise a high-priority technical
    ticket with our engineering team. You will receive a ticket number and a status
    update via email within 24 hours IST.


    *Disclaimer: PaySetu agents will never ask for your UPI PIN or OTP to help you
    log in.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: d4975c5e-0ad8-5b36-b2a7-8613bdfd2ace
  title: PaySetu Digital Savings — qualification tiers
  body: 'This matrix defines the account tiers for **PaySetu Digital Savings** based
    on verification levels.


    | Verification Level | Requirement | Account Status | Key Limit/Feature |

    | :--- | :--- | :--- | :--- |

    | **Minimum-KYC** | Basic identity check | Limited | Lower balance caps; limited
