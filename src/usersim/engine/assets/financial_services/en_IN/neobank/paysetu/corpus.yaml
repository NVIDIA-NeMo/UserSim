- id: 39fa1838-9b54-5f26-9b7c-f56a36371d52
  title: PaySetu Digital Savings — a discrepancy in your records or statement
  body: '**Symptom:** A customer reports that their balance does not match their expected
    calculations, or they believe an interest credit is missing from their statement.


    **Likely Causes**

    1. **Interest Calculation Gap:** The customer may be expecting a flat monthly
    payout, whereas the 3.5% savings interest rate is calculated on the daily balance.

    2. **Pending Transactions:** A transaction may have been authorised but not yet
    settled on the payment rail (UPI, IMPS, NEFT).

    3. **KYC-related Holds:** If the account is Minimum-KYC and has hit a balance
    cap, some incoming funds may be held.


    **Resolution Steps**

    1. **Verify Balance Calculation:** Ask the customer for the specific date and
    amount they believe is missing. Review the daily balance to explain how the 3.5%
    interest was applied.

    2. **Check Payment Rail Status:** Check if there are any ''Pending'' or ''Processing''
    flags on the transaction in question. Explain that we adhere to the RBI''s harmonised
    turn-around-time (TAT) for all failed or delayed transactions.

    3. **Review KYC Tier:** Confirm if the user is Full-KYC. If they are Minimum-KYC,
    check if they have exceeded the tier-specific balance caps.


    **When to Escalate**

    If the discrepancy persists after reviewing the daily interest and payment rail
    status, tell the customer we are raising a formal dispute case.


    **What happens next:**

    * We will route the discrepancy to our internal accounting and reconciliation
    team.

    * The case will be tracked through our ''fair-and-fast'' dispute philosophy.

    * The customer will receive a written resolution or a correction credit via in-app
    chat or email once the audit is complete.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
