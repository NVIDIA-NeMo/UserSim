- id: e0172fc0-1272-5a6d-956f-79693f7317c5
  title: PaySetu Wallet & UPI — account security best practices
  body: 'Keeping your digital wealth secure is our priority. As a user of **PaySetu
    Wallet & UPI**, it is essential to follow these security protocols to protect
    your funds and identity.


    **The Golden Rule of Verification**

    PaySetu operates on a strict ''verify-before-action'' stance. While we use multi-factor
    authentication to keep you safe, please remember that **PaySetu agents will NEVER
    ask you for the following sensitive credentials**:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * CVV numbers of linked cards

    * Your full account passwords


    **Common Threat Patterns**

    Be vigilant against ''Request Money'' scams. Fraudsters often send a UPI collect
    request claiming you have won a prize or are receiving a refund. Remember: **you
    do not need to enter your UPI PIN to receive money**. If you are asked for a PIN
    to ''claim'' a payment, it is a fraud attempt.


    **Best Practices for Daily Use**

    1. **Secure Your Device**: Ensure your smartphone has a strong biometric lock
    or PIN.

    2. **Verify the Receiver**: Always double-check the name of the recipient on the
    confirmation screen before entering your UPI PIN.

    3. **Monitor Transactions**: Regularly review your transaction history for any
    unauthorised activity.


    **What to do if something looks wrong**

    If you notice an unauthorised transaction or suspect your account has been compromised,
    notify us immediately. Suspected fraud is routed through our formal reporting
    and chargeback path to limit your liability. To ensure the fastest resolution,
    report the incident within 24 hours of discovery.


    For further details on how we protect your account, you may refer to PaySetu Wallet
    & UPI — fraud and unauthorized-activity protection.


    *Disclaimer: PaySetu is not liable for losses resulting from the voluntary disclosure
    of sensitive credentials to third parties.*'
  domain: payments
  product_category: upi_wallet
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: c6bc28bb-4d1c-51c0-b884-e37cd9ccc01a
  title: PaySetu Wallet & UPI — change-of-terms policy
  body: "This policy outlines how PaySetu manages amendments to the terms governing\
    \ **PaySetu Wallet & UPI**. By using our services, you agree to be bound by these\
    \ terms, which are designed to ensure a transparent and compliant banking experience.\n\
    \n**Right to Amend**\nPaySetu reserves the right to modify the terms of service,\
    \ including fee structures, balance caps, and transaction limits, to align with\
    \ RBI and NPCI frameworks. \n\n**Notification Period**\nWe will provide notice\
    \ of any material changes—such as an adjustment to the **Minimum-KYC** wallet\
    \ balance cap of ₹10000 or the **Full-KYC** wallet balance cap of ₹200000—via\
    \ in-app notification and registered email. For most changes, a notice period\
    \ of 30 days will be provided before the new terms take effect.\n\n**Acceptance\
    \ of Terms**\nContinued use of the **PaySetu Wallet & UPI** features after the\
    \ effective date of the change constitutes your deemed acceptance of the revised\
    \ terms. If you do not agree to the changes, you have the right to close your\
    \ account and withdraw your remaining balance before the effective date.\n\n**Limit\
    \ Adjustments**\nPaySetu may adjust the UPI per transaction limit of ₹100000 based\
    \ on regulatory mandates or security assessments. Such changes will be communicated\
    \ clearly to all affected users.\n\n**Termination**\nEither party may terminate\
    \ this agreement at any time. Upon termination, any remaining balance in the wallet\
    \ will be refunded to the customer's verified bank account, adhering to our 'fair-and-fast'\
    \ philosophy for refunds.\n\n*Disclaimer: These terms are subject to the laws\
    \ of India and the regulations of the Reserve Bank of India.*"
