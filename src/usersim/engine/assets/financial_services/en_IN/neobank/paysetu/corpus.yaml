- id: 2797829e-aa4e-54a4-8452-0a78c6bd416f
  title: Bill Autopay — a discrepancy in your records or statement
  body: '**Symptom:** A customer reports that the amount debited via Bill Autopay
    does not match their bill, or a transaction appears twice on their statement.


    **Likely Causes:**

    - **Biller Error:** The service provider requested an incorrect amount from the
    **Payment Rail**.

    - **Duplicate Trigger:** A technical glitch caused the mandate to trigger twice
    for a single billing cycle.

    - **Processing Lag:** A payment was debited but is not yet reflecting as ''Paid''
    on the biller''s side, leading the customer to believe it failed.

    - **Applied Fees:** The customer is seeing a total that includes a late bill convenience
    fee of ₹20, which they may not have recognised.


    **What to Check (In Order):**

    1. **Transaction Detail:** Examine the specific transaction in the PaySetu history.
    Check if there are two separate debits or one larger debit.

    2. **Fee Check:** Check if the discrepancy is exactly ₹20, which would indicate
    a late bill convenience fee.

    3. **Biller Invoice:** Compare the debited amount against the actual invoice issued
    by the provider.


    **The Fix:**

    - **For Duplicate Debits:** If we confirm a duplicate charge on our end, we will
    immediately initiate the refund process following RBI''s harmonised turn-around-time
    (TAT).

    - **For Amount Mismatches:** We will provide the transaction reference number
    and the exact amount sent to the biller. The customer can then use this to contest
    the charge with the provider.

    - **For Fee Clarification:** We will explain the trigger for the ₹20 convenience
    fee and provide the date the payment was processed.


    **When to Escalate:**

    If the discrepancy is not resolved through basic verification, we will route the
    case to our Grievance Redressal Officer. The customer will be provided with a
    unique ticket ID and a timeline for the formal resolution. If unresolved, the
    customer may approach the RBI Integrated Ombudsman Scheme.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. Retail deposits are insured by the DICGC up
    to ₹5,00,000 per depositor.*'
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
