- id: fcf60775-a478-5183-ba6f-e190941e5564
  title: PaySetu Wallet & UPI — limits, restrictions, and edge cases
  body: 'This guide provides the technical boundaries for the **PaySetu Wallet & UPI**
    ecosystem. Agents should use these figures to manage customer expectations regarding
    balance caps and transaction thresholds.


    **Wallet Balance Limits**

    Balance caps are determined by the customer''s identity verification tier:

    * **Minimum-KYC**: Users are restricted to a wallet balance cap of ₹10000.

    * **Full-KYC**: Users who complete comprehensive identity verification (PAN/Aadhaar)
    can hold up to a wallet balance cap of ₹200000.


    **Transaction Boundaries**

    * **UPI Limit**: The maximum amount allowed for a single UPI transaction is ₹100000.


    **Operational Edge Cases**

    * **Failed Transactions**: In the event of a failed transaction where funds are
    debited but not credited, we adhere to the RBI''s harmonised turn-around-time
    (TAT). The failed refund turnaround days is 5 days.

    * **Verification Requirements**: Any state-changing operation (such as increasing
    limits or changing linked accounts) requires multi-factor authentication or a
    validation of the current KYC tier.


    **Compliance Framework**

    All operations strictly adhere to RBI and NPCI frameworks. We ensure a friction-less
    entry to digital banking while maintaining a secure, regulated environment for
    all retail users.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
