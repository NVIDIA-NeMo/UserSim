- id: 4bd23b2a-8649-5d47-800b-21aa46aef48a
  title: PaySetu Wallet & UPI — choosing between tiers or options
  body: 'When setting up your **PaySetu Wallet & UPI**, you can start with a basic
    account or go for full verification. Here is how to choose the right path for
    your needs:


    **Minimum-KYC Tier**

    * **Best for**: Users who want a friction-less, zero-barrier entry to test the
    ecosystem or who only make small, frequent daily payments.

    * **Key Limit**: A wallet balance cap of ₹10000.

    * **Trade-off**: Low friction setup, but limited storage for digital wealth within
    the wallet.


    **Full-KYC Tier**

    * **Best for**: Power users and digital natives who use the wallet as their primary
    hub for spends and require higher liquidity.

    * **Key Limit**: An expanded wallet balance cap of ₹200000.

    * **Trade-off**: Requires a more comprehensive verification process (PAN/Aadhaar),
    but unlocks full banking capabilities.


    **Common Ground**

    Regardless of the tier you choose, you enjoy the same high-velocity UPI experience
    with a UPI per transaction limit of ₹100000, ensuring your large transfers are
    never hindered.


    *Disclaimer: All retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor.*'
  domain: payments
