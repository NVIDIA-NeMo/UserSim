- id: b8b7820c-a411-57e9-a91e-03215a6e04ff
  title: PaySetu Prepaid Forex Card — cost and charges
  body: '**What are the primary fees for getting and using the PaySetu Prepaid Forex
    Card?**

    To get started, there is a one-time issuance fee of ₹150. Whenever you add more
    funds to your card, a reload fee of ₹100 is applied.


    **How much does it cost to spend in a currency different from what I loaded?**

    If you make a purchase in a currency other than the one held on your card, a cross
    currency markup of 2% is applied to the transaction.


    **Is there a charge for using ATMs abroad?**

    Yes, each withdrawal from an ATM outside of India incurs an ATM withdrawal fee
    abroad of ₹200.


    **Can these fees be waived?**

    In line with our lean pricing model, fees are generally used to recover direct
    costs. However, fees may be waived for high-balance users or specific promotional
    cohorts. Please ask us to check if your account is eligible for any waivers.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
