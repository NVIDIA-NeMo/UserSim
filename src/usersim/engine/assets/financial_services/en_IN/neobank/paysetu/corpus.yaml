  title: PaySetu Prepaid Forex Card — account security best practices
  body: 'Your **PaySetu Prepaid Forex Card** is designed for seamless international
    spending, but maintaining strict security hygiene is essential to protect your
    funds while travelling.


    **Critical Security Rules**

    To ensure your account remains secure, please remember that PaySetu agents will
    **never** request the following sensitive credentials:

    *   Your UPI PIN

    *   One-Time Passwords (OTPs)

    *   The CVV number on the back of your card

    *   Your account login password


    **Best Practices for Global Travel**

    1.  **Monitor Transactions:** Keep an eye on your in-app activity. If you notice
    a transaction you did not authorise, report it immediately.

    2.  **Avoid Public Wi-Fi:** When managing your card or loading funds, avoid using
    unsecured public Wi-Fi networks at airports or hotels; use a trusted VPN or mobile
    data.

    3.  **Secure Your Physical Card:** Treat your card like cash. If the card is lost
    or stolen, notify us immediately via chat to freeze the card and prevent unauthorised
    spend.


    **Handling Suspected Fraud**

    If you suspect fraudulent activity, our ''fair-and-fast'' philosophy ensures we
    route your claim through the formal reporting and chargeback path immediately
    to limit your liability. We adhere to RBI''s harmonised turn-around-time (TAT)
    for all failed transactions and refund requests. For a detailed look at our protection
    frameworks, see PaySetu Prepaid Forex Card — fraud and unauthorized-activity protection.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
