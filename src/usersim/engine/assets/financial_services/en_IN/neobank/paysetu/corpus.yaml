- id: a87c1534-04f3-5c42-9b43-6a5eefcd79fb
  title: PaySetu Wallet & UPI — recognizing scams targeting this product
  body: "As you explore digital payment options, it is vital to understand how to\
    \ protect your funds. Scammers often target UPI users with 'Request Money' frauds,\
    \ where they send a payment request pretending to be a reward or a refund, tricking\
    \ you into entering your PIN to 'receive' money. Remember: you never need to enter\
    \ your UPI PIN to receive funds.\n\nOther common tactics include phishing links\
    \ sent via SMS or email that mimic the PaySetu interface to steal your credentials.\
    \ Be wary of anyone claiming to be a PaySetu agent asking for your sensitive details\
    \ to 'upgrade' your account or 'unblock' a transaction. \n\n**Our Security Guarantee**\n\
    PaySetu maintains a strict verify-before-action stance. To protect you, our agents\
    \ will **never** request the following:\n* Your UPI PIN\n* One-Time Passwords\
    \ (OTPs)\n* Your Card CVV\n\n**Immediate Action Plan**\nIf you notice any unauthorised\
    \ transaction or suspect your account has been compromised, notify us immediately.\
    \ We follow a 'fair-and-fast' philosophy to limit your liability. Suspected fraud\
    \ is routed through our formal reporting and chargeback path to ensure a swift\
    \ resolution.\n\nFor a deeper dive into how we protect your account, you may refer\
    \ to PaySetu Wallet & UPI — fraud and unauthorized-activity protection.\n\n*Disclaimer:\
    \ PaySetu provides financial literacy and product education, not individualised\
    \ tax, legal, or investment advice.*"
