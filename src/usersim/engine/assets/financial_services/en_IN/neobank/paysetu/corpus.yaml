- id: 8a27bb72-2c05-5c74-85bc-51107144b137
  title: Bill Autopay — privacy and data handling
  body: 'This disclosure explains how PaySetu handles data associated with **Bill
    Autopay** to ensure your privacy and regulatory compliance.


    **Data Collection and Usage**

    To facilitate a **Mandate**, PaySetu collects and processes your biller identity,
    customer reference numbers, and the maximum debit limit. This data is used exclusively
    to instruct the underlying **Payment Rail** (UPI/NPCI) to move funds on your behalf.


    **Third-Party Sharing**

    Your data is shared only with the necessary financial intermediaries and the designated
    biller to ensure the payment is credited to the correct account. We adhere strictly
    to RBI and NPCI frameworks regarding the handling of Payment Pre-paid Instruments
    (PPI) and mandate data.


    **Security Controls**

    - **Verification**: We maintain a strict ''verify-before-action'' stance. No mandate
    can be created or altered without multi-factor authentication or validation of
    your **Full-KYC** tier.

    - **Transparency**: To prevent surprise debits, we are committed to providing
    a pre-debit notification **24 hours** before any automated transaction occurs.

    - **Limits**: We enforce a **mandate cap without AFA** of ₹15,000 to protect your
    account from large, unauthorised automated debits.


    **Customer Protection**

    All retail deposits used to fund your autopayments are secure and insured by the
    DICGC up to ₹5,00,000 per depositor. In the event of a suspected fraudulent debit,
    we follow the RBI''s harmonised turn-around-time (TAT) for the reporting and chargeback
    process.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
