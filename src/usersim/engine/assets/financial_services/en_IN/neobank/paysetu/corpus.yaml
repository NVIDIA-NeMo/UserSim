- id: 80251c6a-720b-5703-b423-020169bf1db7
  title: PaySetu Wallet & UPI — getting started walkthrough
  body: 'This guide is for support agents assisting customers in onboarding for **PaySetu
    Wallet & UPI**, our high-velocity hub for daily spends and instant UPI transfers.


    **Step 1: Initial Account Creation**

    Guide the customer to register using their mobile number. Upon registration, they
    enter the **Minimum-KYC** tier. In this tier, the customer has a wallet balance
    cap of ₹10000. This allows for basic wallet functionality and limited entry to
    the ecosystem.


    **Step 2: UPI Integration**

    Assist the customer in linking their bank account via a **Payment Rail** (such
    as UPI). Once linked, the customer can perform instant transfers. Inform the customer
    that the UPI per transaction limit is ₹100000.


    **Step 3: Upgrading to Full-KYC**

    To unlock the full potential of the product, encourage the customer to complete
    **Full-KYC** by providing their PAN and Aadhaar. Completing this verification
    increases their wallet balance cap to ₹200000 and allows for higher transaction
    volumes.


    **Key Product Specifications**

    * **Minimum-KYC Balance Cap**: ₹10000

    * **Full-KYC Balance Cap**: ₹200000

    * **UPI Per Transaction Limit**: ₹100000

    * **Refund TAT**: Failed transactions are handled within a turnaround time of
    5 days.


    **Agent Reminder**

    Always ensure the customer understands the difference between the wallet balance
    and the UPI transfer limit. The wallet is for stored value, while UPI moves money
    directly between bank accounts using the established **Payment Rail**.


    *Disclaimer: All retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor.*'
