- id: 3e47b811-a348-5197-a0f7-171a7161f89e
  title: Bill Autopay — risk disclosures
  body: 'The use of **Bill Autopay** involves the creation of a **Mandate**, which
    permits automated debits from your account. Please be aware of the following regulatory
    and operational risks:


    **1. Automated Debit Risk:**

    By enabling autopay, you authorize the movement of funds without per-transaction
    approval for amounts up to ₹15000 (the AFA-exempt limit). While we provide a pre-debit
    notification 24 hours in advance, the execution is automatic. You are responsible
    for monitoring your account balance to avoid payment failures.


    **2. Late Payment Implications:**

    Failure to maintain sufficient funds may result in the biller charging late penalties.
    If PaySetu is used to facilitate the recovery of such late payments, a late bill
    convenience fee of ₹20 will be applied.


    **3. Compliance and Limits:**

    All autopay features are strictly governed by RBI and NPCI frameworks. PaySetu
    may restrict or disable your mandates if your account status reverts from **Full-KYC**
    to **Minimum-KYC**, or if suspicious activity is detected.


    **4. Deposit Insurance:**

    Funds held in your PaySetu account to support these payments are secure and insured
    by the DICGC up to ₹5,00,000 per depositor.


    **5. Dispute Resolution:**

    In the event of a failed transaction or unauthorized debit, PaySetu adheres to
    the RBI''s harmonised turn-around-time (TAT) for refunds. All disputes are handled
    through a tiered path, ending with the RBI Integrated Ombudsman Scheme.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
