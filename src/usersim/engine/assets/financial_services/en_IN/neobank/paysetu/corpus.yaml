- id: 741d9bfb-ebfd-57ce-9705-eea5e8779017
  title: PaySetu Digital Savings — a declined or blocked action
  body: "**Symptom:** You attempted to transfer funds, increase a limit, or update\
    \ account details, but the action was declined or you received a 'Blocked' notification.\n\
    \n**Likely Causes**\n1. **KYC Expiry:** You may be using a Minimum-KYC account\
    \ and have exceeded the 30 days allowed for Full-KYC completion.\n2. **Security\
    \ Trigger:** The transaction may have triggered a fraud alert due to unusual activity.\n\
    3. **Authentication Failure:** Multi-factor authentication was not completed successfully.\n\
    \n**Resolution Steps**\n1. **Check your KYC Status:** Ask us to verify if your\
    \ account is currently Full-KYC or Minimum-KYC. If you have passed the 30 days\
    \ limit without completion, you will need to finish your identity verification\
    \ (PAN/Aadhaar) to unblock the action.\n2. **Verify Transaction Details:** Ensure\
    \ the payment rail used (UPI, IMPS, NEFT) is functioning and the destination details\
    \ are correct.\n3. **Re-authenticate:** If the block was due to a session timeout,\
    \ ask us to restart the authentication process.\n\n**When to Escalate**\nIf your\
    \ KYC is up to date and your credentials are correct, but the action remains blocked,\
    \ tell us to raise a technical ticket. \n\n**What happens next:**\n* We will route\
    \ the issue to our technical specialists to investigate the block.\n* For failed\
    \ transactions, we follow the RBI's harmonised turn-around-time (TAT) for refunds.\n\
    * You will receive a notification via in-app chat or email once the block is lifted\
    \ or a resolution is provided.\n\n***\n*Disclaimer: PaySetu provides financial\
    \ literacy and product education, not individualised tax, legal, or investment\
    \ advice.*"
