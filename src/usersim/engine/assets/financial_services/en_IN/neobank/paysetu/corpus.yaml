- id: 3fb193c5-7106-5fe4-bd6d-ba28e68f396e
  title: PaySetu Wallet & UPI — overview
  body: 'Welcome to **PaySetu Wallet & UPI**, the high-velocity hub for your daily
    spends and instant UPI transfers. Designed for the digital-native user, this product
    integrates a seamless wallet experience with the power of the UPI **Payment Rail**,
    ensuring your money moves as fast as you do.


    Our wallet is designed to scale with your verification level. For those starting
    with **Minimum-KYC**, we provide a basic verification tier with a wallet balance
    cap of ₹10000. Once you complete **Full-KYC** (comprehensive identity verification
    via PAN and Aadhaar), your capacity expands significantly to a wallet balance
    cap of ₹200000.


    For those who prefer the speed of UPI, our system supports a UPI per transaction
    limit of ₹100000, allowing you to handle substantial payments without friction.
    Whether you are splitting a bill or paying a vendor, PaySetu ensures a zero-barrier
    entry to digital banking.


    **Key Product Highlights:**

    - **Instant Utility:** High-speed transfers and payments via UPI.

    - **Scalable Limits:** Move from a ₹10000 cap to a ₹200000 cap via **Full-KYC**.

    - **High Capacity:** Send up to ₹100000 in a single UPI transaction.

    - **Lean Pricing:** Core banking and wallet operations are free, adhering to our
    philosophy of recovering only direct costs for specialised services.


    *Disclaimer: All retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor. PaySetu provides financial literacy and product education, not
    individualised tax, legal, or investment advice.*'
