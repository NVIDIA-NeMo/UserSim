- id: 0fa8fc42-bf30-5713-953b-ca54856fb12f
  title: PaySetu Wallet & UPI — a discrepancy in your records or statement
  body: '**Symptom**

    A customer reports that their wallet balance does not match their transaction
    history, or a specific transaction is missing from their statement.


    **Likely Causes**

    1. **Pending State**: The transaction is still being processed by the Payment
    Rail and has not yet settled in the wallet balance.

    2. **Failed Refund Delay**: A failed transaction has been reversed, but the funds
    are still within the failed refund turnaround days of 5 days.

    3. **Sync Issue**: A temporary delay in the app''s display of the transaction
    ledger.


    **What to check in order**

    1. **Verify Transaction Status**: Check the ''Activity'' tab. If a transaction
    is marked ''Pending'', the balance may not yet reflect the change.

    2. **Check for Reversals**: If the customer is looking for a refund from a failed
    payment, calculate if 5 days have passed since the failure. We adhere to the RBI''s
    TAT, and funds are typically restored within this window.

    3. **Cross-Reference with Bank**: If the wallet was loaded via UPI, check the
    linked bank account statement to ensure the amount actually left the bank.


    **The Fix**

    * **For Pending Transactions**: Advise the customer to wait for the Payment Rail
    to provide a final success/fail status.

    * **For Delayed Refunds**: If it has been fewer than 5 days, assure the customer
    that the refund is in progress per our ''fair-and-fast'' philosophy.

    * **For Actual Discrepancies**: If the balance is still incorrect after 5 days
    and all transactions are settled, we will initiate a manual ledger reconciliation.


    **When to escalate**

    If a manual reconciliation reveals a missing credit or an incorrect debit, we
    will raise a formal dispute. The customer will receive a ticket number, and we
    will route the case to our Grievance Redressal Officer if not resolved within
    the standard TAT.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 8ac2fb55-c674-56b6-8785-bb6f320497ac
  title: PaySetu Prepaid Forex Card — overview
  body: 'The **PaySetu Prepaid Forex Card** is a borderless spending tool designed
    for seamless international travel, allowing you to manage your foreign exchange
    without the hassle of carrying physical cash. Whether you are travelling for leisure
    or business, this card provides a secure way to handle global transactions.


    **Core Product Features**

    Our forex card is designed for tech-savvy travellers who value transparency and
    ease of use. You can load the card with your preferred currency and spend across
    a wide network of international merchants. To maintain a lean pricing model, we
    only apply fees to recover direct costs associated with these specialised services.


    **Exact Fee Structure**

    - **Issuance Fee**: A one-time charge of ₹150 is applied when the card is first
    issued.

    - **Reload Fee**: Each time you add funds to your card, a fee of ₹100 is applicable.

    - **Cross Currency Markup**: For transactions made in a currency different from
    the card''s primary load, a markup of 2% is applied.

    - **ATM Withdrawal Fee Abroad**: Withdrawing cash from an international ATM incurs
    a fee of ₹200 per transaction.


    **Compliance and Security**

    Your account is governed by RBI and NPCI frameworks. To access the card, a **Full-KYC**
    (comprehensive identity verification via PAN and Aadhaar) is required to ensure
    the highest level of security and compliance. All transactions are protected by
    multi-factor authentication to prevent unauthorised use.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. All retail deposits are insured by the DICGC
    up to ₹5,00,000 per depositor.*'
