  title: PaySetu Prepaid Forex Card — access or login problems
  body: '**Symptom:** "I cannot access my Forex card management screen in the app"
    or "I am getting a login error when trying to view my card balance."


    **Likely Causes**

    *   **KYC Expiry/Suspension:** Your **Full-KYC** status may have lapsed or been
    flagged for re-verification.

    *   **Authentication Failure:** Multi-factor authentication (MFA) failed during
    the login sequence.

    *   **App Version:** You are using an outdated version of the PaySetu app that
    does not support current card protocols.


    **What to check in order**

    1.  **Connectivity:** Ensure you have a stable internet connection.

    2.  **App Update:** Check if there is a pending update for the PaySetu app in
    your app store.

    3.  **Credentials:** Verify that you are using the correct registered mobile number
    and password.


    **The Fix**

    *   **For MFA Issues:** If you are not receiving the OTP, tell us. We will trigger
    a manual resend or help you verify your identity via an alternative secure method.

    *   **For KYC Issues:** If your account is restricted due to KYC, provide the
    requested updated documents (PAN/Aadhaar) in the chat. We will process the verification
    and restore access.


    **When to Escalate**

    If the issue persists after updating the app and verifying KYC, we will raise
    a technical ticket with our backend systems team. You will receive a ticket reference
    number and a resolution update within 24 to 48 hours. For issues involving failed
