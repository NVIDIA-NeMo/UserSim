- id: f815e096-7e6c-5352-8cf8-bee18785e6b7
  title: PaySetu Prepaid Forex Card — privacy and data handling
  body: 'This disclosure explains how PaySetu handles data related to the use of the
    **PaySetu Prepaid Forex Card**. We treat compliance as customer protection, adhering
    strictly to RBI and NPCI frameworks.


    **Data Collection and Usage**

    To provide the Forex card service, we collect and process your identity data during
    the **Full-KYC** process (including PAN and Aadhaar). We also track transaction
    metadata—such as location, merchant category, and currency—to provide real-time
    spending analytics and to detect potential fraud.


    **Third-Party Sharing**

    Your data is shared only with authorised partners essential for the card''s operation,
    including:

    *   **Payment Rails:** Infrastructure providers used to move money globally.

    *   **Regulatory Bodies:** As required by the RBI or other law enforcement agencies
    for AML (Anti-Money Laundering) and KYC compliance.

    *   **Card Networks:** To facilitate the authorisation of transactions at global
    Point-of-Sale (POS) terminals.


    **User Rights and Security**

    We maintain a strict ''verify-before-action'' stance. No state-changing operation
    (such as changing your linked mobile number or increasing limits) will occur without
    multi-factor authentication. You have the right to request a summary of the data
    held about you through our support channels.


    **Financial Protection**

    All retail deposits held within the PaySetu ecosystem are secure and insured by
    the DICGC up to ₹5,00,000 per depositor.


