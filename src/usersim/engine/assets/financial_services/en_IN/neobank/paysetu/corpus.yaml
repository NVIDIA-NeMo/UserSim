- id: 0bdc9803-6cca-5bba-97d2-96855509c9b7
  title: PaySetu Digital Savings — full kyc completion days explained
  body: '**What are ''Full-KYC completion days'' in PaySetu Digital Savings?**

    When you open an account, you start at a basic verification tier. To access full
    banking features, higher wallet limits, and the complete benefits of your account,
    you must complete the **Full-KYC** process (PAN/Aadhaar verification). The **full-KYC
    completion days** refers to the 30-day window you have to finish this verification
    after opening your account.


    **What happens if I don''t complete Full-KYC within 30 days?**

    If the verification is not completed within the **30 days** limit, your account
    may be restricted to **Minimum-KYC** functionality, which involves lower balance
    caps and limited transaction features.


    **Does this affect my interest rate?**

    No, the **savings interest rate of 3.5%** applies to your balance, but your ability
    to hold larger sums depends on your KYC tier. For more on account setup, see PaySetu
    Digital Savings — overview.


    *Disclaimer: Retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor.*'
