- id: eef4363f-7b84-5b98-ae90-7a9f28c4bf0a
  title: PaySetu Digital Savings — resolve a common request end-to-end
  body: 'This guide explains how to upgrade your account from Minimum-KYC to Full-KYC
    to unlock all banking features and higher limits.


    **Prerequisites**

    * An existing PaySetu account currently at Minimum-KYC level.

    * Your original PAN card and Aadhaar number available.

    * A mobile number linked to your Aadhaar for OTP verification.


    **Steps to Upgrade to Full-KYC**

    1. Tell us that you want to upgrade your account to Full-KYC.

    2. Provide your PAN and Aadhaar details when prompted.

    3. We will initiate the identity verification process. You will receive an OTP
    on your Aadhaar-linked mobile number; provide this OTP to us to verify your identity.

    4. We will process the verification against the official databases. This is the
    comprehensive identity verification required for higher wallet limits.

    5. Once the process is complete, we will send you a confirmation message stating
    that your account has been upgraded to Full-KYC.


    **How you know it worked**

    * You will receive a confirmation notification in the app.

    * Your account limits will automatically increase.

    * If you check your account status, it will now reflect ''Full-KYC'' instead of
    ''Minimum-KYC''.


    **Important Note:** Remember that this must be completed within 30 days of your
    initial onboarding to avoid any service interruptions.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
