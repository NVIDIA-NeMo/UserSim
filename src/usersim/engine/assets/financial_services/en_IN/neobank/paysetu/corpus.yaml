- id: 9be9fcb1-3721-5c16-ab32-9cd2d0c43273
  title: PaySetu Digital Savings — risk disclosures
  body: 'This document provides formal risk disclosures associated with the <b>PaySetu
    Digital Savings</b> account.


    **1. Deposit Insurance**

    Retail deposits held within the <b>PaySetu Digital Savings</b> account are secure
    and insured by the Deposit Insurance and Credit Guarantee Corporation (DICGC)
    up to a maximum of ₹5,00,000 per depositor. Amounts exceeding this limit are not
    covered by DICGC insurance.


    **2. Interest Rate Variability**

    The current savings interest rate of 3.5% is subject to change. Such changes may
    occur due to modifications in RBI monetary policy or PaySetu''s internal pricing
    adjustments. Customers will be notified of rate changes via the app or email.


    **3. KYC Compliance Risks**

    Failure to adhere to the <b>Full-KYC</b> completion days requirement of 30 days
    may result in the account being restricted. This includes limitations on the amount
    of funds that can be held and a restriction on certain <b>Payment Rail</b> operations.


    **4. Transactional Risks**

    While PaySetu adheres to RBI''s harmonised turn-around-time (TAT) for failed transactions,
    the actual movement of money depends on the underlying <b>Payment Rail</b> (UPI,
    IMPS, NEFT). Temporary delays may occur due to third-party banking infrastructure
    failures.


    **5. Non-Advisory Nature**

    PaySetu provides financial literacy and product education. The <b>PaySetu Digital
    Savings</b> account is a tool for wealth storage and liquidity, not an investment
    vehicle. We do not provide individualised tax, legal, or investment advice.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
