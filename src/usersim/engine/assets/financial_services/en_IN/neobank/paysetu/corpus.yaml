- id: d09fb953-f94e-573d-a99e-306240e35e07
  title: Bill Autopay — recognizing scams targeting this product
  body: "As you orchestrate your finances with Bill Autopay, it is vital to remain\
    \ vigilant against social engineering scams. Fraudsters often impersonate utility\
    \ providers or government agencies, claiming that your automated payment has 'failed'\
    \ or that a 'mandate update' is required to avoid service disconnection. \n\n\
    **Common Red Flags:**\n- **Urgency and Threats:** Scammers create a sense of panic,\
    \ demanding immediate payment via a third-party link to 'reactivate' your Bill\
    \ Autopay service.\n- **Request for Credentials:** Any request for your UPI PIN,\
    \ OTP, or CVV under the guise of 'verifying' your mandate is a scam. PaySetu agents\
    \ will **never** ask for these sensitive credentials.\n- **Unsolicited Links:**\
    \ Be wary of SMS or emails asking you to click a link to 'confirm' a pre-debit\
    \ notification. Official notifications are delivered through the app and do not\
    \ require you to enter your PIN to receive a notification.\n\n**Your Protection\
    \ Path:**\nIf you suspect a fraudulent attempt or notice an unauthorised mandate,\
    \ report it to us immediately. We follow a 'fair-and-fast' philosophy, routing\
    \ suspected fraud through formal reporting and chargeback paths to limit your\
    \ liability. The faster you report, the more effectively we can secure your funds.\n\
    \n**Immediate Action:**\nIf you have accidentally shared credentials or noticed\
    \ an unauthorised transaction, notify us via in-app chat or email immediately\
    \ to freeze the affected mandate and initiate the dispute process. \n\n*Disclaimer:\
    \ PaySetu provides financial literacy and product education, not individualised\
    \ tax, legal, or investment advice. Retail deposits are insured by the DICGC up\
    \ to ₹5,00,000 per depositor.*"
  domain: payments
  product_category: bill_autopay
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 53b80b1b-a461-52c6-8f46-6ab6af8cc0f6
  title: Bill Autopay — limits, restrictions, and edge cases
  body: "This internal guide outlines the operational boundaries of Bill Autopay to\
    \ ensure accurate customer support. \n\n**Transaction Limits & Mandates**\n- **Standard\
    \ Mandate Cap:** For transactions that do not require Additional Factor Authentication\
    \ (AFA), the maximum amount that can be debited is ₹15000. Any amount exceeding\
    \ this threshold will require the customer to provide a second factor of authentication\
    \ for the specific transaction.\n- **Mandate Execution:** The system relies on\
    \ the underlying **Payment Rail** (UPI/NEFT/IMPS) to move funds. If the rail is\
    \ experiencing downtime, the autopay may be delayed.\n\n**Notification Timelines**\n\
    - **Pre-Debit Notice:** To ensure transparency, customers receive a notification\
    \ 24 hours before a scheduled debit occurs. This allows the user to ensure sufficient\
    \ funds are available in their account.\n\n**Fee Application**\n- **Late Bill\
    \ Convenience Fee:** In cases where a bill is processed after the due date due\
    \ to customer-side delays or specific provider terms, a convenience fee of ₹20\
    \ may be applied to recover direct administrative costs.\n\n**Edge Cases & Restrictions**\n\
    - **Insufficient Funds:** If the account balance is lower than the bill amount\
    \ at the time of execution, the transaction will fail. This may trigger late fees\
    \ from the service provider.\n- **KYC Tiers:** Users on **Minimum-KYC** may face\
    \ lower overall wallet limits which could affect their ability to maintain the\
    \ balance required for high-value autopay mandates.\n- **Mandate Revocation:**\
    \ Customers can cancel a mandate at any time; however, payments already in the\
    \ 'processing' state on the payment rail may not be stoppable.\n\n*Disclaimer:\
    \ PaySetu provides financial literacy and product education, not individualised\
    \ tax, legal, or investment advice. Retail deposits are insured by the DICGC up\
    \ to ₹5,00,000 per depositor.*"
  domain: payments
