  title: PaySetu Prepaid Forex Card — cancel, close, or downgrade
  body: 'If you no longer require your international spending tool, you can close
    or downgrade your card through the following steps:


    **Prerequisites**

    * Ensure you have a record of your final balance.

    * Identify the account where you wish to receive any remaining funds.


    **Steps to Close or Downgrade**

    1. **Initiate Request**: Tell us that you wish to close your **PaySetu Prepaid
    Forex Card** or downgrade it to a basic tier.

    2. **Balance Settlement**: We will calculate the remaining balance on the card.
    Any refundable amount will be converted back to INR (subject to current exchange
    rates) and transferred to your linked PaySetu account.

    3. **Confirmation of Fees**: We will confirm that there are no pending charges,
    such as an outstanding **atm withdrawal fee abroad of ₹200** or **cross currency
    markup of 2%** from a recent pending transaction.

    4. **Final Approval**: Provide your digital consent to terminate the card agreement.

    5. **Closure Confirmation**: We will process the request and send you a confirmation
    notification once the card is deactivated and the account is closed.


    **How you know it worked**

    * You will receive a final closing statement via email.

    * The card will be listed as ''Inactive'' or ''Closed'' in your app dashboard.

    * Any remaining funds will appear in your linked account balance.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
