- id: 9504eec0-2e65-5eb7-91ff-c759405ce3be
  title: PaySetu Wallet & UPI — upi per transaction limit explained
  body: '**What is the limit for a single UPI transaction on PaySetu?**

    For every transaction made using the UPI feature within **PaySetu Wallet & UPI**,
    there is a UPI per transaction limit of ₹100000. This ensures secure, high-velocity
    movement of funds while adhering to safety frameworks.


    **Does this limit apply to my wallet balance?**

    No. The ₹100000 limit refers specifically to the amount you can move in a single
    UPI transfer. Your wallet balance is governed by your KYC tier: ₹10000 for **Minimum-KYC**
    and ₹200000 for **Full-KYC**.


    **Can I increase this transaction limit?**

    Currently, the UPI per transaction limit of ₹100000 is a standard cap across the
    platform to ensure security. For larger movements of wealth, you may explore other
    integrated features as outlined in PaySetu Wallet & UPI — overview.


    *Disclaimer: Limits are subject to change based on NPCI and RBI guidelines.*'
