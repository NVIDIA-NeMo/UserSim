- id: f5110237-f4d1-509d-93c3-fe26715082c8
  title: PaySetu Prepaid Forex Card — cross currency markup explained
  body: '**What is a cross currency markup?**

    A cross currency markup is a small percentage fee charged when you make a transaction
    in a currency different from the one loaded on your **PaySetu Prepaid Forex Card**.
    It covers the cost of converting funds between different global currencies in
    real-time.


    **How much is the markup on my PaySetu card?**

    PaySetu maintains a transparent pricing model. We apply a flat cross currency
    markup of 2% on all such transactions.


    **How is this calculated?**

    If you spend in a currency not held on your card, the transaction amount is converted
    using the prevailing exchange rate, and the 2% markup is added to that total.


    For a full list of all costs associated with the card, please refer to PaySetu
    Prepaid Forex Card — fee schedule.


