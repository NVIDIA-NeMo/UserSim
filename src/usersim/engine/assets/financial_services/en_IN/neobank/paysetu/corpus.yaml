- id: f0091529-f79b-551f-b1fe-e1de8c74bbe3
  title: When to use manage_authorized_users
  body: 'This policy outlines the procedure for adding, removing, or modifying authorized
    users on a customer''s account. At PaySetu, we maintain a strict ''verify-before-action''
    stance; therefore, authorized user management is treated as a state-changing operation
    requiring high-level validation.


    **Usage Criteria**

    Agents should utilize this process when a primary account holder requests to grant
    a trusted individual access to account features or when they wish to revoke existing
    access for security reasons. This is commonly used for shared household finances
    or managed accounts for dependents.


    **Operational Procedure**

    1. **Identity Verification**: Perform a comprehensive identity check of the primary
    account holder using the `verify_identity` tool. Ensure the user has the appropriate
    KYC-tier validation (Full-KYC) to manage account permissions.

    2. **Account Resolution**: Use the `get_accounts` tool to identify the specific
    account ID associated with the request (e.g., resolving a last-4 digit account
    number).

    3. **Request Validation**: Confirm the specific nature of the change—whether it
    is adding a new authorized user, updating the permissions of an existing one,
    or removing a user entirely.

    4. **Execution**: Call the `manage_authorized_users` tool with the required parameters
    (Account ID, User Details, and Action Type) to update the account state in real-time.

    5. **Confirmation**: Inform the customer that the change has been applied and
    notify them of the updated access levels.


    **Security Note**

    Agents must never request sensitive credentials such as UPI PINs, OTPs, or CVVs
    during this process. Any suspected unauthorized attempt to change account access
    must be routed through the formal fraud reporting path immediately.


    For technical details on the tool''s parameters, see manage_authorized_users tool
    reference.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: paysetu
- id: 65f0ea0f-6211-5321-99db-865511254eb1
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool is the authoritative mechanism for modifying
    the list of individuals permitted to operate or view a specific PaySetu account.
    This tool ensures that all permission changes are logged for compliance and audit
    purposes.


    **Tool Signature**

    - **Function Name**: `manage_authorized_users`

    - **Parameters**: Requires the `account_id`, the `user_identifier` (of the person
    being added/removed), and the `action` (e.g., ''add'', ''remove'', ''update_permissions'').

    - **Effect**: Updates the account''s authorized user list in the core banking
    system, immediately altering the access rights of the specified user.


    **Agent Execution**

    Agents execute this change by calling the tool directly after the primary account
    holder has been successfully verified. Agents must not tell customers to manage
    these users via a separate form or external website; the action is completed within
    the support session via this tool call. For the full operational workflow, see
    When to use manage_authorized_users.'
