- id: c53c4244-b8d0-5487-88e6-4763cb033139
  title: Bill Autopay — access or login problems
  body: '**Symptom**: "I cannot see my Bill Autopay dashboard" or "The app says I
    am not eligible to set up a mandate."


    **Likely Causes**

    - **KYC Status**: The most common cause is a **Minimum-KYC** status, which restricts
    certain banking features and limits wallet functionality.

    - **Authentication Session**: An expired session or outdated app version may prevent
    the **Mandate** management screen from loading.

    - **Payment Rail Downtime**: Temporary unavailability of the underlying UPI/NPCI
    infrastructure.


    **What to check in order**

    1. **Check KYC Tier**: Verify if your account is **Full-KYC**. If you only have
    **Minimum-KYC**, you will not have access to full banking features required for
    certain mandates.

    2. **App Version**: Ensure you are using the latest version of the PaySetu app.

    3. **Network Connectivity**: Switch between Wi-Fi and Mobile Data to rule out
    connection issues.


    **The Fix**

    - **For KYC Issues**: If you are on **Minimum-KYC**, ask us to start the **Full-KYC**
    process. You will need to provide your PAN and Aadhaar for verification. Once
    completed, the **Bill Autopay** features will unlock.

    - **For Session Issues**: Log out and log back in to refresh your security tokens.


    **When to escalate**

    If you have **Full-KYC** and are still unable to access the feature after a restart,
    tell us. We will raise a technical case with our digital support team. You will
    receive a ticket number and a resolution update within the RBI''s harmonised turn-around-time
    (TAT).


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
