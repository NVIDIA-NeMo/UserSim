- id: 1f7be646-4f52-5af2-92d5-77dd514d81ba
  title: PaySetu Prepaid Forex Card — fraud and unauthorized-activity protection
  body: "When spending across borders, your security is our priority. The **PaySetu\
    \ Prepaid Forex Card** is designed with a 'verify-before-action' architecture\
    \ to ensure your international funds remain secure. \n\n**Common Fraud Patterns**\n\
    Users of forex cards are often targeted by 'phishing' attempts where scammers\
    \ pose as bank officials claiming your card has been blocked or requires a mandatory\
    \ KYC update to avoid suspension. They may attempt to trick you into revealing\
    \ your card details or an OTP to 'verify' your identity.\n\n**Our Zero-Tolerance\
    \ Policy**\nTo protect your funds, PaySetu agents will **never** request the following\
    \ sensitive credentials:\n* Your UPI PIN\n* One-Time Passwords (OTPs)\n* Your\
    \ card's CVV or Expiry Date\n\nIf an individual asking for this information claims\
    \ to be from PaySetu, it is a fraudulent attempt.\n\n**Immediate Action Plan**\n\
    If you notice an unauthorised transaction or suspect your card details have been\
    \ compromised:\n1. **Freeze the Card**: Immediately notify us to block the card\
    \ to prevent further outflows.\n2. **Formal Reporting**: We will route the suspected\
    \ fraud through our formal reporting and chargeback path. Following our 'fair-and-fast'\
    \ philosophy, we adhere to the RBI's harmonised turn-around-time (TAT) for failed\
    \ transactions and refunds to limit your liability.\n\nBy maintaining a strict\
    \ multi-factor authentication requirement for state-changing operations, we ensure\
    \ that your global spends are as secure as your local ones.\n\n*Disclaimer: PaySetu\
    \ provides financial literacy and product education, not individualised tax, legal,\
    \ or investment advice.*"
  domain: cards
  product_category: prepaid_forex_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
