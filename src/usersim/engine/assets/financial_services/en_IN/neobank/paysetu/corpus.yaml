- id: eb8e24c3-f591-5d61-80d6-95d2f701ccff
  title: PaySetu Wallet & UPI — privacy and data handling
  body: 'At PaySetu, we view compliance as a form of customer protection. This disclosure
    explains how we handle your data within the **PaySetu Wallet & UPI** ecosystem
    in accordance with RBI and NPCI frameworks.


    **Data Collection and Purpose**

    To provide seamless financial orchestration, we collect identity data (PAN, Aadhaar)
    specifically for the purposes of **Full-KYC** and **Minimum-KYC** verification.
    This data is used to establish your identity and determine your wallet balance
    caps—specifically the ₹10000 limit for basic users and the ₹200000 limit for fully
    verified users.


    **Transaction Monitoring**

    All movements of money via our **Payment Rails** are monitored to prevent fraud
    and ensure the security of your funds. We track transaction volumes to ensure
    adherence to the UPI per transaction limit of ₹100000 and other regulatory caps.


    **Data Sharing and Privacy**

    Your data is shared only with authorized regulatory bodies and the underlying
    infrastructure providers (e.g., NPCI) necessary to execute your UPI transfers.
    PaySetu does not sell your personal financial data to third-party marketers.


    **User Rights and Control**

    Users have the right to request a summary of the data held by PaySetu. Upon closure
    of your account, your data is retained only as long as required by the statutory
    record-keeping mandates of the Reserve Bank of India.


    **Security Measures**

    We employ multi-factor authentication for all state-changing operations. Our ''verify-before-action''
    stance ensures that no transaction is processed without explicit customer authorisation.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. All retail deposits are secure and insured by
    the DICGC up to ₹5,00,000 per depositor.*'
  domain: payments
  product_category: upi_wallet
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: ec5a20f0-9a99-59cf-9579-d23156a6c148
  title: transfer_funds tool reference
  body: "The <b>transfer_funds</b> tool is used to move money between a customer's\
    \ internal accounts or to a verified external beneficiary via a supported <b>Payment\
    \ Rail</b> (such as IMPS, NEFT, or UPI). \n\n**Agent Action**: The agent performs\
    \ this action by calling the tool directly within the conversation after the customer's\
    \ identity and sufficient balance are verified. The agent must never redirect\
    \ the customer to a portal to initiate the transfer.\n\n**Arguments**:\n- <b>source_account_id</b>:\
    \ The unique identifier of the account from which funds are being debited.\n-\
    \ <b>destination_account_id</b>: The unique identifier of the recipient account.\n\
    - <b>amount</b>: The exact value to be transferred in ₹.\n- <b>payment_rail</b>:\
    \ The infrastructure used for the transfer (e.g., IMPS, NEFT).\n- <b>remarks</b>:\
    \ A brief note for the transaction record.\n\n**Effect**: Deducts the specified\
    \ amount from the source account and credits it to the destination account in\
    \ real-time or per the rail's TAT."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: paysetu
- id: c2dc7cc0-4041-5368-a40a-ca412f4f9c7f
  title: When to use order_replacement_card
  body: 'This policy outlines the procedure for issuing a replacement card for the
    <b>PaySetu Prepaid Forex Card</b> in the event of loss, theft, or physical damage.
    To maintain our ''verify-before-action'' security stance, agents must ensure a
    strict identity check is completed before proceeding.


    **Applicability**:

    - Physical card loss or theft.

    - Card damaged beyond use (e.g., chipped or broken).

    - Expired cards requiring renewal.


    **Procedure**:

    1. **Verify Identity**: Use the internal verification process to confirm the customer''s
    identity.

    2. **Account Identification**: Call <b>get_accounts</b> to retrieve the specific
    <b>account_id</b> associated with the lost or damaged <b>PaySetu Prepaid Forex
    Card</b> using the customer''s provided last-4 digits.

    3. **Security Freeze**: If the card is reported lost or stolen, the agent must
    first ensure the card is blocked to prevent unauthorised transactions.

    4. **Request Replacement**: Call the <b>order_replacement_card</b> tool using
    the <b>account_id</b> and the verified delivery address.

    5. **Confirmation**: Inform the customer of the estimated delivery timeline and
    any applicable replacement fees as listed in the <b>PaySetu Prepaid Forex Card
    — fee schedule</b>.


    **Note**: Replacement cards are sent as inactive for security. The customer must
    follow the activation steps once the card is received.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: paysetu
- id: 2a496e8c-6f71-5584-a0c9-4ae0f114de1a
  title: order_replacement_card tool reference
  body: 'The <b>order_replacement_card</b> tool triggers the logistics and issuance
    workflow for a new physical card to replace an existing one.


    **Agent Action**: The agent initiates the replacement process by calling this
    tool directly. This is the authoritative mechanism to order a card; the agent
    should not instruct the customer to fill out an external request form.


    **Arguments**:

    - <b>account_id</b>: The unique identifier of the account linked to the card being
    replaced.

    - <b>reason</b>: The reason for replacement (e.g., ''lost'', ''stolen'', ''damaged'').

    - <b>shipping_address_id</b>: The verified address identifier where the new card
    should be delivered.


    **Effect**: The current physical card is flagged for replacement (if not already
    blocked), and a request is sent to the card manufacturer to print and ship a new
    card to the specified address.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: paysetu
- id: bc30777c-e824-5d0f-81b9-a3fa7781fe53
  title: When to use stop_payment
  body: 'PaySetu allows customers to request a stop payment on specific outgoing transactions
    to protect their funds from errors or potential fraud. This applies primarily
    to <b>Mandates</b> or scheduled transfers that have not yet been processed by
    the <b>Payment Rail</b>.


    **Eligibility for Stop Payment**:

    - The transaction must be in a ''pending'' or ''scheduled'' state.

    - The request must be made before the funds have been debited from the <b>PaySetu
    Digital Savings</b> account or <b>PaySetu Wallet & UPI</b>.


    **Procedure**:

    1. **Authentication**: Confirm the customer''s identity using multi-factor authentication.

    2. **Transaction Identification**: Call <b>get_account_transactions</b> to identify
    the specific transaction ID or the <b>Mandate</b> ID that needs to be halted.

    3. **Account Resolution**: Use <b>get_accounts</b> to ensure the correct <b>account_id</b>
    is targeted for the stop request.

    4. **Execute Stop**: Call the <b>stop_payment</b> tool providing the transaction/mandate
    details.

    5. **Notification**: Confirm to the customer that the payment has been halted
    and advise them on how to resume or delete the instruction if applicable.


    **Compliance Note**: Once a transaction has entered the ''processing'' stage of
    the <b>Payment Rail</b>, a stop payment may not be possible. In such cases, the
    agent should guide the customer toward the formal reporting path as detailed in
    <b>PaySetu Wallet & UPI — fraud and unauthorized-activity protection</b>.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: paysetu
- id: c0cf7899-7a73-5677-a7d8-e41f99983c3c
  title: stop_payment tool reference
  body: 'The <b>stop_payment</b> tool is used to cancel a pending outgoing transaction
    or a specific automated debit instruction.


    **Agent Action**: The agent performs this action by calling the tool directly.
    This action is irreversible for the specific transaction instance.


    **Arguments**:

    - <b>account_id</b>: The identifier of the account from which the payment was
    to be made.

    - <b>transaction_id</b>: The unique identifier of the specific transaction to
    be stopped.

    - <b>mandate_id</b>: (Optional) The identifier of the recurring <b>Mandate</b>
    if the stop applies to an automated payment.


    **Effect**: The system places a hold on the specified transaction, preventing
    the <b>Payment Rail</b> from executing the debit. If the transaction has already
    been processed, the tool will return an error indicating the payment cannot be
    stopped.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: paysetu
- id: 84bc040b-2086-50e6-b64d-1485f7ba8343
  title: When to use pay_bill
  body: 'The <b>pay_bill</b> process enables customers to settle outstanding utility
    or service invoices instantly. This is a high-velocity action typically linked
    to the <b>PaySetu Wallet & UPI</b> ecosystem for seamless orchestration.


    **Procedure for Bill Payment**:

    1. **Identity Verification**: Verify the customer''s identity to ensure they are
    authorised to access the account.

    2. **Account Selection**: Call <b>get_accounts</b> to identify the funding source
    (e.g., <b>PaySetu Digital Savings</b> or <b>PaySetu Wallet & UPI</b>) and its
    corresponding <b>account_id</b>.

    3. **Bill Details Collection**: Obtain the biller ID, customer reference number,
    and the exact amount in ₹ to be paid.

    4. **Execute Payment**: Call the <b>pay_bill</b> tool with the funding account
    and biller details.

    5. **Confirmation**: Provide the customer with the transaction reference number
    generated by the tool.


    **Key Considerations**:

    - **Balance Check**: The agent should ensure sufficient funds are available before
    calling the tool to avoid ''insufficient funds'' failures.

    - **Recurring Payments**: If the customer wishes to automate this payment for
    the future, the agent should instead refer them to the setup process for <b>Bill
    Autopay</b>.

    - **Fees**: Core bill payments are generally free; however, for specific late-payment
    scenarios or specialised billers, refer to the <b>Bill Autopay — late bill convenience
    fee explained</b> for relevant charges.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: paysetu
- id: 1a3c08e8-3267-57c8-a2f5-a9c4a0985b98
  title: pay_bill tool reference
  body: 'The <b>pay_bill</b> tool facilitates the immediate transfer of funds from
    a PaySetu account to a registered biller.


    **Agent Action**: The agent executes the payment by calling this tool directly
    after confirming the biller details and funding source with the customer.


    **Arguments**:

    - <b>account_id</b>: The unique identifier of the account to be debited.

    - <b>biller_id</b>: The unique identifier for the utility or service provider.

    - <b>customer_reference_number</b>: The account or consumer number provided by
    the biller.

    - <b>amount</b>: The total amount to be paid in ₹.


    **Effect**: The specified amount is debited from the customer''s account and routed
    through the appropriate <b>Payment Rail</b> to the biller. A transaction ID is
    returned upon successful initiation.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: paysetu
- id: 0a684b03-9e0b-5f64-a9c0-baf2d4cae978
  title: When to use activate_card
  body: 'To ensure the security of our users, all physical cards—including the <b>PaySetu
    Prepaid Forex Card</b>—are shipped in an inactive state. Activation is a critical
    security step that must be completed before the card can be used for any transactions.


    **Activation Requirements**:

    - The customer must have the physical card in their possession.

    - The customer must have completed at least <b>Minimum-KYC</b>, though <b>Full-KYC</b>
    is recommended for higher spending limits.


    **Procedure**:

    1. **Verify Identity**: Use the standard verification flow to ensure the requester
    is the legitimate cardholder.

    2. **Identify Card**: Call <b>get_accounts</b> to locate the specific card account
    (using the last-4 digits of the card) and retrieve the <b>account_id</b>.

    3. **Verification of Possession**: Ask the customer to provide the CVV or a specific
    security code from the physical card to confirm they hold the card.

    4. **Execute Activation**: Call the <b>activate_card</b> tool using the <b>account_id</b>.

    5. **Confirmation**: Notify the customer that the card is now active and ready
    for use.


    **Security Warning**: Agents must never ask the customer to share their UPI PIN
    or account passwords during this process. The <b>activate_card</b> tool only requires
    the account identifier and verification of possession, not sensitive credentials.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: paysetu
- id: 4c0e1ce6-c0ab-5d07-a6a0-b5299334ef04
  title: activate_card tool reference
  body: 'The <b>activate_card</b> tool changes the status of a physical card from
    ''inactive'' or ''pending'' to ''active''.


    **Agent Action**: The agent performs this action by calling the tool directly
    once identity and physical possession of the card are confirmed.


    **Arguments**:

    - <b>account_id</b>: The unique identifier of the card account to be activated.


    **Effect**: The card is enabled for transactions across all supported networks.
    Once activated, the card can be used for POS, ATM, or online spends depending
    on the product type (e.g., <b>PaySetu Prepaid Forex Card</b>).'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: paysetu
- id: 89f526f6-9c2d-5b3f-83aa-7b1bc5982e40
  title: When to use dispute_status
  body: "PaySetu adheres to a 'fair-and-fast' philosophy for all transaction disputes,\
    \ following the RBI's harmonised turn-around-time (TAT). This policy outlines\
    \ how agents should provide updates on existing disputes related to <b>PaySetu\
    \ Wallet & UPI</b> or <b>PaySetu Digital Savings</b> transactions.\n\n**When to\
    \ use this procedure**:\n- When a customer inquires about the progress of a reported\
    \ failed transaction.\n- When a customer is seeking the outcome of a chargeback\
    \ request for a suspected fraudulent transaction.\n- When a customer wants to\
    \ know if a refund has been processed following a disputed payment.\n\n**Procedure**:\n\
    1. **Identity Verification**: Confirm the customer's identity through the required\
    \ security protocols.\n2. **Retrieve Transaction/Dispute ID**: Use <b>get_account_transactions</b>\
    \ to find the specific transaction in question or ask the customer for the dispute\
    \ reference number.\n3. **Check Status**: Call the <b>dispute_status</b> tool\
    \ providing the transaction or dispute identifier.\n4. **Communicate Outcome**:\
    \ \n   - If 'Under Review': Inform the customer of the current stage and the expected\
    \ RBI-mandated TAT for resolution.\n   - If 'Resolved - Refunded': Confirm the\
    \ amount in ₹ credited back to the account.\n   - If 'Resolved - Declined': Explain\
    \ the reason for the decline based on the tool's output.\n\n**Escalation Path**:\
    \ If a customer is dissatisfied with the dispute outcome, agents must guide them\
    \ through the tiered escalation path: first to the digital support team, then\
    \ to the Grievance Redressal Officer, and finally to the RBI Integrated Ombudsman\
    \ Scheme."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: paysetu
