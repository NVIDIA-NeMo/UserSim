- id: f93d5feb-9577-5eef-b228-a7350165b86c
  title: PaySetu Wallet & UPI — access or login problems
  body: "**Symptom**: 'I cannot log into my account' or 'I am seeing an authentication\
    \ error when trying to access my wallet.'\n\n**Likely Causes**\n* Incorrect credentials\
    \ or expired session tokens.\n* Device binding issues (logging in from a new or\
    \ unregistered device).\n* Temporary disruption in the **Payment Rail** connectivity.\n\
    * Account lock due to multiple failed MFA attempts.\n\n**Resolution Steps**\n\
    1. **Check Network Connectivity**: Ensure you have a stable data connection. Try\
    \ switching from Wi-Fi to mobile data.\n2. **Verify Device Binding**: If you have\
    \ changed your phone, tell us you are using a new device. We will trigger a new\
    \ device-binding verification process using your registered mobile number.\n3.\
    \ **Reset Credentials**: If you have forgotten your PIN or password, tell us you\
    \ need a reset. We will guide you through a secure identity verification process\
    \ before providing a reset link/OTP.\n4. **KYC Status Check**: If you are unable\
    \ to perform specific actions (like loading more than ₹10000), check if you are\
    \ still on **Minimum-KYC**. You may need to upgrade to **Full-KYC** to remove\
    \ these caps.\n\n**When to Escalate**\nIf you have followed the steps above and\
    \ still cannot access your account, or if you suspect your account was locked\
    \ due to unauthorised access attempts, tell us immediately. \n\n**Our Action**:\
    \ We will route the case to our security specialists to verify your identity and\
    \ manually unlock the account. You will receive a confirmation email and a secure\
    \ notification once access is restored.\n\n*Disclaimer: To protect your account,\
    \ PaySetu agents will never ask for your UPI PIN or OTP during the troubleshooting\
    \ process.*"
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
