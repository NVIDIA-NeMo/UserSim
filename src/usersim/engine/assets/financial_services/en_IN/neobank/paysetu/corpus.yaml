  title: PaySetu Wallet & UPI — check status or history
  body: 'Keeping track of your spends is seamless with the **PaySetu Wallet & UPI**
    hub. Follow these steps to review your transaction history and check the status
    of a specific payment.


    **Prerequisites**

    * An active PaySetu account

    * The PaySetu app installed and logged in


    **Steps to Check History**

    1. **Access Transactions**: From the home screen, select the ''Transactions''
    or ''Activity'' tab.

    2. **Filter by Product**: Use the filter toggle to select ''Wallet'' or ''UPI''
    to narrow down the results you are looking for.

    3. **Review List**: Browse through the chronological list of all debits and credits.
    Each entry will show the recipient, the amount in ₹, and the date.

    4. **View Specific Details**: Tap on any individual transaction to see the detailed
    status (e.g., ''Success'', ''Pending'', or ''Failed'') and the unique Transaction
