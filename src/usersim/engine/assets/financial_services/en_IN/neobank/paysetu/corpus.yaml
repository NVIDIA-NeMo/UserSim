- id: 268f922d-fc30-54dd-bf24-3a66662971d4
  title: PaySetu Wallet & UPI — fraud and unauthorized-activity protection
  body: "At PaySetu, we view compliance and security as your primary protection. The\
    \ **PaySetu Wallet & UPI** ecosystem is built on a strict 'verify-before-action'\
    \ stance to ensure your funds remain secure. \n\n**Common Fraud Patterns**\nBe\
    \ vigilant against 'Request Money' scams where fraudsters send a UPI collect request\
    \ pretending to be a prize or refund. Remember: you never need to enter your UPI\
    \ PIN to receive money. We also warn against phishing attempts where bad actors\
    \ pose as PaySetu support agents to 'verify' your account.\n\n**Our Zero-Tolerance\
    \ Security Rule**\nTo protect your assets, PaySetu agents will **never** request\
    \ the following sensitive credentials under any circumstances:\n* UPI PINs\n*\
    \ One-Time Passwords (OTPs)\n* Card CVVs\n\nIf any individual claiming to be from\
    \ PaySetu asks for these, it is a fraudulent attempt. Immediately cease communication.\n\
    \n**Immediate Action for Unauthorized Activity**\nIf you notice a transaction\
    \ you did not authorise or suspect your account has been compromised, notify us\
    \ immediately through our in-app chat or email. Suspected fraud is immediately\
    \ routed through our formal reporting and chargeback path to limit your liability.\
    \ \n\nWe adhere to the RBI's harmonised turn-around-time (TAT) for all failed\
    \ transactions. For payments that fail but where funds are debited, we work to\
    \ ensure the refund is processed within 5 days. \n\n*Disclaimer: PaySetu provides\
    \ financial literacy and product education, not individualised tax, legal, or\
    \ investment advice.*"
  domain: payments
  product_category: upi_wallet
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 5a7a4a5e-6fd5-5fb6-a772-0a7fcc808092
