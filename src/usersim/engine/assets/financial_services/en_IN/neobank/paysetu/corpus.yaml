- id: 6c048a13-8128-5d0b-9a87-73d0d62aeace
  title: PaySetu Prepaid Forex Card — risk disclosures
  body: 'The **PaySetu Prepaid Forex Card** is subject to the following regulatory
    and financial risks:


    **1. Currency Exchange Risk**

    Funds loaded onto the card are converted at the prevailing exchange rate. While
    the card protects you from volatility after loading, any subsequent conversions
    (e.g., spending in a third currency) will incur a **cross currency markup of 2%**.
    Exchange rates are subject to market fluctuations.


    **2. Fee Obligations**

    Users are responsible for all applicable charges, including the **issuance fee
    of ₹150**, the **reload fee of ₹100**, and the **atm withdrawal fee abroad of
    ₹200**. These fees are deducted as per the product terms.


    **3. Regulatory Compliance**

    Usage of this card is strictly governed by RBI and NPCI frameworks. Access to
    the card is contingent upon completing **Full-KYC**. Failure to maintain valid
    documentation may result in the suspension of card features.


    **4. Fund Security**

    While PaySetu employs strict ''verify-before-action'' security protocols, the
    user is responsible for safeguarding their PIN and CVV. All retail deposits are
    secure and insured by the DICGC up to ₹5,00,000 per depositor.


    **5. Transactional Limits**

    Spending and loading limits are determined by the user''s KYC tier. **Full-KYC**
    is mandatory for the higher limits required for international travel.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
