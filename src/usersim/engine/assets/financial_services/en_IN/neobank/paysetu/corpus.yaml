- id: adc1e556-7453-5635-9121-0cc7b780d135
  title: PaySetu Digital Savings — set up and activate
  body: 'Setting up your **PaySetu Digital Savings** account is a frictionless process
    designed to get you banking in minutes. Follow these steps to activate your account:


    1.  **Provide Basic Details**: Share your mobile number and email address. We
    will send a verification code to ensure your identity.

    2.  **Initial Identity Setup**: Provide your PAN and Aadhaar details. This allows
    us to create your account under the **Minimum-KYC** tier, giving you immediate
    access to basic banking functionality.

    3.  **Account Confirmation**: We will confirm once your account is active. You
    will see your account number and a starting **minimum balance** requirement of
    ₹0.

    4.  **Upgrade to Full-KYC**: To remove balance caps and unlock all features, you
    must complete the **Full-KYC** process. Provide the requested digital verification
    or biometric confirmation as prompted.

    5.  **Verification Deadline**: Ensure this process is finished within 30 days
    of your account opening. We will notify you via in-app alert once your **Full-KYC**
    status is approved.


    **How you know it worked:**

    Once activated, you will receive a confirmation message in the app, and your account
    dashboard will display your balance and the current **savings interest rate**
    of 3.5%. You can now begin funding your account via UPI or NEFT.'
