- id: 195dc612-0ee9-5d11-8560-4d13bba826bf
  title: General frequently asked questions
  body: '**How do I get started with PaySetu?**

    To begin your journey, you can open an account directly through our app. Depending
    on your needs, you can start with **Minimum-KYC** for basic wallet functionality
    or complete **Full-KYC** (PAN/Aadhaar) to unlock higher balance caps and full
    banking features.


    **How can I contact support?**

    Our support team is available 24/7 IST via in-app chat and email to assist you
    with any queries.


    **What happens if I have a dispute that isn''t resolved?**

    We follow a tiered escalation path. If first-level digital support cannot resolve
    your issue, your case is moved to a dedicated **Grievance Redressal Officer**.
    If you remain unsatisfied, you may approach the **RBI Integrated Ombudsman Scheme**.


    **Is my money safe with PaySetu?**

    Yes. All retail deposits are secure and insured by the **DICGC** up to ₹5,00,000
    per depositor.


    For detailed steps on account management, refer to the PaySetu Digital Savings
    — set up and activate guide.'
