- id: 7da2c304-c78a-50e1-845b-790514a99635
  title: PaySetu Digital Savings — account security best practices
  body: 'Your financial security is our priority. To keep your **PaySetu Digital Savings**
    account safe, please adhere to these essential security practices.


    **The PaySetu Golden Rule**

    Our agents will **never** ask you for your UPI PIN, OTPs, CVVs, or your full account
    password. Any request for these credentials—whether via chat, email, or phone—is
    a fraudulent attempt and should be reported immediately.


    **Best Practices for Account Holders**

    1. **Enable Multi-Factor Authentication (MFA):** Ensure MFA is active for all
    state-changing operations. This is our ''verify-before-action'' standard to protect
    your funds.

    2. **Secure Your Device:** Use biometric locks (fingerprint or face ID) on your
    mobile device to prevent unauthorised app access.

    3. **Monitor Your Transactions:** Regularly review your transaction history. Since
    our core banking is free and maintains a **minimum balance of ₹0**, any unexpected
    debit is a red flag.

    4. **Beware of Phishing:** Do not click on suspicious links claiming your account
    is ''blocked'' or requiring ''immediate KYC update'' via an external website.


    **What to do if you suspect fraud**

    If you notice an unauthorised transaction or believe your credentials have been
    compromised, notify us immediately through our in-app chat. We follow a ''fair-and-fast''
    philosophy and will immediately route your case through the formal reporting and
    chargeback path to limit your liability, adhering to RBI''s harmonised turn-around-time
    (TAT).


    *Disclaimer: Retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: security_advisory
