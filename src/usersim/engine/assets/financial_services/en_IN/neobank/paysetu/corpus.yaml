- id: b7ba8f15-8b79-57cd-8cb3-f39c51dd8e94
  title: Bill Autopay — a failed or pending action
  body: "**Symptom**: You receive a notification that a scheduled Bill Autopay transaction\
    \ has failed, or the payment status remains 'Pending' past the due date.\n\n**Likely\
    \ Causes**\n1. **Insufficient Funds**: The balance in your linked account was\
    \ lower than the bill amount at the time of the debit attempt.\n2. **Limit Breach**:\
    \ The bill amount exceeded the **mandate cap of ₹15000** and the required Additional\
    \ Factor Authentication (AFA) was not completed.\n3. **Payment Rail Downtime**:\
    \ A temporary technical glitch in the underlying **Payment Rail** (UPI/NEFT/IMPS)\
    \ used for the transfer.\n4. **Expired Mandate**: The authorisation period for\
    \ the mandate has lapsed.\n\n**What to Check**\n- Verify your available balance\
    \ to ensure it covers the bill amount.\n- Check if the bill amount has increased\
    \ beyond the **₹15000** non-AFA limit.\n- Review your notification history to\
    \ see if a pre-debit alert was sent **24 hours** prior.\n\n**The Fix**\n- **For\
    \ Insufficient Funds**: Top up your account and ask us to re-trigger the payment.\
    \ \n- **For Limit Breaches**: Provide the necessary authentication for the specific\
    \ transaction to allow it to proceed.\n- **For Technical Failures**: We will monitor\
    \ the transaction. If it remains pending, we follow the RBI's harmonised turn-around-time\
    \ (TAT) for failed transactions and refunds.\n\n**When to Escalate**\nIf a payment\
    \ is debited from your account but not credited to the biller after 3 business\
    \ days, we will raise a formal case with the biller and the payment rail provider.\
    \ You will receive a tracking ID and a resolution timeline via email."
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
