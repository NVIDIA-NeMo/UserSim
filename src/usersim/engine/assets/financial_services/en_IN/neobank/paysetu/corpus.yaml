- id: ff3021f0-e5ff-5b62-8a2b-284f1aad6691
  title: PaySetu Digital Savings — cancel, close, or downgrade
  body: 'If you wish to stop using your <b>PaySetu Digital Savings</b> account, follow
    these steps to ensure your funds are moved safely and the account is closed in
    compliance with RBI guidelines.


    **Prerequisites**

    - Ensure all pending <b>Mandates</b> or <b>bill_autopay</b> instructions linked
    to this account are cancelled.

    - Have an active external bank account (with IFSC and Account Number) to receive
    your remaining funds.


    **Steps to Close or Downgrade**

    1. **Request Closure:** Tell us that you wish to close your <b>PaySetu Digital
    Savings</b> account. We will first verify your identity using multi-factor authentication.

    2. **Balance Liquidation:** Provide the details of the external account where
    you want your remaining balance transferred. We will move the total balance, including
    any accrued interest from the savings interest rate of 3.5%, via the fastest available
    <b>Payment Rail</b>.

    3. **Confirmation of Zero Balance:** Once the transfer is successful, we will
    confirm that your account balance is ₹0.

    4. **Account Deactivation:** We will then proceed to formally close the account.
    You will receive a digital closure confirmation notice via email/chat.


    **Downgrading to Minimum-KYC**

    If you prefer to keep the account but wish to reduce your verification level,
    ask us to downgrade your status. Note that this will result in lower balance caps
    and limited functionality compared to the <b>Full-KYC</b> tier.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
