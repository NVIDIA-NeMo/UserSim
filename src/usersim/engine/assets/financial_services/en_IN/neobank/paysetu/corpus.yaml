- id: c2d70a96-de0f-5b28-9ed2-eefbc1c2f020
  title: PaySetu Wallet & UPI — make a change or update
  body: 'Updating your account details or upgrading your verification tier ensures
    you have uninterrupted access to your funds and the highest possible limits.


    **Task 1: Upgrading from Minimum-KYC to Full-KYC**

    * **Prerequisites**: Digital copies of your PAN card and Aadhaar card.

    * **Step 1**: Tell us that you wish to upgrade your KYC status to **Full-KYC**.

    * **Step 2**: Provide your PAN and Aadhaar details when prompted.

    * **Step 3**: Complete the biometric or OTP-based verification as guided.

    * **Outcome**: Once verified, we will confirm that your wallet balance cap has
    been increased from ₹10000 to ₹200000.


    **Task 2: Updating Linked Bank Account/UPI ID**

    * **Prerequisites**: An active bank account with mobile number linkage.

    * **Step 1**: Tell us you want to change your linked bank account for UPI.

    * **Step 2**: Provide the new bank account details or select the account from
    the discovered list via the **Payment Rail**.

    * **Step 3**: Authenticate the new link using your bank''s secure verification
    process.

    * **Outcome**: We will confirm that your new account is active and that you can
    now transfer up to the UPI per transaction limit of ₹100000.


    **Task 3: Updating Contact Information**

    * **Step 1**: Tell us the specific contact detail (email or phone) you wish to
    update.

    * **Step 2**: Provide the new updated information.

    * **Step 3**: Verify the change via a secure OTP sent to the new detail.

    * **Outcome**: We will confirm the update is complete across your profile.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
