    \ covers the purchase amount plus the cross currency markup of 2% (if spending\
    \ in a non-loaded currency) or the ATM withdrawal fee abroad of ₹200.\n   - *Fix:*\
    \ Ask us to reload your card. Note that a reload fee of ₹100 applies to this action.\n\
    2. **Security Freeze:** You may have accidentally frozen your card in the app\
    \ for security reasons.\n   - *Fix:* Ask us to check the card status. If it is\
    \ 'Frozen', ask us to unfreeze it. We will require multi-factor authentication\
    \ to complete this.\n3. **KYC Limit Reached:** You may have hit the balance cap\
    \ associated with <b>Minimum-KYC</b>.\n   - *Fix:* Ask us to initiate the <b>Full-KYC</b>\
    \ process. Once your PAN and Aadhaar are verified, your limits will be increased.\n\
    4. **Incorrect PIN:** The card may be blocked after multiple incorrect PIN attempts.\n\
    \   - *Fix:* Ask us to reset your card PIN. We will guide you through the secure\
    \ reset process.\n\n**When to escalate:**\nIf your balance is sufficient, the\
    \ card is active, and the PIN is correct, but the transaction still fails, we\
    \ will raise a technical case with our card network partner. You will receive\
    \ a ticket number and a resolution update within the RBI's harmonised turn-around-time\
    \ (TAT) for failed transactions.\n\n*Disclaimer: PaySetu provides financial literacy\
    \ and product education, not individualised tax, legal, or investment advice.*"
