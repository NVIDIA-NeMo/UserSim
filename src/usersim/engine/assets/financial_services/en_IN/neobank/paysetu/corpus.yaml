- id: 271350a1-69ba-5e66-afba-4c16065d9983
  title: PaySetu Digital Savings — limits, restrictions, and edge cases
  body: 'This internal guide outlines the operational boundaries for PaySetu Digital
    Savings to assist in customer support resolution.


    **Account Balance & Interest**

    * **Minimum Balance:** The account is designed for zero-barrier entry with a minimum
    balance requirement of ₹0. No penalties are applied for maintaining a zero balance.

    * **Interest Accrual:** The product offers a savings interest rate of 3.5%. Interest
    is calculated on the daily balance and credited to the account periodically.


    **KYC Tiers and Restrictions**

    Access to features is governed by the customer''s verification level:

    * **Minimum-KYC:** Users at this tier have limited wallet functionality and lower
    balance caps. They cannot access the full range of digital savings features.

    * **Full-KYC:** Required for higher wallet limits and full banking features. This
    involves comprehensive identity verification (PAN/Aadhaar).

    * **KYC Timeline:** Customers have exactly 30 days to complete Full-KYC from the
    date of account opening to maintain unrestricted access to all features. Failure
    to complete this within 30 days may lead to account restrictions.


    **Edge Cases & Compliance**

    * **Deposit Insurance:** All retail deposits are insured by the DICGC up to ₹5,00,000
    per depositor. Amounts exceeding this threshold are not covered by DICGC insurance.

    * **Transaction Rails:** Funds are moved via standard Payment Rails (UPI, IMPS,
    NEFT). Any delays are subject to the RBI''s harmonised turn-around-time (TAT)
    for failed transactions.

    * **Account State Changes:** Any operation that changes the account state (e.g.,
    changing contact details or increasing limits) must undergo multi-factor authentication
    or KYC-tier validation.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 4421b26a-3351-5750-b958-f470c101ee2d
  title: PaySetu Digital Savings — cost and charges
  body: '**What is the monthly or annual fee for maintaining a PaySetu Digital Savings
    account?**

    Core banking with PaySetu is free. There are no monthly maintenance fees or annual
    subscription charges for this account.


    **Is there a penalty if my balance drops to zero?**

    No. Our lean pricing model ensures there is a minimum balance requirement of ₹0.
    You will not be charged any fees for having a zero balance.


    **Are there any charges at all?**

    We only apply fees to recover direct costs for specialised services (such as forex).
    Standard savings operations are free. Some fees may be waived for high-balance
    users or specific promotional cohorts. For a full list of specialised service
    costs, please refer to PaySetu Digital Savings — fee schedule.


