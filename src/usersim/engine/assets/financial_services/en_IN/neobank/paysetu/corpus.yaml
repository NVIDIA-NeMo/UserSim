- id: 0b1fe6d9-8558-5abd-9f23-6a00254eb3b4
  title: Bill Autopay — check status or history
  body: 'Follow these steps to review your active mandates and see a history of your
    automated payments.


    **Prerequisites:**

    - An active PaySetu account with at least one configured Bill Autopay mandate.


    **Steps to Check Status and History:**

    1. **Request Mandate Overview:** Ask us to "show my active autopay mandates."
    We will provide a list of all current services you have authorised for automated
    debits, including the mandate limits and the next scheduled date.

    2. **Check Specific Payment Status:** To see if a particular bill was paid, tell
    us "check the status of my [Provider Name] bill for [Month]." We will confirm
    if the transaction is ''Successful'', ''Pending'', or ''Failed''.

    3. **Retrieve Payment History:** Ask us for your "autopay history for the last
    [Number] months." We will provide a detailed list of all debits made via Bill
    Autopay, including the date, amount, and the specific **Payment Rail** used for
    the transfer.

    4. **Verify Mandate Cap:** If you are unsure about your limits, ask "what is my
    current mandate cap?" We will confirm if your mandate is within the ₹15000 limit
    for non-AFA transactions.


    **How you know it worked:**

    You will receive a clear, formatted list or a confirmation message in the chat
    containing the exact dates and ₹ amounts of your transactions, providing a transparent
    audit trail of your spending.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. Retail deposits are insured by the DICGC up
    to ₹5,00,000 per depositor.*'
  domain: payments
  product_category: bill_autopay
