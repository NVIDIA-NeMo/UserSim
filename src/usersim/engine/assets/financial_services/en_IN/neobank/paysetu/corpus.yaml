- id: 5827a5f8-0ecd-55bd-aa55-c8fdc938e948
  title: PaySetu Wallet & UPI — cancel, close, or downgrade
  body: 'If you wish to stop using **PaySetu Wallet & UPI**, downgrade your account
    tier, or close your account entirely, follow these steps:


    **Prerequisites**

    * Ensure your current wallet balance is ₹0. You must transfer any remaining funds
    to your linked bank account or spend them before proceeding.

    * Ensure there are no pending transactions or active mandates linked to the wallet.


    **Steps to Close or Downgrade**

    1. **Request Closure/Downgrade:** Tell us whether you wish to close the account
    entirely or downgrade from **Full-KYC** back to **Minimum-KYC**.

    2. **Verification:** We will perform a final security check to ensure your identity
    and verify that your balance is ₹0.

    3. **Confirmation of Request:** We will confirm the specific action (Closure or
    Downgrade) and inform you of the effect on your limits (e.g., your balance cap
    will revert to ₹10,000 if downgrading).

    4. **Execution:** Once you provide final consent, we will process the request.

    5. **Final Notification:** You will receive a confirmation message stating that
    your account has been closed or your KYC status has been updated.


    **How you know it worked**

    * **For Closure:** You will no longer be able to access the wallet features via
    the app, and you will receive a formal closure confirmation.

    * **For Downgrade:** Your account settings will reflect **Minimum-KYC** status,
    and your maximum balance cap will be restricted to ₹10,000.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
