- id: d19f63a9-fa23-5006-8941-9a850400f49f
  title: Regulatory notes for retail_banking
  body: "PaySetu operates as a digital-first neobank strictly adhering to the frameworks\
    \ established by the **Reserve Bank of India (RBI)**. All retail banking operations\
    \ must be conducted with a focus on customer protection and transparency.\n\n\
    **Deposit Insurance:**\nAgents must clearly communicate to customers that all\
    \ retail deposits are insured by the **Deposit Insurance and Credit Guarantee\
    \ Corporation (DICGC)**. The insurance coverage is capped at ₹5,00,000 per depositor.\
    \ This is a fundamental protection provided to the customer.\n\n**KYC Compliance:**\n\
    Account functionality is strictly tied to the customer's verification tier. \n\
    1. **Minimum-KYC**: Allows limited wallet functionality and lower balance caps.\
    \ \n2. **Full-KYC**: Requires comprehensive identity verification via PAN and\
    \ Aadhaar. This is mandatory for customers seeking higher wallet limits and the\
    \ full suite of banking features.\n\n**Standard of Care:**\nOur posture is based\
    \ on **suitability and transparency**. We provide financial literacy and product\
    \ education to ensure customers fully understand the terms and conditions of our\
    \ products before onboarding. Agents are prohibited from providing individualised\
    \ tax, legal, or investment advice.\n\n**Operational Obligations:**\nAll agents\
    \ must ensure that state-changing operations are only performed after a strict\
    \ 'verify-before-action' check. Multi-factor authentication or validation of the\
    \ KYC-tier is required to prevent unauthorised account access and ensure compliance\
    \ with RBI's anti-money laundering (AML) guidelines."
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 5d3019e3-b438-59d3-8af4-d023feda7546
  title: Regulatory notes for cards
  body: "The issuance and management of cards at PaySetu, specifically the **PaySetu\
    \ Prepaid Forex Card**, are governed by RBI guidelines on Prepaid Payment Instruments\
    \ (PPIs). \n\n**PPI Limits and KYC:**\nAgents must ensure that card loading and\
    \ spending limits are strictly aligned with the customer's KYC status. **Full-KYC**\
    \ is required for higher loading limits and international spending capabilities.\
    \ Any attempt to bypass these limits is a violation of compliance frameworks.\n\
    \n**Security Protocols:**\nTo protect customers from financial loss, a strict\
    \ 'verify-before-action' stance is maintained. Multi-factor authentication is\
    \ mandatory for card activation and limit modifications. Agents are strictly forbidden\
    \ from requesting sensitive credentials, including **UPI PINs, OTPs, or CVVs**.\
    \ Any request for such information is a security breach.\n\n**Fraud Handling:**\n\
    In accordance with our 'fair-and-fast' philosophy, any suspected fraud involving\
    \ cards must be immediately routed through the formal reporting and chargeback\
    \ path. This process is designed to limit customer liability and ensure that the\
    \ investigation is handled within the stipulated regulatory timelines.\n\n**Transparency:**\n\
    All costs associated with card usage, including issuance and reload fees, must\
    \ be disclosed transparently to the customer prior to the transaction. This ensures\
    \ the customer is fully aware of the cost of the service, adhering to the RBI's\
    \ mandate on fair pricing and transparency in the cards ecosystem."
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 0e7b8cb4-cc62-5571-be2a-742048b11517
  title: Regulatory notes for payments
  body: 'Payment operations at PaySetu, including those utilizing the **Payment Rail**
    (UPI, IMPS, NEFT), must comply with the guidelines set by the **Reserve Bank of
    India (RBI)** and the **National Payments Corporation of India (NPCI)**.


    **Transaction Turn-Around-Time (TAT):**

    We adhere to the RBI''s harmonised turn-around-time (TAT) for all failed transactions
    and refunds. Agents must provide customers with accurate expectations regarding
    when funds will be reversed in the event of a technical failure on the payment
    rail.


    **Mandate Management:**

    When setting up a **Mandate** for automated recurring payments, agents must ensure
    the customer has provided explicit authorisation. This ''set-it-and-forget-it''
    utility must be managed such that customers can easily revoke or modify their
    instructions, as per NPCI guidelines on e-mandates.


    **UPI Ecosystem Integrity:**

    As a UPI-centric ecosystem, we maintain high standards for transaction security.
    Multi-factor authentication is mandatory for all payment initiations. Agents must
    never solicit the customer''s UPI PIN under any circumstances, as this is a critical
    security violation.


    **Fraud and Liability:**

    Suspected fraudulent payments must be routed immediately through the formal reporting
    path. Our goal is to resolve these disputes quickly to limit customer liability,
    following the ''fair-and-fast'' philosophy for all digital payment disputes.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: a0067951-bd0e-50e2-80da-5662dbdf4a11
  title: When to use get_account_transactions
  body: 'The `get_account_transactions` tool is the authoritative mechanism for retrieving
    a customer''s transaction history. It should be used whenever a customer asks
    about their spending, seeks a status update on a specific payment, or reports
    a discrepancy in their balance.


    **Usage Scenarios:**

    1. **Transaction Verification:** When a customer asks, "Did my last payment go
    through?" or "When was the last time I loaded my wallet?"

    2. **Balance Discrepancies:** When a customer reports an unexpected charge or
    a missing refund.

    3. **Spending Analysis:** When a customer wants to review their transactions over
    a specific period.


    **Operational Procedure:**


    1. **Identity Verification:** Ensure the customer''s identity is verified using
    the `verify_identity` tool before accessing any account data.

    2. **Account Identification:** If the customer provides only a partial account
    number (e.g., last 4 digits), use `get_accounts` to resolve the full `account_id`
    associated with that customer.

    3. **Parameter Selection:** Determine the required time range or transaction type
    based on the customer''s request.

    4. **Tool Execution:** Call `get_account_transactions` using the resolved `account_id`
    and the specified parameters.

    5. **Information Delivery:** Present the transaction details to the customer in
    a clear, professional manner, avoiding heavy banking jargon.


    If the customer requires a formal document for legal or tax purposes, agents should
    guide them toward the `get_statements` tool instead of simply listing transactions
    in the chat.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: paysetu
- id: 023bed5b-e8e0-55ea-8ebb-c72920bb2263
  title: get_account_transactions tool reference
  body: "The `get_account_transactions` tool retrieves a detailed list of transactions\
    \ for a specific account. \n\n**Tool Signature:**\n- **Arguments:** `account_id`\
    \ (required), `start_date` (optional), `end_date` (optional), `transaction_type`\
    \ (optional).\n- **Effect:** Returns a list of transaction objects including amount,\
    \ date, counterparty, and status.\n\n**Agent Execution:**\nThe agent performs\
    \ this action by calling the tool directly within the conversation. The agent\
    \ must not redirect the customer to the app or a website to view their history;\
    \ the data is fetched and presented by the agent in real-time after the identity\
    \ of the customer has been verified."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: paysetu
- id: 49c0a40f-4d71-586f-bc71-678324cb2ba5
  title: When to use make_upi_payment
  body: 'The `make_upi_payment` tool is used to initiate an immediate transfer of
    funds via the UPI payment rail. This tool is specifically for high-velocity, real-time
    transfers from the customer''s account or wallet to a recipient.


    **Usage Scenarios:**

    1. **Peer-to-Peer Transfers:** When a customer wants to send money to a friend
    or family member using a VPA (Virtual Payment Address).

    2. **Merchant Payments:** When a customer needs to pay a merchant instantly.

    3. **Wallet Outflows:** Moving funds from a PaySetu Wallet & UPI account to another
    bank account.


    **Operational Procedure:**


    1. **Identity Verification:** The agent must first verify the customer''s identity
    via `verify_identity`.

    2. **Account Resolution:** Use `get_accounts` to identify the correct `account_id`
    (source of funds) if not explicitly provided by the customer.

    3. **Payment Details:** Collect the recipient''s VPA, the exact amount in ₹, and
    a payment note if requested.

    4. **KYC Check:** Confirm that the customer''s current KYC tier (Minimum-KYC or
    Full-KYC) allows for the transaction amount based on their wallet/account limits.

    5. **Tool Execution:** Call `make_upi_payment` with the source `account_id`, destination
    VPA, and amount.

    6. **Confirmation:** Confirm the success or failure of the transaction to the
    customer immediately.


    **Security Warning:**

    Agents must never ask the customer for their UPI PIN to complete this action.
    The tool handles the transaction request; the final authorization happens securely
    via the customer''s device.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: paysetu
- id: 79f089b5-8081-5627-a809-db2b9e9746a2
  title: make_upi_payment tool reference
  body: 'The `make_upi_payment` tool executes a real-time fund transfer using the
    UPI payment rail.


    **Tool Signature:**

    - **Arguments:** `account_id` (required), `recipient_vpa` (required), `amount`
    (required), `remarks` (optional).

    - **Effect:** Initiates a debit from the specified account and a credit to the
    recipient VPA.


    **Agent Execution:**

    The agent performs this action by calling the tool directly. The agent must ensure
    all required arguments are collected from the customer and that identity has been
    verified. The agent must never request the customer''s UPI PIN, as the tool triggers
    the secure payment flow on the customer''s registered device.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: paysetu
- id: 29b32385-d4a8-5dd3-bcc1-99e829733ea7
  title: When to use add_upi_mandate
  body: 'The `add_upi_mandate` tool is used to set up a **Mandate**, allowing for
    automated, recurring debits from a customer''s account. This is the core mechanism
    for the Bill Autopay product, designed as a ''set-it-and-forget-it'' utility for
    regular payments.


    **Usage Scenarios:**

    1. **Recurring Utility Bills:** Setting up monthly payments for electricity, water,
    or internet.

    2. **Subscription Services:** Automating monthly payments for streaming or software
    services.

    3. **Scheduled Transfers:** Establishing a recurring payment to a specific recipient.


    **Operational Procedure:**


    1. **Identity Verification:** Verify the customer''s identity using `verify_identity`.

    2. **Account Resolution:** Use `get_accounts` to determine the source `account_id`
    for the recurring debit.

    3. **Mandate Details:** Collect the recipient VPA, the maximum amount to be debited
    (mandate cap), the frequency (e.g., monthly), and the start/end dates.

    4. **Compliance Check:** Ensure the mandate cap is within the limits allowed for
    the customer''s KYC tier (refer to the Bill Autopay — mandate cap without afa
    explained for specific limits).

    5. **Tool Execution:** Call `add_upi_mandate` with the `account_id` and the mandate
    parameters.

    6. **Confirmation:** Inform the customer that the mandate has been successfully
    created and explain when the first debit will occur.


    **Agent Obligation:**

    Agents must clearly explain the nature of the mandate—that it allows automated
    debits—to ensure the customer understands the terms before the mandate is activated.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_upi_mandate
  institution_id: paysetu
- id: 36e1fc18-bc7a-57c9-8b9e-6e1fc8cc6f24
  title: add_upi_mandate tool reference
  body: 'The **add_upi_mandate** tool allows an agent to create a customer-authorised
    instruction for automated recurring debits from a user''s account. This is used
    to facilitate the ''set-it-and-forget-it'' utility provided by **Bill Autopay**.


    **Tool Signature:**

    - `add_upi_mandate(account_id: string, mandate_details: object)`


    **Effect:**

    Executing this tool establishes a legal **Mandate** on the specified **Payment
    Rail**, enabling the automated movement of funds for recurring obligations.


    The agent performs this action by calling the tool directly within the conversation
    once the customer''s identity has been verified. The agent must never redirect
    the customer to a separate portal to create this mandate manually.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_upi_mandate
  institution_id: paysetu
- id: 509b89f2-1ca3-563e-af00-87a29c4157b3
  title: When to use load_wallet
  body: "The **load_wallet** procedure is used when a customer needs to add funds\
    \ to their **PaySetu Wallet & UPI** account from a linked bank account. This ensures\
    \ the user has a sufficient balance for high-velocity daily spends and instant\
    \ transfers.\n\n**Policy Guidelines:**\n1. **KYC Validation**: Before loading\
    \ funds, agents must verify the customer's KYC tier. Users with **Minimum-KYC**\
    \ are subject to lower balance caps compared to those with **Full-KYC**. \n2.\
    \ **Limit Checks**: Ensure the requested load amount does not exceed the current\
    \ balance limit allowed for the customer's specific KYC level.\n3. **Verification**:\
    \ A strict 'verify-before-action' stance is required. The agent must confirm the\
    \ funding source account.\n\n**Procedural Steps:**\n1. Use **get_accounts** to\
    \ identify the correct `account_id` for both the funding source and the destination\
    \ wallet.\n2. Verify the customer's identity and KYC status to ensure the load\
    \ amount is within permissible limits.\n3. Confirm the exact amount to be transferred\
    \ with the customer.\n4. Call the **load_wallet** tool to execute the fund transfer.\n\
    5. Confirm the successful update of the wallet balance to the customer.\n\nFor\
    \ details on specific wallet limits, refer to PaySetu Wallet & UPI — min kyc wallet\
    \ balance cap explained."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - load_wallet
  institution_id: paysetu
- id: c4c77a13-5d95-5213-89af-ede22ccf854c
  title: load_wallet tool reference
  body: 'The **load_wallet** tool is used to transfer funds from a linked bank account
    into the customer''s **PaySetu Wallet & UPI** balance.


    **Tool Signature:**

    - `load_wallet(account_id: string, amount: number, source_account_id: string)`


    **Effect:**

    This tool triggers a real-time transfer of the specified amount. It updates the
    wallet balance immediately upon successful execution via the underlying **Payment
    Rail**.


    The agent performs this action by calling the tool directly. The agent must first
    ensure the customer has passed identity verification and that the amount complies
    with the limits associated with their **Minimum-KYC** or **Full-KYC** status.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - load_wallet
  institution_id: paysetu
- id: d74e33f1-cc3f-5383-872d-94838c609a61
  title: When to use freeze_upi
  body: 'The **freeze_upi** procedure is a critical security action used to immediately
    suspend UPI functionality for a customer''s account. This is primarily used in
    response to suspected fraud, lost devices, or compromised credentials to limit
    customer liability.


    **Policy Guidelines:**

    1. **Urgency**: Suspected fraud must be routed through the formal reporting and
    chargeback path immediately. Freezing the account is the first line of defence.

    2. **Security First**: Because this is a state-changing operation, multi-factor
    authentication or KYC-tier validation is mandatory.

    3. **Agent Conduct**: Agents must never request sensitive credentials such as
    UPI PINs or OTPs during this process.


    **Procedural Steps:**

    1. Use **get_accounts** to retrieve the unique `account_id` associated with the
    customer''s UPI profile.

    2. Perform a strict identity verification to ensure the request is legitimate.

    3. Call the **freeze_upi** tool to disable all outgoing and incoming UPI transactions.

    4. Inform the customer that their UPI services are now frozen for their protection.

    5. Guide the customer through the formal fraud reporting process to initiate any
    necessary chargebacks.


    For further security guidance, see PaySetu Wallet & UPI — fraud and unauthorized-activity
    protection.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_upi
  institution_id: paysetu
- id: be37bc50-6811-5384-a86b-fa399c148d19
  title: freeze_upi tool reference
  body: 'The **freeze_upi** tool is used to immediately disable all UPI-based transactions
    (payments and receipts) for a specific account to prevent unauthorised access
    or fraud.


    **Tool Signature:**

    - `freeze_upi(account_id: string)`


    **Effect:**

    Calling this tool changes the account state to ''Frozen'', blocking all activity
    on the UPI **Payment Rail**. This action is reversible only through a formal unfreeze/verification
    process.


    The agent performs this action by calling the tool directly. This tool must only
    be used after the agent has verified the customer''s identity according to the
    ''verify-before-action'' security stance.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_upi
  institution_id: paysetu
- id: fa577b12-50a3-5ce9-a28f-5cd6ef012980
  title: When to use get_accounts
  body: 'The **get_accounts** procedure is the foundational step for almost all account-specific
    operations. It is used to retrieve a comprehensive list of all products a customer
    holds with PaySetu, including their unique internal identifiers.


    **Policy Guidelines:**

    1. **ID Resolution**: Agents must use this tool to resolve a customer''s human-readable
    account reference (e.g., the last 4 digits of an account number) into the system-required
    `account_id` before calling any other state-changing tool.

    2. **Transparency**: Agents may use the retrieved account details to confirm the
    exact product the customer is inquiring about (e.g., distinguishing between **PaySetu
    Digital Savings** and **PaySetu Wallet & UPI**).

    3. **Privacy**: Account details should only be shared with the customer after
    successful identity verification.


    **Procedural Steps:**

    1. Initiate the request for account information based on the customer''s query.

    2. Call the **get_accounts** tool to fetch the list of active accounts linked
    to the customer''s profile.

    3. Match the retrieved accounts against the customer''s provided details (e.g.,
    last 4 digits).

    4. Use the resulting `account_id` for all subsequent tool calls required to resolve
    the customer''s request.


    This tool is essential for ensuring that actions are performed on the correct
    financial product.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: paysetu
- id: 052308e4-f23f-5e32-ba3a-d17af261fc3c
  title: get_accounts tool reference
  body: 'The **get_accounts** tool retrieves a list of all financial accounts associated
    with a customer''s identity, providing the necessary `account_id` for other operations.


    **Tool Signature:**

    - `get_accounts()`


    **Effect:**

    Returns a list of account objects including product types (e.g., `digital_savings`,
    `upi_wallet`), current balances, and unique identifiers.


    The agent performs this action by calling the tool directly. It is a read-only
    operation used primarily to resolve the specific `account_id` needed for state-changing
    tools like **transfer_funds** or **freeze_upi**.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: paysetu
- id: cdd33014-b4b5-547e-b065-abf76966ed60
  title: When to use open_account
  body: 'The **open_account** procedure is used to onboard a customer to a new PaySetu
    product, providing a zero-barrier entry to digital banking.


    **Policy Guidelines:**

    1. **Suitability**: Agents must ensure the customer understands the product terms
    before onboarding, adhering to PaySetu''s standard of care for transparency.

    2. **KYC Requirements**: Customers must be informed that the features available
    will depend on their KYC tier. **Minimum-KYC** allows for basic functionality,
    while **Full-KYC** (requiring PAN/Aadhaar) is necessary for higher limits and
    full banking features.

    3. **Product Selection**: Agents should align the product with the customer''s
    needs (e.g., **PaySetu Digital Savings** for wealth foundation or **PaySetu Wallet
    & UPI** for daily spends).


    **Procedural Steps:**

    1. Verify the customer''s identity and eligibility for the requested product.

    2. Explain the key terms and conditions of the product to the customer.

    3. Collect any necessary onboarding data required by the system.

    4. Call the **open_account** tool, specifying the `product_id` (e.g., `digital_savings`).

    5. Confirm the successful account creation and provide the customer with their
    new account details.


    For a detailed guide on the onboarding process, see PaySetu Digital Savings —
    set up and activate.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: paysetu
- id: e03bc842-790f-56c7-879b-45df7bf31e55
  title: open_account tool reference
  body: 'The **open_account** tool is used to create a new financial account for a
    customer within the PaySetu ecosystem.


    **Tool Signature:**

    - `open_account(product_id: string, customer_details: object)`


    **Effect:**

    This tool initializes a new account based on the provided `product_id` (such as
    `digital_savings` or `upi_wallet`). It creates the necessary ledger entries and
    assigns a unique `account_id` to the customer.


    The agent performs this action by calling the tool directly. The agent must ensure
    all regulatory KYC requirements are acknowledged by the customer before execution.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: paysetu
- id: 0e54b065-e994-558b-8109-dc3b1b37bc1a
  title: When to use close_account
  body: 'The **close_account** procedure is used to permanently terminate a customer''s
    relationship with a specific PaySetu product. This is an irreversible action.


    **Policy Guidelines:**

    1. **Zero Balance Requirement**: Before closing an account, the agent must ensure
    that all funds have been transferred out. For **PaySetu Digital Savings**, any
    remaining balance must be moved to another account.

    2. **Irreversibility**: The agent must explicitly warn the customer that calling
    this tool is an irreversible operation.

    3. **Verification**: Due to the permanent nature of this action, the highest level
    of identity verification is required.


    **Procedural Steps:**

    1. Use **get_accounts** to identify the correct `account_id` for the account to
    be closed.

    2. Verify the account balance is ₹0. If funds remain, guide the customer to use
    **transfer_funds** first.

    3. Perform a strict identity verification and obtain explicit confirmation from
    the customer that they wish to close the account.

    4. Call the **close_account** tool.

    5. Confirm the closure to the customer and explain any final statement availability.


    For more information on downgrading instead of closing, see PaySetu Digital Savings
    — cancel, close, or downgrade.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: paysetu
- id: d6bddfcc-a1f3-5d38-9c59-d19678d79bf6
  title: close_account tool reference
  body: 'The **close_account** tool is used to permanently terminate a customer''s
    relationship with a specific PaySetu product. This is an **irreversible** action;
    once the account is closed, it cannot be reopened, and any remaining funds must
    be settled before execution.


    **Tool Signature:** `close_account(account_id: string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account to be closed.


    **Effect:**

    The tool triggers the formal closure process for the specified account. The agent
    performs this action by calling the tool directly within the conversation after
    the customer''s identity is verified and the account balance is confirmed as zero
    or transferred. This tool ensures the account is marked as closed in the core
    banking system and ceases all further interest accruals or fee applications.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: paysetu
- id: 29622f7d-fcfe-5918-87e5-8c9180251703
  title: When to use update_contact_info
  body: 'Maintaining accurate contact details is critical for security and regulatory
    compliance, ensuring that transaction alerts and mandatory notices reach the customer.
    Agents must use this procedure whenever a customer requests a change to their
    registered mobile number or email address.


    **Procedure:**

    1. **Verify Identity:** Use the required verification flow to ensure the customer
    is authorised to make changes to the profile.

    2. **Confirm Details:** Clearly document the new contact information (mobile number
    or email) and confirm the spelling/digits with the customer.

    3. **Identify Account:** If the customer provides a partial account number, use
    **get_accounts** to resolve the full `account_id` associated with the profile.

    4. **Execute Update:** Call the **update_contact_info** tool with the validated
    details to update the system of record.

    5. **Confirmation:** Inform the customer that the update is complete and a confirmation
    notification has been sent to both the old and new contact points.


    This process is strictly ''verify-before-action''. Agents must never update contact
    details based on unverified requests to prevent account takeover fraud. For guidance
    on account-specific changes, refer to PaySetu Digital Savings — make a change
    or update.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: paysetu
- id: 88434581-34f6-5542-ac5d-208967e6b128
  title: update_contact_info tool reference
  body: 'The **update_contact_info** tool allows agents to modify the primary contact
    details associated with a customer''s PaySetu profile.


    **Tool Signature:** `update_contact_info(account_id: string, contact_fields: object)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `contact_fields`: An object containing the keys to be updated (e.g., `email`,
    `phone_number`).


    **Effect:**

    Updates the customer''s contact information in the central database. The agent
    performs this action by calling the tool directly. This is a state-changing operation
    and requires multi-factor authentication or a verified session before the tool
    can be successfully invoked. All changes are logged for audit purposes to ensure
    compliance with RBI guidelines.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: paysetu
- id: 13e9d9a1-6273-5299-a6f3-aa06494b8abb
  title: When to use get_statements
  body: 'Customers may request account statements for tax filing, loan applications,
    or personal bookkeeping. PaySetu provides these digitally to maintain our friction-less,
    digital-native experience.


    **Procedure:**

    1. **Authentication:** Confirm the customer''s identity through the standard verification
    process.

    2. **Account Selection:** Use **get_accounts** to identify the specific `account_id`
    the customer wishes to generate a statement for.

    3. **Define Parameters:** Confirm the required date range (e.g., monthly, quarterly,
    or custom dates) and the preferred format (PDF/CSV).

    4. **Generate Statement:** Call the **get_statements** tool using the `account_id`
    and the agreed-upon date range.

    5. **Delivery:** Inform the customer that the statement has been generated and
    is available for download in the app or has been sent to their registered email.


    **Guidelines:**

    - Agents should not manually calculate balances or transaction totals; always
    rely on the output of the tool.

    - If the customer identifies a discrepancy in the generated statement, route them
    according to the guidance in PaySetu Digital Savings — a discrepancy in your records
    or statement.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: paysetu
- id: 944d3a3a-3506-54ec-ab19-d3d626fc3f60
  title: get_statements tool reference
  body: 'The **get_statements** tool retrieves official transaction records for a
    specified account over a defined period.


    **Tool Signature:** `get_statements(account_id: string, start_date: string, end_date:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `start_date`: The beginning date of the statement period (YYYY-MM-DD).

    - `end_date`: The ending date of the statement period (YYYY-MM-DD).


    **Effect:**

    Generates a comprehensive statement of all credits and debits. The agent performs
    this action by calling the tool directly. The tool is read-only and does not alter
    the account state. It ensures that the customer receives a legally compliant record
    of their financial activity within the PaySetu ecosystem.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: paysetu
- id: ec0a9811-8949-5da8-8655-5456c1c0aded
  title: When to use update_beneficiary
  body: 'Managing beneficiaries is a key part of financial orchestration. Customers
    may need to add new recipients, modify existing details, or delete old beneficiaries
    to ensure funds are sent to the correct destination.


    **Procedure:**

    1. **Verify Identity:** Perform a strict identity check. Because updating beneficiaries
    is a high-risk action, multi-factor authentication is mandatory.

    2. **Gather Details:** Collect the necessary beneficiary information, including
    the account number, IFSC code, and the name of the recipient.

    3. **Resolve Account:** Use **get_accounts** to ensure the `account_id` from which
    the beneficiary is being managed is correct.

    4. **Execute Update:** Call the **update_beneficiary** tool with the updated details.

    5. **Confirmation:** Notify the customer that the beneficiary list has been updated.
    Advise them that for security reasons, there may be a brief cooling-off period
    before high-value transfers to a new beneficiary are permitted.


    **Security Note:**

    Agents must never ask the customer for their UPI PIN or passwords to facilitate
    this update. Any request for such credentials should be treated as a security
    breach and reported via the formal fraud path.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: paysetu
- id: e8d7da24-0337-5c5b-b12d-ec5b04ac6cbc
  title: update_beneficiary tool reference
  body: 'The **update_beneficiary** tool is used to create, modify, or remove a saved
    recipient for fund transfers.


    **Tool Signature:** `update_beneficiary(account_id: string, beneficiary_details:
    object)`


    **Arguments:**

    - `account_id`: The unique identifier of the customer''s account.

    - `beneficiary_details`: An object containing the action (ADD/UPDATE/DELETE) and
    the recipient''s banking details (Name, Account Number, IFSC).


    **Effect:**

    Updates the customer''s saved beneficiary list. The agent performs this action
    by calling the tool directly. This is a state-changing operation. The tool ensures
    that all beneficiary data is stored securely and adheres to the ''verify-before-action''
    stance of PaySetu.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: paysetu
- id: 7ecc1977-5a65-5f7d-8f90-6a84ceb6ce3f
  title: When to use set_alerts
  body: 'Real-time notifications help our users maintain a seamless financial experience.
    Agents should assist customers in configuring alerts to track spending, monitor
    low balances, or receive security notifications.


    **Procedure:**

    1. **Identify Needs:** Determine which types of alerts the customer wants to activate
    (e.g., transaction alerts, balance thresholds, or mandate reminders).

    2. **Verify Account:** Use **get_accounts** to identify the `account_id` to which
    the alerts should be applied.

    3. **Configure Thresholds:** For balance alerts, confirm the specific ₹ amount
    that should trigger the notification.

    4. **Execute Configuration:** Call the **set_alerts** tool with the account ID
    and the desired alert parameters.

    5. **Confirmation:** Confirm to the customer that their preferences have been
    saved and they will receive notifications via their registered contact methods.


    **Proactive Advice:**

    Encourage customers to set alerts for their PaySetu Wallet & UPI to better manage
    their daily spends and avoid transaction failures due to insufficient funds.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: paysetu
- id: 2968c20e-fc48-5e6a-8a2a-ec36b8b883c4
  title: set_alerts tool reference
  body: 'The **set_alerts** tool configures automated notifications for a customer''s
    account based on specific triggers.


    **Tool Signature:** `set_alerts(account_id: string, alert_preferences: object)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `alert_preferences`: An object defining the types of alerts (e.g., `low_balance`,
    `large_transaction`) and the associated trigger values (e.g., `threshold_amount`).


    **Effect:**

    Updates the notification settings for the account. The agent performs this action
    by calling the tool directly. This is a state-changing operation that allows customers
    to have better visibility into their account activity and enhances the overall
    security of the account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: paysetu
- id: 97c53b4d-d23e-57a6-b4a4-cf74d2bd9b76
  title: When to use transfer_funds
  body: 'The **transfer_funds** procedure is used for moving money between a customer''s
    own accounts or to another verified account using various payment rails (e.g.,
    IMPS, NEFT).


    **Procedure:**

    1. **Verification:** Confirm the customer''s identity. Multi-factor authentication
    is mandatory for all fund transfers.

    2. **Source and Destination:** Identify the source `account_id` and the destination
    account details. Use **get_accounts** to resolve internal account IDs if the customer
    provides a last-4 digit reference.

    3. **Amount Confirmation:** Confirm the exact amount in ₹ to be transferred. Ensure
    the customer is aware of any applicable fees as per the Institution-wide fees
    and charges.

    4. **Execute Transfer:** Call the **transfer_funds** tool with the source account,
    destination account, and amount.

    5. **Completion:** Provide the transaction reference number to the customer and
    confirm the updated balance of the source account.


    **Compliance and Security:**

    - Agents must ensure the transfer does not exceed the limits associated with the
    customer''s KYC tier (Minimum-KYC vs Full-KYC).

    - If a transaction fails, follow the ''fair-and-fast'' philosophy and the RBI''s
    harmonised turn-around-time (TAT) for refunds. For more on this, refer to PaySetu
    Wallet & UPI — failed refund turnaround days explained.'
