- id: 4054da8f-29ba-55ec-a2f6-a3ca6bea61e6
  title: PaySetu Wallet & UPI — set up and activate
  body: 'Setting up your **PaySetu Wallet & UPI** is a frictionless process designed
    to get you spending in minutes. Follow these steps to activate your account:


    1. **Provide Basic Details:** Tell us your mobile number and basic identity details
    to initiate the account opening. We will confirm once your basic profile is created.

    2. **Complete Minimum-KYC:** Provide the basic verification documents requested.
    Once we confirm this is successful, your wallet is activated with a wallet balance
    cap of ₹10000.

    3. **Link Your Bank Account:** Share the account details you wish to link to the
    UPI **Payment Rail**. We will verify the link and confirm when your UPI ID is
    active.

    4. **Set Your UPI PIN:** Create a secure UPI PIN. We will notify you once the
    PIN is set and your account is ready for transactions up to the UPI per transaction
    limit of ₹100000.

    5. **Upgrade to Full-KYC (Optional):** If you require a higher limit, provide
    your PAN and Aadhaar for comprehensive verification. We will notify you once your
    wallet balance cap has been increased to ₹200000.


    Your setup is complete when you receive the ''Account Ready'' confirmation and
    can see your current balance cap reflected in your account settings.'
