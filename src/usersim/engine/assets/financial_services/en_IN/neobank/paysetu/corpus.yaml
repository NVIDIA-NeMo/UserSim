- id: f89fa7db-96d4-5485-9f1d-438023c5bffc
  title: PaySetu Digital Savings — eligibility and setup
  body: '**Who is eligible to open a PaySetu Digital Savings account?**

    Any tech-savvy individual with a valid PAN and Aadhaar can open an account. Our
    goal is to provide a zero-barrier entry to digital banking.


    **How do I complete the setup process?**

    You can start with Minimum-KYC for basic functionality. However, to unlock full
    banking features and higher limits, you must complete Full-KYC. This requires
    submitting your PAN and Aadhaar for comprehensive identity verification.


    **Is there a time limit to finish my verification?**

    Yes. You must complete the Full-KYC process within 30 days of opening your account
    to ensure uninterrupted access to all features and to avoid account restrictions.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
