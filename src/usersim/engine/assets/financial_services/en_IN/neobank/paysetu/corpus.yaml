- id: 7214734e-471e-5754-be07-2c5e01b3e67d
  title: Bill Autopay — getting started walkthrough
  body: 'This guide is for support agents to assist customers in onboarding for **Bill
    Autopay**, our ''set-it-and-forget-it'' utility for automated recurring payments.


    **Product Core Details**

    - **Purpose**: Automates recurring bills (Electricity, Water, OTT, etc.) using
    a secure **Mandate**.

    - **Payment Rail**: Utilises UPI/NPCI infrastructure for seamless movement of
    funds.

    - **Key Limit**: The **mandate cap without AFA** is ₹15,000. Transactions above
    this threshold require Additional Factor Authentication (AFA).

    - **Notification**: Customers receive a pre-debit notification **24 hours** before
    the money leaves their account.

    - **Fees**: Core banking is free; however, a **late bill convenience fee** of
    ₹20 is applied if a payment is processed late due to specific service recovery
    needs.


    **Step-by-Step Setup Walkthrough**

    1. **KYC Check**: Ensure the customer has completed **Full-KYC** for unrestricted
    access to higher limits. If they are on **Minimum-KYC**, they may face balance
    caps.

    2. **Biller Selection**: Guide the customer to the ''Payments'' section and select
    ''Bill Autopay''. They must choose the registered biller from the list.

    3. **Mandate Creation**: The customer provides the customer ID/Account number
    of the biller and sets the maximum limit for the debit.

    4. **Authentication**: The customer authorises the **Mandate** using their UPI
    PIN.

    5. **Confirmation**: Once authorised, the customer will see the mandate listed
    as ''Active'' in their dashboard.


    **Agent Note**: Remind the customer that they will be notified **24 hours** before
    every debit, ensuring full transparency.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 40919513-1df2-5367-89cf-db08ece7e626
  title: Bill Autopay — late bill convenience fee explained
  body: '**What is the late bill convenience fee?**

    To recover direct costs associated with specialised recovery services for delayed
    payments, PaySetu charges a **late bill convenience fee** of ₹20. This is not
    a penalty for the customer, but a cost-recovery fee for the service used to ensure
    the bill is eventually settled.


    **When is this fee applied?**

    This fee is applied when a recurring payment fails on the primary date and requires
    manual intervention or a secondary recovery process to be completed.


    **Can this fee be waived?**

    Yes. In line with our lean pricing model, fees may be waived for high-balance
    users or specific promotional cohorts. Please refer to **Bill Autopay — overview**
    for more details on our pricing philosophy.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
