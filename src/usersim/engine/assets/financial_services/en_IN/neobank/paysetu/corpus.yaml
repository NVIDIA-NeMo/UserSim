- id: 3dea3c5e-cd11-52ae-a577-6128807b8d37
  title: Bill Autopay — a declined or blocked action
  body: "**Symptom:** You receive a notification that your automated bill payment\
    \ was declined, or you are unable to set up a new mandate.\n\n**Likely Causes:**\n\
    - **Insufficient Funds:** Your account balance was lower than the bill amount\
    \ at the time of the debit.\n- **Mandate Limit Exceeded:** The bill amount exceeds\
    \ the ₹15000 mandate cap for transactions without Additional Factor Authentication\
    \ (AFA).\n- **KYC Restrictions:** You are on **Minimum-KYC**, and the payment\
    \ exceeds your current tier's balance or transaction caps.\n- **Incorrect Mandate\
    \ Details:** The billing instructions provided to the service provider do not\
    \ match your PaySetu account details.\n\n**What to Check (In Order):**\n1. **Balance\
    \ Check:** Verify your current balance. If it is lower than the bill amount, top\
    \ up your account.\n2. **Amount Check:** Check if the bill is over ₹15000. If\
    \ it is, you will need to provide additional authentication to clear the payment.\n\
    3. **KYC Status:** Check if you have completed **Full-KYC**. If not, your transaction\
    \ may be blocked by regulatory limits.\n\n**The Fix:**\n- **For Insufficient Funds:**\
    \ Add funds to your account and ask us to \"retry the failed autopay.\" \n- **For\
    \ Limit Issues:** If the bill is above ₹15000, we will guide you through the multi-factor\
    \ authentication process to authorise the higher amount.\n- **For KYC Issues:**\
    \ Provide your PAN and Aadhaar details to upgrade to **Full-KYC**, which removes\
    \ basic wallet caps.\n\n**When to Escalate:**\nIf funds are available and KYC\
    \ is complete but the payment still fails, tell us. We will raise a technical\
    \ case with our payments team and the relevant **Payment Rail** operator. You\
    \ will receive an update on the resolution within the RBI-mandated turnaround\
    \ time (TAT).\n\n*Disclaimer: PaySetu provides financial literacy and product\
    \ education, not individualised tax, legal, or investment advice. Retail deposits\
    \ are insured by the DICGC up to ₹5,00,000 per depositor.*"
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 316bed3a-f08e-5d5d-bca1-db3ad3063889
  title: Bill Autopay — when to switch or upgrade
  body: 'Deciding whether to use Bill Autopay or transition to another method depends
    on your transaction volume and preferences.


    **When to use Bill Autopay:**

    - For recurring utilities (Electricity, Water, Internet) where convenience is
    priority.

    - When your monthly bills are typically under the ₹15000 non-AFA limit, allowing
    for a truly ''set-it-and-forget-it'' experience.

    - When you want a 24 hours pre-debit notification to manage your liquidity.


    **When to switch to Manual Payments (UPI Wallet):**

    - For variable bills that fluctuate wildly in amount, where you prefer to review
    each invoice before paying.

    - For very high-value payments that consistently exceed ₹15000, to avoid repeated
    AFA prompts.


    **When to upgrade your Account Tier:**

    - If your autopayments are frequently blocked due to balance caps, upgrade from
    **Minimum-KYC** to **Full-KYC** to enable higher wallet limits.


    **Summary:**

    Bill Autopay is best for the tech-savvy user seeking frictionless orchestration
    of daily utilities. For high-velocity, irregular spends, the PaySetu Wallet &
    UPI is a more flexible choice.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. Retail deposits are insured by the DICGC up
    to ₹5,00,000 per depositor.*'
  domain: payments
  product_category: bill_autopay
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 38b4add5-390a-5dd3-b11a-5b2e6d51fff5
  title: Bill Autopay — comparison vs. alternatives and when not to choose it
  body: 'Bill Autopay is designed as the ''set-it-and-forget-it'' utility for automated
    recurring payments. To help you choose the right tool, here is how it compares
    to other payment methods.


    **Bill Autopay vs. Manual UPI Transfers**

    - **Effort:** Bill Autopay is automated; Manual UPI requires active initiation
    for every bill.

    - **Control:** Manual UPI offers total control over the exact second funds leave
    your account, whereas Bill Autopay triggers based on the provider''s schedule
    (with a 24 hours pre-debit notification).

    - **Limits:** Bill Autopay allows seamless debits up to ₹15000 without AFA; manual
    transfers always require a PIN.


    **Bill Autopay vs. Traditional Bank Standing Instructions (SI)**

    - **Transparency:** PaySetu provides a digital-native experience with instant
    notifications and easy in-app mandate management, whereas traditional SIs often
    lack real-time visibility.

    - **Flexibility:** Modifying or cancelling a mandate at PaySetu is near-instant,
    unlike the paperwork often required by legacy banks.


    **When NOT to choose Bill Autopay:**

    - **Highly Volatile Bills:** If your bill amounts vary significantly and you wish
    to audit every single charge before it is paid to avoid errors.

    - **Very High-Value Recurring Payments:** If your recurring obligation is consistently
    and significantly above ₹15000, the need for frequent AFA may diminish the ''friction-less''
    benefit of automation.

    - **Low-Balance Accounts:** If you struggle to maintain a consistent balance,
    the risk of a failed payment and a resulting late bill convenience fee of ₹20
    may make manual payments more attractive.


    **Best Fit:**

    Ideal for millennial and Gen Z users with stable utility costs who value time-saving
    automation and transparency over manual oversight.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. Retail deposits are insured by the DICGC up
    to ₹5,00,000 per depositor.*'
  domain: payments
  product_category: bill_autopay
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 1bd24e75-1c9e-552d-81ce-5c94a8ccfcd2
  title: Bill Autopay — eligibility and setup
  body: '**Who is eligible to use Bill Autopay?**

    Any customer with a PaySetu account can set up autopay. However, your overall
    transaction and balance limits will depend on whether you have completed **Minimum-KYC**
    or **Full-KYC**.


    **How do I start the setup process?**

    Simply tell us which biller you want to automate. We will guide you through the
    mandate creation process, where you authorise the biller to debit your account.


    **Can I set up autopay for any biller?**

    You can set up autopay for any biller supported by our integrated **Payment Rail**
    network. If a biller is not listed, you can still make manual payments using our
    standard payment tools.


    For more details on managing your setup, see Bill Autopay — set up and activate.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice. Retail deposits are insured by the DICGC up
    to ₹5,00,000 per depositor.*'
