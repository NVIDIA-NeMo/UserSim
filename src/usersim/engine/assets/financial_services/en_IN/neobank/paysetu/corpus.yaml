- id: a7efcd1e-adac-59a6-808c-8ef0e5625ec6
  title: PaySetu Digital Savings — privacy and data handling
  body: 'This disclosure explains how PaySetu handles your data in relation to the
    **PaySetu Digital Savings** account, adhering to RBI and NPCI frameworks.


    **Data Collection for KYC**

    To provide banking services, we collect identity documents (PAN, Aadhaar) to facilitate
    **Full-KYC**. This data is used strictly for identity verification and regulatory
    compliance. We track the **full-KYC completion days** (a window of **30 days**)
    to ensure your account remains compliant with Indian banking laws.


    **Transaction Monitoring**

    We monitor transactions flowing through various **Payment Rails** (UPI, IMPS,
    NEFT) to protect you from fraud. This monitoring is part of our ''verify-before-action''
    security stance. Any suspected fraud is routed through a formal reporting path
    to limit your liability.


    **Data Sharing and Privacy**

    Your data is shared only with authorized regulatory bodies (such as the RBI) or
    essential service providers required to maintain your account. We do not sell
    your personal financial data to third-party marketers.


    **Your Rights**

    Customers may request a summary of the data held by PaySetu. Any updates to your
    data must be verified via multi-factor authentication to prevent unauthorized
    changes. Your deposits remain secure and are insured by the DICGC up to ₹5,00,000
    per depositor.


    **Regulatory Framework**

    Our data handling practices are designed to frame compliance as customer protection.
    We adhere to the strict privacy standards mandated for neobanking operations in
    India, ensuring transparency in how your digital wealth is managed.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
