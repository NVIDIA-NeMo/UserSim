    \ are provided free of charge to ensure a zero-barrier entry to digital banking.\
    \ Fees are only applied to recover direct costs associated with specialised services.\n\
    \n**General Fee Principles:**\n- **Core Banking:** No monthly maintenance fees\
    \ or account opening charges for standard retail accounts.\n- **Specialised Services:**\
    \ Fees apply to specific activities such as **forex conversions** or particular\
    \ **convenience services**. \n- **Fee Waivers:** We may waive applicable fees\
    \ for customers within promotional cohorts or those maintaining high-balance accounts.\n\
    \nFor specific charges related to your accounts, please refer to the individual\
    \ schedules such as PaySetu Digital Savings — fee schedule or PaySetu Wallet &\
    \ UPI — fee schedule. All fees are transparently listed and updated in accordance\
    \ with regulatory guidelines.\n\n*Disclaimer: All fees are subject to applicable\
