- id: c5fb161e-c4ac-5211-9b04-aaeec6f04e17
  title: PaySetu Wallet & UPI — a declined or blocked action
  body: '**Symptom**

    You receive a message stating ''Transaction Declined'', ''Action Blocked'', or
    ''Limit Exceeded'' when attempting to make a payment or add money to your wallet.


    **Likely Causes**

    1. **KYC Limit Breach**: You are attempting to exceed the balance cap of your
    current verification tier.

    2. **Transaction Cap**: The payment exceeds the per-transaction limit.

    3. **Security Block**: The system has detected unusual activity and triggered
    a ''verify-before-action'' block.


    **What to check in order**

    1. **Check your KYC Status**: Verify if you are on Minimum-KYC or Full-KYC. If
    you are on Minimum-KYC, remember there is a wallet balance cap of ₹10000. If you
    are on Full-KYC, the wallet balance cap is ₹200000.

    2. **Verify the Amount**: Check if your single transaction exceeds the upi per
    transaction limit of ₹100000.

    3. **Authentication**: Ensure you have completed the required multi-factor authentication
    for the request.


    **The Fix**

    * **For Limit Issues**: If you have hit the ₹10000 cap, provide your PAN and Aadhaar
    to upgrade to Full-KYC. This will increase your limit to ₹200000.

    * **For Transaction Issues**: If the amount is over ₹100000, split the payment
    into smaller transactions (subject to daily bank limits).

    * **For Security Blocks**: Provide the requested verification to unlock the action.


    **When to escalate**

    If you have sufficient balance and are within all limits, but the action is still
    blocked, tell us. We will raise a technical case with our payments team and notify
    you via in-app chat once the block is cleared.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
