- id: 6b290f96-d5ef-5037-8f3d-75a33e97f55a
  title: PaySetu Prepaid Forex Card — recognizing scams targeting this product
  body: 'As you compare your international spending options, it is vital to understand
    the specific fraud patterns targeting travel-related financial products. Scammers
    often target the <b>PaySetu Prepaid Forex Card</b> by impersonating our support
    team or travel agents, claiming there is a ''blocking issue'' with your card or
    a ''verification error'' that requires immediate action to prevent the card from
    being frozen during your trip.


    **Common Scam Patterns:**

    - **The Urgent Verification Trap:** You receive a call or message stating that
    your <b>PaySetu Prepaid Forex Card</b> needs a security update. They may ask you
    to ''confirm'' your details to avoid a service interruption.

    - **The Refund Bait:** Fraudsters may claim you were overcharged on your cross
    currency markup of 2% and offer a refund, provided you share your card details
    or a one-time password (OTP).

    - **The Third-Party Load Offer:** Be wary of individuals offering to load your
    card at a ''discounted exchange rate'' outside of our official app channels.


    **Our Strict Security Standard:**

    PaySetu maintains a strict ''verify-before-action'' stance. To protect your funds,
    please remember that **PaySetu agents will never request your UPI PIN, OTPs, or
    CVV**. Any request for these credentials is a confirmed scam.


    **What to do if something looks wrong:**

    If you suspect fraudulent activity or have shared sensitive details, you must
    notify us immediately. Suspected fraud is routed through our formal reporting
    and chargeback path to limit your liability. Acting quickly ensures we can freeze
    the card and initiate the recovery process.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
