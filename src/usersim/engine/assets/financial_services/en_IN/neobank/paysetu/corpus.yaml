- id: 57e5e52e-5c34-57b3-86f3-069952812556
  title: PaySetu Digital Savings — savings interest rate explained
  body: '**How is interest calculated on my PaySetu Digital Savings account?**

    Interest is calculated on your daily closing balance at a savings interest rate
    of 3.5%. This ensures that every rupee you keep in the account earns value every
    single day.


    **When is the interest credited to my account?**

    Interest is credited periodically to your account. You can view your earned interest
    in your transaction history. For a detailed view of how these rates are applied,
    please refer to <b>PaySetu Digital Savings — how rates are tiered and applied</b>.


    **Does the interest rate change based on my balance?**

    Currently, the savings interest rate of 3.5% is applied uniformly to the balances
    in your <b>PaySetu Digital Savings</b> account, regardless of whether you maintain
    a high balance or the minimum balance of ₹0.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
