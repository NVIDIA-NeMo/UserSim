- id: 3a5bfe05-c92e-587f-87c9-2558aabf8d08
  title: Bill Autopay — mandate pre debit notification hours explained
  body: '**How much notice do I get before an autopay transaction occurs?**

    To ensure you have full visibility over your funds, PaySetu sends a pre-debit
    notification 24 hours before the scheduled mandate execution. This gives you a
    clear window to ensure your balance is sufficient.


    **What happens if I don''t have enough funds after the notification?**

    If the balance is insufficient at the time of execution, the transaction will
    fail. Depending on the biller, this may result in a late fee from the provider.
    If you use our recovery services to settle the late bill, a late bill convenience
    fee of ₹20 may apply.


    **Can I change the notification timing?**

    No, the notification window is fixed at 24 hours to comply with our transparency
    standards and ensure customers are not surprised by automated debits.


    For more details on costs, please refer to **Bill Autopay — fee schedule**.'
  domain: payments
  product_category: bill_autopay
