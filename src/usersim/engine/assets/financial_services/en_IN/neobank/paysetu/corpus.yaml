- id: 6524c1ae-ff1e-52e0-83e7-8dc08793db24
  title: Bill Autopay — cancel, close, or downgrade
  body: 'If you no longer require an automated payment for a specific service, follow
    these steps to cancel or modify your **Mandate**.


    **Prerequisites:**

    - You must be logged into your PaySetu account with your active session.

    - You must have the specific biller identified in your active mandates list.


    **Steps to Cancel or Close a Mandate:**

    1. Tell us which specific biller mandate you wish to cancel (e.g., "Cancel my
    autopay for Airtel Broadband").

    2. We will display the current mandate details, including the maximum limit (e.g.,
    the ₹15000 AFA-exempt cap) and the next scheduled date, for your confirmation.

    3. Confirm the cancellation by providing your secondary authentication (OTP or
    biometric).

    4. We will provide a confirmation reference number and a notification stating
    that the mandate has been successfully revoked.


    **Steps to Downgrade/Modify a Mandate:**

    1. Tell us the biller and the new maximum limit you wish to set for the mandate.

    2. If the new limit is above ₹15000, we will notify you that Additional Factor
    Authentication (AFA) will be required for each single transaction exceeding this
    amount.

    3. Confirm the change via multi-factor authentication.

    4. We will confirm the updated mandate terms and the effective date of the change.


    **How you know it worked:**

    - For cancellations: You will receive a ''Mandate Revoked'' notification in the
    app.

    - For modifications: Your mandate dashboard will reflect the new limit and authentication
    requirements immediately.'
