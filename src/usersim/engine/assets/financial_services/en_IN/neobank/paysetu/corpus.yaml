- id: 4487869a-a5b3-5ee8-a556-cbe7cf3fd823
  title: PaySetu Digital Savings — recognizing scams targeting this product
  body: 'As you compare digital banking options, it is vital to understand how scammers
    target high-yield savings accounts. At PaySetu, we prioritise your protection
    and adhere strictly to RBI and NPCI frameworks to keep your funds secure.


    **Common Scam Patterns**

    Be wary of ''Urgent Verification'' scams. Fraudsters may contact you claiming
    that your PaySetu Digital Savings account will be frozen unless you ''re-verify''
    your identity immediately. They often use fake screenshots or official-looking
    emails to create panic. Another common tactic is the ''Interest Bonus'' scam,
    where attackers promise an interest rate higher than our standard 3.5% if you
    transfer funds to a ''special investment wallet''.


    **Our Zero-Tolerance Security Policy**

    PaySetu employees and agents will **never** request the following sensitive credentials
    under any circumstances:

    * Your UPI PIN

    * One-Time Passwords (OTPs)

    * CVV numbers

    * Full account passwords


    If an agent or a third party asks for these, it is a fraudulent attempt to access
    your money. We employ a strict ''verify-before-action'' stance, requiring multi-factor
    authentication for all state-changing operations.


    **Immediate Action Steps**

    If you notice an unauthorised transaction or suspect your account has been compromised:

    1. Report the incident to us immediately via our in-app chat or email.

    2. We will immediately route the case through our formal reporting and chargeback
    path to limit your liability, adhering to the ''fair-and-fast'' philosophy and
    RBI''s harmonised turn-around-time (TAT).


    Your deposits are secure and insured by the DICGC up to ₹5,00,000 per depositor,
    providing you with peace of mind as you manage your digital wealth.


    ***

    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: retail_banking
  product_category: digital_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
