- id: bb1dd695-a3de-56ef-9b1a-773188463b34
  title: Bill Autopay — an unexpected charge or amount
  body: '**Symptom:** You notice a debit from your account via **Bill Autopay** that
    is for a higher amount than expected, or a charge you do not recognise.


    **Likely Causes:**

    - **Biller Price Hike:** The service provider increased their monthly tariff.

    - **Variable Billing:** The bill is based on usage (e.g., electricity) rather
    than a flat subscription.

    - **Convenience Fee:** A late bill convenience fee of ₹20 was applied due to a
    delayed payment recovery.

    - **Unauthorized Activity:** A mandate was created or modified without your knowledge.


    **What to check in order:**

    1. **Check the Notification:** Look back at the pre-debit notification sent 24
    hours before the charge. This notification contains the exact amount to be debited.

    2. **Verify Mandate Limits:** Check if the amount is within your set limit. Remember
    that mandates up to ₹15000 can be processed without AFA.

    3. **Review Biller Invoice:** Check the actual invoice provided by the service
    provider to see if the amount matches the debit.


    **The Fix:**

    - If the charge is a valid biller increase: You may choose to modify the mandate
    limit using the steps in **Bill Autopay — cancel, close, or downgrade**.

    - If the charge is a ₹20 convenience fee: Ensure future balances are maintained
    to avoid late payment recovery.

    - If the charge is unauthorised: Tell us immediately. We will freeze the mandate
    and initiate a formal dispute.


    **When we escalate:**

    If the transaction is confirmed as unauthorised, we will route the case through
    our formal reporting and chargeback path. You will receive a dispute reference
    number and an expected resolution date following RBI''s harmonised TAT.'
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
