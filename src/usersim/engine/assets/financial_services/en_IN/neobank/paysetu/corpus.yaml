- id: 865dbdda-3899-5b0b-b1a1-27589a7d02e4
  title: PaySetu Digital Savings — make a change or update
  body: 'Need to update your personal details or account preferences for your **PaySetu
    Digital Savings** account? Follow these steps to ensure your information remains
    current and secure.


    **Updating Contact Information (Email/Phone)**

    1. Tell us which specific detail (phone number or email address) you wish to update.

    2. We will trigger a multi-factor authentication (MFA) request to your current
    registered device to verify your identity.

    3. Provide the new contact detail you wish to link to the account.

    4. We will send a verification code to the new detail; provide that code to us
    to confirm ownership.

    5. We will confirm once the update is successful and your profile is updated.


    **Updating KYC Documentation**

    1. Let us know that you need to update your KYC documents (e.g., a new PAN or
    updated Aadhaar).

    2. We will initiate a secure upload request within the app.

    3. Provide the digital copies of your updated documents.

    4. We will verify the documents against official databases. This process is critical
    if you are nearing the end of your **30 days** (**full-KYC completion days**)
    window.

    5. We will notify you via in-app alert once the **Full-KYC** status is confirmed.


    **Changing Account Preferences**

    1. Tell us the preference you wish to change (e.g., notification settings or communication
    language).

    2. We will verify your identity via a quick security check.

    3. We will apply the change and provide an immediate confirmation of the new setting.


    *Disclaimer: All changes are subject to our ''verify-before-action'' security
    protocol.*'
