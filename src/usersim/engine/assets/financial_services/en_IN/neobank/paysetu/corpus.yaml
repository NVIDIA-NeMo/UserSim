- id: 92a69ecd-9849-5ea2-b207-514efd628a73
  title: Bill Autopay — make a change or update
  body: 'Updating your **Bill Autopay** settings ensures your payments remain seamless
    and your limits are appropriate for your spending needs.


    **Prerequisites**

    - You must be logged into your PaySetu account.

    - You must have an active **Mandate** already in place for the biller you wish
    to update.


    **Steps to Update a Mandate**

    1. **Select Mandate**: Tell us which active autopay mandate you wish to change
    (e.g., "I want to update my electricity bill limit").

    2. **Specify the Change**: State the new value or detail you wish to update. For
    example, if you wish to increase your limit, specify the new amount. Note that
    if the new limit exceeds the **mandate cap without AFA** of ₹15,000, you will
    be required to perform Additional Factor Authentication (AFA).

    3. **Verify Details**: We will present the updated terms of the mandate (new limit,
    frequency, or biller details) for your review.

    4. **Confirm via PIN**: You will be asked to authorise the change using your secure
    UPI PIN.

    5. **Confirmation**: Once the **Payment Rail** confirms the update, we will provide
    a confirmation message and an updated mandate reference number.


    **How you know it worked**

    Your updated mandate will immediately reflect the new limits or details in the
    ''Active Mandates'' section of your app dashboard.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
