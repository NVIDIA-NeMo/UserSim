- id: 7ae99724-9f41-5ffa-a865-585473df545f
  title: Bill Autopay — resolve a common request end-to-end
  body: "This guide walks you through the end-to-end process of modifying an existing\
    \ autopay mandate (e.g., changing the maximum limit or switching the funding source).\n\
    \n**Prerequisites:**\n- An existing active Bill Autopay mandate.\n- **Full-KYC**\
    \ status (required for increasing mandate limits above basic thresholds).\n\n\
    **Steps to Modify Your Mandate:**\n1. **Identify the Mandate:** Tell us which\
    \ mandate you wish to change (e.g., \"I want to update my electricity bill autopay\"\
    ). We will confirm the current details, including the existing cap.\n2. **Specify\
    \ the Change:** State the new limit or change you require. For example, \"Increase\
    \ my mandate cap to ₹12000.\" \n3. **Verification:** Because this is a state-changing\
    \ operation, we will require multi-factor authentication. We will send a verification\
    \ request to your registered device.\n4. **Confirm the Update:** Once you authenticate,\
    \ we will process the request. We will then provide a confirmation message stating\
    \ the new mandate terms and the date the change becomes effective.\n5. **Final\
    \ Audit:** Ask us to \"show my active mandates\" to verify that the updated limit\
    \ is now reflected in your profile.\n\n**How you know it worked:**\nYour request\
    \ is complete when you receive a confirmation message and the updated mandate\
    \ details (e.g., the new limit) appear correctly in your mandate overview list.\n\
    \n*Disclaimer: PaySetu provides financial literacy and product education, not\
    \ individualised tax, legal, or investment advice. Retail deposits are insured\
    \ by the DICGC up to ₹5,00,000 per depositor.*"
