- id: 62693166-ba47-54d9-9065-3bb0fd8e1704
  title: PaySetu Digital Savings — interest rate / APY schedule
  body: '**Current Interest Rate**

    All balances in the **PaySetu Digital Savings** account earn a flat **savings
    interest rate** of 3.5% per annum.


    **Application and Payout**

    *   **Flat Rate**: This rate applies to all balances from ₹1 upwards; there are
    no tiered interest brackets for this product.

    *   **Minimum Balance**: No minimum balance is required to earn interest, as the
    **minimum balance** is ₹0.

    *   **Calculation**: Interest is calculated on a daily basis based on the end-of-day
    balance and credited to the account on a quarterly basis.


    **Rate Adjustments**

    Interest rates are reviewed periodically and may be adjusted in response to changes
    in the RBI''s repo rate or other market conditions. Any change in the 3.5% rate
    will be communicated to the customer via the in-app notification centre and updated
    in the product dashboard.'
