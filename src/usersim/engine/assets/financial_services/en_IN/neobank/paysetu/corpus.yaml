- id: 2d73af3a-4a39-5dc7-bcc8-82a8a16d21f5
  title: Bill Autopay — fraud and unauthorized-activity protection
  body: 'At PaySetu, we view compliance and security as essential customer protections.
    Because **Bill Autopay** allows for automated debits via a **Mandate**, it is
    a target for specific social engineering scams. Fraudsters may pose as utility
    providers or government officials, claiming your autopay has ''failed'' and requesting
    you to ''re-verify'' your account by sharing sensitive details.


    **What PaySetu will NEVER ask for:**

    Our agents and automated systems will never request your UPI PIN, OTPs, or CVV.
    Any request for these credentials to ''fix'' a mandate is a fraudulent attempt
    to gain access to your funds.


    **Protecting your Mandates:**

    To limit your exposure, we implement a strict safety ceiling. For transactions
    not requiring Additional Factor Authentication (AFA), there is a maximum limit
    of ₹15000. This ensures that even in the event of an unauthorized mandate creation,
    your potential liability is capped.


    **First Action for Suspected Fraud:**

    If you notice a transaction you did not authorize, or if you suspect your mandate
    details have been compromised, notify us immediately via in-app chat or email.
    We follow a ''fair-and-fast'' philosophy, routing suspected fraud through our
    formal reporting and chargeback path to limit your liability and adhering to RBI''s
    harmonised turn-around-time (TAT) for refunds.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
  domain: payments
  product_category: bill_autopay
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 87689902-5384-53da-8fbc-d7298b9a4436
  title: Bill Autopay — account agreement
  body: 'This agreement governs the use of **Bill Autopay** at PaySetu. By activating
    a **Mandate**, the customer authorizes PaySetu to execute automated debits from
    their linked account to a specified biller.


    **1. Payment Limits and Authentication:**

    Transactions processed without Additional Factor Authentication (AFA) are subject
    to a maximum cap of ₹15000. Any amount exceeding this threshold will require multi-factor
    authentication to proceed, adhering to our ''verify-before-action'' security stance.


    **2. Notification Obligations:**

    PaySetu agrees to provide a pre-debit notification 24 hours before the funds are
    moved from the customer''s account. It is the customer''s responsibility to ensure
    sufficient funds are available to avoid payment failure.


    **3. Fee Obligations:**

    While core banking is free, specialized convenience services incur costs. In instances
    where a bill is processed late via our convenience recovery path, a late bill
    convenience fee of ₹20 will be applied to the account.


    **4. Termination and Changes:**

    Customers may revoke a mandate at any time through the app. PaySetu reserves the
    right to modify these terms with prior notice. Failure to maintain a **Full-KYC**
    status may result in the suspension of autopay features to comply with RBI and
    NPCI frameworks.


    **5. Liability:**

    Unauthorized transactions reported within the RBI-prescribed window will be handled
    via our ''fair-and-fast'' dispute resolution process. Retail deposits used for
    these payments are secured and insured by the DICGC up to ₹5,00,000 per depositor.


    *Disclaimer: PaySetu provides financial literacy and product education, not individualised
    tax, legal, or investment advice.*'
