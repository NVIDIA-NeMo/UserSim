- id: 419ad3a6-b57b-5148-9475-76fa2a2a35c9
  title: PaySetu Wallet & UPI — risk disclosures
  body: "This document provides essential risk disclosures regarding the use of **PaySetu\
    \ Wallet & UPI**. \n\n**Balance and Limit Risks**\nUsers are subject to strict\
    \ balance caps based on their verification status. A **Minimum-KYC** account cannot\
    \ hold more than ₹10,000. Only users who have completed **Full-KYC** can maintain\
    \ a balance up to ₹200,000. Any funds added beyond these limits will be declined.\n\
    \n**Transaction Risks**\nAll UPI transactions are subject to a per-transaction\
    \ limit of ₹100,000. Users should be aware that transactions are instantaneous\
    \ and irreversible once authorised via UPI PIN.\n\n**Operational Risks**\nWhile\
    \ we strive for 100% uptime, the underlying payment rails (UPI, IMPS, etc.) are\
    \ managed by external entities. In cases of technical failure, PaySetu adheres\
    \ to the RBI's harmonised turn-around-time (TAT). The standard window for the\
    \ resolution of failed transactions and refunds is 5 days.\n\n**Insurance and\
    \ Protection**\nCompliance is framed as customer protection. All retail deposits\
    \ held within our banking ecosystem are secure and insured by the DICGC up to\
    \ ₹5,00,000 per depositor.\n\n**User Responsibility**\nPaySetu operates a 'verify-before-action'\
    \ security model. The user is responsible for the security of their device and\
    \ credentials. Failure to protect the UPI PIN may lead to unauthorised fund outflows\
    \ for which the user may be liable if negligence is proven.\n\n*Disclaimer: PaySetu\
    \ provides financial literacy and product education, not individualised tax, legal,\
    \ or investment advice.*"
