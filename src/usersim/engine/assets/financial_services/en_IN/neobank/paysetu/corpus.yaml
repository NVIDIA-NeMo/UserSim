- id: 55c1000d-bd06-5fcd-8ca5-084430750074
  title: PaySetu Digital Savings — choosing between tiers or options
  body: 'When setting up your **PaySetu Digital Savings** account, you will move through
    two primary verification tiers. Here is how to choose the right path for your
    needs.


    **Minimum-KYC (The Quick Start)**

    - **Best for:** Users who want to explore the ecosystem instantly with low-volume
    transactions.

    - **Trade-off:** You face lower balance caps and limited banking features.

    - **Cost:** No minimum balance required (₹0).


    **Full-KYC (The Power User)**

    - **Best for:** Users seeking a primary digital wealth foundation with higher
    limits and full feature access.

    - **Trade-off:** Requires submission of PAN and Aadhaar; must be completed within
    **30 days** (**full-KYC completion days**).

    - **Benefit:** Full access to the **savings interest rate of 3.5%** on larger
    balances.


    **Which one should you choose?**

    If you only need a basic hub for small UPI transfers, **Minimum-KYC** is sufficient.
    However, for those treating this as a secure, interest-bearing savings tool, upgrading
    to **Full-KYC** is essential. Both options maintain our zero-barrier entry with
    a **minimum balance of ₹0**.


    *Disclaimer: Retail deposits are secure and insured by the DICGC up to ₹5,00,000
    per depositor.*'
