schema_version: v0.1
# Verifiable Tier-1 tasks for copperleaf_invest, an investment platform. Every
# state-changing tool it offers is gold in at least one task. Each task ships
# THREE opening phrasings in British English. Amounts stay within the ISA,
# Lifetime ISA and Junior ISA allowances. Read-only tools (get_positions,
# get_order_status, get_statements) carry no gold state change.
templates:
- id: TPL-CI-TRADE-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I'd like to buy £{{amount}} of the {{fund}} in my Stocks and Shares ISA.
  - >-
    Please invest £{{amount}} from my ISA cash in the {{fund}}.
  - >-
    Can you place an order for £{{amount}} of the {{fund}} inside my ISA?
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    amount: ['500', '1,500', '3,000']
    fund: [Global Equity Index Fund, UK All-Share Tracker, Sustainable World Fund]
  gold_tool_sequence: [place_trade]
  expected_state_deltas: {order_status: PLACED}
- id: TPL-CI-CANCEL-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I placed an order to buy {{fund}} this morning by mistake. Can you cancel it
    before it goes through?
  - >-
    Please cancel my pending order for {{fund}}.
  - >-
    I've changed my mind about the {{fund}} order I put in today. Can it be
    cancelled?
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    orders:
    - {order_id: ord_ci_0001, instrument: '{{fund}}', side: buy, status: pending}
  param_space:
    fund: [Global Equity Index Fund, UK All-Share Tracker]
  gold_tool_sequence: [cancel_order]
  expected_state_deltas: {ord_ci_0001.status: CANCELLED}
- id: TPL-CI-ISATRANSFER-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I've got a stocks and shares ISA with {{old_provider}} worth about £{{amount}}.
    Can you transfer it to Copperleaf?
  - >-
    Please move my ISA from {{old_provider}} to you without losing the tax wrapper;
    it's around £{{amount}}.
  - >-
    I want to consolidate my £{{amount}} ISA from {{old_provider}} into my
    Copperleaf ISA.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    old_provider: [Harbourline Investments, Northstar Platform]
    amount: ['12,000', '27,500', '64,000']
  gold_tool_sequence: [transfer_isa_in]
  expected_state_deltas: {isa_transfer_status: REQUESTED}
- id: TPL-CI-MONTHLY-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I'd like to invest £{{amount}} a month into the {{fund}} in my ISA.
  - >-
    Can you set up a monthly investment of £{{amount}} in the {{fund}}?
  - >-
    Please start a regular £{{amount}} monthly payment into the {{fund}}.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    amount: ['50', '200', '500']
    fund: [Global Equity Index Fund, Sustainable World Fund]
  gold_tool_sequence: [set_up_regular_investment]
  expected_state_deltas: {regular_investment_status: ACTIVE}
- id: TPL-CI-TOPUP-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I want to pay £{{amount}} into my ISA before the end of the tax year.
  - >-
    Can I add £{{amount}} to my Stocks and Shares ISA by debit card today?
  - >-
    Please take a £{{amount}} payment into my ISA from my bank account.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    amount: ['1,000', '5,000', '12,000']
  gold_tool_sequence: [deposit_funds]
  expected_state_deltas: {deposit_status: INITIATED}
- id: TPL-CI-WITHDRAW-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Please withdraw £{{amount}} of cash from my General Investment Account to my
    bank.
  - >-
    Can I take £{{amount}} out of my General Investment Account?
  - >-
    I need £{{amount}} from my General Investment Account paid to my nominated
    account.
  account_state:
    account_id: gia_ci_0001
    account_type: Copperleaf General Investment Account
    balance: '18200.00'
  param_space:
    amount: ['750', '2,500', '6,000']
  gold_tool_sequence: [withdraw_funds]
  expected_state_deltas: {withdrawal_status: PROCESSING}
- id: TPL-CI-LISAHOME-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:25-34]
  opening_user_messages:
  - >-
    I'm buying my first home for £{{price}}. My conveyancer needs my Lifetime ISA
    money for completion.
  - >-
    Can you sell my Lifetime ISA investments and send the money to my solicitor? I'm
    buying my first flat for £{{price}}.
  - >-
    Our first home is £{{price}} and we complete soon. Please release my Lifetime
    ISA to the conveyancer.
  account_state:
    account_id: lisa_ci_0001
    account_type: Copperleaf Lifetime ISA
    balance: '21300.00'
  param_space:
    price: ['230,000', '310,000', '415,000']
  gold_tool_sequence: [claim_lisa_home_purchase]
  expected_state_deltas: {lisa_home_purchase_claim: SUBMITTED}
- id: TPL-CI-LISAWITHDRAW-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:25-34, age:35-44]
  opening_user_messages:
  - >-
    I need to take £{{amount}} out of my Lifetime ISA for {{reason}}. I know there's
    a charge.
  - >-
    Please withdraw £{{amount}} from my Lifetime ISA; it's for {{reason}}, not a
    house.
  - >-
    Can I get £{{amount}} from my Lifetime ISA? I need it for {{reason}}.
  account_state:
    account_id: lisa_ci_0001
    account_type: Copperleaf Lifetime ISA
    balance: '21300.00'
  param_space:
    amount: ['2,000', '5,000']
    reason: [a car repair, my wedding, paying off a credit card]
  gold_tool_sequence: [request_lisa_withdrawal]
  expected_state_deltas: {lisa_withdrawal_status: PROCESSING}
- id: TPL-CI-NOMINATED-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I've changed banks. Please update my nominated account to sort code
    {{sort_code}}, account number 87654321.
  - >-
    Can you change the bank account my withdrawals go to? New sort code
    {{sort_code}}, account 87654321.
  - >-
    My withdrawals should now go to sort code {{sort_code}}, account number
    87654321.
  account_state:
    account_id: gia_ci_0001
    account_type: Copperleaf General Investment Account
    balance: '18200.00'
  param_space:
    sort_code: ['00-11-22', '00-33-44']
  gold_tool_sequence: [update_beneficiary]
  expected_state_deltas: {beneficiary_updated: true}
- id: TPL-CI-POA-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:65+]
  opening_user_messages:
  - >-
    My {{relative}} has lasting power of attorney for me. Please register it on my
    Copperleaf accounts.
  - >-
    Can you add my {{relative}} as my attorney so they can manage my investments?
  - >-
    I'd like my {{relative}} to be able to act on my ISA and investment account under
    my power of attorney.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '84000.00'
  param_space:
    relative: [son, daughter, niece]
  gold_tool_sequence: [manage_authorized_users]
  expected_state_deltas: {authorized_users_updated: true}
- id: TPL-CI-JISA-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:25-34, age:35-44]
  opening_user_messages:
  - >-
    I'd like to open a Junior ISA for my {{child}}.
  - >-
    Can I start a Junior ISA for my {{child}} with you?
  - >-
    Please open a Copperleaf Junior ISA for my {{child}}.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    child: [newborn son, three-year-old daughter, baby daughter]
  gold_tool_sequence: [open_account]
  expected_state_deltas: {new_account_status: OPEN}
- id: TPL-CI-BEDANDISA-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, financial-literacy:high]
  opening_user_messages:
  - >-
    Can you move £{{amount}} from my General Investment Account into my ISA? I want
    to do a Bed and ISA.
  - >-
    Please transfer £{{amount}} of cash from my GIA to my Stocks and Shares ISA.
  - >-
    I'd like to shift £{{amount}} from my General Investment Account into this
    year's ISA allowance.
  account_state:
    account_id: gia_ci_0001
    account_type: Copperleaf General Investment Account
    balance: '18200.00'
  param_space:
    amount: ['4,000', '10,000', '15,000']
  gold_tool_sequence: [transfer_funds]
  expected_state_deltas: {transfer_status: COMPLETED}
# ── Multi-step (Tier-1) tasks ──────────────────────────────────────────
# Gold sequences of depth 3: each gold tool must be discovered and called; the
# verifier requires the full sequence with no unauthorized state changes. Run
# with a higher max_turns (~10-12).
- id: TPL-CI-NEWINVESTOR-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:18-24, age:25-34]
  opening_user_messages:
  - >-
    I'm new to investing: open a Stocks and Shares ISA for me, pay in £{{amount}} to
    start, and set up £{{monthly}} a month into the {{fund}}.
  - >-
    Please open an ISA, take a first payment of £{{amount}}, and start a monthly
    investment of £{{monthly}} in the {{fund}}.
  - >-
    Can you set me up with a Stocks and Shares ISA, add £{{amount}} now, and invest
    £{{monthly}} each month in the {{fund}}?
  account_state:
    customer_id: cust_ci_0001
  param_space:
    amount: ['500', '2,000']
    monthly: ['50', '150']
    fund: [Global Equity Index Fund, Sustainable World Fund]
  gold_tool_sequence: [open_account, deposit_funds, set_up_regular_investment]
  expected_state_deltas: {new_account_status: OPEN, deposit_status: INITIATED, regular_investment_status: ACTIVE}
- id: TPL-CI-CHILD-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:25-34, age:35-44]
  opening_user_messages:
  - >-
    We've just had a baby: please open a Junior ISA for her, set up £{{monthly}} a
    month into the {{fund}}, and remind me each April to use the allowance.
  - >-
    Can you open a Junior ISA for our new son, start a monthly investment of
    £{{monthly}} in the {{fund}}, and send me a yearly reminder about the
    allowance?
  - >-
    I'd like a Junior ISA for my newborn, £{{monthly}} invested in the {{fund}}
    every month, and an alert before each tax year ends.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    monthly: ['25', '100']
    fund: [Global Equity Index Fund, UK All-Share Tracker]
  gold_tool_sequence: [open_account, set_up_regular_investment, set_alerts]
  expected_state_deltas: {new_account_status: OPEN, regular_investment_status: ACTIVE, alerts_updated: true}
- id: TPL-CI-TAXYEAREND-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, financial-literacy:high]
  opening_user_messages:
  - >-
    Before 5 April: move £{{amount}} from my General Investment Account into my ISA,
    top the ISA up by £{{topup}} from my bank, and buy £{{trade}} of the {{fund}}
    with it.
  - >-
    I want to use my ISA allowance: transfer £{{amount}} from my GIA, pay in another
    £{{topup}}, and invest £{{trade}} in the {{fund}}.
  - >-
    Can you do a £{{amount}} Bed and ISA, add £{{topup}} to my ISA, and place a
    £{{trade}} order for the {{fund}}?
  account_state:
    account_id: gia_ci_0001
    account_type: Copperleaf General Investment Account
    balance: '18200.00'
  param_space:
    amount: ['8,000', '12,000']
    topup: ['3,000', '6,000']
    trade: ['10,000', '14,000']
    fund: [Global Equity Index Fund, Sustainable World Fund]
  gold_tool_sequence: [transfer_funds, deposit_funds, place_trade]
  expected_state_deltas: {transfer_status: COMPLETED, deposit_status: INITIATED, order_status: PLACED}
- id: TPL-CI-EMIGRATE-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I'm emigrating: please update my address to {{address}}, withdraw everything
    from my General Investment Account, and then close it.
  - >-
    Can you change my address to {{address}}, pay out my General Investment Account,
    and close it once the money has gone?
  - >-
    I'm moving overseas. Update my address to {{address}}, withdraw my GIA balance
    to my bank, and close the account.
  account_state:
    account_id: gia_ci_0001
    account_type: Copperleaf General Investment Account
    balance: '18200.00'
  param_space:
    address: ['12 Rue de la Paix, 75002 Paris, France', '45 Queen Street, Auckland 1010, New Zealand']
  gold_tool_sequence: [update_contact_info, withdraw_funds, close_account]
  expected_state_deltas: {contact_updated: true, withdrawal_status: PROCESSING, gia_ci_0001.status: CLOSED}
- id: TPL-CI-SWITCHPLATFORM-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:35-44, age:45-54]
  opening_user_messages:
  - >-
    I'm moving my ISA from {{old_provider}} to you: please transfer it in, set up
    £{{monthly}} a month into the {{fund}}, and let me know when the transfer has
    completed.
  - >-
    Can you bring my {{old_provider}} ISA over, start a monthly investment of
    £{{monthly}} in the {{fund}}, and alert me once the transfer is done?
  - >-
    Please transfer my stocks and shares ISA from {{old_provider}}, invest
    £{{monthly}} each month in the {{fund}}, and notify me when it arrives.
  account_state:
    account_id: isa_ci_0001
    account_type: Copperleaf Stocks and Shares ISA
    balance: '6400.00'
  param_space:
    old_provider: [Harbourline Investments, Northstar Platform]
    monthly: ['150', '400']
    fund: [Global Equity Index Fund, UK All-Share Tracker]
  gold_tool_sequence: [transfer_isa_in, set_up_regular_investment, set_alerts]
  expected_state_deltas: {isa_transfer_status: REQUESTED, regular_investment_status: ACTIVE, alerts_updated: true}
# Open-ended advisory topics are the taxonomy-driven `dynamic` tier
# (assets/financial_services/en_GB/dynamic.yaml), not scripted templates.
