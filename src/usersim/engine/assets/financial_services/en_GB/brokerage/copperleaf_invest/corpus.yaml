- id: c1d204bc-9d77-59cf-bd85-74d039d4d7b7
  title: Copperleaf Junior ISA — account security best practices
  body: 'At Copperleaf Invest, we treat the security of your child''s future savings
    as our highest priority. Because a Copperleaf Junior ISA is managed by an adult
    on behalf of a minor, it can occasionally be targeted by sophisticated social
    engineering scams. We urge all account holders to adhere to the following security
    best practices.


    Common fraud patterns often involve unsolicited emails or messages claiming there
    is an issue with the child''s identity verification or an urgent need to ''unlock''
    funds. We will never ask you to provide your full password, multi-factor authentication
    (MFA) codes, or secret answers via email or secure messaging. Any request for
    this information is fraudulent.


    To protect your account, we employ rigorous identity checks and mandatory multi-factor
    authentication. We require full verification before any state-changing action
    is performed, such as altering account details or processing withdrawals once
    the child reaches the access age of 18.


    If you notice any suspicious activity—such as login notifications you did not
    trigger or unexpected changes to your contact information—you must notify us immediately.
    To ensure the fastest resolution and protect your liability, all suspected fraudulent
    activity should be reported within 24 hours of discovery. Our compliance team
    will then escalate the matter in accordance with FCA guidelines.


    While we provide robust security, please remember that the value of investments
    can fall as well as rise and capital is at risk. For peace of mind regarding the
    institution itself, the Copperleaf Junior ISA is protected by the Financial Services
    Compensation Scheme (FSCS) for up to £85,000 per person if the brokerage fails.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: bb830936-187e-5880-aa01-63e101a425de
  title: Copperleaf Junior ISA — change-of-terms policy
  body: 'This document outlines the policy governing changes to the terms and conditions
    of the Copperleaf Junior ISA. As a regulated brokerage, we are committed to transparency
    and fairness in how we evolve our service model.


    We reserve the right to amend the terms of this agreement, including changes to
    the platform fee of 0.25% or updates to the account''s operational requirements.
    Changes to the annual contribution limit, currently £9,000, are typically driven
    by UK government legislative updates and will be applied automatically to align
    with current tax law.


    Notification of Changes:

    In the event of a material change to our fees or terms, we will provide you with
    at least 30 days'' written notice via your registered email address or secure
    in-app messaging. This notice will clearly state the nature of the change and
    the date it takes effect.


    Your Obligations:

    By maintaining the account after the notice period has expired, you agree to the
    amended terms. If you do not agree to the changes, you have the right to close
    the account or transfer the assets to another provider, provided the child has
    not yet reached the age of 18, at which point the account transitions to the child''s
    control.


    Account Termination:

    Either party may terminate this agreement subject to the standard closing procedures.
    Upon termination, we will facilitate the transfer or distribution of assets. We
    remind you that FSCS protection covers up to £85,000 per person per firm. All
    disputes regarding term changes are handled by our operations management team
    to ensure a fair and transparent resolution process.'
