- id: 664c1dc9-dc5f-5c19-9ddb-1ecca85e26f4
  title: Copperleaf Lifetime ISA — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the process of claiming funds
    for a first home purchase. If you are comparing our service to others, you will
    find our process is designed to be transparent and digital-first.


    **Prerequisites**

    Before initiating this request, ensure the property you are purchasing is valued
    at £450,000 or less, as exceeding this limit will result in a 25% withdrawal charge.


    **Step-by-Step Process**


    1. **Initiate the Claim**: Send us a secure message stating you wish to withdraw
    your Copperleaf Lifetime ISA funds for a first home purchase.

    2. **Provide Property Details**: We will ask you to provide the address of the
    property and a copy of the purchase agreement confirming the price is £450,000
    or below.

    3. **Provide Solicitor Information**: You must provide the full contact details
    and the firm name of your acting solicitor. We do not release these funds directly
    to the customer to ensure the bonus is preserved.

    4. **Verification and Review**: We will verify your identity and the property
    details. This ensures the withdrawal is ''authorised'' and exempt from the 25%
    withdrawal charge.

    5. **Fund Transfer**: Once verified, we will transfer the total balance, including
    all accumulated 25% government bonuses, directly to your solicitor''s client account.

    6. **Confirmation**: We will send you a final statement confirming the total amount
    transferred and the closure of the account (if applicable).


    **How you know it worked**

    Your solicitor will confirm receipt of the funds, and you will receive a final
    transaction notification from us via secure messaging or email.


    For information on other types of withdrawals, see Copperleaf Lifetime ISA — withdrawal
    charge on unauthorised withdrawals explained.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: a51327c2-21b4-5e03-8064-37dcd550fe98
  title: Copperleaf Lifetime ISA — a discrepancy in your records or statement
  body: 'This guide is for support agents assisting customers who report a discrepancy
    in their Copperleaf Lifetime ISA records, such as a missing government bonus or
    an incorrect contribution total.


    **Symptom**

    The customer claims that a deposit was made but is not reflecting in the balance,
    or they believe the 25% government bonus has not been applied to a specific contribution.


    **Likely Causes**

    1. **Bonus Processing Lag**: Government bonuses are not always instantaneous.
    There may be a standard processing window before the 25% bonus appears in the
    account.

    2. **Annual Limit Breach**: If the customer attempted to contribute more than
    the £4,000 annual limit, the excess may have been rejected or is pending a return
    to the sender.

    3. **Verification Hold**: A transaction may be blocked if the customer''s identity
    verification has expired, preventing the bonus from being credited.


    **Steps to Resolve**

    1. **Audit Contributions**: Check the total contributions for the current tax
    year. Confirm if the total is exactly £4,000 or less.

    2. **Verify Bonus Application**: Check the internal transaction log to see if
    the 25% bonus was triggered. If it was triggered but not displayed, it may be
    a reporting lag.

    3. **Check Verification Status**: Ensure the customer has completed the mandatory
    full verification. If not, prompt them to provide the required documents.

    4. **Reconcile with Bank Statements**: Ask the customer to provide a bank statement
    showing the date and amount of the disputed contribution to match it against our
    records.


    **When to Escalate**

    If the contribution is confirmed as received but the 25% bonus is missing after
    the standard processing window, or if there is a balance mismatch that cannot
    be explained by the £4,000 limit, escalate the case to operations management.
    We will provide the customer with a clear timeline for the resolution of the dispute.
    For further guidance, refer to Copperleaf Lifetime ISA — check status or history.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: ce8a2b18-d948-53a8-8081-9582ffd1d038
  title: Copperleaf Junior ISA — overview
  body: 'The Copperleaf Junior ISA is a tax-efficient investment vehicle designed
    specifically for children, allowing parents and guardians to build a significant
    financial foundation for a child''s future. By utilising the Copperleaf Junior
    ISA, you can invest in a wide range of assets, ensuring that any growth or income
    generated within the account remains free from UK income and capital gains tax.


    One of the primary advantages of this account is the generous tax-free limit.
    We support an annual contribution limit of £9,000; any funds invested up to this
    amount each tax year are protected from tax. To ensure the long-term sustainability
    and maintenance of our digital infrastructure, we apply a platform fee of 0.25%.
    We also believe in encouraging a diversified approach to wealth creation, which
    is why we waive fund dealing fees, offering them at £0.


    It is important to understand the nature of this account''s accessibility. The
    funds are held for the benefit of the child and cannot be withdrawn by the parent
    or guardian. Control of the account and the ability to make withdrawals pass entirely
    to the child once they reach the access age of 18. This makes it an ideal tool
    for long-term growth, providing the child with a substantial sum at the start
    of their adult life.


    As with all investing, please be aware that the value of investments can fall
    as well as rise, and capital is at risk. This means the investor may get back
    less than they originally invested. For your peace of mind, we are strictly regulated
    by the FCA. In the unlikely event that the brokerage fails, protection is provided
    by the Financial Services Compensation Scheme (FSCS) for up to £85,000 per person.


    We provide a professional, digital-first experience to help you manage these investments
    with clarity and ease. For a full breakdown of the costs associated with this
    account, please refer to the Copperleaf Junior ISA — fee schedule.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 00788acf-7da0-5885-a693-018dbffdf218
  title: Copperleaf Junior ISA — Junior ISA allowance for the 2026/27 tax year explained
  body: 'Q: What is the maximum amount I can contribute to a Copperleaf Junior ISA
    in the 2026/27 tax year?


    A: For the 2026/27 tax year, the annual allowance for the Copperleaf Junior ISA
    is £9,000. This is the total amount that can be paid into the account between
    6 April 2026 and 5 April 2027. Contributions can come from the parent, guardian,
    or any other third party.


    Q: What happens if I exceed the £9,000 limit within a single tax year?


    A: To ensure compliance with HMRC regulations, we monitor contributions closely.
    If an overpayment occurs, we will notify you immediately so that the excess funds
    can be removed to avoid potential tax complications. We recommend planning your
    contributions across the tax year to stay within the £9,000 threshold.


    For a broader look at how this account works and its general benefits, you may
    wish to review the Copperleaf Junior ISA — overview.'
