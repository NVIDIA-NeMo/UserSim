- id: 06003b88-eb60-5254-8707-d346120352dd
  title: Copperleaf Lifetime ISA — fraud and unauthorised-activity protection
  body: 'At Copperleaf Invest, we treat the security of your long-term savings as
    our highest priority. Because the Copperleaf Lifetime ISA is designed for significant
    life milestones, such as purchasing a first home or retirement, it can be a target
    for sophisticated fraud patterns. We employ a rigorous security framework to ensure
    your capital remains protected.


    To prevent unauthorised activity, we use multi-factor authentication (MFA) for
    all account access and perform strict identity checks. We require full verification
    before any state-changing action is processed, including the alteration of account
    details or the request for withdrawals. Be aware that scammers may attempt to
    impersonate our staff to coerce you into moving funds or sharing your security
    credentials.


    We will never ask you to disclose your password, MFA codes, or full security credentials
    via email or secure messaging. We will never pressure you to transfer your funds
    to a ''safe account'' or request that you bypass our internal verification procedures
    for the sake of speed. Any request of this nature should be treated as fraudulent.


    If you notice any suspicious activity on your account—such as unexpected login
    notifications or changes to your personal details that you did not authorise—you
    must notify us immediately. Once reported, the activity is escalated immediately
    to our compliance team and handled in strict accordance with FCA guidelines to
    mitigate further risk.


    Our commitment to transparency extends to our dispute process. If unauthorised
    activity has occurred, we provide a clear timeline for resolution and a commitment
    to fairness. We also remind you that your funds are protected by the Financial
    Services Compensation Scheme (FSCS) for up to £85,000 per person, should the brokerage
    fail, providing an additional layer of institutional security.


    For further information on the regulatory framework governing our accounts, you
    may refer to Copperleaf Lifetime ISA — regulatory disclosures.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 072c07c8-4976-5b0d-8da1-f4200f820c8b
  title: Copperleaf Lifetime ISA — account agreement
  body: 'This agreement outlines the binding terms and obligations between Copperleaf
    Invest and the account holder regarding the Copperleaf Lifetime ISA. All accounts
    are subject to FCA regulation and our internal standards of care.


    Account Eligibility and Opening

    To open a Copperleaf Lifetime ISA, the applicant must be a UK resident. The maximum
    opening age is 39; individuals aged 40 or over are ineligible to open this specific
    account type. Full identity verification is mandatory before the account is activated.


    Contributions and Limits

    The account holder may contribute up to an annual limit of £4,000. Contributions
    exceeding this limit within a single tax year are not permitted. We apply a platform
    fee of 0.25% to cover infrastructure and maintenance, which is deducted in accordance
    with our fee schedule.


    Government Bonus

    Contributions are eligible for a government bonus at a rate of 25%. This bonus
    is credited to the account following the standard government reporting cycle.
    The bonus is intended to support the purchase of a first home (up to a property
    price cap of £450,000) or retirement.


    Withdrawals and Charges

    Withdrawals are permitted without penalty only for the purchase of a first home
    (within the £450,000 cap), retirement (after age 60), or in cases of terminal
    illness. Any other withdrawal is deemed unauthorised and will incur a withdrawal
    charge of 25%. This charge ensures the recovery of the government bonus and a
    portion of the original investment, meaning the investor may receive back less
    than they originally invested.


    Termination and Closing

    Either party may terminate this agreement. Upon closure, all remaining assets
    will be liquidated and transferred to the customer''s nominated bank account,
    subject to the aforementioned withdrawal charge if the closure does not meet the
    qualifying criteria for a penalty-free exit.


    Protection

    Funds are protected by the Financial Services Compensation Scheme (FSCS) up to
    £85,000 per person.'
