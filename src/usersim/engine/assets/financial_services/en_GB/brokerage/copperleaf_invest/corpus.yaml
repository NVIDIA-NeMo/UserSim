- id: a4fd8dcb-b11b-5de7-8956-699c8525654a
  title: Copperleaf General Investment Account — risk disclosures
  body: 'The following regulatory disclosures apply to all users of the Copperleaf
    General Investment Account. Please read these carefully as they outline the risks
    inherent in self-directed investing.


    Investment Risk: The value of investments can fall as well as rise. You may get
    back less than you originally invested. This is the definition of ''Capital at
    Risk''. Past performance is not a reliable indicator of future results.


    Tax Treatment: The Copperleaf General Investment Account is not a tax-efficient
    wrapper. Unlike an ISA, gains and income generated within this account are subject
    to UK tax laws. This includes the £3,000 capital gains allowance and the £500
    dividend allowance. We provide educational resources to help you understand these
    limits, but we give no personal recommendations and no individual tax advice.
    You are responsible for your own tax compliance.


    Protection: We are strictly regulated by the FCA. In the event that Copperleaf
    Invest fails, your assets are protected by the Financial Services Compensation
    Scheme (FSCS) up to a maximum of £85,000 per person.


    Fees: All accounts are subject to a platform fee of 0.25%, which is essential
    for the long-term sustainability of our infrastructure. This fee is deducted regardless
    of the performance of your investments.


    Security: To protect your capital, we employ multi-factor authentication and rigorous
    identity checks. Full verification is mandatory before any state-changing action,
    such as processing withdrawals, is performed. By using this account, you agree
    to maintain the security of your login credentials.'
  domain: brokerage_investing
  product_category: general_investment_account
