- id: df3cf4b9-d051-539e-b85c-577894f68d16
  title: Copperleaf Lifetime ISA — access or login problems
  body: "If you are experiencing difficulties accessing your Copperleaf Lifetime ISA\
    \ account, please review the following troubleshooting steps to restore your access.\n\
    \n**Symptom: 'Incorrect Credentials' or 'Login Failed'**\n**Likely Cause:** Incorrect\
    \ password or username entry.\n**What to check:** Ensure that caps lock is off\
    \ and that you are using the most recent password created. \n**The Fix:** If you\
    \ have forgotten your password, ask us to initiate a password reset. We will send\
    \ a secure reset link to your registered email address. Once the new password\
    \ is set, you will be able to log in normally.\n\n**Symptom: MFA Code Not Received**\n\
    **Likely Cause:** Network delay, outdated phone number, or device synchronisation\
    \ issues.\n**What to check:** Verify that your device has a stable cellular or\
    \ Wi-Fi connection. Check if you have any SMS filters blocking short-code messages.\n\
    **The Fix:** Ask us to resend the code. If you have changed your phone number\
    \ and cannot receive the MFA code, we will require you to undergo a full identity\
    \ verification check (including government ID) before we can update your contact\
    \ details and restore access.\n\n**Symptom: 'Account Locked' Notification**\n\
    **Likely Cause:** Too many unsuccessful login attempts, triggering our security\
    \ protocols to prevent unauthorised access.\n**What to check:** Review your recent\
    \ login history if possible.\n**The Fix:** We must verify your identity through\
    \ a rigorous check before unlocking the account. Once we have confirmed your identity\
    \ via secure channels, we will unlock the account and you will receive a confirmation\
    \ message.\n\n**When to Escalate**\nIf these steps do not resolve the issue, or\
    \ if you suspect your login credentials have been stolen, please inform us immediately.\
    \ We will escalate the matter to our operations management team to secure your\
    \ funds and investigate the cause of the lockout. You can expect a resolution\
    \ timeline and status update via email within one UK business day."
