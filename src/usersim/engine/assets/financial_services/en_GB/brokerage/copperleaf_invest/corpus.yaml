- id: 7e3d84cc-b1e0-528d-815a-ca580ee4e42f
  title: Copperleaf Junior ISA — choosing between tiers or options
  body: 'When deciding how to save for a child''s future, parents often choose between
    a Copperleaf Junior ISA and a Copperleaf General Investment Account. The primary
    decision factor is tax efficiency and accessibility.


    Copperleaf Junior ISA:

    - Tax Status: Fully tax-free growth and withdrawals.

    - Contribution Limit: Strictly limited to £9,000 per tax year.

    - Access: Funds are locked until the child reaches 18.

    - Cost: A platform fee of 0.25%.


    Copperleaf General Investment Account:

    - Tax Status: Subject to capital gains and dividend allowances.

    - Contribution Limit: No annual limit on contributions.

    - Access: Flexible; funds can be withdrawn at any time by the adult.

    - Cost: A platform fee of 0.25%.


    Who each suits:

    The Junior ISA is the superior choice for those seeking a dedicated, tax-efficient
    vehicle for long-term growth until the child reaches adulthood. The General Investment
    Account is better suited for those who have already exhausted the £9,000 Junior
    ISA limit or require the flexibility to withdraw funds before the child turns
    18. Remember that for both options, the value of investments can fall as well
    as rise and capital is at risk.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 2ae3c09b-289f-5f4a-b7fd-02fa32ea7402
  title: Copperleaf Junior ISA — privacy and data handling
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA) and adheres to all fair treatment and data privacy standards, including
    the UK General Data Protection Regulation (UK GDPR). This disclosure outlines
    how we handle data for the Copperleaf Junior ISA.


    Data Collection and Purpose:

    We collect and process personal data for both the adult registrant and the child
    beneficiary. This is necessary to perform identity verification, monitor the £9,000
    annual contribution limit, and ensure the account is managed in the child''s best
    interests until they reach the age of 18.


    Security Measures:

    To protect this sensitive data, we employ multi-factor authentication and rigorous
    identity checks. No state-changing action, such as processing withdrawals or altering
    account details, is performed without full verification of the authorised adult.


    Regulatory Protections:

    All funds held within the Copperleaf Junior ISA are protected by the Financial
    Services Compensation Scheme (FSCS) for up to £85,000 per person per firm in the
    event that the brokerage fails. This protection provides a critical layer of security
    for the child''s long-term savings.


    Investment Risk:

    We clearly communicate that the Copperleaf Junior ISA is an investment product.
    The value of investments can fall as well as rise and capital is at risk; the
    investor may get back less than they originally invested. We provide educational
    resources for self-directed investing but do not offer personal recommendations
    or individual tax advice.


    Data Requests:

    Account holders may request a copy of the data we hold or ask for corrections
    via secure in-app messaging or email during UK business hours (GMT).'
