- id: 37b6f5e2-66e5-57f9-90f4-5141eb6ee237
  title: Copperleaf Monthly Investing — risk disclosures
  body: 'Investing via Copperleaf Monthly Investing involves inherent risks. It is
    imperative that all clients understand the following regulatory disclosures before
    committing funds:


    **Capital at Risk**

    We clearly communicate that the value of investments can fall as well as rise.
    This means that the value of your portfolio may decrease over time, and you may
    get back less than the total amount you originally invested. Past performance
    is not a reliable indicator of future results.


    **Protection and Regulation**

    Copperleaf Invest is strictly regulated by the Financial Conduct Authority (FCA).
    In the event of the brokerage''s failure, eligible clients are protected by the
    Financial Services Compensation Scheme (FSCS) for up to £85,000 per person. This
    protection is a statutory limit and does not protect against losses resulting
    from market fluctuations.


    **Advice Boundaries**

    We provide educational resources and a robust platform for self-directed investing.
    However, we give no personal recommendations and no individual tax advice. It
    is the client''s responsibility to ensure that their investments are appropriate
    for their personal needs and financial situation. We hold ourselves to a standard
    of care to ensure that the complex products available on our platform are appropriate
    for the client''s general needs, but this does not constitute personalised financial
    advice.


    **Tax Efficiency**

    While Copperleaf Monthly Investing can be used to fund tax-efficient wrappers,
    such as the Stocks and Shares ISA (utilising the £20,000 annual allowance), the
    tax treatment of any investment depends on the individual''s circumstances and
    may be subject to change in the future.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: disclosure
