- id: 67c900b5-ecd6-5519-b088-4c1ee270bb4f
  title: Copperleaf Lifetime ISA — government bonus on payments in explained
  body: 'Q: How does the government bonus work on my Copperleaf Lifetime ISA contributions?


    A: For every pound you contribute to your account, the government adds a bonus
    at a rate of 25%. This means that if you contribute the maximum annual limit of
    £4,000, you will receive a government bonus of £1,000, bringing your total annual
    addition to £5,000.


    Q: When is the 25% bonus credited to my account?


    A: The bonus is not credited instantly. We report your contributions to the government,
    and the bonus is then paid into your account according to the government''s processing
    schedule. You will see this appear as a separate credit in your transaction history.


    Q: Does the bonus apply to the full £4,000 limit?


    A: Yes, the 25% rate applies to all eligible contributions up to the annual limit
    of £4,000 per tax year. Any funds contributed beyond this limit are not permitted
    within the Lifetime ISA wrapper.


    For more on the rules regarding withdrawals, refer to Copperleaf Lifetime ISA
    — withdrawal charge on unauthorised withdrawals explained.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: faq
  source_authority: official
