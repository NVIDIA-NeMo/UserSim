- id: 289f0b58-d94f-586f-988c-e47ca8811fce
  title: Copperleaf Lifetime ISA — cancel, close, or downgrade
  body: 'Closing a Copperleaf Lifetime ISA is a significant action, as it may trigger
    a government penalty depending on the reason for closure. This guide explains
    how to proceed with closing your account or transitioning your funds.


    Before you begin, please be aware that if you close the account for any reason
    other than purchasing your first home (up to the £450,000 price cap), retirement
    (age 60+), or terminal illness, you will incur a withdrawal charge of 25%. This
    charge is designed to recoup the government bonus and may result in you receiving
    back less than your total original contributions.


    Steps to close your account:


    1. Request Account Closure: Inform us that you wish to close your Copperleaf Lifetime
    ISA. You will need to specify if the closure is for a qualifying reason (such
    as a home purchase) or a non-qualifying reason.

    2. Provide Supporting Documentation: If you are closing the account to buy a home,
    you must provide the necessary property contract and solicitor details to verify
    the home is within the property price cap of £450,000.

    3. Confirm Withdrawal Type: We will confirm whether the withdrawal is ''qualifying''
    (no charge) or ''unauthorised''. If unauthorised, we will provide a statement
    showing the 25% withdrawal charge that will be applied to the balance.

    4. Asset Liquidation: We will sell any investments held within the ISA. This process
    takes a few business days to settle.

    5. Final Transfer: Once settled, the remaining funds (after any applicable 25%
    charge) will be transferred to your verified bank account.


    How you know it worked:

    You will receive a final closing statement via your secure messaging channel and
    a confirmation email once the funds have been dispatched to your bank account.
    Your account status will be updated to ''Closed'' in your account overview.'
