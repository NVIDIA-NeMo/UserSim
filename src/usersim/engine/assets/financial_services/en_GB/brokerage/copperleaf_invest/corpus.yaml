- id: d9a9e060-e414-5ab3-b6c7-c98a12689311
  title: Copperleaf Stocks and Shares ISA — fund dealing charge explained
  body: 'Q: How much does it cost to buy or sell funds within my Copperleaf Stocks
    and Shares ISA?

    A: We provide a £0 fund dealing fee for all fund transactions. We waive this fee
    to encourage our customers to build diversified portfolios, which is a key component
    of a sustainable investment strategy.


    Q: Is the fund dealing fee different from the share dealing fee?

    Yes. While fund dealings are £0, a fee of £5.95 applies to the dealing of individual
    shares. This distinction allows us to maintain a competitive and transparent pricing
    model while supporting diverse investment paths.


    Q: Does this mean there are no costs associated with my ISA?

    While fund dealing is £0, we maintain a 0.25% platform fee to cover the essential
    infrastructure and maintenance of our digital-first service. For more details
    on our costs, please refer to Copperleaf Stocks and Shares ISA — fee schedule.'
