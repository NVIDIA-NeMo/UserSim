- id: bc52d08f-b170-55a7-bdad-da5d3044febe
  title: Copperleaf Lifetime ISA — overview
  body: 'The Copperleaf Lifetime ISA is a specialised, tax-efficient investment vehicle
    designed to help UK residents save for their first home or for retirement. We
    provide a clear and accessible path to wealth creation by combining your own contributions
    with a significant incentive from the state.


    One of the primary attractions of this account is the government bonus. For every
    pound you contribute, the government adds a 25% bonus, helping your savings grow
    faster than they would in a standard account. To benefit from this, the account
    must be opened by an individual who is no older than 39.


    To maintain the sustainability of our platform and infrastructure, we apply a
    0.25% platform fee. However, to encourage a diversified approach to investing,
    we have waived the fund dealing fee, which is £0.


    There are specific rules regarding how these funds can be used. If you are saving
    for a first home, the property must have a purchase price of no more than £450,000.
    If you withdraw funds for any reason other than purchasing your first eligible
    home or reaching the age of 60, a withdrawal charge of 25% is applied. This charge
    effectively recovers the government bonus and a portion of your own capital, so
    we encourage you to consider this carefully.


    In terms of contributions, there is an annual limit of £4,000. Any amount contributed
    above this threshold within a single tax year cannot be accepted into the wrapper.


    As with all investing, please be aware that the value of investments can fall
    as well as rise, and capital is at risk. We are strictly regulated by the FCA,
    and your investments are protected by the FSCS up to £85,000 per person should
    the brokerage fail.


    For more details on how this compares to our other tax-efficient options, you
    may wish to refer to Copperleaf Stocks and Shares ISA — overview.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: product_sheet
