- id: b6093b3c-d671-54bd-ba9e-fc778ace16b6
  title: Copperleaf Stocks and Shares ISA — a discrepancy in your records or statement
  body: 'Symptom: A support agent is contacted by a customer who believes there is
    an error in their account balance or a discrepancy in their monthly statement.


    Likely Causes:

    - Misunderstanding of Fee Structure: The customer may be seeing a deduction they
    do not recognise, such as the 0.25% platform fee or a £5.95 share dealing fee.

    - Settled vs. Unsettled Cash: A trade may have been executed, but the funds have
    not yet fully settled, leading to a temporary discrepancy in the available balance.

    - Market Volatility: The customer may be confusing a drop in the value of their
    investments (Capital at Risk) with an unauthorised deduction.


    Steps to resolve:

    1. Review Transaction History: Compare the customer''s reported discrepancy against
    the ledger. Identify if a £5.95 charge was applied to a recent share trade or
    if the 0.25% platform fee was deducted for the period.


    2. Clarify Asset Types: Check if the customer traded funds or shares. If they
    traded funds, verify that the £0 dealing fee was correctly applied and no charge
    was taken.


    3. Explain Market Movement: If the balance has decreased without a corresponding
    fee or withdrawal, remind the customer that the value of investments can fall
    as well as rise, and the current balance reflects the market value of their holdings.


    4. Reconcile the Statement: If a mathematical error is found in the statement
    generation, we will flag the record for correction.


    When to escalate:

    If the discrepancy cannot be explained by fees, market movement, or settlement
    delays, the agent must escalate the case immediately to our compliance team. The
    team will investigate the possibility of fraudulent activity or a system error
    in accordance with FCA guidelines. The customer should be informed that a full
    investigation is underway and provided with a clear timeline for resolution.'
