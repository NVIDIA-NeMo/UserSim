    \ of address. No account can be opened without full verification.\n3. **Compliance\
    \ Screening**: We perform necessary FCA-mandated checks to ensure the product\
    \ is appropriate for the client's needs and risk profile.\n\n**Phase 2: Account\
    \ Funding**\n1. **Funding Method**: The customer provides their bank details for\
    \ the initial deposit. \n2. **Deposit**: Funds are transferred into the account.\
    \ Remind the customer that while we provide a platform for self-directed investing,\
    \ we give no personal recommendations.\n\n**Phase 3: Investment Setup**\n1. **Platform\
    \ Fee Disclosure**: Ensure the customer is aware of the 0.25% platform fee, which\
    \ covers infrastructure and maintenance.\n2. **Tax Context**: Inform the customer\
