- id: de22ccfc-9623-5d04-8026-0c0f2c7050d3
  title: Copperleaf Junior ISA — a declined or blocked action
  body: 'If you have attempted to make a contribution or change account details and
    the action was declined or blocked, it is usually due to one of the following
    reasons:


    Symptom: ''Contribution Declined''

    Likely Cause: You may have exceeded the annual Junior ISA allowance. The maximum
    you can contribute per tax year is £9,000. If the total of your contributions
    and any transfers from other providers exceeds this amount, the system will block
    further payments to prevent a breach of tax rules.

    Fix: Review your total contributions for the current tax year. If the limit has
    been reached, you will need to wait until the start of the next tax year to make
    further payments.


    Symptom: ''Action Blocked — Verification Required''

    Likely Cause: Our security protocols require full verification before any state-changing
    action is performed. This may happen if your MFA session has expired or if the
    identity checks were not completed successfully.

    Fix: Please complete the identity verification process as prompted. Once your
    identity is confirmed, the action can be re-processed.


    Symptom: ''Withdrawal Request Denied''

    Likely Cause: Funds in a Copperleaf Junior ISA cannot be withdrawn by the parent
    or guardian. They remain locked until the child reaches the access age of 18.

    Fix: This is a regulatory requirement of the product. Funds will become available
    for the child once they turn 18.


    If you believe the block is an error, we will raise a case with our operations
    management team for a manual review. You will receive a notification via secure
    messaging once the review is complete, typically within three business days.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 61928964-1243-567a-9717-f187c7c65ce1
  title: Copperleaf Junior ISA — when to switch or upgrade
  body: "As a support agent, you should guide customers on when the Copperleaf Junior\
    \ ISA is no longer the appropriate vehicle and when a transition is required.\n\
    \nTransition at Age 18\nThe most critical 'upgrade' event occurs when the child\
    \ reaches 18. At this point, the Copperleaf Junior ISA is no longer managed by\
    \ the parent. The child takes full control of the assets. This is the ideal time\
    \ to discuss transitioning these funds into a Copperleaf Stocks and Shares ISA,\
    \ which allows the young adult to utilise their own £20,000 annual ISA allowance\
    \ for long-term growth.\n\nWhen to Consider Alternatives\nIf a customer has already\
    \ maximised the £9,000 annual limit for the child and wishes to invest further\
    \ for them, they cannot 'upgrade' the JISA. Instead, they may need to consider\
    \ a General Investment Account (GIA), although this is subject to capital gains\
    \ and dividend allowances. \n\nComparison Summary:\n- Copperleaf Junior ISA: Tax-free\
    \ growth, £9,000 annual limit, funds locked until age 18, 0.25% platform fee.\n\
    - Copperleaf Stocks and Shares ISA: Tax-free growth, £20,000 annual limit, immediate\
    \ access, 0.25% platform fee.\n\nGuide the customer based on the age of the child\
    \ and their total annual contribution goals."
  domain: brokerage_investing
