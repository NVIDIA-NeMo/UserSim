- id: dc68645e-01eb-5aad-af49-e3dbbdf7752c
  title: Copperleaf Lifetime ISA — comparison vs. alternatives and when not to choose
    it
  body: 'When deciding how to build your wealth, it is important to choose the wrapper
    that aligns with your specific goals. The Copperleaf Lifetime ISA is a powerful
    tool, but it is not suitable for every investor.


    **The Copperleaf Lifetime ISA Advantage**

    The primary reason to choose this account is the 25% government bonus. For every
    pound you save up to the £4,000 annual limit, the government adds 25p. This is
    an unmatched return for those saving for a first home (up to £450,000) or for
    retirement (accessible from age 60).


    **Comparison with Stocks and Shares ISA**

    While a standard Stocks and Shares ISA offers greater flexibility, it does not
    provide a government bonus. The Copperleaf Lifetime ISA provides a higher potential
    growth rate due to the bonus, but it comes with strict lock-in rules. In a standard
    ISA, you can withdraw your funds at any time; in a Lifetime ISA, an unauthorised
    withdrawal triggers a 25% withdrawal charge.


    **When NOT to Choose the Lifetime ISA**

    You should avoid this product and instead consider our other options if:

    - **You need liquidity**: If there is any chance you will need this money for
    an emergency or a non-home purchase before age 60, the 25% withdrawal charge makes
    this account unsuitable.

    - **Your home budget is high**: If you are targeting a first home with a purchase
    price above £450,000, you will not be able to use the funds penalty-free.

    - **You are over 39**: Since the maximum opening age is 39, this product is unavailable
    to those who have already reached their 40th birthday.


    As with all investing, remember that the value of investments can fall as well
    as rise and capital is at risk. Your account is protected by the FSCS up to £85,000
    per person. For a comparison of our flexible options, see Copperleaf Stocks and
    Shares ISA — overview.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: product_sheet
  source_authority: official
