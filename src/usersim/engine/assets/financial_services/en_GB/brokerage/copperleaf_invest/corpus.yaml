- id: 79731fd6-1e73-56be-a606-3704b4893010
  title: Copperleaf Monthly Investing — privacy and data handling
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA). We adhere to all fair treatment and data privacy standards to ensure your
    personal and financial information is handled with the utmost integrity.


    Regarding the handling of your data for Copperleaf Monthly Investing, we employ
    rigorous identity checks and multi-factor authentication to prevent unauthorised
    access. Your data is processed to facilitate the automated monthly investment
    of your funds and to maintain the 0.25% platform fee calculations. We will never
    sell your personal data to third parties.


    We clearly communicate that the value of investments can fall as well as rise,
    and capital is at risk. This means you may get back less than you originally invested.
    However, for your peace of mind, we highlight that your funds are covered by the
    Financial Services Compensation Scheme (FSCS) protection of up to £85,000 per
    person, per firm, should the brokerage fail.


    All state-changing actions, such as altering your £25 minimum monthly contribution
    or requesting a withdrawal, require full verification. This is a security measure
    to protect you from fraud and ensure that only the legitimate account holder can
    direct the movement of funds.


    We operate a digital-first support model via secure in-app messaging and email
    during UK business hours (GMT). Any disputes regarding data handling or account
    charges will be handled with a commitment to fairness and transparency, providing
    a clear timeline for resolution. For more on our binding obligations, please see
    Copperleaf Monthly Investing — change-of-terms policy.'
