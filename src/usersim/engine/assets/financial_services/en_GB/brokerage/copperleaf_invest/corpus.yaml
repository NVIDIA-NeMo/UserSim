- id: 1b2207be-98ff-5bb2-8894-ab6e26c8fddf
  title: Copperleaf Junior ISA — comparison vs. alternatives and when not to choose
    it
  body: 'Deciding where to save for a child''s future is a significant decision. We
    provide this comparison to ensure the Copperleaf Junior ISA is the right choice
    for your specific goals.


    Why Choose the Copperleaf Junior ISA?

    The primary advantage is the tax-efficient wrapper. All growth and income within
    the account are tax-free. With an annual allowance of £9,000, it is a powerful
    tool for building a substantial nest egg over many years. We maintain transparency
    with a platform fee of 0.25% and £0 fund dealing fees to keep costs low.


    Comparison with Alternatives

    - vs. General Investment Account (GIA): While a GIA offers more flexibility, it
    is subject to capital gains and dividend taxes. The Copperleaf Junior ISA is almost
    always preferable for children''s savings due to its tax-free status, provided
    you are comfortable with the funds being locked until the child is 18.

    - vs. Standard Savings Accounts: Traditional savings accounts offer lower risk
    but generally lower growth potential. The Copperleaf Junior ISA allows for investment
    in the markets, which can provide higher long-term returns, although it comes
    with the inherent risk that the value of investments can fall as well as rise.


    When NOT to Choose This Product

    You should avoid the Copperleaf Junior ISA if:

    1. You require the ability to withdraw the money before the child turns 18. Once
    funds are paid in, they cannot be accessed until the access age of 18 is reached.

    2. You are looking for a guaranteed return. Because this is an investment product,
    capital is at risk.


    Regardless of the choice, all qualifying accounts are protected by FSCS protection
    of up to £85,000 per person if the brokerage fails.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: b5605525-456e-504a-9efe-94fc5b8c6679
  title: Copperleaf Junior ISA — eligibility and setup
  body: 'Who is eligible to have a Copperleaf Junior ISA opened for them?

    The account is designed for children who are UK residents and are under the age
    of 18. The account must be opened and managed by a registered adult who also resides
    in the UK.


    What do I need to provide to set up the account?

    To open the account, we require the child''s full name and date of birth, as well
    as the adult manager''s identification documents. We employ rigorous identity
    checks and multi-factor authentication to ensure the account is secure from the
    outset.


    Can I open multiple Junior ISAs for the same child?

    No. A child can only have one Junior ISA across all providers. If the child already
    has a JISA elsewhere, you must initiate an ISA Transfer to move the funds to us
    to preserve the tax-free status of the £9,000 annual allowance.'
