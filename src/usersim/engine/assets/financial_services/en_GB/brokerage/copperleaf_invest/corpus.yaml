    \ gains allowance and the £500 dividend allowance. We provide educational resources\
    \ on these limits, but we do not provide individual tax advice.\n\n**Phase 4:\
    \ Final Confirmation**\n1. **Account Activation**: Once verified and funded, the\
    \ account is marked as active.\n2. **Security Setup**: Confirm the customer has\
    \ enabled multi-factor authentication.\n\n**Key Summary for Agents**\n- **Platform\
    \ Fee**: 0.25%\n- **Capital Gains Allowance**: £3,000\n- **Dividend Allowance**:\
