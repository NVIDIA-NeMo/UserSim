- id: 79a147c0-f0b9-53e9-add5-25c87a828c3b
  title: Copperleaf Junior ISA — regulatory disclosures
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA) and adheres to all fair treatment and data privacy standards. This document
    provides the necessary regulatory disclosures for the Copperleaf Junior ISA.


    **Investment Risk**

    We must clearly communicate that the value of investments can fall as well as
    rise, and capital is at risk. This means that the child may get back less than
    the total amount originally invested. Past performance is not a reliable indicator
    of future results.


    **Compensation**

    Our clients are protected by the Financial Services Compensation Scheme (FSCS).
    In the event of a firm failure, the FSCS provides protection for up to £85,000
    per person. This protection is a statutory right and does not affect the risk
    associated with the underlying investments.


    **Advice Boundaries**

    We provide a platform for self-directed investing and offer various educational
    resources to help you make informed decisions. However, we do not provide personal
    recommendations, individual financial advice, or individual tax advice. While
    we maintain a standard of care to ensure that the products available on our platform
    are appropriate for the client''s needs, the final investment decisions rest with
    the account holder.


    **Security and Verification**

    Security is paramount at Copperleaf Invest. We employ multi-factor authentication
    and rigorous identity checks for all users. Full verification is mandatory before
    any state-changing action—such as processing withdrawals (where applicable by
    law) or altering account details—is performed. This ensures the protection of
    the child''s assets and the integrity of the account.


    For an overview of the product''s specific limits and fees, please refer to the
    Copperleaf Junior ISA — overview.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 14d076e7-5b14-5731-8413-0eac40a51499
  title: Copperleaf Junior ISA — interest rate / AER schedule
  body: 'The Copperleaf Junior ISA is a brokerage investment account, meaning it does
    not offer a single, fixed annual equivalent rate (AER) like a traditional savings
    account. Instead, the return on the account is determined by the performance of
    the specific assets selected by the investor.


    **Cost of Holding**

    To maintain the account and its digital infrastructure, we apply a flat platform
    fee of 0.25% per annum. This fee is deducted from the account balance and is the
    primary cost associated with the platform.


    **Returns and Yields**

    *   **Equities/Funds**: The yield depends on the dividends and capital growth
    of the chosen investments.

    *   **Cash Holdings**: Any uninvested cash held within the ISA may accrue interest,
    though the rate is subject to market fluctuations.


    Because this is a self-directed product, we do not guarantee a specific rate of
    return. For a full understanding of the costs, please see the Copperleaf Junior
    ISA — fee schedule.'
