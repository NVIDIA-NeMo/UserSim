- id: 5156195b-034a-56a1-bad8-e1a65fef5530
  title: Copperleaf General Investment Account — dividend allowance explained
  body: '**What is the dividend allowance for the Copperleaf General Investment Account?**

    For residents using our General Investment Account, the current dividend allowance
    is £500. This is the amount of dividend income you can receive in a tax year before
    you may be liable for income tax on those dividends.


    **How is this different from an ISA?**

    Unlike the Copperleaf Stocks and Shares ISA, where all growth and income are tax-free,
    the General Investment Account is subject to tax once you exceed the government''s
    specified allowances. The £500 dividend allowance applies specifically to this
    account type.


    **Does Copperleaf Invest provide advice on how to manage this allowance?**

    We provide a platform and educational resources to help you understand these limits,
    but we give no individual tax advice. We recommend consulting a qualified tax
    professional to understand how the £500 limit applies to your specific financial
    circumstances.'
