- id: da1f9e1f-0c34-5d2c-ae82-b428e4761285
  title: Copperleaf General Investment Account — resolve a common request end-to-end
  body: "This guide walks you through the end-to-end process of opening and funding\
    \ a Copperleaf General Investment Account.\n\n1. Request to open an account\n\
    Tell us you wish to open a Copperleaf General Investment Account. We will then\
    \ initiate the onboarding process for you.\n\n2. Complete identity verification\n\
    We will ask you to provide government-issued identification and proof of address.\
    \ We employ rigorous identity checks and multi-factor authentication to ensure\
    \ your account is secure from the start.\n\n3. Confirm account activation\nOnce\
    \ we have verified your identity, we will notify you that your account is active.\
    \ At this stage, you will be able to see your account dashboard in your secure\
    \ messaging portal.\n\n4. Fund your account\nTell us the amount you wish to deposit.\
    \ We will provide you with the necessary transfer details. Once the funds arrive\
    \ and are verified, we will confirm the balance in your account.\n\n5. Begin investing\n\
    You can now instruct us to place trades. Remember that we provide a platform for\
    \ self-directed investing and educational resources, but we do not give personal\
    \ recommendations. \n\n6. Acknowledge the costs and risks\nBefore your first trade,\
    \ we will confirm that you are aware of the 0.25% platform fee and that you understand\
    \ that the value of investments can fall as well as rise, meaning capital is at\
    \ risk."
