- id: a728cd20-aa1b-58e2-a957-752b9dd7a802
  title: Copperleaf Junior ISA — cost and charges
  body: 'How much does it cost to maintain a Copperleaf Junior ISA?

    We believe in clear and accessible cost structures. The Copperleaf Junior ISA
    carries a platform fee of 0.25%, which covers the ongoing maintenance and infrastructure
    of your account. This ensures the long-term sustainability of the platform while
    keeping your costs predictable.


    Are there fees for buying or selling funds within the account?

    To encourage diversified investing and the long-term growth of your child''s wealth,
    we provide a fund dealing fee of £0. This means you can adjust the fund holdings
    within the ISA without incurring a charge for the transaction itself.


    Where can I find a full breakdown of all potential costs?

    For a comprehensive list of all applicable charges, please refer to the Copperleaf
