- id: 16a82a2b-9a63-53de-96e1-3805c1b20b93
  title: Copperleaf Monthly Investing — an unexpected charge or amount
  body: 'This guide is for support agents assisting clients who report a discrepancy
    in the amount debited from their bank account or an unexpected fee on their statement
    related to Copperleaf Monthly Investing.


    **Symptom**

    The customer states: "I have been charged more than my agreed monthly amount,"
    or "There is a fee on my account that I didn''t expect."


    **Likely Causes**

    1. **Platform Fee Application**: The customer may be seeing the 0.25% platform
    fee. This is not a dealing fee but a percentage-based charge for infrastructure
    and maintenance.

    2. **Non-Regular Trade**: The customer may have executed a manual, ad-hoc trade
    in addition to their regular monthly contribution. While regular contributions
    have a £0 dealing fee, manual trades do not.

    3. **Minimum Threshold Error**: The customer may have attempted to set a monthly
    amount below the required £25 minimum, resulting in a failed instruction or a
    correction.


    **What to check and in what order**

    1. **Verify Transaction Type**: Check the transaction history. Was the charge
    marked as a ''Regular Investment'' or a ''Manual Trade''?

    2. **Calculate Platform Fee**: Review the total asset value and check if the charge
    aligns with the 0.25% platform fee.

    3. **Check Instruction Date**: Ensure the customer isn''t seeing a payment that
    was scheduled before a requested downgrade took effect.


    **Resolution and Escalation**

    - **If it is a platform fee**: Explain to the customer that the 0.25% fee covers
    the platform''s maintenance and is separate from the £0 regular dealing fee.

    - **If it is a manual trade fee**: Clarify that the £0 fee only applies to the
    automated monthly service.

    - **If the amount is genuinely incorrect**: Escalate the matter immediately to
    operations management for a complex dispute review. The customer should be informed
    that we will investigate and provide a clear timeline for resolution.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
