- id: ba0a3d72-f8b4-5351-a490-df7f6e638c06
  title: Copperleaf Junior ISA — fraud and unauthorised-activity protection
  body: 'At Copperleaf Invest, we treat the security of your child''s future savings
    with the utmost seriousness. When choosing a provider for a Copperleaf Junior
    ISA, it is vital to understand how we protect these assets from unauthorised activity
    and the specific patterns fraudsters may use to target long-term savings accounts.


    To ensure the integrity of every account, we employ multi-factor authentication
    and rigorous identity checks. We maintain a strict policy where full verification
    is mandatory before any state-changing action is performed. This means that whether
    you are processing a withdrawal (where permitted by regulation) or altering account
    details, we will verify your identity to prevent unauthorised access.


    Fraudsters often attempt to target Junior ISAs by impersonating the account holder''s
    parent or legal guardian, often using urgency or fear to solicit sensitive information.
    Please be aware that we will never ask you for your full password, your multi-factor
    authentication codes, or request that you move funds to a ''safe account'' via
    secure messaging or email. Any request asking you to bypass our standard verification
    processes should be treated as a scam.


    If you notice any unauthorised activity or receive a suspicious communication
    regarding a Copperleaf Junior ISA, your first action should be to notify us immediately
    via our secure in-app messaging or email. Prompt reporting is essential; any fraudulent
    activity is escalated immediately to our compliance team and handled in strict
    accordance with FCA guidelines to ensure a fair and transparent resolution.


    By combining robust technical barriers like multi-factor authentication with a
    vigilant compliance posture, we provide a secure environment for wealth creation.
    We encourage all account holders to regularly review their account statements
    to ensure all contributions and holdings are correct. For more information on
    the regulatory safeguards protecting your funds, please refer to Copperleaf Junior
    ISA — regulatory disclosures.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: e5c9e960-816c-5f85-a532-cc834aeb4371
  title: Copperleaf Junior ISA — account agreement
  body: 'This account agreement outlines the binding terms between Copperleaf Invest
    and the account signatory for the Copperleaf Junior ISA. Both parties agree to
    the following obligations to ensure the sustainable and lawful management of the
    account.


    1. Contribution Limits and Tax Status

    We facilitate the management of the account subject to the current annual ISA
    allowance. The account signatory must ensure that total contributions do not exceed
    the limit of £9,000 per tax year. Exceeding this limit may result in the account
    losing its tax-efficient status or the requirement to return excess funds.


    2. Fee Obligations

    To maintain the platform''s infrastructure and operational sustainability, Copperleaf
    Invest applies a platform fee of 0.25%. This fee is calculated and deducted from
    the account assets. We commit to transparency in our pricing; any changes to this
    fee structure will be communicated to the signatory with a predefined notice period.


    3. Account Control and Maturity

    The account is opened in the name of the child, but control is maintained by the
    registered adult signatory. In accordance with UK regulations, full control of
    the Copperleaf Junior ISA, including the right to withdraw funds, passes to the
    child exactly when they reach the age of 18. At this point, the account will be
    transitioned to the child''s name, and they will assume all responsibilities and
    rights associated with the assets.


    4. Regulatory Compliance and Termination

    We operate under the strict regulation of the FCA. This agreement may be terminated
    by the account signatory by requesting an account closure, subject to full identity
    verification. We reserve the right to close the account if fraudulent activity
    is detected or if the account is used in a manner that violates FCA fair treatment
    and data privacy standards.


    5. Risk Acknowledgement

    The signatory acknowledges that the Copperleaf Junior ISA is an investment vehicle.
    We clearly state that the value of investments can fall as well as rise, and capital
    is at risk. While we provide the platform, we do not provide personal recommendations
    or individual tax advice.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: terms_conditions
  source_authority: official
