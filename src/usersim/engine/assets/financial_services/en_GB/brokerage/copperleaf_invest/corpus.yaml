- id: 4be82013-509e-53d7-b716-5307e1c51c35
  title: Copperleaf Lifetime ISA — how rates are tiered and applied
  body: 'The Copperleaf Lifetime ISA utilises a flat-rate bonus structure and a transparent
    platform fee; there are no tiered interest rates based on balance for this product.


    Government Bonus Rate

    A flat rate of 25% is applied to all eligible contributions. This bonus is credited
    to the account by the government following our reporting of your deposits. This
    rate applies to all balances, provided the contributions are within the annual
    limit of £4,000.


    Platform Fee

    A flat platform fee of 0.25% is applied to the total value of the account. This
    fee covers the cost of infrastructure, security, and maintenance. It is not tiered
    by balance, ensuring the same cost of service for all our clients.


    Withdrawal Penalty

    An unauthorised withdrawal (one not meeting the first-home price cap of £450,000
    or retirement criteria) triggers a flat withdrawal charge of 25% of the total
    amount being withdrawn.


    These rates are subject to change only via official government legislation (for
    the bonus) or formal notice from Copperleaf Invest (for the platform fee).'
