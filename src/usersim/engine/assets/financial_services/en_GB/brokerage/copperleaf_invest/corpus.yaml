- id: c36db942-ea20-5a50-83b5-642c169f5d46
  title: Copperleaf General Investment Account — eligibility requirements
  body: 'To open and maintain a Copperleaf General Investment Account, the following
    eligibility criteria must be met:


    - Residency: Must be a current resident of the United Kingdom. (Outcome: Mandatory
    for account opening)

    - Identity Verification: Must provide valid, government-issued photo ID and proof
    of address. (Outcome: Mandatory for account activation)

    - Age: Must be 18 years of age or older. (Outcome: Mandatory for account opening)

    - Security Compliance: Must agree to and set up multi-factor authentication. (Outcome:
    Mandatory for account access)


    Failure to meet any of the above requirements will result in the application being
    declined. If your circumstances change (e.g., you move outside the UK), please
    inform us immediately as this may affect your eligibility to hold the account.'
