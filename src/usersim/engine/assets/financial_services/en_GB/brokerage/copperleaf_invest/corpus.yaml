- id: 9bd8c632-8aee-57c5-a26b-b9b5ad5cffb3
  title: Copperleaf Stocks and Shares ISA — getting started walkthrough
  body: "This walkthrough is intended for support agents assisting customers with\
    \ the initial setup and funding of their Copperleaf Stocks and Shares ISA. Our\
    \ goal is to provide a clear, accessible path to wealth creation for UK residents.\n\
    \nStep 1: Identity Verification\nWe must perform rigorous identity checks before\
    \ an account can be activated. We will request a valid form of government-issued\
    \ ID and proof of address. Full verification is mandatory before any state-changing\
    \ action can be taken.\n\nStep 2: Funding the Account\nOnce verified, the customer\
    \ can deposit funds. We must ensure the customer is aware of the £20,000 annual\
    \ ISA allowance. If they are transferring from another provider, we will handle\
    \ the ISA Transfer process to ensure the tax-free status of the allowance is preserved;\
    \ we must remind them that funds must never be withdrawn and paid back in manually.\n\
    \nStep 3: Understanding the Cost Structure\nEnsure the customer understands our\
    \ transparent pricing: \n- A 0.25% platform fee covers infrastructure and maintenance.\n\
    - A £5.95 share dealing fee applies to individual stock trades.\n- A £0 fund dealing\
    \ fee is waived to encourage diversified investing.\n\nStep 4: Investment Selection\n\
    We provide educational resources for self-directed investing. We must explicitly\
    \ state that we give no personal recommendations and no individual tax advice.\
    \ We ensure that complex products are appropriate for the client's needs and that\
    \ they understand that the value of investments can fall as well as rise and capital\
    \ is at risk.\n\nStep 5: Confirmation of Protection\nConfirm that the account\
    \ is regulated by the FCA and that the client's assets are covered by FSCS protection\
    \ of up to £85,000 per person if the brokerage fails."
