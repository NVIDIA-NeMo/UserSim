- id: 6455a83d-567f-59ee-8d5f-3399d53f78e5
  title: Copperleaf Junior ISA — getting started walkthrough
  body: 'This guide is intended for support agents assisting customers with the opening
    and initial funding of a Copperleaf Junior ISA. The goal is to ensure a seamless
    onboarding experience while adhering to strict FCA and identity verification standards.


    Step 1: Initial Eligibility Check

    Confirm the applicant is a UK resident and is opening the account for a child
    under the age of 18. Clarify that this is a tax-free starter account where the
    child will gain full control upon reaching the age of 18.


    Step 2: Identity Verification

    Guide the customer through our rigorous identity checks. This includes multi-factor
    authentication and the submission of valid government-issued identification for
    the adult registrant. Full verification is mandatory before the account can be
    funded.


    Step 3: Explaining the Limits and Costs

    Ensure the customer understands the following key figures:

    - Annual Allowance: The maximum amount that can be contributed to the account
    is £9,000 per tax year.

    - Platform Fee: A competitive annual fee of 0.25% is charged to cover infrastructure
    and maintenance.

    - FSCS Protection: Highlight that the account is protected by the FSCS up to £85,000
    per person.


    Step 4: Funding the Account

    Once verified, the customer can make their first contribution. Remind them that
    while we provide educational resources for self-directed investing, we give no
    personal recommendations and no individual tax advice.


    Step 5: Final Confirmation

    Confirm that the account is active. Remind the customer that the value of investments
    can fall as well as rise and capital is at risk. For further details on how we
    handle common requests, refer to the Copperleaf Junior ISA — resolve a common
    request end-to-end document.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: product_sheet
