- id: a2ef15ef-1b3c-57e2-91a1-aa0d1c409139
  title: Copperleaf Lifetime ISA — oldest age at which the account can be opened explained
  body: '**What is the oldest age at which I can open a Copperleaf Lifetime ISA?**

    The maximum opening age for a Copperleaf Lifetime ISA is 39. This means you must
    open the account before your 40th birthday to be eligible.


    **I am already 40; can I still open an account if I have a special circumstance?**

    No. The age limit of 39 is a strict regulatory requirement. We cannot open new
    Lifetime ISA accounts for any individual who is 40 years of age or older.


    **If I opened my account at 39, can I still contribute after I turn 40?**

    Yes. As long as the account was opened before your 40th birthday, you can continue
    to make contributions up to the £4,000 annual limit and receive the 25% government
    bonus until you reach age 50.


    For more eligibility details, see Copperleaf Lifetime ISA — eligibility requirements.'
