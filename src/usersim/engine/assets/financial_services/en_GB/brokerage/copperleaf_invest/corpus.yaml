- id: c3182dd4-4028-5886-932a-88f05966067f
  title: Copperleaf Junior ISA — resolve a common request end-to-end
  body: 'A common request for our customers is setting up a regular monthly contribution
    to automate a child''s savings. Here is the end-to-end process to resolve this:


    1. State your intention to start regular investing and specify the monthly amount.
    Please note that for our monthly investing service, there is a minimum monthly
    commitment of £25.

    2. Confirm the Copperleaf Junior ISA account details for the child. We will verify
    that the account is active and has not yet reached the £9,000 annual allowance
    for the current tax year.

    3. Provide the bank account details from which the funds will be drawn. We will
    perform a security check to ensure the bank account is held in the name of the
    registered adult manager.

    4. Specify the day of the month you wish the contribution to be processed.

    5. We will then set up the instruction and send you a confirmation message. This
    confirmation will include the start date and the amount to be debited.


    Your request is successfully resolved when you receive the confirmation message
    and see the first scheduled contribution appearing in your account history. Remember,
    by using this method, you benefit from our £0 regular dealing fees, ensuring more
    of your money stays invested for your child''s future.'
