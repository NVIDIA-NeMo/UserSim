- id: 260b1546-72f5-5b36-9d12-5ce5a661441b
  title: Copperleaf General Investment Account — overview
  body: 'The Copperleaf General Investment Account is a flexible investment solution
    designed for UK residents who wish to grow their wealth beyond the limits of tax-efficient
    wrappers. This account is particularly suited for investors who have already exhausted
    their annual ISA allowances and seek a straightforward way to maintain their investment
    momentum in a diversified portfolio.


    Our approach is built on transparency and clarity. We charge a competitive platform
    fee of 0.25% to cover the essential infrastructure and maintenance of your account.
    To encourage a diversified strategy, we provide a £0 fund dealing fee, ensuring
    that the cost of entry into a variety of funds does not hinder your long-term
    growth objectives.


    As this is a taxable account, it is important to be aware of the current UK tax
    landscape. Investments held within this account are subject to the £3,000 capital
    gains allowance and the £500 dividend allowance. We provide the platform and educational
    resources for self-directed investing; however, we do not provide personal recommendations
    or individual tax advice. We recommend consulting a qualified tax professional
    to understand how these allowances apply to your specific circumstances.


    Security and protection are central to our service. We employ rigorous identity
    checks and multi-factor authentication to protect your assets. Furthermore, your
    investments are protected by the Financial Services Compensation Scheme (FSCS)
    up to £85,000 per person should the brokerage fail.


    Please be aware that investing involves risk. The value of your investments can
    fall as well as rise, and you may get back less than you originally invested.
    Capital is at risk.


    For a detailed breakdown of all costs associated with this account, please refer
    to the Copperleaf General Investment Account — fee schedule.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: product_sheet
