- id: d8d454c8-95e6-5815-a9bc-a6f07d81eade
  title: Copperleaf Lifetime ISA — qualification tiers
  body: 'Use the following matrix to determine if a customer is eligible to open a
    Copperleaf Lifetime ISA. All conditions must be met for a positive outcome.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | **Age** | Between 18 and 39 | Eligible to Open |

    | **Age** | 40 or older | Ineligible |

    | **Residency** | UK Resident | Eligible to Open |

    | **Residency** | Non-UK Resident | Ineligible |

    | **Intent** | First Home (up to £450,000) OR Retirement | Eligible to Open |

    | **Intent** | General Investing (No specific goal) | Ineligible (Advise other
    ISA) |


    **Agent Note:** If a customer is ineligible due to age or residency, please suggest
    alternative tax-efficient wrappers. Ensure you mention the annual £4,000 limit
    and the 25% government bonus to those who do meet the criteria.'
  domain: brokerage_investing
