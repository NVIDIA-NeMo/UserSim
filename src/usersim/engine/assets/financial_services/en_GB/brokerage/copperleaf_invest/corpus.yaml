- id: 413ef032-d58a-56d9-8943-2173b17b69bb
  title: Copperleaf Junior ISA — a discrepancy in your records or statement
  body: 'When a customer reports a discrepancy in their Copperleaf Junior ISA records
    or statements, agents should follow this systematic verification process:


    Symptom: ''The balance is lower than expected''

    Check 1: Verify the platform fee. Ensure the customer understands that a platform
    fee of 0.25% is applied to the assets. Check the statement to see when the fee
    was last deducted.

    Check 2: Market Volatility. Remind the customer that because this is an investment
    product, the value can fall as well as rise. Compare the current balance against
    the historical performance of the selected funds.


    Symptom: ''Contribution amount is incorrect''

    Check 1: Review the transaction history. Cross-reference the funds received from
    the customer''s bank against the credited amount in the account.

    Check 2: Annual Limit. Check if a contribution was partially declined because
    it would have exceeded the £9,000 annual allowance.


    Symptom: ''Incorrect account holder details''

    Check 1: Verify the identity documents provided at setup. Ensure the child''s
    name and date of birth match the official records.


    Resolution and Escalation:

    If the discrepancy is a simple calculation error or a missing transaction, the
    agent can correct the record if they have the necessary verification. If the discrepancy
    involves a complex fund pricing error or a disputed transfer from another provider,
    the agent must escalate the matter immediately to operations management. The customer
    should be informed that a formal investigation is underway and provided with a
    clear timeline for resolution, typically 5 to 10 business days.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: troubleshooting
  source_authority: official
