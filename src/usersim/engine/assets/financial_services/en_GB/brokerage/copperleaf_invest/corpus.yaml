- id: cafe804c-a69e-56d3-a4b2-5a36588be462
  title: Copperleaf General Investment Account — make a change or update
  body: 'Whether you are updating your home address, changing your contact details,
    or updating your account beneficiaries, we ensure all changes are handled securely
    to protect your assets. Because updating account details is a state-changing action,
    rigorous verification is mandatory.


    **What you will need before starting**

    - Your account number.

    - A valid form of government-issued photo identification.

    - The specific details of the change you wish to make.


    **Step-by-Step Process**


    1. **Submit the Change Request**: Tell us exactly which detail you wish to update
    (e.g., "I need to change my registered residential address").

    2. **Identity Verification**: We will prompt you to complete a verification check.
    This may involve confirming a code sent via multi-factor authentication or providing
    a digital copy of your identification to ensure the request is genuine.

    3. **Provision of New Details**: Once your identity is confirmed, provide the
    new information (e.g., the new address or the full name and details of the new
    beneficiary).

    4. **Internal Review**: We will review the provided information to ensure it meets
    our compliance and data privacy standards.

    5. **Confirmation of Update**: We will send you a final confirmation via secure
    in-app messaging and email once the change has been successfully applied to your
    Copperleaf General Investment Account.


    **How you know it worked**

    Your updated details will be immediately visible in your account profile section.
    You will also receive a formal notification confirming that the state-changing
    action has been completed. If you are updating a beneficiary, we will provide
    a confirmation statement for your records.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 051cba32-046b-5699-8b79-3ec3628a3845
  title: Copperleaf General Investment Account — access or login problems
  body: '**Symptom**: You are unable to log into your account, or you are receiving
    an ''Access Denied'' message after entering your credentials.


    **Likely Causes**

    - Incorrect password or username.

    - Multi-factor authentication (MFA) synchronisation failure.

    - Account lock following multiple unsuccessful login attempts.

    - Outdated app version or browser cache issues.


    **What to check in order**

    1. **Credential Accuracy**: Double-check that your Caps Lock is off and that you
    are using the correct email associated with your Copperleaf General Investment
    Account.

    2. **MFA Device**: Ensure your mobile device has a stable internet connection
    to receive the authentication code. If the code is not arriving, wait 60 seconds
    before requesting a new one.

    3. **Connection**: Try switching from Wi-Fi to mobile data, or clear your browser''s
    cache and cookies to ensure you are seeing the most recent version of our login
    portal.


    **The Fix**

    - **For Password Issues**: Request a password reset. We will send a secure link
    to your registered email address to allow you to create a new password.

    - **For MFA Issues**: If you have lost access to your MFA device, you must undergo
    a full identity verification process. Provide us with your government-issued ID
    and answer security questions to regain access.

    - **For Locked Accounts**: If your account has been locked for security reasons,
    we will trigger a manual review of your last login attempt.


    **When to Escalate**

    If you have reset your password and verified your MFA device but still cannot
    gain access, we will escalate your case to our operations management team. We
    will investigate whether there is a technical block on the account. You will receive
    an update on the status of this investigation via your registered email within
    one UK business day.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 368d1ea7-a7b6-5bb5-80b7-73fbf0b21e76
  title: Copperleaf General Investment Account — qualification tiers
  body: 'The Copperleaf General Investment Account is our most flexible investment
    vehicle. Unlike our ISA products, there are no annual contribution limits, making
    it suitable for a wide range of investors. Use the following matrix to determine
    account qualification and reporting tiers for customers.


    | Condition | Outcome | Requirement |

    | :--- | :--- | :--- |

    | UK Resident (Adult) | Eligible for Standard Account | Valid UK ID and Proof
    of Address |

    | Non-UK Resident | Ineligible | Must provide proof of UK residency |

    | Under 18 Years Old | Ineligible | Refer to Junior ISA requirements |

    | Balance < £1,000,000 | Standard Reporting | Standard platform fee of 0.25% |

    | Balance $\ge$ £1,000,000 | High Net Worth Reporting | Subject to enhanced KYC
    and reporting |


    All accounts, regardless of tier, are subject to the same 0.25% platform fee and
    adhere to FCA fair treatment standards. Every account holder is protected by FSCS
    protection up to £85,000 per person.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
