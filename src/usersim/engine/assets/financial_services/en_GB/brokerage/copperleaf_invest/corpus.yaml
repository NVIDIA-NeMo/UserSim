- id: 9e7941db-f5bc-59f8-bf60-e2a214aa2693
  title: Copperleaf Junior ISA — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Copperleaf
    Junior ISA. It is important that all account signatories read and understand these
    risks before committing funds.


    Investment Risk and Capital

    We must clearly communicate that the Copperleaf Junior ISA is an investment product,
    not a cash savings account. The value of investments can fall as well as rise.
    This means there is an inherent risk that the value of the portfolio may decrease
    over time, and the investor may get back less than they originally invested. This
    is referred to as ''Capital at Risk''.


    Protection and Safeguards

    We are strictly regulated by the FCA and adhere to all fair treatment and data
    privacy standards. In the event that Copperleaf Invest fails, the assets held
    in the account are protected by the Financial Services Compensation Scheme (FSCS).
    FSCS protection covers up to £85,000 per person, per firm. This provides a critical
    safety net for the child''s savings.


    Advice Boundaries

    Copperleaf Invest provides educational resources and a robust platform for self-directed
    investing. However, we provide no personal recommendations and no individual tax
    advice. While we hold ourselves to a standard of care to ensure that complex products
    are appropriate for the client''s needs, the final decision on investment allocation
    rests with the account signatory.


    Tax Treatment

    The tax-free status of the Copperleaf Junior ISA is subject to the £9,000 annual
    allowance. Any contributions exceeding this amount may be subject to tax or required
    to be withdrawn. While the current tax rules provide significant benefits, these
    are subject to change by the UK government. We recommend consulting a qualified
    tax professional for individual tax planning.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
