- id: b9bb4934-ee45-508f-a27c-31c9ba694dd5
  title: Copperleaf Lifetime ISA — getting started walkthrough
  body: 'This walkthrough provides the necessary steps for support agents to assist
    a customer in opening and activating a Copperleaf Lifetime ISA. Please ensure
    all regulatory checks are completed before proceeding.


    **Step 1: Eligibility Verification**

    Confirm that the customer is a UK resident and falls within the permitted age
    bracket. The account must be opened by an individual between the ages of 18 and
    39. If the customer is 40 or older, they are ineligible for this specific product.
    For further details, refer to the Copperleaf Lifetime ISA — qualification tiers.


    **Step 2: Explaining the Core Benefits**

    Clearly communicate the government incentive. Explain that the government provides
    a 25% bonus on contributions, which significantly accelerates wealth creation.
    Highlight that this bonus is applied to contributions up to the annual limit of
    £4,000.


    **Step 3: Clarifying the Account Purpose**

    Ensure the customer understands the two primary purposes of the account: retirement
    or the purchase of a first home. For home purchases, emphasise the property price
    cap of £450,000. Advise the customer that using the funds for other purposes will
    trigger a 25% withdrawal charge.


    **Step 4: Fee Transparency**

    Disclose the cost of the account. Inform the customer that we charge a 0.25% platform
    fee to cover infrastructure and maintenance. Ensure they understand that this
    is a transparent fee used to maintain the platform''s sustainability.


    **Step 5: Identity and Security Setup**

    Guide the customer through the mandatory identity checks. Explain that multi-factor
    authentication (MFA) will be required for all state-changing actions, such as
    withdrawals. Remind them that their capital is at risk, but they benefit from
    FSCS protection of up to £85,000 per person should the firm fail.


    **Step 6: Final Confirmation**

    Once the identity check is successful, confirm the account activation and provide
    the customer with a summary of their annual £4,000 limit and the expected 25%
    government bonus.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: product_sheet
  source_authority: official
