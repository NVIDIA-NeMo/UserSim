- id: 9a05f533-0e28-5bde-a666-9f5024f455fc
  title: Copperleaf Stocks and Shares ISA — set up and activate
  body: 'Setting up your Copperleaf Stocks and Shares ISA is a straightforward process
    designed to get you investing as quickly as possible. Please ensure you have your
    National Insurance number and a valid form of government-issued photo identification
    ready before you begin.


    1. Provide your personal details: Tell us your full legal name, current UK residential
    address, and contact information. We will use these details to establish your
    account and ensure you meet the UK residency requirements for ISA eligibility.


    2. Complete identity verification: To protect your assets, we employ rigorous
    identity checks and multi-factor authentication. You will be asked to provide
    a digital copy of your ID. We will then confirm once your identity has been successfully
    verified.


    3. Fund your account: Once verified, you can deposit funds into your ISA. Please
    ensure your total contributions for the current tax year do not exceed the £20,000
    annual ISA allowance. You can fund your account via bank transfer; we will notify
    you as soon as the funds have been cleared and are available for investment.


    4. Select your investments: With your account funded, you can now choose your
    assets. You can take advantage of our £0 fund dealing fee to build a diversified
    portfolio of funds or use our share dealing service (subject to a £5.95 fee per
    trade) to purchase individual stocks.


    5. Confirm activation: Your account is fully active once your first deposit is
    processed and your identity is verified. You will receive a confirmation message
    via our secure in-app system welcoming you to Copperleaf Invest.


    If you have questions about the costs associated with your new account, you can
    review the Copperleaf Stocks and Shares ISA — fee schedule.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: how_to_guide
