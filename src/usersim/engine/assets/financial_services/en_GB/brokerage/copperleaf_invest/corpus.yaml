- id: 7a28aa2f-bdd2-515c-bf73-1a8e66081dc8
  title: Copperleaf Monthly Investing — a failed or pending action
  body: 'If you notice that your scheduled monthly investment has not been processed
    or is marked as ''pending'', it is usually due to a few common causes. Please
    review the following steps to resolve the issue:


    Symptom: The monthly contribution has not been deducted from your bank account
    or has not appeared in your investment portfolio.


    Likely Causes:

    - Insufficient funds in the linked bank account at the time of the scheduled deduction.

    - Outdated payment details or a blocked transfer from your banking provider.

    - Pending identity verification or account security flags.


    What to check and fix:

    1. Verify your balance: Check that your linked account held at least the minimum
    monthly amount of £25 on the scheduled date.

    2. Review account status: Ensure your account is fully verified. We employ rigorous
    identity checks and multi-factor authentication; if a verification update is required,
    we will notify you.

    3. Confirm payment details: Ensure your bank account details are current and that
    there are no restrictions on your account preventing the transfer.


    When to escalate:

    If you have confirmed that funds were available and your identity is verified,
    but the investment still failed, please let us know. We will investigate the transaction.
    If the matter is complex, we will escalate the query to our operations management
    team for a formal resolution. We approach all disputes with a commitment to fairness
    and transparency, providing a clear timeline for the final resolution.


    For further details on account security, see the Copperleaf Monthly Investing
    — fraud and unauthorised-activity protection.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: troubleshooting
