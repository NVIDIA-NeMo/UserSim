- id: 5304dbe0-1182-585a-a85b-762b112d5700
  title: Copperleaf Junior ISA — qualification tiers
  body: 'The following matrix determines the eligibility of an applicant to open a
    Copperleaf Junior ISA. All conditions must be met for the application to be approved.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a current UK resident | Required for Eligibility |

    | Child''s Age | Must be under 18 years old | Required for Eligibility |

    | Account Status | Child must not already have a Junior ISA with another provider
    (unless transferring) | Required for Eligibility |

    | Identity | Adult registrant must pass full KYC/AML verification | Required for
    Eligibility |


    If all the above conditions are met, the applicant is eligible to open the account
    and contribute up to the annual limit of £9,000. For detailed documentation requirements,
    please see the Copperleaf Junior ISA — required documentation document.'
