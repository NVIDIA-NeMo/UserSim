- id: a892d694-d4f7-521e-8d20-53102f3ddcde
  title: Copperleaf Stocks and Shares ISA — risk disclosures
  body: 'Investing in the Copperleaf Stocks and Shares ISA involves inherent risks.
    We provide this disclosure to ensure all customers are fully aware of the nature
    of market-linked investments.


    Capital at Risk

    It is fundamental to understand that the value of investments can fall as well
    as rise. This means that the market value of your portfolio may decrease, and
    there is a real possibility that you may get back less than you originally invested.
    Past performance is not a reliable indicator of future results.


    FSCS Protection

    Your assets are protected by the Financial Services Compensation Scheme (FSCS).
    In the event that Copperleaf Invest fails, the FSCS provides protection of up
    to £85,000 per person. This protection is a statutory safeguard and is not a guarantee
    of the performance of your investments.


    Tax Treatment

    The tax-free status of the Copperleaf Stocks and Shares ISA is subject to the
    current UK tax regime. While we facilitate the use of the £20,000 annual ISA allowance,
    we do not provide individual tax advice. Changes in government legislation may
    affect the future tax treatment of these accounts.


    Regulatory Compliance

    We are strictly regulated by the FCA and adhere to all fair treatment and data
    privacy standards. We hold ourselves to a high standard of care to ensure that
    any complex products available through the platform are appropriate for the client''s
    needs and risk appetite.


    For more detailed regulatory information, please refer to Copperleaf Stocks and
    Shares ISA — regulatory disclosures.'
