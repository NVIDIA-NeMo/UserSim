- id: 933b28d3-8aa0-5ee1-bd1f-00b0db88e817
  title: place_trade tool reference
  body: 'The `place_trade` tool executes a buy or sell order for a specified asset
    in a customer''s account.


    **Tool Signature:** `place_trade(account_id: string, symbol: string, quantity:
    number, order_type: string)`


    **Arguments:**

    *   `account_id`: The unique identifier for the investment account (obtained via
    `get_accounts`).

    *   `symbol`: The ticker symbol of the asset to be traded.

    *   `quantity`: The number of units or shares to buy or sell.

    *   `order_type`: The direction of the trade (typically ''buy'' or ''sell'').


    **Effect:**

    Initiates a state-changing trade action that modifies the account''s positions
    and cash balance.


    **Agent Execution:**

    The agent performs this action by calling the tool directly. The agent must never
    instruct the customer to execute the trade themselves via the app if the customer
    has requested the agent to do so during a verified session.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: copperleaf_invest
- id: 7e8c7dc2-df8c-5c61-88b2-4aca907643f0
  title: When to use set_up_regular_investment
  body: "The `set_up_regular_investment` tool is used to establish, modify, or pause\
    \ a monthly investment plan for a customer. This is specifically for customers\
    \ using our Copperleaf Monthly Investing service.\n\n**Procedure for setting up\
    \ regular investments:**\n\n1.  **Verify Identity:** Perform full identity verification\
    \ using the `verify_identity` tool.\n2.  **Resolve Account ID:** Retrieve the\
    \ correct account identifier using the `get_accounts` tool.\n3.  **Confirm Monthly\
    \ Commitment:** Ensure the customer is aware of and agrees to the minimum monthly\
    \ commitment of £25. The agent should also mention that regular dealing fees for\
    \ this service are £0.\n4.  **Collect Investment Details:** Confirm the following:\n\
    \    *   The specific investments/assets to be purchased monthly.\n    *   The\
    \ total monthly amount (must be £25 or greater).\n    *   The preferred date for\
    \ the monthly debit.\n5.  **Execute Setup:** Call the `set_up_regular_investment`\
    \ tool with the confirmed details.\n6.  **Confirmation:** Provide the customer\
    \ with a confirmation that the regular investment plan has been active or updated.\n\
    \nFor technical argument requirements, refer to set_up_regular_investment tool\
    \ reference."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_regular_investment
  institution_id: copperleaf_invest
- id: 3a14287c-6447-522d-9fb3-5a1a65cfc5a7
  title: set_up_regular_investment tool reference
  body: 'The `set_up_regular_investment` tool is used to manage monthly automated
    investment plans.


    **Tool Signature:** `set_up_regular_investment(account_id: string, monthly_amount:
    number, investment_details: string, payment_date: string)`


    **Arguments:**

    *   `account_id`: The unique identifier for the investment account (obtained via
    `get_accounts`).

    *   `monthly_amount`: The amount to be invested each month (must be at least 25).

    *   `investment_details`: A description of the assets or funds to be invested
    in.

    *   `payment_date`: The day of the month the investment should be processed.


    **Effect:**

    Creates or updates a recurring investment instruction on the account.


    **Agent Execution:**

    The agent calls this tool directly after verifying the customer''s identity and
    confirming the plan details. The agent does not direct the customer to a self-service
    form.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_regular_investment
  institution_id: copperleaf_invest
- id: 76318a24-7439-5b29-86a4-2b35ddec079d
  title: When to use transfer_isa_in
  body: 'The `transfer_isa_in` tool is used to move an ISA held with another provider
    into a Copperleaf account. This process is critical for ensuring the customer
    does not inadvertently lose the tax-free status of their investments.


    **Procedure for ISA transfers:**


    1.  **Verify Identity:** Perform a full identity check using the `verify_identity`
    tool.

    2.  **Resolve Account ID:** Use the `get_accounts` tool to identify the target
    Copperleaf ISA account.

    3.  **Explain Transfer Rules:** The agent must clearly inform the customer that
    to preserve the tax-free status of the £20,000 annual allowance, the funds must
    be transferred directly between providers. The agent must explicitly warn the
    customer that funds must never be withdrawn to a personal bank account and then
    paid back in, as this would breach ISA rules.

    4.  **Collect Provider Details:** Obtain the name of the current ISA provider
    and the relevant account details from the customer.

    5.  **Execute Transfer Request:** Call the `transfer_isa_in` tool with the target
    account ID and the external provider details.

    6.  **Set Expectations:** Inform the customer of the typical timeline for the
    transfer to complete.


    For further details on the legal requirements of this process, refer to the Regulatory
    notes for Investing.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_in
  institution_id: copperleaf_invest
- id: bd49aa39-0c8d-58e8-ba0c-585adbefc01b
  title: transfer_isa_in tool reference
  body: 'The `transfer_isa_in` tool is used by agents to initiate the movement of
    ISA funds from another provider into a Copperleaf Invest account. This process
    ensures that the tax-free status of the annual £20,000 allowance is preserved;
    we strictly advise that funds must never be withdrawn and paid back in, as this
    would compromise the ISA''s tax advantages.


    To perform this action, the agent calls the tool directly using the following
    parameters:

    - Account Identifier: The unique ID of the Copperleaf account receiving the funds
    (obtained via `get_accounts`).

    - Transferring Provider: The full name of the institution currently holding the
    ISA.

    - Transfer Amount: The specific sum to be moved, or a designation for a full transfer.


    This tool is a state-changing action. Once executed, we coordinate with the previous
    provider to move the assets. Agents must ensure the customer is aware that while
    the transfer is in progress, the funds may be temporarily unavailable for trading.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_in
  institution_id: copperleaf_invest
- id: ffeda9f3-7e0f-5925-927a-b0d1d2b5a962
  title: When to use claim_lisa_home_purchase
  body: 'We provide the `claim_lisa_home_purchase` mechanism specifically for customers
    who have reached the stage of purchasing their first home. This is an irreversible
    action that releases the account''s investments and the 25% government bonus directly
    to a legal professional.


    This tool must only be used if the property being purchased does not exceed the
    maximum value of £450,000. We must remind customers that the value of investments
    can fall as well as rise, and capital is at risk, meaning the final amount released
    may differ from the balance seen at the start of the process.


    Agent Procedural Steps:

    1. Verify the customer''s identity using the mandatory multi-factor authentication
    and identity check process.

    2. Use `get_accounts` to resolve the account ID from the customer''s provided
    account details.

    3. Confirm that the home being purchased is the customer''s first home and that
    the purchase price is £450,000 or less.

    4. Collect the full name and professional bank details of the customer''s appointed
    conveyancer.

    5. Call the `claim_lisa_home_purchase` tool using the account ID and the conveyancer''s
    details.


    For more details on the account''s general rules, refer to Copperleaf Lifetime
    ISA — overview.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - claim_lisa_home_purchase
  institution_id: copperleaf_invest
- id: f062beab-6e61-5f96-afde-23c7b883040e
  title: claim_lisa_home_purchase tool reference
  body: 'The `claim_lisa_home_purchase` tool is used to liquidate all holdings within
    a Copperleaf Lifetime ISA and transfer the proceeds, including the 25% government
    bonus, to the customer''s conveyancer for a first home purchase.


    This is an irreversible action. The agent performs this by calling the tool directly
    with the following parameters:

    - Account Identifier: The ID of the Lifetime ISA (obtained via `get_accounts`).

    - Conveyancer Name: The full legal name of the firm or individual acting as the
    customer''s conveyancer.

    - Conveyancer Bank Details: The sort code and account number of the conveyancer''s
    client account.


    Once the tool is called, we process the sale of investments and initiate the payment.
    This action effectively closes the account''s investment positions for the purpose
    of the home purchase.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - claim_lisa_home_purchase
  institution_id: copperleaf_invest
- id: 47d9eb02-9814-580e-b1f8-aebcc04425b6
  title: When to use request_lisa_withdrawal
  body: 'The `request_lisa_withdrawal` tool is used when a customer wishes to withdraw
    funds from their Copperleaf Lifetime ISA for reasons other than the purchase of
    a first home. Because the Lifetime ISA is a specialised vehicle, unauthorised
    withdrawals are subject to a 25% government withdrawal charge.


    This charge is applied to the total amount withdrawn, which effectively removes
    the government bonus and a portion of the original contribution. The only exceptions
    to this charge are if the customer is 60 years of age or older, or if they are
    terminally ill.


    Agent Procedural Steps:

    1. Verify the customer''s identity using our rigorous verification standards.

    2. Use `get_accounts` to identify the specific account ID.

    3. Determine the reason for the withdrawal and the customer''s age.

    4. If the customer is under 60 and not terminally ill, clearly explain that a
    25% government withdrawal charge will apply to the request.

    5. Ensure the customer understands that capital is at risk and the value of the
    assets may have fluctuated.

    6. Call the `request_lisa_withdrawal` tool with the account ID and the requested
    withdrawal amount.


    For a detailed explanation of how these charges are calculated, see Copperleaf
    Lifetime ISA — withdrawal charge on unauthorised withdrawals explained.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_lisa_withdrawal
  institution_id: copperleaf_invest
- id: 65367397-a132-5f30-ae9e-adb8f7f0466a
  title: request_lisa_withdrawal tool reference
  body: "The `request_lisa_withdrawal` tool initiates a withdrawal from a Copperleaf\
    \ Lifetime ISA that is not for a first home purchase. \n\nThis tool is irreversible.\
    \ The agent executes this action by calling the tool directly with these parameters:\n\
    - Account Identifier: The ID of the Lifetime ISA (obtained via `get_accounts`).\n\
    - Withdrawal Amount: The specific sum the customer wishes to withdraw.\n\nThe\
    \ tool automatically applies the 25% government withdrawal charge if the customer\
    \ does not meet the exemption criteria (being 60 or over or terminally ill). The\
    \ net amount remaining after the charge is then processed for payment to the customer's\
    \ nominated bank account."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_lisa_withdrawal
  institution_id: copperleaf_invest
- id: fc15dbba-715d-5f13-a87a-62b4b3a7e8bd
  title: When to use update_beneficiary
  body: 'We use the `update_beneficiary` tool whenever a customer needs to change
    the nominated bank account that their withdrawals are paid to. To protect our
    customers and their assets, security is paramount, and this state-changing action
    requires full verification.


    Agent Procedural Steps:

    1. Verify the customer''s identity using multi-factor authentication to prevent
    fraudulent account redirection.

    2. Use `get_accounts` to resolve the correct account ID for the customer.

    3. Request the new bank account details from the customer, including the account
    number and sort code.

    4. Confirm the new details with the customer to ensure accuracy.

    5. Call the `update_beneficiary` tool using the account ID and the new bank account
    information.


    Once the update is complete, all subsequent withdrawals will be routed to the
    new nominated account. If the customer suspects their account has been compromised,
    escalate the matter immediately to our compliance team as per our fraud handling
    guidelines.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: copperleaf_invest
- id: dd50d5f6-f061-5e7e-a302-dfc92680ecaa
  title: update_beneficiary tool reference
  body: 'The `update_beneficiary` tool is used to change the bank account registered
    for receiving withdrawals from a specific Copperleaf Invest account.


    This is a state-changing action. The agent performs this update by calling the
    tool directly with the following parameters:

    - Account Identifier: The ID of the account being updated (obtained via `get_accounts`).

    - New Account Number: The 8-digit bank account number provided by the customer.

    - New Sort Code: The 6-digit sort code of the new bank account.


    Upon successful execution, the system replaces the existing payout destination
    with the new details provided. This action is subject to our rigorous identity
    checks to ensure the request is legitimate.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: copperleaf_invest
- id: 725bd87e-8852-5ea0-9e95-c2475df229dc
  title: When to use manage_authorized_users
  body: 'The `manage_authorized_users` tool is used when a customer needs to register
    a power of attorney on their account. This allows a trusted third party to manage
    the account on the customer''s behalf, ensuring the continuity of wealth management
    under legal authorisation.


    Agent Procedural Steps:

    1. Verify the customer''s identity using the standard mandatory verification process.

    2. Use `get_accounts` to resolve the account ID.

    3. Collect the full legal name, date of birth, and contact information of the
    person being appointed as the power of attorney.

    4. Ensure the customer has confirmed they possess the legal documentation to grant
    this authority.

    5. Call the `manage_authorized_users` tool with the account ID and the details
    of the authorised user.


    We treat the registration of authorised users with the highest level of security
    to prevent unauthorised access to client funds. Any disputes regarding the validity
    of a power of attorney should be escalated to operations management for resolution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: copperleaf_invest
- id: ed5b5527-6eb0-5e0e-a287-4c49c5b4cdfa
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool allows an agent to register a legal power
    of attorney on a customer''s account.


    This is a state-changing action. The agent performs this by calling the tool directly
    using the following parameters:

    - Account Identifier: The ID of the account (obtained via `get_accounts`).

    - Full Name: The legal name of the person being granted authority.

    - Date of Birth: The birth date of the authorised user for identity verification
    purposes.

    - Contact Information: The email address and phone number of the authorised user.


    Executing this tool updates the account permissions, allowing the named individual
    to perform actions on the account in accordance with the legal authority granted.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: copperleaf_invest
- id: 06cfd98a-3e42-5d5a-b870-1b9eb3733803
  title: When to use open_account
  body: 'We use the `open_account` tool to establish new investment vehicles for our
    clients. As we provide educational resources but no personal recommendations or
    individual tax advice, agents must ensure the customer has chosen the product
    that fits their needs based on our product descriptions.


    Available Products:

    - Copperleaf Stocks and Shares ISA: For long-term growth using the £20,000 annual
    ISA allowance.

    - Copperleaf Lifetime ISA: For retirement or a first home up to £450,000; offers
    a 25% government bonus for those aged 18 to 39.

    - Copperleaf Junior ISA: A tax-free starter account for children with a £9,000
    annual limit; control passes to the child at age 18.

    - Copperleaf General Investment Account: A flexible option for those who have
    used their ISA allowances, subject to the £3,000 capital gains and £500 dividend
    allowances.


    Agent Procedural Steps:

    1. Verify the customer''s identity using our mandatory verification and MFA process.

    2. Identify which of the four supported account types the customer wishes to open.

    3. Collect the customer''s full legal name, date of birth, and current contact
    information.

    4. Confirm the customer''s eligibility for the specific account (e.g., age 18-39
    for a Lifetime ISA).

    5. Call the `open_account` tool using the chosen product ID and the customer''s
    details.


    We must clearly communicate that the value of investments can fall as well as
    rise and capital is at risk. Customers should also be informed that their funds
    are protected by the FSCS for up to £85,000 per person.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: copperleaf_invest
- id: b03892cb-f1d5-57fa-be0e-ee6d3a2150e2
  title: open_account tool reference
  body: 'The open_account tool allows an agent to establish a new investment account
    for a customer. The agent performs this action by calling the tool directly within
    the conversation after the customer has selected their desired product.


    **Signature**

    `open_account(product_id: string, full_name: string, date_of_birth: string, email:
    string, address: string)`


    **Arguments**

    - `product_id`: The unique identifier for the product being opened. Valid IDs
    include ''stocks_shares_isa'', ''lifetime_isa'', ''junior_isa'', and ''general_investment_account''.

    - `full_name`: The customer''s full legal name as provided during the application
    process.

    - `date_of_birth`: The customer''s date of birth, used for eligibility verification
    (e.g., ensuring a customer is between 18 and 39 for a Copperleaf Lifetime ISA).

    - `email`: The primary email address to be associated with the account for secure
    digital communications.

    - `address`: The customer''s current residential address in the UK.


    **Effect**

    Calling this tool initiates the account opening process, creates the account record
    in the system, and triggers the necessary KYC (Know Your Customer) and identity
    verification workflows.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: copperleaf_invest
- id: e526137d-6403-5369-ae23-1d5e333e5552
  title: When to use get_accounts
  body: 'At Copperleaf Invest, we provide a digital-first support model to ensure
    our clients have clear and accessible paths to wealth creation. The get_accounts
    tool is the primary mechanism for agents to identify which accounts a customer
    holds with us, enabling us to provide precise and personalised support.


    Agents must use this tool whenever a customer refers to ''my account'' in the
    plural, asks for a summary of their holdings, or provides only a partial account
    identifier (such as the last four digits of an account number).


    **Procedure for Use**


    1. **Verify Identity**: Before accessing any account information, the agent must
    complete a full identity verification. This ensures we adhere to our strict data
    privacy standards and FCA regulations.

    2. **Call the Tool**: Execute the `get_accounts` tool. This will return a comprehensive
    list of all accounts associated with the verified customer, including their internal
    system identifiers and current status.

    3. **Resolve Account Identifiers**: If the customer has provided the last four
    digits of an account number, the agent must compare these digits against the list
    returned by `get_accounts` to determine the correct full internal account identifier.
    This resolution is mandatory before performing any state-changing action on a
    specific account.

    4. **Communicate Clearly**: Once the accounts are identified, the agent should
    confirm the account types (e.g., Copperleaf Stocks and Shares ISA or Copperleaf
    General Investment Account) with the customer to ensure the correct portfolio
    is being discussed.


    By following this process, we maintain our commitment to security and transparency.
    For a detailed technical breakdown of this tool''s parameters, refer to the get_accounts
    tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: copperleaf_invest
- id: 7ed37761-6158-5049-9bb6-3cc21a10eac9
  title: get_accounts tool reference
  body: 'The get_accounts tool retrieves a full list of all investment accounts held
    by the verified customer. The agent performs this action by calling the tool directly
    to resolve account identities or to provide the customer with an overview of their
    portfolio.


    **Signature**

    `get_accounts()`


    **Arguments**

    This tool does not require any arguments; it operates based on the identity of
    the customer currently verified in the active session.


    **Effect**

    Calling this tool returns an array of account objects. Each object contains the
    full internal account identifier, the product type (e.g., ''stocks_shares_isa''),
    the current balance, and the account status (e.g., ''active'' or ''closed'').
    This is the authoritative source for mapping customer-provided partial account
    numbers to system-recognised identifiers.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: copperleaf_invest
- id: a89cf8be-61df-522c-bbd9-341ad446c998
  title: When to use close_account
  body: 'Closing an account is a significant event that requires the highest level
    of scrutiny to protect our customers and ensure compliance with FCA guidelines.
    Because account closure is an irreversible action, we must ensure the customer
    is fully informed and verified before proceeding.


    **Procedure for Account Closure**


    1. **Identity Verification**: Perform a full identity check using multi-factor
    authentication. We do not process closures without rigorous verification to prevent
    unauthorised account termination.

    2. **Account Identification**: If the customer has not provided a full account
    identifier, the agent must first call `get_accounts` to retrieve the correct identifier
    for the specific account the customer wishes to close.

    3. **Confirm Irreversibility**: The agent must explicitly inform the customer
    that the action is irreversible. This includes explaining that once the account
    is closed, it cannot be reopened with the same history.

    4. **Risk and Protection Disclosure**: Remind the customer that while their capital
    is at risk (as the value of investments can fall as well as rise), any remaining
    cash balances are protected by the FSCS up to £85,000 per person.

    5. **Execute Closure**: Once the customer provides explicit consent, the agent
    calls the `close_account` tool using the resolved account identifier.

    6. **Confirmation**: Confirm to the customer that the request has been processed
    and advise them on how they will receive their final statement.


    This professional and transparent approach ensures that we treat all customers
    fairly and maintain a clear audit trail for all irreversible actions. For technical
    details on the tool''s execution, see the close_account tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: copperleaf_invest
- id: fb3888cb-ec60-5139-8698-fc1c1c83915e
  title: close_account tool reference
  body: 'The close_account tool is used to permanently terminate a customer''s investment
    account. The agent performs this action by calling the tool directly after full
    identity verification and explicit customer consent have been obtained.


    **Signature**

    `close_account(account_id: string)`


    **Arguments**

    - `account_id`: The full internal system identifier for the account to be closed.
    This should be resolved using the `get_accounts` tool if the customer has only
    provided partial details.


    **Effect**

    Calling this tool marks the account as closed and prevents any further trades,
    deposits, or contributions. This is an irreversible action. The system will trigger
    the final liquidation of assets (if applicable) and the generation of a final
    closing statement for the customer.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: copperleaf_invest
- id: 80f3c3ed-d8e9-5bce-9379-387f7f4e3596
  title: When to use update_contact_info
  body: 'Security is paramount at Copperleaf Invest. Altering account details, including
    contact information, is a state-changing action that could be exploited by fraudulent
    actors. Therefore, we employ rigorous verification steps before any updates are
    made.


    **Procedure for Updating Contact Details**


    1. **Mandatory Verification**: The agent must perform a full identity verification.
    This must include multi-factor authentication to ensure the request is legitimate
    and the person requesting the change is the account holder.

    2. **Identify the Target Account**: Use the `get_accounts` tool to identify the
    specific account identifier associated with the customer''s request, especially
    if they hold multiple tax-efficient wrappers.

    3. **Gather New Information**: Clearly document the specific field the customer
    wishes to change (e.g., email address, residential address, or phone number) and
    the new value to be entered.

    4. **Execute the Update**: Call the `update_contact_info` tool using the resolved
    account identifier and the new contact details.

    5. **Notification**: Inform the customer that they will receive a confirmation
    of this change via their old and new contact methods (where applicable) to ensure
    transparency and security.


    Our commitment to fairness and transparency means we never update account details
    based on an unverified request. For the specific technical requirements of this
    action, please see the update_contact_info tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
