- id: 133fc9ed-8b4e-50bf-a06e-4ca16e51ceb9
  title: Copperleaf Stocks and Shares ISA — current offer
  body: 'We are pleased to announce a limited-time incentive for our existing customers
    to help them maximise their tax-efficient investing for the current tax year.


    **Offer: The Diversification Bonus**

    From 1st November 2024 to 31st December 2024, we are offering a cash bonus of
    £50 to any existing customer who increases their total ISA balance by at least
    £5,000 through new contributions.


    **Terms and Conditions:**

    - The bonus is awarded as a cash credit to the account.

    - All new contributions must stay within the total £20,000 annual ISA allowance.

    - The standard costs still apply: the 0.25% platform fee, £5.95 share dealing
    fee, and £0 fund dealing fee remain unchanged during this promotion.

    - The bonus will be credited within 30 days of the funds clearing in the account.


    This offer is designed to encourage the use of tax-efficient wrappers for long-term
    growth. For a full breakdown of our standard costs, please see the Copperleaf
    Stocks and Shares ISA — fee schedule.'
