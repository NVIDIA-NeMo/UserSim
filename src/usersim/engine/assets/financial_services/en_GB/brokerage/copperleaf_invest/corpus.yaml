- id: 080b70e3-9fe2-53ff-971a-2566eac9516a
  title: Copperleaf Stocks and Shares ISA — annual platform fee explained
  body: 'Q: What is the annual platform fee for my Copperleaf Stocks and Shares ISA?


    A: We charge a platform fee of 0.25%. This fee covers the cost of the infrastructure,
    secure technology, and ongoing maintenance required to keep your account running
    smoothly and securely.


    Q: How is the platform fee applied to my account?


    A: The fee is calculated based on the total value of your assets held with us.
    By maintaining a transparent 0.25% fee, we ensure the long-term sustainability
    of our platform while remaining competitive within the mid-market brokerage space.


    Q: Does the platform fee include the cost of buying and selling shares?


    A: No, the platform fee is separate from dealing charges. While the 0.25% fee
    covers account maintenance, transactions may incur additional costs, such as our
    £5.95 share dealing fee. For more details, please refer to the Copperleaf Stocks
    and Shares ISA — fee schedule.'
  domain: brokerage_investing
