- id: 24826f8d-6149-5750-bc71-3bf8e6e7e9eb
  title: Copperleaf General Investment Account — set up and activate
  body: 'Setting up your Copperleaf General Investment Account is a straightforward
    process designed to get you investing as quickly as possible while maintaining
    the highest security standards.


    Before you begin, please ensure you have your valid UK government-issued photo
    identification (such as a passport or driving licence) and a recent proof of address
    (such as a utility bill or council tax statement) ready for the verification process.


    1. Request to open an account: Inform us that you wish to open a Copperleaf General
    Investment Account. We will then initiate the application process and provide
    you with a secure link to enter your personal details.

    2. Complete identity verification: Provide the requested identification and address
    documents. Our team will perform rigorous identity checks to comply with FCA regulations.
    You will receive a confirmation message once your identity has been successfully
    verified.

    3. Enable security protocols: We will guide you through the setup of multi-factor
    authentication (MFA). This is a mandatory step to ensure that only you can access
    your funds and perform state-changing actions on the account.

    4. Fund your account: Provide us with your preferred funding method and the amount
    you wish to deposit. We will confirm once the funds have been received and are
    available for investment.

    5. Activate your investment strategy: Once the account is funded, you can begin
    selecting your investments. You will receive a notification confirming that your
    account is fully active and ready for use.


    You will know the process is complete when you receive a final confirmation message
    stating that your account is open, verified, and funded. If you are comparing
    this setup process with our tax-free options, you may also be interested in the
    Copperleaf Stocks and Shares ISA — set up and activate.'
  domain: brokerage_investing
