- id: 8a75a7f1-cbc2-561d-b303-70d5d2ffb2ee
  title: Copperleaf Stocks and Shares ISA — choosing between tiers or options
  body: 'When using the Copperleaf Stocks and Shares ISA, customers often choose between
    fund-based investing and share-based investing to maximise their £20,000 annual
    allowance.


    Fund Investing

    - Cost: £0 fund dealing fee.

    - Strategy: Best for those seeking immediate diversification and a lower entry
    cost per transaction.

    - Suitability: Ideal for long-term savers who prefer a ''hands-off'' approach
    to diversification.


    Share Investing

    - Cost: £5.95 share dealing fee per trade.

    - Strategy: Best for those who wish to select individual companies and have a
    more targeted investment approach.

    - Suitability: Ideal for experienced investors who are comfortable with the higher
    concentration of risk.


    Both options are subject to the same 0.25% platform fee. We encourage clients
    to consider a blended approach to balance cost and diversification. Regardless
    of the choice, remember that the value of investments can fall as well as rise
    and capital is at risk. For a broader view of the product, see Copperleaf Stocks
    and Shares ISA — overview.'
