- id: f31699de-f3d2-57fa-9fd8-2b593af627f5
  title: Copperleaf Lifetime ISA — a declined or blocked action
  body: 'If you are comparing our platform to others and find that a specific action—such
    as a contribution or a withdrawal—has been declined or blocked, it is usually
    due to our strict adherence to FCA regulations and security standards.


    **Common Symptoms**

    You may receive a notification stating that your transaction cannot be processed,
    or your request to move funds has been rejected.


    **Likely Causes**

    1. **Annual Limit Exceeded**: You may have already contributed the maximum annual
    limit of £4,000 for the current tax year. Any further contributions would be declined.

    2. **Verification Failure**: Full identity verification is mandatory before any
    state-changing action. If your documentation is out of date or incomplete, the
    action will be blocked.

    3. **Age Eligibility**: If you are attempting to open an account and are aged
    40 or over, the action will be declined as the maximum opening age is 39.

    4. **Unauthorised Withdrawal**: If you are attempting to withdraw funds for a
    home purchase but the property value exceeds the £450,000 cap, the request may
    be blocked until you acknowledge the 25% withdrawal charge.


    **What to Check and Fix**

    - **Check your balance**: Review your current tax year contributions. If you have
    reached £4,000, you must wait until the next tax year to contribute more.

    - **Verify identity**: Ensure all your KYC (Know Your Customer) documents are
    current. If they are not, provide updated identification via secure messaging.

    - **Review Property Value**: If claiming for a home, double-check that the purchase
    price is £450,000 or less.


    **When to Escalate**

    If you believe the action was blocked in error, notify us via secure messaging.
    We will raise a case with our operations management team. You can expect a response
    and a resolution timeline within our defined customer service windows. For more
    on account rules, see Copperleaf Lifetime ISA — overview.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
