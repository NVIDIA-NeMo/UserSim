- id: da307029-c7c8-556a-8f36-862c93d57130
  title: Copperleaf Stocks and Shares ISA — change-of-terms policy
  body: "This policy outlines the conditions under which Copperleaf Invest may amend\
    \ the terms and conditions governing the Copperleaf Stocks and Shares ISA. We\
    \ are committed to transparency and fairness in all our dealings with our clients.\n\
    \nWe reserve the right to modify our fee structure, including the 0.25% platform\
    \ fee, the £5.95 share dealing fee, or the £0 fund dealing fee, to ensure the\
    \ long-term sustainability of our platform. Such changes may be triggered by regulatory\
    \ updates from the FCA, shifts in infrastructure costs, or changes in our service\
    \ model.\n\nIn the event of a change to the terms, we will provide all affected\
    \ customers with a minimum notice period of 30 days before the new terms take\
    \ effect. This notice will be delivered via secure in-app messaging and email.\
    \ The notice will clearly state the specific term being changed, the previous\
    \ value, the new value, and the date of implementation.\n\nCustomers who do not\
    \ agree to the revised terms may choose to close their account or transfer their\
    \ holdings to another provider. If you choose to transfer, we will assist in ensuring\
    \ the process preserves the tax-free status of your £20,000 annual allowance.\
    \ \n\nContinued use of the account following the end of the notice period constitutes\
    \ acceptance of the new terms. We hold ourselves to a high standard of care to\
    \ ensure that any changes remain fair and that our cost structures remain clear\
    \ and accessible for all UK residents seeking wealth creation. Please remember\
    \ that regardless of terms, the value of investments can fall as well as rise\
    \ and capital is at risk."
