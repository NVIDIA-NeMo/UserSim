- id: f534ad29-4fd5-5b7f-9b5c-b241e4957ac3
  title: Copperleaf Junior ISA — eligibility requirements
  body: 'To open a Copperleaf Junior ISA, the following conditions must be met. The
    outcome is based on the simultaneous fulfilment of all requirements.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Child''s Residency | Must be a resident of the UK | Eligible |

    | Child''s Age | Must be under the age of 18 | Eligible |

    | Existing Accounts | Must not already hold another Junior ISA | Eligible |

    | Adult Account Holder | Must be a UK resident and undergo full ID verification
    | Eligible |


    If any of the above conditions are not met (e.g., the child is already 18 or resides
    outside the UK), the application for a Copperleaf Junior ISA will be declined.
    For more details on the account''s features, see the Copperleaf Junior ISA — overview.'
