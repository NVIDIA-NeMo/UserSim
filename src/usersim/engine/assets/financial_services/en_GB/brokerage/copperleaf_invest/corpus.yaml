- id: 9a204bbe-e281-5a8c-971e-cdb222299420
  title: Copperleaf Stocks and Shares ISA — privacy and data handling
  body: 'Copperleaf Invest is strictly regulated by the FCA and adheres to all fair
    treatment and data privacy standards. This disclosure outlines how we handle your
    personal and financial data in relation to your Copperleaf Stocks and Shares ISA.


    Data Collection and Purpose

    We collect and process personal data, including your identity and tax information,
    to satisfy our legal obligations and to ensure the security of your account. This
    data is used to facilitate your use of the £20,000 annual ISA allowance and to
    monitor for fraudulent activity.


    Security Measures

    Security is paramount at our institution. We employ multi-factor authentication
    (MFA) and rigorous identity checks to prevent unauthorised access. Full verification
    is mandatory before we perform any state-changing action, such as processing withdrawals
    or altering account details. All data is encrypted and handled in accordance with
    current UK data protection laws.


    Disclosure to Third Parties

    We only disclose your data to third parties where required by law or for the purpose
    of facilitating an ISA Transfer between providers. In such cases, we ensure that
    the transfer preserves the tax-free status of your allowance.


    Client Rights

    Under FCA guidelines and data privacy laws, you have the right to request access
    to the data we hold about you and to request corrections where inaccuracies exist.
    We handle such requests with a commitment to fairness and transparency, providing
    a clear timeline for resolution.


    Risk Warning

    While we protect your data and your assets are covered by FSCS protection of up
    to £85,000 per person if the brokerage fails, this does not protect against market
    loss. We clearly communicate that the value of investments can fall as well as
    rise and capital is at risk.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: disclosure
