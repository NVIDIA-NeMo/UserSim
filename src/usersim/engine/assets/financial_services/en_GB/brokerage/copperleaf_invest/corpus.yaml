- id: 595024ff-0ec0-5758-828c-05be33220847
  title: Copperleaf Stocks and Shares ISA — a failed or pending action
  body: 'If you encounter an issue where a trade, deposit, or withdrawal appears as
    ''pending'' or has ''failed'', please follow these steps to resolve the matter.


    **Symptom: A transaction is stuck in ''pending'' status.**

    Likely causes include incomplete identity verification or a delay in the clearing
    of funds from your external bank.

    - Check your verification status: Ensure you have completed the mandatory multi-factor
    authentication and identity checks. If these are outstanding, the action will
    remain pending.

    - Verify fund availability: Check that the funds for the trade have fully cleared
    into your Copperleaf account.

    - Fix: If verification is missing, provide the requested documentation via our
    secure messaging system. If funds are delayed, allow 3-5 business days for bank
    clearing.


    **Symptom: A withdrawal or account change has ''failed''.**

    Likely causes include a mismatch in account details or a failure in the security
    verification process.

    - Check your account details: Ensure the destination bank account is in the same
    name as the ISA holder.

    - Verify your MFA: Ensure your multi-factor authentication is active and was correctly
    applied to the request.

    - Fix: Update any incorrect account details through our secure channel and re-submit
    the request.


    **When to escalate**

    If the issue persists after following these steps, or if you believe there is
    a technical error, we will escalate the matter to our operations management team.
    Once escalated, we will investigate the transaction logs and provide a resolution
    timeline. You will receive updates via secure in-app messaging throughout the
    process.


    For more information on the rules governing your account, see Copperleaf Stocks
    and Shares ISA — eligibility requirements.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: troubleshooting
  source_authority: official
