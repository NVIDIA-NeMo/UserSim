- id: 2815c510-a8a1-5dfa-91c5-46ff24e9b308
  title: Copperleaf Lifetime ISA — regulatory disclosures
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA). We adhere to all fair treatment and data privacy standards to ensure the
    protection of our clients.


    **Investment Risk**

    Please be advised that the value of investments can fall as well as rise. This
    means that the market value of your Copperleaf Lifetime ISA may decrease, and
    you may get back less than you originally invested. Capital is at risk.


    **FSCS Protection**

    In the event that the brokerage fails, your funds are protected by the Financial
    Services Compensation Scheme (FSCS) up to a maximum of £85,000 per person.


    **Tax Status and Advice**

    The Copperleaf Lifetime ISA is a tax-efficient wrapper. While we provide educational
    resources to help you understand how these accounts work, we give no personal
    recommendations and no individual tax advice. We recommend that you consult a
    qualified tax professional for guidance tailored to your specific circumstances.


    **Withdrawal Penalties**

    This account is designed for specific long-term goals. Withdrawals made for any
    purpose other than the purchase of a first eligible home (priced up to £450,000)
    or upon reaching the age of 60 will be subject to a withdrawal charge of 25%.
    This charge is intended to recoup the government bonus and may result in you receiving
    less than your original contribution.


    **Fees and Costs**

    Our platform operates with a transparent 0.25% fee to cover infrastructure and
    maintenance. We maintain a £0 fund dealing fee to support the diversification
    of your portfolio. All fees are disclosed clearly and are non-negotiable to ensure
    the long-term sustainability of our services.


    For a full breakdown of costs, please refer to Copperleaf Lifetime ISA — fee schedule.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: disclosure
  source_authority: official
