- id: 9cab62b1-7bcf-5dfb-b401-6d4df223c264
  title: Copperleaf Lifetime ISA — privacy and data handling
  body: 'This disclosure outlines how Copperleaf Invest handles your personal and
    financial data in relation to your Copperleaf Lifetime ISA. We operate in strict
    accordance with FCA regulations and UK data privacy standards.


    **Data Collection and Purpose**

    To maintain your account and ensure you receive the 25% government bonus, we collect
    and process your full legal name, date of birth, residential address, and National
    Insurance number. This data is used to verify your identity and to report contributions
    to HM Revenue & Customs (HMRC) to facilitate the bonus payment.


    **Identity Verification and Security**

    Security is paramount at Copperleaf Invest. We employ multi-factor authentication
    (MFA) and perform rigorous identity checks before processing any state-changing
    actions, such as withdrawals or changes to account details. This ensures that
    your funds—and the government''s contributions—are protected from unauthorised
    access.


    **Data Sharing and Compliance**

    We share specific account data with regulatory bodies and the government as required
    by law to maintain the tax-free status of your ISA. We do not sell your personal
    data to third-party marketers. All data handling is conducted through our secure
    digital-first support model during UK business hours (GMT).


    **Your Rights and Protection**

    Under UK data protection laws, you have the right to request access to the data
    we hold about you and to request corrections where errors exist. Please note that
    while your data is handled securely, the value of your investments can fall as
    well as rise and capital is at risk. However, your funds are protected by the
    FSCS for up to £85,000 per person per firm in the event of brokerage failure.


    **Reporting and Audits**

    We maintain a clear and transparent audit trail of all transactions and identity
    verifications. This ensures that our adherence to fair treatment and data privacy
    standards is verifiable by the FCA and other relevant authorities.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: afa8fc10-1b75-59d8-871f-25af7b69b5c9
  title: Copperleaf Lifetime ISA — recognising scams targeting this product
  body: 'As you compare our offerings with other providers, it is vital to remain
    vigilant regarding the security of your assets. The Copperleaf Lifetime ISA is
    a popular vehicle for long-term wealth, and unfortunately, this makes it a target
    for sophisticated fraud patterns.


    Common scams targeting Lifetime ISA holders often involve ''bonus acceleration''
    claims. Scammers may contact you via email or social media, claiming they can
    help you unlock the 25% government bonus faster or bypass the property price cap
    of £450,000 through unofficial channels. Please be aware that these are fraudulent
    claims. The government bonus is applied according to strict regulatory guidelines
    and cannot be ''fast-tracked'' by third parties.


    We employ multi-factor authentication and rigorous identity checks to protect
    your account. To keep your funds secure, please remember that we will never ask
    you to provide your full password, your multi-factor authentication codes, or
    your private security keys over the phone or via an unsolicited email. We will
    never pressure you to move funds into a ''safe account'' to avoid a penalty or
    to secure a bonus.


    If you encounter a communication that seems suspicious—particularly one promising
    an unrealistic return or a way to circumvent the 25% withdrawal charge—do not
    click any links or provide personal details. The first action you should take
    is to notify us immediately via our secure in-app messaging or email. All fraudulent
    activity is escalated immediately to our compliance team and handled in accordance
    with FCA guidelines.


    Remember that while we provide a secure platform, the value of investments can
    fall as well as rise and capital is at risk. However, your deposits are protected
    by the FSCS for up to £85,000 per person if the brokerage fails. Always ensure
    you are communicating with us through our official, secure digital channels during
    UK business hours (GMT).'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 3deaad87-0397-5ed5-a788-0508760c12fc
  title: Copperleaf Lifetime ISA — limits, restrictions, and edge cases
  body: 'This document provides support agents with the critical limits and restrictions
    governing the Copperleaf Lifetime ISA to ensure accurate customer guidance.


    **Contribution Limits**

    Customers are subject to an annual limit of £4,000. This is the maximum amount
    that can be paid into the account within a single tax year to qualify for the
    government bonus. Agents must ensure customers understand that payments exceeding
    this limit cannot be accepted into the Lifetime ISA wrapper.


    **The Government Bonus**

    Eligible contributions attract a government bonus rate of 25%. This bonus is applied
    to the account to accelerate savings for a first home or retirement.


    **Age Restrictions**

    Eligibility for opening a new account is strictly limited by age. The maximum
    opening age is 39. Once a customer has reached their 40th birthday, they can no
    longer open a new Copperleaf Lifetime ISA, although they may continue to contribute
    to an existing one if they opened it before age 40.


    **Withdrawal Penalties and Charges**

    Withdrawals are strictly regulated. If a customer withdraws funds for any reason
    other than purchasing their first home (up to the property price cap of £450,000)
    or reaching age 60, a withdrawal charge of 25% is applied. This charge effectively
    recovers the government bonus and a portion of the original investment, meaning
    the customer will receive back less than they originally invested.


    **Property Value Cap**

    The account can be used to purchase a first home with a maximum value of £450,000.
    Purchases above this threshold do not qualify for a penalty-free withdrawal.


    **Risk and Protection**

    Always remind customers that the value of investments can fall as well as rise
    and capital is at risk. We must also highlight that the account is protected by
    the FSCS up to £85,000 per person. For further details on account setup, refer
    to Copperleaf Lifetime ISA — overview.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
