- id: 2924abd7-673c-5f07-9cc8-82834e0a6d6a
  title: Copperleaf Monthly Investing — minimum monthly investment explained
  body: 'Q: What is the minimum amount I must commit to for Copperleaf Monthly Investing?


    A: To maintain the sustainability and efficiency of our automated service, we
    require a minimum monthly amount of £25. This ensures that the account remains
    active and aligned with our goal of providing accessible wealth creation for all
    UK residents.


    Q: Can I invest less than £25 in a single month?


    A: The monthly investing feature requires a commitment of at least £25 to function.
    If you wish to invest smaller amounts sporadically, you may do so via a one-off
    trade in your account, though these may be subject to different dealing fees.
    Please refer to the Copperleaf Monthly Investing — fee schedule for more details.


    Q: Can I increase my monthly contribution above the £25 minimum?


    A: Yes, you are welcome to increase your monthly contribution to any amount that
    suits your budget and financial goals. There is no upper limit on the monthly
    amount, provided you remain within the annual limits of your chosen tax wrapper.'
