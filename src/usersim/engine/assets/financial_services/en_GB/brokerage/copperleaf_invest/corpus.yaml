- id: 942386d9-4a3d-5700-aee8-9aa6493e2d2e
  title: Copperleaf General Investment Account — a declined or blocked action
  body: 'If you have attempted to make a withdrawal, alter your account details, or
    execute a trade and the action was declined, it is likely due to one of the following
    causes:


    Common Causes

    - Incomplete Verification: Security is our priority. If your identity checks are
    not fully up to date, state-changing actions are automatically blocked.

    - Compliance Review: Certain high-value transactions may be temporarily paused
    for a standard regulatory review to ensure fair treatment and data privacy.

    - Insufficient Settled Funds: If you are attempting to withdraw or trade, the
    funds must be fully ''settled'' (meaning the trade has cleared) rather than just
    ''pending''.


    How to resolve this

    1. Check your verification status: Ask us to confirm if your identity verification
    is current. If it has expired or is incomplete, we will guide you through the
    necessary identity checks.

    2. Verify fund status: Ask us to check if the funds you are attempting to move
    are currently ''settled'' or ''pending''.

    3. Request a status update: If the action was blocked for a compliance review,
    ask us for the current status of the review.


    When we escalate

    If the block is due to a complex dispute or a technical error, we will escalate
    the query to our operations management. You will receive a confirmation of the
    escalation and a clear timeline for when you can expect a resolution.


    Throughout this process, please be assured that our commitment to transparency
    and fairness remains paramount.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
