- id: cafcd76e-613b-58c8-b7b1-5cd6013cb3a9
  title: Copperleaf Monthly Investing — fraud and unauthorised-activity protection
  body: 'At Copperleaf Invest, we recognise that the ''set and forget'' nature of
    Copperleaf Monthly Investing can make customers a target for specific types of
    fraudulent activity. Because these accounts involve recurring payments, fraudsters
    may attempt to impersonate our staff to convince you to alter your linked bank
    details or redirect your monthly contributions to an external account.


    We employ multi-factor authentication and rigorous identity checks to ensure that
    only you can access your account. Please be aware that we will never ask you to
    share your password, your multi-factor authentication codes, or your full security
    credentials via email or secure messaging. Any request to move funds to a ''safe
    account'' or to change your payment instructions via an urgent, unsolicited message
    should be treated as fraudulent.


    If you notice any unauthorised changes to your monthly investment amount, or if
    you suspect your account has been compromised, you must inform us immediately.
    Prompt reporting is essential to mitigate loss and ensures we can escalate the
    matter to our compliance team in accordance with FCA guidelines. We are committed
    to fairness and transparency, and we will provide a clear timeline for the resolution
    of any reported fraud.


    For your peace of mind, all eligible holdings are protected by the Financial Services
    Compensation Scheme (FSCS) for up to £85,000 per person per firm. This ensures
    that your capital is protected up to this limit should the brokerage fail.


    To further safeguard your wealth, we recommend regularly reviewing your account
    statements to ensure your recurring contributions are being applied correctly.
    For more information on our general security standards, you may wish to refer
    to Copperleaf Monthly Investing — overview.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: a1950b9b-6c2c-584c-82d7-6ca0f685b6cb
  title: Copperleaf Monthly Investing — account agreement
  body: 'This agreement outlines the terms and conditions governing the use of Copperleaf
    Monthly Investing. By activating this service, the client agrees to the following
    obligations:


    1. Payment Commitment: The client must maintain a minimum monthly investment of
    £25. This amount will be debited from the nominated bank account on the agreed
    date each month. Failure to maintain sufficient funds may result in a failed instruction
    and a temporary suspension of the regular investment facility.


    2. Fee Structure: We provide a regular dealing fee of £0 for all monthly contributions
    to encourage diversified, long-term investing. However, the standard platform
    fee of 0.25% applies to the total value of the assets held on the platform. This
    fee covers the essential infrastructure and maintenance of your account and is
    charged periodically.


    3. Verification and Security: Full identity verification is mandatory before any
    state-changing action is performed, including the alteration of the monthly investment
    amount, changing linked bank details, or processing withdrawals. We employ multi-factor
    authentication to ensure the security of these transactions.


    4. Termination and Changes: Clients may cancel, downgrade, or close their monthly
    investing facility at any time, subject to the notification process described
    in our support guides. We reserve the right to amend these terms to ensure the
    long-term sustainability of our platform, providing clients with a defined notice
    period before such changes take effect.


    5. Regulatory Standing: Copperleaf Invest is strictly regulated by the FCA. We
    adhere to all fair treatment and data privacy standards. While we provide the
    platform for self-directed investing, we do not provide personal recommendations
    or individual tax advice.


    6. Protection: Client funds are protected by the FSCS for up to £85,000 per person.'
