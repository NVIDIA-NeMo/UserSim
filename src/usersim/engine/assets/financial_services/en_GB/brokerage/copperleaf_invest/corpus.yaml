- id: 1ad31744-f80b-5435-b9cb-c03e521e5437
  title: Copperleaf Stocks and Shares ISA — vs. a similar product here
  body: 'When deciding between a Copperleaf Stocks and Shares ISA and our Copperleaf
    General Investment Account (GIA), the primary consideration is tax efficiency.


    **Copperleaf Stocks and Shares ISA**

    - Tax Treatment: All capital gains and dividends are tax-free.

    - Limit: Subject to a strict £20,000 annual contribution limit.

    - Cost: 0.25% platform fee; £5.95 share dealing; £0 fund dealing.

    - Best for: Investors seeking long-term, tax-sheltered wealth creation within
    government limits.


    **Copperleaf General Investment Account**

    - Tax Treatment: Subject to UK capital gains and dividend taxes once allowances
    are exceeded.

    - Limit: No limit on the amount you can deposit.

    - Cost: 0.25% platform fee; £5.95 share dealing; £0 fund dealing.


    While the cost structures are identical, the ISA is the superior choice for those
    who have not yet exhausted their £20,000 annual allowance. The GIA is the appropriate
    alternative for those who have already maximised their ISA contributions for the
    tax year but wish to continue investing.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: a02088b6-0029-5012-ba48-f772f1a1c74b
  title: Copperleaf Stocks and Shares ISA — regulatory disclosures
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA) and adheres to all fair treatment and data privacy standards. This document
    serves as a formal disclosure of the risks and protections associated with the
    Copperleaf Stocks and Shares ISA.


    **Investment Risk**

    Investors are hereby notified that the value of investments can fall as well as
    rise. The price of stocks, shares, and funds is subject to market volatility.
    Consequently, there is a risk that the value of your portfolio may decrease, and
    you may get back less than the original amount invested. This is termed as ''capital
    at risk''.


    **Compensation Scheme**

    In the event that Copperleaf Invest fails, eligible customers are protected by
    the Financial Services Compensation Scheme (FSCS). This protection covers up to
    £85,000 per person. This limit applies per firm; should the brokerage become unable
    to meet its obligations, the FSCS provides this safety net to recover qualified
    assets up to the stated threshold.


    **Advice and Tax Status**

    We provide a platform for self-directed investing and a variety of educational
    resources. However, Copperleaf Invest does not provide personal recommendations,
    financial planning, or individual tax advice. While the Stocks and Shares ISA
    is a tax-efficient wrapper utilising the £20,000 annual allowance, customers are
    responsible for their own tax affairs and are encouraged to seek independent professional
    advice if they are unsure of their tax position.


    **Security and Verification**

    To ensure the security of client assets, we employ multi-factor authentication
    (MFA) and rigorous identity checks. Full verification is mandatory before any
    state-changing action—including the processing of withdrawals or the alteration
    of account details—is performed. We handle all fraudulent activity in accordance
    with FCA guidelines, escalating such matters immediately to our internal compliance
    team.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 95f7b3df-57f1-5b7a-84e4-a212c6d0eeb7
  title: Copperleaf Stocks and Shares ISA — interest rate / AER schedule
  body: 'The Copperleaf Stocks and Shares ISA is an investment account, not a cash
    savings account. Therefore, it does not offer a single, flat annual interest rate
    or AER on the total balance.


    Instead, the growth of your account is derived from the performance of the assets
    you choose to hold, such as dividends from shares or the increase in the net asset
    value of funds. These yields vary based on the specific instruments selected and
    the movements of the market.


    To maintain the platform that enables this growth, we apply a flat platform fee
    of 0.25% across all account balances. This fee is the primary constant affecting
    your net return, regardless of the assets held. There are no tiered rates for
    this platform fee; it applies uniformly to all customers to ensure transparency
    and simplicity.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: rate_sheet
  source_authority: official
  placeholder: true
