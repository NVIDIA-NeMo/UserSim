- id: ff9d8200-24d5-513d-98a8-b8af9056918b
  title: Copperleaf General Investment Account — change-of-terms policy
  body: 'This policy outlines the conditions under which Copperleaf Invest may amend
    the terms and conditions governing the Copperleaf General Investment Account.
    We maintain a commitment to transparency and fairness in all our client relationships.


    **Amendments to Fees**

    We reserve the right to adjust our pricing model to ensure the long-term sustainability
    of our platform. This includes, but is not limited to, the platform fee, currently
    set at 0.25%. Any increase to this fee will be communicated to you with a minimum
    notice period of 30 days via your registered email address and secure in-app messaging.


    **Regulatory Adjustments**

    Terms may be updated without a notice period if such changes are mandated by the
    FCA or changes in UK law. This includes updates to the reporting of the £3,000
    capital gains allowance or the £500 dividend allowance, as these are determined
    by government tax legislation and not by Copperleaf Invest.


    **Client Obligations and Acceptance**

    Continued use of the account following the expiry of a notice period constitutes
    your acceptance of the revised terms. If you do not agree to the new terms, you
    have the right to close your account and transfer your assets. We will process
    such requests in accordance with our standard withdrawal and closure procedures.


    **Termination of Agreement**

    Either party may terminate this agreement upon written notice. Copperleaf Invest
    may terminate the agreement immediately if we suspect fraudulent activity or a
    breach of FCA fair treatment standards. Upon termination, all remaining assets
    will be liquidated or transferred following full identity verification, ensuring
    that no state-changing action is performed without rigorous checks. Please be
    mindful that the value of investments can fall as well as rise, and capital is
    at risk during the liquidation process.'
