- id: 65603b6a-b3a4-51ff-a744-478e0877018f
  title: Copperleaf Stocks and Shares ISA — qualification tiers
  body: 'The following matrix defines the qualification requirements for opening a
    Copperleaf Stocks and Shares ISA. Agents should use this to determine if a prospective
    client meets our mandatory criteria.


    Requirement | Condition | Outcome

    ---|---|---

    Residency | Must be a current UK resident | Eligible

    Age | Must be 18 years of age or older | Eligible

    Tax Status | Must have a valid UK National Insurance number | Eligible

    Account Limit | Must not exceed £20,000 annual ISA allowance | Eligible

    Identity | Must pass full identity and KYC verification | Eligible


    If a prospect fails any of the above conditions, they are ineligible for this
    specific product. In such cases, agents should guide the customer towards a General
    Investment Account, subject to the relevant capital gains and dividend allowances.
    For documentation requirements, refer to Copperleaf Stocks and Shares ISA — required
    documentation.'
