- id: f177ed28-d2c7-5f7b-8230-1454fd9781ea
  title: Copperleaf Stocks and Shares ISA — check status or history
  body: 'To review your investment performance, transaction history, or current account
    status, please follow these steps:


    1. Request your history: Tell us that you would like to view your transaction
    history or a current status report for your Copperleaf Stocks and Shares ISA.
    You should specify the time period you are interested in (e.g., ''the last six
    months'' or ''the 2023/24 tax year'').


    2. Complete identity verification: Because security is paramount, we will ask
    you to complete a verification check. This involves confirming your identity through
    our multi-factor authentication process. You must complete this step before we
    can disclose any account-specific data.


    3. Review the summary: We will provide a detailed summary of your current positions,
    including the total value of your holdings and any pending trades. This summary
    will reflect the current market value, keeping in mind that the value of investments
    can fall as well as rise.


    4. Request a formal statement: If you require a formal document for tax records
    or personal auditing, ask us to generate a statement. We will then produce a digital
    statement that lists every contribution, dealing fee (such as the £5.95 share
    dealing fee), and the 0.25% platform fee charged during the period.


    5. Confirmation: You will know the process is complete when you receive the confirmation
    of the statement generation and the document is delivered to your secure in-app
    messaging or email inbox.'
