- id: af53c44d-549d-5906-888b-c79876d508a2
  title: Copperleaf Junior ISA — check status or history
  body: 'To review the current value, contribution history, or performance of a Copperleaf
    Junior ISA, please follow these steps:


    1. Provide the account number or the name of the child associated with the account.
    This allows us to locate the specific record within our system.

    2. Complete our identity verification process. This will involve responding to
    a multi-factor authentication (MFA) prompt or providing the required security
    details to ensure the request is authorised by the registered adult.

    3. Specify the timeframe you wish to review. You can ask for the current real-time
    balance, a history of contributions for the current tax year (to check against
    the £9,000 limit), or a full historical statement since the account was opened.

    4. We will then provide the requested data. This can be delivered as a summary
    within your secure messaging thread or as a formal digital statement sent to your
    registered email address.


    You will know this has worked when you receive the balance confirmation or the
    digital statement, which will clearly show the total assets, any fees deducted
    (at the 0.25% rate), and the total contributions made for the year.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: how_to_guide
  source_authority: official
