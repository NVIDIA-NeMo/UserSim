- id: ca4d19a2-29c5-5a58-87ce-8bc8806babea
  title: Copperleaf Lifetime ISA — risk disclosures
  body: 'Investing in the Copperleaf Lifetime ISA involves specific risks that all
    customers must understand before committing funds. Please read the following disclosures
    carefully.


    Investment Risk

    Capital at Risk: The value of investments can fall as well as rise. This means
    you may get back less than you originally invested. The government bonus does
    not protect your principal from market volatility.


    Liquidity and Withdrawal Risk

    The Copperleaf Lifetime ISA is not a flexible savings account. It is designed
    for long-term goals. If you withdraw funds for any reason other than purchasing
    your first home (up to the property price cap of £450,000), retirement (age 60+),
    or terminal illness, you will be subject to a withdrawal charge of 25%. This charge
    is designed to recoup the 25% government bonus and a portion of your original
    investment. Consequently, unauthorised withdrawals will almost always result in
    a loss of capital.


    Institutional Protection

    Copperleaf Invest is strictly regulated by the FCA. In the event of institutional
    failure, your funds are protected by the Financial Services Compensation Scheme
    (FSCS) up to a maximum of £85,000 per person. This protection is provided by the
    UK government and is a critical safety net for your assets.


    Tax and Regulatory Changes

    All tax-efficient wrappers are subject to government legislation. While the current
    annual limit is £4,000 and the bonus is 25%, these figures are subject to change
    by the UK government. We provide educational resources to help you navigate these
    rules, but we give no individual tax advice.


    For a comprehensive list of our account terms, please see Copperleaf Lifetime
    ISA — account agreement.'
