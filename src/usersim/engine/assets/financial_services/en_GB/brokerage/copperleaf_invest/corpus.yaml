- id: 20e6970e-3b0e-5f23-8f9a-c3ea2518b214
  title: Copperleaf Junior ISA — cancel, close, or downgrade
  body: 'Closing a Copperleaf Junior ISA is a significant action, as these accounts
    are designed for long-term growth until the child reaches maturity. If you have
    decided to close the account or move the assets elsewhere, please follow these
    steps.


    Before you begin:

    Ensure you have the account details and the identity documents of the registered
    adult signatory available. Because security is paramount, we cannot process a
    closure without full verification.


    Step 1: Request the closure

    Tell us that you wish to close the Copperleaf Junior ISA. You should specify whether
    you intend to transfer the assets to another provider''s Junior ISA (to preserve
    the tax-free status) or if you are closing the account entirely.


    Step 2: Identity verification

    We will conduct a rigorous identity check. You will be asked to provide the necessary
    verification to confirm you are the authorised signatory. This is a mandatory
    step to protect the child''s assets from unauthorised-activity.


    Step 3: Settlement of assets

    We will then proceed to sell any held investments or prepare them for transfer.
    We will confirm the final balance of the account, accounting for the 0.25% platform
    fee accrued up to the date of closure.


    Step 4: Final confirmation and fund disbursement

    We will provide a final confirmation of the closure. If the account is being closed
    (rather than transferred), the funds will be disbursed according to the legal
    requirements for Junior ISAs. You will receive a notification once the action
    is complete and the funds have been sent.


    Once these steps are completed, the account will be marked as closed in our records.
    Please note that once a Junior ISA is closed and funds are removed, they cannot
    be ''paid back in'' to a new ISA without counting towards the £9,000 annual allowance.
    For more information on how we handle account security during this process, see
    Copperleaf Junior ISA — fraud and unauthorised-activity protection.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 9bf7d6db-cced-501a-a5b8-384af47311be
  title: Copperleaf Junior ISA — an unexpected charge or amount
  body: 'When a customer reports an ''unexpected charge'' or a discrepancy in the
    balance of a Copperleaf Junior ISA, the support agent should follow this diagnostic
    path to resolve the query transparently.


    Symptom:

    The customer notices a deduction from the account balance that they did not explicitly
    authorise or a total balance that is lower than their manual calculations.


    Likely Causes:

    1. Platform Fee: The most common cause is the application of the 0.25% platform
    fee, which covers infrastructure and maintenance.

    2. Market Volatility: As this is an investment product, the value of the assets
    can fall as well as rise, leading to a decrease in total value.

    3. Accrued Dealing Costs: While fund dealing is £0, other specific asset types
    may have different costs.


    Resolution Steps:

    1. Review Statement: Check the account''s transaction history. Identify if the
    deduction is labelled as a ''Platform Fee''.

    2. Explain the Fee: If the charge is the 0.25% platform fee, explain to the customer
    that this is a standard fee for the maintenance of the account to ensure long-term
    sustainability.

    3. Risk Reminder: If the balance has dropped due to market movement, remind the
    customer that capital is at risk and the value of investments can fluctuate.

    4. Calculation Check: Verify that contributions have not exceeded the £9,000 annual
    allowance, which could lead to regulatory adjustments.


    Escalation:

    If the customer remains dissatisfied or if the charge does not align with the
    0.25% fee or known market movements, the agent must escalate the matter to operations
    management for a complex dispute review. We provide a clear timeline for resolution
    in these cases to maintain our commitment to fairness. The customer should be
    informed that a specialist will review the ledger and provide a written explanation
    within the standard dispute resolution window.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 9956d8ea-dc26-5dc0-b075-b4611ee97c43
  title: Copperleaf Junior ISA — required documentation
  body: 'To open a Copperleaf Junior ISA, we require specific documentation to satisfy
    FCA regulations and our own security standards. The following matrix outlines
    the required documents and their corresponding outcomes.


    | Document Provided | Outcome |

    | :--- | :--- |

    | Child''s Birth Certificate or Adoption Certificate | Verification of child''s
    identity and relationship to signatory |

    | Signatory''s Valid Government Photo ID (Passport/Driving Licence) | Verification
    of adult signatory''s identity |

    | Signatory''s Proof of Address (Recent Utility Bill/Bank Statement) | Verification
    of signatory''s UK residency |

    | National Insurance Number (where available) | Tax record association |


    All documentation must be current and clear. Full verification is mandatory before
    the account is activated and before any contributions towards the £9,000 annual
    allowance are accepted.'
