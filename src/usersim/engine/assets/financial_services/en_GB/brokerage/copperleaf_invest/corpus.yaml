- id: cef0dbbf-1f4d-54f8-b58c-a3023fdf6998
  title: Copperleaf Stocks and Shares ISA — eligibility requirements
  body: 'To open and maintain a Copperleaf Stocks and Shares ISA, customers must meet
    the following regulatory and institutional criteria:


    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a resident of the United Kingdom | Eligible to open account
    |

    | Age | Must be 18 years of age or older | Eligible to open account |

    | Identity | Completion of full KYC and MFA verification | Account activation
    approved |

    | Contribution Limit | Total annual deposits within £20,000 | Contribution accepted
    |

    | Contribution Limit | Total annual deposits exceeding £20,000 | Contribution
    declined |


    Failure to meet the residency or age requirements will result in the application
    being declined. All customers must complete mandatory identity verification before
    any state-changing actions, such as withdrawals, can be performed.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: eligibility_matrix
