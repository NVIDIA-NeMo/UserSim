- id: e81b208e-bb02-5c59-88b1-fc6e7917d0a0
  title: Copperleaf Monthly Investing — resolve a common request end-to-end
  body: 'This guide outlines the end-to-end process for setting up a new Copperleaf
    Monthly Investing plan, from initial request to the first successful investment.


    **Prerequisites**

    - A fully verified Copperleaf Invest account.

    - A linked UK bank account with sufficient funds.


    **Step-by-Step Setup**


    1. **Specify the investment target:** Tell us which fund or stock you wish to
    invest in monthly. We will confirm that the asset is available for regular investing
    on our platform.


    2. **Set the monthly contribution:** Tell us the amount you wish to invest each
    month. This must be a minimum of £25. We will confirm that this amount meets our
    requirements.


    3. **Confirm the payment date:** Tell us your preferred date for the monthly debit
    (e.g., the 1st of each month). We will verify that this date is compatible with
    our processing cycles.


    4. **Identity and Security Verification:** Because this is a state-changing action,
    we will perform a rigorous identity check. This may involve multi-factor authentication.
    You must complete this step before the plan can be activated.


    5. **Final Confirmation:** We will provide a summary of the plan: the asset, the
    monthly amount (at least £25), the payment date, and a reminder that the regular
    dealing fee is £0. You must explicitly confirm you agree to these terms.


    6. **First Execution:** On the chosen date, we will debit the funds from your
    account and execute the trade. We will send you a confirmation message once the
    investment is complete.


    **How you know it worked**

    Your setup is successful when you receive the first trade confirmation and can
    see the initial investment reflected in your account history. You can verify future
    entries by following the steps in Copperleaf Monthly Investing — check status
    or history.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 6830466a-323e-5dd6-9519-786655459861
  title: Copperleaf Monthly Investing — a discrepancy in your records or statement
  body: '**Symptom:** A customer reports that the amount invested in their monthly
    plan does not match their bank statements, or a fee appears that they did not
    expect.


    **Likely Causes**

    - **Platform Fee Deduction:** The customer may be seeing the 0.25% platform fee,
    which is for infrastructure and maintenance, and confusing it with a dealing fee.

    - **Timing Mismatches:** The date the funds leave the bank account may differ
    slightly from the date the trade is executed in the market, leading to a perceived
    discrepancy in records.

    - **Incorrect Contribution Amount:** The customer may have requested a change
    to their monthly amount (minimum £25) that was not processed before the last debit
    date.


    **What to check and in what order**

    1. **Compare Debit vs Execution:** Compare the date of the bank debit with the
    trade execution date in the account history. Explain that while the debit is immediate,
    the market trade may occur shortly after.

    2. **Analyse Fee Entries:** Check for the 0.25% platform fee. Clarify that while
    the regular dealing fee is £0, the platform fee is an ongoing charge for maintenance.

    3. **Verify the Plan Amount:** Check the registered monthly contribution amount.
    Ensure it is £25 or more and matches the amount debited from the bank.


    **The Fix**

    - **For fee confusion:** Provide a clear breakdown of the 0.25% platform fee versus
    the £0 dealing fee to reassure the customer of our transparent pricing.

    - **For timing issues:** Provide the exact timestamps of the bank transfer and
    the trade execution to show the sequence of events.

    - **For amount errors:** If a mistake was made by us, we will apply a correction
    to the account immediately.


    **When to escalate**

    If the discrepancy cannot be explained by the platform fee or timing, we will
    escalate the matter to our compliance team. We will conduct a full audit of the
    transactions in accordance with FCA guidelines. The customer will be notified
    that an investigation is underway and will receive a resolution timeline, typically
    within 5-10 UK business days.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 7ebf61eb-4c19-5537-a839-28fd55b7d471
  title: Institution-wide fees and charges
  body: 'At Copperleaf Invest, we believe in absolute clarity regarding the costs
    of wealth creation. We maintain a competitive and transparent pricing model to
    ensure the long-term sustainability of our platform for all UK residents.


    Our primary charges apply across our brokerage services as follows:


    *   **Platform Fee:** We charge an annual platform fee of 0.25%. This fee covers
    the essential infrastructure and ongoing maintenance of our digital services.

    *   **Fund Dealing Fee:** To encourage diversified investing and accessible portfolio
    growth, we have waived the fund dealing fee, resulting in a charge of £0 for these
    transactions.


    While these core fees apply generally, certain account types may have specific
    limits or associated costs. For further information on how our cost structures
    support your investment journey, please refer to our General frequently asked
    questions.'
