- id: 4220624c-38f3-5434-bbe8-c4f5224f65f5
  title: Copperleaf General Investment Account — capital gains tax annual exempt amount
    explained
  body: 'Q: What is the capital gains tax annual exempt amount for my Copperleaf General
    Investment Account?


    A: For the current tax year, the capital gains allowance is £3,000. This means
    that you can generally make up to £3,000 in total profits from the sale of your
    investments within the account before you are required to pay capital gains tax.


    Q: Does Copperleaf Invest calculate my capital gains tax for me?


    A: We provide the necessary transaction history and reports to help you track
    your gains, but we give no individual tax advice. It is your responsibility to
    manage your tax liabilities and apply the £3,000 allowance correctly to your overall
    tax position.


    Q: Is the £3,000 allowance shared with other accounts?


    A: Yes, the £3,000 limit is an annual allowance that applies to your total chargeable
    gains across all non-ISA investments. We recommend consulting a qualified tax
    professional for personalised guidance on your specific situation.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 3994f9a6-1be4-5110-a315-f954a27940d4
  title: Copperleaf General Investment Account — cancel, close, or downgrade
  body: 'If you wish to cancel your Copperleaf General Investment Account, close it
    entirely, or downgrade your service level, please follow these steps:


    1. State your intention: Tell us whether you wish to close the account entirely
    or downgrade your holding to a different structure. If you are closing the account,
    specify if you wish to liquidate your assets for cash or transfer them to another
    provider.


    2. Complete identity verification: Because closing an account is a state-changing
    action, we will perform a rigorous identity check. This includes multi-factor
    authentication and potentially a request for updated identification to ensure
    the request is legitimate.


    3. Asset Settlement: We will calculate the final value of your holdings. If you
    have chosen to liquidate, we will execute the trades. We will then deduct any
    outstanding platform fees, including the 0.25% charge for the current period,
    from the remaining balance.


    4. Final Balance Transfer: Once all assets are settled and fees are paid, we will
    transfer the remaining funds to your verified bank account. This process follows
    our strict security protocols to ensure funds are only sent to the account holder.


    5. Receipt of Closure Confirmation: We will provide a final closing statement
    via secure in-app messaging or email. This document confirms the account is closed
    and provides a record of the final transactions for your tax records, specifically
    for any capital gains that may have been realised during the liquidation process.


    Your account will be officially closed once the final balance has been successfully
    transferred and the closure statement has been issued.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 0055c1e4-684c-509a-a697-abbd879f8cca
  title: Copperleaf General Investment Account — an unexpected charge or amount
  body: 'If a customer reports that they have seen an unexpected charge or a discrepancy
    in their Copperleaf General Investment Account balance, follow this diagnostic
    path:


    Symptom: The customer states, "I have been charged a fee I didn''t expect," or
    "My account balance is lower than my calculations suggest."


    Likely Causes:

    - Platform Fee Deduction: The most common cause is the 0.25% platform fee, which
    covers infrastructure and maintenance. This is an ongoing cost and may be deducted
    periodically.

    - Tax Withholdings: Dividends received in the account are subject to the £500
    dividend allowance; charges may appear related to tax processing.

    - Market Volatility: The customer may be attributing a drop in asset value to
    a fee rather than market movement.


    Steps to Resolve:

    1. Review the Transaction History: Check the account''s recent activity. Look
    specifically for a line item detailing the 0.25% platform fee. Explain to the
    customer that this fee is transparent and essential for the sustainability of
    the platform.

    2. Verify Asset Values: Compare the current market value of the holdings against
    the last statement. Remind the customer that the value of investments can fall
    as well as rise and capital is at risk.

    3. Explain the Allowance: If the discrepancy relates to dividend income, clarify
    the £500 dividend allowance and how it applies to their holdings.


    Escalation Path:

    If the customer still disputes the charge after the platform fee and market movements
    have been explained, the matter must be escalated to operations management. We
    handle all disputes with a commitment to fairness and transparency, providing
    the customer with a clear timeline for the final resolution.'
