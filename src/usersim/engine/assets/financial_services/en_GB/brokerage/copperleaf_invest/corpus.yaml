- id: d2283383-e3df-54f6-8cee-b4e2527d9b72
  title: General frequently asked questions
  body: '### How do I contact Copperleaf Invest support?

    We operate a digital-first support model. You can reach our customer service team
    via secure in-app messaging or email. We are available during UK business hours
    (GMT) to assist you with your account queries.


    ### What happens if I have a complex dispute?

    We approach all disputes with a commitment to fairness and transparency. Queries
    are initially handled by our customer service agents; however, for complex disputes,
    we have a defined escalation path to our operations management team to ensure
    a clear and timely resolution.


    ### Does Copperleaf Invest provide investment advice?

    No. We provide a wide array of educational resources and a platform for self-directed
    investing, but we give no personal recommendations and no individual tax advice.
    For details on our compliance standards, please see Regulatory notes for Investing.'
