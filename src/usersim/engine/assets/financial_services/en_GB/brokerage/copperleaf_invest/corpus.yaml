- id: a5a70563-f6d9-5b13-a28e-cb1eeffd0beb
  title: update_contact_info tool reference
  body: 'The update_contact_info tool allows an agent to modify the personal details
    associated with a customer''s account. The agent performs this action by calling
    the tool directly after a full identity verification has been completed.


    **Signature**

    `update_contact_info(account_id: string, field: string, value: string)`


    **Arguments**

    - `account_id`: The internal system identifier for the account being updated.

    - `field`: The specific contact field to be updated (e.g., ''email'', ''phone'',
    ''address'').

    - `value`: The new contact information as provided by the customer.


    **Effect**

    Calling this tool updates the customer''s record in the central database. This
    change will be reflected across all linked accounts and will be used for all future
    secure in-app messaging and email correspondence during UK business hours.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
