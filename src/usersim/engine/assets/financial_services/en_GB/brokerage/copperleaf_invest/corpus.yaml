- id: 6c3c741d-1ddf-56c9-b161-a2429a145700
  title: Copperleaf Stocks and Shares ISA — access or login problems
  body: 'If you are experiencing difficulties accessing your Copperleaf Stocks and
    Shares ISA account, please follow these diagnostic steps to resolve the issue.


    Symptom: ''Invalid Credentials'' or ''Login Failed'' message

    Likely Cause: Incorrect password or username entry.

    What to check: Ensure your Caps Lock is off and that there are no trailing spaces
    in your username.

    Fix: Request a password reset via our secure system. We will send a verification
    link to your registered email address. Once you have updated your password, you
    can log in as normal.


    Symptom: Multi-factor Authentication (MFA) code not received

    Likely Cause: Network delay or outdated contact information.

    What to check: Check your signal strength or ensure your email filters are not
    diverting our messages to a spam folder.

    Fix: Request a new code. If you have changed your phone number or email and cannot
    receive the code, you must undergo our full identity verification process again
    to update your security details.


    Symptom: Account ''Locked'' for security reasons

    Likely Cause: Too many failed login attempts or suspicious activity detected.

    What to check: Verify if you have recently attempted to log in from a new device
    or location.

    Fix: To unlock your account, we require a rigorous identity check. Provide us
    with the necessary verification documents and complete a secure identity confirmation.
    We will then restore access to your account.


    Escalation: If these steps do not resolve the problem, we will raise a technical
    case with our operations management team. You will receive a reference number
    and a resolution timeline via email. For further security guidance, see Copperleaf
    Stocks and Shares ISA — fraud and unauthorised-activity protection.'
