- id: e3b14acd-3e5a-595e-866f-2307c523f81b
  title: Copperleaf Monthly Investing — make a change or update
  body: 'If you wish to adjust the details of your recurring investment, follow these
    steps to ensure your account remains compliant and your investment strategy stays
    on track.


    Requirements before starting:

    You must have a verified account and access to secure in-app messaging or email.


    Step 1: Request the Change

    Tell us the specific detail you wish to update. This could be the monthly investment
    amount, the funds you are investing in, or the date the payment is taken from
    your bank account.


    Step 2: Validate the New Amount

    If you are increasing or decreasing your monthly contribution, provide us with
    the new total. Please ensure the new amount is at least £25, as this is the mandatory
    minimum for the Copperleaf Monthly Investing product. If the amount provided is
    below £25, we will notify you that the request cannot be processed.


    Step 3: Identity Verification

    Because altering account details is a state-changing action, we will perform a
    rigorous identity check. This may involve multi-factor authentication (MFA) to
    ensure the request is legitimate.


    Step 4: Confirmation of Terms

    We will confirm that your regular dealing fee remains at £0 for these updated
    investments and remind you that the 0.25% platform fee continues to apply to your
    total balance.


    Step 5: Final Confirmation

    We will send a confirmation message via your secure channel detailing the new
    amount, the updated fund allocation, and the date the first updated payment will
    occur. You will know the change has worked when you receive this confirmation
    and see the updated amount reflected in your next monthly statement.


    For issues regarding account access during this process, see Copperleaf Monthly
    Investing — access or login problems.'
