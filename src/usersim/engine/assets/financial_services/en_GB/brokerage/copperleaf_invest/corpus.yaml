- id: e23a169d-c62a-5393-bef0-61ae08646cca
  title: Copperleaf Monthly Investing — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in the end-to-end
    setup of Copperleaf Monthly Investing. Our goal is to ensure the customer understands
    the cost-effective nature of this vehicle and the requirements for activation.


    Step 1: Identity Verification

    Ensure the customer has completed the mandatory identity checks. Full verification
    is required before any state-changing action can be performed. Confirm that the
    customer is a UK resident, as this product is designed for the UK market.


    Step 2: Determining the Investment Amount

    Explain that Copperleaf Monthly Investing is designed for regular savers. Confirm
    with the customer that they wish to commit to a monthly investment of at least
    £25. If the customer suggests an amount lower than £25, politely inform them that
    this is the minimum required to maintain the account.


    Step 3: Explaining the Cost Structure

    Clearly state the following costs to the customer to maintain our transparency
    standards:

    - Regular Dealing Fee: Confirm that this is £0, meaning there is no charge for
    the monthly execution of the trade to encourage diversified investing.

    - Platform Fee: Explain that a 0.25% platform fee applies to cover infrastructure
    and maintenance.


    Step 4: Fund Selection

    Assist the customer in selecting the funds or assets they wish to invest in. Remind
    the customer that we provide educational resources but give no personal recommendations
    or individual tax advice.


    Step 5: Confirmation and Risk Warning

    Before finalising the setup, the agent must ensure the customer understands that
    capital is at risk and that the value of investments can fall as well as rise.
    Mention the FSCS protection of up to £85,000 per person if the brokerage fails.


    Once these steps are complete, the customer''s regular investment will be scheduled.
    For further assistance on updating these details later, see Copperleaf Monthly
    Investing — make a change or update.'
