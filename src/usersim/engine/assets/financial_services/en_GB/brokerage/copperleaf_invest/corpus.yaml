  title: Copperleaf General Investment Account — current offer
  body: 'We are pleased to offer a limited-time incentive for our existing clients
    to expand their portfolios. From 1st November 2024 to 31st January 2025, new assets
    transferred into a Copperleaf General Investment Account will be exempt from the
