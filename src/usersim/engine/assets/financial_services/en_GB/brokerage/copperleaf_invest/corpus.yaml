- id: 55b56d08-bc5f-5b43-b746-f08c435c73a1
  title: Copperleaf Lifetime ISA — an unexpected charge or amount
  body: 'When a customer reports an unexpected charge or a discrepancy in their Copperleaf
    Lifetime ISA balance, support agents should follow this diagnostic path to identify
    the cause.


    Symptom: The customer believes a charge has been applied incorrectly or the final
    withdrawal amount is lower than expected.


    Step 1: Verify the Withdrawal Type

    Check if the customer recently performed a withdrawal. If the withdrawal was not
    for a first home purchase (under the £450,000 cap) or retirement, a withdrawal
    charge of 25% is automatically applied. This is the most common cause of ''missing''
    funds, as it removes the government bonus and a portion of the principal.


    Step 2: Review Platform Fees

    Check the account for the 0.25% platform fee. This fee is deducted to cover infrastructure
    and maintenance. Ensure the customer understands this is a standard cost of the
    platform and not a one-time penalty.


    Step 3: Audit the Government Bonus

    If the customer is questioning why their balance hasn''t increased by 25% after
    a contribution, verify the date of the payment. Remind the customer that government
    bonuses are not instant and are credited according to the government''s external
    reporting cycle.


    Step 4: Check Contribution Limits

    Verify if the customer attempted to contribute more than the annual limit of £4,000.
    Any excess funds would have been rejected or returned, which may appear as a ''missing''
    amount if they believe the full payment was accepted.


    Escalation Path

    If the charge does not align with the 25% withdrawal charge or the 0.25% platform
    fee, or if there is a dispute regarding the property price cap of £450,000, escalate
    the case to operations management. The agent should provide the transaction ID
    and the customer''s stated reason for withdrawal. The customer will be notified
    once the management review is complete, usually within our defined resolution
    timeline.'
