- id: 20ed4253-e9be-5eb7-aecb-b3ba7aaa3751
  title: Copperleaf Junior ISA — who it is best for and common use cases
  body: 'The Copperleaf Junior ISA is designed for parents, grandparents, and legal
    guardians who wish to establish a tax-efficient foundation for a child''s financial
    future. It is an ideal vehicle for those seeking a long-term growth strategy where
    the benefits of compounding can work over many years without the burden of capital
    gains or dividend taxes.


    Common Use Cases:


    • The Long-Term Education Fund: For those who want to build a substantial pot
    to support a child''s higher education or vocational training. By utilising the
    £9,000 annual allowance, a guardian can consistently build wealth that remains
    protected from tax until the child reaches adulthood.


    • The ''Head Start'' Nest Egg: For families who wish to provide a financial cushion
    for their child''s first home deposit or a seed fund for their first business
    venture upon reaching adulthood.


    • Intergenerational Gifting: For grandparents who prefer to gift money directly
    into a tax-sheltered environment rather than through a general savings account,
    ensuring the gift is preserved for the child''s benefit.


    Why Choose Copperleaf Invest?

    We compete on clarity and accessibility. Unlike complex brokerage models, we offer
    a straightforward 0.25% platform fee to cover infrastructure and maintenance.
    To further encourage a diversified and healthy investment strategy for the child,
    we waive certain costs, such as the fund dealing fee (set at £0).


    Key Parameters:

    • Annual Contribution Limit: £9,000

    • Platform Fee: 0.25%

    • Access Age: Control passes to the child at age 18


    This product is best suited for individuals who are comfortable with a self-directed
    investing approach and understand that the value of investments can fluctuate.
    For those who have already maximised their own ISA options and wish to extend
    tax-efficient investing to the next generation, the Copperleaf Junior ISA provides
    a clear and professional path. For a detailed breakdown of our charges, please
    see Copperleaf Junior ISA — fee schedule.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 6a4a04eb-c96f-574e-9e32-da16135cad3f
  title: Copperleaf Junior ISA — annual platform fee explained
  body: 'What is the annual platform fee for the Copperleaf Junior ISA?

    We charge a platform fee of 0.25% on the value of the assets held within the account.
    This fee is applied to ensure the long-term sustainability and maintenance of
    our digital-first infrastructure.


    How is this fee applied to my child''s account?

    The 0.25% fee is calculated based on the account''s value and is deducted periodically.
    Because we believe in transparency, this cost is clearly outlined in our fee structures
    so there are no hidden charges.


    Are there any other dealing fees I should be aware of?

    To encourage diversified investing for the benefit of the child, we waive certain
    costs; for instance, the fund dealing fee is £0. This allows you to adjust the
    investment strategy without incurring immediate costs for every fund trade.


    Where can I find more details on overall costs?

    You can find a complete breakdown of all applicable charges in Copperleaf Junior
    ISA — fee schedule.'
