- id: 19a29b63-4046-5b4d-86f8-29b3a4450d83
  title: Copperleaf General Investment Account — limits, restrictions, and edge cases
  body: 'This document outlines the operational boundaries and regulatory limits associated
    with the Copperleaf General Investment Account to assist agents in providing accurate
    guidance.


    Cost Structure and Fees

    The account is subject to a platform fee of 0.25%, which covers the ongoing maintenance
    and infrastructure of the platform. To support a diversified approach to investing,
    we waive fund dealing fees (charged at £0) for these accounts.


    Tax Thresholds and Allowances\Unlike ISA wrappers, the Copperleaf General Investment
    Account is subject to UK tax laws. Support agents must be clear that we provide
    the platform but do not offer individual tax advice. The current relevant thresholds
    are:

    - Capital Gains Allowance: A limit of £3,000 applies. Gains realised above this
    amount may be subject to Capital Gains Tax.

    - Dividend Allowance: A limit of £500 applies. Dividends received above this amount
    may be subject to Income Tax.


    Regulatory Protections and Risk\All customers must be reminded that capital is
    at risk and the value of investments can fall as well as rise. In the event of
    brokerage failure, the account is protected by the Financial Services Compensation
    Scheme (FSCS) for up to £85,000 per person.


    Operational Restrictions\Full identity verification is mandatory before any state-changing
    action is performed. This includes processing withdrawals or altering account
    details. Any attempt to perform these actions without completed verification will
    be blocked by our security systems.


    For more details on how this compares to our tax-free options, refer to Copperleaf
    General Investment Account — comparison vs. alternatives and when not to choose
    it.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: product_sheet
  source_authority: official
