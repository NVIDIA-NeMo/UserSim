- id: 460d4642-a324-5a6e-a6e2-ee7835f090d0
  title: Copperleaf Stocks and Shares ISA — recognising scams targeting this product
  body: 'As you compare investment options, it is vital to remain vigilant against
    fraudulent activity. Scammers often target individuals seeking tax-efficient growth,
    such as those interested in the Copperleaf Stocks and Shares ISA, by promising
    ''guaranteed'' high returns or ''risk-free'' wealth creation.


    At Copperleaf Invest, we are committed to transparency. We will never guarantee
    a specific return on your investments, as we clearly communicate that the value
    of investments can fall as well as rise and capital is at risk. Any communication
    promising a guaranteed profit or claiming that an investment is ''risk-free''
    is a significant red flag and likely a scam.


    Common tactics to watch for include:

    - Impersonation: Fraudsters may pretend to be Copperleaf Invest employees, using
    urgent language to pressure you into moving funds or revealing security details.

    - Requests for Credentials: We employ multi-factor authentication and rigorous
    identity checks to protect your assets. We will never ask you to provide your
    password or MFA codes via email or text message.

    - Unsolicited ''Insider'' Tips: Be wary of individuals offering exclusive access
    to trades or high-yield opportunities that seem too good to be true.


    Security is paramount to our operations. We will never ask you to transfer your
    ISA funds to a third-party account to ''verify'' your identity or ''unlock'' a
    bonus. If you are approached by someone claiming to be from our firm who requests
    this, or who pressures you to bypass our standard security protocols, do not engage.


    If you notice any suspicious activity or receive a communication that feels out
    of character for our professional and transparent tone, notify us immediately.
    Prompt reporting is essential for our compliance team to take action in accordance
    with FCA guidelines and to protect your capital. For more information on our general
    protections, you may refer to Copperleaf Stocks and Shares ISA — fraud and unauthorised-activity
    protection.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 57fc0970-2427-5d92-8002-1fe97ae96057
  title: Copperleaf Stocks and Shares ISA — limits, restrictions, and edge cases
  body: "This document provides guidance for support agents regarding the regulatory\
    \ and operational limits of the Copperleaf Stocks and Shares ISA. \n\nAnnual Allowance\n\
    The primary restriction is the annual ISA allowance. For the current tax year,\
    \ users can contribute up to £20,000. Any attempt to deposit funds exceeding this\
    \ limit must be flagged, as we adhere strictly to FCA regulations regarding tax-efficient\
    \ wrappers.\n\nResidency and Eligibility\nThis product is available exclusively\
    \ to UK residents. If a customer's residency status changes, they may no longer\
    \ be eligible to make further contributions, though existing assets may remain\
    \ within the wrapper subject to specific tax rules.\n\nTransfer Restrictions\n\
    When assisting customers with an ISA Transfer, it is critical to ensure the process\
    \ is handled as a formal transfer between providers. To preserve the tax-free\
    \ status of the £20,000 annual allowance, funds must never be withdrawn by the\
    \ customer and then paid back into a Copperleaf account. Such an action would\
    \ be treated as a new contribution, potentially breaching the annual limit.\n\n\
    Account Verification\nNo state-changing actions, including the processing of withdrawals\
    \ or the alteration of sensitive account details, can be performed until full\
    \ verification is completed. This involves our mandatory multi-factor authentication\
    \ and identity check protocols.\n\nFee Application\nEnsure customers understand\
    \ the cost structure: a 0.25% platform fee for infrastructure and maintenance,\
    \ a £5.95 share dealing fee for stock trades, and a £0 fund dealing fee to encourage\
    \ diversification. These must be applied consistently without exception.\n\nFor\
    \ further details on how to guide a customer through the initial setup, please\
    \ see Copperleaf Stocks and Shares ISA — set up and activate."
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
