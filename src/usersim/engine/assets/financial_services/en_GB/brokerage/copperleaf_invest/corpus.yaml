  body: "Setting up your automated investment plan is a straightforward process designed\
    \ to get your capital working for you as quickly as possible. Please follow these\
    \ steps to activate your plan:\n\n1. Specify your monthly commitment: Tell us\
    \ the exact amount you wish to invest each month. This must be a minimum monthly\
    \ amount of £25. \n\n2. Select your investment destination: Identify which assets\
    \ or funds you wish to purchase with your monthly contribution. If you are unsure,\
    \ we provide educational resources to help you understand the products available,\
    \ though we do not provide personal recommendations.\n\n3. Choose your payment\
    \ date: Let us know which day of the month you would like the funds to be deducted\
    \ from your linked bank account. We recommend aligning this with your salary payment\
    \ date for ease of budgeting.\n\n4. Confirm and verify: We will present a summary\
    \ of your plan, including the £0 regular dealing fee and the 0.25% platform fee.\
    \ Once you confirm these details, we will perform any necessary identity checks\
    \ to ensure the security of your account.\n\n5. Final activation: We will send\
    \ you a confirmation message once the plan is active. Your first investment will\
    \ occur on the next scheduled payment date you selected.\n\nOnce active, you can\
    \ track your contributions through your account history. If you are considering\
