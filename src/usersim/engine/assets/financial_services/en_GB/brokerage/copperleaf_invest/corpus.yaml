- id: 76f6f598-34b8-528e-bcf9-f67d0ad5e99d
  title: Copperleaf Stocks and Shares ISA — referral and loyalty offer
  body: 'We are pleased to introduce our current loyalty and referral initiative for
    the Copperleaf Stocks and Shares ISA. From 1 January 2025 to 31 March 2025, we
