- id: 565503ad-7d1c-5e06-8efd-8be32c2cc808
  title: Copperleaf General Investment Account — choosing between tiers or options
  body: 'Choosing the right account depends on your current tax status and your long-term
    goals. The primary decision for most clients is between the Copperleaf General
    Investment Account and a tax-efficient wrapper like the Copperleaf Stocks and
    Shares ISA.


    **Copperleaf General Investment Account**

    - **Tax Treatment**: Subject to UK tax. You can utilise the £3,000 capital gains
    allowance and the £500 dividend allowance.

    - **Limits**: No limit on how much you can deposit annually.

    - **Cost**: A transparent platform fee of 0.25%.

    - **Best For**: Investors who have already used their annual £20,000 ISA allowance
    or those who require absolute flexibility in withdrawing funds without restriction.


    **Copperleaf Stocks and Shares ISA**

    - **Tax Treatment**: Fully tax-efficient; no capital gains or dividend tax on
    investments held within the wrapper.

    - **Limits**: Subject to a strict annual allowance (e.g., £20,000).

    - **Cost**: Similar competitive fee structure.

    - **Best For**: Those seeking the most tax-efficient path to long-term growth
    within government limits.


    While the ISA offers superior tax advantages, the General Investment Account is
    the essential choice for those whose wealth creation exceeds the ISA thresholds.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: cc2818ba-dc7a-5833-b2f8-5b0372c21e55
  title: Copperleaf General Investment Account — privacy and data handling
  body: 'Copperleaf Invest is committed to the highest standards of data privacy and
    regulatory compliance. This disclosure explains how we handle your personal and
    financial information in relation to your Copperleaf General Investment Account.


    **Regulatory Framework**

    We are strictly regulated by the FCA and adhere to all fair treatment and data
    privacy standards, including the UK General Data Protection Regulation (UK GDPR).
    Our data handling processes are designed to ensure that your sensitive financial
    information is processed lawfully, fairly, and transparently.


    **Data Collection and Use**

    We collect and process data necessary to manage your investments, including identity
    verification and tax reporting. Because the Copperleaf General Investment Account
    is not a tax-free wrapper, we may be required to share information regarding your
    dividends and capital gains with HMRC to ensure compliance with the £500 dividend
    allowance and £3,000 capital gains allowance regulations.


    **Security Measures**

    To prevent unauthorised access, we employ multi-factor authentication and rigorous
    identity checks. No state-changing action—such as processing a withdrawal or altering
    account details—is performed without full verification of the requester. This
    protects your assets from fraudulent activity and ensures that your data is only
    accessible to authorised users.


    **Client Rights**

    Under data protection laws, you have the right to request access to the data we
    hold about you, to request the correction of inaccurate data, and to object to
    certain types of processing. Any such requests should be submitted via our secure
    in-app messaging system during UK business hours (GMT).


    **Financial Protection**

    While we maintain rigorous data and asset security, please be aware that the value
    of investments can fall as well as rise and capital is at risk. Separate from
    data security, your funds are protected by the Financial Services Compensation
    Scheme (FSCS) up to £85,000 per person should the brokerage fail.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 22b78066-302e-5037-aec7-0d841f9dee6d
  title: Copperleaf General Investment Account — recognising scams targeting this
    product
  body: 'As you consider the Copperleaf General Investment Account, it is important
    to remain vigilant against fraudulent activity. Because this account is subject
    to tax on gains and dividends, scammers often pose as tax authorities or financial
    advisors, claiming you have an ''urgent tax liability'' related to your capital
    gains or dividend allowances.


    Common fraud patterns include:

    - Unsolicited communications claiming that your £3,000 capital gains allowance
    has been exceeded and demanding immediate payment to avoid legal action.

    - ''Guaranteed return'' offers that promise high yields regardless of market conditions,
    often urging you to transfer funds from your General Investment Account to an
    external, unverified source.

    - Phishing attempts that mimic our secure messaging style, asking you to ''verify''
    your identity by providing your multi-factor authentication codes or account passwords.


    We will never ask you for your password, your multi-factor authentication codes,
    or for you to transfer funds to a third party to ''secure'' your tax position.
    We will also never pressure you into making an immediate investment decision via
    an urgent phone call or email.


    If you receive any communication that feels suspicious or pressures you to act
    quickly, do not provide any personal details or move any funds. Your first action
    should be to notify us immediately via our secure in-app messaging or email. We
    will then escalate the matter to our compliance team to be handled in accordance
    with FCA guidelines.


    Remember that while we provide the platform for your investments, the value of
    investments can fall as well as rise and capital is at risk. Any offer promising
    a ''guaranteed'' profit is a hallmark of a scam.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
