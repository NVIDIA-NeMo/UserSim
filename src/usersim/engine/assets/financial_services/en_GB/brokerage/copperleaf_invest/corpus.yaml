- id: e93dcc3c-4383-5bab-b8c2-823a05eeb722
  title: Copperleaf Monthly Investing — overview
  body: 'Copperleaf Monthly Investing is designed as an accessible entry point for
    those who wish to build wealth through regular, disciplined contributions. By
    automating your investment strategy, we help you remove the emotional burden of
    timing the market, allowing you to benefit from a diversified approach to wealth
    creation.


    Our service is built on the principle of clarity and transparency. To ensure the
    long-term sustainability of our platform, we apply a 0.25% platform fee, which
    covers the essential infrastructure and maintenance of your account. To encourage
    the habit of diversified investing, we have completely removed the cost of regular
    transactions; the regular dealing fee for this service is £0.


    To make investing inclusive, we have set a low barrier to entry. The minimum monthly
    amount required to start and maintain your plan is £25. This allows UK residents
    to begin their investment journey without needing a significant initial lump sum.


    As with all investing, it is important to remember that the value of investments
    can fall as well as rise, and capital is at risk. This means you may get back
    less than you originally invested. However, for your peace of mind, Copperleaf
    Invest is strictly regulated by the FCA. In the event of a brokerage failure,
    your assets are protected by the Financial Services Compensation Scheme (FSCS)
    for up to £85,000 per person.


    Copperleaf Monthly Investing can be utilised across our various tax-efficient
    wrappers, depending on your personal goals. For a deeper understanding of how
    this complements our other offerings, you may wish to review the Copperleaf Stocks
    and Shares ISA — overview.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: product_sheet
