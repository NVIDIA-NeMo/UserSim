- id: 5231d5e8-8598-5c3f-89d0-a9e9b59f0d26
  title: Copperleaf Monthly Investing — change-of-terms policy
  body: "This document outlines the policy regarding modifications to the terms and\
    \ conditions governing Copperleaf Monthly Investing. As a transparent brokerage,\
    \ we are committed to ensuring that any changes to our cost structures or account\
    \ requirements are communicated clearly and in advance.\n\nWe reserve the right\
    \ to amend the terms of this service, including but not limited to the minimum\
    \ monthly amount of £25 and the £0 regular dealing fee. Any such changes will\
    \ be made to ensure the long-term sustainability of our platform while remaining\
    \ competitive in the UK market.\n\nIn the event of a material change to our fees—such\
    \ as an adjustment to the 0.25% platform fee—we will provide you with a minimum\
    \ of 30 days' notice via your registered email and secure in-app messaging. This\
    \ notice period allows you to review the updated terms and decide if the product\
    \ still meets your financial objectives.\n\nIf you do not agree to the updated\
    \ terms by the end of the notice period, you may choose to cancel your monthly\
    \ investment plan. Please be aware that cancelling a plan does not close your\
    \ overall account with us, but it will cease the automated investment of your\
    \ monthly funds. \n\nAll changes to terms will continue to adhere to FCA fair\
    \ treatment standards. We will not retroactively apply fee increases to investments\
    \ already executed under previous terms. Our commitment to transparency means\
    \ that the exact value of any new charge will be explicitly stated in the notification\
    \ you receive. For further details on our general account obligations, please\
    \ refer to Copperleaf Monthly Investing — overview."
