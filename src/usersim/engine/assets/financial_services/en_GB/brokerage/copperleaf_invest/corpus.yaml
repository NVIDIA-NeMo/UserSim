- id: 171346a8-6a53-5f28-aeed-f6811075c701
  title: Copperleaf Lifetime ISA — interest rate / AER schedule
  body: 'The Copperleaf Lifetime ISA is an investment-based product; therefore, it
    does not offer a fixed interest rate or a guaranteed AER on the balance. Instead,
    your returns are driven by the performance of the assets you choose and the government''s
    contribution.


    **Government Bonus Rate**

    - All eligible contributions are rewarded with a government bonus of 25%. This
    is applied to your account based on the amount you save, up to the annual limit
    of £4,000.


    **Platform Impact**

    - The net growth of your account is affected by our 0.25% platform fee, which
    covers the maintenance of our digital infrastructure.


    **Variable Returns**

    Because this account allows for self-directed investing, the rate of growth will
    fluctuate based on market conditions. As capital is at risk, the value of your
    investments may decrease, which can impact the overall yield of the account.


    For information on the costs associated with maintaining this account, see Copperleaf
    Lifetime ISA — fee schedule.'
