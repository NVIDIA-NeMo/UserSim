- id: b156e9d5-030d-5ff9-ba82-064770962f6a
  title: Copperleaf Monthly Investing — cancel, close, or downgrade
  body: 'If your financial circumstances change, you may wish to adjust, pause, or
    entirely stop your automated contributions. Follow these steps to manage your
    Copperleaf Monthly Investing facility.


    **What you need before starting**

    To protect your account, you must have access to your multi-factor authentication
    (MFA) device to verify your identity.


    **Steps to cancel or downgrade your monthly investment**


    1. **Request the Change**: Inform us that you wish to either close your monthly
    investing facility, cancel a specific regular instruction, or downgrade the monthly
    amount (ensuring it remains at or above the minimum of £25).

    2. **Identity Verification**: We will prompt you to complete a security check.
    You must provide the required verification via your MFA-enabled device to ensure
    this state-changing action is authorised by the account holder.

    3. **Specify the Action**: Clearly state whether you are stopping the service
    entirely or adjusting the amount. If you are downgrading, confirm the new monthly
    amount (e.g., from £100 down to £25).

    4. **Confirmation of Terms**: We will confirm the date upon which the change will
    take effect. Please note that if a payment instruction has already been sent to
    your bank, the current month''s contribution may still be processed.

    5. **Final Acknowledgement**: You will receive a confirmation message via our
    secure in-app messaging or email confirming that the facility has been closed
    or the amount has been adjusted.


    Once these steps are complete, you will no longer see the scheduled deduction
    for the cancelled amount in your upcoming account activity. If you wish to close
    the underlying investment account entirely, please refer to the general account
    closure process.'
  domain: brokerage_investing
