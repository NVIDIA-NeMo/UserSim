- id: 7f86b7f5-7b23-5296-9855-62bbb2d8e750
  title: Copperleaf General Investment Account — interest rate / AER schedule
  body: 'The Copperleaf General Investment Account is a brokerage vehicle for self-directed
    investing rather than a cash savings account. Consequently, there is no fixed
    annual interest rate or AER applied to the balance of the account.


    Returns on this account are generated through the performance of the underlying
    assets you choose to purchase, such as stocks and funds. These returns may take
    the form of capital appreciation (increase in asset value) or dividend payments,
    the latter of which are subject to the £500 dividend allowance.


    While we do not offer a flat interest rate, we ensure that the cost of maintaining
    your account remains low and transparent with a platform fee of 0.25%. For a full
    list of charges, please see the Copperleaf General Investment Account — fee schedule.'
