- id: bfc48515-3c3d-5755-ade5-14ba9afb0825
  title: Copperleaf General Investment Account — a discrepancy in your records or
    statement
  body: 'When a customer reports a discrepancy in their Copperleaf General Investment
    Account records or monthly statements, agents should follow this investigation
    path:


    Symptom

    The customer believes a trade was executed at the wrong price, a dividend was
    not credited, or the 0.25% platform fee has been applied incorrectly.


    Investigation Steps

    1. Verify the Transaction Timeline: Check the date of the trade versus the statement
    period. Ensure the customer is not confusing a ''pending'' trade with a ''settled''
    one.

    2. Audit Fee Application: Confirm that the platform fee of 0.25% was calculated
    based on the correct average portfolio value and that no fund dealing fees were
    charged (as these are £0).

    3. Cross-Reference Dividends: For dividend discrepancies, check the ex-dividend
    date of the asset to ensure the customer was the legal owner of the shares at
    the required time.

    4. Review Capital Gains: If the customer is questioning their gains, verify the
    cost basis of the asset sold to ensure the calculated gain aligns with the £3,000
    allowance tracking.


    Resolution and Escalation

    - If a clerical error is found, we will correct the record immediately and notify
    the customer via secure messaging.

    - If the discrepancy is due to a misunderstanding of market mechanics (e.g., settlement
    times), explain this clearly and professionally to the customer.

    - If the issue is complex or involves a significant sum, escalate the case immediately
    to operations management. We will provide the customer with a clear timeline for
    the investigation and resolution, ensuring our commitment to fairness and transparency.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
