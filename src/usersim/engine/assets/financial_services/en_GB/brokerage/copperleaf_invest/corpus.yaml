- id: f39fd733-b15d-541a-a75a-fe7887f764e7
  title: Copperleaf Monthly Investing — comparison vs. alternatives and when not to
    choose it
  body: 'Copperleaf Monthly Investing is designed as an accessible entry point for
    regular savers. To make an informed decision, it is helpful to compare this approach
    against other investment strategies.


    **Copperleaf Monthly Investing vs. Lump Sum Investing**

    - **Cost Structure:** Monthly investing is highly cost-effective for those starting
    small, with a minimum commitment of just £25 and a regular dealing fee of £0.
    Lump sum investing may involve different fee structures depending on the asset.

    - **Market Risk:** By investing a fixed amount every month, you benefit from ''pound-cost
    averaging,'' which reduces the risk of investing a large sum at a market peak.
    Lump sum investing carries the risk of poor timing.

    - **Discipline:** This product automates wealth creation, removing the emotional
    burden of deciding when to buy.


    **When NOT to choose Copperleaf Monthly Investing**

    - **Immediate Large Capital:** If you have a significant sum of money ready to
    be invested immediately, a monthly plan may be too slow to deploy your capital.
    In such cases, a General Investment Account or Stocks and Shares ISA for a lump
    sum may be more appropriate.

    - **Need for High Liquidity:** This product is intended for long-term growth.
    If you believe you will need the money within a few months, the volatility of
    the market means you could get back less than you invested. Remember, capital
    is at risk.

    - **Active Trading:** If your strategy involves frequent buying and selling based
    on short-term market movements, a regular investment plan is not the right tool.
    This is a vehicle for steady accumulation, not active trading.


    **Summary of Terms**

    - **Minimum Monthly Amount:** £25

    - **Regular Dealing Fee:** £0

    - **Platform Fee:** 0.25%

    - **Protection:** FSCS protection up to £85,000 per person.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 7e64399f-7cd4-5170-b4de-479e9d2ad1ac
  title: Copperleaf Monthly Investing — how-to / step-by-step
  body: '### How do I change the amount I invest each month?

    Changing your contribution is a simple process. First, tell us the new monthly
    amount you wish to invest—ensuring it is at least £25. We will then verify your
    identity through our standard security checks. Once confirmed, we will update
    your plan, and the new amount will be debited from your next scheduled payment
    date.


    ### Can I temporarily pause my monthly investments?

    Yes, you can ask us to pause your regular contributions. We will suspend the automated
    debits from your bank account. Your existing assets will remain invested and will
    continue to be subject to the 0.25% platform fee. When you are ready to resume,
    simply tell us to restart the plan.


    ### How do I stop my monthly investing plan entirely?

    If you wish to cancel, tell us you would like to close your monthly investing
    plan. We will stop all future debits and provide you with a final summary of the
    assets accumulated. For further details on closing accounts, see Copperleaf Monthly
    Investing — cancel, close, or downgrade.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: faq
  source_authority: official
