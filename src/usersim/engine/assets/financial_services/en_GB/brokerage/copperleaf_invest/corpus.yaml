- id: 9163b81b-6d9b-5ebd-9166-72f4be80372c
  title: Copperleaf Lifetime ISA — a failed or pending action
  body: 'If you have requested a deposit, withdrawal, or account change that appears
    as ''pending'' or has ''failed'', please review the following guidance to identify
    the cause.


    **Common Symptoms**

    - A deposit of funds has not appeared in your account balance.

    - A withdrawal request is marked as ''pending'' for longer than three business
    days.

    - An attempt to open an account was declined during the setup phase.


    **Likely Causes and Checks**

    1. **Verification Status**: Check if your identity verification is complete. We
    require full verification before any state-changing action, such as processing
    withdrawals, is performed. If your documents have expired or were rejected, the
    action will fail.

    2. **Contribution Limits**: For failed deposits, check if you have already reached
    the annual limit of £4,000. Contributions exceeding this amount are automatically
    rejected.

    3. **Bank Detail Mismatch**: Ensure the bank account used for the transaction
    is in your name and matches the details we have on file.

    4. **Withdrawal Eligibility**: If a withdrawal is pending, we may be verifying
    the eligibility of the home purchase (e.g., confirming the property price is within
    the £450,000 cap).


    **The Fix**

    - If verification is the issue, provide us with a clear, valid copy of your current
    identity documents.

    - If a limit was exceeded, please adjust your contribution amount to remain within
    the £4,000 threshold.

    - If bank details are incorrect, tell us the updated account information and we
    will re-process the request.


    **Escalation**

    If the issue persists after these checks, we will escalate the matter to our operations
    management team for a complex dispute review. You will receive a confirmation
    of the escalation and a clear timeline for the resolution of your query.'
