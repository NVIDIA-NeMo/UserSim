- id: 3970cf73-f293-5499-a565-da9bbe3757f4
  title: Copperleaf General Investment Account — comparison vs. alternatives and when
    not to choose it
  body: 'The Copperleaf General Investment Account is a flexible, self-directed investing
    tool designed for UK residents. To ensure you choose the right vehicle for your
    needs, please consider how it compares to our tax-efficient wrappers.


    Why choose the General Investment Account?

    This account is most appropriate if you have already exhausted your annual ISA
    allowances or if you are investing sums that exceed those limits. It provides
    a straightforward way to access the markets without the restrictions tied to specific
    ISA types.


    Key Considerations

    - Tax Exposure: Unlike an ISA, this account does not provide a tax shield. You
    must manage your own tax reporting regarding the £3,000 capital gains allowance
    and the £500 dividend allowance. We provide the platform but do not provide individual
    tax advice.

    - Cost: We maintain a competitive and transparent platform fee of 0.25%. To encourage
    diversification, fund dealing fees are waived (£0).

    - Protection: Your capital is protected by the FSCS up to £85,000 per person if
    the brokerage fails.


    When not to choose this account

    If you have not yet used your £20,000 annual ISA allowance, a Stocks and Shares
    ISA is generally a more efficient choice, as it allows your wealth to grow entirely
    tax-free. Similarly, if you are saving specifically for a first home or retirement,
    a Lifetime ISA may offer a government bonus that this account cannot provide.


    Please be aware that the value of investments can fall as well as rise, and capital
    is at risk.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: product_sheet
  source_authority: official
