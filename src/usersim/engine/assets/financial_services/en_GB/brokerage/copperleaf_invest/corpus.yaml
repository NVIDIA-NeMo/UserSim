- id: b5c49be6-5d88-5763-a5d3-9b3fc4765958
  title: Copperleaf Monthly Investing — account security best practices
  body: 'At Copperleaf Invest, we believe that transparency and security must go hand
    in hand. Because Copperleaf Monthly Investing involves recurring payments and
    automated state-changing actions, it is vital that you maintain rigorous security
    standards to protect your wealth.


    We employ multi-factor authentication (MFA) as a mandatory requirement. You should
    never share your MFA codes with anyone, including individuals claiming to be from
    our support team. We will never ask you to provide your password or security codes
    over the phone or via email.


    Be particularly vigilant regarding ''payment update'' scams. Fraudsters may send
    emails or messages claiming there is an issue with your £25 minimum monthly amount
    or your payment method, urging you to click a link to ''verify'' your details.
    We will always direct you to use the secure in-app messaging system for sensitive
    account updates. Remember that full verification is mandatory before any state-changing
    action, such as altering your monthly contribution or processing withdrawals,
    is performed.


    If you notice any unauthorised activity—such as a change to your payment frequency
    or an unexpected withdrawal—you must report it to us immediately. Any fraudulent
    activity is escalated instantly to our compliance team and handled in accordance
    with FCA guidelines. Reporting discrepancies within 24 hours allows us to act
    more decisively to protect your funds.


    To further secure your account, we recommend reviewing your notification settings
    to ensure you are alerted every time a monthly investment is executed. This ensures
    that the £0 regular dealing fee is being applied correctly and that your balance
    is moving as expected. For more on our regulatory commitments, see Copperleaf
    Monthly Investing — privacy and data handling.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: security_advisory
