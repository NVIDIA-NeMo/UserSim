- id: 17bd4b1f-50e1-5fce-8b87-38ae6278f377
  title: Copperleaf Monthly Investing — check status or history
  body: 'Use this guide to review your contribution history and the current status
    of your Copperleaf Monthly Investing plan.


    **Prerequisites**

    - A verified Copperleaf Invest account.

    - An active monthly investment plan.


    **Steps to check your status and history**


    1. **Request your investment summary:** Tell us that you would like to see the
    current status and history of your monthly investing plan. We will then retrieve
    your active plan details, including the current monthly amount (which must be
    at least £25) and the target investment.


    2. **Review the transaction history:** Ask us for a list of your most recent monthly
    contributions. We will provide a chronological record showing the dates the funds
    were debited from your bank and the dates the investments were executed.


    3. **Verify the dealing costs:** If you wish to confirm the fees paid, ask us
    to verify the dealing charges for these transactions. We will confirm that the
    regular dealing fee for these investments was £0.


    4. **Confirm the total value:** Ask for the current total value of the assets
    accumulated through your monthly plan. We will provide the current market value,
    reminding you that the value of investments can fall as well as rise and capital
    is at risk.


    **How you know it worked**

    You will have a clear list of dates and amounts confirming that your £25 or greater
    monthly contributions have been processed and invested successfully without dealing
    charges.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: how_to_guide
