- id: 206027b2-fd86-50cb-af42-24f5e4a47485
  title: Copperleaf Junior ISA — recognising scams targeting this product
  body: "At Copperleaf Invest, we believe the security of your child's future savings\
    \ is paramount. Because the Copperleaf Junior ISA is designed for long-term growth,\
    \ it can unfortunately attract fraudsters who attempt to exploit the trust and\
    \ emotion associated with children's savings.\n\nCommon scam patterns targeting\
    \ this product include:\n\n1. The 'Future Manager' Ruse: Scammers may contact\
    \ parents claiming to be a legal representative or a future account manager for\
    \ the child, requesting 'verification' of the account to ensure funds are secure\
    \ for when the child reaches 18. We will never contact you to ask for account\
    \ security details in this manner.\n2. Fake Government Bonuses: You may encounter\
    \ adverts or emails claiming that the government provides a direct cash bonus\
    \ for Junior ISA contributions. Please be aware that unlike the Lifetime ISA,\
    \ the Copperleaf Junior ISA does not offer a government bonus. Any communication\
    \ suggesting otherwise is fraudulent.\n3. Urgent 'Account Freeze' Alerts: Be wary\
    \ of messages claiming the account has been blocked due to a regulatory breach\
    \ and requesting an immediate payment or password change to rectify it.\n\nTo\
    \ protect your assets, we employ multi-factor authentication and rigorous identity\
    \ checks. We will never ask you to share your password, MFA codes, or full security\
    \ credentials via email or messaging. \n\nIf you notice any suspicious activity\
    \ or receive a communication that feels unusual, your first action should be to\
    \ notify us immediately via our secure in-app messaging. Prompt reporting is essential\
    \ to ensure we can protect the funds and handle the matter in accordance with\
    \ FCA guidelines. All accounts are protected by FSCS protection of up to £85,000\
    \ per person if the brokerage fails, providing a foundational layer of security\
    \ for your child's investment."
  domain: brokerage_investing
  product_category: junior_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: e905b312-c9ea-5f9a-96f2-83ccd9b6820b
  title: Copperleaf Junior ISA — limits, restrictions, and edge cases
  body: 'This document provides the necessary technical constraints and operational
    boundaries for the Copperleaf Junior ISA to assist support agents in managing
    customer queries.


    Contribution Limits

    The primary restriction is the annual allowance. The total amount that can be
    paid into a Copperleaf Junior ISA in a single tax year is £9,000. If a customer
    attempts to contribute beyond this limit, the transaction must be declined to
    ensure compliance with FCA and HMRC regulations.


    Account Control and Access

    A fundamental restriction of this product is that the funds belong to the child,
    but the account is managed by the registered adult. This control remains in place
    until the child reaches the access age of 18. At this point, the account automatically
    transitions, and full control of the assets passes to the child. Agents must ensure
    that no withdrawals are processed before the child is 18, except in very specific
    legal circumstances (such as court orders), which require escalation to operations
    management.


    Fee Structure

    The account is subject to a platform fee of 0.25%, which covers the infrastructure
    and maintenance of the investment environment. This fee is applied consistently
    regardless of the account balance. In line with our fee philosophy to encourage
    diversified investing, we waive fund dealing fees (making them £0).


    Verification Requirements

    Because the Copperleaf Junior ISA involves a minor, full identity verification
    of the adult account holder is mandatory before any state-changing action is performed.
    This includes updating the registered address or initiating a transfer to another
    provider. Any request to alter account details without current MFA verification
    must be blocked.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: product_sheet
  source_authority: official
