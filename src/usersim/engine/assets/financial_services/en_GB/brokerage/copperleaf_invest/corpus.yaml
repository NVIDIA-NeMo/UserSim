- id: a93dbca9-e524-522b-ab13-d143c2e5f737
  title: Copperleaf Monthly Investing — dealing charge for monthly investments explained
  body: 'Q: How much does it cost to execute my monthly investment trade?


    A: We believe in making diversified investing accessible. Therefore, we provide
    a regular dealing fee of £0 for all contributions made through the Copperleaf
    Monthly Investing service. You will not be charged a transaction fee for these
    recurring trades.


    Q: Does the £0 dealing fee apply to all trades I make on the platform?


    A: No. The £0 fee applies specifically to the automated, regular monthly contributions.
    If you choose to make an ad-hoc, one-off investment outside of your monthly schedule,
    different dealing charges may apply. For a full breakdown of our cost structure,
    including the 0.25% platform fee, please refer to Copperleaf Monthly Investing
    — overview.


    Q: Why is the regular dealing fee waived?


    A: We waive this fee to encourage our clients to invest consistently and diversify
    their holdings, which is a core component of a sustainable long-term investment
    strategy.'
