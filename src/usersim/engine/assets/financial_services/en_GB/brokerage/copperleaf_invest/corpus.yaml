- id: 298ecd95-0fdc-5e76-89a9-b2fdb2972242
  title: Copperleaf Lifetime ISA — withdrawal charge on unauthorised withdrawals explained
  body: '### What is an unauthorised withdrawal?

    An unauthorised withdrawal occurs if you take money out of your Copperleaf Lifetime
    ISA for any reason other than buying your first home (up to the £450,000 price
    cap), reaching retirement age, or in specific cases of terminal illness.


    ### How much is the withdrawal charge?

    All unauthorised withdrawals are subject to a 25% withdrawal charge. This charge
    is applied to the total amount being withdrawn, including both your original contributions
    and the 25% government bonus.


    ### Will I lose money if I withdraw early?

    Yes. Because the 25% withdrawal charge applies to the entire balance, it often
    means you will get back less than you originally invested. We strongly advise
    that you only contribute funds you are confident you will not need until you meet
    the authorised withdrawal criteria. For more on how this affects your balance,
    please see Copperleaf Lifetime ISA — risk disclosures.'
