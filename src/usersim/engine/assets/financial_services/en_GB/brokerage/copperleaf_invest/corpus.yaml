  institution_id: copperleaf_invest
- id: 6922c680-2eb4-5030-bbb6-17d02a8bdb47
  title: Copperleaf Lifetime ISA — maximum price of a first home bought with the Lifetime
    ISA explained
  body: '**What is the maximum price of a property I can buy using my Copperleaf Lifetime
    ISA?**

    To make a penalty-free withdrawal for the purchase of your first home, the property
    price must not exceed £450,000. If the property you are purchasing is valued above
    this £450,000 limit, the withdrawal will be treated as an unauthorised withdrawal.


    **What happens if I buy a home that costs more than £450,000?**

    If the property price exceeds the £450,000 cap, you cannot use the Lifetime ISA
    for the purchase without incurring a withdrawal charge of 25%. This charge is
    applied to the total amount withdrawn, which means you will likely receive back
    less than you originally contributed.


    **Does this limit apply to all first-time buyers?**

    Yes, the £450,000 property price cap is a standard requirement for all Copperleaf
    Lifetime ISA accounts. We recommend verifying the property valuation with your
    solicitor before initiating a withdrawal.


    For more on account rules, see Copperleaf Lifetime ISA — overview.'
  domain: brokerage_investing
