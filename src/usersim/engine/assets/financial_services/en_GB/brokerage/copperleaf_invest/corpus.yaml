- id: 1fc5ac67-f29e-5dd7-a282-79386fa1b8e9
  title: Copperleaf General Investment Account — when to switch or upgrade
  body: "This guide helps agents determine when a customer should move assets from\
    \ a Copperleaf General Investment Account to a more tax-efficient vehicle.\n\n\
    General Investment Account (GIA)\n- Best for: Customers who have already used\
    \ their annual ISA allowances or those who require maximum flexibility for large\
    \ sums.\n- Key Tax Implications: Gains are subject to the £3,000 capital gains\
    \ allowance and dividends to the £500 dividend allowance.\n- Cost: 0.25% platform\
    \ fee.\n\nStocks and Shares ISA\n- Best for: Long-term growth where tax-free returns\
    \ are the priority.\n- Key Tax Implications: All gains and dividends are tax-free\
    \ within the £20,000 annual allowance.\n- Cost: 0.25% platform fee.\n\nWhen to\
    \ suggest a switch:\nIf a customer has funds in their GIA but has not yet utilised\
    \ their £20,000 annual ISA allowance for the current tax year, we should highlight\
    \ the benefits of moving those funds. Switching to an ISA removes the need to\
    \ track the £3,000 and £500 tax thresholds, providing a clearer path to wealth\
    \ creation. \n\nFor a detailed overview of the alternative, see Copperleaf Stocks\
    \ and Shares ISA — overview."
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: comparison
