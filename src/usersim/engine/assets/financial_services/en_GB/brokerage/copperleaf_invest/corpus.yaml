- id: d8917f5d-dee4-5e33-9f82-3fe184b087e3
  title: Copperleaf Stocks and Shares ISA — ISA allowance for the 2026/27 tax year
    explained
  body: 'How much can I invest in my Copperleaf Stocks and Shares ISA for the 2026/27
    tax year?

    Based on current regulations, the annual ISA allowance is £20,000. This is the
    maximum amount you can contribute to your ISA (or a combination of ISAs) within
    the tax year without losing the tax-efficient status of those funds.


    What happens if I contribute more than £20,000?

    If you exceed the £20,000 limit, you may be in breach of HMRC rules. We strive
    to provide a clear and accessible path to wealth creation, but we cannot permit
    contributions that exceed the legal annual limit. If you have already exhausted
    your allowance, we recommend our General Investment Account as a flexible alternative.


    Does the £20,000 limit apply to the growth of my investments?

    No. The £20,000 limit applies only to the net contributions you make from your
    cash. Any growth, dividends, or interest earned within the Copperleaf Stocks and
    Shares ISA does not count towards your annual allowance.'
