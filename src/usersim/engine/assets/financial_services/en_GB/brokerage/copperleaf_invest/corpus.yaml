- id: 05cdf3fb-930a-50e7-93f4-dcb88f3307f1
  title: Copperleaf Junior ISA — make a change or update
  body: 'Follow these steps to update the personal details or account preferences
    associated with a Copperleaf Junior ISA. Because security is paramount, all changes
    require full verification.


    1. Provide the Update Request: Tell us exactly which piece of information needs
    to be changed (for example, a change of residential address or an update to the
    child''s legal name). Provide the account number associated with the Copperleaf
    Junior ISA.


    2. Complete Identity Verification: We will trigger a verification request. You
    must complete the multi-factor authentication (MFA) process and, if the change
    is significant (such as a name change), provide the required supporting documentation
    (e.g., a marriage certificate or deed poll).


    3. Review the Change: We will confirm the new details back to you via secure messaging
    to ensure there are no clerical errors.


    4. Final Confirmation: Once you confirm the details are correct, we will apply
    the change to the account. You will receive a final confirmation message stating
    that the record has been updated.


    If you are attempting to change the account holder or the child''s details, please
    be aware that this is subject to rigorous identity checks to prevent fraud. If
    the request is complex, it will be escalated to our operations management team
    for review.'
