- id: 732d5de2-323e-5fd9-b635-3868add964a5
  title: Copperleaf General Investment Account — a failed or pending action
  body: 'If you encounter a situation where a request—such as a withdrawal, a trade,
    or a detail change—is marked as ''failed'' or remains ''pending'' longer than
    expected, please follow these steps to resolve the issue.


    Common Symptoms

    - An error message stating that the action cannot be completed at this time.

    - A transaction status that remains ''pending'' for more than three UK business
    days.

    - A notification that further verification is required before a state-changing
    action can be processed.


    What to Check

    1. Verification Status: Check if your identity documentation has expired or if
    we have requested updated information. Because security is paramount, full verification
    is mandatory before any state-changing action is performed.

    2. Authentication: Ensure your multi-factor authentication (MFA) is active and
    that you have successfully completed the security challenge for the requested
    action.

    3. Funding Availability: For pending trades, ensure that the required funds are
    fully settled and not currently locked in another pending transaction.


    How to Fix

    - If verification is the issue, provide us with the requested updated documents
    immediately. We will review them and notify you once the block is lifted.

    - If the action is pending due to a technical lag, please inform us via secure
    messaging. We will investigate the transaction status and provide a timeline for
    resolution.


    When we Escalate

    If we cannot resolve the issue during your initial query, we will escalate the
    matter to our operations management team. You will be notified that a case has
    been opened, and we will provide a clear timeline for the resolution. For further
    details on our commitment to fairness, see the Copperleaf General Investment Account
    — regulatory disclosures.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: troubleshooting
