  institution_id: copperleaf_invest
- id: 1e8b0657-4d21-5054-ba20-c19aa8eb9878
  title: Copperleaf General Investment Account — regulatory disclosures
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA) and adheres to all applicable fair treatment and data privacy standards.
    This document serves as a formal disclosure for the Copperleaf General Investment
    Account.


    Risk Warning: The value of investments can fall as well as rise, and capital is
    at risk. This means that the value of your portfolio may decrease, and you may
    get back less than the amount you originally invested. Past performance is not
    a reliable indicator of future results.


    FSCS Protection: This account is protected by the Financial Services Compensation
    Scheme (FSCS). In the event that Copperleaf Invest fails, eligible claimants can
    be protected for up to £85,000 per person.


    Taxation and Advice: The Copperleaf General Investment Account is subject to UK
    tax laws. Specifically, investors must adhere to the £3,000 capital gains allowance
    and the £500 dividend allowance. Copperleaf Invest provides educational resources
    for self-directed investing only. We do not provide personal recommendations and
    we give no individual tax advice. It is the responsibility of the client to ensure
    that any complex products selected are appropriate for their specific financial
    needs and risk appetite.


    Security and Verification: To prevent fraud and protect client assets, we employ
    multi-factor authentication and rigorous identity checks. Full verification is
    mandatory before any state-changing action, such as processing withdrawals or
    altering account details, is performed. Any fraudulent activity is escalated immediately
    to our compliance team and handled in accordance with FCA guidelines.


    Disputes: We approach all disputes with a commitment to fairness and transparency,
    providing a clear timeline for resolution through our defined escalation path
    from customer service to operations management.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: disclosure
  source_authority: official
