- id: 9f7d9f1f-711c-5b84-ac01-d10eefbb7458
  title: Copperleaf Junior ISA — age at which the child takes control of the account
    explained
  body: 'Q: When does my child get access to the funds in their Copperleaf Junior
    ISA?


    A: The child takes full legal control of the account when they reach the age of
    18. At this point, we will initiate the process to transition the account from
    the registered adult''s management to the child.


    Q: Can I change the age at which the child takes control?


    A: No. The access age of 18 is a statutory requirement for Junior ISAs in the
    UK and cannot be altered by the account holder or by Copperleaf Invest.


    Q: What happens to the £9,000 annual allowance once the child turns 18?


    A: Once the child is 18, they can no longer contribute to a Junior ISA. They may
    instead choose to contribute to a standard ISA, subject to the applicable adult
    ISA allowances. For more information on our adult options, see the Copperleaf
    Stocks and Shares ISA — overview document.'
  domain: brokerage_investing
