- id: b27b87c3-477e-5766-bd68-6c437fd69f4d
  title: Copperleaf General Investment Account — vs. a similar product here
  body: "When deciding between the Copperleaf General Investment Account and the Copperleaf\
    \ Stocks and Shares ISA, the primary consideration is tax treatment.\n\nThe Copperleaf\
    \ General Investment Account is a flexible, taxable account. It is subject to\
    \ the £3,000 capital gains allowance and the £500 dividend allowance. It is the\
    \ ideal choice for investors who have already utilised their £20,000 annual ISA\
    \ allowance and require additional capacity for wealth creation.\n\nIn contrast,\
    \ the Copperleaf Stocks and Shares ISA provides a tax-free environment for long-term\
    \ growth, meaning gains and dividends are not subject to the aforementioned allowances.\
    \ However, it is limited by the annual ISA contribution cap.\n\nBoth products\
    \ share the same transparent platform fee of 0.25% and the same £0 fund dealing\
    \ fee. \n\nChoose the General Investment Account if you have exhausted your ISA\
    \ limits; choose the ISA if you have remaining allowance and wish to prioritise\
    \ tax efficiency. For more on the ISA, see Copperleaf Stocks and Shares ISA —\
    \ overview."
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: comparison
  source_authority: official
