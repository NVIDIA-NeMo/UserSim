- id: 81478cd3-2c2d-5e66-be99-ed6946dd7894
  title: Copperleaf General Investment Account — check status or history
  body: 'If you wish to review your investment progress, tax liabilities, or transaction
    history for your Copperleaf General Investment Account, please follow these steps:


    1. Request a transaction history report

    Tell us that you would like a statement or history report for your General Investment
    Account. Specify the time period you wish to cover (e.g., the current tax year).


    2. Provide verification

    Because this involves sensitive financial data, we will ask you to complete a
    verification check. This may involve multi-factor authentication or confirming
    specific identity details.


    3. Receive your documents

    Once verified, we will send the requested statements or history reports to you
    via your secure in-app messaging portal or registered email address.


    4. Review your gains and dividends

    Check your reports for ''realised gains'' and ''dividends received''. These are
    the figures you will need to track against the £3,000 capital gains allowance
    and the £500 dividend allowance for your tax returns.


    5. Confirm receipt

    We will ask you to confirm that you have successfully received and opened the
    documents. If the files do not open or data appears missing, let us know immediately
    so we can investigate.'
  domain: brokerage_investing
  product_category: general_investment_account
