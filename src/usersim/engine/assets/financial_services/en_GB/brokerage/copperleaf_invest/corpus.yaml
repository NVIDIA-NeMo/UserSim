- id: 47cc4d83-48ed-5234-9b4c-d0f863f258db
  title: Copperleaf Stocks and Shares ISA — cost and charges
  body: 'What are the ongoing costs of holding a Copperleaf Stocks and Shares ISA?

    We believe in clarity of cost. We charge a 0.25% platform fee, which covers the
    ongoing infrastructure and maintenance of your account. This is designed to ensure
    the long-term sustainability of our platform while remaining competitive.


    Are there fees when I buy or sell investments?

    Yes, depending on the asset type:

    - Shares: Each share dealing transaction carries a fee of £5.95.

    - Funds: We provide a £0 fund dealing fee, meaning there is no charge when you
    buy or sell funds, as we want to encourage diversified investing.


    Are there any hidden charges?

    No. We operate a transparent pricing model. All fees, including the 0.25% platform
    fee and any £5.95 share charges, are clearly documented in your statements. For
    a full breakdown, you can refer to Copperleaf Stocks and Shares ISA — fee schedule.'
