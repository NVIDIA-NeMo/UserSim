- id: 447a14a5-2718-570f-98c7-e9e9dfad27b0
  title: Copperleaf General Investment Account — account security best practices
  body: 'At Copperleaf Invest, the security of your assets is our highest priority.
    Because the Copperleaf General Investment Account is a flexible vehicle for significant
    wealth, it can occasionally be a target for sophisticated fraud. We employ rigorous
    identity checks and multi-factor authentication to protect your holdings, but
    your vigilance is our strongest defence.


    **Common Fraud Patterns**

    Fraudsters may attempt to impersonate Copperleaf staff via email or secure messaging,
    claiming there is an ''urgent'' issue with your account or a ''compliance block''
    that requires immediate action. They may pressure you to move funds to a ''safe
    account'' or request your multi-factor authentication codes to ''verify'' your
    identity.


    **Our Absolute Boundaries**

    To protect your capital, please remember that we will NEVER:

    - Ask you to disclose your full password or multi-factor authentication codes
    over a message or call.

    - Request that you transfer funds to a third-party account for ''security'' or
    ''verification'' purposes.

    - Pressure you into making an immediate investment decision under threat of account
    closure.


    **Immediate Action**

    If you notice any unauthorised transaction or receive a communication that feels
    suspicious, notify us immediately via secure in-app messaging. Prompt reporting
    is essential for the fastest resolution and for the protection of your funds.
    While we provide a secure environment and FSCS protection of up to £85,000 per
    person should the firm fail, this does not cover losses resulting from a client
    sharing their security credentials with a third party.


    **Best Practices**

    - Regularly update your security credentials.

    - Ensure your contact details are current so we can notify you of state-changing
    actions.

    - Be wary of any unsolicited communication promising guaranteed returns, as the
    value of investments can fall as well as rise and capital is at risk.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: security_advisory
  source_authority: official
