- id: aa8e2ace-9df4-5421-8815-51b0c60e1e6e
  title: Copperleaf Lifetime ISA — check status or history
  body: 'If you are an existing customer and wish to review your contribution history,
    bonus accruals, or current balance, please follow these steps. We provide this
    information through our secure digital-first support model.


    **Prerequisites**

    Before starting, ensure you have completed the mandatory full verification process
    for your account to allow us to share sensitive financial data.


    **Step-by-Step Process**


    1. **Request a Statement**: Send us a message via secure in-app messaging or email
    requesting a ''Lifetime ISA Contribution and Bonus Summary'' for the current or
    a previous tax year.

    2. **Verification Review**: We will perform a security check to verify your identity.
    If additional verification is required, we will notify you immediately.

    3. **Document Delivery**: We will provide a digital statement that lists every
    contribution made towards your £4,000 annual limit and the corresponding 25% government
    bonuses credited to your account.

    4. **Review History**: Review the statement to confirm your total contributions
    and ensure the 25% bonus has been correctly applied to all eligible payments.

    5. **Confirm Totals**: If you have any questions regarding the calculations or
    a specific transaction, reply to the message thread for a detailed explanation
    from one of our agents.


    **How you know it worked**

    You will have received a PDF or secure message containing a chronological list
    of all transactions, including deposits, bonus credits, and any investment movements,
    showing your final current balance.


    For assistance with updating your account details, please refer to Copperleaf
    Lifetime ISA — make a change or update.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: how_to_guide
