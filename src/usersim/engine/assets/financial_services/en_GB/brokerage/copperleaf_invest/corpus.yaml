- id: db2b6b99-0741-5ee1-9b83-e76a17db25a1
  title: Copperleaf Junior ISA — set up and activate
  body: 'Setting up a Copperleaf Junior ISA is a straightforward process designed
    to get your child''s investment journey started as quickly as possible. Please
    ensure you have the child''s full legal name, date of birth, and your own valid
    government-issued identification ready before beginning.


    1. Provide the account details: Tell us the child''s full legal name and date
    of birth, and specify that you wish to open a Copperleaf Junior ISA. You will
    also need to confirm your relationship to the child (e.g., parent or legal guardian).


    2. Complete identity verification: To comply with FCA regulations and ensure the
    highest security, we will perform rigorous identity checks on the adult account
    holder. This includes a multi-factor authentication (MFA) process and the submission
    of a digital copy of your ID. We will confirm once your identity has been successfully
    verified.


    3. Make the initial deposit: Once verified, specify the amount you wish to deposit
    to activate the account. Please remember that the total contributions for the
    current tax year must not exceed the £9,000 allowance.


    4. Receive activation confirmation: We will process the deposit and send you a
    confirmation message through our secure in-app messaging system. This message
    will confirm that the Copperleaf Junior ISA is now active and the funds are being
    held for the child.


    5. Select your investments: You can now choose the assets you wish to purchase
    for the account. Note that while we provide educational resources, we do not offer
    personal recommendations.


    If you are unsure whether you meet the necessary criteria to open this account,
    please consult the Copperleaf Junior ISA — eligibility requirements.'
