  institution_id: copperleaf_invest
- id: f539c69c-cc6b-5518-9373-08ab995708a7
  title: Copperleaf Junior ISA — how rates are tiered and applied
  body: 'This rate sheet defines the platform charges applicable to the Copperleaf
    Junior ISA. Unlike some products that employ a sliding scale or tiered structure
    based on the account balance, we maintain a flat-rate model for transparency.


    Platform Fee:

    A single flat rate of 0.25% applies to all balances within the Copperleaf Junior
    ISA, regardless of the total value of the assets. There are no minimum or maximum
    balance thresholds that change this percentage.


    Application of the Rate:

    This 0.25% fee is applied to the total value of the infrastructure and maintenance
    of the account. It is deducted from the account assets on a regular cycle.


    What changes the rate?

    We do not offer discretionary discounts or tiers. The fee is applied consistently
    to all users to ensure the sustainable operation of our digital-first support
    model. Any future changes to this flat rate would be communicated to the account
