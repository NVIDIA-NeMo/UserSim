- id: f7010f98-df4f-5225-89c8-6848f3b676a3
  title: Copperleaf Stocks and Shares ISA — make a change or update
  body: 'Updating your account details or changing your investment preferences is
    a straightforward process. To ensure the security of your assets, we require full
    verification before any changes are implemented.


    1. Specify the Update: Tell us exactly which detail you wish to change, such as
    your residential address, contact email, or the beneficiary associated with your
    Copperleaf Stocks and Shares ISA.


    2. Provide Supporting Documentation: For address or identity changes, provide
    a digital copy of a recent utility bill or a government-issued ID. We will verify
    these documents against our rigorous identity standards.


    3. Complete Security Verification: We will trigger a multi-factor authentication
    (MFA) request to your registered device. Confirm the request to prove you are
    the account holder.


    4. Review the Change: We will send a summary of the requested change via secure
    in-app messaging for your final confirmation.


    5. Final Confirmation: Once you confirm the summary, we will apply the change
    to your account and send a final notification confirming that the update is complete.


    If you are updating your details to facilitate an ISA Transfer, remember that
    to preserve the tax-free status of your £20,000 annual allowance, funds must never
    be withdrawn and paid back in. For guidance on setting up your account initially,
    see Copperleaf Stocks and Shares ISA — set up and activate.'
