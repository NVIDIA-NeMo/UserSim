- id: c565e64a-9255-583a-8a62-6dbe4dbbcde4
  title: Copperleaf General Investment Account — fraud and unauthorised-activity protection
  body: "When choosing a brokerage for a general investment account, security is as\
    \ critical as the cost structure. We protect the Copperleaf General Investment\
    \ Account through a multi-layered security framework designed to prevent unauthorised\
    \ access and fraudulent activity. Unlike some alternative providers who may rely\
    \ on simple password protection, we employ mandatory multi-factor authentication\
    \ (MFA) for all account access.\n\nBecause the Copperleaf General Investment Account\
    \ does not have the same tax-exempt boundaries as an ISA, it is often targeted\
    \ by specific phishing attempts designed to trick users into altering their bank\
    \ details for withdrawals. To combat this, we enforce rigorous identity checks\
    \ and mandatory full verification before any state-changing action is performed.\
    \ This means that even if a third party were to gain access to your login credentials,\
    \ they would be unable to process withdrawals or alter your account details without\
    \ passing our secondary verification protocols.\n\nWe are strictly regulated by\
    \ the FCA and adhere to the highest fair treatment and data privacy standards.\
    \ In the unlikely event of a firm-wide failure, your assets are protected by the\
    \ Financial Services Compensation Scheme (FSCS) up to £85,000 per person. \n\n\
    We will never ask you to disclose your MFA codes, password, or full security credentials\
    \ via email or insecure messaging. If you notice any suspicious activity, such\
    \ as unexpected login notifications or requests for personal information, you\
    \ must notify us immediately. Fraudulent activity is escalated immediately to\
    \ our compliance team and handled in accordance with FCA guidelines to ensure\
    \ a fair and transparent resolution.\n\nBy maintaining these strict verification\
    \ standards, we ensure that your wealth creation path remains secure, providing\
    \ the reassurance necessary for long-term self-directed investing."
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 9bd0dd78-80d8-555c-9d90-c345b4b4ea42
  title: Copperleaf General Investment Account — account agreement
  body: 'This account agreement governs the relationship between the client and Copperleaf
    Invest regarding the Copperleaf General Investment Account. By opening this account,
    you agree to the following terms and conditions.


    1. Fee Obligations: The client agrees to pay a platform fee of 0.25% to cover
    infrastructure and maintenance. This fee is applied to the total value of the
    assets held within the account. We reserve the right to deduct this fee directly
    from the account cash balance or via the liquidation of assets if no cash is available.


    2. Tax Responsibilities: The client acknowledges that the Copperleaf General Investment
    Account is a taxable vehicle. While we provide educational resources regarding
    the £3,000 capital gains allowance and the £500 dividend allowance, we provide
    no individual tax advice. The client is solely responsible for the reporting and
    payment of any taxes due to HMRC.


    3. Regulatory Compliance: We operate under the strict regulation of the FCA. We
    maintain a commitment to fair treatment and data privacy. We employ multi-factor
    authentication and rigorous identity checks; the client must comply with all verification
    requests before any state-changing actions, such as withdrawals, are processed.


    4. Risk Acknowledgement: The client accepts that the value of investments can
    fall as well as rise, and capital is at risk. This means the investor may get
    back less than they originally invested.


    5. Account Termination: Either party may terminate this agreement upon written
    notice. Upon closure, we will settle all outstanding fees, including the 0.25%
    platform fee, and transfer the remaining balance to the client''s verified bank
    account.


    6. Dispute Resolution: We approach all disputes with a commitment to fairness.
    Complex disputes are handled via a defined escalation path to our operations management
    to ensure transparency and a clear timeline for resolution.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: terms_conditions
