- id: 1fdfa9b8-65f5-50ad-adbb-2c439c120ad5
  title: Copperleaf Stocks and Shares ISA — how rates are tiered and applied
  body: 'Support agents should use the following guidance when explaining the fee
    structure of the Copperleaf Stocks and Shares ISA. We do not use tiered pricing
    for this product; a single, transparent rate applies to all balances.


    Platform Fee: A flat rate of 0.25% is applied to the total value of the assets
    held in the account. This fee covers infrastructure and maintenance and is not
    tiered based on the account balance.


    Share Dealing Fee: A flat charge of £5.95 is applied to every single trade involving
    individual stocks and shares, regardless of the transaction value.


    Fund Dealing Fee: A fee of £0 applies to all fund trades. This is a deliberate
    waiver to encourage customers to diversify their portfolios.


    These rates are fixed across all Copperleaf Stocks and Shares ISA accounts. Any
    change to these rates would be communicated via our standard change-of-terms policy.
    For a comprehensive list of all charges, see Copperleaf Stocks and Shares ISA
    — fee schedule.'
