- id: 3bba786a-c67a-550d-beb8-1df6164ec90b
  title: Copperleaf Lifetime ISA — set up and activate
  body: 'Setting up your Copperleaf Lifetime ISA is a straightforward process designed
    to ensure your account is secure and compliant with FCA regulations. Please follow
    these steps to activate your account.


    Before you begin, ensure you have your current passport or driving licence and
    a recent proof of address (such as a utility bill or bank statement) ready for
    verification.


    1. Tell us that you wish to open a Copperleaf Lifetime ISA. We will then ask you
    to provide your full legal name, residential address, and date of birth to confirm
    you meet the maximum opening age of 39.

    2. Provide your identity documents and proof of address. We employ rigorous identity
    checks to protect your security.

    3. Wait for us to complete the verification process. We will notify you once your
    identity has been fully verified, which is a mandatory requirement before any
    state-changing action can be performed.

    4. Tell us the amount you wish to make as your initial deposit. Please remember
    that the annual limit is £4,000; any amount exceeding this for the current tax
    year will be rejected.

    5. Provide the bank details from which you wish to fund the account. We will then
    process the transfer and confirm when the funds have been successfully credited.


    Once we confirm that your account is active, you will be able to begin investing.
    You will see the 25% government bonus applied to your eligible contributions according
    to the standard government processing timeline.


    If you encounter any issues during this process, such as a delay in verification,
    please refer to Copperleaf Lifetime ISA — a failed or pending action.'
