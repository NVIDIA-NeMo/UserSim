- id: 62c27316-2815-5c08-91f0-54abaea88a29
  title: Copperleaf Monthly Investing — a declined or blocked action
  body: '**Symptom:** You have attempted to set up, change, or withdraw from a Copperleaf
    Monthly Investing plan, but the action was declined or blocked.


    **Likely Causes**

    - **Incomplete Verification:** The most common cause for a blocked action is a
    lack of full identity verification. Security is paramount at Copperleaf Invest;
    we require rigorous checks before any state-changing action is performed.

    - **Minimum Amount Not Met:** If you attempted to lower your monthly contribution
    to an amount less than £25, the system will automatically decline the request.

    - **Insufficient Funds:** If a scheduled monthly investment was blocked, it is
    typically due to insufficient funds in the linked bank account at the time of
    the transfer.


    **What to check and in what order**

    1. **Verify your account status:** Ask us if your account is fully verified. If
    verification is pending, you will be unable to alter your investment plans.

    2. **Check the contribution amount:** Confirm that the requested monthly amount
    is £25 or more. If it is lower, you will need to increase the amount to proceed.

    3. **Review bank balance:** Check your linked bank account to ensure there were
    sufficient funds for the scheduled debit.


    **The Fix**

    - **For verification issues:** Provide any outstanding documentation we request
    to complete your identity checks. Once verified, the blocked action can be retried.

    - **For amount issues:** Provide a new monthly amount that meets the £25 minimum.

    - **For funding issues:** Ensure funds are available; we will attempt the transfer
    again on the next scheduled date.


    **When to escalate**

    If your account is fully verified and the minimum amount is met, but the action
    is still blocked, we will raise a case with our operations management team. You
    will receive a confirmation of the case number and a timeline for resolution,
    typically within 3-5 UK business days.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: b9371a27-28f6-5591-abdd-1e90404f5c81
  title: Copperleaf Monthly Investing — when to switch or upgrade
  body: "As a support agent, you should identify when a client's needs have evolved\
    \ beyond the scope of Copperleaf Monthly Investing. \n\n**When to suggest a switch\
    \ or upgrade:**\n- **High Liquidity Needs:** If a client requires frequent, unplanned\
    \ access to their capital, the disciplined structure of monthly investing may\
    \ be too rigid. Suggest a more flexible arrangement via a General Investment Account.\n\
    - **Tax Efficiency Requirements:** If the client is investing significant amounts\
    \ and has not yet utilised their ISA allowances, suggest moving the monthly plan\
    \ into a Stocks and Shares ISA. This allows them to benefit from the £20,000 annual\
    \ allowance while maintaining the £0 regular dealing fee.\n- **Large Lump Sums:**\
    \ When a client receives a windfall, the £25 minimum monthly commitment is irrelevant.\
    \ They should be guided towards lump-sum investing, though they should be cautioned\
    \ that this removes the 'averaging' benefit of monthly contributions.\n\n**Key\
    \ Decision Metric:**\nIf the client's priority is automation and low entry cost\
    \ (£25 minimum, £0 dealing fee), they should stay with Copperleaf Monthly Investing.\
    \ If their priority shifts to tax shielding or high-volume trading, a transition\
    \ to a dedicated ISA or GIA is appropriate."
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: comparison
  source_authority: official
