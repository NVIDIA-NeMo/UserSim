  body: "This document provides a step-by-step walkthrough for support agents assisting\
    \ customers with the opening and activation of a Copperleaf General Investment\
    \ Account. This account is designed for UK residents who have either exhausted\
    \ their ISA allowances or prefer a more flexible investment structure.\n\n**Phase\
    \ 1: Application and Verification**\n1. **Initial Request**: The customer expresses\
    \ interest in a general investment vehicle. Confirm they are a UK resident.\n\
    2. **Identity Verification**: Guide the customer through our mandatory identity\
