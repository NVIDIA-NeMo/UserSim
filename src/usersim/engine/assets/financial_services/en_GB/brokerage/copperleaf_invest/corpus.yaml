- id: bfeef31e-0907-56d9-8283-53d58c8f8e72
  title: Copperleaf Lifetime ISA — Lifetime ISA limit each tax year explained
  body: 'Q: How much can I contribute to my Copperleaf Lifetime ISA each tax year?


    A: You can contribute up to an annual limit of £4,000. This limit applies across
    all Lifetime ISAs you may hold. Any contributions made within the UK tax year
    up to this amount are eligible for the 25% government bonus.


    Q: What happens if I try to contribute more than the annual limit?


    A: We cannot accept contributions that exceed the £4,000 annual limit. If a payment
    is made that would push your total annual contributions over this threshold, we
    will reject the excess funds and return them to your nominated bank account.


    Q: Does the government bonus count towards my £4,000 limit?


    A: No, the annual limit of £4,000 applies only to the funds you personally contribute.
    The 25% government bonus is added on top of your contributions and does not reduce
    the amount you can save each year.


    For further details on our account rules, please see Copperleaf Lifetime ISA —
    eligibility requirements.'
