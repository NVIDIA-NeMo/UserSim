- id: bb2a577c-a209-5d31-80e2-e942093ebfa7
  title: Copperleaf Stocks and Shares ISA — cancel, close, or downgrade
  body: 'If you decide that the Copperleaf Stocks and Shares ISA is no longer the
    right fit for your financial goals, or if you are comparing your options and decide
    to move your assets, we provide a clear path to close or downgrade your account.


    Before you begin, please ensure you have decided whether you wish to liquidate
    your assets into cash or transfer them to another provider. To preserve the tax-free
    status of your investments, funds must be transferred directly; they must never
    be withdrawn and paid back in.


    Step 1: Request the action.

    Tell us whether you wish to close the account entirely or downgrade it to a different
    account type. We will then initiate the closure process in our systems.


    Step 2: Complete mandatory verification.

    Because closing an account is a state-changing action, we must perform a rigorous
    identity check. We will ask you to verify your identity using our multi-factor
    authentication and, if necessary, provide updated identification documents. We
    cannot proceed with the closure until full verification is complete.


    Step 3: Settle holdings.

    We will confirm the current status of your assets. You must then instruct us to
    either sell your holdings to cash or provide the details of the receiving provider
    for an ISA transfer. We will process these instructions and provide a confirmation
    once the assets have been moved or liquidated.


    Step 4: Final account settlement.

    Once the balance is settled and any final platform fee of 0.25% (calculated pro-rata)
    has been accounted for, we will close the account. You will receive a final confirmation
    message via secure in-app messaging or email confirming that the account is officially
    closed.


    For information on how to move your funds while keeping the tax advantage, refer
    to the definition of an ISA Transfer in our general glossary.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: f3cf2e82-966c-515f-a170-424977c424fc
  title: Copperleaf Stocks and Shares ISA — an unexpected charge or amount
  body: "When a customer reports an unexpected charge or a discrepancy in their account\
    \ balance for the Copperleaf Stocks and Shares ISA, support agents should follow\
    \ this diagnostic path to resolve the issue.\n\nSymptom: The customer believes\
    \ they have been overcharged or sees a deduction they do not recognise.\n\nStep\
    \ 1: Review Platform Fees\nCheck if the deduction corresponds to the platform\
    \ fee. We charge a fee of 0.25% to cover infrastructure and maintenance. Ensure\
    \ the customer understands that this is a percentage-based fee calculated on the\
    \ value of their holdings, not a flat monthly charge.\n\nStep 2: Analyse Trading\
    \ Activity\nCheck the customer's recent transaction history for share trades.\
    \ Every trade in individual stocks attracts a share dealing fee of £5.95. If the\
    \ customer has executed multiple share trades, these charges will accumulate.\
    \ Conversely, verify if the customer is questioning a fund trade; these should\
    \ have a fund dealing fee of £0.\n\nStep 3: Verify Allowance and Limits\nIf the\
    \ customer is questioning a rejected deposit, check if they have exceeded the\
    \ annual ISA allowance of £20,000. Contributions beyond this limit are not permitted\
    \ within the ISA wrapper.\n\nStep 4: Resolve or Escalate\nIf the charges align\
    \ with the 0.25% platform fee, the £5.95 share dealing fee, or the £0 fund dealing\
    \ fee, explain the breakdown to the customer clearly. \n\nIf the charge appears\
    \ to be an error or the customer remains dissatisfied, the matter must be escalated\
    \ to operations management. We will then conduct a formal review of the transaction.\
    \ The customer should be informed that we approach all disputes with a commitment\
    \ to fairness and transparency and will be provided with a clear timeline for\
    \ the resolution.\n\nFor further guidance on general account errors, see Copperleaf\
    \ Stocks and Shares ISA — a failed or pending action."
