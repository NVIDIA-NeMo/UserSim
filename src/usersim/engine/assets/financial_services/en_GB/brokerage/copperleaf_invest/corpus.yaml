- id: 1b84b7c2-1658-51e8-8917-925e96d0f0f3
  title: Copperleaf Monthly Investing — how rates are tiered and applied
  body: 'Copperleaf Monthly Investing operates on a transparent, flat-rate pricing
    model to ensure clarity and fairness for all clients. There are no tiered pricing
    structures based on balance size for this specific service.


    **Regular Dealing Fee**

    - **Rate**: £0

    - **Application**: This fee is waived for all automated monthly contributions,
    regardless of the amount invested, provided the minimum monthly commitment of
    £25 is met.


    **Platform Fee**

    - **Rate**: 0.25%

    - **Application**: This fee is applied to the total value of the assets held on
    the platform. It covers the ongoing costs of infrastructure, security, and maintenance.
    This is a standard fee across the brokerage and is not waived for monthly investing
    clients.


    These rates are applied consistently across all accounts. Any changes to these
    fees will be communicated to clients with a defined notice period in accordance
    with our account agreement.'
