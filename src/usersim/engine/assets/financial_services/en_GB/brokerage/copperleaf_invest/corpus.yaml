- id: 23ed2b8d-52b1-52d1-8d1c-3d910f6808b1
  title: Copperleaf Monthly Investing — regulatory disclosures
  body: 'Copperleaf Invest is strictly regulated by the Financial Conduct Authority
    (FCA). We adhere to all fair treatment and data privacy standards to ensure our
    clients are protected.


    Investment Risk: We must clearly communicate that the value of investments can
    fall as well as rise. Capital is at risk, meaning the inherent risk exists that
    the value of an investment can decrease, and the investor may get back less than
    they originally invested.


    Compensation: In the event that the brokerage fails, protection is provided by
    the Financial Services Compensation Scheme (FSCS) for up to £85,000 per person.
    This is a statutory protection and not a guarantee of investment performance.


    Fees: The Copperleaf Monthly Investing service is subject to a 0.25% platform
    fee, which is charged to cover the maintenance and infrastructure of the digital
    platform. The regular dealing fee for monthly contributions is £0.


    Advice Boundaries: We provide educational resources and a platform for self-directed
    investing. We do not provide personal recommendations, and we provide no individual
    tax advice. While we ensure that complex products are appropriate for the client''s
    needs through a standard of care, the final investment decisions remain with the
    customer.


    For further information on how we handle your personal data, please refer to the
    Copperleaf Monthly Investing — privacy and data handling document.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 7147f5c5-c621-53fa-a27b-b1ed2f6f3e31
  title: Copperleaf Monthly Investing — interest rate / AER schedule
  body: "Copperleaf Monthly Investing is an investment facility, not a cash savings\
    \ account. Therefore, it does not have a fixed interest rate or a guaranteed Annual\
    \ Equivalent Rate (AER).\n\nReturns on the capital invested via this service are\
    \ determined by the performance of the underlying assets, funds, or stocks selected\
    \ by the customer. Because these are market-linked investments, the yield can\
    \ fluctuate daily and is not guaranteed. \n\nAll accounts using this service are\
    \ subject to the 0.25% platform fee. This fee is deducted from the account to\
    \ cover infrastructure costs and does not represent an interest rate. As the value\
    \ of investments can fall as well as rise, your total return will be the net result\
    \ of asset growth (or decline) minus the platform fee."
