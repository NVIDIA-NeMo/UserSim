  institution_id: copperleaf_invest
- id: 1fa9e45b-8793-5b6f-b413-e2a59c329497
  title: Copperleaf Lifetime ISA — when to switch or upgrade
  body: "This guide assists support agents in identifying when a customer should consider\
    \ switching from or upgrading a different account to the Copperleaf Lifetime ISA.\n\
    \n**Switching to a Lifetime ISA**\nRecommend this switch for customers who are\
    \ under age 40 and specifically saving for their first home (under £450,000) or\
    \ retirement. The primary driver is the 25% government bonus, which significantly\
    \ outperforms a standard General Investment Account. However, warn the customer\
    \ that switching means accepting the 25% withdrawal charge if funds are needed\
    \ for any other purpose.\n\n**Switching Away from a Lifetime ISA**\nSuggest a\
    \ move to a Copperleaf Stocks and Shares ISA if the customer's goals have changed\
    \ and they now require flexibility. If the customer's prospective home price has\
    \ risen above £450,000, or if they need access to their capital before age 60\
    \ without the 25% penalty, the flexibility of a Stocks and Shares ISA is a better\
    \ choice.\n\n**Decision Matrix**\n- **Goal: First Home (<£450k) or Retirement**\
    \ $\rightarrow$ Copperleaf Lifetime ISA (for the 25% bonus).\n- **Goal: General\
    \ Wealth/Flexibility** $\rightarrow$ Copperleaf Stocks and Shares ISA (to avoid\
    \ the 25% charge).\n\nFor more on the alternative, see Copperleaf Stocks and Shares\
    \ ISA — overview."
