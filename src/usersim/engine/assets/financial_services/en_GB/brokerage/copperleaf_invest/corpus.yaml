- id: 910fd053-5eef-5792-a5d8-e5562769392f
  title: Copperleaf Monthly Investing — choosing between tiers or options
  body: 'When deciding how to grow your wealth with us, you may choose between ad-hoc
    investing and Copperleaf Monthly Investing. The primary difference lies in the
    cost structure and the investment habit.


    Ad-hoc Investing is better for those with irregular lump sums who prefer to time
    their entries into the market. However, this approach may incur higher dealing
    charges depending on the assets chosen.


    Copperleaf Monthly Investing is designed for those seeking a clear, automated
    path to wealth. It features a £0 regular dealing fee, meaning the cost of executing
    your monthly trade is entirely waived. The only requirement is a minimum monthly
    commitment of £25 and the standard 0.25% platform fee.


    Comparison Summary:

    - Costs: Ad-hoc may have dealing fees; Monthly Investing has a £0 regular dealing
    fee.

    - Commitment: Ad-hoc is flexible; Monthly Investing requires at least £25 per
    month.

    - Strategy: Ad-hoc is manual; Monthly Investing is automated and promotes diversification.


    If you value cost-efficiency and a disciplined saving habit, Copperleaf Monthly
    Investing is the superior choice. For a more detailed look at these costs, please
    see Copperleaf Monthly Investing — cost and charges.'
