- id: 9e06ae31-f0e8-544f-866a-daaddfc98e98
  title: Copperleaf Junior ISA — a failed or pending action
  body: 'If you encounter an issue where a deposit, withdrawal, or account change
    is listed as ''pending'' or has ''failed'', please follow these steps to identify
    and resolve the problem.


    **Symptom: Deposit or Withdrawal is Pending**


    *   **Likely Cause**: The most common cause for a pending action is an incomplete
    identity verification check or a mismatch in bank account details. Because security
    is paramount, we require full verification before any state-changing action is
    performed.

    *   **What to check**: First, verify that the bank account used for the transfer
    is in the name of the registered adult account holder. Second, check your secure
    in-app messages to see if we have requested updated identification documents.

    *   **The Fix**: If we have requested documents, provide the latest version of
    your government ID. Once we confirm verification, the action will typically move
    from ''pending'' to ''completed'' within one business day.


    **Symptom: Action marked as ''Failed''**


    *   **Likely Cause**: A failed action often results from exceeding the annual
    contribution limit of £9,000 or a failure in the multi-factor authentication (MFA)
    process.

    *   **What to check**: Review your total contributions for the current tax year.
    If you have already contributed £9,000, any further deposits will be automatically
    declined.

    *   **The Fix**: If the limit has not been exceeded, we will investigate the technical
    failure. We will first check the transaction logs and then confirm the resolution
    to you via email or secure message.


    **When to Escalate**


    If a dispute regarding a failed transaction remains unresolved after three business
    days, we will escalate the matter to our operations management team. We are committed
    to fairness and transparency and will provide you with a clear timeline for the
    final resolution of the dispute.


    For guidance on the initial setup to avoid these issues, see the Copperleaf Junior
    ISA — set up and activate.'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: troubleshooting
  source_authority: official
