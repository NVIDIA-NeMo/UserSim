- id: 85fb5741-1203-5bf5-ae9f-485057ffd1f6
  title: Copperleaf Stocks and Shares ISA — overview
  body: 'The Copperleaf Stocks and Shares ISA is designed as the primary tax-efficient
    vehicle for long-term growth. By utilising the £20,000 annual ISA allowance, our
    customers can invest in a diverse range of assets while ensuring that any capital
    gains or dividends generated within the wrapper remain free from UK tax.


    We believe in a transparent and sustainable cost structure. To maintain our platform
    infrastructure and provide ongoing maintenance, we apply a platform fee of 0.25%.
    To encourage a diversified investment strategy, we have waived the cost for fund
    investments, meaning the fund dealing fee is £0. For those trading individual
    equities, we charge a share dealing fee of £5.95 per transaction.


    Security and protection are central to our service. Your investments are protected
    by the Financial Services Compensation Scheme (FSCS), which provides coverage
    of up to £85,000 per person should the brokerage fail. However, it is important
    to remember that all investing carries inherent risks. The value of your investments
    can fall as well as rise, and you may get back less than you originally invested;
    this is the reality of capital at risk.


    Our service model is digital-first. We provide support via secure in-app messaging
    and email during UK business hours (GMT). While we provide a wealth of educational
    resources to help you navigate the markets, we are a self-directed platform. We
    provide no personal recommendations and no individual tax advice. We hold ourselves
    to a rigorous standard of care to ensure that any complex products available on
    the platform are appropriate for your specific needs.


    Whether you are starting your investment journey or transferring an existing portfolio
    to us, we provide a clear and accessible path to wealth creation with costs that
    are easy to understand and predict.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: product_sheet
  source_authority: official
