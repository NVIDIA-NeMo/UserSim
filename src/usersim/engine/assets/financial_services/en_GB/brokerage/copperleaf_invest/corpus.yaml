- id: f8be73cb-2a4f-563d-ba82-fa06100a7d0b
  title: Copperleaf Monthly Investing — recognising scams targeting this product
  body: 'As you explore the options for wealth creation, it is important to be aware
    of the specific fraud patterns that target regular investment plans. Copperleaf
    Monthly Investing is designed for consistent, long-term growth, and scammers often
    try to exploit this mindset by promising ''guaranteed'' results that are inconsistent
    with the realities of the market.


    Common red flags include unsolicited messages via social media or email claiming
    to be from Copperleaf Invest, promising ''guaranteed returns'' or ''risk-free''
    monthly yields. Please remember that the value of investments can fall as well
    as rise, and capital is at risk. Any communication promising a guaranteed profit
    is a hallmark of a scam.


    Another common tactic involves ''clone firms.'' Fraudsters may create a website
    or email address that looks nearly identical to ours to trick you into transferring
    your monthly contributions to an external account. We will never ask you to move
    your funds to a third-party account to ''unlock'' higher returns or to verify
    your identity via an external payment link.


    At Copperleaf Invest, security is paramount. We employ multi-factor authentication
    and rigorous identity checks. We will never ask you for your full password, your
    multi-factor authentication codes, or your full credit card details over the phone
    or via email.


    If you encounter a communication that feels suspicious, or if you have accidentally
    shared sensitive information, you must notify us immediately. Prompt reporting
    is essential to secure your account and limit potential liability. We recommend
    reviewing our general security protocols in Copperleaf Monthly Investing — fraud
    and unauthorised-activity protection for further guidance on keeping your assets
    safe.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: security_advisory
