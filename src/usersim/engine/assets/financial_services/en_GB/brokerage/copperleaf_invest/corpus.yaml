- id: 103b1024-ed73-5fd4-8d46-26595858d532
  title: Copperleaf Stocks and Shares ISA — fee schedule
  body: 'This schedule outlines the exact costs associated with maintaining and trading
    within a Copperleaf Stocks and Shares ISA. All fees are transparent and consistently
    applied to ensure fairness across our client base.


    - Platform Fee: 0.25% (Annual fee covering infrastructure and maintenance)

    - Share Dealing Fee: £5.95 (Per transaction for individual stocks and shares)

    - Fund Dealing Fee: £0 (Waived to encourage diversified investing)


    These fees are designed to be competitive and sustainable. Please note that while
    we waive the fund dealing fee, the 0.25% platform fee still applies to the total
    value of the assets held in the account, regardless of the investment type.'
