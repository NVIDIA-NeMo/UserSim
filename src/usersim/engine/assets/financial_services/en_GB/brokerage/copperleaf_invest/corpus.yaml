- id: 36c63eab-e13e-531f-b320-0d1804720d75
  title: Copperleaf General Investment Account — who it is best for and common use
    cases
  body: 'The Copperleaf General Investment Account is a flexible, taxable investment
    vehicle designed for UK residents. It serves as a professional gateway to wealth
    creation for those who require more versatility than a tax-wrapped account provides.


    This account is best suited for the following customers:


    - ISA Overflow Investors: For those who have already utilised their £20,000 annual
    ISA allowance for the current tax year, the Copperleaf General Investment Account
    provides a seamless way to continue investing without waiting for the next tax
    year to begin.

    - High-Liquidity Seekers: Investors who prefer an account without the specific
    restrictions or goal-orientations of a Lifetime ISA or Junior ISA will find the
    flexibility of this account ideal for general capital growth.

    - Diversification Strategists: Clients who wish to maintain a broad portfolio
    of assets across different tax environments.


    Key Financial Details:

    - Platform Fee: We charge a transparent platform fee of 0.25% to maintain our
    infrastructure.

    - Capital Gains Tax (CGT): Users should be mindful of the £3,000 capital gains
    allowance, which applies to profits made on the sale of assets.

    - Dividend Allowance: The account is subject to the £500 dividend allowance.


    Common Use Cases:

    - Long-term wealth building after filling a Stocks and Shares ISA.

    - Investing a lump sum that exceeds the annual ISA limits.

    - Testing a self-directed investment strategy before committing to a long-term
    tax-efficient wrapper.


    As with all investing, please remember that the value of investments can fall
    as well as rise and capital is at risk. We provide a platform for self-directed
    investing and educational resources, but we do not offer personal recommendations
    or individual tax advice.'
  domain: brokerage_investing
  product_category: general_investment_account
  document_type: product_sheet
  source_authority: official
