- id: 4ac94be6-3670-5d5b-802d-fc26b190d49b
  title: Copperleaf General Investment Account — eligibility and setup
  body: 'Who is eligible to open a Copperleaf General Investment Account?

    Our General Investment Accounts are available to UK residents who are seeking
    a flexible path to wealth creation. Because these accounts do not have the strict
    residency or age restrictions of some specialised ISAs, they are an accessible
    option for most adult residents.


    How do I set up my account?

    To get started, you simply need to provide us with your personal details and undergo
    our rigorous identity checks. Because security is paramount, full verification
    is mandatory before you can fund your account or perform any trades.


    Do I need to prove I''ve used my ISA allowance first?

    No. You can open a General Investment Account regardless of whether you have an
    ISA. Many of our clients use both—filling their ISA allowance first and then using
    this account for additional investments.'
