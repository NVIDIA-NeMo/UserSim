- id: 46213315-db61-58e4-bfd5-76fc4122fcb6
  title: Copperleaf Stocks and Shares ISA — fraud and unauthorised-activity protection
  body: 'At Copperleaf Invest, we believe that security is the foundation of trust.
    When comparing our Copperleaf Stocks and Shares ISA against other market alternatives,
    it is important to understand the rigorous safeguards we employ to protect your
    wealth from fraud and unauthorised activity.


    We employ a multi-layered security architecture designed to prevent unauthorised
    access. This begins with mandatory multi-factor authentication (MFA) for all account
    access, ensuring that a password alone is never sufficient to enter your account.
    Furthermore, we perform rigorous identity checks during onboarding and throughout
    the lifecycle of the account. We maintain a strict policy where full verification
    is mandatory before any state-changing action is performed; this includes processing
    withdrawals or altering sensitive account details. This friction is intentional,
    as it provides a critical barrier against social engineering and account takeover
    attempts.


    We also adhere strictly to FCA guidelines regarding the handling of fraudulent
    activity. If any suspicious pattern is detected, the activity is escalated immediately
    to our compliance team for investigation. While no system is entirely immune to
    risk, we provide the reassurance of FSCS protection, which covers up to £85,000
    per person should the brokerage fail.


    To keep your account secure, please be aware that we will never ask you to disclose
    your full password or MFA codes over the phone or via email. If you notice any
    transaction or account change that you did not authorise, you must notify us immediately
    via our secure in-app messaging or email. Prompt reporting is essential to our
    ability to mitigate losses and secure your assets. We approach all disputes with
    a commitment to fairness and transparency, providing a clear timeline for resolution
    and communicating every step of the process to you.


    For further information on the general protections we provide, you may wish to
    refer to Copperleaf Stocks and Shares ISA — regulatory disclosures.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 57343dd2-b4bb-5b45-8240-7b69f1f2455d
  title: Copperleaf Stocks and Shares ISA — account agreement
  body: 'This account agreement governs the relationship between Copperleaf Invest
    and the client regarding the Copperleaf Stocks and Shares ISA. By opening this
    account, the client agrees to the following binding terms.


    1. Fee Obligations

    The client agrees to pay a platform fee of 0.25%, which covers the essential infrastructure
    and maintenance of the account. Additionally, each trade in individual shares
    attracts a share dealing fee of £5.95. In line with our commitment to encouraging
    diversified investing, the fund dealing fee is currently £0. All fees are deducted
    from the account balance according to our standard billing cycle.


    2. Contribution Limits\The client is responsible for ensuring that contributions
    do not exceed the annual ISA allowance of £20,000 within a single tax year. While
    we provide tools to track contributions, the ultimate legal responsibility for
    adhering to HMRC limits rests with the client.


    3. Verification and Security\The client must undergo and maintain full identity
    verification. We reserve the right to pause any state-changing action, including
    the withdrawal of funds or the modification of account details, until such verification
    is successfully completed. Multi-factor authentication must remain enabled to
    ensure the security of the assets.


    4. Regulatory Framework\This account is strictly regulated by the FCA. The client
    acknowledges that the value of investments can fall as well as rise and that capital
    is at risk. Assets held within the account are protected by the FSCS up to a limit
    of £85,000 per person.


    5. Termination and Closure\Either party may terminate this agreement. The client
    may request to close the account at any time. Upon closure, all remaining holdings
    must be liquidated or transferred to another provider to preserve the tax-free
    status of the funds. We will provide a clear timeline for the settlement of funds
    and the final closing of the account.


    For details on how we communicate updates to these terms, please refer to Copperleaf
    Stocks and Shares ISA — change-of-terms policy.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 19141d40-4f88-5edb-827f-d164faeac489
  title: Copperleaf Stocks and Shares ISA — who it is best for and common use cases
  body: 'The Copperleaf Stocks and Shares ISA is designed as a primary tax-efficient
    vehicle for long-term growth, making it an ideal choice for UK residents who wish
    to build wealth without the burden of capital gains or dividend taxes on their
    investments.


    This product is best suited for:


    • Long-Term Wealth Builders: Those looking to utilise their £20,000 annual ISA
    allowance to grow a portfolio over several years or decades. Because the growth
    is tax-free, it is particularly effective for those in higher tax brackets.

    • Diversified Investors: Because we offer a fund dealing fee of £0, this account
    is perfect for individuals who prefer to spread their risk across various index
    funds and managed funds without being penalised by high transaction costs.

    • Cost-Conscious Investors: With a transparent and competitive platform fee of
    0.25%, this account suits those who prioritise a low-cost infrastructure to ensure
    more of their capital remains invested in the market.

    • Selective Share Traders: For those who occasionally trade individual companies,
    our share dealing fee of £5.95 provides a clear and predictable cost for each
    transaction.


    Common Use Cases:


    • Retirement Supplementing: Using the £20,000 annual limit to build a flexible
    pot of wealth alongside a pension.

    • General Wealth Accumulation: Moving funds from a General Investment Account
    into this ISA to shelter gains from the HMRC.

    • Regular Monthly Investing: Setting up a recurring contribution to benefit from
    pound-cost averaging while enjoying the tax-free benefits of the ISA wrapper.


    Regardless of the strategy, it is important to remember that the value of investments
    can fall as well as rise. For a complete overview of the account, please see Copperleaf
    Stocks and Shares ISA — overview.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 12ab85ae-3a81-53f2-87e8-8d1b4f1d5fa8
  title: Copperleaf Stocks and Shares ISA — share dealing charge explained
  body: 'Q: Why am I being charged for buying or selling shares in my ISA?


    A: While we aim for maximum transparency and low costs, trading individual stocks
    and shares involves specific exchange and execution costs. To cover these, we
    apply a share dealing fee of £5.95 per trade. This is a flat fee per transaction,
    regardless of the trade size.


    Q: Does the £5.95 fee apply to all investments in my account?


    No. The share dealing fee only applies to individual stocks and shares. If you
    are investing in funds, the fund dealing fee is £0, as we wish to encourage our
    customers to build diversified portfolios through fund investing.


    Q: How is this fee deducted?


    The £5.95 charge is typically deducted from your available cash balance at the
    time the trade is executed. For more details on all our costs, please see Copperleaf
    Stocks and Shares ISA — fee schedule.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: faq
  source_authority: official
