- id: 80965006-b0d2-5244-a6d0-d0b4c7de7139
  title: Copperleaf Stocks and Shares ISA — comparison vs. alternatives and when not
    to choose it
  body: 'The Copperleaf Stocks and Shares ISA is designed as the primary tax-efficient
    vehicle for long-term growth. However, it is not the right tool for every financial
    goal.


    Why choose the Copperleaf Stocks and Shares ISA?

    We provide a transparent cost structure and a broad range of investment options.
    The key advantage is the tax-free environment: all capital gains and dividends
    earned within the wrapper are exempt from tax, provided you stay within the £20,000
    annual allowance.


    Our Cost Structure:

    - Platform Fee: A transparent 0.25% fee covers our infrastructure and maintenance.

    - Share Dealing: Each share trade incurs a fee of £5.95.

    - Fund Dealing: We waive these fees (£0) to encourage you to build a diversified
    portfolio of funds.


    When NOT to choose this product:

    1. Short-term Cash Needs: Because this is an investment product, the value of
    your holdings can fall as well as rise, and your capital is at risk. If you cannot
    afford to lose money or need the funds within a few months, a cash savings account
    is more appropriate.

    2. First-Home Savings: If you are aged 18 to 39 and saving for a first home up
    to £450,000, the Lifetime ISA is often a better choice due to the 25% government
    bonus.

    3. Exhausted Allowances: If you have already contributed £20,000 to other ISAs
    this tax year, you cannot open or contribute to this account. In this case, our
    General Investment Account is the suitable alternative.


    Regardless of the product you choose, we ensure your peace of mind with FSCS protection
    of up to £85,000 per person if the brokerage fails.'
