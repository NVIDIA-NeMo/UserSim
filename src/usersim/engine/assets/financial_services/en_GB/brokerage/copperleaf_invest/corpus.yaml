- id: 949bd33d-9621-5069-a501-146371295fec
  title: Copperleaf Stocks and Shares ISA — a declined or blocked action
  body: 'Symptom: You attempted to make a contribution, process a withdrawal, or change
    your account details, but the action was declined or blocked.


    Likely Causes:

    - Incomplete Verification: The most common cause is a failure to complete the
    mandatory identity checks. We require full verification before any state-changing
    action is performed.

    - Allowance Breach: If you are attempting to deposit funds, the action may be
    blocked if it would cause you to exceed the £20,000 annual ISA allowance.

    - Compliance Hold: Our compliance team may have placed a temporary hold on the
    account to investigate potentially fraudulent activity in accordance with FCA
    guidelines.

    - Insufficient Funds: For withdrawals or trades, there may be insufficient settled
    cash in the account to cover the transaction and the applicable fees (e.g., the
    £5.95 share dealing fee).


    What to check in order:

    1. Verification Status: Check if you have recently updated your security details
    or if your multi-factor authentication is active. If not, ask us to restart the
    verification process.

    2. Contribution Total: Review your total contributions for the current tax year
    to ensure you are within the £20,000 limit.

    3. Available Cash: Ensure you have enough cash to cover both the investment amount
    and the associated fees.


    How to fix:

    - If verification is the issue, provide the requested identity documents and complete
    the MFA challenge during our conversation.

    - If you have exceeded your allowance, you will need to move further investments
    into a different account, such as a General Investment Account.


    When to escalate:

    If all the above checks are clear and your action is still blocked, we will escalate
    the matter to our operations management team. They will conduct a full review
    and provide a resolution timeline. You will receive a notification once the block
    has been reviewed and either lifted or explained in detail.'
