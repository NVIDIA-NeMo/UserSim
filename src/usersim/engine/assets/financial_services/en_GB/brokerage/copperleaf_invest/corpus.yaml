- id: 12808b70-70a6-50b8-8454-67b769f52376
  title: Copperleaf Lifetime ISA — make a change or update
  body: 'If you need to update your personal details or make changes to how your Copperleaf
    Lifetime ISA is managed, please follow these steps to ensure your account remains
    secure.


    **Prerequisites**

    Before requesting a change, ensure you have access to the mobile device associated
    with your multi-factor authentication (MFA) and a valid form of government-issued
    identification if you are updating your legal name or residential address.


    **Step 1: Submit the Change Request**

    Tell us exactly which detail you wish to update (e.g., change of residential address,
    update to email, or change of beneficiary). We will then initiate the verification
    process.


    **Step 2: Complete Identity Verification**

    Because we perform rigorous identity checks for all state-changing actions, we
    will send an MFA challenge to your registered device. You must provide the correct
    code to proceed. If you are updating your name or address, we will ask you to
    provide a digital copy of a supporting document (such as a utility bill or passport).


    **Step 3: Review and Confirm**

    Once your identity is verified, we will present the updated information for your
    final confirmation. We will double-check that the changes do not conflict with
    your eligibility as a UK resident.


    **Step 4: Final Acknowledgement**

    After you confirm, we will update our records and send a confirmation notice via
    secure in-app messaging. You will now see the updated details reflected in your
    account overview.


    For further guidance on keeping your account safe during and after this process,
    please see Copperleaf Lifetime ISA — account security best practices.'
