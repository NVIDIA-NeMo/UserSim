- id: 802f4a35-c712-52da-bff0-c49a62b0251e
  title: Copperleaf Junior ISA — access or login problems
  body: 'If you are unable to access your account to manage your child''s Copperleaf
    Junior ISA, please follow these troubleshooting steps.


    Symptom: ''Incorrect credentials'' or ''Account locked'' error when attempting
    to log in via secure messaging or email.


    Likely Causes:

    - Incorrect password or expired session.

    - Failed multi-factor authentication (MFA) attempts leading to a security lock.

    - Outdated browser cache or app version.


    What to Check and Fix:

    1. Verify Credentials: Ensure you are using the email address registered to the
    account. If you have forgotten your password, request a secure reset link.

    2. Check MFA Device: Ensure the device used for multi-factor authentication is
    connected to the internet and that you are checking the correct app or email for
    the code.

    3. Clear Cache: Clear your browser cookies and cache, or ensure your Copperleaf
    Invest app is updated to the latest version available in the UK app store.


    Escalation Process:

    If you have attempted the above and remain locked out, tell us your account details
    and the specific error code you are seeing. We will then perform a manual identity
    check to verify your ownership of the account.


    Once verified, we will reset your access. If the lockout was caused by suspected
    fraudulent activity, we will escalate the case immediately to our compliance team.
    You will receive a notification via your secondary contact method once the account
    is securely reopened. This process typically takes 1 to 3 business days during
    UK business hours (GMT).'
  domain: brokerage_investing
  product_category: junior_isa
  document_type: troubleshooting
