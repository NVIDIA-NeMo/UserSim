- id: 28f61aa1-17cb-50da-8a8b-548a5bc6b0fa
  title: Copperleaf Monthly Investing — access or login problems
  body: 'If you are experiencing difficulties accessing your account to manage your
    monthly investments, please follow this troubleshooting guide. We understand that
    consistent access is vital for monitoring your wealth creation.


    Symptom: ''I cannot log in to my account'' or ''My MFA code is not being accepted.''


    Likely Causes:

    1. Outdated application version preventing secure handshake.

    2. Desynchronised MFA token or expired session.

    3. Account lock due to multiple incorrect password attempts.


    What to check in order:

    1. Check your connection: Ensure you have a stable internet connection.

    2. Update the app: Verify you are using the latest version of the Copperleaf Invest
    app.

    3. Check your MFA device: Ensure the device providing the code is synced to the
    correct time zone.


    How to resolve:

    If the issue persists, ask us to trigger a secure identity re-verification. We
    will guide you through a series of rigorous identity checks to confirm you are
    the account holder. Once verified, we can reset your MFA settings or unlock your
    account.


    When to escalate:

    If you suspect your login problems are the result of unauthorised access attempts
    or a security breach, tell us immediately. We will escalate the matter to our
    compliance team. We will then secure your funds, review the access logs, and provide
    you with a timeline for full resolution in accordance with FCA guidelines.


    Once access is restored, we recommend reviewing your monthly investment settings
    to ensure your £25 minimum contribution is still active and your £0 regular dealing
    fee is being applied correctly. If you are comparing our access stability with
    other providers, you may also be interested in Copperleaf Monthly Investing —
    change-of-terms policy.'
