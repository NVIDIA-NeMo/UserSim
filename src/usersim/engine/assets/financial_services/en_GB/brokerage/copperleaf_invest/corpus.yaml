- id: 1a9bd80f-25b6-55be-8239-9ee08b438524
  title: Copperleaf Lifetime ISA — account security best practices
  body: 'At Copperleaf Invest, we believe that the security of your long-term savings
    is paramount. Because the Copperleaf Lifetime ISA is often used for critical milestones—such
    as purchasing a first home up to £450,000 or preparing for retirement—it is a
    high-value target for fraudulent activity. We urge you to adhere to the following
    security best practices to protect your capital.


    **Multi-Factor Authentication (MFA)**

    We employ multi-factor authentication as a mandatory layer of security. Please
    ensure that your contact details are always up to date so that authentication
    codes reach you promptly. Never share these codes with anyone, including individuals
    claiming to be from Copperleaf Invest.


    **Verification for State-Changing Actions**

    To prevent unauthorised access, we perform rigorous identity checks before any
    state-changing action is processed. This includes, but is not limited to, processing
    withdrawals or altering your account details. If you receive a notification for
    a verification check that you did not initiate, notify us immediately via secure
    in-app messaging.


    **Recognising Fraudulent Patterns**

    Be vigilant against ''phishing'' attempts. We will never ask you to provide your
    full password or MFA codes via email. Any request to move your funds to a ''safe
    account'' is a sign of fraud. Remember, your funds are protected by the FSCS for
    up to £85,000 per person if the brokerage fails, but this does not cover losses
    resulting from compromised personal security credentials.


    **Immediate Action**

    If you suspect your account has been compromised or you notice any unauthorised
    transactions, report it to us immediately. Fraudulent activity is escalated to
    our compliance team and handled in strict accordance with FCA guidelines. The
    sooner a breach is reported, the more effective our recovery and mitigation processes
    can be.


    By following these guidelines and utilising our secure digital-first support model,
    you can ensure your path to wealth creation remains secure and transparent.'
  domain: brokerage_investing
  product_category: lifetime_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: 2a1f38a2-6f47-59cb-aa4a-19ba9c29600b
  title: Copperleaf Lifetime ISA — change-of-terms policy
  body: 'This document outlines the policy governing changes to the terms and conditions
    of the Copperleaf Lifetime ISA. We are committed to transparency in our cost structures
    to ensure our clients can plan their long-term financial goals with confidence.


    **Amendments to Fees and Limits**

    We reserve the right to amend our pricing model to ensure the long-term sustainability
    of the platform. This includes the 0.25% platform fee used for infrastructure
    and maintenance. Should we propose a change to this fee, we will provide you with
    a minimum of 30 days'' notice via your registered email address and a secure in-app
    notification.


    **Statutory and Regulatory Changes**

    As the Copperleaf Lifetime ISA is a government-backed scheme, certain terms are
    dictated by UK legislation. This includes the £4,000 annual contribution limit
    and the 25% government bonus. Any changes to these figures mandated by the government
    will be applied to your account immediately upon the legal effective date, although
    we will endeavour to provide educational updates via our knowledge base as soon
    as details are confirmed.


    **Withdrawal and Penalty Clauses**

    The terms regarding the 25% withdrawal charge for unauthorised withdrawals are
    binding. This charge is designed to preserve the intent of the account (first
    home purchase up to £450,000 or retirement). Changes to the conditions under which
    a withdrawal is deemed ''authorised'' are governed by FCA and government guidelines.


    **Agreement Termination**

    You may close your account at any time; however, we remind you that unauthorised
    withdrawals trigger the 25% charge. We may terminate this agreement if we identify
    a breach of our security protocols or if we are unable to satisfy our regulatory
    identity verification requirements.


    **Notice of Changes**

    All formal changes to the account agreement will be communicated in writing. Continued
    use of the account following the notice period constitutes acceptance of the revised
    terms. We suggest reviewing your account agreement periodically to stay informed
    of any updates to our service model or compliance posture.'
