- id: 030e186f-bdf3-5e5b-be19-c19a8790b963
  title: Copperleaf General Investment Account — how rates are tiered and applied
  body: 'The Copperleaf General Investment Account does not utilise a tiered pricing
    structure. To ensure maximum transparency and fairness for all our clients, we
    apply a single, flat rate for platform maintenance.


    Platform Fee: 0.25%


    Application: This fee applies to the total market value of all assets held within
    the account. There are no minimum balance requirements to qualify for this rate,
    and there are no caps or discounts for higher balance tiers.


    Calculation: The 0.25% fee is calculated based on the average daily balance of
    the account and is deducted periodically. This fee covers all essential infrastructure,
    security maintenance, and digital support services. Because this rate is flat,
    you can easily project your costs as your portfolio grows without worrying about
    shifting into different fee brackets.'
