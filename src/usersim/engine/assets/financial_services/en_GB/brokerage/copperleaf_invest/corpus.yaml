- id: 6060da7d-3f51-5642-81ad-03cc4b39c3a8
  title: Copperleaf General Investment Account — annual platform fee explained
  body: 'How is the annual platform fee calculated and what does it cover?

    We charge a platform fee of 0.25% on the total value of the assets held within
    your Copperleaf General Investment Account. This fee covers the ongoing costs
    of our digital infrastructure, security maintenance, and the operational support
    required to keep your account running smoothly. It is designed to be transparent
    and sustainable, ensuring we can provide a high-standard service without hidden
    charges.


    When is the platform fee deducted from my account?

    The 0.25% fee is accrued daily and typically deducted from your account on a periodic
    basis. This means the fee adjusts automatically as the value of your investments
    fluctuates, ensuring you only pay for the service based on your current holding.


    Can I waive this fee if I have other accounts with Copperleaf Invest?

    The platform fee of 0.25% is a standard charge for the maintenance of the General
    Investment Account. For further details on how our pricing compares across our
    product range, you may wish to review the Copperleaf General Investment Account
    — fee schedule.'
