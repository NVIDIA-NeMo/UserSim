- id: e5bec93e-a335-5b2c-b85d-cae2ee9e4717
  title: Copperleaf General Investment Account — cost and charges
  body: 'How much does it cost to maintain a Copperleaf General Investment Account?

    We charge a transparent platform fee of 0.25%. This fee ensures the long-term
    sustainability of our infrastructure and provides you with a reliable, secure
    environment for your investments.


    Are there fees for buying or selling funds?

    No. To encourage you to build a diversified portfolio, we have set the fund dealing
    fee at £0.


    Are there any other hidden costs?

    We pride ourselves on transparency. Beyond the 0.25% platform fee, there are no
    hidden maintenance charges. However, please remember that the value of your investments
    can fall as well as rise, and you may get back less than you originally invested.'
