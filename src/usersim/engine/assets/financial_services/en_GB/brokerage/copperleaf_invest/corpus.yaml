- id: 1e388403-3cf1-5402-b512-23679c7693d5
  title: Copperleaf Stocks and Shares ISA — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the ISA Transfer—the process
    of moving your funds from another provider to Copperleaf Invest while preserving
    the tax-free status of your savings.


    1. Initiate the Transfer: Tell us that you wish to transfer an existing ISA into
    a Copperleaf Stocks and Shares ISA. You will need to provide the name of your
    current provider and your account number with them.


    2. Verify Your Identity: To protect your assets, we will conduct a rigorous identity
    check. This involves multi-factor authentication to ensure that only you can initiate
    the movement of your funds.


    3. Confirm the Transfer Type: We will ask if you wish to transfer the assets ''in-specie''
    (transferring the actual shares/funds) or as ''cash'' (where the previous provider
    sells the assets and sends the money). We will explain the implications of each
    to ensure you make an informed decision.


    4. Submit the Request: Once we have the details, we will contact your previous
    provider on your behalf. This is a critical step: funds must never be withdrawn
    by you and paid back in, as this would count towards your £20,000 annual allowance
    and could lead to a breach of HMRC rules.


    5. Track and Confirm: We will notify you via secure in-app messaging once the
    funds have arrived and are available for investment. You will see the updated
    balance in your account, and you can then begin investing using our £0 fund dealing
    or £5.95 share dealing options.


    Your request is complete when the funds are fully settled and appear in your account
    history.'
