- id: ebafe322-f2fe-5dfd-98c1-97ae574a0ca9
  title: Regulatory notes for Investing
  body: "Copperleaf Invest is strictly regulated by the Financial Conduct Authority\
    \ (FCA). We adhere to all fair treatment and data privacy standards to ensure\
    \ our clients are protected and treated equitably.\n\n**Risk Disclosure**\nInvesting\
    \ involves risk. We clearly communicate to all clients that the value of investments\
    \ can fall as well as rise, and capital is at risk. This means there is an inherent\
    \ risk that the value of an investment can decrease, and an investor may get back\
    \ less than they originally invested.\n\n**FSCS Protection**\nIn the event that\
    \ the brokerage fails, clients are protected by the Financial Services Compensation\
    \ Scheme (FSCS). This protection is available for up to £85,000 per person.\n\n\
    **Advice and Standard of Care**\nWe maintain a strict boundary regarding investment\
    \ advice. Copperleaf Invest provides a platform for self-directed investing and\
    \ offers educational materials to help clients make informed decisions. However,\
    \ we do not provide: \n1. Personal investment recommendations tailored to an individual's\
    \ specific financial circumstances.\n2. Individual tax advice.\n\nDespite this\
    \ self-directed model, we hold ourselves to a high standard of care. We ensure\
    \ that complex products are appropriate for the client's needs before they are\
    \ made available for trade, maintaining the integrity of our mid-market positioning.\n\
    \n**Security and Verification**\nSecurity is paramount to our operations. We employ\
    \ multi-factor authentication and rigorous identity checks. Full verification\
    \ is mandatory before any state-changing action is performed, such as processing\
    \ withdrawals or altering account details. All fraudulent activity is escalated\
    \ immediately to our compliance team and handled in accordance with FCA guidelines.\n\
    \nFor a full breakdown of our transparent costs, please refer to Institution-wide\
    \ fees and charges."
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: e89fd177-7731-5bda-a1cf-5e12d3fcde12
  title: When to use get_positions
  body: 'The `get_positions` tool is used to retrieve a comprehensive list of all
    current holdings and assets held within a customer''s specific account. Agents
    must use this tool whenever a customer requests an update on their portfolio value,
    asks for a list of their current investments, or needs to verify the quantity
    of a specific asset before placing a trade.


    **Procedure for retrieving positions:**


    1.  **Verify Identity:** Before accessing any account data, the agent must perform
    a full identity check using the `verify_identity` tool to ensure the requester
    is the authorised account holder.

    2.  **Resolve Account ID:** Use the `get_accounts` tool to retrieve the unique
    account identifier associated with the customer (typically by providing the last
    four digits of the account number provided by the customer).

    3.  **Execute Retrieval:** Once the account ID is confirmed, call the `get_positions`
    tool using that identifier.

    4.  **Communicate Results:** Provide the customer with the current holdings as
    returned by the tool. If the customer is asking about a specific asset, confirm
    the exact quantity and current position.


    Agents must not rely on cached data or previous conversation turns to report positions;
    the tool must be called in real-time to ensure accuracy. For technical details
    on this tool, see get_positions tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: copperleaf_invest
- id: 60738fdc-bfc1-5b46-a82d-c4e11c7b3ea6
  title: get_positions tool reference
  body: 'The `get_positions` tool allows agents to retrieve the current investment
    holdings for a specific account.


    **Tool Signature:** `get_positions(account_id: string)`


    **Arguments:**

    *   `account_id`: The unique identifier for the client''s investment account.
    This value is obtained by the agent via the `get_accounts` tool.


    **Effect:**

    Returns a detailed list of all assets, symbols, and quantities currently held
    in the specified account.


    **Agent Execution:**

    The agent performs this action by calling the tool directly within the conversation
    interface after the customer''s identity has been verified. The agent does not
    redirect the customer to a portal to view their positions.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: copperleaf_invest
- id: bfa620e2-e4b5-53b0-b0f7-e69d59742b34
  title: When to use place_trade
  body: "The `place_trade` tool is the authoritative mechanism for executing the purchase\
    \ or sale of assets within a customer's account. This tool should be used when\
    \ a customer provides a clear instruction to buy or sell a specific security.\n\
    \n**Procedure for placing a trade:**\n\n1.  **Verify Identity:** Use the `verify_identity`\
    \ tool to confirm the customer's identity. Full verification is mandatory before\
    \ any state-changing action.\n2.  **Resolve Account ID:** Use the `get_accounts`\
    \ tool to determine the correct account identifier for the trade.\n3.  **Confirm\
    \ Trade Details:** The agent must explicitly confirm the following with the customer:\n\
    \    *   The asset symbol to be traded.\n    *   The quantity of shares or units.\n\
    \    *   The order type (e.g., buy or sell).\n4.  **Check Positions (Optional):**\
    \ If the customer is selling, the agent should use `get_positions` to ensure the\
    \ customer holds sufficient units of the asset.\n5.  **Execute Trade:** Call the\
    \ `place_trade` tool with the verified account ID, symbol, quantity, and order\
    \ type.\n6.  **Confirmation:** Inform the customer that the trade has been placed.\
    \ \n\nAgents must remember that they cannot provide personal recommendations on\
    \ which assets to trade. For tool specifications, refer to place_trade tool reference."
  domain: brokerage_investing
  product_category: procedure
