- id: 789f6142-1126-5b6d-b6df-4f4113393f1c
  title: Copperleaf Stocks and Shares ISA — when to switch or upgrade
  body: 'This guidance is for support agents assisting customers who are evaluating
    whether to move their funds or open additional accounts.


    The primary trigger for switching or adding a new account is the exhaustion of
    the ISA allowance. Once a customer has contributed the full £20,000 for the tax
    year into their Copperleaf Stocks and Shares ISA, they can no longer add funds
    to this tax-efficient wrapper.


    When to recommend a General Investment Account (GIA):

    If a customer wishes to continue investing but has reached the £20,000 limit,
    the GIA is the appropriate next step. While the ISA offers tax-free growth, the
    GIA provides a flexible option for those who have exhausted their allowances,
    though it is subject to capital gains and dividend allowances.


    When to suggest a Lifetime ISA (LISA):

    If the customer is aged between 18 and 39 and is saving specifically for a first
    home (up to £450,000) or retirement, they may wish to allocate part of their savings
    to a Lifetime ISA to benefit from the 25% government bonus, rather than placing
    everything in the Stocks and Shares ISA.


    Key Comparison for Agents:

    - Stocks and Shares ISA: Best for general long-term tax-free growth. Limit: £20,000/year.

    - GIA: Best for flexibility after ISA limits are hit. No annual contribution limit.

    - LISA: Best for first-time buyers/retirement. Specific age and use-case restrictions.


    For more on the GIA, see Copperleaf General Investment Account — overview.'
