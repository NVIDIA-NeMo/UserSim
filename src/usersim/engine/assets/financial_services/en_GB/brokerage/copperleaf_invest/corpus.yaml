- id: c278c48b-e6ec-5a26-9951-6b926eac46b3
  title: Copperleaf Monthly Investing — limits, restrictions, and edge cases
  body: 'This document provides the necessary operational boundaries and constraints
    for Copperleaf Monthly Investing to ensure customer queries are handled with precision.


    **Core Financial Limits**

    - **Minimum Monthly Contribution:** The absolute minimum amount a client can commit
    to a regular investment plan is £25. Requests to set up plans below this threshold
    must be declined.

    - **Dealing Fees:** Regular dealing fees for this product are £0, meaning there
    is no charge for the act of executing the monthly trade.

    - **Platform Fee:** A platform fee of 0.25% applies to the total value of the
    assets held, covering infrastructure and maintenance. This is separate from the
    dealing fee.


    **Operational Restrictions**

    - **Verification Requirements:** Full identity verification is mandatory before
    any state-changing action. This includes altering the monthly investment amount,
    changing the linked bank account, or processing withdrawals.

    - **Payment Failures:** If a monthly contribution fails due to insufficient funds,
    the plan remains active but the specific month''s investment is missed. We do
    not automatically ''catch up'' by doubling the next payment unless explicitly
    requested by the client.

    - **Wrapper Compatibility:** Monthly investing can be integrated with tax-efficient
    wrappers. Agents should refer clients to the appropriate guide, such as Copperleaf
    Stocks and Shares ISA — overview, to ensure they are utilising their annual allowances
    correctly.


    **Edge Cases and Compliance**

    - **FSCS Protection:** Clients should be reassured that their funds are protected
    by the Financial Services Compensation Scheme (FSCS) up to £85,000 per person
    per firm if the brokerage fails.

    - **Risk Warning:** In all discussions regarding limits and returns, agents must
    reiterate that the value of investments can fall as well as rise and capital is
    at risk.'
  domain: brokerage_investing
  product_category: monthly_investing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: copperleaf_invest
- id: c63edecf-617a-5cbb-a11c-bc59b3299aad
  title: Copperleaf Monthly Investing — eligibility and setup
  body: '### Who is eligible to use Copperleaf Monthly Investing?

    Copperleaf Monthly Investing is available to all UK residents who hold a verified
    account with us. You must be at least 18 years of age and have passed our rigorous
    identity and security checks.


    ### What is required to set up a monthly investment plan?

    To begin, you will need to identify the asset or fund you wish to invest in and
    specify a monthly contribution. The minimum monthly amount required to start a
    plan is £25. You must also have a linked UK bank account to facilitate the automated
    transfers.


    ### How long does the setup process take?

    Once you provide the investment details and the monthly amount, we will verify
    the instructions. Most plans are activated within one business day, provided your
    account verification is complete. For a detailed walkthrough of the process, please
    see Copperleaf Monthly Investing — resolve a common request end-to-end.'
