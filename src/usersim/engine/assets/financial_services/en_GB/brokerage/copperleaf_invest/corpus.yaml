  mentions_tools:
  - update_contact_info
  institution_id: copperleaf_invest
- id: ddf6c0d2-db7b-5150-b57d-23a22f1d4bf2
  title: When to use get_statements
  body: 'We believe in total transparency regarding cost structures and investment
    performance. Providing customers with their statements is a key part of our service
    model, allowing them to track their progress towards wealth creation.


    **Procedure for Retrieving Statements**


    1. **Verify Identity**: Although retrieving a statement is a read-only action,
    it involves sensitive financial data. The agent must verify the customer''s identity
    before proceeding.

    2. **Resolve Account**: Use the `get_accounts` tool to find the correct account
    identifier for the portfolio the customer is inquiring about.

    3. **Determine the Period**: Ask the customer for the specific date range they
    require. This could be a monthly statement, a quarterly summary, or a full tax-year
    statement to help them monitor their ISA allowances.

    4. **Call the Tool**: Execute the `get_statements` tool using the account identifier
    and the specified start and end dates.

    5. **Delivery**: Inform the customer that the statements are being generated and
    will be delivered via the secure in-app messaging system or encrypted email.


    Agents should remind customers that statements provide a clear view of our competitive
    pricing, including the 0.25% platform fee, and the lack of fund dealing fees,
    which we waive to encourage diversified investing. For technical details, see
    the get_statements tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: copperleaf_invest
- id: 5b3280f7-760a-534f-b5fc-b03c98b935e2
  title: get_statements tool reference
  body: 'The get_statements tool retrieves historical financial statements for a specific
    account. The agent performs this action by calling the tool directly to provide
    the customer with their records.


    **Signature**

    `get_statements(account_id: string, start_date: string, end_date: string)`


    **Arguments**

    - `account_id`: The internal system identifier for the account.

    - `start_date`: The beginning of the period for which statements are requested
    (YYYY-MM-DD).

    - `end_date`: The end of the period for which statements are requested (YYYY-MM-DD).


    **Effect**

    Calling this tool generates a set of official statements covering the requested
    period. These documents include all trades, fees (such as the 0.25% platform fee),
    and the final balance of the account, formatted for UK residents.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: copperleaf_invest
- id: b5b86f17-283d-5d26-8b05-dcfe6db2e160
  title: When to use set_alerts
  body: 'To help our customers stay engaged with their self-directed investing, we
    offer a flexible alerting system. This allows customers to be notified of specific
    account movements or market triggers, providing them with a clear and accessible
    way to manage their wealth.


    **Procedure for Setting Alerts**


    1. **Verify Identity**: As setting alerts is a state-changing action that alters
    account preferences, the agent must first verify the customer''s identity through
    our secure multi-factor authentication process.

    2. **Account Selection**: Identify the relevant account using the `get_accounts`
    tool. If the customer wants alerts across all their tax-efficient wrappers, the
    agent must set the alerts for each account individually.

    3. **Define Alert Criteria**: Confirm with the customer what trigger they wish
    to set. This might be a balance threshold, a specific trade confirmation, or a
    reminder for their annual £20,000 ISA allowance contribution.

    4. **Call the Tool**: Execute the `set_alerts` tool using the account identifier
    and the customer''s specific alert preferences.

    5. **Confirm Activation**: Reassure the customer that the alert is now active
    and will be delivered via their preferred digital-first channel (in-app or email).


    We hold ourselves to a high standard of care to ensure our customers are informed
    but not overwhelmed. For further technical details on how to implement these notifications,
    refer to the set_alerts tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: copperleaf_invest
- id: 21da1298-c0a9-509d-bbba-b1af35cab5e2
  title: set_alerts tool reference
  body: 'The `set_alerts` tool allows agents to configure automated notifications
    for a customer''s account. The agent performs this action by calling the tool
    directly within the secure messaging interface; customers cannot be directed to
    an external portal for this specific setup.


    **Tool Signature and Arguments**

    To execute this action, the agent must provide the following arguments:

    - **alert_type**: The category of notification the customer wishes to receive
    (e.g., price movements, balance thresholds, or trade confirmations).

    - **trigger_value**: The specific numerical value or condition that will activate
    the alert (e.g., a specific share price or a balance falling below a certain amount).

    - **notification_preference**: The chosen channel for the alert, such as secure
    in-app messaging or email.


    **Effect**

    Once called, the tool updates the customer''s account preferences in real-time.
    The customer will then receive notifications according to the specified triggers.
    This ensures the customer can remain informed about their investments without
    manually checking the platform, supporting our commitment to a clear and accessible
    path to wealth creation.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: copperleaf_invest
- id: e0b756b5-10e3-5ce3-b09e-5c846742f387
  title: When to use transfer_funds
  body: 'The `transfer_funds` tool is used exclusively for moving liquid cash between
    different accounts held by the same customer within Copperleaf Invest. This is
    an internal movement of funds and does not constitute a withdrawal to an external
    bank or a new deposit. Because this action changes the state of the account, we
    adhere to a strict security and verification posture to protect our customers''
    assets.


    **Agent Procedure**


    1. **Identity Verification**: The agent must first ensure the customer''s identity
    is fully verified by calling the `verify_identity` tool. No fund movements may
    be initiated until this step is completed successfully.

    2. **Account Resolution**: If the customer refers to accounts by their last four
    digits or general names (e.g., ''my ISA''), the agent must call `get_accounts`
    to retrieve the unique account identifiers (account IDs) required for the tool.

    3. **Request Clarification**: The agent must confirm the exact amount to be transferred
    and the specific source and destination accounts. For example, transferring cash
    from a Copperleaf General Investment Account to a Copperleaf Stocks and Shares
    ISA.

    4. **Risk Disclosure**: The agent should remind the customer that while cash transfers
    are stable, the value of the investments they may subsequently purchase with those
    funds can fall as well as rise, and capital is at risk.

    5. **Execution**: Once the customer has explicitly confirmed the details, the
    agent calls the `transfer_funds` tool using the resolved account IDs and the confirmed
    amount.

    6. **Confirmation**: The agent must provide the customer with a confirmation that
    the transfer has been processed and advise them to check their updated balances
    via `get_positions`.


    Our commitment to transparency means we ensure no hidden fees are applied to these
    internal transfers. We maintain this standard of care to ensure that our mid-market
    brokerage remains a reliable environment for long-term wealth creation. For details
    on the technical implementation of this action, agents should refer to the transfer_funds
    tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: copperleaf_invest
- id: a23ce7cd-6acc-5a32-ab17-69efc09db85c
  title: transfer_funds tool reference
  body: 'The `transfer_funds` tool is the authoritative mechanism for moving cash
    between a customer''s internal accounts. The agent performs this action by calling
    the tool directly after the customer''s identity has been verified.


    **Tool Signature and Arguments**

    To successfully process a transfer, the agent must provide:

    - **source_account_id**: The unique identifier of the account from which funds
    are being moved (obtained via `get_accounts`).

    - **destination_account_id**: The unique identifier of the account receiving the
    funds (obtained via `get_accounts`).

    - **amount**: The exact sum of money to be transferred, specified in GBP (£).


    **Effect**

    Calling this tool results in an immediate debit from the source account and a
    corresponding credit to the destination account. The transaction is logged in
    the customer''s history for transparency. This tool is designed for internal movements
    only; it cannot be used to send funds to third parties or external bank accounts.
    All internal transfers are handled securely in accordance with FCA guidelines
    to ensure the integrity of the customer''s holdings.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: copperleaf_invest
- id: 7c82e3d9-93d7-51b7-a56a-23b5bf9dd222
  title: When to use cancel_order
  body: 'The `cancel_order` tool is used when a customer wishes to void a trade request
    that has been placed but not yet executed. Due to the volatility of financial
    markets, timing is critical. We approach these requests with fairness and transparency,
    provided the order is still in a ''pending'' or ''open'' state.


    **Agent Procedure**


    1. **Identity Verification**: The agent must call the `verify_identity` tool.
    Because cancelling an order is a state-changing action, full verification is mandatory
    before proceeding.

    2. **Order Identification**: The agent must identify the specific order the customer
    wishes to cancel. If the customer does not have the order reference, the agent
    should use `get_order_status` to find the relevant pending trade.

    3. **Status Check**: The agent must confirm that the order has not already been
    filled. Once a trade is executed, it cannot be cancelled, only reversed by placing
    an opposing trade.

    4. **Confirmation of Intent**: The agent must explicitly confirm with the customer
    that they wish to cancel the entire order and explain that this may mean they
    miss out on a specific price point.

    5. **Execution**: The agent calls the `cancel_order` tool using the specific order
    identifier.

    6. **Final Verification**: After the tool is called, the agent should verify the
    updated status of the order using `get_order_status` and inform the customer that
    the cancellation is complete.


    If the order cannot be cancelled because it has already moved to an ''executed''
    state, the agent must explain this clearly and professionally, avoiding jargon.
    If the customer disputes the inability to cancel, the agent should follow the
    defined escalation path to operations management for complex disputes, as outlined
    in our service model. For more information on the tool''s requirements, see the
    cancel_order tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: copperleaf_invest
- id: f150ab9f-99e1-5b65-8d88-b342ff9761da
  title: cancel_order tool reference
  body: 'The `cancel_order` tool is used to terminate a pending trade before it is
    executed by the market. The agent performs this action by calling the tool directly;
    the customer cannot cancel orders via the support chat without agent intervention
    if the order is in a restricted state.


    **Tool Signature and Arguments**

    To cancel a trade, the agent must provide:

    - **order_id**: The unique system identifier for the specific trade request. This
    is typically retrieved using the `get_order_status` tool or provided by the customer
    from their order history.


    **Effect**

    Calling this tool sends a request to the trading desk to void the specified order.
    If successful, the order status is updated to ''Cancelled'', and any funds or
    shares that were ''blocked'' or reserved for the trade are immediately released
    back into the customer''s available balance. If the order has already been filled,
    the tool will return an error indicating that the order is no longer eligible
    for cancellation.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: copperleaf_invest
- id: 66eebdad-2181-5fb9-bc03-646dfbbfe9b6
  title: When to use get_order_status
  body: "The `get_order_status` tool is used to provide customers with real-time updates\
    \ on the progress of their trades. Whether a customer is checking if a buy order\
    \ for a Stocks and Shares ISA has been filled or if a sell order in a General\
    \ Investment Account is still pending, this tool provides the necessary transparency.\n\
    \n**Agent Procedure**\n\n1. **Identity Verification**: Before disclosing any specific\
    \ order details, the agent must call the `verify_identity` tool to ensure the\
    \ customer is the authorised account holder.\n2. **Request Order Details**: The\
    \ agent should ask the customer for the order reference number. If the customer\
    \ is unsure, the agent can use `get_accounts` to identify the account and then\
    \ search for recent orders.\n3. **Execution**: The agent calls the `get_order_status`\
    \ tool using the order identifier.\n4. **Information Delivery**: The agent conveys\
    \ the status to the customer using clear, professional language. Possible statuses\
    \ include:\n    - **Pending**: The order has been received but not yet executed.\n\
    \    - **Filled**: The trade has been completed successfully.\n    - **Cancelled**:\
    \ The order was voided.\n    - **Rejected**: The order could not be processed\
    \ (e.g., due to insufficient funds).\n5. **Additional Guidance**: If the order\
    \ was rejected, the agent should explain the reason clearly (e.g., \"insufficient\
    \ funds to cover the trade and the applicable fees\") and guide the customer on\
    \ how to resolve it, such as by using the `deposit_funds` tool.\n\nWe operate\
    \ a digital-first support model, and providing immediate, accurate status updates\
    \ is key to building trust. If a customer is confused about why an order is taking\
    \ longer than expected, the agent should provide a reassuring explanation and,\
    \ if necessary, escalate the query to operations management."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: copperleaf_invest
- id: f830801c-5ffd-5433-9112-923dfc02eafc
  title: get_order_status tool reference
  body: 'The `get_order_status` tool allows agents to retrieve the current state of
    a specific trade request. The agent performs this action by calling the tool directly
    to provide the customer with an accurate update.


    **Tool Signature and Arguments**

    To retrieve the status of a trade, the agent must provide:

    - **order_id**: The unique identifier for the trade in question. This is the primary
    key used to locate the transaction within the trading system.


    **Effect**

    The tool returns the current status of the order, the timestamp of the last status
    change, and the execution price if the order has been filled. This provides the
    agent with the exact data needed to inform the customer. It is a read-only tool
    and does not alter the state of the order or the account balance. This tool is
    essential for maintaining the transparency and clarity that Copperleaf Invest
    promises its customers regarding their path to wealth creation.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: copperleaf_invest
- id: 09869a57-0288-5453-a052-67d1ac0f6878
  title: When to use deposit_funds
  body: 'The `deposit_funds` tool is used when a customer wants to add new capital
    to their Copperleaf Invest account from an external bank account. This is a primary
    action for customers looking to utilise their annual ISA allowances or grow their
    General Investment Account.


    **Agent Procedure**


    1. **Identity Verification**: The agent must call the `verify_identity` tool.
    Security is paramount, and we require full verification before any state-changing
    action, including deposits.

    2. **Account Identification**: The agent must identify which account is receiving
    the funds. If the customer is unclear, the agent should use `get_accounts` to
    present the available options (e.g., Copperleaf Stocks and Shares ISA or Copperleaf
    Lifetime ISA).

    3. **Amount Confirmation**: The agent must confirm the exact amount the customer
    wishes to deposit. If the customer is using Copperleaf Monthly Investing, the
    agent should remind them of the minimum monthly commitment of £25.

    4. **Bank Detail Verification**: The agent must confirm that the funds are being
    sent from a bank account in the customer''s own name to comply with FCA anti-money
    laundering guidelines.

    5. **Execution**: The agent calls the `deposit_funds` tool with the destination
    account ID and the amount.

    6. **Confirmation and Next Steps**: The agent confirms the deposit request has
    been initiated and reminds the customer that funds may take a short period to
    appear in their balance. The agent can also suggest they use `place_trade` once
    the funds have cleared to begin investing.


    We ensure our cost structures are clear; customers should be reminded that there
    are no fees for depositing funds into their accounts. We maintain this transparent
    pricing model to ensure the long-term sustainability of our platform and to encourage
    diversified investing.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: copperleaf_invest
- id: 000861b3-34dd-54cc-a511-2c459ff437d7
  title: deposit_funds tool reference
  body: 'The `deposit_funds` tool is the mechanism used to initiate the movement of
    cash from a customer''s external bank account into their Copperleaf Invest account.
    The agent performs this action by calling the tool directly.


    **Tool Signature and Arguments**

    To process a deposit, the agent must provide:

    - **account_id**: The unique identifier of the Copperleaf account receiving the
    funds (obtained via `get_accounts`).

    - **amount**: The sum to be deposited, expressed in GBP (£).

    - **payment_method_id**: The identifier for the customer''s linked external bank
    account.


    **Effect**

    Calling this tool creates a deposit request in the system. Depending on the payment
    method, this may trigger an immediate balance update or a pending transaction
    awaiting bank clearance. Once the funds are received, they are credited to the
    customer''s cash balance. All deposits are handled in accordance with strict data
    privacy and fair treatment standards, ensuring that the customer''s path to wealth
    creation is secure and transparent.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: copperleaf_invest
- id: 09d36b81-38c7-5b34-9880-a05f0f01f3a8
  title: When to use withdraw_funds
  body: 'The `withdraw_funds` tool is used when a customer wishes to move cash from
    their Copperleaf Invest account to an external bank account. Because withdrawals
    are irreversible and involve the movement of capital out of the firm, they are
    subject to the highest level of security scrutiny.


    **Agent Procedure**


    1. **Identity Verification**: The agent must call the `verify_identity` tool.
    No withdrawal can be processed without full, multi-factor authentication and identity
    verification.

    2. **Account Resolution**: The agent must use `get_accounts` to identify the source
    account from which the funds will be withdrawn.

    3. **Amount and Balance Check**: The agent must confirm the withdrawal amount
    and ensure there is sufficient available cash (not invested in shares) to cover
    the request. If the funds are currently invested, the agent must explain that
    the customer needs to sell those assets via `place_trade` first.

    4. **Destination Confirmation**: The agent must confirm the nominated bank account
    for the withdrawal. If the customer wishes to change this, the agent must first
    use the `update_beneficiary` tool.

    5. **Regulatory Warning**: For Lifetime ISA withdrawals, the agent must warn the
    customer that a 25% government withdrawal charge applies unless they are 60 or
    over, terminally ill, or using the funds for a first home purchase.

    6. **Execution**: The agent calls the `withdraw_funds` tool using the account
    ID, amount, and beneficiary details.

    7. **Final Notification**: The agent informs the customer that the request has
    been submitted and provides a clear timeline for when they can expect the funds
    in their bank account.


    We remain committed to fairness and transparency. If a withdrawal is blocked due
    to security concerns or suspected fraudulent activity, the agent must escalate
    the matter immediately to the compliance team for handling in accordance with
    FCA guidelines. For more details, see the withdraw_funds tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: copperleaf_invest
- id: 3d3e200c-8a66-53c1-8377-4ecd66b52ee6
  title: withdraw_funds tool reference
  body: 'The `withdraw_funds` tool allows agents to initiate the process of removing
    capital from a customer''s investment account. Because this action is classified
    as irreversible, it must be handled with strict adherence to our security protocols.


    **Tool Signature**

    `withdraw_funds(account_id: string, amount: number, currency: string)`


    **Arguments**

    - `account_id`: The unique identifier for the account from which the funds are
    to be taken. Agents should resolve this ID by using the `get_accounts` tool after
    confirming the customer''s account details.

    - `amount`: The specific sum of money the customer wishes to withdraw.

    - `currency`: The currency of the transaction (e.g., GBP).


    **Effect**

    Calling this tool instructs the system to liquidate the necessary assets and transfer
    the specified funds to the customer''s verified nominated bank account.


    **Operational Requirements**

    The agent performs this action by calling the tool directly within the secure
    conversation. Full identity verification using the `verify_identity` tool is mandatory
    before `withdraw_funds` is invoked, ensuring all state-changing actions are authorised
    and secure.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: copperleaf_invest
