- id: 39ea3232-351b-530f-87bd-f6af6a26a531
  title: Copperleaf Stocks and Shares ISA — account security best practices
  body: 'At Copperleaf Invest, we believe that the security of your assets is paramount.
    To protect your Copperleaf Stocks and Shares ISA, we employ multi-factor authentication
    (MFA) and rigorous identity checks as standard. We strongly encourage all customers
    to ensure their MFA settings are active and that they use unique, complex passwords
    for their accounts.


    It is vital to be aware of the following security protocols. We will never ask
    you to disclose your full password, MFA codes, or PINs via email or secure messaging.
    Furthermore, we will never request that you transfer funds to a ''safe account''
    or provide your credentials to a third party to ''verify'' your identity. Any
    such request is fraudulent and should be reported to us immediately.


    Full verification is mandatory before any state-changing action is performed,
    such as processing withdrawals or altering your account details. If you notice
    any unauthorised activity or suspect your credentials have been compromised, your
    first action should be to notify us through our secure in-app messaging system
    immediately. We will then initiate an immediate freeze on the account and escalate
    the matter to our compliance team in accordance with FCA guidelines.


    For your peace of mind, we remind you that our services are strictly regulated
    by the FCA. While the value of investments can fall as well as rise and capital
    is at risk, your funds are protected by the FSCS up to £85,000 per person if the
    brokerage fails.


    By following these best practices, you help us maintain a secure environment for
    your long-term growth and the efficient use of your £20,000 annual ISA allowance.'
  domain: brokerage_investing
  product_category: stocks_shares_isa
  document_type: security_advisory
  source_authority: official
