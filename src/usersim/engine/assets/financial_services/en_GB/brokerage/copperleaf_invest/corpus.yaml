- id: 65fac0e0-9092-58d0-9dc9-9f61e305b999
  title: Copperleaf Monthly Investing — cost and charges
  body: 'Q: What are the primary costs associated with Copperleaf Monthly Investing?


    A: We maintain a highly transparent pricing model. The main costs are a 0.25%
    platform fee, which covers the maintenance and infrastructure of your account,
    and a £0 regular dealing fee, which we waive to encourage you to invest regularly
    and diversify your portfolio.


    Q: Is there a minimum amount I must invest each month?


    A: Yes, to keep the service sustainable and accessible, we require a minimum monthly
    commitment of £25.


    Q: Are there any hidden charges for executing my monthly trades?


    A: No. We believe in clarity; there are no hidden fees. Your regular dealings
    are processed at a cost of £0. For more information on how we position our products,
    please see Copperleaf Monthly Investing — overview.'
