- id: 2edd0d76-4c0c-5abe-be42-ef8dc5f3ac41
  title: Oakhaven Personal Pension — set up and activate
  body: 'Setting up your Oakhaven Personal Pension is a straightforward process designed
    to get your retirement savings working for you as quickly as possible. Before
    starting, ensure you have your National Insurance number and a valid form of government-issued
    photo identification ready.


    1. Provide your full personal details and identity documentation. We will perform
    strict identity verification and multi-factor authentication to protect your future
    assets from unauthorised access.

    2. Specify your monthly contribution amount. Please note that the minimum monthly
    contribution is £50.

    3. Confirm your tax status. This allows us to apply the 20% basic-rate tax relief
    to your contributions automatically.

    4. Complete an ''Expression of Wish''. This is a non-binding statement where you
    detail who you would like to receive your pension benefits upon your death.

    5. Review the account terms, including the 0.6% annual management charge, and
    provide your electronic signature to formalise the agreement.

    6. Receive your activation confirmation. We will notify you once your account
    is live and your first contribution has been scheduled.


    Once activated, you can monitor your progress and manage your contributions through
    our secure online portal. If you are unsure if you meet the necessary criteria
    before starting, please consult the Oakhaven Personal Pension — eligibility requirements.'
