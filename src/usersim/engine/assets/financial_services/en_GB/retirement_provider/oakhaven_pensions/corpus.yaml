- id: 952efa78-2743-598d-8e0c-c95ac6ed26a1
  title: Oakhaven Flexible Drawdown — regulatory disclosures
  body: 'Oakhaven Pensions operates in strict alignment with the frameworks set by
    the Financial Conduct Authority (FCA) and The Pensions Regulator to ensure the
    fair treatment of all customers. Members using Oakhaven Flexible Drawdown must
    be aware of the following regulatory constraints:


    Lump Sum and Tax Limitations: The ability to take 25% of a pension pot as tax-free
    cash is subject to the lump sum allowance of £268,275. Any amount withdrawn as
    a lump sum above this figure will be subject to the applicable income tax rates.
    Furthermore, please be advised that inheritance tax changes effective from 6 April
    2027 may impact how your remaining pension wealth is treated upon death.


    Contribution Restrictions: Members are cautioned that flexibly accessing their
    pension triggers the Money Purchase Annual Allowance (MPAA). This reduces the
    maximum amount that can be contributed to pensions each year while remaining eligible
    for tax relief to £10,000. Failure to adhere to the MPAA may result in tax charges.


    Access Ages: In accordance with UK legislation, the current minimum pension age
    is 55. However, the minimum pension age from April 2028 will rise to 57. Members
    are encouraged to plan their withdrawal timelines accordingly.


    Guidance Obligations: Oakhaven Pensions provides educational resources and general
    guidance but does not offer regulated financial advice or individual tax advice.
    In compliance with our commitment to member welfare, we mandate the offer of free,
    impartial Pension Wise guidance to all members eligible to access their funds
    from age 50.


    Dispute Resolution: We are committed to the prompt resolution of all disputes.
    Should a resolution not be reached internally through our senior operations specialists
    and compliance officers, members have a clear escalation path to the Financial
    Ombudsman Service or the Pensions Ombudsman.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: disclosure
  source_authority: official
