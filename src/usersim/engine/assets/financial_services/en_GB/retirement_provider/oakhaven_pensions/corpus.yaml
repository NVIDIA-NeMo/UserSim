- id: 499a551d-3b9d-58b1-9d9d-88ab6a2274e5
  title: Oakhaven Workplace Pension — set up and activate
  body: 'Setting up your Oakhaven Workplace Pension is a streamlined process designed
    to ensure your assets are secure from the first contribution. This guide outlines
    the steps required to activate your account through your employer''s enrolment
    process.


    **Prerequisites**

    Before beginning, ensure you have your National Insurance number, a valid government-issued
    photo ID, and the contact details of your employing organisation''s payroll or
    HR department.


    **Step-by-Step Activation**


    1. **Provide Enrolment Details**: You will first provide your employer with your
    basic personal details and National Insurance number. Your employer will then
    notify us to establish your pension record.


    2. **Identity Verification**: To protect your assets from unauthorised access,
    we require strict identity verification. You will be asked to provide a digital
    copy of your photo ID and complete a multi-factor authentication (MFA) setup.
    We will confirm once your identity has been successfully verified.


    3. **Confirm Contribution Levels**: You must agree to the contribution levels.
    Ensure that the combined employee and employer contributions meet the minimum
    total contribution of 8% (which includes the minimum employer contribution of
    3%). You will receive a confirmation of these percentages.


    4. **Beneficiary Designation**: You will be asked to complete an ''Expression
    of Wish''. This is a non-binding statement detailing who you would like to receive
    your pension benefits upon your death. This is a critical step in securing your
    legacy.


    5. **Final Activation**: Once the identity check is complete and contributions
    are agreed, we will activate your account. You will receive a welcome notification
    confirming that your Oakhaven Workplace Pension is now active and ready to receive
    contributions.


    Your account is successfully activated when you can view your current balance
    and contribution history through our secure online portal.'
  domain: retirement
  product_category: workplace_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
