- id: 8f500569-3816-5a77-9ac3-dc955196e67b
  title: Oakhaven Workplace Pension — when to switch or upgrade
  body: 'Support agents should use this guidance to help customers determine if the
    Oakhaven Workplace Pension remains the right fit or if a transition is appropriate.


    Keep the Oakhaven Workplace Pension when:

    The customer is currently employed by a participating company. The primary advantage
    is the employer contribution, ensuring a minimum total contribution of 8% (with
    the employer providing at least 3%). This ''free'' money from the employer is
    a significant benefit that is absent in self-managed accounts.


    Consider switching to an Oakhaven Personal Pension when:

    - The customer has left the employer and no longer receives employer contributions.

    - The customer desires a fully self-managed retirement account and is primarily
    interested in the 20% basic-rate tax relief on their own contributions, rather
    than employer-sponsored growth.


    Comparison Table:

    | Feature | Oakhaven Workplace Pension | Oakhaven Personal Pension |

    | :--- | :--- | :--- |

    | Primary Benefit | Employer contributions (min 3%) | 20% basic-rate tax relief
    |

    | Min Total Input | 8% (Combined) | Member-defined |

    | Management Cost | 0.45% AMC | See Personal Pension fee schedule |


    For more details on the transition process, refer to Oakhaven Personal Pension
    — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: comparison
  source_authority: official
