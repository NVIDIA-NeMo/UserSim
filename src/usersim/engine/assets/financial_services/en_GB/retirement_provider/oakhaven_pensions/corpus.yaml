  institution_id: oakhaven_pensions
- id: a003c6d5-6c9e-5fbc-a1e1-8208b4d287c5
  title: General frequently asked questions
  body: 'How can I contact Oakhaven Pensions support?

    Customer support is available via our secure online portal or by telephone during
    UK business hours (GMT). Our team is available to assist with account queries,
    administration, and guidance on navigating your pension.


    What happens if I have a dispute or identify fraudulent activity?

    We are committed to the fair and prompt resolution of all disputes. If a resolution
    cannot be reached through our internal escalation path (from general customer
    service to senior operations specialists and compliance officers), members may
    escalate their case to the Financial Ombudsman Service or the Pensions Ombudsman.
    In cases of suspected fraud, we trigger an immediate account suspension followed
    by a comprehensive forensic investigation to protect member assets.


    Do you provide financial advice on how to invest my pension?

    Oakhaven Pensions provides educational resources and guidance but does not offer
    regulated financial advice or individual tax advice. We mandate the offer of free,
    impartial Pension Wise guidance to all members eligible to access their funds
    from age 50. For more information on our procedural standards, please see Regulatory
    notes for Pensions.'
  domain: retirement
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 9040e5e3-a384-55f3-8961-02521404b345
  title: Regulatory notes for Pensions
  body: 'Oakhaven Pensions operates in strict alignment with the frameworks set by
    the Financial Conduct Authority (FCA) and The Pensions Regulator. Our primary
    objective is the fair treatment of customers, ensuring transparency and regulatory
    excellence across all retirement services.


    **Scam Prevention and Transfers**

    We prioritise the prevention of pension scams. All transfer requests are subject
    to rigorous verification and checks to protect members from unauthorised access
    and fraud. Strict identity verification and multi-factor authentication are mandatory
    before any state-changing action is performed on an account.


    **Key Regulatory Thresholds and Allowances**

    Agents must provide clear disclosures regarding the following limits and changes:

    - **Annual Allowance**: The maximum amount that can be contributed to pensions
    each year while remaining eligible for tax relief is currently £60,000.

    - **Money Purchase Annual Allowance (MPAA)**: A reduced annual contribution limit
    of £10,000 applies once a member has flexibly accessed their pension.

    - **Lump Sum Allowance**: Members should be informed of the £268,275 lump sum
    allowance regarding tax-free cash.

    - **Inheritance Tax**: Members must be made aware of the inheritance tax changes
    that become effective from 6 April 2027.


    **Guidance Mandates**

    Oakhaven Pensions provides guidance and educational resources but is strictly
    prohibited from offering regulated financial advice or individual tax advice.
    To ensure members receive impartial support, agents must offer free Pension Wise
    guidance to all members who are eligible to access their funds from age 50.


    **Asset Protection**

    To prevent unauthorised access, no withdrawals, beneficiary updates, or transfers
    may be processed without first completing the full security and verification protocol.
    Any detected fraudulent activity will result in immediate account suspension and
    a forensic investigation to secure the member''s assets.'
  domain: retirement
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 681035fa-567d-588d-8fad-f884cc76b8cb
  title: When to use request_withdrawal
  body: 'The `request_withdrawal` tool is used when a member wishes to take money
    from their pension. This action is irreversible and must only be performed after
    the member''s identity has been fully verified and the legal eligibility for withdrawal
    has been confirmed.


    **Applicable Scenarios**

    This tool should be used for the following request types:

    1. **Tax-Free Cash**: Accessing a portion of the pot as a tax-free lump sum (up
    to the relevant allowance).

    2. **Drawdown Income**: Setting up or requesting a payment from a pot already
    in flexible drawdown.

    3. **Uncrystallised Lump Sum**: Taking a payment directly from the uncrystallised
    portion of the pension.


    **Procedural Steps for Agents**

    1. **Identity Verification**: Perform a full identity check using `verify_identity`.
    This must be completed before any further steps.

    2. **Account Identification**: Use `get_accounts` to resolve the member''s account
    identifier. If the member provides only the last four digits of their account
    number, the agent must use this tool to find the full `account_id`.

    3. **Requirement Gathering**: Confirm the specific amount to be withdrawn and
    the withdrawal type (tax-free cash, drawdown, or uncrystallised lump sum).

    4. **Execution**: Call the `request_withdrawal` tool using the resolved `account_id`,
    the specified amount, and the withdrawal type.

    5. **Confirmation**: Confirm to the member that the request has been submitted
    and advise them on the expected timeframe for the funds to reach their nominated
    account.


    Agents must ensure that if the member is accessing funds for the first time and
    is age 50 or older, they have been offered the impartial guidance provided by
    Pension Wise as per our regulatory obligations.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_withdrawal
  institution_id: oakhaven_pensions
- id: 6a767978-9e92-5122-bab8-fa1e70360862
  title: request_withdrawal tool reference
  body: 'The `request_withdrawal` tool is used to process the removal of funds from
    a member''s pension account. This is an irreversible action.


    **Tool Signature**

    `request_withdrawal(account_id: string, amount: number, withdrawal_type: string)`


    **Arguments**

    - `account_id`: The unique identifier for the pension account, obtained via the
    `get_accounts` tool.

    - `amount`: The specific sum of money the member wishes to withdraw, provided
    by the customer in GBP (£).

    - `withdrawal_type`: The category of withdrawal. Valid values include ''tax-free
    cash'', ''drawdown income'', or ''uncrystallised lump sum''.


    **Effect**

    The agent performs this action by calling the tool directly. Once executed, the
    requested amount is deducted from the member''s pension pot and the payment process
    is initiated. This tool should only be used after the member''s identity has been
    verified through `verify_identity`.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_withdrawal
  institution_id: oakhaven_pensions
- id: d6c08cdd-8964-5f28-9d7f-c2a4afe64e9c
  title: When to use update_investment_election
  body: 'The `update_investment_election` tool is used when a member wishes to change
    how their pension wealth is invested. This applies to both the existing accumulated
    pot and any future contributions being made into the account.


    **Applicable Scenarios**

    Use this tool when a member wants to:

    1. **Change Asset Allocation**: Move their funds from one investment strategy
    or fund to another to better align with their risk appetite.

    2. **Adjust Future Contributions**: Specify that new contributions should be invested
    in a different fund than the current default.

    3. **Rebalance Portfolio**: Update the distribution of assets across the available
    investment options.


    **Procedural Steps for Agents**

    1. **Identity Verification**: The agent must first verify the member''s identity
    using the `verify_identity` tool.

    2. **Account Identification**: Call `get_accounts` to retrieve the correct `account_id`
    associated with the member''s profile.

    3. **Selection Confirmation**: Clearly present the available investment options
    to the member and confirm their chosen fund or strategy. Ensure the member understands
    that investment values can fluctuate.

    4. **Execution**: Call the `update_investment_election` tool, passing the `account_id`
    and the new investment fund selection.

    5. **Acknowledgement**: Inform the member that the election has been updated and
    that future contributions and existing assets will be transitioned according to
    the new selection.


    Note: Agents must not provide advice on which fund to choose. This is a request
    for a change of election, not a financial advisory service.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_investment_election
  institution_id: oakhaven_pensions
- id: 5e4125d4-67fe-5693-9212-fd0b07e8c297
  title: update_investment_election tool reference
  body: 'The `update_investment_election` tool allows an agent to change the investment
    funds assigned to a member''s pension assets and future contributions.


    **Tool Signature**

    `update_investment_election(account_id: string, new_fund_selection: string)`


    **Arguments**

    - `account_id`: The unique identifier for the pension account, obtained via the
    `get_accounts` tool.

    - `new_fund_selection`: The name or identifier of the fund or investment strategy
    chosen by the member.


    **Effect**

    The agent performs this action by calling the tool directly. The tool updates
    the account''s investment mandate, triggering a reallocation of the existing pot
    and ensuring all subsequent contributions are directed into the newly selected
    fund. This action requires the member''s identity to be confirmed via `verify_identity`
    before execution.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_investment_election
  institution_id: oakhaven_pensions
- id: 6a3e70ad-5d36-5439-8de7-7a49e071c102
  title: When to use change_contributions
  body: 'The `change_contributions` tool is used to modify the personal financial
    commitments a member is making to their pension. This tool manages the frequency
    and amount of personal contributions.


    **Applicable Scenarios**

    Use this tool when a member requests to:

    1. **Increase or Decrease Contributions**: Change the monthly or annual amount
    they are personally contributing to their pension pot.

    2. **Pause Contributions**: Temporarily stop personal contributions due to a change
    in financial circumstances.

    3. **Restart Contributions**: Resume payments after a period of pausing.


    **Procedural Steps for Agents**

    1. **Identity Verification**: Execute `verify_identity` to ensure the request
    is authorised by the account holder.

    2. **Account Identification**: Use `get_accounts` to locate the relevant `account_id`.

    3. **Detail Confirmation**: Confirm the new contribution amount and the specific
    action to be taken (e.g., ''increase'', ''pause'', or ''restart'').

    4. **Execution**: Call the `change_contributions` tool using the `account_id`,
    the new amount (if applicable), and the action type.

    5. **Confirmation**: Advise the member of the date from which the change in contributions
    will take effect.


    For members with an Oakhaven Workplace Pension, agents should remind them of the
    minimum total contribution of 8% including employer contributions, though this
    tool specifically manages the personal element.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_contributions
  institution_id: oakhaven_pensions
- id: 7f6701ee-3296-5ec0-bbd1-19133e470dab
  title: change_contributions tool reference
  body: 'The `change_contributions` tool is used to update the personal contribution
    settings for a member''s pension account.


    **Tool Signature**

    `change_contributions(account_id: string, new_contribution_amount: number, action_type:
    string)`


    **Arguments**

    - `account_id`: The unique identifier for the pension account, obtained via the
    `get_accounts` tool.

    - `new_contribution_amount`: The new monetary value for the contribution, provided
    by the customer in GBP (£). This is not required if the action is to pause.

    - `action_type`: The nature of the change. Valid values include ''change'', ''pause'',
    or ''restart''.


    **Effect**

    The agent performs this action by calling the tool directly. It modifies the payment
    schedule for personal contributions. This action is state-changing and requires
    that the agent has first verified the member''s identity using `verify_identity`.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_contributions
  institution_id: oakhaven_pensions
- id: 8abd88b6-d1ed-5246-866f-fd835bf25ba5
  title: When to use request_pension_transfer
  body: 'The `request_pension_transfer` tool is used to move pension assets either
    into Oakhaven Pensions from another provider or out of Oakhaven Pensions to a
    different retirement provider.


    **Applicable Scenarios**

    This tool is used for:

    1. **Inward Transfers**: Consolidating an external pension into an Oakhaven account
    to simplify management.

    2. **Outward Transfers**: Moving funds to another provider, often as part of a
    strategy change or consolidation elsewhere.


    **Procedural Steps for Agents**

    1. **Identity Verification**: Perform a strict identity check using `verify_identity`.
    Due to the high risk of fraud associated with transfers, multi-factor authentication
    must be confirmed.

    2. **Account Identification**: Use `get_accounts` to retrieve the correct `account_id`
    for the transfer.

    3. **Scam Prevention Screening**: Before calling the tool, the agent must conduct
    the mandated scam prevention checks. This includes questioning the member about
    any unexpected contact from ''investment specialists'' or offers of guaranteed
    high returns.

    4. **Detail Collection**: Gather the necessary details of the transferring/receiving
    provider and the specific amount or percentage of the pot being moved.

    5. **Execution**: Call the `request_pension_transfer` tool using the `account_id`
    and the transfer details.

    6. **Disclosure**: Inform the member that the transfer is subject to regulatory
    checks and the receiving provider''s acceptance.


    Agents must ensure that any member transferring out is aware of the potential
    impact on their tax-free lump sum allowance and the current regulatory framework
    regarding inheritance tax changes effective from 6 April 2027.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_pension_transfer
  institution_id: oakhaven_pensions
- id: fc9eb6d7-195b-579d-a8e3-2f96418bd6b3
  title: request_pension_transfer tool reference
  body: 'The `request_pension_transfer` tool is used by the agent to initiate the
    movement of pension assets either into an Oakhaven account from another provider
    or out of an Oakhaven account to an external provider.


    **Tool Signature and Arguments**

    - `account_id`: The unique identifier for the member''s pension account, obtained
    via `get_accounts`.

    - `target_provider_name`: The full legal name of the external pension provider
    involved in the transfer.

    - `transfer_direction`: A specification of whether the funds are moving ''Inward''
    (to Oakhaven) or ''Outward'' (from Oakhaven).

    - `transfer_amount`: The specific monetary value to be transferred, or a notation
    for a ''Full Transfer'' of the pot.


    **Effect and Execution**

    When the agent calls this tool, the system triggers a formal transfer request.
    For all transfers, Oakhaven applies rigorous checks against pension scams to protect
    member assets. The agent performs this action by calling the tool directly within
    the secure conversation after the member''s identity has been fully verified.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_pension_transfer
  institution_id: oakhaven_pensions
- id: f84ba791-ed84-5e7e-80d3-63a0310ca2ae
  title: When to use start_drawdown
  body: 'This procedure is used when a member wishes to transition their pension funds
    into Oakhaven Flexible Drawdown, allowing them to access their wealth as a combination
    of tax-free cash and a taxable income stream.


    **Agent Procedure**

    1. **Verify Identity**: Ensure the member has undergone strict identity verification
    and multi-factor authentication.

    2. **Resolve Account**: Use `get_accounts` to identify the correct `account_id`
    associated with the member''s pension pot.

    3. **Guidance Requirement**: For members aged 50 or over, the agent must mandate
    the offer of free, impartial Pension Wise guidance before proceeding with crystallisation.

    4. **Define Crystallisation Amount**: Confirm the total amount the member wishes
    to move into drawdown. The agent must explain that ''crystallisation'' is the
    process of turning uncrystallised funds into a taxable income stream or a tax-free
    lump sum.

    5. **Disclose Tax-Free Limits**: Inform the member that they can typically take
    25% of the pot as tax-free cash, subject to the £268,275 lump sum allowance. Provide
    a clear disclosure that this allowance is a lifetime cap on the total amount of
    tax-free cash they can receive across all pensions.

    6. **Execution**: Call the `start_drawdown` tool using the `account_id` and the
    confirmed amount to be crystallised.


    This action is irreversible once the funds are moved into the drawdown phase and
    the tax-free cash is paid. For further details on the product, refer to Oakhaven
    Flexible Drawdown — overview.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - start_drawdown
  institution_id: oakhaven_pensions
- id: 1ce4043c-4e57-5540-9e36-c2738c50924e
  title: start_drawdown tool reference
  body: 'The `start_drawdown` tool is used by the agent to move all or part of a member''s
    pension pot into the Oakhaven Flexible Drawdown product and trigger the payment
    of the associated tax-free cash.


    **Tool Signature and Arguments**

    - `account_id`: The unique identifier for the pension account, retrieved via `get_accounts`.

    - `amount_to_crystallise`: The specific monetary value the member wishes to turn
    into a taxable income stream and tax-free lump sum.


    **Effect and Execution**

    Calling this tool executes the crystallisation process. The system calculates
    the 25% tax-free element (observing the £268,275 lump sum allowance) and moves
    the remaining balance into the flexible drawdown environment. The agent performs
    this action by calling the tool directly after the member''s identity has been
    verified and the mandatory Pension Wise guidance has been offered to eligible
    members.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - start_drawdown
  institution_id: oakhaven_pensions
- id: eed00823-16d7-5245-a503-06aeb94d626b
  title: When to use request_annuity_quote
  body: 'This procedure is used when a member is exploring the Oakhaven Lifetime Annuity
    as a secure retirement option to provide guaranteed lifelong income.


    **Agent Procedure**

    1. **Verify Identity**: Perform strict identity verification and multi-factor
    authentication.

    2. **Resolve Account**: Use `get_accounts` to obtain the member''s `account_id`.

    3. **Gather Requirements**: Discuss the member''s needs regarding income. The
    agent may mention typical rates, such as £7,100 per £100,000 at age 65, as a general
    example, but must clarify that this is not a guaranteed quote for the specific
    individual.

    4. **Clarify Advice Boundaries**: The agent must explicitly state that Oakhaven
    Pensions provides educational resources and guidance but does not offer regulated
    financial advice or individual tax advice.

    5. **Collect Quote Preferences**: Determine the desired annuity type (e.g., single
    life, joint life, level or increasing payments).

    6. **Execution**: Call the `request_annuity_quote` tool using the `account_id`
    and the specified preferences to generate a personalised quote.


    Once the quote is generated, the member can review it before deciding whether
    to proceed with the purchase. See Oakhaven Lifetime Annuity — overview for more
    product details.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_annuity_quote
  institution_id: oakhaven_pensions
- id: b265ca46-c929-56bd-aac1-71c5e796a6a1
  title: request_annuity_quote tool reference
  body: 'The `request_annuity_quote` tool allows the agent to obtain a personalised
    income projection for a member considering the Oakhaven Lifetime Annuity.


    **Tool Signature and Arguments**

    - `account_id`: The unique identifier for the member''s account, obtained via
    `get_accounts`.

    - `quote_preferences`: A detailed set of parameters including the preferred annuity
    type, payment frequency, and whether the income should be level or escalating.


    **Effect and Execution**

    The tool interacts with the annuity pricing engine to return a specific, personalised
    quote based on the member''s current pot value and their stated preferences. The
    agent performs this action by calling the tool directly during the conversation
    after identity has been verified.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_annuity_quote
  institution_id: oakhaven_pensions
- id: 6ddc5ef7-406c-59be-af00-fb387d82032d
  title: When to use purchase_annuity
  body: 'This procedure is used when a member has decided to proceed with the purchase
    of an Oakhaven Lifetime Annuity using all or part of their pension pot.


    **Agent Procedure**

    1. **Verify Identity**: Perform strict identity verification and multi-factor
    authentication.

    2. **Resolve Account**: Use `get_accounts` to obtain the `account_id`.

    3. **Verify Quote**: Confirm the specific quote the member wishes to accept. The
    agent must ensure the member has a valid `quote_id` generated from a previous
    `request_annuity_quote` call.

    4. **Confirm Purchase Amount**: Confirm the exact amount of the pension pot being
    used to buy the annuity. If only a part of the pot is used, the remaining funds
    stay in the existing account.

    5. **Final Confirmation**: Remind the member that purchasing an annuity is an
    irreversible action and that they will receive a guaranteed lifelong income in
    exchange for the capital used.

    6. **Execution**: Call the `purchase_annuity` tool with the `account_id`, the
    `quote_id`, and the purchase amount.


    Following a successful call, the system will finalise the annuity contract and
    the member''s pot will be reduced by the purchase amount.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - purchase_annuity
  institution_id: oakhaven_pensions
- id: 3917ea33-c99e-5e8f-9e69-badfabddccc1
  title: purchase_annuity tool reference
  body: 'The `purchase_annuity` tool is used by the agent to finalise the purchase
    of an Oakhaven Lifetime Annuity, converting pension capital into a guaranteed
    income stream.


    **Tool Signature and Arguments**

    - `account_id`: The unique identifier for the member''s account, obtained via
    `get_accounts`.

    - `quote_id`: The identifier of the specific personalised quote the member has
    accepted.

    - `purchase_amount`: The total monetary value from the pension pot being used
    to fund the annuity.


    **Effect and Execution**

    This is an irreversible action. Calling this tool triggers the immediate purchase
    of the annuity, allocates the specified funds from the member''s account, and
    establishes the lifelong payment schedule. The agent performs this action by calling
    the tool directly after strict identity verification and final confirmation from
    the member.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - purchase_annuity
  institution_id: oakhaven_pensions
- id: 2e0d1beb-2e3e-5dcc-8c72-52d6335b6747
  title: When to use opt_out_of_workplace_pension
  body: 'This procedure is used when a member of an Oakhaven Workplace Pension wishes
    to opt out of the scheme shortly after automatic enrolment.


    **Agent Procedure**

    1. **Verify Identity**: Perform strict identity verification and multi-factor
    authentication.

    2. **Resolve Account**: Use `get_accounts` to find the `account_id` for the workplace
    pension.

    3. **Check Eligibility Window**: Verify the date of the member''s enrolment. The
    `opt_out_of_workplace_pension` tool can only be used if the member is opting out
    within one month of being enrolled.

    4. **Confirm Refund**: Inform the member that opting out within this window entitles
    them to a full refund of all contributions made to the scheme.

    5. **Explain Implications**: Briefly mention that opting out means they will no
    longer receive employer contributions, which are part of the minimum total contribution
    of 8% for this product.

    6. **Execution**: Call the `opt_out_of_workplace_pension` tool using the `account_id`.


    Upon successful execution, the account will be closed and the refund process will
    be initiated. For more on the product structure, see Oakhaven Workplace Pension
    — overview.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - opt_out_of_workplace_pension
  institution_id: oakhaven_pensions
- id: 7b55566a-118d-5b8c-9bdd-443ebfab9934
  title: opt_out_of_workplace_pension tool reference
  body: 'The `opt_out_of_workplace_pension` tool is used by the agent to process a
    member''s request to leave the Oakhaven Workplace Pension scheme within the statutory
    opt-out window.


    **Tool Signature and Arguments**

    - `account_id`: The unique identifier for the member''s workplace pension account,
    obtained via `get_accounts`.


    **Effect and Execution**

    When called, the tool closes the member''s account and triggers a full refund
    of all contributions made to the scheme. This action is only permitted if the
    request occurs within one month of the initial enrolment. The agent performs this
    action by calling the tool directly after the member''s identity has been verified.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - opt_out_of_workplace_pension
  institution_id: oakhaven_pensions
- id: 1d8c1a19-c58a-5a42-9959-61eb3d981e8c
  title: When to use update_selected_retirement_age
  body: 'This procedure is used when a member wishes to change the retirement age
    they have selected, which in turn adjusts the investment strategy the pot moves
    towards over time.


    **Agent Procedure**

    1. **Verify Identity**: Perform strict identity verification and multi-factor
    authentication.

    2. **Resolve Account**: Use `get_accounts` to obtain the member''s `account_id`.

    3. **Determine New Age**: Obtain the new target retirement age from the member.
    This should be a specific age in years.

    4. **Explain Strategy Impact**: Inform the member that changing this age will
    alter how their funds are invested, typically shifting from higher-growth assets
    to more stable assets as they approach the selected date.

    5. **Execution**: Call the `update_selected_retirement_age` tool using the `account_id`
    and the new retirement age.


    This update ensures that the investment glide path remains aligned with the member''s
    current retirement goals. For further guidance on managing their account, the
    member can be referred to Oakhaven Personal Pension — make a change or update
    if they hold a personal account.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_selected_retirement_age
  institution_id: oakhaven_pensions
- id: 36a9fe82-c698-5a5a-abb8-42ab6a2d61d2
  title: update_selected_retirement_age tool reference
  body: 'The update_selected_retirement_age tool allows an agent to modify the target
    retirement age associated with a member''s pension account. This date is critical
    as it informs the investment strategy, guiding the transition of assets to ensure
    the portfolio alignment matches the member''s intended retirement horizon.


    The agent performs this action by calling the tool directly within the secure
    session once the member''s identity has been verified.


    **Tool Signature and Arguments:**

    - Account Identifier: The unique ID of the pension account to be updated (obtained
    via get_accounts).

    - Retirement Age: The new target age (expressed as a whole number) at which the
    member intends to retire.


    **Effect:**

    Upon successful execution, the system updates the account record and adjusts the
    investment glide path to reflect the new retirement age. This is a state-changing
    action and is recorded in the member''s audit trail for regulatory compliance.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_selected_retirement_age
  institution_id: oakhaven_pensions
- id: 982d3110-7af6-564a-a68a-5207d3b6b1ac
  title: When to use update_beneficiary
  body: 'Members may wish to update their ''Expression of Wish'' to specify who should
    receive their pension benefits upon their death. Because this is a critical instruction
    regarding the distribution of wealth, Oakhaven Pensions requires strict identity
    verification before any changes are processed.


    An Expression of Wish is a non-binding statement, but it provides essential guidance
    to the trustees or the provider during the settlement of a pension pot. Members
    are encouraged to review these details regularly, particularly following significant
    life events such as marriage, divorce, or the birth of a child.


    **Procedure for Updating Beneficiaries:**


    1. **Identity Verification:** The agent must first perform a rigorous identity
    check using the verify_identity tool to ensure the request is legitimate and protects
    the assets from unauthorised access.

    2. **Account Identification:** Use the get_accounts tool to retrieve the member''s
    full list of pensions. If the member provides only the last four digits of an
    account, the agent must match these to the correct account identifier returned
    by the tool.

    3. **Information Gathering:** The agent must collect the full legal name, date
    of birth, and the relationship of the new or updated beneficiary to the member.

    4. **Execution:** The agent calls the update_beneficiary tool, passing the confirmed
    account identifier and the beneficiary''s personal details exactly as provided
    by the member.

    5. **Confirmation:** The agent should confirm to the member that the Expression
    of Wish has been updated and advise them that they will receive a confirmation
    notice via the secure online portal.


    For further information on the nature of these nominations, members may refer
    to the general glossary terms regarding the Expression of Wish.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: oakhaven_pensions
- id: fc57404b-f9e9-56b3-98a5-1ae85e4d69c0
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool is used to record or modify a member''s Expression
    of Wish. This is a non-binding statement that informs Oakhaven Pensions of the
    member''s preferences regarding who should receive their pension benefits upon
    their death.


    The agent performs this action by calling the tool directly after the member''s
    identity has been successfully verified.


    **Tool Signature and Arguments:**

    - Account Identifier: The unique ID of the pension account (obtained via get_accounts).

    - Beneficiary Full Name: The complete legal name of the person nominated as the
    beneficiary.

    - Beneficiary Date of Birth: The date of birth of the nominee, used to ensure
    accurate identification.

    - Relationship: The relationship of the nominee to the account holder (e.g., Spouse,
    Child, Sibling).


    **Effect:**

    The tool updates the beneficiary records for the specified account. As this is
    a state-changing action, it is logged for compliance purposes to ensure the fair
    treatment of customers and the security of member assets.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: oakhaven_pensions
- id: 0ce1e416-a9c9-5a0f-810b-07abb4cc0d52
  title: When to use open_account
  body: "The open_account tool is used when an individual wishes to establish a new\
    \ Oakhaven Personal Pension. This product is designed as a flexible, self-managed\
    \ retirement account that allows individuals to build their own pension wealth\
    \ outside of an employer-sponsored scheme.\n\nA primary benefit of the Oakhaven\
    \ Personal Pension is the basic-rate tax relief of 20% added to personal contributions,\
    \ which helps the retirement pot grow more efficiently. Agents must ensure the\
    \ customer understands that while Oakhaven provides educational resources and\
    \ guidance, we do not offer regulated financial advice or individual tax advice.\n\
    \n**Procedure for Opening a Personal Pension:**\n\n1. **Initial Identity Verification:**\
    \ Before initiating the account opening process, the agent must use the verify_identity\
    \ tool to establish the legal identity of the applicant.\n2. **Requirement Check:**\
    \ The agent should confirm the applicant is eligible to open a personal pension\
    \ and inform them of the available educational resources for retirement planning.\n\
    3. **Data Collection:** The agent must collect the following details exactly as\
    \ they appear on legal documentation:\n    - Full legal name\n    - Date of birth\n\
    \    - Current residential address and contact details\n    - The amount of the\
    \ initial contribution to start the pot\n4. **Account Creation:** The agent calls\
    \ the open_account tool, providing all the collected personal details and the\
    \ initial contribution amount.\n5. **Onboarding:** Once the tool confirms the\
    \ account is open, the agent should explain how to access the secure online portal\
    \ for future management and how to set up ongoing contributions.\n\nFor a detailed\
    \ overview of this product's benefits and structure, agents may refer to Oakhaven\
    \ Personal Pension — overview."
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: oakhaven_pensions
- id: 6f555fce-1097-5507-9b93-9542f5ad2c8b
  title: open_account tool reference
  body: 'The open_account tool is used to create a new Oakhaven Personal Pension for
    a customer. This enables the member to benefit from a flexible retirement account
    and basic-rate tax relief of 20% on their contributions.


    The agent performs this action by calling the tool directly once the customer''s
    identity has been verified.


    **Tool Signature and Arguments:**

    - Full Name: The complete legal name of the customer.

    - Date of Birth: The customer''s date of birth.

    - Contact Information: The customer''s current address, telephone number, and
    email address.

    - Initial Contribution: The amount of the first payment into the pension pot.


    **Effect:**

    The tool establishes a new pension account in the Oakhaven system, assigns a unique
    account identifier, and allocates the initial contribution to the account. The
    agent will receive the new account ID upon successful completion of the tool call.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: oakhaven_pensions
- id: e9df04c0-2af7-587f-9aa2-9f3a1f84eb14
  title: When to use close_account
  body: 'Closing a pension account is a permanent, irreversible action. At Oakhaven
    Pensions, an account can only be closed once it has been fully depleted—either
    because the funds have been transferred out to another provider or because they
    have been fully withdrawn by the member.


    To protect member assets, strict verification and balance checks are mandatory
    before closure. The agent must ensure that no residual funds remain and that all
    tax obligations associated with the withdrawal or transfer have been addressed.


    **Procedure for Closing an Account:**


    1. **Identity Verification:** The agent must use the verify_identity tool to ensure
    the request is coming from the authenticated account holder.

    2. **Balance Confirmation:** Use the get_accounts tool to retrieve the current
    balance of the pension pot. The account can only be closed if the balance is £0.00.

    3. **Verification of Depletion:** If the balance is not zero, the agent must explain
    that the funds must first be moved via a transfer (using request_pension_transfer)
    or withdrawn (using request_withdrawal) before the account can be closed.

    4. **Execution:** Once a zero balance is confirmed, the agent calls the close_account
    tool, providing the specific account identifier.

    5. **Final Confirmation:** The agent notifies the member that the account is now
    closed and that a final closure statement will be available via the secure online
    portal.


    If the member is closing the account to move to a different provider, the agent
    should first guide them through the process detailed in When to use request_pension_transfer.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: oakhaven_pensions
- id: 282cd4e1-7efb-557a-95c5-483aa8751e7f
  title: close_account tool reference
  body: 'The close_account tool is used to permanently shut down a pension account.
    This tool can only be successfully invoked if the account balance has already
    reached zero through a full withdrawal or a complete transfer to another provider.


    The agent performs this action by calling the tool directly after the member''s
    identity has been verified and the zero balance has been confirmed.


    **Tool Signature and Arguments:**

    - Account Identifier: The unique ID of the pension account to be closed (obtained
    via get_accounts).


    **Effect:**

    The tool marks the account as closed in the system, preventing any further contributions
    or withdrawals. This is an irreversible action. Once executed, the account is
    no longer active, though historical records are retained for regulatory and tax
    purposes in accordance with FCA and The Pensions Regulator frameworks.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: oakhaven_pensions
- id: 2d66b761-46e0-53e4-b675-8392726c3497
  title: When to use get_accounts
  body: 'The get_accounts tool is the primary mechanism for agents to identify which
    pension products a member holds and to retrieve the current status, account identifiers,
    and balances of those pots. It is a prerequisite for almost every other state-changing
    action in the system.


    Because this tool provides sensitive financial data, it must never be called before
    the member has been fully authenticated.


    **Procedure for Retrieving Account Information:**


    1. **Identity Verification:** The agent must first use the verify_identity tool
    to confirm the member''s identity via multi-factor authentication.

    2. **Requesting the List:** Once verified, the agent calls the get_accounts tool.
    This tool does not require specific account numbers to function; it retrieves
    all accounts linked to the verified identity.

    3. **Resolving Account Identifiers:** Members often only know the last four digits
    of their account number. The agent must review the list returned by get_accounts
    and match the member''s provided digits to the full account identifier.

    4. **Communicating Details:** The agent can then provide the member with their
    current balances or confirm the type of product they hold (e.g., an Oakhaven Workplace
    Pension or Oakhaven Personal Pension).

    5. **Transition to Action:** Once the correct account identifier is resolved,
    the agent can proceed to other tools, such as update_investment_election or request_withdrawal,
    using that specific identifier.


    This process ensures that actions are performed on the correct account, preventing
    errors and protecting member assets from unauthorised changes.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: oakhaven_pensions
- id: a3fc8af3-1b08-5a50-ad85-a2762c85d899
  title: get_accounts tool reference
  body: 'The get_accounts tool retrieves a comprehensive list of all pension accounts
    held by the authenticated member. This tool is essential for resolving the specific
    account identifiers needed for subsequent state-changing operations.


    The agent performs this action by calling the tool directly after the member''s
    identity has been verified.


    **Tool Signature and Arguments:**

    - This tool takes no arguments as it retrieves all accounts associated with the
    currently verified member''s profile.


    **Effect:**

    The tool returns a list of all active and inactive pension accounts. For each
    account, the tool provides the full account identifier, the product type (e.g.,
    workplace, personal), the current total balance, and the current status of the
    account. This allows the agent to accurately identify the correct pot when a member
    refers to their account by a partial number or a specific product name.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: oakhaven_pensions
- id: 3e5f9146-b746-5ab3-adc2-aabf4b012bad
  title: When to use update_contact_info
  body: "Maintaining accurate contact information is vital for the secure delivery\
    \ of pension statements, regulatory disclosures, and multi-factor authentication\
    \ codes. Members may need to update their residential address, telephone number,\
    \ or email address following a move or a change in service provider.\n\nGiven\
    \ that contact details are used for security verification, any request to change\
    \ this information is treated as a high-risk action and requires rigorous authentication\
    \ to prevent account takeover fraud.\n\n**Procedure for Updating Contact Information:**\n\
    \n1. **Identity Verification:** The agent must first use the verify_identity tool\
    \ to ensure the member is who they claim to be before any personal data is modified.\n\
    2. **Account Identification:** Use the get_accounts tool to identify the member's\
    \ profile and ensure the update is applied across all held accounts.\n3. **Information\
    \ Collection:** The agent must collect the new contact details exactly as provided\
    \ by the member. This includes:\n    - The new residential address (including\
    \ postcode)\n    - The new primary telephone number\n    - The updated email address\n\
    4. **Execution:** The agent calls the update_contact_info tool, passing the member's\
    \ identifier and the updated details.\n5. **Verification of Change:** Once the\
    \ tool confirms the update, the agent should notify the member. As a security\
    \ precaution, Oakhaven Pensions will send a notification of this change to both\
    \ the old and new contact methods to alert the member of the modification.\n\n\
    If the member's contact details are so outdated that they cannot pass the initial\
    \ verify_identity check, the agent must escalate the call to a senior operations\
    \ specialist for manual identity verification."
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: oakhaven_pensions
- id: b9c51679-0b89-5893-bd5d-f922ed20e331
  title: update_contact_info tool reference
  body: 'The update_contact_info tool allows an agent to modify the personal contact
    details associated with a member''s pension account. The agent performs this action
    by calling the tool directly within the secure session once identity has been
    verified.


    **Tool Signature and Arguments**


    - account_id: The unique identifier for the pension account (retrieved via the
    get_accounts tool).

    - full_name: The member''s legal name as provided during the conversation.

    - email_address: The new or updated email address for digital correspondence.

    - phone_number: The current primary telephone contact number, including the UK
    country code.

    - residential_address: The member''s full current home address, including the
    postcode.


    **Effect**


    The tool updates the member''s profile in the Oakhaven Pensions administration
    system. This ensures that all future regulatory disclosures, statements, and secure
    notifications are sent to the correct destination. Because this is a state-changing
    action, strict identity verification and multi-factor authentication are mandatory
    before the tool is invoked.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: oakhaven_pensions
- id: 3c04ddad-0f3a-5e17-b995-66a0df22d7c3
  title: When to use get_statements
  body: 'Members may request access to their pension statements to review fund growth,
    contribution history, or current valuation. This procedure ensures that sensitive
    financial data is only disclosed to the verified account holder.


    **Procedure for Retrieving Statements**


    1. **Identity Verification**: The agent must first perform strict identity verification
    and multi-factor authentication (MFA) to ensure the member is authorised to access
    the account data.

    2. **Account Identification**: To ensure the correct pot is accessed, the agent
    must use the get_accounts tool. This is done by providing the last four digits
    of the member''s account number to resolve the specific account identifier required
    for subsequent tool calls.

    3. **Request Clarification**: The agent should ask the member to specify the type
    of statement required (e.g., a recent annual statement or a specific period''s
    summary) and the time frame they wish to review.

    4. **Tool Execution**: Once the account identifier and the requested period are
    confirmed, the agent calls the get_statements tool directly.

    5. **Information Delivery**: The agent then presents the retrieved statement data
    to the member clearly and professionally. If the member requires a formal PDF
    copy, they should be guided to the secure online portal, although the agent can
    provide the core data immediately via the tool.


    This process is strictly read-only and does not alter the status of the pension.
    If a member notices a discrepancy in the retrieved data, they should be referred
    to the appropriate troubleshooting guide for their specific product, such as Oakhaven
    Workplace Pension — a discrepancy in your records or statement.


    For a detailed breakdown of the tool''s technical requirements, refer to the get_statements
    tool reference.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: oakhaven_pensions
- id: ed312027-e108-562c-8c58-e46f9e93d7c6
  title: get_statements tool reference
  body: 'The get_statements tool is used to retrieve historical and current pension
    statements for a member. The agent performs this action by calling the tool directly
    within the conversation after the member''s identity has been fully verified.


    **Tool Signature and Arguments**


    - account_id: The unique identifier for the pension account, which must be obtained
    first using the get_accounts tool.

    - statement_type: The category of statement requested (e.g., ''Annual'', ''Quarterly'',
    or ''Ad-hoc'').

    - date_range: The specific period the member wishes to view, provided as a start
    and end date.


    **Effect**


    The tool queries the Oakhaven Pensions database and returns the financial data
    associated with the requested statement. This include the opening and closing
    balances, total contributions for the period, and the fund''s performance. As
    a read-only tool, it does not modify any member data and is safe to use once the
    identity of the caller has been confirmed via the required security protocols.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: oakhaven_pensions
- id: c8eb7589-b938-54a0-accc-70b615178101
  title: When to use set_alerts
  body: "Oakhaven Pensions provides members with the ability to set custom alerts\
    \ for their accounts to help them maintain stability and clarity regarding their\
    \ retirement wealth. This is particularly useful for monitoring balance thresholds\
    \ or receiving notifications of contributions.\n\n**Procedure for Configuring\
    \ Alerts**\n\n1. **Identity Verification**: Because configuring alerts is a state-changing\
    \ action, the agent must complete strict identity verification and multi-factor\
    \ authentication (MFA) before proceeding.\n2. **Account Identification**: The\
    \ agent must resolve the member's account identifier by using the get_accounts\
    \ tool, typically by searching with the last four digits of the account number\
    \ provided by the member.\n3. **Alert Parameter Definition**: The agent must confirm\
    \ exactly what the member wishes to be notified about. This includes:\n    - The\
    \ alert category (e.g., balance updates, transaction notifications, or anniversary\
    \ reminders).\n    - The trigger value (e.g., a specific monetary amount if the\
    \ alert is based on a balance threshold).\n    - The preferred notification channel\
    \ (e.g., email or SMS).\n4. **Tool Execution**: Once all parameters are agreed\
    \ upon, the agent calls the set_alerts tool directly to apply the changes to the\
    \ account.\n5. **Confirmation**: The agent must confirm to the member that the\
    \ alert has been successfully activated and reiterate how they will be notified\
    \ when the trigger is met.\n\nAgents must ensure that alerts are set in accordance\
    \ with the member's preferences for communication. For further details on the\
    \ technical arguments required for this action, see the set_alerts tool reference."
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: oakhaven_pensions
- id: 74d9b303-3d2c-511d-95f0-d629835a6c50
  title: set_alerts tool reference
  body: 'The set_alerts tool enables agents to configure automated notifications for
    members based on specific account activities or balance milestones. The agent
    performs this action by calling the tool directly after the member''s identity
    has been verified.


    **Tool Signature and Arguments**


    - account_id: The unique identifier for the pension account (retrieved via the
    get_accounts tool).

    - alert_category: The type of notification the member wishes to receive (e.g.,
    ''Balance Threshold'', ''Contribution Received'', ''Annual Review'').

    - trigger_value: The specific numeric value or event that activates the alert
    (e.g., a balance reaching a certain amount). If the alert is event-based, this
    may be left blank.

    - contact_method: The verified channel through which the alert should be delivered
    (e.g., ''Email'' or ''SMS'').


    **Effect**


    The tool updates the member''s communication preferences and registers a trigger
    in the Oakhaven Pensions monitoring system. This is a state-changing action that
    ensures members remain informed of their pension''s status without needing to
    manually check the portal.'
