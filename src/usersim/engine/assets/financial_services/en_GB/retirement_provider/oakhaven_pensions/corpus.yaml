- id: aced31f4-2522-59a6-8201-15da3ead7525
  title: Oakhaven Personal Pension — choosing between tiers or options
  body: "When deciding on the best retirement vehicle, prospective customers often\
    \ compare the Oakhaven Personal Pension against our Oakhaven Workplace Pension.\n\
    \n**Structural Comparison**\n- **Oakhaven Personal Pension:** This is a self-managed\
    \ account. It is best for individuals who are self-employed or wish to supplement\
    \ an existing pension. It features a flexible contribution model (minimum £50\
    \ per month) and a clear annual management charge of 0.6%.\n- **Oakhaven Workplace\
    \ Pension:** This is an employer-sponsored solution. It is best for employees\
    \ who benefit from automatic enrolment and employer contributions, often with\
    \ a lower annual management charge (e.g., 0.45% for workplace schemes).\n\n**Key\
    \ Trade-offs**\n- **Control:** The Personal Pension offers more individual autonomy\
    \ over the account. \n- **Cost:** The Workplace Pension often provides a lower\
    \ cost basis due to corporate pricing, whereas the Personal Pension is priced\
    \ for individual flexibility at 0.6%.\n- **Tax Benefit:** Both benefit from tax\
    \ relief, but the Personal Pension is specifically designed to maximise the 20%\
    \ basic-rate relief for independent savers up to the £60,000 annual allowance.\n\
    \nFor more information on the employer-led option, see Oakhaven Workplace Pension\
    \ — overview."
  domain: retirement
  product_category: personal_pension
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 241965da-c59f-58cf-918d-991a457c513c
  title: Oakhaven Personal Pension — privacy and data handling
  body: 'Oakhaven Pensions is committed to the highest standards of data privacy and
    regulatory excellence. The handling of all personal and financial data associated
    with the Oakhaven Personal Pension is strictly aligned with UK GDPR and the frameworks
    established by the Financial Conduct Authority (FCA) and The Pensions Regulator.


    **Data Collection and Purpose**

    We collect and process personal data—including identity documentation, National
    Insurance numbers, and financial history—solely for the purposes of account administration,
    regulatory reporting, and the prevention of financial crime. This data is essential
    to ensure the accurate application of the 20% basic-rate tax relief and to monitor
    compliance with the £60,000 annual allowance.


    **Security and Access Control**

    To prevent unauthorised access to member assets, we implement strict identity
    verification and multi-factor authentication (MFA). No state-changing action—including
    withdrawals or the update of an ''Expression of Wish''—will be performed without
    these security protocols. Our internal access is restricted to senior operations
    specialists and compliance officers on a need-to-know basis.


    **Third-Party Disclosures**

    We do not sell member data to third parties. Data may only be shared with regulatory
    bodies (such as the FCA) or the Financial Ombudsman Service in the event of a
    formal dispute resolution process. All such transfers are conducted via secure,
    encrypted channels.


    **Member Rights**

    Members have the right to request a full disclosure of the data held on their
    account. Such requests must be submitted via the secure online portal and are
    subject to our standard identity verification process. We ensure that all data
    is retained only for as long as is necessary to meet our legal and regulatory
    obligations. For further details on how we handle risk, please refer to Oakhaven
    Personal Pension — regulatory disclosures.'
