  institution_id: oakhaven_pensions
- id: 5eea5f75-29b2-5baa-bf4c-557aec97e161
  title: Oakhaven Workplace Pension — minimum total contribution (% of qualifying
    earnings) explained
  body: 'Q: What is meant by the ''minimum total contribution'' in my Oakhaven Workplace
    Pension?


    A: The minimum total contribution refers to the combined amount that must be paid
    into your pension pot each year by both you and your employer to meet the scheme''s
    baseline requirements. For the Oakhaven Workplace Pension, this minimum total
    contribution is 8% of your qualifying earnings. This ensures that your retirement
    fund grows at a sustainable rate.


    Q: How is this 8% total typically split between me and my employer?


    A: While the specific split may vary based on your employment contract, the scheme
    requires a minimum employer contribution of 3%. The remainder of the 8% total
    is typically contributed by the employee. You may choose to contribute more than
    the minimum to accelerate your savings. For further details on how these costs
    impact your fund, please refer to Oakhaven Workplace Pension — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: faq
  source_authority: official
