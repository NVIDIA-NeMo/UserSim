- id: dae5228f-348d-56f9-b896-978c1641b4c4
  title: Oakhaven Lifetime Annuity — account security best practices
  body: 'To protect your retirement wealth, Oakhaven Pensions employs rigorous security
    protocols. The Oakhaven Lifetime Annuity is designed for long-term stability,
    and maintaining the integrity of your account is our highest priority.


    **Essential Security Practices**

    All members must utilise multi-factor authentication (MFA) for every login to
    the secure online portal. This ensures that even if your password is compromised,
    your assets remain protected. We require strict identity verification before any
    state-changing action, such as updating your bank details for income payments
    or modifying your Expression of Wish.


    **Recognising Fraudulent Activity**

    Be vigilant against ''pension liberation'' scams or unsolicited offers to ''unlock''
    your funds. Oakhaven Pensions will never contact you via email or text message
    to ask for your full password, MFA codes, or to request a payment to ''release''
    your annuity income. Any communication asking for these details should be treated
    as fraudulent.


    **Immediate Action**

    If you notice any unauthorised access or receive a suspicious communication claiming
    to be from Oakhaven Pensions, please inform us immediately. Fraudulent activity
    triggers an immediate account suspension and a comprehensive forensic investigation
    to secure your funds.


    For further information on how we protect your account, you may refer to Oakhaven
    Lifetime Annuity — privacy and data handling.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ba31c8ae-9b9d-5fef-a3ed-b185a6c657f9
  title: Oakhaven Lifetime Annuity — change-of-terms policy
  body: 'This policy outlines the conditions under which Oakhaven Pensions may amend
    the terms governing the Oakhaven Lifetime Annuity. We are committed to transparency
    and regulatory excellence, ensuring that any changes are aligned with FCA and
    The Pensions Regulator frameworks.


    **Amendments to Terms**

    Oakhaven Pensions reserves the right to modify the administrative terms of the
    annuity. However, once an annuity has been purchased with the minimum purchase
    price of £10,000, the guaranteed income rate agreed at the point of purchase (such
    as the £7,100 per £100,000 at age 65) is contractually guaranteed for the lifetime
    of the member and cannot be reduced.


    **Notice Period**

    Should there be a change to the operational terms, such as the method of payment
    or the secure online portal''s access requirements, Oakhaven Pensions will provide
    a minimum of 30 days'' written notice via the secure portal or post. This ensures
    members have ample time to review the changes.


    **Termination and Obligations**

    As the Oakhaven Lifetime Annuity is a guaranteed income product, it cannot be
    terminated or cancelled once the contract is finalised and the funds are crystallised.
    The obligation of Oakhaven Pensions is to provide the agreed income for life,
    while the member is obligated to provide accurate identity verification to ensure
    payments reach the correct recipient.


    **Dispute Resolution**

    Any disputes arising from a change in terms will be handled via our internal escalation
    path, moving from general customer service to compliance officers, with final
    recourse to the Financial Ombudsman Service or the Pensions Ombudsman.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: terms_conditions
  source_authority: official
