- id: 60d6ee57-4c5b-57ca-b53e-4aaa3287b2cc
  title: Oakhaven Workplace Pension — privacy and data handling
  body: 'Oakhaven Pensions is committed to the highest standards of data privacy and
    regulatory compliance. Our operations are strictly aligned with the frameworks
    provided by the Financial Conduct Authority (FCA) and The Pensions Regulator to
    ensure the fair treatment of all customers.


    Data Collection and Usage

    We collect and process personal data necessary for the administration of your
    Oakhaven Workplace Pension. This includes identity verification data, contribution
    records, and beneficiary information provided in your ''Expression of Wish''.
    This data is used solely to manage your pension wealth, ensure regulatory compliance,
    and prevent fraudulent activity.


    Security Measures

    To protect your assets and personal information from unauthorised access, we employ
    strict identity verification and multi-factor authentication (MFA) for all state-changing
    actions. Our data handling processes are designed to prevent unauthorised leaks
    and are subject to regular forensic audits. In the event of detected fraudulent
    activity, we will immediately suspend the affected account to protect the member''s
    funds.


    Regulatory Disclosures

    As part of our commitment to transparency, we provide clear disclosures on key
    pension thresholds. This includes the £268,275 lump sum allowance and the upcoming
    inheritance tax changes effective from 6 April 2027. We ensure that members are
    informed of these changes well in advance so they can plan their retirement strategy
    accordingly.


    Third-Party Sharing

    We do not sell your data to third parties. Information is only shared with regulatory
    bodies (such as the FCA or The Pensions Regulator) or the Financial Ombudsman
    Service when required by law or for the resolution of a formal dispute. For further
    details on our risk management, please refer to Oakhaven Workplace Pension — risk
    disclosures.'
