- id: 0d0a70fe-c627-5a9e-9969-cf98a8ab6a8a
  title: Oakhaven Personal Pension — how rates are tiered and applied
  body: 'This rate sheet outlines the application of charges for the Oakhaven Personal
    Pension. For this product, Oakhaven Pensions employs a simplified, non-tiered
    pricing model to ensure absolute clarity for the member.


    Annual Management Charge: 0.6%


    Application of the Rate:

    - This is a flat rate that applies to all account balances, regardless of the
    total fund size. There are no tiers, no volume discounts, and no escalating charges
    based on wealth brackets.

    - The charge is calculated based on the value of the assets under management and
    is deducted periodically from the pension pot.

    - This fee covers the essential costs of professional investment management and
    secure administration.


    Other Key Figures:

    - Basic-rate tax relief of 20% is applied to qualifying contributions.

    - The maximum contribution eligible for tax relief is governed by the annual allowance
    of £60,000.


    No other management rates are applied to this product. Any changes to this flat
    rate will be communicated to members in accordance with our change-of-terms policy.'
  domain: retirement
  product_category: personal_pension
  document_type: rate_sheet
  source_authority: official
