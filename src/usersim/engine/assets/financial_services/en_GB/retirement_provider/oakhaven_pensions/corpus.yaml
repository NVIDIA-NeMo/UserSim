- id: a236243a-be70-5e24-832a-090a5ef14c77
  title: Oakhaven Flexible Drawdown — comparison vs. alternatives and when not to
    choose it
  body: 'Oakhaven Flexible Drawdown is designed for members who desire maximum control
    over how and when they access their retirement savings. Unlike a fixed income
    product, it allows you to tailor your withdrawals to your current lifestyle needs.


    Comparison with Alternatives


    Oakhaven Flexible Drawdown vs. Oakhaven Lifetime Annuity

    The primary difference is Certainty vs. Control. A Lifetime Annuity provides a
    guaranteed income for life, ensuring you can never run out of money. Oakhaven
    Flexible Drawdown, however, allows you to withdraw specific amounts as you need
    them, including the ability to take 25% of your pot as a tax-free lump sum (subject
    to the £268,275 lump sum allowance). While the drawdown approach offers flexibility,
    it carries the risk that if withdrawals are too high, the fund may be depleted
    prematurely.


    Oakhaven Flexible Drawdown vs. Personal Pension

    A Personal Pension is primarily an accumulation vehicle used to build a pot via
    contributions and tax relief. The Flexible Drawdown is the method used to access
    those funds efficiently once you reach the normal minimum pension age of 55.


    When NOT to choose Oakhaven Flexible Drawdown


    This product may not be the right choice if:

    1. You have a low risk tolerance and require a guaranteed income to cover basic
    living expenses; in this case, a Lifetime Annuity is more appropriate.

    2. You intend to continue making large annual contributions to your pension. Once
    you flexibly access your funds, your annual contribution limit for tax relief
    drops to the Money Purchase Annual Allowance (MPAA) of £10,000.

    3. You have not yet reached the normal minimum pension age of 55 (or 57 from 6
    April 2028) and do not have a qualifying reason for early access.


    We mandate the offer of free, impartial Pension Wise guidance to all members eligible
    to access their funds from age 50 to help determine the most suitable path.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 31a5d760-4ff1-56a8-8905-56b13cb51d4e
  title: Oakhaven Flexible Drawdown — normal minimum pension age from 6 April 2028
    explained
  body: 'Q: I have heard the pension age is changing. How does this affect my Oakhaven
    Flexible Drawdown?


    A: The UK government is increasing the normal minimum pension age. From 6 April
    2028, the normal minimum pension age will rise from 55 to 57.


    Q: Will I be blocked from my money if I am 56 in April 2028?



    If you have already started taking flexible withdrawals from your pot before 6
    April 2028, you can generally continue to do so. However, if you have not yet
    accessed your funds, you will likely need to wait until you reach age 57 to begin
    withdrawals, unless you meet specific criteria for an earlier release (such as
    ill-health).


    Q: What should I do if I am planning my retirement around the current age of 55?



    We strongly advise you to review your retirement timeline. If you intend to access
    your funds between 2028 and the time you turn 57, you should seek professional
    guidance. We provide all eligible members from age 50 with access to free, impartial
    Pension Wise guidance to help navigate these regulatory changes.'
  domain: retirement
  product_category: flexible_drawdown
