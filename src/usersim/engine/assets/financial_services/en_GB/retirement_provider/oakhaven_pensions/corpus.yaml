- id: 66ca3346-a340-58ad-aa1d-2e91180c212a
  title: Oakhaven Workplace Pension — recognizing scams targeting this product
  body: 'As you compare retirement options to secure your future, it is vital to remain
    vigilant against the sophisticated scams that target pension savers. Fraudsters
    often prey on those seeking stability and clarity, using high-pressure tactics
    to lure individuals away from trusted providers.


    Common fraud patterns targeting workplace pensions include:


    1. Unsolicited ''Pension Review'' Offers: Scammers may contact you claiming to
    offer a free review of your Oakhaven Workplace Pension, promising significantly
    higher returns than our transparent 0.45% annual management charge. They may claim
    to have ''insider'' knowledge of new government loopholes.

    2. The ''Pension Unlock'' Scam: You may be contacted by individuals suggesting
    you can access your funds before the legal age through an unregulated scheme.
    Please be aware that any offer to ''unlock'' your pension prematurely is a hallmark
    of a scam.

    3. Impersonation: Fraudsters may pose as Oakhaven Pensions employees or representatives
    from your employer''s payroll department to request sensitive data.


    Oakhaven Pensions will never ask you for your full password, your multi-factor
    authentication (MFA) codes, or request that you transfer your funds to an unverified
    personal account via an unofficial channel. Our security model relies on strict
    identity verification and MFA before any state-changing action, such as a withdrawal
    or a beneficiary update, is processed.


    If you encounter a suspicious offer or believe your account has been compromised,
    the first and most critical action is to notify us immediately. This triggers
    an immediate account suspension and a comprehensive forensic investigation to
    protect your assets. We strongly advise that you never share your account details
    with third parties who have contacted you unsolicited. For further guidance on
    keeping your account secure, please refer to Oakhaven Workplace Pension — account
    security best practices.'
  domain: retirement
  product_category: workplace_pension
  document_type: security_advisory
  source_authority: official
