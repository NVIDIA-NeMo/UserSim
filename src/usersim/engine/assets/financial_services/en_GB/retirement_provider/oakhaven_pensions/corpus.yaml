- id: 1db84a59-07fe-5ab6-9cbf-0e1bdf65abb9
  title: Oakhaven Flexible Drawdown — a declined or blocked action
  body: "Symptom: You have attempted to make a withdrawal or change a detail on your\
    \ Oakhaven Flexible Drawdown account, but the action has been declined or blocked.\n\
    \nLikely Causes:\n- Age Restriction: You may be attempting to access funds before\
    \ reaching the normal minimum pension age of 55.\n- Allowance Exhaustion: You\
    \ may have reached the £268,275 lump sum allowance, meaning further tax-free withdrawals\
    \ are blocked and must be processed as taxable income.\n- Verification Failure:\
    \ The multi-factor authentication (MFA) process may have failed, or the identity\
    \ verification provided does not match our secure records.\n- Security Freeze:\
    \ Our systems may have detected unusual activity, triggering an immediate account\
    \ suspension to protect your assets from potential fraud.\n\nWhat to check in\
    \ order:\n1. Verify your age: Ensure you have reached 55. If you are claiming\
    \ an exception for ill-health, ensure the necessary medical documentation has\
    \ been provided and verified by our compliance team.\n2. Check your lump sum limit:\
    \ Review your latest statement to see if you have already utilised the £268,275\
    \ allowance.\n3. Re-attempt verification: Ensure you are using the most current\
    \ contact details for your multi-factor authentication.\n\nResolution:\nIf the\
    \ issue is related to verification, we will guide you through a secure identity\
    \ re-verification process. If the block is due to a security freeze, we will initiate\
    \ a comprehensive forensic investigation. You will be notified of the outcome\
    \ via your secure communication channel. \n\nWhen to escalate:\nIf you believe\
    \ the block is an error and you meet all age and allowance criteria, we will route\
    \ your case to a senior operations specialist and then to a compliance officer\
    \ for an expedited manual review. You can expect a resolution or a detailed status\
    \ update within five UK business days."
