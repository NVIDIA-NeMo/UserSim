- id: a2c4008a-64c3-50c1-a1f5-739035d220d1
  title: Oakhaven Workplace Pension — how rates are tiered and applied
  body: 'The Oakhaven Workplace Pension operates on a non-tiered, transparent pricing
    model. This ensures that all members, regardless of their fund size, benefit from
    the same professional investment management and secure administration.


    Annual Management Charge

    A flat annual management charge of 0.45% is applied to all accounts. There are
    no tiered discounts or premiums based on the total value of the pension pot.


    Application of Rate

    The 0.45% charge is calculated based on the daily value of the fund and is typically
    deducted on a monthly or quarterly basis, depending on the specific corporate
    agreement. This ensures that the cost of administration is proportional to the
    assets under management.


    What Changes the Rate

    As this is a fixed-rate model, the 0.45% charge does not fluctuate based on member
    behaviour or fund performance. Any change to this rate would be communicated in
    accordance with our change-of-terms policy and would be applied across the entire
    product line to maintain transparency and fairness.'
  domain: retirement
  product_category: workplace_pension
