- id: beca1964-f008-588c-b168-61dbfb4d980c
  title: Oakhaven Personal Pension — vs. a similar product here
  body: 'When deciding between the Oakhaven Personal Pension and the Oakhaven Workplace
    Pension, the primary considerations are the source of contributions and the associated
    costs.


    **Oakhaven Personal Pension**

    - **Control:** Fully self-managed.

    - **Cost:** 0.6% annual management charge.

    - **Entry:** Minimum monthly contribution of £50.

    - **Tax Benefit:** 20% basic-rate tax relief.


    **Oakhaven Workplace Pension**

    - **Control:** Employer-sponsored via automatic enrolment.

    - **Cost:** 0.45% annual management charge.

    - **Entry:** Minimum total contribution of 8% of qualifying earnings.

    - **Tax Benefit:** Tax relief applied via payroll.


    **Which one is right for you?**

    - The **Oakhaven Workplace Pension** is the superior choice for those employed
    by a participating company, as it offers a lower management charge (0.45%) and
    the benefit of employer contributions.

    - The **Oakhaven Personal Pension** is ideal for self-employed individuals, those
    whose employers do not provide a scheme, or those who wish to save additional
    funds beyond their workplace contributions with a flexible, independent account.'
  domain: retirement
  product_category: personal_pension
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ffef5708-dd11-54dc-91ff-5bbeb686cf0c
  title: Oakhaven Personal Pension — regulatory disclosures
  body: 'Oakhaven Pensions operates in strict alignment with the frameworks established
    by the Financial Conduct Authority (FCA) and The Pensions Regulator to ensure
    the fair treatment of all customers. This document serves as a formal disclosure
    of the regulatory boundaries and limits affecting the Oakhaven Personal Pension.


    **Tax Relief and Allowances**

    Contributions to this pension benefit from 20% basic-rate tax relief. However,
    this is subject to the Annual Allowance, which is currently £60,000. Contributions
    exceeding this threshold may be subject to tax charges. It is the member''s responsibility
    to manage their total pension contributions across all providers to remain within
    this limit.


    **Lump Sum and Inheritance Tax**

    Members should be aware of the £268,275 lump sum allowance, which limits the total
    amount of tax-free cash that can be crystallised from pension funds. Furthermore,
    please be advised that significant changes to inheritance tax (IHT) effective
    from 6 April 2027 may impact how pension wealth is treated upon death. We recommend
    reviewing your ''Expression of Wish'' regularly to reflect your current intentions.


    **Advice Boundaries**

    Oakhaven Pensions provides educational resources, guidance, and administrative
    support. We do not, under any circumstances, provide regulated financial advice
    or individual tax advice. Our staff cannot recommend specific investment strategies
    or provide a tailored tax plan. To ensure members make informed decisions, we
    mandate the offer of free, impartial Pension Wise guidance to all members eligible
    to access their funds from age 50.


    **Fraud Prevention**

    To protect member assets, we employ rigorous identity verification and multi-factor
    authentication for all state-changing actions. We prioritise scam prevention,
    particularly during the transfer of funds from other providers. Any suspected
    fraudulent activity will trigger an immediate account suspension and a comprehensive
    forensic investigation.'
  domain: retirement
  product_category: personal_pension
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: fc5dcee2-8c92-5eed-90fd-8af6b39cb264
  title: Oakhaven Personal Pension — interest rate / APY schedule
  body: 'Unlike a fixed-term savings account, the Oakhaven Personal Pension is an
    investment-linked product. Therefore, it does not provide a single, guaranteed
    interest rate or APY. The growth of your pension pot depends on the performance
    of the underlying investment funds you select.


    **Fixed Cost Component**

    While investment returns vary, the cost of managing the account is fixed. An annual
    management charge of 0.6% applies to all balances within the Oakhaven Personal
    Pension. This fee is deducted regardless of the fund''s performance to cover professional
    management and secure administration.


    **Growth Drivers**

    Your total return is calculated as: (Investment Growth) - (0.6% Annual Management
    Charge).


    **Changes to Rates**

    Investment values can fluctuate daily based on market conditions. The 0.6% charge
    is reviewed periodically by Oakhaven Pensions to ensure it remains competitive
    and sustainable. Any changes to the fee structure will be communicated to members
    with appropriate notice via the secure online portal.'
  domain: retirement
  product_category: personal_pension
  document_type: rate_sheet
  source_authority: official
