- id: 4c02cbba-3f51-5471-be62-8d1eed14980f
  title: Oakhaven Workplace Pension — account security best practices
  body: 'At Oakhaven Pensions, the protection of your retirement assets is our highest
    priority. The Oakhaven Workplace Pension is subject to rigorous security protocols
    designed to prevent unauthorised access and fraud. To maintain the integrity of
    your account, we require all members to adhere to the following best practices.


    Identity Verification and Authentication

    Strict identity verification and multi-factor authentication (MFA) are mandatory
    before any state-changing action can be performed. This includes, but is not limited
    to, requests for withdrawals, updates to your beneficiary details, or changes
    to your contribution levels. Never share your MFA codes with anyone; Oakhaven
    staff will never ask for your password or one-time passcode over the telephone
    or via email.


    Protecting Against Pension Scams

    We prioritise scam prevention, particularly during the pension transfer process.
    Be wary of any unsolicited contact offering ''guaranteed'' high returns or encouraging
    you to transfer your funds to an external provider quickly. Any request to transfer
    funds out of your Oakhaven Workplace Pension will trigger a comprehensive review
    by our compliance officers to ensure your assets are not at risk.


    Monitoring Your Account

    We encourage you to review your statements regularly via our secure online portal.
    If you notice any unauthorised activity or discrepancies in your records, you
    must report this to us immediately. Fraudulent activity triggers an immediate
    account suspension and a comprehensive forensic investigation to secure your remaining
    funds.


    Official Communication

    Oakhaven Pensions will always communicate through secure channels. If you receive
    an email or text message that seems suspicious, do not click any links. Instead,
    log in to your portal directly or call us during UK business hours (GMT) to verify
    the request. For more information on how we handle security incidents, please
    see Oakhaven Workplace Pension — fraud and unauthorized-activity protection.'
  domain: retirement
  product_category: workplace_pension
  document_type: security_advisory
  source_authority: official
