- id: fcdda86d-340e-5f62-b917-6a0dae2bc58a
  title: Oakhaven Flexible Drawdown — when to switch or upgrade
  body: 'Support agents should advise members on switching to Oakhaven Flexible Drawdown
    when the priority shifts from wealth accumulation to flexible income generation.


    Compared to a personal pension, the Flexible Drawdown is designed for the decumulation
    phase. While a personal pension focuses on growth and tax relief on contributions,
    the Flexible Drawdown allows members to take 25% of their pot as tax-free cash
    (up to the £268,275 lump sum allowance) and withdraw further amounts as needed.


    Compared to an Oakhaven Lifetime Annuity, the Flexible Drawdown offers control
    over the timing and amount of withdrawals, whereas an annuity provides a guaranteed
    lifelong income. A member should switch to Drawdown if they prefer flexibility
    and are comfortable with the risk that the pot could be exhausted. Conversely,
    if the member prioritises absolute security and a guaranteed cheque every month,
    the Lifetime Annuity remains the superior choice.


    Switching to Drawdown triggers the Money Purchase Annual Allowance (MPAA), reducing
    future tax-relieved contributions to £10,000 per year. This trade-off must be
    clearly explained to the member.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: comparison
  source_authority: official
