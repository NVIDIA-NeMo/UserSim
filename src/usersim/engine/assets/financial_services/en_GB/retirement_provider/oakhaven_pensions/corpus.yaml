    a comprehensive fund analysis. We will provide a detailed breakdown of your potential
    tax-free cash (up to 25% of your pot) and a projection of how your fund would
    perform against the £268,275 lump sum allowance.


    As part of this limited-time offer, we will provide a dedicated session with a
    senior operations specialist to ensure you fully understand the impact of the
    £10,000 Money Purchase Annual Allowance (MPAA) before you take your first withdrawal.
    This ensures you do not inadvertently limit your future tax-relieved contributions.
    Contact your account representative today to schedule your review.'
