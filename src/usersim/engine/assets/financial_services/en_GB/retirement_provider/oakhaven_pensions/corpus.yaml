  institution_id: oakhaven_pensions
- id: 79059441-cf33-5fb1-ae02-508e6b52a24c
  title: Oakhaven Personal Pension — pension annual allowance explained
  body: '### What is the pension annual allowance?


    The annual allowance is the maximum amount that you can contribute to your pensions
    each tax year while still remaining eligible for tax relief. For the Oakhaven
    Personal Pension, this limit is currently £60,000.


    ### What happens if I contribute more than £60,000 in a year?


    If your total contributions across all your pension schemes exceed the £60,000
    limit, any amount above this threshold may be subject to a tax charge, effectively
    removing the tax relief you would have otherwise received on the excess.


    ### Does this limit include the tax relief added by the government?


    Yes, the annual allowance includes both your personal contributions and any tax
    relief added to your pot. To ensure you stay within these limits, we recommend
    reviewing your total yearly contributions. For a full overview of our product
    terms, please see Oakhaven Personal Pension — overview.'
  domain: retirement
  product_category: personal_pension
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f0dcb89e-166f-53f2-929d-d9444a1af4ab
  title: Oakhaven Personal Pension — check status or history
  body: 'As an existing member of the Oakhaven Personal Pension, you can easily review
    your retirement savings, contribution history, and the impact of tax relief.


    **What you will need before starting:**

    Your account identity details and your multi-factor authentication (MFA) device.


    **Steps to check your status and history:**


    1. **Request your current balance:** Tell us that you would like to check your
    current pension pot value. We will verify your identity via MFA and then provide
    the exact current balance of your Oakhaven Personal Pension.

    2. **Request a contribution summary:** Ask us for a history of your contributions
    for the current tax year. We will provide a breakdown of your personal payments,
    including confirmation that the minimum monthly contribution of £50 has been met
    where applicable.

    3. **Verify tax relief credits:** Ask us to confirm the amount of basic-rate tax
    relief added to your account. We will calculate and confirm the 20% tax relief
    that has been credited to your pot based on your qualifying contributions.

    4. **Review management charges:** Ask for a summary of the fees deducted from
    your account. We will confirm the application of the 0.6% annual management charge.


    **How you know it worked:**

    You will have a confirmed current balance and a clear list of all contributions
    and tax relief credits applied to your account, ensuring your records align with
    your expectations. For guidance on making changes to these contributions, see
    Oakhaven Personal Pension — make a change or update.'
  domain: retirement
  product_category: personal_pension
  document_type: how_to_guide
  source_authority: official
