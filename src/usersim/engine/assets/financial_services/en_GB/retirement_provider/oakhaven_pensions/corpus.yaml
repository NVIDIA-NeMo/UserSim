- id: de5e7be0-77c8-5524-a39e-eb28c4dc69ab
  title: Oakhaven Workplace Pension — a failed or pending action
  body: 'It may occasionally occur that an action—such as account activation or a
    beneficiary update—appears as ''Pending'' or ''Failed'' within your account status.
    This guide helps you identify the cause and resolve the issue.


    **Common Symptoms**

    - The account status remains ''Pending'' for more than five business days after
    enrolment.

    - A ''Failed'' notification appears after attempting to update personal details
    or beneficiary wishes.

    - An error message stating ''Verification Incomplete'' during the onboarding process.


    **Likely Causes and Checks**


    1. **Identity Verification Failure**: The most common cause for a pending or failed
    action is a mismatch in identity documentation. Check if the photo ID provided
    was clear, current, and matched the name on your employment contract.


    2. **MFA Discrepancy**: If multi-factor authentication was not fully completed,
    state-changing actions will be blocked for security purposes. Ensure your registered
    mobile device or email is accessible.


    3. **Employer Data Lag**: In some cases, the action is pending because the employer
    has not yet transmitted the required payroll data to Oakhaven Pensions.


    **The Fix**

    - **For ID failures**: Provide a new, high-resolution scan of your government
    photo ID through the secure channel. We will re-verify the document and update
    the status.

    - **For MFA issues**: Request a reset of your authentication factors and follow
    the new prompts to secure your account.

    - **For Employer lags**: Confirm with your HR department that your enrolment file
    has been submitted to us.


    **Escalation**

    If the action remains failed after these checks, we will escalate the matter to
    a senior operations specialist. You will receive a case reference number and a
    status update via your secure portal within three UK business days. If the issue
    involves a suspected security breach, the account will be suspended immediately
    for a comprehensive forensic investigation.'
  domain: retirement
  product_category: workplace_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 73017b4e-0852-5b27-83ff-e0a45f81066a
  title: Oakhaven Workplace Pension — eligibility requirements
  body: 'The following matrix outlines the eligibility requirements for enrolment
    into the Oakhaven Workplace Pension scheme.


    | Condition | Outcome |

    | :--- | :--- |

    | Age between 22 and State Pension Age | Eligible for automatic enrolment |

    | Earnings above the lower earnings limit | Eligible for automatic enrolment |

    | Employed by a partner organisation of Oakhaven | Eligible for account setup
    |

    | Employee chooses to ''Opt-Out'' | Enrolment ceased; no further contributions
    |

    | Earnings below the lower earnings limit | Not automatically enrolled (may request
    to join) |


    All eligible members must adhere to the minimum total contribution of 8% to maintain
    the scheme''s standard growth trajectory, which includes the minimum employer
    contribution of 3%.'
  domain: retirement
  product_category: workplace_pension
  document_type: eligibility_matrix
  source_authority: official
