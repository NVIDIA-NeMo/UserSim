- id: 5507b139-dba9-5702-92e4-fc9ab6630761
  title: Oakhaven Flexible Drawdown — account agreement
  body: 'This agreement outlines the binding obligations between Oakhaven Pensions
    and the member regarding the Oakhaven Flexible Drawdown account. Oakhaven Pensions
    commits to professional investment management and secure administration, adhering
    to a transparent, low-cost pricing model. Members are obligated to provide accurate
    identity verification and undergo multi-factor authentication before any state-changing
    action is executed.


    Access to funds is subject to the normal minimum pension age, which is currently
    55. Members must be aware that this age limit will increase to 57 from April 2028.
    Under this agreement, members may access 25% of their pension pot as tax-free
    cash, subject to the lump sum allowance of £268,275. Any withdrawals exceeding
    this tax-free threshold or the lump sum allowance will be subject to the prevailing
    UK income tax rates.


    If a member has previously flexibly accessed their pension, the Money Purchase
    Annual Allowance (MPAA) applies, restricting future annual contributions to £10,000
    to remain eligible for tax relief. This agreement may be terminated by the member
    upon request, provided all verification protocols are met. Oakhaven Pensions reserves
    the right to suspend accounts immediately upon the detection of fraudulent activity
    to trigger a comprehensive forensic investigation.'
