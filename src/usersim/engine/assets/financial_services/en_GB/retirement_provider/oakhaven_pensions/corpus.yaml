- id: 14fa7a0d-9463-5450-adec-8545f8d1cc2f
  title: Oakhaven Lifetime Annuity — a failed or pending action
  body: 'If you have attempted to purchase or activate an Oakhaven Lifetime Annuity
    and the action is showing as ''failed'' or ''pending'', please review the following
    common causes and resolutions.


    Symptom: The application is stalled or marked as ''Pending Verification''.

    Likely Cause: The most common cause is a failure in the identity verification
    or multi-factor authentication (MFA) stage. Because we prioritise the protection
    of member assets, any discrepancy in security credentials will halt the process.

    What to check:

    1. Ensure that your current contact details and identification documents are up
    to date.

    2. Verify that the MFA request was completed within the required timeframe.


    Symptom: The purchase request was ''Declined'' or ''Failed''.

    Likely Cause: The fund amount may be below the required threshold.

    What to check:

    1. Confirm that the total amount intended for the annuity meets the minimum purchase
    price of £10,000.


    Resolution and Escalation:

    If you have confirmed that your identity is verified and your fund exceeds £10,000,
    but the action remains pending, we will raise the case to a senior operations
    specialist. You will receive a notification via the secure portal once the specialist
    has completed a manual review. If the issue persists, the case is escalated to
    a compliance officer to ensure the fair treatment of the customer in line with
    FCA frameworks.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: troubleshooting
  source_authority: official
