  institution_id: oakhaven_pensions
- id: 0c24001e-15ff-5dd7-a263-d06a66ca84e0
  title: Oakhaven Workplace Pension — current offer
  body: 'Oakhaven Pensions is pleased to announce the ''Future-Proof Your Retirement''
    incentive for existing members of the Oakhaven Workplace Pension.


    **The Offer**

    Members who increase their personal contribution level so that the total contribution
    (employee plus employer) reaches 10% of qualifying earnings will receive a one-time
    ''Saver Bonus'' of £50 credited directly to their pension pot.


    **Key Dates**

    - **Offer Start Date**: 1 October 2024

    - **Offer End Date**: 31 December 2024


    **Terms and Conditions**

    To qualify, the increased contribution must be maintained for a minimum of three
    consecutive months. The bonus will be applied to the account following the third
    successful contribution at the new rate. This offer is available to all active
    members currently contributing at the minimum total contribution of 8%.'
  domain: retirement
  product_category: workplace_pension
  document_type: promo_notice
  source_authority: official
  placeholder: true
