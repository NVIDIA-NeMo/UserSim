- id: dd246869-b2ff-58b0-a0ce-507852e13591
  title: Oakhaven Lifetime Annuity — vs. a similar product here
  body: 'When deciding how to access your retirement wealth, the choice often comes
    down to a trade-off between guaranteed security and flexible control. Below is
    a comparison between the Oakhaven Lifetime Annuity and the Oakhaven Flexible Drawdown.


    Oakhaven Lifetime Annuity:

    - Income: Guaranteed for life (e.g., £7,100 per £100,000 at age 65).

    - Risk: The institution carries the investment risk; the member''s income is secure
    regardless of market fluctuations.

    - Access: Fixed income stream; no access to the remaining capital once the annuity
    is purchased.

    - Minimum: Requires a minimum purchase price of £10,000.


    Oakhaven Flexible Drawdown:

    - Income: Variable; based on the amount the member chooses to withdraw.

    - Risk: The member carries the investment risk; the pot could be depleted if withdrawals
    are too high.

    - Access: High flexibility; allows for the withdrawal of up to 25% tax-free cash
    (subject to the £268,275 lump sum allowance).


    Which is right for you?

    Choose the Oakhaven Lifetime Annuity if your primary goal is a guaranteed, lifelong
    income and you wish to avoid the stress of managing investments. Choose Oakhaven
    Flexible Drawdown if you require the ability to vary your income or wish to leave
    a more flexible inheritance.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: comparison
  source_authority: official
