- id: 19222a7f-6fe0-5f60-8cb2-6627c5496bd0
  title: Oakhaven Lifetime Annuity — regulatory disclosures
  body: 'This document provides essential regulatory information regarding the Oakhaven
    Lifetime Annuity. Oakhaven Pensions operates in strict alignment with the frameworks
    set by the Financial Conduct Authority (FCA) and The Pensions Regulator to ensure
    the fair treatment of all customers.


    Taxation and Allowances:

    Members should be aware of the current regulatory limits regarding pension wealth.
    The lump sum allowance, which limits the total amount of tax-free cash that can
    be taken across all pensions, is currently £268,275. Furthermore, members should
    note that inheritance tax changes are effective from 6 April 2027, which may impact
    how pension assets are treated upon death.


    Advice Boundaries:

    Oakhaven Pensions provides educational resources and guidance to help members
    navigate their options. However, we do not provide regulated financial advice
    or individual tax advice. The decision to purchase an annuity is a significant
    financial commitment; therefore, we mandate that all members eligible to access
    their funds from age 50 are offered free, impartial guidance via Pension Wise.


    Dispute Resolution:

    We are committed to a fair and prompt resolution of all disputes. If a member
    is unsatisfied with our internal escalation path (from general customer service
    to senior operations specialists and compliance officers), they have the right
    to escalate their complaint to the Financial Ombudsman Service or the Pensions
    Ombudsman.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: disclosure
  source_authority: official
