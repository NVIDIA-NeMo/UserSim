  institution_id: oakhaven_pensions
- id: d7c996b5-5a40-58b8-a8e9-fbaa0b68f852
  title: Oakhaven Workplace Pension — a discrepancy in your records or statement
  body: 'This guide assists support agents in resolving cases where a customer reports
    a discrepancy in their Oakhaven Workplace Pension records or annual statement.


    Symptom:

    The customer claims that the balance is incorrect, a contribution is missing,
    or the employer''s portion of the funding does not match their payslip.


    Likely Causes:

    - Payroll Lag: There is often a timing difference between when a contribution
    is deducted from a member''s salary and when it is remitted to Oakhaven and credited
    to the account.

    - Contribution Shortfall: The employer may have contributed less than the minimum
    employer contribution of 3%, or the total combined contribution has fallen below
    the 8% minimum.

    - Processing Error: A rare administrative error in the application of the 0.45%
    annual management charge or a misallocation of funds.


    Resolution Steps:

    1. Verify the Timeline: Compare the date of the member''s payslip with the date
    the funds were credited to the Oakhaven account. If the lag is within standard
    business hours (GMT), advise the customer to wait for the next cycle.

    2. Reconcile Contribution Totals: Check if the total contribution meets the 8%
    threshold. If the employer''s portion is below 3%, this is a compliance issue
    that must be flagged.

    3. Audit Fee Deductions: Verify that the annual management charge of 0.45% has
    been applied correctly and not duplicated.

    4. Request Payroll Evidence: If the discrepancy persists, ask the customer to
    provide their most recent three months of payslips for manual reconciliation.


    Escalation Path:

    If the discrepancy cannot be resolved through reconciliation, the case must be
    escalated to a senior operations specialist. If the error is systemic or involves
    a significant sum, a compliance officer will be engaged to ensure the fair treatment
    of the customer in line with FCA frameworks.'
  domain: retirement
  product_category: workplace_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: b4963acc-edaf-599e-a434-98aa6475d617
  title: Oakhaven Personal Pension — overview
  body: 'The Oakhaven Personal Pension is a flexible, self-managed retirement account
    designed for individuals who wish to take control of their long-term financial
    security. Whether you are supplementing a workplace scheme or saving independently,
    this product provides a stable and transparent framework for building your pension
    wealth.


    Key features of the account include a accessible entry point with a minimum monthly
    contribution of £50, allowing you to build a sustainable habit of saving. To support
    your growth, the account benefits from 20% basic-rate tax relief on contributions,
    which effectively increases the amount invested in your pot.


    Oakhaven Pensions maintains a commitment to transparency regarding costs. The
    Oakhaven Personal Pension carries an annual management charge of 0.6%. This fee
    covers the professional investment management of your funds and the secure administration
    of your account, ensuring your assets are handled with regulatory excellence.


    Members should be mindful of the Annual Allowance, which is the maximum amount
    that can be contributed to pensions each year while remaining eligible for tax
    relief. Currently, this limit is £60,000. Exceeding this limit may result in a
    tax charge, and we encourage members to monitor their contributions to remain
    within these boundaries.


    This product is designed for those seeking clarity and stability. While Oakhaven
    Pensions provides extensive educational resources to help you navigate your retirement
    journey, please note that we provide guidance and resources only; we do not offer
    regulated financial advice or individual tax advice. All members eligible to access
    their funds from age 50 are mandated to be offered free, impartial Pension Wise
    guidance to ensure they make informed decisions about their future.


    For a detailed breakdown of the costs associated with this account, please refer
    to the Oakhaven Personal Pension — fee schedule.'
  domain: retirement
  product_category: personal_pension
  document_type: product_sheet
  source_authority: official
