- id: 458a3ce1-9754-52ae-b82e-410264adc2dc
  title: Oakhaven Flexible Drawdown — how rates are tiered and applied
  body: 'Oakhaven Pensions employs a transparent, low-cost pricing model to ensure
    sustainable fund growth for all members. For the Oakhaven Flexible Drawdown product,
    fees are not applied on a tiered basis; instead, a flat annual management charge
    applies regardless of the account balance.


    **Management Fee**

    - **Annual Management Charge**: 0.45%


    This fee covers the essential costs of professional investment management and
    secure administration. The charge is accrued daily and deducted from the fund
    balance periodically. This flat-rate approach ensures that members with larger
    pots are not penalised and that those with smaller pots receive the same high
    standard of professional oversight. There are no hidden exit fees or tiered premiums
    for higher-frequency withdrawals, maintaining the clarity and stability promised
    by the Oakhaven brand.'
  domain: retirement
