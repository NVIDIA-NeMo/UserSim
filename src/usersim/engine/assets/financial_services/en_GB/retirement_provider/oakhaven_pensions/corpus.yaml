- id: 62e5d34a-6de1-5f82-82b6-30842e50bfc1
  title: Oakhaven Workplace Pension — overview
  body: 'The Oakhaven Workplace Pension is a professional, employer-sponsored retirement
    solution designed to provide long-term stability and clarity for both corporate
    employers and their employees. Our approach focuses on regulatory excellence and
    transparency, ensuring that members can navigate the complexities of pension wealth
    with confidence.


    At the core of this product is the commitment to automatic enrolment, ensuring
    that eligible employees are systematically integrated into a sustainable saving
    habit. To support robust fund growth, the scheme mandates a minimum total contribution
    of 8% of qualifying earnings. This total is comprised of contributions from both
    the employer and the employee, with the minimum employer contribution set at 3%
    to ensure a baseline of corporate support for the member''s future.


    We believe in a transparent, low-cost pricing model to prevent unnecessary erosion
    of retirement capital. The Oakhaven Workplace Pension carries an annual management
    charge of 0.45%. These fees are designed to cover the essential costs of professional
    investment management and secure administration, ensuring that your assets are
    managed by experts within a strictly governed framework.


    Members benefit from Oakhaven''s rigorous commitment to security and compliance.
    All accounts are protected by multi-factor authentication and strict identity
    verification protocols. Furthermore, our operations are strictly aligned with
    the frameworks set by the Financial Conduct Authority (FCA) and The Pensions Regulator
    (TPR) to ensure the fair treatment of all customers.


    For those planning their retirement transition, Oakhaven provides extensive educational
    resources. While we provide guidance, we do not offer regulated financial or individual
    tax advice. In accordance with our commitment to member welfare, we mandate the
    offer of free, impartial Pension Wise guidance to all members eligible to access
    their funds from age 50.


    By combining a disciplined fee structure with a commitment to regulatory transparency,
    the Oakhaven Workplace Pension serves as a reliable vehicle for building a secure
    retirement income.'
  domain: retirement
  product_category: workplace_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
