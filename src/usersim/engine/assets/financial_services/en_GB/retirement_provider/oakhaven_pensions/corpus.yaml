- id: 4520e893-5a86-5aad-b5bd-e86cd8bb0b00
  title: Oakhaven Workplace Pension — vs. a similar product here
  body: 'When comparing the Oakhaven Workplace Pension against typical market alternatives,
    the primary differentiators are cost transparency and contribution stability.


    **Oakhaven Workplace Pension**

    - **Annual Management Charge**: 0.45%

    - **Contribution Baseline**: Minimum total contribution of 8% (including a 3%
    minimum employer contribution).

    - **Governance**: Strict alignment with FCA and TPR frameworks.


    **Typical Market Alternative**

    - **Annual Management Charge**: Often ranges between 0.50% and 0.75%, though some
    vary by pot size.

    - **Contribution Baseline**: May follow the legal minimums without the stability
    of the Oakhaven framework.

    - **Governance**: Variable levels of transparency regarding fee breakdowns.


    **Who each suits**

    - **Oakhaven Workplace Pension** is ideal for employers and employees who prioritise
    low, transparent costs and a reassuring, professional environment that simplifies
    the complexities of retirement planning.

    - **Market Alternatives** may be preferable for those seeking niche, highly specialised
    investment funds that may carry higher management charges in exchange for specific
    asset exposure.'
  domain: retirement
  product_category: workplace_pension
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 3ab10254-ab17-54ca-a532-21fbec030c7e
  title: Oakhaven Workplace Pension — regulatory disclosures
  body: 'This document contains essential regulatory disclosures pertaining to the
    Oakhaven Workplace Pension. These disclosures are provided to ensure full transparency
    and compliance with UK financial regulations.


    **Regulatory Alignment**

    Oakhaven Pensions operates in strict accordance with the frameworks established
    by the Financial Conduct Authority (FCA) and The Pensions Regulator (TPR). Our
    operations are audited to ensure the fair treatment of customers and the secure
    management of member assets. All disputes are handled with a commitment to prompt
    resolution, with clear escalation paths to the Financial Ombudsman Service or
    the Pensions Ombudsman.


    **Advice Boundaries**

    Oakhaven Pensions provides educational resources and general guidance to assist
    members in understanding their retirement options. However, we do not provide
    regulated financial advice or individual tax advice. Members are encouraged to
    seek independent professional advice for specific financial planning. To support
    informed decision-making, we mandate the offer of free, impartial Pension Wise
    guidance to all members eligible to access their funds from age 50.


    **Lump Sum and Tax Disclosures**

    Members should be aware of the current regulatory limits regarding pension withdrawals.
    The flexible drawdown method allows for a tax-free cash sum up to the £268,275
    lump sum allowance. Any amounts accessed beyond this allowance may be subject
    to taxation.


    **Future Legislative Changes**

    We wish to bring to the attention of all members that significant inheritance
    tax changes are effective from 6 April 2027. These changes may impact how pension
    wealth is treated for inheritance purposes. We recommend that members review their
    ''Expression of Wish'' documents in light of these upcoming changes.


    **Security and Fraud**

    To protect member assets, strict identity verification and multi-factor authentication
    are required before any state-changing action, including withdrawals or beneficiary
    updates. Any suspected fraudulent activity will trigger an immediate account suspension
    and a comprehensive forensic investigation to safeguard the fund.'
  domain: retirement
  product_category: workplace_pension
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: e1135404-8546-5e20-99ce-4ebd8cf526bd
  title: Oakhaven Workplace Pension — interest rate / APY schedule
  body: 'The Oakhaven Workplace Pension is an investment-based retirement product;
    therefore, it does not offer a fixed interest rate or a guaranteed Annual Percentage
    Yield (APY) as a cash savings account would. Instead, the growth of your pension
    pot depends on the performance of the underlying investments chosen for the scheme.


    **Cost of Management**

    While the rate of return varies based on market conditions, the cost to maintain
    the fund is fixed. A flat annual management charge of 0.45% applies to all members
    regardless of their balance. This fee covers professional investment management
    and secure administration.


    **Growth Factors**

    The eventual value of your pension will be influenced by:

    - The performance of the selected investment funds.

    - The total contributions made (which must be at least 8% of qualifying earnings).

    - The impact of the 0.45% annual management charge over time.


    For a detailed breakdown of these charges, please refer to Oakhaven Workplace
    Pension — fee schedule.'
  domain: retirement
  product_category: workplace_pension
  document_type: rate_sheet
  source_authority: official
  placeholder: true
