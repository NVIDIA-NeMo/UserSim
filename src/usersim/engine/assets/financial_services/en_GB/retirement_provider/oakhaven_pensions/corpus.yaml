- id: 5b6ecd83-a3f6-5699-a5f4-988d13627030
  title: Oakhaven Personal Pension — minimum monthly contribution explained
  body: 'Q: What is the minimum amount I must contribute to my Oakhaven Personal Pension
    each month?

    A: To maintain an active contribution status, the Oakhaven Personal Pension requires
    a minimum monthly contribution of £50. This ensures that the account remains sustainable
    and grows effectively over time.


    Q: Can I pay more than the minimum amount?

    A: Yes. While the minimum is £50, you are welcome to increase your contributions
    at any time, provided your total contributions across all your pensions remain
    within the annual allowance of £60,000.


    Q: What happens if I cannot afford the £50 minimum for a period?

    A: If you are unable to meet the minimum monthly contribution, you should notify
    us. We can discuss options for adjusting your plan or, if necessary, pausing contributions,
    though this may impact your long-term retirement goals. For more details on costs,
    see Oakhaven Personal Pension — cost and charges.'
  domain: retirement
  product_category: personal_pension
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 2efec190-b587-54e0-ae14-b1659214e90a
  title: Oakhaven Personal Pension — cancel, close, or downgrade
  body: 'If you wish to close your Oakhaven Personal Pension, transfer your funds,
    or downgrade your monthly contributions, please follow these steps.


    Before starting, ensure you have your account number ready and have completed
    a recent review of your retirement goals, as closing a pension can have significant
    tax implications.


    1. State your intent: Tell us whether you wish to fully close the account, transfer
    the balance to another provider, or reduce your monthly contributions.

    2. Identity Verification: Complete the mandatory identity verification process
    and multi-factor authentication. We cannot perform any state-changing action on
    your pension assets without this rigorous check.

    3. Confirm Contribution Changes: If you are downgrading, specify the new monthly
    amount. Note that to remain an active contributing member, the amount must be
    at least £50. If you wish to stop contributions entirely while keeping the pot
    intact, specify ''contribution pause''.

    4. Provide Transfer Details: If closing the account via transfer, provide the
    name and receiving reference of the new pension provider. We will then coordinate
    the transfer of funds.

    5. Review Final Statement: We will provide a final summary of the account value,
    including the deduction of any outstanding annual management charge of 0.6%.

    6. Confirmation: Once the action is completed, you will receive a formal confirmation
    notice via your secure online portal.


    If you are considering alternatives, you may find it useful to review Oakhaven
    Personal Pension — vs. a typical competitor offering to ensure this move aligns
    with your financial interests.'
  domain: retirement
  product_category: personal_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 62bb0768-fbcc-529a-a986-400da2df0ca5
  title: Oakhaven Personal Pension — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who report an unexpected
    charge or a discrepancy in their Oakhaven Personal Pension balance.


    Symptom: The customer states that a deduction was made from their account that
    they did not anticipate, or their balance is lower than expected.


    Likely Causes:

    - Periodic deduction of the annual management charge (0.6%).

    - A failed or adjusted monthly contribution (e.g., a payment below the £50 minimum).

    - Tax adjustments related to the £60,000 annual allowance.


    Investigation Steps:

    1. Verify the Charge: Check the transaction history for a fee labelled ''Annual
    Management Charge''. Confirm it equals 0.6% of the average fund value for the
    period.

    2. Check Contribution History: Verify if the customer''s monthly contribution
    met the £50 minimum. If a payment failed, check for automated retry attempts.

    3. Review Tax Relief: Confirm that the 20% basic-rate tax relief has been correctly
    applied to the member''s contributions.

    4. Compare Against Statements: Match the current balance against the most recent
    official statement to identify the exact date the discrepancy occurred.


    Resolution:

    - If the charge is the standard 0.6% fee, explain the fee''s purpose in covering
    professional investment management and secure administration.

    - If a contribution error occurred, correct the record and notify the customer.


    Escalation:

    - If the discrepancy cannot be explained by the 0.6% fee or contribution errors,
    we will raise a case to a senior operations specialist for a forensic balance
    review. The customer will be notified that an investigation is underway and provided
    with an expected resolution timeline.'
  domain: retirement
  product_category: personal_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 42dc0270-5cad-5159-9c4f-04b1f45e93d6
  title: Oakhaven Personal Pension — required documentation
  body: 'To open an Oakhaven Personal Pension and begin benefiting from 20% basic-rate
    tax relief, the following documentation must be provided and verified:


    | Requirement | Document Accepted | Outcome |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Driving Licence | Identity Verified
    |

    | Proof of Address | Utility Bill or Council Tax statement (dated within 3 months)
    | Residency Confirmed |

    | Tax Residency Status | Completed Self-Certification Form | Tax Relief Eligibility
    Established |

    | Funding Source | Bank Account Details (matching member name) | Contribution
    Facility Active |

    | Beneficiary Intent | Completed ''Expression of Wish'' form | Beneficiary Record
    Updated |


    All documents must be clear, legible, and current. Failure to provide any of the
    above will result in the application being held as ''Pending'' until the documentation
    is submitted.'
