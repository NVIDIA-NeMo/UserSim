- id: 7a3286f4-ac3c-5639-9e9a-387f8eda258f
  title: Oakhaven Lifetime Annuity — vs. a typical competitor offering
  body: 'When comparing the Oakhaven Lifetime Annuity to typical competitor offerings
    in the UK market, the primary distinctions lie in transparency and the security
    of the guarantee.


    Stability and Rates

    Many competitors offer ''variable'' annuities or complex tiered structures that
    can be difficult to parse. Oakhaven provides a clear, transparent baseline: for
    a member aged 65, we provide a guaranteed annual income of £7,100 per £100,000
    of fund value. This allows members to calculate their exact lifetime income with
    certainty.


    Accessibility

    While some providers require significantly higher entry points, Oakhaven maintains
    an accessible minimum purchase price of £10,000, making guaranteed income available
    to a wider range of savers.


    Trade-offs

    - Oakhaven Lifetime Annuity: Best for those who cannot afford to lose capital
    and want a guaranteed check for life, regardless of how long they live or how
    the stock market performs.

    - Competitor Flexible Products: Better for those who want to leave a larger inherited
    sum to beneficiaries or who believe they can achieve higher returns through active
    investment.


    Our commitment to regulatory excellence ensures that all disclosures regarding
    the irreversibility of this product are presented prominently, avoiding the ''hidden''
    lock-in periods sometimes found in lower-cost competitor products.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: comparison
  source_authority: official
