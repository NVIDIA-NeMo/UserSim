- id: a6cdfbf5-20e6-5265-a3ea-e01db085d943
  title: Oakhaven Lifetime Annuity — recognizing scams targeting this product
  body: 'As you compare retirement options, it is vital to remain vigilant against
    fraudulent schemes specifically designed to target those seeking the stability
    of a guaranteed income. The Oakhaven Lifetime Annuity is designed for long-term
    security, but scammers often attempt to lure members away from these safe havens
    with unrealistic promises.


    Common red flags include ''unsolicited'' offers to transfer your pension into
    a high-growth investment that claims to provide a guaranteed income significantly
    higher than the £7,100 per £100,000 at age 65 we provide. Be wary of any individual
    or firm claiming they can ''unlock'' your pension funds before the legal age or
    offering to bypass the minimum purchase price of £10,000 through ''special'' loopholes.


    Oakhaven Pensions will never ask you to transfer your funds to a third-party account
    for ''verification'' purposes, nor will we ask for your full security credentials
    or passwords over the telephone or via email. We employ strict identity verification
    and multi-factor authentication for any action that changes the state of your
    account, such as converting a pension pot into an annuity.


    If you are approached by someone claiming to be from Oakhaven Pensions or a partner
    firm offering ''exclusive'' annuity rates that seem too good to be true, do not
    provide any personal information. Instead, report the encounter to us immediately.
    In the event of confirmed fraudulent activity, we will trigger an immediate account
    suspension and launch a comprehensive forensic investigation to protect your assets.


    For those weighing the security of a lifetime annuity against more flexible options,
    we strongly recommend consulting the impartial guidance provided by Pension Wise,
    which we mandate for all members eligible to access their funds from age 50. This
    ensures you have a neutral perspective before making an irrevocable decision about
    your retirement wealth.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 65a51605-267b-57e0-9f50-8ac0c18d3b7a
  title: Oakhaven Lifetime Annuity — limits, restrictions, and edge cases
  body: 'This document provides support agents with the critical constraints and operational
    limits governing the Oakhaven Lifetime Annuity to ensure accurate communication
    with members.


    **Minimum Entry Threshold**

    The minimum purchase price for an Oakhaven Lifetime Annuity is £10,000. Requests
    to purchase an annuity with a fund value below this amount cannot be processed.
    If a member''s pot is slightly under this threshold, they may wish to consider
    continuing contributions to their existing pension until the limit is met.


    **Income Calculations and Age Constraints**

    The standard quoted income of £7,100 per £100,000 is based on a member aged 65
    at the time of purchase (single life, level payment). Any deviation from age 65
    will result in a different income rate; typically, purchasing an annuity at an
    older age will increase the annual payment, while purchasing earlier will decrease
    it.


    **Irrevocability**

    Once a pension fund has been used to purchase an Oakhaven Lifetime Annuity, the
    process is generally irrevocable. The fund is exchanged for a guarantee of income
    for life. Members cannot ''switch back'' to a flexible drawdown arrangement or
    withdraw the original capital once the annuity has commenced.


    **Lump Sum Interactions**

    Members may choose to take a portion of their pension as a tax-free lump sum before
    purchasing an annuity. Agents should remind members that any reduction in the
    capital used to buy the annuity will proportionally reduce the guaranteed annual
    income. For instance, if the member utilizes the 25% tax-free cash option available
    via Oakhaven Flexible Drawdown before purchasing an annuity, the remaining 75%
    is what will be used to calculate the final annuity payment.


    **Beneficiary Restrictions**

    Unless a ''joint life'' annuity is specifically selected, a single life annuity
    ceases upon the death of the member. Agents should ensure members have completed
    an Expression of Wish for their remaining pension assets, though this does not
    override the specific terms of the annuity contract.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 1a59e90d-ae51-513e-a158-cc3a9426c855
  title: Oakhaven Lifetime Annuity — eligibility and setup
  body: '**Who is eligible to purchase an Oakhaven Lifetime Annuity?**

    Any member with a qualifying pension pot who wishes to convert their accumulated
    wealth into a guaranteed, lifelong income stream is eligible. This is often a
    preferred route for those seeking stability over flexibility.


    **What is the minimum amount required to start?**

    To purchase an Oakhaven Lifetime Annuity, the minimum purchase price is £10,000.
    If your fund is currently below this amount, you may wish to explore other retirement
    options or continue growing your pot.


    **How do I begin the setup process?**

    Setup begins with a request for a formal quote. We will then perform strict identity
    verification and multi-factor authentication to protect your assets. Because this
    is a significant financial decision, we mandate that all members eligible to access
    their funds from age 50 are offered free, impartial guidance from Pension Wise
    before proceeding.


    For more details on how this compares to other options, please see Oakhaven Lifetime
    Annuity — comparison vs. alternatives and when not to choose it.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: faq
  source_authority: official
