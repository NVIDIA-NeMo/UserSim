- id: 396f5fb0-5270-56c1-a5f5-47dd2ad169fd
  title: Oakhaven Flexible Drawdown — limits, restrictions, and edge cases
  body: 'This document provides operational guidance for support agents regarding
    the specific constraints and regulatory limits associated with the Oakhaven Flexible
    Drawdown product.


    Age Restrictions

    Access to funds is strictly governed by the normal minimum pension age. Currently,
    members may begin withdrawing funds from age 55. Agents must be aware of the upcoming
    regulatory shift: from 6 April 2028, the normal minimum pension age will increase
    to 57. Any request for drawdown prior to these ages will be declined unless the
    member provides evidence of a protected retirement age or an ill-health exemption.


    Tax-Free Cash and Lump Sum Limits

    Members are entitled to a tax-free portion of their pension, typically 25% of
    the pot. However, this is subject to the lump sum allowance, which is capped at
    £268,275. If a member''s 25% calculation exceeds this £268,275 limit, only the
    amount up to the allowance is tax-free; any amount above this threshold will be
    treated as taxable income.


    Contribution Limits (MPAA)

    Once a member has ''crystallised'' their funds—meaning they have flexibly accessed
    their pension—they are subject to the Money Purchase Annual Allowance (MPAA).
    This significantly reduces the maximum amount they can contribute to their pension
    each year while remaining eligible for tax relief, lowering the limit to £10,000.
    Agents should warn members that taking a flexible payment will trigger this reduced
    allowance for all future contributions.


    Verification Requirements

    No state-changing action, such as a withdrawal request or a change in beneficiary
    via an Expression of Wish, can be processed without strict identity verification
    and multi-factor authentication. This is a non-negotiable security requirement
    to protect member assets from fraud.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: product_sheet
  source_authority: official
