- id: bc9a0378-f310-5cea-8b3b-eafc41d82a10
  title: Oakhaven Personal Pension — a failed or pending action
  body: 'If you have attempted to activate your account or make a contribution and
    the action is showing as ''failed'' or ''pending'', please follow these steps
    to resolve the issue.


    **Symptom: Account activation is pending or failed**


    **Likely Causes:**

    - Identity verification documents were unclear or expired.

    - Multi-factor authentication (MFA) was not completed within the required timeframe.

    - Discrepancy between provided personal details and regulatory records.


    **What to check in order:**

    1. Check your secure messages for a notification requesting a re-upload of your
    identification documents.

    2. Ensure your mobile device is connected to the network to receive MFA codes.

    3. Verify that the name and address provided exactly match your government-issued
    ID.


    **The Fix:**

    If the failure was due to documentation, provide a clear, high-resolution colour
    scan of your ID. If the MFA failed, request a new code and enter it immediately
    upon receipt.


    **Symptom: Monthly contribution (£50 or more) is pending**


    **Likely Causes:**

    - Bank transfer delays or insufficient funds in the originating account.

    - Incorrect bank details provided during setup.


    **The Fix:**

    Verify your bank statement to see if the funds have left your account. If the
    funds have left but are not appearing in your pension, provide us with the transaction
    reference number.


    **Escalation:**

    If the issue remains unresolved after these checks, we will raise a case to a
    senior operations specialist for a manual review. You will receive a status update
    via the secure portal within three UK business days.'
  domain: retirement
  product_category: personal_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ae1118f8-6853-5f51-b807-9af4a6b60321
  title: Oakhaven Personal Pension — eligibility requirements
  body: 'To maintain regulatory compliance and ensure the fair treatment of customers,
    the following eligibility criteria apply to the Oakhaven Personal Pension:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a UK resident | Eligible to open account |

    | Age | Must be 18 years or older | Eligible to open account |

    | Minimum Contribution | Ability to commit to at least £50 per month | Account
    can be activated |

    | Identity Verification | Must pass strict MFA and ID checks | Account can be
    activated |

    | Tax Status | Must have a valid National Insurance number | Eligible for 20%
    tax relief |


    Failure to meet the residency or identity requirements will result in an application
    decline. Applicants unable to meet the £50 minimum monthly contribution may wish
