  institution_id: oakhaven_pensions
- id: 0623a2a6-7f03-5991-833e-01a97d47f697
  title: Oakhaven Lifetime Annuity — make a change or update
  body: 'As the Oakhaven Lifetime Annuity provides a guaranteed income for life, the
    core financial terms cannot be changed. However, you may need to update your personal
    details or your Expression of Wish.


    **Updating Your Expression of Wish**

    An Expression of Wish is a non-binding statement detailing who you would like
    to receive your benefits upon your death. To update this:

    1. Tell us that you wish to update your Expression of Wish.

    2. Provide the full name and relationship of the new beneficiary.

    3. We will perform a security check via multi-factor authentication to verify
    your identity.

    4. We will confirm once the record has been updated in our system.


    **Updating Payment Details**

    To ensure your guaranteed income reaches the correct account:

    1. Tell us you need to change your nominated bank account.

    2. Provide the new account number and sort code.

    3. Undergo our strict identity verification process to protect your assets from
    fraud.

    4. We will confirm when the change is active; this usually takes one payment cycle
    to implement.


    **Updating Contact Information**

    1. Tell us the new address, telephone number, or email address.

    2. We will verify your identity and update your profile.

    3. You will receive a confirmation notification via the secure online portal.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: e0a0645d-b976-54d6-bd97-91f6cd2d51eb
  title: Oakhaven Lifetime Annuity — access or login problems
  body: 'If you are experiencing difficulties accessing the secure online portal to
    view your Oakhaven Lifetime Annuity details, please follow these steps.


    **Symptom: ''Incorrect Credentials'' or ''Login Failed''**

    *   **Likely Cause:** An incorrect password or a typo in the username.

    *   **What to check:** Ensure your Caps Lock is off and that you are using the
    most recent password created.

    *   **The Fix:** Request a password reset. We will send a secure link to your
    registered email address after a successful identity check.


    **Symptom: Multi-Factor Authentication (MFA) Code Not Received**

    *   **Likely Cause:** Network delays or an outdated mobile number on file.

    *   **What to check:** Check your signal strength or verify that you are checking
    the correct device.

    *   **The Fix:** If the code does not arrive within five minutes, tell us. We
    will verify your identity through alternative secure means and help you synchronise
    your MFA device.


    **Symptom: Account Locked**

    *   **Likely Cause:** Too many unsuccessful login attempts, triggering our fraud
    prevention systems.

    *   **What to check:** Check if you have received a security alert email from
    Oakhaven Pensions.

    *   **The Fix:** We must perform a full identity verification before unlocking
    the account. This is a rigorous approach designed to protect your lifetime income
    from unauthorised access.


    **Escalation**

    If these steps do not resolve the issue, we will route your request to a senior
    operations specialist. You will receive a resolution update within two business
    days.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
