- id: ac19fc1e-7070-552e-a3f3-fc3197d9f9dd
  title: Oakhaven Workplace Pension — resolve a common request end-to-end
  body: 'A common request for our members is updating their ''Expression of Wish''.
    An Expression of Wish is a non-binding statement detailing who the member would
    like to receive their pension benefits upon their death. Because this involves
    the ultimate distribution of assets, we apply rigorous verification.


    Follow these steps to resolve this request:


    1. Submit the request: Inform us that you wish to update your Expression of Wish.
    You should state the names and relationships of the beneficiaries you wish to
    nominate.

    2. Undergo identity verification: Because this is a state-changing action, we
    require strict identity verification and multi-factor authentication (MFA). This
    ensures that beneficiary updates are not the result of unauthorised access or
    fraud.

    3. Provide beneficiary details: You will be asked to provide the full legal names
    and current addresses of your nominated beneficiaries. If you wish to split the
    benefit between multiple people, you must specify the percentage each person should
    receive.

    4. Review the non-binding nature of the statement: We will confirm that the Expression
    of Wish is non-binding, meaning it serves as guidance for the pension trustees
    rather than a legal contract.

    5. Receive confirmation: Once the update is processed, we will provide a confirmation
    that your records have been updated.


    By completing these steps, you ensure that your retirement wealth is earmarked
    for your chosen loved ones in accordance with our commitment to regulatory excellence
    and member protection.'
  domain: retirement
  product_category: workplace_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
