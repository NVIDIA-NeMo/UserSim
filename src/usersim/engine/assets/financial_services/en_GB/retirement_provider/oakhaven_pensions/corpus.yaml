- id: 47a6c868-401d-5692-a7bc-699b37736321
  title: Oakhaven Flexible Drawdown — risk disclosures
  body: 'Oakhaven Pensions provides this disclosure to ensure all members understand
    the risks associated with the Oakhaven Flexible Drawdown product. Unlike a lifetime
    annuity, flexible drawdown does not provide a guaranteed income for life; the
    sustainability of your retirement funds depends entirely on the balance of withdrawals
    against investment growth.


    **Investment and Longevity Risk**

    There is a significant risk that you may deplete your pension pot faster than
    anticipated. Market volatility can reduce the value of your remaining funds, and
    taking large withdrawals during a market downturn can permanently impair the long-term
    viability of your retirement wealth.


    **Taxation and Regulatory Risks**

    While 25% of your pot is typically tax-free, this is strictly limited by the lump
    sum allowance of £268,275. Any amount withdrawn beyond this limit, or beyond the
    25% proportion, will be taxed as income. Furthermore, please be aware of the following
    legislative changes:

    - **Minimum Pension Age**: The age at which you can begin accessing your funds
    will increase from 55 to 57 on 6 April 2028.

    - **Inheritance Tax**: Changes to inheritance tax effective from 6 April 2027
    may alter the tax treatment of pension death benefits.


    **Contribution Restrictions**

    Once you have flexibly accessed your pension, you are subject to the Money Purchase
    Annual Allowance (MPAA), which limits your eligible annual contributions to £10,000.
    Exceeding this limit may result in a tax charge.


    Oakhaven Pensions provides educational resources and guidance but does not offer
    regulated financial advice or individual tax advice. We strongly recommend that
    all members consult with a qualified financial adviser or use the free Pension
    Wise service before making significant withdrawal decisions.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: disclosure
  source_authority: official
  placeholder: true
