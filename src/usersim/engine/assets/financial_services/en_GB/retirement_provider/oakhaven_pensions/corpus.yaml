  institution_id: oakhaven_pensions
- id: dc309493-5c23-5cb2-a15f-a9243b3770ea
  title: Oakhaven Lifetime Annuity — interest rate / APY schedule
  body: 'The Oakhaven Lifetime Annuity provides a guaranteed income based on the purchase
    price at the time of contract. Unlike a savings account with a variable APY, an
    annuity provides a fixed lifelong payment.


    Standard Rate Schedule:

    For a single life, level annuity, the benchmark rate is:

    - £7,100 per £100,000 of purchase price (for members retiring at age 65).


    Application of Rates:

    This rate applies to all members meeting the minimum purchase price of £10,000
    who select the basic single-life, level payment option at age 65. The rate is
    guaranteed for the lifetime of the member and will not fluctuate based on market
    performance or interest rate changes once the contract is signed.


    Factors that may alter the final rate:

    - Age: Rates are adjusted based on the member''s age at the date of purchase.

    - Payment Type: Choosing an ''increasing'' annuity (to hedge against inflation)
    will result in a lower starting income compared to the ''level'' rate of £7,100.

    - Joint Life: Adding a spouse or partner to the annuity will reduce the annual
    income to cover the longer expected payout period.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: rate_sheet
  source_authority: official
