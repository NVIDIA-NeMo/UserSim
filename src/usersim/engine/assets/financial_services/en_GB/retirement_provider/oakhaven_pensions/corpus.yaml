- id: c095c5bd-f7a9-5599-be59-00f345b6a194
  title: Oakhaven Flexible Drawdown — check status or history
  body: 'To review your current fund balance, your tax-free cash utilization, or your
    history of withdrawals from your Oakhaven Flexible Drawdown account, please follow
    these steps:


    1. Request a current status update on your pension pot. You should tell us whether
    you require the total current value or specifically the remaining uncrystallised
    balance (the portion that has not yet been accessed).


    2. Ask for a detailed withdrawal history. You can specify the timeframe you are
    interested in, such as the last 12 months or the start of the current tax year.
    We will provide a breakdown of every payment made, including the date and the
    amount.


    3. Request a summary of your tax-free cash usage. We will confirm how much of
    your 25% tax-free entitlement you have already claimed and how much of the £268,275
    lump sum allowance remains available to you.


    4. Review the provided figures. We will present this information clearly, showing
    any payments that were taxable and those that were taken as tax-free cash.


    5. Confirm your understanding of the remaining balance. Once we have provided
    the history and current status, we will ask you to confirm if the records match
    your own. If you notice any discrepancies, we can initiate a record review immediately.


    By following these steps, you can ensure you have a precise understanding of your
    retirement wealth and how your flexible withdrawals are affecting your overall
    pot and future tax allowances.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: how_to_guide
