- id: 1e7664b3-47cc-5729-9ee4-fb1bb892d4cb
  title: Oakhaven Lifetime Annuity — cancel, close, or downgrade
  body: 'It is important to understand that the Oakhaven Lifetime Annuity is a guaranteed
    insurance contract. Once the purchase is complete and the funds have been crystallised,
    the arrangement is generally irreversible. This means you cannot ''cancel'' the
    annuity to retrieve your original pension pot or ''downgrade'' it to a different
    product.


    Requesting a Review of Your Arrangement

    While the core contract is irreversible, you may wish to request a review of your
    account for specific administrative changes or to understand if any optional riders
    (such as inflation-linking or guarantee periods) can be adjusted.


    Step 1: Request an Account Review

    Inform us that you wish to review your Oakhaven Lifetime Annuity arrangement.
    You will need to provide your member ID and pass our multi-factor authentication
    (MFA) checks to verify your identity.


    Step 2: Specification of Request

    Clearly state whether you are seeking to update beneficiary details (via an Expression
    of Wish) or if you are inquiring about the potential to cease payments in favour
    of a different retirement strategy (noting that this is rarely possible for annuities).


    Step 3: Receipt of Options Analysis

    We will provide a written statement detailing the current terms of your annuity
    and confirming whether any modifications are possible under your specific contract.
    This will include a confirmation of your guaranteed income level, such as the
    £7,100 per £100,000 rate if applicable to your age at purchase.


    Step 4: Formal Confirmation

    If a permissible change is identified and agreed upon, we will send a formal confirmation
    document to your secure portal. Once you have digitally signed this, the change
    is applied to your record.


    If you are comparing this irreversibility against more flexible options, please
    refer to Oakhaven Flexible Drawdown — overview.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: how_to_guide
  source_authority: official
