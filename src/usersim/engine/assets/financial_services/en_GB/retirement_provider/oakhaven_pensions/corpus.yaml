- id: 0fc6f95c-cf6d-5200-8ca0-7aae7714913f
  title: Oakhaven Personal Pension — fraud and unauthorized-activity protection
  body: 'At Oakhaven Pensions, the security of your retirement wealth is our primary
    concern. For members of the Oakhaven Personal Pension, we employ a rigorous security
    framework designed to protect assets from unauthorised access and fraudulent activity,
    ensuring your funds remain secure until you are ready to access them.


    Our security model is built upon strict identity verification and the mandatory
    use of multi-factor authentication. These protocols are required before any state-changing
    action can be performed, including withdrawals, updates to your beneficiary details,
    or changes to your contribution levels. By enforcing these hurdles, we significantly
    reduce the risk of unauthorised account takeover.


    Members should be particularly vigilant regarding pension transfer scams. We strictly
    align our operations with FCA and The Pensions Regulator frameworks, prioritising
    scam prevention during any transfer process. A common fraud pattern involves unauthorised
    parties offering ''guaranteed high returns'' or ''early access'' to your pension
    funds before the legal age. Please be aware that Oakhaven Pensions will never
    contact you out of the blue to suggest a high-yield transfer to an external provider
    without a formal, verified request from you.


    Oakhaven Pensions will never ask for your full password or multi-factor authentication
    codes over the telephone or via email. Any request for such information should
    be treated as a fraudulent attempt.


    If you notice any suspicious activity, such as an unexpected notification of a
    change to your contact details or an unauthorised attempt to modify your account,
    you must report it to us immediately. Fraudulent activity triggers an immediate
    account suspension to freeze assets, followed by a comprehensive forensic investigation.
    Prompt reporting is essential to mitigate potential losses and facilitate a fair
    and prompt resolution through our internal escalation paths or, if necessary,
    the Pensions Ombudsman.'
  domain: retirement
  product_category: personal_pension
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 0751dfb6-c0e1-5733-9370-e4341b0958c4
  title: Oakhaven Personal Pension — account agreement
  body: 'This account agreement governs the relationship between Oakhaven Pensions
    and the member regarding the Oakhaven Personal Pension. By opening an account,
    the member agrees to the following binding terms:


    1. Contributions and Minimums: The member agrees to maintain a minimum monthly
    contribution of £50. Failure to maintain this minimum may result in the account
    being flagged for review or, in certain circumstances, the cessation of the active
    contribution facility.


    2. Fees and Charges: Oakhaven Pensions applies an annual management charge of
    0.6% to the total value of the pension pot. This fee covers professional investment
    management and secure administration. This charge is deducted periodically from
    the fund value.


    3. Tax Relief and Allowances: While Oakhaven Pensions facilitates the claiming
    of 20% basic-rate tax relief on contributions, it is the member''s responsibility
    to ensure their total pension contributions across all providers do not exceed
    the annual allowance of £60,000. Excess contributions may be subject to tax charges
    by HMRC.


    4. Member Obligations: The member must provide accurate identity documentation
    and maintain updated contact information to ensure the security of the assets.
    All state-changing actions require successful multi-factor authentication.


    5. Changes to Terms: Oakhaven Pensions reserves the right to amend these terms,
    including the annual management charge. Members will be provided with written
    notice of any material changes to the fee structure or account obligations.


    6. Termination and Closure: The agreement ends upon the full crystallisation of
    funds, the transfer of the pot to another provider, or the death of the member.
    Closure requests are subject to identity verification and standard processing
    timelines. All disputes arising from this agreement will follow the defined escalation
    path to the Financial Ombudsman Service or the Pensions Ombudsman.'
  domain: retirement
  product_category: personal_pension
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: e3a3144c-5ea4-50dd-b187-80e8ef9dd44b
  title: Oakhaven Personal Pension — who it is best for and common use cases
  body: 'The Oakhaven Personal Pension is a flexible, self-managed retirement account
    designed for individuals who seek stability, clarity, and a professional approach
    to building their long-term wealth. Unlike employer-sponsored schemes, this product
    provides the saver with full control over their retirement strategy.


    This product is best suited for:

    - Individuals without access to a workplace pension, or those who wish to supplement
    an existing employer scheme with additional private savings.

    - Self-employed professionals who require a secure, regulated vehicle to manage
    their own retirement funding.

    - Savers who value transparency and a low-cost, predictable fee structure.


    Common Use Cases:

    - Boosting Retirement Income: A saver may use the Oakhaven Personal Pension to
    bridge a projected gap in their retirement income, benefiting from 20% basic-rate
    tax relief on their contributions to accelerate fund growth.

    - Consistent Wealth Building: By setting up a regular monthly contribution (with
    a minimum of £50), members can employ a disciplined approach to saving for the
    long term.

    - Managing Tax Efficiency: High earners may use the account to utilise their annual
    allowance of £60,000, ensuring they maximize the tax advantages of pension contributions.


    Key Financials:

    - Annual Management Charge: 0.6%

    - Minimum Monthly Contribution: £50

    - Basic-Rate Tax Relief: 20%

    - Annual Allowance: £60,000


    For those seeking a different structure, such as a solution provided through an
    employer, please refer to the Oakhaven Workplace Pension — overview.'
