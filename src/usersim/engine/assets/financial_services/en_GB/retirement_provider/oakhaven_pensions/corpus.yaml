- id: 76cda6c0-512d-5632-9104-d1b44b0ad65c
  title: Oakhaven Flexible Drawdown — resolve a common request end-to-end
  body: 'The most common request for this product is the initial withdrawal of the
    tax-free lump sum. Here is the end-to-end process for resolving this request:


    1. Request your tax-free cash: Tell us that you wish to take your tax-free lump
    sum from your Oakhaven Flexible Drawdown account. You should specify if you want
    the full 25% entitlement or a smaller partial amount.


    2. Complete identity verification: We will perform a strict identity check and
    require multi-factor authentication (MFA). This ensures your assets are protected
    and that the request is authorised by you.


    3. Calculation and Disclosure: We will calculate the exact amount of your 25%
    tax-free portion. During this step, we will check this against the £268,275 lump
    sum allowance. We will clearly disclose to you if any part of your requested sum
    exceeds this £268,275 limit and will therefore be subject to income tax.


    4. Confirmation of MPAA Impact: Before the payment is processed, we will provide
    a disclosure explaining that by flexibly accessing your funds, your annual contribution
    limit for tax relief will move to the Money Purchase Annual Allowance (MPAA) of
    £10,000.


    5. Final Approval and Disbursement: Once you have confirmed your agreement to
    the calculations and the tax implications, we will process the payment. The funds
    will be transferred to your verified bank account.


    6. Receipt of Statement: You will receive a confirmation statement showing the
    gross amount withdrawn, the tax-free portion, any tax deducted, and the remaining
    balance of your pension pot.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 71618f34-82a0-51ce-bacb-6ae8f86ac89f
  title: Oakhaven Flexible Drawdown — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that the amount received in their bank account
    does not match the expected withdrawal amount, or their statement shows an incorrect
    remaining balance.


    Likely Causes:

    - Tax Withholding: The customer may have expected a tax-free payment, but the
    amount exceeded the £268,275 lump sum allowance, leading to automatic tax deduction
    by Oakhaven Pensions.

    - Incorrect Tax-Free Percentage: A misunderstanding of the 25% tax-free cash rule,
    where the customer calculated the percentage based on the original pot rather
    than the current value at the time of crystallisation.

    - MPAA Miscalculation: The customer may be questioning why their subsequent contributions
    were capped, not realising that the flexible drawdown triggered the £10,000 Money
    Purchase Annual Allowance.

    - Processing Lag: A recent withdrawal may not yet be reflected in the current
    statement period.


    What to check in order:

    1. Review the Crystallisation Event: Check the exact date and value of the pot
    when the funds were moved into drawdown. Verify that exactly 25% was designated
    as tax-free.

    2. Compare against Lump Sum Allowance: Check if the total tax-free cash taken
    across all pensions exceeds £268,275. If so, verify that the excess was taxed
    correctly.

    3. Audit the Payment Trail: Cross-reference the gross amount approved in the system
    with the net amount sent to the bank, accounting for any tax withheld.


    Resolution:

    If a calculation error is found, we will apply a corrective adjustment to the
    account and issue a revised statement. If the discrepancy is due to tax laws (e.g.,
    exceeding the £268,275 limit), the agent must provide a clear, professional explanation
    of the regulatory requirement.


    When to escalate:

    If the customer disputes the forensic calculation or believes a system error has
    occurred, the case must be escalated to a senior operations specialist for a full
    account audit. The customer will be notified once the audit is complete, typically
    within ten UK business days.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f34f53ef-255e-519e-9867-cda34c554a61
  title: Oakhaven Lifetime Annuity — overview
  body: 'The Oakhaven Lifetime Annuity is designed for individuals who prioritise
    certainty and stability in their retirement. By converting a portion of your pension
    wealth into a guaranteed income stream, you can eliminate the risk of outliving
    your savings, providing peace of mind that a set amount of money will be available
    to you every year for the rest of your life.


    This product is an ideal choice for those who prefer a ''salary-like'' experience
    in retirement rather than the volatility associated with managing an investment
    pot. Our approach is rooted in transparency and regulatory excellence, ensuring
    you understand exactly how your income is generated and maintained.


    Key Financial Specifications:

    - Minimum Purchase Price: To establish a new annuity, a minimum purchase price
    of £10,000 is required. This ensures the scheme remains sustainable and cost-effective
    for all members.

    - Income Illustration: As a benchmark for a single life, level annuity, a member
    retiring at age 65 can expect a guaranteed yearly income of £7,100 for every £100,000
    invested.


    At Oakhaven Pensions, we adhere to a transparent, low-cost pricing model. While
    we offer educational resources to help you understand the benefits of a guaranteed
    income, please note that we do not provide regulated financial advice. We mandate
    that all eligible members who are age 50 or older are offered free, impartial
    guidance through Pension Wise before making a final decision on their retirement
    access.


    For those considering other methods of accessing their funds, such as taking a
    flexible approach to withdrawals, you may wish to review the Oakhaven Flexible
    Drawdown — overview.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 8c030345-ca2f-539b-a836-c654a561ec07
  title: Oakhaven Lifetime Annuity — guaranteed yearly income per £100,000 at age
    65 (single life, level) explained
  body: 'How is the guaranteed yearly income for the Oakhaven Lifetime Annuity calculated?

    Our benchmark rate is based on a ''single life, level'' annuity. This means the
    payments are guaranteed for the lifetime of a single individual and the payment
    amount remains the same (level) throughout the term. For a member starting their
    annuity at age 65, the guaranteed yearly income is £7,100 per £100,000 of the
    purchase price.


    Does this mean I will always receive exactly £7,100 for every £100,000?

    This figure is the standard rate for a 65-year-old under a level, single-life
    contract. The actual income may vary based on your exact age at the time of purchase
    and any optional enhancements you may select. However, once the contract is finalised,
    that yearly amount is guaranteed for life.


    Where can I find more details on the costs associated with this product?

    Detailed information regarding our pricing philosophy and any applicable charges
    can be found in the Oakhaven Lifetime Annuity — fee schedule.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: cc97515e-4e53-5c31-8a37-21d41b5e7f46
  title: Oakhaven Lifetime Annuity — set up and activate
  body: 'Activating your Oakhaven Lifetime Annuity involves a transition from your
    accumulated pension pot to a guaranteed income stream. Please follow these steps
    to complete the setup process:


    1. Request a Personalised Quote: Tell us the total amount you wish to use to purchase
    the annuity. We will provide a quote based on your age and the current market
    rates, using our benchmark of £7,100 per £100,000 at age 65 as a starting point.

    2. Verify Eligibility: Ensure your purchase amount meets the minimum purchase
    price of £10,000. If your funds are currently held in another Oakhaven product,
    such as a personal pension, we will verify the balance.

    3. Identity Verification: Undergo our strict identity verification and multi-factor
    authentication process. This is a mandatory security step to protect your assets
    from unauthorised access.

    4. Confirm Annuity Terms: Review the final offer, including whether the annuity
    is ''single life'' or includes a joint-life option, and whether the payments are
    ''level'' or increasing.

    5. Authorise the Transfer: Confirm that we should crystallise the funds and purchase
    the annuity. We will then process the transaction.

    6. Receive Activation Confirmation: We will provide a written confirmation and
    a payment schedule detailing the dates and amounts of your guaranteed lifelong
    income.


    If you are still weighing this against other options, such as maintaining a flexible
    pot, you may find the Oakhaven Lifetime Annuity — vs. a similar product here useful
    for your comparison.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: how_to_guide
  source_authority: official
