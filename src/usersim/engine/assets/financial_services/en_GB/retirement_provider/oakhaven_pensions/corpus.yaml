- id: 224f3a94-4600-5ae3-9ea8-66b226cd4668
  title: Oakhaven Personal Pension — annual management charge explained
  body: 'Q: What is the annual management charge (AMC) for the Oakhaven Personal Pension?


    A: The annual management charge for this product is 0.6%. This is a transparent,
    low-cost fee that is deducted from your pension pot to cover the essential costs
    of professional investment management and the secure administration of your account.


    Q: How is the 0.6% charge applied to my account?


    A: The charge is calculated based on the value of your pension assets and is deducted
    periodically. This ensures that the fund growth remains sustainable while providing
    you with a high standard of regulatory oversight and security.


    Q: Why is this fee necessary?


    A: The fee allows Oakhaven Pensions to provide professional expertise in fund
    management and maintain a secure online portal and telephone support system, ensuring
    your retirement savings are protected and managed according to FCA and The Pensions
    Regulator frameworks.


    For more information on our overall pricing philosophy, see the Oakhaven Personal
    Pension — overview.'
  domain: retirement
