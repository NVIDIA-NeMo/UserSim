- id: b514354e-e65b-572f-a56c-13f79ada9aa4
  title: Oakhaven Lifetime Annuity — fee schedule
  body: 'Oakhaven Pensions employs a transparent, low-cost pricing model to ensure
    sustainable fund growth and member security. For the Oakhaven Lifetime Annuity,
    the fee structure is as follows:


    - Annuity Purchase Fee: £0.00. There is no upfront commission or fee to purchase
    the annuity; the cost of professional investment management and secure administration
    is integrated into the annuity rate.

    - Annual Administration Charge: £0.00. Once the annuity is established, there
    are no ongoing annual management charges deducted from your guaranteed income
    stream.

    - Minimum Purchase Requirement: A minimum purchase price of £10,000 is required
    to initiate the contract.


    All costs are designed to cover the essential requirements of regulatory compliance
    and secure payment administration, ensuring that the guaranteed income remains
    stable for the duration of the member''s life.'
