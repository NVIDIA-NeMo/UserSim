- id: b1c37016-a50b-57db-aa53-c6179b0113d6
  title: Oakhaven Flexible Drawdown — who it is best for and common use cases
  body: 'Oakhaven Flexible Drawdown is designed for individuals who prioritise control
    and versatility over a guaranteed fixed income. Unlike traditional annuities,
    this product allows you to decide when and how much to withdraw from your pension
    pot, making it an ideal choice for those with fluctuating financial needs in retirement.


    Common use cases include:


    1. **The Tax-Efficient Bridge**: Members may use the product to take a tax-free
    lump sum of 25% (up to the £268,275 lump sum allowance) to clear debts or fund
    a significant purchase, while leaving the remainder invested to provide a taxable
    income stream later.


    2. **Variable Income Management**: For those who wish to supplement a state pension
    or other income sources, flexible drawdown allows for periodic withdrawals. This
    is particularly useful for members who want to keep their taxable income within
    a specific bracket to avoid higher tax rates.


    3. **Legacy Planning**: Because the remaining funds stay invested, members can
    choose to draw only what they need, potentially leaving a larger inheritance to
    beneficiaries. Note that inheritance tax changes effective from 6 April 2027 may
    impact this strategy.


    This product is accessible to members who have reached the minimum pension age
    of 55 (increasing to 57 from April 2028). For those uncertain about the best path,
    we mandate that all eligible members from age 50 are offered free, impartial Pension
    Wise guidance to ensure informed decision-making.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f6e466a8-1bcd-5f8c-8e7d-52b3862f7c14
  title: Oakhaven Flexible Drawdown — lump sum allowance (lifetime cap on tax-free
    cash) explained
  body: '**What is the lump sum allowance?**

    The lump sum allowance is the lifetime limit on the total amount of tax-free cash
    you can take from your pensions. For Oakhaven Flexible Drawdown, this is capped
    at £268,275.


    **How does this interact with the 25% tax-free cash rule?**

    Generally, you can take 25% of your pension pot as a tax-free lump sum. However,
    the total amount of tax-free cash you receive across all your pensions cannot
    exceed the £268,275 limit. If your 25% calculation exceeds this amount, only the
    first £268,275 will be tax-free; any excess will be taxable as income.


    **Does this affect my future contributions?**

    While the lump sum allowance limits your tax-free withdrawals, the act of flexibly
    accessing your pension may trigger the Money Purchase Annual Allowance (MPAA),
    which reduces your annual contribution limit to £10,000.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: b0815033-4d2b-5b1d-9245-69a0691ac7a6
  title: Oakhaven Flexible Drawdown — cancel, close, or downgrade
  body: 'If you have decided that Oakhaven Flexible Drawdown no longer meets your
    retirement goals, you may close your account or transfer your funds to another
    provider. Please be aware that once you have accessed your pension flexibly, your
    annual contribution limit is reduced to the Money Purchase Annual Allowance (MPAA)
    of £10,000.


    **Steps to close or transfer your account:**


    1. **State your intent**: Notify us that you wish to close your account or transfer
    your balance to a different retirement provider. Specify whether you intend to
    withdraw the remaining balance as a lump sum or initiate a pension transfer.


    2. **Complete identity verification**: To protect your assets, we will require
    you to complete a strict identity verification process and multi-factor authentication.
    This ensures that no unauthorised party can initiate a transfer of your wealth.


    3. **Confirm destination details**: Provide the details of the receiving scheme
    or your bank account. If you are transferring to another provider, we will work
    with them to ensure a secure transfer of assets, prioritising the prevention of
    pension scams.


    4. **Final Review**: We will provide a final statement showing the remaining balance,
    any applicable final charges, and the impact on your £268,275 lump sum allowance
    if further tax-free cash is being withdrawn.


    5. **Closure Confirmation**: Once the funds have been successfully transferred
    or paid out, we will send a formal confirmation that your Oakhaven Flexible Drawdown
    account is closed.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: how_to_guide
  source_authority: official
