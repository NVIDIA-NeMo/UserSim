  institution_id: oakhaven_pensions
- id: d777aeb3-5eff-527f-9d93-72d67f55ab74
  title: Oakhaven Lifetime Annuity — minimum pot to buy an annuity explained
  body: 'Q: What is the minimum amount I need in my pension pot to purchase an Oakhaven
    Lifetime Annuity?


    A: To purchase an Oakhaven Lifetime Annuity, you must have a minimum purchase
    price of £10,000. This is the total amount of pension wealth used to secure your
    lifelong income stream.


    Q: Can I combine multiple pension pots to reach this £10,000 minimum?


    A: Yes. If you have several smaller pension accounts, you may consolidate them
    into one before purchasing the annuity. This process of combining funds helps
    you meet the £10,000 threshold required to access this guaranteed income product.


    Q: What happens if my pot is slightly below £10,000?


    A: If your funds are below the £10,000 minimum purchase price, you may not be
    eligible for this specific product. In such cases, we recommend exploring other
    retirement options, such as Oakhaven Flexible Drawdown — overview, or speaking
    with a professional adviser.'
