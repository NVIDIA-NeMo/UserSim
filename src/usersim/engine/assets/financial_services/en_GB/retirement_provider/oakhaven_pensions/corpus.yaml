    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Minimum Fund Value | £10,000 or more | Eligible to purchase annuity |

    | Minimum Fund Value | Less than £10,000 | Ineligible for this product |

    | Identity Verification | Successfully completed MFA | Approved for transaction
    |

    | Identity Verification | Failed or incomplete MFA | Action pending/blocked |

    | Member Age | Age 50 or older | Eligible for Pension Wise guidance prior to purchase
    |


