- id: ddcddd74-7746-533c-bedd-742d0ebf2290
  title: Oakhaven Lifetime Annuity — getting started walkthrough
  body: 'This guide is intended for support agents to assist customers in transitioning
    to the Oakhaven Lifetime Annuity. This product converts a pension pot into a guaranteed,
    lifelong income stream.


    **Step 1: Eligibility and Minimums**

    Confirm that the customer has a pension pot meeting the minimum purchase price
    of £10,000. If the pot is below this threshold, the product is not available.


    **Step 2: Identity Verification**

    Before providing a formal quote, the agent must ensure the customer has completed
    strict identity verification and multi-factor authentication via the secure online
    portal. This is a mandatory step to prevent fraud and unauthorised access.


    **Step 3: Quotation and Illustration**

    Provide the customer with a personalised quote based on their age and health status.
    Use the standard example for a 65-year-old to illustrate the value: a purchase
    of £100,000 would yield a guaranteed annual income of £7,100.


    **Step 4: Guidance Mandate**

    If the customer is aged 50 or over and eligible to access their funds, the agent
    MUST offer them free, impartial guidance from Pension Wise. Oakhaven Pensions
    provides educational resources but does not offer regulated financial or tax advice.


    **Step 5: Finalisation**

    Once the customer accepts the quote, the funds are crystallised and the annuity
    is established. Confirm the payment frequency (monthly, quarterly, or annually)
    and the bank account details for the income stream.


    For a comparison of this product against others, see Oakhaven Lifetime Annuity
    — choosing between tiers or options.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f3ba8bcc-391c-5802-8339-c5216fabedb2
  title: Oakhaven Lifetime Annuity — cost and charges
  body: '**How much does it cost to set up an Oakhaven Lifetime Annuity?**

    There is no separate administrative setup fee for purchasing an annuity. The cost
    of professional investment management and secure administration is incorporated
    into the annuity rate itself. For example, the guaranteed annual income of £7,100
    per £100,000 at age 65 reflects the sustainable cost of providing a guaranteed
    lifetime payment.


    **Are there ongoing annual management charges?**

    Unlike our workplace schemes, which may have an annual management charge of 0.45%,
    the Oakhaven Lifetime Annuity does not charge a separate annual percentage fee.
    The ''cost'' is the difference between the total pot used for purchase and the
    total income paid out over the member''s lifetime.


    **Is there a minimum investment required?**

    Yes, to ensure the sustainability of the fund and the security of the guarantee,
    the minimum purchase price for the Oakhaven Lifetime Annuity is £10,000.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: faq
  source_authority: official
  placeholder: true
