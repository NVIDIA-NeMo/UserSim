- id: 714ebd2e-aaf1-5c38-8149-3c95c2b14fb1
  title: Oakhaven Workplace Pension — check status or history
  body: 'To maintain a clear overview of your retirement wealth, you may request a
    status update or a detailed history of your Oakhaven Workplace Pension. Follow
    these steps to obtain this information:


    1. Request a current statement: Inform us that you wish to review your pension
    status or transaction history. You should specify whether you require a current
    balance summary or a full statement for a specific time period.

    2. Complete identity verification: To protect your assets from unauthorised access,
    we will perform a strict identity verification process. This includes multi-factor
    authentication (MFA) to confirm you are the account holder.

    3. Review your contribution history: We will provide a detailed report showing
    the contributions made by both you and your employer. This will allow you to verify
    that the minimum total contribution of 8% is being met, including the minimum
    employer contribution of 3%.

    4. Confirm the management costs: Your statement will reflect the impact of the
    0.45% annual management charge, ensuring you have full transparency regarding
    the costs of professional investment management.

    5. Verify your beneficiary details: While reviewing your history, it is an opportune
    time to check your ''Expression of Wish''—the non-binding statement detailing
    who you would like to receive your benefits upon your death.


    Once these steps are complete, you will have a comprehensive record of your fund''s
    growth and the contributions made toward your retirement.'
  domain: retirement
