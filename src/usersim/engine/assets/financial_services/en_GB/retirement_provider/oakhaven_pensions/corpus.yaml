- id: 07a26d9a-4f40-50c8-bc8c-d592f93f0b73
  title: Oakhaven Lifetime Annuity — resolve a common request end-to-end
  body: 'Converting your retirement savings into a guaranteed income stream is a multi-step
    process. This guide outlines the end-to-end journey of purchasing an Oakhaven
    Lifetime Annuity.


    **Prerequisites**

    *   A pension pot with a value of at least £10,000 (the minimum purchase price).

    *   Valid government-issued identification for verification.

    *   For those aged 50+, a recommendation to have consulted with Pension Wise for
    impartial guidance.


    **Step-by-Step Process**

    1. **Request a Quote**: Tell us you wish to purchase an annuity. Specify the amount
    of your pot you are using. We will provide you with a quote based on your age;
    for example, if you are 65, we will quote the annual income of £7,100 per £100,000
    of investment.

    2. **Identity Verification**: Once you agree to the quote, we will perform a rigorous
    security check. This involves presenting your identification and completing multi-factor
    authentication (MFA) to ensure the request is legitimate and protects your assets
    from fraud.

    3. **Fund Allocation**: Tell us to proceed with the purchase. We will then move
    the required funds (minimum £10,000) from your pension account to the annuity
    provider''s secure administration.

    4. **Contract Confirmation**: We will provide you with the final annuity contract
    detailing your guaranteed annual income, the payment frequency, and the start
    date.


    **How you know it worked**

    The process is complete when you receive your official annuity schedule and the
    first payment is credited to your nominated bank account. You can then use the
    steps in Oakhaven Lifetime Annuity — check status or history to monitor your future
    payments.


    If at any point the identity verification fails, the action will be blocked for
    your protection, and you will need to follow the steps in Oakhaven Lifetime Annuity
    — a declined or blocked action.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 2af08b48-7b19-5cae-9602-e9748eed20e6
  title: Oakhaven Lifetime Annuity — a discrepancy in your records or statement
  body: 'When a support agent identifies a discrepancy in a member''s annuity records,
    the following diagnostic and resolution path must be followed:


    **Symptom: The member claims the payment amount is lower than the guaranteed quote**

    *   **Likely Cause**: The member may be looking at the net payment (after tax)
    rather than the gross payment. Alternatively, there may be a misunderstanding
    of the £7,100 per £100,000 rate, which is specifically for those purchasing at
    age 65.

    *   **What to check**: Compare the member''s actual payment against the original
    contract. Check if the member''s age at purchase was different from 65, as this
    would change the guaranteed amount.

    *   **The Fix**: Explain the tax deduction clearly. If the gross amount is indeed
    incorrect, raise a case with the senior operations specialists to recalculate
    the payment based on the original contract.


    **Symptom: A scheduled payment has not appeared in the member''s bank account**

    *   **Likely Cause**: Incorrect bank details or a processing delay within the
    banking system.

    *   **What to check**: Verify the bank account details on file against the member''s
    current statement. Check for any ''pending'' flags in the payment system.

    *   **The Fix**: If details are wrong, initiate the identity verification process
    to update the account. If the details are correct but the payment is missing,
    the case is escalated to the compliance officers to investigate a potential payment
    failure.


    **Symptom: The annual statement shows an incorrect total for the year**

    *   **Likely Cause**: A data synchronisation error between the annuity provider
    and the Oakhaven reporting portal.

    *   **What to check**: Manually sum the individual monthly or quarterly payments
    received by the member for the tax year.

    *   **The Fix**: If a discrepancy is found, the agent must request a manual reconciliation
    from the forensic investigation team to correct the record and issue a revised
    statement.


    All disputes regarding payment accuracy are handled promptly, with a clear escalation
    path to the Financial Ombudsman Service or the Pensions Ombudsman if a resolution
    cannot be reached internally.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: aed93b9a-b9d9-5328-9d15-517cf815bf91
  title: Institution-wide fees and charges
  body: "Oakhaven Pensions is committed to a transparent, low-cost pricing model designed\
    \ to ensure sustainable fund growth for all our members. Our fees are structured\
    \ to cover the essential costs of professional investment management and secure\
    \ administration, ensuring that the majority of your assets remain invested for\
    \ your retirement.\n\nWhile specific charges may vary depending on the product\
    \ selected, we maintain a consistent philosophy of clarity and value. For example,\
    \ our Oakhaven Workplace Pension employs an annual management charge of 0.45%\
    \ for workplace schemes. \n\nAll fees are disclosed prominently and transparently\
    \ to ensure members can make informed decisions about their pension wealth. We\
    \ do not believe in hidden costs; any charges applicable to your account will\
    \ be clearly detailed in your annual statements and within the secure online portal.\
    \ For a detailed breakdown of charges specific to your account type, please refer\
    \ to the individual fee schedule associated with your product."
  domain: retirement
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
