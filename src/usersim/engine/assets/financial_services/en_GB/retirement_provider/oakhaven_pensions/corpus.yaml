  institution_id: oakhaven_pensions
- id: a21b88fd-089a-55de-bc21-49523582ef55
  title: Oakhaven Flexible Drawdown — an unexpected charge or amount
  body: 'When a customer reports that the amount received from a drawdown request
    is lower than expected, or an unfamiliar charge appears on their statement, support
    agents should follow this diagnostic path.


    **Common Symptoms**

    - The member received less than the requested 25% tax-free amount.

    - A tax deduction has been applied to a withdrawal that the member believed was
    tax-free.

    - A management fee is higher than the member anticipated.


    **Likely Causes and Verification Steps**

    1. **Lump Sum Allowance Breach**: Check if the member has already utilised a significant
    portion of their £268,275 lump sum allowance. If the 25% withdrawal exceeds this
    lifetime cap, the excess is taxable, resulting in a lower net payment.

    2. **Tax Bracket Shift**: Verify if the withdrawal has pushed the member into
    a higher tax bracket. Amounts taken beyond the 25% tax-free element are treated
    as taxable income.

    3. **MPAA Implications**: Check if the member attempted to make contributions
    exceeding £10,000 after flexibly accessing their funds, which may have triggered
    corrective adjustments or tax charges.

    4. **Annual Management Charges**: Confirm that the 0.45% annual management charge
    (or applicable scheme fee) has been applied correctly according to the fund''s
    balance.


    **Resolution and Escalation**

    If the amount is found to be correct based on the above regulatory limits, explain
    the specific limit (e.g., the £268,275 cap) to the member. If a calculation error
    is suspected, the case must be escalated immediately to a senior operations specialist
    and then to a compliance officer for a forensic review. The member should be notified
    that a formal investigation is underway and provided with an expected resolution
    timeline.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
