  institution_id: oakhaven_pensions
- id: 0707de15-579d-5b46-b6f4-3e35226156ae
  title: Oakhaven Personal Pension — a declined or blocked action
  body: 'If you have attempted to make a change to your Oakhaven Personal Pension—such
    as updating a beneficiary or requesting a withdrawal—and the action was declined
    or blocked, it is usually due to our rigorous security and compliance frameworks.


    **Common symptoms:**

    - An error message stating that the action cannot be completed at this time.

    - A request for additional identity verification that appears repetitive.

    - An account status listed as ''Pending Verification'' or ''Suspended''.


    **Likely causes and what to check:**

    1. **MFA Failure:** Ensure your multi-factor authentication device is connected
    and that you have entered the correct code. A single failed MFA attempt may trigger
    a temporary block on state-changing actions.

    2. **Identity Mismatch:** If you have recently changed your address or name, our
    internal verification may not match your request. Ensure all your contact details
    are current.

    3. **Compliance Hold:** If we detect a pattern that resembles a known pension
    scam, we may proactively block a transfer or withdrawal to protect your assets.
    This is common during transfers to providers with poor regulatory records.


    **The fix:**

    - For MFA or identity issues, provide us with updated government-issued identification
    to reset your verification status. Once we have successfully verified your identity,
    the block will be lifted.

    - For compliance holds, we will conduct a manual review of the requested action.
    You may be asked to provide further evidence of the legitimacy of the request.


    **When to escalate:**

    If the block persists after identity verification, we will raise the case to a
    senior operations specialist and a compliance officer for a detailed review. You
    will receive a notification once the review is complete and the action is either
    approved or permanently declined. For more on our security approach, see Oakhaven
    Personal Pension — fraud and unauthorized-activity protection.'
  domain: retirement
  product_category: personal_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 153226d6-d506-5811-975f-cd2bb289f801
  title: Oakhaven Personal Pension — when to switch or upgrade
  body: 'This guide assists agents in determining when a customer should transition
    from an Oakhaven Personal Pension to another Oakhaven product, specifically the
    Oakhaven Workplace Pension.


    **Comparison of Key Costs:**

    - **Oakhaven Personal Pension:** Features an annual management charge of 0.6%.

    - **Oakhaven Workplace Pension:** Offers a lower annual management charge of 0.45%
    for workplace schemes.


    **When to suggest a switch:**

    - **Employer Matching:** If the customer has joined a company that offers a workplace
    scheme with employer contributions, they should move toward the Oakhaven Workplace
    Pension to benefit from the minimum total contribution of 8% (including employer
    funds), which significantly outweighs the slightly higher cost of a personal pension.

    - **Cost Sensitivity:** For customers with very large pots who are not receiving
    an employer match, the 0.15% difference in annual management charges (0.6% vs
    0.45%) may make the workplace solution more attractive if they are eligible for
    it.


    **When to remain with the Personal Pension:**

    - **Self-Employment:** For individuals without an employer, the Oakhaven Personal
    Pension is the ideal choice, providing a flexible way to secure a 20% basic-rate
    tax relief on contributions starting from just £50 per month.'
  domain: retirement
  product_category: personal_pension
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: da426df5-349a-53ce-b2ad-1ddd181f5e75
  title: Oakhaven Personal Pension — comparison vs. alternatives and when not to choose
    it
  body: 'The Oakhaven Personal Pension is designed for individuals who desire full
    control over their retirement savings, independent of an employer''s scheme. It
    is a flexible, self-managed account that allows you to build wealth at your own
    pace.


    **Why choose the Oakhaven Personal Pension?**

    This product is ideal for the self-employed, those without a workplace pension,
    or individuals who wish to supplement their existing employer-sponsored plan.
    The primary advantage is the ability to benefit from a 20% basic-rate tax relief
    on your contributions, which effectively boosts your savings. It is accessible
    with a minimum monthly contribution of £50, making it a stable entry point for
    individual savers.


    **Comparison with the Oakhaven Workplace Pension:**

    While the Oakhaven Workplace Pension is often more cost-effective—with an annual
    management charge of 0.45% compared to the 0.6% of the Personal Pension—it requires
    an employer''s sponsorship. The Workplace Pension is built around automatic enrolment
    and a minimum total contribution of 8%, whereas the Personal Pension is entirely
    driven by your own contributions.


    **When NOT to choose this product:**

    - **If you have an employer match:** If your employer offers to contribute to
    your pension, a workplace scheme is almost always the superior choice, as the
    employer''s contribution represents an immediate and significant return on your
    investment.

    - **If you cannot meet the minimum:** If you are unable to commit to the minimum
    monthly contribution of £50, this product may not be suitable for your current
    financial circumstances.

    - **If you seek regulated advice:** Oakhaven Pensions provides educational resources
    but does not offer regulated financial or tax advice. If you require a bespoke
    investment strategy, you should consult an independent financial adviser before
    opening this account.


    For further details on how this compares to other options, see Oakhaven Personal
    Pension — overview.'
  domain: retirement
  product_category: personal_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: af62f8cd-6842-56c6-a6f4-8675fc241453
  title: Oakhaven Personal Pension — cost and charges
  body: '### How much does it cost to maintain my Oakhaven Personal Pension?


    We employ a transparent, low-cost pricing model. The Oakhaven Personal Pension
    carries an annual management charge of 0.6%.


    ### What does the 0.6% annual management charge cover?


    This fee covers the essential costs of professional investment management and
    secure administration of your funds. It ensures that your pension is managed by
    experts and that your assets remain protected within our secure infrastructure.


    ### Are there any other hidden fees?


    No. We believe in clarity and transparency. The 0.6% charge is the primary cost
    for the management of your account. For a detailed breakdown of all our pricing,
    please refer to Oakhaven Personal Pension — fee schedule.'
