- id: 335c8e3b-e63f-5680-a838-41e912499a08
  title: Oakhaven Personal Pension — resolve a common request end-to-end
  body: "One of the most common requests for those comparing retirement options is\
    \ setting up a new recurring contribution to maximise their tax efficiency. Here\
    \ is the end-to-end process for establishing a monthly contribution to an Oakhaven\
    \ Personal Pension.\n\n**What you will need before starting:**\nYour bank account\
    \ details and a decision on your monthly contribution amount (which must be at\
    \ least £50).\n\n**Steps to set up your contribution:**\n\n1. **Specify your contribution\
    \ amount:** Tell us the exact amount you wish to contribute each month. To meet\
    \ the product requirements, this must be a minimum monthly contribution of £50.\
    \ \n2. **Provide payment authorization:** Provide us with your bank account details\
    \ and the date of the month you wish the payment to be taken. We will then set\
    \ up the direct debit instruction.\n3. **Confirm tax relief eligibility:** Confirm\
    \ that you are a UK taxpayer. We will then apply the 20% basic-rate tax relief\
    \ to your contributions, which will be added to your pension pot by the government.\n\
    4. **Review the cost disclosure:** We will confirm that your funds will be subject\
    \ to the annual management charge of 0.6%. Once you acknowledge this, the setup\
    \ is complete.\n5. **Verify the first payment:** Ask us to confirm when the first\
    \ contribution will be deducted. We will provide the exact date and the amount\
    \ that will be credited to your account.\n\n**How you know it worked:**\nYou will\
    \ receive a confirmation message stating that your monthly contribution of £50\
    \ (or your chosen higher amount) has been scheduled and that the 20% tax relief\
    \ process has been initiated. For more on the benefits of this product, see Oakhaven\
    \ Personal Pension — overview."
  domain: retirement
  product_category: personal_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 21ebd594-525a-5560-a8aa-acbaa299d1f6
  title: Oakhaven Personal Pension — a discrepancy in your records or statement
  body: 'When assisting a customer who identifies a discrepancy in their Oakhaven
    Personal Pension records or statement, agents should follow a systematic verification
    process to identify the root cause.


    **Common symptoms:**

    - The customer claims a contribution was made but is not appearing in the balance.

    - The 20% basic-rate tax relief does not appear to have been applied to the most
    recent contribution.

    - The account balance is lower than expected after the deduction of fees.


    **What to check in order:**

    1. **Contribution Timing:** Check the date the funds left the customer''s bank
    account. There is often a short administrative lag before the contribution is
    credited to the pension pot. If the payment was made within the last 3-5 business
    days, advise the customer to wait.

    2. **Tax Relief Application:** Verify if the 20% basic-rate tax relief has been
    processed. Tax relief is sometimes credited on a different cycle than the personal
    contribution. Confirm the exact date the relief was added to the account.

    3. **Fee Deductions:** Ensure the customer understands the annual management charge
    of 0.6%. Calculate the charge based on the average pot value to see if the deduction
    aligns with the reported balance.

    4. **Minimum Thresholds:** Check if the contribution met the minimum monthly contribution
    of £50. If a payment was made below this amount, it may have been rejected by
    the system.


    **The fix:**

    - If a contribution is missing, request a bank statement showing the debit and
    manually trigger a trace with the operations team.

    - If tax relief is missing, initiate a request to the compliance team to verify
    the tax claim status.


    **When to escalate:**

    If the discrepancy cannot be resolved through these checks, escalate the matter
    to a senior operations specialist. We will perform a full audit of the account
    and provide the customer with a corrected statement within 10 business days. For
    further guidance, refer to Oakhaven Personal Pension — check status or history.'
  domain: retirement
  product_category: personal_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: e001f745-2cab-5047-bc9f-4135465ae313
  title: Oakhaven Flexible Drawdown — overview
  body: 'Oakhaven Flexible Drawdown is a versatile retirement solution designed for
    members who desire precise control over how and when they access their pension
    wealth. Unlike traditional options that provide a fixed income, this product allows
    you to withdraw funds in a way that adapts to your changing lifestyle and financial
    needs.


    One of the primary advantages of this service is the ability to take a tax-free
    lump sum. Under current regulations, you can typically access 25% of your pension
    pot as tax-free cash. This provides immediate liquidity and flexibility. However,
    please be aware that this is subject to a lump sum allowance of £268,275; any
    amount taken as a tax-free lump sum beyond this threshold may be subject to tax.


    To ensure stability and regulatory excellence, access to funds is subject to age
    requirements. Currently, the minimum pension age is 55. It is important for our
    members to plan for future legislative shifts, as the minimum pension age from
    April 2028 will increase to 57.


    Members should also be mindful of the impact that accessing their pension has
    on future contributions. Once you have flexibly accessed your pension, the Money
    Purchase Annual Allowance (MPAA) applies. This means your annual contribution
    limit for tax relief is reduced to £10,000. This is a critical consideration for
    those who intend to continue working and saving for retirement while simultaneously
    drawing from their funds.


    Oakhaven Pensions operates on a transparent, low-cost pricing model to ensure
    sustainable fund growth, covering the essential costs of professional investment
    management and secure administration. We are committed to helping you navigate
    these complexities with clarity and professional reassurance.


    For a detailed comparison of how this differs from a guaranteed income stream,
    please refer to Oakhaven Flexible Drawdown — vs. a similar product here.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 4fe72ac2-1f44-5549-add6-e1fafecd8939
  title: Oakhaven Flexible Drawdown — tax-free cash (% of the pot) explained
  body: 'Q: How much of my pension pot can I take as tax-free cash using Oakhaven
    Flexible Drawdown?


    A: You can generally withdraw 25% of your pension pot as a tax-free lump sum.
    This allows you to access a significant portion of your wealth without incurring
    an immediate tax liability.


    Q: Is there a limit to how much tax-free cash I can receive?


    A: Yes. While you can take 25% of your pot, this is capped by the lump sum allowance
    of £268,275. If your 25% calculation exceeds this £268,275 limit, the amount above
    this threshold will be taxable.


    Q: Does taking this tax-free cash affect my ability to keep contributing to my
    pension?


    A: Yes. Once you have flexibly accessed your pension (including taking tax-free
    cash), you will likely be subject to the Money Purchase Annual Allowance (MPAA),
    which reduces your annual contribution limit to £10,000. For further details on
    this limit, please see Oakhaven Flexible Drawdown — money purchase annual allowance
    explained.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 35876384-2d3b-564b-a40f-3a27fe8b9ac7
  title: Oakhaven Flexible Drawdown — set up and activate
  body: 'Activating Oakhaven Flexible Drawdown allows you to transition from the accumulation
    phase of your retirement planning to the decumulation phase. This process ensures
    that your assets are protected and that your withdrawals are compliant with HMRC
    regulations.


    Before beginning the activation process, ensure you have your current government-issued
    photo identification and your most recent pension statement ready.


    Step 1: Identity Verification

    You must first complete a rigorous identity verification process. We will request
    your identification documents and require multi-factor authentication. We will
    then confirm once your identity has been securely verified.


    Step 2: Define Your Tax-Free Cash

    Tell us how much of your pot you wish to take as a tax-free lump sum. You can
    take up to 25% of your total fund, provided this does not exceed the lump sum
    allowance of £268,275. We will calculate the exact figure and provide you with
    a confirmation of the tax-free amount you are eligible to receive.


    Step 3: Establish Your Withdrawal Strategy

    Specify whether you wish to take a single lump sum, a regular periodic payment,
    or a combination of both. You will also provide the bank account details where
    the funds should be sent. We will verify that these account details match your
    registered identity to prevent fraud.


    Step 4: Final Confirmation and Activation

    We will provide a final summary of your chosen drawdown strategy, including the
    impact on your annual contribution limits (the MPAA of £10,000). Once you confirm
    your agreement to these terms, we will activate the drawdown facility.


    Your activation is successful when you receive a formal notification confirming
    that your first payment has been scheduled or processed. If you are unsure whether
    this is the right path for you, we mandate the offer of free, impartial Pension
    Wise guidance to all members eligible to access their funds from age 50.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ba18b673-2393-5489-800a-c113ff4f289a
  title: Oakhaven Flexible Drawdown — fee schedule
  body: 'Oakhaven Pensions employs a transparent, low-cost pricing model to ensure
    that the growth of your retirement fund is not unduly eroded by administrative
    costs. The following fee structure applies to the Oakhaven Flexible Drawdown product:


    - Annual Management Charge: 0.45% (This fee covers the essential costs of professional
    investment management and secure administration of the scheme).

    - Withdrawal Processing Fee: £0.00 (We do not charge a fee for the execution of
    standard drawdown withdrawals).

    - Account Maintenance Fee: Included in the Annual Management Charge.


    All fees are deducted directly from the fund value. Our commitment to transparency
    ensures there are no hidden charges or complex tiered pricing for the administration
    of your flexible drawdown account.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: fee_schedule
  source_authority: official
