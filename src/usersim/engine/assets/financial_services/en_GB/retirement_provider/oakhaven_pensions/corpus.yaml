- id: 804eea51-b985-51e9-a599-bb8477beb002
  title: Oakhaven Workplace Pension — limits, restrictions, and edge cases
  body: 'This document provides support agents with a technical summary of the operational
    limits and regulatory constraints governing the Oakhaven Workplace Pension.


    Contribution Thresholds:

    The product operates on an automatic enrolment basis. The minimum total contribution
    must be 8% of qualifying earnings. Within this total, the minimum employer contribution
    is set at 3%. Any arrangement falling below these percentages does not meet the
    standard product criteria and must be flagged for compliance review.


    Cost Structure:

    A flat annual management charge of 0.45% is applied to all workplace schemes.
    This fee covers professional investment management and secure administration.
    Agents should ensure customers understand that this is a low-cost, transparent
    pricing model designed for sustainable growth.


    Regulatory Limits and Edge Cases:

    - Annual Allowance: Members must be mindful of the Annual Allowance, which is
    the maximum amount that can be contributed to pensions each year while remaining
    eligible for tax relief, currently £60,000. Contributions exceeding this may trigger
    tax charges.

    - Opt-Outs: While automatic enrolment is the default, members have a statutory
    right to opt out. Support agents must follow the strict identity verification
    process before processing an opt-out request to prevent fraud.

    - Transfer Restrictions: In alignment with FCA and The Pensions Regulator frameworks,
    we prioritise scam prevention. Any request to transfer funds to another provider
    will undergo rigorous due diligence.

    - Employment Termination: When a member leaves their employer, the account typically
    remains as a preserved pension. Agents should guide the member on whether to leave
    the funds with Oakhaven or consolidate them.


    For a broader view of the product''s core features, refer to Oakhaven Workplace
    Pension — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
