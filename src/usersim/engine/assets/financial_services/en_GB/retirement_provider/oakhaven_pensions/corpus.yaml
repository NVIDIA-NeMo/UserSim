- id: dc4cc103-60f5-508f-a1eb-91e01a8a55dd
  title: Oakhaven Workplace Pension — make a change or update
  body: 'Updating your Oakhaven Workplace Pension ensures that your retirement strategy
    remains aligned with your financial goals. Whether you wish to increase your contributions
    or update your personal details, follow these steps.


    Updating Contribution Levels

    If you wish to increase your contributions beyond the minimum total contribution
    of 8%, follow these steps:

    1. Tell us the new percentage of your qualifying earnings you wish to contribute.

    2. We will verify your identity using multi-factor authentication to ensure the
    request is authorised.

    3. We will confirm the new total contribution percentage and notify your employer
    to adjust the payroll deductions.

    4. You will receive a confirmation message via the secure portal once the change
    is active.


    Updating Beneficiaries (Expression of Wish)

    To update who should receive your benefits upon your death:

    1. Provide the full name and relationship of the new beneficiary.

    2. We will perform a security check to verify your account ownership.

    3. We will update your non-binding ''Expression of Wish'' statement in our records.

    4. We will provide a confirmation that the update has been successfully processed.


    Updating Contact Information

    1. Tell us the new address, telephone number, or email you wish to use.

    2. We will verify your identity through our secure authentication process.

    3. We will update your record and send a notification to your old contact method
    to alert you of the change.


    For assistance with more complex changes, such as closing an account, please refer
    to Oakhaven Workplace Pension — cancel, close, or downgrade.'
  domain: retirement
