- id: c652b3ac-76fd-5641-867c-eae949ae1744
  title: Oakhaven Workplace Pension — comparison vs. alternatives and when not to
    choose it
  body: 'Choosing the right retirement vehicle depends on your employment status and
    your goals for stability and clarity. The Oakhaven Workplace Pension is designed
    as a trusted, employer-sponsored solution.


    Why Choose the Oakhaven Workplace Pension?

    - Employer Contributions: Unlike personal accounts, this product features automatic
    enrolment where your employer contributes to your future. With a minimum total
    contribution of 8%, including a minimum employer contribution of 3%, your pot
    grows faster than it would through sole individual effort.

    - Low, Transparent Costs: We compete on transparency with a low-cost annual management
    charge of 0.45%. This ensures that a larger portion of your wealth remains invested
    for your retirement.

    - Regulatory Excellence: Our operations are strictly aligned with FCA and The
    Pensions Regulator frameworks, providing a secure environment for your long-term
    savings.


    When NOT to Choose This Product:

    - If You Are Self-Employed: As this is an employer-sponsored solution, it is not
    available to those without a participating employer. In this case, an Oakhaven
    Personal Pension would be more appropriate.

    - If You Require Total Control Over Contributions: While the 8% minimum total
    contribution is a benchmark for stability, some investors prefer the absolute
    flexibility of a self-managed account where they dictate every penny of the input
    without relying on a corporate structure.

    - If You Are Seeking Regulated Financial Advice: Oakhaven Pensions provides educational
    resources and guidance, but we never offer regulated financial advice. If you
    require a bespoke investment strategy tailored to your individual tax position,
    you may need an external advisor, although we mandate the offer of free, impartial
    Pension Wise guidance to all members eligible to access funds from age 50.


    For those seeking a flexible, self-managed alternative, see Oakhaven Personal
    Pension — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
