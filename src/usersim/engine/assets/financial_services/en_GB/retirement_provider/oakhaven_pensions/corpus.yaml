- id: e18a5b27-6e93-5e98-a32e-80a9932e6829
  title: Oakhaven Workplace Pension — cost and charges
  body: 'Q: How much does it cost to maintain my Oakhaven Workplace Pension?

    A: We employ a transparent, low-cost pricing model. The annual management charge
    for our workplace schemes is 0.45%. This fee covers the essential costs of secure
    administration and professional investment management to help your fund grow sustainably.


    Q: Are there any hidden fees or tiered charges based on my balance?

    A: No. Our commitment to clarity means we do not use hidden fees. The 0.45% annual
    management charge is the primary cost for managing your workplace pension. For
    a detailed breakdown, you can refer to Oakhaven Workplace Pension — annual management
    charge explained.


    Q: How is the annual management charge deducted?

    A: The charge is deducted directly from your pension fund, meaning you do not
    need to make separate manual payments to keep the account active.'
  domain: retirement
