    | Identity Verification | Completed & Verified | Eligible to proceed |

    | Identity Verification | Pending or Failed | Ineligible until verified |

    | Age | 50+ | Eligible (Pension Wise guidance must be offered) |

    | Age | Under 50 | Generally ineligible unless in specific circumstances (e.g.,
