- id: f6ebe2cc-7d39-566c-bbae-0f815228b181
  title: Oakhaven Workplace Pension — risk disclosures
  body: 'The Oakhaven Workplace Pension is subject to the regulatory frameworks of
    the Financial Conduct Authority (FCA) and The Pensions Regulator (TPR). Members
    must be aware of the following risks and disclosures:


    Investment Risk

    As with all pension investments, the value of your fund can go down as well as
    up. You may get back less than you invested. Past performance is not a reliable
    indicator of future results. The 0.45% annual management charge is deducted regardless
    of fund performance to cover the essential costs of professional management.


    Taxation and Allowances

    Pension wealth is subject to UK tax laws. Members should be mindful of the £268,275
    lump sum allowance, which limits the amount of tax-free cash that can be taken
    from the pension. Additionally, be advised that inheritance tax changes effective
    from 6 April 2027 may impact how pension assets are treated upon death. Oakhaven
    Pensions provides educational resources on these matters but does not offer individual
    tax advice.


    Scam Prevention and Transfers

    Pension transfers are high-risk activities. Oakhaven Pensions prioritises scam
    prevention and will conduct rigorous checks on any external provider before allowing
    funds to be moved. We mandate the offer of free, impartial Pension Wise guidance
    to all members eligible to access their funds from age 50 to protect them from
    making uninformed decisions.


    Regulatory Compliance

    Our operations are strictly aligned with regulatory frameworks to ensure the fair
    treatment of customers. Any disputes regarding the management of the Oakhaven
    Workplace Pension can be escalated to the Financial Ombudsman Service or the Pensions
    Ombudsman after our internal compliance process has been exhausted.'
