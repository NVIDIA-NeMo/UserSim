- id: 1ed8c05f-c047-5dd5-a3df-aed1a4d911dd
  title: Oakhaven Workplace Pension — choosing between tiers or options
  body: 'When deciding how to build your retirement wealth, it is important to compare
    the Oakhaven Workplace Pension with other options, such as our Personal Pension.


    Oakhaven Workplace Pension

    This is an employer-sponsored solution. The primary advantage is the combined
    contribution: you benefit from a minimum total contribution of 8%, which includes
    a minimum employer contribution of 3%. It is highly efficient for those whose
    employers offer automatic enrolment, and it maintains a low annual management
    charge of 0.45%.


    Oakhaven Personal Pension

    This is a flexible, self-managed account. While it does not feature employer contributions,
    it benefits from 20% basic-rate tax relief on contributions. This is often the
    better choice for individuals who are self-employed or those who wish to supplement
    their workplace savings with additional, private pots.


    Who should choose what?

    - Choose the Oakhaven Workplace Pension if you are employed and want to maximise
    the ''free money'' provided by your employer''s 3% minimum contribution.

    - Choose the Oakhaven Personal Pension if you require a self-managed account or
    need to save for retirement outside of a corporate structure. For a detailed comparison,
    see Oakhaven Workplace Pension — vs. a typical competitor offering.'
  domain: retirement
