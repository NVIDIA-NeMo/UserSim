- id: 6e41eb08-8539-5c5b-9dbf-34c5373deeb8
  title: Oakhaven Personal Pension — recognizing scams targeting this product
  body: 'As you compare retirement options, it is vital to remain vigilant against
    fraudulent activity. Scammers often target individuals with personal pensions
    by promising ''guaranteed'' high returns or offering ''pension liberation''—the
    idea that you can access your funds before the legal age through a loophole. Please
    be aware that any offer to ''unlock'' your pension early in exchange for an upfront
    fee is almost certainly a scam.


    Common red flags include unsolicited phone calls from individuals claiming to
    be from Oakhaven Pensions or another financial institution, and high-pressure
    tactics demanding an immediate decision. Scammers may use official-looking documents
    or professional-sounding language to mimic our tone, but they will often encourage
    you to move your funds to an unregulated provider to avoid tax.


    Oakhaven Pensions will never ask you for your full password, your multi-factor
    authentication (MFA) codes, or request that you transfer your pension to an external
    account via an unsolicited telephone call. We employ strict identity verification
    and MFA for all state-changing actions, such as withdrawals or beneficiary updates,
    to protect your assets from unauthorised access.


    If you receive a suspicious call or email, do not provide any personal details
    and end the communication immediately. To protect your retirement wealth, you
    should promptly notify us of any such contact. If you believe your account has
    been compromised, we will trigger an immediate account suspension and launch a
    comprehensive forensic investigation to secure your funds.


    For more information on our protective measures, please see Oakhaven Personal
    Pension — fraud and unauthorized-activity protection.'
  domain: retirement
  product_category: personal_pension
  document_type: security_advisory
  source_authority: official
  placeholder: true
