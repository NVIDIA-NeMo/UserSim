- id: 8ee5b49b-f139-50a4-9c0c-be4193482f80
  title: Oakhaven Lifetime Annuity — privacy and data handling
  body: 'Oakhaven Pensions is committed to the highest standards of data protection,
    strictly aligned with FCA and The Pensions Regulator frameworks to ensure the
    fair treatment of all customers.


    **Data Collection and Usage**

    We collect and process personal data specifically to administer your Oakhaven
    Lifetime Annuity and ensure the accurate delivery of your guaranteed income. This
    includes your name, date of birth, tax residency status, and bank account details.
    This data is used solely for the purposes of fulfilling our contractual obligations
    and adhering to UK pension legislation.


    **Secure Handling**

    All member data is stored within a secure environment. Access is strictly controlled,
    and any state-changing action—such as a change to your payment details—requires
    multi-factor authentication and rigorous identity verification. This approach
    is essential to protect your retirement assets from fraud and unauthorised access.


    **Data Retention and Third Parties**

    We retain your records for the duration of the annuity payment period and for
    a subsequent period as required by regulatory law. We do not sell your data to
    third parties. Data is only shared with regulatory bodies, such as HMRC for tax
    reporting, or with your nominated beneficiaries as outlined in your Expression
    of Wish.


    **Your Rights**

    Members have the right to request a copy of the data we hold about them via the
    secure online portal. For more information on our general security approach, see
    Oakhaven Lifetime Annuity — account security best practices.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: disclosure
  source_authority: official
  placeholder: true
