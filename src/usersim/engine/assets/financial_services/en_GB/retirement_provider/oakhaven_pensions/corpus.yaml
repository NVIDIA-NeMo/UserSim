- id: 90cbdc75-7776-5de3-8e6b-0507c86c1e21
  title: Oakhaven Lifetime Annuity — an unexpected charge or amount
  body: 'Support agents should use this guide when a member reports that their annuity
    payment is lower than expected or contains an unfamiliar deduction.


    Symptom: The member states that the monthly or annual payment received does not
    match the guaranteed amount specified in their contract.


    Likely Causes:

    1. Tax Deductions: Annuity income is generally taxable. If the member''s tax code
    has changed or if they have exceeded their personal allowance, HMRC may require
    a higher deduction at source.

    2. Payment Timing: A payment may appear ''short'' if it is a pro-rata payment
    following the start date of the annuity.

    3. Incorrect Bank Details: While rare, a partial payment could occur if there
    was a failure in the electronic transfer system.


    Steps to Resolve:

    1. Verify the Guaranteed Rate: Check the member''s original contract to confirm
    the guaranteed income. For instance, verify if they were granted the £7,100 per
    £100,000 rate based on their age at the time of purchase.

    2. Review Tax Records: Compare the gross payment amount against the net amount
    received. If the gross amount is correct but the net is low, verify the current
    tax code applied to the account.

    3. Check Payment History: Review the transaction log for any previous underpayments
    or overpayments that may have triggered a balancing adjustment in the current
    period.


    Escalation Path:

    If the gross payment is mathematically incorrect based on the guaranteed rate,
    the agent must raise a case with the senior operations specialists for a payment
    audit. The member should be informed that a forensic review of the calculation
    will take place. If the discrepancy is related to tax and remains unresolved,
    the member may be directed to HMRC or, for formal complaints, to the Financial
    Ombudsman Service.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
