- id: 9d4774db-446a-5ae1-a2e8-77e97302b175
  title: Oakhaven Workplace Pension — vs. a typical competitor offering
  body: 'When comparing the Oakhaven Workplace Pension to typical competitor offerings
    in the UK market, the primary distinctions lie in fee transparency and contribution
    stability.


    Cost Structure

    Many competitors use tiered pricing or complex fee bundles. Oakhaven Pensions
    employs a straightforward, low-cost model with an annual management charge of
    0.45%. This provides members with greater clarity on how much of their wealth
    is being retained for growth versus administration.


    Contribution Framework

    While some schemes allow for very low minimums, Oakhaven ensures a robust foundation
    with a minimum total contribution of 8%. By mandating a minimum employer contribution
    of 3%, we ensure that the burden of saving is shared and that the fund has a sustainable
    growth trajectory.


    Who Each Suits

    - Oakhaven Workplace Pension: Best for those who prioritise transparency, regulatory
    excellence (FCA/TPR), and a disciplined, low-cost approach to retirement.

    - Typical Competitor: May be suitable for those seeking highly aggressive, non-standard
    investment vehicles that accept lower minimum contributions but often carry higher
    or more opaque management fees.


    For a more detailed look at our internal options, see Oakhaven Workplace Pension
    — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: comparison
