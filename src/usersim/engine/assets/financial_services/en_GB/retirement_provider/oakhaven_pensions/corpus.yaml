- id: ee509941-49d8-5085-812a-04c35a334f14
  title: Oakhaven Lifetime Annuity — how rates are tiered and applied
  body: "The Oakhaven Lifetime Annuity uses a proportional rate model based on the\
    \ member's age at the time of purchase and the total fund value. \n\nStandard\
    \ Rate Application\nFor a member purchasing the annuity at age 65, the applicable\
    \ rate is a guaranteed annual income of £7,100 per £100,000 of the purchase price.\
    \ This rate is applied linearly to the total fund value.\n\nCalculation Example:\n\
    - If a member invests the minimum purchase price of £10,000 at age 65, their annual\
    \ income would be £710.\n- If a member invests £200,000 at age 65, their annual\
    \ income would be £14,200.\n\nFactors Affecting the Rate\n1. Age: Rates are generally\
    \ higher for members who purchase the annuity at an older age, as the expected\
    \ payout period is shorter.\n2. Options: Choosing a 'Joint Life' annuity (to provide\
    \ for a spouse) or a 'Guaranteed Period' (to ensure payment for a set number of\
    \ years) will typically reduce the annual income rate compared to a 'Single Life'\
    \ annuity.\n3. Inflation Linking: Choosing an annuity that increases annually\
    \ with inflation will result in a lower starting income than a 'level' annuity."
