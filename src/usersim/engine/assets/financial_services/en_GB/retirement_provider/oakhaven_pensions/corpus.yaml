- id: d8e1cc15-2430-5fc2-8be9-9671078b5e32
  title: Oakhaven Lifetime Annuity — choosing between tiers or options
  body: "When deciding how to access your retirement wealth, the choice often comes\
    \ down to the desire for guaranteed security versus flexible access. \n\n**Oakhaven\
    \ Lifetime Annuity**\n*   **Structure:** A contract that converts your pot into\
    \ a guaranteed income for life.\n*   **Certainty:** Provides a fixed amount, such\
    \ as £7,100 per £100,000 of investment at age 65, regardless of how long you live.\n\
    *   **Requirement:** Minimum purchase price of £10,000.\n*   **Best for:** Those\
    \ who prioritise stability, wish to eliminate the risk of outliving their money,\
    \ and prefer a predictable budget.\n\n**Oakhaven Flexible Drawdown**\n*   **Structure:**\
    \ You keep your funds invested and withdraw as needed.\n*   **Certainty:** Variable;\
    \ the income depends on investment performance and withdrawal rates.\n*   **Best\
    \ for:** Those who want a versatile access method or need to take larger lump\
    \ sums for specific goals.\n\nWhile Flexible Drawdown offers versatility, the\
    \ Oakhaven Lifetime Annuity is the superior choice for members seeking an absolute\
    \ guarantee of income until the end of their life."
  domain: retirement
