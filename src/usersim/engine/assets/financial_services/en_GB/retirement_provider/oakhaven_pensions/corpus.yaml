- id: 5b3dfc70-922f-5af1-bc8f-6bd51af4cf24
  title: Oakhaven Lifetime Annuity — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Oakhaven
    Lifetime Annuity. Members are urged to read these risks carefully before proceeding
    with the purchase.


    Irreversibility Risk

    Unlike a flexible drawdown account, the Oakhaven Lifetime Annuity is a permanent
    exchange of a capital sum for a guaranteed income. Once the minimum purchase price
    of £10,000 (or more) is paid and the contract is signed, you generally cannot
    retrieve the original capital. You cannot switch back to a different retirement
    product.


    Inflation Risk

    Unless a specific inflation-linked option is selected at the time of purchase,
    the nominal value of your guaranteed income (e.g., the £7,100 per £100,000 at
    age 65) will remain the same throughout your life. Over time, the purchasing power
    of this fixed amount may decrease as the cost of living rises.


    Lump Sum Allowance

    Members should be mindful of the £268,275 lump sum allowance. While an annuity
    provides income, any tax-free cash taken prior to or during the crystallisation
    process counts towards this lifetime limit. Exceeding this allowance may result
    in additional tax charges.


    Inheritance Tax (IHT) Changes

    Be advised that inheritance tax regulations are subject to change. Specifically,
    please be aware of the inheritance tax changes effective from 6 April 2027, which
    may affect how pension wealth is treated for IHT purposes upon the death of the
    member.


    Advice Boundary

    Oakhaven Pensions provides these educational resources and guidance for your information.
    However, we do not provide regulated financial advice or individual tax advice.
    We mandate that all members eligible to access their funds from age 50 are offered
    free, impartial guidance from Pension Wise to ensure they make an informed decision.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: disclosure
  source_authority: official
