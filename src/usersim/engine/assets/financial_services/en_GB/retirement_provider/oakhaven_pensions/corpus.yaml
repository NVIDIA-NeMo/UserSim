- id: 92635d31-6a41-5335-bad9-3977c7b0e3d3
  title: Oakhaven Flexible Drawdown — interest rate / APY schedule
  body: 'Because Oakhaven Flexible Drawdown is an investment-based product rather
    than a fixed-term deposit account, it does not have a single flat interest rate
    or APY. Instead, the growth of your funds is determined by the performance of
    the underlying investment portfolios you have selected.


    The rate of return is variable and depends on the asset allocation of your fund.
    These returns are credited to your account based on the daily movement of the
    market and the professional management of the assets. All growth is subject to
    the Annual Management Charge of 0.45%.


    Your actual yield will be influenced by:

    - The specific investment fund chosen (e.g., cautious, balanced, or adventurous).

    - Market volatility and economic conditions.

    - The timing and frequency of your withdrawals.


    We provide quarterly statements detailing the performance of your selected funds
    so you can monitor the growth of your wealth relative to your withdrawal rate.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: rate_sheet
  source_authority: official
