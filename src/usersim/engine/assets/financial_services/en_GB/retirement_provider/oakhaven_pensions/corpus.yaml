- id: 97aa3481-d60e-55a2-bf73-4f947799170f
  title: Oakhaven Lifetime Annuity — check status or history
  body: 'Once your Oakhaven Lifetime Annuity is active, you can easily monitor your
    guaranteed income and payment history. Follow these steps to review your records:


    1. **Request a Payment Summary**: Tell us you would like to see your payment history
    for the current tax year. We will then generate a summary of all annuity payments
    made to your nominated bank account.

    2. **Verify Guaranteed Income**: Ask us to confirm your current annual income
    figure. We will verify this against your original contract (for example, confirming
    the £7,100 per £100,000 rate if you purchased at age 65) to ensure your payments
    are accurate.

    3. **Review Tax Deductions**: Request a breakdown of the tax withheld from your
    annuity payments. We will provide the gross payment amount and the specific amount
    deducted for income tax, ensuring the net payment matches your bank statement.

    4. **Confirm Payment Schedule**: Ask us to confirm the date and frequency of your
    next payment (e.g., monthly or annually). We will provide the scheduled date and
    the exact amount to be credited.


    **How you know it worked**

    You will receive a confirmation message or a digital statement within our secure
    environment detailing the payment dates, the gross income, and the net amount
    received. If the figures match your bank records, your annuity status is up to
    date.


    If you notice any discrepancies between these figures and your own records, please
    refer to Oakhaven Lifetime Annuity — a discrepancy in your records or statement
    for guidance on how to resolve the issue.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 072aa6ea-6673-5624-ab77-f71c25dae22a
  title: Oakhaven Lifetime Annuity — a declined or blocked action
  body: 'If you have attempted to purchase an Oakhaven Lifetime Annuity and the action
    was declined or blocked, it is typically due to one of the following reasons:


    **Symptom: ''Purchase request declined due to insufficient funds''**

    *   **Likely Cause**: Your current pension pot is below the minimum purchase price
    of £10,000.

    *   **What to check**: Review your latest statement to see if your total available
    balance meets the £10,000 requirement.

    *   **The Fix**: You must either increase your pension contributions to reach
    the threshold or consider an alternative retirement product that does not have
    a minimum entry price.


    **Symptom: ''Action blocked for security verification''**

    *   **Likely Cause**: Our system was unable to complete the required multi-factor
    authentication or identity verification. Given the irrevocable nature of annuities,
    we maintain a rigorous security posture to prevent fraud.

    *   **What to check**: Ensure that your contact details (mobile number and email)
    are current and that you have access to the device used for authentication.

    *   **The Fix**: Provide us with a fresh set of verified identification documents.
    Once our compliance officers have reviewed the documents and MFA is successful,
    the block will be lifted.


    **Symptom: ''Request flagged for compliance review''**

    *   **Likely Cause**: The transaction has been flagged by our scam prevention
    frameworks, possibly due to an unusual transfer pattern or a request to move funds
    to a high-risk destination.

    *   **What to check**: Confirm if you have been contacted by any third-party ''advisers''
    promising unrealistic returns.

    *   **The Fix**: We will route your case to a senior operations specialist and
    a compliance officer. You will be asked to confirm your intentions via a secure
    telephone call during UK business hours (GMT) to ensure you are not being targeted
    by a scam.


    If the issue remains unresolved after these steps, we will escalate the matter
    to our senior management team for a final determination.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: a99060c5-99b8-5f5f-8901-e15e2f516dda
  title: Oakhaven Lifetime Annuity — when to switch or upgrade
  body: 'Support agents should advise members that the Oakhaven Lifetime Annuity is
    fundamentally different from flexible products. Because an annuity is a contract
    for guaranteed income, ''switching'' or ''upgrading'' once the product is active
    is generally not possible.


    **Annuity vs. Flexible Drawdown**

    *   **Oakhaven Lifetime Annuity**: Provides a guaranteed, lifelong payment (e.g.,
    £7,100 per £100,000 at age 65). This is the best choice for members who prioritise
    absolute certainty and cannot afford the risk of their funds running out.

    *   **Oakhaven Flexible Drawdown**: Allows members to keep their funds invested
    and withdraw varying amounts. This is better for those who need access to larger
    lump sums or wish to leave a larger inheritance.


    If a member currently holds a personal pension and is deciding whether to ''upgrade''
    to an annuity, they should be reminded that while the annuity offers stability,
    it removes the flexibility to change their income level in the future. Always
    ensure the member has been offered Pension Wise guidance before they commit to
    the annuity''s irrevocable structure.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 4d055cf1-c54e-57c6-9682-846aa7c22d32
  title: Oakhaven Lifetime Annuity — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing how to access your retirement wealth is a critical decision. The
    Oakhaven Lifetime Annuity provides a secure, guaranteed income for life, but it
    is not the right choice for every saver.


    **The Core Proposition**

    The primary appeal of the Oakhaven Lifetime Annuity is the elimination of ''longevity
    risk''—the fear of outliving your money. For example, a member purchasing the
    annuity at age 65 can expect a guaranteed annual income of £7,100 per £100,000
    of fund value. This amount is paid regardless of how the stock market performs
    or how long the member lives.


    **Comparing the Alternatives**

    *   **Vs. Flexible Drawdown**: While Oakhaven Flexible Drawdown allows you to
    take 25% tax-free cash (up to the £268,275 lump sum allowance) and keep the rest
    invested for flexible withdrawals, it carries the risk that the pot could be exhausted.
    The Lifetime Annuity trades this flexibility for a guarantee.

    *   **Vs. Personal Pension**: A personal pension allows you to continue contributing
    and benefiting from 20% basic-rate tax relief. An annuity, however, is the final
    stage of the process—you are spending the pot to buy the income.


    **When NOT to choose the Oakhaven Lifetime Annuity**

    You may wish to avoid this product if:

    1.  **You require capital access**: Once you pay the minimum purchase price of
    £10,000 (or more) to secure an annuity, you cannot withdraw a lump sum from that
    capital in the future.

    2.  **Inheritance is a priority**: Standard single-life annuities typically cease
    upon the member''s death. If leaving the maximum possible wealth to beneficiaries
    is your primary goal, a drawdown approach may be more suitable.

    3.  **You anticipate significant inflation**: Unless an inflation-linked option
    is chosen, a level annuity provides the same nominal amount every year, which
    may lose purchasing power over decades.


    We strongly encourage all members eligible to access funds from age 50 to seek
    free, impartial guidance from Pension Wise to ensure this product aligns with
    their specific needs.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 383eed27-c2f7-5579-8b19-f1940e21625c
  title: Oakhaven Lifetime Annuity — how-to / step-by-step
  body: '**How do I get a quote for an annuity?**

    Simply tell us you would like an annuity quote. We will ask for the amount of
    your pension pot you intend to use (which must be at least £10,000) and your current
    age to calculate your guaranteed annual income.


    **What happens after I accept a quote?**

    Once you accept, we initiate a strict identity verification process, including
    multi-factor authentication. We will then coordinate the transfer of funds from
    your pension pot to secure the annuity contract.


    **How long does the setup take?**

    Once identity verification is complete and the funds are received, the annuity
    is typically activated within a few business days, and your guaranteed payments—such
    as the £7,100 per £100,000 at age 65—will begin according to your chosen schedule.


    For a detailed walkthrough of this process, see Oakhaven Lifetime Annuity — resolve
    a common request end-to-end.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: faq
  source_authority: official
