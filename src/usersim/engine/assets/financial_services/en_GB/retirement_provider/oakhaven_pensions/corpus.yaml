  institution_id: oakhaven_pensions
- id: f54f33ff-670a-527f-91db-354644f81144
  title: Oakhaven Workplace Pension — eligibility and setup
  body: 'Q: How do I know if I am eligible for the Oakhaven Workplace Pension?

    A: This product is available to employees of companies that partner with Oakhaven
    Pensions. If your employer uses our services, you are typically enrolled automatically
    via the automatic enrolment process, provided you meet the statutory eligibility
    criteria.


    Q: What happens during the setup process?

    A: Once enrolled, your account is established with a minimum total contribution
    of 8% of your qualifying earnings. We will confirm the split between your contributions
    and the minimum employer contribution of 3%.


    Q: I am already using the product; can I change how I am set up?

    A: Yes. While the minimums must be maintained for the scheme''s stability, you
    can often increase your contribution levels. To make a change, please refer to
    Oakhaven Workplace Pension — make a change or update.'
  domain: retirement
