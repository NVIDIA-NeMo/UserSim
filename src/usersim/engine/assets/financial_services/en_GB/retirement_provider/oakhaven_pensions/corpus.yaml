- id: 7d8824a3-198c-513f-a667-f314a78e5eac
  title: Oakhaven Flexible Drawdown — privacy and data handling
  body: 'Oakhaven Pensions is committed to the highest standards of data privacy and
    regulatory compliance. All Oakhaven Flexible Drawdown accounts are managed in
    strict alignment with the frameworks set by the FCA and The Pensions Regulator
    to ensure the fair treatment of all customers.


    Data Collection and Verification:

    To prevent fraud and unauthorised access to member assets, we employ a rigorous
    identity verification process. This includes the collection of government-issued
    identification and the use of multi-factor authentication (MFA) for all sensitive
    transactions. This data is processed securely and used solely for the purpose
    of protecting your funds and complying with Anti-Money Laundering (AML) legislation.


    Privacy Protections:

    Your personal and financial data, including details regarding your use of the
    £268,275 lump sum allowance and your withdrawal history, is stored in encrypted
    environments. Access is restricted to authorised personnel within our senior operations
    and compliance teams.


    Regulatory Disclosures:

    Members are advised that tax treatment depends on individual circumstances and
    may be subject to change. Oakhaven Pensions provides educational resources and
    guidance but does not offer regulated financial advice or individual tax advice.
    We mandate that all members eligible to access their funds from age 50 are offered
    free, impartial Pension Wise guidance.


    Data Handling in Disputes:

    In the event of a dispute or suspected fraud, Oakhaven Pensions may share relevant
    data with the Financial Ombudsman Service, the Pensions Ombudsman, or forensic
    investigators as part of a comprehensive investigation to recover assets. We maintain
    a transparent record of all state-changing actions to ensure a fair and prompt
    resolution of all member queries.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: disclosure
  source_authority: official
