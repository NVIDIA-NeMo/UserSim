  institution_id: oakhaven_pensions
- id: a19c6edb-e76c-5852-8e3c-0f4aeaa8545e
  title: Oakhaven Personal Pension — limits, restrictions, and edge cases
  body: "This document provides internal guidance for support agents regarding the\
    \ operational constraints and regulatory limits applicable to the Oakhaven Personal\
    \ Pension.\n\nContribution Limits and Requirements:\nMembers are required to maintain\
    \ a minimum monthly contribution of £50. Contributions below this threshold cannot\
    \ be processed as a recurring monthly instruction. In terms of upper limits, the\
    \ Oakhaven Personal Pension is subject to the annual allowance, which is the maximum\
    \ amount that can be contributed to pensions each year while remaining eligible\
    \ for tax relief; this is currently £60,000.\n\nTax Relief and Charges:\nThe product\
    \ provides a basic-rate tax relief of 20% on qualifying contributions, which is\
    \ added to the pension pot to accelerate growth. The cost of maintaining this\
    \ account is governed by an annual management charge of 0.6%, which covers professional\
    \ investment management and secure administration.\n\nEdge Cases and Regulatory\
    \ Restrictions:\nAgents must ensure that members are aware that exceeding the\
    \ £60,000 annual allowance may result in a tax charge. Furthermore, any member\
    \ who has flexibly accessed their pension will be subject to the Money Purchase\
    \ Annual Allowance (MPAA), which reduces their contribution limit to £10,000.\
    \ \n\nWhen assisting customers with transfers, agents must prioritise scam prevention\
    \ and verify the destination fund's regulatory status. No withdrawal or beneficiary\
    \ update can be performed without successful multi-factor authentication and identity\
    \ verification. For further details on account setup, refer to Oakhaven Personal\
    \ Pension — eligibility requirements."
  domain: retirement
  product_category: personal_pension
  document_type: product_sheet
  source_authority: official
