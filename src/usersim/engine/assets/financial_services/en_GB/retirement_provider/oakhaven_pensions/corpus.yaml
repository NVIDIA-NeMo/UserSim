- id: e9d91bcd-8b24-5815-9321-aae3c208a8e4
  title: Oakhaven Flexible Drawdown — recognizing scams targeting this product
  body: 'As you consider the Oakhaven Flexible Drawdown, it is vital to be aware of
    the specific fraud patterns that target individuals seeking flexibility in their
    retirement income. Because this product allows for the withdrawal of funds, it
    is often a primary target for ''pension liberation'' scams.


    A common tactic involves scammers contacting you with offers of ''unlocked'' pensions
    or ''guaranteed'' high returns if you transfer your funds to a new, unregulated
    scheme. They may claim that they have a legal loophole allowing you to access
    your money before the normal minimum pension age of 55. Please be aware that any
    firm promising you access to your pension funds before you reach this age, or
    claiming they can ''beat'' the tax system, is likely operating a scam.


    Another red flag is the ''too good to be true'' investment opportunity. Scammers
    may suggest that moving your Oakhaven Flexible Drawdown funds into a specific
    high-yield asset will secure your future. They often use high-pressure tactics,
    insisting that the opportunity is time-limited to prevent you from seeking impartial
    guidance.


    Oakhaven Pensions will never ask you to transfer your pension to another provider
    via a cold call or an unsolicited email. We will never ask for your full password,
    your multi-factor authentication codes, or your private security keys over the
    telephone. If you are contacted by someone claiming to represent us or another
    provider promising immediate access to your wealth, do not provide any personal
    details.


    If you suspect a scam or if you have already shared your details, you must notify
    us immediately. Fraudulent activity triggers an immediate account suspension and
    a comprehensive forensic investigation to protect your assets. We also strongly
    recommend that all members eligible to access their funds from age 50 utilize
    the free, impartial Pension Wise guidance before making any significant transfer
    decisions.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: security_advisory
  source_authority: official
