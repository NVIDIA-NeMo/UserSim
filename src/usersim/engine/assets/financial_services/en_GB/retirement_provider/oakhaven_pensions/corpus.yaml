- id: ef3d5187-c8e1-505f-befe-e15bf442039f
  title: Oakhaven Flexible Drawdown — normal minimum pension age explained
  body: "Q: When can I start taking money out of my Oakhaven Flexible Drawdown account?\n\
    \nA: You can generally begin accessing your pension funds once you reach the normal\
    \ minimum pension age, which is currently 55. \n\nQ: What happens if I try to\
    \ withdraw funds before I reach age 55?\n\n\nAccessing pension funds before the\
    \ normal minimum pension age is usually only permitted in very specific circumstances,\
    \ such as severe ill-health. In most other cases, doing so is considered an 'unauthorised\
    \ payment' and can result in very high tax charges from HMRC, as well as leaving\
    \ you vulnerable to scams. We recommend that all members eligible to access their\
    \ funds from age 50 seek free, impartial guidance from Pension Wise to ensure\
    \ they make an informed decision.\n\nFor more details on upcoming changes to these\
    \ ages, please refer to Oakhaven Flexible Drawdown — normal minimum pension age\
    \ from 6 April 2028 explained."
