- id: e6c9df66-ebde-5950-8883-4f9134d4efbc
  title: Oakhaven Workplace Pension — annual management charge explained
  body: 'What is the annual management charge for the Oakhaven Workplace Pension?

    The Oakhaven Workplace Pension employs a transparent, low-cost pricing model with
    an annual management charge of 0.45%. This percentage is deducted from the fund
    to cover the essential costs of professional investment management and secure
    administration, ensuring the sustainable growth of your retirement pot.


    How is the 0.45% charge applied to my account?

    The charge is calculated based on the value of your pension assets and is typically
    deducted on a periodic basis. This ensures that you only pay for the management
    of the funds currently held within the scheme.


    Does this fee change over time?

    While we strive for stability, fees may be reviewed to ensure they remain competitive
    and cover operational costs. Any changes to the 0.45% charge would be communicated
    to you with a minimum of 30 days'' notice. For a full breakdown of all costs,
    please see Oakhaven Workplace Pension — fee schedule.'
