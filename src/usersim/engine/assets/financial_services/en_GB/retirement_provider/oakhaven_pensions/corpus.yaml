- id: 3e132b20-8bf6-5ef8-8470-1879ecc5e090
  title: Oakhaven Workplace Pension — change-of-terms policy
  body: 'This policy outlines the conditions under which Oakhaven Pensions may amend
    the terms and conditions governing the Oakhaven Workplace Pension. We are committed
    to transparency and regulatory excellence, ensuring that any changes to our service
    model or pricing are communicated clearly and fairly.


    Amendments to Fees and Charges

    Oakhaven Pensions reserves the right to review and adjust the annual management
    charge, currently set at 0.45%, to ensure the continued sustainability of professional
    investment management and secure administration. Any increase to this charge will
    be preceded by a formal notice period of at least 30 days. This notice will be
    delivered via the secure online portal and confirmed by email.


    Regulatory Adjustments

    Terms may be updated to ensure continued alignment with the frameworks set by
    the Financial Conduct Authority (FCA) and The Pensions Regulator. Such changes
    may include updates to how we disclose the £268,275 lump sum allowance or adjustments
    necessitated by inheritance tax changes effective from 6 April 2027. These regulatory
    updates are mandatory and will be applied to all accounts to ensure the fair treatment
    of customers.


    Contribution Requirements

    Changes to the minimum total contribution of 8% or the minimum employer contribution
    of 3% are typically driven by legislative changes to automatic enrolment. In such
    events, Oakhaven Pensions will update the scheme rules and notify both the corporate
    employer and the individual member accordingly.


    Member Rights upon Change of Terms

    If a member disagrees with a proposed change to the terms, they maintain the right
    to request a transfer of their pension wealth to another provider. Such transfers
    are subject to our strict scam prevention checks. For a comprehensive understanding
    of your current agreement, please refer to Oakhaven Workplace Pension — account
    agreement.'
