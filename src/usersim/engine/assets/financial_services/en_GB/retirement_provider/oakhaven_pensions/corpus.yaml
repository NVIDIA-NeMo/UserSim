- id: 7c34f3eb-a789-5c2b-97c6-506e41f1000e
  title: Oakhaven Workplace Pension — getting started walkthrough
  body: 'This guide provides the necessary steps for support agents to assist new
    members in the onboarding process for the Oakhaven Workplace Pension. Ensure the
    customer understands that this is an employer-sponsored solution utilizing automatic
    enrolment.


    Step 1: Verification and Onboarding

    Begin by performing strict identity verification. Once the identity is confirmed,
    assist the member in setting up their secure online portal account. Multi-factor
    authentication must be activated immediately to protect the member''s future assets.


    Step 2: Confirming Contribution Levels

    Explain the contribution structure to the member. Confirm that the scheme adheres
    to a minimum total contribution of 8%. Specifically, verify that the employer
    is meeting the minimum employer contribution of 3%. If the member wishes to contribute
    more than the minimum required to accelerate their retirement savings, guide them
    on how to set this preference within the portal.


    Step 3: Fee Disclosure

    Transparently disclose the cost of the scheme. Inform the member that the Oakhaven
    Workplace Pension employs a low-cost pricing model with an annual management charge
    of 0.45%. Explain that this fee covers professional investment management and
    secure administration to ensure sustainable fund growth.


    Step 4: Beneficiary Designation

    Advise the member to complete an ''Expression of Wish''. Explain that this is
    a non-binding statement detailing who they would like to receive their pension
    benefits upon their death. This is a critical step for ensuring the member''s
    wealth is handled according to their preferences.


    Step 5: Final Confirmation

    Confirm that the member has received all regulatory disclosures, including information
    on the £268,275 lump sum allowance. For further details on the product''s core
    features, refer to Oakhaven Workplace Pension — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: product_sheet
  source_authority: official
