- id: 8e36b2b2-2c8f-5220-8945-b1928185088f
  title: Oakhaven Workplace Pension — access or login problems
  body: 'Oakhaven Pensions prioritises the security of member assets, which means
    we employ rigorous access controls. If you are experiencing difficulties accessing
    your Oakhaven Workplace Pension via the secure online portal, please follow these
    troubleshooting steps.


    Symptom: ''Invalid Credentials'' or ''Access Denied'' Message

    Likely Cause: Incorrect username or password, or an expired session.

    What to check:

    1. Verify that your Caps Lock is off and you are using the correct email address
    associated with the account.

    2. Ensure you are not using an outdated bookmark to access the portal; navigate
    directly to the Oakhaven Pensions login page.

    3. If the problem persists, request a password reset. We will send a secure link
    to your registered email.


    Symptom: Multi-Factor Authentication (MFA) Code Not Received

    Likely Cause: Network delay, incorrect phone number on file, or MFA service interruption.

    What to check:

    1. Wait 60 seconds for the code to arrive. If it does not, request a new code
    via the ''Resend'' option.

    2. Check your signal strength or ensure your device is connected to the internet.

    3. If you have recently changed your mobile number, you will be unable to receive
    the code.


    Resolution and Escalation

    If you cannot regain access after these steps, tell us your full name and member
    ID. We will initiate a strict identity verification process. If the login issue
    is due to a security lock (triggered by too many failed attempts), we will raise
    a case with our senior operations specialists to verify your identity and manually
    reset your access.


    You will receive a notification via your registered email once the account lock
    has been lifted. For issues regarding unexpected charges after regaining access,
    see Oakhaven Workplace Pension — an unexpected charge or amount.'
  domain: retirement
  product_category: workplace_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: e0339da8-5125-5b97-9cac-24fe6f8bca0b
  title: Oakhaven Workplace Pension — qualification tiers
  body: 'Support agents should use the following matrix to determine a customer''s
    eligibility and the associated contribution requirements for the Oakhaven Workplace
    Pension.


    | Employment Status | Age/Earnings Criteria | Outcome | Requirement |

    | :--- | :--- | :--- | :--- |

    | Full-Time/Part-Time | Meets automatic enrolment criteria | Eligible | Minimum
    total contribution of 8% |

    | New Joiner | Meets automatic enrolment criteria | Eligible | Minimum employer
    contribution of 3% |

    | Existing Member | Active in workplace scheme | Maintained | Annual management
    charge of 0.45% |

    | Non-Eligible | Does not meet enrolment criteria | Ineligible | May consider
    Oakhaven Personal Pension |


    Agents must confirm that the employer''s commitment to the 3% minimum contribution
    is documented before finalising the account setup. Any member who does not qualify
    for the workplace scheme should be referred to Oakhaven Personal Pension — overview
    for alternative options.'
