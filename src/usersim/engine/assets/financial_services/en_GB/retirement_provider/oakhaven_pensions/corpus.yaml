  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 8288d189-6bc5-56c6-8318-9594e1fa50a4
  title: Oakhaven Personal Pension — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Oakhaven
    Personal Pension. All members should read these carefully to understand the risks
    associated with pension wealth.


    Investment Risk: The value of your pension fund can go down as well as up, and
    you may get back less than you invested. The 0.6% annual management charge is
    deducted regardless of fund performance.


    Taxation and Allowances: Contributions to the Oakhaven Personal Pension attract
    20% basic-rate tax relief. However, this is subject to the statutory annual allowance
    of £60,000. Contributions exceeding this limit may be subject to tax charges,
    potentially negating the tax relief received. It is the member''s responsibility
    to monitor their total contributions across all pension schemes.


    Regulatory Alignment: Oakhaven Pensions operates strictly within the frameworks
    set by the Financial Conduct Authority (FCA) and The Pensions Regulator. We are
    committed to the fair treatment of customers and the prevention of pension fraud.


    Future Changes: Members should be aware of broader regulatory shifts, such as
    the inheritance tax changes effective from 6 April 2027, which may affect the
    tax status of pension death benefits. We recommend that members eligible to access
    their funds from age 50 utilise the free, impartial Pension Wise guidance offered
    to them.


    Oakhaven Pensions provides educational resources and guidance but never offers
    regulated financial advice or individual tax advice. For specific tax planning,
    please consult a qualified professional.'
  domain: retirement
  product_category: personal_pension
  document_type: disclosure
  source_authority: official
