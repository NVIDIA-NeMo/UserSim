- id: 32c36ea1-6273-5858-8fa2-66e4793e3fba
  title: Oakhaven Workplace Pension — a declined or blocked action
  body: 'If you have attempted to perform an action on your Oakhaven Workplace Pension—such
    as updating a beneficiary or requesting a transfer—and the action was declined
    or blocked, please review the following information.


    Likely Symptoms:

    You may receive a notification that the request cannot be completed, or you may
    find that a specific state-changing action has been suspended.


    Potential Causes:

    - Verification Failure: The most common cause is a failure during the strict identity
    verification process. If multi-factor authentication (MFA) was not completed successfully,
    the action will be blocked to protect your assets from fraud.

    - Compliance Flags: In accordance with our risk and compliance posture, we prioritise
    scam prevention. If a transfer request appears to align with known fraud patterns,
    our systems will automatically block the action.

    - Regulatory Restrictions: Certain actions may be blocked if they conflict with
    FCA or The Pensions Regulator frameworks.


    What to Check and How to Fix:

    1. Identity Credentials: Ensure that the contact details we have on file are current.
    If your phone number or email has changed, you will be unable to complete MFA.
    You must provide updated identification to resolve this.

    2. Transfer Details: If a transfer was blocked, double-check the receiving provider''s
    credentials. Ensure they are a regulated entity.

    3. Documentation: Check if there are any outstanding documents required to validate
    your identity or the nature of the request.


    When to Escalate:

    If you have provided all required documentation and the action remains blocked,
    we will route your case to a senior operations specialist and, if necessary, a
    compliance officer. You will receive a notification once the forensic review of
    the blocked action is complete and a resolution is reached.'
  domain: retirement
