- id: 248b7637-278b-5b36-97c4-739e06a31834
  title: Oakhaven Personal Pension — account security best practices
  body: 'At Oakhaven Pensions, the security of your retirement wealth is our highest
    priority. Given the long-term nature of the Oakhaven Personal Pension, your account
    is a high-value target for fraudulent activity. To protect your assets, we employ
    a rigorous security framework aligned with FCA standards.


    **Common Fraud Patterns**

    Be vigilant against ''pension liberation'' scams, where fraudsters promise early
    access to your funds before the legal age or offer ''guaranteed'' high returns
    through unofficial investment schemes. Be wary of unsolicited phone calls or emails
    claiming to be from Oakhaven Pensions requesting your password or MFA codes to
    ''unlock'' a benefit.


    **Our Security Commitments**

    Oakhaven Pensions will NEVER ask you for the following via telephone or email:

    - Your full password or multi-factor authentication (MFA) code.

    - A direct transfer of funds to a personal bank account for ''verification'' purposes.

    - Your full security questions over an unencrypted channel.


    **Best Practices for Members**

    1. **Enable MFA:** Ensure multi-factor authentication is active on your secure
    portal. This is a mandatory requirement for any state-changing action, such as
    updating beneficiaries or requesting withdrawals.

    2. **Verify Communications:** If you receive an unexpected request for information,
    ignore the message and contact us through our official telephone channels during
    UK business hours.

    3. **Monitor Statements:** Regularly review your account statements to ensure
    all contributions and charges, including the 0.6% annual management charge, are
    accurate.


    **Immediate Action**

    If you suspect unauthorised access to your account or if you have inadvertently
    shared security credentials, you must notify us immediately. Upon reporting, we
    will trigger an immediate account suspension to prevent the loss of assets, followed
    by a comprehensive forensic investigation to secure your funds. Prompt reporting
    is essential to minimise your liability and ensure the fastest possible resolution.'
  domain: retirement
  product_category: personal_pension
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 273c9e26-7d16-5813-a76a-4d77a44022ca
  title: Oakhaven Personal Pension — change-of-terms policy
  body: 'This policy outlines the conditions under which Oakhaven Pensions may amend
    the terms and conditions governing the Oakhaven Personal Pension. As a provider
    committed to stability and transparency, we ensure that any modifications to our
    service are communicated clearly and fairly.


    **Amendments to Fees and Charges**

    Oakhaven Pensions reserves the right to adjust the annual management charge, currently
    set at 0.6%, to reflect changes in the costs of professional investment management
    and administration. Any increase in this charge will be preceded by a formal notice
    period of at least 30 days, delivered via the secure online portal or by post.


    **Changes to Contribution Thresholds**

    The minimum monthly contribution, currently £50, may be adjusted to ensure the
    sustainable administration of the fund. Should the minimum be raised, existing
    members will be permitted to maintain their current contribution level provided
    it was established prior to the change, unless the change is mandated by regulatory
    updates from The Pensions Regulator.


    **Regulatory Alignment**

    Our terms are subject to the overarching frameworks of the FCA. Should there be
    a change in UK law regarding tax relief (currently 20% basic-rate relief) or the
    annual allowance (currently £60,000), these changes will be applied automatically
    to all accounts to ensure continued regulatory excellence.


    **Notice and Acceptance**

    Members will be notified of any material changes to these terms via a ''Notice
    of Variation''. Continued contributions or the failure to close the account within
    30 days of such notice constitutes acceptance of the revised terms.


    **Termination of Agreement**

    Either party may terminate the pension agreement subject to the standard closing
    procedures. Oakhaven Pensions may terminate an account if there is evidence of
    fraudulent activity or a persistent breach of identity verification protocols.
    In such cases, assets will be protected and handled according to FCA guidelines
    to ensure the fair treatment of the customer.'
  domain: retirement
  product_category: personal_pension
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 0e756724-adb6-5a80-a727-449c8b07144d
  title: Oakhaven Personal Pension — getting started walkthrough
  body: 'This walkthrough is intended for support agents assisting prospective customers
    in opening an Oakhaven Personal Pension. This product is a flexible, self-managed
    retirement account designed for individuals seeking stability and clear regulatory
    oversight.


    **Core Product Specifications**

    To guide the customer, ensure they are aware of the following fixed values:

    - **Annual Management Charge:** 0.6% (covers professional investment and secure
    administration).

    - **Minimum Monthly Contribution:** £50 (the lowest amount allowed to maintain
    an active account).

    - **Basic-Rate Tax Relief:** 20% (claimed by the provider to boost the member''s
    pot).

    - **Annual Allowance:** £60,000 (the maximum total contribution eligible for tax
    relief per year).


    **The Onboarding Process**

    1. **Identity Verification:** Begin by collecting the necessary documentation
    for strict identity verification. This is non-negotiable to protect against fraud.

    2. **Contribution Setup:** Confirm the member''s intended monthly contribution.
    Remind them that it must be at least £50. If the customer is unsure of the amount,
    refer them to the educational resources on the portal.

    3. **Tax Status Confirmation:** Confirm the member''s tax residency to ensure
    the 20% basic-rate tax relief is applied correctly. Explain that higher-rate taxpayers
    may claim additional relief through their self-assessment.

    4. **Allowance Disclosure:** Inform the member of the £60,000 annual allowance
    to ensure they do not exceed the limit and incur tax charges.

    5. **MFA Activation:** Assist the member in setting up multi-factor authentication
    for their secure portal access. This is required for all future state-changing
    actions.


    **Agent Reminder**

    Oakhaven Pensions provides guidance and educational resources only. You must never
    offer regulated financial advice or individual tax advice. For members eligible
    to access funds from age 50, you must mandate the offer of free, impartial Pension
    Wise guidance.'
  domain: retirement
  product_category: personal_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 91dbca41-bfe4-5e9f-98d0-49f8e2faa24d
  title: Oakhaven Personal Pension — basic-rate tax relief added to personal contributions
    explained
  body: '**How does the 20% basic-rate tax relief work for my Oakhaven Personal Pension?**

    When you contribute to your pension, the government provides tax relief to encourage
    saving for retirement. For every £80 you contribute from your net income, the
    government adds 20% tax relief, bringing the total contribution into your pot
    to £100. This effectively means the government contributes £20 for every £80 you
    save.


    **Do I need to claim this tax relief myself?**

    No. Oakhaven Pensions handles the claim for the 20% basic-rate tax relief automatically
    on your behalf, ensuring your fund grows efficiently without unnecessary administration.


    **What if I am a higher-rate taxpayer?**

    While we automatically claim the 20% basic-rate relief, those paying higher rates
    of tax may be eligible for additional relief. Please note that Oakhaven Pensions
    cannot provide individual tax advice; we recommend consulting a qualified tax
    professional or referring to Oakhaven Personal Pension — overview for general
    product information.'
  domain: retirement
  product_category: personal_pension
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: d4486867-0d3e-5170-8dbc-f37f332802ce
  title: Oakhaven Personal Pension — make a change or update
  body: 'This guide outlines the steps for existing members to update their account
    details or modify their contribution levels for their Oakhaven Personal Pension.


    **Before You Begin**

    You will need your account number and your primary form of identity verification.
    All updates require multi-factor authentication (MFA) to protect your assets from
    unauthorised access.


    **Step-by-Step Update Process**

    1. **Request the Change:** State clearly the specific update you wish to make.
    This may include updating your contact information, modifying your monthly contribution
    amount, or updating your ''Expression of Wish'' beneficiary details.

    2. **Verify Identity:** Provide the required identity verification. We will then
    trigger an MFA prompt to your registered device; you must confirm this prompt
    to proceed.

    3. **Specify New Values:** If you are changing your contributions, state the new
    monthly amount. Please note that all contributions must remain at or above the
    minimum monthly contribution of £50.

    4. **Review Disclosures:** For certain changes, such as beneficiary updates, we
    will provide a disclosure regarding the non-binding nature of the ''Expression
    of Wish''.

    5. **Confirmation of Action:** We will confirm that the change has been processed.
    You will receive a notification via the secure online portal confirming the updated
    details and the date the change becomes effective.


    **How You Know It Worked**

    Your change is successful once you receive the formal confirmation notification.
    You can then log in to your secure portal to verify that the updated information
    (such as the new contribution amount) is correctly reflected in your account summary.'
  domain: retirement
  product_category: personal_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: d0705207-f78f-5195-9cae-10bd011a288e
  title: Oakhaven Personal Pension — access or login problems
  body: 'If you are unable to access your Oakhaven Personal Pension secure portal,
    please follow this diagnostic path to resolve the issue.


    **Symptom: "Invalid Login Credentials" or "Access Denied"**


    **Likely Causes**

    - Incorrect password or username entry.

    - MFA (Multi-Factor Authentication) synchronisation failure.

    - Account suspension due to detected fraudulent activity.

    - Outdated browser cache or security software interference.


    **What to Check and in What Order**

    1. **Credential Check:** Re-enter your username and password carefully. Ensure
    that the ''Caps Lock'' key is not active.

    2. **MFA Verification:** Check your registered mobile device for the MFA prompt.
    If the prompt is not appearing, restart your device and request a new code.

    3. **Security Notification:** Check your registered email for any notifications
    from Oakhaven Pensions regarding an account suspension. If we have detected suspicious
    activity, your account will be locked automatically to protect your funds.

    4. **Browser Update:** Clear your browser cache and cookies, or attempt to log
    in using a different secure browser.


    **The Fix**

    - For forgotten passwords, request a secure reset. You will be required to pass
    a full identity verification check before a new password can be issued.

    - For MFA failures, ask us to reset your MFA device association. This requires
    an enhanced identity check over the telephone.


    **When to Escalate**

    If you have completed the above steps and still cannot gain access, the issue
    will be escalated to our senior operations specialists. We will open a technical
    investigation ticket and provide you with a reference number. You can expect a
    resolution or a detailed update within two business days. If the lockout was due
    to a fraud suspicion, the case will be routed to our compliance officers for a
    forensic investigation before access is restored.'
  domain: retirement
  product_category: personal_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 5c0f3711-be72-5918-9ace-f724e458a1cf
  title: Oakhaven Personal Pension — qualification tiers
  body: 'This matrix is for support agents to determine the account status and qualification
    of a member based on their contribution levels for the Oakhaven Personal Pension.


    | Condition | Outcome / Tier | Requirement |

    | :--- | :--- | :--- |

    | Monthly Contribution < £50 | Ineligible | Account cannot be opened or will be
    marked as ''Inactive'' |

    | Monthly Contribution $\ge$ £50 | Standard Member | Eligible for full account
    features and 20% basic-rate tax relief |

    | Total Annual Contribution $\le$ £60,000 | Tax-Efficient | Fully within the current
    Annual Allowance for tax relief |

    | Total Annual Contribution > £60,000 | Allowance Excess | Eligible for account,
    but contributions above £60,000 may not qualify for tax relief |

    | Resident of UK / Eligible Taxpayer | Verified Member | Eligible to benefit from
    the 0.6% annual management charge structure |


    Agents should ensure that any prospective customer understands that the £50 minimum
    monthly contribution is a mandatory requirement for the sustainable administration
    of the personal pension fund.'
  domain: retirement
  product_category: personal_pension
  document_type: eligibility_matrix
  source_authority: official
