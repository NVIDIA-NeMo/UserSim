  institution_id: oakhaven_pensions
- id: 294461c4-526d-556a-a32f-a40780301c8c
  title: Oakhaven Lifetime Annuity — account agreement
  body: 'This agreement governs the provision of the Oakhaven Lifetime Annuity between
    the member and Oakhaven Pensions. By purchasing this product, the member agrees
    to the following terms and conditions.


    1. Purchase Requirements

    To establish an Oakhaven Lifetime Annuity, the member must meet a minimum purchase
    price of £10,000. This amount is the total fund value used to purchase the annuity
    contract. Funds must be transferred from a qualifying pension scheme and verified
    through our standard identity and security protocols.


    2. Income Guarantee

    Oakhaven Pensions commits to providing a guaranteed lifelong income based on the
    fund value and the member''s age at the time of purchase. For example, a purchase
    at age 65 provides an annual income of £7,100 per £100,000 of the fund value.
    This income is guaranteed for the lifetime of the member (or a nominated joint
    life).


    3. Irreversibility and Limitations

    Once the annuity is purchased and the contract is crystallised, the arrangement
    is generally irreversible. The member cannot ''withdraw'' the original purchase
    price or switch back to a flexible drawdown arrangement. Any attempt to close
    or downgrade the account is subject to the constraints of the insurance contract.


    4. Obligations of the Member

    Members must maintain accurate contact and bank details to ensure the seamless
    delivery of income. Any ''Expression of Wish'' regarding beneficiaries must be
    kept up to date, although such statements are non-binding.


    5. Regulatory Compliance

    This agreement is strictly aligned with the frameworks set by the FCA and The
    Pensions Regulator. Oakhaven Pensions reserves the right to suspend payments if
    fraudulent activity is suspected, pending a forensic investigation.


    6. Termination and Death

    The agreement ends upon the death of the member, unless a joint-life or guaranteed-period
    option was selected at the time of purchase. In such cases, payments continue
    according to the specific terms of the selected option.


    For further details on the regulatory environment, please see Oakhaven Lifetime
    Annuity — regulatory disclosures.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f10d301b-f26c-51e3-93c4-1f6c02473dcc
  title: Oakhaven Lifetime Annuity — who it is best for and common use cases
  body: 'The Oakhaven Lifetime Annuity is a secure retirement solution designed for
    individuals who prioritise certainty, stability, and the elimination of investment
    risk. Unlike flexible products where the balance can fluctuate, this annuity converts
    a pension pot into a guaranteed stream of income for life.


    Who This Product Is Best For

    This product is ideal for members who:

    - Seek a ''salary-like'' income that cannot be outlived.

    - Have a low appetite for risk and wish to avoid the volatility of financial markets.

    - Prefer a hands-off approach to retirement, removing the need for active investment
    management.

    - Require a predictable budget for essential living expenses throughout their
    retirement.


    Common Use Cases

    - Core Income Provision: Many members use the Oakhaven Lifetime Annuity to cover
    their basic living costs (housing, utilities, food), while keeping other funds
    in a flexible drawdown account for discretionary spending. This ''hybrid'' approach
    balances security with flexibility.

    - Guaranteed Legacy: By selecting specific joint-life options, members can ensure
    that a spouse or partner continues to receive income after their death.

    - Simplification of Assets: Individuals with multiple small pension pots often
    consolidate them to meet the minimum purchase price of £10,000, simplifying their
    financial administration into a single monthly payment.


    Key Financials

    - Minimum Entry: A minimum purchase price of £10,000 is required to initiate the
    annuity.

    - Illustrative Yield: At age 65, the product provides a guaranteed annual income
    of £7,100 for every £100,000 invested.


    Because this product provides a guaranteed income, it differs significantly from
    the flexible access provided by other products. To understand the trade-offs between
    guaranteed income and flexible access, you may wish to review Oakhaven Flexible
    Drawdown — overview.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
