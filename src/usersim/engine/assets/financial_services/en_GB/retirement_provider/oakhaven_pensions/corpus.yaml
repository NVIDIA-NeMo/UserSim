- id: fe057174-df95-5c21-9ef7-4f969d15e168
  title: Oakhaven Lifetime Annuity — fraud and unauthorized-activity protection
  body: 'Protecting your retirement income is a priority at Oakhaven Pensions. The
    Oakhaven Lifetime Annuity is designed to provide stability, but the guaranteed
    nature of this product can occasionally make it a target for sophisticated fraud,
    particularly ''pension unlocking'' or ''review'' scams.


    Common Fraud Patterns

    Fraudsters often pose as official representatives or independent advisers, claiming
    they can help you ''unlock'' your annuity or transfer it to a higher-yielding
    investment. Please be aware that because an annuity is a contract for guaranteed
    income, it is generally irreversible. Any entity claiming they can ''reverse''
    an annuity for a fee or a promised higher return is likely engaging in fraudulent
    activity.


    Our Security Protocols

    To prevent unauthorised access and fraudulent transfers, Oakhaven Pensions employs
    a rigorous security framework. We require strict identity verification and multi-factor
    authentication (MFA) before any state-changing action is performed. This ensures
    that only the verified member can make updates to their account or beneficiary
    details.


    What We Will Never Ask

    Oakhaven Pensions will never ask you to disclose your full password, MFA codes,
    or transfer your funds to a third-party ''holding account'' via an unsolicited
    telephone call or email. We will never pressure you to make a rapid decision regarding
    your pension wealth.


    Immediate Action Steps

    If you receive a suspicious communication or notice an unexpected change to your
    payment details, you must notify us immediately. Fraudulent activity triggers
    an immediate account suspension and a comprehensive forensic investigation to
    secure your assets. Prompt reporting is essential; while we work to resolve disputes
    fairly, the speed of reporting is critical in mitigating losses and assisting
    the Financial Ombudsman Service or the Pensions Ombudsman if an escalation is
    required.


    For more information on general security practices, you may refer to Oakhaven
    Lifetime Annuity — account security best practices.'
  domain: retirement
  product_category: lifetime_annuity
  document_type: security_advisory
  source_authority: official
  placeholder: true
