  institution_id: oakhaven_pensions
- id: bf274ce7-6712-56d9-b0ff-c07e99ea30ab
  title: Oakhaven Workplace Pension — fraud and unauthorized-activity protection
  body: 'At Oakhaven Pensions, we recognise that your retirement savings represent
    a lifetime of hard work. Consequently, the Oakhaven Workplace Pension is protected
    by a rigorous security framework designed to thwart fraud and prevent unauthorised
    access to member assets.


    To protect your funds, we employ a strict identity verification process combined
    with multi-factor authentication. These measures are mandatory for any state-changing
    action, such as updating beneficiary details or requesting a transfer of funds.
    We specifically prioritise scam prevention during the transfer process; any request
    to move funds to an external provider will trigger an enhanced review to ensure
    the destination is legitimate and the member is not being targeted by a pension
    scam.


    It is important to be aware of the patterns typically used by fraudsters. Oakhaven
    Pensions will never ask you to disclose your full password over the telephone
    or via email, nor will we pressure you to move your funds into a ''high-growth''
    investment that promises guaranteed returns far above market norms. Any communication
    asking for immediate payment to ''unlock'' your pension is a hallmark of fraudulent
    activity.


    If you suspect that your account has been compromised or if you notice any unauthorised
    activity, you must notify us immediately. Upon the confirmation of fraudulent
    activity, Oakhaven Pensions will trigger an immediate account suspension to freeze
    assets and prevent further loss. This is followed by a comprehensive forensic
    investigation to determine the extent of the breach and recover assets where possible.


    Our commitment to security ensures that the costs associated with your plan—such
    as the 0.45% annual management charge—are utilised for professional investment
    management and secure administration, rather than being compromised by external
    threats. For further details on our regulatory alignment, please refer to Oakhaven
    Workplace Pension — regulatory disclosures.'
  domain: retirement
  product_category: workplace_pension
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: b54de6f7-d307-5415-a6df-f991f05eb105
  title: Oakhaven Workplace Pension — account agreement
  body: 'This account agreement outlines the binding terms governing the Oakhaven
    Workplace Pension. This agreement is established between Oakhaven Pensions, the
    corporate employer, and the individual member.


    Contributions and Funding

    The scheme is built upon a commitment to sustainable growth. The agreement mandates
    a minimum total contribution of 8% of qualifying earnings. Of this total, the
    employer is obligated to provide a minimum employer contribution of 3%. Any shortfall
    in these minimums may result in a breach of the employer''s contractual obligations
    to the member.


    Fees and Charges

    To cover the essential costs of professional investment management and secure
    administration, Oakhaven Pensions applies an annual management charge of 0.45%.
    This fee is deducted from the fund value on a pro-rata basis throughout the year.
    All fees are transparent and aligned with our low-cost pricing philosophy.


    Account Security and Verification

    Members acknowledge that strict identity verification and multi-factor authentication
    are required before any state-changing action can be processed. This includes,
    but is not limited to, withdrawals, beneficiary updates, and the transfer of funds
    to another provider. Failure to provide the required verification will result
    in the action being declined to protect the member''s assets.


    Termination and Closure

    This agreement ends upon the member''s retirement, the transfer of the pension
    pot to another regulated provider, or the closure of the account following a valid
    opt-out request. All closures are subject to regulatory checks to ensure the member
    is not acting under the influence of a scam.


    Dispute Resolution

    Oakhaven Pensions is committed to a fair and prompt resolution of all disputes.
    If a resolution cannot be reached internally through our escalation path to senior
    operations specialists and compliance officers, members have the right to escalate
    their complaint to the Financial Ombudsman Service or the Pensions Ombudsman.'
  domain: retirement
  product_category: workplace_pension
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ccc3f505-8a03-5a36-83bf-93e53820d6c7
  title: Oakhaven Workplace Pension — who it is best for and common use cases
  body: 'The Oakhaven Workplace Pension is specifically designed for corporate employers
    and their employees who value stability, transparency, and regulatory excellence.
    It is an ideal solution for those seeking a reliable vehicle for long-term retirement
    wealth without the volatility or opacity often found in complex investment products.


    Who This Product Suits Best

    - Corporate Employers: Those looking for an employer-sponsored solution that simplifies
    automatic enrolment and ensures compliance with UK pension regulations.

    - Employees Seeking Stability: Individuals who want a clear, low-cost way to build
    a retirement pot with the reassurance of professional management.

    - Risk-Averse Savers: Members who prefer a provider that prioritises scam prevention
    and follows strict FCA and The Pensions Regulator frameworks.


    Common Use Cases

    1. Automatic Enrolment: The most common application is as a primary workplace
    scheme where employees are automatically enrolled to ensure a minimum total contribution
    of 8% is achieved.

    2. Employer Matching: The product is used by firms to provide a stable benefit
    package, ensuring a minimum employer contribution of 3% is maintained for all
    eligible staff.

    3. Low-Cost Accumulation: Because the annual management charge is set at 0.45%,
    this product is frequently chosen by those who wish to maximise their net fund
    growth by minimising administrative overheads.


    By combining a disciplined fee structure with professional oversight, the Oakhaven
    Workplace Pension allows members to focus on their career and future without being
    overwhelmed by the complexities of pension wealth. For an overview of the basic
    features, see Oakhaven Workplace Pension — overview.'
  domain: retirement
  product_category: workplace_pension
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: c7d8a1de-be2f-5afa-ac86-9a546f6e29f4
  title: Oakhaven Workplace Pension — minimum employer contribution (% of qualifying
    earnings) explained
  body: 'Q: What is the minimum employer contribution for my Oakhaven Workplace Pension?


    A: For the Oakhaven Workplace Pension, the minimum employer contribution is 3%
    of your qualifying earnings. This is the baseline amount your employer must contribute
    to your pension pot to meet the scheme''s standards.


    Q: How does the employer contribution relate to the total contribution?


    A: The employer''s 3% is part of the minimum total contribution of 8% required
    for the scheme. This means that to reach the 8% threshold, the remaining 5% is
    typically contributed by the employee. However, some employers may choose to contribute
    more than the 3% minimum as part of their corporate benefits package.


    Q: Where can I find more information about the overall costs of my pension?


    A: You can find detailed information regarding our low-cost pricing model, including
    the 0.45% annual management charge, in the document titled Oakhaven Workplace
    Pension — annual management charge explained.'
  domain: retirement
  product_category: workplace_pension
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 556f126b-8de7-5ed8-8728-4b9aabb9940e
  title: Oakhaven Workplace Pension — cancel, close, or downgrade
  body: 'Closing or opting out of your Oakhaven Workplace Pension is a significant
    financial decision. Before proceeding, we strongly recommend reviewing the potential
    impact on your long-term retirement goals.


    Requirements Before Starting

    - Your account details and national insurance number.

    - Valid government-issued identification for verification.

    - If you are aged 50 or over, we mandate that you first receive free, impartial
    guidance from Pension Wise before accessing or closing your funds.


    Steps to Cancel or Close Your Account

    1. Notify us of your intent to close the account or opt out of the workplace scheme.
    We will then initiate the identity verification process.

    2. Complete the multi-factor authentication check. This is a mandatory security
    step to protect your assets from unauthorised access.

    3. Provide proof of the destination for your funds if you are transferring to
    another provider. We will perform a scam prevention check on the receiving scheme
    to ensure your money remains safe.

    4. Confirm your final election. Once the verification is complete, we will process
    the closure or the opt-out request.

    5. Receive written confirmation. We will provide a final statement and a confirmation
    notice that the account has been closed or the contributions have ceased.


    If you are choosing to move your funds to a different provider, please be aware
    that your current 0.45% annual management charge will cease once the funds have
    been successfully transferred. For more information on the risks associated with
    transfers, refer to Oakhaven Workplace Pension — risk disclosures.'
  domain: retirement
  product_category: workplace_pension
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 6ab58e06-d21c-5f15-acc0-3cd9cd234097
  title: Oakhaven Workplace Pension — an unexpected charge or amount
  body: 'If a member reports a discrepancy in their balance or an unexpected charge
    on their Oakhaven Workplace Pension statement, support agents should follow this
    diagnostic path.


    Symptom: The customer believes they have been overcharged or the fund value is
    lower than expected.


    Potential Causes

    1. Annual Management Charge (AMC) Application: The most common cause is the application
    of the 0.45% annual management charge. Ensure the customer understands that this
    fee is deducted periodically to cover investment and administration costs.

    2. Contribution Misalignment: The member may expect a higher balance based on
    a total contribution of 8%, but the actual contributions may be lower if the employer
    is only providing the minimum employer contribution of 3% and the member''s own
    contributions have not been adjusted.

    3. Market Fluctuations: As a retirement provider, fund values can fluctuate based
    on investment performance.


    What to Check

    - Review the most recent statement and compare the deducted fees against the 0.45%
    AMC rate.

    - Verify the contribution history to ensure both the employer''s 3% and the member''s
    portions are being credited correctly to reach the 8% total.

    - Confirm if any recent transfers or withdrawals have occurred that would explain
    a balance change.


    Resolution and Escalation

    - If the charges align with the 0.45% AMC and contributions are correct, explain
    the fee structure to the customer using the guidelines in Oakhaven Workplace Pension
    — how rates are tiered and applied.

    - If a genuine billing error is identified, the case must be escalated to a senior
    operations specialist for a balance correction.

    - If the customer remains dissatisfied, route the matter to a compliance officer
    for a formal review, with a clear path toward the Pensions Ombudsman if required.'
  domain: retirement
  product_category: workplace_pension
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 791f9dd3-06c9-5317-9f24-9cfd58a41c51
  title: Oakhaven Workplace Pension — required documentation
  body: 'To establish an Oakhaven Workplace Pension, the following documentation is
    required to satisfy our security and regulatory frameworks:


    | Requirement | Document Accepted | Outcome if Missing |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Passport or UK Driving Licence | Application paused
    pending verification |

    | Proof of Address | Recent Utility Bill or Council Tax Statement | Account setup
    cannot be completed |

    | Employer Sponsorship | Signed Corporate Agreement / Letter of Appointment |
    Unable to apply minimum employer contribution of 3% |

    | Tax Status | P45 or current tax code notification | Potential delay in applying
    tax relief |

    | Pension Wise Confirmation | Evidence of guidance (for members aged 50+) | Access
    to funds restricted until guidance received |


    All documents must be provided in a clear, legible format. Strict identity verification
    is a prerequisite for the 0.45% annual management charge to be applied to a validly
    opened account.'
  domain: retirement
