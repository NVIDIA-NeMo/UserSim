- id: fdbfa85d-209b-5f11-8a87-5dc2116bfff7
  title: Oakhaven Workplace Pension — fee schedule
  body: 'This fee schedule provides the exact pricing for the Oakhaven Workplace Pension.
    Our pricing model is designed for transparency and sustainability, ensuring a
    low-cost environment for fund growth.


    **Annual Charges**

    - Annual Management Charge: 0.45%


    This charge is the sole recurring fee for the administration and professional
    investment management of the workplace scheme. It is deducted periodically from
    the fund value. There are no hidden setup fees, exit fees, or tiered administration
    charges for this product. For a broader perspective on how these fees relate to
    the overall product structure, please see Oakhaven Workplace Pension — overview.'
  domain: retirement
