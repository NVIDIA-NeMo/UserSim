- id: b70cec73-121c-5589-9d4c-1949bdc536cb
  title: Oakhaven Flexible Drawdown — account security best practices
  body: 'Protecting your retirement wealth is our highest priority. Oakhaven Flexible
    Drawdown accounts are targets for sophisticated fraud patterns, particularly those
    involving ''pension liberation'' scams. These scams often promise unusually high
    returns or offer ways to access your funds before the legal minimum pension age
    of 55 (increasing to 57 from April 2028).


    To safeguard your assets, Oakhaven Pensions employs strict identity verification
    and mandatory multi-factor authentication (MFA) for every state-changing action.
    This includes all requests for withdrawals, changes to your payment frequency,
    or updates to your beneficiary details. We will never ask you to share your MFA
    codes, passwords, or full security credentials over the telephone or via email.


    Be vigilant regarding any unsolicited communication that references specific tax
    thresholds, such as the £268,275 lump sum allowance. Scammers may use these real
    figures to appear legitimate while attempting to persuade you to transfer your
    funds to an unauthorised provider. Remember, Oakhaven Pensions strictly aligns
    its operations with FCA and The Pensions Regulator frameworks to ensure you are
    treated fairly.


    If you notice any suspicious activity—such as an unexpected login notification
    or an unfamiliar request for information—you must notify us immediately. Prompt
    reporting is critical; fraudulent activity triggers the immediate suspension of
    your account and a comprehensive forensic investigation to recover assets. For
    more information on how we protect you, please refer to Oakhaven Flexible Drawdown
    — fraud and unauthorized-activity protection.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 8c3f14ff-9a42-5369-a989-98c7da5be48e
  title: Oakhaven Flexible Drawdown — change-of-terms policy
  body: 'This policy outlines the conditions under which Oakhaven Pensions may amend
    the terms governing the Oakhaven Flexible Drawdown product. We are committed to
    transparency and regulatory excellence, ensuring that any changes to your account
    agreement are communicated clearly and in advance.


    Oakhaven Pensions reserves the right to modify fees, administrative procedures,
    or service models to maintain sustainable fund growth and comply with evolving
    FCA and The Pensions Regulator frameworks. Such changes may include adjustments
    to the annual management charge or the introduction of new security protocols
    to protect member assets.


    Notification of Changes:

    We will provide a minimum of 30 days'' written notice via your secure online portal
    or registered email before any material change to the terms takes effect. This
    notice will clearly state the current term, the amended term, and the date the
    change becomes effective.


    Regulatory Alignment:

    Terms related to tax treatment are subject to UK legislation. For instance, while
    Oakhaven facilitates the withdrawal of 25% tax-free cash up to the £268,275 lump
    sum allowance, we must adjust our operational terms if the government alters these
    statutory limits or inheritance tax rules, such as those effective from 6 April
    2027.


    Agreement and Termination:

    Continuing to hold an account with us after the effective date of a term change
    constitutes your acceptance of those new terms. Members who do not agree to the
    amended terms may choose to close their account or transfer their funds to another
    provider, subject to our standard identity verification and security checks. The
    agreement ends upon the full crystallisation and withdrawal of all funds or the
    formal closure of the account by the member.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 94c6726f-d747-5fa9-a275-f152326caeb1
  title: Oakhaven Flexible Drawdown — getting started walkthrough
  body: 'This guide is for support agents assisting customers in transitioning to
    Oakhaven Flexible Drawdown. This product is designed for members who require a
    versatile access method to their retirement wealth, allowing them to take income
    as and when they need it.


    Step 1: Eligibility Verification

    Confirm the customer has reached the minimum pension age. Currently, this is 55.
    Agents must note that for customers starting drawdown in the future, the minimum
    pension age will increase to 57 from April 2028. If the customer is 50 or older,
    you must mandate the offer of free, impartial Pension Wise guidance before proceeding.


    Step 2: Tax-Free Cash Planning

    Explain the process of taking the tax-free element of the pension. The customer
    is entitled to 25% of their pot as tax-free cash. However, this is subject to
    the lifetime lump sum allowance of £268,275. Ensure the customer understands that
    any amount taken above this allowance may be subject to tax.


    Step 3: Payment Structure

    Assist the customer in deciding how they wish to receive their funds. They can
    choose a regular monthly payment, a one-off lump sum, or an ad-hoc combination.
    Clarify that the remaining funds stay invested to support long-term growth.


    Step 4: Identity and Security

    Inform the customer that before the first payment can be issued, they must complete
    a rigorous identity verification process and set up multi-factor authentication.
    This is a non-negotiable security requirement to protect their assets from fraud.


    Step 5: Post-Access Restrictions

    Advise the customer that once they have flexibly accessed their pension, they
    will be subject to the Money Purchase Annual Allowance (MPAA), which reduces their
    annual contribution limit to £10,000. For further details on this limit, see Oakhaven
    Flexible Drawdown — money purchase annual allowance explained.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 2eee0a49-859f-5af5-918e-83ad07332931
  title: Oakhaven Flexible Drawdown — money purchase annual allowance explained
  body: 'Q: What is the Money Purchase Annual Allowance (MPAA) and how does it affect
    me?


    A: The MPAA is a reduced annual limit on the amount you can contribute to your
    pension while still receiving tax relief. Once you have flexibly accessed your
    pension—for example, by taking a taxable payment from your Oakhaven Flexible Drawdown
    account—your annual allowance typically drops to £10,000.


    Q: Does taking only the tax-free cash trigger the MPAA?


    A: Generally, taking only your 25% tax-free cash does not trigger the MPAA. However,
    as soon as you take a payment that is taxable, the £10,000 limit applies. We recommend
    reviewing your contribution strategy to avoid potential tax charges.


    For a full overview of how our drawdown product works, please refer to Oakhaven
    Flexible Drawdown — overview.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: ab0d888f-40f9-5796-aefe-a8b4f8fbded9
  title: Oakhaven Flexible Drawdown — make a change or update
  body: 'If you wish to modify your payment arrangements or update your account details
    within your Oakhaven Flexible Drawdown plan, please follow these steps:


    1. Provide the specific update required: Tell us whether you wish to change your
    monthly withdrawal amount, switch to ad-hoc lump sum payments, or update your
    personal contact details.


    2. Complete Identity Verification: Because this is a state-changing action, we
    will require you to undergo a strict identity verification check. You will be
    asked to provide current identification and complete a multi-factor authentication
    (MFA) challenge to confirm your identity.


    3. Submit an Expression of Wish: If you are updating your beneficiary details,
    you will be asked to provide a new Expression of Wish. This is a non-binding statement
    detailing who you would like to receive your pension benefits upon your death.


    4. Confirm Tax Implications: If you are increasing your withdrawal amount, we
    will confirm whether this exceeds your 25% tax-free cash entitlement or if it
    approaches the £268,275 lump sum allowance. We will provide the factual figures,
    but please remember that Oakhaven Pensions does not offer regulated financial
    or individual tax advice.


    5. Receive Confirmation: Once the security checks are passed and the request is
    processed, we will provide a written confirmation of the change via your secure
    online portal. You will see the updated payment schedule or updated beneficiary
    record reflected in your account summary immediately.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: 0e9fdac7-ecea-5d3b-859b-bcf078770f8d
  title: Oakhaven Flexible Drawdown — access or login problems
  body: 'For customers comparing Oakhaven Pensions with other providers, we believe
    our rigorous security and transparent resolution process are key differentiators.
    Below is how we handle access issues for the Oakhaven Flexible Drawdown product.


    Symptom: Unable to access the secure online portal or login attempts are being
    rejected.


    Likely Causes:

    - Incorrect multi-factor authentication (MFA) token.

    - Account suspension due to suspected fraudulent activity.

    - Outdated identity verification documents.


    Resolution Steps:

    1. Verify Credentials: Ensure you are using the most recent password and that
    your MFA device is synced. If a token is rejected, request a new code.

    2. Check Account Status: If your account has been suspended for security reasons,
    this usually follows a detection of unauthorised access attempts. In such cases,
    a comprehensive forensic investigation is triggered.

    3. Re-verify Identity: If your identity documents have expired, we will ask you
    to provide updated, valid government-issued identification to restore access.


    Escalation Process:

    If the issue cannot be resolved during your initial conversation, we will raise
    a priority case with our senior operations specialists. You will receive a case
    reference number and a timeline for resolution, typically within 3 to 5 business
    days. If the matter remains unresolved to your satisfaction, we provide a clear
    escalation path to the Financial Ombudsman Service or the Pensions Ombudsman to
    ensure a fair outcome.'
