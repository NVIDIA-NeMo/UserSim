  title: Oakhaven Lifetime Annuity — qualification tiers
  body: 'The following matrix determines whether a member is eligible to purchase
    the Oakhaven Lifetime Annuity. This is for use by support agents to guide members.


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Total Pension Pot Value | £10,000 or more | Eligible to purchase |

    | Total Pension Pot Value | Less than £10,000 | Ineligible (Minimum purchase price
