  institution_id: oakhaven_pensions
- id: 2212f853-80dc-5feb-9607-7a7ff5c369c9
  title: Oakhaven Flexible Drawdown — a failed or pending action
  body: 'If you have requested a withdrawal or an update to your drawdown settings
    and the action appears as ''failed'' or remains ''pending'' longer than expected,
    please review the following common causes.


    Symptom: A withdrawal request has been declined or is pending for more than five
    business days.


    Likely Causes:

    1. Identity Verification Failure: Due to our strict security posture, any mismatch
    in multi-factor authentication or outdated identification documents will trigger
    an immediate hold on state-changing actions.

    2. Exceeding the Lump Sum Allowance: If a request for tax-free cash exceeds the
    £268,275 lump sum allowance, the transaction may be flagged for manual compliance
    review.

    3. MPAA Conflict: If you have attempted to make a contribution that exceeds the
    £10,000 Money Purchase Annual Allowance after having already accessed your funds,
    the account may be temporarily suspended for a forensic investigation to ensure
    regulatory alignment.


    What to check in order:

    - Check your secure notifications for any requests to update your identity documentation.

    - Verify that your requested tax-free amount is within the 25% limit and does
    not exceed £268,275.

    - Confirm that any recent contributions to the fund do not exceed the £10,000
    MPAA limit.


    Resolution:

    - If the issue is identity-related, provide the requested updated documents. We
    will then re-verify your identity and release the pending action.

    - If the issue relates to the lump sum allowance, we will work with you to adjust
    the withdrawal amount to be within the legal limits.

    - For MPAA breaches, our compliance officers will conduct a review. You will receive
    a written summary of the findings and instructions on how to rectify the over-contribution.


    If the action remains pending after these checks, we will escalate the matter
    to a senior operations specialist for manual intervention. You can expect a resolution
    update within three UK business days.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: f9e9da0a-0a72-55cf-bc6d-1ab7b54f5871
  title: Oakhaven Flexible Drawdown — eligibility requirements
  body: 'The following requirements must be met to activate and maintain an Oakhaven
    Flexible Drawdown account:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Current Age | Must be 55 or older | Eligible for activation |

    | Future Age (Post-April 2028) | Must be 57 or older | Eligible for activation
    |

    | Identity Status | Must pass multi-factor authentication and ID check | Account
    active |

    | Identity Status | Failed or missing verification | Action blocked / Account
    suspended |

    | Fund Status | Must have a qualifying pension balance | Eligible for drawdown
    |

    | Tax Status | Must adhere to the £268,275 lump sum allowance | Tax-free withdrawals
    permitted |

    | Contribution Status | Must adhere to the £10,000 MPAA if funds are accessed
    | Continued tax-relieved contributions permitted |'
  domain: retirement
  product_category: flexible_drawdown
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: oakhaven_pensions
- id: d28e9a24-f23a-5805-9497-423754d39c86
  title: Oakhaven Flexible Drawdown — vs. a similar product here
  body: 'When deciding how to access your retirement wealth, the choice typically
    falls between the flexibility of drawdown and the security of an annuity.


    Oakhaven Flexible Drawdown provides high versatility. You can take 25% of your
    pot as tax-free cash (up to the £268,275 lump sum allowance) and decide exactly
    how much to withdraw and when. This is ideal for those who want to manage their
    own spending or leave a larger inheritance. However, the fund value can fluctuate
    based on investment performance, and there is a risk that the money could run
    out if withdrawn too aggressively.


    In contrast, the Oakhaven Lifetime Annuity offers a guaranteed lifelong income,
    such as £7,100 per £100k at age 65. This removes the risk of outliving your money
    but offers far less flexibility once the contract is started; you cannot usually
    withdraw large lump sums after the annuity is purchased.


    Choose Flexible Drawdown if you value control and adaptability. Choose a Lifetime
    Annuity if you prioritise certainty and a guaranteed baseline income for life.'
  domain: retirement
  product_category: flexible_drawdown
  document_type: comparison
  source_authority: official
