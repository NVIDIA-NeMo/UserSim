  account_state:
    account_id: acct_wb_0001
    overdraft_limit: '1000'
  param_space:
    limit: ['250', '500', '1,500']
  gold_tool_sequence: [change_overdraft_limit]
  expected_state_deltas: {overdraft_limit_updated: true}
- id: TPL-WB-OVERPAY-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
