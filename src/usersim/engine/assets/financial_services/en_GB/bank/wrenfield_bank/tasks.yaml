  account_state:
    account_id: acct_wb_0001
    account_type: Wrenfield Current Account
    balance: '9800.00'
  param_space:
    saving: ['2,000', '3,000']
    overpayment: ['4,000', '5,000']
    bill: ['1,640.00', '1,912.00']
  gold_tool_sequence: [transfer_funds, make_mortgage_overpayment, pay_bill, set_alerts]
  expected_state_deltas: {transfer_status: COMPLETED, overpayment_status: SCHEDULED, payment_status: SCHEDULED, alerts_updated: true}
# Open-ended advisory topics are the taxonomy-driven `dynamic` tier
# (assets/financial_services/en_GB/dynamic.yaml), not scripted templates.
