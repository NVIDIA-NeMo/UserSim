schema_version: v0.1
# Verifiable Tier-1 tasks for wrenfield_bank, a high-street bank. Every
# state-changing tool it offers is gold in at least one task. Each task ships
# THREE opening phrasings in British English (build_instance picks one per
# trajectory). Read-only tools (get_account_transactions, get_statements,
# dispute_status) carry no gold state change.
templates:
- id: TPL-WB-DISPUTE-001
  tier: verifiable
  task_type: complaint_dispute
  domain: cards
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Hi, there's a card payment of £{{amount}} to {{merchant}} on my statement that
    I don't recognise. I've never shopped there. Can you help?
  - >-
    I've been charged £{{amount}} by {{merchant}} and it wasn't me. How do I get
    my money back?
  - >-
    There's a debit card payment of £{{amount}} to {{merchant}} that I didn't
    make. Can you dispute it for me?
  account_state:
    account_id: acct_wb_0001
    cards:
    - {card_id: card_wb_0001, status: active}
    transactions:
    - {transaction_id: txn_wb_0001, merchant: '{{merchant}}', amount: '{{amount}}', status: posted}
  param_space:
    merchant: [Brightside Electrics, StreamHub Premium, Northgate Fitness, Larch & Co Online]
    amount: ['49.99', '219.00', '1,149.00']
  gold_tool_sequence: [file_transaction_dispute]
  expected_state_deltas: {txn_wb_0001.status: UNDER_REVIEW}
  # blocking the compromised card and ordering a replacement are legitimate
  # actions a customer often requests during a fraud dispute — permitted (not
  # required).
  allowed_tools: [freeze_card, order_replacement_card]
- id: TPL-WB-SECTION75-001
  tier: verifiable
  task_type: complaint_dispute
  domain: cards
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I paid £{{amount}} on my Wrenfield credit card for {{item}} and the company has
    gone bust before delivering. Can I claim the money back from you?
  - >-
    The firm I bought {{item}} from has gone into administration and I never got
    it. I paid £{{amount}} on my credit card. Can you raise a section 75 claim?
  - >-
    I bought {{item}} for £{{amount}} with my credit card, but the retailer has
    stopped trading and won't answer. How do I get a refund through you?
  account_state:
    account_id: cc_wb_0001
    account_type: Wrenfield Rewards Credit Card
    transactions:
    - {transaction_id: txn_wb_0002, merchant: Hartley Home Furnishings, amount: '{{amount}}', status: posted}
  param_space:
    item: [a sofa, a fitted wardrobe, a bed and mattress]
    amount: ['640.00', '1,280.00', '2,450.00']
  gold_tool_sequence: [file_transaction_dispute]
  expected_state_deltas: {txn_wb_0002.status: UNDER_REVIEW}
- id: TPL-WB-FREEZE-001
  tier: verifiable
  task_type: fraud_triage
  domain: cards
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I think my debit card has been {{event}}. Can you freeze it straight away so
    nobody can use it?
  - >-
    Please freeze my card ending 0001, it's been {{event}}.
  - >-
    My card ending 0001 has been {{event}}. Can you put a temporary block on it
    while I work out what's happened?
  account_state:
    account_id: acct_wb_0001
    # openings reference "ending 0001"; pin last4 so the account grounding the
    # user is given matches.
    last4: '0001'
    cards:
    - {card_id: card_wb_0001, status: active}
  param_space:
    event: [lost, stolen]
  gold_tool_sequence: [freeze_card]
  expected_state_deltas: {card_wb_0001.status: frozen}
- id: TPL-WB-SCAM-001
  tier: verifiable
  task_type: fraud_triage
  domain: payments
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I think I've been scammed. Someone pretending to be {{impersonated}} told me to
    send £{{amount}} by bank transfer, and now they've stopped answering.
  - >-
    I transferred £{{amount}} to a person who said they were {{impersonated}}, and
    I've just realised it was a scam. Can I get the money back?
  - >-
    Yesterday I sent £{{amount}} to someone claiming to be {{impersonated}}. It was
    fraud. I need to report it and claim a refund.
  account_state:
    account_id: acct_wb_0001
    transactions:
    - {transaction_id: txn_wb_0003, merchant: Faster Payment to J SMITH, amount: '{{amount}}', status: posted}
  param_space:
    impersonated: [HMRC, my energy supplier, a delivery company, my landlord]
    amount: ['380.00', '1,250.00', '4,800.00']
  gold_tool_sequence: [report_scam_payment]
  expected_state_deltas: {scam_claim_status: OPEN}
- id: TPL-WB-SWITCH-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: retail_banking
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I'd like to switch my current account from {{old_bank}} to you, with all my
    Direct Debits and my salary.
  - >-
    Can you move my account over from {{old_bank}} using the Current Account Switch
    Service?
  - >-
    I want to leave {{old_bank}} and bring everything to Wrenfield. How do I start
    the switch?
  account_state:
    account_id: acct_wb_0001
  param_space:
    old_bank: [Castlegate Bank, Northern Union Bank, my old bank]
  gold_tool_sequence: [initiate_account_switch]
  expected_state_deltas: {account_switch_status: IN_PROGRESS}
- id: TPL-WB-OVERDRAFT-001
  tier: verifiable
  task_type: transactional
  domain: retail_banking
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
