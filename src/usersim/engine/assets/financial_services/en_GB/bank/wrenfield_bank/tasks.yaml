  - >-
    I've been living in my overdraft for months. Please apply for a £{{amount}}
    loan to clear it, then lower my overdraft limit to £{{limit}}, and send me a
    warning when my balance gets low.
  - >-
    Can I take out a £{{amount}} personal loan to pay off my overdraft? After that,
    cut my overdraft to £{{limit}} and set up a low-balance alert.
  - >-
    I want to get out of my overdraft: start a loan application for £{{amount}},
    reduce my overdraft to £{{limit}}, and alert me if I'm running low.
  account_state:
    account_id: acct_wb_0001
    account_type: Wrenfield Current Account
    balance: '-1850.00'
    overdraft_limit: '2000'
  param_space:
    amount: ['2,000', '3,000']
    limit: ['250', '500']
  gold_tool_sequence: [apply_loan, change_overdraft_limit, set_alerts]
  expected_state_deltas: {loan_application_status: SUBMITTED, overdraft_limit_updated: true, alerts_updated: true}
