- id: TPL-WB-BONUS-001
  tier: verifiable
  task_type: transactional
  domain: retail_banking
  placeholder: true
  persona_tags: [region:any, age:35-44, age:45-54]
  opening_user_messages:
  - >-
    My work bonus has just landed: please move £{{saving}} into my Everyday Saver,
    make a £{{overpayment}} overpayment on my mortgage, pay my council tax bill of
    £{{bill}}, and text me once it's all done.
  - >-
    Can you put £{{saving}} of my bonus into my Everyday Saver, overpay my mortgage
    by £{{overpayment}}, settle my £{{bill}} council tax, and send me a confirmation
    alert?
  - >-
    I'd like to split my bonus: £{{saving}} to my Everyday Saver, £{{overpayment}} off
