# ── Multi-step (Tier-1) tasks ──────────────────────────────────────────
# Gold sequences of depth 3: each gold tool must be discovered (its tool-doc
# retrieved) and called. The verifier requires the full sequence with no
# unauthorized state changes. Run these with a higher max_turns (~10-12).
- id: TPL-WB-LOSTWALLET-001
  tier: verifiable
  task_type: fraud_triage
  domain: cards
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    I've lost my purse with my card ending 0001 in it: freeze the card, send me a
    replacement, and text me whenever there's a payment on the account.
  - >-
    My wallet's gone missing with my debit card in it. Please freeze the card, order
    a new one, and set up alerts for any payments.
  - >-
    Can you freeze my card ending 0001, post me a replacement, and turn on payment
    alerts? I've lost it somewhere in town.
  account_state:
    account_id: acct_wb_0001
    last4: '0001'
    cards:
    - {card_id: card_wb_0001, status: active}
  param_space: {}
  gold_tool_sequence: [freeze_card, order_replacement_card, set_alerts]
  expected_state_deltas: {card_wb_0001.status: frozen, card_wb_0001.replacement: ordered, alerts_updated: true}
- id: TPL-WB-MOVINGHOME-001
  tier: verifiable
  task_type: transactional
  domain: payments
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    We've moved house: please update my address to {{address}}, cancel the Direct
    Debit to {{creditor}}, and pay their final bill of £{{amount}}.
  - >-
    I've just moved to {{address}}. Can you change my address, stop the Direct Debit
    to {{creditor}}, and pay the £{{amount}} final bill they've sent?
  - >-
    New address is {{address}}. Please update it, cancel my {{creditor}} Direct
    Debit, and settle their last bill of £{{amount}}.
  account_state:
    account_id: acct_wb_0001
    payments:
    - {payment_id: pay_wb_0001, payee: '{{creditor}}', type: direct_debit, status: active}
  param_space:
    address: ['14 Mill Lane, Harrogate HG1 2AB', '3 Victoria Terrace, Cardiff CF10 4TN']
    creditor: [Ridgeway Energy, Calder Water]
    amount: ['84.20', '212.75']
  gold_tool_sequence: [update_contact_info, stop_payment, pay_bill]
  expected_state_deltas: {contact_updated: true, pay_wb_0001.status: STOPPED, payment_status: SCHEDULED}
- id: TPL-WB-SCAM-FREEZE-001
  tier: verifiable
  task_type: fraud_triage
  domain: payments
  placeholder: true
  persona_tags: [region:any, age:65+, financial-literacy:low]
  opening_user_messages:
  - >-
    A man saying he was from {{impersonated}} got me to send him £{{amount}} and I
    read him my card number too. Please report the scam, freeze my card, and warn
    me about every payment from now on.
  - >-
    I've been tricked by someone pretending to be {{impersonated}}: I transferred
    £{{amount}} and gave them my card details. Can you report it, freeze the card,
    and set up alerts?
  - >-
    I sent £{{amount}} to a fake {{impersonated}} and told them my card number.
    Please open a scam claim, block my card, and turn on payment alerts.
  account_state:
    account_id: acct_wb_0001
    cards:
    - {card_id: card_wb_0001, status: active}
    transactions:
    - {transaction_id: txn_wb_0003, merchant: Faster Payment to R JONES, amount: '{{amount}}', status: posted}
  param_space:
    impersonated: [HMRC, Wrenfield's fraud team, the police]
    amount: ['950.00', '2,600.00']
  gold_tool_sequence: [report_scam_payment, freeze_card, set_alerts]
  expected_state_deltas: {scam_claim_status: OPEN, card_wb_0001.status: frozen, alerts_updated: true}
- id: TPL-WB-DEBT-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:25-34, age:35-44]
