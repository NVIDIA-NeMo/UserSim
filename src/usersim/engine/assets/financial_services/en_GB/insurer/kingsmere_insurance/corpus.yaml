  mentions_tools: []
  institution_id: kingsmere_insurance
- id: b4202160-706b-579d-a3da-c9147e2e0d98
  title: Kingsmere Home Insurance — an unexpected charge or amount
  body: 'If you notice a charge on your statement that does not align with your expected
    premium, please follow this guidance to identify the cause and reach a resolution.


    Symptom: The customer reports an unexpected deduction or a premium amount that
    differs from their previous payment.


    Likely Causes:

    - Administrative Fees: We apply transparent administrative fees to maintain operational
    quality. While these are sometimes waived for long-term loyalty tiers, they may
    appear on newer accounts.

    - Risk-Based Premium Adjustment: As a risk-based insurer, premiums may fluctuate
    upon renewal based on updated risk profiles. For example, a premium might move
    from an example rate of £340 to a different figure based on new risk data.

    - Mid-Term Adjustments: If you recently increased your contents cover limit (up
    to the £75,000 maximum) or modified your excess, a pro-rata charge may have been
    applied.


    What to check in order:

    1. Review your most recent policy schedule to see if the annual premium has changed.

    2. Check for the application of administrative fees in your payment breakdown.

    3. Confirm if any changes were made to your coverage limits or the standard excess
    of £100.


    Resolution:

    If the charge is a valid risk-based adjustment or fee, we will provide a clear
    explanation of the calculation. If the charge is found to be an error, we will
    apply a correction to your account immediately.


    When to Escalate:

    If you disagree with the risk-assessment used for your premium or if a fee should
    have been waived due to your loyalty tier but was not, the front-line agent will
    raise a case. This is then routed to a senior operations lead. You will be notified
    once the review is complete. If a resolution is not reached, you maintain the
    right to take the dispute to the free Financial Ombudsman Service.'
  domain: insurance
  product_category: home_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: cd79a11a-7f85-5f7a-b804-b0a225977873
  title: Kingsmere Home Insurance — required documentation
  body: 'To ensure the sustainable delivery of claims and fair pricing, we require
    specific documentation before a policy can be activated. The following matrix
    outlines the requirements for a first-time prospective customer.


    | Required Document | Purpose | Outcome upon Provision |

    | :--- | :--- | :--- |

    | Valid UK Government Photo ID | Identity Verification | MFA enabled / Account
    access granted |

    | Proof of Address (Utility Bill/Council Tax) | Residency Verification | Eligibility
    for UK household cover confirmed |

    | Professional Property Valuation | Confirming Rebuild Cost | Buildings cover
    limit approved up to £1,000,000 |

    | Detailed Home Inventory List | Assessing Contents Value | Contents cover limit
    approved up to £75,000 |

    | Previous Insurance History | Risk Assessment | Determination of risk-based premium
    (e.g., £340) |


    Failure to provide any of the above documentation will result in a pending application
    until the verification process is complete.'
