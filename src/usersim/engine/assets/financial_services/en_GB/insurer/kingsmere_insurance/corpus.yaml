- id: b235d9e0-5bdb-50c3-a609-71901fa792d4
  title: Kingsmere Lifetime Pet Insurance — account security best practices
  body: 'At Kingsmere Insurance, we are committed to protecting your personal data
    and your pet''s insurance records. To ensure the integrity of your policy, we
    employ rigorous security protocols that all policyholders must follow.


    **Mandatory Verification**

    Multi-factor authentication (MFA) is mandatory for all access to our secure web
    portals. Before any state-changing action—such as modifying your coverage or updating
    beneficiary details—we will perform a rigorous identity verification. This is
    a critical step to ensure that only verified policyholders can access sensitive
    data.


    **Common Fraud Patterns**

    Be vigilant against ''phishing'' attempts. Fraudsters may contact you pretending
    to be from Kingsmere Insurance, claiming there is an issue with your £99 excess
    or a problem with your monthly premium payments. They may attempt to create urgency
    to steal your login credentials.


    **Our Security Promise**

    To maintain your safety, we will never:

    * Ask you to disclose your MFA password or full security credentials via email
    or telephone.

    * Request payment for policy amendments via cryptocurrency or gift cards.

    * Ask you to transfer funds to a personal bank account to ''unlock'' a claim.


    **Immediate Action**

    If you notice any unauthorised changes to your policy or receive a suspicious
    communication, you must notify us immediately. Any reporting of suspected fraud
    within 24 hours of the occurrence helps us mitigate risk and secure your account
    more effectively. For further guidance on general security, you may refer to Kingsmere
    Lifetime Pet Insurance — regulatory disclosures.'
  domain: insurance
  product_category: pet_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: c52367de-eeb0-522e-be21-2888bd8fe9b8
  title: Kingsmere Lifetime Pet Insurance — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    of Kingsmere Lifetime Pet Insurance. We provide these terms to ensure transparency
    for customers comparing our comprehensive protection against alternative providers.


    **1. Modification of Terms**

    We reserve the right to amend the terms of this agreement to reflect changes in
    risk profile or regulatory requirements from the FCA and PRA. Any such changes
    will be communicated in writing via your registered email or secure portal with
    a minimum notice period of 30 days.


    **2. Price Stability and Renewal**

    In accordance with our commitment to fairness, we ensure that renewal prices for
    our insurance products do not exceed those offered to equivalent new customers.
    Premiums are risk-based to ensure sustainable claims delivery.


    **3. Core Benefit Anchors**

    Certain fundamental protections are central to this product and any change to
    these will trigger a full policy review:

    * **Annual Vet Fee Limit:** The current limit of £7,500 is reviewed annually.
    Any reduction in this limit will be flagged as a material change to your cover.

    * **Excess:** The standard excess of £99 applies to each condition per policy
    year. Changes to this amount will be detailed in your renewal notice.


    **4. Cooling-off Period**

    Every new policy is subject to a statutory 14-day cooling-off period. During this
    window, you may cancel the policy for a full refund of premiums paid, provided
    no claim has been made.


    **5. Termination**

    Either party may terminate the agreement upon written notice. In the event of
    termination, any outstanding administrative fees will be settled according to
    the current fee schedule.'
  domain: insurance
  product_category: pet_insurance
  document_type: terms_conditions
  source_authority: official
