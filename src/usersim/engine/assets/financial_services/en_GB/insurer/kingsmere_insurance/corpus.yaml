- id: 0500b8a6-d3e8-5b47-87ed-1f838f416f01
  title: Kingsmere Home Insurance — account agreement
  body: 'This account agreement outlines the binding obligations between Kingsmere
    Insurance (''we'', ''us'') and the policyholder. All coverage is subject to the
    terms of the specific policy schedule.


    1. Coverage Limits and Obligations

    We provide robust buildings and contents cover designed for comprehensive protection.
    The maximum buildings cover limit is £1,000,000, and the maximum contents cover
    limit is £75,000. It is the policyholder''s obligation to ensure these limits
    accurately reflect the value of their assets. Failure to disclose the true value
    of the property may result in a reduction of the payout in the event of a claim.


    2. Excesses

    All claims are subject to an excess, which is the amount the policyholder pays
    toward a claim. The standard excess for this product is £100. However, specific
    risks carry different requirements; for instance, the escape-of-water excess is
    £350. These amounts are deducted from any final claim settlement.


    3. Pricing and Renewals

    Premiums are risk-based to ensure the sustainable delivery of claims. We guarantee
    that renewal prices for your home insurance will not exceed those offered to equivalent
    new customers, ensuring fairness and transparency.


    4. Cancellation and Cooling-off

    In accordance with FCA regulations, we provide a statutory 14-day cooling-off
    period from the date of policy inception, during which the customer may cancel
    the policy.


    5. Regulatory Protection

    Our protection is underpinned by the Financial Services Compensation Scheme (FSCS).
    For general insurance, such as this home insurance product, the FSCS covers 90%
    of most claims if the insurer fails.


    6. Termination

    This agreement ends upon the expiry of the policy term, unless renewed. Either
    party may terminate the agreement following the cooling-off period, subject to
    the notice periods outlined in your policy schedule.'
  domain: insurance
  product_category: home_insurance
  document_type: terms_conditions
  source_authority: official
  placeholder: true
