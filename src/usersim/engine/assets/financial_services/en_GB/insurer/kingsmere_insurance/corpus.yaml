- id: 8eaaa4fa-d72b-5df9-bc9f-e06bf2393915
  title: Kingsmere Lifetime Pet Insurance — referral and loyalty offer
  body: 'We are pleased to invite our valued community to share the peace of mind
    that comes with Kingsmere Lifetime Pet Insurance. Between 1 October 2024 and 31
    December 2024, we are offering a loyalty reward for successful referrals.


    If you refer a new customer who takes out a policy during this period, we will
    apply a one-time loyalty credit of £25 to your account. Additionally, the new
    policyholder will receive a 10% discount on their first three monthly premiums.
    For instance, for a customer with an example monthly premium of £32, this would
    reduce the cost for the first three months of cover.


    To qualify, the referred party must cite your policy number during their application
    process. This offer is subject to our standard terms and is designed to reward
    those who help us grow our community of responsible pet owners. We believe in
    transparent pricing and rewarding long-term reliability.'
