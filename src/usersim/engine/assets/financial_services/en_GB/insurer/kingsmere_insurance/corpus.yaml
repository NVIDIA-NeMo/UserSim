- id: da77176a-f6e2-5f7b-8cd4-6a96b7709545
  title: Kingsmere Lifetime Pet Insurance — a failed or pending action
  body: 'If you are a prospective customer and find that your application for Kingsmere
    Lifetime Pet Insurance is marked as ''Pending'' or has ''Failed'', please follow
    these steps to resolve the issue.


    Symptom: The application status remains ''Pending'' for more than 24 hours or
    displays a ''Failed'' notification during the activation process.


    Likely Causes:

    - Identity Verification Failure: The most common cause is a failure in the mandatory
    multi-factor authentication (MFA) or a discrepancy in the identity documents provided.

    - Payment Authorization Issue: The initial premium payment (e.g., the £32 example
    monthly premium) may have been declined by your bank.

    - Incomplete Medical History: Required details regarding your pet''s health may
    be missing or insufficient for underwriting.


    What to Check and Resolve:

    1. Verify Identity: Check that the mobile number or email address used for MFA
    is current. If the verification failed, ask us to trigger a new authentication
    request. We cannot proceed with any state-changing action until your identity
    is rigorously verified.

    2. Confirm Payment Method: Ensure your payment method is valid for UK transactions
    and has sufficient funds to cover the first premium and any applicable administrative
    fees.

    3. Review Pet Documentation: Ensure all vet records have been uploaded or provided.
    If we require further clarity on a pre-existing condition, we will notify you.


    Escalation:

    If the issue persists after these checks, we will raise a case with our senior
    operations leads. You will receive a notification via your secure web portal or
    telephone once the lead has reviewed the block. We aim to resolve all pending
    activations within three UK business days.'
  domain: insurance
  product_category: pet_insurance
  document_type: troubleshooting
  source_authority: official
