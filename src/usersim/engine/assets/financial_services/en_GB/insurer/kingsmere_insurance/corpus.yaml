- id: 97cbe8c6-9600-59e9-870f-ad5c8c7a0b09
  title: Kingsmere Lifetime Pet Insurance — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding Kingsmere
    Lifetime Pet Insurance. We provide this information to ensure our customers can
    make an informed decision based on a high standard of care.


    Risk-Based Pricing

    Please be advised that premiums are risk-based. This means your premium—which
    may be £32 per month in an example scenario—is calculated based on factors including
    your pet''s breed, age, and medical history. This ensures the sustainable delivery
    of claims and fair pricing for all policyholders.


    FSCS Protection\Kingsmere Insurance is authorised and regulated by the FCA and
    PRA. Protection for this product is underpinned by the Financial Services Compensation
    Scheme (FSCS). In the event of institutional failure, the FSCS covers 90% of most
    general insurance claims, including those under this pet insurance policy.


    Cooling-off Period\In accordance with statutory regulations, we offer a 14-day
    cooling-off period from the date the policy is established. During this window,
    you may cancel the policy for a full refund of the premium, provided no claim
    has been made.


    Exclusions and Limitations\Coverage is subject to an annual vet fee limit of £7,500
    and a policy excess of £99. Pre-existing conditions—defined as any illness or
    injury that occurred prior to the start of the policy—are typically excluded from
    cover. We provide educational guidance to help you understand these options, but
    we do not offer individualised legal or tax advice.


    For a complete list of your obligations, please see Kingsmere Lifetime Pet Insurance
    — account agreement.'
  domain: insurance
  product_category: pet_insurance
  document_type: disclosure
  source_authority: official
