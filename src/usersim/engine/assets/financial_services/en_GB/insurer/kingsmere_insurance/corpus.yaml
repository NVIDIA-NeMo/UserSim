- id: 90b85cc0-08fc-5f87-9de6-0c8b09648e39
  title: Kingsmere Level Term Life Insurance — example amount of cover explained
  body: 'Q: What does the ''amount of cover'' actually mean in my policy?


    A: The amount of cover, often referred to as the sum assured, is the fixed lump
    sum that we pay out to your beneficiaries if you pass away during the term of
    your policy. For example, if your policy has an example cover amount of £200,000,
    this is the total amount that would be paid out, provided the policy is active
    and all terms are met.


    Q: Does the amount of cover decrease as I get older?


    A: No. Because this is a ''Level Term'' policy, the cover amount remains the same
    throughout the entire duration of the term. If you start with £200,000 of cover,
    that amount remains constant regardless of whether you are in the first or final
    year of your 25-year term.


    For more details on how your specific policy is structured, please refer to Kingsmere
    Level Term Life Insurance — overview.'
