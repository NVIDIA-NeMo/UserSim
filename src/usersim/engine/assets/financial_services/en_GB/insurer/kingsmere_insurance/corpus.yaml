- id: 15ffe572-b305-5810-8d5b-f06c174e2b12
  title: Kingsmere Lifetime Pet Insurance — excess per condition each policy year
    explained
  body: '**How does the excess work for my pet''s condition?**

    Under Kingsmere Lifetime Pet Insurance, the excess of £99 is applied ''per condition,
    per policy year''. This means if your pet is treated for a respiratory infection
    and later a skin allergy in the same year, you will pay the £99 excess for each
    distinct condition.


    **Do I have to pay the excess every time I visit the vet for the same illness?**

    No. Once the £99 excess has been met for a specific condition within a single
    policy year, you will not be asked to pay it again for that same condition until
    the policy renews.


    **What happens when the policy year renews?**

    Upon renewal, the excess resets. If your pet has a chronic condition that requires
    ongoing treatment, you will pay the £99 excess again at the start of the new policy
    year before further claims for that condition are covered up to the £7,500 annual
    vet fee limit.


    For a broader view of costs, see Kingsmere Lifetime Pet Insurance — cost and charges.'
  domain: insurance
  product_category: pet_insurance
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
