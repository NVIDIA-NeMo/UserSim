- id: 2fabaa94-5a9d-51d7-a3df-686fbe2b0b17
  title: Kingsmere Level Term Life Insurance — getting started walkthrough
  body: 'This walkthrough is intended for support agents to guide prospective customers
    through the onboarding process for Kingsmere Level Term Life Insurance. Our goal
    is to ensure a seamless transition from inquiry to active coverage.


    Step 1: Needs Analysis

    Assist the customer in determining their required cover amount. For instance,
    a customer may choose a cover amount of £200,000 to ensure their mortgage and
    dependents are protected.


    Step 2: Term Selection

    Help the customer select a term that aligns with their financial obligations.
    A common example is a term of 25 years, coinciding with a standard mortgage length.


    Step 3: Premium Quotation

    Provide a risk-based premium quote. Based on the customer''s profile, they might
    be quoted a monthly premium of £12. Clearly explain that this premium is fixed
    for the duration of the term.


    Step 4: Trust Arrangement

    Educate the customer on the importance of having the policy ''Written in Trust''.
    Explain that this legal arrangement ensures the payout avoids probate and goes
    directly to their beneficiaries, facilitating a more efficient payout.


    Step 5: Application and Underwriting

    Guide the customer through the application process. We will perform necessary
    risk assessments. Remind the customer that we provide educational guidance on
    coverage options but do not offer individualised tax or legal advice.


    Step 6: Verification and Activation

    Once approved, the customer must complete our rigorous identity verification process.
    After MFA is established and the first premium is processed, the policy becomes
    active.


    Remind the customer of their 30-day cooling-off period and the fact that their
    policy is 100% protected by the FSCS. For common queries regarding the length
    of cover, refer to Kingsmere Level Term Life Insurance — example term (years)
    explained.'
  domain: insurance
  product_category: life_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
