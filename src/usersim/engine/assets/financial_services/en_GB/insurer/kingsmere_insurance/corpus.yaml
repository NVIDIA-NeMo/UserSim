- id: f1fa94a9-5941-525c-bd2f-28cb32689c5f
  title: Kingsmere Home Insurance — regulatory disclosures
  body: 'Kingsmere Insurance operates in strict adherence to the regulations set forth
    by the Financial Conduct Authority (FCA) and the Prudential Regulation Authority
    (PRA). This document outlines the regulatory protections and obligations associated
    with Kingsmere Home Insurance.


    **Statutory Cooling-off Period**

    In accordance with UK regulations, all policyholders are entitled to a 14-day
    cooling-off period from the date the policy is activated. During this window,
    you may cancel your policy and receive a refund of the premiums paid, subject
    to any claims made during that period.


    **Financial Services Compensation Scheme (FSCS)**

    Our protection is underpinned by the FSCS. For general insurance products, such
    as Kingsmere Home Insurance, the FSCS covers 90% of most general insurance claims
    if the insurer is unable to meet its obligations. This provides you with an essential
    layer of security for your home and belongings.


    **Pricing Fairness**

    We adhere to the principle of fair value. Specifically, for home and car insurance,
    we ensure that renewal prices are not higher than those offered to new customers
    who have an equivalent risk profile.


    **Verification and Security**

    To prevent fraud and protect sensitive personal data, multi-factor authentication
    (MFA) and rigorous identity verification are mandatory before any state-changing
    action, such as modifying coverage or adding named drivers, can be performed.


    **Dispute Resolution**

    We handle all complaints and claims promptly and fairly. While we never promise
    a specific outcome for any individual claim, we are committed to a fair process.
    If a resolution is not reached through our internal escalation path, you have
    the right to take your dispute to the free Financial Ombudsman Service.


    ***


    DISCLAIMER: We provide educational guidance and product recommendations based
    on a high standard of care, but we do not offer individualised tax or legal advice.'
  domain: insurance
  product_category: home_insurance
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
