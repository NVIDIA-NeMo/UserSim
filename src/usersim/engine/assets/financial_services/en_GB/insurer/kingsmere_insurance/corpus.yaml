- id: f37ffdb0-6176-55d0-bc15-628e43f3d0da
  title: Kingsmere Lifetime Pet Insurance — set up and activate
  body: 'Setting up your Kingsmere Lifetime Pet Insurance is a straightforward process
    designed to get your pet protected as quickly as possible. Please ensure you have
    your pet''s medical records and your own identification ready before beginning.


    1. Provide Pet and Owner Details: Tell us about your pet, including their breed,
    age, and full medical history. You will also need to provide your current UK address
    and contact information. We will confirm that these details have been recorded
    correctly.


    2. Select Your Coverage Level: We will guide you through our comprehensive cover
    options. Confirm that you wish to proceed with the Lifetime plan, which includes
    the renewing annual vet fee limit of £7,500.


    3. Complete Identity Verification: To protect your account and comply with security
    regulations, we require mandatory identity verification. We will trigger a multi-factor
    authentication (MFA) request to your registered device. Once you have confirmed
    the prompt, we will verify your identity.


    4. Set Up Payment: Provide your preferred payment method for the premiums. If
    you are using the example plan, this would be a monthly charge of £32. We will
    confirm the date of your first payment and the start date of your cover.


    5. Receive Policy Confirmation: Once payment is authorised and verification is
    complete, we will provide you with your policy schedule. This document confirms
    your coverage, your £99 excess, and the details of your 14-day cooling-off period.


    Your policy is now active. You can manage your coverage through our secure web
    portal during UK business hours (GMT). If you need to make future amendments,
    we recommend reviewing Kingsmere Lifetime Pet Insurance — eligibility requirements
    to ensure all updated details remain within our underwriting guidelines.'
  domain: insurance
  product_category: pet_insurance
