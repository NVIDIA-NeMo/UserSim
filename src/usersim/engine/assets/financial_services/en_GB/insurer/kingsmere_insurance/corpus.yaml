- id: 2a5db0e3-2736-5114-bef9-82655c908a35
  title: Kingsmere Home Insurance — comparison vs. alternatives and when not to choose
    it
  body: 'When choosing a home insurance provider, it is important to align the product''s
    strengths with your specific household needs. Kingsmere Home Insurance is positioned
    as a premium, comprehensive provider for those who value long-term reliability
    and transparency.


    Why Choose Kingsmere Home Insurance?

    We offer a level of protection designed for substantial UK households. Our buildings
    cover limit of £1,000,000 provides a significant safety net for the structure
    of your home, while the contents cover limit of £75,000 ensures your belongings
    are well-protected. Unlike budget providers, we focus on the fairness of our renewal
    pricing, ensuring that long-term customers are not penalised with excessive price
    hikes.


    Comparison with Alternatives

    - Budget Providers: These often offer lower annual premiums but come with significantly
    lower cover limits and higher, often hidden, excesses. Kingsmere provides a transparent
    structure with a standard excess of £100.

    - Basic ''Contents-Only'' Policies: These are cheaper but offer zero protection
    for the building. Our product is a robust combined solution.


    When NOT to Choose This Product

    Kingsmere Home Insurance may not be the optimal choice if:

    - You are renting a property and have no responsibility for the building''s structure,
    making our £1,000,000 buildings limit unnecessary.

    - You have a very minimal amount of belongings and find the £75,000 contents limit
    far exceeds your requirements, potentially leading you to seek a more basic, low-cost
    policy.

    - You prefer a provider with a non-structured escalation path for claims; we adhere
    to a strict path from front-line agents to senior operations leads to ensure quality.


    Regardless of your choice, remember that all our policies are underpinned by the
    FSCS, covering 90% of most general insurance claims. For a detailed breakdown
    of how we handle the cost of claims, see Kingsmere Home Insurance — standard excess
    explained.'
  domain: insurance
  product_category: home_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: e42255b3-a4fe-5c88-a97a-e9935c9152c6
  title: Kingsmere Home Insurance — escape-of-water excess explained
  body: 'What is the ''escape-of-water'' excess?

    An escape-of-water event occurs when water accidentally escapes from a pipe, tank,
    or appliance, causing damage to your home. Because these incidents are more frequent
    and often more costly to repair, they carry a specific excess of £350, rather
    than the standard excess of £100.


    Why is this excess higher than the standard one?

    Risk-based pricing allows us to maintain sustainable claims delivery and keep
    annual premiums (such as our £340 example) fair for all policyholders. The £350
    excess reflects the higher risk associated with water damage.


    Does this replace the standard excess?

    Yes, for any claim specifically classified as escape-of-water, the £350 excess
    applies. For other types of claims, such as fire or theft, the standard excess
    of £100 remains in effect. For more information on how we calculate your cover,
    refer to Kingsmere Home Insurance — overview.'
  domain: insurance
  product_category: home_insurance
