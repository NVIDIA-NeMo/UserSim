- id: f98ca095-0473-585f-a446-0fa3822d1d46
  title: Kingsmere Comprehensive Car Insurance — make a change or update
  body: "If you need to amend your Kingsmere Comprehensive Car Insurance policy—such\
    \ as adding a named driver, changing your vehicle, or updating your address—please\
    \ follow these steps to ensure your cover remains valid.\n\n1. Provide your policy\
    \ number and undergo our mandatory identity verification process. Because we prioritise\
    \ security, we will ask a series of verification questions to ensure you are the\
    \ authorised policyholder.\n\n2. Clearly state the change you wish to make. For\
    \ example, if you are adding a named driver, provide their full name, date of\
    \ birth, and driving licence details. \n\n3. We will assess the impact of this\
    \ change on your risk profile. Because our premiums are risk-based, adding a driver\
    \ or changing a vehicle may result in a premium adjustment. We will provide you\
    \ with the exact updated cost and explain how it was calculated.\n\n4. If the\
    \ change involves a new vehicle, we will confirm the new compulsory excess—which\
    \ is typically £250—and any specific risk provisions that apply to the new model.\n\
    \n5. We will confirm the final agreed amendment and the date from which the change\
    \ takes effect. You will receive a confirmation notice via your secure web portal.\n\
    \n6. If the update requires an additional payment, we will process this transparently.\
    \ If you are in a long-term loyalty tier, please ask us if any associated administrative\
    \ fees for this change can be waived.\n\nOnce these steps are complete, your policy\
    \ documents will be updated automatically. You can verify the changes by logging\
    \ into your portal using multi-factor authentication."
