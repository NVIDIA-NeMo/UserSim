- id: 2e75d128-64ef-56ab-8afb-f2657f05e960
  title: Kingsmere Comprehensive Car Insurance — fraud and unauthorized-activity protection
  body: 'At Kingsmere Insurance, we are committed to ensuring your motor protection
    remains secure. When comparing our services to other providers, it is important
    to understand the specific protections we employ to safeguard your policy and
    personal data.


    Fraudsters often target car insurance policyholders through ''renewal phishing''.
    You may receive emails or text messages that appear to be from us, claiming there
    is an urgent issue with your renewal or an unexpected refund waiting for you.
    These messages often pressure you to click a link and enter your payment details.
    Please be aware that we will never ask you to provide your full password or multi-factor
    authentication (MFA) codes over the telephone or via an unverified link.


    To prevent unauthorized activity, we mandate rigorous identity verification and
    multi-factor authentication before any state-changing action is performed on your
    account. This means that only a verified policyholder can modify coverage, add
    named drivers, or access sensitive personal data. If you are comparing this against
    alternatives, you will find that our strict adherence to these verification standards
    is designed to eliminate the risk of third parties altering your protection levels
    without your consent.


    If you suspect that your policy details have been compromised or if you notice
    any unauthorized changes to your coverage, you must notify us immediately. Prompt
    reporting is essential to limit your liability and allow us to secure your account.
    We recommend regularly reviewing your policy documents via our secure web portal
    to ensure all details remain accurate.


    ***

    DISCLAIMER: While we provide robust security frameworks, the effectiveness of
    these protections relies on the policyholder maintaining the confidentiality of
    their own login credentials and MFA devices.'
  domain: insurance
  product_category: car_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 20b4cca0-a2f4-5001-b78d-9236104fc66f
  title: Kingsmere Comprehensive Car Insurance — account agreement
  body: "This account agreement outlines the binding obligations between Kingsmere\
    \ Insurance and the policyholder for Kingsmere Comprehensive Car Insurance. \n\
    \nOur primary obligation is to provide comprehensive motor protection based on\
    \ the terms agreed upon at the start of the policy. In return, the policyholder\
    \ is obligated to provide honest and accurate information during the application\
    \ process and whenever notifying us of changes to their circumstances. Any misrepresentation\
    \ may void the cover.\n\nFinancial Obligations:\nPolicyholders are responsible\
    \ for the payment of premiums, which are risk-based to ensure sustainable claims\
    \ delivery. A compulsory excess of £250 applies to claims, representing the amount\
    \ the policyholder must contribute toward a claim. If the policyholder has opted\
    \ to protect their No Claims Discount, an additional cost of £45 is applied to\
    \ the premium.\n\nChanges and Terminations:\nWe reserve the right to amend terms\
    \ to reflect regulatory changes or risk profile shifts, provided sufficient notice\
    \ is given. Customers benefit from a statutory cooling-off period of 14 days from\
    \ the policy inception date, during which they may cancel the agreement. \n\n\
    Termination of the agreement may occur if premiums remain unpaid after the specified\
    \ grace period or if a material breach of the policy terms is discovered. Upon\
    \ termination, any remaining balance or refund will be processed following a final\
    \ account reconciliation.\n\nDisputes:\nWe handle all complaints promptly and\
    \ fairly. If a resolution is not reached through our internal escalation path,\
    \ policyholders maintain the right to take their dispute to the free Financial\
    \ Ombudsman Service.\n\n***\nDISCLAIMER: This document is a summary of the account\
    \ agreement. Please refer to your individual policy schedule for specific coverage\
    \ limits and exclusions."
  domain: insurance
  product_category: car_insurance
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 4ee330e4-4f5f-5e86-943f-1a0c56e8b9bc
  title: Kingsmere Comprehensive Car Insurance — who it is best for and common use
    cases
  body: 'Kingsmere Comprehensive Car Insurance is designed for UK motorists who prioritize
    long-term reliability, transparency, and fair renewal pricing over the lowest
    possible entry-level quote. We position ourselves as a premium provider for those
    who value a partnership with their insurer.


    This product is best suited for:

    - Established drivers with a strong No Claims Discount (NCD) who wish to maintain
    their reward through our protection option, available for £45.

    - Households requiring flexibility with named drivers, ensuring that multiple
    family members are covered under a single, robust framework.

    - Customers who prefer a predictable cost structure; for example, a typical annual
    premium may be around £640, depending on the individual risk profile.


    Common Use Cases:

    - The Loyal Motorist: A driver who values the fact that our renewal prices for
    car insurance do not exceed those offered to equivalent new customers, avoiding
    the ''loyalty penalty''.

    - The Risk-Averse Driver: A policyholder who wants the security of a comprehensive
    plan where the compulsory excess is clearly defined as £250, allowing them to
    budget effectively for potential incidents.

    - The Growing Family: A user who needs to frequently update named drivers as children
    reach driving age, relying on our secure verification processes to make these
    changes safely.


    By choosing Kingsmere, you are opting for a service that adheres strictly to FCA
    and PRA regulations, ensuring that your protection is underpinned by the FSCS,
    which covers 90% of most general insurance claims.'
  domain: insurance
  product_category: car_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
