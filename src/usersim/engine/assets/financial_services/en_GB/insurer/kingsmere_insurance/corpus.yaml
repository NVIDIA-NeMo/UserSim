- id: 32b3c8ff-0962-5171-b32e-fa976066ec52
  title: Kingsmere Comprehensive Car Insurance — eligibility and setup
  body: 'For our existing policyholders, managing your setup and eligibility is a
    straightforward process. Here are the answers to common queries.


    **Can I add a new driver to my existing policy?**

    Yes, you can add named drivers to your cover. Because we use risk-based pricing,
    adding a driver may adjust your premium. Please provide the driver''s details,
    and we will confirm the updated cost.


    **What happens if I change my vehicle?**

    If you replace your car, you must notify us immediately. We will assess the risk
    of the new vehicle and inform you if your annual premium (e.g., £640) needs to
    be adjusted to maintain comprehensive cover.


    **How do I activate NCD protection?**

    If you have not already done so, you can request to protect your No Claims Discount
    for a cost of £45. This can be added to your policy at any time during the term,
    subject to eligibility.'
  domain: insurance
  product_category: car_insurance
  document_type: faq
  source_authority: official
