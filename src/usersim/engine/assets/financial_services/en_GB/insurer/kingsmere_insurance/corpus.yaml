- id: 60029047-663a-5e29-8a5c-daf5ce7aac95
  title: Kingsmere Level Term Life Insurance — referral and loyalty offer
  body: 'We are pleased to announce a limited-time opportunity for those seeking to
    secure their family''s future with Kingsmere Level Term Life Insurance. From 1st
    November 2024 to 31st January 2025, we are offering a special incentive for new
