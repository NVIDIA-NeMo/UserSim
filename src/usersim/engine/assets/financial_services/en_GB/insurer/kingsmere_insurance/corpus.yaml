- id: d07e2096-09fa-57a6-8f81-fa50451a4a8e
  title: Kingsmere Comprehensive Car Insurance — fee schedule
  body: 'This schedule outlines the standard fees and costs associated with Kingsmere
    Comprehensive Car Insurance. All fees are applied transparently to ensure operational
    quality.


    - **Compulsory Excess**: £250 (This is the amount the policyholder pays toward
    any claim).

    - **No Claims Discount (NCD) Protection**: £45 (An annual cost to protect your
    discount from being lost after a claim).

    - **Annual Premium (Example)**: £640 (Note: Actual premiums are risk-based and
    will vary per customer).


    Administrative fees may be applied for specific policy amendments. These fees
    are designed to maintain our high standard of service and may be waived for customers
    within our long-term loyalty tiers. Please consult the specific policyholder''s
    tier status before applying or waiving administrative charges.'
  domain: insurance
