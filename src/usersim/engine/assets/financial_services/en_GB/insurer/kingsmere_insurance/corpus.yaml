- id: 13cb69c3-e5a4-5d24-b8df-ac1be4094e79
  title: Kingsmere Comprehensive Car Insurance — resolve a common request end-to-end
  body: 'One of the most common requests we handle is the addition of a named driver
    to a policy. To ensure your cover remains valid and your pricing fair, please
    follow this end-to-end process.


    **Prerequisites**

    - The full name and license details of the driver to be added.

    - Your policy number.

    - Access to your MFA-enabled device.


    **Step-by-Step Process**

    1. Request Addition: Tell us that you wish to add a named driver to your Kingsmere
    Comprehensive Car Insurance policy.

    2. Identity Verification: To prevent unauthorised changes, we will perform a mandatory
    identity check. You must successfully complete the multi-factor authentication
    (MFA) process.

    3. Provide Driver Information: Give us the driver''s full name, date of birth,
    and driver''s license number. If the driver has their own No Claims Discount,
    provide those details as well.

    4. Premium Assessment: We will calculate the risk associated with the new driver.
    We will then inform you if this results in an increase to your annual premium
    (e.g., an increase above the £640 example).

    5. Confirm and Accept: Once we provide the updated premium and any changes to
    the terms, confirm your acceptance of the new cost.

    6. Final Confirmation: We will update your policy and provide a revised certificate
    of insurance via your secure web portal.


    **How You Know It Worked**

    The process is complete when you receive a confirmation message and can see the
    new driver listed on your policy documents in the secure portal.


    ***

    DISCLAIMER: Adding a driver without prior verification and agreement to the adjusted
    premium may invalidate your cover in the event of a claim.'
  domain: insurance
  product_category: car_insurance
  document_type: how_to_guide
  source_authority: official
