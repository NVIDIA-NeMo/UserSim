- id: c160869b-978d-5be0-b60e-c4ca7606f0ee
  title: Kingsmere Comprehensive Car Insurance — how rates are tiered and applied
  body: 'This document explains the application of rates and fees for Kingsmere Comprehensive
    Car Insurance for support agents.


    Premium Calculation:

    Rates are not flat; they are risk-based. This ensures sustainable claims delivery
    and fair pricing for all. An example annual premium for a standard profile is
    £640, though this varies based on the individual''s risk assessment.


    NCD Protection Tier:

    There is a single flat fee for protecting the No Claims Discount: £45. This is
    applied as an additional cost to the base premium for any policyholder who opts
    into this protection.


    Administrative Fees:

    Administrative fees are applied transparently to maintain operational quality.
    These fees are not tiered by premium amount but may be waived for customers who
    have reached long-term loyalty tiers.


    Excess Application:

    Every policy is subject to a compulsory excess of £250. This is a fixed rate and
    does not change regardless of the premium tier or loyalty status of the customer.'
  domain: insurance
  product_category: car_insurance
  document_type: rate_sheet
  source_authority: official
