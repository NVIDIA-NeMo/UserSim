- id: 8c05d5b0-5aaf-5a12-a448-ad134a7c4a5e
  title: Kingsmere Lifetime Pet Insurance — a discrepancy in your records or statement
  body: 'Support agents should follow this protocol when a customer reports a discrepancy
    in their policy records or monthly statements.


    **Symptom**

    A customer claims that their monthly premium is incorrect (e.g., they expected
    £32 but were charged a different amount), or they believe a claim was not correctly
    deducted from their annual vet fee limit of £7,500.


    **Investigation Steps**

    1. **Verify the Statement**: Ask the customer to specify the date and amount of
    the discrepancy. Compare this against the internal billing ledger.

    2. **Review the Premium Logic**: Check if a renewal has occurred. Remind the customer
    that premiums are risk-based and may change annually. Verify if any administrative
    fees were applied or if a loyalty tier discount should have been active.

    3. **Audit the Claims History**: If the discrepancy relates to the £7,500 limit,
    review all paid claims for the current policy year. Ensure the £99 excess was
    correctly applied to each claim and that the total payout was accurately subtracted
    from the annual limit.

    4. **Check for Pending Actions**: Determine if a policy amendment was recently
    requested but not yet finalised, which could lead to a temporary mismatch in the
    portal view.


    **The Fix**

    - **Billing Error**: If we have overcharged the customer, we will apply a credit
    to the next month''s premium or issue a refund via the original payment method.

    - **Record Error**: If the vet fee limit is showing an incorrect balance, we will
    manually reconcile the claims history and update the portal display.


    **Escalation Path**

    If the discrepancy cannot be resolved through a standard audit, the agent must
    raise the case to a senior operations lead for a full financial reconciliation.
    The customer should be informed that this will be resolved within three UK business
    days and will receive a written explanation and confirmation of the correction
    via their secure portal.'
  domain: insurance
  product_category: pet_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: c01655ad-00e1-5b05-a230-82f421cc3e3c
  title: Kingsmere Level Term Life Insurance — overview
  body: 'Kingsmere Level Term Life Insurance provides fixed-sum financial security
    for a set term, designed to offer your loved ones a guaranteed level of protection
    regardless of when a claim is made during the policy period. We focus on providing
    a transparent, reliable partnership to ensure your beneficiaries are supported.


    Our cover is designed for those who require a consistent payout to cover specific
    long-term liabilities, such as a mortgage or family living expenses. For example,
    a policyholder may choose a cover amount of £200,000 over a term of 25 years.
    In this scenario, the payout remains £200,000 throughout the entire duration,
    provided the premiums are maintained. Based on a specific risk profile, such a
    policy might have a monthly premium of £12.


    To ensure the most efficient payout, we recommend that policies are written in
    trust. This legal arrangement allows the payout to avoid probate and go directly
    to your beneficiaries, reducing delays and potential tax complications.


    We adhere to strict regulatory standards to ensure fairness. All our life insurance
    policies include a statutory cooling-off period of 30 days, during which you may
    cancel the policy if you decide it does not meet your needs.


    ***

