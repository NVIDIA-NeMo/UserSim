- id: 50b7d266-e6a4-5bc3-8783-66ebc8f9704f
  title: Kingsmere Comprehensive Car Insurance — compulsory excess explained
  body: 'How does the compulsory excess work on my policy?


    The compulsory excess is a fixed amount that you, the policyholder, are required
    to pay toward any claim you make. For Kingsmere Comprehensive Car Insurance, the
    compulsory excess is £250. This amount is set by us based on the risk level of
    the product and cannot be removed from the policy.


    If you make a claim for £1,000, we will deduct the £250 compulsory excess from
    the payout, and you will receive £750. You are responsible for paying the remaining
    £250 to the repairer or service provider.


    Can I change this amount?


    No, the compulsory excess of £250 is a standard requirement for this product to
    ensure the sustainable delivery of claims for all our customers. However, you
    may choose to add a voluntary excess to further lower your premium, which would
    be paid in addition to the £250 compulsory amount.


    For more details on costs, please see Kingsmere Comprehensive Car Insurance —
    cost and charges.'
  domain: insurance
  product_category: car_insurance
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 02685f0e-71cc-5812-9911-ecf676c6a220
  title: Kingsmere Comprehensive Car Insurance — cancel, close, or downgrade
  body: 'If you are comparing your current coverage against alternatives and decide
    that Kingsmere Comprehensive Car Insurance is no longer the right fit, we provide
    a structured process for cancelling, closing, or downgrading your policy.


    Before you begin, ensure you have your policy number ready and access to your
    multi-factor authentication (MFA) device, as we must verify your identity before
    any state-changing action occurs.


    1. Notify us of your intent: Tell us whether you wish to cancel the policy entirely,
    close the account, or downgrade to a different level of cover. If you are within
    your 14-day cooling-off period, please specify this to ensure a full refund of
    your premium.

    2. Identity Verification: We will perform a rigorous verification check. You will
    be asked to confirm details and complete an MFA challenge to ensure that only
    the verified policyholder is requesting the change.

    3. Policy Review: We will review your current policy, including any active No
    Claims Discount protection (which costs £45) and your current premium status.
    We will inform you of any outstanding administrative fees or potential refunds.

    4. Confirmation of Terms: We will explain the implications of the change, such
    as the loss of comprehensive cover or the impact on your NCD, and we will confirm
    the final date and time the coverage ceases.

    5. Receipt of Closing Documentation: Once the action is processed, we will provide
    you with a formal confirmation of the cancellation or downgrade and a statement
    of any final balance or refund due.


    Your policy remains active until the confirmed termination date. For those seeking
    a different tier of cover, please refer to Kingsmere Comprehensive Car Insurance
    — choosing between tiers or options.'
  domain: insurance
  product_category: car_insurance
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 4c98aca9-68e0-5d53-9633-8c8ac77b2bf2
  title: Kingsmere Comprehensive Car Insurance — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who report an unexpected
    charge or a discrepancy in their premium amount for Kingsmere Comprehensive Car
    Insurance.


    Symptom:

    The customer states: "My latest statement shows a higher amount than I expected,"
    or "I have been charged a fee I don''t recognise."


    Likely Causes and Checks:

    1. No Claims Discount (NCD) Protection: Check if the customer has opted into NCD
    protection. This carries a specific cost of £45. If this was recently added or
    renewed, it will appear as an additional charge.

    2. Administrative Fees: Review the account for standard administrative fees. While
    these are applied transparently to maintain operational quality, verify if the
    customer belongs to a loyalty tier that should have these waived.

    3. Risk-Based Premium Adjustment: Check if there was a mid-term adjustment (e.g.,
    adding a named driver) that altered the risk profile, resulting in a premium increase
    from the example rate of £640.

    4. Compulsory Excess Application: If the charge relates to a claim, verify if
    the customer is confused by the £250 compulsory excess, which is their responsibility
    to pay and not a fee charged by us.


    Resolution Path:

    - If the charge is a valid NCD protection fee of £45 or a standard admin fee,
    explain the purpose of the charge to the customer clearly.

    - If the charge is due to a risk adjustment, provide the updated policy schedule
    and explain the change in premium.

    - If the customer disputes the validity of the charge and it cannot be resolved
    through the above checks, escalate the matter to a senior operations lead for
    a final resolution review.


    The customer should be informed that we handle all disputes promptly and fairly,
    and if they remain unsatisfied, they have the right to contact the Financial Ombudsman
    Service.'
  domain: insurance
  product_category: car_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
