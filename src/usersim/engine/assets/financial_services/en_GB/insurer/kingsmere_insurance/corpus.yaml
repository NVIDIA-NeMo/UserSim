- id: 34b42ec2-9a13-566f-a461-3c18829d43b6
  title: Kingsmere Level Term Life Insurance — make a change or update
  body: 'Updating your policy details is a straightforward process, provided the request
    is made by the verified policyholder. Whether you are updating your contact information
    or modifying your beneficiaries, please follow these steps:


    1. Specify the update

    Tell us exactly what information needs to be changed. For example, if you are
    updating the trust details for your payout or changing your home address, provide
    the new details clearly.


    2. Complete identity verification

    Because policy amendments are state-changing actions, we must verify your identity.
    We will prompt you to complete a multi-factor authentication (MFA) check via your
    secure web portal or registered device. This ensures that only you can modify
    your coverage or access sensitive personal data.


    3. Review the impact on your policy

    If the change affects the risk profile (such as an increase in the cover amount
    from £200,000 to a higher sum), we will provide a revised risk-based premium quote.
    We will explain any changes to your monthly premium, such as an increase from
    £12, and how these changes affect your overall cost.


    4. Confirm the amendment

    Once you have reviewed the terms and the updated premium, provide your explicit
    consent for the change. We will then process the update and send a confirmation
    notice to your registered email address.


    5. Verify the update

    Log into your secure web portal to ensure the changes are reflected correctly
    in your policy documents.


    If you encounter any issues during the MFA process, please refer to Kingsmere
    Level Term Life Insurance — access or login problems.'
  domain: insurance
  product_category: life_insurance
  document_type: how_to_guide
  source_authority: official
