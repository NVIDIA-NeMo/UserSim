- id: a96ebff4-345a-5d48-b1f7-686607f75b02
  title: Kingsmere Level Term Life Insurance — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding Kingsmere
    Level Term Life Insurance. Please read these carefully to understand the nature
    of your cover and the protections in place.


    Regulatory Protections:

    Our life insurance products are strictly adherent to FCA and PRA regulations.
    A critical protection for our policyholders is the Financial Services Compensation
    Scheme (FSCS), which covers 100% of life insurance claims. This ensures that the
    financial security promised to your beneficiaries is maintained even in the event
    of institutional failure.


    Cooling-off Period:

    We provide a statutory 30-day cooling-off period for all life insurance policies.
    During this time, you may cancel your cover for any reason and receive a full
    refund of the premiums paid.


    Pricing and Risk:

    Premiums are risk-based, meaning the cost of your cover—such as an example monthly
    premium of £12—is determined by factors including age, health, and lifestyle.
    This ensures that pricing is fair and sustainable for all policyholders. We do
    not guarantee that premiums will remain static if there are material changes to
    the risk profile of the policyholder.


    Advice Boundaries:

    While we provide educational guidance and product recommendations to help you
    choose a cover amount (e.g., £200,000) and a term (e.g., 25 years), Kingsmere
    Insurance does not offer individualised tax or legal advice. We strongly recommend
    consulting a qualified professional regarding the tax implications of your policy
    or the legal specifics of writing a policy in trust.


    ***

    DISCLAIMER: The payout of the sum assured is subject to the terms and conditions
    of the policy and the validity of the claims process. We never promise a specific
    outcome for any individual claim until the full underwriting and claims investigation
    is complete.'
