- id: 33561f43-9bc3-50a5-b14b-85a6aac00b75
  title: Kingsmere Comprehensive Car Insurance — recognizing scams targeting this
    product
  body: 'At Kingsmere Insurance, we are committed to your financial security. As you
    compare your protection options, it is vital to remain vigilant against fraudulent
    activities specifically targeting motor insurance policyholders. Scammers often
    attempt to mimic the professional tone of established insurers to steal personal
    data or divert premium payments.


    Common patterns to recognize include:


    1. Unsolicited Renewal Quotes: You may receive emails or phone calls from individuals
    claiming to be from Kingsmere Insurance offering an ''exclusive'' renewal rate
    significantly lower than our standard risk-based pricing. We will never pressure
    you into an immediate decision via an unofficial channel.

    2. Request for Security Credentials: Scammers may claim there is an issue with
    your policy and ask for your password or multi-factor authentication codes to
    ''verify'' your account. We will never ask you to disclose your password or MFA
    codes over the phone or via email.

    3. Direct Payment Diversion: Be wary of requests to change your premium payment
    method to an unverified bank account or a third-party payment service. All legitimate
    Kingsmere Insurance payments are processed through our secure, verified channels.


    If you encounter any communication that feels suspicious, do not provide any personal
    information or click on any links. Instead, please notify us immediately so we
    can secure your account. The faster we are informed, the more effectively we can
    protect your data.


    ***

    DISCLAIMER: Kingsmere Insurance is not liable for losses incurred through the
    disclosure of security credentials to third parties. Please refer to Kingsmere
    Comprehensive Car Insurance — account security best practices for further guidance
    on safeguarding your policy.'
  domain: insurance
  product_category: car_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 3a1c7997-b0bd-5acc-a29b-711ad08e8dbd
  title: Kingsmere Comprehensive Car Insurance — limits, restrictions, and edge cases
  body: 'This document provides support agents with a technical overview of the limitations
    and specific conditions associated with Kingsmere Comprehensive Car Insurance.
    When assisting customers, ensure these constraints are clearly communicated to
    avoid expectations that fall outside the scope of cover.


    Financial Limits and Thresholds:

    - Compulsory Excess: Every claim is subject to a compulsory excess of £250. This
    is the minimum amount the policyholder must contribute toward any claim. This
    cannot be waived.

    - No Claims Discount (NCD) Protection: To protect their NCD from being impacted
    by a claim, customers may opt for NCD protection at a cost of £45. Agents must
    clarify that this prevents the discount from decreasing but does not remove the
    compulsory excess.


    Policy Restrictions and Edge Cases:

    - Modified Vehicles: Comprehensive cover may be restricted or subject to additional
    premiums for vehicles with non-standard modifications. Any modification must be
    declared at the point of setup or via a policy amendment.

    - High-Performance Vehicles: Certain luxury or high-performance vehicles may be
    subject to specific usage restrictions or higher risk-based premiums to ensure
    sustainable claims delivery.

    - Named Driver Flexibility: While we offer flexibility in adding named drivers,
    the primary policyholder remains responsible for ensuring all drivers meet our
    eligibility criteria. Adding a high-risk driver may result in a premium increase.


    Operational Constraints:

    - Policy Amendments: Any state-changing action, such as adding a driver or changing
    a vehicle, requires rigorous identity verification and multi-factor authentication
    before the change is finalised.

    - Cooling-off Period: In accordance with regulations, customers have a 14-day
    cooling-off period from the start of the policy during which they may cancel.'
  domain: insurance
  product_category: car_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: a0f4b7a8-88d6-5c8a-a38d-322ed0880856
  title: Kingsmere Comprehensive Car Insurance — cost and charges
  body: 'We believe in complete transparency regarding the cost of your protection.
    Below are the most common questions regarding the charges associated with our
    motor insurance.


    **What is a typical premium for this policy?**

    While premiums are risk-based to ensure fairness for all, a typical example for
    a qualifying driver may be an annual premium of £640.


    **What amount must I pay toward a claim?**

    Our policies include a compulsory excess of £250, which is the amount you contribute
    toward any claim you make.


    **How can I protect my No Claims Discount?**

    We offer NCD protection for a cost of £45. This allows you to maintain your discount
    level even if you make a claim, ensuring your long-term pricing remains stable.


    For a detailed breakdown of all possible charges, please refer to Kingsmere Comprehensive
    Car Insurance — fee schedule.'
  domain: insurance
