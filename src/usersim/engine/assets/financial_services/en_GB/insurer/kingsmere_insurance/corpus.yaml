- id: 0025231d-0aa0-5b3a-afe8-22a006c40ba8
  title: Kingsmere Home Insurance — fraud and unauthorized-activity protection
  body: "At Kingsmere Insurance, we are committed to the security of your home and\
    \ your personal data. Because we provide a premium service for UK households,\
    \ we are mindful that our customers may be targeted by sophisticated fraud attempts.\
    \ We have implemented rigorous protections to ensure that only you can manage\
    \ your coverage.\n\nTo protect your account, multi-factor authentication and strict\
    \ identity verification are mandatory before we perform any state-changing action\
    \ or policy amendment. This means we will never modify your coverage, add new\
    \ items to your contents list, or change your payout details without first confirming\
    \ your identity through our secure channels. \n\nWe urge you to be vigilant against\
    \ common fraud patterns. A typical scam may involve an individual posing as a\
    \ Kingsmere representative, claiming there is an urgent issue with your policy\
    \ that requires an immediate payment or the disclosure of your full security credentials.\
    \ Please be aware that we will never ask you to provide your password or full\
    \ multi-factor authentication codes over an unsolicited telephone call or email.\
    \ Furthermore, we will never pressure you to move funds to a 'safe account' to\
    \ protect your insurance standing.\n\nIf you notice any unauthorised activity—such\
    \ as an unexpected change to your policy documents or a request for information\
    \ that seems unusual—you must notify us immediately. Prompt reporting is essential\
    \ to mitigate risk and ensure the integrity of your protection. We recommend checking\
    \ your policy details via our secure web portal regularly to ensure all information\
    \ remains accurate.\n\n***\n\nDISCLAIMER: While we employ industry-leading security\
    \ measures, the responsibility for maintaining the confidentiality of your portal\
    \ login credentials rests with the policyholder. Kingsmere Insurance cannot be\
    \ held liable for losses resulting from the compromise of user-held credentials."
  domain: insurance
  product_category: home_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
