- id: 6d27ff66-890b-5c23-9057-adf34cc828f6
  title: Kingsmere Lifetime Pet Insurance — check status or history
  body: "If you are an existing customer, you can easily review your policy status,\
    \ claim history, and remaining cover limits through our support channels. Follow\
    \ these steps to obtain your records:\n\n1. **Request a Policy Review**: Tell\
    \ us that you would like to check your current policy status or view your claims\
    \ history. \n2. **Complete Identity Verification**: We will perform a rigorous\
    \ identity verification process. This includes multi-factor authentication (MFA)\
    \ to ensure that sensitive personal data is only accessed by the verified policyholder.\n\
    3. **Specify the Information Needed**: Confirm whether you are looking for your\
    \ overall policy status (e.g., active or lapsed), a list of past claims, or your\
    \ current available balance for the year.\n4. **Review the Vet Fee Balance**:\
    \ We will provide you with the remaining amount of your annual vet fee limit of\
    \ £7,500 for the current policy year. We will subtract any claims already paid\
    \ out (minus your £99 excess) from this total.\n5. **Confirm Premium Details**:\
    \ We will confirm your current monthly premium (for example, £32) and the date\
    \ of your next scheduled payment.\n6. **Receive Documentation**: We will send\
    \ a summary of this status and history to your secure web portal for your permanent\
    \ records.\n\nYou will know the process is complete when you receive the confirmation\
    \ summary in your portal and the agent confirms that all requested figures have\
    \ been provided.\n\nFor instructions on how to make changes to your policy details,\
    \ please refer to Kingsmere Lifetime Pet Insurance — make a change or update."
  domain: insurance
  product_category: pet_insurance
  document_type: how_to_guide
  source_authority: official
