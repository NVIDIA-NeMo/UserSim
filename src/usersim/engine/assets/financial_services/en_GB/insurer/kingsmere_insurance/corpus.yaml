- id: bc01fbbd-a1f7-5983-bef3-e1cc2c6330f1
  title: Kingsmere Home Insurance — standard excess explained
  body: 'What is a standard excess?

    An excess is the amount you agree to pay toward a claim before Kingsmere Insurance
    covers the remaining balance. For Kingsmere Home Insurance, the standard excess
    is £100. This means if you make a claim for £500, we will provide £400, and you
    will cover the first £100.


    How does the standard excess differ from other types of excess?

    While the standard excess of £100 applies to most general claims, certain high-risk
    events have their own specific excess. For example, claims involving the escape
    of water carry a higher excess of £350. This structure ensures we can keep our
    overall premiums fair and sustainable for all policyholders.


    Can the standard excess be changed?

    Excess levels are typically set based on the risk profile of the property. If
    you wish to discuss your specific coverage levels, please refer to Kingsmere Home
    Insurance — overview.'
  domain: insurance
  product_category: home_insurance
  document_type: faq
  source_authority: official
