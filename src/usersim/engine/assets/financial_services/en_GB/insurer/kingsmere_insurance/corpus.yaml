- id: cefe60da-9d5a-5011-ac98-c9c59f4ec703
  title: Kingsmere Level Term Life Insurance — cancel, close, or downgrade
  body: 'Whether you no longer require cover or wish to reduce your sum assured to
    lower your costs, we provide a structured process to manage your policy changes.


    Before starting, ensure you have your policy number and your primary identity
    document ready for verification.


    Steps to cancel or downgrade your policy:


    1. State your intent: Tell us whether you wish to cancel the policy entirely or
    downgrade your cover amount (for example, reducing an example cover amount of
    £200,000 to a lower sum).

    2. Identity Verification: Complete our mandatory identity verification process.
    This involves multi-factor authentication to ensure only the verified policyholder
    can make these changes.

    3. Review Terms and Impacts: We will confirm the impact of the change. If you
    are cancelling, we will inform you that your cover ceases immediately. If you
    are downgrading, we will provide you with the new adjusted monthly premium (which
    may be lower than the previous £12 example).

    4. Confirmation of Action: Once you provide final verbal or digital consent, we
    will process the amendment.

    5. Receive Documentation: We will send a confirmation notice via your secure web
    portal detailing the closure of the account or the new terms of your downgraded
    cover.


    If you are within your statutory 30-day cooling-off period for life insurance,
    you may cancel your policy and receive a full refund of any premiums paid.


    ***

    DISCLAIMER: Cancelling your policy removes all financial protection. Once a policy
    is closed, you may need to undergo a new medical assessment and risk profiling
    to obtain cover in the future, which may result in higher premiums.'
  domain: insurance
  product_category: life_insurance
  document_type: how_to_guide
  source_authority: official
