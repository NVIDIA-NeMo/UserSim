- id: 826313be-25a9-5d36-9780-08398493ad14
  title: Kingsmere Comprehensive Car Insurance — when to switch or upgrade
  body: 'As a support agent, your role is to help customers maintain the most appropriate
    level of protection. Use the following guidance to determine when a customer should
    switch or upgrade their cover.


    **When to Upgrade to NCD Protection**

    If a customer has accumulated a significant No Claims Discount and is concerned
    about a single incident erasing years of savings, recommend upgrading to include
    NCD protection. This is available for a cost of £45.


    **When to Review Risk-Based Pricing**

    If a customer''s circumstances change—such as moving to a lower-crime area or
    reducing their annual mileage—they should request a premium review. Because we
    compete on the fairness of our renewal pricing, a risk-assessment update may lead
    to a more competitive annual premium (for example, relative to our £640 example).


    **When to Switch Cover Levels**

    If a customer''s vehicle value has increased significantly, they should move from
    basic cover to our comprehensive option to ensure full protection. Ensure they
    are aware of the £250 compulsory excess that applies to our comprehensive claims.'
