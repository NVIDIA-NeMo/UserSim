- id: 061c7658-615d-5d8a-83b9-9b80f383e5f2
  title: Kingsmere Comprehensive Car Insurance — account security best practices
  body: 'At Kingsmere Insurance, the security of your personal data and the integrity
    of your policy are our highest priorities. To ensure that only verified policyholders
    can modify coverage, add named drivers, or access sensitive information, we employ
    rigorous security protocols.


    Multi-factor authentication (MFA) is mandatory for all access to our secure web
    portals. This ensures that even if your password is compromised, your account
    remains protected by a second layer of verification. We strongly encourage all
    customers to ensure their contact details are up to date so that MFA codes are
    delivered promptly to the correct device.


    It is vital to remember that we will never ask you to disclose your password,
    MFA codes, or full security answers over the telephone or via email. Any request
    for this information should be treated as suspicious. Furthermore, we will never
    pressure you into making an immediate payment via an unsecured link to ''save''
    your policy from cancellation.


    If you notice any unauthorised changes to your policy—such as the addition of
    an unknown named driver or a change in your contact address—you must notify us
    immediately. Any suspected fraudulent activity should be reported within 24 hours
    to ensure we can take swift action to secure your account and limit potential
    liability.


    Before any state-changing action, such as amending your cover or updating your
    bank details, we will perform a rigorous identity verification process. This may
    include asking a series of security questions based on your policy history. While
    this may take a few extra moments, it is a necessary step to protect your financial
    interests and ensure the breadth of your comprehensive cover remains secure.


    For more information on how we protect your account from external threats, please
    see Kingsmere Comprehensive Car Insurance — fraud and unauthorized-activity protection.'
  domain: insurance
  product_category: car_insurance
  document_type: security_advisory
  source_authority: official
