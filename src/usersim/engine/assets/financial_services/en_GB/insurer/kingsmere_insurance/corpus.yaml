- id: 21ca44f7-5152-5af7-b3d7-d1cbbf8c0ea9
  title: Kingsmere Home Insurance — buildings cover limit explained
  body: 'Q: What is the maximum amount of cover available for my property''s structure?


    A: Kingsmere Home Insurance provides a robust buildings cover limit of £1,000,000.
    This is the maximum sum we will pay out to rebuild or repair your home in the
    event of a total loss, subject to the terms of your policy.


    Q: Does the £1,000,000 limit include my contents?



    A: No, the buildings cover limit applies specifically to the structure of your
    home. Your personal belongings are protected under a separate contents cover limit
    of £75,000. You can find more details on this in Kingsmere Home Insurance — contents
    cover limit explained.


    Q: What happens if the cost of rebuilding exceeds the £1,000,000 limit?



    A: If the actual cost of rebuilding exceeds your limit, we can only pay up to
    the maximum of £1,000,000. We recommend regular valuations to ensure your cover
    remains adequate for current market conditions.'
  domain: insurance
  product_category: home_insurance
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: ef440acf-cb1f-5962-8002-81f9f92e9a88
  title: Kingsmere Home Insurance — cancel, close, or downgrade
  body: 'Whether you are moving home, switching providers, or adjusting your level
    of cover, we aim to make the process of cancelling or downgrading your policy
    straightforward and transparent.


    Before you begin:

    Ensure you have your policy number and your secure web portal login details ready.
    If you are within the first 14 days of your policy, you are within the statutory
    cooling-off period and can cancel without penalty.


    Steps to cancel, close, or downgrade:


    1. Request the Change: Tell us whether you wish to cancel your policy entirely
    or downgrade your cover (for example, reducing your contents cover limit from
    £75,000 to a lower amount). You can do this by speaking with us over the telephone
    or sending a request through the secure web portal.


    2. Complete Identity Verification: To protect your account, we will perform a
    rigorous identity verification. This includes multi-factor authentication to ensure
    that only the verified policyholder can authorize a state-changing action.


    3. Review the Terms: We will confirm the effective date of the cancellation or
    downgrade. If you are cancelling, we will explain any remaining premiums or refunds
    due to you. If you are downgrading, we will confirm your new coverage limits and
    any resulting change in your risk-based premium.


    4. Receive Confirmation: Once the action is processed, we will provide a written
    confirmation via your secure portal or email. This document will serve as your
    proof that the policy has been closed or amended.


    Your request will be handled by our front-line agents, and if a complex calculation
    is required for your refund, the request will follow our structured escalation
    path to a senior operations lead for final resolution.'
  domain: insurance
  product_category: home_insurance
  document_type: how_to_guide
  source_authority: official
