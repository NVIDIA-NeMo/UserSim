- id: 69a4aee8-5b48-554b-b387-1ee3cc56331d
  title: Kingsmere Level Term Life Insurance — comparison vs. alternatives and when
    not to choose it
  body: 'Choosing the right life insurance depends entirely on the financial gap you
    intend to plug. Kingsmere Level Term Life Insurance is designed for those who
    need a guaranteed, unchanging sum of money to be paid out if they pass away during
    a specific timeframe.


    **When this product is the right choice**

    This product is ideal if you have a fixed financial obligation. For example, if
    you have a mortgage that will be paid off in 25 years, a level term policy with
    a term of 25 years ensures that your beneficiaries receive the full cover amount—such
    as £200,000—regardless of when the claim occurs during that period. It is the
    preferred choice for those who value transparency and a predictable monthly cost,
    such as an example premium of £12.


    **When NOT to choose this product**

    *   **Decreasing Obligations**: If your debt decreases over time (like a repayment
    mortgage), a ''decreasing term'' policy may be more cost-effective than our level
    term option.

    *   **Whole-of-Life Needs**: If you require a payout regardless of when you pass
    away (rather than within a set term like 25 years), this product is not suitable,
    as it expires at the end of the term.

    *   **Investment Goals**: This is a protection product, not an investment vehicle.
    If you are looking for a policy that builds a cash value, a whole-of-life or endowment
    policy would be more appropriate.


    **Key Comparison Points**

    Unlike flexible-sum policies, our level term cover provides absolute certainty
    regarding the payout amount (£200,000 in our example). We compete on the fairness
    of our renewal pricing and the ability to have the policy ''Written in Trust''
    to ensure the payout avoids probate and reaches beneficiaries efficiently.


    ***


    DISCLAIMER: We provide educational guidance on coverage options but do not offer
    individualised tax or legal advice.'
  domain: insurance
  product_category: life_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 18821799-5466-5f03-8334-a450a1922974
  title: Kingsmere Level Term Life Insurance — eligibility and setup
  body: '**Am I eligible to update my current policy setup?**

    Yes, provided you pass our mandatory identity verification and multi-factor authentication
    checks, you can modify your coverage. Eligibility for specific cover amounts—such
    as increasing a £200,000 limit—is subject to a new risk assessment, as our premiums
    are risk-based.


    **How do I ensure my payout avoids probate?**

    During setup or via a policy amendment, you can choose to have your policy ''Written
    in Trust''. This legal arrangement means your policy is held by trustees, allowing
    the payout to go directly to your beneficiaries without the delays associated
    with probate.


    **What happens if I change my mind after setting up the policy?**

    We offer a statutory cooling-off period of 30 days for life insurance. If you
    decide the product is not right for you within this window, you can cancel the
    policy.'
  domain: insurance
  product_category: life_insurance
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: d50177d1-47cd-5872-9bf5-e310f2916ca5
  title: Kingsmere Level Term Life Insurance — resolve a common request end-to-end
  body: 'One of the most common requests we handle is updating a beneficiary and ensuring
    the policy is ''Written in Trust'' to protect the payout from probate delays.
    Here is how to complete this process:


    1. **State your request**: Inform us that you wish to update the beneficiaries
    of your Kingsmere Level Term Life Insurance policy and that you would like the
    policy to be ''Written in Trust''.

    2. **Complete identity verification**: To protect your sensitive data, we will
    require you to undergo our rigorous identity verification process, including multi-factor
    authentication. This is mandatory before any state-changing action can be performed.

    3. **Provide trustee and beneficiary details**: Tell us the full names and details
    of the trustees who will hold the policy and the beneficiaries who are to receive
    the cover amount (for example, £200,000).

    4. **Review the trust arrangement**: We will explain how the trust works to ensure
    the payout avoids probate. We will confirm that this arrangement helps your beneficiaries
    receive the funds more efficiently.

    5. **Confirm the updated policy**: We will confirm that the beneficiary changes
    have been applied and that the ''Written in Trust'' status is now active on your
    account.


    By following these steps, you ensure that your financial security plan is not
    only in place but is structured to provide the most efficient support for your
    loved ones.'
  domain: insurance
  product_category: life_insurance
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 7787bc8e-8a73-5715-9611-107079da7835
  title: Kingsmere Level Term Life Insurance — a discrepancy in your records or statement
  body: 'When a support agent identifies a discrepancy in a customer''s records—such
    as a premium charge that does not match the agreed £12 monthly premium—the following
    troubleshooting protocol must be followed.


    **Symptom**

    The customer reports that their statement shows an unexpected amount, or a promised
    loyalty fee waiver has not been applied to their risk-based premium.


    **Likely Causes**

    *   **Payment Timing**: A payment may have been processed during a transition
    between loyalty tiers, leading to a temporary administrative fee application.

    *   **Risk-Based Adjustment**: If the customer recently amended their cover (e.g.,
    increasing the sum beyond £200,000), the premium would have increased accordingly.

    *   **System Lag**: A recent waiver for a long-term loyalty tier may not yet be
    reflected on the current statement.


    **What to Check in Order**

    1. **Payment History**: Review the history of monthly premiums to see if the discrepancy
    is a one-time occurrence or a recurring error.

    2. **Policy Amendments**: Check if the term (e.g., 25 years) or the cover amount
    was recently changed, as this affects the risk-based premium.

    3. **Loyalty Tier Status**: Verify the customer''s current loyalty tier to determine
    if an administrative fee should have been waived.


    **The Fix**

    If the discrepancy is due to an administrative error, the agent should apply a
    correction to the account. We will then confirm the corrected balance to the customer
    and provide an updated statement.


    **When to Escalate**

    If the cause of the discrepancy is not immediately apparent or if the customer
    disputes the risk-based pricing, the case must be escalated. The query will move
    from the front-line agent to a senior operations lead. The senior lead will conduct
    a full audit of the policy and provide a final resolution, which the customer
    can then either accept or take to the free Financial Ombudsman Service if they
    remain dissatisfied.'
  domain: insurance
  product_category: life_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 92f41dfb-4baf-512b-8768-dada4e5b3117
  title: Institution-wide fees and charges
  body: "At Kingsmere Insurance, we believe in a transparent approach to pricing to\
    \ ensure the long-term reliability and sustainability of our protection plans.\
    \ Our premiums are risk-based, meaning they are calculated based on the specific\
    \ risk profile of the policyholder to ensure fair pricing for all our customers\
    \ and the continued delivery of claims.\n\nIn addition to premiums, we apply administrative\
    \ fees to maintain the high operational quality of our services. These fees are\
    \ applied transparently and are detailed within the specific terms of each policy.\
    \ To reward our most dedicated customers, these administrative fees may be waived\
    \ for those who reach specific long-term loyalty tiers. \n\nFor a detailed breakdown\
    \ of the specific costs associated with your individual cover, please refer to\
    \ the relevant product fee schedule, such as the Kingsmere Comprehensive Car Insurance\
    \ – fee schedule, Kingsmere Home Insurance – fee schedule, Kingsmere Lifetime\
    \ Pet Insurance – fee schedule, or Kingsmere Level Term Life Insurance – fee schedule."
  domain: insurance
  product_category: general
  document_type: fee_schedule
  source_authority: official
