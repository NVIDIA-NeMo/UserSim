- id: b26daa85-32cf-57ac-99ab-6b1addc557f7
  title: Kingsmere Home Insurance — account security best practices
  body: 'At Kingsmere Insurance, we are committed to protecting your personal data
    and your home protection policy. As the landscape of digital fraud evolves, we
    urge all policyholders to adhere to the following security best practices to ensure
    their accounts remain secure.


    **Our Mandatory Security Standards**

    To prevent unauthorised changes to your coverage, we employ multi-factor authentication
    (MFA) and rigorous identity verification. These measures are mandatory before
    any state-changing action is taken, such as modifying your buildings cover limit
    of £1,000,000 or updating your contents cover limit of £75,000. Please ensure
    your contact details are always up to date so that MFA codes reach you promptly.


    **Recognising Fraudulent Activity**

    Be vigilant against ''phishing'' attempts. Fraudsters may contact you pretending
    to be from Kingsmere, claiming there is an issue with your premium or a pending
    claim. Please remember: we will never ask you to provide your full password, your
    MFA code, or your banking PIN over the telephone or via email.


    **First Actions in Case of Suspicion**

    If you receive a communication that feels unusual, or if you notice a change to
    your policy that you did not authorise, take these steps immediately:

    1. Do not click any links or provide any data to the requester.

    2. Immediately log in to your secure web portal to review your policy status.

    3. Notify us via our official telephone line or secure portal to report the incident.


    Prompt reporting is essential. While we handle all claims and complaints fairly,
    notifying us immediately of potential fraud helps us protect your assets and your
    identity more effectively.


    ***


    Disclaimer: Kingsmere Insurance will never request your full security credentials
    via email or SMS. Always verify the sender''s address before responding.'
  domain: insurance
  product_category: home_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 775ebf8e-4cbf-555c-8566-11514d1de592
  title: Kingsmere Home Insurance — change-of-terms policy
  body: 'This document outlines the policy regarding changes to the terms and conditions
    governing Kingsmere Home Insurance. We operate with a commitment to transparency
    and fairness, adhering strictly to FCA and PRA regulations.


    **Amendments to Terms**

    We reserve the right to amend the terms of your policy to reflect changes in risk,
    regulatory requirements, or operational costs. We will provide you with written
    notice of any material changes to your coverage, including adjustments to the
    standard excess of £100 or the specific escape-of-water excess of £350, at least
    30 days before such changes take effect.


    **Renewal Pricing Parity**

    In line with our commitment to fairness, we guarantee that the renewal prices
    we offer for your home insurance will not exceed the prices offered to equivalent
    new customers. This ensures that long-term loyalty is not penalised by pricing
    shifts.


    **The Cooling-off Period**

    All new policies are subject to a statutory cooling-off period of 14 days. During
    this window, you may cancel your policy and receive a refund of your premium,
    subject to any claims made during that period.


    **Termination and Disputes**

    Either party may terminate the agreement in accordance with the notice periods
    specified in your policy schedule. If a dispute arises regarding a change in terms
    or a claim outcome, we will work to resolve it promptly. If a resolution is not
    reached, you maintain the right to take your dispute to the free Financial Ombudsman
    Service.


    ***


    Disclaimer: This document is a summary of the change-of-terms policy. Please refer
    to your full policy schedule for specific obligations and notice periods.'
  domain: insurance
  product_category: home_insurance
  document_type: terms_conditions
  source_authority: official
