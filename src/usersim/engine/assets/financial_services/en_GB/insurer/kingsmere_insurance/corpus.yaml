- id: 4d0275e5-4132-59ee-b39d-47c5a0e1f84a
  title: Kingsmere Comprehensive Car Insurance — getting started walkthrough
  body: 'This walkthrough is designed to assist support agents in guiding prospective
    customers through the setup of Kingsmere Comprehensive Car Insurance. Your goal
    is to ensure the customer understands our transparent pricing and the breadth
    of their protection.


    Step 1: Information Gathering

    Collect the necessary vehicle and driver details. Ensure the customer provides
    a full history of their No Claims Discount (NCD). Explain that the NCD is a reward
    for not claiming, which reduces the premium.


    Step 2: Premium Calculation

    Use the risk-based pricing model to generate a quote. For a standard profile,
    you might use an annual premium example of £640 to illustrate how our pricing
    is structured. Emphasize that this is a risk-based figure to ensure fair pricing
    for all policyholders.


    Step 3: Explaining the Excess

    Clearly state the compulsory excess, which for this product is £250. The customer
    must understand that this is the amount they pay toward a claim. Ensure they know
    the difference between this compulsory amount and any voluntary excess they may
    choose to add to lower their premium.


    Step 4: NCD Protection Offer

    Ask the customer if they wish to protect their No Claims Discount. Explain that
    for an additional cost of £45, they can ensure their discount is not lost after
    a claim. This is a key feature of our comprehensive motor protection.


    Step 5: Final Verification and Activation

    Before activating the policy, perform a rigorous identity verification. Once verified,
    confirm the total premium, the £250 compulsory excess, and the £45 NCD protection
    cost if applicable. Remind the customer of the 14-day cooling-off period.


    Step 6: Document Delivery

    Confirm the customer has access to the secure web portal to view their policy
    documents. Advise them that any future amendments will require multi-factor authentication
    to maintain security.'
  domain: insurance
  product_category: car_insurance
  document_type: product_sheet
  source_authority: official
