  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 4fe25008-ce63-5952-988d-39becd69284f
  title: Kingsmere Lifetime Pet Insurance — eligibility requirements
  body: 'The following matrix defines the requirements for maintaining a Kingsmere
    Lifetime Pet Insurance policy. All conditions must be met for the policy to remain
    active and for claims to be processed.


    | Condition | Requirement | Outcome if Not Met |

    | :--- | :--- | :--- |

    | Residency | Must be a permanent resident of the United Kingdom | Policy Ineligible
    |

    | Identity | Must pass rigorous multi-factor authentication (MFA) | Action Blocked
    |

    | Pet Age | Pet must be within the age limits specified at the time of quote |
    Restricted Cover/Ineligible |

    | Premium Payment | Monthly premiums (e.g., £32) must be paid in full | Policy
    Lapsed |

    | Medical Disclosure | All pre-existing conditions must be declared honestly |
    Claim Denied |


    If your circumstances change, please notify us promptly to ensure your cover remains
    valid. For details on how to update your information, please refer to Kingsmere
    Lifetime Pet Insurance — set up and activate.'
  domain: insurance
