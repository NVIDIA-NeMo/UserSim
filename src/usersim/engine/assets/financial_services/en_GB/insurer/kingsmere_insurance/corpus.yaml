  institution_id: kingsmere_insurance
- id: 2f1ceb29-d985-541d-8f03-17d31b19e0fc
  title: Kingsmere Comprehensive Car Insurance — regulatory disclosures
  body: 'Kingsmere Insurance operates in strict adherence to the regulations set forth
    by the Financial Conduct Authority (FCA) and the Prudential Regulation Authority
    (PRA). We believe in total transparency regarding our obligations and your rights
    as a policyholder.


    **Cooling-off Period**

    In accordance with statutory requirements, all policyholders are entitled to a
    14-day cooling-off period from the date the policy is inceptioned. During this
    window, you may cancel your Kingsmere Comprehensive Car Insurance and request
    a refund of the premium paid, subject to any claims made during that period.


    **FSCS Protection**

    Your protection is underpinned by the Financial Services Compensation Scheme (FSCS).
    For general insurance, such as our comprehensive car cover, the FSCS covers 90%
    of most claims if the insurer is unable to meet its obligations. (Note: Life and
    compulsory insurance are covered at 100%).


    **Fair Pricing Commitment**

    We adhere to FCA pricing rules, ensuring that renewal prices for home and car
    insurance do not exceed those offered to equivalent new customers. This ensures
    that we provide fair and sustainable pricing for all our customers regardless
    of their tenure with us.


    **Dispute Resolution**

    While we strive to handle all complaints and claims promptly and fairly, we never
    promise a specific outcome for any claim. If a resolution is not reached through
    our internal structured escalation path—moving from front-line agents to senior
    operations leads—you have the right to take your dispute to the free Financial
    Ombudsman Service.


    ***

    **Disclaimer:** This document provides a summary of regulatory protections and
    does not replace the full terms and conditions of your insurance contract.'
  domain: insurance
  product_category: car_insurance
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 90b3f3c4-20d0-5ff4-953f-1e7158d333fb
  title: Kingsmere Comprehensive Car Insurance — interest rate / APY schedule
  body: 'As Kingsmere Comprehensive Car Insurance is an insurance product rather than
    a financial investment account, it does not accrue interest or provide an Annual
    Percentage Yield (APY). Instead, our ''rates'' are based on a risk-assessment
    model used to determine premiums.


    - **Annual Premium**: Our pricing is risk-based. For illustrative purposes, a
    typical annual premium is £640. This figure is subject to change based on the
    individual risk profile of the policyholder.

    - **NCD Protection Rate**: The cost to protect your No Claims Discount is a flat
    fee of £45 per year.

    - **Compulsory Excess**: The standard excess rate is £250 per claim.


    These figures are applied transparently at the start of the policy and at each
    annual renewal. We ensure that the rates applied at renewal remain fair and are
    not higher than those offered to new customers with an equivalent risk profile.'
  domain: insurance
  product_category: car_insurance
  document_type: rate_sheet
  source_authority: official
