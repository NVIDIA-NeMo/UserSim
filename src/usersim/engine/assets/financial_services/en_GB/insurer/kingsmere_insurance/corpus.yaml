- id: 04dd779e-2671-572a-a6d1-18cdfb0cc82a
  title: Kingsmere Home Insurance — set up and activate
  body: 'If you are comparing your options and have decided that our commitment to
    fair pricing and comprehensive cover is the right fit for your home, activating
    your Kingsmere Home Insurance is a straightforward process. We handle the setup
    directly with you to ensure all details are accurate.


    **What you will need before starting:**

    - Full details of the property to be insured (including construction type and
    security features).

    - An accurate inventory of your contents for cover limit verification.

    - A valid form of government-issued identification.

    - Your preferred payment method.


    **Steps to activate your cover:**


    1. **Provide Property Details**: Tell us the specifics of your home and the level
    of cover you require. We will use this information to perform a risk assessment.

    2. **Receive Your Quote**: We will provide you with a personalised premium quote
    based on your risk profile. If you are comparing us to others, this is where you
    will see our commitment to transparent, competitive pricing.

    3. **Complete Identity Verification**: To protect your security and comply with
    regulations, you must undergo rigorous identity verification. This includes multi-factor
    authentication (MFA) to ensure that only you can activate the policy.

    4. **Confirm Payment**: Provide your payment details for the premium. Once the
    payment is processed, we will establish your policy.

    5. **Receive Activation Confirmation**: We will confirm that your policy is now
    active. You will receive your policy documents, including the confirmation of
    your buildings cover limit of £1,000,000 and contents cover limit of £75,000.


    Your cover is now in place. Please remember that you have a statutory 14-day cooling-off
    period during which you can cancel the policy if you change your mind.'
