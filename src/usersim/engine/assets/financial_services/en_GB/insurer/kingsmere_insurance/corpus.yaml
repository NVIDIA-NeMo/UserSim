- id: 0330b084-69b5-5645-a246-0a6fa3912b7b
  title: Kingsmere Level Term Life Insurance — check status or history
  body: 'If you wish to review the current status of your cover or examine your payment
    history, please follow these steps:


    1. **Verify your identity**: When you speak with us, we will first require you
    to complete our mandatory identity verification process, which includes multi-factor
    authentication. This ensures that sensitive personal data is only accessed by
    the verified policyholder.

    2. **Request policy status**: Ask us for the current status of your policy. We
    will confirm whether your cover is active and provide the specific details of
    your protection, such as a cover amount of £200,000.

    3. **Confirm policy term**: Ask us to confirm the remaining duration of your policy.
    We will verify the total term, such as 25 years, and tell you the exact date the
    cover is set to expire.

    4. **Request payment history**: Ask us for a summary of your premium payments.
    We will provide a record of your monthly charges, such as the £12 monthly premium,
    and confirm that all payments are up to date.

    5. **Verify beneficiary status**: If you wish to check who is listed to receive
    the payout, ask us to confirm the beneficiaries. We will inform you if the policy
    is currently ''Written in Trust'' to avoid probate.


    Once we have provided these details, you will have a complete overview of your
    financial security arrangement with us.'
  domain: insurance
  product_category: life_insurance
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: f77ed6dd-7ea4-57fd-8d2d-aad4772842b1
  title: Kingsmere Level Term Life Insurance — a declined or blocked action
  body: 'If you attempt to make a change to your policy—such as updating a beneficiary
    or amending your cover amount—and find that the action is declined or blocked,
    it is typically due to our rigorous security protocols.


    **Likely Causes**

    *   **Identity Verification Failure**: Our system may have blocked the action
    because the identity verification process was not fully completed or the provided
    details did not match our records.

    *   **Multi-Factor Authentication (MFA) Error**: If the MFA code was entered incorrectly
    or has expired, the state-changing action will be automatically halted to prevent
    unauthorised access.

    *   **Policy Status**: In rare cases, an action may be blocked if the policy is
    currently under review or if there is a pending claim.


    **What to Check**

    1. **Verify your credentials**: Ensure that the personal information you are providing
    matches exactly what was used during the initial setup of your policy.

    2. **Check your MFA device**: Ensure you are using the most recent code sent to
    your registered device and that the code has not timed out.


    **The Fix**

    To resolve this, simply restart the verification process. Ask us to re-initiate
    the identity check. Once you successfully pass the MFA and identity verification,
    the previously blocked action can be processed.


    **When to Escalate**

    If you have successfully passed verification but the action remains blocked, we
    will escalate the matter. Your query will follow our structured escalation path,
    moving from the front-line agent to a senior operations lead to ensure a prompt
    and fair resolution. You will be notified once the senior lead has reviewed the
    block and cleared the action.'
  domain: insurance
  product_category: life_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: def3a190-4a1b-5136-8872-b11186725c5c
  title: Kingsmere Level Term Life Insurance — when to switch or upgrade
  body: "As a support agent, you should guide customers toward upgrading or switching\
    \ their cover based on changes in their life circumstances. \n\n**When to Upgrade**\n\
    Customers should consider increasing their cover amount—for example, moving beyond\
    \ a £200,000 payout—if they have taken on new financial obligations, such as a\
    \ larger mortgage, or have grown their family. An upgrade ensures the payout remains\
    \ sufficient to provide comprehensive protection.\n\n**When to Switch**\nIf a\
    \ customer's original term of 25 years is nearing its end, or if their needs have\
    \ shifted from a fixed payout to a different structure, they may need to switch.\
    \ While our level term insurance is ideal for fixed obligations, customers with\
    \ fluctuating debts might find other options more suitable.\n\n**Decision Points**\n\
    *   **Increased Liability**: Recommend an upgrade to a higher cover amount.\n\
    *   **Changed Timeline**: Evaluate if the original term (e.g., 25 years) still\
    \ aligns with their financial goals.\n*   **Cost Sensitivity**: Remind them that\
    \ premiums are risk-based and an increase in cover will result in a premium higher\
    \ than the example £12."
