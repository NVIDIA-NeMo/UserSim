- id: 2ba010aa-db3c-5d5b-8da4-9d9a00ddc84f
  title: Kingsmere Home Insurance — a discrepancy in your records or statement
  body: 'Support agents may encounter situations where a customer reports a discrepancy
    in their policy records or their latest statement. Resolving these requires a
    methodical comparison between the customer''s claim and our internal records.


    Symptom: The customer believes they have been charged the wrong excess or that
    their cover limit is incorrectly stated on their statement.


    Likely Causes

    - Incorrect Excess Application: A claim was processed using the standard excess
    of £100 when it should have been an escape-of-water claim with a £350 excess,
    or vice versa.

    - Outdated Limits: The customer recently requested an upgrade to their contents
    cover limit (toward the £75,000 max), but the statement still reflects the previous
    value.

    - Premium Miscalculation: The annual premium (e.g., £340) does not reflect a recently
    applied loyalty waiver on administrative fees.


    What to Check

    1. Policy Schedule: Compare the current statement against the primary policy schedule
    to see if the buildings cover limit is correctly listed as £1,000,000.

    2. Claim Category: Review the specific nature of the last claim. If it involved
    leaking pipes, ensure the £350 escape-of-water excess was applied.

    3. Audit Trail: Check the history of state-changing actions to ensure the identity
    verification and MFA were completed for any recent amendments.


    How to Resolve

    If a discrepancy is found, the agent should correct the record immediately. If
    the error resulted in an overcharge of an excess (e.g., charging £350 instead
    of £100), a correction must be applied to the customer''s account.


    When to Escalate

    If the discrepancy involves a dispute over the classification of a claim (standard
    vs. water excess) that cannot be resolved via the policy wording, escalate the
    matter to a senior operations lead. The customer should be reminded that if a
    resolution is not reached, they have the right to take the dispute to the free
    Financial Ombudsman Service.'
  domain: insurance
  product_category: home_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: fc9f550c-cf7f-58e9-af23-defd521944c6
  title: Kingsmere Lifetime Pet Insurance — overview
  body: 'Kingsmere Lifetime Pet Insurance provides comprehensive, long-term health
    support for your pets, ensuring they receive the care they need throughout their
    lives. Unlike time-limited policies, our lifetime cover is designed for enduring
    reliability, featuring a vet fee limit of £7,500 that renews annually. This ensures
    that if your pet develops a chronic condition, they continue to have access to
    a significant pool of funding for their treatment each policy year.


    We believe in transparency and fairness in our pricing. While premiums are risk-based
    to ensure the sustainable delivery of claims for all our policyholders, an example
    monthly premium for this cover is £32. This cost allows us to maintain a high
    standard of care and a breadth of comprehensive cover options that UK households
    can trust.


    To ensure a fair distribution of risk, a standard excess of £99 applies to claims.
    This is the amount the policyholder pays toward a claim before the insurance coverage
    begins. We also apply administrative fees to maintain our operational quality;
    these are presented transparently at the point of purchase and may be waived for
    customers who reach specific long-term loyalty tiers.


    Our commitment to your peace of mind is underpinned by strict adherence to FCA
    and PRA regulations. Every new policy includes a statutory 14-day cooling-off
    period, during which you may cancel your cover. Furthermore, your protection is
    supported by the Financial Services Compensation Scheme (FSCS), which covers 90%
    of most general insurance claims, including pet insurance, should the insurer
    become unable to meet its obligations.


    We position ourselves as a partner in your pet''s health. We provide educational
    guidance to help you understand your coverage and emphasize the importance of
    reporting any claims promptly to ensure a smooth resolution process. For more
    details on how these costs are structured, please refer to Kingsmere Lifetime
    Pet Insurance — fee schedule.'
  domain: insurance
  product_category: pet_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 6626fe56-1f8d-57a8-a919-eb979148d922
  title: Kingsmere Lifetime Pet Insurance — example monthly premium explained
  body: 'Q: Why is the example monthly premium listed as £32?


    A: The figure of £32 is provided as a representative example to give prospective
    and existing customers a general idea of the cost of our comprehensive cover.
    Because we use risk-based pricing to ensure fairness and sustainability for all
    policyholders, your actual premium will vary based on your pet''s breed, age,
    medical history, and your specific location in the UK.


    Q: Does my premium remain £32 for the duration of the policy?


    A: No. Premiums are reviewed at renewal. We compete on the fairness of our renewal
    pricing, and while rates may change based on the risk profile, we ensure that
    our pricing remains transparent and competitive.


    Q: How does this premium relate to the overall cost of the policy?


    A: The monthly premium covers the cost of the insurance protection. In addition
    to this, you should be aware of the £99 excess that applies to claims. For a full
    breakdown of costs, please see Kingsmere Lifetime Pet Insurance — overview.'
  domain: insurance
  product_category: pet_insurance
