- id: 6efbdbab-a5bd-50ec-a941-2b2d7a818aa0
  title: Kingsmere Lifetime Pet Insurance — cancel, close, or downgrade
  body: 'We believe in providing a transparent and fair experience, which includes
    making it simple for you to adjust or end your coverage. This guide explains the
    process for cancelling, closing, or downgrading your Kingsmere Lifetime Pet Insurance
    policy.


    Before you begin:

    Ensure you have your policy number ready and access to the device used for your
    multi-factor authentication.


    Steps to cancel, close, or downgrade:

    1. State your request: Tell us whether you wish to cancel the policy entirely,
    close the account, or downgrade to a different level of cover.

    2. Complete identity verification: We will perform a rigorous identity check and
    request multi-factor authentication to ensure that only the verified policyholder
    can make these changes.

    3. Review the impact: We will confirm the date the coverage ends or the date the
    new, downgraded terms begin. If you are within the 14-day cooling-off period,
    we will confirm your eligibility for a full refund of the premium paid (provided
    no claims have been made).

    4. Confirm the action: Once you acknowledge the changes to your protection and
    the finality of the closure (if applicable), we will process the request.

    5. Receive written confirmation: We will provide a confirmation of the cancellation
    or downgrade via your secure web portal or by post.


    Please be aware that cancelling your policy may impact your ability to insure
    your pet in the future for pre-existing conditions, as any new policy would treat
    these as existing ailments. For further details on your obligations, see Kingsmere
    Lifetime Pet Insurance — account agreement.'
  domain: insurance
  product_category: pet_insurance
  document_type: how_to_guide
  source_authority: official
