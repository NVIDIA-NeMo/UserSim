- id: 973bb982-550d-5729-9210-9ab853482b33
  title: Kingsmere Lifetime Pet Insurance — make a change or update
  body: 'To ensure your pet''s coverage remains accurate, you may need to update your
    policy details. Please follow these steps to make a change:


    1. **Specify the Update:** Tell us exactly what needs to be changed on your policy
    (for example, updating your home address, changing your contact telephone number,
    or adding a new pet to your cover).

    2. **Complete Identity Verification:** For your security, we will trigger a multi-factor
    authentication (MFA) request. You must verify your identity via the secure method
    linked to your account before we can proceed with any state-changing action.

    3. **Review Adjusted Terms:** If the change affects your risk profile (such as
    adding a pet), we will provide you with the updated risk-based premium. We will
    confirm if this changes your current monthly payment from the example rate of
    £32.

    4. **Confirm and Authorise:** Once you agree to the updated terms and any changes
    to your £99 excess or limits, we will apply the update to your policy.

    5. **Receive Documentation:** We will send a confirmation of the amendment to
    your secure web portal and via email for your records.


    If you wish to remove a pet or reduce your cover, please refer to Kingsmere Lifetime
    Pet Insurance — cancel, close, or downgrade.'
  domain: insurance
  product_category: pet_insurance
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 82bfb17b-a1f2-5c6a-a915-4b414cd6a785
  title: Kingsmere Lifetime Pet Insurance — access or login problems
  body: 'When comparing insurers, it is important to understand how technical issues
    are handled. If you encounter difficulties accessing the Kingsmere secure web
    portal, please follow this resolution path:


    **Symptom: Unable to log in or MFA code not received**


    **Likely Causes:**

    * Incorrect login credentials.

    * Network latency affecting the delivery of the MFA token.

    * Account lockout due to multiple failed attempts.


    **Resolution Steps:**

    1. **Verify Credentials:** Ensure you are using the correct email address associated
    with your policy. Check for common typing errors.

    2. **Check Connectivity:** Confirm your mobile device has a stable signal to receive
    the MFA code. If the code does not arrive within two minutes, request a resend.

    3. **Clear Browser Cache:** In some cases, outdated session data can interfere
    with the portal. Clear your cache and attempt to log in again.


    **Escalation Process:**

    If these steps do not resolve the issue, we will escalate the matter to our senior
    operations leads. We will perform a manual identity verification over the telephone
    to restore your access. Once verified, we will reset your MFA seed and confirm
    your access is restored within one business hour.


    For further information on our commitment to security, see Kingsmere Lifetime
    Pet Insurance — account security best practices.'
  domain: insurance
  product_category: pet_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: dcc0bcf8-1534-5e50-bacd-bf67a31f4166
  title: Kingsmere Lifetime Pet Insurance — qualification tiers
  body: 'This matrix is for support agents to determine which qualification tier a
    prospective customer falls into for Kingsmere Lifetime Pet Insurance.


    | Condition | Outcome |

    | :--- | :--- |

    | Pet is under 5 years old with no pre-existing conditions | Eligible for Standard
    Lifetime Tier (£7,500 limit, £99 excess) |

    | Pet is 5-8 years old with manageable pre-existing conditions | Eligible for
    Adjusted Lifetime Tier (Customised premium, £99 excess) |

    | Pet is over 8 years old or has severe chronic illness | Referral to Senior Underwriting
    for bespoke terms |

    | Customer provides proof of long-term loyalty with Kingsmere | Eligible for administrative
    fee waiver on new pet addition |

    | Application submitted during cooling-off period of another policy | Eligible
    for immediate transition of cover |'
  domain: insurance
  product_category: pet_insurance
  document_type: eligibility_matrix
  source_authority: official
