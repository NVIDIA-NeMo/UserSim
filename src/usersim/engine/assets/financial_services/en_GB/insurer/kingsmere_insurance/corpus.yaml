- id: a156eaac-226a-5320-8c24-e338cb721ad8
  title: Kingsmere Home Insurance — referral and loyalty offer
  body: 'We are pleased to introduce a limited-time incentive to reward the trust
    of our policyholders and welcome new members to the Kingsmere family. Between
