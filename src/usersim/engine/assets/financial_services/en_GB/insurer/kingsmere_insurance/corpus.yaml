- id: e1eaed6c-3ceb-53f4-aa6f-fe2f4f2c8571
  title: Kingsmere Level Term Life Insurance — account agreement
  body: 'This account agreement outlines the binding terms between Kingsmere Insurance
    and the policyholder regarding the Kingsmere Level Term Life Insurance product.
    These terms ensure the sustainable delivery of claims and the fairness of pricing
    for all our customers.


    1. Premium Obligations: Premiums are risk-based and must be paid in full according
    to the agreed schedule to maintain cover. For example, a policyholder may have
    a monthly premium of £12. Failure to maintain payment may result in the lapse
    of the policy.


    2. Cooling-off Period: In accordance with regulatory requirements, all policyholders
    are entitled to a 30-day cooling-off period from the inception of the life cover.
    During this window, the policy may be cancelled with a full refund of premiums
    paid.


    3. Policy Structure and Trust: To ensure efficient beneficiary payout and the
    avoidance of probate, we strongly recommend and facilitate the arrangement where
    the policy is ''Written in Trust''. This legal arrangement ensures the sum assured—such
    as an example cover amount of £200,000—is held by trustees for the beneficiaries.


    4. Term of Cover: The policy remains in force for a set duration, such as an example
    term of 25 years. Coverage ceases upon the expiry of this term or the payout of
    the sum assured upon the death of the insured.


    5. Amendments and Verification: No changes to the policy, including modifications
    to the cover amount or beneficiaries, will be processed without successful multi-factor
    authentication and identity verification.


    6. Termination: The agreement ends upon the death of the insured, the expiry of
    the term, the cancellation by the policyholder, or the termination by Kingsmere
    Insurance due to non-payment or fraudulent misrepresentation.


    7. Dispute Resolution: We handle all complaints fairly and promptly. If a resolution
    is not reached, customers have the right to take their dispute to the free Financial
    Ombudsman Service.'
  domain: insurance
  product_category: life_insurance
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: ead63ed9-311e-5ed7-86ee-c75a6f1ea7ae
  title: Kingsmere Level Term Life Insurance — who it is best for and common use cases
  body: 'Kingsmere Level Term Life Insurance is designed for individuals and families
    who require a guaranteed, fixed-sum financial safety net for a specific period.
    Unlike whole-of-life policies, this product provides a level of cover that does
    not decrease over time, making it an ideal choice for those with long-term financial
    obligations.


    This product is best suited for:

    - Homeowners with a mortgage: Ensuring that a debt can be cleared if the primary
    earner passes away. For instance, a customer might choose an example cover amount
    of £200,000 to match their remaining mortgage balance.

    - Parents of young children: Providing a financial cushion for childcare and education
    costs over a set term, such as an example term of 25 years, until children reach
    adulthood.

    - Business partners: Creating a fund to buy out a deceased partner''s share of
    a business, ensuring continuity.


    Common Use Cases:

    - Mortgage Protection: Aligning the term of the insurance with the length of the
    mortgage to ensure the family home remains secure.

    - Income Replacement: Providing a lump sum to support a spouse or dependants in
    the absence of a monthly salary.


    To illustrate the accessibility of our cover, a typical policy might involve a
    monthly premium of £12, depending on the individual''s risk profile and the total
    sum assured. We focus on transparency and fairness, ensuring that your premiums
    are based on an accurate assessment of risk to maintain a sustainable fund for
    all policyholders.


    ***

    DISCLAIMER: The figures provided (£12 monthly premium, £200,000 cover, 25-year
    term) are illustrative examples only and do not constitute a quote. Actual premiums
    and terms are determined by individual risk assessments.'
  domain: insurance
  product_category: life_insurance
