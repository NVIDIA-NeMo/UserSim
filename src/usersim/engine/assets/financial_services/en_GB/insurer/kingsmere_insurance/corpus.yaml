- id: cd9e19d1-0a22-5fce-bef3-0c98facf412c
  title: Kingsmere Home Insurance — when to switch or upgrade
  body: 'Support agents should use the following criteria to determine if a customer
    should switch their current plan or upgrade their coverage levels within Kingsmere
    Home Insurance.


    Upgrade to a Higher Limit If:

    - The customer''s total household contents exceed the standard contents cover
    limit of £75,000.

    - The rebuild cost of the property has risen above the £1,000,000 buildings cover
    limit.

    - The customer has acquired high-value assets that require specific endorsement
    beyond the general aggregate limits.


    Switch to a Different Product If:

    - The customer no longer owns the property and only requires contents protection.

    - The customer''s needs have shifted toward a different risk profile that is better
    served by another of our comprehensive products.


    When recommending an upgrade, remind the customer that premiums are risk-based
    to ensure sustainable delivery of claims. While an increase in cover may affect
    the annual premium (which averages £340 in our standard examples), it ensures
    they are not under-insured in the event of a total loss. For further details on
    how these limits are applied, refer to Kingsmere Home Insurance — limits, restrictions,
    and edge cases.'
