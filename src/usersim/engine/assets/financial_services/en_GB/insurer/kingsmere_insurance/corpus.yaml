- id: 65a581d6-62ca-545c-884a-c92fb70808b1
  title: Kingsmere Home Insurance — limits, restrictions, and edge cases
  body: 'This document provides support agents with the critical boundaries and limits
    associated with Kingsmere Home Insurance. When assisting customers, ensure they
    understand that the breadth of our comprehensive cover is subject to the following
    fixed limits and excess structures.


    Coverage Limits

    We provide robust protection for the home with the following maximum thresholds:

    - Buildings Cover Limit: The maximum amount we will pay for the structure of the
    home is £1,000,000.

    - Contents Cover Limit: The maximum aggregate amount for the items within the
    home is £75,000.


    Excess Structure

    Policyholders are responsible for a portion of each claim, which is deducted from
    the payout. It is vital to distinguish between the two primary excess types:

    - Standard Excess: For most claims, the policyholder pays a standard excess of
    £100.

    - Escape-of-Water Excess: Due to the higher risk associated with water damage,
    a specific excess of £350 applies to all escape-of-water claims.


    Edge Cases and Restrictions

    - Over-Insurance: If a customer''s home is valued significantly below the £1,000,000
    limit, they are covered up to the actual value of the property.

    - High-Value Contents: While the overall contents limit is £75,000, specific high-value
    items may require individual declaration to ensure they are fully covered.

    - Claim Outcomes: While we handle all claims promptly and fairly, we never promise
    a specific outcome for any individual claim, as this is dependent on the circumstances
    of the loss.


    For guidance on how to explain these costs to a new customer, please refer to
    Kingsmere Home Insurance — standard excess explained.'
  domain: insurance
  product_category: home_insurance
  document_type: product_sheet
  source_authority: official
