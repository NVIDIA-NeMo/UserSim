- id: a677f2be-8249-564e-a46d-b469fad5c78a
  title: Kingsmere Level Term Life Insurance — a failed or pending action
  body: 'If you encounter an issue where your policy activation is pending or an amendment
    to your cover has failed, please review the following common causes and resolutions.


    Symptom: ''Application Pending'' or ''Action Failed'' status.


    Likely Causes:

    1. Identity Verification Failure: Our security protocols require rigorous identity
    verification and multi-factor authentication. If the documents provided do not
    match our records, the action will be blocked.

    2. Medical Underwriting Delay: For life insurance, we must carefully assess health
    declarations. If further medical evidence is required, the policy may remain ''pending''
    while we review the data.

    3. Beneficiary Trust Discrepancy: If the details for the Trust are incomplete
    or contradictory, we cannot finalise the ''written in trust'' status.


    What to check and how to fix it:

    - Check your secure web portal for any notifications requesting additional identity
    documents. If requested, provide the updated documentation immediately.

    - Verify that all medical questionnaires have been submitted in full. If you have
    recently undergone a medical check, ensure we have the latest report.

    - Confirm that the names of the trustees match their legal identification documents.


    Escalation Path:

    If the status does not update within 5 business days of providing the requested
    information, we will raise a case with our senior operations leads. You will receive
    a notification via your secure portal once the specialist team has resolved the
    block and your policy is active.'
  domain: insurance
  product_category: life_insurance
  document_type: troubleshooting
  source_authority: official
