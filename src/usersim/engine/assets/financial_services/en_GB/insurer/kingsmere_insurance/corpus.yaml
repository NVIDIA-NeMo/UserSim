- id: 8ffbaf5c-f76c-5d3b-8bfb-878011c2e1cf
  title: Kingsmere Level Term Life Insurance — regulatory disclosures
  body: 'Kingsmere Insurance operates in strict accordance with the regulations set
    forth by the Financial Conduct Authority (FCA) and the Prudential Regulation Authority
    (PRA).


    Cooling-off Period:

    In accordance with statutory requirements, all policyholders of Kingsmere Level
    Term Life Insurance are entitled to a cooling-off period of 30 days from the date
    the policy is issued. During this window, you may cancel the policy and receive
    a full refund of any premiums paid.


    FSCS Protection:

    Protection for this product is underpinned by the Financial Services Compensation
    Scheme (FSCS). In the event of the institution''s insolvency, the FSCS covers
    100% of life insurance claims, providing essential security for your beneficiaries.


    Claims and Disputes:

    We handle all claims promptly and fairly. However, we never promise a specific
    outcome for any claim, as every case is subject to the terms and conditions of
    the policy. If a resolution to a complaint is not reached through our internal
    escalation path—from front-line agents to senior operations leads—customers are
    informed of their right to take the dispute to the free Financial Ombudsman Service.


    Advice Boundaries:

    We provide educational guidance and product recommendations based on a high standard
    of care. However, Kingsmere Insurance does not offer individualised tax or legal
    advice. We strongly recommend consulting a qualified professional regarding the
    tax implications of your policy or the legal setup of your trust.'
  domain: insurance
  product_category: life_insurance
  document_type: disclosure
  source_authority: official
