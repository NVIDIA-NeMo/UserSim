- id: 9a8c77f1-b907-50ee-820f-983a78b44f4e
  title: Kingsmere Lifetime Pet Insurance — getting started walkthrough
  body: 'This guide is intended for support agents assisting new customers with the
    onboarding process for Kingsmere Lifetime Pet Insurance. Please ensure the customer
    understands the following core product specifications during the walkthrough.


    **Product Overview**

    Kingsmere Lifetime Pet Insurance provides lifetime health support for pets. Unlike
    ''time-limited'' policies, our cover provides an annual vet fee limit that renews
    each policy year, ensuring ongoing care for chronic conditions.


    **Key Financial Values**

    Agents must quote these figures exactly to ensure transparency:

    * **Example Monthly Premium:** While premiums are risk-based, a typical example
    is £32 per month.

    * **Annual Vet Fee Limit:** The policy provides up to £7,500 per policy year for
    veterinary fees.

    * **Standard Excess:** The policyholder is responsible for an excess of £99, which
    applies per condition each policy year.


    **Onboarding Steps for Agents**

    1. **Identity Verification:** Perform mandatory identity checks and set up multi-factor
    authentication (MFA) for the customer''s secure portal access.

    2. **Risk Assessment:** Collect all necessary pet health history to determine
    the risk-based premium.

    3. **Disclosure:** Clearly explain the 14-day cooling-off period and the role
    of the FSCS, which covers 90% of most general insurance claims.

    4. **Confirmation:** Ensure the customer acknowledges that the £99 excess must
    be paid before claims are reimbursed.


    For detailed information on how to handle specific setup queries, refer to Kingsmere
    Lifetime Pet Insurance — set up and activate.'
