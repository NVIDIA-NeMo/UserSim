- id: 7a643305-40e6-5ee7-bb32-d4b417cd23c5
  title: Kingsmere Home Insurance — a declined or blocked action
  body: 'When comparing insurance providers, transparency regarding security and account
    access is essential. At Kingsmere Insurance, we prioritise the protection of your
    data, which means certain actions may be declined or blocked if security thresholds
    are not met.


    Symptom: You attempt to modify your coverage (such as increasing your contents
    cover limit toward the £75,000 maximum) or access sensitive data, but the request
    is declined.


    Likely Causes

    - Verification Failure: The most common cause is a failed identity verification
    attempt or an expired multi-factor authentication (MFA) token.

    - Unverified User: You are attempting to make a state-changing action on a policy
    where you are not the primary verified policyholder.

    - Out-of-Hours Request: While we support requests during UK business hours (GMT),
    certain automated system updates may be temporarily blocked for maintenance.


    What to Check

    1. Device Sync: Ensure the device used for MFA is connected to the network and
    that you are responding to the prompt promptly.

    2. Identity Credentials: Verify that the personal details you have provided match
    the records we hold for the policy.


    How to Resolve

    If an action is blocked, please ask us to re-initiate the identity verification
    process. Once we have successfully verified your identity through our mandatory
    security protocols, the blocked action can be processed.


    When to Escalate

    If you have passed all verification steps but your request is still declined,
    we will escalate the matter to a senior operations lead. This ensures that any
    technical block is resolved and your comprehensive protection is not interrupted.
    You will be notified of the resolution via your secure web portal.'
  domain: insurance
  product_category: home_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
