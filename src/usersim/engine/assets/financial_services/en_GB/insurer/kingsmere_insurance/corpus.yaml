- id: 5ca79fb6-26ea-5147-9b5e-c303af6d0b64
  title: Kingsmere Lifetime Pet Insurance — fraud and unauthorized-activity protection
  body: 'At Kingsmere Insurance, we believe that transparency and security are the
    cornerstones of a trusted partnership. To protect your pets and your finances,
    we employ rigorous security measures designed to prevent fraud and unauthorized
    policy amendments.


    We require multi-factor authentication and strict identity verification before
    any state-changing action is performed on your policy. This means that only a
    verified policyholder can modify coverage levels, update payment details, or access
    sensitive personal data. We do this to ensure that no unauthorised third party
    can alter the protection of your pet.


    Customers comparing our services should be aware of common fraud patterns targeting
    pet insurance. These often include ''phantom claims''—where a third party attempts
    to claim for a pet they do not own—or identity theft where fraudsters attempt
    to redirect payouts to unverified accounts. Please be advised that we will never
    ask you to provide your full password or multi-factor authentication codes via
    an unsolicited telephone call or email.


    If you suspect that your policy details have been compromised, or if you notice
    an unauthorised change to your coverage, you must notify us immediately. Prompt
    reporting is essential to limiting your liability and allowing us to secure your
    account. For general insurance products, including our pet cover, we provide a
    14-day cooling-off period from the start of the policy, during which you can cancel
    and receive a refund of the premium paid, provided no claim has been made.


    Our commitment to security extends to the verification of all claims. We work
    closely with registered veterinary surgeons to ensure that all treatments reported
    are legitimate and consistent with the medical history of the animal. This rigor
    ensures the sustainability of our fund and the fairness of our pricing for all
    policyholders.'
  domain: insurance
  product_category: pet_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 723cd18c-1b6d-5f9e-ac76-00294d1c73bb
  title: Kingsmere Lifetime Pet Insurance — account agreement
  body: 'This agreement outlines the binding terms between Kingsmere Insurance (''we'',
    ''us'') and the policyholder. This document serves as a reference for support
    agents assisting customers with the legal and operational obligations of their
    cover.


    1. Premium and Payment Obligations

    Premiums for Kingsmere Lifetime Pet Insurance are risk-based to ensure sustainable
    claims delivery. Policyholders are obligated to pay their premiums in full and
    on time. While an example monthly premium may be £32, actual costs are determined
    by individual risk profiles. Administrative fees may be applied to maintain operational
    quality; these are applied transparently, though we may waive them for customers
    who reach specific long-term loyalty tiers.


    2. Coverage and Limits

    We provide lifetime health support for pets, subject to an annual vet fee limit
    of £7,500. This limit resets each policy year, providing ongoing care for chronic
    conditions. The policyholder is responsible for an excess of £99 toward each claim,
    which must be paid before we provide reimbursement for the remaining eligible
    costs.


    3. Statutory Rights and Protections

    We adhere strictly to FCA and PRA regulations. All policyholders are entitled
    to a 14-day cooling-off period from the date of inception. Protection for this
    general insurance product is underpinned by the FSCS, which covers 90% of most
    general insurance claims should the institution fail.


    4. Policy Amendments and Verification

    No amendments to the policy—including changes to the pet''s details or payment
    methods—will be enacted without mandatory multi-factor authentication and rigorous
    identity verification.


    5. Termination and Disputes

    Customers may terminate this agreement by providing notice via our secure web
    portal or telephone. In the event of a dispute where a resolution is not reached
    through our structured escalation path, the customer retains the right to take
    the matter to the free Financial Ombudsman Service.


    For further details on how costs are calculated, refer to Kingsmere Lifetime Pet
    Insurance — how rates are tiered and applied.'
  domain: insurance
  product_category: pet_insurance
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 67cdca00-be3b-5b9a-9721-5e5056d632ba
  title: Kingsmere Lifetime Pet Insurance — who it is best for and common use cases
  body: 'Kingsmere Lifetime Pet Insurance is specifically engineered for pet owners
    who prioritise long-term reliability and the peace of mind that comes from comprehensive,
    sustainable cover. Unlike policies that provide a one-off sum for a condition,
    our lifetime approach is designed for those who want a permanent safety net for
    their pets.


    Who this product is best for:

    - Owners of breeds predisposed to chronic conditions: Because our annual vet fee
    limit of £7,500 renews every policy year, this is ideal for pets requiring ongoing
    medication or long-term treatment for a single ailment.

    - Customers valuing pricing transparency: We compete on the fairness of our renewals
    and the clarity of our fee structure, making this a strong choice for those who
    dislike hidden costs.

    - Those seeking high-limit protection: With a substantial annual limit and a straightforward
    excess of £99, we offer a premium level of protection for high-cost veterinary
    interventions.


    Common Use Cases:

    - Chronic Condition Management: A pet diagnosed with diabetes or arthritis can
    receive treatment every year, utilizing the £7,500 limit annually rather than
    exhausting a single lifetime cap.

    - Emergency Surgery: For sudden accidents or acute illnesses, the high vet fee
    limit ensures that complex surgeries and hospitalisation are covered without the
    owner worrying about hitting a low ceiling.

    - Predictable Budgeting: With an example monthly premium of £32, owners can integrate
    the cost of premium protection into their monthly household budget.


    By choosing Kingsmere, you are opting for a partnership based on trust and a high
    standard of care. For a more detailed look at how the annual limit works, see
    Kingsmere Lifetime Pet Insurance — vet fee limit each policy year explained.'
  domain: insurance
  product_category: pet_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: a63fcf45-f5b7-55d4-bfde-aa6eb43931d0
  title: Kingsmere Lifetime Pet Insurance — vet fee limit each policy year explained
  body: 'Q: How does the annual vet fee limit work for my pet?


    A: For Kingsmere Lifetime Pet Insurance, we provide an annual vet fee limit of
    £7,500. This is the maximum amount we will pay toward veterinary fees in a single
    policy year. Because this is a ''lifetime'' product, this £7,500 limit resets
    at the start of every new policy year. This means if your pet has a chronic condition
    requiring £2,000 of care every year, they can receive that care indefinitely,
    as long as the policy remains active.


    Q: Does the excess apply to this limit?


    A: Yes. The excess of £99 is the amount you pay toward a claim. The annual vet
    fee limit of £7,500 refers to the total amount available for coverage within the
    year after your excess has been applied.


    For a full overview of the product benefits, please refer to Kingsmere Lifetime
    Pet Insurance — overview.'
  domain: insurance
  product_category: pet_insurance
  document_type: faq
  source_authority: official
