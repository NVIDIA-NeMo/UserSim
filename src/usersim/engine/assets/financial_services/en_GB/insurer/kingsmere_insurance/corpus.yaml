- id: b565748f-277e-54a1-84c3-64edfbf896a3
  title: General frequently asked questions
  body: 'How do I contact Kingsmere Insurance support?

    We provide professional support via our secure web portals and through our telephone
    service. Our teams are available to assist you during standard UK business hours
    (GMT).


    What happens if my query is not resolved by the first agent I speak with?

    We follow a structured escalation path to ensure every issue is resolved fairly.
    If a front-line agent cannot resolve your query, it will be escalated to our senior
    operations leads for a comprehensive review.


    How do I start a new policy with Kingsmere Insurance?

    We offer a range of premium protection options for UK households. You can explore
    our products and open a new policy through our secure web portal or by speaking
    with one of our representatives on the telephone. For detailed guidance on the
    setup process, please refer to the specific ''how to guide'' for the product you
    are interested in.'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: ddb4ee5a-4f7e-5ce3-b081-b98a1588949b
  title: Regulatory notes for Insurance
  body: 'Kingsmere Insurance operates in strict adherence to the regulations set forth
    by the Financial Conduct Authority (FCA) and the Prudential Regulation Authority
    (PRA). All staff must ensure these standards are maintained in every customer
    interaction.


    Cooling-off Periods

    We provide a statutory window during which customers may cancel their policies.
    Agents must honour a 14-day cooling-off period for all general insurance products.
    For those holding a life insurance policy, this window is extended to 30 days.
    These periods are essential for ensuring customers have sufficient time to review
    their coverage.


    Renewal Pricing Fairness

    To maintain our commitment to transparency and fairness, we ensure that renewal
    prices for home and car insurance do not exceed the prices offered to equivalent
    new customers. This prevents ''price walking'' and ensures long-term policyholders
    are treated equitably.


    Financial Services Compensation Scheme (FSCS)

    Our protection is underpinned by the FSCS, providing a critical safety net for
    our policyholders. In the event of an institutional failure, the FSCS covers 100%
    of life insurance and compulsory insurance claims. For most general insurance
    claims, the FSCS provides coverage for 90% of the claim value.


    Dispute Resolution

    While we strive to handle all complaints and claims promptly and fairly, we must
    never promise a specific outcome for any individual claim. If a resolution cannot
    be reached through our internal escalation path (from front-line agents to senior
    operations leads), agents must inform the customer of their right to take the
    dispute to the free Financial Ombudsman Service.


    Agent Obligation

    Agents are required to provide educational guidance and product recommendations.
    However, agents must never provide individualised tax or legal advice, as this
    falls outside our professional boundaries. Our role is to help the customer understand
    their options and the necessity of prompt claims reporting.'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: d41e6b7e-3346-5705-966c-ac08163faa74
  title: When to use file_claim
  body: 'The file_claim tool is the authoritative mechanism for registering a new
    claim on Kingsmere Home Insurance, Kingsmere Lifetime Pet Insurance, or Kingsmere
    Comprehensive Car Insurance. Claims must be handled promptly and fairly, and customers
    should be encouraged to report incidents as soon as they occur.


    Procedure for Agents:


    1. Identity Verification: Before any state-changing action, the agent must use
    verify_identity to complete rigorous multi-factor authentication. No claim can
    be filed until the policyholder''s identity is confirmed.

    2. Account Resolution: Use get_accounts to retrieve the unique policy identifier
    associated with the verified customer using their provided account details (e.g.,
    last-4 digits of a policy number).

    3. Information Gathering: Collect all necessary details regarding the incident,
    including the date, time, location, and a description of the loss or damage.

    4. Tool Execution: Call the file_claim tool, providing the resolved policy ID
    and the specific details of the claim.

    5. Confirmation: Once the tool returns a claim reference number, provide this
    to the customer for their records.


    Important Constraints:

    - Never promise a specific outcome or a guaranteed payout for any claim during
    the filing process. All claims are subject to review based on the policy terms.

    - Remind the customer that their policy includes an Excess (the amount they must
    pay toward a claim), which may vary depending on the specific risk, such as escape-of-water
    provisions in home insurance.

    - For further information on how claims are assessed, agents may refer customers
    to the specific product''s terms and conditions, such as Kingsmere Comprehensive
    Car Insurance – account agreement.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: kingsmere_insurance
- id: 5027183d-18a4-55d3-9062-b125140fa089
  title: file_claim tool reference
  body: 'The file_claim tool is used to formally register a claim against a car, home,
    or pet insurance policy. The agent performs this action by calling the tool directly
    within the conversation after the customer''s identity has been verified.


    Tool Signature:

    file_claim(policy_id: string, claim_details: string)


    Arguments:

    - policy_id: The unique identifier for the policy, which the agent must obtain
    by calling get_accounts first.

    - claim_details: A comprehensive description of the incident and the nature of
    the claim as provided by the customer.


    Effect:

    Creates a new claim record in the system and returns a unique claim reference
    number. This action is state-changing and is the final step in the claim filing
    process.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: kingsmere_insurance
- id: bf865b7d-91bc-51e6-b9f7-5048fdf8764c
  title: When to use update_policy
  body: 'The update_policy tool is used when a policyholder needs to make a formal
    amendment to their existing coverage. We ensure that only verified policyholders
    can modify coverage to maintain security and prevent unauthorised changes.


    Common use cases for this tool include:

    - The acquisition of a new vehicle (for car insurance).

    - A change of residential address following a house move (for home insurance).

    - A change in the customer''s employment status or job role.

    - An update to the annual mileage reported on a motor policy.


    Procedure for Agents:


    1. Identity Verification: The agent must first perform mandatory identity verification
    using verify_identity. Multi-factor authentication is required before any policy
    amendment can be initiated.

    2. Account Resolution: Use get_accounts to identify the correct policy ID based
    on the customer''s details.

    3. Requirement Gathering: Clearly identify what specific detail is being changed
    (e.g., the new address or the new vehicle''s registration).

    4. Tool Execution: Call the update_policy tool, passing the policy ID and the
    updated information.

    5. Finalisation: Confirm to the customer that the policy has been updated and
    advise them if this change impacts their premium.


    If the customer wishes to add a driver specifically to a car insurance policy,
    the add_named_driver tool should be used instead. For changes regarding beneficiaries
    on life insurance, use the update_beneficiary tool. For a detailed walkthrough
    of making changes to car insurance, see Kingsmere Comprehensive Car Insurance
    – make a change or update.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: kingsmere_insurance
- id: 6e5272be-fcde-5964-ac3c-ca44173677d4
  title: update_policy tool reference
  body: 'The update_policy tool allows agents to modify the details of an existing
    insurance policy. The agent performs this action by calling the tool directly
    after the identity of the policyholder has been verified.


    Tool Signature:

    update_policy(policy_id: string, update_details: string)


    Arguments:

    - policy_id: The unique identifier for the policy, retrieved by the agent using
    the get_accounts tool.

    - update_details: The specific changes to be made to the policy (e.g., new address,
    updated mileage, or new vehicle details) as stated by the customer.


    Effect:

    Updates the policy records in the system to reflect the new information. This
    is a state-changing action.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: kingsmere_insurance
- id: 66c0f711-275c-5b51-aadc-f3a4591c11d8
  title: When to use add_named_driver
  body: 'The add_named_driver tool is used specifically for Kingsmere Comprehensive
    Car Insurance policies when a customer needs to add or remove a person authorised
    to drive the insured vehicle. Our model focuses on flexibility for named drivers,
    ensuring that the policy reflects the actual usage of the vehicle.


    Procedure for Agents:


    1. Identity Verification: As with all state-changing actions, the agent must first
    use verify_identity to conduct rigorous identity verification. Only the verified
    policyholder may add or remove drivers.

    2. Account Resolution: Use get_accounts to find the relevant policy ID for the
    motor insurance policy.

    3. Driver Information Collection: The agent must collect the full legal name,
    date of birth, and contact details of the driver being added. If a driver is being
    removed, their full name must be confirmed.

    4. Tool Execution: Call the add_named_driver tool, providing the policy ID and
    the driver''s personal details exactly as provided by the customer.

    5. Confirmation: Inform the customer that the driver has been updated on the policy
    and explain if this modification results in a premium adjustment.


    Note: Adding a driver may affect the risk-based premium calculation. Always ensure
    the customer is aware that premiums are adjusted to ensure sustainable delivery
    of claims. For more on how car insurance premiums are structured, see Kingsmere
    Comprehensive Car Insurance – example annual premium explained.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_named_driver
  institution_id: kingsmere_insurance
- id: 1bb822ac-a2b1-5aa0-866c-e5cd6ed3a222
  title: add_named_driver tool reference
  body: 'The add_named_driver tool is used to add or remove a named driver from a
    Kingsmere Comprehensive Car Insurance policy. The agent performs this action by
    calling the tool directly once the policyholder''s identity has been verified.


    Tool Signature:

    add_named_driver(policy_id: string, driver_details: string)


    Arguments:

    - policy_id: The unique identifier for the car insurance policy, obtained via
    the get_accounts tool.

    - driver_details: The personal information of the driver (full name, date of birth,
    and contact details) provided by the customer during the conversation.


    Effect:

    Modifies the policy to include or exclude the specified driver. This is a state-changing
    action.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_named_driver
  institution_id: kingsmere_insurance
- id: 5ca59b55-631c-5407-a187-771e3452b6e5
  title: When to use protect_no_claims_discount
  body: 'The protect_no_claims_discount tool is used exclusively for Kingsmere Comprehensive
    Car Insurance. A No Claims Discount (NCD) is a reward for not claiming, which
    reduces the premium. We offer the option to ''protect'' this discount for an additional
    cost, ensuring that a single claim does not result in the total loss of the earned
    discount.


    Procedure for Agents:


    1. Identity Verification: The agent must use verify_identity to perform mandatory
    multi-factor authentication. Only the verified policyholder can modify NCD protection
    settings.

    2. Account Resolution: Use get_accounts to retrieve the policy ID for the motor
    insurance account.

    3. Option Selection: Determine if the customer wishes to add or remove the NCD
    protection feature.

    4. Tool Execution: Call the protect_no_claims_discount tool, providing the policy
    ID and the requested action (add or remove).

    5. Confirmation: Confirm the change and clearly explain the additional cost associated
    with protecting the discount, or the removal of that cost if protection is being
    cancelled.


    Agents should ensure the customer understands that NCD protection is an optional
    addition. For further explanation on the costs associated with this feature, refer
    the customer to Kingsmere Comprehensive Car Insurance – yearly cost of protecting
    the no-claims discount explained.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - protect_no_claims_discount
  institution_id: kingsmere_insurance
- id: 73a7281a-f4b8-559b-b0c9-c81f860f922c
  title: protect_no_claims_discount tool reference
  body: 'The `protect_no_claims_discount` tool allows agents to add or remove No Claims
    Discount (NCD) protection for a customer''s Kingsmere Comprehensive Car Insurance
    policy. By adding protection, the customer ensures that their NCD remains intact
    even if a claim is made, subject to the terms of the policy.


    The agent performs this action by calling the tool directly within the conversation.
    This action is state-changing and requires the customer''s identity to be verified
    before execution.


    **Tool Signature:**

    `protect_no_claims_discount(account_id: string, protect_ncd_status: boolean)`


    **Arguments:**

    - `account_id`: The unique identifier for the car insurance policy, obtained via
    the `get_accounts` tool.

    - `protect_ncd_status`: A boolean value where `true` activates the protection
    and `false` removes it.


    **Effect:**

    The tool modifies the policy settings to either enable or disable NCD protection.
    A successful call will update the policy record and may result in a change to
    the premium, reflecting the cost of the protection service.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - protect_no_claims_discount
  institution_id: kingsmere_insurance
- id: 97d628aa-b3da-5bbd-9ddd-04cb13469e87
  title: When to use send_no_claims_proof
  body: 'We provide proof of No Claims Discount (NCD) to our customers when they are
    moving their motor insurance to another provider or require formal verification
    of their claims-free history. As we value transparency and the long-term reliability
    of our records, we ensure this proof is sent accurately and promptly to the designated
    recipient.


    This procedure is read-only and does not change the status of the current policy,
    though it is typically requested when a customer is preparing to leave Kingsmere
    Insurance.


    **Agent Procedure:**


    1. **Verify Identity**: Ensure the customer has passed the mandatory multi-factor
    authentication and identity verification process to protect their sensitive personal
    data.

    2. **Resolve Account**: Use the `get_accounts` tool to identify the correct `account_id`
    associated with the customer''s last-4 digits of their policy number.

    3. **Confirm Recipient**: Ask the customer for the exact email address of the
    insurer or third party that requires the proof of NCD.

    4. **Execute Tool**: Call the `send_no_claims_proof` tool using the resolved `account_id`
    and the provided recipient email address.

    5. **Confirm Completion**: Inform the customer that the proof has been dispatched
    and advise them to contact the receiving party if it does not arrive within three
    business days.


    For further details on the cost of maintaining this discount while with us, refer
    to Kingsmere Comprehensive Car Insurance — yearly cost of protecting the no-claims
    discount explained.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_no_claims_proof
  institution_id: kingsmere_insurance
- id: bfab4b47-6ef4-59d0-b40d-f4857848e6d7
  title: send_no_claims_proof tool reference
  body: 'The `send_no_claims_proof` tool is used to transmit formal evidence of a
    customer''s earned No Claims Discount (NCD) to an external party, such as another
    insurance provider. This is a read-only action that does not modify the policy
    data.


    The agent performs this action by calling the tool directly. Identity verification
    must be completed before this tool is invoked to ensure the data is sent only
    at the request of the verified policyholder.


    **Tool Signature:**

    `send_no_claims_proof(account_id: string, recipient_email: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the motor insurance policy, which the
    agent must retrieve using the `get_accounts` tool.

    - `recipient_email`: The email address provided by the customer where the proof
    should be sent.


    **Effect:**

    The tool generates a formal NCD proof document based on the current policy records
    and sends it via secure email to the specified recipient. The action is logged
    in the customer''s communication history.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_no_claims_proof
  institution_id: kingsmere_insurance
- id: 2eefd96d-2f3e-50a2-8e74-709cea339a9f
  title: When to use set_auto_renewal
  body: 'To provide our customers with seamless, continuous protection, we offer an
    automatic renewal feature across our insurance products. We use the `set_auto_renewal`
    tool when a customer wishes to either enable this convenience or opt out to review
    their coverage and pricing manually at the end of their term.


    Maintaining the correct renewal setting is vital for ensuring there are no gaps
    in cover, which could leave a household or vehicle unprotected. Because this is
    a state-changing action, rigorous security protocols must be followed.


    **Agent Procedure:**


    1. **Verify Identity**: Perform mandatory multi-factor authentication to ensure
    the request is made by the verified policyholder.

    2. **Resolve Account**: Use the `get_accounts` tool to find the `account_id` for
    the specific policy the customer wishes to update (e.g., Kingsmere Comprehensive
    Car Insurance or Kingsmere Home Insurance).

    3. **Confirm Preference**: Clearly confirm with the customer whether they wish
    to turn automatic renewal ''on'' or ''off''.

    4. **Execute Tool**: Call the `set_auto_renewal` tool with the identified `account_id`
    and the corresponding boolean status for `auto_renewal_enabled`.

    5. **Final Confirmation**: Confirm to the customer that their preference has been
    updated and explain that they will still receive a renewal notice regardless of
    this setting, in line with our commitment to transparency.


    If the customer is considering cancelling the policy entirely rather than just
    disabling renewal, refer them to the process in When to use close_account.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_auto_renewal
  institution_id: kingsmere_insurance
- id: 1ce90cf6-bd5f-5410-98e0-7e7b7a448e52
  title: set_auto_renewal tool reference
  body: 'The `set_auto_renewal` tool is used to toggle the automatic renewal status
    of any active insurance policy. This ensures that the customer''s cover continues
    without interruption or allows them to stop the process to manually review their
    renewal terms.


    The agent performs this action by calling the tool directly. This is a state-changing
    action that requires the customer''s identity to be fully verified before use.


    **Tool Signature:**

    `set_auto_renewal(account_id: string, auto_renewal_enabled: boolean)`


    **Arguments:**

    - `account_id`: The unique identifier for the policy, retrieved via the `get_accounts`
    tool.

    - `auto_renewal_enabled`: A boolean value where `true` enables automatic renewal
    and `false` disables it.


    **Effect:**

    The tool updates the renewal flag on the customer''s account. If set to `false`,
    the policy will expire at the end of the current term unless the customer manually
    renews it. If set to `true`, the system will automatically process the renewal
    premium at the end of the term.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_auto_renewal
  institution_id: kingsmere_insurance
- id: 12fe6c56-d5d2-5336-bbb9-52035341c84f
  title: When to use update_beneficiary
  body: 'For customers with Kingsmere Level Term Life Insurance, managing beneficiaries
    is a critical part of ensuring financial security for their loved ones. We use
    the `update_beneficiary` tool when a customer needs to specify who should receive
    the fixed-sum payout or when they wish to place their policy ''Written in Trust''.


    Writing a policy in trust is a legal arrangement where trustees hold the policy,
    allowing the payout to avoid probate and go directly to beneficiaries, which we
    highly recommend for efficiency and privacy. Because this action involves sensitive
    financial and legal arrangements, identity verification is mandatory.


    **Agent Procedure:**


    1. **Verify Identity**: Complete full identity verification and multi-factor authentication
    for the policyholder.

    2. **Resolve Account**: Use the `get_accounts` tool to retrieve the `account_id`
    for the Kingsmere Level Term Life Insurance policy.

    3. **Gather Details**: Collect the full legal names and contact details of the
    new beneficiaries or the trustees. If the policy is being placed in trust, the
    agent must clearly document the trustees'' information.

    4. **Execute Tool**: Call the `update_beneficiary` tool with the `account_id`
    and the detailed beneficiary or trustee information provided by the customer.

    5. **Educational Guidance**: Remind the customer that while we provide this facility
    and general guidance on the importance of trusts, we do not offer individualised
    legal or tax advice.


    For more information on the specific nature of trusts, refer to the definition
    of ''Written in Trust'' in the institutional glossary.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kingsmere_insurance
- id: 1e3b08c5-e44d-5b0f-b327-016fb17d68ac
  title: update_beneficiary tool reference
  body: 'The `update_beneficiary` tool is used exclusively for Kingsmere Level Term
    Life Insurance policies. It allows agents to update the beneficiaries of a policy
    or to establish a trust by appointing trustees.


    The agent performs this action by calling the tool directly. Given the legal and
    financial implications of beneficiary changes, this tool must only be used after
    the policyholder''s identity has been rigorously verified.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: string)`


    **Arguments:**

    - `account_id`: The unique identifier for the life insurance policy, obtained
    via `get_accounts`.

    - `beneficiary_details`: A comprehensive string containing the full name, date
    of birth, and relationship of the new beneficiaries, or the full names and details
    of the appointed trustees if the policy is being written in trust.


    **Effect:**

    The tool updates the beneficiary records associated with the policy. If trustees
    are named, the policy status is updated to ''Written in Trust'', ensuring the
    payout process bypasses probate.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kingsmere_insurance
- id: 8d44ab4e-1e83-549e-9c1b-931d8349af9f
  title: When to use open_account
  body: 'We use the `open_account` tool when a new customer wishes to purchase a policy
    from our range of comprehensive protection options. This process applies to all
    our primary products: Kingsmere Comprehensive Car Insurance, Kingsmere Home Insurance,
    Kingsmere Lifetime Pet Insurance, and Kingsmere Level Term Life Insurance.


    Our goal is to ensure a transparent and professional onboarding experience, helping
    customers choose the coverage options that best suit their risk profile while
    adhering to all FCA and PRA regulations.


    **Agent Procedure:**


    1. **Identity Verification**: Even for new customers, the agent must perform identity
    verification to prevent fraud and ensure that the person applying for cover is
    who they claim to be.

    2. **Product Selection**: Identify the correct `product_id` based on the customer''s
    needs (e.g., `car_insurance` for motor protection).

    3. **Information Gathering**: Collect all necessary personal details (full name,
    address, date of birth) and the specific coverage requirements (e.g., buildings
    and contents for home insurance, or term length for life insurance).

    4. **Fee Transparency**: Clearly state any applicable administrative fees and
    explain that premiums are risk-based to ensure fair pricing for all policyholders.

    5. **Execute Tool**: Call the `open_account` tool with the `product_id`, customer
    personal details, and chosen coverage options.

    6. **Cooling-off Period Disclosure**: Inform the customer that they have a statutory
    cooling-off period—14 days for general insurance and 30 days for life insurance—during
    which they can cancel the policy for a full refund.


    For a detailed look at what each product covers, agents should reference the respective
    product overview sheets, such as Kingsmere Comprehensive Car Insurance — overview.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kingsmere_insurance
- id: 696958e1-be2f-594e-ae08-6b8ae24038c2
  title: open_account tool reference
  body: 'The `open_account` tool is used to instantiate a new insurance policy for
    a customer. It is the primary mechanism for onboarding new clients across all
    product lines offered by Kingsmere Insurance.


    The agent performs this action by calling the tool directly. This is a state-changing
    action that requires the agent to have collected all necessary customer details
    and product preferences during the conversation.


    **Tool Signature:**

    `open_account(product_id: string, customer_details: string, coverage_options:
    string)`


    **Arguments:**

    - `product_id`: The identifier for the desired product (e.g., `car_insurance`,
    `home_insurance`, `pet_insurance`, or `life_insurance`).

    - `customer_details`: A string containing the full name, date of birth, and contact
    information of the applicant.

    - `coverage_options`: A string detailing the specific level of cover, any add-ons
    (like NCD protection), and the chosen risk parameters.


    **Effect:**

    The tool creates a new policy record in the system, assigns a unique `account_id`,
    and generates the initial premium calculation based on the risk-based pricing
    model. The customer is then issued their policy documentation.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kingsmere_insurance
- id: 2c81f64f-091e-56e2-acb7-686fdab032c9
  title: When to use close_account
  body: 'We use the `close_account` tool when a customer wishes to cancel their insurance
    policy. Whether they are moving to another provider or no longer require the cover,
    we handle these requests promptly and fairly, ensuring they understand their refund
    entitlements.


    **Refund and Cooling-off Periods:**

    We adhere strictly to regulatory standards regarding policy cancellations. Customers
    are entitled to a refund of the premium if they cancel within the statutory cooling-off
    period. This window is 14 days for general insurance (car, home, and pet) and
    30 days for life insurance. If a policy is cancelled after the cooling-off period,
    a pro-rata refund is provided, subject to any administrative fees that have not
    been waived for loyalty tiers.


    **Agent Procedure:**


    1. **Verify Identity**: Complete mandatory multi-factor authentication to ensure
    the request is authorised by the policyholder.

    2. **Resolve Account**: Use the `get_accounts` tool to identify the specific `account_id`
    to be closed.

    3. **Confirm Reason**: Document the reason for cancellation for our operational
    quality records.

    4. **Calculate Refund**: Inform the customer whether they are within the 14-day
    (general) or 30-day (life) cooling-off period and the resulting refund amount
    (full or pro-rata).

    5. **Execute Tool**: Call the `close_account` tool using the identified `account_id`.

    6. **Confirmation**: Confirm that the policy is now closed and advise the customer
    of the date the cover officially ceases.


    If the customer is unhappy with the cancellation process, remind them of their
    right to take disputes to the free Financial Ombudsman Service if a resolution
    is not reached through our internal escalation path.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kingsmere_insurance
- id: f708be55-e962-5c16-9e9d-8c19a567f7ed
  title: close_account tool reference
  body: 'The `close_account` tool is the authoritative mechanism used by agents to
    cancel an active insurance policy. The agent performs this action by calling the
    tool directly within the secure session after the policyholder''s identity has
    been rigorously verified.


    **Signature**

    `close_account(policy_number: string)`


    **Arguments**

    * `policy_number`: The unique identifier for the policy to be cancelled, which
    can be obtained via the `get_accounts` tool or provided by the customer.


    **Effect**

    Calling this tool immediately initiates the cancellation of the specified policy.
    The tool automatically calculates and applies the appropriate refund based on
    the timing of the request:

    * If the request occurs within the statutory cooling-off period (14 days for general
    insurance; 30 days for life insurance), a full refund of the premium is processed.

    * For requests made after the cooling-off period, a pro-rata refund is calculated
    and issued to the policyholder.


    Agents must inform the customer that this action is irreversible once completed.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kingsmere_insurance
- id: dac5f455-2a81-5dec-8422-8412ecbaf63d
  title: When to use get_accounts
  body: 'We use the `get_accounts` tool as the primary method for identifying which
    policies are associated with a customer. This tool is essential for resolving
    a customer''s internal account identifiers using only the information they provide
    during the call, such as the last four digits of a policy number or their verified
    personal details.


    **Agent Procedure**


    1. **Identity Verification**: Before calling any data-retrieval tool, the agent
    must complete the mandatory multi-factor authentication and identity verification
    process to ensure the caller is the verified policyholder.

    2. **Account Retrieval**: The agent calls the `get_accounts` tool. This allows
    the agent to see a comprehensive list of all active and lapsed policies held by
    the customer across our range, including Kingsmere Comprehensive Car Insurance,
    Kingsmere Home Insurance, Kingsmere Lifetime Pet Insurance, and Kingsmere Level
    Term Life Insurance.

    3. **Policy Resolution**: If the customer refers to a policy by a partial number
    (e.g., "the one ending in 4421"), the agent uses the output of `get_accounts`
    to match that fragment to the full, system-recognised policy number.

    4. **Confirmation**: The agent confirms with the customer which specific policy
    they wish to discuss or amend to ensure no actions are taken on the wrong account.


    This procedure ensures that we maintain a high standard of security and accuracy,
    preventing the accidental modification of coverage or the disclosure of sensitive
    data to unauthorised parties. Once the specific policy number is resolved via
    `get_accounts`, the agent may then proceed to other state-changing tools as required
    by the customer''s request.


    For a detailed technical breakdown of this tool, agents should refer to the get_accounts
    tool reference.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kingsmere_insurance
- id: a14eb3c7-85db-5616-9e1e-364236a1f9bf
  title: get_accounts tool reference
  body: 'The `get_accounts` tool allows agents to retrieve a full list of insurance
    policies associated with a verified customer. The agent performs this action by
    calling the tool directly after identity verification is complete.


    **Signature**

    `get_accounts()`


    **Arguments**

    This tool does not require additional arguments; it retrieves account data based
    on the currently authenticated and verified session of the policyholder.


    **Effect**

    The tool returns a list of all policies linked to the customer''s profile. Each
    entry includes the full policy number, the product type (e.g., car, home, pet,
    or life insurance), the current status of the policy (e.g., active, lapsed, or
    pending), and the start and end dates of the cover. This is the required first
    step for any agent needing to resolve a specific policy identifier before performing
    a state-changing action.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kingsmere_insurance
- id: e0b52866-d647-5b52-a90c-283b1924ff41
  title: When to use update_contact_info
  body: "We provide the `update_contact_info` tool to ensure that our records remain\
    \ accurate and that policyholders receive critical communications, such as renewal\
    \ notices and claim updates, without delay. This tool should be used whenever\
    \ a customer reports a change in their personal contact details.\n\n**Agent Procedure**\n\
    \n1. **Identity Verification**: The agent must first complete the mandatory identity\
    \ verification and multi-factor authentication. No contact details may be updated\
    \ until the policyholder is fully verified.\n2. **Account Identification**: The\
    \ agent calls the `get_accounts` tool to identify the correct policy number associated\
    \ with the customer, especially if the customer holds multiple policies with us.\n\
    3. **Information Gathering**: The agent asks the customer for the specific details\
    \ that need updating. This may include:\n    * Residential or correspondence address\n\
    \    * Primary telephone number\n    * Email address for digital correspondence\n\
    4. **Execution**: The agent calls the `update_contact_info` tool, providing the\
    \ verified policy number and the new contact details as stated by the customer.\n\
    5. **Confirmation**: The agent confirms to the customer that the changes have\
    \ been applied and advises them that a confirmation email or letter will be sent\
    \ to the new address/email.\n\nBy following this structured path, we ensure that\
    \ sensitive personal data is handled securely and that we adhere to our commitment\
    \ to transparency and reliability. For further details on the tool's specific\
    \ requirements, see the update_contact_info tool reference."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kingsmere_insurance
- id: 1f1b09ba-6340-5f7e-8157-75520e8efc4a
  title: update_contact_info tool reference
  body: 'The `update_contact_info` tool is used by agents to modify the personal contact
    details of a policyholder. The agent performs this action by calling the tool
    directly after identity verification.


    **Signature**

    `update_contact_info(policy_number: string, updated_details: object)`


    **Arguments**

    * `policy_number`: The identifier for the policy being updated (retrieved via
    `get_accounts`).

    * `updated_details`: An object containing the specific fields to be changed. This
    can include `email_address`, `phone_number`, and `mailing_address`. These values
    must be provided exactly as the customer states them.


    **Effect**

    The tool updates the customer''s contact record in the central database for the
    specified policy. This change ensures that all future correspondence, including
    legal notices and renewal pricing, is sent to the correct destination.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kingsmere_insurance
- id: 8b211bd8-f3d9-566b-af7a-2b30658d6c5b
  title: When to use get_statements
  body: 'The `get_statements` tool is used when a customer requests a summary of their
    financial interactions with Kingsmere Insurance, such as premium payment history,
    fee applications, or refund records. We provide this service to maintain transparency
    regarding our risk-based pricing and administrative fees.


    **Agent Procedure**


    1. **Identity Verification**: Before accessing financial records, the agent must
    perform a full identity verification and multi-factor authentication.

    2. **Account Identification**: The agent calls the `get_accounts` tool to resolve
    the specific policy number for which the statement is required.

    3. **Request Parameters**: The agent confirms with the customer the specific time
    period for which they require the statement (e.g., the current policy year or
    the previous calendar year).

    4. **Execution**: The agent calls the `get_statements` tool, specifying the policy
    number and the requested date range.

    5. **Delivery**: The agent informs the customer that the statement has been generated
    and is available for view via the secure web portal, or offers to send it via
    the verified contact method on file.


    This process ensures that financial data is only disclosed to the verified policyholder
    and that the information provided is accurate and comprehensive. For technical
    specifications, refer to the get_statements tool reference.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kingsmere_insurance
- id: 09793745-de00-5997-b80f-e93fef806c60
  title: get_statements tool reference
  body: 'The `get_statements` tool allows agents to retrieve financial statements
    and payment histories for a specific insurance policy. The agent performs this
    action by calling the tool directly after identity verification.


    **Signature**

    `get_statements(policy_number: string, start_date: string, end_date: string)`


    **Arguments**

    * `policy_number`: The unique identifier for the policy, obtained via `get_accounts`.

    * `start_date`: The start date of the period for which the statement is required
    (YYYY-MM-DD).

    * `end_date`: The end date of the period for which the statement is required (YYYY-MM-DD).


    **Effect**

    The tool generates a report of all financial transactions associated with the
    policy for the given period, including premium payments, any applied administrative
    fees, and any refunds issued (such as those during a cooling-off period).'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kingsmere_insurance
- id: 5a277a50-2e25-5555-add6-01351151761f
  title: When to use set_alerts
  body: "We use the `set_alerts` tool to help our customers stay informed about their\
    \ coverage and upcoming obligations. This tool allows agents to configure automated\
    \ notifications for key events, ensuring the customer is never surprised by a\
    \ renewal date or a required action.\n\n**Agent Procedure**\n\n1. **Identity Verification**:\
    \ The agent must first complete the mandatory identity verification and multi-factor\
    \ authentication process.\n2. **Account Identification**: The agent calls the\
    \ `get_accounts` tool to identify the correct policy number for the alerts.\n\
    3. **Preference Selection**: The agent discusses with the customer which alerts\
    \ they wish to activate. Common alerts include:\n    * Renewal price notifications\
    \ (to ensure transparency in our fair renewal pricing).\n    * Payment reminders.\n\
    \    * Expiry warnings for the cooling-off period.\n4. **Execution**: The agent\
    \ calls the `set_alerts` tool, specifying the policy number and the chosen alert\
    \ types.\n5. **Confirmation**: The agent confirms that the alerts are now active\
    \ and will be delivered via the customer's preferred contact method (email or\
    \ SMS).\n\nBy proactively setting these alerts, we strengthen our partnership\
    \ with the customer and reinforce our commitment to being a trusted, premium provider.\
    \ For the tool's technical arguments, see the set_alerts tool reference."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kingsmere_insurance
- id: 82a85538-a6f6-575f-91a5-97b87b2892ca
  title: set_alerts tool reference
  body: 'The `set_alerts` tool is used by agents to enable or disable automated notifications
    for a policyholder. The agent performs this action by calling the tool directly
    after identity verification.


    **Signature**

    `set_alerts(policy_number: string, alert_type: string, enabled: boolean)`


    **Arguments**

    * `policy_number`: The unique identifier for the policy, obtained via `get_accounts`.

    * `alert_type`: The specific category of notification the customer wishes to manage
    (e.g., "renewal_notice", "payment_reminder").

    * `enabled`: A boolean value (`true` or `false`) indicating whether the alert
    should be turned on or off.


    **Effect**

    The tool updates the notification preferences for the specified policy. Once enabled,
    the system will automatically trigger the corresponding alert when the defined
    event occurs.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kingsmere_insurance
- id: f85784f3-e107-508f-ab69-e2bf3ad2c932
  title: When to use get_claim_status
  body: 'The `get_claim_status` tool is used when a customer contacts us to check
    the progress of an existing claim. Because we never promise a specific outcome
    for any claim, this tool allows agents to provide an objective, factual update
    on the current stage of the claim process.


    **Agent Procedure**


    1. **Identity Verification**: The agent must complete the mandatory identity verification
    and multi-factor authentication to ensure the caller is the policyholder or an
    authorised representative.

    2. **Reference Retrieval**: The agent asks the customer for their claim reference
    number. If the customer does not have this number, the agent can use `get_accounts`
    to find the policy and then search for the most recent claim associated with it.

    3. **Execution**: The agent calls the `get_claim_status` tool using the provided
    claim reference number.

    4. **Information Delivery**: The agent provides the customer with the current
    status (e.g., "Under Review", "Adjuster Assigned", "Payment Processed").

    5. **Expectation Management**: The agent reinforces that the current status is
    a progress update and does not constitute a final decision on the claim outcome.

    6. **Escalation**: If the customer is dissatisfied with the progress or the status
    provided, the agent follows the structured escalation path to a senior operations
    lead.


    This procedure ensures that we handle claims promptly and fairly while remaining
    transparent about the process. For technical details, refer to the get_claim_status
    tool reference.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: kingsmere_insurance
- id: 86c8c735-65c8-50d0-8062-2f530ebcbbe7
  title: get_claim_status tool reference
  body: 'The get_claim_status tool allows us to provide customers with an immediate
    and accurate update on the progress of their insurance claim. We use this tool
    to ensure transparency and peace of mind while a claim is being processed for
    our Kingsmere Comprehensive Car Insurance, Kingsmere Home Insurance, or Kingsmere
    Lifetime Pet Insurance policies.


    The agent performs this action by calling the tool directly within the conversation;
    we do not direct the customer to a self-service portal for this specific inquiry.


    **Tool Signature**

    `get_claim_status(claim_reference)`


    **Arguments**

    * `claim_reference`: The unique claim reference number provided to the customer
    upon the initial filing of the claim, or retrieved from the customer''s policy
    records.


    **Effect**

    The tool retrieves the current status of the specified claim from our internal
    systems. This returns the most recent milestone in the claims process, such as
    whether the claim is under initial review, awaiting assessor documentation, or
    has been finalised for payout.


    This is a read-only operation and does not modify any policy or claim data. For
    guidance on the appropriate timing for this tool, please refer to When to use
    get_claim_status.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: kingsmere_insurance
