- id: ec08b87e-b4d7-58bb-9c56-823c8fc0f526
  title: Kingsmere Home Insurance — getting started walkthrough
  body: 'This walkthrough is designed to assist support agents in guiding new customers
    through the activation and understanding of Kingsmere Home Insurance.


    **Core Product Features**

    When explaining the policy to a customer, emphasise the following key protections:

    - **Buildings Cover:** A robust limit of £1,000,000 to protect the physical structure
    of the home.

    - **Contents Cover:** Comprehensive protection for personal belongings up to a
    limit of £75,000.

    - **Accidental Damage:** Included as a core feature of our comprehensive cover.


    **Pricing and Excesses**

    Explain the risk-based nature of our premiums. Use our example annual premium
    of £340 to illustrate typical costs, but remind the customer that their actual
    quote will depend on their specific risk profile. Ensure the customer understands
    the costs they will bear during a claim:

    - **Standard Excess:** A typical claim requires the policyholder to pay £100.

    - **Escape-of-Water Excess:** Due to the higher risk associated with water damage,
    this specific excess is £350.


    **Onboarding Process**

    1. **Verification:** Guide the customer through the mandatory multi-factor authentication
    (MFA) setup. This is required for all secure web portal access.

    2. **Policy Review:** Ensure the customer has reviewed the 14-day cooling-off
    period and the FSCS protection details (covering 90% of most general insurance
    claims).

    3. **Payment Setup:** Confirm the premium payment method and clarify any applicable
    administrative fees, noting that these may be waived for certain loyalty tiers.


    ***


    Agent Note: Always maintain a professional and reassuring tone. Do not promise
    specific claim outcomes, but emphasise the breadth of our comprehensive cover.'
  domain: insurance
  product_category: home_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 12bf4dc1-d827-5efe-a109-6d90276b8527
  title: Kingsmere Home Insurance — contents cover limit explained
  body: '**What is the contents cover limit for Kingsmere Home Insurance?**

    Our standard comprehensive policy provides a contents cover limit of £75,000.
    This is the maximum total amount we will pay out for the loss or damage of your
    personal belongings within your home, regardless of the number of individual claims
    made.


    **Does this limit include high-value items?**

    Yes, the £75,000 limit encompasses all covered contents. However, we recommend
    specifying individual high-value items (such as jewellery or fine art) to ensure
    they are accurately protected within that total limit.


    **How does this differ from the buildings cover?**

    While the contents limit protects your belongings up to £75,000, the buildings
    cover limit is significantly higher, providing up to £1,000,000 for the structure
    of the property itself. For more details on our core protections, please see Kingsmere
    Home Insurance — overview.


    ***


    Disclaimer: Limits are subject to the specific terms of your policy schedule.
    Please report any claims promptly to ensure full coverage.'
  domain: insurance
  product_category: home_insurance
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 99013dd1-eb20-5ce9-b9fe-99b056482760
  title: Kingsmere Home Insurance — make a change or update
  body: 'If you need to modify your coverage or update your personal details, we provide
    a secure process to ensure your protection remains accurate and comprehensive.
    Please follow these steps to make a change:


    1. **Provide Identification:** Provide your policy number and complete our mandatory
    identity verification process. For your security, we will use multi-factor authentication
    (MFA) to confirm you are the verified policyholder.

    2. **Specify the Update:** Clearly state the change you wish to make. For example,
    you may wish to increase your contents cover limit toward the £75,000 ceiling
    or update your home address.

    3. **Review Premium Impact:** We will calculate how the change affects your risk
    profile. We will inform you if this results in a premium adjustment. (For context,
    our example annual premium is £340, though your specific rate will vary).

    4. **Confirm the Excess:** If the change affects the type of risk covered, we
    will remind you of the applicable excesses, such as the standard excess of £100
    or the escape-of-water excess of £350.

    5. **Receive Confirmation:** Once you agree to any revised terms or premiums,
    we will process the amendment and send a formal confirmation of the change to
    your registered email address.


    ***


    Note: All policy amendments are subject to our standard verification protocols
    to prevent unauthorised access to sensitive personal data. For information on
    our excess levels, see Kingsmere Home Insurance — standard excess explained.'
  domain: insurance
  product_category: home_insurance
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: b8c97138-8c2d-52aa-9f0b-1a101dee58aa
  title: Kingsmere Home Insurance — access or login problems
  body: 'We understand that being unable to access your policy details can be frustrating.
    If you are experiencing difficulties logging into the Kingsmere secure web portal,
    please refer to the following troubleshooting steps.


    **Symptom: ''Invalid Credentials'' or ''Access Denied''**

    *   **Likely Cause:** Incorrect username or password, or an account lock due to
    multiple failed attempts.

    *   **What to check:** Ensure that your Caps Lock is off and that you are using
    the email address associated with your policy.

    *   **The Fix:** Use the ''Reset Password'' feature on the portal. You will be
    required to complete identity verification via your registered mobile device to
    regain access.


    **Symptom: Multi-Factor Authentication (MFA) Code Not Received**

    *   **Likely Cause:** Network delays, incorrect mobile number on file, or MFA
    synchronisation error.

    *   **What to check:** Verify that your mobile device has a stable signal. Check
    your spam or filtered messages if the code is sent via SMS.

    *   **The Fix:** Request a new code. If the problem persists, we will perform
    a manual identity verification over the telephone to help you regain access.


    **When to Escalate**

    If you have attempted the password reset and MFA synchronisation and still cannot
    access your account, the issue will be escalated. We will route your case to a
    senior operations lead who will oversee a rigorous identity verification process
    to unlock your account manually.


    ***


    Disclaimer: For security reasons, we will never ask you to reveal your MFA code
    to an agent over the phone. All codes are for your private use within the secure
    portal only.'
  domain: insurance
  product_category: home_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: ab33de70-b1df-5579-ae5e-4051e5d28de1
  title: Kingsmere Home Insurance — qualification tiers
  body: 'Use the following matrix to determine the policy tier and premium application
    for prospective customers. Note that premiums are risk-based to ensure sustainability
    and fairness.


    | Condition | Qualification Tier | Outcome / Premium Application |

    | :--- | :--- | :--- |

    | Standard residential property, low-risk postcode | Standard Tier | Eligible
    for standard risk-based pricing (e.g., example annual premium of £340). |

    | High-risk property (e.g. flood zone, thatched roof) | Enhanced Risk Tier | Premium
    adjusted upwards to reflect increased risk; comprehensive cover remains available.
    |

    | Long-term policyholder (3+ years) | Loyalty Tier | Eligible for potential waiver
    of administrative fees; renewal pricing parity guaranteed. |

    | Non-standard construction or commercial mix | Specialist Tier | Requires manual
    underwriting review before a premium quote is issued. |


    ***


    Agent Note: All tiers are underpinned by our standard limits: £1,000,000 for buildings
    and £75,000 for contents. Refer to Kingsmere Home Insurance — fee schedule for
    further details on administrative charges.'
  domain: insurance
  product_category: home_insurance
  document_type: eligibility_matrix
  source_authority: official
