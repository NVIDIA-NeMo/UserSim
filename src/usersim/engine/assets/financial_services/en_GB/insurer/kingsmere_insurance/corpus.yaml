- id: 86e78a34-98f9-5fef-8409-cf2746a2f5a7
  title: Kingsmere Level Term Life Insurance — access or login problems
  body: 'If you are experiencing difficulties accessing your Kingsmere secure web
    portal, please follow this troubleshooting guide to resolve the issue.


    Symptom: ''I cannot log in to my account'' or ''My MFA code is not arriving''.


    Likely Causes:

    - Incorrect login credentials.

    - Outdated browser cache or incompatible browser version.

    - Network delays affecting the delivery of multi-factor authentication (MFA) codes.

    - Account lockout due to multiple failed verification attempts.


    What to check in order:

    1. Credentials: Ensure you are using the correct email address and password. Remember
    that passwords are case-sensitive.

    2. MFA Delivery: Check your registered mobile device or email for the authentication
    code. If it has not arrived within five minutes, request a new code.

    3. Browser health: Clear your browser cache and cookies, or attempt to log in
    using a different modern web browser.

    4. Account Status: Check if you have received a notification regarding a security
    lockout due to unsuccessful login attempts.


    How to fix it:

    - For forgotten passwords, use the ''Reset Password'' option on the login page,
    which will require identity verification.

    - If the MFA device is no longer available, ask us to update your contact details.
    This will require a rigorous manual identity verification process.


    When to escalate:

    If you have completed these steps and still cannot access your policy details,
    we will escalate your case to a senior operations lead. We will then perform a
    manual review of your account security and contact you within two business days
    (GMT) to restore your access. For assistance with general policy updates, see
    Kingsmere Level Term Life Insurance — make a change or update.'
  domain: insurance
  product_category: life_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 9bef5d1d-daca-53a8-aff7-1ccabb05d3af
  title: Kingsmere Level Term Life Insurance — qualification tiers
  body: 'This matrix is for support agents to determine the initial qualification
    of prospective customers for Kingsmere Level Term Life Insurance. All applicants
    must meet the baseline criteria to be considered for a risk-based premium.


    | Criteria | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a legal UK resident | Eligible for further assessment |

    | Age | Within the supported age range for term insurance | Eligible for further
    assessment |

    | Health Status | Disclosure of all pre-existing conditions | Determines premium
    tier (Risk-based) |

    | Financial Need | Evidence of need for cover (e.g., mortgage) | Required for
    high cover amounts (e.g., £200,000+) |

    | Trust Setup | Agreement to write policy in trust | Standard recommendation for
    efficiency |


    Applicants who meet these requirements will proceed to the full underwriting process,
    where their specific monthly premium (e.g., £12) and term length (e.g., 25 years)
    will be finalised. For the full onboarding flow, see Kingsmere Level Term Life
    Insurance — getting started walkthrough.'
