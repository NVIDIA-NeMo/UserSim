- id: 58d105d7-aafc-5d04-853e-3eda449c8b42
  title: Kingsmere Level Term Life Insurance — set up and activate
  body: 'To set up a Kingsmere Level Term Life Insurance policy, please follow these
    steps:


    1. Provide your personal and medical details: We will ask you to share a comprehensive
    health declaration and personal history. This allows us to calculate a fair, risk-based
    premium.

    2. Select your coverage parameters: Specify the total cover amount you require
    (for example, £200,000) and the duration of the policy in years (for example,
    25).

    3. Complete identity verification: You will be required to undergo rigorous identity
    verification and multi-factor authentication. This ensures that only the verified
    policyholder can establish the contract.

    4. Nominate your beneficiaries and Trust details: Tell us who should receive the
    payout. We strongly recommend opting to have the policy written in trust to ensure
    the payout avoids probate.

    5. Review and confirm the premium: We will provide your calculated monthly premium
    (e.g., £12, depending on your risk profile). Once you confirm the payment method,
    we will activate the cover.


    Your policy is active once we issue your policy schedule. You will then enter
    your 30-day cooling-off period, during which you can cancel the policy for a full
    refund of premiums paid.


    For further information on the legal protections associated with your new policy,
    see Kingsmere Level Term Life Insurance — regulatory disclosures.'
