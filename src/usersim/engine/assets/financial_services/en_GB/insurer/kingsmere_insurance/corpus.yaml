- id: ae860ced-be2f-5436-94e6-6d49e5f9769d
  title: Kingsmere Lifetime Pet Insurance — an unexpected charge or amount
  body: 'This guide is for support agents assisting customers who have reported an
    unexpected charge or a discrepancy in the amount deducted from their account for
    Kingsmere Lifetime Pet Insurance.


    Symptom:

    The customer states that their monthly payment is higher than the example premium
    of £32, or they have been charged an amount they did not anticipate during a claim.


    Likely Causes and Checklist:

    1. Application of Excess: Check if the customer is referring to a claim payout.
    Remind the customer that there is a compulsory excess of £99 per claim, which
    is deducted from the total reimbursement.

    2. Administrative Fees: Review the account for any applied administrative fees.
    These are used to maintain operational quality. Check if the customer is in a
    loyalty tier that would typically waive these fees.

    3. Risk-Based Premium Adjustment: Verify if the policy has recently renewed. Because
    we use risk-based pricing, premiums are adjusted at renewal to ensure sustainability.
    Check if the new premium reflects a change in the pet''s risk profile.

    4. Payment Frequency: Confirm if the customer is on a monthly or annual payment
    plan, as this affects the transaction amounts.


    Resolution Path:

    - If the charge is a correctly applied excess of £99 or a risk-based premium increase,
    explain the policy terms clearly to the customer.

    - If an administrative fee was applied in error to a loyalty-tier customer, escalate
    the case to a senior operations lead to have the fee waived.

    - If the discrepancy remains unexplained, we will raise a formal internal investigation
    and notify the customer of the expected resolution timeline.


    For more information on our fee structure, refer to Kingsmere Lifetime Pet Insurance
    — fee schedule.'
  domain: insurance
  product_category: pet_insurance
  document_type: troubleshooting
  source_authority: official
