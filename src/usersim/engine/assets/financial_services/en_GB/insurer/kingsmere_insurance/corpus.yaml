  institution_id: kingsmere_insurance
- id: 65e2f45e-eecc-5c81-b7a3-075d37571dc7
  title: Kingsmere Comprehensive Car Insurance — a discrepancy in your records or
    statement
  body: 'Support agents may encounter customers who believe there is an error in their
    premium, excess, or NCD status. It is essential to handle these discrepancies
    with transparency and precision.


    **Symptoms of a Discrepancy**

    - A customer claims their annual premium is higher than the quoted £640 example
    without reason.

    - A customer disputes the application of the £250 compulsory excess on a claim.

    - A customer believes they paid the £45 for NCD protection, but it is not appearing
    on their statement.


    **Investigation Steps**

    1. Verify Identity: Ensure the customer has passed multi-factor authentication
    (MFA) before discussing any specific financial figures.

    2. Audit the Risk Profile: Check the policy records for any recent changes (e.g.,
    new drivers, change of address, or vehicle modifications) that would trigger a
    risk-based premium increase.

    3. Review Payment History: For disputed NCD protection, check the transaction
    logs to see if the £45 fee was successfully processed and applied to the policy.

    4. Validate the Excess: Confirm that the claim in question is subject to the standard
    compulsory excess of £250 and check if any voluntary excess was also selected
    by the customer.


    **Resolution and Escalation**

    - If the error is administrative (e.g., a payment was missed), we will correct
    the record and notify the customer immediately.

    - If the customer disagrees with the risk-based pricing calculation, do not promise
    a specific outcome. Instead, explain the factors influencing the cost.

    - If a resolution cannot be reached, escalate the matter to a senior operations
    lead. Remind the customer that they have the right to take the dispute to the
    free Financial Ombudsman Service if we cannot resolve it to their satisfaction.'
  domain: insurance
  product_category: car_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: d9a6183b-b72e-5d17-a2c3-95d1cad230d3
  title: Kingsmere Home Insurance — overview
  body: "We are proud to offer Kingsmere Home Insurance, a premium protection plan\
    \ designed for UK households that prioritise transparency and long-term reliability.\
    \ We focus on providing a robust safety net for your most valuable assets, combining\
    \ broad coverage with a commitment to fair pricing during your renewal cycles.\n\
    \nOur comprehensive cover is built around two primary pillars: buildings and contents.\
    \ For the structure of your home, we provide a buildings cover limit of £1,000,000,\
    \ ensuring that the physical fabric of your property is securely protected. To\
    \ safeguard your personal belongings, our contents cover limit is set at £75,000.\n\
    \nTransparency in cost is central to our partnership with you. While premiums\
    \ are risk-based to ensure sustainability and fairness for all policyholders,\
    \ a typical example of an annual premium for this product is £340. \n\nWhen making\
    \ a claim, we maintain a clear structure regarding the amounts you contribute.\
    \ Our standard excess is £100. However, we recognise that certain risks require\
    \ different handling; therefore, for claims related to the escape of water, a\
    \ specific escape-of-water excess of £350 applies. This ensures we can continue\
    \ to provide high-quality operational support and sustainable claims delivery\
    \ for all our customers.\n\nWe believe in a partnership based on trust. This means\
    \ we avoid dense jargon and ensure you understand exactly what is covered and\
    \ what your obligations are. For a full breakdown of the costs associated with\
    \ this policy, please refer to the Kingsmere Home Insurance — fee schedule.\n\n\
    ***\n\nDISCLAIMER: Premiums are risk-based and vary depending on individual circumstances.\
    \ We provide educational guidance on coverage options but do not offer individualised\
    \ tax or legal advice."
  domain: insurance
