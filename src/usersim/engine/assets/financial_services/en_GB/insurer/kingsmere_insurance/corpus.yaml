- id: b3ce1265-b615-5f85-8863-c0feb5c84d35
  title: Kingsmere Comprehensive Car Insurance — check status or history
  body: 'If you need to review your policy documents, check the current status of
    your cover, or view your claims history, please follow these steps to ensure your
    data remains secure.


    **Prerequisites**

    To protect your sensitive personal data, you will need to have your policy number
    ready and access to the device used for your multi-factor authentication (MFA).


    **Steps to Retrieve Your History**

    1. Request Access: Inform us that you wish to view your policy status or claims
    history. We will initiate a secure verification sequence.

    2. Complete Identity Verification: We will prompt you for your identity details.
    You must then complete the multi-factor authentication (MFA) challenge. This mandatory
    step ensures that only the verified policyholder can access sensitive data.

    3. Specify the Records Needed: Tell us whether you require your current certificate
    of insurance, a history of your premium payments (such as the £640 example annual
    premium), or a summary of previous claims.

    4. Receive Documentation: We will then provide the requested documents or status
    updates via your secure web portal or as a verified digital transmission.


    **Confirmation of Success**

    You will know the process is complete when you receive a confirmation message
    from us and can view the requested documents in your secure history logs.


    ***

    DISCLAIMER: Access to policy history is strictly limited to verified policyholders.
    Any request made by a third party without a legal power of attorney will be declined
    to ensure compliance with PRA and FCA regulations.'
  domain: insurance
  product_category: car_insurance
  document_type: how_to_guide
  source_authority: official
