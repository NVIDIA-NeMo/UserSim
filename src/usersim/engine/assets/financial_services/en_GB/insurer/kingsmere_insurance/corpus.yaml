- id: 828637d9-eac2-5282-8440-45ec6cae38e6
  title: Kingsmere Level Term Life Insurance — privacy and data handling
  body: 'Kingsmere Insurance is committed to the highest standards of data privacy
    and regulatory compliance, adhering strictly to FCA and PRA guidelines. This disclosure
    explains how we handle your personal and medical data in relation to your Kingsmere
    Level Term Life Insurance policy.


    Data Collection and Use

    We collect personal, financial, and health-related data to determine your risk
    profile. This information is essential for calculating your risk-based premiums.
    For instance, your health data directly influences whether your monthly premium
    is £12 or a different amount based on the risk associated with the cover amount
    (e.g., £200,000).


    Security and Verification

    To protect your data, we implement mandatory multi-factor authentication (MFA)
    and rigorous identity verification. We ensure that sensitive data, such as beneficiary
    details in a trust arrangement, can only be accessed or modified by a verified
    policyholder. This prevents unauthorised parties from making changes to your coverage
    or accessing your personal records.


    Data Sharing and Third Parties

    We may share data with medical professionals during the underwriting process to
    verify the accuracy of your health disclosure. All such transfers are conducted
    via secure channels. We do not sell your data to third-party marketers.


    Your Rights

    Under UK data protection laws, you have the right to request a copy of the data
    we hold about you and to request corrections to any inaccuracies. Any such requests
    must be made by the verified policyholder and will be processed via our secure
    web portal or telephone service during UK business hours (GMT).


    For more information on the binding agreement of your policy, including the 30-day
    cooling-off period, please see Kingsmere Level Term Life Insurance — change-of-terms
    policy.'
  domain: insurance
  product_category: life_insurance
  document_type: disclosure
  source_authority: official
