- id: c8f855c3-6652-5566-81b0-7f08377304c4
  title: Kingsmere Home Insurance — recognizing scams targeting this product
  body: 'As you compare our comprehensive protection against other providers, it is
    important to understand how we protect your security and how to recognise fraudulent
    activity targeting home insurance policyholders. At Kingsmere Insurance, we maintain
    a professional and transparent partnership with our customers; we will never ask
    you to disclose your full security credentials or passwords via email or text
    message.


    Common scams targeting this product often involve ''urgent'' notifications claiming
    your policy has lapsed or that a payment is overdue. These messages may use high-pressure
    tactics, suggesting that your buildings cover—which can reach limits of £1,000,000—is
    at risk of being voided unless a payment is made immediately via an unverified
    link. Please be aware that we always use secure web portals or verified telephone
    channels for payment and policy amendments.


    Another common pattern involves fraudsters posing as claims adjusters who request
    an immediate ''administrative fee'' to expedite a claim payout. As per our fee
    philosophy, all administrative fees are applied transparently to your account
    and are not requested as one-off payments to individual representatives.


    To ensure the integrity of your coverage, we mandate multi-factor authentication
    and rigorous identity verification before any state-changing action is performed.
    If you receive a request to change your policy details that did not originate
    from you, or if you are asked to bypass our security protocols, this is a significant
    red flag.


    If you suspect you have been targeted by a scam or have encountered an unusual
    request, you should inform us immediately. We will then initiate our internal
    security protocols to secure your account. For further details on our general
    security approach, you may refer to Kingsmere Home Insurance — fraud and unauthorized-activity
    protection.'
