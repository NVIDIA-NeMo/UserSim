- id: c740cad8-b0ab-592a-8f02-b75e3adaabce
  title: Kingsmere Comprehensive Car Insurance — change-of-terms policy
  body: "This document outlines the terms and conditions governing any modifications\
    \ to your agreement with Kingsmere Insurance regarding your Kingsmere Comprehensive\
    \ Car Insurance policy.\n\nOur commitment to fairness means that renewal prices\
    \ for your home and car insurance will not exceed those offered to equivalent\
    \ new customers. We believe transparency in pricing is fundamental to a trusted\
    \ partnership. Any changes to our standard terms and conditions will be communicated\
    \ to you in writing with a minimum notice period of 30 days before they take effect.\n\
    \nUpon the commencement of a new policy, we provide a statutory cooling-off period\
    \ of 14 days. During this window, you may cancel your policy and receive a pro-rata\
    \ refund of your premium, subject to any claims made during that period. This\
    \ allows you to ensure our comprehensive cover options align with your specific\
    \ needs before fully committing to the agreement.\n\nPremiums are risk-based to\
    \ ensure the sustainable delivery of claims and fair pricing for all policyholders.\
    \ Consequently, we reserve the right to adjust premiums mid-term if there is a\
    \ material change in the risk profile of the vehicle or driver, such as a change\
    \ in the primary place of garaging or the addition of a high-risk named driver.\
    \ Any such adjustment will be calculated transparently and communicated before\
    \ the change is applied.\n\nAdministrative fees are applied to maintain our operational\
    \ quality. While these are standard, we may waive them for customers who have\
    \ attained specific long-term loyalty tiers, as a reward for their continued partnership.\
    \ \n\nIf you disagree with a change in terms or a price adjustment, you have the\
    \ right to raise a formal complaint. If a resolution is not reached through our\
    \ structured escalation path—from front-line agents to senior operations leads—you\
    \ are always informed of your right to take the dispute to the free Financial\
    \ Ombudsman Service.\n\nOur obligations are underpinned by the FSCS, which covers\
    \ 90% of most general insurance claims, providing an additional layer of security\
    \ for your household protection."
  domain: insurance
  product_category: car_insurance
