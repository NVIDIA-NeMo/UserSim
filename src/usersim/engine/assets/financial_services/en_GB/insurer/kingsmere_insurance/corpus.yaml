- id: 24af39f2-d06c-5132-be57-999d27564eea
  title: Kingsmere Level Term Life Insurance — recognizing scams targeting this product
  body: 'As you evaluate your options for long-term financial security, it is important
    to remain vigilant against fraudulent activities. Scammers often target individuals
    seeking life insurance by promising ''guaranteed'' low premiums or immediate payouts
    that deviate from standard industry risk-based pricing. We wish to ensure our
    customers can distinguish between a legitimate partnership with us and a fraudulent
    attempt.


    Common red flags include unsolicited calls or emails claiming that your policy
    is overdue for a critical update or that you are eligible for a ''special'' payout
    without any claim being filed. Be wary of any party requesting your full password,
    PIN, or multi-factor authentication codes over the phone or via email. We will
    never ask for these credentials to verify your identity.


    Another common tactic involves ''spoofing'', where a caller appears to be from
    Kingsmere Insurance but pressures you to move funds or provide sensitive personal
    data quickly to avoid a policy lapse. Remember that our professional voice is
    reassuring and transparent; we will never use high-pressure tactics to force a
    decision.


    If you encounter a suspicious request, the first action you must take is to terminate
    the communication and report the incident to us immediately. Prompt reporting
    is essential to protect your account and your data. While we provide robust protection,
    you should also be aware that the Financial Services Compensation Scheme (FSCS)
    covers 100% of life insurance claims, providing an additional layer of security
    for your beneficiaries.


    ***


    DISCLAIMER: Kingsmere Insurance provides educational guidance and product recommendations
    but does not offer individualised tax or legal advice. For specific legal arrangements
    regarding trust policies, we recommend consulting a qualified professional.'
  domain: insurance
  product_category: life_insurance
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 542b8250-ff47-51ed-92bb-69ab59a42572
  title: Kingsmere Level Term Life Insurance — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational limits and restrictions associated with Kingsmere Level Term Life
    Insurance.


    **Coverage Parameters**

    Our level term product provides a fixed-sum payout throughout the duration of
    the policy. For example, a policyholder may have a cover amount of £200,000 for
    a term of 25 years. The ''level'' nature of the product means the payout remains
    constant, regardless of the date of the claim, provided it occurs within the term
    years.


    **The Cooling-off Period**

    Unlike our general insurance products, life insurance carries a statutory cooling-off
    period of 30 days. During this window, customers may cancel their policy and receive
    a refund of premiums paid.


    **Trust and Payouts**

    To ensure efficient beneficiary payouts and avoid the delays of probate, we strongly
    encourage policies to be ''Written in Trust''. This is a legal arrangement where
    trustees hold the policy. Agents must verify if a policy is held in trust before
    discussing beneficiary changes to ensure compliance with the legal structure.


    **FSCS Protection**

    In the event of institutional failure, the FSCS provides 100% protection for life
    insurance claims. This should be highlighted to customers who express concern
    over long-term reliability.


    **Restrictions on Modifications**

    Any state-changing action, such as updating the cover amount or changing the term
    length, requires mandatory multi-factor authentication and rigorous identity verification.
    No amendments may be made to the policy without these security checks being successfully
    completed.


    ***


    DISCLAIMER: We provide educational guidance on coverage options but do not offer
    individualised tax or legal advice.'
  domain: insurance
  product_category: life_insurance
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: de8e9e75-1f03-52d7-9d7f-332413c6ea8a
  title: Kingsmere Level Term Life Insurance — cost and charges
  body: '**How are my premiums calculated?**

    Our premiums are risk-based, meaning they are tailored to your specific circumstances
    to ensure fair pricing for all policyholders and the sustainable delivery of claims.
    For illustrative purposes, a customer might have a monthly premium of £12, depending
    on their risk profile.


    **Are there any additional fees?**

    Yes, administrative fees are applied to maintain the high operational quality
    of our service. These fees are applied transparently and are detailed at the start
    of your policy. Please note that these may be waived for customers within our
    long-term loyalty tiers.


    **Does the price increase at renewal?**

    We pride ourselves on the fairness of our renewal pricing. We ensure that renewal
    prices for our insurance products do not exceed those offered to equivalent new
    customers.


    For more information on our general pricing philosophy, you may refer to Institution-wide
    fees and charges.'
  domain: insurance
