  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 470023f1-140d-5a68-a82f-3c684aeac40a
  title: Kingsmere Home Insurance — choosing between tiers or options
  body: 'When deciding on the right level of protection for your home, it is important
    to weigh the breadth of cover against your specific needs. We offer options ranging
    from basic protection to our premium comprehensive cover.


    **Comprehensive Option**

    This is our most robust offering, designed for those who value long-term reliability
    and maximum protection. It includes:

    - A high buildings cover limit of £1,000,000.

    - A substantial contents cover limit of £75,000.

    - Inclusion of accidental damage and comprehensive escape-of-water provisions.

    - An example annual premium of £340 (depending on your risk profile).


    **Basic Option**

    Our basic tier is suited for those with lower-value assets or who only require
    protection for the structure of the home. While the premiums are lower, the limits
    for contents are significantly reduced, and certain accidental damage features
    may be excluded.


    **Which one should you choose?**

    If you own a high-value property or have significant personal belongings, our
    Comprehensive option is the better choice, providing peace of mind through higher
    limits. If you are looking for essential, cost-effective cover, the Basic option
    may be more appropriate.


    ***


    Disclaimer: Regardless of the tier chosen, all policies are subject to the standard
    excess of £100 and a specific escape-of-water excess of £350.'
  domain: insurance
  product_category: home_insurance
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: e2f7e9b6-341d-53ee-8972-6f688a73773a
  title: Kingsmere Home Insurance — privacy and data handling
  body: 'Kingsmere Insurance is committed to the highest standards of data privacy
    and regulatory compliance. This disclosure explains how we handle your information
    and the protections in place for your policy.


    **Identity Verification and Security**

    To ensure that only verified policyholders can modify coverage, add named drivers,
    or access sensitive personal data, we mandate the use of multi-factor authentication
    (MFA) and rigorous identity verification. This applies to all state-changing actions,
    including adjustments to your £1,000,000 buildings limit or your £75,000 contents
    limit.


    **Regulatory Adherence**

    We adhere strictly to the regulations set forth by the Financial Conduct Authority
    (FCA) and the Prudential Regulation Authority (PRA). All our data handling processes
    are designed to meet these standards and protect your privacy.


    **Financial Protection**

    Your protection with us is underpinned by the Financial Services Compensation
    Scheme (FSCS). For general insurance products, such as Kingsmere Home Insurance,
    the FSCS covers 90% of most claims if the insurer were unable to meet its obligations.
    This provides an essential layer of security for your home and assets.


    **Data Access**

    Your policy documents and personal data are accessible exclusively through our
    secure web portal and via verified telephone requests during UK business hours
    (GMT). We do not share your personal data with third parties except where required
    by law or to facilitate the delivery of your insurance services.


    ***


    Disclaimer: We provide educational guidance and product recommendations, but we
    do not offer individualised tax or legal advice. For such matters, please consult
    a qualified professional.'
  domain: insurance
  product_category: home_insurance
  document_type: disclosure
