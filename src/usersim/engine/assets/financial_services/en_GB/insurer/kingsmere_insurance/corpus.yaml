- id: a905e2ad-e1a1-5f59-a0c9-f18305e83efd
  title: Kingsmere Comprehensive Car Insurance — set up and activate
  body: 'Setting up your Kingsmere Comprehensive Car Insurance is a straightforward
    process designed to get you on the road with full protection as quickly as possible.
    To begin, please ensure you have your vehicle registration document (V5C), a valid
    UK driving licence, and your current No Claims Discount (NCD) proof ready.


    1. **Provide Vehicle and Driver Details**: Tell us about the car you wish to insure
    and the details of any named drivers you wish to add. We will use this information
    to calculate your risk-based premium.


    2. **Identity Verification**: To maintain the security of our services, we will
    perform a rigorous identity verification. You will be asked to provide personal
    details and complete multi-factor authentication to ensure that you are the authorised
    policyholder.


    3. **Select Cover Options**: We will discuss the comprehensive options available
    to you. At this stage, you can decide if you wish to add No Claims Discount protection
    for a cost of £45 to preserve your discount in the event of a claim.


    4. **Review Premium and Excess**: We will present your tailored premium (for example,
    a typical annual premium may be £640) and confirm the compulsory excess of £250
    that applies to your policy.


    5. **Confirm and Pay**: Once you are happy with the terms, we will process your
    payment. We will then provide you with your policy documents and confirmation
    that your cover is active.


    Following these steps, you will receive a digital confirmation of your insurance.
    If you need to make changes to your policy later, such as adding a driver, you
    can simply ask us to handle this for you during business hours. You will know
    the activation is successful when you receive your policy schedule and certificate
    of insurance.'
  domain: insurance
  product_category: car_insurance
  document_type: how_to_guide
  source_authority: official
