- id: 34ec59f7-1cf0-52eb-a5b1-8e630c36f986
  title: Kingsmere Lifetime Pet Insurance — how rates are tiered and applied
  body: 'This document explains the application of premiums and fees for Kingsmere
    Lifetime Pet Insurance. It is intended for use by support agents when explaining
    costs to policyholders.


    Premium Structure

    We do not use a flat-rate pricing model. Instead, premiums are risk-based. This
    means the cost is tailored to the specific risk profile of the pet and owner.
    While we often cite an example monthly premium of £32 for illustrative purposes,
    the actual rate applied depends on the individual underwriting result.


    Administrative Fees

    To maintain operational quality, administrative fees are applied to the account.
    These are listed transparently in our fee schedule. However, we reward long-term
    reliability; administrative fees may be waived for policyholders who reach specific
    long-term loyalty tiers.


    Renewal Pricing

    We compete on the fairness of our renewal pricing. We ensure that renewal prices
    for our insurance products do not exceed those offered to equivalent new customers,
    preventing ''loyalty penalties''.


    For the specific list of all applicable charges, please refer to Kingsmere Lifetime
    Pet Insurance — fee schedule.'
  domain: insurance
  product_category: pet_insurance
  document_type: rate_sheet
  source_authority: official
