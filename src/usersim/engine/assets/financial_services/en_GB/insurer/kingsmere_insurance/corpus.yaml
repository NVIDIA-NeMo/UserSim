- id: 1c1195f7-c897-5558-9564-e836b533c656
  title: Kingsmere Home Insurance — a failed or pending action
  body: 'It can be frustrating when your application or a policy amendment appears
    as ''pending'' or fails to complete. At Kingsmere Insurance, we employ rigorous
    security measures to protect your data, which can sometimes lead to these interruptions.


    **Symptom: Application or Amendment is ''Pending''**


    **Likely Causes**

    - **Incomplete Identity Verification**: The most common cause is a failure to
    complete the mandatory multi-factor authentication (MFA) process.

    - **Verification Mismatch**: The identity documents provided do not exactly match
    the personal details on the application.

    - **Missing Property Data**: Certain risk-based details required for the quote
    may be incomplete, preventing the policy from moving to ''active'' status.


    **What to check and how to fix it**

    1. **Check your MFA status**: Ensure you have responded to the multi-factor authentication
    prompt. If you have not received the prompt, tell us and we will re-trigger it
    for you.

    2. **Verify Identification**: Check that the name and address on your identification
    documents match your application exactly. If there is a discrepancy, provide us
    with the correct documentation.

    3. **Confirm Property Details**: Tell us if any requested information about your
    home was omitted. We will update the record and re-run the risk assessment.


    **When to Escalate**

    If you have completed all verification steps and your action remains pending for
    more than three business days, we will escalate the matter. Your case will be
    routed from the front-line agent to a senior operations lead to ensure a prompt
    resolution. You will be notified once the senior lead has manually reviewed and
    approved the state-change of your policy.'
  domain: insurance
  product_category: home_insurance
  document_type: troubleshooting
  source_authority: official
