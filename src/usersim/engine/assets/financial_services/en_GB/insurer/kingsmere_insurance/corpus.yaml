  title: Kingsmere Lifetime Pet Insurance — required documentation
  body: 'To ensure a fair and transparent underwriting process, we require specific
    documentation before a policy for Kingsmere Lifetime Pet Insurance can be activated.
    The following matrix outlines the required documents based on the customer''s
    situation:


    | Situation | Required Documentation | Outcome |

    | :--- | :--- | :--- |

    | New Pet (Kitten/Puppy) | Proof of purchase/breeding certificate and initial
    vet check record | Policy Activation |

    | Adult Pet (New to Kingsmere) | Complete veterinary medical history (last 2 years)
    and proof of ownership | Underwriting Review |

    | Policy Renewal | Updated vet records (if requested) and verified current address
    | Renewal Offer |

    | Adding a New Pet to Policy | Proof of ownership and full medical history for
    the additional pet | Policy Amendment |


    All documents must be submitted via our secure web portal. We cannot accept sensitive
    medical records via standard email for security reasons. For assistance with the
    setup process, see Kingsmere Lifetime Pet Insurance — set up and activate.'
