- id: 8cc2ad29-82f3-501f-9a1a-1bb74c5a015f
  title: Kingsmere Home Insurance — risk disclosures
  body: 'Kingsmere Insurance provides this disclosure to ensure all prospective and
    existing policyholders understand the nature of our insurance products and the
    regulatory framework under which we operate.


    Risk-Based Pricing

    Please be advised that all premiums for Kingsmere Home Insurance are risk-based.
    This means the cost of your insurance is determined by the specific risk profile
    of your property and circumstances. Consequently, premiums are subject to change
    at renewal to ensure the sustainable delivery of claims for all policyholders.
    An example annual premium may be £340, but this is illustrative and not a guarantee
    of cost.


    Claim Outcomes

    While we strive to handle all claims promptly and fairly, Kingsmere Insurance
    never promises a specific outcome for any claim. Each claim is assessed individually
    against the policy terms, including the application of the £100 standard excess
    or the £350 escape-of-water excess.


    Regulatory Protections and Limits

    We adhere strictly to FCA and PRA regulations. All general insurance policies,
    including this home insurance product, are underpinned by the Financial Services
    Compensation Scheme (FSCS), which covers 90% of most general insurance claims
    should the insurer become unable to pay. This is distinct from life insurance,
    which is covered at 100%.


    Dispute Resolution

    If a resolution to a complaint is not reached through our structured escalation
    path to senior operations leads, customers are always informed of their right
    to take their dispute to the free Financial Ombudsman Service.


    ***


    DISCLAIMER: Kingsmere Insurance provides educational guidance and product recommendations
    based on a high standard of care, but we do not offer individualised tax or legal
    advice.'
  domain: insurance
  product_category: home_insurance
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: d1af9413-a395-5c20-929b-0ffc49899d20
  title: Kingsmere Home Insurance — how rates are tiered and applied
  body: 'Kingsmere Home Insurance does not use a flat-rate pricing structure. Instead,
    we employ a risk-based pricing model to ensure that each policyholder pays a fair
    premium relative to their level of risk.


    Premium Application:

    - Risk Assessment: Rates are calculated based on property value, location, and
    claims history. For illustrative purposes, a typical risk profile might result
    in an annual premium of £340.

    - Renewal Fairness: We ensure that renewal rates for home insurance do not exceed
    those offered to equivalent new customers, preventing unfair pricing for loyal
    clients.


    Fees and Adjustments:

    - Administrative Fees: Transparent fees are applied to maintain our operational
    quality. These are disclosed at the point of sale and at renewal.

    - Loyalty Tiers: For customers in our long-term loyalty tiers, administrative
    fees may be waived entirely as a reward for their continued partnership.

    - Cover Adjustments: Any increase in coverage—such as raising the contents cover
    limit toward the £75,000 maximum—will result in a risk-based recalculation of
    the premium.'
  domain: insurance
  product_category: home_insurance
  document_type: rate_sheet
  source_authority: official
