- id: 8aa23d6b-1d43-5cdb-b086-1344d765e52f
  title: Kingsmere Comprehensive Car Insurance — a failed or pending action
  body: 'It can be frustrating when a policy amendment or application does not complete
    as expected. Most failed or pending actions regarding your Kingsmere Comprehensive
    Car Insurance are caused by verification interruptions or missing documentation.


    **Common Symptoms**

    You may find that your policy status remains ''Pending'', or you might receive
    a notification that a change—such as adding a named driver or updating your address—could
    not be processed.


    **What to Check and How to Fix**

    1. **Identity Verification Status**: Since we require multi-factor authentication
    and rigorous identity verification for all state-changing actions, check if you
    have successfully completed the verification prompt. If the prompt timed out,
    simply ask us to restart the verification process.

    2. **Documentation Accuracy**: Ensure that the details provided for the vehicle
    or driver match the official records. Even a small typo in a registration number
    can cause an automated check to fail.

    3. **Payment Status**: If you are activating a new policy, confirm that the payment
    for the premium (e.g., £640 in our example) was successfully authorised by your
    bank.


    **When to Escalate**

    If you have verified your identity and provided accurate details, but the action
    still shows as ''Failed'' or ''Pending'' after 24 hours, we will escalate the
    matter. We will route your case from the front-line agent to a senior operations
    lead to investigate the blockage.


    Once escalated, you can expect a resolution or a detailed status update within
    two UK business days. We will notify you via your preferred contact method as
    soon as the action has been successfully processed and your policy has been updated.'
  domain: insurance
  product_category: car_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: 525dc793-7af2-5592-a1fd-9a4ded8907e7
  title: Kingsmere Comprehensive Car Insurance — eligibility requirements
  body: 'To ensure the sustainable delivery of claims and fair pricing, we apply the
    following eligibility criteria for Kingsmere Comprehensive Car Insurance:


    | Condition | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Residency | Must be a legal resident of the UK | Eligible for cover |

    | Licensing | Must hold a valid UK driving licence | Eligible for cover |

    | Vehicle Registration | Vehicle must be registered within the UK | Eligible for
    cover |

    | Identity | Must pass multi-factor authentication | Policy can be activated |

    | Documentation | Must provide proof of No Claims Discount (if claiming a discount)
    | Discount applied to premium |

    | Age/Risk Profile | Must meet minimum age requirements for comprehensive cover
    | Eligible for risk-based pricing |


    Failure to meet identity verification requirements will result in the application
    remaining in a ''Pending'' state until verified.'
  domain: insurance
