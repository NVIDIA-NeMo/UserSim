- id: 9be6e109-8abd-5909-bf15-463991859296
  title: Kingsmere Comprehensive Car Insurance — a declined or blocked action
  body: 'When comparing insurance providers, you may find that we maintain stricter
    security protocols to protect your assets. Occasionally, this means a requested
    action—such as updating a driver or changing coverage—may be declined or blocked.


    **Common Symptoms**

    - You are informed that a policy amendment cannot be processed at this time.

    - A request to change a named driver is blocked.

    - Access to specific policy data is denied.


    **Likely Causes**

    - Verification Failure: The most common cause is a failure in the identity verification
    process. If multi-factor authentication (MFA) is not completed successfully, the
    action will be automatically blocked.

    - Incomplete Information: The request may be declined if mandatory risk-based
    data is missing, preventing us from calculating a fair premium.

    - Regulatory Holds: Certain actions may be blocked if they conflict with FCA guidelines
    or if there is a pending claim investigation.


    **How to Resolve**

    1. Re-verify Identity: If the block is due to verification, please restart the
    process. Ensure you are using the correct MFA device and that your identity details
    match our records exactly.

    2. Provide Missing Details: If the action was declined due to missing information,
    provide the necessary vehicle or driver details so we can assess the risk and
    update the premium.

    3. Request a Review: If you believe the block is an error, ask us to route your
    request to a senior operations lead for a manual review.


    **When to Escalate**

    If a block persists after successful MFA and the provision of all requested data,
    we will raise a formal case with our operations team. You will receive a reference
    number and a response within our standard business hours (GMT).'
  domain: insurance
  product_category: car_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
