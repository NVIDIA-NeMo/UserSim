- id: f3f9e570-4993-5128-8120-070cfe42857e
  title: Kingsmere Comprehensive Car Insurance — access or login problems
  body: 'If you are experiencing difficulties accessing your Kingsmere secure web
    portal, please review the following troubleshooting steps to resolve the issue.


    Symptom: ''Invalid Credentials'' or ''Login Failed'' message.

    Likely Cause: Incorrect username or password, or a keyboard input error (such
    as Caps Lock being active).

    What to check:

    1. Verify that your email address is entered exactly as provided during the application
    process.

    2. Ensure Caps Lock is off and you are using the correct case for your password.

    3. If the problem persists, ask us to initiate a secure password reset. We will
    verify your identity before sending a reset link to your registered email.


    Symptom: MFA code not received or ''Invalid Code'' error.

    Likely Cause: Network delay in SMS delivery, or the code was entered after the
    expiration window.

    What to check:

    1. Wait 60 seconds for the network to deliver the code. Do not request multiple
    codes in rapid succession, as this may invalidate the previous ones.

    2. Ensure you are entering the most recent code received.

    3. Check that your mobile device has a stable signal.


    Symptom: ''Account Locked'' message.

    Likely Cause: Too many unsuccessful login attempts, triggering our security protocols
    to prevent unauthorised access.

    What to check:

    1. This is a security feature to protect your sensitive personal data and policy
    details.

    2. You must undergo a rigorous identity verification process with us to unlock
    the account.

    3. Once we have verified your identity via our security questions, we will manually
    unlock your access.


    If these steps do not resolve the issue, we will escalate the matter to our senior
    operations leads to investigate potential technical faults with your portal access.
    You will be notified via telephone once the resolution is confirmed.'
  domain: insurance
  product_category: car_insurance
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kingsmere_insurance
- id: a35fcf65-32ee-5cb7-96e9-895fc67a6ce6
  title: Kingsmere Comprehensive Car Insurance — qualification tiers
  body: 'Use the following matrix to determine the loyalty tier of a customer and
    the associated benefits regarding administrative fees.


    | Requirement | Tier Status | Outcome / Benefit |

    | :--- | :--- | :--- |

    | Policy held for < 2 years | Standard | Full administrative fees apply to all
    policy amendments. |

    | Policy held for 2–5 years | Silver Loyalty | 50% reduction in administrative
    fees for policy updates. |

    | Policy held for 5+ years | Gold Loyalty | Administrative fees may be waived
    entirely for policy updates. |

    | Any tier + NCD Protection (£45) | Protected | Retains NCD status after a claim,
    regardless of loyalty tier. |


    Agents must verify the policy start date and the presence of the £45 NCD protection
    add-on before applying any fee waivers. All risk-based premiums, such as the annual
    premium example of £640, remain subject to standard underwriting regardless of
    loyalty tier.'
