- id: bef9e77c-8313-536c-9151-ce4a628cb513
  title: '장기카드대출(카드론): 가입 대상'
  body: '장기카드대출(카드론) 이용 가능 여부를 결정하는 기준입니다.


    - 여울 신용카드 보유 여부: 필수 보유 (미보유 시 가입 불가)

    - 신용 점수: 당사 내부 심사 기준 충족 시 가능

    - 총부채원리금상환비율(DSR): 연간 원리금 상환액이 연소득의 50% 이내일 것 (초과 시 한도 제한 또는 거절)

    - 법적 제한: 연체 중이거나 금융 질서 문란자로 등록된 경우 이용 불가'
