- id: a00525f8-298e-512c-820d-3984144bccda
  title: '장기카드대출(카드론): 한도·제한과 유의사항'
  body: '장기카드대출(카드론) 상품의 한도 설정 및 이용 제한과 관련된 핵심 유의사항입니다. 상담 시 고객 안내를 위해 다음 내용을 정확히
    숙지하십시오.


    1. 이용한도 최고액

    본 상품의 이용한도 최고액은 50,000,000원입니다. 다만, 실제 부여되는 한도는 고객님의 신용 상태, 상환 능력 및 당사 심사 기준에
    따라 차등 적용됩니다.


    2. DSR(총부채원리금상환비율) 규제 적용

    장기카드대출(카드론)은 대출 상품으로서 DSR 규제 대상에 포함됩니다. 대출 총액이 1억원을 초과하는 차주의 경우, 제2금융권인 카드사 기준
    연간 원리금 상환액이 연소득의 50%를 넘지 않아야 합니다. 한도 계산 시에는 향후 금리 상승 위험을 반영한 스트레스 금리가 적용되어 실제
    한도가 제한될 수 있음을 안내하십시오.


    3. 신용 영향 및 상환 책임

    본 상품의 이용 및 상환 지연은 고객님의 신용점수에 영향을 줄 수 있습니다. 고객님의 상환 능력을 고려한 책임 있는 금융 서비스 제공을 위해,
    상환이 어려울 것으로 예상되는 고객께는 이른 상담과 채무조정 제도를 안내해 주시기 바랍니다.'
