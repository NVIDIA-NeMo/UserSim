  institution_id: yeoul_card
- id: a1abf44b-1c3c-56ab-ba08-589489ef4602
  title: '할부: 위험 안내'
  body: '할부 서비스 이용 전, 고객님께서 반드시 인지하셔야 할 위험 요소를 안내드립니다.


    1. **이자 비용의 누적**: 할부는 결제 금액을 나누어 내는 편리함이 있지만, 이용 기간에 따라 할부수수료가 부과됩니다. 특히 연 19.9%의
    상한 수수료율이 적용될 경우, 장기 이용 시 총 상환액이 원금보다 크게 증가할 수 있으므로 주의하시기 바랍니다.


    2. **신용 점수 영향**: 과도한 할부 이용은 월 상환 부담을 높이며, 만약 결제일에 대금을 납부하지 못해 연체가 발생할 경우 신용 점수가
    하락할 수 있습니다. 이는 향후 다른 금융 거래 시 불이익으로 작용할 수 있습니다.


    3. **소비 습관의 변화**: 할부 결제는 당장의 지출 부담을 낮추어 필요 이상의 과소비를 유도할 수 있습니다. 본인의 상환 능력 범위 내에서
    책임 있는 금융 서비스를 이용하시길 권고드립니다.


    여울카드는 금융소비자 보호에 관한 법률을 준수하며, 고객님의 신용 상태를 고려한 책임 있는 금융 서비스를 제공하기 위해 노력하고 있습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: a9dbaac9-c6e0-5427-86c0-c71d2d349cb6
  title: '할부: 금리·요율이 정해지는 방식과 적용'
  body: '여울카드 할부 서비스의 수수료율 산정 방식과 적용 기준은 다음과 같습니다.


    **1. 적용 수수료율 범위**

    - 할부수수료율(연, 하한): 9.9%

    - 할부수수료율(연, 상한): 19.9%


    **2. 요율 결정 방식**

    수수료율은 고객님의 개인 신용등급, 과거 결제 이력, 현재 부채 수준 및 당사의 리스크 관리 정책을 종합적으로 평가하여 결정됩니다. 신용 상태가
    우수한 고객일수록 하한선인 9.9%에 가까운 요율을 적용받게 됩니다.


    **3. 요율의 변동 및 적용**

    - **적용 시점**: 할부 결제 시점의 신용도에 따라 요율이 확정되며, 해당 거래 기간 동안 유지됩니다.

    - **요율 변경**: 취업, 승진, 또는 신용점수 상승 등 신용 상태가 개선된 경우 ''금리인하요구권''을 통해 수수료율 인하를 요청하실
    수 있습니다.

    - **특이 사항**: 가맹점 무이자 할부 행사 상품의 경우, 해당 기간 동안 수수료율 0%가 적용됩니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 6461b5ff-d194-519a-9569-2564586d4ab2
  title: '할부: 추천·장기 이용 혜택'
  body: '여울카드를 아껴주시는 고객님을 위해 특별한 혜택을 준비했습니다. 2026년 3월 1일부터 2026년 3월 31일까지, 할부 서비스를
    처음 이용하시거나 장기 이용 고객 중 선정된 우수 고객님께는 일정 조건 충족 시 할부수수료 감면 혜택을 제공해 드립니다.


    스마트한 소비의 시작, 여울카드의 할부 서비스와 함께 경제적 부담을 낮추고 소비의 가치를 높여 보십시오. 자세한 감면 조건은 상담원을 통해
    확인하실 수 있습니다.'
  domain: payments
