- id: 3ccf011a-5a89-5acb-bf2e-78a73b7c606a
  title: '단기카드대출(현금서비스): 현금서비스 금리(연) 안내'
  body: 'Q: 단기카드대출(현금서비스) 이용 시 적용되는 금리는 얼마입니까?

    A: 단기카드대출(현금서비스)의 현금서비스 금리(연)는 18.2%입니다. 이는 연이율 기준이며, 실제 고객님이 부담하시는 금액은 이용 일수에
    따라 일할 계산되어 청구됩니다.


    Q: 금리가 변동될 가능성이 있습니까?

    A: 네, 고객님의 신용 상태나 당사의 금리 정책 변경에 따라 변동될 수 있습니다. 특히 취업, 승진, 신용점수 상승 등으로 신용 상태가 개선된
    경우, ''금리인하요구권''을 통해 금리 인하를 요청하실 수 있습니다.


    더 자세한 내용은 ''단기카드대출(현금서비스): 금리·요율 안내''를 참고하십시오.'
