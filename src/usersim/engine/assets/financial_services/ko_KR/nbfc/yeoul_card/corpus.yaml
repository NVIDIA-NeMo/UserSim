  institution_id: yeoul_card
- id: 8e85d1c6-d70f-5ea6-8a8d-5b510ef75451
  title: '장기카드대출(카드론): 자주 하는 업무의 처리 절차'
  body: '장기카드대출(카드론)의 신규 신청 및 실행을 위한 절차입니다.


    1. 본인 확인 및 상담 시작

    고객님의 성함과 생년월일을 통해 본인 인증을 수행하십시오.


    2. 대출 희망 조건 제시

    필요하신 대출 금액과 희망하시는 상환 기간을 말씀해 주십시오. 최대 50,000,000원 한도 내에서 신청 가능합니다.


    3. 신용 심사 및 한도 확인

    당사의 심사 시스템을 통해 고객님의 신용 상태와 DSR(총부채원리금상환비율)을 확인합니다. 이 과정에서 최종 대출 가능 금액과 적용 금리가
    결정됩니다.


    4. 상품 조건 고지 및 동의

    확정된 대출 금리(연 5.9% ~ 19.9% 사이), 총 상환액, 매월 납부하실 원리금을 정확히 안내해 드립니다. 고객님께서 해당 조건에 동의하시면
    계약이 체결됩니다.


    5. 대출금 지급

    동의 절차가 완료되면 지정하신 계좌로 대출금이 즉시 입금됩니다. 입금이 완료되면 안내 메시지를 통해 확인하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: how_to_guide
  source_authority: official
