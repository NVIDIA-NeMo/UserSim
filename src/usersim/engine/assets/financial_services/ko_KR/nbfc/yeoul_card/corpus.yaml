- id: 751a6656-c92a-5e06-906a-c7f8a5b600a8
  title: '장기카드대출(카드론): 대출 금리(연, 상한) 안내'
  body: '질문: 장기카드대출(카드론)의 최대 금리는 얼마인가요?

    답변: 본 상품의 대출 금리(연, 상한)는 19.9%입니다. 고객님의 신용 점수와 내부 심사 기준에 따라 연 5.9%에서 최대 19.9%까지
    차등 적용됩니다.


    질문: 법정 최고금리를 초과하여 적용될 가능성이 있나요?

    답변: 아니요, 여울카드는 관련 법령을 엄격히 준수합니다. 법정 최고금리는 연 20%이며, 당사의 최고 금리는 19.9%로 설정되어 있어 이를
    초과하지 않습니다. 자세한 내용은 ''장기카드대출(카드론): 금리·요율 안내''에서 확인하십시오.'
