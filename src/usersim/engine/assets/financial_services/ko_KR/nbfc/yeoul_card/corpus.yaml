  title: '장기카드대출(카드론): 필요 서류'
  body: '장기카드대출(카드론) 신청 시 고객님의 상황에 따라 필요한 서류는 다음과 같습니다. 이용한도 최고액 50,000,000원 범위 내
    심사를 위해 제출해 주십시오.


    - 직장인: 건강보험자격득실확인서, 최근 3개월 급여명세서

    - 사업자: 사업자등록증명원, 부가가치세과세표준증명원

    - 프리랜서/기타: 소득금액증명원 또는 최근 6개월 입금 내역이 확인되는 통장 사본

    - 공통 사항: 본인 명의 신분증 (본인 인증 절차 완료 시 생략 가능)


    모든 서류는 최근 3개월 이내 발급분이어야 하며, 심사 결과에 따라 추가 서류를 요청드릴 수 있습니다.'
