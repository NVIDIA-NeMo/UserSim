- id: d1f772ec-dbbc-5286-b830-b43265f9bd76
  title: '리볼빙(일부결제금액이월약정): 로그인하거나 접속할 수 없을 때'
  body: '리볼빙(일부결제금액이월약정) 설정 변경이나 내역 확인을 위해 서비스에 접속하려 할 때, 로그인이 되지 않거나 페이지 접속이 불가능한
    경우 다음과 같이 조치하십시오.


    ■ 예상 증상

    - 로그인 버튼 클릭 시 응답이 없거나 오류 메시지가 표시됨

    - 리볼빙 설정 화면으로 진입하는 도중 페이지가 멈춤

    - 본인 인증 단계에서 다음 화면으로 넘어가지 않음


    ■ 원인 및 점검 순서

    1. 네트워크 상태 확인: 인터넷 연결이 불안정한 경우 접속이 제한될 수 있습니다. Wi-Fi 또는 모바일 데이터를 전환하여 다시 시도하십시오.

    2. 계정 상태 점검: 비밀번호 오류 횟수 초과 등으로 인해 계정이 일시 잠금되었는지 확인하십시오.

    3. 브라우저 및 앱 버전 확인: 최신 버전이 아닌 경우 호환성 문제로 접속이 어려울 수 있습니다. 업데이트를 진행하십시오.


    ■ 해결 방법

    위 조치 후에도 문제가 지속된다면 상담원에게 접속 불가 증상을 말씀하십시오. 상담원이 본인 확인(성함, 생년월일) 후 계정 잠금 해제나 접속
    경로 초기화를 지원해 드립니다.


    ■ 전문 담당자 에스컬레이션

    일반 상담 단계에서 해결되지 않는 시스템 오류의 경우, 전문 IT 지원팀으로 요청이 전달됩니다. 이 경우 접수 후 3영업일 이내에 처리 결과가
    안내됩니다.'
