- id: 8523f503-2907-5a8f-b9ff-35914122fd4b
  title: '단기카드대출(현금서비스): 수수료 안내'
  body: '단기카드대출(현금서비스) 이용 시 발생하는 비용 체계입니다. 모든 비용은 자금 운용 비용과 리스크 관리를 위해 투명하게 책정되었습니다.


    - 현금서비스 금리(연): 18.2%


    위 금리는 대출 원금에 대해 적용되며, 이용 기간만큼 일할 계산되어 부과됩니다. 연체 발생 시에는 약정금리에 최대 3%p를 더한 연체이자가
    적용되나, 법정 최고금리인 연 20%를 초과할 수 없습니다. 특정 프로모션 조건 충족 시 수수료 감면 혜택이 적용될 수 있으니 해당 조건을
    확인하시기 바랍니다.'
