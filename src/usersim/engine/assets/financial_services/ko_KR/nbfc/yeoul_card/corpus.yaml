- id: 0f9fc215-0a7e-5904-84d3-ac8b5215824b
  title: close_account 사용 기준
  body: '카드 해지를 요청하는 고객의 경우, 다음의 절차에 따라 신중하게 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 완료합니다.

    2. `get_accounts` 도구를 통해 해지 대상이 되는 `account_id` 및 연결된 `card_id`를 확인합니다.

    3. 현재 남아 있는 잔액(리볼빙 이월금, 할부 잔액, 장기카드대출(카드론) 원리금 등)을 고객에게 상세히 안내합니다.

    4. 카드를 해지하더라도 기존에 발생한 리볼빙, 할부, 장기카드대출(카드론) 잔액은 해지 후에도 계속 상환해야 한다는 점을 반드시 고지하십시오.

    5. 고객의 최종 해지 의사를 확인한 후, `close_account` 도구를 호출하여 해지 처리를 완료합니다.


    해지 절차 및 주의사항에 대한 더 자세한 내용은 ''여울 신용카드: 해지·변경·상품 전환''에서 확인할 수 있습니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: yeoul_card
- id: fa987ed2-fded-56a0-a17e-d77c50332f76
  title: close_account 도구 설명서
  body: "도구 이름: `close_account` \n설명: 고객의 카드 계좌를 완전히 해지합니다.\n\n매개변수:\n- `account_id`:\
    \ 해지하고자 하는 계좌의 고유 식별자입니다. `get_accounts`를 통해 확인합니다.\n\n실행 방식: 상담원이 본인 인증을 완료하고\
    \ 미결제 잔액 상환 의무에 대해 고지한 후, 고객의 동의를 얻어 직접 도구를 호출합니다. 본 작업은 실행 후 되돌릴 수 없는 불가역적 작업입니다."
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
