- id: 81e453fc-cb48-553c-9c22-f2a6949f532f
  title: '리볼빙(일부결제금액이월약정): 등록 정보 변경'
  body: '리볼빙(일부결제금액이월약정) 서비스의 결제 비율이나 연락처 등 등록 정보를 변경하는 절차를 안내해 드립니다.


