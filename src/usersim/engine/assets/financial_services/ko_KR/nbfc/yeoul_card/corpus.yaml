- id: 4959d767-d89a-5923-9b81-b9375fe3c9d6
  title: '장기카드대출(카드론): 약관 변경 안내'
  body: '장기카드대출(카드론) 이용 고객님께 안내드립니다. 금융소비자 보호에 관한 법률 및 내부 운영 정책에 따라 다음과 같이 약관이 변경되었습니다.


    1. 금리 및 수수료 체계

    - 대출 금리(연, 하한): 5.9%

    - 대출 금리(연, 상한): 19.9%

    - 중도상환수수료율: 0% (기간에 관계없이 면제)


    2. 청약 철회권 안내

    고객님께서는 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회하실 수 있습니다. 이 경우 원금과 이용 기간의
    이자, 인지세 등 제3자에게 지불한 비용만 상환하시면 되며, 중도상환수수료는 부과되지 않습니다.


    3. 상환 및 연체

    법정 최고금리는 연 20%이며, 연체이자는 약정금리에 최대 3%p를 더한 수준을 넘지 않으며 최대 연 20% 이내에서 적용됩니다.


    4. 금리인하요구권

    취업, 승진, 신용점수 상승 등 신용 상태가 개선된 경우 금리 인하를 요청하실 수 있습니다.


    본 변경 사항은 고지된 시행일부터 적용되며, 변경 내용에 동의하지 않으시는 경우 계약 해지를 요청하실 수 있습니다.'
