    - 포인트 적립률: 기본 0.7%가 적용됩니다. 이 요율은 가맹점과의 제휴 및 당사의 혜택 정책에 따라 결정되며, 대부분의 일반 결제 건에
    대해 동일하게 적용됩니다.

    - 이용한도 결정: 이용한도 최고액은 20,000,000원이며, 개별 고객의 한도는 DSR(총부채원리금상환비율) 규제와 내부 신용 평가 모델을
    통해 산정됩니다. 신용 상태가 개선된 고객님은 금리인하요구권을 통해 관련 대출 상품의 금리 인하를 요청하실 수 있습니다.'
