    \n매개변수:\n- `account_id`: 상환 대상이 되는 대출 계좌의 고유 식별자입니다. `get_accounts` 도구를 통해 확인\
    \ 가능합니다.\n\n실행 방식: 상담원이 고객의 본인 인증을 완료한 후, 고객의 상환 의사를 확인하여 직접 도구를 호출합니다. 본 작업은\
    \ 취소가 불가능한 불가역적 작업입니다."
