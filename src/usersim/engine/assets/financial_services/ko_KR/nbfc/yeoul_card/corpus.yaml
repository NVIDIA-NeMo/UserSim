- id: f5a0ba60-6b6e-517d-9e9e-9f44f34bab5f
  title: '리볼빙(일부결제금액이월약정): 약관'
  body: '본 약관은 리볼빙(일부결제금액이월약정) 서비스의 이용 조건과 당사 및 고객의 권리와 의무를 규정합니다. 여울카드는 여신전문금융업법
    및 금융소비자 보호에 관한 법률을 엄격히 준수합니다.


    1. 서비스의 정의: 고객은 결제 금액의 일부만 납부하고 나머지를 다음 달로 이월할 수 있으며, 이월된 금액에 대해 리볼빙 수수료율(연) 16.5%의
    수수료가 부과됩니다.

    2. 결제 의무: 고객은 매월 결제일에 리볼빙 최소결제비율 10% 이상의 금액을 반드시 납부해야 합니다. 최소결제비율 미만으로 납부할 경우
    약정 위반으로 간주되어 서비스 이용이 제한될 수 있으며, 연체 이자가 발생할 수 있습니다.

    3. 수수료 및 비용: 이월된 원금에 대해 연 16.5%의 수수료가 일할 계산되어 부과됩니다. 수수료 체계는 투명하게 공개되며, 당사는 자금
    운용 비용과 리스크 관리를 위해 이를 책정합니다.

    4. 계약의 해지: 고객은 언제든지 서비스를 해지할 수 있습니다. 단, 해지 시점까지 이월된 잔액과 발생한 수수료는 즉시 또는 정해진 일정에
    따라 전액 상환하셔야 합니다.

    5. 약관의 변경: 당사는 관련 법령의 변경이나 경영 환경의 변화에 따라 약관을 변경할 수 있으며, 변경 사항은 고지 기간 내에 고객에게 명확히
    안내하겠습니다.'
