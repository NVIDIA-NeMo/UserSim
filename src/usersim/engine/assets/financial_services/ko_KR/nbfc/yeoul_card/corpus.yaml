  mentions_tools: []
  institution_id: yeoul_card
- id: 896bd6d2-2db7-52a5-9029-b33cf10e92ac
  title: '여울 신용카드: 예상과 다른 수수료나 금액'
  body: '고객님께서 청구 금액이나 수수료가 예상과 다르다고 말씀하시는 경우, 상담원은 다음 순서에 따라 원인을 파악하고 조치하십시오.


    1. 증상 확인: 고객님이 구체적으로 어떤 항목(예: 청구 금액, 포인트 적립액 등)에서 차이를 느끼시는지 확인합니다.


    2. 주요 원인 점검:

    - 연회비 청구 여부: 연회비 15,000원이 정기적으로 청구되는 시점인지 확인하십시오.

    - 포인트 적립 제외 항목: 이용하신 가맹점이 0.7% 적립 대상에서 제외되는 곳인지 확인하십시오.

    - 한도 초과 수수료: 이용한도 최고액인 20,000,000원을 초과하여 이용하셨거나, 한도 설정 변경 과정에서 수수료가 발생했는지 확인하십시오.


    3. 해결 방법: 확인된 원인을 고객님께 정중히 설명해 드리고, 오청구인 경우 즉시 정정 절차를 밟습니다.


    4. 에스컬레이션: 원인이 불분명하거나 고객님께서 납득하지 못하시는 복잡한 민원의 경우, 단계별 에스컬레이션 절차에 따라 전문 담당자에게 배정하여
    7영업일 이내에 답변을 드릴 수 있도록 조치하십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 49f23665-20fd-5548-aa35-a2cc71924dda
  title: '여울 신용카드: 필요 서류'
  body: '여울 신용카드 신청을 위해 고객님의 상황에 따라 다음의 서류를 준비해 주십시오.


    - 직장인: 신분증, 재직증명서, 최근 3개월분 급여명세서 또는 건강보험 자격득실확인서

    - 개인사업자: 신분증, 사업자등록증명원, 소득금액증명원

    - 기타 소득 증빙 가능자: 신분증, 소득을 증빙할 수 있는 공적 서류


    제출하신 서류를 바탕으로 심사를 진행하며, 심사 결과에 따라 이용한도 최고액 20,000,000원 범위 내에서 개별 한도가 부여됩니다.'
