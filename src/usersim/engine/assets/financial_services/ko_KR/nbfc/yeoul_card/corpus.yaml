  institution_id: yeoul_card
- id: ae206086-8ce0-596c-8643-6e251ef08e78
  title: '장기카드대출(카드론): 대출 금리(연, 하한) 안내'
  body: 'Q: 장기카드대출(카드론)의 최저 금리는 얼마인가요?


    A: 여울카드 장기카드대출(카드론)의 대출 금리(연, 하한)는 5.9%입니다. 다만, 이 금리는 모든 고객님께 동일하게 적용되는 것이 아니며,
    고객님의 신용 점수, 거래 실적, 상환 능력 등 내부 심사 기준에 따라 최종 금리가 결정됩니다.


    Q: 최저 금리를 적용받으려면 어떻게 해야 하나요?


    A: 신용 상태가 개선된 경우 ''금리인하요구권''을 행사하여 금리 인하를 요청하실 수 있습니다. 구체적인 권리 행사 방법은 ''장기카드대출(카드론):
    상품설명서 주요 내용''에서 확인하십시오.'
