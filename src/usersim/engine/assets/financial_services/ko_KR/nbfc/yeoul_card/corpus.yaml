  institution_id: yeoul_card
- id: 23362ec1-77b3-5e7c-b102-7d095dc71ab7
  title: '장기카드대출(카드론): 상품 개요'
  body: '여울카드의 장기카드대출(카드론)은 갑작스럽게 큰 금액의 자금이 필요하신 고객님께 적합한 신용 대출 상품입니다. 복잡한 서류 제출 없이
    신속하게 한도를 제공하여 현대 직장인들의 스마트한 자금 운용을 돕습니다.


    [핵심 혜택 및 특징]

    - 신속한 한도 부여: 고객님의 신용 상태에 따라 빠르게 대출 가능 금액을 확인하실 수 있습니다.

    - 유연한 상환 구조: 중도상환수수료 부담 없이 언제든 원금을 상환하여 이자 비용을 절감하실 수 있습니다.


    [주요 상품 조건]

    - 대출 금리: 연 5.9% ~ 19.9% (고객님의 신용도에 따라 차등 적용)

    - 이용한도 최고액: 50,000,000원

    - 중도상환수수료율: 0%


    본 상품은 금융소비자 보호에 관한 법률을 준수하며, 고객님의 상환 능력을 고려하여 책임 있는 한도를 제공합니다. 상세한 금리 적용 방식은 ''장기카드대출(카드론):
    금리·요율 안내''를 참고하시기 바랍니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: product_sheet
  source_authority: official
