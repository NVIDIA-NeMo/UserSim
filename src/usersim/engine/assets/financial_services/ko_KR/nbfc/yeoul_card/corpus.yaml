- id: c82617b4-42dc-507c-8b35-ae05cb974380
  title: '단기카드대출(현금서비스): 금리·요율 안내'
  body: '단기카드대출(현금서비스)에 적용되는 금리 체계입니다.


    - 적용 금리: 현금서비스 금리(연) 18.2%

    - 적용 대상: 단기카드대출(현금서비스)을 이용하는 모든 고객님께 동일하게 적용되는 표준 금리입니다.

    - 계산 방식: [대출 원금 × 금리(18.2%) × (이용일수 / 365일)] 방식으로 일할 계산되어 청구됩니다.


    금리는 고객님의 신용점수 변동이나 당사의 리스크 관리 정책에 따라 조정될 수 있습니다. 신용 상태가 개선되신 고객님께서는 금리인하요구권을 통해
    금리 조정을 요청하실 수 있습니다.'
