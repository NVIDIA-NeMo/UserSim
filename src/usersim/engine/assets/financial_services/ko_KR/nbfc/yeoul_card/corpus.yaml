- id: 9020d9b0-fb2b-5bd5-a24d-d0d584b36263
  title: '할부: 당사의 비슷한 상품과의 비교'
  body: '여울카드의 ''할부''와 ''리볼빙(일부결제금액이월약정)'' 서비스는 모두 결제 부담을 줄여준다는 공통점이 있으나, 구조적으로 큰
    차이가 있습니다.


    - 할부: 결제 시점에 납부 기간(최대 24개월)을 정하며, 매월 고정된 원금과 수수료(연 9.9%~19.9%)를 납부합니다. 상환 계획이
    명확하고 예측 가능한 지출을 선호하시는 분께 적합합니다.

    - 리볼빙: 결제 금액의 일부만 납부하고 나머지를 다음 달로 이월하는 방식입니다. 매월 납부 금액을 유연하게 조절하고 싶으신 분께 적합하지만,
    이월 금액에 수수료가 계속 붙어 총 부담이 커질 수 있습니다.


    또한, 장기카드대출(카드론)과 달리 신용카드 할부 구매는 대출로 분류되지 않아 DSR(총부채원리금상환비율) 규제 대상에서 제외된다는 장점이
    있습니다.


    더 상세한 리볼빙 정보는 ''리볼빙(일부결제금액이월약정): 상품 개요''를 참고하십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 58791665-4df4-53ac-a997-aedf66ac17d9
  title: '할부: 상품설명서 주요 내용'
  body: '본 안내는 여신전문금융업법 및 금융소비자 보호에 관한 법률에 따라 여울카드 할부 서비스의 주요 내용을 고지합니다.


    1. 수수료 및 기간: 할부수수료율은 연 9.9%에서 19.9% 범위 내에서 고객의 신용 상태에 따라 결정되며, 최대 할부 기간은 24개월입니다.

    2. 할부 거래 철회권: 할부 기간 3개월 이상, 결제 금액 200,000원 이상인 거래의 경우, 계약서 또는 물건을 받은 날로부터 7일 이내에
    철회권을 행사할 수 있습니다.

    3. 할부 항변권: 상품이 배송되지 않거나 하자가 있는 등 정당한 사유가 있을 때, 할부 기간 3개월 이상, 금액 200,000원 이상의 거래에
    대해 남은 할부금 지급을 거절하는 항변권을 행사할 수 있습니다. 여울카드는 항변 신청 접수 후 7영업일 이내에 답변드리는 것을 원칙으로 합니다.

    4. 책임 있는 금융 서비스: 고객님의 신용 상태와 상환 능력을 고려하여 한도를 제공하며, 과도한 할부 이용은 신용 점수에 영향을 줄 수 있음을
    유의하시기 바랍니다.


    상세한 비용 구조는 ''할부: 수수료 안내''에서 확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: dc69d546-7a6c-5f42-bc46-69bab09b323c
  title: '할부: 금리·요율 안내'
  body: '여울카드 할부 서비스에 적용되는 금리 및 요율 안내입니다.


    - 적용 요율: 연 9.9% ~ 19.9%

    - 요율 결정 방식: 고객님의 신용 평점, 내부 신용 등급, 그리고 거래 실적을 종합적으로 고려하여 결정됩니다.

    - 변동 가능성: 신용 상태가 개선되어 ''금리인하요구권''을 행사하시거나, 당사의 신용 정책 변경 시 요율이 조정될 수 있습니다.


    해당 요율은 연 단위로 표기되었으며, 실제 월 납부 수수료는 잔액에 대해 일할 계산되어 청구됩니다. 무이자 할부 혜택이 적용되는 가맹점에서는
    해당 요율이 0%로 적용됩니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 8ad91173-54df-5a42-9853-4ccca379a976
  title: '할부: 진행 중인 이벤트'
  body: '여울카드를 이용하시는 고객님을 위해 스마트 소비 지원 이벤트를 진행하고 있습니다.


    [제휴 가맹점 무이자 할부 혜택]

    - 내용: 특정 제휴 가맹점에서 결제 시, 최대 6개월까지 할부 수수료 면제 혜택을 제공합니다.

    - 적용 대상: 여울카드 보유 고객 전체

    - 혜택 요율: 연 0% (정상 요율 연 9.9% ~ 19.9%에서 감면)


    무이자 혜택은 가맹점의 정책에 따라 상이할 수 있으므로 결제 전 확인하시기 바랍니다. 일반 할부 이용 시에는 고객님의 신용 등급에 따른 정상
    수수료가 부과됩니다.


    나에게 맞는 최적의 혜택을 찾으시려면 ''할부: 상품 개요''를 다시 확인해 주십시오.'
  domain: payments
  product_category: yeoul_halbu
