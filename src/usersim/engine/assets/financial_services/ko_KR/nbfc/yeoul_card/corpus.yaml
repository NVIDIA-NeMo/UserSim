- id: 68947655-bb3e-54d6-97f4-85b19258c3bb
  title: '장기카드대출(카드론): 수수료 안내'
  body: '장기카드대출(카드론) 이용과 관련하여 발생하는 수수료 항목입니다. 여울카드는 투명한 비용 구조를 통해 고객님의 선택권을 보장합니다.


    - 중도상환수수료율: 0%


    장기카드대출(카드론)은 대출 기간 중 언제든지 원금을 상환하시더라도 별도의 중도상환수수료를 부과하지 않습니다. 고객님께서는 상환 능력이 되시는
    시점에 자유롭게 상환하여 이자 부담을 줄이실 수 있습니다.'
