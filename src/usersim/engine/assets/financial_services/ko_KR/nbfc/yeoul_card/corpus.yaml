- id: e491930b-7c58-5425-aa5e-74b22b970ee9
  title: '단기카드대출(현금서비스): 거래가 거절되거나 제한되었을 때'
  body: '단기카드대출(현금서비스) 이용 중 거래가 거절되거나 한도가 제한되는 경우, 다음의 원인을 확인해 보시기 바랍니다.


    **증상: 현금서비스 신청 시 ''한도 초과'' 또는 ''거래 불가'' 메시지가 출력됨**


    **원인 및 확인 순서**

    1. 이용 한도 초과: 현재 사용 중인 금액이 고객님께 부여된 한도(최대 5,000,000원)에 도달했는지 확인하십시오.

    2. 결제 대금 연체: 최근 카드 결제 대금이 연체된 경우, 리스크 관리 정책에 따라 서비스 이용이 일시적으로 제한될 수 있습니다.

    3. 신용 상태의 급격한 변화: 외부 신용 평가 기관의 신용 점수가 하락한 경우, 당사의 기준에 따라 한도가 자동으로 축소되거나 제한될 수
    있습니다.


    **해결 방법**

    - 한도 초과인 경우: 기존 대출금을 선결제하여 한도를 확보하시거나, 한도 증액 가능 여부를 문의하십시오.

    - 연체 발생 시: 미납된 금액을 즉시 상환하신 후 서비스 재개 가능 여부를 확인하십시오.


    **에스컬레이션**

    위의 사항을 확인했음에도 정당한 사유 없이 제한이 지속된다고 판단되시면, 전문 담당자가 고객님의 신용 상태와 이용 기록을 재검토하는 한도 심사
    부서로 요청을 전달하여 처리해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
