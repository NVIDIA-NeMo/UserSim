- id: 5afdf96c-f9fc-53c7-8021-432938e7a949
  title: '리볼빙(일부결제금액이월약정): 상품설명서 주요 내용'
  body: '본 안내는 여신전문금융업법 및 금융소비자 보호에 관한 법률을 준수하여 작성되었습니다.


    **1. 서비스 구조 및 수수료**

    리볼빙(일부결제금액이월약정)은 결제 금액의 일부만 납부하고 나머지를 다음 달로 이월하는 서비스입니다. 이월된 금액에 대해서는 연 16.5%의
    리볼빙 수수료율(연)이 적용됩니다. 수수료는 매일의 잔액에 대해 일할 계산되어 청구되므로, 이월 기간이 길어질수록 고객님이 부담해야 할 총
    상환액은 증가합니다.


    **2. 최소결제비율**

    고객님께서는 최소 10%의 리볼빙 최소결제비율을 유지하셔야 합니다. 최소결제비율 미만으로 납부하실 경우 연체로 처리되어 신용 점수에 부정적인
    영향을 미칠 수 있으며, 연체 이자가 부과될 수 있습니다.


    **3. 고객의 권리**

    고객님께서는 언제든지 이월된 금액의 전부 또는 일부를 선결제하여 수수료 부담을 줄일 수 있는 권리가 있습니다. 또한, 서비스 해지를 요청하실
    수 있으며 해지 후에는 더 이상 이월이 발생하지 않습니다.


    **4. 유의사항**

    리볼빙은 단기적인 자금 흐름을 돕는 도구이나, 장기간 이용 시 원금이 빠르게 줄어들지 않고 수수료가 누적되는 특성이 있음을 충분히 인지하시기
    바랍니다.'
  domain: payments
  product_category: yeoul_revolving
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 363f3bdf-1908-563c-9bcf-ab0018dd623c
  title: '리볼빙(일부결제금액이월약정): 금리·요율 안내'
  body: '리볼빙(일부결제금액이월약정) 서비스에 적용되는 요율을 안내해 드립니다.


    - **리볼빙 수수료율(연)**: 16.5%

    - **리볼빙 최소결제비율**: 10%


    **요율 적용 안내**

    - 위 수수료율은 모든 가입 고객님께 동일하게 적용되는 기본 요율입니다.

    - 수수료는 결제일에 납부되지 않은 이월 금액에 대해 적용되며, 결제일로부터 다음 결제일까지의 일수를 계산하여 부과합니다.

    - 최소결제비율 10%는 서비스 유지를 위한 하한선이며, 고객님의 선택에 따라 이보다 높은 비율(예: 20%, 50% 등)로 설정하여 이월
    금액과 수수료를 낮추실 수 있습니다.

    - 신용 상태의 개선이나 특정 프로모션 조건 충족 시 수수료 감면 혜택이 제공될 수 있습니다.'
