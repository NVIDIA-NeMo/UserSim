- id: 06b29b03-e369-575e-8054-5074c56546cb
  title: '여울 신용카드: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 이용 내역이나 청구 명세서의 금액이 실제 사용 금액과 다르다고 느끼실 때, 상담원은 다음 순서로 지원하십시오.


    - 주요 증상: 결제한 금액보다 더 많은 금액이 청구되었거나, 이용하지 않은 가맹점의 내역이 포함되어 있음


    - 원인 파악 및 확인 순서

    1. 미결제/보류 거래 확인: 일부 가맹점(호텔, 렌터카 등)의 경우 가결제(Hold) 금액이 청구되어 일시적으로 금액이 높게 보일 수 있습니다.

    2. 할부 수수료 포함 여부: 일시불이 아닌 할부 거래의 경우, 약정된 할부 수수료가 포함되어 청구되었는지 확인하십시오.

    3. 포인트 적립 반영 확인: 0.7%의 포인트 적립 혜택이 정상적으로 적용되었는지, 혹은 포인트 결제 서비스가 이용되었는지 확인하십시오.


    - 해결 방법

    본인 인증(성함, 생년월일) 후, 문제가 되는 거래의 승인 번호와 일시를 대조하여 정확한 청구 원인을 설명하십시오. 만약 가맹점의 과다 청구나
    부정 사용이 확인될 경우, 즉시 거래 분쟁 접수 절차를 안내하십시오.


    - 에스컬레이션

