    연체 시 추가 가산 금리가 적용되어 총 상환액이 크게 늘어날 수 있습니다.

    4. DSR 관련 안내: 단기카드대출(현금서비스)은 규제상 장기카드대출(카드론)과 달리 DSR(총부채원리금상환비율) 산정 대상에는 직접 포함되지
