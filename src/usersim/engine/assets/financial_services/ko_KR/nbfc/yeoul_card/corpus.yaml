  title: '장기카드대출(카드론): 중도상환수수료율 안내'
  body: 'Q: 장기카드대출(카드론)을 이용하다가 기간 전에 원금을 모두 갚으려 합니다. 이때 발생하는 중도상환수수료는 얼마인가요?


    A: 여울카드의 장기카드대출(카드론)은 고객님의 금융 부담을 덜어드리기 위해 중도상환수수료율 0%를 적용하고 있습니다. 따라서 대출 기간 중
    언제든지 원금을 상환하셔도 별도의 중도상환수수료가 부과되지 않습니다. 자금 여력이 되실 때 자유롭게 상환하여 이자 부담을 줄이시기 바랍니다.'
