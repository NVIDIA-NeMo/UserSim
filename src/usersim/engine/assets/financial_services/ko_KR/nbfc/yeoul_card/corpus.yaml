- id: 64f9ee0b-b5e7-54cd-8f47-14c1146a6a66
  title: '여울 신용카드: 금리·요율 안내'
  body: "여울 신용카드의 주요 적립률 및 비용 요율을 안내해 드립니다.\n\n- 포인트 적립률: 0.7%\n  - 모든 가맹점 이용 금액에\
    \ 대해 동일하게 적용되며, 적립된 포인트는 당사 규정에 따라 현금화 또는 포인트 결제로 사용하실 수 있습니다.\n- 연회비: 15,000원\n\
    \  - 매년 1회 부과되는 고정 비용입니다.\n\n본 상품은 단일 적립률 체계를 가지고 있어 이용 금액에 관계없이 0.7%의 요율이 동일하게\
    \ 적용됩니다. 한도 및 수수료와 관련된 상세 내용은 '여울 신용카드: 수수료 안내'에서 확인하십시오."
