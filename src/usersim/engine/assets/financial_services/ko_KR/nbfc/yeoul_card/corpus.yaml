- id: 6626eb72-3a14-58e8-a16a-6ac2a9cb4561
  title: '장기카드대출(카드론): 거래가 거절되거나 제한되었을 때'
  body: '장기카드대출(카드론) 신청 시 대출 실행이 거절되거나 이용 한도가 제한되는 경우의 원인과 해결 방법입니다.


    **증상**

    - 대출 신청 과정에서 ''한도 부족'' 또는 ''이용 불가'' 메시지가 출력됨

    - 기존 한도가 갑자기 감소하여 원하는 금액을 대출받을 수 없음


    **확인 사항**

    1. DSR 한도 초과 여부: 연간 원리금 상환액이 연소득의 50%를 초과했는지 확인하십시오. 특히 최근 다른 금융기관의 대출을 받으셨다면
    한도가 제한될 수 있습니다.

    2. 신용 상태 변화: 최근 연체 발생이나 신용점수 하락 등 신용 상태에 변동이 있었는지 확인하십시오.

    3. 이용한도 최고액 도달: 본 상품의 최고 한도인 50,000,000원에 도달했는지 확인하십시오.


    **해결 방법**

    - 상기 원인으로 인해 제한된 경우, 즉각적인 한도 증액은 어려울 수 있습니다. 다만, 상환 능력이 개선되었거나 신용 상태가 나아진 경우 금리인하요구권을
    통해 금리 조정을 요청하시거나 추후 재심사를 통해 한도 조정을 시도하실 수 있습니다.


    **에스컬레이션**

    단순 시스템 오류가 의심되거나 상세 사유 확인이 필요한 경우, 전문 담당 부서로 케이스를 이관하여 정밀 심사 후 고객님께 최종 결과를 안내해
    드리겠습니다.'
