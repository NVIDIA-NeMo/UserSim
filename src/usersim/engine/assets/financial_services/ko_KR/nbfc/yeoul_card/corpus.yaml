- id: d03ac1fe-9893-5c0d-a054-ccdc78ff554d
  title: prepay_revolving_balance 사용 기준
  body: '리볼빙 이월 잔액이나 결제 예정 금액의 일부 또는 전부를 결제일 전에 미리 납부하여 수수료 부담을 줄이고자 하는 고객님을 위해 다음
    절차를 수행하십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 호출하여 해당 리볼빙 계좌의 account_id를 확인하십시오.

    3. get_loan_details 도구를 사용하여 현재의 리볼빙 이월 잔액과 다음 결제 예정 금액을 확인하여 고객님께 안내하십시오.

    4. 고객님이 선결제하고자 하는 금액을 확인하십시오.

    5. prepay_revolving_balance 도구를 호출하여 선결제 처리를 완료하십시오.


    선결제 처리 후에는 이월 잔액이 감소하므로, 다음 달에 부과될 리볼빙 수수료가 줄어드는 효과가 있음을 안내하십시오. 상세한 수수료 구조는 ''리볼빙(일부결제금액이월약정):
    수수료 안내''에서 확인 가능합니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - prepay_revolving_balance
  institution_id: yeoul_card
