- id: 898a835b-4ecc-58aa-b72e-039086d7b18b
  title: '장기카드대출(카드론): 다른 상품과의 비교와 맞지 않는 경우'
  body: '장기카드대출(카드론)의 특성을 바탕으로, 본 상품이 적합하지 않은 경우와 타 상품과의 차이점을 안내합니다.


    **상품 핵심 조건**

    - 대출 금리: 연 5.9% ~ 19.9%

    - 이용한도 최고액: 50,000,000원

    - 중도상환수수료율: 0%


    **이런 분께는 맞지 않습니다**

    - **초단기 자금 수요**: 단 몇 일 후에 바로 상환할 예정인 소액 자금이 필요하시다면, 장기 대출보다는 단기카드대출(현금서비스)가 더
    간편할 수 있습니다.

    - **초저금리 희망**: 신용등급이 매우 높으시더라도 카드사 상품의 특성상 1금융권의 담보대출보다는 금리가 높을 수 있습니다. 본 상품의
    하한 금리는 5.9%입니다.


    **비교 요약**

    본 상품은 중도상환수수료가 전혀 없으므로, 대출 기간 중 자금 상황이 좋아질 때마다 수수료 부담 없이 원금을 갚아 나갈 수 있는 유연한 금융
    설계가 가능합니다. 하지만 DSR 규제가 적용되는 상품이므로, 이미 다른 대출이 많으신 경우 한도 제공이 제한될 수 있습니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: product_sheet
