- id: 9c776865-6cca-57d2-8d03-42f3da4a337c
  title: '장기카드대출(카드론): 금리·요율이 정해지는 방식과 적용'
  body: '장기카드대출(카드론)의 금리는 고객님의 개인 신용평가 결과와 시장 금리 상황을 반영하여 결정됩니다.


    - 적용 금리 범위: 연 5.9% ~ 연 19.9%

    - 금리 결정 방식: 기준금리에 고객님별 가산금리를 더하여 최종 금리가 책정됩니다. 가산금리는 신용점수, 이용 실적, 소득 수준 등을 종합적으로
    평가하여 결정됩니다.

    - 중도상환수수료율: 0% (모든 고객에게 동일하게 적용되며, 상환 시점에 관계없이 면제됩니다.)


    금리는 대출 실행 시점에 확정되며, 이후 신용 상태가 개선된 고객님은 금리인하요구권을 통해 금리 인하를 요청하실 수 있습니다. 정확한 개인별
    적용 금리는 상담 과정에서 안내해 드리겠습니다.'
