  institution_id: yeoul_card
- id: 13e1ab37-e331-5192-8582-d223f2c2329a
  title: '리볼빙(일부결제금액이월약정): 자주 하는 업무의 처리 절차'
  body: "리볼빙(일부결제금액이월약정)의 결제비율 변경 또는 서비스 해지를 요청하는 절차입니다.\n\n1. 본인 인증: 상담원에게 성함과 생년월일을\
    \ 말씀해 주십시오.\n2. 요청 사항 전달: '결제비율 변경' 또는 '서비스 해지' 중 원하시는 업무를 말씀하십시오.\n   - 결제비율\
    \ 변경 시: 변경하고자 하는 비율(예: 20%)을 말씀해 주십시오. (최소 10% 이상 설정 가능)\n   - 서비스 해지 시: 더 이상\
    \ 이월 서비스를 이용하지 않겠다는 의사를 밝혀 주십시오.\n3. 조건 확인 및 동의: 상담원이 변경된 비율에 따른 예상 납부액 또는 해지\
    \ 후 이번 달 결제 금액 전체가 청구된다는 점을 안내합니다. 내용을 확인하고 동의하십시오.\n4. 처리 결과 확인: 상담원이 변경 사항이\
    \ 시스템에 반영되었음을 확인해 주면 절차가 완료됩니다.\n\n해지나 변경과 관련된 상세 규정은 '리볼빙(일부결제금액이월약정): 해지·변경·상품\
    \ 전환'에서 확인하실 수 있습니다."
  domain: payments
