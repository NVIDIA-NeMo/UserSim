- id: 1ca43cfa-b54a-5e91-8419-5d80a84bf03a
  title: '단기카드대출(현금서비스): 진행 상황과 내역 확인'
  body: "현재 이용 중인 단기카드대출(현금서비스)의 대출 잔액과 상환 예정 내역을 확인하는 방법은 다음과 같습니다.\n\n1. 본인 확인:\
    \ 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.\n2. 내역 조회 요청: 확인하고자 하는 기간의 단기카드대출(현금서비스) 이용 내역\
    \ 조회를 요청하십시오.\n3. 상세 내용 확인: 상담원이 안내하는 다음 정보를 확인하십시오.\n   - 총 대출 원금 및 현재 잔액\n \
    \  - 적용 금리(연 18.2%) 및 계산된 이자 금액\n   - 다음 결제일에 상환해야 할 총금액과 예정일\n4. 결과 확인: 안내받으신\
    \ 내용이 실제 이용하신 금액과 일치하는지 확인하십시오.\n\n상세한 월별 이용 내역은 매월 발행되는 이용 명세서를 통해 다시 한번 확인하실\
    \ 수 있으며, 명세서 내용에 의문이 있으신 경우 '단기카드대출(현금서비스): 명세서나 내역과 맞지 않을 때'를 참고하여 문의해 주시기 바랍니다."
  domain: lending_mortgage
