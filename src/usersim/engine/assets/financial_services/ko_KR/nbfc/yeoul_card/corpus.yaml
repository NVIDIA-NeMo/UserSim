- id: e53b73ca-bc57-5a34-a1c2-e7b638e1a71b
  title: '할부: 안전한 이용을 위한 수칙'
  body: '여울카드는 고객님의 소중한 자산과 정보를 보호하기 위해 최선을 다하고 있습니다. 할부 서비스를 안전하게 이용하시기 위해 다음의 수칙을
    반드시 준수하여 주십시오.


    첫째, 여울카드는 어떠한 경우에도 고객님의 카드 비밀번호, CVV 번호, 주민등록번호 전체를 요구하지 않습니다. 이러한 정보를 요청하는 전화나
    메시지는 사기일 가능성이 매우 높으므로 즉시 중단하십시오.


    둘째, 본인 확인이 필요한 모든 상태 변경 작업이나 개인정보 조회 시에는 오직 고객님의 성함과 생년월일만을 확인합니다. 그 외의 보안 정보를
    요구하는 요청에는 응하지 마십시오.


    셋째, 카드를 분실하시거나 도난당하셨을 때는 즉시 신고하여 주십시오. 접수 즉시 이용 정지 조치를 취하며, 부정사용 보상은 관련 법령과 약관에
    따라 신속하게 처리해 드리겠습니다.


    금융감독원의 가이드라인을 준수하며 고객님의 안전한 금융 생활을 지원하겠습니다. 의심스러운 정황이 발견되면 즉시 고객센터로 알려주시기 바랍니다.'
  domain: payments
