  institution_id: yeoul_card
- id: 9a8c16ad-6404-5519-a3c8-7c9c671856aa
  title: '여울 신용카드: 이용한도 최고액 안내'
  body: 'Q: 여울 신용카드로 사용할 수 있는 최대 한도는 얼마인가요?

    A: 여울 신용카드의 이용한도 최고액은 20,000,000원입니다. 다만, 이는 모든 고객에게 동일하게 적용되는 금액이 아니며, 고객님의 신용
    점수, 연소득, 기존 부채 현황 등 신용 상태와 상환 능력을 종합적으로 고려하여 개별적으로 결정됩니다.


    Q: 한도를 높이고 싶은 경우 어떻게 해야 하나요?

    A: 고객님의 소득 증빙 서류를 제출하시거나 신용 상태가 개선되었음을 증명하여 한도 증액을 요청하실 수 있습니다. 심사 결과에 따라 최고 20,000,000원
    범위 내에서 한도가 상향 조정될 수 있습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: ca1764d9-3b91-525b-8ef6-da14b19af3a1
  title: '여울 신용카드: 등록 정보 변경'
  body: '여울 신용카드에 등록된 개인정보(연락처, 주소 등)를 변경하는 절차입니다.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀하여 본인 인증을 완료하십시오.

    2. 변경 사항 요청: 변경을 원하시는 정보(예: 휴대전화 번호, 자택 주소, 직장 정보 등)와 새로운 내용을 정확히 알려주십시오.

    3. 정보 검증: 상담원이 요청하신 변경 내용이 정확한지 다시 한번 확인하며, 필요에 따라 추가 증빙 서류 제출을 요청할 수 있습니다.

    4. 완료 확인: 변경 처리가 완료되면 상담원이 최종 내용을 확인해 드리며, 등록된 연락처로 변경 완료 안내 메시지가 발송됩니다.


    주의사항: 카드 비밀번호나 CVC 번호 등 보안 정보는 이 절차를 통해 변경할 수 없으며, 별도의 보안 변경 절차를 이용하셔야 합니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 459bef68-26ad-551c-9826-6e93f28f5d94
  title: '여울 신용카드: 로그인하거나 접속할 수 없을 때'
  body: '여울카드 모바일 앱이나 웹사이트에 접속할 수 없는 경우, 다음 순서에 따라 조치하십시오.


    1. 증상 확인: ''아이디/비밀번호 불일치'' 메시지가 뜨는지, 혹은 ''네트워크 연결 오류''나 ''페이지 응답 없음'' 현상이 발생하는지
    확인하십시오.

    2. 기본 점검

    - 네트워크 상태: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오.

    - 입력 정보: 대소문자 구분이나 오타가 없는지 다시 확인하여 로그인하십시오.

    - 앱 업데이트: 최신 버전의 앱을 사용 중인지 확인하고, 업데이트가 필요한 경우 진행하십시오.

    3. 계정 상태 확인: 비밀번호 5회 오류 등으로 인해 계정이 잠긴 경우, 본인 인증 절차를 통해 잠금을 해제해야 합니다.

    4. 전문 담당자 처리: 위 조치 후에도 접속이 불가한 경우, 상담원에게 증상을 상세히 말씀해 주십시오. 상담원이 기술 지원 팀으로 에스컬레이션하여
    계정 상태를 점검하고 해결 방법을 안내해 드리겠습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 7ae09646-4b3e-545b-92d6-685edaab9134
  title: '여울 신용카드: 이용 조건별 차이'
  body: '고객의 조건에 따른 여울 신용카드의 이용 가능 범위는 다음과 같습니다.


    - 신용 상태 우수 고객: 이용한도 최고액 20,000,000원까지 부여 가능, 포인트 적립률 0.7% 동일 적용

    - 일반 신용 고객: 심사 결과에 따른 개별 한도 부여 (최고 20,000,000원 이내), 포인트 적립률 0.7% 동일 적용

    - 신규 가입 고객: 기본 심사를 통해 한도 부여, 연회비 15,000원 납부 의무 발생

    - 한도 조정 신청 고객: 소득 및 신용도 개선 증빙 시 최대 20,000,000원까지 상향 검토'
  domain: payments
  product_category: yeoul_credit
  document_type: eligibility_matrix
  source_authority: official
