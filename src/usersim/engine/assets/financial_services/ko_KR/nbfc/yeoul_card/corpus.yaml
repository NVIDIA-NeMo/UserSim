- id: 6689ad65-7215-5ece-a45a-4d6f67659464
  title: '단기카드대출(현금서비스): 가입과 이용 시작'
  body: '단기카드대출(현금서비스)은 별도의 복잡한 가입 절차 없이 여울 신용카드 이용 고객님이라면 부여된 한도 내에서 즉시 이용하실 수 있습니다.
    타 상품과 비교하여 가장 큰 장점은 신속한 현금 확보가 가능하다는 점입니다.


    이용 방법은 다음과 같습니다.


    1. 단기카드대출(현금서비스) 이용을 요청하십시오.

    2. 본인 확인을 위해 고객님의 성함과 생년월일을 말씀해 주십시오. (카드 번호, CVV, 비밀번호, 주민등록번호는 절대 요청하지 않습니다.)

    3. 현재 이용 가능한 한도와 신청하시려는 금액을 확인하십시오. 본 상품의 현금서비스 이용한도 최고액은 5,000,000원입니다.

    4. 대출 실행을 요청하시면, 현금서비스 금리(연) 18.2%가 적용됨을 안내받으신 후 즉시 지정된 계좌로 입금됩니다.


    정상적으로 처리가 완료되면 입금 알림 메시지를 통해 확인하실 수 있습니다. 이용 중 궁금하신 점은 고객센터로 문의해 주시기 바랍니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: how_to_guide
  source_authority: official
