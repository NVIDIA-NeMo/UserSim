- id: 30b52447-f27d-56cd-aee3-f61c68062a08
  title: '할부: 필요 서류'
  body: '할부 서비스 이용 및 한도 조정을 위해 필요한 서류는 다음과 같습니다.


    | 구분 | 필요 서류 | 비고 |

    | :--- | :--- | :--- |

    | 기본 서비스 이용 | 본인 확인 가능 신분증 | 성함 및 생년월일 확인용 |

    | 이용 한도 증액 요청 | 소득금액증명원 또는 근로소득원천징수영수증 | 상환 능력 증빙 필요 |

    | 신규 가입 시 | 주민등록등본 또는 신분증 사본 | 본인 인증 및 주소 확인용 |

    | 금리인하요구권 행사 | 재직증명서, 승진발령장, 소득증빙서류 등 | 신용 상태 개선 증빙 서류 |'
