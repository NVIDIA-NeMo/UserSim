- id: fa3e31f9-506f-5732-bfd1-28400ae1034d
  title: '할부: 다른 상품과의 비교와 맞지 않는 경우'
  body: '할부 서비스는 고액 결제 시 단기적인 경제적 부담을 낮추는 데 유용하지만, 모든 상황에 최선은 아닙니다. 타 상품과의 비교를 통해
    안내하십시오.


    1. 단기카드대출(현금서비스)과의 비교

    - 할부: 물건이나 서비스 구매 시 결제 금액을 나누어 내는 방식입니다.

    - 현금서비스: 급격한 자금 수요가 있을 때 현금을 직접 확보하는 단기 대출입니다.

    - 선택 기준: ''물건 구매''가 목적이라면 할부를, ''현금 확보''가 목적이라면 현금서비스를 선택하십시오.


    2. 할부 서비스가 맞지 않는 경우

    - 무이자 혜택이 없는 상품을 이용하면서 총 상환 금액을 최소화하고 싶으신 분: 할부 수수료(연 9.9% ~ 19.9%)가 부과되므로 일시불
    결제가 가장 경제적입니다.

    - 매우 짧은 기간(1개월 미만) 내에 자금 회복이 가능하신 분: 할부 설정보다는 일시불 결제를 권장합니다.


    3. 주요 제약 사항

    - 최대 이용 기간은 24개월이며, 이 기간을 초과하는 장기 분할 상환이 필요하신 경우에는 장기카드대출(카드론) 상품을 검토하시기 바랍니다.'
  domain: payments
  product_category: yeoul_halbu
