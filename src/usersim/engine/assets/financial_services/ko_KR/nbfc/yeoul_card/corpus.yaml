- id: 688a063d-ee63-5903-987a-b3e8928819fd
  title: '리볼빙(일부결제금액이월약정): 예상과 다른 수수료나 금액'
  body: "고객님께서 리볼빙 수수료나 청구 금액이 예상보다 높다고 느끼시는 경우, 다음과 같은 원인이 있을 수 있습니다. 상담원은 이 절차에\
    \ 따라 안내해 주십시오.\n\n1. 증상: 고객이 명세서상의 리볼빙 수수료가 생각보다 많다고 주장함\n2. 확인 사항:\n   - 이월 잔액\
    \ 확인: 전월에 이월된 금액이 누적되어 복리 형태로 수수료가 가산되었는지 확인하십시오.\n   - 수수료율 적용 확인: 현재 적용 중인 리볼빙\
    \ 수수료율(연) 16.5%가 정확히 계산되었는지 검토하십시오.\n   - 결제 비율 확인: 리볼빙 최소결제비율 10%만 납부하여 이월 금액이\
    \ 계속 증가했는지 확인하십시오.\n3. 해결 방법:\n   - 고객에게 이월 잔액에 대해 일할 계산되는 수수료 구조를 상세히 설명하십시오.\n\
    \   - 수수료 부담을 줄이기 위해 '선결제' 기능을 통해 원금을 미리 상환하는 방법을 안내하십시오.\n4. 에스컬레이션:\n   - 단순\
    \ 안내로 해결되지 않는 복잡한 계산 오류 의심이나 강력한 민원의 경우, 단계별 에스컬레이션 절차에 따라 전문 담당자에게 사건을 이관하십시오.\
    \ 담당자가 재검토 후 7영업일 이내에 고객에게 답변을 제공할 것입니다."
  domain: payments
  product_category: yeoul_revolving
