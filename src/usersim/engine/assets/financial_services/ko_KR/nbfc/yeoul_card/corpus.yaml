- id: 5bdc042e-1825-5dc0-9027-1bc2e4fe119e
  title: '여울 신용카드: 가입과 이용 조건'
  body: 'Q: 여울 신용카드는 누구나 가입할 수 있습니까?

    A: 기본적으로 소득 증빙이 가능하고 신용 점수가 당사의 기준을 충족하는 고객님이라면 가입이 가능합니다. 특히 디지털 금융 환경에 익숙한 직장인분들을
    주요 타겟으로 하고 있으며, 심사 과정에서 신용 상태와 상환 능력을 종합적으로 고려하여 발급 여부가 결정됩니다.


    Q: 가입 시 필요한 조건이나 서류가 있습니까?

    A: 일반적으로 본인 확인을 위한 신분증과 재직 증빙 서류 등이 필요합니다. 최근에는 모바일 앱과 웹사이트를 통해 서류 제출 없이 자동 스크래핑
    방식으로 간편하게 가입 조건을 확인하실 수 있습니다.


    가입 대상에 대한 자세한 기준은 ''여울 신용카드: 가입 대상''에서 확인하십시오.'
