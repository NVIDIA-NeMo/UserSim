- id: 9fa35554-44dc-5e8a-ae6a-196e4c1a11c2
  title: '장기카드대출(카드론): 가입과 이용 시작'
  body: '장기카드대출(카드론)을 처음 이용하시는 고객님을 위한 단계별 안내입니다.


    [준비 사항]

    - 본인 명의의 여울 신용카드

    - 본인 확인을 위한 성함 및 생년월일


    [이용 절차]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀하시어 본인 인증을 완료하십시오.

    2. 한도 및 금리 조회: 원하시는 대출 금액을 말씀하시면, 고객님의 신용 상태를 바탕으로 적용 가능한 대출 금리(연 5.9% ~ 19.9%)와
    이용한도를 안내해 드립니다.

    3. 계약 내용 확인: 안내받은 총상환액, 상환 기간, 금리 등 계약 조건을 확인하십시오.

    4. 계약 체결: 약관 및 상품 설명에 동의하시면 대출 계약이 완료되며, 지정하신 계좌로 자금이 입금됩니다.


    [유의 사항]

    - 청약 철회: 계약서류를 받은 날과 대출 실행일 중 늦은 날부터 14일 이내에 청약을 철회하실 수 있습니다. 이 경우 원금과 이용 기간의
    이자, 제3자 비용만 부담하시며 중도상환수수료는 부과되지 않습니다.'
