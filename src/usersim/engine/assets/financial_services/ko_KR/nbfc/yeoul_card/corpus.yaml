  institution_id: yeoul_card
- id: eb3dbbdf-7961-5a81-b798-14bf79e800ce
  title: '단기카드대출(현금서비스): 상품 고르는 방법'
  body: '급전이 필요하실 때, 어떤 상품을 선택해야 할지 고민되신다면 다음 비교 내용을 확인하십시오.


    [단기카드대출(현금서비스)]

    - 특징: 매우 신속한 현금 확보 가능, 단기 이용에 최적화

    - 비용: 현금서비스 금리(연) 18.2%

    - 한도: 최고 5,000,000원

    - 추천 대상: 며칠 내로 상환 가능한 소액의 자금이 급히 필요하신 분


    [장기카드대출(카드론)]

    - 특징: 비교적 큰 금액을 장기간 나누어 상환, 중도상환수수료 부담 없음

    - 비용: 단기카드대출보다 상대적으로 낮을 수 있는 금리 적용 (상품별 상이)

    - 제약: DSR(총부채원리금상환비율) 규제가 적용되어 한도에 영향

    - 추천 대상: 목돈이 필요하여 수개월에서 수년에 걸쳐 안정적으로 상환하고자 하시는 분


    단기적인 자금 융통이 목적이라면 단기카드대출(현금서비스)을, 계획적인 장기 상환이 목적이라면 장기카드대출(카드론)을 추천드립니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: f9d3009d-5a04-5d89-b66c-26874418e8a2
  title: '단기카드대출(현금서비스): 개인정보 처리 안내'
  body: '여울카드는 단기카드대출(현금서비스) 서비스 제공을 위해 관련 법령에 따라 고객님의 개인정보를 다음과 같이 처리합니다.


    1. 수집 및 이용 목적: 고객님의 신용 상태 및 상환 능력을 평가하여 이용한도(최고 5,000,000원)를 결정하고, 대출 실행 및 원리금
    회수, 본인 인증 및 서비스 안내를 위해 이용합니다.


    2. 처리 항목: 성함, 생년월일, 연락처, 직장 정보, 신용평가사 제공 신용정보 등


    3. 보유 및 이용 기간: 금융거래 관계가 종료된 날로부터 관련 법령(상법, 국세기본법 등)에서 정한 기간 동안 보관 후 파기합니다.


    4. 제3자 제공: 신용평가회사 및 관련 감독 기관(금융위원회, 금융감독원)의 요청이 있을 경우 법령에 따라 정보를 제공할 수 있습니다.


    고객님은 개인정보 수집 및 이용에 동의하지 않을 권리가 있으나, 동의 거부 시 한도 산정 및 본인 확인이 불가능하여 단기카드대출(현금서비스)
    이용이 제한될 수 있습니다. 당사는 고객님의 정보를 엄격히 관리하며 무단 유출을 방지하기 위해 최선을 다하고 있습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: disclosure
  source_authority: official
