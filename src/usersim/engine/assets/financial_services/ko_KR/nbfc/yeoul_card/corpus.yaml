- id: e155fa6f-3db8-5fc7-9467-b957df910a27
  title: open_account 사용 기준
  body: '가족카드 추가 발급이나 후불교통카드 기능 추가를 희망하는 고객의 요청은 다음 절차에 따라 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 통해 현재 사용 중인 기본 계좌의 `account_id`를 확인합니다.

    3. 고객이 요청하는 서비스 유형(가족카드 추가 발급 또는 후불교통카드 기능 추가)을 명확히 확인합니다.

    4. `open_account` 도구를 호출하여 해당 기능을 신청합니다.

    5. 신청이 완료되었음을 안내하고, 카드 배송 일정 및 이용 가능 시점에 대해 설명하십시오.


    가족카드 발급 시에는 가족 관계 증명 서류가 필요할 수 있으며, 구체적인 필요 서류는 ''여울 신용카드: 필요 서류''를 참조하여 안내하시기
    바랍니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: yeoul_card
- id: 28f8d64c-7f26-5fe0-ae4f-9b1a1a4bf55c
  title: open_account 도구 설명서
  body: "도구 이름: `open_account` \n설명: 가족카드 추가 발급 또는 후불교통카드 기능을 추가로 신청합니다.\n\n매개변수:\n\
    - `account_id`: 신청의 기준이 되는 주 계좌의 식별자입니다.\n- `request_type`: 신청할 서비스의 종류입니다. (예:\
    \ '가족카드', '후불교통카드')\n\n실행 방식: 상담원이 `verify_identity`로 인증된 고객의 요청에 따라 직접 도구를 호출하여\
    \ 신청 접수를 완료합니다."
