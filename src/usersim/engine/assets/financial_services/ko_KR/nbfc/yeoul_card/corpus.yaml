- id: ebf79166-c037-5c20-8d04-1590b3dd0844
  title: '단기카드대출(현금서비스): 약관'
  body: '본 약관은 여울카드의 단기카드대출(현금서비스) 이용에 적용되는 권리와 의무를 규정합니다.


    1. 서비스 제공 및 이용: 고객은 당사가 정한 신용 기준을 충족할 때 단기카드대출(현금서비스)을 이용할 수 있으며, 이용한도 최고액은 5,000,000원
    범위 내에서 개인별로 차등 부여됩니다.

    2. 금리 및 수수료: 본 상품의 현금서비스 금리(연)는 18.2%이며, 대출 실행일부터 결제일까지의 일수를 계산하여 부과합니다. 법정 최고금리인
    연 20%를 초과할 수 없습니다.

    3. 청약 철회: 대출 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과 이용
    기간의 이자, 인지세 등 제3자 비용만 납부하며 중도상환수수료는 면제됩니다.

    4. 상환 의무: 고객은 결제일에 원금과 이자를 상환해야 하며, 연체 시 약정금리에 최대 3%p를 더한 연체이자율이 적용됩니다. 단, 연체이자
    또한 연 20%를 초과할 수 없습니다.

    5. 계약의 종료: 고객의 신용 상태 악화 또는 약관 위반 시 당사는 서비스를 제한하거나 계약을 해지할 수 있습니다.'
