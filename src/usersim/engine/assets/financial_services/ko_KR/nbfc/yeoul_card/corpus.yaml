- id: 70ccdd0e-8cea-5ba9-9aa7-123b73f7aeef
  title: '장기카드대출(카드론): 당사의 비슷한 상품과의 비교'
  body: '여울카드의 주요 대출 상품인 장기카드대출(카드론)과 단기카드대출(현금서비스)을 비교해 드립니다.


    | 구분 | 장기카드대출(카드론) | 단기카드대출(현금서비스) |

    | :--- | :--- | :--- |

    | 이용 목적 | 비교적 큰 금액, 장기 상환 | 급격한 자금 수요, 단기 확보 |

    | 이용한도 | 최고 50,000,000원 | 상대적으로 낮은 한도 |

    | 중도상환수수료 | 0% (부담 없음) | 해당 없음 (단기 상환) |

    | DSR 적용 여부 | 적용 대상 (50% 이내 관리) | 미적용 |


    [추천 고객]

    - 계획적인 상환을 통해 큰 금액을 장기로 사용하시려는 분은 ''장기카드대출(카드론)''이 적합합니다.

    - 소액의 자금을 며칠 내로 빠르게 해결하시려는 분은 ''단기카드대출(현금서비스)''를 추천드립니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 30a71a61-ec92-5330-8435-accce3290516
  title: '장기카드대출(카드론): 상품설명서 주요 내용'
  body: '본 상품은 금융위원회와 금융감독원의 감독하에 여신전문금융업법 및 금융소비자 보호에 관한 법률을 엄격히 준수합니다.


    [금리 및 상환 안내]

    - 대출 금리는 연 5.9%에서 최대 19.9%까지 적용되며, 법정 최고금리인 연 20%를 초과할 수 없습니다.

    - 연체 발생 시 약정금리에 최대 3%p를 더한 연체이자가 부과되나, 이 역시 연 20%를 넘지 않습니다.


    [규제 및 권리 고지]

    - DSR 규제: 장기카드대출(카드론)은 DSR 산정 대상입니다. 제2금융권 기준에 따라 연간 원리금 상환액이 연소득의 50%를 초과할 경우
    대출 한도가 제한될 수 있습니다.

    - 금리인하요구권: 취업, 승진, 신용점수 상승 등 신용 상태가 개선된 고객님은 당사에 금리 인하를 요청할 수 있는 권리가 있습니다.

    - 책임 있는 금융: 고객님의 신용 상태와 상환 능력을 초과하는 과도한 대출은 가계 경제에 부담이 될 수 있으므로 주의하시기 바랍니다.


    상세한 약관은 ''장기카드대출(카드론): 약관''을 통해 확인하십시오.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 5ed5c2de-e19e-5632-aa5a-b1747d753d27
  title: '장기카드대출(카드론): 금리·요율 안내'
  body: '장기카드대출(카드론)에 적용되는 금리 체계입니다.


    [적용 금리]

    - 대출 금리(연, 하한): 5.9%

    - 대출 금리(연, 상한): 19.9%


    [금리 결정 및 변동 요인]

    - 개인별 차등 적용: 위 범위 내에서 고객님의 신용등급, 소득 수준, 기존 부채 현황 등을 종합적으로 평가하여 최종 금리가 결정됩니다.

    - 변동 요인: 시장 금리의 변동이나 고객님의 신용 상태 변화에 따라 금리가 조정될 수 있습니다.

    - 법적 한도: 모든 금리는 법정 최고금리인 연 20% 이내에서 책정됩니다.


    정확한 적용 금리는 신청 시 본인 인증 후 조회 가능하며, 신용 상태 개선 시 금리인하요구권을 통해 조정을 요청하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 3728b5a5-af6a-5407-a689-bc1f4eaefab0
  title: '장기카드대출(카드론): 진행 중인 이벤트'
  body: '여울카드를 애용하시는 우수 고객님을 위해 장기카드대출(카드론) 특별 금리 혜택 이벤트를 진행합니다.


    [이벤트 내용]

    - 대상: 전월 이용 실적 100만원 이상 및 신용등급 우수 고객

    - 혜택: 장기카드대출(카드론) 신규 신청 시, 적용 금리에서 0.5%p 추가 감면 혜택 제공

    - 기간: 2025년 6월 1일부터 2025년 8월 31일까지


    [유의 사항]

    - 본 혜택은 이벤트 기간 내 신규 계약 건에 한해 적용됩니다.

    - 금리 감면 후에도 최종 금리는 하한선인 5.9% 미만으로 내려갈 수 없습니다.

    - 상세 조건 충족 여부는 상담원을 통해 확인해 주십시오.'
  domain: lending_mortgage
