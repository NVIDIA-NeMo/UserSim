- id: 7b6b0a4e-969c-5a2c-a98f-a38925e069be
  title: '장기카드대출(카드론): 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자금 수요에 따라 단기카드대출(현금서비스)과 장기카드대출(카드론) 중 적합한 상품을 제안하십시오.


    - 단기카드대출(현금서비스): 매우 짧은 기간 동안 소액의 현금이 급히 필요할 때 유리합니다. 하지만 상환 기간이 짧아 매달 결제 부담이 클
    수 있습니다.

    - 장기카드대출(카드론): 비교적 큰 금액을 장기간 나누어 갚고자 할 때 적합합니다. 특히 중도상환수수료율 0%가 적용되어 언제든 원금을 상환할
    수 있다는 점이 가장 큰 장점입니다.


    **추천 대상**

    - 일시적인 자금 부족을 해결하고 안정적으로 분할 상환하시려는 고객님께는 장기카드대출(카드론)을 추천하십시오.

    - 며칠 내로 바로 상환 가능한 소액의 현금이 필요하신 고객님께는 단기카드대출(현금서비스)가 더 효율적일 수 있습니다.'
  domain: lending_mortgage
