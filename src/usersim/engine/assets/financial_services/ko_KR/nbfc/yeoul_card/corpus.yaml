- id: 0913adb5-5448-5fba-9c18-3394173b0bca
  title: '장기카드대출(카드론): 안전한 이용을 위한 수칙'
  body: '여울카드는 고객님의 소중한 금융 정보를 보호하기 위해 최선을 다하고 있습니다. 장기카드대출(카드론) 이용 시 다음의 보안 수칙을 반드시
    준수하여 주십시오.


    1. 본인 확인 절차 안내

    여울카드는 모든 상태 변경 작업이나 개인정보 조회 전, 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다.


    2. 절대로 요청하지 않는 정보

    상담원을 포함한 당사의 임직원은 어떠한 경우에도 고객님의 카드 번호, CVV, 비밀번호, 주민등록번호 전체를 요청하지 않습니다. 만약 이러한
    정보를 요구하는 연락을 받으셨다면 즉시 통화를 종료하십시오.


    3. 사칭 문자 및 메일 주의

    저금리 대환 대출이나 한도 증액을 미끼로 외부 링크 클릭이나 앱 설치를 유도하는 메시지는 금융 사기일 가능성이 매우 높습니다. 출처가 불분명한
    링크는 절대 클릭하지 마십시오.


    4. 이상 징후 발견 시 조치

    본인이 신청하지 않은 대출 실행 문자나 알림을 받으신 경우, 즉시 고객센터로 신고하여 주십시오. 부정사용 보상은 관련 법령과 약관에 따라 신속히
    처리해 드리겠습니다.'
