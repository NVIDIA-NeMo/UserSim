- id: 1aa04000-8e1f-5f19-8b54-68ffba267e14
  title: get_accounts 사용 기준
  body: '고객이 보유한 계좌 및 카드 목록을 확인하여 후속 업무를 처리하기 위한 절차입니다. 상담원은 반드시 다음 단계에 따라 업무를 수행하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다. 필요 시 고객이 제시한 계좌나
    카드의 마지막 4자리를 추가로 활용하십시오.

    2. 본인 인증이 완료되면 `get_accounts` 도구를 호출하여 고객의 계좌 목록(account_id, 유형, 마지막 4자리, 잔액,
    상태)과 보유 카드 목록(card_id)을 조회합니다.

    3. 고객이 특정 계좌나 카드에 대해 문의하는 경우, `get_accounts`를 통해 확인된 마지막 4자리 정보와 대조하여 정확한 `account_id`
    또는 `card_id`를 식별합니다.

    4. 식별된 ID는 이후 다른 도구를 사용하여 거래 내역 조회, 한도 변경, 카드 정지 등의 작업을 수행할 때 필수 식별자로 사용합니다.


    본 절차는 고객의 개인정보를 보호하고 정확한 대상 계좌에 서비스를 제공하기 위한 필수 과정입니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: yeoul_card
- id: f8ef8ed3-4403-5aee-96de-fefa7f5ad88c
  title: get_accounts 도구 설명서
  body: '상담원이 `get_accounts` 도구를 호출하여 인증된 고객이 보유한 모든 계좌와 카드의 목록을 조회합니다.


    - **호출 방식**: 상담원이 도구를 직접 호출하며, 별도의 입력 인자는 필요하지 않습니다.

    - **사전 조건**: `verify_identity`를 통해 고객의 본인 인증이 완료된 상태여야 합니다.

    - **반환 값**: 인증된 고객의 계좌 ID(account_id), 계좌 유형, 계좌 번호 마지막 4자리, 현재 잔액, 계좌 상태 및 보유한
    카드 ID(card_id) 목록을 반환합니다.


    이 도구는 고객이 제공한 계좌/카드 번호 끝자리를 통해 시스템상의 정확한 ID를 찾아내어 다른 금융 서비스를 제공하기 위한 기초 단계로 사용됩니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: yeoul_card
- id: 2332213c-668c-58c8-b16e-17c74cf9a7f3
  title: update_contact_info 사용 기준
  body: '고객의 연락처, 주소 등 등록된 개인정보를 변경하기 위한 절차입니다. 상담원은 다음의 단계를 엄격히 준수하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 완료합니다. 본인 인증 없이는 어떠한 개인정보
    변경도 수행할 수 없습니다.

    2. 고객으로부터 변경하고자 하는 최신 연락처 정보를 정확히 확인합니다.

    3. 확인된 정보를 바탕으로 `update_contact_info` 도구를 호출하여 시스템에 반영합니다.

    4. 정보 변경이 정상적으로 처리되었음을 고객에게 안내하고, 변경된 정보로 안내문 등이 발송될 예정임을 고지합니다.


    개인정보 변경은 보안상 매우 민감한 작업이므로, 반드시 본인 인증 단계를 거친 후 진행하십시오. 상세한 등록 정보 변경 방법은 ''여울 신용카드:
    등록 정보 변경'' 문서를 참고하시기 바랍니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: yeoul_card
- id: 2905bc8d-98df-56c8-8287-9b48a09d8836
  title: update_contact_info 도구 설명서
  body: '상담원이 `update_contact_info` 도구를 사용하여 인증된 고객의 연락처 정보를 최신 상태로 갱신합니다.


    - **호출 방식**: 상담원이 도구를 직접 호출합니다.

    - **입력 인자**: 고객이 제공한 최신 연락처 정보(전화번호, 이메일, 주소 등)를 인자로 전달합니다.

    - **사전 조건**: `verify_identity`를 통해 고객의 본인 인증이 완료된 상태여야 합니다.

    - **효과**: 시스템에 등록된 고객의 연락처 정보가 입력된 값으로 업데이트됩니다.


    상담원은 고객으로부터 직접 확인한 정보만을 입력해야 하며, 임의로 정보를 수정해서는 안 됩니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: yeoul_card
- id: f28940bd-2b64-5a38-b543-b75c04024c1f
  title: get_statements 사용 기준
  body: '고객이 요청한 이용 명세서를 조회하여 안내하기 위한 절차입니다. 상담원은 다음의 단계를 따르십시오.


    1. 고객의 성함과 생년월일을 통해 `verify_identity` 도구를 호출하여 본인 인증을 수행합니다.

    2. 명세서 조회를 위해 대상 계좌의 ID가 필요합니다. 만약 `account_id`를 모르고 고객이 계좌 끝자리만 알고 있다면, `get_accounts`
    도구를 호출하여 해당 끝자리에 맞는 `account_id`를 먼저 식별하십시오.

    3. 식별된 `account_id`를 사용하여 `get_statements` 도구를 호출해 해당 계좌의 이용 명세서를 조회합니다.

    4. 조회된 명세서 내용을 바탕으로 고객이 요청한 기간의 이용 금액, 결제 예정일, 청구 내역 등을 상세히 안내합니다.


    명세서 조회 시 개인정보 유출 방지를 위해 반드시 본인 인증을 완료한 후 진행하며, 타인에게 정보가 제공되지 않도록 주의하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: yeoul_card
- id: 1dc43e7a-ea90-52ff-9248-b437035838d3
  title: get_statements 도구 설명서
  body: '상담원이 `get_statements` 도구를 사용하여 특정 계좌의 이용 명세서를 조회합니다.


    - **호출 방식**: 상담원이 도구를 직접 호출합니다.

    - **입력 인자**: 조회를 원하는 계좌의 고유 식별자인 `account_id`가 필요합니다.

    - **사전 조건**: `verify_identity`를 통해 고객의 본인 인증이 완료된 상태여야 합니다.

    - **반환 값**: 해당 계좌에 대한 기간별 이용 명세서 내역을 반환합니다.


    `account_id`는 `get_accounts` 도구를 통해 고객이 보유한 계좌 목록에서 확인할 수 있습니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: yeoul_card
- id: 36591986-83aa-5792-9a3a-03e07568e1bd
  title: set_alerts 사용 기준
  body: '고객이 결제 예정 금액, 이용 한도 도달, 카드 사용 알림 등의 알림 설정을 변경하고자 할 때 수행하는 절차입니다.


    1. 고객의 성함과 생년월일을 통해 `verify_identity` 도구를 호출하여 본인 인증을 완료합니다.

    2. 알림 설정을 적용할 대상 계좌를 확인합니다. `account_id`를 모르는 경우 `get_accounts` 도구를 호출하여 고객이 지정한
    계좌의 ID를 식별하십시오.

    3. 고객이 원하는 알림의 종류(예: 결제일 안내, 한도 초과 알림)와 수신 방법(앱 푸시, SMS 등)을 구체적으로 확인합니다.

    4. 식별된 `account_id`와 고객이 선택한 알림 설정 값을 `set_alerts` 도구에 입력하여 설정을 변경합니다.

    5. 설정이 완료되었음을 안내하고, 이후부터 해당 설정에 따라 알림이 발송됨을 고지합니다.


    정확한 계좌에 알림이 설정될 수 있도록 `get_accounts`를 통한 ID 확인 과정을 누락하지 마십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: yeoul_card
- id: e439f3dd-cec4-564f-ba9f-aebfde4dc706
  title: set_alerts 도구 설명서
  body: '상담원이 `set_alerts` 도구를 사용하여 특정 계좌에 대한 알림 설정(Push, SMS 등)을 구성하거나 변경합니다.


    - **호출 방식**: 상담원이 도구를 직접 호출합니다.

    - **입력 인자**: 알림을 설정할 계좌의 `account_id`와 고객이 요청한 구체적인 알림 설정 옵션(preferences)이 필요합니다.

    - **사전 조건**: `verify_identity`를 통해 고객의 본인 인증이 완료된 상태여야 합니다.

    - **효과**: 지정된 계좌에 대해 고객이 선택한 조건의 알림이 활성화 또는 비활성화됩니다.


    정확한 `account_id`를 입력하기 위해 사전에 `get_accounts` 도구를 활용하여 계좌 목록을 확인하십시오.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: yeoul_card
