  institution_id: yeoul_card
- id: 0547ede5-2618-5bee-8ccb-56a0e4439889
  title: '단기카드대출(현금서비스): 가입과 이용 조건'
  body: 'Q: 단기카드대출(현금서비스)를 이용하려면 어떤 조건이 필요한가요?

    A: 여울 신용카드를 보유하고 계신 고객님 중, 당사의 내부 심사 기준을 충족하여 현금서비스 한도를 부여받으신 분이라면 별도의 가입 절차 없이
    이용 가능하십니다.


    Q: 이용 가능한 최대 금액은 얼마인가요?

    A: 단기카드대출(현금서비스)의 이용한도 최고액은 5,000,000원입니다. 다만, 고객님의 신용 상태와 이용 실적에 따라 개별적으로 부여된
    한도 내에서만 이용하실 수 있습니다.


    Q: 적용되는 금리는 어떻게 되나요?

    A: 현금서비스 금리는 연 18.2%가 적용됩니다. 구체적인 금리 적용 방식은 ''단기카드대출(현금서비스): 금리·요율 안내''에서 확인하실
    수 있습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: faq
  source_authority: official
