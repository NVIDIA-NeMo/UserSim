- id: 908d451e-e690-5ec6-8145-d8c49c566aba
  title: '단기카드대출(현금서비스): 당사의 비슷한 상품과의 비교'
  body: '단기카드대출(현금서비스)과 장기카드대출(카드론)의 차이점을 안내해 드립니다.


    - 단기카드대출(현금서비스): 소액의 자금을 빠르게 확보하여 단기간 내에 상환하는 데 적합합니다. 현금서비스 금리(연) 18.2%가 적용되며
    이용한도 최고액은 5,000,000원입니다.

    - 장기카드대출(카드론): 상대적으로 큰 금액을 장기로 빌려 사용하며 중도상환수수료 부담이 없습니다. 단, 카드론은 DSR(총부채원리금상환비율)
    규제 대상에 포함되어 한도 계산 시 영향을 받습니다.


    단기적인 자금 공백을 메우려는 고객님께는 단기카드대출(현금서비스)을, 계획적인 장기 자금 운용이 필요한 고객님께는 ''장기카드대출(카드론):
    상품 개요'' 상품을 추천합니다.'
