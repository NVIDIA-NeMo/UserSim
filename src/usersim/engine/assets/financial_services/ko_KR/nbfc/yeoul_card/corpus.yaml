- id: 337edd95-0763-5e8d-9d04-2ec30b894cf6
  title: 수수료·요금 안내
  body: '여울카드는 자금 운용 비용과 리스크 관리를 위해 필수적인 수수료 체계를 운영하고 있으며, 모든 비용 구조를 투명하게 공개하여 고객님의
    선택권을 보장하고 있습니다.


    수수료는 이용하시는 상품의 종류(신용카드, 리볼빙, 할부, 단기카드대출, 장기카드대출)와 고객님의 신용 상태, 이용 조건에 따라 다르게 책정됩니다.
    구체적인 상품별 수수료율은 각 상품의 안내서 및 금리·요율 안내 문서를 확인하시기 바랍니다.


    단, 당사의 우수 고객 혜택을 적용받으시거나 특정 프로모션 조건을 충족하신 경우에는 수수료 면제 또는 감면 혜택이 제공될 수 있습니다.'
  domain: payments
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 0964da31-5aec-5496-ab9f-4f209e1674eb
  title: 자주 묻는 질문
  body: '여울카드 이용과 관련하여 자주 문의하시는 내용을 안내해 드립니다.


    **질문: 여울카드 고객센터의 운영 시간과 상담 채널은 어떻게 됩니까?**

    답변: 여울카드는 한국 표준시(KST)를 기준으로 운영되며, 모바일 앱, 공식 웹사이트 및 고객센터를 통해 전방위적인 지원 체계를 구축하고
    있습니다.


    **질문: 복잡한 요청이나 민원이 발생했을 때는 어떻게 처리되나요?**

    답변: 일반 상담원이 해결하기 어려운 전문적인 요청이나 민원은 내부의 단계별 에스컬레이션 절차에 따라 해당 분야의 전문 담당자가 배정되어 신속하고
    정확하게 처리해 드립니다.


    **질문: 본인 확인은 어떤 방식으로 진행되나요?**

    답변: 고객님의 소중한 정보 보호를 위해 성함과 생년월일 확인을 통한 본인 인증 절차를 거친 후 업무 처리가 가능합니다.'
  domain: payments
  product_category: general
  document_type: faq
  source_authority: official
