- id: 53d4c7b2-e2ed-5d5f-99cb-2e86b38dd21d
  title: '장기카드대출(카드론): 이 상품을 사칭한 사기 주의'
  body: '최근 여울카드의 장기카드대출(카드론) 상품을 사칭하여 저금리 대환 대출을 제안하거나, 대출 승인을 조건으로 선입금을 요구하는 금융
    사기가 발생하고 있습니다. 고객 여러분께서는 다음의 주의 사항을 반드시 숙지하시어 피해를 입지 않도록 유의하시기 바랍니다.


    여울카드는 어떤 경우에도 고객님께 카드 번호, CVV 번호, 비밀번호, 주민등록번호 전체를 요구하지 않습니다. 특히 대출 실행 전 수수료나
    보증금 명목으로 특정 계좌에 입금을 요청하는 것은 명백한 사기 행위입니다.


    만약 정체불명의 문자 메시지나 전화를 통해 상품 안내를 받으셨거나, 의심스러운 링크(URL)를 클릭하신 경우 즉시 저희 고객센터로 신고해 주십시오.
    이미 개인정보가 유출되었거나 피해가 발생했다고 판단되신다면, 신속하게 이용 정지 조치를 취하시고 관련 법령 및 약관에 따라 부정사용 보상 절차를
    밟으시기 바랍니다.


    여울카드는 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 신뢰할 수 있는 공식 채널을 통해서만 상품 정보를 확인하십시오.'
