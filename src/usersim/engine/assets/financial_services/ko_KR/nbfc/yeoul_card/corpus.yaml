  title: '단기카드대출(현금서비스): 진행 중인 이벤트'
  body: '여울카드가 현대 직장인 고객님의 스마트한 금융 생활을 지원하기 위해 단기카드대출(현금서비스) 이용 고객 대상 한도 최적화 캠페인을
