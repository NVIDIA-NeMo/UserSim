- id: d5388f2f-949f-5cd9-9ba5-470126ab7e5c
  title: '리볼빙(일부결제금액이월약정): 수수료와 비용'
  body: '리볼빙(일부결제금액이월약정) 이용 시 발생하는 수수료와 비용에 대해 안내해 드립니다.


    Q: 리볼빙 수수료는 어떻게 책정되나요?

    A: 이월된 결제 금액에 대해 리볼빙 수수료율(연) 16.5%가 적용됩니다. 수수료는 매월 이월된 잔액을 기준으로 계산되어 청구됩니다.


    Q: 최소결제비율이란 무엇이며, 비용에 어떤 영향을 주나요?

    A: 리볼빙 최소결제비율은 10%입니다. 이번 달 결제해야 할 금액의 10%만 납부하면 연체로 처리되지 않으나, 나머지 90%의 금액이 다음
    달로 이월되면서 16.5%의 수수료가 부과되어 총 상환액이 늘어나게 됩니다.


    Q: 수수료를 줄일 수 있는 방법이 있습니까?

    A: 약정된 결제일 이전이라도 이월된 금액을 선결제하시면, 선결제 시점까지의 수수료만 부과되므로 전체적인 비용 부담을 낮출 수 있습니다.


