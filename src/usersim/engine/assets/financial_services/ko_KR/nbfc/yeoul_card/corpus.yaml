- id: b77913e2-26ff-5a87-9676-0a809920c441
  title: '할부: 가입과 이용 조건'
  body: 'Q: 할부 서비스를 이용하기 위해 별도의 가입 절차가 필요한가요?

    A: 아니요, 여울 신용카드를 보유하고 계신 고객님이라면 별도의 가입 절차 없이 결제 시 할부 개월 수를 선택하여 즉시 이용하실 수 있습니다.


    Q: 할부 이용 가능 금액에 제한이 있습니까?

    A: 고객님의 총 이용 한도 내에서 가능합니다. 다만, 할부 기간 3개월 이상, 금액 200,000원 이상의 거래부터는 법적 철회권과 항변권이
    적용됩니다.


    Q: 최대 몇 개월까지 할부를 설정할 수 있습니까?

    A: 여울카드는 최대 24개월까지 할부 이용이 가능합니다. 상세한 한도 조정이 필요하신 경우 고객센터를 통해 요청해 주십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 4546005a-3932-5462-ace2-3818123064f9
  title: '할부: 자주 하는 업무의 처리 절차'
  body: '일시불로 결제한 내역을 할부로 전환하거나, 할부 이용 건을 관리하는 일반적인 절차입니다.


    1. 본인 확인

    고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 본인 인증 후 업무 처리가 가능합니다.


    2. 서비스 요청

    전환하고자 하는 결제 건의 날짜와 금액, 혹은 가맹점명을 말씀해 주십시오. (예: ''어제 결제한 500,000원 일시불 건을 할부로 바꾸고
    싶습니다'')


    3. 조건 설정 및 확인

    원하시는 할부 개월 수를 말씀해 주십시오. 최대 24개월까지 설정 가능하며, 선택하신 기간에 따라 적용될 할부수수료율(연 9.9% ~ 19.9%)과
    월 예상 납부 금액을 안내해 드립니다.


    4. 최종 승인 및 완료

    안내해 드린 수수료와 상환액에 동의하시면 전환 처리를 완료합니다. 처리가 완료되면 등록된 연락처로 확인 메시지가 발송되며, 다음 명세서부터
    분할 청구됩니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 66ef2d19-076e-5f2d-9cbd-be2d97820806
  title: '할부: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 청구된 할부 수수료나 회차가 예상과 다르다고 말씀하시는 경우, 다음 순서에 따라 점검하십시오.


    - 증상: 고객이 ''할부 수수료가 너무 많이 나왔다''거나 ''남은 회차가 잘못되었다''고 주장함


    - 점검 및 확인 절차

    1. 계약 조건 확인: 해당 거래의 최초 할부 개월 수(최대 24개월)와 약정된 수수료율(연 9.9% ~ 19.9%)을 확인합니다.

    2. 수수료 계산 검증: 잔액에 대해 정확한 수수료율이 적용되었는지, 중도에 일부 선결제가 이루어져 원금이 변동되었는지 확인합니다.

    3. 무이자 적용 여부: 가맹점의 무이자 행사 상품이었으나 유이자 할부로 잘못 설정되었는지 확인합니다.


    - 해결 방법

    - 단순 계산 착오인 경우: 즉시 정정 처리하고 사과 안내를 드립니다.

    - 고객의 항변권 행사 요청 시: 할부 기간 3개월 이상, 금액 200,000원 이상인 거래로서 상품 하자 등의 사유가 명확하다면 접수 절차를
    안내합니다.


    - 에스컬레이션 및 답변 기한

    복잡한 수수료 분쟁이나 항변권 행사의 경우 전문 담당자에게 에스컬레이션하십시오. 관련 법령에 따라 항변 신청 접수 후 7영업일 이내에 반드시
    최종 답변을 드려야 합니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: b3b79abb-6a16-5dda-94aa-f3f1080b25a7
  title: '단기카드대출(현금서비스): 상품 개요'
  body: '단기카드대출(현금서비스)은 일상생활 중 급격한 자금 수요가 발생했을 때, 복잡한 절차 없이 빠르게 현금을 확보할 수 있도록 돕는 여울카드의
    단기 대출 상품입니다. 현대 직장인 고객님의 스마트한 소비 생활과 일시적인 자금 흐름의 불균형을 해결하는 신뢰받는 금융 파트너로서 본 서비스를
    제공합니다.


    본 상품은 신속한 한도 제공과 투명한 수수료 체계를 지향하며, 고객님의 신용 상태와 상환 능력을 고려하여 책임 있는 금융 서비스를 제공합니다.
    이용 시 적용되는 핵심 조건은 다음과 같습니다.


    - 현금서비스 금리(연): 18.2%

    - 현금서비스 이용한도 최고액: 5,000,000원


    모든 수수료와 금리 구조는 투명하게 공개되며, 우수 고객 혜택이나 특정 프로모션 조건 충족 시 수수료 감면 혜택을 제공받으실 수 있습니다.
    자세한 이용 방법은 ''단기카드대출(현금서비스): 가입과 이용 시작''에서 확인하시기 바랍니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: product_sheet
  source_authority: official
