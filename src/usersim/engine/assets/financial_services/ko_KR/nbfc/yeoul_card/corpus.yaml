- id: 797f6a75-1bf9-5153-bf0a-6a7637d7da55
  title: '장기카드대출(카드론): 로그인하거나 접속할 수 없을 때'
  body: '장기카드대출(카드론) 내역 조회나 신청을 위해 앱/웹에 접속하시려는데 어려움이 있으신 경우, 다음 순서대로 확인해 주십시오.


    1. 증상 확인

    - 로그인 버튼을 눌러도 반응이 없거나 ''잘못된 접근''이라는 메시지가 표시되는 경우

    - 인증서 또는 비밀번호 오류 메시지가 반복적으로 나타나는 경우


    2. 확인 및 조치 사항

    - 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인해 주십시오.

    - 앱 버전 확인: 최신 버전으로 업데이트되어 있는지 확인하십시오. 구버전의 경우 보안 정책으로 인해 접속이 제한될 수 있습니다.

    - 계정 잠금 확인: 비밀번호를 여러 번 잘못 입력하여 계정이 일시 잠금 상태인지 확인하십시오.


    3. 해결 방법

    - 비밀번호 재설정: 본인 인증(성함, 생년월일 등) 후 비밀번호를 다시 설정하여 접속을 시도하십시오.

    - 캐시 삭제: 브라우저나 앱의 캐시 및 쿠키를 삭제한 후 다시 접속하십시오.


    4. 에스컬레이션

    위 조치 후에도 접속이 불가한 경우, 상담원에게 증상을 말씀해 주십시오. 당사 기술 전문 담당자가 계정 상태를 점검하고 해결 방법을 안내해
    드리며, 처리 결과는 영업일 기준 1~3일 이내에 안내해 드리겠습니다.'
