- id: ce3408c4-5d99-53a3-b187-546647034a62
  title: '장기카드대출(카드론): 해지·변경·상품 전환'
  body: '장기카드대출(카드론)의 대출금을 전액 상환하여 계약을 해지하거나, 상환 조건을 변경하는 절차를 안내해 드립니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 본인 인증 단계: 상담원에게 성함과 생년월일을 말씀하시어 본인 확인을 완료하십시오.

    2. 요청 사항 전달: 대출금 전액 상환을 통한 해지, 또는 상환 기간 변경 및 상품 전환 요청을 말씀하십시오.

    3. 정산 금액 확인: 상담원이 현재까지 발생한 원금과 이자를 합산한 최종 정산 금액을 안내해 드립니다. 본 상품은 중도상환수수료율 0%가
    적용되므로, 별도의 중도상환수수료는 추가되지 않습니다.

    4. 상환 처리 및 완료: 안내받은 금액을 결제 계좌에서 출금하거나 입금하십시오. 처리가 완료되면 대출 해지 또는 변경 완료 통보를 받게 되며,
    이로써 모든 절차가 마무리됩니다.


    만약 신용 상태가 개선되어 금리를 낮추고자 하시는 경우에는 금리인하요구권을 행사하실 수 있으니 함께 문의해 주십시오.'
