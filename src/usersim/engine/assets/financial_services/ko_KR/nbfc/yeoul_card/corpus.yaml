  institution_id: yeoul_card
- id: 6797f237-7f6b-53ba-9fb6-c678b504e6c9
  title: '장기카드대출(카드론): 개인정보 처리 안내'
  body: '여울카드는 장기카드대출(카드론) 서비스 제공을 위해 다음과 같이 고객님의 개인정보를 처리합니다.


    1. 수집 및 이용 목적

    - 대출 심사 및 한도 산정: 신용 상태 확인, DSR(총부채원리금상환비율) 계산, 상환 능력 평가

    - 계약 체결 및 유지: 대출 약정 체결, 대출금 입금, 원리금 상환 관리

    - 법적 의무 이행: 여신전문금융업법 및 금융소비자 보호에 관한 법률에 따른 보고 및 기록 보존


    2. 처리하는 항목

    - 기본 정보: 성함, 생년월일, 연락처, 주소

    - 금융 정보: 소득 증빙 자료, 타사 대출 내역, 신용 점수, 계좌 번호


    3. 보유 및 이용 기간

    개인정보 보호법 및 관련 법령에 따라 대출 계약 종료 후 일정 기간(통상 5년) 동안 보관하며, 기간 만료 후에는 안전하게 파기합니다.


    4. 고객의 권리

    고객님께서는 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 다만, 대출 계약이 유지 중인 경우 서비스 제공을 위해 필수적인
    정보의 삭제는 제한될 수 있습니다.


    여울카드는 고객님의 정보를 엄격히 관리하며, 동의 없이 제3자에게 제공하지 않습니다.'
