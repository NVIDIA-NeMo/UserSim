- id: 08eb838c-7b07-5c9d-846e-659329bfabc3
  title: '단기카드대출(현금서비스): 이용 방법과 절차'
  body: 'Q: 단기카드대출(현금서비스)는 어떻게 신청하나요?

    A: 여울카드 모바일 앱 또는 웹사이트의 ''대출'' 메뉴에서 신청하시거나, 고객센터 상담원을 통해 본인 확인 후 신청하실 수 있습니다.


    Q: 대출금은 언제, 어떻게 갚아야 하나요?

    A: 별도로 선결제를 하지 않으신 경우, 이용하신 원금과 연 18.2%의 금리로 계산된 이자가 다음 달 신용카드 결제일에 합산되어 청구됩니다.
    등록하신 결제 계좌에서 자동으로 출금됩니다.


    Q: 이용한 금액을 결제일 전에 미리 갚을 수 있나요?

    A: 네, 가능합니다. 선결제를 통해 이용 기간을 단축하면 그만큼 이자 부담을 줄일 수 있습니다. 앱이나 상담원을 통해 선결제 신청을 하십시오.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 07de5fd6-2f19-5c66-a690-7a2167f48cf3
  title: '단기카드대출(현금서비스): 자주 하는 업무의 처리 절차'
  body: '단기카드대출(현금서비스) 이용 고객께서 가장 자주 요청하시는 ''이자 절감을 위한 선결제 처리 절차''를 안내해 드립니다.


    1. 본인 인증: 상담원에게 성함과 생년월일을 말씀해 주십시오.

    2. 선결제 요청: 현재 이용 중인 단기카드대출(현금서비스) 잔액의 전부 또는 일부에 대해 선결제를 요청하십시오.

    3. 상환 금액 확인: 상담원이 오늘 날짜 기준으로 계산된 원금과 연 18.2% 금리에 따른 일할 계산 이자를 합산하여 안내해 드립니다.

    4. 결제 진행: 안내받으신 금액의 결제 방식을 선택하십시오(결제 계좌 즉시 출금 등).

    5. 처리 완료 확인: 결제가 완료되면 대출 잔액이 감소했음을 확인하시고, 남은 잔액과 다음 결제 예정 금액을 다시 안내받으십시오.


    이처럼 결제일 전에 미리 상환하시면 대출 이용 일수가 줄어들어 총 지불해야 할 이자 비용을 효과적으로 낮출 수 있습니다.'
  domain: lending_mortgage
