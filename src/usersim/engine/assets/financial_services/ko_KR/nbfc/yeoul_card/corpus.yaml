- id: dd782021-f650-56b8-90a8-05012acdda6c
  title: '여울 신용카드: 안전한 이용을 위한 수칙'
  body: '여울 신용카드를 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 본인 확인 절차 준수: 여울카드는 고객님의 정보 변경이나 상태 조회 전, 반드시 성함과 생년월일만을 확인하여 본인 인증을 수행합니다.

    2. 절대 요청하지 않는 정보: 여울카드는 어떠한 경우에도 카드 번호 전체, CVV 번호, 카드 비밀번호, 주민등록번호를 전화나 문자로 요청하지
    않습니다. 이러한 정보를 요구하는 연락을 받으셨다면 즉시 전화를 끊으십시오.

    3. 분실 및 도난 시 조치: 카드를 분실하거나 도난당하셨을 때는 즉시 신고하여 이용 정지 조치를 취하십시오. 신고 전후의 부정사용 보상은
    관련 법령과 당사 약관에 따라 처리됩니다.

    4. 의심스러운 거래 확인: 결제 내역 중 본인이 이용하지 않은 거래가 발견되면 즉시 고객센터로 알려주시기 바랍니다.


    상세한 보호 조치는 ''여울 신용카드: 부정사용으로부터 고객을 보호하기 위해'' 문서에서 확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_credit
