  institution_id: yeoul_card
- id: 1f70a43a-2a00-5f49-b6c5-761f2617400c
  title: '단기카드대출(현금서비스): 이 상품을 사칭한 사기 주의'
  body: '최근 여울카드의 단기카드대출(현금서비스) 상품을 사칭하여 고객님의 개인정보와 금융 정보를 가로채려는 금융 사기 시도가 보고되고 있습니다.
    고객님께서는 아래의 주의 사항을 반드시 확인하시어 피해를 입지 않도록 유의하시기 바랍니다.


    사기범들은 보통 ''정부 지원 저금리 대환 대출''이나 ''특별 한도 증액''을 미끼로 접근하며, 여울카드 상담원을 사칭하여 특정 앱 설치나
    링크 클릭을 유도합니다. 하지만 여울카드는 어떠한 경우에도 고객님께 카드 번호, CVV 번호, 비밀번호, 주민등록번호 전체를 요구하지 않습니다.


    본인 확인이 필요한 경우 오직 성함과 생년월일만을 확인하며, 그 외의 보안 정보는 절대 요청하지 않습니다. 만약 출처가 불분명한 문자 메시지나
    전화를 통해 단기카드대출(현금서비스) 이용을 권유받으셨다면 즉시 통화를 종료하시고 공식 고객센터로 확인하십시오.


    만약 부정 사용이 의심되거나 이미 정보를 제공하신 경우에는 즉시 분실 및 도난 신고를 접수하여 이용 정지 조치를 취하시기 바랍니다. 부정사용
    보상은 관련 법령과 당사 약관에 따라 신속하게 처리해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: c1fd9a73-1891-569a-907f-ea2f44d7c1df
  title: '단기카드대출(현금서비스): 한도·제한과 유의사항'
  body: '단기카드대출(현금서비스)는 급격한 자금 수요가 발생했을 때 빠르게 현금을 확보할 수 있도록 설계된 단기 대출 상품입니다. 상담원은
    고객 안내 시 다음의 한도 및 제한 사항을 정확히 고지하십시오.


    - 현금서비스 이용한도 최고액: 5,000,000원

    - 현금서비스 금리(연): 18.2%


    [주요 유의사항]

    1. 고금리 부담: 본 상품은 연 18.2%의 높은 금리가 적용되므로, 단기간 사용 후 신속히 상환하는 것이 경제적입니다.

    2. 신용도 영향: 단기카드대출의 빈번한 이용이나 과도한 금액 사용은 고객님의 신용 점수에 부정적인 영향을 미칠 수 있으며, 이는 향후 다른
    금융 상품 이용 시 한도나 금리에 영향을 줄 수 있습니다.

    3. 상환 구조: 대출 원금과 이용 기간에 따른 이자가 결제일에 청구됩니다. 상환이 지연될 경우 법정 최고금리 내에서 연체이자가 부과될 수
    있음을 명확히 안내하십시오.


    고객께서 상환에 어려움을 겪고 계신 경우에는 조기에 상담을 진행하고 채무조정 제도를 안내하여 고객의 금융 부담을 완화할 수 있도록 지원하십시오.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: product_sheet
  source_authority: official
  placeholder: true
