- id: 6e72954f-0bc4-5dc9-8b2a-6edfef427b68
  title: '리볼빙(일부결제금액이월약정): 가입과 이용 시작'
  body: '리볼빙(일부결제금액이월약정) 서비스 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 서비스 신청이 가능합니다.

    2. 서비스 신청: 리볼빙 서비스 가입을 요청하십시오. 담당자가 상품의 구조와 수수료 체계를 설명해 드릴 것입니다.

    3. 결제 비율 설정: 매달 납부하실 최소결제비율을 설정하십시오. 여울카드의 리볼빙 최소결제비율은 10%이며, 이보다 높은 비율로 설정하여
    이월 금액을 줄이실 수 있습니다.

    4. 최종 확인: 설정하신 결제 비율과 리볼빙 수수료율(연) 16.5%에 대한 안내를 확인하신 후 가입 동의를 해주십시오.


    가입이 완료되면 다음 결제일부터 설정하신 비율만큼만 청구되며, 나머지 금액은 자동으로 이월됩니다. 서비스의 전반적인 특징은 ''리볼빙(일부결제금액이월약정):
    상품 개요''에서 확인하실 수 있습니다.'
