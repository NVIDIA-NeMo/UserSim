- id: f98ef3c3-8db3-51c9-9fc0-0b3e9319d669
  title: '장기카드대출(카드론): 예상과 다른 수수료나 금액'
  body: '고객님께서 생각하신 금액보다 상환액이나 수수료가 높게 청구되었다고 느끼시는 경우, 다음의 원인을 확인해 보시기 바랍니다.


    - 예상 원인 1: 연체 이자 발생

    결제일에 원리금이 정상적으로 납부되지 않은 경우, 약정금리에 최대 3%p가 가산된 연체 이자가 부과됩니다. 단, 연체 이자를 포함한 최종 금리는
    연 20%를 초과할 수 없습니다.

    - 예상 원인 2: 금리 적용 시점의 차이

    대출 실행 시 적용된 금리가 연 5.9%에서 연 19.9% 사이의 범위 내에서 고객님의 당시 신용도에 따라 결정되었는지 확인하십시오.

    - 예상 원인 3: DSR 규제 및 한도 영향

    대출 총액이 1억원 이상인 경우 DSR(총부채원리금상환비율) 규제가 적용되어 상환액 산정에 영향을 줄 수 있습니다.


    조치 방법: 먼저 최근 결제 내역과 금리 적용 현황을 확인하십시오. 만약 계산 방식에 오류가 있다고 판단되시면 전문 담당자에게 에스컬레이션
    요청을 하십시오. 담당자가 상세 산출 내역을 검토하여 7영업일 이내에 정확한 안내를 드리겠습니다.'
