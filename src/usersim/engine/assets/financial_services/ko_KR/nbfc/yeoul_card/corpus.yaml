- id: e053cd84-2925-55fc-9dd8-6e305d47cc78
  title: '여울 신용카드: 진행 중인 이벤트'
  body: '여울카드를 이용하시는 고객님을 위해 ''첫해 연회비 지원 이벤트''를 진행합니다.


    **이벤트 상세 내용**

    - 기간: 2026년 1월 1일부터 2026년 6월 30일까지

    - 대상: 이벤트 기간 내 여울 신용카드를 신규 발급받으신 고객님

    - 혜택: 신규 가입 고객 대상 첫해 연회비 15,000원 전액 면제

    - 조건: 카드 발급 후 3개월 이내 누적 이용 금액 300,000원 이상 달성 시 적용


    본 이벤트는 당사의 수수료 감면 정책에 따라 제공되며, 조건 충족 시 다음 달 청구서에서 연회비가 차감됩니다. 혜택 적용 여부는 ''여울 신용카드:
    진행 상황과 내역 확인''에서 확인하실 수 있습니다.'
