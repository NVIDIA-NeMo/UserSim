- id: 8adad519-4e8c-5852-b5da-9aa0ebe6397d
  title: update_beneficiary 사용 기준
  body: '장기카드대출(카드론) 신청 후 대출금을 입금받을 계좌를 변경하고자 하는 고객에게는 다음의 절차를 적용하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 완료합니다.

    2. `get_accounts` 도구를 통해 현재 지정된 입금 계좌의 `account_id`를 확인합니다.

    3. 대출금을 수령할 새로운 은행 이름과 계좌번호를 고객으로부터 확인합니다.

    4. `update_beneficiary` 도구를 사용하여 입금 계좌 정보를 변경합니다.

    5. 입금 계좌 변경이 정상적으로 처리되었음을 안내하고, 대출 실행 시 해당 계좌로 자금이 입금될 것임을 확인시켜 드립니다.


    보안을 위해 반드시 본인 명의의 계좌로만 변경이 가능함을 안내하시고, 타인 명의 계좌로의 변경 요청은 거절하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: yeoul_card
