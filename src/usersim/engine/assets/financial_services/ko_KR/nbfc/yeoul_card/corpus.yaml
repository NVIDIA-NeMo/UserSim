- id: 97b0da13-c653-59cf-ab95-2d3569887412
  title: request_limit_change 사용 기준
  body: '고객의 카드 이용한도 또는 현금서비스 한도 조정 요청을 처리하는 절차입니다. 한도 상향의 경우 고객의 신용 상태 및 상환 능력을 고려한
    심사 과정이 필요하며, 결과에 따라 요청하신 한도가 제공되지 않을 수 있습니다.


    처리 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 사용하여 고객이 제시한 카드 또는 계좌의 마지막 4자리 숫자를 바탕으로 정확한 `account_id`를
    확인하십시오.

    3. 한도 조정의 종류(상향 또는 하향)와 고객이 희망하는 구체적인 한도 금액을 확인하십시오.

    4. 한도 상향 요청 시, 내부 심사 기준에 따라 한도 제공 여부가 결정됨을 정중히 안내하십시오.

    5. 확인된 `account_id`, 한도 유형, 요청 금액을 바탕으로 `request_limit_change` 도구를 호출하여 접수를 완료하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_limit_change
  institution_id: yeoul_card
- id: fa2bb461-2a28-555c-aa91-8a66d341a1f0
  title: request_limit_change 도구 설명서
  body: "이 도구는 고객의 신용카드 이용한도나 단기카드대출(현금서비스) 한도의 변경을 신청하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이\
    \ 대화 중 직접 호출하여 실행합니다.\n- 필요 인자:\n  - `account_id`: `get_accounts` 도구를 통해 확인된 고객의\
    \ 계좌/카드 식별자입니다.\n  - `limit_type`: 변경하고자 하는 한도의 종류(예: 이용한도, 현금서비스 한도)입니다.\n  -\
    \ `requested_limit`: 고객이 요청한 희망 한도 금액입니다.\n\n본인 인증(`verify_identity`)이 완료된 상태에서만\
    \ 호출 가능하며, 한도 상향 요청의 경우 시스템 내부 심사 절차를 거쳐 최종 반영됩니다."
  domain: payments
