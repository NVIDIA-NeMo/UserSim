- id: 21ab88c3-c8be-5633-9399-f1c3c18b112d
  title: '리볼빙(일부결제금액이월약정): 진행 상황과 내역 확인'
  body: "현재 이용 중인 리볼빙(일부결제금액이월약정)의 이월 잔액과 부과된 수수료 내역을 확인하는 절차입니다.\n\n1. 본인 인증: 상담원에게\
    \ 성함과 생년월일을 말씀해 주십시오.\n2. 내역 요청: 현재 리볼빙으로 이월된 총 잔액과 이번 달에 부과된 리볼빙 수수료 내역 확인을 요청하십시오.\n\
    3. 세부 내용 확인: 상담원을 통해 다음의 항목을 확인하십시오.\n   - 이번 달 결제 금액 중 이월된 금액\n   - 적용된 리볼빙 수수료율(연\
    \ 16.5%)\n   - 다음 결제일에 청구될 예정인 원금과 수수료 합계액\n4. 확인 완료: 안내받으신 이월 금액과 수수료가 명세서의 내용과\
    \ 일치하는지 확인하시면 절차가 완료됩니다.\n\n상세한 한도 및 제한 사항은 '리볼빙(일부결제금액이월약정): 한도·제한과 유의사항'에서 확인하실\
    \ 수 있습니다."
