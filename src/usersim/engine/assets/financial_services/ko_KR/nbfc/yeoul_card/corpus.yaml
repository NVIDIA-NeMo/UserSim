  institution_id: yeoul_card
- id: fb4748f8-241b-57d9-97a8-81f4b97ef626
  title: '여울 신용카드: 해지·변경·상품 전환'
  body: '여울 신용카드의 해지, 정보 변경 또는 다른 상품으로의 전환을 원하실 경우 다음의 절차를 따라 주십시오.


    1. 본인 확인 수행: 상담원에게 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 본인 인증이 완료된 후 업무 처리가 가능합니다.


    2. 요청 사항 전달: 카드 해지, 이용 한도 변경, 또는 다른 상품으로의 전환 중 원하시는 업무를 말씀해 주십시오.


    3. 정산 내역 확인: 해지나 전환 시, 현재까지 이용하신 금액과 미결제 잔액, 그리고 연회비 15,000원을 포함한 정산 금액을 안내받으십시오.
    모든 잔액이 정산되어야 최종 처리가 완료됩니다.


    4. 최종 승인 및 확인: 상담원을 통해 처리 결과와 변경된 사항을 확인하십시오. 처리가 완료되면 등록된 연락처로 안내 메시지가 발송됩니다.


    만약 단순한 정보 수정이 필요하신 경우에는 ''여울 신용카드: 등록 정보 변경'' 안내를 참고하시기 바랍니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: how_to_guide
  source_authority: official
