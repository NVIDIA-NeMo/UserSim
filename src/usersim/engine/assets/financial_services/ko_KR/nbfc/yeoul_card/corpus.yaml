- id: 61533322-7b4b-5081-ab37-507be9c90c15
  title: '할부: 약관 변경 안내'
  body: '여울카드 할부 서비스 이용 약관의 주요 변경 사항을 안내해 드립니다. 본 약관은 고객님의 권익 보호와 투명한 금융 서비스 제공을 목적으로
    합니다.


    1. 수수료 체계: 할부 이용 시 적용되는 할부수수료율(연, 하한)은 9.9%이며, 할부수수료율(연, 상한)은 19.9%입니다. 수수료는 고객님의
    신용 상태와 이용 기간에 따라 차등 적용됩니다.


    2. 이용 한도: 최대 할부 개월 수는 24개월로 제한됩니다. 고객님은 본인의 이용 한도 범위 내에서 할부 기간을 선택하실 수 있습니다.


    3. 철회 및 항변권: 할부 기간 3개월 이상, 결제 금액 20만원 이상인 거래의 경우, 계약서를 받은 날로부터 7일 이내에 철회권을 행사할
    수 있습니다. 또한, 상품 미배송이나 하자 등의 사유가 발생하면 남은 할부금 지급을 거절하는 항변권을 행사할 수 있으며, 당사는 신청 후 7영업일
    이내에 답변을 드립니다.


    4. 약관 변경 고지: 약관 변경 시 당사는 전자문서 또는 고지서를 통해 사전에 안내하며, 안내된 기한 내에 거절 의사를 표시하지 않으시면
    변경된 약관에 동의하신 것으로 간주합니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 4631f659-1907-5665-9276-05c587db5e56
  title: '할부: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객에게 할부 서비스의 가입 및 이용 과정을 안내하기 위한 지침서입니다.


    [상품 개요]

    할부는 고액 결제 시 비용을 여러 달에 나누어 납부함으로써 단기적인 경제적 부담을 낮추는 기능입니다.


    [핵심 이용 조건]

    - 최대 할부 개월 수: 24개월

    - 할부수수료율(연, 하한): 9.9%

    - 할부수수료율(연, 상한): 19.9%


    [이용 프로세스]

    1. 이용 신청: 고객이 결제 시점에 할부 개월 수를 선택하거나, 일시불 결제 후 사후 할부 전환을 요청합니다.

    2. 한도 확인: 고객의 잔여 이용 한도가 결제 금액보다 충분한지 확인합니다.

    3. 수수료 고지: 선택한 기간에 따라 적용될 수수료율(9.9% ~ 19.9%)과 총 상환액을 명확히 안내합니다.

    4. 실행: 결제가 완료되면 매월 정해진 결제일에 원금과 수수료가 합산되어 청구됩니다.


    [상담 유의사항]

    - 할부 이용 시 수수료가 부과된다는 점을 반드시 명확히 고지하십시오.

    - 무이자 할부 혜택이 있는 가맹점 행사의 경우, 해당 내용을 우선 안내하여 고객의 선택권을 보장하십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: cb625b04-ba8f-5859-addb-600d55204e68
  title: '할부: 최대 할부 개월 수 안내'
  body: '질문: 할부 이용 시 최대 몇 개월까지 나누어 낼 수 있습니까?


    답변: 여울카드의 할부 서비스는 최대 할부 개월 수 24개월까지 제공하고 있습니다. 고객님의 자금 상황에 맞춰 기간을 선택하시어 경제적 부담을
    유연하게 관리하십시오.


    질문: 할부 기간에 따라 수수료가 달라지나요?


    답변: 네, 그렇습니다. 할부 기간과 고객님의 신용도에 따라 수수료율이 결정되며, 할부수수료율(연, 하한) 9.9%에서 할부수수료율(연, 상한)
    19.9% 범위 내에서 적용됩니다. 상세한 수수료는 ''할부: 수수료 안내'' 문서를 참고해 주십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 78359cb1-bff4-5f01-ab8a-33e9c0aa75a2
  title: '할부: 등록 정보 변경'
  body: '할부 서비스 이용과 관련된 고객님의 등록 정보를 변경하는 방법은 다음과 같습니다.


    1. 본인 확인 단계: 상담원에게 본인의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 정확한 본인 인증 절차를 거쳐야 합니다.

    2. 변경 요청 사항 전달: 변경하고자 하는 정보(예: 청구지 주소, 연락처, 알림 설정 등)를 구체적으로 말씀해 주십시오.

    3. 정보 검토 및 수정: 상담원이 요청하신 내용을 확인하고 시스템에 반영합니다. 이때 변경될 정보의 정확성을 다시 한번 확인하는 과정을 거칩니다.

    4. 완료 확인: 정보 변경이 완료되면 상담원이 최종 반영 결과를 안내해 드립니다. 변경 내용은 다음 결제 주기부터 적용되거나 즉시 반영됩니다.


    주의사항: 카드 번호, 비밀번호, CVV 번호는 등록 정보 변경 대상이 아니며, 상담원은 절대로 이를 요청하지 않습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: eaf001fa-d002-5c19-a6a8-dcc7e8d659f4
  title: '할부: 로그인하거나 접속할 수 없을 때'
  body: '할부 이용 내역 확인이나 설정 변경을 위해 접속하시려 할 때 로그인이 되지 않는 경우, 다음 순서에 따라 점검해 주십시오.


    [발생 가능한 증상]

    - 로그인 버튼을 눌러도 반응이 없거나 ''인증 실패'' 메시지가 나타납니다.

    - 비밀번호를 올바르게 입력했음에도 접속이 제한됩니다.


    [원인 및 해결 방법]

    1. 계정 잠금 상태 확인: 비밀번호를 여러 번 잘못 입력하여 계정이 일시적으로 잠긴 경우입니다. 상담원에게 성함과 생년월일을 제공하여 본인
    인증을 마치신 후, 계정 잠금 해제를 요청하십시오.

    2. 비밀번호 오류: 기억하시는 비밀번호가 최신 정보와 다를 수 있습니다. 본인 인증 후 비밀번호 재설정을 진행하십시오.

    3. 서비스 일시 점검: 시스템 업데이트로 인해 일시적으로 접속이 제한될 수 있습니다. 이 경우 잠시 후 다시 시도해 주십시오.


    [에스컬레이션]

    위의 방법으로도 해결되지 않는 복잡한 접속 장애의 경우, 전문 기술 담당자에게 사안을 이관하여 처리하겠습니다. 이관 시 접수 번호가 발급되며,
    처리 결과는 등록된 연락처로 신속히 안내해 드리겠습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 73be3062-d589-5dd0-b093-e84fff96ced6
  title: '할부: 이용 조건별 차이'
  body: '할부 서비스 이용 시 조건에 따른 권리 및 제한 사항은 다음과 같습니다.


    - 거래 금액 20만원 이상 및 할부 기간 3개월 이상 → 할부 철회권 및 항변권 행사 가능

    - 거래 금액 20만원 미만 또는 할부 기간 3개월 미만 → 할부 철회권 및 항변권 행사 불가

    - 최대 할부 기간 설정 → 최대 24개월까지 선택 가능

    - 수수료 적용 범위 → 고객 신용도에 따라 연 9.9% ~ 19.9% 차등 적용'
  domain: payments
  product_category: yeoul_halbu
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 119e17fc-7ca8-539c-8bbd-1abe32149cd9
  title: '할부: 상품 고르는 방법'
  body: '단일 고액 결제 시 부담을 줄이고 싶으시다면 ''할부'' 서비스를, 매월 결제 금액의 일부만 납부하며 유연하게 관리하고 싶으시다면
    ''리볼빙(일부결제금액이월약정)''을 추천합니다.


    - 할부: 특정 거래 건에 대해 최대 24개월까지 기간을 나누어 납부합니다. 계획적인 지출 관리가 가능하며, 20만원 이상 3개월 이상 거래
    시 항변권을 통해 소비자 권리를 보호받을 수 있습니다.

    - 리볼빙(일부결제금액이월약정): 이번 달 전체 결제 금액 중 일부만 납부하고 나머지를 다음 달로 이월합니다. 매달 결제액을 조절할 수 있어
    유연하지만, 이월 금액에 수수료가 지속적으로 부과되어 총 부담이 커질 수 있습니다.


    특정 물건 구매 비용을 나누어 내고 싶으신 고객님께는 할부 서비스가 더 적합합니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: a5264fd2-02b8-5df9-987c-aabc7605afdb
  title: '할부: 개인정보 처리 안내'
  body: '여울카드는 고객님의 개인정보를 안전하게 처리하여 책임 있는 금융 서비스를 제공합니다. 할부 서비스 이용과 관련하여 다음과 같이 개인정보를
    처리합니다.


    1. 수집 및 이용 목적: 할부 서비스 제공, 고객의 신용 상태 및 상환 능력 평가, 할부 수수료(연 9.9% ~ 19.9%) 산정, 이용
    한도 관리, 관련 법령에 따른 본인 확인 및 부정사용 방지.


    2. 처리하는 항목: 성함, 생년월일, 연락처, 결제 내역, 신용 점수 및 소득 정보 등.


    3. 보유 및 이용 기간: 금융소비자 보호에 관한 법률 및 여신전문금융업법 등 관련 법령에서 정한 보존 기간 동안 보관하며, 목적 달성 후에는
    안전하게 파기합니다.


    4. 고객의 권리: 고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 단, 법령에 따라 보존이 강제되는 정보는
    제한될 수 있습니다.


    여울카드는 금융위원회의 감독하에 개인정보 보호법을 엄격히 준수하며, 고객님의 동의 없이 제3자에게 정보를 제공하지 않습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 06a4faac-7a73-501c-8811-2cc5406e20da
  title: '할부: 이 상품을 사칭한 사기 주의'
  body: '여울카드의 할부 서비스를 사칭하여 고객님의 개인정보나 금융 정보를 요구하는 사기 범죄에 각별히 주의하시기 바랍니다.


    최근 ''할부 수수료 전액 면제'' 또는 ''특별 저금리 전환''을 미끼로 여울카드를 사칭하여 접근하는 사례가 보고되고 있습니다. 여울카드는
    어떠한 경우에도 고객님께 카드 번호, CVV, 비밀번호, 주민등록번호 전체를 요청하지 않습니다.


    본인 확인이 필요한 경우, 상담원은 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다. 만약 제3자가 수수료 감면을 조건으로 개인정보나
    금융 정보를 요구한다면 즉시 통화를 종료하시고 고객센터로 신고해 주십시오.


    또한, 할부 거래의 철회권과 항변권은 법령에 따라 보호받는 정당한 권리이며, 이를 위해 별도의 수수료를 지불하거나 특정 앱을 설치할 필요가
    없습니다. 이상 징후를 발견하셨을 때는 즉시 분실 및 도난 신고 절차를 통해 카드 이용 정지 조치를 취하시기 바랍니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: fd77ec6b-ea74-5328-893e-d9f80c860e38
  title: '할부: 한도·제한과 유의사항'
  body: '여울카드의 할부 서비스 이용 시 적용되는 주요 한도와 제한 사항 및 유의사항입니다. 상담 시 해당 기준을 정확히 안내하여 고객의 혼선을
    방지하십시오.


    1. 이용 한도 및 기간

    - 최대 할부 개월 수: 24개월

    - 할부 가능 금액: 고객님의 신용도에 따라 부여된 이용 한도 내에서 가능합니다.


    2. 수수료 체계

    - 할부수수료율(연, 하한): 9.9%

    - 할부수수료율(연, 상한): 19.9%

    - 수수료는 고객의 신용 상태와 이용 기간에 따라 차등 적용됩니다.


    3. 법적 권리 및 유의사항

    - 철회권: 할부 기간 3개월 이상, 금액 200,000원 이상인 거래는 계약서 수령일로부터 7일 이내에 철회할 수 있습니다.

    - 항변권: 상품 미배송이나 하자 등의 사유가 있을 때 남은 할부금 지급을 거절할 수 있는 권리입니다.

    - 수수료 고지: 할부 이용 시 수수료가 부과된다는 점을 반드시 명확하게 안내하십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 40a8f808-e3de-5c0f-9ddd-773cc9d5907f
  title: '할부: 수수료와 비용'
  body: 'Q: 할부 이용 시 수수료는 얼마나 부과되나요?

    A: 여울카드의 할부수수료율은 연 9.9%에서 최대 19.9% 범위 내에서 고객님의 신용 상태에 따라 차등 적용됩니다. 가맹점의 무이자 할부
    행사 상품을 이용하시는 경우에는 수수료가 부과되지 않습니다.


    Q: 할부는 최대 몇 개월까지 나누어 낼 수 있습니까?

    A: 여울카드의 할부 서비스는 최대 24개월까지 설정하여 이용하실 수 있습니다. 기간을 길게 설정할수록 월 납부 부담은 줄어들지만, 총 납부
    수수료는 증가할 수 있으니 유의하시기 바랍니다.


    더 자세한 내용은 ''할부: 상품 개요''를 참고하십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 6b46cf65-f277-5a4c-bf70-71b8df92870c
  title: '할부: 진행 상황과 내역 확인'
  body: '현재 이용 중인 할부 거래의 잔액과 남은 회차를 확인하는 방법입니다.


    1. 본인 인증 수행

    고객님의 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 상세 내역 조회가 가능합니다.


    2. 조회 대상 거래 확인

    확인을 원하시는 특정 가맹점 명칭이나 결제 일자를 말씀해 주십시오. 여러 건의 할부를 이용 중이신 경우 전체 목록을 안내해 드릴 수 있습니다.


    3. 할부 상세 내역 확인

    상담원이 다음의 정보를 확인하여 안내해 드립니다.

    - 총 결제 금액 및 현재까지 납부한 금액

    - 남은 할부 회차 (예: 12개월 중 5회차 납부 완료)

    - 적용 중인 할부수수료율 (연 9.9% ~ 19.9% 사이의 적용 이율)

    - 다음 결제 예정일에 청구될 원금과 수수료 금액


    4. 결과 확인

    안내받으신 내역이 이용 중인 명세서와 일치하는지 확인하십시오. 내역이 맞지 않는 경우 즉시 상담원에게 수정을 요청하시기 바랍니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 466da1a4-7c93-54cc-89fa-fedeafc6ac0f
  title: '할부: 거래가 거절되거나 제한되었을 때'
  body: '결제 시 할부 선택이 되지 않거나 거래가 거절되는 경우, 다음의 원인을 확인하시기 바랍니다.


    - 증상: 가맹점에서 할부 결제를 시도했으나 ''한도 초과'' 또는 ''서비스 불가'' 메시지가 발생함


    - 원인 및 확인 사항

    1. 이용 한도 부족: 할부 결제 금액이 현재 남은 카드 이용 한도를 초과했는지 확인하십시오. 할부는 전체 결제 금액이 한도에서 차감됩니다.

    2. 가맹점 제한: 일부 소규모 가맹점이나 특정 업종에서는 할부 결제 기능을 제공하지 않을 수 있습니다.

    3. 카드 상태 이상: 분실 신고 또는 정지 상태인 경우 모든 결제가 제한됩니다.


    - 해결 방법

    - 한도 부족 시: 즉시 결제(선결제)를 통해 한도를 확보하시거나 한도 증액을 요청하십시오.

    - 가맹점 제한 시: 일시불 결제 후 ''결제 후 할부 전환'' 서비스 이용 가능 여부를 확인하십시오.


    - 에스컬레이션

    위 사항을 확인했음에도 원인 모를 거절이 반복된다면, 상담원이 전문 담당 부서로 요청을 전달하여 카드 상태 및 가맹점 제한 코드를 정밀 분석하겠습니다.
    분석 결과는 영업일 기준 3일 이내에 안내해 드립니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 9ea1ff31-89bc-5a66-8327-1387c131221d
  title: '할부: 전환이나 상위 상품을 고려할 때'
  body: "고객님이 고액 결제 금액의 부담을 줄이고자 하실 때, '할부'와 '리볼빙(일부결제금액이월약정)' 중 적합한 서비스를 안내하십시오.\n\
    \n- 할부 (yeoul_halbu)\n  - 구조: 결제 시점에 최대 24개월의 기간을 정해 원금과 수수료를 나누어 납부합니다.\n  -\
    \ 비용: 연 9.9% ~ 19.9%의 수수료가 적용됩니다.\n  - 적합한 경우: 구매 시점에 상환 계획을 명확히 세우고, 정해진 기간 내에\
    \ 종료하고 싶으신 고객님께 권장합니다.\n\n- 리볼빙 (yeoul_revolving)\n  - 구조: 매월 결제 금액의 일부만 납부하고\
    \ 나머지는 다음 달로 이월합니다.\n  - 비용: 이월된 금액에 대해 수수료가 부과됩니다.\n\n상환의 예측 가능성을 원하신다면 할부를,\
    \ 매월 지불 금액을 유연하게 조절하고 싶으신 경우에는 리볼빙이 더 유리합니다. 고객님의 소비 패턴에 따라 선택하시도록 안내하십시오."
