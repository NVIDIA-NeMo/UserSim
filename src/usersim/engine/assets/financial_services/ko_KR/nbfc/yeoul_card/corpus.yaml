  institution_id: yeoul_card
- id: 5c7a440d-9ce8-5330-819f-805ea78b2b26
  title: '여울 신용카드: 가입과 이용 시작'
  body: '여울 신용카드 가입을 희망하시는 고객님을 위해 신청 및 이용 시작 절차를 안내해 드립니다.


    **준비 사항**

    - 본인 명의의 신분증 및 소득 증빙 서류 (필요 시)

    - 본인 확인을 위한 성함과 생년월일


    **가입 및 이용 단계**

    1. 본인 인증 수행: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 조회 전 본인 인증이 반드시 필요합니다.

    2. 상품 정보 확인: 여울 신용카드의 연회비 15,000원, 포인트 적립률 0.7% 등 주요 약관과 상품 설명서를 확인하십시오.

    3. 한도 심사 요청: 고객님의 신용 상태와 상환 능력을 고려하여 이용한도가 산정됩니다. 이용한도 최고액은 20,000,000원까지 가능합니다.

    4. 카드 발급 신청: 심사 승인 후 카드 배송지 정보를 확인하고 신청을 완료하십시오.

    5. 카드 수령 및 등록: 실물 카드를 수령하신 후, 안내된 절차에 따라 카드 사용 등록을 마치시면 즉시 이용이 가능합니다.


    정확한 수수료와 상환액 고지를 통해 책임 있는 금융 서비스를 제공하겠습니다. 가입 대상 여부는 ''여울 신용카드: 가입 대상''에서 확인하실
    수 있습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: e0a82361-fd06-539d-9f4f-268e166b1f39
  title: '여울 신용카드: 수수료 안내'
  body: '여울 신용카드의 수수료 체계는 다음과 같습니다. 모든 비용 구조를 투명하게 공개하여 고객님의 선택권을 보장합니다.


    - 연회비: 15,000원 (연 1회 부과)


    해당 수수료는 자금 운용 비용과 리스크 관리를 위해 필수적으로 책정되었습니다. 특정 프로모션 조건 충족 시 수수료 감면 혜택이 적용될 수 있습니다.
    자세한 금리 및 요율은 ''여울 신용카드: 금리·요율 안내''를 참고하십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 779afd83-461c-5689-a436-cda808240710
  title: '여울 신용카드: 처리가 끝나지 않거나 보류 중일 때'
  body: '카드 신청이나 한도 조정 요청 후 처리가 완료되지 않고 ''보류'' 상태로 유지되는 경우, 다음의 내용을 확인해 주십시오.


    **예상되는 원인**

    - 본인 인증 정보 불일치: 신청 시 입력한 성함이나 생년월일이 등록 정보와 다른 경우입니다.

    - 추가 증빙 서류 필요: 신용 상태 확인을 위해 소득 증빙 등의 추가 서류 제출이 필요한 경우입니다.

    - 심사 지연: 신청량 증가로 인해 내부 심사 과정이 길어지고 있는 상황입니다.


    **해결 방법 및 절차**

    1. 정보 재확인: 상담원에게 성함과 생년월일을 다시 말씀해 주십시오. 본인 인증을 통해 현재 처리 상태를 정확히 확인해 드리겠습니다.

    2. 서류 제출 요청 확인: 보류 사유가 ''서류 미비''인 경우, 안내받은 필수 서류를 제출해 주시면 심사가 재개됩니다.

    3. 진행 상태 문의: 처리 완료까지의 예상 소요 시간을 확인하십시오.


    **에스컬레이션 안내**

    일반 상담원이 해결하기 어려운 복잡한 보류 사유나 민원의 경우, 단계별 에스컬레이션 절차에 따라 전문 담당자가 배정되어 처리해 드리며, 결과는
    영업일 기준 7일 이내에 안내해 드리겠습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 7fb8c5d9-e65c-58c0-be73-041d9ca738a3
  title: '여울 신용카드: 가입 대상'
  body: '여울 신용카드의 가입 가능 여부를 결정하는 기본 기준입니다.


    | 구분 | 가입 조건 | 결과 |

    | :--- | :--- | :--- |

    | 기본 대상 | 현대 직장인 및 일정 소득 이상의 개인 | 가입 가능 |

    | 신용 상태 | 당사 내부 신용 등급 및 외부 신용 점수 기준 충족 | 가입 가능 |

    | 신용 상태 | 연체 기록 보유 또는 신용 점수 기준 미달 | 가입 제한 |

    | 본인 인증 | 성함 및 생년월일을 통한 본인 확인 완료 | 가입 절차 진행 |


    상세한 신용 심사 결과에 따라 이용한도 최고액인 20,000,000원 범위 내에서 개별 한도가 차등 부여됩니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 2ad2126a-55fe-5f1c-9d91-ca76598c1306
  title: '여울 신용카드: 당사의 비슷한 상품과의 비교'
  body: '여울카드의 주요 서비스인 ''여울 신용카드''와 ''리볼빙(일부결제금액이월약정)''의 특성을 비교해 드립니다.


    | 비교 항목 | 여울 신용카드 | 리볼빙(일부결제금액이월약정) |

    | :--- | :--- | :--- |

    | 기본 성격 | 포인트 적립 중심의 결제 상품 | 결제 금액 이월 중심의 유연한 서비스 |

    | 주요 혜택 | 포인트 적립률 0.7% 제공 | 월별 지불 부담의 유연한 조절 |

    | 비용 구조 | 연회비 15,000원 | 이월된 금액에 대한 수수료 부과 |

    | 권장 고객 | 일상적 소비 혜택을 원하는 고객 | 단기적으로 결제 금액 조절이 필요한 고객 |


    여울 신용카드는 소비의 가치를 높이는 데 집중하며, 리볼빙은 결제 편의성을 제공하는 서비스입니다. 고객님의 소비 패턴에 맞는 상품을 선택하십시오.
    상세 내용은 ''리볼빙(일부결제금액이월약정): 상품 개요''에서 확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: e7a6d5d4-8bd7-5c0d-abe0-9d47ad83cf03
  title: '여울 신용카드: 상품설명서 주요 내용'
  body: '본 상품은 여신전문금융업법 및 금융소비자 보호에 관한 법률을 엄격히 준수합니다. 이용 전 다음의 주요 내용을 반드시 확인하십시오.


    **1. 비용 및 혜택 고지**

    - 본 상품의 연회비는 15,000원이며, 이용 금액의 0.7%가 포인트로 적립됩니다.

    - 이용한도 최고액은 20,000,000원으로 제한되며, 이는 고객님의 신용 상태에 따라 결정됩니다.


    **2. 법적 권리 안내**

    - 할부 거래 시 기간 3개월 이상, 금액 20만원 이상인 거래는 계약서 수령일로부터 7일 이내에 철회할 수 있습니다.

    - 상품 미배송 또는 하자 발생 시, 남은 할부금 지급을 거절하는 할부 항변권을 행사할 수 있으며, 당사는 접수 후 7영업일 이내에 답변하겠습니다.


    **3. 책임 있는 금융 서비스**

    - 당사는 고객님의 신용 상태와 상환 능력을 고려하여 한도를 부여하며, 과도한 신용카드 사용은 개인 신용 점수에 부정적인 영향을 줄 수 있음을
    알려드립니다.


    더 자세한 약관 내용은 ''여울 신용카드: 약관''을 참고하시기 바랍니다.'
  domain: payments
  product_category: yeoul_credit
