- id: 999d9191-53c6-5f49-b0c2-b1945464d013
  title: '여울 신용카드: 자주 하는 업무의 처리 절차'
  body: '여울 신용카드 이용 중 빈번하게 발생하는 주요 업무의 처리 절차를 안내해 드립니다.


    [사례: 이용한도 증액 요청]

    1. 본인 인증

    상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 증액 요청

    현재 한도에서 얼마만큼의 증액을 원하시는지 말씀해 주십시오. (최고 한도 20,000,000원 범위 내)

    3. 심사 진행

    상담원이 고객님의 최근 소득 변화나 신용 점수 상승 등 증액 사유를 확인하고 심사를 요청합니다.

    4. 결과 안내

    심사 결과에 따라 한도 조정 가능 여부와 최종 확정 한도가 안내되며, 즉시 반영됩니다.


    [사례: 카드 분실 및 정지 신고]

    1. 본인 인증

    성함과 생년월일을 통해 빠르게 본인 확인을 수행합니다.

    2. 신고 접수

    분실 또는 도난 사실을 알리시면 즉시 해당 카드의 이용 정지 조치를 취합니다.

    3. 재발급 신청

    정지 처리 후, 새로운 카드의 수령지 주소를 확인하고 재발급 절차를 진행합니다.


    정보 변경과 관련된 추가 내용은 ''여울 신용카드: 등록 정보 변경'' 가이드를 참고하십시오.'
