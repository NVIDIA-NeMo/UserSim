- id: 40ff5462-5f06-507d-88cf-0ccb7971ff11
  title: change_revolving_payment 사용 기준
  body: '이미 리볼빙(일부결제금액이월약정)을 이용 중인 고객님이 약정결제비율을 변경하고자 하실 때 다음 절차를 따르십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 호출하여 리볼빙 약정이 설정된 계좌의 account_id를 확인하십시오.

    3. 고객님이 변경하고자 하는 새로운 약정결제비율을 확인하십시오.

    4. 결제비율을 낮출 경우 이월되는 금액이 많아져 향후 납부해야 할 수수료 부담이 증가할 수 있음을 충분히 설명하십시오.

    5. change_revolving_payment 도구를 호출하여 약정결제비율 변경을 완료하십시오.


    변경 사항은 요청 즉시 반영되며, 다음 결제 주기부터 적용됩니다. 비율 변경과 관련한 상세 주의사항은 ''리볼빙(일부결제금액이월약정): 한도·제한과
    유의사항''을 참고하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_revolving_payment
  institution_id: yeoul_card
