- id: 53ab5662-4cf4-5da5-85de-024e4de9eadf
  title: '단기카드대출(현금서비스): 상품설명서 주요 내용'
  body: '본 상품은 금융위원회와 금융감독원의 감독하에 여신전문금융업법 및 금융소비자 보호에 관한 법률을 엄격히 준수하여 운영됩니다.


    주요 고지 사항은 다음과 같습니다.


    1. 금리 및 비용: 본 상품의 현금서비스 금리(연)는 18.2%입니다. 모든 대출 금리는 법정 최고금리인 연 20%를 초과할 수 없으며,
    연체 시 약정금리에 최대 3%p를 더한 수준 내에서 연체이자가 부과됩니다.

    2. 청약 철회권: 대출 계약은 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우
    원금과 이용 기간의 이자 및 제3자 비용만 반환하며 중도상환수수료는 면제됩니다.

    3. 이용 한도: 고객님의 신용 상태에 따라 차등 부여되며, 현금서비스 이용한도 최고액은 5,000,000원입니다.

    4. 책임 있는 금융: 여울카드는 고객님의 신용 상태와 상환 능력을 고려하여 대출을 제공하며, 상환이 어려운 고객님께는 채무조정 제도를 안내해
    드립니다.'
