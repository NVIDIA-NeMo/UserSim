- id: 1e5be9f0-523d-53bd-b8cd-efe18807e2c5
  title: '리볼빙(일부결제금액이월약정): 당사의 비슷한 상품과의 비교'
  body: '리볼빙과 할부 서비스의 차이점을 안내해 드립니다.


    | 구분 | 리볼빙(일부결제금액이월약정) | 할부 |

    | :--- | :--- | :--- |

    | **특징** | 매월 결제 비율을 정해 잔액을 이월 | 고액 결제 시 기간을 나누어 납부 |

    | **결제 금액** | 최소 10% 이상 설정 가능 | 매월 동일 금액(원금+수수료) 납부 |

    | **수수료** | 연 16.5% (이월 잔액에 적용) | 상품별 할부 수수료율 적용 |

    | **유연성** | 선결제로 상환액 자유롭게 조절 가능 | 정해진 스케줄에 따라 납부 |


    **추천 대상**

    - **리볼빙**: 매달 지출 규모가 가변적이어서 월별 납부 금액을 유연하게 관리하고 싶으신 분께 적합합니다.

    - **할부**: 고가의 물건을 구매하여 계획적으로 나누어 내고 싶으신 분께 적합합니다. 자세한 내용은 ''할부: 상품 개요''를 참고하십시오.'
