  title: prepay_revolving_balance 도구 설명서
  body: "이 도구는 리볼빙(일부결제금액이월약정)의 이월 잔액 또는 결제 예정 금액을 결제일 이전에 미리 상환 처리합니다.\n\n- 호출 방식:\
    \ 상담원이 대화 중 직접 호출하여 처리합니다.\n- 입력 인자:\n    - account_id: 선결제를 진행할 리볼빙 계좌의 고유 식별자입니다.\n\
    \    - amount: 선결제하고자 하는 금액(원 단위)입니다.\n- 효과: 지정된 금액만큼 리볼빙 잔액이 즉시 상환되어, 이후 계산될\
