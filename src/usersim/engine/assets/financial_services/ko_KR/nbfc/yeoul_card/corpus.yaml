    및 상환 능력에 따라 실제 부여 한도는 이보다 낮을 수 있습니다.


    2. 청약 철회권: 대출 계약 후 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우
    원금과 이용 기간의 이자, 인지세 등 제3자 비용만 부담하며 중도상환수수료는 발생하지 않습니다.


    3. 금리인하요구권: 취업, 승진, 신용점수 상승 등 신용 상태가 개선된 고객님은 당사에 금리 인하를 요청할 수 있는 권리가 있습니다.


    4. 의무 및 종료: 고객님은 약정한 결제일에 원리금을 상환할 의무가 있으며, 연체 시 약정금리에 최대 3%p를 더한 연체이자가 부과됩니다.
    단, 연체이자율은 법정 최고금리인 연 20%를 초과할 수 없습니다.


    상세한 변경 내용은 당사 웹사이트 및 모바일 앱의 약관 게시판에서 확인하실 수 있습니다.'
