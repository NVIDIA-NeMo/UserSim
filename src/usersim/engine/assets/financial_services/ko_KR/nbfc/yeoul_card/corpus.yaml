- id: 3d49a504-05d6-52da-8f65-92aac3452d2a
  title: '장기카드대출(카드론): 위험 안내'
  body: '장기카드대출(카드론) 이용 전, 고객님께서 반드시 인지하셔야 할 위험 요소를 안내드립니다.


    1. 신용 점수 영향: 본 상품은 제2금융권 대출로 분류됩니다. 대출 실행 및 과도한 부채 증가는 신용 점수에 영향을 줄 수 있으며, 이는
    향후 다른 금융 거래 시 불이익으로 작용할 수 있습니다.


    2. DSR 규제 적용: 장기카드대출(카드론)은 총부채원리금상환비율(DSR) 산정 대상에 포함됩니다. 대출 총액이 1억원을 넘는 차주의 경우,
    카드사 등 제2금융권 DSR 기준인 50%를 초과할 수 없으므로 추가 대출이 제한될 수 있습니다.


    3. 고금리 부담: 고객님의 신용 상태에 따라 최대 연 19.9%의 금리가 적용될 수 있습니다. 원리금 상환이 지연될 경우 연체 이자가 추가되어
    총 상환 부담이 급격히 증가할 수 있습니다.


    4. 상환 능력 고려: 당사는 고객님의 신용 상태와 상환 능력을 고려하여 책임 있는 금융 서비스를 제공하고자 합니다. 무리한 대출은 경제적
    어려움을 초래할 수 있으므로, 본인의 상환 능력을 충분히 검토하신 후 신청하시기 바랍니다. 상환이 어려우신 경우 조기에 상담을 요청하시어 채무조정
    제도를 안내받으십시오.'
