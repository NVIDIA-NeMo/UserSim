- id: c209d178-81bc-5a18-b7a5-2a0eee239bef
  title: '리볼빙(일부결제금액이월약정): 상품 개요'
  body: '리볼빙(일부결제금액이월약정)은 결제 금액의 전체를 즉시 납부하는 대신, 고객님이 약정한 최소한의 비율만 먼저 납부하고 나머지는 다음
    달로 이월하여 결제할 수 있도록 돕는 유연한 결제 서비스입니다. 이 상품은 갑작스러운 지출 증가로 인해 한 달 결제 금액이 부담스러운 현대
    직장인분들께 경제적 여유를 제공하며, 스마트한 자금 관리를 가능하게 합니다.


    본 서비스의 핵심 조건은 다음과 같습니다. 고객님께서는 결제 금액의 최소 10%에 해당하는 ''리볼빙 최소결제비율''을 설정하여 납부하셔야
    하며, 이월된 잔액에 대해서는 연 16.5%의 ''리볼빙 수수료율(연)''이 적용됩니다. 수수료는 이월된 금액과 기간에 따라 일할 계산되어
    부과됩니다.


    주의하실 점은 이월된 금액에 계속해서 수수료가 붙기 때문에, 장기간 이용 시 총 상환 부담이 커질 수 있다는 것입니다. 따라서 여유 자금이
    생기셨을 때 선결제를 통해 이월 금액을 줄이시는 것을 권장합니다. 더욱 자세한 내용은 ''리볼빙(일부결제금액이월약정): 금리·요율 안내''를
    참고해 주십시오.'
