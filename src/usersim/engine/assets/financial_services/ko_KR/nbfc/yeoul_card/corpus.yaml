- id: c62469e2-a18a-5026-a029-189c7f14f213
  title: file_installment_objection 사용 기준
  body: '물건이 배송되지 않았거나 상품에 하자가 있는 경우, 고객이 남은 할부금의 지급을 거절할 수 있는 할부 항변권을 행사하는 절차입니다.
    관련 법령에 따라 다음의 요건을 충족해야 합니다.


    - 대상 거래: 할부 기간 3개월 이상, 결제 금액 200,000원 이상의 신용카드 할부 거래


    처리 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구로 `account_id`를 확인한 후, `get_account_transactions` 도구를 호출하여
    해당 할부 거래 내역과 결제 금액, 할부 개월 수를 확인하십시오.

    3. 해당 거래가 할부 기간 3개월 이상 및 금액 200,000원 이상인지 확인하여 항변권 행사 대상인지 판단하십시오.

    4. 항변 신청 사유(미배송, 하자 등)를 구체적으로 확인하십시오.

    5. `file_installment_objection` 도구를 호출하여 신청을 접수하십시오.

    6. 접수 후 7영업일 이내에 답변을 드릴 예정임을 고객에게 명확히 안내하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_installment_objection
  institution_id: yeoul_card
- id: 8a685fab-050a-509d-81e6-8ea3fab37dea
  title: file_installment_objection 도구 설명서
  body: "이 도구는 요건을 갖춘 할부 거래에 대해 고객이 할부금 지급을 거절하는 항변 신청을 접수하는 기능을 수행합니다.\n\n- 호출 방식:\
    \ 상담원이 대화 중 직접 호출하여 실행합니다.\n- 필요 인자:\n  - `account_id`: `get_accounts` 도구를 통해\
    \ 확인된 고객의 계좌/카드 식별자입니다.\n  - `transaction_id`: `get_account_transactions` 도구를\
    \ 통해 확인된 해당 거래의 고유 식별자입니다.\n  - `reason`: 상품 미배송, 하자 발생 등 할부금 지급 거절 사유입니다.\n\n\
    본인 인증(`verify_identity`)이 완료된 상태에서 호출하며, 접수된 내용은 관련 법령 및 약관에 따라 처리됩니다."
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
