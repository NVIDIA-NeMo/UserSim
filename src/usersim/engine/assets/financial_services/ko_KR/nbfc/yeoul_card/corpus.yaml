- id: 091dcac8-450b-5777-b472-d87f68aa8d59
  title: '단기카드대출(현금서비스): 이런 분께 알맞습니다'
  body: '단기카드대출(현금서비스)은 갑작스럽게 소액의 현금이 필요하신 현대 직장인 고객님께 최적화된 상품입니다. 복잡한 서류 제출 없이 빠르게
    현금을 확보할 수 있어 효율적인 자금 운용이 가능합니다.


    이런 분들께 추천합니다:

    - 급여일 전 일시적인 자금 부족으로 인해 빠른 현금 확보가 필요하신 분

    - 소액의 자금을 단기간만 사용하고 빠르게 상환하여 이자 부담을 줄이고 싶으신 분

    - 까다로운 대출 심사 과정 없이 이미 부여된 한도 내에서 즉시 자금을 이용하고 싶으신 분


    주요 상품 조건은 다음과 같습니다.

    - 현금서비스 금리(연): 18.2%

    - 현금서비스 이용한도 최고액: 5,000,000원


    본 상품은 단기적인 경제적 부담을 해결하기 위한 수단으로, 보다 큰 금액의 장기 자금이 필요하신 경우에는 중도상환수수료 부담이 없는 장기카드대출(카드론)을
    검토해 보시기 바랍니다.'
