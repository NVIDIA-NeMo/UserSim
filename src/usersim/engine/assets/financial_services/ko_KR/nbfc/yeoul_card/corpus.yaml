- id: 790c0a9c-915d-54d7-a83d-476b1b9e039d
  title: '장기카드대출(카드론): 이용한도 최고액 안내'
  body: 'Q: 장기카드대출(카드론)로 빌릴 수 있는 최대 금액은 얼마인가요?

    A: 장기카드대출(카드론)의 이용한도 최고액은 50,000,000원입니다. 다만, 이는 최대치이며 실제 한도는 고객님의 신용 점수, 연 소득,
    그리고 DSR(총부채원리금상환비율) 등 내부 심사 기준에 따라 개인별로 다르게 책정됩니다.


    Q: 한도 결정 시 DSR이 어떻게 적용되나요?

    A: 장기카드대출(카드론)은 대출 상품이므로 DSR 산정에 포함됩니다. 카드사와 같은 제2금융권의 경우 일반적으로 연간 원리금 상환액이 연
    소득의 50%를 넘지 않아야 하며, 이를 바탕으로 최종 한도가 결정됩니다.'
