- id: 3f9669b4-a20c-522f-9695-8792cfd571bf
  title: '리볼빙(일부결제금액이월약정): 가입과 이용 조건'
  body: 'Q: 리볼빙(일부결제금액이월약정) 서비스는 누구나 가입할 수 있습니까?

    A: 여울 신용카드를 보유하신 고객님 중, 당사의 내부 심사 기준과 신용 상태를 충족하신 분에 한해 가입이 가능합니다. 상세한 가입 대상 여부는
    고객님의 신용 점수와 이용 한도에 따라 결정됩니다.


    Q: 서비스 이용 시 최소한으로 납부해야 하는 금액이 있습니까?

    A: 네, 본 서비스의 리볼빙 최소결제비율은 10%입니다. 결제 금액의 최소 10% 이상을 납부하셔야 연체를 방지하실 수 있으며, 나머지 금액을
    이월하여 다음 달로 넘기실 수 있습니다.


    더 자세한 내용은 ''리볼빙(일부결제금액이월약정): 상품 개요''를 참고하십시오.'
  domain: payments
