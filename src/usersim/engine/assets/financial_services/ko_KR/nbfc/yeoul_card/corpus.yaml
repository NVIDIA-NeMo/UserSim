- id: 45d94302-7aa3-5a1c-8c05-e68cc8ef47a4
  title: '리볼빙(일부결제금액이월약정): 거래가 거절되거나 제한되었을 때'
  body: "리볼빙(일부결제금액이월약정) 서비스를 이용 중임에도 불구하고 카드 결제가 거절되거나 이용이 제한되는 경우, 다음 사항을 확인하십시오.\n\
    \n- 증상: 결제 시 '한도 초과' 또는 '거래 제한' 메시지가 발생함\n- 예상 원인\n  1. 이월 잔액 누적으로 인한 총 한도 초과:\
    \ 리볼빙으로 이월된 금액은 여전히 고객님의 이용 한도를 점유합니다. 이월 금액이 많아져 가용 한도가 부족할 때 발생합니다.\n  2. 신용\
    \ 상태 변동: 신용 점수 하락 등으로 인해 당사의 리스크 관리 기준에 따라 일시적으로 한도가 조정되었을 수 있습니다.\n  3. 최소결제비율\
    \ 미납: 이전 달의 최소결제비율(10%)을 납부하지 않아 연체가 발생한 경우 서비스 이용이 제한됩니다.\n\n- 해결 방법\n  1. 선결제\
    \ 진행: 이월된 잔액의 일부 또는 전부를 즉시 납부하여 가용 한도를 확보하십시오.\n  2. 한도 조정 요청: 현재의 소비 패턴에 맞게 한도\
    \ 증액이 가능한지 확인하십시오.\n  3. 연체금 납부: 미납된 최소결제금액과 연체 이자를 즉시 납부하십시오.\n\n위 조치 후에도 문제가\
    \ 해결되지 않는 경우, 전문 담당자에게 에스컬레이션하여 상세 신용 상태 및 제한 사유를 확인하시기 바랍니다."
