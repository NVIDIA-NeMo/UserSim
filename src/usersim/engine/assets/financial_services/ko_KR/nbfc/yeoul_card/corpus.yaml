- id: ed1be753-0b3f-5eed-ab09-dcaad3df6013
  title: '여울 신용카드: 위험 안내'
  body: '여울 신용카드를 이용하시기 전, 다음의 위험 요소를 충분히 숙지하시기 바랍니다.


    1. 과다 지출 위험: 이용한도 최고액이 20,000,000원으로 설정되어 있어, 계획 없는 소비 시 과도한 부채가 발생할 수 있습니다. 고객님의
    상환 능력을 고려하여 책임 있게 이용하십시오.


    2. 연체 발생 시 불이익: 결제 대금을 제때 납부하지 못할 경우, 약정 금리에 연체 이자가 가산되며 이는 신용 점수 하락으로 이어질 수 있습니다.
    특히 법정 최고금리 연 20% 이내에서 연체 이자가 부과됨을 유의하십시오.


    3. 수수료 부담: 포인트 적립 혜택과는 별개로, 연회비 15,000원이 매년 청구됩니다. 또한 할부 전환이나 리볼빙 서비스 이용 시 추가
    수수료가 발생하여 총 상환액이 증가할 수 있습니다.


    여울카드는 금융소비자 보호에 관한 법률을 준수하며, 고객님의 신용 상태에 맞는 책임 있는 금융 서비스를 제공하기 위해 노력하고 있습니다.'
