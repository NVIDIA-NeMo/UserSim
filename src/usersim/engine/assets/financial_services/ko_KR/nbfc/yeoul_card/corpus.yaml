- id: 71f97663-b368-572d-a128-95cc492d9ad0
  title: '장기카드대출(카드론): 가입부터 이용까지'
  body: '본 문서는 상담원이 고객에게 장기카드대출(카드론)의 전 과정을 안내하기 위한 가이드입니다.


    1. 상품 정의 및 특징

    비교적 큰 금액을 장기로 빌려 사용할 수 있는 신용 대출 상품으로, 특히 중도상환수수료가 없어 상환 부담이 적습니다.


    2. 주요 적용 수치

    - 이용한도 최고액: 50,000,000원 (고객 신용도 및 DSR 기준에 따라 차등 부여)

    - 대출 금리(연): 5.9% ~ 19.9%

    - 중도상환수수료율: 0%


    3. 가입 및 심사 절차

    - 고객의 성함과 생년월일을 통해 본인 인증을 완료하십시오.

    - 고객의 신용 상태와 상환 능력을 고려하여 한도를 산정합니다. 특히 대출 총액이 1억원을 넘는 경우, 제2금융권 기준인 총부채원리금상환비율(DSR)
    50% 이내 준수 여부를 확인해야 합니다.

    - 승인 시 총상환액과 금리를 정확히 고지하십시오. 대출 승인을 확약하는 표현은 금지됩니다.


    4. 이용 및 상환

    - 대출금은 지정된 계좌로 즉시 입금됩니다.

    - 상환은 약정된 기간 동안 원금과 이자를 나누어 납부하며, 중도상환수수료가 0%이므로 언제든 조기 상환을 안내하십시오.

    - 상환이 어려운 고객에게는 채무조정 제도를 조기에 안내하시기 바랍니다.'
