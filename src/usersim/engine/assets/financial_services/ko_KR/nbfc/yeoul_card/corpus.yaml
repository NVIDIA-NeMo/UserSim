- id: 9bbdcad1-19b7-5cc8-9924-496cb91714fe
  title: '리볼빙(일부결제금액이월약정): 명세서나 내역과 맞지 않을 때'
  body: "고객님께서 청구된 리볼빙 수수료나 이월 금액이 예상과 다르다고 문의하신 경우, 상담원께서는 다음 단계에 따라 확인하십시오.\n\n\
    - 증상: \"리볼빙 수수료가 생각보다 많이 나왔습니다\" 또는 \"이월 금액 계산이 잘못된 것 같습니다\"라고 주장함\n\n- 확인 및 조치\
    \ 순서\n  1. 수수료율 확인: 해당 고객에게 적용된 리볼빙 수수료율이 연 16.5%가 맞는지 확인하십시오.\n  2. 이월 기간 및 금액\
    \ 계산: [이월된 원금 × (리볼빙 수수료율 ÷ 365) × 이월 일수] 공식에 따라 수수료가 정확히 산출되었는지 재검토하십시오.\n  3.\
    \ 선결제 내역 확인: 결제일 이전에 고객님이 진행한 선결제 금액이 반영되어 이월 원금이 적절히 감소했는지 확인하십시오.\n  4. 결제비율\
    \ 적용 확인: 설정된 최소결제비율(예: 10%)에 따라 정확한 금액이 납부되고 나머지가 이월되었는지 확인하십시오.\n\n- 해결 및 에스컬레이션\n\
    \  - 계산 착오가 확인된 경우: 즉시 정정하고 고객님께 사과드리며, 차월 청구 시 환급하거나 조정하겠습니다.\n  - 설명 후에도 고객님이\
    \ 납득하지 못하시는 경우: 상세 계산 내역을 포함하여 전문 담당자에게 에스컬레이션하여 공식적인 재검토 절차를 밟으십시오.\n\n수수료 체계에\
    \ 대한 상세 내용은 '리볼빙(일부결제금액이월약정): 수수료 안내'를 참고하십시오."
  domain: payments
  product_category: yeoul_revolving
