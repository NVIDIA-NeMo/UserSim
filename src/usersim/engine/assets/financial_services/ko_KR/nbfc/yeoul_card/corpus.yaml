  institution_id: yeoul_card
- id: 12318895-e9f5-5020-89c6-bf6508345205
  title: '장기카드대출(카드론): 약관'
  body: '본 약관은 여울카드의 장기카드대출(카드론) 서비스 이용에 관한 권리와 의무를 규정합니다.


    1. 대출 한도 및 금리: 고객님의 신용 상태에 따라 이용한도 최고액 50,000,000원 범위 내에서 한도가 부여됩니다. 적용 금리는 연
    5.9%에서 연 19.9% 사이에서 결정되며, 이는 신용 등급 및 내부 심사 기준에 따라 차등 적용됩니다.


    2. 상환 및 수수료: 고객님은 약정된 상환 기간 동안 원리금을 분할 납부하셔야 합니다. 특히 본 상품은 중도상환수수료율 0%를 적용하여,
    대출 기간 중 언제라도 추가 상환을 하셔도 별도의 수수료가 부과되지 않습니다.


    3. 청약 철회권: 금융소비자 보호에 관한 법률에 따라, 대출 계약서류를 받은 날과 대출 실행일 중 늦은 날로부터 14일 이내에 청약을 철회할
    수 있습니다. 철회 시 원금과 이용 기간의 이자, 인지세 등 제3자 비용을 상환하시면 중도상환수수료 없이 계약이 해지됩니다.


    4. 계약의 변경 및 종료: 신용 상태의 현저한 변동이 있거나 약관 위반 시 당사는 한도를 조정하거나 대출금의 즉시 상환을 요구할 수 있습니다.
    고객님은 취업, 승진 등으로 신용 상태가 개선된 경우 금리인하요구권을 행사하실 수 있습니다.'
