  institution_id: yeoul_card
- id: 428d7b95-df05-5792-ba6f-bcfa28e59b76
  title: '여울 신용카드: 상품 고르는 방법'
  body: '현대 직장인에게 적합한 카드를 선택하실 때 여울 신용카드의 강점을 확인하십시오.


    여울 신용카드는 일상적인 소비에서 0.7%의 포인트 적립을 통해 실속 있는 혜택을 제공하며, 연회비는 15,000원으로 책정되어 유지 부담이
    적습니다. 또한 필요시 최대 20,000,000원의 이용한도를 통해 유연한 자금 운용이 가능합니다.


    - 적립 중심의 소비를 원하시는 분: 모든 가맹점에서 기본 0.7% 적립을 제공하는 여울 신용카드가 유리합니다.

    - 낮은 유지 비용을 선호하시는 분: 15,000원의 합리적인 연회비로 전문적인 금융 서비스를 이용하시기에 적합합니다.

    - 높은 신용 한도가 필요하신 분: 최고 20,000,000원까지 제공되는 한도 체계를 갖춘 본 상품을 추천드립니다.


    특정 업종 집중 혜택보다 범용적인 적립과 투명한 수수료 체계를 중시하신다면 여울 신용카드가 최선의 선택이 될 것입니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 006d8d3a-a5f2-59d6-ba6f-083165ce4668
  title: '여울 신용카드: 개인정보 처리 안내'
  body: '여울카드는 금융소비자 보호에 관한 법률 및 개인정보 보호법을 엄격히 준수하며, 여울 신용카드 서비스 제공을 위해 다음과 같이 개인정보를
    처리합니다.


    1. 수집 및 이용 목적

    - 신용도 평가 및 한도 설정: 고객님의 소득, 재직 상태, 신용 점수 등을 분석하여 이용한도(최고 20,000,000원)를 결정하고 관리합니다.

    - 혜택 제공 및 정산: 결제 금액에 대해 0.7%의 포인트 적립을 계산하고 이를 고객 계정에 반영하기 위해 거래 내역을 처리합니다.

    - 서비스 유지 및 청구: 연회비 15,000원의 청구 및 수납 관리를 위해 결제 계좌 정보를 이용합니다.


    2. 개인정보의 보유 및 이용 기간

    - 관련 법령에 따라 금융거래 종료 후 일정 기간 보관하며, 보존 기간이 종료된 정보는 안전하게 파기합니다.


    3. 고객의 권리

    - 고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 요청 시 성함과 생년월일을 통해 본인 확인 절차를 거친 후
    처리해 드립니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 0f1eca61-d1b6-5138-86f0-e85527f66522
  title: '여울 신용카드: 이 상품을 사칭한 사기 주의'
  body: '최근 여울 신용카드를 사칭하여 개인정보나 금융정보를 요구하는 피싱 사례가 발생하고 있어 각별한 주의를 당부드립니다.


    여울카드는 어떠한 경우에도 고객님께 전화, 문자, 이메일을 통해 카드 번호, CVV 번호, 비밀번호, 또는 주민등록번호 전체를 요청하지 않습니다.
    특히 ''한도 증액''이나 ''특별 혜택 제공''을 빌미로 외부 링크 접속을 유도하거나 앱 설치를 요구하는 행위는 전형적인 사기 수법이므로
    절대 응하지 마십시오.


    본인 확인이 필요한 경우, 상담원은 오직 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다. 만약 여울카드를 사칭한 의심스러운 연락을
    받으셨거나, 이미 개인정보를 제공하신 경우에는 즉시 고객센터를 통해 카드 이용 정지 조치를 요청하시기 바랍니다. 부정사용 보상은 관련 법령과
    약관에 따라 신속하게 처리해 드리겠습니다.


    더욱 안전한 카드 이용을 위해 정기적으로 비밀번호를 변경하시고, 보안 수칙을 준수해 주십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 7457b5da-a130-5782-a944-92baa931e182
  title: '여울 신용카드: 한도·제한과 유의사항'
  body: '상담원께서는 고객 안내 시 다음의 한도 및 제한 사항을 정확히 고지하시기 바랍니다.


    1. 이용한도 안내

    여울 신용카드의 이용한도 최고액은 20,000,000원입니다. 실제 한도는 고객님의 신용 상태와 상환 능력에 따라 차등 부여되며, 한도 조정
    요청 시 심사 결과에 따라 결정됨을 안내하십시오.


    2. 거래 제한 및 유의사항

    - 할부 거래 철회 및 항변권: 할부 기간 3개월 이상, 결제 금액 20만원 이상인 거래에 한하여 적용됩니다. 철회권은 계약서 수령일로부터
    7일 이내에 행사 가능하며, 항변권은 상품 미배송이나 하자 발생 시 남은 할부금 지급을 거절할 수 있는 권리입니다.

    - 리볼빙 서비스: 일부결제금액이월약정 이용 시, 이월된 금액에는 수수료가 부과되어 총 상환 부담이 커질 수 있음을 명확히 설명하십시오.

    - DSR 규제: 신용카드 할부 구매는 대출이 아니므로 DSR 대상이 아니나, 장기카드대출(카드론) 이용 시에는 DSR 규제가 적용됩니다.


    3. 법적 준수 사항

    모든 안내는 여신전문금융업법 및 금융소비자 보호에 관한 법률을 준수하여 제공되어야 하며, 수수료와 총상환액을 누락하거나 축소하여 안내해서는
    안 됩니다.'
