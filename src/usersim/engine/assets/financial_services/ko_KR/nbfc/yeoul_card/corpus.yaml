  institution_id: yeoul_card
- id: 11f10e0a-51a7-573e-9725-d46de3d636b5
  title: '장기카드대출(카드론): 수수료와 비용'
  body: 'Q: 장기카드대출(카드론) 이용 시 금리와 수수료는 어떻게 되나요?


    A: 본 상품의 대출 금리는 연 5.9%에서 최대 연 19.9% 범위 내에서 고객님의 신용도에 따라 차등 적용됩니다. 또한, 중도상환수수료율은
    0%로, 언제든 원금을 상환하셔도 별도의 비용이 발생하지 않습니다.


    Q: 연체 시에는 어떤 비용이 추가되나요?


    A: 연체 발생 시에는 약정 금리에 최대 3%p를 더한 연체 이자율이 적용됩니다. 다만, 법정 최고금리인 연 20%를 초과할 수 없습니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: faq
