- id: f0ac51bc-beb5-5952-9246-8f6a1c50a6f6
  title: '리볼빙(일부결제금액이월약정): 위험 안내'
  body: '리볼빙(일부결제금액이월약정) 서비스 이용 전, 다음의 위험 요소를 반드시 확인하시기 바랍니다.


    본 서비스는 결제 금액의 일부만 납부함으로써 단기적인 부담을 줄여주지만, 이월된 잔액이 누적될 경우 총 상환 금액이 급격히 증가하는 위험이
    있습니다. 특히 리볼빙 최소결제비율 10%만 지속적으로 납부하실 경우, 원금 감소 속도보다 리볼빙 수수료율(연) 16.5%에 따른 수수료 증가
    속도가 빨라져 이른바 ''부채의 늪''에 빠질 수 있습니다.


    이월된 금액은 단순한 유예가 아니라 수수료가 발생하는 대출과 유사한 성격을 가집니다. 따라서 본인의 상환 능력을 초과하여 서비스를 이용하지
    않도록 주의하십시오. 여울카드는 고객님의 신용 상태와 상환 능력을 고려한 책임 있는 금융 서비스를 제공하며, 상환에 어려움을 겪으시는 고객님께는
    이른 상담과 채무조정 제도를 안내해 드리고 있습니다. 총 상환액과 수수료율을 명확히 인지하시고 신중하게 결정하시기 바랍니다.'
