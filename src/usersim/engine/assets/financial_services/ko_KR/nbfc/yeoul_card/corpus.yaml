- id: 1ad2249b-3024-5c41-bf8e-079201a2cdd3
  title: update_repayment_mandate 사용 기준
  body: '고객이 신용카드 대금이나 대출 상환금이 출금되는 결제 계좌를 변경하고자 하는 경우, 다음의 절차를 준수하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 호출하여 현재 등록된 결제 계좌의 `account_id`를 확인하고 고객에게 안내합니다.

    3. 변경하고자 하는 새로운 은행 이름과 계좌번호를 고객으로부터 정확히 확인합니다.

    4. `update_repayment_mandate` 도구를 사용하여 새로운 결제 계좌 정보를 업데이트합니다.

    5. 계좌 변경이 완료되었음을 고객에게 알리고, 다음 결제일부터 변경된 계좌에서 출금될 예정임을 안내하십시오.


    결제 계좌 변경 시, 변경 시점에 따라 해당 월의 결제 대금이 이전 계좌에서 출금될 수 있으므로 결제일 전 여유 있게 변경하시기를 권고하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: yeoul_card
- id: 36169314-33bc-5cfd-8dc2-6c9253b1751d
  title: update_repayment_mandate 도구 설명서
  body: "도구 이름: `update_repayment_mandate` \n설명: 카드 대금 및 상환금이 출금될 결제 계좌 정보를 최신으로 변경합니다.\n\
    \n매개변수:\n- `account_id`: 변경 대상이 되는 고객 계좌의 식별자입니다.\n- `new_account_number`: 새롭게\
    \ 등록할 결제 계좌번호입니다.\n- `bank_name`: 새 계좌가 개설된 은행의 명칭입니다.\n\n실행 방식: 상담원이 `verify_identity`를\
    \ 통해 인증된 고객으로부터 새 계좌 정보를 받아 직접 도구를 호출하여 처리합니다."
  domain: payments
