- id: f10f7294-8693-5a23-aab1-3a56bfc2fb92
  title: '장기카드대출(카드론): 부정사용으로부터 고객을 보호하기 위해'
  body: '여울카드는 고객님의 소중한 자산과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 특히 장기카드대출(카드론)과 같은 금융 서비스
    이용 시, 다음과 같은 부정사용 패턴에 각별히 주의하시기 바랍니다.


    최근 여울카드를 사칭하여 저금리 대환 대출을 제안하거나, 대출 승인을 위해 특정 앱 설치를 요구하는 스미싱 사례가 빈번히 발생하고 있습니다.
    여울카드는 어떠한 경우에도 고객님의 카드 번호, CVV, 비밀번호, 또는 주민등록번호 전체를 전화나 문자로 요청하지 않습니다. 본인 확인이
    필요한 모든 작업 전에는 반드시 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다.


    만약 본인이 신청하지 않은 대출 실행 통보를 받으셨거나, 개인정보 유출이 의심되는 경우 즉시 고객센터로 신고하여 이용 정지 조치를 취하십시오.
    분실 및 도난 신고 접수 즉시 서비스 이용이 중단되며, 부정사용 보상은 관련 법령과 당사 약관에 따라 신속히 처리됩니다. 안전한 금융 생활을
    위해 출처가 불분명한 링크는 클릭하지 마시고, 의심스러운 요청은 즉시 차단하시기 바랍니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: security_advisory
  source_authority: official
