- id: e32a046e-d887-57ad-acfc-226e069d5a53
  title: '리볼빙(일부결제금액이월약정): 이용 방법과 절차'
  body: 'Q: 리볼빙으로 이월된 금액을 결제일 전에 미리 갚을 수 있습니까?

    A: 네, 가능합니다. 이를 ''선결제''라고 하며, 선결제를 통해 이월 잔액을 줄이면 그만큼 다음 달에 부과될 리볼빙 수수료(연 16.5%)를
    절감하실 수 있습니다.


    Q: 매달 납부하는 비율(결제비율)을 변경할 수 있습니까?

    A: 네, 가능합니다. 최소결제비율인 10%부터 최대 100%까지 고객님의 상황에 맞게 결제비율을 조정하여 설정하실 수 있습니다.


    서비스의 전반적인 구조는 ''리볼빙(일부결제금액이월약정): 상품 개요''에서 상세히 확인하실 수 있습니다.'
  domain: payments
