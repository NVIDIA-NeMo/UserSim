- id: 09d565c8-c42d-5c3d-99cd-43321b2eff7b
  title: '장기카드대출(카드론): 진행 상황과 내역 확인'
  body: '현재 이용 중인 장기카드대출(카드론)의 대출 잔액, 적용 금리, 상환 일정 등 상세 내역을 확인하는 절차입니다.


    1. 본인 확인 수행

    고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 개인 금융 정보 조회가 가능합니다.


    2. 내역 조회 요청

    조회하고자 하는 대출 계약의 진행 상황 또는 전체 이용 내역 확인을 요청하십시오.


    3. 상세 정보 확인

    저희가 안내해 드리는 다음의 정보를 확인하십시오.

    - 대출 원금 및 현재까지의 상환 금액

    - 적용되고 있는 연 이자율

    - 다음 회차 결제일과 상환 예정 금액

    - 남은 대출 기간


    4. 결과 확인 및 기록

    안내받으신 내용이 실제 이용 중인 내역과 일치하는지 확인하십시오. 필요하신 경우 해당 내역을 명세서 형태로 요청하실 수 있습니다.'
