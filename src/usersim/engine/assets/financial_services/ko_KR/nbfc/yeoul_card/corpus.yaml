  institution_id: yeoul_card
- id: 2843bddf-2e7b-59e0-8417-087baaf7ba25
  title: '단기카드대출(현금서비스): 예상과 다른 수수료나 금액'
  body: '고객님께서 청구된 금액이나 수수료가 예상과 다르다고 느끼실 때 확인해야 할 사항입니다.


    증상: 예상보다 이자 금액이 높게 청구됨

    원인 분석:

    1. 이용 기간의 차이: 단기카드대출(현금서비스)은 대출 실행일부터 결제일까지의 일수에 따라 이자가 계산됩니다. 결제일이 평소보다 늦어졌다면
    이자 금액이 증가할 수 있습니다.

    2. 연체 이자 발생: 결제일에 원리금을 완납하지 못했을 경우, 약정금리에 최대 3%p가 가산된 연체이자율이 적용됩니다.

    3. 금리 적용 오류: 현금서비스 금리(연) 18.2%가 정확히 적용되었는지 확인하십시오.


    해결 방법:

    - 최근 이용 내역의 대출일과 결제일을 대조하여 실제 이용 일수를 확인하십시오.

    - 연체 여부를 확인하시고, 미납금이 있다면 즉시 상환하여 추가 이자 발생을 막으십시오.


    위의 방법으로 해결되지 않거나 계산 근거가 불분명한 경우, 전문 담당자에게 에스컬레이션하여 상세 내역 조사를 요청하십시오. 조사 결과에 따라
    정정 처리 및 안내를 받으실 수 있습니다.'
