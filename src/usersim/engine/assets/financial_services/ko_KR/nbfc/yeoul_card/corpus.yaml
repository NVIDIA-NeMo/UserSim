  institution_id: yeoul_card
- id: 438a5b69-a01f-568c-8613-53aa1dd44b53
  title: '할부: 수수료 안내'
  body: '여울카드 할부 서비스 이용 시 적용되는 수수료 체계입니다. 모든 수수료는 자금 운용 비용과 리스크 관리를 위해 책정되며 투명하게 공개됩니다.


    - 할부수수료율(연, 하한): 9.9%

    - 할부수수료율(연, 상한): 19.9%


    ※ 수수료 적용 기준:

    - 위 요율은 연이율 기준이며, 고객님의 개인 신용 등급에 따라 차등 적용됩니다.

    - 가맹점 무이자 할부 혜택 적용 시 해당 기간 동안의 수수료는 면제됩니다.

    - 특정 프로모션 조건 충족 시 수수료 감면 혜택이 제공될 수 있습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: ecab99cb-4b83-5c28-bb19-390ce3e907c5
  title: '할부: 처리가 끝나지 않거나 보류 중일 때'
  body: '할부 결제 요청 후 ''처리 중'' 상태가 지속되거나 승인이 보류되는 경우, 다음의 내용을 순차적으로 확인해 주십시오.


    1. 이용 한도 확인: 결제하려는 총 금액이 현재 고객님의 잔여 이용 한도를 초과하지 않았는지 확인하십시오. 할부는 분할 납부 방식이지만,
    결제 시점에는 총 금액만큼의 한도가 확보되어야 합니다.

    2. 가맹점 설정 확인: 일부 가맹점의 경우 할부 결제를 지원하지 않거나, 특정 개월 수 이상의 할부를 제한하고 있을 수 있습니다.

    3. 시스템 일시 오류: 통신 환경이나 시스템 일시 과부하로 인해 승인 응답이 늦어질 수 있습니다. 잠시 후 다시 시도해 주십시오.


    위의 사항을 확인했음에도 문제가 해결되지 않는다면, 저희 상담원에게 요청하십시오. 전문 담당자가 단계별 에스컬레이션 절차에 따라 거래 상태를
    정밀 분석하고 처리 결과를 안내해 드리겠습니다. 처리 결과는 영업일 기준 3~7일 이내에 개별 통보됩니다.


    정확한 가입 및 이용 조건은 ''할부: 가입 대상''에서 다시 한번 확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 8e2acd9f-b712-5698-a77d-3930fc293eb9
  title: '할부: 가입 대상'
  body: '여울카드 할부 서비스 이용을 위한 자격 요건은 다음과 같습니다.


    - 여울 신용카드 보유 여부: 유효한 여울 신용카드를 보유하고 계신 고객님 (필수)

    - 이용 한도 잔액: 결제 희망 총 금액 이상의 잔여 한도가 확보된 고객님 (필수)

    - 가맹점 조건: 신용카드 할부 결제 시스템을 갖춘 가맹점에서 이용하는 경우 (필수)

    - 신용 상태: 내부 심사 기준에 따라 할부 이용이 제한되지 않는 신용 상태의 고객님 (필수)'
  domain: payments
  product_category: yeoul_halbu
