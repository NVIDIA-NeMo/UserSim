    30%로 변경하고 싶습니다"라고 요청하십시오.

    3. 변경 내용 확인: 상담원이 변경된 설정 값과 그에 따른 예상 결제 금액의 변화를 안내해 드립니다. 이때 리볼빙 최소결제비율 10% 미만으로는
    설정이 불가함을 확인하십시오.

    4. 최종 승인: 변경 내용에 동의하시면 상담원이 시스템에 반영하고 처리 완료 메시지를 전달합니다.


