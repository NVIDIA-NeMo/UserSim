- id: 0fd74e49-92c0-5f59-a1af-7d89107f5d60
  title: '리볼빙(일부결제금액이월약정): 개인정보 처리 안내'
  body: '여울카드는 금융위원회와 금융감독원의 감독하에 여신전문금융업법 및 금융소비자 보호에 관한 법률을 엄격히 준수하며, 리볼빙(일부결제금액이월약정)
    서비스 제공을 위한 개인정보를 다음과 같이 처리합니다.


    ■ 개인정보 수집 및 이용 목적

    - 서비스 제공 및 관리: 리볼빙 약정 설정, 이월 금액 계산 및 수수료(연 16.5%) 부과, 결제 대금 청구

    - 본인 확인: 서비스 신청 및 변경 시 성함과 생년월일을 통한 본인 인증 수행

    - 신용 평가: 고객의 상환 능력 및 신용 상태를 고려한 책임 있는 한도 제공


    ■ 개인정보 보유 및 이용 기간

    - 원칙적으로 서비스 이용 계약 기간 동안 보유하며, 관계 법령(상법, 전자금융거래법 등)에서 정한 보존 기간이 있는 경우 해당 기간까지 안전하게
    보관 후 파기합니다.


    ■ 제3자 제공 및 위탁

    - 법적 의무 이행이나 금융당국의 조사, 또는 신용정보집중기관으로의 정보 제공이 필요한 경우 법령에 따라 처리합니다.


    ■ 고객의 권리

    - 고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 다만, 금융 거래 관계 유지를 위해 필수적인 정보의 경우
    제한될 수 있습니다.


    여울카드는 고객님의 개인정보를 투명하게 관리하여 신뢰받는 금융 파트너가 되겠습니다.'
