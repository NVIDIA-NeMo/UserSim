- id: 39a9154b-4833-5866-afaf-6c6a09abe2e0
  title: '여울 신용카드: 상품 개요'
  body: '여울 신용카드는 포인트 적립과 일상적 결제 혜택을 통해 고객님의 소비 가치를 높여드리는 여울카드의 핵심 상품입니다. 디지털 금융 환경에
    익숙한 현대 직장인분들이 스마트한 소비 생활을 누리실 수 있도록 설계되었습니다.


    본 상품의 주요 제공 혜택과 이용 조건은 다음과 같습니다.


    - 포인트 적립률: 이용 금액의 0.7%가 포인트로 적립되어 더욱 경제적인 소비가 가능합니다.

    - 연회비: 연 15,000원으로 합리적인 수준에서 프리미엄 서비스를 제공합니다.

    - 이용한도 최고액: 고객님의 신용 상태와 상환 능력에 따라 최대 20,000,000원까지 한도가 부여됩니다.


    투명한 수수료 체계와 신속한 한도 제공을 통해 고객님의 신뢰받는 금융 파트너가 되겠습니다. 상세한 이용 방법은 ''여울 신용카드: 가입과 이용
    시작''에서 확인해 주십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 8007ff39-79e9-5541-bb7a-393c13a7fc12
  title: '여울 신용카드: 연회비 안내'
  body: '여울 신용카드의 연회비와 관련하여 자주 묻는 질문을 안내해 드립니다.


    **질문 1: 여울 신용카드의 연회비는 얼마입니까?**

    답변: 여울 신용카드의 연회비는 15,000원입니다. 이는 안정적인 서비스 제공과 카드 유지 관리를 위해 부과되는 비용입니다.


    **질문 2: 연회비는 언제 결제됩니까?**

    답변: 카드 발급 첫해에는 카드 발급 및 배송 완료 후 청구되며, 이후에는 매년 가입일 기준으로 정기적으로 청구됩니다.


    **질문 3: 연회비 면제 혜택이 있습니까?**

    답변: 여울카드의 수수료 정책에 따라, 우수 고객 혜택 또는 특정 프로모션 조건을 충족하신 경우 연회비 면제 또는 감면 혜택을 제공해 드립니다.
    자세한 내용은 ''여울 신용카드: 진행 중인 이벤트''를 참고하십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: faq
  source_authority: official
