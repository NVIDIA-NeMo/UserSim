- id: 7881173d-be7e-5437-a4d4-d749207389df
  title: '장기카드대출(카드론): 처리가 끝나지 않거나 보류 중일 때'
  body: '대출 신청 후 처리가 지연되거나 보류 상태로 유지될 때의 해결 방법입니다.


    [발생 가능한 증상]

    - 대출 신청 완료 후 입금 예정 시간 내에 자금이 입금되지 않음

    - 대출 심사 상태가 ''보류'' 또는 ''검토 중''으로 표시됨


    [원인 및 확인 순서]

    1. 본인 인증 정보 불일치: 신청 시 입력하신 성함이나 생년월일이 등록 정보와 일치하는지 확인하십시오.

    2. 한도 초과 및 DSR 규제: 총부채원리금상환비율(DSR)이 제2금융권 기준인 50%를 초과하여 한도가 제한되었을 수 있습니다.

    3. 추가 증빙 필요: 신용 상태 확인을 위해 추가적인 서류나 정보 확인이 필요한 경우 심사가 보류될 수 있습니다.


    [해결 방법 및 조치]

    - 정보 수정: 잘못 입력된 정보가 있다면 즉시 수정을 요청하십시오.

    - 심사 대기: 내부 심사 중인 경우 통상적으로 영업일 기준 1~3일이 소요됩니다.


    [에스컬레이션 안내]

    위 사항을 확인했음에도 해결되지 않는 경우, 전문 담당자가 배정되어 상세 사유를 분석하고 개별 연락을 드립니다. 진행 상황은 상담원을 통해
    실시간으로 확인하실 수 있습니다.'
