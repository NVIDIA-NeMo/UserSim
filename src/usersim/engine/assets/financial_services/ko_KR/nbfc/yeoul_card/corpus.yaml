- id: 80a578b6-1c12-51aa-9f51-6ca98aa2e47c
  title: '장기카드대출(카드론): 상품 고르는 방법'
  body: '자금 수요의 성격에 따라 장기카드대출(카드론)과 단기카드대출(현금서비스) 중 적합한 상품을 선택하십시오.


    - 장기카드대출(카드론): 비교적 큰 금액이 필요하며, 기간을 나누어 안정적으로 상환하고자 하는 분께 적합합니다. 특히 중도상환수수료율이 0%이므로
    중도에 원금을 상환할 계획이 있는 분께 매우 유리합니다.

    - 단기카드대출(현금서비스): 소액의 자금을 아주 짧은 기간 동안 긴급하게 사용해야 하는 분께 적합합니다.


    큰 금액의 자금을 유연한 상환 조건(중도상환수수료 0%)으로 이용하시려면 장기카드대출(카드론)을 추천해 드립니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: comparison
  source_authority: official
