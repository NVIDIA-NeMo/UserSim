  institution_id: yeoul_card
- id: 023ddaee-69ff-5040-9d17-e4ffd6c1ed3d
  title: '여울 신용카드: 가입부터 이용까지'
  body: '여울 신용카드의 가입 절차부터 주요 이용 조건까지의 통합 안내서입니다. 상담원은 고객 안내 시 다음의 내용을 정확히 전달하십시오.


    1. 가입 및 발급

    고객의 신용 상태와 상환 능력을 심사하여 발급 여부를 결정합니다. 가입 시 연회비 15,000원이 발생하며 이는 상품의 기본 운영 및 혜택
    제공을 위한 비용입니다.


    2. 핵심 혜택 및 한도

    - 포인트 적립: 일상 결제 시 0.7%의 포인트 적립률이 적용되어 스마트한 소비 생활을 돕습니다.

    - 이용한도: 고객별 심사 결과에 따라 차등 부여되며, 이용한도 최고액은 20,000,000원입니다.


    3. 이용 시 유의사항

    - 모든 결제는 고객의 부여된 한도 내에서 가능하며, 한도 조정이 필요한 경우 별도의 신청 절차를 거쳐야 합니다.

    - 연체 발생 시 약정 금리에 따라 연체 이자가 부과될 수 있으며, 이는 고객의 신용 점수에 영향을 줄 수 있습니다.


    상세한 가입 대상 및 필요 서류는 ''여울 신용카드: 가입 대상''과 ''여울 신용카드: 필요 서류''를 참조하십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: product_sheet
  source_authority: official
