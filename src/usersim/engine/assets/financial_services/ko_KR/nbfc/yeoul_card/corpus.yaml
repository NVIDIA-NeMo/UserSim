  mentions_tools: []
  institution_id: yeoul_card
- id: 8d8df5cc-04ee-5c00-9d69-e43e16d10a6f
  title: '장기카드대출(카드론): 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 장기카드대출(카드론)의 상환 금액이나 이자 내역이 예상과 다를 때의 확인 및 처리 절차입니다.


    **증상**

    - 청구된 이자 금액이 생각보다 많음

    - 원금을 상환했음에도 잔액에 반영되지 않았다고 느껴짐


    **확인 순서**

    1. 결제일 및 이자 계산 방식 확인: 대출 금리가 연 단위로 적용되므로, 일할 계산된 이자가 정확히 산출되었는지 확인하십시오. 적용 금리는
    연 5.9% ~ 19.9% 범위 내에 있습니다.

    2. 연체 여부 확인: 결제일에 상환이 이루어지지 않았다면 약정 금리에 최대 3%p가 가산된 연체 이자가 부과되었을 수 있습니다. (단, 연
    20% 상한 준수)

    3. 중도상환 반영 시점 확인: 중도상환수수료율은 0%이지만, 상환 처리 시점에 따라 당월 명세서에 즉시 반영되지 않을 수 있습니다.


    **해결 방법**

    - 계산 착오나 전산 오류가 의심되는 경우, 저희가 상세 상환 스케줄을 다시 산출하여 안내해 드리겠습니다.


    **에스컬레이션**

    단순 안내로 해결되지 않는 복잡한 금액 불일치 건은 전문 담당자가 배정되어 전수 조사를 실시하며, 결과는 영업일 기준 7일 이내에 고객님께
    개별 안내해 드립니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: troubleshooting
