- id: 0bda1c9f-1c2b-5a03-8db1-d0710794c2d5
  title: '여울 신용카드: 진행 상황과 내역 확인'
  body: '여울 신용카드의 이용 내역 및 결제 진행 상황을 확인하는 절차는 다음과 같습니다.


    1. 본인 확인 단계

    상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 필수적인 본인 인증 절차입니다.


    2. 확인 내용 요청

    조회하고자 하시는 내역(예: 이번 달 이용 금액, 특정 거래의 승인 상태, 포인트 적립 현황 등)을 구체적으로 요청하십시오.


    3. 상세 내역 확인

    상담원이 제공하는 결제 예정 금액, 이용 일시, 가맹점 정보 및 적립된 포인트 내역을 확인하십시오. 할부 거래의 경우 남은 회차와 잔액이 함께
    안내됩니다.


    4. 결과 확인 및 마무리

    안내받으신 내역이 실제 소비 기록과 일치하는지 확인하시고, 추가 문의 사항이 없다면 상담을 종료하십시오.


    이용 내역에 대해 더 궁금하신 점은 ''여울 신용카드: 가입과 이용 시작'' 가이드를 참고하시기 바랍니다.'
