    \ 호출하여 처리합니다.\n- 입력 인자:\n    - account_id: 비율을 변경할 리볼빙 약정 계좌의 고유 식별자입니다.\n   \
    \ - new_payment_ratio: 새로 적용할 약정결제비율입니다.\n- 효과: 해당 계좌의 리볼빙 결제 비율이 업데이트되어, 이후 결제일부터\
    \ 새로운 비율에 따라 금액이 청구됩니다.\n\n호출 전 verify_identity를 통한 본인 인증이 반드시 완료되어야 합니다."
