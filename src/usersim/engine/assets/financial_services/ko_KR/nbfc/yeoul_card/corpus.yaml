  institution_id: yeoul_card
- id: ef942afb-9cfe-5e10-ab3f-76fcf715684a
  title: '할부: 부정사용으로부터 고객을 보호하기 위해'
  body: '여울카드는 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 특히 할부 결제와 같은 고액 거래의 경우, 이를 악용한 피싱이나
    스미싱 범죄에 각별한 주의가 필요합니다.


    여울카드는 어떠한 경우에도 고객님께 카드 번호 전체, CVV 번호, 카드 비밀번호, 또는 주민등록번호 전체를 요구하지 않습니다. 본인 확인이
    필요한 경우 오직 성함과 생년월일만을 요청드리오니, 그 외의 민감한 정보를 요구하는 연락은 즉시 의심하십시오.


    만약 카드를 분실하셨거나 도난당하셨을 때는 즉시 신고해 주십시오. 신고 접수 즉시 이용 정지 조치를 취하며, 부정사용 보상은 관련 법령과 약관에
    따라 신속히 처리하겠습니다. 또한 할부 거래의 철회 및 항변권 행사는 법정 기한 내에 접수하여 7영업일 이내에 답변드리는 것을 원칙으로 하고
    있습니다.


    의심스러운 거래가 발견되거나 개인정보 유출이 우려되신다면 즉시 고객센터로 연락하여 조치를 받으시기 바랍니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: c1c12fa8-e585-517d-be60-d5205a812038
  title: '할부: 약관'
  body: '본 약관은 여울카드의 할부 서비스 이용에 관한 권리와 의무를 규정합니다.


    1. 서비스 제공 및 한도: 여울카드는 고객의 신용 상태와 상환 능력을 고려하여 할부 이용 한도를 부여합니다. 최대 할부 개월 수는 24개월까지
    설정 가능하며, 이는 고객의 신용 등급 및 상품 조건에 따라 달라질 수 있습니다.


    2. 수수료 및 납부: 할부 이용 시 연 9.9%에서 연 19.9% 사이의 할부수수료율이 적용됩니다. 수수료는 잔액에 대해 매월 부과되며,
    고객은 약정된 결제일에 원금과 수수료를 합산하여 납부해야 합니다.


    3. 계약의 변경 및 종료: 고객의 신용 상태가 개선된 경우 금리인하요구권을 행사하여 수수료율 인하를 요청할 수 있습니다. 여울카드는 정당한
    사유가 있을 경우 약관을 변경할 수 있으며, 이 경우 사전에 고지합니다.


    4. 철회 및 항변권: 할부 기간 3개월 이상, 금액 200,000원 이상인 거래에 대해 고객은 계약서를 받은 날로부터 7일 이내에 철회할
    수 있습니다. 또한 상품 미배송이나 하자 등의 사유가 발생한 경우, 남은 할부금 지급을 거절하는 항변권을 행사할 수 있습니다.


    5. 연체 및 상환: 결제 금액을 기한 내에 납부하지 않을 경우 약정금리에 최대 3%p를 더한 연체이자가 부과되며, 법정 최고금리인 연 20%를
    초과할 수 없습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 8608c8ab-d5ed-5bb0-a1fd-1a42b32c9a13
  title: '할부: 이런 분께 알맞습니다'
  body: '여울카드의 할부 서비스는 단기적인 경제적 부담을 낮추고 계획적인 소비를 지향하는 현대 직장인분들께 최적화된 상품입니다.


    다음과 같은 상황에 계신 분들께 추천드립니다:


    - 가전제품, 가구 구매 등 일시에 큰 금액을 지출해야 하여 월별 지불 부담을 나누고 싶으신 분

    - 매월 고정적인 지출 예산을 엄격하게 관리하여 자금 운용의 효율성을 높이고자 하시는 분

    - 최대 24개월이라는 넉넉한 기간 설정을 통해 무리하지 않는 상환 계획을 세우고 싶으신 분


    여울카드의 할부는 고객님의 신용도에 따라 연 9.9%에서 연 19.9%의 수수료율이 적용됩니다. 투명한 수수료 체계를 통해 고객님께서 지불하실
    비용을 명확히 확인하실 수 있으며, 신속한 한도 제공으로 스마트한 소비 생활을 돕는 신뢰받는 금융 파트너가 되겠습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 320e29a3-cf1a-5dcb-b783-91cc6425808d
  title: '할부: 할부수수료율(연, 상한) 안내'
  body: 'Q: 할부 이용 시 적용될 수 있는 가장 높은 수수료율은 얼마입니까?


    A: 여울카드 할부 서비스의 할부수수료율(연, 상한)은 19.9%입니다. 고객님의 신용 상태와 상환 능력, 그리고 적용되는 상품 조건에 따라
    차등 적용되며, 최대 19.9% 범위 내에서 결정됩니다.


    Q: 수수료율이 결정되는 기준이 무엇입니까?


    A: 수수료율은 금융위원회의 감독하에 여신전문금융업법을 준수하며, 고객님의 신용 점수와 기존 거래 실적 등 리스크 관리 기준에 따라 산정됩니다.
    자세한 본인의 적용 이율은 고객센터나 앱을 통해 확인하십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: ea287a6f-c8c9-5c9c-8574-637ce36a435a
  title: '할부: 해지·변경·상품 전환'
  body: '이미 이용 중인 할부 거래의 기간을 변경하거나, 할부를 해지하여 일시불로 전환하는 방법은 다음과 같습니다.


    **사전 준비 사항**

    - 본인 확인을 위한 성함과 생년월일을 준비해 주십시오.


    **처리 절차**

    1. 상담원에게 할부 계약의 해지, 기간 변경 또는 일시불 전환을 요청하십시오.

    2. 성함과 생년월일을 말씀하시어 본인 인증을 완료해 주십시오.

    3. 변경을 원하시는 거래 내역과 변경하고자 하는 개월 수(최대 24개월 이내) 또는 해지 의사를 전달하십시오.

    4. 상담원이 변경 후의 예상 수수료와 월 납부 금액을 안내해 드립니다.

    5. 안내 내용을 확인하신 후 최종 승인 의사를 밝히십시오.


    **완료 확인**

    - 요청하신 내용이 반영되면 즉시 확인 메시지가 발송되며, 다음 결제일부터 변경된 금액이 청구됩니다. 변경된 내역은 앱의 결제 예정 금액 메뉴에서
    확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 3687e8e4-7ef3-548b-a04f-436693b49fdf
  title: '할부: 예상과 다른 수수료나 금액'
  body: '고객님께서 예상하신 금액보다 할부 수수료나 월 청구 금액이 높게 나타나는 경우, 다음의 사항을 순서대로 확인해 주시기 바랍니다.


    **확인 사항**

    1. **수수료율 적용 확인**: 할부수수료율은 연 9.9%에서 19.9% 사이에서 고객님의 신용도에 따라 차등 적용됩니다. 적용된 이율이
    예상과 일치하는지 확인하십시오.

    2. **이자 계산 방식**: 할부 수수료는 매달 감소하는 원금 잔액에 대해 적용되므로, 초기 회차의 수수료가 상대적으로 높을 수 있습니다.

    3. **가맹점 무이자 혜택 여부**: 무이자 할부 적용 대상 거래인지 다시 한번 확인하십시오. 무이자 혜택이 적용되지 않은 경우 약정 수수료가
    부과됩니다.


    **해결 방법**

    - 위 사항을 확인한 후에도 금액이 이상하다고 판단되시면, 상세 내역 조회를 요청하십시오. 상담원이 결제 원금, 적용 이율, 일수를 재계산하여
    상세히 안내해 드리겠습니다.


    **에스컬레이션**

    - 단순 안내로 해결되지 않는 복잡한 계산 오류나 민원의 경우, 단계별 에스컬레이션 절차에 따라 수수료 정산 전문 담당자에게 배정하여 7영업일
    이내에 최종 답변을 드리겠습니다.'
