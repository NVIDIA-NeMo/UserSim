- id: 0ce07e23-a901-59ad-bcef-4ce1f5908dd1
  title: '할부: 상품 개요'
  body: '여울카드의 할부 서비스는 고액 결제 시 구매 금액을 여러 달에 나누어 납부함으로써 단기적인 경제적 부담을 낮출 수 있는 실용적인 기능입니다.
    한 번의 큰 지출이 부담스러운 현대 직장인 고객님께서 계획적인 소비 생활을 유지하실 수 있도록 돕는 여울카드의 핵심 서비스 중 하나입니다.


    본 서비스의 주요 내용은 다음과 같습니다.


    - 최대 할부 개월 수: 최대 24개월까지 설정이 가능하여 고객님의 자금 상황에 맞게 상환 기간을 유연하게 선택하실 수 있습니다.

    - 할부수수료율(연): 고객님의 신용 상태에 따라 연 9.9%에서 최대 19.9%까지 차등 적용됩니다.


    가맹점의 무이자 할부 행사 적용 시에는 수수료가 면제될 수 있으며, 상세한 수수료 산정 방식과 적용 요율은 고객님의 신용 등급에 따라 결정됩니다.
    투명한 비용 구조를 통해 스마트한 금융 생활을 지원하겠습니다.


    더 자세한 금리 정보는 ''할부: 금리·요율 안내''에서 확인해 주십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: e0174c04-6ef9-5145-b728-c694fca8febb
  title: '할부: 할부수수료율(연, 하한) 안내'
  body: '질문: 할부 이용 시 적용되는 가장 낮은 수수료율은 얼마입니까?


    답변: 여울카드 할부 서비스의 할부수수료율(연, 하한)은 9.9%입니다. 다만, 이 요율은 모든 고객님께 동일하게 적용되는 것이 아니라, 고객님의
    신용 점수, 이용 실적 및 내부 심사 기준에 따라 결정됩니다. 신용 상태가 개선되신 경우 금리인하요구권을 통해 요율 조정을 요청하실 수 있습니다.


    상세한 수수료 체계는 ''할부: 수수료 안내''를 참고해 주시기 바랍니다.'
  domain: payments
  product_category: yeoul_halbu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 28ff9b20-4d38-5439-8aa2-6e5fd9e21299
  title: '할부: 가입과 이용 시작'
  body: '여울카드의 할부 서비스를 이용하여 결제하는 방법은 매우 간단합니다. 아래의 절차를 따라 이용해 주십시오.


    1. 본인 확인: 상담원을 통해 서비스를 요청하시는 경우, 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 정확한 한도
    확인 및 서비스 제공이 가능합니다.

    2. 할부 기간 선택: 결제하시려는 금액과 원하는 납부 기간을 선택하십시오. 여울카드는 최대 24개월까지 할부 설정이 가능합니다.

    3. 수수료 확인: 선택하신 기간에 따라 적용되는 수수료율(연 9.9% ~ 19.9%)과 이에 따른 월 예상 납부 금액을 안내받으십시오. 무이자
    할부 적용 대상 가맹점인지 먼저 확인하시는 것을 추천드립니다.

    4. 결제 승인: 선택하신 할부 개월 수와 수수료 조건에 동의하시면 결제가 완료됩니다.

    5. 내역 확인: 결제 완료 후 전송되는 승인 문자나 모바일 앱의 이용 내역을 통해 할부 개월 수와 금액이 정확히 설정되었는지 확인하십시오.


    할부 이용 중 가입 대상 조건이나 제한 사항이 궁금하시다면 ''할부: 가입 대상''을 확인해 주십시오.'
  domain: payments
  product_category: yeoul_halbu
  document_type: how_to_guide
  source_authority: official
