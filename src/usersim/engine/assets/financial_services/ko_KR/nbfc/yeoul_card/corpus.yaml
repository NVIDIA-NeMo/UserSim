- id: 8d6a4e6d-6f5a-51ed-985c-17d0bbf0c886
  title: '단기카드대출(현금서비스): 현금서비스 이용한도 최고액 안내'
  body: 'Q: 단기카드대출(현금서비스)로 이용 가능한 최대 금액은 얼마인가요?

    A: 여울카드의 단기카드대출(현금서비스) 이용한도 최고액은 5,000,000원입니다. 다만, 실제 이용 가능한 한도는 고객님의 신용 상태,
    상환 능력, 이용 실적 등을 종합적으로 고려하여 개인별로 다르게 부여됩니다.


    Q: 부여된 한도를 높이거나 낮출 수 있습니까?

    A: 네, 가능합니다. 고객님의 소득 증가나 신용 점수 상승 등 조건이 변경된 경우 한도 조정을 요청하실 수 있습니다. 자세한 절차는 ''단기카드대출(현금서비스):
    해지·변경·상품 전환'' 안내를 참고하십시오.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: faq
  source_authority: official
  placeholder: true
