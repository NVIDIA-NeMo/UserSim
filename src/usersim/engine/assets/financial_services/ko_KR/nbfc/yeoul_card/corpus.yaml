    바랍니다.


    2. 절대 제공해서는 안 되는 정보

    여울카드는 어떠한 경우에도 카드 번호, CVV, 비밀번호, 주민등록번호 전체를 전화나 메시지로 요청하지 않습니다. 이러한 정보를 요구하는 곳은
    사칭 기관일 가능성이 높으므로 즉시 응답을 중단하십시오.


    3. 분실 및 도난 시 즉각 조치

    카드를 분실하거나 도난당하셨을 때는 즉시 신고하시기 바랍니다. 접수 즉시 이용 정지 조치를 취하며, 부정사용 보상은 관련 법령과 약관에 따라
    신속히 처리해 드리겠습니다.


    4. 의심스러운 거래 발생 시

    본인이 이용하지 않은 결제 내역이 확인되거나, 리볼빙 결제 금액이 예상과 다를 경우 즉시 당사 고객센터로 알려주십시오.


