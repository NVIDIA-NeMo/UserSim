- id: fc8ff429-0e48-596d-ab9b-356fcd148ddf
  title: '장기카드대출(카드론): 이용 조건별 차이'
  body: '장기카드대출(카드론)의 이용 조건에 따른 결과는 다음과 같습니다.


    - 신용 상태 및 상환 능력: 대출 금리 결정 (연 5.9% ~ 19.9% 범위 내 차등 적용)

    - 내부 신용 등급 및 소득 수준: 이용한도 결정 (최대 50,000,000원 이내 차등 부여)

    - DSR (총부채원리금상환비율): 연간 원리금 상환액이 연 소득의 50% 초과 시 한도 제한 또는 승인 거절 가능성 있음

    - 상환 능력 미달: 대출 승인 거절 또는 한도 축소'
