  institution_id: yeoul_card
- id: 8ecfaf54-2c08-514d-83fb-3d3333006318
  title: get_loan_details 사용 기준
  body: '고객이 이용 중인 단기카드대출(현금서비스) 및 장기카드대출(카드론)의 잔액, 금리, 상환 일정을 안내하는 절차입니다.


    처리 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 사용하여 고객의 `account_id`를 확인하십시오.

    3. `get_loan_details` 도구를 호출하여 현재 이용 중인 대출 상품의 이용 잔액, 적용 금리, 다음 결제일 및 결제 예정 금액
    정보를 조회하십시오.

    4. 조회된 정보를 바탕으로 고객에게 현재 상환해야 할 원리금과 금리를 정확하게 안내하십시오.

    5. 금리 인하 요구권 등 신용 상태 개선에 따른 금리 조정 가능 여부에 대해 문의하실 경우 관련 안내를 제공하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: yeoul_card
- id: 05d75b33-fbfe-55bf-929c-b6568d8d842d
  title: get_loan_details 도구 설명서
  body: "이 도구는 고객이 이용하고 있는 현금서비스와 카드론의 상세 대출 내역을 조회하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이\
    \ 대화 중 직접 호출하여 실행합니다.\n- 필요 인자:\n  - `account_id`: `get_accounts` 도구를 통해 확인된 고객의\
    \ 계좌/카드 식별자입니다.\n\n본인 인증(`verify_identity`)이 완료된 상태에서 호출하며, 반환 값으로 각 대출 상품별 이용\
    \ 잔액, 현재 적용 금리, 다음 결제일 및 납부 예정 금액 정보를 제공합니다."
