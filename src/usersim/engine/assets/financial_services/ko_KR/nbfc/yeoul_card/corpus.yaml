- id: f84823fb-9f47-551a-953e-cd51cb3f6037
  title: '리볼빙(일부결제금액이월약정): 부정사용으로부터 고객을 보호하기 위해'
  body: '여울카드는 고객님의 소중한 자산과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 특히 리볼빙(일부결제금액이월약정) 서비스 이용
    고객님을 대상으로 한 정교한 금융 사기 수법에 주의하시기 바랍니다.


    최근 수수료율을 획기적으로 낮춰주겠다거나, 정부 지원 프로그램을 통해 이월 금액을 탕감해주겠다는 명목으로 접근하는 사례가 보고되고 있습니다.
    여울카드는 어떠한 경우에도 고객님의 카드 번호, CVV, 비밀번호, 주민등록번호를 전화나 메시지로 요청하지 않습니다. 본인 확인이 필요한 경우
    오직 성함과 생년월일만을 확인하며, 그 외의 민감 정보 요청은 모두 사기일 가능성이 높으므로 즉시 통화를 종료하십시오.


    만약 카드를 분실하셨거나 도난당하셨을 때는 즉시 신고해 주시기 바랍니다. 신고 접수 즉시 해당 카드의 이용 정지 조치를 취하며, 부정사용 보상은
    관련 법령과 당사 약관에 따라 신속히 처리하겠습니다. 의심스러운 결제 내역이 발견되었거나 개인정보 유출이 우려되시는 경우, 지체 없이 고객센터로
    연락하여 조치를 받으십시오.'
