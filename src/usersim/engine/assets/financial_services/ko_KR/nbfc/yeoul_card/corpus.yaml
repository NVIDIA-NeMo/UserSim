  institution_id: yeoul_card
- id: ca77d941-7e2c-522b-bc6d-742467574d16
  title: '여울 신용카드: 포인트 적립률 안내'
  body: '질문: 여울 신용카드를 사용하면 포인트가 얼마나 적립되나요?

    답변: 여울 신용카드는 고객님의 소비 가치를 높이기 위해 0.7%의 포인트 적립률을 제공하고 있습니다. 결제하신 금액에 대해 해당 비율만큼
    포인트가 적립됩니다.


    질문: 모든 가맹점에서 0.7%가 동일하게 적립되나요?

    답변: 기본적으로 0.7%의 적립률이 적용되나, 가맹점의 성격이나 특정 프로모션 조건에 따라 적립 대상에서 제외되거나 적립률이 변동될 수 있습니다.
    상세한 적립 기준은 ''여울 신용카드: 상품 개요''를 참고해 주십시오.'
  domain: payments
  product_category: yeoul_credit
  document_type: faq
  source_authority: official
