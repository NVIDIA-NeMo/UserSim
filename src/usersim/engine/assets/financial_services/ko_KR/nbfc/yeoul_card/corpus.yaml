- id: 6113afbb-8d33-5347-8180-59e5cc0ae57f
  title: '단기카드대출(현금서비스): 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자금 상황에 따라 단기카드대출(현금서비스)보다 적합한 상품이 있을 수 있습니다. 상담원은 다음의 비교 기준을 바탕으로 안내하십시오.


    - 단기카드대출(현금서비스): 연 18.2%의 금리가 적용되며, 소액의 자금을 며칠에서 몇 주 정도 매우 짧게 사용하고 다음 결제일에 일시
    상환하고자 하는 고객님께 적합합니다. 절차가 매우 신속하다는 장점이 있습니다.

    - 장기카드대출(카드론): 상대적으로 큰 금액을 수개월에서 수년에 걸쳐 나누어 갚고자 하는 고객님께 적합합니다. 중도상환수수료가 없으며, 월
    상환 부담을 낮출 수 있습니다.


    **추천 가이드**

    - 갑작스러운 소액 현금 필요 → 단기카드대출(현금서비스) 추천

    - 규모가 큰 자금의 장기 분할 상환 필요 → 장기카드대출(카드론) 추천


    상세한 차이점은 ''장기카드대출(카드론): 상품 개요''에서 확인하실 수 있습니다.'
