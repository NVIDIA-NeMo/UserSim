  institution_id: yeoul_card
- id: 19369efd-7685-5ec0-b2b0-fda4a8e29382
  title: '단기카드대출(현금서비스): 해지·변경·상품 전환'
  body: '단기카드대출(현금서비스)의 한도를 변경하거나 서비스를 해지, 또는 다른 상품으로 전환하는 절차를 안내해 드립니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 서비스 변경이 가능합니다.

    2. 요청 사항 전달: 서비스 해지, 한도 증액/감액, 또는 장기카드대출(카드론)로의 전환 중 원하시는 사항을 요청하십시오.

    3. 심사 및 확인: 한도 변경이나 상품 전환의 경우, 당사의 내부 신용 평가 기준에 따라 심사가 진행됩니다. 심사 결과에 따라 요청하신 한도가
    반영되지 않을 수 있습니다.

    4. 완료 통보: 처리가 완료되면 상담원을 통해 결과가 안내되며, 변경된 한도나 서비스 상태를 즉시 확인하실 수 있습니다.


    만약 현재 이용 중인 단기 자금의 상환 기간을 늘려 월 납입 부담을 낮추고 싶으신 경우에는 장기카드대출(카드론)로의 전환을 추천드립니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: how_to_guide
  source_authority: official
