  institution_id: yeoul_card
- id: a429edd4-791d-5ece-9ad9-80dd82c33305
  title: '장기카드대출(카드론): 이런 분께 알맞습니다'
  body: '장기카드대출(카드론)은 비교적 큰 금액을 장기간에 걸쳐 나누어 상환하고자 하는 현대 직장인 고객님께 최적화된 상품입니다. 다음과 같은
    상황에 계신 분들께 추천드립니다.


    - 갑작스러운 목돈 지출이 필요하지만, 단기 대출로는 상환 부담이 크신 분

    - 복잡한 서류 제출 없이 신속하게 대출 한도를 확인하고 자금을 확보하고 싶으신 분

    - 중도에 자금 여력이 생겼을 때 수수료 부담 없이 자유롭게 원금을 상환하고 싶으신 분


    본 상품은 이용한도 최고액 50,000,000원까지 제공되어 넉넉한 자금 운용이 가능하며, 대출 금리는 연 5.9%에서 연 19.9%까지 고객님의
    신용도에 따라 합리적으로 책정됩니다. 특히 중도상환수수료율 0%라는 파격적인 혜택을 통해, 상환 시점에 따른 추가 비용 걱정 없이 스마트하게
    부채를 관리하실 수 있습니다. 신속한 한도 제공과 투명한 수수료 체계로 고객님의 경제적 부담을 낮추는 신뢰받는 금융 파트너가 되겠습니다.'
  domain: lending_mortgage
  product_category: yeoul_card_loan
  document_type: product_sheet
  source_authority: official
