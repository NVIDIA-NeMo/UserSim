- id: c2fcdbe9-3613-50ff-bbfb-79ad725dc060
  title: '리볼빙(일부결제금액이월약정): 필요 서류'
  body: '리볼빙(일부결제금액이월약정) 서비스 신청 시 필요 서류 및 인증 수단은 다음과 같습니다.


    | 신청 경로 | 필요 서류 및 인증 수단 | 결과 |

    | :--- | :--- | :--- |

    | 모바일 앱/웹사이트 | 본인 명의 휴대폰 인증, 공동인증서 또는 금융인증서 | 즉시 신청 및 심사 |

    | 고객센터 (상담원) | 성함, 생년월일 기반 본인 확인 | 심사 후 승인 통보 |

    | 신규 카드 발급 시 동시 신청 | 카드 발급 신청서 내 리볼빙 약정 동의 체크 | 카드 발급과 동시에 서비스 적용 |

    | 한도 증액 동시 신청 | 최근 3개월분 소득 증빙 서류 (건강보험납부확인서 등) | 심사 후 한도 및 서비스 부여 |'
