  title: '단기카드대출(현금서비스): 가입 대상'
  body: '단기카드대출(현금서비스) 이용 가능 여부는 다음 기준에 따라 결정됩니다.


    - 여울 신용카드 보유 여부: 필수 (보유 시 이용 가능)

    - 신용 상태 및 상환 능력: 당사 내부 심사 기준 충족 시 가능

    - 이용 한도 설정: 최대 5,000,000원 범위 내에서 차등 부여

    - 연령 및 자격: 민법상 성인이며 금융거래 제한 사유가 없는 고객'
