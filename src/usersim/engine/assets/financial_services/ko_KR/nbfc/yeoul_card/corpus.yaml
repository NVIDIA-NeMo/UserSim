- id: 5306654b-df35-553d-8d41-ded598b5b116
  title: '리볼빙(일부결제금액이월약정): 처리가 끝나지 않거나 보류 중일 때'
  body: '리볼빙 서비스 신청 후 상태가 ''처리 중''으로 표시되거나 변경 사항이 반영되지 않는 경우, 다음 내용을 확인해 주십시오.


    **증상**: 서비스 가입 또는 결제 비율 변경 신청을 했으나, 명세서에 반영되지 않았거나 처리 상태가 보류 중인 경우


    **원인 및 확인 사항**

    1. 본인 인증 미완료: 신청 과정에서 성함과 생년월일을 통한 본인 확인이 정확히 이루어지지 않았을 가능성이 있습니다.

    2. 시스템 반영 시간: 신청 시점에 따라 전산 반영까지 최대 1~2영업일이 소요될 수 있습니다.

    3. 심사 보류: 신용 상태의 급격한 변동으로 인해 내부 심사가 진행 중일 수 있습니다.


    **해결 방법**

    - 먼저 상담원에게 성함과 생년월일을 다시 말씀하시어 본인 인증 상태를 확인하십시오.

    - 신청 후 2영업일이 경과하지 않았다면 잠시 기다려 주시기 바랍니다.


    **에스컬레이션**

    위 조치 후에도 문제가 해결되지 않을 경우, 전문 담당자가 배정되어 세부 심사 내역을 확인하고 결과를 안내해 드리겠습니다. 처리 결과는 접수
    후 3영업일 이내에 개별적으로 고지해 드립니다.'
  domain: payments
  product_category: yeoul_revolving
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
