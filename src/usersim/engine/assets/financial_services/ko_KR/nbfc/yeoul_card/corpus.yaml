- id: 1a07751e-cce4-5d81-b3c8-b2c291156230
  title: '여울 신용카드: 약관 변경 안내'
  body: '여울 신용카드의 서비스 품질 향상과 법령 준수를 위해 약관이 변경될 수 있음을 안내드립니다. 본 상품의 핵심 이용 조건은 다음과 같습니다.


    - 연회비: 본 카드의 기본 연회비는 15,000원이며, 매년 가입일 기준 정기적으로 청구됩니다.

    - 포인트 적립: 이용 금액에 대해 0.7%의 포인트 적립률을 적용합니다. 단, 세금 납부나 공과금 등 적립 제외 항목이 있을 수 있습니다.

    - 이용한도: 고객님의 신용 상태에 따라 부여되며, 최고액은 20,000,000원까지 설정 가능합니다.


    약관 변경 시 당사는 변경 내용과 적용일을 고객님께 사전에 고지하며, 변경된 약관에 동의하지 않으실 경우 계약을 해지하실 수 있습니다. 변경
    사항은 모바일 앱의 공지사항 또는 등록된 연락처로 안내되며, 고지된 날로부터 일정 기간 내에 이의 제기가 없으시면 변경된 약관에 동의하신 것으로
    간주합니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: terms_conditions
  source_authority: official
