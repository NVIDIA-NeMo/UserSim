- id: f25c2300-e540-5e39-93f4-602b166a4f4f
  title: '리볼빙(일부결제금액이월약정): 리볼빙 최소결제비율 안내'
  body: '질문: 리볼빙 서비스 이용 시 매달 최소 얼마를 납부해야 하나요?

    답변: 리볼빙(일부결제금액이월약정)의 리볼빙 최소결제비율은 10%입니다. 즉, 이번 달 결제해야 할 총 금액의 10% 이상만 납부하시면 나머지
    금액은 다음 달로 이월됩니다.


    질문: 최소결제비율만큼만 납부하면 수수료는 발생하지 않나요?

    답변: 아닙니다. 최소결제비율 10%를 제외하고 다음 달로 이월된 나머지 잔액에 대해서는 리볼빙 수수료율(연) 16.5%의 수수료가 부과됩니다.
    따라서 가능한 한 많은 금액을 상환하시거나 선결제를 활용하시는 것이 총 비용을 줄이는 방법입니다.


    더 자세한 비용 구조는 리볼빙(일부결제금액이월약정): 수수료 안내 문서에서 확인하십시오.'
