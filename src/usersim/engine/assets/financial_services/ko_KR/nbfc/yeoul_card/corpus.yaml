- id: a48aba71-cd08-5ca8-bc22-7759ff00011a
  title: foreclose_loan 사용 기준
  body: '고객이 장기카드대출(카드론)의 남은 원금을 한꺼번에 상환하고자 하는 경우, 상담원은 다음의 절차에 따라 처리를 진행하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 완료합니다.

    2. `get_accounts` 도구를 사용하여 고객의 계좌 목록을 조회하고, 중도상환을 진행할 대출 계좌의 `account_id`를 확인합니다.

    3. 고객에게 현재 시점의 총 상환 예정 금액(원금 및 이용 일수만큼의 이자)을 안내합니다. 이때 장기카드대출(카드론)은 중도상환수수료 부담이
    없는 상품임을 명확히 설명하십시오.

    4. 고객의 최종 동의를 확인한 후, `foreclose_loan` 도구를 호출하여 상환 처리를 완료합니다.


    본 절차는 대출금 전액을 즉시 상환하는 불가역적인 작업이므로, 실행 전 상환 금액과 처리 결과에 대해 고객에게 충분히 고지하십시오. 대출 상품의
    구체적인 특징은 ''장기카드대출(카드론): 상품 개요''에서 확인할 수 있습니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: yeoul_card
