- id: 33902e53-31a3-5a98-8af1-928de6b21e73
  title: '리볼빙(일부결제금액이월약정): 한도·제한과 유의사항'
  body: '리볼빙(일부결제금액이월약정) 서비스의 안정적인 운영과 고객의 리스크 관리를 위해 다음과 같은 한도 및 유의사항을 적용합니다. 상담원께서는
    고객 안내 시 해당 내용을 명확히 고지하시기 바랍니다.


    1. 결제 및 수수료 구조

    - 리볼빙 최소결제비율: 10%

    - 리볼빙 수수료율(연): 16.5%


    2. 주요 유의사항

    - 결제 금액 중 약정한 최소결제비율(10%)만 납부하고 나머지를 다음 달로 이월할 수 있으나, 이월된 금액에는 연 16.5%의 수수료가 계속
    부과됩니다. 이로 인해 고객의 총 상환 부담이 급격히 증가할 수 있음을 반드시 설명하십시오.

    - 이월된 잔액이 누적될 경우 신용 점수에 영향을 줄 수 있으며, 이용 한도를 초과할 경우 카드 사용이 제한될 수 있습니다.

    - 수수료 부담을 줄이기 위해서는 결제일 이전에 이월 금액을 미리 납부하는 선결제 기능을 활용하시도록 안내하십시오.


    본 서비스는 고객의 단기적인 자금 흐름을 유연하게 관리하기 위한 도구이며, 장기적인 대출 대용으로 사용하는 것은 권장하지 않습니다.'
  domain: payments
  product_category: yeoul_revolving
