- id: dd511487-a82e-5be7-9a82-2e77b1ed59a6
  title: '여울 신용카드: 거래가 거절되거나 제한되었을 때'
  body: '카드 결제 시 ''승인 거절'' 메시지가 발생하거나 거래가 제한되는 경우, 다음의 원인을 확인하시기 바랍니다.


    - 주요 증상: 결제 단말기나 온라인 결제창에서 ''한도 초과'', ''카드 상태 이상'' 등의 사유로 결제가 되지 않음


    - 예상 원인 및 확인 순서

    1. 이용한도 초과: 현재까지의 사용 금액이 부여된 한도에 도달했는지 확인하십시오. 여울 신용카드의 이용한도 최고액은 20,000,000원이지만,
    고객님 개별 한도는 이보다 낮을 수 있습니다.

    2. 카드 상태 이상: 분실 신고가 접수되었거나, 유효기간 만료, 혹은 보안상의 이유로 일시 정지 상태인지 확인하십시오.

    3. 가맹점 제한: 해당 가맹점이 여울카드 결제가 제한된 업종인지 확인하십시오.


    - 해결 방법

    상담원에게 성함과 생년월일을 말씀하여 본인 인증을 완료하신 후, 정확한 거절 사유를 확인하십시오. 한도 부족의 경우 한도 상향 신청 가능 여부를
    확인하시고, 정지 상태인 경우 정지 해제 절차를 밟으십시오.


    - 에스컬레이션

    단순 한도 문제가 아니거나 시스템 오류가 의심되는 경우, 상담원이 전문 담당 부서로 내용을 이관하여 정밀 조사를 진행하며, 결과는 영업일 기준
    3일 이내에 안내해 드립니다.


    상세한 한도 정보는 ''여울 신용카드: 한도·제한과 유의사항''을 참고하십시오.'
