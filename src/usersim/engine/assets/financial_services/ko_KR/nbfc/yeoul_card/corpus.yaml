  institution_id: yeoul_card
- id: 4daf7da6-a481-5b56-b5d2-50d4a1e05f61
  title: '단기카드대출(현금서비스): 이용 조건별 차이'
  body: '상담원은 다음 매트릭스를 바탕으로 고객님의 단기카드대출(현금서비스) 이용 가능 여부와 한도를 안내하십시오.


    - 신용등급 및 상환 능력 우수: 이용 가능 / 이용한도 최고액 5,000,000원 범위 내 최대 부여

    - 신용등급 보통 및 소득 증빙 가능: 이용 가능 / 이용한도 최고액 5,000,000원 범위 내 적정 한도 부여

    - 신용등급 낮음 또는 연체 기록 보유: 이용 제한 또는 매우 낮은 한도 부여

    - 법정 관리인 지정 또는 파산 절차 진행 중: 이용 불가


    모든 한도 산정 시에는 고객님의 현재 부채 상황과 상환 능력을 종합적으로 고려하여 책임 있는 금융 서비스를 제공합니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
