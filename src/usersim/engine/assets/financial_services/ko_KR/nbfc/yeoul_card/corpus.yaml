- id: 9e6abe2b-cc06-5b9b-a1e4-e9cee3978ed3
  title: apply_loan 사용 기준
  body: '고객이 장기카드대출(카드론)을 신청하는 절차입니다. 대출 심사 과정과 규제 준수 사항을 반드시 안내해야 합니다.


    처리 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 사용하여 고객의 `account_id`를 확인하십시오.

    3. 고객이 희망하는 대출 금액과 기간을 확인하십시오.

    4. 대출 총액이 1억원을 초과하는 경우, 총부채원리금상환비율(DSR) 규제가 적용되어 한도가 제한될 수 있음을 명확히 안내하십시오.

    5. 법정 최고금리는 연 20%이며, 실제 적용 금리는 심사 결과에 따라 결정됨을 안내하십시오.

    6. `apply_loan` 도구를 호출하여 대출 신청을 접수하십시오. 심사 결과에 따라 대출 승인 여부가 결정됨을 다시 한번 고지하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: yeoul_card
- id: 008a0f20-1776-54cb-a67b-e4576ba065c5
  title: apply_loan 도구 설명서
  body: "이 도구는 고객의 장기카드대출(카드론) 신청을 접수하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이 대화 중 직접 호출하여 실행합니다.\n\
    - 필요 인자:\n  - `account_id`: `get_accounts` 도구를 통해 확인된 고객의 계좌/카드 식별자입니다.\n  - `loan_amount`:\
    \ 신청하고자 하는 대출 금액입니다.\n  - `loan_term`: 대출 상환 기간(개월 수)입니다.\n\n본인 인증(`verify_identity`)이\
    \ 완료된 상태에서 호출합니다. 신청 접수 후 내부 심사를 통해 최종 승인 여부와 금리가 결정됩니다. 대출 총액이 1억원을 초과하는 경우 DSR\
    \ 규제가 적용됩니다."
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
