- id: 95f16f24-245e-53c4-a658-282a1d875899
  title: '리볼빙(일부결제금액이월약정): 이용 조건별 차이'
  body: '상담원은 고객의 상태에 따라 리볼빙(일부결제금액이월약정) 서비스 이용 가능 여부를 다음과 같이 안내하십시오.


    | 구분 | 이용 가능 여부 | 적용 조건 및 제한 사항 |

    | :--- | :---: | :--- |

    | 정상 신용 고객 | 가능 | 리볼빙 수수료율(연) 16.5%, 최소결제비율 10% 적용 |

    | 신용점수 하락 고객 | 제한적 가능 | 내부 심사 기준에 따라 이용 한도가 제한될 수 있으며, 최소결제비율 상향 조정 가능 |

    | 연체 중인 고객 | 불가능 | 연체 금액 전액 상환 후 심사를 통해 재가입 가능 |

    | 법인/개인사업자 | 별도 기준 | 사업자 전용 상품 약관에 따르며, 개별 한도 산정 방식 적용 |


    ※ 모든 고객은 가입 시 리볼빙 수수료율(연) 16.5%에 대해 명확히 고지받아야 하며, 상환 능력에 따른 책임 있는 금융 서비스 이용을 권고하십시오.'
