- id: eb0b0999-a190-5943-ad95-d642ce8e1f3d
  title: '단기카드대출(현금서비스): 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 웹사이트를 통해 단기카드대출(현금서비스) 메뉴에 접속하려 할 때 오류가 발생하는 경우 다음과 같이 조치하십시오.


    증상: 로그인 실패, 서비스 페이지 접속 불가, ''권한이 없습니다''라는 메시지 출력


    원인 및 해결 방법:

    1. 네트워크 연결 확인: Wi-Fi 또는 모바일 데이터 연결 상태를 확인하십시오. 연결이 불안정할 경우 접속이 제한될 수 있습니다.

    2. 계정 잠금 상태 확인: 비밀번호 입력 오류 횟수 초과로 계정이 잠겼을 수 있습니다. 이 경우 본인의 성함과 생년월일을 말씀해 주시면 본인
    인증 후 잠금을 해제해 드리겠습니다.

    3. 앱 버전 업데이트: 구 버전의 앱을 사용 중일 경우 서비스 이용이 제한될 수 있습니다. 최신 버전으로 업데이트하시기 바랍니다.


    해결되지 않는 경우:

    위의 조치 후에도 접속이 되지 않는다면, 상담원에게 상황을 설명하십시오. 저희가 내부 시스템의 권한 설정이나 서비스 일시 점검 여부를 확인하여
    조치해 드리겠습니다. 필요시 전문 기술 담당자에게 에스컬레이션하여 해결 후 결과를 안내해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: troubleshooting
  source_authority: official
