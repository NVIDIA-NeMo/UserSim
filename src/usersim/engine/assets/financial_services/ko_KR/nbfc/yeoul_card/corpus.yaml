- id: 9c1485f7-d469-5620-b7e1-43fb95d581cd
  title: '리볼빙(일부결제금액이월약정): 이 상품을 사칭한 사기 주의'
  body: '최근 리볼빙(일부결제금액이월약정) 서비스를 사칭하여 고객님의 금융 정보를 가로채려는 시도가 확인되고 있습니다. 여울카드는 어떠한 경우에도
    문자 메시지나 메신저를 통해 리볼빙 수수료 면제, 금리 인하를 조건으로 개인정보를 요구하지 않습니다.


    특히 ''정부 지원 저금리 전환 상품'' 혹은 ''특별 수수료 감면 혜택''이라는 명목으로 접근하여 카드 번호, CVV, 비밀번호, 혹은 주민등록번호
    전체를 요구하는 행위는 명백한 사기입니다. 여울카드는 본인 확인을 위해 성함과 생년월일만을 확인하며, 그 외의 민감한 보안 정보는 절대로 요청하지
    않습니다.


    만약 출처가 불분명한 링크(URL)를 클릭하셨거나, 개인정보를 제공하신 경우 즉시 여울카드 고객센터로 신고하여 이용 정지 조치를 취하십시오.
    분실 및 도난 신고와 마찬가지로, 부정사용 신고가 접수되는 즉시 관련 법령과 약관에 따라 신속하게 보상 절차를 진행하겠습니다.'
  domain: payments
  product_category: yeoul_revolving
  document_type: security_advisory
