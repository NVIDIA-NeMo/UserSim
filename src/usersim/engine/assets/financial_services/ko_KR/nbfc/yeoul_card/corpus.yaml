- id: 9fb81751-dd7d-5e80-b7d6-67fa6373e353
  title: '법령·제도 안내: 신용카드 이용'
  body: '여울카드는 여신전문금융업법에 따라 금융위원회의 감독을 받으며, 금융소비자 보호에 관한 법률을 엄격히 준수합니다.


    **리볼빙(일부결제금액이월약정) 안내**

    리볼빙은 결제 금액 중 약정한 비율만 결제하고 나머지를 다음 달로 이월하는 서비스입니다. 이월된 금액에는 수수료가 계속 부과되어 총 상환 부담이
    커질 수 있으므로, 상담원은 고객님께 수수료율과 결제 구조를 충분히 설명해야 합니다.


    **할부 거래의 철회 및 항변권**

    할부 기간 3개월 이상, 결제 금액 200,000원 이상인 신용카드 할부 거래의 경우, 계약서를 받은 날(또는 물건을 받은 날)부터 7일 이내에
    철회할 수 있습니다. 또한, 상품 미배송이나 하자 등의 사유가 있을 때 남은 할부금의 지급을 거절하는 항변권을 행사할 수 있습니다. 여울카드는
    항변 신청 접수 후 7영업일 이내에 답변하는 것을 원칙으로 합니다.


    **소득공제 및 부정사용 보상**

    신용카드 사용액은 연말정산 시 총급여의 25%를 초과하는 부분에 대해 15%의 소득공제율이 적용됩니다. 카드 분실 또는 도난 시 즉시 신고해
    주셔야 하며, 신고 전후의 부정사용 보상은 관련 법령과 약관에 따라 처리됩니다.


    **상담원 준수 사항**

    상담원은 수수료와 총 상환액을 정확하게 안내해야 하며, 특히 리볼빙이나 할부 안내 시 수수료가 발생한다는 점을 명확히 고지해야 합니다.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 82f3c9cb-8336-5c86-aec1-216471244154
  title: '법령·제도 안내: 대출'
  body: '여울카드의 대출 상품은 금융소비자 보호에 관한 법률의 적용을 받으며, 관련 규정을 엄격히 준수합니다.


    **대출 청약 철회권**

    대출 계약은 계약서류를 받은 날과 대출 실행일 중 늦은 날로부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과 이용 기간의 이자,
    인지세 등 제3자 비용만 반환하며, 중도상환수수료는 부과되지 않습니다.


    **중도상환수수료 규정**

    2025년 1월 13일 이후 체결된 계약의 중도상환수수료는 자금 운용 손실 및 행정·모집 비용 등 실제 비용 범위 내에서만 징수 가능하며,
    대출 실행일로부터 3년이 경과하면 부과할 수 없습니다.


    **DSR(총부채원리금상환비율) 규제**

    대출 총액이 1억원을 초과하는 차주에게는 DSR 규제가 적용됩니다. 제2금융권인 여울카드의 경우 연간 원리금 상환액이 연소득의 50%를 초과할
    수 없으며, 한도 계산 시 금리 상승 위험을 반영한 스트레스 금리를 가산합니다. 단, 신용카드 할부 구매는 대출이 아니므로 DSR 대상에서
    제외되며, 장기카드대출(카드론)은 DSR 대상에 포함됩니다.


    **금리 및 상환 권리**

    법정 최고금리는 연 20%입니다. 연체이자는 약정금리에 최대 3%p를 가산하되, 연 20%를 초과할 수 없습니다. 또한, 취업, 승진, 신용점수
    상승 등 신용 상태가 개선된 고객은 금리인하요구권을 행사할 수 있습니다.


    **상담원 준수 사항**

    상담원은 대출 승인을 확약하거나 총 상환액을 축소하여 안내해서는 안 되며, 상환이 어려운 고객에게는 조기 상담 및 채무조정 제도를 안내해야
    합니다.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 0b5f0cdc-4cd0-56c6-af70-0ed413c3b441
  title: get_account_transactions 사용 기준
  body: '고객님의 신용카드 이용 내역 및 현금서비스 이용 내역을 확인하는 절차는 다음과 같습니다.


    1. 고객님으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. 고객님이 카드 번호의 마지막 4자리만 제공한 경우, `get_accounts` 도구를 호출하여 해당 번호와 일치하는 `account_id`를
    확인하십시오.

    3. 확인된 `account_id`를 사용하여 `get_account_transactions` 도구를 호출함으로써 상세 이용 내역을 조회하십시오.

    4. 조회된 내역을 바탕으로 고객님이 요청하신 특정 거래나 전체 이용 현황에 대해 안내하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: yeoul_card
- id: 61847566-6d3d-5e3d-b6d2-4946870f559b
  title: get_account_transactions 도구 설명서
  body: '이 도구는 특정 계좌의 신용카드 이용 내역과 현금서비스 이용 내역을 조회하는 기능을 수행합니다.


    **호출 서명**

    `get_account_transactions(account_id)`


    **인수 설명**

    - `account_id`: 조회를 원하는 고객의 고유 계좌 식별자입니다. `get_accounts` 도구를 통해 획득할 수 있습니다.


    **효과**

    해당 계좌에서 발생한 최근 거래 목록, 금액, 거래 일자 등의 상세 내역을 반환합니다. 상담원은 이 도구를 직접 호출하여 정보를 확인하며,
    `verify_identity`를 통한 본인 인증이 완료된 상태에서만 사용 가능합니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: yeoul_card
- id: bcf51f90-80cd-5daa-8778-759095b13f1c
  title: file_transaction_dispute 사용 기준
  body: '본인이 사용하지 않은 거래나 이중 청구에 대한 조사 접수 및 부정사용 보상 절차는 다음과 같습니다.


    1. 고객님으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 통해 고객님의 `account_id` 또는 `card_id`를 확인하십시오.

    3. `get_account_transactions` 도구를 사용하여 고객님이 문제를 제기하신 구체적인 거래의 `transaction_id`를
    특정하십시오.

    4. 확인된 `account_id`와 `transaction_id`를 사용하여 `file_transaction_dispute` 도구를 호출하여
    공식적으로 조사를 접수하십시오.

    5. 접수 완료 후, 관련 법령과 약관에 따라 부정사용 보상 절차가 신속히 진행됨을 안내하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: yeoul_card
- id: 863aa9d6-494c-59d3-9014-b563ddd6f8ae
  title: file_transaction_dispute 도구 설명서
  body: '이 도구는 고객이 인지하지 못한 부정사용 거래나 이중 청구 건에 대해 조사 및 보상 절차를 시작하는 기능을 수행합니다.


    **호출 서명**

    `file_transaction_dispute(account_id, transaction_id)`


    **인수 설명**

    - `account_id`: 거래가 발생한 계좌의 고유 식별자입니다.

    - `transaction_id`: 조사를 요청하는 특정 거래의 고유 식별자입니다.


    **효과**

    해당 거래에 대한 분쟁 조사를 접수하고 부정사용 보상 프로세스를 활성화합니다. 상담원은 본인 인증이 완료된 후 이 도구를 직접 호출하여 처리하며,
    고객에게 외부 양식 제출을 안내하지 않습니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: yeoul_card
- id: f24d9764-f7a5-5b29-afff-75fcf9d19c12
  title: freeze_card 사용 기준
  body: '카드의 분실 또는 도난 신고 접수 시 즉시 이용 정지 조치를 취하는 절차는 다음과 같습니다.


    1. 고객님으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 호출하여 신고 대상이 되는 카드의 `card_id`를 확인하십시오.

    3. 확인된 `card_id`를 사용하여 `freeze_card` 도구를 즉시 호출하십시오. 분실/도난 신고는 신속한 조치가 최우선입니다.

    4. 카드 정지 처리가 완료되었음을 고객님께 안내하고, 이후 카드 재발급 필요 여부를 확인하여 안내하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: yeoul_card
- id: 16137a35-6294-5c7e-b922-2a645827d6aa
  title: freeze_card 도구 설명서
  body: '이 도구는 분실 또는 도난 신고된 카드의 사용을 즉시 정지시키는 기능을 수행합니다.


    **호출 서명**

    `freeze_card(card_id)`


    **인수 설명**

    - `card_id`: 정지 처리가 필요한 카드의 고유 식별자입니다. `get_accounts` 도구를 통해 획득할 수 있습니다.


    **효과**

    해당 카드의 모든 결제 및 서비스 이용이 즉시 차단됩니다. 상담원은 본인 인증 완료 후 이 도구를 직접 호출하여 정지 조치를 완료하며, 고객이
    직접 앱이나 웹에서 처리하도록 유도하지 않습니다.'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: yeoul_card
- id: fa9062b2-dbbe-5575-9eba-504130696295
  title: order_replacement_card 사용 기준
  body: '고객님의 카드가 분실, 도난되었거나 훼손되어 재발급이 필요한 경우 다음과 같은 절차에 따라 처리하십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 호출하여 고객님이 보유하신 카드의 목록을 확인하고, 재발급 대상 카드의 card_id를 식별하십시오.

    3. 만약 카드의 분실이나 도난으로 인한 재발급이라면, 부정사용 방지를 위해 order_replacement_card를 호출하기 전 반드시
    freeze_card 도구를 사용하여 해당 카드를 즉시 정지시키십시오.

    4. 고객님께 새 카드의 수령지 주소를 확인하십시오.

    5. 모든 확인이 완료되면 order_replacement_card 도구를 호출하여 카드 재발급 신청을 완료하십시오.


    재발급된 카드는 영업일 기준 수일 내에 등록된 주소지로 배송됩니다. 부정사용 보상과 관련된 자세한 내용은 ''여울 신용카드: 부정사용으로부터
    고객을 보호하기 위해'' 문서를 참고하시기 바랍니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: yeoul_card
- id: d5f005f2-b296-5403-af8d-3aae7ebb5cbb
  title: order_replacement_card 도구 설명서
  body: "이 도구는 훼손, 분실 또는 도난된 카드를 대체할 새 카드를 발급하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이 대화 중 직접\
    \ 호출하여 처리합니다.\n- 입력 인자:\n    - card_id: 재발급 대상이 되는 카드의 고유 식별자입니다. (get_accounts\
    \ 도구를 통해 획득)\n- 효과: 기존 카드 번호를 대체하는 새로운 카드 번호의 카드가 신청되며, 배송 절차가 시작됩니다.\n\n본 도구를\
    \ 호출하기 전 verify_identity를 통한 본인 인증이 완료되어야 하며, 분실/도난의 경우 반드시 freeze_card 조치가 선행되어야\
    \ 합니다."
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: yeoul_card
- id: 97088444-81d5-581d-94ba-33623466bdcd
  title: change_to_revolving 사용 기준
  body: '고객님이 결제 금액의 일부만 납부하고 나머지를 이월하는 리볼빙(일부결제금액이월약정) 서비스 신청을 원하실 경우 다음 절차를 따르십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 호출하여 리볼빙을 적용할 계좌의 account_id를 확인하십시오.

    3. 고객님께 리볼빙 서비스의 구조와 이월된 금액에 대해 수수료가 부과되어 총 상환 부담이 커질 수 있다는 점을 명확히 고지하십시오. 상세
    내용은 ''리볼빙(일부결제금액이월약정): 수수료 안내''를 통해 안내하십시오.

    4. 고객님이 희망하시는 약정결제비율(최소결제비율 이상)을 확인하십시오.

    5. 확인된 정보를 바탕으로 change_to_revolving 도구를 호출하여 서비스 신청을 완료하십시오.


    신청 즉시 다음 결제일부터 약정한 비율에 따라 결제가 이루어지며, 잔액은 다음 달로 이월됩니다.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: yeoul_card
- id: 6954da8a-f912-5cd8-997e-b560e0f26c5c
  title: change_to_revolving 도구 설명서
  body: "이 도구는 고객의 신용카드 결제 방식에 리볼빙(일부결제금액이월약정) 서비스를 설정합니다.\n\n- 호출 방식: 상담원이 대화 중 직접\
    \ 호출하여 처리합니다.\n- 입력 인자:\n    - account_id: 리볼빙을 신청할 고객 계좌의 고유 식별자입니다. (get_accounts\
    \ 도구를 통해 획득)\n    - payment_ratio: 매달 결제할 금액의 비율을 소수점 또는 퍼센트로 지정합니다.\n- 효과: 해당\
    \ 계좌에 리볼빙 약정이 체결되며, 이후 발생하는 결제 금액에 대해 지정된 비율만큼만 청구되고 나머지는 이월됩니다.\n\n호출 전 verify_identity를\
    \ 통한 본인 인증이 반드시 완료되어야 합니다."
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: yeoul_card
- id: de6c2f5d-b60e-55a1-acb5-3f8a3be889ce
  title: change_to_installments 사용 기준
  body: '일시불로 결제한 내역을 결제일 전에 할부로 전환하고자 하는 고객님을 위해 다음 절차를 수행하십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 통해 해당 결제가 이루어진 카드의 card_id를 확인하십시오.

    3. get_account_transactions 도구를 호출하여 전환 대상이 되는 정확한 거래 내역과 transaction_id를 확인하십시오.

    4. 고객님께 할부 전환 시 적용되는 할부수수료율을 안내하십시오. 관련 내용은 ''할부: 수수료 안내''에서 확인하실 수 있습니다.

    5. 고객님이 희망하시는 할부 개월 수를 확인하십시오.

    6. change_to_installments 도구를 호출하여 결제 방식을 할부로 전환하십시오.


    할부 전환은 결제일 전까지만 가능하며, 이미 결제가 완료된 건은 전환이 불가함을 안내하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_installments
  institution_id: yeoul_card
- id: eb2b951c-8105-53cc-a93e-00e588c50e5d
  title: change_to_installments 도구 설명서
  body: "이 도구는 일시불로 결제된 특정 거래 건을 지정된 개월 수의 할부 거래로 전환합니다.\n\n- 호출 방식: 상담원이 대화 중 직접\
    \ 호출하여 처리합니다.\n- 입력 인자:\n    - card_id: 해당 거래가 발생한 카드의 고유 식별자입니다.\n    - transaction_id:\
    \ 할부로 전환할 특정 거래의 고유 식별자입니다. (get_account_transactions 도구를 통해 획득)\n    - installment_months:\
    \ 전환하고자 하는 할부 기간(개월 수)입니다.\n- 효과: 해당 거래의 청구 방식이 일시불에서 할부로 변경되며, 설정된 기간에 따라 분할\
    \ 청구됩니다.\n\n호출 전 verify_identity를 통한 본인 인증이 반드시 완료되어야 합니다."
  domain: payments
