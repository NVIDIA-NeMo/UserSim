  institution_id: yeoul_card
- id: e6d3a0b7-fe81-5974-a1cc-2ef1efc06229
  title: '단기카드대출(현금서비스): 명세서나 내역과 맞지 않을 때'
  body: '고객께서 청구된 단기카드대출(현금서비스) 이자나 원금이 예상과 다르다고 말씀하시는 경우, 상담원은 다음 순서로 점검하십시오.


    **증상: "현금서비스 이용 금액보다 청구 금액이 너무 많습니다" 또는 "이자가 잘못 계산된 것 같습니다"라고 주장함**


    **점검 및 해결 순서**

    1. 적용 금리 확인: 고객님의 상품에 연 18.2%의 금리가 정확하게 적용되었는지 확인하십시오.

    2. 이용 기간 계산: 대출 실행일부터 결제일까지의 일수를 계산하여 이자가 일할 계산되었는지 검토하십시오.

    3. 선결제 내역 대조: 고객께서 중간에 일부 금액을 선결제하셨는지 확인하고, 해당 금액이 원금에서 적절히 차감되었는지 확인하십시오.

    4. 타 상품 혼동 확인: 단기카드대출 외에 리볼빙 이월 금액이나 카드론 원리금이 합산되어 청구된 것은 아닌지 명세서를 세부적으로 분석하여
    설명하십시오.


    **에스컬레이션**

    상담원이 계산한 내역과 고객의 주장이 계속 상충하거나, 시스템상의 오류가 의심되는 경우에는 즉시 ''정산 전문 담당 부서''로 케이스를 이관하십시오.
    담당 부서에서 전체 거래 원장을 재검토한 후 7영업일 이내에 고객님께 최종 결과를 안내해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yeoul_cash_service
  document_type: troubleshooting
  source_authority: official
