- id: 201d1350-1743-5bf6-b42f-cb3bd8e861d1
  title: pay_emi 사용 기준
  body: '결제일에 정상적으로 출금되지 못한 카드대금이나 현금서비스, 카드론 상환금을 가상계좌 이체를 통해 납부하는 절차입니다.


    처리 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 수행하십시오.

    2. `get_accounts` 도구를 사용하여 고객의 `account_id`를 확인하십시오.

    3. `get_loan_details` 또는 명세서 조회를 통해 미납된 정확한 금액(원금 및 연체이자 포함)을 확인하십시오.

    4. 연체이자는 약정금리에 최대 3%p를 더하되, 연 20%를 넘지 않는 범위에서 부과됨을 안내하십시오.

    5. 고객이 납부 의사를 밝히면 `pay_emi` 도구를 호출하여 가상계좌를 발급하고 납부 절차를 진행하십시오.'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: yeoul_card
- id: 2d8641bf-0fd3-58bd-9aa7-e0b67647cdf3
  title: pay_emi 도구 설명서
  body: "이 도구는 미납된 카드대금이나 대출 상환금을 납부하기 위해 가상계좌 이체 프로세스를 생성하는 기능을 수행합니다.\n\n- 호출 방식:\
    \ 상담원이 대화 중 직접 호출하여 실행합니다.\n- 필요 인자:\n  - `account_id`: `get_accounts` 도구를 통해\
    \ 확인된 고객의 계좌/카드 식별자입니다.\n  - `amount`: 고객이 납부하고자 하는 정확한 금액입니다.\n\n본인 인증(`verify_identity`)이\
    \ 완료된 상태에서 호출하며, 도구 실행 후 생성된 가상계좌 정보를 고객에게 안내하여 입금을 요청하십시오."
