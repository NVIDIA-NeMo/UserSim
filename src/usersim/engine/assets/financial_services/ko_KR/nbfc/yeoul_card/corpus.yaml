- id: 3768bfea-261a-5370-aaea-95ea7646fbfb
  title: '단기카드대출(현금서비스): 처리가 끝나지 않거나 보류 중일 때'
  body: '단기카드대출(현금서비스) 신청 후 입금이 지연되거나 처리가 보류되는 경우, 다음 사항을 순차적으로 확인해 주십시오.


    1. 본인 인증 확인: 성함과 생년월일 정보가 정확하게 입력되었는지 확인하십시오. 정보가 불일치할 경우 보안을 위해 처리가 보류됩니다.

    2. 이용 한도 확인: 신청 금액이 현재 고객님의 잔여 한도를 초과하지 않았는지 확인하십시오. 본 상품의 현금서비스 이용한도 최고액은 5,000,000원이지만,
    개별 고객님의 한도는 이보다 낮을 수 있습니다.

    3. 계좌 상태 확인: 입금 계좌가 정상적으로 사용 가능한 상태인지, 혹은 타행 계좌의 경우 일시적인 전산 장애가 있는지 확인하십시오.


    위 사항을 확인했음에도 문제가 해결되지 않는 경우, 저희에게 다시 요청해 주십시오. 상담원이 즉시 내역을 조회하여 원인을 파악하고, 필요 시
    전문 담당자에게 에스컬레이션하여 7영업일 이내에 최종 답변 및 처리 결과를 안내해 드리겠습니다.'
