- id: 8385ad59-2beb-5d3f-b78b-3ce339409751
  title: '여울 신용카드: 부정사용으로부터 고객을 보호하기 위해'
  body: '여울카드는 고객님의 소중한 자산을 보호하기 위해 강력한 보안 체계를 운영하고 있습니다. 특히 여울 신용카드를 이용하시는 과정에서 발생할
    수 있는 부정사용 피해를 예방하기 위해 다음의 수칙을 반드시 확인해 주십시오.


    첫째, 여울카드는 어떠한 경우에도 고객님의 카드 번호, CVV 번호, 비밀번호, 주민등록번호 전체를 요청하지 않습니다. 본인 확인이 필요한
    경우 오직 성함과 생년월일만을 통해 인증을 수행하오니, 그 외의 민감한 정보를 요구하는 연락은 사칭일 가능성이 매우 높으므로 각별히 주의하시기
    바랍니다.


    둘째, 카드를 분실하시거나 도난당하셨을 때는 즉시 고객센터를 통해 신고해 주십시오. 신고 접수 즉시 카드 이용 정지 조치를 취하여 추가 피해를
    막겠습니다. 부정사용에 대한 보상은 관련 법령과 여울카드의 약관에 따라 신속하게 처리됩니다.


    셋째, 출처가 불분명한 문자 메시지의 링크(URL) 클릭이나 앱 설치 유도를 주의하십시오. 신뢰할 수 있는 금융 파트너로서 여울카드는 투명한
    절차를 통해 서비스를 제공하며, 개인정보를 부당하게 요구하지 않습니다.


    자세한 보안 수칙은 ''여울 신용카드: 안전한 이용을 위한 수칙''에서 확인하실 수 있습니다.'
