- id: 7db6cd9b-49ea-5590-8e11-0a8c86d7a6c5
  title: '단기카드대출(현금서비스): 부정사용으로부터 고객을 보호하기 위해'
  body: '여울카드는 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 단기카드대출(현금서비스) 이용 시 발생할 수 있는 부정사용
    사고를 예방하기 위해 다음 사항을 반드시 확인해 주십시오.


    여울카드는 어떠한 경우에도 고객님께 카드 번호, CVV 번호, 비밀번호, 주민등록번호 전체를 요청하지 않습니다. 특히 금융기관을 사칭하여 저금리
    대환 대출이나 한도 증액을 빌미로 개인정보를 요구하는 메시지나 전화에 각별히 주의하십시오.


    만약 카드를 분실하셨거나 도난당하셨을 경우에는 즉시 신고해 주십시오. 신고 접수 즉시 이용 정지 조치를 취하며, 신고 전후의 부정사용 보상은
    관련 법령과 당사 약관에 따라 신속히 처리해 드리겠습니다. 의심스러운 거래 내역을 발견하셨을 때도 지체 없이 고객센터로 연락하여 조치를 받으시길
    권고합니다.'
