- id: d0d73a08-037f-5b91-80d6-e4a33f0fc486
  title: '여울 신용카드: 약관'
  body: '본 약관은 여울카드와 고객 간의 여울 신용카드 이용 계약에 관한 권리와 의무를 규정합니다. 상담원은 고객 안내 시 다음의 핵심 조항을
    엄격히 준수하십시오.


    1. 비용 및 수수료: 고객은 서비스 이용의 대가로 연회비 15,000원을 납부할 의무가 있습니다. 연회비의 청구 시기와 납부 방법은 가입
    시 안내된 기준을 따릅니다.


    2. 이용한도: 여울카드는 고객의 신용 상태와 상환 능력을 고려하여 이용한도를 설정합니다. 여울 신용카드의 이용한도 최고액은 20,000,000원이며,
    이는 금융위원회의 가이드라인과 당사의 리스크 관리 기준에 따라 조정될 수 있습니다.


    3. 혜택 제공: 이용 금액에 대해 0.7%의 포인트 적립률을 적용합니다. 단, 적립 제외 가맹점이나 특정 거래의 경우 포인트가 적립되지 않을
    수 있으며, 상세 내용은 상품 설명서를 참조하십시오.


    4. 계약의 해지 및 종료: 고객은 언제든지 계약 해지를 요청할 수 있으며, 이 경우 미결제 금액과 당월까지 발생한 수수료를 모두 정산해야
    합니다.


    5. 법적 준거: 본 상품은 여신전문금융업법 및 금융소비자 보호에 관한 법률을 준수하며, 금융위원회와 금융감독원의 감독을 받습니다.'
  domain: payments
  product_category: yeoul_credit
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yeoul_card
- id: 3f3ea7a8-b6ec-5538-a020-a87e4fa67c89
  title: '여울 신용카드: 이런 분께 알맞습니다'
  body: '여울 신용카드는 스마트한 소비 생활을 지향하는 현대 직장인분들을 위해 설계된 핵심 상품입니다. 다음과 같은 고객님께 특히 추천드립니다.


    - 일상적인 결제에서 실속 있는 혜택을 챙기고 싶으신 분: 이용 금액의 0.7%라는 일관된 포인트 적립률을 통해 소비의 가치를 높일 수 있습니다.

    - 합리적인 유지 비용을 원하시는 분: 연회비 15,000원으로 부담 없이 신용카드의 다양한 편의 기능을 누리실 수 있습니다.

    - 넉넉한 결제 한도가 필요하신 분: 이용한도 최고액이 20,000,000원까지 제공되어, 고액 결제나 갑작스러운 지출 상황에서도 유연하게
    대응할 수 있습니다.


    여울카드는 투명한 수수료 체계와 신속한 한도 제공을 통해 고객님의 금융 생활에 신뢰를 더하는 파트너가 되겠습니다. 본 상품의 전반적인 특징은
    ''여울 신용카드: 상품 개요''에서 상세히 확인하실 수 있습니다.'
  domain: payments
  product_category: yeoul_credit
