- id: 7d55db9f-1382-5b41-afe0-d6f272b9aa86
  title: '리볼빙(일부결제금액이월약정): 해지·변경·상품 전환'
  body: '리볼빙(일부결제금액이월약정) 서비스의 해지, 설정 변경 또는 타 상품으로의 전환 절차를 안내해 드립니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 본인 인증 수행: 상담원에게 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 본인 인증이 완료된 후 요청 처리가 가능합니다.

    2. 요청 사항 전달: 서비스의 완전 해지, 최소결제비율 변경, 또는 다른 결제 방식(예: 일시불 상환)으로의 전환 중 원하시는 사항을 말씀해
    주십시오.

    3. 잔액 및 수수료 확인: 현재 이월되어 있는 원금과 이번 달까지 발생한 리볼빙 수수료율(연) 16.5% 기반의 수수료 합계액을 안내받으십시오.

    4. 상환 방법 결정: 해지 시 이월 잔액을 즉시 전액 상환하실지, 아니면 다음 결제일에 포함하여 납부하실지 결정하십시오.

    5. 처리 결과 확인: 요청하신 변경 또는 해지 사항이 정상적으로 반영되었음을 상담원을 통해 최종 확인하십시오.


    서비스 해지 후에는 더 이상 이월 기능이 제공되지 않으며, 모든 이용 금액은 다음 결제일에 전액 청구됩니다.'
