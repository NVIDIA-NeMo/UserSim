domain_regulators:
  retail_banking:
    regulators:
    - 금융위원회
    - 금융감독원
    - 예금보험공사
    regulator_text: 은행은 은행법에 따라 금융위원회와 금융감독원의 감독을 받는다. 예금자보호법에 따라 예금보험공사는 보통예금, 정기예금,
      적금, 외화예금 등을 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호하고, 연금저축(신탁·보험), 확정기여형과 개인형
      퇴직연금의 예금보호 대상 상품, 사고보험금은 각각 별도로 1억원까지 보호한다. 펀드처럼 실적에 따라 수익이 달라지는 투자상품은 보호 대상이
      아니다. 예금 이자에는 소득세와 지방소득세를 합해 15.4%가 원천징수되고, 이자와 배당을 합한 금융소득이 연 2,000만원을 넘으면 다른
      소득과 합산해 종합과세된다. 계좌를 개설할 때는 금융실명법에 따른 실명확인이 필요하고, 실명이 확인된 계좌로 하는 계속거래에는 다시 하지
      않는다. 보이스피싱 등 전기통신금융사기 피해를 입은 고객은 돈을 보낸 은행이나 받은 은행에 피해구제를 신청해 사기에 이용된 계좌의 지급정지를
      요청할 수 있다. 개인정보는 개인정보 보호법에 따라 처리하며, 주민등록번호는 법령이 허용하는 경우에만 처리한다. 금융 분쟁은 금융감독원
      금융분쟁조정위원회에 조정을 신청할 수 있다. 상담원은 계좌 정보를 알려주거나 바꾸기 전에 본인 확인을 한다.
  cards:
    regulators:
    - 금융위원회
    - 금융감독원
    regulator_text: 체크카드는 사용하는 즉시 연결된 예금계좌에서 대금이 출금되므로 계좌 잔액을 넘어 사용할 수 없다. 카드를 잃어버리거나
      도난당한 것을 알게 되면 즉시 카드를 발급한 은행이나 카드사에 신고해 사용을 정지해야 한다. 신고 전후의 부정사용 보상은 관련 법령과 카드
      약관에 따르며, 비밀번호를 다른 사람에게 알려 주는 등 고객에게 고의나 중대한 과실이 있으면 보상이 제한될 수 있다. 체크카드 사용액은
      연말정산 때 총급여의 25%를 넘는 부분에 대해 30%의 소득공제율이 적용되고, 신용카드는 15%다. 상담원은 수수료, 이용한도, 보상
      조건을 잘못 안내하지 않는다.
  lending_mortgage:
    regulators:
    - 금융위원회
    - 금융감독원
    regulator_text: 은행과 카드사의 대출은 금융소비자 보호에 관한 법률의 적용을 받는다. 대출 계약은 계약서류를 받은 날과 대출이
      실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있으며, 이때는 원금과 이용한 기간의 이자, 인지세 등 제3자에게 낸 비용만
      돌려주고 중도상환수수료는 내지 않는다. 2025년 1월 13일 이후 맺은 계약의 중도상환수수료는 자금 운용 손실과 대출 관련 행정·모집
      비용 같은 실제 비용 범위에서만 받을 수 있고, 대출일부터 3년이 지나면 받을 수 없다. 대출 총액이 1억원을 넘는 차주에게는 총부채원리금상환비율
      (DSR) 규제가 적용되어 연간 원리금 상환액이 은행은 연소득의 40%, 카드사 등 제2금융권은 50%를 넘지 않아야 하고, 한도를 계산할
      때는 앞으로의 금리 상승 위험을 반영한 스트레스 금리를 더한다. 카드사 상품 가운데 DSR에 들어가는 것은 장기카드대출(카드론)이며, 신용카드
      할부 구매는 대출이 아니어서 DSR 대상이 아니다. 법정 최고금리는 연 20%이고, 연체이자는 약정금리에 최대 3%p를 더한 수준을 넘을
      수 없으며 연 20%도 넘을 수 없다. 대출을 받은 뒤 소득이 늘거나 신용점수가 오르는 등 신용 상태가 나아진 고객은 금리인하요구권을 행사할
      수 있다. 상담원은 대출 승인을 약속하지 않고, 총상환액을 줄여 말하지 않으며, 상환이 어려운 고객에게는 이른 상담과 채무조정 제도를 안내한다.
  payments:
    regulators:
    - 금융위원회
    - 금융감독원
    - 여신금융협회
    regulator_text: 신용카드회사는 여신전문금융업법에 따라 금융위원회의 감독을 받는다. 일부결제금액이월약정(리볼빙)은 결제할 금액 중
      약정한 비율만 결제하고 나머지를 다음 달로 넘기는 서비스로, 넘긴 금액에는 수수료가 계속 붙어 총부담이 커질 수 있으므로 카드사는 수수료율과
      결제 구조를 충분히 설명해야 한다. 할부 기간 3개월 이상, 금액 20만원 이상인 신용카드 할부 거래는 계약서를 받은 날(물건을 더 늦게
      받았다면 받은 날)부터 7일 이내에 철회할 수 있고, 물건이 오지 않거나 하자가 있는 등의 사유가 있으면 남은 할부금의 지급을 거절하는
      항변권을 행사할 수 있으며, 카드사는 항변 신청에 7영업일 이내에 답해야 한다. 신용카드 사용액은 연말정산 때 총급여의 25%를 넘는 부분에
      대해 15%의 소득공제율이 적용된다. 카드를 잃어버리거나 도난당했을 때는 즉시 신고해야 하며, 신고 전후의 부정사용 보상은 관련 법령과
      약관에 따른다. 상담원은 수수료와 총상환액을 잘못 안내하지 않고, 리볼빙이나 할부를 안내할 때는 수수료가 붙는다는 점을 분명히 알린다.
  insurance:
    regulators:
    - 금융위원회
    - 금융감독원
    - 예금보험공사
    regulator_text: 보험회사는 보험업법에 따라 금융위원회와 금융감독원의 감독을 받는다. 보험회사가 파산하면 예금자보호법에 따라 예금보험공사가
      보험계약자 1인당 해약환급금(또는 만기보험금, 사고보험금)과 그 밖의 지급금을 합해 1억원까지 보호하고, 연금저축보험과 사고보험금은 각각
      별도로 1억원까지 보호한다. 변액보험은 최저보증 부분을 빼고는 보호하지 않는다. 계약자는 보험증권을 받은 날부터 15일 이내, 다만 청약한
      날부터 30일 이내에 청약을 철회할 수 있고, 진단계약 등 일부 계약은 철회할 수 없다. 계약 전 알릴 의무를 위반하면 계약이 해지되고
      보험금이 지급되지 않을 수 있다. 근로소득자는 보장성보험료에 대해 연 100만원 한도로 12%의 세액공제를 받을 수 있다. 저축성보험과
      연금보험의 보험차익은 10년 이상 유지하고 월 150만원 이하를 5년 이상 균등하게 납입하는 등의 요건을 갖추면 비과세된다. 민원과 분쟁은
      금융감독원에 신청할 수 있다. 상담원은 보험금 지급을 약속하지 않고, 개인별 세무나 의료 조언은 하지 않는다.
  brokerage_investing:
    regulators:
    - 금융위원회
    - 금융감독원
    - 예금보험공사
    regulator_text: 증권회사는 자본시장과 금융투자업에 관한 법률에 따라 금융위원회의 인가를 받고 금융감독원의 감독을 받는다. 투자자가
      맡긴 예탁금은 증권회사의 재산과 분리해 한국증권금융에 예치되고, 증권회사가 파산하면 예금자보호법에 따라 예금보험공사가 1인당 1억원까지
      보호한다. 주식, 펀드, ELS, 증권사 CMA 같은 투자상품은 예금자보호 대상이 아니며, 증권은 한국예탁결제원에 따로 보관된다. 증권회사는
      투자자의 재산 상황, 투자 경험과 목적에 맞지 않는 상품을 권유해서는 안 되고(적합성 원칙), 상품의 중요한 내용을 설명해야 한다. 2026년
      1월 1일부터 상장주식을 팔 때는 코스피 종목에 증권거래세 0.05%와 농어촌특별세 0.15%를 합한 0.20%, 코스닥 종목에 0.20%가
      붙는다. 국내 상장주식의 매매차익은 대주주가 아니면 과세되지 않고, 해외주식의 매매차익은 연 250만원을 공제한 뒤 지방소득세를 포함해
      22%의 양도소득세가 붙으며 다음 해 5월에 신고한다. 배당소득에는 15.4%가 원천징수된다. ISA와 연금저축, 개인형 퇴직연금(IRP)은
      조세특례제한법과 소득세법에 따른 세제 혜택이 있다. 연금저축계좌와 IRP에서는 펀드와 국내 상장 ETF(레버리지·인버스 ETF 제외) 등에
      투자할 수 있고, 개별 주식은 국내외 모두 직접 살 수 없으며, IRP는 예금도 담을 수 있다. 중개형 ISA에서는 국내 상장주식과 ETF,
      펀드, ELS, 예금 등에 투자할 수 있다. 상담원은 수익을 보장하지 않고, 개인별 세무 조언은 하지 않는다.
