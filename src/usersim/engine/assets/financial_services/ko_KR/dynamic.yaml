schema_version: v0.1
locale: ko_KR
taxonomy_id: ko_KR_financial_services_dynamic
taxonomy_version: v0.1.0
placeholder: true
# Dynamic-tier taxonomy: authored open-ended topic neighborhoods for the
# `dynamic` tier, written for the Korean institution set (bank | neobank |
# insurer | nbfc | brokerage). At runtime the probe scopes categories to the
# single institution the conversation is grounded in. Invitations set a topic
# boundary in the persona's voice (NOT a question); subtopic_hints are
# neighborhoods (NOT questions). >=2 hints each. Some hints are deliberately
# COMPARATIVE / MULTI-DOCUMENT so a grounded answer requires synthesizing
# across several knowledge-base documents (multiple kb_search calls) rather
# than one lookup. Optional persona_affinities SOFT-WEIGHT selection toward
# ecologically-valid personas; a soft prior only (never a hard filter).
# Invitations and hints are in Korean; ids stay English.
categories:
# ── Commercial bank ────────────────────────────────────────────────────
- id: banking-account-fit
  applies_to_types: [bank]
  persona_affinities: [financial-literacy:low]
  invitation: 평소에 돈을 넣고 빼고 모으는 방식에 맞는 통장과 예적금을 제 말로 정리해 보고 싶어요.
  subtopic_hints:
  - 입출금통장과 정기예금, 정기적금의 쓰임새와 돈을 꺼내 쓰기 쉬운 정도의 차이
  - 급여나 연금을 받는 통장으로 정했을 때의 혜택과 조건
  - 정기예금의 가입 기간별 금리와 만기 전에 해지하면 적용되는 중도해지이율
  - 예금 이자에 붙는 세금과 실제로 받는 이자
  - 정기적금의 월 납입액 한도와 납입을 거른 달의 처리
  - 생활비와 따로 비상금을 나눠 두는 방법
  - 입출금통장, 정기예금, 정기적금을 금리, 돈을 꺼내 쓰기 쉬운 정도, 수수료로 나란히 놓고 본 차이
  - 통장에 드는 돈 전체를 이자, 세금, ATM 수수료, 이체 수수료까지 합쳐서 본 부담
- id: banking-fees-and-disputes
  applies_to_types: [bank]
  persona_affinities: [financial-literacy:low]
  invitation: 통장 수수료와 자동이체, 체크카드 문제에 대해 제가 직접 할 수 있는 일을 알고 싶어요.
  subtopic_hints:
  - 영업시간 외 ATM 출금 수수료를 줄이는 방법
  - 모르는 체크카드 결제를 발견했을 때 연락할 곳과 처리 순서
  - 자동이체를 해지하고 싶을 때의 절차와 다음 출금에 맞추는 시점
  - 지방세나 공과금을 통장에서 납부할 때 주의할 점
  - 체크카드를 잃어버렸을 때의 사용 정지와 재발급 수수료
  - 부정 사용된 돈을 보상받을 수 있는 조건
  - 사용 정지, 부정 사용 조사, 재발급을 각각 요청했을 때 일어나는 일과 서로의 관계
  - 수수료, 자동이체, 카드 부정 사용 문제마다 상담할 곳과 기한을 나란히 놓은 비교
- id: home-loan
  applies_to_types: [bank]
  persona_affinities: [age:25-34, age:35-44]
  invitation: 주택담보대출의 구조와 대출을 받은 뒤에 바꿀 수 있는 것들을 이해하고 싶어요.
  subtopic_hints:
  - 변동금리와 5년 혼합형 금리의 차이와 금리가 오를 때 상환액의 변화
  - DSR 규제와 스트레스 금리가 대출 한도에 미치는 영향
  - 중도상환수수료가 붙는 기간과 실제 비용 범위에서만 받는다는 기준
  - 대출 계약 후 14일 이내에 청약을 철회할 때 돌려주는 돈
  - 변동금리에서 혼합형으로 금리를 바꿀 때의 절차와 비용
  - 최장 대출 기간과 상환 방식에 따른 월 상환액의 차이
  - 중도상환으로 기간을 줄일 때와 월 상환액을 줄일 때의 총이자 비교
  - 금리, 중도상환수수료, DSR, 금리 전환까지 합쳐서 본 주택담보대출 비용의 전체 모습
- id: credit-loan-and-rates
  applies_to_types: [bank]
  persona_affinities: [age:25-34, age:35-44]
  invitation: 직장인 신용대출을 쓰면서 금리와 한도가 어떻게 정해지고 어떻게 낮출 수 있는지 알고 싶어요.
  subtopic_hints:
  - 신용점수와 소득에 따라 정해지는 신용대출 금리의 범위
  - 금리인하요구권을 쓸 수 있는 경우와 신청 방법
  - 대출 총액이 1억원을 넘을 때 DSR 규제가 적용되는 방식
  - 신용대출을 중도에 갚을 때의 수수료
  - 연체가 생겼을 때 붙는 연체이자와 신용에 미치는 영향
  - 법정 최고금리와 대출 금리의 관계
  - 금리인하요구, 중도상환, 대출 갈아타기를 이자 부담으로 비교한 차이
  - 신용대출을 받기 전부터 다 갚을 때까지 드는 비용과 확인할 점의 전체 흐름
# ── Internet-only bank ─────────────────────────────────────────────────
- id: neobank-account-basics
  applies_to_types: [neobank]
  persona_affinities: [age:18-24, age:25-34]
  invitation: 지점 없는 은행을 쓸 때 계좌 개설부터 평소 이용까지 무엇이 다른지 알고 싶어요.
  subtopic_hints:
  - 앱에서 계좌를 만들 때 하는 비대면 실명확인의 방법
  - 입출금통장의 금리와 이체, ATM 수수료
  - 휴대폰을 바꿨을 때 앱 인증을 다시 등록하는 절차
  - 체크카드의 캐시백과 해외 이용 수수료
  - 앱에서 하는 체크카드 사용 정지와 하루 이용한도 변경
  - 인터넷전문은행 예금도 예금자보호를 받는 범위
  - 입출금통장, 세이프박스, 정기예금을 금리와 돈을 꺼내 쓰기 쉬운 정도로 나란히 놓은 비교
  - 계좌 개설부터 카드 발급, 이체 한도 설정까지 처음 쓸 때의 전체 순서
- id: neobank-everyday-tools
  applies_to_types: [neobank]
  persona_affinities: [age:25-34, age:35-44]
  invitation: 세이프박스나 모임통장 같은 기능을 제 생활에 맞게 써 보고 싶어요.
  subtopic_hints:
  - 세이프박스의 금리와 최대 보관 금액, 이자가 붙는 방식
  - 모임통장에서 모임주와 멤버가 할 수 있는 일의 차이
  - 모임통장에 멤버를 초대하고 회비를 모으는 방법
  - 모임통장을 해지하거나 모임주를 바꿀 때의 처리
  - 세이프박스와 입출금통장 사이에 돈을 옮기는 방법
  - 정기예금 6개월과 1년의 금리 차이와 고르는 기준
  - 비상금을 세이프박스, 정기예금, 입출금통장에 나눠 둘 때의 장단점 비교
  - 모임 회비를 모으고, 쓰고, 정산하는 과정 전체에서 확인할 점
# ── Life insurer ───────────────────────────────────────────────────────
- id: life-cover-choice
  applies_to_types: [insurer]
  persona_affinities: [age:25-34, age:35-44]
  invitation: 가족을 위해 사망보장을 어떻게 준비할지, 보험의 종류부터 이해하고 싶어요.
  subtopic_hints:
  - 정기보험과 종신보험의 보장 기간과 보험료 차이
  - 저해지환급형 종신보험의 해약환급금이 적은 이유와 유의점
  - 계약 전 알릴 의무와 사실과 다르게 알렸을 때의 결과
  - 보험증권을 받은 뒤 청약을 철회할 수 있는 기간
  - 보장성보험료 세액공제의 한도와 공제율
  - 보험회사가 파산했을 때 예금자보호를 받는 범위
  - 정기보험과 저해지환급형 종신보험을 보험료, 보장 기간, 해약환급금으로 비교한 차이
  - 가입부터 보험료 납입, 해지까지 사망보장 보험에 드는 돈의 전체 모습
- id: health-and-cancer-cover
  applies_to_types: [insurer]
  persona_affinities: [age:45-54, age:55-64]
  invitation: 입원이나 수술, 암에 대비하는 보장을 지금 상황에 맞게 정리하고 싶어요.
  subtopic_hints:
  - 정액형 건강보험의 입원일당과 수술비가 지급되는 방식
  - 실제 치료비를 보장하는 실손의료보험과 정액형 보장의 차이
  - 암보험의 면책기간과 가입 초기 감액기간
  - 일반암과 유사암의 진단비 차이
  - 1회 입원에 지급되는 최대 일수
  - 보험료가 부담될 때 보장을 줄이는 방법
  - 건강보험과 암보험을 입원, 수술, 진단의 보장으로 나란히 놓은 비교
  - 진단부터 입원, 수술, 보험금 청구까지 이어지는 흐름에서 받을 수 있는 보장
- id: claims-and-keeping-cover
  applies_to_types: [insurer]
  persona_affinities: [age:55-64, age:65+]
  invitation: 보험금을 청구하는 방법과 보험료를 내기 어려울 때 계약을 지키는 방법을 알고 싶어요.
  subtopic_hints:
  - 보험금 청구에 필요한 서류와 서류가 접수된 뒤의 지급 시기
  - 청구 진행 상황을 확인하는 방법
  - 보험료가 밀려 계약이 실효됐을 때의 부활 절차
  - 해지하지 않고 돈을 마련하는 보험계약대출의 구조
  - 보험료 납입 방법과 출금 계좌를 바꾸는 방법
  - 연금보험의 보험차익이 비과세되는 요건
  - 보험계약대출, 가입금액 감액, 해지를 받을 수 있는 돈과 잃는 보장으로 비교한 차이
  - 보험료를 내기 어려워졌을 때 고를 수 있는 방법 전체와 각각의 결과
# ── Credit card company ────────────────────────────────────────────────
- id: card-payment-options
  applies_to_types: [nbfc]
  persona_affinities: [age:18-24, financial-literacy:low]
  invitation: 카드로 결제할 때 일시불, 할부, 리볼빙 중에 무엇을 써야 하는지 알고 싶어요.
  subtopic_hints:
  - 일시불과 할부의 차이와 할부수수료가 붙는 방식
  - 가맹점 행사로 하는 무이자할부와 일반 할부의 차이
  - 결제한 뒤 할부로 바꾸는 결제 후 할부 전환
  - 리볼빙의 약정결제비율과 이월된 금액에 붙는 수수료
  - 할부로 산 물건이 오지 않거나 하자가 있을 때의 철회권과 항변권
  - 신용카드 사용액의 연말정산 소득공제율
  - 일시불, 할부, 리볼빙을 같은 금액으로 썼을 때의 총부담 비교
  - 연회비, 포인트, 할부수수료, 리볼빙 수수료까지 합친 카드 비용의 전체 모습
- id: card-borrowing-and-repayment
  applies_to_types: [nbfc]
  persona_affinities: [financial-literacy:low]
  invitation: 현금서비스나 카드론을 쓰기 전에, 그리고 갚기 어려울 때 무엇을 알아야 하는지 정리하고 싶어요.
  subtopic_hints:
  - 현금서비스와 카드론의 금리와 한도 차이
  - 법정 최고금리와 연체이자가 정해지는 방식
  - 카드론을 중도에 한꺼번에 갚는 방법
  - 카드대금이 연체됐을 때 납부하는 방법과 신용에 미치는 영향
  - 리볼빙 이월 잔액을 선결제로 줄이는 방법
  - 카드대금 결제 계좌를 바꾸는 절차
  - 현금서비스, 카드론, 리볼빙을 같은 금액으로 빌렸을 때의 이자 부담 비교
  - 갚기 어려워졌을 때 카드사에 상담할 수 있는 방법과 그 결과 전체
# ── Online securities firm ─────────────────────────────────────────────
- id: isa-and-account-choice
  applies_to_types: [brokerage]
  persona_affinities: [age:18-24, age:25-34]
  invitation: 투자를 시작하면서 어떤 계좌를 만들어야 세금을 아낄 수 있는지 알고 싶어요.
  subtopic_hints:
  - 중개형 ISA의 연간 납입 한도와 총 납입 한도
  - ISA의 비과세 한도와 넘는 부분의 분리과세
  - ISA 의무가입기간과 만기 후 연금계좌로 옮길 때의 추가 세액공제
  - ISA를 다른 금융회사로 옮기는 계좌 이전
  - 종합매매계좌와 ISA에서 살 수 있는 상품의 차이
  - 직전 3년 금융소득종합과세 대상자의 가입 제한
  - 종합매매계좌, ISA, 연금저축계좌를 세금, 납입 한도, 돈을 꺼내 쓰기 쉬운 정도로 비교한 차이
  - 투자를 처음 시작할 때 계좌 개설부터 적립식 설정까지의 전체 순서
- id: pension-and-irp
  applies_to_types: [brokerage]
  persona_affinities: [age:35-44, age:45-54, age:55-64]
  invitation: 연금저축과 IRP로 노후를 준비하면서 세액공제를 제대로 받고 싶어요.
  subtopic_hints:
  - 연금저축과 IRP의 세액공제 대상 납입 한도
  - 총급여에 따른 세액공제율의 차이
  - 연금계좌의 연간 납입 한도
  - 55세 이후 연금으로 받을 때 나이별 연금소득세율
  - 사적연금 소득이 연 1,500만원을 넘을 때의 과세 선택
  - 연금이 아닌 형태로 중도 인출할 때 붙는 세금
  - 연금저축과 IRP를 세액공제, 투자할 수 있는 상품, 중도 인출 조건으로 비교한 차이
  - 납입부터 운용, 연금 수령까지 연금계좌에 드는 세금과 혜택의 전체 모습
- id: brokerage-costs-and-tax
  applies_to_types: [brokerage]
  persona_affinities: [financial-literacy:high]
  invitation: 국내주식과 미국주식을 거래할 때 드는 수수료와 세금을 정확히 알고 싶어요.
  subtopic_hints:
  - 국내주식 거래 수수료와 증권거래세
  - 미국주식 거래 수수료와 환전 수수료 우대
  - 해외주식 양도소득세의 기본공제와 신고 시기
  - 배당소득에 원천징수되는 세금과 금융소득종합과세
  - 미체결 주문의 취소와 주문 상태 확인
  - 예탁금이 예금자보호를 받는 범위와 주식은 보호되지 않는다는 점
  - 국내주식과 미국주식을 같은 금액으로 사고팔 때의 수수료와 세금 비교
  - 매수부터 매도, 세금 신고까지 주식 거래에 드는 비용의 전체 모습
# ── Cross-cutting (several types) ──────────────────────────────────────
- id: account-lifecycle
  applies_to_types: [bank, neobank, insurer, nbfc, brokerage]
  invitation: 여기서 새로 계좌나 계약을 시작하는 일, 또는 쓰지 않는 계좌나 계약을 정리하는 일에 무엇이 필요한지 알고 싶어요.
  subtopic_hints:
  - 계좌나 계약을 시작할 때 필요한 서류와 본인 확인
  - 해지하기 전에 정리해야 하는 자동이체와 남은 잔액
  - 해지할 때 돌려받는 돈과 붙는 수수료
  - 주소나 연락처가 바뀌었을 때 변경하는 방법
  - 계약을 철회할 수 있는 기간과 해지의 차이
  - 오래 쓰지 않은 계좌의 처리
  - 새로 시작할 때와 해지할 때 확인할 점을 나란히 놓은 비교
  - 계좌나 계약을 정리할 때 처리할 일 전체의 순서
- id: beneficiaries-and-inheritance
  applies_to_types: [bank, insurer, brokerage]
  persona_affinities: [age:55-64, age:65+]
  invitation: 제게 무슨 일이 생겼을 때 이 돈이 어떻게 되는지 알고 미리 준비해 두고 싶어요.
  subtopic_hints:
  - 보험의 사망보험금 수익자를 지정하고 바꾸는 방법
  - 예금주가 사망했을 때 상속인이 예금을 찾는 절차
  - 증권 계좌의 주식이 상속될 때의 처리
  - 가족이 대신 보험금을 청구하는 지정대리청구인 제도
  - 연금계좌를 가진 사람이 사망했을 때의 처리
  - 상속 절차에 필요한 서류
  - 예금, 보험, 증권 계좌별로 가족이 해야 하는 일의 비교
  - 미리 해 둘 수 있는 준비 전체와 각각의 효과
- id: authorized-access
  applies_to_types: [nbfc, brokerage]
  invitation: 가족이 이 카드나 계좌를 함께 쓰거나 대신 관리하는 방법과 그 범위를 알고 싶어요.
  subtopic_hints:
  - 가족카드를 발급받는 방법과 결제 책임
  - 미성년 자녀 계좌의 법정대리인이 할 수 있는 일
  - 가족카드의 이용한도와 사용 정지
  - 자녀가 성인이 됐을 때 계좌 관리의 변화
  - 가족이 대신 전화했을 때 확인하는 본인 정보
  - 다른 사람에게 카드를 빌려주면 안 되는 이유
  - 가족카드, 법정대리인, 위임을 할 수 있는 일과 책임으로 비교한 차이
  - 가족과 함께 쓰기 시작할 때부터 그만둘 때까지 필요한 절차 전체
- id: money-movement
  applies_to_types: [bank, neobank, brokerage]
  invitation: 이 계좌에 돈을 넣고 빼거나 계좌 사이에 돈을 옮길 때의 시간과 한도를 알고 싶어요.
  subtopic_hints:
  - 다른 은행으로 이체할 때의 수수료와 한도
  - 자주 쓰는 계좌를 등록하고 관리하는 방법
  - 증권 계좌로 입금하고 은행 계좌로 출금하는 데 걸리는 시간
  - 잘못 보낸 돈을 돌려받는 방법
  - 1회와 하루 이체 한도를 바꾸는 방법
  - 공과금을 계좌에서 납부하는 방법
  - 이체, 입금, 출금을 시간, 수수료, 한도로 나란히 놓은 비교
  - 큰돈을 옮길 때 확인할 점 전체
- id: account-security
  applies_to_types: [bank, neobank, nbfc, brokerage]
  persona_affinities: [age:65+, financial-literacy:low]
  invitation: 제 계좌가 안전한지 확인하고, 보이스피싱 같은 사기를 알아챘을 때 어떻게 해야 하는지 알고 싶어요.
  subtopic_hints:
  - 검찰이나 금융회사를 사칭하는 보이스피싱 수법
  - 택배나 지원금을 가장한 스미싱 문자
  - 사기로 돈을 보냈을 때 피해구제를 신청하고 지급정지를 요청하는 방법
  - 로그인과 이체 때의 추가 인증
  - 비밀번호를 다른 사람에게 알렸을 때 보상이 제한되는 경우
  - 카드를 잃어버렸을 때 바로 할 일
  - 보이스피싱, 스미싱, 카드 부정 사용마다 바로 할 일을 나란히 놓은 비교
  - 사기를 알아챈 순간부터 피해구제까지 이어지는 절차 전체
- id: complaints-and-adr
  applies_to_types: [bank, neobank, insurer, nbfc, brokerage]
  persona_affinities: [age:45-54, age:55-64]
  invitation: 이 회사의 처리에 납득하기 어려운 일이 있어서 어디까지 이의를 제기할 수 있는지 알고 싶어요.
  subtopic_hints:
  - 회사에 민원을 넣는 방법과 답변을 받는 기간
  - 금융감독원에 민원이나 분쟁조정을 신청하는 방법
  - 금융분쟁조정위원회의 조정 절차
  - 상품 설명을 제대로 듣지 못했을 때 할 수 있는 일
  - 부당하게 받은 수수료를 돌려받는 방법
  - 민원을 넣을 때 준비할 자료
  - 회사 민원, 금융감독원 민원, 분쟁조정을 기간과 결과로 비교한 차이
  - 문제가 생긴 때부터 해결될 때까지 밟을 수 있는 절차 전체
