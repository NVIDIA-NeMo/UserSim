- id: 1e710d15-f99c-5dff-b5d1-2f64e48902d6
  title: '미리내 입출금통장: 약관'
  body: '본 약관은 미리내 입출금통장의 이용 조건 및 당사와 고객 간의 권리와 의무를 규정합니다.


    1. 서비스 제공 및 비용: 미리내뱅크는 고객의 금융 부담을 최소화하기 위해 다른 은행으로의 이체 수수료(모바일·인터넷뱅킹)를 0원으로 제공하며,
    ATM 출금 수수료 또한 0원으로 적용합니다. 단, 외부 비용이 발생하는 국제 브랜드 이용 수수료 등은 별도로 부과될 수 있습니다.


    2. 금리 적용: 본 계좌의 입출금통장 금리는 연 0.1%로 적용됩니다. 금리는 관련 법령에 따라 소득세와 지방소득세를 합해 15.4%가 원천징수된
    후 지급됩니다.


    3. 계좌의 유지 및 해지: 고객은 언제든지 모바일 앱을 통해 계좌 해지를 요청할 수 있습니다. 해지 시 잔액은 고객이 지정한 계좌로 송금되며,
    해지 절차 완료 후 본 계약은 종료됩니다.


    4. 준거법 및 분쟁 해결: 본 약관은 대한민국 법률을 준거법으로 하며, 분쟁 발생 시 금융감독원 금융분쟁조정위원회의 기준에 따라 처리하는
    것을 원칙으로 합니다.'
