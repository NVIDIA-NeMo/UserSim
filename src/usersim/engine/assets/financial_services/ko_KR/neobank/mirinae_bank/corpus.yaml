- id: 5ff728f4-53e1-5de2-b312-8234231f8b31
  title: '세이프박스: 상품 개요'
  body: '미리내뱅크의 세이프박스는 일상적인 입출금 계좌와 연결하여 단기 자금을 효율적으로 관리할 수 있도록 설계된 혁신적인 보관함 서비스입니다.
    복잡한 절차 없이 모바일 앱을 통해 즉시 개설할 수 있으며, 하루만 자금을 맡겨도 연 2%의 높은 금리를 제공하여 고객님의 자산 가치를 높여드립니다.


    본 상품의 핵심 내용은 다음과 같습니다.

    - 적용 금리: 연 2%

    - 최대 보관 가능 금액: 100,000,000원

    - 보호 제도: 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다.


    세이프박스는 입출금통장의 편리함과 정기예금의 수익성을 동시에 누리고자 하는 디지털 네이티브 고객님께 최적의 선택입니다. 필요할 때 언제든 자유롭게
    자금을 꺼내 쓸 수 있으면서도, 보관하는 동안에는 지속적으로 이자 혜택을 받으십시오. 자세한 금리 적용 방식은 ''세이프박스: 금리·요율 안내''를
    통해 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: product_sheet
  source_authority: official
  placeholder: true
