  institution_id: mirinae_bank
- id: 7d9f0a9c-13be-5748-bb19-430483ce7a09
  title: '미리내 정기예금: 다른 상품과의 비교와 맞지 않는 경우'
  body: '''미리내 정기예금''은 일정 기간 자금을 예치하여 안정적인 수익을 추구하는 고객님께 최적화된 상품입니다. 하지만 고객님의 금융 상황에
    따라 본 상품이 적절하지 않을 수 있으므로 다음 내용을 참고하십시오.


    1. 이런 분께 추천합니다

    - 최소 10,000원 이상의 여유 자금을 보유하고 계신 분

    - 6개월(3.2%) 또는 1년(3.5%)의 기간 동안 자금을 사용할 계획이 없으신 분

    - 원금 손실 없이 확정된 금리 수익을 얻고자 하시는 분


    2. 이런 분께는 맞지 않습니다

    - 갑작스러운 지출 가능성이 있어 언제든 돈을 찾아야 하는 분: 이 경우 중도 해지 시 금리 손실이 발생하므로, 하루만 맡겨도 2% 금리를
    주는 ''세이프박스''가 더 합리적입니다.

    - 입출금이 빈번한 생활비 계좌가 필요하신 분: 기본 금융 거래를 위한 ''미리내 입출금통장''을 이용하시기 바랍니다.


    본 상품은 예금보험공사를 통해 1인당 원금과 이자를 합해 1억원까지 보호되므로 안전하게 자산을 증식시키실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: product_sheet
