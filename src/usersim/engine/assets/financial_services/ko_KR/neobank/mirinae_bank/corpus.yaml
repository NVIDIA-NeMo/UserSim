- id: bebfaca5-dd96-55a6-962c-d9bc366c4e05
  title: '미리내 정기예금: 안전한 이용을 위한 수칙'
  body: '미리내 정기예금을 이용하시는 고객님의 소중한 자산을 보호하기 위해 다음의 안전 수칙을 반드시 준수하여 주십시오.


    1. 민감 정보 요구 주의

    미리내뱅크는 어떠한 경우에도 고객님의 카드 비밀번호, CVV 번호, 주민등록번호 전체, 또는 보안카드 번호를 요구하지 않습니다. 이러한 정보를
    요청하는 전화, 문자, 메일은 금융사기일 가능성이 매우 높으므로 즉시 삭제하시고 대응하지 마십시오.


    2. 출처 불분명한 링크 클릭 금지

    스미싱이나 보이스피싱은 정교한 가짜 웹사이트 링크를 통해 개인정보를 탈취합니다. 공식 앱 외의 경로로 접근하는 금융 서비스 요청은 각별히 주의하시기
    바랍니다.


    3. 이상 징후 발견 시 즉시 대응

    본인이 신청하지 않은 계좌 상태 변경 알림을 받으셨거나, 금융사기가 의심되는 경우 즉시 고객센터를 통해 지급정지를 요청하십시오. 신속한 조치만이
    피해를 최소화하는 방법입니다.


    4. 본인 인증 절차 준수

    계좌 정보 변경 등 중요한 작업 전에는 반드시 고객님의 성함과 생년월일을 확인하는 본인 인증 과정을 거칩니다. 이는 고객님의 자산을 안전하게
    보호하기 위한 필수 절차이오니 적극적인 협조를 부탁드립니다.'
