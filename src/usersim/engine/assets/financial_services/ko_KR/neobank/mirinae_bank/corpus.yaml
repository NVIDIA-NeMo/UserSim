- id: 57fe729a-5db5-5501-b3b5-973bac039b0c
  title: '미리내 정기예금: 가입과 이용 조건'
  body: 'Q: 가입을 위해 필요한 최소 금액과 조건이 어떻게 됩니까?


    A: ''미리내 정기예금''의 최소 가입 금액은 10,000원입니다. 또한 금융실명법에 따라 미리내뱅크 앱을 통한 비대면 실명확인 절차를 완료하신
    고객님에 한해 가입이 가능합니다.


    Q: 가입 기간은 어떻게 선택할 수 있나요?


    A: 고객님의 자금 계획에 따라 6개월 또는 1년 중 선택하실 수 있습니다. 6개월 선택 시 3.2%, 1년 선택 시 3.5%의 금리가 적용됩니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: b261c787-7cc4-5cf7-8721-1b0d257dfdbe
  title: '미리내 정기예금: 자주 하는 업무의 처리 절차'
  body: '미리내뱅크의 ''미리내 정기예금''에 가입하는 절차를 안내해 드립니다.


    준비 사항: 본인 명의의 신분증과 미리내뱅크 입출금 계좌가 필요합니다.


    1. 본인 인증 및 실명확인

    상담원에게 성함과 생년월일을 말씀하여 본인 인증을 수행하십시오. 이후 안내에 따라 비대면 실명확인 절차를 완료하십시오.


    2. 예치 기간 및 금액 설정

    원하시는 예치 기간(6개월 또는 1년)과 가입 금액을 말씀해 주십시오. 가입 금액은 최소 10,000원 이상이어야 합니다.


    3. 금리 확인

    선택하신 기간에 따른 금리를 확인하십시오.

    - 6개월 선택 시: 3.2%

    - 1년 선택 시: 3.5%


    4. 자금 이체 및 가입 완료

    연결된 입출금 계좌에서 설정하신 금액이 정기예금 계좌로 이체됩니다. 이체가 완료되면 가입이 확정되며, 상담원이 만기일과 예상 수령액을 안내해
    드립니다.


    이 모든 과정은 모바일 앱 환경을 기반으로 하며, 상담원을 통해 신속하게 처리하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 1dd18484-8103-512d-bba9-4683c5e24687
  title: '미리내 정기예금: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 ''미리내 정기예금''의 이자 내역이나 최종 수령액이 예상과 다를 때, 상담원은 다음 사항을 순차적으로 점검하십시오.


    1. 원천징수 세금 반영 여부 확인

    - 현상: 계산한 이자보다 실제 수령액이 적은 경우

    - 원인: 이자 소득에 대해 15.4%의 소득세 및 지방소득세가 원천징수되었기 때문입니다.

    - 조치: 세전 이자와 세후 이자를 구분하여 안내하고, 15.4%의 세율이 정확히 적용되었는지 확인하십시오.


    2. 중도 해지 여부 및 금리 적용 확인

    - 현상: 약정 금리(3.2% 또는 3.5%)보다 낮은 이자가 지급된 경우

    - 원인: 만기일 이전에 계좌를 해지하여 중도해지 금리가 적용되었을 가능성이 큽니다.

    - 조치: 정확한 해지 일자를 확인하고, 해당 시점에 적용되는 중도해지 금리 규정을 안내하십시오.


    3. 이자 계산 기간 확인

    - 현상: 일할 계산된 이자가 예상과 다른 경우

    - 원인: 가입일로부터 만기일까지의 정확한 일수 계산 차이일 수 있습니다.

    - 조치: 가입일과 만기일을 재확인하고 정확한 산식으로 계산된 내역을 제공하십시오.


    만약 위 사항으로도 해결되지 않는 복잡한 계산 오류가 의심된다면, 내부 에스컬레이션 경로를 통해 전문 담당 부서로 이관하여 정밀 조사를 진행하고
    그 결과를 고객님께 안내하십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 1666ffd9-2eca-5909-8984-bdd2287e911d
  title: '미리내 체크카드: 상품 개요'
  body: '미리내 체크카드는 0원의 연회비로 이용하며 결제 시 0.5%의 캐시백 혜택을 받는 스마트한 카드입니다. 디지털 네이티브 고객님들이
    복잡한 조건 없이 일상적인 소비에서 혜택을 누리실 수 있도록 설계되었습니다.


    [주요 혜택 및 조건]

    - 연회비: 0원

    - 캐시백 비율: 결제 금액의 0.5%

    - 하루 이용한도(기본 설정): 6,000,000원

    - 해외 이용 수수료: 국제브랜드 수수료율 1% 적용


    본 카드는 미리내뱅크의 입출금 계좌와 연결되어 사용하는 상품으로, 결제 즉시 계좌에서 대금이 출금됩니다. 합리적인 소비와 투명한 자산 관리를
    원하는 고객님께 최적의 선택이 될 것입니다.


    자세한 신청 방법은 ''미리내 체크카드: 가입과 이용 시작'' 안내를 참고하시기 바랍니다.'
  domain: cards
