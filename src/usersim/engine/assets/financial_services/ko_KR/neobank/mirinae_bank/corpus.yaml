- id: d5b7aa8e-9566-5065-bf2b-5798a1e4d01d
  title: '미리내 체크카드: 전환이나 상위 상품을 고려할 때'
  body: '상담원은 고객이 미리내 체크카드에서 다른 상품으로의 전환을 고민할 때, 현재 상품의 객관적인 혜택을 바탕으로 안내해야 합니다.


    **[미리내 체크카드 핵심 가치]**

    - **비용 부담 제로**: 연회비가 0원으로, 유지 비용이 전혀 없습니다.

    - **범용적 혜택**: 결제 시 0.5%의 캐시백 비율이 적용되어 복잡한 조건 없이 혜택을 받을 수 있습니다.

    - **넉넉한 기본 한도**: 하루 이용한도(기본 설정)가 6,000,000원으로 설정되어 있어 일상적인 고액 결제에도 충분합니다.


    **[전환 고려 대상]**

    - **특화 혜택 필요 고객**: 특정 업종(예: 쇼핑, 주유)에서 0.5% 이상의 매우 높은 적립률을 원하는 경우 상위 특화 카드로의 전환이
    유리할 수 있습니다.

    - **신용 거래 필요 고객**: 잔액 범위 내 사용이 아닌, 후불 결제 기능이 필요한 경우에는 신용카드 상품을 고려하시도록 안내하십시오.


    미리내 체크카드는 비용 효율성과 기본 혜택을 중시하는 디지털 네이티브 고객에게 최적의 선택입니다.'
  domain: cards
  product_category: mirinae_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: f8fa5b7e-8b6d-5b7c-b30a-8ab1cb30136c
  title: '미리내 체크카드: 다른 상품과의 비교와 맞지 않는 경우'
  body: '미리내 체크카드는 단순함과 경제성을 극대화한 상품입니다. 고객님의 소비 패턴에 따라 이 상품이 최선일 수도, 혹은 다른 대안이 더
    적절할 수도 있습니다.


    **[미리내 체크카드가 적합한 경우]**

    - **연회비 지출을 원하지 않는 분**: 연회비 0원으로 부담 없이 카드를 소지하고 싶으신 분께 추천합니다.

    - **복잡한 실적 조건이 싫으신 분**: 전월 실적 등의 까다로운 조건 없이 결제 시 0.5%의 캐시백 비율을 받고 싶으신 분께 적합합니다.

    - **디지털 기반의 간편한 관리를 원하시는 분**: 앱을 통해 6,000,000원의 하루 이용한도를 손쉽게 관리하고 싶으신 분께 최적입니다.


    **[이 상품이 맞지 않는 경우]**

    - **초고액 결제가 빈번하신 분**: 기본 하루 이용한도(6,000,000원)를 크게 상회하는 결제가 매일 필요하신 경우, 한도 조정 가능
    여부를 먼저 확인하시거나 다른 상품을 고려하셔야 합니다.

    - **특정 분야의 집중 혜택을 원하시는 분**: 모든 가맹점 0.5% 캐시백보다 특정 영역(예: 배달, 스트리밍)의 집중 혜택을 선호하신다면
    특화 상품이 더 유리할 수 있습니다.

    - **해외 이용이 매우 잦으신 분**: 1%의 해외 이용 시 국제브랜드 수수료율이 적용되므로, 해외 결제 특화 상품과 혜택을 비교해 보시기
    바랍니다.'
  domain: cards
  product_category: mirinae_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 154d90ee-6d07-5989-a879-f2c7bbbb4ea1
  title: '미리내 체크카드: 수수료와 비용'
  body: '**Q: 미리내 체크카드를 유지하는 데 매년 내야 하는 비용이 있습니까?**


    A: 아니오, 없습니다. 미리내 체크카드의 연회비는 0원입니다. 고객님께서는 아무런 비용 부담 없이 스마트한 카드 혜택을 누리실 수 있습니다.


    **Q: 해외에서 카드를 사용할 때 별도로 발생하는 수수료가 있습니까?**


    A: 네, 해외 가맹점 이용 시에는 1%의 해외 이용 시 국제브랜드 수수료율이 적용됩니다. 이는 국제 브랜드사에서 부과하는 비용으로, 결제
    금액에 합산되어 청구됩니다.


    **Q: 국내 가맹점 결제 시 수수료가 발생하나요?**


    A: 아니오, 국내 가맹점 이용 시 고객님이 부담하시는 별도의 결제 수수료는 없습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 0bc7ab9c-038d-5d81-be23-6dd576b419ea
  title: '미리내 체크카드: 자주 하는 업무의 처리 절차'
  body: '미리내 체크카드 이용 중 가장 자주 요청하시는 주요 업무 처리 절차입니다.


    **1. 카드 이용한도 변경하기**

    - **절차**: 앱 로그인 → ''카드'' 메뉴 → ''내 카드 관리'' → ''이용한도 설정'' → 원하는 금액 입력 → 본인 인증

    - **참고**: 기본 설정된 하루 이용한도는 6,000,000원이며, 심사 결과에 따라 변경 가능 범위가 다를 수 있습니다.


    **2. 카드 일시 정지 및 해제하기**

    - **절차**: 앱 로그인 → ''카드'' 메뉴 → ''내 카드 관리'' → ''카드 일시 정지'' 선택 → 확인

    - **결과**: 정지 즉시 모든 결제가 차단되며, 동일한 경로에서 ''정지 해제''를 통해 즉시 다시 사용하실 수 있습니다.


    **3. 카드 재발급 신청하기**

    - **절차**: 앱 로그인 → ''카드'' 메뉴 → ''재발급 신청'' → 수령지 주소 확인 및 입력 → 신청 완료

    - **결과**: 신청 후 영업일 기준 수일 내에 등록하신 주소로 카드가 배송됩니다.


    모든 절차 진행 전, 고객님의 성함과 생년월일을 통한 본인 인증이 필요합니다. 민감한 비밀번호나 CVV는 절대 요구하지 않으므로 주의하십시오.'
  domain: cards
  product_category: mirinae_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 2f63b2d4-6c7a-576b-9503-6ff0b0a983bd
  title: '미리내 체크카드: 명세서나 내역과 맞지 않을 때'
  body: '**[증상]**

    고객님이 생각하신 결제 금액과 앱에 표시된 청구 금액이 다르거나, 캐시백 금액이 예상과 다르게 계산되었다고 문의하시는 경우입니다.


    **[원인 및 확인 순서]**

    1. **해외 결제 수수료 확인**: 해외 이용 건의 경우, 순수 물품 가액 외에 1%의 해외 이용 시 국제브랜드 수수료율이 추가로 부과되었습니다.
    이를 합산한 금액이 최종 청구 금액인지 확인하십시오.

    2. **결제 승인과 매입의 시차**: 체크카드는 즉시 출금되지만, 가맹점에 따라 승인 금액과 실제 매입 금액이 달라질 수 있습니다(예: 호텔
    보증금, 렌터카 등). 최종 매입 전까지는 ''승인'' 상태로 표시될 수 있음을 안내하십시오.

    3. **캐시백 계산 검증**: 캐시백은 결제 금액의 0.5%가 적용됩니다. 소수점 처리 방식이나 제외 대상 가맹점(상품권 구매 등)이 포함되었는지
    확인하십시오.


    **[조치 방법]**

    - 수수료가 잘못 부과되었다고 판단되는 경우, 해당 거래의 승인 번호와 가맹점 정보를 확인하여 저희에게 전달해 주십시오.

    - 캐시백 누락이 의심되는 경우, 정확한 결제 일시와 금액을 바탕으로 적립 내역을 다시 조회해 드리겠습니다.


    **[에스컬레이션]**

    원인을 찾을 수 없는 금액 불일치 건은 내부 전문 상담 팀으로 이관하여 가맹점 및 브랜드사와의 대조 작업을 통해 정확한 원인을 파악하고, 오류
    발견 시 즉시 환급 처리하겠습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 86785fd8-3a68-5bb1-a329-9d8d421d6cd3
  title: 수수료·요금 안내
  body: '미리내뱅크는 고객님의 금융 부담을 최소화하기 위해 ''수수료 제로'' 정책을 시행하고 있습니다.


    - 주요 이체 수수료: 0원

    - ATM 이용 수수료: 0원


    단, 국제 브랜드 이용 수수료와 같이 외부 비용이 발생하는 서비스에 한해서는 합리적인 수준의 수수료를 부과하고 있습니다. 각 상품별 세부 수수료는
    해당 상품의 수수료 안내 문서를 확인해 주십시오.'
