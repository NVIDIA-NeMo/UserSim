- id: 88ec8850-87a2-54c5-b688-f74cf03db560
  title: create_safe_box 사용 기준
  body: '상담원은 고객이 세이프박스 개설 및 자금 보관을 요청할 경우 다음 절차에 따라 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 사용하여 세이프박스의 기반이 될 미리내 입출금통장의 `account_id`를 확인합니다.

    3. 고객에게 세이프박스에 보관할 금액을 확인합니다.

    4. 확인된 `account_id`와 보관 금액을 사용하여 `create_safe_box` 도구를 호출하여 세이프박스를 생성하고 자금을 이동시킵니다.


    세이프박스의 금리 및 상세 혜택에 대한 안내는 ''세이프박스: 상품 개요''를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - create_safe_box
  institution_id: mirinae_bank
- id: eec8aadf-a727-5ea9-bc58-5d272949a41c
  title: create_safe_box 도구 설명서
  body: "이 도구는 미리내 입출금통장 내에 세이프박스를 신규로 생성하고 지정된 금액을 즉시 보관함으로 이동시키는 기능을 수행합니다. 상담원은\
    \ 고객 인증 완료 후 이 도구를 직접 호출하십시오.\n\n- 호출 시그니처: `create_safe_box(account_id, amount)`\n\
    - 입력 매개변수:\n    - `account_id`: `get_accounts`를 통해 확인한 미리내 입출금통장의 고유 식별자입니다.\n\
    \    - `amount`: 미리내 입출금통장에서 세이프박스로 이동시킬 금액입니다.\n- 실행 결과: 세이프박스가 생성되며, 해당 금액이\
    \ 입출금통장에서 세이프박스로 이체됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - create_safe_box
  institution_id: mirinae_bank
- id: 009d60e7-7b8a-5d24-9f8b-94359de0da44
  title: create_group_account 사용 기준
  body: '상담원은 고객이 모임통장 개설을 요청할 경우 다음 절차에 따라 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. 고객에게 모임통장에 사용할 모임 이름과 구체적인 회비 관리 규칙을 확인합니다.

    3. 확인된 정보를 바탕으로 `create_group_account` 도구를 호출하여 계좌를 개설합니다.


    계좌를 개설한 고객은 자동으로 해당 모임통장의 모임주가 됩니다. 모임통장의 상세 운영 방식은 ''모임통장: 상품 개요''에서 확인하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - create_group_account
  institution_id: mirinae_bank
- id: cd7e89a3-da66-589f-9252-801640535106
  title: create_group_account 도구 설명서
  body: "이 도구는 여러 사람이 공동으로 관리할 수 있는 모임통장을 생성하는 기능을 수행합니다. 상담원은 고객 인증 완료 후 이 도구를 직접\
    \ 호출하십시오.\n\n- 호출 시그니처: `create_group_account(group_name, rules)`\n- 입력 매개변수:\n\
    \    - `group_name`: 고객이 지정한 모임의 명칭입니다.\n    - `rules`: 회비 납부 및 운영 등에 관한 모임 규칙입니다.\n\
    - 실행 결과: 모임통장이 개설되며, 도구를 호출한 본인 인증 고객이 모임주로서 모든 권한을 갖게 됩니다."
