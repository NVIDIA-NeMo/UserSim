- id: 8a9b2aae-198c-5955-9d77-db3a88025fef
  title: '미리내 정기예금: 다른 회사의 일반적인 상품과의 비교'
  body: '미리내 정기예금은 기존 금융기관의 정기예금과 비교하여 다음과 같은 차별점을 가집니다.


    - 가입 문턱: 일반적인 시중 은행은 정기예금 가입 시 높은 최소 금액을 요구하는 경우가 많으나, 미리내 정기예금은 10,000원부터 가입이
    가능하여 진입 장벽을 획기적으로 낮췄습니다.

    - 금리 경쟁력: 6개월 3.2%, 1년 3.5%의 확정 금리를 제공하여 시장 평균 수준의 안정적인 수익을 보장합니다.

    - 이용 편의성: 영업점 방문 없이 앱에서 즉시 가입하고 해지할 수 있는 완전한 디지털 프로세스를 제공합니다.


    큰 금액을 한꺼번에 예치하고 대면 상담이 반드시 필요하신 분께는 시중 은행이 적합할 수 있으나, 소액부터 효율적으로 자금을 굴리며 최상의 편의성을
    추구하시는 디지털 네이티브 고객님께는 미리내 정기예금이 더 나은 선택입니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: comparison
  source_authority: official
  placeholder: true
