- id: 3e669175-adca-5148-9c31-c07c95cfb690
  title: '미리내 체크카드: 처리가 끝나지 않거나 보류 중일 때'
  body: '카드 결제 후 거래 내역이 즉시 반영되지 않고 ''보류 중'' 또는 ''처리 중''으로 표시되는 경우, 다음 사항을 확인하십시오.


    [예상 원인]

    - 가맹점의 전산 처리 지연

    - 네트워크 통신 일시 오류

    - 해외 결제 시 국제 브랜드사의 승인 대기


    [확인 및 해결 순서]

    1. 계좌 잔액 확인: 결제 금액이 계좌에서 정상적으로 차감되었는지 확인하십시오. 잔액이 부족한 경우 결제가 보류될 수 있습니다.

    2. 시간 경과 후 재확인: 대부분의 일시적 지연은 1~3 영업일 이내에 확정 처리됩니다.

    3. 가맹점 확인: 가맹점에서 결제 취소 요청을 보냈는지 확인하십시오.


    [에스컬레이션 안내]

    위 조치 후에도 3 영업일 이상 상태가 변하지 않거나, 중복 결제가 의심되는 경우 상담원에게 요청하십시오. 당사 전문 상담원이 가맹점 및 카드사
    네트워크 조회를 통해 거래 상태를 추적하고, 필요 시 오결제 금액에 대한 환급 절차를 지원해 드리겠습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
