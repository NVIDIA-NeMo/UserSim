  institution_id: mirinae_bank
- id: 578fede1-2e87-52b6-a383-6463b1ea02b7
  title: '세이프박스: 부정사용으로부터 고객을 보호하기 위해'
  body: '미리내뱅크는 고객님의 소중한 자산을 안전하게 보호하기 위해 최선을 다하고 있습니다. 특히 세이프박스는 단기 자금을 효율적으로 관리하는
    상품인 만큼, 이를 겨냥한 금융사기 수법에 각별한 주의가 필요합니다.


    미리내뱅크는 어떠한 경우에도 고객님께 카드 번호, 비밀번호, CVV, 또는 주민등록번호 전체와 같은 민감한 정보를 요구하지 않습니다. 만약
    세이프박스 금리 혜택이나 한도 증액을 빌미로 이러한 정보를 요구하는 메시지나 전화를 받으신다면, 이는 전형적인 보이스피싱 및 스미싱 수법이므로
    즉시 중단하시기 바랍니다.


    이상 징후가 발견되거나 금융사기가 의심될 경우, 즉시 앱 내 고객센터를 통해 지급정지를 요청하십시오. 신속한 조치만이 피해를 최소화할 수 있는
    방법입니다. 아울러 세이프박스에 예치하신 금액은 예금자보호법에 따라 예금보험공사를 통해 1인당 원금과 이자를 합해 최대 1억원까지 보호되므로
    안심하고 이용하실 수 있습니다.


    자세한 위험 요소 및 보호 범위는 ''세이프박스: 위험 안내''를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
