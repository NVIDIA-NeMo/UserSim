- id: d7ac94ad-ec4f-5536-9e7d-8869f5b30f2a
  title: '미리내 입출금통장: 금리·요율이 정해지는 방식과 적용'
  body: '미리내 입출금통장의 금리 적용 방식에 대해 안내드립니다.


    - 적용 금리: 본 상품의 입출금통장 금리는 연 0.1%이며, 모든 고객과 모든 잔액 구간에 대해 동일하게 적용되는 단일 금리 체계입니다.

    - 금리 산정 및 지급: 금리는 매일의 최종 잔액에 대해 일할 계산되며, 정해진 이자 지급일에 합산되어 계좌로 입금됩니다.

    - 세금 적용: 지급되는 이자에서는 관련 법령에 따라 소득세와 지방소득세를 합산한 15.4%가 원천징수됩니다.

    - 변동 가능성: 금리는 시장 상황 및 은행의 금리 운영 정책에 따라 변경될 수 있으며, 변경 시 앱 공지사항을 통해 사전에 안내드립니다.'
