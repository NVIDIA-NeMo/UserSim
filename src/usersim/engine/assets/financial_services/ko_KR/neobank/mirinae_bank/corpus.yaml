  institution_id: mirinae_bank
- id: cda29337-f0d0-54e7-8f63-a6b81c5df167
  title: '미리내 정기예금: 수수료 안내'
  body: '미리내뱅크는 고객님의 금융 부담을 최소화하기 위해 ''수수료 제로'' 정책을 지향합니다. 미리내 정기예금 이용과 관련한 수수료는 다음과
    같습니다.


    - **상품 가입 수수료**: 0원

    - **계좌 유지 수수료**: 0원

    - **중도 해지 수수료**: 0원 (단, 중도 해지 시에는 약관에 따라 만기 금리보다 낮은 중도해지 이율이 적용됩니다.)


    기타 일반적인 수수료 안내는 [수수료·요금 안내]를 참고하시기 바랍니다.'
  domain: retail_banking
