- id: 0f032e50-f372-50d5-ad9d-efd83884cecd
  title: '미리내 체크카드: 수수료 안내'
  body: '미리내 체크카드의 적용 수수료 체계입니다. 고객 상담 시 아래의 정확한 수치를 안내하십시오.


    - 연회비: 0원

    - 해외 이용 시 국제브랜드 수수료율: 1%


    ※ 기타 국내 가맹점 이용 수수료는 고객에게 부과되지 않습니다. 국제 브랜드 이용 수수료는 외부 비용 발생에 따라 합리적인 수준으로 부과되는
