- id: 25701d13-5c01-56e0-aa24-b400a68668bc
  title: '미리내 입출금통장: 부정사용으로부터 고객을 보호하기 위해'
  body: '미리내뱅크는 고객님의 소중한 자산을 보호하기 위해 엄격한 보안 체계를 운영하고 있습니다. 미리내 입출금통장을 이용하시는 고객님께서는
    다음의 보안 지침을 반드시 확인하여 부정사용 피해를 예방하시기 바랍니다.


    미리내뱅크의 상담원은 계좌 정보 변경 등 상태 변경 작업 전, 고객님의 성함과 생년월일을 통해 본인 인증을 수행합니다. 하지만 그 외의 카드
    번호, 비밀번호, CVV, 주민등록번호와 같은 민감한 정보는 어떠한 경우에도 요구하지 않습니다. 만약 이러한 정보를 요구하는 연락을 받으셨다면
    이는 명백한 금융사기이므로 즉시 통화를 종료하십시오.


    보이스피싱이나 스미싱 등 전기통신금융사기 피해가 의심되거나 발생한 경우, 즉시 미리내뱅크 고객센터를 통해 지급정지를 요청하시고 피해구제 신청
    절차를 밟으십시오. 신속한 지급정지는 추가 피해를 막는 가장 효과적인 방법입니다. 모든 분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라
    공정하게 처리됩니다.'
