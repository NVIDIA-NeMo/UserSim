- id: eacf9273-6956-53cf-9c1a-7f79c50c8e06
  title: '모임통장: 가입부터 이용까지'
  body: '미리내뱅크 모임통장은 여러 사람이 투명하게 회비를 모으고 관리할 수 있도록 설계된 공동 관리 계좌입니다. 모바일 앱을 통해 쉽고 빠르게
    가입하고 이용하실 수 있습니다.


    [상품 핵심 정보]

    - 상품 성격: 공동 관리 입출금 계좌

    - 모임통장 최대 멤버 수: 100명

    - 입출금통장 금리: 0.1%

    - 수수료 정책: 주요 이체 및 ATM 수수료 0원 (단, 외부 비용이 발생하는 국제 브랜드 이용 수수료 등은 합리적인 수준에서 부과)

    - 예금자 보호: 예금보험공사를 통해 1인당 원금과 이자 합계 1억원까지 보호


    [이용 절차]

    1. 계좌 개설: 미리내뱅크 앱에서 비대면 실명확인(신분증 및 본인 명의 계좌 확인)을 통해 입출금통장을 먼저 개설하십시오.

    2. 모임통장 전환/생성: 개설된 계좌를 기반으로 모임통장 기능을 활성화하십시오.

    3. 멤버 초대: 앱 내 초대 기능을 통해 함께 회비를 관리할 멤버를 초대하십시오. 최대 100명까지 참여가 가능합니다.

    4. 회비 관리: 멤버들은 실시간으로 입출금 내역을 확인할 수 있으며, 모임주는 자금을 효율적으로 집행하고 관리합니다.


    더 자세한 수수료 관련 궁금증은 ''모임통장: 수수료와 비용'' 문서를 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 79695b04-1c2c-51a0-9a2e-645c1e54c501
  title: '모임통장: 수수료와 비용'
  body: '질문 1: 모임통장을 이용할 때 송금이나 ATM 출금 수수료가 있습니까?

    답변: 미리내뱅크는 고객님의 금융 부담을 최소화하는 ''수수료 제로'' 정책을 지향합니다. 이에 따라 주요 이체 및 ATM 수수료는 0원으로
    제공됩니다.


    질문 2: 모임통장에 예치한 금액에 대해 이자가 지급됩니까?

    답변: 네, 모임통장에는 입출금통장 금리 0.1%가 적용되어 소정의 이자가 지급됩니다.


    질문 3: 해외에서 사용할 때도 수수료가 0원입니까?

    답변: 아니오. 국제 브랜드 이용 수수료와 같이 외부 비용이 발생하는 경우에 한해 합리적인 수준의 수수료가 부과됩니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 99993488-6075-5dd9-96d5-d2c50d885b3e
  title: '모임통장: 등록 정보 변경'
  body: '모임통장의 등록된 정보(연락처, 주소 등)를 변경하는 절차를 안내해 드립니다. 모든 변경 작업은 보안을 위해 본인 확인 후 진행됩니다.


    [준비 사항]

    - 본인 명의의 스마트폰

    - 변경하고자 하는 정확한 정보


    [변경 단계]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 정보 변경이 가능합니다.

    2. 변경 요청: 변경이 필요한 등록 정보의 항목과 새로운 내용을 상세히 말씀해 주십시오.

    3. 내용 확인: 상담원이 변경될 내용을 다시 한번 복창하여 확인하며, 고객님께서 최종 승인하십시오.

    4. 완료 통보: 정보 변경이 시스템에 반영되면 완료 메시지를 받으시게 됩니다.


    [유의 사항]

    - 비밀번호, CVV, 주민등록번호 등 민감한 정보는 변경 대상이 아니며, 미리내뱅크는 이를 절대 요구하지 않습니다.

    - 본인 인증이 실패할 경우, 비대면 실명확인 절차를 다시 거쳐야 할 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 882ce52b-95d3-5e0a-b2fd-b1c491d9aeea
  title: '모임통장: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱을 통해 모임통장에 접속하려 할 때 로그인이 되지 않거나 화면이 멈추는 증상이 발생할 경우, 다음 순서에 따라 점검해 주십시오.


    [증상 및 확인 사항]

    1. 네트워크 연결 상태 확인

    - Wi-Fi 또는 모바일 데이터 연결이 불안정할 때 접속 오류가 발생할 수 있습니다. 네트워크 설정을 확인하거나 다른 네트워크로 전환하여
    접속을 시도하십시오.


    2. 앱 버전 업데이트 확인

    - 구버전 앱 사용 시 서버와의 호환성 문제로 로그인이 제한될 수 있습니다. 앱 스토어에서 최신 버전으로 업데이트되었는지 확인하십시오.


    3. 기기 등록 및 인증 상태 확인

    - 휴대폰을 교체하셨거나 앱을 재설치하신 경우, 기기 등록과 인증을 다시 수행해야 합니다. 앱 초기 화면의 [기기 등록] 절차를 통해 본인
    인증을 완료하십시오.


    [해결 방법]

    - 위 조치 후에도 접속이 불가한 경우, 상담원에게 증상을 말씀해 주십시오. 저희가 고객님의 계정 상태와 서버 접속 로그를 확인하겠습니다.


    [에스컬레이션]

    - 단순 접속 오류가 아닌 시스템 장애나 계정 잠금으로 판단될 경우, 내부 전문 기술 팀으로 사건을 이관하여 처리합니다. 처리 결과는 등록된
    연락처로 안내드리며, 통상 영업일 기준 1~3일 이내에 해결됩니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 07e5ca7f-61c4-590a-a87a-69bd5d70e72a
  title: '모임통장: 이용 조건별 차이'
  body: '모임통장의 역할 및 이용 조건에 따른 권한 차이는 다음과 같습니다.


    - 모임주: 계좌 개설 및 관리 권한 보유, 멤버 초대 및 강퇴 가능, 자금 출금 및 이체 가능

    - 멤버: 입출금 내역 실시간 조회 가능, 회비 입금 가능, 출금 권한 없음

    - 멤버 수 제한: 최대 100명까지 가입 가능 (101명부터는 가입 불가)

    - 금리 적용: 모든 참여자 및 계좌 잔액에 대해 입출금통장 금리 0.1% 적용'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: edbd47ce-4c94-50a3-b099-8bc4c3628936
  title: '모임통장: 상품 고르는 방법'
  body: '개인용 계좌와 공동 관리 계좌 사이에서 고민 중이시라면 다음 비교를 참고하십시오.


    - 미리내 입출금통장: 개인의 자산을 독립적으로 관리하며, 모든 거래 권한을 단독으로 갖습니다. 개인적인 저축과 지출 관리에 적합합니다.

    - 모임통장: 최대 100명의 멤버가 내역을 투명하게 공유합니다. 입출금통장 금리 0.1%를 제공하며, 회비 관리의 투명성이 필요한 동호회,
    친구 모임, 가족 모임에 최적화되어 있습니다.


    자산의 독립적 관리가 우선이라면 ''미리내 입출금통장: 상품 개요'' 상품을, 여러 사람과 함께 효율적으로 자금을 운영하고 싶으시다면 모임통장을
    선택하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 04147512-0c7c-56f7-b639-adfebd9e45bd
  title: '모임통장: 개인정보 처리 안내'
  body: '미리내뱅크는 개인정보 보호법 및 금융실명법을 엄격히 준수하여 모임통장 이용 고객님의 정보를 안전하게 관리합니다.


    1. 개인정보의 수집 및 이용

    모임통장 서비스 제공을 위해 모임주와 멤버의 성함, 생년월일, 연락처 등 최소한의 정보를 수집합니다. 이는 비대면 실명확인 및 서비스 제공을
    위한 필수 정보입니다.


    2. 정보의 공유 범위

    모임통장의 특성상, 모임에 참여한 멤버들은 계좌의 입출금 내역(거래 금액, 일시, 거래처 등)을 실시간으로 조회할 수 있습니다. 단, 멤버의
    개인정보 전체가 공유되는 것이 아니며, 서비스 운영에 필요한 범위 내에서만 정보가 노출됩니다.


    3. 개인정보의 보호 및 관리

    모든 개인정보는 암호화되어 저장되며, 금융위원회와 금융감독원의 감독 하에 엄격하게 관리됩니다. 주민등록번호는 법령이 허용하는 경우에만 처리하며,
    그 외의 민감 정보는 절대 수집하지 않습니다.


    4. 고객의 권리

    고객님은 언제든지 자신의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 또한 모임통장 해지 시 관련 법령에 따라 보존해야 하는 정보를
    제외한 모든 정보는 안전하게 파기됩니다.


    본 안내에 관한 상세 문의는 앱 내 고객센터를 통해 24시간 상담 가능합니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: f7e72a22-eca2-5aa0-aa15-3ccc7d0c528c
  title: '모임통장: 이 상품을 사칭한 사기 주의'
  body: '최근 미리내뱅크의 모임통장을 사칭하여 개인정보나 금융정보를 요구하는 금융사기가 발생하고 있습니다. 고객님께서는 다음의 주의 사항을
    반드시 확인하시어 소중한 자산을 보호하시기 바랍니다.


    미리내뱅크는 어떠한 경우에도 모임통장 가입이나 멤버 초대를 빌미로 고객님의 카드 비밀번호, CVV 번호, 주민등록번호 전체 또는 보안카드 번호를
    요구하지 않습니다. 만약 앱 외부의 링크(URL)를 통해 개인정보 입력을 유도하거나, 모임 관리자를 사칭하여 송금을 요청하는 메시지를 받으셨다면
    즉시 삭제하시고 대응하지 마십시오.


    만약 보이스피싱이나 스미싱 등 금융사기 피해가 의심되거나 이미 자금이 이체된 경우에는 지체 없이 미리내뱅크 고객센터를 통해 해당 계좌의 지급정지를
    요청하시고 피해구제 신청 절차를 진행하시기 바랍니다. 모든 분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됩니다.


    더 자세한 안전 수칙은 ''모임통장: 안전한 이용을 위한 수칙''을 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 778573a3-7ab9-540e-8347-6165e8fa1e9c
  title: '모임통장: 한도·제한과 유의사항'
  body: '본 문서는 모임통장 운용 시 적용되는 주요 한도와 제한 사항을 안내합니다. 상담원은 고객 응대 시 다음 내용을 정확히 전달하십시오.


    1. 멤버 수 제한: 모임통장에 가입하여 함께 내역을 공유할 수 있는 모임통장 최대 멤버 수는 100명입니다. 100명을 초과하는 인원은 멤버로
    초대할 수 없습니다.

    2. 예금자 보호: 본 상품은 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호받는 예금자보호 대상 상품입니다.

    3. 계좌 성격: 모임통장은 기존의 입출금 계좌를 기반으로 모임 기능을 추가한 서비스입니다. 따라서 기본적으로 입출금통장의 약관과 한도가 적용됩니다.

    4. 이용 제한: 금융사기 의심 거래가 감지되거나 금융실명법 위반 등의 사유가 있을 경우, 은행의 판단에 따라 입출금 거래가 제한될 수 있습니다.


    상세한 상품 구조는 ''모임통장: 상품 개요''에서 확인하실 수 있으며, 수수료 관련 내용은 ''모임통장: 수수료 안내''를 참조하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 94c3fa94-b922-51e9-a5e0-7d190ef32dd0
  title: '모임통장: 가입과 이용 조건'
  body: 'Q: 모임통장은 어떻게 가입하며, 조건이 어떻게 됩니까?

    A: 미리내뱅크 앱을 통해 비대면 실명확인 절차를 거치신 고객님이라면 누구나 가입하실 수 있습니다. 신분증 확인과 본인 명의 계좌 확인을 통해
    영업점 방문 없이 모바일 앱에서 즉시 개설이 가능합니다.


    Q: 모임 멤버로 참여하려면 어떤 조건이 필요한가요?

    A: 모임주로부터 초대 메시지를 받은 고객님으로서, 미리내뱅크 계좌를 보유하고 계셔야 합니다. 계좌가 없으신 경우 앱 내 안내에 따라 계좌를
    먼저 개설하신 후 참여하실 수 있습니다.


    가입 대상에 대한 더 자세한 기준은 ''모임통장: 가입 대상'' 문서를 확인해 주십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: faq
  source_authority: official
  placeholder: true
