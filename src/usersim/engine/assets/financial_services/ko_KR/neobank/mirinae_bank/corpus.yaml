- id: a94673f1-1de3-5d8a-b1c9-06f8f58658fa
  title: '미리내 입출금통장: 처리가 끝나지 않거나 보류 중일 때'
  body: '계좌 개설 신청이나 이체 요청 후 ''처리 중'' 또는 ''보류'' 상태가 지속될 때의 해결 방법입니다.


    **증상**

    - 앱 화면에 ''처리가 지연되고 있습니다''라는 메시지가 표시됨

    - 이체 요청 후 잔액은 차감되었으나 상대방 계좌에 입금이 확인되지 않음


    **원인 및 확인 사항**

    - 비대면 실명확인 과정에서 제출하신 신분증 이미지의 식별 불가

    - 금융 네트워크의 일시적인 통신 장애

    - 고액 거래 또는 이상 거래 탐지로 인한 내부 검토


    **해결 방법**

    1. 앱 내 ''알림함''을 확인하여 추가 서류 제출 요청이나 인증 실패 안내가 있는지 확인하십시오.

    2. 네트워크 상태를 확인하신 후 앱을 완전히 종료하고 다시 실행하여 상태를 확인하십시오.

    3. 문제가 지속될 경우 상담원에게 요청하십시오. 저희가 내부 에스컬레이션 경로를 통해 전문 상담원이 처리 내용을 확인하고 결과를 안내해 드리겠습니다.


    처리 결과는 앱 내 푸시 알림 또는 등록된 연락처로 개별 안내됩니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 1e2fcf2d-efa7-50a6-9377-5278eef625fe
  title: '미리내 입출금통장: 가입 대상'
  body: '미리내 입출금통장의 가입 가능 조건은 다음과 같습니다.


    - 실명 확인 가능 여부: 금융실명법에 따른 비대면 실명확인 완료 시 가입 가능

    - 본인 명의 계좌 보유: 본인 인증을 위한 타행 계좌 보유 시 가입 가능

    - 거주지 및 국적: 대한민국 국적의 개인 고객


    가입 시 신분증 확인과 본인 명의 계좌 확인 등의 절차가 반드시 필요하며, 이를 통해 영업점 방문 없이 모바일 앱으로 본인을 인증해야 합니다.'
