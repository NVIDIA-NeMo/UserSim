- id: cdc11834-0448-5f2d-b4e7-90e6980c7f35
  title: '미리내 정기예금: 전환이나 상위 상품을 고려할 때'
  body: '고객님이 자금 운용 목적에 따라 ''미리내 정기예금''과 ''세이프박스'' 사이에서 고민하실 때 다음과 같이 안내하십시오.


    - 수익성과 안정성 우선: ''미리내 정기예금''이 유리합니다. 6개월(3.2%) 또는 1년(3.5%) 동안 자금을 묶어두는 대신 더 높은
    금리를 제공받을 수 있습니다.

    - 유동성과 편의성 우선: ''세이프박스''가 적합합니다. 하루만 맡겨도 2%의 금리를 제공하며, 언제든 자유롭게 입출금이 가능하여 단기 자금
    관리에 효율적입니다.


    결론적으로, 당분간 사용 계획이 없는 목돈을 굴려 확실한 수익을 얻고자 하신다면 ''미리내 정기예금''을, 비상금처럼 언제든 꺼내 써야 하지만
    기본 금리보다는 높은 수익을 원하신다면 ''세이프박스''를 추천하십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: comparison
  source_authority: official
