- id: 2ca08a3f-ea6e-51cc-bc92-a6fb56045f4f
  title: '세이프박스: 세이프박스 금리 안내'
  body: 'Q: 세이프박스의 금리는 어떻게 적용되며 언제 지급됩니까?

    A: 세이프박스는 연 2%의 금리를 제공하며, 매일의 최종 잔액에 대해 이자가 계산됩니다. 계산된 이자는 정해진 지급일에 고객님의 연결 계좌로
    자동 지급됩니다.


    Q: 보관 금액이 많아지면 금리가 변동됩니까?

    A: 아니오, 세이프박스는 최대 보관 금액인 100,000,000원까지 동일하게 연 2%의 금리를 적용합니다. 금액에 관계없이 일관된 혜택을
    누리십시오. 상세 내용은 ''세이프박스: 상품설명서 주요 내용''을 참고하시기 바랍니다.'
  domain: retail_banking
