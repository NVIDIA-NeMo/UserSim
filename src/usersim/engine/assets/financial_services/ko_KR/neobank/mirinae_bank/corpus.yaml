  institution_id: mirinae_bank
- id: 8285939b-e79a-569c-b758-0934f9d831a5
  title: invite_group_member 사용 기준
  body: '상담원은 모임주가 모임통장에 새로운 멤버를 초대하고자 할 때 다음 절차를 따르십시오.


    1. 모임주 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 사용하여 멤버를 초대하려는 모임통장의 `account_id`를 확인합니다.

    3. 초대할 멤버의 성함과 연락처 정보를 확인합니다.

    4. 확인된 `account_id`와 멤버 정보를 바탕으로 `invite_group_member` 도구를 호출하여 초대를 발송합니다.


    초대받은 멤버는 내역 조회가 가능하며, 출금 권한은 모임주에게만 있다는 점을 안내하십시오. 상세 내용은 ''모임통장: 상품 개요''를 참고하십시오.'
  domain: retail_banking
  product_category: procedure
