- id: e18afe13-7677-5345-adc8-42c625e81fbd
  title: '미리내 정기예금: 최소 가입 금액 안내'
  body: 'Q: 미리내 정기예금에 가입하려면 최소 얼마가 필요한가요?

    A: 미리내 정기예금의 최소 가입 금액은 10,000원입니다. 10,000원부터 가입이 가능하므로 소액으로도 안정적인 저축을 시작하실 수 있습니다.


    Q: 최소 금액 이상이면 얼마까지 가입할 수 있나요?

    A: 가입 가능 최대 금액은 고객님의 앱 내 한도 설정 및 계좌 상태에 따라 다를 수 있습니다. 자세한 내용은 ''미리내 정기예금: 가입부터
    이용까지''에서 확인해 주십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 871b8c01-904c-5d13-902c-95dc99314036
  title: '미리내 정기예금: 등록 정보 변경'
  body: '미리내 정기예금 계좌와 연결된 등록 정보를 변경하는 절차를 안내해 드립니다. 모든 변경 작업은 보안을 위해 엄격한 본인 인증 후 처리됩니다.


    [준비 사항]

    - 본인 명의의 스마트폰 및 미리내뱅크 앱 설치 완료 상태


    [변경 단계]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 성함과 생년월일이 일치해야 다음 단계로 진행할 수 있습니다.

    2. 변경 요청 사항 전달: 변경하시고자 하는 정보(예: 연락처, 주소 등)와 정확한 변경 내용을 말씀해 주십시오.

    3. 정보 수정 처리: 요청하신 내용을 바탕으로 시스템 내 등록 정보를 수정합니다. 이때 비밀번호, CVV, 주민등록번호와 같은 민감 정보는
    절대 요구하지 않으니 주의하시기 바랍니다.

    4. 처리 결과 확인: 정보 변경이 완료되면 앱 내 알림 또는 상담원을 통해 최종 변경 완료 여부를 확인받으실 수 있습니다.


    [확인 사항]

    - 변경이 완료된 후에는 앱의 마이페이지 또는 계좌 상세 정보 화면에서 수정된 내용을 직접 확인하실 수 있습니다. 만약 정보가 올바르게 반영되지
    않았다면 즉시 다시 요청해 주십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 7a9485c1-576b-51e4-ac07-f208b603be75
  title: '미리내 정기예금: 로그인하거나 접속할 수 없을 때'
  body: '미리내 정기예금 계좌 조회를 위해 앱에 접속하려 했으나 로그인이 되지 않거나 접속 오류가 발생하는 경우, 다음 순서에 따라 조치해
    주십시오.


    [증상 확인 및 원인]

    - 로그인 버튼 클릭 후 반응이 없거나 ''인증 오류'' 메시지가 표시되는 경우

    - 휴대폰 기기 변경 후 기존 인증 정보가 유효하지 않은 경우


    [해결 방법]

    1. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인해 주십시오. 비행기 모드가 켜져 있지는 않은지 체크하십시오.

    2. 앱 업데이트 확인: 사용 중인 미리내뱅크 앱이 최신 버전인지 확인하십시오. 구버전의 경우 보안 정책으로 인해 접속이 제한될 수 있습니다.

    3. 기기 재등록 수행: 휴대폰을 교체하셨다면 새로운 기기에 대한 등록과 인증 절차가 필요합니다. 앱의 초기 화면에서 ''기기 등록/인증''
    메뉴를 통해 본인 인증을 다시 진행해 주십시오.


    [에스컬레이션 안내]

    위의 조치 후에도 여전히 접속이 불가능한 경우, 전문 상담원이 계좌 상태와 시스템 로그를 분석해야 합니다. 상담원에게 상황을 말씀해 주시면
    내부 에스컬레이션 경로를 통해 전문 기술 팀으로 이관하여 처리해 드리겠습니다. 이 과정에서 본인 확인을 위해 성함과 생년월일 확인 절차가 다시
    진행될 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: d424466c-3f23-5579-83bb-e3564af84b9b
  title: '미리내 정기예금: 이용 조건별 차이'
  body: '미리내 정기예금의 가입 조건 및 기간 설정에 따른 적용 혜택 차이입니다.


    | 구분 | 조건 | 적용 결과 |

    | :--- | :--- | :--- |

    | 가입 가능 금액 | 10,000원 이상 예치 | 가입 가능 |

    | 가입 가능 금액 | 10,000원 미만 예치 | 가입 불가 |

    | 예치 기간 설정 | 6개월 선택 | 6개월 정기예금 금리 3.2% 적용 |

    | 예치 기간 설정 | 1년 선택 | 1년 정기예금 금리 3.5% 적용 |

    | 예금 보호 대상 | 모든 가입자 | 1인당 원금과 이자 합해 1억원까지 보호 |'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 294dbc1b-c313-5da3-8197-64ca5609d43f
  title: '미리내 정기예금: 상품 고르는 방법'
  body: '자금 운용 계획에 맞는 최적의 상품을 선택해 보십시오.


    - 단기 운용(6개월): 연 3.2%의 금리가 적용됩니다. 비교적 짧은 기간 동안 자금을 묶어두고 안정적인 수익을 원하시는 분께 적합합니다.

    - 중기 운용(1년): 연 3.5%의 금리가 적용됩니다. 6개월 상품보다 더 높은 수익률을 추구하며 1년 정도 자금 사용 계획이 없는 분께
    추천합니다.

    - 초단기 유동성 필요: 만약 하루만 맡겨도 이자가 붙는 상품을 원하신다면 ''세이프박스: 상품 개요''를 확인하십시오.


    미리내 정기예금은 최소 가입 금액 10,000원으로 누구나 부담 없이 시작할 수 있는 상품입니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 27a416d9-a966-51ba-9ab2-7aeef7979c99
  title: '미리내 정기예금: 개인정보 처리 안내'
  body: '미리내뱅크는 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 소중한 정보를 관리합니다. 미리내 정기예금 이용 시 발생하는
    개인정보 처리 사항을 안내드립니다.


    [개인정보 수집 및 이용 목적]

    - 금융실명법에 따른 실명 확인 및 계좌 개설

    - 정기예금 가입 심사, 계약 체결, 유지 및 만기 시 이자 지급

    - 금융감독원 및 금융위원회 등 감독기관의 요구에 따른 보고 및 감사

    - 보이스피싱 등 금융사기 방지를 위한 본인 확인 및 거래 모니터링


    [수집 항목 및 보유 기간]

    - 수집 항목: 성함, 생년월일, 연락처, 신분증 정보, 본인 명의 계좌 정보 등

    - 보유 기간: 관계 법령(금융회사 등의 내부통제기준 등)에서 정한 보존 기간까지 보관하며, 목적 달성 후 또는 법적 보존 기간 종료 후 지체
    없이 파기합니다.


    [고객님의 권리]

    고객님은 언제든지 자신의 개인정보에 대한 열람, 정정, 삭제를 요청하실 수 있습니다. 또한, 개인정보 처리 방침에 대한 동의를 철회할 권리가
    있습니다. 단, 법령상 의무 준수를 위해 필요한 경우 일부 정보의 처리가 제한될 수 있습니다.


    [안전성 확보 조치]

    미리내뱅크는 개인정보의 분실, 도난, 유출, 변조 또는 훼손을 방지하기 위해 암호화 기술 적용 및 접근 권한 제한 등 기술적·관리적 보호 조치를
    시행하고 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: c30a1e61-be8c-566a-ac62-50aaacd219d9
  title: '미리내 정기예금: 이 상품을 사칭한 사기 주의'
  body: '최근 미리내뱅크의 ''미리내 정기예금''을 사칭하여 고금리 상품 가입을 유도하거나, 개인정보를 요구하는 금융사기가 발생하고 있습니다.
    고객님께서는 다음의 주의 사항을 반드시 확인하시어 소중한 자산을 보호하시기 바랍니다.


    미리내뱅크는 어떠한 경우에도 고객님의 비밀번호, 카드 번호, CVV, 주민등록번호 전체를 요구하지 않습니다. 특히 ''특별 금리 적용''이나
    ''가입 승인''을 빌미로 외부 링크 접속을 유도하거나, 특정 계좌로의 송금을 요청하는 행위는 100% 사기이므로 절대 응하지 마십시오.


    본 상품의 공식 금리는 6개월 가입 시 3.2%, 1년 가입 시 3.5%이며, 이 외의 비정상적인 고금리를 제시하며 접근하는 경우 즉시 의심하셔야
    합니다. 만약 보이스피싱이나 스미싱으로 의심되는 상황이 발생했거나 이미 피해를 입으셨다면, 즉시 미리내뱅크 고객센터를 통해 지급정지를 요청하시고
    피해구제 신청 절차를 밟으십시오. 신속한 대응만이 피해를 최소화할 수 있는 유일한 방법입니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: fa507732-647b-52c5-9285-7cb7e73897f2
  title: '미리내 정기예금: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객 안내 시 참고해야 할 ''미리내 정기예금''의 주요 한도 및 법적 제한 사항을 다룹니다.


    1. 가입 금액 한도

    - 최소 가입 금액: 10,000원부터 가입이 가능합니다.

    - 최대 가입 금액: 별도의 상한선은 없으나, 예금자 보호 한도를 고려하여 안내하십시오.


    2. 적용 금리 및 기간

    - 6개월 만기 상품: 연 3.2%의 금리가 적용됩니다.

    - 1년 만기 상품: 연 3.5%의 금리가 적용됩니다.


    3. 예금자 보호 및 세금

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 최대 1억원까지 보호됩니다.

    - 원천징수: 발생한 이자에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수된 후 지급됩니다.


    4. 유의사항

    - 본 상품은 정해진 기간 동안 자금을 예치하는 상품으로, 만기 전 중도 해지 시 약정 금리보다 낮은 중도해지 금리가 적용되어 수익률이 낮아질
    수 있음을 명확히 안내하십시오. 또한, 금융실명법에 따라 비대면 실명확인 절차가 완료된 고객만 가입할 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 9b3f0cfe-cb0d-562c-aa25-e0250bbc0656
  title: '미리내 정기예금: 수수료와 비용'
  body: 'Q: 미리내 정기예금에 가입하거나 유지할 때 발생하는 수수료가 있습니까?


    A: 아니오, 없습니다. 미리내뱅크는 고객의 금융 부담을 최소화하는 ''수수료 제로'' 정책을 지향합니다. 따라서 ''미리내 정기예금''의
    계좌 개설, 유지 및 만기 해지 과정에서 발생하는 별도의 수수료는 전혀 없습니다.


    Q: 이자 지급 시 비용이 차감된다고 하는데 어떤 비용인가요?


    A: 이는 수수료가 아니라 법정 세금입니다. 관련 법령에 따라 이자 소득에 대해 15.4%의 세율로 소득세와 지방소득세가 원천징수된 후 나머지
    금액이 지급됩니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 2ed5e929-b3de-5758-a933-467005ac22dc
  title: '미리내 정기예금: 진행 상황과 내역 확인'
  body: '가입하신 ''미리내 정기예금''의 현재 잔액과 누적 이자, 만기 예정일을 확인하는 방법은 다음과 같습니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일 정보가 필요합니다.


    1. 본인 확인 단계

    상담원에게 성함과 생년월일을 말씀해주십시오. 본인 인증이 완료되어야 계좌 정보 조회가 가능합니다.


    2. 계좌 목록 조회 요청

    현재 보유하고 계신 전체 계좌 목록 조회를 요청하십시오. 그러면 상담원이 고객님의 계좌 리스트를 확인합니다.


    3. 해당 상품 선택

    목록 중 ''미리내 정기예금'' 계좌를 선택하여 상세 내역 조회를 요청하십시오.


    4. 상세 정보 확인

    상담원이 다음의 정보를 안내해 드립니다.

    - 현재 예치된 원금

    - 현재까지 쌓인 누적 이자 (세전/세후)

    - 상품의 만기일 및 만기 시 예상 수령액


    위 절차를 통해 고객님께서는 앱에 접속하지 않고도 현재 정기예금의 진행 상황을 명확히 확인하실 수 있습니다.'
