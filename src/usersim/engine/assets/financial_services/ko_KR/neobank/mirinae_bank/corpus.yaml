  institution_id: mirinae_bank
- id: c904470f-a78e-5c85-9147-1874876bddaa
  title: '미리내 체크카드: 추천·장기 이용 혜택'
  body: 미리내뱅크와 함께하는 스마트한 금융 생활을 시작하십시오. 미리내 체크카드를 이용하시면 연회비 0원의 부담 없는 혜택과 더불어, 결제
    시마다 0.5%의 캐시백을 지속적으로 제공받으실 수 있습니다. 주변 지인에게 미리내뱅크의 혁신적인 서비스를 추천하고, 장기적으로 쌓이는 캐시백
    혜택을 통해 실질적인 금융 이익을 누려보시기 바랍니다. 디지털 네이티브를 위한 최적의 선택, 지금 바로 경험하십시오.
  domain: cards
  product_category: mirinae_check
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: e6be95c4-dcbd-5be5-a372-69b66b801d93
  title: '미리내 체크카드: 안전한 이용을 위한 수칙'
  body: '미리내 체크카드를 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 민감 정보 요구 주의: 미리내뱅크는 어떠한 경우에도 고객님의 카드 비밀번호, CVV 번호, 주민등록번호 전체를 전화나 문자 메시지로 요구하지
    않습니다. 이러한 정보를 요구하는 연락을 받으셨다면 즉시 중단하십시오.


    2. 부정사용 즉시 신고: 카드를 분실하거나 도난당한 사실을 인지하신 경우, 즉시 앱을 통해 사용 정지를 신청하거나 고객센터로 신고하여 주십시오.
    신고 전후의 부정사용 보상은 관련 법령과 약관에 따라 처리되나, 비밀번호를 타인에게 알려주는 등 고객의 고의나 중대한 과실이 있을 경우 보상이
    제한될 수 있습니다.


    3. 금융사기 대응: 보이스피싱이나 스미싱이 의심되는 거래가 발생했다면 즉시 지급정지를 요청하십시오. 미리내뱅크는 금융감독원 금융분쟁조정위원회의
    기준에 따라 신속하고 공정하게 처리해 드립니다.


    4. 본인 확인 절차: 계좌 정보 변경 등 상태 변경 작업 시, 상담원은 고객님의 성함과 생년월일을 통해 본인 인증을 수행합니다. 이 외의
    과도한 개인정보 요구는 의심하시기 바랍니다.'
  domain: cards
  product_category: mirinae_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 984c635b-d532-5922-8aed-f3bd205f85fd
  title: '미리내 체크카드: 약관 변경 안내'
  body: '미리내 체크카드의 이용 약관 변경 사항을 안내드립니다. 본 안내는 고객님께서 타사 상품과 비교하여 최선의 선택을 하실 수 있도록 투명하게
    제공됩니다.


    [주요 약관 및 혜택 유지 사항]

    - 연회비: 본 상품은 고객의 금융 부담 최소화를 위해 연회비 0원 정책을 유지합니다.

    - 캐시백 제공: 결제 시 제공되는 0.5%의 캐시백 비율은 약관에 근거하여 객관적으로 제공되며, 서비스 운영 정책에 따라 변경될 수 있습니다.
    변경 시 앱 내 공지사항을 통해 사전 안내드립니다.

    - 해외 이용 수수료: 국제 브랜드 이용 수수료율 1%는 외부 비용 발생에 따른 합리적 수준으로 부과됩니다.


    [의무 및 권리]

    - 고객은 체크카드 사용 시 연결된 예금계좌의 잔액 범위 내에서만 사용할 수 있습니다.

    - 은행은 금융위원회와 금융감독원의 감독을 준수하며, 개인정보 보호법 및 금융실명법을 엄격히 적용하여 고객의 자산을 관리합니다.

    - 약관의 변경은 변경 적용일 1개월 전까지 앱 내 공지 및 개별 통지를 통해 안내하며, 고객께서 이에 동의하지 않으실 경우 계약을 해지하실
    수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 3229b086-0743-584e-94d6-18fa16b4a979
  title: '미리내 체크카드: 가입부터 이용까지'
  body: '상담원은 다음 내용을 바탕으로 고객의 미리내 체크카드 가입 및 이용 과정을 안내하십시오.


    [1. 가입 프로세스]

    - 사전 요건: 미리내 입출금통장 계좌가 보유되어 있어야 합니다. 계좌가 없는 경우 ''미리내 입출금통장: 가입과 이용 시작'' 절차를 먼저
    안내하십시오.

    - 신청 방법: 모바일 앱 내 카드 신청 메뉴에서 본인 인증 후 신청하며, 비대면 실명확인 절차를 거칩니다.


    [2. 핵심 혜택 및 비용]

    - 연회비: 0원 (고객 부담 없음)

    - 기본 혜택: 결제 시 0.5%의 캐시백 제공

    - 해외 이용: 국제 브랜드 이용 시 1%의 수수료율 적용


    [3. 이용 한도 및 설정]

    - 기본 이용 한도: 하루 이용한도는 기본적으로 6,000,000원으로 설정되어 있습니다.

    - 한도 변경: 고객은 앱을 통해 이용한도를 직접 변경할 수 있습니다.


    [4. 주요 특징]

    - 체크카드 특성상 결제 즉시 연결 계좌에서 대금이 출금되므로 잔액 관리가 필요함을 안내하십시오.

    - 연말정산 시 총급여의 25%를 초과하는 사용 금액에 대해 30%의 소득공제율이 적용됨을 안내하십시오.'
  domain: cards
  product_category: mirinae_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 3bfcb434-632d-5fef-a2fa-67b317ec76b6
  title: '미리내 체크카드: 해외 이용 시 국제브랜드 수수료율 안내'
  body: 'Q: 미리내 체크카드를 해외에서 사용할 때 발생하는 수수료는 얼마입니까?


    A: 미리내 체크카드로 해외 가맹점을 이용하실 경우, 국제 브랜드 이용 수수료율 1%가 적용됩니다. 이는 비자(VISA)나 마스터카드(Mastercard)
    등 국제 브랜드사에서 부과하는 외부 비용을 반영한 합리적인 수준의 수수료입니다. 자세한 수수료 체계는 ''미리내 체크카드: 수수료 안내''에서
    확인하실 수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: af43052c-1de7-5672-98d4-7c1f5bd291c5
  title: '미리내 체크카드: 등록 정보 변경'
  body: '미리내 체크카드에 등록된 고객 정보(연락처, 주소 등)를 변경하는 절차를 안내해 드립니다.


    [준비 사항]

    - 본인 명의의 스마트폰 및 미리내뱅크 앱


    [변경 단계]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오. 상담원이 이를 통해 본인 인증을 수행합니다.

    2. 변경 요청: 변경하고자 하는 정보(예: 변경될 전화번호 또는 주소)를 정확히 말씀해 주십시오.

    3. 정보 업데이트: 상담원이 요청하신 정보를 시스템에 반영합니다. 이때 카드 번호, 비밀번호, CVV 등 민감 정보는 절대 요구하지 않으므로
    주의하십시오.

    4. 최종 확인: 정보 변경이 완료되었다는 상담원의 안내를 받으시면 모든 절차가 끝납니다.


    [완료 확인]

    - 변경 완료 후 모바일 앱의 [내 정보 관리] 메뉴에서 업데이트된 내용을 직접 확인하실 수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 675b13b2-646a-5070-8908-a575a2730969
  title: '미리내 체크카드: 로그인하거나 접속할 수 없을 때'
  body: '미리내뱅크 앱에 접속하여 체크카드 내역을 확인하려 할 때 로그인이 되지 않는 경우, 다음 순서에 따라 조치하십시오.


    [증상 및 원인 확인]

    - 증상: 로그인 버튼 클릭 시 반응이 없거나, ''인증 오류'' 메시지가 출력되며 접속이 되지 않음.

    - 원인: 네트워크 불안정, 앱 버전 업데이트 필요, 또는 기기 변경 후 인증 정보 미갱신.


    [해결 방법]

    1. 네트워크 상태 점검: Wi-Fi 연결을 해제하고 LTE/5G 데이터 모드로 다시 시도해 보십시오.

    2. 앱 최신 버전 확인: 앱스토어 또는 구글 플레이스토어에서 최신 버전으로 업데이트되어 있는지 확인하십시오.

    3. 기기 등록 재인증: 휴대폰을 최근에 변경하셨다면, 기존 기기 등록 정보를 해제하고 새로운 기기에서 인증 절차를 다시 진행해야 합니다.


    [전문 상담원 에스컬레이션]

    위의 조치 후에도 접속이 불가한 경우, 저희 상담원에게 상황을 말씀해 주십시오. 상담원은 고객님의 계정 상태를 확인한 후, 내부 전문 기술
    팀으로 사례를 이관하여 접속 제한 원인을 분석하고 해결 방안을 안내해 드리겠습니다. 처리 결과는 등록된 연락처로 개별 통지됩니다.'
  domain: cards
  product_category: mirinae_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: c8fc20de-50d1-55c6-85a4-caef546b2c16
  title: '미리내 체크카드: 이용 조건별 차이'
  body: '| 구분 | 조건 | 적용 결과 |

    | :--- | :--- | :--- |

    | 가입 가능 여부 | 미리내 입출금통장 보유 | 카드 발급 신청 가능 |

    | 가입 가능 여부 | 입출금통장 미보유 | 통장 개설 후 신청 가능 |

    | 기본 이용 한도 | 초기 발급 고객 | 하루 이용한도 6,000,000원 적용 |

    | 이용 한도 변경 | 고객 요청 시 | 앱을 통해 한도 상향 또는 하향 가능 |'
  domain: cards
  product_category: mirinae_check
  document_type: eligibility_matrix
  source_authority: official
