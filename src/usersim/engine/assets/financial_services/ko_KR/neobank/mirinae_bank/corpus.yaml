- id: 01b572bd-1edb-5714-aeb3-4858f55aa7a4
  title: '미리내 입출금통장: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 안내'
  body: '질문: 타행으로 송금할 때 수수료가 발생하나요?


    답변: 아니요, 발생하지 않습니다. 미리내 입출금통장을 이용하시는 고객님께서는 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 혜택을 누리실
    수 있습니다. 횟수나 금액 제한 없이 자유롭게 송금하시기 바랍니다.


    더 자세한 수수료 정보는 ''미리내 입출금통장: 수수료 안내''에서 확인하실 수 있습니다.'
