- id: 18935350-22a7-54b2-9c8b-87d9dc77fc3a
  title: '모임통장: 진행 중인 이벤트'
  body: '**[이벤트] 모임통장 멤버 초대 혜택 안내**


    더 많은 분과 함께 투명한 금융 생활을 시작하십시오! 모임통장 멤버 초대 이벤트를 진행합니다.


    - **이벤트 기간**: 2026년 1월 1일부터 2026년 3월 31일까지

    - **참여 방법**: 모임주가 멤버를 초대하고, 초대받은 멤버가 모임통장 가입을 완료하십시오.

    - **제공 혜택**: 멤버 가입 완료 시마다 모임통장 계좌로 5,000원을 지급해 드립니다.

    - **유의 사항**: 미리내뱅크 신규 가입 멤버에 한해 적용되며, 모임당 최대 10명까지 혜택을 받으실 수 있습니다.


    지금 바로 ''모임통장: 가입과 이용 시작'' 절차를 통해 소중한 분들을 초대해 보십시오.'
