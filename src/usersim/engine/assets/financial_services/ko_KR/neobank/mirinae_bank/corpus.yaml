  institution_id: mirinae_bank
- id: 4fe9362a-1415-5fb9-9150-1c1f94b3db8c
  title: '미리내 입출금통장: 가입부터 이용까지'
  body: '상담원분들께서는 고객님이 미리내 입출금통장에 가입하고 이용하는 전체 과정을 다음과 같이 안내해 주십시오.


    [1. 가입 단계: 비대면 실명확인]

    고객님은 영업점 방문 없이 모바일 앱을 통해 가입 절차를 진행합니다. 신분증 확인과 본인 명의의 타행 계좌 확인 등을 통한 비대면 실명확인
    절차를 거쳐야 하며, 금융실명법에 따라 실명 확인이 완료된 후 계좌가 개설됩니다.


    [2. 상품 주요 혜택 안내]

    - 금리: 입출금통장 금리 연 0.1%가 적용됩니다.

    - 수수료 혜택: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 및 ATM 출금 수수료 0원으로 이용 가능함을 강조하십시오.

    - 예금 보호: 예금보험공사를 통해 1인당 최대 1억원까지 보호되는 안전한 상품입니다.


    [3. 이용 및 관리]

    - 모든 거래는 모바일 앱을 통해 이루어집니다.

    - 고객님이 계좌 정보 변경 등의 상태 변경 작업을 요청할 경우, 반드시 성함과 생년월일을 확인하여 본인 인증을 수행하십시오.

    - 비밀번호나 CVV 등 민감 정보는 절대 요구해서는 안 됩니다.


    [4. 사후 지원]

    이용 중 불편함이 발생하거나 보이스피싱 등의 사고가 의심될 경우, 즉시 지급정지 조치를 안내하고 내부 에스컬레이션 경로를 통해 전문 상담원에게
    연결하십시오.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: product_sheet
  source_authority: official
