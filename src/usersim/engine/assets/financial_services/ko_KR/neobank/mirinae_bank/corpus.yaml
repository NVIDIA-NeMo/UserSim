  institution_id: mirinae_bank
- id: 36581e89-3dfa-5b1b-be62-b7f6e4000386
  title: '모임통장: 진행 상황과 내역 확인'
  body: '모임통장의 잔액과 멤버들의 입금 내역을 확인하는 방법은 다음과 같습니다.


    **준비 사항**

    - 미리내뱅크 모바일 앱 설치 및 로그인


    **확인 절차**

    1. 앱 메인 화면의 계좌 목록에서 관리 중이거나 참여 중인 ''모임통장''을 선택하십시오.

    2. 화면 상단에서 현재 모임의 총 잔액과 본인의 기여도를 확인하십시오.

    3. ''내역 보기'' 탭을 선택하여 누가, 언제, 얼마를 입금하거나 출금했는지 상세 거래 내역을 확인하십시오.

    4. 특정 멤버의 입금 여부를 확인하시려면 내역 상단의 필터 기능을 통해 멤버별로 조회하실 수 있습니다.


    **확인 완료**

    - 거래 일시, 입금자명, 금액이 포함된 리스트가 화면에 표시되면 정상적으로 확인된 것입니다.


    거래 내역에 대해 궁금한 점이 있으신 경우 ''모임통장: 명세서나 내역과 맞지 않을 때''를 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: how_to_guide
  source_authority: official
