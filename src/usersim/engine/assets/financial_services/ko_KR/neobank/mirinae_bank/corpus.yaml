- id: b0869fb1-0666-54aa-86a4-7d890e860720
  title: '모임통장: 이용 방법과 절차'
  body: 'Q: 모임 멤버를 어떻게 초대하나요?

    A: 모임통장 상세 화면의 ''멤버 초대'' 버튼을 누르신 후, 카카오톡이나 문자 메시지를 통해 초대 링크를 보내실 수 있습니다. 초대를 받은
    분이 링크를 통해 수락하면 멤버로 등록됩니다.


    Q: 모임 멤버가 되면 무엇을 할 수 있나요?

    A: 멤버는 모임통장의 실시간 잔액과 전체 거래 내역을 조회할 수 있습니다. 다만, 직접적인 출금이나 이체 권한은 모임주에게만 부여됩니다.


    Q: 멤버를 제외하거나 모임주를 변경할 수 있나요?

    A: 모임주는 언제든지 멤버를 제외할 수 있습니다. 모임주 변경의 경우, 보안 및 책임 소재 확인을 위해 고객센터를 통한 본인 인증 후 처리
    가능합니다.


    상세한 이용 절차는 ''모임통장: 자주 하는 업무의 처리 절차''를 참고하십시오.'
  domain: retail_banking
