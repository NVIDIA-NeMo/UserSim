- id: 66f1b1c7-9f54-57fe-af4e-a8b0a2e22af7
  title: '미리내 정기예금: 필요 서류'
  body: '미리내 정기예금 가입을 위해 필요한 조건 및 서류 안내입니다.


    - 비대면 실명확인: 주민등록증 또는 운전면허증 (앱을 통한 촬영 및 인증 필요)

    - 본인 명의 계좌: 타행 또는 당행의 본인 명의 계좌 (1원 인증 등 계좌 확인 절차 필요)

    - 최소 가입 금액: 10,000원 이상의 예치금

    - 대상 고객: 미리내뱅크 입출금통장을 보유한 실명 확인 완료 고객'
