  institution_id: mirinae_bank
- id: 8c47ea09-4e99-56c4-8a55-80d2536e2a1c
  title: '세이프박스: 수수료 안내'
  body: '미리내뱅크는 고객님의 금융 부담을 최소화하는 ''수수료 제로'' 정책을 시행하고 있습니다. 세이프박스 이용과 관련한 수수료 체계는
    다음과 같습니다.


    - 세이프박스 개설 수수료: 0원

    - 세이프박스 내 자금 입금(입출금통장 → 세이프박스): 0원

    - 세이프박스 내 자금 출금(세이프박스 → 입출금통장): 0원

    - 세이프박스 해지 수수료: 0원


    세이프박스와 연결된 입출금통장에서 발생하는 일반 이체 및 ATM 수수료 또한 기본적으로 0원으로 제공됩니다.'
