- id: 03bffc69-b6a6-5953-8d03-f0d33cd76d8a
  title: '모임통장: 명세서나 내역과 맞지 않을 때'
  body: '모임통장의 거래 내역이나 잔액이 실제 기록과 다르다고 판단될 때의 처리 지침입니다. 상담원은 다음 순서로 대응하십시오.


    **증상: 고객이 특정 입금 내역이 누락되었거나 출금 금액이 잘못되었다고 주장함**


    1. 거래 일시 및 정확한 금액 확인: 고객이 주장하는 거래의 정확한 날짜, 시간, 금액, 상대방 계좌번호를 확인하십시오.

    2. 실시간 내역 대조: 앱 내 거래 내역과 은행 내부 원장을 대조하여 전산상 오류가 있는지 확인하십시오.

    3. 미처리 거래 확인: 이체 중 ''처리 중'' 상태로 머물러 있거나, 타행 송금 시 상대행의 처리 지연으로 인해 반영이 늦어지는 경우인지
    확인하십시오.

    4. 중복 입금 여부 확인: 동일한 금액이 짧은 시간 내에 여러 번 입금되어 착오가 생긴 것인지 확인하십시오.


    **해결 및 에스컬레이션**

    - 단순 조회 오류인 경우: 앱 캐시 삭제 또는 재로그인을 안내하십시오.

    - 원장 불일치 발견 시: 즉시 내부 전문 팀으로 에스컬레이션하여 정산 조정을 요청하십시오. 고객에게는 ''정밀 조사가 진행 중이며 영업일
    기준 3~5일 이내에 결과를 안내해 드리겠다''고 안내하십시오.

    - 금융사기로 인한 오입금인 경우: ''모임통장: 이 상품을 사칭한 사기 주의'' 절차에 따라 지급정지 및 피해구제 신청을 지원하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
