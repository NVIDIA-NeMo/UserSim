  institution_id: mirinae_bank
- id: 8f1566eb-c2da-5f9c-a229-f7db5a0e5621
  title: '미리내 입출금통장: 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자금 운용 목적에 따라 미리내 입출금통장에서 다른 상품으로의 전환이 필요할 수 있습니다. 상담 시 다음 기준을 참고하십시오.


    **비교 분석**

    - **미리내 입출금통장**: 입출금통장 금리 0.1%를 제공하며, 언제든 자유로운 입출금이 필요한 생활비 계좌로 적합합니다.

    - **세이프박스**: 하루만 맡겨도 2%의 금리를 제공합니다. 입출금통장의 편리함을 유지하면서 단기 자금을 더 효율적으로 굴리고 싶은 고객에게
    적합합니다.


    **추천 가이드**

    - 잦은 송금과 결제가 주 목적이라면 **미리내 입출금통장**을 유지하십시오.

    - 여유 자금을 잠시 보관하며 더 높은 수익을 얻고자 한다면 **세이프박스**로의 자금 이동을 추천하십시오.


    상품 전환 및 상세 절차는 ''미리내 입출금통장: 해지·변경·상품 전환''에서 확인 가능합니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 315c787e-1a98-5320-ac82-9c3676b71085
  title: '미리내 입출금통장: 다른 상품과의 비교와 맞지 않는 경우'
  body: '미리내 입출금통장은 일상적인 금융 생활을 위한 가장 기본적인 상품입니다. 고객님의 목적에 따라 더 적합한 상품이 있을 수 있으니 아래
    내용을 확인하십시오.


    **이런 분께 적합합니다**

    - 스마트폰 앱으로 간편하게 송금과 결제를 관리하고 싶으신 분

    - 타행 이체 수수료나 ATM 출금 수수료(0원) 부담 없이 자유롭게 이용하고 싶으신 분


    **이런 경우에는 다른 상품을 추천합니다**

    - **안정적인 고수익을 추구하시는 경우**: 입출금통장 금리 0.1%보다 높은 수익이 필요하시다면, 일정 기간 예치하여 수익을 얻는 ''미리내
    정기예금''이 더 적합합니다.

    - **공동 자금을 관리해야 하는 경우**: 여러 사람이 투명하게 회비를 모으고 관리하시려면 ''모임통장''을 이용하십시오.

    - **단기 자금의 효율적 운용이 필요한 경우**: 하루만 맡겨도 2% 금리를 제공하는 ''세이프박스''를 권장합니다.


    본 상품은 금융위원회와 금융감독원의 감독을 받으며, 예금보험공사를 통해 1인당 최대 1억원까지 보호됩니다.'
