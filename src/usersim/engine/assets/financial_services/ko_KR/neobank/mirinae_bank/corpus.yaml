  mentions_tools: []
  institution_id: mirinae_bank
- id: 2a2dd51d-96e5-5ef7-b3f4-4dd9443c5736
  title: '미리내 입출금통장: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 거래 내역이나 잔액이 실제와 다르다고 판단될 때의 처리 프로세스입니다.


    **확인해야 할 증상**

    - 앱에 표시된 잔액과 실제 출금 가능 금액의 차이

    - 거래 내역에 없는 출금 기록 발견

    - 입금 완료 안내를 받았으나 내역에 반영되지 않은 경우


    **원인 분석 및 해결 단계**

    1. **결제 대기 확인**: 일부 가맹점 결제나 이체는 처리 상태가 ''보류'' 또는 ''결제 대기'' 중일 수 있습니다. 내역의 상세 상태를
    먼저 확인하십시오.

    2. **본인 인증**: 상담원에게 성함과 생년월일을 통해 본인 확인을 요청하십시오.

    3. **상세 내역 대조**: 상담원이 제공하는 시스템상의 거래 일시와 고객님이 보시는 명세서의 일시를 초 단위까지 대조하여 누락된 내역이
    있는지 확인합니다.

    4. **오류 수정 요청**: 시스템 오류로 확인될 경우, 즉시 정정 절차를 밟습니다.


    **에스컬레이션**

    - 사실 관계 확인 후에도 합의에 이르지 못하는 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됩니다. 상담원은 해당 사안을
    내부 전문 팀으로 에스컬레이션하여 신속하게 조사를 진행하겠습니다.'
