- id: 4224c326-64bd-538f-a397-f25b3211be5f
  title: freeze_card 사용 기준
  body: '체크카드의 사용을 일시적으로 정지시키기 위한 상담원 처리 절차는 다음과 같습니다.


    1. 본인 인증 수행

    고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 통해 본인 인증을 완료합니다.


    2. 카드 식별자 확보

    고객님이 제공한 카드 정보(예: 뒷자리)를 바탕으로 get_accounts 도구를 호출하여 정지 대상인 card_id를 확인합니다.


    3. 카드 사용 정지 실행

    확인된 card_id를 사용하여 freeze_card 도구를 호출합니다. 이 조치는 앱에서 설정하는 사용 정지와 동일한 효과를 가집니다.


    4. 추가 안내 수행

    정지 사유가 카드의 분실 또는 도난인 경우, 즉시 order_replacement_card 도구를 통해 카드 재발급 절차를 안내하고 접수를
    도와야 합니다.


    상담원은 정지 처리 후 고객님께 정상적으로 처리가 완료되었음을 명확히 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: mirinae_bank
