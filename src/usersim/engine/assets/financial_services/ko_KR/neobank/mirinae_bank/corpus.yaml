- id: 82e3bb46-8195-58ef-ae02-bada84bde09c
  title: '세이프박스: 세이프박스 최대 보관 금액 안내'
  body: 'Q: 세이프박스에 최대 얼마까지 보관할 수 있습니까?

    A: 세이프박스의 최대 보관 금액은 100,000,000원입니다. 이 금액까지는 2%의 금리 혜택을 동일하게 적용받으실 수 있습니다.


    Q: 보관 한도인 100,000,000원을 초과하여 입금하려고 하면 어떻게 됩니까?

    A: 세이프박스 최대 보관 금액인 100,000,000원을 초과하는 금액은 세이프박스로 이동되지 않고, 연결된 미리내 입출금통장의 잔액으로
    유지됩니다.


    더 자세한 한도 및 제한 사항은 ''세이프박스: 한도·제한과 유의사항''을 참고해 주십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 371b97e5-98cf-57c4-bdc0-fc1fee12f4b3
  title: '세이프박스: 해지·변경·상품 전환'
  body: '세이프박스를 더 이상 사용하지 않으시거나 다른 상품으로 자금을 전환하시려는 경우, 다음 절차를 통해 처리하실 수 있습니다.


    1. 본인 인증 수행: 상담원에게 세이프박스 해지 또는 전환을 요청하십시오. 상담원은 고객님의 성함과 생년월일을 확인하여 본인 인증을 진행합니다.

    2. 처리 요청: 해지하고자 하는 세이프박스를 지정하고, 보관 중인 잔액의 처리 방식을 말씀해 주십시오. 기본적으로 세이프박스 내의 모든 잔액은
    연결된 미리내 입출금통장으로 즉시 이동됩니다.

    3. 결과 확인: 처리 완료 안내를 받으신 후, 앱의 계좌 내역에서 세이프박스가 삭제되었는지와 입출금통장으로 잔액이 정확히 입금되었는지 확인하십시오.


    세이프박스에서 이동된 자금을 바탕으로 정기적인 수익을 추구하고 싶으신 경우, ''미리내 입출금통장: 상품 개요''를 확인하여 다른 저축 상품으로의
    전환을 고려해 보시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 28beeee4-3f66-53f4-b600-a425f662e383
  title: '세이프박스: 예상과 다른 수수료나 금액'
  body: '고객님께서 세이프박스에서 지급받으신 이자 금액이나 잔액이 예상과 다르다고 느끼시는 경우, 다음 사항을 순차적으로 확인하시기 바랍니다.


    - 증상: 세이프박스에 적용된 이자가 계산한 금액보다 적게 입금됨

    - 원인 1 (원천징수): 예금 이자에는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 안내된 2% 금리는 세전 금리이며, 실제 수령액은
    여기서 세금을 제외한 금액입니다.

    - 원인 2 (계산 방식): 이자는 일별 잔액을 기준으로 계산되어 지급되므로, 자금을 보관한 정확한 기간을 확인하셔야 합니다.

    - 해결 방법: 앱 내 ''거래 내역''에서 세전 이자 금액과 원천징수 세액이 어떻게 표기되어 있는지 확인하십시오.


    만약 위 사항을 확인한 후에도 금액이 맞지 않는다고 판단되시면 말씀해 주십시오. 전문 상담원이 세부 계산 내역을 검토하여 상세히 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: bc5d290d-2dd8-5278-8be2-c62f61825b09
  title: '세이프박스: 필요 서류'
  body: '세이프박스는 미리내 입출금통장을 보유한 고객님께서 앱을 통해 즉시 개설하실 수 있는 서비스입니다. 개설 및 이용을 위해 필요한 사항은
    다음과 같습니다.


    - 비대면 실명확인 완료: 신분증(주민등록증 또는 운전면허증) 촬영 및 본인 명의의 타행 계좌 확인을 통해 실명 확인이 완료되어야 합니다.

    - 미리내 입출금통장 보유: 세이프박스는 단독 개설이 불가하며, 반드시 미리내 입출금통장이 개설된 상태여야 합니다.

    - 본인 명의 스마트폰: 미리내뱅크 모바일 앱 설치 및 기기 인증이 가능한 본인 명의의 휴대폰이 필요합니다.


    가입 대상에 대한 더 자세한 정보는 ''세이프박스: 가입 대상''에서 확인하십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 1075c26f-ff38-5603-8849-84a5c5d48c62
  title: '세이프박스: 다른 회사의 일반적인 상품과의 비교'
  body: '세이프박스는 일반적인 금융기관의 CMA(종합자산관리계좌)나 저축성 예금과 비교하여 다음과 같은 차별점이 있습니다.


    - 금리 및 유동성: 타사의 일반적인 입출금 계좌는 금리가 매우 낮으나, 세이프박스는 하루만 맡겨도 2%의 금리를 제공하면서도 언제든 즉시
    출금이 가능해 유동성이 매우 높습니다.

    - 이용 편의성: 지점 방문 없이 모바일 앱에서 즉시 생성하고 해지할 수 있어, 영업점 방문이 필요한 기존 은행 상품보다 접근성이 뛰어납니다.

    - 보관 한도: 최대 100,000,000원까지 보관할 수 있어 소규모 단기 자금 관리에 최적화되어 있습니다.


    결론적으로, 복잡한 조건 없이 높은 금리를 받으며 자금을 유연하게 운용하고 싶은 분께는 세이프박스가 유리하며, 아주 거액의 자금을 장기간 예치하여
    확정 수익을 얻고자 하시는 분께는 정기예금 상품이 더 적합할 수 있습니다.


    상품의 상세 특징은 ''세이프박스: 상품 개요''를 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: dfe0a9f3-6533-5b35-bc09-7087c3097abe
  title: '세이프박스: 위험 안내'
  body: '세이프박스 이용 고객님께서 유의하셔야 할 주요 사항을 안내드립니다.


    1. 금리 변동 위험: 세이프박스 금리 2%는 고정 금리가 아니며, 시장 금리 상황이나 은행의 운영 정책에 따라 변경될 수 있습니다. 금리
    변경 시 앱을 통해 공지됩니다.


    2. 예금자 보호 한도: 세이프박스는 예금보험공사를 통해 보호되는 상품입니다. 예금자보호법에 따라 미리내뱅크의 다른 보호 대상 상품과 합산하여
    예금자 1인당 원금과 소정의 이자를 합해 최대 1억원까지 보호됩니다. 1억원을 초과하는 금액은 보호 대상에서 제외됩니다.


    3. 투자 상품과의 차이: 본 상품은 원금이 보장되는 예금 상품이며, 실적에 따라 수익이 변동되는 펀드나 주식과 같은 투자 상품이 아닙니다.
    따라서 원금 손실의 위험은 없으나, 기대 수익률 또한 투자 상품보다 낮을 수 있습니다.


    상세한 법령 및 제도 안내는 ''법령·제도 안내: 예금·일상 거래''를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a5c9718d-3e59-5019-9392-8540561d6964
  title: '세이프박스: 금리·요율이 정해지는 방식과 적용'
  body: '세이프박스의 금리 적용 방식에 대해 안내드립니다.


    - 적용 금리: 연 2% (세전)

    - 적용 대상: 세이프박스 내에 보관된 모든 잔액 (최대 100,000,000원 한도)

    - 금리 결정 방식: 미리내뱅크의 내부 금리 산정 기준 및 시장 금리 상황을 반영하여 결정됩니다. 별도의 우대 조건 없이 모든 고객님께 동일한
    금리가 적용되는 플랫 레이트(Flat Rate) 방식입니다.

    - 이자 계산 및 지급: 매일의 최종 잔액에 대해 금리를 적용하여 계산하며, 정해진 이자 지급일에 연결된 입출금통장으로 지급됩니다.

    - 변동 가능성: 금리는 은행 정책에 따라 변경될 수 있으며, 변경 시 앱 내 공지사항을 통해 안내드립니다.


    구체적인 금리 안내는 ''세이프박스: 세이프박스 금리 안내''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: c82e607a-ff54-54f1-bd6a-fcc4e8ba126a
  title: '세이프박스: 추천·장기 이용 혜택'
  body: '미리내뱅크와 함께하는 스마트한 자산 관리, 세이프박스 추천 이벤트를 안내해 드립니다.


    이벤트 기간: 2026년 1월 1일부터 2026년 3월 31일까지

    혜택 내용: 세이프박스에 가입하고 3개월 이상 유지하시는 고객님께 기본 세이프박스 금리 2%와 더불어 추첨을 통해 추가 리워드를 제공합니다.


    지인의 추천으로 가입하신 신규 고객님께는 첫 달 보관 금액에 대해 특별 혜택을 드립니다. 지금 바로 세이프박스를 통해 효율적인 단기 자금 관리를
    시작하십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 123ef9ee-18f3-546f-b34a-67a862d6f36c
  title: '세이프박스: 안전한 이용을 위한 수칙'
  body: '세이프박스를 이용하시는 고객님의 소중한 자산을 안전하게 보호하기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    최근 세이프박스의 고금리를 미끼로 한 보이스피싱 및 스미싱 사례가 증가하고 있습니다. 미리내뱅크는 어떠한 경우에도 고객님께 카드 번호, 비밀번호,
    CVV 번호, 또는 주민등록번호 전체를 요구하지 않습니다. 특히 앱 외부의 링크를 통해 개인정보 입력을 유도하는 경우 절대 응하지 마십시오.


    만약 본인이 요청하지 않은 계좌 상태 변경 알림을 받으셨거나, 금융사기가 의심되는 상황이 발생했다면 즉시 저희 고객센터를 통해 지급정지를 요청하십시오.
    신속한 지급정지 조치만이 피해를 최소화할 수 있는 가장 확실한 방법입니다.


    정기적으로 비밀번호를 변경하시고, 신뢰할 수 없는 기기에서의 로그인을 자제하시어 보안 수준을 유지해 주시기 바랍니다. 고객님의 안전한 금융
    생활을 위해 최선을 다하겠습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a7ff63c3-011a-54da-8599-ebd993e1c0a6
  title: '세이프박스: 약관 변경 안내'
  body: '미리내뱅크 세이프박스 서비스 이용 약관의 일부 변경 사항을 안내해 드립니다. 본 변경 사항은 서비스의 운영 효율성을 높이고 고객님께
    더 투명한 금융 서비스를 제공하기 위함입니다.


    주요 변경 내용:

    1. 보관 한도 및 금리 적용: 세이프박스의 최대 보관 금액은 100,000,000원으로 제한되며, 적용되는 세이프박스 금리는 2%입니다.
    해당 한도를 초과하는 금액은 자동으로 연결된 입출금통장으로 이체됩니다.

    2. 금리 변경 고지: 시장 금리 상황에 따라 금리가 변동될 수 있으며, 변경 시 앱 내 공지사항을 통해 최소 7일 전에 안내해 드리겠습니다.


    약관 변경에 동의하지 않으시는 고객님께서는 서비스 해지를 요청하실 수 있습니다. 별도의 거부 의사를 밝히지 않으신 경우, 본 변경 사항에 동의하신
    것으로 간주됩니다.


    미리내뱅크는 금융감독원의 기준을 준수하며, 예금자보호법에 따라 예금보험공사를 통해 원금과 소정의 이자를 합해 1억원까지 보호하고 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: terms_conditions
  source_authority: official
