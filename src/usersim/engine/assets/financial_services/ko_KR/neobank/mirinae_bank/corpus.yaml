  institution_id: mirinae_bank
- id: c081fb27-fe79-519b-9d0f-885b3e2831b5
  title: '세이프박스: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 세이프박스 이자 금액이나 잔액이 예상과 다르다고 하시는 경우, 다음 순서로 점검해 주십시오.


    1. 원천징수 세액 확인

    가장 흔한 원인은 세금 공제입니다. 세이프박스 금리 2%로 계산된 세전 이자에서 소득세와 지방소득세 합계 15.4%가 원천징수된 후 지급됩니다.
    고객님께 세후 금액이 입금되었음을 안내하십시오.


    2. 이자 계산 방식 확인

    세이프박스는 일별 잔액을 기준으로 이자를 계산합니다. 매일 보관 금액이 달랐다면 단순 계산식과 차이가 발생할 수 있습니다. 정확한 일별 잔액
    추이를 확인하여 안내하십시오.


    3. 입출금 시점 확인

    입출금통장에서 세이프박스로 자금을 이동시킨 시점과 다시 뺀 시점을 대조하여, 실제 2% 금리가 적용된 보관 기간을 산출하십시오.


    위 사항을 확인했음에도 금액 불일치가 지속된다면, 상세 내역 조사를 위해 전문 부서로 에스컬레이션하십시오. 조사 결과는 영업일 기준 3~5일
    이내에 고객님께 안내되며, 오류 발견 시 즉시 정정 입금 조치하겠습니다.'
