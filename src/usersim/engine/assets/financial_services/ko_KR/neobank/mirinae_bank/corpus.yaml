- id: 3eedf484-d5d5-55c7-90ea-9fc90fa0ab58
  title: '세이프박스: 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자금 운용 목적에 따라 세이프박스와 미리내 정기예금 중 적절한 상품을 추천해 주십시오.


    1. 세이프박스 (단기 유동성 중심)

    - 금리: 연 2%

    - 특징: 하루만 맡겨도 이자가 붙으며, 언제든 입출금통장으로 자금을 옮겨 사용할 수 있습니다.

    - 추천 대상: 수시로 입출금이 필요하면서도 일반 입출금통장보다 높은 금리를 원하는 고객님


    2. 미리내 정기예금 (안정적 수익 중심)

    - 특징: 일정 기간 자금을 예치하여 세이프박스보다 더 높은 안정적인 수익을 추구하는 상품입니다.

    - 추천 대상: 당장 사용할 계획이 없는 목돈을 일정 기간 보관하여 수익을 극대화하려는 고객님


    자금의 사용 시점이 불분명하다면 유동성이 확보된 세이프박스를, 명확한 만기 설정이 가능하다면 미리내 정기예금으로의 전환을 안내하시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 771db598-2ae1-5d36-a8e5-e71ae41ff61e
  title: '세이프박스: 다른 상품과의 비교와 맞지 않는 경우'
  body: '세이프박스는 편리함과 수익성을 동시에 잡은 상품이지만, 고객님의 상황에 따라 최선의 선택이 아닐 수 있습니다. 상품 선택 시 다음
    내용을 참고하십시오.


    세이프박스가 유리한 경우:

    - 갑작스럽게 사용할 가능성이 있는 비상금을 보관할 때

    - 2%의 금리를 받으면서도 언제든 자금을 인출하고 싶을 때

    - 소액부터 최대 100,000,000원까지 유연하게 자금을 관리하고 싶을 때


    세이프박스가 맞지 않는 경우:

    - 매우 높은 수익률을 목적으로 장기간 자금을 묶어둘 수 있는 경우: 이 경우 일정 기간 예치하여 더 높은 수익을 얻는 ''미리내 정기예금''이
    더 적합합니다.

    - 100,000,000원을 초과하는 고액의 자금을 한 곳에서 관리하며 높은 금리를 받고 싶은 경우: 세이프박스는 최대 보관 금액이 100,000,000원으로
    제한되어 있습니다.


    세이프박스는 입출금통장의 편리함과 정기예금의 수익성 사이의 균형을 맞춘 상품임을 안내해 주십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 467a5146-0ee8-54ab-8388-b129ba225774
  title: '세이프박스: 이용 방법과 절차'
  body: '질문: 세이프박스에 돈을 넣거나 빼는 방법은 무엇인가요?

    답변: 세이프박스는 연결된 입출금통장에서 자금을 이동시키는 방식으로 운영됩니다. 앱 내 세이프박스 메뉴에서 ''넣기''를 선택하면 입출금통장의
    잔액이 세이프박스로 이동하며, ''빼기''를 선택하면 다시 입출금통장으로 자금이 반환됩니다.


    질문: 이자는 언제 어떻게 지급되나요?

    답변: 세이프박스의 연 2% 금리는 매일의 잔액을 기준으로 계산됩니다. 정해진 이자 지급일에 계산된 이자가 연결된 입출금통장으로 자동 지급됩니다.
    지급 시 소득세와 지방소득세를 합한 15.4%가 원천징수된 후 입금됩니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: fa6f3d26-65f1-532e-8c3c-ced33a302b46
  title: '세이프박스: 자주 하는 업무의 처리 절차'
  body: '세이프박스 이용 시 가장 빈번하게 발생하는 업무 처리 절차입니다.


    1. 세이프박스 개설 및 자금 예치

    - 본인 인증: 성함과 생년월일을 확인하여 본인 인증을 수행합니다.

    - 개설 요청: 앱 또는 상담원을 통해 세이프박스 개설을 요청하십시오.

    - 금액 이동: 입출금통장의 잔액 중 보관하고자 하는 금액(최대 100,000,000원)을 세이프박스로 이동시킵니다.


    2. 보관 자금 인출 (입출금통장으로 이동)

    - 인출 요청: 세이프박스에서 입출금통장으로 옮길 금액을 지정하십시오.

    - 즉시 반영: 요청 즉시 자금이 입출금통장으로 이동하며, 이때부터 일반 이체나 결제가 가능해집니다.


    3. 세이프박스 해지

    - 잔액 이동: 세이프박스에 남은 모든 금액을 입출금통장으로 먼저 이동시켜야 합니다.

    - 해지 처리: 잔액이 0원이 된 것을 확인한 후 해지를 요청하십시오.


    모든 과정은 미리내뱅크 모바일 앱을 통해 실시간으로 처리 가능하며, 상담원을 통해서도 동일한 절차로 지원받으실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: how_to_guide
  source_authority: official
  placeholder: true
