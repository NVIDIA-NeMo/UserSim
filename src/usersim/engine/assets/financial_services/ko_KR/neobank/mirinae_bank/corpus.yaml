- id: 83701ef8-8e94-505c-9b62-307541019e25
  title: '미리내 입출금통장: 자주 하는 업무의 처리 절차'
  body: '미리내 입출금통장을 이용한 가장 대표적인 업무인 ''자금 이체'' 처리 절차를 안내해 드립니다.


    **필요 사항**

    - 이체할 금액의 잔액

    - 받는 분의 은행명과 계좌번호


    **이체 처리 절차**

    1. 상담원에게 성함과 생년월일을 말씀하시어 본인 인증을 수행하십시오.

    2. 이체하고자 하는 금액과 받는 분의 계좌 정보를 제공하십시오.

    3. 상담원이 이체 대상자와 금액을 다시 한번 확인해 드리면, 이를 승인하십시오.

    4. 이체가 완료되면 앱 알림 또는 메시지를 통해 처리 결과가 전송됩니다.


    **확인 완료**

    - 앱의 거래 내역에서 해당 금액이 정상적으로 출금되었는지 확인하시고, 상대방에게 입금 여부를 확인하시면 모든 절차가 완료됩니다.


    ※ 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)는 0원이 적용되어 별도의 비용이 발생하지 않습니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: how_to_guide
  source_authority: official
