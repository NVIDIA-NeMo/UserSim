  institution_id: mirinae_bank
- id: 5bdcbfb2-1265-5827-bf8a-6b3b9e090f5b
  title: '미리내 정기예금: 위험 안내'
  body: '미리내 정기예금 가입 전 다음의 위험 및 유의사항을 반드시 확인하십시오.


    1. 유동성 위험: 본 상품은 일정 기간 자금을 예치하는 상품으로, 만기 전 자금이 필요하여 중도 해지할 경우 가입 시 약정한 금리(6개월
    3.2%, 1년 3.5%)보다 훨씬 낮은 중도해지이율이 적용되어 기대 수익이 감소할 수 있습니다.

    2. 금리 위험: 확정 금리 상품이므로 가입 후 시장 금리가 상승하더라도 가입 당시의 금리가 그대로 적용됩니다.

    3. 예금자 보호 한도: 본 상품은 예금보험공사를 통해 보호되지만, 보호 한도는 예금자 1인당 원금과 소정의 이자를 합해 금융회사별로 최대
    1억원까지입니다. 이를 초과하는 금액은 보호 대상에서 제외됩니다.

    4. 원천징수: 이자 소득에 대해 15.4%의 세율로 소득세 및 지방소득세가 원천징수되며, 금융소득 종합과세 대상(연 2,000만원 초과)이
    될 수 있음을 유의하십시오.


    미리내뱅크는 금융위원회와 금융감독원의 감독을 준수하며, 관련 법령에 따라 고객님의 자산을 안전하게 관리하고 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: disclosure
  source_authority: official
