- id: 57ab14b2-7bb0-5bbb-bede-0f3cd15cf8bc
  title: '모임통장: 위험 안내'
  body: '본 상품 이용 전 다음의 위험 및 고지 사항을 충분히 숙지하시기 바랍니다.


    1. 금리 변동 위험

    모임통장에 적용되는 입출금통장 금리 0.1%는 고정 금리가 아니며, 은행의 금리 정책 및 시장 금리 변동에 따라 변경될 수 있습니다. 따라서
    기대 수익이 변동될 수 있음을 유의하십시오.


    2. 세금 관련 고지

    본 계좌에서 발생하는 모든 이자 소득에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 실제 수령하는 이자는 세전 금리보다
    낮을 수 있습니다.


    3. 예금자 보호 한도

    미리내뱅크는 예금보험공사를 통해 예금자 보호를 제공합니다. 보호 한도는 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지입니다.
    이를 초과하는 금액은 보호 대상에서 제외됩니다.


    4. 관리 책임

    모임통장은 모임주가 계좌의 법적 소유권을 가집니다. 멤버 간의 정산 분쟁이나 모임주의 계좌 관리 부주의로 인한 사고에 대해 미리내뱅크는 법적
    책임이 제한될 수 있으므로, 모임 내부의 명확한 운영 규칙을 세우실 것을 권장합니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: disclosure
  source_authority: official
  placeholder: true
