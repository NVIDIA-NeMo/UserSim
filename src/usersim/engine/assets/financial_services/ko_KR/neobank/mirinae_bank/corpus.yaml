- id: 6b618eb7-3408-58eb-9a5c-3d23783fb547
  title: '세이프박스: 당사의 비슷한 상품과의 비교'
  body: '고객님의 자금 운용 목적에 따라 세이프박스와 다른 상품을 비교해 보십시오.


    - 세이프박스: 연 2%의 금리를 제공하며, 입출금이 완전히 자유롭습니다. 단기 자금을 보관하며 수익을 내고 싶은 분께 적합합니다.

    - 미리내 입출금통장: 결제와 송금이 매우 편리하지만, 금리는 세이프박스보다 낮습니다. 일상적인 지출 관리용으로 적합합니다.

    - 미리내 정기예금: 세이프박스보다 높은 수익을 추구할 수 있으나, 일정 기간 자금이 묶이게 됩니다. 목돈을 안전하게 예치하여 확정 수익을
    얻고자 하는 분께 적합합니다.


    유연성과 수익성을 모두 잡고 싶으시다면 연 2% 금리의 세이프박스를 추천드립니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 3d462b15-10a1-50b7-8eed-2ed90b14f806
  title: '세이프박스: 상품설명서 주요 내용'
  body: '본 문서는 세이프박스 이용 고객이 반드시 숙지해야 할 법적 고지 사항을 담고 있습니다.


    **예금자 보호 안내**

    세이프박스는 예금보험공사법에 따라 예금보험공사가 보호하는 상품입니다. 미리내뱅크의 다른 예금 상품과 합산하여 예금자 1인당 원금과 소정의 이자를
    합해 최대 1억원까지 보호됩니다.


    **세금 적용**

    세이프박스에서 발생하는 이자 소득에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 금융소득 종합과세 대상 여부는 관련 법령에
    따라 결정됩니다.


    **감독 기관**

    미리내뱅크는 은행법에 따라 금융위원회와 금융감독원의 감독을 받으며, 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 자산을 관리합니다.


    **운용 제한**

    세이프박스의 최대 보관 금액은 100,000,000원으로 제한되며, 이를 초과하는 금액은 연결된 입출금통장에 보관됩니다. 자세한 내용은 ''세이프박스:
    금리·요율 안내''를 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 9f1017bc-b175-5faa-be95-7b04a0ccc8ad
  title: '세이프박스: 금리·요율 안내'
  body: '세이프박스에 적용되는 금리 상세 안내입니다.


    - 적용 금리: 연 2%

    - 적용 대상: 세이프박스에 보관된 모든 잔액 (최대 100,000,000원까지)

    - 금리 적용 방식: 단일 금리 체계로, 보관 금액의 크기에 관계없이 모든 고객님께 동일하게 연 2%가 적용됩니다.

    - 이자 계산: 매일의 최종 잔액에 대하여 일할 계산하며, 약정된 지급일에 연결된 입출금통장으로 지급됩니다.


    금리는 시장 상황 및 은행의 경영 전략에 따라 변동될 수 있으며, 변경 시 앱 내 공지사항을 통해 안내드립니다.'
