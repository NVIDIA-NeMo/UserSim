- id: 52b07dc1-43b4-5e19-bce5-07fdb926ca97
  title: '모임통장: 약관 변경 안내'
  body: '미리내뱅크는 금융 서비스의 품질 향상과 법적 규제 준수를 위해 모임통장의 이용 약관을 변경합니다. 본 안내는 기존 이용 고객 및 신규
    가입 희망 고객께서 타 서비스와 비교 시 참고하실 수 있도록 주요 변경 사항을 명시합니다.


    1. 이용 한도 및 조건의 명시

    모임통장에 참여할 수 있는 모임통장 최대 멤버 수는 100명으로 제한됩니다. 이를 초과하는 인원의 가입은 불가능하며, 멤버 초대 시 해당 한도가
    적용됩니다.


    2. 금리 적용 기준

    본 상품에 적용되는 입출금통장 금리는 0.1%입니다. 금리는 변동될 수 있으며, 변경 시 앱 내 공지사항을 통해 안내드립니다. 이자에 대해서는
    관련 법령에 따라 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.


    3. 예금자 보호 제도

    본 상품은 예금보험공사를 통해 예금자보호법에 따라 보호됩니다. 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호받으실 수
    있습니다.


    4. 약관의 효력 및 해지

    약관 변경 사항은 고지된 시행일부터 효력이 발생합니다. 변경된 약관에 동의하지 않으시는 경우, 모바일 앱을 통해 언제든지 상품 해지를 요청하실
    수 있습니다. 해지 절차는 미리내뱅크의 표준 계좌 해지 절차를 따릅니다.


    상세한 전체 약관 내용은 앱 내 [약관 및 정책] 메뉴에서 확인하십시오.'
  domain: retail_banking
