- id: 719fa6a8-dec7-5fed-91d0-e5f15506d4bb
  title: '모임통장: 처리가 끝나지 않거나 보류 중일 때'
  body: '**증상**: 회비 입금을 완료했으나 잔액에 즉시 반영되지 않거나, 거래 내역에 ''처리 중'' 또는 ''보류'' 상태로 표시되는
    경우입니다.


    **원인 및 확인 사항**

    - 타 은행 간의 송금 처리 과정에서 일시적인 지연이 발생할 수 있습니다.

    - 시스템 점검 시간이나 네트워크 불안정으로 인해 반영이 늦어질 수 있습니다.


    **해결 방법**

    1. 거래 내역에서 해당 건의 상태가 ''보류''인지 다시 한번 확인하십시오.

    2. 대부분의 거래는 영업일 기준 1~3일 이내에 자동으로 처리 완료됩니다.

    3. 3영업일이 지난 후에도 상태가 변경되지 않는다면 저희에게 말씀해 주십시오.


    **처리 절차**

    상태가 해결되지 않은 경우, 저희가 내부 에스컬레이션 경로를 통해 전문 상담원에게 해당 건을 전달하겠습니다. 전문 상담원이 처리 상태를 정밀
    확인한 후, 최종 결과를 안내해 드리겠습니다.


    진행 상황을 확인하시려면 ''모임통장: 진행 상황과 내역 확인''을 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: af05c298-a693-5caa-b12c-1a0a80813c44
  title: '모임통장: 가입 대상'
  body: '모임통장 가입을 위한 조건과 결과는 다음과 같습니다.


    - **미리내뱅크 입출금통장 보유 여부** → **필수**: 보유하고 계셔야 하며, 없는 경우 먼저 개설하십시오.

    - **비대면 실명확인 완료 여부** → **필수**: 금융실명법에 따라 신분증 및 계좌 확인을 통한 실명확인이 완료되어야 합니다.

    - **가입 가능 연령** → **만 17세 이상**: 법정 대리인 동의 없이 단독 가입이 가능한 연령이어야 합니다.

    - **거주 및 국적** → **가능**: 대한민국 거주 내국인 및 외국인등록증을 소지한 외국인 모두 가입 가능합니다.


    가입 절차에 대한 상세 안내는 ''모임통장: 가입과 이용 시작''에서 확인하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 8d86b29e-0746-590a-8b7c-80b53c8968f4
  title: '모임통장: 당사의 비슷한 상품과의 비교'
  body: '고객님의 목적에 맞는 최적의 상품을 선택하실 수 있도록 안내해 드립니다.


    - **미리내 입출금통장과의 비교**: 두 상품 모두 입출금통장 금리 0.1%를 제공하며 수수료 혜택이 동일합니다. 하지만 입출금통장은 개인의
    독립적인 자산 관리에 적합하며, 모임통장은 여러 멤버가 내역을 공유하여 투명하게 회비를 운영하는 데 특화되어 있습니다.

    - **세이프박스와의 비교**: 세이프박스는 하루만 맡겨도 2%의 높은 금리를 제공하여 단기 자금의 효율적인 보관에 유리합니다. 반면 모임통장은
    금리보다는 공동 관리의 편의성과 투명성에 집중한 상품입니다.


    **추천 대상**

    - **모임통장**: 동호회, 친구 모임 등 다수가 함께 회비를 걷고 사용 내역을 공유해야 하는 분

    - **세이프박스**: 개인의 여유 자금을 안전하면서도 높은 수익률로 잠시 보관하고 싶은 분


    상세 내용은 ''세이프박스: 상품 개요''를 참고하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: comparison
  source_authority: official
  placeholder: true
