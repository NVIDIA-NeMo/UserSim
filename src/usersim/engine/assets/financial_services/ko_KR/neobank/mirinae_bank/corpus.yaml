- id: a339e38c-0a03-514c-a774-89f17150d01d
  title: '모임통장: 자주 하는 업무의 처리 절차'
  body: '모임통장에서 가장 자주 발생하는 멤버 초대 및 관리 업무 처리 절차입니다.


    **멤버 초대 절차**

    1. 앱 내 ''모임통장'' 메뉴에서 관리 중인 모임을 선택하십시오.

    2. ''멤버 초대하기'' 버튼을 클릭하십시오.

    3. 초대할 멤버의 연락처를 선택하거나 공유 링크를 생성하여 전달하십시오.

    4. 상대방이 미리내뱅크 앱에서 초대 수락을 완료하면, 멤버 목록에 이름이 표시됩니다.


    **계좌 정보 변경 및 본인 확인 절차**

    모임통장의 명칭 변경이나 중요 정보 수정이 필요한 경우 다음 단계를 따릅니다.

    1. 상담원에게 정보 변경을 요청하십시오.

    2. 상담원이 본인 확인을 위해 성함과 생년월일을 요청하면 이를 정확히 제공하십시오.

    3. 본인 인증이 완료되면 요청하신 변경 사항이 적용되며, 완료 알림 메시지를 받으시게 됩니다.


    ※ 주의: 미리내뱅크는 비밀번호, CVV, 주민등록번호를 절대 요구하지 않습니다.


    더 많은 기능 안내는 ''모임통장: 이용 방법과 절차''를 확인하십시오.'
