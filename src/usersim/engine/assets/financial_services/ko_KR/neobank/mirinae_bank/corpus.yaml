- id: ca2a531f-9aed-53cd-8c98-afdf088f0fe6
  title: open_time_deposit 사용 기준
  body: '상담원은 고객이 미리내 정기예금 가입을 요청할 경우 다음 절차에 따라 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 사용하여 예치금이 출금될 미리내 입출금통장의 `account_id`를 확인합니다.

    3. 고객에게 가입 금액(최소 10,000원 이상)과 예치 기간을 확인합니다.

    4. 확인된 `account_id`, 금액, 기간을 바탕으로 `open_time_deposit` 도구를 호출하여 가입을 완료합니다.


    상담원은 최소 가입 금액이 10,000원부터 가능하다는 점을 명확히 안내하십시오. 상세 상품 정보는 ''미리내 정기예금: 상품 개요''를 참고하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_time_deposit
  institution_id: mirinae_bank
- id: dd43853a-209b-5e91-930a-e6875f78a619
  title: open_time_deposit 도구 설명서
  body: "이 도구는 미리내 입출금통장의 잔액을 사용하여 미리내 정기예금에 가입하는 기능을 수행합니다. 상담원은 고객 인증 완료 후 이 도구를\
    \ 직접 호출하십시오.\n\n- 호출 시그니처: `open_time_deposit(account_id, amount, duration)`\n\
    - 입력 매개변수:\n    - `account_id`: `get_accounts`를 통해 확인한 출금 계좌(미리내 입출금통장)의 고유 식별자입니다.\n\
    \    - `amount`: 정기예금에 예치할 금액입니다. (최소 10,000원 이상)\n    - `duration`: 예치 기간입니다.\n\
    - 실행 결과: 입출금통장에서 해당 금액이 인출되어 정기예금 계좌가 개설됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_time_deposit
  institution_id: mirinae_bank
- id: b5352d89-7333-5ac2-8bf5-a2aadb5ce5f3
  title: reregister_device 사용 기준
  body: '고객님께서 휴대폰을 교체하시거나 미리내뱅크 앱을 삭제 후 재설치하여 기존의 인증 수단을 사용할 수 없는 경우, 새 기기 등록과 인증
    재등록 절차를 진행합니다. 본 절차는 고객님의 소중한 자산과 정보를 보호하기 위한 필수적인 보안 과정입니다.


    상담원은 다음의 절차에 따라 업무를 처리하십시오.


    1. 고객님께 성함과 생년월일을 요청하여 본인 인증을 수행합니다. 이때 `verify_identity` 도구를 호출하여 인증을 완료하십시오.

    2. 본인 인증이 성공적으로 완료되면, 고객님의 요청 사항을 확인한 후 `reregister_device` 도구를 호출하여 새 기기 등록 및
    인증 재등록 접수를 처리합니다.

    3. 처리가 완료되면 고객님께 앱을 통해 다시 로그인을 시도하시라고 안내하십시오.


    본 절차는 보안을 위해 엄격히 관리되며, 인증 단계에서 주민등록번호 전체나 비밀번호, CVV 등의 민감 정보는 절대 요구하지 않습니다. 접속
    관련하여 추가적인 어려움이 있으신 경우 ''미리내 입출금통장: 로그인하거나 접속할 수 없을 때'' 문서를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - reregister_device
  institution_id: mirinae_bank
- id: c27aea89-c559-59ce-b47a-31de96036d71
  title: reregister_device 도구 설명서
  body: '상담원이 고객님의 새 기기 등록과 인증 재등록을 처리하는 도구입니다.


    - 호출 방식: 상담원이 `reregister_device()`를 직접 호출합니다.

    - 실행 효과: 고객님이 사용하시는 최신 기기를 미리내뱅크 서비스 이용 기기로 등록하고, 기존의 인증 설정을 초기화하여 새 기기에서 인증을
    다시 설정할 수 있도록 접수합니다.


    이 도구는 `verify_identity`를 통해 본인 확인이 완료된 고객에 한해 사용할 수 있으며, 별도의 인증 번호나 비밀번호 인자는 필요하지
    않습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - reregister_device
  institution_id: mirinae_bank
- id: a1481d5e-449b-5051-8554-54a4621430e8
  title: report_voice_phishing 사용 기준
  body: '보이스피싱, 스미싱 등 전기통신금융사기 피해가 발생한 경우, 추가 피해를 막기 위해 즉각적인 지급정지와 피해구제 신청을 지원합니다.
    모든 분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라 신속하고 공정하게 처리하는 것을 원칙으로 합니다.


    상담원은 다음의 절차에 따라 업무를 처리하십시오.


    1. 고객님께 성함과 생년월일을 요청하여 `verify_identity` 도구로 본인 인증을 수행하십시오.

    2. 지급정지가 필요한 계좌를 확인하기 위해 `get_accounts` 도구를 사용하여 고객님의 계좌 목록과 ID를 확인합니다.

    3. 확인된 계좌 ID를 바탕으로 `report_voice_phishing` 도구를 호출하여 해당 계좌의 입출금 거래를 일시적으로 중단시키는
    지급정지 조치를 취하고, 피해구제 신청을 접수합니다.

    4. 고객님께 지급정지 완료 사실을 안내하고, 향후 진행될 피해구제 절차에 대해 설명하십시오.


    금융사기 대응과 관련된 상세 법령은 ''법령·제도 안내: 예금·일상 거래''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_voice_phishing
  institution_id: mirinae_bank
- id: 1d54c5b6-f1b6-51a3-9490-e2769965df59
  title: report_voice_phishing 도구 설명서
  body: "금융사기 피해 계좌에 대해 지급정지를 요청하고 피해구제 신청을 접수하는 도구입니다.\n\n- 호출 방식: 상담원이 `report_voice_phishing(account_id)`를\
    \ 호출합니다.\n- 인자: \n    - `account_id`: 지급정지를 수행할 고객님의 계좌 ID (get_accounts 도구 등을\
    \ 통해 획득)\n- 실행 효과: 해당 계좌의 모든 입출금 거래를 즉시 중단시키며, 관련 법령에 따른 피해구제 신청 절차를 시스템에 등록합니다.\n\
    \n본 도구는 `verify_identity` 완료 후 사용하며, 피해 발생 시 신속한 처리를 위해 사용합니다."
