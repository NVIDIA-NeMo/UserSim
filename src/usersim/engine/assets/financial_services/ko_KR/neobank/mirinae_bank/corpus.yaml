  institution_id: mirinae_bank
- id: baf24961-264f-5a00-a6f2-a41b67e6fad7
  title: '미리내 체크카드: 약관'
  body: '본 약관은 미리내뱅크와 고객 간의 미리내 체크카드 이용 계약에 관한 권리와 의무를 규정합니다.


    1. 서비스 제공 및 비용: 미리내뱅크는 고객에게 스마트한 결제 경험을 제공하며, 고객의 금융 부담을 최소화하기 위해 연회비 0원을 적용합니다.


    2. 이용 한도 및 결제: 체크카드는 연결된 예금계좌의 잔액 범위 내에서만 사용 가능합니다. 기본적으로 설정된 하루 이용한도는 6,000,000원이며,
    고객의 요청에 따라 앱 내에서 이를 변경할 수 있습니다.


    3. 혜택 제공: 결제 시 0.5%의 캐시백 혜택을 제공합니다. 단, 캐시백 적용 제외 대상 가맹점이 있을 수 있으며 상세 기준은 상품 설명서를
    따릅니다.


    4. 해외 이용 수수료: 국내 이용과 달리 해외 브랜드 가맹점에서 이용 시, 외부 비용 발생에 따라 1%의 해외 이용 시 국제브랜드 수수료율이
    부과됩니다.


    5. 계약의 종료: 고객은 언제든지 앱을 통해 카드를 해지할 수 있으며, 미리내뱅크는 관련 법령 및 약관에 따라 계약을 해지하거나 정지할 수
    있습니다.


    본 약관의 변경 사항은 앱 내 고지 사항을 통해 안내드립니다.'
