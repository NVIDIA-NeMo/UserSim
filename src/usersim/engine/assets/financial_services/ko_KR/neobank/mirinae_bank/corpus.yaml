- id: 36501b7c-b6cb-5584-aea7-c1160fa1cb96
  title: file_transaction_dispute 사용 기준
  body: '체크카드의 본인이 사용하지 않은 거래에 대해 이의 제기를 접수하는 절차는 다음과 같습니다.


    1. 본인 인증 수행

    고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 통해 본인 인증을 수행합니다.


    2. 카드 식별자 확보

    고객님이 카드 번호 뒷자리를 제공한 경우, get_accounts 도구를 호출하여 해당 카드의 정확한 card_id를 확인합니다.


    3. 분쟁 거래 정보 확인

    고객님으로부터 이의 제기를 원하는 구체적인 거래 일시와 금액을 확인하여 해당 거래의 transaction_id를 식별합니다.


    4. 이의 제기 접수

    확인된 card_id, transaction_id 및 고객님이 진술한 분쟁 사유(reason)를 바탕으로 file_transaction_dispute
    도구를 호출하여 조사를 접수합니다.


    모든 분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됨을 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: mirinae_bank
- id: 3a5eb7c7-1018-5e88-8f33-08338c49fe75
  title: file_transaction_dispute 도구 설명서
  body: "file_transaction_dispute 도구는 체크카드의 부정 사용 의심 거래에 대해 이의 제기와 조사를 접수하는 기능을 수행합니다.\n\
    \n- 호출 방식: 상담원이 도구를 직접 호출하여 접수합니다.\n- 전제 조건: verify_identity를 통한 본인 인증이 완료된 상태여야\
    \ 합니다.\n- 입력 인자:\n  - card_id (string): 해당 거래가 발생한 체크카드의 고유 식별자입니다.\n  - transaction_id\
    \ (string): 이의 제기를 신청할 특정 거래의 고유 식별자입니다.\n  - reason (string): 거래에 대해 이의를 제기하는\
    \ 구체적인 사유입니다.\n- 결과: 이의 제기 접수 완료 상태가 반환됩니다."
