- id: d858e050-1232-5bdf-bf34-358e8573a20e
  title: '미리내 체크카드: 연회비 안내'
  body: '질문: 미리내 체크카드를 이용할 때 매년 지불해야 하는 연회비가 있습니까?


    답변: 아니오, 미리내 체크카드는 고객님의 금융 부담을 최소화하는 수수료 제로 정책에 따라 연회비가 0원입니다. 가입 시점부터 이용 종료 시까지
    별도의 연회비 청구 없이 모든 서비스를 편리하게 이용하실 수 있습니다.


    더 자세한 비용 관련 사항은 ''미리내 체크카드: 수수료 안내''에서 확인하십시오.'
  domain: cards
