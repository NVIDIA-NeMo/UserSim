- id: ec029c02-8d06-5147-934f-74b7aaa0ddaf
  title: '미리내 체크카드: 해지·변경·상품 전환'
  body: '미리내 체크카드의 해지나 정보 변경, 또는 다른 상품으로의 전환을 원하실 경우 다음의 절차를 통해 처리하실 수 있습니다.


    **준비 사항**

    - 본인 명의의 휴대폰 및 미리내뱅크 앱 설치


    **처리 절차**

    1. 상담원에게 카드 해지, 정보 변경 또는 상품 전환 요청을 말씀해 주십시오.

    2. 본인 확인을 위해 고객님의 성함과 생년월일을 말씀해 주십시오.

    3. 요청하신 변경 내용(해지 사유, 변경할 한도, 전환할 상품 등)을 확인합니다.

    4. 상담원이 요청 사항의 처리가 완료되었음을 안내하며, 처리 결과는 즉시 앱의 카드 관리 화면에서 확인하실 수 있습니다.


    **처리 완료 확인**

    - 해지 시: 앱 내 카드 목록에서 해당 카드가 사라진 것을 확인하십시오.

    - 변경/전환 시: ''카드 관리'' 메뉴에서 변경된 정보나 새로운 상품명이 적용되었는지 확인하십시오.


    단, 카드 해지 시 연결된 계좌는 유지되며, 계좌까지 해지하시려면 ''미리내 입출금통장: 해지·변경·상품 전환'' 절차를 함께 진행하셔야 합니다.'
  domain: cards
  product_category: mirinae_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
