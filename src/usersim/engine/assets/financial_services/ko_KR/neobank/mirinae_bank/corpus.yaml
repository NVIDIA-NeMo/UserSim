  institution_id: mirinae_bank
- id: 0b670086-48fb-53b9-8f36-27d79035af5f
  title: '미리내 입출금통장: 상품설명서 주요 내용'
  body: '본 상품은 금융위원회와 금융감독원의 감독을 준수하며, 관련 법령에 따라 운영됩니다.


    **예금자 보호 안내**

    미리내 입출금통장은 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다. 이는 예금보험공사의 보호 제도에 따른
    것입니다.


    **개인정보 보호 및 준수 사항**

    고객님의 소중한 정보와 자산은 개인정보 보호법 및 금융실명법을 엄격히 준수하여 관리됩니다. 계좌 개설 시 금융실명법에 따른 실명확인이 반드시
    필요하며, 주민등록번호는 법령이 허용하는 경우에만 처리됩니다.


    **분쟁 처리**

    금융 서비스 이용 중 발생하는 모든 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 신속하고 공정하게 처리하는 것을 원칙으로 합니다.


    상세 내용은 상품 약관을 통해 확인하시기 바랍니다.'
