- id: 58d407a0-a436-57de-ae1b-a030124879fe
  title: '미리내 입출금통장: 가입과 이용 시작'
  body: '미리내 입출금통장은 모바일 앱을 통해 비대면으로 간편하게 개설하실 수 있습니다. 가입을 위해 다음 절차를 진행해 주십시오.


    1. 미리내뱅크 앱을 실행하여 계좌 개설 메뉴를 선택하십시오.

    2. 본인 확인을 위해 고객님의 성함과 생년월일을 입력하십시오.

    3. 신분증 촬영 및 본인 명의의 타행 계좌 확인을 통해 비대면 실명확인 절차를 완료하십시오.

    4. 상품 약관을 확인하고 동의하신 후, 계좌 개설 버튼을 누르십시오.

    5. 개설 완료 메시지와 함께 계좌 번호가 부여되면 즉시 입출금 및 송금 서비스를 이용하실 수 있습니다.


    가입 과정에서 본인 인증이 정확히 이루어져야 하며, 주민등록번호는 법령이 허용하는 범위 내에서만 처리됩니다. 가입 대상 여부는 ''미리내 입출금통장:
    가입 대상''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 0f3759e0-6dc4-509c-8809-ece494d05ae2
  title: '미리내 입출금통장: 수수료 안내'
  body: '미리내 입출금통장의 수수료 체계는 다음과 같습니다. 상담원은 고객 안내 시 정확한 금액을 고지하여 주십시오.


    - 다른 은행으로 이체 수수료(모바일·인터넷뱅킹): 0원

    - ATM 출금 수수료: 0원


    미리내뱅크는 고객의 금융 부담 최소화를 위해 주요 이체 및 출금 수수료를 0원으로 제공하는 정책을 유지하고 있습니다.'
  domain: retail_banking
