- id: c5f6e63a-f017-504c-adef-72c042f9deec
  title: '미리내 입출금통장: 입출금통장 금리 안내'
  body: 'Q: 미리내 입출금통장의 금리는 어떻게 되나요?

    A: 미리내 입출금통장의 입출금통장 금리는 연 0.1%가 적용됩니다. 이는 모든 고객님께 동일하게 적용되는 기본 금리입니다.


    Q: 이자 수익에 대해 세금이 부과되나요?

    A: 네, 그렇습니다. 예금 이자에는 소득세와 지방소득세를 합해 15.4%가 원천징수된 후 지급됩니다.


    더 자세한 금리 적용 방식은 ''미리내 입출금통장: 금리·요율 안내''를 참고하여 주십시오.'
