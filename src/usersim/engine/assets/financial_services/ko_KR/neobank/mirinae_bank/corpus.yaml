- id: 7f0de0c2-77c6-528e-81d1-f793f1907a05
  title: '모임통장: 해지·변경·상품 전환'
  body: '모임통장의 해지, 정보 변경 또는 일반 입출금통장으로의 전환 절차를 안내해 드립니다.


    [해지 및 상품 전환 절차]

    1. 본인 인증: 상담원에게 성함과 생년월일을 말씀하시어 본인 확인을 수행합니다.

    2. 잔액 확인 및 정산: 현재 모임통장에 남아 있는 잔액을 확인하고, 멤버들에게 정산하거나 모임주의 개인 계좌로 이체합니다.

    3. 멤버 해제: 초대된 모든 멤버를 모임에서 제외하거나 모임 해체 요청을 하십니다.

    4. 해지 완료: 계좌 폐쇄 또는 일반 입출금통장으로의 전환을 요청하시면 저희가 처리를 도와드립니다. 처리가 완료되면 앱 알림을 통해 최종
    결과를 확인하실 수 있습니다.


    [정보 변경 절차]

    - 모임 이름 변경이나 모임주 정보 변경이 필요하신 경우, 동일하게 성함과 생년월일로 본인 인증을 하신 후 변경 내용을 말씀해 주십시오. 저희가
    즉시 반영하여 처리해 드리겠습니다.


    주의사항: 계좌가 해지되면 해당 계좌를 통한 모든 자동이체 및 결제 서비스가 중단되므로 사전에 반드시 확인하시기 바랍니다.'
