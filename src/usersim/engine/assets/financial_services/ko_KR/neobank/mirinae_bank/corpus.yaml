  institution_id: mirinae_bank
- id: 913d2a8c-9952-529f-93a8-153e412383b1
  title: '미리내 입출금통장: 개인정보 처리 안내'
  body: '미리내뱅크는 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 소중한 정보와 자산을 안전하게 관리합니다.


    [개인정보 수집 및 이용 목적]

    - 금융 거래의 실명 확인 및 계좌 개설: 금융실명법에 따라 비대면 실명확인 절차를 통해 신분증 정보와 본인 명의 계좌 정보를 처리합니다.

    - 금융 서비스 제공 및 계약 이행: 입출금, 송금, 금리(연 0.1%) 적용 및 수수료(0원) 혜택 제공을 위해 필요한 정보를 처리합니다.

    - 법적 의무 준수: 금융위원회 및 금융감독원의 감독을 준수하며, 관련 법령에 따른 보고 및 확인 절차를 위해 정보를 활용합니다.


    [개인정보 보호 조치]

    - 주민등록번호는 법령이 허용하는 경우에만 제한적으로 처리하며, 그 외의 민감 정보는 엄격히 암호화하여 관리합니다.

    - 고객님의 정보 변경 요청 시, 반드시 성함과 생년월일을 통한 본인 확인 절차를 거쳐 무단 변경을 방지합니다.


    [고객의 권리]

    고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 개인정보 처리와 관련한 상세 내용은 앱 내 개인정보 처리방침
    전문에서 확인하십시오.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 407d3122-a83c-5b7e-8965-74e415f86939
  title: '미리내 입출금통장: 이 상품을 사칭한 사기 주의'
  body: '미리내뱅크를 사칭하여 미리내 입출금통장의 혜택이나 계좌 상태를 빌미로 개인정보를 요구하는 금융사기가 발생하고 있습니다. 고객님께서는
    아래의 주의 사항을 반드시 확인하시어 자산을 안전하게 보호하시기 바랍니다.


    미리내뱅크는 어떠한 경우에도 고객님의 카드 번호, 비밀번호, CVV, 또는 주민등록번호와 같은 민감한 정보를 전화나 문자 메시지로 요구하지
    않습니다. 특히, ''계좌가 정지되었다''거나 ''특별 금리 혜택을 제공한다''며 외부 링크 클릭을 유도하는 행위는 전형적인 스미싱 수법이므로
    각별히 주의하십시오.


    만약 보이스피싱이나 스미싱 등의 금융사기 피해가 의심되거나 발생한 경우에는 즉시 당사 고객센터를 통해 지급정지를 요청하시고 피해구제 신청 절차를
    진행하시기 바랍니다. 신속한 조치가 고객님의 소중한 자산을 지키는 가장 확실한 방법입니다.


    안전한 금융 거래를 위해 항상 공식 앱을 이용해 주십시오.'
