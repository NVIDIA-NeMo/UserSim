- id: 441fc03d-70bd-58c5-a9e8-ebcdadfe0f18
  title: '미리내 입출금통장: 약관 변경 안내'
  body: '미리내 입출금통장의 이용 약관 변경 사항에 대해 안내드립니다. 본 안내는 고객님께서 다른 금융 서비스와 비교 검토하실 때 참고하실
    수 있도록 작성되었습니다.


    [주요 약관 내용 및 변경 사항]

    - 수수료 체계: 미리내뱅크는 ''수수료 제로'' 정책을 지향합니다. 이에 따라 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 및 ATM
    출금 수수료 0원 정책을 명문화하여 고객의 금융 부담을 최소화합니다.

    - 금리 적용: 입출금통장 금리는 연 0.1%로 적용되며, 이는 약관에 따라 변동될 수 있습니다. 금리 변경 시 앱 내 공지사항 및 개별 알림을
    통해 안내드립니다.

    - 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다.


    [약관 변경 절차]

    약관 변경 시 미리내뱅크는 변경 예정일 1개월 전까지 앱 내 공지 및 전자우편 등으로 개별 고지합니다. 고지된 내용에 대해 명시적으로 거부
    의사를 표시하지 않으신 경우, 변경된 약관에 동의하신 것으로 간주됩니다.


    [계약의 종료]

    고객님은 언제든지 앱을 통해 계좌 해지를 요청하실 수 있으며, 은행은 금융실명법 및 관련 법령에 따라 계좌를 관리합니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: terms_conditions
  source_authority: official
