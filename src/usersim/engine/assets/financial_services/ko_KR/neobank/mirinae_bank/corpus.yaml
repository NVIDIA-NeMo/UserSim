- id: 767d10c4-809f-5467-88be-90d8d12d1e93
  title: '미리내 체크카드: 캐시백 비율 안내'
  body: '문: 미리내 체크카드의 캐시백 혜택은 얼마나 되나요?

    답: 미리내 체크카드로 결제 시, 결제 금액의 0.5%를 캐시백으로 돌려드립니다.


    문: 캐시백은 어떻게 적용되나요?

    답: 별도의 전월 실적 조건 없이 결제 시 0.5%의 비율이 적용됩니다. 구체적인 적립 및 지급 시점은 앱 내 이용 내역에서 확인하실 수 있습니다.


    더 자세한 상품 정보는 ''미리내 체크카드: 상품 개요''에서 확인해 주십시오.'
