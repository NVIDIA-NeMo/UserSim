- id: 3e92f005-a0fa-5398-b582-30c47b12e609
  title: '미리내 입출금통장: 필요 서류'
  body: '미리내 입출금통장 개설을 위해 필요한 서류 및 준비물은 다음과 같습니다. 모든 절차는 비대면 실명확인으로 진행됩니다.


    - 주민등록증 또는 운전면허증: 본인 확인 및 실명 확인을 위한 신분증 원본이 필요합니다.

    - 본인 명의의 타행 계좌: 비대면 실명확인 과정 중 본인 계좌 확인 절차를 위해 필요합니다.

    - 본인 명의의 스마트폰: 미리내뱅크 앱 설치 및 인증 번호 수신을 위해 필요합니다.'
