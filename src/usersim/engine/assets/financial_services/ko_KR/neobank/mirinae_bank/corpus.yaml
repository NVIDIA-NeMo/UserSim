  institution_id: mirinae_bank
- id: 2e0e4e1f-0c99-593e-ac86-4984f8796dd2
  title: '모임통장: 금리·요율이 정해지는 방식과 적용'
  body: '미리내뱅크 모임통장의 금리 적용 방식에 대해 안내드립니다.


    1. 적용 금리

    모임통장은 연결된 입출금 계좌의 금리 체계를 따르며, 현재 모든 잔액에 대해 연 0.1%의 입출금통장 금리가 동일하게 적용됩니다. 별도의 잔액
    구간이나 우대 조건 없이 평면적으로 적용되는 구조입니다.


    2. 금리 결정 및 변경

    금리는 금융위원회의 가이드라인과 시장 금리 상황을 반영하여 미리내뱅크 내부 금리 결정 위원회에서 책정합니다. 금리가 변경될 경우, 상품 약관에
    따라 모바일 앱 공지사항 및 개별 알림을 통해 고객님께 안내드립니다.


    3. 이자 지급 방식

    적용된 0.1%의 금리에 따라 계산된 이자는 정해진 이자 지급일에 계좌로 입금됩니다. 이때 15.4%의 원천징수 세액을 제외한 순금액이 지급됩니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: rate_sheet
  source_authority: official
