- id: 00db6fe4-9c1f-5ac3-9457-438e2717ab71
  title: '미리내 입출금통장: 진행 상황과 내역 확인'
  body: '미리내 입출금통장의 거래 내역과 현재 진행 중인 송금 상황을 확인하는 방법입니다.


    **필요 사항**

    - 미리내뱅크 앱 로그인 상태


    **확인 절차**

    1. 앱 메인 화면에서 ''미리내 입출금통장'' 계좌를 선택하십시오.

    2. 화면 하단에 표시되는 ''거래 내역'' 목록을 통해 최근 입출금 내역을 실시간으로 확인하실 수 있습니다.

    3. 특정 기간의 내역이 필요하신 경우, 상단의 ''필터'' 버튼을 눌러 조회 시작일과 종료일을 설정하십시오.

    4. 송금 진행 상황의 경우, 해당 거래 내역을 클릭하시면 ''처리 완료'' 또는 ''처리 중'' 상태를 상세히 확인하실 수 있습니다.


    **확인 완료**

    - 선택하신 조건에 맞는 거래 일시, 금액, 입금/출금처가 정확히 표시되면 확인이 완료된 것입니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: cf0ff1da-b7f8-500e-8a40-c18cb6a1824c
  title: '미리내 입출금통장: 거래가 거절되거나 제한되었을 때'
  body: '거래 중 ''거래가 거절되었습니다'' 또는 ''이용이 제한된 계좌입니다''라는 메시지가 나타나는 경우의 해결 방법입니다.


    **발생 가능한 원인**

    - 계좌 잔액 부족: 이체 또는 출금하려는 금액이 잔액보다 많은 경우입니다.

    - 지급정지 조치: 보이스피싱 등 금융사기 피해 방지를 위해 계좌의 입출금이 일시적으로 중단된 상태일 수 있습니다.

    - 한도 초과: 설정된 1일 또는 1회 거래 한도를 초과한 경우입니다.


    **확인 및 해결 순서**

    1. 먼저 앱 메인 화면에서 현재 잔액이 충분한지 확인하십시오.

    2. 한도 초과 여부를 확인하시고, 필요한 경우 앱 내 설정에서 이용 한도를 변경하십시오.

    3. 위 사항에 해당하지 않는다면, 당사 상담원에게 성함과 생년월일을 말씀하시어 본인 인증을 수행하십시오.

    4. 상담원이 계좌의 지급정지 여부나 기타 제한 사유를 확인하여 안내해 드릴 것입니다.


    **에스컬레이션**

    - 단순 설정 변경으로 해결되지 않는 복잡한 민원이나 고난도 요청은 내부 전문 상담원에게 연결되어 처리되며, 처리 결과는 앱 알림을 통해 안내받으실
    수 있습니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: troubleshooting
  source_authority: official
