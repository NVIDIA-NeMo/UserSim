- id: e0727a33-9060-5ea6-88cb-2c6c028974be
  title: '미리내 입출금통장: 수수료와 비용'
  body: '미리내 입출금통장의 수수료 체계에 대해 안내해 드립니다.


    **질문: 다른 은행으로 돈을 보낼 때 수수료가 발생하나요?**

    답변: 아니오, 발생하지 않습니다. 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)는 0원입니다.


    **질문: ATM에서 현금을 출금할 때 수수료가 있나요?**

    답변: 아니오, 미리내뱅크는 고객님의 부담을 덜어드리기 위해 ATM 출금 수수료를 0원으로 제공하고 있습니다.


    더 자세한 내용은 ''미리내 입출금통장: 수수료 안내''를 참조하시기 바랍니다.'
  domain: retail_banking
