- id: 13569056-95bc-5be5-a0ce-b109d02dfce5
  title: '미리내 체크카드: 부정사용으로부터 고객을 보호하기 위해'
  body: '미리내뱅크는 고객님의 소중한 자산을 보호하기 위해 강력한 보안 체계를 운영하고 있습니다. 최근 체크카드를 겨냥한 보이스피싱 및 스미싱
    사례가 증가하고 있으니 각별한 주의를 당부드립니다.


    미리내뱅크는 어떤 경우에도 고객님께 카드 번호, 비밀번호, CVV 번호, 또는 주민등록번호 전체와 같은 민감한 정보를 전화나 메시지로 요구하지
    않습니다. 계좌 정보 변경 등 본인 확인이 필요한 경우, 반드시 성함과 생년월일만을 통해 인증을 수행합니다. 만약 이러한 민감 정보를 요구하는
    연락을 받으셨다면 이는 금융사기를 의심해야 합니다.


    카드 분실, 도난 또는 부정사용이 의심되는 경우 즉시 미리내뱅크 앱을 통해 사용 정지를 신청하십시오. 부정사용 신고가 접수되면 즉각적인 지급정지
    조치가 이루어지며, 신고 시점에 따라 부정사용 금액에 대한 보상 범위가 달라질 수 있으므로 발견 즉시 조치하시는 것이 가장 중요합니다. 모든
    분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됩니다.


    자세한 법적 기준은 ''법령·제도 안내: 체크카드''를 참고하시기 바랍니다.'
  domain: cards
  product_category: mirinae_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
