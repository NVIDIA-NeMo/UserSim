- id: c09f3020-ed89-5cdd-a290-ced8e3b00915
  title: invite_group_member 도구 설명서
  body: "이 도구는 기존에 개설된 모임통장에 새로운 멤버를 초대하는 기능을 수행합니다. 상담원은 모임주 인증 완료 후 이 도구를 직접 호출하십시오.\n\
    \n- 호출 시그니처: `invite_group_member(account_id, member_name, member_contact)`\n\
    - 입력 매개변수:\n    - `account_id`: `get_accounts`를 통해 확인한 대상 모임통장의 고유 식별자입니다.\n \
    \   - `member_name`: 초대 대상자의 성함입니다.\n    - `member_contact`: 초대 대상자의 연락처입니다.\n\
    - 실행 결과: 해당 멤버에게 모임통장 초대 메시지가 발송되며, 수락 시 멤버로 등록됩니다."
