- id: 31669024-4a56-51e1-89ab-6e8fc16b0935
  title: '미리내 정기예금: 추천·장기 이용 혜택'
  body: '미리내뱅크를 처음 이용하시는 고객님과 장기 고객님을 위해 특별한 혜택을 안내드립니다.


    기간: 2026년 1월 1일부터 2026년 3월 31일까지

    혜택: 미리내 정기예금 1년 상품 가입 시 연 3.5%의 금리를 제공합니다.


    안정적인 자산 관리를 위해 최소 가입 금액 10,000원부터 지금 바로 시작해 보십시오. 소중한 자산을 믿고 맡겨주시는 고객님께 최상의 금융
    경험을 제공하겠습니다.'
