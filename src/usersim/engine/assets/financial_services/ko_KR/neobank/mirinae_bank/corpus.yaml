- id: 1a986226-4582-5e05-b714-0e6447b9b469
  title: '모임통장: 약관'
  body: '본 약관은 미리내뱅크 모임통장의 이용 조건 및 권리와 의무를 규정합니다.


    1. 서비스 제공 및 이용

    모임통장은 모임주가 개설한 계좌에 멤버를 초대하여 회비를 공동으로 관리하는 서비스입니다. 모임통장의 최대 멤버 수는 100명으로 제한되며,
    이를 초과하여 멤버를 초대할 수 없습니다.


    2. 금리 및 비용

    본 상품에 적용되는 입출금통장 금리는 0.1%입니다. 금리는 은행의 정책 및 시장 상황에 따라 변경될 수 있으며, 변경 시 앱을 통해 고지합니다.
    이자 수익에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.


    3. 본인 확인 및 책임

    계좌 개설 및 주요 정보 변경 시 금융실명법에 따른 비대면 실명확인 절차를 거쳐야 합니다. 모임주는 계좌의 관리 책임자로서 멤버 초대 및 권한
    관리에 성실히 임해야 하며, 비밀번호 유출 등 고객의 고의 또는 중대한 과실로 인한 사고 발생 시 보상이 제한될 수 있습니다.


    4. 계약의 종료

    모임주는 언제든지 앱을 통해 모임통장을 해지할 수 있으며, 해지 전 잔액 정산 및 멤버 탈퇴 처리를 완료해야 합니다. 해지 절차는 ''모임통장:
    해지·변경·상품 전환'' 안내를 따릅니다.'
