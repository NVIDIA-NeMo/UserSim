- id: dc97c8e4-daeb-5d65-83c3-4c335d97d857
  title: '미리내 입출금통장: 안전한 이용을 위한 수칙'
  body: '미리내 입출금통장을 더욱 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수해 주십시오.


    1. 미리내뱅크는 어떠한 경우에도 고객님의 카드 번호, 비밀번호, CVV 번호, 주민등록번호 전체를 요구하지 않습니다. 이러한 민감 정보를
    요청하는 메시지나 전화는 보이스피싱일 가능성이 매우 높으므로 즉시 중단하십시오.


    2. 출처가 불분명한 URL 링크가 포함된 문자 메시지(스미싱)를 클릭하지 마십시오. 특히 정부 기관이나 금융 기관을 사칭하여 앱 설치를 유도하는
    경우 각별한 주의가 필요합니다.


    3. 계좌의 비밀번호는 주기적으로 변경하시고, 타인에게 공유하지 마십시오.


    [금융사기 피해 발생 시 대응 절차]

    만약 보이스피싱이나 스미싱 등의 피해가 의심된다면, 지체 없이 미리내뱅크 고객센터를 통해 지급정지를 요청하십시오. 즉각적인 지급정지 조치 후
    피해구제 신청 절차를 지원받으실 수 있습니다.


    모든 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됩니다. 고객님의 소중한 자산 보호를 위해 항상 주의를 기울여 주십시오.'
