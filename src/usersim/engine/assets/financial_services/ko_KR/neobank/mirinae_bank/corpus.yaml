- id: 2322302c-b3ea-5016-9d5a-794565dc608c
  title: '모임통장: 필요 서류'
  body: '미리내뱅크 모임통장은 지점 방문 없이 모바일 앱을 통해 간편하게 개설하실 수 있습니다. 가입 단계별 필요 사항은 다음과 같습니다.


    - 비대면 실명확인: 본인 명의의 신분증(주민등록증 또는 운전면허증) 촬영 및 제출이 필요합니다.

    - 본인 인증: 타 금융기관의 본인 명의 계좌를 통한 1원 송금 인증 또는 휴대폰 본인 확인 절차가 필요합니다.

    - 모임 멤버 초대: 멤버를 초대하기 위해 해당 멤버의 연락처 또는 미리내뱅크 앱 내 초대 링크 공유가 필요합니다.


    모든 절차는 앱 내에서 디지털로 진행되며, 별도의 종이 서류 제출은 요구하지 않습니다.'
