  institution_id: mirinae_bank
- id: 684dbb28-152f-5f8e-a902-b1712d04dd1a
  title: '모임통장: 이런 분께 알맞습니다'
  body: '모임통장은 투명한 회비 관리와 편리한 공유가 필요한 모든 모임을 위해 설계된 스마트한 금융 상품입니다.


    다음과 같은 분들께 강력히 추천드립니다:

    - 친구, 동호회, 가족 모임 등 여러 사람이 함께 회비를 모으고 관리하시는 분

    - 회비 입금 여부를 매번 확인하고 공지해야 하는 번거로움을 줄이고 싶으신 모임주

    - 모임 멤버 모두가 실시간으로 잔액과 입출금 내역을 확인하여 투명하게 운영하고 싶으신 분

    - 복잡한 서류 없이 모바일 앱으로 빠르게 공동 관리 계좌를 만들고 싶으신 분


    [주요 특징]

    - 최대 멤버 수: 100명까지 초대 가능하여 대규모 모임도 효율적으로 관리할 수 있습니다.

    - 적용 금리: 입출금통장 금리 0.1%가 적용됩니다.

    - 이용 편의성: 지점 방문 없이 비대면 실명확인을 통해 즉시 개설 가능하며, 앱에서 모든 멤버를 관리할 수 있습니다.


    모임의 성격에 맞는 투명한 자금 관리를 지금 시작해 보십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 8c41e031-a0f8-597c-a1cf-41f0864c1c38
  title: '모임통장: 입출금통장 금리 안내'
  body: 'Q: 모임통장에 적용되는 금리는 얼마인가요?


    A: 미리내뱅크 모임통장의 입출금통장 금리는 0.1%입니다. 이는 모든 모임통장 잔액에 동일하게 적용되는 기본 금리입니다.


    Q: 이자 계산 시 세금이 부과되나요?


    A: 네, 그렇습니다. 발생한 이자에서는 관련 법령에 따라 소득세와 지방소득세를 합산하여 총 15.4%가 원천징수된 후 고객님께 지급됩니다.


    더 자세한 금리 적용 방식은 ''모임통장: 금리·요율이 정해지는 방식과 적용''에서 확인하실 수 있습니다.'
