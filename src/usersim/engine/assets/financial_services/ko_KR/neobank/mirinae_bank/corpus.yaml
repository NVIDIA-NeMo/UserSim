- id: 94357800-ba57-5433-ab0a-653dc79fe4ed
  title: '미리내 입출금통장: 추천·장기 이용 혜택'
  body: '미리내뱅크와 함께하는 고객님을 위해 준비한 특별한 혜택을 안내해 드립니다.


