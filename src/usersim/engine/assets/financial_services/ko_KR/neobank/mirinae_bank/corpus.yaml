  institution_id: mirinae_bank
- id: 3cc53c5f-0387-5bbe-b726-9b387439dc50
  title: '미리내 정기예금: 금리·요율이 정해지는 방식과 적용'
  body: '미리내 정기예금의 금리는 가입 시 선택한 예치 기간에 따라 결정되는 확정 금리 체계를 따릅니다.


    - 6개월 정기예금 금리: 3.2%

    - 1년 정기예금 금리: 3.5%


    적용 방식: 고객님이 예치한 원금에 대해 위 금리가 적용되며, 만기 시점에 일시 지급됩니다. 금리는 가입 시점에 확정되며 예치 기간 동안 변동되지
    않습니다. 단, 이자 지급 시 소득세 및 지방소득세 합계 15.4%가 원천징수된 후 세후 금액이 지급됩니다. 중도 해지 시에는 위 금리가 아닌
    별도의 중도해지이율이 적용됩니다.'
