- id: bbae0453-ee8e-5b6b-9ec1-4052c8e7fcd9
  title: set_card_limits 사용 기준
  body: '상담원은 고객이 미리내 체크카드의 하루 이용한도 변경을 요청할 경우 다음 절차에 따라 업무를 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 사용하여 고객이 보유한 미리내 체크카드의 카드 번호 마지막 4자리를 통해 정확한 `card_id`를
    확인합니다.

    3. 고객에게 변경하고자 하는 구체적인 하루 이용한도 금액을 확인합니다.

    4. 확인된 `card_id`와 요청 금액을 바탕으로 `set_card_limits` 도구를 호출하여 한도 변경을 완료합니다.


    상담원은 한도 변경 가능 범위에 대해 안내해야 하며, 자세한 내용은 ''미리내 체크카드: 한도·제한과 유의사항''을 참고하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: mirinae_bank
- id: 462003aa-bb98-55ac-9664-eb8ffe2129fd
  title: set_card_limits 도구 설명서
  body: "이 도구는 미리내 체크카드의 하루 이용한도를 설정하거나 변경하는 기능을 수행합니다. 상담원은 `verify_identity`를 통해\
    \ 고객 인증을 완료한 후 이 도구를 직접 호출하여 한도를 변경하십시오.\n\n- 호출 시그니처: `set_card_limits(card_id,\
    \ daily_limit)`\n- 입력 매개변수:\n    - `card_id`: `get_accounts` 도구를 통해 확인된 대상 체크카드의\
    \ 고유 식별자입니다.\n    - `daily_limit`: 고객이 요청한 새로운 하루 이용한도 금액입니다.\n- 실행 결과: 지정된 카드의\
    \ 하루 이용한도가 즉시 업데이트됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
