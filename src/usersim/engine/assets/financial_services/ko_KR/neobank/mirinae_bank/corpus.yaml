- id: d1e6aaa8-78cb-500b-aef6-9a7ea550e019
  title: '미리내 입출금통장: 상품 개요'
  body: '미리내 입출금통장은 일상적인 입출금과 송금을 위해 가장 기본이 되는 금융 계좌입니다. 지점 방문 없이 모바일 앱을 통해 쉽고 빠르게
    개설할 수 있으며, 디지털 네이티브 고객님께 최적화된 사용자 경험을 제공합니다.


    본 상품은 고객님의 금융 부담을 덜어드리기 위해 ''수수료 제로'' 정책을 적용하고 있습니다. 다른 은행으로의 이체 수수료(모바일·인터넷뱅킹)는
    0원이며, ATM 출금 수수료 또한 0원으로 제공되어 언제 어디서나 편리하게 자금을 관리하실 수 있습니다.


    적용 금리는 입출금통장 금리 연 0.1%이며, 예금자보호법에 따라 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호받으실
    수 있어 안심하고 이용 가능합니다.


    상세한 수수료 내역은 ''미리내 입출금통장: 수수료 안내''에서, 가입 방법은 ''미리내 입출금통장: 가입과 이용 시작''에서 확인하시기 바랍니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: product_sheet
