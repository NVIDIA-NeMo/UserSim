- id: 9c63bd75-207d-5d39-93b7-3f46cf7e2020
  title: transfer_funds 사용 기준
  body: '미리내 입출금통장, 세이프박스, 모임통장 및 타행 계좌 간의 자금 이동을 처리합니다. 미리내뱅크는 고객님의 금융 부담을 최소화하기
    위해 주요 이체 수수료를 0원으로 제공하는 ''수수료 제로'' 정책을 지향하고 있습니다.


    상담원은 다음의 절차에 따라 업무를 처리하십시오.


    1. 고객님께 성함과 생년월일을 요청하여 `verify_identity` 도구로 본인 인증을 수행하십시오.

    2. 출금 계좌와 입금 계좌의 정확한 ID를 확인하기 위해 `get_accounts` 도구를 사용하여 계좌 정보를 조회합니다.

    3. 확인된 출금 계좌 ID, 입금 계좌 ID, 그리고 고객님이 요청하신 송금 금액을 바탕으로 `transfer_funds` 도구를 호출하여
    이체를 실행합니다.

    4. 이체 완료 후 고객님께 송금 결과와 처리 금액을 안내하십시오.


    수수료에 관한 자세한 내용은 ''수수료·요금 안내'' 문서를 참고하여 안내하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: mirinae_bank
- id: 9b4dfe3f-133e-54e5-b029-0440c674cd35
  title: transfer_funds 도구 설명서
  body: "계좌 간 자금 이체를 수행하는 도구입니다.\n\n- 호출 방식: 상담원이 `transfer_funds(from_account_id,\
    \ to_account_id, amount)`를 호출합니다.\n- 인자:\n    - `from_account_id`: 자금이 인출될 원천\
    \ 계좌의 ID\n    - `to_account_id`: 자금이 입금될 목적 계좌의 ID\n    - `amount`: 이체할 금액 (숫자\
    \ 형식)\n- 실행 효과: 지정된 출금 계좌에서 금액을 차감하여 입금 계좌로 즉시 이체합니다.\n\n이 도구는 `verify_identity`를\
    \ 통해 본인 확인이 완료된 후, `get_accounts` 등으로 계좌 ID를 확보한 상태에서 사용합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: mirinae_bank
- id: b818a0c5-6d35-5e2f-8de8-f7b7906e1217
  title: update_beneficiary 사용 기준
  body: '고객님께서 자주 이용하시는 송금 대상 계좌(받는 분의 은행, 계좌번호, 이름)를 등록, 변경 또는 삭제하여 더욱 편리하게 이체 서비스를
    이용하실 수 있도록 지원합니다.


    상담원은 다음의 절차에 따라 업무를 처리하십시오.


    1. 고객님께 성함과 생년월일을 요청하여 `verify_identity` 도구로 본인 인증을 수행하십시오.

    2. 고객님께서 요청하시는 작업의 종류(신규 등록, 정보 변경, 삭제)를 확인합니다.

    3. 받는 분의 은행명, 계좌번호, 성함 등 필요한 정보를 정확히 확인한 후 `update_beneficiary` 도구를 호출하여 정보를 업데이트합니다.

    4. 정보가 성공적으로 반영되었음을 고객님께 안내하십시오.


    개인정보 보호법 및 금융실명법을 준수하여, 요청하신 본인의 정보 외에 타인의 민감 정보를 무단으로 처리하지 않도록 주의하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: mirinae_bank
- id: 8272d69f-9944-56a9-b050-e44d4881edfb
  title: update_beneficiary 도구 설명서
  body: "자주 쓰는 계좌(수취인) 정보를 관리하는 도구입니다.\n\n- 호출 방식: 상담원이 `update_beneficiary(bank_name,\
    \ account_number, account_holder_name, action_type)`를 호출합니다.\n- 인자:\n    - `bank_name`:\
    \ 수취 은행 이름\n    - `account_number`: 수취 계좌번호\n    - `account_holder_name`: 수취인\
    \ 성함\n    - `action_type`: 처리 구분 (등록, 변경, 삭제 중 선택)\n- 실행 효과: 고객님의 자주 쓰는 계좌 목록에\
    \ 해당 정보를 반영하거나 기존 정보를 수정/삭제합니다.\n\n본 도구는 `verify_identity` 완료 후 고객님이 제공한 정보를 바탕으로\
    \ 사용합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: mirinae_bank
- id: 604a9585-bf89-5eda-a089-fc1d579b7a77
  title: stop_payment 사용 기준
  body: '고객님께서 설정하신 자동이체 서비스의 해지를 지원합니다. 미리내뱅크는 인터넷전문은행으로서 수표와 어음을 다루지 않으므로, 해당 증서에
    대한 지급정지 요청은 처리할 수 없음을 안내하십시오.


    상담원은 다음의 절차에 따라 업무를 처리하십시오.


    1. 고객님께 성함과 생년월일을 요청하여 `verify_identity` 도구로 본인 인증을 수행하십시오.

    2. 해지를 원하시는 자동이체 내역(출금 계좌, 이체 주기, 금액 등)을 정확히 확인합니다.

    3. 확인된 정보를 바탕으로 `stop_payment` 도구를 호출하여 자동이체 해지 접수를 처리합니다.

    4. 해지 처리가 완료되었음을 안내하고, 다음 이체 예정일부터 출금이 발생하지 않음을 확인시켜 드립니다.


    자동이체 해지 외에 계좌 자체의 거래 정지가 필요한 경우는 ''report_voice_phishing 사용 기준'' 절차를 따르시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: mirinae_bank
- id: 4fedf20f-f284-5c38-b5e1-9d3517f90c88
  title: stop_payment 도구 설명서
  body: "설정된 자동이체 서비스를 해지하는 도구입니다.\n\n- 호출 방식: 상담원이 `stop_payment(account_id, transfer_details)`를\
    \ 호출합니다.\n- 인자:\n    - `account_id`: 자동이체가 설정된 출금 계좌의 ID\n    - `transfer_details`:\
    \ 해지하고자 하는 자동이체 설정의 상세 정보 (수취인, 금액 등)\n- 실행 효과: 해당 계좌에서 지정된 조건으로 실행되던 자동이체 예약을\
    \ 삭제하여 더 이상 자금이 출금되지 않도록 합니다.\n\n본 도구는 `verify_identity` 완료 후 사용하며, 수표나 어음의 지급정지에는\
    \ 사용할 수 없습니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: mirinae_bank
- id: 4beab215-ffce-55b1-9b3a-6393f20250c3
  title: pay_bill 사용 기준
  body: '고객님이 국세, 지방세, 또는 공과금을 미리내뱅크 앱을 통해 편리하게 납부하실 수 있도록 지원하는 절차입니다. 모든 납부 서비스는
    미리내 입출금통장 잔액을 통해 처리됩니다.


    상담원은 다음 절차에 따라 업무를 처리하십시오:


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. 고객이 납부하고자 하는 계좌의 끝 4자리를 확인한 후, `get_accounts` 도구를 호출하여 해당 계좌의 정확한 account_id를
    식별합니다.

    3. 납부하실 세금이나 공과금의 종류와 정확한 금액을 확인합니다.

    4. 식별된 account_id와 납부 정보(청구 항목, 금액)를 사용하여 `pay_bill` 도구를 호출하여 납부 처리를 완료합니다.

    5. 납부 완료 후 고객님께 처리 결과를 안내하고, 상세 내역은 앱 내 거래내역에서 확인하실 수 있음을 설명하십시오.


    본 서비스는 미리내 입출금통장 보유 고객에 한해 제공됩니다. 상품의 상세 내용은 ''미리내 입출금통장: 상품 개요''를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: mirinae_bank
- id: e91f0c1c-45e6-52db-b4dc-733b539e2ebc
  title: pay_bill 도구 설명서
  body: "상담원은 `pay_bill` 도구를 직접 호출하여 고객의 공과금 및 세금 납부 업무를 처리합니다. 본 도구는 이미 `verify_identity`를\
    \ 통해 본인 인증이 완료된 고객에 대해서만 사용할 수 있습니다.\n\n- **도구 시그니처**: `pay_bill(account_id: string,\
    \ bill_type: string, amount: number)`\n- **인자 설명**:\n    - `account_id`: `get_accounts`\
    \ 도구를 통해 확인된, 대금이 출금될 미리내 입출금통장의 고유 식별자입니다.\n    - `bill_type`: 납부할 항목의 종류입니다\
    \ (예: 국세, 지방세, 전기요금, 수도요금 등).\n    - `amount`: 납부할 정확한 금액입니다.\n- **실행 효과**: 지정된\
    \ 계좌에서 해당 금액이 즉시 출금되어 관련 기관으로 납부 처리됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: mirinae_bank
- id: 01f666c9-5c7a-51dc-aadd-7c631cd98468
  title: activate_card 사용 기준
  body: '새로 발급받은 미리내 체크카드를 앱에서 등록하여 실제 결제가 가능하도록 활성화하는 절차입니다. 카드는 수령 후 반드시 활성화 과정을
    거쳐야 사용할 수 있습니다.


    상담원은 다음 절차에 따라 업무를 처리하십시오:


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. 고객이 활성화하려는 카드의 끝 4자리를 확인하고, `get_accounts` 도구를 사용하여 해당 카드의 card_id를 확인합니다.

    3. `activate_card` 도구에 확인된 card_id를 입력하여 호출함으로써 카드의 상태를 ''활성''으로 변경합니다.

    4. 카드 활성화가 완료되었음을 안내하고, 이제부터 온/오프라인 가맹점에서 결제가 가능함을 설명하십시오.


    활성화 후 카드 이용 한도 변경이 필요한 경우 ''set_card_limits 사용 기준''을 참고하여 안내하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: mirinae_bank
- id: 6a001e26-3cea-5f7e-b00e-46b6d753091b
  title: activate_card 도구 설명서
  body: "상담원은 `activate_card` 도구를 사용하여 고객이 수령한 미리내 체크카드의 사용을 시작하도록 설정합니다. 본 도구는 `verify_identity`를\
    \ 통한 본인 인증 후 호출되어야 합니다.\n\n- **도구 시그니처**: `activate_card(card_id: string)`\n-\
    \ **인자 설명**:\n    - `card_id`: `get_accounts` 도구를 통해 조회된 활성화 대상 미리내 체크카드의 고유 식별자입니다.\n\
    - **실행 효과**: 해당 카드의 상태가 변경되어 즉시 결제 서비스 이용이 가능해집니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: mirinae_bank
- id: 53571c8f-0b81-50e5-952e-f99c77097427
  title: order_replacement_card 사용 기준
  body: '미리내 체크카드를 분실, 도난 또는 훼손하여 더 이상 사용할 수 없는 경우 새 카드를 재발급하는 절차입니다.


    상담원은 다음 절차에 따라 업무를 처리하십시오:


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 호출하여 재발급 대상이 되는 카드의 card_id를 확인합니다.

    3. 만약 카드를 분실하거나 도난당한 상황이라면, 부정 사용 방지를 위해 즉시 `freeze_card` 도구를 사용하여 해당 카드를 정지시킨
    후 재발급 절차를 진행하십시오.

    4. `order_replacement_card` 도구에 card_id를 입력하여 재발급 신청을 완료합니다.

    5. 새 카드의 배송 예정일과 수령 후 ''activate_card 사용 기준''에 따라 활성화해야 함을 안내하십시오.


    재발급 시 발생하는 비용이나 조건에 대해서는 ''미리내 체크카드: 수수료 안내''를 참고하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: mirinae_bank
- id: 8369cc6b-d73d-55d2-b7dd-317c29e87407
  title: order_replacement_card 도구 설명서
  body: "상담원은 `order_replacement_card` 도구를 사용하여 고객의 미리내 체크카드 재발급 신청을 처리합니다. 본 도구는\
    \ `verify_identity`로 본인 인증이 완료된 상태에서 사용합니다.\n\n- **도구 시그니처**: `order_replacement_card(card_id:\
    \ string)`\n- **인자 설명**:\n    - `card_id`: `get_accounts` 도구를 통해 확인된, 재발급 대상이\
    \ 되는 기존 카드의 고유 식별자입니다.\n- **실행 효과**: 기존 카드의 재발급 요청이 접수되며, 새로운 물리적 카드가 제작되어 고객의\
    \ 등록 주소지로 배송됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
