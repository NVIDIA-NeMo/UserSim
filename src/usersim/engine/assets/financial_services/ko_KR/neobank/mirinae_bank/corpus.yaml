  institution_id: mirinae_bank
- id: 79e0a829-64ce-5181-97a7-22b5fd237ad6
  title: '미리내 체크카드: 상품 고르는 방법'
  body: '금융 상품을 선택하실 때 미리내 체크카드가 제공하는 명확한 강점을 비교해 보십시오.


    - 비용 효율성: 일반적인 신용카드는 연회비가 발생하지만, 미리내 체크카드는 연회비 0원으로 유지 비용이 전혀 없습니다.

    - 즉각적 혜택: 복잡한 전월 실적 조건 없이도 결제 시 0.5%의 캐시백을 제공하여 실용적인 이득을 드립니다.

    - 자산 관리: 신용카드와 달리 계좌 잔액 내에서만 지출하므로 과도한 소비를 방지할 수 있으며, 연말정산 시 30%의 높은 소득공제율이 적용되어
    세제 혜택에 유리합니다.


    따라서 연회비 부담 없이 투명하게 지출을 관리하고, 소소하지만 확실한 캐시백 혜택을 원하시는 고객님께 미리내 체크카드를 강력히 추천합니다.'
  domain: cards
  product_category: mirinae_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 35a6b3dd-503d-5a20-815e-2e758194b4df
  title: '미리내 체크카드: 개인정보 처리 안내'
  body: '미리내뱅크는 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 소중한 정보를 관리합니다.


    [개인정보 수집 및 이용 목적]

    미리내 체크카드의 발급, 유지, 관리 및 거래 내역 확인, 캐시백 0.5% 지급, 국제 브랜드 수수료 1% 정산 등 서비스 제공을 위해 필요한
    최소한의 개인정보를 수집합니다.


    [처리 기준]

    - 주민등록번호: 법령에서 구체적으로 허용하는 경우에 한해 수집 및 처리하며, 그 외에는 대체 수단으로 인증을 수행합니다.

    - 본인 확인: 카드 상태 변경이나 정보 수정 시, 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행함으로써 무단 정보 변경을 방지합니다.

    - 정보 보호: 수집된 정보는 암호화되어 안전하게 보관되며, 외부 유출 방지를 위해 엄격한 접근 제어 시스템을 운용합니다.


    [고객의 권리]

    고객님께서는 언제든지 자신의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 관련 요청은 앱 내 고객센터를 통해 24시간 접수 가능하며,
    요청 접수 후 신속하게 처리해 드리겠습니다. 미리내뱅크는 금융감독원의 가이드라인에 따라 투명하고 안전한 데이터 관리를 약속드립니다.'
  domain: cards
  product_category: mirinae_check
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 3d51a25d-2c3f-5454-85ac-01de3f28c88f
  title: '미리내 체크카드: 이 상품을 사칭한 사기 주의'
  body: '최근 미리내 체크카드의 혜택을 사칭하여 고객님의 개인정보나 금융정보를 요구하는 피싱 및 스미싱 사례가 보고되고 있습니다. 고객님의
    소중한 자산을 보호하기 위해 아래의 주의 사항을 반드시 확인해 주십시오.


    **[주요 사기 수법]**

    1. **캐시백 혜택 오안내**: 미리내 체크카드의 0.5% 캐시백 비율을 훨씬 상회하는 파격적인 혜택을 제공한다며 특정 링크 클릭을 유도하는
    문자 메시지를 발송합니다.

    2. **카드 정보 업데이트 요청**: 카드 유효기간 만료나 보안 강화를 이유로 카드 번호, CVV, 비밀번호 입력을 요구하는 가짜 페이지로
    연결합니다.


    **[미리내뱅크의 보안 원칙]**

    미리내뱅크는 어떠한 경우에도 고객님께 다음과 같은 민감 정보를 요구하지 않습니다.

    - 카드 비밀번호 및 CVV 번호

    - 주민등록번호 전체

    - 계좌 비밀번호 및 OTP 일회용 번호


    **[대응 및 신고 방법]**

    만약 미리내 체크카드를 사칭한 의심스러운 연락을 받으셨거나, 이미 정보를 입력하신 경우 즉시 앱 내 고객센터를 통해 신고하시고 카드 사용 정지를
    요청하십시오. 보이스피싱 등의 피해가 의심될 때는 즉각적인 지급정지 조치가 필요합니다. 자세한 내용은 ''미리내 체크카드: 부정사용으로부터
    고객을 보호하기 위해''에서 확인하실 수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 54f7bf32-8daf-5be4-a5e6-fe809d0a8009
  title: '미리내 체크카드: 한도·제한과 유의사항'
  body: '상담원은 고객 안내 시 미리내 체크카드의 이용 한도와 결제 제한 사항을 정확히 안내하여 혼선을 방지해야 합니다.


    **1. 이용 한도 안내**

    - **하루 이용한도(기본 설정)**: 6,000,000원입니다. 이는 기본 설정값이며, 고객의 요청이나 은행의 심사 기준에 따라 변경될 수
    있습니다.


    **2. 결제 및 출금 제한**

    - **잔액 기반 결제**: 체크카드는 결제 즉시 연결된 예금 계좌에서 대금이 출금됩니다. 따라서 계좌 잔액을 초과하여 결제할 수 없으며,
    잔액 부족 시 거래가 거절됩니다.

    - **서비스 제한**: 분실 신고가 접수되었거나, 은행의 판단에 따라 부정사용이 의심되는 경우 즉시 거래가 제한될 수 있습니다.


    **3. 주요 유의사항**

    - **국제 브랜드 수수료**: 국내 이용 시에는 수수료가 없으나, 해외 가맹점 이용 시에는 1%의 해외 이용 시 국제브랜드 수수료율이 적용되어
    청구됩니다.

    - **소득공제**: 체크카드 사용액은 연말정산 시 총급여의 25%를 초과하는 금액에 대해 30%의 소득공제율이 적용됩니다.


    관련하여 계좌 잔액 확인이 필요한 경우 ''미리내 입출금통장: 상품 개요''를 참고하십시오.'
  domain: cards
  product_category: mirinae_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 7ad68b28-3a6c-577f-8890-085cb504c343
  title: '미리내 체크카드: 하루 이용한도(기본 설정) 안내'
  body: '**Q: 미리내 체크카드를 처음 발급받으면 하루에 최대 얼마까지 사용할 수 있습니까?**


    A: 미리내 체크카드의 하루 이용한도(기본 설정)는 6,000,000원입니다. 고객님께서는 이 한도 내에서 연결된 계좌의 잔액 범위 내로 자유롭게
    결제하실 수 있습니다.


    **Q: 하루 이용한도를 변경하고 싶을 때는 어떻게 해야 합니까?**


    A: 미리내뱅크 모바일 앱의 카드 관리 메뉴에서 본인 인증 후 직접 한도를 변경하실 수 있습니다. 구체적인 변경 절차는 ''미리내 체크카드:
    자주 하는 업무의 처리 절차'' 안내를 참고해 주십시오.'
  domain: cards
  product_category: mirinae_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 70f67c51-b859-5d11-a9c6-ec29ed65fedd
  title: '미리내 체크카드: 진행 상황과 내역 확인'
  body: '미리내 체크카드의 이용 내역과 캐시백 적립 현황을 확인하는 방법입니다. 모든 확인 절차는 미리내뱅크 모바일 앱을 통해 이루어집니다.


    **[준비 사항]**

    - 미리내뱅크 모바일 앱 로그인 상태


    **[확인 단계]**

    1. **카드 메뉴 접속**: 앱 메인 화면에서 ''전체 메뉴'' → ''카드'' → ''내 카드 관리'' 순으로 진입하십시오.

    2. **이용 내역 조회**: ''결제 내역'' 탭을 선택하면 실시간으로 결제된 금액과 가맹점 정보를 확인하실 수 있습니다. 체크카드의 특성상
    결제와 동시에 연결 계좌에서 출금된 내역이 표시됩니다.

    3. **캐시백 적립 확인**: ''혜택'' 또는 ''캐시백 내역'' 메뉴를 통해 결제 금액의 0.5%에 해당하는 캐시백이 정상적으로 적립되었는지
    확인하십시오.

    4. **해외 이용 내역 확인**: 해외 결제 건의 경우, 원금 외에 1%의 해외 이용 시 국제브랜드 수수료율이 합산되어 청구된 최종 금액을
    확인하실 수 있습니다.


    **[확인 결과]**

    - 결제 내역에서는 가맹점명, 결제 일시, 결제 금액이 정확히 표시되며, 캐시백 내역에서는 각 결제 건별로 계산된 0.5%의 적립액을 확인하실
    수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a48cdb76-dccd-5d84-8007-488a25e90809
  title: '미리내 체크카드: 거래가 거절되거나 제한되었을 때'
  body: '**[증상]**

    결제 시 ''잔액 부족'' 또는 ''한도 초과'', ''거래 제한 카드'' 등의 메시지와 함께 결제가 거절되는 경우입니다.


    **[원인 및 체크 리스트]**

    1. **계좌 잔액 부족**: 미리내 체크카드는 연결된 계좌의 잔액 내에서만 사용 가능합니다. 연결 계좌의 잔액이 결제 금액보다 적은지 확인하십시오.

    2. **하루 이용한도 초과**: 당일 총 결제 금액이 하루 이용한도(기본 설정)인 6,000,000원을 초과했는지 확인하십시오.

    3. **카드 상태 이상**: 분실 신고가 되어 있거나, 유효기간이 만료된 경우, 또는 보안상의 이유로 일시 정지된 상태인지 확인하십시오.

    4. **해외 결제 차단 설정**: 해외 가맹점에서 결제 시, 앱 내 설정에서 ''해외 이용 차단''이 활성화되어 있는지 확인하십시오.


    **[해결 방법]**

    - **잔액 부족 시**: 연결 계좌로 자금을 이체하여 잔액을 확보하십시오.

    - **한도 초과 시**: 앱 내 카드 관리 메뉴에서 이용 한도를 증액하십시오.

    - **카드 정지 시**: 앱에서 정지를 해제하거나, 재발급 신청을 진행하십시오.


    **[에스컬레이션]**

    위 사항을 모두 확인했음에도 불구하고 결제가 되지 않는 경우, 상담원에게 요청하십시오. 저희가 카드 상태와 전산 오류 여부를 상세히 진단하여
    조치 결과를 안내해 드리겠습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: troubleshooting
  source_authority: official
