- id: 27fe4f60-9662-5e03-94db-fca4d065d9a3
  title: '세이프박스: 가입부터 이용까지'
  body: '세이프박스는 일상적인 입출금통장과 연결되어 단기 자금을 효율적으로 분리 보관하고 수익을 얻을 수 있는 서비스입니다.


    [상품 주요 혜택]

    - 높은 수익성: 하루만 맡겨도 2%의 세이프박스 금리가 적용되어 효율적인 자금 관리가 가능합니다.

    - 편리한 이동: 앱 내에서 입출금통장과 세이프박스 간의 자금 이동을 실시간으로 처리할 수 있습니다.


    [이용 한도 및 조건]

    - 최대 보관 금액: 세이프박스 내에 보관할 수 있는 최대 금액은 100,000,000원입니다.

    - 가입 대상: 미리내 입출금통장을 보유한 고객님이라면 누구나 앱을 통해 즉시 개설 가능합니다.


    [가입 및 이용 절차]

    1. 미리내뱅크 앱 로그인 후 ''상품몰'' 또는 ''계좌'' 메뉴에서 세이프박스를 선택하십시오.

    2. 서비스 약관에 동의하신 후 보관할 금액을 설정하십시오.

    3. 설정 완료 즉시 세이프박스가 생성되며, 보관된 금액에 대해 2%의 금리가 적용됩니다.


    본 상품은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받는 예금자보호 대상 상품입니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 88de974e-333e-50f3-8e11-8616c163151a
  title: '세이프박스: 수수료와 비용'
  body: '질문: 세이프박스를 이용할 때 별도의 가입비나 유지 수수료가 있습니까?

    답변: 아니요, 세이프박스는 가입비와 월 유지 수수료가 전혀 없는 무료 서비스입니다.


    질문: 세이프박스에서 입출금통장으로 돈을 옮길 때 수수료가 발생하나요?

    답변: 미리내뱅크는 ''수수료 제로'' 정책을 지향하고 있습니다. 세이프박스와 연결 계좌 간의 자금 이동은 수수료 없이 0원으로 이용 가능하십니다.


    더 자세한 내용은 ''세이프박스: 수수료 안내''를 참고해 주십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 8f9cf5f7-d82a-5681-9c7e-57cc37d8234f
  title: '세이프박스: 등록 정보 변경'
  body: '세이프박스 이용과 관련된 고객님의 등록 정보를 변경하는 절차를 안내해 드립니다.


    준비 사항: 본인 명의의 휴대폰 및 본인 확인 정보


    변경 절차:

    1. 상담원에게 등록 정보 변경을 요청하십시오.

    2. 본인 인증을 위해 고객님의 성함과 생년월일을 말씀해 주십시오.

    3. 저희가 고객님의 신원을 확인하면, 변경하고자 하는 정보(예: 연락처, 주소 등)를 정확히 알려주십시오.

    4. 상담원이 변경 내용을 시스템에 반영한 후, 변경 완료 여부를 다시 한번 확인해 드립니다.


    주의 사항: 보안을 위해 비밀번호, CVV, 주민등록번호 전체와 같은 민감 정보는 절대 요구하지 않습니다. 만약 이를 요구하는 연락을 받으셨다면
    즉시 끊고 신고하시기 바랍니다.


    정보 변경이 완료되면 앱 내 ''마이페이지''에서 변경된 내용을 즉시 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 02c8814e-7ca2-5cad-84d4-8ebfa2f421af
  title: '세이프박스: 로그인하거나 접속할 수 없을 때'
  body: '세이프박스 메뉴에 접속이 되지 않거나 앱 로그인이 원활하지 않은 경우, 다음 단계에 따라 조치해 보시기 바랍니다.


    [증상: 앱 로그인 실패 또는 세이프박스 진입 불가]


    1. 네트워크 상태 확인: Wi-Fi 연결이 불안정하거나 모바일 데이터 접속이 제한된 경우 접속이 어려울 수 있습니다. 네트워크 연결을 다시
    확인하십시오.

    2. 앱 버전 업데이트: 구버전 앱을 사용 중인 경우 서비스 접속이 제한될 수 있습니다. 앱스토어 또는 구글 플레이스토어에서 최신 버전으로
    업데이트하십시오.

    3. 계좌 상태 확인: 보안상의 이유로 계좌가 지급정지 상태인 경우 서비스 이용이 제한됩니다. 최근에 금융사기 신고 접수가 있었는지 확인하십시오.


    [해결 방법]

    - 위 조치 후에도 접속이 되지 않는다면, 저희 고객센터로 말씀해 주십시오. 저희가 내부 로그를 분석하여 접속 장애 원인을 파악하겠습니다.


    [에스컬레이션]

    - 단순 오류가 아닌 시스템 장애나 고난도 계정 복구 요청의 경우, 내부 전문 기술팀으로 안건을 전달하여 처리해 드립니다. 이 경우 처리 결과는
    앱 알림을 통해 안내해 드리며, 보통 영업일 기준 1~3일이 소요됩니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 63b79e69-d278-5157-aa27-5cddfdf887ac
  title: '세이프박스: 이용 조건별 차이'
  body: '세이프박스 이용 조건에 따른 적용 기준은 다음과 같습니다.


    - 미리내 입출금통장 보유 여부: 보유 시 → 세이프박스 개설 가능 / 미보유 시 → 입출금통장 먼저 개설 필요

    - 보관 금액 범위: 100,000,000원 이하 → 전액 세이프박스 금리 2% 적용 / 100,000,000원 초과 → 초과분은 입출금통장으로
    자동 이체 및 해당 계좌 금리 적용

    - 본인 인증 완료 여부: 완료 시 → 즉시 이용 가능 / 미완료 시 → 비대면 실명확인 절차 완료 후 이용 가능'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: ea0a2c2b-41b0-5384-bf6f-e6a874a8c1fa
  title: '세이프박스: 상품 고르는 방법'
  body: '자금의 성격에 따라 일반 입출금통장과 세이프박스 중 적절한 상품을 선택하십시오.


    - 일반 입출금통장: 잦은 이체와 결제가 필요한 생활비 관리에 적합합니다. 접근성이 가장 높지만 금리는 낮습니다.

    - 세이프박스: 단기적으로 예치하면서도 언제든 꺼내 쓸 수 있는 비상금 관리에 최적입니다. 2%라는 경쟁력 있는 금리를 제공하며, 최대 100,000,000원까지
    보관할 수 있습니다.


    매일 이자가 붙으면서도 필요할 때 즉시 인출하시려면 세이프박스를 추천해 드립니다. 반면, 수년 동안 자금을 묶어 더 높은 수익을 추구하신다면
    정기예금 상품이 더 나은 선택이 될 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a35cbaac-f730-596a-9ca2-08b330b53772
  title: '세이프박스: 개인정보 처리 안내'
  body: '미리내뱅크는 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 정보를 안전하게 관리합니다.


    [수집 및 이용 목적]

    세이프박스 서비스 제공을 위해 고객님의 성함, 생년월일, 연락처 및 계좌 정보를 수집합니다. 이는 본인 확인, 금리 적용 및 이자 계산, 그리고
    금융사고 방지를 위한 필수 정보입니다.


    [개인정보 보호 조치]

    고객님의 소중한 정보는 암호화되어 저장되며, 인가된 담당자만이 엄격한 권한 관리 하에 접근할 수 있습니다. 특히 주민등록번호는 법령이 허용하는
    경우에 한해서만 처리하며, 그 외의 민감 정보는 수집하지 않습니다.


    [예금자 보호 및 법적 고지]

    세이프박스는 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호받습니다. 다만, 실적 배당형 투자상품은 보호 대상이
    아니며 세이프박스는 예금 상품으로서 보호 대상에 포함됩니다. 본 서비스 이용 중 발생하는 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라
    공정하게 처리됩니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 831f58e8-064f-54a0-8f31-d36daf992988
  title: '세이프박스: 이 상품을 사칭한 사기 주의'
  body: '최근 미리내뱅크의 세이프박스 상품을 사칭하여 고수익을 보장한다며 개인정보나 금융정보를 요구하는 금융사기 사례가 보고되고 있습니다.
    고객님께서는 아래의 주의 사항을 반드시 숙지하시어 소중한 자산을 보호하시기 바랍니다.


    미리내뱅크는 어떠한 경우에도 고객님께 전화나 문자 메시지를 통해 카드 번호, 비밀번호, CVV 번호, 주민등록번호 전체를 요구하지 않습니다.
    특히 세이프박스의 2% 금리보다 훨씬 높은 비정상적인 수익률을 제시하며 별도의 앱 설치나 링크 클릭을 유도하는 경우, 이는 보이스피싱이나 스미싱일
    가능성이 매우 높으므로 즉시 중단하십시오.


    만약 세이프박스 사칭 문자를 통해 금융정보를 제공했거나 의심스러운 거래가 발견되었다면, 즉시 고객센터를 통해 지급정지를 요청하시고 피해구제
    신청 절차를 진행하시기 바랍니다. 금융사기 피해는 신속한 대응이 가장 중요합니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: b49d285c-6a32-5d6a-b1a0-3c0a25a949f0
  title: '세이프박스: 한도·제한과 유의사항'
  body: '세이프박스는 입출금통장과 연계하여 단기 자금을 효율적으로 관리할 수 있도록 설계된 상품입니다. 상담 시 다음의 한도 및 제한 사항을
    정확히 안내해 주십시오.


    1. 보관 금액 한도

    세이프박스의 최대 보관 금액은 100,000,000원입니다. 해당 한도를 초과하는 금액은 세이프박스로 이동할 수 없으며, 연결된 입출금통장에
    보관됩니다.


    2. 금리 적용

    보관 금액에 대해 연 2%의 금리가 적용됩니다. 이 금리는 일별 잔액을 기준으로 계산되어 지급됩니다.


    3. 예금자 보호

    본 상품은 예금보험공사를 통해 보호됩니다. 미리내뱅크의 다른 예금 상품을 포함하여 예금자 1인당 원금과 소정의 이자를 합해 최대 1억원까지
    보호받으실 수 있습니다.


    4. 이용 제한

    세이프박스에 보관된 금액은 직접 결제나 이체가 불가능합니다. 자금을 사용하시려면 먼저 연결된 입출금통장으로 금액을 이동시켜야 합니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 4e22b0a6-a989-5ee9-9072-43241fc27c25
  title: '세이프박스: 가입과 이용 조건'
  body: '질문: 세이프박스에 가입하려면 어떤 조건이 필요한가요?

    답변: 세이프박스는 미리내뱅크의 입출금통장을 보유하신 고객님이라면 누구나 모바일 앱을 통해 간편하게 개설하실 수 있습니다. 다만, 계좌 개설
    시 금융실명법에 따라 비대면 실명확인 절차가 필요하며, 신분증 확인과 본인 명의 계좌 확인을 완료하셔야 합니다.


    질문: 가입 시 별도의 서류가 필요한가요?

    답변: 아닙니다. 모든 과정은 모바일 앱에서 비대면으로 진행되므로, 유효한 신분증만 준비하시면 별도의 서류 제출 없이 즉시 가입이 가능합니다.
    자세한 내용은 ''미리내 입출금통장: 가입 대상''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: ce2701e8-4554-5e36-9427-f0117767cc09
  title: '세이프박스: 진행 상황과 내역 확인'
  body: '세이프박스에 보관 중인 자금의 변동 내역과 누적된 이자를 확인하는 방법입니다.


    1. 본인 인증

    상담원에게 세이프박스 내역 확인을 요청하십시오. 정확한 정보 조회를 위해 고객님의 성함과 생년월일을 말씀해 주십시오.


    2. 보관 금액 확인

    현재 세이프박스에 보관되어 있는 정확한 잔액을 안내받으십시오. 최대 보관 한도인 100,000,000원 중 얼마가 예치되어 있는지 확인하실
    수 있습니다.


    3. 이자 발생 내역 확인

    적용 금리인 2%에 따라 계산된 일별 이자 발생 현황과 최근 지급된 이자 금액을 확인하십시오.


    4. 입출금 내역 조회

    입출금통장에서 세이프박스로 이동한 금액과 다시 반환된 금액의 일시 및 액수를 확인하여 자금 흐름을 파악하십시오.


    이 모든 내역은 미리내뱅크 모바일 앱의 세이프박스 상세 화면에서도 실시간으로 직접 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
