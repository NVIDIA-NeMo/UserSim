- id: c019295a-422e-5f60-9fec-7c8aa4a8e82a
  title: '미리내 정기예금: 거래가 거절되거나 제한되었을 때'
  body: '상품 가입이나 해지 시 거래가 거절되는 경우, 다음의 원인을 순차적으로 확인하시기 바랍니다.


    1. 증상: 가입 신청 중 ''잔액 부족'' 메시지가 발생하는 경우

    - 원인: ''미리내 정기예금'' 가입을 위해 연결된 입출금 계좌에 최소 가입 금액인 10,000원 이상의 잔액이 없는 경우입니다.

    - 해결: 연결 계좌의 잔액을 확인하시고, 부족한 금액을 채운 후 다시 시도하십시오.


    2. 증상: ''본인 인증 실패''로 인해 다음 단계로 진행되지 않는 경우

    - 원인: 입력하신 성함이나 생년월일이 등록된 정보와 일치하지 않거나, 비대면 실명확인 서류의 유효기간이 만료된 경우입니다.

    - 해결: 정확한 정보를 다시 입력하시거나, 유효한 신분증으로 실명확인을 갱신하십시오.


    3. 증상: ''계좌 상태 제한''으로 거래가 불가한 경우

    - 원인: 금융사기 의심 거래로 인해 계좌가 지급정지 상태이거나, 내부 보안 정책에 의해 일시적으로 제한된 경우입니다.

    - 해결: 본인 확인 후 제한 사유를 확인하십시오. 만약 보안 이슈로 인한 제한이라면 전문 상담원이 내부 에스컬레이션 경로를 통해 상세 사유를
    확인하고 해제 절차를 안내해 드릴 것입니다.'
