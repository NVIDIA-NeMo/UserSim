  institution_id: mirinae_bank
- id: 5ff10dd9-448d-58aa-b4d6-0164df01e332
  title: '모임통장: 예상과 다른 수수료나 금액'
  body: '고객님께서 확인하신 모임통장의 잔액이나 출금 금액이 예상과 다를 때, 다음 사항을 순서대로 확인해 주십시오.


    1. 원천징수 세금 확인

    이자가 지급될 때 15.4%의 소득세와 지방소득세가 자동으로 차감됩니다. 실제 수령액이 계산된 이자보다 적다면 원천징수 세액이 반영된 것인지
    확인하십시오.


    2. 외부 브랜드 수수료 확인

    미리내뱅크는 기본적으로 이체 및 ATM 수수료 0원 정책을 지향하지만, 해외 결제나 국제 브랜드 이용 시에는 외부 비용으로 인해 합리적인 수준의
    수수료가 부과될 수 있습니다. 이용 내역에서 수수료 항목을 확인하십시오.


    3. 멤버 간 입금 내역 대조

    모임 멤버가 입금한 금액이 정확히 반영되었는지, 혹은 잘못된 계좌로 입금된 내역이 없는지 앱의 거래 내역을 다시 한번 대조하십시오.


    위의 사항을 확인했음에도 금액이 맞지 않는 경우, 저희 상담원에게 상세 내용을 말씀해 주십시오. 내부 에스컬레이션 경로를 통해 전문 상담원이
    정밀 분석을 수행하며, 필요 시 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리해 드리겠습니다.'
