- id: fe5c7b07-1f05-5f91-949d-5a64cddb45e2
  title: '세이프박스: 진행 중인 이벤트'
  body: '미리내뱅크 고객님을 위한 ''세이프박스 챌린지'' 이벤트를 진행합니다!


    **이벤트 기간**: 2026년 1월 1일부터 2026년 3월 31일까지

    **참여 방법**: 이벤트 기간 중 세이프박스를 개설하고 1,000,000원 이상을 30일 동안 유지하십시오.

    **혜택**: 조건 충족 시, 추첨을 통해 세이프박스 기본 금리(연 2%) 외에 추가 리워드를 제공해 드립니다.


    지금 바로 세이프박스에 소중한 자금을 보관하시고, 연 2%의 금리 혜택과 이벤트 행운을 동시에 잡으십시오!'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: promo_notice
  source_authority: official
  placeholder: true
