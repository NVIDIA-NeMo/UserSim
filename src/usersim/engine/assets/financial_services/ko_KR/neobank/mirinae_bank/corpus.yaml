- id: 4eaf5fe8-ba7b-57fb-ad7f-52b1129f8c44
  title: '모임통장: 금리·요율 안내'
  body: '모임통장에 적용되는 금리 및 요율에 대해 안내드립니다.


    - **적용 금리**: 입출금통장 금리 0.1% (연이율)

    - **적용 대상**: 모임통장에 예치된 모든 잔액에 대해 동일하게 적용됩니다.

    - **이자 지급 및 과세**: 이자는 약정된 지급일에 계산되어 계좌로 입금되며, 이때 이자 소득세 및 지방소득세 총 15.4%가 원천징수된
    후 지급됩니다.

    - **금리 변동**: 본 금리는 시장 상황 및 미리내뱅크의 금융 정책에 따라 변동될 수 있습니다. 금리가 변경될 경우 앱 내 공지사항을 통해
    안내해 드리겠습니다.


    상품의 전반적인 특징은 ''모임통장: 상품 개요''에서 확인하실 수 있습니다.'
