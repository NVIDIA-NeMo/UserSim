  institution_id: mirinae_bank
- id: b2f79adf-0077-5b67-9389-9d8ea28a1d6e
  title: '미리내 체크카드: 예상과 다른 수수료나 금액'
  body: '결제 금액이 예상과 다르거나 생각지 못한 수수료가 청구된 경우, 다음 내용을 확인해 주십시오.


    **증상: 해외 결제 시 청구 금액이 상품 가격보다 높게 나왔습니다.**

    - **원인**: 해외 가맹점 이용 시에는 상품 가격 외에 ''해외 이용 시 국제브랜드 수수료율''이 추가로 부과됩니다.

    - **확인 사항**: 미리내 체크카드의 국제브랜드 수수료율은 1%입니다. 예를 들어 100,000원을 결제하셨다면, 1%인 1,000원이
    수수료로 추가되어 총 101,000원이 출금됩니다.

    - **해결**: 앱 내 ''결제 상세 내역''에서 원금과 수수료가 분리되어 표시되는지 확인하십시오.


    **증상: 캐시백 금액이 예상보다 적게 계산되었습니다.**

    - **원인**: 일부 가맹점(공공요금, 세금, 상품권 구매 등)은 0.5% 캐시백 적용 대상에서 제외될 수 있습니다.

    - **해결**: 해당 결제 건이 캐시백 제외 대상인지 확인하십시오.


    위의 사항으로 해결되지 않거나 계산 방식에 오류가 있다고 판단되시는 경우, 상담원에게 요청해 주십시오. 내부 에스컬레이션 경로를 통해 전문
    상담원이 상세 내역을 검토하여 안내해 드리겠습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: cbbe25e0-c622-50f0-9937-ae7d1cd83eaa
  title: '미리내 체크카드: 필요 서류'
  body: '미리내 체크카드 발급을 위해 다음의 요건과 서류가 필요합니다.


    | 구분 | 필요 사항 및 서류 | 결과 |

    | :--- | :--- | :--- |

    | 본인 확인 | 유효한 신분증 (주민등록증, 운전면허증 등) | 비대면 실명확인 완료 시 발급 가능 |

    | 계좌 보유 | 본인 명의의 미리내 입출금통장 | 연결 계좌 확인 후 즉시 발급 |

    | 연령 조건 | 만 17세 이상 (법정대리인 동의 시 만 14세 이상) | 발급 승인 |


    모든 절차는 미리내뱅크 앱을 통한 비대면 실명확인으로 진행되며, 별도의 영업점 방문 서류 제출은 필요하지 않습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 0e03f572-489f-5548-b8b4-224738b6838f
  title: '미리내 체크카드: 다른 회사의 일반적인 상품과의 비교'
  body: '미리내 체크카드를 타 금융사의 일반적인 체크카드 상품과 비교한 결과입니다.


    | 비교 항목 | 미리내 체크카드 | 일반적인 타사 상품 |

    | :--- | :--- | :--- |

    | 연회비 | 0원 | 상품에 따라 부과 또는 면제 |

    | 기본 캐시백 | 0.5% (전월 실적 무관) | 0.1%~0.5% (대부분 전월 실적 요구) |

    | 기본 이용한도 | 하루 6,000,000원 | 상품 및 등급별로 상이 |

    | 국제브랜드 수수료 | 1% | 0.2% ~ 1.1% 수준 |


    **추천 대상**

    - **미리내 체크카드**: 전월 실적을 신경 쓰지 않고 매번 0.5%의 혜택을 받고 싶으신 분, 연회비 없는 투명한 카드를 선호하시는 분께
    적합합니다.

    - **타사 상품**: 특정 가맹점(대형마트, 주유소 등)에서 매우 높은 특화 할인율을 제공하는 상품이 필요하신 경우 더 나은 선택지가 될
    수 있습니다.'
  domain: cards
  product_category: mirinae_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 7edc34dd-0204-5ee6-afc1-e007c3166f38
  title: '미리내 체크카드: 위험 안내'
  body: '미리내 체크카드 이용 전, 다음의 위험 및 유의사항을 반드시 확인하시기 바랍니다.


    1. 잔액 기반 결제 위험: 체크카드는 연결된 예금계좌에서 대금이 즉시 출금됩니다. 계좌 잔액이 부족할 경우 결제가 거절될 수 있으며, 이는
    서비스 이용에 불편을 초래할 수 있습니다.


    2. 해외 이용 비용 발생: 해외 가맹점에서 결제 시, 국내 이용과 달리 1%의 해외 이용 시 국제브랜드 수수료율이 부과됩니다. 환율 변동에
    따라 실제 원화 청구 금액이 달라질 수 있음을 유의하십시오.


    3. 부정사용 책임: 카드를 분실하거나 도난당했을 때 즉시 신고하지 않아 발생한 부정사용에 대해서는 관련 법령 및 약관에 따라 보상이 제한될
    수 있습니다. 특히 비밀번호를 타인에게 공유하는 등 중대한 과실이 있는 경우 보상이 어려울 수 있습니다.


    4. 이용 한도 주의: 기본 하루 이용한도는 6,000,000원입니다. 한도를 초과하는 결제는 승인되지 않으므로, 고액 결제가 필요한 경우
    사전에 앱을 통해 한도를 조정하십시오.


    본 안내는 고객님의 안전한 금융 생활을 돕기 위한 고지 사항입니다.'
  domain: cards
  product_category: mirinae_check
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 5ee652ce-9d6e-5ba8-b72b-a6615fc65614
  title: '미리내 체크카드: 금리·요율이 정해지는 방식과 적용'
  body: "미리내 체크카드에 적용되는 주요 요율과 결정 방식은 다음과 같습니다.\n\n- **캐시백 비율**: 0.5%\n  - 적용 방식:\
    \ 결제 금액에 대해 단일 평면 요율로 적용됩니다. 별도의 구간이나 등급 없이 모든 결제 건(제외 대상 제외)에 대해 동일하게 0.5%가 적용됩니다.\n\
    - **해외 이용 시 국제브랜드 수수료율**: 1%\n  - 적용 방식: 해외 브랜드 가맹점에서 이용 시 발생하는 외부 비용을 반영하여 1%의\
    \ 정률 수수료가 부과됩니다. 이는 국제 브랜드사(Visa, Mastercard 등)의 정책과 연동된 합리적 수준의 수수료입니다.\n\n위\
    \ 요율은 미리내뱅크의 상품 정책 및 관련 법령에 따라 변경될 수 있으며, 변경 시 앱 내 고지 사항을 통해 안내드립니다."
  domain: cards
  product_category: mirinae_check
  document_type: rate_sheet
  source_authority: official
  placeholder: true
