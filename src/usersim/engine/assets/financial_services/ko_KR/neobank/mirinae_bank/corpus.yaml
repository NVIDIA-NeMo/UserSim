  institution_id: mirinae_bank
- id: 7bdf8993-aa6f-596b-8960-553eaea1cf71
  title: '모임통장: 상품설명서 주요 내용'
  body: '본 상품의 이용과 관련하여 반드시 확인하셔야 할 법적 고지 사항 및 주요 내용입니다.


    **1. 예금자 보호 제도**

    본 상품은 예금보험공사를 통해 예금자보호법에 따라 보호됩니다. 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다.


    **2. 세금 및 과세**

    본 상품에서 발생하는 이자 소득에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한 이자와 배당을 합한 금융소득이 연 2,000만원을
    초과할 경우 종합과세 대상이 됩니다.


    **3. 실명 확인 및 개인정보 보호**

    금융실명법에 따라 비대면 실명확인 절차를 거쳐야 계좌 개설이 가능하며, 모든 개인정보는 개인정보 보호법에 따라 엄격히 관리됩니다.


    **4. 분쟁 처리**

    상품 이용 중 발생하는 모든 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 신속하고 공정하게 처리하는 것을 원칙으로 합니다.


    상세 상품 정보는 ''모임통장: 상품 개요''를 확인하십시오.'
