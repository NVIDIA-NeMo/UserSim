- id: bf9c5615-f24c-578e-85a3-77fd34a128ed
  title: '모임통장: 상품 개요'
  body: '모임통장은 여러 사람이 투명하게 회비를 모으고 관리할 수 있는 공동 관리 계좌입니다. 모임주가 계좌를 개설하고 멤버를 초대하면, 모든
    멤버가 실시간으로 잔액과 거래 내역을 함께 확인할 수 있어 신뢰 기반의 모임 운영이 가능합니다.


    **주요 상품 정보**

    - **최대 멤버 수**: 모임통장 최대 멤버 수는 100명입니다.

    - **적용 금리**: 입출금통장 금리 0.1%가 적용됩니다.

    - **수수료 혜택**: 고객님의 금융 부담을 덜어드리기 위해 주요 이체 및 ATM 수수료를 0원으로 제공합니다.

    - **예금자 보호**: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받으실 수 있습니다.


    혁신적인 사용자 경험을 통해 복잡한 회비 관리의 번거로움을 해결하십시오. 자세한 가입 방법은 ''모임통장: 가입과 이용 시작''에서 확인하실
    수 있습니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 278f348f-48cd-5fec-9e2d-bf33aa6be529
  title: '모임통장: 모임통장 최대 멤버 수 안내'
  body: '**Q: 모임통장에 최대 몇 명까지 멤버를 초대할 수 있습니까?**

    A: 모임통장의 최대 멤버 수는 100명입니다. 모임주께서는 최대 100명의 멤버와 함께 투명하게 회비를 관리하실 수 있습니다.


    **Q: 멤버 수가 100명에 도달하면 어떻게 됩니까?**

    A: 최대 정원인 100명이 모두 충원된 후에는 추가적인 멤버 초대가 제한됩니다. 이 점 유의하시어 모임 규모에 맞게 멤버를 관리하시기 바랍니다.


    상세 내용은 ''모임통장: 상품 개요''를 참고하십시오.'
