- id: d12a3ab0-d528-51c5-aebd-8099fcf69b17
  title: '미리내 정기예금: 가입부터 이용까지'
  body: "본 문서는 상담원이 고객에게 미리내 정기예금의 가입 및 이용 절차를 안내하기 위한 가이드입니다.\n\n[상품 핵심 요약]\n- 상품명:\
    \ 미리내 정기예금\n- 성격: 일정 기간 예치하여 안정적인 수익을 추구하는 정기예금 상품\n- 최소 가입 금액: 10,000원\n- 적용\
    \ 금리:\n  * 6개월 정기예금 금리: 3.2%\n  * 1년 정기예금 금리: 3.5%\n\n[가입 및 이용 절차]\n1. 가입 단계:\
    \ 고객은 모바일 앱을 통해 비대면 실명확인(신분증 및 본인 명의 계좌 확인)을 완료해야 합니다. 이후 최소 가입 금액인 10,000원 이상의\
    \ 금액을 설정하여 가입합니다.\n2. 운용 단계: 설정한 기간(6개월 또는 1년) 동안 자금을 예치하며, 만기 시 원금과 약정 금리에 따른\
    \ 이자가 지급됩니다.\n3. 해지 단계: 만기 해지 또는 중도 해지가 가능합니다. 중도 해지 시에는 약정 금리보다 낮은 중도해지 이율이 적용됨을\
    \ 안내하십시오.\n\n[법적 고지 및 보호]\n- 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.\n\
    - 세금: 이자 소득에 대해서는 관련 법령에 따라 소득세와 지방소득세가 원천징수됩니다.\n- 준거법: 금융위원회와 금융감독원의 감독을 받으며\
    \ 금융실명법을 준수합니다."
