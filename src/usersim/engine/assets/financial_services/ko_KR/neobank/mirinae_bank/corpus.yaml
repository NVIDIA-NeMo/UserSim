- id: 15eaee71-ceea-50a0-92a1-6110ae5652fd
  title: '미리내 정기예금: 당사의 비슷한 상품과의 비교'
  body: '자금 운용 목적에 따라 **미리내 정기예금**과 **세이프박스** 중 적합한 상품을 선택하십시오.


    | 비교 항목 | 미리내 정기예금 | 세이프박스 |

    | :--- | :--- | :--- |

    | **금리** | 3.2% ~ 3.5% (기간별 차등) | 2% |

    | **자금 접근성** | 만기 시까지 예치 (중도해지 가능) | 언제든 입출금 가능 |

    | **추천 대상** | 일정 기간 자금을 묶어 높은 수익을 원하는 분 | 단기 자금을 효율적으로 관리하며 유동성을 유지하고 싶은 분 |


    유동성이 중요하다면 [세이프박스: 상품 개요] 상품이 더 유리하며, 안정적인 고수익을 원하신다면 미리내 정기예금을 추천드립니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: be81d709-3f9d-5609-a19c-9ab810547aba
  title: '미리내 정기예금: 상품설명서 주요 내용'
  body: '본 상품은 금융위원회와 금융감독원의 감독을 준수하며, 관련 법령에 따라 운영됩니다.


    ### 예금자 보호 안내

    미리내 정기예금은 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다. 보호 한도를 초과하는 금액은 보호 대상에서
    제외됩니다.


    ### 세금 및 원천징수

    발생하는 예금 이자에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한, 연간 금융소득이 2,000만원을 초과하는 경우
    종합과세 대상이 될 수 있습니다.


    ### 가입 및 운영 원칙

    - **최소 가입 금액**: 10,000원부터 가입하실 수 있습니다.

    - **실명 확인**: 금융실명법에 따라 비대면 실명확인 절차를 거친 고객에 한해 계좌 개설이 가능합니다.

    - **개인정보 보호**: 고객님의 정보는 개인정보 보호법에 따라 엄격하게 관리됩니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 552b077d-4ed1-5369-948e-2be7046177ea
  title: '미리내 정기예금: 금리·요율 안내'
  body: '미리내 정기예금의 금리는 예치 기간에 따라 다음과 같이 정해집니다. 본 금리는 모든 가입자에게 동일하게 적용되는 고정 금리입니다.


    - **6개월 정기예금 금리**: 3.2%

    - **1년 정기예금 금리**: 3.5%


    **금리 적용 기준**

    - 위 금리는 연이율 기준이며, 실제 수령하시는 이자는 예치 일수에 따라 계산됩니다.

    - 가입 시점에 결정된 금리는 만기 시까지 변동되지 않습니다.

    - 중도 해지 시에는 가입 기간에 따라 미리 정해진 중도해지 이율이 적용되어 위 금리보다 낮아질 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 8b915d46-5c09-5477-ad70-c6b23fc57f3a
  title: '미리내 정기예금: 진행 중인 이벤트'
  body: '### [이벤트] 목돈 마련을 위한 정기예금 가입 이벤트


    미리내뱅크와 함께 안정적인 자산 관리를 시작하시는 고객님을 위해 특별 안내를 드립니다.


    - **이벤트 기간**: 2026년 1월 1일부터 2026년 3월 31일까지

    - **대상**: 기간 내 미리내 정기예금에 신규 가입하시는 모든 고객님

    - **특별 혜택**: 1년 정기예금 가입 시 업계 최고 수준인 3.5%의 금리를 제공합니다.


    지금 바로 앱에서 1년 만기 상품에 가입하시고 3.5%의 수익을 누리십시오. 가입 금액은 최소 10,000원부터 가능합니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a703d271-5ca4-56d6-8f97-ea3cfc5b1d59
  title: '미리내 정기예금: 부정사용으로부터 고객을 보호하기 위해'
  body: '미리내뱅크는 고객님의 소중한 자산을 보호하기 위해 최신 보안 시스템을 운영하고 있습니다. 특히 미리내 정기예금과 같은 예치 상품을
    대상으로 ''만기 도래''나 ''금리 혜택 적용''을 빙자하여 개인정보를 요구하는 스미싱 및 보이스피싱 사례가 발생하고 있으니 각별히 주의하시기
    바랍니다.


    미리내뱅크는 어떠한 경우에도 고객님께 계좌 비밀번호, 카드 번호, CVV, 주민등록번호 전체를 요구하지 않습니다. 본인 확인이 필요한 경우
    오직 고객님의 성함과 생년월일만을 확인합니다. 만약 신뢰할 수 없는 경로로 상품 해지나 자금 이동을 유도하는 메시지를 받으셨다면, 즉시 앱
    내 고객센터를 통해 확인하십시오.


    금융사기 피해가 의심되거나 발생한 경우에는 즉시 지급정지를 요청하시어 추가 피해를 막으시기 바랍니다. 미리내뱅크는 신속한 피해구제 신청 절차를
    지원하며, 모든 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리합니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: security_advisory
  source_authority: official
