  institution_id: mirinae_bank
- id: daf3230e-5b55-5138-8aa6-c8f616034237
  title: '세이프박스: 처리가 끝나지 않거나 보류 중일 때'
  body: '세이프박스에 자금을 보관하거나 다시 꺼내는 과정에서 화면이 멈추거나 ''처리 중'' 메시지가 지속되는 경우, 다음과 같이 조치해 주십시오.


    **증상**: 자금 이동 버튼을 눌렀으나 잔액이 변하지 않고 상태가 ''보류 중''으로 표시됨


    **원인 및 확인 순서**:

    1. 네트워크 연결 상태 확인: 모바일 데이터 또는 Wi-Fi 연결이 불안정할 경우 통신 지연이 발생할 수 있습니다.

    2. 시스템 점검 시간 확인: 은행 시스템 정기 점검 시간에는 일부 서비스 이용이 제한될 수 있습니다.

    3. 앱 버전 확인: 구버전 앱 사용 시 일시적인 오류가 발생할 수 있으므로 최신 버전으로 업데이트하십시오.


    **해결 방법**:

    - 네트워크를 변경하여 다시 시도하시거나, 앱을 완전히 종료한 후 재접속하십시오.


    **에스컬레이션**:

    위 조치 후에도 문제가 해결되지 않는다면 상담원에게 요청하십시오. 저희가 즉시 내부 전문 팀으로 사건을 접수하여 처리 상태를 확인한 후, 결과
    내용을 앱 푸시 알림이나 메시지로 안내해 드리겠습니다. ''세이프박스: 상품 개요''를 통해 다시 한번 상품의 기본 작동 방식을 확인해 보시기
    바랍니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: c188341a-6dcb-5e65-af4d-d5c70d54f314
  title: '세이프박스: 가입 대상'
  body: '세이프박스 가입을 위한 자격 요건은 다음과 같습니다.


    - 미리내 입출금통장 보유 여부: 필수 보유 (보유 시 가입 가능)

    - 본인 인증 완료 여부: 필수 완료 (비대면 실명확인 절차 완료 시 가입 가능)

    - 계좌 상태: 정상 (압류, 정지 등 거래 제한 계좌는 가입 불가)

    - 보관 가능 한도: 최대 100,000,000원까지 보관 가능'
