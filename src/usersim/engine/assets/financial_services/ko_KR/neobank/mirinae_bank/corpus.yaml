- id: c60cb2c2-0e09-5c0a-8761-3dd397ae2659
  title: '미리내 입출금통장: 금리·요율 안내'
  body: '미리내 입출금통장에 적용되는 금리 및 요율 정보입니다.


    - **입출금통장 금리**: 연 0.1%

    - **금리 적용 방식**: 본 상품은 전 고객에게 동일한 단일 금리를 적용하는 정액 금리 상품입니다. 예치 금액이나 이용 기간에 관계없이
    모든 잔액에 대해 연 0.1%의 금리가 적용됩니다.

    - **이자 지급 및 과세**: 발생한 이자에서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 이자와 배당을 합한 금융소득이 연
    2,000만원을 초과할 경우 다른 소득과 합산하여 종합과세 대상이 됩니다.


    금리는 시장 상황 및 은행 정책에 따라 변동될 수 있으며, 변경 시 앱 내 공지를 통해 안내드립니다.'
