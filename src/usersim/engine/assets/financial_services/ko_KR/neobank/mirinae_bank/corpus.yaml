- id: 0d6f9738-6848-507f-ab54-5a98453f1f72
  title: '모임통장: 부정사용으로부터 고객을 보호하기 위해'
  body: '미리내뱅크는 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 모임통장을 이용하시면서 발생할 수 있는 금융사기 패턴에
    유의하시기 바랍니다.


    최근 모임 멤버를 사칭하여 계좌 비밀번호나 보안카드의 번호를 요구하는 스미싱 및 보이스피싱 사례가 발생하고 있습니다. 미리내뱅크는 어떤 경우에도
    고객님의 비밀번호, CVV, 주민등록번호 등 민감한 정보를 요구하지 않습니다. 계좌 상태 변경 시에는 오직 성함과 생년월일만을 통해 본인 확인을
    수행합니다.


    만약 모르는 번호로부터 모임통장 관련 송금을 유도하는 메시지를 받으셨거나, 부정 사용이 의심되는 경우 즉시 앱 내 고객센터를 통해 지급정지를
    요청하십시오. 금융사기 피해 발생 시 신속한 지급정지와 피해구제 신청 절차를 지원하며, 모든 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라
    공정하게 처리됩니다.


    또한, 모임통장은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받으실 수 있어 안심하고 이용 가능합니다.'
