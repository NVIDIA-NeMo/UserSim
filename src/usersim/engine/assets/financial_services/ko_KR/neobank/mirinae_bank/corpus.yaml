  institution_id: mirinae_bank
- id: 64441818-7362-56d2-bcc6-afffd8fa464d
  title: '미리내 입출금통장: ATM 출금 수수료 안내'
  body: 'Q: 미리내 입출금통장 이용 시 ATM에서 현금을 출금하면 수수료가 발생하나요?


    A: 아니요, 발생하지 않습니다. 미리내뱅크는 고객님의 금융 부담을 줄이기 위해 ''수수료 제로'' 정책을 시행하고 있습니다. 이에 따라 미리내
    입출금통장 고객님께는 ATM 출금 수수료 0원 혜택을 제공하고 있습니다. 마음 편히 이용하십시오.


    더 자세한 수수료 정보는 [미리내 입출금통장: 수수료 안내]에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 00f80e13-72fc-52bc-8ffd-ee885ae107c6
  title: '미리내 입출금통장: 등록 정보 변경'
  body: '미리내 입출금통장에 등록된 고객님의 개인 정보 변경 방법입니다.


    [준비 사항]

    본인 확인을 위해 성함과 생년월일 확인이 필요합니다.


    [변경 절차]

    1. 상담원에게 정보 변경 요청을 하십시오. 이때 변경하고자 하는 항목(예: 연락처, 주소 등)을 정확히 말씀해 주십시오.

    2. 본인 인증을 위해 상담원이 요청하는 성함과 생년월일을 말씀하십시오.

    3. 본인 확인이 완료되면, 변경될 새로운 정보를 상담원에게 제공하십시오.

    4. 상담원이 변경 내용을 확인하고 처리 결과를 안내해 드립니다.

    5. 변경이 완료되었다는 확인 메시지를 받으시면 모든 절차가 끝납니다.


    주의 사항: 미리내뱅크는 보안을 위해 계좌 비밀번호, 카드 CVV, 주민등록번호 전체와 같은 민감 정보는 절대 요구하지 않습니다. 만약 이러한
    정보를 요구하는 요청이 있다면 즉시 중단하시고 신고해 주십시오.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 1402db9e-aa2e-59d0-a7e7-b39879101efc
  title: '미리내 입출금통장: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱에 로그인하거나 계좌 접속이 되지 않는 경우, 다음의 단계에 따라 확인해 주십시오.


    [증상]

    - 로그인 시도 시 오류 메시지가 발생함

    - 인증 단계에서 다음 화면으로 넘어가지 않음

    - 앱 접속 후 계좌 목록이 나타나지 않음


    [원인 및 해결 방법]

    1. 휴대폰 기기 변경 여부 확인: 최근에 휴대폰을 바꾸셨다면 기기 등록과 인증을 다시 진행해야 합니다. 앱 초기 화면의 ''기기 변경/재등록''
    메뉴를 통해 본인 인증을 완료하십시오.

    2. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 불안정할 경우 접속이 제한될 수 있습니다. 네트워크 설정을 확인하신 후 다시
    시도하십시오.

    3. 앱 버전 확인: 구버전 앱 사용 시 호환성 문제로 로그인이 되지 않을 수 있습니다. 최신 버전으로 업데이트하시기 바랍니다.


    [해결되지 않을 경우]

    위의 방법으로도 해결되지 않는다면 상담원에게 요청해 주십시오. 상담원이 고객님의 인증 상태를 확인하고, 필요한 경우 보안 센터의 전문 상담원에게
    케이스를 에스컬레이션하여 해결 방법을 안내해 드리겠습니다. 처리 결과는 등록된 연락처로 개별 안내드립니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: ed7f3f5d-ea95-563a-a1c9-4c5726f01b45
  title: '미리내 입출금통장: 이용 조건별 차이'
  body: '| 구분 | 조건 | 결과 |

    | :--- | :--- | :--- |

    | 가입 가능 여부 | 비대면 실명확인 완료 | 계좌 개설 및 이용 가능 |

    | 가입 가능 여부 | 실명확인 불가/거부 | 계좌 개설 불가 |

    | 수수료 혜택 | 모든 이용 고객 | 타행 이체 수수료 0원, ATM 출금 수수료 0원 적용 |

    | 예금자 보호 | 예금보험공사 보호 대상 | 1인당 원금과 이자 합해 1억원까지 보호 |'
