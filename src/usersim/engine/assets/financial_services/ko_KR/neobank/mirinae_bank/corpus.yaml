- id: d4bfe02e-3322-5dba-8eac-af5bc26e2e07
  title: '미리내 입출금통장: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객 안내 시 참조하는 미리내 입출금통장의 주요 제한 사항 및 유의사항 안내서입니다.


    1. 금리 및 보호 한도

    - 적용 금리: 입출금통장 금리 0.1%가 적용됩니다.

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 최대 1억원까지 보호됩니다.


    2. 가입 및 이용 제한

    - 본 상품은 비대면 실명확인 절차를 거쳐 모바일 앱에서만 개설이 가능합니다. 신분증 확인과 본인 명의의 계좌 확인이 필수적입니다.

    - 계좌 개설 시 금융실명법에 따른 실명확인이 수행되며, 이후 계속거래 시에는 별도의 실명확인이 필요하지 않습니다.


    3. 유의사항

    - 본 상품은 일상적인 입출금과 송금을 위한 기본 계좌입니다. 단기 자금의 효율적인 관리를 원하시는 고객에게는 세이프박스를 함께 안내하십시오.

    - 모든 거래 내역은 앱 내에서 실시간으로 확인 가능하며, 법령에 따라 개인정보 보호법 및 금융실명법을 엄격히 준수하여 관리됩니다.'
