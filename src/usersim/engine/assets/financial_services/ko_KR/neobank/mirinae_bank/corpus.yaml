- id: e40d95a9-e25f-5214-858c-a15fa1a671f8
  title: '미리내 입출금통장: 당사의 비슷한 상품과의 비교'
  body: '미리내 입출금통장과 당사의 다른 단기 자금 관리 상품인 세이프박스를 비교하여 안내해 드립니다.


    | 구분 | 미리내 입출금통장 | 세이프박스 |

    | :--- | :--- | :--- |

    | 주요 용도 | 일상적 입출금 및 송금 | 단기 자금 효율적 보관 |

    | 적용 금리 | 연 0.1% | 연 2% |

    | 이체/출금 수수료 | 0원 | 0원 |

    | 특징 | 금융 생활의 기본 계좌 | 하루만 맡겨도 높은 금리 제공 |


    **추천 대상**

    - **미리내 입출금통장**: 잦은 송금과 결제가 필요하며, 수수료 부담 없이 기본 계좌를 운영하고 싶으신 고객님께 적합합니다.

    - **세이프박스**: 당장 사용하지 않는 여유 자금을 보관하면서 더 높은 수익을 추구하시는 고객님께 적합합니다.


    더 상세한 정보는 ''세이프박스: 상품 개요''를 확인하십시오.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: comparison
  source_authority: official
  placeholder: true
