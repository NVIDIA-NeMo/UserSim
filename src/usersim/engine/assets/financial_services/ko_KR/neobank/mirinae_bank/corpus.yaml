- id: 55bcb5e2-741a-5339-832b-8248ac843ae8
  title: '세이프박스: 가입과 이용 시작'
  body: '세이프박스를 이용하시려면 먼저 미리내 입출금통장을 보유하고 계셔야 합니다. 타 상품과 비교하여 유연한 입출금과 연 2%의 금리를 동시에
    제공하는 세이프박스의 가입 절차는 다음과 같습니다.


    1. 미리내뱅크 모바일 앱에 로그인하신 후, 계좌 홈 화면에서 ''세이프박스 만들기'' 버튼을 선택하십시오.

    2. 상담원을 통해 가입을 진행하시는 경우, 본인 확인을 위해 고객님의 성함과 생년월일을 말씀해 주십시오.

    3. 세이프박스에 보관할 금액을 설정하십시오. 최대 100,000,000원까지 설정 가능합니다.

    4. 약관 동의 후 ''확인'' 버튼을 누르시면 즉시 세이프박스가 생성됩니다.


    정상적으로 가입이 완료되면 앱 메인 화면의 계좌 목록에 세이프박스가 추가되며, 설정하신 금액이 입출금통장에서 세이프박스로 이동한 것을 확인하실
    수 있습니다. 이제부터는 보관된 금액에 대해 연 2%의 금리가 적용됩니다. 가입 대상에 대한 자세한 기준은 ''세이프박스: 가입 대상''에서
    확인하십시오.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: how_to_guide
  source_authority: official
