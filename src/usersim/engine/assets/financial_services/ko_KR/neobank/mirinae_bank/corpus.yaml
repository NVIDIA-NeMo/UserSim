- id: 7abfd204-d880-5a8a-87e4-15e8d063bb06
  title: '미리내 입출금통장: 진행 중인 이벤트'
  body: '**[2026년 신규 고객 환영 이벤트]**


    미리내뱅크와 함께 시작하는 고객님을 위해 준비한 특별한 혜택을 안내해 드립니다.


    - **이벤트 기간**: 2026년 1월 1일부터 2026년 12월 31일까지

    - **대상**: 이벤트 기간 내 미리내 입출금통장을 신규로 개설하신 고객님

    - **제공 혜택**: 미리내뱅크의 ''수수료 제로'' 정책을 통해 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원, ATM 출금 수수료
    0원 혜택을 상시 제공합니다.


    지금 바로 모바일 앱에서 계좌를 개설하시고, 수수료 부담 없는 자유로운 금융 생활을 시작해 보십시오. 본 이벤트는 별도의 신청 없이 계좌 개설
    즉시 혜택이 적용됩니다.'
