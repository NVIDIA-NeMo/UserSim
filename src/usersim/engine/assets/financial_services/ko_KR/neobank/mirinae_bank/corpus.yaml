- id: cd5c82d2-db83-5fa6-b3fe-e57fca8327cf
  title: 자주 묻는 질문
  body: 'Q: 미리내뱅크 고객센터는 어떻게 이용하나요?

    A: 모든 금융 서비스는 모바일 앱을 통해 제공되며, 앱 내 고객센터를 통해 24시간 상담 체계를 유지하고 있습니다.


    Q: 복잡한 민원이나 전문적인 도움이 필요한 경우는 어떻게 하나요?

    A: 고난도 요청이나 복잡한 민원은 내부 에스컬레이션 경로를 통해 전문 상담원이 배정되어 신속하게 처리해 드립니다.


    Q: 예금자 보호는 어떻게 이루어지나요?

    A: 관련 법령에 따라 예금보험공사를 통해 보호받으실 수 있습니다. 자세한 내용은 ''법령·제도 안내: 예금·일상 거래''를 참고하십시오.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: c71e1156-edb4-5c27-b16a-2eb08be1350a
  title: '법령·제도 안내: 예금·일상 거래'
  body: '미리내뱅크는 은행법에 따라 금융위원회와 금융감독원의 감독을 받으며, 관련 법령을 엄격히 준수합니다.


    1. 예금자 보호 제도

    예금자보호법에 따라 예금보험공사를 통해 보통예금, 정기예금, 적금, 외화예금 등을 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지
    보호합니다. 다만, 실적 배당형 투자상품은 보호 대상에서 제외됩니다.


    2. 세금 및 과세

    예금 이자에는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한 이자와 배당을 합한 금융소득이 연 2,000만원을 초과할 경우,
    다른 소득과 합산하여 종합과세 대상이 됩니다.


    3. 실명 확인 및 정보 보호

    금융실명법에 따라 계좌 개설 시 반드시 실명확인을 수행해야 합니다. 모든 개인정보는 개인정보 보호법에 따라 처리하며, 주민등록번호는 법령이
    허용하는 경우에만 수집 및 처리합니다.


    4. 금융사기 피해구제

    보이스피싱 등 전기통신금융사기 피해를 입은 고객님은 송금 은행이나 수취 은행에 피해구제를 신청하여 사기에 이용된 계좌의 지급정지를 요청하실
    수 있습니다.


    5. 분쟁 조정

    금융 거래와 관련한 분쟁은 금융감독원 금융분쟁조정위원회에 조정을 신청하여 공정하게 처리받으실 수 있습니다.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 6613a726-6627-5b2a-9a63-16506704a2a9
  title: '법령·제도 안내: 체크카드'
  body: '미리내뱅크의 체크카드 서비스는 금융위원회와 금융감독원의 감독 하에 운영됩니다.


    1. 결제 원리 및 한도

    체크카드는 결제 즉시 연결된 예금계좌에서 대금이 출금되는 구조입니다. 따라서 계좌 잔액을 초과하여 사용할 수 없습니다.


    2. 분실 및 도난 신고

    카드를 분실하거나 도난당한 사실을 인지하신 즉시 미리내뱅크 또는 카드사에 신고하여 사용 정지 조치를 취하십시오. 신고 전후의 부정사용 보상은
    관련 법령 및 카드 약관에 따라 처리됩니다. 단, 비밀번호를 타인에게 공유하는 등 고객의 고의나 중대한 과실이 있는 경우에는 보상이 제한될
    수 있습니다.


    3. 소득공제 혜택

    연말정산 시 체크카드 사용액은 총급여의 25%를 초과하는 금액에 대해 30%의 소득공제율이 적용됩니다. 이는 신용카드의 공제율(15%)보다
    높은 수준입니다.


    상담원은 수수료, 이용한도, 보상 조건에 대해 정확한 정보를 안내해야 하며, 잘못된 안내를 해서는 안 됩니다.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: cd920416-0aa0-5c8c-b3da-56b8f50eea7c
  title: get_account_transactions 사용 기준
  body: '고객님이 요청하신 계좌의 거래 내역을 확인하기 위해 상담원은 다음 절차를 수행합니다.


    1. 본인 인증 수행

    상담원은 먼저 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료해야 합니다.


    2. 계좌 식별자 확보

    고객님이 계좌번호 뒷자리(last 4 digits)만 제공한 경우, get_accounts 도구를 호출하여 해당 고객님이 보유한 계좌 목록을
    확인하고 정확한 account_id를 식별합니다.


    3. 거래 내역 조회

    확인된 account_id를 사용하여 get_account_transactions 도구를 호출합니다. 이 도구를 통해 조회된 거래 내역을 바탕으로
    고객님께 안내를 제공합니다.


    상담원은 인증되지 않은 상태에서 계좌 정보를 조회하거나 제공해서는 안 되며, 반드시 위 순서에 따라 인증 및 식별 절차를 거쳐야 합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: mirinae_bank
- id: 66fb6559-b4b5-5da0-afbf-9d78a534b571
  title: get_account_transactions 도구 설명서
  body: "get_account_transactions 도구는 특정 계좌의 상세 거래 내역을 조회하는 기능을 수행합니다.\n\n- 호출 방식:\
    \ 상담원이 도구를 직접 호출하여 결과를 얻습니다.\n- 전제 조건: verify_identity를 통한 본인 인증이 완료된 상태여야 합니다.\n\
    - 입력 인자:\n  - account_id (string): 조회를 원하는 계좌의 고유 식별자입니다. (get_accounts 도구를 통해\
    \ 확보 가능)\n- 결과: 해당 계좌에서 발생한 입출금 거래 일시, 금액, 적요 등의 내역이 반환됩니다."
