  institution_id: mirinae_bank
- id: 3254d37a-25a8-50bc-befe-dbc03fa2295b
  title: get_accounts 사용 기준
  body: '고객님이 보유하고 있는 모든 계좌와 카드의 목록을 조회하여, 특정 계좌나 카드의 정확한 ID를 확인하기 위한 절차입니다. 이 과정은
    다른 금융 서비스 도구를 호출하기 전 ID 식별을 위해 반드시 선행되어야 합니다.


    상담원은 다음 절차에 따라 업무를 처리하십시오:


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. `get_accounts` 도구를 호출합니다. 이 도구는 추가 인자 없이 호출되며, 해당 고객이 보유한 모든 account_id, card_id,
    계좌 유형, 끝 4자리, 잔액 및 상태 정보를 반환합니다.

    3. 반환된 목록에서 고객이 언급한 ''계좌 끝 4자리'' 또는 ''카드 끝 4자리''와 일치하는 항목을 찾아 해당 ID(account_id
    또는 card_id)를 확보하십시오.

    4. 확보된 ID를 사용하여 이후의 송금, 납부, 카드 설정 등의 업무를 진행합니다.


    상담원은 조회된 계좌 잔액이나 상태 정보를 고객에게 안내할 때 정중하고 정확하게 전달하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: mirinae_bank
- id: e09bd1b9-1864-52bc-8325-3b5e0110ee50
  title: get_accounts 도구 설명서
  body: '상담원은 `get_accounts` 도구를 호출하여 인증된 고객의 전체 금융 자산 목록을 확인합니다. 본 도구는 `verify_identity`가
    완료된 세션에서만 작동합니다.


    - **도구 시그니처**: `get_accounts()`

    - **인자**: 없음

    - **실행 효과**: 현재 상담 중인 고객의 모든 계좌(account_id, 유형, 끝 4자리, 잔액, 상태)와 연결된 카드(card_id)
    정보를 리스트 형태로 반환합니다. 상담원은 이 결과를 바탕으로 고객이 말하는 계좌의 정확한 시스템 ID를 찾아낼 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: mirinae_bank
- id: da0c8714-e53f-5e50-82ca-9e557d1b0771
  title: open_account 사용 기준
  body: '미리내뱅크의 새로운 금융 계좌를 개설하는 절차입니다. 미리내뱅크는 지점이 없는 인터넷전문은행이므로 모든 과정은 비대면 실명확인 절차를
    통해 이루어집니다.


    상담원은 다음 절차에 따라 업무를 처리하십시오:


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. 고객님이 개설하고자 하는 계좌의 종류(예: 미리내 입출금통장, 모임통장 등)를 확인합니다.

    3. 비대면 실명확인을 위해 신분증 확인과 본인 명의의 타행 계좌 확인 등이 앱을 통해 완료되었는지 확인합니다.

    4. `open_account` 도구를 호출하여 계좌 개설을 요청합니다.

    5. 개설 완료 후 계좌 번호의 일부와 함께, 예금자보호법에 따라 예금보험공사를 통해 1인당 원금과 이자를 합해 1억원까지 보호된다는 점을
    명확히 안내하십시오.


    계좌 개설 가능 대상 및 필요 서류에 대한 상세 내용은 ''미리내 입출금통장: 가입 대상'' 및 ''미리내 입출금통장: 필요 서류''를 참고하시기
    바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: mirinae_bank
- id: 0ee48ba5-51a5-5f3d-a4af-89d331b50491
  title: open_account 도구 설명서
  body: "상담원은 `open_account` 도구를 사용하여 고객의 신규 계좌 개설 요청을 처리합니다. 본 도구는 `verify_identity`를\
    \ 통해 본인 확인이 완료되고, 앱 내에서 비대면 실명확인 절차가 충족된 상태에서 사용합니다.\n\n- **도구 시그니처**: `open_account(account_type:\
    \ string, customer_details: object)`\n- **인자 설명**:\n    - `account_type`: 개설하고자\
    \ 하는 상품의 ID입니다 (예: 'mirinae_ipchulgeum', 'mirinae_moim' 등).\n    - `customer_details`:\
    \ 고객이 제공한 성함, 연락처, 주소 등 계좌 개설에 필요한 기본 정보 객체입니다.\n- **실행 효과**: 시스템 내에 새로운 계좌가 생성되며,\
    \ 고객의 앱 메인 화면에 해당 계좌가 즉시 표시됩니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: mirinae_bank
- id: e65607e0-d1a9-5596-b741-23911797a3c7
  title: close_account 사용 기준
  body: '미리내뱅크의 계좌 해지 요청을 처리하기 위한 상담원 업무 절차입니다. 계좌 해지는 복구가 불가능한 작업이므로 신중하게 처리하십시오.


    1. 본인 확인 수행: 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출합니다. 본인 인증이 완료되지 않은
    상태에서는 다음 단계로 진행할 수 없습니다.

    2. 계좌 식별: `get_accounts` 도구를 사용하여 고객이 보유한 계좌 목록을 조회합니다. 고객이 제시한 계좌번호 끝 4자리를 통해
    해지 대상 계좌의 정확한 account_id를 확인하십시오.

    3. 해지 의사 재확인: 해당 계좌의 잔액 상태를 안내하고, 해지 후 잔액 처리 방식에 대해 고객과 협의합니다. 계좌 해지 시 모든 잔액은
    미리내 입출금통장 등 다른 계좌로 이체되어 잔액이 0원이어야 합니다.

    4. 계좌 해지 실행: 모든 확인이 완료되면 `close_account` 도구에 해당 account_id를 입력하여 계좌 해지 절차를 최종
    완료합니다.


    상세한 해지 및 변경 절차는 ''미리내 입출금통장: 해지·변경·상품 전환'' 문서의 기준을 따릅니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: mirinae_bank
- id: ac41d38a-11f1-580d-876d-2f9a275547f9
  title: close_account 도구 설명서
  body: '이 도구는 고객의 특정 금융 계좌를 영구적으로 해지하는 기능을 수행합니다.


    - 호출 방법: 상담원이 `close_account` 도구를 직접 호출하여 실행합니다.

    - 입력 파라미터: account_id (해지할 계좌의 고유 식별자)

    - 실행 결과: 해당 계좌가 폐쇄되며 더 이상 입출금 거래를 할 수 없습니다. 이 작업은 되돌릴 수 없는(irreversible) 상태 변경
    작업입니다.


    상담원은 `verify_identity`를 통해 본인 인증을 완료한 후, `get_accounts`로 확인된 정확한 account_id를 사용하여
    이 도구를 호출해야 합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: mirinae_bank
- id: afe3b1fc-033a-51aa-92c7-6834f97fa8c4
  title: update_contact_info 사용 기준
  body: '고객의 연락처, 주소 등 등록 정보를 변경하기 위한 상담원 업무 절차입니다. 개인정보 보호법 및 금융실명법을 엄격히 준수하여 처리하십시오.


    1. 본인 확인 수행: 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출합니다. 개인정보 변경 작업 전에는
    반드시 본인 인증이 선행되어야 합니다.

    2. 변경 정보 수집: 고객이 변경하고자 하는 최신 연락처 정보(휴대폰 번호, 이메일 주소 등)를 정확하게 확인합니다.

    3. 등록 정보 업데이트: 수집된 정보를 바탕으로 `update_contact_info` 도구를 호출하여 고객의 프로필 정보를 갱신합니다.

    4. 결과 안내: 정보가 정상적으로 변경되었음을 고객에게 안내하고, 변경된 정보로 안내 문자나 알림이 발송될 수 있음을 고지합니다.


    등록 정보 변경에 관한 일반적인 안내는 ''미리내 입출금통장: 등록 정보 변경'' 문서를 참고하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: mirinae_bank
- id: d8e4585d-6279-518b-9a71-262fe8bdc342
  title: update_contact_info 도구 설명서
  body: '이 도구는 고객의 개인 연락처 정보를 최신 상태로 업데이트하는 기능을 수행합니다.


    - 호출 방법: 상담원이 `update_contact_info` 도구를 직접 호출하여 실행합니다.

    - 입력 파라미터: 고객이 제공한 최신 연락처 세부 정보 (이름, 전화번호, 이메일 등)

    - 실행 결과: 미리내뱅크 시스템에 등록된 고객의 기본 연락처 정보가 즉시 변경됩니다.


    본 도구를 호출하기 전 반드시 `verify_identity`를 통해 고객의 신원을 확인하십시오. 도구의 파라미터로는 상담원이 대화 중 고객으로부터
    직접 전달받은 최신 정보를 입력합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: mirinae_bank
- id: 262dd4a8-b022-580d-afb8-305ba74b6845
  title: get_statements 사용 기준
  body: '고객이 요청한 특정 기간의 거래 명세서를 조회하여 제공하기 위한 상담원 업무 절차입니다.


    1. 본인 확인 수행: 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출하여 본인 인증을 완료합니다.

    2. 계좌 식별: `get_accounts` 도구를 통해 고객의 계좌 목록을 조회하고, 명세서 발급 대상인 계좌의 account_id를 정확히
    확인합니다.

    3. 조회 기간 설정: 고객에게 명세서 조회를 원하는 시작일과 종료일을 확인합니다. (예: 2026년 1월 1일부터 2026년 1월 31일까지)

    4. 명세서 조회 실행: 확인된 account_id와 기간 정보를 `get_statements` 도구에 입력하여 거래 내역을 호출합니다.

    5. 정보 제공: 호출된 명세서 내용을 바탕으로 고객에게 거래 내역을 안내합니다.


    명세서 내용과 실제 내역이 일치하지 않는 경우 ''미리내 입출금통장: 명세서나 내역과 맞지 않을 때'' 절차에 따라 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: mirinae_bank
- id: e9fc39ef-c746-57ad-932c-e8844ded3777
  title: get_statements 도구 설명서
  body: '이 도구는 지정된 계좌의 특정 기간 내 모든 거래 내역을 포함한 명세서를 조회하는 기능을 수행합니다.


    - 호출 방법: 상담원이 `get_statements` 도구를 직접 호출하여 실행합니다.

    - 입력 파라미터: account_id (대상 계좌 식별자), start_date (조회 시작일), end_date (조회 종료일)

    - 실행 결과: 해당 기간 동안 발생한 입출금 거래 내역, 금액, 상대 계좌 정보 등이 포함된 명세서 데이터를 반환합니다.


    상담원은 `verify_identity`로 본인 확인 후, `get_accounts`를 통해 획득한 정확한 account_id와 고객이 요청한
    날짜 범위를 입력해야 합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: mirinae_bank
- id: ce407853-8688-5617-8751-566351f76940
  title: set_alerts 사용 기준
  body: '고객이 원하는 조건에 따라 계좌 알림(푸시 알림, SMS 등)을 설정하거나 변경하기 위한 상담원 업무 절차입니다.


    1. 본인 확인 수행: 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 통해 본인 인증을 완료합니다.

    2. 계좌 식별: `get_accounts` 도구를 사용하여 알림을 설정할 계좌의 account_id를 확인합니다.

    3. 알림 조건 협의: 알림을 받을 거래 유형(입금, 출금), 최소 금액 기준(예: 10,000원 이상 시 알림) 등 고객이 원하는 설정 값을
    구체적으로 확인합니다.

    4. 알림 설정 적용: 확인된 설정 값을 `set_alerts` 도구에 입력하여 알림 환경 설정을 적용합니다.

    5. 완료 안내: 설정된 알림 조건과 적용 시점을 고객에게 명확히 안내합니다.


    알림 설정은 모바일 앱에서도 가능하며, 앱 내 설정 메뉴를 통한 변경 방법도 함께 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: mirinae_bank
- id: 5d1a11d9-cf3d-5e5b-8ad9-2a0e87030e47
  title: set_alerts 도구 설명서
  body: '이 도구는 고객의 계좌에서 발생하는 특정 이벤트(입출금 등)에 대한 알림 설정을 구성하는 기능을 수행합니다.


    - 호출 방법: 상담원이 `set_alerts` 도구를 직접 호출하여 실행합니다.

    - 입력 파라미터: account_id (대상 계좌 식별자), alert_settings (알림 유형, 금액 임계값, 알림 채널 등 설정 정보)

    - 실행 결과: 지정된 account_id의 계좌에 알림 규칙이 적용되어, 조건 충족 시 고객에게 즉시 알림이 발송됩니다.


    본 도구는 `verify_identity`로 신원이 확인된 고객에 한해 제공되며, `get_accounts`를 통해 확인된 account_id를
    사용해야 합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: mirinae_bank
- id: db8f554a-36bf-5a37-8ff0-a4f6c62c1a73
  title: dispute_status 사용 기준
  body: '고객이 신청한 체크카드 부정사용 이의 제기 또는 금융 사고 피해 구제 신청의 처리 현황을 조회하기 위한 상담원 업무 절차입니다.


    1. 본인 확인 수행: 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출해 본인 인증을 완료합니다.

    2. 신청 내역 식별: 고객이 접수한 이의 제기 번호(dispute_id)를 확인하거나, `get_accounts`를 통해 관련 계좌/카드를
    식별합니다.

    3. 현황 조회 실행: `dispute_status` 도구에 해당 식별 정보를 입력하여 현재 조사 진행 단계(접수, 조사 중, 결과 대기,
    완료 등)를 조회합니다.

    4. 결과 안내: 조회된 진행 상태를 고객에게 정중히 안내합니다. 결과가 ''완료''인 경우, 결정 사항과 보상 여부를 함께 설명합니다.


    모든 분쟁 처리는 금융감독원 금융분쟁조정위원회의 기준에 따라 공정하게 처리됨을 안내하십시오. 신규 이의 제기 접수는 ''file_transaction_dispute
    사용 기준''을 따릅니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: mirinae_bank
- id: 717cef6a-d83a-5f1a-b9c2-6f78d7d09c46
  title: dispute_status 도구 설명서
  body: '이 도구는 접수된 거래 이의 제기 또는 금융사기 피해 구제 신청의 현재 처리 상태를 조회하는 기능을 수행합니다.


    - 호출 방법: 상담원이 `dispute_status` 도구를 직접 호출하여 실행합니다.

    - 입력 파라미터: dispute_id (이의 제기 고유 번호) 또는 account_id (관련 계좌 식별자)

    - 실행 결과: 해당 사건의 접수 일자, 현재 처리 단계, 담당 부서 및 예상 완료 시점 등의 상태 정보를 반환합니다.


    상담원은 `verify_identity`를 통해 고객 본인임을 확인한 후, 고객이 제공한 접수 번호나 `get_accounts`로 확인된 계좌
    정보를 사용하여 이 도구를 호출하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: mirinae_bank
