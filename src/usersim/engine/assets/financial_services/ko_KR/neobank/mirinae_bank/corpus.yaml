- id: 4767538d-f573-511e-b6c5-70146cd1ebce
  title: '미리내 입출금통장: 상품 고르는 방법'
  body: '금융 목적에 맞는 최적의 상품을 선택하십시오. 미리내 입출금통장은 일상적인 자금 관리에 특화되어 있습니다.


    - [미리내 입출금통장]: 잦은 송금과 출금이 필요한 분께 적합합니다. 입출금통장 금리 0.1%를 제공하며, 특히 이체 수수료 0원과 ATM
    출금 수수료 0원으로 비용 부담 없이 사용할 수 있습니다.

    - [세이프박스]: 단기 자금을 효율적으로 굴리고 싶은 분께 적합합니다. 입출금통장보다 높은 금리를 제공하여 보관함처럼 활용할 수 있습니다.

    - [모임통장]: 여러 사람과 함께 회비를 투명하게 관리하고 싶은 분께 적합합니다.


    매일 사용하는 기본 계좌가 필요하시다면, 최상의 편의성을 제공하는 미리내 입출금통장을 추천드립니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: comparison
  source_authority: official
