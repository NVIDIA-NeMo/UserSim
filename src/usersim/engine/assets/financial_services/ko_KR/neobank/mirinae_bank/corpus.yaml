  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 713f9ed5-89dd-5a9b-b495-9e2d3ff357b9
  title: '미리내 입출금통장: 해지·변경·상품 전환'
  body: '미리내 입출금통장의 해지 또는 상품 전환을 원하시는 경우, 다음의 절차를 통해 간편하게 처리하실 수 있습니다.


    [계좌 해지 절차]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 해지 요청: 해지하고자 하는 미리내 입출금통장 계좌번호와 해지 의사를 밝혀 주십시오.

    3. 잔액 처리: 계좌에 남아 있는 잔액을 이전할 본인 명의의 타행 계좌 정보를 제공해 주십시오.

    4. 최종 확인: 상담원이 잔액 이전 금액과 해지 처리 내용을 안내해 드리며, 이에 동의하시면 해지가 완료됩니다.


    [상품 전환 안내]

    다른 미리내뱅크 상품으로의 전환을 원하시는 경우, 기존 계좌의 잔액을 유지한 상태에서 새로운 상품으로의 전환 가능 여부를 확인하십시오. 전환
    가능 상품의 경우, 동일한 본인 인증 절차를 거쳐 앱 내에서 즉시 전환 신청을 하실 수 있습니다.


    처리가 완료되면 앱 알림을 통해 최종 결과를 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 9f14b8d2-a414-5ecd-a224-613c79b53723
  title: '미리내 입출금통장: 예상과 다른 수수료나 금액'
  body: '고객님께서 예상하신 금액과 실제 출금액이 다르거나, 예상치 못한 수수료가 발생했다고 느끼시는 경우 다음 순서에 따라 확인을 지원해
    주십시오.


    1. 증상 확인: 고객님께서 어떤 거래에서 얼마의 금액이 예상과 다르게 처리되었는지 구체적으로 확인합니다.

    2. 수수료 항목 대조: 미리내 입출금통장의 기본 정책인 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 및 ATM 출금 수수료 0원이
    정상적으로 적용되었는지 거래 내역을 대조합니다.

    3. 외부 비용 확인: 출금액 차이가 발생했다면, 이는 미리내뱅크의 수수료가 아닌 국제 브랜드 이용 수수료와 같이 외부 기관에서 부과한 비용인지
    확인하십시오.

    4. 오류 가능성 검토: 시스템 오류로 인해 수수료가 잘못 부과된 것이 의심되는 경우, 해당 거래의 승인 번호와 일시를 기록합니다.


    위 단계에서 원인이 명확히 밝혀지지 않을 경우, 내부 에스컬레이션 경로를 통해 전문 상담원에게 사건을 접수하십시오. 전문 팀에서 정밀 조사를
    진행하며, 결과는 영업일 기준 3~5일 이내에 고객님께 안내됩니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
