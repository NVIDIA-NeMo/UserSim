- id: 111e9855-7ee8-5edc-abf1-1e06b9f4b9e8
  title: '미리내 입출금통장: 다른 회사의 일반적인 상품과의 비교'
  body: '미리내 입출금통장은 기존 시중은행의 일반 입출금 상품과 비교하여 다음과 같은 차별점을 가집니다.


    - 수수료 체계: 많은 시중은행이 조건부 수수료 면제 혜택을 제공하는 것과 달리, 미리내 입출금통장은 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)
    0원 및 ATM 출금 수수료 0원을 기본으로 제공하여 금융 부담을 획기적으로 낮췄습니다.

    - 금리: 입출금통장 금리는 0.1%로 제공되어, 매우 낮은 금리를 제공하는 일부 전통적 상품보다 경쟁력을 갖추고 있습니다.

    - 이용 편의성: 지점 방문 없이 앱으로 모든 업무가 처리되는 디지털 네이티브 환경을 제공합니다.


    오프라인 지점의 대면 상담이 반드시 필요하신 분께는 시중은행 상품이 적합할 수 있으나, 합리적인 비용과 극강의 편의성을 추구하시는 분께는 미리내
    입출금통장이 최선의 선택입니다.'
  domain: retail_banking
  product_category: mirinae_ipchulgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 6e6153c2-59f9-56c7-8b41-98b0b63e8e4e
  title: '미리내 입출금통장: 위험 안내'
  body: '미리내 입출금통장 이용 고객님께서 유의하셔야 할 법적 고지 및 위험 사항을 안내드립니다.


    1. 예금자 보호: 본 상품은 예금보험공사를 통해 예금자보호법에 따라 보호됩니다. 보호 한도는 금융회사별로 예금자 1인당 원금과 소정의 이자를
    합해 최대 1억원까지입니다. 이를 초과하는 금액은 보호 대상에서 제외되오니 유의하시기 바랍니다.


    2. 비대면 거래 위험: 모바일 앱을 통한 비대면 거래 특성상, 스마트폰 분실이나 개인정보 유출 시 부정사용의 위험이 있습니다. 타인에게 계좌
    비밀번호나 인증 수단을 공유하지 마십시오.


    3. 법규 준수: 미리내뱅크는 금융위원회와 금융감독원의 감독을 받으며, 개인정보 보호법 및 금융실명법을 엄격히 준수하여 고객님의 정보를 관리합니다.


    4. 원금 손실 가능성: 본 상품은 예금 상품으로, 예금보험공사의 보호 한도 내에서 원금이 보장되며 투자 상품과 달리 실적에 따른 원금 손실
    위험은 없습니다.'
