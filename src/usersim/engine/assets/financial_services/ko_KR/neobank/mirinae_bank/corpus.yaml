- id: 75c31a38-86ff-5b14-b098-47a31967b340
  title: '세이프박스: 약관'
  body: '본 약관은 미리내뱅크가 제공하는 세이프박스 서비스의 이용 조건 및 절차를 규정합니다.


    1. 서비스의 정의: 세이프박스는 미리내 입출금통장과 연결되어 단기 자금을 별도로 보관하고 금리 혜택을 제공하는 서비스입니다.

    2. 금리 및 적용: 고객님께 제공되는 세이프박스 금리는 2%이며, 이는 예치 금액에 대해 적용됩니다. 금리는 은행의 정책 및 시장 상황에
    따라 변경될 수 있으며, 변경 시 앱 내 공지를 통해 안내드립니다.

    3. 보관 한도: 세이프박스의 최대 보관 금액은 100,000,000원으로 제한됩니다. 해당 한도를 초과하여 자금을 보관할 수 없으며, 한도
    초과분은 연결된 입출금통장에 보관됩니다.

    4. 자금의 이동: 고객은 앱을 통해 언제든지 세이프박스 내 자금을 입출금통장으로 이동시키거나 반대로 보관할 수 있습니다.

    5. 계약의 종료: 고객이 앱을 통해 세이프박스 해지를 신청하거나, 연결된 입출금통장이 해지될 경우 본 계약은 자동으로 종료됩니다.


    금리 적용 방식에 대한 상세 내용은 ''세이프박스: 금리·요율이 정해지는 방식과 적용''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: fd15764c-88b3-588d-8c19-60fb4181f2d4
  title: '세이프박스: 이런 분께 알맞습니다'
  body: '세이프박스는 일상적인 지출을 위한 자금과 잠시 아껴두어야 할 자금을 명확히 구분하여 관리하고 싶은 디지털 네이티브 고객님께 최적화된
    상품입니다.


    특히 다음과 같은 분들께 추천드립니다:

    - 하루만 맡겨도 2%의 금리 혜택을 누리며 단기 자금을 효율적으로 운용하고 싶으신 분

    - 입출금통장의 잔액이 너무 많아 계획적인 소비를 위해 자금을 분리 보관하고 싶으신 분

    - 언제든 필요할 때 즉시 꺼내 쓸 수 있는 높은 유동성과 함께 안정적인 수익을 원하시는 분


    세이프박스는 최대 100,000,000원까지 보관 가능하며, 복잡한 가입 절차 없이 앱에서 간편하게 생성하여 사용할 수 있습니다. 효율적인
    자산 관리의 시작을 세이프박스와 함께하십시오.


    상품의 전반적인 특징은 ''세이프박스: 상품 개요''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_safe_box
