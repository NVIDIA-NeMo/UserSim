- id: ddc109aa-0fc0-5646-a409-294258eddab6
  title: '미리내 체크카드: 상품설명서 주요 내용'
  body: '본 상품은 금융위원회와 금융감독원의 감독을 받는 미리내뱅크의 체크카드 상품입니다.


    [주요 고지 사항]

    1. 결제 방식: 체크카드는 사용 즉시 연결된 예금계좌에서 대금이 출금되므로, 계좌 잔액을 초과하여 사용할 수 없습니다.

    2. 수수료 및 혜택: 연회비는 0원이며, 결제 금액의 0.5%가 캐시백으로 제공됩니다. 단, 해외 이용 시에는 국제브랜드 수수료율 1%가
    부과됩니다.

    3. 이용 한도: 기본 하루 이용한도는 6,000,000원이며, 이는 앱을 통해 변경 가능합니다.

    4. 세제 혜택: 체크카드 사용액은 연말정산 시 총급여의 25%를 초과하는 금액에 대해 30%의 소득공제율이 적용됩니다.

    5. 예금자 보호: 카드가 연결된 입출금 계좌의 잔액은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.


    상세 내용은 상품 약관 및 ''법령·제도 안내: 체크카드''를 참고하십시오.'
