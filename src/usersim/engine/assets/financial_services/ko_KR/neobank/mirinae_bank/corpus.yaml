    0원 혜택을 제공합니다. 일상적인 금융 거래의 부담을 완전히 덜어내십시오.


    [추천 혜택]

    지인에게 미리내뱅크를 추천하여 신규 가입이 이루어질 경우, 추천인과 피추천인 모두에게 특별 혜택을 제공합니다. 자세한 참여 방법은 앱 내 이벤트
    페이지를 확인해 주십시오.'
