- id: f9f93ad3-86ec-548a-8df0-bc93f69456c6
  title: '미리내 정기예금: 약관 변경 안내'
  body: '미리내 정기예금의 서비스 품질 향상 및 법령 준수를 위해 다음과 같이 약관이 변경됨을 안내드립니다. 타 금융 상품과 비교하여 당사의
    투명한 운영 방침을 확인하시기 바랍니다.


    [주요 변경 및 준수 사항]


    1. 금리 적용 및 지급

    - 6개월 정기예금 금리는 3.2%, 1년 정기예금 금리는 3.5%로 적용됩니다.

    - 약정된 기간을 채우지 못하고 중도 해지할 경우, 약관에 따라 중도해지 금리가 적용되어 원금은 보존되나 이자 수익이 감소할 수 있습니다.


    2. 가입 조건 및 제한

    - 본 상품의 최소 가입 금액은 10,000원입니다. 해당 금액 미만으로는 가입이 불가능합니다.


    3. 예금자 보호 의무

    - 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호받으실 수 있습니다. 이는 법적 보호 기준에 근거합니다.


    4. 계약의 종료 및 변경

    - 약관 변경 시 미리내뱅크는 모바일 앱 공지사항 등을 통해 사전 고지합니다. 변경 내용에 동의하지 않으시는 경우 상품 해지를 요청하실 수
    있습니다.


    모든 거래는 금융실명법 및 개인정보 보호법을 엄격히 준수하며, 고객님의 권익을 최우선으로 처리하겠습니다.'
