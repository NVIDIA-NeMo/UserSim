  institution_id: mirinae_bank
- id: 60c23e46-5758-5df4-8246-596540520b6c
  title: '모임통장: 거래가 거절되거나 제한되었을 때'
  body: '모임통장에서 이체나 출금 거래가 거절되는 경우, 다음의 원인을 순서대로 확인해 주십시오.


    **증상: ''거래가 제한되었습니다'' 또는 ''잔액이 부족합니다''라는 메시지가 표시됨**


    1. 잔액 확인: 출금하려는 금액이 현재 모임통장의 잔액보다 많은지 확인하십시오. 모임통장은 연결된 계좌의 잔액 범위 내에서만 사용 가능합니다.

    2. 한도 초과 확인: 1일 또는 1회 이체 한도를 초과했는지 확인하십시오. 한도 변경은 앱 내 설정에서 가능합니다.

    3. 계좌 상태 확인: 보이스피싱 예방을 위한 지급정지 조치나 사고 신고로 인해 계좌가 동결되었는지 확인하십시오.

    4. 본인 인증 상태: 기기 변경 후 재인증을 하지 않았거나, 보안 매체(인증서 등)의 유효기간이 만료되었는지 확인하십시오.


    **해결 방법**

    - 잔액 부족 시: 멤버들의 회비를 추가로 입금받으십시오.

    - 한도 초과 시: 앱 내 ''내 한도 관리'' 메뉴에서 한도를 상향하십시오.

    - 계좌 동결 시: 고객센터를 통해 본인 확인 후 제한 사유를 확인하고 해제 절차를 밟으십시오.


    위 조치 후에도 문제가 해결되지 않는 경우, 전문 상담원에게 에스컬레이션하여 정밀 조사를 진행하겠습니다.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: 7a271674-28ff-5688-abb3-acf5ca639b92
  title: '모임통장: 전환이나 상위 상품을 고려할 때'
  body: '상담원은 고객님이 모임통장에서 다른 상품으로의 전환을 고려하실 때 다음의 차이점을 안내하십시오.


    **모임통장 vs 세이프박스**

    - **모임통장**: 여러 명의 멤버와 내역을 투명하게 공유하고 회비를 관리하는 데 최적화되어 있습니다. 금리는 입출금통장 금리인 0.1%가
    적용됩니다.

    - **세이프박스**: 단기 자금을 효율적으로 굴리기 위한 보관함 서비스입니다. 하루만 맡겨도 2%의 금리를 제공하여 수익성이 훨씬 높습니다.


    **추천 가이드**

    - 회비 관리와 투명한 내역 공유가 최우선이라면 **모임통장**을 유지하십시오.

    - 모임의 여유 자금을 더 높은 금리로 운용하고 싶다면, 모임주가 자금을 ''세이프박스''로 옮겨 운용하는 방안을 추천하십시오. 단, 세이프박스로
    옮긴 금액은 멤버들이 실시간으로 내역을 볼 수 없으므로 모임주가 별도로 공유해야 함을 안내하십시오.


    더 자세한 전환 방법은 ''모임통장: 해지·변경·상품 전환''을 참조하십시오.'
  domain: retail_banking
  product_category: mirinae_moim
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: b2f7ecd1-9efb-5eb5-a0b7-8e3aa7fb7b75
  title: '모임통장: 다른 상품과의 비교와 맞지 않는 경우'
  body: '모임통장은 공동의 목적을 위해 자금을 모으는 분들께 최적화된 상품입니다. 하지만 상황에 따라 다른 상품이 더 적합할 수 있습니다.


    **모임통장이 적합한 경우**

    - 동호회, 친구 모임 등 여러 사람이 회비를 걷고 지출 내역을 투명하게 공개해야 할 때

    - 모임주가 계좌를 관리하되 멤버들이 잔액과 내역을 실시간으로 조회해야 할 때


    **모임통장이 맞지 않는 경우**

    - **단독 자산 관리**: 혼자서 자금을 관리하신다면 일반적인 ''미리내 입출금통장''이 더 간편합니다.

    - **고금리 수익 추구**: 모임통장의 금리는 입출금통장 금리와 동일한 0.1%입니다. 수익성을 높이고 싶다면 2% 금리를 제공하는 ''세이프박스''나
    일정 기간 예치하는 ''미리내 정기예금''을 고려하십시오.

    - **엄격한 공동 통제**: 모임통장의 출금 권한은 기본적으로 모임주에게 있습니다. 모든 출금 시 멤버 전원의 승인이 필요한 엄격한 통제
    구조를 원하시는 경우 본 상품의 권한 체계를 반드시 확인하십시오.


    상품별 상세 금리는 ''모임통장: 금리·요율 안내''에서 확인하실 수 있습니다.'
