- id: d7b95d42-a25f-5a95-87cb-e1a8f00f5103
  title: '미리내 정기예금: 상품 개요'
  body: '### 상품 소개

    미리내 정기예금은 최소 10,000원부터 가입 가능하며, 일정 기간 자금을 예치하여 안정적인 수익을 추구하는 상품입니다. 지점 방문 없이 모바일
    앱을 통해 쉽고 빠르게 가입하실 수 있습니다.


    ### 주요 혜택 및 금리

    고객님의 자금 계획에 맞춰 예치 기간을 선택하십시오.

    - **6개월 정기예금 금리**: 3.2%

    - **1년 정기예금 금리**: 3.5%


    ### 가입 조건 및 보호 제도

    - **최소 가입 금액**: 10,000원

    - **예금자 보호**: 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다.


    더 자세한 금리 정보는 [미리내 정기예금: 금리·요율 안내]에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: eeade7eb-32ad-54c4-b8cd-dd16153e1f4f
  title: '미리내 정기예금: 6개월 정기예금 금리 안내'
  body: '**Q: 6개월 동안 자금을 예치할 경우 적용되는 금리는 얼마입니까?**


    A: 미리내 정기예금의 6개월 정기예금 금리는 3.2%입니다. 가입 시 설정하신 기간 동안 이 금리가 적용되어 안정적인 수익을 얻으실 수 있습니다.


    **Q: 6개월 금리는 모든 가입자에게 동일하게 적용됩니까?**


    A: 네, 그렇습니다. 별도의 우대 조건 없이 가입하시는 모든 고객님께 동일하게 3.2%의 금리를 제공합니다.


    상세한 금리 체계는 [미리내 정기예금: 금리·요율 안내]를 참조하십시오.'
