- id: 5a9409b5-77cd-5177-8d50-a976295ea441
  title: '미리내 체크카드: 가입과 이용 시작'
  body: '미리내 체크카드는 모바일 앱을 통해 쉽고 빠르게 신청하실 수 있습니다. 본 카드는 체크카드 특성상 미리내뱅크의 입출금 계좌가 반드시
    필요합니다.


    [준비 사항]

    - 미리내뱅크 모바일 앱 설치 및 로그인

    - 본인 명의의 ''미리내 입출금통장''


    [가입 절차]

    1. 앱 내 카드 신청 메뉴에서 ''미리내 체크카드''를 선택하십시오.

    2. 본인 확인을 위해 성함과 생년월일을 제공하여 인증을 수행하십시오.

    3. 카드를 연결하여 대금이 출금될 미리내 입출금통장 계좌를 지정하십시오.

    4. 카드 수령지 주소와 연락처를 확인하고 신청 버튼을 누르십시오.

    5. 실물 카드를 수령하신 후, 앱의 카드 등록 메뉴에서 카드 번호를 등록하면 즉시 사용이 가능합니다.


    정상적으로 등록이 완료되면 앱 메인 화면에서 카드 상태가 ''활성화''로 표시되며, 이때부터 0.5% 캐시백 혜택이 적용됩니다.'
