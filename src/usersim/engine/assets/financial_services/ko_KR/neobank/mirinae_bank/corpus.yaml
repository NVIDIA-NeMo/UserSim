  institution_id: mirinae_bank
- id: 6b1c440a-4a43-5b5c-a2a6-56ec7d79ed2b
  title: '미리내 정기예금: 예상과 다른 수수료나 금액'
  body: '고객님께서 정기예금 만기 수령액이나 해지 금액이 예상과 다르다고 느끼시는 경우, 다음 사항을 순차적으로 확인하십시오.


    1. 원천징수 세액 확인: 모든 예금 이자에는 소득세와 지방소득세를 합해 15.4%의 세금이 부과됩니다. 앱에 표시된 금리는 세전 금리이므로,
    실제 수령액은 여기서 15.4%를 제외한 금액이 됩니다.

    2. 중도해지 여부 확인: 만기일 이전에 계좌를 해지하신 경우, 가입 시 안내된 3.2% 또는 3.5%의 금리가 아닌 낮은 중도해지이율이 적용됩니다.
    이로 인해 이자 금액이 크게 줄어들 수 있습니다.

    3. 계산 방식 확인: 정기예금은 단리 또는 복리 방식에 따라 계산됩니다. 상품 상세 페이지의 이자 계산 방식을 다시 확인하십시오.


    위 사항을 확인했음에도 금액이 정확하지 않다고 판단되시면, 저희 상담원에게 상세 내역 조사를 요청하십시오. 저희가 내부 에스컬레이션 경로를
    통해 전문 담당자가 정확한 산출 근거를 확인하여 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
