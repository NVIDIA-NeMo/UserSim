- id: 3203cd67-b8b8-5198-b726-2adde99d8262
  title: '미리내 입출금통장: 이런 분께 알맞습니다'
  body: '미리내 입출금통장은 복잡한 절차 없이 모바일 앱만으로 모든 금융 생활을 해결하고자 하는 디지털 네이티브 고객님께 가장 이상적인 상품입니다.


    이런 분들께 추천드립니다:

    - 은행 방문 없이 비대면으로 빠르게 계좌를 개설하고 싶으신 분

    - 잦은 송금과 ATM 이용 시 발생하는 수수료가 부담스러워 ''수수료 제로'' 혜택을 원하시는 분

    - 일상적인 자금을 안전하게 보관하면서 연 0.1%의 기본 금리 혜택을 받고 싶으신 분


    주요 혜택 안내:

    - 다른 은행으로 이체 수수료(모바일·인터넷뱅킹): 0원

    - ATM 출금 수수료: 0원

    - 입출금통장 금리: 0.1%


    미리내 입출금통장은 단순한 계좌를 넘어, 혁신적인 사용자 경험을 통해 고객님의 금융 편의성을 극대화합니다. 지금 바로 미리내뱅크 앱에서 스마트한
    금융 생활을 시작하십시오.'
