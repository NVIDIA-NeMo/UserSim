- id: 138a5c51-1b66-5c3e-8a2d-8508aed2e91a
  title: '미리내 입출금통장: 가입과 이용 조건'
  body: '미리내 입출금통장의 가입 및 이용 조건에 대해 안내해 드립니다.


    **질문: 영업점 방문 없이 어떻게 가입하나요?**

    답변: 미리내뱅크는 지점이 없는 인터넷전문은행입니다. 모바일 앱을 통해 신분증 확인과 본인 명의 계좌 확인 등의 ''비대면 실명확인'' 절차를
    완료하시면 즉시 개설됩니다.


    **질문: 가입 시 필요한 조건이 있나요?**

    답변: 금융실명법에 따라 실명확인이 가능한 본인 명의의 신분증과 계좌를 보유하고 계셔야 합니다.


    가입 대상에 대한 상세 기준은 ''미리내 입출금통장: 가입 대상''에서 확인하실 수 있습니다.'
