- id: 91420ae0-5165-5c09-90e3-f22cef0c8a93
  title: '모임통장: 다른 회사의 일반적인 상품과의 비교'
  body: '미리내뱅크 모임통장과 타 금융회사의 일반적인 모임 관리 방식의 차이점을 안내해 드립니다.


    | 구분 | 미리내뱅크 모임통장 | 일반적인 타사 상품/방식 |

    | :--- | :--- | :--- |

    | 투명성 | 모든 멤버가 실시간 내역 확인 가능 | 모임주만 확인 후 별도 공지 필요 |

    | 멤버 제한 | 최대 100명까지 초대 가능 | 상품별로 상이하거나 제한적임 |

    | 금리 혜택 | 입출금통장 금리 0.1% 적용 | 일반 입출금 수준 또는 무이자 |

    | 가입 편의성 | 앱으로 비대면 실명확인 즉시 개설 | 영업점 방문 또는 복잡한 서류 필요 |


    타사의 경우 모임주 1인이 자금을 독점 관리하여 불투명한 운영의 리스크가 있을 수 있으나, 미리내뱅크 모임통장은 멤버 모두가 내역을 공유하므로
    신뢰 기반의 운영이 가능합니다. 다만, 매우 높은 금리의 적금형 상품을 원하신다면 ''미리내 정기예금: 상품 개요''를 참고하여 목적에 맞는
    상품을 선택하시기 바랍니다.'
