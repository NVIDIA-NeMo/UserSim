- id: bb00c226-6c3f-5e96-9b24-1589ddc621d6
  title: '모임통장: 수수료 안내'
  body: '미리내뱅크는 고객님의 금융 부담을 최소화하는 ''수수료 제로'' 정책을 시행하고 있습니다. 모임통장 이용 시 적용되는 수수료는 다음과
    같습니다.


    - **타행 이체 수수료**: 0원

    - **ATM 출금 수수료**: 0원

    - **계좌 유지 및 관리 수수료**: 0원


    단, 국제 브랜드 이용 수수료와 같이 외부 비용이 발생하는 경우에 한해 합리적인 수준의 수수료가 부과될 수 있습니다. 자세한 내용은 ''모임통장:
    상품 개요''를 확인하십시오.'
