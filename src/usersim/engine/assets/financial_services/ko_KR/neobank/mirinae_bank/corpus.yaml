  body: "freeze_card 도구는 지정된 체크카드의 결제 기능을 일시적으로 중단시키는 기능을 수행합니다.\n\n- 호출 방식: 상담원이\
    \ 도구를 직접 호출하여 실행합니다.\n- 전제 조건: verify_identity를 통한 본인 인증이 완료된 상태여야 합니다.\n- 입력\
    \ 인자:\n  - card_id (string): 사용을 정지하고자 하는 체크카드의 고유 식별자입니다.\n- 결과: 해당 카드의 상태가 '정지'로\
    \ 변경되어 더 이상 결제가 불가능한 상태가 됩니다."
