- id: 399db842-d5cd-5580-b7d7-af603ee0c634
  title: '미리내 정기예금: 가입과 이용 시작'
  body: '미리내 정기예금에 가입하여 안정적인 자산 관리를 시작하는 방법입니다. 가입 전 미리내 입출금통장의 잔액이 충분한지 확인하십시오.


    **가입 절차**

    1. **본인 인증**: 상담원에게 성함과 생년월일을 말씀해 주시면 본인 확인을 수행합니다.

    2. **금액 설정**: 가입하실 금액을 말씀해 주십시오. 최소 가입 금액인 10,000원 이상부터 설정이 가능합니다.

    3. **기간 선택**: 6개월 또는 1년 중 원하시는 예치 기간을 선택하십시오.

    4. **약관 동의 및 완료**: 안내되는 상품 약관을 확인하신 후 동의하시면 가입이 완료됩니다.


    **완료 확인**

    가입이 완료되면 앱 내 ''내 계좌'' 목록에서 미리내 정기예금 계좌를 확인하실 수 있으며, 가입 완료 안내 메시지가 발송됩니다.


    상품의 전반적인 특징은 [미리내 정기예금: 상품 개요]에서 확인하십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
