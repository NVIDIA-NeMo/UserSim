- id: 0ea09305-e637-5c2a-aea3-53714f80661e
  title: '미리내 정기예금: 처리가 끝나지 않거나 보류 중일 때'
  body: '### 증상

    정기예금 가입 신청을 완료했으나, 계좌 상태가 ''처리 중'' 또는 ''보류 중''으로 표시되며 가입이 완료되지 않는 경우입니다.


    ### 원인 및 확인 사항

    1. **잔액 부족**: 입출금통장의 잔액이 가입 신청 금액보다 적은지 확인하십시오.

    2. **통신 일시 오류**: 네트워크 불안정으로 인해 신청 정보가 서버에 완전히 전달되지 않았을 수 있습니다.

    3. **인증 세션 만료**: 본인 인증 후 가입 완료까지 시간이 너무 오래 경과한 경우입니다.


    ### 해결 방법

    - **잔액 확인**: 입출금통장의 잔액을 확인하시고, 부족하다면 금액을 채운 뒤 다시 시도하십시오.

    - **앱 새로고침**: 앱을 완전히 종료한 후 다시 접속하여 ''내 계좌'' 상태를 확인하십시오.


    ### 에스컬레이션

    위 조치 후에도 상태가 변하지 않는다면 저희가 내부 시스템 로그를 정밀하게 확인하여 처리 결과를 앱 알림으로 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: e45c03f3-4045-555c-8191-995dc169dd3f
  title: '미리내 정기예금: 가입 대상'
  body: '| 구분 | 가입 조건 | 결과 |

    | :--- | :--- | :--- |

    | **본인 인증** | 미리내뱅크 비대면 실명확인을 완료한 개인 고객 | 가입 가능 |

    | **계좌 보유** | 본인 명의의 미리내 입출금통장 보유 | 가입 가능 |

    | **예치 금액** | 최소 가입 금액 10,000원 이상 예치 | 가입 가능 |

    | **예치 금액** | 10,000원 미만 예치 시도 | 가입 불가 |'
