- id: f9558bfa-9f72-5ecf-94a6-86d370b09399
  title: '모임통장: 가입과 이용 시작'
  body: '모임통장은 비대면으로 간편하게 개설하여 즉시 사용할 수 있는 공동 관리 계좌입니다. 아래 절차에 따라 가입을 진행하십시오.


    **준비 사항**

    - 본인 확인을 위한 성함과 생년월일

    - 실명 확인을 위한 신분증 및 본인 명의의 기존 계좌


    **가입 및 이용 단계**

    1. **본인 인증**: 성함과 생년월일을 말씀해 주시면 본인 확인 절차를 진행하겠습니다.

    2. **비대면 실명확인**: 안내에 따라 신분증 촬영과 본인 명의 계좌 확인을 통해 비대면 실명확인을 수행하십시오.

    3. **계좌 개설**: 실명 확인이 완료되면 모임통장 개설을 요청하십시오. 즉시 계좌가 생성됩니다.

    4. **멤버 초대**: 앱 내 초대 기능을 통해 함께 회비를 관리할 멤버들을 초대하십시오.

    5. **이용 시작**: 초대받은 멤버가 수락하면, 모든 멤버가 함께 잔액과 거래 내역을 확인하며 회비를 모으실 수 있습니다.


    정상적으로 개설되면 앱 메인 화면에서 모임통장 계좌를 확인하실 수 있습니다. 상품의 상세 혜택은 ''모임통장: 상품 개요''를 참고하십시오.'
