  institution_id: mirinae_bank
- id: 607e6d83-78eb-533e-a6bb-0f6dfa989058
  title: '모임통장: 추천·장기 이용 혜택'
  body: 미리내뱅크 모임통장과 함께 더 스마트한 모임 관리를 시작하십시오. 최대 100명의 멤버가 함께 참여하여 투명하게 회비를 관리할 수 있으며,
    입출금통장 금리 0.1%가 적용되어 효율적인 자금 운용이 가능합니다. 지인에게 모임통장을 추천하고 함께 이용하시면, 미리내뱅크만의 혁신적인
    사용자 경험과 투명한 금융 서비스를 통해 모임의 가치를 높이실 수 있습니다. 지금 바로 멤버들을 초대하여 편리한 금융 생활을 누리십시오.
