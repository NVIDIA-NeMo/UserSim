- id: 086e718b-8ceb-509f-9151-ca1fa6d4073f
  title: '세이프박스: 거래가 거절되거나 제한되었을 때'
  body: '세이프박스로 자금을 이동시키려 할 때 거래가 거절되는 경우, 다음 원인을 확인해 주십시오.


    증상: ''한도 초과로 인해 거래가 불가능합니다''라는 메시지가 표시됨

    원인: 세이프박스의 최대 보관 금액은 100,000,000원입니다. 현재 보관 금액과 이동시키려는 금액의 합계가 100,000,000원을 초과하는지
    확인하십시오.

    해결: 입출금통장에서 이동시킬 금액을 조절하여 총액이 100,000,000원 이하가 되도록 설정한 후 다시 시도하십시오.


    증상: ''계좌 상태 이상으로 거래가 제한되었습니다''라는 메시지가 표시됨

    원인: 보이스피싱 등 금융사기 의심 거래로 인해 계좌가 지급정지 상태이거나, 장기 미사용으로 인해 거래가 제한되었을 수 있습니다.

    해결: 고객센터를 통해 본인 확인 절차를 거친 후, 계좌의 지급정지 여부를 확인하십시오. 사기 피해로 인한 정지일 경우 피해구제 신청 절차를
    안내받으시기 바랍니다.


    위 조치 후에도 문제가 지속될 경우, 전문 상담원에게 케이스를 에스컬레이션하여 상세 원인을 분석하고 조치 결과를 안내해 드리겠습니다.'
