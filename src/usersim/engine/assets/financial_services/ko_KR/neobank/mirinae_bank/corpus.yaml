- id: 94b2d647-e58b-506e-b994-6f484ffc78e9
  title: '미리내 정기예금: 해지·변경·상품 전환'
  body: '미리내 정기예금의 해지, 정보 변경 또는 다른 상품으로의 전환은 모바일 앱을 통해 간편하게 진행하실 수 있습니다.


    [해지 및 상품 전환 절차]

    1. 본인 인증: 상담원에게 요청하시거나 앱 내에서 본인의 성함과 생년월일을 제공하여 본인 확인을 수행합니다.

    2. 대상 계좌 선택: 보유하고 계신 미리내 정기예금 계좌 목록 중 해지하거나 전환할 계좌를 선택하십시오.

    3. 처리 방식 결정: ''전액 해지'' 또는 ''다른 상품으로 전환'' 중 원하시는 옵션을 선택합니다.

    4. 지급 계좌 확인: 해지된 원금과 이자가 입금될 미리내 입출금통장을 확인하십시오. 이때 이자에서 15.4%의 세금이 원천징수된 후 최종
    금액이 입금됩니다.

    5. 최종 승인: 처리 내역을 확인하신 후 승인 버튼을 누르시면 즉시 처리가 완료되며, 완료 메시지를 받으실 수 있습니다.


    만약 가입 금액의 변경이 필요하시거나 상품 조건을 수정하고자 하시는 경우에도 동일한 본인 인증 과정을 거쳐 앱 내에서 신청 가능합니다.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: how_to_guide
