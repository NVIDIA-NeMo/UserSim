  institution_id: mirinae_bank
- id: adaa49aa-ce7f-5685-b84c-1179e5014f35
  title: '미리내 정기예금: 약관'
  body: '본 약관은 미리내 정기예금의 이용 조건 및 권리 의무 관계를 규정합니다.


    1. 가입 조건: 최소 가입 금액은 10,000원이며, 가입 시 설정한 예치 기간 동안 원금을 유지해야 합니다.

    2. 금리 적용: 예치 기간에 따라 6개월 정기예금 금리는 3.2%, 1년 정기예금 금리는 3.5%가 적용됩니다. 금리는 가입 시점에 확정되며,
    중도 해지 시에는 약관에 정해진 중도해지이율이 적용되어 원금 수준의 이자만 지급될 수 있습니다.

    3. 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사를 통해 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호됩니다.

    4. 세금 징수: 발생한 이자에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수된 후 지급됩니다.

    5. 계약의 종료: 만기 시 원금과 이자는 고객님이 지정한 미리내 입출금통장으로 자동 입금되거나, 고객님의 요청에 따라 재예치될 수 있습니다.
    계약 변경 및 해지는 본인 인증 후 모바일 앱을 통해 신청하십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: mirinae_bank
- id: a801557e-994f-5052-8d47-97379d593401
  title: '미리내 정기예금: 이런 분께 알맞습니다'
  body: '미리내 정기예금은 안정적인 자산 증식과 효율적인 자금 관리를 원하는 디지털 네이티브 고객님께 최적화된 상품입니다.


    다음과 같은 경우에 미리내 정기예금을 추천드립니다.


    - 적은 금액으로 저축 습관을 시작하고 싶으신 분: 최소 가입 금액이 10,000원으로 매우 낮아, 누구나 부담 없이 정기예금을 시작하실 수
    있습니다.

    - 단기 및 중기 자금을 안정적으로 운용하고 싶으신 분: 6개월 정기예금 금리 3.2%, 1년 정기예금 금리 3.5%의 경쟁력 있는 금리를
    통해 원금을 안전하게 보호하면서 수익을 추구할 수 있습니다.

    - 복잡한 서류 제출 없이 모바일로 모든 과정을 끝내고 싶으신 분: 지점 방문 없이 앱에서 비대면 실명확인만으로 즉시 가입이 가능합니다.


    안전한 자산 관리를 위해 예금보험공사를 통해 1인당 최대 1억원까지 예금자 보호가 제공되므로, 안심하고 미래를 위한 자금을 준비하십시오.'
  domain: retail_banking
  product_category: mirinae_jeonggi
  document_type: product_sheet
  source_authority: official
