- id: a19d81b8-a833-5c63-a113-108808d59adc
  title: '모임통장: 안전한 이용을 위한 수칙'
  body: '미리내뱅크 모임통장을 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 개인정보 보호 및 인증 주의

    미리내뱅크는 어떠한 경우에도 고객님의 카드 번호, 비밀번호, CVV, 주민등록번호와 같은 민감한 정보를 요구하지 않습니다. 계좌 정보 변경과
    같은 상태 변경 작업 시에는 오직 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다. 만약 이러한 정보 외에 비밀번호나 보안카드의
    전체 번호를 요구하는 연락을 받으셨다면 즉시 중단하십시오.


    2. 금융사기 주의 및 대응

    보이스피싱이나 스미싱 등 전기통신금융사기 의심 사례가 발생하면 즉시 대응하십시오. 모임통장의 자금이 명확하지 않은 용도로 이체되었거나 사기가
    의심되는 경우, 즉각적인 지급정지를 요청하시고 피해구제 신청 절차를 지원받으시기 바랍니다.


    3. 공동 관리 계좌의 특성 이해

    모임통장은 여러 멤버가 내역을 공유하는 상품입니다. 멤버 초대 시 신뢰할 수 있는 사람인지 다시 한번 확인하시고, 모임주께서는 계좌의 출금
    권한을 신중하게 관리하여 자산 손실이 발생하지 않도록 주의하십시오.


    모든 금융 분쟁은 금융감독원 금융분쟁조정위원회의 기준에 따라 신속하고 공정하게 처리됩니다.'
