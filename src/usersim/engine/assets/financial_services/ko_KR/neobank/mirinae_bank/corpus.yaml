- id: d2211d7b-68d1-5a1a-8938-0eae27ddd7b4
  title: '미리내 정기예금: 1년 정기예금 금리 안내'
  body: '질문: 미리내 정기예금 1년 상품의 금리는 어떻게 되나요?

    답변: 미리내 정기예금 1년 정기예금 금리는 3.5%입니다. 가입 시점의 금리가 만기까지 동일하게 적용되는 확정 금리 상품입니다.


    질문: 1년 동안 예치한 금액이 안전하게 보호되나요?

    답변: 네, 그렇습니다. 예금보험공사를 통해 예금자 1인당 원금과 소정의 이자를 합해 최대 1억원까지 보호받으실 수 있습니다. 자세한 내용은
    ''미리내 정기예금: 상품 개요''를 참고하십시오.'
