- id: e25dc409-2066-5778-830e-8e7f43adcea0
  title: '도담 종신보험(저해지환급형): 개인정보 처리 안내'
  body: '도담생명은 고객님의 소중한 개인정보를 보호하기 위해 관련 법령을 준수하며 다음과 같이 처리합니다.


    당사는 금융위원회와 금융감독원의 감독을 받으며, 보험업법 및 개인정보 보호법에 따라 데이터를 철저히 관리합니다. 고객님의 성함, 생년월일,
    연락처 등은 보험 계약의 체결, 유지, 보험금 지급 및 관련 법적 의무 이행을 위해서만 사용됩니다. 특히 모든 상태 변경 작업 전에는 성함과
    생년월일만을 통한 본인 인증을 수행하며, 주민등록번호 전체나 비밀번호와 같은 민감 정보는 절대 요구하지 않습니다.


    수집된 정보는 안전한 보안 시스템에 저장되며, 제3자 제공 시에는 반드시 고객님의 사전 동의를 얻거나 법령에 근거한 경우에만 제한적으로 이루어집니다.
    고객님께서는 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있으며, 도담생명은 이를 신속하고 공정하게 처리합니다.


    또한, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호하고 있음을 알려드립니다. 개인정보 처리와 관련하여 궁금하신
    점은 고객센터를 통해 문의하여 주시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a4e244c0-3a7e-5b32-85e9-48aa85c6381e
  title: '도담 종신보험(저해지환급형): 이 상품을 사칭한 사기 주의'
  body: '도담생명은 고객님의 소중한 자산을 보호하기 위해 도담 종신보험(저해지환급형)을 사칭한 금융 사기 주의 안내를 드립니다.


    최근 당사 직원을 사칭하여 고수익 보장이나 특별 혜택을 명목으로 민감한 개인정보를 요구하는 사례가 발생하고 있습니다. 도담생명은 어떠한 경우에도
    고객님께 다음과 같은 정보를 요구하지 않습니다.


    - 일회성 인증 코드(OTP), MFA 인증 번호

    - 계정 비밀번호 또는 보안 카드 번호

    - 주민등록번호 전체 번호

    - 카드 번호 및 CVC 번호


    상담원이 본인 확인을 위해 요청하는 정보는 오직 고객님의 성함과 생년월일뿐입니다. 만약 이 외의 민감 정보를 요구하거나, 공식 채널이 아닌
    경로로 송금을 유도하는 연락을 받으셨다면 즉시 대화를 중단하시기 바랍니다.


    사기 의심 사례를 발견하셨을 때는 즉시 당사 고객센터로 신고하여 주십시오. 신속한 조사를 통해 고객님의 피해를 최소화하도록 하겠습니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: security_advisory
  source_authority: official
  placeholder: true
