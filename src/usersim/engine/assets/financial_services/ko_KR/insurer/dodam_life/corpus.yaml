- id: 8c03dc51-0d27-526f-81b4-434575486e3b
  title: '도담 종신보험(저해지환급형): 안전한 이용을 위한 수칙'
  body: '고객님의 소중한 자산과 개인정보를 보호하기 위해 도담생명이 준수하는 보안 수칙을 안내드립니다.


    도담생명은 모든 상태 변경 및 본인 확인 작업 시, 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다. 그 외의 일회성 인증 코드(OTP),
    다요소 인증(MFA), 비밀번호, 카드 번호, 또는 주민등록번호 전체와 같은 민감한 정보는 어떠한 경우에도 요구하지 않습니다. 만약 상담원이나
    외부 연락처를 통해 이러한 정보를 요구하는 사례가 발생한다면, 이는 명백한 사칭 행위이므로 즉시 통화를 종료하시고 당사 고객센터로 신고하여
    주십시오.


    또한, 출처가 불분명한 링크(URL) 클릭이나 파일 다운로드는 개인정보 유출의 위험이 크므로 각별히 주의하시기 바랍니다. 도담생명은 금융위원회와
    금융감독원의 가이드라인을 엄격히 준수하며, 고객님의 데이터를 철저히 관리하고 있습니다. 안전한 금융 거래 환경을 위해 고객님의 적극적인 협조를
    부탁드립니다.'
