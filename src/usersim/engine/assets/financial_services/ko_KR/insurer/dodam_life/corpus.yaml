  institution_id: dodam_life
- id: 9ad6fc9b-1930-5e95-8bbd-a29cbfd5aeb7
  title: '도담 종신보험(저해지환급형): 한도·제한과 유의사항'
  body: '도담 종신보험(저해지환급형)의 주요 제한 사항 및 가입 시 유의사항을 안내합니다. 상담원은 고객 안내 시 다음 내용을 정확히 전달하시기
    바랍니다.


    1. 보험료 납입기간 및 구조

    본 상품의 보험료 납입기간(년)은 20으로 설정되어 있습니다. 납입 기간 동안 성실히 보험료를 납부하셔야 보장이 유지됩니다.


    2. 저해지환급금 구조의 특성

    본 상품은 저해지환급형 상품으로, 납입기간 중 해약환급금 수준(표준형 대비)은 50%로 책정되어 있습니다. 이는 표준형 상품보다 월 보험료를
    낮추는 대신, 중도 해지 시 돌려받는 금액이 매우 적음을 의미하므로 고객에게 충분히 설명하십시오.


    3. 계약 전 알릴 의무

    가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''를 반드시 준수해야 합니다. 이를 위반할 경우 보험업법 및
    약관에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.


    4. 보장 범위

    본 상품은 사망 보장을 핵심 가치로 하는 종신보험이며, 저축이나 투자 목적의 상품이 아님을 명확히 안내하십시오.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 62ff9f05-3b56-5a1f-ac4a-0a033f0f1f94
  title: '도담 종신보험(저해지환급형): 납입기간 중 해약환급금 수준(표준형 대비) 안내'
  body: '질문: 저해지환급형 상품은 일반적인 종신보험과 해약환급금에서 어떤 차이가 있습니까?


    답변: 도담 종신보험(저해지환급형)은 보험료 납입 기간 중 해약환급금 수준(표준형 대비)이 50%로 설계된 상품입니다. 즉, 납입 기간 내에
    계약을 해지하실 경우 표준형 상품보다 훨씬 적은 환급금을 받게 됩니다. 대신 이러한 구조를 통해 고객님이 매월 납부하시는 보험료 부담을 낮춘
    것이 특징입니다.


    납입 기간이 종료된 이후에는 약관에 따라 환급금이 변동되므로, 자세한 내용은 도담 종신보험(저해지환급형): 약관을 확인하시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6ffb2bcc-8689-5aa0-b5b3-a051e2635c64
  title: '도담 종신보험(저해지환급형): 진행 상황과 내역 확인'
  body: '현재 가입 중인 도담 종신보험(저해지환급형)의 계약 상태 및 보험료 납입 내역을 확인하는 방법입니다.


    1. 본인 인증 수행

    상담원에게 본인의 성함과 생년월일을 말씀해 주십시오. 도담생명은 보안을 위해 이 두 가지 정보만으로 본인 확인을 진행합니다.


    2. 확인 요청 사항 전달

    확인하고자 하시는 내역(예: 현재 계약 상태, 최근 보험료 납입일, 누적 납입 금액 등)을 말씀해 주십시오.


    3. 상세 내역 확인

    상담원이 전산 시스템을 통해 다음과 같은 정보를 안내해 드립니다.

    - 계약 상태: 정상, 실효, 또는 만기 여부

    - 납입 내역: 보험료 납입 횟수 및 다음 납입 예정일

    - 보장 내용: 설정하신 보험가입금액 및 보장 범위


    4. 확인 완료

    안내받으신 내용 중 궁금한 점이 있다면 즉시 문의하시어 확인 절차를 마치십시오.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 0d8bae1e-6935-5d30-97ce-aee57337760b
  title: '도담 종신보험(저해지환급형): 거래가 거절되거나 제한되었을 때'
  body: "보험계약대출 신청이나 수익자 변경 등의 거래가 거절되거나 제한되는 경우, 다음 원인을 확인해 보시기 바랍니다.\n\n- 증상: 서비스\
    \ 신청 시 '거래 불가' 메시지가 나타나거나 상담원을 통해 제한 안내를 받은 경우\n\n- 예상 원인 및 확인 순서:\n  1. 계약 실효\
    \ 여부 확인: 보험료 납입이 일정 기간 중단되어 계약이 실효 상태가 되면 대출이나 변경 업무가 제한됩니다. 납입 내역을 먼저 확인하십시오.\n\
    \  2. 계약 전 알릴 의무 위반: 가입 당시 고지 의무 위반으로 인해 심사가 진행 중이거나 계약 유지 가능 여부를 검토 중인 경우 거래가\
    \ 제한될 수 있습니다.\n  3. 서류 미비: 수익자 변경 등 증빙이 필요한 업무에서 필수 서류가 누락되었는지 확인하십시오.\n\n- 해결\
    \ 방법:\n  - 실효된 계약의 경우: 미납 보험료와 연체 이자를 납입하여 계약 부활 절차를 밟으십시오.\n  - 서류 미비의 경우: 안내받으신\
    \ 필요 서류를 다시 제출해 주십시오.\n\n- 에스컬레이션:\n자체 해결이 어렵거나 전문적인 심사가 필요한 건은 전문 언더라이터 또는 보상\
    \ 심사역으로 에스컬레이션하여 처리하며, 처리 결과는 영업일 기준 3~5일 이내에 안내해 드립니다."
  domain: insurance
  product_category: dodam_whole_life
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f56eeec1-866a-5298-bf07-2f01206ad5af
  title: '도담 종신보험(저해지환급형): 전환이나 상위 상품을 고려할 때'
  body: '고객님이 사망 보장 기간의 조정이나 보장 강화(상위 상품 전환)를 고려하실 때 상담원은 다음 기준에 따라 안내하십시오.


    1. 도담 종신보험(저해지환급형) vs 도담 정기보험

    - 종신보험: 평생 사망을 보장하며, 시간이 지나도 보장이 유지됩니다. 다만 보험료가 상대적으로 높습니다.

    - 정기보험: 정해진 기간(예: 20년) 동안만 집중 보장하며, 보험료가 매우 합리적입니다. 하지만 기간 종료 후에는 보장이 소멸합니다.


    2. 전환 추천 가이드

    - 경제 활동기 동안의 집중적인 가족 보호가 목적이라면 ''도담 정기보험: 상품 개요'' 상품이 더 적합할 수 있습니다.

    - 평생에 걸친 안정적인 사망 보장과 상속 준비가 목적이라면 현재의 종신보험 유지를 권장합니다.


    상담원은 고객의 생애 주기와 경제적 상황을 객관적으로 분석하여 표준 가이드라인에 따라 안내하시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 5d09728b-be3b-520e-8f7b-18c49852030c
  title: '도담 종신보험(저해지환급형): 다른 상품과의 비교와 맞지 않는 경우'
  body: '도담 종신보험(저해지환급형)은 특정 목적에 최적화된 상품입니다. 다음의 경우 본 상품보다 다른 대안이 더 적합할 수 있습니다.


    1. 본 상품이 적합하지 않은 경우

    - 단기적인 저축이나 투자 수익을 기대하시는 분: 본 상품은 사망 보장을 위한 보험이며, 저축 수단이 아닙니다.

    - 납입 기간 중 중도 해지 가능성이 높으신 분: 납입기간 중 해약환급금 수준(표준형 대비)이 50%에 불과하여, 중도 해지 시 원금 손실
    가능성이 매우 큽니다.

    - 특정 기간(자녀 성장기 등)만 보장받기를 원하시는 분: 이 경우 평생 보장인 종신보험보다 합리적인 비용의 정기보험이 더 적합합니다.


    2. 상품 비교 요약

    - 도담 종신보험(저해지환급형): 평생 사망 보장, 저렴한 보험료(저해지환급형 구조), 낮은 중도 환급금.

    - 도담 정기보험: 정해진 기간 보장, 가장 낮은 보험료, 기간 종료 후 보장 소멸.


    고객님의 보장 목적이 ''평생의 경제적 안정''인지 ''특정 기간의 위험 대비''인지 확인하여 안내하시기 바랍니다.'
