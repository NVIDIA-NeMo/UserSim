- id: 61dde757-f2b8-51ef-9a25-dd4421777ded
  title: '도담 종신보험(저해지환급형): 처리가 끝나지 않거나 보류 중일 때'
  body: '보험 가입 신청 후 심사 단계에서 처리가 지연되거나 보류되는 경우, 다음 사항을 확인하십시오.


    1. 증상: 가입 신청 상태가 ''심사 중'' 또는 ''보류''로 지속됨

    2. 예상 원인

    - 계약 전 알릴 의무 사항 중 추가 확인이 필요한 정보가 있는 경우

    - 제출 서류의 누락 또는 기재 사항 불분명

    - 전문 언더라이터의 정밀 심사가 필요한 고위험군 해당 여부 확인

    3. 해결 방법

    - 상담원에게 연락하여 보류 사유를 확인하고, 요청하는 추가 증빙 서류를 제출하십시오.

    - 서류 접수 후 심사역의 검토 시간이 소요될 수 있으므로 안내받은 처리 기한까지 기다려 주십시오.

    4. 에스컬레이션

    - 단순 문의로 해결이 어려운 복잡한 심사 건은 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여 처리하며, 최종 심사 결과는 개별 안내해
    드립니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: troubleshooting
  source_authority: official
