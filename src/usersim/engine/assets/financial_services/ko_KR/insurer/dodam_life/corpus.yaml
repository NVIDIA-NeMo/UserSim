- id: 6118fafd-1614-501d-99c2-546f93985232
  title: '도담 정기보험: 로그인하거나 접속할 수 없을 때'
  body: '공식 디지털 채널을 통해 도담 정기보험의 계약 내용을 확인하시려 할 때 접속 장애가 발생하는 경우, 다음 순서에 따라 조치해 주십시오.


    증상: 로그인 버튼을 눌러도 반응이 없거나, ''접속할 수 없는 계정''이라는 메시지가 표시됨


    원인 및 점검 순서:

    1. 계정 정보 확인: 입력하신 아이디나 비밀번호에 오타가 없는지 다시 확인하십시오.

    2. 브라우저 및 앱 업데이트: 사용 중인 웹 브라우저나 도담생명 앱이 최신 버전인지 확인하시고, 캐시를 삭제한 후 다시 시도하십시오.

    3. 네트워크 상태 점검: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오.


    해결 방법:

    - 비밀번호를 잊으신 경우 ''비밀번호 재설정'' 기능을 통해 본인 인증 후 새 비밀번호를 설정하십시오.

    - 위 조치 후에도 접속이 불가하다면 상담원에게 요청하여 계정의 상태(잠금 여부 등)를 확인하십시오.


    에스컬레이션:

    상담원이 계정 상태를 확인했음에도 기술적 오류가 지속되는 경우, 전문 IT 지원팀으로 건을 이관하여 조치합니다. 이 경우 고객님께는 접수 번호가
    안내되며, 처리 완료 후 공식 채널을 통해 결과가 통보됩니다.'
  domain: insurance
  product_category: dodam_term
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d18c829b-f182-5bdb-9483-8687dcd891c8
  title: '도담 정기보험: 이용 조건별 차이'
  body: '| 구분 | 조건 및 임계치 | 결과 및 영향 |

    | :--- | :--- | :--- |

    | 가입 가능 연령 | 최고 60세 | 60세를 초과하는 경우 가입이 제한됩니다. |

    | 보장 기간 | 20년 | 설정된 20년의 기간 동안만 사망 보장이 제공됩니다. |

    | 본인 인증 | 성함, 생년월일 | 정확한 일치 시 계약 조회 및 상태 변경이 가능합니다. |

    | 청약 철회 | 증권 수령 후 15일 / 청약 후 30일 | 해당 기간 내 철회 시 납입 보험료를 돌려받을 수 있습니다. |'
