- id: 93320e29-1616-5652-a818-d3f45908785d
  title: '도담 종신보험(저해지환급형): 진행 중인 이벤트'
  body: '도담생명을 이용해 주시는 고객님께 감사드립니다. 현재 도담 종신보험(저해지환급형) 가입 고객님을 대상으로 하는 혜택 안내를 드립니다.


    - 이벤트 명칭: 평생 안심 보장 캠페인

    - 대상: 도담 종신보험(저해지환급형) 신규 가입 및 유지 고객

    - 혜택 내용: 건강 관리 서비스 무료 제공 및 보험료 자동이체 설정 시 소정의 혜택 제공

    - 기간: 2025년 1월 1일부터 2025년 6월 30일까지


    가족의 미래를 위한 든든한 준비, 도담생명과 함께하십시오. 상세 내용은 상담원에게 문의하시거나 공식 디지털 채널을 통해 확인하십시오.'
