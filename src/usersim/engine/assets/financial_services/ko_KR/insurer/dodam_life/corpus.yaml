- id: 47c1d0f1-e8aa-5265-9b56-a3257ef83146
  title: '도담 정기보험: 다른 상품과의 비교와 맞지 않는 경우'
  body: '도담 정기보험은 특정 목적에 최적화된 상품입니다. 고객님의 니즈에 따라 다음과 같이 상품 선택을 안내해 주십시오.


    1. 도담 정기보험이 적합한 경우

    - 정해진 보험기간(20년) 동안 합리적인 보험료로 고액의 사망 보장(예: 보험가입금액 100,000,000원)을 준비하고 싶으신 분

    - 자녀의 성장기나 주택담보대출 상환 기간 등 특정 시기까지만 집중 보장이 필요하신 분


    2. 도담 정기보험이 맞지 않는 경우

    - 평생 동안 보장을 유지하고 싶으신 분 → ''도담 종신보험(저해지환급형)''을 권장합니다.

    - 노후 자금 마련이나 비과세 혜택을 통한 저축을 원하시는 분 → ''도담 연금보험''을 권장합니다.

    - 실제 발생한 치료비를 보장받고 싶으신 분 → 당사의 건강보험은 정액 보장형이므로, 실손의료보험 상품을 별도로 검토하셔야 합니다.


    본 상품은 순수하게 정해진 기간의 사망 보장에 집중하며, 저축 수단이 아님을 명확히 안내하십시오.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
