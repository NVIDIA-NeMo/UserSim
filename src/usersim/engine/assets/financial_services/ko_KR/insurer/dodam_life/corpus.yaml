    \ 호출하여 처리합니다.\n- 필수 인자:\n    - account_id: 납입 내역을 조회할 보험 계약의 고유 식별자\n- 실행 결과:\
    \ 증명서 발송 성공 여부 및 발송 일시를 반환합니다.\n\n본 도구는 verify_identity를 통해 본인 인증이 완료된 고객에 한해\
    \ 사용 가능하며, 별도의 추가 인증 없이 account_id를 기반으로 발송됩니다."
