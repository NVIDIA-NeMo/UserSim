  institution_id: dodam_life
- id: 1a118121-deae-5990-871f-f9390b03f4e3
  title: '도담 건강보험: 부정사용으로부터 고객을 보호하기 위해'
  body: '도담생명은 고객님의 소중한 보험 계약과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 최근 보험 상품을 사칭하여 개인정보를 요구하거나
    부당한 금전적 이득을 취하려는 시도가 발생하고 있으니 각별한 주의가 필요합니다.


    도담생명은 어떠한 경우에도 고객님께 일회성 인증 코드, MFA(다요소 인증), 비밀번호, 카드 번호, 또는 주민등록번호 전체와 같은 민감한
    정보를 전화나 메시지로 요구하지 않습니다. 상담원은 상태 변경 작업 전, 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다. 만약
    이 외의 추가적인 인증 수단이나 개인정보를 요구하는 연락을 받으셨다면, 이는 도담생명을 사칭한 부정 사용 시도일 가능성이 매우 높습니다.


    의심스러운 연락을 받으셨거나 부정 사용이 우려되는 경우, 즉시 당사 고객센터로 신고하여 주십시오. 신속한 조사를 통해 고객님의 권익을 보호하겠습니다.
    안전한 금융 거래의 시작은 정확한 본인 확인 절차를 준수하는 것입니다. 도담생명은 앞으로도 투명하고 정직한 보장 체계를 통해 고객님의 경제적
    안정을 지원하겠습니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: security_advisory
  source_authority: official
