  institution_id: dodam_life
- id: e97d52f3-4458-5395-bfe9-719c5f748504
  title: '도담 건강보험: 1회 입원 최대 지급 일수 안내'
  body: '질문: 도담 건강보험의 입원일당은 한 번 입원했을 때 최대 며칠까지 받을 수 있습니까?


    답변: 도담 건강보험의 1회 입원 최대 지급 일수는 180일입니다. 입원일당 30,000원은 해당 한도 내에서 실제 입원하신 일수에 따라 지급됩니다.
    180일을 초과하여 입원하시는 경우, 해당 회차의 입원으로는 추가 지급이 되지 않으므로 약관의 세부 내용을 확인하시기 바랍니다.


    더 자세한 보장 범위는 ''도담 건강보험: 약관''에서 확인하실 수 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6955b361-b24d-52e2-9d4c-d4b5697d5636
  title: '도담 건강보험: 해지·변경·상품 전환'
  body: '도담 건강보험의 계약 해지, 내용 변경 또는 다른 상품으로의 전환을 원하시는 고객님께서는 다음의 절차를 따라주십시오.


    1. 본인 확인 단계: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 도담생명은 보안을 위해 이 두 가지 정보로만 본인 인증을 수행하며,
    비밀번호나 카드 번호 등은 요구하지 않습니다.

    2. 요청 사항 전달: 해지, 계약 내용 변경, 또는 상품 전환 중 원하시는 업무를 말씀해 주십시오. 변경을 원하시는 경우 변경하고자 하는
    보장 내용이나 납입 방법을 구체적으로 알려주십시오.

    3. 약관 및 조건 확인: 상담원이 해당 작업으로 인해 발생하는 해약환급금의 수준, 보장 범위의 변화, 또는 전환 상품의 특징을 상세히 안내해
    드립니다.

    4. 최종 승인 및 확정: 안내받으신 내용을 확인하신 후 최종 동의 의사를 밝혀주십시오. 모든 처리가 완료되면 확정 안내 메시지를 통해 결과를
    확인하실 수 있습니다.


    청약철회 기간 내에 계신 고객님은 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입 보험료를
    전액 돌려받으실 수 있습니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 442d00ed-1516-58f5-a083-3856dee85b1f
  title: '도담 건강보험: 예상과 다른 수수료나 금액'
  body: '고객님께서 보험금 지급 금액이나 월 보험료가 예상과 다르다고 말씀하시는 경우, 상담원은 다음 순서에 따라 원인을 파악하고 해결해야
    합니다.


    1. 증상 확인: 고객님이 기대하셨던 금액과 실제 청구/납입 금액의 차이를 정확히 확인하십시오. 특히 입원일당 30,000원이나 수술비 1,000,000원이
    온전하게 적용되었는지 검토하십시오.

    2. 지급 제한 사유 확인: 1회 입원 최대 지급 일수인 180일을 초과했는지, 또는 면책 기간이나 감액 기간이 적용되는 상품인지 확인하십시오.

    3. 고지의무 위반 여부 검토: 가입 시 ''계약 전 알릴 의무''를 성실히 이행했는지 확인하십시오. 사실과 다르게 알린 사항이 발견될 경우,
    보험업법에 따라 계약이 해지되거나 보험금 지급이 제한되었을 가능성이 있습니다.

    4. 해결 및 에스컬레이션: 단순 계산 착오인 경우 즉시 수정하여 재안내하십시오. 다만, 전문적인 심사가 필요하거나 복잡한 보험금 지급 분쟁
    건은 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여 정밀 조사를 진행하십시오.


    조사 결과는 신속하게 고객님께 안내하며, 자체 해결이 어려운 민원은 금융감독원을 통해 신청하실 수 있도록 정중히 안내하십시오.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
