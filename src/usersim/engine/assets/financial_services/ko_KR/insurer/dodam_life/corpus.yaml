- id: 18965f0b-8a15-5600-85df-318b4a142f8c
  title: '도담 연금보험: 자주 하는 업무의 처리 절차'
  body: "보험금 수익자 변경 및 보험계약대출 등 자주 요청하시는 업무의 처리 절차입니다.\n\n1. 본인 인증: 상담원에게 고객님의 성함과\
    \ 생년월일을 말씀해 주십시오.\n2. 업무 요청: '수익자 변경' 또는 '보험계약대출 신청' 등 원하시는 업무를 말씀해 주십시오.\n3.\
    \ 서류 안내 및 제출: \n- 수익자 변경 시: 변경할 수익자의 인적 사항과 관계를 확인하며, 필요한 경우 가족관계증명서 등 증빙 서류 제출을\
    \ 안내받으십시오.\n- 보험계약대출 신청 시: 대출 가능 금액(해약환급금 범위 내)을 확인하고, 대출 실행 여부를 결정하십시오.\n4. 처리\
    \ 완료 확인: 요청하신 사항이 시스템에 반영되면 상담원이 최종 처리 결과를 안내해 드립니다. 결과는 공식 디지털 채널의 계약 상세 내역에서도\
    \ 확인하실 수 있습니다."
  domain: insurance
  product_category: dodam_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 22825abd-64ac-5755-8b89-4416e75b9dd4
  title: '도담 연금보험: 명세서나 내역과 맞지 않을 때'
  body: '고객께서 확인하신 적립금이나 납입 내역이 예상과 다르다고 말씀하시는 경우의 처리 가이드입니다.


    1. 증상 확인: 고객이 ''납입한 보험료보다 적립금이 너무 적다''거나 ''비과세 적용 여부가 잘못 표기되었다''고 주장하는 경우입니다.


    2. 확인 순서

    - 납입 기간 확인: 보험차익 비과세 최소 납입 기간(년)인 5년을 충족했는지, 혹은 월 납입액이 1,500,000원을 초과한 적이 있는지
    확인하십시오.

    - 유지 기간 확인: 보험차익 비과세 최소 유지 기간(년)인 10년이 경과했는지 확인하십시오.

    - 공제 항목 확인: 사업비 등 보험 계약 유지에 필요한 비용이 차감된 후 적립되었음을 설명하십시오.


    3. 해결 및 에스컬레이션

    단순 설명으로 해결되지 않는 금액적 불일치가 발견되거나, 시스템 오류가 의심될 경우 즉시 전문 보상 심사역 및 언더라이터에게 에스컬레이션하십시오.
    조사 후 결과는 고객님께 정중히 안내하며, 필요시 금융감독원을 통한 민원 신청 절차를 안내하십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: e2864246-3c98-5aa7-ab35-a419269d89d6
  title: 수수료·요금 안내
  body: '도담생명은 모든 고객님께 투명하고 정직한 보험료 산정 체계를 제공합니다. 당사의 보험료는 통계적 위험률과 고객님의 연령에 기반하여
    합리적으로 산정되며, 이는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다.


    회사는 정해진 보험료 체계를 엄격히 준수하며, 상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하고 있습니다. 각 상품의
    구체적인 보험료 및 특약 비용은 해당 상품의 상세 안내서와 약관을 통해 확인하실 수 있습니다.'
  domain: insurance
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f2a04570-4b89-5ea7-98ec-383a0066f8ff
  title: 자주 묻는 질문
  body: 'Q: 도담생명 고객센터의 이용 시간은 어떻게 됩니까?

    A: 도담생명은 대한민국 표준 영업시간(KST)을 기준으로 운영하고 있습니다. 전화 상담과 공식 디지털 채널을 통해 안내를 받으실 수 있습니다.


    Q: 전문적인 심사가 필요한 보험금 지급 건은 어떻게 처리되나요?

    A: 단순 문의는 상담원이 즉시 처리해 드리며, 전문적인 심사가 필요한 복잡한 보험금 지급 건은 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여
    정확하고 공정하게 처리합니다.


    Q: 상담 중 분쟁이 발생하면 어떻게 해야 합니까?

    A: 모든 분쟁은 객관적인 절차에 따라 신속히 조사하여 해결 방안을 제시합니다. 자체 해결이 어려운 경우 금융감독원을 통해 신청하실 수 있도록
    안내해 드립니다.'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 59d95da2-514f-52cd-aeae-bc070e84a022
  title: '법령·제도 안내: 생명보험·건강보험'
  body: '도담생명은 보험업법에 따라 금융위원회와 금융감독원의 감독을 받는 신뢰받는 보험사입니다.


    [예금자 보호 제도]

    예금보험공사는 예금자보호법에 따라 보험계약자 1인당 해약환급금(또는 만기보험금, 사고보험금)과 그 밖의 지급금을 합해 1억원까지 보호합니다.
    다만, 연금저축보험과 사고보험금은 각각 별도로 1억원까지 보호되며, 변액보험의 경우 최저보증 부분을 제외하고는 보호되지 않습니다.


    [소비자 권익 보호]

    계약자는 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회할 수 있습니다. 단, 진단계약 등 일부 계약은
    철회가 제한될 수 있습니다. 또한, 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''를 위반할 경우, 계약이
    해지되거나 보험금 지급이 제한될 수 있음을 유의하십시오.


    [세제 혜택 안내]

    근로소득자는 보장성보험료에 대해 연 100만원 한도로 12%의 세액공제를 받을 수 있습니다. 저축성보험과 연금보험의 보험차익은 10년 이상
    유지하고 월 150만원 이하를 5년 이상 균등하게 납입하는 등의 요건을 갖추면 비과세 혜택이 적용됩니다.


    민원과 분쟁은 금융감독원을 통해 신청할 수 있으며, 상담원은 보험금 지급을 확정적으로 약속하거나 개인별 세무 및 의료 조언을 제공하지 않습니다.'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 33820898-2832-50d5-b7e2-e722bb959661
  title: request_policy_loan 사용 기준
  body: '보험계약대출은 고객님이 납입하신 보험료를 기반으로 쌓인 해약환급금의 일정 범위 내에서 대출을 받는 제도입니다. 상담원은 다음 절차에
    따라 업무를 처리하십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. 고객님이 제시한 계좌 또는 카드 번호의 마지막 4자리를 활용하여 get_accounts 도구를 호출하고, 대출 대상이 되는 account_id를
    확인하십시오.

    3. 고객님께 대출 가능 금액과 이율을 안내하고, 대출 희망 금액을 확인하십시오.

    4. 확인된 account_id와 요청 금액을 사용하여 request_policy_loan 도구를 호출하여 대출을 신청하십시오.


    상담원은 대출 실행 전, 대출로 인해 향후 보험금 지급액이나 해약환급금이 변동될 수 있음을 정중히 안내해야 합니다.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_policy_loan
  institution_id: dodam_life
- id: b1336b8b-9e95-572b-b7a2-02d95fcb0a84
  title: request_policy_loan 도구 설명서
  body: "이 도구는 고객의 해약환급금 범위 내에서 보험계약대출을 신청하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이 시스템에서 직접\
    \ 호출하여 처리합니다.\n- 필수 인자:\n    - account_id: 대출을 신청할 보험 계약의 고유 식별자\n    - amount:\
    \ 대출 신청 금액 (원 단위)\n- 실행 결과: 대출 승인 여부 및 입금 예정 금액을 반환합니다.\n\n본 도구는 verify_identity를\
    \ 통해 본인 인증이 완료된 고객에 한해 사용 가능하며, 별도의 비밀번호나 MFA 인증 없이 account_id를 기반으로 실행됩니다."
