  body: '상담원께서는 고객 안내 시 도담 정기보험의 다음 제한 사항과 법적 유의사항을 정확히 전달하여 주시기 바랍니다.


    1. 가입 및 기간 제한

    - 가입 가능한 최고 나이: 60세까지 가입이 가능합니다.

    - 보험기간(년): 본 상품의 표준 보험기간은 20년으로 설정되어 있습니다.


    2. 소비자 권익 보호

    - 청약철회 권리: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입한 보험료를 돌려받으실
    수 있습니다.

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 약관에 따라 계약이 해지되거나
    보험금 지급이 제한될 수 있음을 명확히 안내하십시오.


    3. 보험료 산정 원칙

    - 보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정되며, 정해진 보험료 체계를 엄격히 준수합니다.


    4. 보장 특성

