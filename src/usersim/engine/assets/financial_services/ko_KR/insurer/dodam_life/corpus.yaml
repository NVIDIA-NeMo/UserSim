  institution_id: dodam_life
- id: b612859c-bbdc-593d-b286-e0236c8b4253
  title: '도담 정기보험: 개인정보 처리 안내'
  body: '도담생명은 고객님의 개인정보를 보호하며, 관련 법령에 따라 투명하게 관리합니다.


    1. 개인정보 수집 및 이용 목적

    도담 정기보험의 계약 체결, 보험료 산정, 보험금 지급 심사 및 고객 상담 서비스 제공을 위해 성함, 생년월일, 연락처, 건강 상태 등의 정보를
    수집합니다. 수집된 정보는 보험업법 및 금융위원회, 금융감독원의 감독 지침에 따라 엄격히 관리됩니다.


    2. 데이터 프라이버시 보호 및 보안

    당사는 고객님의 민감 정보를 보호하기 위해 철저한 보안 체계를 운영합니다. 상담원은 본인 확인을 위해 성함과 생년월일만을 요구하며, 주민등록번호
    전체나 비밀번호, 카드 번호 등 과도한 정보는 절대 요구하지 않습니다.


    3. 제3자 제공 및 위탁

    보험금 지급 심사를 위해 필요한 경우, 전문 언더라이터 및 보상 심사역에게 정보를 제공하며, 이는 관련 법규와 고객님의 동의 하에 안전하게
    이루어집니다.


    4. 예금자 보호 안내

    도담생명은 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호함을 명시합니다.


    고객님은 본인의 개인정보에 대해 열람, 정정, 삭제를 요청하실 수 있으며, 상세 내용은 상품설명서의 개인정보 처리 방침을 참고하십시오.'
  domain: insurance
  product_category: dodam_term
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 7bdd60dd-fffa-5b53-94be-fa07ef5aba5f
  title: '도담 정기보험: 이 상품을 사칭한 사기 주의'
  body: '최근 도담 정기보험의 합리적인 보험료 체계를 사칭하여, 고수익을 보장하거나 비정상적인 특약 가입을 유도하는 금융 사기가 발생하고 있습니다.
    고객님께서는 아래의 주의 사항을 반드시 확인하시어 피해를 예방하시기 바랍니다.


    도담생명은 어떠한 경우에도 고객님의 비밀번호, MFA(다요소 인증) 코드, 카드 번호, 주민등록번호 전체를 요구하지 않습니다. 또한, 상품
    가입이나 계약 변경을 위해 일회성 인증 코드를 전화나 메시지로 요청하는 일은 절대 없습니다. 당사의 상담원은 본인 확인을 위해 오직 고객님의
    성함과 생년월일만을 확인합니다.


    만약 도담생명을 사칭하여 과도한 개인정보를 요구하거나, 공식 채널이 아닌 경로로 송금을 유도하는 연락을 받으셨다면 즉시 대화를 중단하시고 당사
    고객센터로 신고해 주십시오. 의심스러운 정황을 발견하신 즉시 보고해 주셔야 신속한 피해 방지 조치가 가능합니다.


    도담생명은 고객님의 소중한 자산과 정보를 보호하기 위해 최선을 다하고 있으며, 모든 안내는 공식 디지털 채널과 정규 상담원을 통해 이루어집니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
