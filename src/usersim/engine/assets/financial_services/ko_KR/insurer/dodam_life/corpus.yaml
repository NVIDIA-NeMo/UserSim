- id: b28f61ff-c630-5613-9c0b-ffe53a10e07b
  title: '도담 정기보험: 안전한 이용을 위한 수칙'
  body: '도담생명은 고객님의 소중한 자산과 개인정보를 보호하기 위해 엄격한 보안 원칙을 준수하고 있습니다. 안전한 서비스 이용을 위해 다음
    수칙을 반드시 확인하시기 바랍니다.


    첫째, 본인 확인 절차를 유의하십시오. 도담생명의 상담원은 상태 변경 작업 전, 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다.
    이 외에 일회성 코드, MFA(다요소 인증), 비밀번호, 카드 번호, 주민등록번호 전체 등 추가적인 인증 수단이나 민감 정보를 요구하는 경우는
    절대 없으므로 각별히 주의하시기 바랍니다.


    둘째, 출처가 불분명한 링크나 메시지를 경계하십시오. 당사는 공식 디지털 채널을 통해서만 안내를 드리며, 개인적인 경로로 금융 정보를 요구하지
    않습니다.


    만약 본인 인증 과정에서 과도한 정보 요구를 받으셨거나 보험 사기가 의심되는 정황을 발견하신 경우, 즉시 당사 고객센터로 신고하여 주십시오.
    도담생명은 관련 법규에 따라 보험 사기 의심 건에 대해 엄격하게 대응하고 있습니다.


    금융위원회와 금융감독원의 감독을 받는 도담생명은 앞으로도 고객님의 정보 보호를 최우선으로 하겠습니다.'
