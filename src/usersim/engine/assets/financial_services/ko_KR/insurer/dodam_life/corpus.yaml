- id: fc397e79-6df0-5120-b2bc-d573f5a21748
  title: '도담 건강보험: 금리·요율 안내'
  body: '도담 건강보험의 보험료는 통계적 위험률과 가입자의 연령, 성별, 납입 기간을 기반으로 산정되는 정액 보험료 체계를 따릅니다.


    **보험료 산정 기준 예시**

    - 대상: 35세 여성, 20년 납입 조건

    - 적용 월 보험료: 38,000원


    위 금액은 표준 위험률을 적용한 예시이며, 가입자의 건강 상태나 직업 급수 등 개별 위험 요인에 따라 최종 보험료는 변동될 수 있습니다. 도담생명은
    정해진 보험료 체계를 엄격히 준수하며, 산정된 보험료는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다.'
  domain: insurance
  product_category: dodam_health
  document_type: rate_sheet
  source_authority: official
  placeholder: true
