- id: b2f40152-0c36-5ce5-a4d6-2adb8cfb0e21
  title: '도담 연금보험: 개인정보 처리 안내'
  body: '도담생명은 고객님의 소중한 개인정보를 보호하며, 보험업법 및 개인정보 보호법을 엄격히 준수합니다.


    1. 수집 및 이용 목적

    도담 연금보험의 계약 체결, 보험료 청구, 연금 개시 나이인 65세 도달 시의 연금 지급, 그리고 관련 세제 혜택(비과세 요건 확인) 안내를
    위해 필요한 최소한의 정보를 수집하고 이용합니다.


    2. 정보의 보호 및 관리

    당사는 데이터 프라이버시를 철저히 관리하며, 모든 상태 변경 작업 시 성함과 생년월일만을 확인하여 무단 정보 변경을 방지합니다. 고객님의 정보는
    안전한 보안 서버에 저장되며, 법령에 정해진 기간 동안 보관 후 파기됩니다.


    3. 권리 및 분쟁 해결

    고객님은 언제든지 자신의 개인정보에 대한 열람, 정정, 삭제를 요청하실 수 있습니다. 본 상품 이용 중 개인정보 처리와 관련하여 발생한 불만이나
    분쟁은 당사의 공정한 절차에 따라 처리되며, 자체 해결이 어려운 경우 금융감독원을 통해 민원을 신청하실 수 있습니다.


    4. 법적 고지

    본 상품은 금융위원회와 금융감독원의 감독을 받으며, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
