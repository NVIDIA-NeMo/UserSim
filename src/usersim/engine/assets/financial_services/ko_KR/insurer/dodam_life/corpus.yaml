- id: 3a800754-a863-5697-838a-65d3f44f0874
  title: '도담 종신보험(저해지환급형): 약관'
  body: '본 약관은 도담 종신보험(저해지환급형) 계약에 따른 권리와 의무를 규정합니다.


    1. 보험료 납입 의무: 계약자는 약정된 보험료 납입기간인 20년 동안 보험료를 납입해야 합니다. 납입 유예 등 편의 제공은 상품별 약관에
    명시된 조건에 따릅니다.


    2. 저해지환급금 적용: 본 상품은 납입기간 중 해약환급금을 낮추어 보험료 부담을 줄인 저해지환급형 상품입니다. 따라서 20년의 납입기간 중
    계약을 해지할 경우, 해약환급금 수준은 표준형 상품 대비 50%로 제한됩니다.


    3. 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 당사 약관에 따라 계약이
    해지되거나 보험금 지급이 제한될 수 있습니다.


    4. 청약철회권: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입 보험료를 돌려받을 수 있습니다.


    5. 예금자 보호: 예금보험공사가 예금자보호법에 따라 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다.


    상세한 보장 범위와 면책 사항은 공식 상품 설명서를 참조하십시오.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: terms_conditions
  source_authority: official
  placeholder: true
