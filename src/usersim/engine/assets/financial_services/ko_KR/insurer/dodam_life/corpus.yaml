- id: f1869cb7-cfa4-5e71-9cef-2424f9c14960
  title: '도담 연금보험: 안전한 이용을 위한 수칙'
  body: '도담 연금보험을 이용하시는 고객님께서 금융 사기로부터 자산을 안전하게 보호하시기 위해 다음의 보안 수칙을 반드시 확인해 주시기 바랍니다.


    첫째, 도담생명의 상담원은 어떠한 경우에도 고객님의 비밀번호, 일회성 인증 코드(OTP), MFA 인증 값, 카드 번호 또는 주민등록번호 전체를
    요구하지 않습니다. 본인 확인이 필요한 상태 변경 작업 시에는 오직 고객님의 성함과 생년월일만을 통해 인증을 수행합니다. 만약 이 외의 민감한
    정보를 요구하는 전화나 메시지를 받으셨다면 즉시 상담을 종료하시고 당사 공식 채널로 신고해 주십시오.


    둘째, 공식 디지털 채널 외의 경로로 제공되는 출처 불분명한 링크(URL) 접속을 주의하십시오. 특히 보험금 지급이나 세율 변경을 미끼로 개인정보
    입력을 유도하는 피싱 사이트에 주의하시기 바랍니다.


    셋째, 도담생명은 예금자보호법에 따라 예금보험공사를 통해 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호하고 있습니다. 하지만 이러한
    제도적 보호와 별개로 고객님의 계정 정보 관리는 무엇보다 중요합니다.


    이상 징후가 발견되었을 때는 즉시 고객센터를 통해 계정 일시 정지 및 보안 점검을 요청하십시오. 신속한 대응만이 고객님의 소중한 노후 자금을
    지키는 최선의 방법입니다.'
