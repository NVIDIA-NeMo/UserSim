- id: 3361fd45-88c4-5fae-8a52-40bf5b1415a3
  title: '도담 연금보험: 이 상품을 사칭한 사기 주의'
  body: '최근 도담 연금보험의 비과세 혜택이나 높은 수익률을 미끼로 고객님의 개인정보나 금전을 요구하는 사칭 사기가 발생하고 있어 각별한 주의를
    당부드립니다.


    도담생명은 어떠한 경우에도 전화나 문자 메시지를 통해 비밀번호, 일회성 인증 코드(OTP), MFA 인증 번호, 카드 번호, 또는 주민등록번호
    전체를 요구하지 않습니다. 특히 ''비과세 요건을 강제로 충족시켜 주겠다''거나 ''특별 우대 금리를 적용해 줄 테니 특정 계좌로 입금하라''는
    안내는 100% 사기이므로 즉시 전화를 끊으시기 바랍니다.


    당사 상담원은 본인 확인을 위해 오직 고객님의 성함과 생년월일만을 확인합니다. 만약 본인 확인 외에 민감한 금융 정보를 요구받으셨다면, 즉시
    상담을 중단하시고 당사 공식 고객센터로 신고해 주십시오. 의심스러운 정황을 발견하신 경우 신속하게 대응하셔야 피해를 최소화할 수 있습니다.'
  domain: insurance
  product_category: dodam_annuity
