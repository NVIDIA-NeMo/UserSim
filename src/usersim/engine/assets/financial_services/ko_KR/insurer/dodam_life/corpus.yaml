- id: dba724d1-8df0-5fda-80a2-ca5829134f3d
  title: open_account 사용 기준
  body: '신규 보험 계약을 체결하고자 하는 고객을 위해 다음 절차에 따라 청약을 접수하십시오. 모든 신규 가입 시에는 ''계약 전 알릴 의무''를
    철저히 이행해야 하며, 이를 위반할 경우 계약 해지나 보험금 지급 제한이 발생할 수 있음을 명확히 안내하십시오.


    1. **본인 인증 수행**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **상품 선택 및 안내**: 고객의 생애 주기와 필요 보장에 맞는 상품(예: 도담 정기보험, 도담 종신보험(저해지환급형) 등)을 안내하고
    선택하도록 합니다.

    3. **의무 사항 이행**: ''계약 전 알릴 의무''에 따라 과거 병력 등 중요 사항을 사실대로 확인하십시오. 이 과정은 법적 보호를 위해
    필수적입니다.

    4. **청약 정보 수집**: 납입 방법(자동이체/카드), 보험 가입 금액, 수익자 지정 정보 등 계약에 필요한 세부 사항을 수집하십시오.

    5. **청약 접수**: 수집된 정보를 바탕으로 `open_account` 도구를 호출하여 신규 계약 청약을 접수하십시오.

    6. **최종 안내**: 청약 접수 완료 사실을 알리고, 향후 심사 과정 및 보험증권 발송 일정에 대해 안내하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: dodam_life
- id: bfe3738d-3c66-5544-b332-1c00ce804aea
  title: open_account 도구 설명서
  body: "open_account 도구는 신규 보험 계약의 청약을 시스템에 등록하는 데 사용됩니다. 상담원은 이 도구를 통해 고객의 가입 신청을\
    \ 직접 처리합니다.\n\n- **호출 시점**: `verify_identity`로 본인 인증을 마친 고객이 상품을 선택하고, '계약 전 알릴\
    \ 의무'를 포함한 모든 청약 필요 정보를 제공했을 때 호출합니다.\n- **입력 인수**:\n    - `product_id`: 가입하고자\
    \ 하는 상품의 식별자(예: dodam_term, dodam_whole_life 등)입니다.\n    - `customer_details`:\
    \ 고객의 성함, 생년월일, 연락처 등 기본 인적 사항입니다.\n    - `payment_details`: 납입 방법 및 결제 계좌/카드\
    \ 정보입니다.\n    - `disclosure_answers`: '계약 전 알릴 의무'에 대해 고객이 답변한 내용입니다.\n- **실행\
    \ 결과**: 신규 보험 계약 청약이 접수되며, 생성된 `account_id` 또는 접수 번호를 반환합니다."
