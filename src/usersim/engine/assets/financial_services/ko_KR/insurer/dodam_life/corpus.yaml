- id: 60905295-ecb9-5a76-8151-760298494c13
  title: '도담 암보험: 가입과 이용 시작'
  body: '도담 암보험 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되면 가입 상담이 시작됩니다.

    2. 계약 전 알릴 의무 이행: 과거 병력, 직업, 취미 등 보험 가입 시 사실대로 알려야 하는 중요 사항을 상세히 말씀해 주십시오. 이를
    위반할 경우 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.

    3. 상품 설계 및 보험료 확인: 고객님의 연령과 위험률에 따라 산정된 보험료를 확인하십시오. (예: 40세 남성, 20년 납입 시 월 29,000원)

    4. 청약 및 결제: 가입 의사를 확정하고 보험료 납입 방법을 선택하여 결제를 진행하십시오.

    5. 보험증권 수령: 가입 완료 후 보험증권을 수령하십시오. 증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를
    철회하고 납입 보험료를 돌려받을 수 있는 청약철회 권리가 부여됩니다.


    모든 절차가 완료되면 도담 암보험의 보장을 받으실 수 있습니다.'
  domain: insurance
  product_category: dodam_cancer
