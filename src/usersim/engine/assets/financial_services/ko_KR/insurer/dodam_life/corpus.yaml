  institution_id: dodam_life
- id: 6b29b69f-8f7c-545d-81ff-7b1301831c43
  title: '도담 건강보험: 진행 중인 이벤트'
  body: '**[도담 건강보험 고객 감사 건강관리 지원 이벤트]**


    도담 건강보험을 이용하시는 고객님의 건강한 삶을 응원하기 위해 특별 혜택을 제공합니다.


    - **기간**: 2026년 1월 1일부터 2026년 3월 31일까지

    - **대상**: 도담 건강보험 유지 고객 중 건강검진 결과표를 제출하신 분

    - **혜택**: 선정된 고객님께 건강 관리 지원금 10,000원을 지급해 드립니다.


    본 이벤트는 도담생명의 정직한 보장 체계의 일환으로 제공되며, 상세 신청 방법은 고객센터 상담원을 통해 안내받으실 수 있습니다. 항상 고객님의
    경제적 안정과 건강을 위해 최선을 다하겠습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: promo_notice
  source_authority: official
