- id: bea16781-2d43-5c9a-8988-0600939a223b
  title: reinstate_policy 사용 기준
  body: '보험료 미납으로 인해 효력이 상실된(실효) 계약을 다시 유효하게 만드는 부활 신청 절차입니다. 상담원은 다음 단계를 준수하십시오.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 완료하십시오.

    2. get_accounts 도구를 통해 해당 계약의 account_id를 확인하고, 현재 계약 상태가 ''실효''인지 확인하십시오.

    3. 고객님께 부활 신청을 위해 밀린 보험료와 가산이자를 납입해야 함을 안내하십시오.

    4. 계약 부활을 위해서는 ''계약 전 알릴 의무''를 다시 이행해야 하므로, 건강 상태 등 중요 사항에 변동이 없는지 확인하십시오.

    5. 모든 요건이 충족되면 reinstate_policy 도구를 호출하여 부활 신청을 접수하십시오.


    부활 신청은 실효 후 정해진 기간 내에만 가능하며, 심사 결과에 따라 부활이 거절될 수 있음을 안내하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - reinstate_policy
  institution_id: dodam_life
- id: 62f822b6-7777-59ed-b825-ece0e7511add
  title: reinstate_policy 도구 설명서
  body: "이 도구는 효력이 상실된 보험 계약의 부활을 신청하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이 시스템에서 직접 호출하여 처리합니다.\n\
    - 필수 인자:\n    - account_id: 부활을 신청할 보험 계약의 고유 식별자\n- 실행 결과: 부활 신청 접수 결과 및 납입해야\
    \ 할 미납 보험료 합계액을 반환합니다.\n\n본 도구는 verify_identity를 통해 본인 인증이 완료된 고객에 한해 사용 가능합니다.\
    \ 부활 신청 전 상담원은 반드시 계약 전 알릴 의무 이행 여부를 확인해야 합니다."
