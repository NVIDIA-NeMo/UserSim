  institution_id: dodam_life
- id: 25057314-479b-5ef3-b743-2f9fd254ae92
  title: '도담 종신보험(저해지환급형): 가입 대상'
  body: '도담 종신보험(저해지환급형) 가입 가능 여부와 조건은 다음과 같습니다.


    - 연령 조건: 보험업법 및 당사 내부 규정이 정한 가입 가능 연령 범위 내의 고객

    - 건강 상태: 계약 전 알릴 의무 사항을 충족하며, 심사 결과 가입이 승인된 고객

    - 납입 능력: 약정된 월 보험료(예: 186,000원)를 20년 동안 납입할 수 있는 경제적 능력을 갖춘 고객

    - 거주지: 대한민국 거주자 및 대한민국 표준 영업시간(KST) 기준으로 서비스 이용이 가능한 고객'
