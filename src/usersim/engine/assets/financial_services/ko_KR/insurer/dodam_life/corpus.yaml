- id: 7a5bd2e4-a20f-54bd-bd6e-008179f309cd
  title: '도담 암보험: 안전한 이용을 위한 수칙'
  body: '도담생명은 고객님의 소중한 개인정보와 금융 자산을 보호하기 위해 최선을 다하고 있습니다. 최근 보험 상품을 사칭한 피싱 범죄가 증가하고
    있으니 다음의 안전 수칙을 반드시 준수하여 주십시오.


    1. 본인 인증 절차 확인

    도담생명의 상담원은 상태 변경 작업 전, 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다. 이 외의 추가 정보는 절대 요구하지
    않습니다.


    2. 요구 금지 정보

    당사는 어떠한 경우에도 다음과 같은 민감 정보를 요구하지 않습니다.

    - 일회성 인증 코드(OTP) 및 MFA 코드

    - 계정 비밀번호 및 카드 번호

    - 주민등록번호 전체 번호


    3. 의심 사례 대응

    상담원이 위와 같은 민감 정보를 요구하거나, 출처가 불분명한 링크(URL) 클릭을 유도하는 경우 즉시 통화를 종료하시고 고객센터로 신고해 주십시오.


    금융사고 발생 시 신속한 조치를 위해 이상 징후 발견 즉시 알려주시기 바랍니다. 도담생명은 금융감독원의 가이드라인에 따라 고객님의 데이터를
    철저히 관리하고 있습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: security_advisory
