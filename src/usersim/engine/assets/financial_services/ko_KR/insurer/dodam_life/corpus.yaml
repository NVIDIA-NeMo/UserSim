- id: c7b3c718-10f9-530d-8685-60cb2103f4d8
  title: '도담 연금보험: 보험차익 비과세 최소 유지 기간(년) 안내'
  body: '질문: 도담 연금보험의 보험차익에 대해 비과세 혜택을 받으려면 최소 몇 년 동안 보험을 유지해야 합니까?


    답변: 도담 연금보험을 통해 보험차익 비과세 혜택을 받으시려면 보험차익 비과세 최소 유지 기간(년)인 10년 이상 계약을 유지하셔야 합니다.
    이와 더불어 월 납입액이 1,500,000원 이하인 상태에서 5년 이상 균등하게 납입하는 등의 추가 요건을 모두 충족해야 비과세 적용이 가능합니다.
    자세한 내용은 상품 설명서를 참고하시거나 상담원에게 문의해 주십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: e6fc54fa-5deb-5419-90a4-ff59432994ce
  title: '도담 연금보험: 진행 상황과 내역 확인'
  body: '도담 연금보험의 현재 납입 내역과 비과세 요건 충족 진행 상황을 확인하는 방법입니다.


    1. 본인 인증 수행: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 당사는 이 외의 민감한 정보나 비밀번호를 요구하지 않습니다.

    2. 조회 항목 요청: 현재까지 납입한 총 보험료, 적립금 현황, 그리고 비과세 혜택을 위한 유지 기간 및 납입 기간 충족 여부에 대한 확인을
    요청하십시오.

    3. 내역 확인: 상담원이 안내하는 현재까지의 납입 회차와 유지 기간을 확인하십시오. 특히 보험차익 비과세 최소 유지 기간(년)인 10년 중
    현재 몇 년이 경과했는지 확인하시기 바랍니다.

    4. 결과 수령: 요청하신 상세 내역은 상담원의 안내를 통해 즉시 확인하시거나, 필요한 경우 공식 디지털 채널을 통해 명세서를 확인하실 수
    있습니다.'
  domain: insurance
  product_category: dodam_annuity
