- id: 5b84fb06-9a04-5fe8-a7ca-26b33c382b2f
  title: withdraw_application 도구 설명서
  body: "withdraw_application 도구는 고객의 보험 청약철회 요청을 접수하는 데 사용됩니다. 상담원이 이 도구를 호출함으로써\
    \ 철회 절차가 시스템적으로 처리됩니다.\n\n- **호출 시점**: `verify_identity`를 통해 본인 인증이 완료되었으며, 청약철회\
    \ 가능 기간(보험증권 수령 후 15일 이내 또는 청약 후 30일 이내) 내에 있음이 확인된 경우에 호출합니다.\n- **입력 인수**:\n\
    \    - `account_id`: 철회하고자 하는 보험 계약의 고유 식별자입니다. `get_accounts` 도구의 결과값을 통해 획득하십시오.\n\
    - **실행 결과**: 청약철회 접수 상태가 반영되며, 접수 성공 여부를 반환합니다. 본 도구를 통해 접수된 건은 추후 납입 보험료 환급 프로세스로\
    \ 이어집니다."
