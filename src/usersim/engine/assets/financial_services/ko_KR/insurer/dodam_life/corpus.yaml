- id: 91e171fb-48c6-56b5-b814-9fec58813bb9
  title: '도담 종신보험(저해지환급형): 해지·변경·상품 전환'
  body: '보험 계약의 해지, 정보 변경 및 상품 전환 절차를 안내해 드립니다.


    [계약 해지 신청 절차]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오.

    2. 해지 요청: 해지 의사를 밝히시고, 현재 시점의 예상 해약환급금을 확인하십시오.

    3. 주의사항 확인: 본 상품은 20년의 납입기간 중 해지 시, 해약환급금 수준이 표준형 대비 50%로 낮다는 점을 다시 한번 확인하십시오.

    4. 지급 계좌 확인: 환급금을 수령하실 본인 명의의 계좌 정보를 제공하십시오.

    5. 처리 완료: 해지 처리가 완료되면 안내 메시지를 통해 최종 환급 금액을 확인하실 수 있습니다.


    [수익자 변경 절차]

    1. 본인 확인: 성함과 생년월일을 통해 본인 인증을 수행합니다.

    2. 변경 정보 제공: 변경하고자 하는 수익자의 성함, 관계, 연락처 정보를 제공하십시오.

    3. 서류 제출: 수익자 변경에 필요한 증빙 서류를 요청에 따라 제출하십시오.

    4. 처리 결과 확인: 변경 사항이 반영되면 안내 문자가 발송됩니다.


    상품 전환이나 세부 변경 사항에 대해 궁금하신 점은 ''도담 종신보험(저해지환급형): 약관''을 참조하시거나 상담원에게 문의하십시오.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 3b07a9dc-0057-5190-bc03-4a648d4be2ac
  title: '도담 종신보험(저해지환급형): 예상과 다른 수수료나 금액'
  body: '고객님께서 예상하신 해약환급금이나 보험료와 실제 금액이 달라 문의하시는 경우, 다음 내용을 확인해 주시기 바랍니다.


    [증상: 해약환급금이 생각보다 너무 적습니다]

    - 원인: 가입하신 상품이 ''저해지환급형''이기 때문입니다. 본 상품은 보험료를 낮추는 대신, 20년의 납입기간 중 해지할 경우 해약환급금
    수준을 표준형 대비 50%로 낮게 책정한 구조입니다.

    - 확인 방법: 가입 당시 안내받으신 상품 설명서의 ''저해지환급금'' 항목을 확인하십시오.

    - 해결 방법: 납입기간이 종료된 이후에는 환급률이 변동되므로, 가급적 납입기간을 유지하시는 것을 권장합니다.


    [증상: 월 보험료가 안내받은 예시와 다릅니다]

    - 원인: 보험료는 통계적 위험률과 고객님의 연령, 건강 상태에 기반하여 개별 산정됩니다.

    - 확인 방법: 청약서 상의 최종 산정 보험료를 확인하십시오.


    [에스컬레이션 안내]

    상담원을 통해 확인한 금액 산정 방식에 대해 추가적인 소명이 필요하시거나, 복잡한 보험금 지급 및 환급금 분쟁이 발생한 경우, 전문 보상 심사역
    또는 언더라이터에게 사건을 에스컬레이션하여 정밀 심사를 진행합니다. 심사 결과는 조사 후 신속하게 안내해 드리겠습니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 87948eae-31a2-5ecc-b1d7-e9c9d83f83ca
  title: '도담 종신보험(저해지환급형): 필요 서류'
  body: '도담 종신보험(저해지환급형)의 주요 업무별 필요 서류 안내입니다.


    | 업무 구분 | 필요 서류 및 요건 | 비고 |

    | :--- | :--- | :--- |

    | 신규 가입 | 신분증 사본, 청약서, 계약 전 알릴 의무 고지서 | 본인 인증 필수 |

    | 계약 해지 | 신분증 사본, 환급금 수령 본인 명의 계좌번호 | 본인 인증 필수 |

    | 수익자 변경 | 신분증 사본, 변경될 수익자의 인적사항 확인 서류 | 변경 사유 증빙 필요 시 추가 서류 요청 |

    | 보험금 청구 | 보험금 청구서, 사망 진단서(사망 시), 신분증 사본 | 청구 서류 접수 후 심사 진행 |


    모든 서류는 최신 발행분이어야 하며, 개인정보 보호를 위해 주민등록번호 전체가 포함된 서류는 당사의 공식 접수 채널을 통해서만 안전하게 제출해
    주시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 86aae9ed-3b8f-5f54-be7e-addc1616d1f8
  title: '도담 종신보험(저해지환급형): 다른 회사의 일반적인 상품과의 비교'
  body: '도담 종신보험(저해지환급형)과 일반적인 표준형 종신보험의 차이점을 비교해 드립니다.


    | 구분 | 도담 종신보험(저해지환급형) | 일반 표준형 종신보험 |

    | :--- | :--- | :--- |

    | 월 보험료 | 상대적으로 저렴함 | 상대적으로 높음 |

    | 납입기간 중 환급금 | 표준형 대비 50% 수준 | 표준형 환급률 적용 |

    | 보장 내용 | 평생 사망 보장 (동일) | 평생 사망 보장 (동일) |

    | 주요 특징 | 저렴한 비용으로 보장 집중 | 상대적으로 높은 유동성(환급금) |


    [어떤 상품이 적합할까요?]

    - 도담 종신보험(저해지환급형)이 적합한 분: 20년의 납입기간 동안 계약을 유지할 확신이 있으며, 매월 지출되는 보험료를 최소화하여 효율적으로
    가족을 보호하고 싶으신 분께 추천합니다.

    - 표준형 상품이 적합한 분: 보험료 부담이 조금 더 있더라도, 납입 기간 중 중도 해지 시 더 많은 환급금을 확보하여 유동성을 유지하고 싶으신
    분께 적합합니다.


    본 상품은 보장성 보험으로, 저축 목적으로 가입하실 경우 저해지환급형 구조로 인해 손실이 발생할 수 있음을 유의하십시오.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: comparison
  source_authority: official
  placeholder: true
