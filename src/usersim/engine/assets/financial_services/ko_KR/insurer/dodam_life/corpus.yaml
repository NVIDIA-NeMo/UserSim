  - change_payment_method
  institution_id: dodam_life
- id: fc193bdf-5d75-522f-baae-b49d0617c49a
  title: withdraw_application 사용 기준
  body: '고객이 보험 가입 의사를 철회하고자 하는 경우, 청약철회 권리에 따라 다음 절차를 수행하십시오. 청약철회는 보험증권을 받은 날부터
    15일 이내, 또는 청약한 날부터 30일 이내에만 가능합니다. 단, 진단계약 등 일부 계약은 철회가 제한될 수 있음을 안내하십시오.


    1. **본인 인증 수행**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **계약 확인**: `get_accounts` 도구를 호출하여 고객의 계약 목록을 확인하고, 철회 대상 계약의 `account_id`를
    식별하십시오.

    3. **철회 가능 여부 검토**: 해당 계약의 청약일 또는 증권 수령일을 확인하여 청약철회 가능 기간(증권 수령 후 15일 이내 또는 청약
    후 30일 이내) 내에 있는지 확인하십시오.

    4. **청약철회 접수**: 요건을 충족한 경우 `withdraw_application` 도구에 `account_id`를 입력하여 철회 접수를
    완료하십시오.

    5. **안내 및 마무리**: 접수가 완료되었음을 알리고, 기납입 보험료의 환급 절차에 대해 정중히 안내하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
