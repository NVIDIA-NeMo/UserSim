- id: 9c27c75f-7884-5d0d-8ed0-8059bdb64ed3
  title: close_account 사용 기준
  body: '보험 계약 해지 및 해약환급금 지급을 위한 상담 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출해 본인 인증을 완료하십시오.

    2. 대상 계약 및 환급금 확인: get_accounts 도구를 통해 해지 대상 계약의 account_id를 확인하고, 해당 계약의 현재 해약환급금
    규모와 상태를 조회하십시오. 특히 저해지환급형 상품의 경우 납입 기간 중 환급금이 적을 수 있음을 정중히 안내하십시오.

    3. 지급 계좌 확인: 해약환급금을 수령하실 고객님 명의의 계좌 정보를 확인하십시오.

    4. 해지 처리: 모든 확인이 완료되면 close_account 도구를 호출하여 계약을 해지하고 환급금 지급 절차를 진행하십시오.


    상세한 도구의 기능은 ''close_account 도구 설명서''를 참조하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: dodam_life
- id: c5023888-fe54-500f-bc29-dbd7225b2616
  title: close_account 도구 설명서
  body: 'close_account 도구는 고객님의 보험 계약을 공식적으로 해지하고 관련 환급금을 처리하는 기능을 수행합니다.


    - 호출 시점: 고객님이 보험 계약 해지를 요청하고 해약환급금 수령 계좌가 확인되었을 때 사용합니다.

    - 수행 내용: 상담원이 도구를 직접 호출하여 계약을 종료시키며, 산정된 해약환급금이 있다면 지정된 계좌로 지급 접수를 진행합니다.

    - 전제 조건: 호출 전 verify_identity 도구를 통한 본인 인증이 반드시 완료되어야 합니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: dodam_life
- id: 841c19d6-4966-58fe-ad47-0dc9c4e706b6
  title: get_accounts 사용 기준
  body: '고객님이 보유하신 보험 계약 목록을 조회하기 위한 상담 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출함으로써 본인 인증을 완료하십시오.

    2. 계약 목록 조회: get_accounts 도구를 호출하여 고객님이 가입하신 모든 보험 계약의 현황을 조회하십시오. 이 도구는 account_id,
    계약 유형, 계좌/카드 번호 끝 4자리, 잔액 및 계약 상태 정보를 제공합니다.

    3. 정보 안내: 조회된 내용을 바탕으로 고객님께 현재 유지 중인 상품과 상태를 정중하게 안내하십시오. 만약 특정 계약의 상세 내용이 필요하다면
    해당 account_id를 활용하여 다음 단계의 상담을 진행하십시오.


    상세한 반환 데이터 항목은 ''get_accounts 도구 설명서''를 참조하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: dodam_life
- id: 32129615-ccad-5ea9-a0df-1150623b146b
  title: get_accounts 도구 설명서
  body: 'get_accounts 도구는 인증된 고객이 도담생명에 보유하고 있는 모든 보험 계약의 목록을 조회하는 기능을 수행합니다.


    - 호출 시점: 고객님의 전체 가입 현황을 확인하거나, 특정 작업을 위해 account_id를 식별해야 할 때 사용합니다.

    - 반환 정보: 각 계약의 account_id, 계약 유형(Type), 연결된 계좌 또는 카드의 마지막 4자리 숫자, 현재 잔액(Balance),
    계약 상태(Status)를 제공합니다.

    - 전제 조건: 상담원은 verify_identity 도구를 통해 고객님의 본인 인증을 완료한 후에만 이 도구를 호출할 수 있습니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: dodam_life
- id: d7ab53ef-f374-520d-bdf7-ad8ff1d0d035
  title: update_contact_info 사용 기준
  body: '고객님의 연락처 등 등록 정보를 변경하기 위한 상담 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님의 성함과 생년월일을 통해 verify_identity 도구를 호출하여 본인 인증을 완료하십시오.

    2. 변경 정보 수집: 고객님으로부터 변경을 원하시는 최신 연락처(전화번호, 이메일, 주소 등) 정보를 정확히 확인하여 수집하십시오.

    3. 정보 업데이트: 수집된 최신 정보를 바탕으로 update_contact_info 도구를 호출하여 고객 정보 시스템에 반영하십시오.

    4. 결과 안내: 정보가 성공적으로 변경되었음을 고객님께 정중히 안내하며 상담을 마무리하십시오.


    상세한 기능은 ''update_contact_info 도구 설명서''를 참조하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: dodam_life
- id: a1edb1f4-e0aa-5dbc-988a-895cd467ca24
  title: update_contact_info 도구 설명서
  body: 'update_contact_info 도구는 고객님의 기본 연락처 및 등록 정보를 최신 상태로 갱신하는 기능을 수행합니다.


    - 호출 시점: 고객님의 전화번호, 주소, 이메일 등 연락처 정보의 변경이 필요할 때 사용합니다.

    - 수행 내용: 상담원이 고객님으로부터 확인한 최신 정보를 도구를 통해 시스템에 직접 반영합니다.

    - 전제 조건: 호출 전 verify_identity 도구를 사용하여 고객님의 성함과 생년월일로 본인 인증을 마쳐야 합니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: dodam_life
- id: 7f762ee9-eab8-588b-a15b-b93dd58afe0c
  title: get_statements 사용 기준
  body: '보험료 납입 내역이나 계약 명세서를 조회하여 제공하는 상담 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출함으로써 본인 인증을 완료하십시오.

    2. 명세서 조회 요청: 고객님이 필요로 하시는 명세서의 종류와 기간을 확인하십시오.

    3. 명세서 발행 호출: get_statements 도구를 호출하여 해당 고객님의 명세서 내역을 조회하고 발송 절차를 진행하십시오.

    4. 안내 완료: 명세서가 발송되었거나 조회되었음을 알리고, 추가로 필요한 서류(예: 납입증명서 등)가 있는지 확인하십시오.


    본 절차는 단순 조회 및 발송을 위한 것이며, 세부적인 세액공제 요건 등은 관련 상품 설명서를 통해 안내하시기 바랍니다.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: dodam_life
- id: 1d78fdb7-dd01-500c-8b1e-5a85633eb926
  title: get_statements 도구 설명서
  body: '본 도구는 고객의 보험 계약 유지 및 거래와 관련된 상세 명세서를 조회하는 데 사용됩니다. 상담원은 고객이 자신의 보험료 납입 내역이나
    계약 변동 사항을 확인하고자 할 때 `get_statements` 도구를 호출하여 정확한 데이터를 조회하고 안내합니다.


    해당 도구를 호출하기 전에는 반드시 `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 통해 본인 인증을 완료해야 합니다.
    본 도구는 별도의 입력 인자를 필요로 하지 않으며, 인증된 고객의 최신 명세서 정보를 반환합니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: dodam_life
- id: 10f8ec90-c4a3-5c07-9843-39a496e551fb
  title: set_alerts 사용 기준
  body: '고객이 보험료 납입 예정 안내, 계약 상태 변경 알림, 또는 주요 고지 사항 수신 설정을 요청할 경우 `set_alerts` 도구를
    사용하여 처리하십시오. 본 절차는 고객의 정보 보호와 정확한 설정 적용을 위해 다음의 표준 단계를 엄격히 준수해야 합니다.


    1. 고객의 본인 인증을 최우선으로 수행합니다. 상담원은 `verify_identity` 도구를 호출하여 고객이 제공한 성함과 생년월일을 확인하십시오.
    보안 지침에 따라 일회성 인증 코드, MFA, 비밀번호 또는 주민등록번호 전체와 같은 민감 정보는 절대 요구하지 않습니다.

    2. 고객이 희망하는 알림의 종류와 수신 경로를 구체적으로 파악하여 상담 내역에 기록합니다.

    3. `set_alerts` 도구를 호출하여 고객의 알림 설정을 업데이트합니다. 도구 호출 후 처리 결과가 성공적으로 반환되면, 고객에게 설정이
    정상적으로 변경되었음을 정중하게 안내하십시오.


    모든 알림 설정 변경은 대한민국 표준 영업시간(KST)을 기준으로 처리되며, 디지털 채널을 통해 즉시 반영됩니다. 도구의 상세한 매개변수와
    작동 방식은 `set_alerts 도구 설명서`에서 확인하실 수 있습니다.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: dodam_life
- id: 496bd42a-9d6c-550d-b58e-4b0f63663481
  title: set_alerts 도구 설명서
  body: '본 도구는 고객이 보험 계약과 관련하여 수신하고자 하는 알림의 종류와 설정 상태를 관리하는 데 사용됩니다. 상담원은 고객의 요청에
    따라 알림 기능을 활성화하거나 변경하기 위해 `set_alerts` 도구를 호출하여 처리합니다.


    이 도구를 호출하기 전, `verify_identity` 도구를 통해 고객의 성함과 생년월일을 확인하여 본인 인증을 완료하는 과정이 필수적입니다.
    본 도구는 별도의 입력 인자를 요구하지 않으며, 상담원이 진행 중인 대화의 맥락과 인증된 고객 계정의 식별 정보를 기반으로 알림 설정을 업데이트하는
    방식으로 작동합니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
