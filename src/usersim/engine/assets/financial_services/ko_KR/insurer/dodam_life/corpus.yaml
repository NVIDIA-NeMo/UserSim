- id: 392fb60c-03ab-5082-b5b8-9e647f843852
  title: '도담 연금보험: 거래가 거절되거나 제한되었을 때'
  body: '보험료 납입 방법 변경이나 중도 인출, 대출 신청 등 거래가 거절되거나 제한되는 경우 다음과 같이 조치하십시오.


    1. 증상 확인: ''거래가 불가능한 계약 상태입니다'' 또는 ''인증 정보가 일치하지 않습니다''라는 안내를 받는 경우입니다.


    2. 원인 파악 및 해결

    - 본인 인증 오류: 성함과 생년월일이 정확하게 입력되었는지 확인하십시오. 이 외의 추가 인증 수단을 요구하는 경우는 사기일 가능성이 높으므로
    주의하십시오.

    - 계약 상태 확인: 보험료 미납으로 인해 계약이 실효 상태인지 확인하십시오. 실효 상태에서는 일부 서비스 이용이 제한될 수 있으며, 이 경우
    부활 절차가 필요합니다.

    - 납입 제한: 보험차익 비과세 월 납입 한도인 1,500,000원을 초과하여 납입하려 했는지 확인하십시오.


    3. 조치 및 에스컬레이션

    상담원을 통해 계약 상태를 확인하신 후, 단순 오류가 아닐 경우 전문 심사역으로 에스컬레이션하여 상세 사유를 확인하고 해결 방안을 안내받으시기
    바랍니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a218064d-4625-5bc6-9b94-b427b73eccfb
  title: '도담 연금보험: 전환이나 상위 상품을 고려할 때'
  body: '고객께서 자산 형성 목적에서 사망 보장 목적으로 전환하시거나 상품 변경을 고려하실 때 참고하십시오.


    도담 연금보험은 노후 자금 마련과 보험차익 비과세(10년 유지, 월 1,500,000원 이하 5년 납입 조건)에 특화된 저축성 상품입니다.
    반면, 가족의 경제적 안정을 위한 사망 보장이 우선이라면 도담 종신보험(저해지환급형)이나 도담 정기보험으로의 전환이 적합합니다.


    연금보험은 65세부터 연금을 수령하는 것이 핵심이며, 종신보험은 평생 사망을 보장하는 것에 집중합니다. 고객님의 현재 생애 주기와 최우선 가치가
    ''노후 소득''인지 ''사망 보장''인지에 따라 적절한 상품을 추천해 주십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ff97d5cf-8202-571e-bd50-96617a3f938d
  title: '도담 연금보험: 다른 상품과의 비교와 맞지 않는 경우'
  body: '도담 연금보험은 안정적인 노후 준비를 위한 상품으로, 목적에 따라 다른 상품이 더 적합할 수 있습니다.


    1. 도담 연금보험이 적합한 경우

    - 65세 이후의 안정적인 생활 자금을 마련하고자 하시는 분

    - 10년 이상의 장기 유지를 통해 보험차익 비과세 혜택을 받고자 하시는 분 (월 납입 1,500,000원 이하, 5년 이상 납입 조건 충족
    시)


    2. 다른 상품이 더 적합한 경우

    - 갑작스러운 사고나 질병에 대한 병원비 보장이 필요하신 분 → 도담 건강보험 또는 도담 암보험을 권장합니다.

    - 본인의 유고 시 가족에게 남겨줄 고액의 사망 보험금이 필요하신 분 → 도담 종신보험(저해지환급형) 또는 도담 정기보험이 적합합니다.

    - 단기적인 자금 회수가 빈번하게 필요하신 분 → 본 상품은 장기 유지 상품으로, 중도 해지 시 원금 손실이나 비과세 혜택 상실의 위험이 있습니다.


    도담 연금보험은 정해진 연금 개시 나이인 65세까지 자산을 축적하는 상품임을 명확히 안내해 주십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ed4db2b8-af67-586a-9b1b-056221b41735
  title: '도담 연금보험: 보험차익 비과세 최소 납입 기간(년) 안내'
  body: '질문: 보험차익 비과세 혜택을 받기 위해 보험료를 최소 몇 년 동안 납입해야 합니까?


    답변: 도담 연금보험의 보험차익 비과세 혜택을 받으시려면 보험차익 비과세 최소 납입 기간(년)인 5년 이상을 균등하게 납입하셔야 합니다. 또한
    월 납입액이 1,500,000원 이하이어야 하며, 총 10년 이상 계약을 유지해야 한다는 조건을 모두 충족하셔야 비과세 적용이 가능합니다.
    납입 기간 및 방법 변경 시 혜택 적용 여부가 달라질 수 있으므로 주의하시기 바랍니다.'
