- id: 9adabb59-9e57-5616-9a06-5663cb7ddbbc
  title: '도담 건강보험: 상품 고르는 방법'
  body: '건강보험 상품을 선택하실 때는 보장 방식의 차이를 이해하는 것이 가장 중요합니다. 도담 건강보험과 일반적인 실손의료보험을 비교하여
    안내해 드립니다.


    [보장 방식 비교]

    - 도담 건강보험 (정액 보장형): 실제 치료비와 상관없이 약정된 금액을 지급합니다. 예를 들어, 입원 시 하루 30,000원, 수술 시 1,000,000원과
    같이 정해진 금액을 받으므로 자금 계획을 세우기에 유리합니다.

    - 실손의료보험 (비례 보장형): 가입자가 실제로 지출한 의료비 중 일부(자기부담금 제외)를 보상합니다. 실제 비용을 보전받는다는 장점이 있습니다.


    [추천 대상]

    - 도담 건강보험: 입원이나 수술 시 발생하는 간병비, 소득 상실분 등 추가적인 경제적 비용을 보전받고 싶으신 분께 적합합니다.

    - 실손의료보험: 실제 병원비 지출 자체를 줄이고 싶으신 분께 적합합니다.


    두 상품은 보완 관계에 있으므로, 함께 준비하시어 보다 촘촘한 보장 체계를 구축하시는 것을 권장합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4dacbb53-9ec1-54e3-ac3e-acad96123b8f
  title: '도담 건강보험: 개인정보 처리 안내'
  body: '도담생명은 고객님의 개인정보와 민감정보를 보험업법 및 개인정보 보호법에 따라 엄격히 관리합니다.


    [개인정보 수집 및 이용 목적]

    도담 건강보험의 가입 심사(언더라이팅), 보험료 산정, 보험금 지급 심사 및 고지 사항 전달을 위해 성함, 생년월일, 건강 상태 등의 정보를
    수집합니다.


    [민감정보 처리]

    보험금 청구 시 제출하시는 진단서 및 수술 확인서 등의 의료 정보는 보상 심사역이 지급 요건 충족 여부를 확인하기 위한 목적으로만 사용되며,
    처리 후 법정 보관 기간이 지나면 안전하게 파기됩니다.


    [고객의 권리 및 보호]

    - 데이터 프라이버시: 고객님의 정보는 철저히 암호화되어 관리되며, 외부 유출을 방지하기 위해 엄격한 보안 통제를 적용합니다.

    - 예금자 보호: 본 상품은 예금보험공사를 통해 예금자보호법에 따라 1인당 해약환급금 등을 합해 1억원까지 보호됩니다.


    [상담 시 주의사항]

    당사는 본인 확인을 위해 성함과 생년월일만을 요청합니다. 그 외의 주민등록번호 전체나 비밀번호 등을 요구하는 행위는 당사의 절차가 아니므로
    각별히 유의하시기 바랍니다.


    법적 고지: 본 안내는 일반적인 정보 제공을 목적으로 하며, 상세 내용은 보험약관 및 상품설명서의 명시된 조건을 따릅니다.'
  domain: insurance
  product_category: dodam_health
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 5a6d7996-2727-5d89-b485-a2eca7f46aba
  title: '도담 건강보험: 이 상품을 사칭한 사기 주의'
  body: '도담생명은 고객님의 소중한 자산과 정보를 보호하기 위해 최선을 다하고 있습니다. 최근 도담 건강보험의 보장 내용을 사칭하여 부당한
    이득을 취하려는 시도가 발견되고 있으니 각별히 주의하시기 바랍니다.


    도담생명의 상담원은 어떠한 경우에도 고객님께 일회성 인증 코드, MFA(다요소 인증) 번호, 계좌 비밀번호, 카드 번호, 또는 주민등록번호
    전체를 요구하지 않습니다. 본인 확인이 필요한 모든 상태 변경 작업 시, 상담원은 오직 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다.


    만약 상담원을 사칭하여 위와 같은 민감 정보를 요구하거나, 공식 채널이 아닌 경로로 송금을 유도하는 연락을 받으셨다면 즉시 대화를 중단하십시오.
    의심스러운 정황이 발견될 경우 당사 고객센터로 즉시 신고해 주시기 바랍니다. 신고가 늦어질 경우 피해 구제에 어려움이 있을 수 있으니 신속한
    대응을 부탁드립니다.


    금융위원회와 금융감독원의 감독을 받는 도담생명은 법규를 준수하며 고객님의 데이터 프라이버시를 철저히 관리하고 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f00a5638-bfe8-5ee0-a26f-b748e23d2c10
  title: '도담 건강보험: 한도·제한과 유의사항'
  body: '도담 건강보험의 정확한 상담과 안내를 위해 다음의 보장 한도 및 제한 사항을 숙지하시기 바랍니다.


    1. 보장 한도 및 지급 기준

    - 입원일당: 약정된 사고나 질병으로 입원 시 1일당 30,000원을 지급합니다.

    - 1회 입원 최대 지급 일수: 동일한 사고나 질병으로 인한 1회 입원 시 최대 180일까지 보장합니다.

    - 질병·상해 수술비(1회): 약관에서 정한 수술을 받았을 때 1회당 1,000,000원을 정액으로 지급합니다.


    2. 주요 유의사항

    - 정액 보장 방식: 본 상품은 실제 발생한 치료비와 상관없이 약정한 금액을 지급하는 정액 보장형 상품입니다. 실제 치료비를 보전하는 실손의료보험과는
    구조가 다르다는 점을 고객에게 명확히 안내하십시오.

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 약관에 따라 계약이 해지되거나
    보험금 지급이 제한될 수 있습니다.

    - 지급 결정: 상담원은 보험금 지급을 확정적으로 약속할 수 없으며, 모든 지급 건은 전문 보상 심사역의 심사를 통해 결정됩니다.'
  domain: insurance
  product_category: dodam_health
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 32d1b1be-2a97-51a5-8920-f95fb72ad732
  title: '도담 건강보험: 월 보험료 예시(35세 여성, 20년 납입) 안내'
  body: '질문: 도담 건강보험에 가입하고 싶은데, 대략적인 보험료 수준이 궁금합니다. 35세 여성 기준, 20년 납입 시 얼마 정도인가요?


    답변: 도담 건강보험의 월 보험료 예시는 38,000원입니다. 다만, 이는 이해를 돕기 위한 표준 예시이며, 고객님의 실제 건강 상태, 직업,
    세부 특약 설정 여부에 따라 최종 보험료는 달라질 수 있습니다. 정확한 보험료 산정은 상담원을 통해 고객님의 개인 정보를 기반으로 확인해 주시기
    바랍니다.


    더 자세한 상품 특징은 ''도담 건강보험: 이런 분께 알맞습니다'' 문서를 참고하십시오.'
  domain: insurance
