  institution_id: dodam_life
- id: 497192fb-a7e1-582a-bb86-74daa4064e1e
  title: '도담 암보험: 예상과 다른 수수료나 금액'
  body: '보험금 청구 시 예상하셨던 금액보다 적게 지급되었거나 보험료가 예상과 다른 경우, 다음의 원인을 확인해 주십시오.


    1. 보험금이 전액 지급되지 않은 경우 (50% 지급)

    - 원인: 감액기간 적용. 도담 암보험은 계약일부터 1년 미만인 기간 내에 암 진단을 받은 경우, 약정된 진단비의 50%만 지급하는 감액기간
    제도를 운영하고 있습니다.

    - 해결: 가입일로부터 1년이 경과했는지 확인하십시오. 1년 이후 진단 시에는 100%가 지급됩니다.


    2. 보험금이 전혀 지급되지 않은 경우

    - 원인: 면책기간 적용. 가입 후 90일 동안은 암 보장 면책기간으로, 이 기간 내 발생한 사고는 보장 대상에서 제외됩니다.

    - 해결: 증권상 가입일로부터 90일이 경과했는지 확인하십시오.


    3. 월 보험료가 생각과 다른 경우

    - 원인: 보험료는 고객님의 연령과 통계적 위험률에 기반하여 산정됩니다. 예시로 제시된 29,000원(40세 남성 기준)은 특정 조건의 사례이며,
    실제 금액은 개별 조건에 따라 다릅니다.

    - 해결: 가입 당시 안내받으신 상품 설명서의 보험료 산정 기준을 확인하시거나 상담원에게 상세 내역 조회를 요청하십시오.


    상기 내용으로 해결되지 않는 분쟁은 금융감독원을 통해 민원을 신청하실 수 있습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 0962a68c-03ee-573a-a1dc-bbb3a93bc468
  title: '도담 암보험: 필요 서류'
  body: '도담 암보험의 보험금 청구를 위해 필요한 서류 안내입니다. 청구 사유에 따라 제출 서류가 달라질 수 있습니다.


    | 청구 항목 | 필요 서류 | 제출 목적 |

    | :--- | :--- | :--- |

    | 일반암 진단비 (30,000,000원) | 암 진단서(조직검사 결과지 포함), 신분증 사본 | 암 진단 여부 및 확정 진단일 확인 |

    | 유사암 진단비 (6,000,000원) | 유사암 진단서, 조직검사 보고서, 신분증 사본 | 유사암 해당 여부 및 보장 범위 확인 |

    | 공통 사항 | 보험금 청구서, 수익자 명의 통장 사본 | 보험금 지급 대상 및 계좌 확인 |


    ※ 모든 서류는 최신 발행본이어야 하며, 진단서에는 질병분류코드가 명확히 기재되어 있어야 합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: eligibility_matrix
  source_authority: official
