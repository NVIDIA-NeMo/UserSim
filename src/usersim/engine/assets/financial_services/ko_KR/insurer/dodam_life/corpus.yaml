  institution_id: dodam_life
- id: f582768e-548e-5f64-bc32-ac2a564a4dd3
  title: '도담 종신보험(저해지환급형): 이용 조건별 차이'
  body: '도담 종신보험(저해지환급형) 이용 조건별 안내 사항입니다.


    - 납입 기간 중 해지 시: 표준형 대비 50% 수준의 낮은 해약환급금이 지급됩니다.

    - 납입 기간 완료 후 해지 시: 약관에 따라 산정된 정상 해약환급금이 지급됩니다.

    - 계약 전 알릴 의무 위반 시: 보험업법에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.

    - 보험증권 수령 후 15일(또는 청약일 30일) 이내: 청약철회 권리를 통해 납입 보험료를 돌려받을 수 있습니다.'
