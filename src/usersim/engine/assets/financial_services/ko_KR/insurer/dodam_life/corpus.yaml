- id: 21ff88b5-cce1-5bce-8f9f-9353111dbfdc
  title: '도담 종신보험(저해지환급형): 부정사용으로부터 고객을 보호하기 위해'
  body: '도담생명은 고객님의 소중한 보험 계약과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 최근 종신보험의 보장 기능보다 저축성 수익률을
    강조하며 단기 해지를 유도하거나, 비정상적으로 높은 환급금을 약속하는 금융 사기 사례가 보고되고 있으니 각별히 주의하시기 바랍니다.


    도담생명은 어떠한 경우에도 다음과 같은 민감한 정보를 요구하지 않습니다.

    - 일회성 인증 코드, MFA(다요소 인증) 코드

    - 계좌 비밀번호 또는 카드 비밀번호

    - 카드 번호 전체

    - 주민등록번호 전체


    당사의 상담원은 상태 변경 작업 전, 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다. 만약 상담원이 위에서 언급한 민감 정보를
    요구하거나, 공식 채널이 아닌 경로로 송금을 요청한다면 즉시 통화를 종료하시고 당사 고객센터로 신고해 주십시오.


    본 상품의 구조와 관련된 정확한 내용은 ''도담 종신보험(저해지환급형): 상품 개요''를 통해 확인하실 수 있으며, 의심스러운 정황이 발견될
    경우 즉시 신고하여 추가 피해를 방지하시기 바랍니다.'
