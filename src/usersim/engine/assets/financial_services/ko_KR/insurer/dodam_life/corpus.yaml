- id: 4285baf0-c725-562d-8339-13673c4d8e51
  title: '도담 암보험: 다른 회사의 일반적인 상품과의 비교'
  body: "도담 암보험과 시장 내 일반적인 암 보장 상품의 차이점을 안내해 드립니다.\n\n1. 보장 방식의 차이\n- 일반적인 실손의료보험:\
    \ 실제로 지출한 병원비의 일부를 보전하는 방식입니다.\n- 도담 암보험: 진단 시 실제 치료비와 상관없이 약정한 금액(일반암 30,000,000원,\
    \ 유사암 6,000,000원)을 지급하는 '정액 보장' 방식입니다.\n\n2. 활용도 비교\n- 실손보험은 병원비 충당에 유리하지만, 도담\
    \ 암보험은 진단비 형태로 고액을 일시에 지급받으므로 치료 기간 중의 생활비, 간병비, 소득 상실분 보전 등 경제적 안정망 구축에 더 유리합니다.\n\
    \n3. 추천 대상\n- 실제 치료비 외에 추가적인 생활 자금을 확보하고 싶으신 분께는 도담 암보험이 적합합니다.\n- 반면, 기본적인 병원비\
    \ 보장이 우선인 분께는 실손의료보험이 더 나은 선택일 수 있습니다. 가장 이상적인 방법은 두 상품을 상호 보완적으로 구성하는 것입니다.\n\
    \n--- \n본 안내는 객관적인 상품 설명서에 기반하며, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다."
  domain: insurance
  product_category: dodam_cancer
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 097f7192-d5a2-559e-baae-f699246f9663
  title: '도담 암보험: 위험 안내'
  body: "도담 암보험 가입 전, 고객님께서 반드시 인지하셔야 할 위험 및 제한 사항을 안내해 드립니다.\n\n1. 계약 전 알릴 의무 위반\
    \ 위험\n가입 시 과거 병력이나 현재의 건강 상태를 사실과 다르게 알리신 경우, 보험업법 및 약관에 따라 계약이 해지될 수 있으며, 암 진단을\
    \ 받더라도 보험금 지급이 제한될 수 있습니다.\n\n2. 보장 공백 기간 (면책 및 감액기간)\n- 면책기간: 가입 후 90일 동안은 보장\
    \ 대상에서 제외됩니다. 이 기간 내 진단 시 보험금이 지급되지 않습니다.\n- 감액기간: 계약일부터 1년 미만인 기간 내 진단 시에는 일반암\
    \ 진단비(30,000,000원) 및 유사암 진단비(6,000,000원)의 50%만 지급됩니다.\n\n3. 해약환급금 및 보호 한도\n- 중도\
    \ 해지 시 환급금은 납입한 보험료보다 적거나 없을 수 있습니다.\n- 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금과 그\
    \ 밖의 지급금을 합해 1억원까지 보호합니다.\n\n상담원은 보험금 지급을 확정적으로 약속하지 않으며, 모든 보장은 약관의 지급 조건 충족\
    \ 시에만 이루어집니다.\n\n--- \n본 안내는 금융위원회와 금융감독원의 감독을 받으며, 표준 맞춤법과 법적 고지 사항을 준수합니다."
  domain: insurance
  product_category: dodam_cancer
  document_type: disclosure
  source_authority: official
  placeholder: true
