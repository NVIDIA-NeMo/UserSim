- id: 4452e475-1c4e-5280-8ecc-204bdebd3588
  title: '도담 암보험: 유사암 진단비 안내'
  body: '질문: 도담 암보험에서 보장하는 ''유사암 진단비''란 무엇이며 얼마가 지급됩니까?


    답변: 유사암 진단비는 일반암과 구분하여 상대적으로 완치율이 높거나 발병률이 높은 특정 암(유사암)으로 진단되었을 때 지급되는 보장금입니다.
    도담 암보험 가입 고객님께서 유사암 진단을 받으신 경우, 약정된 유사암 진단비 6,000,000원을 지급해 드립니다.


    단, 가입 후 90일의 면책기간이 적용되며, 계약일부터 1년 미만인 감액기간 내에 진단 시에는 해당 금액의 50%만 지급되오니 유의하시기 바랍니다.
    자세한 내용은 ''도담 암보험: 약관''을 참조하십시오.'
  domain: insurance
  product_category: dodam_cancer
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6ea315da-35b0-5a92-9ccd-e03c31d7e018
  title: '도담 암보험: 해지·변경·상품 전환'
  body: "도담 암보험의 계약 해지, 내용 변경 또는 상품 전환을 원하시는 경우 다음 절차에 따라 진행해 주십시오.\n\n[준비 사항]\n-\
    \ 본인 확인을 위한 성함과 생년월일\n\n[처리 절차]\n1. 본인 인증: 상담원에게 성함과 생년월일을 말씀해 주십시오. 저희는 이 외의\
    \ 비밀번호나 카드 번호 등 민감 정보는 절대 요구하지 않습니다.\n2. 요청 사항 전달: 계약 해지, 보장 내용 변경, 또는 타 상품으로의\
    \ 전환 중 원하시는 업무를 말씀해 주십시오.\n3. 조건 확인 및 안내: 상담원이 현재 계약 상태(납입 회차, 해약환급금 등)를 확인하여\
    \ 안내해 드립니다. 특히 저해지환급형 구조의 경우 납입 기간 중 환급금이 적을 수 있음을 확인하십시오.\n4. 최종 의사 확인 및 처리:\
    \ 변경 또는 해지 의사를 최종 확정하시면 처리가 완료됩니다.\n5. 처리 결과 통보: 신청하신 내용이 반영되었음을 알림톡 또는 문자 메시지로\
    \ 안내해 드립니다.\n\n[참고 사항]\n- 청약철회 권리: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에는 가입\
    \ 의사를 철회하고 납입 보험료를 돌려받으실 수 있습니다.\n\n--- \n본 안내는 보험업법을 준수하며, 예금자보호법에 따라 예금보험공사가\
    \ 1인당 해약환급금 등을 합해 1억원까지 보호합니다."
  domain: insurance
  product_category: dodam_cancer
  document_type: how_to_guide
  source_authority: official
  placeholder: true
