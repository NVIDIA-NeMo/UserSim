  institution_id: dodam_life
- id: 73bdeedd-58eb-5227-9f10-4fd53d285185
  title: '도담 암보험: 금리·요율이 정해지는 방식과 적용'
  body: "도담 암보험의 보험료 산정 방식 및 적용 요율에 대해 안내해 드립니다.\n\n1. 보험료 산정 원칙\n본 상품의 보험료는 통계적 위험률과\
    \ 가입자의 연령에 기반하여 합리적으로 산정됩니다. 이는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다.\n\
    \n2. 보험료 결정 요인\n- 연령: 가입 시점의 연령이 높을수록 위험률이 증가하여 보험료가 상향 조정됩니다.\n- 성별: 통계적 발병률\
    \ 차이에 따라 남성과 여성의 보험료 요율이 다르게 적용됩니다.\n- 가입 금액: 약정한 진단비(일반암 30,000,000원 등)의 규모에\
    \ 따라 보험료가 결정됩니다.\n\n3. 보험료 예시\n- 40세 남성, 20년 납입 기준: 월 29,000원\n\n본 상품은 보장을 목적으로\
    \ 하는 보험으로, 저축 수단이 아님을 알려드립니다. 정해진 보험료 체계를 준수하며, 상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의\
    \ 편의를 제공합니다.\n\n--- \n본 안내는 보험업법을 준수하며, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지\
    \ 보호합니다."
  domain: insurance
