- id: 14701753-ef8c-5bce-9823-6983cee0ac03
  title: change_payment_method 사용 기준
  body: '보험료 납입 방법이나 출금 계좌를 변경하고자 하는 고객님을 위한 처리 절차입니다.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 통해 변경 대상이 되는 account_id를 확인하십시오.

    3. 고객님께 새로운 납입 방법(자동이체 또는 신용카드)과 출금 계좌 정보(은행명, 계좌번호)를 정확히 확인하십시오.

    4. 수집된 정보를 바탕으로 change_payment_method 도구를 호출하여 변경 사항을 반영하십시오.


    납입 방법 변경 시 다음 결제일로부터 적용되는지 또는 즉시 적용되는지를 안내하고, 계좌 변경으로 인한 미납이 발생하지 않도록 주의를 당부하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_payment_method
  institution_id: dodam_life
- id: 09f755c8-fdc2-5a4a-baa1-3e20e7393667
  title: change_payment_method 도구 설명서
  body: "change_payment_method 도구는 고객의 보험료 납입 방법이나 출금 계좌를 변경할 때 사용합니다. 상담원은 이 도구를\
    \ 직접 호출하여 변경 작업을 수행하며, 고객에게 외부 채널로의 이동을 안내하지 않습니다.\n\n- **호출 시점**: 고객의 본인 인증이\
    \ `verify_identity` 도구를 통해 완료된 후, 납입 방법 변경 요청이 있을 때 호출합니다.\n- **입력 인수**:\n   \
    \ - `account_id`: 변경 대상 보험 계약의 고유 식별자입니다. `get_accounts` 도구를 통해 확인하십시오.\n    -\
    \ `payment_method`: 변경하고자 하는 납입 방식(예: 자동이체, 신용카드)을 입력합니다.\n    - `payment_details`:\
    \ 새로운 계좌 번호나 카드 정보 등 납입에 필요한 상세 정보를 입력합니다.\n- **실행 결과**: 요청한 납입 방법 및 계좌 정보가 시스템에\
    \ 반영되며, 변경 완료 여부를 반환합니다."
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
