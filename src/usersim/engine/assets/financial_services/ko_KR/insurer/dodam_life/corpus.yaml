- id: bd291e3f-3f9f-5609-a9a0-f0f4363585e2
  title: '도담 연금보험: 상품 개요'
  body: '도담 연금보험은 고객님의 편안하고 안정적인 노후 자금 마련을 위해 설계된 준비 상품입니다. 투명한 보험료 산정과 정직한 보장 체계를
    통해 은퇴 후의 경제적 안정을 지원하는 데 집중합니다.


    본 상품의 주요 특징은 다음과 같습니다.

    - 연금 개시 나이: 65세부터 연금 수령이 가능합니다.

    - 보험료 예시: 30세 가입자가 20년 동안 납입하는 경우, 월 보험료 예시는 300,000원입니다.

    - 비과세 혜택: 일정 요건 충족 시 보험차익에 대한 비과세 혜택을 제공합니다. 이를 위해서는 보험차익 비과세 월 납입 한도인 1,500,000원
    이하로 납입하셔야 하며, 최소 납입 기간 5년 및 최소 유지 기간 10년을 충족해야 합니다.


    도담생명은 고객님의 생애 주기별 맞춤형 보장을 통해 신뢰받는 금융 파트너가 되겠습니다. 상세한 가입 절차는 ''도담 연금보험: 가입과 이용
    시작''에서 확인하십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 220576a9-c527-52e7-a156-89ffcec5e7ff
  title: '도담 연금보험: 연금 개시 나이 안내'
  body: '도담 연금보험의 연금 수령 시점에 대해 자주 묻는 질문입니다.


    **질문: 연금은 언제부터 받을 수 있습니까?**

    답변: 도담 연금보험의 연금 개시 나이는 65세입니다. 해당 연령에 도달하신 시점부터 약정된 연금액을 수령하실 수 있습니다.


    **질문: 연금 개시 나이를 변경할 수 있습니까?**

    답변: 상품의 기본 설정은 65세이나, 세부 계약 조건에 따라 변경 가능 여부가 다를 수 있습니다. 정확한 내용은 가입하신 보험증권이나 약관을
    확인하시거나 상담원에게 문의하십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: adcfc7ae-b72e-55cc-b1b5-c5a5893b2378
  title: '도담 연금보험: 가입과 이용 시작'
  body: '도담 연금보험 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 상품 상담 및 설계: 고객님의 연령과 희망하는 노후 자금 규모를 바탕으로 월 보험료를 설계합니다. 예를 들어 30세 가입, 20년 납입
    시 월 보험료 예시는 300,000원입니다.

    2. 본인 인증: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 계약 진행이 가능합니다.

    3. 계약 전 알릴 의무 이행: 과거 병력 등 중요 사항을 사실대로 알려주십시오. 이를 위반할 경우 계약이 해지되거나 보험금 지급이 제한될
    수 있습니다.

    4. 청약서 작성 및 서명: 설계된 보험료와 비과세 요건(월 납입 한도 1,500,000원 이하, 최소 납입 5년, 최소 유지 10년 등)을
    확인하신 후 청약서에 서명하십시오.

    5. 보험료 납입 및 증권 수령: 첫 회 보험료를 납입하시면 계약이 성립되며, 이후 보험증권을 수령하시게 됩니다.


    보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에는 청약철회가 가능합니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 9ef17af3-250a-50d9-9cb0-e45aa2c412f7
  title: '도담 연금보험: 수수료 안내'
  body: '도담 연금보험의 보험료 산정 및 수수료 체계는 다음과 같습니다.


    - 보험료 산정 기준: 통계적 위험률과 고객님의 가입 연령에 기반하여 합리적으로 산정됩니다.

    - 보험료 사용처: 징수된 보험료는 미래의 연금 지급을 위한 준비금 적립과 효율적인 제도 운영 비용으로 사용됩니다.

    - 납입 유예: 상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하며, 상세 조건은 개별 계약 내용을 확인하십시오.


    모든 보험료 체계는 금융위원회와 금융감독원의 감독 하에 투명하게 운영됩니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f95fb471-7ab8-5675-a5ae-63a9ba4d1de8
  title: '도담 연금보험: 처리가 끝나지 않거나 보류 중일 때'
  body: '연금보험 가입 신청이나 변경 요청 후 처리가 지연되거나 보류 중인 경우, 다음 내용을 확인해 주십시오.


    **증상: 신청 상태가 ''심사 중'' 또는 ''보류''에서 변경되지 않습니다.**

    - 원인 1: 본인 인증 정보(성함, 생년월일)가 기존 등록 정보와 일치하지 않는 경우

    - 원인 2: ''계약 전 알릴 의무'' 사항 중 추가 확인이 필요한 정보가 포함된 경우

    - 원인 3: 제출 서류의 누락 또는 기재 사항 불분명


    **해결 방법:**

    1. 상담원에게 본인의 성함과 생년월일을 다시 한번 확인하여 인증 상태를 점검하십시오.

    2. 미비된 서류나 추가 답변이 필요한 사항이 있는지 확인하고 보완하십시오.


    **에스컬레이션 안내:**

    단순 문의로 해결되지 않는 전문적인 심사 건이나 복잡한 보류 건은 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여 정밀하게 처리하며, 처리
    결과는 개별적으로 안내해 드립니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 75c55b3f-c860-5e4f-8816-f0dc81cc17aa
  title: '도담 연금보험: 가입 대상'
  body: '도담 연금보험의 가입 가능 여부는 다음 기준에 따라 결정됩니다.


    - 가입 가능 연령: 대한민국 거주자로, 상품 약관에서 정한 가입 가능 연령 범위 내에 있어야 합니다. (상세 연령은 설계 시 확인 가능)

    - 본인 인증 가능 여부: 성함과 생년월일을 통해 본인 확인이 가능한 고객님이어야 합니다.

    - 고지의무 준수: 계약 전 알릴 의무 사항을 성실히 답변하고, 보험사의 인수 심사(언더라이팅)를 통과해야 합니다.

    - 납입 능력: 월 보험료(예: 30세 20년 납입 시 300,000원)를 지속적으로 납입할 수 있는 경제적 능력이 필요합니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a339bdd6-0891-5952-a542-f48e1e82bff7
  title: '도담 연금보험: 당사의 비슷한 상품과의 비교'
  body: '노후 준비와 사망 보장 목적에 따라 도담 연금보험과 도담 종신보험(저해지환급형) 중 선택하실 수 있습니다.


    - 도담 연금보험: 노후 자금 마련이 주된 목적입니다. 65세부터 연금을 수령하여 생애 주기별 경제적 안정을 도모하며, 월 1,500,000원
    이하 납입 시 비과세 혜택(10년 유지, 5년 납입 조건)을 제공합니다.

    - 도담 종신보험(저해지환급형): 평생 사망 보장에 집중한 상품입니다. 저해지환급형 구조로 납입 기간 중 보험료 부담을 줄였으며, 저축 수단이
    아닌 가족 보호를 위한 사망 보장 상품입니다.


    **추천 고객**

    - 은퇴 후 매월 안정적인 현금 흐름을 확보하고 싶으신 분 → 도담 연금보험

    - 합리적인 비용으로 평생의 사망 보장을 준비하고 싶으신 분 → 도담 종신보험(저해지환급형)'
  domain: insurance
  product_category: dodam_annuity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: bfc47067-e8ea-5e6a-9503-aaaa92334d58
  title: '도담 연금보험: 상품설명서 주요 내용'
  body: '본 상품의 계약 및 운영에 관한 주요 법적 고지 사항입니다.


    - 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금, 만기보험금, 사고보험금 등을 합해 1억원까지 보호합니다.
    단, 연금저축보험은 별도로 1억원까지 보호됩니다.

    - 비과세 요건: 보험차익 비과세를 위해서는 보험차익 비과세 월 납입 한도 1,500,000원 이하를 유지하며, 최소 납입 기간 5년 이상
    균등 납입하고, 최소 유지 기간 10년 이상을 충족해야 합니다.

    - 계약자의 권리: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회할 수 있습니다.

    - 주의 사항: 상담원은 보험금 지급을 확정적으로 약속하지 않으며, 개별적인 세무, 의료, 법률 조언은 제공하지 않습니다. 모든 안내는 객관적인
    상품 설명서에 기반합니다.


    본 상품은 금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4e24bec3-c686-5eaa-b2f2-ec1329d5e0f3
  title: '도담 연금보험: 금리·요율 안내'
  body: '도담 연금보험의 금리 및 요율 적용 방식은 다음과 같습니다.


    - 보험료 산정 요율: 통계적 위험률과 가입 시점의 연령을 기준으로 합리적으로 산정됩니다. 가입 연령이 낮을수록, 납입 기간이 길수록 효율적인
    준비가 가능합니다. (예: 30세 20년 납입 시 월 보험료 예시 300,000원)

    - 적립 금리: 안정적인 노후 자금 마련을 위해 시장 금리 상황을 반영하여 운영되며, 상세 금리는 상품 설명서의 공시 이율을 따릅니다.

    - 비과세 적용 요율: 보험차익 비과세 혜택은 월 납입액 1,500,000원 이하, 5년 이상 납입 및 10년 이상 유지 시 적용됩니다.


    상세 금리 변동 내역은 도담생명 공식 디지털 채널을 통해 확인하십시오.'
  domain: insurance
  product_category: dodam_annuity
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4c069b1f-e804-5f77-8c6c-1abc452035e1
  title: '도담 연금보험: 진행 중인 이벤트'
  body: '도담생명과 함께하시는 고객님을 위한 ''2026년 상반기 노후 설계 캠페인''을 안내해 드립니다.


    - 대상: 도담 연금보험 기가입 고객님

    - 기간: 2026년 1월 1일부터 2026년 3월 31일까지

    - 내용: 캠페인 기간 내에 노후 설계 상담을 신청하시고, 현재의 납입 현황 및 비과세 요건(월 1,500,000원 한도, 10년 유지 등)
    충족 여부를 점검받으신 고객님께 소정의 혜택을 드립니다.

    - 신청 방법: 고객센터 전화 상담 또는 공식 디지털 채널을 통해 ''노후 설계 상담''을 요청하십시오.


    더욱 든든한 미래를 위해 도담생명이 함께하겠습니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 37a6bba8-2eb5-5e4b-baf2-5fd1fa0bd629
  title: '도담 연금보험: 부정사용으로부터 고객을 보호하기 위해'
  body: '도담생명은 고객님의 소중한 노후 자산인 도담 연금보험을 안전하게 보호하기 위해 엄격한 보안 인증 절차를 운영하고 있습니다.


    상담원을 통한 모든 계약 상태 변경 및 개인정보 수정 작업 전, 당사는 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다. 도담생명은
    어떠한 경우에도 다음과 같은 민감 정보를 요구하지 않습니다.


    1. 일회성 인증 코드(OTP) 및 다요소 인증(MFA) 값

    2. 계정 비밀번호 및 보안 비밀번호

    3. 신용카드 번호 및 은행 계좌 비밀번호

    4. 주민등록번호 전체 자리


    최근 연금보험의 고수익을 보장한다며 개인정보나 송금을 요구하는 사칭 사례가 보고되고 있습니다. 당사의 상담원은 보험금 지급을 확정적으로 약속하지
    않으며, 정해진 절차 외의 추가 인증을 요구하지 않습니다. 만약 의심스러운 연락을 받으셨거나 본인도 모르는 계약 변경이 의심될 경우, 즉시
    당사 고객센터로 신고하여 주시기 바랍니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: security_advisory
  source_authority: official
