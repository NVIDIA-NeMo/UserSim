  institution_id: dodam_life
- id: 89cce704-9635-58a9-b8e5-4677c24faf15
  title: '도담 암보험: 처리가 끝나지 않거나 보류 중일 때'
  body: '보험 가입 신청 후 처리가 완료되지 않고 ''심사 중'' 또는 ''보류'' 상태인 경우, 다음 내용을 확인하십시오.


    1. 증상: 가입 신청을 완료했으나 보험증권이 발행되지 않고 처리가 지연됨

    2. 예상 원인

    - 전문 언더라이터의 정밀 심사가 필요한 경우

    - 계약 전 알릴 의무 사항 중 추가 확인이 필요한 병력이나 정보가 있는 경우

    - 제출 서류가 미비하거나 판독이 불가능한 경우

    3. 해결 방법

    - 상담원에게 현재 심사 단계와 보류 사유를 확인하십시오.

    - 추가 증빙 서류(진단서, 소견서 등) 요청이 있을 경우, 해당 서류를 신속히 제출해 주십시오.

    4. 후속 조치

    - 서류 보완이 완료되면 전문 심사역이 재검토를 진행하며, 결과는 안내받으신 연락처로 개별 통보됩니다.


    심사 과정에서 보험금 지급 여부를 확정적으로 약속드릴 수 없으며, 모든 결과는 객관적인 심사 가이드라인에 따라 결정됩니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a6d5dd97-5593-593b-9110-ac1eed1f4143
  title: '도담 암보험: 가입 대상'
  body: '도담 암보험의 가입 가능 여부는 다음 기준에 따라 결정됩니다.


    - 연령 및 건강 상태: 보험사가 정한 가입 가능 연령 범위 내에 있으며, 건강 상태가 심사 기준을 충족하는 경우 → 가입 가능

    - 계약 전 알릴 의무 준수: 과거 병력 및 중요 사항을 사실대로 고지한 경우 → 가입 가능

    - 고지 의무 위반: 중요 사항을 누락하거나 사실과 다르게 알린 경우 → 가입 제한 또는 계약 해지 사유'
  domain: insurance
  product_category: dodam_cancer
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ad86aaf7-b66d-56fb-9ac3-b4cf19d933e4
  title: '도담 암보험: 당사의 비슷한 상품과의 비교'
  body: '도담 암보험과 도담 건강보험의 차이점은 다음과 같습니다.


    | 구분 | 도담 암보험 | 도담 건강보험 |

    | :--- | :--- | :--- |

    | 주요 목적 | 암 진단 시 고액의 자금 마련 | 입원 및 수술 시 정액 보장 |

    | 핵심 보장 | 일반암 진단비 30,000,000원 | 약정된 입원일당 및 수술비 지급 |

    | 보장 방식 | 암 진단 시 정액 지급 | 입원/수술 시 정액 지급 |

    | 특이 사항 | 면책 및 감액기간 적용 | 실손보험과 다른 정액 보장형 |


    [추천 고객]

    - 암 진단 시 치료비 외에 생활비 등 고액의 집중 보장이 필요하신 분은 ''도담 암보험''이 적합합니다.

    - 질병이나 상해로 인한 입원과 수술비 전반을 준비하고 싶으신 분은 ''도담 건강보험''을 추천드립니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 5e80ff14-6354-59d7-b2d1-9c95e851bc52
  title: '도담 암보험: 상품설명서 주요 내용'
  body: '본 문서는 도담 암보험의 주요 내용을 안내하는 고지 사항입니다.


    [보장 금액]

    - 일반암 진단 시 30,000,000원을 지급하며, 유사암 진단 시에는 6,000,000원을 지급합니다.


    [제한 기간]

    - 면책기간: 보험 가입 후 90일 동안은 암 진단 시 보장 대상에서 제외됩니다.

    - 감액기간: 계약일부터 1년 이내에 암 진단 시, 일반암 및 유사암 진단비의 50%만 지급합니다.


    [소비자 권리 및 의무]

    - 계약 전 알릴 의무: 가입 시 과거 병력을 사실대로 알려야 하며, 위반 시 계약 해지 또는 보험금 지급이 제한될 수 있습니다.

    - 청약철회: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 철회가 가능합니다.


    [법적 고지]

    - 도담생명은 금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다.

    - 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 9a39b792-373c-5f0a-8708-b5d4d34904c9
  title: '도담 암보험: 금리·요율 안내'
  body: '도담 암보험의 보험료는 가입 시점의 통계적 위험률과 고객님의 연령, 성별 등의 요율을 적용하여 산출됩니다.


    - 요율 적용 원칙: 연령이 높을수록, 또는 위험률이 높은 조건일수록 보험료가 상향 조정됩니다.

    - 보험료 예시: 40세 남성이 20년 납입 조건으로 가입할 경우, 월 보험료는 29,000원으로 산정됩니다.


    납입 보험료는 미래의 보험금 지급을 위한 준비금 적립에 사용되며, 정해진 요율 체계에 따라 투명하게 운영됩니다. 개별 고객님의 정확한 보험료는
    상세 심사를 통해 결정됩니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 16a47d1d-250e-5bd5-8a96-59c70bbc9a73
  title: '도담 암보험: 진행 중인 이벤트'
  body: '도담생명에서 기존 고객님을 위해 ''건강한 내일, 함께 준비'' 이벤트를 진행합니다.


    - 이벤트 기간: 2026년 1월 1일부터 2026년 1월 31일까지

    - 이벤트 내용: 도담 암보험 가입 고객님이 기간 내에 건강 관리 상담을 신청하실 경우, 맞춤형 건강 가이드북을 무료로 제공해 드립니다.

    - 참여 방법: 상담원에게 이벤트 참여 의사를 말씀해 주십시오.


    본 이벤트는 한정 수량으로 진행되며, 조기에 종료될 수 있습니다. 고객님의 소중한 건강과 경제적 안정을 위해 도담생명이 함께하겠습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 878569b2-5fff-5fc9-853a-94ea2fd83c5a
  title: '도담 암보험: 부정사용으로부터 고객을 보호하기 위해'
  body: "도담생명은 고객님의 소중한 보험 계약과 개인정보를 보호하기 위해 엄격한 본인 인증 절차를 준수하고 있습니다.\n\n상담원이 고객님의\
    \ 상태 변경 작업이나 중요 정보 조회를 수행할 때는 오직 성함과 생년월일만을 확인하여 본인 인증을 진행합니다. 도담생명은 어떠한 경우에도\
    \ 다음과 같은 민감 정보를 요구하지 않습니다.\n\n- 일회성 인증 코드(OTP) 및 다요소 인증(MFA) 번호\n- 계정 비밀번호 또는\
    \ 보안 카드 번호\n- 주민등록번호 전체 자리\n- 신용카드 번호 및 CVC 번호\n\n만약 상담원이 위와 같은 정보를 요구하거나, 공식\
    \ 채널이 아닌 경로로 개인정보 입력을 유도한다면 즉시 상담을 중단하시고 도담생명 고객센터로 신고해 주십시오. 의심스러운 정황을 발견하신 즉시\
    \ 보고해 주셔야 신속한 조치와 피해 방지가 가능합니다.\n\n금융감독원 및 관계 법령에 따라 고객님의 데이터 프라이버시는 철저히 관리되며,\
    \ 비정상적인 접근 시도가 감지될 경우 계정 보호를 위해 서비스 이용이 일시적으로 제한될 수 있습니다.\n\n--- \n본 안내는 보험업법\
    \ 및 금융소비자보호법을 준수하며, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다."
  domain: insurance
  product_category: dodam_cancer
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ccfb63a7-4795-57d2-a7f2-ba115e8fd34a
  title: '도담 암보험: 약관'
  body: "본 약관은 도담 암보험의 계약 체결 및 보험금 지급에 관한 권리와 의무를 규정합니다.\n\n1. 보험금 지급 기준\n- 일반암 진단\
    \ 시: 약정한 일반암 진단비 30,000,000원을 지급합니다.\n- 유사암 진단 시: 약정한 유사암 진단비 6,000,000원을 지급합니다.\n\
    \n2. 보장 제한 기간\n- 면책기간: 보험 가입 후 90일 동안은 암 보장 대상에서 제외되며, 이 기간 내 진단 시 보험금이 지급되지 않습니다.\n\
    - 감액기간: 계약일부터 1년 미만인 기간 내에 암 진단을 받은 경우, 일반암 및 유사암 진단비의 50%만 지급합니다.\n\n3. 계약자의\
    \ 의무\n- 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 약관에 따라\
    \ 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.\n\n4. 계약의 해지 및 철회\n- 청약철회: 보험증권을 받은 날부터 15일 이내,\
    \ 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입한 보험료를 돌려받을 수 있습니다. 다만, 진단계약 등 일부 계약은 철회가 제한될\
    \ 수 있습니다.\n\n--- \n본 상품은 금융위원회와 금융감독원의 감독을 받으며, 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을\
    \ 합해 1억원까지 보호합니다."
  domain: insurance
  product_category: dodam_cancer
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 8ec7aaeb-a7e6-5a34-86d4-bf2df9c3a4a4
  title: '도담 암보험: 이런 분께 알맞습니다'
  body: "도담 암보험은 암 진단 시 발생하는 고액의 치료비와 생활비를 보장받아 경제적 안정을 유지하고자 하는 분들을 위한 실속형 보장 상품입니다.\n\
    \n다음과 같은 분들께 추천드립니다:\n- 암 진단 시 가계 경제의 타격을 최소화할 수 있는 고액의 진단비를 준비하고 싶으신 분\n- 복잡한\
    \ 실손 보장 외에, 확정된 금액을 받는 정액 보장형 상품을 통해 집중 치료비를 마련하고 싶으신 분\n- 합리적인 보험료로 암이라는 중대 질병에\
    \ 대해 체계적으로 대비하고 싶으신 분\n\n[주요 보장 내용]\n- 일반암 진단비: 30,000,000원 지급\n- 유사암 진단비: 6,000,000원\
    \ 지급\n\n[보험료 예시]\n- 40세 남성, 20년 납입 기준: 월 29,000원\n(※ 위 금액은 예시이며, 실제 보험료는 고객님의\
    \ 연령 및 통계적 위험률에 따라 합리적으로 산정됩니다.)\n\n도담 암보험은 정액 보장 방식으로, 실제 발생한 치료비와 상관없이 약정한 사고나\
    \ 질병 발생 시 미리 정해진 금액을 지급하여 고객님의 경제적 자립을 지원합니다.\n\n--- \n본 안내는 보험업법을 준수하며, 예금자보호법에\
    \ 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다."
