- id: 8d73d951-4e78-516f-a0b7-9877ad9cf8c4
  title: '도담 정기보험: 등록 정보 변경'
  body: '보험 계약자의 연락처, 주소 등 등록 정보를 변경하는 절차를 안내해 드립니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 정보 변경 요청: 상담원에게 등록 정보 변경을 요청하십시오. 이때 본인 확인을 위해 성함과 생년월일을 말씀해 주십시오.

    2. 변경 내용 전달: 변경을 원하시는 정보(예: 전화번호, 거주지 주소, 이메일 등)의 정확한 내용을 말씀해 주십시오.

    3. 정보 수정 및 확인: 상담원이 시스템에 해당 정보를 업데이트합니다. 수정된 내용이 정확한지 상담원을 통해 다시 한번 확인하십시오.

    4. 완료 통보: 정보 변경이 완료되었다는 안내를 받으시면 모든 절차가 끝납니다.


    주의 사항: 도담생명은 본인 인증 시 성함과 생년월일 외에 비밀번호, 카드 번호, 주민등록번호 전체와 같은 민감 정보를 절대 요구하지 않습니다.'
  domain: insurance
