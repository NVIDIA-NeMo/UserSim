  institution_id: dodam_life
- id: dbb6c297-07d6-5412-8cf7-5156ffdd002f
  title: '도담 연금보험: 로그인하거나 접속할 수 없을 때'
  body: '디지털 채널을 통해 도담 연금보험의 계약 내역을 확인하려 할 때 접속이 되지 않는 경우의 해결 방법입니다.


    증상: 로그인 시 오류 메시지가 발생하거나, 인증 단계에서 다음 화면으로 넘어가지 않는 현상


    원인 및 확인 순서:

    1. 계정 정보 확인: 입력하신 아이디와 비밀번호가 정확한지 다시 확인하십시오. 대소문자 구분 및 오타 여부를 점검하십시오.

    2. 계정 잠금 상태 확인: 비밀번호 입력 오류 횟수 초과로 인해 계정이 일시적으로 잠겼는지 확인하십시오.

    3. 네트워크 상태 점검: 인터넷 연결이 불안정할 경우 접속 지연이 발생할 수 있습니다.


    해결 방법:

    - 비밀번호를 잊으신 경우, 디지털 채널의 ''비밀번호 찾기'' 기능을 이용하십시오.

    - 계정이 잠겼거나 본인 인증에 문제가 있는 경우, 상담원에게 계정 복구를 요청하십시오. 상담원이 성함과 생년월일을 확인하여 본인 인증을 수행한
    뒤 잠금을 해제해 드립니다.


    전문적인 심사나 복잡한 인증 오류로 인해 해결되지 않는 건은 보상 심사역 또는 IT 전문 담당자에게 에스컬레이션하여 처리하며, 조치 결과는
    등록된 연락처로 안내해 드립니다.'
