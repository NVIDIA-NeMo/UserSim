- id: 80c3287d-a0c2-5247-885e-aec0af44fd88
  title: file_claim 사용 기준
  body: '입원, 수술, 암 진단 또는 사망보험금 청구를 원하는 고객을 위해 다음 절차를 수행하십시오. 상담원은 보험금 지급 가능 여부를 확정적으로
    약속해서는 안 되며, 심사 결과에 따라 지급 여부가 결정됨을 정중히 안내하십시오.


    1. **본인 인증 수행**: `verify_identity` 도구를 사용하여 고객(또는 법적 상속인)의 성함과 생년월일을 확인하십시오.

    2. **계약 확인**: `get_accounts` 도구를 통해 보험금 청구 대상이 되는 계약의 `account_id`를 식별하십시오.

    3. **청구 내용 확인**: 사고 발생일, 질병명, 청구 사유(입원, 수술, 진단 등)를 확인하여 청구 유형을 분류하십시오.

    4. **필요 서류 안내**: 청구 유형에 따라 제출해야 할 진단서, 입퇴원 확인서, 수술 증명서 등 필요 서류를 상세히 안내하십시오.

    5. **보험금 청구 접수**: `file_claim` 도구를 호출하여 청구 건을 접수하십시오.

    6. **향후 절차 안내**: 접수 후 전문 보상 심사역의 심사 과정과 예상 지급 시기, `get_claim_status` 도구를 통한 진행
    상황 확인 방법을 안내하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: dodam_life
- id: a789a66b-1a07-53b3-aa4f-b82e7781d83c
  title: file_claim 도구 설명서
  body: "file_claim 도구는 고객의 보험금 청구 건을 시스템에 등록하고, 해당 건에 필요한 제출 서류를 안내하는 데 사용됩니다.\n\n\
    - **호출 시점**: `verify_identity`로 본인 인증이 완료되었으며, 고객이 청구 사유와 사고 일자 등 기본 정보를 제공했을\
    \ 때 호출합니다.\n- **입력 인수**:\n    - `account_id`: 보험금 청구 대상 계약의 고유 식별자입니다. `get_accounts`\
    \ 도구를 통해 확인하십시오.\n    - `claim_type`: 청구 유형(예: 입원, 수술, 암 진단, 사망 등)입니다.\n    -\
    \ `incident_date`: 사고 또는 진단이 발생한 날짜입니다.\n    - `claim_amount`: (해당 시) 고객이 청구하고자\
    \ 하는 금액입니다.\n- **실행 결과**: 보험금 청구 접수 번호를 생성하고, 해당 청구 유형에 따라 고객이 제출해야 할 서류 목록을 반환합니다."
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: dodam_life
- id: db96dc57-0579-5348-88c0-c2a3a7246cd4
  title: get_claim_status 사용 기준
  body: '접수된 보험금 청구 건의 처리 상황을 확인하고자 하는 고객을 위해 다음 절차를 수행하십시오.


    1. **본인 인증 수행**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **계약 확인**: `get_accounts` 도구를 통해 보험금 청구가 진행 중인 계약의 `account_id`를 확인하십시오.

    3. **상태 조회**: `get_claim_status` 도구에 `account_id`를 입력하여 현재 처리 단계(서류 접수, 심사 중,
    지급 완료 등)를 조회하십시오.

    4. **상세 안내**: 조회된 결과에 따라 현재 심사 진행 상황을 설명하십시오. 만약 서류 보완이 필요한 경우, 어떤 서류가 누락되었는지
    구체적으로 안내하십시오.

    5. **마무리**: 심사 완료 후 지급 예정일이나 처리 결과 통보 방식에 대해 안내하며 상담을 마칩니다.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: dodam_life
- id: eb7c66f2-e510-5d12-a104-8b5c40acc287
  title: get_claim_status 도구 설명서
  body: 'get_claim_status 도구는 고객님이 접수하신 보험금 청구 건의 현재 처리 상황을 확인하는 기능을 수행합니다.


    - 호출 시점: 보험금 청구의 처리 단계(서류 접수, 심사, 지급 예정 등)를 확인하고자 할 때 사용합니다.

    - 수행 내용: 상담원이 도구를 직접 호출하여 실시간 처리 상태를 조회하고 고객님께 안내합니다.

    - 전제 조건: 본 도구를 호출하기 전, 반드시 verify_identity 도구를 통해 고객님의 성함과 생년월일을 확인하여 본인 인증을 완료해야
    합니다. 별도의 일회성 코드나 비밀번호는 요구하지 않습니다.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: dodam_life
- id: ccd0b250-45a2-511f-a4be-67887e16b485
  title: update_policy 사용 기준
  body: '고객님의 보험 계약 내용을 변경하기 위한 상담 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오. 추가적인
    인증 수단이나 민감 정보는 요구하지 않습니다.

    2. 계약 확인: get_accounts 도구를 호출하여 고객님이 보유하신 전체 보험 계약 목록을 조회하고, 변경을 원하시는 계약의 account_id를
    정확히 확인하십시오.

    3. 변경 사항 상세 확인: 보험가입금액의 감액, 특약의 추가 또는 해지 등 구체적인 변경 요청 내용을 확인하십시오. 이때 상담원은 객관적인
    상품 설명서에 기반하여 안내하며, 보험금 지급을 확정적으로 약속해서는 안 됩니다.

    4. 변경 접수: 확인된 계약 정보와 변경 내용을 바탕으로 update_policy 도구를 호출하여 계약 변경 절차를 완료하십시오.


    상세한 도구의 기능은 ''update_policy 도구 설명서''를 참조하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: dodam_life
- id: 72d95343-ec3e-552d-85d2-326d214a0c0c
  title: update_policy 도구 설명서
  body: 'update_policy 도구는 기존에 체결된 보험 계약의 세부 내용을 변경하는 기능을 수행합니다.


    - 호출 시점: 보험가입금액 감액, 특정 특약의 추가 또는 해지 등 계약 내용의 변경이 필요할 때 사용합니다.

    - 수행 내용: 상담원이 도구를 직접 호출하여 요청된 변경 사항을 시스템에 접수합니다.

    - 전제 조건: 호출 전 verify_identity 도구를 통해 고객님의 본인 인증이 완료되어야 합니다. 상담원은 고객님이 직접 제공하신
    정보와 get_accounts를 통해 확인된 계약 정보를 바탕으로 작업을 수행합니다.'
  domain: insurance
