- id: 1eeac7c2-5fa6-5e81-a168-10eb7756b28c
  title: '도담 건강보험: 거래가 거절되거나 제한되었을 때'
  body: '보험금 청구, 계약 변경 또는 가입 신청 과정에서 거절이나 제한 메시지를 받으신 경우 다음 내용을 확인하십시오.


    1. 발생 가능한 원인

    - 계약 전 알릴 의무 위반: 가입 시 고지하지 않은 병력이 심사 과정에서 발견된 경우 청구가 거절되거나 계약이 해지될 수 있습니다.

    - 보험료 미납 및 실효: 보험료가 일정 기간 납입되지 않아 계약이 실효 상태인 경우, 보장 혜택 및 계약 변경이 제한됩니다.

    - 서류 미비: 청구에 필요한 필수 증빙 서류가 누락되었거나 판독이 불가능한 경우 처리가 보류됩니다.


    2. 확인 및 해결 방법

    - 상태 확인: 먼저 상담원에게 현재 계약의 상태(유지, 실효, 해지 등)를 확인하십시오.

    - 미납금 처리: 계약이 실효된 경우, 밀린 보험료와 이자를 납입하여 부활 절차를 진행하십시오.

    - 추가 소명: 고지 의무 위반으로 거절된 경우, 의료진의 소견서 등 추가 증빙 자료를 제출하여 재심사를 요청하십시오.


    3. 전문 심사 에스컬레이션

    상담 단계에서 해결이 어려운 복잡한 심사 건이나 보상 분쟁은 전문 언더라이터 및 보상 심사역에게 에스컬레이션하여 처리합니다. 심사 결과는 조사
    완료 후 정중하게 안내해 드리며, 자체 해결이 어려운 분쟁은 금융감독원을 통해 민원을 신청하실 수 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6cce0daf-cb99-5a7c-bec6-7fa851be4f62
  title: '도담 건강보험: 전환이나 상위 상품을 고려할 때'
  body: '고객님이 현재 이용 중인 도담 건강보험에서 다른 보장으로 전환하거나 상위 상품을 고려하실 때, 상담원은 다음 기준을 바탕으로 안내하십시오.


    1. 도담 건강보험 (현재 상품)

    - 특징: 입원 및 수술 시 정해진 금액(입원일당 30,000원, 수술비 1,000,000원 등)을 지급하는 정액 보장형 상품입니다.

    - 적합한 경우: 치료비 외에 입원 기간 동안의 생활비나 추가 간병비 등 확정적인 자금 마련을 원하시는 고객님께 적합합니다.


    2. 전환 고려 상품

    - 도담 암보험: 암이라는 특정 질병에 대해 고액의 진단비를 집중적으로 보장받고자 하실 때 권장합니다. 일반 건강보험보다 암 특화 보장이 강력합니다.

    - 도담 종신보험(저해지환급형): 건강 보장보다는 사망 보장을 통해 가족의 경제적 안정을 도모하고자 하실 때 적합한 상품입니다.


    상담원은 고객님의 생애 주기와 경제적 상황을 고려하여 객관적인 상품 설명서에 기반한 표준 가이드라인을 제시하십시오. 특정 상품의 가입을 강요하지
    않으며, 보장 범위의 차이를 명확히 설명하여 고객이 합리적인 선택을 하도록 지원하십시오.'
  domain: insurance
  product_category: dodam_health
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: b58033f9-6afd-56dd-b18f-58e2c93e468d
  title: '도담 건강보험: 다른 상품과의 비교와 맞지 않는 경우'
  body: '도담 건강보험은 입원과 수술 시 정해진 금액을 지급하여 경제적 안정을 돕는 상품입니다. 가입 전, 고객님의 목적에 부합하는지 확인하시기
    바랍니다.


    1. 실손의료보험과의 차이점

    - 실손의료보험: 실제 병원비로 지출한 금액의 일부를 돌려받는 방식입니다.

    - 도담 건강보험: 실제 비용과 관계없이 입원 시 30,000원, 수술 시 1,000,000원과 같이 약정한 금액을 정액으로 지급합니다. 따라서
    실손보험과 함께 준비하시면 치료비 보전과 생활비 확보라는 두 가지 목적을 동시에 달성하실 수 있습니다.


    2. 이런 분께는 맞지 않습니다

    - 저축이나 자산 증식을 주 목적으로 하시는 분: 본 상품은 보장성 보험으로, 저축 수단이 아닙니다. 노후 자금 마련이 목적이시라면 ''도담
    연금보험''을 추천드립니다.

    - 사망 보장을 최우선으로 하시는 분: 가족을 위한 경제적 사망 보장이 필요하신 분은 ''도담 종신보험''이나 ''도담 정기보험''이 더 적절한
    선택입니다.


    3. 이런 분께 추천합니다

    - 갑작스러운 입원이나 수술로 인해 발생하는 소득 공백을 메우고 싶으신 분

    - 실손보험 외에 추가적인 정액 보장을 통해 의료비 부담을 낮추고 싶으신 분'
  domain: insurance
  product_category: dodam_health
  document_type: product_sheet
  source_authority: official
  placeholder: true
