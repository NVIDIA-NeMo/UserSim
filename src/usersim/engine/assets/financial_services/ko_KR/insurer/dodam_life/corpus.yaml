- id: e7e3bb6e-3dce-5a08-b874-9786aadecfd5
  title: '도담 정기보험: 보험기간(년) 안내'
  body: 'Q: 도담 정기보험의 보장 기간은 어떻게 되나요?

    A: 본 상품의 보험기간(년)은 20년입니다. 정해진 20년의 기간 동안 사망 보장에 집중하여, 가장 경제적 책임이 큰 시기에 합리적인 비용으로
    가족을 보호하실 수 있습니다.


    Q: 20년이 지나면 보장이 계속 유지되나요?

    A: 본 상품은 정해진 기간만 보장하는 정기보험으로, 20년의 보험기간이 만료되면 보장도 함께 종료됩니다. 평생 보장을 원하시는 경우에는 ''도담
    종신보험(저해지환급형): 상품 개요''를 참고하여 주시기 바랍니다.'
  domain: insurance
  product_category: dodam_term
