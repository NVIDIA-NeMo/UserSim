- id: fb415994-c5c0-5302-8a03-51b52aa1198f
  title: '도담 종신보험(저해지환급형): 금리·요율 안내'
  body: '도담 종신보험(저해지환급형)의 환급률 및 보험료 산정 기준은 다음과 같습니다.


    - 납입기간 중 해약환급금 수준: 표준형 상품 대비 50% (보험료 납입 기간인 20년 동안 적용)

    - 보험료 산정 요율: 통계적 위험률과 고객님의 연령 및 성별에 기반하여 합리적으로 산정됩니다.

    - 적용 예시: 40세 여성 고객이 보험가입금액 100,000,000원으로 20년 납입 설계를 할 경우, 월 보험료는 186,000원입니다.


    본 상품은 저축 수단이 아닌 사망 보장을 위한 보험 상품이며, 저해지환급형 특성상 납입 기간 내 해지 시 환급금이 적으므로 유지 관리에 유의하시기
    바랍니다.'
