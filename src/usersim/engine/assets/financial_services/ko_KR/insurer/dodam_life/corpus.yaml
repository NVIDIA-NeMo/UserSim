- id: e4ee0d85-3a08-560e-912c-de08b5c8b5ef
  title: '도담 암보험: 약관 변경 안내'
  body: '본 안내는 ''도담 암보험''의 보장 체계 및 약관 변경 사항을 설명하며, 타 상품과의 비교 시 참고하시기 바랍니다.


    1. 보장 금액 및 지급 조건

    - 일반암 진단비: 암 진단 시 30,000,000원을 지급합니다.

    - 유사암 진단비: 유사암 진단 시 6,000,000원을 지급합니다.


    2. 지급 제한 및 감액 조건 (중요)

    - 면책기간: 계약일로부터 90일 동안은 암 보장 면책기간이 적용되어, 이 기간 중 암 진단을 받으셔도 보험금이 지급되지 않습니다.

    - 감액기간: 계약일부터 1년 이내에 암 진단을 받으신 경우, 감액기간 중 지급 비율인 50%만 지급합니다. (즉, 일반암 기준 15,000,000원
    지급)


    3. 계약자의 권리와 의무

    - 청약철회: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회하실 수 있습니다.

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하며, 이를 위반할 경우 계약이 해지되거나 보험금 지급이 제한될
    수 있습니다.


    본 약관은 보험업법 및 금융감독원의 감독하에 운영되며, 상세 내용은 상품 설명서의 표준 가이드라인을 따릅니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ec9bfb88-ea2b-5f11-b882-f504eee2bd51
  title: '도담 암보험: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객에게 ''도담 암보험''의 전 과정을 안내하기 위한 업무 매뉴얼입니다.


    [상품 핵심 가치]

    암 진단 시 고액의 보장금을 지급하여 치료 기간 중 경제적 안정을 지원하는 암 특화 보장 상품입니다.


    [주요 보장 내용]

    - 일반암 진단비: 30,000,000원

    - 유사암 진단비: 6,000,000원


    [지급 제한 사항]

    - 면책기간: 90일 (가입 후 해당 기간 내 진단 시 보장 제외)

    - 감액기간: 1년 (가입 후 1년 내 진단 시 보장금의 50%만 지급)


    [보험료 산정 예시]

    - 40세 남성, 20년 납입 기준 월 보험료 예시: 29,000원

    - 보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정됩니다.


    [운영 프로세스]

    1. 가입 상담: 고객의 연령 및 건강 상태 확인

    2. 계약 전 알릴 의무 이행: 과거 병력 등 고지 사항 확인

    3. 청약 및 심사: 전문 언더라이터의 심사를 통해 가입 확정

    4. 보험금 청구: 진단서 등 필요 서류 접수 후 보상 심사역의 심사를 거쳐 지급


    상담원은 보험금 지급을 확정적으로 약속해서는 안 되며, 반드시 객관적인 상품 설명서에 기반하여 안내하십시오.'
  domain: insurance
  product_category: dodam_cancer
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 453dad55-151e-525b-ab08-2e49e3f2709b
  title: '도담 암보험: 암 보장 면책기간(일) 안내'
  body: 'Q: ''도담 암보험''에 가입하자마자 바로 암 보장을 받을 수 있습니까?


    A: 아니오, 그렇지 않습니다. ''도담 암보험''에는 암 보장 면책기간(일)이 90일로 설정되어 있습니다. 계약일로부터 90일이 지나기 전에는
    암 진단을 받으시더라도 보장 대상에서 제외되어 보험금이 지급되지 않습니다. 이는 역선택을 방지하고 보험 제도의 안정적인 운영을 위한 조치이오니
    양해 부탁드립니다.


    더욱 자세한 보장 조건은 ''도담 암보험: 약관 변경 안내''에서 확인하실 수 있습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4d56dd6e-fd2d-5e58-acd6-34b7c1319fc1
  title: '도담 암보험: 등록 정보 변경'
  body: '보험 계약과 관련된 연락처, 주소 등 등록 정보를 변경하는 절차를 안내해 드립니다.


    [준비 사항]

    변경하시려는 최신 정보(새 주소, 새 연락처 등)를 미리 준비해 주십시오.


    [변경 절차]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주시면 본인 인증을 수행합니다.

    2. 변경 사항 요청: 변경을 원하시는 정보(예: 전화번호, 이메일 주소, 거주지 주소)를 구체적으로 말씀해 주십시오.

    3. 정보 업데이트: 상담원이 요청하신 내용을 시스템에 반영합니다.

    4. 최종 확인: 변경된 정보가 정확하게 입력되었는지 상담원이 다시 한번 읽어드리며 확인 절차를 거칩니다.


    [완료 확인]

    모든 변경 작업이 완료되면 등록된 연락처로 처리 결과 안내 메시지가 발송됩니다. 만약 변경 내용이 잘못되었다면 즉시 다시 요청해 주시기 바랍니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: ae9b8d8c-8fc8-5f6d-a2de-091aeadd8b96
  title: '도담 암보험: 로그인하거나 접속할 수 없을 때'
  body: '디지털 채널을 통해 ''도담 암보험''의 계약 내역을 확인하시려 할 때 접속이 되지 않는 경우, 다음 순서에 따라 조치해 주십시오.


    [증상]

    - 로그인 버튼을 눌러도 반응이 없거나 오류 메시지가 표시됨

    - 인증 과정에서 다음 단계로 넘어가지 않음


    [체크리스트 및 해결 방법]

    1. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오.

    2. 브라우저 캐시 삭제: 사용 중인 웹 브라우저의 설정에서 쿠키 및 캐시를 삭제한 후 재접속해 보십시오.

    3. 최신 버전 업데이트: 공식 디지털 채널 앱을 사용 중이시라면 최신 버전으로 업데이트되어 있는지 확인하십시오.


    [상담원 에스컬레이션]

    위의 조치 후에도 접속이 불가능한 경우, 상담원에게 상황을 말씀해 주십시오. 상담원은 고객님의 계정 상태를 확인한 후, 기술적인 결함이 발견되면
    전문 IT 지원팀으로 케이스를 접수하여 해결 방안을 제시해 드립니다. 처리 결과는 영업일 기준 1~3일 이내에 안내드립니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: c598aef4-df69-51cd-8764-863bff7de9ba
  title: '도담 암보험: 이용 조건별 차이'
  body: '고객님의 진단 결과 및 가입 시점에 따른 보장 금액 차이를 안내합니다.


    | 구분 | 조건 | 지급 금액/비율 |

    | :--- | :--- | :--- |

    | 일반암 진단 | 가입 후 1년 경과 후 진단 | 30,000,000원 |

    | 일반암 진단 | 가입 후 1년 이내 진단 (감액기간) | 15,000,000원 (50% 지급) |

    | 유사암 진단 | 가입 후 1년 경과 후 진단 | 6,000,000원 |

    | 유사암 진단 | 가입 후 1년 이내 진단 (감액기간) | 3,000,000원 (50% 지급) |

    | 모든 암 진단 | 가입 후 90일 이내 진단 (면책기간) | 지급되지 않음 |


    * 모든 보장은 ''계약 전 알릴 의무''를 성실히 이행했을 때 적용됩니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 2f322738-45d8-535c-a498-bdb67e583484
  title: '도담 암보험: 상품 고르는 방법'
  body: '암 보장 준비를 위해 상품을 고민 중이신 고객님께 ''도담 암보험''의 선택 기준을 안내해 드립니다.


    [정액 보장 vs 실손 보장]

    ''도담 건강보험''과 같은 정액 보장형 상품은 실제 치료비와 상관없이 약정한 금액을 지급합니다. ''도담 암보험'' 역시 정액 보장 방식으로,
    일반암 진단 시 30,000,000원을 지급하여 생활비나 간병비로 활용하실 수 있게 설계되었습니다.


    [추천 대상]

    - 암 진단 시 치료비 외에 고액의 집중 보장금이 필요하신 분

    - 월 29,000원(40세 남성 예시) 수준의 합리적인 비용으로 암 특화 보장을 원하시는 분


    반면, 실제 발생한 병원비를 충당하는 것이 목적이라면 실손의료보험을 고려하시되, 암과 같은 중증 질환에 대비하여 ''도담 암보험''을 함께
    구성하시는 것이 경제적 안정에 더욱 유리합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 9fdd71b4-adc8-535e-bf58-613263d81faa
  title: '도담 암보험: 개인정보 처리 안내'
  body: '도담생명은 관련 법령에 따라 고객님의 개인정보를 투명하게 처리하며, ''도담 암보험'' 이용 과정에서 수집되는 정보는 보험 계약 유지
    및 보험금 지급을 위해서만 사용됩니다.


    1. 수집 항목 및 목적

    - 수집 항목: 성함, 생년월일, 연락처, 건강 상태 및 과거 병력

    - 이용 목적: 보험 계약 체결, 언더라이팅 심사, 보험금 지급 및 본인 확인


    2. 법적 보호 및 준거 법령

    - 본 상품은 금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다.

    - 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금과 그 밖의 지급금을 합해 1억원까지 보호합니다.


    3. 소비자의 권익 보호

    - 고객님은 언제든지 본인의 개인정보로 열람, 정정, 삭제를 요청하실 수 있습니다.

    - 계약 전 알릴 의무 위반 시 계약 해지 등의 불이익이 있을 수 있으므로, 가입 시 정확한 정보를 제공하여 주십시오.


    데이터 프라이버시 관리 및 개인정보 처리 방침에 대한 상세 내용은 당사 공식 디지털 채널의 약관 페이지에서 확인 가능합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 005427cd-c6b6-5abb-94c5-5ca2a81164ab
  title: '도담 암보험: 이 상품을 사칭한 사기 주의'
  body: '최근 도담 암보험의 고액 보장 혜택을 사칭하여 고객님의 개인정보나 금융정보를 요구하는 사기 사례가 보고되고 있습니다. 도담생명은 고객님의
    소중한 자산과 정보를 보호하기 위해 엄격한 보안 원칙을 준수하고 있습니다.


    도담생명의 상담원은 상태 변경이나 본인 확인 작업 전, 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다. 그 외의 다음과 같은 정보는
    어떠한 경우에도 요구하지 않으므로 각별히 주의하시기 바랍니다.


    - 일회성 인증 코드 및 MFA(다요소 인증) 번호

    - 계좌 비밀번호 또는 카드 번호

    - 주민등록번호 전체 번호


    만약 도담생명을 사칭하여 위와 같은 민감 정보를 요구하는 연락을 받으셨다면, 즉시 응답을 중단하시고 공식 채널을 통해 확인하시기 바랍니다.
    의심스러운 정황을 발견하신 경우 신속히 당사 고객센터로 신고해 주십시오. 당사는 금융감독원의 가이드라인에 따라 고객님의 데이터를 철저히 관리하며,
    비정상적인 접근으로부터 계약을 보호하고 있습니다.'
