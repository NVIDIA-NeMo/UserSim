- id: ab817726-67ac-55a7-b7fb-48db2e67f961
  title: '도담 종신보험(저해지환급형): 등록 정보 변경'
  body: '고객님의 등록 정보(성함, 연락처, 주소 등)를 변경하는 절차를 안내드립니다.


    1. 상담원에게 정보 변경을 요청하십시오.

    2. 본인 인증을 위해 성함과 생년월일을 말씀해 주십시오. 도담생명은 이 외의 비밀번호나 주민등록번호 전체 등 민감 정보는 요구하지 않습니다.

    3. 변경하시고자 하는 구체적인 항목과 새로운 정보를 말씀하십시오. (예: 연락처 변경)

    4. 상담원이 변경 내용을 시스템에 반영하고, 정확하게 수정되었는지 최종 확인 내용을 읽어드립니다.

    5. 변경 완료 후, 변경 사항이 반영되었음을 알리는 안내 메시지 또는 확인서를 통해 절차가 완료되었음을 확인하십시오.


    등록 정보가 최신 상태로 유지되어야 보험금 지급 안내나 중요한 약관 변경 통지 등을 누락 없이 받으실 수 있습니다. 특히 수익자 변경과 같은
    중요 사항은 추가 서류가 필요할 수 있으므로, 상담원에게 필요 서류를 안내받으시기 바랍니다. 모든 변경 작업은 대한민국 표준 영업시간(KST)
    기준으로 운영되는 고객센터 및 공식 디지털 채널을 통해 지원됩니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d9578951-6007-5414-8f92-810cb4603d2d
  title: '도담 종신보험(저해지환급형): 로그인하거나 접속할 수 없을 때'
  body: '도담생명 디지털 채널에 로그인하거나 접속할 수 없는 경우, 다음의 단계에 따라 조치하시기 바랍니다.


    증상: 로그인 버튼 클릭 후 반응이 없거나, ''인증 정보가 일치하지 않습니다''라는 오류 메시지가 반복적으로 나타나는 경우입니다.


    원인 및 확인 순서:

    1. 네트워크 연결 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오.

    2. 계정 정보 확인: 입력하신 성함과 생년월일이 가입 당시 정보와 일치하는지 다시 한번 확인하십시오.

    3. 브라우저 및 앱 업데이트: 사용 중인 브라우저의 캐시를 삭제하거나, 최신 버전의 앱으로 업데이트한 후 다시 시도하십시오.


    해결 방법: 위 조치 후에도 접속이 되지 않는다면, 상담원에게 계정 상태 확인을 요청하십시오. 상담원이 본인 확인 절차를 거쳐 계정 잠금 여부나
    시스템 오류를 확인하여 해결해 드립니다.


    에스컬레이션: 단순 계정 확인으로 해결되지 않는 시스템 기술 오류의 경우, 전문 IT 지원 팀으로 내용을 전달하여 조사를 진행합니다. 이 과정에서
    접수 번호가 부여되며, 처리 결과는 고객님의 등록된 연락처로 안내됩니다. 접속 장애로 인해 급한 업무 처리가 필요하신 경우, 고객센터 전화
    상담을 통해 업무를 먼저 처리하시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: troubleshooting
  source_authority: official
  placeholder: true
