- id: 7a6af82f-faa3-541b-845f-ed7cb0873e20
  title: '도담 건강보험: 필요 서류'
  body: '도담 건강보험의 보험금 청구를 위해 필요한 서류는 다음과 같습니다.


    - 공통 서류: 보험금 청구서, 신분증 사본, 수익자 명의의 통장 사본

    - 입원비 청구 시: 진단서(입원 기간 명시), 입퇴원 확인서

    - 수술비 청구 시: 수술 진단서 또는 수술 확인서(수술명 및 수술일자 명시)

    - 기타: 전문 심사역이 추가로 요청하는 의료 기록지 또는 진료비 세부 내역서


    제출하신 서류는 보상 심사역의 검토를 거쳐 지급 여부가 결정되며, 서류 접수 후 영업일 기준 정해진 기간 내에 지급됩니다.'
  domain: insurance
  product_category: dodam_health
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 8329b025-5101-52e9-a7c5-e7291efcfd1e
  title: '도담 건강보험: 다른 회사의 일반적인 상품과의 비교'
  body: '도담 건강보험은 시중의 일반적인 실손의료보험과 보장 방식에서 뚜렷한 차이가 있습니다.


    - 보장 방식: 일반적인 실손보험은 실제 지출한 의료비를 보장하지만, 도담 건강보험은 약정한 금액을 지급하는 ''정액 보장'' 방식입니다.

    - 보장 금액: 입원 시 실제 비용과 무관하게 입원일당 30,000원을, 수술 시 1,000,000원을 정해진 금액으로 지급합니다.

    - 특징: 실손보험은 중복 보장이 안 되지만, 도담 건강보험은 여러 개를 가입하여 보장 금액을 높일 수 있습니다.


    실제 치료비의 공제 후 보장을 원하신다면 실손보험이 유리하며, 치료비 외의 간병비나 생활비 등 정해진 목돈의 지원이 필요하신 분께는 도담 건강보험이
    더 적합한 선택입니다.'
  domain: insurance
  product_category: dodam_health
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 94006e68-19c5-5461-b060-7df2f676c817
  title: '도담 건강보험: 위험 안내'
  body: '본 상품에 가입하시기 전, 다음의 위험 및 법적 고지 사항을 충분히 숙지하시기 바랍니다.


    첫째, ''계약 전 알릴 의무'' 위반 시의 위험입니다. 가입 당시 과거 병력 등 중요 사항을 사실과 다르게 알리거나 누락한 경우, 보험업법
    및 약관에 따라 계약이 해지될 수 있으며 보험금 지급이 제한될 수 있습니다. 이는 고객님의 권익 보호를 위한 필수 절차이므로 정확한 정보 제공을
    부탁드립니다.


    둘째, 세액공제 혜택 안내입니다. 근로소득자이신 경우, 본 상품과 같은 보장성 보험료에 대해 연 100만원 한도로 12%의 세액공제를 받으실
    수 있습니다. 단, 개별적인 세무 상담은 제공하지 않으므로 상세 내용은 세무 전문가와 상의하십시오.


    셋째, 예금자 보호 제도입니다. 도담생명은 금융위원회와 금융감독원의 감독을 받으며, 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금과
    사고보험금 등을 합해 1억원까지 보호합니다.


    넷째, 청약철회 권리입니다. 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회하고 납입하신 보험료를 돌려받으실
    수 있습니다. 단, 진단계약 등 일부 계약은 철회가 제한될 수 있습니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
  domain: insurance
  product_category: dodam_health
