  institution_id: dodam_life
- id: 37a05300-11c3-5d32-800c-a84b1492f134
  title: '도담 연금보험: 보험차익 비과세 월 납입 한도 안내'
  body: '질문: 도담 연금보험의 보험차익 비과세 혜택을 받기 위한 월 납입 한도는 얼마입니까?


    답변: 도담 연금보험의 보험차익 비과세 월 납입 한도는 1,500,000원입니다. 이 금액 이하로 월 보험료를 납입하시면서, 5년 이상 균등하게
    납입하고 계약을 10년 이상 유지하셔야 비과세 혜택을 받으실 수 있습니다.


    더욱 자세한 조건은 ''도담 연금보험: 약관 변경 안내''에서 확인하실 수 있습니다.'
