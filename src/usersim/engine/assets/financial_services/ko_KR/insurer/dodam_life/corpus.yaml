  institution_id: dodam_life
- id: 4fab11bc-3730-5e68-aab2-1c8556dd7486
  title: '도담 연금보험: 한도·제한과 유의사항'
  body: '도담 연금보험의 효율적인 운용과 세제 혜택 적용을 위해 상담원은 다음의 한도와 제한 사항을 정확히 안내해야 합니다.


    1. 보험차익 비과세 요건

    본 상품은 일정 요건을 충족할 경우 보험차익에 대해 비과세 혜택을 제공합니다. 이를 위해 보험차익 비과세 월 납입 한도인 1,500,000원
    이하로 보험료를 납입해야 하며, 보험차익 비과세 최소 납입 기간(년)인 5년 이상을 균등하게 납입하고, 보험차익 비과세 최소 유지 기간(년)인
    10년 이상 계약을 유지해야 합니다.


    2. 연금 수령 제한

    연금 지급은 설정된 연금 개시 나이인 65세부터 시작됩니다. 가입 시 설정한 개시 나이 이전에는 연금 형태의 수령이 제한되며, 중도 해지 시에는
    해약환급금이 지급되나 비과세 요건 미충족 시 과세될 수 있음을 안내하십시오.


    3. 기타 유의사항

    보험료 납입 유예 등의 편의 서비스는 상품별 약관에 명시된 조건에 따라 제공됩니다. 모든 세제 혜택은 관련 법령 및 약관에 근거하며, 개별적인
    세무 조언은 제공하지 않습니다.'
