- id: 72228abb-124d-5a9f-a979-06400bebc61c
  title: '도담 암보험: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객 안내 시 활용하는 도담 암보험의 주요 제한 사항 및 유의사항 가이드입니다. 정확한 안내를 통해 고객의 권익을
    보호하십시오.


    1. 보장 제한 및 기간

    - 암 보장 면책기간: 보험 가입 후 90일 동안은 보장 대상에서 제외되는 면책기간이 적용됩니다. 이 기간 내 진단 시 보험금이 지급되지 않습니다.

    - 암 진단비 감액기간: 계약일부터 1년이 경과하기 전까지는 감액기간이 적용되어, 약정된 보험금의 50%만 지급됩니다.


    2. 주요 보장 금액

    - 일반암 진단비: 30,000,000원

    - 유사암 진단비: 6,000,000원


    3. 고객 유의사항

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 약관에 따라 계약이 해지되거나
    보험금 지급이 제한될 수 있음을 명확히 안내하십시오.

    - 청약철회: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회할 수 있습니다.


    4. 법적 보호

    - 본 상품은 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: product_sheet
  source_authority: official
