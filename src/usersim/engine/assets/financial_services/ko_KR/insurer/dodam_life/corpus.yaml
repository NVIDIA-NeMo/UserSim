- id: 31324e75-f30e-5c6c-b50e-ba1c41e5a4bb
  title: '도담 건강보험: 등록 정보 변경'
  body: '고객님의 연락처, 주소 등 등록된 정보를 변경하는 절차를 안내해 드립니다.


    [준비 사항]

    - 변경하고자 하는 최신 정보 (새 주소, 전화번호 등)


    [변경 단계]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 정보 변경이 가능합니다.

    2. 변경 사항 요청: 변경을 원하시는 정보(예: "전화번호를 010-XXXX-XXXX로 변경해 주세요")를 정확히 말씀해 주십시오.

    3. 정보 확인 및 수정: 상담원이 요청하신 내용을 확인하고 시스템에 반영합니다.

    4. 변경 완료 확인: 상담원이 정보 변경이 완료되었음을 안내하며, 필요 시 등록된 연락처로 변경 완료 안내 메시지가 발송됩니다.


    본 절차를 통해 변경된 정보는 향후 보험금 청구 안내 및 약관 변경 고지 시 사용되므로, 항상 최신 상태를 유지하시기 바랍니다.'
  domain: insurance
  product_category: dodam_health
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f18e2d71-85e7-507d-a86c-13e9c7d72a70
  title: '도담 건강보험: 로그인하거나 접속할 수 없을 때'
  body: '공식 디지털 채널을 통해 도담 건강보험 서비스에 접속하시려 할 때 문제가 발생하는 경우, 다음의 순서로 확인하시기 바랍니다.


    [증상: 로그인 실패 또는 페이지 접속 불가]


    1. 계정 정보 확인

    - 입력하신 아이디와 비밀번호가 정확한지 다시 한번 확인하십시오. 대소문자 구분 및 오타 여부를 확인하시기 바랍니다.


    2. 시스템 점검 여부 확인

    - 도담생명 공식 채널의 공지사항을 통해 정기 점검 시간인지 확인하십시오. 점검 시간에는 서비스 이용이 제한될 수 있습니다.


    3. 네트워크 상태 점검

    - 인터넷 연결 상태를 확인하시고, 브라우저의 캐시를 삭제한 후 다시 시도해 보십시오.


    [해결이 되지 않는 경우]

    위 단계로도 해결되지 않는다면, 상담원에게 접속 불가 증상을 말씀해 주십시오. 당사는 다음과 같이 처리합니다.

    - 기술 지원팀 에스컬레이션: 계정 잠김 상태나 시스템 오류 여부를 전문 기술팀에서 확인합니다.

    - 처리 결과 안내: 확인된 원인과 해결 방안을 고객님께 안내해 드립니다.


    디지털 채널 이용이 어려운 경우, 고객센터 전화 상담을 통해 동일한 업무를 처리하실 수 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: troubleshooting
  source_authority: official
  placeholder: true
