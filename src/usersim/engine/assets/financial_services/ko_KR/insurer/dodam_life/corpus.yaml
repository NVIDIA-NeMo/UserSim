- id: cc4890a6-603c-5522-b434-d06c9dd65332
  title: '도담 종신보험(저해지환급형): 수수료 안내'
  body: '도담 종신보험(저해지환급형)은 별도의 가입 수수료나 관리 수수료를 부과하지 않으며, 통계적 위험률과 연령에 기반하여 산정된 보험료
    체계를 준수합니다.


    - 월 보험료: 고객님의 연령, 성별, 건강 상태 및 가입 금액에 따라 합리적으로 산정됩니다. (예: 40세 여성, 20년 납입 시 186,000원)

    - 보험료 납입 유예: 상품별 약관에 명시된 조건 충족 시 납입 유예 등의 편의를 제공합니다.


    모든 보험료는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다.'
