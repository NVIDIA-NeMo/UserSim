  institution_id: dodam_life
- id: b7d170e7-428c-50db-bf47-2a3a673d595f
  title: '도담 종신보험(저해지환급형): 가입과 이용 시작'
  body: '도담 종신보험(저해지환급형) 가입을 위해 다음의 절차를 진행하십시오.


    1. 본인 인증: 상담원에게 성함과 생년월일을 말씀하여 본인 확인을 수행합니다.

    2. 보장 설계: 필요하신 보험가입금액(예: 100,000,000원)과 보험료 납입기간(예: 20년)을 결정합니다.

    3. 계약 전 알릴 의무 이행: 과거 병력 및 직업 등 중요 사항을 사실대로 말씀하십시오. 이를 위반할 경우 계약이 해지되거나 보험금 지급이
    제한될 수 있습니다.

    4. 청약 및 결제: 결정된 월 보험료(예: 186,000원)의 납입 방법(자동이체 등)을 설정하고 청약을 완료합니다.

    5. 보험증권 수령: 가입 완료 후 발송되는 보험증권을 확인하십시오. 증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약철회가
    가능합니다.


    가입이 완료되면 도담생명의 정직한 보장 체계를 통해 평생의 안심을 누리실 수 있습니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: how_to_guide
  source_authority: official
