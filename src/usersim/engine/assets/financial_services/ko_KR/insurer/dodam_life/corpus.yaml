- id: 0ddb6f04-2e2c-581d-b996-d6c57f88c602
  title: '도담 건강보험: 금리·요율이 정해지는 방식과 적용'
  body: '도담 건강보험의 보험료는 통계적 위험률과 고객님의 연령에 기반하여 합리적으로 산정됩니다. 이는 미래의 보험금 지급을 위한 준비금을
    적립하고 제도를 효율적으로 운영하기 위함입니다.


    보험료 산정의 기준은 표준 요율표를 따르며, 가입 당시의 연령과 성별, 건강 상태에 따라 개별적으로 적용됩니다. 예를 들어, 35세 여성 고객님이
    20년 납입 조건으로 가입하실 경우의 월 보험료 예시는 38,000원입니다.


    정해진 보험료 체계는 엄격히 준수되며, 납입 기간 중 상품별 약관에 명시된 조건에 따라 납입 유예 등의 편의를 제공할 수 있습니다. 모든 요율
    적용은 금융감독원의 가이드라인 및 보험업법을 준수하여 투명하게 관리됩니다.'
  domain: insurance
