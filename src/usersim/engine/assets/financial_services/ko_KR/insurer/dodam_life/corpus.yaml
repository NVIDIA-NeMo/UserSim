- id: 782e78cd-f104-5385-b126-a02ce79c6979
  title: '도담 건강보험: 추천·장기 이용 혜택'
  body: '도담생명과 함께 건강한 미래를 설계하시는 고객님을 위해 추천 및 장기 유지 혜택을 제공합니다.


    [추천인 혜택 안내]

    - 대상: 도담 건강보험 신규 가입 고객을 추천한 기존 계약자

    - 혜택 내용: 추천 대상자가 가입 완료 시 추천인에게 모바일 상품권 10,000원 증정

    - 기간: 2025년 1월 1일부터 2025년 12월 31일까지


    [장기 유지 혜택 안내]

    - 대상: 도담 건강보험을 5년 이상 유지하신 고객

    - 혜택 내용: 건강관리 서비스 이용권 및 보험료 할인 혜택 제공 (상세 조건 약관 참조)


    본 혜택은 한정된 예산으로 운영되며, 조기 종료될 수 있습니다. 자세한 사항은 상담원에게 문의하십시오.'
