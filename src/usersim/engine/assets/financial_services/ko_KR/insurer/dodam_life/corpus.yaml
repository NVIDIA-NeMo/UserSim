- id: 2f297333-75e4-59d6-9b24-f666138c0fde
  title: '도담 암보험: 추천·장기 이용 혜택'
  body: '도담생명이 고객님의 건강한 미래를 응원하며 특별한 가입 혜택을 제공합니다.


    [추천 및 신규 가입 이벤트]

    - 기간: 2025년 1월 1일부터 2025년 3월 31일까지

    - 대상: 기간 내 ''도담 암보험''에 신규 가입하시거나 기존 고객의 추천으로 가입하신 고객님

    - 혜택: 가입 첫 달 보험료의 5,000원 할인 혜택을 제공합니다.


    ''도담 암보험''은 일반암 진단비 30,000,000원과 유사암 진단비 6,000,000원을 통해 암 진단 시 경제적 부담을 덜어드리는 실속형
    상품입니다. 합리적인 비용으로 평생의 건강 자산을 마련하십시오.'
  domain: insurance
  product_category: dodam_cancer
