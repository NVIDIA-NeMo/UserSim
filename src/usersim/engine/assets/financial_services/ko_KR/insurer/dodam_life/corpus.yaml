- id: 5edea8ba-92d9-531a-98d3-68263a45c451
  title: '도담 건강보험: 진행 상황과 내역 확인'
  body: '도담 건강보험의 청구 진행 상황이나 과거 지급 내역을 확인하는 절차를 안내해 드립니다.


    1. 본인 인증 단계

    상담원에게 성함과 생년월일을 말씀해 주십시오. 상담원은 이 정보를 통해 고객님의 본인 여부를 확인합니다.


    2. 진행 상황 문의

    현재 접수된 보험금 청구 건의 처리 상태를 확인 요청하십시오. 상담원은 해당 건이 ''심사 중''인지, 혹은 ''지급 완료'' 단계인지 안내해
    드립니다.


    3. 세부 내역 확인

    지급된 보험금의 구체적인 산출 근거를 요청하십시오. 예를 들어, 입원일당 30,000원이 며칠분 적용되었는지, 수술비 1,000,000원이
    정상 지급되었는지 확인하실 수 있습니다.


    4. 내역서 수령

    전체적인 지급 내역이 포함된 명세서를 요청하십시오. 당사는 요청하신 내역을 공식 채널을 통해 제공하며, 이를 통해 기간별 지급 합계액과 보장
    항목별 상세 금액을 확인하실 수 있습니다.


    이 과정을 통해 고객님께서는 자신의 보장 혜택이 약관에 따라 정확히 적용되었는지 투명하게 확인하실 수 있습니다.'
