- id: 26c2b8f3-3731-5837-87e7-80af81887de3
  title: '도담 정기보험: 거래가 거절되거나 제한되었을 때'
  body: '상품 가입 신청이나 계약 변경 요청이 거절되었거나 제한된 경우, 다음의 원인을 확인하시기 바랍니다.


    1. 예상되는 원인

    - 가입 제한 연령 초과: 가입 가능한 최고 나이인 60세를 초과한 경우 가입이 제한됩니다.

    - 계약 전 알릴 의무 위반: 가입 시 고지하신 건강 상태나 과거 병력이 보험사의 인수 기준을 벗어난 경우 승인이 거절될 수 있습니다.

    - 서류 미비: 청약 시 필요한 필수 서류가 누락되었거나 기재 사항이 불분명할 때 처리가 보류됩니다.


    2. 해결 방법

    - 정보 재확인: 고지하신 내용 중 오기입된 부분이 없는지 다시 확인하시고, 수정이 필요한 경우 상담원에게 요청하십시오.

    - 추가 서류 제출: 심사역이 요청한 추가 진단서나 소견서를 제출하여 재심사를 요청하십시오.


    3. 에스컬레이션

    - 상담원 선에서 해결이 어려운 전문적인 심사 건은 당사의 전문 언더라이터(보험 인수 심사역)에게 에스컬레이션하여 최종 결정됩니다. 심사 결과는
    영업일 기준 수일 내에 안내해 드립니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
