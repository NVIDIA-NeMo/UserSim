- id: ed209e37-e7e8-52db-a4f4-af1e7ea22f64
  title: '도담 연금보험: 등록 정보 변경'
  body: '도담 연금보험 계약자의 연락처, 주소 등 등록 정보를 변경하는 절차입니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 변경 사항 요청: 상담원에게 변경하고자 하는 정보(예: 전화번호, 주소, 이메일 등)를 말씀해 주십시오.

    2. 본인 인증 수행: 상담원이 본인 확인을 위해 성함과 생년월일을 요청합니다. 해당 정보를 정확히 제공하십시오. (주의: 비밀번호나 주민등록번호
    전체는 요구하지 않습니다.)

    3. 정보 수정 및 확인: 상담원이 요청하신 내용을 시스템에 반영합니다. 변경된 내용이 맞는지 상담원을 통해 다시 한번 확인하십시오.

    4. 처리 완료 통보: 정보 변경이 완료되면 상담원이 최종 처리 결과를 안내해 드립니다.


    이 과정을 통해 변경된 정보는 향후 보험금 지급 안내 및 중요 약관 변경 통지 시 활용됩니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: how_to_guide
  source_authority: official
