  institution_id: dodam_life
- id: 7905f564-0177-5111-8485-6b4593191e9b
  title: '도담 건강보험: 자주 하는 업무의 처리 절차'
  body: '도담 건강보험 이용 고객님께서 자주 요청하시는 보험 수익자 변경 절차를 안내해 드립니다.


    1. 본인 확인 및 요청

    상담원에게 성함과 생년월일을 말씀하시어 본인 인증을 완료하신 후, 보험금 수익자 변경을 요청하십시오.


    2. 현재 수익자 확인

    상담원은 현재 등록되어 있는 수익자가 누구인지 확인해 드립니다. 변경 대상과 범위를 명확히 설정하십시오.


    3. 신규 수익자 정보 제공

    변경하고자 하는 새로운 수익자의 성함과 관계 등 필요한 인적 사항을 상담원에게 제공하십시오.


    4. 변경 내용 확인 및 확정

    상담원이 변경된 수익자 정보를 다시 한번 읽어드리면, 내용이 정확한지 확인하십시오. 확인이 완료되면 변경 처리가 즉시 반영됩니다.


    5. 처리 완료 통보

    수익자 변경이 완료되었다는 안내를 받으시면 모든 절차가 끝납니다. 변경된 내용은 추후 발행되는 보험증권이나 계약 확인서를 통해 다시 확인하실
    수 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a289938e-baca-54d5-b134-4ec4df43deb9
  title: '도담 건강보험: 명세서나 내역과 맞지 않을 때'
  body: '고객님께서 수령하신 보험금 명세서의 금액이 예상과 다르다고 말씀하시는 경우, 상담원은 다음 순서에 따라 확인하십시오.


    1. 지급 항목 및 기준 확인

    - 입원일당 확인: 지급된 총액을 30,000원으로 나누어 실제 인정된 입원 일수가 고객의 주장과 일치하는지 확인하십시오.

    - 최대 일수 제한: 1회 입원 최대 지급 일수인 180일을 초과하여 청구되지 않았는지 확인하십시오.

    - 수술비 적용: 질병·상해 수술비 1,000,000원이 약관상 지급 대상 수술에 해당하여 정확히 지급되었는지 확인하십시오.


    2. 감액 및 면책 사항 검토

    - 상품 약관에 따라 가입 후 일정 기간 내에 발생한 사고에 대해 보험금의 일부(예: 50%)만 지급하는 ''감액기간''이 적용되었는지 확인하십시오.


    3. 해결 및 에스컬레이션

    - 단순 안내 부족인 경우: 정액 보장 방식과 한도(180일 등)를 다시 상세히 설명하여 고객의 이해를 돕습니다.

    - 계산 오류 의심 시: 고객의 주장이 타당하고 내부 계산에 오류가 발견된 경우, 즉시 보상 심사역에게 해당 건을 에스컬레이션하여 재심사를
    요청하고 과소 지급된 금액을 추가 지급 처리합니다.


    상담원은 절대 임의로 보험금 지급을 약속하지 마십시오. 모든 수정 지급은 보상 심사역의 승인 후 진행됩니다.'
  domain: insurance
  product_category: dodam_health
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: e31cfe7f-3bbb-582f-b443-1a4a35827796
  title: '도담 암보험: 상품 개요'
  body: '도담 암보험은 암 진단 시 고액의 보장금을 지급하며, 면책 및 감액 기간이 적용되는 암 특화 보장 상품입니다. 암이라는 중대 질병으로
    인한 경제적 타격을 최소화하고, 안정적인 치료 환경을 조성하는 데 집중합니다.


    [주요 보장 내용]

    - 일반암 진단비: 30,000,000원

    - 유사암 진단비: 6,000,000원


    [보험료 및 가입 예시]

    - 월 보험료 예시: 29,000원 (40세 남성, 20년 납입 기준)


    [보장 적용 조건]

    - 암 보장 면책기간: 가입 후 90일 동안은 보장 대상에서 제외됩니다.

    - 암 진단비 감액기간: 계약일부터 1년 이내에 암 진단 시, 감액기간 중 지급 비율인 50%만 지급합니다.


    본 상품은 통계적 위험률과 연령에 기반하여 합리적으로 보험료를 산정하며, 고객님의 생애 주기에 맞춘 든든한 보장을 제공합니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금 등을 합해
    1억원까지 보호합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6f19a848-35a2-5c34-9f74-6f1504a4bf2b
  title: '도담 암보험: 일반암 진단비 안내'
  body: '질문: 도담 암보험의 일반암 진단비는 얼마이며, 유사암의 경우는 어떻게 되나요?


    답변: 도담 암보험 가입 고객님께는 일반암 진단 시 30,000,000원을 지급해 드립니다. 또한, 유사암으로 진단받으신 경우에는 6,000,000원의
    진단비를 지급합니다. 구체적인 지급 조건과 대상 암 종류는 가입하신 상품의 약관을 확인하시거나 상담원에게 문의하시기 바랍니다.


    상세한 상품 내용은 ''도담 암보험: 상품 개요''에서 확인하실 수 있습니다.'
  domain: insurance
