- id: f23730e5-a9b7-5cee-8a78-a1c75babf399
  title: '도담 종신보험(저해지환급형): 수수료와 비용'
  body: '질문: 도담 종신보험(저해지환급형)의 보험료는 어떻게 산정되며 어디에 사용됩니까?


    답변: 보험료는 고객님의 연령과 통계적 위험률에 기반하여 합리적으로 산정됩니다. 예를 들어, 40세 여성 고객님이 20년 납입 조건으로 가입하실
    경우 월 보험료 예시(40세 여성, 20년 납입)는 186,000원입니다.


    납입하신 보험료는 미래에 발생할 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영 비용으로 사용됩니다. 정해진 보험료 체계를 준수하며,
    상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하고 있습니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 2f6c9db8-5960-5e2c-b2ca-421e5e10ff0b
  title: '도담 종신보험(저해지환급형): 자주 하는 업무의 처리 절차'
  body: '도담 종신보험(저해지환급형) 계약 유지 중 자주 요청하시는 보험수익자 변경 절차를 안내합니다.


    1. 본인 인증

    상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.


    2. 변경 요청 및 대상 지정

    보험금 지급 대상자를 변경하고자 하는 취지와 함께, 새롭게 지정하실 수익자의 관계와 인적 사항을 말씀해 주십시오.


    3. 필요 서류 제출

    수익자 변경은 법적 효력이 발생하는 중요한 업무이므로, 본인 확인을 위한 신분증 사본 및 수익자 지정 서류 등의 물리적 서류 제출이 필요합니다.
    상담원이 안내해 드리는 제출 방법을 통해 서류를 접수하십시오.


    4. 심사 및 확정

    제출된 서류의 적정성을 심사한 후 변경 처리가 완료됩니다. 처리가 완료되면 등록된 연락처로 안내 메시지를 발송해 드립니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6214a560-1996-50ad-8d35-577dfe9a2683
  title: '도담 종신보험(저해지환급형): 명세서나 내역과 맞지 않을 때'
  body: "고객님께서 확인하신 해약환급금이나 보험료 내역이 예상과 다르다고 말씀하시는 경우, 상담원은 다음 순서로 점검하십시오.\n\n- 증상:\
    \ 고객이 \"생각보다 환급금이 너무 적다\"거나 \"보험료가 예상과 다르다\"고 주장하는 경우\n\n- 점검 및 조치 순서:\n  1. 상품\
    \ 유형 확인: 해당 계약이 '저해지환급형'인지 확인하십시오. 저해지환급형은 납입기간 중 해약환급금 수준(표준형 대비)이 50%이므로, 표준형\
    \ 상품의 환급금과 비교하여 낮게 나타나는 것이 정상입니다.\n  2. 납입 기간 확인: 보험료 납입기간(년)인 20년이 경과했는지 확인하십시오.\
    \ 납입 기간 중인지 이후인지에 따라 환급률이 크게 달라집니다.\n  3. 특약 및 가산금 확인: 가입하신 보험가입금액 예시(100,000,000원)\
    \ 외에 추가된 특약이나 대출 원리금 차감 여부를 확인하십시오.\n\n- 해결 방법:\n  - 저해지환급형 구조 때문인 경우: 상품의 특성과\
    \ 낮은 보험료의 상관관계를 다시 정중히 설명하십시오.\n  - 계산 오류가 의심되는 경우: 고객의 요청 사항을 상세히 기록하여 보상 심사역에게\
    \ 에스컬레이션하십시오.\n\n심사역의 재검토 결과는 영업일 기준 5일 이내에 고객님께 안내됩니다."
  domain: insurance
  product_category: dodam_whole_life
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 19b6f70c-d455-56e0-9b8c-c481cd8c0491
  title: '도담 건강보험: 상품 개요'
  body: '도담 건강보험은 질병이나 상해로 인한 입원과 수술 시, 실제 발생한 치료비와 상관없이 약정된 금액을 지급하는 정액 보장형 건강보험
    상품입니다. 많은 고객께서 혼동하시는 실손의료보험이 실제 지출 비용을 보전하는 것과 달리, 본 상품은 진단과 치료 단계에서 정해진 보장금을
    지급하여 경제적 안정을 지원하는 데 집중합니다.


    본 상품의 핵심 보장 내용은 다음과 같습니다. 입원 시에는 입원일당으로 30,000원을 지급하며, 1회 입원 시 최대 지급 일수는 180일로
    제한됩니다. 또한 질병이나 상해로 인해 수술을 받으실 경우, 1회당 1,000,000원의 질병·상해 수술비를 지급하여 고액의 치료비 부담을
    덜어드립니다.


    보험료는 고객님의 연령과 통계적 위험률을 기반으로 합리적으로 산정됩니다. 예를 들어, 35세 여성 고객이 20년 납입 조건으로 가입하실 경우
    월 보험료 예시는 38,000원입니다. 도담생명은 투명한 보험료 체계를 통해 모든 세대의 고객님께 신뢰받는 보장을 제공하겠습니다.


    상세한 보장 범위와 조건은 상품 설명서를 통해 확인해 주시기 바랍니다.'
  domain: insurance
  product_category: dodam_health
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 6c59b9ef-6c48-5ce9-a512-d67551b7997c
  title: '도담 건강보험: 입원일당 안내'
  body: '**질문 1: 입원했을 때 매일 얼마의 보험금을 받을 수 있습니까?**

    답변: 도담 건강보험의 입원일당은 30,000원입니다. 실제 병원비와 관계없이 입원하신 일수에 따라 정해진 금액을 지급해 드립니다.


    **질문 2: 한 번 입원했을 때 최대 며칠까지 보장받을 수 있습니까?**

    답변: 1회 입원 최대 지급 일수는 180일입니다. 해당 기간을 초과하는 입원 일수에 대해서는 보험금이 지급되지 않으므로 유의하시기 바랍니다.


    더 자세한 내용은 ''도담 건강보험: 상품 개요''를 참고하십시오.'
  domain: insurance
  product_category: dodam_health
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 97681f9d-44c2-5473-9bc5-2996244cb485
  title: '도담 건강보험: 가입과 이용 시작'
  body: '도담 건강보험 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인 수행: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 가입 절차를 시작할 수 있습니다.

    2. 계약 전 알릴 의무 이행: 과거 병력, 현재 건강 상태, 직업 등 보험사가 요구하는 중요 사항을 사실대로 알려주십시오. 이 의무를 위반할
    경우 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.

    3. 보장 내용 및 보험료 확인: 입원일당 30,000원, 질병·상해 수술비(1회) 1,000,000원 등 약정된 보장 금액과 고객님의 연령
    및 납입 기간에 따른 최종 보험료를 확인하십시오.

    4. 청약서 작성 및 보험료 납입: 안내받으신 내용에 동의하신 후 청약 절차를 완료하고 첫 회 보험료를 납입하십시오.

    5. 보험증권 수령 및 확인: 가입 완료 후 발송되는 보험증권을 통해 보장 기간과 조건을 최종 확인하십시오.


    가입 후 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에는 청약철회가 가능하며, 이 경우 납입하신 보험료를 돌려받으실
    수 있습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 8faec545-8d22-5da3-8682-5f6d942caf02
  title: '도담 건강보험: 수수료 안내'
  body: '도담 건강보험은 별도의 가입 수수료나 유지 수수료를 부과하지 않으며, 오직 약관에 따라 산정된 보험료만을 납입합니다. 보험료는 통계적
    위험률과 연령에 기반하여 합리적으로 산정됩니다.


    - 월 보험료 예시(35세 여성, 20년 납입): 38,000원


    보험료는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다. 상품별 약관에 명시된 조건에 따라 보험료 납입 유예
    등의 편의를 제공하고 있으니, 관련 문의는 상담원에게 요청하시기 바랍니다.'
  domain: insurance
  product_category: dodam_health
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 3de26912-f910-5435-9d32-3aff19a0ad31
  title: '도담 건강보험: 처리가 끝나지 않거나 보류 중일 때'
  body: '**증상: 보험 가입 신청이나 보험금 청구 건이 ''심사 중'' 또는 ''보류'' 상태로 오래 지속됩니다.**


    **원인 및 확인 사항:**

    - 전문 심사 필요: 청구하신 건이 복잡한 보험금 지급 건이거나 전문적인 심사가 필요한 경우, 전문 언더라이터 및 보상 심사역으로 에스컬레이션되어
    처리 시간이 길어질 수 있습니다.

    - 증빙 서류 미비: 제출하신 서류가 누락되었거나 내용이 불분명하여 추가 확인이 필요한 경우입니다.

    - 계약 전 알릴 의무 확인: 가입 시 고지하신 내용과 실제 의료 기록 간의 차이가 발견되어 확인 절차가 진행 중일 수 있습니다.


    **해결 방법:**

    - 상담원에게 현재 처리 단계와 추가로 제출해야 할 서류가 있는지 확인하십시오.

    - 서류 보완 요청을 받으신 경우, 해당 서류를 신속히 제출하시면 심사가 재개됩니다.


    **에스컬레이션 안내:**

    자체적인 확인으로 해결이 어려운 경우, 담당 부서에서 정밀 조사를 수행하며 결과는 영업일 기준 안내된 기한 내에 개별 통보해 드립니다. 만약
    안내받으신 기한 내에 처리가 완료되지 않는다면 다시 한번 문의해 주십시오.'
  domain: insurance
  product_category: dodam_health
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: e23ec1aa-08b4-551e-942b-0e7ba29dc9d1
  title: '도담 건강보험: 가입 대상'
  body: '| 가입 조건 | 결과 | 비고 |

    | :--- | :--- | :--- |

    | 본인 인증 완료 (성함, 생년월일) | 가입 절차 진행 가능 | 필수 확인 사항 |

    | 계약 전 알릴 의무 준수 | 가입 승인 및 보장 가능 | 고지 의무 위반 시 계약 해지 가능 |

    | 보험료 납입 능력 보유 | 계약 유지 가능 | 정해진 보험료 체계 준수 |

    | 건강 상태 및 직업 위험도 적정 | 표준체 가입 가능 | 심사 결과에 따라 보험료 조정 가능 |'
  domain: insurance
  product_category: dodam_health
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 02dc8e7e-0e73-5fb5-b4de-c19e6678d482
  title: '도담 건강보험: 당사의 비슷한 상품과의 비교'
  body: '도담 건강보험과 도담 암보험의 차이점을 안내해 드립니다.


    - **도담 건강보험**: 일반적인 질병과 상해로 인한 입원(입원일당 30,000원) 및 수술(1회 1,000,000원)을 폭넓게 보장하는
    정액 보장형 상품입니다. 전반적인 건강 관리를 원하는 분께 적합합니다.

    - **도담 암보험**: 암 진단 시 고액의 보장금을 지급하는 암 특화 상품입니다. 면책 및 감액 기간이 적용되며, 암이라는 특정 질병에 대한
    집중 보장을 원하는 분께 적합합니다.


    두 상품 모두 실제 치료비와 상관없이 정해진 금액을 지급하는 정액 보장 방식입니다. 종합적인 입원 및 수술 보장을 원하신다면 도담 건강보험을,
    암으로 인한 경제적 위험을 집중적으로 대비하시려면 도담 암보험을 추천합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 7bfe3eb8-0adf-5b9b-8c3a-4da9269a3863
  title: '도담 건강보험: 상품설명서 주요 내용'
  body: '본 상품은 보험업법에 따라 금융위원회와 금융감독원의 감독을 받습니다.


    **예금자 보호 안내**

    예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다. 다만, 상품의 구조나 계약 내용에 따라 보호
    범위가 달라질 수 있습니다.


    **주요 보장 및 제한 사항**

    - 입원일당: 30,000원 (1회 입원 최대 180일 한도)

    - 질병·상해 수술비: 1회당 1,000,000원

    - 보험료 예시: 38,000원 (35세 여성, 20년 납입 기준)


    **소비자 권익 보호**

    - 청약철회: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 철회 가능합니다.

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하며, 이를 위반할 경우 계약 해지 및 보험금 지급 제한이 발생할
    수 있습니다.


    **주의 사항**

    상담원은 보험금 지급을 확정적으로 약속할 수 없으며, 모든 보장은 약관 및 상품 설명서의 표준 가이드라인에 따라 결정됩니다. 또한 개별적인
    세무나 의료 조언은 제공하지 않습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: disclosure
