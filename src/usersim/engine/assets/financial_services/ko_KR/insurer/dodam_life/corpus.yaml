- id: e25ce345-ceef-5692-afd5-3b6cd3a209f4
  title: '도담 종신보험(저해지환급형): 당사의 비슷한 상품과의 비교'
  body: '도담 종신보험(저해지환급형)과 도담 정기보험의 차이점은 다음과 같습니다.


    - 보장 기간: 도담 종신보험(저해지환급형)은 평생 사망을 보장하나, 도담 정기보험은 정해진 기간 동안만 보장합니다.

    - 보험료 수준: 도담 정기보험은 보장 기간이 한정되어 있어 비용이 더욱 합리적이며, 도담 종신보험(저해지환급형)은 평생 보장을 위해 상대적으로
    보험료가 높습니다. 다만, 본 상품은 저해지환급형 구조를 통해 표준형 종신보험보다 보험료 부담을 낮췄습니다.

    - 환급금 특성: 도담 종신보험(저해지환급형)은 납입 기간 중 해약환급금이 적은 대신 보험료가 저렴합니다.


    가족을 위한 장기적이고 확실한 경제적 안전장치를 원하신다면 도담 종신보험(저해지환급형)을, 일정 기간 집중적인 실속형 보장을 원하신다면 도담
    정기보험을 추천합니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 1fe98116-bbe5-5364-aa31-aed5fb08488d
  title: '도담 종신보험(저해지환급형): 상품설명서 주요 내용'
  body: '본 상품의 주요 고지 사항 및 법적 안내입니다.


    - 저해지환급금 구조: 본 상품은 저해지환급형으로, 보험료 납입 기간(20년) 중 계약을 해지할 경우 해약환급금이 표준형 대비 50% 수준으로
    매우 적거나 없을 수 있습니다. 이 점을 충분히 인지하신 후 가입하시기 바랍니다.

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 보험업법 및 약관에 따라 계약이 해지되거나
    보험금 지급이 제한될 수 있습니다.

    - 청약철회: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회하고 납입 보험료를 돌려받으실 수 있습니다.

    - 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사가 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다.

    - 감독 기관: 도담생명은 금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: disclosure
  source_authority: official
