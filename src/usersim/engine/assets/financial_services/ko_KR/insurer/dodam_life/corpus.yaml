- id: 0e4cccf0-0405-57bd-8f61-2a6e406edd8e
  title: '도담 종신보험(저해지환급형): 금리·요율이 정해지는 방식과 적용'
  body: '도담 종신보험(저해지환급형)의 보험료 산정 방식과 적용 요율에 대해 안내해 드립니다.


    1. 보험료 산정 기준: 보험료는 통계적 위험률과 고객님의 가입 연령에 기반하여 합리적으로 산정됩니다. 이는 미래의 보험금 지급을 위한 준비금
    적립과 효율적인 제도 운영을 위해 사용됩니다.


    2. 보험료 납입기간: 본 상품의 표준 납입기간은 20년입니다.


    3. 해약환급금 적용 요율: 본 상품은 저해지환급형 구조를 적용합니다. 이에 따라 20년의 납입기간 중 해지 시 지급되는 해약환급금 수준은
    표준형 상품 대비 50%로 적용됩니다.


    4. 요율 변동: 정해진 보험료 체계를 준수하며, 상품별 약관에 명시된 조건에 따라 납입 유예 등의 편의를 제공할 수 있습니다. 구체적인 개별
    보험료는 고객님의 위험률 심사 결과에 따라 최종 결정됩니다.'
