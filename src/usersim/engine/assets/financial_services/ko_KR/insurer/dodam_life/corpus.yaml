- id: 6f80da5e-f3e8-59be-85f7-a2332932809f
  title: '도담 종신보험(저해지환급형): 위험 안내'
  body: '본 상품 가입 전, 아래의 위험 및 유의사항을 반드시 확인하시기 바랍니다.


    1. 해약환급금 손실 위험: 본 상품은 저해지환급형으로, 보험료 납입기간인 20년 이내에 계약을 해지할 경우 해약환급금 수준이 표준형 대비
    50%로 매우 낮습니다. 중도 해지 시 원금보다 훨씬 적은 금액을 돌려받게 되므로 신중하게 결정하십시오.


    2. 계약 전 알릴 의무 위반 위험: 가입 시 과거 병력 및 중요 사항을 사실과 다르게 알린 경우, 보험업법에 따라 계약이 해지될 수 있으며
    보험금 지급이 제한될 수 있습니다.


    3. 예금자 보호 제도: 예금보험공사가 예금자보호법에 따라 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다. 다만, 보호 한도를
    초과하는 금액은 보호되지 않습니다.


    4. 보험금 지급 확정 불가: 상담원은 상품의 특징과 제도에 대해 안내할 뿐, 개별 사례에 대한 보험금 지급을 확정적으로 약속하지 않습니다.
    모든 지급 여부는 약관 및 보상 심사역의 심사를 통해 결정됩니다.


    상세 내용은 ''도담 종신보험(저해지환급형): 약관''에서 확인하실 수 있습니다.'
