- id: 63a54e02-b679-52db-b2bd-d14a7bd9a723
  title: '도담 종신보험(저해지환급형): 약관 변경 안내'
  body: '도담 종신보험(저해지환급형)의 약관 변경 및 주요 운영 원칙에 대해 안내드립니다.


    본 상품은 보험료 납입 기간 중 해약환급금이 표준형 대비 50% 수준으로 낮게 책정되는 대신, 월 보험료를 합리적으로 낮춘 저해지환급형 구조를
    가지고 있습니다. 따라서 납입 기간 중 해지 시 환급금이 매우 적거나 없을 수 있다는 점을 반드시 유의하시기 바랍니다. 약관의 변경은 관련
    법규 및 금융감독원의 지침에 따라 이루어지며, 변경 사항이 발생할 경우 고객님께 사전 통지하거나 공식 채널을 통해 공지합니다.


    특히 계약 전 알릴 의무를 위반하여 사실과 다르게 고지한 경우, 보험업법에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있으므로 가입 시
    정확한 정보 제공이 중요합니다. 본 상품은 보장성 보험으로서의 본질에 집중하여 평생의 사망 보장을 제공하며, 이는 단순한 저축 수단이 아님을
    명시합니다. 상세한 약관 내용은 보험증권과 함께 제공된 상품 설명서를 통해 다시 한번 확인하시어 본인의 재무 상황에 적합한지 판단하시기 바랍니다.'
