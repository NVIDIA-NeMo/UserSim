- id: e75f8cce-f56a-5555-a8ab-cd78eb3a0b73
  title: update_beneficiary 사용 기준
  body: '사망보험금 수익자 또는 지정대리청구인을 변경하고자 하는 고객을 위해 다음 절차를 수행하십시오.


    1. **본인 인증 수행**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **계약 확인**: `get_accounts` 도구를 호출하여 변경 대상 계약의 `account_id`를 확인하십시오.

    3. **변경 정보 수집**: 새로 지정할 수익자 또는 지정대리청구인의 성함, 고객과의 관계, 생년월일 등 필요한 인적 사항을 정확히 수집하십시오.

    4. **수익자 변경 접수**: `update_beneficiary` 도구를 호출하여 변경 사항을 시스템에 반영하십시오.

    5. **완료 안내**: 수익자 변경 처리가 완료되었음을 알리고, 변경된 내용이 적용된 계약 상태를 안내하십시오.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
