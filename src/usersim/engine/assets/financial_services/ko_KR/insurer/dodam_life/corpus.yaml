- id: ecea33d3-483d-5fc3-aa1b-be71184c490c
  title: '도담 정기보험: 진행 상황과 내역 확인'
  body: '도담 정기보험의 계약 진행 상황이나 보험료 납입 내역을 확인하는 절차를 안내해 드립니다.


    1. 본인 인증 단계

    상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 당사는 이 정보만을 사용하여 본인 확인을 수행하며, 비밀번호나 주민등록번호 전체는 요구하지
    않습니다.


    2. 확인 사항 요청

    확인하시고자 하는 구체적인 내역(예: 현재 계약 상태, 최근 보험료 납입일, 다음 납입 예정일 등)을 말씀해 주십시오.


    3. 내역 확인 및 안내

    상담원이 시스템을 통해 보험기간 20년의 충족 여부 및 납입 현황을 확인하여 고객님께 실시간으로 안내해 드립니다.


    4. 결과 확인

    안내받으신 내역이 실제 납입하신 금액이나 기간과 일치하는지 확인하십시오. 추가적인 증빙 서류가 필요하신 경우, 증명서 발급을 요청하실 수 있습니다.


