- id: a12d62a4-7ab5-53c2-b5d5-6352c3e00724
  title: '도담 정기보험: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객의 도담 정기보험 가입 및 이용 과정을 안내하기 위한 표준 가이드입니다.


    1. 가입 대상 및 조건 확인

    - 가입 가능한 최고 나이는 60세까지입니다.

    - 보험기간은 20년으로 설정되어, 정해진 기간 동안 집중적인 경제적 사망 보장을 제공합니다.


    2. 보험료 및 보장 금액 산정

    - 보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정됩니다.

    - 예시: 30세 남성이 20년 만기로 가입 시, 월 보험료는 24,000원이며 보험가입금액 예시는 100,000,000원입니다.

    - 고객의 연령과 선택 조건에 따라 실제 보험료는 변동될 수 있습니다.


    3. 가입 절차

    - 상담원은 고객의 성함과 생년월일을 통해 본인 인증을 수행합니다.

    - ''계약 전 알릴 의무''에 따라 과거 병력 등 중요 사항을 정확히 확인합니다.

    - 상품 설명서에 기반하여 보장 내용과 면책 사항을 안내한 후 청약을 진행합니다.


    4. 사후 관리

    - 가입 후 보험증권 수령 시점부터 청약철회 가능 기간(15일 이내 또는 청약일로부터 30일 이내)을 안내합니다.

    - 보험료 납입 유예나 계약대출 등 운영 편의 기능을 안내하여 계약 유지를 지원합니다.


    상담원은 보험금 지급을 확정적으로 약속해서는 안 되며, 모든 안내는 객관적인 상품 설명서에 기반해야 합니다.'
  domain: insurance
  product_category: dodam_term
  document_type: product_sheet
  source_authority: official
