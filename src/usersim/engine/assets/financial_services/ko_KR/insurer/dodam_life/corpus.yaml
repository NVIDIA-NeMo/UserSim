- id: 734008af-5a97-5244-98b2-d6601f7f2f0f
  title: '도담 정기보험: 수수료와 비용'
  body: '질문: 도담 정기보험의 보험료는 어떻게 산정되며, 대략 어느 정도인가요?


    답변: 도담 정기보험의 보험료는 통계적 위험률과 고객님의 가입 연령에 기반하여 합리적으로 산정됩니다. 이는 미래의 보험금 지급을 위한 준비금
    적립과 효율적인 제도 운영을 위해 사용됩니다.


    예를 들어, 30세 남성이 20년 만기로 가입하실 경우 월 보험료 예시는 24,000원입니다. 다만, 개별 고객님의 건강 상태와 직업 등에
    따라 실제 산정되는 보험료는 달라질 수 있습니다.


    상세한 보험료 산정 방식은 ''도담 정기보험: 금리·요율이 정해지는 방식과 적용''에서 확인하실 수 있습니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
