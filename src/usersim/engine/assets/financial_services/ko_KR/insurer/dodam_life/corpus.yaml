- id: 2fbee5c0-a400-574d-b63d-9b4fc17e94ea
  title: '도담 정기보험: 자주 하는 업무의 처리 절차'
  body: '도담 정기보험에서 가장 빈번하게 요청하시는 ''보험금 청구'' 및 ''수익자 변경'' 처리 절차를 안내해 드립니다.


    [보험금 청구 절차]

    1. 본인 인증: 성함과 생년월일을 통해 본인 확인을 수행합니다.

    2. 사고 접수: 청구하시려는 사고 내용과 일시를 상담원에게 말씀해 주십시오.

    3. 서류 제출: 사망 진단서 등 약관에서 정한 필요 서류를 제출합니다.

    4. 심사 및 지급: 전문 보상 심사역이 서류를 검토한 후, 지급 결정이 내려지면 지정된 계좌로 보험금을 지급합니다. (상담원은 지급을 확정적으로
    약속하지 않습니다.)


    [수익자 변경 절차]

    1. 본인 인증: 계약자 본인의 성함과 생년월일을 확인합니다.

    2. 변경 요청: 변경하고자 하는 수익자의 관계와 인적 사항을 말씀해 주십시오.

    3. 서류 확인: 수익자 변경 동의서 등 필요한 증빙 서류를 제출합니다.

    4. 변경 완료: 심사 후 변경 내용이 반영되며, 변경된 내역을 안내해 드립니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
