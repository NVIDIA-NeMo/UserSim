- id: 8a242c02-3660-50e7-a994-d7f296f328ae
  title: '도담 종신보험(저해지환급형): 보험료 납입기간(년) 안내'
  body: 'Q: 도담 종신보험(저해지환급형)의 보험료는 얼마 동안 납입해야 하나요?


    A: 본 상품의 표준 보험료 납입기간(년)은 20년입니다. 고객님께서는 정해진 20년의 기간 동안 보험료를 납입하시게 되며, 납입이 완료된
    후에도 보장은 평생토록 유지됩니다. 다만, 가입 설계에 따라 납입 기간은 변동될 수 있으므로 정확한 내용은 가입 시 제공되는 보험증권을 확인하시기
    바랍니다. 더 자세한 내용은 ''도담 종신보험(저해지환급형): 가입부터 이용까지''에서 확인하실 수 있습니다.'
