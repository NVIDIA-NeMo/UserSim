- id: a7164143-6e1c-556d-94e1-63e1c30eb298
  title: '도담 종신보험(저해지환급형): 가입부터 이용까지'
  body: '도담 종신보험(저해지환급형)의 가입부터 이용까지의 프로세스를 안내합니다.


    상담원은 고객에게 본 상품이 평생 사망을 보장하며, 납입 기간 중 환급금을 낮춰 보험료 부담을 줄인 상품임을 명확히 설명해야 합니다. 가입
    예시로, 보험가입금액 예시 100,000,000원을 설정할 경우 40세 여성 고객이 20년 동안 납입할 때의 월 보험료 예시는 186,000원으로
    산정됩니다. 여기서 보험료 납입기간(년)은 20년이며, 이 기간 동안의 납입기간 중 해약환급금 수준(표준형 대비)은 50%로 낮게 설정되어
    있습니다.


    가입 절차는 고객의 본인 확인(성함, 생년월일) 후, 계약 전 알릴 의무 사항을 확인하고 청약을 진행합니다. 계약자는 보험증권을 받은 날부터
    15일 이내, 또는 청약한 날부터 30일 이내에 청약철회가 가능함을 안내하십시오. 이후 보험료 납입이 시작되며, 정해진 납입 기간이 종료되면
    보장은 평생 유지됩니다.


    전문적인 심사나 복잡한 보험금 지급 건은 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여 처리하며, 상담원은 보험금 지급을 확정적으로 약속해서는
    안 됩니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: product_sheet
  source_authority: official
