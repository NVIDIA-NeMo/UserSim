  institution_id: dodam_life
- id: 9cd2b1b5-9e2b-521c-a48b-eb2f88422efd
  title: '도담 건강보험: 이용 조건별 차이'
  body: '도담 건강보험의 가입 및 보장 조건에 따른 적용 사항입니다.


    | 조건 | 결과 및 적용 내용 |

    | :--- | :--- |

    | 35세 여성 (20년 납입) | 월 보험료 예시: 38,000원 |

    | 질병 또는 상해 수술 발생 (1회) | 수술비 1,000,000원 지급 |

    | 입원 발생 (1일당) | 입원일당 30,000원 지급 |

    | 입원 기간 (1회당) | 최대 180일까지 보장 |

    | 계약 전 알릴 의무 위반 | 계약 해지 또는 보험금 지급 제한 |

    | 보험증권 수령 후 15일 이내 | 청약철회 가능 (납입 보험료 환급) |


    ※ 모든 보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정됩니다.'
