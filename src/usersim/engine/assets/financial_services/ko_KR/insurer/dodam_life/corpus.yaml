    영구적인 보장을 원하시는 분께 적합합니다.


    전환 시에는 가입 당시의 연령과 현재의 건강 상태에 따라 보험료가 재산정될 수 있으며, 새로운 계약으로 진행될 경우 ''계약 전 알릴 의무''가
    다시 적용됨을 안내하시기 바랍니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
