- id: ca9ea068-39fc-58f3-8f1f-e6e4136d5db2
  title: '도담 암보험: 암 진단비 감액기간(계약일부터, 년) 안내'
  body: '질문: 도담 암보험에 가입한 후 바로 일반암 진단비 30,000,000원을 모두 받을 수 있습니까?


    답변: 아니오, 그렇지 않습니다. 도담 암보험에는 ''암 진단비 감액기간''이 설정되어 있습니다. 계약일부터 1년이 지나지 않은 시점에 암
    진단을 받으신 경우, 보장 금액의 50%인 15,000,000원만 지급됩니다. 가입 후 1년이 경과해야만 약정된 일반암 진단비 전액을 지급받으실
    수 있습니다.


    질문: 감액기간 전에도 보장이 전혀 안 되는 기간이 있습니까?


    답변: 네, 가입 후 90일 동안은 ''암 보장 면책기간''으로 설정되어 있어, 이 기간 내에 암 진단을 받으신 경우에는 보험금이 지급되지
    않습니다. 자세한 내용은 도담 암보험: 상품 개요를 참고하시기 바랍니다.'
  domain: insurance
  product_category: dodam_cancer
