- id: 6239a78e-7f12-5c30-a8c0-8ef95133234c
  title: '도담 종신보험(저해지환급형): 월 보험료 예시(40세 여성, 20년 납입) 안내'
  body: 'Q: 40세 여성이 20년 납입 조건으로 가입할 경우 월 보험료는 어느 정도인가요?


    A: 도담 종신보험(저해지환급형)의 월 보험료 예시는 186,000원입니다. 다만, 이는 이해를 돕기 위한 예시이며 고객님의 실제 건강 상태,
    직업, 정확한 연령 등 통계적 위험률에 따라 실제 산정되는 보험료는 달라질 수 있습니다.


    Q: 저해지환급형이라 보험료가 더 저렴한가요?


    A: 네, 맞습니다. 납입기간 중 해약환급금 수준을 표준형 대비 50%로 낮게 설계함으로써 월 보험료 부담을 낮춘 상품입니다. 자세한 내용은
    ''도담 종신보험(저해지환급형): 상품 개요''를 참조하십시오.'
  domain: insurance
