  institution_id: dodam_life
- id: 00791b0e-68d7-5ed9-829a-b7ab25132075
  title: '도담 정기보험: 필요 서류'
  body: '도담 정기보험 가입 및 주요 업무 처리를 위해 필요한 서류는 다음과 같습니다.


    | 구분 | 필요 서류 | 비고 |

    | :--- | :--- | :--- |

    | 신규 가입 | 신분증 사본, 청약서, 건강상태 고지서 | 계약 전 알릴 의무 준수 필수 |

    | 수익자 변경 | 신분증 사본, 수익자 변경 신청서, 가족관계증명서 | 변경 사유에 따라 추가 서류 요청 가능 |

    | 보험금 청구 | 보험금 청구서, 사망진단서(사망 시), 신분증 사본 | 사고 증빙 서류 포함 |

    | 계약 해지 | 신분증 사본, 해지 신청서 | 본인 명의 계좌 확인 |


    모든 서류는 최신 발행분이어야 하며, 누락된 서류가 있을 경우 심사가 지연될 수 있습니다.'
  domain: insurance
  product_category: dodam_term
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 462ea427-5f97-562f-bbc8-e783077dc35b
  title: '도담 정기보험: 다른 회사의 일반적인 상품과의 비교'
  body: '도담 정기보험은 타사의 일반적인 정기보험과 비교하여 ''비용 효율성''과 ''투명한 산정 체계''에 강점이 있습니다.


    1. 비용 효율성

    타사 상품이 다양한 특약을 통해 보험료가 상승하는 구조라면, 도담 정기보험은 사망 보장이라는 핵심 가치에 집중하여 보험료를 낮췄습니다. 예를
    들어, 30세 남성 20년 만기 기준 월 24,000원이라는 합리적인 비용으로 가족을 보호할 수 있습니다.


    2. 투명한 요율 적용

    복잡한 가산 금리나 불투명한 수수료 대신, 통계적 위험률과 연령에 기반한 정직한 보장 체계를 적용하여 고객님이 납입하시는 보험료의 근거를 명확히
    제시합니다.


    3. 선택 가이드

    - 고액의 사망 보장을 짧고 굵게 준비하여 보험료 부담을 최소화하고 싶으신 분 → 도담 정기보험이 유리합니다.

    - 평생 동안 사망 보장을 유지하며 나중에 환급금을 활용하고 싶으신 분 → 당사의 ''도담 종신보험(저해지환급형): 상품 개요''를 추천드립니다.'
  domain: insurance
  product_category: dodam_term
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 1c262d75-1257-54bc-aec1-bd4a45ecbe9d
  title: '도담 정기보험: 위험 안내'
  body: '본 상품 가입 전, 고객님께서 반드시 인지하셔야 할 위험 및 유의사항을 안내드립니다.


    1. 저축 기능의 부재

    도담 정기보험은 순수 보장성 상품입니다. 저축성 보험이나 연금 보험과 달리 만기 시 돌려받는 금액이 없거나 매우 적으며, 이는 저축 수단이
    아닌 사망 보장을 위한 상품임을 명시합니다.


    2. 해약환급금 위험

    보험 계약을 중도에 해지할 경우, 납입한 보험료보다 해약환급금이 적거나 전혀 없을 수 있습니다. 특히 초기 해지 시 환급금 수준이 매우 낮으므로
    주의하시기 바랍니다.


    3. 예금자 보호 한도

    도담생명은 예금보험공사를 통해 보호받습니다. 예금자보호법에 따라 1인당 해약환급금 등을 합해 최대 1억원까지 보호되며, 이를 초과하는 금액은
    보호되지 않습니다.


    4. 계약 유지의 중요성

    보험료를 일정 기간 미납하여 계약이 실효되면 보장 혜택을 받을 수 없습니다. 경제적 사정으로 납입이 어려우신 경우, 약관에 명시된 보험료 납입
    유예 제도를 활용하시기 바랍니다.'
  domain: insurance
  product_category: dodam_term
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d64924e3-ff6d-501c-8f15-dad100653758
  title: '도담 정기보험: 금리·요율이 정해지는 방식과 적용'
  body: '도담 정기보험의 보험료 요율은 다음과 같은 원칙에 따라 산정되며, 상담원은 이를 기반으로 고객님께 안내합니다.


    1. 산정 기반

    보험료는 통계적 위험률과 가입 연령에 기반하여 합리적으로 책정됩니다. 이는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해
    사용됩니다.


    2. 주요 적용 요인

    - 연령: 가입 시점의 연령이 낮을수록 보험료가 낮아지는 경향이 있습니다. (가입 가능 최고 나이: 60세)

    - 기간: 설정하신 보험기간(예: 20년)에 따라 위험 노출 기간이 달라지므로 요율이 차등 적용됩니다.

    - 건강 상태: ''계약 전 알릴 의무''를 통해 확인된 건강 상태에 따라 할증 또는 할인 요율이 적용될 수 있습니다.


    3. 요율의 고정성

    정해진 보험료 체계를 준수하며, 상품 약관에 명시된 조건 외에는 임의로 요율을 변경하지 않습니다. 모든 추천과 안내는 객관적인 상품 설명서의
    표준 가이드라인을 따릅니다.'
  domain: insurance
  product_category: dodam_term
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: b2f8552d-3871-57ae-98dd-4d8c1d9f658a
  title: '도담 정기보험: 추천·장기 이용 혜택'
  body: '도담생명이 고객님의 소중한 가족을 위한 경제적 안정을 지원합니다. 도담 정기보험은 정해진 20년의 기간 동안 집중적인 사망 보장을
    제공하여, 합리적인 비용으로 최대의 보호 효과를 누리실 수 있는 실속형 상품입니다.


    예를 들어, 30세 남성 고객님이 20년 만기로 가입하실 경우 월 24,000원의 보험료로 100,000,000원의 보험가입금액을 준비하실
    수 있습니다. 장기적인 관점에서 가족의 미래를 설계하십시오.'
  domain: insurance
