- id: 239dbfe6-cb3b-5fa7-838d-7bfa3c2e99ac
  title: update_beneficiary 도구 설명서
  body: "update_beneficiary 도구는 보험 계약의 사망보험금 수익자나 지정대리청구인을 변경할 때 사용합니다.\n\n- **호출\
    \ 시점**: `verify_identity`를 통해 본인 인증이 완료된 계약자가 수익자 변경을 요청하고, 새로운 수익자의 정보를 제공했을\
    \ 때 호출합니다.\n- **입력 인수**:\n    - `account_id`: 대상 보험 계약의 고유 식별자입니다. `get_accounts`\
    \ 도구를 통해 확인하십시오.\n    - `beneficiary_details`: 신규 수익자 또는 지정대리청구인의 성함, 관계, 생년월일\
    \ 등 상세 정보입니다.\n- **실행 결과**: 수익자 정보가 업데이트되며, 변경 완료 여부를 반환합니다."
