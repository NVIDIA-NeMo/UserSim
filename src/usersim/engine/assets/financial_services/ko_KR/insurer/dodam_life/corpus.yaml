  institution_id: dodam_life
- id: e54bd5ed-dc3f-5877-9cb6-0dacc2930b9d
  title: '도담 건강보험: 약관'
  body: '본 약관은 도담 건강보험의 계약 내용과 보장 범위, 그리고 계약자와 회사의 권리와 의무를 규정합니다. 본 상품은 정액 보장형 건강보험으로,
    약정한 사고나 질병 발생 시 실제 치료비와 관계없이 미리 정해진 금액을 지급합니다.


    주요 보장 내용은 다음과 같습니다. 입원 시 입원일당으로 30,000원을 지급하며, 1회 입원 시 최대 지급 일수는 180일로 제한됩니다.
    질병 또는 상해로 인한 수술 시 1회당 1,000,000원의 수술비를 지급합니다. 모든 보장은 약관에 명시된 지급 사유가 발생했을 때 이루어집니다.


    계약자는 ''계약 전 알릴 의무''를 준수해야 합니다. 가입 시 과거 병력 등 중요 사항을 사실대로 알리지 않은 경우, 보험업법 및 당사 약관에
    따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다. 또한, 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에는
    청약철회 권리를 행사하여 납입 보험료를 돌려받으실 수 있습니다.


    보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정되며, 정해진 체계를 준수합니다. 단, 상품별 약관 조건에 따라 보험료 납입 유예 등의
    편의를 제공할 수 있습니다. 본 계약은 금융감독원의 감독 하에 운영되며, 분쟁 발생 시 공정한 절차에 따라 처리됩니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 1773ee8a-08fd-592e-b6a7-8823b8c61469
  title: '도담 건강보험: 이런 분께 알맞습니다'
  body: '도담 건강보험은 갑작스러운 질병이나 상해로 인한 입원 및 수술 시, 경제적 부담을 덜고 치료에 전념하고 싶으신 고객님께 최적화된 상품입니다.
    특히 실제 발생한 치료비만 보장하는 실손보험의 한계를 보완하여, 약정된 금액을 정액으로 지급받고자 하시는 분들께 추천드립니다.


    본 상품의 핵심 혜택은 다음과 같습니다.

    - 입원 시 든든한 지원: 입원일당 30,000원을 지급하여 간병비나 생활비 부담을 줄여드립니다.

    - 수술 시 집중 보장: 질병 또는 상해 수술 시 1회당 1,000,000원을 지급하여 고액의 수술비 부담을 덜어드립니다.

    - 합리적인 비용: 35세 여성, 20년 납입 기준 월 보험료 예시는 38,000원으로, 부담 없는 금액으로 건강을 대비하실 수 있습니다.


    실손보험과 달리 정해진 금액을 지급하는 정액 보장 방식이므로, 다른 보험과 중복 가입하여 보장 금액을 높이시는 것도 가능합니다. 노후 준비와
    건강 관리를 동시에 고려하시는 모든 세대의 고객님께 도담 건강보험이 경제적 안정을 약속드립니다.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 엄격히 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지
    보호합니다.'
  domain: insurance
  product_category: dodam_health
  document_type: product_sheet
  source_authority: official
  placeholder: true
