- id: 56f21085-f0a8-5605-b7ed-5d5ffd3fdfca
  title: '도담 건강보험: 안전한 이용을 위한 수칙'
  body: '도담생명은 고객님의 소중한 자산과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 최근 보험사를 사칭한 금융 사기가 빈번하므로 다음의
    안전 수칙을 반드시 확인하시기 바랍니다.


    1. 본인 인증 절차 준수

    도담생명의 상담원은 상태 변경 및 정보 확인을 위해 고객님의 ''성함''과 ''생년월일''만을 확인합니다. 이 외의 추가 인증은 절대 요구하지
    않습니다.


    2. 요구하지 않는 정보

    상담원을 포함한 당사 임직원은 다음과 같은 민감 정보를 절대로 요구하지 않습니다.

    - 일회성 인증 코드(OTP) 및 MFA 코드

    - 계정 비밀번호

    - 신용카드 번호 및 CVC 번호

    - 주민등록번호 전체


    3. 의심 사례 대응

    전화나 메시지를 통해 위와 같은 정보를 요구받으셨다면 즉시 통화를 종료하십시오. 도담생명을 사칭한 의심 사례를 발견하신 경우, 즉시 당사 고객센터나
    수사 기관에 신고하시기 바랍니다.


    금융감독원의 지침에 따라 고객님의 정보를 철저히 관리하고 있으며, 비정상적인 접근 시도가 감지될 경우 즉시 안내해 드리겠습니다.'
  domain: insurance
  product_category: dodam_health
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 920809c8-4d59-58da-9e62-3fea91af53af
  title: '도담 건강보험: 약관 변경 안내'
  body: '도담 건강보험의 약관은 보험업법 및 금융감독원의 감독하에 운영되며, 효율적인 제도 운영과 보장 체계의 투명성을 위해 변경될 수 있습니다.


    [주요 보장 원칙]

    본 상품은 실제 발생한 치료비와 상관없이, 약정한 사고나 질병 발생 시 미리 정해진 금액을 지급하는 ''정액 보장'' 방식을 따릅니다. 이는
    실제 치료비를 보장하는 실손보험과 차별화되는 특징입니다.

    - 입원일당: 약정된 30,000원을 지급합니다.

    - 수술비: 질병 또는 상해 수술 1회당 1,000,000원을 지급합니다.


    [계약자의 의무 및 권리]

    - 계약 전 알릴 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 합니다. 이를 위반할 경우 계약이 해지되거나 보험금 지급이 제한될
    수 있습니다.

    - 청약철회 권리: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입 보험료를 돌려받으실 수
    있습니다.


    [약관 변경 절차]

    약관 변경 시 도담생명은 서면, 전자우편 또는 공식 디지털 채널을 통해 고객님께 사전에 고지합니다. 변경 사항에 동의하지 않으시는 경우 계약
    해지를 요청하실 수 있습니다.


    하단 고지: 본 상품은 예금보험공사를 통해 예금자보호법에 따라 1인당 해약환급금 등을 합해 1억원까지 보호됩니다.'
  domain: insurance
  product_category: dodam_health
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 26ce3496-3611-5971-918c-326b26af2834
  title: '도담 건강보험: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객의 도담 건강보험 가입 및 이용 과정을 지원하기 위한 가이드라인입니다.


    [1. 고객 본인 확인]

    모든 업무 처리 전, 고객의 성함과 생년월일을 확인하여 본인 인증을 수행하십시오. 그 외의 비밀번호나 주민등록번호 전체를 요구해서는 안 됩니다.


    [2. 상품 특징 설명]

    도담 건강보험은 입원 및 수술 시 약정된 금액을 지급하는 ''정액 보장형'' 상품임을 명확히 안내하십시오. 실손보험과 달리 실제 비용과 무관하게
    정해진 금액이 지급됩니다.


    [3. 핵심 보장 내용]

    - 입원일당: 30,000원

    - 1회 입원 최대 지급 일수: 180일

    - 질병·상해 수술비(1회): 1,000,000원


    [4. 보험료 예시]

    보험료는 통계적 위험률과 연령에 기반하여 산정됩니다.

    - 예시: 35세 여성, 20년 납입 시 월 보험료 38,000원


    [5. 프로세스 안내]

    - 청약: 계약 전 알릴 의무를 충실히 이행하도록 안내하고 청약을 진행합니다.

    - 청약철회: 증권 수령 후 15일 또는 청약 후 30일 이내 가능함을 고지합니다.

    - 심사 에스컬레이션: 복잡한 보험금 지급 건이나 전문 심사가 필요한 경우, 전문 언더라이터 및 보상 심사역에게 처리 요청을 하십시오.


    주의: 상담원은 보험금 지급을 확정적으로 약속해서는 안 되며, 객관적인 상품 설명서에 기반하여 안내하십시오.'
  domain: insurance
  product_category: dodam_health
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d3828fb4-8bec-5c3b-8d2b-a7f3c90603a4
  title: '도담 건강보험: 질병·상해 수술비(1회) 안내'
  body: '도담 건강보험의 수술비 보장에 대해 자주 묻는 질문입니다.


    문: 질병이나 상해로 수술을 받았을 때 얼마를 받을 수 있습니까?

    답: 도담 건강보험은 정액 보장형 상품으로, 질병 또는 상해 수술 1회당 1,000,000원을 지급합니다.


    문: 실제 수술비가 1,000,000원보다 적게 나왔는데도 전액 지급됩니까?

    답: 네, 그렇습니다. 본 상품은 실제 치료비와 상관없이 약정한 금액을 지급하는 정액 보장 방식이므로, 수술 1회당 1,000,000원이 지급됩니다.


    문: 실손보험과 어떻게 다른가요?

    답: 실손보험은 실제 지불한 비용의 일부를 보상하지만, 도담 건강보험은 사고나 질병 발생 시 미리 약속된 금액을 지급하여 경제적 안정을 지원합니다.


    더 자세한 내용은 ''도담 건강보험: 상품 개요''를 참조하십시오.'
