- id: d0f5e8ca-805c-53df-9615-659596686b2a
  title: send_deduction_certificate 사용 기준
  body: '연말정산을 위해 보장성 보험료 세액공제 증빙이 필요한 고객님께 납입증명서를 발급하는 절차입니다.


    1. 고객님의 성함과 생년월일을 확인하여 verify_identity 도구로 본인 인증을 수행하십시오.

    2. get_accounts 도구를 사용하여 증명서 발급 대상이 되는 account_id를 확인하십시오.

    3. 증명서를 수령하실 이메일 주소나 팩스 번호 등 수신 방법을 확인하십시오.

    4. send_deduction_certificate 도구를 호출하여 납입증명서를 발송하십시오.


    상담원은 근로소득자의 경우 보장성 보험료에 대해 연 100만원 한도로 12%의 세액공제가 가능하다는 일반적인 정보를 함께 안내하실 수 있습니다.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
