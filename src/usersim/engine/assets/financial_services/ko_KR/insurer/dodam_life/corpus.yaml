- id: 00f2e8fc-e056-514b-9ca2-a5be6ada4d11
  title: '도담 정기보험: 상품 개요'
  body: "도담 정기보험은 정해진 기간 동안 경제적 사망 보장에 집중하여 합리적인 비용으로 가족을 보호하는 실속형 상품입니다. 고객님께서 설정하신\
    \ 보험기간 동안 예상치 못한 사고나 사망 시 약정된 보험금을 지급함으로써 남겨진 가족의 경제적 안정을 지원합니다.\n\n본 상품의 주요 특징은\
    \ 다음과 같습니다. 보험기간은 20년이며, 가입 가능한 최고 나이는 60세입니다. \n\n이해를 돕기 위한 예시는 다음과 같습니다. 보험가입금액을\
    \ 100,000,000원으로 설정할 경우, 30세 남성이 20년 만기로 가입 시 월 보험료 예시는 24,000원입니다. \n\n도담 정기보험은\
    \ 순수하게 보장에 집중한 상품으로, 종신보험과 달리 정해진 기간이 종료되면 보장이 종료됩니다. 상세한 보장 범위와 조건은 상품 설명서를 통해\
    \ 확인하시기 바랍니다."
  domain: insurance
  product_category: dodam_term
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4bad7ecb-1b45-5c58-9cf4-75b729e51442
  title: '도담 정기보험: 보험가입금액 예시 안내'
  body: '질문: 도담 정기보험의 보험가입금액은 어느 정도로 설정하는 것이 일반적인가요?

    답변: 고객님의 경제 상황과 가족 구성원에 따라 다르나, 예시로 100,000,000원을 설정하여 보장받으실 수 있습니다. 보험가입금액은 사망
    시 지급되는 기본 보장 금액을 의미합니다.


    질문: 보험가입금액에 따라 보험료가 어떻게 달라지나요?

    답변: 보험가입금액이 높을수록 보장 자산이 커지므로 월 납입 보험료도 함께 상승합니다. 가입 시 고객님의 연령과 건강 상태 등을 고려하여 최적의
    가입금액을 설계해 드립니다.'
  domain: insurance
  product_category: dodam_term
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: bc9a5ab9-46d8-55ca-9ee9-e91e2855794e
  title: '도담 정기보험: 가입과 이용 시작'
  body: '도담 정기보험 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되면 가입 상담이 시작됩니다.

    2. 계약 전 알릴 의무 이행: 과거 병력이나 현재의 건강 상태 등 보험사에서 요구하는 중요 사항을 사실대로 알려주십시오. 이를 위반할 경우
    계약이 해지되거나 보험금 지급이 제한될 수 있습니다.

    3. 보장 설계 및 확정: 보험기간 20년 및 가입 가능한 최고 나이 60세 기준 내에서 원하는 보험가입금액(예: 100,000,000원)을
    결정하고 월 보험료를 확인하십시오.

    4. 청약서 작성 및 보험료 납입: 결정된 설계 내용을 바탕으로 청약을 진행하고 첫 회 보험료를 납입하십시오.

    5. 보험증권 수령: 가입 절차가 완료되면 보험증권을 수령하시게 됩니다. 증권을 받은 날부터 15일 이내(또는 청약일로부터 30일 이내)에
    청약철회가 가능함을 확인하십시오.'
  domain: insurance
  product_category: dodam_term
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 26689555-a58c-521f-941a-516b16053d0d
  title: '도담 정기보험: 수수료 안내'
  body: '도담 정기보험의 보험료 산정 체계 및 관련 안내입니다.


    - 보험료 산정 기준: 통계적 위험률과 고객님의 가입 연령에 기반하여 합리적으로 산정됩니다.

    - 보험료 용도: 납입하신 보험료는 미래의 보험금 지급을 위한 준비금 적립과 효율적인 제도 운영을 위해 사용됩니다.

    - 납입 편의 제공: 상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하고 있습니다.


    정해진 보험료 체계를 엄격히 준수하며, 개별 고객의 조건에 따른 정확한 보험료는 설계 단계에서 안내해 드립니다.'
  domain: insurance
  product_category: dodam_term
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4fc9b250-6410-53cc-be51-b2254cd035cb
  title: '도담 정기보험: 처리가 끝나지 않거나 보류 중일 때'
  body: "보험 가입 신청 후 처리가 완료되지 않고 '보류' 상태이거나 진행이 더딘 경우, 다음 내용을 확인하십시오.\n\n- 예상 증상: 청약\
    \ 완료 안내를 받지 못했거나 심사 진행 상태가 정체되어 있음\n- 주요 원인\n  1. 계약 전 알릴 의무 사항 중 추가 확인이 필요한 내용이\
    \ 발견된 경우\n  2. 제출 서류의 미비 또는 기재 사항 불일치\n  3. 고위험군으로 분류되어 정밀 심사가 필요한 경우\n- 확인 및\
    \ 해결 방법\n  1. 성함과 생년월일을 통해 본인 확인을 진행하신 후, 미비된 서류나 추가 답변이 필요한 사항이 있는지 확인하십시오.\n\
    \  2. 요청받은 추가 건강 진단서나 증빙 서류를 제출해 주십시오.\n- 에스컬레이션: 단순 서류 확인으로 해결되지 않는 복잡한 심사 건은\
    \ 전문 언더라이터 및 보상 심사역에게 전달하여 정밀 심사를 진행하며, 결과는 개별적으로 안내해 드립니다."
  domain: insurance
  product_category: dodam_term
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 411814bb-00a1-586f-88c5-472eec074f96
  title: '도담 정기보험: 가입 대상'
  body: '도담 정기보험 가입 가능 여부를 확인하십시오.


    - 가입 가능 나이: 60세 이하 → 가입 가능

    - 가입 제한 나이: 60세 초과 → 가입 불가

    - 계약 전 알릴 의무: 성실히 이행함 → 가입 가능 (심사 결과에 따라 담보 제한 가능)

    - 계약 전 알릴 의무: 고지 의무 위반 → 가입 제한 또는 계약 해지 가능'
  domain: insurance
  product_category: dodam_term
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 7055835b-b153-551a-a26e-d8c8020c3ffb
  title: '도담 정기보험: 당사의 비슷한 상품과의 비교'
  body: '도담 정기보험과 도담 종신보험(저해지환급형)의 차이점을 안내해 드립니다.


    - 도담 정기보험: 20년과 같이 정해진 기간 동안만 사망을 보장합니다. 보장 기간이 한정된 만큼 보험료가 매우 합리적이어서, 자녀 성장기
    등 집중 보장이 필요한 시기에 적합합니다.

    - 도담 종신보험(저해지환급형): 기간 제한 없이 평생 동안 사망을 보장합니다. 정기보험보다 보험료 부담은 높으나, 평생의 보장과 함께 저해지환급형
    구조를 통해 납입 기간 중 부담을 낮춘 상품입니다.


    경제적 사망 보장을 합리적인 비용으로 준비하시려는 분께는 ''도담 정기보험''을, 기간에 상관없이 평생의 안정적인 보장을 원하시는 분께는 ''도담
    종신보험(저해지환급형)''을 추천합니다.'
  domain: insurance
  product_category: dodam_term
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 0ef2ea5f-dd31-5f57-8be6-334d36b1ddab
  title: '도담 정기보험: 상품설명서 주요 내용'
  body: '본 상품은 보험업법에 따라 금융위원회와 금융감독원의 감독을 받습니다.


    - 예금자 보호: 예금보험공사가 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다.

    - 소비자 권리: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회할 수 있습니다. 단, 진단계약 등 일부
    계약은 철회가 제한될 수 있습니다.

    - 계약자의 의무: 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''가 있으며, 이를 위반할 경우 계약 해지
    및 보험금 지급이 제한될 수 있습니다.

    - 세제 혜택: 근로소득자의 경우 보장성보험료에 대해 연 100만원 한도로 12%의 세액공제를 받을 수 있습니다.

    - 분쟁 처리: 자체 해결이 어려운 민원이나 분쟁은 금융감독원을 통해 신청하실 수 있습니다.'
  domain: insurance
  product_category: dodam_term
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: f18ca4f6-313d-575e-88d4-175d4d2b2da0
  title: '도담 정기보험: 금리·요율 안내'
  body: '도담 정기보험의 보험료 요율은 통계적 위험률과 가입자의 연령에 따라 결정됩니다.


    - 적용 요율: 고객님의 연령, 성별, 건강 상태 및 선택하신 보험가입금액에 따라 차등 적용됩니다.

    - 보험료 예시: 30세 남성이 보험기간 20년으로 가입하고 보험가입금액을 100,000,000원으로 설정했을 때, 월 보험료는 24,000원입니다.


    상기 예시는 이해를 돕기 위한 참고 수치이며, 실제 납입 보험료는 개별 심사 결과에 따라 변동될 수 있습니다. 정확한 보험료는 설계서를 통해
    확인하십시오.'
  domain: insurance
  product_category: dodam_term
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: a3134776-827a-5f28-9840-c5ec3f8111be
  title: '도담 정기보험: 진행 중인 이벤트'
  body: '도담생명에서 합리적인 가족 보호 플랜, ''도담 정기보험'' 가입 고객님을 위한 안내를 드립니다.


    현재 도담 정기보험을 통해 소중한 가족을 위한 경제적 안전장치를 마련하신 고객님들을 대상으로 상품 안내 캠페인을 진행하고 있습니다. 특히 30세
    남성 기준, 월 24,000원의 합리적인 비용으로 100,000,000원의 보장을 준비하실 수 있는 기회를 확인해 보십시오.


    본 이벤트는 한정된 기간 동안 진행되며, 상세한 참여 방법과 혜택은 상담원을 통해 안내받으실 수 있습니다. 지금 바로 도담 정기보험의 실속
    있는 보장 체계를 경험해 보십시오.'
  domain: insurance
  product_category: dodam_term
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4bc31d96-a2e3-5248-a00e-f8198bbe18ab
  title: '도담 정기보험: 부정사용으로부터 고객을 보호하기 위해'
  body: '도담생명은 고객님의 소중한 보험 계약과 개인정보를 보호하기 위해 엄격한 본인 인증 절차를 운영하고 있습니다. 도담 정기보험과 관련하여
    상태 변경이나 중요 정보 조회가 필요한 경우, 상담원은 고객님의 성함과 생년월일만을 확인하여 본인 인증을 수행합니다.


    고객님께서 유의하셔야 할 사항은 다음과 같습니다. 도담생명은 어떠한 경우에도 다음과 같은 민감 정보를 요구하지 않습니다.

    - 일회성 인증 코드 및 MFA(다요소 인증) 번호

    - 계정 비밀번호 및 카드 번호

    - 주민등록번호 전체 자릿수


    만약 상담원이 위와 같은 정보를 요구하거나, 도담생명을 사칭하여 금전적 요구를 하는 경우 즉시 상담을 중단하시고 공식 채널을 통해 신고해 주시기
    바랍니다. 부정사용이 의심되는 정황을 발견하신 경우, 신속히 알려주셔야 피해를 최소화할 수 있습니다.


    금융위원회와 금융감독원의 감독을 받는 도담생명은 고객님의 데이터 프라이버시를 철저히 관리하며, 안전한 금융 환경을 제공하기 위해 최선을 다하고
    있습니다.'
  domain: insurance
  product_category: dodam_term
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 7d2551a5-611f-5aae-a573-7584d71863f8
  title: '도담 정기보험: 약관'
  body: '본 약관은 도담 정기보험의 계약 체결 및 유지, 보험금 지급에 관한 기본 사항을 규정합니다.


    1. 계약의 성립 및 효력

    본 상품은 가입 가능한 최고 나이인 60세 이하의 고객을 대상으로 하며, 정해진 보험기간(20년) 동안 경제적 사망 보장을 제공합니다. 계약자는
    보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약철회를 통해 계약을 취소하고 납입 보험료를 돌려받을 수 있습니다.


    2. 계약 전 알릴 의무

    가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''를 준수해야 합니다. 이를 위반하여 사실과 다르게 알린 경우,
    보험업법 및 관련 법규에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.


    3. 보험료 납입 및 계약 유지

    보험료는 통계적 위험률과 연령에 기반하여 합리적으로 산정됩니다. 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하며, 보험료
    미납으로 인해 계약이 실효된 경우 정해진 절차에 따라 부활을 신청할 수 있습니다.


    4. 보험금 지급 및 면책

    약관에서 정한 보장 범위 내의 사고 발생 시 보험금을 지급합니다. 다만, 보험 사기가 의심되는 건에 대해서는 관련 법규에 따라 엄격하게 대응하며
    지급이 거절될 수 있습니다.'
