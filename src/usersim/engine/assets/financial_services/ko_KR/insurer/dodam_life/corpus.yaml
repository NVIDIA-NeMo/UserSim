- id: 74fe72ff-cad6-586a-a2a7-2366774c919a
  title: '도담 연금보험: 약관 변경 안내'
  body: '도담 연금보험의 계약 체결 및 유지에 적용되는 주요 약관 사항과 변경 안내입니다. 본 약관은 금융위원회와 금융감독원의 감독 하에 보험업법을
    준수하여 작성되었습니다.


    1. 보험차익 비과세 요건

    본 상품의 보험차익 비과세 혜택을 받기 위해서는 다음의 조건을 모두 충족해야 합니다. 월 납입 보험료가 1,500,000원 이하이어야 하며,
    이를 5년 이상 균등하게 납입하고, 계약을 10년 이상 유지해야 합니다. 해당 요건을 충족하지 못할 경우 관련 법령에 따라 과세될 수 있습니다.


    2. 소비자의 권리와 의무

    계약자는 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회할 수 있는 권리가 있습니다. 또한 가입 시 과거
    병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''가 있으며, 이를 위반할 경우 계약이 해지되거나 보험금 지급이 제한될 수
    있음을 유의하십시오.


    3. 계약의 변경 및 해지

    보험료 납입 유예 등 편의 제공 사항은 상품별 약관에 명시된 조건에 따릅니다. 계약 해지 시 지급되는 해약환급금은 납입 기간 및 상품 구조에
    따라 달라지며, 예금자보호법에 따라 1인당 1억원까지 보호됩니다.


    약관의 세부 변경 사항은 당사 공식 디지털 채널을 통해 공지되며, 중요한 변경 사항은 개별 통지를 통해 안내해 드립니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 53557458-7678-5265-8970-8d38aae2d10a
  title: '도담 연금보험: 가입부터 이용까지'
  body: '본 문서는 도담 연금보험의 전체 프로세스를 지원하는 상담원을 위한 가이드라인입니다.


    1. 가입 단계

    고객의 노후 자금 마련 목적에 따라 적정 보험료를 산정합니다. (예: 30세 가입, 20년 납입 시 월 보험료 300,000원 기준) 가입
    시 반드시 ''계약 전 알릴 의무''를 상세히 설명하고, 청약철회 가능 기간(증권 수령 후 15일, 청약 후 30일 이내)을 안내하십시오.


    2. 유지 및 관리 단계

    고객이 보험차익 비과세 혜택을 받을 수 있도록 다음 요건을 안내합니다.

    - 월 납입 한도: 1,500,000원 이하

    - 최소 납입 기간: 5년 이상 균등 납입

    - 최소 유지 기간: 10년 이상


    3. 연금 수령 단계

    약정된 연금 개시 나이인 65세가 되면 고객은 연금 수령을 신청할 수 있습니다. 수령 방식 및 금액은 가입 시 선택한 옵션과 적립금 규모에
    따라 결정됩니다.


    4. 주의사항

    상담원은 보험금 지급을 확정적으로 약속해서는 안 되며, 모든 안내는 객관적인 상품 설명서에 기반해야 합니다. 개인별 맞춤형 세무 조언은 금지되며
    일반적인 비과세 요건에 대한 정보만 제공하십시오. 본 상품은 예금보험공사를 통해 1인당 1억원까지 보호됩니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: product_sheet
  source_authority: official
