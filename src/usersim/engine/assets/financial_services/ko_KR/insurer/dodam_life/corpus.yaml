- id: 51df454c-2c11-5264-b3ec-d8443ff4e26b
  title: '도담 연금보험: 약관'
  body: '본 약관은 도담 연금보험 계약에 따른 회사와 계약자 간의 권리와 의무를 규정합니다.


    1. 계약자의 의무: 고객님은 보험 가입 시 과거 병력 등 중요 사항을 사실대로 알려야 하는 ''계약 전 알릴 의무''를 지닙니다. 이를 위반할
    경우 보험업법 및 당사 약관에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.


    2. 청약 철회권: 계약자는 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 가입 의사를 철회하고 납입한 보험료를 돌려받을
    수 있습니다.


    3. 연금 지급 조건: 본 상품의 연금 개시 나이는 65세로 설정되어 있으며, 해당 시점부터 약정된 연금액이 지급됩니다.


    4. 보험차익 비과세 요건: 관련 세법에 따라 다음 요건을 모두 충족해야 보험차익이 비과세됩니다.

    - 보험계약 유지 기간이 10년 이상일 것

    - 월 납입 보험료가 1,500,000원 이하일 것

    - 5년 이상 균등하게 납입할 것


    5. 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사가 보호하며, 보험계약자 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 805bc8f6-8952-5d57-b71f-c0165d99e913
  title: '도담 연금보험: 이런 분께 알맞습니다'
  body: '도담 연금보험은 안정적인 노후 준비와 효율적인 자산 관리를 원하는 고객님을 위해 설계된 상품입니다. 특히 다음과 같은 분들께 추천드립니다.


    1. 체계적인 노후 자금 마련이 필요하신 분: 연금 개시 나이인 65세부터 안정적인 현금 흐름을 확보하여 경제적 안정을 도모하고자 하는 분께
    적합합니다.


    2. 절세 혜택을 통해 수익률을 높이고 싶으신 분: 보험차익 비과세 요건(10년 이상 유지, 월 1,500,000원 이하 납입, 5년 이상
    납입)을 충족하여 세금 부담 없이 자산을 증식하고자 하는 분께 유리합니다.


    3. 장기적으로 안정적인 저축 수단을 찾으시는 분: 통계적 위험률에 기반한 합리적인 보험료 체계를 통해 미래의 연금 지급을 준비하고자 하는
    분께 권해드립니다.


    도담 연금보험은 단순한 저축을 넘어 고객님의 생애 주기별 맞춤형 보장을 제공하며, 정직한 보장 체계를 통해 신뢰할 수 있는 노후 파트너가 되어
    드리겠습니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d2ff858b-381e-5fb9-a291-0a6ab7907f4a
  title: '도담 연금보험: 월 보험료 예시(30세 가입, 20년 납입) 안내'
  body: '질문: 도담 연금보험에 가입할 경우 월 보험료는 어느 정도로 예상하면 될까요?


    답변: 고객님의 연령과 납입 기간에 따라 보험료가 산정됩니다. 예시로 30세 고객님이 가입하여 20년 동안 납입하시는 경우, 월 보험료는 300,000원
    수준입니다. 다만, 이는 이해를 돕기 위한 예시이며 실제 보험료는 고객님의 정확한 연령과 선택하시는 보장 조건에 따라 달라질 수 있음을 안내드립니다.
    상세한 설계 내용은 상담원을 통해 확인하시기 바랍니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 20caac73-78af-52c8-bedf-557ec886739f
  title: '도담 연금보험: 해지·변경·상품 전환'
  body: '도담 연금보험의 계약 내용을 변경하시거나 해지, 또는 다른 상품으로 전환하고자 하시는 경우 다음의 절차를 따르십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 다음 단계 진행이 가능합니다.

    2. 요청 사항 전달: 해지, 수익자 변경, 또는 상품 전환 중 원하시는 업무를 요청하십시오. 변경 사항이 있을 경우 변경하고자 하는 구체적인
    내용을 말씀해 주십시오.

    3. 조건 확인 및 안내: 상담원이 현재 계약의 해약환급금 수준이나 변경 시 영향을 받는 조건(예: 비과세 요건 유지 여부)을 안내해 드립니다.

    4. 최종 확정: 안내받으신 내용을 확인하신 후 최종적으로 요청을 확정하십시오. 변경 완료 후 처리 결과가 안내됩니다.


    참고: 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내라면 ''청약철회''를 통해 납입 보험료를 돌려받으실 수 있습니다.
    중도 해지 시에는 납입 기간 및 상품 구조에 따라 해약환급금이 원금보다 적을 수 있으니 신중히 결정하시기 바랍니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 55814b6b-672d-5fdf-b225-b81db093708b
  title: '도담 연금보험: 예상과 다른 수수료나 금액'
  body: '고객님께서 확인하신 해약환급금이나 연금 수령액이 예상과 다를 경우, 다음과 같은 원인을 확인하시기 바랍니다.


    1. 보험차익 비과세 요건 미충족: 보험차익 비과세를 위해서는 10년 이상 유지, 월 1,500,000원 이하 납입, 5년 이상 균등 납입이라는
    요건을 모두 충족해야 합니다. 이 중 하나라도 충족하지 못했다면 관련 세금이 차감되어 수령액이 줄어들 수 있습니다.


    2. 중도 해지로 인한 환급금 감소: 연금보험은 장기 유지 상품으로, 납입 기간 중 해지 시 사업비 차감 등으로 인해 해약환급금이 납입 원금보다
    적을 수 있습니다.


    3. 보험료 납입 유예 및 실효: 보험료 납입이 일정 기간 중단되어 계약이 실효된 경우, 부활 절차를 거치지 않으면 환급금 산정에 영향이 있을
    수 있습니다.


    위 사항을 확인하신 후에도 금액이 맞지 않다고 판단되시면, 상담원에게 상세 내역 조사를 요청하십시오. 전문 보상 심사역이 정확한 산출 근거를
    재검토하여 안내해 드리겠습니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4cfdfac4-0b82-579d-ab2b-568ada0a0bb6
  title: '도담 연금보험: 필요 서류'
  body: '도담 연금보험의 주요 업무 처리를 위해 필요한 서류는 다음과 같습니다.


    | 요청 업무 | 필요 서류 및 조건 |

    | :--- | :--- |

    | 신규 가입 | 본인 신분증, 청약서(서명 완료) |

    | 계약자/수익자 변경 | 본인 신분증, 변경 신청서, (수익자) 동의서 |

    | 연금 개시 신청 | 본인 신분증, 연금 수령 계좌 통장 사본 |

    | 보험금/환급금 청구 | 본인 신분증, 지급 신청서, 본인 명의 계좌번호 |

    | 청약 철회 | 본인 신분증, 철회 신청서 |


    모든 서류는 최근 3개월 이내 발급된 것이어야 하며, 대리인 신청 시에는 인감증명서가 포함된 위임장이 추가로 필요합니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: d810444d-a2e8-5993-a627-588dd7d82117
  title: '도담 연금보험: 다른 회사의 일반적인 상품과의 비교'
  body: '도담 연금보험과 타사의 일반적인 연금 상품의 차이점을 안내해 드립니다.


    1. 투명한 비과세 가이드: 도담 연금보험은 월 1,500,000원 이하 납입, 5년 이상 납입, 10년 이상 유지라는 명확한 비과세 요건을
    기반으로 고객님이 스스로 세제 혜택을 설계할 수 있도록 돕습니다.


    2. 안정적인 자산 보호: 예금보험공사를 통해 1인당 최대 1억원까지 보호받으실 수 있어, 시장 변동성 속에서도 심리적 안정감을 제공합니다.


    3. 정직한 비용 구조: 통계적 위험률과 연령에 기반한 합리적인 보험료 산정 체계를 통해 불필요한 수수료 거품을 줄였습니다.


    타사의 변액 연금 상품은 투자 수익에 따라 고수익을 기대할 수 있다는 장점이 있으나, 원금 손실 가능성이 존재합니다. 반면 도담 연금보험은
    안정적인 노후 자금 마련과 확실한 비과세 혜택을 최우선으로 하는 고객님께 더 적합한 선택입니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 4cc4549b-36c3-5724-9c31-281625e20a83
  title: '도담 연금보험: 위험 안내'
  body: '본 상품 가입 전, 다음의 위험 사항을 충분히 숙지하시기 바랍니다.


    1. 원금 손실 위험: 도담 연금보험은 장기 유지 상품입니다. 납입 기간 중 또는 연금 개시 전 중도 해지하실 경우, 해약환급금이 납입한 보험료보다
    적어 원금 손실이 발생할 수 있습니다.


    2. 비과세 혜택 상실 위험: 보험차익 비과세 혜택을 받기 위해서는 월 납입액 1,500,000원 이하, 5년 이상 납입, 10년 이상 유지라는
    요건을 모두 충족해야 합니다. 요건을 충족하지 못한 상태에서 지급받는 보험차익은 과세 대상이 됩니다.


    3. 예금자 보호 한도: 예금자보호법에 따라 예금보험공사가 보호하는 금액은 보험계약자 1인당 해약환급금 등을 합해 최대 1억원입니다. 보호
    한도를 초과하는 금액은 보호되지 않을 수 있습니다.


    4. 계약 해지 위험: 가입 시 ''계약 전 알릴 의무''를 위반하여 중요 사항을 사실과 다르게 알린 경우, 보험업법에 따라 계약이 해지될
    수 있으며 이 경우 보험금 지급이 제한될 수 있습니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 2ab72145-4334-54bd-a3cd-6d82d12cac53
  title: '도담 연금보험: 금리·요율이 정해지는 방식과 적용'
  body: '도담 연금보험의 보험료 및 적용 요율은 다음과 같은 원칙에 따라 산정됩니다.


    1. 산정 기준: 보험료는 통계적 위험률과 가입자의 연령을 기반으로 합리적으로 산정됩니다. 이는 미래에 고객님께 지급할 연금액을 위한 준비금을
    안정적으로 적립하고, 제도를 효율적으로 운영하기 위함입니다.


    2. 적용 방식: 모든 가입자에게는 상품 약관에 명시된 표준 요율 체계가 동일하게 적용됩니다. 개별적인 임의 할인이나 약정 외 요율 적용은
    하지 않으며, 오직 정해진 보험료 체계를 준수합니다.


    3. 변동 요인: 보험료는 가입 당시의 연령과 선택하신 납입 기간에 따라 결정됩니다. 예를 들어, 30세 가입자가 20년 납입을 선택할 경우
    월 300,000원의 예시 보험료가 적용되는 것과 같이, 가입 시점의 조건이 요율 결정의 핵심이 됩니다.


    상세한 개인별 보험료 산출 내역은 가입 설계서 및 상품 설명서를 통해 확인하실 수 있습니다.'
  domain: insurance
  product_category: dodam_annuity
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: b13ac6e0-8e93-565d-846a-4170d703bddd
  title: '도담 연금보험: 추천·장기 이용 혜택'
  body: '도담생명이 고객님의 안정적인 노후 준비를 지원하기 위해 도담 연금보험의 장기 유지 혜택을 안내해 드립니다. 본 상품은 10년 이상
    유지하고 월 1,500,000원 이하를 5년 이상 균등하게 납입하는 등 일정 요건을 충족하실 경우 보험차익에 대한 비과세 혜택을 제공합니다.


    지금 가입하시어 65세 연금 개시 나이까지 체계적으로 자산을 준비하십시오. 정직한 보장 체계와 투명한 운용으로 고객님의 경제적 안정을 약속드립니다.'
