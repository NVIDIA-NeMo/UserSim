- id: 68fc1be2-a85a-5cce-b4e2-6b6b7ce5199d
  title: '도담 정기보험: 약관 변경 안내'
  body: '본 안내는 도담 정기보험의 약관 변경 절차와 고객님의 권익 보호를 위한 주요 사항을 다룹니다.


    1. 약관의 변경 및 고지

    도담생명은 보험업법 및 관련 법령에 따라 약관을 변경할 수 있습니다. 약관이 변경될 경우, 변경 내용과 시행일을 고객님께 개별 통지하거나 공식
    디지털 채널을 통해 안내합니다. 고지된 내용에 동의하지 않으시는 경우, 약관에 명시된 절차에 따라 계약 해지 등을 요청하실 수 있습니다.


    2. 계약의 유지 및 효력

    본 상품은 20의 보험기간(년)을 기본으로 하며, 정해진 보험료 체계를 준수하여 납입하셔야 보장이 유지됩니다. 보험료 납입이 유예되거나 실효될
    경우 보장 혜택이 제한될 수 있으며, 이 경우 부활 절차를 통해 계약을 회복하실 수 있습니다.


    3. 소비자의 권리

    고객님은 보험증권을 받은 날부터 15일 이내, 또는 청약한 날부터 30일 이내에 청약을 철회할 수 있는 권리를 가집니다. 또한, 계약 전 알릴
    의무를 성실히 이행하셔야 하며, 이를 위반할 경우 보험금 지급이 제한되거나 계약이 해지될 수 있음을 유의하시기 바랍니다.


    모든 분쟁은 공정하고 객관적인 절차에 따라 처리되며, 자체 해결이 어려운 경우 금융감독원을 통해 민원을 신청하실 수 있습니다.'
