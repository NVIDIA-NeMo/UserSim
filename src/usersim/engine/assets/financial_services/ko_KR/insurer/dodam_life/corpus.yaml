- id: 3e3aad80-e3cb-5858-b673-eadea1edb181
  title: '도담 정기보험: 명세서나 내역과 맞지 않을 때'
  body: '고객님께서 수령하신 보험료 납입 명세서나 계약 내역이 예상과 다를 때, 상담원은 다음 순서에 따라 대응하시기 바랍니다.


    1. 증상 확인

    - 고객이 체감하는 불일치 사항(예: 보험료 과다 청구, 납입 회차 누락, 보장 금액 상이 등)을 정확히 파악합니다.


    2. 기본 확인 사항

    - 본인 인증(성함, 생년월일) 후, 현재 등록된 결제 수단과 납입일이 정확한지 확인합니다.

    - 보험기간 20년 및 가입 시 설정한 보험가입금액(예: 100,000,000원)이 계약서와 일치하는지 대조합니다.


    3. 원인 분석 및 해결

    - 단순 전산 반영 지연인 경우: 다음 명세서에 소급 반영됨을 안내하고 처리 예정일을 제시합니다.

    - 납입 유예 또는 실효 상태인 경우: 해당 상태로 인해 발생한 미납금이나 연체 이자가 포함되었는지 확인하여 설명합니다.


    4. 에스컬레이션

    - 계산 오류가 의심되거나 복잡한 보험금 지급 내역과 관련된 분쟁인 경우, 즉시 전문 보상 심사역 또는 담당 부서로 에스컬레이션하여 정밀 조사를
    진행합니다. 조사 결과는 신속하게 고객님께 안내해 드리며, 해결이 어려운 경우 금융감독원을 통해 민원을 신청하실 수 있음을 정중히 안내하십시오.


    금융위원회와 금융감독원의 감독을 받으며 보험업법을 준수합니다. 예금자보호법에 따라 예금보험공사가 1인당 해약환급금 등을 합해 1억원까지 보호합니다.'
  domain: insurance
  product_category: dodam_term
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 116e1204-55d6-5edf-a6df-5742b0da89e5
  title: '도담 종신보험(저해지환급형): 상품 개요'
  body: '도담 종신보험(저해지환급형)은 고객님의 평생 동안 사망을 보장하여 가족의 경제적 안정을 지원하는 상품입니다. 특히 납입 기간 중 해약환급금을
    낮추는 대신 월 보험료 부담을 줄인 저해지환급형 구조를 채택하여, 합리적인 비용으로의 든든한 보장을 가능하게 하였습니다.


    본 상품의 주요 특징은 다음과 같습니다.

    - 보장 범위: 평생 사망 보장

    - 상품 구조: 저해지환급형 (보험료 납입 기간 중 해약환급금이 표준형보다 적게 설계됨)

    - 보험가입금액 예시: 100,000,000원

    - 보험료 납입기간: 20년

    - 월 보험료 예시: 186,000원 (40세 여성, 20년 납입 기준)


    도담생명은 투명한 보험료 산정을 통해 고객님께 정직한 보장 체계를 제공합니다. 자세한 내용은 상품설명서 및 약관을 확인하시기 바랍니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 9f055c8a-b154-578d-9a61-d393846fb1b8
  title: '도담 종신보험(저해지환급형): 보험가입금액 예시 안내'
  body: '질문: 도담 종신보험(저해지환급형)의 보험가입금액은 보통 어느 정도로 설정하나요?


    답변: 보험가입금액은 고객님의 가족 구성원 수, 경제적 상황, 필요 보장 자산에 따라 자유롭게 설계하실 수 있습니다. 이해를 돕기 위한 예시로,
    보험가입금액을 100,000,000원으로 설정하실 경우 해당 금액이 사망 보험금의 기준이 됩니다. 구체적인 가입 금액 설정은 상담원을 통해
    고객님의 생애 주기별 맞춤형 보장 분석을 통해 결정하시기를 권장합니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: faq
  source_authority: official
