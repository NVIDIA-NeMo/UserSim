- id: 7ac29be9-d83c-5e02-900f-c5a6c2f4b825
  title: '도담 정기보험: 월 보험료 예시(30세 남성, 20년 만기) 안내'
  body: 'Q: 30세 남성이 20년 만기로 가입할 경우 예상되는 월 보험료는 얼마입니까?


    A: 도담 정기보험의 월 보험료 예시(30세 남성, 20년 만기) 기준으로 24,000원입니다. 다만, 실제 보험료는 고객님의 건강 상태,
    직업, 선택하시는 보험가입금액 등 개인별 위험률에 따라 차이가 발생할 수 있습니다.


    Q: 이 보험료는 고정된 금액인가요?


    A: 네, 정해진 보험료 체계를 준수하며 가입 시 산정된 보험료를 납입 기간 동안 유지하시게 됩니다. 상세한 보험료 산정 방식은 ''도담 정기보험:
    금리·요율이 정해지는 방식과 적용''에서 확인하실 수 있습니다.'
  domain: insurance
  product_category: dodam_term
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 31308107-c67a-526a-a823-6b602af25d50
  title: '도담 정기보험: 해지·변경·상품 전환'
  body: '도담 정기보험의 계약 해지, 정보 변경 또는 다른 상품으로의 전환을 원하실 경우 다음 절차를 따라주십시오.


    1. 본인 인증 수행

    상담원에게 성함과 생년월일을 말씀하여 본인 확인 절차를 거칩니다.


    2. 요청 사항 전달

    계약 해지, 수익자 변경, 또는 다른 보장 상품으로의 전환 중 원하시는 업무를 말씀하십시오.


    3. 조건 확인 및 안내

    - 해지 시: 현재 시점의 해약환급금을 확인하고, 해지 후 보장이 소멸됨을 안내받습니다.

    - 변경 시: 변경하고자 하는 내용(예: 수익자 변경)의 필요 서류를 안내받습니다.

    - 전환 시: 전환 가능한 상품의 특징과 새로운 보험료 체계를 안내받습니다.


    4. 최종 요청 및 처리

    안내받은 조건에 동의하신 후 최종 요청을 하시면, 전문 심사역의 확인을 거쳐 처리가 완료됩니다. 처리 결과는 고객님의 등록된 연락처로 안내해
    드립니다.


    본 상품은 보장성 보험으로, 중도 해지 시 납입한 보험료보다 해약환급금이 적거나 없을 수 있으니 신중히 결정하시기 바랍니다.'
  domain: insurance
  product_category: dodam_term
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 2d93c868-7ff4-5aa1-ac38-548ceec98e2c
  title: '도담 정기보험: 예상과 다른 수수료나 금액'
  body: '고객님께서 안내받으신 예상 보험료나 해약환급금이 실제 청구 금액과 다르다고 느끼시는 경우, 다음 사항을 순차적으로 점검하십시오.


    1. 가입 조건 재확인

    보험료는 통계적 위험률과 연령에 기반합니다. 가입 당시의 연령, 직업, 건강 상태(계약 전 알릴 의무 이행 여부)가 예시 기준(예: 30세
    남성)과 다른지 확인하십시오.


    2. 납입 유예 및 실효 여부 확인

    보험료 납입 유예를 신청하셨거나, 미납으로 인해 계약이 실효된 후 부활 청구를 하셨는지 확인하십시오. 이 과정에서 미납 보험료나 이자가 가산되었을
    수 있습니다.


    3. 해약환급금 산정 방식 확인

    정기보험은 보장성 상품으로, 저축성 상품과 달리 해약환급금이 매우 적거나 없을 수 있습니다. 상품 설명서의 환급금 표를 다시 확인하십시오.


    위 사항을 확인했음에도 금액 차이가 명확하지 않은 경우, 상담원은 해당 건을 전문 언더라이터 및 보상 심사역으로 에스컬레이션하여 정밀 재심사를
    요청합니다. 심사 결과는 영업일 기준 3~5일 이내에 안내해 드립니다.'
  domain: insurance
  product_category: dodam_term
  document_type: troubleshooting
  source_authority: official
