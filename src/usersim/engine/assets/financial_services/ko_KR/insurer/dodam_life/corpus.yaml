  institution_id: dodam_life
- id: 3bb87e22-5bd8-53ba-8f5c-af80e825bab5
  title: '도담 종신보험(저해지환급형): 이런 분께 알맞습니다'
  body: '도담 종신보험(저해지환급형)은 평생 동안의 사망을 보장하면서도, 경제적 부담을 낮추고자 하는 고객님께 최적화된 상품입니다.


    이런 분들께 추천합니다:

    - 합리적인 비용으로 가족을 위한 경제적 안전장치를 마련하고 싶으신 분

    - 납입 기간 중 환급금보다는 월 보험료의 효율성을 중요하게 생각하시는 분

    - 평생 보장되는 사망 보험금을 통해 안정적인 상속 및 유족 지원 체계를 구축하고 싶으신 분


    [상품 특징 및 예시]

    - 보장 가치: 보험가입금액 예시인 100,000,000원을 통해 가족의 경제적 안정을 지원합니다.

    - 비용 효율성: 납입기간 중 해약환급금 수준을 표준형 대비 50%로 낮게 책정하여 월 보험료 부담을 줄였습니다.

    - 납입 기간: 20년 동안 보험료를 납입하여 평생의 보장을 완성합니다.


    본 상품은 사망 보장에 집중한 상품으로, 저축이나 투자 수단이 아님을 유의하시기 바랍니다. 구체적인 가입 조건은 ''도담 종신보험(저해지환급형):
    가입 대상''에서 확인하실 수 있습니다.'
  domain: insurance
  product_category: dodam_whole_life
  document_type: product_sheet
  source_authority: official
