- id: 1bba5a00-6145-5ad5-a80d-dc9db224d47d
  title: '도담 암보험: 수수료 안내'
  body: '도담 암보험의 보험료는 통계적 위험률과 가입자의 연령을 기반으로 합리적으로 산정됩니다. 이는 미래의 보험금 지급을 위한 준비금 적립과
    효율적인 제도 운영을 위해 사용됩니다.


    [보험료 산정 예시]

    - 월 보험료: 29,000원 (40세 남성, 20년 납입 기준)


    정해진 보험료 체계를 엄격히 준수하며, 상품별 약관에 명시된 조건에 따라 보험료 납입 유예 등의 편의를 제공하고 있습니다. 상세한 납입 관련
    사항은 담당 상담원에게 문의하십시오.'
  domain: insurance
  product_category: dodam_cancer
  document_type: fee_schedule
  source_authority: official
