- id: 93509e39-7265-5df6-88ed-d0c20d1cd4fc
  title: '도담 암보험: 거래가 거절되거나 제한되었을 때'
  body: '보험금 청구, 계약 변경 또는 해지 신청 중 거래가 거절되거나 제한되는 경우, 다음의 원인을 확인하십시오.


    증상: ''청구 불가'' 또는 ''신청 제한'' 안내를 받은 경우


    원인 확인 및 해결 방법:

    1. 면책기간 여부 확인: 암 진단 청구 시, 가입 후 90일이 경과했는지 확인하십시오. 면책기간 내 사고는 보장 대상에서 제외되어 청구가
    거절됩니다.

    2. 감액기간 적용 확인: 지급 금액이 예상보다 적은 경우, 계약일로부터 1년이 지났는지 확인하십시오. 1년 미만인 경우 지급 비율인 50%만
    적용됩니다.

    3. 계약 전 알릴 의무 위반: 가입 시 고지하지 않은 병력이 발견된 경우, 보험업법에 따라 계약이 해지되거나 보험금 지급이 제한될 수 있습니다.

    4. 서류 미비: 청구에 필요한 필수 진단서나 의학적 증빙 서류가 누락되었는지 확인하십시오.


    해결이 어려운 경우:

    상담원에게 상세 사유 조회를 요청하십시오. 당사는 공정한 절차에 따라 조사를 진행하며, 자체 해결이 어려운 분쟁은 금융감독원을 통해 민원을
    신청하실 수 있도록 안내해 드립니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 8143e0b1-43b7-5904-971e-20c6935ccbd0
  title: '도담 암보험: 전환이나 상위 상품을 고려할 때'
  body: '고객이 현재의 보장 수준을 높이거나 상품 전환을 고려할 때 상담원이 안내해야 할 비교 기준입니다.


    도담 암보험은 일반암 진단비 30,000,000원과 유사암 진단비 6,000,000원을 통해 암 진단 시 발생하는 고액의 치료비와 생활비를
    집중 보장하는 특화 상품입니다.


    전환 고려 시 비교 포인트:

    - 보장 금액 확대: 현재 보장 금액보다 더 높은 진단비가 필요한 경우, 가입 가능 금액 한도를 확인하여 상위 플랜으로의 전환을 검토하십시오.

    - 보장 범위 확장: 특정 암뿐만 아니라 입원, 수술 등 포괄적인 건강 관리가 목적이라면 도담 건강보험과의 조합을 추천하십시오. 도담 건강보험은
    정액 보장 방식으로 입원 및 수술 시 약정 금액을 지급합니다.


    추천 가이드:

    - 암 진단 시의 경제적 충격을 최소화하고 싶은 고객 → 도담 암보험의 진단비 강화

    - 전반적인 질병 및 사고로 인한 입원/수술비 대비가 필요한 고객 → 도담 건강보험 병행 가입


    상담원은 객관적인 상품 설명서에 기반하여 가이드를 제공하며, 보험금 지급을 확정적으로 약속해서는 안 됩니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 851e1e1a-0de3-5918-8bbf-8df553e44a1c
  title: '도담 암보험: 다른 상품과의 비교와 맞지 않는 경우'
  body: '도담 암보험은 암이라는 특정 질병에 대해 고액의 진단비를 지급함으로써 경제적 안정을 지원하는 상품입니다. 고객님의 목적에 따라 다른
    상품이 더 적합할 수 있습니다.


    1. 도담 암보험이 적합한 경우

    - 암 진단 시 치료비 외에도 생활비, 간병비 등 목돈의 보장 자금이 필요하신 분

    - 일반암 진단비 30,000,000원, 유사암 진단비 6,000,000원과 같은 정액 보장을 원하시는 분


    2. 다른 상품이 더 적합한 경우

    - 입원, 수술 등 암 이외의 다양한 질병 보장을 원하시는 경우: 실제 치료비와 상관없이 약정 금액을 지급하는 도담 건강보험이 더 적합합니다.

    - 사망 보장을 통한 가족의 경제적 보호가 최우선인 경우: 도담 정기보험 또는 도담 종신보험(저해지환급형)을 권장합니다.

    - 노후 자금 마련 및 비과세 혜택이 목적이신 경우: 도담 연금보험이 적합합니다.


    3. 주의사항

    - 본 상품은 저축성 상품이 아니며, 암 보장에 특화되어 있습니다.

    - 면책기간(90일)과 감액기간(1년, 50% 지급)이 존재하므로 가입 즉시 모든 보장이 시작되지 않는다는 점을 유의하십시오.'
  domain: insurance
  product_category: dodam_cancer
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 99b02e08-3cc9-513c-84a3-bf0ec8db06ae
  title: '도담 암보험: 감액기간 중 지급 비율 안내'
  body: '질문: 감액기간 중에 암 진단을 받으면 보험금을 전혀 받을 수 없습니까?


    답변: 아닙니다. 면책기간(90일)이 지난 후라면 보장은 가능합니다. 다만, 계약일부터 1년이 경과하기 전인 ''감액기간'' 내에 암 진단을
    받으신 경우에는 보험금 지급 비율인 50%가 적용됩니다.


    예를 들어, 일반암 진단비 30,000,000원 가입 고객이 가입 후 6개월 만에 암 진단을 받으셨다면, 50%인 15,000,000원을 지급해
    드립니다. 가입 후 1년이 경과한 시점부터는 100% 전액을 지급받으실 수 있습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: e2b81a6f-541e-5a3f-baac-b8425268b311
  title: '도담 암보험: 자주 하는 업무의 처리 절차'
  body: '도담 암보험의 가장 빈번한 업무인 ''보험금 청구'' 처리 절차를 안내해 드립니다.


    준비 사항: 진단서(암 진단 코드 포함), 병원 영수증, 신분증 사본


    1. 본인 인증: 상담원에게 성함과 생년월일을 말씀하여 본인 확인을 완료하십시오.

    2. 청구 접수 요청: ''암 진단 보험금 청구''를 요청하시고, 해당 사고(진단) 일자를 알려주십시오.

    3. 서류 제출: 안내받은 경로를 통해 준비하신 진단서와 증빙 서류를 제출하십시오.

    4. 심사 진행: 당사의 전문 보상 심사역이 제출 서류를 검토합니다. 이때 면책기간(90일) 및 감액기간(1년) 적용 여부를 확인합니다.

    5. 결과 통보 및 지급: 심사가 완료되면 지급 여부와 최종 금액을 안내해 드리며, 지정하신 계좌로 보험금이 송금됩니다.


    기타 업무(납입 유예, 수익자 변경 등) 또한 동일하게 성함과 생년월일 확인 후 상담원을 통해 처리하실 수 있습니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: dodam_life
- id: 84434c94-14ec-5862-a6e4-c2e1d98724c7
  title: '도담 암보험: 명세서나 내역과 맞지 않을 때'
  body: '보험료 청구서나 지급 명세서의 금액이 예상과 다를 때 상담원이 확인해야 할 체크리스트입니다.


    증상: 고객이 보험료 또는 보험금 지급액에 대해 이의를 제기하는 경우


    확인 순서:

    1. 보험료 확인: 예시 보험료(40세 남성, 20년 납입 기준 29,000원)는 가입 연령과 성별, 특약에 따라 달라질 수 있습니다. 고객의
    실제 가입 조건과 일치하는지 확인하십시오.

    2. 지급 금액 계산 검토: 일반암 진단비 30,000,000원 또는 유사암 진단비 6,000,000원이 정상적으로 산정되었는지 확인하십시오.

    3. 감액 비율 적용 여부: 지급액이 50%만 계산되었다면, 사고 시점이 계약일로부터 1년 이내인지 확인하십시오. 감액기간 중 지급 비율인
    50%가 적용된 것이라면 정상 지급임을 안내하십시오.

    4. 면책기간 확인: 보험금 지급이 거절되었다면, 진단일이 가입 후 90일 이내인지 확인하십시오.


    해결 방법:

    계산 착오가 확인된 경우 즉시 보상 심사역에게 에스컬레이션하여 재심사를 요청하고, 결과가 나오는 대로 고객에게 정중히 안내하십시오. 모든 안내는
    객관적인 상품 설명서와 약관에 기반해야 합니다.'
  domain: insurance
  product_category: dodam_cancer
  document_type: troubleshooting
  source_authority: official
