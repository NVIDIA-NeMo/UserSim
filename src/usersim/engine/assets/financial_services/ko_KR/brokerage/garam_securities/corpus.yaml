- id: 773060ad-6a20-5c59-87fe-41f2187ba7f8
  title: '미국주식 거래: 약관 변경 안내'
  body: '가람증권은 서비스 품질 향상과 관련 법규 준수를 위해 미국주식 거래 약관을 변경합니다. 고객님께서는 변경 내용을 확인하시어 서비스
    이용에 참고하시기 바랍니다.


    [주요 변경 사항]

    - 거래 비용 체계: 미국주식 거래 수수료율은 0.25%로 적용되며, 이는 최적의 거래 환경 유지와 시스템 안정성을 위한 최소 비용으로 책정되었습니다.

    - 세제 처리: 해외주식 양도소득세율(지방소득세 포함)은 22%로 적용됩니다. 연간 2,500,000원의 기본공제액을 제외한 과세 대상 수익에
    대해 부과되며, 고객님께서는 다음 해 5월에 직접 신고하실 의무가 있습니다.

    - 환전 서비스: 효율적인 환전 환경을 제공하기 위해 95%의 환전 수수료 우대율을 적용합니다.


    [효력 발생 및 동의]

    약관 변경 사항은 공지 후 30일이 경과한 날부터 효력이 발생합니다. 변경 내용에 동의하지 않으시는 경우 계좌 해지를 요청하실 수 있으며,
    별도의 거부 의사를 표시하지 않으신 경우 변경된 약관에 동의하신 것으로 간주됩니다.'
