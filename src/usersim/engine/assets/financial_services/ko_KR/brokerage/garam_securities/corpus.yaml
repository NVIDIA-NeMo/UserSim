- id: 79207aa7-9a83-5dd0-9612-cd62b1b850d0
  title: get_order_status 도구 설명서
  body: 'get_order_status 도구는 고객 계좌의 주문 내역과 실시간 상태를 조회하는 기능을 제공합니다. 상담원은 이 도구를 통해
    고객의 주문 현황을 파악하여 안내합니다.


    - 인자(Arguments): order_id (선택 사항. 특정 주문의 상태만 조회할 때 사용하며, 입력하지 않을 경우 계좌의 모든 주문
    목록을 반환합니다.)

    - 반환 값: 각 주문의 order_id, 종목(security), 현재 상태(status) 정보

    - 전제 조건: 본인 인증이 완료된 고객에 한해 조회가 가능하며, 상담원이 직접 호출하여 정보를 얻습니다.'
