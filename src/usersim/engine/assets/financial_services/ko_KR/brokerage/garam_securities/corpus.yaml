- id: fd7ff7c4-c774-52d2-9f56-c2a8dde9d587
  title: '국내주식 거래: 이 상품을 사칭한 사기 주의'
  body: '최근 가람증권의 ''국내주식 거래'' 서비스를 사칭하여 고수익을 보장한다며 개인정보나 금전을 요구하는 사기 사례가 보고되고 있습니다.
    고객님께서는 다음의 주의 사항을 반드시 확인하시어 피해를 입지 않도록 유의하시기 바랍니다.


    가람증권은 어떠한 경우에도 고객님의 카드 번호, 계좌 비밀번호, 주민등록번호 전체와 같은 민감한 정보를 전화나 메시지로 요구하지 않습니다.
    또한, 특정 종목의 수익을 보장하거나 원금 보장형 투자 상품이라고 안내하며 입금을 유도하는 행위는 가람증권의 공식 서비스가 아니므로 절대 응하지
    마십시오.


    만약 가람증권 관계자를 사칭하며 비정상적인 거래를 권유받으셨거나, 부정 거래가 의심되는 정황이 발견될 경우 즉시 저희 고객센터로 알려주시기
    바랍니다. 접수 즉시 계좌 보호 조치를 취하여 추가 피해를 방지하겠습니다. 안전한 투자를 위해 공식 채널을 통해서만 정보를 확인하시고, 의심스러운
    연락은 즉시 차단하십시오.'
