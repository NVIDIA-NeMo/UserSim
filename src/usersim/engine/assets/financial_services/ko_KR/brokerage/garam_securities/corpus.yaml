- id: f8ee0678-ab59-5447-bb77-7d853ce18086
  title: '개인형 퇴직연금(IRP): 개인정보 처리 안내'
  body: '가람증권은 금융위원회의 감독 하에 고객님의 개인정보를 엄격히 관리하며, 개인형 퇴직연금(IRP) 서비스 제공을 위해 필요한 최소한의
    정보만을 수집합니다.


    [개인정보 수집 및 이용 목적]

    - 계좌 개설 및 본인 확인 (성함, 생년월일 등)

    - 세액공제 및 과세 처리를 위한 세무 정보 관리

    - 퇴직연금 자산 운용 및 상품 매매 처리


    [정보 보호 원칙]

    당사는 고객님의 금융 안전을 위해 비밀번호, 주민등록번호 전체, 카드 번호와 같은 민감 정보를 상담 과정에서 절대 요구하지 않습니다. 본인
    확인이 필요한 경우 성함과 생년월일만을 사용하여 인증을 수행합니다.


    [유의사항]

    IRP 계좌 내의 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 펀드 및 ETF 등 투자상품은 보호 대상이 아니며 원금이 보장되지
    않습니다. 모든 투자 결정의 책임은 고객님께 있으며, 당사는 적합성 원칙에 따라 고객님의 성향에 맞는 상품을 권유합니다.'
