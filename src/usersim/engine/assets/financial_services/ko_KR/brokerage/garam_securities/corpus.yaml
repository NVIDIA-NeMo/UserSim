- id: cc161cce-4b48-559e-8e52-6c8617190beb
  title: '적립식 투자: 금리·요율이 정해지는 방식과 적용'
  body: '적립식 투자는 금리가 적용되는 예금 상품이 아니라, 정기적으로 자산을 매수하는 투자 서비스입니다. 따라서 별도의 약정 금리는 존재하지
    않으며, 다음과 같은 요율 기준이 적용됩니다.


    - 적립 최소 금액: 1,000원 (서비스 이용을 위한 최소 설정 금액)

    - 거래 수수료: 투자 대상 상품(국내주식, 미국주식 등)에 설정된 가람증권의 표준 수수료율이 적용됩니다. 비대면 계좌 개설 고객에게는 경쟁력
    있는 낮은 수수료를 제공하고 있습니다.

    - 세금: 국내 상장주식 매도 시 2026년부터 코스피 0.20%, 코스닥 0.20%의 증권거래세가 적용됩니다.


    본 서비스의 비용 구조는 시스템 안정성과 최적의 거래 환경 유지를 위한 최소한의 비용으로 책정되어 있습니다.'
