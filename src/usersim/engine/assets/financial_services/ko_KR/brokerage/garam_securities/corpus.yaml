- id: 4e155500-cbd1-5db6-a205-670bd3156875
  title: '적립식 투자: 가입과 이용 조건'
  body: 'Q: 적립식 투자를 시작하려면 최소 얼마부터 설정해야 하나요?

    A: 가람증권의 적립식 투자는 적립 최소 금액 1,000원부터 설정이 가능합니다. 소액으로도 부담 없이 투자를 시작해 보십시오.


    Q: 적립식 투자의 가장 큰 장점은 무엇인가요?

    A: 정해진 금액을 정기적으로 투자함으로써 가격이 높을 때는 적게, 낮을 때는 많이 매수하게 되어 평균 매입 단가를 낮추는 효과(코스트 에버리징)를
    얻을 수 있습니다.


    Q: 누구나 가입할 수 있나요?

    A: 가람증권의 국내주식 또는 미국주식 거래 계좌를 보유하신 고객님이라면 누구나 이용 가능합니다. 상세 내용은 ''적립식 투자: 가입부터 이용까지''에서
    확인하십시오.'
