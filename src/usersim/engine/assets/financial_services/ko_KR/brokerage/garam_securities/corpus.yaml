  title: '미국주식 거래: 수수료 안내'
  body: '미국주식 거래 서비스와 관련된 수수료 및 요율은 다음과 같습니다. 모든 수수료는 시스템 안정성과 최적의 거래 환경 유지를 위한 최소
    비용으로 책정되었습니다.


    - 미국주식 거래 수수료율: 0.25%

    - 환전 수수료 우대율: 95%


    해당 요율은 비대면 계좌 개설 고객에게 적용되는 경쟁력 있는 수수료이며, 관련 법규 및 내부 정책에 따라 변경될 수 있습니다.'
