- id: 1a79f1c0-2f51-509e-8734-b6fee48734f9
  title: '미국주식 거래: 진행 중인 이벤트'
  body: '가람증권이 고객님의 성공적인 글로벌 투자를 응원하며 ''미국주식 첫걸음 이벤트''를 진행합니다.


    - 이벤트 기간: 2025년 1월 1일부터 2025년 12월 31일까지

    - 대상: 미국주식 거래 서비스를 신규로 신청하고 첫 거래를 완료하신 고객님

    - 혜택: 첫 거래 완료 시 투자 지원금 10,000원을 계좌로 지급해 드립니다.

    - 특전: 이벤트 기간 내 거래 시 기존과 동일한 95%의 환전 수수료 우대율과 0.25%의 경쟁력 있는 거래 수수료율을 계속해서 누리실 수
    있습니다.


    지금 바로 미국 시장의 우량 기업에 투자하시고 혜택을 받아 가십시오.'
