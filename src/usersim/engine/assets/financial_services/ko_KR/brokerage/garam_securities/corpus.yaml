- id: c7330776-a1f4-57b0-b5c7-0b53e94cce2f
  title: '국내주식 거래: 전환이나 상위 상품을 고려할 때'
  body: '고객님이 일반 ''국내주식 거래'' 계좌에서 절세 혜택이 있는 ''중개형 ISA''로의 전환을 고려하실 때 안내할 비교 사항입니다.


    1. 과세 방식의 차이

    - 국내주식 거래: 매매차익은 대주주가 아니면 과세되지 않으나, 배당소득에 대해 15.4%가 원천징수됩니다.

    - 중개형 ISA: 순이익 200만원(서민형 400만원)까지 비과세 혜택이 있으며, 초과분은 9.9%로 분리과세되어 절세 효과가 큽니다.


    2. 운용의 자율성

    - 국내주식 거래: 납입 한도나 의무 가입 기간 없이 자유롭게 입출금 및 거래가 가능합니다.

    - 중개형 ISA: 연간 2,000만원(총 1억원)의 납입 한도가 있으며, 3년의 의무 가입 기간을 유지해야 혜택을 받을 수 있습니다.


    단순히 개별 기업의 주식을 자유롭게 사고팔고자 하시는 분께는 ''국내주식 거래''가 적합하며, 장기적인 자산 성장과 효율적인 절세를 동시에
    추구하시는 분께는 ''중개형 ISA: 상품 개요''를 통해 ISA 전환을 추천하십시오.'
