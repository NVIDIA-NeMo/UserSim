- id: 8b368213-4c60-5150-90ea-d796d53cde0b
  title: '연금저축계좌: 진행 상황과 내역 확인'
  body: '연금저축계좌의 납입 내역과 투자 진행 상황을 확인하는 방법입니다.


    1. 내역 확인 요청: 상담원에게 연금저축계좌의 상세 거래 내역 또는 현재 잔고 확인을 요청하십시오.

    2. 본인 인증 수행: 보안을 위해 고객님의 성함과 생년월일을 말씀해 주십시오. 당사는 비밀번호나 주민등록번호 전체를 요구하지 않습니다.

    3. 상세 내역 확인: 인증이 완료되면 상담원이 현재까지의 총 납입액, 세액공제 대상 금액, 그리고 보유 중인 펀드 및 ETF의 평가 금액을
    안내해 드립니다.

    4. 결과 확인: 안내받은 금액이 고객님이 기록하신 내역과 일치하는지 확인하십시오.


    만약 안내받으신 금액이 예상과 다르다면 ''연금저축계좌: 명세서나 내역과 맞지 않을 때''를 참고하여 원인을 파악하시기 바랍니다.'
