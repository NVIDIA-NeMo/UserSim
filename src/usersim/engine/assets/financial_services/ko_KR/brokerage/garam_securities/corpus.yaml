- id: 00a52787-ec3b-5ef8-9741-3b19555d31f1
  title: '적립식 투자: 로그인하거나 접속할 수 없을 때'
  body: '적립식 투자 설정 화면에 접속할 수 없거나 로그인이 되지 않는 경우 다음과 같이 조치해 주십시오.


    [증상 및 원인]

    - 증상: 앱 접속 시 오류 메시지가 출력되거나, 적립식 투자 설정 메뉴가 보이지 않음

    - 원인: 앱 버전의 구버전 사용, 네트워크 연결 불안정, 또는 보안 정책에 따른 계좌 일시 정지


    [확인 및 해결 순서]

    1. 앱 업데이트 확인: 사용 중인 가람증권 앱이 최신 버전인지 확인하고, 업데이트가 필요하다면 진행해 주십시오.

    2. 네트워크 상태 점검: Wi-Fi 또는 모바일 데이터 연결 상태를 확인하십시오.

    3. 계좌 상태 확인: 최근 비밀번호 오류 횟수 초과 등으로 계좌가 잠겨 있지 않은지 확인하십시오.


    [해결되지 않을 경우의 조치]

    위 조치 후에도 접속이 되지 않는다면 상담원에게 요청해 주십시오. 저희가 내부 절차에 따라 계좌의 잠금 상태를 확인하고, 필요한 경우 보안
    해제 절차를 지원하여 정상적으로 이용하실 수 있도록 조치하겠습니다. 처리 결과는 알림톡 또는 앱 내 알림을 통해 안내해 드립니다.'
