- id: b737f7c5-2fc3-59e2-9c9c-33b5763c8cc5
  title: '적립식 투자: 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 자산을 보호하기 위해 보안을 최우선으로 합니다. 특히 적립식 투자 서비스는 정기적으로 자금이 이체되어 투자되는
    특성상, 이를 악용한 피싱이나 부정 거래 시도가 발생할 수 있으니 주의하시기 바랍니다.


    가람증권은 어떠한 경우에도 고객님의 계좌 비밀번호, 카드 번호, 주민등록번호 전체와 같은 민감한 정보를 전화나 메시지로 요구하지 않습니다.
    만약 가람증권을 사칭하여 이러한 정보를 요구하거나, 특정 상품의 수익을 보장하며 입금을 유도하는 연락을 받으셨다면 즉시 무시하시고 당사 고객센터로
    신고해 주십시오.


    적립식 투자 설정 내역이 본인의 의사와 다르게 변경되었거나, 예상치 못한 금액이 인출된 것이 확인될 경우 즉각적인 계좌 보호 조치가 필요합니다.
    부정 거래가 의심되는 즉시 당사에 알려주십시오. 신속한 조치를 통해 추가 피해를 막고, 관련 법규 및 내부 규정에 따라 공정하게 처리하겠습니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: ec84feeb-3d00-54c6-9969-ec2f1cc5798d
  title: '적립식 투자: 약관'
  body: '본 약관은 가람증권의 적립식 투자 서비스 이용에 관한 권리와 의무를 규정합니다.


    1. 서비스 제공 및 이용: 고객은 가람증권이 제공하는 인터페이스를 통해 정기적으로 일정 금액을 투자하는 적립식 투자 서비스를 이용할 수 있습니다.
    이때 설정 가능한 적립 최소 금액은 1,000원이며, 고객은 이 금액 이상의 금액을 설정해야 합니다.


    2. 고객의 의무: 고객은 적립 예정일에 투자 자산 매입에 필요한 충분한 예탁금을 계좌에 보유해야 합니다. 잔액 부족으로 인해 매수 주문이
    체결되지 않은 경우, 가람증권은 이에 대한 책임을 지지 않습니다.


    3. 서비스의 변경 및 해지: 고객은 언제든지 서비스 설정을 변경하거나 해지할 수 있습니다. 단, 이미 체결된 거래는 취소할 수 없으며, 해지
    신청 시점 이후의 적립 주기부터 적용됩니다.


    4. 면책 사항: 가람증권은 시스템 장애나 통신 오류 등 불가항력적인 사유로 인한 적립 지연에 대해 고의 또는 중과실이 없는 한 책임을 지지
    않습니다. 모든 투자의 판단과 책임은 고객 본인에게 있습니다.'
  domain: brokerage_investing
