- id: 124a51e9-f096-54e4-95a8-0c922dad8ee1
  title: '개인형 퇴직연금(IRP): 다른 회사의 일반적인 상품과의 비교'
  body: '가람증권의 개인형 퇴직연금(IRP)은 디지털 중심의 효율적인 비용 구조와 사용자 편의성에 집중하고 있습니다.


    - 비용 경쟁력: 많은 금융기관이 계좌 관리 수수료를 부과하는 것과 달리, 가람증권은 비대면 개설 고객에게 계좌 수수료 0원을 제공하여 투자
    진입 장벽을 낮췄습니다.

    - 투자 유연성: 전통적인 은행 IRP보다 모바일 앱을 통한 상품 전환과 포트폴리오 조정이 매우 직관적이고 신속합니다.

    - 공통 적용 사항: 연금저축 합산 세액공제 한도 9,000,000원 및 연금계좌 총 납입 한도 18,000,000원은 관련 법령에 따라 모든
    금융회사가 동일하게 적용합니다.


    종합적인 비용 절감과 디지털 인터페이스의 편의성을 중시하신다면 가람증권이 유리하며, 오프라인 지점의 대면 상담이 필수적이신 분은 전통적인 금융기관이
    더 적합할 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 4c91efb3-af3f-580b-b651-7751e76d8af7
  title: '개인형 퇴직연금(IRP): 위험 안내'
  body: '개인형 퇴직연금(IRP) 가입 전 다음의 위험 요소를 반드시 확인하십시오.


    1. 원금 비보장: IRP 계좌를 통해 투자하는 펀드, ETF 등의 투자상품은 예금자보호법의 보호 대상이 아니며, 시장 상황에 따라 원금 손실이
    발생할 수 있습니다. 투자 판단의 책임은 고객 본인에게 있습니다.

    2. 예금자 보호 한도: 계좌 내 현금성 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 그 이상의 금액이나 투자 상품은 보호되지
    않습니다.

    3. 유동성 위험: 본 상품은 노후 준비를 위한 장기 투자 상품입니다. 만 55세 이전 중도 해지 시에는 그동안 받은 세액공제 혜택을 반납하는
    성격의 기타소득세 16.5%가 부과되어 실질 수익률이 낮아질 수 있습니다.

    4. 적합성 원칙: 가람증권은 고객의 투자 성향을 고려하여 상품을 추천하지만, 이것이 반드시 수익을 보장하는 것은 아닙니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 71eaf825-f8b0-526e-980e-029a3a82205c
  title: '개인형 퇴직연금(IRP): 금리·요율이 정해지는 방식과 적용'
  body: '개인형 퇴직연금(IRP)에 적용되는 주요 요율 및 세제 적용 방식은 다음과 같습니다.


    1. 계좌 관리 수수료: 비대면 계좌 개설 시 0원이 적용됩니다.

    2. 세액공제율: 총급여 5,500만원 이하인 경우 16.5%, 5,500만원을 초과하는 경우 13.2%의 세율로 공제됩니다.

    3. 연금소득세: 만 55세 이후 연금으로 수령 시, 수령 나이에 따라 5.5%, 4.4%, 3.3%의 저율 과세가 적용됩니다.

    4. 기타소득세: 연금 외 형태로 중도 인출하거나 해지할 경우 16.5%의 세율이 적용됩니다.

    5. 과세 선택: 사적연금 소득이 연 1,500만원을 초과하는 경우, 종합과세와 16.5% 분리과세 중 고객이 유리한 방식을 선택할 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: rate_sheet
  source_authority: official
