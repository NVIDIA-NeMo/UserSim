- id: 36537eb1-7c07-52f5-8a7a-3f28e0c3b01b
  title: '국내주식 거래: 가입부터 이용까지'
  body: '본 문서는 고객 응대 담당자가 국내주식 거래 서비스의 전 과정을 안내하기 위한 가이드입니다.


    1. 가입 및 계좌 개설

    고객님은 모바일 앱을 통해 비대면으로 국내주식 거래 계좌를 개설하실 수 있습니다. 신분증 확인과 본인 인증 과정을 거치면 즉시 개설됩니다.


    2. 서비스 이용 절차

    - 입금: 개설된 계좌로 투자 금액을 입금합니다.

    - 종목 선택: 코스피 및 코스닥 시장의 상장 기업을 검색합니다.

    - 주문: 매수/매도 수량과 가격을 설정하여 주문을 제출합니다.


    3. 주요 비용 체계

    - 거래 수수료: 국내주식 거래 수수료율(모바일) 0.015%가 적용됩니다.

    - 증권거래세: 매도 시 증권거래세율(코스피, 농어촌특별세 포함) 0.2% 및 증권거래세율(코스닥) 0.2%가 부과됩니다.


    4. 핵심 유의사항

    - 적합성 원칙: 고객의 투자 성향에 맞는 상품 권유가 이루어져야 합니다.

    - 원금 비보장: 주식 투자는 원금 손실 가능성이 있으며, 예금자보호법에 따른 보호 대상이 아님을 명시하십시오.

    - 예탁금 보호: 투자 상품을 제외한 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다.


    더 자세한 비용 정보는 ''국내주식 거래: 수수료 안내''를 참고하십시오.'
