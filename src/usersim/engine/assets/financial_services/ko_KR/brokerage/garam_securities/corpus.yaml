- id: b55eae20-fd92-535d-bd4f-27ef506a7bf4
  title: '미국주식 거래: 안전한 이용을 위한 수칙'
  body: '미국주식 거래 이용 고객님의 소중한 자산을 보호하기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 가람증권은 어떠한 경우에도 고객님의 비밀번호, 카드 번호, 주민등록번호 전체를 요구하지 않습니다. 특히 해외 거래소나 미국 증권사 관계자를
    사칭하여 민감 정보를 요구하는 경우 즉시 의심하십시오.


    2. 본인 인증 절차 안내

    계좌 정보 변경 등 상태 변경 작업 전, 저희는 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 이 외의 다른 수단으로 개인정보를
    요구하지 않습니다.


    3. 부정 거래 의심 시 조치

    비정상적인 로그인 시도나 의심스러운 거래 내역이 발견되면 즉시 고객센터를 통해 계좌 보호 조치를 요청하십시오. 부정 거래 의심 신고는 인지
    즉시 처리하시는 것이 피해 최소화에 가장 중요합니다.


    4. 주의 사항

    출처가 불분명한 링크(URL)를 통해 앱 설치를 유도하거나, 고수익을 보장하며 특정 종목 매수를 권유하는 메시지는 피싱일 가능성이 매우 높으니
    주의하십시오.'
