- id: 06da3fe8-6916-57db-a246-74adcb4d1393
  title: get_order_status 사용 기준
  body: '고객이 현재 진행 중인 주문의 상태나 내역 확인을 요청할 경우, 상담원은 다음 절차에 따라 안내하십시오.


    1. 본인 인증 수행: verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하여 본인 인증을 완료하십시오.

    2. 주문 상태 조회: get_order_status 도구를 호출합니다. 이때 특정 주문의 상태만 확인하려는 경우 해당 order_id를 입력하고,
    전체 주문 목록을 확인하려는 경우에는 인자 없이 호출하십시오.

    3. 정보 분석: 도구로부터 반환된 결과에서 주문 번호(order_id), 종목명(security), 현재 상태(status)를 확인합니다.

    4. 고객 안내: 확인된 내용을 바탕으로 고객에게 현재 주문이 체결 대기 중인지, 혹은 이미 체결되었는지 등을 상세히 설명하십시오.


    조회 도구의 정확한 작동 방식은 ''get_order_status 도구 설명서''에서 확인할 수 있습니다.'
