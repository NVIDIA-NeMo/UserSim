- id: 563ad36e-d1e9-5ca3-a0d7-194924291635
  title: '연금저축계좌: 로그인하거나 접속할 수 없을 때'
  body: '연금저축계좌 이용을 위해 앱 또는 온라인 서비스에 접속하려 할 때 로그인이 되지 않는 경우의 해결 방법입니다.


    [증상]

    - 로그인 버튼을 눌러도 반응이 없거나 ''아이디/비밀번호가 일치하지 않는다''는 오류 메시지가 출력됨

    - 계좌 접속 시 ''인증 제한 계좌'' 혹은 ''잠김 상태''라는 안내가 나타남


    [원인 및 확인 순서]

    1. 입력 정보 확인: 대소문자 구분이나 오타가 없는지 확인하십시오.

    2. 계정 상태 확인: 비밀번호 5회 연속 오류 등으로 인해 계정이 잠겼는지 확인하십시오.

    3. 네트워크 상태 확인: 현재 인터넷 연결이 안정적인지 확인하십시오.


    [해결 방법]

    - 비밀번호를 잊으신 경우, 본인 인증 절차(성함 및 생년월일 확인)를 통해 비밀번호 재설정을 진행하십시오.

    - 계정이 잠긴 경우, 본인 확인 후 잠금 해제 요청을 하십시오.


    [에스컬레이션]

    위의 조치 후에도 접속이 불가능한 경우, 가람증권 내부 절차에 따라 전문 기술팀으로 케이스를 이관하여 해결합니다. 이 경우 처리 상황을 고객님께
    실시간으로 안내해 드리겠습니다.'
