- id: a7d0e14e-c7fc-5be1-9498-d01d1a2fba8d
  title: '국내주식 거래: 당사의 비슷한 상품과의 비교'
  body: '가람증권의 국내주식 거래 서비스와 중개형 ISA를 비교하여 안내해 드립니다.


    **국내주식 거래 (일반 계좌)**

    - 특징: 가장 기본적인 주식 투자 서비스로, 제약 없이 자유로운 입출금이 가능합니다.

    - 비용: 국내주식 거래 수수료율(모바일) 0.015%가 적용됩니다.

    - 과세: 매도 시 증권거래세(0.2%)가 부과되며, 배당소득에 대해 15.4%가 원천징수됩니다.

    - 추천: 단기 투자나 자금 운용의 유연성을 중요하게 생각하시는 고객님께 적합합니다.


    **중개형 ISA**

    - 특징: 절세 혜택을 제공하는 만능 계좌로, 의무 가입 기간(3년)이 존재합니다.

    - 비용: 상품별 수수료 체계가 적용됩니다.

    - 과세: 순이익에 대해 비과세 및 분리과세 혜택을 받을 수 있어 일반 계좌보다 세금 부담이 적습니다.

    - 추천: 중장기적으로 자산을 증식하며 세금 혜택을 극대화하시려는 고객님께 적합합니다.


    상세 내용은 ''중개형 ISA: 상품 개요''를 참고하십시오.'
  domain: brokerage_investing
  product_category: garam_domestic_stock
