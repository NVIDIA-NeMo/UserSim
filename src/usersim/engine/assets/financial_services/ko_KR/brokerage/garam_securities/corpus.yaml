- id: 7e1f7fe8-be2e-5647-a631-cdd7a50e9aac
  title: '연금저축계좌: 상품 고르는 방법'
  body: '노후 준비를 위해 연금저축계좌와 IRP 중 고민 중이시라면 다음 기준을 참고하십시오.


    연금저축계좌는 세액공제 대상 납입 한도가 6,000,000원으로 IRP보다 낮지만, 중도 인출 조건이 상대적으로 유연하여 자금 운용의 편의성이
    높습니다.


    반면, ''개인형 퇴직연금(IRP): 상품 개요''에서 확인하실 수 있는 IRP는 예금을 담을 수 있고, 연금저축과 합산하여 최대 9,000,000원까지
    세액공제를 받을 수 있어 절세 극대화에 유리합니다.


    따라서 유동성을 중시하신다면 연금저축계좌를, 최대의 세액공제 혜택과 안정적인 예금 자산 편입을 원하신다면 IRP를 추천드립니다. 두 상품을
    함께 활용하여 연금계좌 연간 납입 한도인 18,000,000원을 전략적으로 운용하시는 것이 가장 효율적입니다.'
  domain: brokerage_investing
