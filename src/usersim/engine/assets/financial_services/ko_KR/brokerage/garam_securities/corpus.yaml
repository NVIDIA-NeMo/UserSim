- id: 67983163-530d-564e-9af5-65d2a6755de8
  title: '적립식 투자: 가입과 이용 시작'
  body: '가람증권의 적립식 투자를 통해 체계적인 자산 관리를 시작하는 방법입니다. 시작 전, 가람증권의 비대면 계좌가 개설되어 있어야 하며
    투자할 자금이 예탁금으로 입금되어 있는지 확인하십시오.


    1. 본인 확인 절차: 상담원에게 적립식 투자 설정을 요청하시면, 정확한 처리를 위해 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다.

    2. 투자 종목 및 주기 선택: 투자하고자 하는 국내외 주식 또는 ETF 종목을 말씀하시고, 매일, 매주, 매월 중 원하는 적립 주기를 선택하십시오.

    3. 금액 설정: 적립할 금액을 결정하여 알려주십시오. 이때 적립 최소 금액 1,000원 이상으로 설정하셔야 합니다.

    4. 설정 확인 및 완료: 가람증권에서 설정된 종목, 주기, 금액을 다시 한번 안내해 드립니다. 내용이 정확함을 확인하시면 적립식 투자 설정이
    완료됩니다.


    설정이 완료되면 지정하신 주기마다 자동으로 매수가 진행되며, 거래 내역은 앱의 투자 내역 메뉴에서 실시간으로 확인하실 수 있습니다.'
