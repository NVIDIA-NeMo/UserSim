- id: 768d2a24-f525-5408-8bc5-423299ec8788
  title: '개인형 퇴직연금(IRP): 가입과 이용 시작'
  body: '개인형 퇴직연금(IRP) 계좌를 개설하고 이용하는 절차를 안내해 드립니다.


    [가입 전 준비사항]

    본인 확인을 위해 고객님의 성함과 생년월일 확인이 필요합니다.


    [가입 및 이용 단계]

    1. 계좌 개설 요청: 상담원에게 개인형 퇴직연금(IRP) 계좌 개설을 요청하십시오.

    2. 본인 인증: 요청하신 성함과 생년월일을 통해 본인 확인 절차를 진행합니다.

    3. 계좌 개설 완료: 인증이 완료되면 계좌 수수료(비대면 개설) 0원이 적용된 계좌가 생성되며, 개설 완료 안내를 받으시게 됩니다.

    4. 자금 납입: 연금계좌 연간 납입 한도인 18,000,000원 범위 내에서 원하는 금액을 입금하십시오.

    5. 상품 선택: 예금, 펀드, 국내 상장 ETF 등 투자 성향에 맞는 상품을 선택하여 운용하십시오. (단, 개별 주식 투자는 불가합니다.)


    정상적으로 계좌가 개설되면 앱 내 계좌 목록에서 확인 가능하며, 납입하신 금액에 따라 연금저축과 IRP를 합한 세액공제 대상 납입 한도인 9,000,000원까지
    세액공제 혜택을 준비하실 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: how_to_guide
  source_authority: official
