- id: 1fe4d281-140d-5020-81d1-41a5c71ac9e3
  title: '국내주식 거래: 거래가 거절되거나 제한되었을 때'
  body: '국내주식 매수 또는 매도 주문이 거절되거나 제한되는 경우, 다음의 원인을 확인해 보시기 바랍니다.


    1. 증거금 부족 (매수 시)

    - 증상: ''잔고 부족'' 메시지와 함께 주문이 거절됩니다.

    - 확인: 주문하려는 금액과 거래 수수료 0.015%를 합산한 금액보다 계좌 내 예탁금이 적은지 확인하십시오.

    - 해결: 부족한 금액만큼 예탁금을 추가로 입금하십시오.


    2. 시장 운영 시간 외 주문

    - 증상: 주문이 즉시 체결되지 않거나 예약 주문으로 접수됩니다.

    - 확인: 한국 거래소의 정규 시장 운영 시간 내에 주문을 넣으셨는지 확인하십시오.


    3. 적합성 원칙에 따른 제한

    - 증상: 특정 상품이나 거래 방식에 대해 제한 안내가 나타납니다.

    - 확인: 고객님의 투자 성향 분석 결과가 해당 거래의 위험도와 맞지 않는 경우 발생할 수 있습니다.

    - 해결: 투자 성향 설문을 최신 정보로 업데이트하시거나 상담원을 통해 적합성 원칙에 대해 안내받으십시오.


    위의 사항을 확인했음에도 문제가 지속된다면, 저희가 내부 절차에 따라 단계적으로 에스컬레이션하여 전문 처리 팀의 도움을 받아 해결해 드리겠습니다.'
