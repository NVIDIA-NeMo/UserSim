- id: ba3d68ad-2065-5512-8f29-b4b08a246d2d
  title: '개인형 퇴직연금(IRP): 추천·장기 이용 혜택'
  body: '가람증권과 함께 든든한 노후를 준비하십시오. 지금 비대면으로 개인형 퇴직연금(IRP) 계좌를 개설하시는 모든 고객님께 계좌 수수료
    0원 혜택을 제공합니다.


    본 혜택은 디지털 중심의 효율적인 비용 구조를 통해 고객님의 투자 진입 장벽을 낮추고자 상시 제공되는 서비스입니다. 장기적인 자산 성장을 지원하는
    가람증권의 전문적인 글로벌 투자 서비스와 함께 세액공제 혜택을 누리시기 바랍니다.'
