- id: 52b83fc9-0494-5feb-a957-05534dffe3be
  title: '중개형 ISA: 상품 개요'
  body: '중개형 ISA는 비과세와 분리과세 혜택을 통해 국내 주식과 ETF 등에 효율적으로 투자할 수 있는 절세 만능 계좌입니다. 개인 투자자의
    자산 성장을 돕기 위해 설계되었으며, 다음과 같은 핵심 조건을 제공합니다.


    - 납입 한도: 연간 납입 한도는 20,000,000원이며, 총 납입 한도는 100,000,000원까지 가능합니다. 사용하지 않은 연간 납입
    한도는 다음 해로 이월됩니다.

    - 세제 혜택: 수익에 대해 비과세 한도(일반형) 2,000,000원 또는 비과세 한도(서민형) 4,000,000원까지 세금이 부과되지 않습니다.
    비과세 한도를 넘는 순이익의 분리과세율(지방소득세 포함)은 9.9%가 적용되어 세금 부담을 낮췄습니다.

    - 유지 조건: 의무가입기간(년)은 3년입니다.


    본 상품은 가람증권의 비대면 계좌 개설 프로세스를 통해 경쟁력 있는 낮은 수수료로 이용하실 수 있습니다. 투자자 보호를 위해 적합성 원칙을
    엄격히 준수하며, 고객님의 투자 성향에 맞는 상품 운용을 지원합니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
