  title: '미국주식 거래: 이 상품을 사칭한 사기 주의'
  body: '최근 가람증권의 미국주식 거래 서비스를 사칭하여 ''원금 보장'' 및 ''고수익 확약''을 미끼로 투자를 유도하는 사기 사례가 보고되고
    있습니다. 가람증권은 어떠한 경우에도 특정 종목의 수익을 보장하거나, 개인적인 메신저를 통해 투자금 송금을 요구하지 않습니다. 특히 미국주식
    거래는 투자 상품의 특성상 원금이 보장되지 않으며, 시장 상황에 따라 손실이 발생할 수 있음을 명심하십시오.


    가람증권은 고객님의 안전을 위해 계좌 정보 변경 등의 작업 전 성함과 생년월일을 통해 본인 확인을 수행합니다. 하지만 카드 번호, 계좌 비밀번호,
    주민등록번호 전체와 같은 민감한 정보는 절대 요구하지 않습니다. 만약 이러한 정보를 요구하거나 가람증권 직원을 사칭하여 비정상적인 거래를 유도하는
    연락을 받으셨다면, 즉시 상담원에게 알려주십시오. 부정 거래 의심 시 즉각적인 계좌 보호 조치를 통해 고객님의 소중한 자산을 보호하겠습니다.'
