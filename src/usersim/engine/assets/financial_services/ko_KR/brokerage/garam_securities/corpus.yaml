    0.015%가 적용됩니다. 수수료는 최적의 거래 환경 유지와 시스템 안정성을 위한 최소 비용으로 책정됩니다.


    2. 세금 납부 의무: 주식 매도 시 관련 법령에 따라 증권거래세가 부과됩니다. 코스피 종목은 증권거래세와 농어촌특별세를 포함하여 0.2%,
    코스닥 종목은 0.2%의 세율이 적용됩니다. 배당소득에 대해서는 15.4%가 원천징수됩니다.


    3. 투자 위험 및 책임: 본 서비스는 원금이 보장되지 않는 투자 상품입니다. 투자 결과에 따른 손실 책임은 고객 본인에게 있으며, 당사는
    적합성 원칙에 따라 고객의 투자 성향을 고려한 상품 정보를 제공합니다.


    4. 계좌 보호 및 예금자 보호: 고객의 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 다만, 주식 및 펀드 등 투자 상품은 보호
    대상이 아닙니다.


    5. 계약의 종료: 고객은 언제든지 계좌 해지를 요청할 수 있으며, 당사는 내부 규정에 따라 이를 처리합니다.'
