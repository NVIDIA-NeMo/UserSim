  title: '개인형 퇴직연금(IRP): 로그인하거나 접속할 수 없을 때'
  body: '개인형 퇴직연금(IRP) 관리 화면이나 앱 접속에 어려움을 겪으시는 경우, 다음 순서에 따라 조치해 보시기 바랍니다.


    [증상: 로그인이 되지 않거나 접속 오류 메시지가 발생함]


    1. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오.

    2. 계정 정보 재확인: 입력하신 아이디와 비밀번호에 오타가 없는지 확인하십시오.

    3. 앱 업데이트 확인: 사용 중인 가람증권 앱이 최신 버전인지 확인하고, 필요 시 업데이트를 진행하십시오.


    [해결 방법]

    - 비밀번호를 잊으신 경우, ''비밀번호 재설정'' 기능을 통해 본인 인증 후 새로운 비밀번호를 설정하십시오.

    - 지속적인 접속 오류 발생 시, 앱을 완전히 종료한 후 다시 실행하거나 기기를 재부팅 하십시오.


    [에스컬레이션]

    위의 조치 후에도 접속이 불가능한 경우, 상담원에게 오류 메시지 내용을 전달하십시오. 당사 기술 지원 팀에서 계정 상태를 점검하고 조치 결과를
    안내해 드리겠습니다.'
