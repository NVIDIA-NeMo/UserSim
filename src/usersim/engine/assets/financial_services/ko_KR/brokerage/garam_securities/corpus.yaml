- id: a078ce06-0af9-53a4-b392-701c55aba674
  title: '중개형 ISA: 전환이나 상위 상품을 고려할 때'
  body: '중개형 ISA에서 연금 계좌로의 전환을 고려하시는 경우, 목적에 따른 선택이 필요합니다.


    중개형 ISA는 3년의 의무가입기간을 통해 중단기 자산 형성과 절세를 동시에 추구하는 상품입니다. 반면 ''연금저축계좌: 상품 개요''나 ''개인형
    퇴직연금(IRP): 상품 개요''는 노후 자금 준비를 위한 장기 투자 상품으로 세액공제 혜택이 더 강력합니다.


    특히 중개형 ISA 만기 자금을 60일 이내에 연금계좌로 옮기시면, 옮긴 금액의 10%(최대 300만원)까지 추가로 세액공제를 받으실 수 있어
    매우 유리합니다.


    - 중단기 절세 및 유연한 운용을 원하시면: 중개형 ISA 유지

    - 노후 준비 및 추가 세액공제를 원하시면: 연금계좌로의 전환을 추천드립니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 040b3261-12d8-583e-83bc-b1e565220878
  title: '중개형 ISA: 다른 상품과의 비교와 맞지 않는 경우'
  body: '중개형 ISA는 강력한 절세 혜택을 제공하지만, 모든 투자자에게 최적의 선택은 아닐 수 있습니다. 다음의 경우 다른 상품을 고려하시기
    바랍니다.


    1. 단기 자금 사용이 필요한 경우

    중개형 ISA는 의무가입기간이 3년입니다. 이 기간 내에 중도 해지할 경우 그동안 받은 세제 혜택이 환수될 수 있으므로, 3년 이내에 사용해야
    할 자금은 일반 주식 계좌인 ''국내주식 거래: 상품 개요''를 이용하시는 것이 적절합니다.


    2. 금융소득종합과세 대상자인 경우

    직전 3년 중 한 번이라도 금융소득종합과세 대상이었던 분들은 법령에 따라 중개형 ISA 가입이 불가능합니다.


    3. 즉각적인 세액공제가 최우선인 경우

    납입 즉시 세액공제를 받고 싶으시다면 중개형 ISA보다는 ''연금저축계좌: 상품 개요''나 ''개인형 퇴직연금(IRP): 상품 개요''가 더
    적합합니다.


    중개형 ISA는 국내 상장주식, ETF, 펀드 등을 통해 운용하며 순이익의 2,000,000원(서민형 4,000,000원)까지 비과세를 받는
    것이 핵심인 상품입니다. 고객님의 투자 목적이 ''중기적 자산 성장과 절세''에 부합하는지 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: bf623fba-e705-516b-a2ce-dd58643c0cf9
  title: '중개형 ISA: 비과세 한도를 넘는 순이익의 분리과세율(지방소득세 포함) 안내'
  body: '질문: 중개형 ISA에서 비과세 한도를 초과하여 발생한 수익에는 어떤 세율이 적용됩니까?


    답변: 비과세 한도(일반형 2,000,000원, 서민형 4,000,000원)를 넘는 순이익에 대해서는 비과세 한도를 넘는 순이익의 분리과세율(지방소득세
    포함)인 9.9%가 적용됩니다. 이는 일반적인 금융상품의 배당소득세율(15.4%)보다 낮은 세율로, 초과 수익에 대해서도 절세 혜택을 누리실
    수 있습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: faq
  source_authority: official
