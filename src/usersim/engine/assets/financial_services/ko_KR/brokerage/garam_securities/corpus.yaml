- id: 4e32f461-6974-5cf2-b3b5-1c3e6f266dfa
  title: '연금저축계좌: 개인정보 처리 안내'
  body: '가람증권은 관련 법령에 따라 고객님의 개인정보를 안전하게 처리하며, 이를 위해 다음과 같이 안내드립니다.


    1. 수집 및 이용 목적: 연금저축계좌의 개설, 유지, 관리 및 금융위원회와 금융감독원의 감독 기관 보고, 그리고 세액공제 증빙을 위한 국세청
    신고 목적으로 개인정보를 처리합니다.


    2. 처리하는 항목: 본인 확인을 위한 성함, 생년월일 및 계좌 관리를 위한 연락처, 주소, 세액공제 적용을 위한 소득 수준 등의 정보를 수집합니다.


    3. 본인 인증 절차: 계좌 정보 변경이나 주요 업무 처리 전, 가람증권은 반드시 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다.
    이 과정에서 주민등록번호 전체나 비밀번호를 요구하지 않음을 명시합니다.


    4. 정보의 보유 및 이용 기간: 금융거래 관계가 종료된 후에도 자본시장법 및 관련 법령에 따라 일정 기간 정보를 보관하며, 보존 기간이 종료된
    후에는 안전하게 파기합니다.


    5. 고객의 권리: 고객님께서는 언제든지 본인의 개인정보 조회 및 수정, 삭제를 요청하실 수 있습니다. 관련 요청은 고객센터를 통해 접수해
    주시기 바랍니다.'
