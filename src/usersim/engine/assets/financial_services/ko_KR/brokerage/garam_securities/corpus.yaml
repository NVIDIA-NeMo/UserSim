- id: 54d2a374-513a-5ee4-9943-8bbfbd15b22b
  title: '적립식 투자: 이런 분께 알맞습니다'
  body: '가람증권의 적립식 투자는 소액으로 꾸준히 자산을 형성하고 싶은 개인 투자자분들을 위한 최적의 서비스입니다. 다음과 같은 분들께 추천드립니다.


    - 투자 타이밍을 잡는 것이 어렵게 느껴지시는 분: 정기적으로 일정 금액을 투자함으로써 매입 단가를 낮추는 효과(Cost Averaging)를
    통해 시장 변동성 위험을 완화할 수 있습니다.

    - 소액으로 투자를 시작하고 싶으신 분: 적립 최소 금액이 1,000원으로 매우 낮아, 큰 부담 없이 적은 금액부터 투자의 습관을 기르실 수
    있습니다.

    - 장기적인 관점에서 자산 성장을 추구하시는 분: 일시적인 가격 변동에 흔들리지 않고 꾸준히 수량을 늘려가며 미래를 준비하고자 하는 분께 적합합니다.


    가람증권은 고객님의 재산 상황, 투자 경험 및 목적에 적합한 상품을 권유하는 적합성 원칙을 엄격히 준수합니다. 다만, 적립식 투자 역시 투자
    상품이므로 원금이 보장되지 않으며, 시장 상황에 따라 손실이 발생할 수 있음을 유의하십시오.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 8b528e03-aacc-5b65-be74-49bac2df34fb
  title: '적립식 투자: 수수료와 비용'
  body: '질문: 적립식 투자를 이용할 때 별도의 서비스 이용료가 있습니까?

    답변: 아니요, 적립식 투자 서비스 자체에 대한 별도의 이용료는 없습니다. 다만, 적립식 투자를 통해 매수하는 개별 주식이나 ETF 등의 상품에
    대해서는 기존의 거래 수수료가 동일하게 적용됩니다.


    질문: 최소 얼마부터 적립 투자가 가능합니까?

    답변: 적립식 투자의 적립 최소 금액은 1,000원입니다. 1,000원 이상의 금액부터 자유롭게 설정하여 투자를 시작하실 수 있습니다.'
