- id: 32f1ef43-e7e3-58d9-9774-71ca4b4e03b9
  title: '개인형 퇴직연금(IRP): 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 IRP 계좌의 잔액이나 납입 내역이 명세서와 일치하지 않을 때, 상담원은 다음 순서로 점검하십시오.


    증상: 고객이 제시하는 입금 내역과 시스템상의 잔액이 다르거나, 세액공제 한도가 잘못 표기되었다고 주장함


    점검 및 조치 순서:

    1. 거래 반영 시점 확인: 펀드나 ETF의 경우 매수/매도 체결 및 결제일까지 시차가 발생합니다. 거래일과 결제일의 차이로 인해 일시적으로
    내역이 다르게 보일 수 있음을 안내하십시오.

    2. 세액공제 한도 합산 확인: 고객님이 다른 금융기관의 연금저축계좌를 보유하고 있는지 확인하십시오. 연금저축과 IRP를 합산한 세액공제 대상
    납입 한도는 9,000,000원이므로, 타사 납입액이 포함되어 한도가 낮게 보일 수 있습니다.

    3. 원천징수 및 수수료 확인: 인출 발생 시 16.5%의 기타소득세가 차감되었는지, 또는 상품별 운용 보수가 반영되었는지 확인하십시오.


    해결 방안:

    - 단순 시차 문제인 경우 결제 예정일을 안내하여 종결합니다.

    - 시스템 오류가 의심되거나 계산 방식에 논란이 있는 경우, 고객의 성함과 생년월일을 재확인한 후 상세 거래 로그를 추출하여 내부 회계 처리
    팀으로 에스컬레이션하십시오. 처리 결과는 영업일 기준 3~5일 이내에 고객에게 안내됩니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 444f8db1-fb83-5baf-a169-3f547f80d53e
  title: '국내주식 거래: 상품 개요'
  body: '가람증권의 국내주식 거래 서비스는 코스피와 코스닥 시장의 기업에 직접 투자하여 자산 성장을 도모할 수 있는 기본 거래 서비스입니다.
    디지털 중심의 효율적인 비용 구조를 통해 개인 투자자분들께 경쟁력 있는 투자 환경을 제공합니다.


    주요 비용 및 요율은 다음과 같습니다. 모바일 앱을 통한 거래 시 국내주식 거래 수수료율(모바일)은 0.015%가 적용됩니다. 매도 시 발생하는
    증권거래세율(코스피, 농어촌특별세 포함)은 0.2%이며, 증권거래세율(코스닥) 또한 0.2%가 적용됩니다.


    투자자 보호를 위해 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 다만, 국내주식과 같은 투자상품은 예금자보호 대상이 아니며 원금이
    보장되지 않습니다. 모든 거래는 고객님의 투자 성향을 고려한 적합성 원칙을 바탕으로 수행됩니다.


    상세한 수수료 항목은 ''국내주식 거래: 수수료 안내''에서 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_domestic_stock
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 0742ef96-0031-5957-b9bd-018fa97ca21c
  title: '국내주식 거래: 국내주식 거래 수수료율(모바일) 안내'
  body: 'Q: 가람증권 모바일 앱으로 국내주식을 거래할 때 적용되는 수수료는 얼마입니까?

    A: 가람증권의 국내주식 거래 수수료율(모바일)은 0.015%입니다. 이는 비대면 계좌 개설 고객님께 제공되는 경쟁력 있는 낮은 수수료로,
    투자 진입 장벽을 낮추기 위해 책정되었습니다.


    Q: 수수료 외에 추가로 발생하는 비용이 있습니까?

    A: 주식을 매도하실 때 증권거래세가 발생합니다. 코스피와 코스닥 종목 모두 0.2%의 세율이 적용됩니다. 자세한 내용은 ''국내주식 거래:
    수수료 안내''를 참고해 주십시오.'
  domain: brokerage_investing
  product_category: garam_domestic_stock
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: e5977c6c-eef4-549e-bdc9-6004900908e4
  title: '국내주식 거래: 가입과 이용 시작'
  body: '가람증권의 국내주식 거래 서비스를 이용하시기 위한 절차를 안내해 드립니다. 본 서비스는 모바일 앱을 통해 쉽고 빠르게 시작하실 수
    있습니다.


    1. 본인 인증 수행: 상담원에게 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되면 계좌 개설 단계로 진행합니다.

    2. 비대면 계좌 개설: 가람증권 앱을 통해 계좌 개설 신청을 완료하십시오. 비대면 계좌 개설 시 0.015%의 낮은 국내주식 거래 수수료율(모바일)
    혜택을 받으실 수 있습니다.

    3. 투자 자금 입금: 개설된 계좌로 투자하실 금액을 입금하십시오. 입금된 예탁금은 1인당 1억원까지 예금보험공사에서 보호합니다.

    4. 종목 선택 및 거래: 코스피 또는 코스닥 시장의 원하는 종목을 선택하여 매수 주문을 제출하십시오.


    정상적으로 계좌가 개설되면 앱 내 마이페이지에서 계좌 상태가 ''활성화''로 표시되는 것을 확인하실 수 있습니다. 상품의 상세 특징은 ''국내주식
    거래: 상품 개요''를 통해 확인해 보십시오.'
