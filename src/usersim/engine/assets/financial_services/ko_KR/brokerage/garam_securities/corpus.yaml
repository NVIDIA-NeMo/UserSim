- id: a38a5210-52bf-5ff9-93db-c685c800aa2d
  title: '국내주식 거래: 등록 정보 변경'
  body: '국내주식 거래 계좌의 연락처, 주소 등 등록 정보를 변경하는 방법입니다.


    준비 사항: 본인 명의의 스마트폰 및 변경할 최신 정보


    1. 본인 확인: 상담원에게 본인의 성함과 생년월일을 말씀해 주십시오. 당사는 이를 통해 고객님의 본인 여부를 확인합니다.

    2. 변경 요청: 변경하고자 하는 정보(예: 전화번호, 이메일 주소, 거주지 주소 등)와 정확한 변경 내용을 말씀해 주십시오.

    3. 정보 검증: 상담원이 요청하신 변경 사항을 복창하여 확인하며, 필요한 경우 추가 인증 절차를 진행합니다.

    4. 변경 완료 확인: 정보 수정이 완료되면 상담원이 변경 완료 사실을 안내해 드립니다. 이후 모바일 앱의 ''내 정보'' 메뉴에서 변경된
    내용이 올바르게 반영되었는지 직접 확인하실 수 있습니다.


    주의: 주민등록번호 전체나 계좌 비밀번호 등 민감한 정보는 변경 과정에서 절대 요구하지 않습니다.'
