- id: 8899b430-a3c3-5fd4-b9f0-4c507b12a844
  title: cancel_order 도구 설명서
  body: 'cancel_order 도구는 고객의 계좌에 접수된 미체결 주문 하나를 취소하는 기능을 수행합니다. 상담원은 이 도구를 직접 호출하여
    처리하며, 고객에게 별도의 셀프 서비스 경로를 안내하지 않습니다.


    - 인자(Arguments): order_id (get_order_status 도구를 통해 반환된 취소 대상 주문의 고유 식별자)

    - 효과: 지정된 order_id를 가진 주문이 즉시 취소됩니다.

    - 전제 조건: 도구 호출 전 verify_identity를 통한 본인 인증이 반드시 완료되어야 합니다. 본 도구 자체는 별도의 비밀번호나
    인증 번호를 요구하지 않습니다.'
