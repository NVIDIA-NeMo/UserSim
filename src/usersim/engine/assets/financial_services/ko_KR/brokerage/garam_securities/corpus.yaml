  institution_id: garam_securities
- id: 3d986a24-0700-5859-bc98-f36a238e227f
  title: '중개형 ISA: 연간 납입 한도 안내'
  body: 'Q: 중개형 ISA의 연간 납입 한도는 얼마이며, 한도가 남으면 어떻게 되나요?


    A: 중개형 ISA의 연간 납입 한도는 20,000,000원입니다. 해당 연도에 납입하지 못하고 남은 한도는 사라지지 않고 다음 해로 이월되어
    사용할 수 있습니다. 예를 들어, 첫해에 5,000,000원만 납입하셨다면 다음 해에는 이월된 한도를 포함해 최대 35,000,000원까지
    납입이 가능합니다.


    납입 한도와 관련된 더 자세한 내용은 ''중개형 ISA: 상품 개요''에서 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 7fb8d353-bd25-54c4-a639-94fb4e7fa31b
  title: '중개형 ISA: 가입과 이용 시작'
  body: '가람증권의 중개형 ISA 가입 절차를 안내해 드립니다. 본 계좌는 비대면으로 간편하게 개설하여 즉시 투자를 시작하실 수 있습니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 계좌 개설 단계로 진입할 수 있습니다.

    2. 투자 성향 분석: 적합성 원칙에 따라 고객님의 재산 상황, 투자 경험, 목적을 확인하는 설문을 진행합니다. 이 과정은 고객님께 가장 적합한
    투자 환경을 제공하기 위함입니다.

    3. 약관 동의 및 유형 선택: 일반형 또는 서민형 중 본인에게 해당하는 가입 유형을 선택하고 상품 약관에 동의하십시오.

    4. 계좌 개설 완료: 모든 정보가 확인되면 중개형 ISA 계좌 개설이 완료됩니다. 이제 국내 상장주식, ETF, 펀드 등에 투자를 시작하실
    수 있습니다.


    개설 후 납입 한도 관리나 세제 혜택에 대해 궁금하신 점은 ''중개형 ISA: 상품 개요''를 참고하시기 바랍니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: e39d26eb-77cc-59f1-a136-9a38411efa05
  title: '중개형 ISA: 수수료 안내'
  body: '가람증권은 개인 투자자의 진입 장벽을 낮추기 위해 비대면 계좌 개설 고객에게 경쟁력 있는 낮은 수수료를 제공하고 있습니다.


    - 계좌 개설 및 유지 수수료: 0원

    - 거래 수수료: 비대면 계좌 개설 고객에게는 시스템 안정성 유지를 위한 최소한의 비용으로 책정된 업계 최저 수준의 경쟁력 있는 수수료율이
    적용됩니다.


    상세 수수료는 고객님의 거래 규모와 상품 종류에 따라 다를 수 있으므로, 정확한 적용 요율은 실시간 상담을 통해 확인해 주시기 바랍니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: f4b34158-b283-5a50-80b1-446f17b6049b
  title: '중개형 ISA: 처리가 끝나지 않거나 보류 중일 때'
  body: "중개형 ISA 계좌 개설이나 한도 변경 신청 후 처리가 완료되지 않고 '보류' 상태로 표시되는 경우, 다음 내용을 확인하십시오.\n\
    \n- 예상 원인:\n  1. 본인 인증 정보 불일치: 성함이나 생년월일이 등록된 정보와 다를 경우 처리가 지연될 수 있습니다.\n  2.\
    \ 서류 검토 지연: 서민형 가입을 위한 증빙 서류 확인 과정에서 시간이 소요될 수 있습니다.\n  3. 타사 ISA 보유: 이미 다른 금융기관에\
    \ ISA 계좌를 보유하고 있어 이전 절차가 진행 중인 경우입니다.\n\n- 해결 방법:\n  1. 입력하신 성함과 생년월일이 정확한지 다시\
    \ 한번 확인하십시오.\n  2. 상담원에게 현재 진행 상태 확인을 요청하십시오. 저희가 내부 절차에 따라 단계적으로 에스컬레이션하여 처리\
    \ 상황을 확인하겠습니다.\n  3. 타사 계좌 이전 중이라면, 이전 기관의 처리 완료 통보 후 가람증권에서 최종 확정됩니다.\n\n처리가\
    \ 완료되면 등록된 연락처로 안내 메시지가 발송됩니다."
  domain: brokerage_investing
  product_category: garam_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 479399c0-f413-526c-9dd3-f9ec7dd71634
  title: '중개형 ISA: 가입 대상'
  body: '중개형 ISA 가입 가능 여부는 다음 조건에 따라 결정됩니다.


    - 가입 가능 연령: 만 19세 이상 거주자 (또는 15~19세 미만 거주자 중 근로소득이 있는 자) → 가입 가능

    - 금융소득종합과세 대상 여부: 직전 3년 중 한 번이라도 금융소득종합과세 대상이었던 경우 → 가입 불가능

    - 1인 1계좌 원칙: 모든 금융기관을 통틀어 1개의 ISA 계좌만 보유 가능 → 기존 계좌 해지 또는 이전 후 가입 가능'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 1d60761e-7d7f-51ce-be73-a2a7e73e50cc
  title: '중개형 ISA: 당사의 비슷한 상품과의 비교'
  body: '중개형 ISA와 연금저축계좌, IRP의 주요 차이점은 다음과 같습니다.


    - 중개형 ISA: 의무가입기간 3년을 유지하며, 순이익 2,000,000원(서민형 4,000,000원)까지 비과세 혜택을 받는 중단기 자산
    형성 상품입니다. 국내 주식 직접 투자가 가능합니다.

    - 연금저축 및 IRP: 노후 준비를 위한 장기 투자 상품으로, 납입액에 대해 세액공제 혜택을 제공합니다. 다만, 개별 주식 직접 투자는 불가능하며
    펀드나 ETF 중심으로 운용됩니다.


    단기 및 중기적으로 절세 혜택을 누리며 국내 주식에 투자하고 싶으신 분께는 ''중개형 ISA''를, 세액공제를 통해 노후 자금을 준비하시려는
    분께는 ''연금저축계좌''나 ''개인형 퇴직연금(IRP)''을 추천합니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 0fc6c27c-29f7-561e-86d9-1e793c11a912
  title: '중개형 ISA: 상품설명서 주요 내용'
  body: '본 상품 가입 전 다음의 법적 고지 사항을 반드시 확인하십시오.


    - 예금자 보호: 고객님이 맡기신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 단, 중개형 ISA를 통해 투자하신 주식, 펀드,
    ELS 등 투자상품은 예금자 보호 대상이 아니며, 투자 결과에 따라 원금 손실이 발생할 수 있고 원금이 보장되지 않습니다.

    - 적합성 원칙: 가람증권은 고객님의 재산 상황, 투자 경험, 투자 목적에 적합하지 않은 상품을 권유하지 않는 적합성 원칙을 엄격히 준수합니다.

    - 운용 제한: 중개형 ISA는 조세특례제한법 및 소득세법에 따라 세제 혜택이 제공되며, 의무가입기간 3년을 준수하지 않고 중도 해지할 경우
    세제 혜택이 추징될 수 있습니다.

    - 책임 소재: 모든 상품 추천은 적합성 원칙을 바탕으로 수행되나, 최종적인 투자 판단과 그에 따른 책임은 고객님 본인에게 있습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: b76ba862-f31b-5210-b961-2a3c8d00cfa4
  title: '중개형 ISA: 금리·요율 안내'
  body: '중개형 ISA에 적용되는 주요 세제 요율은 다음과 같습니다.


    - 비과세 혜택: 일반형 가입자는 순이익 2,000,000원까지, 서민형 가입자는 순이익 4,000,000원까지 세금이 부과되지 않습니다.

    - 분리과세 요율: 위 비과세 한도를 초과하는 순이익에 대해서는 9.9%(지방소득세 포함)의 저율 분리과세가 적용됩니다. 이는 일반적인 배당소득세율(15.4%)보다
    낮은 세율입니다.


    본 요율은 관련 법령인 조세특례제한법 및 소득세법에 근거하며, 법령 개정에 따라 변경될 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 247377c5-44bb-5f61-ac65-d147c4785a9b
  title: '중개형 ISA: 진행 중인 이벤트'
  body: '가람증권에서 중개형 ISA 신규 고객님을 위한 ''절세 시작 이벤트''를 진행합니다.


    - 이벤트 기간: 2026년 1월 1일부터 2026년 3월 31일까지

    - 혜택 내용: 이벤트 기간 내 중개형 ISA 계좌를 신규로 개설하고 1,000,000원 이상 납입하신 고객님께 국내 주식 거래 수수료 추가
    할인 혜택을 제공합니다.

    - 대상: 가람증권 중개형 ISA 신규 개설 고객


    자세한 참여 방법은 앱 내 이벤트 페이지를 확인하시거나 상담원에게 문의해 주십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 893c424f-af48-599a-b132-fe8b1b741566
  title: '중개형 ISA: 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 자산을 보호하기 위해 강력한 보안 체계를 운영하고 있습니다. 특히 중개형 ISA 계좌를 겨냥하여 가람증권
    직원이나 금융감독원을 사칭해 계좌 비밀번호나 보안카드의 전체 번호를 요구하는 피싱 사례가 발생하고 있으니 각별히 주의하시기 바랍니다.


    가람증권은 어떠한 경우에도 고객님의 비밀번호, 카드 번호, 주민등록번호 전체와 같은 민감한 정보를 요구하지 않습니다. 계좌 정보 변경이나 상태
    변경 작업을 위해 본인 확인이 필요한 경우, 오직 고객님의 성함과 생년월일만을 확인하여 인증을 수행합니다.


    만약 출처가 불분명한 링크를 클릭하셨거나, 누군가에게 민감한 정보를 제공하여 부정 거래가 의심되는 상황이라면 즉시 가람증권 고객센터로 알려주십시오.
    가람증권은 부정 거래 의심 시 즉각적인 계좌 보호 조치를 취하여 추가 피해를 방지하겠습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 5b150de7-851e-54db-972c-12f3bbbcbf0b
  title: '중개형 ISA: 약관'
  body: '본 약관은 가람증권이 제공하는 중개형 ISA 서비스 이용에 관한 고객과 회사 간의 권리와 의무를 규정합니다.


    1. 납입 한도 및 관리

    고객은 연간 납입 한도 20,000,000원, 총 납입 한도 100,000,000원 범위 내에서 계좌에 자금을 납입할 수 있습니다. 당해 연도에
    사용하지 않은 납입 한도는 다음 해로 이월됩니다.


    2. 의무가입기간 및 해지

    본 상품의 의무가입기간은 3년입니다. 의무가입기간 내에 계좌를 해지할 경우, 그동안 적용받았던 세제 혜택이 추징될 수 있으며 관련 법령에 따라
    처리됩니다.


    3. 세제 혜택 적용

    순이익에 대해 일반형은 2,000,000원, 서민형은 4,000,000원까지 비과세 혜택을 제공합니다. 해당 비과세 한도를 초과하는 순이익에
    대해서는 9.9%의 분리과세율(지방소득세 포함)을 적용합니다.


    4. 서비스 종료 및 변경

    가람증권은 관련 법령의 변경이나 내부 운영 방침에 따라 약관을 변경할 수 있으며, 이 경우 고객에게 사전 안내를 수행합니다.'
