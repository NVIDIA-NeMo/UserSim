- id: 036c3eb9-bb77-5994-ad66-24f6ab5eb431
  title: '연금저축계좌: 상품설명서 주요 내용'
  body: '본 상품의 주요 규정 및 투자자 보호 사항을 안내드립니다.


    1. 투자 제한: 본 계좌에서는 펀드 및 국내 상장 ETF에 투자할 수 있습니다. 단, 레버리지 및 인버스 ETF는 투자가 금지되며, 국내외
    개별 주식의 직접 매수는 불가능합니다.

    2. 과세 체계: 55세 이후 연금으로 수령 시 연령에 따라 5.5%, 4.4%, 3.3%의 연금소득세가 부과됩니다. 사적연금 소득이 연 15,000,000원을
    초과하는 경우, 종합과세와 16.5% 분리과세 중 선택하여 신고해야 합니다.

    3. 중도 인출: 연금 외의 형태로 자금을 인출할 경우 16.5%의 기타소득세가 부과됩니다.

    4. 투자자 보호: 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 본 계좌를 통해 투자한 펀드, ETF 등 투자상품은 보호 대상이
    아니며 원금이 보장되지 않습니다.


    세부 세율 적용 기준은 ''연금저축계좌: 금리·요율 안내''를 확인하십시오.'
