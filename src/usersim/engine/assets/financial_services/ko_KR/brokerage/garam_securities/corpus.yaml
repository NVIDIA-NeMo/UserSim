- id: 74fb0751-de33-59d5-8550-e2b9d6b34ea6
  title: '적립식 투자: 다른 상품과의 비교와 맞지 않는 경우'
  body: '적립식 투자는 투자 방식의 하나로, 거치식 투자(일시불 투자)와 비교하여 다음과 같은 특징을 가집니다.


    1. 거치식 투자 vs 적립식 투자

    - 거치식 투자: 초기에 큰 금액을 한 번에 투자하여 시장 상승 시 수익을 극대화합니다. 시장 방향성이 확실할 때 유리합니다.

    - 적립식 투자: 적립 최소 금액 1,000원부터 소액으로 나누어 투자하여, 가격이 낮을 때 더 많은 수량을 확보함으로써 평균 매입 단가를
    낮추는 ''코스트 에버리징'' 효과를 얻을 수 있습니다. 변동성이 큰 시장에서 리스크를 분산하고자 하는 고객님께 적합합니다.


    2. 이 상품이 맞지 않는 경우

    - 즉각적인 대규모 자금 투입을 통해 단기 수익을 추구하시는 분

    - 매회 설정해야 하는 적립 최소 금액 1,000원조차 부담이 되거나, 정기적인 자금 납입 계획을 세우기 어려운 분

    - 원금 보장형 상품만을 선호하시는 분 (본 상품은 원금이 보장되지 않습니다)


    고객님의 투자 성향과 재무 상황을 고려하여 가장 적합한 방식을 선택하시기 바랍니다.'
  domain: brokerage_investing
