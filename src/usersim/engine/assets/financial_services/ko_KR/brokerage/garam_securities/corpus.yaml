- id: 6722432a-6ce2-5d88-b1ae-06cc3887804e
  title: '연금저축계좌: 금리·요율 안내'
  body: '연금저축계좌에 적용되는 세액공제율 및 연금소득세율 안내입니다.


    1. 세액공제율 (납입 시)

    - 총급여 5,500만원 이하: 16.5%

    - 총급여 5,500만원 초과: 13.2%


    2. 연금소득세율 (55세 이후 수령 시)

    - 55세 이상 70세 미만: 5.5%

    - 70세 이상 80세 미만: 4.4%

    - 80세 이상: 3.3%


    위 요율은 관련 법령 및 조세특례제한법에 따라 적용되며, 개별적인 세무 상담은 제공하지 않습니다. 구체적인 과세 기준은 ''연금저축계좌: 상품설명서
    주요 내용''을 참고하십시오.'
