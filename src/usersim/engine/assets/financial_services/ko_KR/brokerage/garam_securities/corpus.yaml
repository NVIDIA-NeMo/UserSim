- id: 1b7d78b7-b39c-5319-a196-8658076ef7a8
  title: '미국주식 거래: 약관'
  body: '본 약관은 가람증권의 미국주식 거래 서비스 이용에 관한 권리와 의무를 규정합니다.


    1. 서비스 이용 및 비용: 고객은 가람증권이 제공하는 미국주식 거래 서비스를 통해 미국 시장의 주식을 매매할 수 있습니다. 매매 시 미국주식
    거래 수수료율 0.25%가 적용되며, 이는 거래 체결 시 자동으로 계산되어 부과됩니다.


    2. 환전 및 수수료: 미국주식 매수를 위한 환전 시 가람증권은 고객에게 95%의 환전 수수료 우대율을 제공합니다. 우대율은 회사 정책에 따라
    변경될 수 있으며, 변경 시 사전 고지합니다.


    3. 세금 납무 의무: 해외주식 양도소득은 관련 법령에 따라 과세됩니다. 연간 2,500,000원의 해외주식 양도소득 기본공제를 적용한 후,
    초과분에 대해 22%의 해외주식 양도소득세율(지방소득세 포함)이 부과됩니다. 고객은 다음 해 5월에 이를 직접 신고하고 납부할 의무가 있습니다.


    4. 계약의 종료: 고객은 언제든지 서비스 해지를 요청할 수 있으며, 가람증권은 모든 미결제 거래가 정산된 후 해지 절차를 진행합니다.'
