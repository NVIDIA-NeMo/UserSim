- id: 6b02459f-b6e6-57f9-b019-2419ecd60a0f
  title: '미국주식 거래: 상품 고르는 방법'
  body: '국내주식 거래와 미국주식 거래 중 고민하시는 고객님을 위해 주요 차이점을 비교해 드립니다.


    | 비교 항목 | 국내주식 거래 | 미국주식 거래 |

    | :--- | :--- | :--- |

    | 투자 대상 | 코스피, 코스닥 상장 기업 | 미국 시장 상장 기업 |

    | 거래 수수료 | 상품별 상이 | 0.25% |

    | 환전 필요성 | 없음 | 필요 (95% 환전 우대 적용) |

    | 주요 세금 | 거래세 발생 (양도세 대부분 비과세) | 양도소득세 22% (기본공제 2,500,000원) |

    | 위험 요소 | 기업 및 시장 위험 | 기업, 시장 위험 + 환율 변동 위험 |


    [선택 가이드]

    - 익숙한 국내 기업의 성장과 안정적인 배당을 원하신다면 ''국내주식 거래''를 추천합니다.

    - 전 세계 시가총액 상위 기업에 투자하여 글로벌 성장의 혜택을 누리고 싶다면 ''미국주식 거래''가 적합합니다.


    투자 판단의 책임은 고객님께 있으며, 고객님의 투자 성향에 맞는 적합한 상품을 선택하시기 바랍니다.'
