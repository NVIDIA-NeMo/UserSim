- id: 05f0e40a-1062-5384-a213-7d2792e7d11d
  title: '연금저축계좌: 다른 상품과의 비교와 맞지 않는 경우'
  body: '연금저축계좌는 장기적인 노후 준비와 세액공제 혜택에 최적화된 상품입니다. 하지만 모든 투자자에게 적합한 것은 아니므로, 아래의 경우를
    고려하십시오.


    1. 이런 분께는 맞지 않습니다

    - 단기 자금 마련이 목적이신 분: 연금저축계좌는 장기 투자 전용입니다. 연금 수령 요건을 채우지 않고 중도에 인출할 경우, 16.5%의 기타소득세가
    부과되어 세제 혜택이 상쇄될 수 있습니다.

    - 개별 주식 투자를 선호하시는 분: 본 계좌로는 국내외 개별 주식을 직접 매수할 수 없습니다. 주식 직접 투자를 원하신다면 ''국내주식 거래''
    또는 ''미국주식 거래'' 서비스를 이용하십시오.


    2. 다른 절세 상품과의 비교

    - 중개형 ISA: 3년의 의무 가입 기간이 있으며, 순이익에 대해 비과세 및 분리과세 혜택을 제공합니다. 노후 준비보다는 중기적인 자산 형성을
    원하시는 분께 더 적합합니다.


    본 상품은 총급여 5,500만원 이하일 때 16.5%, 초과 시 13.2%의 세액공제율을 통해 확실한 절세 효과를 제공하므로, 장기적인 노후
    자금 확보를 최우선으로 하시는 고객님께 권장합니다.'
