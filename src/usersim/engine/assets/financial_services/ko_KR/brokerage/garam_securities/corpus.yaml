- id: 98915c33-ad16-56d5-af33-322519d853ab
  title: '적립식 투자: 문제 해결'
  body: 'Q: 적립일 당일에 잔액이 부족해 매수가 되지 않았습니다. 어떻게 하나요?

    A: 적립식 투자는 정해진 일자에 자동으로 실행됩니다. 잔액 부족으로 실패한 회차의 금액은 자동으로 소급 적용되어 매수되지 않습니다. 해당
    금액을 투자하시려면 별도의 일회성 매수를 진행하시거나 다음 적립일을 기다려 주십시오.


    Q: 적립 금액을 변경하고 싶습니다. 어떻게 신청하나요?

    A: 고객센터 상담원을 통해 본인 인증 후 금액 변경을 요청하시거나, 모바일 앱의 설정 메뉴에서 변경하실 수 있습니다. 단, 변경 후에도 적립
    최소 금액인 1,000원 이상을 유지하셔야 합니다.


    Q: 적립식 투자를 중단하고 싶으면 어떻게 합니까?

    A: 언제든지 해지 신청이 가능합니다. 해지 시점까지 매수한 자산은 그대로 계좌에 보유되며, 이후의 정기 매수만 중단됩니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 619221e3-b7bf-55ad-a8d3-3b737cd26e8b
  title: '적립식 투자: 자주 하는 업무의 처리 절차'
  body: '적립 금액 변경 및 적립 주기 조정 등 자주 발생하는 업무 처리 절차는 다음과 같습니다.


    1. 본인 확인 및 요청

    - 상담원에게 성함과 생년월일을 제공하여 본인 인증을 완료하십시오.

    - 변경하고자 하는 내용(예: 월 10,000원 → 월 30,000원으로 증액, 또는 매월 1일 → 매월 15일로 날짜 변경)을 말씀해 주십시오.


    2. 조건 검토

    - 당사는 변경 요청하신 금액이 적립 최소 금액인 1,000원 이상인지 확인합니다.

    - 변경된 설정이 적용될 다음 적립 예정일을 계산하여 안내해 드립니다.


    3. 설정 반영 및 확인

    - 상담원이 변경 사항을 시스템에 반영하고, 최종적으로 변경된 금액과 주기, 적용 시점을 다시 한번 읽어 드립니다.


    4. 완료 확인

    - 고객님께서 변경 내용에 동의하시면 처리가 완료되며, 변경 내용은 모바일 앱의 ''나의 투자 내역''에서 즉시 확인하실 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 21cb580c-2308-5629-b5a9-994fbaa9787b
  title: '적립식 투자: 명세서나 내역과 맞지 않을 때'
  body: '적립식 투자 내역이나 명세서상의 금액이 실제 투자하신 내용과 다르다고 느껴지신다면 다음 사항을 먼저 확인해 주십시오.


    1. 확인 사항 (체크리스트)

    - 결제일과 결제 완료일의 차이: 주식 거래는 체결 후 실제 결제까지 영업일 기준 2일(T+2)이 소요됩니다. 명세서상의 잔액과 체결 내역의
    시차가 있을 수 있습니다.

    - 세금 및 수수료 반영: 매수 시 발생한 거래 수수료 등이 반영되어 실제 매수 수량이 예상과 소폭 다를 수 있습니다.

    - 배당금 재투자 여부: 설정에 따라 배당금이 자동으로 재투자되어 수량이 늘어났는지 확인하십시오.


    2. 해결 방법

    - 상담원에게 정확한 ''불일치 시점''과 ''예상 금액''을 말씀해 주십시오. 당사는 거래 체결 데이터와 결제 데이터를 대조하여 상세히 안내해
    드리겠습니다.


    3. 에스컬레이션 절차

    - 단순 시차 문제가 아니며 시스템 오류나 계산 착오가 의심되는 경우, 당사는 즉시 백오피스 정산 팀으로 사안을 에스컬레이션합니다. 조사 과정에서
    필요한 증빙 서류를 요청드릴 수 있으며, 최종 확인 결과는 내부 규정에 따라 신속히 안내하고 오차가 있을 경우 즉시 정정 처리하겠습니다.'
