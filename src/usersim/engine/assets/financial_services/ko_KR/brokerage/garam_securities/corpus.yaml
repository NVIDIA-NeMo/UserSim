- id: 3cba2bf5-a630-5424-a41d-18203916d346
  title: '개인형 퇴직연금(IRP): 약관 변경 안내'
  body: '본 안내는 개인형 퇴직연금(IRP) 서비스 이용 약관의 변경 사항을 설명합니다. 고객님께서는 변경된 내용을 확인하시고 서비스 이용에
    참고하시기 바랍니다.


    [주요 준수 사항 및 제한]

    1. 납입 한도: 연금계좌의 연간 납입 한도는 합산하여 18,000,000원으로 제한됩니다.

    2. 세제 혜택: 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 9,000,000원까지 적용됩니다.

    3. 운용 제한: 관련 법령에 따라 IRP 계좌 내에서는 펀드, 국내 상장 ETF(레버리지·인버스 제외), 예금 등에 투자할 수 있으며, 국내외
    개별 주식의 직접 매수는 불가능합니다.


    [약관 변경 및 해지]

    당사는 관련 법령 및 내부 규정 변경 시 약관을 개정할 수 있으며, 변경 사항은 모바일 앱 및 온라인 고객센터를 통해 공지합니다. 공지 후
    일정 기간 내에 거부 의사를 표시하지 않으시면 변경된 약관에 동의하신 것으로 간주됩니다. 고객님께서는 언제든지 본인의 선택으로 계좌를 해지하실
    수 있으나, 연금 외 형태로 인출 시 16.5%의 기타소득세가 부과될 수 있음에 유의하십시오.'
