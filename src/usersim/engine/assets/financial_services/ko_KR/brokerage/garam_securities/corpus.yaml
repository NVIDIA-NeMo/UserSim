- id: 53d1d5e8-7bcb-53ed-ade8-f765d7b565ef
  title: '중개형 ISA: 진행 상황과 내역 확인'
  body: '중개형 ISA의 투자 현황과 절세 혜택 적용 내역을 확인하는 방법입니다.


    준비 사항: 본인 확인을 위해 성함과 생년월일을 준비해 주십시오.


    1. 본인 인증 수행: 상담원에게 성함과 생년월일을 말씀해 주시면 본인 확인을 진행합니다.

    2. 내역 조회 요청: 현재까지의 총 납입 금액과 연간 납입 한도(20,000,000원) 대비 잔여 한도 확인을 요청하십시오.

    3. 순이익 및 비과세 현황 확인: 현재까지 발생한 순이익과 적용된 비과세 한도(일반형 2,000,000원 또는 서민형 4,000,000원)의
    소진 현황을 확인합니다.

    4. 상세 거래 내역 요청: 개별 종목의 매수·매도 내역 및 배당금 수령 현황에 대한 상세 명세를 요청하십시오.

    5. 결과 확인: 상담원이 안내해 드리는 현재 자산 평가액과 세제 혜택 적용 상태를 확인하시면 완료됩니다.


    내역상 오류가 발견된 경우 ''중개형 ISA: 명세서나 내역과 맞지 않을 때''를 통해 해결 방법을 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: how_to_guide
  source_authority: official
