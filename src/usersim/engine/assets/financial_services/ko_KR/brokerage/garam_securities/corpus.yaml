- id: 29bf761c-b66e-5ae2-8db0-93b87d483162
  title: '미국주식 거래: 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 자산을 보호하기 위해 미국주식 거래 서비스 이용 시 보안을 최우선으로 합니다. 최근 글로벌 투자 열풍을
    이용해 가람증권 상담원을 사칭하여 계좌 비밀번호나 보안카드를 요구하는 피싱 사례가 보고되고 있습니다.


    가람증권은 어떠한 경우에도 고객님의 카드 번호, 계좌 비밀번호, 주민등록번호 전체와 같은 민감한 정보를 요구하지 않습니다. 계좌 정보 변경
    등 상태 변경 작업이 필요한 경우, 오직 고객님의 성함과 생년월일만을 통해 본인 인증을 수행합니다.


    만약 출처가 불분명한 링크를 통해 개인정보 입력을 유도받았거나, 부정 거래가 의심되는 정황이 발견되었다면 즉시 저희 고객센터로 알려주십시오.
    가람증권은 부정 거래 의심 시 즉각적인 계좌 보호 조치를 취하여 추가 피해를 방지하겠습니다. 신속한 신고는 고객님의 자산을 지키는 가장 확실한
    방법입니다.'
