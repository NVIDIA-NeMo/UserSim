- id: c6f6931c-65cf-51f6-b5d5-096b53d43510
  title: '국내주식 거래: 안전한 이용을 위한 수칙'
  body: '고객님의 소중한 자산을 보호하기 위해 국내주식 거래 시 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 개인정보 및 보안 매체 관리

    가람증권은 어떠한 경우에도 고객님의 비밀번호, 보안카드 번호 전체, 주민등록번호 전체를 요구하지 않습니다. 특히 문자 메시지나 메신저를 통해
    외부 링크 접속을 유도하며 개인정보 입력을 요청하는 행위는 피싱 사기이므로 절대 응하지 마십시오.


    2. 본인 인증 절차 안내

    계좌 정보 변경이나 중요 상태 변경 작업 전, 당사는 반드시 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 이 외의 민감 정보
    요구가 있다면 즉시 의심하십시오.


    3. 부정 거래 의심 시 대응

    본인이 하지 않은 거래 알림을 받으셨거나 계좌 도용이 의심되는 경우, 즉시 고객센터를 통해 계좌 보호 조치를 요청하십시오. 부정 거래 의심
    신고는 발견 즉시 빠르게 진행하실수록 피해를 최소화할 수 있습니다.


    4. 보안 설정 강화

    모바일 앱의 생체 인증 및 2단계 인증 설정을 통해 타인의 무단 접속을 원천적으로 차단하십시오. 주기적인 비밀번호 변경을 권장합니다.'
