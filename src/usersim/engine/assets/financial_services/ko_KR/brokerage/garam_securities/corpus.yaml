- id: 58c72fb1-9c52-5f74-a259-67f3f0ce1931
  title: '연금저축계좌: 세액공제율(총급여 5,500만원 초과) 안내'
  body: '질문: 총급여가 5,500만원을 초과하는 경우 적용되는 세액공제율은 얼마인가요?


    답변: 총급여가 5,500만원을 초과하는 고객님의 경우, 세액공제율(총급여 5,500만원 초과)은 13.2%가 적용됩니다. 이는 산출된 세금에서
    해당 비율만큼을 직접 차감하여 세금 부담을 줄여주는 제도입니다.


    더욱 자세한 세액공제 대상 납입 한도는 ''연금저축계좌: 상품 개요'' 및 ''연금저축계좌: 연금저축과 IRP를 합한 세액공제 대상 납입 한도
    안내''에서 확인하실 수 있습니다.'
