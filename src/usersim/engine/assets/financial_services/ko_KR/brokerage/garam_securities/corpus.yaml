  institution_id: garam_securities
- id: 18a4c087-e67d-518c-a6e4-538d9628f857
  title: '적립식 투자: 적립 최소 금액 안내'
  body: '질문: 적립식 투자를 시작하려면 최소 얼마부터 설정해야 하나요?

    답변: 가람증권의 적립식 투자는 고객님의 투자 부담을 덜어드리기 위해 매우 낮은 진입 장벽을 제공합니다. 적립 최소 금액 1,000원부터 설정이
    가능하시므로, 소액으로도 부담 없이 투자를 시작하십시오.


    질문: 적립 금액을 중간에 변경할 수 있습니까?

    답변: 네, 가람증권 앱을 통해 언제든지 적립 금액을 변경하실 수 있습니다. 다만, 변경 후의 금액 역시 적립 최소 금액 1,000원 이상이어야
    합니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
