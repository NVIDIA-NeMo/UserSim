- id: 81f989fc-9e40-582a-a8ba-ebc1e317f3b3
  title: '개인형 퇴직연금(IRP): 가입부터 이용까지'
  body: '본 문서는 개인형 퇴직연금(IRP)의 가입 및 운용 프로세스에 대한 가이드라인을 제공합니다.


    [상품 개요 및 혜택]

    개인형 퇴직연금(IRP)은 퇴직금 관리와 추가 납입을 통해 세액공제 혜택을 누릴 수 있는 종합 은퇴 준비 계좌입니다. 비대면으로 계좌를 개설할
    경우 계좌 수수료는 0원입니다.


    [납입 및 공제 한도]

    - 연금계좌 연간 납입 한도: 18,000,000원 (연금저축 합산)

    - 세액공제 대상 납입 한도: 9,000,000원 (연금저축 합산)


    [투자 가능 상품]

    - 투자 가능: 펀드, 국내 상장 ETF(레버리지·인버스 제외), 예금

    - 투자 불가: 국내 및 해외 개별 주식 직접 매수 불가


    [투자자 보호 및 유의사항]

    - 예탁금 보호: 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 단, 펀드 및 ETF 등 투자상품은 보호 대상이 아니며 원금이 보장되지
    않습니다.

    - 적합성 원칙: 고객님의 투자 성향을 고려하여 상품을 권유하며, 모든 투자 판단의 책임은 고객님께 있습니다.


    가입 절차 및 상세 내용은 ''개인형 퇴직연금(IRP): 가입과 이용 시작''을 참조하십시오.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: product_sheet
  source_authority: official
  placeholder: true
