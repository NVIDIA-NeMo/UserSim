- id: 1d304205-8253-5f87-bc37-49a9c92e3326
  title: '미국주식 거래: 해지·변경·상품 전환'
  body: '미국주식 거래 서비스의 해지 또는 변경을 원하시는 경우 다음 절차를 따라주십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 다음 단계 진행이 가능합니다.

    2. 요청 사항 전달: 미국주식 거래 서비스의 해지, 또는 다른 서비스로의 전환 요청을 정확히 말씀해 주십시오.

    3. 잔고 및 포지션 확인: 현재 보유 중인 미국주식의 매도 여부나 타사 계좌로의 주식 대체 출고 필요성을 확인합니다. 모든 주식이 매도되어
    현금화되었거나 이전이 완료되어야 최종 해지가 가능합니다.

    4. 해지 처리 및 확인: 상담원이 서비스 해지 처리를 수행하며, 처리가 완료되면 고객님께 최종 확인 안내를 드립니다.


    서비스 전환의 경우, 전환하고자 하는 상품의 가입 조건을 확인한 후 동일한 인증 절차를 통해 신청하실 수 있습니다.'
