- id: 8180b48d-ec2a-5dae-849d-aa98a8b2d15f
  title: '연금저축계좌: 위험 안내'
  body: '본 상품에 투자하시기 전, 아래의 위험 고지 사항을 반드시 확인하시기 바랍니다.


    1. 원금 비보장: 연금저축계좌를 통해 투자하시는 주식, 펀드, ETF 등 투자 상품은 예금자보호법에 따른 보호 대상이 아니며, 운용 결과에
    따라 원금 손실이 발생할 수 있습니다. 투자 판단의 책임은 고객님께 있습니다.


    2. 예금자 보호 제한: 고객님이 납입하신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되지만, 투자 상품 자체는 보호 대상이 아님을
    명시합니다.


    3. 중도 인출 위험: 세액공제 혜택을 받은 후 연금 수령 요건을 충족하지 않고 중도에 인출하실 경우, 그동안 받은 세제 혜택을 상회하는 16.5%의
    기타소득세가 부과되어 실제 수령액이 크게 감소할 수 있습니다.


    4. 적합성 원칙: 가람증권은 고객님의 투자 성향과 재산 상황에 적합한 상품을 권유하는 적합성 원칙을 준수합니다. 다만, 특정 종목의 수익을
    보장하거나 개별적인 세무/법률 자문을 제공하지 않습니다.'
