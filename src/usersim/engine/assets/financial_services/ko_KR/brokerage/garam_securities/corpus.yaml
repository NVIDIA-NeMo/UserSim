- id: 75876916-6a79-5a13-a2ca-1eecdb03b8ce
  title: '적립식 투자: 추천·장기 이용 혜택'
  body: '가람증권이 고객님의 꾸준한 자산 성장을 응원하며 특별한 혜택을 드립니다. 2025년 6월 1일부터 2025년 8월 31일까지 적립식
    투자 서비스를 신규로 이용하시거나, 기존 고객님이 지인을 추천하여 가입시킨 경우 혜택을 받으실 수 있습니다.


    월 적립 금액 10,000원 이상으로 설정을 완료하신 고객님께는 투자 지원금 5,000원을 지급해 드립니다. 적립식 투자는 최소 1,000원부터
    시작할 수 있어 누구나 부담 없이 장기 투자의 습관을 기르실 수 있습니다.


    상세한 이용 방법은 ''적립식 투자: 가입부터 이용까지''를 참고해 주십시오.'
