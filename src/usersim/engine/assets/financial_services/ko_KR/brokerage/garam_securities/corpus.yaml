- id: 9870b5c0-e776-57c9-9669-4db1ae7edb92
  title: '적립식 투자: 전환이나 상위 상품을 고려할 때'
  body: '단순 적립식 투자에서 절세 혜택이 있는 계좌로의 전환을 고려하시는 경우, 다음의 차이점을 확인하십시오.


    적립식 투자는 일반 거래 계좌에서도 가능하지만, 이를 중개형 ISA 또는 연금저축계좌 내에서 운용하시면 세제 혜택을 누리실 수 있습니다.


    - 중개형 ISA: 비과세 및 분리과세 혜택을 통해 국내 주식과 ETF 투자 효율을 높이고자 하는 고객님께 적합합니다. (참고: ''중개형
    ISA: 상품 개요'')

    - 연금저축계좌: 세액공제 혜택을 통해 노후 자금을 준비하는 장기 투자자에게 적합합니다. (참고: ''연금저축계좌: 상품 개요'')


    단순히 매수 단가를 낮추는 전략이 목적이라면 적립식 투자가 유리하며, 세금 절감과 자산 성장을 동시에 도모하시려면 ISA나 연금 계좌로의 전환을
    추천드립니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: comparison
