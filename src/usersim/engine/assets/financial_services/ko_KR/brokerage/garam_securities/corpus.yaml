- id: a7136b39-aba0-5663-af86-f71167a130d0
  title: '국내주식 거래: 금리·요율이 정해지는 방식과 적용'
  body: '국내주식 거래에 적용되는 수수료 및 세율의 결정 방식과 적용 기준을 안내합니다.


    1. 거래 수수료: 국내주식 거래 수수료율(모바일)은 0.015%로 고정 적용됩니다. 이는 당사의 비대면 중심 비용 효율화 전략에 따라 모든
    모바일 거래 고객에게 동일하게 적용되는 단일 요율입니다.


    2. 법정 세율: 증권거래세는 정부 정책 및 관련 법령에 따라 결정됩니다.

    - 코스피: 0.2% (증권거래세 0.05% + 농어촌특별세 0.15% 합산)

    - 코스닥: 0.2%


    3. 적용 시점: 수수료는 매수 및 매도 체결 시점에 즉시 계산되어 적용되며, 세금은 매도 체결 시점에 징수됩니다. 해당 요율은 관련 법규
    변경이나 당사의 수수료 정책 변경 시 공지 후 조정될 수 있습니다.'
