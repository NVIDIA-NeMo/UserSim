- id: 19e66d0f-e5fd-5712-a68d-0cea63b779ca
  title: manage_authorized_users 사용 기준
  body: '미성년 자녀 계좌의 법정대리인(부모)을 등록하거나 변경해야 하는 경우, 상담원은 다음 절차를 준수하십시오.


    1. 요청자인 법정대리인의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오.

    2. 관리 대상이 되는 미성년 자녀의 계좌 정보(account_id)와 법정대리인으로서의 관계를 확인하십시오.

    3. 등록 또는 변경할 법정대리인의 상세 정보(성함, 연락처, 주민등록번호 등 필요 정보)를 확인하십시오.

    4. 자녀의 account_id와 법정대리인 정보를 사용하여 manage_authorized_users 도구를 호출하십시오.

    5. 처리가 완료되면 법정대리인 등록/변경 사실을 안내하고, 이제부터 자녀 계좌의 관리가 가능함을 알리십시오.


    이 절차는 적합성 원칙 및 투자자 보호 규정에 따라 엄격하게 수행되어야 하며, 증빙 서류 확인이 필요한 경우 내부 절차에 따라 안내하십시오.'
  domain: brokerage_investing
