- id: 5dd7e930-12ae-5247-8f0c-9dd81c71e233
  title: '개인형 퇴직연금(IRP): 안전한 이용을 위한 수칙'
  body: '고객님의 소중한 노후 자산을 보호하기 위해 개인형 퇴직연금(IRP) 이용 시 다음의 안전 수칙을 반드시 준수하여 주십시오.


    1. 가람증권은 어떠한 경우에도 고객님의 카드 번호, 계좌 비밀번호, 주민등록번호 전체 등 민감한 정보를 요구하지 않습니다.

    2. 계좌 정보 변경과 같은 상태 변경 작업 전에는 반드시 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 이 외의 과도한 개인정보를
    요구하는 요청은 의심하십시오.

    3. 출처가 불분명한 링크(URL)나 앱 설치 유도 메시지는 절대 클릭하지 마십시오.


    만약 부정 거래가 의심되거나 개인정보 유출이 우려되는 경우, 즉시 당사 고객센터로 연락하여 계좌 보호 조치를 요청하십시오. 신속한 대응만이
    피해를 최소화할 수 있습니다.'
