- id: 7616a61e-23aa-5420-81dd-cfcc07c4f216
  title: '적립식 투자: 금리·요율 안내'
  body: '적립식 투자 서비스와 관련된 주요 요율 및 제한 금액은 다음과 같습니다.


    - 적립 최소 금액: 1,000원 (최소 설정 가능 금액)

    - 국내주식 거래세(2026년 1월 1일 시행): 코스피 0.20%, 코스닥 0.20%

    - 배당소득세 원천징수율: 15.4%

    - 해외주식 양도소득세율: 22%(지방소득세 포함, 연 250만원 공제 후 적용)


    위 요율은 관련 법령 및 가람증권의 내부 규정에 따라 적용되며, 세법 변경 시 안내 없이 조정될 수 있습니다.'
