- id: 69f67950-c926-52bf-ae05-14d036d062d4
  title: '국내주식 거래: 예상과 다른 수수료나 금액'
  body: '고객님께서 거래 후 예상보다 더 많은 금액이 차감되었거나 수수료가 다르게 느껴지시는 경우, 다음 사항을 확인해 주시기 바랍니다.


    증상: ''주식을 매도했는데 정산 금액이 예상보다 적습니다'' 또는 ''수수료가 생각보다 많이 나왔습니다''.


    확인 순서:

    1. 거래 수수료 확인: 가람증권의 국내주식 거래 수수료율(모바일)은 0.015%입니다. 거래 금액에 해당 요율이 정확히 적용되었는지 확인하십시오.

    2. 증권거래세 확인: 주식 매도 시에는 수수료 외에 세금이 추가로 부과됩니다. 코스피와 코스닥 종목 모두 0.2%의 증권거래세가 적용되었는지
    확인하십시오.

    3. 시장 구분 확인: 거래하신 종목이 코스피인지 코스닥인지에 따라 세부 세율 구성이 다를 수 있습니다.


    해결 방법:

    - 위 항목들을 합산하여 계산했을 때 금액이 일치한다면 정상 처리된 것입니다.

    - 만약 계산 결과와 실제 차감 금액이 명확히 다르다면, 거래 내역과 함께 상담원에게 상세 내용을 전달해 주십시오.


    에스컬레이션:

    - 단순 계산 오류가 아닌 시스템상의 금액 불일치가 의심되는 경우, 상담원은 즉시 내부 정산팀으로 케이스를 상신하여 정밀 조사를 진행하며,
    결과는 영업일 기준 3일 이내에 안내해 드립니다.'
