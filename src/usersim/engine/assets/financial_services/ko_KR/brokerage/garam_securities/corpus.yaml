- id: 4f00f61d-ca09-52d4-b1f2-3f800ac2ace0
  title: '개인형 퇴직연금(IRP): 한도·제한과 유의사항'
  body: '개인형 퇴직연금(IRP) 계좌 운영 시 적용되는 주요 한도와 제한 사항 및 유의사항입니다.


    1. 납입 및 공제 한도

    - 연금계좌 연간 납입 한도: 18,000,000원 (연금저축과 합산 기준)

    - 연금저축과 IRP를 합한 세액공제 대상 납입 한도: 9,000,000원


    2. 투자 가능 자산 및 제한

    - 투자 가능 상품: 펀드, 국내 상장 ETF, 예금 등

    - 투자 제한 상품: 개별 주식(국내 및 해외 모두 직접 매수 불가), 레버리지 및 인버스 ETF


    3. 세제 및 인출 유의사항

    - 연금 외 형태로 인출 시: 16.5%의 기타소득세가 부과됩니다.

    - 사적연금 소득이 연 1,500만원을 초과하는 경우: 종합과세와 16.5% 분리과세 중 선택하여 신고해야 합니다.


    4. 보호 및 위험 고지

    - 예금보험공사를 통해 예탁금은 1인당 1억원까지 보호됩니다.

    - 단, IRP 내에서 운용하는 주식, 펀드, ETF 등 투자상품은 보호 대상이 아니며 원금이 보장되지 않습니다.'
