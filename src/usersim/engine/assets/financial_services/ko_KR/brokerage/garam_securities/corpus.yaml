- id: 071796c6-4cae-58a0-9b15-cc9fcb461a90
  title: '적립식 투자: 처리가 끝나지 않거나 보류 중일 때'
  body: '적립식 투자 설정 후 매수가 이루어지지 않았거나 ''보류 중'' 상태로 표시되는 경우, 다음 사항을 순서대로 확인해 주십시오.


    1. 예탁금 잔액 확인: 적립 예정 금액보다 계좌 잔액이 부족할 경우 매수가 진행되지 않습니다. 계좌에 충분한 금액이 있는지 확인하십시오.

    2. 시장 영업시간 확인: 주식 시장이 휴장일이거나 영업시간 외인 경우, 주문이 접수되어도 실제 체결까지 시간이 걸릴 수 있습니다.

    3. 종목 거래 정지 여부: 투자 중인 종목이 거래 정지 상태인 경우 매수가 불가능합니다.


    위 사항을 모두 확인했음에도 문제가 해결되지 않는다면, 저희에게 말씀해 주십시오. 가람증권에서 내부 절차에 따라 전문 처리 팀으로 에스컬레이션하여
    원인을 파악하고 처리 결과를 안내해 드리겠습니다. 보통 영업일 기준 1~3일 이내에 해결 상황을 통보받으실 수 있습니다.'
