- id: 095516a6-a204-50ea-b797-ac78e3dbd33e
  title: '국내주식 거래: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 ''국내주식 거래'' 서비스 이용 고객을 안내할 때 참고하는 한도 및 제한 사항 가이드입니다.


    1. 원금 비보장 및 위험 안내

    ''국내주식 거래''는 투자 상품으로, 예금보험공사를 통한 예탁금 보호(1인당 1억원 한도) 대상은 아니며 투자 원금이 보장되지 않습니다.
    주가 변동에 따라 투자 손실이 발생할 수 있음을 고객에게 명확히 안내하십시오.


    2. 적합성 원칙 준수

    금융위원회와 금융감독원의 감독 하에, 고객의 재산 상황, 투자 경험, 목적에 적합하지 않은 상품을 권유해서는 안 됩니다. 고객의 투자 성향을
    먼저 확인하고 그에 맞는 안내를 수행하십시오.


    3. 거래 제한 및 유의사항

    - 계좌 상태 변경 및 주요 정보 수정 시에는 반드시 고객의 성함과 생년월일을 통해 본인 인증을 수행해야 합니다.

    - 특정 종목에 대한 수익 보장이나 개별적인 세무 및 법률 자문은 제공할 수 없습니다.

    - 모든 투자 판단의 최종 책임은 고객에게 있음을 안내하십시오.


    상세한 수수료 체계는 ''국내주식 거래: 수수료 안내''를 참고하시기 바랍니다.'
