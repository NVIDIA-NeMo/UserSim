- id: 1b76a2d2-4c5f-5139-bd4b-e01ffd6eb320
  title: '적립식 투자: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객의 적립식 투자 서비스 가입 및 이용을 지원하기 위한 안내서입니다.


    [서비스 개요]

    적립식 투자는 소액으로 꾸준히 투자하여 평균 매입 단가를 낮출 수 있는 서비스입니다. 시장의 변동성에 대응하여 리스크를 분산하고자 하는 개인
    투자자에게 적합합니다.


    [핵심 이용 조건]

    - 적립 최소 금액: 1,000원 (이 금액 이상의 금액부터 적립 설정이 가능합니다)

    - 대상 상품: 국내주식, 미국주식 등 가람증권에서 제공하는 투자 상품


    [가입 및 이용 절차]

    1. 계좌 확인: 국내주식 또는 미국주식 거래 계좌가 개설되어 있어야 합니다.

    2. 상품 선택: 적립식 투자를 통해 매수할 종목 또는 펀드를 선택합니다.

    3. 조건 설정: 적립 주기(일/주/월)와 적립 금액(최소 1,000원 이상)을 설정합니다.

    4. 실행 확인: 설정 완료 후 다음 예정일에 자동 매수가 진행됩니다.


    [중요 고지 사항]

    - 원금 비보장: 본 서비스로 매수하는 주식 및 펀드는 투자상품으로 원금이 보장되지 않습니다.

    - 예금자보호 제외: 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 적립식 투자를 통해 보유하게 되는 주식 및 펀드는 보호 대상이
    아닙니다.

    - 적합성 원칙: 고객의 투자 성향을 고려하여 상품을 추천하며, 최종 투자 판단은 고객의 책임하에 이루어집니다.'
