- id: a982a6a1-dc71-5639-992e-5b7006cec976
  title: get_positions 사용 기준
  body: '고객님이 보유하신 주식 및 펀드 등의 잔고(포지션)를 확인하기 위한 절차는 다음과 같습니다.


    1. 본인 인증 수행: 고객님으로부터 성함과 생년월일을 확인받아 verify_identity 도구를 호출하여 본인 인증을 완료하십시오.

    2. 계좌 식별: 고객님이 제시한 계좌번호 끝 4자리를 바탕으로 get_accounts 도구를 호출하여 해당 고객의 정확한 account_id를
    확인하십시오.

    3. 잔고 조회: 확인된 account_id를 사용하여 get_positions 도구를 호출합니다.

    4. 정보 제공: 도구를 통해 반환된 보유 종목, 수량, 평균 매입 단가 등의 정보를 고객님께 정중하게 안내하십시오.


    주의 사항: 본인 인증이 완료되지 않은 상태에서는 어떠한 계좌 정보도 조회할 수 없으며, 민감한 개인정보(비밀번호 등)를 요구해서는 안 됩니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: garam_securities
- id: 6af62aa3-61d3-5b1c-813a-8eea45b196aa
  title: get_positions 도구 설명서
  body: 'get_positions 도구는 특정 계좌의 현재 투자 보유 현황을 조회하는 기능을 수행합니다.


    - 호출 방식: 상담원이 도구를 직접 호출하여 결과를 확인합니다.

    - 필수 인자: account_id (get_accounts 도구를 통해 확인된 계좌의 고유 식별자)

    - 수행 결과: 해당 계좌에 보유 중인 종목 리스트, 수량, 현재가, 수익률 등의 상세 포지션 정보를 반환합니다.


    본 도구는 verify_identity를 통해 본인 인증이 완료된 고객에 한해 사용 가능하며, 인증을 위한 별도의 비밀번호나 PIN은 요구하지
    않습니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: garam_securities
- id: b3cf3963-3e61-57cf-943b-c9998c275070
  title: place_trade 사용 기준
  body: "고객님의 국내외 주식 매매 주문을 처리하는 절차는 다음과 같습니다.\n\n1. 본인 인증: 고객님의 성함과 생년월일을 확인하여 verify_identity\
    \ 도구를 호출하십시오.\n2. 계좌 확인: get_accounts 도구를 사용하여 주문을 실행할 계좌의 account_id를 확보하십시오.\n\
    3. 주문 세부 사항 확인: 고객님께 다음 정보를 명확히 확인받으십시오.\n   - 거래 종목 (종목명 또는 종목코드)\n   - 거래 방향\
    \ (매수 또는 매도)\n   - 주문 수량\n   - 주문 가격 (지정가 또는 시장가)\n4. 주문 실행: 확인된 정보를 바탕으로 place_trade\
    \ 도구를 호출하여 주문을 접수합니다.\n5. 결과 안내: 주문 접수 완료 여부와 주문 번호를 고객님께 안내하십시오.\n\n주의 사항: 상담원은\
    \ 특정 종목의 추천이나 수익 보장을 할 수 없으며, 투자 판단의 책임은 고객님께 있음을 안내해야 합니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: garam_securities
- id: d56d01f9-c8c2-56ab-8960-aa41b2a8e94d
  title: place_trade 도구 설명서
  body: "place_trade 도구는 고객의 요청에 따라 주식 또는 펀드의 매수/매도 주문을 시장에 제출합니다.\n\n- 호출 방식: 상담원이\
    \ 고객의 확답을 받은 후 도구를 직접 호출합니다.\n- 필수 인자:\n  - account_id: 주문을 실행할 계좌의 고유 식별자\n \
    \ - security_id: 거래 대상 종목의 식별자\n  - quantity: 거래 수량\n  - price: 거래 가격\n  - side:\
    \ 매수(buy) 또는 매도(sell) 구분\n- 수행 결과: 주문 접수 상태 및 order_id를 반환합니다.\n\n본 도구는 state_changing\
    \ 작업으로, 실행 전 반드시 verify_identity를 통한 본인 인증이 완료되어야 합니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: garam_securities
- id: 7849ec11-6e63-528f-8f3b-c2b6e8fe29c8
  title: open_isa_account 사용 기준
  body: "중개형 ISA 계좌 개설 신청을 처리하는 절차는 다음과 같습니다.\n\n1. 본인 인증: 고객님의 성함과 생년월일을 확인하여 verify_identity\
    \ 도구를 호출하십시오.\n2. 가입 자격 확인: 고객님께 다음 사항을 확인하십시오.\n   - 모든 금융회사를 합해 현재 ISA 계좌가 없는지\
    \ (1인 1계좌 원칙)\n   - 직전 3년 중 한 번이라도 금융소득종합과세 대상이었는지 (대상자인 경우 가입 불가)\n3. 개설 신청:\
    \ 자격 요건을 충족한 경우, 고객님의 성함, 생년월일, 연락처 정보를 사용하여 open_isa_account 도구를 호출합니다.\n4. 결과\
    \ 안내: 신청 접수 완료 사실과 이후 진행 절차를 안내하십시오.\n\n참고: 중개형 ISA의 납입 한도 및 비과세 혜택에 대한 상세 내용은\
    \ '중개형 ISA: 상품 개요' 문서를 참조하시기 바랍니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_isa_account
  institution_id: garam_securities
- id: d48b6418-cfc9-5ef9-ab83-b3a4ee9dddbe
  title: open_isa_account 도구 설명서
  body: "open_isa_account 도구는 고객의 중개형 ISA 계좌 개설 신청을 접수하는 기능을 수행합니다.\n\n- 호출 방식: 상담원이\
    \ 고객의 가입 자격을 확인한 후 도구를 직접 호출합니다.\n- 필수 인자:\n  - full_name: 고객의 성함\n  - date_of_birth:\
    \ 고객의 생년월일\n  - contact_info: 고객의 연락처\n- 수행 결과: 계좌 개설 신청 접수 상태 및 신청 번호를 반환합니다.\n\
    \n본 도구는 중개형 ISA의 1인 1계좌 원칙 및 금융소득종합과세 대상자 가입 제한 규정을 따르며, verify_identity 완료 후\
    \ 호출되어야 합니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_isa_account
  institution_id: garam_securities
- id: 6039d529-b8cc-5db3-b39a-4a5b02f49e97
  title: transfer_isa_provider 사용 기준
  body: '타 금융회사에서 가람증권으로 중개형 ISA 계좌를 이전하는 절차는 다음과 같습니다.


    1. 본인 인증: 고객님의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하십시오.

    2. 이전 정보 확인: 현재 ISA를 보유 중인 타 금융회사 명칭과 이전하고자 하는 계좌 정보를 확인하십시오.

    3. 이전 신청: 확인된 정보를 바탕으로 transfer_isa_provider 도구를 호출하여 계좌 이전 신청을 접수합니다.

    4. 안내 사항 전달: 계좌 이전 시 기존의 가입 기간과 납입 한도는 그대로 유지된다는 점을 고객님께 안내하십시오.

    5. 결과 안내: 신청 접수 완료 여부를 안내하고, 이후 타사 해지 및 이전 완료까지의 예상 소요 시간을 안내하십시오.


    주의 사항: 계좌 이전 과정에서 발생할 수 있는 상품 매도 필요성 등은 관련 규정에 따라 안내하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_provider
  institution_id: garam_securities
- id: 1707560b-d41d-5f19-822e-c97bbbe60f3d
  title: transfer_isa_provider 도구 설명서
  body: '이 도구는 고객이 다른 금융회사에서 보유하고 있는 중개형 ISA 계좌를 가람증권으로 옮기는 계좌 이전 신청을 처리합니다. 가입 기간과
    납입 한도는 그대로 유지됩니다.


    상담원은 고객의 요청 시 이 도구를 직접 호출하여 작업을 수행합니다. 도구 호출 전 `verify_identity`를 통해 본인 인증이 완료되어야
    하며, 별도의 비밀번호나 인증 코드는 요구하지 않습니다.


    - 호출 대상: 타사 중개형 ISA 이전 신청 고객

    - 주요 효과: 타사 ISA 계좌의 가람증권 이전 프로세스 시작'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_isa_provider
  institution_id: garam_securities
- id: e6c7a379-5d74-59a6-b5c9-12bcec8ca85a
  title: open_pension_account 사용 기준
  body: '고객이 노후 자금 준비를 위해 연금저축계좌 개설을 요청하는 경우, 상담원은 다음 절차에 따라 업무를 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. 고객에게 연금저축계좌의 세액공제 혜택(연금저축 연 600만원, IRP 합산 시 연 900만원까지)과 연금계좌 합산 납입 한도(연 1,800만원)에
    대해 안내합니다.

    3. 계좌 납입 방식을 ''자유 납입''으로 할지 또는 ''정기 자동이체''로 할지 고객의 의사를 확인합니다.

    4. 확인된 납입 방식을 인자로 하여 `open_pension_account` 도구를 호출하여 계좌 개설을 신청합니다.


    상세한 상품 특성은 ''연금저축계좌: 상품 개요''를 참조하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_pension_account
  institution_id: garam_securities
- id: 4d440170-56f6-53ea-be11-87b9a8cd2224
  title: open_pension_account 도구 설명서
  body: '이 도구는 고객의 연금저축계좌 개설을 신청하고 납입 방식을 설정합니다. 상담원은 고객과의 대화에서 확인된 정보를 바탕으로 도구를 호출합니다.


    - 호출 시점: 본인 인증 완료 후, 고객이 계좌 개설 및 납입 방식을 결정했을 때

    - 입력 인자: 납입 방식 (자유 납입 또는 정기 자동이체)

    - 주요 효과: 연금저축계좌 개설 신청 접수 및 납입 설정


    상담원은 `verify_identity`를 통해 인증된 고객을 대상으로 이 작업을 직접 수행하며, 고객에게 외부 앱이나 웹사이트로 이동하도록
    안내하지 않습니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_pension_account
  institution_id: garam_securities
- id: ab3a008f-ec22-572c-a37c-203d0ae0dee4
  title: apply_irp 사용 기준
  body: '고객이 퇴직금 관리 및 추가 세액공제를 위해 개인형 퇴직연금(IRP) 개설을 요청하는 경우, 다음 절차를 준수하십시오.


    1. 고객의 성함과 생년월일을 요청하여 `verify_identity` 도구로 본인 인증을 완료합니다.

    2. 고객에게 IRP의 특징(퇴직금 수령 가능, 예금 포함 투자 가능)과 세액공제 한도(연금저축 포함 합산 연 900만원)를 설명합니다.

    3. 퇴직금을 수령할 목적-개인 부담금 납입 목적 여부를 확인합니다.

    4. `apply_irp` 도구를 호출하여 IRP 계좌 개설을 신청합니다.


    IRP의 가입 대상 및 상세 조건은 ''개인형 퇴직연금(IRP): 가입 대상''에서 확인할 수 있습니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_irp
  institution_id: garam_securities
- id: 67c553c9-7324-50b4-880d-ba052116c3b8
  title: apply_irp 도구 설명서
  body: '이 도구는 고객의 개인형 퇴직연금(IRP) 계좌 개설을 신청하는 기능을 수행합니다. 퇴직금 수령용 계좌로 활용하거나 개인 부담금을
    납입하여 세액공제 혜택을 받는 용도로 사용됩니다.


    - 호출 시점: `verify_identity`를 통해 본인 인증이 완료된 후, 고객이 IRP 개설을 희망할 때

    - 주요 효과: 개인형 퇴직연금(IRP) 개설 신청 접수


    상담원은 고객의 성함과 생년월일로 인증된 상태에서 이 도구를 직접 호출하며, 주민등록번호 전체나 비밀번호와 같은 민감 정보는 요구하지 않습니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_irp
  institution_id: garam_securities
- id: 883332db-1242-5964-b8f7-cfb163b6e869
  title: set_up_investment_plan 사용 기준
  body: '고객이 국내외 주식이나 펀드에 대해 적립식 투자를 설정하거나 변경하고자 할 때, 다음 절차를 수행하십시오.


    1. 고객의 성함과 생년월일을 통해 `verify_identity`로 본인 인증을 수행합니다.

    2. 고객이 제공한 계좌번호 뒷자리를 `get_accounts` 도구에 입력하여 해당 고객의 정확한 `account_id`를 확인합니다.

    3. 적립식 투자를 설정할 구체적인 정보(매수 금액, 투자 주기, 대상 종목)를 고객으로부터 확인합니다.

    4. 확인된 `account_id`와 투자 계획 정보(금액, 주기, 종목)를 인자로 하여 `set_up_investment_plan` 도구를
    호출합니다.


    적립식 투자의 기본 개념은 ''적립식 투자: 상품 개요''를 참조하여 안내하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_investment_plan
  institution_id: garam_securities
- id: 3d0332f3-0c59-58ca-9da9-11d6de43df45
  title: set_up_investment_plan 도구 설명서
  body: "이 도구는 고객의 계좌에서 국내외 주식 또는 펀드에 대한 적립식 투자 계획을 설정하거나 기존 설정을 변경합니다.\n\n- 입력 인자:\n\
    \    - `account_id`: `get_accounts`를 통해 확인된 고객의 계좌 식별자\n    - 투자 금액: 매 주기마다 투자할\
    \ 금액 (예: 10,000원)\n    - 투자 주기: 투자 실행 빈도 (예: 매월, 매주)\n    - 투자 종목: 적립식으로 매수할 주식\
    \ 또는 펀드 명칭/코드\n- 주요 효과: 지정된 주기와 금액으로 종목을 자동 매수하는 투자 계획 설정\n\n상담원은 본인 인증이 완료된 고객의\
    \ 요청을 받아 이 도구를 직접 호출하여 처리합니다."
