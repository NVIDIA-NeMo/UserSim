- id: 72916cd1-3fbb-5db2-94b4-cd07bb9a0edd
  title: '연금저축계좌: 추천·장기 이용 혜택'
  body: '가람증권과 함께 안정적인 노후를 준비하십시오. 연금저축계좌를 통해 장기 투자 시, 연금저축 세액공제 대상 납입 한도인 6,000,000원까지의
    납입액에 대해 최대 16.5%의 세액공제 혜택을 누리실 수 있습니다. 지금 가입하시어 체계적인 자산 성장과 절세 혜택을 동시에 경험하십시오.
    상세한 세액공제 조건은 ''연금저축계좌: 세액공제율(총급여 5,500만원 이하) 안내''에서 확인하실 수 있습니다.'
