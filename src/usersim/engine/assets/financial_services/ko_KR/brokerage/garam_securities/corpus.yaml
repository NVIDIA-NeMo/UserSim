- id: 03d887f7-b843-5684-9011-e1abd7c6fac9
  title: '적립식 투자: 한도·제한과 유의사항'
  body: '가람증권의 적립식 투자는 소액으로 꾸준히 투자하여 평균 매입 단가를 낮출 수 있는 효율적인 투자 서비스입니다. 이용 시 다음의 한도와
    유의사항을 확인하시기 바랍니다.


    1. 적립 금액 제한

    - 적립 최소 금액: 1,000원

    - 고객님께서는 매회 적립 시 최소 1,000원 이상의 금액을 설정하셔야 서비스 이용이 가능합니다.


    2. 투자자 보호 및 위험 고지

    - 원금 비보장: 본 서비스는 주식 및 펀드 등에 투자하는 상품으로, 예금보험공사의 보호 대상이 아니며 투자 원금이 보장되지 않습니다.

    - 적합성 원칙 준수: 당사는 고객님의 재산 상황, 투자 경험 및 목적에 적합한 상품을 권유하는 적합성 원칙을 엄격히 준수합니다.


    3. 운용 유의사항

    - 적립식 투자는 장기적인 관점에서 변동성을 관리하는 전략이나, 시장 상황에 따라 손실이 발생할 수 있습니다. 모든 투자 판단의 책임은 고객
    본인에게 있음을 유의하시기 바랍니다.'
