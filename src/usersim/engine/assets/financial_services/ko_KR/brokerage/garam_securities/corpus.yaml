  institution_id: garam_securities
- id: eafbe78f-64d3-53af-a60e-16704fb2b120
  title: '미국주식 거래: 명세서나 내역과 맞지 않을 때'
  body: '거래 명세서의 금액이나 수익 내역이 예상과 다를 경우, 다음 사항을 먼저 점검해 주십시오.


    1. 수수료 반영 여부: 매수/매도 시 각각 미국주식 거래 수수료율 0.25%가 차감되었는지 확인하십시오.

    2. 환율 변동: 매수 시점과 매도 시점의 환율 차이로 인해 원화 환산 금액이 달라질 수 있습니다. 95%의 환전 수수료 우대율이 적용된 실제
    적용 환율을 확인하십시오.

    3. 세금 공제 계산: 양도소득 계산 시 해외주식 양도소득 기본공제(연) 2,500,000원이 정확히 차감되었는지, 그리고 초과분에 대해 22%의
    해외주식 양도소득세율(지방소득세 포함)이 적용되었는지 확인하십시오.


    위의 계산 방식에도 불구하고 금액이 일치하지 않는다면, 상담원에게 상세 내역 조사를 요청하십시오. 저희가 내부 거래 로그를 전수 조사하고 필요한
    경우 전문 처리 팀으로 에스컬레이션하여 오차 원인을 분석한 뒤, 정정 처리 결과나 상세 설명을 안내해 드리겠습니다.'
  domain: brokerage_investing
