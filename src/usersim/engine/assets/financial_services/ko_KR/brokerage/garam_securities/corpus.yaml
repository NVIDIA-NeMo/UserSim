- id: 12f77fcd-406b-5c5d-9490-27f045d7d992
  title: manage_authorized_users 도구 설명서
  body: "manage_authorized_users 도구는 미성년 자녀 계좌에 대해 법정대리인(부모 등)을 등록하거나 기존 등록 정보를 변경하는\
    \ 기능을 수행합니다. 상담원은 확인된 법정대리인 정보를 바탕으로 이 도구를 호출합니다.\n\n- 호출 시점: 법정대리인의 본인 인증이 완료되고\
    \ 자녀 계좌 및 대리인 정보가 확인된 후\n- 입력 인수:\n  - child_account_id: 법정대리인을 설정할 미성년 자녀의 계좌\
    \ 고유 식별자\n  - representative_details: 법정대리인의 성함, 생년월일, 연락처 등 등록 정보\n- 수행 결과: 해당\
    \ 자녀 계좌의 법정대리인 정보가 생성 또는 업데이트됩니다.\n\n본 도구는 verify_identity를 통해 법정대리인의 신원이 확인된\
    \ 상태에서만 호출 가능합니다."
