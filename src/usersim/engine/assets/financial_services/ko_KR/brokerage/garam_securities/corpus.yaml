- id: 6f9c2033-245c-526c-86d4-83ab66a91421
  title: '연금저축계좌: 가입과 이용 시작'
  body: '가람증권의 연금저축계좌 가입 및 이용 절차를 안내해 드립니다.


    1. 본인 확인: 고객님의 성함과 생년월일을 말씀해 주시면 본인 인증을 수행합니다.

    2. 투자 성향 파악: 적합성 원칙에 따라 고객님의 재산 상황, 투자 경험, 목적을 확인하고 투자 성향을 분석합니다.

    3. 납입 한도 설정: 연금계좌 연간 납입 한도인 18,000,000원 범위 내에서 연간 납입하실 금액을 설정하십시오.

    4. 계좌 개설 완료: 가입 신청 내용이 확인되면 계좌 개설이 완료되며, 즉시 펀드 및 국내 상장 ETF 투자가 가능합니다.


    계좌 개설 후 상품의 특징과 혜택을 자세히 알고 싶으신 경우 ''연금저축계좌: 상품 개요''를 참고하십시오.'
