- id: f273ae6a-ff0f-524c-951b-c15e0da1627f
  title: '국내주식 거래: 처리가 끝나지 않거나 보류 중일 때'
  body: '주식 매수 또는 매도 주문 후 ''처리 중'' 혹은 ''보류'' 상태가 지속되는 경우 다음과 같이 조치해 주십시오.


    **예상 원인**

    - 시장 영업시간 외 주문: 장전/장후 시간외 거래 시간이 아니거나 시장이 종료된 경우 주문이 보류될 수 있습니다.

    - 예수금 부족: 매수 주문 시 필요한 금액(수수료 포함)이 계좌에 부족한 경우 처리가 지연될 수 있습니다.

    - 시스템 일시적 지연: 일시적인 트래픽 증가로 인해 체결 내역 반영이 늦어질 수 있습니다.


    **확인 및 해결 방법**

    1. 주문 가능 시간 확인: 현재 거래하려는 종목의 시장 운영 시간을 확인하십시오.

    2. 잔고 확인: 계좌의 예수금이 충분한지, 미체결 주문으로 인해 금액이 묶여 있지 않은지 확인하십시오.

    3. 앱 재접속: 최신 상태 반영을 위해 앱을 완전히 종료 후 다시 접속하십시오.


    **해결되지 않을 경우**

    위 조치 후에도 상태가 변경되지 않는다면 저희에게 요청해 주십시오. 저희가 내부 절차에 따라 주문 상태를 즉시 확인하고, 필요한 경우 전문
    처리 팀으로 에스컬레이션하여 처리 결과를 안내해 드리겠습니다.'
