  title: '국내주식 거래: 이런 분께 알맞습니다'
  body: '가람증권의 ''국내주식 거래'' 서비스는 코스피와 코스닥 시장의 유망한 기업에 직접 투자하여 자산을 성장시키고자 하는 개인 투자자분들께
    최적화된 서비스입니다.


    이런 분들께 추천드립니다:

    - 낮은 비용으로 효율적인 투자를 원하는 분: 모바일 거래 시 0.015%라는 경쟁력 있는 수수료율을 제공하여 투자 진입 장벽을 낮췄습니다.

    - 디지털 중심의 편리한 인터페이스를 선호하는 분: 모바일 앱을 통해 실시간으로 시장 상황을 확인하고 신속하게 매매를 수행할 수 있습니다.

    - 국내 대표 기업의 성장에 함께하고 싶은 분: 대한민국을 대표하는 다양한 상장 기업의 주식을 직접 거래하실 수 있습니다.


    유의사항:

    - 본 서비스는 투자 상품으로 원금이 보장되지 않습니다.

    - 매도 시에는 코스피 0.2%, 코스닥 0.2%의 증권거래세가 발생합니다.

    - 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 매수하신 주식 자체는 보호 대상이 아님을 유의하시기 바랍니다.'
