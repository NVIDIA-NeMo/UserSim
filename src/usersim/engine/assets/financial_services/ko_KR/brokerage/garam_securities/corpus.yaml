- id: d36c82d5-bcdc-5795-acaf-72cec9b9c823
  title: '적립식 투자: 상품 개요'
  body: '가람증권의 ''적립식 투자''는 소액으로 꾸준히 자산을 쌓아올려 평균 매입 단가를 낮출 수 있는 스마트한 투자 서비스입니다. 시장의
    변동성에 일일이 대응하기 어려운 개인 투자자분들이 정해진 금액을 주기적으로 투자함으로써 리스크를 분산하고 안정적인 성장 기반을 마련할 수 있도록
    돕습니다.


    본 서비스는 투자 진입 장벽을 획기적으로 낮추어, 적립 최소 금액 1,000원부터 시작하실 수 있습니다. 큰 금액을 한 번에 투자하는 부담
    없이, 커피 한 잔 값보다 적은 금액으로도 글로벌 기업이나 국내 우량 기업의 주주가 되는 경험을 누리십시오.


    다만, 적립식 투자 또한 주식 및 펀드와 같은 투자 상품을 매수하는 서비스이므로 원금이 보장되지 않습니다. 가람증권은 적합성 원칙에 따라 고객님의
    투자 성향을 고려하여 상품을 안내하며, 최종적인 투자 판단의 책임은 고객님께 있음을 알려드립니다. 또한, 2026년 1월 1일부터는 국내 상장주식
    매도 시 코스피와 코스닥 종목 모두 0.20%의 증권거래세(농어촌특별세 포함)가 적용됩니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
  document_type: product_sheet
  source_authority: official
  placeholder: true
