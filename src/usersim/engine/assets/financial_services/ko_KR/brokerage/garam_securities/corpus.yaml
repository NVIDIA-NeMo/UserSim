- id: fbdade57-2593-5890-a94d-a78d6fb694b3
  title: '미국주식 거래: 상품설명서 주요 내용'
  body: '본 서비스 이용 전 다음의 법적 고지 사항을 반드시 확인하십시오.


    1. 적합성 원칙 준수: 가람증권은 금융위원회와 금융감독원의 감독 하에 고객님의 재산 상황, 투자 경험 및 목적에 적합한 상품을 권유하는 적합성
    원칙을 엄격히 준수합니다.

    2. 투자 위험 및 원금 비보장: 미국주식 거래는 시장 가격 변동에 따라 원금 손실이 발생할 수 있으며, 원금이 보장되지 않는 투자 상품입니다.

    3. 예금자 보호 안내: 고객님의 예탁금은 예금보험공사를 통해 1인당 최대 1억원까지 보호됩니다. 그러나 미국주식과 같은 투자상품은 보호 대상이
    아닙니다.

    4. 해외주식 과세: 연간 양도소득 기본공제 2,500,000원을 초과하는 매매차익에 대해서는 22%의 양도소득세(지방소득세 포함)가 부과되며,
    이는 다음 해 5월에 신고 및 납부하셔야 합니다.

    5. 책임 한계: 가람증권은 일반적인 금융 정보와 상품 안내를 제공하나, 특정 종목의 수익을 보장하거나 개별적인 세무·법률 자문을 제공하지
    않습니다. 모든 투자 판단의 책임은 고객님께 있습니다.'
