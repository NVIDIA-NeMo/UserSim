  mentions_tools: []
  institution_id: garam_securities
- id: 31fd4f79-9aef-5d2a-a452-2cfb16248541
  title: '중개형 ISA: 등록 정보 변경'
  body: '중개형 ISA 계좌의 등록 정보를 변경하고자 하시는 고객님께서는 다음 절차를 따라 주십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 당사는 보안을 위해 이 정보를 통해 본인 인증을 수행합니다.


    2. 변경 정보 요청: 변경을 원하시는 등록 정보(예: 연락처, 주소 등)를 말씀해 주십시오. 이때 비밀번호나 주민등록번호 전체와 같은 민감한
    정보는 절대 요구하지 않으므로, 요청하는 곳이 있다면 주의하시기 바랍니다.


    3. 변경 내용 검토 및 반영: 상담원이 요청하신 변경 사항을 시스템에 입력하고 확인 과정을 거칩니다.


    4. 처리 완료 확인: 등록 정보 변경이 완료되었다는 안내를 받으시면 모든 절차가 마무리됩니다. 변경 결과는 앱의 내 정보 메뉴에서 실시간으로
    확인하실 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 887d5569-d3be-570c-812a-dea5dab09a28
  title: '중개형 ISA: 로그인하거나 접속할 수 없을 때'
  body: '가람증권 앱에 로그인하시거나 중개형 ISA 계좌 정보에 접속하는 데 어려움이 있으신 경우, 다음 내용을 확인해 주십시오.


    [증상] 로그인 시도 시 오류 메시지가 발생하거나, 접속 후 계좌 목록에서 ISA 계좌가 보이지 않는 경우


    [원인 및 확인 순서]

    1. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오. 일시적인 네트워크 불안정으로 인해 접속이 제한될 수
    있습니다.

    2. 계정 정보 확인: 입력하신 아이디와 비밀번호가 정확한지 확인하십시오. 비밀번호를 여러 번 잘못 입력하신 경우 보안을 위해 계정이 일시적으로
    잠길 수 있습니다.

    3. 앱 버전 확인: 최신 버전의 가람증권 앱을 사용 중인지 확인하십시오. 구버전 앱에서는 최신 보안 정책으로 인해 접속이 차단될 수 있습니다.


    [해결 방법]

    - 비밀번호 분실 시: 앱 내 ''비밀번호 찾기/재설정'' 메뉴를 통해 본인 인증 후 새 비밀번호를 설정하십시오.

    - 계정 잠김 시: 본인 확인 절차를 거쳐 잠금을 해제하거나 상담원에게 해제 요청을 하십시오.


    [에스컬레이션]

    위의 방법으로도 해결되지 않는 경우, 당사 기술 지원팀으로 케이스를 이관하여 시스템 오류 여부를 정밀 분석합니다. 분석 결과에 따라 개별적으로
    조치 사항을 안내해 드리겠습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 840f15b6-173c-5fb4-b0a2-ae48b666fbcf
  title: '중개형 ISA: 이용 조건별 차이'
  body: '중개형 ISA의 가입 유형에 따른 주요 혜택 차이는 다음과 같습니다.


    - 일반형: 비과세 한도 2,000,000원 / 한도 초과 순이익 분리과세율 9.9%

    - 서민형: 비과세 한도 4,000,000원 / 한도 초과 순이익 분리과세율 9.9%

    - 공통 사항: 의무가입기간 3년 유지, 연간 납입 한도 20,000,000원, 총 납입 한도 100,000,000원'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: e67ec78a-fa18-59a6-ad62-dbf4a745591e
  title: '중개형 ISA: 상품 고르는 방법'
  body: '투자를 시작하실 때 일반 주식 계좌와 중개형 ISA 사이에서 고민하신다면 다음의 기준을 고려하십시오.


    중개형 ISA는 절세 혜택이 핵심입니다. 일반 계좌와 달리 순이익에 대해 2,000,000원(서민형 4,000,000원)까지 비과세 혜택을
    받을 수 있으며, 초과분에 대해서도 9.9%의 낮은 분리과세율이 적용됩니다. 반면, 의무가입기간 3년을 유지해야 한다는 조건이 있습니다.


    따라서 3년 이상의 중장기 투자를 계획하시고 세금을 효율적으로 줄이고 싶은 분께는 중개형 ISA가 최적의 선택입니다. 단, 단기적인 자금 회수가
    필요하거나 3년이라는 기간이 부담스러우신 분께는 일반 거래 서비스가 더 유연한 선택지가 될 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 51c98e28-ba70-5cf4-bca1-d995ed66b3ed
  title: '중개형 ISA: 개인정보 처리 안내'
  body: '가람증권은 금융위원회와 금융감독원의 감독 하에 고객님의 개인정보를 안전하게 처리하며, 관련 법령을 엄격히 준수합니다.


    1. 수집 및 이용 목적: 고객님의 성함, 생년월일 등의 정보는 계좌 개설, 본인 확인, 적합성 원칙에 따른 상품 권유 및 금융사고 방지를
    위한 본인 인증 목적으로만 사용됩니다.


    2. 정보 보호 및 관리: 수집된 정보는 암호화되어 저장되며, 권한이 부여된 담당자만이 업무상 필요한 범위 내에서 접근할 수 있습니다. 고객님의
    민감한 정보인 비밀번호나 주민등록번호 전체는 당사가 별도로 요구하거나 저장하지 않습니다.


    3. 예금자 보호 안내: 중개형 ISA 계좌 내의 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 단, 계좌를 통해 투자하신 주식,
    펀드, ELS 등 투자상품은 예금자보호 대상이 아니며, 투자 결과에 따라 원금 손실이 발생할 수 있고 원금이 보장되지 않음을 명시합니다.


    4. 제3자 제공: 법령에 규정된 경우나 금융당국의 요구가 있을 때를 제외하고는 고객님의 동의 없이 개인정보를 외부에 제공하지 않습니다.


    가람증권은 고객님의 신뢰를 바탕으로 투명하고 안전한 디지털 금융 환경을 제공하기 위해 최선을 다하겠습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: bba2e316-4049-55bc-a0bb-58a2e44162e2
  title: '중개형 ISA: 이 상품을 사칭한 사기 주의'
  body: '최근 중개형 ISA의 절세 혜택을 미끼로 고수익을 보장한다며 접근하는 사칭 사기 사례가 보고되고 있습니다. 가람증권은 절대로 특정
    종목의 수익을 보장하지 않으며, 중개형 ISA를 통한 투자는 원금이 보장되지 않는 투자 상품임을 다시 한번 안내드립니다.


    가람증권은 고객님께 계좌 정보 변경 등의 작업을 수행하기 전 성함과 생년월일을 통해 본인 인증을 진행하지만, 그 외의 카드 번호, 비밀번호,
    주민등록번호 전체와 같은 민감한 정보는 절대 요구하지 않습니다. 만약 가람증권 직원을 사칭하여 이러한 정보를 요구하거나, 비정상적인 경로로
    입금을 유도하는 연락을 받으셨다면 즉시 상담원에게 알려주십시오.


    부정 거래가 의심될 경우 당사는 즉각적인 계좌 보호 조치를 취하며, 모든 민원은 내부 규정에 따라 투명하고 신속하게 처리하고 있습니다. 고객님의
    소중한 자산을 보호하기 위해 항상 주의를 기울여 주시기 바랍니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: aaea9ec4-50a9-54b1-a201-a306ede27eee
  title: '중개형 ISA: 한도·제한과 유의사항'
  body: '중개형 ISA의 효율적인 운용을 위해 적용되는 납입 한도와 이용 제한 사항을 안내해 드립니다.


    1. 납입 한도

    - 연간 납입 한도: 20,000,000원 (미사용 한도는 다음 해로 이월 가능합니다.)

    - 총 납입 한도: 100,000,000원


    2. 가입 및 유지 제한

    - 의무가입기간: 3년 (해당 기간을 유지해야 절세 혜택을 온전히 누리실 수 있습니다.)

    - 가입 제한: 직전 3년 중 한 번이라도 금융소득종합과세 대상이었던 고객님은 가입이 제한됩니다.


    3. 투자 유의사항

    - 본 상품은 적합성 원칙에 따라 고객님의 투자 성향을 고려하여 권유됩니다. 하지만 주식, 펀드, ETF 등 투자 상품은 예금보험공사의 보호
    대상이 아니며 원금이 보장되지 않습니다.

    - 예탁금의 경우 예금보험공사를 통해 1인당 1억원까지 보호됩니다.


    상세한 가입 조건은 ''중개형 ISA: 가입 대상''에서 확인하시기 바랍니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: product_sheet
  source_authority: official
  placeholder: true
