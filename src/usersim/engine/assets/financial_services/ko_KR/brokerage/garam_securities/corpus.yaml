- id: d2cc433f-6179-5cd4-8718-09b0162af77a
  title: '적립식 투자: 수수료 안내'
  body: "적립식 투자 서비스 자체에 대한 별도의 이용료는 없으나, 매수되는 상품에 따라 다음과 같은 거래 비용이 발생합니다.\n\n- 매매\
    \ 수수료: 비대면 계좌 개설 고객님께는 시스템 안정성을 위한 최소한의 비용으로 책정된 경쟁력 있는 낮은 수수료를 적용하고 있습니다.\n-\
    \ 증권거래세(2026년 1월 1일 이후): \n  - 코스피 종목: 0.20%(증권거래세 0.05% + 농어촌특별세 0.15%)\n  -\
    \ 코스닥 종목: 0.20%\n- 배당소득세: 배당금 발생 시 15.4%가 원천징수됩니다.\n- 해외주식 양도소득세: 연 250만원 기본 공제\
    \ 후 22%(지방소득세 포함)가 부과되며, 다음 해 5월에 신고하셔야 합니다."
