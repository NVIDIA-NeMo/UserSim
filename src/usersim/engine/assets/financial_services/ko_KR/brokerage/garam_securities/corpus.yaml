- id: 272adfea-f919-5d2a-abc3-dc2e7ed6568f
  title: update_beneficiary 사용 기준
  body: '고객이 예탁금 출금 시 사용하는 등록 은행 계좌(수취인 정보)를 변경하고자 할 때, 상담원은 다음 절차를 수행하십시오.


    1. 고객의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오.

    2. 변경 대상이 되는 가람증권 계좌의 끝 4자리를 확인하고, get_accounts 도구를 사용하여 정확한 account_id를 확보하십시오.

    3. 새롭게 등록할 은행 명칭, 계좌 번호, 예금주 성함을 고객으로부터 정확히 확인하십시오.

    4. 확인된 account_id와 새로운 은행 계좌 정보를 update_beneficiary 도구에 입력하여 호출하십시오.

    5. 변경 처리가 성공적으로 완료되었음을 고객에게 안내하고, 이후부터는 변경된 계좌로 출금이 진행됨을 알리십시오.


    주의사항: 상담원은 어떠한 경우에도 고객의 은행 계좌 비밀번호나 보안카드 번호를 요구해서는 안 됩니다.'
