- id: 12683177-167e-54b5-868a-2adc9f309ead
  title: '국내주식 거래: 수수료와 비용'
  body: 'Q: 국내주식을 거래할 때 발생하는 수수료는 얼마입니까?

    A: 가람증권의 모바일 앱을 통해 거래하실 경우, 국내주식 거래 수수료율은 0.015%가 적용됩니다. 저희는 비대면 계좌 개설 고객님께 경쟁력
    있는 낮은 수수료를 제공하여 투자 진입 장벽을 낮추고 있습니다.


    Q: 주식을 매도할 때 내야 하는 세금이 있습니까?

    A: 네, 2026년 1월 1일부터 적용되는 기준에 따라 코스피 종목은 증권거래세와 농어촌특별세를 합해 0.2%, 코스닥 종목은 0.2%의
    증권거래세가 부과됩니다.


    Q: 배당금을 받을 때 세금을 떼나요?

    A: 네, 배당소득에 대해서는 15.4%가 원천징수된 후 지급됩니다.'
