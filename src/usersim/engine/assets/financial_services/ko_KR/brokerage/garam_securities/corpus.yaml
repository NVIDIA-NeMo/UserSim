- id: edf66a60-2132-59b2-9587-7291fc9b0608
  title: '개인형 퇴직연금(IRP): 거래가 거절되거나 제한되었을 때'
  body: '개인형 퇴직연금(IRP) 계좌에서 상품 매수나 납입 시 거래가 거절되는 경우, 다음 사항을 순차적으로 확인하십시오.


    증상: ''거래 불가'' 또는 ''한도 초과'' 메시지와 함께 주문이 처리되지 않음


    확인 및 해결 방법:

    1. 납입 한도 초과 여부 확인: 연금계좌 합산 연간 납입 한도인 18,000,000원을 초과하여 입금하려 했는지 확인하십시오. 한도를 초과한
    경우 납입이 제한됩니다.

    2. 투자 제한 상품 매수 시도 여부 확인: IRP 계좌에서는 개별 주식(국내/해외) 및 레버리지·인버스 ETF를 직접 매수할 수 없습니다.
    해당 상품을 선택하셨다면 일반 거래 계좌나 중개형 ISA 계좌를 이용하십시오.

    3. 적합성 원칙 준수 여부 확인: 고객님의 투자 성향보다 위험도가 높은 상품을 선택하신 경우, 적합성 원칙에 따라 거래가 제한될 수 있습니다.
    투자 성향 분석을 다시 수행하거나 적합한 상품으로 변경하십시오.


    위 사항을 모두 확인했음에도 거래가 제한된다면, 상담원에게 오류 메시지를 전달해 주십시오. 내부 절차에 따라 전문 처리 팀으로 에스컬레이션하여
    원인을 분석하고 해결 방안을 안내해 드리겠습니다.'
