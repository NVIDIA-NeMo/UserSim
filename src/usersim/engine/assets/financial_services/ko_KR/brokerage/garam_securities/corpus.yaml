- id: 97ec5bf2-d307-5d20-9536-5aa2edec2743
  title: '개인형 퇴직연금(IRP): 해지·변경·상품 전환'
  body: "개인형 퇴직연금(IRP) 계좌의 해지, 정보 변경 또는 보유 상품 전환 절차를 안내해 드립니다.\n\n1. 본인 확인: 상담원에게\
    \ 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 다음 단계 진행이 가능합니다.\n2. 요청 사항 전달: 계좌 해지, 등록 정보\
    \ 변경, 또는 특정 상품의 전환(매도 후 재매수) 중 원하시는 업무를 말씀해 주십시오.\n3. 상세 조건 확인: \n   - 해지 시: 연금\
    \ 외 수령에 해당하여 납입 원금과 수익에 대해 16.5%의 기타소득세가 발생함을 확인합니다.\n   - 상품 전환 시: 선택하신 상품의 위험\
    \ 등급과 적합성 원칙에 따른 투자 성향 일치 여부를 확인합니다.\n4. 최종 승인 및 결과 확인: 요청하신 내용의 최종 확인 후 처리가 완료됩니다.\
    \ 처리 결과는 앱 알림 또는 등록된 연락처로 안내해 드립니다.\n\n상품 전환 시에는 운용 상품의 매도 및 매수 시점에 따라 일시적으로 현금성\
    \ 자산으로 보유될 수 있습니다."
