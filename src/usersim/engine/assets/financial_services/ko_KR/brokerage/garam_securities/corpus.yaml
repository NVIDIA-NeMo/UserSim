- id: 264526af-da1b-5e63-8418-7468fb555f04
  title: '적립식 투자: 예상과 다른 수수료나 금액'
  body: '고객님께서 설정하신 적립 금액과 실제 계좌에서 출금된 금액이나 적용된 수수료가 다르다고 느끼시는 경우, 다음 내용을 확인하십시오.


    1. 적립 최소 금액 확인: 설정하신 금액이 적립 최소 금액인 1,000원 이상인지 확인하십시오.

    2. 거래 수수료 및 세금 반영 여부: 적립식 투자는 단순히 금액을 예치하는 것이 아니라 실제 상품을 매수하는 과정입니다. 따라서 매수 시
    발생하는 거래 수수료와 2026년부터 적용되는 증권거래세(코스피 0.20%, 코스닥 0.20%) 등이 포함되어 실제 체결 금액과 차이가 날
    수 있습니다.

    3. 소수점 투자 여부: 미국 주식 등 소수점 투자를 이용하시는 경우, 환율 변동에 따라 원화 환산 금액이 달라질 수 있습니다.


    위 내용을 확인했음에도 금액이 명백히 잘못 계산되었다고 판단되시면 상담원에게 상세 내역 조사를 요청하십시오. 상담원은 고객님의 거래 명세서를
    검토한 후, 오류가 확인될 경우 내부 절차에 따라 정산 및 보정 작업을 진행하며 그 결과를 고객님께 안내해 드립니다.'
