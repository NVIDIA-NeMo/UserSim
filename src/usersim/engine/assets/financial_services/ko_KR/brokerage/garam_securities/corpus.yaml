- id: 31e6b968-b63f-5c8d-b149-9f759a524db4
  title: '미국주식 거래: 해외주식 양도소득세율(지방소득세 포함) 안내'
  body: 'Q: 미국주식 투자로 수익이 났을 때 세금은 어떻게 계산하나요?


    A: 해외주식 투자를 통해 얻은 매매차익은 양도소득세 대상입니다. 1년(1월 1일~12월 31일) 동안 발생한 총 수익에서 해외주식 양도소득
    기본공제(연) 2,500,000원을 공제합니다. 공제 후 남은 금액에 대해 해외주식 양도소득세율(지방소득세 포함) 22%가 적용됩니다.


    Q: 세금 신고와 납부는 언제 하나요?


    A: 해외주식 양도소득세는 확정신고 대상으로, 수익이 발생한 다음 해 5월에 관할 세무서에 신고하고 납부하셔야 합니다.


    더 자세한 내용은 ''미국주식 거래: 상품 개요''를 참고하시기 바랍니다.'
