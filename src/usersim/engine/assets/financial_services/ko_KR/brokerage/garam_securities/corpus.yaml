- id: f4615f2c-66f3-5196-8192-09943ab1b43b
  title: '국내주식 거래: 로그인하거나 접속할 수 없을 때'
  body: '국내주식 거래 서비스를 이용하시려는데 로그인 오류가 발생하거나 접속이 되지 않는 경우, 다음 순서에 따라 조치해 주십시오.


    [증상: 로그인 실패 또는 접속 불가]


    1. 네트워크 상태 확인

    - Wi-Fi 또는 모바일 데이터 연결이 안정적인지 확인하십시오. 일시적인 통신 장애일 경우 비행기 모드를 켰다 끄거나 네트워크를 재설정해
    보십시오.


    2. 계정 정보 및 잠금 확인

    - 비밀번호를 잘못 입력하여 계정이 잠긴 경우인지 확인하십시오. 비밀번호 찾기/재설정 기능을 통해 인증 후 다시 시도하십시오.


    3. 앱 업데이트 상태 확인

    - 가람증권 모바일 앱이 최신 버전인지 확인하십시오. 구버전 앱의 경우 보안 정책상 접속이 제한될 수 있으므로 앱스토어에서 업데이트를 진행하십시오.


    4. 해결되지 않을 경우의 처리

    - 위 단계로 해결되지 않는 경우, 상담원에게 오류 메시지 내용을 말씀해 주십시오. 당사에서는 내부 시스템 로그를 분석하여 기술적 원인을 파악하고,
    전문 기술팀으로 에스컬레이션하여 해결 방안을 마련한 뒤 고객님께 진행 상황을 안내해 드리겠습니다.'
