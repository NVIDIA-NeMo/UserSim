- id: 18136c4a-c96f-5270-9465-65f2ff319dc5
  title: '연금저축계좌: 명세서나 내역과 맞지 않을 때'
  body: "계좌 명세서상의 금액이나 거래 내역이 예상과 다를 때, 다음의 요인을 먼저 확인해 보십시오.\n\n- 증상: \"입금한 금액이 적게\
    \ 표시됩니다\", \"수익금이 생각보다 적습니다\"\n- 확인 사항:\n  1. 배당소득 원천징수: 보유하신 펀드나 ETF에서 발생한 배당금에는\
    \ 15.4%의 세율로 원천징수가 이루어지므로, 실제 입금액은 세후 금액으로 표시됩니다.\n  2. 연금 수령 시 세율 적용: 55세 이후\
    \ 연금으로 수령하시는 경우, 나이에 따라 연금소득세율(55세~70세 미만 5.5%, 70세~80세 미만 4.4%, 80세 이상 3.3%)이\
    \ 차등 적용되어 수령액이 달라집니다.\n  3. 분리과세 기준 초과: 사적연금 분리과세 기준 금액(연)인 15,000,000원을 초과하여\
    \ 수령하시는 경우, 종합과세와 16.5% 분리과세 중 선택해야 하므로 세금 계산 방식이 달라질 수 있습니다.\n\n위의 세금 적용 사항을\
    \ 확인하신 후에도 내역이 맞지 않는다고 판단되시면, 상세 거래 일시와 함께 상담원에게 조사를 요청하십시오. 당사는 관련 법규에 따라 정확한\
    \ 산출 근거를 확인하여 안내해 드리겠습니다."
