- id: 51699548-5f83-5307-ad14-a714d840eefd
  title: '연금저축계좌: 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 노후 자산인 연금저축계좌를 안전하게 보호하기 위해 최선을 다하고 있습니다. 최근 금융기관을 사칭하여 개인정보를
    요구하는 사례가 늘고 있으니 각별히 주의하시기 바랍니다.


    가람증권은 어떠한 경우에도 고객님의 비밀번호, 카드 번호, 주민등록번호 전체 또는 보안 매체 정보를 요구하지 않습니다. 계좌 정보 변경이나
    상태 변경 작업을 수행할 때는 오직 고객님의 성함과 생년월일만을 통해 본인 인증을 수행합니다.


    만약 출처가 불분명한 링크가 포함된 메시지를 받으셨거나, 가람증권 직원을 사칭하여 민감한 정보를 요구하는 전화를 받으신 경우 즉시 상담원에게
    알려주십시오. 부정 거래가 의심되는 상황에서는 즉각적인 계좌 보호 조치를 취하여 자산 유출을 방지하겠습니다.


    고객님의 안전한 투자를 위해 정기적으로 비밀번호를 변경하시고, 타인에게 계좌 정보를 공유하지 마십시오. 가람증권은 금융감독원과 금융위원회의
    가이드라인을 준수하며 고객님의 자산을 보호하겠습니다.'
