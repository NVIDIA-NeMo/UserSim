- id: 13c1e3ba-681f-5545-89af-0ed4649bfac6
  title: '국내주식 거래: 진행 상황과 내역 확인'
  body: '현재 보유하신 주식의 상태나 과거 거래 내역을 확인하는 방법은 다음과 같습니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 계좌 정보 접근이 가능합니다.

    2. 확인 요청: ''국내주식 거래 내역 확인'' 또는 ''현재 보유 종목 및 수량 확인''을 요청하십시오.

    3. 상세 내역 수신: 저희가 해당 계좌의 최근 매매 체결 내역, 평균 매입 단가, 그리고 현재 평가 금액을 안내해 드립니다.

    4. 결과 확인: 안내받으신 내역이 고객님께서 기억하시는 거래 시점 및 수량과 일치하는지 확인하십시오.


    만약 안내받으신 내역 중 실제 거래와 다른 부분이 있다면, 즉시 상담원에게 말씀하시어 상세 조사를 요청하시기 바랍니다. 구체적인 불일치 해결
    방법은 ''국내주식 거래: 명세서나 내역과 맞지 않을 때''에서 확인하실 수 있습니다.'
