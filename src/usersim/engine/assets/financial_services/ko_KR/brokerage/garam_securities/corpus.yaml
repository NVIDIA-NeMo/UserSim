- id: d5e2e0ba-c964-5759-af4f-bf92c6c859b3
  title: '개인형 퇴직연금(IRP): 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 노후 자산을 보호하기 위해 강력한 보안 체계를 운영하고 있습니다. 특히 개인형 퇴직연금(IRP)과 같이
    장기적인 관리가 필요한 계좌의 경우, 부정 사용 방지를 위한 본인 확인 절차가 매우 중요합니다.


    계좌 정보 변경이나 상태 변경과 같은 민감한 작업 전에는 반드시 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 가람증권은 어떠한
    경우에도 고객님의 카드 번호, 계좌 비밀번호, 주민등록번호 전체와 같은 민감한 정보를 요구하지 않습니다. 만약 당사를 사칭하여 이러한 정보를
    요구하는 연락을 받으셨다면, 즉시 상담원에게 알리거나 계좌 보호 조치를 요청하십시오.


    부정 거래가 의심되는 정황이 발견될 경우, 가람증권은 즉각적으로 계좌 보호 조치를 취하며 관련 법규 및 내부 규정에 따라 투명하고 신속하게
    처리합니다. 고객님의 안전한 투자 환경을 위해 보안 수칙을 준수해 주시기 바랍니다.'
