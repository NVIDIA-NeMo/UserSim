  institution_id: garam_securities
- id: 58223745-b3ee-55e6-ad7f-9222bbf57af1
  title: '중개형 ISA: 비과세 한도(서민형) 안내'
  body: '질문: 중개형 ISA 서민형의 비과세 한도는 얼마입니까?


    답변: 중개형 ISA 서민형 가입 고객님의 비과세 한도(서민형)는 4,000,000원입니다. 계좌 내에서 발생한 순이익 중 4,000,000원까지는
    세금을 부과하지 않으며, 이를 초과하는 금액에 대해서는 분리과세 혜택이 적용됩니다.


    자세한 한도 비교는 ''중개형 ISA: 비과세 한도(일반형) 안내''를 참고하여 주십시오.'
