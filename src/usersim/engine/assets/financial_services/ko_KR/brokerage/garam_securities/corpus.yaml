- id: 98e69e44-e7ef-53f2-b04c-71ec8bbdd113
  title: '개인형 퇴직연금(IRP): 약관'
  body: '본 약관은 가람증권과 고객 간의 개인형 퇴직연금(IRP) 계약에 관한 권리와 의무를 규정합니다.


    1. 수수료 및 비용: 비대면으로 계좌를 개설한 고객의 경우 계좌 수수료는 0원입니다. 이는 최적의 거래 환경 유지를 위한 가람증권의 비용
    정책에 따릅니다.

    2. 납입 한도: 연금계좌의 연간 납입 한도는 합산하여 18,000,000원까지이며, 고객은 이 한도 내에서 자유롭게 납입할 수 있습니다.

    3. 예금자 보호: 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 단, IRP 계좌 내에서 운용되는 주식, 펀드 등 투자상품은
    보호 대상이 아니며 원금이 보장되지 않습니다.

    4. 중도 인출 및 해지: 연금 수령 요건을 충족하지 않고 연금이 아닌 형태로 인출하거나 계좌를 해지하는 경우, 관련 법령에 따라 16.5%의
    기타소득세가 부과됩니다.

    5. 계약의 종료: 고객의 해지 요청 또는 법령 및 내부 규정에 따른 강제 종료 사유 발생 시 본 계약은 종료됩니다.'
