- id: f0185b7c-8cc3-5871-97f0-1752124f6ee7
  title: '미국주식 거래: 등록 정보 변경'
  body: '미국주식 거래 계좌의 등록 정보(성함, 연락처, 주소 등)를 변경하는 방법입니다.


    [준비 사항]

    - 변경하고자 하는 최신 정보


    [변경 절차]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 인증이 완료되어야 정보 변경이 가능합니다.

    2. 변경 요청: 변경하시려는 항목(예: 연락처, 주소)과 새로운 정보를 정확히 말씀해 주십시오.

    3. 정보 검토: 저희가 요청하신 변경 내용을 다시 한번 확인해 드립니다. 내용이 맞는지 확인해 주십시오.

    4. 처리 완료: 변경 사항이 시스템에 반영되면 완료 안내를 받으시게 됩니다.


    [확인 사항]

    - 민감 정보 보호를 위해 비밀번호나 주민등록번호 전체는 절대 요구하지 않습니다. 만약 이를 요구하는 요청이 있다면 즉시 중단하십시오.'
