- id: cafbd35f-3a92-53a2-ba9d-d3c4816b3c15
  title: 수수료·요금 안내
  body: '가람증권은 투자 진입 장벽을 낮추기 위해 비대면 계좌 개설 고객님께 경쟁력 있는 낮은 수수료를 제공하고 있습니다. 모든 수수료는 최적의
    거래 환경 유지와 시스템 안정성을 위한 최소한의 비용으로 책정됩니다.


    종합매매계좌의 기본 서비스 이용료는 무료이며, 구체적인 거래 수수료는 투자 상품별로 다르게 적용됩니다. 국내주식, 미국주식, IRP 등 각
    상품의 상세 수수료율은 해당 상품의 수수료 안내 문서를 확인해 주시기 바랍니다.'
  domain: brokerage_investing
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 6e7e1066-0006-513c-b5a3-4cdee6ec144d
  title: 자주 묻는 질문
  body: 'Q: 계좌 개설은 어떻게 하나요?

    A: 가람증권 모바일 앱을 통해 비대면으로 간편하게 신청하실 수 있습니다. 신분증 확인 등 실명확인 절차가 필요합니다.


    Q: 고객센터 상담 가능 시간은 언제입니까?

    A: 평일 영업시간 내에 모바일 앱과 온라인 고객센터를 통해 실시간 상담을 지원하고 있습니다.


    Q: 본인 확인은 어떤 방식으로 진행되나요?

    A: 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 비밀번호나 주민등록번호 전체와 같은 민감한 정보는 절대 요구하지 않습니다.'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: c26d45c8-269e-5ed0-8295-73cc5d8e5537
  title: '법령·제도 안내: 주식·ISA·연금계좌'
  body: '가람증권은 금융위원회와 금융감독원의 감독 하에 자본시장과 금융투자업에 관한 법률을 엄격히 준수합니다.


    1. 투자자 보호 및 예금자 보호

    고객님의 예탁금은 증권회사의 재산과 분리하여 한국증권금융에 예치하며, 증권회사 파산 시 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 단,
    주식, 펀드, ELS, CMA 등 투자상품은 보호 대상이 아니며 원금이 보장되지 않습니다.


    2. 세금 안내

    - 국내 상장주식: 2026년 1월 1일부터 코스피 종목은 증권거래세 0.05%와 농어촌특별세 0.15%를 합산한 0.20%, 코스닥 종목은
    0.20%의 세금이 부과됩니다. 대주주가 아닌 경우 매매차익은 과세되지 않습니다.

    - 해외주식: 연 250만원을 공제한 후 매매차익에 대해 지방소득세 포함 22%의 양도소득세가 부과되며, 다음 해 5월에 신고해야 합니다.

    - 배당소득: 15.4%가 원천징수됩니다.


    3. 적합성 원칙 및 제한

    증권회사는 고객님의 재산 상황, 투자 경험, 목적에 맞지 않는 상품을 권유해서는 안 되는 적합성 원칙을 준수합니다. 상담원은 특정 종목의 수익을
    보장하거나 개별적인 세무 및 법률 자문을 제공하지 않습니다.'
