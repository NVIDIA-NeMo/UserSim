- id: bd105d94-692b-59e1-b235-b21d0670f1a4
  title: '국내주식 거래: 상품설명서 주요 내용'
  body: '본 서비스는 자본시장과 금융투자업에 관한 법률에 따라 금융위원회의 인가를 받고 금융감독원의 감독을 받는 가람증권에서 제공합니다.


    **투자자 보호 및 위험 고지**

    - 원금 비보장: 국내주식 및 펀드 등 투자상품은 예금자보호법에 따른 보호 대상이 아니며, 투자 결과에 따라 원금 손실이 발생할 수 있고 그
    책임은 고객님께 귀속됩니다.

    - 예금자 보호: 고객님이 맡기신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다.

    - 적합성 원칙: 당사는 고객님의 재산 상황, 투자 경험 및 목적에 적합한 상품을 권유해야 하는 적합성 원칙을 엄격히 준수합니다.


    **세금 관련 안내**

    - 증권거래세: 2026년 1월 1일부터 상장주식 매도 시 코스피 종목은 0.2%(증권거래세 0.05% + 농어촌특별세 0.15%), 코스닥
    종목은 0.2%의 세율이 적용됩니다.

    - 배당소득세: 배당소득 발생 시 15.4%가 원천징수됩니다.


    상담원은 특정 종목의 수익을 보장하거나 개별적인 세무 조언을 제공하지 않습니다.'
