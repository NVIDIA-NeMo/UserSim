  title: '미국주식 거래: 이용 조건별 차이'
  body: '| 구분 | 이용 조건 | 결과 |

    | :--- | :--- | :--- |

    | 거주 상태 | 대한민국 거주자 | 서비스 가입 및 모든 거래 기능 이용 가능 |

