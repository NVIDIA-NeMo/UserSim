  title: '미국주식 거래: 필요 서류'
  body: '미국주식 거래 서비스 이용을 위해 필요한 서류는 다음과 같습니다.


    - 개인 고객: 본인 확인이 가능한 유효 신분증 (주민등록증, 운전면허증 또는 여권)

    - 계좌 개설: 비대면 계좌 개설을 위한 본인 명의의 스마트폰 및 타행 계좌 인증

    - 해외 거주자: 거주 국가의 신분 증명 서류 및 주소지 확인 서류 (별도 요청 시)


