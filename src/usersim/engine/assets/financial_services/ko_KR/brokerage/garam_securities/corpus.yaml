- id: 201216de-38d5-5d52-a252-7fa89804bd45
  title: initiate_securities_transfer 도구 설명서
  body: "이 도구는 타 증권회사 계좌에 있는 주식이나 펀드를 가람증권 계좌로 옮기는 대체입고 신청을 처리합니다.\n\n- 입력 인자:\n \
    \   - `account_id`: 자산을 받을 가람증권 계좌 ID\n    - 타사 정보: 자산이 보관된 금융회사 명칭\n    - 이전\
    \ 자산: 옮기고자 하는 종목 및 수량 정보\n- 주요 효과: 타사 증권 자산의 가람증권 이전 프로세스 개시\n\n상담원은 본인 인증이 완료된\
    \ 고객의 요청을 받아 이 도구를 직접 호출하며, 고객에게 별도의 서류 제출을 위해 외부 사이트로 이동하도록 안내하는 대신 이 도구를 통해\
    \ 신청을 접수합니다."
