- id: 36bcf3a1-6f44-598c-9b98-f856a9d470d8
  title: '개인형 퇴직연금(IRP): 자주 하는 업무의 처리 절차'
  body: '개인형 퇴직연금(IRP) 계좌의 납입 및 투자 상품 변경 등 주요 업무 처리 절차입니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 업무 요청: 상담원에게 ''IRP 계좌 납입'' 또는 ''투자 상품 변경''을 요청하십시오.

    2. 본인 인증: 상담원이 요청하는 성함과 생년월일을 말씀해 주십시오.

    3. 세부 사항 결정:

    - 납입 시: 입금하실 금액을 말씀하십시오. (연간 합산 한도 18,000,000원 이내)

    - 상품 변경 시: 현재 보유 중인 상품과 교체할 새로운 상품(펀드, ETF, 예금 등)을 지정하십시오.

    4. 적합성 확인: 상품 변경 시, 해당 상품이 고객님의 투자 성향에 적합한지 상담원이 다시 한번 안내해 드립니다.

    5. 처리 완료 및 확인: 상담원이 처리 결과를 안내하며, 고객님은 변경된 내역이나 입금 완료 메시지를 통해 확인하실 수 있습니다.


    주의: IRP 계좌에서는 개별 주식 및 레버리지/인버스 ETF를 선택하실 수 없음을 유의하시기 바랍니다.'
  domain: brokerage_investing
