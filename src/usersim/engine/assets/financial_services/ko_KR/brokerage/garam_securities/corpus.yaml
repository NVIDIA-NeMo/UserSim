- id: dbe84b65-ea24-5c58-aa4a-85892f192cf6
  title: '연금저축계좌: 안전한 이용을 위한 수칙'
  body: '가람증권은 고객님의 소중한 노후 자산을 보호하기 위해 최선을 다하고 있습니다. 안전한 금융 거래를 위해 다음 수칙을 반드시 준수하여
    주십시오.


    첫째, 가람증권은 어떤 경우에도 고객님의 카드 번호, 비밀번호, 주민등록번호 전체와 같은 민감한 정보를 요구하지 않습니다. 특히 계좌 비밀번호나
    보안카드 번호 전체를 입력하게 하는 요구는 명백한 사기이므로 각별히 주의하십시오.


    둘째, 계좌 정보 변경 등 주요 상태 변경 작업 시에는 반드시 고객님의 성함과 생년월일을 통해 본인 인증을 수행합니다. 이 외의 방식으로 개인정보를
    요구하는 연락은 가람증권의 공식 서비스가 아님을 알려드립니다.


    셋째, 출처가 불분명한 링크(URL)나 앱 설치 파일은 절대 클릭하지 마십시오. 만약 부정 거래가 의심되거나 개인정보 유출이 우려되는 경우,
    즉시 고객센터를 통해 계좌 보호 조치를 요청하시기 바랍니다. 가람증권은 고객님의 자산 안전을 최우선으로 하며, 신속하고 투명하게 대응하겠습니다.'
