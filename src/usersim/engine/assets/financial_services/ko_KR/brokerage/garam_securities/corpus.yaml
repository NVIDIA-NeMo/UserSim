- id: 5f34cf8a-eeaa-5896-a8d0-ca2e46a887ff
  title: '개인형 퇴직연금(IRP): 이 상품을 사칭한 사기 주의'
  body: '가람증권의 개인형 퇴직연금(IRP) 상품을 사칭하여 고수익을 보장하거나 특별 혜택을 제시하는 금융 사기에 각별히 주의하시기 바랍니다.


    최근 특정 종목의 수익률을 보장하며 개인형 퇴직연금(IRP) 계좌로의 이전을 유도하거나, 가입을 조건으로 개인정보를 요구하는 사례가 발생하고
    있습니다. 가람증권은 어떤 경우에도 특정 상품의 수익을 보장하지 않으며, 적합성 원칙에 따라 고객님의 투자 성향에 맞는 상품만을 안내합니다.


    가람증권은 본인 확인을 위해 고객님의 성함과 생년월일만을 확인합니다. 비밀번호, 계좌 비밀번호, 카드 번호, 주민등록번호 전체 등 민감한 정보는
    절대로 요구하지 않습니다. 만약 이러한 정보를 요구하는 연락을 받으셨다면 즉시 대화를 중단하십시오.


    부정 거래가 의심되거나 사기 시도를 발견하신 경우, 즉시 가람증권 고객센터로 신고하여 계좌 보호 조치를 취하시기 바랍니다. 신속한 신고는 피해를
    최소화하는 가장 확실한 방법입니다.'
