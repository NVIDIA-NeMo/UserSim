- id: 1ad15aef-499e-5dd7-b742-0ddc832a43b0
  title: '개인형 퇴직연금(IRP): 처리가 끝나지 않거나 보류 중일 때'
  body: '개인형 퇴직연금(IRP) 계좌 개설이나 자금 이체 요청이 ''처리 중'' 또는 ''보류'' 상태로 지속될 경우 다음과 같이 확인하십시오.


    [예상 원인 및 확인 사항]

    1. 본인 인증 정보 불일치: 가입 시 입력하신 성함이나 생년월일이 등록 정보와 다를 경우 처리가 보류될 수 있습니다. 정보가 정확한지 다시
    확인해 주십시오.

    2. 타사 이전 처리 지연: 타 금융기관에서 IRP 자산을 이전하시는 경우, 기존 기관의 처리 절차에 따라 영업일 기준 수일이 소요될 수 있습니다.

    3. 납입 한도 초과: 연금계좌 연간 납입 한도인 18,000,000원을 초과하여 입금을 시도하신 경우 처리가 거절되거나 보류됩니다.


    [해결 방법]

    - 위 사항을 확인하신 후에도 문제가 지속되면 상담원에게 보류 상태 해제를 요청하십시오.

    - 저희는 내부 절차에 따라 즉시 해당 건을 전문 처리 팀으로 에스컬레이션하여 확인 후 진행 상황을 안내해 드리겠습니다.'
