- id: ff5e3971-4371-5d04-9170-124fdad0373f
  title: '미국주식 거래: 금리·요율이 정해지는 방식과 적용'
  body: '미국주식 거래 서비스에 적용되는 주요 요율의 산정 방식과 적용 기준은 다음과 같습니다.


    - 미국주식 거래 수수료율: 0.25%로 고정 적용됩니다. 모든 매수 및 매도 거래 금액에 대해 동일한 비율로 부과됩니다.

    - 환전 수수료 우대율: 95%가 적용됩니다. 이는 외화 환전 시 발생하는 스프레드 비용의 95%를 감면하여 고객에게 제공하는 방식입니다.

    - 해외주식 양도소득세율: 지방소득세를 포함하여 22%가 적용됩니다. 이는 법정 세율에 따르며, 연간 해외주식 양도소득 기본공제 2,500,000원을
    차감한 후의 과세표준 금액에 곱하여 산출합니다.


    상기 요율은 금융당국의 규제 변경이나 회사의 서비스 정책 변경 시 조정될 수 있으며, 변경 시 고객님께 사전 안내드립니다.'
