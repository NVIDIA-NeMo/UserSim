  institution_id: garam_securities
- id: ee4d9d86-64e4-51a2-88cd-393381c040b8
  title: '적립식 투자: 상품설명서 주요 내용'
  body: '본 서비스 이용 전 다음의 규정 및 위험 고지를 반드시 확인하십시오.


    1. 원금 비보장: 적립식 투자를 통해 매수하는 주식, 펀드, ETF 등의 투자 상품은 예금자보호법에 따른 보호 대상이 아니며, 투자 결과에
    따라 원금 손실이 발생할 수 있습니다.

    2. 예금자보호 안내: 고객님이 입금하신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 실제 매수된 투자 상품은 보호되지 않습니다.

    3. 적합성 원칙: 가람증권은 고객님의 재산 상황, 투자 경험 및 목적에 적합한 상품을 권유하며, 고객님께서는 본인의 투자 성향을 정확히 알릴
    의무가 있습니다.

    4. 세금 안내: 2026년 1월 1일부터 상장주식 매도 시 코스피 및 코스닥 종목에 대해 0.20%의 세금이 부과됩니다. 해외주식의 경우
    연 250만원 공제 후 22%의 양도소득세가 발생합니다.

    5. 책임 소재: 가람증권은 일반적인 금융 정보만을 제공하며, 특정 종목의 수익을 보장하거나 개별적인 세무/법률 자문을 하지 않습니다. 모든
    투자 판단의 책임은 고객님께 있습니다.'
  domain: brokerage_investing
  product_category: garam_jeokrip
