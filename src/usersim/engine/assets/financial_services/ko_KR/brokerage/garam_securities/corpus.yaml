  institution_id: garam_securities
- id: 15a6bf81-6a93-5a89-8603-b7ae59885d84
  title: '연금저축계좌: 예상과 다른 수수료나 금액'
  body: '고객님께서 확인하신 잔액이나 수령 금액이 예상과 다를 때 확인해야 할 사항입니다.


    **증상: 중도 인출 금액이 생각보다 적게 입금되었습니다.**

    - 원인: 연금저축계좌에서 연금 외의 형태로 자금을 인출하신 경우, 세법에 따라 16.5%의 기타소득세가 원천징수되기 때문입니다.

    - 확인 방법: 인출 내역서에서 ''기타소득세'' 항목으로 16.5%가 차감되었는지 확인하십시오.

    - 해결: 이는 법정 과세 사항으로 환급이 불가능하며, 향후 연금 형태로 수령하시어 낮은 세율을 적용받으시는 것을 권장합니다.


    **증상: 배당금 입금액이 예상보다 낮습니다.**

    - 원인: 국내외 주식 및 펀드에서 발생하는 배당소득에는 15.4%의 배당소득세가 원천징수됩니다.

    - 확인 방법: 거래 내역에서 배당금 총액과 원천징수 세액 15.4%를 확인하십시오.


    **증상: 납입 한도 초과로 입금이 되지 않습니다.**

    - 원인: 연금계좌 연간 납입 한도인 18,000,000원을 모두 소진하셨을 가능성이 큽니다.

    - 해결: 현재까지의 총 납입액을 확인하시고, 한도 변경이 필요한 경우 상담원에게 요청하시어 절차를 진행하십시오. 전문적인 처리가 필요한 경우
    내부 절차에 따라 단계적으로 에스컬레이션하여 해결해 드리겠습니다.'
  domain: brokerage_investing
  product_category: garam_pension_savings
  document_type: troubleshooting
  source_authority: official
