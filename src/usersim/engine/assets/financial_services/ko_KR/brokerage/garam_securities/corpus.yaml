- id: 549f6f68-9535-5f8b-b88a-a5cefb0d4061
  title: '미국주식 거래: 거래가 거절되거나 제한되었을 때'
  body: '미국주식 매수 또는 매도 주문이 거절되거나 제한되는 경우, 다음의 원인을 순차적으로 확인하십시오.


    1. 증거금 부족: 주문하려는 금액보다 계좌 내 예수금이 부족한지 확인하십시오. 특히 환전되지 않은 원화로 주문 시, 적용 가능한 환전 한도를
    초과했는지 점검해야 합니다.

    2. 시장 운영 시간: 미국 주식 시장의 정규 거래 시간 및 프리마켓/애프터마켓 운영 시간인지 확인하십시오.

    3. 종목 제한: 해당 종목이 거래 정지 상태이거나, 위험 종목으로 지정되어 매수 제한이 걸려 있는지 확인하십시오.

    4. 본인 인증 미비: 계좌 상태 변경이나 고액 거래 전 본인 확인 절차가 누락되었는지 확인하십시오.


    만약 위 사항에 문제가 없음에도 거래가 제한된다면, 상담원에게 요청하여 내부 컴플라이언스 팀의 제한 사유를 확인하십시오. 저희가 내부 절차에
    따라 에스컬레이션하여 상세 사유를 파악한 후, 제한 해제 방법이나 추가 필요 서류를 안내해 드리겠습니다.'
