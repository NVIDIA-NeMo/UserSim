- id: df2fcfa6-f7e6-5631-9a33-3f448f194277
  title: '연금저축계좌: 수수료 안내'
  body: '가람증권 연금저축계좌의 수수료 체계는 다음과 같습니다.


    - 비대면 계좌 개설 수수료: 가람증권은 디지털 중심의 온라인 증권회사로서, 비대면으로 계좌를 개설한 고객님께 경쟁력 있는 낮은 수수료를 제공합니다.

    - 수수료 책정 원칙: 모든 수수료는 최적의 거래 환경 유지와 시스템 안정성을 위한 최소한의 비용으로 책정됩니다.


    상세한 거래 상품별(펀드, ETF 등) 수수료는 개별 상품 설명서 및 거래 화면에서 실시간으로 확인하실 수 있습니다.'
