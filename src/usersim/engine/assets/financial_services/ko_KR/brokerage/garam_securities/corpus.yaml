  mentions_tools: []
  institution_id: garam_securities
- id: 5ae391c5-af01-5478-a08c-1e25ddd5864e
  title: '중개형 ISA: 비과세 한도(일반형) 안내'
  body: '질문: 중개형 ISA 일반형의 비과세 한도는 얼마인가요?


    답변: 중개형 ISA 일반형의 비과세 한도는 순이익 기준 2,000,000원입니다. 발생한 순이익 중 2,000,000원까지는 세금이 부과되지
    않으며, 이 한도를 초과하는 순이익에 대해서는 9.9%의 세율로 분리과세가 적용되어 일반 계좌 대비 절세 효과를 누리실 수 있습니다.


    더 자세한 내용은 ''중개형 ISA: 상품 개요''를 참고해 주십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: faq
