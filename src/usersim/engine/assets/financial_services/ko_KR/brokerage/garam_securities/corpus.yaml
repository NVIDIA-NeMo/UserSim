  institution_id: garam_securities
- id: 51ddbe65-208c-595b-ad1c-029a8396eef6
  title: '중개형 ISA: 총 납입 한도 안내'
  body: '질문: 중개형 ISA 계좌에 최대로 납입할 수 있는 금액은 얼마입니까?

    답변: 중개형 ISA의 총 납입 한도는 100,000,000원입니다.


    질문: 연간 납입 한도가 있는데, 올해 다 채우지 못하면 어떻게 되나요?

    답변: 연간 납입 한도는 20,000,000원이며, 해당 연도에 사용하지 않은 납입 한도는 다음 해로 이월되어 사용할 수 있습니다.


    질문: 납입 한도 초과 시 어떻게 처리되나요?

    답변: 총 납입 한도인 100,000,000원을 초과하여 입금하시는 것은 불가능하며, 한도 내에서만 납입이 가능합니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: e5b10316-9961-57db-8497-de9c27eda799
  title: '중개형 ISA: 해지·변경·상품 전환'
  body: '중개형 ISA 계좌의 해지나 정보 변경, 또는 다른 상품으로의 전환을 원하실 때 다음 절차를 따라주십시오.


    1. 본인 인증 수행: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 보안을 위해 비밀번호나 주민등록번호 전체는 요구하지 않습니다.

    2. 요청 사항 전달: 계좌 해지, 가입 정보 변경, 또는 타 상품으로의 전환 중 원하시는 업무를 말씀해 주십시오.

    3. 제약 사항 확인: 의무가입기간 3년 충족 여부를 확인합니다. 의무가입기간 이전에 해지하실 경우 비과세 혜택이 취소되고 일반 과세가 적용될
    수 있음을 안내받으실 것입니다.

    4. 처리 및 결과 확인: 요청하신 변경 사항이나 해지 절차가 완료되면, 최종 처리 결과와 함께 자금 인출 또는 전환 내역을 확인하실 수 있습니다.


    만약 만기 자금을 60일 이내에 연금계좌로 옮기시는 경우, 옮긴 금액의 10%(최대 300,000원)까지 추가 세액공제를 받으실 수 있으니
    참고하시기 바랍니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 7828ee43-ca95-5a1a-893a-e1bf5c97148b
  title: '중개형 ISA: 예상과 다른 수수료나 금액'
  body: "고객님께서 예상하신 수익금과 실제 정산 금액이 다르거나, 예상치 못한 세금이 부과되었다고 느끼시는 경우 다음 내용을 확인해 주십시오.\n\
    \n- 증상: 비과세 혜택을 기대했으나 세금이 원천징수된 경우\n- 원인: 중개형 ISA의 비과세 한도는 일반형 2,000,000원, 서민형\
    \ 4,000,000원입니다. 발생한 순이익이 이 한도를 초과하면, 초과분에 대해 9.9%의 분리과세율이 적용됩니다.\n- 확인 순서:\n\
    \  1. 본인의 가입 유형(일반형/서민형)을 확인하십시오.\n  2. 총 순이익이 비과세 한도(2,000,000원 또는 4,000,000원)를\
    \ 넘었는지 확인하십시오.\n  3. 초과 금액에 9.9%를 곱한 금액이 정산 내역과 일치하는지 확인하십시오.\n\n만약 위의 계산 방식과\
    \ 다른 금액이 청구되었다고 판단되시면, 가람증권 상담원에게 상세 내역 조사를 요청하십시오. 당사는 내부 절차에 따라 단계적으로 에스컬레이션하여\
    \ 정확한 원인을 파악하고 안내해 드리겠습니다."
  domain: brokerage_investing
  product_category: garam_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
