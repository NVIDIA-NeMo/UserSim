- id: dd6430cf-c6a5-561c-96f1-0bdfbd37b247
  title: '국내주식 거래: 가입과 이용 조건'
  body: 'Q: 국내주식 거래를 시작하려면 어떤 조건이 필요한가요?

    A: 가람증권의 비대면 계좌 개설을 통해 계좌를 보유하고 계신 고객님이라면 누구나 이용하실 수 있습니다. 가입 시 본인 확인 절차가 필요하며,
    적합성 원칙에 따라 투자 성향 분석을 완료하셔야 정상적인 거래가 가능합니다.


    Q: 이미 계좌가 있는데 서비스 신청을 따로 해야 합니까?

    A: 아닙니다. 가람증권 계좌를 보유하고 계신다면 모바일 앱의 주식 거래 메뉴에서 즉시 국내주식 거래를 시작하실 수 있습니다.


    Q: 이용 중 계좌 정보를 변경하고 싶을 때는 어떻게 합니까?

    A: 고객님의 성함과 생년월일을 통해 본인 인증을 수행하신 후, 변경 사항을 말씀해 주시면 저희가 처리해 드리겠습니다.'
  domain: brokerage_investing
  product_category: garam_domestic_stock
  document_type: faq
