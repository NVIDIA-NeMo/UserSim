- id: 636ca884-97bf-53fc-8fd0-64ca87830d16
  title: '미국주식 거래: 예상과 다른 수수료나 금액'
  body: '고객님께서 거래 후 예상했던 금액과 실제 정산 금액이 다르다고 말씀하시는 경우, 다음 항목들을 순차적으로 확인하십시오.


    1. 거래 수수료 확인: 미국주식 거래 시 적용되는 수수료율은 0.25%입니다. 거래 금액에 이 요율이 정확히 적용되었는지 확인하십시오.

    2. 세금 원천징수 여부: 배당금을 수령하신 경우, 배당소득에 대해 15.4%가 원천징수됩니다. 실입금액이 배당금 총액보다 적은 원인이 이것인지
    확인하십시오.

    3. 환전 스프레드 확인: 환전 수수료 우대율 95%가 적용되었더라도, 기준 환율과 적용 환율 사이에 발생하는 기본 스프레드로 인해 예상 금액과
    소폭 차이가 날 수 있습니다.


    위 항목을 확인했음에도 금액 오류가 명백하다고 판단되는 경우, 고객님의 거래 내역을 상세히 분석하기 위해 내부 전문 팀으로 에스컬레이션하여
    정밀 조사를 진행하고 결과를 안내해 드리겠습니다.'
