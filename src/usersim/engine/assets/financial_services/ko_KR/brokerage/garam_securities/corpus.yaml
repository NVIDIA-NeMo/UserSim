- id: b9eb8221-73d4-54d5-8f61-256e4afbc3c0
  title: '국내주식 거래: 다른 상품과의 비교와 맞지 않는 경우'
  body: '가람증권의 ''국내주식 거래'' 서비스는 코스피와 코스닥 시장의 기업에 직접 투자하여 성장을 추구하는 기본 거래 서비스입니다. 고객님의
    투자 성향에 따라 이 상품이 적절하지 않을 수 있습니다.


    이 상품이 맞지 않는 경우:

    - 원금 보장을 최우선으로 하시는 분: 본 상품은 투자 상품으로 원금이 보장되지 않습니다. 예금보험공사의 보호는 예탁금에 한해 1인당 1억원까지만
    적용되며, 주식 투자로 인한 손실은 보호 대상이 아닙니다.

    - 세금 혜택을 극대화하고 싶으신 분: 일반 계좌보다 비과세 및 분리과세 혜택이 있는 중개형 ISA 계좌가 더 유리할 수 있습니다.

    - 노후 자금 준비가 목적이신 분: 세액공제 혜택이 있는 연금저축계좌나 IRP가 더 적합합니다.


    상품의 핵심 비용 구조는 다음과 같습니다:

    - 모바일 거래 수수료: 0.015%

    - 증권거래세(코스피/코스닥): 0.2%


    가람증권은 적합성 원칙을 엄격히 준수하며, 고객님의 투자 성향을 고려하여 최적의 상품을 추천해 드립니다.'
