- id: fe251148-df0f-599e-864d-ea3850c1f373
  title: '연금저축계좌: 연금저축과 IRP를 합한 세액공제 대상 납입 한도 안내'
  body: '질문: 연금저축계좌와 IRP를 모두 이용하고 있는데, 두 계좌를 합쳐서 최대 얼마까지 세액공제를 받을 수 있습니까?


    답변: 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 총 9,000,000원입니다. 연금저축만으로는 최대 6,000,000원까지 공제
    대상이 되며, 나머지 한도를 IRP로 채우시거나 IRP를 통해 총 한도인 9,000,000원을 맞추어 혜택을 극대화하실 수 있습니다. 구체적인
    세액공제율은 고객님의 총급여 수준에 따라 달라지므로 ''연금저축계좌: 이런 분께 알맞습니다'' 내용을 참고해 주십시오.'
  domain: brokerage_investing
  product_category: garam_pension_savings
  document_type: faq
