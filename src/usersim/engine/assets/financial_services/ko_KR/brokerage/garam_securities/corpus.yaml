- id: b332b8c6-de53-556a-be5e-f4044cfda79a
  title: '적립식 투자: 필요 서류'
  body: '적립식 투자 서비스 이용을 위한 조건 및 필요 사항은 다음과 같습니다.


    - 가람증권 종합 계좌 보유: 서비스 이용 가능 (별도 서류 불필요)

    - 신규 계좌 개설 필요 시: 본인 명의의 신분증 (비대면 계좌 개설 절차를 통해 제출)

    - 적립 금액 설정: 최소 1,000원 이상의 투자 가능 금액 보유'
