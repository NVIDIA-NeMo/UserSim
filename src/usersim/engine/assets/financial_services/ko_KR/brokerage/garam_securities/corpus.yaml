- id: 30e7cd6c-273f-5662-a44b-056947c9f7d4
  title: '개인형 퇴직연금(IRP): 당사의 비슷한 상품과의 비교'
  body: '가람증권의 은퇴 준비 상품인 개인형 퇴직연금(IRP)과 연금저축계좌의 차이점은 다음과 같습니다.


    | 구분 | 개인형 퇴직연금(IRP) | 연금저축계좌 |

    | :--- | :--- | :--- |

    | 투자 가능 상품 | 예금, 펀드, 국내 상장 ETF | 펀드, 국내 상장 ETF |

    | 예금 편입 여부 | 가능 | 불가능 |

    | 세액공제 한도 | 합산 최대 9,000,000원 | 합산 최대 9,000,000원 |

    | 연간 납입 한도 | 합산 18,000,000원 | 합산 18,000,000원 |

    | 계좌 수수료 | 비대면 개설 시 0원 | 상품별 상이 |


    [선택 가이드]

    - 원금 보장형 예금 상품을 함께 운용하여 안정성을 높이고 싶으신 분께는 개인형 퇴직연금(IRP)이 더 적합합니다.

    - 보다 단순한 구조의 연금 자산 관리를 원하시는 분께는 연금저축계좌를 추천드립니다.


    두 상품 모두 연금저축과 IRP를 합한 세액공제 대상 납입 한도 9,000,000원을 공유하므로, 고객님의 투자 성향과 자산 배분 전략에 맞게
    분배하여 가입하십시오.'
  domain: brokerage_investing
