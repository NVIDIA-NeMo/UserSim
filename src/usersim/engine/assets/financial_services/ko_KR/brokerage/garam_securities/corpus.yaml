- id: 02f4b445-3f29-5334-bf56-1b1460cbe404
  title: '미국주식 거래: 개인정보 처리 안내'
  body: '가람증권은 미국주식 거래 서비스 제공을 위해 관련 법령에 따라 고객님의 개인정보를 안전하게 처리합니다.


    [개인정보 수집 및 이용 목적]

    - 미국 시장 거래를 위한 계좌 개설 및 유지관리

    - 해외 증권사 및 결제 기관으로의 주문 전달 및 체결 확인

    - 해외주식 양도소득세 계산을 위한 과세 자료 생성 및 관리

    - 금융감독원 등 규제 기관의 요구에 따른 보고 및 확인


    [제3자 제공 안내]

    미국주식 거래 특성상, 고객님의 성함, 계좌번호 등 최소한의 정보가 미국 내 거래소 및 현지 브로커에게 제공될 수 있습니다. 이는 거래 체결
    및 정산을 위한 필수 절차입니다.


    [보유 및 이용 기간]

    수집된 개인정보는 관련 법령(자본시장법 등) 및 내부 방침에 따라 계좌 해지 후에도 일정 기간 보관되며, 기간 만료 후 안전하게 파기됩니다.


    가람증권은 고객님의 정보를 보호하기 위해 최선을 다하며, 정보 변경이 필요하신 경우 ''미국주식 거래: 등록 정보 변경'' 절차를 통해 요청해
    주십시오.'
