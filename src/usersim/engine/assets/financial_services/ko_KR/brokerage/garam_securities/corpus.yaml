- id: 393ee83a-5dbe-587c-910f-b2c3576e509e
  title: '미국주식 거래: 당사의 비슷한 상품과의 비교'
  body: '미국주식 거래와 국내주식 거래의 주요 차이점을 안내해 드립니다.


    - 투자 시장: ''미국주식 거래''는 글로벌 최대 시장인 미국 기업에 투자하며, ''국내주식 거래''는 코스피와 코스닥 기업에 투자합니다.

    - 비용 및 환전: 미국주식 거래는 0.25%의 수수료와 95%의 환전 우대 혜택이 적용되지만 환전 절차가 필요합니다. 국내주식 거래는 환전
    없이 원화로 직접 거래합니다.

    - 세금 체계: 미국주식은 연 2,500,000원 기본공제 후 22%의 양도소득세가 부과되는 반면, 국내 상장주식 매매차익은 대주주가 아니면
    과세되지 않습니다.


    글로벌 기업의 성장성과 분산 투자를 원하시는 분께는 ''미국주식 거래''를, 익숙한 국내 기업과 세제 혜택을 중시하시는 분께는 ''국내주식
    거래''를 추천드립니다.'
