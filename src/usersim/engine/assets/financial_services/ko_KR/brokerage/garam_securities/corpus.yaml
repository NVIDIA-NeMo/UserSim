  title: '적립식 투자: 이용 조건별 차이'
  body: '| 구분 | 이용 조건 | 결과 및 적용 기준 |

    | :--- | :--- | :--- |

    | 최소 투자 금액 | 1,000원 이상 설정 | 서비스 이용 가능 |

    | 최소 투자 금액 | 1,000원 미만 설정 | 설정 불가 (최소 금액 미달) |

    | 필요 계좌 | 국내/미국주식 거래 계좌 보유 | 서비스 신청 가능 |

    | 필요 계좌 | 종합계좌 미보유 | 계좌 개설 후 신청 가능 |

    | 본인 인증 | 성함 및 생년월일 일치 | 정보 변경 및 설정 가능 |

