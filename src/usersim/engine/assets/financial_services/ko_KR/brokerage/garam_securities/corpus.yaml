- id: 927dbcb1-88db-51f5-a5c2-03ce8c5e53e5
  title: '국내주식 거래: 가입 대상'
  body: '국내주식 거래 서비스 가입 가능 여부는 다음 기준에 따릅니다.


    - 본인 인증 가능 여부: 성함 및 생년월일 확인을 통해 본인 인증이 완료된 고객 → 가입 가능

    - 계좌 유형: 비대면 계좌 개설 절차를 완료한 개인 고객 → 가입 가능

    - 투자 성향 확인: 적합성 원칙에 따른 투자 성향 분석 완료 고객 → 가입 가능

    - 법적 제한: 금융 관련 법규에 따라 거래가 제한된 자 → 가입 불가'
