- id: 7f189661-edb4-54ac-a31f-8c607c530813
  title: '적립식 투자: 안전한 이용을 위한 수칙'
  body: '적립식 투자 서비스를 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수해 주십시오.


    가람증권은 어떠한 경우에도 고객님의 카드 번호 전체, 비밀번호, 주민등록번호 전체 등 민감한 정보를 요구하지 않습니다. 만약 서비스 이용 과정에서
    이러한 정보를 요구하는 메시지나 전화를 받으셨다면, 즉시 가람증권 고객센터로 신고해 주십시오.


    계좌 정보 변경이나 적립 설정 변경 등 상태 변경 작업이 필요한 경우, 저희는 항상 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다.
    이 외의 방식으로 인증을 요구하는 것은 가람증권의 공식 절차가 아님을 알려드립니다.


    부정 거래가 의심되거나 본인이 설정하지 않은 적립 내역이 확인될 경우, 즉시 계좌 보호 조치를 요청하십시오. 접수된 분쟁은 관련 법규 및 내부
    규정에 따라 공정하게 처리되며, 진행 상황은 고객님께 신속히 안내해 드리겠습니다.'
