- id: 81351e4c-9ad2-54f4-a3ea-c774245fedfe
  title: '미국주식 거래: 전환이나 상위 상품을 고려할 때'
  body: '미국주식 거래는 전 세계 최대 시장에 직접 투자하여 성장성을 추구하는 서비스입니다. 국내주식 거래와 비교 시, 미국주식 거래는 0.25%의
    거래 수수료와 연 2,500,000원을 공제한 후 22%의 양도소득세가 발생한다는 점에서 세금 구조와 비용이 다릅니다.


    단순히 국내 상장된 미국 ETF 등에 투자하여 절세 혜택을 누리고 싶으시다면 중개형 ISA로의 전환을 고려하십시오. 반면, 글로벌 개별 기업의
    주가 상승과 배당을 직접적으로 추구하시는 투자자에게는 미국주식 거래 서비스가 가장 적합합니다.'
  domain: brokerage_investing
  product_category: garam_us_stock
  document_type: comparison
  source_authority: official
  placeholder: true
