- id: ee51824f-4ebe-51b2-b792-fdce28f86712
  title: '개인형 퇴직연금(IRP): 계좌 수수료(비대면 개설) 안내'
  body: '질문: 비대면으로 개인형 퇴직연금(IRP) 계좌를 개설할 때 수수료가 발생하나요?


    답변: 가람증권은 고객님의 효율적인 자산 성장을 지원하기 위해 비대면 계좌 개설 고객님께 경쟁력 있는 수수료 혜택을 제공하고 있습니다. 개인형
    퇴직연금(IRP)의 계좌 수수료(비대면 개설)는 0원입니다. 수수료 부담 없이 노후 준비를 시작하십시오.


    더 자세한 비용 관련 내용은 ''개인형 퇴직연금(IRP): 수수료 안내''에서 확인하실 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_irp
