- id: 02735395-352a-50b5-ad02-900751a30b3e
  title: '미국주식 거래: 가입부터 이용까지'
  body: '가람증권의 미국주식 거래 서비스는 환전 우대 혜택과 함께 전 세계 최대 시장인 미국 주식에 투자할 수 있는 글로벌 서비스입니다. 상담원은
    다음 내용을 바탕으로 고객님을 안내하십시오.


    [이용 프로세스]

    1. 계좌 개설: 비대면 계좌 개설을 통해 가입하며, 낮은 수수료 혜택이 적용됩니다.

    2. 외화 준비: 95%의 환전 수수료 우대율이 적용되어 저렴하게 달러(USD)를 준비하실 수 있습니다.

    3. 종목 선택 및 거래: 실시간 시세를 확인하여 매수/매도를 진행합니다. 이때 0.25%의 미국주식 거래 수수료율이 적용됩니다.

    4. 세금 관리: 해외주식 양도소득 기본공제(연) 2,500,000원을 제외한 수익에 대해 22%의 해외주식 양도소득세율(지방소득세 포함)이
    부과됩니다.


    [핵심 요약]

    - 거래 수수료율: 0.25%

    - 환전 수수료 우대율: 95%

    - 양도소득세율: 22% (기본공제 2,500,000원)


    [중요 유의사항]

    - 본 서비스는 투자상품으로 원금이 보장되지 않습니다.

    - 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 미국주식 등 투자상품 자체는 보호 대상이 아니며 원금 손실 가능성이 있음을 명확히
    안내하십시오.'
