  body: '가람증권과 함께 스마트한 투자를 시작하십시오!


    현재 가람증권에서는 디지털 중심의 온라인 증권 서비스 강화를 위해 비대면 계좌 개설 고객님을 대상으로 경쟁력 있는 수수료 혜택을 제공하고 있습니다.


