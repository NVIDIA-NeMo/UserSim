- id: d9d9a9dd-539c-537d-ae75-880d1cafabf8
  title: '적립식 투자: 위험 안내'
  body: '적립식 투자 서비스를 이용하시기 전, 다음의 위험 고지 사항을 반드시 확인하시기 바랍니다.


    1. 원금 비보장: 적립식 투자를 통해 매수하는 주식, 펀드, ETF 등의 투자 상품은 예금자보호법에 따른 보호 대상이 아니며, 원금이 보장되지
    않습니다. 시장 상황에 따라 투자 원금의 일부 또는 전부에 손실이 발생할 수 있습니다.


    2. 예금자 보호 안내: 고객님이 계좌에 보유하신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되지만, 실제 투자된 상품(주식 등)은
    보호 대상에서 제외됩니다.


    3. 수익 보장 불가: 가람증권은 적립식 투자를 통한 특정 종목의 수익을 보장하지 않습니다. 과거의 수익률이 미래의 수익을 보장하지 않으며,
    모든 투자 판단의 책임은 고객 본인에게 있습니다.


    4. 적합성 원칙: 당사는 고객님의 투자 성향을 고려하여 적합한 상품을 권유하지만, 최종적인 투자 결정은 고객님의 판단하에 이루어져야 합니다.
    상품의 상세 내용은 상품설명서를 통해 충분히 숙지하시기 바랍니다.'
  domain: brokerage_investing
