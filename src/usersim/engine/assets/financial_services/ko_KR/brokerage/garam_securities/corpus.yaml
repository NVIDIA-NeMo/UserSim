- id: 2050157a-5714-52c7-8bd4-e2ce9a11a076
  title: '국내주식 거래: 약관 변경 안내'
  body: '본 안내는 가람증권의 국내주식 거래 서비스 이용 약관 중 주요 변경 사항을 설명드립니다. 고객님께서는 변경된 내용을 확인하시어 서비스
    이용에 참고하시기 바랍니다.


    1. 거래 비용 및 세율 적용

    당사는 비대면 계좌 개설 고객님께 경쟁력 있는 국내주식 거래 수수료율(모바일) 0.015%를 적용합니다. 또한, 관련 법령에 따라 2026년
    1월 1일부터 상장주식 매도시 증권거래세율(코스피, 농어촌특별세 포함) 0.2%와 증권거래세율(코스닥) 0.2%가 일괄 적용됨을 안내드립니다.


    2. 투자자 보호 및 책임

    가람증권은 금융위원회와 금융감독원의 감독 하에 적합성 원칙을 엄격히 준수합니다. 모든 투자 상품은 원금이 보장되지 않으며, 투자 판단의 최종
    책임은 고객님께 있습니다. 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 매수하신 주식 등 투자상품은 보호 대상이 아닙니다.


    3. 약관의 변경 및 효력

    약관 변경 시 당사는 앱 공지사항 및 개별 안내를 통해 사전 고지합니다. 고지된 내용에 대해 정해진 기간 내에 거부 의사를 표시하지 않으시면
    변경된 약관에 동의하신 것으로 간주됩니다.


    상세한 전체 약관 내용은 ''국내주식 거래: 약관''에서 확인하실 수 있습니다.'
