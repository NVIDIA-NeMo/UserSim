  title: '국내주식 거래: 증권거래세율(코스닥) 안내'
  body: '질문: 코스닥 종목을 매도할 때 발생하는 증권거래세는 얼마인가요?


    답변: 가람증권에서 코스닥 시장의 종목을 매도하실 때 적용되는 증권거래세율(코스닥)은 0.2%입니다. 이는 2026년 1월 1일부터 적용되는
    세율 기준입니다.


    질문: 코스피 종목의 세율과 차이가 있나요?


    답변: 아니오, 코스피 종목 역시 증권거래세율(코스피, 농어촌특별세 포함) 0.2%가 적용되어 코스닥과 동일한 세율로 운영됩니다.


