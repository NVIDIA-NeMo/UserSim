  institution_id: garam_securities
- id: 40d12427-f50d-50ec-a4fa-d03986a6c214
  title: '연금저축계좌: 필요 서류'
  body: '가람증권 연금저축계좌 개설을 위해 필요한 서류 및 준비물입니다.


    | 구분 | 필요 항목 | 비고 |

    | :--- | :--- | :--- |

    | 본인 확인 | 본인 명의 신분증 (주민등록증 또는 운전면허증) | 실물 신분증 촬영 필요 |

    | 본인 인증 | 본인 명의의 스마트폰 | SMS 인증 및 본인 확인용 |

    | 계좌 연결 | 타행 또는 당사 입출금 계좌 번호 | 1원 인증 등 계좌 점유 확인용 |

    | 가입 자격 | 제한 없음 | 누구나 가입 가능 (단, 한도는 연 18,000,000원) |'
