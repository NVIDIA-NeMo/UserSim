- id: c8ae3bb2-b45a-55ad-8acc-8d4798472aa9
  title: '연금저축계좌: 가입 대상'
  body: '연금저축계좌 가입 가능 여부 및 조건은 다음과 같습니다.


    - 거주자 및 비거주자: 제한 없이 가입 가능합니다.

    - 연령 제한: 제한 없이 가입 가능합니다.

    - 투자 성향: 적합성 원칙에 따라 고객의 재산 상황 및 투자 목적에 맞는 상품 권유 절차를 거쳐야 합니다.

    - 납입 한도: 모든 가입자는 연금계좌 연간 납입 한도 18,000,000원 이내에서 운용해야 합니다.'
