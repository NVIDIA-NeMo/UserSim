- id: 10b8009c-70fa-5158-92fe-1ce71e17edff
  title: '국내주식 거래: 필요 서류'
  body: '국내주식 거래 계좌 개설을 위해 다음의 서류와 준비물이 필요합니다.


    - 내국인 (개인): 본인 명의의 신분증(주민등록증 또는 운전면허증), 본인 명의의 스마트폰

    - 외국인: 외국인등록증, 본인 명의의 스마트폰

    - 법인: 법인인감증명서, 법인등기부등본, 사업자등록증, 대표자 신분증


    모든 서류는 최근 3개월 이내 발급된 것이어야 하며, 비대면 개설 시에는 신분증 촬영을 통한 인증 절차가 진행됩니다.'
