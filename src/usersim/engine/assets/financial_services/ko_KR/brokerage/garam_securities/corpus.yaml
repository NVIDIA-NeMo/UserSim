  institution_id: garam_securities
- id: 370fe3fa-b820-5d90-8407-ad32dca3e385
  title: '중개형 ISA: 자주 하는 업무의 처리 절차'
  body: '중개형 ISA 이용 중 가장 빈번하게 요청하시는 업무 처리 절차를 안내해 드립니다.


    업무 1: 계좌로 자금 입금하기

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오.

    2. 입금 요청: 입금하실 금액과 입금 계좌 번호를 확인합니다.

    3. 한도 체크: 현재 연간 납입 한도(20,000,000원) 내에서 입금이 가능한지 확인합니다.

    4. 완료: 입금 처리가 완료되면 즉시 잔액 변동 내역을 안내해 드립니다.


    업무 2: 비과세 유형 확인 및 변경 요청

    1. 본인 확인: 성함과 생년월일을 통해 인증을 수행합니다.

    2. 유형 확인: 현재 계좌가 일반형인지 서민형인지 확인을 요청하십시오.

    3. 증빙 제출: 서민형으로의 변경이 필요한 경우, 관련 소득 증빙 서류를 제출하는 절차를 안내받으십시오.

    4. 반영 확인: 서민형 적용 시 비과세 한도가 4,000,000원으로 상향되었는지 확인합니다.


    업무 3: 납입 한도 이월 내역 확인

    1. 본인 확인: 성함과 생년월일을 말씀해 주십시오.

    2. 이월액 조회: 전년도에 사용하지 않아 당해 연도로 이월된 납입 가능 금액 조회를 요청하십시오.

    3. 최종 한도 확인: 이월액이 합산된 올해의 총 납입 가능 금액을 확인합니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 399daea0-4bc8-5b17-8bc0-bede6117cb77
  title: '중개형 ISA: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 중개형 ISA의 거래 명세서나 세제 혜택 내역이 실제와 다르다고 판단될 때의 처리 과정입니다.


    주요 증상:

    - 비과세 한도(일반형 2,000,000원 / 서민형 4,000,000원)가 잘못 적용되어 세금이 계산된 경우

    - 실제 매매 내역이 명세서에 누락되었거나 금액이 다른 경우

    - 분리과세율 9.9%가 아닌 다른 세율이 적용된 경우


    확인 및 해결 순서:

    1. 결제일 확인: 주식 및 ETF 거래는 체결일과 결제일이 다릅니다. 결제일 기준으로 내역이 반영되었는지 확인하십시오.

    2. 계좌 유형 재확인: 본인의 계좌가 일반형인지 서민형인지 다시 확인하십시오. 유형에 따라 비과세 한도가 다르므로 적용 기준이 달라질 수
    있습니다.

    3. 세제 혜택 산정 방식 확인: 순이익(이익 - 손실)을 기준으로 계산되었는지 확인하십시오.


    위 사항을 확인했음에도 불일치가 발견되면, 상담원에게 정확한 불일치 항목을 말씀해 주십시오. 당사는 즉시 관련 거래 데이터를 재검토하고, 필요한
    경우 내부 정산 팀으로 에스컬레이션하여 오류를 수정하겠습니다. 처리 결과는 영업일 기준 3~5일 이내에 안내해 드리겠습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 682e348c-294c-51f8-98f5-759cad69f612
  title: '연금저축계좌: 상품 개요'
  body: '가람증권의 연금저축계좌는 세액공제 혜택을 통해 효율적인 노후 자금 준비를 지원하는 장기 투자 전용 계좌입니다.


    본 상품은 연금계좌 연간 납입 한도인 18,000,000원 범위 내에서 자유롭게 납입 가능하며, 연금저축 세액공제 대상 납입 한도는 연간 6,000,000원까지
    적용됩니다. 투자 가능한 상품으로는 펀드와 국내 상장 ETF(레버리지 및 인버스 ETF 제외)가 있으며, 국내외 개별 주식에 대한 직접 투자는
    제한됩니다.


    효율적인 비용 구조를 통해 비대면 계좌 개설 고객님께 경쟁력 있는 낮은 수수료를 제공하여 투자 진입 장벽을 낮추고 있습니다. 다만, 본 상품은
    예금자보호법에 따른 보호 대상이 아니므로 원금이 보장되지 않으며, 투자 결과에 따른 책임은 고객님께 귀속됩니다. 상세한 위험 고지 및 운용
    제한 사항은 ''연금저축계좌: 상품설명서 주요 내용''에서 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_pension_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 11f5909a-3f44-53e5-b98e-6c650cf5dd08
  title: '연금저축계좌: 연금저축 세액공제 대상 납입 한도 안내'
  body: '질문: 연금저축계좌만 이용할 때와 IRP를 함께 이용할 때 세액공제 한도는 어떻게 달라지나요?


    답변: 연금저축계좌 단독으로 운용하실 경우, 연금저축 세액공제 대상 납입 한도는 연간 6,000,000원까지입니다. 만약 개인형 퇴직연금(IRP)을
    함께 이용하신다면, 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 최대 9,000,000원까지 확대됩니다.


    고객님의 총급여 수준에 따라 적용되는 구체적인 공제율은 ''연금저축계좌: 금리·요율 안내''에서 확인하실 수 있습니다.'
