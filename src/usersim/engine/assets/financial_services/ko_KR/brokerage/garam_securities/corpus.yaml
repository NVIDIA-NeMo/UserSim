- id: b5b26fc4-5df7-5a92-b494-70d197b9f570
  title: '연금저축계좌: 자주 하는 업무의 처리 절차'
  body: '연금저축계좌에서 가장 빈번하게 요청하시는 ''연금계좌 납입 한도 변경'' 절차를 안내해 드립니다.


    1. 한도 변경 요청: 상담원에게 연금계좌의 납입 한도 금액을 변경하고 싶다고 말씀하십시오.

    2. 본인 인증 수행: 고객님의 성함과 생년월일을 말씀해 주십시오. 보안을 위해 주민등록번호 전체나 비밀번호는 요구하지 않습니다.

    3. 금액 설정: 변경하고자 하는 연간 납입 한도 금액을 말씀하십시오. 이때 모든 연금계좌를 합산한 연금계좌 연간 납입 한도인 18,000,000원
    범위 내에서만 설정이 가능합니다.

    4. 변경 완료 확인: 상담원이 한도 변경 처리가 완료되었음을 확인해 드리며, 변경된 한도 금액을 다시 한번 안내해 드립니다.


    정확한 한도 설정은 세액공제 계획과 직결되므로, 본인의 연간 납입 예정 금액을 미리 계산하신 후 요청하시기 바랍니다.'
