- id: f530e6cc-9767-5dd6-9c78-f1bb3fe66c85
  title: '개인형 퇴직연금(IRP): 예상과 다른 수수료나 금액'
  body: '고객님께서 예상하신 금액과 실제 계좌 잔액이나 수수료가 다르게 나타나는 경우, 다음 사항을 순차적으로 점검해 주십시오.


    1. 세금 원천징수 여부 확인: 연금 수령 요건을 갖추지 않은 상태에서 중도 인출하거나 해지하셨다면, 인출 금액의 16.5%가 기타소득세로
    원천징수되어 차감됩니다.

    2. 비대면 개설 혜택 적용 여부: 가람증권의 비대면 계좌 개설 고객은 계좌 수수료가 0원입니다. 만약 수수료가 발생했다면 개설 경로를 확인하십시오.

    3. 세액공제 한도 초과분 확인: 납입 금액 중 연금저축과 IRP 합산 한도인 9,000,000원을 초과한 금액은 당해 연도 세액공제 대상에서
    제외됩니다.


    위 사항을 확인했음에도 금액 차이가 계속된다면, 상세 내역 조사를 위해 상담원에게 에스컬레이션을 요청하십시오. 내부 절차에 따라 정확한 산출
    근거를 확인하여 안내해 드리겠습니다.'
