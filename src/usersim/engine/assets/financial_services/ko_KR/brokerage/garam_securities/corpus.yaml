- id: 7ebd1c48-f1b0-51c3-bd64-cd8442c7a335
  title: '적립식 투자: 해지·변경·상품 전환'
  body: "설정된 적립식 투자의 금액, 주기 또는 투자 상품을 변경하거나 서비스를 해지하는 절차는 다음과 같습니다.\n\n1. 변경 또는 해지\
    \ 의사 전달: 상담원에게 적립식 투자의 해지, 금액 변경 또는 상품 전환을 요청하십시오.\n2. 본인 확인 수행: 보안을 위해 고객님의 성함과\
    \ 생년월일을 말씀해 주십시오. 가람증권은 비밀번호나 주민등록번호 전체를 요구하지 않습니다.\n3. 세부 사항 조정: \n   - 변경 시:\
    \ 변경하고자 하는 새로운 적립 금액(최소 1,000원 이상)과 주기, 또는 전환할 상품을 말씀해 주십시오.\n   - 해지 시: 해지하고자\
    \ 하는 적립식 투자 설정 건을 확인해 주십시오.\n4. 처리 결과 확인: 상담원이 변경 사항이나 해지 완료 여부를 안내해 드립니다. 이후\
    \ 앱 내 설정 화면이나 알림 메시지를 통해 최종 반영 내용을 확인하십시오.\n\n주의 사항: 이미 매수 주문이 나간 회차의 금액은 취소할\
    \ 수 없으며, 변경 사항은 다음 적립 주기부터 적용됩니다."
