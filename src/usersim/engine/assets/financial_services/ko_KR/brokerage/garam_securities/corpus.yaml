- id: 23a6df98-c169-5f29-a8e5-781dbfe9a363
  title: '중개형 ISA: 가입부터 이용까지'
  body: '본 문서는 고객 상담원이 중개형 ISA 가입 및 이용 과정을 안내하기 위한 가이드입니다. 고객에게 다음 단계별 절차를 명확히 설명하십시오.


    1. 가입 적합성 확인: 가장 먼저 고객의 재산 상황, 투자 경험, 목적을 확인하여 중개형 ISA가 적합한 상품인지 확인하는 ''적합성 원칙''을
    준수하십시오. 직전 3년 중 한 번이라도 금융소득종합과세 대상이었다면 가입이 불가능함을 안내하십시오.


    2. 계좌 개설 및 본인 인증: 비대면 계좌 개설 절차를 안내하십시오. 개설 과정에서 필요한 본인 확인 절차를 수행하며, 가람증권의 낮은 수수료
    혜택이 적용됨을 강조하십시오.


    3. 자금 납입 및 한도 안내: 연간 납입 한도가 20,000,000원이며, 총 납입 한도는 100,000,000원임을 안내하십시오. 미사용
    납입 한도는 다음 해로 이월된다는 점을 설명하여 고객의 자금 계획을 돕습니다.


    4. 상품 운용: 중개형 ISA 내에서 국내 상장주식, ETF, 펀드, ELS, 예금 등에 투자할 수 있음을 안내하십시오. 특히 비과세 한도(일반형
    2,000,000원, 서민형 4,000,000원)와 초과분 9.9% 분리과세 혜택을 통해 효율적인 자산 관리가 가능함을 설명하십시오.


    5. 기간 유지 및 만기: 의무가입기간 3년을 유지해야 세제 혜택을 온전히 받을 수 있음을 명시하십시오. 만기 자금을 60일 이내에 연금계좌로
    전환 시 최대 300만원의 추가 세액공제가 가능하다는 점을 안내하여 장기적인 노후 준비를 권장하십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: product_sheet
  source_authority: official
