    - 본인 확인을 위한 성함 및 생년월일 정보

    - 변경하고자 하는 최신 정보


    [변경 단계]

    1. 상담원에게 등록 정보 변경을 요청하십시오.

    2. 본인 인증을 위해 성함과 생년월일을 말씀해 주십시오. (비밀번호나 주민등록번호 전체는 요구하지 않습니다.)

    3. 변경이 필요한 항목(예: 휴대전화 번호, 주소 등)과 새로운 정보를 제공하십시오.

    4. 상담원이 변경 내용을 최종 확인하고 반영 결과를 안내합니다.

    5. 변경이 완료되면 모바일 앱의 마이페이지에서 업데이트된 정보를 확인하십시오.


    정보 변경 과정에서 민감한 개인정보를 요구하는 요청이 있을 경우, 즉시 중단하고 당사 공식 채널을 통해 확인하시기 바랍니다.'
