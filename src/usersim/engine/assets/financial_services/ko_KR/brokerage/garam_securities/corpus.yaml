- id: 6b43f919-3421-5c76-8bb8-a8a4d054331d
  title: open_account 사용 기준
  body: '국내 및 해외 주식을 거래하기 위한 종합매매계좌의 비대면 개설을 요청하는 고객에게 다음 절차를 적용하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 인증을 수행합니다.

    2. 고객에게 비대면 계좌 개설을 위해 신분증 확인 등 실명확인 절차가 필요함을 안내합니다.

    3. 고객이 실명확인 준비가 되었음을 확인한 후, `open_account` 도구를 호출하여 종합매매계좌 개설 신청을 진행합니다.

    4. 계좌 개설 완료 후, 필요에 따라 예탁금 입금을 위한 `deposit_funds` 절차를 안내하십시오.


    비대면 개설 고객에게는 경쟁력 있는 낮은 수수료가 제공됨을 안내하시기 바랍니다. 상세 수수료는 ''수수료·요금 안내''를 참조하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: garam_securities
- id: dc6bdd68-8a98-5a09-85a1-4556869f03a4
  title: open_account 도구 설명서
  body: 'open_account 도구는 고객이 국내외 주식을 거래할 수 있는 종합매매계좌의 비대면 개설을 신청할 때 사용합니다. 상담원은 고객의
    요청이 있을 때 이 도구를 직접 호출하여 개설 절차를 시작합니다.


    - 호출 시점: 고객이 종합매매계좌 개설을 요청한 경우

    - 입력 인수: 없음

    - 수행 결과: 비대면 계좌 개설 신청 프로세스가 시작됩니다. 이후 신분증 확인 등 실명확인 절차가 진행됩니다.


    본 도구를 호출하기 전, 반드시 verify_identity 도구를 통해 고객의 본인 인증이 완료되어야 합니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: garam_securities
- id: 5e3254f9-0d95-5a33-94c6-d876a8203260
  title: deposit_funds 사용 기준
  body: '고객이 연결된 은행 계좌에서 가람증권 종합매매계좌로 예탁금을 입금하고자 할 때, 상담원은 다음 절차를 엄격히 준수하여 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오.

    2. 고객이 입금할 계좌의 끝 4자리를 제공한 경우, get_accounts 도구를 호출하여 해당 계좌의 정확한 account_id를 확인하십시오.

    3. 고객으로부터 입금할 금액(예: 1,000,000원)을 확인하십시오.

    4. 확인된 account_id와 입금 금액을 사용하여 deposit_funds 도구를 호출하여 입금을 처리하십시오.

    5. 처리가 완료되면 고객에게 입금 성공 여부와 최종 잔액을 안내하십시오.


    예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 주식 및 펀드 등 투자상품은 보호 대상이 아니며 원금이 보장되지 않음을 안내해 주십시오.
    상세 내용은 ''법령·제도 안내: 주식·ISA·연금계좌''를 참고하시기 바랍니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: garam_securities
- id: f27642b1-40ca-5271-8a67-f8f44015f8e7
  title: deposit_funds 도구 설명서
  body: "deposit_funds 도구는 연결된 은행 계좌에서 고객의 종합매매계좌로 예탁금을 입금하는 기능을 수행합니다. 상담원은 고객의 요청에\
    \ 따라 이 도구를 직접 호출하여 자금 이동을 처리합니다.\n\n- 호출 시점: 본인 인증 및 입금 계좌/금액 확인이 완료된 후\n- 입력\
    \ 인수:\n  - account_id: 입금 대상이 되는 종합매매계좌의 고유 식별자\n  - amount: 입금할 금액 (예: 500,000원)\n\
    - 수행 결과: 지정된 은행 계좌에서 가람증권 계좌로 금액이 즉시 이체됩니다.\n\n본 도구는 verify_identity를 통해 인증된 고객에\
    \ 대해서만 실행 가능하며, 비밀번호나 보안카드를 추가로 요구하지 않습니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: garam_securities
- id: 6d013083-05eb-5d7c-b42f-caeb47cea96e
  title: withdraw_funds 사용 기준
  body: '고객이 종합매매계좌의 예탁금을 등록된 은행 계좌로 출금하고자 할 때, 상담원은 다음 절차에 따라 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오.

    2. 고객이 출금할 계좌의 끝 4자리를 제공한 경우, get_accounts 도구를 호출하여 정확한 account_id를 확인하십시오.

    3. 출금할 금액(예: 200,000원)을 확인하고, 현재 계좌 잔액이 충분한지 확인하십시오.

    4. 현재 등록된 출금 은행 계좌 정보를 확인하여 고객에게 안내하고, 해당 계좌로 출금을 진행할지 확인하십시오.

    5. 확인된 account_id와 출금 금액을 사용하여 withdraw_funds 도구를 호출하여 출금을 처리하십시오.

    6. 처리 완료 후 출금 금액과 남은 잔액을 고객에게 안내하십시오.


    출금 계좌를 변경해야 하는 경우에는 먼저 ''update_beneficiary 사용 기준''에 따라 계좌 정보를 변경한 후 출금을 진행하시기
    바랍니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: garam_securities
- id: d2405881-8c0d-5841-835e-2c00b9df58cf
  title: withdraw_funds 도구 설명서
  body: "withdraw_funds 도구는 가람증권 종합매매계좌의 예탁금을 고객이 사전에 등록한 은행 계좌로 출금하는 기능을 수행합니다. 상담원은\
    \ 본 도구를 호출하여 출금 처리를 직접 완료합니다.\n\n- 호출 시점: 본인 인증 및 출금 금액 확인, 등록 계좌 확인이 모두 완료된 후\n\
    - 입력 인수:\n  - account_id: 출금 대상이 되는 종합매매계좌의 고유 식별자\n  - amount: 출금할 금액 (예: 100,000원)\n\
    - 수행 결과: 계좌 내 예탁금이 등록된 은행 계좌로 이체되며, 계좌 잔액이 감소합니다.\n\n본 도구는 verify_identity로 인증된\
    \ 상태에서만 사용 가능하며, 추가적인 비밀번호나 OTP 입력 없이 처리됩니다."
