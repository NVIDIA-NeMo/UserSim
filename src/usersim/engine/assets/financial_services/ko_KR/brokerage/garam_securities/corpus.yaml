- id: aea255ee-250d-5060-89d3-9a9d3b57f7a1
  title: '적립식 투자: 개인정보 처리 안내'
  body: '가람증권은 ''적립식 투자'' 서비스 제공을 위해 관련 법령에 따라 고객님의 개인정보를 다음과 같이 처리합니다.


    1. 수집 및 이용 목적: 고객님이 설정하신 적립 주기와 금액에 따라 자동으로 매매 주문을 실행하기 위한 계좌 식별, 거래 실행 및 결과 통지
    목적으로 이용합니다.


    2. 처리 항목: 성함, 생년월일, 계좌번호, 투자 대상 종목, 적립 설정 금액 및 주기


    3. 보유 및 이용 기간: 적립식 투자 서비스 이용 계약 기간 동안 보유하며, 서비스 해지 시 관련 법령(자본시장법 등)에서 정한 보존 기간까지
    보관 후 파기합니다.


    4. 제3자 제공: 원활한 매매 체결을 위해 한국거래소 및 한국예탁결제원 등 관련 유관기관에 필요한 정보를 제공할 수 있습니다.


    본 서비스 이용 시 고객님은 개인정보 수집 및 이용에 동의하신 것으로 간주되며, 동의를 철회하실 경우 서비스 이용이 제한될 수 있습니다. 가람증권은
    고객님의 정보를 안전하게 보호하며, 민감한 비밀번호나 주민등록번호 전체를 요구하지 않습니다.'
