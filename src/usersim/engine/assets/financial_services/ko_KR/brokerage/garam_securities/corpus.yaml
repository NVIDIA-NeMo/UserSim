- id: 81e2d856-cfa3-5477-a288-a960da889b93
  title: '연금저축계좌: 이 상품을 사칭한 사기 주의'
  body: '최근 가람증권의 연금저축계좌를 사칭하여 고수익을 보장하거나 특별한 세제 혜택을 약속하며 개인정보를 요구하는 금융 사기가 발생하고 있습니다.
    고객님의 소중한 자산을 보호하기 위해 다음의 주의 사항을 반드시 확인하시기 바랍니다.


    가람증권은 어떠한 경우에도 고객님의 비밀번호, 카드 번호, 주민등록번호 전체 등 민감한 정보를 전화나 메시지로 요구하지 않습니다. 특히 ''원금
    보장''이나 ''확정 수익''을 제시하며 계좌 이체를 유도하는 행위는 전형적인 사기 수법이므로 각별히 주의하십시오. 연금저축계좌를 포함한 모든
    투자 상품은 운용 결과에 따라 원금 손실이 발생할 수 있으며, 당사는 특정 종목의 수익을 보장하지 않습니다.


    만약 가람증권을 사칭한 의심스러운 연락을 받으셨거나 부정 거래가 의심되는 경우, 즉시 당사 고객센터로 신고하여 계좌 보호 조치를 취하시기 바랍니다.
    신속한 신고가 고객님의 자산을 보호하는 가장 확실한 방법입니다.'
