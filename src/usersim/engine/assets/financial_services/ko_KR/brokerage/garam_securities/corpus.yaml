- id: a4513727-6398-5fc9-b6db-ab08d632c802
  title: '적립식 투자: 가입 대상'
  body: '적립식 투자 서비스 이용을 위한 자격 조건은 다음과 같습니다.


    - 가람증권 계좌 보유 여부: 가람증권의 비대면 계좌를 보유한 고객님 (필수)

    - 본인 인증 가능 여부: 성함 및 생년월일을 통한 본인 확인 가능자 (필수)

    - 최소 투자 금액 충족: 1회 적립 시 적립 최소 금액 1,000원 이상 설정 가능자 (필수)

    - 투자 성향 확인: 적합성 원칙에 따라 투자 상품의 위험도를 이해하고 동의하신 고객님 (필수)'
