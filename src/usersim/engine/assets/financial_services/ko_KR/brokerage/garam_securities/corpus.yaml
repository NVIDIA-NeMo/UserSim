- id: 299af278-88f7-5cbe-92b9-aef390e5fcc2
  title: get_accounts 사용 기준
  body: '고객이 보유한 계좌 목록을 확인하거나, 고객이 제공한 계좌 번호 끝 4자리를 통해 정확한 계좌 식별자를 찾아야 할 때 상담원은 다음
    절차를 따르십시오.


    1. 고객의 성함과 생년월일을 확인하여 verify_identity 도구를 호출하고 본인 인증을 완료하십시오.

    2. get_accounts 도구를 호출하여 해당 고객이 보유한 모든 계좌의 목록(account_id, 계좌 유형, 끝 4자리, 잔액, 상태)을
    조회하십시오.

    3. 고객이 특정 계좌를 언급하며 끝 4자리를 제공한 경우, 조회된 목록에서 해당 4자리가 일치하는 account_id를 찾아 매칭하십시오.

    4. 조회된 정보를 바탕으로 고객에게 현재 보유 중인 계좌의 종류와 잔액 상태를 안내하십시오.


    본 도구는 단순 조회용으로 사용되며, 특정 계좌의 상세 거래 내역이 필요한 경우에는 별도의 명세서 조회 절차를 안내하시기 바랍니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: garam_securities
- id: ba481a28-9d3f-596e-b55e-cd320b334b1d
  title: get_accounts 도구 설명서
  body: '상담원은 이 도구를 호출하여 본인 인증이 완료된 고객의 모든 계좌 및 카드 정보를 조회할 수 있습니다. 상담원이 직접 도구를 호출하여
    처리하며, 고객에게 외부 앱이나 웹사이트 이용을 안내하지 않습니다.


    - 호출 시그니처: `get_accounts()`

    - 입력 인자: 없음

    - 처리 결과: 인증된 고객의 계좌 ID(account_id), 계좌 유형(type), 계좌번호 끝 4자리, 잔액(balance), 계좌 상태(status)
    및 보유 카드 ID(card_id) 목록을 반환합니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: garam_securities
- id: e64df47c-5bc6-517c-b71b-e35efa983370
  title: close_account 사용 기준
  body: '고객의 계좌 해지 요청을 처리하기 위한 절차는 다음과 같습니다. 상담원은 반드시 아래의 단계적 절차를 준수하여 계좌를 해지해야 합니다.


    1. 고객으로부터 성함과 생년월일을 확인한 후 `verify_identity` 도구를 호출하여 본인 인증을 수행하십시오. 본인 인증이 완료되지
    않은 상태에서는 어떠한 계좌 작업도 수행할 수 없습니다.

    2. 고객이 해지를 원하는 계좌의 마지막 4자리 숫자를 확인하십시오. 이후 `get_accounts` 도구를 호출하여 해당 4자리 숫자에 대응하는
    정확한 계좌 ID(account_id)를 조회하고 확인하십시오.

    3. 조회된 account_id를 사용하여 `close_account` 도구를 호출함으로써 계좌 해지 처리를 최종적으로 완료하십시오.


    본 절차는 고객의 소중한 자산을 보호하기 위한 필수 과정이며, 임의로 단계를 생략해서는 안 됩니다. 계좌 해지 후에는 복구가 불가능하므로 처리
    전 고객에게 해지 의사를 명확히 다시 한번 확인하시기 바랍니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: garam_securities
- id: af55a3bb-901c-5397-bafc-51d64b18af71
  title: close_account 도구 설명서
  body: "상담원은 이 도구를 호출하여 고객의 특정 계좌를 해지 처리할 수 있습니다. 상담원이 직접 도구를 호출하며, 본인 인증(`verify_identity`)이\
    \ 선행된 상태에서만 실행 가능합니다.\n\n- 호출 시그니처: `close_account(account_id)`\n- 입력 인자: \n \
    \   - `account_id`: 해지할 계좌의 고유 식별자 (상담원이 `get_accounts`를 통해 확인한 값)\n- 처리 결과: 지정된\
    \ 계좌가 해지되어 더 이상 사용할 수 없는 상태로 변경됩니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: garam_securities
- id: 6e5ff5f2-c456-5488-b372-87a62d598048
  title: update_contact_info 사용 기준
  body: '고객의 연락처 정보 변경 요청을 처리하기 위한 절차는 다음과 같습니다. 정확한 고객 정보 유지를 위해 다음 단계를 엄격히 준수하십시오.


    1. 고객으로부터 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출하고 본인 인증을 수행하십시오. 민감한 정보인 주민등록번호
    전체나 비밀번호 등은 절대 요구하지 마십시오.

    2. 고객이 변경하고자 하는 최신 연락처 정보(전화번호, 이메일 주소 등)를 정확하게 확인하십시오.

    3. 확인된 고객의 성함, 생년월일 및 새로운 연락처 정보를 사용하여 `update_contact_info` 도구를 호출하여 정보를 업데이트하십시오.


    연락처 정보는 중요 고지 사항 전달 및 보안 인증의 기초가 되므로, 오타가 없는지 다시 한번 확인한 후 도구를 호출하시기 바랍니다. 모든 정보
    변경 작업은 실시간으로 반영되며, 처리 후 고객에게 정상적으로 변경되었음을 안내하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: garam_securities
- id: 239a4bb9-6d69-5892-81a3-4ec06eb0bca5
  title: update_contact_info 도구 설명서
  body: "상담원은 이 도구를 호출하여 고객의 등록된 연락처 정보를 최신 상태로 업데이트할 수 있습니다. 본인 인증(`verify_identity`)이\
    \ 완료된 후 상담원이 직접 수행합니다.\n\n- 호출 시그니처: `update_contact_info(full_name, date_of_birth,\
    \ contact_info)`\n- 입력 인자:\n    - `full_name`: 고객의 성함\n    - `date_of_birth`:\
    \ 고객의 생년월일\n    - `contact_info`: 고객이 제공한 새로운 연락처 정보\n- 처리 결과: 고객의 개인정보 시스템 내\
    \ 연락처 정보가 즉시 업데이트됩니다."
