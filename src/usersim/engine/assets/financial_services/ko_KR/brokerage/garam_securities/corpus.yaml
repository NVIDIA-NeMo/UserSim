  title: '개인형 퇴직연금(IRP): 진행 상황과 내역 확인'
  body: '개인형 퇴직연금(IRP)의 납입 내역, 운용 현황 및 세액공제 대상 금액을 확인하는 절차입니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 상담원에게 개인형 퇴직연금(IRP)의 전체적인 운용 내역 및 납입 현황 확인을 요청하십시오.

