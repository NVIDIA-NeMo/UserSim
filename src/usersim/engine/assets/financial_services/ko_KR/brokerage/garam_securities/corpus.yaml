- id: e0720f3d-0846-52a5-9119-ea6bb1f9e0ee
  title: '적립식 투자: 등록 정보 변경'
  body: '적립식 투자의 금액, 주기 또는 대상 종목을 변경하는 절차를 안내해 드립니다.


    [준비 사항]

    본인 확인을 위해 고객님의 성함과 생년월일이 필요합니다.


    [변경 단계]

    1. 본인 인증: 상담원에게 성함과 생년월일을 말씀해 주십시오. 저희가 고객님의 신원을 확인하겠습니다.

    2. 변경 항목 요청: 변경을 원하시는 적립 서비스의 종목명과 변경하고자 하는 내용(예: 적립 금액 변경, 주기 변경)을 말씀해 주십시오.

    3. 변경 내용 확인: 적립 최소 금액인 1,000원 이상으로 설정되었는지 확인 후, 저희가 변경된 내용을 다시 한번 읽어 드립니다.

    4. 최종 승인: 안내해 드린 내용이 맞다면 승인 의사를 밝혀 주십시오.

    5. 결과 안내: 변경 사항이 시스템에 반영되었다는 최종 확인 메시지를 받으시면 모든 절차가 완료됩니다.


    주의: 이미 예약된 당일의 적립 실행 건은 변경이 어려울 수 있으므로, 실행 예정일 최소 1영업일 전까지 변경을 요청해 주십시오.'
  domain: brokerage_investing
