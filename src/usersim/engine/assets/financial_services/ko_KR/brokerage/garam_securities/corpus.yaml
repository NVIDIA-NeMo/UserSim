- id: d4760a7d-454a-5fe6-a411-1c69a6805794
  title: '국내주식 거래: 해지·변경·상품 전환'
  body: '국내주식 거래 계좌의 해지 및 변경 절차를 안내해 드립니다.


    필요 사항: 본인 확인을 위한 성함과 생년월일 정보


    절차:

    1. 고객님께서 성함과 생년월일을 말씀해 주시면 본인 인증을 수행합니다.

    2. 계좌 내에 보유하신 주식이 있는지 확인합니다. 주식이 남아있는 경우, 모두 매도하시거나 타 계좌로 이전하셔야 해지가 가능합니다.

    3. 예수금(현금) 잔액을 확인하고, 연결된 출금 계좌로 전액 이체 요청을 하십니다.

    4. 모든 잔고가 0원임을 확인한 후, 상담원에게 계좌 해지를 최종 요청하십시오.

    5. 당사에서 해지 처리를 완료한 후, 처리 결과가 고객님께 안내됩니다.


    상품 전환의 경우, 다른 투자 상품으로의 변경을 원하시면 현재 포트폴리오 분석 후 적합성 원칙에 따라 안내해 드리겠습니다.'
