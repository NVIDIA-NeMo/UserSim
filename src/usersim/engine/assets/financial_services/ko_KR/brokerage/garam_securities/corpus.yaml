- id: d81f83e1-f3d8-5456-8775-da033a6472c8
  title: '미국주식 거래: 위험 안내'
  body: '미국주식 거래 서비스 이용 전 다음의 위험 사항을 반드시 확인하시기 바랍니다.


    1. 원금 비보장: 주식 및 펀드 등 투자상품은 예금자보호법에 따른 보호 대상이 아니며, 투자 결과에 따라 원금 손실이 발생할 수 있습니다.
    투자 판단의 책임은 고객 본인에게 있습니다.


    2. 예금자 보호 제외: 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 구매하신 미국주식 자체는 보호 대상이 아닙니다.


    3. 환율 변동 위험: 미국주식 투자는 달러로 이루어지므로, 주가 변동과 별개로 원-달러 환율 변동에 따라 추가적인 수익 또는 손실이 발생할
    수 있습니다.


    4. 세금 부담: 해외주식 매매차익에 대해 연간 2,500,000원의 기본공제를 제외한 나머지 금액에 대해 22%의 양도소득세가 부과됩니다.
    이는 고객이 직접 신고하고 납부해야 하는 사항입니다.'
