- id: 6a4226f9-b230-56d2-96a7-6d5a7884bc09
  title: update_beneficiary 도구 설명서
  body: "update_beneficiary 도구는 종합매매계좌의 출금 계좌로 등록된 은행 계좌 정보를 변경하는 기능을 수행합니다. 상담원은\
    \ 고객이 제공한 새로운 계좌 정보를 바탕으로 이 도구를 직접 호출합니다.\n\n- 호출 시점: 본인 인증이 완료되고, 변경할 대상 계좌와\
    \ 신규 은행 계좌 정보가 확인된 후\n- 입력 인수:\n  - account_id: 변경 대상이 되는 종합매증권 계좌의 고유 식별자\n \
    \ - new_bank_account_details: 새롭게 등록할 은행명, 계좌번호, 예금주 정보\n- 수행 결과: 해당 계좌의 출금 대상\
    \ 은행 계좌가 최신 정보로 업데이트됩니다.\n\n본 도구는 verify_identity를 통해 본인 확인이 된 경우에만 호출할 수 있습니다."
