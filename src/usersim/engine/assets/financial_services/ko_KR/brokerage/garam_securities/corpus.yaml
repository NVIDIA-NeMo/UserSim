- id: 110edc46-cae1-5efd-8338-30936b6cc0b6
  title: '연금저축계좌: 해지·변경·상품 전환'
  body: '연금저축계좌의 해지, 정보 변경 및 보유 상품 전환 절차를 안내해 드립니다.


    **계좌 해지 절차**

    1. 상담원에게 연금저축계좌 해지를 요청하십시오.

    2. 본인 확인을 위해 성함과 생년월일을 말씀해 주십시오.

    3. 상담원이 중도 해지 시 적용되는 16.5%의 기타소득세 부과 및 세액공제 받았던 금액의 환수 가능성에 대해 안내해 드립니다.

    4. 해지 의사를 최종 확정하시면, 세금을 제외한 잔액이 연결된 계좌로 입금되며 해지 처리가 완료됩니다.


    **계좌 정보 변경 절차**

    1. 변경하고자 하는 정보(연락처, 주소 등)를 말씀해 주십시오.

    2. 성함과 생년월일을 통해 본인 인증을 수행합니다.

    3. 변경 내용을 확인하신 후 최종 승인하시면 정보 업데이트가 완료됩니다.


    **보유 상품 전환 절차**

    1. 계좌 내에서 전환하고자 하는 상품과 새로 매수할 상품을 말씀해 주십시오.

    2. 현재 보유 상품의 매도 가능 여부와 예상 매도 금액을 확인합니다.

    3. 전환 실행을 요청하시면 기존 상품 매도 후 새 상품 매수 과정이 진행되며, 처리 결과가 안내됩니다.'
  domain: brokerage_investing
  product_category: garam_pension_savings
  document_type: how_to_guide
  source_authority: official
