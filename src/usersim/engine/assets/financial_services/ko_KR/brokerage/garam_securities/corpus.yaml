- id: 38a0aabc-8b39-572c-8820-9befe5e0d069
  title: '미국주식 거래: 가입과 이용 시작'
  body: '가람증권의 미국주식 거래 서비스를 시작하시려면 다음 단계를 따라 주십시오.


    1. 본인 인증 수행: 상담원에게 성함과 생년월일을 말씀해 주시면 본인 확인 절차를 진행합니다.

    2. 서비스 신청: 미국주식 거래 서비스 이용 신청 의사를 밝히시면, 내부 절차에 따라 계좌에 글로벌 투자 권한을 부여합니다.

    3. 투자 자금 준비 및 환전: 거래에 필요한 원화를 입금하신 후 환전을 요청하십시오. 이때 95%의 환전 수수료 우대율이 적용되어 비용 효율적으로
    달러를 확보하실 수 있습니다.

    4. 종목 선택 및 주문: 투자하시려는 미국 기업의 티커(Ticker)나 종목명을 말씀하시고 매수 주문을 요청하십시오. 거래 시 0.25%의
    미국주식 거래 수수료율이 적용됩니다.


    위 과정이 완료되면 실시간으로 주문 처리 상태를 확인하실 수 있으며, 체결 완료 시 포트폴리오에 해당 주식이 반영됩니다.'
