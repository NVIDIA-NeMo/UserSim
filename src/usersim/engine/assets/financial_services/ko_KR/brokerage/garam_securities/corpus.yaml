- id: e128dda0-86d7-59ca-b912-0dd08a4a42fe
  title: '개인형 퇴직연금(IRP): 전환이나 상위 상품을 고려할 때'
  body: '개인형 퇴직연금(IRP)과 연금저축계좌 사이에서 고민하시는 고객님을 위한 비교 안내입니다.


    1. 투자 가능 자산의 차이

    - 개인형 퇴직연금(IRP): 펀드, ETF 외에 ''예금''까지 담을 수 있어 보다 안정적인 자산 배분이 가능합니다.

    - 연금저축계좌: 펀드와 국내 상장 ETF 위주로 운용하며, 예금 편입은 불가능합니다.

    - 공통 사항: 두 상품 모두 국내외 개별 주식의 직접 투자는 불가능합니다.


    2. 세액공제 혜택

    - 두 상품을 합산하여 연간 최대 9,000,000원까지 세액공제 대상 납입이 가능합니다. (연금저축 단독으로는 600만원까지)


    3. 추천 대상

    - IRP 추천: 퇴직금을 관리하며 예금 등 안전자산을 포함해 종합적인 은퇴 준비를 원하는 고객님께 적합합니다.

    - 연금저축 추천: 상대적으로 운용 제약이 적고 유연한 관리를 원하는 고객님께 적합합니다.


    상세한 가입 대상은 ''개인형 퇴직연금(IRP): 가입 대상''을 확인하십시오.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: ed006af5-ef22-5721-bb2f-9920e4a06229
  title: '개인형 퇴직연금(IRP): 다른 상품과의 비교와 맞지 않는 경우'
  body: '개인형 퇴직연금(IRP)은 강력한 세제 혜택을 제공하지만, 목적과 상황에 따라 적합하지 않을 수 있습니다.


    1. IRP가 적합하지 않은 경우

    - 단기 자금 운용이 필요한 경우: 연금 목적 외 인출 시 16.5%의 기타소득세가 부과되므로, 55세 이전에 자금을 회수해야 할 가능성이
    높다면 불리합니다.

    - 개별 주식 투자를 선호하는 경우: IRP는 개별 주식을 직접 살 수 없습니다. 이 경우 ''국내주식 거래''나 ''미국주식 거래'' 서비스를
    이용하십시오.


    2. 중개형 ISA와 비교

    - IRP: 장기 은퇴 자금 마련 및 세액공제가 목적입니다. (납입 한도 연 1,800만원)

    - 중개형 ISA: 중단기 자산 형성 및 비과세 혜택이 목적입니다. (납입 한도 연 2,000만원)


    3. 요약

    - 노후 준비와 연말정산 세액공제(최대 9,000,000원 한도)가 최우선이라면 개인형 퇴직연금(IRP)이 최적의 선택입니다.

    - 유동성 확보와 비과세 혜택을 동시에 누리고 싶다면 중개형 ISA가 더 유리할 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_irp
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: a43251f4-4152-5fea-9b26-b3b6569dfc2d
  title: '개인형 퇴직연금(IRP): 가입과 이용 조건'
  body: 'Q: 개인형 퇴직연금(IRP)은 언제부터 연금으로 받을 수 있나요?

    A: 가입 후 55세 이후부터 연금 형태로 수령하실 수 있습니다.


    Q: 연금 수령 시 세금은 어떻게 되나요?

    A: 수령 시점의 연령에 따라 5.5%, 4.4%, 3.3%의 연금소득세가 적용됩니다.


    Q: 납입 한도는 어떻게 설정하나요?

    A: 연금저축을 포함한 전체 연금계좌의 연간 납입 한도는 합산하여 18,000,000원입니다. 가입 시 또는 가입 후 한도 변경 신청을 통해
    설정하실 수 있습니다.


    더 자세한 내용은 ''개인형 퇴직연금(IRP): 상품 개요''에서 확인하십시오.'
