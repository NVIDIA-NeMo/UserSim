  title: '국내주식 거래: 부정사용으로부터 고객을 보호하기 위해'
  body: '가람증권은 고객님의 소중한 자산을 보호하기 위해 보안을 최우선으로 합니다. 최근 증권사를 사칭하여 고수익을 보장한다며 특정 종목 매수를
    유도하거나, 개인정보를 요구하는 피싱 사례가 증가하고 있습니다. 가람증권은 어떠한 경우에도 고객님께 카드 번호, 비밀번호, 주민등록번호 전체와
    같은 민감한 정보를 요구하지 않습니다.


    계좌 정보 변경이나 상태 변경 등의 작업이 필요한 경우, 가람증권은 반드시 고객님의 성함과 생년월일을 확인하여 본인 인증을 수행합니다. 만약
    본인을 사칭한 연락을 받으셨거나, 비정상적인 거래 알림을 받으신 경우 즉시 고객센터로 신고하여 계좌 보호 조치를 취하시기 바랍니다.


    투자 판단의 책임은 고객님께 있으며, 당사는 특정 종목의 수익을 보장하지 않습니다. 신뢰할 수 없는 경로로 전달된 투자 정보에 주의하시고,
    항상 가람증권의 공식 채널을 통해 정보를 확인하십시오.'
