- id: 3148ba93-eed8-5b4d-8634-5f04572840d9
  title: '적립식 투자: 약관 변경 안내'
  body: '가람증권 적립식 투자 서비스의 효율적인 운영을 위해 다음과 같이 약관 내용을 안내드립니다. 본 내용은 고객님의 투자 환경을 최적화하고
    시스템 안정성을 유지하기 위한 최소한의 비용 체계와 운영 원칙을 담고 있습니다.


    1. 적립금 설정 및 이행: 고객님은 적립 최소 금액인 1,000원 이상의 금액을 설정하여 정기적으로 투자할 수 있습니다. 설정된 날짜에 계좌
    잔액이 부족하여 적립이 이루어지지 않은 경우, 해당 회차의 투자는 자동으로 취소되며 별도의 소급 적용은 되지 않습니다.


    2. 서비스 변경 및 종료: 가람증권은 시스템 업데이트 또는 관련 법령의 변경이 있을 때 약관을 변경할 수 있습니다. 변경 사항은 적용 30일
    전까지 온라인 고객센터 및 앱을 통해 공지합니다.


    3. 해지 및 환불: 적립식 투자 설정은 언제든지 해지할 수 있으며, 이미 매수된 주식이나 펀드는 해당 상품의 매도 절차에 따라 현금화할 수
    있습니다.


    본 서비스는 투자상품이므로 예금보험공사의 예금자보호 대상이 아니며, 원금이 보장되지 않습니다. 투자 판단의 최종 책임은 고객님께 있음을 유의하시기
    바랍니다.'
