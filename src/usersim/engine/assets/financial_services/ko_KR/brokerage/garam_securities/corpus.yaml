- id: 85280a30-f944-5149-93b7-f2c051d11b00
  title: '미국주식 거래: 가입 대상'
  body: '미국주식 거래 서비스 이용을 위한 가입 조건은 다음과 같습니다.


    - 가람증권 종합 계좌 보유: 가람증권의 비대면 계좌를 보유한 고객님 (필수)

    - 본인 인증 완료: 성함 및 생년월일을 통한 본인 확인 절차 완료 (필수)

    - 해외 투자 적합성 확인: 고객님의 투자 성향이 해외 주식 투자 위험을 감당할 수 있는 수준인지 확인 (필수)


    위 조건을 모두 충족하신 고객님은 즉시 미국주식 거래 서비스를 신청하여 이용하실 수 있습니다.'
