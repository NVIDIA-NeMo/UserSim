  title: '미국주식 거래: 금리·요율 안내'
  body: '미국주식 거래 서비스에 적용되는 주요 요율은 다음과 같습니다. 모든 요율은 별도의 공지가 없는 한 전 고객에게 동일하게 적용됩니다.


    - 미국주식 거래 수수료율: 0.25% (매수 및 매도 시 동일 적용)

    - 환전 수수료 우대율: 95% (원화 ↔ 달러 환전 시 적용)

    - 해외주식 양도소득세율: 22% (기본공제 초과분 대상, 지방소득세 포함)


    해당 요율은 가람증권의 효율적인 비용 구조를 바탕으로 책정되었으며, 시장 상황 및 정책 변경에 따라 조정될 수 있습니다.'
