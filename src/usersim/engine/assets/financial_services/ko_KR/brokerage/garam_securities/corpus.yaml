- id: a34044df-04a7-5c0a-b424-7464d8efc3aa
  title: '미국주식 거래: 처리가 끝나지 않거나 보류 중일 때'
  body: '미국주식 주문 후 ''처리 중'' 혹은 ''보류'' 상태가 지속될 경우 다음 사항을 확인해 주십시오.


    1. 미국 시장 거래 시간 확인: 미국 주식 시장은 한국 시간 기준으로 야간에 운영됩니다. 시장 운영 시간 외에 접수된 주문은 예약 주문으로
    처리되어 시장 개장 후 순차적으로 집행됩니다.

    2. 예수금 잔액 확인: 주문 금액 외에 0.25%의 거래 수수료가 포함된 충분한 달러 예수금이 있는지 확인하십시오. 잔액이 부족할 경우 주문이
    보류될 수 있습니다.

    3. 환전 처리 상태 확인: 원화를 달러로 환전하신 경우, 환전 처리가 완전히 완료되어 가용 잔액에 반영되었는지 확인하십시오.


    위 사항을 확인했음에도 문제가 해결되지 않는다면, 상담원에게 상황을 말씀해 주십시오. 저희가 즉시 내부 결제 시스템과 해외 거래소 접수 상태를
    대조 확인하여 처리 결과를 안내해 드리겠습니다. 필요 시 전문 처리 팀으로 에스컬레이션하여 신속히 해결하겠습니다.'
