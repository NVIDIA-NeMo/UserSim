  institution_id: garam_securities
- id: d2ea6114-6f27-5a29-8a72-16b6f02eded1
  title: '미국주식 거래: 다른 상품과의 비교와 맞지 않는 경우'
  body: '미국주식 거래는 글로벌 시장의 성장성에 투자하여 자산을 증식시키고자 하는 분들께 최적화된 서비스입니다. 환전 수수료 우대율 95%를
    통해 환전 비용을 낮추고, 미국주식 거래 수수료율 0.25%로 효율적인 거래 환경을 제공합니다.


    하지만 다음과 같은 경우에는 본 서비스가 적합하지 않을 수 있습니다.

    첫째, 원금 보존이 최우선인 투자자입니다. 미국주식 거래는 투자 상품이므로 예금보험공사의 보호 대상이 아니며 원금이 보장되지 않습니다.

    둘째, 복잡한 세금 신고를 피하고 싶으신 분입니다. 연간 2,500,000원을 초과하는 수익에 대해 22%의 해외주식 양도소득세율(지방소득세
    포함)이 적용되며, 매년 5월에 직접 신고해야 하는 번거로움이 있습니다.


    안정적인 노후 준비와 세액공제 혜택을 원하신다면 연금저축계좌나 개인형 퇴직연금(IRP)을 고려하십시오. 반면, 공격적인 글로벌 자산 배분과
    개별 종목 투자를 선호하신다면 미국주식 거래가 최선의 선택입니다.'
