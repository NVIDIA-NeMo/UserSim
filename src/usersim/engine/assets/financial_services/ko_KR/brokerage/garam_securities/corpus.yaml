- id: f213a7ce-e846-5b50-97a7-d6a0f41ab9d0
  title: '연금저축계좌: 한도·제한과 유의사항'
  body: '연금저축계좌의 효율적인 운영을 위해 다음의 납입 한도와 제한 사항을 안내드립니다.


    1. 납입 및 세액공제 한도

    - 연금계좌 연간 납입 한도: 18,000,000원 (다른 연금계좌와 합산 기준)

    - 연금저축 세액공제 대상 납입 한도: 6,000,000원

    - 연금저축과 IRP를 합한 세액공제 대상 납입 한도: 9,000,000원


    2. 투자 가능 상품 및 제한

    - 본 계좌를 통해 펀드 및 국내 상장 ETF 등에 투자하실 수 있습니다. 다만, 레버리지 및 인버스 ETF는 투자가 제한되며, 국내외 개별
    주식에 직접 투자하는 것은 불가능합니다.


    3. 주요 유의사항

    - 투자 상품은 예금자보호법에 따른 보호 대상이 아니며, 운용 결과에 따라 원금이 보장되지 않습니다.

    - 적합성 원칙에 따라 고객님의 투자 성향에 맞는 상품을 권유하며, 최종 투자 판단의 책임은 고객님께 있습니다.

    - 중도 인출 시 세제 혜택으로 받은 금액을 반환해야 하며, 연금이 아닌 형태로 인출할 경우 16.5%의 기타소득세가 부과될 수 있음을 유의하십시오.'
