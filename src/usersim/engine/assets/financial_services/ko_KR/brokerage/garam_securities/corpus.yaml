    대상: 기간 내 연금저축계좌에 신규로 납입하거나 기존 납입 금액을 증액한 고객님


    혜택: 이벤트 기간 중 세액공제 대상 납입 한도인 6,000,000원을 모두 채우신 고객님 중 추첨을 통해 투자 지원금을 제공합니다.


    장기적인 자산 성장을 위해 지금 바로 납입 계획을 세워보십시오. 상세한 납입 한도 안내는 ''연금저축계좌: 연금저축 세액공제 대상 납입 한도
