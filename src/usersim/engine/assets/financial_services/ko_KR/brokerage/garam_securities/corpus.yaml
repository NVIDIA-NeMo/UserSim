- id: d98d2787-8c1e-5799-a673-4bb7f9054893
  title: '국내주식 거래: 수수료 안내'
  body: '국내주식 거래 서비스에 적용되는 수수료 및 세금 상세 내역입니다.


    - 국내주식 거래 수수료율(모바일): 0.015%

    - 증권거래세율(코스피, 농어촌특별세 포함): 0.2%

    - 증권거래세율(코스닥): 0.2%


    상기 수수료는 최적의 거래 환경 유지와 시스템 안정성을 위한 최소한의 비용으로 책정되었습니다.'
