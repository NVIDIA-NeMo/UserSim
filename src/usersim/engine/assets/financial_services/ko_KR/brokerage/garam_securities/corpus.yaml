- id: 4ac0b05c-1f8f-577c-9407-54f97d26308b
  title: '연금저축계좌: 가입부터 이용까지'
  body: '본 문서는 고객 응대 상담원이 연금저축계좌의 가입 및 이용 절차를 안내하기 위한 매뉴얼입니다.


    [가입 단계]

    1. 적합성 원칙 준수: 고객의 재산 상황, 투자 경험, 목적을 확인하여 상품을 권유하십시오. 투자 판단의 책임은 고객에게 있음을 명확히 안내하십시오.

    2. 본인 인증: 성함과 생년월일을 확인하여 본인 인증을 수행합니다.


    [이용 및 납입 한도]

    - 연금계좌 연간 납입 한도: 18,000,000원

    - 세액공제 대상 납입 한도(연금저축 단독): 6,000,000원

    - 세액공제 대상 납입 한도(연금저축+IRP 합산): 9,000,000원


    [세액공제율]

    - 총급여 5,500만원 이하: 16.5%

    - 총급여 5,500만원 초과: 13.2%


    [투자 가능 상품]

    - 투자 가능: 펀드, 국내 상장 ETF(단, 레버리지 및 인버스 ETF는 제외)

    - 투자 불가: 국내외 개별 주식 직접 매수 불가


    [수령 및 과세]

    - 연금소득세율: 55세~70세 미만 5.5%, 70세~80세 미만 4.4%, 80세 이상 3.3%

    - 분리과세 기준: 사적연금 소득 연 15,000,000원 초과 시 선택 가능

    - 기타소득세: 연금 외 인출 시 16.5% 부과


    [주의사항]

    예탁금은 예금보험공사를 통해 1인당 1억원까지 보호되나, 펀드 및 ETF 등 투자상품은 원금이 보장되지 않으며 보호 대상이 아닙니다.'
  domain: brokerage_investing
  product_category: garam_pension_savings
  document_type: product_sheet
