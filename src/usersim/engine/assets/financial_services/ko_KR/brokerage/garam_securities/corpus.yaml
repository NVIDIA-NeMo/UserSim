  institution_id: garam_securities
- id: cd21fed6-a44f-5ea2-9c4c-98c5a4e7f3c2
  title: '연금저축계좌: 세액공제율(총급여 5,500만원 이하) 안내'
  body: 'Q: 총급여가 5,500만원 이하인 경우 세액공제를 얼마나 받을 수 있습니까?


    A: 총급여 5,500만원 이하인 고객님께서는 16.5%의 세액공제율을 적용받으십니다. 연금저축계좌의 세액공제 대상 납입 한도인 6,000,000원을
    모두 납입하셨을 경우, 최대 990,000원의 세금을 환급받으실 수 있습니다. IRP와 합산하여 9,000,000원까지 납입하신 경우 혜택
    범위가 더욱 확대됩니다.'
