- id: 66092d2d-2012-5517-86a5-01f4621627a4
  title: '미국주식 거래: 상품 개요'
  body: '가람증권의 미국주식 거래 서비스는 전 세계 최대 규모의 미국 자본 시장에 직접 투자하여 글로벌 자산 성장을 도모할 수 있는 전문 서비스입니다.
    사용자 친화적인 인터페이스를 통해 쉽고 빠르게 미국 상장 기업의 주식을 거래하실 수 있습니다.


    본 서비스의 핵심 비용 및 세금 체계는 다음과 같습니다. 미국주식 거래 수수료율은 0.25%이며, 투자자의 비용 부담을 낮추기 위해 95%의
    환전 수수료 우대율을 제공하고 있습니다. 세금의 경우, 연간 해외주식 양도소득 기본공제 2,500,000원을 제외한 매매차익에 대해 22%의
    해외주식 양도소득세율(지방소득세 포함)이 적용됩니다.


    투자 시 유의하시기 바랍니다. 본 서비스는 예금보험공사를 통한 예탁금 보호(1인당 최대 1억원) 대상인 예탁금과 달리, 주식과 같은 투자상품은
    보호 대상이 아니며 원금이 보장되지 않습니다. 모든 투자는 고객님의 투자 성향을 고려한 적합성 원칙에 따라 이루어져야 하며, 최종 투자 판단의
    책임은 고객님께 있습니다.'
