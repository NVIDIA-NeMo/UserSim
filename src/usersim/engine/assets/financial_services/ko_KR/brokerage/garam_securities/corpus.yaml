- id: 636658d7-b55e-54ab-8c95-40514a4b3bfd
  title: '연금저축계좌: 금리·요율이 정해지는 방식과 적용'
  body: '연금저축계좌의 주요 과세 요율 및 적용 방식입니다. 본 요율은 관련 세법에 따라 적용됩니다.


    **1. 연금 수령 시 연금소득세율 (나이 기준)**

    - 55세 이상 70세 미만: 5.5%

    - 70세 이상 80세 미만: 4.4%

    - 80세 이상: 3.3%


    **2. 사적연금 분리과세 기준**

    - 기준 금액: 연 15,000,000원

    - 적용: 연간 사적연금 수령액이 15,000,000원을 초과하는 경우, 종합과세와 16.5% 분리과세 중 고객님께 유리한 방식을 선택하여
    신고하실 수 있습니다.


    **3. 중도 인출 시 세율**

    - 연금 외 수령: 16.5% (기타소득세)


    위 요율은 정부의 세법 개정에 따라 변경될 수 있으며, 변경 시 관련 규정에 따라 적용됩니다.'
  domain: brokerage_investing
  product_category: garam_pension_savings
