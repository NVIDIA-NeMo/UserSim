- id: 9c07daca-6ead-5c42-8daa-daf91decb2f1
  title: '적립식 투자: 이 상품을 사칭한 사기 주의'
  body: '가람증권의 적립식 투자 서비스를 사칭하여 고수익을 보장한다고 유혹하는 금융 사기에 각별히 주의하시기 바랍니다.


    최근 특정 종목의 추천과 함께 가람증권의 이름을 도용하여 ''원금 보장'' 또는 ''확정 수익''을 약속하며 개인적인 송금을 요구하는 사례가
    보고되고 있습니다. 가람증권은 어떠한 경우에도 특정 종목의 수익을 보장하지 않으며, 고객님의 계좌가 아닌 개인 명의의 계좌로 입금을 요구하지
    않습니다.


    가람증권은 본인 인증을 위해 성함과 생년월일은 확인하지만, 카드 번호, 비밀번호, 주민등록번호 전체와 같은 민감한 정보는 절대 요구하지 않습니다.
    만약 이러한 정보를 요구하거나 비정상적인 투자 경로를 안내하는 연락을 받으셨다면, 즉시 대응을 중단하시고 당사 고객센터로 신고해 주십시오.


    부정 거래가 의심되는 경우 당사는 즉각적인 계좌 보호 조치를 취하며, 접수된 분쟁은 내부 규정에 따라 공정하게 처리하고 진행 상황을 안내해
    드립니다.'
