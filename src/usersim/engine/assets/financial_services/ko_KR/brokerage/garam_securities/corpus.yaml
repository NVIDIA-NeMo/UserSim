- id: 7665780e-7c40-5dfa-ba1b-c31ac03cf1f2
  title: '개인형 퇴직연금(IRP): 상품 개요'
  body: '개인형 퇴직연금(IRP)은 퇴직금 관리와 추가 납입을 통한 세액공제 혜택을 동시에 누릴 수 있는 종합 은퇴 준비 계좌입니다. 고객님의
    안정적인 노후 자산 형성을 위해 예금부터 펀드, 국내 상장 ETF(레버리지 및 인버스 제외)까지 다양한 상품을 하나의 계좌에서 관리하실 수
    있습니다.


    본 상품의 주요 혜택과 제한 사항은 다음과 같습니다.

    - 계좌 수수료(비대면 개설): 0원으로 책정되어 고객님의 투자 진입 장벽을 낮추었습니다.

    - 세액공제 혜택: 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 최대 9,000,000원입니다.

    - 납입 한도: 연금계좌 연간 납입 한도는 합산하여 18,000,000원까지 가능합니다.


    주의사항으로, IRP 계좌 내에서는 국내외 개별 주식에 직접 투자하실 수 없으며, 투자 상품(펀드, ETF 등)은 예금자보호 대상이 아니므로
    원금이 보장되지 않습니다. 다만, 계좌 내 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 자세한 비교 사항은 ''개인형 퇴직연금(IRP):
    당사의 비슷한 상품과의 비교''를 참고하십시오.'
