- id: ea13cdba-33a7-530f-8104-490275104af5
  title: '연금저축계좌: 연금계좌 연간 납입 한도 안내'
  body: "질문: 연금저축계좌에 일 년 동안 최대 얼마까지 납입할 수 있나요?\n\n답변: 연금계좌 연간 납입 한도는 연금저축과 IRP를 모두\
    \ 합산하여 총 18,000,000원까지입니다. \n\n이 한도는 세액공제 대상 금액과는 별개의 개념입니다. 예를 들어, 연간 18,000,000원을\
    \ 납입하시더라도 세액공제를 받을 수 있는 한도는 연금저축만으로는 6,000,000원, IRP를 포함하면 최대 9,000,000원까지라는 점을\
    \ 유의하십시오. 한도 설정 및 변경 방법은 '연금저축계좌: 자주 하는 업무의 처리 절차'에서 확인하실 수 있습니다."
  domain: brokerage_investing
