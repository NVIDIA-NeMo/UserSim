- id: b7730fb9-3a63-5b9a-80e5-43deee0a8728
  title: '국내주식 거래: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 거래 명세서의 금액이 예상과 다르다고 하실 때, 상담원은 다음의 순서로 원인을 점검하십시오.


    1. 수수료 반영 확인

    - 고객이 계산한 금액에 모바일 거래 수수료 0.015%가 누락되었는지 확인하십시오. 매수 시에는 합산되어 차감되고, 매도 시에는 수수료만큼
    적게 입금됩니다.


    2. 증권거래세 차감 여부 확인 (매도 시)

    - 주식을 매도한 경우, 코스피 또는 코스닥 종목에 대해 0.2%의 증권거래세가 정확히 차감되었는지 확인하십시오. 이는 법정 세율로 반드시
    징수되는 금액입니다.


    3. 체결 단가 확인

    - 지정가 주문의 경우 요청하신 가격에 정확히 체결되었는지, 혹은 시장가 주문으로 인해 예상 단가와 차이가 발생했는지 확인하십시오.


    4. 원천징수 여부 확인

    - 배당금 입금 내역인 경우, 15.4%의 배당소득세가 원천징수된 후 지급되었음을 안내하십시오.


    위의 항목을 모두 확인했음에도 금액 불일치가 해결되지 않는다면, 고객님의 거래 일시와 종목명을 기록하여 내부 정산 팀으로 에스컬레이션하십시오.
    조사 결과는 고객님께 신속하게 안내해 드리겠습니다.'
