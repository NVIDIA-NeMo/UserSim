- id: cad3b949-7a5d-538e-b82a-1de7198d251d
  title: '연금저축계좌: 당사의 비슷한 상품과의 비교'
  body: '가람증권의 주요 절세 계좌 비교 안내입니다.


    - 연금저축계좌: 노후 준비를 위한 장기 투자 상품입니다. 연금저축 단독으로는 6,000,000원까지 세액공제가 가능하며, 펀드와 국내 상장
    ETF에 투자할 수 있습니다. 장기적인 세액공제 혜택을 원하는 고객님께 적합합니다.

    - 개인형 퇴직연금(IRP): 퇴직금 관리와 추가 납입이 가능하며, 연금저축과 합산하여 최대 9,000,000원까지 세액공제를 받을 수 있습니다.
    특히 예금 상품까지 담을 수 있어 더 안정적인 자산 배분을 원하는 고객님께 유리합니다.

    - 중개형 ISA: 3년의 의무가입기간이 있으며 비과세 및 분리과세 혜택을 제공합니다. 연금 상품보다 중단기 자산 형성에 적합하며, 국내 상장주식
    직접 투자가 가능하다는 점에서 연금저축계좌와 차이가 있습니다.


    각 상품의 상세 내용은 ''연금저축계좌: 상품 개요'', ''개인형 퇴직연금(IRP): 상품 개요'', ''중개형 ISA: 상품 개요''를
    참고하십시오.'
