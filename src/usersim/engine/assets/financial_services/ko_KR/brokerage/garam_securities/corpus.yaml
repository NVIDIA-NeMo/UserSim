- id: 42f5ee80-a222-5c16-b872-9d716c521c79
  title: '개인형 퇴직연금(IRP): 필요 서류'
  body: '| 구분 | 필요 서류 | 비고 |

    | :--- | :--- | :--- |

    | 본인 확인 | 주민등록증, 운전면허증 또는 여권 | 비대면 개설 시 사진 촬영 제출 |

    | 퇴직금 이전 | 퇴직금 산정서 또는 퇴직금 지급 확인서 | 이전 기관(회사) 발행분 |

    | 가입자 자격 증명 | 소득금액증명원 또는 재직증명서 | 필요 시 요청 |

    | 정보 변경 | 변경 사항을 입증할 수 있는 공적 서류 | 가족관계증명서 등 |


    ※ 모든 서류는 최신 발행분이어야 하며, 비대면 신청 시 앱을 통해 디지털 파일로 제출하시기 바랍니다.'
