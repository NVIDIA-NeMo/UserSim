- id: 37e92706-520a-520d-ae22-40d4a7e78514
  title: '연금저축계좌: 약관'
  body: '본 약관은 가람증권 연금저축계좌의 이용 조건 및 권리와 의무를 규정합니다.


    1. 납입 및 한도: 연금계좌의 연간 납입 한도는 18,000,000원입니다. 세액공제 대상 납입 한도는 연금저축만으로 운용 시 6,000,000원이며,
    개인형 퇴직연금(IRP)을 합산할 경우 최대 9,000,000원까지 가능합니다.


    2. 세제 혜택 및 과세: 고객님의 총급여가 5,500만원 이하인 경우 16.5%, 5,500만원을 초과하는 경우 13.2%의 세액공제율이
    적용됩니다. 단, 세제 혜택을 받은 후 연금 외의 형태로 중도 인출할 경우 16.5%의 기타소득세가 부과됩니다.


    3. 연금 수령: 55세 이후 연금으로 수령 시, 연령에 따라 5.5%, 4.4%, 3.3%의 연금소득세가 차등 적용됩니다. 사적연금 소득이
    연 15,000,000원을 초과하는 경우 종합과세 또는 16.5% 분리과세 중 선택할 수 있습니다.


    4. 계약의 종료: 고객의 요청에 의한 해지 또는 관련 법령 및 내부 규정에 따른 강제 종료 시 계약은 종료됩니다. 해지 시에는 원금 및 수익금에서
    관련 세금이 원천징수된 후 지급됩니다.'
