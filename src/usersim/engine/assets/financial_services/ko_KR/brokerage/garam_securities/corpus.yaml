- id: 7ed86a19-1e26-5883-9a1b-b94aee6fe2df
  title: '미국주식 거래: 로그인하거나 접속할 수 없을 때'
  body: '서비스 로그인이나 접속에 어려움을 겪으시는 경우 다음 순서대로 확인해 주십시오.


    [증상 및 원인]

    - 로그인 실패: 비밀번호 오입력 또는 계좌 잠금 상태일 가능성이 높습니다.

    - 접속 지연/불가: 네트워크 연결 불안정 또는 서비스 일시 점검 중일 수 있습니다.


    [해결 방법]

    1. 네트워크 상태 확인: Wi-Fi 또는 모바일 데이터 연결 상태를 확인하고 다시 시도해 주십시오.

    2. 비밀번호 재확인: 대소문자 구분 및 오타 여부를 확인하십시오.

    3. 계좌 상태 확인: 장기간 미사용으로 인한 휴면 계좌 전환 여부를 확인하십시오.


    [에스컬레이션 절차]

    위 방법으로 해결되지 않는 경우 저희에게 요청하십시오. 저희가 다음 단계를 통해 해결을 도와드리겠습니다.

    - 본인 확인: 성함과 생년월일을 통해 본인 인증을 수행합니다.

    - 계좌 상태 점검: 내부 시스템을 통해 잠금 여부나 오류 코드를 확인합니다.

    - 조치 적용: 비밀번호 초기화 링크를 발송하거나 계좌 잠금을 해제하며, 처리 결과는 즉시 안내해 드립니다.'
