  institution_id: garam_securities
- id: 5becc5fb-2b0a-594c-80be-87832cfd2cc4
  title: '중개형 ISA: 필요 서류'
  body: '중개형 ISA 가입을 위해 준비하셔야 할 서류는 가입 유형에 따라 다음과 같습니다.


    - 일반형 가입: 본인 확인을 위한 신분증(주민등록증, 운전면허증 등)

    - 서민형 가입: 신분증 및 소득확인증명서(국세청 발행) 등 서민형 가입 자격을 증빙할 수 있는 서류

    - 기존 계좌 이전 가입: 이전 기관의 계좌 번호 및 이전 신청서


    모든 서류는 비대면으로 제출 가능하며, 서류 검토 후 가입 승인이 완료됩니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: a86b00ee-56d4-56bf-8014-d946829ebedd
  title: '중개형 ISA: 다른 회사의 일반적인 상품과의 비교'
  body: '가람증권의 중개형 ISA와 타사의 일반 주식 계좌를 비교하여 안내해 드립니다.


    - 세제 혜택: 일반 주식 계좌는 배당소득에 대해 15.4%가 원천징수되지만, 중개형 ISA는 순이익 2,000,000원(서민형 4,000,000원)까지
    비과세되며 초과분은 9.9%로 저율 분리과세됩니다.

    - 운용 효율성: 일반 계좌는 손익 통산이 되지 않아 개별 종목의 이익에 대해 과세되나, 중개형 ISA는 계좌 내 전체 손익을 합산하여 순이익에
    대해서만 과세하므로 훨씬 유리합니다.

    - 제약 사항: 일반 계좌는 입출금이 자유로우나, 중개형 ISA는 세제 혜택 유지를 위해 3년의 의무가입기간을 준수해야 합니다.


    단기적인 자금 운용이 필요하신 분께는 일반 계좌가 적합할 수 있으나, 중장기적인 투자와 절세를 동시에 추구하시는 분께는 중개형 ISA가 압도적으로
    유리한 선택입니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: c58dcf97-5692-5b00-b1d7-09bc4d64ca3e
  title: '중개형 ISA: 위험 안내'
  body: '중개형 ISA를 이용하시기 전, 다음의 위험 고지 사항을 반드시 확인하시기 바랍니다.


    1. 원금 비보장: 중개형 ISA를 통해 투자하시는 주식, 펀드, ETF 등 투자 상품은 예금자보호법에 따른 보호 대상이 아니며, 투자 결과에
    따라 원금 손실이 발생할 수 있습니다. 투자 판단의 책임은 고객 본인에게 있습니다.


    2. 예금자 보호 한도: 계좌 내 투자 상품이 아닌 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다.


    3. 의무가입기간 및 세제 혜택: 본 상품은 의무가입기간 3년을 전제로 세제 혜택이 제공됩니다. 기간 내 중도 해지 시 비과세 및 분리과세
    혜택을 받을 수 없으며, 일반 과세로 전환되어 세금이 부과될 수 있습니다.


    4. 적합성 원칙: 가람증권은 고객님의 투자 성향과 재산 상황에 적합한 상품을 권유하는 적합성 원칙을 준수합니다. 그러나 특정 종목의 수익을
    보장하지 않으며, 개별적인 세무 상담이나 법률 자문은 제공하지 않습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: 5803d431-c993-506f-9933-50d9ee6675e5
  title: '중개형 ISA: 금리·요율이 정해지는 방식과 적용'
  body: '중개형 ISA의 과세 요율은 관련 법령인 조세특례제한법에 따라 다음과 같이 적용됩니다.


    1. 비과세 요율 (0%)

    순이익 중 일반형은 2,000,000원, 서민형은 4,000,000원까지 세금이 부과되지 않는 0%의 세율이 적용됩니다.


    2. 분리과세 요율 (9.9%)

    위의 비과세 한도를 초과하여 발생한 순이익에 대해서는 지방소득세를 포함하여 9.9%의 단일 세율이 적용됩니다. 이는 종합소득에 합산되지 않고
    별도로 과세되는 방식입니다.


    해당 요율은 모든 중개형 ISA 고객에게 동일하게 적용되며, 가입 시 선택하거나 증빙한 유형(일반형/서민형)에 따라 비과세 한도 금액만 차등
    적용됩니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: f66ecc09-51b1-5475-8c7a-b82490c8b71d
  title: '중개형 ISA: 추천·장기 이용 혜택'
  body: 가람증권에서 중개형 ISA 계좌를 통해 스마트한 자산 성장을 시작하십시오. 지금 친구를 추천하여 신규 가입이 완료될 경우, 추천인과
    피추천인 모두에게 투자 지원금을 제공해 드립니다. 특히 의무가입기간인 3년을 충실히 유지하신 고객님께는 만기 시 추가 혜택을 제공하여 장기
    투자의 가치를 더해 드립니다. 절세 혜택과 함께 가람증권만의 특별한 리워드로 투자 효율을 극대화하시기 바랍니다.
  domain: brokerage_investing
  product_category: garam_isa
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: bcb5d7fc-1ed2-5cd5-8484-b8a75f89a462
  title: '중개형 ISA: 안전한 이용을 위한 수칙'
  body: '가람증권은 고객님의 소중한 자산과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 안전한 금융 거래를 위해 다음 수칙을 반드시 준수하여
    주십시오.


    첫째, 가람증권은 어떠한 경우에도 고객님의 비밀번호, 카드 번호, 주민등록번호 전체를 요구하지 않습니다. 특히 문자 메시지나 메신저를 통해
    앱 설치 파일(APK) 다운로드를 유도하거나 개인정보 입력을 요청하는 경우, 이는 명백한 사기이므로 즉시 삭제하시고 당사 고객센터로 신고해
    주십시오.


    둘째, 계좌 정보 변경과 같은 주요 상태 변경 작업 시, 당사는 고객님의 성함과 생년월일을 통해 본인 인증을 수행합니다. 이 외의 민감한 정보
    요구는 가람증권의 공식 절차가 아님을 유의하십시오.


    셋째, 부정 거래가 의심되는 징후를 발견하시거나 계좌 도용이 우려될 경우, 즉시 당사 실시간 상담 채널을 통해 계좌 보호 조치를 요청하십시오.
    가람증권은 부정 거래 의심 시 즉각적인 계좌 동결 및 보호 조치를 통해 피해를 최소화합니다.


    고객님의 각별한 주의가 안전한 투자 환경을 만듭니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: garam_securities
- id: c6bc04d2-1ecd-5933-92ee-12c63bc79112
  title: '중개형 ISA: 약관 변경 안내'
  body: '본 안내는 중개형 ISA 서비스 이용 약관의 주요 변경 사항 및 준수 사항을 다룹니다. 고객님께서는 아래 내용을 확인하시어 서비스
    이용에 차질이 없으시길 바랍니다.


    1. 납입 한도 준수 의무: 중개형 ISA의 연간 납입 한도는 20,000,000원이며, 총 납입 한도는 100,000,000원입니다. 해당
    한도를 초과하는 납입은 제한되며, 이는 관련 법령 및 당사 약관에 따라 엄격히 관리됩니다.


    2. 의무가입기간의 유지: 본 상품의 의무가입기간은 3년입니다. 의무가입기간 내에 정당한 사유 없이 중도 해지하실 경우, 그동안 적용받으신
    비과세 및 분리과세 혜택이 추징될 수 있으며 이는 고객님의 책임으로 귀속됩니다.


    3. 세제 혜택 적용: 일반형의 경우 2,000,000원, 서민형의 경우 4,000,000원까지의 순이익에 대해 비과세 혜택을 제공합니다.
    비과세 한도를 초과하는 순이익에 대해서는 9.9%의 분리과세율이 적용됩니다.


    4. 약관 변경 통지: 관련 법령의 개정이나 금융당국의 지침 변경으로 인해 약관이 변경될 경우, 가람증권은 앱 공지사항 또는 개별 통지를 통해
    변경 내용을 안내합니다. 안내 후 일정 기간 내에 거부 의사를 밝히지 않으시면 변경된 약관에 동의하신 것으로 간주됩니다.'
