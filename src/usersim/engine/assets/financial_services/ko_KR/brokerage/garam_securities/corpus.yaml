- id: 9332f9e9-e25c-5a77-ae0b-df0c42fc1dcf
  title: '연금저축계좌: 전환이나 상위 상품을 고려할 때'
  body: '연금저축계좌에서 개인형 퇴직연금(IRP)으로의 전환 또는 병행 이용을 고려하시는 경우, 다음의 차이점을 참고하십시오.


    연금저축계좌는 펀드와 ETF 중심의 유연한 운용이 가능하며 세액공제 대상 납입 한도가 6,000,000원입니다. 반면, 개인형 퇴직연금(IRP)은
    예금까지 담을 수 있어 안정적인 자산 배분이 가능하며, 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 9,000,000원까지 확대되어
    더 큰 절세 혜택을 누릴 수 있습니다.


    공격적인 ETF 투자와 간편한 관리를 원하신다면 연금저축계좌가 적합하며, 퇴직금 관리와 함께 예금을 포함한 종합적인 은퇴 준비를 원하신다면
    IRP가 더 유리한 선택입니다. 고객님의 은퇴 설계 목적에 맞춰 두 계좌를 적절히 조합하여 활용하시기 바랍니다.'
  domain: brokerage_investing
