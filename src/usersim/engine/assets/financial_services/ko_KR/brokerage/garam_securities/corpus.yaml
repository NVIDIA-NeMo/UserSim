- id: 803db6d2-6db8-5cb4-abeb-fc035c2e6f0d
  title: '국내주식 거래: 자주 하는 업무의 처리 절차'
  body: '가람증권의 ''국내주식 거래''를 통해 주식을 매수하는 표준 절차를 안내해 드립니다. 저희는 사용자 친화적인 인터페이스와 효율적인
    비용 구조를 통해 빠른 거래를 지원합니다.


    1. 본인 인증: 상담원에게 고객님의 성함과 생년월일을 제공하여 본인 확인을 완료하십시오.

    2. 매수 요청: 구매하고자 하는 종목명과 수량 또는 총 예산을 말씀해 주십시오.

    3. 거래 조건 확인: 현재 시장가 또는 지정가 기준의 예상 체결 금액을 안내받으십시오. 이때 거래 금액의 0.015%에 해당하는 모바일 거래
    수수료가 함께 계산되어 안내됩니다.

    4. 최종 승인: 안내받으신 총 결제 금액(주식 대금 + 수수료 0.015%)을 확인하시고 매수 승인을 요청하십시오.

    5. 체결 확인: 주문이 완료되면 체결 여부와 최종 매수 단가가 안내되며, 보유 주식 내역에 즉시 반영됩니다.


    주식을 매도하실 때는 매도 금액에서 0.2%의 증권거래세(코스피/코스닥 동일)가 자동으로 차감된 후 나머지 금액이 계좌로 입금됩니다.'
  domain: brokerage_investing
  product_category: garam_domestic_stock
  document_type: how_to_guide
