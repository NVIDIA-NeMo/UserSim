- id: 5259aaf1-ca6e-518a-9235-fa0e0bacfe4c
  title: '개인형 퇴직연금(IRP): 진행 중인 이벤트'
  body: '가람증권이 고객님의 든든한 노후 준비를 응원하며 ''비대면 IRP 계좌 개설 이벤트''를 진행하고 있습니다.


    - 이벤트 기간: 2024년 1월 1일부터 2024년 12월 31일까지

    - 혜택 내용: 기간 내 모바일 앱을 통해 개인형 퇴직연금(IRP) 계좌를 신규로 개설하시는 모든 고객님께 계좌 수수료(비대면 개설) 0원
    혜택을 제공합니다.

    - 대상: 가람증권 IRP 계좌를 처음 개설하시는 개인 고객


    연금계좌 연간 납입 한도 18,000,000원을 활용하여 효율적인 자산 운용을 시작하시고, 최대 9,000,000원의 세액공제 혜택(연금저축
    합산)까지 모두 챙기십시오.'
