- id: 6e4602fe-d3ad-5137-95ac-bfc2c2a3d671
  title: '적립식 투자: 거래가 거절되거나 제한되었을 때'
  body: '정기적으로 진행되어야 할 적립식 투자 거래가 거절되었거나 제한되었다면 다음의 원인을 확인해 주십시오.


    1. 예상되는 원인

    - 계좌 잔액 부족: 적립 예정일에 계좌 내 예수금이 설정된 적립 금액(최소 1,000원 이상)보다 적을 경우 거래가 거절됩니다.

    - 계좌 상태 제한: 압류, 휴면 계좌 전환 또는 보안상의 이유로 계좌 거래가 일시 제한된 경우입니다.

    - 상품 거래 정지: 투자 대상 종목이 거래소에 의해 거래 정지된 경우 적립이 이루어지지 않습니다.


    2. 해결 방법

    - 잔액 확인: 계좌에 충분한 금액이 있는지 확인하시고, 부족 시 부족분을 입금하십시오.

    - 계좌 상태 확인: 상담원을 통해 계좌의 정상 이용 가능 여부를 확인하십시오.


    3. 에스컬레이션 및 처리

    - 위의 조치 후에도 문제가 해결되지 않거나 원인 불명의 제한이 있는 경우, 당사 전문 처리 팀으로 사안을 에스컬레이션하여 정밀 조사를 진행합니다.
    조사 결과는 내부 절차에 따라 신속히 고객님께 안내해 드리겠습니다.'
