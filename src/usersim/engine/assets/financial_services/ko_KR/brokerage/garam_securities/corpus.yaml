- id: 1aee63c3-91f6-5684-99f1-8f7e4253093e
  title: '개인형 퇴직연금(IRP): 금리·요율 안내'
  body: '개인형 퇴직연금(IRP)의 과세 요율 및 세제 혜택 안내입니다.


    [연금 수령 시 세율]

    55세 이후 연금으로 수령하실 경우, 수령 시점의 연령에 따라 다음의 연금소득세가 적용됩니다.

    - 연령별 세율: 5.5%, 4.4%, 3.3% (나이에 따라 차등 적용)

    - 사적연금 소득이 연 1,500만원을 초과하는 경우: 종합과세 또는 16.5% 분리과세 중 선택 가능


    [중도 인출 및 해지 시 세율]

    - 연금 외 형태로 인출하거나 중도 해지하는 경우: 16.5%의 기타소득세가 부과됩니다.


    [세액공제 혜택]

    - 연금저축과 IRP를 합한 세액공제 대상 납입 한도는 9,000,000원이며, 고객님의 총급여 수준에 따라 공제율이 결정됩니다.'
