  institution_id: garam_securities
- id: 34e7d087-1358-53f6-97a2-1606cc73a579
  title: '개인형 퇴직연금(IRP): 연금계좌 연간 납입 한도 안내'
  body: 'Q: 개인형 퇴직연금(IRP)을 포함해 연간 최대 얼마까지 납입할 수 있습니까?


    A: 연금저축계좌와 개인형 퇴직연금(IRP)을 모두 합산하여 연간 최대 18,000,000원까지 납입하실 수 있습니다. 이는 모든 금융기관에
    개설된 해당 성격의 계좌를 합산한 한도입니다.


    Q: 납입 한도와 세액공제 한도는 동일한가요?


    A: 다릅니다. 납입은 합산 18,000,000원까지 가능하지만, 세액공제 혜택을 받을 수 있는 납입 한도는 연금저축과 IRP를 합해 연간
    9,000,000원까지입니다. 자세한 공제 내용은 ''개인형 퇴직연금(IRP): 연금저축과 IRP를 합한 세액공제 대상 납입 한도 안내''를
    확인하십시오.'
