- id: 12580bb4-c531-5951-a065-7a2937c0c603
  title: '미국주식 거래: 진행 상황과 내역 확인'
  body: '미국주식 거래의 주문 진행 상황과 과거 거래 내역을 확인하는 절차는 다음과 같습니다.


    1. 상담원에게 성함과 생년월일을 말씀하시어 본인 인증을 완료하십시오.

    2. 확인하고자 하는 거래의 기간(예: 최근 1개월, 특정 연도 등)과 조회 대상(주문 내역 또는 체결 내역)을 말씀하십시오.

    3. 상담원이 현재 진행 중인 주문의 상태(미체결, 부분체결, 체결 완료)를 확인하여 안내해 드립니다.

    4. 과거 거래 내역의 경우, 매수/매도 단가와 적용된 미국주식 거래 수수료율 0.25%가 반영된 최종 결제 금액을 상세히 안내받으실 수 있습니다.

    5. 양도소득세 계산을 위한 실현 손익 내역이 필요하신 경우, 해당 기간의 총 수익과 해외주식 양도소득 기본공제(연) 2,500,000원이
    적용되기 전의 과세 대상 금액을 확인해 달라고 요청하십시오.


    위 절차를 통해 현재 투자 현황과 비용 발생 내역을 정확히 파악하실 수 있습니다.'
