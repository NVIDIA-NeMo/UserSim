- id: ba54708b-e563-599b-b082-3c63d5747d41
  title: '중개형 ISA: 거래가 거절되거나 제한되었을 때'
  body: '중개형 ISA 계좌에서 주식이나 ETF 거래 시 주문이 거절되거나 제한되는 현상이 발생할 수 있습니다.


    주요 원인 및 확인 순서:

    1. 납입 한도 초과: 당해 연도 납입액이 연간 납입 한도인 20,000,000원을 초과했거나, 누적 납입액이 총 납입 한도인 100,000,000원을
    초과했는지 확인하십시오.

    2. 투자 적합성 미충족: 투자하시려는 상품의 위험 등급이 고객님의 투자 성향보다 높을 경우 거래가 제한될 수 있습니다. 적합성 원칙에 따른
    성향 분석 업데이트가 필요합니다.

    3. 계좌 상태 확인: 의무가입기간(3년) 준수 여부와 상관없이, 계좌가 보호 조치 중이거나 정지 상태인지 확인하십시오.


    해결 방법:

    - 한도 초과 시: 납입 금액을 조정하시거나 다음 연도 한도 발생을 기다리셔야 합니다.

    - 적합성 문제 시: 투자 성향 분석을 다시 수행하여 본인의 재산 상황과 목적에 맞는 상품인지 재확인하십시오.


    위 조치 후에도 문제가 지속되면 상담원에게 요청하십시오. 당사는 내부 절차에 따라 해당 건을 전문 처리 팀으로 에스컬레이션하여 정확한 원인을
    파악하고 해결 결과를 안내해 드리겠습니다.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: troubleshooting
