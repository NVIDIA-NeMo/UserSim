- id: 5fc296c7-c56c-57ab-86c0-ff1f89eb6de3
  title: '연금저축계좌: 처리가 끝나지 않거나 보류 중일 때'
  body: '계좌 개설 신청이나 자금 납입 처리가 ''보류 중''으로 표시되는 경우, 다음 사항을 확인해 주십시오.


    1. 본인 인증 정보 불일치: 입력하신 성함과 생년월일이 등록된 정보와 일치하는지 확인하십시오. 정보가 다를 경우 처리가 지연될 수 있습니다.

    2. 납입 한도 초과: 이번 납입 금액을 포함하여 올해 총 납입액이 연금계좌 연간 납입 한도인 18,000,000원을 초과했는지 확인하십시오.
    한도를 초과한 금액은 납입이 거절됩니다.

    3. 투자 적합성 평가 미완료: 가입 단계에서 투자 성향 분석이 완료되지 않은 경우 계좌 활성화가 보류될 수 있습니다.


    위 사항을 확인했음에도 문제가 지속된다면, 상담원에게 요청하여 내부 절차에 따라 단계적으로 에스컬레이션하여 해결하시기 바랍니다. 처리 상황은
    ''연금저축계좌: 가입과 이용 시작'' 절차를 통해 다시 확인하실 수 있습니다.'
