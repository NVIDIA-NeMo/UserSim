- id: 0b471fe8-a8f3-54a5-ae49-1d9b1da4b3cd
  title: '개인형 퇴직연금(IRP): 상품설명서 주요 내용'
  body: '본 상품은 자본시장과 금융투자업에 관한 법률에 따라 금융위원회의 인가를 받고 금융감독원의 감독을 받는 가람증권에서 제공합니다.


    [투자자 보호 및 위험 고지]

    - 예금자 보호: IRP 계좌 내 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 다만, 펀드 및 ETF 등 투자 상품은 예금자보호
    대상이 아니며, 투자 결과에 따라 원금 손실이 발생할 수 있고 원금이 보장되지 않습니다.

    - 적합성 원칙: 가람증권은 고객님의 재산 상황, 투자 경험, 목적에 적합한 상품을 권유하는 적합성 원칙을 엄격히 준수합니다.

    - 운용 제한: IRP 계좌에서는 국내외 개별 주식의 직접 매수가 불가능하며, 레버리지 및 인버스 ETF 투자 또한 제한됩니다.

    - 세제 혜택: 본 상품은 조세특례제한법 및 소득세법에 따라 세액공제 혜택을 제공하며, 연금저축과 IRP를 합한 세액공제 대상 납입 한도는
    9,000,000원입니다.


    투자 판단의 최종 책임은 고객님께 있으며, 가람증권은 특정 상품의 수익을 보장하거나 개별적인 세무 및 법률 자문을 제공하지 않습니다.'
