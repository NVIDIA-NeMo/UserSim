    안내해 드립니다.

    4. 특정 기간의 상세 거래 내역이 필요하신 경우, 해당 기간을 지정하여 요청하십시오.

    5. 상담원이 안내한 내역이 고객님의 기록과 일치하는지 확인하시면 절차가 완료됩니다.


