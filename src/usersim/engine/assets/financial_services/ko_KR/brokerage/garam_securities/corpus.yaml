- id: 84136c2d-454c-5e69-9f84-a30019eb5025
  title: get_statements 사용 기준
  body: '고객의 거래 내역서 및 명세서 조회 요청을 처리하기 위한 절차는 다음과 같습니다.


    1. 먼저 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출함으로써 본인 인증을 완료하십시오.

    2. 명세서 조회가 필요한 계좌의 마지막 4자리 숫자를 확인한 후, `get_accounts` 도구를 호출하여 해당 계좌의 고유 account_id를
    조회하십시오.

    3. 고객이 요청한 조회 기간(예: 최근 3개월, 특정 연도 등)을 확인하십시오.

    4. 확인된 account_id와 조회 기간을 인자로 하여 `get_statements` 도구를 호출하여 명세서 데이터를 가져오십시오.


    조회된 명세서 내용은 고객의 자산 상황과 직결되므로 보안에 유의하여 안내하십시오. 만약 명세서 내용에 대해 고객이 의문을 제기하는 경우, 내부
    절차에 따라 단계적으로 에스컬레이션하여 전문적인 처리가 이루어질 수 있도록 안내하시기 바랍니다.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: garam_securities
- id: 0497b687-97d0-52f5-8b29-32d43b1b051a
  title: get_statements 도구 설명서
  body: "상담원은 이 도구를 호출하여 특정 계좌의 거래 명세서 및 내역을 조회할 수 있습니다. 본인 인증(`verify_identity`)이\
    \ 선행되어야 하며 상담원이 직접 처리합니다.\n\n- 호출 시그니처: `get_statements(account_id, period)`\n\
    - 입력 인자:\n    - `account_id`: 명세서를 조회할 계좌의 고유 식별자 (`get_accounts`를 통해 확인 가능)\n\
    \    - `period`: 명세서를 조회하고자 하는 기간\n- 처리 결과: 해당 기간 동안의 거래 내역 및 잔액 정보가 포함된 명세서 데이터를\
    \ 반환합니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: garam_securities
- id: 5fef3970-68a0-5105-8c16-625e359c0df0
  title: set_alerts 사용 기준
  body: '고객의 알림 설정(시세 알림, 계좌 활동 알림 등) 요청을 처리하기 위한 절차는 다음과 같습니다.


    1. 고객의 성함과 생년월일을 통해 `verify_identity` 도구를 호출하여 본인 인증을 완료하십시오.

    2. 알림을 설정하고자 하는 계좌의 마지막 4자리 숫자를 확인하고, `get_accounts` 도구를 호출하여 정확한 account_id를
    확보하십시오.

    3. 고객이 원하는 알림의 유형(예: 특정 종목의 가격 도달, 입출금 발생 등)과 알림이 발생할 조건 값(trigger_value)을 구체적으로
    확인하십시오.

    4. 확인된 account_id, 알림 유형, 조건 값을 사용하여 `set_alerts` 도구를 호출하여 설정을 완료하십시오.


    알림 설정은 고객이 시장 상황에 신속하게 대응할 수 있도록 돕는 서비스입니다. 설정 완료 후 고객에게 어떤 조건에서 알림이 발송되는지 다시
    한번 명확하게 안내하여 혼선이 없도록 하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: garam_securities
- id: 0459420d-5bf4-535c-8d9d-dbee2265d072
  title: set_alerts 도구 설명서
  body: "상담원은 이 도구를 호출하여 고객의 계좌에 대한 맞춤형 알림을 설정할 수 있습니다. 본인 인증(`verify_identity`) 완료\
    \ 후 상담원이 직접 수행합니다.\n\n- 호출 시그니처: `set_alerts(account_id, alert_type, trigger_value)`\n\
    - 입력 인자:\n    - `account_id`: 알림을 설정할 계좌의 고유 식별자\n    - `alert_type`: 알림의 종류 (예:\
    \ 가격 알림, 잔액 알림 등)\n    - `trigger_value`: 알림이 실행될 구체적인 조건 값 (예: 주가 50,000원 도달\
    \ 시)\n- 처리 결과: 지정된 조건에 따라 알림이 발송되도록 시스템에 설정됩니다."
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: garam_securities
- id: 977a83c9-8d9d-566f-bc93-d53972ec498a
  title: transfer_funds 사용 기준
  body: '계좌 간 자금 이체 요청을 처리하기 위한 절차는 다음과 같습니다. 자금 이동은 매우 민감한 작업이므로 모든 단계를 정확히 수행하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구를 호출하고 본인 인증을 수행하십시오.

    2. 자금이 나갈 계좌(출금 계좌)와 자금이 들어갈 계좌(입금 계좌)의 마지막 4자리 숫자를 각각 확인하십시오.

    3. `get_accounts` 도구를 호출하여 두 계좌의 정확한 account_id를 모두 확인하고, 출금 계좌에 이체하려는 금액 이상의
    잔액이 있는지 확인하십시오.

    4. 이체할 금액과 확인된 두 계좌의 ID를 사용하여 `transfer_funds` 도구를 호출하여 이체를 실행하십시오.


    이체 처리 후에는 성공 여부를 즉시 고객에게 안내하고, 이체 후의 예상 잔액을 알려드려 고객이 안심할 수 있도록 조치하십시오. 부정 거래가
    의심되는 경우 즉각적으로 계좌 보호 조치를 취하고 내부 규정에 따라 보고하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: garam_securities
- id: fdcd6594-730c-504a-aaae-d2806543e289
  title: transfer_funds 도구 설명서
  body: 'transfer_funds 도구는 고객의 계좌 간 자금을 이체하는 기능을 수행합니다. 상담원은 고객의 요청에 따라 이 도구를 직접
    호출하여 이체 작업을 처리합니다.


    - 호출 시점: 고객의 본인 인증이 verify_identity 도구를 통해 완료된 후, 계좌 간 자금 이동이 필요할 때 호출합니다.

    - 주요 기능: 지정된 출금 계좌에서 입금 계좌로 원하는 금액을 이체합니다.

    - 처리 방식: 상담원이 고객으로부터 확인한 이체 금액과 대상 계좌 정보를 바탕으로 즉시 실행됩니다.'
