- id: f736f116-96fc-576b-a4bd-83a995045f79
  title: '중개형 ISA: 이런 분께 알맞습니다'
  body: '중개형 ISA는 절세 혜택을 극대화하면서 국내 주식과 ETF 등에 효율적으로 투자하고자 하는 분들께 최적의 선택입니다.


    특히 다음과 같은 투자자분들께 추천드립니다:

    - 투자 수익에 대한 세금을 줄이고 싶은 분: 순이익 중 일반형은 2,000,000원, 서민형은 4,000,000원까지 비과세 혜택을 누리실
    수 있습니다.

    - 종합소득과세 부담을 낮추고 싶은 분: 비과세 한도를 초과하는 수익에 대해 9.9%의 낮은 분리과세율이 적용되어 세금 부담이 경감됩니다.

    - 장기적으로 자산을 형성하고자 하는 분: 의무가입기간 3년을 유지하며 체계적으로 자산을 성장시키기에 적합합니다.

    - 효율적인 한도 관리를 원하는 분: 연간 20,000,000원씩, 최대 100,000,000원까지 납입 가능하며, 미사용 한도는 이월되어
    유연한 운용이 가능합니다.


    절세 혜택을 통해 실질 수익률을 높이고 싶은 투자자라면 중개형 ISA를 통해 스마트한 자산 관리를 시작하십시오.'
  domain: brokerage_investing
  product_category: garam_isa
  document_type: product_sheet
