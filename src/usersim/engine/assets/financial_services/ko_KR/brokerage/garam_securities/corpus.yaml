- id: 07c3565e-0ca8-5747-bfcf-19edab7b1312
  title: '적립식 투자: 진행 중인 이벤트'
  body: '가람증권에서 소액 투자의 즐거움을 경험하실 수 있도록 ''1,000원의 기적'' 이벤트를 진행합니다.


    - 이벤트 기간: 2025년 1월 1일부터 2025년 3월 31일까지

    - 참여 방법: 적립식 투자 서비스를 처음으로 설정하고, 적립 최소 금액 1,000원 이상의 설정을 유지하십시오.

    - 혜택 내용: 이벤트 기간 내 첫 적립식 투자 설정을 완료하신 고객님께 투자 지원금 5,000원을 예탁금 계좌로 지급해 드립니다.

    - 유의사항: 본 혜택은 계좌당 1회에 한하며, 이벤트 종료 후 7영업일 이내에 지급됩니다.'
