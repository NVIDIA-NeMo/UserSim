- id: f7e24120-918d-54c9-a95c-400eebe3e683
  title: '국내주식 거래: 위험 안내'
  body: '본 서비스 이용 전 다음의 위험 고지 사항을 반드시 확인하시기 바랍니다.


    1. 원금 비보장: 주식 투자는 가격 변동에 따라 원금 손실이 발생할 수 있으며, 투자 원금이 보장되지 않습니다. 모든 투자 판단의 책임은
    고객 본인에게 있습니다.


    2. 예금자 보호 제한: 고객님이 입금하신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 하지만 매수하신 주식, 펀드 등 투자
    상품은 예금자보호법에 따른 보호 대상이 아니며, 증권은 한국예탁결제원에 별도로 보관됩니다.


    3. 시장 위험: 국내 주식 시장은 경제 상황, 기업의 실적, 정치적 요인 등에 따라 급격한 가격 변동이 발생할 수 있습니다.


    4. 적합성 원칙: 가람증권은 고객님의 투자 성향과 재산 상황에 적합한 상품을 권유하며, 무리한 투자는 큰 손실로 이어질 수 있음을 안내드립니다.


    위 내용은 금융위원회와 금융감독원의 감독 하에 작성되었으며, 투자자 보호를 최우선으로 합니다.'
