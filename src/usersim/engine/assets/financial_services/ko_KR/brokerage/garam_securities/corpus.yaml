- id: 391896df-fa5a-559b-a8f4-2835744b5708
  title: '적립식 투자: 이용 방법과 절차'
  body: 'Q: 적립식 투자를 시작하려면 어떻게 해야 합니까?

    A: 가람증권 모바일 앱 또는 온라인 고객센터를 통해 신청하실 수 있습니다. 투자하시려는 종목과 적립 주기, 금액을 설정하시면 정해진 일정에
    따라 자동으로 매수가 진행됩니다.


    Q: 최소 얼마부터 적립이 가능합니까?

    A: 가람증권 적립식 투자의 적립 최소 금액은 1,000원입니다. 1,000원 이상의 금액으로 자유롭게 설정하여 소액 투자를 시작하실 수 있습니다.


    Q: 적립식 투자를 통해 수익이 보장되나요?

    A: 아니요, 적립식 투자는 매입 단가를 낮추는 효과가 있지만, 투자 상품의 특성상 원금이 보장되지 않으며 수익을 보장하지 않습니다.'
