  institution_id: garam_securities
- id: 5402973e-ece5-5395-b0a8-c781748ae116
  title: '미국주식 거래: 자주 하는 업무의 처리 절차'
  body: '환전부터 주식 매수까지의 일반적인 처리 절차를 안내해 드립니다.


    1. 본인 확인: 상담원에게 성함과 생년월일을 제공하여 본인 인증을 완료하십시오.

    2. 환전 요청: 미국주식 투자를 위해 필요한 달러 금액을 말씀하십시오. 이때 가람증권의 환전 수수료 우대율 95%가 적용되어 환전이 진행됩니다.

    3. 종목 및 수량 선택: 매수하고자 하는 미국 주식의 티커(Ticker) 또는 종목명과 수량을 말씀하십시오.

    4. 주문 확인: 적용될 미국주식 거래 수수료율 0.25%와 예상 체결 금액을 상담원을 통해 확인하십시오.

    5. 주문 실행 및 완료: 최종 확인 후 주문을 요청하시면 거래가 접수됩니다. 체결 결과는 실시간 상담 또는 내역 조회를 통해 확인하실 수
    있습니다.


    이 절차를 통해 복잡한 과정 없이 신속하게 글로벌 투자에 참여하실 수 있습니다.'
  domain: brokerage_investing
  product_category: garam_us_stock
  document_type: how_to_guide
  source_authority: official
