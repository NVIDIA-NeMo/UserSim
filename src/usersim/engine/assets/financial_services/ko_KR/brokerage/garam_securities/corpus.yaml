- id: aab5a7dc-17d1-5961-8532-991ac85e9b90
  title: '국내주식 거래: 개인정보 처리 안내'
  body: '가람증권은 고객님의 개인정보를 소중히 관리하며, 관련 법령 및 내부 규정에 따라 엄격히 처리합니다.


    1. 개인정보 수집 및 이용 목적

    고객님의 성함, 생년월일, 연락처 등은 계좌 개설, 본인 확인, 거래 내역 안내 및 금융사고 예방을 위한 본인 인증 목적으로 수집 및 이용됩니다.


    2. 감독 및 준거 법령

    가람증권은 금융위원회와 금융감독원의 감독 하에 자본시장과 금융투자업에 관한 법률을 준수하며, 개인정보 보호법에 의거하여 고객님의 데이터를 안전하게
    보관합니다.


    3. 예금자 보호 제도 안내

    고객님이 맡기신 예탁금은 예금보험공사를 통해 1인당 1억원까지 보호됩니다. 다만, 국내주식 거래를 통해 매수하신 주식, 펀드 등 투자상품은
    예금자보호 대상이 아니며, 시장 상황에 따라 원금 손실이 발생할 수 있음을 알려드립니다.


    4. 정보 제공 및 파기

    법령에 명시된 경우를 제외하고 고객님의 동의 없이 개인정보를 제3자에게 제공하지 않으며, 서비스 해지 후 관련 법령이 정한 기간이 지나면 안전한
    방법으로 파기합니다.'
