- id: 46969e3a-83c8-5b19-b1ce-48ad7a9af808
  title: '국내주식 거래: 상품 고르는 방법'
  body: '국내 시장에 투자하시려는 고객님께서는 ''국내주식 거래'' 서비스와 ''중개형 ISA'' 계좌 중 본인의 목적에 맞는 상품을 선택하실
    수 있습니다.


    1. 국내주식 거래 (일반 계좌)

    - 특징: 가장 기본적인 주식 거래 서비스로, 자유로운 입출금이 가능합니다.

    - 비용: 국내주식 거래 수수료율(모바일) 0.015%가 적용됩니다.

    - 세금: 매도 시 증권거래세(0.2%)가 발생하며, 배당소득에 대해 15.4%가 원천징수됩니다.

    - 추천: 단기 매매를 선호하시거나 자금의 유동성이 최우선인 투자자께 적합합니다.


    2. 중개형 ISA (절세 계좌)

    - 특징: 비과세 및 분리과세 혜택이 있는 만능 절세 계좌입니다.

    - 혜택: 순이익 200만원(서민형 400만원)까지 비과세 혜택을 누릴 수 있습니다.

    - 추천: 중장기적으로 자산을 증식하며 세금을 효율적으로 줄이고자 하는 투자자께 적합합니다.


    더욱 상세한 비교는 ''중개형 ISA: 당사의 비슷한 상품과의 비교''를 참고하시어 결정하십시오.'
