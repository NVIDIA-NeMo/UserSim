- id: 741788a7-4287-52a7-9a7f-c50a66d285e4
  title: '연금저축계좌: 거래가 거절되거나 제한되었을 때'
  body: "연금저축계좌에서 입금이나 상품 매수가 거절되는 경우, 다음의 원인을 확인해 보십시오.\n\n- 증상: '한도 초과' 또는 '거래 제한'\
    \ 메시지와 함께 요청이 처리되지 않음\n- 주요 원인 및 해결 방법:\n  1. 납입 한도 초과: 연금계좌 연간 납입 한도인 18,000,000원을\
    \ 모두 소진하셨는지 확인하십시오. 한도를 초과한 금액은 입금이 제한됩니다.\n  2. 투자 제한 상품 선택: 개별 주식이나 레버리지/인버스\
    \ ETF를 매수하려 하셨는지 확인하십시오. 해당 상품은 연금저축계좌에서 매수가 불가능합니다.\n  3. 적합성 원칙 미준수: 고객님의 투자\
    \ 성향보다 위험도가 높은 상품을 선택하신 경우 거래가 제한될 수 있습니다. 이 경우 투자 성향 분석을 최신화하십시오.\n\n위 사항을 확인하신\
    \ 후에도 문제가 해결되지 않는다면, 상담원에게 계좌 상태 조회를 요청하십시오. 당사에서는 내부 절차에 따라 계좌의 제한 사유를 분석하고,\
    \ 필요한 경우 전문 처리 팀으로 에스컬레이션하여 해결해 드리겠습니다."
