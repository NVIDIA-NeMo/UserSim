- id: f95e677d-e2bb-5fe8-b737-47fb52a849be
  title: '개인형 퇴직연금(IRP): 수수료와 비용'
  body: 'Q: 개인형 퇴직연금(IRP) 계좌를 개설할 때 수수료가 발생하나요?

    A: 가람증권에서 비대면으로 계좌를 개설하시는 고객님께는 계좌 수수료(비대면 개설) 0원을 적용하여 투자 진입 장벽을 낮춰드리고 있습니다.


    Q: IRP 계좌 운용 중에 발생하는 다른 비용이 있나요?

    A: 계좌 개설 수수료 외에 투자하시는 개별 상품(펀드, ETF 등)에 따라 운용 보수나 거래 수수료가 발생할 수 있습니다. 상세 내용은 상품별
    설명서를 확인하시거나 상담원에게 문의하시기 바랍니다.


    더 자세한 비용 체계는 ''개인형 퇴직연금(IRP): 수수료 안내''에서 확인하실 수 있습니다.'
