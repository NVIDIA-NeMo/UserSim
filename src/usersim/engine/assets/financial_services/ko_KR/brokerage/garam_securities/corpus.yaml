- id: 01f7ea44-f79e-5e7a-9702-ed99170f128f
  title: '적립식 투자: 진행 상황과 내역 확인'
  body: "현재 이용 중인 적립식 투자의 누적 금액과 매수 내역을 확인하는 방법은 다음과 같습니다.\n\n1. 본인 확인 단계\n- 상담원에게\
    \ 성함과 생년월일을 말씀해 주시면 본인 인증을 수행합니다.\n\n2. 내역 조회 요청\n- 확인하고자 하는 적립식 투자 상품의 명칭과 함께\
    \ '현재까지의 적립 내역 및 진행 상황 조회'를 요청하십시오.\n\n3. 상세 정보 확인\n- 당사는 고객님께 다음의 정보를 확인해 드립니다.\n\
    \  - 총 적립 횟수 및 누적 투자 금액\n  - 최근 매수된 주식/펀드의 수량과 체결 단가\n  - 다음 적립 예정일과 설정된 적립 금액\n\
    \n4. 결과 확인\n- 안내받으신 내역이 실제 투자하신 금액과 일치하는지 확인하십시오. 만약 내역에 의문이 있으신 경우 '적립식 투자: 명세서나\
    \ 내역과 맞지 않을 때'를 참고하여 조치를 요청하시기 바랍니다."
