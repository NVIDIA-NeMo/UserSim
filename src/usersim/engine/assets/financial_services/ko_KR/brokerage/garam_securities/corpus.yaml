- id: 243c8f78-b927-51b1-bed6-139500137e14
  title: '연금저축계좌: 이용 조건별 차이'
  body: '연금저축계좌의 주요 이용 조건 및 한도 기준입니다.


    - 연간 납입 한도: 최대 18,000,000원 (전체 연금계좌 합산)

    - 세액공제 대상 납입 한도(단독): 최대 6,000,000원

    - 세액공제 대상 납입 한도(IRP 합산): 최대 9,000,000원

    - 세액공제율(총급여 5,500만원 이하): 16.5%

    - 세액공제율(총급여 5,500만원 초과): 13.2%

    - 사적연금 분리과세 기준: 연 소득 15,000,000원 초과 시'
