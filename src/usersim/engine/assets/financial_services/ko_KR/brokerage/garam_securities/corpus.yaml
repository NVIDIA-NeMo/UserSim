- id: c531e022-ad3b-5c5a-bd03-bfa2ffff7e1a
  title: cancel_order 사용 기준
  body: '고객이 접수된 주식 또는 펀드 주문의 취소를 요청할 경우, 상담원은 다음 절차에 따라 처리하십시오.


    1. 본인 인증 수행: verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하여 본인 인증을 완료하십시오.

    2. 취소 대상 주문 확인: get_order_status 도구를 호출하여 현재 고객 계좌에 접수된 미체결 주문 목록을 확인합니다. 고객이
    취소하고자 하는 종목과 수량을 확인하여 해당 주문의 order_id를 확보하십시오.

    3. 취소 의사 재확인: 확보한 order_id에 해당하는 주문 내용을 고객에게 다시 안내하고, 해당 주문을 취소할 것인지 최종 확인하십시오.

    4. 주문 취소 실행: 고객의 확답을 받은 후, cancel_order 도구에 해당 order_id를 입력하여 주문 취소를 처리하십시오.

    5. 처리 결과 안내: 주문이 정상적으로 취소되었음을 고객에게 정중히 안내하며 상담을 종료하십시오.


    주문 취소 가능 여부 및 상세 내용은 ''cancel_order 도구 설명서''를 참고하시기 바랍니다.'
