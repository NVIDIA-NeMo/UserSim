- id: 875e2e79-e46e-51ea-9da3-08641ec44398
  title: initiate_securities_transfer 사용 기준
  body: '고객이 다른 증권회사에 보유 중인 주식이나 펀드를 가람증권으로 옮기는 대체입고를 요청하는 경우, 다음 절차를 따르십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity`로 본인 인증을 완료합니다.

    2. `get_accounts` 도구를 사용하여 주식을 입고받을 가람증권 계좌의 `account_id`를 확인합니다.

    3. 현재 자산이 보관된 타 증권회사의 명칭과 이전하고자 하는 구체적인 종목 및 수량을 확인합니다.

    4. 확인된 입고 계좌 ID와 타사 자산 정보를 바탕으로 `initiate_securities_transfer` 도구를 호출하여 신청을 완료합니다.


    대체입고 과정에서 발생할 수 있는 주의사항은 ''국내주식 거래: 가입과 이용 시작'' 등을 통해 안내하십시오.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
