- id: 00de2eb5-3d3c-56e7-abfa-70d014ac16d1
  title: '연금저축계좌: 약관 변경 안내'
  body: '본 안내는 연금저축계좌 이용 약관의 주요 변경 사항을 전달하기 위한 것입니다. 고객님께서는 변경된 내용을 확인하시어 서비스 이용에
    참고하시기 바랍니다.


    1. 납입 및 한도 규정: 연금계좌 연간 납입 한도는 18,000,000원으로 제한됩니다. 이를 초과하여 납입하려 할 경우 입금이 제한될 수
    있습니다.


    2. 세제 혜택 및 과세: 연금저축계좌의 세액공제 대상 납입 한도는 6,000,000원이며, IRP를 포함할 경우 합산하여 연 9,000,000원까지
    공제 대상이 됩니다. 단, 연금 외 형태로 중도 인출하실 경우 16.5%의 기타소득세가 부과되므로 유의하십시오.


    3. 연금 수령 시 과세: 55세 이후 연금으로 수령하실 경우, 수령 시점의 연령에 따라 5.5%, 4.4%, 3.3%의 연금소득세가 차등
    적용됩니다. 사적연금 소득이 연 15,000,000원을 초과할 경우 종합과세 또는 16.5% 분리과세 중 선택하여 신고하셔야 합니다.


    4. 준거법 및 감독: 본 계좌는 금융위원회와 금융감독원의 감독 하에 운영되며, 자본시장과 금융투자업에 관한 법률을 준수합니다. 약관 변경에
    동의하지 않으시는 경우 계좌 해지를 요청하실 수 있습니다.'
