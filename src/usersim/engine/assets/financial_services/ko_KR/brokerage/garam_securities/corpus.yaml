- id: cdc55a09-e6cc-5412-9163-afa479c1bb38
  title: '연금저축계좌: 등록 정보 변경'
  body: '연금저축계좌의 연락처, 주소 등 등록된 정보를 변경하는 방법입니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 정보 변경 요청: 상담원에게 변경하고자 하는 정보(예: 전화번호, 이메일 주소)를 말씀해 주십시오.

    2. 본인 인증 수행: 상담원이 요청하는 성함과 생년월일을 제공하여 본인 인증을 완료하십시오. 비밀번호나 주민등록번호 전체는 요구하지 않습니다.

    3. 변경 정보 제공: 새롭게 등록할 정확한 정보를 제공하십시오.

    4. 변경 내용 확인: 상담원이 변경된 내용을 다시 한번 읽어드리면, 정보가 정확한지 확인하십시오.

    5. 처리 완료 통보: 정보 변경이 정상적으로 반영되었다는 안내를 받으시면 모든 절차가 완료됩니다.


    변경 사항은 즉시 반영되며, 이후 모든 알림 서비스는 변경된 정보로 제공됩니다.'
