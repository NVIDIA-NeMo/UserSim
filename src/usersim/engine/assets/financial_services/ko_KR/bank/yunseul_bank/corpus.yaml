- id: 13a68a89-f02c-543a-b0ed-ed6f19a8f63a
  title: '윤슬 정기예금: 진행 상황과 내역 확인'
  body: '현재 보유하신 윤슬 정기예금의 잔액과 만기일 등 상세 내역을 확인하는 절차입니다.


    1. 본인 확인 단계: 고객님의 성함과 생년월일을 말씀해 주십시오. 저희가 신속하게 본인 확인 절차를 진행하겠습니다.

    2. 조회 요청: 확인을 원하시는 예금 계좌번호를 말씀하시거나, 전체 보유 계좌 중 정기예금 내역 조회를 요청하십시오.

    3. 내역 확인: 상담원이 현재의 예치 원금, 적용 금리(예: 3.4%, 3.3%, 3.25% 중 해당 금리), 그리고 현재까지 발생한 예상
    이자를 안내해 드립니다.

    4. 만기일 확인: 해당 상품의 정확한 만기 날짜와 만기 시 수령하시게 될 세후 예상 금액을 안내받으시면 확인 절차가 완료됩니다.'
  domain: retail_banking
