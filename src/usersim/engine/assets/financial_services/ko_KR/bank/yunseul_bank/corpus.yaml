  institution_id: yunseul_bank
- id: 0cfbaa33-54f5-5991-a8b9-ce8c0cdf7d72
  title: '윤슬 직장인 신용대출: 대출 금리(연, 상한) 안내'
  body: 'Q: 윤슬 직장인 신용대출의 최고 금리는 얼마인가요?

    A: 본 상품의 대출 금리(연, 상한)는 6.5%입니다. 고객님의 신용 등급, 연 소득, 부채 현황 등 심사 기준에 따라 최종 금리가 결정되며,
    가장 높은 경우 연 6.5%가 적용됩니다.


    Q: 현재 상한 금리인 6.5%를 적용받고 있는데, 금리를 낮출 방법이 있을까요?

    A: 네, 가능합니다. 대출 이용 중 취업, 승진, 소득 증가 또는 신용점수 상승 등 신용 상태가 개선되었다면 ''금리인하요구권''을 행사하여
    금리 인하를 요청하실 수 있습니다. 당사는 객관적인 기준에 따라 성실하게 심사하여 결과를 안내해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: acfcee9b-adb6-54e6-89ac-919cc69cf429
  title: '윤슬 직장인 신용대출: 해지·변경·상품 전환'
  body: '윤슬 직장인 신용대출의 해지(상환) 또는 변경 절차를 안내해 드립니다.


    [대출 해지 및 전액 상환 절차]

    1. 본인 확인: 성함과 생년월일을 말씀해 주십시오.

    2. 상환 요청: 대출금 전액 상환 및 계좌 해지를 요청하십시오.

    3. 금액 확인: 당사 상담원이 현재 시점의 대출 원금, 미납 이자, 그리고 0.1%의 중도상환수수료율이 적용된 수수료 금액을 합산하여 안내해
    드립니다.

    4. 자금 이체: 안내받은 총 상환 금액을 연결된 입출금 계좌에서 결제하거나 입금하십시오.

    5. 완료 확인: 대출금이 전액 상환되고 계약이 해지되었음을 확인하는 안내를 받으시면 완료됩니다.


    [상품 변경 및 전환]

    대출 조건 변경이나 타 상품으로의 전환을 원하실 경우, 현재의 신용 상태와 소득을 재심사해야 합니다. 성함과 생년월일 확인 후 현재 적용 금리와
    전환 대상 상품의 조건을 비교 안내받으시고, 심사 승인 후 전환 계약을 체결하십시오.


    상환 관련 비용에 대한 상세 내용은 ''윤슬 직장인 신yong_troubleshooting_2''를 참고하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 6ea7d76c-d8ff-5939-9782-c4b07ae6d482
  title: '윤슬 직장인 신용대출: 예상과 다른 수수료나 금액'
  body: '대출 상환 시 계산하신 금액과 실제 청구 금액이 다를 경우, 다음 사항을 확인하십시오.


    1. 중도상환수수료 확인: 대출 실행 후 3년이 지나지 않은 상태에서 원금을 상환하셨습니까? 이 경우 0.1%의 중도상환수수료율이 적용되어
    예상보다 금액이 높을 수 있습니다.

    2. 이자 계산 방식 확인: 대출 이자는 일할 계산됩니다. 상환일까지의 정확한 일수를 확인하십시오.

    3. 연체 이자 적용 여부: 약정일보다 상환이 늦어진 경우, 약정금리에 최대 3%p가 가산된 연체이자가 포함되었는지 확인하십시오.


    위 사항을 확인했음에도 금액이 맞지 않는다면, 상담원에게 상세 내역 조회를 요청하십시오. 상담원은 고객님의 상환 스케줄과 수수료 적용 시점을
    재검토하여 안내해 드립니다.


    만약 상담 단계에서 원인이 명확히 규명되지 않거나 해결이 어려운 복잡한 민원인 경우, 책임자에게 에스컬레이션하여 정밀 조사를 진행하고 그 결과를
    고객님께 다시 안내해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: eb08e352-0f8b-5661-9bd9-9dff8f879ce5
  title: '윤슬 직장인 신용대출: 필요 서류'
  body: '윤슬 직장인 신용대출 신청을 위해 다음 서류를 준비해 주십시오.


    - 본인 확인 서류: 주민등록증, 운전면허증 등 정부 발행 신분증 (실명 확인 필수)

    - 재직 증명 서류: 현 직장의 재직증명서 또는 건강보험 자격득실 확인서

    - 소득 증빙 서류: 근로소득 원천징수영수증 또는 최근 3개월분 급여명세서

    - 기타 서류: 사업자등록증(직장 확인용) 등 당사가 추가로 요청하는 증빙 자료


    모든 서류는 최근 3개월 이내 발급분이어야 하며, 서류 미비 시 대출 심사 및 이용한도 최고액 100,000,000원 산정에 제한이 있을 수
    있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: a86ef025-8620-5f07-a4f1-09766139cdbc
  title: '윤슬 직장인 신용대출: 다른 회사의 일반적인 상품과의 비교'
  body: '윤슬 직장인 신용대출과 시중의 일반적인 신용대출 상품을 비교해 드리겠습니다.


    - 금리 및 한도: 당사는 연 4.7%에서 연 6.5%의 안정적인 금리 범위를 제공하며, 이용한도 최고액은 100,000,000원으로 설정되어
    있습니다. 타사 상품의 경우 한도가 더 높거나 낮을 수 있으며, 금리 변동 폭이 더 클 수 있습니다.

    - 상환 비용: 당사는 0.1%라는 매우 합리적인 중도상환수수료율을 적용하고 있습니다. 이는 타 금융기관의 일반적인 수수료율보다 낮은 수준으로,
    고객님의 중도 상환 부담을 크게 낮췄습니다.

    - 신뢰성: 전국적인 네트워크를 보유한 시중은행으로서 안정적인 자산 관리와 신속한 대면/비대면 상담 서비스를 제공합니다.


    고액의 한도가 최우선인 고객님께는 타 상품이 유리할 수 있으나, 합리적인 금리와 낮은 중도상환 비용, 그리고 신뢰할 수 있는 은행의 사후 관리를
    원하시는 직장인 고객님께는 윤슬 직장인 신용대출이 최적의 선택입니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
