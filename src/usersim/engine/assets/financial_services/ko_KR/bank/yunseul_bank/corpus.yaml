- id: 8a7dd964-ac2f-51db-95b9-a36f31c3f9d7
  title: '윤슬 정기예금: 예상과 다른 수수료나 금액'
  body: '고객님께서 만기 또는 중도 해지 시 수령하신 금액이 예상과 달라 문의하시는 경우, 다음 사항을 순차적으로 확인하십시오.


    1. 원천징수 세액 확인: 이자 소득에 대해 소득세와 지방소득세를 합해 15.4%가 자동으로 징수되었습니다. 고객님이 계산하신 금액이 세전
    금액인지 확인하시기 바랍니다.

    2. 중도해지이율 적용 여부: 만기일 이전에 해지하신 경우, 약정 금리(예: 1년 3.4%)가 아닌 낮은 중도해지이율이 적용됩니다. 이는 약관에
    명시된 사항입니다.

    3. 금융소득 종합과세: 이자와 배당을 합한 금융소득이 연 2,000만원을 초과하여 종합과세 대상이 된 경우, 실제 수령액에 차이가 있을 수
    있습니다.


    위 사항으로도 해결되지 않는 경우, 상담원은 상세 거래 내역을 재검토하고 필요 시 책임자에게 에스컬레이션하여 정확한 산출 근거를 안내해 드리겠습니다.
    상세 내용은 ''윤슬 정기예금: 약관''을 참조하십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: troubleshooting
  source_authority: official
