- id: f353fdf3-dc13-5517-bf66-49c20a002406
  title: '윤슬 입출금통장: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 안내'
  body: 'Q: 윤슬 입출금통장을 사용하여 다른 은행 계좌로 송금할 때 수수료가 발생하나요?


    A: 아닙니다. 윤슬은행은 고객님의 디지털 금융 편의를 높이기 위해 모바일 앱과 인터넷 뱅킹을 이용한 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)를
    0원으로 운영하고 있습니다. 별도의 조건 없이 편리하게 이용하십시오.


    더 자세한 수수료 정보는 ''윤슬 입출금통장: 수수료 안내''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 09b10638-2188-5a7e-978e-3d610b34acea
  title: '윤슬 입출금통장: 해지·변경·상품 전환'
  body: '윤슬 입출금통장의 해지, 정보 변경 또는 타 상품으로의 전환을 원하시는 경우 다음 절차를 따라 주십시오.


    준비 사항: 본인 확인을 위한 성함과 생년월일 정보가 필요합니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 다음 단계 진행이 가능합니다.

    2. 요청 사항 전달: 계좌 해지, 등록 정보 변경, 또는 다른 상품으로의 전환 중 원하시는 업무를 요청하십시오.

    3. 잔액 정산 및 수수료 확인: 해지 또는 전환 시 계좌에 남아 있는 잔액과 미지급 이자를 확인하십시오. 이 과정에서 미납된 수수료나 정산
    금액이 있을 경우 함께 안내해 드립니다.

    4. 최종 처리 및 확인: 요청하신 업무가 완료되었음을 안내받으시면 처리 결과가 반영된 내역을 확인하십시오.


    만약 상품 전환 후 새로운 상품의 혜택을 확인하고 싶으시다면 ''윤슬 입출금통장: 상품 개요''를 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d919c78f-cca0-5c00-9487-599316c0d74f
  title: '윤슬 입출금통장: 예상과 다른 수수료나 금액'
  body: '고객님께서 생각하신 금액과 실제 출금액이 다르거나, 예상치 못한 수수료가 부과된 경우 다음과 같이 확인하십시오.


    [증상] 계좌 내역에 알지 못하는 수수료가 부과되었거나 출금 금액이 일치하지 않음


    [원인 및 확인 순서]

    1. ATM 이용 시간 확인: 은행 영업시간 외에 ATM에서 현금을 출금하셨는지 확인하십시오. 이 경우 영업시간 외 ATM 출금 수수료 500원이
    부과됩니다.

    2. 재발급 이력 확인: 최근에 통장이나 체크카드를 재발급 받으셨는지 확인하십시오. 이 경우 통장·카드 재발급 수수료 2,000원이 부과됩니다.

    3. 이체 경로 확인: 모바일·인터넷 뱅킹이 아닌 다른 경로로 이체하셨는지 확인하십시오. 당사는 모바일 및 인터넷 뱅킹 이체 수수료만 0원으로
    제공합니다.


    [해결 방법]

    상기 항목에 해당하지 않음에도 금액이 일치하지 않는다면, 상담원에게 거래 일시와 금액을 말씀해 주십시오. 상세 거래 내역을 조회하여 오부과
    여부를 확인해 드리겠습니다.


    [에스컬레이션]

    조회 결과 수수료 부과가 정당함에도 고객님께서 동의하시지 않거나 해결이 어려운 경우, 책임자에게 사건을 이관하여 추가 검토를 진행하고 결과를
    안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d88cc0ee-e08d-572e-b143-832fb7f17ca4
  title: '윤슬 입출금통장: 필요 서류'
  body: '윤슬 입출금통장 개설을 위해 방문 시 다음의 서류를 준비해 주십시오.


    - 개인 고객 (성인): 본인 확인이 가능한 유효한 신분증 (주민등록증, 운전면허증, 여권 중 택 1)

    - 개인 고객 (미성년자): 법정대리인 신분증, 가족관계증명서(상세), 기본증명서(상세), 도장

    - 외국인 고객: 외국인등록증 또는 거소신고증, 여권


    모든 계좌 개설 시에는 금융실명법에 따른 실명확인 절차가 반드시 필요합니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: eligibility_matrix
  source_authority: official
