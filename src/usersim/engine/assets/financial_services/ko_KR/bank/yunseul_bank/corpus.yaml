- id: b3d072d0-9869-5e71-83c1-e8079084a409
  title: '윤슬 체크카드: 금리·요율이 정해지는 방식과 적용'
  body: "윤슬 체크카드에 적용되는 주요 요율과 결정 방식은 다음과 같습니다.\n\n1. 캐시백 비율: 본 상품은 모든 가맹점 결제 시 0.3%의\
    \ 캐시백 요율을 일괄 적용합니다. 별도의 구간이나 조건 없이 결제 금액에 대해 고정 비율로 산정됩니다.\n2. 해외 이용 수수료율:\n \
    \  - 국제브랜드 수수료율: 1% (해외 브랜드사에서 부과하는 요율)\n   - 해외서비스 수수료율: 0.2% (윤슬은행에서 부과하는 서비스\
    \ 요율)\n   위 두 요율은 해외 결제 시 각각 독립적으로 적용되어 합산 청구됩니다.\n3. 연회비: 본 상품은 디지털 금융 활성화 정책에\
    \ 따라 연회비 0원을 적용하여 고객 부담을 없앴습니다.\n\n상기 요율은 은행의 내부 정책 및 관련 법령의 변경에 따라 조정될 수 있으며,\
    \ 변경 시 사전 고지 절차를 거칩니다."
