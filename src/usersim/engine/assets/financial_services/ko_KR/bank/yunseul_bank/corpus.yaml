- id: a67c0f87-25b4-5a23-bc7e-45e92db5a214
  title: '윤슬 주택담보대출: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 금융소비자 보호에 관한 법률을 엄격히 준수하여 고객님의 소중한 정보를 처리합니다.


    [개인정보 수집 및 이용 목적]

    윤슬 주택담보대출의 신청, 심사, 실행 및 사후 관리를 위해 고객님의 성함, 연락처, 주소, 소득 정보, 신용 정보 등을 수집합니다. 수집된
    정보는 대출 한도 산정 및 DSR 계산, 본인 확인, 상환 관리 목적으로만 사용됩니다.


    [주민등록번호 처리]

    주민등록번호는 금융실명법 및 관련 법령이 허용하는 경우에 한하여 수집하며, 암호화하여 안전하게 보관합니다.


    [정보의 보유 및 파기]

    대출 계약 기간 동안 정보를 보유하며, 계약 종료 및 법정 보유 기간이 경과한 후에는 복구 불가능한 방법으로 안전하게 파기합니다.


    고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다. 자세한 사항은 당행의 개인정보 처리방침을 참조하시기 바랍니다.'
