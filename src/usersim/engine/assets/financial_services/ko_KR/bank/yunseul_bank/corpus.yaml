- id: 00e71110-9f8c-5435-ae52-0c892b72582c
  title: '윤슬 입출금통장: 자주 하는 업무의 처리 절차'
  body: '윤슬 입출금통장에서 가장 많이 요청하시는 ''자동이체 설정'' 및 ''이체 한도 변경'' 처리 절차입니다.


    [자동이체 설정 절차]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀하여 본인 인증을 완료하십시오.

    2. 정보 제공: 이체할 금액, 이체 주기(매월 등), 이체일, 그리고 입금될 상대 계좌번호를 알려주십시오.

    3. 내용 확인: 상담원이 설정 내용을 다시 한번 낭독하면 정확한지 확인하십시오.

    4. 완료: 설정이 완료되었다는 안내를 받으시면 매달 지정된 날짜에 자동이체가 실행됩니다.


    [이체 한도 변경 절차]

    1. 본인 확인: 성함과 생년월일을 통해 본인 인증을 진행하십시오.

    2. 한도 요청: 변경하고자 하는 1일 및 1회 이체 한도 금액을 말씀해 주십시오.

    3. 증빙 확인: 한도 증액의 경우, 직장인 증빙 서류 등 추가 서류 제출이 필요할 수 있으며 이는 영업점 방문을 통해 처리됩니다.

    4. 적용 확인: 변경된 한도가 즉시 적용되었음을 상담원을 통해 확인하십시오.


    업무 처리 중 궁금하신 점은 ''윤슬 입출금통장: 상품 개요''를 통해 상품의 기본 특성을 다시 확인해 보시기 바랍니다.'
