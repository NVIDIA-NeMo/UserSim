- id: 8aaefe84-c8b4-5522-a0f6-e8d45e16f50f
  title: '윤슬 정기예금: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 최근 정기예금의 고금리 혜택을 미끼로 개인정보를 요구하는
    금융사기 사례가 증가하고 있으니 각별히 주의하시기 바랍니다.


    윤슬은행은 어떠한 경우에도 고객님께 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다. 만약 정기예금
    금리 상향이나 특별 혜택 제공을 조건으로 위와 같은 정보를 요구하는 연락을 받으셨다면, 이는 보이스피싱일 가능성이 매우 높습니다.


    금융사기가 의심되거나 이미 피해가 발생한 경우에는 즉시 당사 고객센터나 영업점으로 연락하여 해당 계좌의 지급정지를 요청하고 피해구제 신청을
    진행하십시오. 신속한 대응만이 피해를 최소화할 수 있는 유일한 방법입니다.


    보다 자세한 위험 관리 내용은 ''윤슬 정기예금: 위험 안내''를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: security_advisory
