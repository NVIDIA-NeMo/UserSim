- id: 3d9cdadc-34cd-5d6b-96bc-57a9d040c7b9
  title: '윤슬 입출금통장: 거래가 거절되거나 제한되었을 때'
  body: '거래 중 ''잔액 부족'' 외에 거래가 거절되거나 계좌 이용이 제한되는 경우의 해결 방법입니다.


    증상: ATM 출금 불가, 이체 실행 시 오류 메시지 발생, 카드 결제 거절


    원인 및 확인 순서:

    1. 계좌 상태 확인: 보이스피싱 예방 등을 위해 지급정지 상태인지, 혹은 장기 미사용으로 인한 휴면 계좌인지 확인하십시오.

    2. 이체 한도 초과 여부: 설정된 1일 또는 1회 이체 한도를 초과했는지 확인하십시오.

    3. 본인 인증 오류: 비밀번호 입력 횟수 초과 등으로 인해 인증이 제한되었는지 확인하십시오.


    해결 방법:

    - 한도 증액이 필요한 경우 신분증을 지참하여 영업점을 방문하시거나 앱에서 한도 변경을 신청하십시오.

    - 비밀번호 오류로 제한된 경우 본인 확인 후 초기화 절차를 진행하십시오.

    - 지급정지 해제가 필요한 경우, 관련 증빙 서류를 제출하여 정당한 사유를 입증해야 합니다.


    만약 해결이 어려운 복잡한 민원의 경우, 상담원을 통해 책임자에게 에스컬레이션하여 단계별 절차에 따라 도움을 받으십시오. 분쟁 해결이 어려울
    경우 ''법령·제도 안내: 예금·일상 거래''에 명시된 대로 금융감독원 금융분쟁조정위원회를 통해 조정을 진행하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: troubleshooting
  source_authority: official
