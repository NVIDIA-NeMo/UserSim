- id: 00b73bdc-6876-5086-b01b-2ada9e8bdf05
  title: '윤슬 직장인 신용대출: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객에게 윤슬 직장인 신용대출의 전 과정을 안내하기 위한 가이드입니다.


    [상품 개요]

    직장인의 신용과 소득을 바탕으로 신속하게 자금을 마련할 수 있는 신용 대출 상품입니다.


    [주요 조건 및 비용]

    - 대출 금리: 연 4.7% ~ 6.5% (고객 신용도 및 소득에 따라 결정)

    - 이용한도 최고액: 100,000,000원

    - 중도상환수수료율: 0.1%


    [이용 절차]

    1. 가입 상담 및 한도 조회: 고객의 소득 증빙 서류와 신용 점수를 바탕으로 대출 가능 여부와 한도를 확인합니다.

    2. 대출 신청: 본인 확인 및 심사 서류 제출 후 대출 계약을 체결합니다.

    3. 대출 실행: 승인된 한도 내에서 고객의 입출금 계좌로 자금이 입금됩니다.

    4. 원리금 상환: 약정된 상환 방식에 따라 매월 지정된 날짜에 원리금을 납부합니다.


    [주의사항]

    - 대출 계약 후 14일 이내에는 청약 철회가 가능합니다.

    - 신용 상태가 개선된 고객은 금리인하요구권을 행사할 수 있음을 안내하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: product_sheet
  source_authority: official
