- id: ba9d5e6c-e50a-54bc-bd49-ee88f264b542
  title: '윤슬 정기예금: 다른 회사의 일반적인 상품과의 비교'
  body: '윤슬 정기예금을 타 금융기관의 일반적인 예금 상품과 비교하여 안내해 드립니다.


    1. 수익성: 타사의 변동금리 상품과 달리, 윤슬 정기예금은 가입 시 정해진 고정 금리를 보장합니다. (1년 3.4%, 2년 3.3%, 3년
    3.25%)

    2. 안정성: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받으실 수 있어 매우 안전합니다.

    3. 유동성: 정기예금 특성상 만기 전 해지 시 이율이 낮아지는 제약이 있습니다. 즉시 출금이 필요한 자금은 ''윤슬 입출금통장: 상품 개요''
    상품이 더 유리합니다.


    결론적으로, 일정 기간 자금 사용 계획이 명확하며 안정적인 고정 수익을 추구하시는 고객님께 윤슬 정기예금을 추천드립니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: comparison
  source_authority: official
