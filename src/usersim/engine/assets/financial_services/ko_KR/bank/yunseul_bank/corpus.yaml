  institution_id: yunseul_bank
- id: 4396e63f-3408-52e4-bb8d-3f93f5f47c8b
  title: '윤슬 정기예금: 위험 안내'
  body: '본 상품 가입 전 다음의 위험 및 고지 사항을 반드시 확인하십시오.


    1. 예금자 보호: 본 상품은 예금보험공사 보호 대상 상품입니다. 예금자 1인당 원금과 소정의 이자를 합해 최고 1억원까지 보호됩니다. 다만,
    투자 상품은 보호 대상에서 제외됩니다.

    2. 유동성 위험: 본 상품은 정기예금으로, 만기 전에 해지할 경우 중도해지이율이 적용되어 약정된 금리보다 낮은 이자를 받게 됩니다. 따라서
    자금 운용 계획을 신중히 세우시기 바랍니다.

    3. 과세 안내: 이자 소득에 대해 15.4%(소득세 및 지방소득세)가 원천징수됩니다. 또한, 연간 금융소득이 2,000만원을 초과할 경우
    종합과세 대상이 되어 세율이 변동될 수 있습니다.


    상세한 법적 제도 안내는 ''법령·제도 안내: 예금·일상 거래''를 참고하시기 바랍니다.'
