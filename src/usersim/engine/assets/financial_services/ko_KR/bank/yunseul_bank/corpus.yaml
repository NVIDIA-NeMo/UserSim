- id: e0df101d-dd59-5bb3-8ee6-321081a7e02a
  title: '윤슬 입출금통장: 영업시간 외 ATM 출금 수수료 안내'
  body: '질문: 영업시간이 지난 후에 ATM에서 현금을 출금하면 수수료가 발생하나요?

    답변: 네, 그렇습니다. 윤슬 입출금통장 이용 고객님께서 영업시간 외에 ATM을 통해 출금하실 경우 500원의 영업시간 외 ATM 출금 수수료가
    부과됩니다.


    질문: 모바일 앱으로 송금할 때도 수수료가 있나요?

    답변: 아니요, 디지털 금융 편의를 위해 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)는 0원으로 운영하고 있습니다.


    더 자세한 비용 정보는 윤슬 입출금통장: 수수료 안내를 확인해 주십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: faq
