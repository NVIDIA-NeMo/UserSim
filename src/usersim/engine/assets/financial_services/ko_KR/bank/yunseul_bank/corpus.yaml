- id: 285dbb40-60f4-51e4-ba87-287358de70c2
  title: '윤슬 입출금통장: 안전한 이용을 위한 수칙'
  body: '윤슬 입출금통장을 안전하게 이용하시기 위해 다음의 보안 수칙을 반드시 준수해 주십시오.


    첫째, 윤슬은행은 계좌 정보 조회나 변경 등 상태 변경 작업 전에 반드시 고객님의 성함과 생년월일을 통해 본인 확인을 진행합니다. 하지만 그
    외의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단은 어떠한 경우에도 요구하지 않습니다. 이러한 정보를 요구하는
    연락을 받으셨다면 즉시 의심하십시오.


    둘째, 보이스피싱 등 금융사기 피해가 발생했거나 의심되는 상황이라면 즉시 지급정지와 피해구제 신청을 요청하십시오. 신속한 조치를 통해 고객님의
    소중한 자산 피해를 최소화하겠습니다.


    셋째, 타인에게 계좌 비밀번호나 인증 정보를 공유하지 마십시오. 본인 확인 절차 없이 개인정보를 요구하는 행위는 명백한 사기 시도입니다.


    더욱 상세한 보호 조치는 윤슬 입출금통장: 부정사용으로부터 고객을 보호하기 위해 문서를 통해 확인하실 수 있습니다.'
