- id: 49c60435-4fa7-5760-a2b4-fca2aaa6624e
  title: '윤슬 정기예금: 금리·요율이 정해지는 방식과 적용'
  body: '윤슬 정기예금의 금리는 가입 시 선택하신 예치 기간에 따라 다음과 같이 확정 금리로 적용됩니다.


    - 1년 정기예금 금리: 3.4%

    - 2년 정기예금 금리: 3.3%

    - 3년 정기예금 금리: 3.25%


    해당 금리는 가입 시점에 결정되며, 약정 기간 동안 시장 금리가 변동하더라도 변경되지 않고 동일하게 적용됩니다. 단, 만기 전 중도 해지 시에는
    위 약정 금리가 아닌 별도의 중도해지이율이 적용되어 실제 수령하는 이자가 감소합니다. 모든 이자 계산은 단리 방식으로 적용되며, 지급 시 15.4%의
    세율로 원천징수됩니다.'
