  mentions_tools: []
  institution_id: yunseul_bank
- id: adf59750-c020-5bdb-ad05-0917826437f2
  title: '윤슬 체크카드: 로그인하거나 접속할 수 없을 때'
  body: '카드 관리 메뉴나 모바일 앱의 체크카드 서비스에 접속할 수 없는 경우, 다음 단계에 따라 점검해 주십시오.


    [증상]

    - 로그인 시도 시 오류 메시지가 나타나며 접속이 되지 않습니다.

    - 카드 정보 조회 또는 한도 변경 메뉴 진입이 불가능합니다.


    [원인 및 해결 방법]

    1. 인증 정보 오류: 비밀번호를 잘못 입력하여 계정이 잠긴 경우입니다. 비밀번호 재설정 절차를 통해 인증 정보를 갱신하십시오.

    2. 세션 만료: 보안을 위해 일정 시간이 지나 접속이 끊긴 경우입니다. 다시 로그인을 시도하십시오.

    3. 네트워크 상태: 불안정한 연결로 인해 서버 응답이 늦어지는 경우입니다. 네트워크 환경을 확인하신 후 다시 시도하십시오.


    [에스컬레이션]

    위의 조치 후에도 동일한 증상이 지속된다면, 저희가 전문 기술 지원팀으로 해당 건을 이관하여 계정 상태를 정밀 진단하겠습니다. 이 경우 처리
    결과는 고객님의 등록된 연락처로 안내해 드립니다.'
  domain: cards
  product_category: yunseul_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 020aa8a1-e95a-51a9-971b-679cd4e7d63e
  title: '윤슬 체크카드: 이용 조건별 차이'
  body: '| 이용 조건 | 적용 결과 |

    | :--- | :--- |

    | 윤슬 입출금통장 보유 고객 | 카드 발급 및 신청 가능 |

    | 실명 확인 완료 고객 | 기본 하루 이용한도 6,000,000원 적용 |

    | 만 14세 미만 미성년자 | 법정대리인 동의 하에 제한적 발급 가능 |

    | 해외 이용 가능 브랜드 선택 | 국제브랜드 수수료율 1% 및 해외서비스 수수료율 0.2% 적용 |'
