- id: df1dc8e2-0c03-5258-8f0f-5590cc9ed5ec
  title: '윤슬 정기적금: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산을 보호하기 위해 최선을 다하고 있습니다. 최근 정기적금 상품 가입이나 금리 혜택을 미끼로 한 보이스피싱
    등 금융사기가 빈번하게 발생하고 있으니 각별히 주의하시기 바랍니다.


    윤슬은행은 어떠한 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 전화나 문자 메시지로 요구하지
    않습니다. 만약 이러한 정보를 요구하는 연락을 받으셨다면 즉시 전화를 끊으시고 당사 고객센터로 확인하시기 바랍니다.


    만약 금융사기 피해가 발생했거나 의심되는 상황이라면, 즉시 당행에 지급정지와 피해구제 신청을 요청하여 피해를 최소화하십시오. 또한, 윤슬 정기적금은
    예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받으실 수 있습니다. 다만, 모든 투자 상품은 보호 대상에서 제외됨을 유의하시기
    바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 8fb99fc4-4f00-5b39-8c62-faceb001a181
  title: '윤슬 정기적금: 약관'
  body: '본 약관은 윤슬은행과 고객 간의 윤슬 정기적금 계약에 적용되는 제반 사항을 규정합니다.


    1. 납입 조건: 고객은 매월 월 최소 납입액인 10,000원부터 월 최대 납입액인 1,000,000원 범위 내에서 일정 금액을 꾸준히 적립하여야
    합니다.

    2. 금리 및 이자: 약정된 기간 동안 예치 시 정해진 금리를 적용하며, 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.
    또한 이자와 배당을 합한 금융소득이 연 2,000만원을 초과하는 경우 종합과세 대상이 됩니다.

    3. 중도 해지: 만기 전에 계좌를 해지할 경우, 약정 금리가 아닌 중도해지이율이 적용되어 이자 수익이 감소할 수 있습니다.

    4. 예금자 보호: 본 상품은 예금자보호법에 따라 예금보험공사가 예금자 1인당 원금과 소정의 이자를 합해 1억원까지 보호합니다.

    5. 계약 종료: 만기 도래 또는 고객의 해지 요청 시 계약은 종료되며, 원리금은 고객이 지정한 계좌로 지급됩니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 8ebc2c19-a9d1-5267-b8c8-a8e2e4419d1a
  title: '윤슬 정기적금: 이런 분께 알맞습니다'
  body: '윤슬 정기적금은 매월 일정 금액을 꾸준히 저축하여 목돈을 마련하고자 하는 고객님께 가장 적합한 상품입니다. 특히 다음과 같은 분들께
    추천드립니다.


    - 안정적인 자산 증식을 통해 미래의 자금을 준비하고 싶으신 분

    - 매월 적은 금액부터 차근차근 저축 습관을 기르고 싶으신 분

    - 확정된 금리로 안전하게 자산을 관리하고자 하는 직장인 및 개인 고객님


    [상품 주요 제원]

    - 12개월 적금 금리: 3.6%

    - 월 납입 가능 금액: 최소 10,000원 ~ 최대 1,000,000원


    본 상품은 전국 영업점 방문, 모바일 앱, 인터넷 뱅킹을 통해 편리하게 가입하실 수 있습니다. 안정적인 목돈 마련의 시작을 윤슬은행과 함께하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: product_sheet
  source_authority: official
