- id: c4ecb462-9334-5cf5-8253-463bb3d9798b
  title: '윤슬 주택담보대출: 상품 개요'
  body: "윤슬 주택담보대출은 주택 구입을 위해 장기간 안정적으로 자금을 조달하실 수 있도록 설계된 담보 대출 상품입니다. 고객님의 자금 계획에\
    \ 맞춰 변동금리와 혼합형 금리 중 선택하실 수 있으며, 업계 최고 수준의 대출 기간을 제공하여 월 상환 부담을 낮춰드립니다.\n\n[상품\
    \ 주요 내용]\n- 금리 체계\n  * 변동금리: 4.45%\n  * 5년 혼합형 금리: 4.65%\n- 대출 기간: 최장 40년\n- 중도상환수수료\n\
    \  * 수수료율: 0.6%\n  * 부과 기간: 대출일부터 3년까지\n\n본 상품은 금융소비자 보호에 관한 법률을 준수하며, 대출 실행 후\
    \ 14일 이내에 청약을 철회할 수 있는 권리를 보장합니다. 또한, 대출 총액이 1억원을 초과하는 경우 총부채원리금상환비율(DSR) 규제가\
    \ 적용되어 한도가 산정되오니 유의하시기 바랍니다.\n\n상세한 금리 적용 방식은 '윤슬 주택담보대출: 금리·요율 안내'에서 확인하실 수 있습니다."
  domain: lending_mortgage
