  institution_id: yunseul_bank
- id: 8b4a4251-0695-57da-82b3-6e7303381d22
  title: '윤슬 체크카드: 가입부터 이용까지'
  body: '윤슬 체크카드는 연결 계좌의 잔액 내에서 사용하는 실속형 상품으로, 가입부터 이용까지의 상세 내용은 다음과 같습니다.


    [가입 및 발급]

    윤슬은행의 입출금 계좌를 보유한 고객님이라면 누구나 신청 가능합니다. 실명 확인 절차를 거쳐 영업점 방문 또는 모바일 앱을 통해 신청하실 수
    있습니다.


    [주요 혜택 및 조건]

    - 연회비: 0원으로 비용 부담이 없습니다.

    - 캐시백 비율: 이용 금액의 0.3%가 캐시백으로 제공됩니다.

    - 하루 이용한도: 기본 설정값은 6,000,000원입니다.


    [수수료 안내]

    - 국내 이용: 연결 계좌 잔액 내 결제 (수수료 없음)

    - 해외 이용: 국제브랜드 수수료율 1% 및 해외서비스 수수료율 0.2%가 적용됩니다.


    [이용 유의사항]

    체크카드는 사용 즉시 계좌에서 대금이 출금되므로 잔액 관리가 필요합니다. 연말정산 시 총급여의 25%를 초과하는 사용액에 대해 30%의 소득공제율이
    적용되어 세제 혜택을 누리실 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 6e4e4d72-e3cf-54ea-bc9e-29d0de43e5e3
  title: '윤슬 체크카드: 해외 이용 시 해외서비스 수수료율 안내'
  body: 'Q: 윤슬 체크카드를 해외에서 사용할 때 발생하는 수수료는 어떻게 되나요?


    A: 윤슬 체크카드를 해외 가맹점에서 이용하실 때는 두 가지 수수료가 발생합니다. 우선 해외서비스 수수료율 0.2%가 적용되며, 이와 별도로
    국제브랜드 수수료율 1%가 부과됩니다. 두 수수료는 이용 금액에 각각 적용되어 합산 청구됩니다.


    해외 이용 전, 연결된 계좌에 충분한 잔액이 있는지 확인하시기 바랍니다. 상세한 수수료 체계는 ''윤슬 체크카드: 수수료 안내''에서 확인하실
    수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3af75ffc-c75d-57f3-9bb9-a6ef6bdbfe19
  title: '윤슬 체크카드: 등록 정보 변경'
  body: '윤슬 체크카드에 등록된 연락처, 주소 등 고객 정보를 변경하는 절차를 안내해 드립니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 성함과 생년월일을 말씀하시어 본인 확인 절차를 진행하십시오.

    2. 변경하시고자 하는 등록 정보(예: 전화번호, 이메일, 주소 등)와 새로운 정보를 말씀하십시오.

    3. 상담원이 변경 내용을 시스템에 반영한 후, 수정된 정보가 정확한지 최종 확인을 받으십시오.


    정상적으로 변경이 완료되면 즉시 반영되며, 변경된 정보는 향후 카드 관련 고지서 수령 및 알림 서비스에 활용됩니다. 더 자세한 상품 내용은
    ''윤슬 체크카드: 가입부터 이용까지''를 참고하십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: how_to_guide
  source_authority: official
