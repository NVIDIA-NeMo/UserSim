- id: 445f3091-3328-5b00-8631-7dce325b249d
  title: '윤슬 주택담보대출: 가입 대상'
  body: '윤슬 주택담보대출의 가입 대상 및 조건은 다음과 같습니다.


    - 주택 소유 여부: 본인 명의의 주택을 보유하고 있거나 구입 예정인 고객 (필수)

    - DSR 규제: 대출 총액이 1억원을 초과하는 경우, 연간 원리금 상환액이 연소득의 40% 이하일 것 (필수)

    - 신용 상태: 당행의 내부 신용 등급 기준을 충족하는 고객 (필수)

    - 대출 기간: 최장 40년까지 신청 가능 (선택)


    위 조건 중 하나라도 충족하지 못할 경우 대출 승인이 제한될 수 있습니다.'
  domain: lending_mortgage
