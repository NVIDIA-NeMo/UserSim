  institution_id: yunseul_bank
- id: 62f5451e-ab8c-50e0-a4ca-ecde8cf8e35e
  title: '윤슬 주택담보대출: 중도상환수수료율 안내'
  body: '**Q: 대출 기간 중간에 원금을 상환할 경우 수수료가 발생하나요?**


    **A:** 네, ''윤슬 주택담보대출''은 중도상환 시 0.6%의 중도상환수수료율이 적용됩니다. 다만, 대출 실행일로부터 일정 기간이 지나면
    수수료가 면제됩니다. 자세한 면제 기간은 ''윤슬 주택담보대출: 중도상환수수료를 받는 기간(대출일부터, 년) 안내''를 참고해 주시기 바랍니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 20a48c4d-c00b-54d1-b9dd-3c1d1d360aba
  title: '윤슬 주택담보대출: 진행 상황과 내역 확인'
  body: '현재 이용 중인 ''윤슬 주택담보대출''의 상환 내역이나 대출 진행 상황을 확인하는 절차는 다음과 같습니다.


    1. 본인 확인 절차: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 본인 확인이 완료된 후에만 상세 내역 조회가
    가능합니다.

    2. 요청 사항 전달: 확인하고자 하는 항목(현재 잔액, 금리 적용 현황, 다음 이자 납입일, 상환 회차 등)을 구체적으로 요청하십시오.

    3. 내역 확인 및 안내: 당행은 고객님의 대출 계좌를 조회하여 현재까지의 상환 금액, 남은 원금, 적용 중인 금리(변동금리 4.45% 또는
    5년 혼합형 금리 4.65% 등)를 정확히 안내해 드립니다.

    4. 결과 확인: 안내받으신 내용이 고객님이 보유하신 명세서와 일치하는지 확인하십시오. 만약 금액이 다르다면 ''윤슬 주택담보대출: 명세서나
    내역과 맞지 않을 때''의 절차에 따라 조사를 요청하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: how_to_guide
  source_authority: official
