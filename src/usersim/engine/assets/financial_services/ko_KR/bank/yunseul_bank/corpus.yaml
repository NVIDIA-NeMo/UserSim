- id: 08053d3c-abea-5b10-b4b7-55c14840bb10
  title: '윤슬 정기예금: 2년 정기예금 금리 안내'
  body: '질문: 윤슬 정기예금에 2년 동안 예치할 경우 적용되는 금리는 얼마입니까?

    답변: 2년 정기예금 금리는 연 3.3%가 적용됩니다. 가입 시점에 확정된 금리로, 만기까지 변동 없이 유지됩니다.


    질문: 2년 만기 시 이자 계산은 어떻게 이루어지나요?

    답변: 원금에 연 3.3%의 금리를 적용하여 계산하며, 여기서 이자소득세 등 15.4%를 원천징수한 후 세후 금액을 지급해 드립니다. 자세한
    금리 체계는 ''윤슬 정기예금: 금리·요율 안내''를 참조하십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: faq
  source_authority: official
