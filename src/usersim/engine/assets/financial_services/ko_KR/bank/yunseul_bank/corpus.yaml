- id: 9515183a-a1c9-5b28-b4e9-2fac54ea2248
  title: '윤슬 직장인 신용대출: 대출 금리(연, 하한) 안내'
  body: 'Q: 윤슬 직장인 신용대출의 가장 낮은 금리는 얼마인가요?


    A: 본 상품의 대출 금리(연, 하한)는 4.7%입니다. 다만, 이는 최저 기준 금리로 고객님의 신용점수, 연소득, 내부 심사 기준 등에 따라
    최종 적용 금리는 달라질 수 있습니다.


    Q: 최저 금리를 적용받으려면 어떻게 해야 하나요?


    A: 우수한 신용 등급을 유지하시고, 당행과의 거래 실적 및 소득 증빙 자료를 충실히 제출하시면 심사를 통해 최저 금리에 가까운 혜택을 받으실
    수 있습니다. 자세한 사항은 ''윤슬 직장인 신용대출: 상품 개요''를 참고하십시오.'
