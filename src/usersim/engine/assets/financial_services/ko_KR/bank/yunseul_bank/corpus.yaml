- id: 06747a30-5450-5c91-821c-135e68b1f3e7
  title: '윤슬 입출금통장: 위험 안내'
  body: '본 상품 이용과 관련하여 고객님께서 유의하셔야 할 위험 및 고지 사항입니다.


    1. 예금자 보호 안내: 본 상품은 예금보험공사 보호 대상 금융상품입니다. 보호 한도는 예금보험법에 따라 예금자 1인당 당행의 모든 보호 대상
    예금의 원금과 소정의 이자를 합하여 최고 1억원까지입니다. 단, 투자 상품은 보호 대상에서 제외되므로 유의하십시오.


    2. 세금 관련 안내: 본 계좌에서 발생하는 이자 소득에 대해서는 관련 법령에 따라 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.
    또한, 연간 이자와 배당을 합한 금융소득이 2,000만원을 초과하는 경우, 다른 소득과 합산하여 종합과세 대상이 됩니다.


    3. 수수료 발생: 디지털 뱅킹 이체 수수료는 0원이나, 영업시간 외 ATM 출금 시 500원, 통장 및 카드 재발급 시 2,000원의 수수료가
    발생하며 이는 계좌 잔액에서 차감됩니다.


    본 안내는 상품 이해를 돕기 위한 목적으로 제공되며, 개별적인 세무나 법률 자문을 대체할 수 없습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: disclosure
  source_authority: official
