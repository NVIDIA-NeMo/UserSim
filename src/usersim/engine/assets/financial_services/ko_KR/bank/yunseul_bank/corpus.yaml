- id: f1ae1f00-f33b-5622-b6d5-460b1acc0bb0
  title: '윤슬 입출금통장: 상품 고르는 방법'
  body: '고객님의 금융 목적에 맞는 상품을 선택하는 방법을 안내해 드립니다.


    윤슬 입출금통장은 입출금통장 금리 0.1%를 제공하며, 특히 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)가 0원이라는 점에서 일상적인 지출
    관리와 급여 수령에 최적화되어 있습니다.


    만약 매월 일정 금액을 꾸준히 모아 목돈을 마련하고 싶으시다면 ''윤슬 정기적금''을, 이미 보유하신 목돈을 안전하게 예치하여 확정 금리로
    증식하고 싶으시다면 ''윤슬 정기예금''을 추천드립니다.


    자금의 유동성이 중요하다면 윤슬 입출금통장을, 자산의 증식이 목적이라면 정기 예·적금 상품을 선택하십시오. 자세한 비교는 윤슬 입출금통장:
    당사의 비슷한 상품과의 비교에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: comparison
  source_authority: official
