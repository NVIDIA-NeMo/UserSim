- id: b7d119fa-493c-5029-b263-1fa3b6a55153
  title: '윤슬 입출금통장: 통장·카드 재발급 수수료 안내'
  body: 'Q: 윤슬 입출금통장을 이용하다가 통장이나 체크카드를 분실했습니다. 재발급 비용은 얼마인가요?

    A: 윤슬 입출금통장의 통장 및 카드 재발급 수수료는 2,000원입니다. 실물 운영 비용이 발생하는 서비스이므로 합리적인 수수료가 부과되는
    점 양해 부탁드립니다.


    Q: 재발급 신청은 어디서 할 수 있습니까?

    A: 전국 윤슬은행 영업점을 방문하시거나 모바일 앱을 통해 신청하실 수 있습니다. 영업점 방문 시에는 반드시 신분증을 지참하여 주십시오.


    더 자세한 비용 안내는 ''윤슬 입출금통장: 수수료와 비용''에서 확인하실 수 있습니다.'
