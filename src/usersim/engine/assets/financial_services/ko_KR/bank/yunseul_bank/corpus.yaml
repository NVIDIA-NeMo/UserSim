  institution_id: yunseul_bank
- id: 15ae3dc1-da7c-5f08-8320-4b3b20b28ef4
  title: '윤슬 정기적금: 이용 조건별 차이'
  body: '| 구분 | 조건 | 결과 |

    | :--- | :--- | :--- |

    | 월 납입액(최소) | 10,000원 이상 | 가입 및 유지 가능 |

    | 월 납입액(최대) | 1,000,000원 이하 | 가입 및 유지 가능 |

    | 월 납입액(초과) | 1,000,000원 초과 | 납입 제한 |

    | 실명 확인 여부 | 실명 확인 완료 | 계좌 개설 가능 |

    | 실명 확인 여부 | 실명 확인 미완료 | 가입 불가 |

    | 예금자 보호 범위 | 원금+이자 합산 1억원 이하 | 전액 보호 대상 |

    | 예금자 보호 범위 | 원금+이자 합산 1억원 초과 | 1억원까지만 보호 |'
