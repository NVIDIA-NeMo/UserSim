- id: 2e4fdaac-75a5-5ae2-8460-d1cb23532147
  title: '윤슬 직장인 신용대출: 가입 대상'
  body: '윤슬 직장인 신용대출의 가입 가능 여부를 확인하시기 바랍니다.


    - 직장인 여부: 현재 건강보험 가입 직장인으로서 재직 중이어야 함 → 가입 가능

    - 신용 점수: 당행 내부 신용등급 및 외부 신용평가사 기준 적격 등급 이상 → 가입 가능

    - 소득 증빙: 최근 연소득 증빙이 가능하며, DSR(총부채원리금상환비율) 규제 범위 내에 있어야 함 → 가입 가능

    - 제한 사항: 연체 중이거나 파산, 회생 절차가 진행 중인 경우 → 가입 불가'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: eligibility_matrix
  source_authority: official
