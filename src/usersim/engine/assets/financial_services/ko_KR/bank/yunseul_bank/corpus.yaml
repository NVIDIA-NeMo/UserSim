- id: 3d72164b-ed8f-5ce7-a445-cd404d83b70b
  title: '윤슬 주택담보대출: 금리·요율이 정해지는 방식과 적용'
  body: '윤슬 주택담보대출에 적용되는 금리와 요율은 다음과 같습니다.


    - 변동금리: 4.45% (시장 금리 변동에 따라 주기적으로 조정됩니다.)

    - 5년 혼합형 금리: 4.65% (최초 5년 동안 고정금리가 적용된 후 변동금리로 전환됩니다.)

    - 중도상환수수료율: 0.6% (대출일부터 3년 이내 상환 시에만 적용되며, 3년 경과 후에는 0%가 적용됩니다.)


    위 금리는 기준 금리에 고객님의 신용 등급, 담보 가치, 대출 기간 등의 가산 금리가 합산되어 결정됩니다. 대출 실행 후 소득 증가나 신용점수
    상승 등 신용 상태가 개선된 경우에는 금리인하요구권을 통해 금리 인하를 요청하실 수 있습니다.'
