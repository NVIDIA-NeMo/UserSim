- id: 8d11153b-8e41-55cc-90cf-88a98ecf3173
  title: '윤슬 정기적금: 가입 대상'
  body: '윤슬 정기적금 가입을 위한 조건은 다음과 같습니다.


    - 실명 확인: 금융실명법에 따라 실명이 확인된 개인 고객 (필수)

    - 월 납입액 하한: 10,000원 이상 납입 가능

    - 월 납입액 상한: 1,000,000원 이하 납입 가능

    - 가입 가능 상품: 12개월 만기 상품 (금리 연 3.6% 적용)'
