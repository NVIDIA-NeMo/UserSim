  mentions_tools: []
  institution_id: yunseul_bank
- id: be514912-701c-549e-85d3-6ef164fd2906
  title: '윤슬 입출금통장: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 인터넷 뱅킹을 통해 윤슬 입출금통장 서비스에 접속할 수 없는 경우, 다음 순서에 따라 조치해 주십시오.


    [증상 및 원인]

    - 로그인 실패: 비밀번호 오입력 또는 인증 정보 불일치

    - 계좌 접속 불가: 보안 정책에 따른 계좌 잠금 또는 시스템 일시 오류


    [해결 방법]

    1. 입력 정보 확인: 대소문자 구분 및 오타 여부를 확인하여 다시 로그인해 보십시오.

    2. 비밀번호 재설정: 비밀번호를 잊으신 경우, 본인 인증 절차를 통해 비밀번호를 재설정하십시오.

    3. 본인 확인 및 잠금 해제: 지속적으로 접속이 되지 않는 경우, 상담원에게 성함과 생년월일을 제공하여 본인 확인 후 계좌 잠금 상태를 확인하고
    해제를 요청하십시오.


    [에스컬레이션]

    위의 방법으로도 문제가 해결되지 않거나 복잡한 인증 오류가 발생하는 경우, 상담원이 해당 건을 책임자에게 에스컬레이션하여 상세 분석 후 처리
    결과를 안내해 드립니다.


    기타 거래 지연 문제는 윤슬 입출금통장: 처리가 끝나지 않거나 보류 중일 때 문서를 참고하십시오.'
