- id: 65088fa1-3fcb-5b0f-913b-d5e36707b37d
  title: '윤슬 입출금통장: 약관 변경 안내'
  body: '본 안내는 윤슬 입출금통장의 이용 약관 중 수수료 및 금리 적용 관련 변경 사항을 포함하고 있습니다.


    1. 수수료 체계: 디지털 금융 활성화를 위해 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)는 0원으로 유지합니다. 다만, 실물 운영 비용이
    발생하는 서비스에 대해서는 다음과 같이 합리적인 수수료를 부과합니다.

    - 영업시간 외 ATM 출금 수수료: 500원

    - 통장·카드 재발급 수수료: 2,000원


    2. 금리 적용: 본 상품의 입출금통장 금리는 0.1%가 적용되며, 이는 은행의 금리 결정 체계에 따라 변동될 수 있습니다.


    3. 약관 변경 및 종료: 약관 변경 시 은행은 사전에 고객님께 공지하며, 고객님께서 변경된 약관에 동의하지 않으실 경우 계좌 해지를 요청하실
    수 있습니다.


    구체적인 수수료 항목은 윤슬 입출금통장: 수수료 안내에서 확인 가능합니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: terms_conditions
  source_authority: official
