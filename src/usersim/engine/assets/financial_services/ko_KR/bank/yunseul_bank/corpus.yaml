- id: 2f58a26e-c81c-5058-a1f4-d56da425232c
  title: '윤슬 주택담보대출: 위험 안내'
  body: '본 상품 이용 시 다음의 위험 요인을 충분히 숙지하시기 바랍니다.


    1. 금리 변동 위험: 변동금리(4.45%)를 선택하신 경우, 시장 금리 상승 시 이자 부담이 증가할 수 있습니다. 5년 혼합형 금리(4.65%)
    또한 5년 이후에는 변동금리로 전환되어 금리 변동 위험에 노출됩니다.

    2. DSR 규제 위험: 대출 총액이 1억원을 초과하는 차주에게는 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행의 경우 연간 원리금
    상환액이 연소득의 40%를 넘지 않아야 하며, 한도 산정 시 스트레스 금리가 더해져 예상보다 대출 한도가 낮아질 수 있습니다.

    3. 담보권 실행 위험: 대출 원리금을 적기에 상환하지 못할 경우, 제공하신 주택 담보물에 대해 경매 등 강제 집행이 이루어질 수 있습니다.

    4. 중도상환수수료 발생: 대출일부터 중도상환수수료를 받는 기간(대출일부터, 년)인 3년 이내에 상환 시 0.6%의 수수료가 부과되므로 상환
    계획 수립 시 유의하시기 바랍니다.'
