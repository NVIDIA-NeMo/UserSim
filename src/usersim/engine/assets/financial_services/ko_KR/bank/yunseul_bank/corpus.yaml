- id: 7fab7085-bebc-53f1-bbfb-58a443b228af
  title: '윤슬 정기예금: 약관'
  body: '본 약관은 윤슬 정기예금의 가입 및 운영에 관한 권리와 의무를 규정합니다.


    1. 가입 조건: 본 상품은 최소 가입 금액 100,000원 이상부터 가입이 가능하며, 가입 시 금융실명법에 따른 실명 확인 절차를 거쳐야
    합니다.

    2. 금리 적용: 약정 기간 동안 고정 금리가 적용되며, 구체적인 기간별 금리는 ''윤슬 정기예금: 금리·요율이 정해지는 방식과 적용''에서
    확인할 수 있습니다.

    3. 이자 지급 및 과세: 이자는 만기 시 원금과 함께 지급됩니다. 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수되며,
    금융소득 종합과세 대상 여부에 따라 추가 과세될 수 있습니다.

    4. 중도 해지: 고객님의 사정으로 만기 전에 계좌를 해지할 경우, 약정 금리가 아닌 중도해지이율이 적용되어 수령하시는 이자가 크게 감소할
    수 있습니다.

    5. 계약 종료: 만기 시 자동 재예치 신청을 하지 않은 경우, 원금과 세후 이자가 지정하신 입출금 계좌로 입금되며 계약은 종료됩니다.'
