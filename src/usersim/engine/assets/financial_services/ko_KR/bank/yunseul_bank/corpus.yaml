- id: c91fa179-81fa-5d22-8105-07b42f4c017f
  title: '윤슬 입출금통장: 진행 상황과 내역 확인'
  body: '윤슬 입출금통장의 최근 거래 내역과 처리 상태를 확인하는 방법입니다.


    준비 사항: 본인 확인을 위한 성함과 생년월일


    1. 본인 확인 진행: 상담원에게 성함과 생년월일을 말씀해 주십시오. 계좌 정보 조회 전 필수적인 본인 확인 절차입니다.

    2. 조회 범위 요청: 확인하고자 하는 거래 내역의 기간(예: 최근 1개월, 특정 날짜 등)을 말씀해 주십시오.

    3. 내역 확인 및 대조: 상담원이 안내해 드리는 거래 일시, 입금/출금 금액, 거래처 정보를 확인하십시오.

    4. 처리 상태 확인: 이체 중인 내역이 있다면 현재 ''처리 중''인지 ''완료''되었는지 상태를 안내받으십시오.


    위 절차를 통해 실시간으로 거래 내역을 확인하실 수 있으며, 상세 명세서가 필요하신 경우 ''윤슬 입출금통장: 자주 하는 업무의 처리 절차''를
    통해 안내받으시기 바랍니다.'
