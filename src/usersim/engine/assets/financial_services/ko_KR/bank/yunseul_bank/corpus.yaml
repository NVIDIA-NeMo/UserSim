- id: 53e69b1c-798b-561e-8948-17e20d26e30a
  title: 수수료·요금 안내
  body: '윤슬은행은 고객님의 금융 편의를 위해 디지털 금융 서비스를 활성화하고 있습니다. 이에 따라 모바일 앱 및 인터넷 뱅킹을 통한 계좌
    이체 수수료는 0원으로 운영하고 있습니다.


    다만, 실물 운영 비용이 발생하는 다음의 서비스에 대해서는 합리적인 수수료가 부과됩니다.

    - 통장 재발급 수수료

    - 영업시간 외 ATM 이용 수수료


    각 상품별 세부 수수료는 해당 상품의 수수료 안내 문서를 확인해 주시기 바랍니다.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d22770ce-9f12-511c-99e4-8436806966a4
  title: 자주 묻는 질문
  body: '질문: 윤슬은행의 서비스는 어떻게 이용할 수 있습니까?

    답변: 전국 영업점 방문, 모바일 앱, 인터넷 뱅킹 및 고객센터를 통해 모든 금융 서비스를 편리하게 이용하실 수 있습니다.


    질문: 상담원과 연결이 되지 않거나 복잡한 민원이 발생한 경우에는 어떻게 해야 합니까?

    답변: 평일 영업시간 내에 대면 및 유선 상담이 가능합니다. 복잡한 민원의 경우 단계별 절차에 따라 책임자에게 에스컬레이션하여 해결을 도와드리고
    있습니다. 자세한 처리 절차는 관련 사용 기준 문서를 참고하십시오.


    질문: 예금자 보호는 어떻게 이루어집니까?

    답변: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 4374b73a-97b5-5327-bc72-b319cef2d70c
  title: '법령·제도 안내: 예금·일상 거래'
  body: '윤슬은행은 은행법에 따라 금융위원회와 금융감독원의 감독을 받으며, 금융소비자 보호에 관한 법률 및 개인정보 보호법을 엄격히 준수합니다.


    [예금자 보호 제도]

    예금자보호법에 따라 예금보험공사는 보통예금, 정기예금, 적금, 외화예금 등을 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지
    보호합니다. 연금저축(신탁·보험), 확정기여형과 개인형 퇴직연금의 예금보호 대상 상품, 사고보험금은 각각 별도로 1억원까지 보호됩니다. 단,
    펀드와 같이 실적에 따라 수익이 달라지는 투자상품은 보호 대상에서 제외됩니다.


    [과세 안내]

    예금 이자에는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한, 이자와 배당을 합한 금융소득이 연 2,000만원을 초과하는 경우
    다른 소득과 합산하여 종합과세됩니다.


    [계좌 개설 및 보안]

    계좌 개설 시에는 금융실명법에 따른 실명확인이 필수이며, 실명이 확인된 계좌로 계속거래를 하는 경우에는 다시 확인하지 않습니다. 보이스피싱
    등 전기통신금융사기 피해를 입은 고객님은 송금 은행이나 수취 은행에 피해구제를 신청하여 사기에 이용된 계좌의 지급정지를 요청할 수 있습니다.


    [분쟁 해결]

    개인정보는 개인정보 보호법에 따라 처리하며, 주민등록번호는 법령이 허용하는 경우에만 처리합니다. 금융 분쟁 발생 시 금융감독원 금융분쟁조정위원회에
    조정을 신청할 수 있습니다.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 013ab128-181a-5c22-b7fd-ccd82045104c
  title: '법령·제도 안내: 체크카드'
  body: '윤슬은행의 체크카드 서비스는 금융위원회와 금융감독원의 감독하에 운영되며 관련 법령 및 약관을 준수합니다.


    [이용 및 한도]

    체크카드는 결제 즉시 연결된 예금계좌에서 대금이 출금되는 구조입니다. 따라서 계좌 잔액을 초과하여 사용할 수 없으며, 잔액이 부족할 경우 결제가
    거절됩니다.


    [분실 및 부정사용 대응]

    카드를 분실하거나 도난당한 사실을 인지하신 즉시 발급 은행이나 카드사에 신고하여 사용을 정지하십시오. 신고 전후의 부정사용 보상은 관련 법령과
    카드 약관에 따라 처리됩니다. 다만, 비밀번호를 타인에게 알려주는 등 고객님께 고의나 중대한 과실이 있는 경우에는 보상이 제한될 수 있습니다.


    [소득공제 혜택]

    연말정산 시 체크카드 사용액은 총급여의 25%를 초과하는 금액에 대하여 30%의 소득공제율이 적용됩니다. 이는 신용카드의 공제율(15%)보다
    높으므로 효율적인 소비 계획에 참고하시기 바랍니다.


    상담원은 고객님께 수수료, 이용한도, 보상 조건에 대해 정확한 정보를 안내해야 하며, 잘못된 안내를 해서는 안 됩니다.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 31578b4d-bedd-540b-a797-6d650feca4bd
  title: '법령·제도 안내: 대출'
  body: '윤슬은행의 모든 대출 상품은 금융소비자 보호에 관한 법률의 적용을 받으며, 금융위원회와 금융감독원의 감독을 받습니다.


    [청약 철회 및 중도상환]

    대출 계약 후 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날로부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금, 이용 기간의
    이자, 인지세 등 제3자에게 지급한 비용만 반환하며 중도상환수수료는 부과되지 않습니다.

    2025년 1월 13일 이후 체결된 계약의 중도상환수수료는 자금 운용 손실 및 행정·모집 비용 등 실제 비용 범위 내에서만 부과되며, 대출
    실행일로부터 3년이 경과하면 부과할 수 없습니다.


    [대출 한도 및 DSR 규제]

    대출 총액이 1억원을 초과하는 차주에게는 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행권의 경우 연간 원리금 상환액이 연소득의 40%를
    초과할 수 없으며, 한도 산정 시 미래 금리 상승 위험을 반영한 스트레스 금리를 가산하여 계산합니다.


    [금리 및 상환 권리]

    법정 최고금리는 연 20%이며, 연체이자는 약정금리에 최대 3%p를 가산한 수준을 초과할 수 없고 최대 연 20%를 넘지 않아야 합니다. 대출
    이용 중 취업, 승진, 소득 증가 등으로 신용 상태가 개선된 고객님은 금리인하요구권을 행사하여 금리 인하를 요청할 수 있습니다.


    상담원은 대출 승인을 확정적으로 약속하거나 총상환액을 축소하여 안내해서는 안 되며, 상환이 어려운 고객님께는 채무조정 제도를 안내해야 합니다.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 33242650-a135-561f-82db-ebf1e3eeabec
  title: get_account_transactions 사용 기준
  body: '고객님의 계좌 거래 내역 조회 요청 시 상담원은 다음의 절차를 엄격히 준수하여 처리하십시오.


    1. 고객의 본인 확인을 위해 `verify_identity` 도구를 호출합니다. 이때 고객으로부터 성함과 생년월일을 확인하여 입력하십시오.

    2. 고객이 계좌번호 전체가 아닌 마지막 4자리만 제공한 경우, `get_accounts` 도구를 사용하여 해당 고객의 계좌 목록을 조회하고,
    제공된 4자리와 일치하는 `account_id`를 식별합니다.

    3. 확인된 `account_id`를 사용하여 `get_account_transactions` 도구를 호출함으로써 거래 내역을 조회합니다.

    4. 조회된 내역을 바탕으로 고객에게 거래 일시, 금액, 적요 등 요청하신 정보를 정중하게 안내하십시오.


    주의사항: 계좌 정보 조회 전 본인 확인 단계는 필수이며, 비밀번호나 PIN, 주민등록번호 전체 등의 추가 인증 수단은 절대로 요구하지 마십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: yunseul_bank
- id: 046d26be-9081-5389-a97e-a32aa04142cf
  title: get_account_transactions 도구 설명서
  body: '이 도구는 특정 계좌의 상세 거래 내역을 조회하는 기능을 수행합니다. 상담원은 `verify_identity`를 통해 본인 확인이
    완료된 후 이 도구를 직접 호출하여 정보를 제공합니다.


    - 호출 인자: `account_id` (조회 대상 계좌의 고유 식별자)

    - 수행 결과: 해당 계좌에서 발생한 거래 목록(거래 일시, 금액, 입출금 구분, 거래처 등)을 반환합니다.


    본 도구는 이미 인증된 세션에서 작동하므로 비밀번호나 OTP와 같은 추가 인증 인자를 요구하지 않습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: yunseul_bank
- id: 7bf8506d-3950-52a6-bce8-c2dd765b2132
  title: file_transaction_dispute 사용 기준
  body: '윤슬 체크카드의 본인이 사용하지 않은 거래나 이중 출금에 대한 이의 제기 접수 절차는 다음과 같습니다.


    1. `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하고 본인 인증을 완료하십시오.

    2. 고객이 분쟁 대상 계좌나 카드를 특정할 수 있도록 `get_accounts` 도구를 호출하여 정확한 `account_id` 또는 `card_id`를
    확인하십시오.

    3. 고객으로부터 문제가 된 거래의 일시, 금액, 사유를 청취하십시오.

    4. `file_transaction_dispute` 도구를 호출하여 해당 거래에 대한 이의 제기와 조사를 공식적으로 접수합니다.

    5. 접수 완료 후 고객에게 조사 절차와 예상 소요 기간을 안내하십시오.


    해결이 어려운 분쟁의 경우, 공정한 처리를 위해 금융감독원 금융분쟁조정위원회를 통해 조정을 진행할 수 있음을 안내하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: yunseul_bank
- id: 734181a7-4f3a-5d3a-b891-d07bf8032f85
  title: file_transaction_dispute 도구 설명서
  body: "이 도구는 체크카드의 부정 사용 의심 거래나 중복 결제에 대해 이의 제기를 접수하고 조사를 요청하는 기능을 수행합니다. 상담원은 고객의\
    \ 요청을 확인한 후 이 도구를 직접 호출합니다.\n\n- 호출 인자:\n    - `account_id` 또는 `card_id`: 분쟁 대상\
    \ 계좌 또는 카드의 식별자\n    - `transaction_id`: 문제가 발생한 특정 거래의 식별자\n    - `reason`: 이의\
    \ 제기 사유 (예: 본인 미사용, 이중 출금 등)\n- 수행 결과: 이의 제기 접수 번호를 생성하고 조사를 시작합니다.\n\n본 도구 호출\
    \ 전 `verify_identity`를 통한 본인 확인이 완료되어야 합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: yunseul_bank
- id: 717db6c3-c999-542e-9265-e2f186bd154d
  title: freeze_card 사용 기준
  body: '현금카드나 체크카드의 분실 또는 도난 신고 접수 및 즉시 사용 정지 절차는 다음과 같습니다.


    1. `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하고 신속하게 본인 인증을 진행하십시오.

    2. `get_accounts` 도구를 호출하여 고객이 보유한 카드 목록을 확인하고, 정지 대상이 되는 `card_id`를 정확히 식별합니다.

    3. `freeze_card` 도구를 즉시 호출하여 해당 카드의 사용을 정지시키십시오. 이는 부정 사용 피해를 최소화하기 위한 최우선 조치입니다.

    4. 카드 정지 완료 후, 고객에게 재발급 희망 여부를 확인하십시오. 재발급이 필요한 경우 `order_replacement_card` 도구
    사용 절차를 안내하십시오.


    분실 신고 전후의 부정사용 보상 범위는 관련 법령과 카드 약관에 따르며, 고객의 고의나 중과실이 있을 경우 보상이 제한될 수 있음을 명확히
    고지하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: yunseul_bank
- id: 2afd39aa-1714-5060-9d2f-9a324da39854
  title: freeze_card 도구 설명서
  body: "freeze_card 도구는 고객의 현금카드나 윤슬 체크카드가 분실 또는 도난되었을 때, 해당 카드의 사용을 즉시 정지시키기 위해\
    \ 사용합니다.\n\n- **시그니처**: `freeze_card(card_id: string)`\n- **인자**: \n    - `card_id`:\
    \ 정지할 카드의 고유 식별자입니다. 상담원은 `get_accounts` 도구를 통해 고객의 카드 목록을 조회하여 이 값을 확인하십시오.\n\
    - **효과**: 해당 카드는 즉시 사용 불능 상태가 되며, 분실·도난 신고가 접수됩니다.\n\n상담원은 고객의 신원을 확인한 후, 이 도구를\
    \ 직접 호출하여 카드 정지 처리를 수행하십시오."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
