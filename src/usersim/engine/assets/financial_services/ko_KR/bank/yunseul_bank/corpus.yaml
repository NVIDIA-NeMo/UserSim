- id: c2c8f9b2-afaf-5f9d-b7e2-7ae78108f314
  title: '윤슬 주택담보대출: 수수료 안내'
  body: "윤슬 주택담보대출 이용 시 발생하는 수수료 항목은 다음과 같습니다.\n\n- 중도상환수수료: 0.6%\n  * 적용 대상: 대출 실행일로부터\
    \ 3년 이내에 원금을 상환하는 경우 부과됩니다.\n  * 면제 조건: 대출일부터 3년이 경과한 후에는 중도상환수수료가 부과되지 않습니다.\n\
    \n기타 대출 관련 행정 비용 및 인지세는 법령 및 은행 약관에 따라 실비 수준으로 부과됩니다. 상세 내용은 '윤슬 주택담보대출: 상품설명서\
    \ 주요 내용'을 참고하십시오."
