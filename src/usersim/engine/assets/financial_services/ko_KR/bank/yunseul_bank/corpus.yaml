  institution_id: yunseul_bank
- id: 3ee1e77a-72b9-575f-9918-51b9c6ba1c29
  title: '윤슬 체크카드: 다른 회사의 일반적인 상품과의 비교'
  body: '윤슬 체크카드를 타사 일반 체크카드 상품과 비교해 드리겠습니다.


    | 비교 항목 | 윤슬 체크카드 | 타사 일반 체크카드 |

    | :--- | :--- | :--- |

    | 연회비 | 0원 | 상품에 따라 0원~수만 원 다양함 |

    | 기본 혜택 | 결제 금액의 0.3% 캐시백 | 포인트 적립 또는 특정 가맹점 할인 위주 |

    | 기본 이용한도 | 6,000,000원 | 상품 및 신용도에 따라 상이함 |

    | 소득공제율 | 30% (총급여 25% 초과분) | 동일 (법정 세율 적용) |


    **어떤 상품이 더 적합할까요?**

    - **윤슬 체크카드**: 복잡한 조건 없이 모든 결제에 대해 0.3%의 캐시백을 받고 싶으시고, 연회비 부담 없이 넉넉한 하루 한도를 이용하고
    싶으신 분께 유리합니다.

    - **타사 상품**: 특정 브랜드(편의점, 카페 등)에서 매우 높은 할인율을 제공하는 특화 카드를 선호하시는 경우 더 적합할 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: ef4b203f-c594-5ea0-9d37-bb06bc19e138
  title: '윤슬 체크카드: 위험 안내'
  body: '본 상품을 이용하시기 전, 다음의 위험 및 유의사항을 반드시 확인하시기 바랍니다.


    1. 잔액 부족으로 인한 결제 거절: 윤슬 체크카드는 연결 계좌의 잔액 범위 내에서만 사용 가능합니다. 계좌 잔액이 결제 금액보다 적을 경우
    결제가 거절되며, 이는 신용카드와 달리 초과 사용이 불가능함을 의미합니다.

    2. 부정사용 책임: 카드를 분실하거나 도난당했을 때 즉시 신고하지 않아 발생하는 부정사용 금액에 대해서는 관련 법령 및 약관에 따라 고객님의
    책임이 발생할 수 있습니다. 특히 비밀번호 관리 소홀 등 중대한 과실이 인정될 경우 보상이 제한됩니다.

    3. 해외 이용 비용: 해외 이용 시에는 단순 물품 가격 외에 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 추가로 부과되어 실제
    원화 출금액이 예상보다 높을 수 있습니다.

    4. 한도 제한: 기본 설정된 하루 이용한도는 6,000,000원이며, 이를 초과하는 결제는 승인되지 않습니다.'
