  institution_id: yunseul_bank
- id: 7a9f69b9-07ff-5fdd-903e-c89c74ae7bb4
  title: '윤슬 입출금통장: 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자산 관리 목적에 따라 윤슬 입출금통장에서 다른 상품으로의 전환을 안내해 드립니다.


    윤슬 입출금통장은 0.1%의 금리를 제공하며, 모바일·인터넷뱅킹 이체 수수료가 0원으로 매우 편리하여 급여 수령, 공과금 자동이체 등 일상적인
    금융 거래에 최적화되어 있습니다.


    반면, 일정 기간 자금을 묶어두어 더 높은 수익을 얻고자 하신다면 다음 상품이 유리합니다.

    - 윤슬 정기예금: 목돈을 안전하게 예치하여 확정된 금리로 자산을 증식하고 싶으신 경우

    - 윤슬 정기적금: 매월 일정 금액을 꾸준히 적립하여 목돈을 마련하고 싶으신 경우


    단순 소비와 빈번한 이체가 목적이라면 현재의 입출금통장을 유지하시고, 자산 증식이 목적이라면 정기예금이나 적금으로의 전환을 추천해 드립니다.
    상세한 상품 비교는 ''윤슬 입출금통장: 당사의 비슷한 상품과의 비교''를 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: comparison
  source_authority: official
