- id: 62192b47-a7dc-59ea-9c42-35ce63188966
  title: '윤슬 정기적금: 당사의 비슷한 상품과의 비교'
  body: '윤슬은행의 대표 저축 상품인 ''윤슬 정기적금''과 ''윤슬 정기예금''을 비교해 드립니다.


    | 구분 | 윤슬 정기적금 | 윤슬 정기예금 |

    | :--- | :--- | :--- |

    | 적립 방식 | 매월 일정 금액 적립 | 목돈 일시 예치 |

    | 납입 한도 | 월 10,000원 ~ 1,000,000원 | 제한 없음 (상품별 상이) |

    | 금리 (12개월) | 연 3.6% | 상품별 상이 |

    | 추천 고객 | 꾸준히 목돈을 만들고 싶은 분 | 이미 보유한 목돈을 안전하게 굴리고 싶은 분 |


    매월 적은 금액부터 차근차근 자산을 늘리고자 하신다면 윤슬 정기적금이 더 유리한 선택이 됩니다. 반면, 이미 큰 금액의 자산을 보유하고 계시다면
    ''윤슬 정기예금: 상품 개요''를 확인해 보시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d54640f3-b2c5-5ba4-93f6-3da30a8eee07
  title: '윤슬 정기적금: 상품설명서 주요 내용'
  body: '본 안내는 윤슬 정기적금 가입 전 고객님이 반드시 확인하셔야 할 법적 고지 사항을 포함하고 있습니다.


    1. 예금자 보호법 안내: 본 상품은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다. 단, 투자 상품은 보호 대상에서
    제외됩니다.

    2. 과세 안내: 이자 소득에 대해 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 금융소득 종합과세 기준(연 2,000만원 초과)에
    해당할 경우 종합과세 대상이 됩니다.

    3. 중도 해지 시 유의사항: 만기 전에 계좌를 해지하실 경우, 약정 금리인 연 3.6%보다 낮은 중도해지이율이 적용되어 이자 수익이 감소할
    수 있습니다.

    4. 개인정보 처리: 고객님의 개인정보는 개인정보 보호법에 따라 엄격히 처리되며, 주민등록번호는 법령이 허용하는 경우에만 처리합니다.


    더 자세한 법령 정보는 ''법령·제도 안내: 예금·일상 거래''를 참조하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 26774e6f-b471-548c-935f-5286b4a66782
  title: '윤슬 정기적금: 금리·요율 안내'
  body: '윤슬 정기적금의 적용 금리를 안내해 드립니다.


    - 12개월 적금 금리: 연 3.6%


    해당 금리는 가입 시점부터 만기일까지 동일하게 적용되는 확정 금리입니다. 모든 가입 고객님께 동일한 금리가 적용되며, 별도의 우대 금리 조건
    없이 기본 금리로 제공됩니다. 단, 만기 전 중도 해지 시에는 약정 금리가 아닌 중도해지이율이 적용되어 실제 수령하시는 이자가 적어질 수 있음을
    유의하십시오.'
  domain: retail_banking
