- id: 6f1e84d1-415b-545d-abf7-11a8f7a5621e
  title: '윤슬 주택담보대출: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객에게 윤슬 주택담보대출의 가입 절차와 주요 조건을 안내하기 위한 지침서입니다.


    [상품 핵심 조건]

    - 변동금리: 4.45%

    - 5년 혼합형 금리: 4.65%

    - 최장 대출 기간(년): 40

    - 중도상환수수료율: 0.6%

    - 중도상환수수료 적용 기간: 대출일부터 3년


    [이용 절차]

    1. 상담 및 한도 조회: 고객의 소득, 신용점수, 담보 가치를 확인하여 대출 가능 금액을 산정합니다. 이때 대출 총액이 1억원을 초과하는
    경우 DSR 규제를 적용하여 한도를 계산합니다.

    2. 서류 접수 및 심사: 실명확인 절차를 거쳐 필요한 증빙 서류를 접수하고 심사를 진행합니다.

    3. 대출 계약 체결: 심사 승인 후 금리 유형(변동 또는 혼합형)을 선택하고 계약서를 작성합니다.

    4. 대출 실행: 설정된 담보권을 바탕으로 대출금을 지급합니다.


    상담 시 고객에게 변동금리와 5년 혼합형 금리의 차이를 명확히 설명하고, 3년 이후에는 중도상환수수료가 면제된다는 점을 강조하십시오.'
