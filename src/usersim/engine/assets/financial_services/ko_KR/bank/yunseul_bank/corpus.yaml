- id: 014ca00a-bd5a-538b-acf2-6deabae879f6
  title: '윤슬 정기예금: 이 상품을 사칭한 사기 주의'
  body: '최근 윤슬 정기예금의 높은 금리를 미끼로 하여 고객님의 개인정보나 자금을 가로채려는 사기 시도가 발생하고 있습니다. 고객님께서는 다음과
    같은 주의 사항을 반드시 확인하시어 피해를 예방하시기 바랍니다.


    윤슬은행은 어떠한 경우에도 전화나 문자 메시지를 통해 비밀번호, 카드번호, CVV, PIN, 또는 주민등록번호 전체를 요구하지 않습니다. 특히
    ''특별 금리 적용''이나 ''한도 증액''을 조건으로 특정 링크 클릭을 유도하거나 추가 인증 수단을 요구하는 행위는 전형적인 금융 사기 수법이므로
    각별히 주의하십시오.


    만약 윤슬 정기예금을 사칭한 의심스러운 연락을 받으셨거나, 이미 자금을 이체하신 경우 즉시 저희 고객센터나 영업점으로 연락하여 지급정지를 요청하시고
    피해구제 신청을 진행하시기 바랍니다. 신속한 대응만이 피해를 최소화할 수 있는 방법입니다.'
