- id: 4765a8ac-24d4-5362-9ad9-f248893566e5
  title: '윤슬 정기예금: 상품 고르는 방법'
  body: '자산 운용 목적에 따라 가장 적합한 예치 기간을 선택하십시오.


    - 단기 자금 운용: 1년 정기예금 금리 3.4%를 적용받아 빠르게 목돈을 굴리고 싶은 분께 추천합니다.

    - 중장기 안정 투자: 2년(3.3%) 또는 3년(3.25%) 기간을 선택하여 확정 금리로 자산을 안정적으로 증식시키고자 하는 분께 적합합니다.


    만약 매월 일정 금액을 꾸준히 저축하여 목돈을 만들고 싶으시다면, 일시에 예치하는 윤슬 정기예금보다 ''윤슬 정기적금: 상품 개요'' 상품이
    더 나은 선택지가 될 수 있습니다. 고객님의 현재 자금 상황과 목표 기간을 고려하여 결정하십시오.'
