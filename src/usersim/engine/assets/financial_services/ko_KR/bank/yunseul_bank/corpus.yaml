- id: bfd81faf-bb85-5cab-a4de-80a0a6aaadfd
  title: '윤슬 정기예금: 1년 정기예금 금리 안내'
  body: 'Q: 윤슬 정기예금 1년 만기 상품의 금리는 어떻게 되나요?


    A: 현재 윤슬 정기예금의 1년 정기예금 금리는 3.4%입니다. 가입 시점에 확정된 금리가 만기 시까지 적용되어 안정적인 이자 수익을 기대하실
    수 있습니다.


    Q: 금리가 변동될 가능성이 있습니까?


    A: 정기예금은 가입 당시의 확정 금리를 적용하는 상품이므로, 가입 이후 시장 금리가 변동하더라도 만기 시까지는 3.4%의 금리가 그대로 유지됩니다.


    더 자세한 기간별 금리 정보는 ''윤슬 정기예금: 금리·요율 안내''를 참고하시기 바랍니다.'
  domain: retail_banking
