- id: 5a66eb33-64b8-5d61-941e-39735077864e
  title: '윤슬 입출금통장: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 계좌 잔액이나 거래 내역이 예상과 다를 때 상담원이 확인해야 할 절차입니다.


    증상: ''입금한 금액이 반영되지 않았다'', ''알지 못하는 출금 내역이 있다'', ''수수료가 잘못 청구되었다''고 주장하는 경우


    확인 및 조치 순서:

    1. 미결제/보류 거래 확인: 이체 요청 후 상대 은행의 처리 지연으로 인해 ''처리 중'' 상태인 내역이 있는지 확인하십시오.

    2. 수수료 항목 대조: 출금 내역 중 영업시간 외 ATM 출금 수수료 500원이나 통장·카드 재발급 수수료 2,000원이 포함되어 있는지
    확인하십시오.

    3. 원천징수 내역 확인: 이자 지급 시 소득세와 지방소득세 합계 15.4%가 원천징수되어 실제 수령액이 적을 수 있음을 안내하십시오.

    4. 거래 일시 및 상대방 확인: 고객이 제시하는 거래 시각과 실제 시스템 기록상의 시각을 대조하십시오.


    해결 방법:

    - 단순 착오인 경우 상세 내역을 안내하여 오해를 해소합니다.

    - 시스템 오류나 부정 사용이 의심되는 경우, 즉시 내부 조사 절차를 밟고 고객에게 진행 상황을 안내하십시오.


    분쟁이 해결되지 않아 고객이 강력히 이의를 제기하는 경우, ''법령·제도 안내: 예금·일상 거래''에 따라 금융감독원 금융분쟁조정위원회를 통한
    조정 절차를 안내하시기 바랍니다.'
