    - 대상: 기간 내 윤슬 직장인 신용대출을 신규로 신청하시는 고객님

    - 혜택 내용: 심사 결과 최저 금리 적용 대상자인 경우, 대출 금리(연, 하한)인 4.7%를 최우선적으로 적용해 드립니다.

    - 한도: 이용한도 최고액 100,000,000원 내에서 심사 후 결정


    본 이벤트는 당행의 심사 기준을 충족하는 고객님에 한해 적용되며, 상세 조건은 ''윤슬 직장인 신용대출: 금리·요율 안내''를 참고해 주시기
    바랍니다.'
