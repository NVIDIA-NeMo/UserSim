- id: afb7ad78-1b7d-5538-a0c4-d2d26235194f
  title: '윤슬 주택담보대출: 거래가 거절되거나 제한되었을 때'
  body: '대출 신청이 거절되거나 일부 거래가 제한되는 경우, 다음과 같은 원인과 해결 방법을 확인하십시오.


    **증상: 대출 신청 또는 한도 증액 요청이 거절됨**

    - **원인 1: DSR 규제 초과.** 대출 총액이 1억원을 넘는 경우, 연간 원리금 상환액이 연소득의 40%를 초과하면 승인이 제한됩니다.

    - **원인 2: 담보 가치 하락.** 주택 가격 변동으로 인해 담보 인정 비율(LTV)을 초과한 경우입니다.

    - **원인 3: 신용 상태 변화.** 최근 신용점수 하락이나 타 금융기관의 연체 기록이 발견된 경우입니다.


    **해결 방법:**

    1. 현재 소득 증빙 서류를 최신화하여 제출하십시오.

    2. 타 금융기관의 대출을 상환하여 DSR 비율을 낮춘 후 다시 요청하십시오.

    3. 최신 시세가 반영된 담보 평가서를 제출하여 한도를 재산정하십시오.


    **에스컬레이션:**

    위 조치 후에도 해결되지 않는 경우, 상담원은 해당 건을 대출 심사 책임자에게 에스컬레이션하여 예외 승인 가능 여부를 검토하고, 그 결과를
    영업일 기준 3~5일 이내에 안내해 드립니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3561ecfb-ed3f-580c-b41a-0d15582d7e93
  title: '윤슬 주택담보대출: 전환이나 상위 상품을 고려할 때'
  body: '고객의 재무 상황에 따라 변동금리와 혼합형 금리 중 선택이 필요합니다. 상담원은 다음 기준을 바탕으로 안내하십시오.


    - **변동금리 (4.45%):** 시장 금리 하락이 예상되거나, 단기적으로 자금을 운용하고 상환할 계획이 있는 고객에게 적합합니다. 금리
    변동 위험이 있으나 초기 금리가 상대적으로 낮습니다.

    - **5년 혼합형 금리 (4.65%):** 향후 5년간 고정된 금리를 유지하여 지출 계획을 안정적으로 세우고 싶은 고객에게 적합합니다. 변동금리보다
    0.2%p 높지만 금리 상승기에는 유리합니다.


    현재 변동금리를 이용 중인 고객이 금리 상승으로 부담을 느낀다면 5년 혼합형으로의 전환을 제안하십시오. 반대로 시장 금리가 확연히 낮아진 시점에는
    변동금리가 더 유리할 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d7dc89e1-ef6a-541b-b0da-7eac7f0a9643
  title: '윤슬 주택담보대출: 다른 상품과의 비교와 맞지 않는 경우'
  body: '''윤슬 주택담보대출''은 주택이라는 확실한 담보를 바탕으로 장기간 안정적으로 자금을 조달하는 상품입니다. 고객님의 상황에 따라 이
    상품이 적합하지 않을 수 있으니 아래 내용을 확인하십시오.


    **이런 분께는 적합하지 않습니다:**

    - **담보 주택이 없는 경우:** 본 상품은 주택 담보가 필수입니다. 담보 없이 직장인 신용과 소득만으로 빠르게 자금을 마련하시려면 ''윤슬
    직장인 신용대출''이 더 적합합니다.

    - **초단기 자금이 필요한 경우:** 주택담보대출은 심사와 설정 과정에 시간이 소요됩니다. 매우 긴급한 소액 자금이 필요하신 분께는 적합하지
    않습니다.


    **상품의 특장점:**

    - **장기 상환 가능:** 최장 40년까지 대출 기간을 설정할 수 있어 매월 상환 부담을 최소화할 수 있습니다.

    - **안정적인 금리 선택:** 4.45%의 변동금리와 4.65%의 5년 혼합형 금리 중 선택하여 운용할 수 있습니다.

    - **합리적 중도상환:** 0.6%의 수수료율이 적용되며, 대출 후 3년이 지나면 수수료 없이 전액 상환이 가능합니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
