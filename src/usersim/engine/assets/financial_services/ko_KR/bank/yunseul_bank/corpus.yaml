- id: 54808d7e-e802-54cb-a68e-5a05e6858e14
  title: '윤슬 주택담보대출: 약관'
  body: '본 약관은 윤슬 주택담보대출의 이용 조건과 권리 및 의무를 규정합니다.


    1. 대출 기간 및 금리: 최장 대출 기간(년)은 40년이며, 금리는 변동금리(4.45%) 또는 5년 혼합형 금리(4.65%) 중 선택하여
    적용받습니다.

    2. 청약 철회: 금융소비자 보호에 관한 법률에 따라, 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할
    수 있습니다. 이 경우 원금과 이용 기간의 이자, 인지세 등 제3자 비용만 부담하며 중도상환수수료는 면제됩니다.

    3. 중도상환수수료: 대출일부터 중도상환수수료를 받는 기간(대출일부터, 년)인 3년 이내에 원금을 상환할 경우, 0.6%의 중도상환수수료율이
    적용됩니다. 단, 대출일부터 3년이 경과한 후에는 수수료가 부과되지 않습니다.

    4. 금리인하요구권: 취업, 승진, 소득 증가 등 신용 상태가 개선된 고객은 금리인하요구권을 행사하여 대출 금리 인하를 요청할 수 있습니다.

    5. 계약 종료: 대출 원리금의 전액 상환 또는 담보물의 말소 시 본 계약은 종료됩니다.'
