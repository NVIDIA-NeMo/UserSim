  institution_id: yunseul_bank
- id: 41cd71f1-9c78-540d-a2f1-6f3bd25fa9f3
  title: '윤슬 입출금통장: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 금융소비자 보호에 관한 법률을 엄격히 준수하여 고객님의 소중한 정보를 처리합니다.


    [개인정보 수집 및 이용]

    윤슬 입출금통장 개설 시 금융실명법에 따라 실명 확인 절차를 거치며, 수집된 정보는 계좌 개설, 거래 내역 관리, 법적 의무 이행 및 금융
    서비스 제공 목적으로만 사용됩니다. 주민등록번호는 관련 법령이 허용하는 경우에 한하여 처리합니다.


    [예금자 보호 안내]

    본 상품은 예금보험공사를 통해 예금자 보호법에 따라 보호됩니다. 예금보험공사는 금융회사별로 예금자 1인당 원금과 소정의 이자를 합해 1억원까지
    보호합니다.


    [세금 및 과세]

    발생하는 이자 소득에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한, 이자와 배당을 합한 금융소득이 연 2,000만원을
    초과하는 경우 다른 소득과 합산하여 종합과세 대상이 됩니다.


    관련 법령에 대한 자세한 내용은 법령·제도 안내: 예금·일상 거래 문서를 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 79001ef4-6c0d-5b50-869c-2a73fd2d167c
  title: '윤슬 입출금통장: 이 상품을 사칭한 사기 주의'
  body: '최근 윤슬 입출금통장 고객님을 대상으로 한 금융사기 시도가 빈번하게 발생하고 있어 각별한 주의를 당부드립니다.


    사기범들은 주로 은행 직원이나 금융감독원, 경찰 등을 사칭하여 ''저금리 대환대출이 가능하다''거나 ''계좌 보안 강화를 위해 정보가 필요하다''며
    접근합니다. 윤슬은행은 어떤 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 전체 또는 추가 인증 수단을 전화나 문자로
    요구하지 않습니다. 특히 특정 앱 설치를 유도하거나 원격 제어 프로그램 설치를 권유하는 경우 100% 사기이므로 즉시 통화를 종료하십시오.


    만약 보이스피싱 등 금융사기 피해가 의심되거나 이미 자금이 이체된 경우에는 즉시 당행 고객센터나 경찰청(112)에 신고하여 지급정지와 피해구제
    신청을 진행하시기 바랍니다. 신속한 조치만이 피해를 최소화할 수 있는 유일한 방법입니다.


    안전한 금융 거래를 위해 주기적으로 비밀번호를 변경하시고, 의심스러운 링크는 절대 클릭하지 마십시오. 자세한 예방 수칙은 ''윤슬 입출금통장:
    안전한 이용을 위한 수칙''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: security_advisory
  source_authority: official
