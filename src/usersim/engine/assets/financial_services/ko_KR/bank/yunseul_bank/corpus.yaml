  title: '윤슬 정기예금: 가입부터 이용까지'
  body: "본 문서는 윤슬 정기예금의 가입 및 이용 절차를 안내하는 상담원용 지침서입니다.\n\n[상품 핵심 요약]\n- 최소 가입 금액: 100,000원\n\
    - 예치 기간별 금리:\n  - 1년 정기예금 금리: 3.4%\n  - 2년 정기예금 금리: 3.3%\n  - 3년 정기예금 금리: 3.25%\n\
    - 보호 한도: 예금자 1인당 원금과 이자 합계 1억원\n\n[가입 절차]\n1. 본인 확인: 고객의 성함과 생년월일을 확인하여 신원을 검증하십시오.\n\
    2. 실명 확인: 금융실명법에 따라 실명 확인 절차를 수행하십시오.\n3. 상품 안내: 고객의 자금 운용 계획에 맞춰 기간별 금리를 안내하고\
    \ 적합한 상품을 추천하십시오.\n4. 가입 실행: 최소 가입 금액인 100,000원 이상을 예치하고 가입 계약을 체결합니다.\n\n[이용\
    \ 및 관리]\n- 만기 시: 원금과 원천징수세(15.4%)를 제외한 이자가 지급됩니다.\n- 중도 해지: 중도해지이율이 적용됨을 사전에 명확히\
    \ 고지하십시오.\n- 세금 안내: 금융소득 종합과세 기준(연 2,000만원 초과)에 대해 필요 시 안내하십시오."
