- id: b9010518-75de-5333-ad8a-e0565f23c0b9
  title: '윤슬 직장인 신용대출: 약관'
  body: '본 약관은 윤슬 직장인 신용대출의 이용 조건과 권리 및 의무를 규정합니다.


    1. 대출 한도 및 금리: 본 상품의 이용한도 최고액은 100,000,000원이며, 적용 금리는 고객의 신용 상태에 따라 연 4.7%에서 연
    6.5% 범위 내에서 결정됩니다.


    2. 중도상환수수료: 대출 기간 중 원금을 상환할 경우 0.1%의 중도상환수수료율이 적용됩니다. 단, 대출일부터 3년이 경과한 경우에는 수수료를
    부과하지 않습니다.


    3. 청약 철회권: 고객은 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과
    이용 기간의 이자, 인지세 등 제3자에게 지불한 비용만 상환하며 중도상환수수료는 면제됩니다.


    4. 상환 의무 및 지연: 고객은 약정한 기일에 원리금을 상환해야 하며, 연체 시 약정금리에 최대 3%p를 더한 연체이자가 부과됩니다. 단,
    법정 최고금리인 연 20%를 초과할 수 없습니다.


    5. 신용 상태의 변경: 취업, 승진, 소득 증가 등으로 신용 상태가 개선된 경우, 고객은 금리인하요구권을 행사하여 금리 인하를 요청할 수
    있습니다.'
