- id: 4c606f70-7c1f-5734-a48b-a81ea67344e3
  title: '윤슬 입출금통장: 상품 개요'
  body: '윤슬 입출금통장은 급여 수령, 공과금 및 카드대금 자동이체 등 고객님의 일상적인 금융 거래를 위해 설계된 가장 기본적인 입출금 계좌입니다.
    전국 영업점 네트워크와 편리한 디지털 뱅킹을 통해 언제 어디서나 안정적인 자산 관리를 경험하십시오.


    [주요 금리 및 수수료 안내]

    - 입출금통장 금리: 0.1%

    - 다른 은행으로 이체 수수료(모바일·인터넷뱅킹): 0원

    - 영업시간 외 ATM 출금 수수료: 500원

    - 통장·카드 재발급 수수료: 2,000원


    [고객 보호 및 세제 사항]

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.

    - 원천징수: 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.

    - 실명 확인: 금융실명법에 따라 계좌 개설 시 실명 확인 절차가 반드시 필요합니다.


    더 자세한 내용은 ''윤슬 입출금통장: 수수료 안내''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: product_sheet
  source_authority: official
