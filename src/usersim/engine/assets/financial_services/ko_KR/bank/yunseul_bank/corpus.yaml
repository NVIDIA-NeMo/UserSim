- id: 74bf93cc-55a4-50a5-9315-a66ddc305d55
  title: '윤슬 체크카드: 자주 하는 업무의 처리 절차'
  body: '윤슬 체크카드의 분실 신고 및 재발급 절차를 안내드립니다.


    [카드 분실 신고 및 정지]

    1. 상담원에게 카드 분실 또는 도난 사실을 알리고 정지를 요청하십시오.

    2. 본인 확인을 위해 성함과 생년월일을 말씀해 주십시오.

    3. 상담원이 즉시 해당 카드의 사용을 정지시키며, 정지 완료 여부를 확인해 드립니다.


    [카드 재발급 신청]

    1. 사용 정지된 카드의 재발급을 요청하십시오.

    2. 새로운 카드를 수령하실 주소와 연락처를 확인해 주십시오.

    3. 재발급에 따른 수수료를 안내받으십시오. 통장 재발급이나 카드 재발급과 같이 실물 운영 비용이 발생하는 서비스에는 합리적인 수수료가 부과됩니다.

    4. 신청 완료 후 영업일 기준 지정된 기간 내에 실물 카드가 배송됩니다.


    분실 신고 전후의 부정사용 보상 범위는 관련 법령과 약관에 따르며, 비밀번호를 타인에게 알려주는 등 고객님의 고의나 중대한 과실이 있는 경우
    보상이 제한될 수 있으므로 각별한 주의를 부탁드립니다.'
  domain: cards
  product_category: yunseul_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 81439c9e-9661-589e-871e-0f969ad1c712
  title: '윤슬 체크카드: 명세서나 내역과 맞지 않을 때'
  body: '이용 내역서의 금액이 실제 결제 금액과 다르거나 모르는 거래 내역이 발견된 경우 다음과 같이 조치하십시오.


    [확인 사항]

    1. 해외 이용 수수료 확인: 해외 가맹점에서 결제하신 경우, 물품 가격 외에 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 추가로
    부과되어 합계 금액이 커질 수 있습니다.

    2. 캐시백 적용 여부: 결제 금액에서 캐시백 비율 0.3%가 적용되어 최종 청구 금액이나 잔액에 반영되었는지 확인하십시오.

    3. 승인 대기 거래: 일부 가맹점의 경우 결제 후 실제 전표 매입까지 시차가 발생하여 내역 반영이 늦어질 수 있습니다.


    [해결 및 에스컬레이션]

    - 위 사항을 확인했음에도 내역이 맞지 않는다면, 상담원에게 해당 거래의 상세 조회를 요청하십시오.

    - 상담원이 거래 번호와 가맹점 정보를 확인하여 오류 여부를 판단합니다.

    - 단순 전산 오류가 아니거나 해결이 어려운 복잡한 민원의 경우, 단계별 절차에 따라 책임자에게 에스컬레이션하여 정밀 조사를 진행합니다.

    - 필요 시 금융감독원 금융분쟁조정위원회를 통해 조정을 진행하실 수 있습니다.'
