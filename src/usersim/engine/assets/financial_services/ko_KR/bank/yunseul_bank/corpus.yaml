- id: 46a57ac1-5b64-5de8-9696-b8523dddf4f9
  title: set_alerts 도구 설명서
  body: '상담원은 `set_alerts` 도구를 호출하여 고객의 계좌나 카드 거래에 대한 알림 설정을 수행합니다. 이 작업은 상담원이 직접
    도구를 호출하여 처리하며, 고객에게 외부 앱이나 웹사이트에서 직접 설정하도록 안내하지 않습니다.


    본 도구는 `verify_identity`를 통해 고객의 본인 확인이 완료된 후에만 사용할 수 있으며, 호출 시 별도의 인증 코드는 필요하지
    않습니다.


    - **효과**: 지정된 조건에 따른 거래 알림(입출금 내역, 카드 결제 알림 등)의 활성화 또는 비활성화 상태를 변경합니다.

    - **인수**: 알림을 설정할 대상의 계좌 또는 카드 식별자, 알림의 유형, 그리고 알림을 수신할 채널 정보가 필요합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: yunseul_bank
- id: 4b559d9b-5b3c-5f6e-9d0d-d07dd1f6312e
  title: dispute_status 사용 기준
  body: '고객이 접수한 체크카드 거래 이의 제기나 보이스피싱 등 금융사기 피해 구제 신청의 진행 상황을 확인하는 절차입니다. 윤슬은행은 모든
    고객 분쟁을 공정하게 처리하며, 상담원은 다음 단계에 따라 업무를 처리하십시오.


    1. 고객의 성함과 생년월일을 확인하여 `verify_identity` 도구로 본인 확인을 수행합니다.

    2. 고객이 계좌번호나 카드번호의 마지막 4자리만 제공한 경우, `get_accounts` 도구를 호출하여 해당 고객의 전체 계좌 및 카드
    목록을 조회하고 정확한 식별자(ID)를 확인합니다.

    3. 확인된 식별자를 사용하여 `dispute_status` 도구를 호출합니다. 이를 통해 현재 조사가 진행 중인지, 혹은 처리가 완료되었는지
    등의 최신 상태를 조회합니다.

    4. 조회된 결과를 바탕으로 고객에게 현재의 처리 단계와 진행 상황을 정중하게 안내합니다.


    만약 조사를 통해 해결이 어려운 복잡한 민원의 경우, 단계별 절차에 따라 책임자에게 에스컬레이션하십시오. 최종적으로 합의에 이르지 못한 분쟁은
    금융감독원 금융분쟁조정위원회를 통해 조정을 진행할 수 있음을 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: yunseul_bank
- id: 6edc4196-ef5c-5b99-b467-e50c475f37d0
  title: dispute_status 도구 설명서
  body: '상담원은 `dispute_status` 도구를 사용하여 고객이 신청한 거래 이의 제기 또는 피해 구제의 현재 진행 상태를 조회합니다.
    이 작업은 상담원이 직접 도구를 호출하여 수행하며, 고객에게 별도의 외부 확인 방법을 안내하지 않습니다.


    `verify_identity`를 통한 본인 확인이 선행되어야 하며, 도구 호출 시 비밀번호나 PIN 등 추가 인증 수단은 요구하지 않습니다.


    - **효과**: 접수된 분쟁 건의 현재 처리 상태(예: 접수 완료, 조사 중, 처리 완료, 지급정지 유지 등)를 반환합니다.

    - **인수**: 조회를 원하는 대상의 계좌 식별자(account_id) 또는 카드 식별자(card_id)가 필요합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
