- id: 3c0f6bbc-81a6-5849-8382-7c401e6a90bf
  title: '윤슬 정기예금: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 관련 법령을 엄격히 준수하여 고객님의 소중한 정보를 처리합니다.


    1. 개인정보 수집 및 이용 목적

    윤슬 정기예금의 계좌 개설, 금리 적용, 이자 지급, 그리고 예금자 보호를 위한 본인 확인 등 금융 서비스 제공을 위해 필요한 최소한의 정보를
    수집합니다. 특히 계좌 개설 시에는 금융실명법에 따라 실명 확인 절차를 반드시 수행합니다.


    2. 처리하는 개인정보 항목

    성함, 생년월일, 연락처, 주소 등 서비스 제공에 필수적인 정보를 처리하며, 법령에서 허용하는 경우에 한하여 주민등록번호를 처리합니다.


    3. 정보의 보유 및 이용 기간

    수집된 개인정보는 금융거래 관계가 유지되는 동안 보유하며, 거래 종료 후에는 관련 법령(상법, 국세기본법 등)이 정한 보존 기간 동안 안전하게
    보관한 후 파기합니다.


    4. 고객의 권리

    고객님은 언제든지 본인의 개인정보에 대한 조회, 수정, 삭제를 요청하실 수 있습니다. 관련 요청은 영업점 방문이나 고객센터를 통해 가능하며,
    정당한 사유 없이 거절되지 않습니다.'
