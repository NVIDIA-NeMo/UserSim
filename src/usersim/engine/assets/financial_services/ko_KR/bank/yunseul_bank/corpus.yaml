- id: 3fc11e77-d29f-578f-b2c8-c1b08b2c88bf
  title: '윤슬 정기예금: 약관 변경 안내'
  body: '윤슬 정기예금의 이용 약관 변경 사항을 안내드립니다. 본 상품은 금융소비자 보호에 관한 법률 및 관련 법령을 준수하며, 고객님의 권리와
    의무를 명확히 규정합니다.


    1. 예금자 보호 및 책임

    본 상품은 예금자보호법에 따라 예금보험공사를 통해 보호됩니다. 예금자 1인당 원금과 소정의 이자를 합해 최고 1억원까지 보호되며, 이를 초과하는
    금액은 보호 대상에서 제외됩니다.


    2. 이자 지급 및 원천징수

    약정된 금리에 따라 이자가 계산되며, 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수된 후 지급됩니다. 또한, 이자와 배당을
    합한 금융소득이 연 2,000만원을 초과할 경우 타 소득과 합산하여 종합과세 대상이 됩니다.


    3. 계약의 해지 및 변경

    고객님은 만기 전 언제든지 예금을 해지하실 수 있으나, 이 경우 중도해지이율이 적용되어 약정 금리보다 낮은 이율을 적용받게 됩니다.


    약관의 주요 내용은 영업점 방문 및 인터넷 뱅킹을 통해 상시 확인하실 수 있으며, 변경 사항은 시행 전 고지 절차를 통해 안내드립니다.'
  domain: retail_banking
