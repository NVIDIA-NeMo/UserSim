- id: 30eb9b2b-6a4d-54c1-8521-d1f6f795bc80
  title: '윤슬 직장인 신용대출: 위험 안내'
  body: '본 상품 이용 전 다음의 위험 및 유의사항을 반드시 확인하십시오.


    1. 신용등급 영향: 대출 실행 및 상환 지연은 고객님의 개인 신용점수에 영향을 줄 수 있습니다. 연체 발생 시 금융거래 제한 및 채권 추심
    절차가 진행될 수 있으니 유의하십시오.


    2. DSR 규제 적용: 대출 총액이 1억원을 초과하는 경우, 금융감독원의 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행권 DSR 기준인
    연소득의 40%를 초과할 수 없으며, 한도 산정 시 스트레스 금리가 반영되어 예상보다 한도가 낮아질 수 있습니다.


    3. 금리 변동 위험: 적용 금리는 연 4.7%에서 연 6.5% 사이에서 결정되며, 향후 시장 금리 상황이나 고객님의 신용 상태 변화에 따라
    변동될 수 있습니다.


    4. 법정 최고금리: 어떠한 경우에도 법정 최고금리인 연 20%를 초과하는 금리는 적용되지 않습니다.


    윤슬은행은 금융소비자 보호에 관한 법률을 준수하며, 고객님께 가장 적합한 상품을 안내하기 위해 성실히 노력하겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: disclosure
  source_authority: official
