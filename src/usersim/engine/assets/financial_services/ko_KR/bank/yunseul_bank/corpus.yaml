  mentions_tools: []
  institution_id: yunseul_bank
- id: 167f9f24-7be5-5e22-9685-e0edadf2b8b4
  title: '윤슬 직장인 신용대출: 등록 정보 변경'
  body: '대출 계약 시 등록하신 연락처, 주소 등 고객 정보를 변경하는 방법입니다.


    [준비 사항]

    - 본인 확인을 위한 성함과 생년월일

    - 변경하고자 하는 최신 정보 (예: 새로운 전화번호, 변경된 주소지)


    [변경 단계]

    1. 상담원에게 등록 정보 변경을 요청하십시오.

    2. 본인 확인을 위해 성함과 생년월일을 말씀해 주십시오. (비밀번호나 주민등록번호 전체는 요구하지 않습니다.)

    3. 변경이 필요한 항목(주소, 연락처 등)과 새로운 정보를 정확히 알려주십시오.

    4. 상담원이 변경 내용을 시스템에 반영한 후, 최종 변경된 정보를 다시 한번 확인해 드립니다.

    5. 변경 완료 안내 메시지를 수신하시면 모든 절차가 마무리됩니다.'
  domain: lending_mortgage
