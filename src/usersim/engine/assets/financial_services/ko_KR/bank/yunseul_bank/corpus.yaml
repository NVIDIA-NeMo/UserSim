  institution_id: yunseul_bank
- id: 862c15c0-d9e6-5eaf-a045-3c946bddbe91
  title: '윤슬 입출금통장: 입출금통장 금리 안내'
  body: 'Q: 윤슬 입출금통장의 적용 금리는 어떻게 되나요?


    A: 윤슬 입출금통장의 입출금통장 금리는 0.1%가 적용됩니다. 이는 예치금액에 대해 지급되는 기본 금리입니다.


    Q: 이자 지급 시 세금이 부과되나요?


    A: 네, 그렇습니다. 이자 소득이 발생하면 관련 법령에 따라 소득세와 지방소득세를 합해 15.4%가 원천징수된 후 지급됩니다. 구체적인 세율과
    과세 기준은 ''법령·제도 안내: 예금·일상 거래''를 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3db936ce-1de0-5724-8749-50e1c4e814f1
  title: '윤슬 입출금통장: 가입과 이용 시작'
  body: '윤슬 입출금통장 가입을 위해 다음 절차를 진행하십시오. 본 상품은 실명 확인이 완료된 개인 고객님을 대상으로 합니다.


    1. 상담원에게 윤슬 입출금통장 개설을 요청하십시오.

    2. 본인 확인을 위해 성함과 생년월일을 말씀해 주십시오. (비밀번호, 주민등록번호 전체, PIN 등 추가 정보는 요구하지 않습니다.)

    3. 금융실명법에 따른 실명 확인 절차를 거쳐 가입 대상 여부를 확인하십시오.

    4. 계좌 개설에 동의하시고, 초기 입금 금액을 설정하여 입금하십시오.

    5. 계좌 개설이 완료되면 계좌 번호와 함께 통장 또는 체크카드 발급 여부를 안내받으실 수 있습니다.


    가입 후 모바일 및 인터넷 뱅킹을 이용하시면 다른 은행으로의 이체 수수료를 0원으로 이용하실 수 있습니다. 수수료에 대한 상세 내용은 ''윤슬
    입출금통장: 수수료 안내''를 참조하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 4a65882c-c657-5478-a877-61d89f2fb21a
  title: '윤슬 입출금통장: 수수료 안내'
  body: '윤슬 입출금통장의 서비스 이용 수수료는 다음과 같습니다. 고객님의 편의를 위해 디지털 채널 이용 수수료는 면제하고 있습니다.


    - 다른 은행으로 이체 수수료(모바일·인터넷뱅킹): 0원

    - 영업시간 외 ATM 출금 수수료: 500원

    - 통장·카드 재발급 수수료: 2,000원


    ※ 실물 운영 비용이 발생하는 재발급 및 시간 외 ATM 서비스에는 합리적인 수수료가 부과됩니다.'
