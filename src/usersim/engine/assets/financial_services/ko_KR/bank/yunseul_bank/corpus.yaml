- id: 8a6f832c-d480-5a48-9dfb-ea259fbe3848
  title: '윤슬 직장인 신용대출: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객에게 윤슬 직장인 신용대출의 한도 및 제한 사항을 안내하기 위한 지침입니다. 안내 시 다음의 핵심 수치와 규정을
    정확히 전달하십시오.


    1. 대출 한도 및 금리

    - 이용한도 최고액: 100,000,000원

    - 대출 금리(연, 하한): 4.7%

    - 대출 금리(연, 상한): 6.5%

    ※ 금리는 고객의 신용점수와 소득 수준에 따라 차등 적용됩니다.


    2. 주요 제한 사항 및 규제

    - DSR(총부채원리금상환비율) 규제: 대출 총액이 1억원을 초과하는 차주에게는 DSR 규제가 적용됩니다. 시중은행 기준 연간 원리금 상환액이
    연소득의 40%를 넘지 않아야 하며, 한도 산정 시 스트레스 금리가 반영됩니다.

    - 중도상환수수료: 대출 기간 중 원금을 상환할 경우 중도상환수수료율 0.1%가 적용됩니다.


    3. 주의사항

    - 상담원은 대출 승인을 확약해서는 안 되며, 심사 결과에 따라 한도와 금리가 변동될 수 있음을 명시하십시오.

    - 총상환액을 축소하여 안내하는 행위는 엄격히 금지됩니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 969c39e9-83f0-5fa1-ac58-be150236d782
  title: '윤슬 직장인 신용대출: 중도상환수수료율 안내'
  body: 'Q: 대출 기간이 끝나기 전에 원금을 미리 갚으려고 합니다. 이때 발생하는 수수료는 얼마인가요?


    A: 윤슬 직장인 신용대출의 중도상환수수료율은 0.1%입니다. 대출 약정 기간이 만료되기 전 원금의 일부 또는 전부를 상환하실 때 해당 요율이
    적용됩니다.


    더 자세한 비용 관련 내용은 ''윤슬 직장인 신용대출: 수수료 안내''에서 확인하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 29cf3624-00ea-556a-86e7-581c7d5182c8
  title: '윤슬 직장인 신용대출: 진행 상황과 내역 확인'
  body: '현재 이용 중이신 윤슬 직장인 신용대출의 상환 내역이나 대출 진행 상황을 확인하는 방법입니다.


    1. 본인 확인 단계: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 보안을 위해 비밀번호나 주민등록번호 전체는 요구하지 않습니다.

    2. 조회 대상 지정: 확인을 원하시는 대출 계좌 번호를 말씀하시거나, 현재 보유하신 신용대출 내역 조회를 요청하십시오.

    3. 정보 확인: 상담원이 현재의 대출 잔액, 적용 금리, 다음 이자 납입일 및 상환 회차 등 상세 내역을 안내해 드립니다.

    4. 결과 확인: 안내받은 내역이 실제 입금/출금 기록과 일치하는지 확인하십시오.


    만약 안내받은 내역 중 실제 거래와 다른 부분이 있다면 즉시 상담원에게 말씀해 주시기 바랍니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 49d4c8a8-3b56-5e3d-9e07-e2c49e7df150
  title: '윤슬 직장인 신용대출: 거래가 거절되거나 제한되었을 때'
  body: '대출 신청이나 한도 증액 요청이 거절된 경우, 다음과 같은 원인이 있을 수 있습니다.


    - 예상되는 원인

    1. DSR(총부채원리금상환비율) 초과: 은행권 대출의 경우 연간 원리금 상환액이 연소득의 40%를 초과하면 추가 대출이 제한됩니다. 특히
    최근 스트레스 금리가 반영되어 한도가 줄어들었을 수 있습니다.

    2. 신용점수 하락: 내부 심사 기준 또는 외부 신용평가사의 점수가 하락하여 대출 승인 요건을 충족하지 못한 경우입니다.

    3. 소득 증빙 부족: 직장인 신용대출의 특성상 최신 소득 증빙 서류가 제출되지 않았거나 소득이 기준치 미달일 때 발생합니다.


    - 해결 방법

    1. 현재 보유하신 타 금융기관의 대출 잔액을 확인하시고, 상환 가능한 대출이 있는지 검토하십시오.

    2. 신용점수 개선을 위해 연체 기록을 정리하고 신용 관리 서비스를 이용하십시오.


    - 후속 조치

    위 방법으로도 해결이 어렵거나 상환 능력이 부족하여 고통을 겪고 계신 고객님께는 채무조정 제도를 안내해 드리겠습니다. 상담원에게 관련 제도
    안내를 요청하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 76aa684f-78f9-547b-bc9a-7e60d1c5ca3d
  title: '윤슬 직장인 신용대출: 전환이나 상위 상품을 고려할 때'
  body: '고객이 현재의 신용대출을 타 상품으로 전환하거나 상위 상품으로 갈아타기를 원하는 경우, 다음 기준에 따라 안내하십시오.


    1. 목적 기반 전환

    - 자금의 용도가 주택 구입이며 장기적인 안정성이 필요한 경우: ''윤슬 주택담보대출: 상품 개요'' 상품으로의 전환을 추천합니다. 신용대출보다
    한도가 높고 기간이 길어 상환 부담을 낮출 수 있습니다.

    - 단기 자금 운용이 목적이며 빠른 실행이 필요한 경우: 현재의 윤슬 직장인 신용대출(최대 100,000,000원, 연 4.7%~6.5%)이
    가장 적합합니다.


    2. 신용 상태 변화

    - 승진, 소득 증가 등으로 신용 상태가 개선된 경우: 상품 전환보다는 ''금리인하요구권'' 행사를 통해 현재 대출의 금리를 낮추는 것이 비용
    면에서 더 유리할 수 있음을 안내하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: f54254eb-f969-5b03-82d6-c4a0989d4ade
  title: '윤슬 직장인 신용대출: 다른 상품과의 비교와 맞지 않는 경우'
  body: '윤슬 직장인 신용대출은 직장인의 신용과 소득을 바탕으로 신속하게 자금을 마련할 수 있는 상품입니다. 하지만 고객의 상황에 따라 더
    적합한 상품이 있을 수 있으므로 다음 내용을 참고하십시오.


    - 이런 분께 추천합니다

    - 급여 수령 중인 직장인으로서 갑작스러운 생활 자금이나 전세 자금이 필요하신 분

    - 복잡한 담보 설정 없이 신속하게 최대 100,000,000원까지 대출을 받고 싶으신 분

    - 연 4.7%에서 6.5% 사이의 합리적인 금리를 원하시는 분


    - 이런 분께는 맞지 않습니다

    - 주택 구입을 위해 수억 원대의 고액 자금을 장기간 조달하려는 분: 이 경우 ''윤슬 주택담보대출: 상품 개요'' 상품이 훨씬 유리합니다.

    - 소득 증빙이 어렵거나 직장 재직 기간이 매우 짧아 신용대출 승인이 어려운 분: 이 경우에는 담보 기반 상품이나 다른 금융 지원 상품을 검토하셔야
    합니다.


    본 상품은 직장인 전용 상품으로, 소득 및 신용도에 따라 최종 금리와 한도가 결정됩니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
