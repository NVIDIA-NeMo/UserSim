- id: 94803313-aeea-5a94-b0c2-5aeee9a2aadd
  title: '윤슬 체크카드: 상품 고르는 방법'
  body: '금융 상품을 선택하실 때 가장 중요한 것은 비용 효율성과 실질적인 혜택입니다. 일반적인 체크카드와 윤슬 체크카드를 비교해 보십시오.


    일반적인 체크카드는 일부 상품에서 연회비가 발생하거나 캐시백 혜택이 제한적일 수 있습니다. 반면, 윤슬 체크카드는 연회비가 0원으로 운영되어
    유지 비용이 전혀 없으며, 이용 금액의 0.3%라는 명확한 캐시백 비율을 제공하여 실질적인 가계 보탬이 됩니다.


    또한 하루 이용한도를 6,000,000원까지 넉넉하게 설정할 수 있어 고액 결제가 필요한 상황에서도 유연하게 대처할 수 있습니다.


    비용 부담 없이 안정적으로 자산을 관리하며 소소한 혜택을 누리고 싶은 고객님께 윤슬 체크카드를 강력히 추천합니다.'
  domain: cards
  product_category: yunseul_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 48944270-2d7c-5d93-9bf1-2e3967e2a12a
  title: '윤슬 체크카드: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 관련 법령을 엄격히 준수하여 고객님의 소중한 정보를 처리하고 있습니다.


    1. 수집 및 이용 목적: 고객님의 성함, 연락처, 주소 등은 카드 발급, 결제 처리, 한도 관리 및 본인 확인을 위해 수집됩니다.


    2. 주민등록번호 처리: 주민등록번호는 금융실명법 및 관련 법령이 허용하는 경우에만 최소한으로 처리하며, 그 외에는 생년월일 등으로 대체하여
    관리합니다.


    3. 정보의 보호: 수집된 개인정보는 암호화되어 안전하게 보관되며, 승인되지 않은 제3자에게 제공되지 않습니다. 다만, 법령에 따른 정당한
    요구가 있을 경우에 한해 제한적으로 제공될 수 있습니다.


    4. 고객의 권리: 고객님께서는 언제든지 본인의 개인정보에 대한 조회, 수정 및 삭제를 요청하실 수 있으며, 윤슬은행은 이에 대해 지체 없이
    조치하겠습니다.


    상세한 법령 안내는 ''법령·제도 안내: 체크카드''를 참고하시기 바랍니다.'
