- id: 4c4ecd1d-8681-517b-be41-c48cbec7dd38
  title: '윤슬 정기예금: 추천·장기 이용 혜택'
  body: 윤슬은행에서 소중한 자산을 안전하게 증식시키십시오. 윤슬 정기예금은 최소 가입 금액 100,000원부터 시작하여 안정적인 자산 관리를
    돕습니다. 특히 1년 정기예금 금리 3.4%의 높은 수익률을 통해 단기 목돈 마련의 기회를 제공하며, 장기 예치를 통해 확정 금리의 혜택을
    누리실 수 있습니다. 신뢰할 수 있는 시중은행의 전문성과 함께 귀하의 금융 미래를 설계하시기 바랍니다.
