- id: 4caee96a-2908-5296-aa87-f6f6b8b6fd2c
  title: '윤슬 직장인 신용대출: 추천·장기 이용 혜택'
  body: '윤슬은행을 아껴주시는 고객님께 감사드립니다. 신뢰와 전문성을 바탕으로 더 큰 혜택을 드리고자 ''동료 추천 및 장기 이용 고객 감사
    이벤트''를 진행합니다.


    - 기간: 2025년 6월 1일부터 2025년 8월 31일까지

    - 추천 혜택: 본 상품을 지인에게 추천하여 신규 가입이 완료될 경우, 추천인과 피추천인 모두에게 각각 20,000원의 모바일 상품권을 증정합니다.

    - 장기 이용 혜택: 3년 이상 성실하게 원리금을 상환하신 고객님께는 금리인하요구권 행사 시 우선 심사 혜택을 제공합니다.


    자세한 내용은 영업점 방문 또는 고객센터를 통해 확인해 주시기 바랍니다.'
