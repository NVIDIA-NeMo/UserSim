- id: 05bde6ca-cbcb-56fd-911d-9f1745116093
  title: '윤슬 직장인 신용대출: 가입과 이용 시작'
  body: '윤슬 직장인 신용대출의 신청부터 실행까지의 절차를 안내해 드립니다.


    [준비 사항]

    - 본인 확인을 위한 성함과 생년월일

    - 소득 증빙 서류(재직증명서, 근로소득원천징수영수증 등)

    - 신분증


    [이용 단계]

    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오. 비밀번호나 주민등록번호 전체는 요구하지 않습니다.

    2. 대출 상담 및 한도 조회: 희망 대출 금액을 말씀하시면, 고객님의 신용도와 소득을 바탕으로 이용한도 최고액 100,000,000원 범위
    내에서 가능한 한도를 조회해 드립니다.

    3. 서류 제출 및 심사: 안내받으신 소득 증빙 서류를 제출하십시오. 당행의 심사 기준에 따라 금리(연 4.7% ~ 6.5%)가 결정됩니다.

    4. 계약 체결 및 실행: 결정된 금리와 한도를 확인하신 후 대출 계약서에 서명하십시오. 계약이 완료되면 지정하신 계좌로 대출금이 입금됩니다.


    대출 실행 후 14일 이내에는 청약 철회가 가능하오니, 상세 내용은 ''윤슬 직장인 신용대출: 상품설명서 주요 내용''을 통해 확인하십시오.'
  domain: lending_mortgage
