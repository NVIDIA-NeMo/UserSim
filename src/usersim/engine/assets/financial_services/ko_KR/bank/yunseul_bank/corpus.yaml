- id: 5fffc006-1369-51f2-8467-2b988049804e
  title: '윤슬 직장인 신용대출: 상품 개요'
  body: '윤슬 직장인 신용대출은 직장인의 신용과 소득을 바탕으로 신속하게 자금을 마련하는 신용 대출 상품입니다. 복잡한 담보 설정 없이 고객님의
    신용도를 통해 필요한 자금을 효율적으로 운용하실 수 있도록 설계되었습니다.


    [상품 주요 내용]

    - 대출 금리(연, 하한): 4.7%

    - 대출 금리(연, 상한): 6.5%

    - 이용한도 최고액: 100,000,000원

    - 중도상환수수료율: 0.1%


    본 상품은 안정적인 소득 증빙이 가능한 직장인 고객님께 최적화되어 있으며, 심사 결과에 따라 개인별 한도와 금리가 차등 적용됩니다. 특히 신용
    상태가 개선되었을 때 금리를 낮춰달라고 요청할 수 있는 금리인하요구권을 행사하실 수 있어 더욱 합리적인 금융 이용이 가능합니다.


    상세한 금리 적용 방식은 ''윤슬 직장인 신용대출: 금리·요율 안내''에서 확인하시기 바랍니다.'
