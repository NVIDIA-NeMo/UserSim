  institution_id: yunseul_bank
- id: 55c808fe-6ab9-5314-9151-0223adbe85d7
  title: '윤슬 정기예금: 해지·변경·상품 전환'
  body: '윤슬 정기예금의 해지 및 변경 절차를 안내해 드립니다.


    [상품 해지 절차]

    1. 상담원에게 정기예금 해지를 요청하십시오.

    2. 본인 확인을 위해 고객님의 성함과 생년월일을 말씀해 주십시오.

    3. 상담원이 현재 시점의 중도해지이율과 예상 수령액(세후 이자 포함)을 안내해 드립니다. 만기 전 해지 시 약정 금리보다 낮은 이율이 적용됨을
    확인하십시오.

    4. 해지 의사를 최종 확인하시면, 원금과 이자가 연결된 입출금 계좌로 즉시 입금됩니다.


    [상품 변경 및 전환]

    - 가입 기간 변경이나 상품 전환은 원칙적으로 기존 계약 해지 후 재가입 절차를 통해 가능합니다. 전환 시 적용되는 금리는 가입 시점의 최신
    금리를 따릅니다.


    관련된 세부 조건은 ''윤슬 정기예금: 약관''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: how_to_guide
