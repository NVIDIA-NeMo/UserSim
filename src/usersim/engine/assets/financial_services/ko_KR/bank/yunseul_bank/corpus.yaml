  institution_id: yunseul_bank
- id: 32a0c1da-3686-576d-a9b6-78fb672f7de5
  title: '윤슬 정기적금: 자주 하는 업무의 처리 절차'
  body: '윤슬 정기적금의 월 납입 금액을 변경하는 절차는 다음과 같습니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 변경 요청: 현재 가입 중인 윤슬 정기적금 계좌의 월 납입 금액을 변경하고 싶다고 요청하십시오.

    3. 금액 설정: 변경하고자 하는 금액을 말씀해 주십시오. 이때 금액은 월 최소 10,000원 이상, 월 최대 1,000,000원 이하여야
    합니다.

    4. 변경 내용 확인: 상담원이 요청하신 금액으로 변경되었음을 확인해 드리며, 다음 납입일부터 해당 금액이 적용됨을 안내해 드립니다.


    납입 금액 변경을 통해 고객님의 월 소득 변화에 맞춘 유연한 자산 관리가 가능합니다. 만약 납입 금액을 낮추어 연체를 방지하시거나, 여유 자금을
    더 적립하여 목돈 마련 기간을 단축하시길 권장합니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: c4e13952-2cc9-5bd3-8f40-4591004077dd
  title: '윤슬 정기적금: 명세서나 내역과 맞지 않을 때'
  body: '고객님께서 확인하신 적금 명세서의 금액이나 이자가 예상과 다를 때, 상담원은 다음 사항을 순차적으로 확인하여 안내하십시오.


    1. 원천징수 세액 확인

    적금 만기 시 지급되는 이자는 세전 금액이 아닙니다. 이자 소득세와 지방소득세를 합해 15.4%가 원천징수된 후의 세후 금액이 지급되므로,
    이 점이 반영되었는지 확인하십시오.


    2. 중도해지 여부 확인

    만기 전 해지된 계좌의 경우, 약정 금리인 3.6%(12개월 기준)가 아닌 중도해지이율이 적용되어 이자가 크게 낮아질 수 있습니다. 해지 시점과
    적용 이율을 대조하십시오.


    3. 금융소득 종합과세 대상 확인

    해당 연도의 이자와 배당 소득 합계가 2,000만원을 초과하여 종합과세 대상으로 분류되었는지 확인하십시오.


    4. 납입 누락 및 입금 시점 확인

    자동이체 설정 오류나 잔액 부족으로 인해 특정 회차의 납입이 누락되었는지, 또는 입금일이 늦어져 만기일이 변동되었는지 확인하십시오.


    위 사항을 모두 점검했음에도 불구하고 금액 불일치가 해결되지 않는 경우, 상담원은 즉시 해당 내역을 캡처하거나 기록하여 책임자에게 에스컬레이션하고,
    정밀 정산 조사를 통해 고객님께 최종 결과를 안내해 드려야 합니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 037417e9-460f-5c33-9b22-51fc6214d219
  title: '윤슬 체크카드: 상품 개요'
  body: '윤슬 체크카드는 연결된 계좌의 잔액 범위 내에서 편리하게 결제하고, 소득공제 혜택까지 챙길 수 있는 실속형 체크카드입니다. 과도한
    소비를 방지하고 합리적인 지출 관리를 원하는 고객님께 최적화된 상품입니다.


    본 상품의 핵심 혜택과 이용 한도는 다음과 같습니다. 우선 고객님의 부담을 덜어드리기 위해 연회비는 0원으로 운영하고 있습니다. 또한, 결제
    금액의 0.3%가 캐시백으로 제공되어 사용할수록 혜택이 쌓이는 구조입니다.


    안정적인 금융 거래를 위해 하루 이용한도(기본 설정)는 6,000,000원으로 설정되어 있으며, 고객님의 필요에 따라 조정이 가능합니다. 해외에서도
    편리하게 이용하실 수 있도록 국제 브랜드 서비스가 제공되며, 해외 이용 시 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 각각 적용됩니다.


    윤슬 체크카드를 이용하시려면 반드시 윤슬은행의 입출금 계좌가 필요합니다. 계좌 개설 및 상세 내용은 ''윤슬 입출금통장: 상품 개요''를 참고해
    주십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e13aca5a-710d-5b20-b665-947b4129cc42
  title: '윤슬 체크카드: 연회비 안내'
  body: '문: 윤슬 체크카드를 발급받아 이용하려면 매년 연회비를 내야 합니까?

    답: 아닙니다. 윤슬 체크카드는 고객님의 경제적 부담을 줄이고 실속 있는 금융 생활을 지원하기 위해 연회비를 0원으로 운영하고 있습니다. 별도의
    연회비 청구 없이 언제나 무료로 이용하십시오.


    문: 연회비가 0원이라면 추가적인 유지 비용이 발생하지 않습니까?

    답: 네, 그렇습니다. 본 상품은 연회비가 전혀 없는 상품으로, 카드 유지와 관련하여 정기적으로 부과되는 비용은 없습니다. 다만, 해외 이용
    시에는 별도의 수수료가 발생할 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 9d5622b7-08a6-5487-81fb-f2a293cf0fc5
  title: '윤슬 체크카드: 가입과 이용 시작'
  body: '윤슬 체크카드의 가입부터 첫 결제까지의 과정을 안내해 드립니다. 본 카드는 연결될 입출금 계좌가 있어야 발급 가능하므로, 계좌가 없는
    고객님은 먼저 계좌 개설을 진행해 주십시오.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 카드 신청 절차가 시작됩니다.

    2. 연결 계좌 확인: 카드로 사용하실 윤슬은행 입출금 계좌의 유효성을 확인합니다. 계좌 잔액 범위 내에서만 결제가 가능하다는 점을 안내받으십시오.

    3. 카드 신청 및 옵션 선택: 카드 발급을 요청하시고, 필요하신 경우 하루 이용한도(기본 설정 6,000,000원)의 변경 여부를 결정하십시오.

    4. 카드 수령 및 등록: 신청하신 주소로 배송된 실물 카드를 수령하신 후, 사용 등록 절차를 거치십시오.

    5. 이용 시작: 가맹점에서 카드를 사용하십시오. 결제 즉시 연결 계좌에서 대금이 출금되며, 0.3%의 캐시백 혜택이 적용됩니다.


    카드의 분실이나 도난 시에는 즉시 신고하여 사용을 정지하셔야 합니다. 자세한 신고 절차는 ''윤슬 체크카드: 부정사용으로부터 고객을 보호하기
    위해''를 참고하십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 4da6ea55-4626-5945-967b-e723cc5f58a6
  title: '윤슬 체크카드: 수수료 안내'
  body: '윤슬 체크카드의 수수료 체계는 다음과 같습니다. 고객님의 이용 환경에 따라 적용되는 항목을 확인하십시오.


    - 연회비: 0원

    - 해외 이용 시 국제브랜드 수수료율: 1%

    - 해외 이용 시 해외서비스 수수료율: 0.2%


    국내 가맹점 이용 시에는 별도의 이용 수수료가 부과되지 않으며, 해외 이용 시에만 위와 같은 요율이 적용됩니다.'
  domain: cards
  product_category: yunseul_check
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e9b9c1c4-01ab-546e-a05f-825c029b2f57
  title: '윤슬 체크카드: 처리가 끝나지 않거나 보류 중일 때'
  body: '카드 결제 후 승인 내역이 즉시 반영되지 않거나 ''처리 중(Pending)'' 상태로 보류되어 있는 경우, 다음 순서에 따라 확인해
    주십시오.


    1. 계좌 잔액 확인: 결제 시점에 연결된 입출금 계좌의 잔액이 충분했는지 확인하십시오. 체크카드는 잔액을 초과하여 사용할 수 없으므로, 잔액
    부족 시 승인이 보류되거나 거절될 수 있습니다.

    2. 네트워크 상태 확인: 결제 당시 통신 환경의 일시적인 오류로 인해 승인 정보 전달이 지연될 수 있습니다. 잠시 후 다시 내역을 조회해
    보십시오.

    3. 가맹점 승인 여부 확인: 가맹점에서 결제 완료 메시지가 정상적으로 출력되었는지 확인하십시오.


    위 사항을 확인했음에도 불구하고 결제 상태가 계속 보류 중이라면, 상담원에게 요청하여 거래 상태 조회를 신청하십시오. 저희가 내부 시스템을
    통해 승인 경로를 추적하고, 필요한 경우 가맹점 및 카드사 네트워크 팀에 조사를 의뢰하는 케이스를 접수하겠습니다. 처리 결과는 영업일 기준
    3~5일 이내에 안내해 드리겠습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3b55a3bf-408b-5e0c-a230-b91b91165699
  title: '윤슬 체크카드: 가입 대상'
  body: '윤슬 체크카드 발급을 위한 자격 요건은 다음과 같습니다.


    - 윤슬은행 입출금 계좌 보유 여부: 필수 (보유 시 발급 가능)

    - 실명 확인 완료 여부: 필수 (금융실명법에 따른 확인 완료 시 발급 가능)

    - 연령 조건: 만 12세 이상 (법정대리인 동의 시 발급 가능, 만 17세 이상부터 단독 신청 가능)

    - 신용 상태: 제한 없음 (신용도와 관계없이 계좌 잔액 범위 내 이용 가능)'
  domain: cards
  product_category: yunseul_check
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: c3d3d9a3-16e2-53e3-a679-48b492945e4d
  title: '윤슬 체크카드: 당사의 비슷한 상품과의 비교'
  body: '윤슬 체크카드는 신용카드와 달리 연결된 계좌에서 즉시 출금되는 방식으로, 계획적인 소비를 지향하는 분들께 적합합니다.


    | 구분 | 윤슬 체크카드 | 일반 신용카드 |

    | :--- | :--- | :--- |

    | 결제 방식 | 계좌 잔액 내 즉시 출금 | 신용 한도 내 후불 결제 |

    | 연회비 | 0원 | 상품별 상이 (유료) |

    | 소득공제율 | 30% (총급여 25% 초과분) | 15% (총급여 25% 초과분) |

    | 이용 한도 | 계좌 잔액 (최대 6,000,000원/일) | 부여된 신용 한도 |


    연회비 부담 없이 실속 있게 이용하며 높은 소득공제 혜택을 누리고 싶으신 분께는 윤슬 체크카드를 추천드립니다. 반면, 일시적인 자금 융통이나
    고액의 할부 결제가 필요하신 분께는 신용 상품이 더 유리할 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: acc19233-ce3e-5ff3-8518-dd751f3d3825
  title: '윤슬 체크카드: 상품설명서 주요 내용'
  body: '본 상품은 금융소비자 보호에 관한 법률 및 관련 법령을 준수하여 운영됩니다. 고객님께서는 다음의 주요 사항을 반드시 숙지하시기 바랍니다.


    첫째, 이용 한도 및 결제 원칙입니다. 윤슬 체크카드는 사용하는 즉시 연결된 예금계좌에서 대금이 출금되므로 계좌 잔액을 넘어 사용할 수 없습니다.
    하루 이용한도(기본 설정)는 6,000,000원이며, 이를 초과하는 결제는 승인되지 않습니다.


    둘째, 세제 혜택 안내입니다. 체크카드 사용액은 연말정산 시 총급여의 25%를 넘는 부분에 대해 30%의 소득공제율이 적용됩니다. 이는 신용카드의
    공제율(15%)보다 높은 수준입니다.


    셋째, 비용 및 수수료입니다. 본 카드의 연회비는 0원입니다. 다만, 해외 이용 시에는 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가
    합산되어 부과됩니다.


    넷째, 사고 보고 의무입니다. 카드를 분실하거나 도난당한 즉시 은행에 신고하여 사용을 정지하십시오. 비밀번호를 타인에게 알려주는 등 고객의
    고의 또는 중대한 과실이 있는 경우 부정사용 보상이 제한될 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 6da1d61f-4a8c-5d65-959d-d334bc316884
  title: '윤슬 체크카드: 금리·요율 안내'
  body: '윤슬 체크카드에 적용되는 주요 요율 및 캐시백 비율을 안내해 드립니다.


    1. 캐시백 비율: 0.3%

    결제 시 대상 가맹점에서 사용한 금액의 0.3%가 고객님의 연결 계좌로 캐시백됩니다. (단, 제외 가맹점이 있을 수 있습니다.)


    2. 해외 이용 수수료율

    - 국제브랜드 수수료율: 1%

    - 해외서비스 수수료율: 0.2%

    해외 가맹점에서 결제 시 위 두 가지 요율이 각각 합산되어 적용됩니다.


    3. 연회비 요율: 0원

    모든 고객님께 동일하게 적용되며, 조건 없이 무료로 이용하실 수 있습니다.'
