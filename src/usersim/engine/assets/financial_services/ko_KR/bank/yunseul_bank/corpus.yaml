- id: 75af74e9-b40e-56b4-9aea-77d32242b87c
  title: '윤슬 주택담보대출: 등록 정보 변경'
  body: '대출 계약 시 등록하신 주소, 연락처 등 고객 정보를 변경하는 절차를 안내드립니다.


    1. 정보 변경 요청: 상담원에게 변경하고자 하는 등록 정보(예: 연락처, 주소 등)를 말씀해 주십시오.

    2. 본인 확인: 안전한 정보 변경을 위해 고객님의 성함과 생년월일을 말씀해 주십시오. 비밀번호나 주민등록번호 전체는 요구하지 않습니다.

    3. 변경 내용 확인: 상담원이 현재 등록된 정보와 변경될 내용을 대조하여 확인합니다.

    4. 정보 업데이트 및 완료: 상담원이 시스템에 정보를 반영한 후, 변경 처리가 정상적으로 완료되었음을 안내해 드립니다.


    처리가 완료되면 등록된 연락처로 변경 안내 메시지가 발송됩니다.'
