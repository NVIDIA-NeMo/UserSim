- id: c44c4354-fd96-5196-9727-8e1d5cca2e30
  title: '윤슬 주택담보대출: 변동금리 안내'
  body: 'Q: 윤슬 주택담보대출의 변동금리는 얼마이며 어떻게 적용되나요?


    A: 본 상품의 변동금리는 4.45%입니다. 변동금리는 시장 금리 상황에 따라 주기적으로 조정되며, 조정 시점에 따라 고객님께서 납부하실 이자
    금액이 변동될 수 있습니다.


    Q: 변동금리에서 고정금리로 변경이 가능한가요?


    A: 상품 가입 시 선택하신 금리 유형에 따라 변경 가능 여부가 달라집니다. 자세한 내용은 ''윤슬 주택담보대출: 금리·요율 안내''를 참고하시거나
    상담원에게 문의해 주시기 바랍니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: faq
