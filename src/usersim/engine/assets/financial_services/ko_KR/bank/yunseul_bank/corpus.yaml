  title: '윤슬 주택담보대출: 약관 변경 안내'
  body: '윤슬 주택담보대출의 이용 약관 중 중도상환 및 청약 철회와 관련된 주요 사항을 안내드립니다. 본 약관은 금융소비자 보호에 관한 법률
    및 관련 규정을 준수하여 적용됩니다.


    1. 청약 철회권: 고객님은 계약서류를 받은 날과 대출이 실행된 날 중 더 늦은 날로부터 14일 이내에 대출 청약을 철회하실 수 있습니다.
    이 경우 원금과 이용 기간 동안의 이자, 인지세 등 제3자에게 지급된 비용만 부담하며 중도상환수수료는 부과되지 않습니다.


    2. 중도상환수수료: 대출 실행 후 중도상환수수료를 받는 기간(대출일부터, 년) 3년 이내에 원금을 상환하실 경우, 중도상환수수료율 0.6%가
    적용됩니다. 단, 대출 실행일로부터 3년이 경과한 후에는 중도상환수수료가 부과되지 않습니다.


    해당 조건은 실제 운영 비용을 반영하여 합리적으로 책정되었으며, 고객님의 권익 보호를 위해 투명하게 운영됩니다.'
