  title: '윤슬 정기예금: 이용 조건별 차이'
  body: '| 이용 조건 | 적용 결과 및 기준 |

    | :--- | :--- |

    | 가입 가능 금액 | 최소 가입 금액 100,000원 이상 시 가입 가능 |

    | 예금자 보호 적용 | 예금보험공사를 통해 1인당 원금과 이자 합계 1억원까지 보호 |

    | 금융소득 종합과세 | 연간 이자 및 배당 소득 합계 2,000만원 초과 시 종합과세 대상 |

