- id: 3e8b7bf4-f491-56eb-9cf7-a7bcbc10d319
  title: '윤슬 정기예금: 이런 분께 알맞습니다'
  body: '윤슬 정기예금은 목돈을 안전하게 예치하여 확정된 금리로 자산을 증식하고자 하는 고객님께 가장 적합한 상품입니다.


    특히 다음과 같은 분들께 추천드립니다:

    - 원금 손실 없이 안정적인 자산 관리를 원하시는 분

    - 미래의 특정 시점에 사용할 자금을 계획적으로 마련하고 계신 분

    - 시장 금리 변동과 관계없이 확정된 수익을 확보하고 싶으신 분


    본 상품은 100,000원 이상의 최소 가입 금액으로 시작하실 수 있으며, 예치 기간에 따라 다음과 같은 경쟁력 있는 금리를 제공합니다:

    - 1년 정기예금 금리: 3.4%

    - 2년 정기예금 금리: 3.3%

    - 3년 정기예금 금리: 3.25%


    안정적인 자산 증식의 시작을 윤슬은행과 함께하십시오. 상세한 상품 개요는 ''윤슬 정기예금: 상품 개요''에서 확인하실 수 있습니다.'
