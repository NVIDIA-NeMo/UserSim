- id: d45f4921-786f-5fdb-920a-ecfee23dc7d0
  title: '윤슬 입출금통장: 이용 조건별 차이'
  body: '윤슬 입출금통장의 이용 상황별 적용 조건 및 비용 안내입니다.


    - 기본 금리 적용: 모든 가입 고객에게 입출금통장 금리 0.1% 적용

    - 모바일·인터넷 뱅킹 이체: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 적용

    - 영업시간 외 ATM 출금: 영업시간 외 ATM 출금 수수료 500원 부과

    - 실물 매체 재발급: 통장·카드 재발급 수수료 2,000원 부과


    상세한 가입 대상은 윤슬 입출금통장: 가입 대상을 확인하십시오.'
  domain: retail_banking
