- id: ba729b35-0f0c-53db-ab89-7a68285a4bec
  title: '윤슬 정기적금: 월 최소 납입액 안내'
  body: 'Q: 윤슬 정기적금에 가입하려면 매달 최소 얼마를 입금해야 하나요?

    A: 윤슬 정기적금의 월 최소 납입액은 10,000원입니다. 매월 10,000원 이상의 금액을 설정하여 적립하실 수 있습니다.


    Q: 월 납입액을 최소 금액보다 더 낮게 설정할 수 있나요?

    A: 죄송합니다. 본 상품은 안정적인 저축을 돕기 위해 월 최소 납입액 10,000원 기준을 두고 있으며, 이보다 낮은 금액으로는 납입이 불가능합니다.


    더 자세한 납입 한도 안내는 ''윤슬 정기적금: 상품 개요''를 참고해 주십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3fd66740-4d0a-5787-a0c1-b7b15ada3a51
  title: '윤슬 정기적금: 해지·변경·상품 전환'
  body: "윤슬 정기적금의 계약 내용을 변경하시거나 해지, 또는 다른 상품으로 전환하는 절차를 안내해 드립니다.\n\n1. 본인 확인: 상담원에게\
    \ 고객님의 성함과 생년월일을 말씀해 주십시오.\n2. 요청 사항 전달: 적금 계좌의 해지, 월 납입액 변경, 또는 다른 적금 상품으로의 전환\
    \ 중 원하시는 업무를 요청하십시오.\n3. 조건 확인: \n   - 해지 시: 만기 전 해지인 경우 약정 금리가 아닌 중도해지이율이 적용됨을\
    \ 안내받으시고 이에 동의하십시오.\n   - 변경 시: 변경하고자 하는 월 납입액이 10,000원 이상 1,000,000원 이하 범위 내에\
    \ 있는지 확인하십시오.\n4. 처리 완료 및 확인: 처리 결과(해지 금액 입금 확인 또는 변경된 계약 내용)를 안내받으시면 모든 절차가 완료됩니다.\n\
    \n만약 해지 후 다른 저축 상품을 찾으신다면 '윤슬 정기예금: 이런 분께 알맞습니다'를 통해 귀하에게 적합한 상품을 확인해 보시기 바랍니다."
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 85559083-87f8-58b0-bc12-703bb13a306d
  title: '윤슬 정기적금: 예상과 다른 수수료나 금액'
  body: '고객님께서 수령하신 적금 만기 금액이나 이자가 예상과 다를 때의 확인 및 처리 방법입니다.


    [증상: 예상보다 수령 이자가 적음]

    1. 중도 해지 여부 확인: 만기일 이전에 계좌를 해지하셨는지 확인하십시오. 만기 전 해지 시에는 약정 금리가 아닌 낮은 중도해지이율이 적용됩니다.

    2. 원천징수 세액 확인: 이자 소득에 대해 소득세와 지방소득세를 합해 15.4%가 자동으로 원천징수된 후 지급됩니다. 세전 금액과 세후 금액을
    구분하여 확인하십시오.

    3. 납입 회차 및 금액 확인: 매월 설정한 납입액이 정확히 입금되었는지, 미납된 회차가 있어 이자 계산에서 제외되지 않았는지 확인하십시오.


    [해결 및 에스컬레이션]

    위 사항을 확인했음에도 금액 차이가 발생한다면, 고객님의 거래 내역을 정밀 분석하여 정확한 계산 근거를 안내해 드리겠습니다. 만약 상담 단계에서
    해결이 어려운 복잡한 민원일 경우, 단계별 절차에 따라 책임자에게 에스컬레이션하여 재검토 후 최종 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: troubleshooting
  source_authority: official
