- id: 53a5b6dc-6531-5cc5-ae79-281222c8eb3b
  title: '윤슬 직장인 신용대출: 수수료와 비용'
  body: 'Q: 대출을 이용하면서 금리 외에 추가로 부담해야 하는 수수료가 있습니까?


    A: 윤슬 직장인 신용대출은 가입 시 별도의 취급 수수료나 관리 비용을 부과하지 않습니다. 다만, 대출 약정 기간 만료 전에 원금을 상환하시는
    경우에만 중도상환수수료율 0.1%가 적용됩니다.


    Q: 대출 한도를 늘릴 때 수수료가 발생하나요?


    A: 한도 증액 신청 시 별도의 수수료는 없으나, 심사 과정에서 신용 상태에 따라 금리가 재산정될 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 16684c5e-45e0-5696-a5da-ed137d244b5b
  title: '윤슬 직장인 신용대출: 자주 하는 업무의 처리 절차'
  body: '가장 요청이 많은 ''금리인하요구권'' 행사 절차를 안내해 드립니다. 취업, 승진, 소득 증가 등 신용 상태가 개선된 고객님은 금리
    인하를 요청하실 수 있습니다.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀하여 본인 인증을 완료하십시오.

    2. 금리 인하 요청: ''금리인하요구권''을 행사하고 싶다고 말씀하시고, 신용 상태가 개선된 사유(예: 승진, 연봉 인상 등)를 설명하십시오.

    3. 증빙 서류 제출: 재직증명서, 근로소득원천징수영수증 등 소득 및 신용 개선을 증명할 수 있는 서류를 제출하십시오.

    4. 심사 및 통보: 윤슬은행이 제출된 서류와 최신 신용도를 바탕으로 심사를 진행하며, 결과는 유선 또는 메시지로 안내해 드립니다.

    5. 금리 적용: 승인 시 변경된 낮은 금리가 다음 이자 납입일부터 즉시 적용됩니다.


    이 외에 대출금의 중도 상환이나 만기 연장 업무 역시 동일한 본인 확인 절차를 거쳐 상담원을 통해 처리하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 367cb6b1-eb32-539b-aff5-0451a074f09b
  title: '윤슬 직장인 신용대출: 명세서나 내역과 맞지 않을 때'
  body: '고객님이 확인하신 대출 명세서나 거래 내역이 실제와 다르다고 말씀하시는 경우, 상담원은 다음 순서에 따라 점검하십시오.


    - 확인 및 조치 단계

    1. 입금/출금 일자 대조: 원리금 상환일과 실제 계좌에서 출금된 날짜가 일치하는지 확인하십시오. 공휴일 등으로 인해 결제일이 변동되었는지
    점검하십시오.

    2. 금리 적용 시점 확인: 금리 변동 주기나 금리인하요구권 반영 시점이 명세서에 정확히 표기되었는지 확인하십시오.

    3. 중도상환수수료 계산: 원금을 중도에 상환한 적이 있다면 중도상환수수료율 0.1%가 정확히 계산되어 부과되었는지 재검토하십시오.


    - 해결 및 에스컬레이션

    - 단순 계산 착오나 전산 오류인 경우, 즉시 내역을 수정하고 고객님께 사과와 함께 정정된 내역을 안내하십시오.

    - 고객님께서 결과에 동의하지 않으시거나 분쟁이 해결되지 않는 경우, 내부 책임자에게 에스컬레이션하여 정밀 조사를 진행하십시오.

    - 최종적으로 해결이 어려운 분쟁은 금융감독원 금융분쟁조정위원회를 통해 조정을 진행하실 수 있음을 안내하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
