- id: c06cf4e1-a6c3-523b-846a-061c04d698f4
  title: '윤슬 직장인 신용대출: 안전한 이용을 위한 수칙'
  body: '윤슬 직장인 신용대출을 이용하시는 고객님의 소중한 자산을 보호하기 위해 다음의 보안 수칙을 반드시 준수해 주십시오.


    1. 윤슬은행은 어떠한 경우에도 고객님께 비밀번호, 카드번호, CVV, PIN, 주민등록번호 전체 또는 추가 인증 수단을 전화나 문자로 요구하지
    않습니다. 이러한 요청을 받으셨다면 즉시 전화를 끊으십시오.

    2. 출처가 불분명한 링크(URL)가 포함된 문자 메시지는 클릭하지 마시고 즉시 삭제하십시오. 특히 ''저금리 대환대출''을 빙자한 사칭 문자에
    주의하시기 바랍니다.

    3. 대출 실행 후 본인이 신청하지 않은 자금 이동이나 알림 메시지를 확인하신 경우, 즉시 윤슬은행 고객센터로 연락하여 지급정지를 요청하십시오.


    금융사기 피해 발생 시 신속한 피해구제 신청을 통해 피해를 최소화하시기 바랍니다. 고객님의 안전한 금융 거래를 위해 최선을 다하겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
