- id: b64fdea6-7f18-5d9c-a45e-5bed32a436f8
  title: '윤슬 직장인 신용대출: 수수료 안내'
  body: '윤슬 직장인 신용대출 이용 시 발생하는 수수료 항목을 안내해 드립니다. 본 안내는 상담원 지원용 자료입니다.


    - 중도상환수수료율: 0.1%


    중도상환수수료는 대출 기간 중 원금을 미리 상환하실 때 발생하는 비용입니다. 단, 금융소비자 보호에 관한 법률 및 당행 약관에 따라 대출일부터
    3년이 경과한 경우에는 중도상환수수료를 부과하지 않습니다. 고객 안내 시 이 점을 명확히 고지하여 주십시오.'
  domain: lending_mortgage
