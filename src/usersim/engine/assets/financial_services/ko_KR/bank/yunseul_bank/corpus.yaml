    윤슬은행은 어떠한 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 전화나 문자로 요구하지 않습니다.
    만약 대출 관련 상담을 빙자하여 위와 같은 정보를 요구한다면 즉시 통화를 중단하시고 당행 고객센터로 신고하시기 바랍니다.


    보이스피싱 등 금융사기 피해가 의심되거나 발생한 경우, 즉시 지급정지와 피해구제 신청을 요청하십시오. 신속한 대응만이 고객님의 소중한 자산을
    보호하는 최선의 방법입니다. 안전한 금융 생활을 위해 항상 주의를 기울여 주시기 바랍니다.'
