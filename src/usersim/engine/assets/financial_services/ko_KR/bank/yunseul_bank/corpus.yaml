- id: 33c4cd4a-1f74-5bdf-a987-54e4143372e7
  title: '윤슬 정기적금: 등록 정보 변경'
  body: '윤슬 정기적금의 연락처나 알림 설정 등 등록 정보를 변경하는 방법입니다.


    [준비 사항]

    - 본인 확인을 위한 성함과 생년월일


    [변경 절차]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 저희가 본인 여부를 확인합니다.

    2. 변경 내용 요청: 변경을 원하시는 등록 정보(예: 전화번호, 주소, 알림 수신 방법 등)를 구체적으로 말씀해 주십시오.

    3. 정보 수정: 상담원이 요청하신 내용을 시스템에 반영합니다. 이 과정에서 비밀번호나 PIN 등은 절대 요구하지 않으니 주의하십시오.

    4. 변경 확인: 수정된 정보가 정확히 반영되었는지 상담원을 통해 최종 확인을 받으십시오.


    [완료 확인]

    정보 변경이 완료되면 등록된 연락처로 변경 완료 안내 메시지가 발송됩니다. 메시지를 수신하시면 정상적으로 처리가 완료된 것입니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: cf2c58b2-aea1-5923-ae9d-7cf5e2d339e0
  title: '윤슬 정기적금: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 인터넷 뱅킹을 통해 윤슬 정기적금 계좌에 접속하려 할 때 오류가 발생하는 경우의 해결 방법입니다.


    [증상]

    - 로그인 시 ''인증 정보가 일치하지 않습니다''라는 메시지가 나타남

    - 접속 중 화면이 멈추거나 빈 페이지가 출력됨


    [원인 및 체크리스트]

    1. 인증 정보 오류: 비밀번호를 여러 번 잘못 입력하여 계좌가 잠긴 경우입니다.

    2. 네트워크 불안정: 사용 중인 Wi-Fi 또는 데이터 연결 상태가 불안정한 경우입니다.

    3. 앱 버전 최신화 미비: 구버전 앱을 사용하여 보안 정책상 접속이 제한된 경우입니다.


    [해결 방법]

    - 비밀번호 재설정: 본인 확인(성함, 생년월일) 후 비밀번호 재설정 절차를 밟으십시오.

    - 네트워크 전환: Wi-Fi를 끄고 LTE/5G 데이터로 전환하여 다시 시도하십시오.

    - 앱 업데이트: 앱스토어 또는 구글 플레이에서 최신 버전으로 업데이트하십시오.


    [에스컬레이션]

    위 조치 후에도 접속이 불가한 경우, 저희가 전문 기술팀으로 사례를 이관하여 계정 상태를 정밀 진단하겠습니다. 진단 결과는 등록된 연락처로
    영업일 기준 1~3일 이내에 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: troubleshooting
  source_authority: official
