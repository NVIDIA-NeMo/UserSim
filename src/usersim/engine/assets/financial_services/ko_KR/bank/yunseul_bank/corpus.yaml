  mentions_tools: []
  institution_id: yunseul_bank
- id: 93b764d2-2026-5c68-969f-db8a418b278e
  title: '윤슬 정기적금: 필요 서류'
  body: '윤슬 정기적금 가입을 위해 필요한 서류 및 조건은 다음과 같습니다.


    - 실명 확인: 금융실명법에 따라 본인 확인이 가능한 신분증(주민등록증, 운전면허증, 여권 등) 원본이 필요합니다.

    - 가입 대상: 실명 확인이 완료된 개인 및 직장인 고객

    - 계좌 연결: 적금 납입을 위한 윤슬은행 입출금 계좌가 필요하며, 없는 경우 ''윤슬 입출금통장: 가입과 이용 시작'' 절차에 따라 먼저
    개설하시기 바랍니다.'
