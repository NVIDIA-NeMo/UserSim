- id: 744b155f-c5a2-56c0-b0d8-fd62e185fb00
  title: '윤슬 주택담보대출: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 인터넷 뱅킹을 통해 대출 내역을 확인하려 할 때 접속이 되지 않는 경우 다음과 같이 조치하시기 바랍니다.


    [증상: 로그인 실패 또는 대출 메뉴 접속 불가]

    - 원인 1: 아이디 또는 비밀번호 오입력

    - 원인 2: 보안 매체(인증서 등)의 만료

    - 원인 3: 은행 시스템 정기 점검 시간


    [해결 방법]

    1. 입력 정보 확인: 대소문자 구분 및 키패드 입력 상태를 다시 한번 확인해 주십시오.

    2. 인증 수단 갱신: 이용 중인 공동인증서나 금융인증서의 유효기간이 만료되었는지 확인하고, 필요 시 갱신 절차를 진행하십시오.

    3. 점검 시간 확인: 당행 시스템 점검 시간(주로 일요일 새벽)인지 확인하십시오.


    위 조치 후에도 문제가 지속된다면 상담원에게 말씀해 주십시오. 저희가 고객님의 계정 상태를 즉시 확인하여 비밀번호 초기화나 인증 수단 재등록을
    도와드리겠습니다. 만약 시스템 오류로 판단될 경우 전산 담당 부서로 에스컬레이션하여 빠르게 해결해 드리겠습니다.'
