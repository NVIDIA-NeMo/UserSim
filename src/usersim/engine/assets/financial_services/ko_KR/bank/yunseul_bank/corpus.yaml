  mentions_tools: []
  institution_id: yunseul_bank
- id: 7c341563-96ca-52d1-804e-a7dc47920330
  title: '윤슬 정기예금: 필요 서류'
  body: '윤슬 정기예금 가입을 위해 필요한 서류는 다음과 같습니다.


    - 개인 고객: 본인 확인이 가능한 유효 신분증 (주민등록증, 운전면허증 등)

    - 법인 고객: 사업자등록증 원본, 대표자 신분증, 법인 인감증명서 및 법인 인감

    - 대리인 신청: 위임장(인감 날인), 위임자 인감증명서, 대리인 신분증


    모든 계좌 개설 시에는 금융실명법에 따라 실명 확인이 필수적으로 진행됩니다. 더 자세한 가입 대상 정보는 ''윤슬 정기예금: 가입 대상''에서
    확인하십시오.'
