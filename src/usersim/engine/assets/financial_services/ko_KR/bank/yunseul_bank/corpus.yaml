  institution_id: yunseul_bank
- id: 11ace7c9-20e5-57b8-943f-580ab70b8c70
  title: '윤슬 입출금통장: 추천·장기 이용 혜택'
  body: '윤슬은행과 함께 시작하시는 고객님을 위해 특별한 혜택을 안내해 드립니다. 2025년 1월 1일부터 2025년 6월 30일까지 윤슬
    입출금통장을 신규로 개설하시거나 장기 이용하시는 고객님께서는 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 혜택을 통해 더욱 편리하고
    경제적인 금융 생활을 누리실 수 있습니다.


    안정적인 자산 관리의 시작, 윤슬 입출금통장으로 스마트한 금융 습관을 만들어 보십시오. 자세한 내용은 윤슬 입출금통장: 상품 개요를 참고하시기
    바랍니다.'
