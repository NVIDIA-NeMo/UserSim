- id: 44405f7b-a80c-53d2-b234-7dfd998b20bc
  title: '윤슬 주택담보대출: 중도상환수수료를 받는 기간(대출일부터, 년) 안내'
  body: '**Q: 중도상환수수료는 언제까지 내야 하나요?**


    **A:** ''윤슬 주택담보대출''의 중도상환수수료는 대출 실행일로부터 3년까지 부과됩니다. 대출일로부터 3년이 경과한 후에는 원금을 상환하시더라도
    중도상환수수료가 발생하지 않습니다. 2025년 1월 13일 이후 체결된 계약의 경우, 관련 법령 및 약관에 따라 3년 이후에는 수수료를 부과하지
    않습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d5b0bde5-b93c-5617-8b83-c06a02c2d275
  title: '윤슬 주택담보대출: 자주 하는 업무의 처리 절차'
  body: '신용 상태 개선에 따른 ''금리인하요구권'' 행사 절차를 안내해 드립니다.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오.

    2. 권리 행사 요청: 취업, 승진, 소득 증가 또는 신용점수 상승 등 신용 상태가 개선되었음을 알리고 금리 인하를 요청하십시오.

    3. 증빙 서류 제출: 소득금액증명원, 재직증명서 등 신용 상태 개선을 증명할 수 있는 서류를 제출하십시오.

    4. 심사 및 결과 통보: 당행은 제출된 서류와 객관적인 신용 평가 기준을 바탕으로 금리 인하 가능 여부를 심사합니다. 심사 결과는 문자 메시지
    또는 유선으로 안내해 드립니다.

    5. 금리 반영: 인하가 결정되면 다음 이자 산정일부터 변경된 금리가 적용되며, 변경된 월 상환액을 안내받으실 수 있습니다.


    이 외에 대출 계약 후 14일 이내에 청약을 철회하고 싶으신 경우, 동일한 본인 확인 절차를 거쳐 철회 신청을 진행하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 5ce67591-6f3a-5959-9dc0-487860302e88
  title: '윤슬 주택담보대출: 명세서나 내역과 맞지 않을 때'
  body: '고객이 대출 잔액이나 청구된 이자 금액이 예상과 다르다고 요청하는 경우, 상담원은 다음 순서로 점검하십시오.


    **1단계: 금리 적용 시점 확인**

    - 변동금리(4.45%) 상품인 경우, 기준금리 변동 주기와 실제 반영일이 일치하는지 확인하십시오. 금리 변경 안내문이 발송되었는지 확인하고,
    변경된 금리가 적용된 시점의 이자 계산법을 설명하십시오.


    **2단계: 상환 처리 내역 대조**

    - 원리금 균등 상환 또는 원금 균등 상환 등 상환 방식에 따라 회차별 이자 금액이 달라집니다. 고객의 상환 스케줄표와 실제 출금 내역을 대조하여
    누락된 입금이나 중복 청구가 있는지 확인하십시오.


    **3단계: 중도상환수수료 계산 검토**

    - 대출 후 3년 이내에 일부 상환이 있었는지 확인하십시오. 0.6%의 중도상환수수료가 정확히 산정되어 부과되었는지 검토하십시오.


    **에스컬레이션:**

    계산상 오류가 발견되었거나 고객이 납득하지 못하는 경우, ''여신 사후관리팀''으로 해당 계좌의 정산 내역 재검토를 요청하십시오. 담당 부서에서
    재계산 후 결과가 나오면 고객에게 유선으로 정정 내역과 사과를 전달하십시오.'
