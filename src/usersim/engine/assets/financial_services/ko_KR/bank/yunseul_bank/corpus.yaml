- id: a71f6f19-8301-5360-91e2-5b525c00abb2
  title: '윤슬 정기적금: 처리가 끝나지 않거나 보류 중일 때'
  body: '적금 가입이나 납입 처리가 완료되지 않고 보류 중인 경우, 다음 사항을 확인해 주십시오.


    증상: 상품 가입 요청 후 ''처리 중'' 상태가 지속되거나 납입이 거절됨


    원인 및 확인 방법:

    1. 연결 계좌 잔액 부족: 적금으로 자동이체될 연결 입출금 계좌의 잔액이 설정하신 월 납입액(최소 10,000원 ~ 최대 1,000,000원)보다
    적은지 확인하십시오.

    2. 실명 확인 미완료: 계좌 개설 시 필요한 실명 확인 절차에서 정보 불일치가 발생했을 수 있습니다.

    3. 시스템 일시 오류: 일시적인 통신 장애로 인해 처리가 지연될 수 있습니다.


    해결 방법:

    - 연결 계좌의 잔액을 확인하고 부족 시 입금해 주십시오.

    - 본인의 성함과 생년월일이 정확하게 등록되어 있는지 다시 한번 확인해 주십시오.


    위 조치 후에도 문제가 해결되지 않을 경우, 저희가 내부 시스템 조회를 통해 원인을 파악하고 처리 결과를 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: troubleshooting
  source_authority: official
