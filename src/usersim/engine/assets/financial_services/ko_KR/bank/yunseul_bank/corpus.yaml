- id: 6e20bcc1-d366-5f0f-83d6-4aad138894b8
  title: open_time_deposit 사용 기준
  body: '목돈을 안전하게 예치하여 확정 금리로 자산을 증식하는 윤슬 정기예금 가입 절차입니다.


    1. **본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **자금 확인 및 계좌 조회**: `get_accounts` 도구를 사용하여 가입 자금이 들어있는 윤슬 입출금통장을 확인하십시오.

    3. **상품 조건 설정**: 고객으로부터 가입할 금액과 예치 기간을 안내받으십시오.

    4. **예금 개설**: `open_time_deposit` 도구를 호출하여 윤슬 입출금통장에서 해당 금액을 인출하여 윤슬 정기예금에 가입시키십시오.


    정기예금은 예금자보호법에 따라 예금보험공사를 통해 1인당 원금과 이자를 합해 1억원까지 보호됩니다. 가입 시 이자 소득에 대해 15.4%가
    원천징수됨을 고객에게 안내하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_time_deposit
  institution_id: yunseul_bank
- id: 57e65c66-9f9a-5927-8803-bdee1e7e9096
  title: open_time_deposit 도구 설명서
  body: "open_time_deposit 도구는 고객의 입출금통장에서 일정 금액을 인출하여 정해진 기간 동안 예치하는 윤슬 정기예금을 개설합니다.\n\
    \n- **시그니처**: `open_time_deposit(account_id: string, amount: number, period: string)`\n\
    - **인자**: \n    - `account_id`: 자금이 인출될 윤슬 입출금통장의 고유 식별자입니다.\n    - `amount`:\
    \ 예금에 예치할 금액입니다.\n    - `period`: 예치 기간(예: '1년', '2년')입니다.\n- **효과**: 지정된 계좌에서\
    \ 금액이 차감되며, 새로운 윤슬 정기예금 계좌가 생성됩니다.\n\n상담원은 `verify_identity`로 신원이 확인된 고객에 한해,\
    \ 확인된 `account_id`를 사용하여 이 도구를 직접 호출하십시오."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_time_deposit
  institution_id: yunseul_bank
- id: c922890b-3e7c-5588-a785-89789e291e06
  title: open_installment_savings 사용 기준
  body: '매월 일정 금액을 꾸준히 적립하여 목돈 마련을 돕는 윤슬 정기적금 가입 절차입니다.


    1. **본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **납입 계좌 조회**: `get_accounts` 도구를 사용하여 자동이체를 설정할 윤슬 입출금통장을 확인하십시오.

    3. **적립 조건 설정**: 고객으로부터 월 납입액과 적립 기간을 안내받으십시오.

    4. **적금 개설 및 자동이체 설정**: `open_installment_savings` 도구를 호출하여 윤슬 정기적금에 가입하고, 윤슬
    입출금통장에서의 자동이체를 동시에 설정하십시오.


    윤슬 정기적금은 예금자보호법에 따라 1인당 원금과 이자를 합해 1억원까지 보호됩니다. 이자 소득 발생 시 15.4%가 원천징수된다는 점을 명확히
    고지하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_installment_savings
  institution_id: yunseul_bank
- id: 42df4a83-d7d8-5ab6-a6de-da7204dc8fd7
  title: open_installment_savings 도구 설명서
  body: "open_installment_savings 도구는 고객이 설정한 월 납입액과 기간에 따라 윤슬 정기적금을 개설하고, 지정된 입출금통장에서\
    \ 자동이체가 이루어지도록 설정합니다.\n\n- **시그니처**: `open_installment_savings(account_id: string,\
    \ monthly_amount: number, period: string)`\n- **인자**: \n    - `account_id`: 자동이체\
    \ 원천 계좌인 윤슬 입출금통장의 고유 식별자입니다.\n    - `monthly_amount`: 매월 적립할 금액입니다.\n    - `period`:\
    \ 적립 기간(예: '12개월', '24개월')입니다.\n- **효과**: 새로운 윤슬 정기적금 계좌가 생성되며, 매월 지정된 날짜에 `account_id`에서\
    \ `monthly_amount`가 자동으로 이체됩니다.\n\n상담원은 `verify_identity`로 신원이 확인된 고객의 계좌 정보를\
    \ 바탕으로 이 도구를 직접 호출하십시오."
  domain: retail_banking
  product_category: procedure
