- id: 1ff1a6ed-c872-5593-a7b5-603db5d78380
  title: '윤슬 정기예금: 등록 정보 변경'
  body: '윤슬 정기예금 계좌에 등록된 고객님의 정보를 변경하는 방법입니다.


    [준비 사항]

    - 변경하고자 하는 정확한 정보(예: 연락처, 주소 등)


    [변경 단계]

    1. 본인 확인 절차: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호를 위해 반드시 필요한 절차입니다.

    2. 변경 내용 요청: 변경이 필요한 등록 정보의 항목과 새로운 내용을 구체적으로 말씀해 주십시오.

    3. 정보 수정 및 확인: 저희가 요청하신 내용을 시스템에 반영한 후, 변경된 정보가 정확한지 다시 한번 확인해 드립니다.

    4. 완료 통보: 정보 변경이 정상적으로 처리되었음을 안내받으시면 모든 절차가 완료됩니다.


    주의: 비밀번호, PIN, 주민등록번호 등은 보안상 상담원을 통해 변경하실 수 없으며, 정해진 보안 인증 절차를 통해서만 변경 가능합니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 7722015f-3ccb-5c51-ab4c-6571c46beea7
  title: '윤슬 정기예금: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 인터넷 뱅킹을 통해 윤슬 정기예금 계좌를 조회하려 할 때 접속이 되지 않는 경우 다음과 같이 조치하십시오.


    [증상 및 원인 확인]

    - 로그인 실패: 아이디 또는 비밀번호가 잘못 입력되었거나, 비밀번호 입력 횟수 초과로 인해 계정이 잠긴 경우입니다.

    - 접속 불가: 네트워크 연결 상태가 불안정하거나, 은행 시스템의 일시적인 점검 시간일 수 있습니다.


    [해결 방법]

    1. 입력 정보 확인: 대소문자 구분 등 비밀번호를 정확히 입력했는지 확인하십시오.

    2. 네트워크 상태 점검: Wi-Fi 또는 모바일 데이터 연결 상태를 확인한 후 다시 시도하십시오.

    3. 비밀번호 재설정: 비밀번호를 잊으신 경우, 본인 인증 절차를 거쳐 비밀번호를 재설정하십시오.


    [에스컬레이션]

    위의 방법으로도 해결되지 않거나 계정 잠금 해제가 필요한 경우, 저희에게 요청해 주십시오. 담당 부서에서 고객님의 신원을 확인한 후 계정 상태를
    점검하고 잠금을 해제하거나 기술적 오류를 해결해 드릴 것입니다. 조치 결과는 등록된 연락처로 안내해 드립니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: troubleshooting
  source_authority: official
