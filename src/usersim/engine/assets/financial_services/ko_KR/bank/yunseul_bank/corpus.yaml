  mentions_tools: []
  institution_id: yunseul_bank
- id: 27874b92-e854-5ff6-a33c-c309e46d480c
  title: '윤슬 직장인 신용대출: 이용한도 최고액 안내'
  body: '질문: 윤슬 직장인 신용대출로 최대한 얼마까지 빌릴 수 있습니까?

    답변: 본 상품의 이용한도 최고액은 100,000,000원입니다. 다만, 이는 최대치이며 실제 대출 가능 금액은 고객님의 연소득, 재직 기간,
    신용 점수 및 기존 부채 현황(DSR 규제 등)을 종합적으로 심사하여 결정됩니다.


    질문: 한도를 높이려면 어떻게 해야 합니까?

    답변: 한도는 은행의 심사 기준에 따라 결정되므로 임의로 조정할 수 없습니다. 다만, 승진이나 연봉 인상 등으로 소득 수준이 높아진 경우,
    증빙 서류를 제출하여 재심사를 요청하실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: faq
  source_authority: official
