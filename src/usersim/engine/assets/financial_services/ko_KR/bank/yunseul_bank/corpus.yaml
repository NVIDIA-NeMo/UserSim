- id: 1fa0999b-8ce9-5b2f-9144-f1fa08cedf00
  title: '윤슬 주택담보대출: 이용 조건별 차이'
  body: '상담원은 다음 기준에 따라 고객의 대출 가능 여부와 한도를 산정하십시오.


    | 구분 | 조건 | 적용 결과 |

    | :--- | :--- | :--- |

    | 대출 총액 | 1억원 이하 | 일반 대출 심사 기준 적용 |

    | 대출 총액 | 1억원 초과 | DSR(총부채원리금상환비율) 규제 적용 (연소득의 40% 이내) |

    | 금리 적용 | 변동금리 선택 | 4.45% 적용 (시장 금리 변동에 따라 주기적 변경) |

    | 금리 적용 | 5년 혼합형 선택 | 4.65% 적용 (5년간 고정금리 후 변동금리 전환) |

    | 신용 상태 개선 | 취업, 승진, 소득 증가 등 | 금리인하요구권 행사 가능 |


    ※ 모든 한도 산정 시에는 향후 금리 상승 위험을 반영한 스트레스 금리를 더하여 계산해야 합니다.'
