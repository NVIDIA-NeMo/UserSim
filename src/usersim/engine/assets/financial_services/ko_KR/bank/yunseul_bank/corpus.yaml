- id: f58ed15b-5676-55e2-ba50-11a99f806f63
  title: '윤슬 정기예금: 가입과 이용 시작'
  body: '윤슬 정기예금에 가입하여 자산 관리를 시작하는 절차를 안내해 드립니다.


    [준비 사항]

    - 실명 확인이 가능한 신분증(영업점 방문 시)

    - 가입하고자 하는 최소 100,000원 이상의 예치 자금


    [가입 단계]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 상품 설계: 예치하실 금액과 가입 기간(1년, 2년, 3년 중 선택)을 결정하여 알려 주십시오. 기간에 따라 3.4%, 3.3%, 3.25%의
    금리가 차등 적용됩니다.

    3. 실명 확인 및 계좌 연결: 금융실명법에 따라 실명 확인 절차를 거치며, 예치금을 인출할 윤슬은행 입출금 계좌를 연결합니다.

    4. 가입 완료 및 확인: 상품 가입 내용을 최종 확인하신 후 서명 또는 인증을 완료하십시오. 가입이 완료되면 즉시 예금 계좌 번호와 만기
    예정일이 안내됩니다.


    가입 후 계좌 상태나 내역을 확인하고 싶으시다면 ''윤슬 정기예금: 진행 상황과 내역 확인''을 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: how_to_guide
