- id: ef1e3883-970a-586a-ab93-0baabb134fae
  title: '윤슬 정기예금: 한도·제한과 유의사항'
  body: '윤슬 정기예금 가입 및 운영 시 적용되는 주요 한도와 제한 사항입니다. 상담 시 고객님께 정확히 안내하시기 바랍니다.


    1. 가입 금액 제한

    - 최소 가입 금액: 100,000원부터 가입이 가능합니다.


    2. 적용 금리 (기간별)

    - 1년 정기예금 금리: 3.4%

    - 2년 정기예금 금리: 3.3%

    - 3년 정기예금 금리: 3.25%


    3. 주요 유의사항

    - 중도 해지: 만기 전에 계좌를 해지할 경우, 약정 금리가 아닌 중도해지이율이 적용되어 이자 수익이 감소할 수 있습니다.

    - 세금 징수: 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 금융소득이 연 2,000만원을 초과하는 경우 종합과세
    대상이 됩니다.

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 0c4f6db1-6842-549f-afec-b6669b45b293
  title: '윤슬 정기예금: 최소 가입 금액 안내'
  body: 'Q: 윤슬 정기예금에 가입하려면 최소 얼마의 금액이 필요한가요?


    A: 윤슬 정기예금의 최소 가입 금액은 100,000원입니다. 이 금액 이상의 예치금을 준비하시어 가입을 신청해 주시기 바랍니다.


    Q: 100,000원 미만의 금액으로는 가입이 불가능한가요?


    A: 네, 그렇습니다. 본 상품은 최소 100,000원부터 가입이 가능하도록 설계되어 있습니다. 소액 적립을 원하시는 경우에는 윤슬 정기적금
    상품을 검토해 보시는 것을 추천드립니다.


    더 자세한 내용은 ''윤슬 정기예금: 상품 개요''에서 확인하실 수 있습니다.'
