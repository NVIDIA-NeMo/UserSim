- id: d4a90c7e-6489-5ea6-b6b5-4b655a77a784
  title: '윤슬 주택담보대출: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산을 보호하기 위해 보안을 최우선으로 합니다. 특히 윤슬 주택담보대출과 같은 고액 대출 상품을 사칭한
    보이스피싱 및 금융사기 피해가 발생하지 않도록 각별한 주의를 당부드립니다.


    윤슬은행의 상담원은 어떠한 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다.
    계좌 정보 조회나 대출 상태 변경 등 본인 확인이 필요한 경우에는 오직 고객님의 성함과 생년월일만을 확인합니다. 만약 상담원이 위와 같은 민감한
    정보를 요구한다면 즉시 통화를 종료하시고 은행에 신고해 주십시오.


    금융사기 피해가 의심되거나 발생한 경우에는 즉시 당사 고객센터나 영업점을 통해 지급정지와 피해구제 신청을 진행하여 피해를 최소화하시기 바랍니다.
    모든 개인정보는 개인정보 보호법에 따라 엄격히 처리되며, 주민등록번호는 법령이 허용하는 경우에만 제한적으로 처리하고 있습니다.'
  domain: lending_mortgage
