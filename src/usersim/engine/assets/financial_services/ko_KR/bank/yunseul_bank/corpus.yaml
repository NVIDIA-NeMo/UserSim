- id: cc87c297-390f-5c8f-b0ee-e0a71a8974cc
  title: '윤슬 정기예금: 당사의 비슷한 상품과의 비교'
  body: '윤슬은행의 대표적인 저축 상품인 ''윤슬 정기예금''과 ''윤슬 정기적금''을 비교해 드립니다.


    | 구분 | 윤슬 정기예금 | 윤슬 정기적금 |

    | :--- | :--- | :--- |

    | 자금 운용 방식 | 목돈을 한 번에 예치 | 매월 일정 금액을 적립 |

    | 금리 적용 | 가입 시 확정 금리 (1년 기준 3.4%) | 적립 기간별 약정 금리 적용 |

    | 최소 가입 조건 | 100,000원 이상 일시 납입 | 매월 일정액 꾸준히 납입 |

    | 추천 대상 | 이미 보유한 목돈을 안전하게 굴리고 싶은 분 | 매월 소득의 일부를 저축해 목돈을 만들고 싶은 분 |


    목돈의 안정적인 증식이 목적이라면 윤슬 정기예금이 더 유리하며, 체계적인 저축 습관을 통해 자산을 형성하시려면 ''윤슬 정기적금: 상품 개요''를
    확인해 보시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: ef970952-8d17-50ac-b5a3-56f82db08801
  title: '윤슬 정기예금: 상품설명서 주요 내용'
  body: '윤슬 정기예금 가입 전 반드시 확인하셔야 할 주요 고지 사항입니다.


    [이자 과세 및 세금]

    - 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.

    - 이자와 배당을 합산한 금융소득이 연 2,000만원을 초과하는 경우, 다른 소득과 합산하여 종합과세 대상이 됩니다.


    [예금자 보호 안내]

    - 본 상품은 예금보험공사를 통해 보호됩니다. 예금자 1인당 원금과 이자를 합해 최고 1억원까지 보호되며, 금융회사별로 적용됩니다.


    [중도 해지 및 유의사항]

    - 만기 전 계좌를 해지하실 경우, 약정 금리가 아닌 중도해지이율이 적용되어 수령하시는 이자가 대폭 감소할 수 있습니다.

    - 본 상품은 원금이 보장되는 예금 상품으로, 실적에 따라 수익이 변동되는 투자 상품과는 엄격히 구분됩니다.


    상세 내용은 상품 설명서 및 약관을 통해 확인하시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 9f1e731c-bd4f-544a-952c-eee12b80df11
  title: '윤슬 정기예금: 금리·요율 안내'
  body: '윤슬 정기예금의 기간별 적용 금리를 안내해 드립니다. 본 상품은 가입 시 선택하신 기간에 따라 확정 금리가 적용됩니다.


    [기간별 정기예금 금리]

    - 1년 만기 시: 3.4%

    - 2년 만기 시: 3.3%

    - 3년 만기 시: 3.25%


    [금리 적용 원칙]

    - 적용 금리는 가입일 당시의 고시 금리를 기준으로 하며, 만기 시까지 변동 없이 유지되는 확정 금리형 상품입니다.

    - 모든 금리는 연이율 기준이며, 단리 방식으로 계산됩니다.

    - 중도 해지 시에는 가입 기간 및 해지 시점의 은행 기준에 따라 약정 금리보다 낮은 중도해지이율이 적용됩니다.'
  domain: retail_banking
