- id: b1ca1b3e-fc48-5eec-8e19-95907fcaf633
  title: '윤슬 정기예금: 처리가 끝나지 않거나 보류 중일 때'
  body: '정기예금 가입 신청 후 계좌 개설이 완료되지 않았거나 ''보류 중'' 상태로 표시되는 경우 다음과 같이 조치하시기 바랍니다.


    [발생 가능한 원인]

    - 실명 확인 서류의 식별 불가 또는 정보 불일치

    - 가입 금액이 최소 가입 금액인 100,000원 미만으로 설정됨

    - 시스템 일시적 오류로 인한 전산 처리 지연


    [확인 및 해결 방법]

    1. 가입 정보 확인: 신청하신 금액이 100,000원 이상인지 다시 한번 확인하십시오.

    2. 본인 인증 재확인: 상담원에게 성함과 생년월일을 말씀하시어 현재 심사 단계에서 보완이 필요한 서류가 있는지 확인하십시오.

    3. 상태 업데이트 요청: 시스템 지연인 경우, 상담원이 즉시 전산 상태를 갱신하여 처리 결과를 안내해 드립니다.


    [에스컬레이션]

    상기 조치 후에도 문제가 해결되지 않거나 보류 사유가 불분명한 경우, 상담원이 책임자에게 해당 건을 에스컬레이션하여 정밀 조사를 진행하며,
    결과는 영업일 기준 3일 이내에 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 13db83a6-5d73-5d5d-bc98-8974dcedf1e4
  title: '윤슬 정기예금: 가입 대상'
  body: '윤슬 정기예금 가입을 위한 조건 및 결과는 다음과 같습니다.


    - 실명 확인 여부: 금융실명법에 따라 실명이 확인된 고객 → 가입 가능

    - 최소 가입 금액: 100,000원 이상 예치 → 가입 가능

    - 최소 가입 금액 미달: 100,000원 미만 예치 → 가입 불가

    - 거주 및 신분 조건: 제한 없음 (개인 고객 대상) → 가입 가능'
