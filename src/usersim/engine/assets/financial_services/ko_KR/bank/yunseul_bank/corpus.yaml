- id: 851da219-2fc1-58b5-80a5-feb87eace690
  title: '윤슬 직장인 신용대출: 금리·요율이 정해지는 방식과 적용'
  body: "윤슬 직장인 신용대출의 금리와 요율 적용 방식은 다음과 같습니다.\n\n- 대출 금리 범위: 연 4.7%(하한) ~ 연 6.5%(상한)\n\
    - 결정 방식: 고객님의 신용점수, 연간 소득, 재직 기간, 기존 부채 현황 등을 종합적으로 심사하여 결정합니다. 신용 상태가 우수할수록 하한\
    \ 금리인 4.7%에 가까운 금리를 적용받으실 수 있습니다.\n- 중도상환수수료율: 0.1%\n  - 상환 시점에 원금 잔액에 해당 요율을\
    \ 곱하여 산출합니다.\n  - 단, 대출 실행일로부터 3년이 경과한 후에는 수수료가 면제됩니다.\n- 금리 조정: 대출 이용 중 소득 증가나\
    \ 신용점수 상승 등 신용 상태가 개선된 경우, '금리인하요구권'을 통해 금리 인하를 신청하실 수 있습니다. 이는 객관적인 증빙 자료를 바탕으로\
    \ 심사하여 적용됩니다."
