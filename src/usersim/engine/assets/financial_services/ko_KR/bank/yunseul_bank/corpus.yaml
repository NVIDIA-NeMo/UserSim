- id: d76a8c82-e15a-54e9-84fc-f258c783b85f
  title: '윤슬 주택담보대출: 필요 서류'
  body: '| 구분 | 필요 서류 | 비고 |

    | :--- | :--- | :--- |

    | 본인 확인 | 주민등록증, 운전면허증 등 정부 발행 신분증 | 실명 확인 필수 |

    | 소득 증빙 | 근로소득원천징수영수증 또는 소득금액증명원 | DSR 산정을 위한 연소득 확인용 |

    | 재직 증빙 | 재직증명서 또는 건강보험자격득실확인서 | 직장인 고객 대상 |

    | 담보 확인 | 등기사항전부증명서, 매매계약서 또는 분양계약서 | 담보 가치 평가용 |

    | 기타 | 주민등록등본 및 가족관계증명서 | 세대원 확인 및 조건 적용 시 필요 |'
