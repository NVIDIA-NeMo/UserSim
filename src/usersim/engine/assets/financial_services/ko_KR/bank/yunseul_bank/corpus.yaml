- id: 9d1de199-ede9-57fb-ab3a-bcd95fad0940
  title: '윤슬 직장인 신용대출: 진행 중인 이벤트'
  body: '[신규 고객 우대 금리 혜택 안내]


    윤슬은행을 처음 이용하시는 직장인 고객님을 위해 특별 금리 혜택 이벤트를 진행합니다.


