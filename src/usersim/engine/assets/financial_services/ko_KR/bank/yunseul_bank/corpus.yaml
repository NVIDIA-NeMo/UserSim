- id: 147f6a87-5e2e-5289-a563-e1d95e3eec7b
  title: '윤슬 체크카드: 하루 이용한도(기본 설정) 안내'
  body: '문: 윤슬 체크카드로 하루에 최대 얼마까지 결제할 수 있습니까?


    답: 윤슬 체크카드의 하루 이용한도(기본 설정)는 6,000,000원입니다. 다만, 체크카드의 특성상 연결된 계좌의 잔액 범위 내에서만 결제가
    가능하므로, 한도가 6,000,000원이라 하더라도 계좌 잔액이 그보다 적다면 잔액까지만 이용하실 수 있습니다.


    더 자세한 한도 설정 및 변경 방법은 ''윤슬 체크카드: 한도·제한과 유의사항''에서 확인하십시오.'
  domain: cards
  product_category: yunseul_check
