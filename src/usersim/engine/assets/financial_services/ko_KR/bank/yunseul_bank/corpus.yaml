- id: bf21e9c5-a432-5d26-862a-16990b5f0114
  title: '윤슬 정기예금: 진행 중인 이벤트'
  body: '윤슬은행을 이용해 주시는 고객님을 위해 ''목돈 마련 응원 이벤트''를 진행합니다.


    [이벤트 기간]

    - 2026년 1월 1일부터 2026년 3월 31일까지


    [대상 및 혜택]

    - 대상: 기간 내 윤슬 정기예금에 신규 가입하신 고객님

    - 조건: 1년 정기예금(금리 3.4%)에 1,000만원 이상 예치 시

    - 혜택: 가입 고객 선착순 5,000분께 모바일 상품권 10,000원권 증정


    [유의사항]

    - 본 이벤트는 예산 소진 시 조기에 종료될 수 있습니다.

    - 혜택은 가입 후 만기 유지 또는 일정 기간 유지 조건에 따라 지급될 수 있으며, 상세 내용은 영업점 및 앱에서 확인하십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
