- id: 550ea273-d2fd-5432-8220-7f9b84ae2290
  title: '윤슬 체크카드: 안전한 이용을 위한 수칙'
  body: '고객님의 소중한 자산을 보호하기 위해 윤슬 체크카드 이용 시 다음의 보안 수칙을 반드시 준수하여 주십시오.


    먼저, 윤슬은행은 어떠한 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다. 만약
    이러한 정보를 요구하는 전화나 문자를 받으신다면 이는 보이스피싱 등 금융사기일 가능성이 매우 높으므로 즉시 중단하십시오.


    카드를 분실하거나 도난당한 것을 알게 되신 경우에는 즉시 저희 은행에 신고하여 사용 정지 처리를 하셔야 합니다. 신고 전후의 부정사용 보상은
    관련 법령과 약관에 따르며, 비밀번호를 타인에게 알려주는 등 고객님께 고의나 중대한 과실이 있는 경우에는 보상이 제한될 수 있음을 유의하십시오.


    상담원을 통해 계좌 정보를 조회하거나 변경하실 때는 반드시 고객님의 성함과 생년월일을 통해 본인 확인 절차를 거치게 됩니다. 안전한 금융 거래를
    위해 고객님의 적극적인 협조를 부탁드립니다.'
  domain: cards
  product_category: yunseul_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: f28a6a36-f61c-5fa4-8da1-4b8a6b8df2a2
  title: '윤슬 체크카드: 약관 변경 안내'
  body: '윤슬 체크카드의 서비스 품질 향상과 효율적인 운영을 위해 다음과 같이 약관 및 이용 조건이 적용됨을 안내드립니다.


    1. 비용 및 수수료: 본 상품의 연회비는 0원으로 설정되어 고객님의 부담을 최소화하였습니다. 다만, 실물 카드 재발급 시에는 합리적인 수준의
    수수료가 부과됩니다.


    2. 이용 한도 및 제한: 카드의 기본 하루 이용한도는 6,000,000원으로 설정되어 있습니다. 체크카드의 특성상 연결된 예금계좌의 잔액
    범위 내에서만 사용 가능하며, 잔액을 초과하여 결제할 수 없습니다.


    3. 해외 이용 요금: 해외 가맹점 이용 시 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 각각 합산되어 청구됩니다.


    4. 계약의 종료 및 변경: 은행은 관련 법령의 변경이나 내부 정책의 변화가 있을 때 약관을 변경할 수 있으며, 이 경우 사전에 고지합니다.
    고객님께서는 변경된 내용에 동의하지 않으실 경우 계약을 해지하실 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: terms_conditions
  source_authority: official
