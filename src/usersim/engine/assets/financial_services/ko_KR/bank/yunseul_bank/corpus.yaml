  institution_id: yunseul_bank
- id: 53d69170-f82b-56cd-baa2-f3cec7333b9c
  title: activate_card 사용 기준
  body: '고객이 새로 발급받은 윤슬 체크카드의 사용 등록을 요청하는 경우 다음 절차를 따르십시오.


    1. verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. get_accounts 도구를 호출하여 고객이 보유한 카드 목록을 조회하고, 등록 대상인 윤슬 체크카드의 card_id를 식별하십시오.

    3. 해당 카드가 현재 ''미등록'' 또는 ''대기'' 상태인지 확인하십시오.

    4. 식별된 card_id를 사용하여 activate_card 도구를 호출하여 카드 사용 등록을 완료하십시오.


    등록이 완료되면 즉시 온·오프라인 가맹점에서 사용이 가능함을 안내하십시오. 만약 카드 수령 전 분실 등의 사유로 재발급이 필요한 경우에는 ''order_replacement_card
    사용 기준'' 절차를 안내하시기 바랍니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: yunseul_bank
- id: c7a15727-02c1-5473-9807-607e349d43b7
  title: activate_card 도구 설명서
  body: "activate_card 도구는 발급된 윤슬 체크카드를 실제 사용 가능한 상태로 등록하는 기능을 수행합니다. 상담원은 이 도구를 직접\
    \ 호출하여 등록 처리를 완료합니다.\n\n- 인자:\n  - card_id: 사용 등록을 수행할 체크카드의 고유 식별자\n\n본 도구를 호출하기\
    \ 전, 반드시 verify_identity를 통해 고객의 신원을 확인해야 하며, get_accounts를 통해 올바른 card_id를 확보해야\
    \ 합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: yunseul_bank
- id: 94beb822-a109-57d5-9529-bf076e7985a3
  title: order_replacement_card 사용 기준
  body: '고객이 현금카드나 윤슬 체크카드의 훼손, 분실, 도난으로 인해 재발급을 요청하는 경우 다음 절차를 수행하십시오.


    1. verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. 분실 또는 도난의 경우, 우선 freeze_card 도구를 사용하여 해당 카드의 사용을 즉시 정지시키십시오.

    3. get_accounts 도구를 통해 재발급 대상인 카드 또는 연결된 계좌의 ID를 확인하십시오.

    4. order_replacement_card 도구를 호출하여 재발급 신청을 접수하십시오.


    재발급 시 실물 카드 제작 및 배송 비용 등 합리적인 수수료가 부과될 수 있음을 안내하십시오. 구체적인 수수료 금액은 ''윤슬 입출금통장:
    통장·카드 재발급 수수료 안내''에서 확인 가능합니다. 신청 후 카드는 영업일 기준 수일 내에 등록된 주소지로 배송됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: yunseul_bank
- id: 1c3950a1-44b7-50aa-bfd1-873011b26304
  title: order_replacement_card 도구 설명서
  body: "order_replacement_card 도구는 분실, 도난 또는 훼손된 현금카드나 윤슬 체크카드의 재발급을 신청하는 기능을 수행합니다.\
    \ 상담원은 이 도구를 직접 호출하여 접수합니다.\n\n- 인자:\n  - account_id: 카드가 연결된 계좌의 고유 식별자 (또는 card_id)\n\
    \  - reason: 재발급 사유 (분실, 도난, 훼손 중 선택)\n  - card_type: 재발급할 카드의 종류\n\n본 도구를 호출하기\
    \ 전 verify_identity를 통해 신원을 확인하고, 분실/도난 건의 경우 freeze_card 도구로 먼저 사용 정지 처리를 완료해야\
    \ 합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: yunseul_bank
- id: 09bfc93f-5372-5c91-8f72-bfdd81893f55
  title: get_accounts 사용 기준
  body: '고객의 계좌 정보 조회, 상태 변경 또는 특정 상품 서비스 제공을 위해 계좌 식별이 필요한 경우 다음 절차를 따르십시오.


    1. verify_identity 도구를 호출하여 고객의 성함과 생년월일을 통해 본인 확인을 수행하십시오. 본인 확인 전에는 어떠한 계좌 정보도
    제공해서는 안 됩니다.

    2. 본인 확인이 완료되면 get_accounts 도구를 호출하십시오. 이 도구는 고객이 보유한 모든 계좌의 ID(account_id), 상품
    유형, 계좌번호 끝 4자리, 잔액, 계좌 상태 및 연결된 카드 ID(card_id) 목록을 반환합니다.

    3. 고객이 특정 계좌에 대해 문의하는 경우, 고객이 제시한 계좌번호 끝 4자리와 도구의 반환 값을 대조하여 정확한 account_id를 특정하십시오.


    상담원은 이 과정을 통해 확보한 account_id를 다른 서비스 도구의 인자로 사용하며, 고객에게 전체 계좌번호를 요구하거나 직접 입력하게
    하지 마십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: yunseul_bank
- id: baa65668-c757-59b4-84e0-8144bbe906cc
  title: get_accounts 도구 설명서
  body: 'get_accounts 도구는 본인 확인이 완료된 고객이 보유한 모든 계좌와 카드 목록을 조회하는 기능을 수행합니다.


    - **기능**: 검증된 고객의 계좌 정보(계좌 ID, 계좌 유형, 계좌번호 끝 4자리, 잔액, 상태) 및 보유 카드 ID 목록을 반환합니다.

    - **사용 방법**: 상담원은 별도의 인자 값 없이 이 도구를 직접 호출하여 고객의 계좌 및 카드 정보를 확인합니다.

    - **주의 사항**: 본 도구는 `verify_identity`를 통해 고객의 신원이 확인된 이후에만 호출할 수 있으며, 고객이 제시한 계좌번호
    끝 4자리를 통해 정확한 account_id를 식별하는 용도로 사용하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: yunseul_bank
- id: d77b0a09-e557-544f-8276-ea5b135340c2
  title: open_account 사용 기준
  body: '윤슬은행의 계좌 개설 절차는 금융실명법에 따른 실명 확인과 본인 인증을 엄격히 준수하여 진행됩니다. 상담원은 다음 단계에 따라 계좌
    개설 업무를 처리하십시오.


    1. **고객 본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **실명 확인 절차 안내**: 금융실명법에 따라 계좌 개설 시 실명 확인이 필수임을 안내하고, 필요한 신분증 확인 절차를 거칩니다.

    3. **계좌 개설 실행**: 본인 확인 및 실명 확인이 완료되면 `open_account` 도구를 호출하여 계좌 개설을 완료하십시오.


    계좌 개설과 관련된 세부 상품 정보는 ''윤슬 입출금통장: 상품 개요''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: yunseul_bank
- id: 674be953-075b-5e5e-a9e5-4c6bcc7a59a9
  title: open_account 도구 설명서
  body: 'open_account 도구는 고객을 위한 새로운 은행 계좌를 생성하는 기능을 수행합니다.


    - **기능**: 요청된 조건에 따라 신규 계좌를 개설하고 계좌 번호를 부여합니다.

    - **사용 방법**: 상담원은 본인 확인 절차가 완료된 후 이 도구를 직접 호출하여 계좌를 개설합니다.

    - **인자 값**: 도구 호출 시 필요한 고객의 세부 정보(성함, 연락처 등)를 고객이 제공한 내용 그대로 입력하십시오.

    - **주의 사항**: `verify_identity`를 통한 본인 인증과 금융실명법에 따른 실명 확인이 선행되어야 합니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: yunseul_bank
- id: a656ab99-457c-5824-8835-fbdd4bfc89ee
  title: close_account 사용 기준
  body: '고객의 계좌 해지 요청 시, 자산 보호 및 부정 사용 방지를 위해 다음의 절차를 엄격히 준수하십시오.


    1. **고객 본인 확인**: `verify_identity` 도구를 호출하여 고객의 성함과 생년월일을 확인하십시오.

    2. **대상 계좌 식별**: 고객이 해지를 원하는 계좌의 끝 4자리를 확인한 후, `get_accounts` 도구를 사용하여 해당 계좌의
    정확한 account_id를 조회하십시오.

    3. **해지 처리 실행**: 식별된 account_id를 사용하여 `close_account` 도구를 호출하여 계좌를 폐쇄하십시오.


    계좌 해지 시 잔액 처리 및 유의사항은 ''윤슬 입출금통장: 해지·변경·상품 전환''을 참조하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: yunseul_bank
- id: 61544d1a-8483-58a8-870e-15b995356a7b
  title: close_account 도구 설명서
  body: 'close_account 도구는 고객의 요청에 따라 특정 계좌를 영구적으로 폐쇄하는 기능을 수행합니다.


    - **기능**: 지정된 계좌를 해지 상태로 변경하여 더 이상 거래가 발생하지 않도록 합니다.

    - **사용 방법**: 상담원은 `verify_identity`로 인증된 고객의 account_id를 확인한 후 이 도구를 호출합니다.

    - **인자 값**: 폐쇄할 계좌의 고유 식별자인 account_id가 필요합니다. 이 값은 `get_accounts` 도구를 통해 얻을 수
    있습니다.

    - **주의 사항**: 본 작업은 되돌릴 수 없는(Irreversible) 작업이므로, 반드시 고객의 명확한 해지 의사를 확인하고 정확한 계좌
    ID를 입력하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: yunseul_bank
- id: 45a5ded3-e532-55bf-8339-1a34bf9ca0e6
  title: update_contact_info 사용 기준
  body: '고객의 연락처, 주소 등 기본 등록 정보를 변경하는 절차는 다음과 같습니다.


    1. **고객 본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **변경 정보 수집**: 고객으로부터 변경하고자 하는 최신 연락처 또는 주소 정보를 정확히 확인하십시오.

    3. **정보 업데이트 실행**: 수집된 정보를 바탕으로 `update_contact_info` 도구를 호출하여 고객 정보를 갱신하십시오.


    개인정보 처리 및 보호에 관한 상세 내용은 ''윤슬 입출금통장: 개인정보 처리 안내''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: yunseul_bank
- id: 78beac51-2365-53a1-ae37-a01ac56da6c6
  title: update_contact_info 도구 설명서
  body: 'update_contact_info 도구는 고객의 최신 연락처 정보를 시스템에 반영하는 기능을 수행합니다.


    - **기능**: 고객의 전화번호, 이메일, 주소 등 등록된 개인 연락 정보를 수정합니다.

    - **사용 방법**: 상담원은 `verify_identity`를 통해 본인 확인을 마친 후, 고객이 요청한 변경 사항을 이 도구에 입력하여
    실행합니다.

    - **인자 값**: 변경하고자 하는 항목의 명칭과 새롭게 변경될 정보(예: 새로운 휴대전화 번호)를 입력하십시오.

    - **주의 사항**: 개인정보 보호법을 준수하여, 반드시 본인 확인이 완료된 고객의 정보만 수정하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: yunseul_bank
- id: c0820f45-728d-59dc-81c7-7936f89bb28a
  title: get_statements 사용 기준
  body: '고객이 거래 내역서 또는 명세서 조회를 요청할 경우 다음 절차에 따라 안내하십시오.


    1. **고객 본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **대상 계좌 식별**: 고객이 조회를 원하는 계좌의 끝 4자리를 확인하고, `get_accounts` 도구를 통해 해당 계좌의 account_id를
    조회하십시오.

    3. **명세서 조회 실행**: 확인된 account_id를 사용하여 `get_statements` 도구를 호출하고 고객에게 거래 내역을 안내하십시오.


    조회된 내역이 실제 거래와 다르다고 판단하는 경우 ''윤슬 입출금통장: 명세서나 내역과 맞지 않을 때'' 절차에 따라 지원하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: yunseul_bank
- id: 9865c78d-1617-5d71-8a93-e56bbcac85b5
  title: get_statements 도구 설명서
  body: 'get_statements 도구는 특정 계좌의 거래 명세서 및 상세 내역을 조회하는 기능을 수행합니다.


    - **기능**: 지정된 계좌에서 발생한 입출금 내역 및 거래 명세서를 반환합니다.

    - **사용 방법**: 상담원은 `verify_identity`로 본인 확인을 마친 후, 대상 계좌의 account_id를 입력하여 이 도구를
    호출합니다.

    - **인자 값**: 조회를 원하는 계좌의 고유 식별자인 account_id가 필요합니다. (get_accounts 도구로 획득 가능)

    - **주의 사항**: 조회된 금융 정보는 개인정보 보호법에 따라 엄격히 관리되어야 하며, 본인 외 제3자에게 노출되지 않도록 주의하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
