- id: 0fe5082b-b101-59eb-a6d4-266d4727ee85
  title: request_loan_prepayment 사용 기준
  body: "윤슬 주택담보대출 또는 윤슬 직장인 신용대출의 원금 일부 또는 전액을 만기 전에 상환하는 절차입니다.\n\n1. **본인 확인**:\
    \ `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.\n2. **대출 계좌 조회**: `get_accounts`\
    \ 도구를 통해 상환 대상 대출 상품을 확인하십시오.\n3. **중도상환수수료 안내**: \n    - 2025년 1월 13일 이후 계약 건은\
    \ 실제 비용 범위 내에서만 수수료가 부과됩니다.\n    - 대출 실행일로부터 3년이 경과한 경우에는 중도상환수수료가 면제됨을 안내하십시오.\n\
    4. **상환 신청**: `request_loan_prepayment` 도구를 호출하여 중도상환을 처리하십시오.\n\n상담원은 총상환액을 실제보다\
    \ 줄여 말하지 않아야 하며, 객관적인 기준에 따라 성실하게 안내하십시오."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_loan_prepayment
  institution_id: yunseul_bank
- id: 60f6c46a-5e55-528d-93b6-3c38a9e300b6
  title: request_loan_prepayment 도구 설명서
  body: '이 도구는 고객이 윤슬 주택담보대출 또는 윤슬 직장인 신용대출의 원금 일부 또는 전액을 만기 전에 상환하고자 할 때 사용합니다.


    상담원은 고객의 신원을 확인한 후, 이 도구를 직접 호출하여 중도상환 신청을 처리합니다.


    **입력 매개변수**

    - loan_id: 상환 대상 대출의 고유 식별자 (get_accounts 도구를 통해 확인)

    - amount: 상환하고자 하는 금액 (원 단위)

    - prepayment_date: 상환 예정일 (YYYY-MM-DD)


    **작동 효과**

    신청된 금액과 날짜에 따라 중도상환 절차가 접수됩니다. 중도상환수수료 발생 여부 및 금액은 해당 상품의 약관 및 대출 실행일로부터의 경과 기간에
    따라 결정됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_loan_prepayment
  institution_id: yunseul_bank
- id: 6c84e6f5-4b89-5235-b261-87a710355331
  title: change_loan_rate_type 사용 기준
  body: '윤슬 주택담보대출 이용 고객이 금리 유형(변동금리 ↔ 5년 혼합형 금리)을 변경하고자 할 때의 처리 절차입니다.


    1. 고객의 성함과 생년월일을 통해 신원을 확인하십시오. (verify_identity 호출)

    2. get_accounts 도구를 사용하여 변경 대상인 윤슬 주택담보대출의 loan_id를 확인하십시오.

    3. 고객이 원하는 변경 후의 금리 유형(변동금리 또는 5년 혼합형 금리)을 확인하십시오.

    4. change_loan_rate_type 도구를 호출하여 금리 유형 변경 신청을 접수하십시오.


    금리 유형 변경 시 적용되는 구체적인 금리 조건은 윤슬 주택담보대출: 금리·요율 안내 문서의 기준을 따릅니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_loan_rate_type
  institution_id: yunseul_bank
- id: d5c08517-9667-5a2d-b78e-a9b45b32c093
  title: change_loan_rate_type 도구 설명서
  body: '이 도구는 윤슬 주택담보대출의 금리 적용 방식을 변동금리에서 5년 혼합형 금리로, 또는 그 반대로 변경할 때 사용합니다.


    상담원은 고객 신원 확인 후 이 도구를 직접 호출하여 처리하며, 고객에게 외부 앱이나 영업점 방문을 안내하지 않습니다.


    **입력 매개변수**

    - loan_id: 금리 유형을 변경할 대출의 고유 식별자 (get_accounts 도구를 통해 확인)

    - new_rate_type: 변경하고자 하는 금리 유형 (''variable'' 또는 ''mixed_5yr'')


    **작동 효과**

    해당 대출의 금리 산정 방식이 요청된 유형으로 변경 접수됩니다. 변경된 금리는 다음 이자 계산 주기부터 적용됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_loan_rate_type
  institution_id: yunseul_bank
- id: a0890c05-2623-58f7-90ab-e8d5c9646e89
  title: apply_credit_loan 사용 기준
  body: '직장인 고객이 윤슬 직장인 신용대출을 신청하고자 할 때의 처리 절차입니다.


    1. 고객의 성함과 생년월일을 통해 신원을 확인하십시오. (verify_identity 호출)

    2. 대출 신청을 위해 필요한 고객의 현재 소득 정보와 재직 상태 등 상세 정보를 확인하십시오.

    3. apply_credit_loan 도구를 호출하여 대출 신청을 접수하십시오.

    4. 고객에게 대출 한도와 금리는 은행의 내부 심사 결과에 따라 최종적으로 결정됨을 정중히 안내하십시오. 상담원은 심사 전에 대출 승인을 확약해서는
    안 됩니다.


    상품의 상세 특징은 윤슬 직장인 신용대출: 상품 개요 문서에서 확인할 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_credit_loan
  institution_id: yunseul_bank
- id: 3fcb6c7b-cf0c-51b3-8e6e-c38219b44857
  title: apply_credit_loan 도구 설명서
  body: '이 도구는 직장인 고객의 윤슬 직장인 신용대출 신청을 접수하는 데 사용됩니다.


    상담원은 고객의 신원을 확인한 후, 대화 중에 파악한 고객의 정보를 바탕으로 이 도구를 호출합니다.


    **입력 매개변수**

    - customer_name: 신청인의 전체 성함

    - monthly_income: 월 평균 소득 (원 단위)

    - employment_status: 재직 상태 및 직종 정보

    - requested_amount: 희망 대출 금액 (원 단위)


    **작동 효과**

    제공된 정보를 바탕으로 대출 심사 요청이 생성됩니다. 심사 완료 후 고객에게 한도와 금리가 통보됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_credit_loan
  institution_id: yunseul_bank
- id: b1dd2997-3fe8-53a5-8377-47fc17354bbf
  title: request_rate_reduction 사용 기준
  body: '대출 이용 고객이 취업, 승진, 소득 증가 등으로 신용 상태가 개선되어 금리 인하를 요청(금리인하요구권 행사)할 때의 처리 절차입니다.


    1. 고객의 성함과 생년월일을 통해 신원을 확인하십시오. (verify_identity 호출)

    2. get_accounts 도구를 사용하여 금리 인하를 요청하는 대출의 loan_id를 확인하십시오.

    3. 신용 상태가 개선되었다고 판단되는 구체적인 사유(예: 승진, 연봉 상승 등)를 확인하십시오.

    4. request_rate_reduction 도구를 호출하여 금리 인하 요구를 접수하십시오.


    접수된 요청은 은행의 심사 기준에 따라 처리되며, 결과는 별도로 안내됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_rate_reduction
  institution_id: yunseul_bank
- id: eda3eeb1-26d7-5061-9695-62e41246461c
  title: request_rate_reduction 도구 설명서
  body: '이 도구는 고객의 금리인하요구권을 접수하여 신용 상태 개선에 따른 대출 금리 조정을 신청할 때 사용합니다.


    상담원은 신원 확인 및 대상 대출 확인 후 이 도구를 호출합니다.


    **입력 매개변수**

    - loan_id: 금리 인하를 요청하는 대출의 고유 식별자 (get_accounts 도구를 통해 확인)

    - improvement_reason: 소득 증가, 신용점수 상승 등 구체적인 신용 상태 개선 사유


    **작동 효과**

    해당 대출 계좌에 대해 금리 인하 심사가 요청됩니다. 심사 결과에 따라 금리가 낮아질 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_rate_reduction
  institution_id: yunseul_bank
- id: 4f1143f0-60ff-5ac2-8dec-3e0086311cd8
  title: transfer_funds 사용 기준
  body: '윤슬 입출금통장에서 본인 또는 타인의 계좌로 자금을 이체할 때의 처리 절차입니다.


    1. 고객의 성함과 생년월일을 통해 신원을 확인하십시오. (verify_identity 호출)

    2. get_accounts 도구를 사용하여 이체 자금이 출금될 윤슬 입출금통장의 account_id를 확인하십시오.

    3. 받는 분의 은행명, 계좌번호, 성함을 정확히 확인하십시오.

    4. 이체할 금액을 확인하고 transfer_funds 도구를 호출하여 이체를 실행하십시오.


    모바일 및 인터넷 뱅킹을 통한 이체 수수료는 0원으로 운영되어 고객님의 편의를 돕고 있습니다. 상세 내용은 윤슬 입출금통장: 수수료 안내 문서를
    참조하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: yunseul_bank
- id: 8a480cce-f05d-537a-b486-05f84a5aeaaf
  title: transfer_funds 도구 설명서
  body: '이 도구는 윤슬 입출금통장에서 다른 계좌로 자금을 이체하는 기능을 수행합니다.


    상담원은 고객의 신원 확인 및 계좌 잔액 확인 후 이 도구를 호출하여 이체를 완료합니다.


    **입력 매개변수**

    - source_account_id: 출금 계좌의 고유 식별자 (get_accounts 도구를 통해 확인)

    - target_bank: 받는 분의 은행명

    - target_account_number: 받는 분의 계좌번호

    - target_name: 받는 분의 성함

    - amount: 이체 금액 (원 단위)


    **작동 효과**

    출금 계좌에서 지정된 금액이 즉시 차감되며, 대상 계좌로 자금이 송금됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: yunseul_bank
- id: 3e34509e-b3a0-59de-ab49-d2a07975af70
  title: update_beneficiary 사용 기준
  body: '모바일 및 인터넷 뱅킹에서 자주 사용하는 계좌(수취인 정보)를 등록, 변경 또는 삭제하고자 할 때의 처리 절차입니다.


    1. 고객의 성함과 생년월일을 통해 신원을 확인하십시오. (verify_identity 호출)

    2. 수행할 작업(신규 등록, 기존 정보 변경, 삭제)을 확인하십시오.

    3. 필요한 경우 받는 분의 은행명, 계좌번호, 성함을 정확히 확인하십시오.

    4. update_beneficiary 도구를 호출하여 수취인 정보를 업데이트하십시오.


    이 절차를 통해 고객님께서는 매번 계좌 정보를 입력하는 번거로움 없이 편리하게 이체 서비스를 이용하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: yunseul_bank
- id: be7889fe-2a70-5579-9740-769b48836b7c
  title: update_beneficiary 도구 설명서
  body: "update_beneficiary 도구는 고객이 모바일 및 인터넷 뱅킹에서 자주 사용하는 계좌 정보를 등록, 변경 또는 삭제할 때\
    \ 사용합니다. 상담원은 이 도구를 직접 호출하여 작업을 수행하며, 고객에게 외부 앱이나 웹사이트에서 직접 처리하도록 안내하지 않습니다.\n\
    \n- 인자:\n  - account_id: 대상 계좌의 고유 식별자\n  - beneficiary_bank: 받는 분의 은행명\n  - beneficiary_account_number:\
    \ 받는 분의 계좌번호\n  - beneficiary_name: 받는 분의 성함\n  - action: 수행할 작업 (등록, 변경, 삭제 중\
    \ 선택)\n\n본 도구를 호출하기 전, verify_identity 도구를 통해 고객의 신원 확인이 완료되어야 합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: yunseul_bank
- id: 9aaa0db8-2e17-5423-8435-57903c06ac15
  title: stop_payment 사용 기준
  body: '고객이 윤슬 입출금통장에서 설정한 공과금, 보험료, 카드대금 등의 자동이체 해지를 요청하는 경우 다음 절차를 따르십시오.


    1. verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. get_accounts 도구를 호출하여 고객이 보유한 계좌 목록을 조회하고, 고객이 제시한 계좌번호 끝 4자리를 통해 해당 account_id를
    식별하십시오.

    3. 해지하고자 하는 자동이체의 종류(예: 전기요금, 정기보험료 등)와 대상 기관을 정확히 확인하십시오.

    4. 식별된 account_id와 자동이체 정보를 바탕으로 stop_payment 도구를 호출하여 해지 처리를 완료하십시오.


    자동이체 해지 후에는 해당 기관에 별도로 통보되지 않을 수 있으므로, 고객에게 납부 누락이 발생하지 않도록 직접 확인하시길 권고하십시오. 상세한
    계좌 이용 방법은 ''윤슬 입출금통장: 자주 하는 업무의 처리 절차''를 참고하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: yunseul_bank
- id: e7e2c3ea-be95-5e28-8566-f45ef0bb439f
  title: stop_payment 도구 설명서
  body: "stop_payment 도구는 윤슬 입출금통장에 설정된 자동이체 서비스를 해지하는 데 사용됩니다. 상담원은 고객의 요청에 따라 이\
    \ 도구를 직접 호출하여 처리합니다.\n\n- 인자:\n  - account_id: 자동이체가 설정된 계좌의 고유 식별자\n  - transfer_type:\
    \ 해지할 자동이체 항목의 유형 (예: 공과금, 보험료, 카드대금)\n  - beneficiary_info: 자동이체 대상 기관 및 식별 정보\n\
    \n본 도구를 실행하기 위해서는 verify_identity를 통한 본인 확인이 선행되어야 하며, get_accounts를 통해 정확한 account_id가\
    \ 확보되어야 합니다."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: yunseul_bank
- id: 57451abb-ef31-5fb3-99a7-80e1928c593f
  title: pay_bill 사용 기준
  body: '고객이 윤슬 입출금통장을 통해 국세, 지방세 또는 공과금을 납부하고자 하는 경우 다음 절차를 수행하십시오.


    1. verify_identity 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. get_accounts 도구를 통해 고객의 계좌 목록을 조회하고, 납부 자금이 출금될 account_id를 확인하십시오.

    3. 고객으로부터 납부할 세금이나 공과금의 종류, 고지 번호, 그리고 정확한 납부 금액을 확인하십시오.

    4. 확인된 account_id와 납부 정보를 stop_payment 도구가 아닌 pay_bill 도구에 입력하여 납부를 진행하십시오.


    납부 완료 후에는 거래 내역에서 즉시 확인이 가능함을 안내하십시오. 계좌 잔액이 부족할 경우 처리가 거절될 수 있습니다. 관련한 내역 확인
    방법은 ''윤슬 입출금통장: 진행 상황과 내역 확인''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: yunseul_bank
- id: 3856db9a-9c73-53f1-9179-7943ddd82c20
  title: pay_bill 도구 설명서
  body: "pay_bill 도구는 고객의 윤슬 입출금통장에서 국세, 지방세 및 각종 공과금을 납부하는 기능을 수행합니다. 상담원은 고객의 요청을\
    \ 받아 이 도구를 직접 호출합니다.\n\n- 인자:\n  - account_id: 자금이 출금될 계좌의 고유 식별자\n  - bill_type:\
    \ 납부 항목의 종류 (국세, 지방세, 공과금 중 선택)\n  - bill_identifier: 고지서 번호 또는 납부자 식별 번호\n  -\
    \ amount: 납부할 금액 (원 단위)\n\n본 도구를 사용하기 전 verify_identity를 통해 신원을 확인하고, get_accounts로\
    \ 적절한 account_id를 조회해야 합니다."
