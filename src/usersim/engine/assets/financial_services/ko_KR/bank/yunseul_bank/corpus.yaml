- id: 0b9028d0-041e-53f7-a74d-82f94c8e743b
  title: '윤슬 정기예금: 안전한 이용을 위한 수칙'
  body: '고객님의 소중한 예금을 보호하기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    첫째, 윤슬은행은 어떠한 경우에도 전화나 문자 메시지를 통해 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지
    않습니다. 이러한 정보를 요구하는 연락을 받으셨다면 즉시 전화를 끊으십시오.


    둘째, 보이스피싱 등 금융사기 피해가 의심되거나 발생한 경우에는 지체 없이 윤슬은행 고객센터나 가까운 영업점으로 연락하여 지급정지와 피해구제
    신청을 진행하십시오. 신속한 대응만이 피해를 최소화할 수 있는 최선의 방법입니다.


    셋째, 계좌 정보 조회나 변경 등 상태 변경 작업 전에는 반드시 성함과 생년월일을 통한 본인 확인 절차를 거칩니다. 정당한 절차 없는 정보
    변경 요청은 거절될 수 있음을 알려드립니다.


    윤슬은행은 금융감독원의 지침에 따라 고객님의 개인정보를 엄격히 보호하며, 안전한 금융 거래 환경을 제공하기 위해 최선을 다하고 있습니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: security_advisory
