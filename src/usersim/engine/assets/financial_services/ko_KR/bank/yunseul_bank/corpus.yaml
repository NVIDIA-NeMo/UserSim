- id: a953063f-9454-55dd-9efc-ea049eaf814c
  title: '윤슬 정기예금: 3년 정기예금 금리 안내'
  body: 'Q: 윤슬 정기예금에 3년 동안 예치할 경우 적용되는 금리는 얼마입니까?

    A: 윤슬 정기예금의 3년 정기예금 금리는 3.25%입니다.


    Q: 3년 정기예금 가입을 위해 필요한 최소 금액은 얼마입니까?

    A: 최소 가입 금액은 100,000원입니다.


    Q: 3년 만기 시 이자 계산 방식은 어떻게 됩니까?

    A: 약정된 3.25%의 금리를 적용하여 계산되며, 이자 지급 시 15.4%의 세금이 원천징수됩니다. 더 자세한 내용은 ''윤슬 정기예금:
    상품 개요''를 참고하십시오.'
