- id: d978ee26-b914-5076-b6eb-24c4a25a2015
  title: report_voice_phishing 사용 기준
  body: '보이스피싱 등 전기통신금융사기 피해가 발생한 고객을 위해 신속하게 지급정지와 피해구제 신청을 지원하는 절차입니다.


    1. **본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **계좌 및 카드 조회**: `get_accounts` 도구를 호출하여 피해와 관련된 계좌 및 카드 정보를 확인하고, 필요한 경우 고객이
    제공한 계좌 번호 끝 4자리와 대조하십시오.

    3. **피해 내용 청취**: 사기 이용 계좌번호, 송금 금액, 발생 일시 등 피해 상황을 정확히 파악하십시오.

    4. **피해구제 및 지급정지 신청**: `report_voice_phishing` 도구를 호출하여 피해구제 신청을 접수하고, 돈을 보낸 상대
    계좌의 지급정지를 요청하십시오.


    본 절차는 금융소비자 보호법 및 관련 법령에 따라 신속하게 처리되어야 하며, 해결이 어려운 복잡한 민원은 단계별 절차에 따라 책임자에게 에스컬레이션하십시오.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - report_voice_phishing
  institution_id: yunseul_bank
- id: e1db184a-987f-5438-b48e-adeced059609
  title: report_voice_phishing 도구 설명서
  body: "report_voice_phishing 도구는 보이스피싱 등 금융사기 피해 고객의 피해구제 신청을 접수하고, 사기에 이용된 상대방\
    \ 계좌의 지급정지를 요청하는 기능을 수행합니다.\n\n- **시그니처**: `report_voice_phishing(customer_name:\
    \ string, contact_info: string, transaction_details: string)`\n- **인자**: \n  \
    \  - `customer_name`: 피해 고객의 전체 성함입니다.\n    - `contact_info`: 연락 가능한 전화번호입니다.\n\
    \    - `transaction_details`: 송금 대상 계좌번호, 금액, 일시 등 피해 거래에 대한 세부 정보입니다.\n- **효과**:\
    \ 금융감독원 및 관련 기관의 절차에 따라 피해구제 신청이 접수되며, 해당 계좌의 지급정지 절차가 시작됩니다.\n\n상담원은 `verify_identity`를\
    \ 통해 신원이 확인된 고객의 정보를 바탕으로 이 도구를 직접 호출하십시오."
