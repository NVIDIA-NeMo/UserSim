  institution_id: yunseul_bank
- id: 57e45c95-8046-5e44-90d7-6337ea1a4bb4
  title: '윤슬 주택담보대출: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객에게 ''윤슬 주택담보대출''의 한도 및 제한 사항을 안내하기 위한 지침입니다. 안내 시 다음의 규정과 수치를
    정확히 전달하십시오.


    1. 대출 한도 및 규제: 대출 총액이 1억원을 초과하는 차주에게는 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행권 기준 연간 원리금
    상환액이 연소득의 40%를 넘지 않아야 하며, 한도 산정 시 향후 금리 상승 위험을 반영한 스트레스 금리가 가산됩니다.

    2. 대출 기간: 최장 대출 기간은 40년이며, 고객의 상환 능력과 담보 가치에 따라 결정됩니다.

    3. 청약 철회권: 고객은 계약 서류를 받은 날과 대출 실행일 중 늦은 날로부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과
    이용 기간의 이자, 인지세 등 제3자 비용만 부담하며 중도상환수수료는 면제됩니다.

    4. 법정 제한: 최고금리는 연 20%를 초과할 수 없으며, 연체이자는 약정금리에 최대 3%p를 더한 수준과 연 20% 중 낮은 금액을 적용합니다.


    상세 금리 체계는 ''윤슬 주택담보대출: 금리·요율 안내''에서 확인하시기 바랍니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: product_sheet
  source_authority: official
