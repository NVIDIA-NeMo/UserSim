- id: fa10f581-05ee-51f3-90e2-f09efdaaba42
  title: '윤슬 직장인 신용대출: 로그인하거나 접속할 수 없을 때'
  body: '모바일 앱이나 인터넷 뱅킹을 통해 대출 내역을 확인하시려는데 접속이 되지 않는 경우, 다음 순서에 따라 조치해 보십시오.


    [증상]

    - 로그인 시도 시 ''아이디 또는 비밀번호가 일치하지 않습니다''라는 메시지가 출력됨

    - 접속 화면에서 다음 단계로 넘어가지 않고 무한 로딩이 발생함


    [확인 및 해결 방법]

    1. 계정 정보 확인: 대소문자 구분 및 오타 여부를 확인하십시오. 비밀번호를 5회 이상 잘못 입력하신 경우 보안을 위해 계정이 잠길 수 있습니다.

    2. 네트워크 상태 점검: Wi-Fi 연결이 불안정하거나 데이터 통신이 원활하지 않을 때 발생할 수 있습니다. 네트워크를 전환하여 다시 시도하십시오.

    3. 서비스 점검 시간 확인: 은행 시스템 정기 점검 시간에는 일부 서비스 이용이 제한될 수 있습니다. 공지사항의 점검 일정을 확인하십시오.


    [해결되지 않을 경우]

    위 조치 후에도 접속이 불가능하다면, 상담원에게 오류 메시지 내용을 상세히 말씀해 주십시오. 저희가 계정 잠금 해제 여부를 확인하거나 기술
    부서로 케이스를 에스컬레이션하여 해결 방안을 안내해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: c58205b6-fbf1-5b0f-85b7-4d7f7e79ef61
  title: '윤슬 직장인 신용대출: 이용 조건별 차이'
  body: '상담원은 아래의 조건별 기준을 참고하여 고객의 대출 가능 여부와 조건을 안내하십시오.


    - 재직 상태: 현 직장 6개월 이상 재직 중인 직장인 → 신청 가능

    - 신용 등급: 내부 심사 기준 최상위 수준 → 대출 금리 연 4.7% 적용 가능

    - 신용 등급: 내부 심사 기준 하한 수준 → 대출 금리 연 6.5% 적용 가능

    - 대출 금액: 총부채원리금상환비율(DSR) 규제 범위 내 → 이용한도 최고액 100,000,000원 내에서 산정

    - 신용 상태 개선: 취업, 승진, 소득 증가 발생 → 금리인하요구권 행사 가능'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 5bda9339-3647-5fdd-a45f-c3cd4a365b42
  title: '윤슬 직장인 신용대출: 상품 고르는 방법'
  body: '자금의 용도와 상환 계획에 따라 적합한 상품을 선택하십시오.


    [윤슬 직장인 신용대출]

    - 특징: 별도의 담보 없이 신용과 소득만으로 신속하게 자금을 조달할 수 있습니다.

    - 한도: 이용한도 최고액 100,000,000원

    - 금리: 연 4.7% ~ 6.5%

    - 적합한 분: 급한 자금이 필요하시거나, 소액의 자금을 유연하게 운용하고자 하는 직장인 고객님께 추천합니다.


    [윤슬 주택담보대출]

    - 특징: 주택을 담보로 하여 장기간에 걸쳐 안정적으로 자금을 이용할 수 있습니다.

    - 한도: 주택 가치 및 LTV/DSR 규제에 따라 결정 (신용대출보다 훨씬 높은 한도 가능)

    - 금리: 일반적으로 신용대출보다 낮은 금리가 적용됩니다.

    - 적합한 분: 주택 구입이나 대규모 자금 마련을 위해 장기적인 상환 계획을 세우시는 고객님께 추천합니다.


    신속한 자금 마련이 우선이라면 신용대출을, 낮은 금리와 높은 한도가 우선이라면 주택담보대출을 고려하십시오.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: a845c9e7-23c0-5c11-860d-1b9b9ddee69f
  title: '윤슬 직장인 신용대출: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 금융소비자 보호에 관한 법률을 엄격히 준수하여 고객님의 정보를 처리합니다.


    1. 수집 항목: 성함, 생년월일, 연락처, 주소, 직장 정보, 연소득, 신용 점수 및 기타 신용 평가를 위한 정보를 수집합니다.

    2. 수집 및 이용 목적: 대출 심사 및 한도 산정, 계약 체결 및 유지, 원리금 회수, 그리고 법적 의무 이행을 위해 사용합니다.

    3. 주민등록번호 처리: 주민등록번호는 관련 법령에서 허용하는 경우(실명 확인 및 신용 정보 조회 등)에 한하여 엄격히 처리하며, 그 외에는
    대체 수단을 사용합니다.

    4. 정보의 보유 및 파기: 대출 계약 기간 동안 정보를 보유하며, 계약 종료 후 관련 법령이 정한 보존 기간이 경과하면 안전한 방법으로 파기합니다.

    5. 고객의 권리: 고객님은 언제든지 본인의 개인정보 열람, 정정, 삭제를 요청하실 수 있습니다.


    윤슬은행은 고객님의 소중한 정보를 보호하기 위해 최선의 보안 조치를 취하고 있으며, 무단 유출이나 오남용이 없도록 관리하고 있습니다.'
