- id: 1a858831-175b-5bc6-b80c-b366949aaa1e
  title: cancel_time_deposit 사용 기준
  body: '윤슬 정기예금 또는 윤슬 정기적금을 만기 전에 해지하여 자금을 회수하는 절차입니다.


    1. **본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **대상 상품 조회**: `get_accounts` 도구를 통해 해지하고자 하는 예금 또는 적금 계좌를 확인하십시오.

    3. **중도해지 안내**: 만기 전 해지 시 약정 금리가 아닌 중도해지이율이 적용되어 이자 수익이 감소함을 고객에게 충분히 설명하십시오.

    4. **해지 실행**: `cancel_time_deposit` 도구를 호출하여 상품을 해지하고, 원금과 중도해지이율로 계산된 이자를 윤슬
    입출금통장으로 입금하십시오.


    해지 시 발생하는 이자 소득에 대해서는 15.4%의 원천징수세가 적용되어 차감 후 지급됩니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_time_deposit
  institution_id: yunseul_bank
- id: 020d179d-7f4b-5559-8a33-3165eaeec2c9
  title: cancel_time_deposit 도구 설명서
  body: "cancel_time_deposit 도구는 윤슬 정기예금이나 윤슬 정기적금을 만기 전에 해지하고, 그 결과물을 입출금통장으로 환급하는\
    \ 기능을 수행합니다.\n\n- **시그니처**: `cancel_time_deposit(account_id: string, destination_account_id:\
    \ string)`\n- **인자**: \n    - `account_id`: 해지할 정기예금 또는 정기적금 계좌의 고유 식별자입니다.\n\
    \    - `destination_account_id`: 원금과 이자를 돌려받을 윤슬 입출금통장의 고유 식별자입니다.\n- **효과**:\
    \ 해당 예적금 계좌가 폐쇄되며, 중도해지이율이 적용된 원리금이 대상 입출금통장으로 즉시 입금됩니다.\n\n상담원은 `verify_identity`를\
    \ 통해 신원이 확인된 고객의 요청에 따라 이 도구를 직접 호출하십시오."
