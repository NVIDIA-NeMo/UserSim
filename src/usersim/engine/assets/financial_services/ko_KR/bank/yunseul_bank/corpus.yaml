- id: 6f89617a-653a-574f-bfd0-ab52c331af6b
  title: '윤슬 주택담보대출: 가입과 이용 시작'
  body: '윤슬 주택담보대출 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 본인 확인이 완료되어야 상세 상담 및 심사가 가능합니다.

    2. 서류 제출 및 신청: 주택 소유 증빙 서류, 소득 증빙 서류 및 신분증을 제출하시고 대출 신청서를 작성하십시오.

    3. 담보 가치 평가 및 심사: 은행에서 제공하는 전문 평가 기관을 통해 주택의 가치를 산정하고, 고객님의 신용도와 DSR(총부채원리금상환비율)을
    분석하여 대출 한도와 최종 금리를 결정합니다.

    4. 계약 체결 및 실행: 심사가 승인되면 대출 계약서에 서명하십시오. 계약서류를 받은 날과 대출 실행일 중 늦은 날로부터 14일 이내에 청약을
    철회하실 수 있습니다.

    5. 자금 수령: 모든 절차가 완료되면 지정하신 계좌로 대출금이 입금됩니다.


    가입 가능 여부에 대한 자세한 조건은 ''윤슬 주택담보대출: 가입 대상''에서 확인하시기 바랍니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
