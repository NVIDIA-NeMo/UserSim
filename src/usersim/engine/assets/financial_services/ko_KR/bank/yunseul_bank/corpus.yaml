- id: 0028b03f-0df0-507f-90fc-52d29368503e
  title: '윤슬 입출금통장: 수수료와 비용'
  body: 'Q: 다른 은행으로 돈을 보낼 때 수수료가 발생하나요?

    A: 모바일 뱅킹이나 인터넷 뱅킹을 이용하여 다른 은행으로 이체하실 경우 수수료는 0원입니다. 고객님의 편의를 위해 디지털 금융 수수료 면제
    정책을 시행하고 있습니다.


    Q: ATM 이용 시 수수료가 있습니까?

    A: 영업시간 내 이용은 기본 정책을 따르며, 영업시간 외 ATM 출금 시에는 500원의 수수료가 부과됩니다.


    Q: 통장을 분실하여 다시 만들어야 하는데 비용이 드나요?

    A: 네, 통장 및 카드 재발급 시에는 2,000원의 수수료가 부과됩니다.


    더 상세한 내용은 ''윤슬 입출금통장: 수수료 안내'' 문서에서 확인하실 수 있습니다.'
