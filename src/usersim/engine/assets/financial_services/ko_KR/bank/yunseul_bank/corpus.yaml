  institution_id: yunseul_bank
- id: f1e52f6b-5395-5df7-a25e-db29f06f0357
  title: '윤슬 정기적금: 위험 안내'
  body: '본 상품 가입 전, 고객님께서 유의하셔야 할 위험 및 고지 사항을 안내해 드립니다.


    - 중도 해지 위험: 본 상품은 정해진 기간 동안 납입하는 것을 전제로 금리가 적용됩니다. 만기 전에 중도 해지하실 경우, 약정한 3.6%
    금리가 아닌 훨씬 낮은 중도해지이율이 적용되어 기대하셨던 이자 수익을 얻지 못할 수 있습니다.

    - 세금 관련 고지: 발생한 이자 소득에 대해서는 관련 법령에 따라 15.4%의 소득세 및 지방소득세가 원천징수됩니다. 또한 금융소득 종합과세
    기준(연 2,000만원 초과)에 해당할 경우 추가 세금이 발생할 수 있습니다.

    - 예금자 보호 한도: 본 상품은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다. 보호 한도를 초과하는 금액은
    보호 대상에서 제외될 수 있음을 유의하십시오.

    - 투자 상품 제외: 본 상품은 예금 상품이며, 실적에 따라 수익이 변동되는 펀드 등 투자 상품은 보호 대상이 아닙니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 4fd7b875-e6d2-5674-8920-92b5d6bc6ac6
  title: '윤슬 정기적금: 금리·요율이 정해지는 방식과 적용'
  body: '윤슬 정기적금의 금리 적용 방식 및 관련 요율에 대해 안내합니다.


    - 적용 금리: 12개월 적금 금리는 3.6%로 적용됩니다. 이 금리는 가입 시점에 약정된 고정 금리로, 만기까지 동일하게 적용됩니다.

    - 금리 적용 대상: 매월 약정한 납입 금액에 대해 일할 계산되어 적용됩니다.

    - 세금 요율: 이자 지급 시 소득세와 지방소득세를 합해 15.4%를 원천징수합니다. 이는 법정 세율에 따른 것으로 은행이 임의로 조정할 수
    없습니다.

    - 중도 해지 시: 약정 기간을 채우지 못하고 해지하는 경우, 가입 기간 및 당행의 중도해지이율 규정에 따라 금리가 낮게 조정되어 적용됩니다.


    상담원은 고객에게 총상환액이나 예상 수령액을 줄여 말하지 않으며, 항상 객관적인 기준에 따라 정확한 금리를 안내해야 합니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 7576bf3d-331d-50e7-a106-f73e84f10c83
  title: '윤슬 정기적금: 추천·장기 이용 혜택'
  body: '윤슬은행에서 안정적인 목돈 마련을 계획하시는 고객님을 위해 특별한 혜택을 안내해 드립니다.


    기간: 2025년 1월 1일부터 2025년 12월 31일까지

    혜택: 해당 기간 내 가입하신 고객님께는 12개월 적금 금리 3.6%를 적용해 드립니다.


    매월 10,000원부터 최대 1,000,000원까지 꾸준히 적립하여 미래를 위한 자산을 증식하십시오. 신뢰할 수 있는 윤슬은행과 함께 장기적인
    저축 습관을 형성하시고 확정된 금리 혜택을 누리시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 74dca8fb-2976-5c85-98f6-52e716619f0e
  title: '윤슬 정기적금: 안전한 이용을 위한 수칙'
  body: '윤슬 정기적금을 이용하시는 고객님의 소중한 자산을 보호하기 위해 다음의 보안 수칙을 반드시 준수하여 주십시오.


    1. 금융사기 주의: 최근 적금 상품의 고금리를 미끼로 한 보이스피싱 사례가 증가하고 있습니다. 윤슬은행은 어떠한 경우에도 전화나 문자를 통해
    비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다.


    2. 본인 확인 절차: 계좌 정보 조회나 상태 변경 작업 전에는 반드시 고객님의 성함과 생년월일을 통해 본인 확인을 진행합니다. 이 외의 민감한
    보안 정보 요구는 사기일 가능성이 매우 높으므로 즉시 중단하십시오.


    3. 피해 발생 시 조치: 만약 보이스피싱 등 금융사기 피해가 의심되거나 발생한 경우, 즉시 윤슬은행 고객센터 또는 영업점을 통해 지급정지를
    요청하고 피해구제 신청을 진행하십시오. 신속한 대응이 피해를 최소화하는 최선의 방법입니다.


    고객님의 안전한 금융 거래를 위해 항상 주의를 기울여 주십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: ff49372a-ce05-5948-8e32-0e4840a735ae
  title: '윤슬 정기적금: 약관 변경 안내'
  body: '윤슬 정기적금의 이용 약관이 다음과 같이 변경될 예정임을 안내해 드립니다. 본 상품을 이용하시거나 다른 상품과 비교 중이신 고객님께서는
    변경 사항을 확인하시기 바랍니다.


    [주요 변경 사항]

    - 납입 금액 제한: 고객님의 체계적인 자산 관리를 위해 월 최소 납입액은 10,000원, 월 최대 납입액은 1,000,000원으로 설정됩니다.
    해당 범위를 벗어난 납입은 제한될 수 있습니다.

    - 금리 적용: 12개월 적금 금리는 3.6%로 적용되며, 이는 약정 기간 동안 유지됩니다.

    - 원천징수: 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.


    [약관 변경 및 해지]

    - 은행은 약관 변경 시 변경 내용과 적용 일자를 고객님께 사전 고지합니다.

    - 고객님께서는 약관 변경에 동의하지 않으실 경우 계약을 해지하실 수 있으며, 이 경우 만기 전 해지에 따른 중도해지이율이 적용됩니다.


    상세한 내용은 영업점 방문 또는 모바일 앱의 약관 전문을 통해 확인하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 51a8484c-f6ee-571f-8558-d769a3767355
  title: '윤슬 정기적금: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객의 윤슬 정기적금 가입 및 이용을 지원하기 위한 가이드입니다.


    [상품 개요]

    윤슬 정기적금은 매월 일정 금액을 꾸준히 적립하여 목돈 마련을 돕는 저축 상품입니다.


    [핵심 이용 조건]

    - 12개월 적금 금리: 3.6%

    - 월 납입 가능 금액: 최소 10,000원 ~ 최대 1,000,000원

    - 세금 처리: 이자 소득에 대해 15.4% 원천징수

    - 예금자 보호: 예금보험공사를 통해 원금과 이자를 합해 1인당 최대 1억원까지 보호


    [가입 및 이용 절차]

    1. 본인 확인: 고객의 성함과 생년월일을 확인하여 실명 확인 절차를 거칩니다.

    2. 상품 안내: 월 납입 금액 범위와 12개월 금리 3.6%를 명확히 안내합니다.

    3. 계좌 개설: 모바일 앱, 인터넷 뱅킹 또는 영업점 방문을 통해 가입을 진행합니다.

    4. 자동이체 설정: 고객 편의를 위해 윤슬 입출금통장과 연결한 자동이체 설정을 권장합니다.


    [유의사항]

    - 투자 상품이 아니므로 원금 손실 위험이 없으며 예금자 보호 대상입니다.

    - 만기 전 해지 시에는 약정 금리가 아닌 중도해지이율이 적용됨을 반드시 고지하십시오.'
