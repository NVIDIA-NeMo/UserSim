- id: 303718be-5dc8-56ba-9654-e2f8daeb04d1
  title: '윤슬 입출금통장: 이런 분께 알맞습니다'
  body: '윤슬 입출금통장은 일상적인 금융 거래를 가장 효율적으로 관리하고자 하는 분들을 위해 설계된 기본 계좌입니다.


    이런 분들께 특히 추천드립니다:

    - 매달 급여를 수령하고 공과금, 보험료, 카드 대금 등을 자동이체로 편리하게 관리하고 싶으신 직장인 고객님

    - 전국적인 영업점 네트워크를 통해 대면 상담의 안정성과 디지털 뱅킹의 편리함을 동시에 누리고 싶으신 분

    - 모바일 앱이나 인터넷 뱅킹을 주로 사용하여 이체 수수료 부담 없이 자유롭게 자금을 이동하고 싶으신 분


    주요 혜택 및 조건:

    - 디지털 금융 활성화를 위해 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)를 0원으로 제공하여 고객님의 비용 부담을 없앴습니다.

    - 입출금통장 금리 연 0.1%가 적용되어 일상적인 자금 예치에도 안정적인 관리가 가능합니다.

    - 영업시간 외 ATM 출금 수수료는 500원, 통장 및 카드 재발급 수수료는 2,000원의 합리적인 비용으로 운영됩니다.


    윤슬은행의 신뢰할 수 있는 네트워크와 편리한 디지털 서비스를 통해 스마트한 자산 관리를 시작하십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
