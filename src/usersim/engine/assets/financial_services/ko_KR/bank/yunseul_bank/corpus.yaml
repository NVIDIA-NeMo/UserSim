- id: 6441557e-449b-5238-a2c2-5c16ce5dad1c
  title: '윤슬 직장인 신용대출: 약관 변경 안내'
  body: '본 안내는 윤슬 직장인 신용대출의 이용 약관 중 일부 변경 사항을 고지하며, 이는 금융소비자 보호에 관한 법률 및 관련 규정을 준수합니다.


    1. 금리 및 한도 적용: 대출 금리는 연 4.7%에서 6.5% 범위 내에서 고객님의 신용 상태와 소득에 따라 차등 적용됩니다. 이용한도 최고액은
    100,000,000원으로 제한되며, 심사 결과에 따라 실제 한도는 낮아질 수 있습니다.

    2. 중도상환수수료: 대출 기간 만료 전 원금을 상환하실 경우, 중도상환수수료율 0.1%가 적용됩니다. 단, 관련 법령 및 은행 내부 기준에
    따라 수수료가 면제되는 경우는 예외로 합니다.

    3. 계약의 해지 및 변경: 약관의 변경이 있을 경우 은행은 최소 30일 전에 고객님께 개별 통지하거나 영업점 및 홈페이지에 공지합니다. 고객님께서
    변경된 약관에 동의하지 않으실 경우 대출 계약 해지를 요청하실 수 있습니다.

    4. 의무 사항: 고객님은 대출 원리금을 약정된 기일에 상환해야 하며, 신용 상태에 중대한 변화가 있을 경우 이를 은행에 통지해야 합니다.'
  domain: lending_mortgage
