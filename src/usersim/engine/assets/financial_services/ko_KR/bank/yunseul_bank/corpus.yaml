- id: a350d9bf-9cb7-50bf-811f-061d703cca04
  title: '윤슬 주택담보대출: 이런 분께 알맞습니다'
  body: '윤슬 주택담보대출은 주택 구입을 위해 장기간 안정적으로 자금을 조달하고자 하는 고객님께 최적화된 상품입니다. 특히 다음과 같은 분들께
    추천해 드립니다.


    - 내 집 마련을 위해 넉넉한 상환 기간이 필요하신 분: 최장 대출 기간(년) 40년의 설정을 통해 월 상환 부담을 낮출 수 있습니다.

    - 시장 금리 변화에 유연하게 대응하고 싶으신 분: 변동금리(4.45%)를 선택하여 금리 하락기의 혜택을 누리실 수 있습니다.

    - 초기 몇 년간은 고정된 지출로 가계 계획을 세우고 싶으신 분: 5년 혼합형 금리(4.65%)를 통해 5년간 금리 변동 리스크를 제거하고
    안정적인 자금 운용이 가능합니다.


    본 상품은 정해진 기준에 따라 합리적인 중도상환수수료율(0.6%)을 적용하며, 대출일부터 3년이 지나면 수수료 없이 자유롭게 원금을 상환하실
    수 있어 장기적인 자산 관리 전략에 유리합니다.'
  domain: lending_mortgage
