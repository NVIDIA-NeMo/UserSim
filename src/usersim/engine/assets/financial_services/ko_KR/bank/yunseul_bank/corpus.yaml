- id: b43c48f8-69af-5fe5-81aa-532438dbf04a
  title: '윤슬 입출금통장: 처리가 끝나지 않거나 보류 중일 때'
  body: '이체나 입금 처리 후 잔액에 즉시 반영되지 않거나 ''처리 중'' 상태가 지속되는 경우, 다음 순서에 따라 확인하십시오.


    1. 네트워크 상태 확인: 모바일 앱이나 인터넷 뱅킹의 연결 상태가 불안정할 경우 처리 결과 반영이 늦어질 수 있습니다.

    2. 거래 내역 재조회: 일시적인 화면 업데이트 지연일 수 있으므로, 다시 한번 내역 조회를 시도하십시오.

    3. 상대 계좌 확인: 타행 이체의 경우 상대 은행의 시스템 점검 시간이나 수취 계좌의 상태에 따라 보류될 수 있습니다.


    위 조치 후에도 문제가 해결되지 않아 상담원에게 문의하시는 경우, 고객님의 성함과 생년월일을 통해 본인 확인을 진행합니다. 이후 저희가 직접
    거래 추적 및 시스템 상태를 확인하며, 필요시 내부 전문 팀으로 케이스를 에스컬레이션하여 처리 결과를 안내해 드리겠습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 19c4c0f7-7e0e-5497-81ab-7f4cbad397b7
  title: '윤슬 입출금통장: 가입 대상'
  body: '윤슬 입출금통장의 가입 조건 및 대상은 다음과 같습니다.


    - 개인 고객: 실명 확인이 가능한 모든 개인 고객님은 가입하실 수 있습니다.

    - 직장인 고객: 소득 증빙과 관계없이 실명 확인 후 가입이 가능하며, 급여 이체 계좌로 활용하실 수 있습니다.

    - 실명 확인 여부: 금융실명법에 따라 실명이 확인된 경우에만 계좌 개설이 가능합니다.

    - 제한 사항: 금융 거래 제한 대상자 등 은행의 내부 기준에 따라 가입이 제한될 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 727a2574-ef31-54ab-b127-a955045a9421
  title: '윤슬 입출금통장: 당사의 비슷한 상품과의 비교'
  body: '윤슬 입출금통장과 당사의 저축 상품인 정기예금, 정기적금의 특징을 비교하여 안내해 드립니다.


    - 윤슬 입출금통장: 입출금통장 금리 0.1%가 적용되며, 언제든지 자유롭게 입출금이 가능하여 일상적인 지출과 급여 관리에 적합합니다.

    - 윤슬 정기예금 및 정기적금: 목돈을 예치하거나 매월 적립하여 확정된 더 높은 금리로 자산을 증식하는 상품입니다. 다만, 만기 전 해지 시
    중도해지이율이 적용되어 유동성이 낮습니다.


    결론적으로, 일상적인 거래와 편리한 자금 운용을 원하신다면 ''윤슬 입출금통장''을, 안정적인 자산 증식과 목돈 마련이 목적이시라면 ''윤슬
    정기예금''이나 ''윤슬 정기적금''을 추천드립니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e831062f-d4e5-54e5-b8e5-fe66b5f336ad
  title: '윤슬 입출금통장: 상품설명서 주요 내용'
  body: '본 상품은 금융소비자 보호에 관한 법률 및 관련 법령을 준수하여 운영됩니다. 이용 전 다음의 주요 내용을 확인하십시오.


    [예금자 보호 안내]

    본 상품은 예금보험공사 보호 대상 상품입니다. 예금자 1인당 원금과 소정의 이자를 합해 최고 1억원까지 보호됩니다. 단, 투자 상품은 보호
    대상에서 제외됩니다.


    [세금 및 원천징수]

    발생하는 이자 소득에 대해서는 소득세와 지방소득세를 합산하여 15.4%의 세율로 원천징수합니다. 금융소득 종합과세 대상자의 경우 연 2,000만원
    초과 시 다른 소득과 합산하여 종합과세됩니다.


    [실명 확인 및 개인정보 처리]

    금융실명법에 따라 실명 확인 절차를 거쳐야 하며, 고객님의 개인정보는 개인정보 보호법에 따라 엄격히 처리됩니다.


    [수수료 고지]

    모바일 및 인터넷 뱅킹 이체 수수료는 0원으로 운영되나, 영업시간 외 ATM 출금 수수료(500원) 및 통장·카드 재발급 수수료(2,000원)
    등 실물 비용이 발생하는 서비스에는 수수료가 부과됩니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 7aacdaea-ad31-5fbd-a207-3f5cb8a98ab0
  title: '윤슬 입출금통장: 금리·요율 안내'
  body: '윤슬 입출금통장에 적용되는 금리는 다음과 같습니다.


    - 입출금통장 금리: 0.1%


    본 금리는 모든 고객님께 동일하게 적용되는 단일 금리이며, 예치 금액에 관계없이 동일한 요율이 적용됩니다. 금리는 연율 기준이며, 실제 지급
    시에는 관련 법령에 따라 15.4%의 세금을 원천징수한 후 지급됩니다. 시장 상황 및 은행의 금리 정책에 따라 금리는 변동될 수 있으며, 변동
    시 공지사항을 통해 안내해 드립니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 3d064978-0c42-5d82-adfe-40eb3e69e51a
  title: '윤슬 입출금통장: 진행 중인 이벤트'
  body: '[디지털 금융 활성화 캠페인: 이체 수수료 0원 혜택 안내]


    윤슬은행을 이용해주시는 고객님께 감사드립니다. 디지털 뱅킹의 편리함을 더해드리기 위해 다음과 같이 수수료 면제 혜택을 상시 제공하고 있습니다.


    - 이벤트 기간: 2025년 1월 1일부터 상시 운영

    - 대상 고객: 윤슬 입출금통장을 보유하고 모바일 앱 또는 인터넷 뱅킹을 이용하시는 모든 고객님

    - 혜택 내용: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹) 0원 적용


    지금 바로 윤슬 입출금통장을 통해 수수료 부담 없이 자유롭게 송금 서비스를 이용해 보십시오.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: b9dcf5b2-81be-5ad7-b690-b1f7bf3de03f
  title: '윤슬 입출금통장: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산을 안전하게 보호하기 위해 엄격한 보안 원칙을 준수하고 있습니다.


    먼저, 계좌 정보 조회나 변경과 같은 상태 변경 작업을 수행하기 전에는 반드시 고객님의 성함과 생년월일을 통해 본인 확인 절차를 거칩니다.
    하지만 윤슬은행은 어떠한 경우에도 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다. 만약 이러한
    정보를 요구하는 연락을 받으셨다면 금융사기를 의심하시고 즉시 대응하십시오.


    보이스피싱 등 전기통신금융사기 피해가 발생했거나 의심되는 경우, 즉시 당사 고객센터나 영업점으로 연락하여 해당 계좌의 지급정지와 피해구제 신청을
    진행해 주십시오. 신속한 조치를 통해 피해를 최소화할 수 있도록 지원하겠습니다.


    또한, 본 상품은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다. 안전한 금융 거래를 위해 정기적으로 비밀번호를
    변경하시고, 타인에게 계좌 정보를 공유하지 마십시오.'
  domain: retail_banking
