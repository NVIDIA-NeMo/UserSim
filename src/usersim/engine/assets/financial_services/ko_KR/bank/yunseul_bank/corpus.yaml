  institution_id: yunseul_bank
- id: d98ddd13-f514-50b7-b01e-d701bc8ed93c
  title: '윤슬 입출금통장: 다른 상품과의 비교와 맞지 않는 경우'
  body: '윤슬 입출금통장은 고객님의 일상적인 금융 생활을 지원하는 가장 기본적인 계좌입니다.


    본 상품이 가장 적합한 경우:

    - 매달 급여를 수령하고 생활비로 사용하시는 직장인 고객님

    - 각종 공과금, 통신비, 카드대금 등을 자동이체로 편리하게 관리하고 싶으신 분

    - 모바일 및 인터넷 뱅킹을 통해 다른 은행으로의 이체 수수료 0원 혜택을 누리고 싶으신 분


    본 상품이 적합하지 않은 경우:

    - 목돈을 예치하여 0.1%보다 더 높은 확정 금리를 통해 자산을 불리고 싶으신 분 → ''윤슬 정기예금''을 추천합니다.

    - 매월 일정 금액을 저축하여 미래의 목돈을 준비하고 싶으신 분 → ''윤슬 정기적금''을 추천합니다.


    입출금통장은 높은 유동성을 제공하는 대신 금리가 낮으므로, 자산의 성격(운영 자금 vs 저축 자금)에 따라 상품을 나누어 이용하시는 것이 효율적입니다.
    자세한 안내는 ''윤슬 입출금통장: 상품 개요''를 확인하십시오.'
