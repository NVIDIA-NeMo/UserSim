- id: 9c36cf0a-b3e2-5638-b35f-e59367886774
  title: '윤슬 주택담보대출: 이 상품을 사칭한 사기 주의'
  body: '최근 ''윤슬 주택담보대출''의 낮은 금리를 보장한다며 접근하여 개인정보나 금융정보를 요구하는 보이스피싱 및 스미싱 사기가 발생하고
    있습니다. 고객님께서는 다음의 주의 사항을 반드시 확인하시어 피해를 예방하시기 바랍니다.


    윤슬은행은 어떠한 경우에도 전화나 문자 메시지를 통해 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다.
    계좌 정보 조회나 상태 변경을 위해 고객님의 성함과 생년월일을 확인하는 절차는 있으나, 그 이상의 보안 정보는 절대 묻지 않습니다.


    만약 저금리 대환 대출이나 정부 지원 상품을 사칭하여 특정 앱 설치를 유도하거나 선입금을 요구한다면 이는 명백한 사기입니다. 즉시 대화를 중단하시고
    당행 고객센터로 신고하십시오. 보이스피싱 등 금융사기 피해가 발생한 경우에는 즉시 지급정지와 피해구제 신청을 지원하여 고객님의 소중한 자산을
    보호해 드리겠습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: security_advisory
  source_authority: official
