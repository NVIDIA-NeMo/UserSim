- id: 05b28c2b-f129-5817-aee9-c1bca9aecc3b
  title: '윤슬 주택담보대출: 진행 중인 이벤트'
  body: '윤슬은행에서 내 집 마련을 꿈꾸시는 고객님을 위해 ''주택금융 맞춤 상담 이벤트''를 진행하고 있습니다.


    현재 윤슬 주택담보대출은 변동금리 4.45%, 5년 혼합형 금리 4.65%의 경쟁력 있는 금리를 제공하고 있습니다. 특히 최장 40년의 대출
    기간을 통해 고객님의 월 상환 부담을 획기적으로 낮춰드리고 있습니다.


    지금 바로 상담을 통해 고객님의 소득과 자산 상황에 최적화된 대출 한도와 금리를 확인해 보십시오. 정성 어린 상담을 통해 가장 합리적인 자금
    계획을 세우실 수 있도록 도와드리겠습니다.


    ※ 본 안내는 상품의 일반적인 금리 수준을 안내하며, 실제 적용 금리는 심사 결과에 따라 달라질 수 있습니다.'
