- id: 59f0de18-2633-5a4a-91f8-7196a11c2b17
  title: '윤슬 체크카드: 이 상품을 사칭한 사기 주의'
  body: '최근 윤슬 체크카드의 혜택 안내나 카드 교체를 명목으로 고객님의 개인정보를 요구하는 사기 사례가 보고되고 있습니다. 윤슬은행은 어떠한
    경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 전화나 문자로 요구하지 않습니다.


    만약 윤슬 체크카드를 사칭하여 낮은 금리의 대출 전환이나 특별 캐시백 혜택을 제공한다며 개인정보나 송금을 요구한다면 즉시 전화를 끊으십시오.
    특히 ''보안 강화를 위해 카드 번호 전체가 필요하다''는 요청은 100% 사기입니다.


    보이스피싱 등 금융사기 피해가 의심되거나 이미 발생한 경우에는 즉시 당사 고객센터나 영업점으로 연락하여 지급정지와 피해구제 신청을 진행하시기
    바랍니다. 신속한 대응만이 소중한 자산을 보호하는 길입니다. 자세한 보안 수칙은 ''윤슬 체크카드: 안전한 이용을 위한 수칙''을 참고하십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e19886f6-28b2-5d15-b5fa-e727bea50354
  title: '윤슬 체크카드: 한도·제한과 유의사항'
  body: '윤슬 체크카드의 효율적인 이용을 위해 다음의 한도 및 제한 사항을 안내드립니다.


    1. 이용 한도 및 제한

    - 하루 이용한도(기본 설정): 6,000,000원입니다. 이 한도는 연결된 계좌의 잔액 범위 내에서만 적용됩니다.

    - 잔액 제한: 체크카드는 사용하는 즉시 연결된 예금계좌에서 대금이 출금되므로, 계좌 잔액을 초과하여 사용할 수 없습니다.


    2. 수수료 및 비용

    - 연회비: 0원으로 운영되어 별도의 유지 비용이 발생하지 않습니다.

    - 해외 이용 시: 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 각각 부과됩니다.


    3. 주요 유의사항

    - 본 카드는 ''윤슬 입출금통장''과 연결되어 사용됩니다. 예금자보호법에 따라 연결 계좌의 원금과 이자를 합해 1인당 최대 1억원까지 보호받으실
    수 있습니다.

    - 카드 분실 또는 도난 시 즉시 신고하여 사용을 정지하십시오. 신고 전후의 부정사용 보상은 관련 법령과 약관에 따르며, 비밀번호 유출 등
    고객의 중대한 과실이 있는 경우 보상이 제한될 수 있습니다.'
