  institution_id: yunseul_bank
- id: 1cc486f2-cfaa-5336-b84f-1df7352dc8c2
  title: '윤슬 직장인 신용대출: 처리가 끝나지 않거나 보류 중일 때'
  body: '대출 신청 후 ''심사 중'' 또는 ''보류'' 상태가 지속될 때의 해결 방법을 안내해 드립니다.


    [발생 가능한 원인]

    - 제출하신 소득 증빙 서류가 불분명하거나 누락된 경우

    - 신용 평가 기관의 정보 업데이트 지연으로 심사가 정체된 경우

    - 이용한도 최고액 100,000,000원 산정을 위한 추가 확인 사항이 발생한 경우


    [확인 및 해결 순서]

    1. 서류 보완 확인: 상담원에게 제출한 서류 중 보완이 필요한 항목이 있는지 확인하십시오. 누락된 서류가 있다면 즉시 추가 제출해 주십시오.

    2. 신용 상태 확인: 최근 신용 점수 변동이나 타 금융기관의 대출 실행 여부를 확인하십시오.

    3. 진행 상황 요청: 상담원에게 현재 심사 단계와 보류 사유에 대한 구체적인 설명을 요청하십시오.


    [에스컬레이션]

    상기 조치 후에도 처리가 지연되거나 사유가 불분명한 경우, 상담원은 해당 건을 책임자에게 에스컬레이션하여 신속히 처리하겠습니다. 책임자 검토
    후 3영업일 이내에 최종 처리 결과 또는 추가 안내를 받으실 수 있습니다.'
