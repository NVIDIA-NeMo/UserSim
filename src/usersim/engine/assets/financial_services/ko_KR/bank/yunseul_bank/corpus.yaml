  institution_id: yunseul_bank
- id: b1eb7318-0547-587f-b3cd-5f1c1cc905dd
  title: '윤슬 정기예금: 수수료 안내'
  body: '윤슬 정기예금 이용과 관련하여 발생하는 수수료를 안내해 드립니다.


    - 상품 가입 및 유지 수수료: 0원

    - 모바일 및 인터넷 뱅킹 이체 수수료: 0원

    - 종이 통장 재발급 수수료: 합리적인 실물 운영 비용 부과 (영업점 문의)

    - 영업시간 외 ATM 이용 수수료: 합리적인 실물 운영 비용 부과


    ※ 정기예금을 만기 전에 해지하실 경우 수수료가 부과되는 것은 아니나, 약정 금리보다 낮은 중도해지이율이 적용되어 이자 수익이 감소할 수 있음을
    유의하시기 바랍니다.'
