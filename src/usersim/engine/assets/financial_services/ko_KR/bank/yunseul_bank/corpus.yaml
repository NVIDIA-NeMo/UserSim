  institution_id: yunseul_bank
- id: 10d71ab5-e2dd-5272-a663-7e608729c679
  title: '윤슬 정기적금: 월 최대 납입액 안내'
  body: 'Q: 윤슬 정기적금에 매달 최대 얼마까지 저축할 수 있습니까?


    A: 윤슬 정기적금의 월 최대 납입액은 1,000,000원입니다. 고객님께서는 월 10,000원부터 1,000,000원 범위 내에서 자유롭게
    납입 금액을 설정하실 수 있습니다.


    Q: 월 납입액을 초과하여 입금하면 어떻게 됩니까?


    A: 월 최대 납입 한도인 1,000,000원을 초과하는 금액은 입금이 제한됩니다. 효율적인 자산 관리를 위해 한도 내에서 계획적인 저축을
    권장해 드립니다.


    더 자세한 상품 정보는 ''윤슬 정기적금: 상품 개요''를 참고하시기 바랍니다.'
