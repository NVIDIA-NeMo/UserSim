  institution_id: yunseul_bank
- id: dc7ec593-9ed6-54b1-9a19-6a78f01f2460
  title: '윤슬 체크카드: 진행 상황과 내역 확인'
  body: '윤슬 체크카드의 이용 내역과 결제 진행 상황을 확인하는 절차입니다.


    [준비 사항]

    - 본인 확인을 위한 성함과 생년월일


    [확인 절차]

    1. 상담원에게 윤슬 체크카드의 이용 내역 조회를 요청하십시오.

    2. 본인 확인을 위해 고객님의 성함과 생년월일을 말씀해 주십시오.

    3. 확인하고자 하는 조회 기간(예: 최근 1개월, 특정 날짜 등)을 요청하십시오.

    4. 상담원이 해당 기간 내의 결제 금액, 가맹점명, 결제 일시 및 현재 연결 계좌의 잔액을 안내해 드립니다.

    5. 안내받은 내역이 실제 이용하신 내용과 일치하는지 확인하십시오.


    만약 안내받은 내역 중 본인이 이용하지 않은 거래가 있거나 금액이 맞지 않는 경우에는 ''윤슬 체크카드: 명세서나 내역과 맞지 않을 때''의
    절차에 따라 즉시 조치를 요청하시기 바랍니다.'
  domain: cards
  product_category: yunseul_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 50c025b7-46e7-5e3c-aba8-516840d6a2c6
  title: '윤슬 체크카드: 거래가 거절되거나 제한되었을 때'
  body: '윤슬 체크카드 결제 시 ''잔액 부족'' 또는 ''한도 초과'' 등의 사유로 거래가 거절되는 경우 다음과 같이 확인하십시오.


    [증상 및 원인 확인]

    1. 계좌 잔액 부족: 체크카드는 연결 계좌의 잔액 범위 내에서만 사용 가능합니다. 연결된 ''윤슬 입출금통장''의 잔액이 결제 금액보다 적은지
    확인하십시오.

    2. 하루 이용한도 초과: 당일 총 결제 금액이 하루 이용한도(기본 설정)인 6,000,000원을 초과했는지 확인하십시오.

    3. 카드 상태 이상: 분실 신고가 되어 있거나, 유효기간 만료 또는 보안상의 이유로 일시 정지된 상태인지 확인하십시오.


    [해결 방법]

    - 잔액 부족 시: 연결 계좌로 자금을 이체하여 잔액을 충전하십시오.

    - 한도 초과 시: 다음 날 0시 이후에 다시 이용하시거나, 한도 변경 가능 여부를 상담원에게 확인하십시오.

    - 카드 상태 이상 시: 본인 확인(성함, 생년월일) 후 카드의 정지 상태를 해제하거나 재발급을 요청하십시오.


    위 조치 후에도 문제가 해결되지 않는 경우, 상담원이 상세 거래 로그를 분석하여 책임자에게 에스컬레이션하며 처리 결과를 안내해 드리겠습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d105e816-7bbf-5781-a70c-d09676d00f7c
  title: '윤슬 체크카드: 전환이나 상위 상품을 고려할 때'
  body: '윤슬 체크카드에서 신용카드나 다른 상위 상품으로의 전환을 고민하시는 고객님께 안내드립니다.


    윤슬 체크카드는 연회비 0원으로 유지 비용 부담이 없으며, 결제 즉시 계좌에서 대금이 출금되어 계획적인 소비가 가능합니다. 또한 총급여의 25%를
    초과하는 사용액에 대해 30%의 높은 소득공제율이 적용되는 실속형 상품입니다.


    반면, 신용 상품은 당장의 잔액과 관계없이 일정 한도 내에서 결제가 가능하고 대금 결제일을 뒤로 미룰 수 있는 유연성이 있습니다. 다만 신용카드는
    소득공제율이 15%로 체크카드보다 낮습니다.


    지출 통제와 세제 혜택을 중시하신다면 윤슬 체크카드를 유지하시고, 자금 운용의 유연성과 신용 거래 실적이 필요하시다면 신용 상품으로의 전환을
    추천드립니다.'
  domain: cards
  product_category: yunseul_check
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 657bd793-936b-54f7-b417-ade6d831a51f
  title: '윤슬 체크카드: 다른 상품과의 비교와 맞지 않는 경우'
  body: '윤슬 체크카드는 합리적인 소비를 지향하는 고객님께 최적화된 상품입니다. 하지만 다음과 같은 경우에는 다른 상품이 더 적합할 수 있습니다.


    1. 이런 분께는 추천하지 않습니다

    - 현재 계좌 잔액이 부족하지만 큰 금액을 먼저 결제해야 하는 분 (신용카드 추천)

    - 결제 대금을 특정 날짜에 한꺼번에 납부하여 자금 흐름을 관리하고 싶은 분 (신용카드 추천)


    2. 윤슬 체크카드만의 강점

    - 비용 효율성: 연회비가 0원으로, 유지 비용 없이 기본 기능을 모두 누리실 수 있습니다.

    - 세제 혜택: 연말정산 시 총급여의 25%를 초과하여 사용한 금액에 대해 30%의 소득공제율이 적용되어 신용카드(15%)보다 유리합니다.

    - 안전한 소비: 연결 계좌 잔액 내에서만 사용하므로 과소비를 원천적으로 방지할 수 있습니다.


    3. 주요 요율 요약

    - 캐시백 비율: 0.3%

    - 해외 이용 수수료: 국제브랜드 수수료율 1% + 해외서비스 수수료율 0.2%

    - 기본 하루 이용한도: 6,000,000원


    고객님의 소비 패턴이 즉시 출금 방식에 적합한지 검토하시어 최적의 상품을 선택하시기 바랍니다.'
