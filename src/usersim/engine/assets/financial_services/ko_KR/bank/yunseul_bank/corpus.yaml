- id: 59b723c1-f367-5944-b813-e8245996c181
  title: '윤슬 주택담보대출: 5년 혼합형 금리 안내'
  body: 'Q: 5년 혼합형 금리란 무엇이며, 현재 적용 금리는 얼마입니까?

    A: 5년 혼합형 금리는 대출 실행 후 초기 5년 동안은 고정금리가 적용되고, 이후에는 변동금리로 전환되는 상품입니다. 현재 적용되는 5년
    혼합형 금리는 4.65%입니다. 초기 5년간 금리 변동 없이 안정적으로 상환하시기를 원하는 고객님께 적합합니다.


    Q: 혼합형 금리를 이용하다가 변동금리로 변경할 수 있습니까?

    A: 금리 유형 변경 가능 여부 및 절차는 상세 약관에 따르며, 변경 시점의 시장 금리가 적용됩니다. 자세한 내용은 ''윤슬 주택담보대출:
    약관''을 참고하십시오.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 7cb47069-d40e-5a43-ae79-e995a1ef04d6
  title: '윤슬 주택담보대출: 해지·변경·상품 전환'
  body: '대출의 해지, 조건 변경 또는 상품 전환을 원하시는 경우 다음의 절차를 따르십시오.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 요청 사항 접수: 대출 해지(전액 상환), 금리 유형 변경, 또는 타 상품으로의 전환 중 원하시는 업무를 요청하십시오.

    3. 상환 금액 및 수수료 확인: 대출 해지나 일부 상환의 경우, 현재까지의 원리금 잔액과 중도상환수수료 발생 여부를 확인합니다. 대출일부터
    중도상환수수료를 받는 기간(대출일부터, 년)인 3년 이내에 상환하시는 경우 0.6%의 중도상환수수료율이 적용됨을 안내받으시게 됩니다.

    4. 상환 처리 및 완료: 연결된 입출금 계좌에서 원리금 및 수수료가 출금되며, 처리가 완료되면 대출 해지 또는 변경 확인서를 수령하시게 됩니다.


    만약 대출 실행 후 14일 이내에 청약을 철회하고자 하시는 경우에는 중도상환수수료 없이 원금과 이용 기간 이자만 상환하여 계약을 종료하실 수
    있습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d8f7361c-c4f3-506d-9d28-9ea3df8d1808
  title: '윤슬 주택담보대출: 예상과 다른 수수료나 금액'
  body: '고객님께서 생각하신 금액보다 더 많은 수수료나 상환금이 청구되었다고 느끼시는 경우, 다음 사항을 순서대로 확인해 주십시오.


    1. 중도상환수수료 발생 여부 확인: 대출 실행일로부터 아직 3년이 지나지 않았는지 확인하십시오. 중도상환수수료를 받는 기간(대출일부터, 년)인
    3년 이내에 원금을 상환할 경우 0.6%의 중도상환수수료율이 적용되어 상환 금액이 증가할 수 있습니다.

    2. 변동금리 적용 시점 확인: 변동금리(4.45%) 상품을 이용 중이시라면, 최근 금리 변동 주기에 따라 이자 금액이 조정되었을 가능성이
    있습니다.

    3. DSR 규제 및 한도 영향 확인: 대출 총액이 1억원을 초과하는 경우 DSR 규제가 적용되어 원리금 상환액이 산정되므로, 이 부분이 상환
    계획과 일치하는지 검토하십시오.


    위 사항을 확인했음에도 금액이 불명확한 경우, 당사에서 상세 내역을 재검토하여 안내해 드리겠습니다. 해결이 어려운 분쟁의 경우 금융감독원 금융분쟁조정위원회를
    통해 조정을 진행하실 수 있습니다.'
  domain: lending_mortgage
