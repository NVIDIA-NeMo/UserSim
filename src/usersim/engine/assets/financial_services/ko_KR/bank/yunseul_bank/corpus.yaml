- id: 2faa4bd0-7a13-50db-a923-23276414bd7b
  title: '윤슬 주택담보대출: 처리가 끝나지 않거나 보류 중일 때'
  body: '대출 신청 후 진행 상태가 ''심사 중''이거나 ''보류'' 상태로 오래 유지되는 경우, 다음 사항을 확인해 주십시오.


    [원인 확인 및 해결 방법]

    1. 제출 서류 미비: 소득 증빙 서류나 주민등록등본 등 필수 서류의 유효기간이 지났거나 누락된 경우입니다. 상담원에게 누락 서류가 있는지
    확인하신 후 추가 제출해 주십시오.

    2. DSR 한도 초과: 타 금융기관의 대출 원리금 상환액이 많아 은행권 DSR 기준인 40%를 초과한 경우 심사가 지연되거나 거절될 수 있습니다.
    현재 보유하신 타 대출 현황을 재점검하십시오.

    3. 담보 평가 지연: 주택 가치 평가 과정에서 추가 확인 사항이 발생한 경우입니다. 평가 기관의 확인 절차가 완료될 때까지 대기 시간이 발생할
    수 있습니다.


    [에스컬레이션]

    위 사항을 확인했음에도 처리 상태에 변동이 없거나 납득하기 어려운 보류 사유가 있는 경우, 상담원에게 요청하십시오. 담당 책임자가 해당 건을
    상세히 재검토하여 결과와 사유를 안내해 드리겠습니다.'
