  institution_id: yunseul_bank
- id: bc0b6e48-830c-5d87-811b-c21ff3402889
  title: '윤슬 입출금통장: 금리·요율이 정해지는 방식과 적용'
  body: '윤슬 입출금통장의 금리 및 수수료 적용 방식은 다음과 같습니다.


    1. 금리 적용: 본 상품의 입출금통장 금리는 연 0.1%로 고정되어 적용됩니다. 별도의 잔액 구간이나 우대 조건 없이 모든 고객에게 동일한
    금리가 적용되며, 시장 금리 상황에 따라 당행의 공지에 의해 변경될 수 있습니다.


    2. 수수료 결정 원칙:

    - 디지털 활성화 정책: 고객 편의와 디지털 금융 이용 장려를 위해 모바일 및 인터넷 뱅킹을 통한 다른 은행으로 이체 수수료는 0원으로 책정되었습니다.

    - 실물 비용 보전 원칙: 현금 인출기 운영 및 카드/통장 제작과 같이 물리적 비용이 발생하는 서비스에는 합리적인 수수료를 부과합니다. 이에
    따라 영업시간 외 ATM 출금 수수료 500원과 통장·카드 재발급 수수료 2,000원이 적용됩니다.


    모든 금리와 수수료는 관련 법령 및 당행 내부 규정에 따라 공정하게 결정됩니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: rate_sheet
