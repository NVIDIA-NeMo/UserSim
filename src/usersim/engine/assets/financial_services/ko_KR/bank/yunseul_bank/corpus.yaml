- id: cfa6a912-5893-52a8-ab87-bdb2a147e686
  title: '윤슬 정기예금: 거래가 거절되거나 제한되었을 때'
  body: "윤슬 정기예금 가입 또는 해지 과정에서 거래가 거절되는 경우, 다음의 원인을 확인해 보십시오.\n\n- 증상: '거래가 제한되었습니다'\
    \ 또는 '처리가 불가능합니다'라는 안내가 발생함\n\n- 예상 원인 및 체크리스트\n  1. 가입 금액 미달: 예치하시려는 금액이 최소 가입\
    \ 금액인 100,000원보다 적은지 확인하십시오.\n  2. 연결 계좌 잔액 부족: 예금으로 이체될 연결 입출금 계좌에 충분한 잔액이 있는지\
    \ 확인하십시오.\n  3. 실명 확인 미비: 금융실명법에 따른 실명 확인 절차가 완료되지 않았거나 정보가 불일치하는 경우 제한될 수 있습니다.\n\
    \  4. 계좌 상태 제한: 보이스피싱 등의 사고 예방을 위해 계좌가 일시 정지 상태인지 확인하십시오.\n\n- 해결 방법 및 에스컬레이션\n\
    \  위 사항을 확인한 후에도 문제가 지속되면, 저희가 즉시 계좌의 상세 상태를 조회하겠습니다. 필요시 책임자에게 에스컬레이션하여 제한 사유를\
    \ 분석하고 해제 절차를 안내해 드리겠습니다."
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 9790ce71-1eef-5e9d-8f5c-83a62239eb68
  title: '윤슬 정기예금: 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자산 상황에 따라 윤슬 정기예금에서 다른 저축 상품으로의 전환을 고려하실 수 있습니다.


    - 윤슬 정기예금: 이미 목돈을 보유하고 계신 분께 적합합니다. 100,000원 이상의 금액을 한 번에 예치하여 기간별로 3.4%(1년),
    3.3%(2년), 3.25%(3년)의 확정 금리를 통해 안정적으로 자산을 증식할 수 있습니다.


    - 윤슬 정기적금: 매월 일정 금액을 꾸준히 모아 목돈을 만들고자 하시는 분께 적합합니다. 소액부터 시작하여 저축 습관을 기르고 싶으신 경우에
    더 유리한 선택입니다.


    현재 일시금 형태의 자산을 안전하게 운용하시길 원하신다면 윤슬 정기예금을 유지하시는 것이 좋으며, 추가적인 적립 식 저축을 원하신다면 윤슬
    정기적금으로의 병행 가입을 추천드립니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: cf8c7364-f4a0-54b1-8306-f328f0eba2e9
  title: '윤슬 정기예금: 다른 상품과의 비교와 맞지 않는 경우'
  body: '윤슬 정기예금은 자산의 안정적 증식을 목적으로 하는 상품입니다. 고객님의 금융 목적에 맞는지 확인하십시오.


    1. 윤슬 입출금통장과의 비교

    - 윤슬 입출금통장: 언제든 입출금이 가능하여 일상적인 거래와 공과금 이체에 적합하지만, 금리가 매우 낮습니다.

    - 윤슬 정기예금: 일정 기간 자금을 묶어두어야 하지만, 기간에 따라 3.4%, 3.3%, 3.25%의 상대적으로 높은 금리를 제공받습니다.


    2. 이 상품이 맞지 않는 경우

    - 단기적으로 자금 사용 계획이 있어 언제든지 돈을 찾아야 하는 분께는 적합하지 않습니다. 만기 전 해지 시 중도해지이율이 적용되어 금리 혜택을
    충분히 누리실 수 없습니다.

    - 100,000원 미만의 소액으로 저축을 시작하시려는 분께는 최소 가입 금액 제한으로 인해 맞지 않을 수 있습니다.


    안정적인 금리 수익을 위해 목돈을 일정 기간 예치하실 수 있는 고객님께 가장 최적화된 상품입니다.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: bd89f993-ea9a-53c7-89ad-867d465a7d8f
  title: '윤슬 정기예금: 수수료와 비용'
  body: 'Q: 윤슬 정기예금에 가입하거나 유지할 때 내야 하는 수수료가 있습니까?


    A: 아니요, 윤슬 정기예금의 가입 및 유지에 따른 별도의 수수료는 부과되지 않습니다.


    Q: 만기 시 이자를 받을 때 비용이 발생하나요?


    A: 별도의 수수료는 없으나, 법정 세율에 따라 이자 소득의 15.4%(소득세 및 지방소득세 합산)가 원천징수된 후 세후 금액이 지급됩니다.


    더 자세한 비용 관련 안내는 ''윤슬 정기예금: 수수료 안내''를 참고해 주십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 460143ec-d4f4-58f4-8916-2a8fd6e4de93
  title: '윤슬 정기예금: 자주 하는 업무의 처리 절차'
  body: "윤슬 정기예금의 신규 가입 절차를 안내해 드립니다.\n\n1. 본인 확인: 고객님의 성함과 생년월일을 말씀해 주십시오. 실명 확인\
    \ 절차를 거쳐 가입 가능 상태인지 확인합니다.\n2. 가입 금액 결정: 예치하실 금액을 말씀해 주십시오. 최소 가입 금액인 100,000원\
    \ 이상이어야 합니다.\n3. 기간 및 금리 선택: 원하시는 예치 기간을 선택하십시오. 선택하신 기간에 따라 금리가 적용됩니다.\n   -\
    \ 1년 선택 시: 3.4%\n   - 2년 선택 시: 3.3%\n   - 3년 선택 시: 3.25%\n4. 자금 이체 및 확정: 연결된 입출금\
    \ 계좌에서 해당 금액이 예금 계좌로 이체되는 것에 동의하시면 가입이 완료됩니다.\n5. 완료 안내: 가입이 완료되면 새로운 정기예금 계좌번호와\
    \ 만기일을 안내해 드립니다."
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 054b080e-e1df-5904-9220-2cfdf54a54a1
  title: '윤슬 정기예금: 명세서나 내역과 맞지 않을 때'
  body: "고객님께서 예상하신 이자 금액이나 계좌 내역이 실제 명세서와 다를 때, 상담원은 다음 사항을 순차적으로 확인하십시오.\n\n- 증상:\
    \ \"적용 금리가 다르다\" 또는 \"이자가 생각보다 적게 들어왔다\"고 말씀하시는 경우\n\n- 확인 순서 및 해결책\n  1. 원천징수\
    \ 여부 확인: 고객님께서 세전 금액을 예상하셨는지 확인하십시오. 모든 이자에는 15.4%의 세금이 원천징수되어 차감됩니다.\n  2. 중도\
    \ 해지 여부 확인: 만기 전 해지하신 경우, 가입 시 안내된 3.4%, 3.3%, 3.25% 등의 약정 금리가 아닌 낮은 중도해지이율이 적용되었는지\
    \ 확인하십시오.\n  3. 과세 구분 확인: 종합과세 대상자(금융소득 연 2,000만원 초과)인지 확인하여 세금 적용 방식이 맞는지 검토하십시오.\n\
    \n- 에스컬레이션 절차\n  위의 확인 절차 후에도 금액 불일치가 발생한다면, 저희가 즉시 정밀 이자 계산 내역을 추출하겠습니다. 해결이\
    \ 어려운 경우 책임자에게 보고하여 정산 오류 여부를 검토하고, 최종 결과를 고객님께 안내해 드리겠습니다."
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: d80a83f6-53f3-5f2a-b29e-8e00a981c9af
  title: '윤슬 정기적금: 상품 개요'
  body: '윤슬 정기적금은 매월 일정 금액을 꾸준히 적립하여 고객님의 소중한 목돈 마련을 돕는 대표적인 저축 상품입니다. 안정적인 자산 증식을
    원하는 개인 고객 및 직장인 고객님께 최적화된 상품입니다.


    본 상품의 주요 내용은 다음과 같습니다.

    - 금리: 12개월 가입 시 연 3.6%의 금리를 제공합니다.

    - 납입 금액: 월 최소 10,000원부터 최대 1,000,000원까지 자유롭게 설정하여 납입하실 수 있습니다.

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호받으실 수 있습니다.


    꾸준한 저축 습관을 통해 미래를 설계하시고자 하는 고객님께 추천드립니다. 자세한 금리 정보는 ''윤슬 정기적금: 금리·요율 안내''에서 확인하시기
    바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e81bfbd5-85cb-566c-acd5-e2c74f583f91
  title: '윤슬 정기적금: 12개월 적금 금리 안내'
  body: '질문: 윤슬 정기적금 12개월 상품의 적용 금리는 얼마입니까?

    답변: 윤슬 정기적금 12개월 상품의 금리는 연 3.6%입니다. 해당 금리는 가입 기간 동안 적용되어 만기 시 원금과 함께 이자로 지급됩니다.


    질문: 금리 적용 시 주의할 점이 있습니까?

    답변: 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한, 이자와 배당을 합한 금융소득이 연 2,000만원을
    초과할 경우 다른 소득과 합산하여 종합과세 대상이 됨을 유의하시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e929da8a-a9fd-5269-9aa0-9666ddd11465
  title: '윤슬 정기적금: 가입과 이용 시작'
  body: '윤슬 정기적금 가입을 위해 다음의 절차를 진행해 주십시오.


    1. 본인 확인 단계: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 개인정보 보호법에 따라 본인 확인이 완료되어야 상품 가입이 가능합니다.

    2. 상품 선택 및 금액 설정: ''윤슬 정기적금'' 가입을 요청하시고, 매월 납입하실 금액을 결정하십시오. 월 납입액은 10,000원 이상
    1,000,000원 이하 범위 내에서 설정하셔야 합니다.

    3. 실명 확인 및 계좌 개설: 금융실명법에 따라 실명 확인 절차를 거친 후 적금 계좌를 개설합니다.

    4. 가입 완료 확인: 상담원이 최종 가입 내역(납입 금액, 적용 금리 연 3.6%, 만기일 등)을 안내해 드리며, 이를 확인하시면 가입이
    완료됩니다.


    가입 전 상세 조건은 ''윤슬 정기적금: 가입 대상''에서 확인하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: fcbd054b-8187-5471-a481-fc4d6b7afac6
  title: '윤슬 정기적금: 수수료 안내'
  body: '윤슬 정기적금 이용과 관련한 수수료 안내입니다.


    - 적금 계좌 개설 및 유지 수수료: 0원

    - 월 정기 납입 수수료: 0원

    - 모바일 및 인터넷 뱅킹을 통한 이체 수수료: 0원


    단, 통장 재발급이나 영업시간 외 ATM 이용과 같이 실물 운영 비용이 발생하는 서비스에 대해서는 은행의 기본 수수료 정책에 따라 합리적인
    수수료가 부과됩니다. 상세 내용은 ''수수료·요금 안내''를 참고하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: fee_schedule
