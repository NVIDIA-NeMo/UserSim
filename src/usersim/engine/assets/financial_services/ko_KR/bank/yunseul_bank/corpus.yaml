  institution_id: yunseul_bank
- id: 7cb8f02d-c599-53b5-847f-5cdb3ef7c82a
  title: '윤슬 체크카드: 캐시백 비율 안내'
  body: '문: 윤슬 체크카드를 사용하면 얼마나 캐시백을 받을 수 있습니까?


    답: 윤슬 체크카드의 캐시백 비율은 0.3%입니다. 고객님께서 카드를 사용하여 결제하신 금액의 0.3%가 정해진 기준에 따라 적립 또는 환급됩니다.


    캐시백 적용 대상 가맹점 및 구체적인 지급 시기는 ''윤슬 체크카드: 상품 개요''에서 확인하실 수 있습니다.'
