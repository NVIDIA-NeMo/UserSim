- id: e1985872-dbca-5746-8aeb-229cbc26e005
  title: '윤슬 직장인 신용대출: 이 상품을 사칭한 사기 주의'
  body: '최근 윤슬 직장인 신용대출의 낮은 금리를 미끼로 고객님의 개인정보와 금융 정보를 가로채려는 사기 시도가 증가하고 있습니다. 특히 ''정부
    지원 저금리 대환 대출''이나 ''특별 승인 한도 증액''을 빙자한 문자 메시지나 전화에 각별히 주의하시기 바랍니다.


    윤슬은행은 어떠한 경우에도 전화나 메시지를 통해 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지
    않습니다. 만약 대출 심사를 위해 특정 앱 설치를 유도하거나, 기존 대출 상환을 위한 선입금을 요구한다면 이는 100% 금융사기입니다.


    보이스피싱 등 금융사기가 의심되거나 피해가 발생한 경우에는 즉시 윤슬은행 고객센터나 가까운 영업점에 연락하여 계좌 지급정지를 요청하시고 피해구제
    신청을 진행하십시오. 빠른 조치가 피해를 최소화하는 최선의 방법입니다.'
  domain: lending_mortgage
