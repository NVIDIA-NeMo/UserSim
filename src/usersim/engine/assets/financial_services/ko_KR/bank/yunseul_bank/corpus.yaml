- id: 1ce56b8c-8b9a-5c34-a009-cc0fd6741826
  title: '윤슬 체크카드: 추천·장기 이용 혜택'
  body: '윤슬은행과 함께하는 스마트한 금융 생활의 시작, 윤슬 체크카드를 추천합니다. 2026년 2월 1일부터 2026년 4월 30일까지 신규로
    가입하시는 고객님께는 특별한 혜택을 제공합니다.


    가장 큰 매력은 바로 실속 있는 캐시백입니다. 이용 금액의 0.3%를 캐시백 비율로 적용하여 돌려드려, 쓰면 쓸수록 자산이 쌓이는 즐거움을
    드립니다. 또한 연회비가 0원인 상품으로, 유지 비용 부담 없이 평생 편리하게 이용하실 수 있습니다.


    지금 바로 가입하시고 윤슬은행만의 안정적인 금융 서비스를 경험하십시오.'
  domain: cards
