- id: 8a6aaa59-5d0c-53be-a005-1dcbc5dfce81
  title: '윤슬 직장인 신용대출: 당사의 비슷한 상품과의 비교'
  body: '윤슬은행의 대표적인 대출 상품인 ''윤슬 직장인 신용대출''과 ''윤슬 주택담보대출''을 비교해 드립니다.


    | 구분 | 윤슬 직장인 신용대출 | 윤슬 주택담보대출 |

    | :--- | :--- | :--- |

    | 담보 필요 여부 | 없음 (개인 신용) | 있음 (주택 담보) |

    | 이용한도 | 최고 100,000,000원 | 주택 가치 및 LTV에 따라 결정 |

    | 자금 조달 속도 | 매우 신속함 | 담보 평가로 인해 상대적으로 느림 |

    | 주 목적 | 단기/중기 자금 마련 | 장기적 주택 자금 조달 |


    [추천 대상]

    - 빠른 자금 마련이 필요하고 신용도가 우수한 직장인 고객님께는 ''윤슬 직장인 신용대출''을 추천합니다.

    - 장기간 안정적으로 거액의 자금을 조달하여 주택을 구입하시려는 고객님께는 ''윤슬 주택담보대출''이 더 적합합니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 5ff1d939-5faa-5cdb-aba3-33d0d2a463cd
  title: '윤슬 직장인 신용대출: 상품설명서 주요 내용'
  body: '본 상품은 금융소비자 보호에 관한 법률 및 관련 법령을 준수하며, 주요 고지 사항은 다음과 같습니다.


    [청약 철회권]

    고객님은 대출 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과 이용 기간의
    이자, 인지세 등 제3자에게 지불한 비용만 반환하며 중도상환수수료는 면제됩니다.


    [한도 및 규제]

    대출 총액이 1억원을 초과하는 경우, 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행권 DSR 기준인 연소득의 40%를 초과할 수 없으며,
    한도 산정 시 스트레스 금리가 반영됩니다.


    [금리 및 비용]

    - 법정 최고금리는 연 20%를 초과할 수 없습니다.

    - 중도상환수수료율은 0.1%이며, 대출일부터 3년이 경과하면 부과되지 않습니다.

    - 연체 시 약정금리에 최대 3%p를 더한 수준으로 연체이자가 부과되며, 이 또한 연 20%를 넘을 수 없습니다.


    [기타 고지]

    본 상품은 예금보험공사의 보호 대상이 아니며, 대출 상환이 어려우신 경우 채무조정 제도를 안내받으실 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_sinyong
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: ff98e0e2-f894-5315-baac-ddd306900150
  title: '윤슬 직장인 신용대출: 금리·요율 안내'
  body: '윤슬 직장인 신용대출의 금리 체계를 안내해 드립니다.


    [적용 금리]

    - 대출 금리(연, 하한): 4.7%

    - 대출 금리(연, 상한): 6.5%


    [금리 결정 요인]

    최종 금리는 아래의 요소를 종합적으로 평가하여 결정됩니다.

    - 고객님의 개인 신용점수 및 내부 신용등급

    - 증빙된 연소득 수준 및 재직 기간

    - 당행 거래 실적 및 우대 금리 조건 적용 여부


    [금리 변동 및 조정]

    - 금리인하요구권: 취업, 승진, 소득 증가 등 신용 상태가 개선된 경우, 고객님은 금리를 낮춰달라고 요청할 수 있는 권리가 있습니다.

    - 금리 변동: 시장 금리 상황에 따라 적용 금리가 변동될 수 있으며, 변동 주기와 방식은 계약 시 체결한 약관에 따릅니다.'
