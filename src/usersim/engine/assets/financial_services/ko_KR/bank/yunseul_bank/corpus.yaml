- id: ad67fc66-0277-5cac-a545-5dbab5004f6e
  title: '윤슬 입출금통장: 약관'
  body: '본 약관은 윤슬 입출금통장의 이용 조건과 권리 및 의무를 규정합니다.


    1. 금리 및 이자 지급: 본 계좌의 입출금통장 금리는 연 0.1%가 적용됩니다. 이자는 약정된 기일에 계산되어 지급되며, 관련 법령에 따라
    이자 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다.


    2. 수수료 부담: 고객은 서비스 이용에 따른 수수료를 부담할 의무가 있습니다. 모바일 및 인터넷 뱅킹을 통한 다른 은행으로 이체 수수료는
    0원으로 운영됩니다. 다만, 실물 운영 비용이 발생하는 통장·카드 재발급 수수료 2,000원과 영업시간 외 ATM 출금 수수료 500원은 고객이
    부담하십시오.


    3. 계좌의 유지 및 해지: 고객은 언제든지 계좌를 해지할 수 있으며, 해지 시 미지급 이자를 정산받습니다. 당사는 법령 및 약관에 따라 부득이한
    경우 계좌 이용을 제한할 수 있습니다.


    4. 책임 및 면책: 당사는 개인정보 보호법을 준수하며, 고객의 고의 또는 중대한 과실로 인한 사고에 대해서는 보상이 제한될 수 있습니다.
    모든 분쟁은 공정하게 처리하며, 해결이 어려운 경우 금융감독원 금융분쟁조정위원회를 통해 조정을 진행합니다.'
