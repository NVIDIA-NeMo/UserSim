  institution_id: yunseul_bank
- id: 1ea26fdd-cc7a-5a9b-b427-c37bedf00d79
  title: '윤슬 체크카드: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산을 보호하기 위해 보안 시스템을 운영하고 있습니다. 최근 체크카드를 대상으로 한 보이스피싱 및 개인정보
    탈취 시도가 증가하고 있으니 각별한 주의를 부탁드립니다.


    윤슬은행의 상담원은 어떤 경우에도 고객님의 비밀번호, 카드번호, CVV, PIN, 주민등록번호 전체 또는 추가 인증 수단을 요구하지 않습니다.
    만약 이러한 정보를 요구하는 전화를 받으셨다면 즉시 통화를 종료하십시오.


    카드 분실이나 도난, 또는 본인이 사용하지 않은 결제 내역을 확인하신 경우, 즉시 윤슬은행에 신고하여 카드 사용 정지를 요청하십시오. 신고
    접수 전후의 부정사용 보상은 관련 법령과 카드 약관에 따라 처리되나, 비밀번호를 타인에게 알려주는 등 고객님께 고의나 중대한 과실이 있는 경우에는
    보상이 제한될 수 있음을 유의하시기 바랍니다.


    금융사기 피해가 의심될 때는 즉시 지급정지와 피해구제 신청을 통해 피해를 최소화하십시오. 자세한 내용은 ''법령·제도 안내: 체크카드''에서
    확인하실 수 있습니다.'
  domain: cards
  product_category: yunseul_check
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 73790f48-2f7f-5504-83f7-14c19a690a3a
  title: '윤슬 체크카드: 약관'
  body: '본 약관은 윤슬 체크카드의 이용 조건 및 서비스 제공에 관한 사항을 규정합니다.


    1. 서비스 이용 및 비용: 본 상품의 연회비는 0원으로, 고객님은 별도의 연간 유지 비용 없이 카드를 이용하실 수 있습니다.

    2. 이용 한도: 기본 설정된 하루 이용한도는 6,000,000원입니다. 고객님은 본인의 필요에 따라 한도 변경을 요청하실 수 있으며, 변경된
    한도 내에서만 결제가 가능합니다.

    3. 결제 방식: 체크카드는 결제 즉시 연결된 예금계좌에서 대금이 출금되는 상품입니다. 따라서 계좌 잔액을 초과하여 사용할 수 없습니다.

    4. 혜택 및 정산: 결제 금액에 대해 0.3%의 캐시백 비율이 적용되며, 이는 약관이 정한 기준에 따라 적립 및 지급됩니다.

    5. 계약의 종료: 고객님은 언제든지 카드 해지를 요청하여 계약을 종료할 수 있습니다. 카드 해지 시 연결된 계좌의 잔액에는 영향을 주지 않으나,
    카드의 모든 혜택은 즉시 소멸됩니다.

    6. 면책 사항: 카드 분실 시 즉시 신고하지 않아 발생한 손실이나, 고객의 중대한 과실로 인한 부정사용에 대해서는 은행의 책임이 제한됩니다.'
  domain: cards
  product_category: yunseul_check
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 5cab3d2e-3d5a-58ae-99e1-0f93b73f3902
  title: '윤슬 체크카드: 이런 분께 알맞습니다'
  body: '윤슬 체크카드는 불필요한 지출을 줄이고 계획적인 소비를 지향하는 스마트한 직장인과 개인 고객님께 최적화된 상품입니다.


    다음과 같은 분들께 추천드립니다:

    - 연회비 부담 없이 실속 있게 카드를 이용하고 싶으신 분 (연회비: 0원)

    - 매번 결제할 때마다 일정 금액이 적립되는 혜택을 원하시는 분 (캐시백 비율: 0.3%)

    - 하루 최대 6,000,000원까지 넉넉한 기본 이용한도로 편리하게 쇼핑하고 싶으신 분

    - 연말정산 시 소득공제 혜택을 극대화하고 싶으신 분 (총급여의 25% 초과 사용분에 대해 30% 소득공제율 적용)


    윤슬 체크카드는 연결된 계좌의 잔액 범위 내에서만 결제가 이루어지므로 과도한 소비를 방지할 수 있으며, 안정적인 자산 관리를 돕습니다. 가입을
    원하시거나 더 자세한 안내가 필요하시면 언제든 말씀해 주십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 31d5c251-2846-58c0-91ef-85e924792ced
  title: '윤슬 체크카드: 해외 이용 시 국제브랜드 수수료율 안내'
  body: 'Q: 윤슬 체크카드로 해외에서 결제할 때 발생하는 브랜드 수수료는 얼마인가요?

    A: 윤슬 체크카드를 해외에서 이용하실 경우, 국제브랜드 수수료율 1%가 적용됩니다. 이는 결제 금액에 부과되는 수수료입니다.


    Q: 국제브랜드 수수료 외에 다른 수수료가 추가로 붙나요?

    A: 네, 국제브랜드 수수료 외에 해외서비스 수수료율 0.2%가 별도로 부과됩니다.


    Q: 해외 이용 시 총 수수료는 어떻게 계산되나요?

    A: [결제 금액 × (국제브랜드 수수료율 1% + 해외서비스 수수료율 0.2%)]의 방식으로 합산되어 부과됩니다.


    더 자세한 수수료 체계는 ''윤슬 체크카드: 수수료 안내''에서 확인하십시오.'
  domain: cards
  product_category: yunseul_check
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: fec8a374-1ab9-5d5d-88ff-e74f7e3fc133
  title: '윤슬 체크카드: 해지·변경·상품 전환'
  body: '윤슬 체크카드의 해지, 카드 정보 변경, 또는 다른 상품으로의 전환을 원하시는 경우 다음 절차를 따라주십시오.


    1. 본인 확인: 상담원에게 성함과 생년월일을 말씀해 주십시오. 저희가 고객님의 신원을 확인한 후 다음 단계를 진행합니다.

    2. 요청 사항 전달: 카드의 완전 해지, 카드 디자인 변경, 또는 다른 종류의 체크카드로의 상품 전환 중 원하시는 업무를 말씀하십시오.

    3. 세부 사항 확인: 상품 전환의 경우, 새로운 카드의 혜택과 이용 한도(기본 6,000,000원) 등을 안내받으시고 동의 여부를 결정하십시오.

    4. 처리 완료 및 확인: 요청하신 업무가 시스템에 반영되면 상담원이 최종 처리 결과를 안내해 드립니다. 해지된 카드는 가위로 마그네틱 선을
    잘라 폐기하십시오.


    상품 전환 시 기존에 연결되어 있던 계좌는 그대로 유지되며, 새로운 카드의 발급 기간 동안 기존 카드의 사용 가능 여부는 선택하신 옵션에 따라
    달라집니다.'
  domain: cards
  product_category: yunseul_check
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: a0a6c7a7-ed0c-5ae6-aa44-85921f7be605
  title: '윤슬 체크카드: 예상과 다른 수수료나 금액'
  body: '고객님께서 결제 금액이나 부과된 수수료가 예상과 다르다고 말씀하시는 경우, 다음 단계에 따라 원인을 파악하고 조치하십시오.


    **증상: 해외 결제 후 계좌에서 예상보다 많은 금액이 출금됨**


    **원인 및 확인 순서**

    1. 해외 이용 수수료 확인: 해외 결제 시에는 상품 가격 외에 국제브랜드 수수료율 1%와 해외서비스 수수료율 0.2%가 합산되어 부과됩니다.
    결제 금액에 총 1.2%의 수수료가 추가되었는지 확인하십시오.

    2. 환율 변동 확인: 결제 시점과 실제 전표가 매입되는 시점의 환율 차이로 인해 원화 환산 금액이 달라질 수 있습니다.


    **해결 방법**

    - 수수료 계산이 정확함에도 금액이 다른 경우, 가맹점의 중복 결제나 청구 오류인지 확인하기 위해 거래 내역 조사를 요청하십시오.


    **에스컬레이션**

    - 고객님께서 수수료 산정 방식에 동의하지 않으시거나, 명백한 오청구로 판단되어 분쟁 해결이 필요한 경우, 담당 책임자에게 사례를 에스컬레이션하여
    정밀 조사를 진행하고 결과를 안내해 드립니다.'
  domain: cards
  product_category: yunseul_check
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: e39300eb-744b-53ae-a184-4e297c0fbd49
  title: '윤슬 체크카드: 필요 서류'
  body: '| 구분 | 필요 서류 | 비고 |

    | :--- | :--- | :--- |

    | 개인 고객 (내국인) | 본인 신분증 (주민등록증, 운전면허증 등) | 실명확인법에 따른 본인 확인 용도 |

    | 개인 고객 (외국인) | 외국인등록증 또는 여권 | 실명 확인 및 거주지 증빙 |

    | 미성년자 | 법정대리인 동의서, 가족관계증명서, 보호자 신분증 | 법정대리인 확인 필수 |

    | 법인 고객 | 사업자등록증, 법인인감증명서, 대표자 신분증 | 법인 계좌 연결 필수 |'
  domain: cards
