- id: 6ff5bc31-9d77-5f3e-a56a-4f49c96fb749
  title: '윤슬 정기적금: 상품 고르는 방법'
  body: '목돈 마련을 위해 ''윤슬 정기적금''과 ''윤슬 정기예금'' 중 고민하시는 고객님을 위한 안내입니다.


    [상품별 특성 비교]

    - 윤슬 정기적금: 매월 10,000원부터 1,000,000원까지 일정 금액을 꾸준히 납입하여 목돈을 만드는 상품입니다. 12개월 금리 3.6%가
    적용되어 저축 습관을 기르기에 적합합니다.

    - 윤슬 정기예금: 이미 보유하신 목돈을 한 번에 예치하여 확정된 금리로 안전하게 자산을 증식하는 상품입니다.


    [추천 대상]

    - 사회초년생이나 직장인처럼 매달 소득의 일부를 저축하여 미래 자금을 마련하고 싶으신 분께는 ''윤슬 정기적금''을 추천합니다.

    - 이미 일정 금액의 자산을 보유하고 있으며, 이를 안전하게 보관하며 이자 수익을 얻고자 하시는 분께는 ''윤슬 정기예금''이 더 유리한 선택입니다.


    고객님의 현재 자산 상황과 재무 목표에 따라 적절한 상품을 선택하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 25c263ed-2373-5fa8-b9ec-dcdc4a34279b
  title: '윤슬 정기적금: 개인정보 처리 안내'
  body: '윤슬은행은 개인정보 보호법 및 관련 법령을 엄격히 준수하여 고객님의 소중한 개인정보를 처리하고 있습니다.


    [개인정보 수집 및 이용 목적]

    윤슬 정기적금 계좌 개설, 유지, 만기 처리 및 본인 확인을 위해 고객님의 성함, 생년월일, 연락처 등의 정보를 수집합니다. 이는 금융실명법에
    따른 실명 확인 및 금융위원회, 금융감독원의 감독 규정을 준수하기 위함입니다.


    [정보 처리 원칙]

    - 주민등록번호는 법령이 허용하는 경우에 한하여 최소한으로 처리합니다.

    - 수집된 정보는 서비스 제공 목적 외에 무단으로 제3자에게 제공하지 않습니다.

    - 고객님께서는 언제든지 자신의 개인정보 조회 및 정정을 요청하실 수 있습니다.


    [보안 조치]

    윤슬은행은 개인정보의 분실, 도난, 유출을 방지하기 위해 기술적, 관리적 보호 조치를 시행하고 있습니다. 계좌 정보 변경 전에는 반드시 성함과
    생년월일을 통해 본인 확인을 거치며, 비밀번호나 PIN 등은 절대 수집하지 않습니다.


    개인정보 처리에 관한 상세 내용은 당행의 개인정보 처리방침 전문을 통해 확인하십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 1a8f1cba-be33-5997-8777-2d25f43d4e21
  title: '윤슬 정기적금: 이 상품을 사칭한 사기 주의'
  body: '최근 윤슬 정기적금의 높은 금리를 미끼로 고객님의 개인정보나 자금을 요구하는 사기 사례가 발생하고 있어 각별한 주의를 당부드립니다.


    윤슬은행은 어떠한 경우에도 고객님께 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다. 특히 ''특별
    우대금리 적용''이나 ''한도 증액''을 명목으로 외부 링크 클릭을 유도하거나 개인정보 입력을 요청하는 문자 메시지, 메신저 내용은 사기일
    가능성이 매우 높으므로 즉시 삭제하십시오.


    만약 보이스피싱 등 금융사기 피해가 발생했거나 의심되는 정황이 있다면, 지체 없이 당행 고객센터나 가까운 영업점에 연락하여 즉시 지급정지와
    피해구제 신청을 진행하시어 피해를 최소화하시기 바랍니다.


    안전한 금융 거래를 위해 고객님의 소중한 자산을 보호하는 데 최선을 다하겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: a5cd4773-570d-5092-8456-8005623dac37
  title: '윤슬 정기적금: 한도·제한과 유의사항'
  body: '윤슬 정기적금의 가입 및 운영과 관련된 주요 한도와 제한 사항은 다음과 같습니다.


    1. 납입 금액 한도

    - 월 최소 납입액: 10,000원

    - 월 최대 납입액: 1,000,000원


    2. 금리 및 기간

    - 12개월 적금 금리: 3.6%


    3. 주요 유의사항

    - 중도 해지: 만기 전에 계좌를 해지할 경우, 약정 금리가 아닌 중도해지이율이 적용되어 수령하시는 이자가 감소할 수 있습니다.

    - 세금 징수: 이자 소득 발생 시 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 또한 이자와 배당을 합한 금융소득이 연 2,000만원을
    초과하는 경우 다른 소득과 합산하여 종합과세 대상이 됩니다.

    - 예금자 보호: 본 상품은 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.


    상담 시 고객님께 위 한도와 세제 관련 사항을 명확히 안내하여 주십시오.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 24dd4997-ab68-56db-a09b-c5c9d6558894
  title: '윤슬 정기적금: 수수료와 비용'
  body: 'Q: 윤슬 정기적금을 이용할 때 발생하는 수수료가 있습니까?

    A: 적금 가입 및 납입 과정에서 발생하는 기본 수수료는 없습니다. 특히 고객 편의를 위해 모바일 앱과 인터넷 뱅킹을 통한 이체 수수료는 0원으로
    운영하고 있습니다.


    Q: 통장을 재발급받으려면 비용을 내야 하나요?

    A: 네, 통장 재발급과 같이 실물 운영 비용이 발생하는 서비스에 대해서는 당행 기준에 따른 합리적인 수수료가 부과됩니다.


    Q: 이자에서 차감되는 비용이 있습니까?

    A: 관련 법령에 따라 이자 소득에 대해 15.4%의 세율로 소득세와 지방소득세가 원천징수된 후 지급됩니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 39b9635b-5915-508a-a749-6affd8eaff40
  title: '윤슬 정기적금: 진행 상황과 내역 확인'
  body: '윤슬 정기적금의 현재 납입 현황과 상세 거래 내역을 확인하는 절차는 다음과 같습니다.


    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오.

    2. 상품 조회 요청: 확인하고자 하는 윤슬 정기적금 계좌번호를 알려주시면 당행에서 해당 계좌의 상태를 조회합니다.

    3. 내역 확인: 상담원이 현재까지의 총 납입 금액, 적용 금리(12개월 기준 3.6%), 그리고 다음 납입 예정일을 안내해 드립니다.

    4. 상세 내역 요청: 특정 기간의 납입 일자와 금액을 확인하고 싶으신 경우, 해당 기간을 말씀해 주시면 상세 거래 내역을 확인하여 안내해
    드립니다.


    위 절차를 통해 고객님께서는 적금의 만기 달성 가능 여부와 자산 증식 상황을 정확하게 파악하실 수 있습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 0a77f5c0-b22a-5259-9df0-a15a4cf0a78c
  title: '윤슬 정기적금: 거래가 거절되거나 제한되었을 때'
  body: '적금 납입 중 거래가 거절되거나 제한되는 경우, 다음의 원인을 확인하시기 바랍니다.


    - 납입 금액 한도 초과: 월 최대 납입액인 1,000,000원을 초과하여 입금하려 하신 경우 거래가 거절됩니다. 월 납입액이 한도 내에 있는지
    확인하십시오.

    - 연결 계좌 잔액 부족: 자동이체 또는 수동 납입 시 연결된 입출금 계좌의 잔액이 납입하려는 금액보다 적은지 확인하십시오.

    - 계좌 상태 이상: 장기간 거래가 없어 휴면 계좌로 전환되었거나, 사고 신고 등으로 인해 지급정지 상태인 경우 거래가 제한됩니다.


    해결 방법:

    - 한도 초과 시: 월 최대 납입액인 1,000,000원 이하로 금액을 조정하여 다시 시도하십시오.

    - 잔액 부족 시: 연결 계좌에 충분한 금액을 입금한 후 다시 납입하십시오.

    - 상태 이상 시: 성함과 생년월일을 통해 본인 확인 후, 계좌의 제한 사유를 확인하고 필요한 서류를 갖추어 제한 해제를 요청하십시오.


    위 조치 후에도 문제가 지속될 경우, 상담원이 내부 책임자에게 해당 건을 에스컬레이션하여 정밀 조사를 진행하겠습니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 066ac9f0-ab15-5418-b59a-f88861514710
  title: '윤슬 정기적금: 전환이나 상위 상품을 고려할 때'
  body: '고객님의 자산 관리 목적에 따라 윤슬 정기적금에서 윤슬 정기예금으로의 전환 또는 상품 선택이 필요할 수 있습니다.


    - 윤슬 정기적금: 매월 10,000원에서 1,000,000원까지 일정 금액을 꾸준히 적립하여 목돈을 만드는 것이 목적입니다. 12개월 가입
    시 3.6%의 금리가 적용되어 소액으로 저축 습관을 기르려는 직장인과 개인 고객에게 적합합니다.

    - 윤슬 정기예금: 이미 보유하신 목돈을 한 번에 예치하여 안전하게 자산을 증식하는 것이 목적입니다. 적금과 달리 추가 납입이 없으며, 큰
    금액을 확정 금리로 운영하고자 하는 고객님께 유리합니다.


    현재 소액을 꾸준히 모으는 단계라면 윤슬 정기적금을 유지하시고, 목표하신 목돈이 마련되었다면 이를 윤슬 정기예금으로 전환하여 효율적으로 운용하시기를
    권장합니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 363c687d-2b01-585f-99ab-02b77b66c315
  title: '윤슬 정기적금: 다른 상품과의 비교와 맞지 않는 경우'
  body: '윤슬 정기적금은 성실한 저축을 통해 목돈을 마련하고자 하는 고객님께 최적화된 상품입니다. 하지만 다음과 같은 상황에서는 다른 상품이
    더 적합할 수 있습니다.


    1. 즉각적인 자금 유동성이 필요한 경우

    적금은 만기까지 자금을 예치하는 상품입니다. 급전이 필요하여 만기 전에 해지하시면 중도해지이율이 적용되어 3.6%(12개월 기준)의 약정 금리보다
    훨씬 낮은 이자를 받게 됩니다. 이 경우 윤슬 입출금통장의 활용을 권장합니다.


    2. 이미 상당한 액수의 목돈을 보유하고 있는 경우

    매월 최대 1,000,000원까지만 납입 가능하므로, 이미 보유한 큰 자산을 한 번에 운용하여 이자 수익을 극대화하고 싶으시다면 윤슬 정기예금이
    더 적합합니다.


    3. 납입 가능 금액이 매우 적은 경우

    본 상품의 월 최소 납입액은 10,000원입니다. 이보다 낮은 금액으로 저축하시려는 경우에는 상품 가입이 제한됩니다.


    고객님의 재무 상태와 자금 운용 계획에 맞춰 가장 적합한 상품을 선택하시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: 2cebdef8-96cd-526e-821b-b852099e1748
  title: '윤슬 정기적금: 가입과 이용 조건'
  body: 'Q: 가입을 위해 특별한 조건이 있습니까?

    A: 실명확인이 완료된 고객님이라면 누구나 가입하실 수 있습니다. 계좌 개설 시 금융실명법에 따른 실명확인 절차가 반드시 필요합니다.


    Q: 매월 얼마씩 입금해야 하나요?

    A: 월 최소 10,000원부터 최대 1,000,000원 범위 내에서 자유롭게 설정하여 납입하실 수 있습니다.


    Q: 가입 기간 중 납입 금액을 변경할 수 있습니까?

    A: 네, 가능합니다. 다만 변경 후에도 월 최소 10,000원과 월 최대 1,000,000원의 한도 범위 내에서만 설정이 가능합니다.'
  domain: retail_banking
  product_category: yunseul_jeokgeum
  document_type: faq
  source_authority: official
