- id: b0f56c05-18e5-5ee9-b7fe-6e788f48cc29
  title: '윤슬 정기예금: 상품 개요'
  body: '윤슬 정기예금은 목돈을 안전하게 예치하여 확정된 금리로 자산을 증식하고자 하는 고객님을 위한 상품입니다. 안정적인 수익 확보와 체계적인
    자산 관리를 동시에 실현하십시오.


    [주요 금리 안내]

    - 1년 정기예금 금리: 3.4%

    - 2년 정기예금 금리: 3.3%

    - 3년 정기예금 금리: 3.25%


    [가입 조건 및 한도]

    - 최소 가입 금액: 100,000원 이상

    - 가입 대상: 실명 확인이 완료된 개인 고객


    [고객 보호 및 안전성]

    - 본 상품은 예금자보호법에 따라 예금보험공사가 보호합니다. 예금자 1인당 원금과 소정의 이자를 합해 최고 1억원까지 보호받으실 수 있습니다.

    - 정기예금은 투자 상품이 아니므로 원금이 보장되는 안전한 자산 증식 수단입니다.


    상세한 금리 적용 방식은 ''윤슬 정기예금: 금리·요율 안내''에서 확인해 주십시오.'
  domain: retail_banking
  product_category: yunseul_jeonggi_yegeum
