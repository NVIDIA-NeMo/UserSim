- id: 446d305f-d3f4-558c-8764-6ffcfb6cc8e8
  title: set_alerts 사용 기준
  body: '입출금 알림 설정 및 변경 요청 시 다음의 절차를 수행하십시오.


    1. **고객 본인 확인**: `verify_identity` 도구를 사용하여 고객의 성함과 생년월일을 확인하십시오.

    2. **대상 계좌 식별**: 알림을 설정할 계좌의 끝 4자리를 확인하고, `get_accounts` 도구를 통해 account_id를 조회하십시오.

    3. **알림 설정 실행**: 고객이 원하는 알림 조건(금액, 빈도 등)을 확인한 후, `set_alerts` 도구를 호출하여 설정을 완료하십시오.


    알림 서비스의 종류와 설정 가능한 범위는 모바일 앱 또는 인터넷 뱅킹을 통해서도 직접 관리하실 수 있습니다.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
