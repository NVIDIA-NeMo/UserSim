- id: 5f8df5a8-7800-5707-8e6f-3fa1bd8b5572
  title: '윤슬 직장인 신용대출: 부정사용으로부터 고객을 보호하기 위해'
  body: '윤슬은행은 고객님의 소중한 자산과 개인정보를 보호하기 위해 최선을 다하고 있습니다. 특히 윤슬 직장인 신용대출과 같은 금융 상품을
    사칭한 보이스피싱 및 금융사기가 빈번하므로 각별한 주의가 필요합니다.


    윤슬은행은 어떠한 경우에도 고객님께 비밀번호, 카드번호, CVV, PIN, 주민등록번호 또는 추가 인증 수단을 요구하지 않습니다. 만약 대출
    승인이나 금리 인하를 조건으로 위와 같은 정보를 요구한다면 이는 명백한 사기이므로 즉시 통화를 종료하십시오.


    상담원을 통한 계좌 정보 조회나 상태 변경 작업 시에는 오직 고객님의 성함과 생년월일만을 통해 본인 확인을 진행합니다.


    만약 보이스피싱 등 금융사기 피해가 발생했거나 의심되는 정황이 있다면, 즉시 당사 고객센터나 영업점을 통해 지급정지와 피해구제 신청을 진행하여
    피해를 최소화하시기 바랍니다. 신속한 대응이 고객님의 자산을 보호하는 가장 확실한 방법입니다.'
