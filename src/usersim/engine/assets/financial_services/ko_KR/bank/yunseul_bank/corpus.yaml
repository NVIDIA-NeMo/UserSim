- id: 103bd6a4-31a7-5961-ae25-0b687fbd72f1
  title: '윤슬 입출금통장: 한도·제한과 유의사항'
  body: '본 문서는 상담원이 고객 안내 시 참고하는 윤슬 입출금통장의 운영 한도 및 제한 사항 안내서입니다.


    1. 주요 이용 제한 및 유의사항

    - 실명 확인: 금융실명법에 따라 계좌 개설 시 반드시 실명 확인 절차를 거쳐야 하며, 확인된 계좌의 계속 거래 시에는 재확인이 필요하지 않습니다.

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됩니다.

    - 세금 부과: 발생한 이자에 대해서는 소득세와 지방소득세를 합해 15.4%가 원천징수됩니다. 금융소득이 연 2,000만원을 초과할 경우 종합과세
    대상이 됩니다.


    2. 적용 수수료

    - 모바일·인터넷뱅킹 이체 수수료: 0원

    - 영업시간 외 ATM 출금 수수료: 500원

    - 통장 및 카드 재발급 수수료: 2,000원


    3. 운영 안내

    - 본 상품은 일상적인 거래를 위한 기본 계좌로, 입출금통장 금리는 0.1%가 적용됩니다.

    - 복잡한 민원이나 분쟁 발생 시, 단계별 절차에 따라 책임자에게 에스컬레이션하여 처리하십시오.


    상세한 수수료 체계는 ''윤슬 입출금통장: 수수료 안내''를 참고하시기 바랍니다.'
