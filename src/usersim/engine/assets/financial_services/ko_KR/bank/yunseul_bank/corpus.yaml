- id: 93ba417a-c6bf-5262-8086-c9bd8233ec4c
  title: '윤슬 정기적금: 진행 중인 이벤트'
  body: '[봄맞이 목돈 마련 이벤트 안내]


    윤슬은행을 이용해 주시는 고객님을 위해 ''윤슬 정기적금'' 특별 가입 이벤트를 진행합니다.


    - 이벤트 기간: 2026년 3월 1일부터 2026년 5월 31일까지

    - 대상: 이벤트 기간 내 윤슬 정기적금 신규 가입 고객

    - 혜택: 12개월 만기 상품 가입 시 연 3.6%의 경쟁력 있는 금리 적용

    - 가입 조건: 월 납입액 10,000원 이상 1,000,000원 이하


    지금 바로 가입하시고 든든한 미래 자산을 준비하십시오. 본 이벤트는 당사 사정에 따라 조기 종료될 수 있습니다.'
  domain: retail_banking
