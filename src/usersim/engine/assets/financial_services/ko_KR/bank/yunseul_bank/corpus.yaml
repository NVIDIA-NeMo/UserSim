  mentions_tools: []
  institution_id: yunseul_bank
- id: b3052da2-d751-5ee7-8728-afc3371b72f2
  title: '윤슬 입출금통장: 가입부터 이용까지'
  body: '본 문서는 상담원이 고객의 윤슬 입출금통장 가입 및 이용을 지원하기 위한 안내서입니다.


    [가입 단계]

    1. 실명 확인: 금융실명법에 따라 고객의 신분증을 통해 실명을 확인합니다. 실명이 확인된 계좌로 계속 거래를 하는 경우 재확인은 필요하지
    않습니다.

    2. 상품 안내: 급여 수령, 공과금 자동이체 등 일상적 거래에 최적화된 기본 계좌임을 안내하십시오.


    [주요 이용 조건]

    - 금리: 입출금통장 금리는 0.1%입니다.

    - 이체 수수료: 다른 은행으로 이체 수수료(모바일·인터넷뱅킹)는 0원임을 강조하여 디지털 뱅킹 이용을 권장하십시오.

    - ATM 이용: 영업시간 외 ATM 출금 수수료는 500원이 부과됩니다.

    - 재발급 비용: 통장이나 카드를 재발급할 때 발생하는 수수료는 2,000원입니다.


    [주의사항]

    - 예금자 보호: 예금보험공사를 통해 예금자 1인당 원금과 이자를 합해 1억원까지 보호됨을 안내하십시오.

    - 세금: 이자 소득 발생 시 15.4%가 원천징수됩니다.


    상세한 가입 절차는 윤슬 입출금통장: 가입과 이용 시작을 참고하십시오.'
