  institution_id: yunseul_bank
- id: 19426a22-d7dd-553a-b9d6-ba688ce8882a
  title: '윤슬 입출금통장: 등록 정보 변경'
  body: '윤슬 입출금통장에 등록된 고객님의 정보를 변경하는 절차를 안내해 드립니다.


    [준비 사항]

    - 본인 확인을 위한 성함과 생년월일


    [변경 단계]

    1. 본인 확인: 상담원에게 고객님의 성함과 생년월일을 말씀해 주십시오. 은행은 이를 통해 고객님의 신원을 확인합니다.

    2. 변경 요청: 주소, 연락처 등 변경을 원하시는 등록 정보의 내용을 구체적으로 말씀해 주십시오.

    3. 정보 수정 및 확인: 상담원이 요청하신 내용을 시스템에 반영한 후, 변경된 정보가 정확한지 다시 한번 확인해 드립니다.

    4. 완료: 정보 변경이 정상적으로 처리되었음을 안내받으시면 모든 절차가 완료됩니다.


    계좌 해지나 다른 상품으로의 전환이 필요하신 경우에는 윤슬 입출금통장: 해지·변경·상품 전환 문서를 참고하시기 바랍니다.'
  domain: retail_banking
  product_category: yunseul_ipchulgeum
  document_type: how_to_guide
  source_authority: official
