- id: f0069031-0199-522c-b750-19e9876afbc8
  title: '윤슬 주택담보대출: 당사의 비슷한 상품과의 비교'
  body: '윤슬 주택담보대출과 윤슬 직장인 신용대출의 주요 차이점은 다음과 같습니다.


    | 구분 | 윤슬 주택담보대출 | 윤슬 직장인 신용대출 |

    | :--- | :--- | :--- |

    | 담보 여부 | 주택 담보 필요 | 신용 및 소득 기반 |

    | 대출 기간 | 최장 40년으로 매우 김 | 상대적으로 짧은 기간 |

    | 금리 수준 | 담보가 있어 상대적으로 낮음 | 개인 신용도에 따라 결정 |

    | 상환 부담 | 기간이 길어 월 상환액 낮음 | 상환 기간이 짧아 월 부담 높음 |


    [추천 대상]

    - 내 집 마련을 위해 큰 금액을 장기간 안정적으로 빌리고 싶으신 분께는 ''윤슬 주택담보대출''을 추천합니다.

    - 담보 없이 직장인 신용을 바탕으로 신속하게 자금을 마련하고 싶으신 분께는 ''윤슬 직장인 신용대출''이 더 적합합니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: a72404ad-aadf-56df-bea7-c3dd51c2b517
  title: '윤슬 주택담보대출: 상품설명서 주요 내용'
  body: '본 상품은 금융소비자 보호에 관한 법률 및 관련 법규를 준수합니다. 고객님께서는 다음의 주요 고지 사항을 반드시 확인하시기 바랍니다.


    [청약 철회권]

    대출 계약서류를 받은 날과 대출이 실행된 날 중 늦은 날부터 14일 이내에 청약을 철회할 수 있습니다. 이 경우 원금과 이용 기간의 이자,
    인지세 등 제3자에게 지불한 비용만 반환하며 중도상환수수료는 면제됩니다.


    [중도상환수수료 안내]

    대출 실행일로부터 3년 이내에 원금을 상환하실 경우 0.6%의 중도상환수수료가 부과됩니다. 단, 대출일부터 3년이 경과한 후에는 수수료가 부과되지
    않습니다.


    [대출 한도 및 규제]

    대출 총액이 1억원을 초과하는 차주에게는 총부채원리금상환비율(DSR) 규제가 적용됩니다. 은행권 기준 연간 원리금 상환액이 연소득의 40%를
    넘지 않아야 하며, 스트레스 금리를 반영하여 한도가 산정됩니다.


    [주의 사항]

    모든 대출 상품은 원금과 이자를 상환하지 않을 경우 신용등급 하락 및 금융거래 제한 등의 불이익이 발생할 수 있습니다.'
  domain: lending_mortgage
  product_category: yunseul_judam
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: yunseul_bank
- id: af9237ce-3a98-516d-997d-b765cc72c8ff
  title: '윤슬 주택담보대출: 금리·요율 안내'
  body: "윤슬 주택담보대출의 적용 금리 및 요율은 다음과 같습니다.\n\n- 적용 금리\n  * 변동금리: 4.45%\n  * 5년 혼합형\
    \ 금리: 4.65%\n\n- 수수료 요율\n  * 중도상환수수료율: 0.6% (대출 실행 후 3년까지 적용)\n\n[금리 결정 및 변동 안내]\n\
    최종 금리는 고객님의 신용점수, 소득 수준, 담보 가치 및 대출 기간에 따라 차등 적용됩니다. 변동금리의 경우 기준금리의 변동에 따라 주기적으로\
    \ 금리가 재산정되며, 이에 따라 월 납입금액이 변경될 수 있습니다. 신용 상태가 개선된 경우 금리인하요구권을 행사하여 금리 인하를 요청하실\
    \ 수 있습니다."
