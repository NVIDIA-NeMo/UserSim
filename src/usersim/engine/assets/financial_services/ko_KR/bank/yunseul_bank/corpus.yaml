- id: fda0ae21-a995-541a-93f8-e9b577ceec50
  title: '윤슬 체크카드: 진행 중인 이벤트'
  body: '윤슬은행과 함께하는 스마트한 소비 생활! 윤슬 체크카드 신규 발급 고객님을 위한 캐시백 혜택 안내드립니다.


    - 이벤트 기간: 2025년 1월 1일부터 2025년 6월 30일까지

    - 대상 고객: 기간 내 윤슬 체크카드를 신규로 발급받으신 고객님

    - 혜택 내용: 기본 캐시백 비율 0.3% 외에, 첫 달 이용 금액에 대해 추가 혜택을 제공합니다.

    - 참여 방법: 본인 확인 후 카드를 발급받으시고 일상적인 결제에 사용하십시오.


    합리적인 소비와 함께 0원 연회비의 혜택을 누리십시오. 자세한 이벤트 제외 대상 및 조건은 상품 설명서의 캐시백 안내를 참고해 주시기 바랍니다.'
  domain: cards
  product_category: yunseul_check
  document_type: promo_notice
  source_authority: official
