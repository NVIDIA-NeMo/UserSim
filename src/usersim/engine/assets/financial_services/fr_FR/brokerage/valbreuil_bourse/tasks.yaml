  param_space:
    address: ['12 rue des Lilas, 69003 Lyon', '4 allée des Tilleuls, 33000 Bordeaux']
    phone: ['06 39 98 73 05', '01 99 00 46 92']
    email: [a.dubois@example.com, e.laurent@example.com]
  gold_tool_sequence: [update_contact_info]
  expected_state_deltas: {contact_updated: true}
- id: TPL-VB-ALERTS-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Pouvez-vous créer une alerte qui me prévient quand {{ticker}} varie de plus de
