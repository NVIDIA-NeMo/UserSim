    balance: '0.00'
  param_space:
    acct_type: [compte-titres, PEA-PME]
  gold_tool_sequence: [close_account]
  expected_state_deltas: {acct_vb_0002.status: CLOSED}
- id: TPL-VB-UPDATECONTACT-001
