    {{other_broker}} et d'activer les alertes.
  - >-
    Pouvez-vous ouvrir un {{acct_type}}, rapatrier mon portefeuille depuis
    {{other_broker}} et activer des alertes de cours ?
  account_state:
    account_id: acct_vb_0001
  param_space:
    acct_type: [PEA, compte-titres]
    other_broker: [mon ancienne banque, un autre courtier en ligne]
  gold_tool_sequence: [open_account, initiate_securities_transfer, set_alerts]
  expected_state_deltas: {new_account_status: OPEN, transfer_status: INITIATED, alerts_updated: true}
- id: TPL-VB-CANCEL-WITHDRAW-CLOSE-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Merci d'annuler mon ordre en cours, de retirer toutes mes liquidités vers ma
    banque, puis de clôturer le compte-titres.
  - >-
    Je veux annuler mon ordre en attente, sortir toutes mes liquidités et fermer
    mon compte-titres.
  - >-
    Pouvez-vous annuler l'ordre en cours, virer la totalité de mes liquidités sur
    mon compte bancaire lié et clôturer le compte-titres ?
  account_state:
    account_id: acct_vb_0002
    account_type: compte-titres
    balance: '{{amount}}'
    orders:
    - {order_id: ord_vb_0002, ticker: '{{ticker}}', status: open}
  param_space:
    amount: ['3000.00', '12000.00']
    ticker: [un ETF MSCI World, Air Liquide]
  gold_tool_sequence: [cancel_order, withdraw_funds, close_account]
  # strict chain: cancel the open order to free the cash, withdraw it, THEN close.
  ordered: true
  expected_state_deltas: {ord_vb_0002.status: CANCELLED, withdrawal_status: COMPLETED, acct_vb_0002.status: CLOSED}
