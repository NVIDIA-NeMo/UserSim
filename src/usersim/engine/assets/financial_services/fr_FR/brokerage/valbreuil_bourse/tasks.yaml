# ── Multi-step (Tier-1) tasks ──────────────────────────────────────────
# Gold sequences of depth 3-4: each gold tool must be discovered and called;
# the verifier requires the full sequence with no unauthorized state changes.
# Run with a higher max_turns (~10-12).
- id: TPL-VB-ONBOARD-FUND-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'aimerais ouvrir un {{acct_type}}, y verser {{amount}} € et donner une
    procuration à {{person}} sur ce compte.
  - >-
    Pouvez-vous ouvrir un {{acct_type}}, l'alimenter avec {{amount}} € et ajouter
    {{person}} comme mandataire ?
  - >-
    Merci d'ouvrir un {{acct_type}}, d'y déposer {{amount}} € et d'autoriser
    {{person}} à y accéder.
  account_state:
    account_id: acct_vb_0001
    linked_bank: bank_vb_0001
  param_space:
    acct_type: [PEA, compte-titres]
    amount: ['5 000', '25 000']
    person: [mon conjoint, mon frère]
  gold_tool_sequence: [open_account, deposit_funds, manage_authorized_users]
  expected_state_deltas: {new_account_status: OPEN, deposit_status: COMPLETED, authorized_users_updated: true}
- id: TPL-VB-TRANSFER-SETUP-001
