schema_version: v0.1
# Verifiable Tier-1 tasks for valbreuil_bourse, an online broker, adapted from
# en_US/solstice_invest. Every state-changing tool it offers is gold in at least
# one task. Each task ships THREE opening phrasings in French. A French
# compte-titres or PEA carries no transfer-on-death beneficiary: here
# update_beneficiary sets the reference IBAN that withdrawals go to, and the
# en_US beneficiary steps become a power of attorney (manage_authorized_users)
# or a contact update. Withdrawals target the compte-titres: an early PEA
# withdrawal closes the plan. Read-only tools (get_positions, get_order_status)
# carry no gold state change.
templates:
- id: TPL-VB-TRANSFER-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Bonjour, je voudrais transférer mon PEA de {{from_broker}} chez Valbreuil
    Bourse. Vous pouvez m'aider à lancer le transfert ?
  - >-
    Je veux rapatrier mon PEA qui est chez {{from_broker}}. Comment je lance le
    transfert vers Valbreuil ?
  - >-
    Pouvez-vous démarrer le transfert de mon PEA détenu chez {{from_broker}} vers
    Valbreuil ?
  account_state:
    account_id: acct_vb_0001
    account_type: PEA
    delivering_firm: '{{from_broker}}'
    transfer_status: none
  param_space:
    from_broker: [Banque Armorique, Courtage Lumen, Crédit des Alpes]
  gold_tool_sequence: [initiate_securities_transfer]
  expected_state_deltas: {transfer_status: IN_PROGRESS}
- id: TPL-VB-CANCELORDER-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai passé un ordre sur {{ticker}} tout à l'heure et il n'est pas encore
    exécuté. Vous pouvez l'annuler ?
  - >-
    Merci d'annuler mon ordre en cours sur {{ticker}} avant qu'il ne soit exécuté.
  - >-
    Pouvez-vous supprimer mon ordre en attente sur {{ticker}} ? J'ai changé d'avis.
  account_state:
    account_id: acct_vb_0001
    orders:
    - {order_id: ord_vb_0001, ticker: '{{ticker}}', status: open}
  param_space:
    ticker: [Air Liquide, TotalEnergies, un ETF MSCI World]
  gold_tool_sequence: [cancel_order]
  expected_state_deltas: {ord_vb_0001.status: CANCELLED}
- id: TPL-VB-DEPOSIT-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'aimerais verser {{amount}} € sur mon PEA.
  - >-
    Pouvez-vous prélever {{amount}} € sur mon compte bancaire lié pour alimenter
    mon PEA Valbreuil ?
  - >-
    Merci d'ajouter {{amount}} € à mon PEA depuis mon compte courant lié.
  account_state:
    account_id: acct_vb_0001
    account_type: PEA
    linked_bank: bank_vb_0001
  param_space:
    amount: ['1 000', '5 000', '20 000']
  gold_tool_sequence: [deposit_funds]
  expected_state_deltas: {deposit_status: INITIATED}
- id: TPL-VB-WITHDRAW-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Pouvez-vous retirer {{amount}} € de mon compte-titres vers mon compte bancaire
    lié ?
  - >-
    J'ai besoin de sortir {{amount}} € de liquidités de mon compte-titres
    Valbreuil pour les virer sur mon compte courant.
  - >-
    Merci de virer {{amount}} € de liquidités de mon compte-titres vers mon compte
    bancaire.
  account_state:
    account_id: acct_vb_0001
    balance: '30000.00'
    linked_bank: bank_vb_0001
  param_space:
    amount: ['2 000', '10 000']
  gold_tool_sequence: [withdraw_funds]
  expected_state_deltas: {withdrawal_status: PROCESSING}
- id: TPL-VB-TRANSFERCASH-001
  tier: verifiable
  task_type: transactional
  domain: brokerage_investing
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Virez {{amount}} € des liquidités de mon compte-titres vers mon compte courant
    lié, s'il vous plaît.
  - >-
    Pouvez-vous transférer {{amount}} € de mes liquidités disponibles vers mon
