  account_state:
    customer_id: cust_vb_0001
  param_space:
    acct_type: [PEA, compte-titres, PEA-PME]
  gold_tool_sequence: [open_account]
  expected_state_deltas: {new_account_status: OPEN}
- id: TPL-VB-CLOSEACCT-001
