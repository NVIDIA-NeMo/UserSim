- id: c504a768-2f94-53c8-9956-1821741addae
  title: Investissement programmé en ETF — souscrire et activer
  body: "Pour activer votre solution d'investissement automatisée, nous vous invitons\
    \ à suivre les étapes suivantes : \n\n1. Validation du profil d'investisseur :\
    \ vous devez préalablement avoir complété l'évaluation de l'adéquation et du caractère\
    \ approprié selon les normes MiFID II. Nous confirmerons avec vous que les produits\
    \ ETF sont compatibles avec votre profil de risque.\n\n2. Définition des paramètres\
    \ du plan : indiquez-nous le montant que vous souhaitez investir à chaque échéance.\
    \ Ce montant doit être au minimum de 25 €. Précisez également la périodicité souhaitée\
    \ (mensuelle ou trimestrielle).\n\n3. Sélection des actifs : choisissez les ETF\
    \ éligibles sur lesquels vos fonds seront répartis. Nous vous accompagnerons dans\
    \ la compréhension de la composition de ces fonds, sans toutefois délivrer de\
    \ conseil personnalisé.\n\n4. Mise en place du flux financier : confirmez le compte\
    \ de provenance des fonds. Nous vous informerons dès que le premier prélèvement\
    \ et l'achat des titres auront été exécutés.\n\n5. Confirmation d'activation :\
    \ vous recevrez un récapitulatif détaillé de votre plan d'investissement automatisé,\
    \ incluant la confirmation que les frais d'exécution du plan sont de 0 €.\n\n\
    Une fois ces étapes validées, vos investissements seront automatisés selon le\
    \ calendrier choisi, vous permettant de lisser votre exposition au marché sans\
    \ intervention manuelle répétée."
