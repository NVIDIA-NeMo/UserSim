- id: a4d7a186-da81-50b3-bb8f-b2c7da6f7ec0
  title: PEA-PME — informations sur les risques
  body: 'L''investissement via un PEA-PME comporte des risques spécifiques que tout
    investisseur doit appréhender avant toute souscription.


    Risque de capital : Le capital investi n''est jamais garanti. La valeur des titres
    peut fluctuer à la hausse comme à la baisse en fonction des performances des entreprises
    et des conditions de marché. Vous pouvez perdre tout ou partie de votre investissement
    initial.


    Risque lié aux PME : Les actions de petites et moyennes entreprises présentent
    généralement une volatilité plus élevée et une liquidité moindre que celles des
    grandes capitalisations. La difficulté de revendre rapidement un titre sans impact
    majeur sur son cours est un risque réel.


    Protection réglementaire : Bien que les performances ne soient pas garanties,
    Valbreuil Bourse assure la protection des titres via le Fonds de Garantie des
    Dépôts et de Résolution (FGDR) jusqu''à un plafond de 70 000 €.


    Conformité MiFID II : L''institution réalise systématiquement une évaluation de
    l''adéquation pour s''assurer que le profil de risque du client est compatible
    avec la nature volatile du PEA-PME. Valbreuil Bourse fournit une éducation financière,
    mais ne délivre aucun conseil fiscal ou juridique personnalisé.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1d56f1ba-d7ce-5125-9422-354b480315d3
  title: PEA-PME — calcul et application des taux
  body: "La grille tarifaire du PEA-PME est conçue pour être compétitive et strictement\
    \ transparente, sans frais cachés ni paliers complexes.\n\nFrais de courtage :\n\
    Un taux unique de 0,2 % s'applique à l'ensemble des ordres d'achat et de vente.\
    \ Ce taux est calculé sur la base du montant brut de l'opération. \n- Formule\
    \ : Montant de l'ordre × 0,002 = Frais de courtage.\n- Application : Le montant\
    \ est prélevé instantanément lors de l'exécution de l'ordre.\n\nFrais de transfert\
    \ :\nPour tout transfert de portefeuille vers un autre établissement financier,\
    \ Valbreuil Bourse applique des frais de traitement. Ces frais sont strictement\
    \ plafonnés à 150 €, quel que soit le nombre de lignes transférées.\n\nPlafonds\
    \ de versement :\nLe plafond maximal de versements pour l'enveloppe PEA-PME est\
    \ fixé à 225 000 €. Aucun versement supplémentaire ne peut être accepté au-delà\
    \ de ce seuil réglementaire."
