- id: bf251417-63bc-5dfc-a46b-17829a430c7b
  title: Compte-titres ordinaire — confidentialité et protection des données
  body: 'Valbreuil Bourse s''engage à traiter vos données personnelles avec la plus
    grande rigueur, conformément au RGPD et aux directives de l''ACPR et de l''AMF.


    Collecte et Utilisation des Données :

    Les informations collectées lors de l''ouverture de votre Compte-titres ordinaire,
    notamment via le processus d''évaluation de l''adéquation MiFID II, sont utilisées
    exclusivement pour vérifier la pertinence des produits financiers et assurer la
    conformité réglementaire. Vos données sont traitées pour permettre le reporting
    réglementaire obligatoire et la sécurisation de vos actifs.


    Protection et Confidentialité :

    L''accès à vos données est strictement limité aux services de conformité et de
    direction des opérations. Nous appliquons une authentification forte pour toute
    modification de vos coordonnées, garantissant qu''aucun changement ne soit effectué
    sans votre validation sécurisée.


    Sécurisation des Actifs :

    Conformément aux normes en vigueur, vos titres sont protégés par le FGDR jusqu''à
    70 000 €. Nous vous rappelons que si la détention est sécurisée, le capital investi
    n''est jamais garanti et peut fluctuer selon les cours du marché.


    Droits du Client :

    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données, dans les limites des obligations de conservation légale imposées par
    les autorités financières françaises.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 48757337-471f-5c09-80da-a06ca0f0b8ab
  title: Compte-titres ordinaire — reconnaître les arnaques visant ce produit
  body: 'La flexibilité et l''ouverture internationale du Compte-titres ordinaire
    peuvent malheureusement attirer l''attention d''acteurs malveillants. Afin de
    protéger vos actifs, il est primordial de savoir identifier les tentatives de
    fraude courantes.


    Une caractéristique majeure des arnaques boursières est la promesse de rendements
    garantis ou exceptionnels. Nous vous rappelons que Valbreuil Bourse, conformément
    à sa posture de rigueur réglementaire, ne garantit jamais le capital investi ni
    aucun rendement futur. Toute sollicitation, même semblant provenir d''un collaborateur
    de notre institution, vous promettant un gain sans risque ou un profit immédiat
    et massif, doit être considérée comme frauduleuse.


    Soyez particulièrement vigilants face aux demandes d''informations sensibles.
    Valbreuil Bourse ne vous demandera jamais, par e-mail ou via messagerie, de communiquer
    vos mots de passe, vos codes de sécurité ou vos identifiants de connexion. Toute
    action modifiant l''état de votre compte ou tout retrait de fonds nécessite obligatoirement
    une authentification forte et une vérification d''identité rigoureuse. Si un interlocuteur
    tente de contourner ces protocoles de sécurité en invoquant une urgence, il s''agit
    d''un signal d''alerte critique.


    L''usurpation d''identité (phishing) est également fréquente. Les fraudeurs peuvent
    imiter nos communications pour vous inciter à cliquer sur des liens malveillants.
    Nous vous invitons à vérifier systématiquement l''adresse de l''expéditeur et
    à privilégier l''accès à vos services via vos canaux habituels sécurisés.


    Si vous constatez une anomalie ou si vous avez un doute sur la légitimité d''une
    demande, nous vous demandons de nous en informer sans délai via notre messagerie
    sécurisée. En cas de suspicion avérée de fraude, Valbreuil Bourse procède immédiatement
    au gel conservatoire de vos comptes pour protéger vos titres et vos liquidités.
    Cette mesure de protection est essentielle pour limiter l''exposition de vos actifs
    avant l''intervention de notre direction des opérations.


    Pour davantage de détails sur la sécurisation de vos accès, nous vous suggérons
    de consulter le document Compte-titres ordinaire — protection contre la fraude
    et les opérations non autorisées.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 31f52f5c-b41e-53da-920d-2802b68311f7
  title: Compte-titres ordinaire — plafonds, restrictions et cas particuliers
  body: 'Le Compte-titres ordinaire se distingue par sa structure ouverte, conçue
    pour offrir une liberté totale d''investissement aux résidents français. Contrairement
    aux enveloppes fiscales réglementées, ce produit ne comporte aucun plafond de
    versement. Vous pouvez y déposer les montants de votre choix, sans limite maximale,
    ce qui en fait l''outil privilégié pour la gestion de portefeuilles d''envergure
    ou pour des stratégies d''investissement intensives sur les marchés mondiaux.


    En termes de restrictions, le Compte-titres ordinaire est l''option la plus flexible
    de notre gamme. Il ne restreint ni la nationalité des titres acquis, ni la nature
    des actifs financiers éligibles, permettant ainsi une diversification géographique
    et sectorielle sans contrainte fiscale immédiate sur les versements. Toutefois,
    l''accès à certains instruments complexes peut être soumis à une évaluation de
    l''adéquation, conformément aux normes MiFID II, afin de s''assurer que le produit
    correspond à vos connaissances et à votre profil de risque.


    Concernant la protection des actifs, bien que le capital investi ne soit jamais
    garanti en raison de la volatilité des marchés, les titres détenus sont protégés
    par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant
    de 70 000 euros. Cette garantie s''applique en cas de défaillance de l''institution.


    Un cas particulier concerne les transferts de titres. Si vous souhaitez déplacer
    vos actifs vers un autre établissement, des frais de transfert sortant s''appliquent
    à hauteur de 15 € par ligne. Ce montant couvre la gestion administrative et la
    sécurisation du transfert des titres.


    Il est important de noter que, contrairement au PEA, toute plus-value réalisée
    et tout dividende perçu sur un Compte-titres ordinaire sont soumis à la fiscalité
    en vigueur au moment de la liquidation ou de la perception, sans possibilité de
    report d''imposition lié à la détention de l''enveloppe. Pour comprendre les différences
    structurelles avec nos autres solutions, vous pouvez consulter Compte-titres ordinaire
    — comparaison avec les alternatives et quand ne pas le choisir.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f3dd3628-2b42-5fe2-8b0f-c4f87e508d1b
  title: Compte-titres ordinaire — coûts et frais
  body: 'Quels sont les frais appliqués lors de l''exécution d''un ordre sur mon Compte-titres
    ordinaire ?

    Chaque ordre d''achat ou de vente exécuté sur votre compte fait l''objet d''une
    commission de courtage s''élevant à 1,99 € par ordre.


    Existe-t-il des frais de garde pour la détention de mes titres ?

    Non, Valbreuil Bourse a fait le choix d''une tarification compétitive pour ce
    produit : les droits de garde annuels sont de 0 €.


    Combien coûte le transfert de mes titres vers un autre courtier ?

    En cas de transfert sortant, des frais de 15 € par ligne de titres sont appliqués
    pour couvrir le traitement réglementaire et la sécurisation du transfert.


    Ces frais sont-ils négociables ?

    Nos tarifs sont conçus pour être transparents et respectent strictement les plafonds
    réglementaires ; ils sont donc identiques pour l''ensemble de nos clients détenteurs
    de ce produit.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 3882055e-b4f5-564f-9f8c-c828ecfffbbd
  title: Compte-titres ordinaire — consulter le suivi ou l'historique
  body: "Pour assurer une gestion rigoureuse de vos investissements, Valbreuil Bourse\
    \ met à votre disposition l'intégralité de l'historique de vos opérations et le\
    \ suivi de vos positions sur votre Compte-titres ordinaire. Voici la procédure\
    \ à suivre pour obtenir ces informations :\n\n1. Formulez votre demande de consultation\
    \ : indiquez-nous via la messagerie sécurisée que vous souhaitez obtenir le relevé\
    \ de vos positions actuelles ou l'historique détaillé de vos transactions sur\
    \ une période donnée (par exemple, le trimestre écoulé).\n\n2. Validation de l'identité\
    \ : pour protéger vos données financières, nous vous demanderons de confirmer\
    \ votre identité via notre protocole d'authentification forte. Cette étape est\
    \ obligatoire avant tout partage d'informations sensibles relatives à l'état de\
    \ votre compte.\n\n3. Sélection de la période : précisez si vous désirez un historique\
    \ global depuis l'ouverture du compte ou un extrait spécifique. Nous vous confirmerons\
    \ la prise en compte de vos critères de recherche.\n\n4. Réception des documents\
    \ : nous vous transmettrons les documents demandés (relevés de portefeuille ou\
    \ historiques de transactions) sous format numérique directement dans votre espace\
    \ de messagerie sécurisée. \n\nVous saurez que la procédure est terminée lorsque\
    \ vous recevrez la notification de mise à disposition des documents. Ces relevés\
    \ incluent le détail des titres détenus, les cours de clôture et le cumul des\
    \ commissions de courtage de 1,99 € prélevées par ordre.\n\nEn cas de divergence\
    \ constatée entre vos propres calculs et les documents transmis, nous vous invitons\
    \ à consulter le guide Compte-titres ordinaire — écart avec vos relevés pour comprendre\
    \ les mécanismes de règlement-livraison."
  domain: brokerage_investing
  product_category: compte_titres
  document_type: how_to_guide
  source_authority: official
