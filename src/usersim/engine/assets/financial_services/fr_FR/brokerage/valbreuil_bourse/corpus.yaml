- id: a2628d6a-3bf0-5693-9289-5555d7145fa2
  title: PEA-PME — écart avec vos relevés
  body: 'En tant qu''agent, vous pouvez être sollicité par un client signalant une
    différence entre le solde affiché et ses propres calculs. Voici la démarche de
    diagnostic.


    **Symptômes**

    - Le client affirme avoir versé une somme qui n''apparaît pas encore totalement.

    - Le montant après vente de titres est inférieur au prix de clôture attendu.


    **Points de vérification**

    1. **Règlement-livraison :** Vérifiez la date de l''opération. Le délai de règlement-livraison
    signifie que la propriété des titres et les fonds correspondants ne sont pas transférés
    instantanément. L''écart est normal durant cette période.

    2. **Frais de courtage :** Vérifiez si le client a pris en compte les frais de
    courtage de 0,2 %. Sur un ordre important, cet impact peut créer un écart visible
    sur le montant net reçu.

    3. **Fiscalité et Prélèvements :** Assurez-vous qu''aucun prélèvement réglementaire
    n''a été effectué sur le compte espèces.


    **Résolution et Escalade**

    Si l''écart persiste après le délai de règlement-livraison et la vérification
    des frais, ne tentez pas de correction manuelle. Vous devez escalader le dossier
    vers la direction des opérations pour un audit des écritures comptables. Informez
    le client qu''un accusé de réception a été généré et qu''une résolution normée
    est en cours.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 848c0e6b-a434-51e0-b069-dd466d30bba0
  title: PEA Jeune — présentation
  body: 'Le PEA Jeune est l''instrument d''initiation boursière privilégié pour les
    jeunes actifs souhaitant se constituer un portefeuille d''actions européennes
    tout en bénéficiant d''un cadre fiscal avantageux. Conçu spécifiquement pour les
    investisseurs âgés de 18 à 25 ans, ce produit permet d''appréhender les mécanismes
    des marchés financiers avec une rigueur institutionnelle.


    L''architecture du PEA Jeune repose sur une optimisation fiscale stricte : les
    gains générés sont exonérés d''impôt sur le revenu après une période de détention
    réglementaire, sous réserve du paiement des prélèvements sociaux. Cette enveloppe
    est accessible aux personnes dont l''âge se situe précisément entre 18 et 25 ans
    et qui sont rattachées au foyer fiscal de leurs parents.


    Sur le plan financier, le PEA Jeune est régi par un plafond de versement strictement
    limité à 20 000 €. Ce montant représente la somme maximale des versements effectués
    sur le plan ; la valeur globale du portefeuille peut toutefois excéder ce seuil
    grâce aux plus-values réalisées sur les titres.


    La structure de coûts est transparente et compétitive. Chaque opération de courtage
    est soumise à un taux de frais de courtage de 0,2 %. Ces frais sont destinés à
    couvrir la sécurisation des actifs et l''intégralité du reporting réglementaire
    requis par les autorités.


    Conformément à notre posture de gestion, Valbreuil Bourse s''assure que ce produit
    est en adéquation avec votre profil d''investisseur. Nous vous rappelons que le
    capital investi n''est jamais garanti et que les performances passées ne préjugent
    pas des performances futures. En cas de fermeture du plan, le PEA Jeune peut être
    transformé en PEA ordinaire, permettant ainsi de basculer vers un plafond de versement
    plus élevé.


    Pour plus de détails sur les modalités de fonctionnement, nous vous invitons à
    consulter le document PEA Jeune — conditions d''éligibilité.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5b298b3e-7e4f-5d07-8171-87aa617bfd05
  title: 'PEA Jeune — plafond des versements : explications'
  body: 'Ceci est une foire aux questions concernant la limite des apports sur votre
    PEA Jeune.


    **Quel est le montant maximum que je peux verser sur mon PEA Jeune ?**

    Le plafond des versements pour le PEA Jeune est fixé à 20 000 €. Ce montant correspond
    au cumul des sommes versées depuis l''ouverture du plan et ne prend pas en compte
    la valorisation actuelle de vos titres.


    **Que se passe-t-il si j''atteins le plafond de 20 000 € ?**

    Une fois que le cumul de vos versements atteint 20 000 €, tout nouveau dépôt de
    fonds sera systématiquement bloqué par nos services. Vous conservez toutefois
    la possibilité de gérer vos positions existantes et de percevoir des dividendes
    sans restriction.


    **Le plafond inclut-il les plus-values réalisées ?**

    Non, le plafond de 20 000 € s''applique uniquement aux versements. Si vos investissements
    progressent et que la valeur totale de votre compte dépasse ce montant, vous restez
    en pleine conformité réglementaire.


    Pour toute précision sur les frais liés à vos ordres, veuillez vous référer à
    la grille PEA Jeune — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: d62f2e70-1c92-5a09-bf27-77cb8a6cfb35
  title: PEA Jeune — souscrire et activer
  body: 'La souscription au PEA Jeune requiert une vérification rigoureuse de votre
    situation administrative et fiscale afin de garantir la conformité du produit
    avec la réglementation française.


    **Prérequis avant de commencer**

    Pour activer votre compte, vous devez être âgé d''au moins 18 ans et au maximum
    25 ans, et justifier de votre rattachement au foyer fiscal de vos parents.


    **Étapes de souscription**


    1. **Transmission des pièces justificatives** : Veuillez nous fournir une copie
    de votre pièce d''identité en cours de validité ainsi qu''un justificatif récent
    de votre rattachement fiscal (avis d''imposition des parents mentionnant votre
    nom).

    2. **Évaluation de l''adéquation** : Nous vous soumettrons un questionnaire MiFID
    II. Vous devrez répondre avec précision à vos objectifs d''investissement, vos
    connaissances financières et votre tolérance au risque. Cette étape est obligatoire
    pour nous assurer que le PEA Jeune est approprié pour vous.

    3. **Validation du contrat** : Une fois vos documents vérifiés, nous vous transmettrons
    le contrat d''ouverture. Vous devrez nous confirmer votre acceptation des conditions
    générales et de la grille tarifaire, incluant le taux de frais de courtage de
    0,2 %.

    4. **Alimentation du compte** : Pour activer définitivement le plan, veuillez
    nous communiquer les coordonnées bancaires du compte dont proviendront les fonds.
    Vous pourrez alors effectuer votre premier versement, dans la limite du plafond
    de 20 000 €.


    **Confirmation de l''activation**

    L''activation est effective lorsque nous vous envoyons l''accusé de réception
    confirmant l''ouverture du compte et la réception du premier dépôt. Vous êtes
    alors autorisé à passer vos premiers ordres d''achat sur les marchés européens.


    Pour comparer ce produit avec nos autres solutions, nous vous suggérons la lecture
    de PEA Jeune — face à un produit similaire de l''établissement.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: b6aacb35-94de-51f0-956b-46d3281360b5
  title: PEA Jeune — grille tarifaire
  body: 'Cette grille tarifaire détaille l''ensemble des frais applicables au PEA
    Jeune chez Valbreuil Bourse. Nous nous engageons à une transparence totale pour
    permettre une gestion optimisée de vos actifs.


    **Frais de Transaction**

    - Frais de courtage par ordre : 0,2 % du montant de l''opération.


    **Frais de Gestion et de Garde**

    - Frais de garde annuels : Gratuit.

    - Frais d''ouverture de compte : Gratuit.


    **Limites Réglementaires**

    - Plafond maximum des versements : 20 000 €.


    Ces frais couvrent la sécurisation des titres, le reporting réglementaire et le
    maintien de l''infrastructure numérique premium. Aucun frais caché n''est appliqué.
    Tout changement de tarification ferait l''objet d''une notification préalable
    selon les modalités prévues dans les conditions générales.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: beaf6539-f674-56a3-a1d6-e352df757eec
  title: PEA Jeune — opération échouée ou en attente
  body: "Il peut arriver qu'une opération sur votre PEA Jeune ne soit pas exécutée\
    \ immédiatement ou soit rejetée. Voici les causes probables et les procédures\
    \ de résolution.\n\n**Symptôme : L'ordre d'achat est marqué comme « Échoué » ou\
    \ « Refusé »**\n\n*   **Cause 1 : Dépassement du plafond de versement**. Si vous\
    \ tentez de verser des fonds alors que le cumul de vos apports a déjà atteint\
    \ 20 000 €, l'opération sera bloquée.\n    *   *Vérification* : Consultez l'historique\
    \ de vos versements cumulés.\n    *   *Solution* : Le plafond étant réglementaire,\
    \ aucun versement supplémentaire n'est possible sur ce plan. Si vous avez dépassé\
    \ 25 ans, nous pouvons étudier la transformation de votre compte en PEA ordinaire.\n\
    \n*   **Cause 2 : Solde espèces insuffisant**. L'ordre inclut des frais de courtage\
    \ de 0,2 %. Si votre solde ne couvre pas le prix du titre plus ces frais, l'ordre\
    \ échouera.\n    *   *Vérification* : Vérifiez le montant exact disponible sur\
    \ votre compte espèces.\n    *   *Solution* : Alimentez votre compte ou réduisez\
    \ la quantité de titres demandée.\n\n**Symptôme : L'opération est « En attente\
    \ » de manière prolongée**\n\n*   **Cause : Délai de règlement-livraison**. Un\
    \ ordre exécuté n'entraîne pas un transfert immédiat de propriété.\n    *   *Vérification*\
    \ : Vérifiez la date de valeur de l'opération.\n    *   *Solution* : Patientez\
    \ jusqu'à la fin du délai conventionnel de règlement-livraison.\n\n**Escalade\
    \ et résolution**\nSi le problème persiste malgré ces vérifications, nous ouvrirons\
    \ un dossier d'incident. Le dossier sera escaladé vers la direction des opérations\
    \ ou le responsable de la conformité. Vous recevrez un accusé de réception immédiat\
    \ et une résolution dans les délais normés de l'institution."
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ee181e5d-226c-5eb9-87c5-a981d0682f76
  title: PEA Jeune — conditions d'éligibilité
  body: 'L''éligibilité au PEA Jeune est déterminée par des critères d''âge et de
    situation fiscale stricts. Veuillez vous référer au tableau ci-dessous :


    | Condition | Valeur Requise | Résultat si respecté | Résultat si non respecté
    |

    | :--- | :--- | :--- | :--- |

    | Âge minimal | 18 ans | Éligible (sous réserve des autres critères) | Non éligible
    |

    | Âge maximal | 25 ans | Éligible (sous réserve des autres critères) | Non éligible
    (éligibilité au PEA classique) |

    | Statut Fiscal | Rattachement au foyer fiscal des parents | Éligible | Non éligible
    |

    | Plafond Versements | ≤ 20 000 € | Versements autorisés | Versements bloqués
    |


    Tout client ayant atteint l''âge de 26 ans ne peut plus effectuer de nouveaux
    versements sur un PEA Jeune, mais conserve la gestion de son portefeuille jusqu''à
    la transformation du plan en PEA ordinaire.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 0d84ddaf-a1c5-5b7c-9031-17fa74a37d24
  title: PEA Jeune — face à un produit similaire de l'établissement
  body: 'Le PEA Jeune et le Plan d''épargne en actions (PEA) classique partagent la
    même finalité fiscale, mais diffèrent sur des points d''accès et de capacité.


    **Comparatif technique**


    *   **Cible et Accès** : Le PEA Jeune est strictement réservé aux 18-25 ans rattachés
    fiscalement à leurs parents. Le PEA classique est ouvert à tout résident français
    majeur sans condition de rattachement.

    *   **Capacité de versement** : Le PEA Jeune dispose d''un plafond de 20 000 €.
    Le PEA classique offre un plafond nettement plus élevé, s''élevant à 150 000 €.

    *   **Coût de transaction** : Le PEA Jeune applique un taux de frais de courtage
    de 0,2 %.


    **Lequel choisir ?**


    *   **Le PEA Jeune est idéal pour** : L''étudiant ou le jeune actif débutant son
    investissement, souhaitant profiter d''une enveloppe fiscale protectrice avec
    des montants d''apport modérés.

    *   **Le PEA classique est préférable pour** : L''investisseur ayant déjà quitté
    le foyer fiscal parental ou souhaitant investir des sommes supérieures à 20 000
    €.


    Pour plus d''informations sur le produit standard, consultez Plan d''épargne en
    actions (PEA) — présentation.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: comparison
  source_authority: official
