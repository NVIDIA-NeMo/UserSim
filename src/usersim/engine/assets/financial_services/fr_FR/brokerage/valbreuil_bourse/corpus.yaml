  institution_id: valbreuil_bourse
- id: 3259a323-b08d-5217-ba24-02a049eb568f
  title: Questions fréquentes
  body: 'Voici les réponses aux interrogations les plus courantes concernant la gestion
    globale de vos services chez Valbreuil Bourse.


    **Comment puis-je contacter l''assistance ?**

    L''assistance est exclusivement assurée via notre messagerie sécurisée et par
    e-mail. Nos équipes sont disponibles durant les jours ouvrés, selon le fuseau
    horaire CET.


    **Que se passe-t-il si ma demande est complexe ou nécessite une expertise particulière
    ?**

    Dans le cas de demandes présentant une complexité technique ou réglementaire,
    nos agents escaladent systématiquement le dossier vers le responsable de la conformité
    ou la direction des opérations afin de garantir une résolution rigoureuse.


    **Comment sont traitées les réclamations ?**

    Toute réclamation fait l''objet d''un processus transparent : vous recevrez un
    accusé de réception immédiat, et le dossier sera traité selon un délai de résolution
    normé.


    Pour suivre vos positions et vos actifs, consultez votre espace client Valbreuil
    Bourse.'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 134d0f48-0883-55ef-9a90-920fef76b493
  title: 'Notes réglementaires : bourse et placements'
  body: 'Valbreuil Bourse opère dans un cadre réglementaire strict afin d''assurer
    la protection de ses clients et l''intégrité des marchés financiers. L''institution
    suit rigoureusement les directives de l''Autorité des Marchés Financiers (AMF)
    et de l''Autorité de Contrôle Prudentiel et de Résolution (ACPR), conformément
    aux normes de la directive européenne MiFID II.


    **Évaluation de l''adéquation et du caractère approprié**

    En vertu de MiFID II, Valbreuil Bourse procède systématiquement à une évaluation
    de l''adéquation. Ce processus vise à s''assurer qu''un produit financier correspond
    précisément aux connaissances, à l''expérience, aux objectifs d''investissement
    ainsi qu''à la capacité financière du client. L''agent a l''obligation de vérifier
    que le profil de risque du client est compatible avec les instruments financiers
    choisis avant toute souscription.


    **Protection des actifs et risques**

    Il est primordial de rappeler que le capital investi sur les marchés financiers
    n''est jamais garanti ; les fluctuations boursières peuvent entraîner une perte
    partielle ou totale du montant investi. Toutefois, pour sécuriser vos avoirs,
    les titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) jusqu''à un plafond de 70 000 euros.


    **Limites de l''accompagnement**

    Valbreuil Bourse s''engage à fournir une éducation financière de qualité et à
    vérifier la pertinence des produits proposés. Cependant, l''institution ne délivre
    aucun conseil fiscal ou juridique personnalisé. L''agent ne peut en aucun cas
    garantir un rendement futur et se limite à un standard de soin basé sur le profil
    de risque préalablement établi du client. Toute décision d''investissement finale
    relève de la responsabilité du détenteur du compte.'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 33be8805-373d-5991-a990-27e8f7c70b84
  title: Quand utiliser get_positions
  body: 'L''outil `get_positions` est l''unique mécanisme autorisé pour consulter
    la composition actuelle du portefeuille d''un client. Il doit être utilisé dès
    que le client souhaite connaître ses avoirs, le nombre de titres détenus, ou la
    valeur actuelle de ses positions.


    L''agent doit suivre rigoureusement la procédure suivante :


    1. **Vérification de l''identité** : Avant toute action sur le compte, l''agent
    doit s''assurer de l''identité du client via l''outil `verify_identity`. Aucune
    information de position ne peut être divulguée sans une authentification forte
    réussie.

    2. **Identification du compte** : L''agent doit utiliser l''outil `get_accounts`
    pour récupérer l''identifiant technique (`account_id`) correspondant au ou aux
    comptes du client (en s''appuyant sur les 4 derniers chiffres du compte fournis
    par le client).

    3. **Appel de l''outil** : Une fois l'' `account_id` obtenu, l''agent appelle
    `get_positions` en transmettant cet identifiant.

    4. **Communication des résultats** : L''agent restitue les informations au client
    de manière pédagogique, en respectant le ton institutionnel de l''établissement.


    L''agent ne doit jamais tenter de deviner un identifiant de compte ou d''utiliser
    des données provenant d''une session précédente non vérifiée. Si le client possède
    plusieurs enveloppes (par exemple un PEA et un Compte-titres ordinaire), l''agent
    doit préciser pour quel compte les positions sont affichées.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: valbreuil_bourse
- id: 6c62ff9b-6334-5aab-8826-dbc73ffb7c2b
  title: Référence de l'outil get_positions
  body: 'L''outil `get_positions` permet à l''agent de récupérer la liste exhaustive
    des actifs détenus sur un compte spécifique.


    **Signature de l''outil** :

    `get_positions(account_id: string)`


    **Arguments** :

    - `account_id` : L''identifiant unique du compte du client, obtenu préalablement
    via l''outil `get_accounts`.


    **Effet** :

    L''outil retourne les positions actuelles du portefeuille, incluant les tickers
    des titres, les quantités et la valorisation actuelle.


    **Utilisation** :

    L''agent effectue cette action en appelant l''outil directement dans la conversation
    après avoir vérifié l''identité du client. L''agent ne doit jamais demander au
    client de fournir lui-même l'' `account_id` technique, car celui-ci est géré en
    interne par l''institution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: valbreuil_bourse
- id: 737e25a8-0bf7-5fe0-8a42-63d44c7cc942
  title: Quand utiliser place_trade
  body: 'L''outil `place_trade` est utilisé pour exécuter un ordre d''achat ou de
    vente de titres sur les marchés. Cette action modifie l''état du compte et nécessite
    une vigilance accrue.


    L''agent doit suivre scrupuleusement les étapes suivantes :


    1. **Vérification de l''identité** : L''agent doit impérativement utiliser `verify_identity`.
    L''authentification forte est obligatoire avant tout ordre de bourse.

    2. **Identification du compte** : Utiliser `get_accounts` pour obtenir l'' `account_id`
    exact du compte sur lequel l''opération doit être effectuée.

    3. **Vérification des fonds et des titres** : L''agent doit appeler `get_positions`
    (pour une vente) ou vérifier le solde espèces via `get_accounts` (pour un achat)
    afin de s''assurer que l''opération est possible.

    4. **Collecte des paramètres de l''ordre** : L''agent doit obtenir du client le
    ticker du titre, la quantité souhaitée et le type d''ordre (au marché ou à cours
    limité).

    5. **Exécution** : L''agent appelle l''outil `place_trade` avec les paramètres
    collectés.


    L''agent doit rappeler au client que le capital investi n''est jamais garanti.
    Si l''ordre concerne un PEA, l''agent doit s''assurer que le titre est éligible
    à l''enveloppe fiscale concernée. L''agent ne doit jamais garantir le rendement
    de l''opération.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: valbreuil_bourse
- id: 95d70973-fea8-5005-b2eb-e9283385eedd
  title: Référence de l'outil place_trade
  body: 'L''outil `place_trade` permet l''exécution d''un ordre boursier d''achat
    ou de vente.


    **Signature de l''outil** :

    `place_trade(account_id: string, ticker: string, quantity: integer, order_type:
    string)`


    **Arguments** :

    - `account_id` : L''identifiant unique du compte, récupéré via `get_accounts`.

    - `ticker` : Le code mnémonique du titre financier.

    - `quantity` : Le nombre de titres à acheter ou vendre.

    - `order_type` : Le type d''exécution (ex: "MARKET" pour un ordre au marché, "LIMIT"
    pour un ordre à cours limité).


    **Effet** :

    L''outil transmet l''ordre au moteur d''exécution de Valbreuil Bourse. L''opération
    entraîne la modification du solde espèces et/ou du portefeuille de titres du client.


    **Utilisation** :

    L''agent appelle l''outil directement après avoir validé l''identité du client
    et collecté les paramètres de l''ordre. L''agent ne redirige jamais le client
    vers un portail externe pour passer un ordre.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: valbreuil_bourse
- id: 6905acd6-3cf5-5899-9556-13250bc232b9
  title: Quand utiliser initiate_securities_transfer
  body: 'L''outil `initiate_securities_transfer` est utilisé lorsqu''un client souhaite
    transférer des titres ou une enveloppe fiscale (PEA ou Compte-titres ordinaire)
    depuis un autre établissement financier vers Valbreuil Bourse.


    L''agent doit appliquer la procédure suivante :


    1. **Vérification de l''identité** : L''agent doit utiliser `verify_identity`
    pour confirmer l''identité du demandeur.

    2. **Cible du transfert** : L''agent utilise `get_accounts` pour identifier l''
    `account_id` du compte de destination chez Valbreuil Bourse.

    3. **Collecte des informations source** : L''agent demande au client le nom de
    l''établissement financier d''origine ainsi que la liste des titres à transférer.

    4. **Lancement du transfert** : L''agent appelle `initiate_securities_transfer`
    avec l''identifiant du compte de destination, le nom de l''institution source
    et la liste des actifs.


    L''agent doit informer le client qu''un délai de règlement-livraison peut s''appliquer
    et que le transfert est soumis à la validation des deux établissements. Le client
    doit être averti que Valbreuil Bourse s''assure de la conformité des titres transférés
    avec l''enveloppe fiscale choisie.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_securities_transfer
  institution_id: valbreuil_bourse
- id: 9bdb20f6-a692-5e0b-a34c-9f6252091790
  title: Référence de l'outil initiate_securities_transfer
  body: 'L''outil `initiate_securities_transfer` permet de lancer la procédure de
    transfert entrant de titres ou d''une enveloppe fiscale.


    **Signature de l''outil** :

    `initiate_securities_transfer(account_id: string, source_institution_name: string,
    asset_list: string)`


    **Arguments** :

    - `account_id` : L''identifiant du compte Valbreuil Bourse devant recevoir les
    titres (obtenu via `get_accounts`).

    - `source_institution_name` : Le nom complet de la banque ou du courtier d''origine
    tel que fourni par le client.

    - `asset_list` : La description des titres ou le montant global à transférer.


    **Effet** :

    L''outil déclenche l''émission d''une demande de transfert auprès de l''établissement
    source.


    **Utilisation** :

    L''agent appelle l''outil directement dans la conversation après authentification
    du client. L''agent ne demande pas au client de remplir un formulaire papier ou
    un portail tiers pour initier l''action.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_securities_transfer
  institution_id: valbreuil_bourse
- id: a5aebb0f-9433-59ab-8a6b-4b261e138bef
  title: Quand utiliser set_up_investment_plan
  body: 'L''outil `set_up_investment_plan` est utilisé pour mettre en place une stratégie
    d''investissement automatisée consistant en l''achat périodique d''un ETF pour
    un montant fixe.


    L''agent doit suivre la procédure suivante :


    1. **Vérification de l''identité** : L''agent doit utiliser `verify_identity`
    avant toute modification de la stratégie d''investissement.

    2. **Identification du compte** : Utiliser `get_accounts` pour récupérer l'' `account_id`
    du compte concerné.

    3. **Vérification du montant** : L''agent doit s''assurer que le montant périodique
    choisi par le client est au minimum de 25 €, conformément aux conditions du produit
    Investissement programmé en ETF.

    4. **Collecte des paramètres** : L''agent doit obtenir le ticker de l''ETF cible,
    le montant exact à investir et la fréquence des achats.

    5. **Exécution** : L''agent appelle l''outil `set_up_investment_plan` avec les
    informations collectées.


    L''agent doit préciser au client que cette solution permet de lisser le risque
    sur le long terme, mais qu''elle ne garantit aucun rendement futur. L''agent doit
    également mentionner que certains plans d''investissement automatisés bénéficient
    d''une gratuité totale des frais d''exécution.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_investment_plan
  institution_id: valbreuil_bourse
- id: eaafc20b-e7ac-5991-817c-2aa339f538b5
  title: Référence de l'outil set_up_investment_plan
  body: 'L''outil `set_up_investment_plan` permet à l''agent de configurer un plan
    d''investissement automatisé pour le compte d''un client. Par cet appel, l''agent
    programme l''achat périodique d''un ETF afin de lisser le risque de marché.


    L''agent effectue cette action en appelant l''outil directement dans la conversation,
    sans rediriger le client vers un portail externe.


    **Signature de l''outil :**

    `set_up_investment_plan(account_id: string, etf_ticker: string, amount: number,
    frequency: string)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte du client (obtenu via `get_accounts`).

    - `etf_ticker` : Le code ticker de l''ETF sélectionné pour l''investissement programmé.

    - `amount` : Le montant fixe à investir à chaque échéance (en euros).

    - `frequency` : La périodicité des achats (par exemple : ''mensuel'', ''trimestriel'').


    **Effet :**

    L''outil active le prélèvement et l''exécution automatique des ordres d''achat
    selon les paramètres définis. L''investissement est alors effectif dès la première
    date d''échéance programmée.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_investment_plan
  institution_id: valbreuil_bourse
- id: 0828e964-1192-5448-bab4-57ada1ce1154
  title: Quand utiliser update_beneficiary
  body: 'L''outil `update_beneficiary` doit être utilisé lorsqu''un client souhaite
    modifier le compte bancaire de référence (IBAN) associé à son compte Valbreuil
    Bourse. Ce compte est celui vers lequel sont systématiquement virés les retraits
    d''espèces.


    Conformément à notre politique de sécurité, aucun changement de coordonnées bancaires
    ne peut être effectué sans une validation rigoureuse de l''identité du client.
    L''agent doit suivre scrupuleusement la procédure suivante :


    1. **Vérification d''identité** : L''agent doit impérativement lancer la procédure
    de vérification d''identité forte pour s''assurer de l''authenticité de la demande.

    2. **Identification du compte** : L''agent utilise l''outil `get_accounts` pour
    identifier l''identifiant technique (`account_id`) correspondant au compte concerné,
    en se basant sur les derniers chiffres fournis par le client.

    3. **Collecte des informations** : L''agent demande au client le nouvel IBAN complet.
    L''agent doit s''assurer que le compte est bien au nom du titulaire du compte
    de titres.

    4. **Exécution** : Une fois les informations validées, l''agent appelle l''outil
    `update_beneficiary` en transmettant l''identifiant du compte et le nouvel IBAN.


    L''agent doit confirmer au client que la modification a été enregistrée et préciser
    que tout retrait ultérieur sera dirigé vers ce nouveau bénéficiaire.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: valbreuil_bourse
- id: ae9df412-0b1f-5aeb-a17f-2ffcbd695940
  title: Référence de l'outil update_beneficiary
  body: 'L''outil `update_beneficiary` permet de modifier les coordonnées bancaires
    de destination pour les retraits de fonds d''un compte client. L''agent exécute
    cette modification directement via l''outil après avoir vérifié l''identité du
    demandeur.


    **Signature de l''outil :**

    `update_beneficiary(account_id: string, new_iban: string)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte dont le bénéficiaire doit être
    modifié (obtenu via `get_accounts`).

    - `new_iban` : Le nouvel IBAN complet du compte bancaire de référence.


    **Effet :**

    Le compte bancaire de référence est mis à jour instantanément dans le système.
    Tous les futurs virements de fonds sortants seront dirigés vers ce nouvel IBAN.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: valbreuil_bourse
- id: b982036a-9d10-558b-90cc-495b18e325e0
  title: Quand utiliser get_accounts
  body: 'L''outil `get_accounts` est le point d''entrée indispensable pour toute opération
    nécessitant la connaissance précise des comptes détenus par un client chez Valbreuil
    Bourse. Il doit être utilisé dans les situations suivantes :


    - Lorsqu''un client souhaite obtenir la liste de ses comptes actifs (PEA, Compte-titres,
    etc.).

    - Lorsqu''un client mentionne un compte par ses derniers chiffres (par exemple
    : "mon compte finissant par 1234") et que l''agent doit retrouver l''identifiant
    technique (`account_id`) pour exécuter une autre action.

    - Avant toute opération de transfert, de clôture ou de modification de coordonnées
    bancaires.


    **Procédure d''utilisation :**


    1. **Authentification** : L''agent doit s''assurer que le client a été correctement
    authentifié dans la session en cours.

    2. **Appel de l''outil** : L''agent appelle l''outil `get_accounts` sans argument
    spécifique pour récupérer l''ensemble des comptes liés au profil du client.

    3. **Analyse et résolution** : L''agent identifie le ou les comptes correspondants
    à la demande du client et utilise l''identifiant unique retourné pour les étapes
    suivantes de la conversation.


    L''agent ne doit jamais demander au client de fournir lui-même son `account_id`
    technique, car celui-ci est une donnée interne.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: valbreuil_bourse
- id: b5a3e026-8672-5f94-8abb-3939fcbf7f5e
  title: Référence de l'outil get_accounts
  body: 'L''outil `get_accounts` permet de récupérer la liste complète et détaillée
    des comptes ouverts par le client au sein de l''institution Valbreuil Bourse.


    L''agent appelle cet outil directement pour identifier les comptes disponibles
    et obtenir les identifiants techniques nécessaires aux autres fonctions de gestion.


    **Signature de l''outil :**

    `get_accounts()`


    **Arguments :**

    L''outil ne requiert aucun argument ; il s''appuie sur l''identité du client authentifié
    dans la session.


    **Effet :**

    L''outil retourne une liste d''objets contenant pour chaque compte : l''identifiant
    technique (`account_id`), le type de produit (ex: PEA, compte-titres), le solde
    actuel et l''état du compte (actif/gelé).'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: valbreuil_bourse
- id: c1304fa9-a2ae-5a03-a540-0c3ee500cb97
  title: Quand utiliser open_account
  body: 'L''outil `open_account` est utilisé lorsqu''un prospect ou un client existant
    souhaite souscrire à un nouveau produit d''investissement. Valbreuil Bourse propose
    plusieurs enveloppes : le Plan d''épargne en actions (PEA), le PEA-PME, le PEA
    Jeune, le Compte-titres ordinaire ou l''Investissement programmé en ETF.


    L''ouverture de compte est soumise à des obligations réglementaires strictes (MiFID
    II). L''agent doit suivre les étapes suivantes :


    1. **Vérification d''identité** : S''assurer de l''identité du demandeur via une
    authentification forte.

    2. **Évaluation de l''adéquation** : L''agent doit mener un entretien pédagogique
    pour vérifier que le produit choisi correspond aux connaissances, à l''expérience
    et aux objectifs du client. Si le produit est jugé inapproprié, l''agent doit
    en informer le client sans ambiguïté.

    3. **Collecte des informations** : Recueillir les détails nécessaires à la création
    du compte (nom complet, date de naissance, adresse, justificatifs d''identité
    et de domicile).

    4. **Choix du produit** : Confirmer l''identifiant du produit souhaité (`product_id`).

    5. **Exécution** : L''agent appelle l''outil `open_account` pour finaliser la
    création.


    L''agent ne doit jamais garantir de rendement lors de ce processus et doit rappeler
    que le capital investi n''est jamais garanti.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: valbreuil_bourse
- id: 901f891e-6097-5dfd-93a4-f33ceaf489af
  title: Référence de l'outil open_account
  body: 'L''outil `open_account` permet de créer un nouveau compte d''investissement
    pour un client après validation de son identité et de son profil de risque.


    L''agent effectue l''ouverture du compte en appelant l''outil directement dans
    la conversation.


    **Signature de l''outil :**

    `open_account(product_id: string, customer_details: object)`


    **Arguments :**

    - `product_id` : L''identifiant technique du produit à ouvrir (ex: ''pea'', ''pea_pme'',
    ''pea_jeune'', ''compte_titres'', ''investissement_programme'').

    - `customer_details` : Un objet contenant les informations d''identité du client
    (nom, prénom, date de naissance, adresse postale, email, téléphone) telles que
    communiquées par le client.


    **Effet :**

    L''outil crée le compte dans le système, génère un `account_id` unique et initie
    le processus de conformité réglementaire. Le client reçoit une notification de
    confirmation d''ouverture.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: valbreuil_bourse
- id: 3fb5e563-48fc-50a0-aede-adc9cd25ede6
  title: Quand utiliser close_account
  body: 'L''outil `close_account` doit être utilisé lorsqu''un client demande la fermeture
    définitive de l''un de ses comptes. Cette opération est irréversible.


    Pour protéger les actifs du client et respecter les obligations de règlement-livraison,
    l''agent doit suivre cette procédure :


    1. **Vérification d''identité** : Une authentification forte et rigoureuse est
    obligatoire avant toute action modifiant l''état du compte.

    2. **Identification du compte** : Utiliser l''outil `get_accounts` pour obtenir
    l''identifiant technique (`account_id`) du compte à clôturer.

    3. **Vérification des positions** : L''agent doit s''assurer que le compte ne
    contient plus de titres (tous les titres doivent avoir été vendus ou transférés)
    et que le solde espèces est nul (fonds retirés vers le compte bénéficiaire).

    4. **Confirmation** : L''agent doit explicitement informer le client que la clôture
    est irréversible.

    5. **Exécution** : L''agent appelle l''outil `close_account`.


    Si le compte présente un solde créditeur ou des titres, l''agent doit d''abord
    accompagner le client dans la liquidation ou le transfert des actifs avant de
    procéder à la clôture.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: valbreuil_bourse
- id: 8d02050a-7be8-5097-8eb5-77b38df7fe28
  title: Référence de l'outil close_account
  body: 'L''outil `close_account` permet de procéder à la fermeture définitive et
    irréversible d''un compte d''investissement.


    L''agent effectue cette action en appelant l''outil directement, après avoir vérifié
    que le compte est vide de toute position et de tout solde espèces.


    **Signature de l''outil :**

    `close_account(account_id: string)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte à clôturer (obtenu via `get_accounts`).


    **Effet :**

    Le compte est marqué comme fermé dans le système. Il n''est plus possible d''effectuer
    des opérations sur ce compte. Un relevé de clôture est généré et envoyé au client.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: valbreuil_bourse
- id: b82067e8-4e10-59b2-85a8-0806cddfe23c
  title: Quand utiliser update_contact_info
  body: 'L''outil `update_contact_info` est utilisé lorsqu''un client souhaite modifier
    ses informations de contact personnelles, telles que son adresse postale, son
    adresse e-mail ou son numéro de téléphone.


    Parce que ces informations sont essentielles pour l''envoi des relevés réglementaires
    et la sécurisation du compte, aucun changement ne peut être effectué sans une
    validation sécurisée préalable.


    **Procédure d''utilisation :**


    1. **Vérification d''identité** : L''agent doit impérativement lancer l''authentification
    forte pour valider l''identité du client.

    2. **Collecte des modifications** : L''agent demande au client de préciser l''information
    à modifier et de fournir la nouvelle donnée exacte.

    3. **Exécution** : L''agent appelle l''outil `update_contact_info` en transmettant
    les nouvelles coordonnées.

    4. **Confirmation** : L''agent confirme au client que ses informations ont été
    mises à jour et qu''il recevra une notification de confirmation sur ses anciens
    et nouveaux canaux de communication.


    L''agent doit être vigilant : si la demande de changement de coordonnées semble
    suspecte, il doit geler le compte conservatoirement pour protéger les actifs du
    client et escalader la demande vers la direction des opérations.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: valbreuil_bourse
- id: f3b38092-31a1-5c2a-a655-70e91b2867cf
  title: Référence de l'outil update_contact_info
  body: 'L''outil update_contact_info permet à l''agent de modifier les informations
    de contact personnelles d''un client au sein de son dossier administratif. L''agent
    effectue cette action en appelant l''outil directement après avoir procédé à une
    authentification forte et rigoureuse du client.


    **Signature de l''outil :**

    `update_contact_info(account_id, email=None, phone_number=None, physical_address=None)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte, obtenu préalablement via l''outil
    get_accounts.

    - `email` : La nouvelle adresse électronique fournie par le client.

    - `phone_number` : Le nouveau numéro de téléphone mobile fourni par le client.

    - `physical_address` : La nouvelle adresse postale complète fournie par le client.


    **Effet :**

    La mise à jour des coordonnées est appliquée instantanément au profil du client.
    Conformément à notre politique de sécurité, aucun changement de coordonnées ne
    peut être effectué sans une validation sécurisée préalable. L''outil retourne
    une confirmation de succès ou un message d''erreur en cas d''invalidité du format
    des données saisies.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: valbreuil_bourse
- id: 93bb7b99-21dd-5597-a840-164d4872c770
  title: Quand utiliser get_statements
  body: "L'extraction des relevés de compte est une opération fondamentale pour permettre\
    \ à nos clients d'assurer le suivi de leurs investissements et de remplir leurs\
    \ obligations fiscales. L'outil get_statements doit être utilisé lorsque le client\
    \ souhaite obtenir un récapitulatif officiel de ses positions, de ses transactions\
    \ ou de son solde pour une période donnée, notamment dans le cadre d'une déclaration\
    \ d'impôts ou d'un audit patrimonial.\n\nIl est impératif de rappeler au client\
    \ que, bien que Valbreuil Bourse assure une rigueur réglementaire stricte et que\
    \ les titres soient protégés par le FGDR jusqu'à 70 000 €, le capital investi\
    \ n'est jamais garanti.\n\n**Procédure d'exécution :**\n\n1. **Vérification d'identité**\
    \ : L'agent doit impérativement déclencher une authentification forte via l'outil\
    \ verify_identity pour s'assurer de l'identité du demandeur.\n2. **Identification\
    \ du compte** : L'agent utilise l'outil get_accounts pour identifier l'account_id\
    \ correspondant au client (en se basant, par exemple, sur les quatre derniers\
    \ chiffres du compte fournis par le client).\n3. **Définition de la période**\
    \ : L'agent demande au client la période exacte pour laquelle le relevé est souhaité\
    \ (mois, trimestre ou année civile).\n4. **Génération du document** : L'agent\
    \ appelle l'outil get_statements en renseignant l'account_id et la période définie.\
    \ \n5. **Transmission** : Le document est alors mis à disposition du client via\
    \ sa messagerie sécurisée.\n\nL'agent ne doit en aucun cas envoyer de relevés\
    \ vers une adresse électronique non validée. Pour toute modification d'adresse\
    \ avant l'envoi, l'agent doit se référer à la procédure de mise à jour des coordonnées.\
    \ Pour consulter l'historique des opérations en temps réel, le client peut également\
    \ être orienté vers la section de suivi de son interface."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: valbreuil_bourse
- id: da4f32ff-3fee-5a6d-a44b-da996ce1dbcc
  title: Référence de l'outil get_statements
  body: 'L''outil get_statements permet à l''agent de générer et de transmettre les
    relevés de compte officiels d''un client. L''agent réalise cette action en appelant
    l''outil directement dans la conversation après avoir vérifié l''identité du client.


    **Signature de l''outil :**

    `get_statements(account_id, statement_type, period)`


    **Arguments :**

    - `account_id` : L''identifiant du compte concerné, récupéré via l''outil get_accounts.

    - `statement_type` : Le type de document souhaité (ex: ''mensuel'', ''trimestriel'',
    ''annuel'').

    - `period` : La date ou la plage de dates correspondant à la période visée (ex:
    ''2023-Q4'' ou ''2023'').


    **Effet :**

    L''outil génère le relevé correspondant et l''adresse dans la messagerie sécurisée
    du client. L''agent reçoit une confirmation de la génération du document, qu''il
    doit alors notifier au client. Cet outil est strictement réservé aux documents
    officiels et ne doit pas être confondu avec une simple consultation de positions
    en temps réel.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: valbreuil_bourse
- id: 5c1f9e4b-ac36-5d9d-a9eb-d1f22aaeadc9
  title: Quand utiliser set_alerts
  body: "La mise en place d'alertes est un service pédagogique et de suivi visant\
    \ à aider l'investisseur averti à réagir aux fluctuations du marché sans avoir\
    \ à consulter son interface en permanence. L'outil set_alerts est utilisé pour\
    \ configurer des notifications automatiques basées sur des seuils de prix pour\
    \ des titres spécifiques ou sur des seuils de solde pour un compte donné.\n\n\
    L'agent doit préciser au client que ces alertes sont des outils d'information\
    \ et ne constituent en aucun cas un conseil d'investissement ou une garantie de\
    \ rendement. Valbreuil Bourse se limite à un standard de soin basé sur le profil\
    \ de risque défini lors de l'évaluation de l'adéquation.\n\n**Procédure d'exécution\
    \ :**\n\n1. **Vérification d'identité** : L'agent doit effectuer une authentification\
    \ forte via l'outil verify_identity.\n2. **Identification du compte** : L'agent\
    \ utilise l'outil get_accounts pour obtenir l'account_id du compte sur lequel\
    \ l'alerte doit porter.\n3. **Définition du déclencheur** : L'agent demande au\
    \ client le type d'alerte souhaité :\n    - Une alerte de prix (ex: \"M'alerter\
    \ si l'action X atteint 100 €\").\n    - Une alerte de solde (ex: \"M'alerter\
    \ si le solde de mon Compte-titres ordinaire descend en dessous de 500 €\").\n\
    4. **Configuration** : L'agent appelle l'outil set_alerts avec l'account_id, le\
    \ type de déclencheur et la valeur cible.\n5. **Confirmation** : L'agent confirme\
    \ au client la mise en place de l'alerte et le canal de notification (messagerie\
    \ sécurisée/e-mail).\n\nEn cas de demande complexe impliquant plusieurs conditions,\
    \ l'agent doit escalader la demande vers la direction des opérations."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: valbreuil_bourse
- id: 25ea591a-9d82-56d9-95f2-8e7c4db3f160
  title: Référence de l'outil set_alerts
  body: 'L''outil set_alerts permet à l''agent de programmer des notifications automatiques
    pour le compte d''un client. L''agent déclenche cette action en appelant l''outil
    directement après authentification.


    **Signature de l''outil :**

    `set_alerts(account_id, alert_type, trigger_value, description)`


    **Arguments :**

    - `account_id` : L''identifiant du compte, obtenu via get_accounts.

    - `alert_type` : La nature de l''alerte (ex: ''price_threshold'', ''balance_threshold'').

    - `trigger_value` : La valeur numérique qui déclenche la notification (ex: ''150,00'').

    - `description` : Un texte court décrivant l''alerte pour le client (ex: "Alerte
    prix Action ABC à 150 €").


    **Effet :**

    L''outil enregistre la condition de déclenchement dans le système de monitoring.
    Dès que la condition est remplie, une notification est envoyée au client. L''outil
    retourne un identifiant d''alerte confirmant la création réussie de la notification.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: valbreuil_bourse
- id: 33f14667-87a0-538d-93b5-fe079ca66ef3
  title: Quand utiliser transfer_funds
  body: 'L''outil transfer_funds est utilisé pour effectuer des mouvements de liquidités
    internes entre deux comptes détenus par le même client au sein de Valbreuil Bourse.
    Cela peut concerner, par exemple, le transfert de fonds d''un Compte-titres ordinaire
    vers un Plan d''épargne en actions (PEA) pour optimiser la fiscalité, dans la
    limite des plafonds réglementaires (150 000 € pour le PEA standard).


    Il est rappelé que cet outil concerne uniquement les espèces (cash) et non les
    titres. Pour le transfert de titres, l''agent doit utiliser l''outil initiate_securities_transfer.


    **Procédure d''exécution :**


    1. **Vérification d''identité** : L''agent doit obligatoirement procéder à une
    authentification forte via l''outil verify_identity.

    2. **Identification des comptes** : L''agent utilise l''outil get_accounts pour
    identifier et confirmer les account_id du compte source et du compte destination.

    3. **Vérification du solde** : L''agent doit s''assurer que le solde du compte
    source est suffisant pour couvrir le transfert.

    4. **Exécution du transfert** : L''agent appelle l''outil transfer_funds en précisant
    l''identifiant du compte source, l''identifiant du compte destination et le montant
    exact en euros.

    5. **Confirmation** : L''agent confirme l''exécution immédiate du transfert et
    invite le client à consulter son historique.


    L''agent doit s''assurer que le transfert vers un PEA ne conduit pas à un dépassement
    du plafond de versement. Si le client est âgé de 18 à 25 ans et utilise un PEA
    Jeune, le plafond est limité à 20 000 €.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: valbreuil_bourse
- id: 48e03415-27ff-5d1c-b78e-12809097a7d7
  title: Référence de l'outil transfer_funds
  body: 'L''outil transfer_funds permet de déplacer des fonds entre deux comptes d''un
    même client. L''agent effectue l''opération en appelant l''outil directement après
    authentification.


    **Signature de l''outil :**

    `transfer_funds(source_account_id, destination_account_id, amount)`


    **Arguments :**

    - `source_account_id` : L''identifiant du compte dont les fonds sont débités,
    obtenu via get_accounts.

    - `destination_account_id` : L''identifiant du compte crédité, obtenu via get_accounts.

    - `amount` : Le montant à transférer, exprimé en euros (ex: ''1000,00'').


    **Effet :**

    L''outil débite instantanément le compte source et crédite le compte destination.
    L''opération est irréversible. L''outil retourne un numéro de transaction unique
    servant de preuve d''exécution. En cas de solde insuffisant sur le compte source,
    l''outil retourne une erreur de fonds insuffisants.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: valbreuil_bourse
- id: 7884725a-8f02-54be-8f08-ccc4d7b8b426
  title: Quand utiliser cancel_order
  body: 'L''annulation d''un ordre de bourse est une opération délicate qui ne peut
    être effectuée que si l''ordre n''a pas encore été exécuté sur le marché. L''outil
    cancel_order est utilisé lorsque le client souhaite modifier sa stratégie ou corriger
    une erreur de saisie avant que le règlement-livraison ne soit engagé.


    L''agent doit informer le client que si l''ordre a déjà été partiellement ou totalement
    exécuté, l''annulation ne pourra porter que sur la portion restante de l''ordre.


    **Procédure d''exécution :**


    1. **Vérification d''identité** : L''agent doit effectuer une authentification
    forte via l''outil verify_identity.

    2. **Identification du compte** : L''agent utilise l''outil get_accounts pour
    obtenir l''account_id du client.

    3. **Vérification du statut de l''ordre** : L''agent utilise l''outil get_order_status
    pour confirmer que l''ordre est toujours dans un état ''en attente'' (pending)
    et n''est pas encore ''exécuté'' (filled).

    4. **Exécution de l''annulation** : L''agent appelle l''outil cancel_order en
    renseignant l''account_id et l''identifiant de l''ordre (order_id) fourni par
    le client ou récupéré via get_order_status.

    5. **Confirmation** : L''agent confirme au client que l''ordre a été annulé et
    que les fonds ou titres réservés pour cette opération ont été libérés.


    L''agent ne garantit aucun rendement suite à l''annulation d''un ordre et se limite
    à l''exécution technique de la demande.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: valbreuil_bourse
- id: 9c907100-5e74-59a8-8483-fe6c2a1edda6
  title: Référence de l'outil cancel_order
  body: 'L''outil cancel_order permet d''annuler un ordre boursier non encore exécuté.
    L''agent réalise cette action en appelant l''outil directement après authentification.


    **Signature de l''outil :**

    `cancel_order(account_id, order_id)`


    **Arguments :**

    - `account_id` : L''identifiant du compte associé à l''ordre, obtenu via get_accounts.

    - `order_id` : L''identifiant unique de l''ordre à annuler, obtenu via get_order_status
    ou fourni par le client.


    **Effet :**

    L''outil tente d''annuler l''ordre auprès du marché. Si l''ordre est encore annulable,
    il change son statut en ''annulé'' et libère les actifs. L''outil retourne une
    confirmation de l''annulation ou un message d''erreur si l''ordre est déjà exécuté
    ou en cours de traitement final, rendant l''annulation impossible.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: valbreuil_bourse
- id: 7790e6bd-4fc1-5760-9740-e70b8c3f1ad3
  title: Quand utiliser get_order_status
  body: "Le suivi des ordres est essentiel pour la transparence des opérations de\
    \ Valbreuil Bourse. L'outil get_order_status doit être utilisé chaque fois qu'un\
    \ client s'interroge sur l'état d'avancement d'un achat ou d'une vente de titres,\
    \ ou lorsqu'il souhaite savoir si un ordre a été partiellement exécuté.\n\nL'agent\
    \ doit être capable d'expliquer au client la notion de règlement-livraison, qui\
    \ est le délai conventionnel entre l'exécution d'un ordre et le transfert effectif\
    \ de la propriété des titres.\n\n**Procédure d'exécution :**\n\n1. **Vérification\
    \ d'identité** : L'agent doit déclencher une authentification forte via l'outil\
    \ verify_identity.\n2. **Identification du compte** : L'agent utilise l'outil\
    \ get_accounts pour identifier l'account_id du client.\n3. **Récupération du statut**\
    \ : L'agent appelle l'outil get_order_status en renseignant l'account_id et l'identifiant\
    \ de l'ordre (order_id).\n4. **Interprétation et communication** : L'agent communique\
    \ le statut actuel au client en utilisant un langage clair :\n    - \"En attente\"\
    \ : L'ordre est enregistré mais pas encore exécuté.\n    - \"Exécuté\" : L'opération\
    \ a été réalisée sur le marché.\n    - \"Annulé\" : L'ordre a été supprimé.\n\
    \    - \"Échoué\" : L'ordre n'a pas pu être traité (ex: manque de liquidités).\n\
    \nSi le client souhaite annuler un ordre suite à la consultation de son statut,\
    \ l'agent doit alors basculer vers la procédure d'annulation."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: valbreuil_bourse
- id: a401b1df-8f8e-5bc8-9a24-9b961cb6da51
  title: Référence de l'outil get_order_status
  body: 'L''outil get_order_status permet à l''agent de consulter en temps réel l''état
    d''avancement d''un ordre boursier spécifique. Cet outil est utilisé pour informer
    le client si son opération est en attente, exécutée, partiellement exécutée ou
    annulée.


    L''agent effectue cette action en appelant l''outil directement dans la conversation.
    L''outil ne modifie aucune donnée et est strictement consultatif.


    **Signature et arguments :**

    - `order_id` : L''identifiant unique de l''ordre, obtenu précédemment via l''historique
    des opérations ou communiqué par le client.


    **Effet :**

    L''outil retourne le statut actuel de l''ordre ainsi que l''horodatage de la dernière
    mise à jour. L''agent doit ensuite traduire ce statut technique en une explication
    pédagogique pour le client, en précisant si nécessaire le délai de règlement-livraison
    applicable à l''opération.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: valbreuil_bourse
- id: 5d16aba6-62dc-5b32-b4bc-55cb253132fc
  title: Quand utiliser deposit_funds
  body: 'L''outil deposit_funds est utilisé pour créditer un compte de titres ou une
    enveloppe fiscale (telle qu''un Plan d''épargne en actions (PEA), un PEA-PME ou
    un PEA Jeune) via un virement bancaire. Cette procédure est essentielle pour permettre
    au client d''augmenter sa capacité d''investissement.


    Conformément à la posture de sécurité de Valbreuil Bourse, tout dépôt de fonds
    nécessite une authentification forte et une vérification d''identité rigoureuse
    avant toute action modifiant l''état du compte.


    **Procédure opérationnelle :**


    1. **Vérification d''identité** : L''agent doit s''assurer de l''identité du client
    via le protocole de vérification standard.

    2. **Identification du compte** : L''agent utilise l''outil get_accounts pour
    identifier l''identifiant interne du compte (`account_id`) correspondant aux quatre
    derniers chiffres du compte cités par le client.

    3. **Confirmation des modalités** : L''agent demande au client le montant exact
    du dépôt et confirme que les fonds proviennent d''un compte ouvert à son nom propre,
    conformément aux réglementations anti-blanchiment (LCB-FT).

    4. **Exécution** : L''agent appelle l''outil deposit_funds en renseignant le montant
    et l''identifiant du compte cible.


    L''agent doit informer le client que le crédit effectif sur le compte dépendra
    des délais interbancaires. Pour les investisseurs utilisant l''Investissement
    programmé en ETF, l''agent peut rappeler que les fonds déposés serviront à alimenter
    les échéances futures dès 25 €.


    En cas de doute sur l''origine des fonds ou de comportement suspect, l''agent
    doit immédiatement escalader la demande vers le responsable de la conformité.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: valbreuil_bourse
- id: 20a1498b-f5df-5a20-bccf-5ec51b877649
  title: Référence de l'outil deposit_funds
  body: 'L''outil deposit_funds permet d''initier l''enregistrement d''un versement
    de fonds vers un compte client. L''agent réalise cette opération en appelant l''outil
    directement après avoir validé l''identité du client.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du compte à créditer (obtenu via get_accounts).

    - `amount` : Le montant du dépôt exprimé en euros (€).

    - `currency` : La devise du versement (par défaut « EUR »).


    **Effet :**

    L''outil enregistre l''intention de dépôt et génère les instructions nécessaires
    pour le rapprochement bancaire. L''exécution finale dépend de la réception effective
    des fonds sur les comptes de l''institution. L''agent doit confirmer au client
    que la demande a été enregistrée avec succès et lui préciser le délai attendu
    pour la visibilité des fonds sur son interface.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: valbreuil_bourse
- id: ee8c72e1-d2cb-5830-b021-93724f291718
  title: Quand utiliser withdraw_funds
  body: 'L''outil withdraw_funds est utilisé pour transférer des liquidités depuis
    un compte Valbreuil Bourse vers le compte bancaire de référence du client. Cette
    opération est classée comme irréversible une fois initiée.


    La sécurité est primordiale : aucun retrait de fonds ne peut être effectué sans
    une authentification forte et une validation sécurisée des coordonnées bancaires.


    **Procédure opérationnelle :**


    1. **Vérification d''identité** : L''agent doit impérativement valider l''identité
    du client avant toute manipulation de fonds.

    2. **Identification du compte** : L''agent utilise l''outil get_accounts pour
    obtenir l''identifiant technique du compte (`account_id`) à partir duquel les
    fonds seront prélevés.

    3. **Vérification de la liquidité** : L''agent doit s''assurer que le solde en
    espèces disponible est suffisant pour couvrir le montant demandé. Les titres doivent
    être vendus préalablement si le client souhaite retirer des fonds issus de ses
    positions.

    4. **Validation du bénéficiaire** : L''agent confirme avec le client que le virement
    sera effectué vers l''IBAN enregistré. Si le client souhaite modifier ses coordonnées,
    l''agent doit d''abord utiliser l''outil update_beneficiary.

    5. **Exécution** : L''agent appelle l''outil withdraw_funds en spécifiant le montant
    et le compte source.


    L''agent doit rappeler au client que, conformément aux règles de l''AMF et de
    l''ACPR, les retraits depuis un Plan d''épargne en actions (PEA) peuvent entraîner
    la clôture du plan s''ils ne respectent pas les conditions réglementaires de sortie.
    L''agent ne fournit aucun conseil fiscal personnalisé sur l''impact d''un retrait.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: valbreuil_bourse
- id: 1f3d0328-d0a8-5ab4-88ba-d350d19e0370
  title: Référence de l'outil withdraw_funds
  body: 'L''outil withdraw_funds permet d''initier le transfert de fonds depuis un
    compte de l''institution vers le compte bancaire externe du client. L''agent effectue
    l''opération en appelant l''outil directement après vérification d''identité.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du compte source (obtenu via get_accounts).

    - `amount` : Le montant à retirer, exprimé en euros (€).

    - `destination_iban` : L''identifiant international du compte bancaire bénéficiaire.


    **Effet :**

    L''outil déclenche le processus de virement irréversible. Les fonds sont débités
    du compte espèces du client et envoyés vers la banque destinataire. L''agent doit
    avertir le client que les délais de réception dépendent des réseaux bancaires
    et que l''opération ne peut être annulée une fois soumise.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: valbreuil_bourse
- id: 6e337488-b777-5613-a67a-1ce70225b39d
  title: Quand utiliser manage_authorized_users
  body: "L'outil manage_authorized_users permet de modifier la liste des personnes\
    \ habilitées à agir sur un compte, que ce soit pour ajouter un mandataire ou révoquer\
    \ un accès existant.\n\nÉtant donné l'impact critique sur la sécurité des actifs,\
    \ cette procédure exige une vigilance absolue. Aucun changement de coordonnées\
    \ ou de droits d'accès ne peut être effectué sans validation sécurisée.\n\n**Procédure\
    \ opérationnelle :**\n\n1. **Vérification d'identité** : L'agent doit effectuer\
    \ une authentification forte du titulaire du compte.\n2. **Identification du compte**\
    \ : L'agent utilise l'outil get_accounts pour identifier le compte concerné par\
    \ la modification.\n3. **Collecte des informations** : \n    - Pour un ajout :\
    \ L'agent doit recueillir le nom complet, la date de naissance et les coordonnées\
    \ de contact de la personne à autoriser.\n    - Pour une suppression : L'agent\
    \ doit identifier précisément l'utilisateur à révoquer.\n4. **Information sur\
    \ les risques** : L'agent rappelle au client que l'ajout d'un utilisateur autorisé\
    \ lui donne le pouvoir d'effectuer des opérations sur ses actifs et que la responsabilité\
    \ du titulaire reste engagée.\n5. **Exécution** : L'agent appelle l'outil manage_authorized_users\
    \ avec les détails collectés et l'action souhaitée (ajout ou suppression).\n\n\
    Si l'agent suspecte une tentative d'usurpation d'identité ou une fraude lors de\
    \ cette demande, il doit geler les comptes conservatoirement et escalader le dossier\
    \ à la direction des opérations."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: valbreuil_bourse
- id: 5c2d2c78-a5e3-5e8d-9116-25964c3fc2bf
  title: Référence de l'outil manage_authorized_users
  body: 'L''outil manage_authorized_users permet de mettre à jour les droits d''accès
    d''un tiers sur un compte client. L''agent réalise cette action en appelant l''outil
    directement.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du compte concerné (obtenu via get_accounts).

    - `user_details` : Un ensemble de données comprenant le nom complet, la date de
    naissance et les coordonnées de contact du tiers.

    - `action` : La nature de l''opération, soit « add » pour ajouter un utilisateur,
    soit « remove » pour supprimer un utilisateur existant.


    **Effet :**

    L''outil modifie la liste des utilisateurs autorisés associée au compte. En cas
    d''ajout, le nouveau mandataire devra passer par un processus de vérification
    d''identité rigoureux avant de pouvoir exercer ses droits. L''agent doit confirmer
    au titulaire du compte que la modification a été prise en compte.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: valbreuil_bourse
