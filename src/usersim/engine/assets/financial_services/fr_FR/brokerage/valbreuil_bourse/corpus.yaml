- id: ce8905a2-2c29-5456-b11a-f96a5b4bd551
  title: Investissement programmé en ETF — problèmes d'accès ou de connexion
  body: "Ce document traite des difficultés techniques rencontrées lors de l'accès\
    \ à la gestion de votre Investissement programmé en ETF.\n\n**Symptôme : Impossible\
    \ d'accéder aux détails du plan ou de modifier les échéances.**\n\n**Causes probables\
    \ et vérifications :**\n1. **Échec de l'authentification forte** : Vérifiez que\
    \ vos appareils de confiance sont correctement synchronisés. Une erreur de validation\
    \ peut bloquer l'accès aux fonctions de modification.\n2. **Compte gelé conservatoirement**\
    \ : Si Valbreuil Bourse a détecté une activité suspecte, le compte est automatiquement\
    \ gelé pour protéger vos actifs. \n3. **Dossier de conformité incomplet** : Une\
    \ demande de mise à jour de vos justificatifs d'identité (KYC) peut restreindre\
    \ l'accès aux fonctionnalités de trading.\n\n**Résolution :**\n- Pour un problème\
    \ d'authentification, demandez-nous de réinitialiser vos clés de sécurité après\
    \ une vérification d'identité rigoureuse.\n- Si votre compte est gelé, nous procéderons\
    \ à un examen approfondi de vos dernières opérations. Vous devrez fournir tout\
    \ justificatif demandé pour lever la restriction.\n\n**Escalade :**\nSi le problème\
    \ persiste après ces vérifications, la demande est escaladée vers la direction\
    \ des opérations. Vous recevrez un accusé de réception immédiat et une résolution\
    \ sous un délai normé selon la complexité du dossier. Nous vous confirmerons la\
    \ levée du blocage par messagerie sécurisée."
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: troubleshooting
  source_authority: official
