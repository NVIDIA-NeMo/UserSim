- id: 99462cf7-9c62-5a98-885c-c412f2485d78
  title: Compte-titres ordinaire — comparaison avec les alternatives et quand ne pas
    le choisir
  body: 'Le Compte-titres ordinaire est l''instrument le plus polyvalent de l''offre
    Valbreuil Bourse, conçu pour l''investisseur qui refuse toute contrainte sur l''univers
    d''investissement ou le montant des capitaux engagés. Toutefois, selon vos objectifs,
    il peut ne pas être le choix optimal.


    **Pourquoi choisir le Compte-titres ordinaire ?**

    Il s''impose lorsque vous souhaitez investir sur des marchés mondiaux (États-Unis,
    Asie, etc.) sans être limité par des restrictions géographiques. Son absence de
    plafond de versement le rend indispensable pour les investisseurs avertis dont
    les apports dépassent les limites des enveloppes fiscales. De plus, avec des droits
    de garde annuels de 0 €, il permet une détention de titres à moindre coût sur
    le long terme.


    **Quand ne pas le choisir ?**


    1. **Recherche d''optimisation fiscale** : Si vous investissez exclusivement en
    Europe et souhaitez bénéficier d''un cadre fiscal privilégié, le PEA est préférable.
    Le Compte-titres ordinaire ne permet aucun report d''imposition sur les plus-values.


    2. **Investissement débutant et automatisé** : Si vous ne souhaitez pas sélectionner
    vos titres manuellement et payer 1,99 € par ordre, la solution d''investissement
    programmé en ETF est plus adaptée. Elle permet de lisser le risque dès 25 € sans
    nécessiter d''analyse technique approfondie.


    3. **Soutien aux PME** : Pour ceux dont l''objectif est spécifiquement le soutien
    aux petites et moyennes entreprises avec un plafond élargi, le PEA-PME offre des
    conditions plus spécifiques.


    **Comparatif rapide**

    - **Flexibilité** : Maximale (Compte-titres) vs Modérée (PEA).

    - **Plafond** : Aucun (Compte-titres) vs 150 000 € (PEA).

    - **Fiscalité** : Standard (Compte-titres) vs Optimisée (PEA).


    En résumé, le Compte-titres ordinaire est le choix de la liberté et de l''ouverture
    internationale, au prix d''une fiscalité classique. Pour une analyse détaillée
    des autres options, nous vous invitons à consulter Plan d''épargne en actions
    (PEA) — présentation.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 358cf170-f624-58c5-83cf-67e222612812
  title: Compte-titres ordinaire — éligibilité et souscription
  body: 'Qui peut ouvrir un Compte-titres ordinaire chez Valbreuil Bourse ?

    Ce produit est accessible aux résidents fiscaux français, ciblant particulièrement
    les investisseurs avertis et les jeunes actifs souhaitant diversifier leur patrimoine
    sur les marchés mondiaux.


    Quelles sont les étapes pour souscrire à ce produit ?

    La souscription commence par une demande via notre messagerie sécurisée. Nous
    procédons ensuite à une vérification d''identité rigoureuse et à une authentification
    forte. Enfin, nous réalisons une évaluation de l''adéquation MiFID II pour nous
    assurer que le produit correspond à vos objectifs et connaissances.


    Est-il possible d''ouvrir un compte sans expérience préalable en bourse ?

    Oui, toutefois, selon vos réponses au questionnaire d''adéquation, nous pourrions
    vous orienter vers des produits plus adaptés, comme l''investissement programmé
    en ETF, pour limiter vos risques initiaux.


    Quel est le délai d''activation du compte ?

    Une fois les justificatifs validés et l''évaluation de l''adéquation complétée,
    votre compte est activé dans les délais normés de notre direction des opérations.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 9bca9575-a967-5de8-bb6e-ed1407bac8a9
  title: Compte-titres ordinaire — traiter une demande courante de bout en bout
  body: 'L''une des demandes les plus fréquentes concernant le Compte-titres ordinaire
    est le transfert de titres depuis un autre établissement financier. Voici la procédure
    complète pour mener à bien cette opération :


    1. **Initiation de la demande** : Informez-nous via la messagerie sécurisée de
    votre souhait d''effectuer un transfert de titres entrant. Vous devez nous préciser
    le nom de l''établissement d''origine et la liste des lignes de titres (avec leurs
    codes ISIN) que vous souhaitez transférer.


    2. **Vérification de conformité** : Nous procédons à une vérification de votre
    identité et nous nous assurons que vos informations de compte sont à jour. Cette
    étape est cruciale pour garantir la sécurité des actifs transférés.


    3. **Transmission des instructions** : Une fois l''identité validée, nous contactons
    l''établissement détenteur pour initier le transfert. Vous n''avez aucune action
    supplémentaire à mener auprès de votre ancien courtier si vous nous avez donné
    mandat complet.


    4. **Suivi du Règlement-livraison** : Le transfert des titres n''est pas instantané.
    Il suit le délai conventionnel du règlement-livraison. Nous vous informons par
    messagerie dès que les titres sont effectivement inscrits sur votre compte Valbreuil
    Bourse.


    5. **Confirmation finale** : Vous recevrez un avis d''opération confirmant l''intégration
    des titres. Vous pourrez alors consulter vos positions et commencer à opérer sur
    ces titres, sachant que chaque futur ordre d''achat ou de vente sera soumis à
    la commission de courtage de 1,99 €.


    Sachez que cette opération est gratuite pour les transferts entrants chez Valbreuil
    Bourse. Si vous deviez un jour effectuer l''opération inverse, des frais de transfert
    sortant de 15 € par ligne s''appliqueraient. Pour toute question sur la gestion
    de vos actifs, vous pouvez consulter Compte-titres ordinaire — consulter le suivi
    ou l''historique.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: dbd50351-e661-50fc-9ff6-c9cfe1ad852a
  title: Compte-titres ordinaire — écart avec vos relevés
  body: 'Un client peut signaler un écart entre le solde ou la quantité de titres
    affichée sur son interface et les informations figurant sur son relevé officiel.
    Voici la méthodologie de résolution pour l''agent de support.


    **Symptômes constatés**

    Le client affirme qu''une transaction effectuée n''apparaît pas sur le relevé,
    ou que le solde en espèces ne correspond pas à ses calculs après un achat de titres.


    **Causes probables et points de contrôle**


    1. **Effet du Règlement-livraison** : C''est la cause la plus fréquente. Le client
    peut confondre la date d''exécution de l''ordre et la date de transfert effectif
    de la propriété des titres. Vérifiez si la transaction se situe dans la fenêtre
    du délai conventionnel de règlement-livraison.


    2. **Application des commissions** : Le client a peut-être omis d''intégrer la
    commission de courtage de 1,99 € dans son calcul de solde après achat. Vérifiez
    le détail des écritures pour confirmer que les frais ont été correctement prélevés.


    3. **Opérations en attente** : Vérifiez s''il existe des ordres dont l''exécution
    a été confirmée mais dont le dénouement financier n''est pas encore finalisé.


    **Procédure de correction**


    - **Explication pédagogique** : Si l''écart est dû au règlement-livraison, expliquez
    au client que le transfert effectif des titres et des fonds suit un délai réglementaire
    et que le relevé reflète l''état comptable à l''instant T.

    - **Rectification d''écriture** : Si une erreur technique de reporting est avérée,
    l''agent doit ouvrir un ticket d''incident vers la direction des opérations pour
    une correction manuelle du relevé.


    **Escalade**

    Si le client persiste à contester la validité d''un prélèvement ou d''une position
    malgré les explications, l''incident doit être escaladé vers le responsable de
    la conformité pour un audit détaillé des logs de transaction. Le client doit recevoir
    un accusé de réception immédiat de sa réclamation.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1f7e9b2a-c8a5-5aa1-94d2-a10d7d8c3ea1
  title: Frais et tarifs de l'établissement
  body: "Valbreuil Bourse applique une philosophie tarifaire alliant compétitivité\
    \ et rigueur réglementaire. Notre structure de coûts est conçue pour respecter\
    \ strictement les plafonds fixés par les autorités de tutelle, garantissant ainsi\
    \ une transparence totale pour nos clients.\n\nLes frais appliqués au sein de\
    \ l'institution ont pour objectif premier de couvrir la sécurisation des actifs\
    \ ainsi que l'intégralité du reporting réglementaire requis pour le maintien de\
    \ nos agréments. \n\nIl convient de noter que :\n- Certains frais sont transversaux\
    \ et s'appliquent à l'ensemble des comptes ouverts chez nous.\n- D'autres frais\
    \ varient selon la nature du produit détenu et son enveloppe fiscale.\n- À l'inverse,\
    \ Valbreuil Bourse propose une gratuité totale sur certains de ses plans d'investissement\
    \ automatisés, favorisant ainsi une stratégie d'accumulation régulière.\n\nPour\
    \ obtenir le détail précis des coûts liés à un produit spécifique, nous vous invitons\
    \ à consulter les grilles tarifaires dédiées, telles que le document Plan d'épargne\
    \ en actions (PEA) — grille tarifaire ou Compte-titres ordinaire — grille tarifaire."
  domain: brokerage_investing
  product_category: general
  document_type: fee_schedule
  source_authority: official
