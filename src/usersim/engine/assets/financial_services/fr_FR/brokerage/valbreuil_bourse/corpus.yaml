  mentions_tools: []
  institution_id: valbreuil_bourse
- id: cbad883e-ba62-50c9-84f6-1aef1aa90b93
  title: Plan d'épargne en actions (PEA) — souscrire et activer
  body: 'L''ouverture d''un Plan d''épargne en actions (PEA) au sein de Valbreuil
    Bourse est un processus rigoureux visant à sécuriser vos actifs et à garantir
    la conformité réglementaire de vos investissements.


    Avant de commencer, assurez-vous de disposer d''une pièce d''identité valide et
    d''un justificatif de domicile récent.


    Voici les étapes de souscription :


    1. Demandez l''ouverture de votre compte en nous transmettant vos documents d''identité
    et de résidence. Nous procéderons à une vérification d''identité rigoureuse, étape
    obligatoire avant toute activation de compte.

    2. Répondez au questionnaire d''évaluation de l''adéquation. Ce processus, conforme
    à la directive MiFID II, nous permet de vérifier que le PEA est approprié au regard
    de vos connaissances, de votre expérience en investissement et de vos objectifs
    financiers.

    3. Validez les conditions générales et la grille tarifaire. Vous recevrez un document
    récapitulatif détaillant notamment le plafond de versement de 150 000 € et le
    taux de courtage de 0,2 %.

    4. Effectuez votre premier versement depuis un compte bancaire à votre nom. Le
    transfert des fonds doit être validé par une authentification forte.


    Une fois ces étapes complétées, vous recevrez une confirmation d''activation par
    messagerie sécurisée. Votre compte est alors pleinement opérationnel pour l''achat
    de titres éligibles. Pour toute question sur la gestion future de votre compte,
    vous pouvez vous référer au document Plan d''épargne en actions (PEA) — présentation.'
  domain: brokerage_investing
  product_category: pea
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: a08258d0-5234-5ae6-b71c-46cfc0c5f326
  title: Plan d'épargne en actions (PEA) — grille tarifaire
  body: 'L''ensemble des frais applicables au Plan d''épargne en actions (PEA) est
    détaillé ci-dessous. Valbreuil Bourse s''engage à une transparence totale, sans
    frais cachés.


    - Frais de courtage sur ordres : 0,2 % du montant de la transaction.

    - Frais de transfert sortant (par ligne de titres) : 15 €.

    - Plafond maximal des frais de transfert sortant : 150 €.


    Ces frais sont prélevés directement sur le compte espèces associé au PEA. Les
    frais de courtage couvrent la sécurisation des actifs et le reporting réglementaire.
    Aucun frais d''ouverture ou de tenue de compte annuel n''est appliqué sur ce produit.'
  domain: brokerage_investing
  product_category: pea
  document_type: fee_schedule
  source_authority: official
