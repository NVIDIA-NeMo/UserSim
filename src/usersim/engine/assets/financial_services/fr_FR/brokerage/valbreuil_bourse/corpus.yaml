  institution_id: valbreuil_bourse
- id: 3b8cddb0-2834-54db-bb66-8dbee768be8a
  title: Plan d'épargne en actions (PEA) — traiter une demande courante de bout en
    bout
  body: 'Ce guide détaille la procédure de transfert sortant de vos titres, l''une
    des demandes les plus courantes pour le Plan d''épargne en actions (PEA).


    1. Formulez votre demande de transfert en nous précisant l''établissement destinataire
    et la liste des lignes de titres que vous souhaitez transférer.

    2. Nous effectuerons une vérification d''identité rigoureuse et une authentification
    forte pour valider que vous êtes bien l''auteur de la demande, conformément à
    nos protocoles de sécurité.

    3. Nous vous communiquerons le montant exact des frais applicables : 15 € par
    ligne de titres, avec un rappel que le coût total est plafonné à 150 €.

    4. Vous devrez confirmer votre accord sur ces frais et nous fournir les coordonnées
    précises du compte PEA dans l''établissement d''accueil.

    5. Nous initierons le transfert des titres. Le délai effectif dépendra du règlement-livraison
    et de la réactivité de l''établissement destinataire.

    6. Vous saurez que l''opération est réussie lorsque vous recevrez la confirmation
    de clôture ou de transfert partiel et que vos titres apparaîtront sur votre nouveau
    compte.


    L''institution s''assure que chaque étape respecte les cadres de l''AMF et de
    l''ACPR. Pour comprendre le plafonnement des frais appliqués à cette opération,
    vous pouvez consulter Plan d''épargne en actions (PEA) — plafond des frais de
    transfert sortant : explications.'
  domain: brokerage_investing
  product_category: pea
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f96f5bf6-4282-51b4-8dda-31e654da5657
  title: Plan d'épargne en actions (PEA) — écart avec vos relevés
  body: 'Symptôme : Un client signale que le solde ou la valeur des positions affichées
    sur son relevé ne correspond pas à ses propres calculs ou à l''historique de ses
    ordres.


    Causes probables et étapes de vérification pour l''agent :


    1. Délai de règlement-livraison : Vérifiez si des transactions ont eu lieu récemment.
    Le délai conventionnel entre l''exécution d''un ordre et le transfert effectif
    de la propriété des titres peut créer un décalage temporaire dans les relevés.

    2. Prélèvement des frais de courtage : Assurez-vous que le client a pris en compte
    les frais de courtage de 0,2 % appliqués à chaque transaction, qui réduisent le
    montant net investi ou récupéré.

    3. Ordres en attente : Vérifiez s''il existe des ordres d''achat ou de vente non
    encore exécutés qui bloquent une partie du capital disponible.

    4. Date de valeur : Vérifiez que le client consulte le relevé à la bonne date
    de valeur, et non à la date d''exécution de l''ordre.


    Résolution :


    - Si l''écart est dû au règlement-livraison, expliquez au client le fonctionnement
    du délai conventionnel et invitez-le à patienter jusqu''à la date de dénouement.

    - Si l''écart provient des frais, détaillez le calcul (Montant de l''ordre x 0,2
    %) pour justifier la différence.

    - Si l''erreur semble être d''ordre technique ou comptable, l''agent doit ouvrir
    un dossier de réclamation. Nous enverrons un accusé de réception immédiat et l''affaire
    sera traitée selon un délai de résolution normé.


    Pour les questions liées aux montants inattendus, vous pouvez vous référer à Plan
    d''épargne en actions (PEA) — frais ou montant inattendu.'
  domain: brokerage_investing
  product_category: pea
  document_type: troubleshooting
  source_authority: official
