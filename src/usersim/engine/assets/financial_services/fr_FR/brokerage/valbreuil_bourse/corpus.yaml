- id: 96c8e072-32ae-52eb-81d0-46d01fbe55bd
  title: Investissement programmé en ETF — informations sur les risques
  body: 'L''Investissement programmé en ETF est un instrument financier soumis aux
    fluctuations des marchés. Avant toute souscription, le client doit prendre connaissance
    des avertissements suivants :


    Absence de Garantie du Capital :

    Le capital investi n''est jamais garanti. La valeur des ETF peut varier à la hausse
    comme à la baisse en fonction de la performance des indices sous-jacents. Il est
    possible de subir une perte partielle ou totale du montant investi.


    Risques de Marché et Volatilité :

    L''automatisation des achats permet de lisser le prix d''acquisition, mais elle
    ne protège pas contre une baisse structurelle et prolongée du marché. Le client
    accepte que les performances passées ne préjugent pas des performances futures.


    Évaluation de l''Adéquation :

    Conformément à la directive MiFID II, Valbreuil Bourse procède à une évaluation
    de l''adéquation pour s''assurer que l''investissement en ETF correspond aux connaissances,
    à l''expérience et aux objectifs du client. Le client s''engage à fournir des
    informations sincères lors de ce processus.


    Protection des Actifs :

    Bien que le rendement ne soit pas garanti, les titres sont protégés par le Fonds
    de Garantie des Dépôts et de Résolution (FGDR) jusqu''à 70 000 euros, limitant
    ainsi le risque lié à la défaillance de l''intermédiaire financier.


    Limites de l''Accompagnement :

    Valbreuil Bourse fournit une éducation financière et vérifie la pertinence des
    produits, mais ne délivre aucun conseil fiscal ou juridique personnalisé. Le client
    est invité à consulter un conseiller fiscal pour l''optimisation de son enveloppe
    fiscale.


    Pour plus de précisions sur la nature des produits, veuillez consulter Investissement
    programmé en ETF — présentation.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 7a8a8c1f-f833-55ff-ba48-92faa9e8c9f6
  title: Investissement programmé en ETF — calcul et application des taux
  body: "Cette fiche détaille l'application tarifaire spécifique au service d'investissement\
    \ automatisé. \n\nFrais d'exécution :\nLe taux appliqué pour chaque exécution\
    \ de l'investissement programmé est de 0 €. \nCe taux est unique et s'applique\
    \ uniformément à tous les clients, quel que soit le montant du versement (dès\
    \ le minimum de 25 €) ou la fréquence choisie. Il n'existe aucune structure de\
    \ paliers ou de frais dégressifs car la gratuité totale est appliquée par défaut.\n\
    \nApplication du taux :\nLe montant de 0 € est appliqué au moment précis du déclenchement\
    \ de l'ordre d'achat de l'ETF sur le marché. L'absence de frais d'exécution signifie\
    \ que l'intégralité du montant programmé est convertie en titres, hors frais internes\
    \ du fonds (TER) qui sont gérés par l'émetteur de l'ETF et non par Valbreuil Bourse.\n\
    \nFacturation :\nLe montant étant nul, aucune ligne de frais n'apparaît sur le\
    \ relevé d'exécution pour ce poste précis, confirmant ainsi la transparence et\
    \ la compétitivité de l'offre."
