- id: 6abfbb0b-c22e-5c5b-8f87-e751d5663fe4
  title: Compte-titres ordinaire — conditions générales
  body: 'Le présent document définit les conditions contractuelles régissant l''ouverture
    et la gestion du Compte-titres ordinaire au sein de Valbreuil Bourse.


    Obligations de l''institution : Valbreuil Bourse s''engage à assurer la conservation
    des titres et le reporting réglementaire conformément aux cadres de l''AMF et
    de l''ACPR. L''institution garantit une transparence totale sur les coûts appliqués.
    Les frais de courtage sont fixés à 1,99 € par ordre exécuté. Les droits de garde
    annuels sont fixés à 0 €.


    Obligations du client : Le client s''engage à fournir des informations exactes
    et à maintenir son dossier à jour. Toute modification de coordonnées doit être
    validée via le processus d''authentification forte. Le client reconnaît que l''investissement
    en bourse comporte des risques de perte en capital.


    Transferts et clôture : Le client peut demander la clôture de son compte ou le
    transfert de ses titres vers un autre établissement. En cas de transfert sortant,
    des frais de 15 € par ligne de titres sont appliqués. La demande de clôture doit
    être formulée via la messagerie sécurisée et sera traitée selon les délais normés
    de l''institution.


    Modification des termes : Valbreuil Bourse se réserve le droit de modifier la
    grille tarifaire sous réserve d''un préavis communiqué aux clients. Le maintien
    du compte après l''entrée en vigueur des nouveaux tarifs vaut acceptation de ceux-ci.


    L''ensemble de ces conditions s''inscrit dans le respect de la directive MiFID
    II, incluant l''obligation d''évaluer l''adéquation du produit avec le profil
    de risque du client.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: terms_conditions
  source_authority: official
  placeholder: true
