- id: 648c6698-140c-520d-ace8-819324e2ef33
  title: Investissement programmé en ETF — informations réglementaires
  body: 'Le service d''Investissement programmé en ETF est fourni par Valbreuil Bourse
    conformément aux cadres réglementaires de l''Autorité des Marchés Financiers (AMF)
    et de l''Autorité de Contrôle Prudentiel et de Résolution (ACPR), dans le respect
    des directives MiFID II.


    Avertissement sur les risques : L''investissement sur les marchés financiers comporte
    des risques de perte en capital. Le capital investi n''est jamais garanti. Les
    performances passées des ETF ne préjugent pas des performances futures. L''automatisation
    des versements permet de lisser le risque de timing, mais ne supprime pas le risque
    intrinsèque aux actifs sous-jacents.


    Protection des actifs : Conformément à la réglementation, les titres détenus dans
    le cadre de ce programme sont protégés par le Fonds de Garantie des Dépôts et
    de Résolution (FGDR) jusqu''à un montant de 70 000 € par client.


    Limites du service : Valbreuil Bourse fournit une éducation financière et vérifie
    la pertinence des produits via le processus d''évaluation de l''adéquation. Toutefois,
    l''institution ne délivre aucun conseil fiscal ou juridique personnalisé. L''agent
    ne peut garantir aucun rendement et se limite à un standard de soin basé sur le
    profil de risque défini par le client.


    Tout retrait de fonds ou modification des paramètres du plan nécessite une authentification
    forte et une vérification d''identité rigoureuse pour prévenir tout risque de
    fraude.'
