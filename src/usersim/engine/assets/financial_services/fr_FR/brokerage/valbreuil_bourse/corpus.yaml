- id: d0558c4f-4b06-5f59-837e-4e747afb2178
  title: Plan d'épargne en actions (PEA) — présentation
  body: 'Le Plan d''épargne en actions (PEA) de Valbreuil Bourse est l''enveloppe
    fiscale de référence pour les investisseurs souhaitant s''exposer aux marchés
    d''actions européennes tout en bénéficiant d''un cadre fiscal optimisé. Ce produit
    est conçu pour les investisseurs avertis et les jeunes actifs qui privilégient
    une approche rigoureuse et transparente de la gestion de leur patrimoine.


    L''atout majeur du PEA réside dans son régime fiscal avantageux : après une période
    de détention de cinq ans, les gains générés sont exonérés d''impôt sur le revenu,
    restant soumis uniquement aux prélèvements sociaux. Valbreuil Bourse assure une
    gestion numérique premium, alliant simplicité d''exécution et respect strict des
    normes réglementaires.


    Le cadre opérationnel du produit est défini par les limites et frais suivants
    :

    - Plafond des versements : Le montant total des versements est limité à 150 000
    €.

    - Frais de courtage : Chaque transaction est soumise à un taux de courtage de
    0,2 %.

    - Transferts sortants : En cas de transfert de vos titres vers un autre établissement,
    des frais de 15 € par ligne sont appliqués, avec un plafond global de 150 €.


    Conformément à notre posture de transparence, nous vous rappelons que le capital
    investi n''est jamais garanti. Les fluctuations des marchés peuvent entraîner
    une perte partielle ou totale de votre mise. Toutefois, pour votre sécurité, vos
    titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR)
    jusqu''à un montant de 70 000 euros.


    L''ouverture d''un PEA chez Valbreuil Bourse requiert une évaluation de l''adéquation
    selon les normes MiFID II, afin de s''assurer que ce produit correspond à vos
    connaissances financières et à vos objectifs d''investissement. Nous vous invitons
    à consulter la Plan d''épargne en actions (PEA) — grille tarifaire pour un détail
    exhaustif des coûts associés.'
  domain: brokerage_investing
  product_category: pea
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: e32924ce-df2d-5136-9207-4455e45c8371
  title: 'Plan d''épargne en actions (PEA) — plafond des versements : explications'
  body: 'Question : Quel est le montant maximum que je peux verser sur mon PEA ?

    Réponse : Le plafond des versements pour un Plan d''épargne en actions (PEA) standard
    est fixé à 150 000 €. Ce montant correspond à la somme des apports effectués sur
    le compte, indépendamment de la valeur actuelle de votre portefeuille (les plus-values
    ne sont pas comptabilisées dans ce plafond).


    Question : Que se passe-t-il si j''atteins le plafond de 150 000 € ?

    Réponse : Une fois ce plafond atteint, vous ne pouvez plus effectuer de nouveaux
    versements en numéraire. Toutefois, vous conservez la possibilité de réaliser
    des opérations d''achat et de vente au sein de votre plan, et la valeur totale
    de vos actifs peut naturellement dépasser ce seuil grâce aux performances de vos
    investissements.


    Question : Puis-je modifier ce plafond ?

    Réponse : Ce plafond est réglementaire et identique pour tous les établissements
    financiers en France ; il ne peut donc pas être augmenté. Pour des besoins de
    versements supérieurs, nous vous invitons à consulter la Plan d''épargne en actions
    (PEA) — face à un produit similaire de l''établissement pour découvrir le PEA-PME.'
  domain: brokerage_investing
  product_category: pea
  document_type: faq
  source_authority: official
