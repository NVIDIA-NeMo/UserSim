- id: 55116e32-6f17-5ecc-b95a-d5ff78902b2a
  title: Plan d'épargne en actions (PEA) — résilier, clôturer ou changer de formule
  body: 'La clôture ou la modification de votre Plan d''épargne en actions (PEA) répond
    à un processus strict afin de garantir la sécurisation de vos actifs.


    Étape 1 : Expression de la demande

    Vous devez nous informer de votre volonté de clôturer votre compte ou de modifier
    votre formule d''investissement via notre messagerie sécurisée. Précisez si vous
    souhaitez procéder à un rachat total des titres (vente et virement des fonds)
    ou à un transfert de vos titres vers un autre établissement financier.


    Étape 2 : Vérification de l''identité

    Conformément à notre politique de sécurité, nous procéderons à une authentification
    forte. Nous pourrons vous demander de confirmer vos informations d''identité pour
    valider que vous êtes bien l''auteur de la demande de clôture.


    Étape 3 : Traitement des actifs et frais

    - En cas de rachat : Nous exécutons la vente de vos positions. Les fonds sont
    ensuite versés sur votre compte espèces associé.

    - En cas de transfert : Nous coordonnons le transfert avec l''établissement récipiendaire.
    Notez que des frais de transfert sortant de 15 € par ligne de titres sont appliqués,
    avec un plafond maximum de 150 €.


    Étape 4 : Confirmation de clôture

    Une fois les titres transférés ou vendus et les frais déduits, nous vous envoyons
    un avis de clôture définitif confirmant la fermeture du PEA et le solde final.


    Si vous hésitez entre la clôture et le maintien de votre plan, nous vous suggérons
    de consulter "Plan d''épargne en actions (PEA) — comparaison avec les alternatives
    et quand ne pas le choisir".'
  domain: brokerage_investing
  product_category: pea
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 95b26516-c61e-54c2-9ec2-19abe0c41b2b
  title: Plan d'épargne en actions (PEA) — frais ou montant inattendu
  body: 'Symptôme : Le client signale un montant prélevé supérieur au prix d''exécution
    de son ordre ou un solde espèces inférieur aux attentes.


    Causes probables :

    1. Application des frais de courtage : Le client a omis de comptabiliser les frais
    de 0,2 % appliqués sur la valeur de l''ordre.

    2. Frais de transfert : En cas de mouvement de titres, des frais de 15 € par ligne
    ont été prélevés (jusqu''à 150 €).

    3. Retenue fiscale : En cas de retrait avant le délai réglementaire, des prélèvements
    fiscaux peuvent avoir été opérés.


    Procédure de vérification :

    1. Examiner l''historique des transactions pour identifier la ligne de frais correspondante.

    2. Recalculer les frais de courtage : [Montant de l''ordre] x 0,002.

    3. Vérifier si un transfert de titres a eu lieu récemment pour justifier les frais
    de 15 € par ligne.


    Résolution :

    - Si l''erreur est due à une incompréhension du client, expliquez pédagogiquement
    la structure tarifaire (0,2 % de courtage).

    - Si une erreur de calcul est avérée, le dossier doit être escaladé vers la direction
    des opérations pour régularisation.

    - Si le client conteste la légalité d''un prélèvement, le dossier est transmis
    au responsable de la conformité.


    Le client recevra un accusé de réception immédiat de sa réclamation et une réponse
    dans le délai de résolution normé de l''établissement.'
  domain: brokerage_investing
  product_category: pea
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c95b8d7e-3466-5b19-96ed-531e48e86bd9
  title: Plan d'épargne en actions (PEA) — justificatifs à fournir
  body: 'L''ouverture d''un Plan d''épargne en actions (PEA) requiert la transmission
    de documents précis pour satisfaire aux obligations de vigilance et de conformité
    AMF/ACPR.


    | Type de Justificatif | Condition d''Obligation | Finalité |

    | :--- | :--- | :--- |

    | Pièce d''identité officielle en cours de validité | Obligatoire pour tous |
    Vérification de l''identité et lutte contre le blanchiment (LCB-FT) |

    | Justificatif de domicile récent (< 3 mois) | Obligatoire pour tous | Validation
    de la résidence fiscale en France |

    | Questionnaire MiFID II complété | Obligatoire pour tous | Évaluation de l''adéquation
    et du profil de risque |

    | Relevé d''identité bancaire (RIB) | Obligatoire pour tous | Liaison avec le
    compte de règlement |


    Tout document manquant ou non conforme entraînera la suspension du processus d''ouverture
    jusqu''à régularisation complète.'
  domain: brokerage_investing
  product_category: pea
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
