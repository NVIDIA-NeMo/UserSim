  institution_id: valbreuil_bourse
- id: 6890a878-48b2-5afd-8e8f-6cdcc224dff7
  title: Plan d'épargne en actions (PEA) — face à une offre concurrente type
  body: 'Lorsqu''il est comparé à une offre de courtage traditionnelle, le PEA de
    Valbreuil Bourse se distingue par sa transparence et sa rigueur réglementaire.


    Dimensions de Comparaison :

    - Coûts de transaction : Valbreuil Bourse applique un taux unique et compétitif
    de 0,2 % sur les ordres, là où certains concurrents utilisent des forfaits opaques
    ou des frais minimums élevés.

    - Frais de sortie : Nos frais de transfert sont encadrés (15 € par ligne, plafonnés
    à 150 €), évitant ainsi les coûts prohibitifs rencontrés chez certains courtiers
    classiques.

    - Sécurité : Nous garantissons une protection via le FGDR jusqu''à 70 000 € et
    une authentification forte systématique.

    - Conformité : L''évaluation de l''adéquation MiFID II est systématiquement appliquée
    pour protéger l''investisseur.


    Verdict :

    - Valbreuil Bourse est le choix privilégié pour l''investisseur averti recherchant
    une structure de coûts prévisible, une interface numérique premium et une sécurité
    institutionnelle forte.

    - Un concurrent traditionnel peut être préférable pour un client exigeant un accompagnement
    physique en agence, service que Valbreuil Bourse ne propose pas dans son modèle
    numérique.'
  domain: brokerage_investing
  product_category: pea
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 81ac7698-ce50-5dfc-a826-388199be1798
  title: Plan d'épargne en actions (PEA) — informations sur les risques
  body: 'L''investissement dans un Plan d''épargne en actions (PEA) comporte des risques
    significatifs que tout investisseur doit pleinement appréhender avant toute souscription.


    Absence de Garantie du Capital

    Le capital investi sur un PEA n''est jamais garanti. Les valeurs mobilières sont
    soumises aux fluctuations des marchés financiers. En conséquence, la valeur de
    votre portefeuille peut augmenter ou diminuer, et vous pouvez perdre tout ou partie
    de votre mise initiale.


    Risques de Marché

    L''investisseur est exposé au risque de cours, au risque de liquidité (difficulté
    à vendre un titre rapidement sans impact majeur sur le prix) et au risque spécifique
    aux entreprises dont il détient les actions.


    Protection Institutionnelle

    Bien que le capital investi ne soit pas garanti, Valbreuil Bourse assure la protection
    des titres clients via le Fonds de Garantie des Dépôts et de Résolution (FGDR)
    jusqu''à un montant de 70 000 €. Cette garantie couvre la défaillance de l''établissement
    et non la baisse de la valeur des titres sur le marché.


    Évaluation de l''Adéquation

    Conformément à MiFID II, Valbreuil Bourse réalise une évaluation de l''adéquation
    pour s''assurer que le PEA correspond à vos connaissances financières et à vos
    objectifs. Nous vous rappelons que nous ne fournissons aucune garantie de rendement
    et que nous ne délivrons aucun conseil fiscal ou juridique personnalisé.


    Pour plus d''informations sur le cadre réglementaire, veuillez consulter "Plan
    d''épargne en actions (PEA) — informations réglementaires".'
  domain: brokerage_investing
  product_category: pea
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: d8be6610-686d-5872-acb4-12fb65b22410
  title: Plan d'épargne en actions (PEA) — calcul et application des taux
  body: 'Ce document détaille les modalités de calcul et d''application des taux tarifaires
    applicables au Plan d''épargne en actions (PEA) pour l''assistance au support.


    Frais de Courtage

    - Taux : 0,2 %

    - Application : Ce taux est appliqué sur la valeur nominale brute de chaque ordre
    d''achat ou de vente exécuté.

    - Calcul : [Valeur de l''ordre] x 0,002 = Montant des frais.

    - Fréquence : Prélèvement immédiat lors de l''exécution de l''ordre.


    Frais de Transfert Sortant

    - Taux par ligne : 15 €

    - Plafond maximal : 150 €

    - Application : Ces frais s''appliquent lors du transfert de titres vers un autre
    établissement financier.

    - Calcul : Le nombre de lignes de titres est multiplié par 15 €, sans jamais dépasser
    le montant global de 150 €.


    Ces taux sont fixes et s''appliquent uniformément à tous les clients détenteurs
    d''un PEA, indépendamment du volume d''actifs détenus.'
  domain: brokerage_investing
  product_category: pea
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 70a9e116-0069-5eea-a965-4344f31116d8
  title: Plan d'épargne en actions (PEA) — offre de parrainage et de fidélité
  body: 'Valbreuil Bourse a le plaisir de vous présenter son programme de parrainage
    et de fidélité dédié au Plan d''épargne en actions (PEA). Ce dispositif s''adresse
    aux investisseurs souhaitant partager l''excellence de notre approche numérique
    premium avec leur réseau professionnel ou personnel.


    En parrainant un nouvel investisseur averti, vous bénéficiez d''avantages privilégiés
    sur vos frais de gestion, visant à récompenser votre confiance et votre fidélité.
    Votre filleul, pour sa part, profitera d''un accompagnement pédagogique renforcé
    lors de l''ouverture de son enveloppe fiscale, tout en accédant à notre structure
    de coûts compétitive, notamment nos frais de courtage fixés à 0,2 %.


    Nous vous invitons à consulter les modalités détaillées via notre messagerie sécurisée
    pour connaître les conditions de validation des parrainages. L''optimisation fiscale
    et la rigueur réglementaire restent au cœur de notre engagement pour vous accompagner
    dans la fructification de vos actifs européens, dans la limite du plafond de versement
    de 150 000 €.'
  domain: brokerage_investing
  product_category: pea
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5ff7ed17-8c6b-5f91-b3b6-2271516427a6
  title: Plan d'épargne en actions (PEA) — bonnes pratiques de sécurité du compte
  body: 'La sécurisation de vos actifs et la protection de vos données personnelles
    sont les piliers de la relation de confiance entre Valbreuil Bourse et ses clients.
    Pour garantir l''intégrité de votre Plan d''épargne en actions (PEA), nous vous
    demandons d''appliquer rigoureusement les protocoles de sécurité suivants.


    L''authentification forte est une obligation absolue. Aucun conseiller Valbreuil
    Bourse ne vous demandera jamais votre mot de passe, votre code secret ou vos identifiants
    de connexion par e-mail ou via un appel téléphonique. Toute sollicitation de ce
    type doit être considérée comme une tentative de fraude et signalée immédiatement
    via notre messagerie sécurisée.


    Soyez vigilants quant aux modifications de vos coordonnées. Conformément à notre
    politique de sécurité, aucun changement de coordonnées bancaires ou d''adresse
    e-mail ne peut être effectué sans une validation sécurisée et une vérification
    d''identité rigoureuse. Cette procédure prévient tout détournement de fonds vers
    des comptes tiers non autorisés.


    En cas de suspicion de fraude ou de compromission de vos accès, nous procéderons
    au gel conservatoire de vos comptes pour protéger vos actifs. Nous vous rappelons
    que, bien que le capital investi ne soit jamais garanti en raison des fluctuations
    des marchés, vos titres sont protégés par le Fonds de Garantie des Dépôts et de
    Résolution (FGDR) jusqu''à un montant de 70 000 €.


    Enfin, nous vous recommandons de consulter régulièrement vos relevés de position
    et d''activer les alertes de mouvement pour détecter toute anomalie. La réactivité
    est essentielle : tout incident doit être rapporté dans les plus brefs délais
    pour permettre l''intervention de notre direction des opérations et du responsable
    de la conformité.'
  domain: brokerage_investing
  product_category: pea
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5c49318d-ff5d-5977-badb-012f6d5f2202
  title: Plan d'épargne en actions (PEA) — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales applicables au Plan d''épargne en actions (PEA) au sein de Valbreuil
    Bourse. L''institution se réserve le droit d''ajuster les termes du contrat pour
    s''adapter aux évolutions réglementaires de l''AMF, de l''ACPR ou aux directives
    MiFID II.


    Toute modification impactant la structure des frais ou les limites opérationnelles
    fera l''objet d''une notification préalable envoyée par voie électronique. Le
    client dispose d''un délai de préavis normé pour accepter ces nouvelles conditions
    ou, à défaut, demander la clôture de son compte sans frais de sortie anticipés,
    hors frais de transfert vers un autre établissement.


    Les points de référence contractuels suivants sont susceptibles d''être révisés
    :

    - Le plafond de versement, actuellement fixé à 150 000 €, conformément à la réglementation
    fiscale française.

    - Le taux des frais de courtage, établi à 0,2 % par ordre exécuté.

    - Les frais de transfert sortant, facturés 15 € par ligne de titres, avec un plafonnement
    global à 150 €.


    Le client reconnaît que Valbreuil Bourse ne délivre aucun conseil fiscal ou juridique
    personnalisé. Les modifications des conditions générales ne constituent en aucun
    cas une garantie de rendement. L''évaluation de l''adéquation et du caractère
    approprié des produits financiers demeure un processus continu, et toute modification
    substantielle du profil de risque du client peut entraîner une révision des produits
    accessibles au sein du PEA.


    En cas de désaccord sur les nouvelles conditions, le client peut engager une réclamation
    selon le processus transparent de l''institution, incluant un accusé de réception
    immédiat et un délai de résolution strict.'
  domain: brokerage_investing
  product_category: pea
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c8afa31b-ed9b-52f7-a8d4-059db2e54759
  title: Plan d'épargne en actions (PEA) — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner les clients dans
    l''activation et la première utilisation de leur Plan d''épargne en actions (PEA).
    L''objectif est d''assurer une expérience premium tout en respectant la rigueur
    réglementaire.


    Étape 1 : Vérification de l''éligibilité et Conformité

    L''agent doit s''assurer que le client est bien résident français. Avant toute
    souscription, il est impératif de mener l''évaluation de l''adéquation conformément
    à MiFID II. Ce processus permet de vérifier que le produit correspond aux connaissances,
    à l''expérience et aux objectifs du client. L''agent doit confirmer que le client
    a compris que le capital n''est pas garanti.


    Étape 2 : Ouverture et Paramétrage

    Une fois l''éligibilité validée, l''agent guide le client vers la signature électronique
    du contrat. Il doit préciser que le plafond de versement maximal est de 150 000
    €. L''agent doit également mentionner la protection des titres par le FGDR jusqu''à
    70 000 €.


    Étape 3 : Premier Versement et Investissement

    L''agent explique le fonctionnement des versements initiaux. Pour chaque ordre
    de bourse passé, le client sera facturé de frais de courtage s''élevant à 0,2
    %. L''agent doit pédagogiquement expliquer le concept de règlement-livraison (délai
    entre l''exécution et le transfert effectif de propriété).


    Étape 4 : Suivi et Reporting

    L''agent indique au client comment consulter son reporting réglementaire et ses
    positions via la messagerie sécurisée. En cas de question complexe sur la fiscalité,
    l''agent doit rappeler que Valbreuil Bourse ne fournit pas de conseil fiscal personnalisé
    et suggérer la consultation d''un conseiller fiscal agréé.


    L''agent doit conclure en rappelant que toute modification future du compte nécessitera
    une authentification forte et une vérification d''identité rigoureuse.'
  domain: brokerage_investing
  product_category: pea
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8fb24205-ce90-5618-b7a9-dce777e76ade
  title: 'Plan d''épargne en actions (PEA) — frais de transfert sortant par ligne
    : explications'
  body: 'Questions fréquentes sur les frais de transfert de votre PEA vers un autre
    établissement.


    **Quels sont les frais appliqués lors du transfert de mes titres vers un autre
    courtier ?**

    Valbreuil Bourse applique des frais de transfert sortant s''élevant à 15 € par
    ligne de titres transférée. Ces frais couvrent la sécurisation du transfert et
    le reporting réglementaire nécessaire à la mutation des actifs.


    **Existe-t-il un montant maximum pour ces frais ?**

    Oui. Afin de protéger vos actifs, nous avons instauré un plafond global : les
    frais de transfert sortant sont plafonnés à 150 €. Ainsi, même pour un portefeuille
    comportant de nombreuses lignes, vous ne paierez jamais plus de 150 € pour l''opération
    de transfert.


    **Pourquoi ces frais sont-ils appliqués alors que je quitte l''établissement ?**

    Ces frais correspondent aux coûts administratifs et techniques de traitement des
    dossiers de transfert, garantissant que chaque titre est correctement identifié
    et transmis conformément aux normes de sécurité en vigueur.'
  domain: brokerage_investing
  product_category: pea
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ce7accba-8512-54b4-b36e-f0062b1758db
  title: Plan d'épargne en actions (PEA) — effectuer une modification
  body: 'Ce guide vous accompagne dans la modification de vos informations personnelles
    ou des paramètres de votre Plan d''épargne en actions (PEA).


    Prérequis : Vous devez disposer de vos documents d''identité en cours de validité
    et de vos accès sécurisés à l''interface Valbreuil Bourse.


    Étape 1 : Formulation de la demande

    Indiquez-nous précisément la modification souhaitée (changement d''adresse, mise
    à jour du profil d''investisseur, modification du bénéficiaire). Nous vous confirmerons
    la réception de votre demande via un accusé de réception immédiat.


    Étape 2 : Authentification forte et vérification d''identité

    Pour protéger vos actifs, nous déclencherons une procédure de vérification d''identité
    rigoureuse. Vous devrez fournir les justificatifs demandés et valider l''opération
    via notre système d''authentification forte. Aucun changement de coordonnées ne
    sera effectué sans cette étape cruciale.


    Étape 3 : Revue de conformité

    Si la modification impacte votre profil de risque ou vos objectifs d''investissement,
    nous procéderons à une nouvelle évaluation de l''adéquation conformément à MiFID
    II pour nous assurer que les produits détenus dans votre PEA restent appropriés
    à votre situation.


    Étape 4 : Confirmation de mise à jour

    Une fois la vérification et la conformité validées, nous vous notifierons la prise
    en compte effective de la modification. Vous pourrez alors constater le changement
    dans vos informations de compte.


    En cas de difficulté lors de l''authentification, nous vous invitons à nous contacter
    via la messagerie sécurisée durant les jours ouvrés (fuseau CET).'
  domain: brokerage_investing
  product_category: pea
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c74ea41d-6e17-5661-93af-da42b8d07265
  title: Plan d'épargne en actions (PEA) — problèmes d'accès ou de connexion
  body: 'Si vous rencontrez des difficultés pour accéder à la gestion de votre Plan
    d''épargne en actions (PEA), veuillez suivre ce protocole de résolution.


    Symptôme : Impossible de s''authentifier ou message d''erreur lors de la connexion.


    Causes probables et vérifications :

    1. Identifiants erronés : Vérifiez que vos identifiants sont corrects. Attention
    aux majuscules et minuscules.

    2. Session expirée : Pour des raisons de sécurité, nos sessions sont limitées
    dans le temps. Essayez de rafraîchir la page ou de redémarrer l''application.

    3. Blocage de sécurité : Si plusieurs tentatives infructueuses ont été effectuées,
    votre compte a pu être gelé conservatoirement pour protéger vos actifs contre
    une intrusion.

    4. Problème d''authentification forte : Vérifiez que votre appareil de validation
    est connecté et que la synchronisation horaire est correcte.


    Résolution :

    - Si vos identifiants sont perdus, demandez une réinitialisation sécurisée. Vous
    devrez passer par une vérification d''identité rigoureuse avant tout rétablissement
    d''accès.

    - Si le compte est gelé, nous demanderons une validation d''identité complète
    pour lever la restriction.


    Escalade :

    Si le problème persiste malgré ces vérifications, nous créerons un ticket d''incident.
    Votre demande sera escaladée vers la direction des opérations pour une analyse
    technique approfondie. Vous recevrez un accusé de réception immédiat et un suivi
    régulier jusqu''à la résolution complète de l''incident. Valbreuil Bourse s''engage
    à rétablir vos accès dans les délais normés de traitement technique.'
  domain: brokerage_investing
  product_category: pea
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 0f76de1d-5daf-57bc-9428-5a19a8bd089c
  title: Plan d'épargne en actions (PEA) — niveaux d'accès
  body: 'Ce tableau définit les conditions d''accès et les plafonds applicables pour
    le Plan d''épargne en actions (PEA) standard, à l''usage des agents de support.


    | Condition | Critère d''éligibilité | Résultat / Limite |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français | Accès autorisé |

    | État Civil | Majeur (ou mineur sous conditions) | Accès autorisé |

    | Conformité MiFID II | Évaluation de l''adéquation complétée | Accès aux titres
    autorisé |

    | Plafond de versements | Cumul des apports | Maximum 150 000 € |

    | Protection Actifs | Garantie FGDR | Jusqu''à 70 000 € |


    L''agent doit s''assurer que le plafond de 150 000 € n''est pas outrepassé lors
    des demandes de versements. Si le client souhaite investir au-delà de ce seuil,
    l''agent doit l''orienter vers le Compte-titres ordinaire, qui ne possède aucun
    plafond de versement.'
  domain: brokerage_investing
  product_category: pea
