- id: 859993ad-553c-5fa6-962b-37d70cdfb673
  title: 'Compte-titres ordinaire — frais de transfert sortant par ligne : explications'
  body: "Questions fréquentes sur les transferts de titres sortants :\n\nPourquoi\
    \ Valbreuil Bourse facture-t-elle des frais de transfert sortant ?\nLe transfert\
    \ de titres vers un autre établissement financier implique des opérations administratives\
    \ et un reporting réglementaire strict. Pour couvrir la sécurisation et la transmission\
    \ des données, des frais de 15 € par ligne sont appliqués.\n\nQu'est-ce qu'une\
    \ « ligne » de titres ?\nUne ligne correspond à une espèce de titre spécifique\
    \ (par exemple, une action d'une entreprise précise). Si vous transférez trois\
    \ actions différentes, vous serez facturé trois fois 15 €.\n\nCes frais s'appliquent-ils\
    \ également aux transferts internes ?\nNon, ces frais concernent uniquement les\
    \ transferts sortants vers d'autres institutions. \n\nExiste-t-il d'autres frais\
    \ de détention ?\nNon, Valbreuil Bourse propose des droits de garde annuels à\
    \ 0 €, vous permettant de gérer vos actifs sans frais de stockage permanents."
  domain: brokerage_investing
