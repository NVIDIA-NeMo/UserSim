  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 67e2102e-9cb4-5a46-b078-0fc29052171d
  title: Plan d'épargne en actions (PEA) — reconnaître les arnaques visant ce produit
  body: 'Le Plan d''épargne en actions (PEA) est une enveloppe fiscale privilégiée,
    ce qui peut malheureusement attirer des acteurs malveillants. Afin de protéger
    vos actifs, il est essentiel de savoir identifier les tentatives de fraude spécifiques
    à ce produit.


    Certaines arnaques se manifestent par des propositions d''investissement promettant
    des « rendements garantis » ou des « gains sans risque » sur des titres européens.
    Nous vous rappelons que Valbreuil Bourse ne garantit jamais le capital investi,
    conformément aux réalités des marchés financiers. Toute offre affirmant le contraire
    est systématiquement frauduleuse.


    Soyez également vigilants face aux sollicitations non sollicitées (e-mails, appels,
    messages) où un interlocuteur prétend agir pour le compte de notre institution
    et vous demande de transférer vos titres vers un tiers pour « optimiser la fiscalité
    » ou « débloquer des fonds ». Valbreuil Bourse n''effectuera jamais de demande
    de transfert de fonds ou de titres sans une authentification forte et une vérification
    d''identité rigoureuse.


    L''institution ne vous demandera jamais vos codes d''accès, vos mots de passe
    ou vos clés de sécurité via une messagerie. Toute demande de ce type doit être
    considérée comme une tentative de phishing.


    Si vous constatez une activité inhabituelle sur votre compte ou si vous avez un
    doute sur la légitimité d''une communication, vous devez nous en informer immédiatement
    via notre messagerie sécurisée. En cas de suspicion avérée de fraude, nous procéderons
    au gel conservatoire de vos comptes pour protéger vos actifs.


    Pour plus d''informations sur la sécurisation de vos accès, nous vous invitons
    à consulter le document Plan d''épargne en actions (PEA) — bonnes pratiques de
    sécurité du compte.'
  domain: brokerage_investing
  product_category: pea
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 7f732e6f-6dd9-5b5b-bca4-ac518a5f5a0c
  title: Plan d'épargne en actions (PEA) — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux agents d''assistance pour l''encadrement technique
    du Plan d''épargne en actions (PEA).


    Le plafond de versement maximal pour ce produit est strictement fixé à 150 000
    €. Ce montant correspond aux versements nets effectués sur le plan et ne prend
    pas en compte la valorisation des titres acquise grâce aux gains de marché. Si
    un client tente d''effectuer un versement portant le total des apports au-delà
    de ce seuil, l''opération sera systématiquement bloquée.


    En termes de frais, chaque ordre de bourse exécuté sur le PEA est soumis à un
    taux de frais de courtage de 0,2 %. Ces frais sont prélevés lors de l''exécution
    de l''ordre et doivent être clairement expliqués au client lors de la confirmation
    de l''opération.


    Concernant la protection des actifs, les titres détenus sont protégés par le Fonds
    de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant de 70 000 euros.
    Cette garantie s''applique en cas de défaillance de l''institution et constitue
    un élément central de notre rigueur réglementaire.


    Il est important de noter que le PEA est soumis à des restrictions de retrait
    : tout retrait anticipé, en dehors des cas réglementaires prévus par la loi, peut
    entraîner la clôture automatique du plan et la perte des avantages fiscaux associés.
    L''agent doit s''assurer que le client a bien compris l''impact d''un retrait
    sur la fiscalité de son enveloppe.


    Pour une vue d''ensemble des fonctionnalités, vous pouvez vous référer à Plan
    d''épargne en actions (PEA) — présentation.'
  domain: brokerage_investing
  product_category: pea
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 544e2857-cef4-5c7d-a87d-2c171cac00b1
  title: 'Plan d''épargne en actions (PEA) — plafond des frais de transfert sortant
    : explications'
  body: 'Question : Comment sont calculés les frais lorsque je souhaite transférer
    mon PEA vers un autre établissement ?


    Réponse : Valbreuil Bourse applique des frais de transfert sortant basés sur le
    nombre de lignes de titres à transférer. Le coût est de 15 € par ligne. Toutefois,
    afin de limiter l''impact financier pour nos clients, nous appliquons un plafond
    global : les frais de transfert sortant sont plafonnés à 150 €. Ainsi, même si
    vous détenez un grand nombre de lignes, vous ne paierez jamais plus de 150 € pour
    l''opération de transfert.


    Question : Le plafond de 150 € s''applique-t-il à chaque ligne ?


    Réponse : Non, le montant de 15 € s''applique par ligne, et le plafond de 150
    € représente le montant maximum total que vous serez facturé pour l''ensemble
    du transfert de votre Plan d''épargne en actions (PEA).


    Pour plus de détails sur le coût par ligne, veuillez consulter Plan d''épargne
    en actions (PEA) — frais de transfert sortant par ligne : explications.'
  domain: brokerage_investing
  product_category: pea
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: db6b1b72-e419-54a2-9649-6714d5c41995
  title: Plan d'épargne en actions (PEA) — consulter le suivi ou l'historique
  body: 'Afin de suivre l''évolution de vos investissements et de consulter l''historique
    de vos opérations sur votre Plan d''épargne en actions (PEA), veuillez suivre
    la procédure suivante :


    1. Demandez-nous l''accès à vos relevés de compte ou à l''historique de vos transactions
    pour la période souhaitée.

    2. Nous procéderons à une vérification de votre identité via notre protocole d''authentification
    forte pour garantir la confidentialité de vos données financières.

    3. Une fois l''identité validée, nous vous confirmerons la disponibilité des documents.
    Vous pourrez alors nous demander l''envoi de vos relevés mensuels ou trimestriels.

    4. Nous vous transmettrons vos relevés sous format PDF via votre messagerie sécurisée.
    Ces documents détaillent vos positions, les frais de courtage appliqués (à hauteur
    de 0,2 % par ordre) et l''état de vos versements par rapport au plafond de 150
    000 €.

    5. Vous saurez que l''opération est terminée lorsque vous recevrez la notification
    de mise à disposition du document dans votre espace sécurisé.


    L''historique comprend toutes les opérations d''achat et de vente, ainsi que les
    mouvements de fonds. Pour comprendre comment débuter avec vos premiers ordres,
    vous pouvez consulter Plan d''épargne en actions (PEA) — prise en main pas à pas.'
  domain: brokerage_investing
  product_category: pea
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 85543dde-4a4f-5eeb-86b3-b66f904c042b
  title: Plan d'épargne en actions (PEA) — opération refusée ou bloquée
  body: 'Symptôme : Vous tentez d''effectuer un versement ou un achat de titres sur
    votre Plan d''épargne en actions (PEA), mais l''opération est refusée ou bloquée
    par notre système.


    Causes probables et vérifications :


    1. Dépassement du plafond de versement : Vérifiez si le nouveau versement, ajouté
    aux apports précédents, excède le plafond réglementaire de 150 000 €. Si ce seuil
    est atteint ou dépassé, tout versement supplémentaire sera bloqué.

    2. Défaut de conformité MiFID II : Le produit financier visé peut ne pas correspondre
    à votre profil d''investisseur. Si l''évaluation de l''adéquation indique que
    le produit n''est pas approprié, l''ordre sera bloqué pour votre protection.

    3. Absence de vérification d''identité : Toute action modifiant l''état du compte
    nécessite une authentification forte. Si vos documents d''identité ne sont plus
    à jour, l''opération peut être suspendue.

    4. Fonds insuffisants : Assurez-vous que le solde disponible couvre non seulement
    le prix du titre, mais aussi les frais de courtage de 0,2 %.


    Résolution :


    - Si le plafond est atteint, vous ne pouvez plus effectuer de versements sur ce
    plan. Nous pouvons vous orienter vers un Compte-titres ordinaire pour vos investissements
    supplémentaires.

    - Si le blocage est lié à la conformité, nous pouvons mettre à jour votre profil
    d''investisseur après un nouvel entretien d''adéquation.

    - Si l''identité est en cause, transmettez-nous les justificatifs demandés via
    la messagerie sécurisée.


    En cas de blocage persistant sans cause apparente, nous ouvrirons un ticket d''incident
    et escaladerons la demande vers la direction des opérations. Vous recevrez un
    accusé de réception immédiat et une réponse dans les délais normés de l''institution.


    Pour les erreurs de transaction courantes, consultez Plan d''épargne en actions
    (PEA) — opération échouée ou en attente.'
  domain: brokerage_investing
  product_category: pea
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 7f884a7f-c948-5836-81ba-92c2368ee205
  title: Plan d'épargne en actions (PEA) — quand changer ou monter en gamme
  body: 'Ce guide aide l''agent à conseiller le client sur l''évolution de son enveloppe
    d''investissement.


    Le passage d''un Plan d''épargne en actions (PEA) classique vers une autre solution
    est envisageable dans les cas suivants :


    1. Dépassement du plafond : Lorsque le client a atteint le plafond de versement
    de 150 000 €, il ne peut plus alimenter son PEA. S''il souhaite continuer à investir
    dans des actions européennes ou des PME, le passage vers un PEA-PME est pertinent
    car celui-ci offre un plafond de versement élargi à 225 000 €.

    2. Diversification géographique : Le PEA restreint l''investissement aux marchés
    européens. Pour investir sur les marchés mondiaux sans contrainte fiscale spécifique,
    le client doit ouvrir un Compte-titres ordinaire, qui ne possède aucun plafond
    de versement.

    3. Besoins de liquidité immédiate : Si le client prévoit des retraits fréquents,
    le Compte-titres est préférable, car tout retrait sur le PEA peut entraîner sa
    clôture et la perte des avantages fiscaux.


    L''agent doit rappeler que le passage au Compte-titres implique la perte de l''optimisation
    fiscale propre au PEA, mais offre une flexibilité totale. Le transfert vers un
    PEA-PME permet de conserver une partie des avantages fiscaux tout en augmentant
    la capacité d''investissement. Pour plus de détails sur les différences, voir
    Plan d''épargne en actions (PEA) — face à un produit similaire de l''établissement.'
  domain: brokerage_investing
  product_category: pea
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c92623d7-f23e-54be-80a3-d20499ea0e00
  title: Plan d'épargne en actions (PEA) — comparaison avec les alternatives et quand
    ne pas le choisir
  body: 'Le Plan d''épargne en actions (PEA) est l''outil de référence pour l''investissement
    en actions européennes grâce à son optimisation fiscale. Toutefois, il ne convient
    pas à tous les profils d''investisseurs.


    Choisissez le PEA si :

    - Votre objectif est l''investissement à long terme sur les marchés européens.

    - Vous souhaitez bénéficier d''une exonération d''impôt sur le revenu sur les
    gains (après la période réglementaire).

    - Vos versements totaux n''excèdent pas le plafond de 150 000 €.


    Ne choisissez pas le PEA, et privilégiez d''autres options, si :

    - Vous souhaitez investir sur des marchés hors Europe (États-Unis, Asie) : Le
    Compte-titres ordinaire est alors la solution adaptée, car il est sans plafond
    et permet d''investir mondialement.

    - Vous avez besoin d''une flexibilité totale pour vos retraits : Le PEA est conçu
    pour l''épargne longue ; des retraits prématurés peuvent entraîner la clôture
    du plan. Le Compte-titres offre une liberté totale de mouvement.

    - Vous souhaitez investir des sommes supérieures à 150 000 € dans des PME : Le
    PEA-PME, avec son plafond de 225 000 €, est plus approprié pour soutenir les petites
    et moyennes entreprises.


    Quel que soit votre choix, Valbreuil Bourse applique une rigueur tarifaire avec
    des frais de courtage de 0,2 % sur le PEA. Notez que vos titres sont protégés
    par le FGDR jusqu''à 70 000 euros, assurant une sécurité institutionnelle majeure.


    Pour une analyse comparative plus détaillée face à d''autres offres, nous vous
    recommandons la lecture de Plan d''épargne en actions (PEA) — face à une offre
    concurrente type.'
  domain: brokerage_investing
  product_category: pea
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 384a00de-f663-5690-bbc5-fa7f0d28fa52
  title: Plan d'épargne en actions (PEA) — coûts et frais
  body: 'Question : Quels sont les frais appliqués lors de mes investissements sur
    mon PEA ?


    Réponse : Pour chaque transaction d''achat ou de vente de titres, Valbreuil Bourse
    prélève des frais de courtage s''élevant à 0,2 % du montant de l''ordre. Ces frais
    couvrent la sécurisation de vos actifs et le reporting réglementaire.


    Question : Y a-t-il des frais si je décide de transférer mon PEA vers un autre
    courtier ?


    Réponse : Oui, le transfert sortant est facturé 15 € par ligne de titres. Pour
    protéger nos clients contre des coûts excessifs, nous avons instauré un plafond
    : le montant total des frais de transfert sortant ne peut excéder 150 €.


    Question : Existe-t-il des frais de gestion annuels ?


    Réponse : La tarification est conçue pour être compétitive et transparente. Nous
    vous invitons à consulter la grille tarifaire complète dans le document Plan d''épargne
    en actions (PEA) — grille tarifaire pour le détail de l''ensemble des coûts.'
  domain: brokerage_investing
  product_category: pea
  document_type: faq
  source_authority: official
