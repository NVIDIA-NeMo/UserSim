- id: 4c8c7397-780e-56c4-9766-002866c0cee0
  title: Plan d'épargne en actions (PEA) — protection contre la fraude et les opérations
    non autorisées
  body: 'La sécurité de vos actifs est la priorité absolue de Valbreuil Bourse. Pour
    protéger votre Plan d''épargne en actions (PEA), nous avons mis en œuvre des protocoles
    de sécurité rigoureux, conformes aux exigences réglementaires les plus strictes.


    L''accès à vos opérations est protégé par une authentification forte obligatoire.
    Aucun retrait de fonds, ni aucune modification de vos coordonnées personnelles
    ne peut être effectué sans une validation sécurisée et une vérification d''identité
    approfondie. Nous vous rappelons que Valbreuil Bourse ne vous demandera jamais
    vos codes secrets, vos mots de passe ou vos clés d''authentification par e-mail
    ou via une messagerie non sécurisée.


    En cas de suspicion de fraude ou d''activité inhabituelle sur votre compte, nos
    systèmes de surveillance peuvent déclencher un gel conservatoire de vos actifs.
    Cette mesure, bien que restrictive, est indispensable pour protéger vos titres
    et vos liquidités contre toute opération non autorisée.


    Sachez que, conformément à la réglementation, vos titres sont protégés par le
    Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant de 70
    000 €. Cette garantie constitue un filet de sécurité institutionnel majeur en
    cas de défaillance de l''établissement.


    Si vous constatez une opération que vous n''avez pas initiée ou si vous suspectez
    une usurpation d''identité, vous devez nous en informer immédiatement via notre
    messagerie sécurisée. Un signalement rapide est essentiel pour limiter votre responsabilité
    et nous permettre d''intervenir sur le compte.


    Pour une gestion optimale de vos accès, nous vous invitons à consulter le document
    intitulé "Plan d''épargne en actions (PEA) — bonnes pratiques de sécurité du compte".'
  domain: brokerage_investing
  product_category: pea
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 911f8651-7c72-5f10-a16d-7bd67b6c543d
  title: Plan d'épargne en actions (PEA) — conditions générales
  body: "Le présent document définit les conditions contractuelles régissant l'ouverture\
    \ et la gestion du Plan d'épargne en actions (PEA) au sein de Valbreuil Bourse.\n\
    \n1. Plafonds et Versements\nLe Plan d'épargne en actions (PEA) est soumis à un\
    \ plafond de versement strict de 150 000 €. Tout versement excédant ce montant\
    \ sera refusé par nos services. Le respect de ce plafond est une obligation réglementaire\
    \ dont la responsabilité incombe au titulaire.\n\n2. Tarification et Frais\nL'exécution\
    \ des ordres de bourse sur le PEA est soumise à des frais de courtage s'élevant\
    \ à 0,2 % du montant de l'ordre. Ces frais sont prélevés lors de chaque transaction.\
    \ \nEn cas de transfert sortant de vos titres vers un autre établissement, Valbreuil\
    \ Bourse applique des frais de 15 € par ligne de titres transférée, dans la limite\
    \ d'un plafond global de 150 €.\n\n3. Obligations Réglementaires et Conformité\n\
    Conformément à la directive MiFID II, l'ouverture d'un PEA est conditionnée par\
    \ une évaluation de l'adéquation. Valbreuil Bourse s'assure que le produit correspond\
    \ à vos connaissances, votre expérience et vos objectifs d'investissement. L'institution\
    \ se réserve le droit de refuser une opération si celle-ci s'avère inappropriée\
    \ au regard de votre profil de risque.\n\n4. Responsabilités et Risques\nLe capital\
    \ investi sur un PEA n'est jamais garanti. Les variations des cours boursiers\
    \ peuvent entraîner une perte partielle ou totale des sommes investies. Toutefois,\
    \ les titres sont protégés par le FGDR jusqu'à 70 000 €.\n\n5. Résiliation et\
    \ Clôture\nLe titulaire peut demander la clôture de son plan à tout moment. La\
    \ clôture entraîne soit le rachat total des titres, soit leur transfert vers un\
    \ autre établissement sous réserve du paiement des frais de transfert mentionnés\
    \ précédemment."
  domain: brokerage_investing
  product_category: pea
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 49b8d4b7-747a-5011-ba47-4dbda80a7275
  title: Plan d'épargne en actions (PEA) — pour qui et pour quels usages
  body: 'Le Plan d''épargne en actions (PEA) de Valbreuil Bourse est l''outil privilégié
    des investisseurs résidant en France souhaitant se constituer un portefeuille
    d''actions européennes tout en optimisant leur fiscalité.


    Cible et Profil d''Investisseur

    Ce produit s''adresse particulièrement aux investisseurs avertis et aux jeunes
    actifs ayant une vision de placement à moyen ou long terme. Il est conçu pour
    ceux qui acceptent la volatilité des marchés boursiers en échange d''un potentiel
    de rendement supérieur aux produits d''épargne réglementés.


    Usages Recommandés

    Le PEA est idéal pour :

    - L''investissement dans des entreprises de la zone économique européenne.

    - La constitution d''un capital pour la retraite ou un projet immobilier.

    - La diversification d''un patrimoine financier via des actions ou des fonds éligibles.


    Caractéristiques Principales

    - Capacité d''investissement : Le plafond de versement est fixé à 150 000 €.

    - Coût d''exécution : Des frais de courtage de 0,2 % s''appliquent sur chaque
    ordre.

    - Sécurité institutionnelle : Protection des actifs via le FGDR jusqu''à 70 000
    €.


    Rigueur et Accompagnement

    Valbreuil Bourse ne délivre aucun conseil fiscal ou juridique personnalisé. Nous
    nous assurons toutefois, via un processus d''évaluation de l''adéquation MiFID
    II, que le PEA est pertinent au regard de vos objectifs et de votre tolérance
    au risque. Le capital investi n''étant pas garanti, nous recommandons une approche
    prudente et diversifiée.


    Pour comprendre les critères d''accès à ce produit, veuillez consulter le document
    "Plan d''épargne en actions (PEA) — conditions d''éligibilité".'
  domain: brokerage_investing
  product_category: pea
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 3603254d-b6e4-540d-84e5-331a0e8d049c
  title: 'Plan d''épargne en actions (PEA) — frais de courtage en pourcentage de l''ordre
    : explications'
  body: 'Question : Comment sont calculés les frais de courtage sur mon PEA ?

    Réponse : Valbreuil Bourse applique une tarification transparente et proportionnelle.
    Pour chaque ordre d''achat ou de vente, des frais de courtage de 0,2 % sont prélevés
    sur la valeur totale de l''opération. Par exemple, pour un ordre de 1 000 €, les
    frais s''élèveront à 2 €.


    Question : Ces frais sont-ils fixes ou varient-ils selon le titre ?

    Réponse : Le taux de 0,2 % est constant pour l''ensemble des titres éligibles
    au sein de votre Plan d''épargne en actions (PEA), garantissant ainsi une équité
    de traitement pour tous vos investissements.


    Pour plus de détails sur l''ensemble de nos tarifs, vous pouvez consulter la "Plan
    d''épargne en actions (PEA) — grille tarifaire".'
  domain: brokerage_investing
  product_category: pea
  document_type: faq
  source_authority: official
  placeholder: true
