- id: f18f4aeb-3588-559b-bda7-8c8ff1ffdbdd
  title: PEA Jeune — traiter une demande courante de bout en bout
  body: 'L''exécution d''une opération d''investissement sur un PEA Jeune suit un
    processus rigoureux pour garantir la conformité réglementaire et la sécurité des
    fonds. Voici le déroulement complet pour un achat de titres.


    Prérequis

    - Un compte PEA Jeune ouvert et actif.

    - Un solde en numéraire disponible sur le compte.

    - Avoir validé l''évaluation de l''adéquation (MiFID II) pour le produit visé.


    Étapes de l''opération

    1. Transmission de l''ordre : Indiquez-nous via la messagerie sécurisée le titre
    souhaité (code ISIN), la quantité et le type d''ordre (au prix du marché ou à
    cours limité).

    2. Vérification du plafond : Nous vérifions que l''opération est possible et que
    vos versements totaux n''ont pas déjà atteint le plafond de 20 000 €.

    3. Authentification forte : Nous vous demandons de valider l''opération via le
    protocole de sécurité obligatoire pour confirmer votre consentement.

    4. Exécution et frais : Nous exécutons l''ordre. Un taux de frais de courtage
    de 0,2 % est appliqué au montant de la transaction.

    5. Confirmation : Vous recevez un avis d''opéré confirmant l''exécution de l''achat
    et le montant exact des frais prélevés.


    Délai de finalisation

    L''achat est exécuté instantanément sur le marché, mais le transfert effectif
    de la propriété des titres s''effectue selon le délai conventionnel du règlement-livraison.


    Confirmation de succès

    L''opération est finalisée lorsque le titre apparaît dans vos positions et que
    le solde en numéraire a été débité du montant de l''achat plus les 0,2 % de frais.


    En cas de besoin d''une modification d''ordre avant exécution, veuillez consulter
    le document PEA Jeune — effectuer une modification.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 6b10bba1-7cab-5792-88a5-2e05db00aa9f
  title: PEA Jeune — écart avec vos relevés
  body: 'L''agent peut être sollicité lorsqu''un client constate une différence entre
    le montant attendu d''une transaction et le solde affiché sur son relevé. Voici
    la méthodologie de résolution.


    Symptôme : Le client signale que le montant débité est supérieur au prix d''achat
    du titre ou que le titre n''apparaît pas immédiatement après l''ordre.


    Analyse et vérifications

    1. Application des frais de courtage : Vérifiez si le client a pris en compte
    les frais de courtage de 0,2 %. Par exemple, pour un achat de 1 000 €, le montant
    total débité sera de 1 002 €.

    2. Délai de Règlement-livraison : Si le titre n''est pas encore visible, rappelez
    que le transfert effectif de propriété ne se fait pas instantanément. Le délai
    de règlement-livraison doit être observé avant que la position ne soit définitivement
    enregistrée.

    3. Date de valeur : Vérifiez la date de valeur des opérations. Un décalage peut
    exister entre la date d''exécution de l''ordre et la date d''inscription au compte.

    4. Prélèvements réglementaires : Vérifiez si des taxes spécifiques ou des frais
    de reporting ont été appliqués conformément à la réglementation en vigueur.


    Résolution

    - Si l''écart correspond aux 0,2 % de frais : Expliquez pédagogiquement le calcul
    des frais de courtage.

    - Si l''écart est dû au délai de règlement : Précisez la date à laquelle le titre
    sera effectivement disponible dans le portefeuille.

    - Si l''erreur est avérée (erreur de saisie ou technique) : L''agent doit immédiatement
    ouvrir un dossier de réclamation.


    Escalade

    En cas d''erreur technique confirmée, la demande est escaladée vers la direction
    des opérations. Un accusé de réception est envoyé au client, et la correction
    sera effectuée selon les délais normés de l''institution.


    Pour les cas complexes de frais inattendus, l''agent peut se référer au document
    PEA Jeune — frais ou montant inattendu.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 754d6119-a1eb-589d-9f85-4e7d5708f22d
  title: Investissement programmé en ETF — présentation
  body: 'L''Investissement programmé en ETF est une solution d''investissement automatisée
    conçue par Valbreuil Bourse pour permettre aux investisseurs de lisser leur risque
    d''entrée sur les marchés financiers. En adoptant une stratégie d''investissement
    périodique, vous réduisez la volatilité liée au timing de vos achats, une approche
    particulièrement adaptée aux jeunes actifs et aux investisseurs avertis souhaitant
    construire un patrimoine sur le long terme avec rigueur et discipline.


    Ce produit se distingue par son accessibilité et sa transparence tarifaire. L''entrée
    dans le programme est possible dès un montant minimal de 25 € par échéance, permettant
    ainsi une mise en œuvre progressive de votre stratégie d''épargne. Conformément
    à notre philosophie de frais compétitifs, Valbreuil Bourse a choisi de supprimer
    les coûts de transaction directs sur ce service : les frais d''exécution du plan
    sont ainsi fixés à 0 €.


    L''institution assure une gestion rigoureuse et sécurisée de vos actifs. Bien
    que le capital investi ne soit jamais garanti et demeure soumis aux fluctuations
    du marché, vos titres sont protégés par le Fonds de Garantie des Dépôts et de
    Résolution (FGDR) jusqu''à un montant de 70 000 €.


    L''activation de ce service nécessite au préalable une évaluation de l''adéquation,
    conformément aux normes MiFID II, afin de s''assurer que l''investissement en
    ETF correspond à vos connaissances, votre expérience et vos objectifs financiers.
    Cette démarche pédagogique et réglementaire garantit que le produit est approprié
    à votre profil de risque.


    Pour plus de détails sur la tarification, vous pouvez consulter la Investissement
    programmé en ETF — grille tarifaire.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: product_sheet
  source_authority: official
  placeholder: true
