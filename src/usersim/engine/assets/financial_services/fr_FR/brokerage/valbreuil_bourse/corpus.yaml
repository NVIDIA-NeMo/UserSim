  institution_id: valbreuil_bourse
- id: a5fdab74-c8ae-5de9-a6ed-97829701d104
  title: PEA-PME — présentation
  body: 'Le PEA-PME est une enveloppe fiscale privilégiée, conçue pour les investisseurs
    souhaitant soutenir le dynamisme des petites et moyennes entreprises tout en optimisant
    leur fiscalité. Ce produit s''adresse particulièrement aux investisseurs avertis
    et aux jeunes actifs en quête d''une exposition ciblée sur le marché des PME européennes.


    L''atout majeur de ce plan réside dans sa capacité de versement. Le plafond des
    versements est fixé à 225 000 €, offrant ainsi une marge de manœuvre plus étendue
    que le plan d''épargne en actions classique pour constituer un portefeuille diversifié.


    Valbreuil Bourse applique une politique tarifaire rigoureuse et transparente.
    Chaque opération de courtage est soumise à un taux de frais de courtage de 0,2
    %. Pour garantir la mobilité de vos actifs, les frais de transfert sortant sont
    strictement encadrés et sont plafonnés à 150 €.


    Conformément à notre engagement de transparence, nous vous rappelons que le capital
    investi n''est jamais garanti. Toutefois, vos titres bénéficient de la protection
    du Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant de
    70 000 €.


    L''ouverture de ce compte implique une évaluation de l''adéquation, processus
    réglementaire MiFID II permettant de s''assurer que les caractéristiques du PEA-PME
    correspondent à vos objectifs d''investissement, vos connaissances financières
    et votre profil de risque. Pour plus de détails sur les conditions d''accès, nous
    vous invitons à consulter le document PEA-PME — conditions d''éligibilité.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: product_sheet
  source_authority: official
