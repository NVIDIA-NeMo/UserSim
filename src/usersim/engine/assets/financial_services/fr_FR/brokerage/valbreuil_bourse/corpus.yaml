- id: 715ea050-afff-531c-9737-926c6eb103ad
  title: Plan d'épargne en actions (PEA) — choisir entre les formules
  body: 'Le choix de l''enveloppe fiscale dépend de votre âge, de votre capital et
    de vos objectifs d''investissement. Voici la comparaison entre les différentes
    options PEA proposées par Valbreuil Bourse.


    Le Plan d''épargne en actions (PEA) standard est l''enveloppe de référence pour
    les actions européennes, avec un plafond de versement de 150 000 €. Il convient
    aux investisseurs avertis et actifs cherchant une optimisation fiscale à long
    terme.


    Le PEA-PME est une variante optimisée pour le soutien aux petites et moyennes
    entreprises, offrant un plafond de versement élargi à 225 000 €. Il est idéal
    pour ceux qui souhaitent diversifier leur portefeuille vers des entreprises à
    forte croissance.


    Le PEA Jeune est un produit d''initiation réservé aux 18-25 ans rattachés au foyer
    fiscal de leurs parents, avec un plafond limité à 20 000 €. C''est le choix privilégié
    pour débuter l''investissement boursier avec un risque maîtrisé.


    Quelle que soit la formule choisie, Valbreuil Bourse applique une politique de
    frais transparente avec des frais de courtage de 0,2 % sur les ordres.'
  domain: brokerage_investing
  product_category: pea
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 41356bd1-7cdc-5701-9b0b-48f8f576422f
  title: Plan d'épargne en actions (PEA) — confidentialité et protection des données
  body: 'Valbreuil Bourse s''engage à traiter vos données personnelles avec la plus
    haute rigueur, conformément au Règlement Général sur la Protection des Données
    (RGPD) et aux exigences de l''AMF et de l''ACPR.


    Collecte et Usage

    Les données collectées lors de l''ouverture de votre Plan d''épargne en actions
    (PEA) sont nécessaires pour effectuer l''évaluation de l''adéquation et du caractère
    approprié, conformément aux normes MiFID II. Ces informations nous permettent
    de nous assurer que les produits financiers sur lesquels vous investissez correspondent
    à votre profil de risque et à vos objectifs financiers.


    Reporting Réglementaire

    En tant qu''institution financière, Valbreuil Bourse a l''obligation légale de
    transmettre certaines informations aux autorités de tutelle. Le reporting réglementaire
    inclut la surveillance des plafonds de versement (limités à 150 000 € pour le
    PEA) et la lutte contre le blanchiment et le financement du terrorisme (LCB-FT).


    Sécurisation et Protection

    L''accès à vos données est protégé par une authentification forte. Toute modification
    de vos informations personnelles requiert une vérification d''identité rigoureuse.
    Nous vous rappelons que vos titres sont protégés par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR) jusqu''à 70 000 €, apportant une sécurité supplémentaire
    à vos actifs.


    Confidentialité

    Vos données ne sont jamais cédées à des tiers à des fins commerciales. Elles sont
    conservées durant toute la durée de vie de votre compte et pendant les délais
    légaux de conservation après clôture. Vous disposez d''un droit d''accès, de rectification
    et de suppression de vos données, exerçable via notre messagerie sécurisée durant
    les jours ouvrés (fuseau CET).'
  domain: brokerage_investing
  product_category: pea
  document_type: disclosure
  source_authority: official
