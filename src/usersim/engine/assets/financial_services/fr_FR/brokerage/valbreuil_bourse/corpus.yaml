- id: 19481dc0-a458-531d-8e65-3ac47eeafefa
  title: PEA-PME — face à un produit similaire de l'établissement
  body: 'Le choix entre un PEA classique et un PEA-PME dépend principalement de votre
    stratégie d''investissement et de vos capacités de versement.


    Dimensions de comparaison :

    - Capacité de versement : Le PEA classique est limité à 150 000 €, tandis que
    le PEA-PME offre un plafond élargi à 225 000 €.

    - Univers d''investissement : Le PEA classique cible les actions de grandes capitalisations
    européennes. Le PEA-PME est spécifiquement optimisé pour le soutien aux petites
    et moyennes entreprises, permettant d''investir dans des structures plus agiles
    mais présentant souvent un risque plus élevé.

    - Coûts : Les deux produits partagent une structure de frais compétitive chez
    Valbreuil Bourse, notamment avec des frais de courtage de 0,2 %.


    Recommandation :

    - Le PEA classique convient aux investisseurs recherchant la stabilité des grandes
    entreprises européennes avec un plafond de versement standard.

    - Le PEA-PME est l''option idéale pour les investisseurs avertis souhaitant diversifier
    leur portefeuille vers des PME et maximiser leur enveloppe fiscale jusqu''à 225
    000 €.


    Pour plus d''informations, consultez le document Plan d''épargne en actions (PEA)
    — présentation.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 9c9a2959-6094-5d0a-a953-516380b6cc0a
  title: PEA-PME — informations réglementaires
  body: 'Le PEA-PME est régi par les dispositions légales relatives aux plans d''épargne
    en actions et est distribué par Valbreuil Bourse conformément aux cadres de l''AMF
    et de l''ACPR, dans le respect strict de la directive MiFID II.


    Évaluation de l''adéquation :

    Conformément à la réglementation, l''institution réalise systématiquement une
    évaluation de l''adéquation. Ce processus vise à s''assurer que le produit financier
    correspond aux connaissances, à l''expérience et aux objectifs du client. Le refus
    d''une souscription peut survenir si le produit est jugé inapproprié au regard
    du profil de risque établi.


    Protection des actifs :

    Le capital investi sur un PEA-PME n''est jamais garanti et peut fluctuer selon
    les cours du marché. Toutefois, en cas de défaillance de l''institution, les titres
    sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à
    un plafond de 70 000 €.


    Sécurité et Conformité :

    Toute action modifiant l''état du compte ou tout retrait de fonds nécessite une
    authentification forte et une vérification d''identité rigoureuse. Aucun changement
    de coordonnées ne peut être effectué sans validation sécurisée.


    Limites fiscales :

    Le plafond de versement est strictement fixé à 225 000 €. Valbreuil Bourse fournit
    une éducation financière sur l''utilisation de cette enveloppe, mais ne délivre
    aucun conseil fiscal ou juridique personnalisé. Il appartient au client de consulter
    un professionnel pour l''optimisation de sa situation fiscale personnelle.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8e775b30-6cc7-5688-8bb3-9685068fe4a1
  title: PEA-PME — grille des taux
  body: 'La grille des taux applicable au PEA-PME chez Valbreuil Bourse se veut simple
    et uniforme pour l''ensemble de notre clientèle d''investisseurs avertis.


    Taux de courtage :

    Un taux unique de 0,2 % s''applique à chaque ordre d''achat ou de vente exécuté
    sur le plan. Ce taux est appliqué sur le montant brut de la transaction.


    Application du taux :

    Ce taux est constant et ne dépend pas du volume des transactions ni du solde du
    compte. Il est prélevé lors du règlement-livraison de l''opération.


    Conditions de modification :

    Valbreuil Bourse se réserve le droit de modifier ce taux en fonction de l''évolution
    des coûts de sécurisation des actifs et du reporting réglementaire. Toute modification
    fera l''objet d''une notification préalable via notre messagerie sécurisée, conformément
    à nos engagements de transparence.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: rate_sheet
  source_authority: official
  placeholder: true
