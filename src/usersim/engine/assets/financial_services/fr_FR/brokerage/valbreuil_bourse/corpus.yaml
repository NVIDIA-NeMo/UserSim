- id: ee25332c-8770-54c8-bc3c-7e5532b692d1
  title: PEA Jeune — opération refusée ou bloquée
  body: 'Il peut arriver qu''une opération de versement ou d''achat soit refusée lors
    de sa tentative d''exécution. Voici les causes probables et la marche à suivre
    pour résoudre la situation.


    Symptôme : Le message d''erreur indique que le versement est impossible ou que
    l''ordre est bloqué.


    Causes probables et vérifications

    1. Dépassement du plafond de versement : Vérifiez si le montant du versement,
    cumulé aux versements précédents, excède la limite réglementaire de 20 000 €.
    Si c''est le cas, l''opération est systématiquement bloquée.

    2. Condition d''âge non respectée : Si vous avez atteint l''âge de 25 ans, tout
    nouveau versement est interdit sur le PEA Jeune. Vérifiez votre date de naissance
    dans vos informations de profil.

    3. Défaut d''authentification : Toute action modifiant l''état du compte ou tout
    retrait de fonds exige une authentification forte. Si cette étape a échoué, l''opération
    ne peut être validée.

    4. Dossier KYC incomplet : Une vérification d''identité rigoureuse est obligatoire.
    Si un document justificatif est expiré, vos capacités d''investissement peuvent
    être temporairement suspendues.


    Résolution

    - Pour le plafond : Vous devez limiter votre versement pour rester sous la barre
    des 20 000 € ou demander la transformation de votre compte en PEA classique.

    - Pour l''âge : Si vous avez 25 ans ou plus, demandez la conversion de votre enveloppe
    fiscale pour continuer à investir.

    - Pour l''identité : Fournissez les pièces justificatives actualisées via la messagerie
    sécurisée.


    Escalade

    Si aucune des causes ci-dessus n''explique le blocage, nous ouvrirons un ticket
    d''incident auprès de la direction des opérations. Vous recevrez un accusé de
    réception immédiat et une résolution selon nos délais normés.


    Pour plus d''informations sur les types de blocages techniques, veuillez consulter
    le document PEA Jeune — opération échouée ou en attente.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: troubleshooting
  source_authority: official
