- id: 215ff57c-9bbc-5a54-8fa4-5f03a99d3c78
  title: PEA-PME — coûts et frais
  body: 'Voici les réponses aux questions les plus fréquentes concernant la structure
    tarifaire du PEA-PME.


    **Quels sont les frais appliqués lors de l''achat ou de la vente de titres ?**

    Chaque ordre d''exécution sur notre plateforme est soumis à un taux de frais de courtage
    de 0,2 %. Ce montant est calculé sur la valeur totale de l''ordre.


    **Quels sont les frais si je souhaite transférer mon PEA-PME vers un autre établissement
    ?**

    Le transfert sortant de vos titres vers un autre courtier est encadré par un plafond
    de frais de transfert sortant de 150 €. Ce montant maximal s''applique pour sécuriser
    vos coûts lors d''un changement d''institution.


    **Existe-t-il des frais de gestion annuels ?**

    La tarification est conçue pour être compétitive et transparente. Pour le détail
    complet de nos frais, veuillez consulter le document PEA-PME — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: faq
