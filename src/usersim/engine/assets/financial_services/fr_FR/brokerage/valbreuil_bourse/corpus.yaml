- id: ab9071b6-42fa-5431-88a6-3a4ac060628f
  title: PEA Jeune — quand changer ou monter en gamme
  body: 'L''agent doit conseiller le client sur le moment opportun pour transiter
    vers une autre enveloppe fiscale en fonction de son évolution patrimoniale et
    personnelle.


    Passage au PEA Classique

    Le client doit envisager le passage au PEA standard dans les deux cas suivants
    :

    - Atteinte de l''âge limite : À partir de 25 ans, les versements sur le PEA Jeune
    sont interdits. Le passage au PEA est alors impératif pour continuer d''alimenter
    le plan.

    - Saturation du plafond : Lorsque le client a atteint le plafond de 20 000 € et
    souhaite investir davantage. Le PEA classique offre un plafond élargi à 150 000
    €.


    Passage au PEA-PME

    Le client peut opter pour un PEA-PME s''il souhaite soutenir spécifiquement les
    petites et moyennes entreprises. Ce produit offre un plafond de versement encore
    plus élevé, atteignant 225 000 € (en cumul avec le PEA classique).


    Synthèse pour l''agent :

    - PEA Jeune : Idéal pour l''initiation (18-25 ans), plafond 20 000 €.

    - PEA Classique : Idéal pour la croissance à long terme, plafond 150 000 €.

    - PEA-PME : Idéal pour l''investissement ciblé PME, plafond 225 000 €.


    L''agent doit rappeler que les frais de courtage restent compétitifs et alignés
    sur la philosophie de l''établissement, tout en vérifiant l''adéquation du nouveau
    produit via le processus MiFID II.'
