- id: 34f55564-2ca3-583d-ba19-ebea4e2c4e04
  title: Compte-titres ordinaire — opération refusée ou bloquée
  body: 'Il peut arriver qu''une opération d''achat ou de vente sur votre Compte-titres
    ordinaire soit refusée ou bloquée par nos systèmes de contrôle. Voici comment
    identifier la cause et résoudre la situation.


    **Symptômes constatés**

    Vous recevez un avis d''échec d''ordre ou constatez que votre transaction reste
    au statut « bloquée » sans être exécutée sur le marché.


    **Causes possibles et vérifications**


    1. **Provision insuffisante** : Vérifiez que le solde en espèces de votre compte
    couvre non seulement le montant du titre, mais également la commission de courtage
    de 1,99 €. Un manque même minime entraînera le rejet automatique de l''ordre.


    2. **Défaut d''adéquation (MiFID II)** : Si vous tentez d''acquérir un instrument
    financier complexe (comme certains produits dérivés), l''opération peut être bloquée
    si votre profil d''investisseur ou vos connaissances ne sont pas jugés appropriés.
    Vérifiez si votre évaluation de l''adéquation est à jour.


    3. **Alerte de sécurité** : Si l''opération présente un caractère inhabituel ou
    si vos informations d''identité nécessitent une mise à jour, nous pouvons geler
    l''opération conservatoirement pour protéger vos actifs.


    **Résolution**


    - Pour un problème de provision : effectuez un virement vers votre compte et demandez-nous
    de relancer l''ordre une fois les fonds disponibles.

    - Pour un problème d''adéquation : demandez-nous de mettre à jour votre questionnaire
    de profil de risque pour vérifier si le produit est compatible avec vos objectifs.

    - Pour un blocage de sécurité : fournissez-nous les justificatifs d''identité
    requis via la messagerie sécurisée.


    **Escalade**

    Si la cause n''est pas apparente après ces vérifications, nous escaladons votre
    dossier vers la direction des opérations ou le responsable de la conformité. Vous
    recevrez un accusé de réception immédiat de votre réclamation, et nous vous informerons
    de la résolution selon nos délais normés. Pour plus d''informations sur la sécurité,
    consultez Compte-titres ordinaire — protection contre la fraude et les opérations
    non autorisées.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1840ef54-31bb-5241-ae22-164b80da6783
  title: Compte-titres ordinaire — quand changer ou monter en gamme
  body: 'Le Compte-titres ordinaire est l''outil de flexibilité absolue, mais selon
    l''évolution de vos objectifs, d''autres enveloppes de Valbreuil Bourse peuvent
    devenir plus pertinentes.


    **Vers le Plan d''épargne en actions (PEA)**

    Si votre stratégie s''oriente prioritairement vers des actions européennes et
    que vous recherchez une optimisation fiscale à long terme, le passage vers un
    PEA est recommandé. Alors que le Compte-titres ordinaire ne propose aucun avantage
    fiscal, le PEA permet une exonération d''impôt sur le revenu après cinq ans de
    détention. Toutefois, le PEA impose un plafond de versement de 150 000 €, là où
    le Compte-titres ordinaire est sans limite.


    **Vers l''Investissement programmé en ETF**

    Si vous souhaitez passer d''une gestion active (choix manuel de titres avec frais
    de 1,99 € par ordre) à une stratégie de lissage du risque automatisée, notre solution
    d''investissement en ETF est préférable. Elle est accessible dès 25 € et réduit
    la charge mentale de la gestion quotidienne.


    **Synthèse de choix**

    - Conservez le Compte-titres ordinaire pour : l''investissement mondial, l''absence
    de plafond et la disponibilité totale des fonds.

    - Optez pour le PEA pour : la fiscalité avantageuse sur les titres européens.


    Pour plus de détails, consultez Plan d''épargne en actions (PEA) — présentation.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: comparison
