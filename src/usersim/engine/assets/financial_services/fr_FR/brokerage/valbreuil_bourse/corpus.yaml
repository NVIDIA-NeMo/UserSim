    \nOffre : « Horizon Europe »\n- Avantage : Réduction du taux de courtage à 0 %\
    \ pour toutes les opérations d'achat effectuées sur votre PEA durant les trois\
    \ premiers mois suivant l'ouverture du compte.\n- Période de validité : Cette\
    \ offre est disponible pour toute souscription validée entre le 01/11/2023 et\
    \ le 31/12/2023.\n\nConditions : \nL'offre s'applique uniquement aux nouveaux\
    \ comptes PEA. Passé le délai de trois mois, le taux de courtage standard de 0,2\
    \ % sera appliqué automatiquement à toutes vos transactions. Les frais de transfert\
    \ sortant restent inchangés (15 € par ligne, plafonnés à 150 €). \n\nNous vous\
    \ invitons à consulter la Plan d'épargne en actions (PEA) — présentation pour\
    \ optimiser votre stratégie d'investissement."
