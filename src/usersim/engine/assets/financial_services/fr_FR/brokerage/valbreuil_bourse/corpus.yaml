- id: d1722cf6-0935-5def-a2ee-97bad73416b7
  title: Compte-titres ordinaire — effectuer une modification
  body: 'Pour modifier les informations liées à votre Compte-titres ordinaire (coordonnées,
    informations fiscales ou options de compte), veuillez suivre la procédure suivante
    :


    1. Demande de modification : Indiquez-nous précisément l''élément que vous souhaitez
    modifier via notre messagerie sécurisée ou par e-mail durant les jours ouvrés
    (fuseau CET).


    2. Validation de l''identité : En raison de nos exigences de sécurité, nous vous
    demanderons de passer par une étape d''authentification forte. Aucun changement
    de coordonnées ne peut être effectué sans cette validation sécurisée.


    3. Transmission des justificatifs : Si la modification concerne un changement
    d''adresse ou de statut fiscal, transmettez-nous le document justificatif officiel
    correspondant.


    4. Traitement et confirmation : Notre équipe opérationnelle traitera votre demande.
    Une fois la modification validée, vous recevrez un accusé de réception et une
    confirmation écrite de la mise à jour de votre dossier.


    En cas de demande complexe, votre dossier pourra être escaladé vers la direction
    des opérations ou le responsable de la conformité pour garantir le respect des
    cadres de l''AMF et de l''ACPR.'
  domain: brokerage_investing
  product_category: compte_titres
