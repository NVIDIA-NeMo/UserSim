- id: 45576833-bb4f-5d01-963e-97dff8649f6a
  title: PEA-PME — opération refusée ou bloquée
  body: 'Si vous tentez d''effectuer un versement ou un achat de titres et que l''opération
    est refusée, voici les causes probables et les étapes de résolution.


    **Symptômes**

    - Message d''erreur indiquant que le plafond est atteint.

    - Ordre de bourse refusé pour « titre non éligible ».

    - Blocage total des opérations sur le compte.


    **Causes et solutions**

    1. **Dépassement du plafond :** Vérifiez si le cumul de vos versements a atteint
    la limite de 225 000 €. Si c''est le cas, tout nouveau versement sera bloqué.
    Vous pouvez toutefois continuer à investir les fonds déjà présents sur le compte.

    2. **Non-éligibilité du titre :** Assurez-vous que l''action sélectionnée répond
    aux critères PME. Si le titre est une grande capitalisation européenne classique,
    il ne peut pas être logé dans un PEA-PME. Nous vous suggérons de consulter PEA-PME
    — présentation pour rappel sur la nature des actifs admis.

    3. **Défaut de vérification d''identité :** Toute action modifiant l''état du
    compte nécessite une authentification forte. Si vos documents d''identité sont
    obsolètes, vos opérations peuvent être suspendues.


    **Escalade**

    Si aucune de ces causes ne s''applique, nous escaladerons votre demande vers le
    responsable de la conformité. Vous recevrez un accusé de réception immédiat et
    une réponse sous le délai de résolution normé de l''institution.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: fa1eca46-7b31-506e-bb7d-4fd0c0b7e6d5
  title: PEA-PME — quand changer ou monter en gamme
  body: 'Le choix entre un PEA classique et un PEA-PME dépend principalement de votre
    stratégie d''investissement et de vos besoins en termes de plafonds.


    Le PEA-PME est l''option privilégiée lorsque vous souhaitez soutenir des entreprises
    à plus forte croissance et bénéficier d''un plafond de versement élargi à 225
    000 €, contre 150 000 € pour le PEA classique. Les frais de courtage restent identiques,
    soit 0,2 % par ordre.


    Il est pertinent de passer au PEA-PME ou d''en ouvrir un si :

    - Vous avez déjà atteint le plafond du PEA classique et souhaitez continuer à
    investir dans des actions européennes sous un régime fiscal avantageux.

    - Votre stratégie cible spécifiquement les PME européennes pour diversifier votre
    portefeuille.


    Si vous recherchez une flexibilité totale, sans aucun plafond de versement et
    avec la possibilité d''investir sur les marchés mondiaux (hors Europe), le Compte-titres
    ordinaire est la solution adaptée, bien qu''il ne dispose pas des mêmes avantages
    fiscaux que le PEA-PME.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 34c8c430-a978-5c1f-bfab-f64c909fa956
  title: PEA-PME — comparaison avec les alternatives et quand ne pas le choisir
  body: 'Le PEA-PME se distingue par sa capacité à allier fiscalité avantageuse et
    soutien aux entreprises de taille moyenne. Voici comment le situer face aux alternatives
    proposées par Valbreuil Bourse.


    **Avantages comparatifs**

    Le principal atout du PEA-PME est son plafond de versement de 225 000 €, supérieur
    aux 150 000 € du PEA classique. Il permet d''exposer son capital à des titres
    PME, souvent moins liquides mais potentiellement plus performants sur le long
    terme, tout en conservant un taux de frais de courtage compétitif de 0,2 %.


    **Quand ne pas choisir le PEA-PME ?**

    Ce produit n''est pas recommandé dans les cas suivants :

    - **Recherche de garantie du capital :** Le capital investi dans un PEA-PME n''est
    jamais garanti. Si vous ne pouvez tolérer aucune perte, ce produit n''est pas
    approprié.

    - **Investissement hors Europe :** Le PEA-PME est limité aux actions européennes
    éligibles. Pour investir aux États-Unis ou en Asie, le Compte-titres ordinaire
    est indispensable.

    - **Besoin de liquidité immédiate sans contrainte fiscale :** Bien que les retraits
    soient possibles, ils peuvent entraîner la clôture du plan selon les règles fiscales
    en vigueur. Le Compte-titres offre une flexibilité totale sans plafond.


    En résumé, choisissez le PEA-PME pour optimiser votre fiscalité sur un montant
    allant jusqu''à 225 000 € tout en investissant dans le tissu économique européen.
    Pour toute autre stratégie, veuillez consulter PEA-PME — présentation.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 391933fc-6166-5b96-99e6-d9b2a34aad7b
  title: PEA-PME — éligibilité et souscription
  body: 'Voici les informations essentielles concernant l''accès au PEA-PME.


    **Qui peut souscrire à un PEA-PME ?**

    Ce produit est réservé aux résidents fiscaux français. L''ouverture est conditionnée
    par une vérification d''identité rigoureuse et une authentification forte, conformément
    aux normes de sécurité de Valbreuil Bourse.


    **Quelle est la procédure de souscription pour un client existant ?**

    Si vous détenez déjà un compte chez nous, vous pouvez nous demander l''ouverture
    d''un PEA-PME. Nous procéderons à l''évaluation de l''adéquation MiFID II pour
    confirmer que ce produit correspond à vos connaissances et objectifs d''investissement.
    Une fois cette étape validée, le compte est activé.


    **Peut-on transformer un PEA classique en PEA-PME ?**

    L''ouverture d''un PEA-PME se fait généralement via un nouveau contrat, tout en
    respectant les plafonds globaux de versement. Pour plus de détails sur les documents
    requis, veuillez consulter PEA-PME — justificatifs à fournir.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 6adf08bc-1bc5-58cf-9b94-c908d15bd3f3
  title: PEA-PME — traiter une demande courante de bout en bout
  body: 'Voici la marche à suivre pour réaliser une opération d''investissement complète
    sur votre PEA-PME, depuis le financement jusqu''à l''acquisition de titres.


    1. **Alimentation du compte :** Demandez-nous d''effectuer un transfert de fonds
    depuis votre compte espèces vers votre PEA-PME. Assurez-vous que ce versement,
    ajouté aux précédents, ne dépasse pas le plafond de 225 000 €.

    2. **Sélection de l''actif :** Indiquez-nous le titre de la PME éligible que vous
    souhaitez acquérir ainsi que la quantité ou le montant à investir.

    3. **Vérification et exécution :** Nous vérifions l''éligibilité du titre et la
    disponibilité des fonds. Nous vous confirmons ensuite l''exécution de l''ordre.
    Notez que des frais de courtage de 0,2 % seront déduits du solde de votre compte.

    4. **Confirmation :** Vous recevez une notification de transaction confirmant
    l''achat. Le titre apparaîtra dans votre portefeuille après le délai conventionnel
    du règlement-livraison.


    L''opération est terminée lorsque le titre est officiellement inscrit à votre
    nom. Vous pouvez alors consulter l''impact de cet achat sur votre historique via
    la procédure décrite dans PEA-PME — consulter le suivi ou l''historique.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: how_to_guide
  source_authority: official
