- id: 1b1ad028-84c3-571a-8d73-61dd643b2958
  title: PEA-PME — bonnes pratiques de sécurité du compte
  body: 'La sécurisation de vos actifs est la priorité absolue de Valbreuil Bourse.
    Pour protéger votre PEA-PME, nous vous demandons de suivre rigoureusement les
    protocoles de sécurité suivants :


    1. Authentification forte : L''accès à votre espace client requiert une authentification
    multi-facteurs. Ne partagez jamais vos codes d''accès, même avec un collaborateur
    prétendant agir pour le compte de l''institution.


    2. Validation des opérations : Toute action modifiant l''état de votre compte
    ou tout retrait de fonds est soumise à une vérification d''identité rigoureuse.
    Aucun changement de coordonnées ne peut être effectué sans une validation sécurisée
    préalable.


    3. Vigilance face au phishing : Valbreuil Bourse ne vous demandera jamais vos
    identifiants de connexion ou vos clés de sécurité par e-mail ou via un lien hypertexte.


    En cas de suspicion de fraude ou d''accès non autorisé, nous vous invitons à nous
    le signaler immédiatement via notre messagerie sécurisée. Conformément à nos procédures,
    les comptes suspectés de fraude sont gelés conservatoirement pour protéger vos
    actifs.


    Sachez que, bien que le capital investi ne soit jamais garanti, vos titres sont
    protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à
    un montant de 70 000 €.


    Pour plus de détails sur la prévention des risques, vous pouvez consulter le document
    PEA-PME — protection contre la fraude et les opérations non autorisées.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f60a9cfc-db85-599f-a09b-7d332e8a4d49
  title: PEA-PME — modification des conditions
  body: 'Les présentes conditions régissent les modalités de modification des termes
    contractuels relatifs au PEA-PME au sein de Valbreuil Bourse.


    Obligations de l''Institution : Valbreuil Bourse s''engage à maintenir une transparence
    totale sur ses coûts. Toute modification des frais, notamment le taux de frais
    de courtage actuellement fixé à 0,2 %, fera l''objet d''une notification préalable
    envoyée via la messagerie sécurisée.


    Limites et Plafonds : Le client reconnaît que le plafond de versement du PEA-PME
    est strictement limité à 225 000 €. Tout versement excédant ce montant sera refusé
    ou traité selon les règles fiscales en vigueur, pouvant entraîner la perte de
    l''avantage fiscal du plan.


    Frais de Transfert : En cas de transfert de votre PEA-PME vers un autre établissement,
    Valbreuil Bourse applique des frais de transfert sortant, dont le plafond est
    strictement limité à 150 €.


    Procédure de modification : L''institution se réserve le droit de modifier les
    conditions générales pour se conformer aux évolutions réglementaires de l''AMF
    et de l''ACPR. Le client dispose d''un délai de préavis normé pour accepter les
    nouvelles conditions ou demander la clôture de son compte.


    Fin du contrat : Le contrat prend fin soit par la clôture volontaire du compte
    par le client, soit par une décision de l''institution en cas de manquement grave
    aux obligations de conformité ou de lutte contre le blanchiment.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: terms_conditions
  source_authority: official
  placeholder: true
