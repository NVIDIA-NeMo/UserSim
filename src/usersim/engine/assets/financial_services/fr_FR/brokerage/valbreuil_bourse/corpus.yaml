  body: "L'ouverture d'un Compte-titres ordinaire chez Valbreuil Bourse est soumise\
    \ à une vérification rigoureuse de l'identité et de la situation fiscale du futur\
    \ client. \n\nVoici la matrice des justificatifs requis :\n\n| Document requis\
    \ | Nature du justificatif accepté | Finalité |\n| :--- | :--- | :--- |\n| Pièce\
    \ d'identité | Passeport ou Carte Nationale d'Identité (CNI) en cours de validité\
    \ | Vérification KYC et lutte contre le blanchiment (LCB-FT) |\n| Justificatif\
    \ de domicile | Facture d'énergie, d'eau ou avis d'imposition de moins de 3 mois\
    \ | Validation de la résidence fiscale |\n| Attestation fiscale | Formulaire d'auto-certification\
    \ de résidence fiscale | Application des conventions fiscales internationales\
