- id: 65cc6a81-1098-594b-bcf8-ff4dd081eaf7
  title: Investissement programmé en ETF — reconnaître les arnaques visant ce produit
  body: 'L''investissement automatisé en ETF attire naturellement l''attention de
    tiers malveillants. Pour protéger vos actifs au sein de Valbreuil Bourse, il est
    essentiel de savoir identifier les signaux d''alerte spécifiques aux fraudes liées
    aux placements programmé.


    Certains escrocs peuvent vous contacter en prétendant être des conseillers de
    notre institution ou des experts en gestion d''actifs. Soyez extrêmement vigilants
    si l''on vous promet des rendements garantis ou des performances exceptionnelles
    sans risque. Nous vous rappelons que le capital investi n''est jamais garanti
    et que Valbreuil Bourse ne garantit aucun rendement.


    Une tactique courante consiste à vous inciter à modifier vos coordonnées bancaires
    ou vos informations de sécurité pour « optimiser » vos versements de 25 €. Sachez
    que Valbreuil Bourse n''effectuera jamais de changement de coordonnées sans une
    validation sécurisée et une authentification forte préalable. Nous ne vous demanderons
    jamais votre mot de passe, votre code secret ou vos identifiants de connexion
    par e-mail ou par messagerie.


    Si vous constatez une activité inhabituelle sur votre compte ou si vous recevez
    une sollicitation suspecte, nous vous demandons d''en informer immédiatement notre
    service d''assistance via la messagerie sécurisée. En cas de suspicion avérée
    de fraude, nous procéderons au gel conservatoire de votre compte afin de protéger
    vos titres. Pour rappel, vos actifs sont protégés par le FGDR jusqu''à 70 000
    euros, mais cette garantie ne couvre pas les pertes liées aux fluctuations du
    marché ou aux erreurs de manipulation d''identifiants par le client.


    Pour approfondir vos connaissances sur la sécurisation de vos accès, nous vous
    invitons à consulter le document Investissement programmé en ETF — protection
    contre la fraude et les opérations non autorisées.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8d61a3b0-c245-532e-b531-93c8a5a28d63
  title: Investissement programmé en ETF — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux agents d''assistance pour l''encadrement technique
    de l''Investissement programmé en ETF. Ce produit est conçu pour lisser le risque
    via une approche automatisée.


    **Seuils et Frais**

    - Montant minimal par échéance : Le versement minimal pour activer ou maintenir
    un plan d''investissement est de 25 €. Tout montant inférieur ne pourra être traité.

    - Frais d''exécution : L''institution applique une gratuité totale sur ce plan
    d''investissement automatisé. Les frais par exécution de l''investissement programmé
    sont de 0 €.


    **Restrictions et Conformité**

    L''activation de ce service est strictement conditionnée à la réalisation d''une
    évaluation de l''adéquation, conformément aux normes MiFID II. Ce processus permet
    de s''assurer que l''investissement en ETF correspond aux connaissances, à l''expérience
    et aux objectifs du client. Si le profil de risque du client ne permet pas l''investissement
    en instruments financiers, l''opération doit être refusée.


    **Cas Particuliers**

    - Gel des comptes : En cas de suspicion de fraude, le compte est gelé conservatoirement,
    suspendant ainsi toutes les échéances programmées jusqu''à résolution.

    - Protection des actifs : Les titres acquis via ce programme bénéficient de la
    protection du FGDR jusqu''à un montant de 70 000 euros.

    - Modification des plans : Tout changement du montant ou de la fréquence nécessite
    une authentification forte.


    Pour les détails concernant l''éligibilité initiale, veuillez vous référer à Investissement
    programmé en ETF — conditions d''éligibilité.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8538b490-6464-5e9e-a21b-b0f3d5dc6420
  title: Investissement programmé en ETF — éligibilité et souscription
  body: '« Qui peut souscrire à un programme d''investissement automatisé en ETF ?
    »

    Ce service est ouvert à tous nos clients résidant en France, ayant un compte actif
    et ayant complété avec succès l''évaluation de l''adéquation MiFID II. Ce processus
    vérifie que le produit correspond à vos objectifs et à votre profil de risque.


    « Quel est le montant minimum pour commencer ? »

    L''Investissement programmé en ETF est conçu pour être accessible. Vous pouvez
    mettre en place un plan d''investissement automatisé dès un montant de 25 € par
    échéance.


    « Comment souscrire à ce service ? »

    La souscription s''effectue via notre interface sécurisée. Après avoir validé
    votre profil d''investisseur, vous définissez le montant et la fréquence de vos
    versements. Nous vous confirmons l''activation du plan dès que les conditions
    de conformité sont remplies. Pour plus de détails sur les étapes, consultez Investissement
    programmé en ETF — mode d''emploi pas à pas.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ce514fea-e681-52ff-9a85-a2afca0dd4d5
  title: Investissement programmé en ETF — consulter le suivi ou l'historique
  body: 'Pour suivre la progression de vos investissements automatisés et analyser
    vos performances, nous vous invitons à suivre la procédure suivante :


    1. Demandez-nous l''accès à l''état de vos positions actuelles pour votre plan
    d''investissement en ETF. Nous vous transmettrons la liste des titres détenus
    et leur valorisation au cours actuel du marché.

    2. Pour obtenir le détail des transactions passées, demandez-nous l''historique
    des exécutions de votre programme. Nous vous fournirons la date de chaque achat,
    le montant investi (minimum 25 €) et le nombre de parts d''ETF acquises.

    3. Pour une vue d''ensemble réglementaire, demandez l''envoi de vos derniers relevés
    de compte. Nous vous ferons parvenir ces documents via votre messagerie sécurisée,
    détaillant vos soldes et vos opérations.

    4. Vérifiez l''absence de frais d''exécution : vous constaterez sur vos relevés
    que les frais par exécution de l''investissement programmé sont de 0 €, conformément
    à notre politique de transparence.


    Vous saurez que la consultation est complète lorsque vous aurez pu réconcilier
    le montant total de vos versements programmés avec la valeur actuelle de vos positions
    et les lignes d''achat détaillées dans vos relevés.


    Si vous observez une différence entre vos attentes et vos relevés, nous vous conseillons
    de consulter Investissement programmé en ETF — écart avec vos relevés.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 948ba6cc-c0d9-52e2-89dd-8b35dfeb4022
  title: Investissement programmé en ETF — opération refusée ou bloquée
  body: 'Il peut arriver qu''une échéance de votre investissement programmé ne soit
    pas exécutée ou qu''une modification de votre plan soit refusée. Voici les causes
    probables et la marche à suivre.


    **Symptômes constatés**

    - L''échéance prévue n''a pas été débitée.

    - Un message d''erreur indique que l''opération est bloquée.

    - La demande de modification du montant (par exemple, passage à un montant inférieur
    à 25 €) est rejetée.


    **Causes possibles et vérifications**

    1. **Solde insuffisant** : Vérifiez que le compte source dispose des fonds nécessaires
    pour couvrir le versement programmé. Si le solde est inférieur au montant prévu,
    l''opération est automatiquement annulée.

    2. **Défaut d''authentification** : Toute modification de plan nécessite une authentification
    forte. Si la validation d''identité a échoué, l''opération est bloquée par sécurité.

    3. **Non-conformité MiFID II** : Si votre profil de risque a évolué ou si l''évaluation
    de l''adéquation n''est plus à jour, l''institution peut suspendre les investissements
    pour protéger vos intérêts.

    4. **Mesure conservatoire** : En cas de suspicion de fraude, Valbreuil Bourse
    gèle les comptes pour protéger les actifs. Toutes les opérations, y compris les
    investissements programmés, sont alors suspendues.


    **Résolution**

    - Pour un problème de solde, alimentez votre compte et demandez-nous de relancer
    l''exécution manuellement si nécessaire.

    - Pour un problème d''authentification, reprenez la procédure de validation d''identité.

    - Pour les blocages de conformité ou de fraude, nous ouvrirons un dossier d''analyse.
    Le responsable de la conformité examinera votre dossier et vous informera de la
    levée du blocage ou des documents complémentaires à fournir via la messagerie
    sécurisée.


    Pour comprendre comment choisir un produit plus adapté à vos besoins si vos restrictions
    sont trop importantes, consultez Investissement programmé en ETF — comparaison
    avec les alternatives et quand ne pas le choisir.'
