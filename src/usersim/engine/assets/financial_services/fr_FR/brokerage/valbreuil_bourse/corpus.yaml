- id: d768598c-a053-5f6e-81d1-b645bb7fa462
  title: Investissement programmé en ETF — offre de parrainage et de fidélité
  body: "Valbreuil Bourse a le plaisir de vous présenter son programme de parrainage\
    \ dédié à l'Investissement programmé en ETF, visant à récompenser la confiance\
    \ de nos investisseurs. \n\nDu 1er novembre 2024 au 31 décembre 2024, pour chaque\
    \ nouveau client parrainé qui active un plan d'investissement automatisé avec\
    \ un versement minimal de 25 €, le parrain recevra une prime de fidélité de 10\
    \ € créditée directement sur son compte espèces. Le filleul, pour sa part, bénéficiera\
    \ d'un bonus de bienvenue de 5 € dès la première exécution de son plan.\n\nL'Investissement\
    \ programmé en ETF demeure accessible avec un montant minimal de 25 € par échéance\
    \ et profite d'une gratuité totale sur les frais d'exécution, soit 0 € par opération.\
    \ \n\nCette offre est soumise aux conditions de conformité habituelles de l'établissement.\
