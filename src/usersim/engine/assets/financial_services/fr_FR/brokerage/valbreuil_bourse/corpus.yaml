- id: f66d8fb2-f1aa-5fb4-86d8-7871c7bef1ba
  title: Investissement programmé en ETF — opération échouée ou en attente
  body: 'Symptôme : Vous constatez qu''une échéance programmée n''a pas été exécutée
    ou apparaît avec le statut « en attente » dans votre suivi.


    Causes probables et vérifications :


    1. Solde insuffisant : Vérifiez que le solde de votre compte espèces est supérieur
    ou égal au montant de l''échéance (minimum 25 €) à la date prévue de l''opération.
    Si les fonds étaient insuffisants, l''ordre n''a pu être transmis.


    2. Calendrier boursier : Si l''échéance tombe un jour non ouvré ou durant un jour
    férié affectant la place boursière de l''ETF, l''opération peut être reportée
    au jour ouvré suivant.


    3. Conformité et Identité : Dans certains cas, une mise à jour obligatoire de
    vos documents d''identité ou une nouvelle évaluation de l''adéquation MiFID II
    peut suspendre temporairement les opérations automatisées pour protéger vos actifs.


    Résolution :


    - Si le solde était insuffisant, nous vous invitons à approvisionner votre compte.
    L''opération ne sera pas automatiquement rattrapée ; vous devrez demander manuellement
    l''exécution de l''échéance manquée.

    - Si vos documents d''identité sont expirés, veuillez nous transmettre les pièces
    justificatives via notre messagerie sécurisée.


    En cas de persistance du problème après ces vérifications, nous escaladerons votre
    dossier vers la direction des opérations pour une analyse technique approfondie.
    Vous recevrez un accusé de réception immédiat de votre demande et une résolution
    sous le délai normé de l''institution.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 812d6943-d263-55d2-a46b-6267a7285453
  title: Investissement programmé en ETF — conditions d'éligibilité
  body: 'L''accès à l''Investissement programmé en ETF est soumis aux conditions suivantes
    :


    | Condition | Exigence | Résultat |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français | Éligible |

    | Statut du compte | Compte ouvert et vérifié | Éligible |

    | Évaluation MiFID II | Processus d''adéquation complété et validé | Éligible
    |

    | Capacité financière | Versement minimal de 25 € par échéance | Éligible |

    | Identité | Authentification forte et KYC à jour | Éligible |


    Le non-respect de l''un de ces critères entraîne l''impossibilité d''activer le
    plan d''investissement automatisé.'
