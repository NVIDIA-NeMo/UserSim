- id: 67245b0c-30b6-5436-937d-6206a328cf25
  title: PEA-PME — opération échouée ou en attente
  body: 'Symptôme : Un ordre d''achat ou de vente de titres PME apparaît comme « en
    attente » ou a été marqué comme « échoué » dans votre historique.


    Causes probables et vérifications :

    1. Délai de Règlement-livraison : Il est possible que l''opération soit en cours
    de traitement. Le Règlement-livraison est le délai conventionnel entre l''exécution
    d''un ordre et le transfert effectif de la propriété des titres. Vérifiez si le
    délai standard du marché concerné a été respecté.

    2. Insuffisance de liquidités : Pour un achat, assurez-vous que le solde en numéraire
    sur votre PEA-PME couvre non seulement le prix des titres, mais aussi les frais
    de courtage de 0,2 %.

    3. Plafond de versement atteint : Si l''échec concerne un apport de fonds, vérifiez
    que le cumul de vos versements n''atteint pas le plafond de 225 000 €.


    Résolution :

    - Si le solde est insuffisant, effectuez un virement complémentaire et relancez
    l''ordre.

    - Si le plafond est atteint, vous ne pourrez plus verser de fonds, mais vous pouvez
    continuer à gérer vos positions existantes.


    Escalade :

    Si l''opération reste bloquée sans cause apparente après 48 heures ouvrées, nous
    ouvrirons un ticket d''incident auprès de la direction des opérations. Vous recevrez
    un accusé de réception immédiat et un suivi jusqu''à la résolution normative de
    l''anomalie.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ac531645-d73a-5d2b-8f74-e42b6473792c
  title: PEA-PME — conditions d'éligibilité
  body: 'L''accès au PEA-PME est soumis aux critères stricts suivants :


    | Condition | Exigence | Résultat |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français | Éligible |

    | Résidence fiscale | Non-résident français | Non éligible |

    | Profil d''investisseur | Validation de l''évaluation de l''adéquation MiFID
    II | Éligible |

    | Profil d''investisseur | Évaluation jugée non appropriée | Accès restreint /
    Refus |

    | Plafond de versement | Apports cumulés ≤ 225 000 € | Versement autorisé |

    | Plafond de versement | Apports cumulés > 225 000 € | Versement bloqué (Gestion
    seule) |

    | Identité | Vérification KYC et authentification forte complétées | Compte activé
    |'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: eligibility_matrix
