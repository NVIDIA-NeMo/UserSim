- id: c38af27e-79b8-539b-8170-8b74f412cc08
  title: Compte-titres ordinaire — résilier, clôturer ou changer de formule
  body: "La fermeture d'un Compte-titres ordinaire nécessite une procédure rigoureuse\
    \ pour garantir la sécurité de vos actifs et la conformité fiscale.\n\nAvant de\
    \ commencer, assurez-vous que toutes vos opérations en cours sont dénouées et\
    \ que vous avez pris connaissance des frais de transfert si vous souhaitez déplacer\
    \ vos titres vers un autre établissement.\n\nVoici les étapes pour clôturer votre\
    \ compte :\n\n1. Demande de clôture : Adressez-nous une demande formelle via votre\
    \ messagerie sécurisée en précisant si vous souhaitez liquider vos positions (vente\
    \ des titres) ou transférer vos lignes vers un autre courtier.\n2. Vérification\
    \ d'identité : Nous procéderons à une authentification forte pour valider que\
    \ vous êtes bien l'auteur de la demande. Si des fonds doivent être retirés, nous\
    \ vérifierons la conformité de vos coordonnées bancaires.\n3. Gestion des titres\
    \ : \n   - En cas de liquidation, nous exécuterons les ordres de vente. Chaque\
    \ ordre sera soumis aux frais de courtage de 1,99 €.\n   - En cas de transfert\
    \ sortant, nous initierons le transfert. Des frais de 15 € par ligne de titres\
    \ seront prélevés sur votre solde espèces.\n4. Confirmation de clôture : Une fois\
    \ les positions soldées ou transférées et le solde espèces remis à zéro, nous\
    \ vous enverrons un avis de clôture définitif.\n\nVous saurez que l'opération\
    \ est terminée lorsque vous recevrez l'avis de clôture et que le compte n'apparaîtra\
    \ plus dans votre liste de comptes actifs. Si vous souhaitez modifier votre stratégie\
    \ vers un produit automatisé, nous pouvons vous accompagner dans l'ouverture d'un\
    \ Investissement programmé en ETF — présentation."
  domain: brokerage_investing
  product_category: compte_titres
  document_type: how_to_guide
  source_authority: official
