- id: 844f1378-6865-56cc-95ad-c6f0eae5759b
  title: Compte-titres ordinaire — opération échouée ou en attente
  body: 'Il peut arriver qu''un ordre de bourse sur votre Compte-titres ordinaire
    ne soit pas exécuté immédiatement ou soit marqué comme « échoué ». Voici les étapes
    de diagnostic pour résoudre cette situation.


    Symptôme : L''ordre apparaît avec le statut « Échoué » ou reste « En attente »
    anormalement longtemps.


    Causes probables et vérifications :

    1. Insuffisance de liquidités : Vérifiez que le solde en espèces de votre compte
    couvre non seulement le montant de l''achat des titres, mais également les frais
    de courtage de 1,99 €. Un solde insuffisant même de quelques centimes entraînera
    le rejet automatique de l''ordre.

    2. Heures de marché : Assurez-vous que l''ordre a été passé durant les heures
    d''ouverture de la place boursière concernée. Un ordre passé hors session reste
    « En attente » jusqu''à l''ouverture du marché.

    3. Vérification de sécurité : Si vous tentez d''effectuer une opération d''un
    montant inhabituel, notre système de sécurité peut suspendre l''opération pour
    vérification. Vérifiez votre messagerie sécurisée pour tout message de notre équipe
    de conformité.


    Résolution :

    - Si le solde est insuffisant, effectuez un virement vers votre compte et relancez
    l''ordre.

    - Si l''ordre est en attente pour cause d''horaire, patientez jusqu''à la prochaine
    séance boursière.

    - Si une vérification d''identité est requise, répondez promptement via la messagerie
    sécurisée.


    Escalade :

    Si l''opération échoue malgré la disponibilité des fonds et le respect des horaires,
    nous ouvrirons un ticket d''incident auprès de la direction des opérations. Vous
    recevrez un accusé de réception immédiat et une résolution sous le délai normé
    de notre établissement.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 994d5c3e-4b40-50b6-b8ea-a603f3702f90
  title: Compte-titres ordinaire — conditions d'éligibilité
  body: 'L''accès au Compte-titres ordinaire est soumis aux conditions d''éligibilité
    suivantes :


    | Condition | Exigence | Résultat |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français | Éligible |

    | Âge légal | Majeur (18 ans et plus) | Éligible |

    | Identité | Fourniture d''une pièce d''identité officielle valide | Éligible
    |

    | Conformité | Validation du questionnaire d''adéquation MiFID II | Éligible |

    | Origine des fonds | Justification de la provenance des fonds (si demandé) |
    Éligible |


    Toute demande ne remplissant pas l''intégralité de ces critères sera systématiquement
    refusée par notre responsable de la conformité. L''éligibilité ne garantit pas
    l''ouverture du compte, celle-ci restant soumise à la validation finale de notre
    direction des opérations.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 0562016d-bd77-5871-81ff-b85544e9bd1c
  title: Compte-titres ordinaire — face à un produit similaire de l'établissement
  body: 'Le choix entre un Compte-titres ordinaire et un Plan d''épargne en actions
    (PEA) dépend principalement de vos objectifs fiscaux et de votre univers d''investissement.


    Le Compte-titres ordinaire se distingue par sa flexibilité totale :

    - Univers d''investissement : Accès mondial (USA, Asie, etc.), contrairement au
    PEA limité aux actions européennes.

    - Plafonds : Aucun plafond de versement, alors que le PEA est limité à 150 000
    €.

    - Fiscalité : Imposition immédiate des plus-values, sans l''avantage fiscal à
    long terme du PEA.

    - Coût : Frais de courtage de 1,99 € par ordre et 0 € de frais de garde annuels.


    Le PEA est préférable pour un investisseur souhaitant optimiser sa fiscalité sur
    des titres européens et acceptant les plafonds de versement.


    Le Compte-titres ordinaire est la solution idéale pour ceux qui recherchent une
    liberté absolue de mouvement, une diversification géographique mondiale et qui
    n''ont pas de contraintes de plafond de dépôt. Pour plus de détails sur l''alternative
    fiscale, consultez le document Plan d''épargne en actions (PEA) — présentation.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 9a2744ec-f1c0-5923-84f6-fccdcdfca2ae
  title: Compte-titres ordinaire — informations réglementaires
  body: 'Le Compte-titres ordinaire de Valbreuil Bourse est régi par les cadres réglementaires
    de l''Autorité des Marchés Financiers (AMF) et de l''Autorité de Contrôle Prudentiel
    et de Résolution (ACPR), conformément à la directive européenne MiFID II.


    Évaluation de l''adéquation :

    Conformément à MiFID II, Valbreuil Bourse procède systématiquement à une évaluation
    de l''adéquation. Ce processus vise à s''assurer que les produits financiers acquis
    sur le compte correspondent aux connaissances, à l''expérience et aux objectifs
    d''investissement du client. L''institution se limite à un standard de soin basé
    sur le profil de risque établi lors de l''ouverture du compte.


    Protection des actifs :

    Le capital investi sur un Compte-titres ordinaire n''est jamais garanti. Les investisseurs
    s''exposent à un risque de perte en capital. Toutefois, en cas de défaillance
    de l''établissement, les titres sont protégés par le Fonds de Garantie des Dépôts
    et de Résolution (FGDR) jusqu''à un plafond de 70 000 €.


    Limites de conseil :

    Valbreuil Bourse fournit une éducation financière et vérifie la pertinence des
    produits, mais ne délivre aucun conseil fiscal ou juridique personnalisé. Il appartient
    au client de consulter un conseiller fiscal agréé pour optimiser la gestion de
    son Compte-titres.


    Sécurité et Vérification :

    Toute action modifiant l''état du compte ou tout retrait de fonds est strictement
    conditionnée à une authentification forte. Aucun changement de coordonnées ne
    peut être effectué sans une validation sécurisée préalable.


    En cas de suspicion de fraude, Valbreuil Bourse se réserve le droit de geler conservatoirement
    les comptes pour protéger les actifs du client, conformément à nos procédures
    de lutte contre le blanchiment et le financement du terrorisme.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 356278d8-f2c1-5d78-b00e-086e61504dd5
  title: Compte-titres ordinaire — grille des taux
  body: 'Concernant la rémunération des liquidités et les taux applicables au Compte-titres
    ordinaire :


    Le Compte-titres ordinaire n''est pas un produit d''épargne rémunéré. Par conséquent,
    le taux d''intérêt annuel appliqué aux liquidités non investies sur le compte
    est de 0 %.


    Il n''existe aucune structure de paliers de rémunération pour ce produit. Le rendement
    global de votre investissement dépend exclusivement de la performance des actifs
    financiers que vous choisissez d''acquérir et des dividendes éventuellement versés
    par les émetteurs de titres.


    Les coûts associés à la gestion du compte, tels que les frais de courtage de 1,99
    € par ordre, viennent en déduction de la performance nette de votre portefeuille.
    Valbreuil Bourse ne garantit aucun rendement futur.'
