- id: 2d3b5055-3190-509a-907c-20049df334b3
  title: PEA-PME — consulter le suivi ou l'historique
  body: 'Pour suivre l''évolution de vos investissements et consulter l''historique
    de vos opérations sur votre PEA-PME, veuillez suivre la procédure suivante :


    1. Demandez-nous l''accès à vos relevés de compte ou à l''historique de vos transactions
    en précisant la période concernée (mensuelle, trimestrielle ou annuelle).

    2. Nous procéderons à la génération des documents correspondants, incluant le
    détail des ordres exécutés, les frais de courtage de 0,2 % appliqués et les éventuels
    dividendes perçus.

    3. Vous recevrez un avis de disponibilité via votre messagerie sécurisée. Les
    documents seront mis à votre disposition sous forme de fichiers PDF cryptés.

    4. Vous pourrez alors consulter vos positions actuelles et vérifier la conformité
    de vos versements par rapport au plafond de 225 000 €.


    L''opération est considérée comme terminée lorsque vous avez accusé réception
    des documents et que vous avez pu vérifier que les soldes correspondent à vos
    attentes. En cas de doute sur une transaction spécifique, vous pouvez nous demander
    une explication détaillée sur l''ordre en question.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: how_to_guide
  source_authority: official
