- id: 5a3fbee9-f820-560c-afce-304b52a6314f
  title: 'Compte-titres ordinaire — droits de garde annuels : explications'
  body: 'Question : Qu''est-ce que les droits de garde et combien coûtent-ils pour
    mon Compte-titres ordinaire ?


    Réponse : Les droits de garde sont des frais prélevés par un courtier pour la
    conservation et la gestion administrative de vos titres. Chez Valbreuil Bourse,
    nous avons fait le choix de la transparence et de l''accessibilité : les droits
    de garde annuels pour le Compte-titres ordinaire sont de 0 €.


    Question : Est-ce que ce montant de 0 € s''applique quelle que soit la valeur
    de mon portefeuille ?


    Réponse : Oui, absolument. Quel que soit le montant de vos actifs conservés sur
    votre Compte-titres ordinaire, vous ne paierez aucun frais de garde annuel. Seuls
    les frais de courtage par ordre (1,99 €) restent applicables lors de vos transactions.'
