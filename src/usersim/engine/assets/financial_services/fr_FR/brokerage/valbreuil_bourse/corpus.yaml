- id: c0fa1222-6191-56bd-93e3-ccabc020a996
  title: Investissement programmé en ETF — quand changer ou monter en gamme
  body: 'L''investissement programmé en ETF est un outil d''initiation et de lissage
    du risque. Cependant, certains profils d''investisseurs gagneraient à évoluer
    vers d''autres solutions.


    **Passage vers le PEA**

    Si le client souhaite optimiser sa fiscalité sur le long terme pour des actions
    européennes, le Plan d''épargne en actions (PEA) est préférable. Alors que le
    programme ETF est flexible, le PEA offre un cadre fiscal avantageux avec un plafond
    de versement de 150 000 €.


    **Passage vers le Compte-Titres Ordinaire (CTO)**

    Si le client souhaite investir sur des marchés mondiaux sans plafond et avec une
    flexibilité totale de retrait, le Compte-titres ordinaire est la solution idoine,
    malgré l''absence d''enveloppe fiscale spécifique.


    **Critères de décision**

    - **Montants** : Si les versements dépassent largement la stratégie de lissage
    et que le client souhaite gérer activement ses lignes, le CTO est recommandé.

    - **Fiscalité** : Pour une stratégie centrée sur l''Europe et la défiscalisation,
    le PEA est prioritaire.

    - **Profil** : L''investissement programmé convient aux jeunes actifs et investisseurs
    prudents. Un investisseur averti cherchant une gestion tactique devra s''orienter
    vers un compte-titres.


    Pour plus de détails sur les différences structurelles, voir Investissement programmé
    en ETF — comparaison avec les alternatives et quand ne pas le choisir.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ccb2f9aa-d780-59cf-947e-b094ec2564d5
  title: Investissement programmé en ETF — comparaison avec les alternatives et quand
    ne pas le choisir
  body: 'L''Investissement programmé en ETF est une solution d''automatisation visant
    à réduire la volatilité par l''investissement périodique. Il est essentiel de
    le comparer aux autres enveloppes de Valbreuil Bourse pour faire un choix éclairé.


    **Atouts de la solution programmée**

    - **Accessibilité** : Permet de commencer à investir avec un montant très bas
    de 25 €.

    - **Coût** : Les frais d''exécution sont de 0 €, ce qui en fait l''option la plus
    compétitive pour les petits versements réguliers.

    - **Sérénité** : L''automatisation élimine le biais émotionnel lié au timing du
    marché.


    **Comparaison avec les alternatives**

    - **Face au PEA** : Le PEA est l''enveloppe fiscale de référence pour les actions
    européennes (plafond de 150 000 €). Si votre objectif est l''optimisation fiscale,
    le PEA est supérieur. Le programme ETF est un outil de gestion, tandis que le
    PEA est un cadre fiscal.

    - **Face au Compte-Titres** : Le Compte-titres offre une flexibilité mondiale
    sans plafond. Il est préférable pour ceux qui souhaitent choisir précisément chaque
    titre individuellement plutôt que de suivre un indice via un ETF.


    **Quand ne pas choisir ce produit ?**

    1. **Besoin de gestion active** : Si vous souhaitez spéculer sur des titres précis
    ou effectuer des opérations de court terme, l''automatisation est un frein.

    2. **Objectifs fiscaux précis** : Si vous cherchez à maximiser vos avantages fiscaux
    via des enveloppes réglementées, tournez-vous vers le PEA ou le PEA-PME.

    3. **Capital important et immédiat** : Si vous disposez d''une somme importante
    à investir d''un coup, le lissage via des versements de 25 € ou plus peut être
    trop lent par rapport à vos objectifs.


    Comme pour tout investissement, le capital n''est pas garanti, bien que vos titres
    soient protégés par le FGDR jusqu''à 70 000 euros.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 3397f054-9560-5aae-8be2-d00137ab92b8
  title: Investissement programmé en ETF — mode d'emploi pas à pas
  body: '« Comment configurer mon premier plan d''investissement ? »

    C''est très simple : demandez-nous de mettre en place un investissement programmé.
    Nous vérifierons d''abord votre éligibilité via l''évaluation de l''adéquation
    MiFID II. Une fois validée, vous nous indiquez le montant (minimum 25 €) et la
    fréquence souhaitée (mensuelle, trimestrielle, etc.).


    « Puis-je modifier le montant de mes versements en cours de route ? »

    Oui, vous pouvez nous demander de modifier le montant de vos échéances à tout
    moment, à condition que le nouveau montant respecte le seuil minimal de 25 €.


    « Comment savoir si mon investissement a bien été effectué ? »

    Chaque exécution fait l''objet d''une notification. Vous pouvez également nous
    demander votre historique de transactions ou consulter vos relevés périodiques.
    Vous y verrez que les frais d''exécution sont de 0 €. Pour un suivi détaillé,
    consultez Investissement programmé en ETF — consulter le suivi ou l''historique.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5c72b2ad-ef79-51db-b17a-b90acf1a4c3f
  title: Investissement programmé en ETF — traiter une demande courante de bout en
    bout
  body: 'Voici la procédure complète pour mettre en place un programme d''investissement
    automatisé en ETF, depuis la demande initiale jusqu''à la première acquisition
    de titres.


    1. **Vérification de l''éligibilité** : Demandez-nous l''activation d''un investissement
    programmé. Nous lancerons alors le processus d''évaluation de l''adéquation MiFID
    II. Vous devrez répondre à un questionnaire sur vos connaissances financières
    et vos objectifs. Nous vous confirmerons si le produit est approprié à votre profil.

    2. **Définition des paramètres** : Une fois l''éligibilité confirmée, indiquez-nous
    le montant que vous souhaitez investir à chaque échéance. Ce montant doit être
    au minimum de 25 €. Précisez également la périodicité (par exemple, chaque 5 du
    mois).

    3. **Validation sécurisée** : Pour finaliser la mise en place du plan, nous procéderons
    à une authentification forte. Vous devrez valider l''opération selon la méthode
    de vérification d''identité rigoureuse de Valbreuil Bourse.

    4. **Confirmation de mise en service** : Nous vous confirmerons l''activation
    du plan via la messagerie sécurisée. Vous recevrez le récapitulatif du montant
    (ex: 25 €), de la fréquence et la confirmation que les frais d''exécution sont
    de 0 €.

    5. **Première exécution et suivi** : À la date prévue, les fonds seront prélevés
    et les parts d''ETF seront acquises. Vous pourrez alors nous demander votre historique
    de transactions pour confirmer l''achat.


    Le processus est réussi lorsque vous voyez la première ligne d''achat d''ETF apparaître
    dans vos positions, sans frais de commission appliqués, et que le montant correspond
    exactement à votre programmation.


    En cas de difficulté lors de la mise en place, vous pouvez consulter Investissement
    programmé en ETF — opération refusée ou bloquée.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 20460824-cb8b-5712-8752-3bdf7d2fc05d
  title: Investissement programmé en ETF — écart avec vos relevés
  body: 'Il peut arriver qu''un client constate une différence entre le montant programmé
    et la valeur affichée sur ses relevés, ou que la date d''exécution semble décalée.
    Ce document aide les agents à résoudre ces anomalies.


    **Symptômes courants**

    - Le client signale que la somme débitée ne correspond pas à la valeur des titres
    reçus.

    - La transaction apparaît sur le relevé avec une date différente de la date de
    programmation.

    - Le client s''attendait à des frais de courtage et ne les voit pas (ou vice versa).


    **Causes et vérifications**

    1. **Le Règlement-livraison** : C''est la cause la plus fréquente. Rappelez au
    client que le règlement-livraison est le délai conventionnel entre l''exécution
    d''un ordre boursier et le transfert effectif de la propriété des titres. L''opération
    peut être débitée le jour J, mais les titres n''apparaissent officiellement dans
    le portefeuille qu''après ce délai.

    2. **Variation du cours de l''ETF** : Le montant investi (minimum 25 €) permet
    d''acheter un certain nombre de parts. Si le cours de l''ETF fluctue entre le
    moment du débit et l''exécution finale, la valeur liquidative peut varier légèrement,
    bien que le montant investi reste identique.

    3. **Vérification des frais** : Le client peut être surpris par l''absence de
    frais. Confirmez-lui que pour l''investissement programmé, les frais d''exécution
    sont strictement de 0 €.


    **Résolution**

    - Si l''écart est dû au règlement-livraison, expliquez le mécanisme au client
    et invitez-le à patienter le délai conventionnel.

    - Si l''écart provient d''une erreur de débit, nous initierons une correction
    comptable immédiate après vérification des logs de transaction.

    - En cas de doute persistant, nous escaladerons la demande vers la direction des
    opérations pour un audit détaillé des flux.


    Pour toute question sur la gestion globale des comptes, vous pouvez vous référer
    à Investissement programmé en ETF — consulter le suivi ou l''historique.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 4261795d-6e60-568b-a5e6-eab8dcc71ede
  title: Compte-titres ordinaire — présentation
  body: 'Le Compte-titres ordinaire de Valbreuil Bourse est l''instrument d''investissement
    le plus flexible à notre disposition. Contrairement aux enveloppes fiscales réglementées,
    il ne comporte aucun plafond de versement, vous permettant de déployer vos capitaux
    sans contrainte de montant et d''accéder à l''intégralité des marchés financiers
    mondiaux.


    Cette solution s''adresse particulièrement aux investisseurs avertis souhaitant
    diversifier leur portefeuille au-delà des frontières européennes ou utiliser des
    stratégies de trading actives. Le Compte-titres ordinaire offre une liquidité
    totale : vos fonds et titres peuvent être mobilisés à tout moment, sans les conditions
    de blocage liées à certaines optimisations fiscales.


    La structure tarifaire est conçue pour être transparente et compétitive. Chaque
    ordre d''achat ou de vente exécuté sur votre compte entraîne des frais de courtage
    de 1,99 €. Afin de favoriser la détention à long terme et la croissance de vos
    actifs, Valbreuil Bourse a supprimé les droits de garde : les frais de garde annuels
    sont donc de 0 €.


    En cas de souhait de transférer vos titres vers un autre établissement, des frais
    de transfert sortant de 15 € par ligne de titres sont appliqués.


    Il est essentiel de rappeler que le capital investi sur un Compte-titres ordinaire
    n''est jamais garanti. Les fluctuations des marchés peuvent entraîner une perte
    partielle ou totale de votre investissement. Toutefois, conformément aux normes
    de sécurité bancaire, vos titres sont protégés par le Fonds de Garantie des Dépôts
    et de Résolution (FGDR) jusqu''à un montant de 70 000 €.


    Nous vous invitons à consulter la documentation relative à l''évaluation de l''adéquation
    pour vous assurer que ce produit correspond à votre profil de risque.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 628d3759-dac7-5cc5-91b0-fc7044923e8b
  title: 'Compte-titres ordinaire — frais de courtage par ordre : explications'
  body: 'Question : Comment sont calculés les frais de courtage lors d''un achat ou
    d''une vente sur mon Compte-titres ordinaire ?


    Réponse : Chez Valbreuil Bourse, nous appliquons une tarification forfaitaire
    et transparente. Chaque ordre exécuté sur votre compte, qu''il s''agisse d''un
    achat ou d''une vente, fait l''objet de frais de courtage fixes de 1,99 €. Ce
    montant est prélevé indépendamment de la valeur totale de l''opération ou du nombre
    de titres acquis ou cédés.


    Question : Ces frais s''appliquent-ils également aux ordres annulés ?


    Réponse : Non, les frais de courtage de 1,99 € ne sont facturés que lorsque l''ordre
    est effectivement exécuté sur le marché. Si un ordre est annulé avant son exécution,
    aucun frais de courtage n''est prélevé.


    Pour une vue d''ensemble de l''ensemble de nos tarifs, nous vous invitons à consulter
    le document Compte-titres ordinaire — grille tarifaire.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 9a7ba8a1-5eb8-584e-86c8-a2ade2e206e1
  title: Compte-titres ordinaire — souscrire et activer
  body: 'L''ouverture d''un Compte-titres ordinaire au sein de Valbreuil Bourse suit
    un processus rigoureux afin de garantir la sécurité de vos actifs et la conformité
    réglementaire.


    Avant de commencer, munissez-vous d''une pièce d''identité valide et d''un justificatif
    de domicile récent.


    1. Demande d''ouverture : Veuillez nous faire part de votre volonté d''ouvrir
    un Compte-titres ordinaire. Nous vous transmettrons alors la liste des informations
    nécessaires à la création de votre dossier.

    2. Vérification d''identité : Fournissez-nous les documents d''identité et de
    domicile requis. Conformément à notre politique de sécurité, une vérification
    d''identité rigoureuse est obligatoire avant toute activation de compte.

    3. Évaluation de l''adéquation : Vous devrez répondre à un questionnaire MiFID
    II. Ce processus nous permet de vérifier que le produit est approprié au regard
    de vos connaissances financières, de votre expérience et de vos objectifs d''investissement.

    4. Validation et Signature : Une fois vos informations validées par notre service
    de conformité, nous vous soumettrons la convention d''ouverture de compte pour
    signature électronique sécurisée.

    5. Activation et Financement : Dès réception de la convention signée, nous activerons
    votre compte. Vous pourrez alors effectuer un premier virement depuis un compte
    bancaire dont vous êtes le titulaire pour commencer vos investissements.


    L''activation est confirmée lorsque vous recevez la notification d''ouverture
    de compte via votre messagerie sécurisée, vous donnant accès à l''interface de
    gestion de vos titres.


    Si vous hésitez encore sur le choix de l''enveloppe, nous vous suggérons de consulter
    le document Compte-titres ordinaire — face à un produit similaire de l''établissement
    pour comparer cette option avec le PEA.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 24ce1e63-0c95-51f5-a56a-e399dfdf3ef9
  title: Compte-titres ordinaire — grille tarifaire
  body: 'Ce document détaille l''ensemble des frais applicables au Compte-titres ordinaire.
    Les tarifs sont exprimés en euros (€).


    - Frais de courtage par ordre (achat ou vente) : 1,99 €

    - Frais de garde annuels : 0 €

    - Frais de transfert sortant : 15 € par ligne de titres


    Ces tarifs sont conçus pour être compétitifs et respectent strictement les plafonds
    réglementaires. Les frais de courtage couvrent l''exécution technique de l''ordre
    et le reporting réglementaire associé. L''absence de frais de garde souligne notre
    volonté de soutenir la stratégie d''investissement à long terme de nos clients.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: fee_schedule
