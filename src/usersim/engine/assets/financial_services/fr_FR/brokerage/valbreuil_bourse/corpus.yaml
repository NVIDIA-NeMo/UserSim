- id: 8c190ce1-cdc4-5c7f-8732-94288aa35a33
  title: Compte-titres ordinaire — protection contre la fraude et les opérations non
    autorisées
  body: "La protection de vos actifs est la priorité absolue de Valbreuil Bourse.\
    \ Pour le Compte-titres ordinaire, nous avons mis en place un protocole de sécurité\
    \ rigoureux visant à prévenir toute opération non autorisée.\n\nUne authentification\
    \ forte (MFA) est systématiquement requise pour toute action modifiant l'état\
    \ de votre compte ou pour tout retrait de fonds. Aucun changement de coordonnées\
    \ personnelles ou bancaires ne peut être effectué sans une validation sécurisée\
    \ et une vérification d'identité approfondie. Nous vous rappelons que Valbreuil\
    \ Bourse ne vous demandera jamais vos codes secrets ou vos mots de passe par e-mail\
    \ ou messagerie.\n\nEn cas de suspicion de fraude ou de compromission de vos identifiants,\
    \ l'institution procède immédiatement au gel conservatoire de vos comptes. Cette\
    \ mesure protectrice permet de sécuriser vos titres et vos liquidités le temps\
    \ que la direction des opérations et le responsable de la conformité analysent\
    \ l'incident.\n\nSur le plan réglementaire, bien que le capital investi sur les\
    \ marchés financiers ne soit jamais garanti, vos titres sont protégés par le Fonds\
    \ de Garantie des Dépôts et de Résolution (FGDR) jusqu'à un montant de 70 000\
    \ €. \n\nSi vous constatez une opération inhabituelle sur votre Compte-titres\
    \ ordinaire, nous vous demandons de nous en informer sans délai via notre messagerie\
    \ sécurisée. Un signalement rapide est essentiel pour limiter votre responsabilité\
    \ et nous permettre de prendre les mesures de blocage nécessaires."
  domain: brokerage_investing
  product_category: compte_titres
  document_type: security_advisory
  source_authority: official
