- id: 7601afb6-d98d-5c08-96db-00f16c0143f2
  title: Investissement programmé en ETF — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation du service d''Investissement
    programmé en ETF au sein de Valbreuil Bourse. Ce service permet l''automatisation
    des achats de fonds indiciels (ETF) selon une périodicité définie par le client.


    Obligations du Client :

    Le client s''engage à maintenir un solde suffisant sur son compte espèces pour
    couvrir l''exécution du programme. Le montant minimal par échéance programmée
    est fixé à 25 €. Tout versement inférieur à ce seuil ne pourra faire l''objet
    d''une automatisation. Le client est responsable de la vérification de son profil
    de risque, lequel doit être à jour pour garantir l''adéquation du produit avec
    ses objectifs d''investissement.


    Obligations de l''Institution :

    Valbreuil Bourse s''engage à exécuter les ordres d''achat conformément aux paramètres
    définis. Conformément à notre philosophie tarifaire, les frais par exécution de
    l''investissement programmé sont de 0 €. L''institution assure la protection des
    titres via le cadre réglementaire du FGDR, avec une couverture allant jusqu''à
    70 000 euros.


    Modification et Résiliation :

    Valbreuil Bourse se réserve le droit de modifier les présentes conditions, notamment
    pour se conformer aux évolutions des directives MiFID II ou aux exigences de l''AMF
    et de l''ACPR. Le client sera informé de toute modification substantielle via
    un préavis envoyé par messagerie sécurisée. Le client peut résilier son programme
    d''investissement à tout moment, sans frais supplémentaires, sous réserve du respect
    des délais de règlement-livraison des titres déjà acquis.


    Responsabilité :

    L''institution fournit une éducation financière mais ne délivre aucun conseil
    fiscal ou juridique personnalisé. Le capital investi n''est pas garanti et peut
    fluctuer selon les conditions de marché.


    Pour toute assistance sur la gestion d''un plan, veuillez vous référer à Investissement
    programmé en ETF — résilier, clôturer ou changer de formule.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: terms_conditions
  source_authority: official
