- id: 0e292f2f-f66a-518e-a941-7ffdca88bf69
  title: Compte-titres ordinaire — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos actifs financiers est la priorité absolue de Valbreuil
    Bourse. Pour protéger votre Compte-titres ordinaire, nous vous demandons d''appliquer
    rigoureusement les protocoles suivants :


    1. Authentification Forte : L''accès à vos positions et l''exécution de vos ordres
    requièrent une authentification forte. Ne partagez jamais vos codes d''accès,
    même avec une personne se présentant comme un collaborateur de l''institution.


    2. Vigilance face au Phishing : Valbreuil Bourse ne vous demandera jamais vos
    identifiants de connexion ou vos clés de sécurité par e-mail ou via un lien externe.
    Toute demande de modification de coordonnées nécessite une validation sécurisée
    et une vérification d''identité rigoureuse.


    3. Signalement Immédiat : Si vous constatez une transaction inhabituelle ou une
    tentative d''accès non autorisée, informez-nous sans délai. En cas de suspicion
    de fraude, nous gelerons conservatoirement votre compte pour protéger vos titres.


    Sachez que, conformément à la réglementation, vos titres sont protégés par le
    FGDR jusqu''à 70 000 €. Bien que le capital investi ne soit jamais garanti en
    raison des fluctuations du marché, la sécurité de la détention de vos actifs est
    assurée par nos protocoles de conformité MiFID II.


    Pour plus de détails sur la protection de vos actifs, vous pouvez consulter le
    document Compte-titres ordinaire — confidentialité et protection des données.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5b49142f-38c2-5b6a-9607-f43b8f80c802
  title: Compte-titres ordinaire — modification des conditions
  body: 'Les présentes conditions régissent l''ouverture et la gestion du Compte-titres
    ordinaire au sein de Valbreuil Bourse. L''institution se réserve le droit de modifier
    les conditions tarifaires et générales pour s''adapter aux évolutions réglementaires
    de l''AMF et de l''ACPR.


    Tarification et Obligations :

    Le client s''engage à acquitter les frais de courtage s''élevant à 1,99 € par
    ordre. Les droits de garde annuels sont actuellement fixés à 0 €. En cas de transfert
    de titres vers un autre établissement, des frais de transfert sortant de 15 €
    par ligne seront facturés.


    Procédure de Modification :

    Toute modification des tarifs ou des conditions générales fera l''objet d''une
    notification préalable via la messagerie sécurisée. Le client dispose d''un délai
    de préavis normé pour accepter ces modifications ou demander la clôture de son
    compte. Le refus des nouvelles conditions entraîne la résiliation du contrat selon
    les modalités de clôture en vigueur.


    Responsabilités :

    Valbreuil Bourse assure la sécurisation des actifs et le reporting réglementaire.
    L''institution ne délivre aucun conseil fiscal ou juridique personnalisé et ne
    garantit aucun rendement. Le client reconnaît que le capital investi n''est pas
    garanti, bien que les titres bénéficient de la protection du FGDR jusqu''à 70
    000 €.


    L''application de ces conditions est indissociable du processus d''évaluation
    de l''adéquation requis par MiFID II pour s''assurer que le produit correspond
    au profil de risque du client.'
