- id: 59a2ec45-dfc3-5ab5-9d29-ace91eb8dfc3
  title: PEA Jeune — offre de parrainage et de fidélité
  body: 'Valbreuil Bourse a le plaisir de présenter son programme de parrainage dédié
    aux investisseurs de demain. Cette offre, valable du 1er septembre 2024 au 31
    décembre 2024, permet à tout détenteur d''un PEA Jeune de bénéficier d''une prime
    de fidélité de 50 € pour chaque nouveau client parrainé ayant ouvert un compte
    et effectué un premier versement.


    Le PEA Jeune est l''instrument idéal pour débuter votre constitution de patrimoine,
    avec un plafond de versement de 20 000 €. En encourageant vos proches à adopter
    une gestion rigoureuse de leurs actifs, vous optimisez ensemble votre avenir financier.
    Nous vous rappelons que les frais de courtage applicables aux opérations sur ce
    support sont de 0,2 %.


    Cette offre est soumise aux conditions générales de parrainage de l''institution.
    Le crédit de la prime s''effectue sur le compte espèces associé au plan après
    validation de l''ouverture du compte du filleul. Nous vous invitons à consulter
    le document PEA Jeune — présentation pour plus de détails sur les caractéristiques
    de ce produit.'
