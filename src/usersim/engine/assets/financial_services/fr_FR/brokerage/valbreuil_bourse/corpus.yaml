- id: bafdec16-1f8a-5441-bc9c-4a996ae5d079
  title: PEA-PME — protection contre la fraude et les opérations non autorisées
  body: "L'investissement dans les petites et moyennes entreprises via le PEA-PME\
    \ peut attirer des tentatives de fraude sophistiquées, notamment des sollicitations\
    \ frauduleuses promettant des rendements exceptionnels sur des titres peu liquides.\
    \ Valbreuil Bourse met en œuvre des protocoles de sécurité rigoureux pour protéger\
    \ vos actifs.\n\nL'institution applique une authentification forte (SCA) et une\
    \ vérification d'identité stricte avant toute action modifiant l'état de votre\
    \ compte ou tout retrait de fonds. Soyez vigilants : Valbreuil Bourse ne vous\
    \ demandera jamais vos codes d'accès, vos mots de passe ou vos identifiants de\
    \ sécurité par e-mail, SMS ou appel téléphonique. Tout changement de coordonnées\
    \ nécessite une validation sécurisée et ne peut être effectué sans ce processus.\n\
    \nEn cas de suspicion de fraude, nos services gèlent conservatoirement les comptes\
    \ concernés afin de protéger les actifs du client. Si vous constatez une opération\
    \ non autorisée, vous devez nous en informer immédiatement via la messagerie sécurisée.\
    \ \n\nIl est essentiel de rappeler que si le capital investi n'est jamais garanti,\
    \ vos titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution\
    \ (FGDR) jusqu'à un montant de 70 000 €. Cette protection institutionnelle complète\
    \ nos mesures de sécurité opérationnelles pour garantir l'intégrité de votre patrimoine\
    \ financier."
  domain: brokerage_investing
  product_category: pea_pme
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1b86a8f2-9ac3-5e61-a53f-57ef117324f1
  title: PEA-PME — conditions générales
  body: 'Les présentes conditions générales régissent l''ouverture et la gestion du
    PEA-PME au sein de Valbreuil Bourse. L''utilisation de ce produit implique l''acceptation
    sans réserve des cadres réglementaires de l''AMF et de l''ACPR, conformément à
    la directive MiFID II.


    Obligations de versement et plafonds : Le titulaire s''engage à respecter le plafond
    de versement réglementaire, lequel est fixé à 225 000 € pour le PEA-PME. Tout
    versement excédant ce montant sera refusé par l''institution.


    Structure tarifaire : Valbreuil Bourse applique un taux de frais de courtage de
    0,2 % sur chaque ordre d''exécution. Ces frais couvrent la sécurisation des actifs
    et le reporting réglementaire. En cas de transfert sortant du portefeuille vers
    un autre établissement, les frais sont plafonnés à 150 €.


    Évaluation et conformité : L''ouverture du compte est conditionnée par une évaluation
    de l''adéquation et du caractère approprié, visant à s''assurer que le produit
    correspond aux connaissances et objectifs du client. L''institution se réserve
    le droit de geler le compte en cas de suspicion de fraude.


    Fin du contrat : La clôture du compte peut être demandée à tout moment. Le délai
    de résolution pour les réclamations liées à la clôture suit un processus normé
    avec accusé de réception immédiat. Les titres sont protégés par le FGDR jusqu''à
    70 000 €.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 74d128eb-eaf1-529d-bdd7-c0e40eb04442
  title: PEA-PME — pour qui et pour quels usages
  body: "Le PEA-PME est une enveloppe fiscale optimisée, conçue spécifiquement pour\
    \ les investisseurs avertis et les jeunes actifs souhaitant soutenir la croissance\
    \ des petites et moyennes entreprises européennes tout en bénéficiant d'un cadre\
    \ fiscal avantageux.\n\nCe produit s'adresse particulièrement aux résidents français\
    \ qui : \n- Souhaitent diversifier leur portefeuille avec des titres de PME.\n\
    - Recherchent un plafond d'investissement plus élevé que le PEA classique, avec\
    \ une limite de versement portée à 225 000 €.\n- Privilégient la rigueur réglementaire\
    \ et la transparence des coûts.\n\nCaractéristiques financières et tarifs :\n\
    - Plafond de versement : 225 000 €.\n- Frais de courtage : 0,2 % par ordre, permettant\
    \ une gestion compétitive et transparente.\n- Frais de transfert sortant : plafonnés\
    \ à 150 € pour faciliter la mobilité des actifs.\n\nL'usage du PEA-PME permet\
    \ d'optimiser la fiscalité des gains à long terme, sous réserve du respect des\
    \ conditions de détention. Valbreuil Bourse assure l'éducation financière nécessaire\
    \ pour comprendre la pertinence de ce produit, tout en rappelant que le capital\
    \ investi n'est pas garanti. La protection des actifs est assurée par le FGDR\
    \ jusqu'à 70 000 €."
  domain: brokerage_investing
  product_category: pea_pme
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 2b4750da-b78f-5074-849d-1294cbd07be9
  title: 'PEA-PME — frais de courtage en pourcentage de l''ordre : explications'
  body: "Question : Comment sont calculés les frais de courtage sur mes opérations\
    \ PEA-PME ?\n\nRéponse : Valbreuil Bourse applique une tarification transparente\
    \ et proportionnelle. Pour chaque ordre d'achat ou de vente exécuté sur votre\
    \ PEA-PME, des frais de courtage de 0,2 % sont prélevés sur le montant total de\
    \ l'opération. \n\nPar exemple, pour un ordre d'investissement de 10 000 €, les\
    \ frais s'élèveront à 20 €. Ce taux unique assure que les coûts restent proportionnels\
    \ à la taille de vos investissements tout en couvrant la sécurisation des actifs\
    \ et les obligations de reporting réglementaire. \n\nPour plus de détails sur\
    \ l'application de ces tarifs, vous pouvez consulter le document PEA-PME — calcul\
    \ et application des taux."
  domain: brokerage_investing
  product_category: pea_pme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f2ad1ca2-488b-5d2f-8183-9de7a85c8e2d
  title: PEA-PME — résilier, clôturer ou changer de formule
  body: 'La clôture ou le transfert d''un PEA-PME est une procédure encadrée pour
    garantir la protection de vos titres et la conformité fiscale.


    Avant de commencer :

    Assurez-vous que toutes vos opérations en cours (règlement-livraison) sont finalisées.
    Identifiez si vous souhaitez clôturer définitivement le compte ou transférer vos
    titres vers un autre établissement.


    Étapes de résolution :

    1. Demandez la clôture ou le transfert de votre compte via la messagerie sécurisée
    en précisant vos intentions.

    2. Nous vous transmettrons la liste des titres détenus et le solde espèces actuel
    pour validation.

    3. Si vous optez pour un transfert vers un autre courtier, fournissez-nous les
    coordonnées complètes de l''établissement réceptionnaire. Notez que les frais
    de transfert sortant sont plafonnés à 150 €.

    4. Nous procéderons au transfert des titres ou au virement des fonds vers votre
    compte de référence après vérification d''identité rigoureuse.

    5. Vous recevrez une confirmation définitive de clôture ainsi qu''un dernier relevé
    fiscal.


    Une fois la clôture actée, le compte ne peut plus être réactivé. Si vous souhaitez
    modifier votre stratégie d''investissement sans clôturer le compte, nous vous
    invitons à consulter PEA-PME — présentation pour explorer les options disponibles.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: e68cad93-6db2-5b23-9108-ed6eab6b4c5a
  title: PEA-PME — frais ou montant inattendu
  body: 'Symptôme : Le client constate un solde espèces inférieur au montant attendu
    après l''exécution d''un ordre, ou observe des frais qu''il juge anormaux.


    Causes probables :

    1. Application automatique des frais de courtage de 0,2 % sur le volume de l''ordre.

    2. Frais de transfert sortant appliqués lors d''un mouvement de titres, dans la
    limite du plafond de 150 €.

    3. Erreur de calcul du client sur le montant net après frais.


    Procédure de vérification :

    1. Vérifier le montant brut de l''ordre exécuté dans l''historique des opérations.

    2. Multiplier ce montant par 0,2 % pour confirmer si le montant prélevé correspond
    aux frais de courtage standard.

    3. Vérifier si une opération de transfert a eu lieu, entraînant des frais plafonnés
    à 150 €.


    Résolution :

    - Si le calcul est correct, expliquer pédagogiquement au client la structure tarifaire
    proportionnelle de Valbreuil Bourse.

    - Si un écart persiste malgré ces vérifications, nous ouvrirons un dossier de
    réclamation avec accusé de réception immédiat.


    Escalade :

    Les demandes complexes ou les contestations de frais non résolues sont escaladées
    vers la direction des opérations pour un audit détaillé des transactions.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 49ad3e83-adcc-5f7c-8946-ab894c8e64d4
  title: PEA-PME — justificatifs à fournir
  body: "L'ouverture d'un PEA-PME requiert la validation de plusieurs critères d'éligibilité.\
    \ Veuillez fournir les documents suivants pour permettre l'activation de votre\
    \ compte :\n\n- Pièce d'identité officielle en cours de validité (CNI ou Passeport)\
    \ → Validation de l'identité et lutte contre le blanchiment (KYC).\n\
    - Justificatif de domicile de moins de trois mois → Confirmation de\
    \ la résidence fiscale française.\n- Questionnaire de profil d'investisseur → Réalisation de l'évaluation de l'adéquation MiFID II.\n- Relevé d'Identité\
    \ Bancaire (RIB) → Configuration des flux de versement et de retrait.\n\
    \nL'absence de l'un de ces documents ou une discordance dans les informations\
    \ fournies entraînera le refus d'ouverture du compte jusqu'à régularisation. Une\
    \ fois tous les justificatifs validés, le compte est activé avec un plafond de\
    \ versement de 225 000 €."
