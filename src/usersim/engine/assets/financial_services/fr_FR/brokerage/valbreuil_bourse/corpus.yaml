- id: 26856408-4e36-52f4-a99f-1d4c884ac098
  title: Investissement programmé en ETF — confidentialité et protection des données
  body: 'Conformément aux réglementations générales sur la protection des données
    (RGPD) et aux cadres de l''AMF et de l''ACPR, Valbreuil Bourse assure une gestion
    rigoureuse de vos informations personnelles dans le cadre de l''Investissement
    programmé en ETF.


    Les données collectées lors de l''ouverture de votre plan et lors de l''évaluation
    de l''adéquation (MiFID II) sont utilisées exclusivement pour vérifier la pertinence
    des produits financiers proposés et pour garantir la sécurité de vos transactions.
    Vos informations sont traitées avec la plus haute confidentialité et ne sont jamais
    cédées à des tiers à des fins commerciales.


    Nous vous rappelons que l''Investissement programmé en ETF implique l''exposition
    aux risques du marché ; le capital investi n''est donc jamais garanti. Toutefois,
    pour votre protection, les titres sont couverts par le Fonds de Garantie des Dépôts
    et de Résolution (FGDR) jusqu''à un montant de 70 000 €.


    L''établissement s''engage à une transparence totale sur les coûts. Actuellement,
    les frais d''exécution sont de 0 € et le montant minimal de versement est de 25
    €. Toute modification de ces paramètres ou de la politique de confidentialité
    vous sera notifiée via votre messagerie sécurisée.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: disclosure
  source_authority: official
  placeholder: true
