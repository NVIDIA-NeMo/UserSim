- id: bb1d43ce-f590-5857-9de3-3f00cbe313ef
  title: Compte-titres ordinaire — prise en main pas à pas
  body: 'Ce document est destiné aux agents de support pour accompagner les clients
    dans l''activation de leur Compte-titres ordinaire. Ce produit est l''option la
    plus flexible de notre gamme, sans plafond de versement et permettant d''investir
    sur les marchés mondiaux.


    Processus d''accompagnement :


    1. Vérification d''identité et Éligibilité : Accompagnez le client dans la transmission
    des justificatifs nécessaires. Une vérification d''identité rigoureuse est obligatoire
    avant toute action sur le compte. Vérifiez que le client a complété l''évaluation
    de l''adéquation (MiFID II) pour confirmer que le produit est approprié à son
    profil.


    2. Financement du compte : Guidez le client pour effectuer son premier dépôt de
    fonds. Précisez que contrairement aux plans d''épargne, le compte-titres n''est
    pas soumis à un plafond de versement.


    3. Exécution du premier ordre : Expliquez au client que chaque transaction entraînera
    des frais de courtage de 1,99 €. Précisez que les titres seront crédités après
    le délai conventionnel du règlement-livraison.


    4. Gestion des frais : Informez le client que les droits de garde annuels sont
    de 0 €, ce qui rend ce produit particulièrement attractif pour la détention à
    long terme.


    Points de vigilance :

    - Rappelez que le capital investi n''est pas garanti.

    - Mentionnez la protection du FGDR jusqu''à 70 000 €.

    - Précisez qu''aucun conseil fiscal personnalisé n''est fourni par l''agent.'
