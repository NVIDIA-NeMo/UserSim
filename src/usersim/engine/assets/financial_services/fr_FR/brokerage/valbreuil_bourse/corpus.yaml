  institution_id: valbreuil_bourse
- id: 6adfc01d-2b14-513f-9d06-17262c646711
  title: Investissement programmé en ETF — pour qui et pour quels usages
  body: "L'Investissement programmé en ETF est une solution d'investissement automatisée\
    \ conçue pour les investisseurs qui souhaitent construire un patrimoine sur le\
    \ long terme tout en minimisant l'impact de la volatilité des marchés. \n\nCe\
    \ produit s'adresse prioritairement aux profils suivants :\n- Les jeunes actifs\
    \ : souhaitant instaurer une discipline d'épargne régulière sans nécessiter une\
    \ expertise technique approfondie.\n- Les investisseurs avertis : cherchant à\
    \ lisser leur prix d'entrée (méthode du Dollar Cost Averaging) sur des indices\
    \ mondiaux.\n- Les épargnants prudents : désirant diversifier leur portefeuille\
    \ via des ETF tout en gardant un contrôle sur le montant investi.\n\nUsages et\
    \ Avantages :\nL'objectif principal est de lisser le risque. En investissant une\
    \ somme fixe à intervalles réguliers, vous achetez plus de parts lorsque les cours\
    \ baissent et moins lorsqu'ils montent, optimisant ainsi le coût moyen d'acquisition\
    \ de vos titres.\n\nCaractéristiques clés :\n- Accessibilité : Le programme est\
    \ accessible dès un montant minimal de 25 € par échéance.\n- Transparence et Coût\
    \ : Afin de favoriser l'investissement régulier, Valbreuil Bourse applique des\
    \ frais d'exécution de 0 € sur chaque transaction programmée.\n- Simplicité :\
    \ Une fois le plan configuré, l'investissement s'effectue automatiquement sans\
    \ intervention manuelle.\n\nIl est important de noter que ce service s'inscrit\
    \ dans une démarche de gestion passive. Bien que nous vérifiions la pertinence\
    \ du produit selon votre profil de risque, nous ne garantissons aucun rendement.\
    \ Vos actifs sont néanmoins protégés par le FGDR jusqu'à 70 000 euros.\n\nPour\
    \ découvrir comment mettre en place votre stratégie, nous vous invitons à consulter\
    \ Investissement programmé en ETF — souscrire et activer."
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: product_sheet
  source_authority: official
