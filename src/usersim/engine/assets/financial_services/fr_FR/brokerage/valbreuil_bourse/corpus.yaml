- id: ff2f8a6d-21de-509b-a3aa-cf8d2e7b0523
  title: PEA Jeune — bonnes pratiques de sécurité du compte
  body: 'La protection de vos actifs est la priorité absolue de Valbreuil Bourse.
    Pour les détenteurs d''un PEA Jeune, la vigilance est primordiale afin de garantir
    l''intégrité de vos investissements et la confidentialité de vos données.


    Nous vous rappelons qu''une authentification forte est obligatoire pour toute
    action modifiant l''état de votre compte ou tout retrait de fonds. Nous vous recommandons
    d''utiliser des mots de passe complexes et uniques, et de ne jamais partager vos
    codes d''accès. Soyez extrêmement vigilants face aux tentatives de hameçonnage
    (phishing) : Valbreuil Bourse ne vous demandera jamais vos identifiants de connexion
    ou vos codes secrets par e-mail ou par messagerie non sécurisée.


    En cas de suspicion de fraude ou de compromission de vos accès, vous devez nous
    en informer immédiatement. Conformément à notre protocole de sécurité, vos comptes
    seront gelés conservatoirement pour protéger vos actifs jusqu''à résolution complète
    de l''incident. Sachez que, bien que le capital investi ne soit jamais garanti,
    vos titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) jusqu''à un montant de 70 000 €.


    Pour toute modification de vos coordonnées, une validation sécurisée et une vérification
    d''identité rigoureuse sont systématiquement exigées avant toute application.
    Cette procédure stricte vise à empêcher toute usurpation d''identité visant à
    détourner vos fonds. Nous vous conseillons de consulter régulièrement vos relevés
    pour détecter toute opération inhabituelle. Pour une approche complète des risques,
    veuillez vous référer au document PEA Jeune — informations sur les risques.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 59708155-e239-595c-aa34-e1f71c159a87
  title: PEA Jeune — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales applicables au PEA Jeune au sein de Valbreuil Bourse. L''institution
    se réserve le droit de modifier les termes du contrat pour s''adapter aux évolutions
    réglementaires de l''AMF et de l''ACPR, ou pour optimiser la qualité de ses services.


    Les modifications peuvent porter notamment sur la structure des frais. Actuellement,
    le taux des frais de courtage est fixé à 0,2 % par opération. Toute modification
    de ce taux fera l''objet d''une notification préalable via votre messagerie sécurisée
    dans un délai de 30 jours ouvrés avant son entrée en vigueur. De même, le plafond
    de versement, strictement limité à 20 000 € conformément à la réglementation fiscale
    française, ne peut être modifié unilatéralement par le client.


    L''acceptation des nouvelles conditions s''effectue par la poursuite de l''utilisation
    du compte après la date d''entrée en vigueur notifiée. En cas de désaccord avec
    les nouvelles modalités, vous disposez de la faculté de clôturer votre compte
    ou de demander le transfert de vos titres vers un autre établissement, selon les
    modalités décrites dans PEA Jeune — résilier, clôturer ou changer de formule.


    L''institution s''engage à maintenir une transparence totale sur les coûts. Le
    respect des plafonds réglementaires est une condition sine qua non du maintien
    du statut fiscal du plan. Tout versement excédant le plafond de 20 000 € sera
    refusé ou fera l''objet d''un rejet automatique pour préserver l''éligibilité
    fiscale de votre enveloppe.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 01774aa1-9063-546a-88d9-ae93252bb8b2
  title: PEA Jeune — prise en main pas à pas
  body: 'Ce guide est destiné aux agents d''assistance pour accompagner les clients
    dans l''ouverture et la première utilisation d''un PEA Jeune. Le PEA Jeune est
    une enveloppe fiscale optimisée pour les jeunes investisseurs, limitée à un plafond
    de versement de 20 000 €.


    Procédure d''accompagnement :


    1. Vérification de l''éligibilité : Assurez-vous que le client a au minimum 18
    ans et au maximum 25 ans. Le client doit impérativement être rattaché au foyer
    fiscal de ses parents pour bénéficier de ce produit spécifique.

    2. Collecte des justificatifs : Demandez une pièce d''identité valide et un justificatif
    de domicile. Le document attestant du rattachement fiscal est indispensable pour
    valider l''ouverture.

    3. Ouverture du compte : Une fois l''identité vérifiée, l''ouverture est initiée.
    Informez le client que le capital investi n''est pas garanti, mais que les titres
    sont protégés par le FGDR jusqu''à 70 000 €.

    4. Premier versement : Guidez le client pour effectuer son premier dépôt. Rappelez-lui
    que le plafond total des versements ne doit pas excéder 20 000 €.

    5. Explication des frais : Précisez clairement que chaque ordre de bourse exécuté
    sur le plan sera soumis à des frais de courtage de 0,2 %.


    Points d''attention :

    - L''évaluation de l''adéquation (MiFID II) doit être réalisée avant tout investissement
    pour s''assurer que les produits choisis correspondent au profil de risque du
    client.

    - Aucun conseil fiscal personnalisé n''est délivré ; l''agent doit se limiter
    à l''éducation financière et à la présentation des caractéristiques du produit.


    Pour plus de précisions sur les critères d''accès, se référer à PEA Jeune — conditions
    d''éligibilité.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c824d608-9bbe-5ace-aa31-4a3832b51f63
  title: 'PEA Jeune — âge minimal : explications'
  body: 'L''âge minimal requis pour l''ouverture d''un PEA Jeune est-il strictement
    appliqué ?


    Oui, conformément à la réglementation fiscale en vigueur, vous devez avoir atteint
    l''âge de 18 ans pour pouvoir souscrire à un PEA Jeune. Ce produit est spécifiquement
    conçu pour initier les jeunes actifs à l''investissement boursier tout en bénéficiant
    d''un cadre fiscal avantageux.


    Quelles sont les conditions liées à l''âge pour maintenir ce compte ?


    Le PEA Jeune est accessible aux personnes âgées de 18 ans jusqu''à 25 ans, à condition
    d''être rattaché au foyer fiscal de leurs parents. Au-delà de 25 ans, ou en cas
    de perte du rattachement fiscal, le plan peut être transformé en PEA classique.
    Nous vous invitons à consulter PEA Jeune — présentation pour comprendre l''articulation
    entre les différentes enveloppes fiscales.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 26a0079b-1770-56ac-89c0-2a4c221dec20
  title: PEA Jeune — effectuer une modification
  body: 'Ce guide vous accompagne dans la procédure de modification des informations
    liées à votre PEA Jeune (changement de coordonnées, mise à jour du profil de risque
    ou modification du bénéficiaire).


    Éléments requis avant de commencer :

    - Votre pièce d''identité en cours de validité.

    - Le document justificatif correspondant à la modification demandée (ex: nouveau
    justificatif de domicile).


    Étapes de la modification :


    1. Demande de modification : Exprimez votre volonté de modifier une information
    spécifique via notre messagerie sécurisée. Précisez clairement la nature du changement.

    2. Vérification d''identité : Nous vous demanderons de confirmer votre identité
    via notre système d''authentification forte. C''est une étape obligatoire pour
    toute action modifiant l''état du compte.

    3. Transmission des justificatifs : Transmettez-nous les documents justificatifs
    requis via le canal sécurisé. Nous procéderons à une vérification rigoureuse de
    ces pièces.

    4. Validation et application : Une fois les documents validés, nous effectuerons
    la modification dans nos registres. Vous recevrez une notification de confirmation
    par e-mail et via votre messagerie sécurisée.


    Une fois la modification effectuée, vous pourrez constater le changement dans
    vos informations de compte. Pour toute question relative aux frais liés aux opérations
    sur votre compte, veuillez consulter PEA Jeune — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ba2cf9df-ac28-542a-b973-7661ec207843
  title: PEA Jeune — problèmes d'accès ou de connexion
  body: 'Si vous rencontrez des difficultés pour accéder à votre compte PEA Jeune,
    veuillez suivre ce protocole de résolution.


    Symptômes courants :

    - Échec de l''authentification malgré des identifiants corrects.

    - Message indiquant que le compte est « gelé » ou « restreint ».

    - Impossibilité de valider l''authentification forte.


    Causes probables et solutions :


    1. Identifiants incorrects ou compte verrouillé : Vérifiez que la touche Majuscule
    n''est pas activée par erreur. Si vous avez saisi trois fois un mot de passe erroné,
    votre compte est verrouillé par sécurité. Demandez-nous une réinitialisation de
    vos accès via votre messagerie sécurisée.

    2. Compte gelé conservatoirement : Si Valbreuil Bourse a détecté une activité
    inhabituelle ou une suspicion de fraude, nous gelons vos comptes pour protéger
    vos actifs. Dans ce cas, vous devrez fournir des justificatifs d''identité supplémentaires
    pour lever la restriction.

    3. Problème d''authentification forte : Assurez-vous que votre appareil de confiance
    est correctement synchronisé et que vos notifications sont activées. Si le code
    de validation ne parvient pas, demandez-nous l''envoi d''un code alternatif.


    En cas d''échec de ces étapes, nous escaladerons votre demande vers la direction
    des opérations pour une analyse technique approfondie. Vous recevrez un accusé
    de réception immédiat et une résolution sous un délai normé selon la complexité
    du problème. Pour plus d''informations sur la sécurisation de vos actifs, consultez
    PEA Jeune — bonnes pratiques de sécurité du compte.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 84f06e7f-83fb-599d-a944-90c73f18cb46
  title: PEA Jeune — niveaux d'accès
  body: 'Ce tableau définit les conditions d''accès au PEA Jeune pour l''assistance
    client. L''ouverture du compte est conditionnée par la réunion cumulative de tous
    les critères suivants :


    | Critère | Seuil / Condition | Résultat |

    | :--- | :--- | :--- |

    | Âge minimal | 18 ans | Éligible (si autres critères réunis) |

    | Âge maximal | 25 ans | Éligible (si autres critères réunis) |

    | Situation fiscale | Rattachement au foyer fiscal des parents | Éligible (si
    autres critères réunis) |

    | Résidence | Résident français | Éligible (si autres critères réunis) |


    Si l''un de ces critères n''est pas respecté (par exemple, un âge de 26 ans ou
    un non-rattachement fiscal), le client ne peut pas souscrire à un PEA Jeune et
    doit être orienté vers un PEA classique. Rappelez au client que le plafond de
    versement pour ce produit est strictement limité à 20 000 €. Pour les détails
    sur les pièces à fournir, voir PEA Jeune — justificatifs à fournir.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 775db664-2761-57de-8693-e6cb81c208d9
  title: PEA Jeune — choisir entre les formules
  body: 'Le choix entre un PEA Jeune et un PEA classique dépend principalement de
    votre situation fiscale et de vos capacités de versement.


    Le PEA Jeune s''adresse aux investisseurs âgés de 18 à 25 ans, rattachés au foyer
    fiscal de leurs parents. Son avantage principal réside dans son accessibilité
    pour les débutants, avec un plafond de versement limité à 20 000 €. Les frais
    de courtage y sont compétitifs, s''élevant à 0,2 % par opération.


    À l''inverse, le PEA classique est accessible sans condition d''âge et offre une
    capacité d''investissement beaucoup plus large, avec un plafond de versement porté
    à 150 000 €. C''est la solution privilégiée pour ceux qui ne sont plus rattachés
    fiscalement ou qui souhaitent investir des sommes supérieures à 20 000 €.


    En résumé :

    - Choisissez le PEA Jeune si vous avez entre 18 et 25 ans, que vous êtes rattaché
    fiscalement et que vos versements totaux ne dépasseront pas 20 000 €.

    - Choisissez le PEA classique si vous avez plus de 25 ans, si vous êtes autonome
    fiscalement ou si vous visez un investissement supérieur au plafond du plan jeune.


    Pour plus de détails, consultez PEA Jeune — présentation.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 84c00cca-7e5f-5b64-99fd-da58a72cf492
  title: PEA Jeune — confidentialité et protection des données
  body: 'Valbreuil Bourse s''engage à traiter vos données personnelles avec la plus
    grande rigueur, conformément au Règlement Général sur la Protection des Données
    (RGPD) et aux directives de l''AMF et de l''ACPR.


    Dans le cadre de la gestion de votre PEA Jeune, nous collectons les informations
    nécessaires à la vérification de votre identité et de votre éligibilité (âge compris
    entre 18 et 25 ans, attestation de rattachement fiscal). Ces données sont traitées
    pour répondre à nos obligations légales de lutte contre le blanchiment et le financement
    du terrorisme (LCB-FT).


    Vos données sont conservées pendant la durée de notre relation contractuelle et
    pour la durée légale de prescription après la clôture de votre compte. Nous appliquons
    des protocoles de sécurité stricts, incluant l''authentification forte, pour empêcher
    tout accès non autorisé. Le capital investi sur votre plan n''est jamais garanti,
    toutefois, vos titres sont protégés par le FGDR jusqu''à 70 000 € en cas de défaillance
    de l''établissement.


    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Toute demande de modification de vos coordonnées doit faire
    l''objet d''une validation sécurisée et d''une vérification d''identité rigoureuse
    avant application. Nous ne vendons jamais vos données à des tiers. Pour toute
    question sur la gestion des risques liés à vos placements, nous vous invitons
    à consulter PEA Jeune — informations sur les risques.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: d2f104f3-cabf-5b83-b2fd-4eb8dab53710
  title: PEA Jeune — reconnaître les arnaques visant ce produit
  body: 'Le PEA Jeune, par sa nature d''instrument d''initiation pour les investisseurs
    de 18 à 25 ans, peut attirer des acteurs malveillants exploitant le manque d''expérience
    financière de certains usagers. Valbreuil Bourse tient à vous mettre en garde
    contre des schémas frauduleux récurrents.


    Reconnaître les signes d''alerte

    Une tentative d''escroquerie se manifeste souvent par les caractéristiques suivantes
    :

    - La promesse de rendements garantis : Nous vous rappelons qu''en bourse, le capital
    investi n''est jamais garanti. Toute offre promettant un gain certain sans risque
    est systématiquement frauduleuse.

    - L''urgence artificielle : Un interlocuteur vous presse de verser des fonds ou
    de modifier vos coordonnées pour saisir une « opportunité unique ».

    - La demande de secrets : Valbreuil Bourse ne vous demandera jamais vos codes
    d''accès, vos mots de passe ou vos clés d''authentification forte par e-mail ou
    via une messagerie tierce.


    Ce que Valbreuil Bourse ne fera jamais

    L''institution ne vous sollicitera jamais pour effectuer un transfert de fonds
    vers un compte tiers au nom d''une personne physique pour « débloquer » vos gains
    ou valider l''ouverture de votre enveloppe fiscale. Toute demande de modification
    de vos coordonnées bancaires nécessite une validation sécurisée et rigoureuse
    avant toute exécution.


    Mesures de protection

    Sachez que vos titres sont protégés par le FGDR jusqu''à 70 000 euros, ce qui
    constitue une sécurité réglementaire majeure. Toutefois, cette garantie ne couvre
    pas les pertes liées à des décisions d''investissement ou à des transferts de
    fonds volontaires vers des entités frauduleuses.


    Action immédiate en cas de doute

    Si vous constatez une activité inhabituelle ou si vous avez communiqué des informations
    sensibles, veuillez nous en informer sans délai via notre messagerie sécurisée.
    En cas de suspicion de fraude, Valbreuil Bourse gèlera conservatoirement vos comptes
    pour protéger vos actifs.


    Pour approfondir vos connaissances sur la sécurisation de vos actifs, nous vous
    invitons à consulter le document PEA Jeune — protection contre la fraude et les
    opérations non autorisées.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 152506dc-4f4f-5dfd-b2d7-ea24f752db48
  title: PEA Jeune — plafonds, restrictions et cas particuliers
  body: 'Ce document définit les paramètres opérationnels et les limites réglementaires
    du PEA Jeune au sein de Valbreuil Bourse. L''agent doit s''assurer que le client
    respecte strictement ces critères avant toute validation d''opération.


    Conditions d''éligibilité et restrictions d''âge

    Le PEA Jeune est strictement réservé aux personnes physiques répondant aux critères
    suivants :

    - Âge minimal : 18 ans.

    - Âge maximal : 25 ans.

    - Situation fiscale : Le titulaire doit être rattaché au foyer fiscal de ses parents
    au moment de l''ouverture.


    Limites de versement

    Le plafond de versement pour le PEA Jeune est fixé à 20 000 €. Ce montant représente
    la limite maximale des versements effectués sur le compte. Les plus-values générées
    par les investissements n''augmentent pas ce plafond et ne sont donc pas comptabilisées
    dans la limite des 20 000 €.


    Structure des coûts

    L''institution applique une politique de transparence tarifaire. Les frais de
    courtage pour les ordres exécutés sur ce support sont de 0,2 % du montant de l''opération.
    Ces frais couvrent la sécurisation des actifs et le reporting réglementaire requis
    par les autorités.


    Cas particuliers et évolutions

    - Dépassement du plafond : Tout versement entraînant un solde supérieur au plafond
    de 20 000 € sera refusé par nos systèmes.

    - Atteinte de l''âge limite : Le maintien du PEA Jeune est possible après 25 ans,
    mais tout nouveau versement après cet âge est interdit. Le compte peut alors être
    transformé en PEA classique.


    L''agent doit systématiquement vérifier l''adéquation du produit avec le profil
    de risque du client, conformément aux normes MiFID II, tout en rappelant que le
    capital investi n''est pas garanti.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 11607b7e-c0ce-5a95-9ec3-19d59945d096
  title: 'PEA Jeune — âge maximal : explications'
  body: 'Question : Que se passe-t-il lorsque j''atteins l''âge de 25 ans ?


    Réponse : Le PEA Jeune est accessible jusqu''à l''âge de 25 ans. Une fois ce seuil
    atteint, vous ne pouvez plus effectuer de nouveaux versements sur ce plan. Toutefois,
    vous conservez la pleine propriété de vos titres et les gains accumulés restent
    disponibles.


    Question : Puis-je transformer mon PEA Jeune en PEA classique après mes 25 ans
    ?


    Réponse : Oui, il est tout à fait possible de convertir votre enveloppe en PEA
    standard. Cela vous permettra d''augmenter votre plafond de versement, lequel
    passera alors à 150 000 €. Cette transition permet de maintenir l''antériorité
    fiscale de votre plan, un avantage crucial pour l''optimisation de vos impôts
    à long terme.


    Pour plus de détails sur les conditions de transition, vous pouvez consulter le
    document PEA Jeune — conditions d''éligibilité.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: dbffc4a2-2d9d-5116-a545-7df5491424ae
  title: PEA Jeune — consulter le suivi ou l'historique
  body: 'Afin de maintenir une transparence totale sur vos investissements, Valbreuil
    Bourse met à votre disposition un suivi détaillé de vos positions et de vos transactions.
    Voici la procédure pour consulter votre historique.


    Prérequis

    Vous devez disposer de vos accès sécurisés et avoir complété l''authentification
    forte obligatoire pour accéder aux données financières de votre compte.


    Étapes de consultation

    1. Formulez votre demande : Indiquez-nous via la messagerie sécurisée que vous
    souhaitez obtenir l''état actuel de vos positions ou l''historique de vos transactions
    sur une période donnée.

    2. Précisez la période : Pour l''historique, précisez la date de début et la date
    de fin souhaitées (par exemple, du 1er janvier au 31 mars).

    3. Validation d''identité : Si la session n''est pas active, nous vous demanderons
    de valider votre identité via le protocole d''authentification forte.

    4. Réception des documents : Nous vous transmettrons un relevé détaillé sous forme
    de document numérique sécurisé.


    Interprétation des résultats

    Le document reçu comprendra :

    - La valeur liquidative de votre portefeuille au jour J.

    - Le détail des lignes de titres détenues.

    - L''historique des ordres exécutés avec le détail des frais de courtage appliqués,
    soit 0,2 % par transaction.

    - Le montant total des versements effectués par rapport au plafond de 20 000 €.


    Confirmation de succès

    L''opération est réussie lorsque vous recevez la notification de mise à disposition
    du document dans votre espace sécurisé. En cas de doute sur une ligne spécifique,
    vous pouvez nous solliciter pour obtenir une explication pédagogique sur le titre
    concerné.


    Pour comprendre la différence entre l''exécution d''un ordre et le transfert effectif
    des titres, nous vous suggérons de consulter la définition du terme « Règlement-livraison
    » dans notre glossaire.'
