- id: 97482800-b27e-5c18-90a2-d73729fab231
  title: PEA Jeune — protection contre la fraude et les opérations non autorisées
  body: 'La sécurité de vos actifs est la priorité absolue de Valbreuil Bourse. Pour
    le PEA Jeune, nous avons mis en place un protocole de sécurité rigoureux afin
    de prévenir toute opération non autorisée et de protéger vos investissements contre
    la fraude.


    L''accès à votre compte et toute action modifiant l''état de vos avoirs, telle
    qu''un retrait de fonds ou un changement de coordonnées, requiert obligatoirement
    une authentification forte et une vérification d''identité approfondie. Soyez
    vigilants : Valbreuil Bourse ne vous demandera jamais vos codes secrets, vos mots
    de passe ou vos clés de sécurité via un e-mail ou un message non sécurisé.


    En cas de suspicion de fraude ou de compromission de vos accès, nous procédons
    immédiatement au gel conservatoire de vos comptes. Cette mesure restrictive est
    nécessaire pour protéger vos titres et vos liquidités jusqu''à la résolution complète
    de l''incident. En tant que courtier numérique premium, nous appliquons une tolérance
    zéro face aux tentatives d''intrusion.


    Sachez que, bien que le capital investi sur les marchés financiers ne soit jamais
    garanti, vos titres bénéficient de la protection du Fonds de Garantie des Dépôts
    et de Résolution (FGDR) jusqu''à un montant de 70 000 €. Cette garantie constitue
    un filet de sécurité institutionnel essentiel pour tout investisseur averti.


    Si vous constatez une opération inhabituelle ou si vous recevez une sollicitation
    suspecte mentionnant notre institution, nous vous invitons à nous le signaler
    sans délai via notre messagerie sécurisée. Une réclamation rapide permet d''accélérer
    le processus de sécurisation de vos actifs et de limiter votre responsabilité
    financière.


    Pour plus de détails sur la nature des risques liés aux investissements, nous
    vous invitons à consulter le document PEA Jeune — informations sur les risques.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: e09c3d0a-57be-5d23-9edf-a1631b4ee383
  title: PEA Jeune — conditions générales
  body: 'Les présentes conditions générales régissent l''ouverture et la gestion du
    PEA Jeune au sein de Valbreuil Bourse. Ce contrat lie l''institution et le client
    selon les normes de rigueur réglementaire en vigueur.


    Éligibilité et Conditions d''Accès : Le PEA Jeune est exclusivement réservé aux
    personnes physiques âgées de 18 ans minimum et de 25 ans maximum, et qui sont
    rattachées au foyer fiscal de leurs parents. L''ouverture du compte est conditionnée
    par la fourniture des justificatifs d''identité et de rattachement fiscal.


    Limites de Versement : Le plafond des versements pour ce produit est strictement
    fixé à 20 000 €. Tout versement excédant ce montant sera refusé conformément à
    la réglementation fiscale française. Le client est responsable du suivi de ses
    versements pour ne pas outrepasser ce seuil.


    Tarification et Frais : Chaque ordre d''achat ou de vente exécuté sur le PEA Jeune
    est soumis à des frais de courtage s''élevant à 0,2 % du montant de l''ordre.
    Ces frais sont prélevés lors du règlement-livraison des titres.


    Obligations Réglementaires : Valbreuil Bourse s''engage à respecter les cadres
    de l''AMF et de l''ACPR conformément à MiFID II. À ce titre, une évaluation de
    l''adéquation est systématiquement réalisée pour s''assurer que les produits financiers
    choisis correspondent au profil de risque et aux objectifs du client. Le capital
    investi n''est pas garanti.


    Modification et Clôture : Toute modification des conditions générales fera l''objet
    d''une notification préalable. Le client peut demander la clôture de son compte
    à tout moment. En cas de dépassement de l''âge limite de 25 ans, le compte pourra
    être transformé en PEA classique selon les modalités en vigueur.


    L''agent doit s''assurer que le client a pris connaissance de la PEA Jeune — présentation
    pour une compréhension globale du produit.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c4853f28-244b-5dc2-a362-5d6b32eae10e
  title: PEA Jeune — pour qui et pour quels usages
  body: 'Le PEA Jeune est une enveloppe fiscale optimisée, conçue spécifiquement pour
    initier les jeunes actifs et les étudiants dans l''investissement boursier tout
    en bénéficiant d''un cadre fiscal avantageux.


    Public Cible

    Ce produit s''adresse aux résidents français âgés de 18 ans à 25 ans, à condition
    d''être rattachés au foyer fiscal de leurs parents. C''est l''outil idéal pour
    ceux qui souhaitent se constituer un portefeuille d''actions européennes dès le
    début de leur vie active sans subir l''intégralité de la fiscalité classique sur
    les plus-values.


    Usages et Stratégies

    Le PEA Jeune est principalement utilisé pour l''investissement à long terme. Grâce
    à sa structure, il permet d''acquérir des titres d''entreprises de l''Union Européenne
    et de divers pays européens. L''objectif est de profiter de la croissance des
    marchés financiers tout en optimisant la fiscalité après une période de détention
    minimale.


    Caractéristiques Techniques

    - Plafond de versement : Les versements sont limités à un maximum de 20 000 €.

    - Frais de courtage : Une commission de 0,2 % est appliquée sur chaque transaction
    (achat ou vente).

    - Accessibilité : Ouverture rapide via notre interface numérique premium, sous
    réserve de validation des pièces justificatives.


    L''institution mise sur la transparence et la pédagogie. Bien que le PEA Jeune
    soit un produit d''initiation, Valbreuil Bourse applique la même rigueur réglementaire
    que pour ses comptes de gestion privée, incluant la vérification de l''adéquation
    des produits choisis.


    Pour connaître la liste des documents nécessaires à l''ouverture, veuillez consulter
    le document PEA Jeune — justificatifs à fournir.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: b2e2412c-2da3-5162-af94-4236ff36ec9b
  title: 'PEA Jeune — frais de courtage en pourcentage de l''ordre : explications'
  body: 'Voici les réponses aux questions fréquentes concernant la structure tarifaire
    du PEA Jeune.


    Question : Comment sont calculés les frais de courtage de 0,2 % sur mes opérations
    ?

    Réponse : Les frais de courtage sont proportionnels à la valeur totale de votre
    ordre. Par exemple, pour un achat de titres d''une valeur de 1 000 €, Valbreuil
    Bourse prélèvera des frais de 2 € (soit 0,2 % de 1 000 €). Ce montant est déduit
    lors de l''exécution de la transaction.


    Question : Existe-t-il des frais fixes s''ajoutant à ce pourcentage ?

    Réponse : Non, pour le PEA Jeune, nous appliquons une tarification transparente
    basée uniquement sur le pourcentage de 0,2 % par ordre. Il n''y a pas de frais
    fixes minimums par transaction.


    Question : Ces frais s''appliquent-ils aussi lors de la vente de mes titres ?

    Réponse : Oui, le taux de 0,2 % s''applique systématiquement, que vous effectuiez
    un ordre d''achat ou un ordre de vente.


    Pour plus de précisions sur l''application de ces taux, vous pouvez consulter
    le document PEA Jeune — calcul et application des taux.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: a33b4cee-88ea-5925-baed-3de7622de922
  title: PEA Jeune — résilier, clôturer ou changer de formule
  body: 'La clôture d''un PEA Jeune ou sa transition vers une autre enveloppe fiscale
    est une opération encadrée qui nécessite une validation sécurisée pour protéger
    vos actifs.


    Ce qui est nécessaire avant de commencer :

    - L''accès à votre messagerie sécurisée Valbreuil Bourse.

    - La confirmation que tous vos ordres en cours sont exécutés ou annulés.

    - Un RIB à jour si la clôture entraîne un transfert de fonds vers un compte externe.


    Étapes de clôture ou de changement de formule :

    1. Informez-nous de votre volonté de clôturer votre compte ou de changer de formule
    (par exemple, transition vers un PEA classique suite à l''atteinte de l''âge de
    25 ans).

    2. Nous procéderons à une vérification d''identité rigoureuse pour valider la
    demande et nous assurer qu''il ne s''agit pas d''une opération frauduleuse.

    3. Nous effectuerons l''inventaire de vos positions. Si vous souhaitez clôturer
    le compte, nous vous demanderons si vous préférez vendre vos titres ou les transférer
    vers un autre compte titres.

    4. Une fois les titres liquidés ou transférés, nous confirmerons le solde final
    disponible après déduction des éventuels frais de courtage de 0,2 % liés aux ventes
    de clôture.

    5. Nous effectuerons le virement des fonds restants vers votre compte de dépôt
    associé ou vers le compte bancaire fourni.


    Vous saurez que l''opération est réussie lorsque vous recevrez un avis de clôture
    officiel et que le solde de votre PEA Jeune affichera 0,00 €.


    Pour comprendre les implications contractuelles de cette action, veuillez vous
    référer aux PEA Jeune — conditions générales.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: a9ad091d-b1aa-5236-865b-48f91ddb9316
  title: PEA Jeune — frais ou montant inattendu
  body: 'Ce guide est destiné aux agents pour traiter les demandes de clients signalant
    un écart entre le montant attendu et le montant réellement débité ou crédité sur
    leur PEA Jeune.


    Symptôme : Le client affirme avoir été prélevé de frais trop élevés ou constate
    que le montant de son investissement ne correspond pas exactement à son ordre.


    Causes probables et vérifications :

    1. Erreur de calcul des frais : Vérifiez le montant brut de l''ordre. Appliquez
    le taux de 0,2 %. Si l''ordre était de 5 000 €, les frais doivent être exactement
    de 10 €. Si le montant prélevé diffère, vérifiez s''il n''y a pas eu d''ajustement
    lié au cours de bourse au moment de l''exécution.

    2. Dépassement du plafond : Vérifiez si le client a tenté de verser une somme
    portant le total des versements au-delà de 20 000 €. Un versement partiel ou un
    refus d''opération peut créer une confusion sur le montant disponible.

    3. Date de règlement-livraison : Rappelez au client que le transfert effectif
    de propriété et le débit final peuvent prendre quelques jours (voir la définition
    du Règlement-livraison dans le glossaire).


    Résolution :

    - Si l''erreur est due à une incompréhension du client, expliquez pédagogiquement
    le calcul basé sur le taux de 0,2 %.

    - Si une erreur technique de prélèvement est confirmée, initiez une demande de
    correction interne.

    - Si le client conteste la légitimité des frais malgré les explications, escaladez
    la demande vers le responsable de la conformité.


    L''agent peut s''appuyer sur le document PEA Jeune — frais de courtage en pourcentage
    de l''ordre : explications pour guider le client.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c199e981-a170-5117-8b4a-bf7e62b1f1a7
  title: PEA Jeune — justificatifs à fournir
  body: 'L''ouverture d''un PEA Jeune requiert la production de documents officiels
    pour valider l''éligibilité du demandeur selon les critères réglementaires de
    Valbreuil Bourse.


    | Condition d''éligibilité | Justificatif requis | Action en cas d''absence |

    | :--- | :--- | :--- |

    | Âge compris entre 18 et 25 ans | Pièce d''identité officielle en cours de validité
    (CNI ou Passeport) | Refus immédiat de l''ouverture |

    | Rattachement au foyer fiscal des parents | Dernier avis d''imposition des parents
    mentionnant le demandeur comme personne à charge | Demande de document complémentaire
    ou refus |

    | Résidence fiscale en France | Justificatif de domicile de moins de 3 mois ou
    avis d''imposition | Suspension du dossier jusqu''à réception |


    L''ensemble de ces documents doit être transmis via notre messagerie sécurisée.
    Aucune ouverture de compte ne sera validée sans une vérification d''identité rigoureuse
    et complète. Pour plus d''informations sur l''usage du produit, voir PEA Jeune
    — pour qui et pour quels usages.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 037222cd-b257-5cd5-890f-164ee330288d
  title: PEA Jeune — face à une offre concurrente type
  body: 'Lorsqu''on compare le PEA Jeune de Valbreuil Bourse aux offres classiques
    des banques de réseau, plusieurs distinctions majeures apparaissent en termes
    de coût et de transparence.


    Dimensions de comparaison :

    - Frais de courtage : Là où les banques traditionnelles appliquent souvent un
    forfait fixe minimum (par exemple 5 € ou 10 € par ordre) auquel s''ajoute un pourcentage,
    Valbreuil Bourse propose un taux unique et transparent de 0,2 % sans minimum.
    Pour un jeune investisseur effectuant de petits ordres, la différence de coût
    est significative.

    - Accessibilité : Notre modèle numérique premium permet une gestion fluide via
    messagerie sécurisée, contrairement aux processus souvent lourds et physiques
    des agences classiques.

    - Plafonds : Le plafond de versement de 20 000 € est une norme réglementaire partagée
    avec la concurrence, mais notre rigueur dans le reporting réglementaire assure
    une sérénité fiscale totale.


    Verdict :

    - L''offre concurrente type peut convenir à ceux qui préfèrent un contact physique
    en agence, malgré des frais souvent plus élevés sur les petits montants.

    - Le PEA Jeune de Valbreuil Bourse est le choix privilégié pour l''investisseur
    averti et autonome, recherchant l''optimisation des coûts (0,2 %) et une transparence
    absolue.


    Pour une vision détaillée des caractéristiques, consultez PEA Jeune — pour qui
    et pour quels usages.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 08e56f10-0814-5187-a4c5-afd78309dc0a
  title: PEA Jeune — informations sur les risques
  body: 'L''investissement sur les marchés financiers via un PEA Jeune présente des
    opportunités de croissance, mais comporte des risques intrinsèques que tout investisseur
    doit impérativement comprendre.


    Absence de Garantie du Capital : Le capital investi sur un PEA Jeune n''est jamais
    garanti. La valeur des titres acquis peut fluctuer à la hausse comme à la baisse
    en fonction de l''évolution des marchés boursiers. Il existe un risque réel de
    perte partielle ou totale des sommes investies.


    Protection des Actifs : En cas de défaillance de l''établissement, les titres
    détenus par le client sont protégés par le Fonds de Garantie des Dépôts et de
    Résolution (FGDR) jusqu''à un montant de 70 000 €. Cette protection s''applique
    aux actifs, mais ne couvre pas les pertes liées aux fluctuations du marché.


    Évaluation de l''Adéquation : Conformément aux directives MiFID II, Valbreuil
    Bourse procède à une évaluation de l''adéquation. Ce processus vise à s''assurer
    que le PEA Jeune et les produits financiers sélectionnés sont appropriés au regard
    de vos connaissances, de votre expérience et de vos objectifs d''investissement.
    Nous ne délivrons aucun conseil fiscal ou juridique personnalisé.


    Standard de Soin : L''institution s''engage à un standard de soin basé sur le
    profil de risque défini lors de l''ouverture du compte. Toutefois, Valbreuil Bourse
    ne garantit aucun rendement futur basé sur des performances passées.


    Nous vous recommandons la lecture attentive du document PEA Jeune — protection
    contre la fraude et les opérations non autorisées pour sécuriser votre pratique
    d''investisseur.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8d5abd58-9cb5-5192-a7b1-a47b61608a18
  title: PEA Jeune — calcul et application des taux
  body: 'Ce document précise les modalités d''application des tarifs pour le PEA Jeune.
    Il est destiné aux agents pour garantir une communication uniforme auprès des
    clients.


    Tarif de Courtage : Un taux unique de 0,2 % est appliqué à toutes les opérations
    de bourse sur le PEA Jeune.


    Conditions d''Application :

    - L''application du taux est systématique et ne dépend d''aucun palier de volume
    ou de montant. Que l''ordre soit de 10 € ou de 10 000 €, le taux reste 0,2 %.

    - Le taux s''applique aussi bien aux ordres d''achat qu''aux ordres de vente.

    - Le calcul est basé sur la valeur nominale de l''exécution de l''ordre : Montant
    de la transaction × 0,002 = Frais de courtage.


    Événements Modificateurs :

    Le taux de 0,2 % est fixe pour la durée de validité du plan PEA Jeune. Toute modification
    future de ce taux fera l''objet d''une notification préalable conformément aux
    conditions générales.


    Pour aider un client à comprendre l''impact de ces frais sur ses transactions,
    référez-vous au document PEA Jeune — frais de courtage en pourcentage de l''ordre
    : explications.'
  domain: brokerage_investing
