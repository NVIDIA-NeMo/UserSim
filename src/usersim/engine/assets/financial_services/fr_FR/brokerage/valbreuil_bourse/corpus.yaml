- id: 0362dc3f-f0ac-5516-8090-2ec1213171ca
  title: Investissement programmé en ETF — modification des conditions
  body: 'Le présent document définit les modalités de modification des conditions
    générales applicables à l''Investissement programmé en ETF au sein de Valbreuil
    Bourse.


    L''institution se réserve le droit de modifier les conditions tarifaires ou les
    seuils d''accès. Actuellement, les frais d''exécution du plan sont fixés à 0 €
    et le versement minimal est de 25 €. Toute modification de ces valeurs fera l''objet
    d''une notification préalable via votre messagerie sécurisée avec un préavis minimum
    de 30 jours ouvrés.


    L''investisseur s''engage à maintenir un solde suffisant sur son compte espèces
    pour honorer les échéances programmées. Un défaut de provision peut entraîner
    la suspension temporaire du plan d''investissement.


    La résiliation du programme d''investissement peut être demandée à tout moment.
    La prise en compte de la modification des instructions d''investissement intervient
    selon le Règlement-livraison en vigueur, assurant la transition effective de la
    propriété des titres.


    L''évaluation de l''adéquation, conformément aux normes MiFID II, est requise
    lors de toute modification substantielle de la stratégie d''investissement ou
    du profil de risque du client. Le non-respect des critères d''éligibilité peut
    conduire à la clôture du plan par la direction des opérations.'
  domain: brokerage_investing
