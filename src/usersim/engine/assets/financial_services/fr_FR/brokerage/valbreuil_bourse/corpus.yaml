- id: 39d8f7bf-4e06-593d-92a4-032ee6f86708
  title: PEA Jeune — offre en cours
  body: 'Valbreuil Bourse accompagne l''entrée des jeunes investisseurs sur les marchés
    financiers avec une offre de bienvenue exclusive pour l''ouverture de votre PEA
    Jeune.


    **L''Offre**

    Pour tout nouveau compte PEA Jeune ouvert et alimenté d''un montant minimum de
    500 €, Valbreuil Bourse crédite votre compte espèces d''un bonus de bienvenue
    de 50 €.


    **Dates de validité**

    - Date de début : 1er octobre 2023

    - Date de fin : 31 décembre 2023


    **Conditions d''application**

    - L''offre est réservée aux nouveaux clients répondant aux conditions d''éligibilité
    (18-25 ans, rattachement fiscal).

    - Le versement initial doit être effectué avant le 31 décembre 2023.

    - Le bonus de 50 € est versé après validation complète du dossier de conformité
    et du premier dépôt.

    - Cette offre n''est pas cumulable avec d''autres promotions. Les frais de courtage
    standards de 0,2 % restent applicables à toutes les transactions.'
