- id: be5a8ec3-ae46-51ae-aeeb-85dc10ae00ab
  title: Investissement programmé en ETF — protection contre la fraude et les opérations
    non autorisées
  body: "La sécurisation de vos actifs est la priorité absolue de Valbreuil Bourse.\
    \ Pour l'Investissement programmé en ETF, nous avons mis en place un protocole\
    \ de sécurité rigoureux afin de prévenir toute opération non autorisée et de protéger\
    \ vos fonds contre la fraude.\n\nL'exécution de vos investissements automatisés\
    \ s'appuie sur une authentification forte. Sachez qu'aucune modification de vos\
    \ coordonnées, aucun changement de périodicité et aucun retrait de fonds ne peut\
    \ être effectué sans une validation sécurisée préalable. Nous vous rappelons que\
    \ Valbreuil Bourse ne vous demandera jamais vos codes secrets, vos mots de passe\
    \ ou vos identifiants de validation par e-mail ou par téléphone. Toute demande\
    \ en ce sens doit être considérée comme une tentative de fraude.\n\nEn cas de\
    \ suspicion de fraude ou de signalement d'une activité inhabituelle sur votre\
    \ plan d'investissement, nos services procèdent immédiatement au gel conservatoire\
    \ de vos comptes. Cette mesure protectrice permet de sécuriser vos actifs le temps\
    \ qu'une analyse approfondie soit menée par notre direction des opérations. \n\
    \nSur le plan réglementaire, bien que le capital investi sur les marchés financiers\
    \ ne soit jamais garanti, vos titres sont protégés par le Fonds de Garantie des\
    \ Dépôts et de Résolution (FGDR) jusqu'à 70 000 euros. Cette garantie constitue\
    \ un filet de sécurité essentiel pour vos avoirs.\n\nSi vous constatez une transaction\
    \ suspecte ou une modification non sollicitée de vos paramètres d'investissement,\
    \ nous vous invitons à nous le signaler sans délai via notre messagerie sécurisée.\
    \ Un accusé de réception immédiat vous sera transmis, et votre demande sera traitée\
    \ selon un processus de résolution normé et transparent.\n\nPour une compréhension\
    \ plus approfondie de l'encadrement réglementaire de nos activités, nous vous\
    \ suggérons de consulter le document intitulé Investissement programmé en ETF\
    \ — informations réglementaires."
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: security_advisory
