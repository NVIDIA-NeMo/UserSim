- id: 97b1c810-3b15-501f-9e28-61266522d0e6
  title: Investissement programmé en ETF — prise en main pas à pas
  body: 'L''Investissement programmé en ETF est une solution d''automatisation conçue
    pour lisser le risque de marché via la méthode du coût moyen pondéré. Ce produit
    s''adresse aux investisseurs souhaitant construire un portefeuille diversifié
    avec rigueur et transparence.


    **Caractéristiques financières essentielles :**

    - Montant minimal par échéance : 25 €

    - Frais d''exécution du plan : 0 €


    **Procédure de mise en œuvre :**

    1. **Définition de l''objectif** : Le client précise le montant qu''il souhaite
    investir périodiquement, lequel ne peut être inférieur à 25 €.

    2. **Sélection des actifs** : Choix des ETF (Exchange Traded Funds) correspondant
    au profil de risque validé lors de l''évaluation de l''adéquation.

    3. **Paramétrage de la fréquence** : Définition de la périodicité des versements
    (mensuelle, trimestrielle ou annuelle).

    4. **Validation sécurisée** : Confirmation de l''ordre de virement permanent et
    signature électronique du mandat d''investissement.


    L''agent doit s''assurer que le client a bien compris que le capital investi n''est
    pas garanti. Le reporting réglementaire est envoyé mensuellement pour permettre
    un suivi précis des positions. Pour toute question relative aux coûts, veuillez
    vous référer au document Investissement programmé en ETF — coûts et frais.'
