- id: 14890ddd-a332-5554-825e-57cfde8bb798
  title: Investissement programmé en ETF — bonnes pratiques de sécurité du compte
  body: "La sécurisation de vos actifs est la priorité absolue de Valbreuil Bourse.\
    \ Dans le cadre de votre Investissement programmé en ETF, nous vous rappelons\
    \ les protocoles de sécurité rigoureux en vigueur pour protéger vos avoirs.\n\n\
    L'authentification forte est obligatoire pour toute modification de vos instructions\
    \ d'investissement ou toute demande de retrait. Nous vous informons qu'aucun collaborateur\
    \ de Valbreuil Bourse ne vous demandera jamais vos codes secrets ou vos mots de\
    \ passe par e-mail ou messagerie.\n\nSoyez vigilants face aux tentatives de phishing\
    \ : tout message vous incitant à modifier vos coordonnées bancaires sans passer\
    \ par notre processus de validation sécurisée doit être considéré comme suspect.\
    \ Conformément à notre politique de protection, en cas de suspicion de fraude,\
    \ vos comptes sont gelés conservatoirement pour protéger vos actifs.\n\nSachez\
    \ que, bien que le capital investi sur les marchés financiers ne soit jamais garanti,\
    \ vos titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution\
    \ (FGDR) jusqu'à un montant de 70 000 €. \n\nEn cas d'anomalie constatée sur vos\
    \ prélèvements automatisés ou d'une opération non reconnue, vous devez nous en\
    \ informer sans délai via notre messagerie sécurisée. Tout signalement effectué\
