  institution_id: valbreuil_bourse
- id: 6ccd4d1d-9c40-5874-a912-957f05591cc7
  title: Compte-titres ordinaire — pour qui et pour quels usages
  body: "Le Compte-titres ordinaire est l'instrument d'investissement le plus flexible\
    \ proposé par Valbreuil Bourse. Contrairement aux enveloppes fiscales réglementées,\
    \ il ne comporte aucun plafond de versement, permettant ainsi une stratégie d'investissement\
    \ sans contrainte de montant.\n\nCe produit s'adresse particulièrement aux investisseurs\
    \ avertis et aux jeunes actifs souhaitant diversifier leur portefeuille sur les\
    \ marchés mondiaux. Il est idéal pour ceux qui recherchent une liberté totale\
    \ dans le choix de leurs actifs (actions internationales, ETF, obligations) et\
    \ qui souhaitent pouvoir effectuer des retraits et des versements à tout moment\
    \ sans perdre d'avantage fiscal spécifique.\n\nLes caractéristiques tarifaires\
    \ sont conçues pour être compétitives :\n- Frais de courtage : 1,99 € par ordre.\n\
    - Droits de garde annuels : 0 €.\n- Frais de transfert sortant : 15 € par ligne.\n\
    \nL'usage principal du Compte-titres ordinaire est la constitution d'un patrimoine\
    \ financier global. Grâce à l'absence de frais de garde, il est particulièrement\
    \ adapté aux stratégies de détention à long terme comme au trading actif. \n\n\
    Note : Ce compte ne bénéficie pas de l'avantage fiscal du PEA sur les actions\
    \ européennes. Pour une approche optimisée fiscalement sur le marché européen,\
    \ nous vous invitons à consulter le document Plan d'épargne en actions (PEA) —\
    \ présentation."
