- id: 5e7b19fd-01b6-540f-81e0-ab82f793a5c2
  title: Compte-titres ordinaire — frais ou montant inattendu
  body: 'Symptôme : Le client signale la présence d''un débit qu''il ne comprend pas
    ou un solde différent de ses prévisions sur son Compte-titres ordinaire.


    Causes probables et vérifications :

    1. Frais de transaction : Vérifiez si le client a effectué un ordre d''achat ou
    de vente. Chaque ordre entraîne un frais de courtage fixe de 1,99 €.

    2. Transfert de titres : Le client a-t-il demandé le transfert de titres vers
    un autre établissement ? Si oui, vérifiez le nombre de lignes transférées. Chaque
    ligne est facturée 15 €.

    3. Fiscalité : Vérifiez s''il s''agit d''un prélèvement fiscal (flat tax ou prélèvements
    sociaux) suite à la perception de dividendes ou à une cession de titres. Valbreuil
    Bourse applique les taux réglementaires en vigueur.

    4. Erreur de règlement-livraison : Vérifiez si l''opération est encore dans le
    délai conventionnel de règlement-livraison, ce qui peut créer un décalage temporaire
    du solde disponible.


    Résolution :

    - Expliquez clairement au client l''origine du frais en citant la ligne tarifaire
    correspondante (ex: "Ce débit de 1,99 € correspond aux frais de courtage de votre
    ordre du [Date]").

    - Fournissez l''extrait de compte détaillé justifiant le montant.


    Escalade :

    Si le client conteste formellement le bien-fondé du frais malgré vos explications,
    ou si une erreur de calcul est suspectée, le dossier doit être escaladé vers le
    responsable de la conformité. Un accusé de réception immédiat est envoyé au client,
    et le délai de résolution sera conforme aux normes de traitement des réclamations
    de l''institution.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 2b90b1f8-588c-535a-b12d-ced2c818abc0
