- id: dea72359-ccb4-56ec-ab12-dd88fdbbba68
  title: Investissement programmé en ETF — coûts et frais
  body: 'Découvrez les réponses aux questions les plus fréquentes concernant la structure
    tarifaire de l''Investissement programmé en ETF.


    **Quels sont les frais appliqués à chaque exécution de mon plan d''investissement
    ?**

    La tarification de ce service a été conçue pour être extrêmement compétitive.
    Les frais d''exécution pour chaque versement programmé sont de 0 €, permettant
    ainsi une optimisation maximale de votre capital.


    **Existe-t-il un montant minimum pour commencer à investir via un programme automatisé
    ?**

    Oui, afin de garantir la viabilité opérationnelle et la sécurisation des actifs,
    le montant minimal autorisé pour chaque échéance de votre plan d''investissement
    est de 25 €.


    **Ces frais incluent-ils les frais de gestion internes des ETF ?**

    Non, les 0 € de frais d''exécution concernent uniquement le service de programmation
