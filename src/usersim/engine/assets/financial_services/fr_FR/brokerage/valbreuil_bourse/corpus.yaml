  institution_id: valbreuil_bourse
- id: 11072dbc-5aa5-5d34-b667-67364161cbb4
  title: Compte-titres ordinaire — informations sur les risques
  body: "L'investissement sur les marchés financiers via un Compte-titres ordinaire\
    \ comporte des risques substantiels que tout investisseur doit comprendre avant\
    \ d'engager des capitaux.\n\nRisque de perte en capital : Le capital investi n'est\
    \ jamais garanti. La valeur des titres peut fluctuer à la hausse comme à la baisse\
    \ en fonction de la conjoncture économique, des résultats des entreprises ou de\
    \ la volatilité des marchés. Il est possible de perdre la totalité des sommes\
    \ investies.\n\nÉvaluation de l'adéquation : Conformément à la directive MiFID\
    \ II, Valbreuil Bourse procède à une évaluation de l'adéquation. Ce processus\
    \ vise à s'assurer que les produits financiers choisis correspondent à vos connaissances,\
    \ votre expérience et vos objectifs d'investissement. L'institution vérifie la\
    \ pertinence des produits mais ne délivre aucun conseil fiscal ou juridique personnalisé.\n\
    \nProtection des actifs : En cas de défaillance de l'institution, vos titres sont\
    \ protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu'à\
    \ un plafond de 70 000 €. \n\nAbsence de garantie de rendement : Valbreuil Bourse\
    \ ne garantit aucun rendement futur. Les performances passées ne sont pas présage\
    \ des performances futures. L'agent se limite à un standard de soin basé sur le\
    \ profil de risque défini lors de l'ouverture du compte."
  domain: brokerage_investing
  product_category: compte_titres
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c9c7d2f5-0c48-5cc3-8542-77992b05452b
  title: Compte-titres ordinaire — calcul et application des taux
  body: 'La tarification du Compte-titres ordinaire est basée sur un modèle de frais
    fixes, assurant une prévisibilité totale pour le client.


    Application des frais :

    - Frais de courtage : Un montant forfaitaire de 1,99 € est appliqué à chaque ordre
    d''achat ou de vente, quel que soit le montant de la transaction ou la place boursière
    concernée.

    - Droits de garde : Le taux annuel est de 0 €, ce qui signifie qu''aucun frais
    de conservation n''est prélevé sur le solde des titres, quelle que soit la valeur
    du portefeuille.

    - Frais de transfert sortant : En cas de transfert de titres vers un autre établissement
    financier, un frais de 15 € est appliqué par ligne de titres transférée. Le calcul
    est donc : (Nombre de lignes de titres) x 15 €.


    Ces taux sont applicables à l''ensemble des clients détenteurs d''un Compte-titres
    ordinaire, sans distinction de palier de fortune ou de volume de transactions.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 18b6655e-195b-5f26-9875-a89067fcb1d3
  title: Compte-titres ordinaire — offre de parrainage et de fidélité
  body: "Valbreuil Bourse invite ses clients à partager leur expérience d'investissement\
    \ via notre programme de parrainage. Pour chaque nouveau résident français apporté\
    \ à l'institution, le parrain et le filleul bénéficient d'une reconnaissance de\
    \ leur fidélité au sein de notre écosystème numérique premium.\n\nL'avantage principal\
    \ de notre Compte-titres ordinaire réside dans sa structure de coûts hautement\
    \ compétitive, conçue pour accompagner la croissance de votre patrimoine sur le\
    \ long terme. Nous maintenons des droits de garde annuels à 0 €, permettant ainsi\
    \ aux investisseurs de conserver leurs actifs sans érosion liée aux frais de détention.\
    \ \n\nCette politique de fidélité s'accompagne d'une tarification transparente\
    \ : chaque ordre d'exécution est facturé au tarif forfaitaire de 1,99 €, quel\
    \ que soit le montant investi. En rejoignant Valbreuil Bourse, vous accédez à\
    \ une flexibilité totale sur les marchés mondiaux sans contrainte de plafond de\
    \ versement, tout en bénéficiant d'un cadre réglementaire rigoureux et sécurisé."
