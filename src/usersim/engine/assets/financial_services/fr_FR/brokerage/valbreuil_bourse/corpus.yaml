- id: f3908b93-75d4-59d2-8df8-099cc14f580b
  title: Investissement programmé en ETF — résilier, clôturer ou changer de formule
  body: 'Ce guide vous accompagne dans la modification ou l''arrêt de votre stratégie
    d''investissement automatisée. Que vous souhaitiez ajuster vos versements ou stopper
    complètement le programme, la procédure est simplifiée et s''effectue via notre
    assistance.


    Pour modifier le montant ou la fréquence de vos investissements :

    1. Précisez-nous le nouveau montant souhaité. Attention, celui-ci doit être supérieur
    ou égal au montant minimal de 25 €.

    2. Indiquez la nouvelle périodicité souhaitée pour vos achats d''ETF.

    3. Nous vous confirmerons la prise en compte de ces modifications et la date de
    la prochaine exécution mise à jour.


    Pour suspendre ou résilier votre programme d''investissement :

    1. Demandez-nous la résiliation de votre plan d''investissement programmé. Précisez
    si vous souhaitez une suspension temporaire ou une clôture définitive du programme.

    2. Nous traiterons votre demande et vous enverrons une confirmation écrite via
    la messagerie sécurisée.

    3. Vous recevrez un récapitulatif des titres acquis via ce programme, lesquels
    restent disponibles sur votre compte.


    Points d''attention :

    - La résiliation du programme d''investissement n''entraîne pas la clôture de
    votre compte-titres ou de votre enveloppe fiscale ; elle stoppe uniquement les
    achats automatisés.

    - Aucune pénalité financière n''est appliquée lors de la résiliation du programme.

    - Si vous souhaitez vendre les titres acquis suite à la clôture du programme,
    veuillez consulter les modalités de cession dans Investissement programmé en ETF
    — présentation.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: cbb3db87-653c-5442-be73-cf710e421dee
  title: Investissement programmé en ETF — frais ou montant inattendu
  body: 'Symptôme : Le client signale un prélèvement supérieur au montant programmé
    ou l''apparition de frais alors que le service est annoncé comme gratuit.


    Causes probables et vérifications :

    1. Vérification du montant minimal : Assurez-vous que le montant programmé respecte
    le seuil minimal de 25 €. Si le client a tenté de configurer un montant inférieur,
    l''opération a pu être rejetée ou ajustée.

    2. Distinction entre frais d''exécution et frais de gestion : Les frais par exécution
    de l''investissement programmé sont bien de 0 €. Cependant, les ETF eux-mêmes
    comportent des frais de gestion internes (TER) prélevés par le fournisseur du
    fonds, qui ne sont pas facturés par Valbreuil Bourse mais impactent la valeur
    liquidative du titre.

    3. Ordres manuels vs programmés : Vérifiez si le client a effectué un achat d''ETF
    manuel en dehors du programme. Les ordres manuels peuvent être soumis à une grille
    tarifaire différente de celle du programme automatisé.


    Procédure de résolution :

    - Si une erreur de facturation de la part de Valbreuil Bourse est constatée (frais
    d''exécution > 0 €), procédez à l''analyse du journal des transactions.

    - En cas d''erreur avérée, initiez une régularisation immédiate du compte du client.

    - Communiquez au client un accusé de réception de la réclamation et le délai de
    résolution normé.


    Escalade :

    Si le litige persiste ou si le client conteste la nature des frais de gestion
    des ETF (frais externes), escaladez la demande vers le responsable de la conformité
    pour une analyse détaillée de l''adéquation et des informations fournies lors
    de la souscription.


    Pour plus d''informations sur la structure des coûts, reportez-vous à Investissement
    programmé en ETF — calcul et application des taux.'
  domain: brokerage_investing
  product_category: investissement_programme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: c885991e-d898-5539-9dd1-8e009c00cc33
  title: Investissement programmé en ETF — justificatifs à fournir
  body: 'L''activation de l''Investissement programmé en ETF requiert une vérification
    d''identité et de conformité rigoureuse, conformément aux exigences de l''AMF
    et de l''ACPR. Voici les documents nécessaires pour valider votre accès :


    | Type de justificatif | Condition d''éligibilité | Résultat attendu |

    | :--- | :--- | :--- |

    | Pièce d''identité officielle | Valide et en cours de validité (CNI, Passeport)
    | Validation de l''identité client |

    | Justificatif de domicile | Daté de moins de 3 mois (Facture énergie, téléphone)
    | Confirmation de la résidence fiscale en France |

    | Questionnaire MiFID II | Complété et signé | Validation de l''évaluation de
    l''adéquation |

    | RIB / IBAN | Au nom du titulaire du compte | Activation des flux de versement
    pour le plan (min. 25 €) |


    L''absence de l''un de ces documents entraîne le blocage conservatoire de l''activation
    du programme d''investissement jusqu''à régularisation complète.'
