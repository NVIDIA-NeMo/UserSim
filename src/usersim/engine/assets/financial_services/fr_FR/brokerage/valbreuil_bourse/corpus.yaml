  title: PEA-PME — offre de parrainage et de fidélité
  body: "Valbreuil Bourse a le plaisir de vous présenter son programme de fidélité\
    \ dédié au PEA-PME, conçu pour accompagner les investisseurs souhaitant soutenir\
    \ la croissance des entreprises moyennes et petites. \n\nDans le cadre de notre\
    \ politique de transparence et de compétitivité, nous proposons aux nouveaux clients\
    \ parrainés l'accès immédiat à notre structure de frais privilégiée, incluant\
    \ un taux de frais de courtage de 0,2 % sur vos opérations.\n\nCette offre est\
    \ valable pour toute ouverture de compte effectuée entre le 1er octobre 2024 et\
    \ le 31 décembre 2024. Pour en bénéficier, le futur client doit utiliser le code\
    \ de parrainage transmis par son référent lors de la phase de souscription. \n\
