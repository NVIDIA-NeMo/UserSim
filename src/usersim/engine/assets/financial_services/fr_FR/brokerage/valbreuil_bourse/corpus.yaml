  institution_id: valbreuil_bourse
- id: c569e619-37db-580a-8dab-da70bc2e9fb9
  title: PEA-PME — prise en main pas à pas
  body: 'Ce document est destiné aux agents d''assistance pour guider les clients
    dans l''activation et la gestion initiale de leur PEA-PME.


    L''objectif est d''assurer que le client comprend les spécificités de l''enveloppe
    avant le premier versement.


    Étapes de prise en main :


    1. Vérification de l''éligibilité : S''assurer que le client est résident français
    et a complété l''évaluation de l''adéquation conformément à MiFID II. Ce processus
    permet de vérifier que le produit correspond aux connaissances et objectifs du
    client.


    2. Configuration du compte : Informer le client que le PEA-PME offre un plafond
    de versement maximal de 225 000 €. Ce montant est distinct du plafond du PEA classique.


    3. Explication des coûts : Préciser que chaque ordre d''achat ou de vente est
    soumis à un taux de frais de courtage de 0,2 %. Souligner que ces frais couvrent
    la sécurisation des actifs et le reporting réglementaire.


    4. Premier versement : Guider le client vers l''initiation du transfert de fonds
    depuis son compte espèces vers le PEA-PME.


    5. Sélection des titres : Rappeler que seules les PME éligibles selon les critères
    réglementaires peuvent être détenues dans cette enveloppe.


    Points de vigilance :

    - Rappeler systématiquement que le capital investi n''est jamais garanti.

    - Mentionner la protection du FGDR jusqu''à 70 000 € sur les titres.

    - Indiquer que Valbreuil Bourse ne délivre aucun conseil fiscal personnalisé.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ccf74497-5a4c-52fc-adb6-cd9b3208b218
  title: 'PEA-PME — plafond des frais de transfert sortant : explications'
  body: 'Question : Que se passe-t-il si je souhaite transférer mon PEA-PME vers un
    autre établissement financier ?


    Réponse : Vous avez la possibilité de transférer vos titres et votre numéraire
    vers un autre courtier. Valbreuil Bourse applique des frais pour l''exécution
    de ce transfert, mais nous avons mis en place un plafond protecteur : les frais
    de transfert sortant sont plafonnés à 150 €.


    Question : Le plafond de 150 € s''applique-t-il par ligne de titres ou par compte
    ?


    Réponse : Le montant de 150 € constitue le plafond global maximum pour l''opération
    de transfert sortant de votre enveloppe PEA-PME, indépendamment du nombre de lignes
    de titres transférées.


    Question : Comment est déduit ce montant ?


    Réponse : Ces frais sont prélevés directement sur le solde espèces disponible
    dans votre PEA-PME au moment du transfert. Si le solde est insuffisant, nous vous
    contacterons via la messagerie sécurisée pour régulariser la situation.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f4350f69-8423-5a3f-9dd7-21a05226ab36
  title: PEA-PME — effectuer une modification
  body: 'Ce guide vous accompagne dans la procédure de modification des informations
    liées à votre PEA-PME (coordonnées, options de notification ou mise à jour du
    profil de risque).


    Prérequis : Vous devez disposer de vos accès sécurisés et d''une pièce d''identité
    valide si la modification concerne vos informations personnelles.


    Étapes de modification :


    1. Formuler la demande : Indiquez-nous précisément l''élément que vous souhaitez
    modifier (par exemple : « Je souhaite mettre à jour mon adresse postale pour mon
    PEA-PME »).


    2. Transmission des justificatifs : Pour toute modification de coordonnées, fournissez-nous
    un justificatif de domicile récent ou une copie de votre pièce d''identité via
    la messagerie sécurisée.


    3. Validation sécurisée : Vous recevrez une demande d''authentification forte
    pour confirmer que vous êtes bien l''auteur de la demande. Suivez les instructions
    de validation sur votre appareil sécurisé.


    4. Traitement par nos services : Nos équipes procèdent à la vérification des documents.
    En cas de dossier complet, la modification est enregistrée dans un délai de deux
    jours ouvrés.


    5. Confirmation : Vous recevrez une notification de confirmation dans votre boîte
    de réception sécurisée vous informant que le changement a bien été pris en compte.


    Sachez que toute modification impactant votre profil d''investisseur peut entraîner
    une nouvelle évaluation de l''adéquation de vos produits financiers pour garantir
    la pertinence de vos investissements.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1abd79ce-e256-5e51-a51f-8998c5cde721
  title: PEA-PME — problèmes d'accès ou de connexion
  body: 'Symptôme : Vous ne parvenez pas à accéder à votre compte PEA-PME ou vous
    recevez un message d''erreur lors de la tentative de connexion.


    Causes probables :

    - Identifiants incorrects ou mot de passe expiré.

    - Échec de l''authentification forte (problème de réception du code ou synchronisation
    du jeton).

    - Compte gelé conservatoirement suite à une suspicion de fraude.

    - Maintenance technique programmée sur les systèmes de Valbreuil Bourse.


    Procédure de résolution :


    1. Vérification des identifiants : Assurez-vous que la touche verrouillage majuscule
    n''est pas activée et tentez une reconnexion.


    2. Réinitialisation du mot de passe : Si l''accès est toujours refusé, demandez
    une réinitialisation de vos codes d''accès. Vous devrez suivre la procédure de
    vérification d''identité rigoureuse avant tout rétablissement.


    3. Test de l''authentification forte : Vérifiez que votre appareil de validation
    est connecté à internet et que l''application est à jour. Si le code ne s''affiche
    pas, tentez de redémarrer l''appareil.


    4. Signalement d''un blocage : Si vous suspectez que votre compte a été gelé pour
    des raisons de sécurité, demandez-nous la nature du blocage via notre messagerie
    sécurisée. Nous procèderons à une vérification d''identité approfondie.


    Échelonnement :

    Si le problème persiste après ces étapes, nous ouvrirons un ticket d''incident
    auprès de la direction des opérations. Vous serez informé du délai de résolution
    normé par accusé de réception immédiat.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: ceba6cec-3041-589d-95d1-195bc96a004e
  title: PEA-PME — niveaux d'accès
  body: 'Ce tableau définit les conditions d''accès et les capacités d''investissement
    pour le PEA-PME au sein de Valbreuil Bourse.


    | Condition | Résultat / Niveau d''accès |

    | :--- | :--- |

    | Résidence fiscale en France + Évaluation de l''adéquation validée | Ouverture
    du compte autorisée |

    | Versement initial et suivants | Plafond total cumulé de 225 000 € |

    | Passation d''ordres sur titres PME éligibles | Application d''un taux de frais
    de courtage de 0,2 % |

    | Demande de transfert vers un autre établissement | Application de frais plafonnés
    à 150 € |

    | Profil de risque « Prudent » ou « Équilibré » | Accès limité aux titres conformes
    au standard de soin du profil |

    | Profil de risque « Dynamique » ou « Offensif » | Accès complet à l''univers
    des PME éligibles |'
