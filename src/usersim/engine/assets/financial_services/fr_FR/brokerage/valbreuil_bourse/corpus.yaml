  institution_id: valbreuil_bourse
- id: 0fa8b51c-67f7-53e5-853a-92376502fd38
  title: Plan d'épargne en actions (PEA) — opération échouée ou en attente
  body: 'Il peut arriver qu''une opération d''achat ou de vente sur votre PEA apparaisse
    avec le statut « échouée » ou reste « en attente » plus longtemps que prévu. Voici
    comment diagnostiquer et résoudre la situation.


    Symptômes courants :

    - L''ordre est marqué comme « échoué » immédiatement après la validation.

    - L''ordre reste « en attente » alors que les marchés sont ouverts.


    Causes possibles et vérifications :

    1. Solde insuffisant : Vérifiez que votre compte espèces dispose des fonds nécessaires
    pour couvrir l''achat ainsi que les frais de courtage de 0,2 %. Tout manque, même
    minime, entraînera l''échec de l''ordre.

    2. Évaluation MiFID II incomplète : Si votre profil d''investisseur n''est pas
    à jour, certaines opérations sur des produits complexes peuvent être bloquées
    pour votre protection.

    3. Heures de marché : Assurez-vous que l''ordre a été passé durant les heures
    d''ouverture des places boursières concernées. Un ordre hors séance peut rester
    en attente jusqu''à l''ouverture suivante.

    4. Plafond de versement : Si l''opération implique un nouveau dépôt, vérifiez
    que vous n''avez pas dépassé le plafond réglementaire de 150 000 €.


    Résolution :

    - Si le solde est insuffisant, effectuez un nouveau versement et relancez l''ordre.

    - Si le profil MiFID II est expiré, complétez le nouveau questionnaire via votre
    messagerie sécurisée.


    Échelonnement :

    Si le problème persiste malgré ces vérifications, nous ouvrirons un ticket d''incident
    auprès de la direction des opérations. Vous recevrez un accusé de réception immédiat
    et une réponse sous le délai de résolution normé de l''institution. Pour plus
    d''informations sur la sécurité, consultez Plan d''épargne en actions (PEA) —
    informations réglementaires.'
  domain: brokerage_investing
  product_category: pea
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 5955e733-5f59-5f15-abc6-f4192f87d346
  title: Plan d'épargne en actions (PEA) — conditions d'éligibilité
  body: 'Le tableau suivant définit les conditions d''éligibilité pour l''ouverture
    et le maintien d''un Plan d''épargne en actions (PEA) chez Valbreuil Bourse.


    | Condition | Critère | Résultat |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français ou UE | Éligible |

    | Résidence fiscale | Non-résident UE | Non éligible |

    | Âge légal | Majeur (18 ans et plus) | Éligible |

    | Âge légal | Mineur | Non éligible (voir PEA Jeune) |

    | Capacité de versement | ≤ 150 000 € | Éligible |

    | Capacité de versement | > 150 000 € | Plafond atteint (versements bloqués) |

    | Profil Investisseur | Évaluation MiFID II validée | Éligible |

    | Profil Investisseur | Évaluation MiFID II non complétée | Accès restreint aux
    titres |


    Tout changement de résidence fiscale doit être communiqué immédiatement pour maintenir
    la conformité du plan.'
  domain: brokerage_investing
  product_category: pea
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 91f41627-2cba-58c7-8720-4280291f139e
  title: Plan d'épargne en actions (PEA) — face à un produit similaire de l'établissement
  body: 'Le PEA standard est notre solution d''investissement européenne principale.
    Pour optimiser votre stratégie, il peut être pertinent de le comparer aux variantes
    spécifiques proposées par Valbreuil Bourse.


    Comparaison avec le PEA-PME :

    - Plafond de versement : Le PEA standard est limité à 150 000 €, tandis que le
    PEA-PME offre un plafond élargi à 225 000 €.

    - Orientation : Le PEA standard privilégie les actions de grandes entreprises
    européennes, alors que le PEA-PME est optimisé pour le soutien aux petites et
    moyennes entreprises.


    Comparaison avec le PEA Jeune :

    - Plafond de versement : Le PEA standard permet d''investir jusqu''à 150 000 €,
    alors que le PEA Jeune est limité à 20 000 €.

    - Public : Le PEA standard s''adresse à tout investisseur majeur, tandis que le
    PEA Jeune est réservé aux 18-25 ans rattachés au foyer fiscal de leurs parents.


    Choix recommandé :

    - Optez pour le PEA standard pour une stratégie diversifiée sur les marchés européens.

    - Optez pour le PEA-PME si vous souhaitez augmenter vos plafonds de versement
    et soutenir des entreprises à plus fort potentiel de croissance.

    - Optez pour le PEA Jeune pour initier votre épargne durant vos études.'
  domain: brokerage_investing
  product_category: pea
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 8070d467-a247-5fc9-ba4e-350272e39a5e
  title: Plan d'épargne en actions (PEA) — informations réglementaires
  body: 'Le Plan d''épargne en actions (PEA) est géré par Valbreuil Bourse conformément
    aux cadres réglementaires de l''Autorité des Marchés Financiers (AMF) et de l''Autorité
    de Contrôle Prudentiel et de Résolution (ACPR), dans le respect strict de la directive
    MiFID II.


    L''institution applique un processus d''évaluation de l''adéquation pour chaque
    client. Ce processus vise à s''assurer que les produits financiers sélectionnés
    correspondent aux connaissances, à l''expérience et aux objectifs d''investissement
    du détenteur du plan. L''absence de mise à jour de ce profil peut entraîner la
    suspension temporaire de certaines capacités de trading pour protéger le client.


    Concernant la sécurité des actifs :

    - Garantie du capital : Le capital investi sur un PEA n''est jamais garanti. La
    valeur des titres peut varier à la hausse comme à la baisse selon les conditions
    de marché.

    - Protection des actifs : En cas de défaillance de l''établissement, les titres
    sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à
    un montant de 70 000 euros.


    L''authentification forte et la vérification d''identité sont obligatoires pour
    toute action modifiant l''état du compte ou tout retrait de fonds. Valbreuil Bourse
    ne délivre aucun conseil fiscal ou juridique personnalisé. Les informations fournies
    sont à but pédagogique et ne constituent pas une garantie de rendement. Pour plus
    de détails sur les coûts, veuillez consulter la Plan d''épargne en actions (PEA)
    — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 4419ad8b-48b1-5211-b79f-efbe64792e71
  title: Plan d'épargne en actions (PEA) — grille des taux
  body: 'Valbreuil Bourse applique une politique tarifaire simplifiée et compétitive
    pour le Plan d''épargne en actions (PEA), basée sur un taux unique.


    - Taux de courtage : 0,2 %.


    Ce taux s''applique uniformément à toutes les opérations d''achat et de vente
    de titres au sein du PEA, quel que soit le montant de l''ordre ou le solde du
    compte. Il n''existe pas de structure de paliers ou de dégressivité selon le volume.


    Le taux de 0,2 % est prélevé au moment de l''exécution de l''ordre. Il couvre
    les frais de transaction et la sécurisation des titres. Ce taux peut être révisé
    périodiquement par Valbreuil Bourse en fonction des évolutions réglementaires
    ou des coûts de marché, sous réserve d''une notification préalable via la messagerie
    sécurisée. Pour l''ensemble des frais, dont les transferts, reportez-vous à la
    Plan d''épargne en actions (PEA) — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 16f3a709-ca41-5ece-823e-2436fec2d5e5
