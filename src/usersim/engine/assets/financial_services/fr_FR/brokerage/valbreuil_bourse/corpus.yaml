  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f9661ce9-0abd-5067-b6dd-a44ce4a556f4
  title: PEA Jeune — coûts et frais
  body: 'Question : Quels sont les frais appliqués lors de l''achat ou de la vente
    de titres sur mon PEA Jeune ?


    Réponse : Valbreuil Bourse applique un taux de frais de courtage unique de 0,2
    % sur le montant de chaque ordre exécuté. Ces frais sont prélevés lors du règlement-livraison
    de l''opération.


    Question : Y a-t-il des frais de gestion annuels ou des frais d''ouverture ?


    Réponse : Notre philosophie tarifaire vise la transparence et la compétitivité.
    Les frais de courtage de 0,2 % couvrent la sécurisation de vos actifs et le reporting
    réglementaire. Pour le détail complet des éventuels frais annexes, nous vous invitons
    à consulter la PEA Jeune — grille tarifaire.


    Question : Le plafond de 20 000 € inclut-il les frais de courtage ?


    Réponse : Non, le plafond de 20 000 € concerne uniquement les versements en numéraire
    effectués sur le plan. Les frais de courtage sont déduits de l''encours du compte
    et n''impactent pas votre capacité de versement.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: faq
