- id: 7d63b7a6-b4a8-5888-8af6-7f606668e50c
  title: Investissement programmé en ETF — effectuer une modification
  body: 'Ce guide vous accompagne dans la modification des paramètres de votre plan
    d''investissement automatisé.


    **Prérequis** : Votre compte doit être actif et votre authentification forte doit
    être opérationnelle.


    1. **Expression de la demande** : Indiquez-nous précisément l''élément que vous
    souhaitez modifier (le montant du versement, la fréquence des échéances ou la
    sélection des ETF).

    2. **Ajustement du montant** : Si vous modifiez le montant, veillez à ce que la
    nouvelle valeur respecte le seuil minimal de 25 €.

    3. **Validation de l''adéquation** : Si vous souhaitez modifier les ETF cibles,
    nous procéderons à une mise à jour de votre évaluation de l''adéquation pour vérifier
    que les nouveaux actifs correspondent toujours à votre profil de risque.

    4. **Confirmation sécurisée** : Vous recevrez une demande de validation via notre
    protocole d''authentification forte. Vous devrez confirmer l''opération pour que
    la modification soit actée.

    5. **Notification de succès** : Une fois la validation effectuée, nous vous confirmerons
    la prise en compte du changement ainsi que la date de la prochaine échéance modifiée.


    L''exécution de ces modifications reste soumise à des frais de 0 €, conformément
    à notre politique tarifaire sur les plans automatisés.'
