- id: 14b38b91-b829-5d9d-a12a-f56c4aba368f
  title: 'PEA-PME — plafond des versements : explications'
  body: 'Question : Quel est le montant maximal que je peux verser sur mon PEA-PME
    ?

    Réponse : Le plafond global des versements pour un PEA-PME est de 225 000 €. Ce
    montant représente la somme totale des apports effectués sur le plan, indépendamment
    de la valeur actuelle de votre portefeuille suite aux performances des marchés.


    Question : Le plafond du PEA-PME s''ajoute-t-il à celui d''un PEA classique ?

    Réponse : Oui, le plafond de 225 000 € du PEA-PME est distinct et s''ajoute au
    plafond du PEA classique. Cela permet une stratégie d''investissement globale
    plus ambitieuse pour les résidents français.


    Question : Que se passe-t-il si je tente de verser des fonds au-delà de ce seuil
    ?

    Réponse : Tout versement excédant le plafond de 225 000 € sera refusé lors de
    la validation de l''opération. Nous vous conseillons de surveiller vos apports
    cumulés pour éviter tout blocage transactionnel. Pour comprendre la structure
    globale de vos coûts, vous pouvez consulter la PEA-PME — grille tarifaire.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: d22c6a07-f3e9-5469-8fbe-62a3e98b4147
  title: PEA-PME — souscrire et activer
  body: 'L''ouverture d''un PEA-PME au sein de Valbreuil Bourse suit un processus
    rigoureux afin de garantir la conformité réglementaire et la sécurité de vos actifs.


    Avant de commencer, assurez-vous d''être résident fiscal français et de disposer
    d''une pièce d''identité valide ainsi que d''un justificatif de domicile récent.


    1. Expression de l''intention : Veuillez nous informer de votre volonté d''ouvrir
    un PEA-PME. Nous vous confirmerons alors la liste des documents requis pour l''étude
    de votre dossier.

    2. Vérification d''identité : Vous devrez nous transmettre vos documents d''identité.
    Nous procédons alors à une vérification rigoureuse et à l''application d''une
    authentification forte pour sécuriser l''accès futur à votre compte.

    3. Évaluation de l''adéquation : Vous devrez répondre à un questionnaire détaillé
    portant sur vos connaissances financières, votre expérience en investissement
    et vos objectifs. Cette étape, conforme à MiFID II, est indispensable pour valider
    que le produit est approprié à votre profil.

    4. Validation et Activation : Une fois le profil de risque validé par notre équipe,
    nous vous confirmerons l''activation de votre plan. Vous recevrez un avis d''ouverture
    précisant vos identifiants de compte.

    5. Premier Versement : Vous pouvez dès lors initier un virement depuis un compte
    courant à votre nom. Nous vous rappelons que vos versements totaux ne pourront
    excéder le plafond de 225 000 €.


    L''activation est considérée comme effective dès la réception de la confirmation
    d''ouverture. Pour comparer ce produit avec d''autres options, veuillez vous référer
    à PEA-PME — face à un produit similaire de l''établissement.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 6709ed74-dff0-5d64-bd68-79a150475129
  title: PEA-PME — grille tarifaire
  body: 'La tarification du PEA-PME chez Valbreuil Bourse est conçue pour allier compétitivité
    et transparence, conformément aux plafonds réglementaires en vigueur.


    Frais d''exécution (Courtage) :

    - Taux applicable par ordre : 0,2 %


    Frais de gestion des actifs :

    - Droits de garde : Gratuit


    Frais de transfert :

    - Transfert sortant de titres : Plafonné à 150 €


    Ces frais couvrent la sécurisation de vos actifs ainsi que l''ensemble du reporting
    réglementaire obligatoire. Aucun autre frais caché n''est appliqué sur l''ouverture
    ou la clôture du plan.'
