- id: bcdfec73-97a5-52ab-9907-70af7fa2163d
  title: PEA-PME — choisir entre les formules
  body: 'Le choix entre un PEA classique et un PEA-PME dépend principalement de vos
    objectifs d''investissement et de votre capacité de versement.


    Comparaison des caractéristiques :


    - Plafond de versement : Le PEA classique est limité à 150 000 €. Le PEA-PME offre
    une capacité étendue avec un plafond de 225 000 €, permettant d''investir davantage
    dans des entreprises de petite et moyenne taille.

    - Univers d''investissement : Le PEA classique se concentre sur les actions européennes
    cotées. Le PEA-PME permet l''intégration de titres de PME, souvent moins liquides
    mais offrant des perspectives de croissance différentes.

    - Coût : Les deux formules bénéficient de la rigueur tarifaire de Valbreuil Bourse,
    avec notamment un taux de frais de courtage de 0,2 % pour le PEA-PME.


    Lequel choisir ?


    Le PEA classique est recommandé pour les investisseurs privilégiant les grandes
    capitalisations européennes et des plafonds de versement standards.


    Le PEA-PME est l''option idéale pour les investisseurs avertis souhaitant soutenir
    le tissu entrepreneurial européen et optimiser leur fiscalité avec un plafond
    de versement plus élevé (225 000 €).'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 85b2ee69-7081-5089-9b2c-475ea9efbac9
  title: PEA-PME — confidentialité et protection des données
  body: 'Valbreuil Bourse s''engage à traiter vos données personnelles et financières
    avec la plus haute rigueur, conformément aux cadres réglementaires de l''AMF et
    de l''ACPR, ainsi qu''aux directives MiFID II.


    Collecte et Utilisation : Les données collectées lors de l''ouverture de votre
    PEA-PME, incluant l''évaluation de l''adéquation, sont utilisées exclusivement
    pour garantir que les produits financiers proposés correspondent à vos connaissances
    et objectifs. L''institution ne délivre aucun conseil fiscal ou juridique personnalisé
    et se limite à un standard de soin basé sur votre profil de risque.


    Sécurité des Actifs : Nous appliquons une authentification forte et une vérification
    d''identité rigoureuse pour tout retrait de fonds ou modification de compte. Vos
    titres sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR)
    jusqu''à un montant de 70 000 €.


    Transparence des Coûts : Toutes les tarifications, tel que le taux de frais de
    courtage de 0,2 % et le plafond des frais de transfert sortant de 150 €, sont
    communiquées de manière exhaustive pour éviter toute ambiguïté.


    Protection des Données : Vos informations sont conservées durant toute la durée
    de la relation contractuelle et conformément aux délais légaux de conservation
    des documents financiers. Vous disposez d''un droit d''accès et de rectification
    de vos données via notre messagerie sécurisée.


    Il est rappelé que le capital investi sur un PEA-PME n''est jamais garanti et
    que la valeur de vos investissements peut fluctuer à la baisse comme à la hausse.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: a6cccabc-a6fa-5dd9-a497-f5f949c251e0
  title: PEA-PME — reconnaître les arnaques visant ce produit
  body: 'L''attractivité des petites et moyennes entreprises (PME) peut être exploitée
    par des acteurs malveillants pour orchestrer des tentatives de fraude. Il est
    essentiel que vous sachiez identifier les signaux d''alerte spécifiques aux investissements
    dans les PME.


    Certaines arnaques reposent sur la promesse de rendements exceptionnels et garantis
    sur des titres de PME peu connus. Nous vous rappelons qu''au sein de Valbreuil
    Bourse, le capital investi n''est jamais garanti. Toute proposition affirmant
    le contraire, surtout si elle provient d''un tiers prétendant agir pour notre
    compte, doit être considérée comme frauduleuse.


    Soyez vigilants face aux tactiques suivantes :

    - L''urgence artificielle : un interlocuteur vous presse d''investir dans une
    PME pour « saisir une opportunité unique » avant la clôture d''une levée de fonds.

    - La demande de coordonnées confidentielles : Valbreuil Bourse ne vous demandera
    jamais votre mot de passe ou vos codes de sécurité via un message ou un appel
    téléphonique.

    - Les transferts vers des comptes tiers : toute demande de fonds vers un compte
    qui n''est pas celui de l''institution ou un compte de règlement officiel est
    suspecte.


    Si vous constatez une anomalie ou si vous avez un doute sur l''authenticité d''une
    communication, nous vous demandons de nous en informer immédiatement via notre
    messagerie sécurisée. En cas de suspicion avérée de fraude, nous procéderons au
    gel conservatoire de vos comptes pour protéger vos actifs.


    Pour plus de détails sur la sécurisation de vos accès, nous vous invitons à consulter
    le document PEA-PME — bonnes pratiques de sécurité du compte.'
  domain: brokerage_investing
  product_category: pea_pme
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: f9c323bb-76a3-5ee8-9967-365e3826b5de
  title: PEA-PME — plafonds, restrictions et cas particuliers
  body: 'Le PEA-PME est une enveloppe fiscale conçue pour encourager l''investissement
    dans les entreprises de taille intermédiaire et les petites entreprises. Ce produit
    est soumis à des règles strictes de plafonnement et d''éligibilité.


    Le plafond de versement est fixé à 225 000 €. Il est impératif de noter que ce
    montant correspond aux versements nets effectués et non à la valeur totale du
    portefeuille. Ainsi, si la valeur de vos actifs augmente grâce à la performance
    des marchés, le montant total de votre compte peut excéder les 225 000 € sans
    que cela ne constitue une infraction réglementaire.


    Restrictions et points de vigilance :

    - Éligibilité des titres : Seuls les titres répondant aux critères de PME définis
    par la réglementation fiscale française peuvent être logés dans cette enveloppe.
    L''achat d''un titre non éligible peut entraîner la perte de l''avantage fiscal
    ou le refus de l''opération.

    - Évaluation de l''adéquation : Conformément à MiFID II, l''ouverture et l''utilisation
    de ce produit nécessitent une évaluation de l''adéquation pour s''assurer que
    l''investissement dans des PME — souvent plus volatiles que les grandes capitalisations
    — correspond à votre profil de risque.

    - Protection des actifs : Bien que le capital investi ne soit pas garanti, vos
    titres sont protégés par le FGDR jusqu''à 70 000 euros.


    Pour toute question relative aux conditions d''ouverture, vous pouvez vous référer
    à PEA-PME — conditions d''éligibilité.'
  domain: brokerage_investing
  product_category: pea_pme
