- id: ee0644ee-91cd-566b-9e09-8a756f7d49e3
  title: PEA Jeune — informations réglementaires
  body: 'Le PEA Jeune est proposé par Valbreuil Bourse dans le respect strict des
    cadres réglementaires de l''Autorité des Marchés Financiers (AMF) et de l''Autorité
    de Contrôle Prudentiel et de Résolution (ACPR), conformément aux directives MiFID
    II.


    **Protection des Actifs**

    Nous vous informons que les titres détenus sur votre compte sont protégés par
    le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant de
    70 000 euros. Cette garantie s''applique en cas de défaillance de l''institution
    et couvre les actifs clients selon les modalités légales en vigueur.


    **Avertissements sur les Risques**

    L''investissement sur les marchés boursiers comporte des risques. Le capital investi
    sur votre PEA Jeune n''est jamais garanti. La valeur de vos titres peut fluctuer
    à la hausse comme à la baisse en fonction de la conjoncture économique et des
    performances des entreprises. Vous pouvez perdre une partie ou la totalité des
    sommes investies.


    **Limites de Conseil**

    Valbreuil Bourse fournit une éducation financière et vérifie la pertinence des
    produits via l''évaluation de l''adéquation, mais ne délivre aucun conseil fiscal
    ou juridique personnalisé. Nous ne garantissons aucun rendement futur. L''agent
    s''en tient à un standard de soin basé sur le profil de risque établi lors de
    votre souscription.


    **Sécurisation et Vérification**

    Toute action modifiant l''état du compte, tel qu''un retrait de fonds ou un changement
    de coordonnées, est soumise à une authentification forte et une vérification d''identité
    rigoureuse. Aucun changement ne sera effectué sans validation sécurisée préalable.


    Pour toute question sur la gestion des risques, vous pouvez consulter PEA Jeune
    — opération échouée ou en attente.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: a26bbf05-b3aa-58b8-bf75-c6a1df44f0d3
  title: PEA Jeune — grille des taux
  body: 'La politique tarifaire de Valbreuil Bourse pour le PEA Jeune est conçue pour
    être transparente et compétitive, sans frais de gestion cachés.


    **Taux de courtage**

    Un taux unique de frais de courtage de 0,2 % s''applique à l''ensemble des ordres
    d''achat et de vente exécutés sur le plan. Ce taux est identique pour tous les
    clients, indépendamment du montant de l''ordre ou du volume total des actifs détenus.


    **Application du taux**

    Ce taux est calculé sur la valeur nominale de l''opération. Par exemple, pour
    un achat de titres d''une valeur de 1 000 €, les frais de courtage s''élèveront
    à 2 €.


    **Conditions de modification**

    Le taux de courtage peut être révisé périodiquement pour refléter l''évolution
    des coûts de marché ou des contraintes réglementaires. Toute modification vous
    sera notifiée par messagerie sécurisée avec un préavis conforme aux conditions
    générales du contrat.'
  domain: brokerage_investing
  product_category: pea_jeune
  document_type: rate_sheet
  source_authority: official
