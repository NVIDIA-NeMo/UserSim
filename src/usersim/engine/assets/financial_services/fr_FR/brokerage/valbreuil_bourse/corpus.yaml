- id: fb7b7de4-85cd-5d96-b340-71084b7287d2
  title: Compte-titres ordinaire — problèmes d'accès ou de connexion
  body: 'Symptôme : Le client ne parvient pas à accéder à son interface de gestion
    de Compte-titres ordinaire ou reçoit un message d''erreur lors de la connexion.


    Causes probables et vérifications :


    1. Échec de l''authentification forte : Vérifiez que le dispositif d''authentification
    est correctement synchronisé. Si le code de sécurité est refusé, tentez une nouvelle
    demande de code.


    2. Compte gelé conservatoirement : Si une activité suspecte a été détectée, Valbreuil
    Bourse peut geler le compte pour protéger les actifs. Dans ce cas, l''accès est
    restreint jusqu''à vérification d''identité complète.


    3. Maintenance réglementaire : Des interruptions temporaires peuvent survenir
    lors de mises à jour des systèmes de reporting conformes à MiFID II.


    Résolution :


    - Réinitialisation sécurisée : Si l''accès est bloqué, demandez-nous une procédure
    de réinitialisation. Celle-ci exigera une vérification d''identité rigoureuse
    avant tout rétablissement d''accès.


    - Escalade : Si le problème persiste après la vérification d''identité, nous escaladerons
    la demande vers la direction des opérations. Vous recevrez un accusé de réception
    immédiat et le problème sera traité selon un délai de résolution normé.


    Pour les utilisateurs comparant nos services, notez que notre rigueur en matière
    d''accès reflète notre engagement envers la sécurité des actifs, protégés par
    le FGDR jusqu''à 70 000 €.'
  domain: brokerage_investing
  product_category: compte_titres
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: valbreuil_bourse
- id: 1dc3415e-0437-5a03-b6dc-d37eb5face49
  title: Compte-titres ordinaire — niveaux d'accès
  body: 'Le Compte-titres ordinaire est accessible selon les critères d''éligibilité
    suivants :


    | Condition | Exigence | Résultat d''accès |

    | :--- | :--- | :--- |

    | Résidence fiscale | Résident français | Éligible |

    | Profil investisseur | Averti ou jeune actif | Éligible |

    | Vérification d''identité | KYC complet et validé | Accès autorisé |

    | Authentification | Activation de l''authentification forte | Accès opérationnel
    |

    | Conformité MiFID II | Évaluation de l''adéquation complétée | Autorisation de
    trading |


    Note pour l''agent : Le Compte-titres ordinaire n''a aucun plafond de versement,
    contrairement au PEA. Si le client ne remplit pas les critères de l''évaluation
    de l''adéquation pour certains produits complexes, l''accès à ces instruments
    spécifiques peut être restreint malgré l''ouverture du compte.'
