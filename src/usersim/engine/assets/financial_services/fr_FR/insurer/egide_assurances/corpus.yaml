  mentions_tools: []
  institution_id: egide_assurances
- id: 82f1947c-3bc0-5ab1-8ec2-ad1231b9d290
  title: Assurance auto Égide — face à une offre concurrente type
  body: 'Face à une offre d''assurance automobile classique, l''Assurance auto Égide
    se distingue par son modèle coopératif. Contrairement aux assureurs traditionnels,
    nous traitons nos assurés comme des sociétaires, privilégiant l''éthique et la
    transparence sur la maximisation des profits.


    Comparaison des dimensions clés :

    - Statut : Chez nous, vous êtes associé (sociétaire) ; chez un concurrent, vous
    êtes un simple client.

    - Transparence des frais : Nos frais sont justifiés par la maintenance d''une
    infrastructure sécurisée et l''équité mutuelle, sans frais cachés.

    - Bonus : Nous proposons un système optimisé avec un bonus maximal de 50 % pour
    récompenser durablement la prudence.

    - Franchise : Nous appliquons une franchise claire de 300 € en tous risques, sans
    options complexes et ambiguës.


    L''offre concurrente peut être préférable pour des besoins très spécifiques de
    niches non couvertes par notre modèle mutuel. Cependant, pour un conducteur recherchant
    un partenaire de confiance, une gestion rapide des sinistres et une structure
    tarifaire équitable, l''Assurance auto Égide est le choix privilégié.'
  domain: insurance
  product_category: assurance_auto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a3c56323-8a63-5d01-818a-1eedf205dc05
  title: Assurance auto Égide — informations sur les risques
  body: 'Ce document présente les risques et obligations liés à la détention d''un
    contrat Assurance auto Égide. Nous opérons sous la surveillance de l''ACPR et
    respectons strictement le Code des assurances.


    Risques liés aux délais de déclaration :

    Le respect du calendrier est impératif pour la validité des garanties. Tout sinistre
    doit être déclaré dans un délai de 5 jours ouvrés. Le dépassement de ce délai
    peut entraîner une déchéance de garantie ou une réduction significative de l''indemnisation,
    selon la nature du sinistre.


    Risques liés au bonus-malus :

    Le bénéfice du bonus maximal de 50 % est conditionné par l''absence de sinistres
    responsables. Tout accident peut entraîner une augmentation du coefficient de
    malus, et donc une hausse de la cotisation annuelle (dont l''exemple de base est
    de 640 €).


    Risques financiers :

    En cas de dommages matériels couverts par la formule tous risques, le sociétaire
    doit être conscient que la franchise de 300 € reste systématiquement à sa charge.
    Cette somme est déduite de l''indemnisation finale.


    Nous fournissons une éducation financière générale sur nos produits, mais nous
    ne délivrons aucun conseil fiscal, juridique ou médical personnalisé. Nous invitons
    nos sociétaires à se rapprocher d''experts certifiés pour ces besoins spécifiques.'
  domain: insurance
  product_category: assurance_auto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 872b142e-05d2-5928-a579-148fac34109b
  title: Assurance auto Égide — calcul et application des taux
  body: "Le calcul des cotisations de l'Assurance auto Égide repose sur la transparence\
    \ et l'équité entre sociétaires. \n\nLa prime annuelle est déterminée par la combinaison\
    \ d'une prime de base (liée au véhicule et au profil du conducteur) et du coefficient\
    \ de bonus-malus. À titre d'illustration, une configuration standard peut aboutir\
    \ à une cotisation annuelle de 640 €.\n\nApplication du bonus :\nLe système de\
    \ bonus réduit la prime de base selon la sinistralité du conducteur. Le bonus\
    \ maximal applicable est de 50 %. Ce taux est crédité annuellement lors de la\
    \ date anniversaire du contrat après analyse du dossier de sinistres.\n\nFacteurs\
    \ de modification :\n- Sinistre responsable : Augmentation du coefficient de malus,\
    \ entraînant une hausse de la prime.\n- Année sans sinistre : Amélioration du\
    \ bonus, jusqu'à la limite des 50 %.\n- Changement de véhicule : Recalcul de la\
    \ prime de base selon la valeur et la puissance du nouveau véhicule.\n\nL'authentification\
    \ forte du sociétaire est requise pour toute demande de modification de taux ou\
    \ de contrat."
  domain: insurance
  product_category: assurance_auto
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: cbac0a54-c473-58b3-b0bd-15c3cc1fa8c1
  title: Assurance auto Égide — offre de parrainage et de fidélité
  body: "Parce que la confiance est le socle de notre modèle coopératif, nous avons\
    \ le plaisir de proposer à nos sociétaires un programme de parrainage et de fidélité\
    \ exclusif pour l'Assurance auto Égide. \n\nDu 1er mars 2025 au 31 août 2025,\
    \ pour chaque nouveau sociétaire que vous nous recommandez et qui souscrit un\
    \ contrat, nous vous offrons une remise exceptionnelle de 50 € sur votre prochaine\
    \ cotisation annuelle. Le nouveau sociétaire bénéficie également d'une réduction\
    \ de bienvenue de 50 € sur sa première prime.\n\nCette offre s'inscrit dans notre\
    \ volonté de privilégier la transparence et l'éthique. Pour illustrer le coût\
    \ de notre couverture, sachez qu'une cotisation annuelle indicative peut s'élever\
    \ à 640 € selon le profil du conducteur. En rejoignant Égide Assurances, vous\
    \ ne choisissez pas seulement une protection fiable, mais vous devenez membre\
    \ d'une mutuelle où chaque sociétaire participe à la pérennité de notre modèle."
  domain: insurance
  product_category: assurance_auto
