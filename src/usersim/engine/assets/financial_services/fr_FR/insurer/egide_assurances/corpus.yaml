  body: 'L''accès à l''Assurance habitation Égide est ouvert selon les critères suivants
    :


    | Profil du demandeur | Condition d''éligibilité | Résultat |

    | :--- | :--- | :--- |

    | Particulier / Famille | Résider en France et posséder ou louer un logement |
    Éligible |

    | Locataire | Fournir un justificatif de domicile et l''adresse du bien | Éligible
    |

    | Propriétaire | Fournir le titre de propriété ou acte notarié | Éligible |

    | Personne morale | Usage strictement professionnel hors cadre résidentiel | Non
    éligible (voir offres entreprises) |

    | Profil avec antécédents | Déclaration sincère des sinistres passés | Éligible
    (tarification ajustée) |


    **Condition impérative de validité** : Pour que le contrat soit effectif et que
    les garanties (incluant la franchise standard de 150 €) s''appliquent, le sociétaire
    doit impérativement avoir passé l''étape de vérification rigoureuse de l''identité.'
