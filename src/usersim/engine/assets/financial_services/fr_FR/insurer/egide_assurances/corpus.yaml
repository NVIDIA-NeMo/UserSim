- id: 92d2b941-7793-5ba5-9075-d5c6accae144
  title: Contrat d'assurance-vie Égide Multisupport — consulter le suivi ou l'historique
  body: 'Nous accompagnons nos sociétaires dans la gestion transparente de leur épargne.
    Voici la procédure pour obtenir le suivi détaillé ou l''historique de vos opérations
    sur votre Contrat d''assurance-vie Égide Multisupport.


    **Prérequis**

    Pour accéder à vos données, vous devez disposer de vos identifiants de connexion
    sécurisés et avoir complété l''authentification forte.


    **Étapes de consultation**


    1. **Demandez l''accès à vos relevés** : Indiquez-nous que vous souhaitez consulter
    l''historique de vos versements ou les relevés annuels de votre contrat.

    2. **Vérification d''identité** : Nous procéderons à une vérification rigoureuse
    de votre identité conformément à nos protocoles de sécurité. C''est une étape
    obligatoire avant tout accès aux données financières.

    3. **Sélection de la période** : Précisez la période concernée (année civile ou
    date spécifique) ainsi que le type de document souhaité (historique des mouvements
    ou valeur liquidative).

    4. **Réception des documents** : Nous vous transmettons vos relevés via votre
    portail client numérique ou par email sécurisé.


    **Comment savoir si la demande a réussi ?**

    L''opération est réussie lorsque vous recevez la notification de mise à disposition
    des documents sur votre espace personnel ou le fichier PDF joint à notre email
    de confirmation. Vous pourrez alors vérifier vos soldes, les intérêts crédités
    (comme le taux de 2,6 % sur le fonds en euros) et les frais prélevés.


    Si vous constatez une erreur dans vos documents, veuillez consulter le document
    Contrat d''assurance-vie Égide Multisupport — écart avec vos relevés.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: eeaf8e94-9e62-5d4e-8134-c5ea605bd070
  title: Contrat d'assurance-vie Égide Multisupport — opération refusée ou bloquée
  body: 'Il peut arriver que vous rencontriez un blocage lors d''une demande de retrait
    ou de transfert sur votre Contrat d''assurance-vie Égide Multisupport. Voici comment
    identifier la cause et résoudre la situation.


    **Symptômes courants**

    - Message indiquant que l''opération ne peut aboutir.

    - Demande de documents complémentaires répétée.

    - Blocage lors de la validation finale d''un rachat.


    **Causes probables et vérifications**


    1. **Échec de l''authentification** : La cause la plus fréquente est une rupture
    dans la chaîne de vérification d''identité. Nous exigeons une authentification
    forte pour tout retrait. Vérifiez que vos justificatifs d''identité sont à jour
    et conformes.

    2. **Seuil de versement non atteint** : Pour les ouvertures de contrat, assurez-vous
    que le versement initial est bien de 500 € minimum. Un montant inférieur entraîne
    le blocage automatique de la souscription.

    3. **Incohérence des coordonnées bancaires** : Si le compte de destination n''est
    pas au nom du sociétaire, l''opération sera bloquée pour prévenir la fraude.


    **Résolution**

    - **Pour l''identité** : Fournissez-nous une copie lisible et valide de votre
    pièce d''identité. Nous validerons le document et débloquerons l''opération.

    - **Pour le montant** : Ajustez votre versement pour atteindre le minimum de 500
    €.


    **Escalade**

    Si le blocage persiste malgré la conformité de vos documents, nous escaladerons
    votre dossier vers un gestionnaire spécialisé qui analysera la situation sous
    48 heures ouvrables. En dernier recours, vous pouvez solliciter la Médiation de
    l''assurance.


    Pour des problèmes de connexion technique, reportez-vous au document Contrat d''assurance-vie
    Égide Multisupport — problèmes d''accès ou de connexion.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 4f8d989e-d466-5dfe-a777-1316313db97d
  title: Contrat d'assurance-vie Égide Multisupport — quand changer ou monter en gamme
  body: "Ce guide aide les gestionnaires à conseiller les sociétaires sur l'évolution\
    \ de leur stratégie d'épargne au sein de notre gamme.\n\nLe Contrat d'assurance-vie\
    \ Égide Multisupport est idéal pour ceux qui recherchent un équilibre entre sécurité\
    \ (fonds en euros à 2,6 %) et croissance (unités de compte avec frais de 0,85\
    \ %). \n\n**Quand suggérer une évolution ou un changement ?**\n\n- **Besoin de\
    \ fiscalité optimisée pour la retraite** : Si le sociétaire souhaite déduire ses\
    \ versements de son revenu imposable, le PER individuel Égide est une alternative\
    \ supérieure. L'assurance-vie privilégie la disponibilité des fonds, tandis que\
    \ le PER optimise la fiscalité à l'entrée.\n- **Profil de risque très conservateur**\
    \ : Si le sociétaire est incapable d'accepter toute fluctuation de capital, une\
    \ concentration exclusive sur le fonds en euros est préférable, bien que le contrat\
    \ Multisupport permette déjà cette gestion.\n- **Besoin de liquidité immédiate\
    \ et sans frais** : Bien que notre contrat soit flexible, un compte d'épargne\
    \ classique peut être plus approprié pour des fonds devant être mobilisés dans\
    \ un délai très court, malgré un rendement inférieur à nos 2,6 %.\n\n**Résumé\
    \ du choix**\n- **Contrat Multisupport** : Pour la flexibilité, la transmission\
    \ et un mix sécurité/croissance.\n- **PER Individuel** : Pour la préparation de\
    \ la retraite et l'avantage fiscal immédiat.\n\nPour plus de détails sur les différences\
    \ structurelles, consultez le document Contrat d'assurance-vie Égide Multisupport\
    \ — face à un produit similaire de l'établissement."
