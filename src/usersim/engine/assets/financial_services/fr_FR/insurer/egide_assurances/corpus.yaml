- id: 40faad6b-80ad-56fb-afe0-68ec6b806a44
  title: Contrat d'assurance-vie Égide Multisupport — comparaison avec les alternatives
    et quand ne pas le choisir
  body: "Pour choisir le support d'épargne adapté, il est essentiel de comprendre\
    \ où se positionne le Contrat d'assurance-vie Égide Multisupport par rapport aux\
    \ autres options du marché.\n\n**Points forts du contrat Multisupport**\nNotre\
    \ solution allie la sécurité du fonds en euros, avec un taux de 2,6 %, et le potentiel\
    \ de croissance des unités de compte. Elle se distingue par sa transparence tarifaire\
    \ : des frais d'entrée de 1 %, des frais de gestion du fonds en euros de 0,6 %\
    \ et des frais de gestion des unités de compte de 0,85 %.\n\n**Comparaison avec\
    \ les alternatives**\n- **Livrets réglementés** : Plus sécurisés et liquides,\
    \ mais offrant généralement un rendement inférieur à notre taux de 2,6 %. \n-\
    \ **Produits 100 % Unités de Compte** : Peuvent offrir des rendements plus élevés,\
    \ mais sans le filet de sécurité du fonds en euros et avec des frais de gestion\
    \ souvent plus opaques.\n- **PER (Plan d'Épargne Retraite)** : Le PER offre un\
    \ avantage fiscal sur les versements que l'assurance-vie n'a pas, mais les fonds\
    \ sont bloqués jusqu'à la retraite (sauf cas exceptionnels).\n\n**Quand NE PAS\
    \ choisir ce produit ?**\nNous vous déconseillons ce contrat dans les situations\
    \ suivantes :\n- **Budget initial insuffisant** : Si vous ne pouvez pas effectuer\
    \ le versement initial minimum de 500 €, ce produit ne pourra pas être ouvert.\n\
    - **Aversion totale au risque** : Si la simple mention de « risque de perte en\
    \ capital » vous inquiète, bien que vous puissiez rester sur le fonds en euros,\
    \ un produit strictement garanti serait plus rassurant.\n- **Besoin de conseils\
    \ fiscaux personnalisés** : Nous fournissons une éducation financière, mais nous\
    \ ne délivrons aucun conseil fiscal personnalisé. Si votre stratégie nécessite\
    \ une ingénierie fiscale complexe, nous vous renvoyons vers un expert certifié.\n\
    \nPour comprendre les risques liés aux supports, consultez le document Contrat\
    \ d'assurance-vie Égide Multisupport — informations sur les risques."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 8b3bd40d-72c9-5f1d-a938-1ed3b33d30bb
  title: 'Contrat d''assurance-vie Égide Multisupport — versement initial minimum
    : explications'
  body: 'Pourquoi un montant minimum est-il requis pour ouvrir mon contrat ?


    **Quel est le montant minimum ?**

    Pour souscrire au Contrat d''assurance-vie Égide Multisupport, un versement initial
    minimum de 500 € est requis.


    **Pourquoi cette exigence ?**

    Ce seuil nous permet de garantir la viabilité économique du contrat et d''assurer
    une gestion active et sécurisée de vos fonds dès le premier jour. En tant que
    mutuelle, nous veillons à ce que la structure tarifaire, incluant les frais d''entrée
    de 1 %, soit équilibrée pour tous les sociétaires.


    **Puis-je verser moins plus tard ?**

    Une fois le contrat ouvert avec les 500 € initiaux, les versements complémentaires
    sont libres et n''ont pas de montant minimum imposé, vous permettant d''alimenter
    votre épargne selon vos capacités.


    Pour plus d''informations sur les frais liés aux versements, nous vous invitons
    à consulter le document Contrat d''assurance-vie Égide Multisupport — frais sur
    versements : explications.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 5c6794b3-4d35-54cb-8dae-1f52f672c40b
  title: Contrat d'assurance-vie Égide Multisupport — traiter une demande courante
    de bout en bout
  body: 'Nous simplifions vos opérations pour vous offrir une expérience sereine.
    Voici comment traiter une demande de rachat partiel (retrait d''une partie de
    votre épargne) sur votre Contrat d''assurance-vie Égide Multisupport.


    **Prérequis**

    - Votre contrat doit être actif.

    - Vous devez avoir un solde disponible supérieur au montant demandé.


    **Étapes de traitement**


    1. **Expression du besoin** : Indiquez-nous le montant exact que vous souhaitez
    racheter et précisez si ce retrait doit être effectué sur le fonds en euros (taux
    de 2,6 %) ou sur vos unités de compte.

    2. **Vérification de sécurité** : Nous procédons à une authentification forte.
    Vous devrez confirmer votre identité via la méthode sécurisée convenue pour valider
    que vous êtes bien l''auteur de la demande.

    3. **Calcul et confirmation** : Nous vous confirmons le montant net qui vous sera
    versé après déduction d''éventuels frais ou fiscalité applicable. Nous vous rappelons
    que les retraits sur unités de compte peuvent varier selon la valeur du marché
    au moment de l''ordre.

    4. **Exécution du transfert** : Une fois votre accord final reçu, nous procédons
    au transfert des fonds vers le compte bancaire enregistré à votre nom.


    **Comment savoir si l''opération a réussi ?**

    Le processus est terminé lorsque vous recevez un avis d''exécution d''opération
    sur votre portail client et que les fonds apparaissent sur votre compte bancaire
    (selon les délais interbancaires habituels).


    Pour toute question sur les frais appliqués lors de vos mouvements, veuillez consulter
    le document Contrat d''assurance-vie Égide Multisupport — grille tarifaire.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 315a42d1-b0f2-5c8d-a7a2-018c3336b764
  title: Contrat d'assurance-vie Égide Multisupport — écart avec vos relevés
  body: 'Ce guide est destiné aux gestionnaires pour résoudre les situations où un
    sociétaire signale un écart entre la valeur attendue de son Contrat d''assurance-vie
    Égide Multisupport et le solde indiqué sur ses relevés.


    **Symptômes signalés par le sociétaire**

    - « Mon solde est inférieur à ce que j''avais calculé avec le taux de 2,6 %. »

    - « Je ne comprends pas la baisse de valeur de mon capital. »

    - « Le montant après versement semble incorrect. »


    **Causes probables et points de vérification**


    1. **Prélèvement des frais de gestion** : Vérifiez si les frais de gestion annuels
    ont été prélevés. Pour le fonds en euros, ils sont de 0,6 % et pour les unités
    de compte, ils sont de 0,85 %. Ces frais sont prélevés régulièrement et peuvent
    créer un décalage visuel.

    2. **Frais d''entrée** : Si le sociétaire vient d''effectuer un versement, rappelez-lui
    que des frais d''entrée de 1 % sont appliqués. Un versement de 1 000 € n''augmentera
    donc le capital que de 990 €.

    3. **Fluctuation des Unités de Compte** : Si le contrat contient des unités de
    compte, l''écart est souvent dû à la variation des marchés. Rappelez au sociétaire
    que ces supports exposent à un risque de perte en capital.

    4. **Date de valeur** : Vérifiez que le relevé consulté correspond à la date de
    valeur et non à la date d''opération.


    **Résolution**

    - **Explication pédagogique** : Détaillez le calcul : (Versement - Frais d''entrée)
    + Intérêts - Frais de gestion.

    - **Simulation** : Fournissez un décompte précis des mouvements sur la période
    concernée.


    **Escalade**

    Si l''écart persiste après ces vérifications et semble provenir d''une erreur
    technique de calcul, escaladez le dossier vers le service comptabilité pour un
    audit du compte. Le sociétaire doit être informé du délai de traitement (généralement
    5 jours ouvrés).'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: f403b73f-ea51-5ccf-82bc-087c670c7d49
  title: PER individuel Égide — présentation
  body: 'Bienvenue chez Égide Assurances. En tant que société d''assurance mutuelle,
    nous concevons nos solutions pour accompagner durablement nos sociétaires. Le
    PER individuel Égide est un produit d''épargne retraite conçu pour vous permettre
    de constituer un capital ou une rente pour vos vieux jours, tout en optimisant
    votre fiscalité actuelle.


    Notre modèle coopératif nous permet de vous offrir un partenariat de confiance,
    basé sur la transparence et l''éthique. Le PER individuel Égide se distingue par
    sa flexibilité et son cadre fiscal avantageux : les versements effectués sur votre
    contrat sont déductibles de votre revenu imposable, dans la limite d''un plafond
    annuel. Selon votre situation, ce plafond de déduction peut varier, s''étendant
    d''un minimum de 4 710 € jusqu''à un maximum de 37 680 €.


    Pour garantir la pérennité de notre modèle mutuel et la maintenance d''une infrastructure
    sécurisée, nous appliquons une structure tarifaire transparente :

    - Des frais sur versements de 1,5 % sont prélevés lors de chaque apport sur le
    contrat.

    - Des frais de gestion annuels de 0,8 % sont appliqués pour assurer le suivi actif
    de vos fonds.


    Nous vous rappelons que nous fournissons une éducation financière générale et
    des informations sur nos produits, mais que nous ne garantissons aucune performance
    future. Pour tout besoin de conseil fiscal ou juridique personnalisé, nous vous
    invitons à consulter un expert certifié.


    En choisissant le PER individuel Égide, vous devenez sociétaire de notre mutuelle,
    participant ainsi à une gouvernance partagée où l''intérêt du collectif prime
    sur la recherche de profit. Nous nous engageons à traiter votre dossier avec la
    plus grande rigueur, en respectant strictement le Code des assurances et la protection
    de vos données.'
  domain: insurance
  product_category: per_individuel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 38cc76ad-7b44-5caf-8716-ced6318afdf4
  title: 'PER individuel Égide — frais sur versements : explications'
  body: 'L''une des questions les plus fréquentes de nos sociétaires concerne la nature
    des frais appliqués lors des apports sur le PER individuel Égide. Voici les éclaircissements
    nécessaires.


    **Pourquoi appliquons-nous des frais sur versements ?**

    Nous appliquons des frais sur versements de 1,5 % sur chaque somme versée sur
    votre contrat. Ces frais sont justifiés par la mise en place administrative de
    vos investissements et la sécurisation des flux financiers. Conformément à notre
    philosophie de transparence, ces frais sont prélevés directement lors de la transaction,
    garantissant ainsi l''équité entre tous les sociétaires.


    **Comment ces frais impactent-ils mon épargne ?**

    Si vous effectuez un versement de 1 000 €, les frais de 1,5 % représentent 15
    €. Par conséquent, c''est un montant net de 985 € qui sera investi sur vos supports.
    Cette structure permet de couvrir les coûts opérationnels immédiats sans peser
    sur la performance à long terme de vos fonds.


    Pour plus de détails sur l''ensemble de nos tarifs, nous vous invitons à consulter
    le document PER individuel Égide — grille tarifaire.'
  domain: insurance
  product_category: per_individuel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 144d5c77-f3c9-5a5c-b2ff-5ee647bd92e3
  title: PER individuel Égide — souscrire et activer
  body: 'Souscrire au PER individuel Égide est une démarche simple qui s''inscrit
    dans une volonté de préparer sereinement votre avenir. Voici les étapes à suivre
    pour activer votre contrat.


    **Prérequis**

    Avant de commencer, munissez-vous d''une pièce d''identité valide, d''un justificatif
    de domicile récent et de vos dernières informations fiscales pour optimiser vos
    plafonds de déduction.


    **Étape 1 : Expression de vos besoins**

    Indiquez-nous vos objectifs de retraite, votre horizon d''investissement et le
    montant que vous souhaitez verser initialement. Nous analyserons avec vous la
    cohérence de ce projet avec votre situation financière.


    **Étape 2 : Vérification d''identité et conformité**

    Nous procédons à une vérification rigoureuse de votre identité. Cette authentification
    forte est obligatoire pour garantir la sécurité de vos futures opérations et conformément
    à nos obligations légales.


    **Étape 3 : Choix de la stratégie d''investissement**

    Nous définissons ensemble la répartition de vos fonds entre les différents supports.
    Vous serez informé des risques associés, notamment pour les supports dont la valeur
    peut varier.


    **Étape 4 : Signature et validation**

    Nous vous transmettons le contrat own et les mentions légales. Une fois le document
    signé et les fonds reçus, nous validons l''ouverture du compte.


    **Étape 5 : Confirmation d''activation**

    Vous recevrez une confirmation écrite indiquant la date d''effet du contrat et
    le montant net investi après déduction des frais sur versements de 1,5 %.


    Une fois votre contrat actif, vous pourrez suivre l''évolution de votre épargne
    via notre portail client numérique. Pour comprendre les implications fiscales
    de vos versements, nous vous suggérons de consulter PER individuel Égide — conditions
    d''éligibilité.'
  domain: insurance
  product_category: per_individuel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 164b0467-2f6a-5734-9a3c-80ba5d2aaf40
  title: PER individuel Égide — grille tarifaire
  body: 'Ce document détaille l''ensemble des frais applicables au PER individuel
    Égide. Ces tarifs sont transparents et justifiés par la gestion active des fonds
    et la maintenance de notre infrastructure sécurisée.


    **Frais de souscription et versements**

    - Frais sur versements : 1,5 %


    **Frais de gestion et d''encadrement**

    - Frais de gestion annuels : 0,8 %


    **Frais de transfert**

    - Frais de transfert (pour tout transfert intervenant avant 5 ans d''ancienneté
    du contrat) : 1 %


    L''application de ces frais garantit l''équité entre tous les sociétaires et la
    pérennité de notre modèle mutuel. Toute modification de cette grille tarifaire
    fera l''objet d''une information préalable auprès de nos assurés.'
  domain: insurance
  product_category: per_individuel
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a9378ee1-79c4-570a-bb62-aa8e8612b329
  title: PER individuel Égide — opération échouée ou en attente
  body: 'Il peut arriver qu''un versement ou une demande de transfert sur votre PER
    individuel Égide ne soit pas traité instantanément. Voici comment identifier l''origine
    du problème et le résoudre.


    **Symptôme : Le versement n''apparaît pas sur le relevé**

    Si vous avez effectué un virement et que le solde n''est pas mis à jour, vérifiez
    les points suivants :

    1. **Délai interbancaire** : Un délai de 2 à 5 jours ouvrés est normal pour la
    réception et l''enregistrement des fonds.

    2. **Conformité des informations** : Assurez-vous que le libellé du virement comporte
    bien votre numéro de contrat.

    3. **Vérification d''identité** : Si nous avons détecté une anomalie lors de la
    transaction, nous avons pu suspendre l''opération pour votre sécurité.


    **Symptôme : Demande de transfert vers un autre organisme en attente**

    Un transfert de PER peut prendre plusieurs semaines en raison des délais de traitement
    des institutions concernées. Si le délai dépasse 30 jours :

    - Vérifiez que nous avons reçu l''intégralité des documents requis pour l''authentification
    forte.

    - Assurez-vous que le contrat d''accueil a bien validé la réception du dossier.


    **Résolution et Escalade**

    Nous résolvons la majorité de ces incidents lors de votre demande. Si l''opération
    est bloquée pour un motif technique complexe, nous escaladons votre dossier vers
    un gestionnaire spécialisé. Vous recevrez alors une notification par email précisant
    le délai de résolution prévu.


    En cas de litige persistant après l''intervention du gestionnaire, nous vous rappelons
    que vous pouvez solliciter la Médiation de l''assurance pour un arbitrage impartial.'
  domain: insurance
  product_category: per_individuel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c70a7f10-5d12-57db-af8f-fb986709a32a
  title: PER individuel Égide — conditions d'éligibilité
  body: 'Le PER individuel Égide est accessible à tout particulier souhaitant préparer
    sa retraite. Toutefois, l''accès aux avantages fiscaux dépend de critères précis.


    | Condition | Impact / Résultat |

    | :--- | :--- |

    | Résidence fiscale en France | Éligibilité complète au produit et aux déductions
    fiscales. |

    | Revenus imposables | Permet la déduction des versements du revenu imposable.
    |

    | Plafond de déduction atteint | Les versements au-delà du plafond maximal de
    37 680 € ne sont plus déductibles. |

    | Plafond de déduction non atteint | Possibilité de déduire les versements jusqu''à
    la limite applicable (minimum 4 710 €). |

    | Mineur | Ouverture possible avec accord des représentants légaux. |


    Nous rappelons que nous ne délivrons aucun conseil fiscal personnalisé. Nous vous
    invitons à vous rapprocher d''un expert certifié pour calculer précisément votre
    plafond de déduction annuel.'
  domain: insurance
  product_category: per_individuel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 312c92d5-c843-5a78-85b9-cc635dd19287
  title: PER individuel Égide — face à un produit similaire de l'établissement
  body: 'Le PER individuel Égide et le Contrat d''assurance-vie Égide Multisupport
    sont deux outils d''épargne, mais ils répondent à des objectifs distincts.


    **Comparaison des axes majeurs**


    - **Disponibilité des fonds** : L''assurance-vie offre une liquidité totale à
    tout moment. À l''inverse, le PER individuel Égide bloque les fonds jusqu''à la
    retraite (sauf cas de déblocage anticipé réglementaires).

    - **Fiscalité à l''entrée** : Le PER individuel Égide permet de déduire les versements
    du revenu imposable (plafond jusqu''à 37 680 €), offrant un gain fiscal immédiat.
    L''assurance-vie ne propose pas d''avantage fiscal sur les versements.

    - **Coût** : Le PER individuel Égide applique des frais sur versements de 1,5
    % et des frais de gestion de 0,8 %.


    **Lequel choisir ?**

    - **PER individuel Égide** : Idéal pour les contribuables fortement imposés souhaitant
    réduire leur impôt tout en préparant leur retraite.

    - **Contrat d''assurance-vie Égide Multisupport** : Préférable pour ceux qui souhaitent
    constituer une épargne disponible pour des projets à court ou moyen terme.


    Pour plus de détails sur l''alternative, consultez le document Contrat d''assurance-vie
    Égide Multisupport — présentation.'
  domain: insurance
  product_category: per_individuel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 3f11f4b1-02c3-5e2b-939a-3d33679a291d
  title: PER individuel Égide — informations réglementaires
  body: 'Égide Assurances opère sous la surveillance rigoureuse de l''Autorité de
    Contrôle Prudentiel et de Résolution (ACPR) et respecte strictement les dispositions
    du Code des assurances.


    **Protection des fonds et garanties**

    Conformément à la réglementation sur les contrats de personnes, vos avoirs bénéficient
    de la protection du Fonds de Garantie des Assurances de Personnes (FGAP) jusqu''à
    un montant de 70 000 € en cas de défaillance de la société. Cette protection est
    un pilier de la sécurité financière offerte à nos sociétaires.


    **Cadre opérationnel et éthique**

    Notre modèle mutuel repose sur la transparence. Le traitement équitable des sociétaires
    et la protection des données personnelles sont au cœur de notre cadre opérationnel.
    Nous appliquons une politique de tolérance zéro envers la fraude. Toute modification
    de contrat, retrait ou transfert de fonds nécessite obligatoirement une authentification
    forte et une vérification rigoureuse de l''identité du demandeur.


    **Limites de responsabilité**

    Nous fournissons des informations sur les produits et une éducation financière
    générale. Toutefois, nous ne garantissons aucune performance. Le PER individuel
    Égide peut inclure des supports dont la valeur varie selon les marchés, exposant
    le sociétaire à un risque de perte en capital. Nous ne délivrons aucun conseil
    fiscal, juridique ou médical personnalisé. Nous renvoyons systématiquement nos
    sociétaires vers des experts certifiés pour ces besoins spécifiques.


    Tout sinistre ou incident lié au contrat doit être déclaré dans les délais légaux,
    notamment les 5 jours ouvrés pour les sinistres, afin de garantir la validité
    des garanties associées.'
  domain: insurance
  product_category: per_individuel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: bb313fa1-24fe-58b5-acea-7d36c301ade3
  title: PER individuel Égide — grille des taux
  body: 'Le PER individuel Égide est un contrat dont la performance dépend des supports
    d''investissement choisis par le sociétaire. À ce titre, nous ne proposons pas
    de taux de rendement garanti.


    **Frais de gestion**

    Un taux unique de frais de gestion annuels de 0,8 % s''applique à l''ensemble
    des actifs du contrat, quel que soit le montant du solde. Ces frais sont prélevés
    périodiquement pour couvrir la gestion active des fonds et la maintenance de l''infrastructure
    sécurisée de la mutuelle.


    **Évolution des taux**

    Les taux de rendement des supports (fonds en euros ou unités de compte) varient
    selon la performance des marchés financiers et la stratégie de gestion d''Égide
    Assurances. Nous communiquons les rendements annuels sur vos relevés de situation.


    Nous rappelons que toute performance passée ne préjuge pas des performances futures.
    Pour comprendre l''impact des frais sur vos versements, veuillez consulter le
    document PER individuel Égide — grille tarifaire.'
  domain: insurance
  product_category: per_individuel
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: efdf0c57-e888-5b1c-946f-85e2dd599d9f
  title: PER individuel Égide — offre en cours
  body: 'Chers sociétaires, nous avons le plaisir de vous proposer une offre exceptionnelle
    pour dynamiser votre préparation à la retraite durant la fin d''année 2024.


    **Offre « Horizon Retraite 2024 »**

    Pour tout versement exceptionnel effectué sur votre PER individuel Égide entre
    le 1er novembre 2024 et le 31 décembre 2024, nous vous offrons un bonus de bienvenue
    de 50 €.


    **Conditions de l''offre**

    - Le versement minimal pour bénéficier du bonus est de 1 000 €.

    - Le bonus de 50 € sera crédité sur votre contrat après la période de validation
    des fonds.

    - Cette offre est réservée aux sociétaires ayant un contrat actif à la date du
    1er novembre 2024.


    Nous vous rappelons que les frais sur versements habituels de 1,5 % restent applicables
    à vos apports. Cette offre est une opportunité d''optimiser votre déduction fiscale
    avant la clôture de l''année civile, dans la limite de vos plafonds personnels
    (maximum 37 680 €).'
  domain: insurance
  product_category: per_individuel
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a225be27-d395-5969-a20a-f2f16eb66ebf
  title: PER individuel Égide — protection contre la fraude et les opérations non
    autorisées
  body: 'La sécurité de votre épargne retraite est notre priorité absolue. Le PER
    individuel Égide, de par sa nature de produit d''investissement à long terme,
    peut être la cible de tentatives de fraude sophistiquées. Nous souhaitons vous
    informer des mesures de protection en vigueur et des comportements de vigilance
    à adopter.


    Certaines fraudes courantes consistent en des appels ou emails usurpant l''identité
    de nos conseillers pour vous inciter à transférer vos fonds vers un compte tiers
    sous prétexte d''une « opportunité d''investissement urgente » ou d''une « mise
    à jour réglementaire ». Soyez extrêmement vigilants : Égide Assurances ne vous
    demandera jamais vos codes d''accès personnels, vos mots de passe ou l''exécution
    d''un virement vers un compte qui ne serait pas explicitement lié à votre contrat.


    Pour prévenir tout risque, nous appliquons une politique de vérification rigoureuse.
    Une authentification forte et une vérification d''identité sont obligatoires avant
    toute action modifiant l''état d''un contrat, tout retrait ou tout transfert de
    fonds. Cette procédure est la seule garantie permettant de protéger vos avoirs
    contre les opérations non autorisées.


    Si vous constatez une anomalie sur vos relevés ou si vous recevez une sollicitation
    suspecte, nous vous demandons d''en informer nos services immédiatement. Pour
    les sinistres ou les fraudes avérées, nous rappelons que les délais légaux de
    déclaration, notamment les 5 jours ouvrés, sont strictement appliqués pour garantir
    la validité des garanties et l''efficacité des recours.


    En cas de doute sur l''authenticité d''une communication, nous vous invitons à
    ignorer le message et à nous contacter directement via vos canaux de communication
    habituels. Nous vous rappelons également que nous ne garantissons aucune performance
    financière et que toute promesse de rendement garanti est le signe distinctif
    d''une tentative de fraude.


    Pour plus de détails sur la gestion de vos avoirs, vous pouvez consulter le document
    PER individuel Égide — conditions générales.'
  domain: insurance
  product_category: per_individuel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 8dd87e29-12bc-5acf-b8cc-11eadb4cc65e
  title: PER individuel Égide — conditions générales
  body: 'Le présent document définit le cadre contractuel régissant le PER individuel
    Égide. En tant que société d''assurance mutuelle, nous nous engageons à une transparence
    totale dans la gestion de vos fonds.


    Obligations financières et frais

    Le sociétaire s''engage à supporter les frais liés à la gestion de son plan. Lors
    de chaque versement, nous appliquons des frais d''entrée de 1,5 %. Par ailleurs,
    nous prélevons des frais de gestion annuels de 0,8 % pour assurer la maintenance
    de l''infrastructure sécurisée et la gestion active des fonds. En cas de transfert
    du contrat vers un autre organisme avant l''expiration d''un délai de 5 ans, des
    frais de transfert de 1 % seront appliqués sur le montant transféré.


    Modalités de déduction fiscale

    Le PER individuel Égide permet de déduire les versements de l''assiette taxable
    du revenu imposable. Le montant déductible est encadré par des plafonds légaux
    : le plafond de déduction minimal est fixé à 4 710 € et le plafond maximal peut
    s''élever jusqu''à 37 680 €, selon la situation fiscale du sociétaire. Le calcul
    exact de ces plafonds relève de la responsabilité du sociétaire ; nous fournissons
    l''éducation financière générale mais ne délivrons aucun conseil fiscal personnalisé.


    Modifications et clôture

    Toute modification du contrat ou demande de rachat (sous conditions légales de
    déblocage) nécessite une authentification forte. Le contrat prend fin soit lors
    du passage à la retraite, soit par transfert vers un autre PER, soit par clôture
    anticipée dans les cas prévus par le Code des assurances.


    Cadre réglementaire

    Nous opérons sous la surveillance de l''ACPR. Les fonds sont gérés conformément
    au Code des assurances, incluant la protection du FGAP jusqu''à 70 000 € pour
    les contrats de personnes. Tout litige non résolu par nos gestionnaires spécialisés
    pourra être porté devant la Médiation de l''assurance.'
  domain: insurance
  product_category: per_individuel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: eb32a062-4667-5d3f-a167-bdbfde8510c0
  title: PER individuel Égide — pour qui et pour quels usages
  body: 'Le PER individuel Égide est une solution d''épargne retraite optimisée fiscalement,
    conçue pour les particuliers et les familles souhaitant préparer leur avenir avec
    sérénité tout en réduisant leur charge fiscale actuelle.


    À qui s''adresse ce produit ?

    Ce plan est idéal pour tout contribuable souhaitant constituer un capital ou une
    rente pour sa retraite. Il s''adresse particulièrement aux sociétaires qui recherchent
    un partenaire de confiance privilégiant l''éthique et la transparence, et qui
    souhaitent bénéficier d''un modèle coopératif.


    Usages et avantages fiscaux

    Le principal usage du PER individuel Égide est la préparation du long terme. Les
    versements effectués sont déductibles de votre revenu imposable, dans la limite
    de plafonds réglementaires allant de 4 710 € (plafond minimal) à 37 680 € (plafond
    maximal). Cette mécanique permet de transformer une partie de votre impôt en épargne
    pour votre futur.


    Structure tarifaire transparente

    Conformément à notre philosophie de transparence, nous appliquons les frais suivants
    :

    - Frais d''entrée : 1,5 % sur chaque versement.

    - Frais de gestion annuels : 0,8 %, justifiés par la maintenance d''une infrastructure
    sécurisée et une gestion active.

    - Frais de transfert : 1 % si le transfert intervient avant 5 ans d''ancienneté
    du contrat.


    Pourquoi choisir Égide Assurances ?

    En devenant sociétaire, vous n''êtes pas un simple client mais un membre de notre
    mutuelle. Nous vous offrons un accompagnement pédagogique via notre portail numérique,
    par email ou téléphone. Pour une vue d''ensemble des coûts, nous vous invitons
    à consulter le document PER individuel Égide — grille tarifaire.'
  domain: insurance
  product_category: per_individuel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: af2dac00-a665-5db2-840d-9b703283f009
  title: 'PER individuel Égide — frais de gestion annuels : explications'
  body: 'Question : À quoi correspondent les frais de gestion annuels de mon PER individuel
    Égide et quel est leur montant ?


    Réponse : Les frais de gestion annuels s''élèvent à 0,8 %. Ce montant est prélevé
    sur la valeur globale de votre contrat pour couvrir la gestion active de vos fonds,
    la maintenance de notre infrastructure informatique sécurisée et le fonctionnement
    de notre modèle coopératif. Ces frais garantissent l''équité entre tous les sociétaires
    et la pérennité de notre société mutuelle.


    Question : Comment ces frais impactent-ils mon épargne ?


    Réponse : Ils sont déduits progressivement et automatiquement de la valeur de
    vos actifs. Pour comprendre comment ces frais s''articulent avec les autres coûts,
    comme les frais d''entrée, nous vous invitons à consulter le document PER individuel
    Égide — grille tarifaire.'
  domain: insurance
  product_category: per_individuel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: f4131097-c62b-57cf-b8b8-ffbbcd8364ec
  title: PER individuel Égide — résilier, clôturer ou changer de formule
  body: 'Si vous souhaitez mettre fin à votre contrat, le transférer vers un autre
    établissement ou modifier les modalités de votre plan, nous vous accompagnons
    via la procédure suivante.


    Ce que vous devez préparer

    Avant de débuter, munissez-vous de votre numéro de contrat et d''une pièce d''identité
    valide. Si vous demandez un transfert, préparez les coordonnées de l''organisme
    destinataire.


    Étapes de la procédure

    1. Demande de modification ou de clôture : Indiquez-nous votre intention (résiliation,
    transfert ou changement de formule). Nous procéderons alors à une vérification
    rigoureuse de votre identité et à une authentification forte pour sécuriser l''opération.

    2. Analyse des conditions de sortie : Nous vous confirmerons le montant disponible.
    Si vous optez pour un transfert vers un autre PER et que votre contrat a moins
    de 5 ans d''ancienneté, nous vous informerons qu''une commission de transfert
    de 1 % sera appliquée sur le montant transféré.

    3. Validation des documents : Pour un transfert, vous nous transmettrez le formulaire
    de demande de transfert signé par le nouvel organisme. Nous validerons la conformité
    du dossier.

    4. Exécution et confirmation : Nous traiterons l''opération. Vous recevrez une
    confirmation numérique et un décompte final détaillant le montant transféré ou
    versé, ainsi que les éventuels frais appliqués.


    Comment savoir si l''opération a réussi ?

    L''opération est considérée comme finalisée lorsque vous recevez l''attestation
    de clôture ou le justificatif de transfert, et que le solde de votre contrat PER
    individuel Égide apparaît comme nul sur votre portail client.


    Pour toute question sur les montants inattendus lors d''une clôture, veuillez
    consulter PER individuel Égide — frais ou montant inattendu.'
  domain: insurance
  product_category: per_individuel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 1e27576d-bf74-51e5-bc09-3c891e0bb98f
  title: PER individuel Égide — frais ou montant inattendu
  body: 'Symptôme : Le sociétaire constate que le montant crédité sur son PER est
    inférieur au versement effectué, ou que la valeur de rachat/transfert est moindre
    que prévu.


    Causes probables

    Il existe trois causes principales liées à notre structure tarifaire transparente
    :

    1. Prélèvement des frais d''entrée : Pour tout nouveau versement, nous appliquons
    des frais de 1,5 %. Si vous avez versé 1 000 €, seuls 985 € sont réellement investis.

    2. Application des frais de gestion : Des frais annuels de 0,8 % sont prélevés
    sur l''encours du contrat pour couvrir la gestion active et la sécurité.

    3. Frais de transfert anticipé : Si le sociétaire demande un transfert vers un
    autre organisme avant que le contrat n''ait atteint 5 ans d''ancienneté, des frais
    de transfert de 1 % sont déduits du montant transféré.


    Procédure de vérification

    L''agent doit vérifier dans l''ordre suivant :

    - La date du dernier versement (pour justifier les frais d''entrée de 1,5 %).

    - La date d''anniversaire du contrat (pour déterminer si les frais de transfert
    de 1 % sont applicables).

    - Le relevé annuel pour confirmer le prélèvement des 0,8 % de frais de gestion.


    Résolution et escalade

    - Si le montant est correct selon la grille tarifaire, l''agent doit expliquer
    pédagogiquement chaque frais au sociétaire en s''appuyant sur la philosophie d''équité
    du modèle mutuel.

    - Si une erreur de calcul est détectée, l''agent doit ouvrir un ticket de régularisation
    interne.

    - En cas de dossier complexe ou de contestation persistante, le dossier est escaladé
    vers un gestionnaire spécialisé. En dernier recours, nous orientons le sociétaire
    vers la Médiation de l''assurance.'
  domain: insurance
  product_category: per_individuel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 8af26f6b-b5f1-5b10-aa15-9faf018cf227
  title: PER individuel Égide — justificatifs à fournir
  body: 'Pour l''ouverture et la gestion de votre PER individuel Égide, nous requérons
    les documents suivants selon l''opération envisagée :


    | Opération | Justificatif requis | Finalité |

    | :--- | :--- | :--- |

    | Ouverture de contrat | Pièce d''identité officielle en cours de validité | Vérification
    rigoureuse de l''identité |

    | Ouverture de contrat | Justificatif de domicile récent | Conformité réglementaire
    |

    | Versements déductibles | Avis d''imposition le plus récent | Vérification des
    plafonds (de 4 710 € à 37 680 €) |

    | Transfert entrant | Attestation de valeur du contrat d''origine | Calcul des
    actifs à transférer |

    | Retrait / Sortie | RIB à votre nom et pièce d''identité | Authentification forte
    avant transfert de fonds |


    L''absence de l''un de ces documents peut entraîner un report du traitement de
    votre demande afin de garantir la sécurité de vos avoirs.'
  domain: insurance
  product_category: per_individuel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a313e4df-a670-5c2c-8cdc-423eb7933c10
  title: PER individuel Égide — face à une offre concurrente type
  body: 'Face à une offre de PER classique provenant d''une banque commerciale, le
    PER individuel Égide se distingue par son modèle mutualiste.


    Comparatif des dimensions clés :

    - Coûts : Nous appliquons des frais d''entrée de 1,5 % et des frais de gestion
    annuels de 0,8 %. Certaines offres concurrentes peuvent afficher des frais de
    gestion plus bas mais compenser par des frais de sortie ou des frais d''arbitrage
    élevés. Chez nous, la structure est transparente et justifiée.

    - Engagement : Nous appliquons des frais de transfert de 1 % seulement si le transfert
    a lieu avant 5 ans, encourageant une vision long terme sans verrouillage excessif.

    - Gouvernance : Contrairement aux banques, vous êtes sociétaire d''Égide Assurances,
    participant ainsi à un modèle coopératif basé sur l''éthique.


    Qui choisir ?

    L''offre concurrente peut convenir à ceux qui recherchent un produit purement
    transactionnel. Le PER individuel Égide est le choix privilégié pour les familles
    et particuliers cherchant un partenaire de confiance, une transparence totale
    sur les frais et la protection d''une mutuelle.'
  domain: insurance
  product_category: per_individuel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 98b56b83-8587-5451-8c3d-f930235265a3
  title: PER individuel Égide — informations sur les risques
  body: 'L''investissement dans un PER individuel Égide comporte des caractéristiques
    et des risques que nous devons porter à votre connaissance, conformément à notre
    engagement de transparence et d''éthique.


    Risque sur le capital et performance

    Le PER individuel Égide peut être investi sur des supports variés. Si vous choisissez
    des Unités de Compte, sachez que la valeur de votre investissement variera selon
    les marchés financiers. Ces supports exposent le sociétaire à un risque de perte
    en capital. Nous fournissons une éducation financière générale, mais nous ne garantissons
    jamais de performance future. Les résultats passés ne préjugent pas des résultats
    futurs.


    Disponibilité des fonds

    Le PER est un produit de tunnel : les fonds sont obligatoirement bloqués jusqu''à
    l''âge de la retraite, sauf dans les cas de déblocage anticipé prévus par la loi
    (ex: achat de la résidence principale, accidents de la vie). Tout retrait non
    autorisé par la loi est impossible.


    Protections réglementaires

    Nous opérons sous la surveillance de l''ACPR et respectons strictement le Code
    des assurances. En cas de défaillance de l''assureur, la protection du FGAP (Fonds
    de Garantie des Assurances de Personnes) s''applique et couvre les contrats de
    personnes jusqu''à un montant de 70 000 €.


    Limites de conseil

    Nous vous informons sur les caractéristiques de nos produits et les plafonds de
    déduction fiscale (allant de 4 710 € à 37 680 €). Toutefois, nous ne délivrons
    aucun conseil fiscal, juridique ou médical personnalisé. Pour optimiser votre
    situation fiscale spécifique, nous vous renvoyons vers des experts certifiés.


    Pour plus d''informations sur les modalités contractuelles, veuillez vous référer
    au document PER individuel Égide — conditions générales.'
  domain: insurance
  product_category: per_individuel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 1d7e347b-688d-508a-b70e-0942e7f9437a
  title: PER individuel Égide — calcul et application des taux
  body: 'Ce document précise les modalités de calcul et d''application des frais pour
    le PER individuel Égide, à destination du personnel de support.


    Frais d''entrée : 1,5 %

    Ce taux est appliqué sur chaque versement effectué par le sociétaire. Le calcul
    est simple : Montant versé × 0,015. Le montant net investi est égal au versement
    moins ces frais.


    Frais de gestion annuels : 0,8 %

    Ce taux est appliqué annuellement sur la valeur totale des actifs du contrat.
    Il est prélevé au prorata temporis pour couvrir la maintenance de l''infrastructure
    et la gestion active.


    Frais de transfert anticipé : 1 %

    Ce taux s''applique uniquement si le sociétaire demande le transfert de ses avoirs
    vers un autre organisme avant que le contrat n''ait atteint 5 ans d''existence.
    Le calcul est : Montant transféré × 0,01. Passé le délai de 5 ans, ces frais ne
    sont plus appliqués.


    L''application de ces taux est automatique et systématique pour garantir l''équité
    entre tous les sociétaires du modèle mutuel.'
  domain: insurance
  product_category: per_individuel
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ef0322b3-4606-5615-8ea3-09a3e43128ad
  title: PER individuel Égide — offre de parrainage et de fidélité
  body: 'Parce que notre modèle repose sur la coopération et la confiance mutuelle,
    nous avons le plaisir de proposer à nos sociétaires un programme de parrainage
    dédié au PER individuel Égide. Nous sommes convaincus que la meilleure recommandation
    vient de ceux qui partagent déjà nos valeurs d''éthique et de transparence.


    En tant que membre de notre mutuelle, vous pouvez inviter vos proches à préparer
    leur avenir sereinement. Chaque nouveau sociétaire parrainé bénéficiera d''un
    accueil privilégié au sein de notre structure. Nous encourageons ainsi la croissance
    de notre communauté de sociétaires, garantissant la pérennité et la solidité de
    notre modèle coopératif.


    Nous vous rappelons que l''ouverture d''un PER individuel Égide implique des frais
    d''entrée de 1,5 %, justifiés par la mise en place d''une infrastructure sécurisée
    et une gestion active de vos fonds. Pour consulter les détails de l''offre de
    fidélité actuellement en vigueur et les modalités de parrainage, nous vous invitons
    à vous connecter à votre portail client numérique.'
  domain: insurance
  product_category: per_individuel
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 428c4d18-7af6-51dc-a92e-28f311368559
  title: PER individuel Égide — bonnes pratiques de sécurité du compte
  body: 'La protection de votre épargne retraite est notre priorité absolue. Pour
    garantir l''intégrité de votre PER individuel Égide, nous vous demandons d''appliquer
    rigoureusement les mesures de sécurité suivantes.


    Nous utilisons une authentification forte pour sécuriser l''accès à vos données.
    Nous vous rappelons qu''une vérification rigoureuse de l''identité est obligatoire
    avant toute action modifiant l''état de votre contrat, tout retrait ou tout transfert
    de fonds. Soyez vigilant : Égide Assurances ne vous demandera jamais votre mot
    de passe ou vos codes secrets par email ou par téléphone.


    Certaines tentatives de fraude peuvent viser les produits de retraite en imitant
    nos communications. Soyez attentifs aux demandes urgentes ou aux offres trop alléchantes.
    Si vous constatez une anomalie sur vos relevés ou si vous recevez une sollicitation
    suspecte, informez-nous immédiatement. Nous appliquons une politique de tolérance
    zéro envers la fraude.


    En cas de sinistre ou d''incident lié à votre contrat, nous vous rappelons que
    les délais légaux de déclaration, notamment le délai de 5 jours ouvrés, sont strictement
    appliqués pour garantir la validité des garanties et le traitement efficace de
    votre dossier. En cas de doute, privilégiez toujours nos canaux de communication
    officiels : le portail client numérique, l''email ou le téléphone durant les heures
    ouvrables (CET).'
  domain: insurance
  product_category: per_individuel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 82f197d6-2591-5780-80df-1f244a33a89d
  title: PER individuel Égide — modification des conditions
  body: "Le présent document précise les modalités de modification des conditions\
    \ générales applicables au PER individuel Égide. En tant que société d'assurance\
    \ mutuelle, nous nous engageons à maintenir une transparence totale sur l'évolution\
    \ de nos contrats.\n\nNous nous réservons le droit de modifier les conditions\
    \ du contrat pour répondre aux évolutions réglementaires du Code des assurances\
    \ ou pour adapter notre gestion active. Toute modification impactant les frais\
    \ sera notifiée aux sociétaires dans un délai raisonnable avant son application.\
    \ \n\nLes frais actuels, qui garantissent l'équité entre tous les sociétaires,\
    \ sont les suivants :\n- Des frais d'entrée s'élevant à 1,5 % sur chaque versement.\n\
    - Des frais de gestion annuels fixés à 0,8 %.\n- En cas de transfert du contrat\
    \ vers un autre établissement avant un délai de 5 ans, des frais de transfert\
    \ de 1 % seront appliqués.\n\nL'acceptation de ces conditions est liée à votre\
    \ qualité de sociétaire. En cas de désaccord majeur suite à une modification,\
    \ le sociétaire peut demander la clôture de son plan selon les modalités légales\
    \ en vigueur. Pour les dossiers complexes, nous prévoyons une escalade vers un\
    \ gestionnaire spécialisé ou, en dernier recours, vers la Médiation de l'assurance.\n\
    \nNous vous rappelons que nous opérons sous la surveillance de l'ACPR, assurant\
    \ ainsi la conformité et la sécurité de vos avoirs."
  domain: insurance
  product_category: per_individuel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 63e9ec0e-22f4-58d1-84f9-71952bbb68fe
  title: PER individuel Égide — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner les nouveaux
    sociétaires dans l''activation de leur PER individuel Égide. L''objectif est d''assurer
    une compréhension pédagogique du produit et de sa structure tarifaire.


    1. Présentation du modèle : Expliquez au client qu''en souscrivant à ce PER, il
    devient sociétaire d''une mutuelle, participant ainsi à une gouvernance coopérative
    et éthique.


    2. Explication des frais : Vous devez mentionner clairement que le contrat comporte
    des frais d''entrée de 1,5 % et des frais de gestion annuels de 0,8 %. Précisez
    que ces frais sont justifiés par la maintenance d''une infrastructure sécurisée
    et la gestion active des fonds.


    3. Optimisation fiscale : Informez le client sur la possibilité de déduire ses
    versements de son revenu imposable. Le plafond minimal de déduction est de 4 710
    € et le plafond maximal de déduction des versements peut atteindre 37 680 €.


    4. Avertissement sur les transferts : Précisez qu''un transfert de fonds avant
    un délai de 5 ans entraînera l''application de frais de transfert de 1 %.


    5. Vérification d''identité : Rappelez au client qu''aucune modification de contrat
    ou transfert de fonds ne peut être effectué sans une authentification forte et
    une vérification rigoureuse de l''identité.


    L''accompagnement se termine par la confirmation de l''ouverture du compte via
    le portail client numérique. Pour toute question fiscale personnalisée, renvoyez
    systématiquement le sociétaire vers un expert certifié, conformément à nos limites
    de conseil.'
  domain: insurance
  product_category: per_individuel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 24dbf8c1-939d-5a7f-82b5-f973044b2bb2
  title: 'PER individuel Égide — plafond maximal de déduction des versements : explications'
  body: 'Question : Quel est le montant maximal que je peux déduire de mes revenus
    grâce aux versements sur mon PER individuel Égide ?


    Réponse : Le plafond maximal de déduction des versements est de 37 680 €. Ce montant
    représente la limite supérieure des cotisations que vous pouvez déduire de votre
    revenu imposable pour optimiser votre fiscalité tout en préparant votre retraite.


    Question : Ce plafond est-il identique pour tous les sociétaires ?


    Réponse : Le plafond maximal de 37 680 € est la limite haute, tandis que le plafond
    minimal de déduction est de 4 710 €. Le montant exact dont vous pouvez bénéficier
    dépend de vos revenus et de votre situation fiscale. Nous vous recommandons de
    consulter un expert fiscal certifié pour déterminer le montant optimal de vos
    versements, car nous ne délivrons pas de conseil fiscal personnalisé.'
  domain: insurance
  product_category: per_individuel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fe3e0c92-6f9f-5f94-b09e-fe3ee411d53c
  title: PER individuel Égide — effectuer une modification
  body: 'Si vous souhaitez modifier les informations liées à votre PER individuel
    Égide (adresse, coordonnées bancaires ou bénéficiaire), nous vous accompagnons
    selon la procédure suivante :


    Préalables : Munissez-vous d''une pièce d''identité valide et à jour.


    Étape 1 : Formulez votre demande de modification auprès de nous. Précisez clairement
    l''élément que vous souhaitez mettre à jour.


    Étape 2 : Procédez à la vérification de votre identité. Conformément à notre politique
    de sécurité, nous effectuerons une authentification forte et une vérification
    rigoureuse de vos documents d''identité. Cette étape est obligatoire avant toute
    action modifiant l''état de votre contrat.


    Étape 3 : Validez les nouvelles informations. Nous vous demanderons de confirmer
    les données mises à jour (par exemple, le nouveau RIB ou la nouvelle adresse).


    Étape 4 : Réception de la confirmation. Nous vous enverrons une confirmation écrite
    de la modification effectuée via votre portail client numérique ou par email.


    Sachez que pour toute modification complexe touchant à la structure du plan, nous
    pourrions escalader votre demande vers un gestionnaire spécialisé pour garantir
    un traitement équitable et conforme au Code des assurances.'
  domain: insurance
  product_category: per_individuel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e937dab0-bef4-562d-902f-64f5f997f6e3
  title: PER individuel Égide — problèmes d'accès ou de connexion
  body: 'Symptôme : Vous ne parvenez pas à vous connecter à votre espace client pour
    consulter votre PER individuel Égide, ou vous recevez un message d''erreur lors
    de l''authentification.


    Causes probables :

    - Identifiants incorrects ou mot de passe expiré.

    - Compte temporairement bloqué suite à plusieurs tentatives infructueuses.

    - Problème technique lié au portail client numérique.


    Procédure de résolution :

    1. Vérifiez vos identifiants. Assurez-vous qu''aucune erreur de saisie n''a été
    commise.

    2. Tentez une réinitialisation de votre mot de passe via la fonction dédiée sur
    le portail.

    3. Si l''accès reste bloqué, demandez-nous une déblocage de compte. Nous procéderons
    alors à une vérification rigoureuse de votre identité et à une authentification
    forte pour sécuriser l''opération.


    Quand escalader :

    Si le problème persiste après la vérification d''identité ou si vous suspectez
    une usurpation d''identité, nous escaladerons immédiatement votre dossier vers
    un gestionnaire spécialisé. Vous recevrez alors un accusé de réception de votre
    demande et un délai de traitement estimé par email.


    Nous vous rappelons que la sécurité de vos fonds est assurée par notre surveillance
    ACPR et que nous appliquons une tolérance zéro envers toute tentative de fraude
    visant vos accès.'
  domain: insurance
  product_category: per_individuel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 93e5cb0e-7807-5532-955a-4031e0d8eb3c
  title: PER individuel Égide — niveaux d'accès
  body: 'Ce tableau définit les droits d''accès et d''action sur le PER individuel
    Égide selon le profil du demandeur :


    | Profil | Niveau d''accès | Actions autorisées |

    | :--- | :--- | :--- |

    | Sociétaire (Titulaire) | Accès Complet | Consultation, versements, modification
    du bénéficiaire, demande de transfert, clôture. |

    | Bénéficiaire désigné | Accès Restreint | Consultation des informations de transmission
    après décès (sous réserve de justificatifs). |

    | Gestionnaire Égide | Accès Administratif | Mise à jour du contrat, vérification
    d''identité, exécution des opérations validées. |

    | Médiateur de l''assurance | Accès Audit | Consultation des pièces du dossier
    en cas de litige escaladé. |


    Note : Tout accès modifiant l''état du contrat nécessite obligatoirement une authentification
    forte et une vérification rigoureuse de l''identité du sociétaire.'
  domain: insurance
  product_category: per_individuel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 88d5e834-4eb2-5723-bd0b-d404ef9479ad
  title: PER individuel Égide — choisir entre les formules
  body: 'Pour préparer votre avenir, vous pouvez hésiter entre le PER individuel Égide
    et d''autres solutions comme le Contrat d''assurance-vie Égide Multisupport.


    Le PER individuel Égide est spécifiquement conçu pour la retraite. Son avantage
    majeur est la déductibilité fiscale des versements, avec un plafond maximal de
    déduction pouvant atteindre 37 680 €. En contrepartie, les fonds sont généralement
    bloqués jusqu''à la retraite. Il comporte des frais d''entrée de 1,5 % et des
    frais de gestion annuels de 0,8 %.


    Le Contrat d''assurance-vie Égide Multisupport offre une flexibilité supérieure,
    permettant des retraits plus aisés, mais ne propose pas la même déductibilité
    fiscale immédiate sur les versements.


    Le PER individuel Égide convient mieux aux personnes souhaitant optimiser leur
    imposition actuelle tout en sécurisant un capital pour leurs vieux jours. Le contrat
    d''assurance-vie est préférable pour ceux qui recherchent une épargne disponible
    à tout moment. Nous vous invitons à consulter PER individuel Égide — présentation
    pour plus de détails.'
  domain: insurance
  product_category: per_individuel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 909fc2eb-b39e-570a-9753-0c691ed4749b
  title: PER individuel Égide — confidentialité et protection des données
  body: 'Égide Assurances s''engage à traiter les données de ses sociétaires avec
    la plus haute rigueur éthique. Le traitement de vos informations personnelles
    dans le cadre de votre PER individuel Égide est strictement encadré par le RGPD
    et les directives de l''ACPR.


    Nous opérons sous la surveillance de l''Autorité de contrôle prudentiel et de
    résolution (ACPR) et respectons scrupuleusement le Code des assurances. À ce titre,
    nous garantissons que vos contrats de personnes bénéficient de la protection du
    FGAP jusqu''à 70 000 €.


    La confidentialité de vos données est au cœur de notre cadre opérationnel. Nous
    n''utilisons vos informations que pour la gestion active de vos fonds, la maintenance
    de notre infrastructure sécurisée et la communication nécessaire à la vie de votre
    contrat. Toute modification de vos données sensibles nécessite une authentification
    forte et une vérification rigoureuse de l''identité pour prévenir tout risque
    de fraude.


    Nous traitons toutes les réclamations avec impartialité. Si vous estimez que vos
    données n''ont pas été traitées équitablement, vous pouvez nous en informer via
    le portail client numérique. En dernier recours, la Médiation de l''assurance
    est disponible pour arbitrer tout litige relatif à la protection de vos données
    ou à l''exécution de vos garanties.'
