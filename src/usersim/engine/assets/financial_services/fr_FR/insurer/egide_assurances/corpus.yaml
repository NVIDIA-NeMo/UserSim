- id: efea76a6-9f56-5f39-a2c8-182086578ac4
  title: PER individuel Égide — reconnaître les arnaques visant ce produit
  body: 'La protection de votre épargne retraite est une priorité absolue pour nous.
    Dans un contexte où les tentatives de fraude se sophistiquent, nous souhaitons
    vous aider à identifier les signes d''alerte spécifiques au PER individuel Égide.


    Certaines arnaques utilisent l''appât de rendements exceptionnels et garantis
    pour vous inciter à transférer vos fonds vers des supports non régulés. Soyez
    extrêmement vigilants : Égide Assurances ne garantit jamais de performance et
    nous ne vous solliciterons jamais pour effectuer un transfert urgent vers un compte
    tiers sous peine de perdre vos avantages fiscaux.


    Nous vous rappelons que nous ne vous demanderons jamais, par email ou par téléphone,
    vos mots de passe de portail client, vos codes secrets ou l''intégralité de vos
    coordonnées bancaires pour « valider » un versement. Toute demande d''authentification
    forte doit s''effectuer exclusivement via nos protocoles sécurisés.


    Un autre signal d''alerte courant consiste en la réception de courriers ou d''emails
    imitant notre identité visuelle, vous demandant de payer des frais de « déblocage
    » anticipés pour accéder à vos fonds. Le PER individuel Égide suit un cadre légal
    strict et nous n''exigeons aucun paiement direct pour libérer des fonds dans le
    cadre des cas de déblocage prévus par la loi.


    Si vous constatez une anomalie ou si vous avez un doute sur la légitimité d''une
    communication, nous vous invitons à nous le signaler immédiatement. Conformément
    à notre politique de gestion des sinistres, nous appliquons des délais de déclaration
    stricts, notamment 5 jours ouvrés pour les sinistres, afin de garantir la validité
    des garanties et la rapidité du traitement.


    En cas de suspicion de fraude, la première action à entreprendre est de nous informer
    sans délai pour que nous puissions sécuriser votre contrat et bloquer toute tentative
    de mouvement de fonds non autorisée.'
  domain: insurance
  product_category: per_individuel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 37f3ffbe-cf21-556a-8667-dbc1068cf7a2
  title: PER individuel Égide — plafonds, restrictions et cas particuliers
  body: 'Ce document détaille les limites opérationnelles et les contraintes tarifaires
    du PER individuel Égide, afin d''accompagner au mieux les sociétaires dans l''optimisation
    de leur épargne retraite.


    **Plafonds de déduction fiscale**

    Le PER individuel Égide permet de déduire les versements volontaires de l''assiette
    de l''impôt sur le revenu, dans la limite d''un plafond réglementaire. Pour l''accompagnement
    des dossiers, veuillez noter les seuils suivants :

    - Plafond minimal de déduction : 4 710 €

    - Plafond maximal de déduction : 37 680 €


    **Structure des frais**

    L''équité entre nos sociétaires repose sur une transparence totale des coûts.
    Chaque opération est soumise aux frais suivants :

    - Frais d''entrée : 1,5 % prélevés sur chaque versement effectué sur le contrat.

    - Frais de gestion annuels : 0,8 % prélevés pour assurer la maintenance de l''infrastructure
    sécurisée et la gestion active des fonds.


    **Restrictions sur les transferts**

    Afin de garantir la pérennité du modèle mutuel et la stabilité des fonds, des
    frais de transfert s''appliquent en cas de sortie anticipée vers un autre établissement.
    Si le transfert intervient avant 5 ans d''ancienneté du contrat, des frais de
    transfert de 1 % sont appliqués sur le montant transféré.


    **Cas particuliers et conformité**

    Nous opérons sous la surveillance de l''ACPR. Pour tout retrait ou modification
    d''état du contrat, une authentification forte est obligatoire. Les dossiers complexes,
    notamment ceux impliquant des plafonds de déduction atypiques ou des situations
    fiscales particulières, sont systématiquement escaladés vers un gestionnaire spécialisé
    pour garantir un traitement équitable et conforme au Code des assurances.'
  domain: insurance
  product_category: per_individuel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: b0395feb-a316-5a0c-b9cb-a0ac3d69af58
  title: 'PER individuel Égide — plafond minimal de déduction des versements : explications'
  body: '**Quel est le montant minimal du plafond de déduction pour mon PER individuel
    Égide ?**

    Le plafond minimal de déduction des versements est fixé à 4 710 €. Ce montant
    représente la limite basse en dessous de laquelle la déduction fiscale de vos
    versements volontaires est calculée selon les règles fiscales en vigueur.


    **Comment ce plafond influence-t-il mon épargne ?**

    Ce montant sert de base pour déterminer la part de vos versements que vous pouvez
    déduire de votre revenu imposable. Si vos versements sont inférieurs à ce seuil,
    la déduction s''effectue sur la base du montant réellement versé, dans la limite
    de vos droits fiscaux.


    **Où trouver plus d''informations sur les frais liés à ces versements ?**

    Pour comprendre comment les frais s''appliquent lors de vos versements, nous vous
    invitons à consulter le document : PER individuel Égide — frais sur versements
    : explications.'
  domain: insurance
  product_category: per_individuel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: cfe88683-02ff-5752-97ba-d6c0dce8ae55
  title: PER individuel Égide — consulter le suivi ou l'historique
  body: 'Pour assurer une gestion transparente de votre épargne retraite, nous mettons
    à votre disposition un suivi détaillé de vos opérations. Voici la démarche pour
    consulter l''historique de votre contrat.


    **Prérequis**

    Pour accéder à ces informations, vous devez être en mesure de justifier de votre
    identité via notre processus d''authentification forte (validation par code sécurisé).


    **Étapes de consultation**

    1. Demandez-nous l''extraction de votre historique de transactions ou de votre
    relevé de situation actuel.

    2. Procédez à la vérification rigoureuse de votre identité suite à notre demande
    de confirmation. Cette étape est obligatoire avant toute communication de données
    sensibles.

    3. Précisez la période concernée (année civile ou période spécifique) pour laquelle
    vous souhaitez obtenir le détail des mouvements.

    4. Nous vous transmettrons alors le récapitulatif incluant vos versements, les
    prélèvements des frais de gestion annuels de 0,8 %, ainsi que la valeur liquidative
    de vos supports.


    **Confirmation de réussite**

    L''opération est réussie lorsque vous recevez le document récapitulatif. Vous
    pourrez alors vérifier la concordance entre vos versements et le solde actuel,
    après déduction des frais d''entrée de 1,5 % appliqués lors de chaque apport.


    Si vous constatez une anomalie dans les montants affichés, nous vous invitons
    à consulter le guide : PER individuel Égide — écart avec vos relevés.'
  domain: insurance
  product_category: per_individuel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fc277b9a-2594-5a2f-ad82-cb18b524021a
  title: PER individuel Égide — opération refusée ou bloquée
  body: 'Il peut arriver qu''une opération sur votre PER individuel Égide (versement,
    transfert ou modification) soit refusée ou bloquée. Voici comment identifier la
    cause et résoudre la situation.


    **Symptômes**

    Vous recevez une notification d''échec de transaction ou nous vous informons que
    votre demande ne peut être traitée en l''état.


    **Causes probables et vérifications**

    1. **Défaut d''authentification** : La cause la plus fréquente est l''échec de
    la vérification d''identité. Nous exigeons une authentification forte avant toute
    action modifiant l''état du contrat. Vérifiez que vos informations de contact
    sont à jour.

    2. **Dépassement de plafond** : Si vous tentez un versement dont le cumul annuel
    dépasse le plafond maximal de déduction de 37 680 €, l''opération peut être signalée
    pour vérification fiscale.

    3. **Incohérence des fonds** : Pour les transferts, si le contrat a moins de 5
    ans, l''opération peut être suspendue pour le calcul des frais de transfert de
    1 %.


    **Résolution**

    - **Pour l''identité** : Fournissez-nous une pièce d''identité valide et à jour
    pour débloquer la situation.

    - **Pour les plafonds** : Ajustez le montant de votre versement pour qu''il reste
    cohérent avec vos droits fiscaux ou confirmez que vous acceptez un versement non
    déductible.

    - **Pour les frais** : Confirmez votre accord sur le prélèvement des frais de
    transfert de 1 % si vous souhaitez poursuivre le mouvement avant la cinquième
    année.


    **Escalade**

    Si la situation n''est pas résolue après ces vérifications, nous escaladons votre
    dossier vers un gestionnaire spécialisé. Vous recevrez une notification de prise
    en charge sous 48 heures ouvrables.'
  domain: insurance
  product_category: per_individuel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fefeb8bc-2db9-5af4-868a-85ba3cd40f31
  title: PER individuel Égide — quand changer ou monter en gamme
  body: 'Le PER individuel Égide est un outil d''optimisation fiscale puissant, mais
    il n''est pas adapté à tous les projets de vie. Un changement de stratégie est
    recommandé dans les cas suivants :


    **Besoin de liquidité accrue**

    Le PER bloque les fonds jusqu''à la retraite (sauf cas exceptionnels). Si le sociétaire
    a besoin d''une épargne disponible à tout moment, le Contrat d''assurance-vie
    Égide Multisupport — présentation est une alternative préférable, malgré l''absence
    de déduction fiscale à l''entrée.


    **Capacité d''épargne et fiscalité**

    Le PER est idéal pour les foyers fortement imposables souhaitant réduire leur
    revenu imposable jusqu''au plafond maximal de 37 680 €. Si le sociétaire n''est
    plus imposable, l''avantage fiscal du PER s''efface, et la structure de frais
    (1,5 % à l''entrée et 0,8 % annuels) peut devenir moins attractive qu''un support
    d''épargne classique.


    **Horizon temporel**

    Si l''objectif n''est plus la retraite mais la transmission à court terme, d''autres
    solutions de notre gamme mutuelle seront plus pertinentes pour éviter les frais
    de transfert de 1 % appliqués avant 5 ans.'
  domain: insurance
  product_category: per_individuel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 171362ca-8e2f-5ba0-b544-c5276359790c
  title: PER individuel Égide — comparaison avec les alternatives et quand ne pas
    le choisir
  body: 'Le choix d''un produit d''épargne dépend de vos objectifs : préparation de
    la retraite, constitution d''un capital disponible ou optimisation fiscale. Voici
    comment positionner le PER individuel Égide face aux alternatives.


    **Avantages comparatifs**

    Le principal atout du PER individuel Égide est la déductibilité des versements
    de l''assiette de l''impôt sur le revenu. Ce produit est particulièrement avantageux
    pour ceux dont les versements s''inscrivent entre le plafond minimal de 4 710
    € et le plafond maximal de 37 680 €, permettant ainsi une réduction immédiate
    de la charge fiscale.


    **Contraintes et coûts**

    Contrairement à l''assurance-vie, les fonds sont engagés sur le long terme. En
    termes de coûts, nous appliquons des frais d''entrée de 1,5 % et des frais de
    gestion annuels de 0,8 %. De plus, tout transfert avant 5 ans entraîne des frais
    de 1 %.


    **Quand ne pas choisir le PER individuel Égide ?**

    Nous déconseillons ce produit dans les situations suivantes :

    - **Besoin de disponibilité** : Si vous envisagez d''utiliser cet argent pour
    un projet à court ou moyen terme (achat immobilier, voyage), car les fonds sont
    bloqués.

    - **Faible imposition** : Si vous n''êtes pas imposable, vous ne pourrez pas bénéficier
    de la déduction fiscale, rendant les frais d''entrée de 1,5 % moins justifiables
    par rapport à un produit d''épargne liquide.

    - **Horizon très court** : Si vous prévoyez de transférer vos fonds vers un autre
    assureur dans les 5 prochaines années, les frais de transfert de 1 % impacteront
    votre performance.


    Pour une alternative offrant une flexibilité totale sur les retraits, nous vous
    invitons à consulter le Contrat d''assurance-vie Égide Multisupport — présentation.'
  domain: insurance
  product_category: per_individuel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 43265af3-e4d2-55db-a139-5b8fc18f9fd6
  title: 'PER individuel Égide — frais de transfert avant 5 ans : explications'
  body: '**Pourquoi des frais s''appliquent-ils si je transfère mon PER avant 5 ans
    ?**

    Pour garantir la pérennité du modèle mutuel et l''équité entre tous les sociétaires,
    nous appliquons des frais de transfert de 1 % si le contrat est transféré vers
    un autre établissement avant son cinquième anniversaire. Ces frais couvrent la
    maintenance de l''infrastructure sécurisée et la gestion administrative du dossier.


    **Comment sont calculés ces frais ?**

    Le montant de 1 % est prélevé sur la valeur totale des fonds transférés au moment
    de l''opération.


    **Que se passe-t-il après 5 ans ?**

    Une fois le délai de 5 ans révolu, ces frais de transfert spécifiques ne s''appliquent
    plus, conformément à notre volonté de récompenser la fidélité de nos sociétaires
    et la stabilité de notre fonds coopératif.'
  domain: insurance
  product_category: per_individuel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 8dd1dc02-c6cb-56c4-ac3e-ae687372606f
  title: PER individuel Égide — traiter une demande courante de bout en bout
  body: 'L''une des demandes les plus fréquentes concerne la réalisation d''un versement
    volontaire pour optimiser sa fiscalité. Voici la procédure complète pour effectuer
    cette opération.


    **Prérequis**

    - Un compte bancaire à votre nom.

    - La connaissance de votre plafond de déduction fiscale disponible pour l''année
    en cours.


    **Étapes de réalisation**

    1. **Déclaration d''intention** : Indiquez-nous votre souhait d''effectuer un
    versement sur votre PER individuel Égide en précisant le montant.

    2. **Vérification du plafond** : Nous vérifions ensemble que le montant respecte
    vos objectifs, en gardant à l''esprit que la déduction fiscale est possible jusqu''au
    plafond maximal de 37 680 €.

    3. **Authentification** : Procédez à la vérification rigoureuse de votre identité
    via notre protocole d''authentification forte. Cette étape est indispensable pour
    valider tout mouvement de fonds.

    4. **Validation des frais** : Nous vous confirmons que le versement sera soumis
    aux frais d''entrée de 1,5 %, prélevés directement sur la somme versée.

    5. **Exécution du transfert** : Transmettez-nous l''ordre de virement ou validez
    le prélèvement. Nous confirmons la réception des fonds et leur affectation sur
    vos supports d''investissement.


    **Confirmation de réussite**

    L''opération est terminée lorsque vous recevez l''avis d''opéré confirmant le
    montant net investi après déduction des 1,5 % de frais d''entrée. Vous pourrez
    alors retrouver ce mouvement dans votre historique en consultant le document :
    PER individuel Égide — consulter le suivi ou l''historique.'
  domain: insurance
  product_category: per_individuel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 851730ef-62cf-5235-861b-24f047c57feb
  title: PER individuel Égide — écart avec vos relevés
  body: "Lors de la consultation de vos relevés, vous pouvez constater un écart entre\
    \ le montant versé et la valeur liquidative affichée. Voici les éléments d'analyse\
    \ pour comprendre ces différences.\n\n**Symptôme**\nLe sociétaire signale que\
    \ le solde de son PER individuel Égide est inférieur au montant total de ses versements\
    \ cumulés.\n\n**Causes probables et points de contrôle**\n1. **Impact des frais\
    \ d'entrée** : Vérifiez si le versement est récent. Chaque apport est soumis à\
    \ des frais d'entrée de 1,5 %. Par exemple, pour un versement de 1 000 €, seuls\
    \ 985 € sont réellement investis.\n2. **Prélèvement des frais de gestion** : Les\
    \ frais de gestion annuels de 0,8 % sont prélevés périodiquement. Un écart peut\
    \ apparaître entre deux relevés trimestriels suite à l'application de ces frais\
    \ sur l'encours global.\n3. **Volatilité des supports** : Si le PER contient des\
    \ Unités de Compte, la valeur fluctue selon les marchés. L'écart peut provenir\
    \ d'une baisse de la valeur liquidative des supports choisis.\n4. **Frais de transfert**\
    \ : Si un transfert partiel a eu lieu avant 5 ans d'ancienneté, vérifiez que les\
    \ frais de transfert de 1 % ont été correctement déduits du montant sorti.\n\n\
    **Résolution**\n- Recalculez la valeur nette en soustrayant les 1,5 % de frais\
    \ d'entrée sur les derniers versements.\n- Vérifiez la date de prélèvement des\
    \ frais de gestion (0,8 %). \n- Si l'écart persiste et ne s'explique pas par ces\
    \ éléments, nous procédons à une analyse détaillée de l'historique.\n\n**Escalade**\n\
    En cas de divergence inexpliquée, nous escaladons le dossier vers un gestionnaire\
    \ spécialisé pour un audit complet des écritures comptables du contrat. Le sociétaire\
    \ sera informé de la résolution sous 5 jours ouvrés."
  domain: insurance
  product_category: per_individuel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 4f95e411-74f0-5f9b-bfa0-4784342d4988
  title: Assurance habitation Égide — présentation
  body: 'L''Assurance habitation Égide est conçue comme une protection résidentielle
    complète et agile, s''inscrivant dans notre modèle de société d''assurance mutuelle.
    Contrairement aux prestataires classiques, nous considérons nos assurés comme
    des sociétaires, des partenaires actifs au sein d''une structure coopérative privilégiant
    la transparence et l''éthique.


    Notre approche repose sur la volonté de sécuriser votre foyer tout en garantissant
    une équité tarifaire entre tous nos membres. Nous proposons une couverture fiable
    qui s''adapte aux besoins des particuliers et des familles, avec une flexibilité
    notable permettant une résiliation simplifiée après un an de contrat.


    Sur le plan financier, nous nous engageons à une transparence totale. À titre
    d''exemple, la cotisation annuelle indicative pour un profil type de locataire
    en appartement deux pièces s''élève à 168 €. Ce montant reflète notre volonté
    de maintenir des frais justifiés par une gestion active et une infrastructure
    sécurisée, assurant ainsi la pérennité de notre modèle mutuel.


    En cas de sinistre, notre gestion est encadrée par des règles claires pour garantir
    une indemnisation rapide et juste :

    - Pour la majorité des incidents couverts, une franchise standard de 150 € reste
    à la charge du sociétaire.

    - Dans le cas spécifique d''une catastrophe naturelle, la franchise applicable
    est de 380 €.


    L''efficacité de notre intervention dépend également du respect des procédures
    de déclaration. Nous appliquons strictement le délai légal de déclaration des
    sinistres, lequel est de 5 jours ouvrés. Ce délai est essentiel pour nous permettre
    de valider les garanties et d''engager les mesures d''indemnisation dans les meilleurs
    délais.


    Nous vous rappelons que nous fournissons une éducation financière générale et
    des informations sur nos produits, mais nous ne délivrons aucun conseil fiscal,
    juridique ou médical personnalisé. Pour ces besoins, nous vous invitons à consulter
    des experts certifiés.'
  domain: insurance
  product_category: assurance_habitation
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: dee5a725-503d-533c-8af5-87386c32b071
  title: 'Assurance habitation Égide — cotisation annuelle indicative pour un locataire
    de deux pièces : explications'
  body: '### Pourquoi ma cotisation indicative est-elle de 168 € ?

    Le montant de 168 € est une valeur de référence pour un locataire occupant un
    logement de deux pièces. Ce chiffre est indicatif car la cotisation finale est
    calculée selon des critères précis : la zone géographique du logement, la valeur
    des biens déclarés et les options de couverture choisies. Ce tarif reflète l''équité
    de notre modèle mutuel.


    ### Ce montant inclut-il les taxes et frais ?

    Oui, nous intégrons nos frais de gestion de manière transparente dans cette cotisation.
    Ces frais sont justifiés par la maintenance de notre infrastructure sécurisée
    et la gestion active des fonds de la mutuelle, garantissant ainsi la stabilité
    des garanties pour tous nos sociétaires.


    ### Comment savoir si ce tarif s''applique à mon contrat actuel ?

    Nous vous invitons à consulter vos derniers relevés ou à nous demander un récapitulatif
    de vos garanties. Si vous souhaitez ajuster vos couvertures pour optimiser votre
    prime, nous restons à votre disposition pour vous accompagner pédagogiquement
    dans vos choix.'
  domain: insurance
  product_category: assurance_habitation
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 5ac986ca-8c3f-5a07-af82-b1e37c7c8943
  title: Assurance habitation Égide — souscrire et activer
  body: 'Souscrire à l''Assurance habitation Égide est une démarche simple qui nous
    permet de vous accueillir en tant que sociétaire. Voici les étapes à suivre pour
    activer votre protection résidentielle :


    1. **Transmission des informations du logement** : Communiquez-nous la nature
    de votre habitation (propriétaire ou locataire), la surface, le nombre de pièces
    ainsi que l''adresse exacte du domicile à protéger.

    2. **Évaluation du risque et choix des garanties** : Sur la base de vos informations,
    nous vous proposons une cotisation adaptée. À titre d''exemple, un locataire d''un
    deux-pièces pourrait voir une proposition autour de 168 € par an. Nous vous expliquerons
    alors le détail des franchises, notamment la franchise standard de 150 € et celle
    liée aux catastrophes naturelles de 380 €.

    3. **Vérification d''identité et authentification** : Conformément à nos règles
    de sécurité, nous procédons à une vérification rigoureuse de votre identité. Nous
    vous demanderons de nous fournir une pièce d''identité valide et un justificatif
    de domicile récent.

    4. **Signature et validation du contrat** : Une fois l''identité vérifiée, nous
    vous transmettons le contrat définitif. Dès votre signature, nous activons vos
    garanties.

    5. **Confirmation d''activation** : Nous vous envoyons une confirmation écrite
    (email ou courrier) comprenant votre numéro de contrat et votre attestation d''assurance,
    document indispensable pour justifier de votre couverture auprès de votre bailleur
    ou établissement financier.


    Une fois le contrat actif, vous disposez d''une protection complète. Nous vous
    rappelons qu''en cas de sinistre, vous disposez d''un délai strict de 5 jours
    ouvrés pour nous déclarer l''événement afin de garantir la validité de vos garanties.'
