- id: e7bf56f0-9540-5013-850e-d4ad7e0816e5
  title: Complémentaire santé Égide — informations réglementaires
  body: 'La Complémentaire santé Égide est opérée par Égide Assurances, société d''assurance
    mutuelle. Nous exerçons notre activité sous la surveillance rigoureuse de l''Autorité
    de Contrôle Prudentiel et de Résolution (ACPR) et nous nous conformons strictement
    au Code des assurances.


    **Protection des fonds et des sociétaires**

    Conformément à notre cadre opérationnel, nous respectons les dispositifs de protection
    des assurés. Pour les contrats de personnes, la protection du Fonds de Garantie
    des Assurances de Personnes (FGAP) est assurée jusqu''à 70 000 €.


    **Gestion des sinistres et délais**

    Nous appliquons une politique de tolérance zéro envers la fraude. Pour garantir
    la validité des garanties et l''impartialité du traitement, nous appliquons strictement
    les délais légaux de déclaration. Notamment, tout sinistre doit être déclaré dans
    un délai de 5 jours ouvrés.


    **Protection des données et sécurité**

    Le traitement équitable des sociétaires et la protection de leurs données personnelles
    sont au cœur de notre engagement. À ce titre, une authentification forte et une
    vérification rigoureuse de l''identité sont obligatoires avant toute action modifiant
    l''état d''un contrat, tout retrait ou tout transfert de fonds.


    **Limites de conseil**

    Nous fournissons des informations sur nos produits et une éducation financière
    générale. Toutefois, nous ne délivrons aucun conseil fiscal, juridique ou médical
    personnalisé. Nous invitons systématiquement nos sociétaires à se tourner vers
    des experts certifiés pour ces besoins spécifiques.


    *Ce document est destiné aux agents de support pour garantir la conformité des
    informations transmises aux sociétaires.*'
