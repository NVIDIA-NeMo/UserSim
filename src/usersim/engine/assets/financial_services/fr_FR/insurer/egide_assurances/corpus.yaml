- id: 485eaf85-ec80-56f0-9e31-0caa55a47ab3
  title: Assurance habitation Égide — informations sur les risques
  body: "Le présent document détaille les risques et les limites liés à la souscription\
    \ de l'Assurance habitation Égide. Nous nous engageons à fournir une information\
    \ transparente pour permettre à nos sociétaires de prendre des décisions éclairées.\n\
    \nRisque lié aux délais de déclaration :\nNous attirons votre attention sur le\
    \ fait que la validité des garanties est conditionnée par le respect des délais\
    \ de déclaration. Tout sinistre doit nous être notifié dans un délai maximal de\
    \ 5 jours ouvrés. Tout dépassement de ce délai peut entraîner une réduction de\
    \ l'indemnité ou une déchéance totale de la garantie, conformément au Code des\
    \ assurances.\n\nRisque financier lié aux franchises :\nLe sociétaire doit être\
    \ conscient que l'indemnisation n'est jamais intégrale. Le montant de la franchise\
    \ reste systématiquement à la charge de l'assuré :\n- Franchise standard : 150\
    \ €\n- Franchise catastrophe naturelle : 380 €\n\nCadre Réglementaire :\nÉgide\
    \ Assurances opère sous la surveillance de l'ACPR. Nous respectons strictement\
    \ le Code des assurances pour garantir un traitement équitable de tous les sociétaires.\
    \ \n\nLimites de conseil :\nNous fournissons des informations sur nos produits\
    \ et une éducation financière générale. Nous ne délivrons aucun conseil juridique\
    \ ou fiscal personnalisé. Pour toute question spécifique à votre situation fiscale\
    \ ou juridique, nous vous recommandons de consulter un expert certifié."
  domain: insurance
  product_category: assurance_habitation
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ec40195a-192f-51e5-85f3-a6e0b2cc8ae5
  title: Assurance habitation Égide — calcul et application des taux
  body: "La structure tarifaire de l'Assurance habitation Égide repose sur un principe\
    \ d'équité et de transparence, propre à notre modèle mutuel. \n\nDétermination\
    \ de la cotisation :\nLe montant de la cotisation annuelle n'est pas un taux fixe\
    \ unique, mais résulte d'une analyse rigoureuse des risques liés au domicile et\
    \ à l'environnement. À titre d'exemple, une cotisation annuelle type peut s'élever\
    \ à 168 €.\n\nÉléments influençant le montant :\n- Les caractéristiques du bien\
    \ (surface, localisation, matériaux).\n- Le niveau de couverture choisi.\n- Les\
    \ frais de maintenance d'une infrastructure numérique sécurisée et la gestion\
    \ active des fonds de garantie.\n\nApplication des frais :\nConformément à notre\
    \ philosophie, nous ne prélevons aucun frais caché. La cotisation est justifiée\
    \ par la nécessité de garantir la pérennité du modèle mutuel pour l'ensemble des\
    \ sociétaires.\n\nFranchises applicables :\nIndépendamment du taux de cotisation,\
    \ les franchises suivantes s'appliquent lors d'un sinistre :\n- 150 € pour les\
    \ sinistres standards.\n- 380 € pour les catastrophes naturelles."
  domain: insurance
  product_category: assurance_habitation
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 4d6a5159-edb7-561a-9e2a-07b1990397ce
  title: Assurance habitation Égide — offre de parrainage et de fidélité
  body: 'Nous avons le plaisir de proposer à nos sociétaires un programme de parrainage
    visant à renforcer notre modèle coopératif. Cette offre est valable pour toute
    nouvelle souscription à l''Assurance habitation Égide effectuée entre le 1er janvier
    2025 et le 31 mars 2025.


    Pour chaque nouveau membre nous recommandons et qui souscrit un contrat, le parrain
    et le filleul bénéficient chacun d''une réduction forfaitaire de 20 € sur leur
    prochaine cotisation annuelle. Cette remise témoigne de notre reconnaissance envers
    ceux qui partagent les valeurs de transparence et d''éthique d''Égide Assurances.


    Pour en profiter, le nouveau sociétaire doit mentionner le nom et le numéro de
    contrat du parrain lors de sa souscription. Le crédit sera appliqué automatiquement
    sur le compte du sociétaire dans un délai de 30 jours après la validation du contrat.
    Nous vous invitons à consulter les conditions complètes de l''offre pour tout
    détail supplémentaire.'
  domain: insurance
  product_category: assurance_habitation
