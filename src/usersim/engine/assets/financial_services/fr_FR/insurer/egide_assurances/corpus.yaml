- id: 0eb8ef8a-6fda-51e1-85dc-86fa799a89f8
  title: Complémentaire santé Égide — souscrire et activer
  body: 'Souscrire à la Complémentaire santé Égide est une démarche simple que nous
    avons optimisée pour vous accompagner vers une protection immédiate. Voici les
    étapes à suivre pour activer votre couverture.


    **Prérequis avant de commencer**

    Pour finaliser votre adhésion, vous devrez avoir à disposition une pièce d''identité
    valide et votre attestation de droits à l''Assurance Maladie (carte Vitale).


    **Étapes de souscription**


    1. **Définition de vos besoins** : Indiquez-nous votre profil (âge, situation
    familiale) et les garanties souhaitées. Nous vous confirmerons alors le montant
    de votre cotisation, basée sur notre tarif indicatif (par exemple 58 € pour un
    adulte de 40 ans).

    2. **Vérification d''identité** : Conformément à notre politique de sécurité,
    nous procédons à une vérification rigoureuse de votre identité. Vous devrez nous
    fournir une copie numérique de vos justificatifs. Cette étape est obligatoire
    avant toute activation de contrat.

    3. **Signature du contrat** : Nous vous transmettons le contrat électronique.
    Une fois signé, vous devenez officiellement sociétaire d''Égide Assurances.

    4. **Confirmation d''activation** : Nous vous envoyons une confirmation d''activation
    par email, accompagnée de votre numéro d''adhérent et de vos attestations de tiers
    payant.


    **Comment savoir si l''activation a réussi ?**

    L''activation est effective lorsque vous recevez votre certificat d''adhésion.
    Vous pourrez alors accéder à l''ensemble de vos services via notre portail client
    numérique.


    *Note : En cas de dossier complexe, nous escaladons votre demande vers un gestionnaire
    spécialisé pour garantir un traitement équitable et personnalisé.*'
  domain: insurance
  product_category: complementaire_sante
  document_type: how_to_guide
  source_authority: official
  placeholder: true
