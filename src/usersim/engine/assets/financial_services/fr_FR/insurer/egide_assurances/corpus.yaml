- id: 0da6cf96-ebde-5ba7-a0bb-11dd9f2630a0
  title: Assurance auto Égide — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales et particulières applicables à l''Assurance auto Égide. En tant que
    société d''assurance mutuelle, nous nous engageons à une transparence totale concernant
    l''évolution de nos garanties et de nos tarifs.


    Nous nous réservons le droit de modifier les conditions du contrat pour refléter
    les évolutions réglementaires du Code des assurances ou pour adapter notre gestion
    active des risques. Toute modification impactant vos garanties ou vos cotisations
    vous sera notifiée par email ou via votre portail client avec un préavis minimum
    de deux mois. Si vous refusez les nouvelles conditions, vous disposez de la possibilité
    de résilier votre contrat sans frais, conformément aux dispositions légales en
    vigueur.


    L''équité entre tous les sociétaires étant notre priorité, les ajustements tarifaires
    sont justifiés par la maintenance de notre infrastructure sécurisée et la pérennité
    du modèle mutuel. Par exemple, si la structure des frais de gestion évolue, nous
    vous en informerons avec précision.


    Il est primordial de noter que le respect des obligations contractuelles est une
    condition sine qua non du maintien des garanties. Notamment, le délai de déclaration
    des sinistres est strictement fixé à 5 jours ouvrés. Tout manquement à ce délai
    peut entraîner une réduction, voire une déchéance de l''indemnisation.


    De même, pour les contrats incluant une couverture complète, la franchise de 300
    € reste applicable et peut être révisée lors des renouvellements annuels selon
    les critères de risque et le bonus acquis par le sociétaire. Tout litige relatif
    à ces modifications sera traité avec impartialité et peut, en dernier recours,
    être porté devant la Médiation de l''assurance.'
  domain: insurance
  product_category: assurance_auto
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: da385d88-c0a9-5ddd-a268-ef553793afeb
  title: Assurance auto Égide — prise en main pas à pas
  body: 'Ce guide est destiné aux gestionnaires pour accompagner les sociétaires dans
    la mise en service de leur Assurance auto Égide. Notre approche se veut pédagogique
    et rassurante, reflétant notre positionnement de partenaire de confiance.


    Étape 1 : Constitution du dossier

    Nous demandons au futur sociétaire de fournir les pièces justificatives nécessaires
    (permis de conduire, carte grise, relevé d''informations). L''agent doit s''assurer
    que l''identité est vérifiée rigoureusement avant toute saisie dans le système.


    Étape 2 : Évaluation du profil et tarification

    L''agent calcule la prime en fonction du profil. À titre d''exemple, pour un profil
    type, la cotisation annuelle peut être de 640 €. Il convient d''expliquer au sociétaire
    que ce montant inclut la gestion active des fonds et la maintenance de l''infrastructure
    sécurisée, garantissant ainsi l''équité entre tous les membres de la mutuelle.


    Étape 3 : Choix des garanties et franchises

    L''agent présente les différentes formules. Pour la formule complète, il est impératif
    de mentionner clairement la franchise de 300 € qui reste à la charge de l''assuré
    après indemnisation. L''agent doit également expliquer le fonctionnement du bonus,
    en précisant que le bonus maximal atteignable est de 50 %.


    Étape 4 : Validation et signature numérique

    Une fois les termes acceptés, le contrat est généré. Le sociétaire signe via le
    portail client numérique. L''agent confirme alors la date d''effet des garanties.


    Étape 5 : Information sur les sinistres

    L''agent doit conclure l''entretien en rappelant l''obligation légale de déclarer
    tout sinistre dans un délai de 5 jours ouvrés pour garantir la validité des garanties.


    Pour toute question complexe lors de l''onboarding, le dossier doit être escaladé
    vers un gestionnaire spécialisé.'
  domain: insurance
  product_category: assurance_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 29036866-7ff9-5c81-8af5-b9644e86c46b
  title: 'Assurance auto Égide — bonus maximal : explications'
  body: 'Voici les réponses aux questions fréquentes concernant le système de bonus
    de l''Assurance auto Égide.


    **Qu''est-ce que le bonus maximal chez Égide Assurances ?**

    Le bonus est une réduction appliquée sur votre prime d''assurance pour récompenser
    votre prudence et l''absence de sinistres responsables. Pour l''Assurance auto
    Égide, le bonus maximal est fixé à 50 %. Cela signifie que vous pouvez bénéficier
    d''une réduction allant jusqu''à 50 % sur la partie tarifaire de votre cotisation.


    **Comment atteindre ce niveau de bonus ?**

    Ce bonus s''acquiert progressivement chaque année sans sinistre déclaré. Nous
    appliquons un système de calcul transparent et équitable pour tous nos sociétaires.


    **Le bonus est-il garanti à vie ?**

    Non, le bonus évolue selon votre historique de conduite. En cas de sinistre responsable,
    un malus peut être appliqué, réduisant ainsi votre niveau de bonus conformément
    au Code des assurances.'
  domain: insurance
  product_category: assurance_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 809eb9e1-9d26-53d7-94cc-369d0313a30c
  title: Assurance auto Égide — effectuer une modification
  body: 'Vous souhaitez modifier les informations de votre Assurance auto Égide (changement
    de véhicule, adresse, ou ajout d''un conducteur) ? Voici la marche à suivre pour
    effectuer cette modification en toute sécurité.


    **Prérequis**

    Avant de commencer, munissez-vous de vos nouveaux justificatifs (par exemple,
    la nouvelle carte grise en cas de changement de véhicule) et de vos identifiants
    de connexion.


    **Étapes de modification**


    1. **Demande de modification** : Indiquez-nous précisément la nature du changement
    que vous souhaitez apporter à votre contrat via notre portail client ou par email.

    2. **Vérification d''identité** : Pour protéger vos données, nous procéderons
    à une authentification forte. Nous vous demanderons de confirmer votre identité
    via une procédure sécurisée avant toute action modifiant l''état de votre contrat.

    3. **Transmission des justificatifs** : Communiquez-nous les documents requis.
    Nous vérifierons la conformité de ces pièces avec les exigences de l''ACPR.

    4. **Analyse et proposition** : Nous analyserons l''impact de la modification
    sur vos garanties et votre cotisation. Si le changement entraîne une variation
    de prix (par exemple, si le nouveau véhicule change la prime annuelle, dont l''exemple
    type est de 640 €), nous vous en informerons précisément.

    5. **Confirmation et avenant** : Une fois que vous aurez validé la proposition,
    nous vous transmettrons un avenant au contrat par email. Ce document officialise
    la modification.


    **Comment savoir si la modification est effective ?**

    Vous recevrez une notification de confirmation sur votre portail client et l''avenant
    sera disponible dans votre espace personnel. Votre nouvelle attestation d''assurance
    sera mise à jour et pourra être téléchargée immédiatement.'
  domain: insurance
  product_category: assurance_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 0b4928ee-7800-5ef5-8889-fabc76b6f024
  title: Assurance auto Égide — problèmes d'accès ou de connexion
  body: "Il peut arriver que vous rencontriez des difficultés pour accéder à votre\
    \ espace client pour gérer votre Assurance auto Égide. Voici comment diagnostiquer\
    \ et résoudre ces problèmes.\n\n**Symptôme : Impossible de se connecter au portail\
    \ client**\n\n*   **Cause probable 1 : Identifiants incorrects**\n    Vérifiez\
    \ que vous utilisez l'adresse email associée à votre contrat de sociétaire. Attention\
    \ aux erreurs de frappe dans le mot de passe.\n    *Fixe* : Utilisez la fonction\
    \ « Mot de passe oublié » pour réinitialiser vos accès via un lien sécurisé envoyé\
    \ par email.\n\n*   **Cause probable 2 : Échec de l'authentification forte**\n\
    \    L'authentification forte est obligatoire pour accéder aux fonctions de modification\
    \ de contrat. Si vous ne recevez pas le code de confirmation sur votre téléphone\
    \ ou email, vérifiez vos dossiers de courriers indésirables.\n    *Fixe* : Assurez-vous\
    \ que vos coordonnées de contact sont à jour. Si le problème persiste, demandez-nous\
    \ de vérifier votre statut d'authentification.\n\n*   **Cause probable 3 : Maintenance\
    \ du système**\n    Pour garantir la pérennité et la sécurité de notre infrastructure,\
    \ nous effectuons parfois des mises à jour techniques.\n    *Fixe* : Patientez\
    \ quelques instants et tentez une nouvelle connexion. Les interruptions sont généralement\
    \ brèves.\n\n**Quand escalader le problème ?**\nSi après ces vérifications vous\
    \ n'avez toujours pas accès à vos documents (comme votre attestation d'assurance),\
    \ nous interviendrons.\n\n*   **Action de notre part** : Nous ouvrirons un ticket\
    \ technique et, si nécessaire, nous escaladerons votre dossier vers un gestionnaire\
    \ spécialisé en support numérique.\n*   **Résultat pour vous** : Vous recevrez\
    \ un email de confirmation de la prise en charge et, en cas d'urgence, nous pourrons\
    \ vous envoyer vos documents par email sécurisé après une vérification rigoureuse\
    \ de votre identité."
  domain: insurance
  product_category: assurance_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 622873cc-a8bd-5b16-a177-308c6adedd75
  title: Assurance auto Égide — niveaux d'accès
  body: 'Ce tableau définit les niveaux d''accès et les droits associés pour la gestion
    des contrats Assurance auto Égide au sein de notre organisation.


    | Profil Utilisateur | Accès Consultation | Accès Modification | Validation Financière
    | Condition d''Accès |

    | :--- | :---: | :---: | :---: | :--- |

    | **Sociétaire** | Oui | Oui (via authentification forte) | Non | Possession d''un
    contrat actif |

    | **Gestionnaire Standard** | Oui | Oui | Non | Accès au portail interne validé
    |

    | **Gestionnaire Spécialisé** | Oui | Oui | Oui | Certification expertise sinistres/contrats
    |

    | **Médiation de l''assurance** | Oui (Dossiers assignés) | Non | Non | Saisine
    officielle du dossier |


    Note : Toute action modifiant l''état d''un contrat ou entraînant un transfert
