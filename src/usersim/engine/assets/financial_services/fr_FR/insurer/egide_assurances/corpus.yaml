- id: 108be1ee-0215-566c-a06d-324e1f9cbbcf
  title: Assurance habitation Égide — face à un produit similaire de l'établissement
  body: 'L''Assurance habitation Égide se distingue par son modèle mutuel, où l''assuré
    est un sociétaire participant à la gouvernance, contrairement aux offres d''assurance
    habitation classiques du marché qui sont purement commerciales.


    **Comparaison des dimensions clés :**

    - **Coût et Transparence** : Avec une cotisation indicative de 168 € pour un locataire
    de deux pièces, nous privilégions la stabilité et l''équité plutôt que la maximisation
    des profits.

    - **Accès et Flexibilité** : Notre produit se caractérise par une résiliation
    simplifiée après un an, offrant une agilité supérieure aux contrats engageants
    sur plusieurs années.

    - **Gestion des Risques** : Nous appliquons des franchises claires et fixes (150
    € en standard, 380 € pour les catastrophes naturelles), sans frais cachés.


    **Lequel choisir ?**

    - **Assurance habitation Égide** : Idéale pour les familles et particuliers recherchant
    un partenaire de confiance, une éthique coopérative et une gestion transparente.

    - **Offres classiques** : Peuvent convenir à ceux recherchant des options de couverture
    très spécifiques ou complexes non couvertes par notre modèle mutuel standard.'
  domain: insurance
  product_category: assurance_habitation
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 9450af32-4ac4-5483-8e50-9eb0cf720c96
  title: Assurance habitation Égide — informations réglementaires
  body: 'L''Assurance habitation Égide est opérée dans le strict respect du Code des
    assurances et sous la surveillance de l''Autorité de Contrôle Prudentiel et de
    Résolution (ACPR). Notre cadre opérationnel place la protection des données et
    le traitement équitable des sociétaires au cœur de ses priorités.


    **Cadre Légal et Conformité**

    Nous appliquons une politique de tolérance zéro envers la fraude. Toute fausse
    déclaration lors de la souscription ou de la déclaration de sinistre peut entraîner
    la nullité du contrat et la déchéance des garanties.


    **Délais de Déclaration**

    Conformément aux dispositions légales et contractuelles, les délais de déclaration
    des sinistres sont strictement appliqués. Le délai pour déclarer un sinistre est
    de 5 jours ouvrés. Le non-respect de ce délai peut entraîner une réduction, voire
    une exclusion de l''indemnisation, afin de garantir la validité et la pérennité
    du fonds mutuel.


    **Structure Tarifaire et Frais**

    Nos cotisations, comme l''exemple de 168 € annuel pour un locataire, sont justifiées
    par la gestion active des fonds et la maintenance d''une infrastructure sécurisée.
    Cette structure garantit l''équité entre tous les sociétaires et la viabilité
    du modèle coopératif.


    **Vérification et Sécurité**

    Conformément aux normes de lutte contre le blanchiment et le financement du terrorisme,
    une authentification forte et une vérification rigoureuse de l''identité sont
    obligatoires avant toute action modifiant l''état d''un contrat ou tout transfert
    de fonds.


    **Limites de Conseil**

    Nous fournissons des informations sur nos produits et une éducation financière
    générale. Nous ne délivrons aucun conseil fiscal, juridique ou médical personnalisé.
    Nous invitons nos sociétaires à se tourner vers des experts certifiés pour ces
    besoins spécifiques.'
  domain: insurance
  product_category: assurance_habitation
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c00fed2b-ee4e-5d3e-8e24-2c3c2aeabf0f
  title: Assurance habitation Égide — grille des taux
  body: 'L''Assurance habitation Égide applique une tarification basée sur la mutualisation
    des risques, assurant ainsi une équité entre tous les sociétaires.


    **Tarif de Référence**

    - Cotisation annuelle indicative (locataire, logement 2 pièces) : 168 €


    **Éléments de Calcul**

    Le montant final de la cotisation n''est pas un taux fixe unique, mais résulte
    de l''application de critères de risque transparents :

    1. **Type d''occupation** : Locataire ou propriétaire.

    2. **Caractéristiques du bien** : Surface, nombre de pièces et localisation.

    3. **Niveau de garantie** : Options choisies pour les biens mobiliers.


    **Impact sur la Prime**

    Contrairement aux modèles commerciaux, nous ne cherchons pas la rentabilité maximale
    mais la pérennité du modèle mutuel. Le tarif est donc ajusté pour refléter le
    coût réel de la couverture et les frais de maintenance de notre infrastructure
    sécurisée. Toute modification substantielle du risque (ex: agrandissement du logement)
    entraînera une réévaluation de la cotisation annuelle.'
  domain: insurance
  product_category: assurance_habitation
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 6c25aaf6-87bb-5176-8059-9a640cfb498b
  title: Assurance habitation Égide — offre en cours
  body: 'C''est le moment d''optimiser la protection de votre foyer tout en renforçant
    votre engagement au sein de notre mutuelle.


    **Offre de Fidélité Sociétaire**

    Pour tout sociétaire possédant déjà un contrat chez nous et souscrivant à l''Assurance
    habitation Égide avant le 31 décembre 2025, nous proposons un accompagnement personnalisé
    lors de l''audit de vos garanties.


    **Rappel des conditions avantageuses** :

    - Cotisation indicative accessible : 168 € par an pour un locataire en deux pièces.

    - Résiliation simplifiée après un an, vous offrant une liberté totale après la
    première année d''engagement.

    - Transparence sur les franchises : 150 € (standard) et 380 € (catastrophe naturelle).


    **Comment en profiter ?**

    L''offre est appliquée automatiquement lors de votre demande de souscription.
    Nous procéderons, comme pour tout contrat, à la vérification rigoureuse de votre
    identité pour valider l''activation de vos garanties.'
  domain: insurance
