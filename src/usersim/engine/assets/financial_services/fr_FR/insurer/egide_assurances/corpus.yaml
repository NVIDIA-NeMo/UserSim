- id: 10ce8b92-c67a-5ac7-82e0-4023063112a9
  title: Contrat d'assurance-vie Égide Multisupport — frais ou montant inattendu
  body: 'Ce guide est destiné aux gestionnaires pour accompagner un sociétaire signalant
    un écart entre le montant versé et le solde affiché, ou une diminution inattendue
    de sa valeur de contrat.


    **Symptôme :**

    Le sociétaire indique : « J''ai versé une somme X, mais mon solde n''affiche que
    Y » ou « Mon capital a baissé sans que j''aie effectué de retrait ».


    **Causes probables et vérifications :**

    1. **Frais sur versements :** Vérifiez si le sociétaire vient d''effectuer un
    versement. Rappelez-lui que nous appliquons des frais sur versements de 1 %. Par
    exemple, pour un versement de 500 €, 5 € sont prélevés.

    2. **Frais de gestion annuels :** Vérifiez la date d''anniversaire du contrat
    ou les dates de prélèvement des frais. Précisez que les frais de gestion sont
    de 0,6 % pour le fonds en euros et de 0,85 % pour les unités de compte.

    3. **Variation des marchés (Unités de Compte) :** Si le contrat contient des unités
    de compte, expliquez que leur valeur fluctue selon les marchés financiers et peut
    entraîner une baisse du capital.


    **Résolution dans la conversation :**

    - Détaillez avec le sociétaire le calcul : Montant versé - (1 % de frais) = Montant
    investi.

    - Expliquez la différence entre la sécurité du fonds en euros (taux de 2,6 %)
    et le risque des unités de compte.


    **Escalade :**

    Si le sociétaire conteste toujours le calcul après ces explications pédagogiques,
    ou s''il s''agit d''une erreur technique de calcul, nous escaladerons le dossier
    vers un gestionnaire spécialisé. Le sociétaire recevra une notification de prise
    en charge et une réponse détaillée sous 10 jours ouvrés. Pour approfondir la notion
    de risque, référez-vous à « Contrat d''assurance-vie Égide Multisupport — informations
    sur les risques ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: dc4396cc-6a3e-5f70-b364-7408d65889b5
  title: Contrat d'assurance-vie Égide Multisupport — justificatifs à fournir
  body: 'Pour l''ouverture de votre Contrat d''assurance-vie Égide Multisupport, nous
    devons collecter plusieurs documents afin de respecter nos obligations réglementaires
    et de sécuriser votre compte. Voici la liste des justificatifs requis :


    | Document requis | Condition d''application | Objectif |

    | :--- | :--- | :--- |

    | Pièce d''identité officielle en cours de validité | Obligatoire pour tout souscripteur
    | Vérification rigoureuse de l''identité |

    | Justificatif de domicile récent (moins de 3 mois) | Obligatoire pour tout souscripteur
    | Conformité réglementaire |

    | Relevé d''Identité Bancaire (RIB) | Obligatoire pour tout souscripteur | Validation
    du compte pour les flux financiers |

    | Justificatif d''origine des fonds | Pour tout versement initial ou complémentaire
    important | Lutte contre le blanchiment et le financement du terrorisme |

    | Versement initial minimum de 500 € | Obligatoire à l''ouverture | Activation
    effective du contrat |


    L''absence de l''un de ces documents peut entraîner un retard dans l''activation
    de vos garanties. Nous vous invitons à consulter « Contrat d''assurance-vie Égide
    Multisupport — souscrire et activer » pour connaître les étapes de transmission.'
  domain: insurance
  product_category: assurance_vie_multisupport
