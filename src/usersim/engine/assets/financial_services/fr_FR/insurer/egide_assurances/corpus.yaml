- id: eb0c144f-89cc-5ab8-8f76-ff47314dc817
  title: Assurance auto Égide — opération échouée ou en attente
  body: 'Symptôme : Vous tentez de modifier votre contrat ou d''effectuer un paiement
    de cotisation, mais vous recevez un message d''erreur ou l''opération reste marquée
    « en attente ».


    Causes possibles :

    - Défaut d''authentification : La vérification de l''identité a échoué ou l''authentification
    forte n''a pas été complétée.

    - Document non conforme : Une pièce justificative transmise pour une modification
    de contrat est illisible ou périmée.

    - Incident de paiement : Votre établissement bancaire a bloqué la transaction
    pour des raisons de sécurité.


    Procédure de résolution :

    1. Vérifiez vos identifiants : Assurez-vous que vos informations de connexion
    sont correctes et que vous avez validé l''étape d''authentification forte sur
    votre appareil mobile.

    2. Contrôlez vos documents : Si une modification est en attente, vérifiez que
    la pièce d''identité ou la carte grise transmise est bien nette et entière.

    3. Contactez votre banque : Vérifiez si un plafond de paiement a été atteint ou
    si une validation 3D Secure est requise pour le règlement de votre cotisation.


    Échelonnement et résolution :

    Si le problème persiste après ces vérifications, nous intervenons pour débloquer
    la situation. Nous escaladons votre dossier vers un gestionnaire spécialisé qui
    analysera l''anomalie technique ou administrative. Vous recevrez une notification
    de confirmation de traitement sous 48 heures ouvrables dès que l''opération sera
    validée ou si des informations complémentaires sont nécessaires.'
  domain: insurance
  product_category: assurance_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: b69245a7-942f-5d3a-a26d-07aa185d6e48
  title: Assurance auto Égide — conditions d'éligibilité
  body: 'L''éligibilité à l''Assurance auto Égide est déterminée selon les critères
    suivants :


    | Condition | Résultat |

    | :--- | :--- |

    | Détention d''un permis de conduire valide et correspondant à la catégorie du
    véhicule | Éligible |

    | Résidence fiscale principale située en France ou dans l''UE | Éligible |

    | Absence de fraude avérée lors des précédentes souscriptions d''assurance | Éligible
    |

    | Mineur non émancipé sans représentant légal | Non éligible |

    | Véhicule dont l''usage est strictement professionnel (transport de marchandises
    lourdes) | Orientation vers contrat spécifique |


    L''admission en qualité de sociétaire est soumise à l''acceptation des principes
    de notre mutuelle et à la fourniture des justificatifs d''identité requis.'
