- id: 9584f367-2ad3-5a8a-b8d9-e92f91138306
  title: Assurance auto Égide — bonnes pratiques de sécurité du compte
  body: 'La protection de vos données et la sécurité de vos contrats sont au cœur
    de notre cadre opérationnel chez Égide Assurances. Afin de prévenir tout risque
    de fraude ou d''accès non autorisé à vos informations personnelles, nous vous
    recommandons d''appliquer rigoureusement les bonnes pratiques suivantes pour votre
    Assurance auto Égide.


    Nous vous rappelons qu''une authentification forte et une vérification rigoureuse
    de l''identité sont obligatoires avant toute action modifiant l''état d''un contrat,
    tout retrait ou tout transfert de fonds. C''est pourquoi nous ne vous demanderons
    jamais votre mot de passe ou vos codes secrets par email ou par téléphone.


    Soyez vigilants face aux tentatives de « phishing » (hameçonnage). Si vous recevez
    un message suspect vous demandant de cliquer sur un lien pour « mettre à jour
    vos documents » ou « confirmer un paiement », ne le faites pas. Adressez-vous
    systématiquement à nous via notre portail client numérique sécurisé ou par téléphone
    durant nos heures ouvrables (CET).


    En cas de doute ou si vous constatez une activité inhabituelle sur votre espace
    client, informez-nous sans délai. Une réaction rapide est essentielle pour sécuriser
    vos garanties. Par ailleurs, nous vous rappelons que pour tout sinistre, le respect
    du délai légal de déclaration, soit 5 jours ouvrés, est impératif pour garantir
    la validité de vos couvertures et permettre un traitement impartial de votre dossier.


    Nous appliquons une politique de tolérance zéro envers la fraude. Toute tentative
    de manipulation des informations contractuelles sera traitée avec la plus grande
    fermeté, conformément aux réglementations de l''ACPR et au Code des assurances.'
  domain: insurance
  product_category: assurance_auto
  document_type: security_advisory
  source_authority: official
