- id: 8bebab2e-9d23-5b8a-8710-702fb04c1aca
  title: Assurance auto Égide — quand changer ou monter en gamme
  body: "Ce guide aide les gestionnaires à conseiller les sociétaires sur l'évolution\
    \ de leur couverture Assurance auto Égide.\n\n**Passage d'une formule Tiers vers\
    \ une formule Tous Risques**\n\nLe changement de gamme est recommandé lorsque\
    \ la valeur vénale du véhicule est élevée ou que le sociétaire souhaite une tranquillité\
    \ d'esprit totale. \n\n- **L'offre Tiers** : Convient aux véhicules anciens ou\
    \ à faible valeur. Le coût est réduit, mais les dommages propres ne sont pas couverts.\n\
    - **L'offre Tous Risques** : Idéale pour les véhicules récents. Elle inclut la\
    \ couverture des dommages, avec une franchise de 300 € applicable en cas de sinistre\
    \ responsable.\n\n**Évaluation du Bonus**\n\nSi un sociétaire a atteint le bonus\
    \ maximal de 50 %, il bénéficie déjà de la réduction tarifaire la plus avantageuse\
    \ de notre modèle. Un changement de gamme vers le « Tous Risques » augmentera\
    \ sa prime annuelle (qui pourrait être de 640 € pour un profil moyen), mais optimisera\
    \ sa protection financière globale.\n\nPour plus de détails sur la structure des\
    \ coûts, voir Assurance auto Égide — coûts et frais."
  domain: insurance
  product_category: assurance_auto
  document_type: comparison
  source_authority: official
