- id: 9b582bd1-ec00-55c0-85e8-4e35802cac10
  title: Assurance auto Égide — comparaison avec les alternatives et quand ne pas
    le choisir
  body: 'L''Assurance auto Égide s''inscrit dans un modèle coopératif où la transparence
    et l''éthique priment sur la rentabilité immédiate. Pour vous aider dans votre
    choix, voici comment nous nous positionnons face aux alternatives du marché.


    **Nos atouts face aux assureurs traditionnels**

    Contrairement aux prestataires classiques, nous sommes une mutuelle. Nos assurés
    sont des sociétaires. Cela signifie que notre structure de frais est justifiée
    par la maintenance d''une infrastructure sécurisée et l''équité entre membres,
    plutôt que par la recherche de dividendes pour des actionnaires.


    **Comparaison des indicateurs clés**

    - **Tarification** : Avec une prime annuelle indicative de 640 € pour un profil
    type, nous offrons un rapport qualité-prix stable. Là où certains concurrents
    pratiquent des tarifs d''appel très bas la première année pour les augmenter brutalement
    la seconde, nous privilégions la pérennité.

    - **Bonus** : Nous appliquons un système de bonus optimisé pouvant atteindre 50
    %, offrant une réduction significative et juste pour les conducteurs prudents.

    - **Transparence des frais** : Notre franchise tous risques est clairement fixée
    à 300 €, sans frais cachés ou options complexes.


    **Quand ne pas choisir l''Assurance auto Égide ?**


    Notre solution peut ne pas être la plus adaptée si :

    1. Vous recherchez un contrat « low-cost » sans aucune garantie complémentaire,
    acceptant en échange un service client automatisé et sans accompagnement humain.

    2. Vous ne pouvez pas respecter la rigueur de nos délais de déclaration (5 jours
    ouvrés), car notre modèle mutuel repose sur la responsabilité et l''impartialité
    du traitement des dossiers.

    3. Vous souhaitez un bonus dépassant les 50 %, ce qui n''est pas compatible avec
    notre grille tarifaire équitable.'
  domain: insurance
  product_category: assurance_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 58290623-c0ea-550c-8897-0705d3b113af
  title: Assurance auto Égide — coûts et frais
  body: '**Comment sont déterminés les tarifs de l''Assurance auto Égide ?**


    Nos tarifs sont calculés pour garantir l''équité entre tous les sociétaires et
    la pérennité de notre modèle mutuel. À titre d''exemple, la prime annuelle indicative
    pour un profil standard est de 640 €. Ce montant inclut la gestion active des
    risques et la maintenance de notre infrastructure sécurisée.


    **Quels sont les frais restant à ma charge en cas de sinistre ?**


    Si vous avez souscrit à une formule tous risques, une franchise de 300 € est appliquée.
    Ce montant est déduit de l''indemnisation finale. Cette structure tarifaire transparente
    permet de maintenir des primes abordables pour l''ensemble de la communauté.


    **Le bonus influence-t-il le coût ?**


    Oui, absolument. Notre système de bonus permet de réduire vos cotisations selon
    votre historique de conduite, avec un plafond de réduction maximale atteignant
    50 %.'
  domain: insurance
  product_category: assurance_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a048144e-22f1-59cd-ae7e-24db8ce25bd7
  title: Assurance auto Égide — traiter une demande courante de bout en bout
  body: 'Nous vous accompagnons dans la gestion de vos contrats. Voici la procédure
    complète pour déclarer un sinistre automobile et obtenir l''indemnisation correspondante
    avec l''Assurance auto Égide.


    **Prérequis :**

    - Votre numéro de contrat.

    - Les photos des dommages et, le cas échéant, le rapport de police ou le constat
    amiable.


    **Étapes de traitement :**


    1. **Signalement initial** : Déclarez le sinistre dès la survenue de l''événement.
    Attention : vous devez impérativement nous informer dans un délai de 5 jours ouvrés
    pour que vos garanties restent valides.

    2. **Transmission des preuves** : Envoyez-nous via le portail client les photos
    du véhicule et le constat amiable dûment rempli. Si vous ne pouvez pas utiliser
    le numérique, nous acceptons l''envoi par email.

    3. **Expertise du véhicule** : Nous mandatons un expert agréé pour évaluer les
    dommages. Nous vous confirmerons le rendez-vous et le lieu de l''expertise.

    4. **Validation de l''indemnité** : Une fois le rapport d''expert reçu, nous calculons
    l''indemnité. Nous déduirons la franchise applicable, qui est de 300 € pour les
    contrats tous risques.

    5. **Versement des fonds** : Après vérification rigoureuse de votre identité et
    de vos coordonnées bancaires, nous procédons au virement des fonds sur votre compte.


    **Comment savoir si la demande est traitée ?**


    Vous recevrez un email de confirmation à chaque étape majeure (déclaration validée,
    expertise terminée, paiement ordonné). Vous pouvez également suivre l''état d''avancement
    en temps réel dans la rubrique « Mes Sinistres » de votre espace client. Pour
    consulter le détail de vos opérations passées, reportez-vous au guide Assurance
    auto Égide — consulter le suivi ou l''historique.'
  domain: insurance
  product_category: assurance_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 6a8ca244-fb7f-5b66-8687-048f4a98d396
  title: Assurance auto Égide — écart avec vos relevés
  body: 'Ce document guide les gestionnaires lors du traitement d''une réclamation
    d''un sociétaire signalant un écart entre la prime attendue et le montant prélevé
    sur ses relevés pour l''Assurance auto Égide.


    **Symptôme :**

    Le sociétaire affirme que sa cotisation annuelle ne correspond pas à la simulation
    initiale ou qu''une indemnité versée est inférieure au montant estimé par l''expert.


    **Points de vérification et causes probables :**


    1. **Application du Bonus** : Vérifiez le taux de bonus appliqué. Le sociétaire
    a peut-être anticipé un bonus supérieur au maximum autorisé. Rappelez-lui que
    le bonus maximal est de 50 %. Si le calcul a été fait sur la base de 70 % (hors
    grille), l''écart provient de ce plafond.

    2. **Déduction de la Franchise** : En cas de sinistre, vérifiez si la franchise
    de 300 € a été correctement déduite du montant des réparations. Un sociétaire
    peut oublier que ce montant reste à sa charge dans le cadre d''un contrat tous
    risques.

    3. **Ajustement de la Prime** : Comparez le prélèvement avec la prime annuelle
    de référence (exemple : 640 €). Vérifiez si des options supplémentaires ont été
    ajoutées ou si le profil de risque a évolué.


    **Résolution :**


    - **Erreur de calcul** : Si une erreur de saisie est avérée, nous procédons à
    une régularisation immédiate sur le prochain prélèvement.

    - **Malentendu contractuel** : Expliquez pédagogiquement la règle du bonus maximal
    (50 %) ou le fonctionnement de la franchise (300 €).


    **Escalade :**

    Si le sociétaire conteste toujours la base du calcul malgré vos explications,
    le dossier doit être transmis à un gestionnaire spécialisé pour une analyse approfondie.
    Si le litige persiste, nous orientons le sociétaire vers la Médiation de l''assurance
    en dernier recours.'
  domain: insurance
  product_category: assurance_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: abfd08a4-167c-5483-978a-6a728224d5a2
  title: Complémentaire santé Égide — présentation
  body: "Bienvenue chez Égide Assurances. Nous avons conçu la Complémentaire santé\
    \ Égide comme une mutuelle santé responsable, pensée pour offrir aux particuliers\
    \ et aux familles un accès serein aux soins, tout en garantissant l'accès aux\
    \ paniers 100 % Santé sans reste à charge.\n\nNotre modèle est celui d'une société\
    \ d'assurance mutuelle. En choisissant notre couverture, vous ne devenez pas un\
    \ simple client, mais un sociétaire. Cela signifie que vous participez à une gouvernance\
    \ coopérative où l'éthique et la transparence priment sur la recherche de profit.\
    \ Nous nous positionnons comme votre partenaire de confiance pour protéger votre\
    \ santé et celle de vos proches.\n\nLa Complémentaire santé Égide se distingue\
    \ par des garanties claires et des prises en charge concrètes pour limiter vos\
    \ dépenses de santé. À titre d'exemple, nous proposons une cotisation mensuelle\
    \ indicative de 58 € pour un adulte de 40 ans, permettant de bénéficier d'une\
    \ couverture complète. \n\nParmi nos prestations, nous incluons un soutien actif\
    \ pour les soins coûteux. Nous proposons ainsi un forfait optique de 200 € tous\
    \ les deux ans (hors panier 100 % Santé) pour vous aider dans le renouvellement\
    \ de vos équipements visuels. De plus, pour pallier les frais annexes lors d'une\
    \ hospitalisation, nous versons un forfait journalier hospitalier de 23 € par\
    \ jour d'hospitalisation.\n\nNous opérons sous la surveillance de l'ACPR et respectons\
    \ strictement le Code des assurances. Cette structure nous permet de garantir\
    \ l'équité entre tous nos sociétaires et la pérennité de notre modèle mutuel.\
    \ Nous vous accompagnons quotidiennement via notre portail numérique, par email\
    \ ou par téléphone durant nos heures ouvrables.\n\n*Avertissement : Les montants\
    \ cités sont donnés à titre indicatif et peuvent varier selon votre profil et\
    \ vos besoins spécifiques. Nous vous invitons à consulter vos conditions générales\
    \ pour le détail exact de vos garanties.*"
  domain: insurance
  product_category: complementaire_sante
  document_type: product_sheet
  source_authority: official
  placeholder: true
