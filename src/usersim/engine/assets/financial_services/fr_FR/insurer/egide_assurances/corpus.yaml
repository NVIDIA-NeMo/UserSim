- id: 78e58b09-44a6-5b35-911c-2216956b661f
  title: Assurance auto Égide — grille des taux
  body: "L'Assurance auto Égide utilise un système de bonus-malus pour ajuster la\
    \ cotisation annuelle en fonction du comportement du conducteur.\n\n- Bonus maximal\
    \ : 50 %\n\nCe taux de 50 % représente la réduction maximale applicable sur la\
    \ prime de base pour les sociétaires ayant fait preuve d'une prudence exemplaire\
    \ sur la durée. \n\nLe bonus est recalculé annuellement lors de la date d'échéance\
    \ du contrat. Un sinistre responsable peut entraîner une augmentation de la cotisation\
    \ (malus), tandis qu'une année sans accident permet de progresser vers le bonus\
    \ maximal de 50 %. Ce mécanisme assure une tarification juste et proportionnelle\
    \ au risque réel de chaque sociétaire."
