- id: d6762db1-44d8-54a0-8f98-9a96aee49a01
  title: Assurance habitation Égide — opération échouée ou en attente
  body: 'Il peut arriver qu''une demande de souscription ou une modification de contrat
    pour l''Assurance habitation Égide apparaisse comme « échouée » ou « en attente
    ». Voici comment identifier la cause et résoudre la situation.


    **Symptôme : Votre demande de souscription reste en statut « En attente »**

    - **Cause probable** : Le processus de vérification d''identité est incomplet.
    Nous appliquons une authentification forte obligatoire avant toute activation
    de contrat.

    - **Action à entreprendre** : Vérifiez si nous vous avons sollicité pour un document
    complémentaire (pièce d''identité floue, justificatif de domicile non conforme).
    Fournissez-nous la pièce manquante pour débloquer le dossier.


    **Symptôme : L''opération de modification de contrat a « échoué »**

    - **Cause probable** : Une discordance a été détectée entre les informations fournies
    et les données de votre profil sociétaire, ou la session d''authentification a
    expiré.

    - **Action à entreprendre** : Nous vous invitons à nous confirmer vos informations
    d''identité et à renouveler votre demande.


    **Symptôme : Le paiement de la cotisation annuelle (ex: 168 €) a été refusé**

    - **Cause probable** : Problème lié au moyen de paiement ou plafond atteint.

    - **Action à entreprendre** : Vérifiez auprès de votre banque ou proposez-nous
    un autre mode de règlement.


    **Quand escalader le dossier ?**

    Si malgré vos efforts et la fourniture des documents, l''opération reste bloquée
    plus de 3 jours ouvrés, nous escaladons systématiquement votre dossier vers un
    gestionnaire spécialisé. Ce dernier analysera la situation et vous contactera
    pour finaliser l''opération manuellement. En dernier recours, et conformément
    à notre cadre opérationnel, la Médiation de l''assurance peut être saisie pour
    les litiges persistants.'
  domain: insurance
  product_category: assurance_habitation
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
