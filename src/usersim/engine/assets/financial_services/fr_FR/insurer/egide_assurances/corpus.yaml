- id: a20576fa-66c0-56ed-8db4-a84cfc86f68a
  title: Complémentaire santé Égide — calcul et application des taux
  body: 'La structure tarifaire de la Complémentaire santé Égide repose sur un principe
    d''équité mutuelle. Les cotisations sont calculées pour couvrir les risques du
    groupe tout en maintenant l''infrastructure sécurisée de la société.


    Application des tarifs :

    - Cotisation Mensuelle : Le montant est fixe selon la formule choisie et l''âge
    du sociétaire. À titre d''exemple, la cotisation mensuelle indicative pour un
    adulte de 40 ans est de 58 €.

    - Fréquence de paiement : Les cotisations sont prélevées mensuellement. Tout défaut
    de paiement peut entraîner la suspension des garanties après mise en demeure.

    - Ajustements : Les taux peuvent être révisés annuellement pour refléter l''évolution
    des coûts de santé et maintenir l''équilibre du fonds mutuel. Ces modifications
    sont communiquées avec transparence aux sociétaires.


    Le calcul des remboursements s''appuie sur les plafonds définis dans le contrat,
    tels que le forfait journalier hospitalier de 23 € ou le forfait optique de 200
    € tous les deux ans. Ces montants sont appliqués strictement après déduction de
    la part prise en charge par la Sécurité sociale.'
  domain: insurance
  product_category: complementaire_sante
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 7eb0c78a-eca5-5c79-8291-12da15167459
  title: Complémentaire santé Égide — offre de parrainage et de fidélité
  body: 'Chez Égide Assurances, notre modèle coopératif place le sociétaire au cœur
    de notre gouvernance. C''est pourquoi nous avons mis en place un programme de
    parrainage et de fidélité pour l''année 2025, visant à récompenser ceux qui font
    grandir notre communauté d''entraide.


    Si vous êtes déjà membre de notre mutuelle, nous vous invitons à recommander la
    Complémentaire santé Égide à vos proches. Pour chaque nouveau sociétaire qui rejoint
    notre société grâce à votre recommandation, nous appliquons un avantage sur vos
    cotisations, renforçant ainsi la solidarité entre membres. Cette offre est valable
    pour toute souscription validée entre le 1er janvier 2025 et le 31 décembre 2025.


    En tant que partenaire de confiance, nous nous engageons à ce que ces avantages
    soient appliqués avec transparence et équité. Pour en bénéficier, il vous suffit
    de nous transmettre les coordonnées de votre filleul ou de lui fournir son code
    de parrainage personnel. Nous nous occupons du reste pour valoriser votre fidélité
    au sein de notre mutuelle.'
  domain: insurance
  product_category: complementaire_sante
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 7451e2a8-ebda-5a0c-baaf-92d34ed87738
  title: Complémentaire santé Égide — bonnes pratiques de sécurité du compte
  body: 'La protection de vos données de santé et de vos informations personnelles
    est une priorité absolue pour nous. Afin de garantir la sécurité de votre contrat
    Complémentaire santé Égide, nous vous demandons d''appliquer rigoureusement les
    pratiques suivantes.


    Nous utilisons systématiquement une authentification forte pour l''accès à vos
    services numériques. Ne partagez jamais vos identifiants ou vos codes de validation
    reçus par SMS avec un tiers, même si cette personne prétend travailler pour Égide
    Assurances. Nous ne vous demanderons jamais votre mot de passe par email ou par
    téléphone.


    Soyez vigilants face aux tentatives de phishing. Un email suspect peut tenter
    de vous diriger vers un site imitant notre portail client. Vérifiez toujours que
    l''adresse de l''expéditeur est officielle et que l''URL du site est sécurisée.
    Si vous constatez une anomalie ou si vous recevez une demande de transfert de
    fonds inhabituelle, informez-nous sans délai.


    Sachez qu''une vérification rigoureuse de l''identité est obligatoire avant toute
    action modifiant l''état de votre contrat, tout retrait ou tout transfert de fonds.
    Cette procédure est la seule garantie contre l''usurpation d''identité.


    Enfin, nous vous rappelons que pour la validité de vos garanties, les délais légaux
    de déclaration doivent être respectés. Notamment, tout sinistre doit nous être
    déclaré dans un délai strict de 5 jours ouvrés. Tout manquement à ce délai pourrait
    compromettre le traitement impartial de votre demande.


    En cas de doute sur l''authenticité d''une communication, nous vous conseillons
    de ne cliquer sur aucun lien et de nous contacter directement par nos canaux officiels
    durant nos heures ouvrables (CET).'
  domain: insurance
  product_category: complementaire_sante
  document_type: security_advisory
  source_authority: official
  placeholder: true
