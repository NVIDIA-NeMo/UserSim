  institution_id: egide_assurances
- id: 9da12a3f-dcda-5965-be0a-50a3ae7444b8
  title: Complémentaire santé Égide — informations sur les risques
  body: 'La Complémentaire santé Égide est un contrat d''assurance soumis aux réglementations
    strictes du marché français. Nous opérons sous la surveillance directe de l''ACPR
    et respectons l''ensemble des dispositions du Code des assurances.


    Conformément à notre cadre opérationnel, nous assurons un traitement équitable
    de tous les sociétaires. Nous rappelons que la protection des données personnelles
    est au cœur de nos processus, et que toute modification de contrat nécessite une
    authentification forte pour prévenir les risques de fraude.


    Concernant la sécurité financière, nous informons nos sociétaires que nous respectons
    les normes de protection en vigueur. Bien que la Complémentaire santé soit un
    contrat de prestation de soins, Égide Assurances, dans l''ensemble de ses activités
    de contrats de personnes, veille à la conformité avec la protection du FGAP jusqu''à
    70 000 € pour les produits concernés par ce dispositif, garantissant ainsi une
    sécurité maximale des fonds.


    Nous attirons votre attention sur le fait que le non-respect des obligations contractuelles,
    notamment le délai de déclaration des sinistres fixé à 5 jours ouvrés, peut impacter
    la validité des garanties et le montant des indemnités versées. Nous fournissons
    une éducation financière générale sur nos produits, mais nous ne délivrons aucun
    conseil fiscal, juridique ou médical personnalisé, renvoyant nos sociétaires vers
    des experts certifiés pour ces besoins spécifiques.'
  domain: insurance
  product_category: complementaire_sante
  document_type: disclosure
  source_authority: official
