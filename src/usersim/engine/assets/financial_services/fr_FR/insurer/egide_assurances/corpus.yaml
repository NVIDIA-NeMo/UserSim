- id: 0775cddd-88ed-5e01-b258-9b4fa9250e33
  title: Assurance habitation Égide — bonnes pratiques de sécurité du compte
  body: 'La protection de vos informations personnelles est une priorité absolue chez
    Égide Assurances. Pour garantir l''intégrité de votre contrat d''Assurance habitation
    Égide, nous vous demandons d''appliquer rigoureusement les pratiques de sécurité
    suivantes.


    Nous utilisons un système d''authentification forte pour protéger l''accès à vos
    données. Nous vous rappelons qu''une vérification rigoureuse de l''identité est
    systématiquement obligatoire avant toute action modifiant l''état de votre contrat,
    tout retrait ou tout transfert de fonds. C''est une mesure de sécurité essentielle
    pour prévenir l''usurpation d''identité.


    Soyez vigilants : Égide Assurances ne vous demandera jamais votre mot de passe,
    vos codes secrets ou vos informations bancaires complètes par email ou par SMS.
    Tout message vous pressant de fournir ces informations est une tentative de fraude.


    En cas de doute ou si vous constatez une activité inhabituelle sur votre compte,
    nous vous demandons de nous en informer sans délai. Par ailleurs, nous vous rappelons
    que le respect des délais légaux de déclaration est crucial pour la validité de
    vos garanties : tout sinistre doit nous être déclaré dans un délai maximum de
    5 jours ouvrés. Un retard de déclaration pourrait compromettre l''indemnisation
    de vos dommages.


    Nous vous conseillons de mettre à jour vos coordonnées de contact régulièrement
    afin que nous puissions vous alerter rapidement en cas d''anomalie détectée sur
    votre dossier.'
  domain: insurance
  product_category: assurance_habitation
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e2ae5b38-f58f-55c7-948f-7c2f26662c04
  title: Assurance habitation Égide — modification des conditions
  body: 'Le présent document détaille les modalités de modification des conditions
    générales et particulières de l''Assurance habitation Égide. En tant que société
    mutuelle, nous nous engageons à maintenir une transparence totale sur l''évolution
    de nos garanties.


    Nous nous réservons le droit de modifier les conditions du contrat pour répondre
    à des évolutions réglementaires (notamment celles imposées par l''ACPR) ou pour
    adapter nos couvertures aux risques émergents. Toute modification substantielle,
    telle qu''un changement du montant de la franchise standard, actuellement fixée
    à 150 €, vous sera notifiée par email ou via votre portail client avec un préavis
    minimum de 30 jours.


    Le sociétaire dispose de la possibilité d''accepter ces modifications ou de résilier
    son contrat sans frais si les nouvelles conditions lui sont défavorables, conformément
    au Code des assurances. Nous rappelons que la résiliation simplifiée est possible
    après un an de contrat.


    L''application des garanties reste strictement conditionnée au respect des obligations
    de l''assuré. Notamment, le délai de 5 jours ouvrés pour la déclaration des sinistres
    est une condition essentielle de validité du contrat. Tout manquement à cette
    obligation peut entraîner une réduction, voire une exclusion de l''indemnité d''assurance.


    L''équité entre tous les sociétaires étant le cœur de notre modèle, toute modification
    tarifaire globale est justifiée par la maintenance de notre infrastructure sécurisée
    et la gestion active des fonds de la mutuelle.'
  domain: insurance
  product_category: assurance_habitation
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c8b04f83-b4c7-5980-8bdd-1cc7865b744f
  title: Assurance habitation Égide — prise en main pas à pas
  body: 'Ce guide est destiné aux gestionnaires pour accompagner les nouveaux sociétaires
    dans l''activation de leur Assurance habitation Égide. L''objectif est de transformer
    la souscription en une expérience fluide et pédagogique.


    1. Collecte des informations : Le gestionnaire doit recueillir les caractéristiques
    du logement (surface, nombre de pièces, usage) et l''identité du sociétaire. À
    titre d''illustration, pour un profil type de locataire en deux pièces, la cotisation
    annuelle indicative s''élève à 168 €.


    2. Vérification de l''identité : Conformément à notre politique de sécurité, une
    vérification rigoureuse de l''identité est obligatoire avant la validation finale
    du contrat. Le gestionnaire doit s''assurer de la validité des pièces justificatives
    fournies.


    3. Explication des franchises : Le gestionnaire doit explicitement présenter les
    montants restant à la charge du sociétaire. Il convient de préciser la franchise
    standard de 150 € applicable aux sinistres courants, ainsi que la franchise spécifique
    de 380 € pour les catastrophes naturelles.


    4. Rappel des obligations : Il est impératif d''informer le client que tout sinistre
    doit être déclaré dans un délai de 5 jours ouvrés pour garantir la validité des
    garanties.


    5. Validation et confirmation : Une fois les informations validées, nous confirmons
    la mise en place des garanties. Le sociétaire reçoit alors son attestation d''assurance
    par email.


    Pour plus de détails sur les critères de souscription, vous pouvez consulter le
    document Assurance habitation Égide — conditions d''éligibilité.'
  domain: insurance
  product_category: assurance_habitation
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c7e881ae-f6ea-5953-b0e7-4ee4c07c53a2
  title: 'Assurance habitation Égide — franchise légale catastrophe naturelle : explications'
  body: 'L''Assurance habitation Égide s''accompagne de règles précises concernant
    les franchises. Voici les réponses aux questions les plus fréquentes sur les catastrophes
    naturelles.


    **Qu''est-ce que la franchise catastrophe naturelle ?**

    Il s''agit du montant qui reste à votre charge après l''indemnisation d''un sinistre
    reconnu comme catastrophe naturelle par l''État. Pour nos contrats, ce montant
    est fixé à 380 €.


    **Pourquoi ce montant est-il différent de la franchise habituelle ?**

    Contrairement à la franchise standard de 150 € applicable aux risques classiques
    (comme un dégât des eaux), la franchise catastrophe naturelle est une disposition
    légale et mutualisée, visant à garantir la pérennité du fonds de secours pour
    tous les sociétaires.


    **Comment est appliquée cette franchise ?**

    Le montant de 380 € est déduit de l''indemnité totale qui vous est versée après
    expertise des dommages. Nous vous rappelons que pour bénéficier de cette garantie,
    le sinistre doit être déclaré dans les 5 jours ouvrés.'
  domain: insurance
  product_category: assurance_habitation
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a644f7ee-e608-537f-a3e0-38f5179a6a6b
  title: Assurance habitation Égide — effectuer une modification
  body: 'Si vous souhaitez modifier les termes de votre Assurance habitation Égide
    (changement d''adresse, modification des garanties ou ajout d''un occupant), nous
    vous accompagnons via la procédure suivante :


    1. Indiquez-nous la nature exacte de la modification souhaitée et fournissez les
    nouveaux éléments (par exemple, le nouvel acte de propriété ou le nouveau bail).

    2. Nous procédons à une vérification rigoureuse de votre identité. Cette étape
    d''authentification forte est obligatoire avant toute modification de l''état
    de votre contrat.

    3. Nous analysons l''impact de votre demande sur vos garanties et votre cotisation.
    Si la modification entraîne un changement de tarif, nous vous communiquons le
    nouveau montant annuel.

    4. Nous validons la modification et vous envoyons l''avenant au contrat ainsi
    qu''une attestation mise à jour par email.


    Vous saurez que l''opération est réussie lorsque vous recevrez l''avenant signé
    numériquement et que vos nouvelles informations apparaîtront dans votre espace
    sociétaire. En cas de dossier complexe, nous escaladons votre demande vers un
    gestionnaire spécialisé.'
  domain: insurance
  product_category: assurance_habitation
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: be4b4c94-b75d-567d-83f6-fd7391bf1768
  title: Assurance habitation Égide — problèmes d'accès ou de connexion
  body: 'L''accès à vos documents et la gestion de votre Assurance habitation Égide
    s''effectuent principalement via notre portail numérique. Voici comment résoudre
    les problèmes de connexion les plus courants.


    **Symptôme : L''identifiant ou le mot de passe est refusé**

    *   **Causes probables :** Erreur de saisie, majuscules activées par erreur ou
    compte temporairement verrouillé après plusieurs tentatives infructueuses.

    *   **Actions à entreprendre :** Vérifiez la saisie de vos identifiants. Si le
    problème persiste, demandez-nous la réinitialisation de votre mot de passe.

    *   **Résolution :** Nous procéderons d''abord à une vérification rigoureuse de
    votre identité. Une fois authentifié, nous déclencherons l''envoi d''un lien de
    réinitialisation sécurisé sur votre email enregistré.


    **Symptôme : Le compte est indiqué comme « inactif » ou « bloqué »**

    *   **Causes probables :** Mesure de sécurité suite à une tentative de connexion
    suspecte ou mise à jour obligatoire des pièces d''identité.

    *   **Actions à entreprendre :** Transmettez-nous une copie à jour de votre pièce
    d''identité pour débloquer l''accès.

    *   **Résolution :** Après examen par nos services de sécurité, nous rétablirons
    vos accès dans un délai de 24 à 48 heures ouvrables.


    Si la situation n''est pas résolue après ces étapes, nous escaladons votre dossier
    vers notre équipe technique spécialisée. Vous recevrez une confirmation de l''ouverture
    d''un ticket d''incident par email.'
  domain: insurance
  product_category: assurance_habitation
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 2e6febe0-dee7-5ae9-9468-155a6a9694bc
  title: Assurance habitation Égide — niveaux d'accès
  body: 'Ce tableau définit les droits d''accès et les actions autorisées pour l''Assurance
    habitation Égide selon le profil de l''utilisateur. L''accès est conditionné par
    une authentification forte.


    | Profil | Consultation du Contrat | Modification des Garanties | Demande d''Indemnisation
    | Gestion Administrative |

    | :--- | :---: | :---: | :---: | :---: |

    | **Sociétaire Titulaire** | Oui | Oui | Oui | Oui |

    | **Co-assuré (Conjoint)** | Oui | Sur accord titre | Oui | Limitée |

    | **Mandataire / Proxy** | Oui | Non | Oui | Non |

    | **Gestionnaire Égide** | Oui | Oui | Oui | Oui |


    **Notes importantes :**

    - Toute modification demandée par un co-assuré ou un mandataire nécessite la validation
