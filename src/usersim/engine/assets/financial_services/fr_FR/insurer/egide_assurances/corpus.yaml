- id: d232bbc0-f072-5901-aae0-de52eb1169ae
  title: Contrat d'assurance-vie Égide Multisupport — confidentialité et protection
    des données
  body: 'Égide Assurances s''engage à traiter les données de ses sociétaires avec
    la plus grande transparence et l''éthique qui caractérisent notre modèle mutuel.
    La protection de vos données personnelles et le traitement équitable sont au cœur
    de notre cadre opérationnel.


    Nous opérons sous la surveillance rigoureuse de l''ACPR et respectons strictement
    les dispositions du Code des assurances ainsi que le Règlement Général sur la
    Protection des Données (RGPD). À ce titre, nous vous garantissons que vos informations
    ne sont utilisées que pour la gestion de votre Contrat d''assurance-vie Égide
    Multisupport et pour répondre à nos obligations légales de vigilance.


    Conformément à la réglementation, nous vous informons que vos contrats de personnes
    bénéficient de la protection du Fonds de Garantie des Assurances de Personnes
    (FGAP) jusqu''à un montant de 70 000 €. Cette garantie assure la protection de
    vos avoirs en cas de défaillance de l''assureur.


    Nous mettons en œuvre des mesures de sécurité techniques et organisationnelles
    avancées, incluant l''authentification forte, pour empêcher tout accès non autorisé
    à vos données. Vous disposez d''un droit d''accès, de rectification et de suppression
    de vos données, exerçable via votre portail client numérique ou par demande écrite.


    Nous vous rappelons que nous ne délivrons aucun conseil fiscal, juridique ou médical
    personnalisé. Pour toute question relative à l''optimisation fiscale de vos avoirs,
    nous vous renvoyons vers des experts certifiés. Pour plus d''informations réglementaires,
    veuillez vous référer au document Contrat d''assurance-vie Égide Multisupport
    — informations réglementaires.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 313e32e5-b7e6-5a2f-a793-9cb1cce42565
  title: Contrat d'assurance-vie Égide Multisupport — reconnaître les arnaques visant
    ce produit
  body: "La sécurité de vos avoirs est notre priorité absolue. Le Contrat d'assurance-vie\
    \ Égide Multisupport, en raison de sa flexibilité et de son attractivité, peut\
    \ être visé par des tentatives de fraude sophistiquées. Nous vous invitons à être\
    \ extrêmement vigilants face aux scénarios suivants :\n\n1. La promesse de rendements\
    \ garantis : Nous fournissons une éducation financière générale, mais nous ne\
    \ garantissons jamais de performance, particulièrement pour les unités de compte\
    \ dont la valeur varie selon les marchés. Tout interlocuteur prétendant garantir\
    \ un gain fixe et élevé au nom d'Égide Assurances usurpe notre identité.\n\n2.\
    \ L'urgence injustifiée : Méfiez-vous des appels ou emails vous pressant de transférer\
    \ vos fonds vers un « compte de sécurisation » ou un nouveau support pour éviter\
    \ une perte immédiate. Égide Assurances ne procède jamais à des transferts de\
    \ fonds urgents sans une procédure de vérification rigoureuse.\n\n3. La demande\
    \ de codes confidentiels : Nous ne vous demanderons jamais votre mot de passe,\
    \ vos codes d'accès au portail client ou vos clés d'authentification forte par\
    \ email ou téléphone. Ces informations sont strictement personnelles.\n\nSachez\
    \ qu'une authentification forte et une vérification rigoureuse de l'identité sont\
    \ obligatoires avant toute action modifiant l'état d'un contrat, tout retrait\
    \ ou tout transfert de fonds. Si vous constatez une anomalie ou si vous recevez\
    \ une sollicitation suspecte, contactez-nous immédiatement. \n\nPour plus de détails\
    \ sur nos protocoles de protection, nous vous suggérons de consulter le document\
    \ Contrat d'assurance-vie Égide Multisupport — protection contre la fraude et\
    \ les opérations non autorisées."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: security_advisory
  source_authority: official
  placeholder: true
