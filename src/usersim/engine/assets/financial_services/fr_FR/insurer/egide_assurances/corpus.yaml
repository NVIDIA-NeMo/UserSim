  title: Complémentaire santé Égide — grille des taux
  body: 'La grille des taux de la Complémentaire santé Égide est conçue pour offrir
    une transparence totale sur les coûts et les remboursements. Voici les valeurs
    de référence applicables :


    **Tarification indicative**

    - Cotisation mensuelle : 58 € (pour un profil adulte de 40 ans).


    **Taux et forfaits de remboursement**

    - Forfait Optique : 200 € tous les deux ans (hors panier 100 % Santé).

    - Forfait Journalier Hospitalier : 23 € par jour.


    **Facteurs de variation**

    Ces taux et cotisations sont fixes pour le profil de référence mais peuvent varier
    selon les critères suivants :

    - L''âge du sociétaire au moment de la souscription.

    - La composition du foyer (ajout de conjoints ou d''enfants).

    - Le choix d''options de garanties supplémentaires.


    Nous vous rappelons que notre modèle mutuel garantit que toute évolution tarifaire
    est justifiée par la maintenance de l''infrastructure sécurisée et l''équité entre
    tous les sociétaires.'
