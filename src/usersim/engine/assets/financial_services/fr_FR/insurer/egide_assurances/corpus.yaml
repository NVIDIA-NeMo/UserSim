- id: c5bc2126-9637-5ea1-84bb-b4519c15a39f
  title: 'Complémentaire santé Égide — cotisation mensuelle indicative pour un adulte
    de 40 ans : explications'
  body: "Question : Pourquoi le montant de la cotisation mensuelle indicative est-il\
    \ fixé à 58 € pour un adulte de 40 ans ?\n\nRéponse : Ce montant de 58 € est une\
    \ valeur de référence permettant à nos futurs sociétaires d'estimer le coût de\
    \ leur protection. Il correspond à un profil type d'adulte de 40 ans avec des\
    \ besoins de santé standards. \n\nChez Égide Assurances, nous privilégions la\
    \ transparence. Ce tarif reflète l'équilibre entre la qualité des garanties offertes\
    \ (comme l'accès au 100 % Santé) et la mutualisation des risques entre tous nos\
    \ sociétaires. Il est important de noter que ce montant est indicatif : votre\
    \ cotisation réelle sera ajustée en fonction de vos options choisies, de votre\
    \ situation familiale et de votre historique. \n\nNous vous rappelons que nos\
    \ frais sont justifiés par la gestion active de vos fonds et la maintenance d'une\
    \ infrastructure sécurisée, garantissant ainsi l'équité pour l'ensemble de notre\
    \ communauté de sociétaires."
