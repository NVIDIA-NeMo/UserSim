- id: 72d59448-29c6-52a2-825d-77d5c46faeab
  title: Complémentaire santé Égide — protection contre la fraude et les opérations
    non autorisées
  body: 'Chez Égide Assurances, la protection de nos sociétaires et l''intégrité de
    notre modèle coopératif sont nos priorités absolues. Dans le cadre de votre contrat
    Complémentaire santé Égide, nous appliquons une politique de tolérance zéro envers
    la fraude, qu''il s''agisse de fausses déclarations de soins ou de tentatives
    d''usurpation d''identité.


    Nous attirons votre attention sur des schémas de fraude fréquents : certains individus
    peuvent tenter de se faire passer pour un conseiller Égide en vous demandant vos
    codes d''accès au portail numérique ou vos coordonnées bancaires par email ou
    SMS pour « mettre à jour » vos remboursements. Soyez vigilants : nous ne vous
    demanderons jamais votre mot de passe ou vos secrets de sécurité par ces canaux.


    Pour garantir la sécurité de vos fonds et de vos données, une authentification
    forte et une vérification rigoureuse de l''identité sont obligatoires avant toute
    action modifiant l''état de votre contrat, tout retrait ou tout transfert de fonds.
    C''est cette rigueur qui nous permet d''assurer l''équité entre tous les sociétaires.


    Si vous constatez une anomalie sur vos remboursements ou si vous soupçonnez une
    utilisation frauduleuse de vos droits, nous vous invitons à nous le signaler immédiatement.
    Nous vous rappelons que les délais légaux de déclaration, notamment les 5 jours
    ouvrés pour les sinistres et incidents, sont strictement appliqués pour garantir
    la validité des garanties et le traitement efficace de votre dossier.


    En cas de doute sur la légitimité d''une communication, ne cliquez sur aucun lien
    et contactez-nous directement via nos canaux officiels durant les heures ouvrables
    (CET).'
  domain: insurance
  product_category: complementaire_sante
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: d3e814f1-5f2e-5f57-8eb8-9315c8ee15d9
  title: Complémentaire santé Égide — conditions générales
  body: 'Le présent document définit le cadre contractuel de la Complémentaire santé
    Égide. En tant que société d''assurance mutuelle, Égide Assurances lie ses sociétaires
    par des principes de transparence et d''éthique.


    1. Obligations du Sociétaire

    Le sociétaire s''engage à fournir des informations exactes et sincères lors de
    la souscription et tout au long de la vie du contrat. Toute modification de situation
    personnelle ou professionnelle doit nous être signalée sans délai. Le paiement
    des cotisations est une condition sine qua non du maintien des garanties.


    2. Obligations de l''Assureur

    Nous nous engageons à traiter chaque demande de remboursement avec impartialité
    et célérité, en respectant les tableaux de garanties souscrits. Nous opérons sous
    la surveillance de l''ACPR et respectons strictement le Code des assurances.


    3. Délais et Déclarations

    La validité des garanties est conditionnée au respect des délais légaux de déclaration.
    Notamment, tout sinistre ou incident doit être déclaré dans un délai maximum de
    5 jours ouvrés. Le non-respect de ce délai peut entraîner une réduction, voire
    une annulation de l''indemnisation.


    4. Modification et Fin du Contrat

    Le contrat peut être modifié par avenant après vérification rigoureuse de l''identité
    du demandeur. La résiliation est régie par les dispositions légales en vigueur
    et les conditions spécifiques au modèle mutuel. Les frais liés à la gestion active
    des fonds et à la maintenance de l''infrastructure sécurisée sont intégrés à la
    structure tarifaire pour garantir la pérennité du modèle.


    5. Litiges

    En cas de désaccord non résolu, le dossier peut être escaladé vers un gestionnaire
    spécialisé ou, en dernier recours, vers la Médiation de l''assurance.'
  domain: insurance
  product_category: complementaire_sante
