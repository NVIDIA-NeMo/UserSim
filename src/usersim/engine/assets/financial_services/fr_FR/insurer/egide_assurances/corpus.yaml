- id: f0c1d60e-8c32-593e-a8f2-2a416e3914d3
  title: Assurance auto Égide — face à un produit similaire de l'établissement
  body: 'Au sein de notre gamme, nous proposons différentes options de couverture
    pour l''Assurance auto Égide. Voici la comparaison entre la formule « Tous Risques
    » et la formule « Tiers » :


    - Formule Tous Risques : Elle offre une protection maximale, incluant les dommages
    accidentels et le vol. Elle comporte une franchise de 300 € et une cotisation
    indicative plus élevée (exemple : 640 €/an). Elle convient aux propriétaires de
    véhicules neufs ou de valeur importante.


    - Formule Tiers : Elle couvre uniquement la responsabilité civile (obligatoire).
    Elle ne prévoit pas de prise en charge des dommages propres au véhicule en cas
    de responsabilité du conducteur. La cotisation est nettement inférieure. Elle
    est idéale pour les véhicules anciens ou à faible valeur vénale.


    Le point commun reste notre système de bonus, avec un plafond maximal de 50 %
    applicable aux deux formules pour récompenser la prudence. Le choix dépend donc
    principalement de la valeur de votre véhicule et de votre appétence au risque.'
  domain: insurance
  product_category: assurance_auto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 32e9c3e2-20ee-51a9-9f6e-ed4b26ad0197
  title: Assurance auto Égide — informations réglementaires
  body: "L'Assurance auto Égide est distribuée et gérée dans le strict respect du\
    \ Code des assurances et sous la surveillance opérationnelle de l'Autorité de\
    \ Contrôle Prudentiel et de Résolution (ACPR). \n\nEn tant que société d'assurance\
    \ mutuelle, nous appliquons un modèle coopératif. La protection des données personnelles\
    \ de nos sociétaires est assurée conformément au RGPD, et nous nous engageons\
    \ à un traitement équitable de chaque dossier.\n\nNous attirons votre attention\
    \ sur l'importance capitale du respect des délais de déclaration. Conformément\
    \ à nos conditions générales et aux usages du secteur, tout sinistre doit être\
    \ déclaré dans un délai maximum de 5 jours ouvrés. Le non-respect de ce délai\
    \ peut entraîner une réduction, voire une déchéance de la garantie, selon la gravité\
    \ du retard et les circonstances du sinistre.\n\nLa sécurité des opérations est\
    \ au cœur de notre cadre opérationnel. Par conséquent, une authentification forte\
    \ ainsi qu'une vérification rigoureuse de l'identité sont obligatoires avant toute\
    \ action modifiant l'état d'un contrat, tout retrait ou tout transfert de fonds.\
    \ \n\nEnfin, nous rappelons que nous fournissons des informations sur nos produits\
    \ et une éducation financière générale. Nous ne délivrons aucun conseil fiscal,\
    \ juridique ou médical personnalisé. Pour tout besoin spécifique dans ces domaines,\
    \ nous vous invitons à consulter des experts certifiés. Nos tarifs, incluant une\
    \ cotisation indicative de 640 € et une franchise de 300 € pour la formule complète,\
    \ sont conçus pour garantir la pérennité du modèle mutuel."
  domain: insurance
