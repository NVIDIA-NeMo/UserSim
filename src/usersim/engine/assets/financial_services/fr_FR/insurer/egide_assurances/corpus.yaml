- id: d427abbc-a3fd-51d2-8a08-724dc3666319
  title: Assurance habitation Égide — consulter le suivi ou l'historique
  body: 'Pour assurer une transparence totale, nous permettons à chaque sociétaire
    de suivre l''état de ses contrats et l''historique de ses interactions. Voici
    la démarche pour consulter vos informations.


    Ce que vous devez avoir avant de commencer :

    - Vos identifiants de connexion sécurisés.

    - Le numéro de votre contrat d''Assurance habitation Égide.


    Étapes de consultation :


    1. Demandez l''accès à l''historique de vos contrats. Nous vous demanderons alors
    de passer par l''étape d''authentification forte pour garantir la confidentialité
    de vos données.

    2. Une fois identifié, précisez si vous souhaitez consulter l''historique des
    cotisations (paiements effectués) ou le suivi des sinistres déclarés.

    3. Nous vous confirmons alors l''affichage de la liste chronologique de vos événements.
    Pour chaque sinistre, vous pourrez voir la date de déclaration, le montant de
    la franchise appliquée (par exemple 150 € ou 380 € selon la nature du risque)
    et l''état d''avancement du dossier (en cours d''expertise, validé, indemnisé).

    4. Si vous souhaitez obtenir un détail précis sur un virement d''indemnisation,
    demandez-nous le justificatif de règlement correspondant à la référence du dossier.


    Vous saurez que l''opération est réussie lorsque vous aurez reçu la confirmation
    visuelle ou le document PDF récapitulatif de vos opérations sur votre espace personnel.


    En cas de besoin de modifications sur vos contrats, vous pouvez consulter le document
    Assurance habitation Égide — effectuer une modification.'
  domain: insurance
  product_category: assurance_habitation
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 45c6ff28-9367-5aa2-b369-df0c858c116e
  title: Assurance habitation Égide — opération refusée ou bloquée
  body: 'Il peut arriver que vous rencontriez un blocage lors d''une tentative de
    modification de contrat ou d''une demande de retrait de fonds. Voici comment identifier
    la cause et résoudre la situation.


    Symptôme : Un message d''erreur s''affiche indiquant que « l''opération ne peut
    être finalisée » ou que « des vérifications supplémentaires sont requises ».


    Causes probables :

    L''Assurance habitation Égide est soumise à des normes de sécurité strictes. Le
    blocage survient généralement pour l''une des raisons suivantes :

    - L''authentification forte a échoué ou a expiré.

    - L''identité du demandeur n''a pas été rigoureusement vérifiée pour une action
    sensible (comme un changement de bénéficiaire ou un transfert de fonds).

    - Des informations obligatoires sont manquantes dans le dossier pour valider la
    modification.


    Procédure de résolution :

    1. Vérifiez que vous utilisez vos identifiants à jour et que votre appareil est
    compatible avec notre système de vérification d''identité.

    2. Si le blocage persiste, demandez-nous de vérifier l''état de votre authentification.
    Nous procéderons à une nouvelle vérification d''identité rigoureuse.

    3. Si l''opération concerne un changement contractuel, transmettez-nous les justificatifs
    demandés (ex: nouveau titre de propriété ou bail). Nous confirmerons la réception
    et la conformité des pièces.


    Quand escalader l''incident :

    Si malgré la vérification d''identité l''opération reste bloquée, nous escaladerons
    votre dossier vers un gestionnaire spécialisé. Vous recevrez une notification
    de prise en charge sous 48 heures ouvrables. Le gestionnaire analysera le blocage
    technique ou administratif et vous contactera pour finaliser l''opération manuellement.'
  domain: insurance
  product_category: assurance_habitation
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: efeecf63-40fb-5f9f-8d61-cfa4fe327bf3
  title: Assurance habitation Égide — quand changer ou monter en gamme
  body: "Ce guide aide les gestionnaires à conseiller les sociétaires sur l'évolution\
    \ de leur couverture Assurance habitation Égide.\n\nUn passage vers une gamme\
    \ supérieure est recommandé dans les cas suivants :\n- Augmentation significative\
    \ de la valeur des biens mobiliers : si le sociétaire acquiert des objets de valeur\
    \ dépassant les plafonds standards, une montée en gamme est nécessaire pour éviter\
    \ une sous-assurance.\n- Modification de l'usage du logement : le passage d'une\
    \ résidence principale à une location saisonnière modifie l'exposition au risque\
    \ et nécessite des garanties plus étendues.\n- Souhait de réduire la franchise\
    \ : bien que notre franchise standard soit de 150 €, certaines formules supérieures\
    \ permettent de limiter le reste à charge en cas de sinistre fréquent.\n\nLe maintien\
    \ de la gamme actuelle est préférable pour les sociétaires ayant un budget optimisé\
    \ et des besoins de couverture basiques, où la cotisation annuelle indicative\
    \ de 168 € représente le meilleur équilibre entre coût et protection. \n\nLe conseiller\
    \ doit toujours s'assurer que le sociétaire comprend l'impact d'un changement\
    \ de gamme sur sa prime annuelle tout en rappelant que la franchise catastrophe\
    \ naturelle reste fixée à 380 € quel que soit le niveau de gamme, conformément\
    \ aux règles légales."
  domain: insurance
  product_category: assurance_habitation
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 1876f0d1-53fd-55d9-9faf-9fe3270f773f
  title: Assurance habitation Égide — comparaison avec les alternatives et quand ne
    pas le choisir
  body: 'L''Assurance habitation Égide s''inscrit dans un modèle mutuel et coopératif,
    privilégiant l''éthique et la transparence. Pour vous aider dans votre choix,
    voici comment notre solution se positionne face aux alternatives du marché.


    Points forts de notre approche :

    Notre modèle de société mutuelle fait de vous un sociétaire et non un simple client.
    Cela se traduit par une gestion transparente des frais et une volonté de pérennité
    plutôt que de profit immédiat. À titre d''exemple, nous proposons une cotisation
    annuelle indicative de 168 € pour un profil type, offrant un accès équitable à
    une protection complète.


    Comparaison structurelle :

    Contrairement à certains assureurs traditionnels dont les frais peuvent être opaques,
    Égide Assurances justifie chaque coût par la maintenance d''une infrastructure
    sécurisée et une gestion active. Nous appliquons une franchise standard de 150
    €, ce qui est compétitif pour le niveau de service et de réassurance fourni.


    Quand ne pas choisir l''Assurance habitation Égide :

    Bien que notre solution soit agile et complète, elle peut ne pas être la plus
    adaptée dans les situations suivantes :

    - Besoins de couvertures ultra-spécifiques : Pour des domaines d''exception ou
    des propriétés avec des risques industriels intégrés, des contrats sur-mesure
    (souvent beaucoup plus onéreurs) auprès de courtiers spécialisés peuvent être
    préférables.

    - Recherche d''une absence totale de franchise : Si vous recherchez un contrat
    « zéro franchise », sachez que notre structure mutuelle impose une franchise de
    150 € (standard) et de 380 € (catastrophe naturelle) pour garantir l''équité entre
    tous les sociétaires et la viabilité du fonds commun.


    En résumé, notre produit est idéal pour les familles et particuliers recherchant
    un partenaire de confiance, une gestion pédagogique et une tarification juste,
    tout en acceptant les règles de mutualisation des risques.'
  domain: insurance
  product_category: assurance_habitation
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 4534bf51-05cb-5430-954a-6e2b35203ede
  title: Assurance habitation Égide — coûts et frais
  body: "Question : Quel est le coût annuel de l'Assurance habitation Égide et quels\
    \ sont les frais en cas de sinistre ?\n\nRéponse : À titre indicatif, la cotisation\
    \ annuelle pour un profil standard est de 168 €. Ce montant assure la maintenance\
    \ de vos garanties et le fonctionnement de notre modèle mutuel.\n\nEn cas de sinistre,\
    \ des frais appelés « franchises » restent à votre charge : \n- Une franchise\
    \ standard de 150 € s'applique pour la majorité des événements.\n- Une franchise\
    \ de 380 € est appliquée spécifiquement pour les catastrophes naturelles.\n\n\
    Ces montants sont transparents et permettent de garantir l'équité et la pérennité\
    \ du modèle coopératif pour l'ensemble de nos sociétaires."
  domain: insurance
  product_category: assurance_habitation
