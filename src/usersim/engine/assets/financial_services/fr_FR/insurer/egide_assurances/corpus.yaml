- id: d2faa46b-e95b-575d-80ab-94320e3b28d2
  title: 'Assurance habitation Égide — délai de déclaration de sinistre (jours ouvrés)
    : explications'
  body: "Question : De combien de temps disposé-je pour déclarer un sinistre habitation\
    \ et pourquoi ce délai est-il si strict ?\n\nRéponse : Pour que vos garanties\
    \ soient pleinement valides, nous appliquons un délai de déclaration de 5 jours\
    \ ouvrés suivant la survenue du sinistre. \n\nCe délai est essentiel pour nous\
    \ permettre d'intervenir rapidement, de limiter l'aggravation des dommages et\
    \ de procéder, si nécessaire, à l'expertise des biens dans les meilleures conditions.\
    \ Un respect rigoureux de ce délai de 5 jours ouvrés garantit l'impartialité et\
    \ la rapidité du traitement de votre dossier. Nous vous encourageons à nous contacter\
    \ dès la constatation du dommage via votre portail client ou par téléphone."
  domain: insurance
