- id: 48ca3254-7595-52a7-86b8-f684388ff784
  title: Assurance habitation Égide — protection contre la fraude et les opérations
    non autorisées
  body: 'Chez Égide Assurances, nous attachons une importance primordiale à la sécurité
    de vos contrats et à l''intégrité de notre modèle mutuel. La fraude impacte l''ensemble
    de nos sociétaires en fragilisant l''équité des cotisations ; c''est pourquoi
    nous appliquons une politique de tolérance zéro à cet égard.


    Pour protéger vos intérêts et éviter les opérations non autorisées, nous imposons
    une authentification forte et une vérification rigoureuse de l''identité avant
    toute modification de contrat, tout changement de coordonnées bancaires ou toute
    demande de remboursement. Nous vous rappelons que nous ne vous demanderons jamais
    vos codes secrets ou vos mots de passe par email ou par téléphone.


    Un point de vigilance essentiel concerne la déclaration des sinistres. Pour garantir
    la validité de vos garanties et permettre une instruction impartiale du dossier,
    les délais légaux de déclaration doivent être strictement respectés. Notamment,
    tout sinistre doit nous être déclaré dans un délai maximal de 5 jours ouvrés.
    Le non-respect de ce délai peut entraîner une réduction, voire une déchéance de
    l''indemnisation, conformément au Code des assurances.


    Si vous constatez une activité suspecte sur votre portail client ou si vous recevez
    une communication vous semblant inhabituelle au nom d''Égide Assurances, nous
    vous invitons à nous le signaler immédiatement. En agissant rapidement, vous protégez
    non seulement votre patrimoine, mais également la pérennité de notre société mutuelle.


    Nous opérons sous la surveillance de l''ACPR, ce qui garantit que nos processus
    de contrôle et de lutte contre la fraude répondent aux normes les plus strictes
    du marché français.'
  domain: insurance
  product_category: assurance_habitation
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e03e6806-c721-51ea-9e90-1e64527b0ce2
  title: Assurance habitation Égide — conditions générales
  body: 'Les présentes conditions générales régissent l''adhésion et la gestion du
    contrat Assurance habitation Égide. En tant que société mutuelle, nous considérons
    chaque assuré comme un sociétaire, participant ainsi à une gouvernance basée sur
    la transparence et l''éthique.


    Obligations du Sociétaire :

    Le sociétaire s''engage à fournir des informations exactes sur le risque assuré
    et à nous informer de tout changement significatif affectant le domicile. La déclaration
    de tout sinistre doit impérativement être effectuée dans un délai de 5 jours ouvrés
    suivant la survenance de l''événement pour que la garantie puisse être activée.


    Structure des Franchises :

    L''indemnisation d''un sinistre est soumise à l''application d''une franchise,
    montant restant à la charge du sociétaire :

    - Pour les sinistres standards, une franchise de 150 € est appliquée.

    - En cas de catastrophe naturelle, la franchise légale s''élève à 380 €.


    Engagement et Résiliation :

    Le contrat est conclu pour une durée annuelle. Conformément à notre volonté de
    flexibilité, la résiliation est simplifiée après la première année de souscription.
    Le sociétaire peut mettre fin à son contrat moyennant le respect du préavis légal.


    Modalités Financières :

    Les cotisations sont calculées pour garantir l''équité entre tous les sociétaires.
    À titre d''exemple, une cotisation annuelle peut s''élever à 168 €, montant justifié
    par la maintenance de notre infrastructure sécurisée et la gestion active des
    fonds de garantie.


    Litiges :

    En cas de désaccord, nous traitons chaque réclamation avec impartialité. Si aucune
    solution n''est trouvée via notre gestion interne, le dossier peut être escaladé
    vers la Médiation de l''assurance, conformément au cadre réglementaire en vigueur.'
  domain: insurance
  product_category: assurance_habitation
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 6690cc43-1035-51c6-bd88-d55076570f3a
  title: Assurance habitation Égide — pour qui et pour quels usages
  body: "L'Assurance habitation Égide est une solution de protection résidentielle\
    \ complète, conçue spécifiquement pour les particuliers et les familles qui recherchent\
    \ un partenaire de confiance plutôt qu'un simple prestataire de services. \n\n\
    Ce produit s'adresse aux personnes souhaitant sécuriser leur foyer tout en adhérant\
    \ à un modèle coopératif. En devenant sociétaire, vous ne vous contentez pas de\
    \ souscrire une assurance : vous intégrez une mutuelle privilégiant l'éthique\
    \ et la transparence.\n\nPoints forts et usages :\n- Protection agile : Une couverture\
    \ adaptée aux besoins réels des foyers, avec une résiliation simplifiée après\
    \ un an d'engagement.\n- Transparence tarifaire : Nos frais sont justifiés et\
    \ équitables. À titre indicatif, un exemple de cotisation annuelle s'élève à 168\
    \ €.\n- Gestion rigoureuse : Un accompagnement pédagogique pour vous aider à comprendre\
    \ vos garanties et vos obligations.\n\nCe que vous devez savoir sur les frais\
    \ à charge :\nPour maintenir des cotisations accessibles, le contrat prévoit des\
    \ franchises en cas de sinistre :\n- Une franchise standard de 150 € pour la majorité\
    \ des incidents.\n- Une franchise spécifique de 380 € pour les événements classés\
    \ comme catastrophes naturelles.\n\nNous vous accompagnons dans la gestion de\
    \ vos contrats via notre portail numérique, par email ou par téléphone, afin que\
    \ vous puissiez piloter votre protection résidentielle en toute sérénité."
  domain: insurance
  product_category: assurance_habitation
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 5b3bab4f-60d5-5f3a-9d3e-0961381ca3ad
  title: 'Assurance habitation Égide — franchise générale : explications'
  body: "Qu'est-ce que la franchise générale dans mon contrat Assurance habitation\
    \ Égide ?\n\nLa franchise est le montant qui reste à votre charge après l'indemnisation\
    \ d'un sinistre par nos services. Pour l'Assurance habitation Égide, la franchise\
    \ standard est fixée à 150 €. \n\nComment s'applique-t-elle concrètement ?\nSi\
    \ vous déclarez un sinistre dont le montant des dommages est évalué à 1 000 €,\
    \ nous vous verserons une indemnité de 850 €, les 150 € de franchise restant à\
    \ votre charge. Ce mécanisme nous permet de limiter les coûts de gestion et de\
    \ garantir ainsi des cotisations annuelles plus justes et transparentes pour l'ensemble\
    \ de nos sociétaires. \n\nS'applique-t-elle à tous les types de sinistres ?\n\
    La franchise de 150 € concerne les sinistres classiques. Pour les événements particuliers,\
    \ comme les catastrophes naturelles, un montant différent s'applique. Nous vous\
    \ invitons à consulter le document Assurance habitation Égide — conditions générales\
    \ pour plus de détails."
  domain: insurance
  product_category: assurance_habitation
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 7458fcad-ad44-5c89-adb7-6ac4589993df
  title: Assurance habitation Égide — résilier, clôturer ou changer de formule
  body: "Nous accompagnons nos sociétaires dans l'évolution de leurs besoins. Voici\
    \ la marche à suivre pour modifier ou mettre fin à votre contrat Assurance habitation\
    \ Égide.\n\nCe qu'il faut savoir avant de commencer :\nLa résiliation est simplifiée\
    \ après la première année de souscription. Avant ce délai, des conditions spécifiques\
    \ peuvent s'appliquer selon votre situation.\n\nPour résilier ou clôturer votre\
    \ contrat :\n1. Indiquez-nous votre volonté de résilier et la date de fin souhaitée.\
    \ \n2. Nous vérifions votre identité via notre processus d'authentification forte\
    \ pour sécuriser l'opération.\n3. Nous vous confirmons la date effective de fin\
    \ de contrat et le solde éventuel de vos cotisations.\n4. Vous recevez l'attestation\
    \ de résiliation par email ou via votre portail client.\n\nPour changer de formule\
    \ (ajustement des garanties) :\n1. Précisez-nous les nouveaux éléments de votre\
    \ foyer ou les risques supplémentaires que vous souhaitez couvrir.\n2. Nous analysons\
    \ l'impact sur votre cotisation (par exemple, si celle-ci s'écarte de l'exemple\
    \ type de 168 € par an).\n3. Nous vous soumettons un avenant au contrat détaillant\
    \ les nouvelles conditions.\n4. Après votre validation et la signature électronique,\
    \ nous confirmons la mise à jour immédiate de vos garanties.\n\nChaque demande\
    \ est traitée avec transparence. Si vous avez un doute sur le moment opportun\
    \ pour changer de formule, nous restons disponibles pour vous fournir une éducation\
    \ financière générale sur la gestion de vos risques résidentiels."
  domain: insurance
  product_category: assurance_habitation
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c0d46ff6-a570-54b6-a917-af0c5f3d922b
  title: Assurance habitation Égide — frais ou montant inattendu
  body: 'Symptôme : Le sociétaire signale un prélèvement supérieur au montant habituel
    ou s''étonne d''un reste à charge après un sinistre.


    Causes probables :

    1. Ajustement annuel de la cotisation : Le montant peut varier selon l''évolution
    du risque ou des frais d''infrastructure (rappel : notre exemple de cotisation
    est de 168 €).

    2. Application d''une franchise : Le sociétaire a confondu l''indemnisation totale
    avec le montant versé.

    3. Retard de déclaration : Un sinistre déclaré au-delà des 5 jours ouvrés a pu
    entraîner une réduction de l''indemnité.


    Procédure de vérification pour l''agent :

    1. Vérifier le montant exact du prélèvement et le comparer à l''historique du
    contrat.

    2. En cas de sinistre récent, identifier le type d''événement : s''agissait-il
    d''un sinistre standard (franchise de 150 €) ou d''une catastrophe naturelle (franchise
    de 380 €) ?

    3. Vérifier la date de déclaration du sinistre par rapport à la date de survenance
    pour confirmer le respect du délai de 5 jours ouvrés.


    Résolution :

    - Si le montant est justifié par la franchise ou le délai, expliquer pédagogiquement
    le fonctionnement du contrat en s''appuyant sur les conditions générales.

    - Si une erreur de facturation est avérée, nous procédons à une correction immédiate
    du montant.


    Escalade :

    Si le sociétaire conteste l''impartialité du traitement ou si le dossier présente
    une complexité juridique majeure, nous escaladons le dossier vers un gestionnaire
    spécialisé. En dernier recours, nous orientons le sociétaire vers la Médiation
    de l''assurance.'
  domain: insurance
  product_category: assurance_habitation
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: b959bf86-9503-5d17-8f26-d3b7fe742181
  title: Assurance habitation Égide — justificatifs à fournir
  body: 'Pour souscrire à l''Assurance habitation Égide et devenir sociétaire, nous
    devons vérifier rigoureusement votre identité et la nature du risque. Voici les
    pièces justificatives requises selon votre situation :


    | Situation du demandeur | Justificatifs obligatoires | Résultat attendu |

    | :--- | :--- | :--- |

    | Propriétaire occupant | Pièce d''identité valide + Titre de propriété ou acte
    de vente | Ouverture du contrat |

    | Locataire | Pièce d''identité valide + Bail de location signé | Ouverture du
    contrat |

    | Colocation | Pièces d''identité de chaque occupant + Bail mentionnant tous les
    noms | Ouverture du contrat |

    | Copropriété | Pièce d''identité + Attestation d''assurance de l''immeuble (syndic)
    | Validation des garanties |


    L''absence de l''un de ces documents suspend l''activation des garanties. Une
    fois les justificatifs reçus et validés, nous confirmons le montant de votre cotisation
    annuelle (par exemple 168 € selon votre profil) et l''application des franchises
    (150 € standard / 380 € catastrophe naturelle).'
  domain: insurance
  product_category: assurance_habitation
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
