- id: 6360b683-79b2-58e8-b54d-2aa393499463
  title: Contrat d'assurance-vie Égide Multisupport — face à une offre concurrente
    type
  body: 'Lorsqu''on compare notre offre à celle d''une banque commerciale classique,
    la différence majeure réside dans notre modèle de société mutuelle. Chez Égide
    Assurances, vous n''êtes pas un client, mais un sociétaire.


    **Points de comparaison :**

    - **Philosophie :** Là où une banque recherche le profit pour ses actionnaires,
    nous privilégions la transparence et l''équité entre nos membres. Nos frais, comme
    les frais sur versements de 1 %, sont justifiés par la maintenance d''une infrastructure
    sécurisée et non par une marge commerciale.

    - **Rendement :** Notre fonds en euros propose un taux de 2,6 %, offrant une sécurité
    robuste pour votre épargne.

    - **Coût de gestion :** Nous maintenons des frais de gestion compétitifs (0,6
    % sur le fonds en euros et 0,85 % sur les unités de compte) pour garantir la pérennité
    du modèle mutualiste.


    **Lequel choisir ?**

    L''offre concurrente peut être adaptée à ceux qui souhaitent centraliser tous
    leurs produits financiers dans un seul établissement bancaire. Le Contrat d''assurance-vie
    Égide Multisupport est le choix privilégié pour les familles et particuliers recherchant
    un partenaire de confiance, une gestion éthique et un modèle coopératif protecteur.


    Pour plus de précisions sur nos frais, consultez la « Contrat d''assurance-vie
    Égide Multisupport — grille tarifaire ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 2ca4a43f-cfbc-5132-bf1a-4852e739b20b
  title: Contrat d'assurance-vie Égide Multisupport — informations sur les risques
  body: 'Le Contrat d''assurance-vie Égide Multisupport permet d''investir sur deux
    types de supports, présentant des profils de risque distincts. Il est essentiel
    de comprendre ces mécanismes avant toute décision d''investissement.


    **Le Fonds en Euros :**

    Ce support est conçu pour la sécurité. Il offre un taux de 2,6 %. Le capital y
    est protégé, ce qui signifie que vous ne pouvez pas perdre le montant investi.
    C''est la solution adaptée pour une épargne de précaution ou un horizon de placement
    court terme.


    **Les Unités de Compte (UC) :**

    Les UC sont des supports d''investissement dont la valeur varie selon les marchés
    financiers. Contrairement au fonds en euros, les UC exposent le sociétaire à un
    risque de perte en capital. La valeur de votre investissement peut baisser, et
    vous pourriez récupérer une somme inférieure à celle versée. Nous ne garantissons
    aucune performance future sur ces supports. Les frais de gestion pour les UC sont
    de 0,85 %.


    **Cadre Réglementaire et Protection :**

    Nous opérons sous la surveillance de l''ACPR et respectons strictement le Code
    des assurances. En cas de défaillance de l''assureur, les contrats de personnes
    bénéficient de la protection du FGAP jusqu''à 70 000 €.


    **Conseils et Limites :**

    Nous fournissons une éducation financière générale et des informations sur nos
    produits, mais nous ne délivrons aucun conseil fiscal, juridique ou médical personnalisé.
    Nous vous recommandons de consulter des experts certifiés pour vos besoins spécifiques
    en matière de fiscalité ou de droit successoral. Pour comprendre la gestion quotidienne
    de vos fonds, vous pouvez consulter « Contrat d''assurance-vie Égide Multisupport
    — calcul et application des taux ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 49faeffb-250d-5a13-9894-50dd5ed28e8d
  title: Contrat d'assurance-vie Égide Multisupport — calcul et application des taux
  body: 'Ce document précise les modalités d''application des taux et des frais pour
    le Contrat d''assurance-vie Égide Multisupport, à destination des agents de support.


    **Rémunération du fonds en euros :**

    Le taux servi est de 2,6 %. Ce taux est appliqué annuellement sur le capital net
    investi dans le fonds en euros. Il est crédité sur le contrat selon les modalités
    de gestion de la mutuelle.


    **Application des frais de gestion :**

    Les frais de gestion sont prélevés annuellement et viennent réduire la performance
    brute des supports :

    - **Fonds en euros :** Un prélèvement de 0,6 % est appliqué. Ce montant est justifié
    par la gestion active des fonds et la sécurité du support.

    - **Unités de compte :** Un prélèvement de 0,85 % est appliqué. Ce taux couvre
    la gestion des actifs financiers sous-jacents.


    **Frais sur versements :**

    Lors de chaque apport (initial ou complémentaire), un prélèvement forfaitaire
    de 1 % est effectué avant l''investissement des fonds. Par exemple, pour un versement
    de 1 000 €, le montant investi est de 990 €.


    Il n''existe pas de paliers de taux basés sur le solde ; ces taux et frais s''appliquent
    uniformément à tous les sociétaires pour garantir l''équité du modèle mutuel.
    Pour toute question sur les montants prélevés, référez-vous à « Contrat d''assurance-vie
    Égide Multisupport — frais ou montant inattendu ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 7fefa49c-8ad9-5ac2-8aa1-832ad3f5e54c
  title: Contrat d'assurance-vie Égide Multisupport — offre de parrainage et de fidélité
  body: 'Nous avons le plaisir de récompenser la confiance que vous témoignez à notre
    modèle coopératif. Dans le cadre de notre programme de fidélité, nous proposons
    une offre de parrainage exclusive valable du 1er novembre 2024 au 31 décembre
    2024.


    Pour chaque nouveau sociétaire que vous parrainez et qui souscrit un Contrat d''assurance-vie
    Égide Multisupport avec un versement initial minimum de 500 €, nous créditons
    votre compte d''une prime de fidélité de 50 €. Le filleul parrainé bénéficie également
    d''une réduction exceptionnelle sur les frais d''entrée, ramenant ceux-ci à 0
    % pour son premier versement (au lieu de 1 %).


    Cette initiative vise à renforcer notre communauté de sociétaires tout en facilitant
    l''accès à une épargne flexible. Nous vous invitons à consulter les modalités
    complètes via votre espace client pour profiter de cet avantage avant la date
    d''échéance.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 64ba9564-ee5e-5d8a-bbc2-64d363cb7202
  title: Contrat d'assurance-vie Égide Multisupport — bonnes pratiques de sécurité
    du compte
  body: 'La protection de votre épargne est notre priorité absolue. Au sein d''Égide
    Assurances, nous appliquons des protocoles de sécurité rigoureux pour garantir
    l''intégrité de vos avoirs sur le Contrat d''assurance-vie Égide Multisupport.


    Nous vous rappelons qu''une authentification forte est obligatoire pour toute
    opération sensible. Conformément à notre politique de sécurité, une vérification
    rigoureuse de l''identité est systématiquement effectuée avant toute action modifiant
    l''état de votre contrat, tout retrait ou tout transfert de fonds. Nous ne vous
    demanderons jamais vos codes secrets ou vos mots de passe par email ou par téléphone.


    Voici les bonnes pratiques à adopter pour sécuriser votre accès :


    1. Vigilance face au phishing : Méfiez-vous des messages urgents vous demandant
    de cliquer sur un lien pour « débloquer » vos fonds ou « mettre à jour » vos informations
    personnelles. Nous communiquons les informations officielles via votre portail
    client sécurisé.

    2. Gestion des accès : Ne partagez jamais vos identifiants de connexion. Si vous
    constatez une tentative de connexion inhabituelle, signalez-le nous immédiatement.

    3. Vérification des demandes : Toute demande de rachat ou de transfert fera l''objet
    d''une confirmation via un canal sécurisé pour éviter toute usurpation d''identité.


    En cas de doute sur la légitimité d''une communication ou si vous soupçonnez une
    activité frauduleuse, nous vous demandons de nous contacter sans délai. La réactivité
    est essentielle pour limiter les risques. Nous traitons chaque signalement avec
    la plus grande impartialité et rigueur pour protéger vos droits de sociétaire.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ed8a0433-92b4-501d-b08e-9607425ca106
  title: Contrat d'assurance-vie Égide Multisupport — modification des conditions
  body: 'Le Contrat d''assurance-vie Égide Multisupport est régi par des conditions
    générales garantissant l''équité entre tous nos sociétaires. Nous nous réservons
    la possibilité de modifier ces conditions pour nous adapter aux évolutions réglementaires
    de l''ACPR ou pour optimiser la gestion de notre modèle mutuel.


    Toute modification touchant aux frais — tels que les frais d''entrée de 1 %, les
    frais de gestion du fonds en euros de 0,6 % ou les frais de gestion des unités
    de compte de 0,85 % — fera l''objet d''une notification préalable. Nous nous engageons
    à vous informer de tout changement significatif avec un préavis minimal de deux
    mois via votre portail client ou par email.


    Le sociétaire dispose alors de la faculté d''accepter ces nouvelles conditions
    ou de demander le rachat total ou partiel de son contrat sans pénalités supplémentaires,
    conformément au Code des assurances. Si aucune objection n''est formulée dans
    le délai de préavis, les nouvelles conditions sont réputées acceptées.


    L''équilibre du contrat repose sur la transparence de notre structure tarifaire,
    laquelle justifie la maintenance d''une infrastructure sécurisée et la gestion
    active des fonds. Nous veillons à ce que toute modification ne compromette pas
    la pérennité du modèle mutualiste ni la protection des intérêts des sociétaires.
    Pour toute question relative à l''application de ces termes, nous vous invitons
    à consulter le document Contrat d''assurance-vie Égide Multisupport — conditions
    générales.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: f9c8a03b-196a-5983-bfa4-3964fee84086
  title: Contrat d'assurance-vie Égide Multisupport — prise en main pas à pas
  body: 'Ce guide est destiné aux gestionnaires pour accompagner les sociétaires dans
    l''activation de leur Contrat d''assurance-vie Égide Multisupport. L''objectif
    est de garantir une entrée en relation fluide et conforme à nos exigences de sécurité.


    Étape 1 : Vérification de l''identité

    Avant toute action, nous procédons à une vérification rigoureuse de l''identité
    du futur sociétaire. Assurez-vous que les documents fournis sont valides et conformes
    aux exigences légales.


    Étape 2 : Versement initial

    Le sociétaire doit effectuer un versement initial minimum de 500 € pour l''ouverture
    du contrat. Informez le client que ce montant est soumis à des frais d''entrée
    de 1 %, déduits lors de l''investissement.


    Étape 3 : Choix de l''allocation

    Le sociétaire doit définir la répartition de son épargne entre :

    - Le fonds en euros : privilégiant la sécurité avec un taux de 2,6 % et des frais
    de gestion annuels de 0,6 %.

    - Les unités de compte : offrant un potentiel de croissance plus élevé, avec des
    frais de gestion de 0,85 %, mais exposant le capital à un risque de perte.


    Étape 4 : Validation et confirmation

    Une fois l''allocation validée et les fonds reçus, nous confirmons l''ouverture
    du contrat. Le sociétaire reçoit alors ses accès au portail numérique pour suivre
    ses performances.


    Nous rappelons que nous fournissons une éducation financière générale et que nous
    ne garantissons aucune performance sur les supports en unités de compte. Pour
    tout besoin de conseil fiscal ou juridique personnalisé, nous devons renvoyer
    le sociétaire vers un expert certifié.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 70eb21c6-28c0-5a6f-9e92-62f51cce4cb9
  title: 'Contrat d''assurance-vie Égide Multisupport — frais de gestion annuels du
    fonds en euros : explications'
  body: 'Question : À quoi correspondent les frais de gestion annuels du fonds en
    euros ?


    Réponse : Ces frais, fixés à 0,6 % pour le Contrat d''assurance-vie Égide Multisupport,
    couvrent la gestion active des fonds par nos experts et la maintenance de notre
    infrastructure sécurisée. Ils sont prélevés annuellement sur la valeur du fonds
    en euros pour garantir la pérennité de notre modèle mutuel et l''équité entre
    tous les sociétaires.


    Question : Ces frais impactent-ils le taux servi sur mon épargne ?


    Réponse : Oui, les frais de gestion sont déduits de la performance globale du
    fonds. Le taux de 2,6 % communiqué correspond à la rémunération avant déduction
    de ces frais de gestion. Nous privilégions une transparence totale sur cette structure
    tarifaire pour que vous puissiez évaluer précisément le rendement net de votre
    investissement. Pour plus de détails, vous pouvez consulter le document Contrat
    d''assurance-vie Égide Multisupport — grille tarifaire.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 7f8c7dcf-6b85-5f18-85dd-8f653bacf909
  title: Contrat d'assurance-vie Égide Multisupport — effectuer une modification
  body: 'L''arbitrage ou la modification des bénéficiaires sont des opérations courantes
    pour adapter votre Contrat d''assurance-vie Égide Multisupport à l''évolution
    de votre situation personnelle.


    Voici la marche à suivre pour effectuer une modification :


    1. Formulez votre demande : Indiquez-nous précisément la nature de la modification
    souhaitée (par exemple, modifier la répartition entre le fonds en euros et les
    unités de compte, ou changer la clause bénéficiaire).

    2. Vérification d''identité : Pour protéger vos avoirs, nous procédons à une authentification
    forte. Nous vous demanderons de confirmer votre identité via la méthode sécurisée
    convenue lors de l''ouverture de votre contrat.

    3. Transmission des justificatifs : Si la modification concerne un changement
    de bénéficiaire ou une modification d''état civil, nous vous demanderons de nous
    fournir les documents justificatifs nécessaires.

    4. Validation de la demande : Nous analysons la conformité de votre demande avec
    le Code des assurances. Une fois validée, nous enregistrons la modification dans
    vos dossiers.

    5. Confirmation : Vous recevez une notification confirmant que la modification
    a bien été prise en compte. Vous pouvez ensuite constater le changement sur votre
    portail client numérique.


    Sachez que si vous souhaitez modifier l''allocation de vos fonds, les frais de
    gestion s''appliqueront selon le support choisi : 0,6 % pour le fonds en euros
    et 0,85 % pour les unités de compte. Nous restons à votre disposition pour vous
    accompagner dans ces démarches pédagogiques.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: d59f6b34-ad1b-5b2a-972d-c764c130f3b6
  title: Contrat d'assurance-vie Égide Multisupport — problèmes d'accès ou de connexion
  body: 'Il peut arriver que vous rencontriez des difficultés pour accéder à votre
    espace client numérique dédié au Contrat d''assurance-vie Égide Multisupport.
    Voici comment résoudre les situations les plus courantes.


    Symptôme : Le portail client refuse vos identifiants ou affiche un message d''erreur
    lors de la connexion.


    Causes probables et vérifications :

    - Identifiants incorrects : Vérifiez que la touche majuscule n''est pas activée
    par erreur. Votre identifiant est strictement lié à votre qualité de sociétaire.

    - Problème d''authentification forte : Si le code de validation ne vous parvient
    pas, vérifiez que vos coordonnées de contact (email ou téléphone) sont à jour.

    - Session expirée : Pour des raisons de sécurité, nos sessions sont limitées dans
    le temps. Essayez de rafraîchir la page ou de vous reconnecter.


    Solution :

    Si le problème persiste, demandez-nous de réinitialiser vos accès. Nous procèderons
    d''abord à une vérification rigoureuse de votre identité, conformément à notre
    politique de sécurité, avant de vous transmettre de nouveaux identifiants sécurisés.


    Quand escalader la situation :

    Si vous ne parvenez toujours pas à vous connecter après une réinitialisation,
    ou si vous soupçonnez que vos accès ont été compromis, nous escaladons immédiatement
    votre dossier vers un gestionnaire spécialisé. Ce dernier effectuera un audit
    de sécurité sur votre compte et vous contactera par téléphone durant les heures
    ouvrables (CET) pour rétablir l''accès en toute sécurité. Vous recevrez une confirmation
    écrite dès que la situation sera régularisée.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: db39e5b0-4b7d-566a-8218-d09544dc8ff2
  title: Contrat d'assurance-vie Égide Multisupport — niveaux d'accès
  body: 'L''accès aux services et la gestion du Contrat d''assurance-vie Égide Multisupport
    dépendent du statut du demandeur et du respect des conditions d''entrée.


    | Condition | Niveau d''accès | Résultat / Privilège |

    | :--- | :--- | :--- |

    | Versement initial ≥ 500 € | Prospect | Éligibilité à l''ouverture du contrat
    et qualité de sociétaire. |

    | Identité vérifiée + Authentification forte | Sociétaire | Accès complet au portail
    client, modification d''allocation et demandes de rachat. |

    | Dossier complexe ou litige non résolu | Gestionnaire Spécialisé | Escalade du
    dossier pour traitement expert ou vers la Médiation de l''assurance. |

    | Respect du Code des assurances & ACPR | Tous les utilisateurs | Protection du
    FGAP jusqu''à 70 000 € pour les contrats de personnes. |


    Nous rappelons que la qualité de sociétaire confère un droit de participation
    à la gouvernance de notre société mutuelle, renforçant notre position de partenaire
    de confiance.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 97fc3902-eb92-5afe-b49e-cd21af4c7415
  title: Contrat d'assurance-vie Égide Multisupport — choisir entre les formules
  body: 'Le Contrat d''assurance-vie Égide Multisupport vous permet d''arbitrer entre
    deux approches d''investissement selon vos objectifs et votre tolérance au risque.


    Le Fonds en Euros

    Idéal pour la préservation du capital. Il offre un taux de 2,6 % avec des frais
    de gestion annuels de 0,6 %. C''est la solution privilégiée pour les sociétaires
    recherchant une sécurité maximale et une visibilité sur leurs gains.


    Les Unités de Compte

    Idéales pour la croissance à long terme. Elles offrent un potentiel de rendement
    supérieur, bien que la valeur varie selon les marchés, exposant le sociétaire
    à un risque de perte en capital. Les frais de gestion sont de 0,85 %.


    Choisir la bonne formule :

    - Si vous préparez un projet à court terme ou si vous ne supportez aucune perte,
    nous recommandons une allocation majoritaire en fonds en euros.

    - Si vous avez un horizon de placement lointain et souhaitez dynamiser votre épargne,
    l''intégration d''unités de compte est pertinente.


    Pour une analyse détaillée des rendements, nous vous invitons à consulter le document
    Contrat d''assurance-vie Égide Multisupport — grille des taux.'
