- id: a4f7fd9e-1448-5325-94e4-43c24f117d71
  title: Assurance auto Égide — offre en cours
  body: 'Offre Spéciale « Fidélité Mutuelle »


    Nous avons le plaisir de proposer à nos sociétaires actuels une remise exceptionnelle
    pour l''ajout d''un second véhicule au contrat Assurance auto Égide.


    - Objet : Réduction de 15 % sur la cotisation annuelle du second véhicule.

    - Période de validité : Du 1er septembre 2025 au 31 décembre 2025.

    - Condition : L''offre est applicable pour tout nouveau véhicule ajouté sous la
    même identité de sociétaire, avec un maintien des garanties minimums.


    Le bonus maximal de 50 % reste applicable sur le nouveau contrat après la première
    année d''observation. Notez que la franchise tous risques de 300 € s''applique
    normalement au second véhicule. Cette offre vise à renforcer la solidarité au
    sein de notre mutuelle et à simplifier la gestion de votre parc automobile.'
