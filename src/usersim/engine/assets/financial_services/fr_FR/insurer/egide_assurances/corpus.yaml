- id: 85fe3dcc-fafe-5585-b6d2-d116e4fc9191
  title: Assurance auto Égide — opération refusée ou bloquée
  body: 'Il peut arriver que vous ne parveniez pas à modifier un élément de votre
    Assurance auto Égide via le portail numérique. Voici comment identifier et résoudre
    le problème.


    **Symptôme :**

    Un message d''erreur s''affiche lors de la tentative de modification du conducteur,
    du changement de véhicule ou de la demande de retrait de fonds, indiquant que
    « l''opération est bloquée » ou « refusée ».


    **Causes probables et vérifications :**


    1. **Défaut d''authentification forte** : La plupart des modifications de contrat
    exigent une vérification d''identité rigoureuse. Vérifiez que vous avez bien validé
    la notification de sécurité sur votre smartphone.

    2. **Pièces justificatives manquantes** : Pour un changement de véhicule, nous
    avons besoin du certificat d''immatriculation. Si le document n''est pas joint
    ou est illisible, le système bloque la validation.

    3. **Délai de déclaration dépassé** : Si vous tentez de déclarer un sinistre alors
    que le délai de 5 jours ouvrés est expiré, le portail peut restreindre la saisie
    automatique.


    **Solution :**


    - **Pour l''authentification** : Relancez la procédure de connexion et assurez-vous
    que votre application de sécurité est à jour.

    - **Pour les justificatifs** : Téléchargez une version scannée en haute résolution
    de vos documents.

    - **Pour le délai dépassé** : Ne tentez plus la saisie numérique. Demandez-nous
    explicitement l''ouverture d''un dossier manuel.


    **Escalade :**

    Si le blocage persiste après ces vérifications, nous escaladons votre demande
    vers un gestionnaire spécialisé qui analysera l''anomalie technique ou contractuelle.
    Vous recevrez une confirmation de prise en charge par email sous 48 heures ouvrables.'
  domain: insurance
  product_category: assurance_auto
  document_type: troubleshooting
  source_authority: official
