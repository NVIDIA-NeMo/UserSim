- id: f7b67060-609d-5413-84b6-065afce8c356
  title: Assurance habitation Égide — choisir entre les formules
  body: 'Nous proposons différentes formules pour l''Assurance habitation Égide afin
    de s''adapter à vos besoins et à votre budget. Voici les éléments clés pour vous
    aider à choisir.


    **Formule Essentielle**

    C''est la solution idéale pour ceux qui recherchent une protection robuste centrée
    sur les risques majeurs. Elle inclut la franchise standard de 150 €. Pour un locataire
    de deux pièces, la cotisation annuelle indicative est de 168 €. Cette formule
    convient aux petits budgets souhaitant une sécurité fiable sans options superflues.


    **Formule Confort**

    Cette option étend les plafonds d''indemnisation et réduit certaines franchises
    sur les dommages accidentels. Elle est recommandée pour les propriétaires ou les
    familles ayant un patrimoine mobilier important. Bien que la cotisation soit plus
    élevée, elle offre une sérénité accrue face aux aléas du quotidien.


    **Points communs**

    Quelle que soit la formule, la franchise légale catastrophe naturelle est fixée
    à 380 € et le délai de déclaration des sinistres est strictement de 5 jours ouvrés.


    Nous vous conseillons de choisir la formule Essentielle pour un logement modeste
    et la formule Confort si vous possédez des biens de valeur nécessitant une couverture
    étendue.'
  domain: insurance
  product_category: assurance_habitation
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a8eddce8-6863-5686-b3a9-3cf7263e8ef9
  title: Assurance habitation Égide — confidentialité et protection des données
  body: "Égide Assurances s'engage à traiter les données de ses sociétaires avec la\
    \ plus grande rigueur, conformément au Règlement Général sur la Protection des\
    \ Données (RGPD) et sous la surveillance de l'ACPR. L'Assurance habitation Égide\
    \ nécessite la collecte d'informations personnelles et patrimoniales pour l'établissement\
    \ des garanties et le calcul des cotisations.\n\nNous utilisons vos données exclusivement\
    \ pour la gestion de votre contrat, la prévention de la fraude et le traitement\
    \ des sinistres. Le traitement équitable des sociétaires est au cœur de notre\
    \ cadre opérationnel. Nous ne vendons jamais vos données à des tiers à des fins\
    \ commerciales.\n\nPour garantir la sécurité de vos informations, nous appliquons\
    \ une politique d'authentification forte. Aucune modification de contrat et aucun\
    \ versement d'indemnité ne seront effectués sans une vérification rigoureuse de\
    \ l'identité du demandeur. \n\nNous vous rappelons que vous disposez d'un droit\
    \ d'accès, de rectification et d'effacement de vos données personnelles. Ces demandes\
    \ peuvent être formulées via notre portail client numérique ou par email durant\
    \ les heures ouvrables (CET).\n\nL'Assurance habitation Égide s'inscrit dans notre\
    \ modèle coopératif : la transparence sur l'utilisation des données est le gage\
    \ de la confiance mutuelle qui lie chaque sociétaire à notre institution."
  domain: insurance
  product_category: assurance_habitation
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: d33d0ff1-6cd3-5d78-a57b-5f1bcdc9afc5
  title: Assurance habitation Égide — reconnaître les arnaques visant ce produit
  body: 'La protection de nos sociétaires est au cœur de notre engagement. Dans un
    contexte où les tentatives de fraude se professionnalisent, nous souhaitons vous
    alerter sur les méthodes d''arnaques ciblant spécifiquement les contrats de protection
    résidentielle.


    Certains fraudeurs peuvent tenter de se faire passer pour des agents d''Égide
    Assurances ou pour des experts mandatés après un sinistre. Ils utilisent souvent
    un sentiment d''urgence, en vous pressant de fournir des informations confidentielles
    pour « accélérer l''indemnisation » ou pour « éviter une résiliation immédiate
    ». Soyez vigilants : nous ne vous demanderons jamais vos codes d''accès personnels,
    vos mots de passe ou vos secrets de sécurité par email ou par téléphone.


    Une technique courante consiste à vous demander de verser des frais de dossier
    imprévus ou des « taxes de déblocage » pour recevoir une indemnité. Nous vous
    rappelons que nos frais sont transparents et intégrés à la gestion de vos contrats
    ; aucun versement externe et inhabituel n''est requis pour le traitement d''un
    dossier de sinistre.


    Nous attirons également votre attention sur l''importance du respect des délais
    légaux. Les fraudeurs peuvent tenter de vous dissuader de déclarer un sinistre
    rapidement en vous proposant des solutions alternatives non officielles. Or, pour
    garantir la validité de vos garanties, nous appliquons strictement le délai de
    déclaration de 5 jours ouvrés pour les sinistres.


    Si vous recevez une communication suspecte ou si vous avez un doute sur l''identité
    de votre interlocuteur, nous vous recommandons de ne fournir aucune information
    et de nous contacter immédiatement via vos canaux de communication habituels.
    Une vérification rigoureuse de l''identité est systématiquement effectuée avant
    toute action modifiant l''état d''un contrat ou tout transfert de fonds, conformément
    à notre politique de sécurité.


    En cas de doute, référez-vous à notre document Assurance habitation Égide — protection
    contre la fraude et les opérations non autorisées pour connaître les étapes de
    signalement.'
  domain: insurance
  product_category: assurance_habitation
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 501981b6-b5ce-5bb1-8ec1-4a583da1ee5d
  title: Assurance habitation Égide — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux gestionnaires pour l''accompagnement des sociétaires
    concernant les limites et les spécificités techniques de l''Assurance habitation
    Égide.


    L''indemnisation des sinistres est soumise à l''application de franchises, qui
    sont les montants restant à la charge du sociétaire après intervention de l''assurance.
    Il convient de distinguer deux cas de figure principaux :


    1. La franchise standard : pour la majorité des sinistres couverts, une franchise
    de 150 € s''applique. Ce montant est déduit de l''indemnité finale versée au sociétaire.

    2. La franchise catastrophe naturelle : conformément aux réglementations en vigueur,
    les événements classés comme catastrophes naturelles font l''objet d''une franchise
    spécifique de 380 €.


    Restrictions et obligations de déclaration :

    La validité des garanties est conditionnée par le respect strict des délais de
    déclaration. Tout sinistre doit être déclaré dans un délai maximum de 5 jours
    ouvrés. Au-delà de ce délai, la société se réserve le droit d''appliquer des déchéances
    de garantie ou de réduire le montant de l''indemnisation si le retard a causé
    un préjudice à la gestion du dossier.


    Cas particuliers et exclusions :

    Les objets de très haute valeur (œuvres d''art, bijoux de collection) peuvent
    excéder les plafonds de garantie standards. Dans ces situations, nous recommandons
    au sociétaire de nous signaler ces biens pour une extension de garantie spécifique
    ou de fournir des preuves de valeur actualisées.


    Nous rappelons que toute modification du contrat, telle qu''un changement de destination
    du logement (ex: location courte durée), doit faire l''objet d''une mise à jour
    immédiate du dossier. L''absence de déclaration d''un changement de risque peut
    entraîner un refus de prise en charge lors d''un sinistre.'
  domain: insurance
  product_category: assurance_habitation
  document_type: product_sheet
