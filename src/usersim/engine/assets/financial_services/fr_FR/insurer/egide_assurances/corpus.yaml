- id: 7cdefd1a-6643-58a7-8e14-f999fc66e81f
  title: 'Complémentaire santé Égide — forfait optique tous les deux ans hors 100
    % Santé : explications'
  body: 'Question : Comment fonctionne le forfait optique de la Complémentaire santé
    Égide ?


    Réponse : Nous proposons un forfait de 200 € tous les deux ans pour les équipements
    optiques choisis en dehors du panier 100 % Santé. Ce montant est un plafond de
    remboursement qui s''applique à vos montures et verres. Si vous optez pour des
    équipements du panier 100 % Santé, vous bénéficiez d''une prise en charge intégrale
    sans reste à charge, et ce forfait de 200 € ne s''applique pas.


    Question : Puis-je utiliser mon forfait optique chaque année ?


    Réponse : Non, ce forfait spécifique est renouvelé tous les deux ans. Nous vous
    conseillons de planifier vos achats de lunettes en conséquence pour optimiser
    vos remboursements. Pour toute question sur vos cotisations, vous pouvez vous
    référer à la Complémentaire santé Égide — calcul et application des taux.'
  domain: insurance
  product_category: complementaire_sante
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 8090737f-a396-5641-8107-c55e25b01b61
  title: Complémentaire santé Égide — résilier, clôturer ou changer de formule
  body: 'Nous accompagnons nos sociétaires dans l''évolution de leurs besoins. Voici
    la démarche à suivre pour modifier ou mettre fin à votre contrat Complémentaire
    santé Égide.


    Ce que vous devez préparer :

    - Votre numéro de contrat.

    - Une pièce d''identité valide pour la vérification obligatoire.


    Étapes de la procédure :


    1. Formulez votre demande : Indiquez-nous si vous souhaitez résilier définitivement
    votre contrat, le clôturer pour un motif spécifique ou modifier votre formule
    actuelle pour une gamme supérieure ou inférieure.


    2. Vérification d''identité : Nous procéderons à une authentification forte. C''est
    une étape indispensable pour protéger vos données et éviter toute opération non
    autorisée sur votre contrat.


    3. Analyse de la demande : Nous examinerons les conditions de résiliation ou de
    changement. Si vous changez de formule, nous vous présenterons les nouveaux montants
    de cotisation et les nouvelles garanties applicables.


    4. Confirmation et validation : Nous vous confirmerons par écrit (email ou courrier)
    la date effective de la prise d''effet du changement ou la date de clôture du
    contrat.


    5. Notification finale : Vous recevrez un document récapitulatif confirmant la
    fin de vos engagements ou la mise à jour de vos garanties.


    Sachez que nous traitons ces demandes avec impartialité. Si vous résiliez pour
    rejoindre une autre offre, nous vous rappelons que la transparence est au cœur
    de notre modèle mutuel et que nous restons à votre disposition pour optimiser
    votre couverture actuelle avant tout départ.'
  domain: insurance
  product_category: complementaire_sante
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 11afde33-76ee-5b6d-b4ed-dd48cf2e48af
  title: Complémentaire santé Égide — frais ou montant inattendu
  body: 'Symptôme : Le sociétaire constate un reste à charge plus élevé que prévu
    ou un montant de remboursement inférieur aux attentes sur un acte de santé.


    Causes probables :

    - L''acte n''est pas couvert par le panier 100 % Santé et dépasse le plafond de
    la garantie.

    - Une franchise applicable au contrat n''a pas été prise en compte par le sociétaire.

    - Le délai de déclaration de 5 jours ouvrés n''a pas été respecté, entraînant
    une pénalité sur le remboursement.

    - Le forfait spécifique (ex: forfait optique de 200 €) a déjà été consommé durant
    la période de deux ans.


    Procédure de résolution :

    1. Vérification du tableau de garanties : Nous vérifions d''abord si l''acte relève
    du 100 % Santé ou s''il s''agit d''un acte hors panier avec un plafond spécifique.

    2. Analyse du calendrier : Nous contrôlons la date d''envoi de la demande et la
    date de l''acte pour vérifier le respect du délai de 5 jours ouvrés.

    3. Contrôle des forfaits : Nous vérifions l''historique des remboursements pour
    voir si le plafond (comme les 200 € pour l''optique tous les deux ans) a été atteint.


    Résolution et Escalade :

    - Si l''erreur est administrative, nous procédons à un ajustement immédiat du
    remboursement.

    - Si le montant est justifié par les conditions générales, nous apportons une
    explication pédagogique au sociétaire.

    - Si le dossier présente une complexité technique ou un litige persistant, nous
    escaladons le dossier vers un gestionnaire spécialisé. En dernier recours, nous
    orientons le sociétaire vers la Médiation de l''assurance.'
  domain: insurance
  product_category: complementaire_sante
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 729bacc0-085b-5915-b0c2-7fddd442cb15
  title: Complémentaire santé Égide — justificatifs à fournir
  body: 'Pour valider l''adhésion à la Complémentaire santé Égide et garantir la sécurité
    de l''ouverture de vos droits, nous demandons les documents suivants :


    | Document requis | Condition / Usage | Résultat

    | :--- | :--- | :--- |

    | Pièce d''identité officielle | Valide et en cours de validité | Authentification
    du sociétaire validée |

    | Attestation de droits Sécurité Sociale | À jour (Carte Vitale ou attestation)
    | Liaison avec le régime obligatoire établie |

    | Justificatif de domicile | Daté de moins de 3 mois | Validation de la résidence
    fiscale |

    | RIB (Relevé d''Identité Bancaire) | Au nom du demandeur | Activation des remboursements
    et prélèvements |

    | Acte de naissance / Livret de famille | Pour l''ajout d''ayants droit (enfants/conjoint)
    | Extension de la couverture familiale validée |


    L''absence de l''un de ces documents peut suspendre l''activation des garanties.'
