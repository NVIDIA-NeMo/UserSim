  institution_id: egide_assurances
- id: 6c311acb-eca1-5f18-9e8c-6bdecb5d27c3
  title: Complémentaire santé Égide — grille tarifaire
  body: "Cette grille tarifaire est destinée aux agents de support pour l'assistance\
    \ des sociétaires. Elle détaille les coûts de référence applicables à la Complémentaire\
    \ santé Égide.\n\n**Cotisations et Prises en Charge**\n- Cotisation mensuelle\
    \ indicative (adulte de 40 ans) : 58 €\n- Forfait optique (tous les 2 ans, hors\
