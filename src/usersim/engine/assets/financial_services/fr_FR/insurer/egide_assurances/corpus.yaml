  title: Assurance habitation Égide — grille tarifaire
  body: 'Ce document détaille les éléments tarifaires applicables à l''Assurance habitation
    Égide pour l''assistance aux sociétaires.


    **Cotisations**

    - Cotisation annuelle indicative (exemple locataire 2 pièces) : 168 €


    **Franchises (montants restant à la charge du sociétaire)**

    - Franchise standard : 150 €

    - Franchise catastrophe naturelle : 380 €


    **Délais et Conformité**

    - Délai maximal de déclaration de sinistre : 5 jours ouvrés


    *Note : Les frais de gestion sont inclus dans la cotisation et servent à maintenir
    l''infrastructure sécurisée et l''équité du modèle mutuel. Toute modification
