- id: bb3d82ae-8d9a-5061-976b-f3491894a53b
  title: Assurance auto Égide — protection contre la fraude et les opérations non
    autorisées
  body: 'Chez Égide Assurances, la protection de nos sociétaires est notre priorité
    absolue. Dans le cadre de l''Assurance auto Égide, nous appliquons une politique
    de tolérance zéro envers la fraude, afin de garantir l''équité et la pérennité
    de notre modèle coopératif.


    Certains schémas de fraude ciblent fréquemment les contrats d''assurance automobile,
    notamment la déclaration de sinistres fictifs ou la falsification de justificatifs
    de bonus. Nous vous rappelons qu''une vérification rigoureuse de l''identité et
    une authentification forte sont obligatoires avant toute action modifiant l''état
    d''un contrat ou tout transfert de fonds. Nous ne vous demanderons jamais vos
    codes secrets ou vos mots de passe par email ou par téléphone.


    L''un des points critiques de la sécurité de votre contrat réside dans le respect
    des délais légaux. Pour garantir la validité de vos garanties et éviter tout litige
    sur la légitimité d''une indemnisation, les sinistres doivent être déclarés dans
    un délai strict de 5 jours ouvrés. Le non-respect de ce délai peut être interprété
    comme une anomalie et peut entraîner des investigations supplémentaires.


    Si vous constatez une opération suspecte sur votre compte ou si vous recevez une
    communication inhabituelle semblant provenir de nos services, nous vous demandons
    de nous en informer immédiatement. Une réaction rapide permet de bloquer les actions
    non autorisées et de protéger vos droits de sociétaire.


    Nous opérons sous la surveillance de l''ACPR, ce qui nous impose un cadre opérationnel
    strict en matière de traitement équitable et de protection des données. Pour plus
    de détails sur notre cadre réglementaire, nous vous invitons à consulter le document
    Assurance auto Égide — informations réglementaires.'
  domain: insurance
  product_category: assurance_auto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ef4d318b-6d46-576c-9b9f-724441a180a0
  title: Assurance auto Égide — conditions générales
  body: 'Le présent document détaille les conditions générales applicables au contrat
    Assurance auto Égide. En tant que société mutuelle, nous nous engageons à une
    transparence totale envers nos sociétaires.


    Obligations du sociétaire :

    Le sociétaire s''engage à fournir des informations exactes lors de la souscription
    et à signaler tout changement de situation impactant le risque. En cas de sinistre,
    le sociétaire a l''obligation formelle de nous déclarer l''événement dans un délai
    de 5 jours ouvrés. Le non-respect de ce délai peut entraîner une réduction, voire
    une annulation de l''indemnisation.


    Engagements de l''assureur :

    Nous nous engageons à traiter chaque réclamation avec impartialité. En cas de
    dommages couverts par la formule tous risques, une franchise de 300 € reste à
    la charge du sociétaire après l''indemnisation du sinistre.


    Évolution des tarifs et bonus :

    Les cotisations sont ajustées annuellement selon le profil de risque et le coefficient
    de bonus-malus. Le système de bonus est optimisé pour récompenser la prudence,
    avec un bonus maximal pouvant atteindre 50 % de réduction sur la prime de base.


    Modification et résiliation :

    Toute modification du contrat nécessite une authentification forte de l''identité
    du sociétaire. Le contrat peut être résilié selon les dispositions légales en
    vigueur et les modalités spécifiques à notre modèle coopératif.


    En cas de litige persistant après l''intervention d''un gestionnaire spécialisé,
    le sociétaire peut saisir la Médiation de l''assurance, conformément à notre cadre
    opérationnel.'
  domain: insurance
  product_category: assurance_auto
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 15ee3dfe-3b09-5037-9f43-75d8b00172ce
  title: Assurance auto Égide — pour qui et pour quels usages
  body: 'L''Assurance auto Égide est conçue pour les particuliers et les familles
    qui recherchent un partenaire de confiance plutôt qu''un simple prestataire. En
    choisissant notre mutuelle, vous ne devenez pas seulement assuré, mais sociétaire,
    participant ainsi à la gouvernance d''un modèle fondé sur l''éthique et la transparence.


    Ce produit est idéal pour :

    - Les conducteurs privilégiant la sécurité et la gestion rapide des sinistres.

    - Les familles souhaitant une couverture fiable et évolutive pour plusieurs véhicules.

    - Les automobilistes soucieux de l''équité tarifaire, où les frais sont justifiés
    par une gestion active et une infrastructure sécurisée.


    Caractéristiques clés :

    - Coût indicatif : À titre d''exemple, une cotisation annuelle peut s''élever
    à 640 €, selon le profil du conducteur et le véhicule.

    - Valorisation de la prudence : Nous proposons un système de bonus optimisé permettant
    d''atteindre un bonus maximal de 50 %.

    - Gestion des sinistres : Nous assurons un accompagnement pédagogique et professionnel,
    avec un traitement rigoureux des dossiers.

    - Protection : En formule tous risques, nous appliquons une franchise de 300 €
    pour maintenir l''équilibre financier de la mutuelle et garantir des tarifs justes
    pour tous.


    L''Assurance auto Égide s''adapte aux usages quotidiens, qu''il s''agisse de trajets
    domicile-travail ou de déplacements familiaux, en offrant une sérénité totale
    grâce à notre modèle coopératif.'
  domain: insurance
  product_category: assurance_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 53cc1ba7-48ff-584c-acbb-a0216fdc1b2d
  title: 'Assurance auto Égide — franchise tous risques : explications'
  body: 'Question : Qu''est-ce que la franchise tous risques et quel est son montant
    pour mon contrat ?


    Réponse : La franchise est le montant qui reste à votre charge après l''indemnisation
    d''un sinistre par nos soins. Pour le contrat Assurance auto Égide en formule
    tous risques, le montant de la franchise est de 300 €. Par exemple, si les réparations
    de votre véhicule s''élèvent à 1 000 €, nous verserons 700 € et les 300 € restants
    seront à votre charge.


    Question : Pourquoi appliquer une franchise ?


    Réponse : Cette structure tarifaire permet de limiter les coûts de gestion des
    petits sinistres, garantissant ainsi l''équité entre tous les sociétaires et la
    pérennité de notre modèle mutuel. Pour comprendre comment ce montant s''inscrit
    dans vos conditions générales, nous vous invitons à consulter le document Assurance
    auto Égide — conditions générales.'
  domain: insurance
  product_category: assurance_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 84bc1724-ed19-5785-89aa-dbc80f5ee327
  title: Assurance auto Égide — résilier, clôturer ou changer de formule
  body: 'Nous accompagnons nos sociétaires dans l''évolution de leurs besoins. Voici
    la marche à suivre pour modifier votre contrat ou y mettre fin.


    Pour changer de formule (ex: passer du tiers au tous risques) :

    1. Indiquez-nous la nouvelle formule souhaitée et les éventuelles modifications
    de votre usage du véhicule.

    2. Nous procédons à une vérification rigoureuse de votre identité pour sécuriser
    l''opération.

    3. Nous vous communiquons la nouvelle cotisation annuelle ajustée et les conditions
    associées (notamment la franchise de 300 € si vous passez en tous risques).

    4. Vous nous confirmez votre accord sur ce nouveau devis.

    5. Nous vous envoyons l''avenant au contrat par email pour validation finale.


    Pour résilier ou clôturer votre contrat :

    1. Demandez-nous la clôture de votre contrat en précisant la date d''effet souhaitée.

    2. Nous vérifions votre identité via notre protocole d''authentification forte.

    3. Nous analysons l''état de vos cotisations et nous vous confirmons le solde
    éventuel à régulariser ou à rembourser.

    4. Nous vous transmettons l''attestation de résiliation, document indispensable
    pour souscrire une nouvelle assurance sans rupture de garantie.


    L''ensemble de ces démarches est traité durant nos heures ouvrables (CET). En
    cas de dossier complexe, nous escaladons votre demande vers un gestionnaire spécialisé.'
  domain: insurance
  product_category: assurance_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 85d07a9b-b6a5-5ef9-9ec6-2810f4fa1474
  title: Assurance auto Égide — frais ou montant inattendu
  body: 'Symptôme : Le sociétaire constate que le montant de sa cotisation annuelle
    est différent de l''exemple de 640 € ou a subi une variation imprévue.


    Causes probables :

    - Modification du coefficient de bonus-malus suite à un sinistre.

    - Atteinte ou dépassement du bonus maximal de 50 %.

    - Changement du profil de risque (ex: changement de véhicule, nouveau conducteur).

    - Mise à jour annuelle des tarifs pour maintenir l''infrastructure sécurisée de
    la mutuelle.


    Procédure de vérification :

    1. Vérifier la dernière attestation de bonus-malus reçue.

    2. Comparer la cotisation actuelle avec la prime de base avant application du
    bonus.

    3. Analyser si un sinistre a été déclaré récemment, impactant le taux.


    Résolution :

    - Si le montant est correct selon le bonus actuel, nous expliquons au sociétaire
    le calcul pédagogiquement.

    - Si une erreur de saisie du bonus est détectée, nous rectifions le taux et appliquons
    un avoir sur la prochaine échéance.

    - Si le sociétaire conteste la justification des frais, nous détaillons la structure
    tarifaire qui garantit l''équité entre sociétaires.


    En cas de désaccord persistant sur le montant, nous escaladons le dossier vers
    un gestionnaire spécialisé pour une analyse approfondie du dossier.'
  domain: insurance
  product_category: assurance_auto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 3794a20b-2bdc-5bc1-a328-de8f69a41555
  title: Assurance auto Égide — justificatifs à fournir
  body: 'Pour souscrire ou modifier votre contrat Assurance auto Égide, nous avons
    besoin des documents suivants :


    | Justificatif demandé | Résultat / Action associée |

    | :--- | :--- |

    | Pièce d''identité valide (CNI, Passeport) | Validation de l''identité et ouverture
    du compte sociétaire |

    | Certificat d''immatriculation du véhicule | Identification technique et enregistrement
    du véhicule |

    | Permis de conduire valide | Vérification de l''aptitude à conduire et calcul
    du risque |

    | Relevé d''information (dernières 2 années) | Application du bonus actuel (jusqu''au
    maximum de 50 %) |

    | Justificatif de domicile récent | Validation du lieu de stationnement du véhicule
    |


    L''absence de l''un de ces documents peut entraîner un retard dans l''activation
    des garanties ou l''application d''un tarif par défaut sans bonus.'
  domain: insurance
  product_category: assurance_auto
  document_type: eligibility_matrix
  source_authority: official
