- id: d2759d48-8686-5891-9962-afcb9891831f
  title: Complémentaire santé Égide — modification des conditions
  body: 'Le présent document détaille les modalités de modification des conditions
    générales de la Complémentaire santé Égide. En tant que société d''assurance mutuelle,
    nous nous engageons à une transparence totale concernant l''évolution de vos garanties.


    Nous nous réservons le droit de modifier les conditions du contrat pour adapter
    nos couvertures aux évolutions législatives ou pour garantir la pérennité du modèle
    mutuel. Toute modification impactant vos cotisations ou vos niveaux de remboursement
    fera l''objet d''une notification préalable. Nous vous informerons de tout changement
    significatif dans un délai de préavis respectant les normes du Code des assurances.


    Les sociétaires disposent d''un droit de regard sur ces évolutions via la gouvernance
    de la mutuelle. Si une modification des conditions ne vous convient pas, vous
    conservez la possibilité de résilier votre contrat selon les modalités légales
    en vigueur. Nous rappelons que la structure tarifaire est conçue pour garantir
    l''équité entre tous les sociétaires, justifiant ainsi les frais de gestion active
    et la maintenance de notre infrastructure sécurisée.


    L''application des garanties reste conditionnée au respect strict des obligations
    de l''assuré, notamment la déclaration des sinistres sous 5 jours ouvrés. Tout
    manquement à cette obligation peut entraîner une réduction, voire une exclusion
    de l''indemnisation.


    Les modifications de situation personnelle (changement d''adresse, composition
    familiale) doivent nous être signalées sans délai pour garantir la mise à jour
    exacte de vos droits et le maintien de la validité de vos couvertures. Nous traiterons
    chaque demande avec l''impartialité et la rigueur qui caractérisent notre institution.'
  domain: insurance
  product_category: complementaire_sante
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e4bd9ac6-305d-5c4f-a876-4f4ad6296acb
  title: Complémentaire santé Égide — prise en main pas à pas
  body: 'Bienvenue au sein de la Complémentaire santé Égide. Nous avons conçu ce guide
    pour vous accompagner dans vos premiers pas avec notre mutuelle responsable, garantissant
    l''accès aux paniers 100 % Santé sans reste à charge.


    Pour commencer l''utilisation de vos services, voici la marche à suivre :


    1. Activation de l''espace sociétaire : Dès la validation de votre adhésion, nous
    vous envoyons vos identifiants de connexion. Accédez à votre portail numérique
    pour vérifier l''exactitude de vos informations personnelles.


    2. Transmission de la carte de tiers payant : Nous mettons à votre disposition
    un dispositif de tiers payant. Téléchargez votre attestation sur le portail ou
    demandez-nous de vous l''envoyer par email. Ce document vous permettra de ne pas
    avancer les frais auprès de nombreux professionnels de santé.


    3. Paramétrage des remboursements : Assurez-vous que vos coordonnées bancaires
    sont correctement renseignées pour recevoir vos remboursements rapidement. Nous
    vous conseillons de vérifier la liaison avec votre caisse d''assurance maladie
    pour optimiser la télétransmission des soins.


    4. Consultation des garanties : Parcourez vos tableaux de garanties pour identifier
    vos plafonds. Par exemple, nous proposons un forfait optique de 200 € tous les
    deux ans hors 100 % Santé, ainsi qu''une prise en charge du forfait journalier
    hospitalier à hauteur de 23 € par jour.


    5. Gestion des demandes : Pour toute demande de remboursement hors tiers payant,
    transmettez-nous vos justificatifs via le portail. Nous traiterons votre dossier
    avec diligence et impartialité.


    Nous vous rappelons que nous restons disponibles par téléphone et email durant
    les heures ouvrables (CET) pour vous accompagner. En cas de dossier complexe,
    nous escaladerons votre demande vers un gestionnaire spécialisé pour vous garantir
    une solution précise et pédagogique.'
  domain: insurance
  product_category: complementaire_sante
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 253f4bc4-7b21-5252-b170-5a128254b439
  title: 'Complémentaire santé Égide — forfait journalier hospitalier pris en charge
    : explications'
  body: 'Le forfait journalier hospitalier est la somme restant à la charge du patient
    pour chaque journée d''hospitalisation, après l''intervention de la Sécurité sociale.


    **Comment fonctionne la prise en charge chez Égide Assurances ?**

    Nous accompagnons nos sociétaires durant leurs périodes d''hospitalisation en
    prenant en charge ce montant. Pour la Complémentaire santé Égide, nous versons
    un montant de 23 € par jour pour couvrir ce forfait.


    **Est-ce automatique ?**

    Si la télétransmission est active entre l''établissement de santé et notre mutuelle,
    le règlement s''effectue sans intervention de votre part. Dans le cas contraire,
    nous vous invitons à nous transmettre le bulletin de sortie pour obtenir le remboursement
    de vos 23 € journaliers.


    Pour plus de détails sur l''ensemble de nos couvertures, nous vous invitons à
    consulter la « Complémentaire santé Égide — prise en main pas à pas ».'
  domain: insurance
  product_category: complementaire_sante
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fbb23bc0-cbd3-555f-9657-ad08484ec7ba
  title: Complémentaire santé Égide — effectuer une modification
  body: 'Nous vous accompagnons dans la mise à jour de votre contrat Complémentaire
    santé Égide afin que vos garanties restent parfaitement adaptées à vos besoins
    et à votre situation familiale.


    Voici les étapes pour effectuer une modification de votre contrat :


    1. Expression du besoin : Indiquez-nous précisément la modification souhaitée
    (par exemple, l''ajout d''un ayant-droit, un changement d''adresse postale ou
    le passage à une formule de couverture supérieure).


    2. Vérification d''identité : Pour protéger vos données, nous procéderons à une
    vérification rigoureuse de votre identité. Nous vous demanderons de confirmer
    vos informations personnelles ou de fournir un justificatif officiel si la modification
    impacte la structure du contrat.


    3. Analyse et proposition : Nous analyserons l''impact de votre demande sur vos
    cotisations. Si la modification entraîne un changement de tarif, nous vous communiquerons
    le nouveau montant mensuel (par exemple, une évolution basée sur notre cotisation
    indicative de 58 € pour un adulte de 40 ans).


    4. Validation et confirmation : Après votre accord explicite sur les nouvelles
    conditions, nous enregistrerons la modification. Vous recevrez alors un avenant
    au contrat par email confirmant la date d''effet et les nouvelles garanties applicables.


    5. Mise à jour des documents : Une fois la modification validée, nous mettrons
    à jour vos attestations de tiers payant et vos tableaux de garanties, disponibles
    immédiatement sur votre portail client.


    Nous vous rappelons que toute modification doit être effectuée conformément aux
    règles décrites dans le document « Complémentaire santé Égide — modification des
    conditions ».'
  domain: insurance
  product_category: complementaire_sante
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 0d19fa22-e1ee-5070-9678-3758d0c0dbae
  title: Complémentaire santé Égide — problèmes d'accès ou de connexion
  body: 'Il peut arriver que vous rencontriez des difficultés pour accéder à votre
    espace client numérique. Nous vous aidons ici à identifier la cause et à rétablir
    votre accès rapidement.


    **Symptôme : « Mon mot de passe est refusé ou mon compte semble bloqué »**


    *   **Causes probables** : Erreur de saisie, mot de passe expiré pour des raisons
    de sécurité, ou trop nombreuses tentatives de connexion infructueuses ayant déclenché
    un verrouillage protecteur.

    *   **Ce qu''il faut vérifier** : Assurez-vous que la touche verrouillage majuscule
    n''est pas activée et que vous utilisez l''identifiant sociétaire exact.

    *   **La solution** : Demandez-nous la réinitialisation de votre mot de passe.
    Nous vous enverrons un lien sécurisé par email ou un code temporaire par SMS pour
    créer un nouveau mot de passe conforme à nos exigences de sécurité.


    **Symptôme : « La page de connexion ne se charge pas ou affiche une erreur serveur
    »**


    *   **Causes probables** : Problème de cache du navigateur, connexion internet
    instable ou maintenance temporaire de notre infrastructure sécurisée.

    *   **Ce qu''il faut vérifier** : Essayez de vous connecter via un autre navigateur
    ou en mode de navigation privée. Vérifiez également que votre connexion réseau
    est active.

    *   **La solution** : Si le problème persiste après ces tests, nous interviendrons
    pour diagnostiquer l''origine technique.


    **Quand escalader la situation ?**

    Si aucune des étapes ci-dessus ne résout le problème, nous escaladerons votre
    dossier vers notre équipe de support technique spécialisée. Nous ouvrirons un
    ticket d''incident et vous informerons par email dès que l''accès à votre compte
    sera rétabli. Nous nous engageons à traiter ces interruptions de service avec
    la plus grande diligence pour ne pas entraver votre gestion quotidienne.'
  domain: insurance
  product_category: complementaire_sante
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 0b453b64-cecf-501f-9879-2dac2eafe783
  title: Complémentaire santé Égide — niveaux d'accès
  body: 'Afin de garantir la confidentialité des données de santé et la sécurité des
    contrats, nous appliquons des niveaux d''accès distincts selon la qualité du membre
    au sein de la mutuelle :


    | Profil | Accès aux garanties | Modification du contrat | Vote Gouvernance |
    Gestion Tiers Payant |

    | :--- | :---: | :---: | :---: | :---: |

    | **Sociétaire** | Total | Oui (après vérification) | Oui | Total |

    | **Bénéficiaire** | Consultation | Non | Non | Consultation |

    | **Administrateur Famille** | Total | Oui (pour les ayants-droit) | Oui (si sociétaire)
    | Total |


    L''accès au niveau « Sociétaire » est conditionné par l''adhésion effective et
    le paiement des cotisations. Toute modification d''un contrat nécessite une authentification
    forte et une vérification d''identité rigoureuse pour protéger les fonds et les
    données du sociétaire.'
  domain: insurance
  product_category: complementaire_sante
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: b260fbee-5b93-55c2-943d-41ec2c002d0c
  title: Complémentaire santé Égide — choisir entre les formules
  body: 'Choisir sa couverture santé est une étape essentielle. La Complémentaire
    santé Égide se distingue par son modèle mutuel où chaque assuré est un sociétaire,
    privilégiant l''éthique sur la rentabilité.


    Comparons notre approche avec une offre d''assurance classique :


    *   **Coût et Transparence** : Pour un adulte de 40 ans, notre cotisation mensuelle
    indicative est de 58 €. Contrairement aux assureurs commerciaux, nos frais sont
    justifiés par la gestion active et la maintenance d''une infrastructure sécurisée,
    garantissant l''équité entre tous les membres.

    *   **Garanties Optiques** : Là où certaines offres basiques limitent les remboursements,
    nous proposons un forfait optique de 200 € tous les deux ans (hors 100 % Santé).

    *   **Soutien Hospitalier** : Nous intégrons une prise en charge du forfait journalier
    hospitalier de 23 €, offrant une sérénité accrue lors des séjours cliniques.

    *   **Philosophie** : Nous ne sommes pas un simple prestataire, mais un partenaire
    de confiance. Nos sociétaires participent à la gouvernance, contrairement aux
    contrats d''assurance classiques.


    **Laquelle choisir ?**

    L''offre Égide est idéale pour les particuliers et les familles recherchant une
    protection responsable, une transparence totale des frais et un engagement éthique.
    Une assurance classique peut convenir à ceux recherchant des contrats standardisés
    sans implication dans la gouvernance de l''organisme.'
  domain: insurance
  product_category: complementaire_sante
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 0b3739e3-dbf9-5d09-a90a-4953fbd435f7
  title: Complémentaire santé Égide — confidentialité et protection des données
  body: 'La gestion des données de santé requiert la plus haute vigilance. Égide Assurances
    opère sous la surveillance rigoureuse de l''ACPR et respecte strictement le Code
    des assurances, ainsi que le Règlement Général sur la Protection des Données (RGPD).


    Nous nous engageons à ce que le traitement de vos données soit équitable et limité
    aux seules finalités nécessaires à la gestion de vos contrats et au règlement
    de vos prestations de santé. Vos informations sont hébergées sur une infrastructure
    sécurisée, protégée contre tout accès non autorisé. Nous appliquons une politique
    de tolérance zéro envers la fraude, ce qui nous impose des procédures de vérification
    d''identité systématiques avant toute modification contractuelle ou transfert
    de fonds.


    Conformément à notre cadre opérationnel, nous garantissons la protection des données
    et le traitement impartial de chaque sociétaire. Bien que nous soyons une mutuelle,
    nous respectons les dispositions légales relatives à la protection des assurés.
    Pour nos contrats de personnes, nous nous alignons sur les standards de sécurité
    et de conformité les plus stricts, incluant la surveillance des risques et la
    transparence des frais de gestion.


    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Pour exercer ces droits, vous pouvez nous contacter via
    votre portail client ou par email. Nous traiterons votre demande dans les délais
    légaux.


    Nous vous rappelons que nous fournissons des informations sur nos produits et
    une éducation financière générale, mais nous ne délivrons aucun conseil fiscal,
    juridique ou médical personnalisé. Pour ces besoins, nous vous invitons à consulter
    des experts certifiés. Notre rôle est de vous garantir une couverture santé fiable,
    éthique et transparente.'
  domain: insurance
  product_category: complementaire_sante
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 96c8d1f7-f679-55ca-9553-2d3ac6833651
  title: Complémentaire santé Égide — reconnaître les arnaques visant ce produit
  body: 'La protection de vos données de santé et de vos informations financières
    est l''une de nos priorités absolues. Parce que la Complémentaire santé Égide
    traite des informations sensibles, elle peut être la cible de tentatives de fraude
    sophistiquées. Nous vous invitons à rester vigilants face aux scénarios suivants
    :


    Le faux remboursement : Vous recevez un e-mail ou un SMS vous informant qu''un
    trop-perçu sur vos cotisations ou un remboursement de soin est en attente. Le
    message vous demande de cliquer sur un lien pour « valider vos coordonnées bancaires
    » afin de recevoir les fonds. C''est une technique classique de phishing pour
    dérober vos accès bancaires.


    L''urgence administrative : Un interlocuteur se présente comme un agent de l''ACPR
    ou d''un organisme de santé et vous presse de fournir des documents d''identité
    ou des preuves de paiement pour « éviter la suspension de vos garanties ».


    L''offre miracle : Un tiers vous propose de réduire vos cotisations en échange
    d''un transfert de dossier vers un partenaire non certifié, en demandant vos identifiants
    de connexion à notre portail.


    Ce que nous ne ferons jamais :

    Nous ne vous demanderons jamais votre mot de passe, votre code secret ou vos identifiants
    de connexion par e-mail, SMS ou téléphone.

    Nous ne vous demanderons jamais de payer des frais de « déblocage » pour recevoir
    un remboursement.


    Action immédiate :

    Si vous constatez une demande suspecte ou si vous avez communiqué des informations
    confidentielles, informez-nous sans délai. Nous procéderons immédiatement à la
    sécurisation de votre dossier. Nous vous rappelons qu''une authentification forte
    est systématiquement requise avant toute action modifiant l''état de votre contrat
    ou tout transfert de fonds.'
  domain: insurance
  product_category: complementaire_sante
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 2f43b3e4-e47a-572b-bf9a-0eee5860d6d7
  title: Complémentaire santé Égide — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux gestionnaires pour l''accompagnement des sociétaires
    sur les limites de garanties de la Complémentaire santé Égide.


    L''objectif de notre mutuelle est d''assurer un accès équitable aux soins. À ce
    titre, nous intégrons pleinement les paniers 100 % Santé, garantissant l''absence
    de reste à charge pour les soins sélectionnés dans ces catalogues.


    Cependant, pour les soins hors parcours 100 % Santé, des plafonds s''appliquent
    :


    Optique : Nous proposons un forfait optique de 200 € tous les deux ans. Ce montant
    est destiné à couvrir la part restant à la charge du sociétaire après l''intervention
    de la sécurité sociale, pour des équipements hors panier 100 % Santé.


    Hospitalisation : En complément des frais de séjour, nous versons une indemnité
    forfaitaire journalière de 23 € par jour d''hospitalisation. Ce montant est destiné
    à aider le sociétaire à couvrir les frais annexes liés au séjour hospitalier.


    Restrictions et points de vigilance :

    - Le respect des délais légaux est impératif : tout sinistre ou demande de remboursement
    doit être déclaré dans un délai de 5 jours ouvrés pour garantir la validité des
    garanties.

    - Les remboursements sont conditionnés à la transmission des décomptes de la sécurité
    sociale et des factures originales.

    - Toute modification du contrat (ajout d''un ayant-droit, changement de formule)
    nécessite une vérification rigoureuse de l''identité du sociétaire conformément
    à notre politique de sécurité.'
  domain: insurance
  product_category: complementaire_sante
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 2eac6434-4a41-52d9-ab5d-dd87c2d20888
  title: Complémentaire santé Égide — coûts et frais
  body: 'Découvrez comment sont structurées les cotisations de notre mutuelle santé.


    Combien coûte la Complémentaire santé Égide ?

    Le montant de la cotisation dépend de votre profil et de vos besoins. À titre
    d''exemple, la cotisation mensuelle indicative pour un adulte de 40 ans est de
    58 €. Ce montant est transparent et justifié par la gestion active de notre fonds
    mutualiste et la maintenance de notre infrastructure sécurisée.


    Pourquoi choisir un modèle mutuel pour sa santé ?

    En tant que société d''assurance mutuelle, nous ne recherchons pas le profit.
    Les sociétaires sont également des associés. Cette structure garantit que les
    cotisations servent prioritairement à l''indemnisation des soins et à la pérennité
    du modèle, assurant ainsi une équité tarifaire entre tous les membres.


    Existe-t-il des frais de dossier ?

    Nous privilégions la transparence : nos frais sont inclus dans la cotisation globale,
    sans frais cachés lors de la souscription.'
  domain: insurance
  product_category: complementaire_sante
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: c47a76fb-fc8c-5f8c-9b51-6d3c78ac782b
  title: Complémentaire santé Égide — consulter le suivi ou l'historique
  body: 'Pour suivre vos remboursements et consulter l''historique de vos soins, nous
    vous accompagnons via la procédure suivante :


    Ce dont vous avez besoin : Votre numéro de sociétaire et une pièce d''identité
    valide.


    Étape 1 : Demandez-nous l''accès à votre historique de remboursements. Nous débuterons
    la session par une vérification rigoureuse de votre identité pour protéger vos
    données de santé.


    Étape 2 : Précisez-nous la période concernée (par exemple, le dernier trimestre
    ou l''année civile écoulée). Nous extrairons alors la liste chronologique de toutes
    les prestations prises en charge.


    Étape 3 : Nous vous communiquerons le détail de chaque acte : la date du soin,
    le montant remboursé par la sécurité sociale et la part complémentaire versée
    par nos soins.


    Étape 4 : Si vous constatez une anomalie sur un remboursement spécifique, demandez-nous
    le détail du calcul. Nous vous expliquerons alors comment le montant a été déterminé
    en fonction de vos plafonds de garantie.


    Vous saurez que l''opération est terminée lorsque vous aurez reçu la confirmation
    écrite du cumul des remboursements pour la période demandée.'
  domain: insurance
  product_category: complementaire_sante
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 92a47a84-4a51-5c2e-b754-8aafdfa9e09a
  title: Complémentaire santé Égide — opération refusée ou bloquée
  body: 'Il peut arriver qu''une demande de remboursement ou une modification de contrat
    soit refusée. Voici comment identifier la cause et résoudre la situation.


    Symptôme : Votre demande de prise en charge est marquée comme « refusée » ou «
    bloquée ».


    Causes probables et vérifications :

    1. Délai de déclaration dépassé : Nous appliquons strictement le délai légal de
    5 jours ouvrés pour la déclaration des sinistres et soins. Si votre demande a
    été envoyée après ce délai, la garantie peut être invalidée.

    2. Pièces justificatives manquantes : Le refus est fréquent si le décompte de
    la sécurité sociale n''est pas joint à la facture. Vérifiez que nous avons bien
    reçu le document officiel attestant du remboursement initial.

    3. Identité non vérifiée : Pour toute action modifiant l''état d''un contrat,
    une authentification forte est obligatoire. Si vos documents d''identité sont
    périmés, l''opération sera bloquée.

    4. Plafond atteint : Si le montant demandé dépasse vos plafonds (par exemple,
    le forfait optique de 200 € tous les deux ans), le surplus sera refusé.


    Comment résoudre le problème :

    - S''il s''agit d''un document manquant, transmettez-nous la pièce justificative
    dès maintenant.

    - Si vos documents d''identité sont obsolètes, fournissez-nous une copie recto-verso
    de votre pièce d''identité à jour.


    Quand escalader :

    Si vous estimez que le refus est injustifié malgré la conformité de votre dossier,
    demandez-nous de transmettre votre demande à un gestionnaire spécialisé. En dernier
    recours, nous vous orienterons vers la Médiation de l''assurance pour un traitement
    impartial.'
  domain: insurance
  product_category: complementaire_sante
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 3a5676c0-f717-5c5b-ade8-4544539a9528
  title: Complémentaire santé Égide — quand changer ou monter en gamme
  body: 'Ce guide aide les gestionnaires à conseiller les sociétaires sur l''évolution
    de leur couverture santé.


    La Complémentaire santé Égide est conçue pour être évolutive. Un changement de
    formule ou une montée en gamme est recommandée dans les cas suivants :


    Évolution des besoins de santé : Si un sociétaire constate que ses dépenses récurrentes
    (optique, dentaire, spécialistes) dépassent systématiquement les forfaits actuels,
    comme le forfait optique de 200 € tous les deux ans, une formule supérieure est
    préférable pour réduire le reste à charge.


    Changement de situation familiale : L''ajout d''un conjoint ou la naissance d''un
    enfant peut justifier le passage à une offre famille pour optimiser les cotisations
    globales.


    Préparation d''un acte majeur : Avant une hospitalisation prolongée, un sociétaire
    peut souhaiter augmenter son indemnité forfaitaire journalière au-delà des 23
    € actuels pour mieux couvrir les frais de confort ou d''accompagnement.


    Recommandation :

    - Conservez la formule actuelle si le sociétaire utilise principalement les paniers
    100 % Santé, car la couverture actuelle est déjà complète sur ce segment.

    - Proposez la montée en gamme si le sociétaire privilégie des praticiens aux honoraires
    libres (secteur 2) et souhaite limiter ses frais réels.'
  domain: insurance
  product_category: complementaire_sante
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fafc94ce-93a9-5e2d-9da8-54c5af302cfa
  title: Complémentaire santé Égide — comparaison avec les alternatives et quand ne
    pas le choisir
  body: 'Choisir sa mutuelle est une décision importante. Nous souhaitons vous apporter
    une transparence totale pour vous aider à déterminer si la Complémentaire santé
    Égide est le partenaire adapté à vos besoins.


    Pourquoi choisir la Complémentaire santé Égide ?

    Notre modèle coopératif nous distingue. Contrairement aux assureurs classiques,
    nous sommes une mutuelle où les assurés sont sociétaires. Cela signifie que nous
    privilégions l''éthique et l''équité plutôt que la maximisation des profits. Nous
    offrons un accès garanti aux paniers 100 % Santé et des forfaits clairs, comme
    notre indemnité hospitalière de 23 € par jour.


    Face aux alternatives du marché :

    - Assureurs commerciaux : Ils peuvent proposer des options très spécifiques ou
    des contrats « haut de gamme » avec des plafonds extrêmement élevés pour des besoins
    très pointus. Cependant, leurs frais de gestion peuvent être moins transparents
    que les nôtres.

    - Mutuelles concurrentes : Nous nous alignons sur les standards de qualité, mais
    nous nous distinguons par notre approche pédagogique et notre accompagnement numérique
    simplifié.


    Quand ne pas choisir notre produit ?

    La Complémentaire santé Égide peut ne pas être la solution idéale si :

    - Vous recherchez une couverture extrêmement spécialisée pour des soins très rares
    et coûteux hors parcours classique, nécessitant des plafonds de remboursement
    sans aucune limite.

    - Vous préférez un contrat sans aucune obligation de délai de déclaration (nous
    appliquons strictement les 5 jours ouvrés pour garantir la viabilité du modèle
    mutuel).


    En résumé, nous sommes le partenaire de confiance pour les familles et les particuliers
    recherchant une protection fiable, éthique et transparente.'
  domain: insurance
  product_category: complementaire_sante
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 60ba3917-af12-5633-9e17-cf23a0b8adc0
  title: Complémentaire santé Égide — éligibilité et souscription
  body: 'Tout savoir sur l''adhésion à notre mutuelle santé.


    Qui peut souscrire à la Complémentaire santé Égide ?

    Notre mutuelle est ouverte aux particuliers et aux familles. Le modèle coopératif
    permet à tout nouvel adhérent de devenir sociétaire, participant ainsi à la gouvernance
    de notre société d''assurance mutuelle.


    Est-il possible d''ajouter des membres de sa famille ?

    Oui, vous pouvez inclure vos ayants-droit (conjoint, enfants) lors de la souscription
    ou ultérieurement. Chaque ajout fera l''objet d''une vérification d''identité
    pour garantir la sécurité du contrat.


    Quels sont les documents nécessaires pour souscrire ?

    Pour valider votre adhésion, nous vous demanderons une pièce d''identité valide,
    un relevé d''identité bancaire (RIB) pour les remboursements, ainsi que votre
    attestation de droits à la sécurité sociale. Nous nous engageons à traiter vos
    données avec la plus grande rigueur conformément au Code des assurances.'
  domain: insurance
  product_category: complementaire_sante
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 6f4c0e57-0f3c-5525-94a4-f1edd12e8b33
  title: Complémentaire santé Égide — traiter une demande courante de bout en bout
  body: 'Voici la procédure complète pour demander le remboursement d''un acte de
    soin avec la Complémentaire santé Égide :


    Prérequis : Vous devez posséder la facture acquittée du professionnel de santé
    et le décompte correspondant de la sécurité sociale.


    Étape 1 : Transmettez-nous vos documents. Nous vous demandons de nous fournir
    la facture et le décompte. Attention, pour garantir la validité de vos garanties,
    cette demande doit être effectuée dans les 5 jours ouvrés suivant le soin.


    Étape 2 : Vérification d''identité. Nous procédons à une authentification forte
    pour nous assurer que la demande émane bien du sociétaire ou d''un ayant-droit
    autorisé.


    Étape 3 : Analyse du dossier. Nous vérifions la prise en charge initiale par la
    sécurité sociale et appliquons vos garanties. Par exemple, s''il s''agit d''optique,
    nous vérifions que le forfait de 200 € tous les deux ans n''a pas déjà été consommé.


    Étape 4 : Confirmation et paiement. Nous vous confirmons le montant du remboursement
    par e-mail. Les fonds sont ensuite transférés sur le compte bancaire associé à
    votre contrat.


    L''opération est terminée lorsque vous recevez l''avis de paiement et que la somme
    apparaît sur votre relevé de remboursements.'
  domain: insurance
  product_category: complementaire_sante
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 39f0cddf-36e0-55a4-867b-066821d5de1c
  title: Complémentaire santé Égide — écart avec vos relevés
  body: 'Ce guide aide les gestionnaires à résoudre les situations où un sociétaire
    signale une différence entre le remboursement attendu et le montant reçu.


    Symptôme : Le sociétaire indique que le montant versé ne correspond pas à ses
    attentes ou au tableau des garanties.


    Causes possibles et étapes de diagnostic :

    1. Application d''un plafond : Vérifiez si le sociétaire a atteint un plafond
    spécifique. Par exemple, si le montant dépasse le forfait optique de 200 € tous
    les deux ans, seul le montant du plafond est versé.

    2. Reste à charge 100 % Santé : Vérifiez si le soin était issu du panier 100 %
    Santé. Si le sociétaire a choisi un équipement hors panier, un reste à charge
    est normal après application du forfait.

    3. Erreur de décompte : Vérifiez que le décompte de la sécurité sociale transmis
    est le bon et qu''il n''y a pas d''erreur de saisie sur la part remboursée par
    l''Assurance Maladie.

    4. Forfait journalier : Pour les hospitalisations, vérifiez que l''indemnité de
    23 € par jour a été multipliée par le nombre exact de jours d''hospitalisation.


    Résolution :

    - Si l''écart est dû à une incompréhension des plafonds, expliquez pédagogiquement
    au sociétaire comment le calcul a été effectué.

    - Si une erreur de traitement est avérée, nous procédons immédiatement à un calcul
    rectificatif et au versement du complément.


    Escalade :

    En cas de désaccord persistant sur l''interprétation du contrat, proposez l''escalade
    vers un gestionnaire spécialisé. Si aucune solution n''est trouvée, rappelez au
    sociétaire la possibilité de saisir la Médiation de l''assurance pour un arbitrage
    impartial.'
  domain: insurance
  product_category: complementaire_sante
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: d84cc1ae-c01a-5927-9086-3ab5e80d0b81
  title: Frais et tarifs de l'établissement
  body: "Chez Égide Assurances, nous nous engageons à une transparence totale concernant\
    \ notre structure tarifaire. En tant que société d'assurance mutuelle, notre modèle\
    \ coopératif nous impose de veiller à l'équité entre tous nos sociétaires ainsi\
    \ qu'à la pérennité de notre institution.\n\nNos frais sont conçus pour être justifiés\
    \ et proportionnés. Ils servent principalement à rémunérer la gestion active des\
    \ fonds et à assurer la maintenance d'une infrastructure numérique et physique\
    \ hautement sécurisée. \n\nCertains frais sont appliqués de manière uniforme à\
    \ l'ensemble des comptes pour garantir le fonctionnement courant de la mutuelle.\
    \ D'autres frais, spécifiques à la nature des supports d'investissement ou aux\
    \ garanties choisies, varient selon le produit souscrit. \n\nPour consulter le\
    \ détail précis des frais liés à un contrat spécifique, nous invitons nos sociétaires\
    \ à se référer aux grilles tarifaires dédiées, telles que le document intitulé\
    \ « Contrat d'assurance-vie Égide Multisupport — grille tarifaire » ou « PER individuel\
    \ Égide — grille tarifaire »."
  domain: insurance
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 4b842ed7-8a26-59b9-af2a-5fe4e616f92b
  title: Questions fréquentes
  body: 'Nous avons regroupé ici les réponses aux interrogations les plus courantes
    concernant le fonctionnement global d''Égide Assurances.


    **Comment puis-je contacter Égide Assurances ?**

    Nous vous accompagnons via notre portail client numérique, par email ou par téléphone.
    Nos équipes sont disponibles durant les heures ouvrables (CET).


    **Que se passe-t-il si mon dossier est complexe ou si je ne suis pas satisfait
    d''une réponse ?**

    Nous traitons chaque demande avec soin. Si un dossier présente une complexité
    particulière, nous l''escaladons vers un gestionnaire spécialisé. En dernier recours,
    vous avez la possibilité de solliciter la Médiation de l''assurance pour un règlement
    impartial du litige.


    **Que signifie le terme « sociétaire » ?**

    Contrairement à un client classique, un sociétaire est un membre d''une société
    d''assurance mutuelle. Vous avez ainsi la qualité d''associé et vous participez,
    selon les modalités de notre gouvernance, à la vie de la mutuelle.


    Pour plus de détails sur la gestion de vos contrats, nous vous invitons à consulter
    nos guides de procédures spécifiques.'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 807eb782-de08-5101-a7d5-e5723ab52471
  title: 'Notes réglementaires : assurance'
  body: "Égide Assurances opère dans un cadre réglementaire strict afin de garantir\
    \ la protection de ses sociétaires et l'intégrité du système assurantiel. Nous\
    \ sommes placés sous la surveillance permanente de l'Autorité de contrôle prudentiel\
    \ et de résolution (ACPR) et nous respectons scrupuleusement l'ensemble des dispositions\
    \ du Code des assurances.\n\nL'un des piliers de notre engagement est la sécurisation\
    \ des fonds. À ce titre, nous informons nos sociétaires que pour les contrats\
    \ de personnes, la protection du Fonds de garantie des assurances de personnes\
    \ (FGAP) est appliquée jusqu'à un montant de 70 000 €. Cette garantie est fondamentale\
    \ pour assurer la sérénité de nos assurés face aux risques systémiques.\n\nEn\
    \ tant qu'agents et gestionnaires, nous avons l'obligation stricte de : \n1. Veiller\
    \ à la protection des données personnelles conformément à la réglementation en\
    \ vigueur.\n2. Garantir un traitement équitable et impartial de chaque sociétaire,\
    \ sans aucune discrimination.\n3. Appliquer rigoureusement les procédures de vérification\
    \ d'identité avant toute opération sensible.\n\nNous rappelons également que notre\
    \ mission est l'éducation financière et l'information produit. Nous ne délivrons\
    \ aucun conseil fiscal, juridique ou médical personnalisé. Pour tout besoin spécifique\
    \ dans ces domaines, nous redirigeons systématiquement nos sociétaires vers des\
    \ experts certifiés.\n\nEnfin, nous appliquons une politique de tolérance zéro\
    \ envers la fraude. Tout manquement aux obligations contractuelles, notamment\
    \ le respect des délais légaux de déclaration, peut entraîner la nullité des garanties."
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 6e8816d4-3557-5405-9225-1be48c303a7a
  title: Quand utiliser make_additional_payment
  body: "L'outil make_additional_payment est utilisé pour enregistrer un versement\
    \ libre ou mettre en place des versements programmés sur un contrat d'assurance-vie\
    \ ou un PER. Cette opération permet au sociétaire d'alimenter son épargne selon\
    \ ses besoins.\n\nVoici la procédure rigoureuse que l'agent doit suivre :\n\n\
    1. **Vérification d'identité** : Avant toute action, l'agent doit impérativement\
    \ effectuer une authentification forte et une vérification rigoureuse de l'identité\
    \ du sociétaire via l'outil verify_identity.\n2. **Identification du contrat**\
    \ : L'agent utilise l'outil get_accounts pour identifier le numéro de contrat\
    \ (account_id) correspondant au sociétaire, en s'appuyant sur les informations\
    \ fournies (comme les derniers chiffres du contrat).\n3. **Collecte des informations\
    \ de versement** : L'agent doit confirmer avec le sociétaire :\n    - Le montant\
    \ exact du versement en €.\n    - La nature du versement : s'agit-il d'un versement\
    \ libre unique ou de la mise en place de versements programmés (mensuels, trimestriels,\
    \ etc.) ?\n4. **Exécution** : Une fois les informations validées, l'agent appelle\
    \ l'outil make_additional_payment en renseignant l'identifiant du contrat, le\
    \ montant et la fréquence choisie.\n\nL'agent doit confirmer au sociétaire que\
    \ l'opération a été enregistrée et l'informer des délais de traitement habituels\
    \ liés à la réception des fonds."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_additional_payment
  institution_id: egide_assurances
- id: f8248328-f786-5217-a7ca-1a0b6ca5ec63
  title: Référence de l'outil make_additional_payment
  body: 'L''outil make_additional_payment permet d''effectuer un versement libre ou
    de configurer des versements programmés sur un contrat d''assurance-vie ou un
    PER.


    **L''agent effectue cette action en appelant l''outil directement dans la conversation.**


    **Arguments requis :**

    - **account_id** : L''identifiant unique du contrat, obtenu préalablement via
    l''outil get_accounts.

    - **amount** : Le montant du versement exprimé en €.

    - **frequency** : La périodicité du versement (par exemple : ''unique'' pour un
    versement libre, ou ''mensuel'', ''trimestriel'', ''annuel'' pour des versements
    programmés).


    **Effet :**

    L''outil met à jour le solde du contrat après réception des fonds et, le cas échéant,
    programme les prélèvements futurs selon la fréquence indiquée.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_additional_payment
  institution_id: egide_assurances
- id: ca5c6fc4-ce4c-54e1-9e0a-87602bfe9140
  title: Quand utiliser request_partial_surrender
  body: 'L''outil request_partial_surrender est utilisé lorsqu''un sociétaire souhaite
    effectuer un rachat partiel sur son contrat d''assurance-vie, c''est-à-dire retirer
    une partie des fonds disponibles tout en maintenant le contrat ouvert.


    La procédure suivante doit être appliquée par l''agent :


    1. **Vérification d''identité** : L''agent doit obligatoirement procéder à une
    authentification forte et une vérification rigoureuse de l''identité du demandeur
    via l''outil verify_identity.

    2. **Identification du contrat** : L''agent utilise l''outil get_accounts pour
    récupérer l''identifiant du contrat (account_id) concerné.

    3. **Détermination du montant** : L''agent s''assure du montant exact en € que
    le sociétaire souhaite racheter. Il doit vérifier que le solde disponible est
    suffisant pour couvrir cette demande.

    4. **Exécution de la demande** : L''agent appelle l''outil request_partial_surrender
    en précisant l''identifiant du contrat et le montant du rachat.

    5. **Information sur les délais** : L''agent doit explicitement informer le sociétaire
    que l''assureur versera les sommes demandées dans un délai maximal de deux mois.


    Il est important de rappeler au sociétaire que l''impact fiscal d''un rachat dépend
    de la date de souscription du contrat et des montants déjà retirés, et que nous
    ne fournissons pas de conseil fiscal personnalisé.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_partial_surrender
  institution_id: egide_assurances
- id: 2582d887-bdd5-5ba1-9736-a7a9bab63be5
  title: Référence de l'outil request_partial_surrender
  body: 'L''outil request_partial_surrender permet de déclencher une demande de rachat
    partiel sur un contrat d''assurance-vie.


    **L''agent effectue cette action en appelant l''outil directement dans la conversation.**


    **Arguments requis :**

    - **account_id** : L''identifiant unique du contrat, obtenu via l''outil get_accounts.

    - **amount** : Le montant en € que le sociétaire souhaite retirer du contrat.


    **Effet :**

    L''outil initie la procédure de rachat. Le montant est déduit de la valeur de
    rachat du contrat et versé au sociétaire dans un délai maximal de deux mois.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_partial_surrender
  institution_id: egide_assurances
- id: 060c98ed-1bcb-5a48-aa3f-e70d24bf6dbb
  title: Quand utiliser switch_funds
  body: "L'outil switch_funds est utilisé pour réaliser un arbitrage, c'est-à-dire\
    \ un transfert de valeur entre le fonds en euros (sécurisé) et les unités de compte\
    \ (potentiel de croissance avec risque de perte en capital) au sein d'un contrat\
    \ d'assurance-vie ou d'un PER.\n\nLa procédure à suivre par l'agent est la suivante\
    \ :\n\n1. **Vérification d'identité** : L'agent doit impérativement effectuer\
    \ une authentification forte et une vérification rigoureuse de l'identité du sociétaire\
    \ via l'outil verify_identity.\n2. **Identification du contrat** : L'agent utilise\
    \ l'outil get_accounts pour identifier le numéro de contrat (account_id).\n3.\
    \ **Définition de l'arbitrage** : L'agent doit recueillir les précisions suivantes\
    \ :\n    - Le support source (d'où proviennent les fonds).\n    - Le support de\
    \ destination (vers quoi les fonds sont déplacés).\n    - Le montant en € ou le\
    \ pourcentage du solde à transférer.\n4. **Exécution** : L'agent appelle l'outil\
    \ switch_funds avec les paramètres d'identifiant, de supports et de montant/pourcentage.\n\
    \nL'agent doit rappeler au sociétaire que les unités de compte présentent un risque\
    \ de perte en capital et que nous ne garantissons aucune performance future."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - switch_funds
  institution_id: egide_assurances
- id: b32715cd-f6a4-5905-8a98-65dcb9eed925
  title: Référence de l'outil switch_funds
  body: 'L''outil switch_funds permet de réaliser un arbitrage entre le fonds en euros
    et les unités de compte d''un contrat d''assurance-vie ou d''un PER.


    **L''agent effectue cette action en appelant l''outil directement dans la conversation.**


    **Arguments requis :**

    - **account_id** : L''identifiant unique du contrat, obtenu via l''outil get_accounts.

    - **source_fund** : Le nom ou l''identifiant du support dont les fonds sont retirés.

    - **destination_fund** : Le nom ou l''identifiant du support vers lequel les fonds
    sont transférés.

    - **amount_or_percentage** : La valeur du transfert, exprimée soit en montant
    (€), soit en pourcentage (%).


    **Effet :**

    L''outil procède au transfert de la valeur between les supports choisis, modifiant
    ainsi la répartition des actifs du sociétaire.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - switch_funds
  institution_id: egide_assurances
- id: bce55dcb-3efa-5328-a32f-dafe3434145a
  title: Quand utiliser initiate_plan_transfer
  body: "L'outil initiate_plan_transfer est utilisé pour lancer le transfert vers\
    \ le PER individuel Égide d'un plan d'épargne retraite détenu dans un autre établissement.\
    \ Cela concerne les PER, les anciens PERP ou les contrats Madelin.\n\nLa procédure\
    \ à suivre par l'agent est la suivante :\n\n1. **Vérification d'identité** : L'agent\
    \ doit impérativement effectuer une authentification forte et une vérification\
    \ rigoureuse de l'identité du futur ou actuel sociétaire via l'outil verify_identity.\n\
    2. **Identification ou Création de compte** : \n    - Si le client possède déjà\
    \ un compte chez nous, l'agent utilise get_accounts pour obtenir l'account_id.\n\
    \    - Si le client est nouveau, l'agent doit collecter les informations d'identité\
    \ complètes (nom, date de naissance, coordonnées) pour initier la souscription.\n\
    3. **Collecte des informations du contrat externe** : L'agent doit recueillir\
    \ les détails du contrat à transférer (nom de l'établissement d'origine, numéro\
    \ de contrat, type de plan : PER, PERP ou Madelin).\n4. **Exécution** : L'agent\
    \ appelle l'outil initiate_plan_transfer en fournissant les informations du sociétaire\
    \ et les détails du plan externe.\n\nL'agent doit informer le sociétaire que le\
    \ délai de transfert dépend de l'établissement d'origine et que nous l'accompagnerons\
    \ tout au long du processus de migration de ses actifs."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_plan_transfer
  institution_id: egide_assurances
- id: 4d963fe6-fdf1-55c7-a0b4-0f9246667715
  title: Référence de l'outil initiate_plan_transfer
  body: 'L''outil `initiate_plan_transfer` permet à l''agent de lancer le processus
    de transfert d''un contrat d''épargne retraite externe vers le PER individuel
    Égide. Cet outil est utilisé pour migrer les avoirs d''un PER, d''un ancien PERP
    ou d''un contrat Madelin détenu dans un autre établissement.


    L''agent déclenche cette action en appelant l''outil directement dans la conversation.
    L''outil nécessite les informations suivantes :

    - L''identité complète du sociétaire (nom, prénom, date de naissance).

    - Les coordonnées de l''établissement d''origine.

    - Le numéro du contrat à transférer.

    - Le montant estimé des fonds à transférer.


    L''effet de cet outil est l''initiation d''une demande officielle de transfert
    auprès de l''organisme tiers. Nous nous occupons ensuite de la coordination administrative
    pour garantir l''intégrité des fonds transférés vers le modèle mutuel d''Égide
    Assurances.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_plan_transfer
  institution_id: egide_assurances
- id: 9b29b9eb-6a61-5042-88d7-b03c365cc6f9
  title: Quand utiliser request_early_release
  body: 'Le déblocage anticipé d''un PER individuel Égide est une opération exceptionnelle
    et irréversible, strictement encadrée par la loi. Nous permettons le rachat total
    ou partiel des fonds avant l''âge de la retraite uniquement dans les cas de force
    majeure prévus par le Code des assurances, tels que l''achat de la résidence principale,
    l''expiration des droits au chômage, le surendettement ou un accident de la vie
    (invalidité, décès du conjoint).


    Pour traiter une demande de déblocage, l''agent doit suivre rigoureusement ces
    étapes :


    1. Effectuer une vérification rigoureuse de l''identité du sociétaire via `verify_identity`.

    2. Identifier le contrat concerné en utilisant `get_accounts` à partir des quatre
    derniers chiffres du numéro de contrat.

    3. Demander au sociétaire de préciser le motif légal du déblocage et de fournir
    les justificatifs nécessaires (par email ou portail client).

    4. Vérifier que le motif correspond aux critères légaux de déblocage anticipé.

    5. Une fois la validité du motif confirmée, exécuter l''outil `request_early_release`
    pour initier le versement.


    L''agent doit informer le sociétaire que cette opération est irréversible et peut
    avoir des impacts fiscaux. Nous ne fournissons aucun conseil fiscal personnalisé
    et recommandons au sociétaire de consulter un expert certifié pour évaluer l''impact
    du déblocage sur sa situation fiscale.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_early_release
  institution_id: egide_assurances
- id: 3c59a6d5-5a16-56dc-bebd-2c1dabc04c0f
  title: Référence de l'outil request_early_release
  body: 'L''outil `request_early_release` est utilisé par l''agent pour demander le
    déblocage anticipé des fonds d''un PER individuel Égide dans les cas prévus par
    la loi.


    L''agent effectue cette action en appelant l''outil directement. Les paramètres
    requis sont :

    - L''identité complète du sociétaire (nom, prénom, date de naissance).

    - L''identifiant du contrat PER.

    - Le motif légal du déblocage (ex: achat résidence principale, invalidité).

    - Le montant demandé (total ou partiel).


    L''appel à cet outil déclenche le processus de liquidation anticipée. Une fois
    validée, la somme est versée sur le compte bancaire du sociétaire. Cette opération
    est irréversible et modifie définitivement l''état du contrat.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_early_release
  institution_id: egide_assurances
- id: 89f29a14-8cb2-5afb-93b4-c598595f0332
  title: Quand utiliser request_retirement_payout
  body: 'L''outil `request_retirement_payout` est utilisé lorsque le sociétaire atteint
    l''âge de la retraite et souhaite liquider son PER individuel Égide. Nous proposons
    deux modes de sortie : le versement en capital (en une seule fois ou de manière
    fractionnée) ou la conversion en rente viagère.


    L''agent doit suivre la procédure suivante :


    1. Vérifier l''identité du sociétaire via `verify_identity`.

    2. Utiliser `get_accounts` pour identifier le PER individuel Égide et confirmer
    que le sociétaire a atteint l''âge légal ou effectif de la retraite.

    3. Questionner le sociétaire sur son choix de liquidation : capital ou rente.

    4. Si le capital est choisi, préciser si le versement doit être unique ou fractionné.

    5. Exécuter l''outil `request_retirement_payout` pour formaliser la demande.


    L''agent doit rappeler au sociétaire que nous ne délivrons aucun conseil fiscal
    personnalisé sur le choix entre capital et rente. Nous l''invitons à se rapprocher
    d''un conseiller fiscal pour optimiser sa sortie de fonds. Nous rappelons que
    les fonds sont protégés et gérés selon notre modèle coopératif pour garantir la
    pérennité du plan.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_retirement_payout
  institution_id: egide_assurances
- id: a8024ce4-55a0-558d-9af9-57d33d39bd13
  title: Référence de l'outil request_retirement_payout
  body: 'L''outil `request_retirement_payout` permet à l''agent de demander la liquidation
    d''un PER individuel Égide au moment du départ à la retraite.


    L''agent appelle l''outil directement avec les paramètres suivants :

    - L''identité complète du sociétaire (nom, prénom, date de naissance).

    - L''identifiant du contrat PER.

    - Le mode de liquidation choisi : « capital » ou « rente viagère ».

    - Si capital, la fréquence de versement (une fois ou plusieurs fois).


    L''exécution de cet outil lance le processus de paiement final. Comme toute opération
    de retrait, elle est irréversible. Le versement s''effectue selon les délais de
    traitement standards d''Égide Assurances.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_retirement_payout
  institution_id: egide_assurances
- id: 1042b210-c1bf-5497-9c15-4d7f71ffb26e
  title: Quand utiliser send_insurance_certificate
  body: 'Nous fournissons régulièrement des attestations d''assurance à nos sociétaires,
    notamment pour justifier de leur couverture auprès d''un bailleur, d''un employeur
    ou d''une autorité administrative. Ce service s''applique aux contrats d''Assurance
    habitation Égide et d''Assurance auto Égide.


    L''agent doit procéder comme suit :


    1. Vérifier l''identité du sociétaire via `verify_identity`.

    2. Utiliser `get_accounts` pour identifier le contrat d''assurance concerné.

    3. Confirmer avec le sociétaire le type de produit pour lequel l''attestation
    est requise (habitation ou auto).

    4. Préciser le mode de réception souhaité (email ou portail client).

    5. Appeler l''outil `send_insurance_certificate` pour déclencher l''envoi immédiat
    du document.


    L''attestation générée confirme la validité des garanties à la date du jour. S''il
    s''agit d''une attestation pour un nouveau contrat, l''agent doit s''assurer que
    le contrat est bien actif avant l''envoi.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_insurance_certificate
  institution_id: egide_assurances
- id: 21551d4b-2efd-53a5-99af-f4b1dd97bba3
  title: Référence de l'outil send_insurance_certificate
  body: 'L''outil `send_insurance_certificate` permet à l''agent d''envoyer une attestation
    d''assurance officielle au sociétaire.


    L''agent déclenche l''action en appelant l''outil avec les arguments suivants
    :

    - L''identité complète du sociétaire (nom, prénom, date de naissance).

    - L''identifiant du contrat (Assurance habitation Égide ou Assurance auto Égide).

    - Le canal d''envoi (email ou portail numérique).


    L''outil génère un document PDF certifié et l''achemine vers le canal choisi.
    Il s''agit d''une opération de lecture seule sans modification de l''état du contrat.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_insurance_certificate
  institution_id: egide_assurances
- id: c35664e5-ceed-5cef-91a4-e61724862ea2
  title: Quand utiliser request_health_reimbursement
  body: 'Bien que nous privilégions le dispositif du Tiers Payant pour éviter aux
    sociétaires d''avancer les frais, il arrive que ce dernier ne soit pas appliqué,
    notamment pour certains actes d''optique, de dentisterie ou d''audioprothèse.
    Dans ce cas, le sociétaire de la Complémentaire santé Égide doit demander un remboursement.


    L''agent doit suivre ces étapes :


    1. Vérifier l''identité du sociétaire via `verify_identity`.

    2. Utiliser `get_accounts` pour confirmer l''adhésion à la Complémentaire santé
    Égide.

    3. Demander au sociétaire de transmettre la facture acquittée et le décompte de
    la Sécurité sociale via le portail client ou par email.

    4. Collecter les informations essentielles : nature du soin, date de l''acte,
    montant total et montant remboursé par la Sécurité sociale.

    5. Exécuter l''outil `request_health_reimbursement` pour soumettre la demande
    au service de gestion.


    L''agent doit rappeler que nous traitons les demandes avec impartialité et transparence.
    Pour toute question sur les paniers 100 % Santé, l''agent peut orienter le sociétaire
    vers la documentation produit correspondante.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_health_reimbursement
  institution_id: egide_assurances
- id: 4fde710a-ca17-5814-b3d0-4f5b7b0ebcdb
  title: Référence de l'outil request_health_reimbursement
  body: 'L''outil `request_health_reimbursement` permet à l''agent de transmettre
    une demande de remboursement de frais de santé pour un contrat Complémentaire
    santé Égide.


    L''agent appelle l''outil directement avec les paramètres suivants :

    - L''identité complète du sociétaire (nom, prénom, date de naissance).

    - L''identifiant du contrat de santé.

    - Le type de soin (ex: optique, dentaire).

    - Le montant total de la facture.

    - La référence du document justificatif téléchargé sur le portail.


    L''outil crée un dossier de remboursement qui sera analysé par un gestionnaire
    spécialisé. Le remboursement est effectué sur le compte bancaire associé au contrat
    après validation.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_health_reimbursement
  institution_id: egide_assurances
- id: 491025c0-544c-52c4-b3b0-5dbc0c9be627
  title: Quand utiliser open_account
  body: 'L''ouverture d''un nouveau contrat est l''étape initiale pour devenir sociétaire
    d''Égide Assurances. Nous proposons cinq solutions de protection et d''épargne
    : le Contrat d''assurance-vie Égide Multisupport, le PER individuel Égide, l''Assurance
    habitation Égide, l''Assurance auto Égide et la Complémentaire santé Égide.


    L''agent doit suivre la procédure d''onboarding suivante :


    1. Vérifier l''identité du futur sociétaire via `verify_identity` (ou collecter
    les pièces d''identité pour un nouveau client).

    2. Analyser les besoins du client pour l''orienter vers le produit le plus adapté.

    3. Collecter l''ensemble des informations requises selon le produit (ex: relevé
    d''information pour l''auto, situation résidentielle pour l''habitation, profil
    d''investissement pour l''assurance-vie ou le PER).

    4. Expliquer la structure tarifaire transparente et le modèle coopératif d''Égide
    Assurances.

    5. Pour les contrats de personnes (assurance-vie, PER), mentionner explicitement
    que les fonds sont protégés par le FGAP jusqu''à 70 000 €.

    6. Exécuter l''outil `open_account` en spécifiant le produit choisi et les détails
    du contrat.


    L''agent doit s''assurer que le sociétaire a bien compris que nous fournissons
    une éducation financière générale et que nous ne garantissons aucune performance
    sur les unités de compte. L''ouverture est définitive une fois le premier versement
    ou la première cotisation validée.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: egide_assurances
- id: 2848db16-d7ee-559f-a8c9-b2c58432ad41
  title: Référence de l'outil open_account
  body: 'L''outil `open_account` permet à l''agent de souscrire un nouveau contrat
    pour le sociétaire directement au cours de la conversation. Cet outil est l''unique
    mécanisme pour formaliser l''ouverture d''un compte sans redirection vers un formulaire
    externe.


    **Signature de l''outil :**

    `open_account(product_id, personal_details)`


    **Arguments :**

    - `product_id` : L''identifiant unique du produit choisi (par exemple, `assurance_vie_multisupport`,
    `per_individuel`, `assurance_habitation`, `assurance_auto` ou `complementaire_sante`).

    - `personal_details` : Les informations d''identité complètes fournies par le
    client (nom complet, date de naissance, coordonnées de contact).


    **Effet :**

    L''appel à cet outil initie la création du contrat dans notre système de gestion,
    enregistre le nouveau sociétaire et génère les documents contractuels initiaux.
    L''agent effectue cette action en appelant l''outil directement une fois que le
    choix du produit et les informations d''identité ont été confirmés par le sociétaire.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: egide_assurances
- id: c0f1d573-de96-5629-8151-c3300f97bb26
  title: Quand utiliser update_beneficiary
  body: 'La modification de la clause bénéficiaire est un acte juridique important
    qui impacte la transmission du capital. Nous permettons aux sociétaires de mettre
    à jour ces informations pour le Contrat d''assurance-vie Égide Multisupport et
    le PER individuel Égide afin que leurs dispositions reflètent toujours leur situation
    familiale et personnelle.


    L''agent doit suivre rigoureusement la procédure suivante pour garantir la sécurité
    du contrat et la validité juridique de la modification :


    1. **Vérification de l''identité** : L''agent doit impérativement effectuer une
    authentification forte du sociétaire. Conformément à notre politique de sécurité,
    aucune modification de bénéficiaire ne peut être initiée sans une vérification
    rigoureuse de l''identité.

    2. **Identification du contrat** : L''agent utilise l''outil `get_accounts` pour
    identifier le ou les contrats concernés (assurance-vie ou PER) et obtenir l''identifiant
    unique du compte (`account_id`) à partir des informations fournies par le client.

    3. **Collecte des informations** : L''agent demande au sociétaire les détails
    précis du ou des nouveaux bénéficiaires (nom complet, date de naissance, lien
    de parenté ou qualité du bénéficiaire, et quote-part du capital allouée).

    4. **Exécution de la modification** : Une fois les informations validées, l''agent
    appelle l''outil `update_beneficiary` en transmettant l''identifiant du contrat
    et les nouveaux détails du bénéficiaire.


    L''agent doit rappeler au sociétaire que nous fournissons des informations sur
    nos produits, mais que nous ne délivrons aucun conseil juridique personnalisé.
    Pour toute rédaction complexe de clause bénéficiaire ou pour des besoins de planification
    successorale spécifiques, nous invitons systématiquement nos sociétaires à se
    rapprocher d''un notaire ou d''un expert certifié.


    L''action est considérée comme finalisée dès que l''outil confirme la mise à jour
    du dossier.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: egide_assurances
- id: e897d6c8-cb19-519b-aaa8-bdd40b04099f
  title: Référence de l'outil update_beneficiary
  body: 'L''outil `update_beneficiary` permet à l''agent de modifier la clause bénéficiaire
    d''un contrat d''assurance-vie ou d''un PER. L''agent effectue cette action en
    appelant l''outil directement dans la conversation après vérification de l''identité
    du sociétaire.


    **Signature de l''outil :**

    `update_beneficiary(account_id, beneficiary_details)`


    **Arguments :**

    - `account_id` : L''identifiant unique du contrat à modifier, obtenu préalablement
    via l''outil `get_accounts`.

    - `beneficiary_details` : Les informations complètes du ou des nouveaux bénéficiaires
    (nom, prénom, date de naissance et part d''attribution).


    **Effet :**

    L''outil met à jour la clause bénéficiaire dans le dossier du sociétaire. Cette
    modification est enregistrée avec un horodatage précis pour garantir l''intégrité
    juridique du contrat.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: egide_assurances
- id: ca3ee72b-cb88-5022-873d-63058e9dc129
  title: Quand utiliser file_claim
  body: 'La déclaration de sinistre est une étape critique pour garantir l''indemnisation
    de nos sociétaires. Nous traitons les réclamations pour l''Assurance habitation
    Égide et l''Assurance auto Égide avec impartialité et rigueur.


    **Règle fondamentale de délai** : Nous appliquons strictement les délais légaux
    de déclaration. Pour tout sinistre, le sociétaire dispose d''un délai de 5 jours
    ouvrés pour nous informer. Le non-respect de ce délai peut entraîner la déchéance
    des garanties.


    L''agent doit suivre les étapes suivantes pour enregistrer un sinistre :


    1. **Vérification de l''identité** : Procéder à l''authentification forte du sociétaire
    pour sécuriser l''accès au contrat.

    2. **Identification du contrat** : Utiliser l''outil `get_accounts` pour récupérer
    l''identifiant du contrat (`account_id`) lié au véhicule ou au logement concerné.

    3. **Recueil des faits** : Collecter les informations essentielles : la date et
    l''heure du sinistre, la nature des dommages (vol, bris de glace, dégât des eaux,
    accident), et les circonstances précises.

    4. **Enregistrement du sinistre** : Appeler l''outil `file_claim` en transmettant
    l''identifiant du contrat et les détails du sinistre.


    Après l''exécution de l''outil, l''agent doit informer le sociétaire que son dossier
    est en cours de traitement et qu''il pourra suivre l''avancement de son indemnisation
    via son portail client numérique ou en contactant nos services. Si le dossier
    présente une complexité particulière, l''agent doit l''escalader vers un gestionnaire
    spécialisé.


    Il est rappelé que l''indemnisation finale tiendra compte de la franchise applicable
    au contrat, montant qui reste à la charge du sociétaire après l''intervention
    de l''assurance.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: egide_assurances
- id: fe34a7a2-50cc-585a-87b9-4429e0eedd2f
  title: Référence de l'outil file_claim
  body: 'L''outil `file_claim` permet à l''agent de déclarer un sinistre (dégât des
    eaux, vol, bris de glace, accident de la circulation) pour un contrat d''assurance
    habitation ou auto. L''agent appelle l''outil directement pour enregistrer l''événement
    dans le système.


    **Signature de l''outil :**

    `file_claim(account_id, claim_details)`


    **Arguments :**

    - `account_id` : L''identifiant unique du contrat d''assurance habitation ou auto
    concerné.

    - `claim_details` : Les informations relatives au sinistre (date, type de sinistre,
    description des dommages et circonstances).


    **Effet :**

    L''outil crée un dossier de sinistre ouvert, déclenche le processus d''indemnisation
    et notifie les services de gestion. Le dossier est ainsi horodaté pour vérifier
    le respect du délai de déclaration de 5 jours ouvrés.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: egide_assurances
- id: cd02d156-433d-5847-9649-822dbd723634
  title: Quand utiliser update_policy
  body: 'L''évolution de la vie de nos sociétaires nécessite parfois des ajustements
    de leurs garanties. Nous utilisons l''avenant pour modifier un contrat existant
    afin qu''il reste parfaitement adapté aux besoins du sociétaire.


    L''outil `update_policy` doit être utilisé dans les cas suivants :

    - **Assurance habitation Égide** : Changement d''adresse suite à un déménagement,
    modification de la surface du logement ou ajout d''options de garantie.

    - **Assurance auto Égide** : Changement de véhicule, modification du conducteur
    principal ou ajout d''un conducteur secondaire.

    - **Complémentaire santé Égide** : Passage à une formule de couverture supérieure
    ou modification des options de santé.


    L''agent doit suivre scrupuleusement ce processus :


    1. **Vérification de l''identité** : Effectuer l''authentification forte du sociétaire.

    2. **Identification du contrat** : Utiliser l''outil `get_accounts` pour localiser
    le contrat à modifier et obtenir son `account_id`.

    3. **Détermination des modifications** : Recueillir précisément les changements
    souhaités (ex: nouvelle immatriculation, nouvelle adresse, nouvelle formule santé).

    4. **Application de l''avenant** : Appeler l''outil `update_policy` en spécifiant
    l''identifiant du compte et les détails de la modification.


    L''agent doit informer le sociétaire que toute modification peut entraîner un
    ajustement de la prime d''assurance, calculé selon nos principes de transparence
    et d''équité. Les nouveaux documents contractuels et l''avenant sont envoyés par
    email ou mis à disposition sur le portail client numérique.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: egide_assurances
- id: 2b6472c9-0610-5079-ba10-2529439c5716
  title: Référence de l'outil update_policy
  body: 'L''outil `update_policy` permet à l''agent de modifier un contrat par avenant.
    L''agent effectue cette action en appelant l''outil directement dans la conversation
    après vérification de l''identité du sociétaire.


    **Signature de l''outil :**

    `update_policy(account_id, update_details)`


    **Arguments :**

    - `account_id` : L''identifiant unique du contrat à modifier (habitation, auto
    ou santé).

    - `update_details` : La description précise des changements à apporter au contrat
    (ex: changement d''adresse, nouveau véhicule, changement de formule).


    **Effet :**

    L''outil génère un avenant au contrat, met à jour les informations dans la base
    de données et recalcule, le cas échéant, la cotisation du sociétaire. La modification
    est effective immédiatement ou à la date spécifiée dans les détails de la mise
    à jour.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: egide_assurances
- id: 65ac108a-dfaa-5984-bc7b-f36bd8d8d265
  title: Quand utiliser close_account
  body: ' la résiliation d''un contrat ou le rachat total d''un produit d''épargne
    est une opération irréversible qui demande une attention particulière. Nous accompagnons
    nos sociétaires dans ces démarches avec transparence.


    L''outil `close_account` est utilisé dans les scénarios suivants :

    - **Assurance habitation, auto ou complémentaire santé** : Résiliation définitive
    du contrat. Pour l''Assurance habitation Égide, nous rappelons qu''une résiliation
    simplifiée est possible après un an de contrat.

    - **Contrat d''assurance-vie Égide Multisupport ou PER individuel Égide** : Demande
    de rachat total, entraînant la clôture du contrat et le versement des fonds.


    L''agent doit impérativement suivre ces étapes :


    1. **Vérification de l''identité** : Procéder à une authentification forte et
    une vérification rigoureuse de l''identité. Cette étape est obligatoire avant
    toute action modifiant l''état d''un contrat ou entraînant un transfert de fonds.

    2. **Identification du compte** : Utiliser l''outil `get_accounts` pour identifier
    le contrat exact à clôturer et obtenir son `account_id`.

    3. **Confirmation et avertissement** : Confirmer avec le sociétaire le caractère
    irréversible de l''opération. Pour les contrats d''épargne, préciser que le rachat
    total met fin aux avantages fiscaux et aux garanties du contrat.

    4. **Exécution de la clôture** : Appeler l''outil `close_account` en transmettant
    l''identifiant du compte.


    L''agent doit informer le sociétaire des délais de traitement et des modalités
    de versement des fonds, le cas échéant. En cas de litige sur la résiliation, le
    dossier peut être escaladé vers la Médiation de l''assurance en dernier recours.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: egide_assurances
- id: c27d431b-0c37-5f5e-bf5e-91e65c59af30
  title: Référence de l'outil close_account
  body: 'L''outil `close_account` permet à l''agent de résilier un contrat d''assurance
    (habitation, auto, santé) ou de demander le rachat total d''un contrat d''épargne
    (assurance-vie, PER). L''agent appelle l''outil directement après une vérification
    rigoureuse de l''identité.


    **Signature de l''outil :**

    `close_account(account_id)`


    **Arguments :**

    - `account_id` : L''identifiant unique du contrat à clôturer ou à racheter totalement.


    **Effet :**

    L''outil marque le contrat comme résilié ou clôturé dans le système. Pour les
    contrats d''épargne, il déclenche le processus de liquidation et de transfert
    des fonds vers le compte bancaire du sociétaire. Cette action est irréversible.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: egide_assurances
- id: 960e874d-491c-535a-8b9c-3131ceb845f8
  title: Quand utiliser get_accounts
  body: "L'outil `get_accounts` est le point d'entrée indispensable pour toute opération\
    \ sur un contrat existant. Comme nous gérons souvent plusieurs contrats pour un\
    \ même sociétaire (par exemple, une assurance auto et une complémentaire santé),\
    \ il est crucial d'identifier avec précision le compte concerné avant toute action.\n\
    \nL'agent doit utiliser cet outil dès que le sociétaire souhaite effectuer une\
    \ modification, déclarer un sinistre, ou consulter l'état de ses contrats, et\
    \ que l'identifiant unique du compte (`account_id`) n'est pas encore connu de\
    \ l'agent.\n\nLa procédure est la suivante :\n\n1. **Vérification de l'identité**\
    \ : Avant d'appeler `get_accounts`, l'agent doit avoir validé l'identité du sociétaire\
    \ via l'authentification forte. L'accès aux informations de compte est strictement\
    \ protégé.\n2. **Appel de l'outil** : L'agent appelle l'outil `get_accounts` sans\
    \ arguments supplémentaires pour récupérer la liste de tous les contrats liés\
    \ au sociétaire authentifié.\n3. **Résolution de l'identifiant** : L'agent présente\
    \ la liste des contrats au sociétaire (ou utilise les derniers chiffres du numéro\
    \ de contrat fournis par le client) pour isoler le bon `account_id`.\n\nUne fois\
    \ l'identifiant récupéré, l'agent peut alors procéder à l'utilisation d'autres\
    \ outils spécialisés tels que `update_policy`, `file_claim` ou `close_account`.\
    \ \n\nL'utilisation systématique de `get_accounts` garantit que l'action est appliquée\
    \ au bon contrat, évitant ainsi toute erreur administrative et respectant notre\
    \ engagement de traitement équitable et sécurisé des dossiers de nos sociétaires."
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: egide_assurances
- id: 181d57c8-5f8c-52e2-9346-59fe7a833941
  title: Référence de l'outil get_accounts
  body: 'L''outil `get_accounts` permet à l''agent de récupérer l''intégralité des
    contrats et comptes détenus par un sociétaire au sein d''Égide Assurances. Cet
    outil est indispensable pour identifier précisément les contrats actifs et obtenir
    les identifiants de compte (`account_id`) nécessaires à l''exécution de toute
    autre opération administrative ou financière.


    L''agent effectue cette action en appelant l''outil directement dans l''interface
    de gestion, sans demander au sociétaire de fournir lui-même ses numéros de contrat
    complexes.


    **Signature et arguments :**

    - `last_four_digits` : Les quatre derniers chiffres d''un numéro de contrat ou
    d''un identifiant client fournis par le sociétaire pour initier la recherche.


    **Effet :**

    L''outil retourne une liste détaillée des contrats associés au profil, incluant
    le type de produit (par exemple, assurance-vie ou auto), le statut du contrat
    et l''identifiant unique `account_id`.


    L''accès aux données via cet outil est strictement encadré par notre politique
    de protection des données et nécessite que l''identité du sociétaire ait été préalablement
    vérifiée.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: egide_assurances
- id: d213853a-0cad-51a9-a04c-cb5e0422e9e3
  title: Quand utiliser update_contact_info
  body: 'Afin de garantir la fluidité de nos échanges et la réception sécurisée de
    vos documents, nous devons maintenir vos coordonnées à jour. L''outil `update_contact_info`
    est utilisé dès qu''un sociétaire signale un changement d''adresse postale, de
    numéro de téléphone ou d''adresse email.


    Une mise à jour rigoureuse est essentielle pour le respect du Code des assurances
    et pour assurer que les communications légales parviennent au bon destinataire.


    **Procédure d''exécution pour l''agent :**


    1. **Vérification de l''identité** : Avant toute modification, l''agent doit impérativement
    procéder à une authentification forte du sociétaire, conformément à nos protocoles
    de sécurité.

    2. **Identification du compte** : L''agent demande les quatre derniers chiffres
    d''un contrat et utilise l''outil `get_accounts` pour récupérer l''identifiant
    technique (`account_id`) du compte concerné.

    3. **Collecte des informations** : L''agent demande au sociétaire les nouvelles
    coordonnées exactes (nom de la rue, code postal, ville, numéro de téléphone ou
    email).

    4. **Mise à jour des données** : L''agent appelle l''outil `update_contact_info`
    en renseignant l'' `account_id` et les nouveaux champs de contact à modifier.

    5. **Confirmation** : L''agent confirme au sociétaire que la modification a été
    enregistrée et précise que les prochains documents seront envoyés aux nouvelles
    coordonnées.


    L''agent ne doit jamais rediriger le sociétaire vers le portail numérique si celui-ci
    a explicitement demandé la modification durant l''appel ou l''échange email ;
    l''action doit être finalisée directement par l''agent via l''outil.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: egide_assurances
- id: a3eb5c7a-11c5-5765-a096-684cd97ef253
  title: Référence de l'outil update_contact_info
  body: 'L''outil `update_contact_info` permet à l''agent de modifier les informations
    de contact d''un sociétaire pour un contrat spécifique. L''agent réalise cette
    action en appelant l''outil directement, garantissant ainsi une prise en charge
    immédiate de la demande.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du contrat, obtenu préalablement via l''outil
    `get_accounts`.

    - `new_email` : La nouvelle adresse électronique du sociétaire (optionnel).

    - `new_phone` : Le nouveau numéro de téléphone (optionnel).

    - `new_address` : La nouvelle adresse postale complète (optionnel).


    **Effet :**

    L''outil met à jour la base de données d''Égide Assurances. Une fois l''appel
    réussi, les nouvelles coordonnées deviennent effectives pour tous les futurs envois
    de documents et notifications liés à ce contrat.


    L''utilisation de cet outil requiert une vérification d''identité préalable et
    rigoureuse, car la modification des coordonnées de contact est une étape critique
    pour la sécurité et la confidentialité des échanges avec nos sociétaires.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: egide_assurances
- id: afaf4c03-0140-5f70-8ff6-da19fcdf8a28
  title: Quand utiliser get_statements
  body: 'Nous nous engageons à une transparence totale sur la gestion des fonds et
    des garanties de nos sociétaires. L''outil `get_statements` est utilisé lorsque
    un sociétaire souhaite obtenir un relevé de situation, un historique de versements
    ou un document récapitulatif annuel pour l''un de ses contrats.


    Cette demande est fréquente pour les contrats d''épargne comme le Contrat d''assurance-vie
    Égide Multisupport ou le PER individuel Égide, notamment pour le suivi des performances
    ou les déclarations fiscales.


    **Procédure d''exécution pour l''agent :**


    1. **Vérification de l''identité** : L''agent doit s''assurer de l''identité du
    demandeur via une authentification forte avant tout accès aux documents financiers.

    2. **Identification du contrat** : L''agent utilise l''outil `get_accounts` pour
    identifier le contrat concerné et obtenir l'' `account_id` correspondant.

    3. **Précision de la période** : L''agent demande au sociétaire la période concernée
    (par exemple, l''année civile 2024 ou le trimestre dernier).

    4. **Extraction du document** : L''agent appelle l''outil `get_statements` en
    précisant l'' `account_id` et la plage temporelle souhaitée.

    5. **Transmission** : L''agent informe le sociétaire que le relevé est disponible
    ou l''envoie selon le canal de communication utilisé.


    L''agent doit rappeler que ces documents sont également accessibles en toute autonomie
    via le portail client numérique, tout en finalisant la demande actuelle via l''outil
    pour un service premium et rassurant.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: egide_assurances
- id: b1ff65c0-cb76-596f-9208-d5dab45b5692
  title: Référence de l'outil get_statements
  body: 'L''outil `get_statements` permet à l''agent de générer et de récupérer les
    relevés de compte et les documents de synthèse pour un contrat donné. L''agent
    effectue cette opération en appelant l''outil directement dans le système de gestion.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du contrat, récupéré via l''outil `get_accounts`.

    - `statement_type` : Le type de relevé souhaité (par exemple : annuel, trimestriel,
    ou situation ponctuelle).

    - `period` : La date ou la plage de dates correspondant à la période du relevé.


    **Effet :**

    L''outil extrait le document correspondant depuis les archives sécurisées d''Égide
    Assurances. Le résultat est un fichier ou un flux de données contenant le détail
    des opérations, les intérêts acquis ou le montant des cotisations versées.


    L''accès aux relevés est soumis à une vérification d''identité obligatoire pour
    protéger les données financières et personnelles du sociétaire.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: egide_assurances
- id: bc4f366f-8236-5fcc-af8b-4ea68133a233
  title: Quand utiliser set_alerts
  body: 'Pour accompagner nos sociétaires dans la gestion active de leurs contrats,
    nous proposons un système de notifications personnalisées. L''outil `set_alerts`
    est utilisé lorsqu''un sociétaire souhaite être alerté de certains événements
    (par exemple, la réception d''un nouveau relevé, un mouvement de fonds sur son
    Contrat d''assurance-vie Égide Multisupport, ou l''échéance d''une cotisation).


    Ce service renforce la transparence et la réactivité de notre modèle coopératif.


    **Procédure d''exécution pour l''agent :**


    1. **Vérification de l''identité** : L''agent procède à l''authentification forte
    du sociétaire.

    2. **Identification du contrat** : L''agent utilise l''outil `get_accounts` pour
    obtenir l'' `account_id` du contrat pour lequel les alertes doivent être configurées.

    3. **Définition des préférences** : L''agent demande au sociétaire le type d''alerte
    souhaité et la fréquence de notification (immédiate, hebdomadaire ou mensuelle).

    4. **Configuration** : L''agent appelle l''outil `set_alerts` en renseignant l''
    `account_id`, le type d''alerte et la fréquence choisie.

    5. **Confirmation** : L''agent confirme la mise en place des alertes et précise
    le canal de réception (email ou notification portail).


    L''agent doit s''assurer que les coordonnées de contact sont à jour avant de configurer
    les alertes, en utilisant si nécessaire l''outil `update_contact_info`.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: egide_assurances
- id: 6c0c2c3d-4b6b-5b1f-893e-a584652e8444
  title: Référence de l'outil set_alerts
  body: 'L''outil `set_alerts` permet à l''agent de configurer des notifications automatiques
    pour le compte d''un sociétaire. L''agent réalise cette action en appelant l''outil
    directement.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du contrat, obtenu via l''outil `get_accounts`.

    - `alert_type` : La nature de l''événement déclenchant l''alerte (ex: mouvement
    de fonds, document disponible, échéance).

    - `frequency` : La périodicité ou le mode de déclenchement de la notification.


    **Effet :**

    L''outil active le paramétrage des alertes dans le système de notification d''Égide
    Assurances. Le sociétaire recevra désormais des avis automatisés selon les critères
    définis.


    Comme pour toute action modifiant l''état d''un contrat ou ses options, une authentification
    forte et une vérification rigoureuse de l''identité du sociétaire sont obligatoires
    avant l''appel de cet outil.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: egide_assurances
- id: fd64cf72-dfa6-5726-9cbc-b535aba121d7
  title: Quand utiliser get_claim_status
  body: 'La gestion rapide des sinistres est l''un des piliers de la confiance que
    nous accordons à nos sociétaires, notamment pour l''Assurance auto Égide et l''Assurance
    habitation Égide. L''outil `get_claim_status` est utilisé lorsqu''un sociétaire
    souhaite connaître l''état d''avancement de son dossier d''indemnisation après
    avoir déclaré un sinistre.


    Nous traitons toutes les réclamations avec impartialité et nous appliquons strictement
    les délais légaux, notamment le délai de déclaration de 5 jours ouvrés pour garantir
    la validité des garanties.


    **Procédure d''exécution pour l''agent :**


    1. **Vérification de l''identité** : L''agent effectue une authentification forte
    du sociétaire.

    2. **Identification du sinistre** : L''agent demande le numéro de dossier de sinistre.
    S''il n''est pas disponible, l''agent utilise `get_accounts` pour identifier le
    contrat et rechercher les sinistres ouverts associés.

    3. **Consultation du statut** : L''agent appelle l''outil `get_claim_status` en
    utilisant l''identifiant du sinistre ou l'' `account_id`.

    4. **Explication pédagogique** : L''agent communique l''état actuel (ex: en cours
    d''instruction, expertise programmée, indemnisation validée) et explique les étapes
    restantes de manière rassurante.

    5. **Escalade si nécessaire** : Si le dossier est complexe ou fait l''objet d''un
    litige, l''agent informe le sociétaire que le dossier sera escaladé vers un gestionnaire
    spécialisé ou, en dernier recours, vers la Médiation de l''assurance.


    L''agent doit rester impartial et factuel, en s''appuyant uniquement sur les données
    retournées par l''outil.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: egide_assurances
- id: 15471fcf-0e26-52e0-a270-91f167520f13
  title: Référence de l'outil get_claim_status
  body: 'L''outil `get_claim_status` permet à l''agent de consulter en temps réel
    l''état d''avancement d''une déclaration de sinistre. L''agent effectue cette
    action en appelant l''outil directement.


    **Signature et arguments :**

    - `claim_id` : L''identifiant unique du sinistre déclaré (si connu).

    - `account_id` : L''identifiant du contrat associé, permettant de lister les sinistres
    en cours si le `claim_id` est manquant.


    **Effet :**

    L''outil interroge le système de gestion des sinistres et retourne le statut actuel
    du dossier, la date de la dernière mise à jour, et éventuellement le montant de
    l''indemnisation provisionnée ou validée.


    L''utilisation de cet outil requiert une vérification d''identité préalable. L''agent
    doit utiliser les informations retournées pour informer le sociétaire avec précision
    et pédagogie, sans jamais garantir un délai de règlement si celui-ci n''est pas
    explicitement confirmé par l''outil.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: egide_assurances
