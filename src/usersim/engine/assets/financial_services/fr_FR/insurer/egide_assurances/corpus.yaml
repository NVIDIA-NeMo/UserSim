- id: 2cc54bd6-1892-5a5b-bc5e-0f29cae1ab68
  title: Contrat d'assurance-vie Égide Multisupport — présentation
  body: "Le Contrat d'assurance-vie Égide Multisupport est une solution d'épargne\
    \ flexible conçue pour accompagner les particuliers et les familles dans la constitution\
    \ d'un patrimoine. En tant que société d'assurance mutuelle, nous privilégions\
    \ un modèle coopératif où vous devenez sociétaire, faisant de nous un partenaire\
    \ de confiance pour votre avenir financier.\n\nCe contrat se distingue par sa\
    \ structure hybride, vous permettant d'arbitrer vos avoirs entre deux types de\
    \ supports :\n\n1. Le fonds en euros : Il offre une sécurité optimale pour votre\
    \ capital et propose un rendement stable. Pour l'année 2025, le taux servi est\
    \ de 2,6 %.\n2. Les unités de compte : Elles permettent de viser un potentiel\
    \ de croissance plus élevé en investissant sur les marchés financiers. Veuillez\
    \ noter que les unités de compte présentent un risque de perte en capital.\n\n\
    Afin de garantir l'équité entre tous nos sociétaires et la pérennité de notre\
    \ modèle mutuel, nous appliquons une structure tarifaire transparente :\n- Frais\
    \ d'entrée : 1 % sur chaque versement.\n- Frais de gestion du fonds en euros :\
    \ 0,6 % par an.\n- Frais de gestion des unités de compte : 0,85 % par an.\n\n\
    Pour souscrire à ce contrat, un versement initial minimum de 500 € est requis.\
    \ \n\nNous vous rappelons que nous fournissons une éducation financière générale\
    \ et des informations sur nos produits, mais que nous ne délivrons aucun conseil\
    \ fiscal, juridique ou médical personnalisé. Pour ces besoins, nous vous invitons\
    \ à consulter des experts certifiés.\n\nPour plus de détails sur les modalités\
    \ de mise en place, nous vous invitons à consulter le document Contrat d'assurance-vie\
    \ Égide Multisupport — souscrire et activer."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ff2a09c3-1564-5002-9e91-1eacbe927617
  title: 'Contrat d''assurance-vie Égide Multisupport — taux servi en 2025 sur le
    fonds en euros : explications'
  body: "Question : Quel est le taux appliqué au fonds en euros pour l'année 2025\
    \ et comment est-il déterminé ?\n\nRéponse : Pour l'année 2025, le taux servi\
    \ sur le fonds en euros du Contrat d'assurance-vie Égide Multisupport est de 2,6\
    \ %. Ce taux est déterminé par la performance globale des actifs sécurisés gérés\
    \ par notre mutuelle, après déduction des frais de gestion de 0,6 %. \n\nCe rendement\
    \ est crédité annuellement sur votre contrat. Contrairement aux unités de compte,\
    \ ce taux s'applique à une partie de votre épargne dont le capital est garanti,\
    \ vous offrant ainsi une base de sérénité pour vos projets. \n\nPour comprendre\
    \ la structure globale de nos rémunérations, vous pouvez vous référer à la grille\
    \ Contrat d'assurance-vie Égide Multisupport — grille des taux."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 9456f80b-8a89-523e-8605-3937390742c8
  title: Contrat d'assurance-vie Égide Multisupport — souscrire et activer
  body: 'L''ouverture de votre Contrat d''assurance-vie Égide Multisupport est une
    démarche simplifiée que nous accompagnons étape par étape. Voici la procédure
    à suivre pour activer votre contrat :


    1. Transmission des pièces justificatives : Veuillez nous fournir une copie de
    votre pièce d''identité en cours de validité ainsi qu''un justificatif de domicile
    récent. Nous procédons alors à une vérification rigoureuse de votre identité,
    conformément à nos obligations de sécurité.


    2. Définition de la clause bénéficiaire : Indiquez-nous précisément les personnes
    ou entités qui seront bénéficiaires de votre contrat. Cette étape est essentielle
    pour garantir la transmission de votre capital selon vos volontés.


    3. Choix de l''allocation initiale : Précisez-nous la répartition souhaitée entre
    le fonds en euros (sécurisé) et les unités de compte (potentiel de croissance).
    Si vous avez un doute, nous pouvons vous expliquer le fonctionnement de chaque
    support.


    4. Effectuer le versement initial : Procédez au premier versement. Pour activer
    le contrat, un montant minimum de 500 € est requis. Ce versement sera soumis à
    des frais d''entrée de 1 %.


    5. Validation et signature : Nous vous transmettons le contrat finalisé pour signature
    électronique via votre espace sécurisé. Une fois signé, nous vous confirmons l''activation
    effective de votre contrat et la date de prise d''effet des garanties.


    Vous saurez que votre contrat est actif lorsque vous recevrez votre certificat
    d''adhésion et que vous pourrez consulter votre solde initial sur votre portail
    client numérique.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 065755d8-7787-5df9-9b11-e2fc8ec9b37b
  title: Contrat d'assurance-vie Égide Multisupport — grille tarifaire
  body: 'Cette grille tarifaire détaille les frais applicables au Contrat d''assurance-vie
    Égide Multisupport. Nos frais sont transparents et justifiés par la gestion active
    des fonds et la maintenance d''une infrastructure sécurisée.


    - Frais sur versements (frais d''entrée) : 1 %

    - Frais de gestion annuels du fonds en euros : 0,6 %

    - Frais de gestion annuels des unités de compte : 0,85 %


    Ces tarifs s''appliquent uniformément à l''ensemble de nos sociétaires afin de
    garantir l''équité et la pérennité du modèle mutuel d''Égide Assurances. Aucun
    autre frais caché n''est appliqué pour la gestion courante du contrat.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 68b9d1ce-b229-5625-b0c5-0af56244fd8a
  title: Contrat d'assurance-vie Égide Multisupport — opération échouée ou en attente
  body: 'Il arrive qu''un versement ou un arbitrage sur votre Contrat d''assurance-vie
    Égide Multisupport apparaisse comme « en attente » ou soit marqué comme « échoué
    ». Voici comment identifier la cause et résoudre la situation.


    Symptôme : Votre solde n''est pas mis à jour après un versement ou une demande
    de transfert de fonds est refusée.


    Causes probables :

    - Défaut d''authentification : L''action a été tentée sans l''authentification
    forte requise pour les modifications de contrat.

    - Vérification d''identité incomplète : Une pièce justificative manquante ou expirée
    bloque le traitement.

    - Délai bancaire : Le transfert de fonds entre votre banque et notre société mutuelle
    peut prendre plusieurs jours ouvrés.

    - Versement insuffisant : Le versement initial est inférieur au minimum requis
    de 500 €.


    Étapes de résolution :

    1. Vérifiez l''état de votre transaction auprès de votre établissement bancaire
    pour confirmer que les fonds ont bien été débités.

    2. Assurez-vous que vos documents d''identité sont à jour dans votre espace client.

    3. Vérifiez que le montant versé respecte le seuil minimum de 500 € pour les premières
    souscriptions.


    Si le problème persiste après 5 jours ouvrés, nous escaladerons votre dossier
    vers un gestionnaire spécialisé. Ce dernier analysera la transaction et vous contactera
    par email ou téléphone pour régulariser la situation. Vous recevrez une notification
    dès que l''opération sera validée ou si un complément d''information est nécessaire.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ac46a9e8-0bd1-5679-ad76-8c0b5f2e6f84
  title: Contrat d'assurance-vie Égide Multisupport — conditions d'éligibilité
  body: 'L''accès au Contrat d''assurance-vie Égide Multisupport est soumis aux conditions
    suivantes :


    | Condition | Exigence | Résultat |

    | :--- | :--- | :--- |

    | Capacité juridique | Être majeur ou représenté légalement | Éligible |

    | Identité | Présentation d''une pièce d''identité officielle valide | Éligible
    |

    | Apport financier | Versement initial minimum de 500 € | Éligible |

    | Résidence | Résider dans un pays autorisé par nos conventions | Éligible |

    | Conformité | Absence de fraude avérée lors des souscriptions précédentes | Éligible
    |


    Tout manquement à l''une de ces conditions entraîne le refus d''ouverture du contrat
    ou la suspension des opérations de versement.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 0bed9e18-2b5f-5517-bd74-1f6a409b86ef
  title: Contrat d'assurance-vie Égide Multisupport — face à un produit similaire
    de l'établissement
  body: 'Il est fréquent de hésiter entre le Contrat d''assurance-vie Égide Multisupport
    et le PER individuel Égide. Voici les différences fondamentales pour vous aider
    à choisir :


    - Disponibilité des fonds : L''assurance-vie offre une liquidité permanente ;
    vous pouvez racheter vos fonds à tout moment. Le PER est un produit de retraite
    dont les fonds sont, par principe, bloqués jusqu''à la fin de l''activité professionnelle
    (sauf cas de déblocage anticipé).

    - Fiscalité : L''assurance-vie propose un cadre fiscal avantageux après 8 ans.
    Le PER permet, en revanche, de déduire les versements de l''assiette taxable du
    revenu imposable.

    - Risque et Rendement : L''assurance-vie Multisupport allie la sécurité du fonds
    en euros (taux de 2,6 % en 2025) et la croissance des unités de compte. Le PER
    suit une logique d''investissement à long terme.


    L''assurance-vie convient mieux à ceux qui souhaitent se constituer une épargne
    disponible et flexible. Le PER est préférable pour optimiser sa fiscalité actuelle
    tout en préparant sa retraite.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 37ffd696-3aff-5522-87c8-6423bd01ef8f
  title: Contrat d'assurance-vie Égide Multisupport — informations réglementaires
  body: 'Égide Assurances opère sous la surveillance stricte de l''Autorité de Contrôle
    Prudentiel et de Résolution (ACPR) et respecte l''ensemble des dispositions du
    Code des assurances.


    Protection des fonds : Conformément à la réglementation, les contrats de personnes
    sont protégés par le Fonds de Garantie des Assurances de Personnes (FGAP) jusqu''à
    un montant de 70 000 € par assuré. Cette protection est une garantie fondamentale
    pour la sécurisation de votre épargne.


    Nature des supports : Le fonds en euros est conçu pour préserver le capital. En
    revanche, les unités de compte sont des supports dont la valeur fluctue selon
    les marchés financiers. En conséquence, elles exposent le sociétaire à un risque
    de perte en capital. Nous ne garantissons aucune performance future sur ces supports.


    Éthique et Transparence : Notre modèle mutuel implique que vous êtes sociétaire
    et non simple client. Cette structure garantit un traitement équitable et une
    gestion des frais (1 % sur versements, 0,6 % et 0,85 % de frais de gestion) justifiée
    par la maintenance d''une infrastructure sécurisée et une gestion active.


    Traitement des données : La protection de vos données personnelles et le traitement
    impartial des réclamations sont au cœur de notre cadre opérationnel. Toute modification
    de contrat nécessite une authentification forte et une vérification d''identité
    rigoureuse.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e0aecb1b-1f6a-5bbd-8539-b0f22fbf5dbd
  title: Contrat d'assurance-vie Égide Multisupport — grille des taux
  body: 'La rémunération du Contrat d''assurance-vie Égide Multisupport repose sur
    la performance des supports choisis :


    - Fonds en euros : Le taux servi pour l''année 2025 est de 2,6 %. Ce taux s''applique
    à l''ensemble des sommes investies sur ce support, quel que soit le montant du
    capital.

    - Unités de compte : Il n''existe pas de taux garanti. Le rendement dépend exclusivement
    de la performance des marchés financiers sur lesquels les fonds sont investis.


    Le taux du fonds en euros est communiqué annuellement et peut évoluer selon la
    stratégie d''investissement de la mutuelle et les conditions économiques globales.
    Pour toute question sur l''application de ces taux, nous vous invitons à consulter
    Contrat d''assurance-vie Égide Multisupport — présentation.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: a5ea503f-8150-5350-9635-62403a856921
  title: Contrat d'assurance-vie Égide Multisupport — offre en cours
  body: "Nous avons le plaisir d'annoncer une offre exceptionnelle pour nos sociétaires\
    \ fidèles. \n\nDu 1er septembre 2025 au 31 décembre 2025, Égide Assurances réduit\
    \ les frais d'entrée pour tout versement complémentaire sur votre Contrat d'assurance-vie\
    \ Égide Multisupport. \n\nAu lieu des 1 % habituels, les frais sur versements\
    \ sont ramenés à 0 % pour tout montant supérieur ou égal à 2 000 € versé durant\
    \ cette période. \n\nCette offre vise à encourager la croissance de votre épargne\
    \ tout en renforçant la solidarité de notre modèle mutuel. Pour en bénéficier,\
    \ il vous suffit d'effectuer votre versement via votre portail client numérique\
    \ avant la date limite du 31 décembre 2025. Les frais de gestion annuels (0,6\
    \ % pour le fonds euros et 0,85 % pour les unités de compte) restent inchangés."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: e2db4bf5-ba0b-5a22-88ab-bae70a964d32
  title: Contrat d'assurance-vie Égide Multisupport — protection contre la fraude
    et les opérations non autorisées
  body: 'Chez Égide Assurances, la protection de votre patrimoine et de vos données
    est notre priorité absolue. En tant que société mutuelle, nous nous engageons
    à maintenir un cadre opérationnel sécurisé pour protéger chaque sociétaire contre
    la fraude et les opérations non autorisées.


    Nous appliquons une politique de tolérance zéro envers la fraude. Pour garantir
    l''intégrité de vos avoirs, une authentification forte ainsi qu''une vérification
    rigoureuse de l''identité sont obligatoires avant toute action modifiant l''état
    de votre contrat, tout retrait ou tout transfert de fonds. Ces protocoles sont
    essentiels pour prévenir l''usurpation d''identité et les accès malveillants.


    Il est primordial de savoir que nous ne vous demanderons jamais, par email, par
    téléphone ou via un message non sollicité, de nous communiquer vos mots de passe,
    vos codes secrets d''accès ou vos identifiants de connexion. Toute demande de
    ce type doit être considérée comme une tentative de fraude.


    Si vous constatez une opération suspecte sur votre contrat ou si vous avez un
    doute sur l''authenticité d''une communication reçue en notre nom, nous vous demandons
    de nous en informer immédiatement. Une réaction rapide est déterminante pour limiter
    les risques et nous permettre de bloquer les accès compromis.


    Nous vous recommandons de consulter régulièrement vos relevés pour identifier
    toute anomalie. En cas de doute, nous sommes à votre disposition pour analyser
    l''historique de vos opérations. Pour une approche complète de la protection de
    vos actifs, nous vous invitons également à lire le document intitulé « Contrat
    d''assurance-vie Égide Multisupport — informations réglementaires ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 1bf46eec-9a4e-51f7-9202-7cf2281b7042
  title: Contrat d'assurance-vie Égide Multisupport — conditions générales
  body: "Le présent document définit les conditions générales régissant le Contrat\
    \ d'assurance-vie Égide Multisupport. Ce contrat est conclu dans le cadre d'un\
    \ modèle coopératif où l'assuré acquiert la qualité de sociétaire, participant\
    \ ainsi à la gouvernance de notre mutuelle.\n\nL'ouverture du contrat est conditionnée\
    \ par un versement initial minimum de 500 €. Chaque versement effectué sur le\
    \ contrat est soumis à des frais sur versements de 1 %, destinés à financer la\
    \ maintenance de notre infrastructure sécurisée et la gestion active des fonds.\n\
    \nLa gestion des actifs est assortie de frais annuels, prélevés selon le support\
    \ choisi : \n- Pour le fonds en euros, les frais de gestion s'élèvent à 0,6 %.\n\
    - Pour les unités de compte, les frais de gestion s'élèvent à 0,85 %.\n\nNous\
    \ opérons sous la surveillance de l'ACPR et respectons strictement le Code des\
    \ assurances. À ce titre, les contrats de personnes bénéficient de la protection\
    \ du FGAP jusqu'à 70 000 €.\n\nLe sociétaire peut demander le rachat total ou\
    \ partiel de son contrat à tout moment. Nous nous engageons à traiter ces demandes\
    \ dans les délais légaux, après vérification rigoureuse de l'identité du demandeur.\
    \ Toute modification des conditions générales fera l'objet d'une notification\
    \ préalable selon les modalités prévues par la loi.\n\nLe contrat prend fin soit\
    \ par le rachat total des fonds, soit par le décès de l'assuré, auquel cas les\
    \ capitaux sont versés aux bénéficiaires désignés conformément aux dispositions\
    \ légales et contractuelles. Pour plus de détails sur la structure des coûts,\
    \ veuillez vous référer à la « Contrat d'assurance-vie Égide Multisupport — grille\
    \ tarifaire »."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: f97f89ce-87a6-5f0e-9827-5b2208fa2425
  title: Contrat d'assurance-vie Égide Multisupport — pour qui et pour quels usages
  body: 'Le Contrat d''assurance-vie Égide Multisupport est une solution d''épargne
    flexible conçue pour accompagner les particuliers et les familles dans la constitution
    d''un patrimoine durable. Ce produit s''adresse particulièrement à ceux qui recherchent
    un équilibre entre la préservation du capital et la recherche de croissance.


    Ce contrat est idéal pour les usages suivants :

    - La préparation d''un projet à moyen ou long terme (achat immobilier, études
    des enfants).

    - La constitution d''une épargne de précaution sécurisée via le fonds en euros,
    lequel affiche un taux de 2,6 %.

    - La diversification d''un portefeuille d''investissement grâce aux unités de
    compte, pour capter le potentiel de croissance des marchés financiers.


    L''accessibilité du contrat est garantie par un versement initial minimum de 500
    €. Afin de maintenir l''équité entre tous nos sociétaires et la pérennité de notre
    modèle mutuel, nous appliquons des frais sur versements de 1 %.


    Le pilotage du contrat est transparent et pédagogique. Selon vos objectifs, vous
    pouvez arbitrer vos avoirs entre le fonds en euros (frais de gestion de 0,6 %)
    et les unités de compte (frais de gestion de 0,85 %).


    En choisissant ce contrat, vous ne devenez pas simple client, mais sociétaire
    d''une mutuelle privilégiant l''éthique et la transparence. Pour comprendre comment
    débuter votre épargne, nous vous orientons vers le guide « Contrat d''assurance-vie
    Égide Multisupport — souscrire et activer ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 3c99d293-a926-55f4-a12b-ad534a895302
  title: 'Contrat d''assurance-vie Égide Multisupport — frais sur versements : explications'
  body: '### Quels sont les frais appliqués lors de mes versements sur le contrat
    ?

    Chaque versement effectué sur votre Contrat d''assurance-vie Égide Multisupport
    est soumis à des frais sur versements de 1 %. Cela signifie que si vous versez
    1 000 €, 10 € sont prélevés pour les frais, et 990 € sont réellement investis
    sur vos supports.


    ### Pourquoi Égide Assurances applique-t-elle ces frais ?

    Ces frais sont transparents et justifiés. Ils nous permettent d''assurer la maintenance
    d''une infrastructure numérique sécurisée et de garantir une gestion active et
    rigoureuse de vos fonds. Cette structure tarifaire est essentielle pour garantir
    l''équité entre tous les sociétaires et assurer la pérennité de notre modèle mutuel.


    ### Ces frais s''appliquent-ils au versement initial ?

    Oui, les frais de 1 % s''appliquent à tous les versements, y compris le versement
    initial minimum de 500 € requis pour l''ouverture du contrat.


    Pour une vue d''ensemble de l''ensemble de nos coûts, nous vous invitons à consulter
    la « Contrat d''assurance-vie Égide Multisupport — grille tarifaire ».'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: f4abb73e-8ed3-5a30-b3e9-a34e60bfdb8e
  title: Contrat d'assurance-vie Égide Multisupport — résilier, clôturer ou changer
    de formule
  body: 'La modification ou la clôture de votre contrat s''effectue via un accompagnement
    personnalisé. Voici la marche à suivre selon votre besoin.


    **Pour changer de formule ou modifier la répartition de vos supports :**

    1. Informez-nous de votre volonté de modifier la répartition entre le fonds en
    euros et les unités de compte.

    2. Nous procéderons à une vérification rigoureuse de votre identité pour sécuriser
    l''opération.

    3. Indiquez-nous les nouveaux pourcentages de répartition souhaités.

    4. Nous vous confirmerons l''exécution de l''arbitrage et la mise à jour de votre
    profil d''investissement.


    **Pour résilier et clôturer définitivement votre contrat (Rachat Total) :**

    1. Demandez-nous la clôture complète de votre Contrat d''assurance-vie Égide Multisupport.

    2. Nous vous demanderons de fournir un relevé d''identité bancaire (RIB) récent
    et une pièce d''identité valide pour l''authentification forte.

    3. Nous calculerons la valeur de rachat totale de votre contrat, après déduction
    des éventuels frais applicables et fiscalité en vigueur.

    4. Nous vous confirmerons le montant exact qui vous sera versé.

    5. Une fois votre accord final reçu, nous procéderons au transfert des fonds vers
    votre compte bancaire et vous notifierons la clôture effective du contrat.


    Sachez que la clôture d''un contrat est une décision importante. Nous restons
    à votre disposition pour discuter des alternatives ou pour ajuster votre stratégie
    d''investissement avant toute résiliation. Pour plus d''informations sur les implications
    de ces choix, vous pouvez consulter « Contrat d''assurance-vie Égide Multisupport
    — informations sur les risques ».'
