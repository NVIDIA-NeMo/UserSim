- id: beeb58e4-904d-5a1c-b3a3-644f5d1309ca
  title: Assurance habitation Égide — traiter une demande courante de bout en bout
  body: 'L''une des demandes les plus courantes est la déclaration d''un sinistre
    habitation. Voici la procédure complète pour garantir une prise en charge rapide
    et conforme.


    Prérequis :

    - Le numéro de votre contrat d''Assurance habitation Égide.

    - Des photos des dommages et, si possible, un inventaire sommaire des biens touchés.


    Étapes de traitement :


    1. Signalez-nous la survenue du sinistre. Attention : vous devez effectuer cette
    démarche dans un délai maximum de 5 jours ouvrés pour garantir la validité de
    vos garanties. Nous enregistrons l''événement et vous confirmons l''ouverture
    du dossier.

    2. Transmettez-nous les justificatifs (photos, factures d''achat des biens endommagés).
    Nous accusons réception de ces pièces et les joignons à votre dossier.

    3. Nous analysons la nature du sinistre pour déterminer la franchise applicable.
    Nous vous confirmons si c''est la franchise standard de 150 € ou la franchise
    catastrophe naturelle de 380 € qui sera déduite de l''indemnisation.

    4. Selon l''ampleur des dégâts, nous vous informons si le passage d''un expert
    est nécessaire. Si c''est le cas, nous coordonnons le rendez-vous et vous confirmons
    la date.

    5. Après validation du rapport d''expertise ou analyse des pièces, nous vous communiquons
    le montant final de l''indemnité, après déduction de la franchise applicable.


    Vous saurez que la demande est traitée lorsque vous recevrez l''avis d''indemnisation
    et que le virement correspondant sera crédité sur votre compte bancaire.


    Pour toute question sur vos cotisations, vous pouvez consulter le document Assurance
    habitation Égide — coûts et frais.'
  domain: insurance
  product_category: assurance_habitation
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 5de796bb-e089-53ba-a39d-02b50e8761d2
  title: Assurance habitation Égide — écart avec vos relevés
  body: "Ce document guide les agents dans la résolution des demandes de sociétaires\
    \ constatant un écart entre le montant du sinistre estimé et l'indemnité reçue\
    \ sur leur relevé.\n\nSymptôme : Le sociétaire déclare : « Le montant versé ne\
    \ correspond pas à la valeur des dommages déclarés » ou « Je ne comprends pas\
    \ pourquoi une somme a été déduite de mon remboursement ».\n\nCauses probables\
    \ :\nL'écart constaté provient presque systématiquement de l'application des franchises\
    \ contractuelles, que le sociétaire a pu oublier ou mal interpréter.\n\nProcédure\
    \ de vérification :\n1. Analysez la nature du sinistre dans le dossier. S'agissait-il\
    \ d'un événement standard ou d'une catastrophe naturelle ?\n2. Vérifiez le montant\
    \ de la franchise appliquée sur le relevé :\n   - Si le sinistre était standard,\
    \ une déduction de 150 € a dû être effectuée.\n   - Si le sinistre était classé\
    \ comme catastrophe naturelle, une déduction de 380 € a été appliquée.\n3. Vérifiez\
    \ si le sociétaire a respecté le délai de déclaration de 5 jours ouvrés. Un dépassement\
    \ de ce délai peut avoir entraîné une réduction proportionnelle de l'indemnité,\
    \ conformément à nos conditions générales.\n\nRésolution et communication :\n\
    Expliquez pédagogiquement au sociétaire que la franchise est le montant restant\
    \ à sa charge pour garantir la mutualisation des risques entre tous les membres\
    \ de la coopérative. \n- Confirmez le montant exact : « Conformément à votre contrat\
    \ d'Assurance habitation Égide, une franchise de 150 € (ou 380 €) a été appliquée\
    \ ».\n\nSi l'écart persiste après l'application de la franchise et du délai, escaladez\
    \ le dossier vers un gestionnaire spécialisé pour une révision du calcul d'indemnisation.\
    \ Le sociétaire recevra une réponse écrite sous 5 jours ouvrés."
  domain: insurance
  product_category: assurance_habitation
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 2b9ba241-426e-5207-bf42-ac484574cff5
  title: Assurance auto Égide — présentation
  body: "L'Assurance auto Égide est conçue pour offrir aux sociétaires une protection\
    \ automobile fiable, alliant une gestion rigoureuse des sinistres à une vision\
    \ coopérative de l'assurance. En choisissant notre solution, vous n'êtes pas un\
    \ simple client, mais un membre d'une mutuelle où la transparence et l'éthique\
    \ guident chaque décision.\n\nNous nous engageons à simplifier votre expérience\
    \ d'assurance grâce à un système de bonus optimisé, permettant d'atteindre un\
    \ bonus maximal de 50 %, réduisant ainsi durablement vos cotisations pour récompenser\
    \ votre prudence au volant. Pour vous donner un ordre d'idée, nous proposons une\
    \ cotisation annuelle indicative de 640 € pour un profil type en couverture tous\
    \ risques, bien que ce montant soit ajusté selon vos besoins et vos caractéristiques\
    \ personnelles.\n\nEn cas de sinistre, notre réactivité est notre priorité. Toutefois,\
    \ pour garantir la validité des garanties et le traitement efficace de votre dossier,\
    \ nous appliquons strictement le délai légal de déclaration, soit 5 jours ouvrés\
    \ pour signaler tout incident. \n\nCôté garanties, notre formule complète prévoit\
    \ une franchise tous risques de 300 €, montant qui reste à votre charge après\
    \ l'indemnisation. Cette structure tarifaire est conçue pour assurer l'équité\
    \ entre tous nos sociétaires et garantir la pérennité de notre modèle mutuel.\
    \ Nous privilégions un accompagnement pédagogique pour vous aider à choisir le\
    \ niveau de couverture le plus adapté à votre usage quotidien.\n\nNous vous rappelons\
    \ que nous opérons sous la surveillance de l'ACPR et respectons strictement le\
    \ Code des assurances, assurant ainsi un cadre sécurisé pour vos contrats. Pour\
    \ plus de détails sur les aspects réglementaires de notre activité, nous vous\
    \ invitons à consulter le document Assurance auto Égide — informations réglementaires."
  domain: insurance
  product_category: assurance_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: fa3580ce-1f00-5943-b4b0-6ac5ebb2d2a0
  title: 'Assurance auto Égide — cotisation annuelle indicative en tous risques :
    explications'
  body: 'Question : Pourquoi le montant de 640 € est-il présenté comme une « cotisation
    annuelle indicative » ?


    Réponse : Le montant de 640 € est un exemple représentatif pour un profil de sociétaire
    moyen souscrit en formule tous risques. Nous utilisons ce chiffre pour vous donner
    une visibilité sur notre positionnement tarifaire. Cependant, le montant final
    de votre cotisation est personnalisé. Il dépend de facteurs précis tels que la
    puissance de votre véhicule, votre historique de conduite, votre lieu de résidence
    et le niveau de bonus acquis.


    Question : Ce montant inclut-il les taxes et frais de gestion ?


    Réponse : Oui, nos tarifs sont transparents. Le montant indiqué inclut la gestion
    active de vos fonds et la maintenance de notre infrastructure sécurisée. Nous
    veillons à ce que chaque frais soit justifié pour maintenir l''équité entre tous
    les sociétaires. Pour une vue d''ensemble de nos coûts, vous pouvez consulter
    l''Assurance auto Égide — grille tarifaire.'
  domain: insurance
  product_category: assurance_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 104939e4-c138-591a-80c0-38b0e1fa53c1
  title: Assurance auto Égide — souscrire et activer
  body: 'Pour souscrire à l''Assurance auto Égide et activer vos garanties, nous vous
    accompagnons à travers les étapes suivantes :


    1. Transmission des informations du véhicule et du conducteur : Vous nous communiquez
    la carte grise du véhicule, votre relevé d''informations (historique des sinistres
    sur les 3 dernières années) et une copie de votre permis de conduire valide.


    2. Vérification de l''identité : Conformément à notre politique de sécurité, nous
    procédons à une vérification rigoureuse de votre identité. Nous vous demandons
    de nous fournir une pièce d''identité officielle en cours de validité.


    3. Définition du niveau de couverture : Nous analysons ensemble vos besoins pour
    choisir la formule adaptée. Nous vous précisons alors les montants applicables,
    comme la franchise tous risques de 300 € si vous optez pour la protection complète.


    4. Validation du tarif et signature : Nous vous adressons une proposition tarifaire
    personnalisée (basée sur un exemple type de 640 € pour la formule tous risques,
    ajustable selon votre profil). Vous signez le contrat électroniquement via notre
    portail sécurisé.


    5. Activation et réception des documents : Une fois le premier paiement validé,
    nous activons vos garanties. Vous recevez immédiatement votre certificat d''assurance
    (carte verte) et vos conditions générales par email.


    Vous saurez que l''activation est réussie lorsque vous aurez reçu votre attestation
    d''assurance valide, vous permettant de circuler légalement avec la protection
    de notre mutuelle.'
  domain: insurance
  product_category: assurance_auto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: b12fecad-0520-53a3-a1d8-0084d7b09aac
  title: Assurance auto Égide — grille tarifaire
  body: 'Conformément à notre philosophie de transparence, nous détaillons ci-dessous
    les éléments tarifaires applicables à l''Assurance auto Égide :


    - Cotisation annuelle indicative (formule tous risques) : 640 € (ce montant est
    un exemple et varie selon le profil du sociétaire).

    - Franchise tous risques : 300 € (montant restant à la charge du sociétaire lors
    d''une indemnisation de sinistre).

    - Frais de gestion : Inclus dans la cotisation annuelle.


    Nos frais sont justifiés par la maintenance d''une infrastructure sécurisée et
    une gestion active, garantissant l''équité et la pérennité du modèle mutuel pour
    l''ensemble de nos sociétaires.'
