- id: 91f0351f-9a16-5ec7-821d-042e9a0563ce
  title: Complémentaire santé Égide — opération échouée ou en attente
  body: "Il peut arriver que votre demande d'adhésion ou une modification de votre\
    \ contrat Complémentaire santé Égide apparaisse comme « échouée » ou « en attente\
    \ ». Voici comment identifier la cause et résoudre la situation.\n\n**Symptôme\
    \ : « Ma demande de souscription est en attente de validation »**\n\n**Causes\
    \ probables**\n- **Défaut de vérification d'identité** : La cause la plus fréquente\
    \ est un document d'identité illisible, expiré ou non conforme à nos normes de\
    \ sécurité.\n- **Informations manquantes** : Votre attestation de droits à l'Assurance\
    \ Maladie n'a pas été transmise ou est obsolète.\n- **Incohérence des données**\
    \ : Une divergence entre les informations saisies et les documents fournis.\n\n\
    **Procédure de résolution**\n1. **Vérification des documents** : Vérifiez que\
    \ votre pièce d'identité est bien valide et que la photo est parfaitement nette.\n\
    2. **Transmission des justificatifs** : Communiquez-nous à nouveau les documents\
    \ manquants ou corrigés. Nous traiterons votre demande dès réception.\n3. **Confirmation**\
    \ : Nous vous informerons par email dès que la vérification sera validée et que\
    \ votre contrat passera au statut « actif ».\n\n**Quand escalader le dossier ?**\n\
    Si après deux tentatives de transmission, votre dossier reste « en attente »,\
    \ nous escaladons automatiquement votre demande vers un gestionnaire spécialisé.\
    \ \n\nCelui-ci analysera les pièces justificatives manuellement et vous contactera\
    \ pour résoudre le point de blocage. En dernier recours, et conformément à notre\
    \ cadre opérationnel, le dossier peut être soumis à la Médiation de l'assurance\
    \ pour garantir un traitement impartial."
  domain: insurance
  product_category: complementaire_sante
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: ceb4e55b-8fd8-55ae-af31-c0a5e8364334
