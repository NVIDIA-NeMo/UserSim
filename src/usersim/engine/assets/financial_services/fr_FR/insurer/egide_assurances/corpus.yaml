- id: 6e469f91-f27b-51b5-9a27-49e741f580f3
  title: Assurance auto Égide — confidentialité et protection des données
  body: 'Égide Assurances s''engage à traiter les données de ses sociétaires avec
    la plus grande rigueur, conformément au Règlement Général sur la Protection des
    Données (RGPD) et sous la surveillance de l''ACPR. La protection des données et
    le traitement équitable des sociétaires sont au cœur de notre cadre opérationnel.


    **Collecte et finalité des données**

    Dans le cadre de l''Assurance auto Égide, nous collectons les informations strictement
    nécessaires à la gestion de votre contrat : identité, coordonnées, caractéristiques
    du véhicule et historique de conduite. Ces données sont utilisées pour calculer
    votre prime, gérer vos sinistres et optimiser votre bonus (jusqu''à 50 %). Elles
    nous permettent également de garantir l''équité tarifaire entre tous les sociétaires.


    **Sécurité et accès**

    Nous mettons en œuvre des mesures de sécurité techniques et organisationnelles
    avancées pour protéger vos informations contre tout accès non autorisé. Nous appliquons
    systématiquement une authentification forte et une vérification rigoureuse de
    l''identité avant toute modification contractuelle ou mouvement de fonds.


    **Vos droits**

    Conformément à la loi, vous disposez d''un droit d''accès, de rectification et
    de suppression de vos données personnelles. Vous pouvez exercer ces droits via
    votre portail client numérique ou par demande écrite envoyée à notre service client
    durant les heures ouvrables (CET).


    **Conservation et transmission**

    Nous conservons vos données pendant la durée du contrat et pour les délais légaux
    de prescription prévus par le Code des assurances. Nous ne vendons jamais vos
    données à des tiers. Les transmissions de données ne s''effectuent que vers des
    organismes habilités (ex: ACPR) ou dans le cadre du règlement d''un sinistre.


    Nous vous rappelons que tout manquement aux obligations de déclaration, notamment
    le délai de 5 jours ouvrés pour les sinistres, est consigné dans votre dossier
    pour garantir l''impartialité du traitement des réclamations.'
  domain: insurance
  product_category: assurance_auto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 93db81b4-9691-53e0-a0b1-ec5608315eef
  title: Assurance auto Égide — reconnaître les arnaques visant ce produit
  body: "La protection de nos sociétaires est notre priorité. Dans le cadre de l'Assurance\
    \ auto Égide, nous constatons l'émergence de tentatives de fraude sophistiquées.\
    \ Nous vous invitons à être vigilants face aux scénarios suivants :\n\n1. Le faux\
    \ remboursement de prime : Vous recevez un email ou un SMS prétendant qu'un trop-perçu\
    \ sur votre cotisation (par exemple, un montant lié à notre prime annuelle indicative\
    \ de 640 €) est disponible. On vous demande de cliquer sur un lien et de saisir\
    \ vos coordonnées bancaires pour « débloquer » les fonds. \n2. L'offre de bonus\
    \ frauduleuse : Un tiers vous contacte en prétendant pouvoir augmenter artificiellement\
    \ votre bonus au-delà du plafond de 50 % en échange d'un paiement immédiat.\n\
    3. L'urgence simulée lors d'un sinistre : Quelqu'un se faisant passer pour un\
    \ expert mandaté par nos soins vous demande un paiement rapide pour accélérer\
    \ la prise en charge de vos réparations.\n\nSachez que nous ne vous demanderons\
    \ jamais vos codes secrets, vos identifiants de connexion ou vos coordonnées bancaires\
    \ par email ou par SMS. Toute modification de contrat ou tout transfert de fonds\
    \ nécessite une authentification forte et une vérification rigoureuse de l'identité.\n\
    \nSi vous constatez une anomalie ou si vous êtes victime d'une tentative d'escroquerie,\
    \ contactez-nous immédiatement. Nous vous rappelons que pour tout sinistre, y\
    \ compris en cas de vol ou de fraude, le délai légal de déclaration de 5 jours\
    \ ouvrés doit être strictement respecté pour garantir la validité de vos garanties.\
    \ Ce délai est essentiel pour nous permettre d'intervenir efficacement et de protéger\
    \ vos droits.\n\nPour plus de détails sur la gestion des incidents, vous pouvez\
    \ consulter le document Assurance auto Égide — opération refusée ou bloquée."
  domain: insurance
  product_category: assurance_auto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 33447fbf-af75-5d28-ab6f-a4e060a60211
  title: Assurance auto Égide — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux gestionnaires pour l''accompagnement des sociétaires
    concernant les limites techniques de l''Assurance auto Égide.


    **1. Franchise et Restrections Financières**

    Le contrat prévoit une franchise tous risques fixée à 300 €. Ce montant reste
    à la charge du sociétaire après l''indemnisation d''un sinistre. Il est impératif
    d''informer le client que ce montant est déduit de l''indemnité finale versée
    par nos soins.


    **2. Gestion du Bonus-Malus**

    Le système de bonus est optimisé pour récompenser la prudence. Toutefois, le bonus
    maximal applicable au sein de notre structure est de 50 %. Tout calcul de prime
    doit tenir compte de ce plafond ; aucun bonus supérieur à 50 % ne peut être appliqué,
    même si le sociétaire provient d''une compagnie tiers avec un taux différent.


    **3. Délais de Déclaration et Validité**

    Nous appliquons une politique de rigueur concernant la déclaration des sinistres.
    Le délai de déclaration est de 5 jours ouvrés. Le non-respect de ce délai peut
    entraîner la déchéance des garanties ou une réduction de l''indemnité, conformément
    au Code des assurances. Ce délai est non négociable pour garantir l''équité entre
    tous les sociétaires.


    **4. Exemples de Tarification**

    À titre indicatif, pour un profil standard, la prime annuelle peut s''élever à
    640 €. Ce montant varie selon le risque et le bonus, mais sert de base de référence
    pour les simulations initiales.


    En cas de litige sur l''application de ces plafonds, le dossier doit être escaladé
    vers un gestionnaire spécialisé. Pour une explication détaillée du délai de déclaration,
    se référer à Assurance auto Égide — délai de déclaration de sinistre (jours ouvrés)
    : explications.'
  domain: insurance
  product_category: assurance_auto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: bdb864b6-a531-5dee-bd59-90dd481e6003
  title: 'Assurance auto Égide — délai de déclaration de sinistre (jours ouvrés) :
    explications'
  body: '**Pourquoi existe-t-il un délai strict pour déclarer mon sinistre ?**


    Pour garantir la validité des garanties de l''Assurance auto Égide, nous demandons
    que tout sinistre nous soit déclaré dans un délai de 5 jours ouvrés. Ce délai
    nous permet de constater les dommages rapidement, de mandater un expert et d''éviter
    que la situation ne se dégrade, ce qui pourrait compliquer l''indemnisation.


    **Que se passe-t-il si je dépasse ce délai ?**


    Le respect des 5 jours ouvrés est une condition contractuelle. Un dépassement
    peut, selon les circonstances et la nature du sinistre, entraîner une réduction
    de l''indemnité ou, dans certains cas graves, la nullité de la garantie. Nous
    vous encourageons donc à nous signaler tout incident dès que possible via votre
    portail client ou par téléphone.


    Pour toute question sur les coûts associés, consultez Assurance auto Égide — coûts
    et frais.'
  domain: insurance
  product_category: assurance_auto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 22a5d3f2-6ffd-5f98-88ae-cde1887ea5c9
  title: Assurance auto Égide — consulter le suivi ou l'historique
  body: "Nous mettons à votre disposition un portail numérique pour suivre vos contrats\
    \ en toute transparence. Voici la marche à suivre pour consulter l'historique\
    \ de vos remboursements et le suivi de vos sinistres pour l'Assurance auto Égide.\n\
    \n**Prérequis :**\nVous devez disposer de vos identifiants de connexion et avoir\
    \ activé l'authentification forte sur votre appareil mobile.\n\n**Étapes de consultation\
    \ :**\n\n1. Connectez-vous à votre espace client sécurisé sur notre portail numérique.\n\
    2. Dans le menu principal, sélectionnez l'onglet « Mes Contrats » puis cliquez\
    \ sur votre contrat d'Assurance auto Égide.\n3. Pour visualiser vos paiements\
    \ et cotisations, cliquez sur la section « Historique Financier ». Vous y retrouverez\
    \ le détail de vos primes, comme votre cotisation annuelle de 640 € si vous êtes\
    \ sur notre tarif de référence.\n4. Pour suivre l'avancement d'un dossier de sinistre,\
    \ accédez à la rubrique « Mes Sinistres ». \n5. Sélectionnez le sinistre concerné\
    \ pour voir l'état d'avancement (ex: « En cours d'expertise », « Indemnisation\
    \ validée ») et consulter le montant de la franchise appliquée (par exemple, 300\
    \ € pour un contrat tous risques).\n\n**Comment savoir si l'opération a réussi\
    \ ?**\n\nL'affichage immédiat de vos dates de paiement et des étapes de traitement\
    \ de vos dossiers confirme que vous consultez les données à jour. Si un document\
    \ (comme un avis d'indemnisation) est disponible, il apparaîtra sous forme de\
    \ lien de téléchargement PDF dans l'historique."
