  institution_id: egide_assurances
- id: 98b4e52d-1400-5eab-a456-af72fd7fe85d
  title: Contrat d'assurance-vie Égide Multisupport — plafonds, restrictions et cas
    particuliers
  body: 'Ce document est destiné aux gestionnaires pour l''accompagnement des sociétaires
    concernant les limites opérationnelles du Contrat d''assurance-vie Égide Multisupport.


    **Seuils d''entrée et versements**

    L''ouverture du contrat est conditionnée par un versement initial minimum de 500
    €. Tout dossier présentant un montant inférieur à ce seuil doit être refusé lors
    de la souscription. Les versements complémentaires ultérieurs sont libres, sous
    réserve du respect des procédures de lutte contre le blanchiment.


    **Restrictions sur les supports**

    Le contrat permet une répartition entre le fonds en euros et les unités de compte.
    Toutefois, l''accès aux unités de compte peut être restreint en fonction du profil
    de risque du sociétaire. Nous rappelons que les unités de compte exposent le sociétaire
    à un risque de perte en capital.


    **Délais et validité**

    Conformément à notre politique de gestion des sinistres et des contrats, les délais
    légaux de déclaration sont strictement appliqués. Bien que le contrat d''assurance-vie
    soit un produit d''épargne, toute demande de modification contractuelle majeure
    doit être soumise avec les justificatifs d''identité requis.


    **Protection réglementaire**

    En tant que société opérant sous la surveillance de l''ACPR, nous garantissons
    la protection du FGAP jusqu''à 70 000 € pour les contrats de personnes, assurant
    ainsi la pérennité des avoirs des sociétaires même en cas de défaillance.


    Pour une vue d''ensemble des conditions d''accès, veuillez vous référer au document
    Contrat d''assurance-vie Égide Multisupport — conditions d''éligibilité.'
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: egide_assurances
- id: 40a82c0b-816d-543f-b3d1-90a51683ee14
  title: 'Contrat d''assurance-vie Égide Multisupport — frais de gestion annuels des
    unités de compte : explications'
  body: "C'est une question fréquente pour nos nouveaux sociétaires : comment sont\
    \ calculés les frais sur les supports investis en unités de compte ?\n\n**Qu'est-ce\
    \ que les frais de gestion des unités de compte ?**\nIl s'agit de frais prélevés\
    \ annuellement pour couvrir la gestion active des fonds, la sélection des actifs\
    \ et la maintenance de l'infrastructure sécurisée qui permet le suivi de vos investissements.\n\
    \n**Quel est le montant de ces frais ?**\nPour le Contrat d'assurance-vie Égide\
    \ Multisupport, les frais de gestion annuels des unités de compte s'élèvent à\
    \ 0,85 %. \n\n**Comment sont-ils prélevés ?**\nCes frais sont déduits directement\
    \ de la valeur des unités de compte, de manière proratisée sur l'année, sans que\
    \ vous n'ayez à effectuer de versement manuel. Cette structure tarifaire garantit\
    \ l'équité entre tous les sociétaires et la pérennité de notre modèle mutuel.\n\
    \nPour consulter l'ensemble de nos tarifs, nous vous invitons à lire le document\
    \ Contrat d'assurance-vie Égide Multisupport — grille tarifaire."
  domain: insurance
  product_category: assurance_vie_multisupport
  document_type: faq
  source_authority: official
  placeholder: true
