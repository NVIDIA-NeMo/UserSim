- id: 6508aed0-c884-52f2-aa02-3388d79fd69f
  title: Assurance auto Égide — choisir entre les formules
  body: "Pour votre Assurance auto Égide, nous proposons différentes formules afin\
    \ de s'adapter précisément à vos besoins. Voici les éléments clés pour vous aider\
    \ à choisir.\n\n**Formule Tiers (Essentielle)**\nC'est la couverture minimale\
    \ obligatoire. Elle est idéale pour les véhicules de faible valeur ou pour les\
    \ conducteurs cherchant la solution la plus économique. Elle protège les tiers,\
    \ mais pas vos propres dommages.\n\n**Formule Complète (Tous Risques)**\nCette\
    \ formule offre une protection résidentielle et automobile agile. Elle couvre\
    \ les dommages à votre véhicule, même en l'absence de tiers responsable. \n* \
    \  **Point clé** : Elle implique une franchise de 300 €, montant restant à votre\
    \ charge après indemnisation.\n*   **Avantage** : Une sérénité totale face aux\
    \ imprévus.\n\n**Comparaison rapide**\n| Dimension | Formule Tiers | Formule Complète\
    \ |\n| :--- | :--- | :--- |\n| **Coût** | Plus faible | Plus élevé (ex: 640 €/an\
    \ selon profil) |\n| **Protection** | Tiers uniquement | Véhicule + Tiers |\n\
    | **Reste à charge** | N/A | Franchise de 300 € |\n\nLe choix dépend de la valeur\
    \ de votre véhicule et de votre appétence au risque. Nous vous conseillons la\
    \ formule complète pour tout véhicule récent."
  domain: insurance
  product_category: assurance_auto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
