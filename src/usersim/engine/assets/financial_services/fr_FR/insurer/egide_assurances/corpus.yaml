  institution_id: egide_assurances
- id: 4aee9812-1396-56ad-b8a8-897f81eb69f5
  title: Complémentaire santé Égide — pour qui et pour quels usages
  body: "La Complémentaire santé Égide est conçue pour les particuliers et les familles\
    \ qui recherchent un partenaire de confiance plutôt qu'un simple prestataire.\
    \ Notre modèle coopératif fait de vous un sociétaire, vous permettant de bénéficier\
    \ d'une couverture santé responsable et éthique.\n\nCe produit est idéal pour\
    \ ceux qui souhaitent : \n- Garantir l'accès aux paniers 100 % Santé, permettant\
    \ d'obtenir des soins sans aucun reste à charge sur les équipements et prestations\
    \ sélectionnés.\n- Bénéficier d'une protection robuste lors d'hospitalisations\
    \ grâce à un forfait journalier hospitalier de 23 €.\n- Anticiper les frais d'optique\
    \ avec un forfait dédié de 200 € tous les deux ans (hors 100 % Santé).\n\nPour\
    \ illustrer notre structure tarifaire, nous pouvons citer un exemple de cotisation\
    \ mensuelle de 58 € pour un profil type, montant qui contribue à la gestion active\
    \ de notre fonds mutuel et à la maintenance de notre infrastructure sécurisée.\n\
    \nQue vous soyez un jeune actif cherchant une couverture agile ou une famille\
    \ souhaitant sécuriser son budget santé, la Complémentaire santé Égide s'adapte\
    \ à vos besoins. Nous privilégions la pédagogie et la transparence : chaque garantie\
    \ est clairement définie pour éviter toute surprise lors du remboursement.\n\n\
    Pour plus de détails sur les documents nécessaires à l'adhésion, nous vous invitons\
    \ à consulter la page Complémentaire santé Égide — justificatifs à fournir."
