schema_version: v0.1
# Verifiable Tier-1 tasks for ondine_credit, a consumer-credit lender (personal
# loans, revolving credit, car loans, pay in 3 or 4). Every state-changing tool
# it offers is gold in at least one task. Each task ships THREE opening
# phrasings in French. Read-only tools (get_loan_details, get_statements) carry
# no gold state change. A loan application is only recorded: the lender studies
# solvency before any decision.
templates:
- id: TPL-OC-APPLY-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'aimerais emprunter {{amount}} € sur {{months}} mois pour {{purpose}}. Vous
    pouvez enregistrer ma demande ?
  - >-
    Je voudrais faire une demande de prêt personnel de {{amount}} € pour
    {{purpose}}, remboursable en {{months}} mois.
  - >-
    Pouvez-vous étudier une demande de crédit de {{amount}} € sur {{months}} mois ?
    C'est pour {{purpose}}.
  account_state:
    customer_id: cust_oc_0001
  param_space:
    amount: ['5 000', '8 000', '15 000']
    months: ['36', '48', '60']
    purpose: [des travaux dans ma salle de bains, mon mariage, l'équipement de mon nouveau logement]
  gold_tool_sequence: [apply_loan]
  expected_state_deltas: {loan_application_status: SUBMITTED}
- id: TPL-OC-RETRACT-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai signé un prêt personnel chez vous il y a {{days}} jours, mais j'ai changé
    d'avis. Je voudrais me rétracter.
  - >-
    Je souhaite exercer mon droit de rétractation sur le crédit que j'ai accepté
    il y a {{days}} jours.
  - >-
    Finalement, je n'ai plus besoin du prêt signé il y a {{days}} jours : pouvez-vous
    annuler le contrat ?
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '8000.00'
  param_space:
    days: ['3', '6', '10']
  gold_tool_sequence: [withdraw_from_credit]
  expected_state_deltas: {pp_oc_0001.status: WITHDRAWN}
- id: TPL-OC-PAYMISSED-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai raté ma mensualité du mois dernier sur mon {{loan}}. Je voudrais la
    régler maintenant par carte.
  - >-
    Pouvez-vous me permettre de payer l'échéance impayée de mon {{loan}} ? Elle
    était de {{amount}} €.
  - >-
    Mon prélèvement a été rejeté ce mois-ci : je veux régulariser ma mensualité de
    {{amount}} € tout de suite.
  account_state:
    account_id: pp_oc_0001
    account_type: '{{loan}}'
    balance: '6420.00'
    missed_installment: '{{amount}}'
  param_space:
    loan: [prêt personnel, crédit auto]
    amount: ['185,40', '312,75']
  gold_tool_sequence: [pay_emi]
  expected_state_deltas: {installment_status: PAID}
- id: TPL-OC-PREPAY-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai touché une prime et je voudrais rembourser tout mon {{loan}} par
    anticipation.
  - >-
    Pouvez-vous solder entièrement mon {{loan}} ? Je veux faire un remboursement
    anticipé total.
  - >-
    Merci de lancer le remboursement anticipé de la totalité de mon {{loan}}.
  account_state:
    account_id: auto_oc_0001
    account_type: '{{loan}}'
    balance: '9850.00'
  param_space:
    loan: [crédit auto, prêt personnel]
  gold_tool_sequence: [foreclose_loan]
  expected_state_deltas: {auto_oc_0001.status: REPAID}
- id: TPL-OC-MANDATE-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai changé de banque : il faut prélever mes mensualités sur mon nouveau
    compte, IBAN {{iban}}.
  - >-
    Je suis payé en milieu de mois : est-ce qu'on peut décaler le prélèvement de
    mes mensualités au {{day}} ?
  - >-
    Merci de mettre à jour le mandat de prélèvement de mon crédit avec mon nouvel
    IBAN : {{iban}}.
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '6420.00'
  param_space:
    iban: ['FR76 1111 2222 3333 4444 5555 601', 'FR76 9999 8888 7777 6666 5555 402']
    day: ['12', '15']
  gold_tool_sequence: [update_repayment_mandate]
  expected_state_deltas: {mandate_updated: true}
- id: TPL-OC-DEFERRAL-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Je viens de perdre mon emploi et je ne pourrai pas payer ma prochaine
    mensualité. Est-ce qu'on peut la reporter ?
  - >-
    Mon salaire a baissé avec mon passage à temps partiel : j'aimerais réduire
    mes mensualités pendant quelques mois.
  - >-
    J'ai une grosse dépense imprévue ce mois-ci, {{event}}. Pouvez-vous reporter
    mon échéance ?
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '6420.00'
  param_space:
    event: [une réparation de chaudière, des frais médicaux, une panne de voiture]
  gold_tool_sequence: [request_payment_deferral]
  expected_state_deltas: {deferral_status: REQUESTED}
- id: TPL-OC-CLOSE-REVOLVING-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Je n'utilise plus ma réserve de crédit renouvelable depuis longtemps et je
    voudrais la résilier.
  - >-
    Merci de clôturer mon crédit renouvelable : j'ai tout remboursé et je n'en
    veux plus.
  - >-
    Pouvez-vous résilier mon crédit renouvelable Ondine ? Le solde est à zéro.
  account_state:
    account_id: cr_oc_0001
    account_type: crédit renouvelable
    balance: '0.00'
  param_space: {}
  gold_tool_sequence: [close_account]
  expected_state_deltas: {cr_oc_0001.status: CLOSED}
- id: TPL-OC-PAYOUT-IBAN-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    Mon prêt vient d'être accepté, mais je voudrais que les fonds arrivent sur mon
    autre compte : IBAN {{iban}}.
  - >-
    Pouvez-vous verser l'argent de mon crédit sur un autre compte que celui
    prévu ? Voici le nouvel IBAN : {{iban}}.
  - >-
    Merci de changer le compte de versement des fonds de mon prêt : {{iban}}.
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '8000.00'
  param_space:
    iban: ['FR76 1111 2222 3333 4444 5555 601', 'FR76 9999 8888 7777 6666 5555 402']
  gold_tool_sequence: [update_beneficiary]
  expected_state_deltas: {payout_account_updated: true}
- id: TPL-OC-OPEN-REVOLVING-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai signé l'offre de crédit renouvelable : pouvez-vous ouvrir ma réserve de
    {{line}} € ?
  - >-
    Je voudrais activer le crédit renouvelable que j'ai accepté, avec une réserve
    de {{line}} €.
  - >-
    Merci d'ouvrir mon compte de crédit renouvelable : j'ai retourné l'offre
    signée pour {{line}} €.
  account_state:
    customer_id: cust_oc_0001
  param_space:
    line: ['1 000', '2 000', '3 000']
  gold_tool_sequence: [open_account]
  expected_state_deltas: {new_account_status: OPEN}
- id: TPL-OC-UPDATECONTACT-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai déménagé : merci de noter ma nouvelle adresse, {{address}}.
  - >-
    Pouvez-vous remplacer mon numéro de téléphone par le {{phone}} ?
  - >-
    Merci de mettre à jour mon adresse e-mail : {{email}}.
  account_state:
    customer_id: cust_oc_0001
  param_space:
    address: ['11 rue Jean-Moulin, 76000 Rouen', '5 chemin des Oliviers, 06000 Nice']
    phone: ['06 39 98 23 64', '06 39 98 71 58']
    email: [m.benali@example.com, j.perrin@example.com]
  gold_tool_sequence: [update_contact_info]
  expected_state_deltas: {contact_updated: true}
# ── Multi-step (Tier-1) tasks ──────────────────────────────────────────
# Gold sequences of depth 3: each gold tool must be discovered and called; the
# verifier requires the full sequence with no unauthorized state changes. Run
# with a higher max_turns (~10-12).
- id: TPL-OC-BANKSWITCH-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai changé de banque et déménagé : prélevez désormais mes mensualités sur
    l'IBAN {{iban}}, notez ma nouvelle adresse ({{address}}) et prévenez-moi avant
    chaque prélèvement.
  - >-
    Merci de mettre à jour mon mandat de prélèvement avec l'IBAN {{iban}}, de
    changer mon adresse pour {{address}} et d'activer une alerte avant chaque
    échéance.
  - >-
    Pouvez-vous basculer mes prélèvements sur mon nouveau compte ({{iban}}),
    enregistrer ma nouvelle adresse, {{address}}, et m'envoyer un rappel avant
    chaque mensualité ?
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '6420.00'
  param_space:
    iban: ['FR76 1111 2222 3333 4444 5555 601', 'FR76 9999 8888 7777 6666 5555 402']
    address: ['11 rue Jean-Moulin, 76000 Rouen', '5 chemin des Oliviers, 06000 Nice']
  gold_tool_sequence: [update_repayment_mandate, update_contact_info, set_alerts]
  expected_state_deltas: {mandate_updated: true, contact_updated: true, alerts_updated: true}
- id: TPL-OC-HARDSHIP-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai une mensualité impayée de {{amount}} € : je veux la régler maintenant,
    puis reporter la prochaine parce que je suis en arrêt maladie, et recevoir une
    alerte avant chaque prélèvement.
  - >-
    Merci de me laisser payer tout de suite l'échéance de {{amount}} € que j'ai
    ratée, de reporter celle du mois prochain et d'activer un rappel avant chaque
    mensualité.
  - >-
    Pouvez-vous encaisser l'échéance impayée de {{amount}} €, m'accorder un report
    sur la suivante et me prévenir avant les prochains prélèvements ?
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '6420.00'
    missed_installment: '{{amount}}'
  param_space:
    amount: ['185,40', '233,69']
  gold_tool_sequence: [pay_emi, request_payment_deferral, set_alerts]
  expected_state_deltas: {installment_status: PAID, deferral_status: REQUESTED, alerts_updated: true}
- id: TPL-OC-PAYOFF-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai reçu une prime : soldez mon crédit auto par anticipation, résiliez mon
    crédit renouvelable et envoyez-moi une alerte quand tout est clôturé.
  - >-
    Merci de rembourser la totalité de mon crédit auto, de fermer ma réserve de
    crédit renouvelable et de me prévenir une fois que c'est fait.
  - >-
    Pouvez-vous solder mon crédit auto, résilier mon crédit renouvelable inutilisé
    et m'envoyer une confirmation par alerte ?
  account_state:
    account_id: auto_oc_0001
    account_type: crédit auto
    balance: '6200.00'
    revolving_account_id: cr_oc_0001
  param_space: {}
  gold_tool_sequence: [foreclose_loan, close_account, set_alerts]
  expected_state_deltas: {auto_oc_0001.status: REPAID, cr_oc_0001.status: CLOSED, alerts_updated: true}
- id: TPL-OC-RETRACT-REAPPLY-001
  tier: verifiable
  task_type: transactional
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'ai signé un prêt de 10 000 € il y a {{days}} jours, mais c'était trop :
    rétractez-moi de ce contrat, enregistrez une nouvelle demande de {{amount}} €,
    et faites verser les fonds sur mon autre compte (IBAN {{iban}}).
  - >-
    Merci d'annuler le prêt que j'ai signé il y a {{days}} jours en exerçant mon
    droit de rétractation, de déposer à la place une demande de {{amount}} € et de
    changer le compte de versement pour l'IBAN {{iban}}.
  - >-
    Je préfère emprunter moins : rétractation sur le prêt signé il y a {{days}}
    jours, nouvelle demande de {{amount}} €, et versement des fonds sur {{iban}}.
  account_state:
    account_id: pp_oc_0001
    account_type: prêt personnel
    balance: '10000.00'
  param_space:
    days: ['4', '9']
    amount: ['5 000', '6 000']
    iban: ['FR76 1111 2222 3333 4444 5555 601', 'FR76 9999 8888 7777 6666 5555 402']
  gold_tool_sequence: [withdraw_from_credit, apply_loan, update_beneficiary]
  expected_state_deltas: {pp_oc_0001.status: WITHDRAWN, loan_application_status: SUBMITTED, payout_account_updated: true}
- id: TPL-OC-NEWCAR-001
  tier: verifiable
  task_type: onboarding_kyc
  domain: lending_mortgage
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
  - >-
    J'achète une voiture d'occasion à un particulier : enregistrez ma demande de
    crédit auto de {{amount}} € sur {{months}} mois, faites verser les fonds au
    vendeur (IBAN {{iban}}), et prélevez les mensualités le {{day}} du mois.
  - >-
    Merci de déposer une demande de crédit auto de {{amount}} € sur {{months}}
    mois, de prévoir le versement des fonds sur l'IBAN du vendeur, {{iban}}, et de
    fixer le prélèvement au {{day}}.
  - >-
    Pouvez-vous étudier un crédit auto de {{amount}} € sur {{months}} mois, payer
    directement le vendeur sur l'IBAN {{iban}} et caler mes prélèvements le
    {{day}} du mois ?
  account_state:
    customer_id: cust_oc_0001
  param_space:
    amount: ['12 000', '18 000']
    months: ['48', '60']
    iban: ['FR76 1111 2222 3333 4444 5555 601', 'FR76 9999 8888 7777 6666 5555 402']
    day: ['5', '10']
  gold_tool_sequence: [apply_loan, update_beneficiary, update_repayment_mandate]
  expected_state_deltas: {loan_application_status: SUBMITTED, payout_account_updated: true, mandate_updated: true}
# Open-ended advisory topics are the taxonomy-driven `dynamic` tier
# (assets/financial_services/fr_FR/dynamic.yaml), not scripted templates.
