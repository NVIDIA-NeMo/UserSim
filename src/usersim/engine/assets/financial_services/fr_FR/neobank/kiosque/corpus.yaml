- id: 64870dcd-f2d1-5d03-b8c5-dd02f01cac01
  title: Compte Kiosque 12-17 ans — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation du Compte Kiosque
    12-17 ans. Ce service est strictement réservé aux personnes ayant atteint l''âge
    minimal de 12 ans et n''ayant pas encore atteint leur majorité légale.


    Obligations financières et limites :

    Le compte est soumis à une cotisation annuelle forfaitaire de 20 €. Ce montant
    est prélevé pour assurer la viabilité et l''accessibilité du service. Pour garantir
    une gestion prudente des fonds, nous appliquons un plafond de paiement hebdomadaire
    strict de 150 €. Tout dépassement de ce seuil entraînera le refus automatique
    des transactions jusqu''au début de la semaine suivante.


    Cadre réglementaire et protection :

    L''institution opère sous la supervision de l''ACPR et de la Banque Fance, dans
    le respect du Code monétaire et financier. Les fonds déposés sont protégés par
    le cantonnement auprès d''une banque partenaire, les séparant ainsi des fonds
    propres de Kiosque. Pour la partie banque de détail, la protection est assurée
    par le FGDR.


    Modifications et clôture :

    Kiosque se réserve le droit de modifier les présentes conditions. Toute modification
    fera l''objet d''une notification claire et non ambiguë. Le contrat prend fin
    automatiquement lorsque l''utilisateur atteint l''âge de 18 ans, date à laquelle
    une transition vers un compte adulte doit être organisée, ou sur demande de clôture
    du représentant légal.


    L''utilisateur et son représentant légal s''engagent à fournir des informations
    exactes et à présenter une pièce d''identité officielle pour toute modification
    contractuelle.'
