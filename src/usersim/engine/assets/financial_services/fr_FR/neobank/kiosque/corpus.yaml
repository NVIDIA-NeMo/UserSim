- id: 8f568618-2ff5-509b-9e20-a3c43ec8c7a3
  title: Compte Kiosque 12-17 ans — traiter une demande courante de bout en bout
  body: 'Ce guide détaille la procédure de remplacement d''une carte bancaire pour
    le Compte Kiosque 12-17 ans en cas de perte ou de vol.


    Ce que vous devez avoir :

    - Votre identifiant de compte.

    - Une pièce d''identité officielle valide.


    Étapes de traitement :

    1. Signalez-nous la perte ou le vol de votre carte. Nous procéderons immédiatement
    au blocage de l''ancienne carte pour sécuriser vos fonds.

    2. Présentez-nous votre pièce d''identité officielle. Cette étape de vérification
    est obligatoire avant toute modification ou nouvelle émission de moyen de paiement.

    3. Nous confirmerons la commande de votre nouvelle carte. Si des frais de remplacement
    s''appliquent, nous vous en informerons et ils seront débités de votre solde.

    4. Nous déclencherons l''envoi de la carte. Vous recevrez une confirmation dès
    que la carte sera disponible ou expédiée.

    5. Une fois la carte reçue, suivez la procédure d''activation pour commencer à
    l''utiliser, tout en respectant votre plafond hebdomadaire de 150 €.


    Comment savoir si la demande est terminée ?

    La demande est finalisée lorsque vous avez reçu votre nouvelle carte et que vous
    avez effectué un premier paiement ou retrait réussi. Votre cotisation annuelle
    de 20 € reste inchangée malgré le remplacement de la carte.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: b4d84ce9-5d08-5042-b746-b3cd878a23d4
  title: Compte Kiosque 12-17 ans — écart avec vos relevés
  body: 'Symptôme : Le client signale que le solde affiché sur son relevé ne correspond
    pas à ses calculs ou aux transactions visibles.


    Causes probables et vérifications :

    1. Opérations en attente : Certaines transactions peuvent apparaître comme « autorisées
    » mais ne sont pas encore définitivement « comptabilisées ». Cela crée un écart
    temporaire entre le solde réel et le solde disponible.

    2. Prélèvement de la cotisation : Vérifiez si la cotisation annuelle de 20 € a
    été prélevée récemment, ce qui pourrait expliquer un solde inférieur aux attentes.

    3. Dépassement du plafond : Si une transaction a été tentée alors que le plafond
    de 150 € était atteint, elle n''apparaîtra pas dans l''historique car elle a été
    refusée dès l''origine.


    Comment résoudre l''écart :

    - Comparez la date de l''opération et la date de valeur sur le relevé.

    - Listez les opérations suspectes et vérifiez si elles correspondent à des achats
    réels.

    - Recalculez le solde en incluant la cotisation annuelle de 20 €.


    Quand nous solliciter pour une escalade ?

    Si l''écart persiste et qu''une opération non autorisée est identifiée, nous ouvrirons
    un dossier de contestation. Nous rappelons que le client dispose de 13 mois pour
    contester une opération non autorisée. Nous procéderons aux investigations et,
    si la fraude est avérée, le remboursement interviendra généralement dès le premier
    jour ouvré suivant la notification.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: troubleshooting
  source_authority: official
