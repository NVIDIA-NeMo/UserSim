  body: 'Voici la procédure complète pour souscrire et activer votre Carte Kiosque
    Voyage, depuis la demande initiale jusqu''à la première utilisation.


    **Prérequis**

    Vous devez posséder un compte Kiosque et disposer d''une pièce d''identité officielle
