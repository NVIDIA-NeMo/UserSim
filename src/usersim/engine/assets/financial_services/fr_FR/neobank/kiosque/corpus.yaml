- id: 542f1fe3-07b5-5de9-8320-93aef209b913
  title: Compte Kiosque — écart avec vos relevés
  body: 'Ce guide est destiné aux agents du support pour aider les clients qui constatent
    une différence entre le solde attendu et le solde réel de leur Compte Kiosque.


    **Symptôme décrit par le client**

    « Je pensais avoir plus d''argent sur mon compte » ou « Il manque quelques euros
    sur mon dernier relevé ».


    **Méthodologie de vérification (à suivre dans l''ordre)**


    1. **Vérification des frais de retrait :** Le client a-t-il effectué des retraits
    au distributeur ? Chaque retrait entraîne des frais de 1 €. Si le client a fait
    5 retraits, il y a un écart de 5 €.

    2. **Analyse des dépôts d''espèces :** Le client a-t-il déposé des espèces récemment
    ? Rappelez-lui que chaque dépôt en point de vente partenaire est soumis à des
    frais de 2 %. Vérifiez si le montant crédité correspond bien au montant remis
    moins ces 2 %.

    3. **Contrôle de la cotisation annuelle :** Vérifiez la date d''anniversaire du
    compte. La cotisation annuelle de 24 € a-t-elle été prélevée récemment ?

    4. **Examen des opérations en attente :** Vérifiez s''il existe des autorisations
    de paiement non encore compensées.


    **Résolution et communication**

    - **Si l''écart est dû aux frais :** Expliquez pédagogiquement au client la nature
    des frais (ex: « Les 1 € prélevés correspondent aux frais de retrait au distributeur
    »).

    - **Si l''écart persiste sans explication :** Nous devons escalader la demande
    vers le support centralisé de Kiosque pour une analyse comptable approfondie.


    L''agent doit s''assurer que le client comprend que notre tarification forfaitaire
    et transparente est conçue pour assurer la viabilité du service tout en restant
    abordable. Pour plus de détails sur les frais, référez-vous au document Compte
    Kiosque — grille tarifaire.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 107a98ce-dca1-57ea-87f8-61c764e53e07
  title: Carte Kiosque Voyage — présentation
  body: "Nous avons conçu la Carte Kiosque Voyage pour accompagner ceux qui ne s'arrêtent\
    \ pas aux frontières. Fidèles à notre mission d'accessibilité universelle, nous\
    \ proposons un outil financier qui simplifie vos déplacements internationaux en\
    \ éliminant les frictions liées aux conversions de devises et aux frais cachés.\n\
    \nLa Carte Kiosque Voyage est une solution optimisée pour les voyageurs. Sa principale\
    \ force réside dans sa capacité à supprimer les frais de paiement à l'étranger\
    \ : nous appliquons des frais de paiement de 0 % lors de vos achats dans des devises\
    \ différentes de l'euro. Cela signifie que vous payez le prix réel du produit\
    \ ou du service, sans commission supplémentaire de notre part sur la transaction.\n\
    \nPour les besoins de liquidités, nous avons maintenu un coût opérationnel minimal.\
    \ Chaque retrait d'espèces effectué à l'étranger entraîne des frais de retrait\
    \ de 2 €, regardless du montant retiré. Ce montant forfaitaire nous permet de\
    \ garantir la viabilité du service tout en restant transparents et abordables.\n\
    \nL'accès à ce service est encadré par une cotisation annuelle de 30 €, qui couvre\
    \ la gestion et la maintenance de votre carte tout au long de l'année. \n\nComme\
    \ pour l'ensemble de nos produits, la sécurité est notre priorité. La carte utilise\
    \ l'authentification forte pour tous les paiements en ligne. De plus, elle fonctionne\
    \ sur le principe de la carte à autorisation systématique : le solde de votre\
    \ compte est vérifié en temps réel avant chaque transaction, ce qui vous permet\
    \ de maîtriser votre budget et d'éviter tout découvert.\n\nPour souscrire à cette\
    \ offre, vous devez préalablement détenir un compte au sein de notre institution.\
    \ Nous vous invitons à consulter le document Compte Kiosque — présentation pour\
