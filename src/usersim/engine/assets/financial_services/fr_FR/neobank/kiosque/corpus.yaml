  institution_id: kiosque
- id: 37603dfd-4209-5942-85cf-dcb5cfe9a837
  title: Compte Kiosque 12-17 ans — présentation
  body: 'Bienvenue chez Kiosque. Nous avons conçu le Compte Kiosque 12-17 ans pour
    offrir aux jeunes une première expérience financière sécurisée, inclusive et accessible.
    Notre mission est de permettre l''initiation à l''autonomie bancaire sans les
    barrières traditionnelles, en proposant une ouverture rapide, possible en seulement
    5 minutes dans l''un de nos points de vente agréés, sans condition de revenus
    ni de patrimoine.


    Ce compte est spécifiquement dédié aux adolescents. Pour être éligible, l''utilisateur
    doit avoir un âge minimal de 12 ans. C''est l''outil idéal pour apprendre à gérer
    un budget tout en restant sous la supervision parentale et dans un cadre protégé.


    Pour garantir la viabilité de notre service tout en restant abordable, nous appliquons
    une tarification forfaitaire. Le Compte Kiosque 12-17 ans est soumis à une cotisation
    annuelle de 20 €. Cette transparence tarifaire nous permet de maintenir un réseau
    de points de vente partenaires (bureaux de tabac, marchands de journaux) accueillants
    et efficaces sur tout le territoire français.


    La sécurité et la pédagogie sont au cœur de notre approche. C''est pourquoi nous
    avons mis en place un plafond de paiement hebdomadaire de 150 €. Cette limite
    permet aux jeunes utilisateurs de réaliser leurs achats courants tout en limitant
    les risques d''erreurs de gestion ou de pertes importantes. Le dépassement de
    ce montant rend les transactions suivantes impossibles jusqu''à la réinitialisation
    hebdomadaire du plafond.


    En choisissant Kiosque, vous optez pour une néobanque qui valorise l''accessibilité
    universelle. Nous nous engageons à accompagner les jeunes vers une gestion financière
    responsable avec un langage clair et un support disponible tant sur nos canaux
    numériques que physiquement dans nos points de vente partenaires.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 7e93b749-b84d-56a4-afb3-760a79831ced
