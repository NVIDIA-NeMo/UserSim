- id: 5e277756-2226-5c9e-ab7b-c225eff89d9d
  title: Carte Kiosque Voyage — résilier, clôturer ou changer de formule
  body: 'Si vos besoins évoluent ou si vous souhaitez mettre fin à votre contrat,
    nous avons simplifié la procédure de résiliation et de modification de formule.


    Ce qu''il vous faut avant de commencer :

    - Votre pièce d''identité officielle en cours de validité.

    - Le solde de votre compte doit être à 0 € ou les fonds doivent avoir été transférés
    vers un autre compte.


    Étapes pour résilier ou changer de formule :


    1. Formulez votre demande : Dites-nous simplement si vous souhaitez résilier votre
    Carte Kiosque Voyage, clôturer définitivement votre compte ou passer à une autre
    formule de carte.


    2. Vérification d''identité : Pour votre sécurité, nous vous demanderons de nous
    présenter votre pièce d''identité officielle. Cette étape est obligatoire avant
    toute modification d''information ou opération de clôture.


    3. Confirmation des conditions : Nous vous confirmerons le montant de la cotisation
    annuelle de 30 € déjà perçue et nous vous rappellerons que celle-ci n''est pas
    remboursable au prorata.


    4. Validation finale : Nous procédons à la clôture technique de la carte ou au
    changement de formule. Vous recevrez une confirmation immédiate de l''exécution
    de l''opération.


    C''est terminé. Si vous changez de formule, vos nouveaux avantages (comme les
    frais de paiement à 0 %) seront activés selon les termes de la nouvelle offre.
    Pour comparer nos options, vous pouvez consulter Carte Kiosque Voyage — choisir
    entre les formules.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 38dc114b-7124-569d-8529-62c11c19af47
  title: Carte Kiosque Voyage — frais ou montant inattendu
  body: "Symptôme : Le client constate un débit supérieur au montant de l'achat ou\
    \ un frais non identifié sur son relevé après un voyage.\n\nCauses probables et\
    \ vérifications :\n\n1. Retrait d'espèces : Le client a-t-il effectué un retrait\
    \ au distributeur à l'étranger ? \n- Vérification : Si oui, un frais fixe de 2\
    \ € s'applique systématiquement par retrait. C'est la cause la plus fréquente\
    \ de frais « inattendus ».\n\n2. Cotisation annuelle : La date anniversaire de\
    \ la carte est-elle arrivée ?\n- Vérification : Vérifiez si un débit de 30 € a\
    \ été effectué au titre de la cotisation annuelle.\n\n3. Frais de paiement : Le\
    \ client a-t-il été débité de commissions de change sur un achat ?\n- Vérification\
    \ : La Carte Kiosque Voyage applique des frais de paiement hors zone euro de 0\
    \ %. Si un frais de pourcentage apparaît, il peut s'agir d'un frais appliqué par\
    \ le commerçant lui-même (Dynamic Currency Conversion) et non par Kiosque.\n\n\
    Résolution :\n- Si le frais de 2 € ou de 30 € est justifié, expliquez pédagogiquement\
    \ la nature de ces frais forfaitaires.\n- Si le client conteste un paiement non\
    \ autorisé, nous devons ouvrir un dossier de contestation. Nous rappelons que\
    \ le délai de contestation est de 13 mois.\n\nEscalade :\nSi le montant reste\
    \ inexpliqué après ces vérifications, nous escaladons la demande vers le support\
    \ centralisé de Kiosque pour une analyse approfondie des flux interbancaires.\
    \ Le client sera informé du suivi de son dossier dans les délais réglementaires."
