- id: 17909763-1afe-5af5-83f9-a08a4fe1591b
  title: Compte Kiosque 12-17 ans — choisir entre les formules
  body: 'Il est important de choisir le compte adapté à l''âge et aux besoins de l''utilisateur.
    Voici la comparaison entre le Compte Kiosque 12-17 ans et le Compte Kiosque standard.


    **Compte Kiosque 12-17 ans**

    - **Cible** : Adolescents de 12 à 17 ans.

    - **Coût** : Cotisation annuelle de 20 €.

    - **Contrainte principale** : Plafond de paiement hebdomadaire strict de 150 €
    pour favoriser l''apprentissage budgétaire.

    - **Idéal pour** : Un premier pas vers l''autonomie financière sous la surveillance
    parentale.


    **Compte Kiosque (Standard)**

    - **Cible** : Adultes et populations sous-bancarisées.

    - **Coût** : Se référer à la grille tarifaire générale (voir Compte Kiosque —
    grille tarifaire).

    - **Contrainte principale** : Pas de plafond hebdomadaire fixe, mais soumis aux
    plafonds de sécurité standards.

    - **Idéal pour** : Une gestion financière complète sans restrictions pédagogiques.


    Si l''utilisateur a moins de 18 ans, le Compte Kiosque 12-17 ans est la seule
    option adaptée, offrant un cadre sécurisé et un coût abordable de 20 € par an.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: comparison
  source_authority: official
