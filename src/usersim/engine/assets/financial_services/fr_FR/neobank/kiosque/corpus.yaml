- id: d8d307a4-e356-5e29-919c-b3c453cd74b1
  title: Virement instantané Kiosque — effectuer une modification
  body: 'Ce guide explique comment modifier les informations liées à vos virements
    instantanés, comme la mise à jour d''un bénéficiaire ou l''ajustement d''un virement
    programmé.


    Prérequis : Vous devez disposer de votre pièce d''identité officielle à jour,
    car la vérification d''identité est obligatoire avant toute modification d''information
    sur le compte.


    Étapes pour modifier un bénéficiaire :


    1. Demande de modification : Indiquez-nous quel bénéficiaire vous souhaitez modifier
    en citant son nom actuel.

    2. Fourniture des nouvelles coordonnées : Transmettez-nous les nouvelles informations
    bancaires (IBAN) et le nom exact du bénéficiaire. La précision du nom est essentielle
    pour la sécurité du transfert.

    3. Vérification d''identité : Nous vous demanderons de confirmer votre identité
    via une pièce officielle pour valider que vous êtes bien le titulaire du compte.

    4. Confirmation : Nous vous confirmons que la modification a été prise en compte.
    Vous pouvez désormais effectuer vos transferts vers ce bénéficiaire dans la limite
    de 3 000 € par jour.


    Étapes pour modifier un virement programmé :


    1. Identification du virement : Précisez-nous la date et le montant du virement
    que vous souhaitez modifier.

    2. Ajustement des détails : Indiquez-nous le nouveau montant ou la nouvelle date
    souhaitée.

    3. Validation : Nous traitons la demande et vous confirmons la mise à jour du
    calendrier de paiement.


    Sachez que tout virement déjà exécuté ne peut plus être modifié, car la nature
    même du Virement instantané Kiosque est d''être immédiat et définitif. Pour toute
    autre demande de modification de vos informations personnelles, consultez le document
    Compte Kiosque — effectuer une modification.'
  domain: payments
  product_category: virement_instantane
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2fb5e135-c98a-5bc8-a3a5-31d8e88bf053
  title: Virement instantané Kiosque — problèmes d'accès ou de connexion
  body: "Vous rencontrez des difficultés pour accéder au service de virement ou pour\
    \ finaliser une transaction ? Voici comment diagnostiquer et résoudre le problème.\n\
    \nSymptôme : Le virement est refusé ou l'option de transfert instantané est grisée.\n\
    \nCauses possibles et solutions :\n\n1. Dépassement du plafond quotidien : Vérifiez\
    \ le cumul de vos transferts du jour. Si vous avez déjà atteint la limite de 3\
    \ 000 €, vous ne pourrez plus effectuer de virement instantané avant le lendemain.\
    \ \n   - Fix : Attendez le renouvellement quotidien du plafond.\n\n2. Problème\
    \ d'authentification forte : Le service nécessite une validation sécurisée. Si\
    \ vous ne recevez pas vos codes ou si l'application ne valide pas l'opération,\
    \ le transfert sera bloqué.\n   - Fix : Vérifiez votre connexion internet et assurez-vous\
    \ que vos informations de contact sont à jour.\n\n3. Identité non vérifiée : Si\
    \ vous avez récemment modifié vos informations personnelles, vos accès aux virements\
    \ peuvent être restreints jusqu'à validation de votre pièce d'identité.\n   -\
    \ Fix : Fournissez-nous une copie lisible de votre pièce officielle pour rétablir\
    \ vos accès.\n\n4. Erreur de coordonnées bénéficiaire : Si le nom du bénéficiaire\
    \ ne correspond pas à l'IBAN saisi, notre système de sécurité peut bloquer l'opération\
    \ pour éviter une erreur de destination.\n   - Fix : Vérifiez l'orthographe exacte\
    \ du nom du bénéficiaire et relancez l'opération.\n\nQuand escalader le problème\
    \ ?\nSi aucune de ces étapes ne résout votre situation, nous prendrons le relais.\
    \ Nous ouvrirons un dossier technique auprès de notre support centralisé pour\
    \ analyser l'échec de la transaction. Vous recevrez une notification dès que la\
    \ situation sera rétablie ou si des informations complémentaires sont nécessaires.\n\
    \nPour d'autres types de blocages liés à votre compte, consultez le document Compte\
    \ Kiosque — opération refusée ou bloquée."
  domain: payments
  product_category: virement_instantane
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
