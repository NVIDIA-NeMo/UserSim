- id: b0a8f8f9-9079-516f-b709-c4332bca8b7b
  title: Compte Kiosque 12-17 ans — souscrire et activer
  body: 'Ouvrir un Compte Kiosque 12-17 ans est un processus simplifié, conçu pour
    être rapide et sans stress. Que vous soyez dans un point de vente partenaire ou
    via nos canaux numériques, voici la marche à suivre.


    **Prérequis avant de commencer**

    Avant toute démarche, assurez-vous d''avoir en votre possession :

    - Une pièce d''identité officielle en cours de validité pour l''adolescent (âge
    minimal de 12 ans).

    - Une pièce d''identité officielle du représentant légal.

    - Le justificatif de domicile actuel.


    **Étapes de souscription et d''activation**


    1. **Demande d''ouverture** : Présentez-vous dans un point de vente agréé (bureau
    de tabac ou marchand de journaux) ou initiez la demande via notre canal numérique.
    Précisez que vous souhaitez ouvrir un Compte Kiosque 12-17 ans.

    2. **Vérification d''identité** : Remettez les pièces d''identité officielles
    demandées. Nous procédons à la vérification obligatoire de l''identité avant toute
    création de compte, conformément à nos règles de sécurité.

    3. **Validation du profil** : Nous confirmons avec vous les informations de contact
    et l''acceptation des conditions tarifaires, notamment la cotisation annuelle
    de 20 €.

    4. **Confirmation d''ouverture** : Nous validons l''ouverture du compte. Cette
    étape prend généralement 5 minutes dans nos points de vente.

    5. **Activation** : Une fois le compte créé, nous vous envoyons une notification
    de confirmation. Votre compte est alors actif, avec son plafond de paiement hebdomadaire
    de 150 € opérationnel.


    Vous savez que l''opération a réussi lorsque vous recevez le message de confirmation
    d''activation et que vous pouvez accéder à l''historique de vos opérations.


    Pour plus de détails sur les critères d''accès, vous pouvez consulter Compte Kiosque
    12-17 ans — conditions d''éligibilité.'
