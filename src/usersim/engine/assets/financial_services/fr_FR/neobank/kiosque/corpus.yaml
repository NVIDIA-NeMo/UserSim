- id: d90ecb3d-03c0-5a80-8beb-ee284282d1f0
  title: Carte Kiosque Voyage — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux agents du support pour l''assistance technique
    liée à la Carte Kiosque Voyage. Il détaille les contraintes opérationnelles et
    les frais fixes appliqués au produit.


    **Restrictions d''utilisation**

    La Carte Kiosque Voyage est soumise à une vérification d''identité obligatoire
    via une pièce officielle avant toute modification d''information ou opération
    sensible sur le compte associé. L''authentification forte est systématiquement
    appliquée pour sécuriser l''ensemble des paiements effectués en ligne, sans exception.


    **Structure des coûts opérationnels**

    Le produit suit une tarification forfaitaire et transparente pour garantir la
    viabilité du service :

    - Cotisation annuelle : 30 €

    - Frais de paiement à l''étranger : 0 %

    - Frais de retrait d''espèces à l''étranger : 2 €


    **Cas particuliers et points de vigilance**

    Le montant de 2 € pour les retraits reflète les coûts opérationnels des réseaux
    de distributeurs partenaires. Il est important de préciser aux clients que si
    les paiements sont gratuits (0 %), chaque retrait d''espèces engendre ce coût
    fixe, quel que soit le montant retiré.


    L''institution opère sous la supervision de l''ACPR et de la Banque de France.
    Pour la banque de détail, la protection est assurée par le FGDR, tandis que pour
    les services de paiement, les fonds sont sécurisés par un système de cantonnement
    auprès d''une banque partenaire, isolant ainsi les fonds des clients des fonds
    propres de Kiosque.'
