- id: 04a4fb0b-fbcf-5514-b90b-53de773378ab
  title: Compte Kiosque 12-17 ans — opération échouée ou en attente
  body: 'Il arrive qu''une opération de paiement ou un retrait soit refusé sur un
    Compte Kiosque 12-17 ans. Voici comment identifier la cause et résoudre le problème.


    **Symptôme : Le paiement est refusé au moment de l''achat**


    **Causes probables et vérifications :**

    1. **Solde insuffisant** : Vérifiez d''abord que le solde disponible est supérieur
    au montant de l''achat. S''agissant d''une gestion sécurisée pour les jeunes,
    le découvert est interdit.

    2. **Dépassement du plafond hebdomadaire** : C''est la cause la plus fréquente.
    Le Compte Kiosque 12-17 ans possède un plafond de paiement hebdomadaire de 150
    €. Si la somme de vos achats depuis le début de la semaine atteint ce montant,
    toute nouvelle transaction sera bloquée.

    3. **Problème de carte** : Vérifiez que la carte n''est pas physiquement endommagée
    ou que le code PIN n''a pas été saisi incorrectement trois fois.


    **Comment résoudre la situation ?**

    - Si le solde est insuffisant, demandez un virement vers votre compte.

    - Si le plafond de 150 € est atteint, il n''est pas possible d''augmenter cette
    limite manuellement. Vous devez attendre la réinitialisation automatique du plafond
    au début de la semaine suivante.

    - Si la carte est bloquée, demandez-nous de procéder à un déblocage après vérification
    de votre identité.


    **Quand escalader la demande ?**

    Si votre solde est suffisant, que vous n''avez pas atteint le plafond de 150 €
    et que l''opération échoue toujours, nous ouvrirons un ticket d''incident auprès
    de notre support centralisé. Nous analyserons la transaction et vous recevrez
    une notification de résolution sous 48 heures ouvrées.


    Pour mieux comprendre les restrictions de votre compte, consultez Compte Kiosque
    12-17 ans — plafonds, restrictions et cas particuliers.'
