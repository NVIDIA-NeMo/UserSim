- id: ed16c14c-31f1-551e-8dd7-e4119bceb48f
  title: Carte Kiosque Voyage — écart avec vos relevés
  body: 'Ce document aide les agents à résoudre les demandes de clients signalant
    un écart entre le montant d''un achat et le débit constaté sur leur relevé Carte
    Kiosque Voyage.


    **Symptôme**

    Le client affirme que le montant débité ne correspond pas au prix affiché lors
    de l''achat à l''étranger, ou qu''il voit des frais qu''il n''avait pas anticipés.


    **Causes probables et points de contrôle**

    1. **Frais de retrait d''espèces** : Vérifiez si l''opération est un retrait au
    distributeur. Si c''est le cas, un montant fixe de 2 € s''ajoute au montant retiré.
    Le client peut confondre ce frais opérationnel avec une erreur de calcul.

    2. **Délai de traitement (Date de valeur)** : Le montant d''une transaction peut
    apparaître comme « en attente » avant d''être définitivement débité. Le montant
    final peut légèrement varier selon le taux de change appliqué au moment du règlement
    interbancaire, bien que Kiosque ne prenne aucune commission supplémentaire (0
    % de frais de paiement).

    3. **Frais de distributeurs tiers** : Certains distributeurs étrangers (Surcharge
    fees) appliquent leurs propres frais indépendamment de Kiosque. Ces frais apparaissent
    sur le relevé mais ne sont pas prélevés par nous.


    **Résolution**

    - Expliquez au client que les frais de 2 € sont systématiques pour tout retrait
    d''espèces à l''étranger.

    - Confirmez que Kiosque n''a appliqué aucun frais de paiement supplémentaire (0
    %), conformément à la promesse du produit.

    - Si l''écart persiste et semble être une erreur technique, nous ouvrons un dossier
    d''analyse.


    **Escalade**

    Si le client maintient qu''il s''agit d''une opération non autorisée, rappelez-lui
    qu''il peut initier une contestation dans un délai de 13 mois. Nous transmettons
    alors la demande au support centralisé pour remboursement selon les délais réglementaires.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: troubleshooting
  source_authority: official
