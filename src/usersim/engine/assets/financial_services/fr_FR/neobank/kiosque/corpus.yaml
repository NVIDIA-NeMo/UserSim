  institution_id: kiosque
- id: 00c4314b-fec2-59ff-8d56-fa403209959f
  title: Compte Kiosque — informations sur les risques
  body: 'L''utilisation du Compte Kiosque s''effectue dans un cadre réglementaire
    strict visant à protéger les fonds de nos clients et à assurer la stabilité du
    service.


    **Supervision et Conformité**

    L''institution Kiosque opère sous la supervision directe de l''ACPR (Autorité
    de contrôle prudentiel et de résolution) et de la Banque de France. Nous nous
    engageons à respecter scrupuleusement les dispositions du Code monétaire et financier
    français, notamment en matière de lutte contre le blanchiment et le financement
    du terrorisme.


    **Protection des dépôts**

    La sécurité de vos fonds est organisée selon deux mécanismes distincts selon la
    nature du service :

    1. **Banque de détail** : La protection est assurée par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR), conformément aux plafonds et conditions légales
    en vigueur.

    2. **Services de paiement** : Nous appliquons le principe du cantonnement des
    fonds. Cela signifie que vos fonds sont déposés auprès d''un établissement de
    crédit partenaire et sont strictement séparés des fonds propres de l''entreprise
    Kiosque. En cas de difficulté financière de Kiosque, vos fonds restent protégés
    et distincts.


    **Limites de responsabilité**

    Bien que nous appliquions l''authentification forte et une vérification d''identité
    rigoureuse, la responsabilité du client est engagée en cas de négligence grave
    (ex: partage volontaire des codes secrets). Nous rappelons que le délai de contestation
    pour les opérations non autorisées est de 13 mois.


    Nous fournissons ces informations à vocation éducative et descriptive. Nous ne
    délivrons aucun conseil fiscal ou juridique individualisé.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 30fec548-e416-5dff-852c-8b023dc0c659
  title: Compte Kiosque — calcul et application des taux
  body: 'Le Compte Kiosque repose sur un modèle de tarification forfaitaire et transparente.
    Contrairement aux structures complexes, nous n''appliquons pas de taux progressifs
    ou de paliers basés sur le solde du compte.


    **Application des frais fixes**

    - **Cotisation annuelle** : Un montant unique de 24 € est appliqué annuellement
    pour la tenue du compte.

    - **Retraits ATM** : Chaque opération de retrait d''espèces via un distributeur
    automatique est facturée 1 €, quel que soit le montant retiré.


    **Application des frais proportionnels**

    - **Dépôts d''espèces** : Un taux forfaitaire de 2 % est appliqué sur chaque montant
    déposé dans nos points de vente partenaires. Ce taux est calculé sur la valeur
    nominale du dépôt et est prélevé pour couvrir les coûts opérationnels du partenaire.


    Ces tarifs sont fixes pour l''ensemble des utilisateurs du produit et ne sont
    soumis à aucune variation selon le profil du client ou le volume de transactions.
    Pour toute question sur la facturation d''une opération spécifique, veuillez consulter
    Compte Kiosque — frais ou montant inattendu.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2bc13416-3958-5c93-90cc-f39d63dcc49a
  title: Compte Kiosque — offre de parrainage et de fidélité
  body: 'Nous sommes ravis de vous accueillir chez Kiosque ! Pour remercier notre
    communauté et encourager l''accessibilité bancaire, nous lançons notre programme
    de fidélité et de parrainage.


    Du 1er juin 2024 au 31 août 2024, pour chaque nouvel utilisateur que vous parrainez
    et qui ouvre un Compte Kiosque, nous vous offrons une prime de fidélité de 10
    €. Le parrainé reçoit également 10 € dès la validation de son identité et l''activation
    de son compte.


    Le Compte Kiosque reste l''option la plus simple pour accéder aux services financiers,
    avec une ouverture en seulement 5 minutes et sans condition de revenus. Profitez-en
    pour faire découvrir à vos proches une banque inclusive où la transparence est
    la règle : une cotisation annuelle de 24 € et des frais de retrait au distributeur
    de 1 €.


    Pour en bénéficier, transmettez simplement votre code de parrainage à votre proche
    avant sa visite en point de vente agréé. Nous nous occupons du reste dès que le
    nouveau compte est actif.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 873fd43f-6ee5-5879-b9ba-3cade343ff87
  title: Compte Kiosque — bonnes pratiques de sécurité du compte
  body: 'Chez Kiosque, nous attachons une importance capitale à la protection de vos
    fonds. Pour garantir la sécurité de votre Compte Kiosque, nous vous recommandons
    d''appliquer rigoureusement les bonnes pratiques suivantes.


    L''authentification forte est la pierre angulaire de notre système. Elle est systématiquement
    appliquée pour sécuriser tous vos paiements en ligne. Ne partagez jamais vos codes
    secrets ou vos identifiants de connexion avec qui que ce soit, même si la personne
    prétend travailler pour nous. Nous ne vous demanderons jamais votre mot de passe
    par SMS ou par e-mail.


    Soyez vigilants face aux tentatives de phishing. Les fraudeurs peuvent tenter
    de vous rediriger vers de faux sites imitant notre interface. Vérifiez toujours
    l''adresse URL avant de saisir vos informations. En cas de doute, nous vous invitons
    à nous contacter directement via nos canaux numériques officiels ou en vous rendant
    dans l''un de nos points de vente partenaires.


    Sachez que la vérification de l''identité via une pièce officielle est obligatoire
    avant toute modification d''information ou opération sensible sur le compte. C''est
    une sécurité supplémentaire qui empêche un tiers d''agir à votre place.


    Si vous constatez une opération que vous n''avez pas autorisée, nous appliquons
    une politique de protection rigoureuse. Vous disposez d''un délai de contestation
    de 13 mois pour nous signaler l''anomalie. Une fois la notification reçue, nous
    intervenons rapidement : le remboursement intervient selon les délais réglementaires,
    généralement dès le premier jour ouvré suivant la notification.


    En cas de perte ou de vol de vos moyens de paiement, demandez-nous immédiatement
    le blocage de vos accès. La réactivité est le meilleur rempart contre la fraude.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 25e85ca4-1210-5f3f-9ceb-b3f016c08fe3
  title: Compte Kiosque — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales applicables au Compte Kiosque. En choisissant notre institution, vous
    acceptez que nous puissions adapter nos services pour garantir la viabilité et
    l''accessibilité de notre modèle.


    Nous nous engageons à une transparence totale sur nos tarifs. Actuellement, le
    Compte Kiosque est soumis à une cotisation forfaitaire annuelle de 24 €. Toute
    modification de ce montant, ou l''introduction de nouveaux frais, fera l''objet
    d''une notification préalable. Nous vous informerons de tout changement tarifaire
    au moins deux mois avant son entrée en vigueur.


    Les frais opérationnels liés aux points de vente partenaires sont également susceptibles
    d''évoluer. À titre d''exemple, les frais de dépôt d''espèces sont actuellement
    fixés à 2 %, reflétant les coûts réels supportés par nos partenaires (bureaux
    de tabac, marchands de journaux). Si ces coûts venaient à changer, nous ajusterions
    ce pourcentage et vous en informerions dans les délais légaux.


    En cas de modification des conditions générales, nous vous notifierons par le
    canal de communication privilégié lors de l''ouverture de votre compte. Si vous
    refusez les nouvelles conditions, vous disposez du droit de clôturer votre compte
    sans frais supplémentaires, sous réserve du paiement des sommes dues jusqu''à
    la date de clôture.


    Le Compte Kiosque étant une carte à autorisation systématique, les conditions
    interdisant tout découvert restent inchangées. Toute modification des plafonds
    ou des règles de fonctionnement du compte doit être validée après une vérification
    rigoureuse de votre pièce d''identité officielle, conformément à notre posture
    de conformité supervisée par l''ACPR et la Banque de France.


    Pour consulter l''intégralité de vos obligations et des nôtres, nous vous invitons
    à vous référer au document Compte Kiosque — conditions générales.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 6151cdcb-e3a5-5646-a82c-acdd6c2ef3f9
  title: Compte Kiosque — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner les nouveaux
    clients dans l''activation et les premières étapes d''utilisation du Compte Kiosque.
    L''objectif est de garantir une expérience fluide et rapide, fidèle à notre promesse
    d''accessibilité.


    1. Ouverture du compte :

    Le client se rend dans un point de vente agréé (bureau de tabac, marchand de journaux).
    L''ouverture est extrêmement rapide : elle s''effectue en 5 minutes. L''agent
    doit confirmer qu''aucune condition de revenus ni de patrimoine n''est requise,
    rendant le compte universellement accessible.


    2. Vérification d''identité :

    L''étape cruciale est la présentation d''une pièce d''identité officielle en cours
    de validité. Sans ce document, aucune opération ni modification d''information
    ne peut être initiée. L''agent doit valider l''identité du client avant de finaliser
    l''ouverture.


    3. Premier dépôt et alimentation :

    Le client peut alimenter son compte immédiatement. S''il choisit le dépôt d''espèces
    en point de vente, informez-le que des frais de 2 % sont appliqués pour couvrir
    les coûts opérationnels du partenaire. Pour les retraits futurs, précisez que
    chaque retrait au distributeur entraîne des frais de 1 €.


    4. Explication des frais récurrents :

    L''agent doit mentionner clairement la cotisation annuelle de 24 €. Ce forfait
    assure la viabilité du service tout en restant abordable pour tous les profils
    de clients.


    5. Activation des services numériques :

    Une fois le compte ouvert, le client accède aux canaux numériques. L''agent doit
    s''assurer que le client comprend le fonctionnement de l''authentification forte,
    obligatoire pour tous les paiements en ligne afin de sécuriser les fonds.


    Pour plus de détails sur les aspects réglementaires, veuillez consulter Compte
    Kiosque — informations réglementaires.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 49337d3a-3cb7-5e04-aa46-d9cdfbb69d87
  title: 'Compte Kiosque — frais de retrait au distributeur en zone euro : explications'
  body: "Questions fréquentes sur les retraits d'espèces avec le Compte Kiosque.\n\
    \n**Combien coûtent les retraits au distributeur en zone euro ?**\nChaque retrait\
    \ d'espèces effectué dans un distributeur automatique de billets (DAB) en zone\
    \ euro entraîne des frais fixes de 1 €. \n\n**Pourquoi Kiosque applique-t-il ces\
    \ frais ?**\nNous adoptons une tarification forfaitaire et transparente. Ces frais\
    \ de 1 € nous permettent de maintenir un service accessible à tous tout en assurant\
    \ la viabilité opérationnelle de notre infrastructure bancaire.\n\n**Le montant\
    \ du retrait influence-t-il le prix ?**\nNon, les frais sont fixes. Que vous retiriez\
    \ un petit ou un gros montant, le coût reste de 1 € par opération.\n\nPour une\
    \ vue d'ensemble de l'ensemble de nos tarifs, nous vous invitons à consulter le\
    \ document Compte Kiosque — grille tarifaire."
