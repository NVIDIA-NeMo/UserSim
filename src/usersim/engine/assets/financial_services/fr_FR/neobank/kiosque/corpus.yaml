  institution_id: kiosque
- id: 574f878b-a20f-5cf4-b546-36c5042d2321
  title: 'Virement instantané Kiosque — plafond quotidien de virement : explications'
  body: 'Question : Quel est le montant maximum que je peux envoyer par jour avec
    le virement instantané ?

    Réponse : Nous avons mis en place un plafond quotidien de virement de 3 000 €.
    Cela signifie que la somme cumulée de tous vos virements instantanés sur une seule
    journée civile ne peut pas excéder ce montant.


    Question : Que se passe-t-il si je tente de dépasser ce plafond ?

    Réponse : L''opération sera refusée. Nous vous invitons à fractionner vos envois
    sur plusieurs jours ou à vérifier si vos besoins peuvent être couverts par d''autres
    modes de paiement. Ce plafond est une mesure de sécurité visant à protéger vos
    fonds.


    Question : Ce plafond est-il modifiable ?

    Réponse : Pour garantir la rapidité d''exécution et la sécurité de tous, ce plafond
    de 3 000 € est fixe pour l''ensemble de nos clients. Pour plus d''informations
    sur les frais associés, consultez Virement instantané Kiosque — frais du virement
    instantané : explications.'
  domain: payments
  product_category: virement_instantane
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: be2a320e-0d45-58bf-838f-f2e1fdab2c3e
  title: Virement instantané Kiosque — résilier, clôturer ou changer de formule
  body: 'Le Virement instantané Kiosque est une fonctionnalité native et gratuite
    associée à votre compte. Il n''existe pas d''abonnement spécifique à résilier
    pour ce service seul, car il n''engendre aucun frais fixe. Cependant, si vous
    souhaitez modifier votre mode de gestion ou clôturer l''accès à vos services,
    voici la marche à suivre.


    Pour désactiver l''usage des virements instantanés :

    1. Indiquez-nous votre volonté de restreindre les capacités de transfert de votre
    compte.

    2. Nous procéderons à la mise à jour de vos préférences de sécurité.

    3. Vous recevrez une confirmation numérique indiquant que les virements instantanés
    ne sont plus autorisés sur votre profil.


    Pour changer de formule de compte (ce qui peut impacter vos plafonds) :

    1. Précisez-nous la nouvelle formule souhaitée parmi nos offres disponibles.

    2. Nous vérifierons l''éligibilité de votre compte et l''exactitude de vos informations
    d''identité.

    3. Nous vous confirmerons le changement de formule et les éventuels nouveaux plafonds
    applicables.


    Pour clôturer définitivement votre compte et l''accès au Virement instantané Kiosque
    :

    1. Demandez-nous la clôture complète de votre compte Kiosque.

    2. Assurez-vous que le solde de votre compte est à 0 € ou indiquez-nous le compte
    vers lequel transférer vos fonds restants (en respectant le plafond quotidien
    de 3 000 €).

    3. Nous validerons votre demande après vérification de votre identité via une
    pièce officielle.

    4. Vous recevrez un avis de clôture définitive confirmant la fin de tous vos services,
    y compris les capacités de virement.


    Pour toute question sur la fermeture d''un compte spécifique pour mineur, veuillez
    vous référer à Compte Kiosque 12-17 ans — résilier, clôturer ou changer de formule.'
  domain: payments
  product_category: virement_instantane
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: a2f4024b-220f-57af-bf0a-1e9cf01658ed
  title: Virement instantané Kiosque — frais ou montant inattendu
  body: 'Il arrive qu''un client constate un montant débité différent de celui prévu
    ou la présence de frais sur son relevé alors qu''il a utilisé le virement instantané.
    Voici comment analyser la situation.


    Symptôme : « J''ai effectué un virement instantané et je vois des frais prélevés
    sur mon compte ».


    Causes possibles et vérifications :

    1. Vérification du service utilisé : Assurez-vous qu''il s''agit bien d''un Virement
    instantané Kiosque. Les frais de virement instantané sont de 0 €. Si des frais
    apparaissent, il se peut que vous ayez utilisé un autre service de transfert ou
    une option spécifique d''un autre établissement.

    2. Frais de compte globaux : Les frais constatés ne sont peut-être pas liés au
    virement lui-même, mais à la cotisation forfaitaire de votre compte. Nous vous
    invitons à consulter Compte Kiosque — frais de dépôt d''espèces en point de vente
    : explications pour comprendre les coûts opérationnels liés aux points de vente.

    3. Erreur de saisie du montant : Vérifiez le montant exact saisi lors de l''opération.
    Le virement étant instantané, toute erreur de montant est immédiatement effective.


    Résolution :

    - Si vous constatez que des frais de 0 € n''ont pas été appliqués et qu''une somme
    injustifiée a été prélevée pour l''exécution du virement, demandez-nous une analyse
    de la transaction.

    - Nous vérifierons l''historique de l''opération et l''application de la grille
    tarifaire.

    - En cas d''erreur technique, nous procéderons à la régularisation du montant
    sur votre compte dans les plus brefs délais.


    Quand escalader :

    Si le montant inattendu concerne une fraude suspectée ou une opération non autorisée,
    nous ouvrirons immédiatement un dossier de contestation. Vous bénéficiez d''un
    délai de 13 mois pour contester l''opération. Le remboursement, si la fraude est
    confirmée, intervient généralement dès le premier jour ouvré suivant la notification.'
  domain: payments
  product_category: virement_instantane
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 79f0c981-5e01-5e81-9fcd-3ed3af2d5605
  title: Virement instantané Kiosque — justificatifs à fournir
  body: 'L''accès au Virement instantané Kiosque est conditionné par la validation
    préalable de votre identité. Voici les justificatifs requis selon votre situation
    :


    | Profil Client | Justificatif Obligatoire | Résultat de la vérification |

    | :--- | :--- | :--- |

    | Nouveau Client | Pièce d''identité officielle en cours de validité (CNI, Passeport)
    | Activation du compte et accès aux virements |

    | Client Existant | Aucune pièce supplémentaire (si identité déjà vérifiée) |
    Accès immédiat au service |

    | Modification de coordonnées | Pièce d''identité officielle + Justificatif de
    domicile récent | Mise à jour du profil et maintien des accès |

    | Mineur (12-17 ans) | Pièce d''identité du mineur + Accord parental signé | Accès
    restreint selon le plafond hebdomadaire du compte ado |


    L''authentification forte est systématiquement appliquée lors de chaque paiement
    en ligne ou transfert pour garantir que vous seul pouvez utiliser vos fonds.'
  domain: payments
