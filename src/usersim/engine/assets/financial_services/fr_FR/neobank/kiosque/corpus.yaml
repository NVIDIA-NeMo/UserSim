- id: e8a72343-8d6b-5cdb-a0ad-39d55f74e52e
  title: Compte Kiosque 12-17 ans — prise en main pas à pas
  body: 'Le Compte Kiosque 12-17 ans est conçu pour offrir une initiation financière
    sécurisée et accessible. Voici la marche à suivre pour une prise en main réussie.


    **1. Éligibilité et Ouverture**

    L''ouverture est possible dès l''âge de 12 ans. Pour ouvrir le compte, le futur
    titulaire et son représentant légal doivent se rendre dans un point de vente agréé
    (comme un bureau de tabac ou un marchand de journaux). Une pièce d''identité officielle
    est obligatoire pour l''adolescent et le parent.


    **2. Activation et Coûts**

    Une fois l''identité vérifiée, le compte est activé quasi instantanément. Le coût
    du service est simple et transparent : une cotisation annuelle de 20 €. Ce forfait
    assure la maintenance du compte et l''accès aux services numériques de Kiosque.


    **3. Maîtrise des Dépenses**

    Pour accompagner l''apprentissage de la gestion budgétaire, le compte est assorti
    d''un plafond de paiement hebdomadaire de 150 €. Ce montant maximum inclut tous
    les paiements et retraits effectués sur une semaine glissante. Si le plafond est
    atteint, les transactions suivantes seront refusées jusqu''au début de la semaine
    suivante.


    **4. Utilisation Quotidienne**

    L''adolescent peut utiliser sa carte pour ses achats courants. Nous recommandons
    l''utilisation des canaux numériques pour suivre le solde en temps réel. Pour
    toute modification d''information ou opération complexe, nous demandons systématiquement
    une nouvelle vérification d''identité pour garantir la sécurité du mineur.


    Ce produit s''inscrit dans notre volonté d''accessibilité universelle, sans condition
    de revenus ni de patrimoine pour l''ouverture.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: c16b78a3-6553-54e0-a1a5-305239b7b556
  title: 'Compte Kiosque 12-17 ans — plafond de paiement hebdomadaire : explications'
  body: 'Voici les réponses aux questions les plus fréquentes concernant la limite
    de paiement du Compte Kiosque 12-17 ans.


    **Quel est le montant du plafond hebdomadaire ?**

    Le plafond de paiement hebdomadaire est fixé à 150 €. Cela signifie que la somme
    totale des paiements et retraits ne peut excéder 150 € sur une période de sept
    jours.


    **Pourquoi imposer une telle limite ?**

    Ce plafond est une mesure de sécurité et un outil pédagogique. Il permet aux jeunes
    de 12 à 17 ans d''apprendre à gérer un budget limité et protège le compte contre
    des dépenses excessives ou accidentelles.


    **Est-il possible d''augmenter ce plafond de 150 € ?**

    Non, ce plafond est fixe pour l''ensemble des comptes de cette catégorie afin
    de garantir une gestion sécurisée et homogène pour tous nos jeunes utilisateurs.
    Pour des besoins plus importants, nous vous invitons à consulter la structure
    du Compte Kiosque standard pour les adultes.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 825c986d-0ff5-524b-bed2-a5e94917f8a9
  title: Compte Kiosque 12-17 ans — effectuer une modification
  body: 'Pour garantir la protection des mineurs et la sécurité des fonds, toute modification
    d''information sur un Compte Kiosque 12-17 ans suit un processus de vérification
    strict. Voici comment procéder pour modifier vos informations (adresse, téléphone,
    etc.).


    **Prérequis**

    Vous devez disposer d''une pièce d''identité officielle en cours de validité pour
    le titulaire du compte et, le cas échéant, pour le représentant légal.


    **Étapes de modification**

    1. **Demande de modification** : Indiquez-nous précisément l''information que
    vous souhaitez mettre à jour (par exemple : « Je souhaite changer l''adresse postale
    associée au compte »).

    2. **Vérification d''identité** : Nous vous demanderons de nous fournir une copie
    ou de présenter l''original de votre pièce d''identité officielle. Cette étape
    est obligatoire avant toute modification d''information ou opération sur le compte.

    3. **Saisie des nouvelles données** : Une fois l''identité confirmée, communiquez-nous
    la nouvelle information à enregistrer. Nous vous demanderons de confirmer l''exactitude
    des données saisies.

    4. **Confirmation de mise à jour** : Nous traitons la demande et vous envoyons
    une confirmation immédiate dès que la modification est effective dans nos systèmes.


    **Comment savoir si cela a fonctionné ?**

    Vous recevrez un message de confirmation écrit. Vous pourrez également constater
    le changement lors de votre prochaine consultation de vos informations de profil.
    En cas de doute, vous pouvez nous demander de vous confirmer les informations
    actuellement enregistrées après une nouvelle vérification d''identité.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 9ebefbb0-0879-5def-97c0-b627c590e3af
  title: Compte Kiosque 12-17 ans — problèmes d'accès ou de connexion
  body: 'Si vous rencontrez des difficultés pour accéder à votre Compte Kiosque 12-17
    ans, nous vous aidons à identifier la cause et à rétablir l''accès rapidement.


    **Symptômes courants**

    - Message d''erreur lors de la connexion.

    - Identifiants refusés alors qu''ils semblent corrects.

    - Accès bloqué après plusieurs tentatives infructueuses.


    **Causes possibles et vérifications**

    1. **Erreur de saisie** : Vérifiez que les majuscules et minuscules sont respectées.
    Un simple espace involontaire peut bloquer l''accès.

    2. **Compte temporairement suspendu** : Pour des raisons de sécurité, nous bloquons
    l''accès après plusieurs tentatives de connexion erronées.

    3. **Pièce d''identité expirée** : Si vos documents de vérification ne sont plus
    à jour, certaines fonctionnalités d''accès peuvent être restreintes.


    **Résolution du problème**

    - **Réinitialisation** : Demandez-nous de réinitialiser vos accès. Nous procéderons
    d''abord à une vérification d''identité via une pièce officielle, car cette étape
    est obligatoire pour toute opération sur le compte.

    - **Mise à jour documentaire** : Si le blocage est dû à une pièce d''identité
    expirée, fournissez-nous le nouveau document officiel pour débloquer la situation.


    **Quand escalader la demande ?**

    Si malgré la vérification d''identité et la réinitialisation, l''accès reste impossible,
    nous escaladons votre dossier vers notre support centralisé de Kiosque. Un spécialiste
    analysera l''incident technique. Vous recevrez une notification dès que le problème
    sera résolu, généralement sous 48 heures ouvrées.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 6251c4cc-b8bc-5a81-b486-b5babe4ae7fa
  title: Compte Kiosque 12-17 ans — niveaux d'accès
  body: 'Ce tableau définit les conditions d''accès et les droits associés pour l''ouverture
    d''un Compte Kiosque 12-17 ans.


    | Condition d''âge | Résultat d''éligibilité | Niveau d''accès & Restrictions
    |

    | :--- | :--- | :--- |

    | Moins de 12 ans | Non éligible | Accès refusé pour ce produit. |

    | Entre 12 et 17 ans | Éligible | Accès complet au compte, soumis à la validation
    d''un représentant légal. Plafond de paiement hebdomadaire de 150 €. |

    | 18 ans et plus | Non éligible | Doit s''orienter vers le Compte Kiosque standard
