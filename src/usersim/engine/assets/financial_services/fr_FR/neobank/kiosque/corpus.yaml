  institution_id: kiosque
- id: b6492e0b-04a0-5763-8dec-0b47ec42b89f
  title: Virement instantané Kiosque — coûts et frais
  body: 'Voici les réponses aux questions les plus fréquentes concernant la tarification
    du Virement instantané Kiosque.


    Combien coûte l''envoi d''un virement instantané ?

    L''exécution d''un virement instantané chez nous est totalement gratuite. Les
    frais sont de 0 €, conformément à notre volonté de rendre les services bancaires
    accessibles à tous.


    Y a-t-il des frais cachés ou des commissions selon le montant ?

    Non, nous adoptons une tarification forfaitaire et transparente. Quel que soit
    le montant envoyé, vous ne paierez aucun frais de traitement pour ce service.


    Existe-t-il une limite au montant que je peux envoyer gratuitement ?

    Oui, pour sécuriser vos transactions, nous appliquons un plafond quotidien de
    transfert de 3 000 €. Ce montant maximum est disponible chaque jour sans frais
    supplémentaires.


    Pour plus d''informations sur l''ensemble de nos tarifs, vous pouvez consulter
    le document Frais et tarifs de l''établissement.'
