- id: c2373607-5e13-58b9-9edd-c24a16490e4d
  title: Compte Kiosque 12-17 ans — informations réglementaires
  body: 'Le Compte Kiosque 12-17 ans est un service financier opéré sous la supervision
    rigoureuse de l''ACPR et de la Banque de France. Nous respectons strictement l''ensemble
    des dispositions du Code monétaire et financier en vigueur en France.


    **Protection des fonds**

    La sécurité des fonds déposés est notre priorité absolue. Nous appliquons deux
    mécanismes de protection :

    1. **Le cantonnement** : Les fonds des clients sont déposés auprès d''un établissement
    de crédit partenaire. Ils sont ainsi strictement distincts des fonds propres de
    l''entreprise Kiosque, garantissant que vos avoirs restent disponibles même en
    cas de difficulté opérationnelle de notre institution.

    2. **La garantie FGDR** : Pour la partie banque de détail, la protection est assurée
    par le Fonds de Garantie des Dépôts et de Résolution (FGDR), conformément aux
    plafonds réglementaires.


    **Sécurité et Authentification**

    L''authentification forte est systématiquement appliquée pour sécuriser tous les
    paiements en ligne effectués avec le compte. Par ailleurs, nous rappelons que
    la vérification de l''identité via une pièce officielle est obligatoire avant
    toute modification d''information personnelle ou toute opération sensible sur
    le compte.


    **Tarification et Plafonds**

    Nous nous engageons à une transparence totale. Le compte est soumis à une cotisation
    annuelle de 20 €. Pour la protection du mineur, un plafond de paiement hebdomadaire
    de 150 € est appliqué de manière irrévocable durant la période de détention du
    compte ado.


    Kiosque fournit des informations à vocation éducative. Nous ne délivrons aucun
    conseil fiscal ou juridique individualisé.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: disclosure
  source_authority: official
