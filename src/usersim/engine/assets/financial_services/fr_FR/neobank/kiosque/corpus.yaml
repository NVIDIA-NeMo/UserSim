- id: bb6971f6-c234-501c-b4c5-ee8938ea9ff0
  title: Carte Kiosque Voyage — souscrire et activer
  body: 'L''obtention de votre Carte Kiosque Voyage est un processus simple et rapide,
    conçu pour être accessible à tous, sans condition de revenus.


    **Prérequis**

    Avant de commencer, vous devez être titulaire d''un compte Kiosque actif et disposer
    d''une pièce d''identité officielle en cours de validité.


    **Étapes de souscription et d''activation**


    1. **Demande de la carte** : Demandez l''ajout de l''option Voyage à votre compte
    via nos canaux numériques ou dans l''un de nos points de vente partenaires (bureaux
    de tabac, marchands de journaux). Nous procéderons à la vérification obligatoire
    de votre identité via votre pièce officielle.


    2. **Validation et expédition** : Une fois votre identité vérifiée et votre demande
    enregistrée, nous émettons votre carte. Vous la recevrez par voie postale à l''adresse
    enregistrée dans votre dossier.


    3. **Réception et activation** : À la réception de votre pli, vous trouverez vos
    instructions d''activation. Pour activer la carte, vous devrez effectuer une première
    opération nécessitant la saisie de votre code secret (comme un retrait au distributeur
    ou un paiement physique) ou valider l''activation via l''authentification forte
    sur vos canaux numériques.


    4. **Confirmation** : Vous recevrez une notification confirmant que votre Carte
    Kiosque Voyage est désormais active et prête à l''emploi pour vos voyages. Le
    montant de la cotisation annuelle de 30 € sera alors pris en compte selon les
    modalités de notre grille tarifaire.


    Vous savez que l''opération a réussi lorsque vous pouvez effectuer un paiement
    et que la transaction apparaît instantanément dans votre historique de compte.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
