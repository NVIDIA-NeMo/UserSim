- id: c50885ce-75e3-5f43-a45a-5ef4dc0b0252
  title: Carte Kiosque Voyage — opération refusée ou bloquée
  body: 'Il arrive qu''une transaction avec votre Carte Kiosque Voyage soit refusée,
    notamment lors de vos voyages. Voici comment identifier la cause et résoudre le
    problème.


    **Symptôme**

    Votre carte est rejetée lors d''un paiement ou d''un retrait, ou vous recevez
    un message d''erreur indiquant que l''opération est bloquée.


    **Causes probables et vérifications**

    1. **Solde insuffisant** : Vérifiez que le solde de votre compte couvre le montant
    de l''achat ainsi que les frais de retrait de 2 € si vous êtes à un distributeur.

    2. **Sécurité et authentification** : Pour les paiements en ligne, l''authentification
    forte est obligatoire. Si vous n''avez pas validé l''opération via notre protocole,
    elle sera systématiquement bloquée.

    3. **Blocage de sécurité** : En cas de voyage dans une zone à risque, nous pouvons
    suspendre temporairement la carte pour protéger vos fonds.

    4. **Identité non vérifiée** : Si une mise à jour de vos informations est requise,
    la carte peut être restreinte jusqu''à la présentation d''une pièce officielle.


    **Résolution**

    - Si le solde est insuffisant, effectuez un virement vers votre compte.

    - Si la carte est bloquée pour sécurité, demandez-nous de lever la restriction
    après avoir confirmé votre identité.

    - Si l''authentification forte a échoué, relancez l''opération en suivant scrupuleusement
    les étapes de validation.


    **Escalade**

    Si le problème persiste malgré ces vérifications, nous escaladons votre dossier
    vers notre support centralisé pour une analyse technique approfondie. Vous recevrez
    une confirmation de la résolution sous 24 heures ouvrées.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 4470ae1b-05fb-5f43-8a58-70d8b1fa3256
  title: Carte Kiosque Voyage — quand changer ou monter en gamme
  body: 'Ce guide aide les agents à conseiller les clients sur la pertinence de souscrire
    à la Carte Kiosque Voyage par rapport à l''offre standard.


    **Analyse comparative**

    L''offre standard est gratuite ou moins coûteuse annuellement, mais elle peut
    engendrer des frais de change importants lors de déplacements internationaux.
    La Carte Kiosque Voyage, avec sa cotisation de 30 €, est un investissement rentable
    selon le profil du client.


    - **Le profil « Voyageur Occasionnel »** : Si le client effectue un seul voyage
    par an avec quelques paiements, le coût de 30 € peut être supérieur aux frais
    de change d''une carte classique. L''offre standard reste alors préférable.

    - **Le profil « Globe-trotter »** : Pour un client voyageant fréquemment, l''avantage
    du taux de 0 % sur les paiements à l''étranger compense rapidement la cotisation
    annuelle de 30 €. C''est le choix optimal pour minimiser les coûts de change.

    - **Le profil « Retrait d''espèces »** : Si le client a besoin de retirer fréquemment
    des espèces à l''étranger, il doit être informé que chaque retrait coûte 2 €.
    S''il privilégie les paiements par carte, l''avantage du 0 % est maximal.


    En résumé, nous recommandons la Carte Kiosque Voyage dès lors que le volume de
    paiements hors zone euro justifie la cotisation de 30 €.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: afadb041-e9f6-5ad0-b1ee-961a88334ef0
  title: Carte Kiosque Voyage — comparaison avec les alternatives et quand ne pas
    le choisir
  body: 'La Carte Kiosque Voyage est conçue pour ceux qui recherchent la simplicité
    et l''économie lors de leurs déplacements internationaux. Voici comment elle se
    positionne face aux alternatives du marché.


    **Avantages concurrentiels**

    Contrairement à de nombreuses banques traditionnelles qui appliquent des commissions
    de change élevées sur chaque transaction, nous proposons un taux de 0 % sur les
    frais de paiement à l''étranger. Cela signifie que vous payez le prix réel sans
    surcoût caché ajouté par Kiosque.


    **Structure de prix transparente**

    - Cotisation annuelle : 30 €

    - Frais de paiement à l''étranger : 0 %

    - Frais de retrait d''espèces à l''étranger : 2 €


    **Quand ne pas choisir ce produit ?**

    La Carte Kiosque Voyage n''est pas forcément l''option la plus adaptée dans les
    cas suivants :

    - **Usage exclusivement national** : Si vous ne voyagez jamais hors de France
    ou de la zone euro, la cotisation annuelle de 30 € représente une dépense inutile,
    car vous ne profiterez pas de la gratuité des paiements internationaux.

    - **Besoins massifs de retraits d''espèces** : Si votre mode de consommation à
    l''étranger repose uniquement sur le cash, les frais fixes de 2 € par retrait
    peuvent s''accumuler. Dans ce cas, privilégiez les paiements par carte pour profiter
    du taux de 0 %.


    Nous nous engageons à une transparence totale sur les coûts. Ce produit s''adresse
    avant tout aux voyageurs modernes privilégiant le paiement numérique et souhaitant
    maîtriser leur budget sans frais de change imprévus.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: product_sheet
  source_authority: official
