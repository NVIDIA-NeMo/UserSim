- id: 2815d413-2e2e-5dba-9f46-f622dd1b27d7
  title: Carte Kiosque Voyage — informations réglementaires
  body: 'La Carte Kiosque Voyage est un instrument de paiement émis par Kiosque, opérant
    sous la supervision stricte de l''ACPR et de la Banque de France, conformément
    au Code monétaire et financier.


    **Protection des fonds**

    La sécurité de vos avoirs est assurée selon la nature des services :

    - Pour la banque de détail, la protection est garantie par le FGDR.

    - Pour les services de paiement, nous procédons au cantonnement des fonds auprès
    d''une banque partenaire, garantissant que vos fonds sont distincts des fonds
    propres de l''entreprise.


    **Sécurité et Vérification**

    Toute modification d''information ou opération sensible sur le compte associé
    à la carte nécessite obligatoirement une vérification d''identité via une pièce
    officielle. L''authentification forte est systématiquement appliquée pour sécuriser
    les paiements en ligne et prévenir la fraude.


    **Gestion des litiges et fraude**

    Nous appliquons une politique de protection rigoureuse. En cas d''opération non
    autorisée, vous bénéficiez d''un délai de contestation de 13 mois. Conformément
    aux délais réglementaires, le remboursement intervient généralement dès le premier
    jour ouvré suivant la notification de l''incident.


    **Transparence tarifaire**

    Nous nous engageons à une transparence totale sur les coûts. La Carte Kiosque
    Voyage implique une cotisation annuelle de 30 €, des frais de paiement à l''étranger
    de 0 % et des frais de retrait à l''étranger de 2 €. Aucune autre commission cachée
    n''est appliquée sur ces opérations.


    Pour plus de détails sur les cadres légaux, veuillez consulter la Note réglementaire
    : cartes bancaires.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
