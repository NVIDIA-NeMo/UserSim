- id: 07cffa3b-3980-5f2d-9c5b-8eb463e6e1f2
  title: Compte Kiosque — traiter une demande courante de bout en bout
  body: "Pour illustrer la simplicité de notre service, voici la procédure complète\
    \ pour effectuer l'une des opérations les plus courantes : le dépôt d'espèces\
    \ sur votre compte via un point de vente partenaire.\n\n**Prérequis :**\n- Votre\
    \ pièce d'identité officielle originale.\n- Le montant en espèces que vous souhaitez\
    \ déposer.\n\n**Étapes de l'opération :**\n\n1. **Présentation au partenaire :**\
    \ Rendez-vous dans l'un de nos points de vente agréés (par exemple, un bureau\
    \ de tabac ou un marchand de journaux) pendant les horaires d'ouverture français.\n\
    2. **Demande de dépôt :** Informez le commerçant que vous souhaitez effectuer\
    \ un dépôt sur votre Compte Kiosque et présentez votre pièce d'identité pour vérification.\n\
    3. **Remise des fonds :** Remettez la somme en espèces au partenaire. \n4. **Application\
    \ des frais :** Le partenaire et notre système appliquent les frais de dépôt de\
    \ 2 %. Par exemple, pour un dépôt de 100 €, des frais de 2 € seront déduits.\n\
    5. **Confirmation du crédit :** Nous créditons la somme nette sur votre compte.\
    \ Vous recevrez une confirmation de l'opération.\n\n**Comment savoir si cela a\
    \ fonctionné ?**\nL'opération est réussie lorsque vous constatez l'augmentation\
    \ de votre solde disponible dans votre historique de transactions, montant déduit\
    \ des frais de 2 %.\n\nSi vous comparez ce processus à d'autres établissements,\
    \ vous noterez l'absence de rendez-vous et la rapidité d'exécution, fidèle à notre\
    \ promesse d'accessibilité universelle."
