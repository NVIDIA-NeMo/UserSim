- id: 1fff3597-c664-5fad-bc17-3923b130733f
  title: Virement instantané Kiosque — prise en main pas à pas
  body: 'Ce guide est destiné aux agents du support pour accompagner les clients dans
    la première utilisation du Virement instantané Kiosque. Ce produit permet le transfert
    de fonds immédiat, sécurisé par la vérification du nom du bénéficiaire.


    Caractéristiques clés à communiquer au client :

    - Coût : 0 € (gratuit).

    - Rapidité : Transfert immédiat.

    - Limite : Plafond quotidien de 3 000 €.


    Procédure de prise en main pas à pas :


    Étape 1 : Ajout du bénéficiaire

    Le client doit nous fournir les coordonnées bancaires (IBAN) du destinataire.
    L''agent doit confirmer que le client a bien saisi le nom exact du bénéficiaire
    pour activer la sécurité anti-erreur.


    Étape 2 : Saisie du montant

    Le client indique la somme à transférer. L''agent doit vérifier que le montant
    ne dépasse pas le solde disponible et qu''il respecte le plafond quotidien de
    3 000 €. Si le montant excède cette limite, l''opération sera refusée.


    Étape 3 : Validation et Authentification

    Le client doit valider l''opération via l''authentification forte. L''agent confirme
    que la demande est en cours de traitement.


    Étape 4 : Confirmation de l''exécution

    Une fois l''opération validée, le client reçoit une notification de succès. Les
    fonds sont crédités sur le compte du destinataire en quelques secondes.


    Points d''attention pour l''agent :

    - Rappeler que le virement instantané est irrévocable une fois exécuté.

    - Vérifier que l''identité du client a été validée avec une pièce officielle avant
    d''autoriser l''ajout d''un nouveau bénéficiaire.

    - En cas de blocage, se référer au document Virement instantané Kiosque — problèmes
    d''accès ou de connexion.'
  domain: payments
  product_category: virement_instantane
  document_type: product_sheet
  source_authority: official
