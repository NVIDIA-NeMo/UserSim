- id: 9bc7640a-159e-5b42-bba7-46c57fdad1d6
  title: Compte Kiosque — confidentialité et protection des données
  body: 'La protection de vos données et de vos fonds est au cœur du modèle de Kiosque.
    Nous opérons sous la supervision rigoureuse de l''ACPR et de la Banque de France,
    garantissant le respect strict du Code monétaire et financier.


    **Protection des fonds (Cantonnement)**

    Pour votre sécurité, nous appliquons le principe du cantonnement. Cela signifie
    que vos fonds ne sont pas mélangés aux fonds propres de l''entreprise Kiosque
    ; ils sont déposés auprès d''un établissement de crédit partenaire. Cette séparation
    assure que vos avoirs restent disponibles et protégés, même en cas de difficulté
    financière de notre institution. De plus, la protection est assurée par le FGDR
    pour la banque de détail.


    **Confidentialité et Données Personnelles**

    Nous collectons et traitons vos données personnelles uniquement pour les finalités
    liées à la gestion de votre Compte Kiosque et au respect de nos obligations légales
    (notamment la lutte contre le blanchiment et le financement du terrorisme). La
    vérification de l''identité via une pièce officielle est une exigence réglementaire
    obligatoire avant toute opération.


    **Transparence et Droits**

    Conformément au RGPD, vous disposez d''un droit d''accès, de rectification et
    de suppression de vos données. Nous nous engageons à une transparence totale sur
    les coûts :

    - Cotisation annuelle : 24 €

    - Frais de dépôt d''espèces : 2 %

    - Frais de retrait distributeur : 1 €


    L''authentification forte est systématiquement appliquée pour tous les paiements
    en ligne, limitant ainsi les risques d''accès non autorisé à vos données financières.
    Kiosque ne délivre aucun conseil fiscal ou juridique individualisé et fournit
    uniquement des informations à vocation éducative sur ses produits.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: f6133943-aba5-572f-bbe3-ef1397422f9c
  title: Compte Kiosque — reconnaître les arnaques visant ce produit
  body: 'Parce que nous nous engageons pour l''accessibilité universelle, le Compte
    Kiosque attire parfois l''attention de personnes malveillantes qui tentent d''imiter
    notre simplicité pour tromper les utilisateurs. Si vous comparez notre offre à
    d''autres solutions, il est crucial de savoir identifier les signaux d''alerte
    spécifiques à notre modèle.


    L''arnaque la plus courante consiste en des individus se faisant passer pour des
    agents Kiosque ou des partenaires agréés. Ils pourraient vous contacter en prétendant
    pouvoir accélérer l''ouverture de votre compte — qui prend normalement seulement
    5 minutes — en échange d''un paiement anticipé. Soyez vigilants : nous ne demandons
    jamais de frais de « dossier rapide » ou de commissions pour prioriser une ouverture
    de compte. Nos tarifs sont transparents : la cotisation annuelle est de 24 €,
    et aucun frais caché n''est exigé pour activer vos services.


    Une autre méthode frauduleuse consiste à vous demander vos codes d''accès ou vos
    documents d''identité via des canaux non sécurisés (comme des réseaux sociaux)
    en prétendant résoudre un problème technique. Nous vous rappelons que la vérification
    de l''identité via une pièce officielle est obligatoire et s''effectue selon des
    protocoles stricts. Nous ne vous demanderons jamais votre mot de passe ou votre
    code secret par message ou par téléphone.


    Si vous constatez une opération suspecte sur votre compte, agissez immédiatement.
    Nous appliquons une politique de protection rigoureuse avec un délai de contestation
    de 13 mois pour les opérations non autorisées. Le remboursement intervient généralement
    dès le premier jour ouvré suivant la notification, conformément aux délais réglementaires.


    En cas de doute, ne communiquez aucune information et contactez-nous directement
    via nos canaux officiels. Pour plus de détails sur la sécurisation de vos accès,
    nous vous invitons à consulter le document Compte Kiosque — bonnes pratiques de
    sécurité du compte.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2a686d4b-ad13-583d-914d-a0f71312dc60
  title: Compte Kiosque — plafonds, restrictions et cas particuliers
  body: "Ce document est destiné aux agents du support pour l'assistance aux clients\
    \ concernant les limites opérationnelles du Compte Kiosque.\n\nLe Compte Kiosque\
    \ est conçu pour la simplicité et l'inclusion, ce qui implique certaines restrictions\
    \ techniques et financières que l'agent doit savoir expliquer pédagogiquement\
    \ : \n\n1. Nature de la carte : Le compte est associé à une carte à autorisation\
    \ systématique. Cela signifie que le solde est vérifié en temps réel avant chaque\
    \ transaction. Si le solde est insuffisant, l'opération est systématiquement refusée.\
    \ Aucun découvert n'est autorisé sur ce produit.\n\n2. Frais de dépôt d'espèces\
    \ : Les dépôts d'espèces s'effectuent dans nos points de vente partenaires (bureaux\
    \ de tabac, marchands de journaux). Ces opérations sont soumises à des frais de\
    \ 2 %. Ces frais reflètent les coûts opérationnels de nos partenaires et sont\
    \ déduits lors du dépôt.\n\n3. Retraits au distributeur : Chaque retrait effectué\
    \ au distributeur automatique de billets engendre des frais fixes de 1 €.\n\n\
    4. Cotisation annuelle : Le service est maintenu via une tarification forfaitaire\
    \ et transparente. La cotisation annuelle s'élève à 24 €, prélevée selon les conditions\
    \ générales.\n\n5. Rapidité d'exécution : L'ouverture du compte est optimisée\
    \ pour être finalisée en 5 minutes en point de vente agréé, sans condition de\
    \ revenus ni de patrimoine, respectant ainsi le droit au compte pour toute personne\
    \ domiciliée en France.\n\nEn cas de demande concernant un blocage de carte ou\
    \ un dépassement de plafond, l'agent doit d'abord vérifier si le solde est suffisant\
    \ pour couvrir la transaction et les frais associés (comme les 1 € de retrait).\
    \ Pour toute modification d'information, la vérification de l'identité via une\
    \ pièce officielle est obligatoire avant toute action."
  domain: retail_banking
  product_category: compte_kiosque
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: eb374b40-ddf0-531b-8bc6-36f6b1a482aa
  title: 'Compte Kiosque — durée d''ouverture du compte (minutes) : explications'
  body: "« Pourquoi l'ouverture du Compte Kiosque est-elle si rapide ? »\n\nNous avons\
    \ conçu le Compte Kiosque pour supprimer les barrières bancaires traditionnelles.\
    \ Grâce à notre réseau de points de vente partenaires (comme les bureaux de tabac\
    \ et les marchands de journaux) et à nos processus numériques simplifiés, l'ouverture\
    \ de votre compte ne prend que 5 minutes. \n\nCette rapidité est possible car\
    \ nous nous concentrons sur l'essentiel : une vérification d'identité rapide via\
    \ une pièce officielle et une souscription sans condition de revenus ni de patrimoine.\
    \ Nous voulons que l'accès aux services bancaires soit immédiat et universel.\n\
    \n« Est-ce que ces 5 minutes incluent l'activation complète ? »\n\nOui, le processus\
    \ de souscription et la création de votre compte sont finalisés en 5 minutes.\
    \ L'activation finale dépendra ensuite de la remise de vos moyens de paiement,\
    \ selon les modalités décrites dans le document Compte Kiosque — souscrire et\
    \ activer."
  domain: retail_banking
