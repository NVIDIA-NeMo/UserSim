- id: 42dacbd0-f6d7-5c2d-a031-ae5b2be862d4
  title: Compte Kiosque 12-17 ans — résilier, clôturer ou changer de formule
  body: 'Cette procédure permet au représentant légal de mettre fin au contrat du
    Compte Kiosque 12-17 ans ou d''évoluer vers une autre offre de notre institution.


    Avant de commencer, assurez-vous que le solde du compte est soit nul, soit que
    vous avez indiqué les coordonnées bancaires où transférer les fonds restants.


    Étapes de résiliation ou de changement :

    1. Demandez la clôture ou le changement de formule en nous précisant le motif
    (par exemple : l''enfant a atteint l''âge de 18 ans ou vous souhaitez passer à
    un compte adulte).

    2. Fournissez la pièce d''identité officielle du représentant légal ainsi que
    celle du mineur pour valider l''identité des demandeurs. Cette vérification est
    obligatoire pour toute opération sur le compte.

    3. Confirmez le solde final. Nous procéderons au virement des fonds restants vers
    le compte de destination fourni.

    4. Recevez la confirmation écrite de la clôture du compte ou l''activation de
    votre nouvelle formule.


    Sachez que si vous choisissez de changer de formule pour un produit adulte, les
    frais et plafonds seront modifiés conformément à la nouvelle grille tarifaire.
    Pour comparer nos options, vous pouvez consulter Compte Kiosque 12-17 ans — face
    à un produit similaire de l''établissement.'
