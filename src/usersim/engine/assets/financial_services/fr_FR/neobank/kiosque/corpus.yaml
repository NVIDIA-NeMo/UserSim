- id: d62b7e82-0b5a-5106-8cd3-da3dfebbcc9f
  title: Carte Kiosque Voyage — opération échouée ou en attente
  body: 'Il peut arriver qu''une transaction avec votre Carte Kiosque Voyage ne soit
    pas validée immédiatement, particulièrement lors de vos déplacements à l''étranger.
    Voici comment identifier et résoudre le problème.


    **Symptôme : Le paiement est refusé ou la transaction reste « en attente »**


    **Causes possibles et vérifications**

    1. **Solde insuffisant** : La Carte Kiosque Voyage est une carte à autorisation
    systématique. Si le solde de votre compte est inférieur au montant de l''achat
    (incluant les frais de retrait de 2 € si applicable), l''opération sera systématiquement
    refusée. Vérifiez votre solde en temps réel via vos canaux numériques.

    2. **Plafonds de paiement** : Vérifiez que vous n''avez pas atteint vos plafonds
    de dépenses hebdomadaires ou mensuels.

    3. **Sécurité et blocage** : Pour votre protection, nous pouvons bloquer temporairement
    une carte en cas de motif suspect (par exemple, un paiement inhabituel dans un
    pays lointain sans notification préalable).

    4. **Erreur technique du terminal** : Certains terminaux de paiement étrangers
    peuvent rencontrer des difficultés avec l''authentification forte.


    **Comment résoudre le problème ?**

    - **Si le solde est insuffisant** : Alimentez votre compte. Le transfert de fonds
    immédiat via notre service de virement instantané est la méthode la plus rapide.

    - **Si la carte est bloquée** : Demandez-nous de vérifier le statut de votre carte.
    Nous vous demanderons de confirmer votre identité avant toute action.

    - **Si le problème persiste** : Nous escaladerons votre demande vers notre support
    centralisé de Kiosque pour une analyse technique approfondie.


    Dans tous les cas, si vous constatez une opération non autorisée, sachez que vous
    disposez d''un délai de contestation de 13 mois. Le remboursement intervient généralement
    dès le premier jour ouvré suivant la notification.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
