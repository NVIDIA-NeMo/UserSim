- id: bfac0c8f-336b-5d85-adbc-6a9a43d1b29f
  title: Compte Kiosque 12-17 ans — pour qui et pour quels usages
  body: 'Le Compte Kiosque 12-17 ans est conçu comme un outil d''initiation financière
    sécurisé, permettant aux adolescents de découvrir l''autonomie bancaire sous le
    regard bienveillant de leurs parents ou tuteurs.


    Cible et Accessibilité :

    Ce produit s''adresse aux jeunes âgés de 12 ans minimum. Fidèles à notre mission
    d''inclusion, nous permettons l''ouverture de ce compte sans condition de revenus
    ni de patrimoine, rendant l''accès bancaire universel dès le plus jeune âge.


    Usages et Fonctionnalités :

    Le compte permet de gérer l''argent de poche, d''effectuer des achats quotidiens
    et d''apprendre à budgétiser ses dépenses. Pour accompagner cet apprentissage,
    nous avons mis en place un plafond de paiement hebdomadaire de 150 €, offrant
    un cadre sécurisant qui évite les dépenses impulsives excessives.


    Tarification transparente :

    Nous adoptons une tarification simple et forfaitaire. Le Compte Kiosque 12-17
    ans implique des frais annuels de 20 €. Ce coût transparent nous permet de maintenir
    un service de qualité et un accompagnement pédagogique.


    Points forts :

    - Ouverture rapide en points de vente agréés.

    - Contrôle des dépenses via le plafond de 150 € par semaine.

    - Sécurité maximale avec l''authentification forte pour les achats en ligne.


    Pour comprendre comment ce compte s''intègre dans notre gamme, vous pouvez consulter
    Compte Kiosque — présentation.'
