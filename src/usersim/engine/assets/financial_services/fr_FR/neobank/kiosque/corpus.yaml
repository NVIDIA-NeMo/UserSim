- id: 2ca6ff6a-e0f3-56d0-a684-78b10df7c8b6
  title: Carte Kiosque Voyage — face à une offre concurrente type
  body: "Lorsqu'on compare la Carte Kiosque Voyage à une offre bancaire traditionnelle,\
    \ la différence majeure réside dans la structure des coûts à l'étranger.\n\nDimensions\
    \ de comparaison :\n- Paiements hors zone euro : Là où les banques classiques\
    \ appliquent souvent une commission (entre 2 % et 3 %), nous proposons un taux\
    \ de 0 %. Pour un voyageur effectuant des achats fréquents, l'économie est immédiate\
    \ et significative.\n- Retraits d'espèces : De nombreuses offres proposent des\
    \ frais variables. Nous appliquons un montant fixe et transparent de 2 € par retrait,\
    \ ce qui évite les surprises sur les grosses sommes.\n- Coût de détention : Avec\
    \ une cotisation annuelle de 30 €, notre offre se positionne comme abordable et\
    \ transparente, sans frais de gestion cachés.\n\nVerdict :\n- La Carte Kiosque\
    \ Voyage est le meilleur choix pour ceux qui privilégient les paiements par carte\
    \ à l'étranger et recherchent une visibilité totale sur leurs frais.\n- Une offre\
    \ concurrente pourrait être préférable pour quelqu'un n'effectuant aucun voyage\
    \ et ne souhaitant pas payer de cotisation annuelle, bien que la flexibilité de\
    \ Kiosque reste un atout majeur. \n\nPour plus d'informations, voir Carte Kiosque\
    \ Voyage — présentation."
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: d896108a-1c3c-56ac-acb6-b1085037b8c0
  title: Carte Kiosque Voyage — informations sur les risques
  body: "L'utilisation de la Carte Kiosque Voyage comporte des aspects réglementaires\
    \ et des risques liés aux opérations internationales que nous souhaitons rendre\
    \ transparents.\n\nRisques de change\nBien que nous appliquions des frais de paiement\
    \ hors zone euro de 0 %, le montant final débité sur votre compte dépend du taux\
    \ de change appliqué au moment de la transaction. Ce taux peut fluctuer quotidiennement,\
    \ ce qui signifie que le coût d'un achat en devise étrangère peut varier légèrement\
    \ entre le moment du paiement et le moment du débit effectif sur votre compte.\n\
    \nProtection des fonds\nL'institution Kiosque opère sous la supervision de l'ACPR\
    \ et de la Banque de France. Pour garantir la sécurité de vos avoirs, nous utilisons\
    \ deux mécanismes : \n1. La protection du FGDR (Fonds de Garantie des Dépôts et\
    \ de Résolution) pour la banque de détail.\n2. Le cantonnement des fonds auprès\
    \ d'un établissement de crédit partenaire pour les services de paiement, assurant\
    \ que vos fonds sont distincts des fonds propres de l'entreprise.\n\nResponsabilité\
    \ et Fraude\nNous appliquons une politique de protection rigoureuse. En cas d'opération\
    \ non autorisée, vous disposez d'un délai de contestation de 13 mois. Le remboursement\
    \ intervient généralement dès le premier jour ouvré suivant la notification, sous\
    \ réserve de la vérification de l'identité du titulaire via une pièce officielle.\n\
    \nL'engagement de transparence de Kiosque implique que nous ne délivrons aucun\
    \ conseil fiscal ou juridique individualisé. Les frais mentionnés, tels que la\
    \ cotisation annuelle de 30 € et les frais de retrait de 2 €, sont définitifs\
    \ et reflètent nos coûts opérationnels."
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 34182a0f-1138-5e9e-a334-93a5427bea63
  title: Carte Kiosque Voyage — calcul et application des taux
  body: 'Ce document détaille l''application des tarifs pour la Carte Kiosque Voyage
    à destination du support agent.


    1. Paiements hors zone euro

    - Taux appliqué : 0 %

    - Application : Ce taux s''applique à toutes les transactions de paiement effectuées
    dans une devise autre que l''euro. Aucun frais supplémentaire n''est ajouté par
    Kiosque au montant converti de la transaction.


    2. Retraits d''espèces hors zone euro

    - Frais appliqués : 2 €

    - Application : Ce montant est un frais fixe prélevé à chaque retrait effectué
    dans un distributeur automatique à l''étranger, indépendamment du montant retiré.


    3. Cotisation annuelle

    - Montant : 30 €

    - Application : Prélevé annuellement pour le maintien du service de la carte.


    Ces taux sont fixes et s''appliquent uniformément à tous les détenteurs de la
    Carte Kiosque Voyage, sans condition de revenus ou de solde minimal. Pour toute
    question sur la facturation, se référer à Carte Kiosque Voyage — frais ou montant
    inattendu.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 38e0fcdb-ee36-5769-8baf-ac56bd40ea09
  title: Carte Kiosque Voyage — offre de parrainage et de fidélité
  body: "Nous avons le plaisir de vous présenter notre programme de parrainage dédié\
    \ à la Carte Kiosque Voyage. Pour nous, l'accessibilité commence par le partage\
    \ : nous souhaitons récompenser ceux qui nous aident à faire découvrir nos services\
    \ de voyage.\n\nDu 1er juin 2024 au 31 décembre 2024, pour chaque nouvel utilisateur\
    \ qui ouvre un compte et souscrit à la Carte Kiosque Voyage grâce à votre recommandation,\
    \ nous créditons 10 € sur votre compte et 10 € sur celui de votre filleul. \n\n\
    C'est l'occasion idéale pour vos proches de profiter de nos avantages, notamment\
    \ des frais de paiement à l'étranger à 0 %, tout en simplifiant leurs déplacements\
    \ internationaux. Pour bénéficier de cette offre, assurez-vous que votre filleul\
    \ utilise bien votre code de parrainage lors de l'ouverture de son compte en point\
    \ de vente ou via notre interface numérique.\n\nNous restons à votre disposition\
    \ pour vous accompagner dans l'activation de vos récompenses et pour vous aider\
    \ à optimiser vos futurs voyages avec nous."
  domain: cards
