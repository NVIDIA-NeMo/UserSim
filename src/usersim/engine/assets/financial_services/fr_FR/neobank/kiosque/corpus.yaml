- id: eb4e5ba8-ff26-5446-bec9-f6bacacedbe7
  title: Virement instantané Kiosque — opération échouée ou en attente
  body: 'Il peut arriver qu''un virement instantané ne soit pas traité immédiatement.
    Voici comment diagnostiquer et résoudre le problème.


    **Symptôme : Le virement est marqué comme « échoué » ou n''a pas été débité.**


    **Causes probables et vérifications :**

    1. **Dépassement du plafond :** Vérifiez si le montant du transfert, cumulé aux
    opérations déjà effectuées aujourd''hui, dépasse la limite quotidienne de 3 000
    €. Si c''est le cas, le virement sera systématiquement refusé.

    2. **Solde insuffisant :** Assurez-vous que le solde disponible sur votre compte
    couvre la totalité du montant à envoyer.

    3. **Erreur de bénéficiaire :** Si le nom du bénéficiaire ne correspond pas exactement
    aux informations liées à l''IBAN, notre système de sécurité peut bloquer la transaction
    pour prévenir la fraude.

    4. **Indisponibilité du réseau SEPA Instant :** Bien que rare, le réseau interbancaire
    peut rencontrer des interruptions techniques.


    **Comment résoudre le problème :**

    - Si le plafond de 3 000 € est atteint, vous devrez patienter jusqu''au lendemain
    pour effectuer un nouveau virement.

    - En cas d''erreur de saisie, recommencez l''opération en vérifiant scrupuleusement
    l''IBAN et le nom du destinataire.

    - Si le solde est insuffisant, alimentez votre compte via un point de vente partenaire.


    **Quand escalader ?**

    Si le montant a été débité de votre compte mais que le bénéficiaire n''a rien
    reçu après 24 heures, nous devons intervenir. Nous ouvrirons alors un dossier
    d''enquête auprès du réseau de compensation. Vous recevrez un numéro de suivi
    et nous vous informerons de la résolution sous les délais réglementaires.


    Pour les problèmes de blocage de compte plus généraux, consultez Compte Kiosque
    — opération refusée ou bloquée.'
  domain: payments
  product_category: virement_instantane
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
