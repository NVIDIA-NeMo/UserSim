- id: 67a9585e-ac30-5c63-a026-c903939358f8
  title: Virement instantané Kiosque — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos fonds est notre priorité absolue. Le Virement instantané
    Kiosque est conçu pour être rapide, mais cette rapidité exige une vigilance accrue,
    car les fonds sont transférés quasi immédiatement.


    Voici les règles d''or pour sécuriser vos opérations :


    1. Vérification du bénéficiaire : Avant chaque transfert, vérifiez scrupuleusement
    le nom du bénéficiaire. Notre système sécurise le transfert par cette vérification,
    mais une erreur de saisie peut entraîner l''envoi de fonds vers un tiers inconnu.


    2. Authentification forte : Nous appliquons systématiquement l''authentification
    forte pour sécuriser vos paiements et virements en ligne. Ne partagez jamais vos
    codes secrets, vos mots de passe ou vos identifiants de connexion avec qui que
    ce soit, même si la personne prétend travailler pour Kiosque.


    3. Vigilance face au phishing : Nous ne vous demanderons jamais vos codes secrets
    par SMS ou par e-mail. Si vous recevez un message suspect vous demandant de «
    débloquer » votre plafond quotidien de 3 000 € en cliquant sur un lien, ignorez-le
    et signalez-le nous immédiatement.


    4. Signalement rapide : En cas d''opération non autorisée, sachez que nous appliquons
    une politique de protection rigoureuse. Vous disposez d''un délai de contestation
    de 13 mois pour les opérations non autorisées. Le remboursement intervient selon
    les délais réglementaires, généralement dès le premier jour ouvré suivant la notification.


    Si vous constatez une anomalie ou si vous soupçonnez une tentative de fraude,
    demandez-nous immédiatement de geler vos accès. Pour approfondir vos connaissances
    sur la protection globale de vos avoirs, vous pouvez consulter le document Compte
    Kiosque — protection contre la fraude et les opérations non autorisées.'
  domain: payments
  product_category: virement_instantane
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: b3824ae0-24cb-5d36-8b46-e2cac12c77c3
  title: Virement instantané Kiosque — modification des conditions
  body: 'Le présent document détaille les modalités de modification des conditions
    d''utilisation du Virement instantané Kiosque. Ce service est régi par le Code
    monétaire et financier et opère sous la supervision de l''ACPR et de la Banque
    de France.


    Obligations et Tarifs :

    Nous nous engageons à maintenir une tarification forfaitaire et transparente.
    À ce jour, les frais de virement instantané sont fixés à 0 €. Toute modification
    de ce tarif fera l''objet d''une notification préalable envoyée via vos canaux
    numériques habituels.


    Limites d''Utilisation :

    Le service est soumis à un plafond quotidien de transfert de 3 000 €. Ce seuil
    est instauré pour garantir la sécurité des fonds et la viabilité opérationnelle
    du service. Kiosque se réserve le droit de modifier ce plafond en fonction de
    l''évolution des risques de fraude ou des exigences réglementaires.


    Procédure de Modification :

    Nous informerons les clients de toute modification substantielle des présentes
    conditions avec un préavis raisonnable. Si vous n''acceptez pas les nouvelles
    conditions, vous avez la possibilité de cesser l''utilisation du service de virement
    instantané ou de clôturer votre compte.


    Rupture du Service :

    L''institution peut suspendre l''accès au Virement instantané Kiosque en cas de
    suspicion de fraude, de non-respect des obligations de vérification d''identité,
    ou sur demande expresse du client. La vérification de l''identité via une pièce
    officielle reste obligatoire avant toute modification d''information critique
    sur le compte.


    Pour comprendre comment ces conditions s''articulent avec l''ensemble de notre
    offre, veuillez vous référer au document Compte Kiosque — conditions générales.'
  domain: payments
  product_category: virement_instantane
