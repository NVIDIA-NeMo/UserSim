- id: 3683e4a8-a58c-5a36-9f93-911859dc55bb
  title: Compte Kiosque — consulter le suivi ou l'historique
  body: 'Nous vous accompagnons dans la consultation de vos opérations pour vous permettre
    de gérer votre budget en toute transparence. Voici la marche à suivre pour accéder
    à votre suivi et à votre historique de transactions.


    **Prérequis :**

    Vous devez disposer de votre pièce d''identité officielle pour toute demande de
    modification ou d''accès approfondi si vous n''êtes pas déjà authentifié.


    **Étapes de consultation :**


    1. **Demander l''accès à l''historique :** Indiquez-nous que vous souhaitez consulter
    vos dernières opérations ou obtenir un relevé pour une période précise.

    2. **Vérification de sécurité :** Pour protéger vos fonds, nous appliquerons une
    authentification forte. Nous vous demanderons de confirmer votre identité. Si
    vous effectuez cette demande en point de vente partenaire, présentez votre pièce
    d''identité originale.

    3. **Consultation des opérations :** Nous vous fournirons la liste détaillée de
    vos transactions. Vous y verrez apparaître vos dépenses, vos virements et les
    éventuels frais appliqués, tels que les frais de retrait de 1 € ou les frais de
    dépôt d''espèces de 2 %.

    4. **Confirmation de lecture :** Une fois les informations transmises, confirmez-nous
    que vous avez bien reçu le détail de votre historique.


    **Comment savoir si cela a fonctionné ?**

    L''opération est réussie lorsque vous avez sous les yeux la liste chronologique
    de vos mouvements bancaires, incluant les dates, les libellés des commerçants
    et les montants exacts débités ou crédités sur votre Compte Kiosque.


    Si vous remarquez un montant qui vous semble incorrect, nous vous invitons à consulter
    le guide Compte Kiosque — frais ou montant inattendu pour comprendre la nature
    de certains prélèvements.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: c45d67dc-0d1c-5019-ba2b-4dd54fd18843
  title: Compte Kiosque — opération refusée ou bloquée
  body: 'Si vous comparez notre service à d''autres néobanques, vous remarquerez que
    nous privilégions la sécurité et la maîtrise totale du budget. Voici comment réagir
    si l''une de vos opérations avec le Compte Kiosque est refusée ou bloquée.


    **Symptômes courants**

    L''utilisateur indique : « Ma carte a été refusée au moment du paiement » ou «
    Je ne peux pas effectuer ce retrait au distributeur ».


    **Causes probables et vérifications**

    1. **Solde insuffisant (Cause principale) :** Le Compte Kiosque utilise une carte
    à autorisation systématique. Le solde est vérifié en temps réel. Si le montant
    de l''achat (ou le montant du retrait plus les 1 € de frais de retrait) dépasse
    votre solde actuel, l''opération est bloquée. Vérifiez votre solde immédiatement.

    2. **Échec de l''authentification forte :** Pour les paiements en ligne, nous
    appliquons systématiquement l''authentification forte. Si la validation n''a pas
    été effectuée correctement, la transaction est refusée.

    3. **Vérification d''identité requise :** Certaines opérations peuvent être bloquées
    si nous détectons un besoin de mise à jour de vos documents officiels.


    **Comment résoudre le problème**

    - **Pour un manque de fonds :** Effectuez un dépôt d''espèces dans un point de
    vente partenaire (en tenant compte des frais de 2 %) ou recevez un virement. Une
    fois le solde crédité, la carte est utilisable instantanément.

    - **Pour un problème d''authentification :** Recommencez l''opération et assurez-vous
    de valider la notification de sécurité sur votre appareil.

    - **Pour un blocage administratif :** Fournissez-nous une pièce d''identité officielle
    à jour pour débloquer les restrictions.


    **Quand nous solliciter pour une escalade ?**

    Si votre solde est suffisant et que votre identité est vérifiée, mais que l''opération
    échoue toujours, nous ouvrirons un ticket auprès de notre support centralisé pour
    analyser le blocage technique. Vous recevrez une confirmation de la résolution
    sous 24 heures ouvrées.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: fa1a6eff-a25c-58c5-98bd-f14613f488da
  title: Compte Kiosque — quand changer ou monter en gamme
  body: 'Ce document aide l''agent à conseiller le client sur le moment opportun pour
    évoluer vers un autre produit de l''institution. Le Compte Kiosque est idéal pour
    l''accessibilité rapide (ouverture en 5 minutes) et la gestion simple avec une
    cotisation de 24 €.


    Cependant, un changement est recommandé dans les cas suivants :


    - **Usage international fréquent :** Si le client voyage souvent et souhaite supprimer
    les frais de paiement à l''étranger, orientez-le vers la Carte Kiosque Voyage.

    - **Public adolescent :** Si le client souhaite ouvrir un compte pour un enfant
    de 12 à 17 ans, le produit adapté est le Compte Kiosque 12-17 ans, qui offre un
    cadre sécurisé avec un plafond hebdomadaire de 150 €.

    - **Besoin de transferts immédiats :** Bien que le Compte Kiosque permette les
    opérations courantes, pour un usage intensif de transferts instantanés sécurisés,
    le Virement instantané Kiosque est l''outil dédié.


    L''agent doit souligner que le Compte Kiosque reste la base inclusive sans condition
    de revenus, mais que ces spécialisations optimisent les coûts et la sécurité selon
    le profil de l''utilisateur.'
