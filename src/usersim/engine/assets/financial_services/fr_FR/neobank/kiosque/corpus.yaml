- id: 44a9dc2c-a3a8-5e25-9054-65d4f6facb73
  title: 'Carte Kiosque Voyage — cotisation annuelle : explications'
  body: 'Nous répondons ici aux questions les plus fréquentes concernant les coûts
    de maintien de votre carte.


    **Quel est le montant de la cotisation annuelle pour la Carte Kiosque Voyage ?**

    Le coût de ce service est de 30 € par an. Ce montant forfaitaire nous permet d''assurer
    la maintenance technique de la carte et la gratuité des frais de paiement à l''étranger.


    **Quand cette cotisation est-elle prélevée ?**

    La cotisation de 30 € est prélevée annuellement, à la date anniversaire de l''activation
    de votre carte. Nous vous informons généralement de ce prélèvement via nos canaux
    numériques.


    **Puis-je demander l''annulation de cette cotisation ?**

    La cotisation est liée à la détention du support physique et des services associés.
    Pour ne plus payer cette somme, vous devez demander la clôture de votre option
    carte. Nous vous invitons à consulter la Carte Kiosque Voyage — grille tarifaire
    pour l''ensemble des coûts associés.'
