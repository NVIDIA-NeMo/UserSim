- id: bd83abdf-7a26-57c7-94ed-14fc3c1418d4
  title: Compte Kiosque 12-17 ans — confidentialité et protection des données
  body: 'Kiosque s''engage à protéger les données personnelles des jeunes utilisateurs
    et de leurs représentants légaux. Le Compte Kiosque 12-17 ans est géré dans le
    strict respect du Code monétaire et financier et sous la supervision de l''ACPR
    et de la Banque de France.


    **Protection des fonds**

    Nous appliquons un mécanisme de cantonnement des fonds : l''argent déposé sur
    vocals Compte Kiosque 12-17 ans est déposé auprès d''un établissement de crédit
    partenaire. Cela signifie que vos fonds sont distincts des fonds propres de l''entreprise
    Kiosque, assurant une sécurité maximale.


    De plus, la protection est assurée par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) pour la partie banque de détail, conformément aux normes réglementaires
    françaises.


    **Confidentialité et Accès**

    L''accès aux informations du compte est strictement encadré. En raison de la minorité
    du titulaire, le représentant légal a un droit de regard sur les opérations. Toutefois,
    pour toute modification d''information ou opération sensible, la présentation
    d''une pièce d''identité officielle est obligatoire, tant pour le parent que pour
    l''enfant.


    **Transparence des coûts**

    Nous nous engageons à une transparence totale. Le coût du service est limité à
    une cotisation annuelle de 20 €. Aucune autre commission cachée n''est appliquée
    sur la gestion courante du compte. Le plafond de paiement hebdomadaire de 150
    € est communiqué clairement pour éviter tout frais de dépassement ou refus inattendu.
    Nous ne délivrons aucun conseil fiscal ou juridique individualisé, nos informations
    ayant une vocation uniquement éducative et descriptive.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: d8c16414-bba3-5d39-8dda-14d567f33cf6
  title: Compte Kiosque 12-17 ans — reconnaître les arnaques visant ce produit
  body: 'La sécurité des plus jeunes est notre priorité. Le Compte Kiosque 12-17 ans
    peut être la cible de tentatives de fraude spécifiques, souvent liées aux jeux
    vidéo, aux réseaux sociaux ou aux promesses de gains rapides.


    Voici les signes d''alerte pour reconnaître une arnaque :

    - Demandes de codes : Un membre de l''équipe Kiosque ne vous demandera jamais
    votre code secret ou vos identifiants de connexion par message ou par téléphone.

    - Urgence injustifiée : Méfiez-vous des messages vous pressant de transférer des
    fonds pour « débloquer un compte » ou « éviter une fermeture immédiate ».

    - Offres trop belles pour être vraies : Les propositions de multiplier l''argent
    d''un compte en quelques heures via des investissements miracles sont systématiquement
    des fraudes.

    - Demandes de captures d''écran : Ne partagez jamais de captures d''écran de vos
    relevés ou de vos validations de paiement avec des tiers.


    Que faire en cas de doute ?

    Si vous constatez une opération suspecte ou si vous avez communiqué des informations
    confidentielles, nous vous demandons de nous le signaler immédiatement. Nous bloquerons
    vos moyens de paiement pour sécuriser vos fonds.


    Sachez que nous appliquons une politique de protection rigoureuse : vous disposez
    d''un délai de 13 mois pour contester toute opération non autorisée. Le remboursement
    intervient généralement dès le premier jour ouvré suivant la notification de la
    fraude, conformément aux délais réglementaires.


    Pour plus de précisions sur la sécurisation globale, vous pouvez consulter le
    document Compte Kiosque 12-17 ans — bonnes pratiques de sécurité du compte.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 8d7aa766-846f-5f61-b41c-51b64187154f
  title: Compte Kiosque 12-17 ans — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux agents du support pour l''assistance technique
    et commerciale liée au Compte Kiosque 12-17 ans.


    Cadrage et restrictions :

    Le produit est strictement réservé aux mineurs ayant atteint l''âge minimum de
    12 ans. L''ouverture nécessite la validation d''un représentant légal.


    Limites financières :

    - Plafond de paiement hebdomadaire : Les dépenses sont limitées à un montant maximum
    de 150 € par semaine. Ce plafond est global et s''applique aux paiements par carte
    et aux virements sortants.

    - Frais de tenue : Le compte est soumis à une cotisation annuelle de 20 €.


    Caractéristiques techniques :

    Le produit utilise une carte à autorisation systématique. Cela signifie que le
    solde est vérifié en temps réel avant chaque transaction. Si le solde est insuffisant
    ou si le plafond de 150 € est atteint, l''opération est automatiquement refusée.
    Le découvert est donc strictement interdit sur ce type de compte.


    Cas particuliers :

    - Dépassement de plafond : Le plafond de 150 € est réinitialisé chaque semaine.
    Il n''est pas possible de demander une augmentation temporaire de ce montant pour
    les mineurs.

    - Transition : À l''approche des 18 ans, le client doit être orienté vers la migration
    vers un compte adulte.


    Pour toute question sur l''éligibilité, se référer à Compte Kiosque 12-17 ans
    — conditions d''éligibilité.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 1c1f0f71-cd88-5a8c-975d-d4b3733026e2
  title: Compte Kiosque 12-17 ans — coûts et frais
  body: 'Voici les réponses aux questions les plus courantes concernant la tarification
    du Compte Kiosque 12-17 ans.


    Combien coûte l''ouverture et la gestion de ce compte ?

    L''ouverture est simple et accessible. Le compte prévoit une cotisation annuelle
    de 20 €, qui assure la viabilité du service et la maintenance des outils de suivi.


    Existe-t-il des frais cachés ou des commissions sur les opérations ?

    Non, nous pratiquons une tarification forfaitaire et transparente. Il n''y a pas
    de frais de gestion mensuels supplémentaires. Pour le détail complet des tarifs,
    nous vous invitons à consulter la Compte Kiosque 12-17 ans — grille tarifaire.


    Le plafond de paiement hebdomadaire engendre-t-il des frais s''il est atteint
    ?

    Non, le plafond de 150 € est une limite de sécurité gratuite. Atteindre ce plafond
    ne génère aucun frais ; cela bloque simplement les nouvelles transactions jusqu''à
    la réinitialisation hebdomadaire.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 8a9ca7e7-9d53-5b36-85f5-86a5470828ed
  title: Compte Kiosque 12-17 ans — consulter le suivi ou l'historique
  body: 'Suivez ces étapes pour consulter l''historique des opérations et le solde
    de votre Compte Kiosque 12-17 ans.


    Ce que vous devez avoir :

    - Votre identifiant de compte.

    - Une pièce d''identité officielle (si vous effectuez la demande via un point
    de vente partenaire).


    Étapes de consultation :

    1. Demandez-nous l''accès à votre historique de transactions ou demandez l''envoi
    de votre dernier relevé périodique.

    2. Nous confirmerons avec vous la période concernée (par exemple, le mois dernier
    ou les 30 derniers jours).

    3. Nous vous transmettrons la liste détaillée des opérations, incluant la date,
    le libellé du commerçant ou du bénéficiaire, et le montant débité ou crédité.

    4. Vous pourrez alors vérifier votre solde actuel et comparer vos dépenses par
    rapport à votre plafond hebdomadaire de 150 €.


    Comment savoir si l''opération a réussi ?

    L''opération est réussie lorsque vous recevez le document ou la liste des transactions.
    Vous constaterez que le solde final correspond à la somme de vos dépôts moins
    vos dépenses et la cotisation annuelle de 20 € si celle-ci a été prélevée récemment.


    Si vous remarquez une erreur dans vos transactions, consultez Compte Kiosque 12-17
    ans — écart avec vos relevés.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 0acfe844-3941-57b9-aace-a0844e28e6c5
  title: Compte Kiosque 12-17 ans — opération refusée ou bloquée
  body: 'Symptôme : Vous tentez d''effectuer un paiement ou un virement, mais la transaction
    est refusée.


    Causes probables et vérifications :

    1. Solde insuffisant : Le Compte Kiosque 12-17 ans est une carte à autorisation
    systématique. Si le montant de l''achat est supérieur au solde disponible, l''opération
    est bloquée. Vérifiez votre solde actuel.

    2. Plafond hebdomadaire atteint : Nous limitons les dépenses à 150 € par semaine
    pour protéger les jeunes utilisateurs. Si vous avez déjà dépensé 150 € depuis
    le début de la semaine, toute nouvelle transaction sera refusée jusqu''à la réinitialisation
    du plafond.

    3. Vérification d''identité manquante : Si vous tentez une opération inhabituelle,
    nous pouvons bloquer la transaction pour demander une vérification de votre pièce
    d''identité officielle.


    Comment résoudre le problème :

    - Si le solde est insuffisant : Demandez à vos parents ou tuteurs d''alimenter
    le compte.

    - Si le plafond est atteint : Patientez jusqu''au début de la semaine suivante
    pour que vos 150 € de limite soient rétablis.

    - Si l''identité est en cause : Présentez-nous votre pièce d''identité officielle
    pour débloquer la situation.


    Quand nous solliciter pour une escalade ?

    Si votre solde est positif, que vous n''avez pas atteint vos 150 € de plafond
    et que votre identité est validée, nous prendrons le relais. Nous analyserons
    les journaux techniques de la transaction pour identifier l''erreur et nous débloquerons
    l''opération manuellement si un incident technique est avéré.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 919e5482-f214-5fba-92ba-844cf8358080
  title: Compte Kiosque 12-17 ans — quand changer ou monter en gamme
  body: 'Ce document aide les agents à conseiller les clients sur le moment opportun
    de passer du Compte Kiosque 12-17 ans vers une offre adulte.


    Le passage à la gamme supérieure est recommandé dans les cas suivants :

    - Atteinte de la majorité : Dès l''anniversaire des 18 ans, le client doit migrer
    vers le Compte Kiosque standard. Le produit ado n''est plus éligible après 17
    ans.

    - Besoin de flexibilité financière : Si le plafond hebdomadaire de 150 € devient
    trop restrictif pour les besoins du jeune adulte (études, premier emploi), le
    Compte Kiosque standard offre des plafonds beaucoup plus élevés.

    - Autonomie complète : Le passage au compte adulte supprime la nécessité de validation
    par un représentant légal pour les modifications de compte.


    Comparatif rapide :

    - Compte 12-17 ans : Cotisation de 20 €/an, plafond strict de 150 €/semaine, minimum
    12 ans.

    - Compte Kiosque : Tarification différente, plafonds adultes, accès universel
    sans condition de revenus.


    Le Compte Kiosque 12-17 ans reste le meilleur choix pour l''apprentissage financier
    sécurisé. Le compte adulte est préférable dès que l''autonomie et des volumes
    de transactions plus importants sont nécessaires.'
