- id: b8a2b9f0-d4b3-508d-ab66-cb005de8875e
  title: Carte Kiosque Voyage — protection contre la fraude et les opérations non
    autorisées
  body: 'Chez Kiosque, nous savons que la sécurité de vos fonds est votre priorité
    absolue, surtout lorsque vous voyagez à l''étranger. C''est pourquoi nous avons
    mis en place un système de protection rigoureux pour accompagner l''utilisation
    de la Carte Kiosque Voyage.


    Pour chaque transaction effectuée en ligne, nous appliquons systématiquement l''authentification
    forte. Ce mécanisme est essentiel pour garantir que vous êtes bien l''auteur du
    paiement et pour bloquer les tentatives d''utilisation frauduleuse de vos identifiants.


    En cas de constatation d''une opération que vous n''avez pas autorisée, nous vous
    offrons un délai de contestation étendu de 13 mois. Cette période vous permet
    de passer en revue vos relevés avec sérénité, même après un long voyage. Une fois
    la fraude notifiée et validée, nous procédons au remboursement selon les délais
    réglementaires, intervenant généralement dès le premier jour ouvré suivant la
    notification.


    Soyez vigilants : nous ne vous demanderons jamais votre code secret ou vos identifiants
    de connexion par téléphone ou par message. Toute demande de modification d''information
    sur votre compte nécessite obligatoirement la présentation d''une pièce d''identité
    officielle pour vérification.


    Si vous remarquez une activité inhabituelle sur votre compte, la première action
    à entreprendre est de nous signaler immédiatement l''opération pour que nous puissions
    sécuriser vos fonds. Pour plus de détails sur la gestion globale de votre compte,
    nous vous invitons à consulter le document Compte Kiosque — protection contre
    la fraude et les opérations non autorisées.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: d342cf86-518e-5ae2-9b13-05ba1676d127
  title: Carte Kiosque Voyage — conditions générales
  body: 'Le présent document définit les conditions contractuelles d''utilisation
    de la Carte Kiosque Voyage. L''utilisation de ce service implique l''acceptation
    sans réserve des termes suivants.


    1. Obligations financières et frais

    L''utilisateur s''engage à acquitter une cotisation annuelle de 30 €, payable
    selon les modalités définies lors de la souscription. Ce forfait assure la viabilité
    du service tout en maintenant l''accessibilité du produit. En contrepartie, Kiosque
    garantit l''absence de frais de paiement à l''étranger, avec un taux de 0 % appliqué
    sur les transactions de paiement hors zone euro. Les retraits d''espèces effectués
    à l''étranger sont soumis à des frais fixes de 2 € par opération, reflétant les
    coûts opérationnels de nos partenaires.


    2. Cadre réglementaire et conformité

    L''institution Kiosque opère sous la supervision stricte de l''ACPR et de la Banque
    de France, conformément au Code monétaire et financier. La protection des dépôts
    est assurée par le FGDR pour la banque de détail, tandis que les fonds liés aux
    services de paiement font l''objet d''un cantonnement auprès d''une banque partenaire
    pour garantir leur sécurité.


    3. Sécurité et Modifications

    Toute modification des informations liées au compte ou toute opération sensible
    est conditionnée par une vérification d''identité via une pièce officielle. L''authentification
    forte est obligatoire pour tous les paiements en ligne.


    4. Résiliation et Fin de contrat

    Le contrat peut être résilié par l''utilisateur ou par Kiosque moyennant un préavis
    raisonnable. En cas de clôture, les frais annuels de 30 € ne font l''objet d''aucun
    remboursement prorata temporis, sauf disposition contraire prévue par la loi.


    Pour toute question relative aux justificatifs nécessaires, veuillez vous référer
    à Carte Kiosque Voyage — justificatifs à fournir.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 590da5d0-9750-5a39-b9ea-994d92c04427
  title: Carte Kiosque Voyage — pour qui et pour quels usages
  body: 'La Carte Kiosque Voyage est conçue comme l''outil optimisé pour les voyageurs,
    supprimant les barrières financières liées aux déplacements internationaux. Nous
    nous adressons particulièrement aux expatriés, aux voyageurs fréquents et aux
    curieux du monde qui souhaitent éviter les frais bancaires opaques lors de leurs
    transactions à l''étranger.


    Pourquoi choisir ce produit ?

    L''objectif principal est la simplicité et la transparence. Contrairement aux
    offres classiques, nous supprimons les commissions sur les paiements : les frais
    de paiement à l''étranger sont de 0 %. Que vous payiez un hôtel à Tokyo ou un
    restaurant à New York, vous ne payez que le montant de l''achat converti, sans
    surcoût ajouté par Kiosque.


    Caractéristiques tarifaires :

    - Cotisation annuelle : 30 €

    - Frais de paiement hors zone euro : 0 %

    - Frais de retrait d''espèces à l''étranger : 2 € par retrait


    Usages recommandés :

    - Paiements quotidiens en devises étrangères : Idéal pour les achats par carte
    grâce au taux de 0 %.

    - Retraits occasionnels : Le coût fixe de 2 € rend les retraits prévisibles, contrairement
    aux pourcentages variables pratiqués ailleurs.

    - Gestion budgétaire : La tarification forfaitaire de 30 € par an permet de mieux
    planifier ses dépenses de voyage sans craindre les frais cachés.


    Ce produit s''intègre parfaitement avec notre offre d''entrée. Pour découvrir
    comment ouvrir votre compte rapidement, consultez Compte Kiosque — présentation.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 6e3b9f1a-c244-5944-a3e8-29da88480456
  title: 'Carte Kiosque Voyage — frais de paiement hors zone euro : explications'
  body: "Question : Comment sont calculés les frais lorsque je paie un commerçant\
    \ dans une devise autre que l'euro ?\nRéponse : Avec la Carte Kiosque Voyage,\
    \ nous avons supprimé les commissions de change sur les paiements. Les frais de\
    \ paiement hors zone euro sont de 0 %. Vous ne payez donc aucun frais supplémentaire\
    \ ajouté par Kiosque lors de vos achats par carte à l'étranger.\n\nQuestion :\
    \ Ce taux de 0 % s'applique-t-il également aux retraits au distributeur ?\nRéponse\
    \ : Non, le taux de 0 % concerne uniquement les paiements (achats). Pour les retraits\
    \ d'espèces à l'étranger, nous appliquons des frais fixes de 2 € par opération\
    \ pour couvrir les coûts de nos partenaires. \n\nPour plus de détails sur l'ensemble\
    \ de nos tarifs, vous pouvez consulter la Carte Kiosque Voyage — grille tarifaire."
