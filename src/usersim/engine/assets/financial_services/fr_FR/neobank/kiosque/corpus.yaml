- id: e11af793-9b76-5270-970e-f8c9eac52072
  title: Compte Kiosque — comparaison avec les alternatives et quand ne pas le choisir
  body: 'Pour vous aider à choisir la solution bancaire la plus adaptée à vos besoins,
    nous présentons ici la position du Compte Kiosque face aux alternatives du marché.
    Notre approche repose sur l''accessibilité universelle et la rapidité d''exécution.


    **Pourquoi choisir le Compte Kiosque ?**

    - **Rapidité extrême :** Là où les banques traditionnelles demandent des rendez-vous
    et des jours de traitement, nous ouvrons votre compte en 5 minutes dans nos points
    de vente agréés.

    - **Inclusion totale :** Nous n''appliquons aucune condition de revenus ni de
    patrimoine. C''est l''outil idéal pour les populations sous-bancarisées et les
    jeunes.

    - **Transparence des coûts :** Avec une cotisation annuelle forfaitaire de 24
    €, vous savez exactement ce que vous payez.


    **Quand ne PAS choisir le Compte Kiosque ?**

    - **Besoin de découvert :** Si vous recherchez une banque autorisant des facilités
    de caisse ou un découvert autorisé, le Compte Kiosque ne vous conviendra pas.
    Nous utilisons une carte à autorisation systématique : si le solde est à 0 €,
    le paiement est refusé.

    - **Aversion totale pour les frais de service :** Bien que nous soyons abordables,
    certains services reflètent les coûts opérationnels de nos partenaires. Par exemple,
    le dépôt d''espèces engendre des frais de 2 % et chaque retrait au distributeur
    coûte 1 €.

    - **Besoin de services de gestion de patrimoine complexes :** Nous nous concentrons
    sur la banque au quotidien et l''accessibilité. Pour des conseils fiscaux ou juridiques
    individualisés, nous ne sommes pas l''interlocuteur approprié.


    En résumé, choisissez le Compte Kiosque pour sa simplicité, son ouverture éclair
    et son refus des critères de revenus. Tournez-vous vers des alternatives si vous
    avez besoin de crédits à court terme ou d''une gratuité totale sur les dépôts
    d''espèces.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: b4407b6e-ed02-54b9-8793-9682a9b1d3d2
  title: Compte Kiosque — coûts et frais
  body: '« Quels sont les frais fixes pour posséder un Compte Kiosque ? »


    Nous appliquons une tarification forfaitaire pour garantir la viabilité de notre
    modèle inclusive. La cotisation annuelle pour votre compte est de 24 €.


    « Combien coûte un dépôt d''espèces en point de vente ? »


    Le dépôt d''espèces s''effectue chez nos partenaires (tabacs, presse). Pour couvrir
    les coûts opérationnels de ces points de vente, nous appliquons des frais de 2
    % sur le montant déposé.


    « Y a-t-il des frais lorsque je retire de l''argent au distributeur ? »


    Oui, chaque retrait d''espèces effectué via un distributeur automatique de billets
    entraîne des frais fixes de 1 €.


    Pour une vue d''ensemble complète, vous pouvez consulter le document Compte Kiosque
    — grille tarifaire.'
