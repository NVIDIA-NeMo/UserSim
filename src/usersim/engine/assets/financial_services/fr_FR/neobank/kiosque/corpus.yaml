- id: 95c9b70e-36c8-5dba-818d-0615bd358cfe
  title: Compte Kiosque 12-17 ans — protection contre la fraude et les opérations
    non autorisées
  body: 'Chez Kiosque, la sécurité des premiers pas financiers des jeunes est notre
    priorité absolue. Pour protéger le Compte Kiosque 12-17 ans, nous appliquons des
    mesures de sécurité rigoureuses, notamment l''authentification forte, systématiquement
    requise pour sécuriser tous les paiements effectués en ligne.


    Il est essentiel de savoir que nous n''exigerons jamais vos codes secrets par
    message ou par téléphone. La vérification de l''identité via une pièce officielle
    est obligatoire avant toute modification d''information ou opération sensible
    sur le compte. Si vous constatez une opération que vous n''avez pas autorisée,
    nous vous invitons à nous le signaler immédiatement.


    Nous appliquons une politique de protection rigoureuse : vous disposez d''un délai
    de contestation de 13 mois pour toute opération non autorisée. Conformément aux
    délais réglementaires, le remboursement intervient généralement dès le premier
    jour ouvré suivant la notification de la fraude, afin de limiter l''impact financier
    pour le jeune utilisateur et sa famille.


    En cas de doute sur une transaction ou si la carte est égarée, la première action
    à entreprendre est de demander le blocage immédiat du moyen de paiement via notre
    assistance. Cette réactivité est la meilleure défense contre l''utilisation frauduleuse
    des fonds.


    Pour plus de détails sur la gestion globale de la sécurité, vous pouvez consulter
    le document Compte Kiosque — protection contre la fraude et les opérations non
    autorisées.'
