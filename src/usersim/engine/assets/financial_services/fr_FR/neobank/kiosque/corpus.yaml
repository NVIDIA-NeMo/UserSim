- id: 7830bc9d-5630-5197-9316-c329c42012d3
  title: 'Compte Kiosque 12-17 ans — âge minimal : explications'
  body: 'Quel est l''âge requis pour ouvrir un Compte Kiosque 12-17 ans ?

    L''âge minimal pour bénéficier de ce produit est de 12 ans. Nous avons fixé ce
    seuil pour nous assurer que le jeune utilisateur possède la maturité nécessaire
    pour manipuler un moyen de paiement, tout en restant accompagné par un représentant
    légal.


    Puis-je ouvrir un compte pour mon enfant s''il a 11 ans ?

    Non, l''ouverture n''est possible qu''à partir du 12e anniversaire. Nous vous
    invitons à revenir vers nous dès que ce critère est rempli pour profiter de notre
    offre d''initiation financière.


    Que se passe-t-il quand l''enfant atteint 18 ans ?

    Le compte adolescent arrive à son terme. Nous vous accompagnerons alors pour migrer
    vers un compte adulte standard. Pour plus de détails sur les conditions d''éligibilité,
    consultez Compte Kiosque 12-17 ans — conditions d''éligibilité.'
