- id: b714c7af-f9f2-58ff-b8dc-f70347c0776f
  title: Compte Kiosque 12-17 ans — frais ou montant inattendu
  body: 'Symptôme : Le client signale un prélèvement qu''il ne reconnaît pas ou un
    montant déduit du solde sans transaction apparente.


    Causes probables et vérifications :

    1. Cotisation annuelle : Vérifiez si la date anniversaire du compte est proche.
    Le Compte Kiosque 12-17 ans comporte des frais annuels de 20 €. Si ce montant
    a été prélevé, il s''agit de la cotisation forfaitaire standard.

    2. Dépôts d''espèces : Si le client a déposé des fonds en point de vente partenaire,
    vérifiez s''une commission de 2 % a été appliquée. Ces frais reflètent les coûts
    opérationnels de nos partenaires (bureaux de tabac, marchands de journaux).

    3. Plafond hebdomadaire : Si une transaction a été refusée alors que le solde
    est positif, vérifiez si le plafond de paiement hebdomadaire de 150 € a été atteint.
    Le montant n''est pas « disparu », mais la transaction est bloquée.


    Résolution :

    - Si le frais est légitime (cotisation de 20 € ou frais de dépôt de 2 %), expliquez
    pédagogiquement la nature du frais au client.

    - Si le plafond de 150 € est atteint, informez le client que le plafond sera réinitialisé
    automatiquement au début de la semaine suivante.


    Escalade :

    Si le montant prélevé ne correspond à aucune de ces catégories, nous ouvrirons
    un dossier de recherche d''opération. Le client recevra une notification dès que
    l''analyse technique sera terminée, généralement sous quelques jours ouvrés. Pour
    plus d''informations sur les erreurs de montant, voyez Compte Kiosque 12-17 ans
    — écart avec vos relevés.'
