- id: 9f0cd6d2-3fef-5052-a49b-21b578af21a8
  title: Virement instantané Kiosque — souscrire et activer
  body: 'Le Virement instantané Kiosque n''est pas un produit à souscrire séparément,
    mais une fonctionnalité nativement disponible pour tout détenteur de compte actif.
    Si vous comparez notre offre avec d''autres banques, sachez que nous activons
    ce service dès l''ouverture de votre compte, sans frais d''activation ni abonnement.


    Voici la marche à suivre pour effectuer votre premier transfert :


    1. Préparez les informations du bénéficiaire : vous devez disposer de son nom
    complet et de son IBAN.

    2. Indiquez-nous le montant que vous souhaitez envoyer. Assurez-vous que ce montant,
    ajouté à vos autres transferts du jour, ne dépasse pas la limite quotidienne de
    3 000 €.

    3. Validez l''identité du bénéficiaire : nous procédons à une vérification du
    nom pour nous assurer de la concordance avec l''IBAN fourni.

    4. Confirmez l''opération : vous devrez utiliser l''authentification forte pour
    sécuriser et valider définitivement le paiement.


    Une fois ces étapes franchies, nous exécutons le transfert immédiatement. Vous
    recevrez une notification de confirmation et les fonds seront disponibles sur
    le compte du destinataire en quelques secondes.


    Si vous n''avez pas encore de compte, nous vous rappelons que l''ouverture d''un
    Compte Kiosque se fait en 5 minutes dans nos points de vente agréés, sans condition
    de revenus. Pour plus de détails sur l''ouverture, consultez Compte Kiosque —
    souscrire et activer.'
