- id: 087957b1-700e-5387-93d0-b06e37ecc44b
  title: Compte Kiosque — présentation
  body: "Bienvenue chez Kiosque. Nous avons conçu le Compte Kiosque pour rendre les\
    \ services bancaires accessibles à tous, sans exception. Notre mission est simple\
    \ : offrir une solution financière inclusive, rapide et transparente pour le grand\
    \ public, les jeunes et les personnes sous-bancarisées.\n\nLe point fort de notre\
    \ offre réside dans sa simplicité d'accès. Contrairement aux établissements traditionnels,\
    \ nous ne posons aucune condition de revenus ni de patrimoine pour l'ouverture\
    \ de votre compte. Vous pouvez ouvrir votre compte en seulement 5 minutes dans\
    \ l'un de nos points de vente agréés, tels que vos bureaux de tabac ou marchands\
    \ de journaux habituels.\n\nPour garantir la viabilité de ce service universel\
    \ tout en restant abordables, nous appliquons une tarification forfaitaire et\
    \ claire. Le Compte Kiosque est soumis à une cotisation annuelle de 24 €. \n\n\
    Nous facilitons également la gestion de vos espèces. Vous pouvez déposer des fonds\
    \ directement dans nos points de vente partenaires. Ces opérations sont soumises\
    \ à des frais de dépôt d'espèces de 2 %, un montant qui reflète les coûts opérationnels\
    \ de nos partenaires de proximité.\n\nPour vos besoins de liquidités, nous proposons\
    \ un accès simple aux distributeurs. Chaque retrait par automate bancaire entraîne\
    \ des frais de retrait de 1 €.\n\nEn choisissant le Compte Kiosque, vous optez\
    \ pour une banque qui privilégie l'exécution rapide et l'accueil pédagogique.\
    \ Nous vous accompagnons dans votre quotidien avec un outil efficace, sécurisé\
    \ et sans ambiguïté sur les coûts.\n\nPour consulter le détail complet de nos\
    \ tarifs, nous vous invitons à consulter le document Compte Kiosque — grille tarifaire."
  domain: retail_banking
  product_category: compte_kiosque
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 5b9ac194-ddc8-5c95-9715-68c3aab9722d
  title: 'Compte Kiosque — cotisation annuelle : explications'
  body: 'Pourquoi le Compte Kiosque prévoit-il une cotisation annuelle ?


    Nous avons opté pour une tarification forfaitaire afin d''assurer la viabilité
    et la pérennité de notre service tout en restant accessibles au plus grand nombre.
    Cette cotisation annuelle de 24 € nous permet de maintenir un réseau de points
    de vente partenaires et de garantir la rapidité d''exécution de nos services sans
    imposer de conditions de revenus à l''ouverture.


    Quand cette cotisation est-elle prélevée ?


    La cotisation de 24 € est prélevée une fois par an sur votre compte. Nous nous
    engageons à une transparence totale : vous trouverez cette mention clairement
    indiquée dans vos conditions tarifaires.


    Ce montant est-il négociable ?


    Afin de garantir l''équité et l''accessibilité universelle pour tous nos clients,
    ce forfait est unique et s''applique de la même manière à chaque utilisateur du
    compte.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 013c725f-876b-539d-886b-be76c0a91d07
  title: Compte Kiosque — souscrire et activer
  body: 'L''ouverture d''un Compte Kiosque est conçue pour être la plus rapide et
    la plus simple du marché. Voici la marche à suivre pour activer vos services bancaires.


    Avant de commencer, assurez-vous de posséder une pièce d''identité officielle
    en cours de validité (carte d''identité, passeport). C''est la seule condition
    obligatoire pour l''ouverture.


    1. Rendez-vous dans un point de vente agréé Kiosque (bureau de tabac ou marchand
    de journaux partenaire).

    2. Présentez votre pièce d''identité officielle à l''agent partenaire pour la
    vérification obligatoire.

    3. Complétez les informations demandées. Grâce à notre processus optimisé, l''ouverture
    complète de votre compte est réalisée en 5 minutes.

    4. Nous vous confirmerons l''ouverture et l''activation immédiate de votre compte
    via le canal de communication choisi lors de l''inscription.

    5. Effectuez votre premier dépôt pour alimenter votre compte. Si vous déposez
    des espèces au point de vente, sachez que des frais de dépôt d''espèces de 2 %
    seront appliqués.


    Une fois ces étapes franchies, vous disposez d''un accès bancaire universel. Vous
    n''avez aucun justificatif de revenus ou de patrimoine à nous fournir, conformément
    à notre politique d''inclusion.


    Pour plus de détails sur les critères d''accès, vous pouvez consulter Compte Kiosque
    — conditions d''éligibilité.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: c8400116-667d-5def-9bca-d1927a653e14
  title: Compte Kiosque — grille tarifaire
  body: 'Voici la grille tarifaire applicable au Compte Kiosque. Nous appliquons une
    politique de frais forfaitaires et transparents.


    - Cotisation annuelle du compte : 24 €

    - Frais de dépôt d''espèces en point de vente partenaire : 2 % du montant déposé

    - Frais de retrait aux distributeurs automatiques (ATM) : 1 € par opération


    Ces tarifs sont fixes et s''appliquent sans condition de revenus. Les frais de
    dépôt reflètent directement les coûts opérationnels supportés par nos points de
    vente partenaires (bureaux de tabac et marchands de journaux).'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: f528c294-e04f-59e7-a70e-570d41fe47fa
  title: Compte Kiosque — opération échouée ou en attente
  body: 'Il peut arriver qu''une opération sur votre Compte Kiosque soit refusée ou
    reste en attente. Voici comment identifier la cause et résoudre la situation.


    Symptôme : « Mon paiement a été refusé » ou « Je ne peux pas retirer d''argent
    ».


    Causes probables et vérifications :

    1. Solde insuffisant : Le Compte Kiosque fonctionne comme une carte à autorisation
    systématique. Cela signifie que nous vérifions votre solde en temps réel avant
    chaque transaction. Si le solde est insuffisant, l''opération est systématiquement
    bloquée pour vous éviter tout découvert.

    2. Vérification d''identité manquante : Si vous tentez une modification d''information
    ou une opération sensible, celle-ci peut rester en attente si votre pièce d''identité
    officielle n''a pas été validée ou est expirée.

    3. Problème technique du point de vente : Lors d''un dépôt d''espèces, un incident
    technique peut survenir chez notre partenaire.


    Comment résoudre le problème :

    - Vérifiez votre solde actuel via vos outils de suivi. Si le solde est trop bas,
    effectuez un nouveau dépôt (en tenant compte des frais de dépôt d''espèces de
    2 %).

    - Assurez-vous que vos documents d''identité sont à jour. Toute modification nécessite
    une nouvelle vérification officielle.

    - En cas de doute sur une opération en attente, demandez-nous une clarification
    sur le statut de la transaction.


    Quand escalader la demande ?

    Si le solde est suffisant et l''identité vérifiée, mais que l''opération échoue
    toujours, nous escaladerons votre demande vers notre support centralisé de Kiosque
    pour une analyse approfondie. Vous recevrez une réponse selon les délais réglementaires.


    Pour comprendre les protections liées à vos opérations, consultez Compte Kiosque
    — informations réglementaires.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: dc21e3ea-2b5f-5530-87b4-114f8c79d910
  title: Compte Kiosque — conditions d'éligibilité
  body: 'L''accès au Compte Kiosque est régi par notre politique d''accessibilité
    universelle. Voici les conditions d''éligibilité :


    | Condition | Exigence | Résultat |

    | :--- | :--- | :--- |

    | Identité | Pièce d''identité officielle valide | Accès autorisé |

    | Revenus | Aucun montant minimum requis | Accès autorisé |

    | Patrimoine | Aucun actif minimum requis | Accès autorisé |

    | Domiciliation | Résidence en France (pour le droit au compte) | Accès autorisé
    |

    | Âge | 18 ans et plus | Accès autorisé |


    Conformément au droit au compte, toute personne domiciliée en France peut obtenir
    l''ouverture d''un compte de dépôt chez nous, sans que sa situation financière
    ne puisse constituer un obstacle.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 3759576b-490f-53be-b2e4-82e8c38e60fa
  title: Compte Kiosque — face à un produit similaire de l'établissement
  body: 'Si vous hésitez entre le Compte Kiosque et le Compte Kiosque 12-17 ans, voici
    les éléments clés pour choisir l''option la mieux adaptée à votre profil.


    Le Compte Kiosque est destiné aux adultes. Il offre une autonomie complète avec
    une cotisation annuelle de 24 €, sans plafond de dépenses hebdomadaire imposé
    par l''institution, et permet la gestion libre des dépôts et retraits.


    Le Compte Kiosque 12-17 ans est une solution d''initiation financière sécurisée.
    Contrairement au compte adulte, il impose un plafond hebdomadaire strict de 150
    € pour encadrer l''apprentissage de la gestion budgétaire des adolescents.


    En résumé :

    - Choisissez le Compte Kiosque si vous avez plus de 18 ans et recherchez un accès
    bancaire universel et rapide.

    - Choisissez le Compte Kiosque 12-17 ans pour un mineur souhaitant apprendre à
    gérer son argent avec une sécurité renforcée et un plafond de 150 € par semaine.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: b75b1152-f1d8-5ea1-be96-55625290a191
  title: Compte Kiosque — informations réglementaires
  body: 'L''institution Kiosque opère sous la supervision rigoureuse de l''ACPR et
    de la Banque de France, et respecte strictement les dispositions du Code monétaire
    et financier.


    Protection des fonds :

    Pour garantir la sécurité de vos avoirs, nous utilisons deux mécanismes de protection.
    Pour la banque de détail, la protection est assurée par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR). Pour les services de paiement, nous appliquons
    le principe du cantonnement : vos fonds sont déposés auprès d''un établissement
    de crédit partenaire, restant ainsi distincts des fonds propres de Kiosque.


    Sécurité et Vérification :

    Conformément aux obligations de vigilance, la présentation d''une pièce d''identité
    officielle est obligatoire avant toute modification d''information personnelle
    ou toute opération sur le compte. L''authentification forte est systématiquement
    appliquée pour sécuriser l''ensemble de vos paiements en ligne.


    Traitement des litiges et fraudes :

    Nous appliquons une politique de protection rigoureuse. En cas d''opération non
    autorisée, vous disposez d''un délai de contestation de 13 mois. Le remboursement
    intervient selon les délais réglementaires, généralement dès le premier jour ouvré
    suivant la notification de l''incident.


    Limites de conseil :

    Kiosque fournit des informations à vocation éducative et descriptive sur ses produits.
    Nous ne délivrons aucun conseil fiscal ou juridique individualisé. Nous nous engageons
    cependant à une transparence totale sur les coûts, notamment la cotisation annuelle
    de 24 €, et sur les plafonds applicables.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: fce6c6ea-cfcf-54ea-b698-7255a8ad2dba
  title: Compte Kiosque — grille des taux
  body: 'Le Compte Kiosque est un compte de dépôt conçu pour l''accessibilité et la
    fluidité des transactions quotidiennes.


    Taux de rémunération :

    Le taux d''intérêt annuel applicable aux soldes du Compte Kiosque est de 0 %.
    Ce compte n''est pas un produit d''épargne rémunéré, mais un outil de gestion
    courante.


    Ce taux de 0 % s''applique à l''ensemble des soldes, sans palier ni condition
    de montant. Aucun frais supplémentaire n''est prélevé en fonction du taux, la
    tarification restant forfaitaire avec la cotisation annuelle de 24 €.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: rate_sheet
  source_authority: official
  placeholder: true
