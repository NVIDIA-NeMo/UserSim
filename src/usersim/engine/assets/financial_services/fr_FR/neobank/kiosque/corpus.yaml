- id: f49bd974-f20d-51ca-976b-ddb9c48d94c4
  title: Virement instantané Kiosque — confidentialité et protection des données
  body: 'L''utilisation du Virement instantané Kiosque implique le traitement de données
    personnelles et financières conformément au Règlement Général sur la Protection
    des Données (RGPD) et sous la supervision de l''ACPR et de la Banque de France.


    Collecte et Utilisation des Données :

    Pour chaque transfert, nous collectons les informations nécessaires à l''exécution
    de l''opération : votre identité, le montant, et les coordonnées bancaires du
    bénéficiaire. Ces données sont utilisées exclusivement pour vérifier l''identité
    des parties, lutter contre le blanchiment d''argent et assurer la sécurité du
    transfert via la vérification du nom du bénéficiaire.


    Protection des Fonds :

    Conformément à notre modèle de service, nous assurons la protection des fonds
    via le cantonnement. Cela signifie que vos fonds sont déposés auprès d''un établissement
    de crédit partenaire et sont distincts des fonds propres de Kiosque. Cette mesure
    garantit que vos avoirs sont protégés même en cas de difficulté financière de
    l''institution.


    Sécurité et Accès :

    L''authentification forte est systématiquement appliquée pour chaque virement.
    Nous nous engageons à ne jamais divulguer vos informations de transaction à des
    tiers, sauf obligation légale ou demande des autorités de régulation dans le cadre
    de la lutte contre la fraude.


    Droits de l''utilisateur :

    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Toute modification d''information critique nécessite la
    présentation d''une pièce officielle pour éviter toute usurpation d''identité.


    Pour plus de précisions sur la gestion de vos données personnelles au sein de
    l''établissement, nous vous invitons à consulter le document Compte Kiosque —
    confidentialité et protection des données.'
  domain: payments
  product_category: virement_instantane
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 4640af9c-474e-5e44-9650-be246b857920
  title: Virement instantané Kiosque — reconnaître les arnaques visant ce produit
  body: "Le Virement instantané Kiosque est conçu pour vous offrir une rapidité d'exécution\
    \ maximale. Cependant, c'est précisément cette vitesse qui attire les fraudeurs\
    \ : une fois l'opération validée, les fonds sont transférés en quelques secondes\
    \ et sont quasiment impossibles à récupérer.\n\nNous vous alertons sur les scénarios\
    \ d'arnaques les plus fréquents :\n\n1. L'urgence fabriquée : Un interlocuteur\
    \ (se présentant comme un proche en difficulté, un agent administratif ou un support\
    \ technique) vous presse d'effectuer un virement immédiat pour résoudre un problème\
    \ critique. L'insistance sur la rapidité est le signal d'alerte principal.\n2.\
    \ L'offre trop belle pour être vraie : On vous demande de verser une somme pour\
    \ débloquer un gain, un héritage ou un prêt. Rappelez-vous que nous ne vous demanderons\
    \ jamais d'envoyer d'argent pour accéder à des fonds.\n3. Le faux support Kiosque\
    \ : Un individu prétendant travailler pour nous vous demande vos codes d'accès\
    \ ou vous demande de réaliser un virement vers un « compte de sécurisation ».\
    \ \n\nSachez que nous ne vous demanderons jamais votre code secret, votre mot\
    \ de passe ou de valider une opération que vous n'avez pas initiée.\n\nSi vous\
    \ constatez une opération non autorisée, nous appliquons une politique de protection\
    \ rigoureuse. Vous disposez d'un délai de contestation de 13 mois pour nous signaler\
    \ l'anomalie. Le remboursement intervient généralement dès le premier jour ouvré\
    \ suivant la notification, conformément aux délais réglementaires.\n\nEn cas de\
    \ doute, ne validez pas l'opération. Prenez le temps de vérifier l'identité du\
    \ bénéficiaire. Si vous pensez avoir été victime d'une fraude, nous vous demandons\
    \ de nous signaler l'opération immédiatement afin que nous puissions prendre les\
    \ mesures de protection nécessaires sur votre compte."
  domain: payments
  product_category: virement_instantane
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 90bbfc2e-5544-5987-ba33-b479a9d3d905
  title: Virement instantané Kiosque — plafonds, restrictions et cas particuliers
  body: 'Le Virement instantané Kiosque permet le transfert de fonds immédiat et gratuit,
    sécurisé par la vérification du nom du bénéficiaire. Pour garantir la sécurité
    des opérations et la viabilité du réseau, nous appliquons des règles strictes
    de plafonnement et de vérification.


    Frais et Limites :

    - Frais de transaction : 0 € (le service est entièrement gratuit).

    - Plafond quotidien de transfert : 3 000 €. Ce montant est la limite maximale
    cumulée que vous pouvez envoyer par jour via ce mode de transfert. Une fois ce
    seuil atteint, vous devrez attendre le lendemain ou utiliser un autre mode de
    transfert si disponible.


    Restrictions et Conditions d''exécution :

    - Vérification d''identité : Conformément à notre politique de sécurité, la vérification
    de l''identité via une pièce officielle est obligatoire avant toute modification
    d''information ou opération sensible sur le compte. L''authentification forte
    est systématiquement appliquée pour sécuriser chaque envoi.

    - Vérification du bénéficiaire : Pour limiter les risques d''erreur, le nom du
    bénéficiaire est vérifié lors de l''initiation du transfert. Si les informations
    sont incohérentes, l''opération peut être bloquée.

    - Solde disponible : Le virement ne peut être exécuté que si le solde du compte
    est suffisant au moment de l''envoi. Contrairement à certains comptes classiques,
    nous ne permettons pas de découvert via le Virement instantané Kiosque.


    Cas particuliers :

    En cas de dépassement du plafond de 3 000 €, l''opération sera systématiquement
    refusée. Nous ne proposons pas d''augmentation temporaire de ce plafond pour les
    virements instantanés afin de maintenir un niveau de risque maîtrisé. Pour des
    montants supérieurs, nous vous invitons à consulter les options de transfert standard
    disponibles sur votre compte.'
  domain: payments
  product_category: virement_instantane
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 42aebd47-066a-5cf3-bd90-31260d6b74ae
  title: Virement instantané Kiosque — éligibilité et souscription
  body: 'Voici les réponses aux questions les plus fréquentes concernant l''accès
    au Virement instantané Kiosque.


    Qui peut utiliser le Virement instantané Kiosque ?

    Ce service est accessible à tout client détenteur d''un compte chez nous, dès
    l''ouverture de celui-ci. Il n''y a aucune condition de revenus ni de patrimoine
    pour en bénéficier.


    Comment souscrire à ce service ?

    Il n''y a pas de souscription spécifique. Le Virement instantané Kiosque est une
    fonctionnalité nativement intégrée à votre compte. Elle est active dès que votre
    identité a été vérifiée avec une pièce officielle.


    Quel est le coût de l''activation et de l''utilisation ?

    L''activation est gratuite et chaque transfert effectué via ce service a un coût
    de 0 €.


    Quels sont les prérequis techniques ?

    L''utilisation nécessite l''application Kiosque et la validation de l''authentification
    forte pour sécuriser vos paiements.'
  domain: payments
  product_category: virement_instantane
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 91643fab-fc0b-5e06-b23a-2b0a1f4c4360
  title: Virement instantané Kiosque — consulter le suivi ou l'historique
  body: 'Pour assurer une transparence totale sur vos flux financiers, nous mettons
    à votre disposition un historique détaillé de vos transferts. Voici comment consulter
    le suivi de vos opérations de Virement instantané Kiosque.


    Ce que vous devez avoir avant de commencer :

    - Votre accès sécurisé à l''interface Kiosque.

    - Votre mot de passe ou votre méthode d''authentification biométrique.


    Étapes de consultation :

    1. Accédez à la section « Historique » ou « Activité » de votre compte. Vous y
    trouverez la liste chronologique de toutes vos transactions.

    2. Parcourez la liste pour identifier le virement concerné. Les opérations de
    virement instantané sont signalées par un indicateur spécifique (éclair ou mention
    « Instantané »).

    3. Cliquez sur l''opération pour ouvrir le détail du transfert. Vous pourrez alors
    vérifier le montant envoyé, la date et l''heure exacte, ainsi que le nom du bénéficiaire.

    4. Vérifiez le statut de l''opération. Un virement instantané réussi affichera
    le statut « Exécuté » ou « Complété » quasi immédiatement après l''envoi.


    Comment savoir si l''opération a réussi ?

    L''opération est confirmée dès que vous voyez le montant débité de votre solde
    et que le statut du virement passe à « Exécuté ». En raison de la nature du service,
    les fonds parviennent au bénéficiaire en quelques secondes.


    Si vous remarquez une erreur dans l''historique ou si un virement semble avoir
    été débité sans être marqué comme exécuté, nous vous invitons à nous le signaler
    pour une vérification immédiate.'
  domain: payments
  product_category: virement_instantane
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 22b19e45-7c85-5461-800b-0dbc0a42c469
  title: Virement instantané Kiosque — opération refusée ou bloquée
  body: 'Il peut arriver qu''un Virement instantané Kiosque soit refusé ou bloqué.
    Voici les causes les plus probables et la marche à suivre pour résoudre la situation.


    Symptôme : Vous recevez un message d''erreur indiquant que le virement ne peut
    pas être effectué ou l''opération est marquée comme « Refusée ».


    Causes possibles et vérifications :

    1. Dépassement du plafond quotidien : Vérifiez si le montant de votre transfert,
    ajouté aux autres virements du jour, dépasse la limite de 3 000 €. Si c''est le
    cas, l''opération est systématiquement bloquée pour des raisons de sécurité.

    2. Solde insuffisant : Assurez-vous que votre solde disponible est supérieur ou
    égal au montant du virement. Nous ne permettons aucun découvert sur ce produit.

    3. Erreur dans les coordonnées du bénéficiaire : Vérifiez l''IBAN saisi. Si le
    nom du bénéficiaire ne correspond pas aux informations enregistrées auprès de
    la banque de destination, le virement peut être rejeté pour prévenir la fraude.

    4. Défaut d''authentification : Si vous n''avez pas validé l''authentification
    forte ou si votre pièce d''identité n''est plus à jour dans notre système, la
    transaction sera bloquée.


    Comment résoudre le problème :

    - Si le plafond est atteint : Patientez jusqu''au lendemain pour effectuer un
    nouveau transfert.

    - Si le solde est insuffisant : Alimentez votre compte, par exemple via un dépôt
    d''espèces en point de vente (soumis aux frais opérationnels de 2 %), puis retentez
    l''opération.

    - Si les coordonnées sont erronées : Supprimez le bénéficiaire et recréez-le avec
    les informations exactes.


    Quand nous solliciter :

    Si aucune de ces causes n''explique le blocage, nous allons escalader votre demande
    vers notre support centralisé. Nous analyserons les logs de transaction pour identifier
    l''origine technique du refus et nous vous confirmerons la résolution sous 24
    heures ouvrées.'
  domain: payments
  product_category: virement_instantane
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 5fb04347-f1e8-56fc-929b-f055082352be
  title: Virement instantané Kiosque — quand changer ou monter en gamme
  body: 'Le Virement instantané Kiosque est l''outil idéal pour la rapidité et la
    gratuité. Toutefois, selon vos besoins, d''autres options peuvent être plus adaptées.


    Comparaison avec le virement classique :

    - Vitesse : Le Virement instantané Kiosque est immédiat, tandis que le virement
    classique peut prendre 1 à 3 jours ouvrés.

    - Coût : Les deux options sont gratuites chez nous (0 €).

    - Plafonds : Le Virement instantané est limité à 3 000 € par jour.


    Quand envisager une autre solution ?

    Vous devriez passer par un virement standard si vous devez transférer des sommes
    supérieures au plafond quotidien de 3 000 €. Le virement classique permet généralement
    des montants plus élevés, adaptés aux paiements importants (loyer, achat de mobilier,
    etc.).


    En résumé :

    - Choisissez le Virement instantané Kiosque pour : les urgences, les remboursements
    entre amis et les petits paiements rapides.

    - Choisissez le virement classique pour : les transactions de gros montants dépassant
    3 000 € et les opérations où la rapidité d''exécution n''est pas critique.'
  domain: payments
  product_category: virement_instantane
  document_type: comparison
  source_authority: official
  placeholder: true
