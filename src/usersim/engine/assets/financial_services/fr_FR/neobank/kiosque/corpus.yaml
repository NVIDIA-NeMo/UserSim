  mentions_tools: []
  institution_id: kiosque
- id: 2ffb0d13-9894-5675-9c11-f52989f32eee
  title: Virement instantané Kiosque — présentation
  body: 'Le Virement instantané Kiosque est conçu pour ceux qui ne peuvent pas attendre.
    Nous proposons un service de transfert de fonds immédiat, permettant d''envoyer
    de l''argent à un bénéficiaire en quelques secondes seulement, 24 heures sur 24
    et 7 jours sur 7.


    Notre objectif est de rendre la gestion de l''argent aussi fluide que possible.
    Que ce soit pour rembourser un proche, régler un achat urgent ou soutenir un membre
    de la famille, nous éliminons les délais de traitement bancaires traditionnels.
    La sécurité reste notre priorité : chaque transaction est sécurisée par la vérification
    rigoureuse du nom du bénéficiaire, garantissant que vos fonds arrivent à la bonne
    destination.


    Voici les conditions et limites applicables à ce service :


    - Frais de transaction : Nous avons fait le choix de la transparence et de l''accessibilité.
    Le coût d''un transfert est de 0 €, nous permettant d''offrir ce service sans
    frais supplémentaires pour nos utilisateurs.

    - Plafond d''utilisation : Pour garantir la sécurité des opérations et prévenir
    les risques, nous appliquons une limite de transfert quotidienne de 3 000 €. Ce
    montant représente la somme maximale que vous pouvez envoyer via virement instantané
    sur une seule journée.


    Ce service est pleinement intégré à l''expérience Kiosque, alliant rapidité d''exécution
    et simplicité d''utilisation. Il s''inscrit dans notre volonté d''offrir un accès
    bancaire universel et efficace pour tous, sans condition de revenus.


    Pour comprendre comment ce service s''articule avec vos autres options de gestion,
    nous vous invitons à consulter le document Compte Kiosque — présentation.'
