- id: 3cd4d9cb-19fb-5a7e-a339-8007180169e4
  title: Compte Kiosque — effectuer une modification
  body: 'Vous souhaitez modifier vos informations personnelles (adresse, numéro de
    téléphone, e-mail) ou mettre à jour vos préférences de compte ? Voici la marche
    à suivre pour effectuer ces changements en toute sécurité.


    **Ce dont vous avez besoin avant de commencer :**

    Une pièce d''identité officielle originale et en cours de validité (passeport,
    carte nationale d''identité). La vérification de l''identité est obligatoire pour
    toute modification.


    **Étapes de modification :**


    1. **Demande de modification** : Dites-nous précisément quelle information vous
    souhaitez modifier. Vous pouvez le faire via nos canaux numériques ou en vous
    présentant dans un point de vente partenaire.


    2. **Vérification d''identité** : Présentez-nous votre pièce d''identité officielle.
    Si vous effectuez la demande numériquement, nous vous demanderons de fournir une
    copie numérique certifiée ou de passer par notre processus de vérification sécurisé.
    Nous vérifierons que l''identité correspond parfaitement aux informations actuellement
    enregistrées sur votre compte.


    3. **Saisie des nouvelles informations** : Indiquez-nous les nouvelles coordonnées
    ou les modifications souhaitées. Nous enregistrons les données dans notre système
    après avoir validé votre identité.


    4. **Confirmation de mise à jour** : Nous vous confirmons la prise en compte de
    la modification par un message de confirmation immédiat. Vous recevrez également
    une notification sur vos canaux de communication habituels pour vous alerter que
    vos informations ont été mises à jour.


    **Comment savoir si cela a fonctionné ?**

    Vous pouvez vérifier que vos nouvelles informations sont correctement enregistrées
    en consultant vos détails de profil dans vos accès numériques ou en demandant
    un justificatif de domicile actualisé. Si vous ne recevez pas la confirmation
    dans les 24 heures, nous vous invitons à nous solliciter à nouveau.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: f784bdd4-9d2f-5be9-aec1-efd79fdf669b
  title: Compte Kiosque — problèmes d'accès ou de connexion
  body: 'Vous rencontrez des difficultés pour accéder à votre Compte Kiosque via nos
    canaux numériques ? Voici comment diagnostiquer et résoudre le problème.


    **Symptôme : « Je ne parviens pas à me connecter à mon compte »**


    **Causes probables et vérifications :**


    1. **Identifiants erronés** : Vérifiez que vos identifiants sont correctement
    saisis. Attention aux majuscules et aux espaces involontaires. Si vous avez oublié
    votre mot de passe, demandez-nous la procédure de réinitialisation.


    2. **Échec de l''authentification forte** : L''authentification forte est systématiquement
    appliquée pour sécuriser vos accès. Vérifiez que vous recevez bien la notification
    de validation sur votre appareil enregistré. Si vous avez changé de téléphone,
    vos accès peuvent être bloqués par sécurité.


    3. **Compte restreint** : Dans certains cas, nous pouvons restreindre l''accès
    à un compte si une pièce d''identité officielle n''est plus à jour ou si une activité
    inhabituelle est détectée. Vérifiez si vous avez reçu un message de notre part
    demandant une mise à jour de vos documents.


    **Résolution :**


    - **Si le mot de passe est perdu** : Nous déclenchons une procédure de récupération
    sécurisée après vérification de votre identité. Vous recevrez un lien temporaire
    pour créer un nouveau code.

    - **Si l''authentification forte échoue** : Si vous n''avez plus accès à l''appareil
    de confiance, vous devez nous fournir une nouvelle preuve d''identité officielle
    pour réinitialiser vos paramètres de sécurité.

    - **Si le compte est bloqué** : Présentez-nous votre pièce d''identité officielle
    pour lever la restriction.


    **Quand escalader le problème ?**

    Si malgré ces vérifications vous ne parvenez toujours pas à vous connecter, nous
    escaladons votre demande vers le support centralisé de Kiosque. Un spécialiste
    analysera les logs de connexion pour identifier l''origine technique du blocage.
    Vous recevrez une réponse et une résolution sous 48 heures ouvrées.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 9f63dbac-08e2-569a-a09d-28b3588fd96e
  title: Compte Kiosque — niveaux d'accès
  body: 'Ce tableau définit les conditions d''accès aux fonctionnalités du Compte
    Kiosque pour aider les agents de support à orienter les clients.


    | Condition | Niveau d''accès | Résultat / Action |

    | :--- | :--- | :--- |

    | Présentation d''une pièce d''identité officielle valide | Accès Complet | Ouverture
    du compte en 5 minutes, accès aux opérations et modifications. |

    | Absence de pièce d''identité officielle | Aucun Accès | Ouverture impossible.
    Orienter le client vers l''obtention d''un document officiel. |

    | Demande d''ouverture sans condition de revenus | Éligible | Accès universel
    accordé sans justificatif de patrimoine. |

    | Domiciliation en France sans banque | Droit au compte | Procédure légale applicable
    pour garantir l''accès aux services bancaires de base. |


    L''accès complet inclut la gestion de la cotisation annuelle de 24 € et la possibilité
    d''effectuer des dépôts d''espèces avec les frais de 2 % appliqués en point de
    vente.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: ef83058d-cb0f-5623-a51a-3a0722239965
  title: Compte Kiosque — choisir entre les formules
  body: 'Vous hésitez sur le choix de votre compte chez Kiosque ? Voici comment positionner
    le Compte Kiosque par rapport à nos autres options.


    Le Compte Kiosque est notre solution d''accessibilité universelle. Il se distingue
    par sa simplicité : ouverture en 5 minutes, sans condition de revenus ni de patrimoine.
    C''est la formule idéale pour ceux qui recherchent l''autonomie bancaire immédiate
    avec un coût transparent (cotisation annuelle de 24 €).


    Comparé au Compte Kiosque 12-17 ans, le Compte Kiosque s''adresse aux adultes
    et n''est pas soumis au plafond hebdomadaire de 150 € qui protège les mineurs.
    Tandis que le compte ado est un outil d''initiation, le Compte Kiosque est un
    outil de gestion complète.


    **Lequel choisir ?**

    - Choisissez le **Compte Kiosque** si vous êtes un adulte, si vous avez besoin
    d''un compte rapidement sans justificatif de revenus, et si vous acceptez un forfait
    annuel de 24 € pour un accès universel.

    - Choisissez le **Compte Kiosque 12-17 ans** si vous avez entre 12 et 17 ans pour
    apprendre à gérer votre argent avec un encadrement sécurisé.


    Pour plus de détails, consultez Compte Kiosque 12-17 ans — présentation.'
