    | Situation | Justificatif requis | Résultat attendu |

    | :--- | :--- | :--- |

    | Nouvelle souscription | Pièce d''identité officielle en cours de validité |
    Ouverture du compte et commande de la carte |

    | Modification d''adresse/infos | Pièce d''identité officielle + Justificatif
    de domicile | Mise à jour du dossier client |

    | Demande de remplacement de carte | Pièce d''identité officielle | Expédition
    d''une nouvelle carte |

    | Contestation d''opération | Pièce d''identité officielle | Ouverture du dossier
    de litige |


