- id: fa397043-8928-5082-9427-fb31b206567a
  title: Virement instantané Kiosque — informations réglementaires
  body: 'Le service de Virement instantané Kiosque est fourni dans le strict respect
    du Code monétaire et financier et sous la supervision de l''ACPR et de la Banque
    de France.


    **Protection des fonds et cadre légal**

    Pour les services de paiement, Kiosque assure la protection des fonds des clients
    par le biais du cantonnement. Cela signifie que vos fonds sont déposés auprès
    d''un établissement de crédit partenaire et sont ainsi distincts des fonds propres
    de l''entreprise Kiosque. Cette mesure garantit que vos avoirs restent disponibles
    et protégés, indépendamment de la situation financière de Kiosque.


    **Sécurité et Authentification**

    Conformément aux réglementations européennes sur les services de paiement (DSP2),
    l''authentification forte est systématiquement appliquée pour chaque virement
    instantané. Cette procédure est obligatoire pour sécuriser les fonds et prévenir
    les opérations frauduleuses.


    **Gestion des litiges et fraudes**

    Nous appliquons une politique de protection rigoureuse. En cas d''opération non
    autorisée, le client dispose d''un délai de contestation de 13 mois. Le remboursement
    des sommes contestées intervient selon les délais réglementaires, généralement
    dès le premier jour ouvré suivant la notification de la fraude ou de l''erreur.


    **Limites opérationnelles**

    Le plafond quotidien de 3 000 € est une mesure de gestion des risques et de conformité.
    Kiosque se réserve le droit de suspendre temporairement l''accès au virement instantané
    en cas de suspicion de fraude ou de demande de vérification d''identité complémentaire.
    Toute modification d''information sur le compte nécessite obligatoirement la présentation
    d''une pièce d''identité officielle.'
  domain: payments
  product_category: virement_instantane
  document_type: disclosure
  source_authority: official
