- id: 40bb0f78-7916-598c-a911-4919e911a8ba
  title: Carte Kiosque Voyage — choisir entre les formules
  body: 'Vous hésitez entre notre offre standard et la Carte Kiosque Voyage ? Voici
    les éléments clés pour vous aider à choisir la formule la plus adaptée à vos besoins.


    La formule standard est idéale pour une gestion quotidienne simple et locale,
    sans frais de cotisation annuelle élevés. Elle convient parfaitement à ceux qui
    restent principalement en France.


    La Carte Kiosque Voyage est conçue pour ceux qui se déplacent fréquemment à l''international.
    Sa valeur ajoutée réside dans la suppression totale des frais de paiement à l''étranger,
    avec un taux de 0 %. En échange de cet avantage, elle implique une cotisation
    annuelle de 30 € et des frais de retrait hors zone euro de 2 €.


    En résumé :

    - Choisissez la formule standard si vous privilégiez l''absence de frais fixes
    annuels et que vous voyagez rarement.

    - Choisissez la Carte Kiosque Voyage si vous effectuez régulièrement des achats
    en devises étrangères et souhaitez éviter les commissions de change sur vos paiements.


    Pour une vision complète des tarifs, nous vous invitons à consulter la Carte Kiosque
    Voyage — grille tarifaire.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2b7ca0ec-b794-53b1-9b9c-46e185cac47c
  title: Carte Kiosque Voyage — confidentialité et protection des données
  body: 'L''utilisation de la Carte Kiosque Voyage implique le traitement de vos données
    personnelles conformément au Règlement Général sur la Protection des Données (RGPD)
    et aux directives de l''ACPR et de la Banque de France.


    Nous collectons et traitons vos données d''identité uniquement pour répondre à
    nos obligations légales de vigilance et pour sécuriser vos transactions. La vérification
    de l''identité via une pièce officielle est une condition obligatoire pour toute
    modification d''information ou opération sur le compte. Ces données sont traitées
    avec la plus stricte confidentialité.


    En ce qui concerne la protection de vos fonds, nous appliquons un système de cantonnement
    : vos fonds sont déposés auprès d''un établissement de crédit partenaire, les
    rendant ainsi distincts des fonds propres de Kiosque. De plus, pour la partie
    banque de détail, la protection est assurée par le Fonds de Garantie des Dépôts
    et de Résolution (FGDR).


    Nous nous engageons à une transparence totale sur l''utilisation de vos données.
    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles, sous réserve des obligations de conservation légales imposées
    par le Code monétaire et financier.


    Pour comprendre comment nous gérons les risques liés aux services de paiement,
    vous pouvez également consulter le document Carte Kiosque Voyage — informations
    sur les risques.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 3d1abbcc-a410-594d-8fb6-acb964cceec3
  title: Carte Kiosque Voyage — reconnaître les arnaques visant ce produit
  body: 'L''utilisation de la Carte Kiosque Voyage à l''étranger peut malheureusement
    attirer l''attention de fraudeurs utilisant des techniques de phishing ciblées.
    Nous souhaitons vous aider à identifier les tentatives d''escroquerie pour protéger
    vos fonds.


    Les arnaques les plus fréquentes prennent souvent la forme de courriels ou de
    SMS urgents vous alertant d''une « activité suspecte » sur votre carte lors d''un
    paiement à l''étranger. Ces messages vous incitent à cliquer sur un lien pour
    « débloquer » votre compte ou à fournir vos codes secrets. Sachez que nous ne
    vous demanderons jamais votre code confidentiel ou vos identifiants de connexion
    par message ou par téléphone.


    Une autre technique consiste à vous proposer des offres de « cashback » mirobolantes
    pour vos dépenses internationales en échange de la mise à jour de vos informations
    personnelles sur un site non sécurisé. Rappelez-vous que toute modification d''information
    sur votre compte nécessite obligatoirement la présentation d''une pièce d''identité
    officielle, conformément à nos protocoles de sécurité.


    Si vous constatez une opération que vous n''avez pas autorisée, nous appliquons
    une politique de protection rigoureuse. Vous disposez d''un délai de contestation
    de 13 mois pour signaler toute opération non autorisée. Une fois la notification
    reçue, le remboursement intervient généralement dès le premier jour ouvré suivant,
    selon les délais réglementaires.


    En cas de doute ou si vous pensez avoir été victime d''une fraude, la première
    action à mener est de nous demander de bloquer immédiatement votre carte pour
    empêcher tout nouveau débit. Nous traiterons ensuite votre demande de contestation
    avec la plus grande diligence.'
