- id: 5f772e75-2edb-5366-b7d1-19c9d65bd640
  title: Compte Kiosque 12-17 ans — éligibilité et souscription
  body: 'Vous souhaitez ouvrir un compte pour votre enfant ou pour vous-même ? Voici
    les informations essentielles.


    Qui peut ouvrir un Compte Kiosque 12-17 ans ?

    Ce compte est réservé aux jeunes âgés de 12 à 17 ans. L''ouverture doit être effectuée
    avec l''accord et la présence (ou les documents) d''un représentant légal.


    Comment se déroule la souscription ?

    La souscription se fait simplement dans nos points de vente partenaires (bureaux
    de tabac, marchands de journaux). L''ouverture est rapide et sans condition de
    revenus.


    Quels documents sont nécessaires ?

    Une pièce d''identité officielle pour le mineur et pour le représentant légal
    est obligatoire. Nous vous invitons à consulter la liste détaillée dans le document
    Compte Kiosque 12-17 ans — justificatifs à fournir.


    Quelles sont les conditions financières initiales ?

    Le compte prévoit une cotisation annuelle de 20 €.'
