  title: Carte Kiosque Voyage — grille tarifaire
  body: 'Voici l''ensemble des tarifs applicables à la Carte Kiosque Voyage. Nous
    appliquons une tarification forfaitaire et transparente.


    - **Cotisation annuelle** : 30 €

    - **Frais de paiement à l''étranger** : 0 %

    - **Frais de retrait d''espèces à l''étranger** : 2 € (par opération)


    Ces frais sont fixes et ne varient pas selon le montant de vos transactions. Les
    frais de retrait de 2 € reflètent les coûts opérationnels liés aux réseaux de
    distributeurs partenaires internationaux.'
