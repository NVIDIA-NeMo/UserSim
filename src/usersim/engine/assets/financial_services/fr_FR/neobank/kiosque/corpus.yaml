- id: 9d588ecd-292e-50bd-84d1-4c8794ac0d41
  title: Virement instantané Kiosque — protection contre la fraude et les opérations
    non autorisées
  body: "Chez Kiosque, nous attachons une importance primordiale à la sécurité de\
    \ vos fonds. Le Virement instantané Kiosque est conçu pour allier rapidité et\
    \ protection. Contrairement aux virements classiques, la rapidité d'exécution\
    \ nécessite une vigilance accrue car un transfert instantané est, par nature,\
    \ difficilement réversible une fois validé.\n\nPour limiter les risques de fraude,\
    \ nous avons intégré une vérification systématique du nom du bénéficiaire. Cela\
    \ permet de s'assurer que les fonds sont envoyés à la bonne personne avant que\
    \ l'opération ne soit définitivement traitée. Nous vous rappelons que l'authentification\
    \ forte est systématiquement appliquée pour sécuriser chaque transaction initiée\
    \ depuis vos canaux numériques.\n\nEn cas de fraude ou d'opération non autorisée,\
    \ nous appliquons une politique de protection rigoureuse. Vous disposez d'un délai\
    \ de contestation de 13 mois pour nous signaler toute opération suspecte. Si la\
    \ fraude est avérée, le remboursement intervient selon les délais réglementaires,\
    \ généralement dès le premier jour ouvré suivant la notification de votre part.\
    \ \n\nSachez que nous ne vous demanderons jamais votre code secret ou vos identifiants\
    \ de connexion par SMS ou par email. Si vous recevez une demande inhabituelle,\
    \ ne cliquez sur aucun lien et signalez-le nous immédiatement. La réactivité est\
    \ votre meilleure arme : plus vite une opération frauduleuse est signalée, plus\
    \ nous avons de chances de limiter l'impact.\n\nPour plus de détails sur la gestion\
    \ globale de vos fonds, nous vous invitons à consulter le document Compte Kiosque\
    \ — protection contre la fraude et les opérations non autorisées."
  domain: payments
  product_category: virement_instantane
  document_type: security_advisory
  source_authority: official
