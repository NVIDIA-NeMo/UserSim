  institution_id: kiosque
- id: e236f971-806e-5341-9bde-2bf903867945
  title: Carte Kiosque Voyage — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos fonds est notre priorité absolue. Pour utiliser votre
    Carte Kiosque Voyage en toute sérénité, nous vous recommandons d''appliquer les
    bonnes pratiques suivantes.


    L''authentification forte est systématiquement appliquée pour sécuriser vos paiements
    en ligne. Ne partagez jamais vos codes secrets ni vos identifiants de connexion.
    Nous vous rappelons que Kiosque ne vous demandera jamais votre mot de passe ou
    votre code PIN par SMS, e-mail ou téléphone.


    En voyage, soyez particulièrement vigilants lors de l''utilisation de distributeurs
    automatiques. Si vous constatez une activité suspecte ou si vous perdez votre
    carte, informez-nous immédiatement. Nous disposons d''une politique de protection
    rigoureuse : vous disposez d''un délai de contestation de 13 mois pour toute opération
    non autorisée. En cas de fraude avérée, le remboursement intervient généralement
    dès le premier jour ouvré suivant la notification, conformément aux délais réglementaires.


    Sachez également que toute modification d''information sensible sur votre compte
    nécessite obligatoirement la présentation d''une pièce d''identité officielle.
    Cette mesure nous permet de garantir que vous êtes le seul maître de vos opérations.


    Si vous avez un doute sur la légitimité d''une demande, nous vous invitons à consulter
    le document Carte Kiosque Voyage — reconnaître les arnaques visant ce produit
    pour mieux identifier les tentatives de phishing.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 682766a8-2f74-5d62-869d-e1c098a093ff
  title: Carte Kiosque Voyage — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales applicables à la Carte Kiosque Voyage. Nous nous engageons à maintenir
    une transparence totale sur les coûts et les plafonds de nos services.


    Nous nous réservons le droit de modifier les tarifs et conditions d''utilisation
    de la carte pour refléter l''évolution des coûts opérationnels ou pour nous conformer
    aux exigences de l''ACPR et de la Banque de France. Cela peut concerner, par exemple,
    la cotisation annuelle fixée actuellement à 30 €, les frais de retrait hors zone
    euro de 2 €, ou la gratuité des paiements à l''étranger (0 %).


    Toute modification tarifaire ou contractuelle fera l''objet d''une notification
    préalable envoyée via vos canaux de communication habituels. Sauf disposition
    légale contraire, un préavis minimum de deux mois vous sera accordé avant l''entrée
    en vigueur des nouveaux tarifs.


    Si vous n''acceptez pas ces nouvelles conditions, vous avez la possibilité de
    résilier votre contrat sans frais supplémentaires avant la date d''application
    des changements. La résiliation entraîne la clôture de la carte et le remboursement
    du prorata de la cotisation annuelle si celle-ci a été prélevée récemment.


    Pour toute question sur la procédure de changement de formule ou de clôture, nous
    vous invitons à consulter le guide Carte Kiosque Voyage — résilier, clôturer ou
    changer de formule.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 835eb008-7960-52e5-a98b-97472d98b432
  title: Carte Kiosque Voyage — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner les clients dans
    l''activation et la première utilisation de leur Carte Kiosque Voyage. L''objectif
    est de garantir une expérience fluide et pédagogique.


    Étape 1 : Vérification de l''identité

    Avant toute opération, assurez-vous que le client a fourni une pièce d''identité
    officielle valide. Cette étape est obligatoire pour sécuriser le compte et respecter
    les normes de conformité.


    Étape 2 : Confirmation de la souscription

    Validez avec le client son choix de la Carte Kiosque Voyage. Rappelez-lui que
    ce produit est optimisé pour les voyageurs avec des frais de paiement à l''étranger
    à 0 %.


    Étape 3 : Information tarifaire

    Confirmez explicitement au client que la cotisation annuelle est de 30 €. Assurez-vous
    que le client a bien compris que ce montant est nécessaire pour assurer la viabilité
    du service et l''accès aux avantages voyage.


    Étape 4 : Explication des retraits

    Expliquez clairement que si les paiements sont gratuits à l''étranger, chaque
    retrait d''espèces effectué hors zone euro entraîne des frais fixes de 2 €.


    Étape 5 : Activation de la carte

    Guidez le client dans la définition de son code secret et l''activation de la
    carte. Confirmez que l''authentification forte est activée pour ses futurs achats
    en ligne.


    En cas de doute sur les conditions d''accès, vous pouvez vous référer à la matrice
    Carte Kiosque Voyage — niveaux d''accès.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: a6dac088-7a92-53fc-bab6-bc29295359b0
  title: 'Carte Kiosque Voyage — frais de retrait hors zone euro : explications'
  body: 'Question : Pourquoi suis-je facturé lors d''un retrait d''espèces à l''étranger
    alors que les paiements sont gratuits ?

    Réponse : La Carte Kiosque Voyage supprime totalement les frais de paiement (0
    %) pour vous permettre de régler vos achats sans surcoût. Cependant, les retraits
    d''espèces dans les distributeurs hors zone euro impliquent des coûts opérationnels
    fixes. C''est pourquoi nous appliquons un frais forfaitaire de 2 € par retrait.


    Question : Ce frais de 2 € s''applique-t-il également aux retraits effectués dans
    la zone euro ?

    Réponse : Non, ce frais spécifique concerne uniquement les retraits effectués
    hors zone euro. Pour plus de détails sur la structure globale de nos coûts, nous
    vous invitons à consulter la Carte Kiosque Voyage — grille tarifaire.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 1050858a-a5c2-5967-9198-4aff1a259bfa
  title: Carte Kiosque Voyage — effectuer une modification
  body: 'Vous souhaitez modifier vos informations personnelles ou les paramètres de
    votre Carte Kiosque Voyage ? Voici la marche à suivre pour effectuer vos changements
    en toute sécurité.


    Ce que vous devez préparer :

    Pour toute modification, vous devez impérativement disposer d''une pièce d''identité
    officielle en cours de validité (passeport, carte nationale d''identité).


    Les étapes de modification :

    1. Formulez votre demande : Indiquez-nous précisément l''information que vous
    souhaitez modifier (adresse postale, numéro de téléphone, etc.).

    2. Vérification d''identité : Transmettez-nous la copie de votre pièce d''identité
    officielle. Nous procédons à la vérification pour nous assurer que la demande
    provient bien du titulaire du compte.

    3. Validation des changements : Nous traitons votre demande et mettons à jour
    vos informations dans notre système.

    4. Confirmation : Vous recevrez une notification confirmant que la modification
    a bien été prise en compte.


    Comment savoir si cela a fonctionné ?

    Une fois la modification validée, vous pourrez constater le changement directement
    dans vos informations de profil. Si vous avez modifié une option liée à votre
    carte, vous recevrez un e-mail de confirmation.


    Si vous souhaitez modifier votre type de carte ou résilier votre abonnement, veuillez
    suivre la procédure décrite dans le document Carte Kiosque Voyage — résilier,
    clôturer ou changer de formule.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 05ca1a48-0f57-5759-9bba-4c004178cf67
  title: Carte Kiosque Voyage — problèmes d'accès ou de connexion
  body: 'Vous rencontrez des difficultés pour accéder à vos services ou pour utiliser
    votre carte ? Voici les étapes pour résoudre les problèmes les plus fréquents.


    Symptôme : « Je n''arrive pas à me connecter à mon espace client ou mon application
    »

    Causes possibles :

    - Identifiants incorrects ou mot de passe expiré.

    - Problème de connexion réseau ou maintenance temporaire.

    - Échec de l''authentification forte.


    Actions à entreprendre :

    1. Vérifiez votre connexion internet et assurez-vous que vos identifiants sont
    saisis sans erreur.

    2. Si le problème persiste, demandez-nous la réinitialisation de votre mot de
    passe. Nous vous guiderons pour en créer un nouveau sécurisé.

    3. Si l''authentification forte échoue, vérifiez que votre téléphone est bien
    synchronisé avec vos services de sécurité.


    Symptôme : « Ma carte est refusée lors d''un paiement à l''étranger »

    Causes possibles :

    - Solde insuffisant (rappel : notre carte est à autorisation systématique et interdit
    tout découvert).

    - Plafond de paiement atteint.

    - Carte bloquée pour motif de sécurité.


    Actions à entreprendre :

    1. Vérifiez votre solde en temps réel. Si le montant est insuffisant, alimentez
    votre compte.

    2. Demandez-nous de vérifier si vos plafonds de paiement sont atteints ou si la
    carte a été bloquée par notre système de prévention de la fraude.


    Quand escalader le problème ?

    Si aucune de ces étapes ne résout le problème, nous ouvrirons un dossier d''incident
    auprès de notre support centralisé. Vous serez informé par notification dès que
    la résolution technique sera effective. Pour d''autres types d''échecs de transaction,
    consultez Carte Kiosque Voyage — opération échouée ou en attente.'
  domain: cards
  product_category: carte_kiosque_voyage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 19591a11-97a9-51ef-9a43-cda8ec91a511
