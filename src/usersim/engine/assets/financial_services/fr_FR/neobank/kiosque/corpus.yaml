- id: 18305ea6-c282-5ec0-b107-8ca927ce694d
  title: Virement instantané Kiosque — comparaison avec les alternatives et quand
    ne pas le choisir
  body: 'Le Virement instantané Kiosque s''inscrit dans notre volonté d''offrir un
    accès bancaire universel et rapide. Pour vous aider à choisir le mode de transfert
    le plus approprié, nous comparons ce service aux autres alternatives.


    Points forts du Virement instantané Kiosque :

    - Rapidité absolue : Les fonds sont disponibles pour le bénéficiaire en quelques
    secondes.

    - Coût nul : Nous appliquons des frais de 0 € par transaction, contrairement à
    certaines banques traditionnelles qui facturent le service d''instantanéité.

    - Accessibilité : Disponible pour tous nos clients, sans condition de revenus.


    Comparatif avec les autres modes de transfert :


    1. Face au virement SEPA classique :

    Le virement classique est gratuit et adapté aux gros montants, mais il est lent.
    Le Virement instantané Kiosque est préférable pour tout besoin immédiat, tant
    que la somme reste inférieure ou égale au plafond de 3 000 € par jour.


    2. Face au dépôt d''espèces en point de vente :

    Le dépôt d''espèces permet d''alimenter son compte via nos partenaires (bureaux
    de tabac, marchands de journaux), mais engendre des frais de 2 % pour couvrir
    les coûts opérationnels. Le virement instantané, lui, sert à sortir des fonds
    du compte vers un tiers sans frais supplémentaires (0 €).


    Quand ne pas choisir le Virement instantané Kiosque ?

    - Pour les transferts de fonds très élevés : Si vous devez envoyer 5 000 €, le
    plafond quotidien de 3 000 € rendra l''opération impossible en une seule fois.

    - En cas de doute sur le bénéficiaire : La rapidité du transfert rend toute erreur
    irréversible. Si vous n''êtes pas certain de l''identité du destinataire, un mode
    de paiement plus flexible ou un virement classique est préférable pour permettre
    un éventuel rappel des fonds avant exécution.


    Nous vous recommandons d''utiliser ce service pour tous vos besoins de transfert
    rapide et sécurisé jusqu''à 3 000 €.'
  domain: payments
  product_category: virement_instantane
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: db4dd310-10b9-55ca-8163-2dc165f3c97a
  title: Virement instantané Kiosque — mode d'emploi pas à pas
  body: 'Vous souhaitez utiliser le Virement instantané Kiosque ? Voici comment procéder
    simplement.


    Comment envoyer de l''argent instantanément ?

    C''est très simple : sélectionnez l''option de transfert dans votre espace client,
    saisissez l''IBAN du bénéficiaire, indiquez le montant (en respectant le plafond
    de 3 000 € par jour) et validez l''opération via votre authentification forte.
    Les fonds partent immédiatement pour un coût de 0 €.


    Est-ce que le bénéficiaire doit aussi avoir un compte Kiosque ?

    Non, le Virement instantané Kiosque fonctionne avec tout compte bancaire compatible
    avec les normes de virement instantané, quelle que soit la banque du destinataire.


    Comment suis-je informé de la réussite du transfert ?

    Vous recevez une notification immédiate dès que le virement est exécuté, et le
    débit apparaît instantanément dans votre historique de transactions.


    Que se passe-t-il si je me trompe de montant ?

    Comme le transfert est immédiat, nous ne pouvons pas l''annuler. Vous devrez contacter
    le bénéficiaire pour lui demander un retour des fonds.'
  domain: payments
  product_category: virement_instantane
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 48666fb7-608d-585c-80f3-f9c8ba8dd0e3
  title: Virement instantané Kiosque — traiter une demande courante de bout en bout
  body: 'L''objectif du Virement instantané Kiosque est de simplifier vos échanges
    d''argent. Voici la procédure complète pour effectuer un transfert, de la création
    du bénéficiaire à la confirmation finale.


    Ce que vous devez avoir avant de commencer :

    - Le RIB ou l''IBAN complet du destinataire.

    - Le nom exact du bénéficiaire.

    - Un solde suffisant sur votre compte pour couvrir le montant et l''éventuelle
    taxe si applicable (bien que le service soit à 0 €).


    Étapes de réalisation :

    1. Ajoutez le bénéficiaire : Saisissez l''IBAN et le nom du destinataire. Nous
    procédons alors à la vérification du nom pour nous assurer que les coordonnées
    sont correctes.

    2. Définissez le montant : Indiquez la somme que vous souhaitez envoyer. Assurez-vous
    que ce montant ne dépasse pas votre plafond quotidien de 3 000 €.

    3. Choisissez le mode de transfert : Sélectionnez « Virement instantané ». Vous
    constaterez que les frais affichés sont de 0 €.

    4. Validez l''opération : Confirmez le transfert via l''authentification forte
    (code secret ou biométrie). Cette étape est obligatoire pour sécuriser vos fonds.

    5. Vérifiez la confirmation : Un message de succès s''affiche à l''écran et vous
    recevez une notification. Le montant est débité de votre compte en temps réel.


    Comment savoir si tout a fonctionné ?

    Le transfert est réussi lorsque le statut de l''opération passe à « Exécuté »
    dans votre historique. Le bénéficiaire reçoit les fonds en quelques secondes seulement.
    Si l''opération avait échoué (plafond atteint ou solde insuffisant), vous auriez
    reçu un message d''erreur immédiat et aucun fonds n''aurait été débité.


    En cas de difficulté lors de l''une de ces étapes, nous restons disponibles pour
    vous accompagner via nos canaux numériques.'
  domain: payments
  product_category: virement_instantane
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 4a35245e-0a58-5e2c-9271-16be1efdc0b0
  title: Virement instantané Kiosque — écart avec vos relevés
  body: 'Il peut arriver qu''un client constate un écart entre le solde affiché et
    les opérations de Virement instantané Kiosque listées sur ses relevés. Voici comment
    analyser et résoudre cette situation.


    Symptôme : Le solde actuel du compte ne semble pas correspondre à la somme des
    transactions enregistrées, ou un virement instantané n''apparaît pas encore sur
    le relevé mensuel.


    Causes possibles et vérifications :

    1. Décalage d''affichage : Bien que le virement soit instantané et le solde mis
    à jour en temps réel, certains relevés périodiques sont générés à date fixe. Vérifiez
    si l''opération a eu lieu après la date de clôture du dernier relevé.

    2. Opérations en attente : Vérifiez si d''autres opérations (comme des paiements
    par carte) sont en cours de traitement. Ces opérations peuvent « réserver » des
    fonds, créant un écart entre le solde réel et le solde disponible, même si vos
    virements instantanés sont correctement enregistrés.

    3. Erreur de saisie du montant : Reprenez le détail du virement dans l''historique.
    Vérifiez que le montant envoyé correspond exactement à celui que vous aviez prévu.
    Un virement de 0 € de frais ne doit pas modifier le montant principal.

    4. Double débit accidentel : Vérifiez si deux opérations identiques ont été effectuées.
    Si c''est le cas, cela peut être dû à une tentative répétée après un timeout apparent
    de l''application.


    Comment résoudre le problème :

    - Pour un problème de date de relevé : Comparez le relevé avec l''historique détaillé
    en temps réel de l''application.

    - Pour un doute sur un montant : Nous vous invitons à nous fournir la capture
    d''écran de l''opération concernée.


    Quand nous solliciter :

    Si l''écart persiste malgré ces vérifications, nous allons effectuer un rapprochement
    bancaire complet. Nous analyserons chaque transaction liée à votre identité vérifiée
    pour identifier l''anomalie. Nous vous confirmerons le montant exact et rectifierons
    l''affichage ou le solde si une erreur technique est détectée, généralement sous
    48 heures ouvrées.'
  domain: payments
  product_category: virement_instantane
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 50bab679-104b-5177-ae53-915ebceb3c30
  title: Frais et tarifs de l'établissement
  body: 'Chez Kiosque, nous croyons en une transparence totale pour permettre à chacun
    de gérer son budget sereinement. Nous adoptons une tarification forfaitaire et
    claire, conçue pour garantir la viabilité de nos services tout en restant accessible
    au plus grand nombre.


    Certains frais s''appliquent à l''ensemble de nos services, indépendamment du
    produit choisi. À titre d''exemple, nous appliquons des frais de 2 % sur les dépôts
    d''espèces effectués dans nos points de vente partenaires. Ce montant reflète
    précisément les coûts opérationnels engagés par nos partenaires (bureaux de tabac,
    marchands de journaux) pour traiter vos fonds.


    En dehors de ces frais de service généraux, les tarifs spécifiques (cotisations
    annuelles, plafonds ou frais de retrait) varient selon le produit détenu. Nous
    vous invitons à consulter la grille tarifaire détaillée de votre offre pour connaître
    l''intégralité des coûts applicables à votre situation.


    Pour plus de détails sur les frais liés à notre offre principale, vous pouvez
    consulter le document Compte Kiosque — grille tarifaire.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: f8e4ca7c-39a8-5646-9ca5-1ed263273869
  title: Questions fréquentes
  body: 'Nous avons regroupé ici les réponses aux questions les plus courantes concernant
    l''utilisation globale des services Kiosque.


    **Comment puis-je ouvrir un compte chez Kiosque ?**

    L''ouverture est simplifiée et inclusive. Vous pouvez ouvrir votre compte en seulement
    5 minutes dans l''un de nos points de vente agréés, sans aucune condition de revenus
    ni de patrimoine.


    **Comment contacter l''assistance ?**

    Nous vous accompagnons via nos canaux numériques ou directement dans nos points
    de vente partenaires (bureaux de tabac, marchands de journaux). Nos services sont
    disponibles selon les horaires français.


    **Que se passe-t-il si ma demande est complexe ?**

    Si vos besoins nécessitent une expertise approfondie, nous escaladons systématiquement
    votre demande vers le support centralisé de Kiosque pour garantir une résolution
    précise.


    **Où trouver la procédure d''activation ?**

    Pour vous accompagner dans vos premiers pas, nous vous recommandons de consulter
    le guide Compte Kiosque — souscrire et activer.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 0eb0b98c-2452-5fbd-9f98-633a33312487
  title: 'Notes réglementaires : banque au quotidien'
  body: 'Kiosque opère dans un cadre réglementaire strict afin de garantir la sécurité
    et la légalité de toutes les opérations bancaires. L''institution est placée sous
    la supervision directe de l''ACPR (Autorité de contrôle prudentiel et de résolution)
    et de la Banque de France, et respecte scrupuleusement les dispositions du Code
    monétaire et financier.


    La protection des fonds de nos clients est une priorité absolue. Selon la nature
    des services fournis, deux mécanismes de protection s''appliquent :


    1. Pour la banque de détail, la protection est assurée par le Fonds de Garantie
    des Dépôts et de Résolution (FGDR), conformément aux normes européennes.

    2. Pour les services de paiement, nous appliquons le principe du cantonnement.
    Cela signifie que les fonds des clients sont déposés auprès d''un établissement
    de crédit partenaire et sont strictement distincts des fonds propres de l''entreprise
    Kiosque. En cas de difficulté financière de Kiosque, vos fonds restent protégés
    et disponibles car ils ne font pas partie de l''actif de la société.


    L''agent a l''obligation d''informer le client sur ces garanties dès que celui-ci
    s''interroge sur la sécurité de ses dépôts. Il est impératif de ne pas suggérer
    que Kiosque est une banque traditionnelle si elle agit en tant que prestataire
    de services de paiement via le cantonnement. L''agent doit utiliser les termes
    exacts du glossaire pour expliquer le cantonnement : protection des fonds par
    dépôt auprès d''un établissement partenaire, distincts des fonds de l''entreprise.


    Enfin, nous rappelons que toute personne domiciliée en France peut bénéficier
    du Droit au compte, une procédure légale permettant d''obtenir l''ouverture d''un
    compte de dépôt même après un refus initial. L''agent doit orienter le client
    vers la procédure officielle de la Banque de France si ce droit doit être exercé.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 8058a752-ebd9-5523-ac96-d977c2696666
  title: 'Notes réglementaires : cartes bancaires'
  body: 'L''émission et l''utilisation des cartes bancaires chez Kiosque sont régies
    par des normes de sécurité et de conformité strictes, visant à protéger les utilisateurs
    contre la fraude et les erreurs de paiement.


    **Vérification de l''identité**

    La sécurité commence par l''authentification. La vérification de l''identité via
    une pièce officielle en cours de validité est obligatoire avant toute modification
    d''information sur le compte ou toute opération sensible liée à la carte. L''agent
    ne doit jamais procéder à un changement de plafond ou à une commande de remplacement
    sans s''être assuré de l''identité du titulaire.


    **Authentification Forte (SCA)**

    Pour sécuriser les paiements en ligne, l''authentification forte est systématiquement
    appliquée. Ce mécanisme, conformément à la DSP2, exige que le client valide sa
    transaction via un procédé sécurisé (biométrie, code secret ou notification applicative)
    pour réduire drastiquement le risque d''utilisation frauduleuse de la carte.


    **Gestion des soldes et Autorisation Systématique**

    Certaines de nos cartes sont des cartes à autorisation systématique. Cela signifie
    que le solde du compte est vérifié en temps réel avant chaque transaction. Si
    le solde est insuffisant, la transaction est immédiatement refusée, interdisant
    ainsi tout découvert. L''agent doit être capable d''expliquer pédagogiquement
    ce fonctionnement pour éviter que le client ne perçoive un refus de paiement comme
    un dysfonctionnement technique.


    L''agent doit veiller à ne jamais promettre de dépassement de plafond ou de solde
    sur ces cartes, car la nature technique de l''autorisation systématique rend toute
    exception impossible. En cas de doute sur le type de carte détenu par le client,
    l''agent doit vérifier les caractéristiques du produit dans le système avant de
    répondre.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 7fc48f1d-887d-5261-965f-d7ae8ed4ff5f
  title: 'Notes réglementaires : paiements'
  body: 'Kiosque s''engage à traiter toutes les opérations de paiement avec rigueur,
    conformément aux directives européennes et au Code monétaire et financier. Cette
    rigueur s''applique particulièrement à la gestion des opérations non autorisées
    et aux contestations de transactions.


    **Délai de contestation**

    Nous appliquons une politique de protection rigoureuse pour nos clients. En cas
    d''opération non autorisée, le client dispose d''un délai de 13 mois pour contester
    l''opération à compter de la date de débit. L''agent doit informer le client de
    ce délai s''il signale une transaction suspecte datant de plusieurs mois.


    **Procédure de remboursement**

    Lorsqu''une opération est contestée et reconnue comme non autorisée, le remboursement
    intervient selon les délais réglementaires. En règle générale, le remboursement
    est effectué dès le premier jour ouvré suivant la notification de la fraude ou
    de l''erreur par le client. Ce délai rapide vise à minimiser l''impact financier
    pour l''utilisateur.


    **Obligations de l''agent**

    L''agent doit collecter toutes les informations nécessaires (date, montant, référence
    de la transaction) pour permettre l''ouverture d''un dossier de dispute. Il ne
    doit jamais garantir un remboursement automatique avant l''analyse du dossier,
    mais doit confirmer que le traitement respectera les délais réglementaires mentionnés
    ci-dessus.


    **Limites de conseil**

    L''agent doit rester dans un cadre informatif et descriptif. Kiosque fournit des
    informations éducatives sur ses produits de paiement, mais ne délivre aucun conseil
    fiscal ou juridique individualisé. Si un client demande comment optimiser ses
    flux de paiements pour réduire ses impôts ou pour structurer juridiquement son
    patrimoine, l''agent doit décliner la demande et suggérer la consultation d''un
    professionnel qualifié.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 68e956cc-f05b-5bc5-b9d0-4e81b23caafd
  title: Quand utiliser get_account_transactions
  body: 'L''outil get_account_transactions est le mécanisme faisant autorité pour
    consulter l''historique financier d''un client. Il doit être utilisé dès que le
    client souhaite vérifier un solde, identifier une opération spécifique, ou signaler
    un écart dans ses comptes.


    **Critères d''utilisation**

    Cet outil est utilisé dans les scénarios suivants :

    - Le client demande la liste de ses derniers paiements.

    - Le client souhaite confirmer la réception d''un virement.

    - Le client conteste un montant débité et a besoin d''identifier la transaction
    exacte.

    - Le client demande un relevé détaillé pour une période donnée.


    **Procédure d''exécution**

    L''agent doit suivre strictement les étapes suivantes pour garantir la sécurité
    des données :


    1. **Vérification de l''identité** : L''agent doit impérativement utiliser l''outil
    verify_identity pour s''assurer que l''interlocuteur est bien le titulaire du
    compte.

    2. **Résolution de l''identifiant du compte** : Le client fournit généralement
    les quatre derniers chiffres de son compte. L''agent doit appeler get_accounts
    pour obtenir l''account_id complet correspondant à l''utilisateur vérifié.

    3. **Extraction des transactions** : Une fois l''account_id obtenu, l''agent appelle
    get_account_transactions en précisant l''identifiant du compte pour récupérer
    la liste des opérations.

    4. **Communication** : L''agent présente les informations au client de manière
    claire et pédagogique, sans utiliser de termes techniques internes.


    L''agent ne doit jamais demander au client son account_id complet, celui-ci devant
    être résolu via get_accounts après vérification d''identité.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: kiosque
- id: cd343d05-9fb2-518f-bb05-2f54fac70090
  title: Référence de l'outil get_account_transactions
  body: 'L''outil get_account_transactions permet à l''agent de récupérer la liste
    chronologique des transactions effectuées sur un compte spécifique.


    **Signature et arguments**

    L''outil prend un seul argument obligatoire :

    - `account_id` : L''identifiant unique du compte (obtenu préalablement via l''outil
    get_accounts).


    **Effet de l''outil**

    L''appel à cet outil retourne l''historique des mouvements financiers du compte,
    incluant la date, le libellé de l''opération, le montant et le sens du flux (débit
    ou crédit).


    **Utilisation**

    L''agent effectue cette action en appelant l''outil directement dans la conversation.
    Il ne doit jamais demander au client de consulter son application ou son espace
    personnel pour obtenir ces informations ; l''agent est le point d''accès direct
    aux données du compte après vérification de l''identité.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: kiosque
- id: dd3b8424-0923-51fd-8bec-f28ee2bf3584
  title: Quand utiliser file_transaction_dispute
  body: 'L''outil file_transaction_dispute est utilisé pour initier une procédure
    de contestation lorsqu''un client signale une opération non autorisée ou erronée
    sur son compte.


    **Critères d''utilisation**

    Cet outil doit être mobilisé dans les cas suivants :

    - Le client signale un paiement qu''il n''a pas effectué (fraude).

    - Le client constate un double débit pour un même achat.

    - Le client signale un montant prélevé différent du montant convenu avec le marchand.


    **Procédure d''exécution**

    L''agent doit suivre rigoureusement cet enchaînement :


    1. **Vérification de l''identité** : Appeler verify_identity pour confirmer l''identité
    du titulaire.

    2. **Identification du compte** : Appeler get_accounts pour résoudre l''account_id
    à partir des informations du client.

    3. **Identification de la transaction** : Appeler get_account_transactions pour
    lister les opérations récentes. L''agent doit aider le client à identifier précisément
    la transaction concernée afin d''obtenir le transaction_id unique.

    4. **Lancement de la dispute** : L''agent appelle l''outil file_transaction_dispute
    en fournissant l''account_id, le transaction_id et le motif détaillé de la contestation.

    5. **Information sur les délais** : L''agent doit informer le client que le délai
    de contestation est de 13 mois et que le remboursement, s''il est validé, intervient
    généralement dès le premier jour ouvré suivant la notification.


    L''agent ne doit jamais promettre un remboursement immédiat, mais doit confirmer
    que la demande est enregistrée et sera traitée selon les délais réglementaires.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: kiosque
- id: bb00ec4e-c70c-536a-a753-75b61c610ca2
  title: Référence de l'outil file_transaction_dispute
  body: 'L''outil file_transaction_dispute permet d''enregistrer officiellement une
    contestation sur une opération spécifique pour déclencher l''analyse du support
    centralisé.


    **Signature et arguments**

    L''outil nécessite les arguments suivants :

    - `account_id` : L''identifiant unique du compte concerné (obtenu via get_accounts).

    - `transaction_id` : L''identifiant unique de la transaction contestée (obtenu
    via get_account_transactions).

    - `reason` : Une description textuelle précise du motif de la contestation (fournie
    par le client).


    **Effet de l''outil**

    L''appel à cet outil crée un ticket de dispute lié à la transaction. Cela gèle
    le processus de règlement pour cette opération et lance la procédure de remboursement
    réglementaire si la fraude est confirmée.


    **Utilisation**

    L''agent exécute l''action en appelant l''outil directement. Il ne doit pas rediriger
    le client vers un formulaire en ligne ou un e-mail, car l''outil est le canal
    officiel d''enregistrement de la demande.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: kiosque
- id: 60fb8f53-81ff-599a-87c5-a05b41c304de
  title: Quand utiliser freeze_card
  body: 'L''outil freeze_card est la mesure d''urgence permettant de bloquer instantanément
    toutes les transactions sur une carte bancaire. Il est utilisé pour prévenir toute
    utilisation frauduleuse suite à une perte, un vol ou un doute sur la sécurité
    de la carte.


    **Critères d''utilisation**

    L''agent doit utiliser cet outil dans les situations suivantes :

    - Le client déclare avoir perdu sa carte.

    - Le client signale le vol de son portefeuille.

    - Le client a constaté une opération suspecte et souhaite sécuriser son compte
    en attendant l''analyse des transactions.


    **Procédure d''exécution**

    L''agent doit agir avec rapidité tout en respectant la sécurité :


    1. **Vérification de l''identité** : Appeler verify_identity. C''est une étape
    critique pour éviter qu''un tiers ne bloque la carte d''un autre utilisateur.

    2. **Identification du compte** : Appeler get_accounts pour obtenir l''account_id
    lié au client.

    3. **Blocage de la carte** : Appeler l''outil freeze_card en utilisant l''account_id.
    Cette action rend la carte inutilisable pour tout nouveau paiement ou retrait.

    4. **Accompagnement** : Une fois la carte gelée, l''agent doit demander au client
    s''il souhaite commander une nouvelle carte de remplacement.


    L''agent doit préciser que le gel de la carte est immédiat. Si le client a simplement
    égaré sa carte et pense la retrouver, l''agent peut l''informer que l''action
    est réversible (si l''outil de déblocage est disponible) ou qu''une nouvelle carte
    devra être émise.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: kiosque
- id: 665ae9f3-e91d-5626-ad8b-ea90f1ce8aab
  title: Référence de l'outil freeze_card
  body: 'L''agent utilise l''outil `freeze_card` pour bloquer instantanément l''utilisation
    d''une carte bancaire, que ce soit en cas de perte, de vol ou de suspicion de
    fraude.


    **Signature et arguments :**

    - `account_id` : L''identifiant unique du compte associé à la carte.

    - `card_id` : L''identifiant unique de la carte à geler.


    L''agent effectue cette action en appelant l''outil directement dans le flux de
    la conversation après avoir vérifié l''identité du client. Le gel est immédiat
    et empêche toute nouvelle transaction sortante.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: kiosque
- id: 92dd1a51-2f16-591f-bbf6-977f158d1691
  title: Quand utiliser send_instant_transfer
  body: 'Le Virement instantané Kiosque permet le transfert de fonds immédiat et gratuit.
    Cette procédure doit être appliquée lorsque le client souhaite envoyer des fonds
    sans délai d''attente vers un autre compte SEPA.


    **Procédure d''exécution :**


    1. **Vérification de l''identité** : L''agent doit impérativement vérifier l''identité
    du client via une pièce officielle avant toute opération.

    2. **Identification du compte** : Utiliser l''outil `get_accounts` pour résoudre
    l'' `account_id` du client à partir des quatre derniers chiffres de son compte.

    3. **Collecte des informations du bénéficiaire** : Demander au client le nom complet
    du bénéficiaire et son IBAN.

    4. **Vérification de la concordance** : L''agent s''assure que le nom fourni correspond
    à l''IBAN du bénéficiaire pour sécuriser la transaction.

    5. **Vérification du solde** : Confirmer que le solde disponible sur le compte
    est suffisant pour couvrir le montant du virement.

    6. **Exécution** : Appeler l''outil `send_instant_transfer` avec les détails collectés.


    Nous rappelons que ce service est gratuit et conçu pour la rapidité d''exécution,
    conformément à notre positionnement d''accessibilité universelle.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_instant_transfer
  institution_id: kiosque
- id: 1c5da2de-c6c9-503c-9ef8-c9c382dfb2ca
  title: Référence de l'outil send_instant_transfer
  body: 'L''agent utilise l''outil `send_instant_transfer` pour déclencher un transfert
    de fonds immédiat et gratuit vers un bénéficiaire.


    **Signature et arguments :**

    - `account_id` : L''identifiant du compte à débiter.

    - `iban_beneficiary` : L''IBAN du compte destinataire.

    - `amount` : Le montant du transfert, exprimé en €.

    - `name_beneficiary` : Le nom complet du bénéficiaire, utilisé pour la vérification
    de concordance.


    L''agent effectue cette opération en appelant l''outil directement. Le virement
    est traité en temps réel dès la validation de la commande.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_instant_transfer
  institution_id: kiosque
- id: cefb1296-8247-5285-91fe-aff460ee5f9b
  title: Quand utiliser set_card_limits
  body: 'L''ajustement des plafonds de paiement et de retrait est une demande courante
    pour sécuriser le compte ou adapter la carte aux besoins du client (par exemple,
    lors d''un voyage).


    **Procédure d''exécution :**


    1. **Vérification de l''identité** : L''agent doit s''assurer de l''identité du
    client via une pièce officielle.

    2. **Identification du compte** : Utiliser l''outil `get_accounts` pour identifier
    l'' `account_id` associé au client.

    3. **Définition des nouveaux plafonds** : Recueillir auprès du client le montant
    exact souhaité pour le plafond de paiement et le plafond de retrait en €.

    4. **Contrôle de conformité** : L''agent vérifie que les plafonds demandés respectent
    les limites maximales autorisées par le type de produit détenu par le client.

    5. **Mise à jour** : Appeler l''outil `set_card_limits` pour appliquer les modifications.


    L''agent doit informer le client que ces modifications sont instantanées et impactent
    la capacité d''utilisation de la carte en temps réel.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: kiosque
- id: 3303e06a-705e-5613-ae74-233a8ed6dcc4
  title: Référence de l'outil set_card_limits
  body: 'L''agent utilise l''outil `set_card_limits` pour modifier les seuils de dépenses
    et de retrait d''une carte bancaire.


    **Signature et arguments :**

    - `card_id` : L''identifiant unique de la carte concernée.

    - `payment_limit` : Le nouveau plafond de paiement autorisé, exprimé en €.

    - `withdrawal_limit` : Le nouveau plafond de retrait autorisé, exprimé en €.


    L''agent effectue cette action en appelant l''outil directement. Les modifications
    sont appliquées immédiatement sur le réseau de paiement.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: kiosque
- id: 645edb56-2e33-5063-8398-69955a900b9a
  title: Quand utiliser update_beneficiary
  body: 'La gestion des bénéficiaires est essentielle pour permettre des virements
    sécurisés. Cette procédure s''applique pour l''ajout d''un nouveau bénéficiaire
    ou la modification des coordonnées d''un bénéficiaire existant.


    **Procédure d''exécution :**


    1. **Vérification de l''identité** : Obligation de vérifier l''identité du client
    avec une pièce officielle avant toute modification d''information.

    2. **Identification du compte** : L''agent utilise `get_accounts` pour obtenir
    l'' `account_id` correspondant au client.

    3. **Collecte des coordonnées** : Demander le nom complet exact et l''IBAN du
    bénéficiaire.

    4. **Mise à jour** : Appeler l''outil `update_beneficiary` pour enregistrer les
    informations.


    Nous veillons à ce que le client soit informé que l''exactitude du nom et de l''IBAN
    est cruciale pour éviter tout rejet de virement ou erreur d''aiguillage des fonds.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kiosque
- id: 5d635bc1-f7a2-5ca1-a233-ce272304551f
  title: Référence de l'outil update_beneficiary
  body: 'L''agent utilise l''outil `update_beneficiary` pour ajouter, modifier ou
    supprimer un bénéficiaire de virement enregistré sur le compte d''un client.


    **Signature et arguments :**

    - `account_id` : L''identifiant du compte bancaire du client.

    - `beneficiary_name` : Le nom complet du bénéficiaire.

    - `iban` : L''IBAN du bénéficiaire.


    L''agent effectue l''action en appelant l''outil directement. Si le bénéficiaire
    existe déjà, ses informations sont mises à jour ; sinon, un nouveau bénéficiaire
    est créé.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kiosque
- id: ab7bbfdd-f51f-5316-ab31-0f0f40f987c8
  title: Quand utiliser stop_payment
  body: 'Cette procédure est utilisée lorsqu''un client souhaite faire opposition
    à un prélèvement SEPA à venir ou révoquer définitivement un mandat de prélèvement.


    **Procédure d''exécution :**


    1. **Vérification de l''identité** : L''agent doit vérifier l''identité du client
    via une pièce officielle.

    2. **Identification du compte** : Utiliser l''outil `get_accounts` pour obtenir
    l'' `account_id`.

    3. **Identification du prélèvement** : Demander au client le nom du créancier
    ou, si disponible, l''identifiant du mandat de prélèvement.

    4. **Action d''opposition** : Appeler l''outil `stop_payment` pour bloquer le
    prélèvement ou révoquer le mandat.


    L''agent doit explicitement préciser au client que Kiosque n''émet pas de chèques
    et que cette procédure ne concerne que les prélèvements SEPA. Le client est informé
    que la révocation d''un mandat ne décharge pas l''utilisateur de sa dette envers
    le créancier.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: kiosque
- id: eb925c3a-14bf-5d66-a939-2cc27675f860
  title: Référence de l'outil stop_payment
  body: 'L''agent utilise l''outil `stop_payment` pour interrompre un prélèvement
    SEPA programmé ou pour annuler un mandat de prélèvement.


    **Signature et arguments :**

    - `account_id` : L''identifiant du compte concerné.

    - `mandate_id` : L''identifiant du mandat de prélèvement (ou le nom du créancier
    si l''identifiant est inconnu).


    L''agent effectue l''action en appelant l''outil directement. Cette opération
    empêche le créancier de débiter le compte pour les échéances futures liées à ce
    mandat.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: kiosque
- id: 160961ef-b247-534b-aa46-3d77491b335c
  title: Quand utiliser manage_authorized_users
  body: 'Cette procédure concerne spécifiquement la gestion du Compte Kiosque 12-17
    ans. Elle permet au représentant légal de gérer l''accès et la surveillance du
    compte du mineur.


    **Procédure d''exécution :**


    1. **Vérification de l''identité** : L''agent doit vérifier l''identité du représentant
    légal via une pièce officielle.

    2. **Identification du compte** : Utiliser `get_accounts` pour obtenir l'' `account_id`
    du compte adolescent.

    3. **Vérification du lien légal** : L''agent s''assure que la personne demandant
    la modification est bien le représentant légal enregistré pour ce mineur.

    4. **Gestion des accès** : Appeler l''outil `manage_authorized_users` pour modifier
    les droits d''accès ou les autorisations.


    Nous rappelons que le Compte Kiosque 12-17 ans est soumis à un plafond hebdomadaire
    de 150 €, et que le représentant légal peut intervenir pour sécuriser l''initiation
    financière du jeune.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kiosque
- id: a2a31db1-08ed-588d-b548-8ed9178eeb14
  title: Référence de l'outil manage_authorized_users
  body: 'L''outil manage_authorized_users permet à l''agent de modifier les accès
    et les droits de représentation légale pour les comptes de mineurs. Cette fonctionnalité
    est spécifiquement dédiée à la gestion du Compte Kiosque 12-17 ans, afin de garantir
    que le représentant légal puisse accompagner l''initiation financière du jeune
    utilisateur tout en respectant le cadre sécuritaire de l''institution.


    L''agent effectue cette action en appelant l''outil directement avec les paramètres
    suivants :

    - account_id : L''identifiant unique du compte du mineur (obtenu préalablement
    via l''outil get_accounts).

    - representative_full_name : Le nom complet du représentant légal à ajouter ou
    à modifier.

    - representative_relation : Le lien de parenté ou la qualité juridique du représentant
    (ex: père, mère, tuteur légal).

    - access_level : Le niveau d''autorisation accordé (consultation seule ou gestion
    complète).


    L''effet de l''outil est la mise à jour immédiate des droits d''accès sur le compte,
    permettant au représentant légal de superviser les opérations et de respecter
    le plafond hebdomadaire de 150 € applicable à ce produit.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kiosque
- id: 663983ed-858b-5b62-bd8b-7e806d26befd
  title: Quand utiliser get_accounts
  body: 'Nous utilisons l''outil get_accounts chaque fois que nous devons identifier
    avec précision les comptes détenus par un client au sein de notre institution.
    C''est l''étape fondamentale pour transformer une information partielle fournie
    par le client (comme les derniers chiffres d''un compte) en un identifiant technique
    exploitable pour toute autre opération bancaire.


    Cet outil est indispensable dans les situations suivantes :

    - Lorsqu''un client demande le solde ou les détails d''un de ses comptes.

    - Pour résoudre un account_id à partir des quatre derniers chiffres fournis par
    l''utilisateur.

    - Pour vérifier si un client possède plusieurs produits (par exemple, un Compte
    Kiosque et un Compte Kiosque 12-17 ans).

    - Avant d''exécuter toute opération de transfert, de clôture ou de modification
    d''informations.


    Procédure d''exécution pour l''agent :

    1. Vérifier l''identité du client à l''aide de l''outil verify_identity en s''assurant
    que la pièce d''identité officielle est valide.

    2. Demander au client les quatre derniers chiffres du numéro de compte qu''il
    souhaite consulter ou utiliser.

    3. Appeler l''outil get_accounts en utilisant ces quatre derniers chiffres pour
    récupérer la liste des comptes correspondants et l''account_id associé.

    4. Confirmer avec le client le type de compte identifié (ex: Compte Kiosque) avant
    de poursuivre l''assistance.


    L''utilisation systématique de get_accounts garantit que nous agissons sur le
    bon compte et prévient toute erreur de saisie manuelle d''identifiant technique.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kiosque
- id: ed4f4c88-5f78-54a6-88e7-2e722ca16b96
  title: Référence de l'outil get_accounts
  body: 'L''outil get_accounts permet à l''agent de récupérer la liste des comptes
    associés à un utilisateur ou de trouver un compte spécifique grâce à un identifiant
    partiel. C''est l''outil de référence pour obtenir l''account_id nécessaire à
    la plupart des autres fonctions de gestion du compte.


    L''agent effectue cette action en appelant l''outil directement avec le paramètre
    suivant :

    - last_four_digits : Les quatre derniers chiffres du numéro de compte fournis
    par le client.


    L''effet de l''outil est de retourner les informations détaillées du ou des comptes
    correspondants, incluant l''identifiant unique (account_id), l''intitulé du compte,
    le solde actuel et la devise. Si aucun compte ne correspond aux chiffres fournis,
    l''outil retourne une erreur indiquant qu''aucun compte n''a été trouvé.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kiosque
- id: 8bbc1a21-1279-5f2d-9cde-3c0626be6821
  title: Quand utiliser open_account
  body: 'Nous utilisons l''outil open_account lorsqu''un nouveau client souhaite rejoindre
    Kiosque pour bénéficier d''un accès bancaire universel. Conformément à notre positionnement,
    l''ouverture d''un compte doit être rapide et accessible, sans condition de revenus
    ni de patrimoine.


    Cette procédure est appliquée pour l''ouverture du Compte Kiosque (pouvant être
    finalisé en 5 minutes) ou du Compte Kiosque 12-17 ans.


    Procédure d''exécution pour l''agent :

    1. Accueillir le client et lui présenter le produit souhaité en se basant sur
    la brochure Compte Kiosque — présentation.

    2. Procéder à la vérification obligatoire de l''identité via l''outil verify_identity.
    Le client doit fournir une pièce d''identité officielle en cours de validité.

    3. Recueillir les informations personnelles nécessaires : nom complet, date de
    naissance, adresse de domiciliation en France et coordonnées de contact (email
    et téléphone).

    4. Pour un Compte Kiosque 12-17 ans, collecter également les informations du représentant
    légal et vérifier le lien de parenté.

    5. Confirmer au client qu''aucune condition de revenus n''est requise pour l''ouverture.

    6. Appeler l''outil open_account avec l''ensemble des informations collectées
    et le type de produit choisi.


    L''agent doit informer le client que l''ouverture est immédiate et que les fonds
    déposés seront protégés par le cantonnement auprès de notre banque partenaire,
    conformément aux règles de la Banque de France et de l''ACPR.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kiosque
- id: a97fc7cd-6b10-58a2-bb56-fb8bc0cbadba
  title: Référence de l'outil open_account
  body: 'L''outil open_account permet à l''agent de créer un nouveau compte de dépôt
    pour un client au sein de l''institution. Cette action déclenche la création technique
    du compte et l''attribution d''un IBAN.


    L''agent effectue cette action en appelant l''outil directement avec les paramètres
    suivants :

    - product_id : L''identifiant du produit à ouvrir (ex: compte_kiosque ou compte_kiosque_ado).

    - customer_full_name : Le nom et prénom complets du titulaire du compte.

    - date_of_birth : La date de naissance du client (format AAAA-MM-JJ).

    - contact_email : L''adresse électronique de contact.

    - contact_phone : Le numéro de téléphone mobile.

    - residential_address : L''adresse postale complète de domiciliation.

    - official_id_number : Le numéro de la pièce d''identité vérifiée lors de l''étape
    de KYC.


    L''effet de l''outil est l''ouverture immédiate du compte. Il retourne l''account_id
    et le numéro IBAN associé, que l''agent doit alors communiquer au client.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kiosque
- id: 2d3db2be-d993-52a9-a141-c33250a5f6ad
  title: Quand utiliser close_account
  body: 'Nous utilisons l''outil close_account lorsqu''un client exprime la volonté
    ferme de mettre fin à sa relation contractuelle avec Kiosque et de fermer son
    compte. La clôture d''un compte est une opération irréversible.


    L''agent doit s''assurer que le client a été informé des modalités de résiliation,
    en se référant au document Compte Kiosque — résilier, clôturer ou changer de formule.


    Procédure d''exécution pour l''agent :

    1. Vérifier l''identité du client via l''outil verify_identity.

    2. Identifier le compte à clôturer en utilisant l''outil get_accounts pour obtenir
    l''account_id exact.

    3. Vérifier le solde du compte. Le solde doit être nul (0 €) avant de procéder
    à la clôture. Si le solde est positif, l''agent doit inviter le client à effectuer
    un virement vers un autre compte à son nom.

    4. Informer explicitement le client que l''opération est irréversible et qu''elle
    entraînera la désactivation immédiate de toutes les cartes associées.

    5. Demander une confirmation finale et orale du client pour la fermeture.

    6. Appeler l''outil close_account en spécifiant l''account_id concerné.


    L''agent doit confirmer la clôture effective au client et l''informer que les
    derniers relevés de compte seront envoyés à son adresse électronique enregistrée.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kiosque
- id: dc751209-6131-5a27-a354-4c41bd581f5f
  title: Référence de l'outil close_account
  body: 'L''outil close_account permet à l''agent de fermer définitivement un compte
    de dépôt. Cette action est irréversible et supprime tout accès futur aux services
    associés à ce compte.


    L''agent effectue cette action en appelant l''outil directement avec le paramètre
    suivant :

    - account_id : L''identifiant unique du compte à clôturer (obtenu via get_accounts).


    L''effet de l''outil est la fermeture immédiate du compte dans nos systèmes. Toutes
    les cartes de paiement liées à ce compte sont automatiquement révoquées et le
    compte ne peut plus recevoir ni émettre de fonds. L''outil retourne une confirmation
    de clôture une fois l''opération validée.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kiosque
- id: 07ff8c77-ad07-53ee-9de2-451d96a09444
  title: Quand utiliser update_contact_info
  body: 'Nous utilisons l''outil update_contact_info lorsqu''un client souhaite modifier
    ses informations personnelles de contact, telles que son adresse postale, son
    adresse email ou son numéro de téléphone mobile.


    La mise à jour des coordonnées est essentielle pour garantir la bonne réception
    des notifications de sécurité, des relevés de compte et pour maintenir la validité
    du dossier KYC (Know Your Customer) conformément aux exigences de l''ACPR.


    Procédure d''exécution pour l''agent :

    1. Vérifier l''identité du client via l''outil verify_identity. Toute modification
    d''information nécessite une authentification stricte.

    2. Identifier le compte du client via l''outil get_accounts pour s''assurer que
    les modifications sont appliquées au bon profil utilisateur.

    3. Recueillir les nouvelles informations auprès du client en précisant clairement
    le champ à modifier (ex: nouvelle adresse email).

    4. Confirmer avec le client l''exactitude des informations saisies pour éviter
    toute erreur de frappe.

    5. Appeler l''outil update_contact_info avec l''identifiant du compte et les nouveaux
    détails de contact.


    L''agent doit informer le client qu''une confirmation de modification lui sera
    envoyée sur l''ancien et le nouveau canal de contact pour prévenir toute tentative
    de fraude.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kiosque
- id: ba466b2b-9e10-5785-99a7-c479a6c52d1d
  title: Référence de l'outil update_contact_info
  body: 'L''outil update_contact_info permet à l''agent de mettre à jour les coordonnées
    de contact d''un client dans la base de données de l''institution.


    L''agent effectue cette action en appelant l''outil directement avec les paramètres
    suivants :

    - account_id : L''identifiant unique du compte du client.

    - email : La nouvelle adresse électronique (optionnel, si modification de l''email).

    - phone_number : Le nouveau numéro de téléphone mobile (optionnel, si modification
    du téléphone).

    - residential_address : La nouvelle adresse postale complète (optionnel, si déménagement).


    L''effet de l''outil est la mise à jour instantanée des informations de contact.
    Si un seul des paramètres optionnels est fourni, seuls les champs renseignés seront
    modifiés ; les autres resteront inchangés.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kiosque
- id: 4d08cf1b-19b2-59a9-9019-5d9e59b08cd9
  title: Quand utiliser get_statements
  body: 'Nous utilisons l''outil get_statements lorsqu''un client souhaite obtenir
    un relevé de compte officiel pour une période donnée. Ces documents sont indispensables
    pour justifier de ses opérations bancaires ou pour effectuer des démarches administratives.


    Pour l''aide à la consultation, l''agent peut également se référer au document
    Compte Kiosque — consulter le suivi ou l''historique.


    Procédure d''exécution pour l''agent :

    1. Vérifier l''identité du client via l''outil verify_identity.

    2. Identifier le compte concerné en utilisant l''outil get_accounts pour obtenir
    l''account_id.

    3. Demander au client la période exacte pour laquelle il souhaite le relevé (date
    de début et date de fin).

    4. Vérifier que la période demandée est comprise dans l''historique disponible
    du compte.

    5. Appeler l''outil get_statements avec l''account_id et les dates définies.


    L''agent doit informer le client que le relevé sera généré au format PDF et envoyé
    directement sur son adresse email sécurisée. Si le client a besoin de relevés
    pour une période très ancienne, l''agent doit lui préciser les délais de conservation
    réglementaires des documents bancaires.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kiosque
- id: a5a8502d-09e1-5811-983f-d47bc16cfe23
  title: Référence de l'outil get_statements
  body: 'L''outil get_statements permet à l''agent d''extraire les relevés bancaires
    officiels d''un client pour une période donnée. L''agent effectue cette action
    en appelant l''outil directement dans l''interface de conversation, sans rediriger
    le client vers un portail externe.


    **Signature de l''outil :**

    `get_statements(account_id: string, start_date: string, end_date: string)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte, obtenu préalablement via l''outil
    get_accounts.

    - `start_date` : La date de début de la période souhaitée (format AAAA-MM-JJ).

    - `end_date` : La date de fin de la période souhaitée (format AAAA-MM-JJ).


    **Effet :**

    L''outil génère et retourne le ou les relevés de compte correspondant à la plage
    temporelle spécifiée. Ces documents récapitulent l''ensemble des opérations (crédits
    et débits) et le solde final pour la période, conformément aux obligations de
    transparence de Kiosque.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kiosque
- id: f975f53e-f535-516b-97de-6832fd34924e
  title: Quand utiliser set_alerts
  body: 'Nous proposons à nos clients de mieux maîtriser leur budget grâce à la mise
    en place d''alertes personnalisées. L''outil set_alerts est utilisé pour configurer
    des notifications automatiques basées sur des seuils de solde ou des types de
    transactions.


    L''agent doit suivre rigoureusement la procédure suivante :


    1. **Vérification de l''identité** : L''agent doit obligatoirement vérifier l''identité
    du client via une pièce officielle avant toute modification.

    2. **Identification du compte** : Utiliser l''outil get_accounts pour identifier
    l''account_id correspondant aux informations fournies par le client (par exemple,
    les 4 derniers chiffres du compte).

    3. **Définition du besoin** : L''agent doit confirmer avec le client le type d''alerte
    souhaitée (ex: solde bas, virement reçu) et le montant du seuil déclencheur.

    4. **Exécution** : Appeler l''outil set_alerts en renseignant l''account_id, le
    type d''alerte et la valeur du seuil.


    Cette fonctionnalité est disponible pour tous nos produits, y compris le Compte
    Kiosque 12-17 ans, permettant ainsi une initiation financière sécurisée et pédagogique
    pour les jeunes.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kiosque
- id: 1ee19a7d-dc69-56b1-b841-9ef122e0473c
  title: Référence de l'outil set_alerts
  body: 'L''outil set_alerts permet à l''agent de configurer des notifications de
    suivi pour le compte d''un client. L''agent réalise cette opération en appelant
    l''outil directement durant l''échange.


    **Signature de l''outil :**

    `set_alerts(account_id: string, alert_type: string, threshold: number)`


    **Arguments :**

    - `account_id` : L''identifiant unique du compte (récupéré via get_accounts).

    - `alert_type` : La nature de l''alerte (par exemple : "low_balance" pour un solde
    bas ou "large_transaction" pour un montant élevé).

    - `threshold` : La valeur numérique servant de déclencheur pour l''alerte (ex:
    50 pour 50 €).


    **Effet :**

    L''outil active la notification correspondante sur le compte du client. Le client
    sera alors averti via son canal de communication préféré dès que la condition
    définie sera remplie.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kiosque
- id: 4e9591e1-3eb2-5eee-b8b2-ed7bf2aa0819
  title: Quand utiliser transfer_funds
  body: 'L''outil transfer_funds est le mécanisme autorisé pour effectuer des virements
    standards entre comptes. Il permet de déplacer des fonds d''un compte Kiosque
    vers un autre IBAN.


    L''agent doit appliquer les étapes suivantes :


    1. **Vérification de l''identité** : Procéder à la vérification obligatoire de
    l''identité du demandeur.

    2. **Ciblage du compte** : Utiliser get_accounts pour obtenir l''account_id du
    compte à débiter.

    3. **Collecte des informations** : Demander au client l''IBAN du bénéficiaire,
    le nom complet de ce dernier et le montant exact du transfert.

    4. **Vérification du solde** : L''agent s''assure que le compte est suffisamment
    provisionné pour couvrir l''opération, sachant que nos cartes sont à autorisation
    systématique et n''autorisent pas de découvert.

    5. **Exécution** : Appeler l''outil transfer_funds avec les détails collectés.


    S''il s''agit d''un besoin de transfert immédiat, l''agent peut orienter le client
    vers le Virement instantané Kiosque, tout en rappelant que l''exécution standard
    via transfer_funds respecte les délais bancaires classiques.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kiosque
- id: d8567502-8314-567e-90d8-cb7c1b8fabcd
  title: Référence de l'outil transfer_funds
  body: 'L''outil transfer_funds permet à l''agent d''initier un transfert de fonds
    classique depuis le compte d''un client vers un tiers. L''action est déclenchée
    par l''agent directement dans la conversation.


    **Signature de l''outil :**

    `transfer_funds(account_id: string, beneficiary_iban: string, amount: number,
    currency: string)`


    **Arguments :**

    - `account_id` : L''identifiant du compte à débiter (obtenu via get_accounts).

    - `beneficiary_iban` : L''IBAN complet du destinataire des fonds.

    - `amount` : Le montant du transfert en chiffres (ex: 120,50).

    - `currency` : Le code devise (par défaut "EUR").


    **Effet :**

    L''outil ordonne le débit du compte client et l''envoi des fonds vers l''IBAN
    bénéficiaire selon les délais de traitement SEPA standards.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kiosque
- id: 950b4509-9215-5d8f-bbe1-2fc5902668f0
  title: Quand utiliser order_replacement_card
  body: 'Nous accompagnons nos clients en cas de perte, de vol ou d''usure physique
    de leur carte bancaire. L''outil order_replacement_card permet de commander un
    nouveau support physique.


    L''agent doit suivre ce processus :


    1. **Vérification de l''identité** : Effectuer la vérification d''identité obligatoire.

    2. **Sécurisation immédiate** : Si la carte est perdue ou volée, l''agent doit
    d''abord proposer ou exécuter l''outil freeze_card pour bloquer toute utilisation
    frauduleuse.

    3. **Identification du produit** : Utiliser get_accounts pour identifier le compte
    et le type de carte associé (par exemple, s''il s''agit d''une Carte Kiosque Voyage).

    4. **Commande** : Appeler l''outil order_replacement_card en précisant l''account_id
    et le type de carte à remplacer.

    5. **Information client** : Confirmer au client le délai d''expédition et rappeler
    que la nouvelle carte devra être activée à réception.


    Pour toute contestation d''opération sur la carte volée, l''agent rappelle au
    client qu''il dispose d''un délai de contestation de 13 mois pour les opérations
    non autorisées.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: kiosque
- id: 68307941-063a-54d5-baa9-bf3f15c37976
  title: Référence de l'outil order_replacement_card
  body: 'L''outil order_replacement_card permet à l''agent de commander l''envoi d''une
    nouvelle carte bancaire pour remplacer une carte existante. L''agent effectue
    l''appel à l''outil directement dans le flux de conversation.


    **Signature de l''outil :**

    `order_replacement_card(account_id: string, card_id: string)`


    **Arguments :**

    - `account_id` : L''identifiant du compte lié à la carte (obtenu via get_accounts).

    - `card_id` : L''identifiant de la carte à remplacer ou le code produit (ex: `carte_kiosque_voyage`).


    **Effet :**

    L''outil déclenche la fabrication et l''expédition postale d''une nouvelle carte
    physique à l''adresse enregistrée du client. La carte précédente est définitivement
    invalidée si elle ne l''était pas déjà.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: kiosque
- id: abf9e91f-63ba-50a4-bcaf-10448f470f2a
  title: Quand utiliser pay_bill
  body: 'L''outil pay_bill est utilisé pour aider un client à régler une facture spécifique
    via un virement ponctuel, en associant le paiement à une référence de facture.


    L''agent doit procéder ainsi :


    1. **Vérification de l''identité** : Vérifier l''identité du client avec une pièce
    officielle.

    2. **Localisation du compte** : Utiliser l''outil get_accounts pour récupérer
    l''account_id du compte à débiter.

    3. **Collecte des détails de facturation** : Demander au client l''IBAN du créancier,
    le montant exact de la facture et la référence (numéro de facture ou référence
    client).

    4. **Exécution** : Appeler l''outil pay_bill en saisissant l''account_id, le montant,
    l''IBAN du bénéficiaire et la référence.

    5. **Confirmation** : Informer le client que le paiement a été initié et qu''il
    pourra le retrouver dans son historique d''opérations.


    Nous rappelons que Kiosque ne gère pas l''émission de chèques, le règlement des
    factures s''effectue donc exclusivement par voie électronique.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: kiosque
- id: 1e523bbe-a4dd-5775-b678-67c42749da84
  title: Référence de l'outil pay_bill
  body: 'L''outil pay_bill permet à l''agent d''effectuer un paiement de facture pour
    le compte d''un client. L''agent appelle l''outil directement durant la session
    de support.


    **Signature de l''outil :**

    `pay_bill(account_id: string, amount: number, beneficiary_iban: string, reference:
    string)`


    **Arguments :**

    - `account_id` : L''identifiant du compte à débiter (obtenu via get_accounts).

    - `amount` : Le montant exact de la facture à régler (ex: 45,00).

    - `beneficiary_iban` : L''IBAN du destinataire du paiement.

    - `reference` : La référence de la facture ou le motif du paiement pour faciliter
    le lettrage chez le créancier.


    **Effet :**

    L''outil exécute un virement SEPA du montant indiqué vers le bénéficiaire, en
    incluant la référence dans le libellé de l''opération.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: kiosque
- id: 0fa918b2-d58b-5834-a516-2d36b729ed2c
  title: Quand utiliser activate_card
  body: 'Lorsqu''un client reçoit sa nouvelle carte physique par courrier, celle-ci
    est inactive par mesure de sécurité. L''outil activate_card est utilisé pour rendre
    la carte opérationnelle.


    L''agent doit suivre ces étapes :


    1. **Vérification de l''identité** : Procéder à la vérification d''identité obligatoire
    via une pièce officielle.

    2. **Identification du compte** : Utiliser get_accounts pour obtenir l''account_id
    du client.

    3. **Identification de la carte** : Demander au client les derniers chiffres de
    la carte reçue pour s''assurer de l''activation du bon support.

    4. **Exécution** : Appeler l''outil activate_card en renseignant l''account_id
    et l''identifiant de la carte.

    5. **Confirmation** : Confirmer au client que sa carte est désormais active et
    peut être utilisée pour des paiements ou des retraits.


    L''agent doit rappeler que pour tout paiement en ligne, l''authentification forte
    sera systématiquement appliquée pour sécuriser les transactions.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: kiosque
- id: 0c46ddf0-b503-551d-b25c-def49c7316ec
  title: Référence de l'outil activate_card
  body: 'L''outil `activate_card` permet à l''agent d''activer une carte bancaire
    pour le compte d''un client. Cette action est indispensable avant que la carte
    ne puisse être utilisée pour des paiements ou des retraits, quel que soit le produit
    concerné (Compte Kiosque, Carte Kiosque Voyage ou Compte Kiosque 12-17 ans).


    L''agent effectue cette opération en appelant l''outil directement dans l''interface
    de conversation, sans jamais rediriger le client vers une application, un portail
    externe ou un point de vente partenaire.


    Arguments requis :

    - Identifiant de la carte : Le numéro de la carte ou la référence unique fournie
    lors de l''expédition.

    - Identifiant du compte : L''identifiant technique du compte associé à la carte
    (obtenu préalablement via `get_accounts`).


    Effet : La carte passe instantanément du statut « inactif » au statut « actif
    », permettant son utilisation immédiate.


    L''agent doit impérativement s''assurer que l''identité du client a été validée
    via l''outil `verify_identity` avant de déclencher l''activation, conformément
    à nos règles de sécurité.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: kiosque
- id: d435d362-a062-5c62-b5d7-92d7bc664abc
  title: Quand utiliser dispute_status
  body: 'Chez Kiosque, nous adoptons une posture de protection rigoureuse pour nos
    clients. L''outil `dispute_status` est l''unique mécanisme permettant à l''agent
    d''informer un client sur l''état d''avancement de sa demande de remboursement
    concernant une opération non autorisée.


    Nous appliquons un délai de contestation étendu de 13 mois pour les opérations
    non autorisées. Pour garantir la rapidité d''exécution qui nous caractérise, le
    remboursement intervient généralement dès le premier jour ouvré suivant la notification
    de la fraude ou de l''erreur.


    Procédure d''utilisation :


    1. Vérification de l''identité : L''agent doit systématiquement utiliser `verify_identity`
    pour s''assurer de l''identité du demandeur avant toute consultation.

    2. Identification du compte : Si le client fournit seulement les quatre derniers
    chiffres de son compte, l''agent utilise `get_accounts` pour résoudre l''identifiant
    complet du compte.

    3. Localisation de la transaction : L''agent doit identifier avec précision la
    transaction concernée, en utilisant `get_account_transactions` si le client n''a
    pas la référence sous la main, afin d''obtenir l''identifiant unique de la transaction.

    4. Consultation du statut : L''agent appelle l''outil `dispute_status` en fournissant
    l''identifiant de la transaction et l''identifiant du compte.

    5. Communication pédagogique : L''agent communique le statut actuel (par exemple
    : « en cours d''examen », « remboursement validé » ou « demande rejetée ») en
    expliquant clairement les étapes restantes.


    Si le client souhaite initier une nouvelle contestation, l''agent doit se référer
    à la procédure décrite dans le document "Quand utiliser file_transaction_dispute".


    En cas de demande complexe, de contestation d''un refus de remboursement ou de
    litige persistant, l''agent doit escalader le dossier vers le support centralisé
    de Kiosque pour une analyse approfondie.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: kiosque
- id: e3bd274b-dd25-5aad-8fcf-9f8d71cba20a
  title: Référence de l'outil dispute_status
  body: 'L''outil `dispute_status` permet à l''agent de consulter en temps réel l''état
    d''un dossier de contestation lié à une transaction spécifique. Cet outil est
    essentiel pour maintenir notre promesse de transparence et fournir une réponse
    rapide aux clients concernant le suivi de leurs demandes de remboursement.


    L''agent réalise cette action en appelant l''outil directement dans la conversation,
    sans demander au client d''attendre un e-mail ou de consulter son espace personnel.


    Arguments requis :

    - Identifiant de la transaction : Le code alphanumérique unique associé à l''opération
    faisant l''objet du litige.

    - Identifiant du compte : L''identifiant technique du compte sur lequel la transaction
    a été effectuée (récupéré via l''outil `get_accounts`).


    Effet : L''outil retourne le statut actuel du litige (par exemple : « En cours
    d''instruction », « Validé - Remboursement effectué », ou « Refusé ») ainsi que
    la date et l''heure de la dernière mise à jour du dossier.


    L''agent doit impérativement avoir vérifié l''identité du client via `verify_identity`
    avant d''interroger le statut d''une contestation pour protéger la confidentialité
    des données bancaires.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: kiosque
