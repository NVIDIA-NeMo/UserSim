- id: f2fe89a8-2f7a-5b5c-9510-5398cc789321
  title: Compte Kiosque 12-17 ans — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos fonds et de vos données est notre priorité absolue. Pour
    les utilisateurs du Compte Kiosque 12-17 ans, nous recommandons d''appliquer rigoureusement
    ces bonnes pratiques pour éviter tout incident.


    L''authentification forte est systématiquement appliquée pour tous vos paiements
    en ligne. Ne partagez jamais vos codes secrets, vos identifiants ou vos mots de
    passe, même avec un proche. Nous vous rappelons que Kiosque ne vous demandera
    jamais votre code secret par message, par téléphone ou par e-mail.


    Soyez vigilants face aux tentatives de phishing : nous n''envoyons jamais de liens
    demandant de mettre à jour vos informations personnelles en urgence. Si vous recevez
    un message suspect, ne cliquez sur rien et informez-nous immédiatement.


    En cas d''opération non autorisée, nous appliquons une politique de protection
    rigoureuse. Vous disposez d''un délai de contestation de 13 mois pour nous signaler
    toute transaction que vous n''avez pas validée. Une fois la notification reçue,
    nous intervenons rapidement et le remboursement intervient généralement dès le
    premier jour ouvré suivant la notification, conformément aux délais réglementaires.


    Enfin, nous vous conseillons de surveiller régulièrement vos transactions. Le
    plafond de paiement hebdomadaire de 150 € est justement conçu pour limiter l''impact
    financier en cas d''utilisation frauduleuse de la carte. Si vous perdez votre
    carte ou si vous remarquez une activité inhabituelle, demandez-nous de la bloquer
    sans délai pour sécuriser votre solde.'
  domain: retail_banking
  product_category: compte_kiosque_ado
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 1512c852-566a-5ca0-a9c9-8c7c9f882c9e
  title: Compte Kiosque 12-17 ans — modification des conditions
  body: "Le présent document précise les modalités de modification des conditions\
    \ générales applicables au Compte Kiosque 12-17 ans. L'utilisation de ce service\
    \ implique l'acceptation des termes définis par Kiosque, sous la supervision de\
    \ l'ACPR et de la Banque de France.\n\nNous nous réservons le droit de modifier\
    \ les conditions tarifaires et les plafonds du service pour garantir la viabilité\
    \ de notre modèle inclusif. Toute modification, telle qu'un changement de la cotisation\
    \ annuelle de 20 € ou une évolution du plafond de paiement hebdomadaire de 150\
    \ €, fera l'objet d'une notification préalable.\n\nNous nous engageons à vous\
    \ informer de tout changement contractuel avec un préavis minimal de deux mois\
    \ avant son entrée en vigueur. Cette notification vous sera transmise via vos\
    \ canaux de communication habituels. Si vous n'acceptez pas les nouvelles conditions,\
    \ vous avez la possibilité de clôturer votre compte sans frais supplémentaires\
    \ avant la date d'application des modifications.\n\nLe maintien du compte est\
    \ conditionné au respect de l'âge minimal requis, soit 12 ans. À l'atteinte de\
    \ la majorité ou selon les termes de transition définis, le compte pourra être\
    \ converti vers une offre adulte. \n\nLe non-respect des obligations de sécurité,\
    \ notamment le partage d'identifiants, peut entraîner la suspension immédiate\
    \ du compte. Nous rappelons que la vérification de l'identité via une pièce officielle\
    \ est obligatoire pour toute modification d'information sur le compte, garantissant\
    \ ainsi la protection des titulaires mineurs et de leurs représentants légaux."
