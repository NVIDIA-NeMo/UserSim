  institution_id: kiosque
- id: 194f1623-d97c-58b5-946e-93fc020d1df9
  title: Compte Kiosque — offre en cours
  body: 'Bénéficiez de notre offre de bienvenue Kiosque !


    Nous accompagnons vos premiers pas vers l''inclusion financière. Pour tout nouveau
    dépôt effectué sur votre compte entre le 1er novembre 2024 et le 30 novembre 2024,
    nous vous offrons un bonus de bienvenue de 5 € crédité directement sur votre solde.


    Conditions de l''offre :

    - Offre réservée aux clients détenteurs d''un Compte Kiosque.

    - Le bonus de 5 € est versé après la validation du premier dépôt en point de vente
    partenaire.

    - L''offre se termine le 30 novembre 2024 à 23h59.


    Note : Cette offre promotionnelle ne modifie pas la cotisation annuelle de 24
    € ni les frais de dépôt d''espèces de 2 % applicables à vos opérations.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 44a99278-5b02-578a-9759-07f6820f6f13
  title: Compte Kiosque — protection contre la fraude et les opérations non autorisées
  body: 'Chez Kiosque, nous mettons tout en œuvre pour que votre expérience bancaire
    soit la plus sûre possible. La protection de vos fonds et de vos données est notre
    priorité absolue, et nous appliquons des protocoles de sécurité rigoureux pour
    contrer la fraude.


    Pour sécuriser vos transactions, nous appliquons systématiquement l''authentification
    forte pour tous les paiements en ligne. Cela signifie qu''une simple validation
    ne suffit pas ; une étape de vérification supplémentaire est requise pour confirmer
    que vous êtes bien l''auteur de l''opération. Par ailleurs, nous exigeons la présentation
    d''une pièce d''identité officielle avant toute modification d''informations personnelles
    ou toute opération sensible sur votre compte.


    Si vous constatez une opération que vous n''avez pas autorisée, nous vous offrons
    une protection robuste. Vous disposez d''un délai de contestation de 13 mois pour
    nous signaler toute transaction frauduleuse. Une fois la notification reçue, nous
    intervenons rapidement : le remboursement intervient selon les délais réglementaires,
    généralement dès le premier jour ouvré suivant votre signalement.


    Soyez vigilants : Kiosque ne vous demandera jamais votre code secret ou vos identifiants
    de connexion par message ou par téléphone. Si un message semble suspect, ne cliquez
    sur aucun lien et informez-nous immédiatement. La rapidité de votre signalement
    est la clé pour limiter l''impact d''une éventuelle fraude et permettre l''application
    efficace de notre politique de remboursement.


    Nous vous encourageons à consulter régulièrement vos relevés pour détecter toute
    anomalie. En restant attentifs et en utilisant nos outils de sécurité, nous assurons
    ensemble l''intégrité de vos avoirs.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 16c91961-1820-577c-ac26-2c5424a0a559
  title: Compte Kiosque — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation du Compte Kiosque.
    Ce service est conçu pour offrir un accès bancaire universel et rapide, avec une
    ouverture de compte réalisable en 5 minutes dans nos points de vente agréés, sans
    condition de revenus ni de patrimoine.


    **Obligations financières et tarification**

    L''utilisateur s''engage à acquitter une cotisation annuelle de 24 €. Pour assurer
    la viabilité du service et couvrir les frais opérationnels de nos partenaires
    (bureaux de tabac, marchands de journaux), tout dépôt d''espèces effectué en point
    de vente est soumis à des frais de 2 %. De même, chaque retrait d''espèces via
    un distributeur automatique entraîne des frais de 1 €.


    **Sécurité et vérification**

    L''ouverture et la gestion du compte sont conditionnées par la fourniture d''une
    pièce d''identité officielle. Toute modification d''information sur le compte
    nécessite une nouvelle vérification d''identité. L''authentification forte est
    obligatoire pour tous les paiements en ligne afin de garantir la sécurité des
    fonds.


    **Cadre réglementaire et protection**

    Kiosque opère sous la supervision de l''ACPR et de la Banque de France, dans le
    respect strict du Code monétaire et financier. La protection des fonds est assurée
    par le FGDR pour la banque de détail. Pour les services de paiement, nous utilisons
    le cantonnement des fonds auprès d''une banque partenaire, garantissant que vos
    avoirs sont distincts des fonds propres de l''entreprise.


    **Clôture et modification**

    Le client peut demander la clôture de son compte à tout moment. La clôture définitive
    intervient après solde du compte et confirmation de l''identité du titulaire.
    Kiosque se réserve le droit de modifier les présentes conditions, sous réserve
    d''en informer le client dans les délais légaux. Pour les procédures de fermeture,
    nous vous invitons à consulter le document Compte Kiosque — résilier, clôturer
    ou changer de formule.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 0f2e9d1b-1e30-52a9-9997-c42716a33ae4
  title: Compte Kiosque — pour qui et pour quels usages
  body: 'Le Compte Kiosque est notre solution d''accessibilité universelle. Nous avons
    conçu ce produit pour lever les barrières bancaires traditionnelles et offrir
    une autonomie financière à tous, sans distinction de situation sociale.


    **Cibles principales**

    Ce compte s''adresse prioritairement :

    - Au grand public recherchant une simplicité absolue.

    - Aux populations sous-bancarisées qui font face à des refus dans le système classique.

    - Aux jeunes adultes souhaitant leur premier compte sans conditions de ressources.


    **Usages et points forts**

    L''atout majeur du Compte Kiosque est sa rapidité d''exécution : l''ouverture
    se fait en 5 minutes dans nos points de vente partenaires. C''est l''outil idéal
    pour ceux qui ont besoin d''un compte immédiatement et qui apprécient la proximité
    des commerces de quartier (bureaux de tabac, presse) pour leurs opérations.


    **Transparence tarifaire**

    Pour maintenir un service abordable et inclusif, nous appliquons une tarification
    forfaitaire claire :

    - Cotisation annuelle : 24 €.

    - Dépôt d''espèces en point de vente : 2 % du montant déposé.

    - Retrait d''espèces au distributeur : 1 € par opération.


    **Philosophie de service**

    Nous croyons que la banque doit être un service simple. C''est pourquoi nous ne
    demandons aucune condition de revenus ni de patrimoine pour l''ouverture. Vous
    bénéficiez d''un support pédagogique via nos canaux numériques et l''assistance
    physique de nos points de vente partenaires selon les horaires français. Pour
    plus de détails sur la mise en place, vous pouvez consulter Compte Kiosque — présentation.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: f1d96de1-d6bc-5ff8-b586-0d58619880bb
  title: 'Compte Kiosque — frais de dépôt d''espèces en point de vente : explications'
  body: '**Pourquoi y a-t-il des frais lors d''un dépôt d''espèces ?**

    Pour rendre le Compte Kiosque accessible partout, nous collaborons avec un vaste
    réseau de points de vente partenaires, tels que les bureaux de tabac et les marchands
    de journaux. Le traitement physique de l''argent liquide engendre des coûts logistiques
    et de sécurité importants pour ces commerçants. Les frais de 2 % reflètent précisément
    ces coûts opérationnels, nous permettant de maintenir un réseau de proximité efficace.


    **Comment sont calculés ces frais ?**

    Les frais sont proportionnels au montant que vous déposez. Par exemple, pour un
    dépôt de 100 €, les frais s''élèveront à 2 €. Ce montant est déduit pour couvrir
    le service de dépôt.


    **Existe-t-il des alternatives gratuites pour alimenter mon compte ?**

    Oui, les virements bancaires vers votre compte restent un moyen d''alimentation
    efficace. Pour comprendre l''ensemble de notre structure de coûts, nous vous invitons
    à consulter Compte Kiosque — grille tarifaire.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 9dbd3a77-57cb-509c-ae8b-6a0c368a77b6
  title: Compte Kiosque — résilier, clôturer ou changer de formule
  body: 'La clôture de votre compte ou le changement de formule est une procédure
    simple que nous traitons avec transparence. Voici la marche à suivre pour résilier
    votre Compte Kiosque.


    **Prérequis**

    Avant de commencer, assurez-vous que votre solde est positif ou nul. Si vous avez
    des opérations en cours, attendez leur finalisation complète.


    **Étapes de clôture**

    1. **Demande de clôture** : Indiquez-nous votre souhait de fermer votre compte.
    Nous vous demanderons alors de confirmer vos informations personnelles.

    2. **Vérification d''identité** : Pour votre sécurité, nous vous demanderons de
    nous fournir une pièce d''identité officielle à jour. Cette étape est obligatoire
    pour valider la fermeture du compte.

    3. **Transfert du solde** : Indiquez-nous le RIB du compte vers lequel nous devons
    transférer vos fonds restants. Nous effectuerons le virement du solde créditeur.

    4. **Confirmation de clôture** : Une fois le solde transféré et l''identité vérifiée,
    nous procédons à la clôture technique. Vous recevrez une confirmation officielle
    de la fermeture de votre compte.


    **Changement de formule**

    Si vous souhaitez passer à une autre offre, comme la carte pour voyageurs, le
    processus est similaire : nous vérifions votre identité, nous annulons les conditions
    de l''ancien produit et nous activons les nouvelles modalités tarifaires.


    L''ensemble de ce processus est conçu pour être rapide. Si vous avez des questions
    sur les frais annuels de 24 € avant de clôturer, vous pouvez consulter Compte
    Kiosque — cotisation annuelle : explications.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2312a0d0-e92f-52f8-97ab-35bf4f3276b0
  title: Compte Kiosque — frais ou montant inattendu
  body: 'Il arrive qu''un client s''interroge sur un prélèvement qu''il ne reconnaît
    pas sur son Compte Kiosque. Voici la procédure pour identifier et résoudre ce
    problème.


    **Symptôme**

    Le client signale un montant manquant sur son solde ou la présence de frais qu''il
    juge injustifiés dans son historique de transactions.


    **Causes probables et vérifications**

    L''agent doit vérifier l''historique des transactions et comparer les prélèvements
    avec la grille tarifaire :

    1. **Cotisation annuelle** : Vérifier si la date anniversaire du compte est arrivée.
    Le prélèvement de 24 € correspond à la cotisation annuelle forfaitaire.

    2. **Dépôts d''espèces** : Vérifier si le client a effectué un dépôt en point
    de vente récemment. Chaque dépôt déclenche des frais de 2 % du montant versé.

    3. **Retraits ATM** : Vérifier s''il y a eu des retraits au distributeur. Chaque
    retrait entraîne des frais fixes de 1 €.


    **Résolution**

    - **Si les frais sont conformes** : Expliquer pédagogiquement au client la nature
    du frais (ex: « Ce montant de 1 € correspond aux frais de retrait au distributeur
    ») et rappeler la transparence de notre tarification forfaitaire.

    - **Si une erreur est détectée** : Si le frais a été appliqué deux fois ou par
    erreur, l''agent doit initier un remboursement immédiat du montant indûment perçu.


    **Escalade**

    Si le client conteste toujours le montant après ces explications, ou s''il s''agit
    d''une opération non autorisée (fraude), l''agent doit escalader la demande vers
    le support centralisé de Kiosque pour l''ouverture d''un dossier de contestation.
    Le client doit alors être informé du délai de remboursement réglementaire, généralement
    dès le premier jour ouvré suivant la notification.'
  domain: retail_banking
  product_category: compte_kiosque
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kiosque
- id: 2ca3fb74-78ac-58ce-9227-e3b4f3b4d5d6
  title: Compte Kiosque — justificatifs à fournir
  body: 'Pour ouvrir un Compte Kiosque, nous avons simplifié les exigences au maximum
    afin de garantir l''accessibilité universelle. Voici les documents nécessaires
    selon votre situation :


    | Type de justificatif | Exigence | Résultat / Action |

    | :--- | :--- | :--- |

    | **Pièce d''identité officielle** | Obligatoire (CNI, Passeport, Titre de séjour)
    | Validation de l''identité et ouverture possible |

    | **Justificatif de domicile** | Obligatoire (Facture énergie, téléphone, avis
    fiscal) | Confirmation de la domiciliation et activation |

    | **Justificatif de revenus** | Non requis | Accès au compte sans condition de
    ressources |

    | **Justificatif de patrimoine** | Non requis | Accès au compte sans condition
    de patrimoine |


    L''absence de pièce d''identité officielle empêche toute ouverture de compte ou
    modification d''information, conformément à nos obligations de sécurité. Une fois
    ces documents présentés, l''ouverture est finalisée en 5 minutes.'
