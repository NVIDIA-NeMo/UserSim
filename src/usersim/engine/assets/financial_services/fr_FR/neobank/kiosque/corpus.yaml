  institution_id: kiosque
- id: 707e7db2-1107-5828-88f6-c757ad02e0d8
  title: Virement instantané Kiosque — conditions générales
  body: 'Le présent document définit les conditions d''utilisation du Virement instantané
    Kiosque. Ce service permet le transfert immédiat de fonds entre le compte du donneur
    d''ordre et celui du bénéficiaire.


    Tarification et Limites :

    Le service est mis à disposition avec des frais de virement instantané fixés à
    0 €. Ce montant est applicable à toutes les transactions effectuées dans le respect
    des plafonds en vigueur. Le montant maximum autorisé pour les transferts est régi
    par un plafond quotidien de virement de 3 000 €. Toute tentative de transfert
    dépassant ce seuil sera automatiquement rejetée par nos systèmes.


    Obligations de l''utilisateur :

    L''utilisateur s''engage à fournir des informations exactes concernant le bénéficiaire.
    La vérification du nom du bénéficiaire est une étape clé de la sécurisation du
    service. L''utilisateur est responsable de la validité des coordonnées bancaires
    saisies.


    Cadre Réglementaire et Sécurité :

    Le Virement instantané Kiosque opère sous la supervision de l''ACPR et de la Banque
    de France, dans le strict respect du Code monétaire et financier. Conformément
    à nos procédures de sécurité, la vérification de l''identité via une pièce officielle
    est obligatoire avant toute opération sur le compte. L''authentification forte
    est requise pour chaque validation de transfert.


    Modification et Résiliation :

    Nous nous réservons le droit de modifier les plafonds ou les conditions tarifaires
    moyennant un préavis communiqué via nos canaux numériques. L''utilisateur peut
    cesser d''utiliser le service à tout moment sans frais supplémentaires, ou demander
    la clôture complète de son compte en suivant la procédure décrite dans Compte
    Kiosque — résilier, clôturer ou changer de formule.'
  domain: payments
  product_category: virement_instantane
  document_type: terms_conditions
  source_authority: official
  placeholder: true
