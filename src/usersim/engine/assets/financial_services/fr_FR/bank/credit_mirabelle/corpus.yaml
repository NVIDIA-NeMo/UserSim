  institution_id: credit_mirabelle
- id: c1c539e5-1533-5a9a-a6b6-6fda5c087e99
  title: Parts sociales Mirabelle — offre en cours
  body: 'Chers Sociétaires, chers Clients,


    Nous avons le plaisir de vous rappeler l''opportunité d''accroître votre implication
    au sein de notre coopérative. Pour l''année en cours, nous maintenons une rémunération
    attractive pour vos investissements dans le capital de notre banque.


    Profitez dès maintenant de notre offre de capitalisation :

    - Prix d''une part sociale : 15 €

    - Taux de rémunération annuel : 2,1 %


    En augmentant votre nombre de parts, vous renforcez la solidité financière du
    Crédit Mirabelle et consolidez votre rôle d''acteur local. Cette offre est ouverte
    à tous nos clients disposant d''un compte courant et dont le dossier d''identité
    est à jour.


    Nous vous invitons à nous faire part de votre souhait de souscription lors de
    votre prochain échange avec votre conseiller. Pour comprendre comment activer
    vos nouvelles parts, vous pouvez consulter le document Parts sociales Mirabelle
    — souscrire et activer.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 07c4a7b2-37f8-5772-b0a1-ad6466f4fc6e
  title: Parts sociales Mirabelle — protection contre la fraude et les opérations
    non autorisées
  body: 'La détention de Parts sociales Mirabelle vous confère un statut de sociétaire,
    ce qui peut faire de vous une cible pour des tentatives de fraude sophistiquées.
    Nous tenons à vous informer des mécanismes de protection et des points de vigilance
    essentiels.


    Certains fraudeurs pourraient tenter de vous contacter en usurpant l''identité
    de Crédit Mirabelle, en vous proposant des rendements anormalement élevés ou en
    vous demandant de transférer vos fonds vers un compte tiers pour « optimiser »
    votre rémunération de 2,1 %. Soyez extrêmement vigilants : nous ne vous demanderons
    jamais de communiquer vos codes secrets ou d''effectuer un virement vers un compte
    externe pour valider la détention de vos parts.


    L''authentification forte et la vérification rigoureuse de votre identité sont
    obligatoires avant toute action modifiant l''état de vos parts ou toute communication
    d''informations sensibles. Aucun changement de données n''est effectué sans une
    validation d''identité conforme aux normes KYC (Know Your Customer).


    En cas d''opération non autorisée, nous traitons les fraudes avec diligence et
    garantissons le remboursement des opérations non autorisées selon les délais légaux.
    Conformément à notre politique, vous disposez d''un délai de 13 mois pour contester
    une opération mal exécutée ou non autorisée concernant vos comptes associés.


    Si vous constatez une anomalie dans le nombre de vos parts (dont le prix unitaire
    est de 15 €) ou un mouvement suspect, informez-nous immédiatement. La réactivité
    est la meilleure défense pour protéger votre capital et vos droits de vote au
    sein de notre coopérative.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 529016e7-8577-51f1-9a6b-8e42cd7c377b
  title: Parts sociales Mirabelle — conditions générales
  body: 'Les présentes conditions régissent la souscription et la détention des Parts
    sociales Mirabelle. En devenant sociétaire, vous adhérez aux principes de gouvernance
    démocratique de notre banque coopérative.


    1. Souscription et Prix

    L''acquisition de parts sociales est conditionnée par le versement d''un montant
    correspondant au prix unitaire de 15 € par part. Le nombre de parts souscrites
    détermine vos droits et votre poids dans la gouvernance locale, conformément au
    principe « une personne, une voix ».


    2. Rémunération

    Les parts sociales sont rémunérées à un taux de 2,1 %. Cette rémunération est
    calculée annuellement sur la base des parts détenues et peut être versée sur votre
    compte courant ou capitalisée selon les décisions de l''assemblée générale des
    sociétaires.


    3. Obligations du Sociétaire

    Le sociétaire s''engage à respecter les statuts de la coopérative. L''acquisition
    des parts sociales implique une participation active à la vie de l''institution,
    notamment via le droit de vote en assemblée générale.


    4. Retrait et Sortie

    La demande de remboursement des parts sociales est soumise aux conditions de liquidité
    de la banque et à la validation du conseil d''administration. Le remboursement
    s''effectue sur la base de la valeur nominale de 15 € par part, sous réserve des
    dispositions statutaires relatives aux pertes éventuelles.


    5. Modifications et Fin du Contrat

    Crédit Mirabelle se réserve le droit de modifier les conditions de rémunération
    en fonction des résultats de l''exercice, après vote en assemblée générale. Le
    contrat prend fin lors du remboursement intégral des parts ou du décès du sociétaire,
    selon les modalités de transmission prévues par les statuts.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e907f906-f8eb-5287-9576-02c024ac9b23
  title: Parts sociales Mirabelle — pour qui et pour quels usages
  body: 'Les Parts sociales Mirabelle ne sont pas de simples produits d''épargne ;
    elles représentent un titre de propriété au sein de notre banque coopérative.
    Ce produit est conçu pour les clients souhaitant s''impliquer durablement dans
    l''économie locale et participer activement à la gouvernance de leur institution
    financière.


    Pour qui ?

    - Les clients souhaitant devenir sociétaires et disposer d''un droit de vote en
    assemblée générale.

    - Les particuliers et professionnels attachés aux valeurs de proximité et d''inclusion
    financière.

    - Les épargnants recherchant une rémunération stable et un sens éthique à leur
    placement.


    Usages et caractéristiques :

    - Gouvernance : Chaque part acquise vous rapproche du statut de sociétaire, vous
    permettant d''influencer les orientations stratégiques de Crédit Mirabelle.

    - Investissement accessible : Avec un prix unitaire de 15 €, l''entrée dans le
    capital de la banque est ouverte à tous.

    - Performance : Les parts sont rémunérées au taux de 2,1 %, offrant ainsi un rendement
    régulier sur le capital investi.


    Ce produit est idéal pour diversifier son patrimoine tout en soutenant un modèle
    bancaire démocratique. Il s''adresse à ceux qui acceptent une liquidité moindre
    en échange d''un pouvoir de décision et d''un engagement communautaire.


    Pour une gestion quotidienne complémentaire, nous vous recommandons de consulter
    la fiche Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — présentation.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 9400f9b6-13ac-525b-ae69-d3c983c61e4c
  title: 'Parts sociales Mirabelle — rémunération des parts sociales au titre de 2025
    : explications'
  body: 'Découvrez les détails concernant la rémunération de vos parts sociales pour
    l''année 2025.


    Quel est le taux de rémunération applicable pour 2025 ?

    Le taux de rémunération des Parts sociales Mirabelle pour l''exercice 2025 est
    fixé à 2,1 %. Ce taux s''applique à l''ensemble des parts détenues par nos sociétaires.


    Comment est calculé le montant de ma rémunération ?

    Le calcul est basé sur le nombre de parts que vous possédez, multiplié par le
    prix unitaire de 15 €, puis appliqué au taux de 2,1 %. Par exemple, pour 100 parts
    (soit un investissement de 1 500 €), la rémunération brute sera de 31,50 € pour
    l''année.


    Quand et comment recevrai-je ces fonds ?

    La rémunération est généralement versée après la clôture de l''exercice et la
    validation des comptes par l''assemblée générale. Elle est créditée directement
    sur votre compte courant associé.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: de476a98-36d7-58b8-b0d1-5913e6cbb177
  title: Parts sociales Mirabelle — résilier, clôturer ou changer de formule
  body: 'Le retrait du capital d''une coopérative diffère d''une clôture de compte
    classique, car vos parts représentent une part du capital de Crédit Mirabelle.
    Voici la procédure pour demander le remboursement de vos Parts sociales Mirabelle.


    Avant de commencer :

    Assurez-vous d''avoir connaissance du nombre exact de parts que vous détenez et
    de votre solde actuel. Notez que le remboursement est soumis à l''accord du conseil
    d''administration conformément aux statuts.


    Étapes de résiliation :

    1. Exprimez votre volonté de vous retirer de la coopérative et demandez le remboursement
    de vos parts sociales.

    2. Nous vous demanderons de confirmer votre identité via notre processus de vérification
    KYC pour sécuriser l''opération.

    3. Nous analyserons votre demande au regard des règles de liquidité de la banque
    et des statuts de la coopérative.

    4. Nous vous confirmerons l''acceptation du remboursement et le montant total,
    calculé sur la base du prix unitaire de 15 € par part.

    5. Nous procéderons au virement des fonds sur votre compte courant Crédit Mirabelle.


    Comment savoir si l''opération a réussi ?

    Vous recevrez un avis de clôture de vos parts sociales et constaterez le crédit
    du montant correspondant sur votre relevé bancaire. Votre statut de sociétaire
    et vos droits de vote en assemblée générale prendront fin immédiatement après
    le paiement.


    Si vous souhaitez simplement modifier le montant de vos parts sans quitter la
    coopérative, demandez-nous une augmentation de capital pour acquérir de nouvelles
    parts au prix de 15 € l''unité.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c01f78ab-6abf-535e-965e-1b997ee6b858
  title: Parts sociales Mirabelle — frais ou montant inattendu
  body: 'En tant qu''agent, vous pouvez être sollicité par un sociétaire constatant
    un écart entre le montant attendu de sa rémunération ou le solde de ses parts
    et la réalité de son relevé.


    Symptôme : « Je pense avoir reçu un montant incorrect pour mes dividendes » ou
    « Le solde de mes parts ne correspond pas à mes versements ».


    Causes probables :

    - Erreur de calcul du client basée sur un taux erroné (le taux actuel est de 2,1
    %).

    - Oubli du prix unitaire de la part (15 €) dans le calcul du capital total.

    - Prise en compte d''un versement récent non encore capitalisé.

    - Fiscalité appliquée sur la rémunération perçue.


    Procédure de vérification :

    1. Vérifiez le nombre de parts détenues par le client dans son dossier.

    2. Multipliez ce nombre par 15 € pour confirmer le capital investi.

    3. Appliquez le taux de rémunération de 2,1 % sur ce capital pour obtenir le montant
    brut attendu.

    4. Comparez ce résultat avec le montant effectivement versé sur le compte courant
    du client.


    Résolution :

    - Si l''écart est dû à une incompréhension du client, expliquez-lui le calcul
    détaillé (Nombre de parts × 15 € × 2,1 %).

    - Si une erreur de calcul institutionnelle est confirmée, ouvrez un ticket de
    régularisation interne pour rectifier le versement.


    Escalade :

    Si le sociétaire conteste la valeur nominale de ses parts ou les décisions de
    l''assemblée générale concernant la rémunération, transmettez le dossier à la
    direction d''agence pour un arbitrage avant l''intervention éventuelle du médiateur
    de la banque.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: a672a3d5-f1dc-5620-9ed6-2e07b1e1173f
  title: Parts sociales Mirabelle — justificatifs à fournir
  body: 'Pour devenir sociétaire de Crédit Mirabelle et acquérir des parts sociales,
    la présentation des documents suivants est obligatoire pour valider votre identité
