- id: 19c09dfd-1f91-53ed-99ee-c221bfe546c3
  title: Prêt immobilier à taux fixe Mirabelle — problèmes d'accès ou de connexion
  body: 'Il peut arriver que vous rencontriez des difficultés pour consulter les détails
    de votre Prêt immobilier à taux fixe Mirabelle via nos interfaces numériques.


    **Symptôme : Le solde restant dû ou le tableau d''amortissement n''est pas visible.**

    - **Cause probable** : Votre session a expiré ou vos données d''identité nécessitent
    une mise à jour réglementaire (KYC).

    - **Vérification** : Vérifiez si vous avez reçu une notification nous demandant
    de mettre à jour vos justificatifs d''identité.

    - **Solution** : Effectuez une nouvelle authentification forte. Si le problème
    persiste, demandez-nous de vérifier le statut de votre dossier d''identité.


    **Symptôme : Erreur lors de la tentative de simulation de remboursement anticipé.**

    - **Cause probable** : Une modification du contrat est en cours ou le compte est
    temporairement restreint pour raison de sécurité.

    - **Vérification** : Vérifiez si vous avez récemment soumis une demande de modification
    de conditions.

    - **Solution** : Nous pouvons débloquer l''accès après une nouvelle vérification
    d''identité rigoureuse.


    **Quand escalader le problème ?**

    Si l''accès reste impossible après authentification et vérification KYC, nous
    ouvrirons un ticket d''incident technique. Nous vous informerons dès que le service
    sera rétabli. En attendant, vous pouvez demander à votre conseiller en agence
    un relevé papier de votre situation.


    Pour toute question sur la sécurité de vos accès, consultez "Prêt immobilier à
    taux fixe Mirabelle — bonnes pratiques de sécurité du compte".'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f4e3b5c8-25c6-526c-9bb3-8ceba0ce713d
  title: Prêt immobilier à taux fixe Mirabelle — niveaux d'accès
  body: 'Ce tableau définit les critères d''éligibilité pour l''octroi du Prêt immobilier
    à taux fixe Mirabelle. Ces seuils sont stricts et conformes aux directives de
    l''ACPR.


    | Critère | Condition d''éligibilité | Résultat / Décision |

    | :--- | :--- | :--- |

    | **Taux d''endettement** | ≤ 35 % | Dossier admissible pour analyse de solvabilité
    |

    | **Taux d''endettement** | > 35 % | Demande refusée (non conforme aux règles
    de sécurité) |

    | **Durée du prêt** | ≤ 25 ans | Option de taux fixe applicable (3,35 % ou
    3,55 %) |

    | **Durée du prêt** | > 25 ans | Demande irrecevable (dépassement de la durée
    maximale) |

    | **Identité (KYC)** | Dossier complet et vérifié | Accès au déblocage des fonds
    autorisé |

    | **Identité (KYC)** | Dossier incomplet | Blocage temporaire jusqu''à fourniture
    des pièces |

    | **Capacité financière** | Solvabilité confirmée | Octroi du prêt après délai
    de réflexion de 10 jours |'
