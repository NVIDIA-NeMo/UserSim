- id: 20618674-db8d-548a-8cda-2e68cf545c43
  title: Livret A — informations réglementaires
  body: 'Ce document détaille le cadre réglementaire régissant le Livret A au sein
    de Crédit Mirabelle. Ces informations sont essentielles pour l''accompagnement
    des clients par nos agents de support.


    **Nature du produit**

    Le Livret A est un compte d''épargne réglementé. Cela signifie que ses caractéristiques
    (taux, plafond, fiscalité) sont définies par l''État et s''appliquent de manière
    identique dans tous les établissements bancaires. Crédit Mirabelle s''engage à
    respecter strictement ces directives.


    **Protection des dépôts**

    Conformément aux directives de l''ACPR et de la Banque de France, les fonds déposés
    sur le Livret A sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR). Cette garantie couvre les avoirs jusqu''à 100 000 € par client et par
    banque, assurant ainsi la sécurité totale de vos économies même en cas de défaillance
    de l''établissement.


    **Conformité et Transparence**

    Nous appliquons une politique de transparence totale sur les coûts. Le Livret
    A ne génère aucun frais pour le client. Toute opération modifiant l''état du compte
    nécessite une authentification forte et une vérification d''identité rigoureuse,
    conformément aux normes KYC en vigueur.


    **Fiscalité**

    Les intérêts crédités sur le Livret A sont totalement exonérés d''impôt sur le
    revenu et de prélèvements sociaux. Aucun prélèvement n''est effectué par Crédit
    Mirabelle sur les intérêts produits au taux de 1,7 %.


    **Limites réglementaires**

    Le plafond de 22 950 € est une limite légale. Tout versement dépassant ce seuil
    est interdit. Le non-respect de la règle d''unicité (un seul Livret A par personne)
    peut entraîner la clôture forcée du compte par les autorités.


    Pour les modalités contractuelles détaillées, veuillez vous référer au document
    Livret A — conditions générales.'
  domain: retail_banking
  product_category: livret_a
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 59ca2b51-48e5-5242-9755-774208828956
  title: Livret A — grille des taux
  body: 'Voici la grille tarifaire appliquée aux intérêts du Livret A chez Crédit
    Mirabelle.


    **Taux de rémunération**

    - **Taux nominal annuel** : 1,7 %

    - **Taux applicable** : Ce taux est unique et s''applique à l''ensemble des soldes,
    quel que soit le montant déposé, dans la limite du plafond de 22 950 €.


    **Modalités d''application**

    - **Calcul** : Les intérêts sont calculés par quinzaines. Un versement produit
    des intérêts à compter du 1er ou du 16 du mois. Un retrait cesse de produire des
    intérêts le 1er ou le 16 du mois suivant.

    - **Capitalisation** : Les intérêts sont calculés tout au long de l''année et
    sont versés globalement sur le compte à la fin de l''année civile (31 décembre).


    **Évolution du taux**

    Le taux de 1,7 % est fixé par l''État. Il peut être révisé à tout moment par décret
    gouvernemental. Crédit Mirabelle s''engage à répercuter tout changement de taux
    immédiatement après sa publication officielle.'
  domain: retail_banking
  product_category: livret_a
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
