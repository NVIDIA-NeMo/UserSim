- id: 7a566725-d8e8-54d6-b36e-322bb3d2c43e
  title: Parts sociales Mirabelle — éligibilité et souscription
  body: 'Vous souhaitez devenir acteur de votre banque ? Voici les réponses aux questions
    les plus fréquentes sur l''accès aux Parts sociales Mirabelle.


    Qui peut souscrire à des parts sociales ?

    Tout client particulier de Crédit Mirabelle peut devenir sociétaire en acquérant
    des parts sociales. Cela vous permet de participer à la gouvernance locale de
    notre banque.


    Combien coûte une part sociale ?

    Le prix d''une part sociale est fixé à 15 €. Vous pouvez souscrire au nombre de
    parts que vous souhaitez, en fonction de vos capacités financières.


    Comment s''effectue la souscription ?

    La souscription se fait après vérification de votre identité. Nous débiterons
    votre compte courant du montant total (nombre de parts x 15 €) pour valider votre
    entrée au capital.


    Quel est l''avantage financier immédiat ?

    En plus de votre droit de vote, vos parts sont rémunérées au taux de 2,1 %, offrant
    ainsi un rendement sur vos apports au capital.'
