- id: abbf36f0-3a1a-5014-b05a-dfe1190149b2
  title: Parts sociales Mirabelle — confidentialité et protection des données
  body: "La détention de Parts sociales Mirabelle implique la collecte et le traitement\
    \ de données spécifiques, nécessaires au fonctionnement de notre modèle coopératif\
    \ et à la conformité réglementaire.\n\nTraitement des données de gouvernance :\n\
    En devenant sociétaire, vos informations d'identité et le nombre de parts détenues\
    \ sont inscrits dans le registre des sociétaires. Ces données sont utilisées pour\
    \ l'organisation des assemblées générales, l'envoi des convocations et le décompte\
    \ des voix. Conformément au RGPD, nous garantissons que ces informations ne sont\
    \ jamais cédées à des tiers à des fins commerciales.\n\nProtection des avoirs\
    \ et conformité :\nNous opérons dans le strict respect des directives de l'ACPR\
    \ et de la Banque de France. La protection de vos titres est assurée par le Fonds\
    \ de Garantie des Dépôts et de Résolution (FGDR), qui couvre vos avoirs jusqu'à\
    \ 100 000 € par client. \n\nTransparence et accès :\nVous disposez d'un droit\
    \ d'accès et de rectification de vos données personnelles. Toute demande de modification\
    \ de vos informations de contact ou d'état civil doit être accompagnée d'un justificatif\
    \ d'identité conforme aux normes KYC. Nous appliquons l'authentification forte\
    \ avant toute communication d'informations sensibles concernant vos parts.\n\n\
    Nous nous engageons à une transparence totale sur les coûts et la valeur de vos\
    \ titres. Le prix de la part sociale est maintenu à 15 € et la rémunération actuelle\
    \ de 2,1 % est communiquée ouvertement à l'ensemble des membres. Le respect du\
    \ Code monétaire et financier est le pilier de notre gestion des données et des\
    \ fonds."
  domain: retail_banking
  product_category: parts_sociales
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e85d0fd0-cb56-59e7-8e0d-98524ed48f2f
  title: Parts sociales Mirabelle — reconnaître les arnaques visant ce produit
  body: 'La nature coopérative des Parts sociales Mirabelle et leur taux de rémunération
    de 2,1 % peuvent attirer l''attention de personnes malveillantes. Afin de protéger
    vos avoirs, nous vous appelons à la plus grande vigilance face aux tentatives
    d''escroquerie.


    Les arnaques les plus courantes prennent souvent la forme de messages (SMS, emails)
    ou d''appels téléphoniques prétendant provenir de Crédit Mirabelle. Les fraudeurs
    peuvent utiliser les leviers suivants :

    - La promesse d''un rendement exceptionnel, bien supérieur au taux réel de 2,1
    %, pour vous inciter à investir davantage.

    - L''urgence fallacieuse, vous demandant de transférer des fonds rapidement pour
    « sécuriser » vos parts ou profiter d''une offre limitée.

    - La demande d''informations confidentielles, comme vos codes d''accès ou vos
    secrets de sécurité, sous prétexte de mettre à jour votre dossier de sociétaire.


    Sachez que Crédit Mirabelle ne vous demandera jamais vos mots de passe, vos codes
    secrets ou la validation d''une opération par téléphone ou par message. Toute
    modification de vos données personnelles nécessite une vérification d''identité
    rigoureuse selon les normes KYC avant toute action.


    Si vous constatez une opération suspecte ou si vous avez communiqué des informations
    sensibles, informez-nous immédiatement. Nous traitons les fraudes avec diligence
    et garantissons le remboursement des opérations non autorisées selon les délais
    légaux. Pour rappel, vous disposez d''un délai de 13 mois pour contester une opération
    mal exécutée ou non autorisée.


    Pour plus d''informations sur la sécurisation de vos autres comptes, vous pouvez
    consulter le document : Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) — bonnes pratiques de sécurité du compte.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1880a606-8097-52da-aeec-2343f56d783a
  title: Parts sociales Mirabelle — plafonds, restrictions et cas particuliers
  body: "Ce document est destiné aux conseillers pour l'accompagnement des clients\
    \ souhaitant devenir sociétaires de Crédit Mirabelle.\n\nLes Parts sociales Mirabelle\
    \ représentent un titre de propriété permettant au client de participer activement\
    \ à la gouvernance démocratique de notre banque coopérative. Contrairement aux\
    \ dépôts classiques, elles constituent un apport au capital.\n\nCaractéristiques\
    \ et restrictions financières :\n- Prix unitaire : Chaque part sociale est acquise\
    \ au prix fixe de 15 €.\n- Rémunération : Les parts sont rémunérées au taux de\
    \ 2,1 %.\n- Minimum de souscription : L'acquisition d'une seule part (15 €) suffit\
    \ pour obtenir la qualité de sociétaire et le droit de vote en assemblée générale.\n\
    \nRestrictions de liquidité et transferts :\nLes parts sociales ne sont pas liquides\
    \ au même titre qu'un livret. Leur cession est soumise aux règles statutaires\
    \ de la coopérative. Le remboursement des parts sociales intervient généralement\
    \ après demande du sociétaire, sous réserve de l'agrément des organes de direction\
    \ et des capacités de remboursement de la banque.\n\nCas particuliers et conformité\
    \ :\nL'acquisition de parts sociales doit être précédée d'une vérification rigoureuse\
    \ de l'identité (KYC). Aucun changement de données ou souscription ne peut être\
    \ effectué sans une validation d'identité conforme. \n\nIl est crucial de préciser\
    \ au client que, contrairement aux comptes de dépôts protégés par le FGDR jusqu'à\
    \ 100 000 € par client, les parts sociales sont des titres de capital et ne bénéficient\
    \ pas de cette garantie spécifique. Le risque est lié à la solvabilité de l'institution\
    \ coopérative."
  domain: retail_banking
  product_category: parts_sociales
  document_type: product_sheet
