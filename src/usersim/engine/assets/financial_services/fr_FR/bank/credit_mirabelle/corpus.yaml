- id: 4d930dba-7514-574c-b94a-fd8f6ca76b0d
  title: Parts sociales Mirabelle — souscrire et activer
  body: 'Devenir Sociétaire du Crédit Mirabelle est une démarche simple qui marque
    votre engagement dans notre modèle coopératif. Voici les étapes pour souscrire
    et activer vos parts sociales.


    Avant de commencer, assurez-vous de disposer d''un compte courant ouvert au sein
    de notre établissement et d''avoir une pièce d''identité valide à disposition
    pour la vérification KYC (Know Your Customer).


    1. Manifestez votre intention : Indiquez-nous votre souhait de souscrire à des
    Parts sociales Mirabelle. Précisez le nombre de parts souhaitées (chaque part
    ayant un coût de 15 €).

    2. Vérification d''identité : Nous procéderons à une vérification rigoureuse de
    votre identité conformément aux normes de sécurité. Si vos données ne sont pas
    à jour, nous vous demanderons de nous fournir un justificatif d''identité officiel.

    3. Règlement du capital : Nous effectuerons le prélèvement du montant total (nombre
    de parts × 15 €) depuis votre compte courant vers le compte de capital de la banque.

    4. Validation et confirmation : Une fois le paiement validé, nous enregistrons
    vos titres de propriété. Vous recevrez une confirmation officielle de votre nouveau
    statut de Sociétaire.

    5. Activation des droits : Vos droits de vote en assemblée générale et votre droit
    à la rémunération (actuellement au taux de 2,1 %) sont activés immédiatement après
    la validation de la souscription.


    L''opération est réussie lorsque vous voyez apparaître vos parts sociales dans
    le détail de vos avoirs et que vous recevez votre certificat de sociétaire.


    Si vous hésitez encore sur le choix de ce produit, nous vous recommandons de consulter
    le document Parts sociales Mirabelle — face à un produit similaire de l''établissement.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
