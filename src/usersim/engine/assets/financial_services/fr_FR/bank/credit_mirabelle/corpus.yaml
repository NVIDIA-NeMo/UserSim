- id: 076b6caf-48b8-5795-a40c-811b8c0c9f13
  title: Parts sociales Mirabelle — modification des conditions
  body: 'Le présent document détaille les modalités de modification des conditions
    régissant la détention des Parts sociales Mirabelle. En tant que banque coopérative,
    notre gouvernance assure une transparence totale sur l''évolution de vos titres.


    1. Évolution de la rémunération : Le taux de rémunération des parts sociales,
    actuellement fixé à 2,1 %, est déterminé annuellement en fonction des résultats
    de l''institution et des décisions de l''assemblée générale. Nous nous engageons
    à vous informer de tout changement de taux avec un préavis raisonnable avant son
    application.


    2. Modification du prix unitaire : Le prix d''une part sociale est fixé à 15 €.
    Toute modification de cette valeur nominale ou d''ajout de primes d''émission
    serait soumise à l''approbation des organes de gouvernance et vous serait notifiée
    par écrit.


    3. Modalités de cession et rachat : Contrairement à un compte d''épargne classique,
    les parts sociales ne sont pas liquides immédiatement. Leur rachat est conditionné
    par la capacité financière de la banque et le respect des statuts coopératifs.
    Une demande de retrait doit être formulée selon les délais prévus dans les statuts,
    et nous traiterons celle-ci avec diligence tout en préservant l''équilibre financier
    de l''institution.


    4. Engagements réciproques : Le sociétaire s''engage à respecter les principes
    de gouvernance démocratique. De notre côté, nous garantissons l''application stricte
    du Code monétaire et financier et le traitement équitable de chaque membre, quel
    que soit le nombre de parts détenues.


    Tout manquement aux obligations de conformité ou aux normes KYC peut entraîner
    la suspension des droits liés aux parts sociales jusqu''à régularisation complète
    de l''identité du détenteur.'
  domain: retail_banking
  product_category: parts_sociales
