- id: 4c7b1975-0194-567f-9c2a-ce5a9e972e00
  title: 'Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    taux du découvert autorisé : explications'
  body: 'Question : Quel est le taux applicable lorsque mon compte devient débiteur
    dans la limite de mon découvert autorisé ?

    Réponse : Pour le Compte courant et Formule Essentielle (carte à débit immédiat
    incluse), le taux du découvert autorisé est de 15,9 %. Ce taux représente le coût
    du crédit que nous vous accordons lorsque vos dépenses excèdent le solde disponible
    sur votre compte.


    Question : Comment ce taux est-il calculé ?

    Réponse : Le taux de 15,9 % est appliqué annuellement sur le montant moyen du
    découvert utilisé et pour la durée précise durant laquelle le compte est resté
    débiteur.


    Pour plus de détails sur les frais liés aux incidents de paiement, vous pouvez
    consulter Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — commission d''intervention : explications.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6cb18581-190e-565a-b772-3ce09cfd14c0
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    résilier, clôturer ou changer de formule
  body: 'Si vos besoins évoluent, vous pouvez demander la clôture de votre compte
    ou modifier votre formule d''abonnement. Voici la marche à suivre.


    **Pour changer de formule (montée ou descente en gamme) :**

    1. Informez-nous de votre souhait de modifier votre offre actuelle. Nous analyserons
    ensemble si une autre formule est plus adaptée à votre profil.

    2. Nous vous confirmerons la nouvelle tarification applicable et la date d''effet
    du changement.

    3. Vous recevrez une confirmation écrite de la mise à jour de votre contrat.


    **Pour clôturer définitivement votre compte :**

    1. Assurez-vous que le solde de votre Compte courant et Formule Essentielle (carte
    à débit immédiat incluse) est suffisant pour couvrir les dernières opérations
    en cours, ou qu''il est nul.

    2. Demandez-nous la clôture du compte. Nous vous demanderons alors de confirmer
    votre identité selon nos normes de sécurité.

    3. Si vous possédez une carte à débit immédiat, nous vous demanderons de nous
    la restituer ou d''attester sur l''honneur de sa destruction.

    4. Nous procéderons au virement du solde restant vers un autre compte dont vous
    nous aurez fourni le RIB.

    5. Vous recevrez un avis de clôture définitive confirmant la fin de la relation
    contractuelle pour ce produit.


    Pour comparer cette offre avec d''autres options avant de décider, consultez Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) — choisir entre
    les formules.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
