- id: d7638b33-1113-513e-b293-b1169420da2a
  title: Prêt immobilier à taux fixe Mirabelle — prise en main pas à pas
  body: 'Ce guide est destiné aux conseillers pour accompagner le client dans la souscription
    du Prêt immobilier à taux fixe Mirabelle. Le processus doit être transparent et
    bienveillant, en limitant le jargon technique.


    Étape 1 : Analyse de la faisabilité

    Vérifiez le profil du client. Le critère fondamental est le respect du taux d''endettement
    maximal, qui ne doit pas excéder 35 %. Calculez la capacité de remboursement en
    incluant toutes les charges actuelles.


    Étape 2 : Choix de la durée et du taux

    Présentez les deux options de taux fixes disponibles selon la durée souhaitée
    :

    - Pour un prêt sur 20 ans : le taux applicable est de 3,35 %.

    - Pour un prêt sur 25 ans (durée maximale autorisée) : le taux applicable est
    de 3,55 %.


    Étape 3 : Information sur les coûts

    Informez systématiquement le client sur les frais d''application, qui s''élèvent
    à 1 000 €. Expliquez que ces frais reflètent le coût réel du montage du dossier
    et la sécurisation des opérations.


    Étape 4 : Constitution du dossier et KYC

    Collectez les pièces justificatives nécessaires. L''authentification forte et
    la vérification rigoureuse de l''identité sont obligatoires avant toute action
    modifiant l''état d''un compte.


    Étape 5 : Offre et délai de réflexion

    Émettez l''offre de prêt. Rappelez au client qu''il dispose d''un délai de réflexion
    obligatoire de dix jours avant de signer l''offre. Nous n''engageons jamais l''octroi
    d''un crédit avant l''analyse complète de la solvabilité.


    Étape 6 : Finalisation

    Une fois l''offre acceptée et le délai expiré, procédez au déblocage des fonds
    après validation finale par la direction d''agence.'
