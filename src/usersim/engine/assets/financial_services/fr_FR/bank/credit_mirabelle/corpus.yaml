- id: 597adc6b-31aa-5d3f-88ce-981800136557
  title: Carte Mirabelle Premier — informations sur les risques
  body: 'L''utilisation de la Carte Mirabelle Premier s''inscrit dans le respect strict
    du Code monétaire et financier et des directives de l''ACPR. Nous tenons à informer
    nos clients sur les risques et protections associés à ce produit.


    Protection des dépôts : Les fonds déposés sur le compte courant associé à votre
    carte sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR)
    jusqu''à un montant de 100 000 € par client et par banque. Cette garantie assure
    la sécurité de vos avoirs même en cas de défaillance de l''établissement.


    Risques liés aux opérations : L''utilisation d''une carte à débit immédiat ou
    différé expose le titulaire au risque de découvert si le solde du compte est insuffisant
    pour couvrir les paiements et les frais. Nous rappelons que la cotisation annuelle
    de 132 € et la commission de 1,5 % sur les paiements hors zone euro sont des frais
    contractuels qui impactent le solde de votre compte.


    Conformité et Lutte contre le Blanchiment : Conformément à la réglementation,
    Crédit Mirabelle effectue des contrôles rigoureux sur l''origine des fonds et
    la destination des flux financiers. Des opérations atypiques, notamment celles
    atteignant fréquemment le plafond de 8 000 € sur 30 jours, peuvent faire l''objet
    de demandes de justificatifs complémentaires.


    Traitement des litiges : En cas d''opération non autorisée, nous nous engageons
    à rembourser les sommes débitées selon les délais légaux, sous réserve de la déclaration
    du sinistre dans les temps. Le délai maximum pour contester une opération est
    de 13 mois.


    Nous ne fournissons aucun conseil fiscal ou juridique individualisé dans le cadre
    de la mise à disposition de ce moyen de paiement.'
  domain: cards
  product_category: carte_premier
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f895ec53-906a-5d4d-9f0f-d1d48bdbeb53
  title: Carte Mirabelle Premier — calcul et application des taux
  body: 'La Carte Mirabelle Premier applique un taux unique pour les opérations de
    paiement internationales, sans distinction de palier de dépense ou de profil de
    client.


    Commission de paiement hors zone euro : 1,5 %


    Application du taux :

    Ce taux est appliqué sur le montant brut de la transaction converti dans la devise
    de paiement. Le calcul s''effectue au moment du traitement de l''opération par
    le réseau interbancaire.


    Exemple de calcul :

    Pour un achat d''un montant de 1 000 € effectué dans une devise étrangère, la
    commission s''élève à 15 € (1 000 € x 1,5 %). Le montant total débité sur le compte
    du client sera donc de 1 015 €.


    Ce taux est fixe pour l''ensemble des détenteurs de la Carte Mirabelle Premier.
    Il peut être révisé annuellement par la direction, sous réserve d''une information
    préalable des clients conformément aux conditions générales. Les retraits d''espèces
    ne sont pas soumis à ce taux de 1,5 %, mais suivent la grille tarifaire standard
    de l''établissement.'
  domain: cards
  product_category: carte_premier
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0723a5ab-d991-59cc-b64f-696e962189b8
  title: Carte Mirabelle Premier — offre de parrainage et de fidélité
  body: 'Nous avons le plaisir de vous présenter notre programme de parrainage dédié
    à la Carte Mirabelle Premier. Devenue l''alliée des clients recherchant une plus
    grande liberté financière, cette carte se distingue notamment par un plafond de
    paiement sur 30 jours s''élevant à 8 000 € et un plafond de retrait sur 7 jours
    de 1 500 €.


    Du 1er octobre 2024 au 31 décembre 2024, pour chaque nouveau membre rejoignant
    notre coopérative grâce à votre recommandation et souscrivant à la Carte Mirabelle
    Premier, nous créditons votre compte d''une prime de fidélité de 50 €. Le nouveau
    client parrainé bénéficie, pour sa première année, d''une réduction de 50 % sur
    la cotisation annuelle, ramenant celle-ci de 132 € à 66 €.


    C''est l''occasion idéale de faire découvrir à vos proches la qualité de nos services
    et la transparence de notre modèle. Pour en profiter, il vous suffit de nous indiquer
    le nom de la personne que vous souhaitez parrainer lors de son premier rendez-vous
    en agence ou via votre conseiller habituel.'
  domain: cards
  product_category: carte_premier
  document_type: promo_notice
  source_authority: official
