- id: 386d70ae-f7aa-519a-bf5c-784e4e94f513
  title: Livret d'épargne populaire (LEP) — souscrire et activer
  body: "La souscription au Livret d'épargne populaire (LEP) nécessite la vérification\
    \ de votre éligibilité fiscale. Voici la procédure pas à pas pour activer votre\
    \ compte.\n\n**Prérequis**\nAvant de débuter, vous devez disposer de votre dernier\
    \ avis d'imposition pour justifier que votre revenu fiscal de référence pour une\
    \ part ne dépasse pas 23 028 €.\n\n**Étapes de souscription**\n1. Communiquez-nous\
    \ votre volonté d'ouvrir un LEP et présentez votre avis d'imposition récent. Nous\
    \ procédons alors à la vérification rigoureuse de votre identité conformément\
    \ aux normes KYC.\n2. Effectuez le versement initial minimum de 30 €. Ce montant\
    \ peut être transféré depuis l'un de vos comptes Crédit Mirabelle ou via un virement\
    \ externe.\n3. Nous validons la conformité de vos revenus avec les plafonds réglementaires.\
    \ Une fois cette vérification effectuée, nous créons votre compte.\n4. Nous vous\
    \ confirmons l'activation du livret par une notification numérique ou un courrier,\
    \ précisant vos identifiants de compte.\n\n**Confirmation de succès**\nLe processus\
    \ est réussi lorsque vous constatez l'apparition du livret dans votre interface\
    \ numérique avec un solde initial d'au moins 30 €. Vous pouvez alors effectuer\
    \ des versements complémentaires jusqu'à atteindre le plafond de 10 000 €. \n\n\
    Si vous hésitez avec un autre produit d'épargne moins restrictif, nous vous suggérons\
    \ de consulter le document Livret d'épargne populaire (LEP) — face à un produit\
    \ similaire de l'établissement pour comparer les avantages."
  domain: retail_banking
