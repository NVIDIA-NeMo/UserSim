- id: f2ae8b8a-029f-5b33-892e-c173ad35ce31
  title: Parts sociales Mirabelle — coûts et frais
  body: 'Voici les réponses aux questions les plus fréquentes concernant les aspects
    financiers des Parts sociales Mirabelle.


    Combien coûte l''acquisition d''une part sociale ?

    Le prix d''une part sociale est fixé à 15 €. Vous pouvez souscrire au nombre de
    parts que vous souhaitez, selon vos objectifs d''investissement et votre volonté
    de participation.


    Quels sont les frais de gestion associés à la détention de parts ?

    L''acquisition et la détention de parts sociales Mirabelle ne génèrent aucun frais
    de gestion annuel. Notre modèle coopératif privilégie la transparence et l''inclusion
    financière.


    Quelle est la rémunération offerte pour cet investissement ?

    Les parts sociales sont rémunérées à un taux de 2,1 %. Cette rémunération reflète
    la performance de notre modèle coopératif et est créditée selon les modalités
    définies lors de l''assemblée générale.


    Est-ce que mon investissement est protégé ?

    Oui, vos avoirs sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) jusqu''à 100 000 € par client.'
