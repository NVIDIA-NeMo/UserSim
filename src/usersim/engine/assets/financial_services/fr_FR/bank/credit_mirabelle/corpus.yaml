- id: 58afa9a3-ccbd-5cb1-825c-8ca75224f9e0
  title: Carte Mirabelle Premier — plafonds, restrictions et cas particuliers
  body: "Ce document est destiné aux conseillers pour accompagner les clients dans\
    \ la compréhension des limites techniques de la Carte Mirabelle Premier. \n\n\
    La Carte Mirabelle Premier offre des capacités de dépenses et de retrait supérieures\
    \ aux cartes standards, afin d'assurer une plus grande liberté financière à nos\
    \ sociétaires et clients.\n\nLes plafonds applicables sont les suivants :\n- Plafond\
    \ de paiement : Le montant maximal des paiements autorisés est de 8 000 € sur\
    \ une période glissante de 30 jours. Ce plafond concerne l'ensemble des transactions\
    \ par paiement (boutiques, internet, etc.).\n- Plafond de retrait : Le montant\
    \ maximal des retraits d'espèces est de 1 500 € sur une période glissante de 7\
    \ jours. \n\nIl est important de préciser au client que ces plafonds sont dits\
    \ « glissants ». Par exemple, pour le retrait, le calcul ne se fait pas du lundi\
    \ au dimanche, mais sur les 7 derniers jours précédant la transaction. Si le plafond\
    \ est atteint, l'opération sera refusée même si le solde du compte est suffisant.\n\
    \nConcernant l'usage international, la Carte Mirabelle Premier permet des paiements\
    \ hors zone euro. Ces opérations sont soumises à des frais de paiement hors zone\
    \ euro s'élevant à 1,5 % du montant de la transaction. \n\nEnfin, nous rappelons\
    \ que toute modification de ces plafonds nécessite une authentification forte\
    \ et une vérification d'identité conforme aux normes KYC avant toute validation\
    \ par nos services. Pour une vue d'ensemble des coûts, vous pouvez vous référer\
    \ à la document Carte Mirabelle Premier — coûts et frais."
  domain: cards
  product_category: carte_premier
