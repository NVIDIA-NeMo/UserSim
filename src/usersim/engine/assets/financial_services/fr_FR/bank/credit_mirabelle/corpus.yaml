    Éligible |

    | Capacité financière | Disposer d''un montant minimum de 15 € | Éligible |

    | Identité | Validation KYC complète et documents à jour | Éligible |

    | Nombre de parts | Souscription d''au moins 1 part entière | Accès au statut
    de Sociétaire |

    | Résidence | Résider dans la zone d''implantation locale de la banque | Priorité
    d''accès |


    Tout client remplissant ces critères peut souscrire aux parts sociales et participer
