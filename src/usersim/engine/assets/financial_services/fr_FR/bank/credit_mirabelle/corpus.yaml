- id: c1007623-c5fe-5cb5-9179-4af0896a4b49
  title: Parts sociales Mirabelle — prise en main pas à pas
  body: 'Ce guide est destiné aux conseillers pour accompagner un client dans l''acquisition
    de Parts sociales Mirabelle et son intégration comme sociétaire.


    L''objectif est de transformer un client particulier en membre actif de la coopérative,
    en respectant les étapes de conformité et de souscription suivantes :


    Étape 1 : Vérification de l''identité et conformité

    Avant toute action, effectuez une vérification rigoureuse de l''identité du client.
    Assurez-vous que le dossier KYC est à jour. Aucun changement d''état ou souscription
    ne peut être validé sans une pièce d''identité valide et un justificatif de domicile
    récent.


    Étape 2 : Définition de l''investissement

    Expliquez au client que le prix unitaire d''une part est de 15 €. Aidez-le à déterminer
    le nombre de parts souhaité en fonction de son profil et de sa capacité financière.
    Rappelez-lui que le taux de rémunération actuel est de 2,1 %.


    Étape 3 : Explication des droits du sociétaire

    Précisez que la détention d''au moins une part sociale confère le statut de sociétaire.
    Ce statut donne droit à une voix lors des assemblées générales, conformément à
    notre modèle de gouvernance démocratique.


    Étape 4 : Exécution financière

    Procédez au transfert des fonds depuis le compte courant du client vers le capital
    social de la banque. Le montant total doit correspondre exactement au nombre de
    parts multiplié par 15 €.


    Étape 5 : Confirmation et remise des titres

    Une fois l''opération validée, remettez au client son attestation de détention
    de parts sociales. Confirmez-lui l''inscription au registre des sociétaires.


    En cas de question sur la gestion quotidienne des comptes associés, vous pouvez
    vous référer au document Compte courant et Formule Essentielle (carte à débit
    immédiat incluse) — présentation.'
