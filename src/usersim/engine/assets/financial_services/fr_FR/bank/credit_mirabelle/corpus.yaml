- id: fcab0e97-4f73-5b68-ae09-2fc7d613d4a0
  title: Parts sociales Mirabelle — choisir entre les formules
  body: "Choisir entre la détention de parts sociales et un produit d'épargne classique\
    \ dépend de vos objectifs de disponibilité et d'engagement.\n\nLes Parts sociales\
    \ Mirabelle sont idéales pour ceux qui souhaitent s'impliquer dans la vie de leur\
    \ banque. Au prix de 15 € la part, elles offrent une rémunération de 2,1 % et,\
    \ surtout, un droit de vote. Cependant, elles sont moins liquides qu'un livret,\
    \ car leur rachat dépend des règles de la coopérative.\n\nÀ l'inverse, le Livret\
    \ A offre une liquidité immédiate et une exonération fiscale, mais ne permet aucune\
    \ influence sur la gouvernance de l'établissement. \n\nEn résumé :\n- Optez pour\
    \ les Parts sociales Mirabelle si vous recherchez un investissement stable avec\
    \ un impact démocratique et une rémunération de 2,1 %.\n- Optez pour le Livret\
    \ A si vous avez besoin d'un accès instantané à vos fonds pour des imprévus.\n\
    \nPour plus de détails sur l'épargne liquide, consultez le document Livret A —\
    \ présentation."
