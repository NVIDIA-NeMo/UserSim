  institution_id: credit_mirabelle
- id: 0c95a4dd-df23-59f3-b330-a4cb7a119c5d
  title: Parts sociales Mirabelle — opération refusée ou bloquée
  body: 'Il peut arriver qu''une demande de souscription ou de rachat de parts sociales
    soit refusée ou bloquée. Voici les causes possibles et les solutions pour résoudre
    la situation.


    Symptôme : Vous tentez d''acquérir ou de céder des parts sociales, mais l''opération
    est rejetée.


    Causes probables :

    - Dossier KYC non à jour : L''authentification forte et la vérification d''identité
    sont obligatoires. Si vos documents d''identité sont expirés, toute action modifiant
    l''état de vos titres est bloquée.

    - Solde insuffisant : Pour une souscription, votre compte doit être provisionné
    d''au moins 15 € par part souhaitée.

    - Restrictions statutaires : Le rachat de parts sociales dépend des règles de
    la coopérative et de la disponibilité des fonds de la banque. Un rachat peut être
    refusé si les conditions de liquidité ne sont pas réunies.


    Procédure de résolution :

    1. Vérifiez la validité de vos pièces d''identité. Si elles sont obsolètes, transmettez-nous
    un scan de vos documents à jour pour mise en conformité KYC.

    2. Contrôlez le solde de votre compte courant. Assurez-vous que le montant nécessaire
    (nombre de parts x 15 €) est disponible.

    3. Sollicitez un entretien avec votre conseiller pour comprendre si le blocage
    est lié à une règle de gouvernance spécifique à la coopérative.


    En cas de persistance du problème, nous ouvrirons un dossier d''incident. Votre
    demande sera alors escaladée vers la direction d''agence pour une analyse approfondie
    des motifs du refus. Vous recevrez une notification écrite expliquant la décision
    finale.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 765e1fd1-9dc4-5b85-a9bf-b91d53222d13
  title: Parts sociales Mirabelle — quand changer ou monter en gamme
  body: 'Ce guide aide le conseiller à orienter le client vers la qualité de sociétaire.


    Le passage d''un statut de simple client à celui de sociétaire via les Parts sociales
    Mirabelle est recommandé dans les cas suivants :

    - Volonté d''engagement : Le client souhaite influencer la gestion de sa banque
    et participer aux assemblées générales.

    - Recherche de rendement stable : Le client accepte de bloquer des fonds en échange
    d''une rémunération de 2,1 %, souvent plus attractive que celle d''un compte courant.


    Comparaison avec le Livret A :

    - Liquidité : Le Livret A offre une disponibilité immédiate des fonds. Les parts
    sociales (15 € l''unité) sont moins liquides et soumises aux règles de la coopérative.

    - Objectif : Le Livret A est une épargne de précaution. Les parts sociales sont
    un investissement dans la gouvernance de l''institution.


    L''offre est idéale pour le client fidèle souhaitant ancrer durablement sa relation
    avec Crédit Mirabelle. Elle est moins adaptée pour un client ayant besoin d''une
    épargne disponible instantanément.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 921473b2-3bce-5908-a369-3365ae8a3632
  title: Parts sociales Mirabelle — comparaison avec les alternatives et quand ne
    pas le choisir
  body: 'Choisir les Parts sociales Mirabelle, c''est opter pour un modèle de banque
    coopérative où vous n''êtes plus seulement client, mais copropriétaire. Cependant,
    ce produit répond à des besoins spécifiques et ne convient pas à toutes les stratégies
    financières.


    Analyse comparative :


    1. Face au Livret A ou au LEP :

    Le Livret A et le LEP sont des produits d''épargne réglementée, totalement liquides
    et exonérés d''impôts. Les Parts sociales Mirabelle, avec leur rémunération de
    2,1 %, offrent une perspective de rendement et un pouvoir de décision. Cependant,
    contrairement aux livrets, les fonds investis dans les parts sociales ne sont
    pas disponibles immédiatement ; leur rachat est soumis aux conditions de la coopérative.


    2. Face au compte courant :

    Le compte courant est l''outil de gestion quotidienne. Placer des fonds dans des
    parts sociales (au prix de 15 € la part) permet de valoriser une épargne dormante
    tout en soutenant l''inclusion financière et la proximité de votre agence.


    Quand NE PAS choisir les Parts sociales Mirabelle :

    - Besoin de liquidité immédiate : Si vous devez pouvoir retirer vos fonds en quelques
    heures pour faire face à un imprévu, privilégiez le Livret A.

    - Aversion totale au risque de capital : Bien que Crédit Mirabelle soit une institution
    solide, les parts sociales sont des titres de capital. Elles ne sont pas protégées
    par le FGDR (contrairement aux dépôts jusqu''à 100 000 €). Si la sécurité absolue
    du capital via une garantie d''État est votre priorité unique, ce produit n''est
    pas le plus adapté.

    - Absence d''intérêt pour la gouvernance : Si vous ne souhaitez pas participer
    aux décisions de la banque, la rémunération de 2,1 % peut être trouvée sur d''autres
    supports plus liquides.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f48e4131-b5d5-5c65-a20a-3f0f0e990345
  title: Parts sociales Mirabelle — mode d'emploi pas à pas
  body: 'Vous détenez des Parts sociales Mirabelle ? Voici comment utiliser vos droits
    et comprendre vos gains.


    Comment exercer mon droit de vote ?

    En tant que sociétaire, vous êtes invité chaque année à l''assemblée générale.
    Votre voix est comptabilisée selon le principe démocratique de la coopérative,
    indépendamment du nombre de parts détenues.


    Comment est versée la rémunération de 2,1 % ?

    La rémunération est calculée annuellement sur la base de vos parts détenues. Elle
    est créditée sur votre compte courant après validation des résultats par l''assemblée
    générale.


    Est-il possible d''augmenter ma participation ?

    Oui, vous pouvez souscrire à de nouvelles parts à tout moment, au prix de 15 €
    par part, après validation de votre identité par nos services.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 9048f66f-81aa-590e-be93-9d8fb110b92f
  title: Parts sociales Mirabelle — traiter une demande courante de bout en bout
  body: 'L''adhésion à la coopérative Crédit Mirabelle est un processus simple et
    transparent. Voici les étapes pour souscrire à des parts sociales et devenir sociétaire.


    Éléments requis : Un compte courant ouvert chez Crédit Mirabelle et une pièce
    d''identité valide.


    1. Exprimez votre volonté de devenir sociétaire : Indiquez-nous le nombre de parts
    sociales que vous souhaitez acquérir. Chaque part a un coût fixe de 15 €.

    2. Validation de l''identité (KYC) : Nous procéderons à une vérification rigoureuse
    de vos documents d''identité. Cette étape est obligatoire pour toute modification
    de l''état d''un compte ou souscription de titres, conformément aux normes de
    sécurité de l''établissement.

    3. Règlement des parts : Nous débiterons votre compte courant du montant total
    correspondant (nombre de parts x 15 €). Si le solde est insuffisant, l''opération
    sera bloquée jusqu''à provisionnement.

    4. Confirmation de la souscription : Nous vous remettrons un certificat de détention
    de parts sociales. Ce document officialise votre qualité de sociétaire et vos
    droits de vote.

    5. Activation des droits : Vous êtes désormais éligible à la rémunération annuelle
    de 2,1 % et vous recevrez les convocations pour les prochaines assemblées générales.


    Vous avez maintenant toutes les clés pour participer activement à la vie de votre
    banque coopérative. Pour toute question sur la gestion quotidienne de vos fonds,
    vous pouvez consulter : Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) — présentation.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: aeb4185c-58f6-5e57-bd18-430a8b88879b
  title: Parts sociales Mirabelle — écart avec vos relevés
  body: 'Ce document guide le conseiller dans la résolution d''un litige concernant
    le solde ou la rémunération des parts sociales d''un client.


    Symptôme : Le client signale que le montant de sa rémunération ou le nombre de
    parts indiqué sur son relevé ne correspond pas à ses attentes.


    Causes possibles et vérifications :

    1. Décalage de date de valeur : Vérifiez si la souscription a été effectuée après
    la date de clôture des comptes annuels. Une part acquise tardivement ne percevra
    la rémunération de 2,1 % qu''au prorata ou l''année suivante.

    2. Confusion entre capital et intérêts : Assurez-vous que le client ne confond
    pas le capital investi (nombre de parts x 15 €) avec la rémunération versée.

    3. Opérations de rachat en cours : Vérifiez si une demande de cession de parts
    a été initiée. Les parts en cours de rachat peuvent disparaître du relevé avant
    que les fonds ne soient crédités sur le compte courant.


    Procédure de correction :

    - Réaliser un rapprochement historique : Reprenez tous les relevés depuis la souscription
    initiale pour identifier le moment où l''écart est apparu.

    - Calcul de contrôle : Recalculez manuellement la rémunération (Montant total
    des parts x 2,1 %) et comparez-la au montant versé.

    - Régularisation : Si une erreur matérielle est confirmée, effectuez le crédit
    correctif sur le compte courant du client.


    Si l''écart persiste et que le client conteste la validité d''une opération, rappelez-lui
    qu''il dispose d''un délai de 13 mois pour contester une opération mal exécutée.
    Si aucune solution n''est trouvée au niveau de l''agence, le dossier devra être
    transmis au médiateur de la banque.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: cbe6f60e-2d1a-5118-96bb-890faceaa69e
  title: Frais et tarifs de l'établissement
  body: 'Chez Crédit Mirabelle, nous nous engageons à une transparence totale concernant
    nos tarifs, lesquels reflètent le coût réel des services rendus et la sécurisation
    de vos opérations.


    Certains frais s''appliquent à l''ensemble de nos comptes, indépendamment du produit
    choisi. C''est notamment le cas des commissions d''intervention, appliquées lors
    d''une opération entraînant un dépassement du découvert autorisé. Ces frais sont
    plafonnés à 8 € par opération et 80 € par mois.


    Fidèles à notre mission d''inclusion financière, nous proposons une offre spécifique
    dédiée aux clients en situation de fragilité financière. Cette offre permet de
    limiter l''impact des frais d''incidents, avec une facturation plafonnée à 3 €
    par mois au plus.


    Pour les frais liés à un produit spécifique (comme la cotisation d''une carte
    ou les frais de dossier d''un prêt), nous vous invitons à consulter la grille
    tarifaire propre à chaque offre. Notre approche garantit que chaque sociétaire
    et client bénéficie d''un traitement équitable et d''une visibilité complète sur
    ses coûts bancaires.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 02a66156-36c4-5053-8206-27ff36ead96a
  title: Questions fréquentes
  body: 'Comment puis-je contacter Crédit Mirabelle pour obtenir de l''aide ?

    Nous sommes à votre disposition via nos agences physiques, notre centre d''appels
    ainsi que notre interface numérique. Nos services suivent les horaires du fuseau
    CET.


    Quelle est la procédure si je souhaite faire remonter une demande non résolue
    ?

    Nous avons mis en place un processus d''escalade clair pour garantir votre satisfaction
    : votre demande est d''abord traitée par votre conseiller, puis peut être transmise
    à la direction d''agence, et enfin, si nécessaire, au médiateur de la banque.


    Mes dépôts sont-ils sécurisés au sein de votre institution ?

    Oui, nous respectons strictement les directives de l''ACPR et de la Banque de
    France. Vos avoirs sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) jusqu''à 100 000 € par client et par banque.


    Où puis-je trouver des informations sur les frais appliqués à mon compte ?

    Vous pouvez consulter le document Frais et tarifs de l''établissement pour les
    frais généraux ou la grille tarifaire spécifique à votre produit.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 8a822c08-fc7f-52b5-bc04-d89951a97c3a
  title: 'Notes réglementaires : banque au quotidien'
  body: 'La gestion des comptes de dépôt et des services de paiement au sein de Crédit
    Mirabelle est régie par une conformité stricte aux directives de l''ACPR, de la
    Banque de France et au Code monétaire et financier. L''agent a l''obligation d''appliquer
    ces règles sans exception pour garantir la sécurité des fonds et la protection
    des clients.


    Protection des dépôts

    Conformément à la réglementation européenne et nationale, les dépôts des clients
    sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR). Cette
    garantie couvre les avoirs jusqu''à un montant de 100 000 € par client et par
    banque. L''agent doit pouvoir confirmer cette protection lors de questions relatives
    à la sécurité des fonds.


    Sécurité et Vérification d''Identité

    L''authentification forte et la vérification rigoureuse de l''identité sont obligatoires
    avant toute action modifiant l''état d''un compte ou avant la communication d''informations
    sensibles. Aucun changement de données personnelles ou bancaires ne doit être
    effectué sans une validation d''identité conforme aux normes KYC (Know Your Customer).
    L''agent ne doit jamais outrepasser cette étape, même en cas de demande insistante
    du client.


    Traitement des contestations

    En vertu du cadre légal, les clients disposent d''un délai de 13 mois pour contester
    une opération mal exécutée ou non autorisée. L''agent doit traiter ces demandes
    avec diligence et informer le client des délais légaux de remboursement pour les
    opérations non autorisées.


    Éthique et Transparence

    Le traitement équitable des clients est un pilier de notre approche. L''agent
    doit s''assurer que les coûts sont présentés de manière transparente, sans jargon
    technique inutile, ou en expliquant systématiquement les termes complexes pour
    permettre un consentement éclairé du client.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e32b051f-420c-5891-a45b-24c71994955e
  title: 'Notes réglementaires : cartes bancaires'
  body: 'L''émission et la gestion des cartes bancaires chez Crédit Mirabelle sont
    strictement encadrées pour prévenir la fraude et protéger les utilisateurs. L''agent
    doit veiller au respect des obligations suivantes :


    Authentification et Sécurité

    L''utilisation de l''authentification forte est impérative pour les opérations
    sensibles. Avant toute action relative à une carte (comme le gel d''une carte,
    la demande de remplacement ou la modification de plafonds), l''agent doit obligatoirement
    procéder à une vérification rigoureuse de l''identité du titulaire conformément
    aux normes KYC. Aucune action ne peut être entreprise sur la base d''une simple
    déclaration sans preuve d''identité validée.


    Gestion des opérations non autorisées

    Nous nous engageons à traiter les fraudes avec la plus grande diligence. Conformément
    aux délais légaux, Crédit Mirabelle garantit le remboursement des opérations non
    autorisées. L''agent doit accompagner le client dans le signalement rapide de
    l''incident pour limiter les risques.


    Délais de contestation

    Tout titulaire de carte dispose d''un délai légal de 13 mois pour contester une
    opération qu''il juge mal exécutée ou non autorisée. L''agent doit informer le
    client de ce droit et l''orienter vers la procédure de dispute appropriée.


    Obligations d''information

    L''agent doit être transparent sur les frais liés aux cartes, notamment les commissions
    d''intervention en cas de dépassement du découvert autorisé (plafonnées à 8 €
    par opération et 80 € par mois). Toute modification des conditions tarifaires
    doit être communiquée au client selon les modalités réglementaires en vigueur.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: d288bb9f-87de-556b-a01d-6380c9e3099e
  title: 'Notes réglementaires : crédits et prêts immobiliers'
  body: 'L''octroi de crédits immobiliers au sein de Crédit Mirabelle est soumis aux
    règles prudentielles du Code monétaire et financier et aux directives de l''ACPR.
    L''agent doit impérativement respecter les frontières d''intervention suivantes
    :


    Analyse de la Solvabilité

    L''agent ne doit jamais engager l''octroi d''un crédit, ni donner d''accord de
    principe ferme, avant l''analyse complète de la solvabilité du demandeur. Cette
    analyse doit inclure l''étude des revenus, des charges et le respect des ratios
    d''endettement maximaux autorisés. La minimisation du coût total du prêt est formellement
    interdite ; l''agent doit présenter le coût réel, incluant les intérêts et les
    frais annexes.


    Délai de Réflexion

    Conformément à la loi, tout emprunteur immobilier bénéficie d''un délai de réflexion
    obligatoire de dix jours. L''emprunteur ne peut accepter l''offre de prêt avant
    l''expiration de ce délai de réflexion. L''agent doit s''assurer que le client
    a bien compris cette période durant laquelle il peut réfléchir avant de signer
    son engagement.


    Limites du Conseil

    Bien que nous fournissions une éducation financière et des recommandations de
    produits basées sur le profil du client, l''agent ne doit jamais donner de conseils
    fiscaux ou juridiques individualisés. Pour toute question spécifique sur la fiscalité
    immobilière ou le droit de la famille, le client doit être orienté vers un professionnel
    qualifié (notaire, avocat ou conseiller fiscal).


    Transparence des Coûts

    L''agent doit présenter l''offre de prêt de manière exhaustive, en détaillant
    le taux fixe, la durée du crédit et le montant total dû par l''emprunteur. Toute
    omission volontaire ou présentation trompeuse du coût total du crédit constitue
    un manquement grave aux règles de conformité de l''établissement.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 47c713a4-8b26-5672-802b-b57e590e156f
  title: Quand utiliser get_account_transactions
  body: 'L''outil get_account_transactions est le mécanisme faisant foi pour consulter
    l''historique financier d''un client. Il doit être utilisé dès que le client souhaite
    vérifier un montant, identifier la date d''une opération, ou confirmer la réception
    d''un virement.


    Procédure d''utilisation :


    1. Vérification de l''identité : Avant toute action, l''agent doit utiliser l''outil
    verify_identity pour s''assurer que l''interlocuteur est bien le titulaire du
    compte ou un mandataire autorisé.

    2. Identification du compte : Si le client ne fournit que les derniers chiffres
    de son compte, l''agent doit appeler l''outil get_accounts pour résoudre l''identifiant
    interne (account_id) correspondant au client vérifié.

    3. Extraction des données : Une fois l''account_id obtenu, l''agent appelle l''outil
    get_account_transactions. L''agent doit ensuite transmettre les informations pertinentes
    au client (date, libellé et montant de l''opération).


    Cas d''usage fréquents :

    - Le client signale un écart avec ses relevés et souhaite vérifier les dernières
    opérations.

    - Le client demande si un prélèvement spécifique a été débité.

    - L''agent doit identifier une transaction précise avant d''initier une procédure
    de contestation via file_transaction_dispute.


    L''agent ne doit jamais demander au client de fournir lui-même la liste des transactions
    s''il a accès à cet outil, afin de garantir l''exactitude des informations traitées.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: credit_mirabelle
- id: e135c8e4-9a37-5eef-ac51-f108a5f6c20e
  title: Référence de l'outil get_account_transactions
  body: 'L''outil get_account_transactions permet à l''agent de récupérer la liste
    des opérations récentes enregistrées sur un compte spécifique.


    Signature de l''outil :

    get_account_transactions(account_id)


    Arguments :

    - account_id : L''identifiant unique du compte bancaire, obtenu préalablement
    via l''outil get_accounts.


    Effet : L''outil retourne un historique détaillé des transactions, incluant la
    date, le libellé de l''opération et le montant débité ou crédité.


    L''agent effectue cette action en appelant l''outil directement dans l''interface
    de conversation après avoir vérifié l''identité du client. L''agent ne doit pas
    rediriger le client vers un portail externe pour consulter ces informations s''il
    a la possibilité d''utiliser cet outil.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: credit_mirabelle
- id: 968fe00c-c818-59dd-92af-77fd99293c8b
  title: Quand utiliser file_transaction_dispute
  body: 'L''outil file_transaction_dispute est utilisé pour enregistrer une contestation
    formelle concernant une opération bancaire. Cette procédure s''applique aux opérations
    mal exécutées ou non autorisées.


    Conditions préalables :

    - Le client doit être dans le délai légal de contestation, qui est de 13 mois
    après la date de l''opération.

    - L''identité du client doit être impérativement vérifiée via verify_identity.


    Procédure d''utilisation :


    1. Identification du compte : L''agent utilise get_accounts pour obtenir l''account_id
    du client.

    2. Identification de la transaction : L''agent appelle get_account_transactions
    pour localiser précisément l''opération contestée et récupérer son identifiant
    unique (transaction_id).

    3. Collecte du motif : L''agent demande au client d''expliquer la raison de la
    contestation (ex: montant erroné, achat non effectué).

    4. Enregistrement de la dispute : L''agent appelle l''outil file_transaction_dispute
    en renseignant l''account_id, le transaction_id et le motif détaillé.


    Après l''appel de l''outil, l''agent doit informer le client que sa demande est
    prise en compte et qu''elle sera traitée avec diligence, conformément aux délais
    légaux de remboursement pour les opérations non autorisées.


    L''agent peut vérifier l''avancement du dossier ultérieurement en utilisant l''outil
    dispute_status.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: credit_mirabelle
- id: d1e12448-28ba-561a-a909-3d817bb60231
  title: Référence de l'outil file_transaction_dispute
  body: 'L''outil file_transaction_dispute permet d''initier une procédure de contestation
    pour une opération spécifique sur un compte.


    Signature de l''outil :

    file_transaction_dispute(account_id, transaction_id, reason)


    Arguments :

    - account_id : L''identifiant unique du compte concerné (obtenu via get_accounts).

    - transaction_id : L''identifiant unique de l''opération contestée (obtenu via
    get_account_transactions).

    - reason : La description textuelle du motif de la contestation, fournie par le
    client.


    Effet : L''outil enregistre la demande de dispute dans le système de gestion des
    litiges de la banque pour traitement.


    L''agent effectue cette action en appelant l''outil directement dans la conversation.
    Il ne doit pas demander au client de remplir un formulaire papier ou d''envoyer
    un courrier pour l''ouverture du dossier de dispute.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: credit_mirabelle
- id: 617801b7-b1f6-5907-8169-7231d28d91be
  title: Quand utiliser freeze_card
  body: 'L''outil freeze_card doit être utilisé en urgence dès qu''un client signale
    la perte, le vol ou une utilisation frauduleuse de sa carte bancaire. Le gel immédiat
    est la priorité pour limiter les risques financiers.


    Procédure d''utilisation :


    1. Vérification d''urgence : L''agent procède immédiatement à la vérification
    de l''identité du titulaire via verify_identity. En cas d''urgence absolue, la
    vérification doit être rapide mais rigoureuse.

    2. Identification de la carte : L''agent utilise get_accounts pour identifier
    le compte lié à la carte concernée et obtenir l''identifiant nécessaire.

    3. Blocage de la carte : L''agent appelle l''outil freeze_card pour suspendre
    toutes les opérations futures sur la carte.

    4. Confirmation : L''agent confirme au client que la carte est désormais inactive
    et sécurisée.


    Actions complémentaires :

    - Si la perte ou le vol est définitif, l''agent doit proposer et enregistrer la
    commande d''une nouvelle carte via l''outil order_replacement_card.

    - L''agent doit inviter le client à consulter ses dernières opérations via get_account_transactions
    pour identifier d''éventuelles fraudes ayant déjà eu lieu.

    - Si des opérations non autorisées sont détectées, l''agent doit initier une procédure
    de contestation via file_transaction_dispute, en rappelant que le client dispose
    de 13 mois pour le faire.


    L''agent ne doit jamais rediriger le client vers une application ou un site web
    pour geler sa carte s''il a la capacité d''effectuer l''action via cet outil,
    car chaque seconde compte en cas de fraude.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: credit_mirabelle
- id: a3a2a418-237c-5eea-b67d-079f33b7f662
  title: Référence de l'outil freeze_card
  body: 'L''outil freeze_card permet à l''agent de suspendre immédiatement l''activité
    d''une carte bancaire. Cette action est réversible et est principalement utilisée
    lorsqu''un client a égaré sa carte mais n''est pas certain de l''avoir perdue
    définitivement, évitant ainsi une opposition définitive immédiate.


    L''agent effectue cette opération en appelant directement l''outil avec les paramètres
    suivants :

    - account_id : L''identifiant unique du compte associé à la carte (obtenu via
    l''outil get_accounts).

    - card_id : L''identifiant de la carte à geler.


    L''effet de l''outil est le blocage instantané de toutes les nouvelles transactions
    (paiements et retraits) liées à la carte cible. Le statut de la carte est mis
    à jour dans le système de gestion des moyens de paiement de Crédit Mirabelle.
    L''agent doit confirmer au client que la carte est désormais inactive pour toute
    nouvelle opération.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: credit_mirabelle
- id: 4c7ab29c-c221-5427-a819-e5cc2e14637b
  title: Quand utiliser request_early_repayment
  body: 'Le remboursement anticipé permet à un client détenteur d''un Prêt immobilier
    à taux fixe Mirabelle de solder tout ou partie de son capital restant dû avant
    le terme prévu au contrat. Cette démarche s''inscrit dans notre volonté de transparence
    et d''accompagnement financier.


    L''agent doit suivre rigoureusement la procédure suivante :


    1. Vérification de l''identité : L''agent doit impérativement valider l''identité
    du client via l''outil verify_identity conformément aux normes KYC.

    2. Identification du prêt : Utiliser l''outil get_accounts pour identifier l''identifiant
    unique (loan_id) du Prêt immobilier à taux fixe Mirabelle concerné.

    3. Qualification de la demande : L''agent doit déterminer avec le client s''il
    s''agit d''un remboursement anticipé partiel ou total, et confirmer le montant
    exact souhaité.

    4. Information sur les coûts : L''agent doit rappeler que le remboursement anticipé
    peut engendrer des indemnités conformément aux conditions générales du contrat,
    sans toutefois minimiser le coût total restant du prêt.

    5. Exécution : Une fois les modalités validées, l''agent appelle l''outil request_early_repayment
    en précisant le loan_id, le montant et le type de remboursement (total ou partiel).


    L''agent ne doit jamais engager l''institution sur un montant d''indemnité précis
    sans une analyse complète du dossier par la direction d''agence.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_early_repayment
  institution_id: credit_mirabelle
- id: cd70a38f-0750-58c9-8165-aee7ad39ef0c
  title: Référence de l'outil request_early_repayment
  body: 'L''outil request_early_repayment est utilisé pour enregistrer une demande
    formelle de remboursement anticipé, partiel ou total, d''un Prêt immobilier à
    taux fixe Mirabelle. L''agent déclenche l''action en appelant l''outil directement
    dans la conversation.


    Les arguments requis sont :

    - loan_id : L''identifiant unique du prêt immobilier (obtenu via get_accounts).

    - amount : Le montant exact en € que le client souhaite rembourser.

    - repayment_type : La nature du remboursement, soit ''TOTAL'' pour solder le prêt,
    soit ''PARTIAL'' pour réduire le capital.


    L''effet de l''outil est de créer une demande de remboursement dans le système
    de gestion des crédits. Cette demande déclenche le calcul des indemnités de remboursement
    anticipé (IRA) et l''édition d''un échéancier mis à jour qui sera communiqué au
    client par son conseiller en agence.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_early_repayment
  institution_id: credit_mirabelle
- id: d0876bd2-d30b-50f2-8e61-486be653337f
  title: Quand utiliser change_borrower_insurance
  body: 'Conformément à la législation en vigueur, les clients ayant souscrit un Prêt
    immobilier à taux fixe Mirabelle peuvent substituer l''assurance emprunteur initialement
    choisie par un contrat externe, à condition que ce dernier offre des garanties
    équivalentes.


    L''agent doit suivre les étapes suivantes :


    1. Vérification de l''identité : Procéder à la vérification rigoureuse de l''identité
    du client via l''outil verify_identity.

    2. Localisation du prêt : Utiliser l''outil get_accounts pour obtenir le loan_id
    du prêt immobilier concerné.

    3. Collecte des informations : L''agent doit demander au client les coordonnées
    du nouvel assureur et le numéro de police du contrat externe.

    4. Transmission du dossier : L''agent doit informer le client qu''une analyse
    de l''équivalence des garanties sera effectuée par nos services avant validation
    finale.

    5. Enregistrement : L''agent appelle l''outil change_borrower_insurance en renseignant
    le loan_id, le nom du nouvel assureur et le numéro de contrat.


    L''agent ne fournit aucun conseil juridique ou fiscal individualisé concernant
    le choix de l''assurance et doit rediriger le client vers un courtier ou un assureur
    pour l''analyse comparative des contrats.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_borrower_insurance
  institution_id: credit_mirabelle
- id: 8869d655-aaa9-50aa-a217-3a570904297d
  title: Référence de l'outil change_borrower_insurance
  body: 'L''outil change_borrower_insurance permet d''enregistrer une demande de substitution
    de l''assurance emprunteur d''un prêt immobilier par un contrat externe. L''agent
    effectue l''action en appelant l''outil directement.


    Les arguments nécessaires sont :

    - loan_id : L''identifiant du prêt immobilier concerné (obtenu via get_accounts).

    - insurance_provider : Le nom complet de la compagnie d''assurance externe choisie
    par le client.

    - policy_number : Le numéro de contrat/police de l''assurance externe.


    L''effet de l''outil est l''ouverture d''un dossier de substitution. Le système
    notifie le service des crédits qui procédera à l''examen de la conformité des
    garanties. Le client sera informé de l''acceptation ou du refus de la substitution
    après analyse technique du contrat.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_borrower_insurance
  institution_id: credit_mirabelle
- id: 21dfa320-fafc-5a7c-bf13-c34de0b40ec3
  title: Quand utiliser modulate_loan_payments
  body: 'La modulation des échéances permet aux clients d''un Prêt immobilier à taux
    fixe Mirabelle d''ajuster le montant de leurs mensualités à la hausse ou à la
    baisse, afin d''adapter le prêt à l''évolution de leur situation financière, dans
    les limites prévues au contrat.


    La procédure à suivre est la suivante :


    1. Vérification de l''identité : Validation obligatoire de l''identité du client
    via l''outil verify_identity.

    2. Identification du prêt : Utilisation de l''outil get_accounts pour récupérer
    le loan_id du prêt.

    3. Analyse des limites : L''agent doit vérifier dans les conditions du contrat
    les plages de modulation autorisées (montant minimum et maximum de la mensualité).

    4. Recueil du nouveau montant : L''agent convient avec le client du nouveau montant
    mensuel souhaité.

    5. Exécution : L''agent appelle l''outil modulate_loan_payments en précisant le
    loan_id et le nouveau montant de la mensualité.


    L''agent doit informer le client que toute modulation peut impacter la durée totale
    du crédit ou le coût total du prêt, et qu''il ne doit en aucun cas minimiser cet
    impact financier.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - modulate_loan_payments
  institution_id: credit_mirabelle
- id: b6596995-433c-588a-a0b8-2a1c81744ead
  title: Référence de l'outil modulate_loan_payments
  body: 'L''outil modulate_loan_payments est utilisé pour augmenter ou réduire les
    mensualités d''un Prêt immobilier à taux fixe Mirabelle. L''agent effectue l''action
    en appelant l''outil directement.


    Les arguments requis sont :

    - loan_id : L''identifiant unique du prêt immobilier (obtenu via get_accounts).

    - new_monthly_amount : Le nouveau montant de la mensualité souhaité, exprimé en
    €.


    L''effet de l''outil est de modifier le montant du prélèvement mensuel pour les
    prochaines échéances, sous réserve de respect des seuils contractuels. Le système
    recalcule automatiquement la date de fin du prêt en fonction du nouveau montant,
    et un avenant ou un avis de modification est envoyé au client.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - modulate_loan_payments
  institution_id: credit_mirabelle
- id: c286b218-a5d1-5216-a798-f26e4f6eabdd
  title: Quand utiliser update_beneficiary
  body: 'La gestion des bénéficiaires permet aux clients de mettre à jour la liste
    des comptes tiers vers lesquels ils effectuent des virements, assurant ainsi la
    sécurité et la fluidité de leurs transactions.


    L''agent doit suivre scrupuleusement ces étapes :


    1. Vérification de l''identité : L''authentification forte est obligatoire. L''agent
    utilise l''outil verify_identity avant toute action sur le compte.

    2. Identification du compte : Utiliser l''outil get_accounts pour identifier l''account_id
    du compte courant du client.

    3. Précision de l''action : Déterminer s''il s''agit d''un ajout, d''une modification
    ou d''une suppression de bénéficiaire.

    4. Collecte des données : Pour un ajout ou une modification, l''agent doit recueillir
    le nom complet du bénéficiaire et son IBAN exact.

    5. Exécution : L''agent appelle l''outil update_beneficiary en précisant l''account_id,
    le nom, l''IBAN et le type d''action (ADD, EDIT, DELETE).


    L''agent doit rappeler au client que pour des raisons de sécurité et de conformité
    KYC, tout changement de bénéficiaire peut être soumis à un délai de carence avant
    le premier virement.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: credit_mirabelle
- id: 2ad167ee-cbf4-5b93-8205-6d703b0948cc
  title: Référence de l'outil update_beneficiary
  body: 'L''outil update_beneficiary permet d''ajouter, de modifier ou de supprimer
    un bénéficiaire de virement enregistré sur le compte d''un client. L''agent effectue
    l''opération en appelant l''outil directement.


    Les arguments requis sont :

    - account_id : L''identifiant du compte courant (obtenu via get_accounts).

    - beneficiary_name : Le nom complet du bénéficiaire (tel que déclaré par le client).

    - iban : L''identifiant international du compte bancaire du bénéficiaire.

    - action : L''opération à effectuer, avec les valeurs possibles ''ADD'' (ajouter),
    ''EDIT'' (modifier) ou ''DELETE'' (supprimer).


    L''effet de l''outil est la mise à jour instantanée du carnet d''adresses bancaires
    du client. En cas de suppression (''DELETE''), le bénéficiaire ne sera plus disponible
    pour les futurs ordres de virement.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: credit_mirabelle
- id: dcf865b4-3841-5264-951d-f4020148f9f7
  title: Quand utiliser stop_payment
  body: "L'opposition (stop payment) est une mesure de sécurité permettant d'interrompre\
    \ le paiement d'un chèque égaré ou volé, ou de bloquer un prélèvement SEPA à venir\
    \ pour éviter un débit non souhaité.\n\nL'agent doit appliquer la procédure suivante\
    \ :\n\n1. Vérification de l'identité : Validation rigoureuse de l'identité du\
    \ client via l'outil verify_identity.\n2. Identification du compte : Utiliser\
    \ l'outil get_accounts pour identifier l'account_id concerné.\n3. Qualification\
    \ de l'opposition :\n   - Pour un chèque : Recueillir le numéro du chèque, le\
    \ montant et la date d'émission.\n   - Pour un prélèvement SEPA : Recueillir l'identifiant\
    \ du créancier (ICS) et la date prévue du prélèvement.\n4. Exécution : L'agent\
    \ appelle l'outil stop_payment avec les détails de l'opération à bloquer et l'account_id.\n\
    5. Information client : L'agent doit informer le client des éventuels frais liés\
    \ à l'opposition selon la grille tarifaire applicable.\n\nEn cas de fraude suspectée,\
    \ l'agent doit également orienter le client vers la procédure de contestation\
    \ des opérations non autorisées, rappelant que le délai légal de contestation\
    \ est de 13 mois."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: credit_mirabelle
- id: 607660bd-7447-5a19-9960-47aa0a2c2605
  title: Référence de l'outil stop_payment
  body: 'L''outil stop_payment permet à l''agent d''effectuer une opposition sur un
    instrument de paiement spécifique. Cette action est définitive et sécurise les
    fonds du client en cas de perte, de vol ou de litige sur un prélèvement.


    L''agent exécute cette opération en appelant directement l''outil avec les paramètres
    suivants :

    - Type d''instrument : Préciser s''il s''agit d''un chèque ou d''un prélèvement
    SEPA.

    - Identifiant de l''opération : Pour un chèque, le numéro du chèque ; pour un
    prélèvement, l''IBAN du créancier.

    - Montant : La valeur exacte de l''opération concernée en €.

    - Date : La date d''émission ou de passage prévue de l''opération.


    L''effet immédiat de l''outil est le blocage du paiement concerné. L''agent doit
    informer le client que cette procédure s''inscrit dans notre engagement de transparence
    et de sécurité des opérations, conformément aux normes de Crédit Mirabelle.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: credit_mirabelle
- id: 8dff7c1c-48a6-5171-86a6-c2589b50521b
  title: Quand utiliser manage_authorized_users
  body: 'L''octroi ou le retrait d''une procuration est un acte sensible qui modifie
    les droits d''accès à un compte. Nous utilisons l''outil manage_authorized_users
    pour officialiser la désignation d''un mandataire ou pour mettre fin à son pouvoir
    de signature sur un compte spécifique.


    L''agent doit suivre rigoureusement la procédure suivante :


    1. Vérification de l''identité : Procéder à une authentification forte et rigoureuse
    du titulaire du compte conformément aux normes KYC. Aucune modification de procuration
    ne peut être entreprise sans cette étape préalable.

    2. Identification du compte : Utiliser l''outil get_accounts pour identifier précisément
    l''identifiant du compte (account_id) concerné, en s''appuyant sur les quatre
    derniers chiffres fournis par le client.

    3. Collecte des informations du mandataire : Recueillir les informations complètes
    de la personne concernée : nom complet, date de naissance et coordonnées de contact.

    4. Définition de l''action : Confirmer avec le client s''il s''agit d''ajouter
    un nouvel utilisateur autorisé ou de retirer les accès d''un utilisateur existant.

    5. Exécution : Appeler l''outil manage_authorized_users en renseignant l''identifiant
    du compte, l''action souhaitée (ajout ou retrait) et les détails d''identité du
    mandataire.


    L''agent doit rappeler au client que la responsabilité du titulaire reste engagée
    pour les opérations effectuées par le mandataire. Pour toute question sur la gestion
    quotidienne des comptes, l''agent peut se référer au document Compte courant et
    Formule Essentielle (carte à débit immédiat incluse) — présentation.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: credit_mirabelle
- id: 16770635-33e8-5713-aaab-47c161b0fa40
  title: Référence de l'outil manage_authorized_users
  body: 'L''outil manage_authorized_users est le mécanisme faisant autorité pour modifier
    la liste des personnes habilitées à agir sur un compte bancaire au nom du titulaire.


    L''agent réalise cette action en appelant l''outil avec les arguments suivants
    :

    - account_id : L''identifiant unique du compte, obtenu préalablement via l''outil
    de consultation des comptes.

    - action : La nature de la modification, soit ''ADD'' pour donner une procuration,
    soit ''REMOVE'' pour la supprimer.

    - user_details : Un ensemble comprenant le nom complet, la date de naissance et
    les informations de contact (téléphone, email) du mandataire, tels que fournis
    par le client.


    L''effet de l''outil est la mise à jour immédiate des droits d''accès au compte.
    L''agent ne doit jamais rediriger le client vers un formulaire externe pour cette
    action ; l''appel à l''outil valide la demande dans le cadre de la conversation
    sécurisée.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: credit_mirabelle
- id: 01efb6ad-fdba-509e-97e4-f3c9ab3830fc
  title: Quand utiliser get_accounts
  body: 'L''outil get_accounts est la porte d''entrée fondamentale pour toute action
    sur le patrimoine d''un client. Il permet à l''agent de visualiser l''ensemble
    des produits détenus par le client (comptes courants, livrets, parts sociales)
    et d''obtenir les identifiants techniques (account_id) nécessaires à l''utilisation
    d''autres outils de gestion.


    La procédure d''utilisation est la suivante :


    1. Authentification : L''agent doit impérativement s''assurer que l''identité
    du client est vérifiée. La communication d''informations sensibles ou l''accès
    aux comptes est strictement interdit avant la validation KYC.

    2. Appel de l''outil : L''agent appelle l''outil get_accounts. Cet outil ne nécessite
    pas de paramètres d''entrée, car il récupère automatiquement les comptes liés
    au profil du client actuellement authentifié dans la session.

    3. Analyse des résultats : L''agent identifie le compte concerné par la demande
    du client (par exemple, en comparant le libellé du compte ou les derniers chiffres
    du numéro de compte).

    4. Transition : Une fois l''identifiant du compte récupéré, l''agent peut alors
    procéder à d''autres opérations, comme un virement ou une clôture.


    Il est essentiel de ne jamais divulguer l''intégralité des numéros de compte dans
    la conversation, mais d''utiliser les identifiants internes pour piloter les outils
    suivants.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: credit_mirabelle
- id: 8a6ced9c-1518-5602-b649-fd1f4564d1ee
  title: Référence de l'outil get_accounts
  body: 'L''outil get_accounts permet à l''agent de récupérer la liste exhaustive
    des comptes et produits financiers ouverts au nom du client authentifié.


    L''agent effectue cette action en appelant l''outil directement. Cet outil ne
    prend aucun argument, car il s''appuie sur l''identité de la personne préalablement
    vérifiée durant la session de communication.


    L''outil retourne une liste d''objets contenant pour chaque compte :

    - L''identifiant technique (account_id), indispensable pour toute action ultérieure
    sur le compte.

    - Le type de produit (ex: compte courant, Livret A, LEP).

    - Le solde actuel.

    - Le statut du compte (actif, gelé, clôturé).


    C''est l''outil de référence pour résoudre l''identité d''un compte à partir d''une
    description fournie par le client.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: credit_mirabelle
- id: 3caf81c7-9569-5348-889e-afb89fd3ad36
  title: Quand utiliser open_account
  body: 'L''ouverture d''un nouveau compte est un acte d''engagement mutuel. Nous
    accompagnons le client dans le choix du produit adapté à ses besoins, tout en
    garantissant la conformité aux règles de la Banque de France et de l''ACPR.


    L''agent doit suivre ce processus :


    1. Vérification d''identité : Valider l''identité du demandeur selon les normes
    KYC strictes. L''ouverture de compte est impossible sans une authentification
    complète.

    2. Conseil et éducation financière : Identifier le besoin du client. S''il s''agit
    d''une gestion quotidienne, proposer le Compte courant et Formule Essentielle
    (carte à débit immédiat incluse). S''il s''agit d''une épargne réglementée, orienter
    vers le Livret A ou le Livret d''épargne populaire (LEP) selon les conditions
    d''éligibilité.

    3. Collecte des données : Recueillir les informations nécessaires à l''ouverture
    (nom, adresse, montant du premier versement).

    4. Vérification de la solvabilité : Pour les produits de crédit, l''analyse complète
    de la solvabilité est obligatoire avant tout engagement. Pour un compte de dépôt,
    s''assurer de l''absence d''interdiction bancaire.

    5. Exécution : Appeler l''outil open_account en précisant l''identifiant du produit
    choisi et les détails du compte.


    L''agent doit informer le client que les dépôts sont protégés par le FGDR jusqu''à
    100 000 € par client et par banque.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: credit_mirabelle
- id: eb31be59-a7f9-57db-af3f-aa8037c0747c
  title: Référence de l'outil open_account
  body: 'L''outil open_account permet de créer un nouveau compte bancaire ou un produit
    d''épargne pour le client authentifié.


    L''agent déclenche l''ouverture en appelant l''outil avec les paramètres suivants
    :

    - product_id : L''identifiant technique du produit à ouvrir (ex: ''compte_courant_essentiel'',
    ''livret_a'', ''lep'').

    - account_details : Un objet contenant les informations de configuration du compte,
    notamment le nom du détenteur (confirmé par le client), le montant du dépôt initial
    en €, et la devise (EUR par défaut).


    L''effet de l''outil est la création immédiate du compte dans le système d''information
    de Crédit Mirabelle. L''agent doit confirmer l''ouverture au client et lui communiquer
    les premières étapes d''activation si nécessaire.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: credit_mirabelle
- id: 266067b3-656d-5b4b-8377-622ccf713aa1
  title: Quand utiliser close_account
  body: 'La clôture d''un compte est une opération irréversible qui nécessite une
    vigilance particulière pour éviter tout rejet d''opérations en cours ou perte
    de fonds.


    L''agent doit appliquer la procédure suivante :


    1. Vérification d''identité : Effectuer une authentification forte du client.
    Aucune clôture ne peut être initiée sans validation KYC.

    2. Identification du compte : Utiliser l''outil get_accounts pour obtenir l''identifiant
    technique (account_id) du compte à fermer.

    3. Vérification du solde et des opérations : S''assurer que le solde est nul ou
    identifier le compte de destination pour le transfert du solde restant. Vérifier
    qu''aucun paiement (chèque, prélèvement) n''est en attente de traitement pour
    éviter des commissions d''intervention inutiles.

    4. Confirmation du client : Confirmer explicitement au client que l''action est
    irréversible.

    5. Exécution : Appeler l''outil close_account en renseignant l''identifiant du
    compte concerné.


    L''agent doit informer le client que si le compte était associé à une offre groupée,
    la clôture entraîne la fin des services liés. Pour plus de détails sur la résiliation,
    consulter le document Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) — résilier, clôturer ou changer de formule.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: credit_mirabelle
- id: 7b37116e-10ee-58a3-bbb4-aa57b07552dc
  title: Référence de l'outil close_account
  body: 'L''outil close_account permet de fermer définitivement un compte bancaire
    ou un produit d''épargne.


    L''agent exécute cette action en appelant l''outil avec le paramètre suivant :

    - account_id : L''identifiant unique du compte à clôturer.


    L''effet de l''outil est la fermeture immédiate et irréversible du compte. Le
    compte ne sera plus accessible pour aucune opération. L''agent doit s''assurer
    que le solde a été préalablement apuré ou transféré, car l''outil ne gère pas
    le transfert automatique des fonds. Une fois l''outil appelé, le statut du compte
    passe à ''clôturé'' dans le système.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: credit_mirabelle
- id: 356583f7-2331-5882-8d09-497a76e8c2df
  title: Quand utiliser update_contact_info
  body: 'La mise à jour des coordonnées du client est essentielle pour garantir la
    bonne réception des documents légaux, des relevés et pour maintenir la sécurité
    des alertes de fraude.


    L''agent doit suivre les étapes suivantes :


    1. Vérification d''identité : Procéder à une authentification forte. Le changement
    de données personnelles est une action critique soumise aux normes KYC.

    2. Collecte des nouvelles informations : Demander au client les précisions sur
    les éléments à modifier (adresse postale, numéro de téléphone mobile, adresse
    email).

    3. Validation : Relire les nouvelles coordonnées au client pour éviter toute erreur
    de saisie qui pourrait bloquer l''envoi de documents réglementaires.

    4. Exécution : Appeler l''outil update_contact_info en renseignant les champs
    mis à jour.


    L''agent doit rappeler au client que ces informations sont traitées avec confidentialité,
    conformément aux directives de protection des données et au Code monétaire et
    financier. Pour toute question sur la confidentialité, l''agent peut orienter
    vers le document Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) — confidentialité et protection des données.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: credit_mirabelle
- id: 16f8365d-7065-51cf-ba57-8c1059f02181
  title: Référence de l'outil update_contact_info
  body: 'L''outil update_contact_info permet au conseiller de mettre à jour les coordonnées
    personnelles d''un client dans la base de données de Crédit Mirabelle. L''agent
    effectue cette action en appelant l''outil directement après avoir validé l''identité
    du client conformément aux normes KYC.


    Signature de l''outil :

    update_contact_info(full_name, email, phone_number, address)


    Arguments :

    - full_name : Le nom complet du client tel qu''il doit apparaître dans le dossier.

    - email : L''adresse de courrier électronique mise à jour.

    - phone_number : Le numéro de téléphone mobile ou fixe actuel.

    - address : L''adresse postale complète de résidence.


    Effet : L''outil modifie les informations de contact associées au profil du client.
    Cette action est indispensable pour garantir que les communications institutionnelles
    et les relevés parviennent au bon destinataire. Aucun changement de données n''est
    effectué sans une validation d''identité rigoureuse préalable, assurant ainsi
    la sécurité et la conformité aux directives de l''ACPR.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: credit_mirabelle
- id: 4d72c0e1-63aa-5009-9d6e-cc0747c8ded9
  title: Quand utiliser get_statements
  body: 'Le conseiller utilise l''outil get_statements lorsqu''un client souhaite
    obtenir un historique officiel de ses opérations ou un relevé périodique pour
    justifier de sa situation financière.


    Conformément à notre engagement de transparence et de proximité, nous accompagnons
    le client dans l''accès à ses documents comptables selon la procédure suivante
    :


    1. Vérification de l''identité : Le conseiller doit impérativement procéder à
    l''authentification forte du client. Aucune information sensible, tel qu''un relevé
    de compte, ne peut être communiquée sans une validation d''identité conforme aux
    normes KYC.

    2. Identification du compte : Si le client fournit seulement les derniers chiffres
    de son compte, le conseiller utilise l''outil get_accounts pour identifier l''identifiant
    unique du compte (account_id) correspondant au profil du client.

    3. Définition de la période : Le conseiller demande au client la période concernée
    (date de début et date de fin) pour laquelle le relevé est requis.

    4. Exécution de la demande : Le conseiller appelle l''outil get_statements en
    renseignant l''identifiant du compte et les dates définies.


    Le document généré permet au client de consulter l''intégralité des mouvements
    de fonds. Si le client constate une opération mal exécutée ou non autorisée sur
    son relevé, nous lui rappelons qu''il dispose d''un délai de 13 mois pour contester
    l''opération. Dans ce cas, le conseiller devra alors se référer à la procédure
    de contestation appropriée.


    Nous veillons à ce que l''accès à ces documents soit fluide tout en respectant
    strictement le Code monétaire et financier pour protéger la confidentialité des
    données bancaires.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: credit_mirabelle
- id: 9cfa0c71-3572-5681-beb5-b5619edea1c3
  title: Référence de l'outil get_statements
  body: 'L''outil get_statements est utilisé pour extraire les relevés bancaires d''un
    compte client sur une période donnée. Le conseiller déclenche cette action par
    un appel direct à l''outil après avoir vérifié l''identité du client.


    Signature de l''outil :

    get_statements(account_id, start_date, end_date)


    Arguments :

    - account_id : L''identifiant unique du compte pour lequel le relevé est demandé
    (obtenu via get_accounts).

    - start_date : La date de début de la période souhaitée (format AAAA-MM-JJ).

    - end_date : La date de fin de la période souhaitée (format AAAA-MM-JJ).


    Effet : L''outil génère et restitue le relevé des transactions effectuées sur
    le compte pour la période spécifiée. Ce document est essentiel pour la gestion
    quotidienne du client et pour l''exercice de son droit de contestation sur les
    opérations non autorisées. L''agent doit s''assurer que la période demandée est
    cohérente et que l''accès est autorisé par la vérification d''identité préalable.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: credit_mirabelle
- id: 887345e2-88b5-5615-9fb6-c52a85342be8
  title: Quand utiliser set_alerts
  body: 'Le conseiller utilise l''outil set_alerts pour aider le client à mieux maîtriser
    son budget et à sécuriser son compte en mettant en place des notifications automatiques
    sur des seuils spécifiques.


    La mise en place d''alertes s''inscrit dans notre mission d''éducation financière
    et de bienveillance envers nos sociétaires et clients. La procédure est la suivante
    :


    1. Authentification : Le conseiller doit d''abord effectuer une vérification rigoureuse
    de l''identité du client. L''accès aux paramètres de sécurité et de notification
    du compte nécessite une authentification forte.

    2. Identification du compte : Le conseiller utilise l''outil get_accounts pour
    récupérer l''identifiant technique (account_id) du compte concerné, en se basant
    sur les informations fournies par le client.

    3. Configuration des critères : Le conseiller discute avec le client pour définir
    le type d''alerte souhaité (par exemple, une alerte de solde bas) et le montant
    du seuil déclencheur.

    4. Activation de l''alerte : Le conseiller appelle l''outil set_alerts avec l''identifiant
    du compte, le type d''alerte et la valeur du seuil.


    L''objectif est de limiter l''impact des frais d''incidents, comme les commissions
    d''intervention. Nous encourageons particulièrement les clients en situation de
    fragilité financière à utiliser ce service pour éviter tout dépassement du découvert
    autorisé.


    Une fois l''alerte configurée, le client recevra des notifications via son interface
    numérique ou par SMS, lui permettant de réagir rapidement et de maintenir l''équilibre
    de ses finances.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: credit_mirabelle
- id: 2d207bb8-368e-5fb0-a4f1-a672b09caced
  title: Référence de l'outil set_alerts
  body: 'L''outil set_alerts permet au conseiller de configurer des notifications
    automatiques pour un compte client. L''agent active ce service en appelant l''outil
    directement après la phase de vérification d''identité.


    Signature de l''outil :

    set_alerts(account_id, alert_type, threshold)


    Arguments :

    - account_id : L''identifiant unique du compte sur lequel l''alerte doit être
    appliquée (obtenu via get_accounts).

    - alert_type : La nature de l''alerte (ex: ''solde_minimal'', ''depassement_plafond'').

    - threshold : La valeur numérique déclenchant l''alerte (ex: 50,00 €).


    Effet : L''outil enregistre la règle de notification dans le système de gestion
    du compte. Le client sera alors informé dès que la condition définie (type et
    seuil) sera rencontrée. Cette fonctionnalité renforce la transparence sur les
    coûts et aide le client à prévenir les situations de découvert non autorisé.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: credit_mirabelle
- id: 6e95d5d8-9867-5714-a436-33fd99fe00de
  title: Quand utiliser transfer_funds
  body: 'Le conseiller utilise l''outil transfer_funds pour effectuer un mouvement
    de fonds entre deux comptes, soit pour le compte du client lui-même, soit vers
    un bénéficiaire enregistré.


    Pour garantir la sécurité des opérations et la conformité aux directives de l''ACPR,
    la procédure suivante doit être respectée :


    1. Vérification d''identité : Le conseiller doit obligatoirement réaliser une
    authentification forte du client. Aucun transfert de fonds ne peut être initié
    sans une validation d''identité conforme aux normes KYC.

    2. Identification des comptes : Le conseiller utilise l''outil get_accounts pour
    identifier avec précision l''identifiant du compte source et l''identifiant du
    compte de destination (ou le bénéficiaire concerné).

    3. Validation du montant : Le conseiller confirme avec le client le montant exact
    à transférer ainsi que la devise utilisée.

    4. Exécution du transfert : Le conseiller appelle l''outil transfer_funds en spécifiant
    les identifiants des deux comptes, le montant et la devise.


    Le conseiller doit s''assurer que le compte source dispose des fonds nécessaires
    pour couvrir l''opération. Si le transfert entraîne un dépassement du découvert
    autorisé, le client pourrait être soumis à une commission d''intervention, plafonnée
    à 8 € par opération et 80 € par mois.


    L''agent doit informer le client que l''opération est traitée avec diligence et
    que la confirmation du transfert sera disponible dans son historique de transactions.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: credit_mirabelle
- id: 9ec6b18e-79e1-5902-b34a-fbcf8ba31aac
  title: Référence de l'outil transfer_funds
  body: 'L''outil transfer_funds permet d''effectuer un virement de fonds entre deux
    comptes. L''agent réalise cette opération par un appel direct à l''outil après
    avoir vérifié l''identité du client.


    Signature de l''outil :

    transfer_funds(source_account_id, destination_account_id, amount, currency)


    Arguments :

    - source_account_id : L''identifiant unique du compte débité (obtenu via get_accounts).

    - destination_account_id : L''identifiant unique du compte crédité (obtenu via
    get_accounts).

    - amount : Le montant du transfert (ex: 150,00).

    - currency : La devise du transfert (ex: ''EUR'').


    Effet : L''outil déplace la somme spécifiée du compte source vers le compte de
    destination de manière instantanée ou selon les délais interbancaires en vigueur.
    Cette action modifie l''état des deux comptes et génère une écriture comptable
    dans l''historique des transactions.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: credit_mirabelle
- id: e9a9cdcc-0fbf-5e15-9f1e-66f83c6f840e
  title: Quand utiliser order_replacement_card
  body: 'Le conseiller utilise l''outil order_replacement_card lorsqu''un client signale
    la perte, le vol ou la détérioration physique de sa carte bancaire, ou lorsqu''une
    carte arrive à expiration.


    La sécurité des moyens de paiement étant une priorité absolue, la procédure suivante
    est appliquée :


    1. Vérification d''identité : L''authentification forte et la vérification rigoureuse
    de l''identité sont obligatoires. Aucun remplacement de carte ne peut être initié
    sans validation KYC.

    2. Mise en opposition : Si la carte a été perdue ou volée, le conseiller doit
    d''abord utiliser l''outil freeze_card pour bloquer immédiatement tout usage frauduleux.

    3. Identification du produit : Le conseiller utilise l''outil get_accounts pour
    identifier le compte associé et l''identifiant de la carte à remplacer (card_id),
    qu''il s''agisse d''une carte à débit immédiat liée au Compte courant et Formule
    Essentielle (carte à débit immédiat incluse) ou d''une Carte Mirabelle Premier.

    4. Commande de la nouvelle carte : Le conseiller appelle l''outil order_replacement_card
    en précisant l''identifiant du compte, celui de la carte et le motif du remplacement.


    Le conseiller informe le client que la nouvelle carte sera expédiée à l''adresse
    postale enregistrée dans son dossier. Si l''adresse a changé, le conseiller doit
    utiliser l''outil update_contact_info avant de commander la carte.


    Nous rappelons au client que la protection des dépôts est assurée via le FGDR
    jusqu''à 100 000 € par client, garantissant ainsi la sécurité de ses avoirs même
    en cas d''incident sur ses moyens de paiement.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: credit_mirabelle
- id: 9ef9f786-e804-5f11-9562-4efabb1a266c
  title: Référence de l'outil order_replacement_card
  body: 'L''outil order_replacement_card permet de déclencher l''émission d''une nouvelle
    carte bancaire pour remplacer une carte existante. L''agent effectue cet appel
    directement après la vérification d''identité.


    Signature de l''outil :

    order_replacement_card(account_id, card_id, reason)


    Arguments :

    - account_id : L''identifiant du compte associé à la carte (obtenu via get_accounts).

    - card_id : L''identifiant unique de la carte à remplacer.

    - reason : Le motif du remplacement (ex: ''perte'', ''vol'', ''usure'', ''expiration'').


    Effet : L''outil annule la validité de l''ancienne carte (si ce n''est pas déjà
    fait) et commande la fabrication d''une nouvelle carte avec un nouveau numéro
    et un nouveau code. La carte est ensuite envoyée par voie postale à l''adresse
    du client. Cette action assure la continuité du service tout en maintenant un
    niveau de sécurité élevé.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: credit_mirabelle
- id: 42cda33c-865a-5de5-969d-e1c894eda5b4
  title: Quand utiliser pay_bill
  body: 'Le conseiller utilise l''outil pay_bill pour aider un client à régler une
    facture spécifique à partir de son compte courant, simplifiant ainsi ses démarches
    administratives.


    Dans un esprit de proximité et de service, nous guidons le client selon la procédure
    suivante :


    1. Authentification : Le conseiller doit impérativement procéder à l''authentification
    forte du client. Toute action modifiant l''état d''un compte requiert une vérification
    d''identité conforme aux normes KYC.

    2. Identification du compte : Le conseiller utilise l''outil get_accounts pour
    récupérer l''identifiant unique (account_id) du compte à débiter.

    3. Collecte des informations de facturation : Le conseiller demande au client
    les détails de la facture (nom du créancier, montant exact, référence de la facture).

    4. Exécution du paiement : Le conseiller appelle l''outil pay_bill en renseignant
    l''identifiant du compte, le montant et les informations du bénéficiaire.


    Le conseiller doit s''assurer que le solde du compte est suffisant pour couvrir
    le paiement. Pour les clients en situation de fragilité financière, nous rappelons
    l''existence de notre offre spécifique facturée 3 € par mois au plus pour limiter
    l''impact des frais d''incidents en cas de paiement entraînant un découvert.


    Une fois l''opération validée, le conseiller confirme au client que le paiement
    a été transmis et l''invite à consulter son historique de transactions pour suivre
    l''exécution du règlement.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: credit_mirabelle
- id: 2358aad0-c852-5712-a42e-1aacf4ae3308
  title: Référence de l'outil pay_bill
  body: 'L''outil pay_bill permet au conseiller d''exécuter directement le paiement
    d''une facture pour le compte d''un client. L''agent réalise cette action en appelant
    l''outil dans l''interface de gestion, sans rediriger le client vers un portail
    externe.


    Signature de l''outil :

    pay_bill(account_id, amount, beneficiary_iban, reference)


    Arguments requis :

    - account_id : l''identifiant unique du compte à débiter, obtenu préalablement
    via l''outil get_accounts.

    - amount : le montant exact de la facture à régler, exprimé en euros (€).

    - beneficiary_iban : l''identifiant international du compte du créancier (IBAN)
    fourni par le client ou figurant sur la facture.

    - reference : le libellé ou la référence de la facture pour faciliter le lettrage
    et le suivi comptable.


    Effet de l''outil :

    L''outil initie un virement ponctuel du compte du client vers le compte du bénéficiaire.
    L''opération est enregistrée instantanément dans l''historique des transactions
    du compte.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: credit_mirabelle
- id: 650cb644-1b0d-5fa2-8eec-c0e127698d23
  title: Quand utiliser activate_card
  body: 'L''activation d''une carte bancaire est une opération sensible qui modifie
    l''état d''un moyen de paiement. Conformément à notre politique de sécurité, l''outil
    activate_card doit être utilisé uniquement après une vérification rigoureuse de
    l''identité du client.


    Cette procédure s''applique lorsqu''un client reçoit sa nouvelle carte (qu''il
    s''agisse d''une carte liée au Compte courant et Formule Essentielle (carte à
    débit immédiat incluse) ou d''une Carte Mirabelle Premier) et souhaite l''activer
    pour effectuer ses premiers retraits ou paiements.


    Le conseiller doit suivre strictement les étapes suivantes :


    1. Accueil et Identification : Identifier le client et noter les informations
    de base.

    2. Vérification d''identité : Procéder à l''authentification forte et à la validation
    de l''identité selon les normes KYC. Aucune activation ne peut être effectuée
    sans cette étape préalable obligatoire.

    3. Résolution du compte : Utiliser l''outil get_accounts pour identifier l''account_id
    correspondant au client à partir des informations fournies (comme les quatre derniers
    chiffres du compte).

    4. Validation de la carte : Demander au client les informations d''identification
    de la carte reçue pour s''assurer qu''il possède bien le support physique.

    5. Exécution : Appeler l''outil activate_card en renseignant l''identifiant du
    compte et la référence de la carte.


    Une fois l''outil appelé, le conseiller doit confirmer au client que sa carte
    est désormais opérationnelle. Si l''activation échoue, le conseiller doit orienter
    le client vers la procédure décrite dans le document intitulé "Compte courant
    et Formule Essentielle (carte à débit immédiat incluse) — opération échouée ou
    en attente".'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: credit_mirabelle
- id: 27e13bb4-08cc-5655-8cc4-7a22fa4ddba5
  title: Référence de l'outil activate_card
  body: 'L''outil activate_card permet au conseiller d''activer une carte bancaire
    précédemment émise et actuellement inactive. L''agent effectue l''activation directement
    via l''appel de l''outil, sans demander au client d''effectuer la manipulation
    sur un automate ou une application mobile.


    Signature de l''outil :

    activate_card(account_id, card_identifier)


    Arguments requis :

    - account_id : l''identifiant interne du compte associé à la carte, récupéré via
    l''outil get_accounts.

    - card_identifier : la référence unique de la carte à activer (généralement transmise
    par le client ou issue du dossier d''émission).


    Effet de l''outil :

    L''outil change le statut de la carte de « inactive » à « active ». Ce changement
    rend la carte immédiatement utilisable pour les opérations de paiement et de retrait,
    sous réserve du respect des plafonds applicables au produit concerné.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: credit_mirabelle
- id: affdc675-20b9-5af6-8700-75974f7f58a4
  title: Quand utiliser dispute_status
  body: 'Le suivi des contestations est un élément central de notre engagement envers
    la transparence et la protection de nos clients. L''outil dispute_status est utilisé
    pour informer un client de l''état d''avancement de sa demande de remboursement
    suite à une opération non autorisée ou mal exécutée.


    Il est essentiel de rappeler au client que, conformément aux dispositions légales
    et à notre charte de traitement des fraudes, il dispose d''un délai de 13 mois
    pour contester une opération.


    Le conseiller doit appliquer la procédure suivante :


    1. Identification et Authentification : Saluer le client et effectuer une vérification
    rigoureuse de son identité. L''accès aux informations sur un litige financier
    est soumis à une authentification forte obligatoire.

    2. Localisation du compte : Utiliser l''outil get_accounts pour obtenir l''account_id
    du client.

    3. Récupération de la référence : Demander au client la référence du dossier de
    contestation ou rechercher la transaction concernée dans l''historique via get_account_transactions.

    4. Consultation du statut : Appeler l''outil dispute_status en utilisant l''identifiant
    du compte et la référence du litige.

    5. Communication : Informer le client de l''étape actuelle du traitement (par
    exemple : « en cours d''analyse », « remboursement validé », ou « information
    complémentaire requise »).


    Si le client souhaite initier une nouvelle contestation plutôt que de consulter
    un statut, le conseiller doit alors se référer à l''outil file_transaction_dispute.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: credit_mirabelle
- id: 74aa4716-eec2-5ae7-aa55-32d8eaf430ab
  title: Référence de l'outil dispute_status
  body: 'L''outil dispute_status permet au conseiller de consulter en temps réel l''état
    d''avancement d''une procédure de contestation d''opération bancaire. L''agent
    accède à cette information en appelant l''outil directement dans l''interface
    de support.


    Signature de l''outil :

    dispute_status(account_id, dispute_id)


    Arguments requis :

    - account_id : l''identifiant unique du compte du client concerné, obtenu via
    l''outil get_accounts.

    - dispute_id : le numéro de dossier unique assigné à la contestation lors de son
    ouverture.


    Effet de l''outil :

    L''outil interroge le système de gestion des litiges et retourne le statut actuel
    de la demande, la date de dernière mise à jour et, le cas échéant, la décision
    prise par le service conformité concernant le remboursement des fonds.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: credit_mirabelle
