- id: 2f0f1e2b-41bb-5738-a9c3-d307f1d886de
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    présentation
  body: "Bienvenue au Crédit Mirabelle. Nous avons conçu le Compte courant et Formule\
    \ Essentielle comme la solution de gestion quotidienne fondamentale pour vous\
    \ accompagner dans vos opérations courantes. Ce service inclut l'ouverture d'un\
    \ compte de dépôt ainsi qu'une carte à débit immédiat, vous permettant de maîtriser\
    \ vos dépenses en temps réel.\n\nFidèles à notre modèle de banque coopérative,\
    \ nous nous engageons sur une transparence totale concernant les coûts de gestion.\
    \ La Formule Essentielle est proposée pour une cotisation mensuelle de 7,90 €.\
    \ Ce forfait vous garantit l'accès aux services de base et la sécurité d'une gestion\
    \ bancaire de proximité.\n\nPour vous offrir une souplesse de trésorerie, nous\
    \ pouvons mettre en place un découvert autorisé. Le taux applicable aux sommes\
    \ mises à disposition dans ce cadre est de 15,9 %. \n\nNous attirons votre attention\
    \ sur le fait que toute opération entraînant un dépassement de votre découvert\
    \ autorisé, ou réalisée alors que vous n'avez pas de découvert autorisé, peut\
    \ donner lieu à une commission d'intervention. Le montant de cette commission\
    \ est de 8 € par opération. Afin de limiter l'impact financier pour nos clients,\
    \ nous appliquons un plafonnement mensuel strict de ces commissions, lequel ne\
    \ peut excéder 80 € par mois.\n\nEn choisissant Crédit Mirabelle, vous bénéficiez\
    \ d'un établissement ancré localement, où la sécurité de vos fonds est assurée\
    \ par la conformité aux directives de l'ACPR et la protection des dépôts via le\
    \ FGDR jusqu'à 100 000 € par client.\n\nPour plus de détails sur les coûts, nous\
    \ vous invitons à consulter le document Compte courant et Formule Essentielle\
    \ (carte à débit immédiat incluse) — grille tarifaire."
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 4e77430e-f1e8-5b70-bc0f-a688bf20060e
  title: 'Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    cotisation mensuelle de l''offre groupée : explications'
  body: 'Vous avez des questions sur les frais de gestion de votre compte ? Voici
    des éclaircissements sur la cotisation de votre offre.


    **Pourquoi suis-je prélevé d''une cotisation mensuelle ?**

    La cotisation de 7,90 € correspond à la Formule Essentielle. Elle couvre le coût
    réel des services mis à votre disposition, notamment la tenue de votre compte
    et l''utilisation de votre carte à débit immédiat. Ce montant reflète notre volonté
    de maintenir une infrastructure sécurisée et un accompagnement de proximité dans
    nos agences.


    **Ce montant est-il fixe ?**

    Oui, la cotisation pour la Formule Essentielle est fixe et transparente. Nous
    ne pratiquons pas de frais cachés ; ce montant est prélevé mensuellement sur votre
    compte.


    **Existe-t-il des alternatives pour les clients en difficulté ?**

    Absolument. Dans le cadre de notre engagement pour l''inclusion financière, nous
    proposons une offre spécifique pour les clients en situation de fragilité financière,
    dont le coût est limité à 3 € par mois au plus, afin de réduire l''impact des
    frais d''incidents.


    Pour comprendre comment s''appliquent les autres frais, vous pouvez consulter
    le document Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — grille tarifaire.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: b9444ed8-9607-5221-814f-4bd3beb8a4fc
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    souscrire et activer
  body: 'La souscription au Compte courant et Formule Essentielle est une démarche
    simple et sécurisée, visant à vous donner un accès rapide à vos services bancaires.
    Voici la marche à suivre :


    1. **Expression du besoin** : Indiquez-nous votre souhait d''ouvrir un compte
    avec la Formule Essentielle. Nous analyserons avec vous si ce produit correspond
    à vos attentes quotidiennes.

    2. **Vérification de l''identité** : Fournissez-nous les justificatifs d''identité
    et de domicile requis. Conformément aux normes KYC et aux directives de l''ACPR,
    nous procédons à une vérification rigoureuse de votre identité avant toute ouverture
    de compte.

    3. **Signature du contrat** : Nous vous remettons la convention de compte détaillant
    les conditions générales et les tarifs, notamment la cotisation mensuelle de 7,90
    €. Vous signez le contrat, ce qui valide l''ouverture technique de votre compte.

    4. **Réception de la carte** : Vous recevrez par voie postale votre carte à débit
    immédiat. Pour des raisons de sécurité, le code confidentiel vous est envoyé séparément.

    5. **Activation de la carte** : Effectuez un premier retrait dans un distributeur
    automatique ou un paiement chez un commerçant avec saisie du code confidentiel.
    Cette action active définitivement vos services de paiement.


    Une fois ces étapes franchies, vous disposez d''un compte pleinement opérationnel.
    Nous vous conseillons de vérifier vos conditions d''éligibilité dans le document
    Compte courant et Formule Essentielle (carte à débit immédiat incluse) — conditions
    d''éligibilité avant de débuter.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: a858e7c4-0eb6-588c-8b06-d79876d0bcba
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    grille tarifaire
  body: 'Conformément à notre politique de transparence totale, voici la grille tarifaire
    applicable au Compte courant et Formule Essentielle :


    - **Cotisation mensuelle de la Formule Essentielle** : 7,90 €

    - **Commission d''intervention** : 8 € par opération (appliquée lors d''un dépassement
    du découvert autorisé ou en l''absence de découvert autorisé)

    - **Plafond mensuel des commissions d''intervention** : 80 €


    Ces tarifs reflètent le coût réel des opérations et la sécurisation de vos transactions.
    Pour les clients en situation de fragilité financière, une offre spécifique est
    disponible avec un coût maximal de 3 € par mois pour limiter l''impact des frais
    d''incidents.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0eb43762-b737-545a-ae9a-a7fcc76c7e0c
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    opération échouée ou en attente
  body: 'Il peut arriver qu''une opération de paiement ou de retrait avec votre carte
    à débit immédiat soit refusée ou reste en attente. Voici comment identifier la
    cause et résoudre la situation.


    **Symptôme : Le paiement est refusé au moment de la transaction**

    - **Cause probable 1 : Solde insuffisant.** Si vous n''avez pas de découvert autorisé,
    ou si vous avez atteint la limite de celui-ci, la transaction est bloquée.

    - **Cause probable 2 : Plafond de carte atteint.** Votre carte possède des plafonds
    de retrait et de paiement distincts.

    - **Cause probable 3 : Blocage de sécurité.** Une opération atypique a pu déclencher
    une alerte de sécurité.

    - **Solution** : Vérifiez votre solde disponible. Si le solde est suffisant, demandez-nous
    de vérifier vos plafonds de carte ou de lever un éventuel blocage de sécurité
    après validation de votre identité.


    **Symptôme : L''opération apparaît « en attente » sur votre relevé**

    - **Cause probable** : Le commerçant a initié une demande d''autorisation, mais
    la transaction finale n''a pas encore été compensée.

    - **Solution** : Il s''agit d''un processus bancaire normal. Le montant définitif
    sera débité sous quelques jours ouvrés.


    **Quand escalader le problème ?**

    Si une opération est refusée alors que votre solde est largement positif et vos
    plafonds suffisants, nous ouvrirons un dossier d''incident technique. Nous analyserons
    la trace de la transaction et vous confirmerons la résolution sous 48 heures ouvrées.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 7b152777-9047-5032-8f81-5c8e296e1e9f
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    conditions d'éligibilité
  body: 'L''accès au Compte courant et Formule Essentielle est soumis aux conditions
    suivantes :


    | Condition | Critère requis | Résultat |

    | :--- | :--- | :--- |

    | **Identité** | Présentation d''une pièce d''identité officielle et valide |
    Éligible |

    | **Résidence** | Justificatif de domicile récent (moins de 3 mois) | Éligible
    |

    | **Âge** | Majorité légale (ou représentant légal pour un mineur) | Éligible
    |

    | **Conformité** | Absence d''interdiction bancaire non régularisée | Éligible
    |

    | **KYC** | Validation complète du dossier de connaissance client | Ouverture
    possible |


    Toute pièce manquante ou non conforme entraînera un report de l''ouverture du
    compte jusqu''à régularisation du dossier.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6bc2de24-4b32-5476-a4bd-ed72b531a892
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    face à un produit similaire de l'établissement
  body: 'Le choix entre le Compte courant et Formule Essentielle et la Carte Mirabelle
    Premier dépend de vos besoins en termes de flexibilité et de plafonds.


    **Comparaison des caractéristiques** :

    - **Coût et structure** : La Formule Essentielle propose un forfait mensuel de
    7,90 €, incluant la gestion du compte et une carte à débit immédiat. La Carte
    Mirabelle Premier est un produit haut de gamme avec des cotisations différentes
    et des services étendus.

    - **Accès et plafonds** : La Formule Essentielle est conçue pour la gestion quotidienne
    et la maîtrise budgétaire. La Carte Mirabelle Premier offre des plafonds de paiement
    et de retrait nettement plus élevés, offrant une plus grande liberté financière
    pour les dépenses importantes.

    - **Usage** : La Formule Essentielle privilégie la simplicité et l''inclusion.
    La gamme Premier s''adresse aux clients ayant des besoins transactionnels plus
    complexes.


    **Quel produit choisir ?**

    - Choisissez le **Compte courant et Formule Essentielle** si vous recherchez une
    solution simple, transparente et efficace pour vos opérations courantes.

    - Choisissez la **Carte Mirabelle Premier** si vous avez besoin de plafonds étendus
    et de services premium pour vos déplacements ou vos achats importants.


    Pour plus d''informations, consultez la Carte Mirabelle Premier — présentation.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 81810c15-3b96-58ed-b4c7-bedaa9a8533f
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    informations réglementaires
  body: 'Le Compte courant et Formule Essentielle est régi par les dispositions du
    Code monétaire et financier et les directives de l''Autorité de contrôle prudentiel
    et de résolution (ACPR).


    **Protection des dépôts**

    Les fonds déposés sur votre compte sont protégés par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR). En cas de défaillance de l''établissement, vos
    avoirs sont garantis jusqu''à un montant de 100 000 € par client et par banque.


    **Transparence et Frais**

    Nous appliquons une politique de transparence totale sur les coûts. La cotisation
    mensuelle de 7,90 € et la commission d''intervention de 8 € sont établies conformément
    aux coûts réels de service et de sécurité. Le plafonnement mensuel des commissions
    d''intervention à 80 € est une mesure de protection du client visant à limiter
    l''impact financier des incidents de paiement.


    **Vérification de l''identité (KYC)**

    Conformément aux obligations légales de lutte contre le blanchiment et le financement
    du terrorisme, nous effectuons une vérification rigoureuse de l''identité de tout
    client avant l''ouverture du compte et lors de toute modification substantielle
    des données personnelles. Aucun changement de données sensibles n''est effectué
    sans une validation d''identité conforme.


    **Traitement des litiges**

    En cas d''opération mal exécutée ou non autorisée, vous disposez d''un délai légal
    de 13 mois pour contester l''opération. Nous nous engageons à traiter les fraudes
    avec diligence et à rembourser les opérations non autorisées selon les délais
    légaux en vigueur.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5462c144-e3d9-51cb-a735-0b0373476248
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    grille des taux
  body: 'L''utilisation d''un découvert autorisé sur votre Compte courant et Formule
    Essentielle est soumise à l''application d''un taux d''intérêt.


    **Taux du découvert autorisé**

    Le taux annuel applicable aux sommes débitrices (utilisations du découvert autorisé)
    est de 15,9 %.


    **Application et calcul**

    Ce taux s''applique uniquement sur le montant et la durée d''utilisation du découvert.
    Il est calculé au prorata temporis sur la base du solde débiteur quotidien. Ce
    taux est unique et s''applique à tous les clients bénéficiant d''un découvert
    autorisé dans le cadre de cette formule.


    L''octroi d''un découvert autorisé fait l''objet d''une analyse préalable de votre
    solvabilité. Nous vous rappelons que le dépassement du montant autorisé peut entraîner
    l''application de commissions d''intervention de 8 € par opération, dans la limite
    d''un plafond de 80 € par mois.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: bbcd8082-38e0-5b5a-bf22-8c21fec296fe
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    offre en cours
  body: 'Dans le cadre de notre mission de banque coopérative et de notre engagement
    pour l''inclusion financière, Crédit Mirabelle propose une offre d''accompagnement
    pour les clients en situation de fragilité financière.


    **L''offre « Inclusion »**

    Pour les clients identifiés comme étant en situation de fragilité financière,
    nous proposons une adaptation tarifaire de la gestion de compte. Au lieu de la
    cotisation standard, ces clients bénéficient d''une offre spécifique dont le coût
    est limité à 3 € par mois au plus.


    **Objectif**

    Cette mesure vise à limiter l''impact des frais d''incidents et à garantir l''accès
    aux services bancaires fondamentaux pour tous, sans exclusion.


    **Modalités**

    Cette offre est disponible dès aujourd''hui pour tout client détenteur d''un compte
    courant et Formule Essentielle pouvant justifier de sa situation auprès de son
    conseiller en agence. La modification du tarif s''applique dès la validation du
    dossier par la direction d''agence.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1acede4b-e4d7-517a-92e4-77a88c434c9e
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    protection contre la fraude et les opérations non autorisées
  body: 'La sécurité de vos avoirs est au cœur de l''engagement de Crédit Mirabelle.
    Pour protéger votre Compte courant et Formule Essentielle (carte à débit immédiat
    incluse), nous appliquons des protocoles de vérification rigoureux, notamment
    l''authentification forte, obligatoire pour toute action modifiant l''état de
    votre compte ou pour la communication d''informations sensibles.


    Il est essentiel de savoir que nous ne vous demanderons jamais, par téléphone,
    par e-mail ou par SMS, de nous communiquer vos codes secrets, vos identifiants
    de connexion ou de valider une opération que vous n''avez pas initiée. Toute demande
    insistante vous poussant à agir dans l''urgence pour « débloquer » un compte est
    un signe d''alerte.


    En cas de constatation d''une opération que vous n''avez pas autorisée, nous traitons
    votre demande avec diligence. Conformément aux normes en vigueur, nous garantissons
    le remboursement des opérations non autorisées selon les délais légaux. Vous disposez
    d''un délai de 13 mois pour contester une opération mal exécutée ou non autorisée.
    Nous vous recommandons de nous signaler tout incident dès sa découverte pour limiter
    les risques.


    Si vous suspectez une fraude, la première action à entreprendre est la mise en
    opposition immédiate de votre carte à débit immédiat. Cette action permet de geler
    toute nouvelle transaction frauduleuse tandis que nous analysons l''origine de
    l''incident.


    Pour plus de précisions sur la gestion des incidents, vous pouvez consulter le
    document Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — frais ou montant inattendu.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1287a68d-f6a6-5a94-bdbc-8555dca110ee
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    conditions générales
  body: 'Les présentes conditions régissent l''ouverture et le fonctionnement du Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) au sein de notre
    banque coopérative.


    1. Obligations de l''institution : Nous nous engageons à assurer la gestion quotidienne
    de vos fonds et à fournir les services inclus dans la Formule Essentielle. Vos
    dépôts sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR)
    jusqu''à 100 000 € par client.


    2. Obligations du client : Vous vous engagez à maintenir un solde permettant la
    couverture des opérations et à fournir des informations d''identité exactes et
    actualisées, conformément aux normes KYC (Know Your Customer).


    3. Tarification et Frais : L''utilisation de ce compte implique le paiement d''une
    cotisation mensuelle de 7,90 €. En cas de dépassement du découvert autorisé, une
    commission d''intervention de 8 € est appliquée par opération, avec un plafonnement
    mensuel total de 80 €.


    4. Gestion du découvert : L''utilisation du découvert autorisé est soumise à un
    taux d''intérêt de 15,9 %. Ce taux s''applique sur les sommes mises à disposition
    par la banque au-delà du solde créditeur.


    5. Modification et Clôture : Nous nous réservons le droit de modifier les présentes
    conditions moyennant un préavis informant le client. La clôture du compte peut
    être initiée par le client ou par la banque dans le respect des délais légaux
    et des procédures de solde de compte.


    Pour toute question relative à l''application de ces tarifs, veuillez vous référer
    à Compte courant et Formule Essentielle (carte à débit immédiat incluse) — grille
    tarifaire.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: dfd11f28-f874-523f-8483-d514d0cd6181
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    pour qui et pour quels usages
  body: "Le Compte courant et Formule Essentielle (carte à débit immédiat incluse)\
    \ est conçu comme la solution de gestion quotidienne fondamentale pour nos clients,\
    \ qu'ils soient particuliers ou sociétaires. Il s'adresse prioritairement aux\
    \ personnes recherchant une gestion simplifiée de leur budget avec une visibilité\
    \ totale sur leurs dépenses.\n\nCe produit est idéal pour les usages suivants\
    \ :\n- La réception des revenus (salaires, pensions).\n- Le règlement des charges\
    \ courantes via des virements ou prélèvements.\n- Les paiements et retraits quotidiens\
    \ grâce à la carte à débit immédiat incluse, qui permet un contrôle rigoureux\
    \ du solde en temps réel.\n\nLe coût de cet ensemble de services est transparent\
    \ et fixe : une cotisation mensuelle de 7,90 €. \n\nPour ceux qui pourraient traverser\
    \ une période de fragilité financière, Crédit Mirabelle propose une offre spécifique\
    \ pour limiter l'impact des frais d'incidents, facturée au maximum 3 € par mois.\n\
    \nCe compte constitue souvent la première étape pour entrer dans notre modèle\
    \ coopératif. En complément de ce compte, nous recommandons l'acquisition de parts\
    \ sociales pour devenir sociétaire et participer activement à la gouvernance de\
    \ notre banque. \n\nPour découvrir comment ouvrir ce compte, nous vous invitons\
    \ à consulter Compte courant et Formule Essentielle (carte à débit immédiat incluse)\
    \ — souscrire et activer."
