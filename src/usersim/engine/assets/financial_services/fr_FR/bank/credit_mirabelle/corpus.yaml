- id: d61597b8-dbf4-5158-a9da-89986ecb853a
  title: Prêt immobilier à taux fixe Mirabelle — calcul et application des taux
  body: 'Ce document détaille les taux d''intérêt applicables au Prêt immobilier à
    taux fixe Mirabelle et les modalités de leur application.


    **Grille des taux fixes** :

    - Pour une durée de remboursement de 20 ans : le taux est de 3,35 %.

    - Pour une durée de remboursement de 25 ans : le taux est de 3,55 %.


    **Application du taux** :

    Le taux est dit « fixe » car il est déterminé lors de la signature du contrat
    et ne peut être modifié par la banque, quelles que soient les évolutions des taux
    directeurs du marché. Il s''applique sur le capital restant dû chaque mois.


    **Éléments influençant le coût final** :

    Bien que le taux nominal soit fixe, le coût mensuel total pour le client inclut
    :

    1. La mensualité du capital et des intérêts (basée sur les taux ci-dessus).

    2. La prime d''assurance emprunteur (calculée selon le profil de risque du client).


    Le taux d''endettement maximal de 35 % est utilisé pour valider l''éligibilité
    du client avant l''application de ces taux.'
