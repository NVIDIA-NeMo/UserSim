  institution_id: credit_mirabelle
- id: 41ac3818-e429-5e39-b3e6-da16ccd5af9d
  title: Livret d'épargne populaire (LEP) — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos avoirs est notre priorité absolue. Le Livret d''épargne
    populaire (LEP) est un produit protégé, mais la vigilance reste essentielle pour
    prévenir les tentatives de fraude.


    Nous vous rappelons que Crédit Mirabelle utilise l''authentification forte pour
    sécuriser l''accès à vos comptes. Ne partagez jamais vos codes secrets, vos mots
    de passe ou vos identifiants de connexion avec quiconque. Aucun conseiller de
    notre institution ne vous demandera jamais vos codes de sécurité par téléphone,
    par e-mail ou par SMS.


    Soyez particulièrement attentifs aux tentatives de « phishing » : des messages
    frauduleux peuvent imiter notre identité pour vous inciter à cliquer sur un lien
    malveillant ou à fournir vos informations personnelles. Si vous recevez une demande
    inhabituelle, ne cliquez sur aucun lien et contactez-nous immédiatement via vos
    canaux habituels.


    En cas de suspicion de fraude ou de constatation d''une opération non autorisée
    sur votre livret, nous vous recommandons d''agir sans délai. Nous traitons les
    fraudes avec diligence et garantissons le remboursement des opérations non autorisées
    selon les délais légaux. Sachez que vous disposez d''un délai de 13 mois pour
    contester toute opération mal exécutée ou non autorisée.


    Pour garantir l''intégrité de vos informations, nous appliquons des normes de
    vérification d''identité rigoureuses (KYC). Tout changement de données sensibles
    nécessite une validation d''identité conforme. Nous vous conseillons de surveiller
    régulièrement vos relevés de compte pour détecter toute anomalie rapidement.


    Pour plus de détails sur le cadre réglementaire de nos produits, nous vous invitons
    à consulter le document intitulé Livret d''épargne populaire (LEP) — informations
    réglementaires.'
  domain: retail_banking
  product_category: lep
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1ff856e4-273f-5f8b-bbce-b7eaa1f7fd22
  title: Livret d'épargne populaire (LEP) — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    générales applicables au Livret d''épargne populaire (LEP). En tant que banque
    coopérative, nous nous engageons à une transparence totale concernant l''évolution
    de vos produits d''épargne.


    Le taux de rémunération du LEP, actuellement fixé à 2,5 %, est un taux réglementé.
    Il peut être modifié par décret gouvernemental. Dans ce cas, la nouvelle rémunération
    s''applique automatiquement et sans préavis, conformément à la législation en
    vigueur sur les livrets réglementés.


    Les conditions d''éligibilité, notamment le plafond du revenu fiscal de référence,
    sont également soumises aux décisions administratives. Actuellement, ce plafond
    est fixé à 23 028 € pour une part. Si, lors de la vérification annuelle obligatoire,
    il apparaît que vos revenus dépassent ce seuil, nous vous informerons des modalités
    de maintien du compte ou de sa clôture, conformément aux directives de l''ACPR.


    Le plafond des dépôts est strictement limité à 10 000 €. Tout versement entraînant
    un dépassement de ce montant sera refusé. Si un virement automatique provoque
    un dépassement, l''opération sera annulée et les fonds seront retournés à l''émetteur.


    Pour toute autre modification des conditions contractuelles non réglementaires,
    Crédit Mirabelle s''engage à vous informer par tout moyen durable avec un préavis
    minimum de deux mois. Vous disposez alors de la possibilité de clôturer votre
    compte sans frais si ces modifications ne vous conviennent pas.


    La clôture du livret peut être demandée à tout moment. Elle entraîne le reversement
    du solde, incluant les intérêts courus, vers votre compte courant. Le respect
    du Code monétaire et financier et le traitement équitable des clients constituent
    les piliers de notre gestion contractuelle.'
  domain: retail_banking
  product_category: lep
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6109f832-d51c-5956-87ba-70a17ee1979a
  title: Livret d'épargne populaire (LEP) — prise en main pas à pas
  body: 'Ce guide est destiné aux agents de support pour accompagner les clients dans
    l''ouverture et la gestion de leur Livret d''épargne populaire (LEP). L''objectif
    est d''assurer une souscription conforme aux normes KYC et aux réglementations
    en vigueur.


    Étape 1 : Vérification de l''éligibilité

    Avant toute action, vous devez confirmer que le client respecte le plafond de
    revenu fiscal de référence. Pour une part, ce montant ne doit pas excéder 23 028
    €. Demandez au client son dernier avis d''imposition pour valider ce point. Si
    le client ne remplit pas ce critère, orientez-le vers le Livret A.


    Étape 2 : Ouverture et versement initial

    Une fois l''éligibilité confirmée, procédez à l''ouverture du compte. Le client
    doit effectuer un versement minimum à l''ouverture de 30 €. Ce montant peut être
    prélevé depuis un compte courant ouvert au sein de notre institution ou via un
    virement externe.


    Étape 3 : Information sur les plafonds et taux

    Informez clairement le client que son épargne sera rémunérée au taux de 2,5 %.
    Précisez également que le plafond maximal des dépôts est de 10 000 €. Expliquez
    que tout montant versé au-delà de ce seuil ne sera pas accepté par le système.


    Étape 4 : Validation et confirmation

    Finalisez la création du compte après avoir vérifié l''identité du client selon
    les normes de sécurité obligatoires. Confirmez au client l''ouverture effective
    du livret et la date de valeur du premier versement.


    L''agent doit s''assurer que le client comprend que le LEP est un produit liquide,
    permettant des retraits à tout moment, tout en restant dans le cadre strict de
    l''inclusion financière. Pour plus de détails sur les critères d''accès, veuillez
    vous référer au document Livret d''épargne populaire (LEP) — conditions d''éligibilité.'
  domain: retail_banking
  product_category: lep
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 3b86a56e-8b5b-52bf-8025-c46c58d0dc07
  title: 'Livret d''épargne populaire (LEP) — versement minimum à l''ouverture : explications'
  body: 'Pourquoi un versement initial est-il requis pour ouvrir un Livret d''épargne
    populaire (LEP) ?

    L''ouverture d''un LEP nécessite un versement minimum de 30 €. Cette somme permet
    d''activer techniquement le compte et de confirmer l''engagement d''épargne du
    titulaire. Ce montant reste disponible et peut être retiré à tout moment.


    Comment effectuer ce versement de 30 € ?

    Vous pouvez demander à votre conseiller de transférer cette somme depuis votre
    compte courant Crédit Mirabelle, ou effectuer un virement depuis un autre établissement
    bancaire lors de la souscription.


    Que se passe-t-il si je ne peux pas verser 30 € immédiatement ?

    Ce montant est une condition réglementaire et technique pour l''activation du
    produit. Nous vous invitons à vous rapprocher de votre conseiller pour étudier
    les solutions d''accompagnement possibles dans le cadre de notre engagement envers
    l''inclusion financière.'
  domain: retail_banking
  product_category: lep
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 3ebbded2-acd2-5ee5-8280-c23f0558f530
  title: Livret d'épargne populaire (LEP) — effectuer une modification
  body: "Ce guide vous accompagne pour modifier vos informations personnelles ou les\
    \ options liées à votre Livret d'épargne populaire (LEP).\n\nAvant de commencer,\
    \ assurez-vous de disposer d'une pièce d'identité officielle en cours de validité\
    \ (carte nationale d'identité ou passeport), car toute modification de données\
    \ sensibles requiert une vérification d'identité rigoureuse selon les normes KYC.\n\
    \nÉtape 1 : Demander la modification\nIndiquez-nous clairement la nature du changement\
    \ souhaité (par exemple : changement d'adresse postale, mise à jour de votre situation\
    \ familiale ou modification de vos coordonnées de contact). \n\nÉtape 2 : Fournir\
    \ les justificatifs\nTransmettez-nous le document justificatif correspondant à\
    \ votre demande. Pour un changement d'adresse, un justificatif de domicile de\
    \ moins de trois mois est requis. Pour une modification d'identité, présentez\
    \ votre pièce d'identité originale ou une copie certifiée conforme.\n\nÉtape 3\
    \ : Validation de l'identité\nNous procéderons à la vérification de vos informations.\
    \ Si la demande est effectuée à distance, une authentification forte sera requise\
    \ pour valider votre identité et sécuriser l'opération.\n\nÉtape 4 : Confirmation\
    \ de la prise en compte\nUne fois les documents validés et l'identité confirmée,\
    \ nous mettrons à jour vos informations dans nos systèmes. Vous recevrez une notification\
    \ de confirmation par courrier ou via votre interface numérique confirmant que\
    \ la modification a été enregistrée.\n\nSachez que certaines modifications, comme\
    \ le changement de situation fiscale, peuvent déclencher une nouvelle vérification\
    \ de votre éligibilité au produit, le plafond de revenu fiscal de référence restant\
    \ fixé à 23 028 € pour une part."
  domain: retail_banking
  product_category: lep
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: cd5eaf57-ddc2-5ebc-9ec6-2fe3f353a990
  title: Livret d'épargne populaire (LEP) — problèmes d'accès ou de connexion
  body: "Vous rencontrez des difficultés pour accéder à la consultation ou à la gestion\
    \ de votre Livret d'épargne populaire (LEP) via nos interfaces numériques ? Voici\
    \ la marche à suivre pour résoudre l'incident.\n\nSymptôme : « Je ne parviens\
    \ pas à me connecter à mon espace client pour voir mon livret » ou « Mon accès\
    \ est bloqué ».\n\nCauses probables et vérifications :\n1. Identifiants incorrects\
    \ : Vérifiez que vous saisissez correctement votre identifiant et votre mot de\
    \ passe. Attention aux majuscules et aux caractères spéciaux.\n2. Problème d'authentification\
    \ forte : Assurez-vous que votre appareil de confiance est correctement synchronisé\
    \ et que vous avez bien validé la notification de sécurité.\n3. Connexion réseau\
    \ : Vérifiez la stabilité de votre connexion internet. Essayez de vous déconnecter\
    \ et de vous reconnecter.\n\nProcédure de résolution :\n- Si vos identifiants\
    \ sont erronés, demandez-nous la réinitialisation de votre mot de passe. Nous\
    \ vous guiderons pour créer un nouveau code sécurisé après avoir vérifié votre\
    \ identité.\n- Si le problème persiste malgré des identifiants corrects, demandez-nous\
    \ de vérifier l'état de votre accès technique. Nous analyserons si un blocage\
    \ administratif ou une mise à jour de vos données KYC est nécessaire pour rétablir\
    \ le service.\n\nQuand escalader la demande ?\nSi aucune de ces étapes ne permet\
    \ de rétablir l'accès, nous ouvrirons un ticket d'incident technique. Votre demande\
    \ sera alors transmise à notre direction d'agence pour un diagnostic approfondi.\
    \ Vous serez informé du délai de résolution, généralement sous 48 heures ouvrées.\
    \ \n\nNous vous rappelons que, pour votre sécurité, nous ne vous demanderons jamais\
    \ vos codes secrets par téléphone ou par e-mail pour résoudre un problème de connexion."
  domain: retail_banking
  product_category: lep
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5a0a7e10-7691-5e9f-a2af-ae284c7e7d46
  title: Livret d'épargne populaire (LEP) — niveaux d'accès
  body: 'Ce tableau définit les critères d''accès au Livret d''épargne populaire (LEP)
    en fonction du revenu fiscal de référence (RFR).


    | Condition (Revenu Fiscal de Référence) | Résultat d''accès | Observation |

    | :--- | :--- | :--- |

    | RFR ≤ 23 028 € (pour 1 part) | Accès Autorisé | Le client peut ouvrir un
    LEP avec un versement initial de 30 €. |

    | RFR $>$ 23 028 € (pour 1 part) | Accès Refusé | Le client n''est pas éligible
    au LEP. L''ouverture d''un Livret A est recommandée. |

    | Dossier incomplet (avis d''imposition manquant) | Accès Suspendu | L''accès
    est bloqué jusqu''à la fourniture du justificatif fiscal. |


    L''éligibilité est vérifiée lors de l''ouverture et fait l''objet d''un contrôle
    périodique annuel pour garantir le respect des règles de l''inclusion financière.'
  domain: retail_banking
  product_category: lep
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 35db05d5-90db-5d66-a16b-f33cafb21691
  title: Livret d'épargne populaire (LEP) — choisir entre les formules
  body: "Si vous hésitez entre le Livret d'épargne populaire (LEP) et le Livret A,\
    \ voici les éléments clés pour vous aider à choisir la solution la plus adaptée\
    \ à votre situation.\n\nLe LEP se distingue par un taux de rémunération supérieur,\
    \ actuellement de 2,5 %, contre un taux généralement inférieur pour le Livret\
    \ A. Cependant, le LEP est soumis à une condition stricte de ressources : votre\
    \ revenu fiscal de référence ne doit pas dépasser 23 028 € pour une part. De plus,\
    \ son plafond de dépôts est limité à 10 000 €.\n\nLe Livret A, quant à lui, est\
    \ accessible à tous, sans condition de revenus, et offre un plafond de dépôts\
    \ nettement plus élevé. \n\nEn résumé :\n- Choisissez le LEP si vous respectez\
    \ le plafond de revenus de 23 028 € et que vous souhaitez optimiser la rémunération\
    \ de vos économies jusqu'à 10 000 €.\n- Choisissez le Livret A si vous dépassez\
    \ le plafond de revenus ou si vous souhaitez épargner au-delà de 10 000 €.\n\n\
    Pour plus d'informations, vous pouvez consulter le document Livret A — présentation."
