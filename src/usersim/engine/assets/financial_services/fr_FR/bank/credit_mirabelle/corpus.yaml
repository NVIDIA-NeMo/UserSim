- id: 5040ae18-42bd-5b45-b7b3-3002aa595a65
  title: 'Carte Mirabelle Premier — plafond de retrait sur 7 jours : explications'
  body: 'Voici les réponses aux questions les plus fréquentes concernant la limite
    de retrait de la Carte Mirabelle Premier.


    **Quel est le montant maximal que je peux retirer avec ma carte ?**

    Le plafond de retrait pour la Carte Mirabelle Premier est fixé à 1 500 €. Ce montant
    représente la somme maximale que vous pouvez retirer aux distributeurs automatiques
    de billets sur une période de 7 jours glissants.


    **Comment fonctionne la période de « 7 jours glissants » ?**

    Contrairement à un plafond mensuel qui se réinitialise le premier jour du mois,
    le plafond glissant se calcule quotidiennement. Pour savoir si vous pouvez effectuer
    un retrait aujourd''hui, nous additionnons tous vos retraits effectués durant
    les 6 jours précédents. Si le total, incluant le nouveau retrait, ne dépasse pas
    1 500 €, l''opération est autorisée.


    **Que se passe-t-il si j''atteins ce plafond ?**

    Si le montant de 1 500 € est atteint, vos tentatives de retrait suivantes seront
    refusées par le distributeur, même si vos fonds sont disponibles sur votre compte.'
  domain: cards
  product_category: carte_premier
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0ca56448-7167-5a49-9f87-17569d245e5a
  title: Carte Mirabelle Premier — consulter le suivi ou l'historique
  body: "Pour gérer efficacement vos finances et suivre l'utilisation de vos plafonds\
    \ avec votre Carte Mirabelle Premier, voici la marche à suivre pour consulter\
    \ votre historique de transactions.\n\n**Prérequis :**\nVous devez être titulaire\
    \ d'un compte courant associé à votre Carte Mirabelle Premier et disposer de vos\
    \ accès sécurisés.\n\n**Étapes de consultation :\n\n1. Demandez-nous de vous transmettre\
    \ votre dernier relevé de compte ou l'historique détaillé de vos opérations sur\
    \ la période souhaitée. \n2. Nous procéderons alors à la vérification de votre\
    \ identité conformément à nos normes de sécurité pour protéger vos données sensibles.\n\
    3. Une fois l'identité validée, nous vous communiquerons la liste exhaustive de\
    \ vos transactions. Vous pourrez y identifier chaque paiement, retrait, ainsi\
    \ que les éventuels frais de paiement hors zone euro de 1,5 % appliqués lors de\
    \ vos voyages.\n4. Pour vérifier votre consommation actuelle par rapport à vos\
    \ plafonds, demandez-nous spécifiquement le montant total cumulé de vos paiements\
    \ sur les 30 derniers jours (plafond de 8 000 €) et de vos retraits sur les 7\
    \ derniers jours (plafond de 1 500 €).\n\n**Comment savoir que la demande a abouti\
    \ ?**\nVous recevrez soit un document PDF sécurisé via votre messagerie interne,\
    \ soit une réponse détaillée de notre part confirmant les montants exacts et les\
    \ dates des opérations. Si vous constatez une anomalie dans cet historique, nous\
    \ vous invitons à consulter le document Carte Mirabelle Premier — écart avec vos\
    \ relevés pour connaître la procédure de régularisation."
