- id: 903f4b38-d632-55c1-a6c2-013066ce0443
  title: 'Prêt immobilier à taux fixe Mirabelle — taux d''endettement maximal : explications'
  body: 'Question : Qu''est-ce que le taux d''endettement maximal et pourquoi est-il
    limité à 35 % ?


    Réponse : Le taux d''endettement correspond à la part de vos revenus mensuels
    consacrée au remboursement de vos crédits (mensualités du prêt immobilier, crédits
    à la consommation, etc.). Au Crédit Mirabelle, nous appliquons une limite stricte
    de 35 %.


    Cette restriction a pour objectif de protéger votre équilibre financier. En limitant
    vos charges de remboursement à 35 % de vos revenus, nous nous assurons que vous
    conservez un reste à vivre suffisant pour faire face aux dépenses quotidiennes
    et aux imprévus, évitant ainsi le risque de surendettement. C''est un pilier de
    notre engagement pour l''inclusion financière et la bienveillance envers nos sociétaires.


    Pour comprendre comment nous évaluons votre dossier, vous pouvez consulter : Prêt
    immobilier à taux fixe Mirabelle — conditions d''éligibilité.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: d0ef2718-5819-53ff-914e-03fee0946cc2
  title: Prêt immobilier à taux fixe Mirabelle — consulter le suivi ou l'historique
  body: "Pour suivre l'évolution de votre Prêt immobilier à taux fixe Mirabelle et\
    \ consulter l'historique de vos remboursements, nous vous accompagnons dans les\
    \ étapes suivantes :\n\n1. Demandez-nous l'accès à votre tableau d'amortissement\
    \ actualisé. Ce document récapitule chaque échéance, la part de capital remboursée\
    \ et la part d'intérêts (basée sur votre taux fixe de 3,35 % ou 3,55 % selon la\
    \ durée).\n2. Nous vous transmettons l'historique complet des prélèvements effectués\
    \ depuis le déblocage des fonds. Vous pourrez ainsi vérifier que chaque mensualité\
    \ a bien été débitée de votre compte courant.\n3. Pour un suivi détaillé du capital\
    \ restant dû, demandez-nous un arrêté de compte. Nous vous confirmerons le montant\
    \ exact qu'il vous reste à rembourser à l'instant T.\n4. Nous validons ensemble\
    \ la conformité des dates de prélèvement avec vos relevés bancaires pour s'assurer\
    \ qu'aucun retard n'est survenu.\n\nL'opération est réussie lorsque vous disposez\
    \ de votre tableau d'amortissement et que le capital restant dû correspond à vos\
    \ propres calculs. \n\nSi vous constatez une différence entre ces informations\
    \ et vos relevés, nous vous invitons à consulter : Prêt immobilier à taux fixe\
    \ Mirabelle — écart avec vos relevés."
  domain: lending_mortgage
  product_category: pret_immobilier
