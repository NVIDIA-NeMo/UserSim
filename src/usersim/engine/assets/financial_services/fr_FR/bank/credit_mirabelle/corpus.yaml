- id: 11834280-47c7-51c5-8f87-1c4288f5aff5
  title: Livret d'épargne populaire (LEP) — confidentialité et protection des données
  body: 'Crédit Mirabelle s''engage à protéger la confidentialité de vos données et
    à garantir la sécurité de vos avoirs dans le cadre de la gestion de votre Livret
    d''épargne populaire (LEP).


    Protection des dépôts

    Conformément aux directives de l''ACPR et de la Banque de France, vos fonds sont
    protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR). Cette garantie
    assure la protection de vos avoirs jusqu''à un montant de 100 000 € par client
    et par banque, couvrant ainsi l''intégralité du plafond du LEP.


    Traitement des données et KYC

    L''ouverture et la gestion d''un LEP impliquent la collecte de données sensibles,
    notamment votre avis d''imposition pour vérifier le respect du plafond de revenu
    fiscal de référence (23 028 € pour une part). Ces informations sont traitées avec
    la plus stricte confidentialité et uniquement dans le but de vérifier votre éligibilité
    réglementaire. Nous appliquons des normes de vérification d''identité (KYC) rigoureuses
    avant toute action modifiant l''état de votre compte.


    Confidentialité et RGPD

    Nous traitons vos données personnelles conformément au Règlement Général sur la
    Protection des Données (RGPD). Vous disposez d''un droit d''accès, de rectification
    et de suppression de vos données. Les informations relatives à vos versements
    et retraits sont conservées selon les durées légales d''archivage bancaire.


    Engagement de transparence

    Nous nous engageons à ne jamais utiliser vos données à des fins commerciales non
    consenties. Toute communication concernant l''évolution du taux de 2,5 % ou les
    modifications de plafond (actuellement 10 000 €) vous sera adressée via vos canaux
    de communication sécurisés. Le traitement équitable des clients et le respect
    du Code monétaire et financier sont les piliers de notre approche.'
  domain: retail_banking
  product_category: lep
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0981ddc7-6353-544e-bd53-43d70ead17ad
  title: Livret d'épargne populaire (LEP) — reconnaître les arnaques visant ce produit
  body: 'Le Livret d''épargne populaire (LEP) est un produit très attractif en raison
    de son taux de rémunération de 2,5 %. Cette attractivité peut malheureusement
    être exploitée par des acteurs malveillants. Nous souhaitons vous accompagner
    pour identifier et éviter les tentatives de fraude.


    Voici les scénarios d''arnaques les plus fréquents visant ce produit :


    1. L''offre de « déblocage » ou d''augmentation de plafond : Un interlocuteur
    vous contacte en prétendant pouvoir augmenter le plafond de 10 000 € de votre
    LEP ou « débloquer » des fonds contre le paiement d''une commission. Soyez vigilants
    : les plafonds du LEP sont réglementaires et ne peuvent être modifiés par une
    intervention humaine ou un paiement.


    2. Le faux conseiller en optimisation fiscale : On vous propose de transférer
    vos fonds vers un produit tiers en prétendant que le taux de 2,5 % est obsolète
    ou qu''il existe un « LEP Premium » avec des conditions plus avantageuses. Crédit
    Mirabelle ne propose aucune variante du LEP ; il s''agit d''un produit unique
    et réglementé.


    3. L''urgence administrative : Vous recevez un message vous demandant de mettre
    à jour vos justificatifs de revenus (pour justifier du plafond de 23 028 € par
    part) via un lien externe pour éviter la clôture immédiate de votre compte. Nous
    ne vous demanderons jamais vos codes d''accès ou vos informations confidentielles
    via un lien envoyé par SMS ou e-mail.


    Ce que nous ne vous demanderons jamais :

    - Votre code secret de carte bancaire ou vos identifiants de connexion.

    - Un transfert d''argent vers un compte tiers pour « activer » vos intérêts.

    - De valider une opération de sécurité pour « vérifier » votre éligibilité fiscale.


    Si vous constatez une opération suspecte sur votre livret, nous vous rappelons
    que vous disposez d''un délai de 13 mois pour contester une opération non autorisée.
    En cas de doute, l''action immédiate consiste à nous signaler l''incident pour
    que nous puissions sécuriser vos avoirs.'
  domain: retail_banking
  product_category: lep
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 18c25f4b-2605-5a22-98aa-79ff4ec14fc0
  title: Livret d'épargne populaire (LEP) — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux conseillers pour l''accompagnement des clients
    concernant les limites techniques et réglementaires du Livret d''épargne populaire
    (LEP).


    Le LEP est soumis à des contraintes strictes définies par la réglementation fiscale
    et monétaire. Le non-respect de ces plafonds peut entraîner la clôture du compte
    ou la perte des avantages fiscaux.


    1. Plafond de versements

    Le montant total des dépôts ne peut excéder 10 000 €. Une fois ce plafond atteint,
    aucun nouveau versement n''est possible. Toutefois, les intérêts capitalisés annuellement
    peuvent porter le solde final au-delà de ce seuil sans que cela ne constitue une
    infraction.


    2. Conditions d''éligibilité fiscale

    L''ouverture et le maintien du compte sont conditionnés par le revenu fiscal de
    référence (RFR). Pour une personne seule (une part), le plafond de revenu fiscal
    de référence est fixé à 23 028 €. Si le client dépasse ce seuil lors du contrôle
    annuel, nous sommes tenus d''informer le client et, selon les directives, de procéder
    à la clôture du livret.


    3. Minimum de dépôt

    Pour l''activation du produit, un versement minimum d''ouverture de 30 € est obligatoire.
    Ce montant doit être disponible sur le compte courant du client lors de la souscription.


    4. Unicité du produit

    Conformément à la loi, chaque personne physique ne peut détenir qu''un seul LEP.
    Il est interdit d''ouvrir plusieurs livrets de ce type, même dans des établissements
    différents. Nous procédons à une vérification systématique auprès des fichiers
    centraux pour garantir cette unicité.


    5. Rémunération

    Le taux d''intérêt actuel est de 2,5 %. Ce taux est appliqué sur la base de la
    règle des quinzaines, conformément aux usages des livrets réglementés.'
  domain: retail_banking
  product_category: lep
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: d1f055ec-3cd9-573d-a9c1-d8733f1d193b
  title: 'Livret d''épargne populaire (LEP) — plafond de revenu fiscal de référence
    pour une part : explications'
  body: "Question : Qu'est-ce que le plafond de revenu fiscal de référence et comment\
    \ savoir si je suis éligible au LEP ?\n\nRéponse : Le Livret d'épargne populaire\
    \ est réservé aux foyers dont les revenus sont modestes. Pour être éligible, votre\
    \ revenu fiscal de référence (RFR) ne doit pas dépasser un certain seuil. Pour\
    \ une personne seule (équivalent à une part fiscale), ce plafond est de 23 028\
    \ €.\n\nLe revenu fiscal de référence est le montant indiqué sur votre dernier\
    \ avis d'imposition. Il prend en compte vos revenus ainsi que certaines charges\
    \ déductibles. Si vous êtes dans cette situation, vous pouvez bénéficier du taux\
    \ avantageux de 2,5 % proposé par ce produit. \n\nNous vous invitons à consulter\
    \ le document Livret d'épargne populaire (LEP) — conditions d'éligibilité pour\
    \ plus de précisions sur les justificatifs à fournir lors de l'ouverture."
  domain: retail_banking
  product_category: lep
  document_type: faq
  source_authority: official
  placeholder: true
