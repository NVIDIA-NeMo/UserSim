- id: cf15698f-b254-5120-8bc0-8a6788e96239
  title: Livret d'épargne populaire (LEP) — opération refusée ou bloquée
  body: "Il peut arriver qu'une opération sur votre Livret d'épargne populaire (LEP)\
    \ soit refusée ou bloquée. Voici comment identifier la cause et résoudre la situation.\n\
    \nSymptôme : Vous tentez d'effectuer un versement sur votre LEP, mais le système\
    \ affiche un message d'erreur ou l'opération est rejetée.\n\nCauses probables\
    \ et vérifications :\n1. Dépassement du plafond réglementaire : Le LEP est limité\
    \ à un montant maximal de 10 000 €. Si le versement que vous tentez d'effectuer\
    \ porte le solde au-delà de ce seuil, l'opération sera systématiquement bloquée.\
    \ \n   - Action : Vérifiez votre solde actuel. Si vous approchez des 10 000 €,\
    \ vous devrez diriger vos futurs dépôts vers un autre support, comme le Livret\
    \ A.\n\n2. Défaut d'éligibilité fiscale : Le maintien du LEP nécessite la validation\
    \ périodique de vos revenus. Si vos justificatifs ne sont pas à jour ou si vos\
    \ revenus ont dépassé le plafond de 23 028 € pour une part, le compte peut être\
    \ restreint.\n   - Action : Vérifiez si nous vous avons sollicité pour un nouvel\
    \ avis d'imposition.\n\n3. Insuffisance de fonds sur le compte source : Si vous\
    \ effectuez un transfert depuis votre compte courant, assurez-vous que le solde\
    \ est suffisant.\n\nComment résoudre le blocage :\n- Si le plafond est atteint,\
    \ nous vous suggérons d'ouvrir un Livret A pour continuer à épargner.\n- Si le\
    \ problème concerne l'éligibilité, transmettez-nous votre dernier avis d'imposition\
    \ pour régularisation.\n\nSi aucune de ces causes ne s'applique, nous ouvrirons\
    \ un dossier d'incident technique. Nous analyserons la transaction et vous confirmerons\
    \ la résolution sous 48 heures ouvrées."
  domain: retail_banking
  product_category: lep
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e5f91ce2-75a4-5745-9cd3-857023eb27e8
  title: Livret d'épargne populaire (LEP) — quand changer ou monter en gamme
  body: 'Ce document guide les conseillers pour orienter le client vers un changement
    de produit lorsque le LEP ne répond plus à sa situation fiscale ou financière.


    Le passage du LEP vers un autre produit, comme le Livret A, est nécessaire dans
    deux cas principaux :


    1. Dépassement du plafond de revenus : Le client n''est plus éligible au LEP car
    son revenu fiscal de référence a dépassé 23 028 € (pour une part). Le maintien
    du LEP devient alors irrégulier. Le Livret A est l''alternative naturelle car
    il n''impose aucune condition de revenus.


    2. Atteinte du plafond d''épargne : Le client a atteint le plafond de 10 000 €
    et souhaite continuer à épargner avec une liquidité immédiate. Bien que le taux
    du LEP soit supérieur (2,5 %), le plafond du Livret A est nettement plus élevé,
    permettant d''accueillir des surplus d''épargne.


    Comparaison rapide :

    - LEP : Taux de 2,5 %, plafond 10 000 €, condition de revenus < 23 028 €.

    - Livret A : Taux réglementé, plafond plus élevé, accessible à tous sans condition
    de revenus.


    Le LEP reste le choix prioritaire tant que le client est éligible et n''a pas
    atteint le plafond, en raison de sa rémunération supérieure.'
  domain: retail_banking
  product_category: lep
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e38ca585-01d7-536f-8535-5ed880f40e2f
  title: Livret d'épargne populaire (LEP) — comparaison avec les alternatives et quand
    ne pas le choisir
  body: 'Le Livret d''épargne populaire (LEP) est l''un des supports d''épargne les
    plus avantageux du marché, mais il ne convient pas à tous les profils. Nous vous
    aidons ici à déterminer s''il s''agit du meilleur choix pour vous.


    Pourquoi choisir le LEP ?

    Le LEP se distingue par son taux de rémunération attractif de 2,5 %, supérieur
    à celui du Livret A. C''est la solution idéale pour constituer une épargne de
    précaution disponible à tout moment tout en maximisant vos gains.


    Les caractéristiques clés :

    - Rémunération : 2,5 %

    - Plafond de dépôt : 10 000 €

    - Versement minimum à l''ouverture : 30 €


    Quand ne PAS choisir le LEP ?

    Vous ne pouvez pas souscrire à ce produit, ou vous devez envisager une alternative,
    dans les situations suivantes :


    1. Revenus trop élevés : Si votre revenu fiscal de référence dépasse 23 028 €
    pour une part, vous ne remplissez pas les conditions légales d''éligibilité. Dans
    ce cas, nous vous orienterons vers le Livret A.


    2. Épargne disponible supérieure au plafond : Si vous possédez déjà plus de 10
    000 € à placer, le LEP ne pourra absorber qu''une partie de vos fonds. Le surplus
    devra être placé sur un autre support.


    3. Recherche de rendement à long terme : Le LEP est un produit liquide. Si vous
    n''avez pas besoin de cet argent pendant plusieurs années et que vous recherchez
    des rendements potentiellement plus élevés (avec un risque associé), d''autres
    produits de placement pourraient être étudiés.


    En résumé, si vous respectez le plafond de revenus de 23 028 € et que vous avez
    moins de 10 000 € à épargner, le LEP est sans conteste la meilleure option pour
    sécuriser vos fonds avec un rendement optimal.'
  domain: retail_banking
  product_category: lep
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5f6070b1-650f-52b4-80a2-d0f748742a2a
  title: Livret d'épargne populaire (LEP) — coûts et frais
  body: "Question : Quels sont les frais liés à la gestion de mon Livret d'épargne\
    \ populaire (LEP) ?\n\nRéponse : Conformément à notre volonté de transparence\
