  institution_id: credit_mirabelle
- id: 4c6fb252-e946-5ba9-bcae-0b1e22402563
  title: Livret d'épargne populaire (LEP) — face à un produit similaire de l'établissement
  body: 'Pour optimiser votre épargne, il est essentiel de choisir le produit adapté
    à votre situation fiscale. Voici la comparaison entre le Livret d''épargne populaire
    (LEP) et le Livret A.


    **Livret d''épargne populaire (LEP)**

    - Rémunération : Taux supérieur, actuellement de 2,5 %.

    - Accessibilité : Réservé aux foyers dont le revenu fiscal de référence pour une
    part est inférieur ou égal à 23 028 €.

    - Capacité : Plafond de dépôts limité à 10 000 €.

    - Idéal pour : Les clients aux revenus modestes souhaitant maximiser le rendement
    de leur épargne de précaution.


    **Livret A**

    - Rémunération : Taux réglementé, généralement inférieur à celui du LEP.

    - Accessibilité : Ouvert à tous, sans condition de ressources.

    - Capacité : Plafond de dépôts nettement plus élevé que celui du LEP.

    - Idéal pour : Tous les clients, ou ceux ayant dépassé le plafond de revenus du
    LEP.


    Le LEP est mathématiquement le choix le plus rationnel pour tout client éligible
    grâce à son taux de 2,5 %. Si vous dépassez le plafond de 10 000 €, le Livret
    A devient alors le relais naturel pour continuer à épargner en exonération d''impôts.
    Pour plus de détails sur l''alternative, consultez Livret A — présentation.'
  domain: retail_banking
  product_category: lep
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 3136ea82-7a1e-5804-a135-cfe178c63d7b
  title: Livret d'épargne populaire (LEP) — informations réglementaires
  body: 'Le Livret d''épargne populaire (LEP) est un produit d''épargne réglementé
    dont les conditions sont définies par le Code monétaire et financier. Crédit Mirabelle
    s''engage à une application stricte de ces normes et à une transparence totale
    sur les coûts et les conditions d''accès.


    **Protection des dépôts**

    Conformément aux directives de l''ACPR et de la Banque de France, les fonds déposés
    sur le LEP sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR). Cette garantie couvre vos avoirs jusqu''à un montant de 100 000 € par
    client et par établissement.


    **Obligations de conformité**

    L''ouverture d''un LEP est subordonnée à la production d''un justificatif de revenus
    (avis d''imposition) attestant que le revenu fiscal de référence pour une part
    ne dépasse pas 23 028 €. La détention d''un seul LEP par personne, toutes institutions
    confondues, est une obligation légale. Toute déclaration inexacte peut entraîner
    la clôture immédiate du compte.


    **Fiscalité et Plafonds**

    Les intérêts produits par le LEP sont exonérés d''impôt sur le revenu et de prélèvements
    sociaux. Le plafond des dépôts est fixé à 10 000 €. Les intérêts capitalisés peuvent
    porter le solde au-delà de ce seuil sans que cela ne constitue une infraction.


    **Traitement équitable**

    Crédit Mirabelle s''assure que le traitement des clients détenteurs de LEP est
    équitable et bienveillant, en limitant l''impact des frais d''incidents pour les
    clients en situation de fragilité financière, conformément à notre modèle de banque
    coopérative.'
  domain: retail_banking
  product_category: lep
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 3f090264-ece8-50ac-af4d-07ed9ef7e7c8
  title: Livret d'épargne populaire (LEP) — grille des taux
  body: 'Le Livret d''épargne populaire (LEP) propose une structure de rémunération
    simplifiée et transparente, applicable à tous les détenteurs du produit.


    **Taux nominal annuel : 2,5 %**


    Ce taux unique s''applique à l''ensemble des sommes déposées sur le compte, sans
    distinction de palier ou de montant, dans la limite du plafond de dépôts de 10
    000 €.


    **Modalités d''application**

    - Calcul : Les intérêts sont calculés par quinzaines (le 1er et le 16 de chaque
    mois).

    - Crédit : Les intérêts cumulés sont versés sur le livret une fois par an, au
    31 décembre.

    - Variation : Le taux est fixé par l''État. Crédit Mirabelle répercute toute modification
    officielle du taux réglementaire sans délai.


    Ce taux de 2,5 % est garanti pour tous les clients remplissant les conditions
    d''éligibilité fiscale.'
  domain: retail_banking
  product_category: lep
