- id: 5382d50c-b65e-56a3-9c27-49bd91104718
  title: Livret A — présentation
  body: "Bienvenue chez Crédit Mirabelle. Nous avons le plaisir de vous présenter\
    \ le Livret A, une solution d'épargne réglementée, liquide et exonérée d'impôts,\
    \ conçue pour vous permettre de constituer une réserve financière disponible à\
    \ tout moment.\n\nLe Livret A est l'un des piliers de la gestion de budget quotidienne.\
    \ Sa principale force réside dans sa flexibilité : vous pouvez effectuer des versements\
    \ et des retraits librement, sans frais, tout en faisant fructifier vos économies\
    \ grâce à un taux de rémunération attractif. Actuellement, ce produit offre un\
    \ taux d'intérêt de 1,7 %.\n\nPour ouvrir votre Livret A, nous demandons un versement\
    \ initial minimum de 10 €. Ce seuil accessible permet à chacun de commencer à\
    \ épargner, conformément à notre engagement envers l'inclusion financière. \n\n\
    Il est important de noter que le Livret A est soumis à un plafond de dépôts. Le\
    \ montant total de vos avoirs, incluant les intérêts capitalisés, ne peut excéder\
    \ 22 950 €. Une fois ce plafond atteint, vous ne pourrez plus effectuer de nouveaux\
    \ versements sur ce compte, bien que les intérêts continuent de s'ajouter jusqu'à\
    \ ce que le solde global atteigne cette limite.\n\nEn choisissant Crédit Mirabelle,\
    \ vous bénéficiez d'une banque coopérative ancrée localement. Nous nous engageons\
    \ à vous accompagner avec transparence et bienveillance dans la gestion de votre\
    \ épargne. Le Livret A est l'outil idéal pour vos projets à court terme ou pour\
    \ faire face aux imprévus de la vie.\n\nPour plus de détails sur la rémunération\
    \ de vos fonds, nous vous invitons à consulter le document intitulé Livret A —\
    \ grille des taux."
  domain: retail_banking
  product_category: livret_a
  document_type: product_sheet
