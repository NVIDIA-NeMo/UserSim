- id: 079326a3-7b56-5405-b61c-89daf55ae10e
  title: Livret A — bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos économies est notre priorité absolue. Le Livret A, bien
    que simple d''utilisation, peut être la cible de tentatives de fraude. Nous vous
    invitons à appliquer rigoureusement les principes suivants pour protéger vos avoirs.


    **Ce que nous ne vous demanderons jamais**

    Crédit Mirabelle ne vous demandera jamais, par téléphone, par SMS ou par e-mail,
    de lui communiquer votre code secret, vos identifiants de connexion ou de valider
    une opération de sécurité en cliquant sur un lien externe. Toute demande de ce
    type doit être considérée comme une tentative de phishing (hameçonnage).


    **L''authentification forte**

    Conformément à nos normes de sécurité, toute action modifiant l''état de votre
    compte ou toute communication d''informations sensibles nécessite une authentification
    forte. Ne partagez jamais vos codes de validation reçus sur votre appareil mobile
    avec un tiers, même s''il prétend être un collaborateur de la banque.


    **Vigilance et signalement**

    Si vous constatez une opération inhabituelle sur votre Livret A, contactez-nous
    immédiatement. Nous traitons les fraudes avec diligence. Nous vous rappelons que,
    conformément aux délais légaux, vous disposez d''un délai de 13 mois pour contester
    une opération mal exécutée ou non autorisée.


    **Actions immédiates en cas de doute**

    Si vous pensez avoir communiqué vos accès par erreur, demandez-nous de bloquer
    temporairement vos accès numériques. Nous procéderons alors à une vérification
    rigoureuse de votre identité, selon nos normes de connaissance client, avant de
    rétablir vos services. Votre vigilance est le premier rempart contre la fraude
    financière.'
  domain: retail_banking
  product_category: livret_a
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: cb660937-c93d-547b-8d0d-276f77ba0a72
  title: Livret A — modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    applicables au Livret A au sein de Crédit Mirabelle. En tant que banque coopérative,
    nous nous engageons à une transparence totale sur l''évolution de vos produits
    d''épargne.


    **Évolution du taux de rémunération**

    Le taux d''intérêt du Livret A est fixé par l''État. Actuellement établi à 1,7
    %, ce taux peut être modifié par décret gouvernemental. Crédit Mirabelle applique
    systématiquement et sans délai tout nouveau taux officiel. Vous serez informé
    de tout changement via vos relevés de compte ou notre interface numérique.


    **Ajustement du plafond de dépôts**

    Le plafond actuel des versements est fixé à 22 950 €. Si l''autorité réglementaire
    décide d''augmenter ou de diminuer ce seuil, Crédit Mirabelle ajustera la limite
    technique de votre compte. En cas de baisse du plafond, les intérêts continueront
    d''être calculés sur la totalité de vos avoirs jusqu''à la date d''effet du nouveau
    plafond, mais aucun nouveau versement ne sera possible au-delà de la nouvelle
    limite.


    **Obligations et résiliation**

    L''ouverture du compte requiert un versement initial minimum de 10 €. Le client
    s''engage à fournir des informations d''identité exactes et à les actualiser périodiquement.


    Le client peut clôturer son Livret A à tout moment, sans frais, moyennant un préavis
    nous permettant de calculer les intérêts courus. Crédit Mirabelle se réserve le
    droit de clôturer le compte en cas de manquement grave aux obligations de conformité
    ou d''identité. Toute modification substantielle des conditions générales fera
    l''objet d''une notification préalable, conformément au Code monétaire et financier.'
  domain: retail_banking
  product_category: livret_a
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 923c8e14-94be-5768-9afa-7d41c2ee2873
  title: Livret A — prise en main pas à pas
  body: 'Ce guide est destiné aux conseillers pour accompagner le client dans l''ouverture
    et la gestion de son Livret A. L''objectif est d''assurer une expérience fluide
    tout en respectant nos obligations de conformité.


    **Étape 1 : Vérification de l''éligibilité et identité**

    Avant toute ouverture, vérifiez que le client ne détient pas déjà un Livret A
    dans un autre établissement bancaire (un seul Livret A est autorisé par personne).
    Procédez à la vérification rigoureuse de l''identité du client via un document
    officiel en cours de validité, conformément aux normes KYC de l''institution.


    **Étape 2 : Activation du compte**

    Informez le client que l''ouverture nécessite un versement initial minimum de
    10 €. Ce montant peut être prélevé depuis un compte courant ouvert chez nous ou
    via un virement externe. Confirmez au client que ce montant est immédiatement
    disponible.


    **Étape 3 : Alimentation et plafonds**

    Expliquez au client qu''il peut alimenter son compte librement jusqu''à atteindre
    le plafond de dépôts de 22 950 €. Précisez que les intérêts sont calculés quotidiennement
    et capitalisés annuellement au taux de 1,7 %.


    **Étape 4 : Gestion des fonds**

    Montrez au client comment effectuer des virements depuis son Livret A vers son
    compte courant via l''interface numérique. Rappelez-lui que les fonds restent
    liquides et accessibles à tout moment.


    **Étape 5 : Clôture et transmission**

    Si le client souhaite clôturer son livret, assurez-vous de transférer le solde
    total vers un compte dont l''identité a été préalablement vérifiée. Rappelez que
    la clôture est gratuite et sans délai de préavis contraignant pour le client.'
  domain: retail_banking
  product_category: livret_a
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: d00d1dd0-ea90-5c6d-9552-51cdcb039941
  title: 'Livret A — versement minimum à l''ouverture : explications'
  body: 'Voici les réponses aux questions fréquentes concernant le premier dépôt nécessaire
    à l''ouverture de votre Livret A.


    **Pourquoi un versement minimum est-il exigé pour ouvrir un Livret A ?**

    Le versement initial est une condition technique et réglementaire permettant d''activer
    le compte et de confirmer l''engagement du titulaire. Chez Crédit Mirabelle, ce
    montant est fixé à 10 €.


    **Puis-je verser plus que le minimum dès l''ouverture ?**

    Oui, tout à fait. Si vous le souhaitez, vous pouvez effectuer un premier versement
    supérieur à 10 €, dans la limite du plafond global de 22 950 €.


    **Que se passe-t-il si je retire ces 10 € immédiatement après l''ouverture ?**

    Le compte reste ouvert et actif. Toutefois, pour que vos économies génèrent des
    intérêts au taux de 1,7 %, un solde positif doit être maintenu sur le compte.


    Pour plus de détails sur les conditions d''ouverture, vous pouvez consulter le
    document Livret A — présentation.'
  domain: retail_banking
  product_category: livret_a
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: fbf9b5c6-0a02-5662-8b71-82c29c4ba7ee
  title: Livret A — effectuer une modification
  body: 'Vous souhaitez modifier les informations liées à votre Livret A (comme l''adresse
    de correspondance, le contact associé ou la désignation d''un mandataire) ? Voici
    la marche à suivre pour effectuer cette mise à jour en toute sécurité.


    **Prérequis**

    Avant de commencer, assurez-vous d''avoir avec vous une pièce d''identité officielle
    en cours de validité (carte nationale d''identité ou passeport).


    **Procédure de modification**


    1. **Demande de modification** : Indiquez-nous clairement l''élément que vous
    souhaitez modifier (par exemple : "Je souhaite changer l''adresse postale associée
    à mon Livret A").

    2. **Vérification d''identité** : Nous procéderons à une vérification rigoureuse
    de votre identité. Vous devrez nous présenter votre pièce d''identité originale
    ou nous transmettre une copie certifiée conforme selon les modalités de sécurité
    en vigueur.

    3. **Fourniture des nouveaux éléments** : Communiquez-nous la nouvelle information
    (la nouvelle adresse, le nouveau justificatif de domicile ou l''identité complète
    du futur mandataire).

    4. **Validation et confirmation** : Nous analysons la conformité des documents
    fournis. Une fois la demande validée, nous vous confirmerons la mise à jour par
    un message sécurisé sur votre interface numérique ou par courrier postal.


    **Comment savoir si la modification a réussi ?**

    Vous recevrez une notification de confirmation. Vous pourrez également constater
    le changement en consultant vos informations de profil ou votre prochain relevé
    de compte annuel. Si vous ne recevez aucune confirmation sous 5 jours ouvrés,
    demandez-nous l''état d''avancement de votre dossier.'
  domain: retail_banking
  product_category: livret_a
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6ec78acd-a273-5dca-882c-14a32a4810cd
  title: Livret A — problèmes d'accès ou de connexion
  body: "Vous rencontrez des difficultés pour visualiser ou accéder à votre Livret\
    \ A via nos services numériques ? Voici comment diagnostiquer et résoudre le problème.\n\
    \n**Symptôme : Le Livret A n'apparaît pas dans la liste de mes comptes**\nC'est\
    \ la situation la plus courante. Plusieurs causes sont possibles :\n- **Défaut\
    \ d'authentification** : Votre session a peut-être expiré ou l'authentification\
    \ forte n'a pas été finalisée. Tentez de vous déconnecter et de vous reconnecter.\n\
    - **Vérification d'identité en cours** : Si vous venez d'ouvrir votre compte,\
    \ il est possible que la validation finale de vos documents KYC soit encore en\
    \ cours de traitement.\n- **Problème de synchronisation** : Un incident technique\
    \ temporaire peut masquer certains produits d'épargne.\n\n**Ce qu'il faut vérifier\
    \ dans l'ordre**\n1. Vérifiez que vous utilisez la version la plus récente de\
    \ notre interface numérique.\n2. Assurez-vous que vos informations de contact\
    \ (téléphone pour le code SMS) sont à jour.\n3. Consultez vos messages sécurisés\
    \ pour voir si nous vous avons demandé un document complémentaire.\n\n**Résolution\
    \ et Escalade**\nSi le problème persiste après reconnexion, demandez-nous d'effectuer\
    \ une vérification technique de vos droits d'accès. \n\nSi nous ne pouvons pas\
    \ rétablir l'accès immédiatement, nous ouvrirons un dossier d'incident technique.\
    \ Le processus d'escalade suivra alors notre chaîne de support : votre conseiller\
    \ remontera le point à la direction d'agence pour une résolution prioritaire.\
    \ Vous serez informé du rétablissement de vos accès par notification numérique.\
    \ \n\nPour toute question sur la sécurité de vos accès, reportez-vous au document\
    \ Livret A — bonnes pratiques de sécurité du compte."
