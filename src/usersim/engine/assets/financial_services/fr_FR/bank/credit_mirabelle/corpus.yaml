  body: 'Pour ouvrir un Livret d''épargne populaire (LEP) au sein du Crédit Mirabelle,
    vous devez justifier de votre identité et de vos revenus. Voici les documents
    requis selon votre situation :


    | Condition d''éligibilité | Justificatif requis | Résultat attendu |

    | :--- | :--- | :--- |

    | Identité et domicile | Pièce d''identité officielle et justificatif de domicile
    récent | Validation du dossier KYC |

    | Revenu fiscal de référence | Dernier avis d''imposition (indiquant un revenu
    ≤ 23 028 € pour une part) | Éligibilité confirmée pour l''ouverture |

    | Capacité de dépôt initial | Justification de la provenance des fonds (30 € minimum)
