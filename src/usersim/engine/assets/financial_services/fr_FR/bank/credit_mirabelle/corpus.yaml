- id: 03f4536d-8619-5d52-a677-855387c6a7c9
  title: Carte Mirabelle Premier — confidentialité et protection des données
  body: "L'utilisation de la Carte Mirabelle Premier implique le traitement de données\
    \ personnelles et financières. Crédit Mirabelle s'engage à garantir la confidentialité\
    \ et la protection de ces informations conformément au Règlement Général sur la\
    \ Protection des Données (RGPD) et aux directives de l'ACPR.\n\nNous collectons\
    \ et traitons vos données principalement pour l'exécution du contrat de service\
    \ : gestion des opérations de paiement, surveillance des plafonds (8 000 € pour\
    \ les paiements, 1 500 € pour les retraits) et lutte contre le blanchiment d'argent\
    \ et le financement du terrorisme. Vos données sont transmises aux réseaux de\
    \ paiement uniquement pour permettre la validation de vos transactions.\n\nLa\
    \ sécurité de vos fonds est notre priorité. En tant qu'établissement membre du\
    \ Fonds de Garantie des Dépôts et de Résolution (FGDR), vos dépôts sont protégés\
    \ jusqu'à 100 000 € par client et par banque, conformément aux normes en vigueur.\n\
    \nConcernant la transparence des coûts, nous appliquons une politique de clarté\
    \ totale : la cotisation annuelle de 132 € et les frais de paiement hors zone\
    \ euro de 1,5 % sont indiqués sans frais cachés. \n\nVous disposez d'un droit\
    \ d'accès, de rectification et d'opposition au traitement de vos données. Pour\
    \ exercer ces droits, vous pouvez nous solliciter via votre conseiller en agence\
    \ ou par courrier. Nous vous rappelons que l'authentification forte est obligatoire\
    \ avant toute communication d'informations sensibles sur vos comptes, afin d'éviter\
    \ toute usurpation d'identité."
  domain: cards
