- id: d6716a06-962d-5dfb-a04b-a459ec4d0f0a
  title: Livret A — opération échouée ou en attente
  body: "Il peut arriver qu'une opération sur votre Livret A ne s'effectue pas comme\
    \ prévu. Voici comment identifier et résoudre le problème.\n\n**Symptôme : Votre\
    \ versement est indiqué comme « échoué » ou reste « en attente » sans être crédité.**\n\
    \n**Causes possibles et vérifications :**\n1. **Dépassement du plafond** : La\
    \ cause la plus fréquente est l'atteinte du plafond réglementaire. Le Livret A\
    \ est limité à un solde maximum de 22 950 €. Si votre versement, ajouté aux intérêts\
    \ déjà acquis, fait dépasser ce montant, l'opération sera automatiquement bloquée.\n\
    \   - *Action* : Vérifiez le solde actuel de votre livret. Si vous êtes proche\
    \ de 22 950 €, le versement ne peut être traité.\n\n2. **Provision insuffisante**\
    \ : Si vous effectuez un transfert depuis un compte courant, assurez-vous que\
    \ les fonds nécessaires sont disponibles.\n   - *Action* : Consultez le solde\
    \ de votre compte source.\n\n3. **Délai de traitement** : Certaines opérations\
    \ peuvent prendre quelques heures pour apparaître sur votre interface numérique.\n\
    \   - *Action* : Patientez jusqu'au prochain cycle de mise à jour des soldes.\n\
    \n**Comment résoudre le problème ?**\nSi le plafond n'est pas atteint et que vos\
    \ fonds sont disponibles, nous intervenons pour vous aider :\n- Nous analysons\
    \ l'historique technique de la transaction.\n- Si une erreur interne est détectée,\
    \ nous forçons la régularisation du solde sous 48 heures ouvrées.\n- Si l'opération\
    \ a été bloquée par un contrôle de sécurité, nous procéderons à une nouvelle vérification\
    \ d'identité conforme aux normes KYC avant de débloquer les fonds.\n\nSi le problème\
    \ persiste, nous escaladons votre demande vers la direction d'agence pour une\
    \ résolution prioritaire."
  domain: retail_banking
  product_category: livret_a
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
