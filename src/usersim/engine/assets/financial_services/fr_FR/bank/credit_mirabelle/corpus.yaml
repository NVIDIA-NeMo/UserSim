- id: 04d0a421-1ef9-5ed0-bf6e-1bfdde1e8ec0
  title: Prêt immobilier à taux fixe Mirabelle — effectuer une modification
  body: "Vous souhaitez modifier un élément de votre contrat de prêt (par exemple,\
    \ changer votre assurance emprunteur ou demander une modulation de vos mensualités)\
    \ ? Voici la marche à suivre.\n\n**Prérequis :**\n- Votre pièce d'identité originale\
    \ en cours de validité.\n- Le nouveau contrat d'assurance (le cas échéant) ou\
    \ vos justificatifs de revenus actualisés.\n\n**Étapes de modification :**\n\n\
    1. **Demande de modification** : Exprimez-nous votre souhait de modification.\
    \ Précisez s'il s'agit d'un changement d'assurance ou d'une demande de modulation\
    \ des échéances.\n\n2. **Vérification d'identité** : Nous procéderons à une vérification\
    \ rigoureuse de votre identité conformément aux normes KYC. Cette étape est obligatoire\
    \ avant toute action modifiant l'état de votre compte.\n\n3. **Analyse de conformité**\
    \ : Nous analyserons si la modification demandée respecte toujours les règles\
    \ d'endettement. Pour rappel, le taux d'endettement maximal doit rester inférieur\
    \ ou égal à 35 %.\n\n4. **Émission de l'avenant** : Si la demande est validée,\
    \ nous rédigerons un avenant au contrat détaillant les nouvelles conditions. \n\
    \n5. **Confirmation et signature** : Vous recevrez le document à signer. Nous\
    \ vous confirmerons la prise en compte effective de la modification dès la signature\
    \ de l'acte.\n\nSachez que si la modification entraîne une nouvelle offre de prêt,\
    \ le délai de réflexion obligatoire de dix jours s'appliquera à nouveau."
