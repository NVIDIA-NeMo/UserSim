- id: 9687f44b-563b-56d2-8768-54a97b772c38
  title: Carte Mirabelle Premier — résilier, clôturer ou changer de formule
  body: 'Si vos besoins financiers évoluent, vous pouvez demander la modification
    de votre formule de carte ou la résiliation pure et simple de votre Carte Mirabelle
    Premier. Voici la marche à suivre :


    1. Formulez votre demande : Indiquez-nous si vous souhaitez résilier totalement
    votre carte ou basculer vers une autre offre, comme la Formule Essentielle. Précisez
    la date souhaitée pour l''effet de ce changement.


    2. Validation de l''identité : Pour garantir la sécurité de vos comptes, nous
    procéderons à une vérification rigoureuse de votre identité selon les normes KYC.
    Nous pourrons vous demander de confirmer certains éléments de votre profil ou
    de fournir un justificatif récent.


    3. Confirmation des conditions financières : Nous vous confirmerons le solde de
    votre cotisation annuelle. Pour rappel, la cotisation de 132 € est due pour l''année
    en cours. Nous vous préciserons si un prorata est applicable ou si la cotisation
    reste acquise à la banque.


    4. Désactivation et restitution : Une fois la demande validée, nous procéderons
    à la désactivation technique de votre carte. Vous devrez alors détruire la carte
    physique (en coupant la puce et la piste magnétique) ou nous la restituer en agence.


    5. Confirmation finale : Vous recevrez une notification confirmant la clôture
    de votre contrat de carte ou l''activation de votre nouvelle formule. Si vous
    passez à une offre inférieure, vos nouveaux plafonds (inférieurs aux 8 000 € de
    paiement et 1 500 € de retrait de la formule Premier) seront alors effectifs.


    Pour comparer vos options avant de changer, vous pouvez consulter le document
    Carte Mirabelle Premier — face à un produit similaire de l''établissement.'
