- id: 9715beb9-33f4-571c-a089-c5997edc8dd7
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    frais ou montant inattendu
  body: 'Lorsqu''un client signale un prélèvement inconnu ou un montant inattendu
    sur son Compte courant et Formule Essentielle (carte à débit immédiat incluse),
    suivez ce protocole de diagnostic.


    **Symptôme : « Je vois un prélèvement mensuel que je ne comprends pas »**

    - Cause probable : Il s''agit très probablement de la cotisation mensuelle de
    la Formule Essentielle, qui s''élève à 7,90 €.

    - Action : Vérifiez la date du prélèvement. Si elle est récurrente chaque mois,
    confirmez au client qu''il s''agit des frais de tenue de compte et de services.


    **Symptôme : « On m''a prélevé 8 € sans raison apparente »**

    - Cause probable : Le compte a fait l''objet d''une commission d''intervention.
    Cela arrive lorsqu''une opération a entraîné un dépassement du découvert autorisé
    ou a été réalisée sans provision suffisante.

    - Action : Identifiez l''opération déclencheuse. Rappelez au client que ces frais
    sont plafonnés à 8 € par opération et 80 € par mois.


    **Symptôme : « Je constate des intérêts débiteurs alors que j''ai un découvert
    autorisé »**

    - Cause probable : Le découvert autorisé n''est pas gratuit. L''utilisation de
    cette facilité est rémunérée au taux de 15,9 %.

    - Action : Expliquez le calcul des intérêts sur la base du montant et de la durée
    du découvert.


    **Escalade :**

    Si le client conteste la légitimité d''un frais malgré ces explications, nous
    ouvrirons un dossier de réclamation interne. Le conseiller doit alors transmettre
    la demande à la direction d''agence pour une analyse approfondie. Le client sera
    informé de la décision dans les délais réglementaires.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1f4a1c61-239d-55fa-93ed-c0fceccbd824
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    justificatifs à fournir
  body: 'Pour l''ouverture d''un Compte courant et Formule Essentielle (carte à débit
    immédiat incluse), la fourniture des justificatifs suivants est obligatoire pour
    satisfaire à nos obligations KYC :


    | Condition | Justificatif requis |

    | :--- | :--- |

    | Vérification de l''identité | Une pièce d''identité officielle en cours de validité
    (Carte Nationale d''Identité, Passeport) |

    | Justification du domicile | Un justificatif de domicile de moins de 3 mois (facture
    d''énergie, d''eau, ou avis d''imposition) |

    | Statut de résident | Pour les non-résidents, un document attestant de la résidence
    fiscale et un passeport valide |

    | Capacité juridique | Pour les mineurs, l''acte de naissance et la pièce d''identité
    du représentant légal |


    L''absence de l''un de ces documents empêche l''activation du compte et de la
    carte à débit immédiat associée.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
