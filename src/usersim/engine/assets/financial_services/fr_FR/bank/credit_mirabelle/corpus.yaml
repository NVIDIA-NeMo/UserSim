- id: 391cfe8b-840b-5b6b-b0db-15a45b41a85d
  title: Carte Mirabelle Premier — justificatifs à fournir
  body: 'Pour souscrire à la Carte Mirabelle Premier, tout client doit fournir un
    ensemble de justificatifs permettant une vérification d''identité rigoureuse (normes
    KYC). Voici les documents requis selon votre situation :


    | Profil Client | Justificatif d''Identité | Justificatif de Domicile | Condition
    Additionnelle |

    | :--- | :--- | :--- | :--- |

    | Particulier résident | Pièce d''identité officielle en cours de validité (CNI,
    Passeport) | Facture d''énergie ou d''eau de moins de 3 mois | Compte courant
    ouvert chez Crédit Mirabelle |

    | Sociétaire | Pièce d''identité officielle en cours de validité (CNI, Passeport)
    | Facture d''énergie ou d''eau de moins de 3 mois | Détention de parts sociales
    |

    | Non-résident UE | Passeport valide avec visa si nécessaire | Justificatif de
    domicile international traduit | Analyse de solvabilité complète |


    Le défaut de présentation de l''un de ces documents entraîne systématiquement
    le refus d''émission de la carte pour garantir la conformité aux directives de
    l''ACPR et de la Banque de France.'
