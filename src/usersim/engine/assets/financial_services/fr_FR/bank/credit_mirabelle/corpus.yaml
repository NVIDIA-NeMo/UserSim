  institution_id: credit_mirabelle
- id: d9d04783-4439-5576-99f1-66755bd9f413
  title: Prêt immobilier à taux fixe Mirabelle — modification des conditions
  body: 'Le présent document définit les modalités de modification des conditions
    applicables au Prêt immobilier à taux fixe Mirabelle. Ce contrat est régi par
    le Code monétaire et financier et les directives de l''ACPR.


    1. Stabilité des taux : Le taux d''intérêt est fixe pour toute la durée du prêt.
    Les taux appliqués lors de la souscription sont de 3,35 % pour une durée de 20
    ans et de 3,55 % pour une durée de 25 ans. Ces taux ne peuvent être modifiés unilatéralement
    par la banque durant la période définie.


    2. Frais de dossier : Les frais d''application s''élèvent à 1 000 € et sont dus
    lors de la mise en place du crédit. Toute modification structurelle du prêt demandée
    par le client peut entraîner de nouveaux frais de traitement selon la nature de
    l''acte.


    3. Conditions de solvabilité : Le maintien du prêt est conditionné par le respect
    des normes d''endettement. Le taux d''endettement maximal autorisé est de 35 %.
    En cas de modification substantielle de votre situation financière, nous nous
    réservons le droit d''analyser à nouveau votre solvabilité.


    4. Durée du contrat : La durée maximale du crédit est fixée à 25 ans. Toute demande
    d''allongement de la durée au-delà de ce seuil est irrecevable.


    5. Modalités de modification : Toute modification du contrat (avenant) doit faire
    l''objet d''un accord écrit entre le client et la direction d''agence. Un délai
    de réflexion obligatoire de dix jours s''applique avant l''acceptation de toute
    nouvelle offre de prêt modifiée.


    6. Fin du contrat : Le contrat prend fin au terme du remboursement total du capital
    et des intérêts, ou par remboursement anticipé selon les conditions prévues dans
    votre offre personnalisée.'
  domain: lending_mortgage
