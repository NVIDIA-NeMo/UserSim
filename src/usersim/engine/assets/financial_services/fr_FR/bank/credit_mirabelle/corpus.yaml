- id: e36f701b-8d3a-50a9-8c72-095ebea55fca
  title: Carte Mirabelle Premier — informations réglementaires
  body: 'La Carte Mirabelle Premier est émise par Crédit Mirabelle, institution coopérative
    soumise à la réglementation bancaire française. Nous assurons une conformité stricte
    aux directives de l''ACPR et de la Banque de France.


    Protection des dépôts : Les fonds déposés sur le compte associé à votre carte
    sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à
    un montant de 100 000 € par client et par banque. Cette garantie assure la sécurité
    de vos avoirs en cas de défaillance de l''établissement.


    Gestion des fraudes et opérations non autorisées : Conformément au Code monétaire
    et financier, nous traitons les fraudes avec diligence. Vous disposez d''un délai
    légal de 13 mois pour contester toute opération mal exécutée ou non autorisée.
    Le remboursement des opérations non autorisées est garanti selon les délais légaux
    en vigueur, sous réserve de la non-implication d''une négligence grave.


    Vérification d''identité : L''authentification forte est obligatoire avant toute
    action modifiant l''état d''un compte ou la communication d''informations sensibles.
    Conformément aux normes KYC (Know Your Customer), aucun changement de données
    personnelles ou modification de plafond ne sera effectué sans une validation d''identité
    rigoureuse.


    Frais et transparence : Les frais appliqués, notamment la cotisation annuelle
    de 132 € et les frais de paiement hors zone euro de 1,5 %, sont communiqués de
    manière exhaustive et transparente. Nous nous engageons à ne jamais minimiser
    le coût total des services fournis.


    Pour toute information complémentaire sur le cadre légal de nos cartes, nous vous
    invitons à consulter le document Notes réglementaires : cartes bancaires.'
  domain: cards
  product_category: carte_premier
  document_type: disclosure
  source_authority: official
