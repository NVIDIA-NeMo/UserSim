  institution_id: credit_mirabelle
- id: efa2495a-5648-5162-aefd-f96b29e4b5c6
  title: Livret d'épargne populaire (LEP) — consulter le suivi ou l'historique
  body: 'Nous vous accompagnons dans la consultation de l''historique de vos opérations
    sur votre Livret d''épargne populaire (LEP). Suivre vos mouvements vous permet
    de vérifier vos versements, vos retraits et l''application de vos intérêts.


    Avant de commencer, assurez-vous d''avoir vos identifiants de connexion à notre
    interface numérique ou d''être en contact avec votre conseiller en agence.


    Voici les étapes pour consulter votre suivi :


    1. Demandez l''accès au détail de vos comptes : via votre interface numérique
    ou auprès de nous, sélectionnez le Livret d''épargne populaire (LEP) parmi vos
    comptes actifs.

    2. Sélectionnez la période de consultation : choisissez la date de début et la
    date de fin pour laquelle vous souhaitez visualiser les mouvements (par exemple,
    le dernier mois ou l''année civile).

    3. Parcourez la liste des opérations : vous verrez apparaître chaque versement,
    chaque retrait ainsi que le crédit annuel des intérêts au taux de 2,5 %.

    4. Vérifiez le solde progressif : chaque ligne d''opération est accompagnée du
    solde du livret après l''exécution de ladite opération. Cela vous permet de confirmer
    que vous n''avez pas dépassé le plafond de 10 000 €.


    Vous saurez que l''opération est réussie lorsque vous aurez sous les yeux la liste
    chronologique de vos transactions et le solde actuel à jour. Si vous constatez
    une opération que vous ne reconnaissez pas, nous vous conseillons de nous en informer
    immédiatement.'
  domain: retail_banking
  product_category: lep
  document_type: how_to_guide
  source_authority: official
