- id: 7d9fbf60-2a7c-55a6-aae3-a1aa487a54ce
  title: Carte Mirabelle Premier — souscrire et activer
  body: 'La souscription à la Carte Mirabelle Premier est un processus simple qui
    s''effectue directement avec nous. Voici les étapes pour obtenir et activer votre
    nouvelle carte :


    1. Demande de souscription : vous exprimez votre souhait de souscrire à la Carte
    Mirabelle Premier ou de monter en gamme depuis une carte standard. Nous analysons
    alors votre profil et vos besoins financiers pour confirmer l''adéquation du produit.


    2. Vérification d''identité (KYC) : pour garantir la sécurité de vos avoirs, nous
    procédons à une vérification rigoureuse de votre identité. Vous devrez nous fournir
    une pièce d''identité officielle en cours de validité et, si nécessaire, un justificatif
    de domicile récent. Aucun changement de contrat n''est effectué sans cette validation
    conforme aux normes réglementaires.


    3. Validation et fabrication : une fois votre identité confirmée et le contrat
    signé, nous lançons la fabrication de votre carte. Vous recevrez alors un avis
    de confirmation de commande.


    4. Réception de la carte : votre Carte Mirabelle Premier vous est envoyée par
    voie postale à l''adresse sécurisée enregistrée dans nos dossiers. Le code secret,
    pour des raisons de sécurité, vous est communiqué séparément.


    5. Activation : votre carte est activée lors de votre premier retrait d''espèces
    à un distributeur automatique ou lors de votre premier paiement avec saisie du
    code confidentiel chez un commerçant. Une fois cette opération réalisée, vous
    avez pleinement accès à vos plafonds de 8 000 € pour les paiements et 1 500 €
    pour les retraits.


    Vous saurez que le processus est réussi lorsque vous recevrez la confirmation
    de votre première transaction sur votre interface numérique ou votre relevé.


    Pour toute question sur la gestion ultérieure de votre carte, vous pouvez consulter
    le document Carte Mirabelle Premier — informations réglementaires.'
