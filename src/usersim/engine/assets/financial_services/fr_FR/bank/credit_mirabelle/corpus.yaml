- id: d95d0f6e-4ccf-52b8-8de9-20766f579ebf
  title: 'Carte Mirabelle Premier — cotisation annuelle : explications'
  body: 'Pourquoi la Carte Mirabelle Premier comporte-t-elle une cotisation annuelle
    ?

    La cotisation annuelle de 132 € correspond au coût réel des services premium associés
    à cette carte. Elle couvre non seulement la gestion technique de l''instrument
    de paiement, mais également la mise à disposition de plafonds de paiement et de
    retrait nettement plus élevés que sur nos offres standards, ainsi qu''une infrastructure
    de sécurité renforcée pour vos opérations.


    Comment est prélevée cette cotisation ?

    Cette somme de 132 € est débitée une fois par an sur votre compte courant associé.
    Nous nous engageons à une transparence totale sur ce prélèvement, qui vous est
    notifié via vos relevés de compte.


    Existe-t-il des alternatives moins coûteuses ?

    Oui, si vos besoins en plafonds sont moins importants, nous pouvons vous orienter
    vers notre Formule Essentielle. Nous vous suggérons de consulter le document Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) — présentation
    pour comparer les services.'
