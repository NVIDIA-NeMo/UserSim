- id: 58c5a50d-f475-53bc-8e15-6961d693a1c2
  title: Carte Mirabelle Premier — opération échouée ou en attente
  body: 'Il peut arriver qu''une opération avec votre Carte Mirabelle Premier soit
    refusée ou reste en attente. Voici comment identifier la cause et résoudre la
    situation.


    Symptôme : Votre paiement est refusé au moment de la validation ou vous voyez
    une opération « en attente » sur votre suivi.


    Causes probables et vérifications :

    1. Dépassement des plafonds : Vérifiez si vous n''avez pas atteint vos limites.
    Le plafond de paiement est de 8 000 € sur 30 jours et le plafond de retrait est
    de 1 500 € sur 7 jours. Si l''un de ces seuils est franchi, l''opération est systématiquement
    bloquée.

    2. Solde insuffisant : Assurez-vous que le solde de votre compte permet de couvrir
    l''achat, incluant les éventuels frais de 1,5 % si le paiement est effectué hors
    zone euro.

    3. Blocage de sécurité : Pour votre protection, nous pouvons suspendre temporairement
    une carte en cas de comportement d''achat atypique détecté par nos systèmes de
    surveillance.


    Comment résoudre le problème :

    - Si le plafond est atteint : demandez-nous une augmentation temporaire ou définitive
    de vos plafonds. Nous analyserons votre solvabilité avant de valider ce changement.

    - Si le solde est insuffisant : effectuez un virement vers votre compte courant
    pour approvisionner vos fonds.

    - Si la carte est bloquée : demandez-nous de vérifier l''alerte de sécurité. Nous
    procéderons à une authentification forte de votre identité avant de lever le blocage.


    Quand escalader la situation :

    Si aucune de ces solutions ne fonctionne, nous ouvrirons un dossier d''incident
    auprès de notre direction d''agence. Vous recevrez un numéro de suivi et une réponse
    sous 48 heures ouvrées. En cas de litige persistant sur une opération, vous disposez
    d''un délai de 13 mois pour contester l''opération conformément à nos procédures
    de traitement des fraudes.'
  domain: cards
  product_category: carte_premier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
