- id: 1cb04e28-b077-57ae-af35-7b63c1ec7008
  title: Livret A — offre en cours
  body: 'Chers sociétaires, chers clients,


    Dans le cadre de notre engagement pour l''inclusion financière et la proximité,
    Crédit Mirabelle vous accompagne dans la sécurisation de votre épargne avec une
    offre de bienvenue simplifiée.


    **L''offre : Ouverture Facilitée et Taux Garanti**

    Du 1er janvier 2024 au 31 décembre 2024, nous simplifions le processus d''ouverture
    de votre Livret A pour vous permettre de profiter immédiatement d''un taux de
    rémunération de 1,7 %.


    **Conditions de l''offre** :

    - **Cible** : Clients actuels ne possédant pas encore de Livret A chez nous.

    - **Versement initial** : Un premier dépôt minimum de 10 € est requis pour activer
    le compte.

    - **Plafond** : L''offre s''applique sur tous les versements jusqu''à la limite
    réglementaire de 22 950 €.


    Cette offre vise à encourager la constitution d''une épargne de précaution saine
    et disponible. Rendez-vous avec votre conseiller en agence ou utilisez votre interface
    numérique pour activer votre livret dès aujourd''hui.'
