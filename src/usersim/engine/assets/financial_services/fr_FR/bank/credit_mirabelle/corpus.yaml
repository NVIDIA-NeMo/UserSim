- id: c050428e-fd12-54c4-8cb2-f0ac22b98bed
  title: Parts sociales Mirabelle — face à une offre concurrente type
  body: 'Il est fréquent de comparer les Parts sociales Mirabelle à un produit d''épargne
    classique, comme un livret bancaire standard du marché. Voici les différences
    fondamentales :


    - Nature de l''investissement : Un livret est un dépôt monétaire, tandis que les
    Parts sociales Mirabelle sont des titres de propriété. En achetant une part à
    15 €, vous devenez copropriétaire de votre banque.

    - Rémunération : Les livrets classiques ont des taux variables. Nos parts sociales
    offrent une rémunération de 2,1 %, reflétant la performance de notre modèle coopératif.

    - Gouvernance : Contrairement à un livret, les parts sociales vous donnent un
    droit de vote et une influence sur la gestion de la banque via l''assemblée générale.

    - Liquidité : Un livret permet des retraits instantanés. Le remboursement des
    parts sociales est soumis aux statuts de la coopérative et peut prendre plus de
    temps.


    C''est le choix idéal pour :

    - Le sociétaire engagé : qui privilégie le pouvoir de décision et le soutien local
    sur la disponibilité immédiate des fonds.

    - L''épargnant classique : qui préférera un produit comme le Livret A pour son
    épargne de précaution urgente.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 9cd7f3a7-f35f-5208-83b7-19d05508f4f1
  title: Parts sociales Mirabelle — informations sur les risques
  body: 'La souscription aux Parts sociales Mirabelle engage votre responsabilité
    financière et doit être effectuée en connaissance des risques associés au modèle
    coopératif.


    Absence de garantie des dépôts :

    Contrairement aux comptes de dépôt, les parts sociales sont des titres de capital
    et non des dépôts. À ce titre, elles ne sont pas couvertes par le Fonds de Garantie
    des Dépôts et de Résolution (FGDR), qui protège les avoirs jusqu''à 100 000 €
    par client et par banque pour les produits de dépôt.


    Risque de perte en capital :

    Le prix unitaire de 15 € représente la valeur nominale de la part. En cas de pertes
    financières importantes subies par la coopérative, la valeur de remboursement
    des parts pourrait être inférieure à ce montant initial, ou le remboursement pourrait
    être différé.


    Liquidité restreinte :

    Le capital social n''est pas liquide. Le remboursement de vos parts n''est pas
    automatique et immédiat ; il est soumis à l''agrément du conseil d''administration
    et aux capacités financières de l''institution au moment de la demande.


    Variabilité de la rémunération :

    Le taux de rémunération de 2,1 % est indicatif de la performance actuelle. Il
    peut être modifié, réduit ou annulé selon les résultats de l''exercice et les
    décisions votées en assemblée générale des sociétaires. Nous vous recommandons
    de consulter les rapports annuels pour suivre la santé financière de notre institution.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 77b2651d-4d40-5597-8b2f-9fee613bb00d
  title: Parts sociales Mirabelle — calcul et application des taux
  body: "Ce document détaille les modalités d'application de la rémunération des Parts\
    \ sociales Mirabelle à destination des agents de support.\n\nTaux applicable :\n\
    Un taux unique de rémunération de 2,1 % s'applique à l'ensemble des parts sociales\
    \ détenues, sans distinction de palier de capital ou de durée de détention.\n\n\
    Base de calcul :\nLa rémunération est calculée sur la valeur nominale totale des\
    \ parts. \nFormule : (Nombre de parts × 15 €) × 2,1 % = Rémunération annuelle\
    \ brute.\n\nCalendrier d'application :\n- Périodicité : Le taux est appliqué annuellement.\n\
    - Date de valeur : La rémunération est calculée sur la base des parts détenues\
    \ au cours de l'exercice comptable clos.\n- Versement : Le paiement intervient\
    \ après l'assemblée générale annuelle, une fois que les bénéfices distribuable\
    \ ont été actés.\n\nÉléments pouvant modifier le taux :\nLe taux de 2,1 % peut\
    \ être revu à la hausse ou à la baisse lors de la prochaine assemblée générale,\
    \ en fonction des résultats nets de la banque et des réserves obligatoires à constituer."
  domain: retail_banking
  product_category: parts_sociales
