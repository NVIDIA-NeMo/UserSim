- id: d67284a2-d8c7-5f5d-acd7-ce7f7bec2d1d
  title: 'Livret A — plafond des versements : explications'
  body: 'Question : Que se passe-t-il lorsque j''atteins le plafond de mon Livret
    A ?

    Réponse : Le plafond réglementé des versements est de 22 950 €. Une fois ce montant
    atteint, vous ne pouvez plus effectuer de nouveaux dépôts sur votre livret. Toutefois,
    vos intérêts continuent d''être calculés et crédités chaque année, ce qui signifie
    que le solde final de votre compte peut légalement dépasser les 22 950 €.


    Question : Puis-je augmenter ce plafond ?

    Réponse : Non, le plafond du Livret A est fixé par l''État et est identique dans
    tous les établissements bancaires. Si vous avez atteint cette limite et souhaitez
    continuer à épargner, nous vous invitons à consulter Livret A — face à un produit
    similaire de l''établissement pour découvrir d''autres options de placement.'
  domain: retail_banking
  product_category: livret_a
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 7fe9b21a-b35f-59bb-977d-d62d6f24eb54
  title: Livret A — résilier, clôturer ou changer de formule
  body: 'La clôture d''un Livret A est une opération simple qui peut être motivée
    par l''atteinte du plafond de versements ou un changement de stratégie d''épargne.


    Ce dont vous avez besoin avant de commencer :

    - Le numéro de votre Livret A.

    - Les coordonnées d''un compte de règlement (généralement votre compte courant
    Crédit Mirabelle) pour recevoir les fonds.


    Étapes pour clôturer votre Livret A :

    1. Demandez-nous la clôture de votre compte en précisant le numéro du livret concerné.

    2. Indiquez-nous le compte vers lequel vous souhaitez transférer l''intégralité
    du solde (capital et intérêts courus).

    3. Nous procéderons au virement des fonds et à la fermeture administrative du
    livret.

    4. Vous recevrez une confirmation de clôture indiquant le montant final transféré.


    Changer de formule (ex: passer vers un LEP) :

    Si vous souhaitez remplacer votre Livret A par un produit plus rémunérateur comme
    le Livret d''épargne populaire (LEP) en raison de l''évolution de vos revenus
    fiscaux :

    1. Demandez-nous d''ouvrir un LEP. Nous vérifierons votre éligibilité selon les
    normes en vigueur.

    2. Une fois le LEP ouvert avec le dépôt minimum requis, demandez-nous de clôturer
    votre Livret A.

    3. Demandez le transfert du solde du Livret A vers le LEP, dans la limite du plafond
    autorisé pour ce dernier.

    4. Nous vous confirmerons la réussite du transfert et la clôture du livret initial.


    Pour plus d''informations sur la gestion de vos comptes, vous pouvez consulter
    Compte courant et Formule Essentielle (carte à débit immédiat incluse) — résilier,
    clôturer ou changer de formule.'
  domain: retail_banking
  product_category: livret_a
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e5a51b49-a01b-529d-8f2f-4859aeb6c327
  title: Livret A — frais ou montant inattendu
  body: 'Le Livret A est un produit réglementé dont la gestion est normalement exempte
    de frais de tenue de compte ou de frais de virement. Si vous constatez un montant
    inattendu ou une opération inhabituelle, voici la marche à suivre.


    Symptôme : Un montant prélevé ou un solde différent de vos prévisions.


    Causes possibles et vérifications :

    1. Erreur de calcul des intérêts : Le Livret A utilise la règle des quinzaines.
    Si un versement a été effectué le 1er ou le 16 du mois, les intérêts sont optimisés.
    Un dépôt effectué le 2 du mois ne produira d''intérêts qu''à partir du 16. Vérifiez
    la date exacte de vos derniers mouvements.

    2. Plafond atteint : Si un versement automatique a été rejeté, vérifiez si votre
    solde a atteint le plafond de 22 950 €. Tout versement dépassant ce seuil est
    systématiquement refusé.

    3. Opération non autorisée : Si vous voyez un retrait que vous n''avez pas initié,
    il peut s''agir d''une erreur technique ou d''une tentative de fraude.


    Résolution :

    - Pour un doute sur le calcul des intérêts, demandez-nous un détail du calcul
    basé sur le taux de 1,7 %.

    - Pour un versement refusé, vérifiez votre solde. Si vous êtes au plafond, nous
    vous aiderons à orienter vos futurs versements vers un autre support.

    - Pour une opération suspecte, informez-nous immédiatement. Nous déclencherons
    une analyse de sécurité et, si la fraude est avérée, nous initierons le remboursement
    des opérations non autorisées dans les délais légaux.


    Escalade :

    Si la cause n''est pas identifiée lors de l''échange, nous ouvrirons un dossier
    de réclamation auprès de notre service conformité. Vous serez tenu informé de
    l''avancement du dossier et d''une éventuelle régularisation sous 10 jours ouvrés.'
  domain: retail_banking
  product_category: livret_a
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 04490b7c-c879-5e0a-b447-1e29a5e2be90
  title: Livret A — justificatifs à fournir
  body: 'Pour l''ouverture d''un Livret A au sein de Crédit Mirabelle, les conditions
    suivantes et les justificatifs correspondants doivent être réunis :


    | Condition | Justificatif requis | Résultat |

    | :--- | :--- | :--- |

    | Preuve d''identité | Pièce d''identité officielle en cours de validité (CNI,
    Passeport) | Validation KYC et ouverture possible |

    | Domiciliation | Justificatif de domicile récent (facture énergie, eau, téléphone)
    | Validation du dossier |

    | Capacité financière initiale | Versement d''un montant minimum de 10 € | Activation
    effective du compte |

    | Unicité du produit | Déclaration sur l''honneur de non-détention d''un autre
    Livret A | Conformité réglementaire |


    Le non-respect de l''une de ces conditions, notamment la détention d''un autre
    Livret A dans un établissement concurrent, entraînera le refus d''ouverture ou
    la clôture forcée du compte conformément aux directives de la Banque de France.'
  domain: retail_banking
  product_category: livret_a
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 12956d31-fc44-514b-8536-3ebff6e4040b
  title: Livret A — face à une offre concurrente type
  body: 'Lorsqu''il est comparé à un compte sur livret classique (non réglementé)
    proposé par d''autres établissements, le Livret A de Crédit Mirabelle présente
    des avantages structurels majeurs.


    Dimensions de comparaison :

    - Fiscalité : Le Livret A est totalement exonéré d''impôts et de prélèvements
    sociaux. À l''inverse, un livret classique est soumis au Prélèvement Forfaitaire
    Unique (PFU), réduisant le rendement net.

    - Rendement : Le Livret A offre un taux garanti de 1,7 %. Les comptes sur livrets
    classiques proposent souvent des taux d''appel temporaires, suivis d''une baisse
    rapide du taux nominal.

    - Sécurité : Avec un plafond de 22 950 €, le Livret A est un outil de gestion
    prudente, protégé par le FGDR jusqu''à 100 000 €.

    - Liquidité : Les deux produits offrent un accès immédiat aux fonds.


    Verdict :

    Le Livret A est le choix privilégié pour l''épargne de précaution et la sécurité
    fiscale. Le compte sur livret classique ne devient pertinent que pour les clients
    ayant déjà saturé leur plafond de 22 950 € et recherchant une liquidité totale
    sans contrainte de plafond.'
  domain: retail_banking
  product_category: livret_a
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 089d3881-5f85-50fc-b6ac-15abca9959ed
  title: Livret A — informations sur les risques
  body: 'L''investissement sur un Livret A au sein de Crédit Mirabelle est considéré
    comme présentant un niveau de risque très faible, mais nécessite la compréhension
    des points suivants :


    Risque de Capital : Il n''existe aucun risque de perte en capital sur le Livret
    A. Vos fonds sont disponibles et garantis. En cas de défaillance de l''établissement,
    vos dépôts sont protégés par le Fonds de Garantie des Dépôts et de Résolution
    (FGDR) jusqu''à un montant de 100 000 € par client et par banque.


    Risque d''Inflation : Le risque principal associé au Livret A est le risque de
    perte de pouvoir d''achat. Si le taux d''inflation annuel est supérieur au taux
    de rémunération de 1,7 %, le rendement réel de votre épargne devient négatif,
    même si le solde nominal de votre compte augmente.


    Risque Réglementaire : Le taux de 1,7 % n''est pas contractuel à long terme mais
    réglementé. Il peut être modifié par l''État à tout moment, ce qui impactera la
    rentabilité future de vos placements.


    Conformité et Transparence : Nous opérons en stricte conformité avec les directives
    de l''ACPR et le Code monétaire et financier. Nous nous engageons à vous informer
    de toute modification du taux réglementé dans les meilleurs délais. Nous ne fournissons
    aucune recommandation fiscale individualisée ; nous vous invitons à consulter
    un conseiller fiscal pour analyser l''impact de vos placements sur votre situation
    personnelle.


    Pour plus de précisions sur la rémunération, veuillez consulter Livret A — calcul
    et application des taux.'
  domain: retail_banking
  product_category: livret_a
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: bb64217f-284f-5b16-b14c-1eec3034d8af
  title: Livret A — calcul et application des taux
  body: 'Le Livret A est régi par un taux d''intérêt unique et réglementé applicable
    à l''ensemble des soldes.


    Taux applicable : 1,7 %


    Modalités de calcul :

    - Règle des quinzaines : Les intérêts sont calculés sur la base de quinzaines
    entières. Un montant versé après le 15 du mois ne commence à produire des intérêts
    qu''au 1er du mois suivant. De même, un retrait effectué avant le 15 du mois entraîne
    la perte des intérêts sur la quinzaine en cours pour la somme retirée.

    - Périodicité : Les intérêts sont capitalisés et crédités sur le compte une fois
    par an, au 31 décembre.


    Ce taux est fixe pour tous les clients de Crédit Mirabelle et ne dépend d''aucun
    palier de solde. Toute modification de ce taux résulte d''une décision administrative
    nationale et sera appliquée immédiatement à toutes les positions ouvertes.'
  domain: retail_banking
  product_category: livret_a
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f3f61557-811d-5271-a333-a1f5531f97f5
  title: Livret A — offre de parrainage et de fidélité
  body: "Soutenez la croissance de notre banque coopérative en nous recommandant vos\
    \ proches ! Du 1er octobre 2024 au 31 décembre 2024, Crédit Mirabelle récompense\
