- id: 540ce467-6064-5a66-9db4-ae160bef5d35
  title: Prêt immobilier à taux fixe Mirabelle — protection contre la fraude et les
    opérations non autorisées
  body: 'Au sein du Crédit Mirabelle, la sécurité de vos projets de vie est notre
    priorité. Le Prêt immobilier à taux fixe Mirabelle, par l''importance des sommes
    engagées, peut être la cible de tentatives de fraude sophistiquées.


    Les schémas de fraude les plus courants incluent l''usurpation d''identité pour
    modifier les coordonnées bancaires de remboursement ou l''envoi de faux courriels
    semblant provenir de notre institution ou de votre notaire, vous demandant de
    verser des fonds urgents sur un compte tiers pour « débloquer » vos fonds.


    Nous vous rappelons que le Crédit Mirabelle ne vous demandera jamais, par courriel
    ou par téléphone, de communiquer vos codes d''accès secrets, vos mots de passe
    ou de transférer des fonds vers un compte inconnu pour valider l''octroi de votre
    crédit. Toute modification de vos données personnelles ou bancaires nécessite
    une vérification rigoureuse de l''identité, conformément aux normes KYC, avant
    d''être validée.


    Si vous constatez une opération suspecte sur vos comptes ou si vous recevez une
    demande inhabituelle, nous vous invitons à nous en informer immédiatement. Conformément
    à notre engagement de transparence et de diligence, nous traitons les fraudes
    avec rigueur et garantissons le remboursement des opérations non autorisées selon
    les délais légaux. Vous disposez d''un délai de 13 mois pour contester toute opération
    mal exécutée ou non autorisée.


    Pour plus d''informations sur la sécurisation de vos comptes quotidiens, vous
    pouvez consulter le document intitulé « Compte courant et Formule Essentielle
    (carte à débit immédiat incluse) — protection contre la fraude et les opérations
    non autorisées ».'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 3e4847a8-0640-55d9-8471-8db41b979569
  title: Prêt immobilier à taux fixe Mirabelle — conditions générales
  body: 'Les présentes conditions régissent l''octroi et la gestion du Prêt immobilier
    à taux fixe Mirabelle. Ce contrat engage le client (l''emprunteur) et le Crédit
    Mirabelle selon les modalités suivantes :


    1. Octroi et Frais : L''ouverture du dossier et l''étude de solvabilité donnent
    lieu à la facturation de frais de dossier s''élevant à 1 000 €. Ces frais sont
    dus dès la mise en œuvre des services d''analyse.


    2. Conditions de Taux et Durée : Le prêt est conclu à un taux fixe, garantissant
    la stabilité des mensualités sur toute la durée du contrat. La durée maximale
    de remboursement est fixée à 25 ans. Les taux applicables sont déterminés selon
    la durée choisie : 3,35 % pour un engagement sur 20 ans et 3,55 % pour un engagement
    sur 25 ans.


    3. Obligations de Solvabilité : L''octroi du crédit est strictement conditionné
    à l''analyse de la solvabilité de l''emprunteur. Conformément à notre politique
    de risque, le taux d''endettement maximal autorisé ne peut excéder 35 % des revenus
    nets.


    4. Modifications et Résiliation : Toute modification des termes du contrat doit
    faire l''objet d''un avenant écrit. Le remboursement anticipé peut être effectué
    par le client, sous réserve du respect des modalités de remboursement et des éventuelles
    indemnités de remboursement anticipé prévues par le Code monétaire et financier.


    5. Protection : Les dépôts liés aux garanties sont protégés via le FGDR jusqu''à
    100 000 € par client. Le contrat est soumis au respect strict des directives de
    l''ACPR et de la Banque de France.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 77510fb4-a079-5a95-ab24-7c4beaf7cb10
  title: Prêt immobilier à taux fixe Mirabelle — pour qui et pour quels usages
  body: 'Le Prêt immobilier à taux fixe Mirabelle est conçu pour les particuliers
    et les sociétaires souhaitant acquérir un bien immobilier tout en bénéficiant
    d''une visibilité totale sur leur budget à long terme. Contrairement aux prêts
    à taux variable, notre solution vous protège contre la hausse des taux du marché.


    Ce produit est idéal pour :

    - L''achat d''une résidence principale ou secondaire.

    - Le financement d''un investissement locatif.

    - Les emprunteurs privilégiant la sécurité et la stabilité des mensualités.


    Caractéristiques principales :

    - Taux fixes compétitifs : nous proposons un taux de 3,35 % pour un crédit sur
    20 ans et un taux de 3,55 % pour un crédit sur 25 ans.

    - Horizon temporel : la durée maximale de remboursement est de 25 ans, permettant
    d''équilibrer le coût total du crédit et le montant des mensualités.

    - Transparence des coûts : des frais de dossier de 1 000 € sont appliqués lors
    de la mise en place du financement.


    Pour garantir la pérennité de votre projet et votre santé financière, nous appliquons
    un taux d''endettement maximal de 35 %. Ce seuil nous permet de nous assurer que
    vos mensualités restent compatibles avec vos revenus.


    Nous vous recommandons d''associer ce prêt à un compte de gestion quotidienne.
    Pour découvrir notre offre de base, consultez « Compte courant et Formule Essentielle
    (carte à débit immédiat incluse) — présentation ».'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 312cd763-53d1-5add-9b25-a3a32a44f2df
  title: 'Prêt immobilier à taux fixe Mirabelle — taux fixe sur 25 ans : explications'
  body: 'Questions fréquentes sur notre offre de financement à long terme :


    **Quel est le taux applicable pour un prêt sur 25 ans ?**

    Pour un engagement sur la durée maximale de 25 ans, le taux fixe appliqué est
    de 3,55 %. Ce taux reste inchangé pendant toute la durée du prêt, vous garantissant
    ainsi des mensualités constantes.


    **Pourquoi le taux sur 25 ans est-il différent de celui sur 20 ans ?**

    Le taux de 3,55 % reflète la durée d''immobilisation des fonds et le risque accru
    lié au temps. À titre de comparaison, un prêt sur 20 ans bénéficie d''un taux
    de 3,35 %.


    **Puis-je modifier ce taux en cours de contrat ?**

    Le principe même du taux fixe est l''immuabilité. Cependant, selon les conditions
    du marché et votre profil, des options de renégociation peuvent être étudiées
    avec votre conseiller, bien qu''elles ne soient pas garanties.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c32c9a2a-df20-5060-a58d-0471d6c24933
  title: Prêt immobilier à taux fixe Mirabelle — résilier, clôturer ou changer de
    formule
  body: 'Le remboursement anticipé ou la clôture de votre prêt immobilier est une
    opération importante qui nécessite un accompagnement précis. Voici la marche à
    suivre :


    **Prérequis** :

    - Votre numéro de contrat de prêt.

    - Le solde restant dû (disponible sur vos derniers relevés).

    - Un justificatif du motif (vente du bien, rachat de crédit, apport personnel).


    **Étapes de la procédure** :


    1. Demandez-nous une simulation de remboursement anticipé. Nous calculerons pour
    vous le montant exact du capital restant dû ainsi que les éventuelles indemnités
    de remboursement anticipé (IRA) conformément au Code monétaire et financier.


    2. Transmettez-nous le justificatif du remboursement (acte de vente notarié ou
    offre de rachat d''un autre établissement). Nous vérifierons la conformité du
    document.


    3. Validez le montant total à rembourser. Nous vous confirmerons la somme exacte
    incluant le capital, les intérêts courus et les frais applicables.


    4. Effectuez le virement des fonds vers le compte de prêt. Une fois les fonds
    reçus, nous procédons à la clôture technique du prêt.


    5. Recevez l''attestation de clôture. Nous vous enverrons un document officiel
    confirmant que le prêt est intégralement soldé et que les éventuelles garanties
    (hypothèque, caution) sont levées.


    Si vous souhaitez modifier la périodicité ou le montant de vos mensualités sans
    clôturer le prêt, veuillez vous référer aux modalités de modulation de vos échéances
    auprès de votre conseiller.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 4274b52d-89c9-5159-acf9-fd8aa23a4ce4
  title: Prêt immobilier à taux fixe Mirabelle — frais ou montant inattendu
  body: 'Lorsqu''un client signale un montant de prélèvement inhabituel ou l''apparition
    de frais non prévus sur son prêt immobilier, voici la procédure de diagnostic
    et de résolution pour le conseiller.


    **Symptômes courants** :

    - Mensualité plus élevée que prévu.

    - Apparition d''un débit unique de 1 000 €.

    - Écart entre le tableau d''amortissement et le prélèvement réel.


    **Causes probables et vérifications** :

    1. **Frais de dossier** : Vérifiez si le prêt vient d''être activé. Les frais
    d''application de 1 000 € sont prélevés lors de la mise en place du crédit.

    2. **Assurance emprunteur** : Vérifiez si la prime d''assurance a été réévaluée
    (par exemple, suite à un changement d''âge ou de situation) ou si le mode de prélèvement
    de l''assurance a changé.

    3. **Incident de paiement** : Vérifiez si une mensualité précédente a été rejetée,
    entraînant un cumul de prélèvements ou des commissions d''intervention.


    **Résolution** :

    - Si l''erreur provient d''un double prélèvement ou d''une erreur technique, nous
    procédons immédiatement à une régularisation comptable.

    - Si le client conteste la légitimité d''un frais, expliquez la nature du coût
    (ex: frais de dossier de 1 000 €) en vous référant aux conditions générales.


    **Escalade** :

    Si le litige persiste ou concerne un montant important, le dossier doit être transmis
    à la direction d''agence. En dernier recours, le client peut saisir le médiateur
    de la banque pour un traitement équitable du dossier.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f7b06646-053c-512b-851d-fb157d4f2321
  title: Prêt immobilier à taux fixe Mirabelle — justificatifs à fournir
  body: 'Pour l''étude de votre dossier de demande de Prêt immobilier à taux fixe
    Mirabelle, la fourniture des pièces suivantes est indispensable pour obtenir une
    décision d''octroi.


    | Document requis | Condition d''acceptation | Résultat si absent |

    | :--- | :--- | :--- |

    | Pièce d''identité officielle | Valide et en cours de validité | Dossier suspendu
    |

    | 3 derniers bulletins de salaire | Revenus stables et vérifiables | Analyse de
    solvabilité impossible |

    | Dernier avis d''imposition | Cohérence avec les revenus déclarés | Dossier incomplet
    |

    | Compromis ou promesse de vente | Signé par toutes les parties | Montant du prêt
    non validable |

    | Justificatifs d''apport personnel | Fonds disponibles et traçables | Taux d''endettement
    recalculé |


    **Règle d''or de l''éligibilité** :

    Une fois ces documents analysés, le critère déterminant est le taux d''endettement.
    Si le ratio charges/revenus est ≤ 35 %, le dossier est éligible à l''étude
    finale. Si le ratio est > 35 %, le prêt sera refusé ou nécessitera un apport plus
    conséquent pour réduire le montant emprunté.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: eligibility_matrix
  source_authority: official
