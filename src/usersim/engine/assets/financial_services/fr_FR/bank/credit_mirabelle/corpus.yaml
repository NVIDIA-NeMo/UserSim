- id: bdb6fddd-585b-58b1-a5cc-f6becddf2d98
  title: Prêt immobilier à taux fixe Mirabelle — offre en cours
  body: 'C''est le moment d''investir dans votre avenir immobilier avec Crédit Mirabelle.
    Nous avons le plaisir de vous confirmer la disponibilité de nos conditions préférentielles
