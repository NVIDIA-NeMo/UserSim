    *   **Taux pour une durée de 20 ans** : 3,35 %

    *   **Taux pour une durée de 25 ans** : 3,55 %


    **Conditions d''application**

    *   **Durée maximale** : Le prêt peut être étalé sur une période maximale de 25
    ans.

    *   **Sérénité** : Le taux choisi lors de la signature s''applique à l''intégralité
    du capital emprunté jusqu''au terme du contrat.

    *   **Analyse** : L''application de ces taux est conditionnée par une analyse
    de solvabilité positive et le respect d''un taux d''endettement maximal de 35
    %.


    Pour connaître les frais annexes à la mise en place de ces taux, veuillez consulter
    Prêt immobilier à taux fixe Mirabelle — grille tarifaire.'
