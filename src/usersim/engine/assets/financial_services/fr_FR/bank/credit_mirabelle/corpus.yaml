- id: 7890782b-7c62-5430-98a3-0a1277dfce5a
  title: Prêt immobilier à taux fixe Mirabelle — bonnes pratiques de sécurité du compte
  body: "La sécurité de vos engagements financiers est notre priorité absolue. Le\
    \ Prêt immobilier à taux fixe Mirabelle engage des sommes importantes sur le long\
    \ terme ; il est donc essentiel de protéger l'accès aux informations liées à votre\
    \ crédit.\n\nNous vous alertons sur les tentatives de fraude courantes : certains\
    \ individus peuvent tenter de vous contacter en se faisant passer pour un conseiller\
    \ Crédit Mirabelle pour vous proposer une renégociation frauduleuse de votre taux\
    \ ou demander le paiement de frais urgents pour « débloquer » des fonds. \n\n\
    Sachez que nous ne vous demanderons jamais\n- Votre code secret ou vos identifiants\
    \ de connexion via un lien envoyé par e-mail ou SMS.\n- Un virement immédiat vers\
    \ un compte tiers pour valider une modification de contrat.\n- La transmission\
    \ de documents d'identité sensibles sans passer par nos canaux d'authentification\
    \ forte.\n\nConformément à nos normes KYC, toute modification de vos données personnelles\
    \ ou de l'état de votre compte nécessite une vérification rigoureuse de votre\
    \ identité. \n\nSi vous constatez une opération suspecte ou si vous avez un doute\
    \ sur la provenance d'une communication, informez-nous immédiatement. Nous vous\
    \ rappelons que vous disposez d'un délai de 13 mois pour contester toute opération\
    \ non autorisée ou mal exécutée. En cas d'urgence, demandez-nous de suspendre\
    \ temporairement vos accès numériques pour protéger vos avoirs.\n\nPour plus d'informations\
    \ sur la protection globale de vos comptes, nous vous suggérons de consulter le\
    \ document intitulé \"Compte courant et Formule Essentielle (carte à débit immédiat\
    \ incluse) — bonnes pratiques de sécurité du compte\"."
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: security_advisory
