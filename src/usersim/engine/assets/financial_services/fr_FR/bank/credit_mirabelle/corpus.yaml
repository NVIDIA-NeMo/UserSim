- id: 7440ce1d-89e4-506f-9faa-6398dbda67ba
  title: Carte Mirabelle Premier — traiter une demande courante de bout en bout
  body: "Ce guide vous accompagne dans la procédure de remplacement de votre Carte\
    \ Mirabelle Premier en cas de perte ou de vol, afin de sécuriser vos fonds et\
    \ de rétablir vos services rapidement.\n\n**Prérequis :**\nVous devez être le\
    \ titulaire du compte. Munissez-vous d'une pièce d'identité valide pour la vérification.\n\
    \n**Étapes de traitement :\n\n1. **Signalement immédiat** : Informez-nous sans\
    \ délai de la perte ou du vol de votre carte. Précisez la date et l'heure approximatives\
    \ de la disparition. \n2. **Mise en opposition** : Nous procéderons immédiatement\
    \ au blocage définitif de la carte pour empêcher toute opération non autorisée.\
    \ Nous vous confirmerons l'opposition par un message de confirmation.\n3. **Vérification\
    \ d'identité (KYC)** : Nous effectuerons une vérification rigoureuse de votre\
    \ identité. Vous devrez nous fournir les justificatifs requis pour nous assurer\
    \ que vous êtes bien le détenteur légitime du compte.\n4. **Commande du nouveau\
    \ support** : Une fois l'identité validée, demandez-nous de commander une nouvelle\
    \ Carte Mirabelle Premier. Nous enregistrerons la demande de réémission.\n5. **Réception\
    \ et activation** : Vous recevrez votre nouvelle carte par voie postale. Nous\
    \ vous confirmerons l'envoi et vous indiquerez la marche à suivre pour l'activer\
    \ lors de votre premier retrait au distributeur.\n\n**Comment savoir que la demande\
    \ a abouti ?**\nLe processus est terminé lorsque vous recevez votre nouvelle carte\
    \ et que vous effectuez un premier retrait réussi. Notez que vos plafonds habituels\
    \ (8 000 € pour les paiements sur 30 jours et 1 500 € pour les retraits sur 7\
    \ jours) sont automatiquement rétablis sur le nouveau support.\n\nEn cas d'opérations\
    \ frauduleuses constatées avant le blocage, vous disposez de 13 mois pour contester\
    \ ces transactions."
  domain: cards
  product_category: carte_premier
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1cc555e9-7f27-5720-9970-922e54075707
  title: Carte Mirabelle Premier — écart avec vos relevés
  body: "Ce document aide le conseiller à traiter les réclamations d'un client constatant\
    \ une différence entre ses calculs personnels et le solde affiché sur son relevé\
    \ lié à la Carte Mirabelle Premier.\n\n**Symptôme :**\nLe client signale qu'un\
    \ achat effectué à l'étranger a été débité pour un montant supérieur au prix affiché\
    \ lors de la transaction, ou qu'une opération semble répétée.\n\n**Causes probables\
    \ et points de contrôle :\n\n1. **Frais de conversion monétaire** : Vérifiez si\
    \ la transaction a eu lieu hors zone euro. Si c'est le cas, rappelez au client\
    \ que nous appliquons des frais de paiement hors zone euro de 1,5 %. L'écart constaté\
    \ est souvent dû à l'ajout de ce pourcentage au montant converti.\n2. **Opérations\
    \ en attente (Autorisations)** : Certains commerçants (hôtels, loueurs de voitures)\
    \ effectuent une « pré-autorisation » qui bloque une somme temporairement. Cela\
    \ peut créer l'illusion d'un débit supplémentaire alors que la somme sera libérée\
    \ sous quelques jours.\n3. **Erreur de traitement** : Vérifiez si l'opération\
    \ n'a pas été débitée deux fois par erreur technique.\n\n**Procédure de résolution\
    \ :\n\n- **S'il s'agit des frais de 1,5 %** : Expliquez au client la nature de\
    \ ces frais, conformément à notre politique de transparence. \n- **S'il s'agit\
    \ d'une erreur ou d'une fraude** : Si le client maintient que l'opération est\
    \ mal exécutée ou non autorisée, nous ouvrirons un dossier de contestation. \n\
    \n**Échelon d'escalade :\n\nConformément à notre politique de gestion des litiges,\
    \ le client dispose de 13 mois pour contester une opération. Si le litige n'est\
    \ pas résolu au niveau du conseiller, la demande est transmise à la direction\
    \ d'agence, puis, en dernier recours, au médiateur de la banque."
  domain: cards
  product_category: carte_premier
  document_type: troubleshooting
  source_authority: official
