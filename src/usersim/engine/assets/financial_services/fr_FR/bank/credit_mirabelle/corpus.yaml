- id: e5495bd0-96da-52e2-9b96-faa15b40c22b
  title: 'Carte Mirabelle Premier — frais de paiement hors zone euro : explications'
  body: 'Question : Comment sont calculés les frais lorsque j''utilise ma Carte Mirabelle
    Premier en dehors de la zone euro ?


    Réponse : Pour chaque opération de paiement effectuée dans une devise autre que
    l''euro, Crédit Mirabelle applique une commission de 1,5 % sur le montant de la
    transaction. Ces frais couvrent le coût réel du traitement des opérations internationales
    et la sécurisation des échanges avec les banques correspondantes.


    Question : Ces frais s''appliquent-ils également aux retraits d''espèces ?


    Réponse : La commission de 1,5 % mentionnée ci-dessus concerne spécifiquement
    les paiements. Pour les retraits, veuillez vous référer à la grille tarifaire
    générale. Nous vous rappelons que votre plafond de retrait est de 1 500 € sur
    7 jours, quel que soit le lieu du retrait.


    Pour plus de détails sur la gestion de vos coûts, vous pouvez consulter la Carte
    Mirabelle Premier — grille tarifaire.'
