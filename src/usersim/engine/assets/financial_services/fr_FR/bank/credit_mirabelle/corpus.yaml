- id: 43bbaf2b-8cbd-513d-8ffb-1209d2af583c
  title: Prêt immobilier à taux fixe Mirabelle — opération refusée ou bloquée
  body: 'Symptôme : Vous tentez de solliciter un prêt immobilier ou de modifier les
    modalités de votre crédit actuel, mais votre demande est refusée ou semble bloquée
    dans le processus.


    Causes probables et vérifications :

    - Dépassement du taux d''endettement : Votre situation financière actuelle peut
    porter votre taux d''endettement au-delà de la limite maximale de 35 %. C''est
    la cause la plus fréquente de blocage lors de l''analyse de solvabilité.

    - Dossier KYC incomplet : L''absence d''un justificatif d''identité valide ou
    d''un justificatif de domicile récent bloque systématiquement toute action modifiant
    l''état d''un compte, conformément à nos normes de sécurité.

    - Durée non conforme : Si vous demandez une durée de remboursement supérieure
    à 25 ans, le système rejettera la demande car elle excède la durée maximale autorisée
    pour ce produit.


    Résolution :

    - Si le problème concerne l''endettement, nous pouvons analyser avec vous la possibilité
    d''un apport personnel plus important pour réduire le montant emprunté et repasser
    sous la barre des 35 %.

    - Si le blocage est lié aux documents, fournissez-nous les pièces manquantes.
    Nous procéderons à la vérification rigoureuse de votre identité avant de débloquer
    le dossier.


    Échelon d''escalade :

    Si la situation n''est pas résolue lors de votre échange avec votre conseiller,
    nous transmettrons votre dossier à la direction d''agence pour une analyse approfondie.
    En dernier recours, vous pouvez solliciter le médiateur de la banque.


    Pour plus de détails sur les critères d''acceptation, consultez : Prêt immobilier
    à taux fixe Mirabelle — conditions d''éligibilité.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 394018b4-4deb-590c-ac15-f0024904f99b
  title: Prêt immobilier à taux fixe Mirabelle — quand changer ou monter en gamme
  body: "Ce document aide le conseiller à identifier le moment opportun pour proposer\
    \ une évolution du financement immobilier du client.\n\nLe Prêt immobilier à taux\
    \ fixe Mirabelle est idéal pour les clients recherchant une visibilité totale\
    \ sur leurs mensualités, avec des taux sécurisés de 3,35 % (sur 20 ans) ou 3,55\
    \ % (sur 25 ans). \n\nIl devient pertinent d'envisager un changement ou une renégociation\
    \ dans les cas suivants :\n- Baisse significative des taux du marché : Si les\
    \ taux actuels sont nettement inférieurs à 3,35 %, une renégociation peut réduire\
    \ le coût total du prêt.\n- Augmentation substantielle des revenus : Si le client\
    \ peut désormais réduire sa durée de prêt (tout en restant sous le plafond de\
    \ 25 ans) pour diminuer le coût des intérêts.\n- Modification du projet immobilier\
    \ : Passage d'une résidence secondaire à une résidence principale, pouvant justifier\
    \ un nouveau montage financier.\n\nLe conseiller doit toujours vérifier que le\
    \ nouveau montage respecte le taux d'endettement maximal de 35 %. Si le client\
    \ souhaite simplement augmenter ses plafonds de services quotidiens liés à son\
    \ compte, orientez-le vers la Carte Mirabelle Premier."
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: comparison
  source_authority: official
