- id: 8a53a544-fa01-5cee-96b0-061ec1c2ee15
  title: Carte Mirabelle Premier — reconnaître les arnaques visant ce produit
  body: "La Carte Mirabelle Premier est un produit haut de gamme, et c'est précisément\
    \ ce positionnement que certains fraudeurs tentent d'exploiter pour vous tromper.\
    \ Nous souhaitons vous alerter sur les méthodes d'escroquerie les plus fréquentes\
    \ ciblant les détenteurs de ce service.\n\nL'arnaque la plus courante consiste\
    \ en la réception d'un appel, d'un SMS ou d'un courriel prétendant provenir de\
    \ Crédit Mirabelle. Le fraudeur vous informe que votre Carte Mirabelle Premier\
    \ a été « bloquée pour des raisons de sécurité » ou que vous êtes éligible à une\
    \ « mise à jour exclusive » de vos plafonds de paiement. L'objectif est de vous\
    \ inciter à communiquer vos codes secrets, vos identifiants de connexion ou à\
    \ valider une opération via votre application pour « débloquer » la situation.\
    \ \n\nSachez que nous ne vous demanderons jamais votre code confidentiel, ni de\
    \ valider une opération de sécurité par un virement ou un achat pour « vérifier\
    \ » votre compte. Toute demande insistante vous demandant de transférer des fonds\
    \ vers un « compte de refuge » est une tentative de fraude.\n\nSi vous avez un\
    \ doute sur la légitimité d'une communication, nous vous invitons à interrompre\
    \ l'échange immédiatement. Nous vous rappelons que, conformément à notre politique\
    \ de protection, vous disposez d'un délai de 13 mois pour contester toute opération\
    \ mal exécutée ou non autorisée sur votre compte.\n\nEn cas de suspicion de fraude\
    \ ou si vous avez communiqué des informations sensibles, demandez-nous sans délai\
    \ de bloquer votre carte. Nous procéderons alors à sa mise en opposition immédiate\
    \ et à l'émission d'un nouveau support sécurisé. Votre vigilance est notre meilleure\
    \ alliée pour garantir la sécurité de vos avoirs."
  domain: cards
