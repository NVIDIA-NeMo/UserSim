  institution_id: credit_mirabelle
- id: 3a9f9611-ff15-506d-a7f1-5fd06f8aa23a
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    face à une offre concurrente type
  body: 'Lorsqu''on compare le Compte courant et Formule Essentielle (carte à débit
    immédiat incluse) à une offre de banque commerciale classique, plusieurs points
    de différenciation apparaissent.


    **Coût et Transparence**

    Notre offre propose une cotisation mensuelle claire de 7,90 €, incluant la carte
    à débit immédiat. Là où certaines banques concurrentes multiplient les frais optionnels,
    nous privilégions un modèle global et transparent. Pour les clients fragiles,
    nous limitons les frais à 3 € par mois maximum, un engagement social fort.


    **Modèle de Gouvernance**

    Contrairement aux banques traditionnelles, Crédit Mirabelle est une banque coopérative.
    En ouvrant ce compte, vous avez la possibilité de devenir sociétaire en souscrivant
    des parts sociales, vous donnant ainsi un droit de vote et un poids dans la gouvernance
    locale.


    **Sécurité et Protection**

    Nous offrons la même garantie de sécurité que les grands établissements, avec
    la protection du FGDR jusqu''à 100 000 € par client.


    **Verdict**

    Une offre concurrente peut être préférable si elle propose des frais nuls pour
    les jeunes. Cependant, notre solution est supérieure pour ceux qui recherchent
    la proximité d''une agence physique, une éthique coopérative et une protection
    accrue des clients en difficulté financière.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 220bff78-ea5a-558c-a60b-5820a53a796f
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    informations sur les risques
  body: 'L''ouverture d''un Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) implique la compréhension des risques financiers associés à la gestion
    d''un compte bancaire.


    **Risque lié au découvert**

    L''utilisation d''un découvert, même autorisé, engendre un coût financier. Le
    taux d''intérêt applicable est de 15,9 %. Un recours prolongé au découvert peut
    dégrader votre situation financière et augmenter votre endettement global. Nous
    vous rappelons que le coût total du crédit doit être pris en compte lors de vos
    décisions de dépenses.


    **Risque lié aux frais d''incidents**

    Toute opération entraînant un dépassement du découvert autorisé ou réalisée sans
    provision peut déclencher une commission d''intervention de 8 €. Bien que nous
    plafonnions ces frais à 80 € par mois, ils représentent un coût réel qui réduit
    votre solde disponible.


    **Protection des dépôts**

    En cas de défaillance de l''établissement, vos avoirs sont protégés par le Fonds
    de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant de 100 000
    € par client. Au-delà de ce seuil, les fonds ne sont plus couverts par cette garantie
    légale.


    **Responsabilité en cas de fraude**

    Le client est responsable de la conservation confidentielle de ses moyens de paiement.
    Toutefois, nous nous engageons à rembourser les opérations non autorisées signalées
    dans les délais, sachant que vous disposez d''un délai de 13 mois pour contester
    une opération mal exécutée ou non autorisée.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 81b1ad33-0a09-52d1-a61f-74c7f8f9cb3a
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    calcul et application des taux
  body: 'Ce document détaille les modalités d''application du taux d''intérêt pour
    le Compte courant et Formule Essentielle (carte à débit immédiat incluse).


    **Taux du découvert autorisé : 15,9 %**


    **Modalités d''application :**

    - **Champ d''application :** Ce taux s''applique exclusivement aux soldes débiteurs
    du compte, dès lors que le compte devient négatif, même si ce montant reste dans
    la limite du découvert autorisé accordé au client.

    - **Base de calcul :** Le taux de 15,9 % est un taux annuel. Le calcul des intérêts
    est effectué quotidiennement sur le solde débiteur et les intérêts sont généralement
    débités mensuellement ou trimestriellement sur le compte.

    - **Évolution :** Ce taux est fixe pour l''ensemble des clients détenteurs de
    la Formule Essentielle, sauf modification contractuelle notifiée par la banque.


    Il ne doit pas être confondu avec la commission d''intervention (8 €), qui est
    un frais fixe et non un taux d''intérêt.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: ca2b969e-c621-5604-bbda-eca7abc4bfc1
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    offre de parrainage et de fidélité
  body: 'Nous avons le plaisir de vous présenter notre programme de parrainage et
    de fidélité, conçu pour renforcer les liens au sein de notre coopérative. En tant
    que nouveau client, vous découvrirez que le Compte courant et Formule Essentielle
    (carte à débit immédiat incluse) est le point de départ idéal pour une gestion
    sereine de votre budget, avec une cotisation transparente de 7,90 € par mois.


    Nous encourageons nos sociétaires et clients à recommander Crédit Mirabelle à
    leur entourage. Le parrainage est un acte de confiance qui nous permet de soutenir
    l''inclusion financière dans nos régions. Pour chaque nouveau membre rejoignant
    notre institution et souscrivant à la Formule Essentielle, nous valorisons cet
    engagement par un geste de fidélité, dont les modalités sont détaillées lors de
    votre rendez-vous en agence.


    En choisissant notre modèle coopératif, vous optez pour une banque où la proximité
    et la transparence sont prioritaires. Nous nous engageons à vous accompagner durablement
    dans vos projets financiers tout en limitant l''impact des frais de gestion.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6eeeb8f4-6fdb-59a0-baff-a1b6783628af
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    bonnes pratiques de sécurité du compte
  body: 'La sécurité de vos avoirs est notre priorité absolue. Pour protéger votre
    Compte courant et Formule Essentielle (carte à débit immédiat incluse), nous vous
    demandons d''appliquer rigoureusement les principes de vigilance suivants.


    L''authentification forte est obligatoire pour toute opération sensible. Nous
    ne vous demanderons jamais, par téléphone, par SMS ou par e-mail, de nous communiquer
    votre code secret, vos identifiants de connexion ou un code de validation reçu
    par notification. Toute demande de ce type doit être considérée comme une tentative
    de fraude.


    Soyez attentifs aux points suivants :

    - Ne partagez jamais vos codes d''accès avec un tiers, même un proche.

    - Vérifiez régulièrement vos relevés pour détecter toute opération inhabituelle.

    - Utilisez des mots de passe complexes et uniques pour vos interfaces numériques.


    En cas de suspicion de fraude ou de perte de votre carte à débit immédiat, nous
    vous invitons à nous signaler l''incident sans délai. Conformément à notre engagement
    de diligence, nous traitons les fraudes rapidement et garantissons le remboursement
    des opérations non autorisées selon les délais légaux. Nous vous rappelons que
    vous disposez d''un délai de 13 mois pour contester une opération mal exécutée
    ou non autorisée.


    Sachez que Crédit Mirabelle applique des procédures de vérification d''identité
    rigoureuses (normes KYC) avant toute modification de vos données personnelles
    ou tout changement d''état de votre compte. Cette rigueur est la seule garantie
    d''une protection efficace contre l''usurpation d''identité.


    Pour plus de détails sur la lutte contre la cybercriminalité, vous pouvez consulter
    le document Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — protection contre la fraude et les opérations non autorisées.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 80c94554-6fbc-5a9f-84bb-7367941bcb7e
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    modification des conditions
  body: 'Le présent document précise les modalités de modification des conditions
    contractuelles applicables au Compte courant et Formule Essentielle (carte à débit
    immédiat incluse). En tant que banque coopérative, nous nous engageons à une transparence
    totale concernant l''évolution de nos tarifs et services.


    Nous nous réservons le droit de modifier les conditions tarifaires, notamment
    la cotisation mensuelle de 7,90 €, le taux du découvert autorisé fixé à 15,9 %,
    ainsi que les commissions d''intervention de 8 € (plafonnées à 80 € par mois).


    Toute modification des conditions générales ou tarifaires vous sera notifiée par
    voie écrite (courrier postal ou messagerie sécurisée) avec un préavis minimal
    de deux mois avant son entrée en vigueur. Ce délai vous permet d''analyser l''impact
    du changement sur votre gestion financière.


    À réception de cette notification, vous disposez des options suivantes :

    1. Accepter la modification en continuant l''utilisation de vos services.

    2. Demander la clôture de votre compte sans frais, conformément aux dispositions
    légales, si la modification ne vous convient pas.


    Nous rappelons que le respect du Code monétaire et financier et les directives
    de l''ACPR encadrent strictement ces évolutions pour garantir un traitement équitable
    de tous nos clients. Les modifications ne peuvent en aucun cas remettre en cause
    la protection de vos dépôts, assurée par le FGDR jusqu''à 100 000 € par client.


    Pour consulter l''intégralité des clauses contractuelles, veuillez vous référer
    au document Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    — conditions générales.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: bbc61dd2-9093-5b90-a28d-c68595c5f8df
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    prise en main pas à pas
  body: 'Ce guide est destiné aux conseillers pour accompagner le client dans l''activation
    et la première utilisation du Compte courant et Formule Essentielle (carte à débit
    immédiat incluse).


    Étape 1 : Vérification de l''identité et conformité KYC

    Avant toute ouverture, assurez-vous d''avoir collecté et vérifié les pièces d''identité
    originales et le justificatif de domicile. Aucun compte ne peut être activé sans
    une validation d''identité conforme aux normes de sécurité de l''établissement.


    Étape 2 : Paramétrage du compte

    Procédez à l''ouverture du compte courant et affectez la Formule Essentielle.
    Expliquez clairement au client que cette formule inclut une carte à débit immédiat
    et qu''elle est facturée 7,90 € par mois. Précisez que ce montant reflète le coût
    réel des services et la sécurité des opérations.


    Étape 3 : Information sur les frais d''incidents

    Il est primordial d''informer le client sur les risques liés au découvert. Détaillez
    le taux du découvert autorisé de 15,9 % et le fonctionnement de la commission
    d''intervention, s''élevant à 8 € par opération, avec un plafond mensuel de 80
    €.


    Étape 4 : Remise et activation de la carte

    Remettez la carte à débit immédiat au client ou informez-le de sa date d''expédition.
    Guidez-le dans la définition de son code secret via le canal sécurisé. Rappelez-lui
    que la carte est l''outil principal de gestion quotidienne de sa Formule Essentielle.


    Étape 5 : Présentation des canaux de support

    Indiquez au client qu''il peut vous contacter directement, se rendre en agence
    ou utiliser l''interface numérique pour tout suivi. Mentionnez que pour toute
    contestation d''opération, il dispose d''un délai légal de 13 mois.


    Pour plus de détails sur les conditions d''accès, consultez le document Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) — conditions d''éligibilité.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 52935053-5c08-5cd4-9cdb-225ee56cbf1c
  title: 'Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    commission d''intervention : explications'
  body: 'Qu''est-ce qu''une commission d''intervention sur mon Compte courant et Formule
    Essentielle ?


    La commission d''intervention est un frais appliqué lorsqu''une opération (paiement
    ou retrait) entraîne un dépassement du découvert autorisé ou s''effectue alors
    qu''aucun découvert n''est autorisé. Pour la Formule Essentielle, ce frais est
    de 8 € par opération.


    Existe-t-il un plafond pour ces frais ?


    Oui, dans un souci de protection de nos clients, nous appliquons un plafond mensuel.
    Le montant total des commissions d''intervention ne peut excéder 80 € par mois,
    quel que soit le nombre d''opérations en cause.


    Comment éviter ces frais ?


    Nous vous recommandons de surveiller votre solde via notre interface numérique
    ou de nous contacter pour mettre en place un découvert autorisé. Pour plus de
    détails sur les tarifs, veuillez consulter le document Compte courant et Formule
    Essentielle (carte à débit immédiat incluse) — grille tarifaire.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c40f53c1-e64d-5cbf-98f3-4c6bb3fea19c
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    effectuer une modification
  body: 'Vous souhaitez modifier les informations liées à votre Compte courant et
    Formule Essentielle (carte à débit immédiat incluse) ? Voici la marche à suivre
    pour mettre à jour vos données en toute sécurité.


    Prérequis :

    Pour toute modification, vous devez être en mesure de présenter une pièce d''identité
    valide et originale (CNI, passeport) afin de respecter nos normes KYC obligatoires.


    Étape 1 : Notification de la demande

    Indiquez-nous précisément l''élément que vous souhaitez modifier (adresse postale,
    numéro de téléphone, adresse e-mail ou statut matrimonial). Nous vous demanderons
    de confirmer vos informations actuelles pour sécuriser l''accès.


    Étape 2 : Fourniture des justificatifs

    Selon la nature de la modification, nous vous demanderons de nous remettre un
    justificatif récent (par exemple, un justificatif de domicile de moins de trois
    mois pour un changement d''adresse). Nous vérifierons la conformité du document
    avec vos données.


    Étape 3 : Validation et application

    Une fois l''identité et le justificatif validés, nous procédons à la mise à jour
    de votre dossier dans nos systèmes. Cette action est immédiate pour les coordonnées
    de contact.


    Étape 4 : Confirmation de la modification

    Nous vous confirmons la prise en compte du changement par un message via votre
    interface numérique ou par courrier, selon vos préférences de communication.


    Sachez que si vous souhaitez modifier votre formule tarifaire (par exemple, passer
    de la Formule Essentielle à une autre offre), la procédure implique un avenant
    à votre contrat. Vous pouvez consulter les étapes de résiliation ou de changement
    dans le document Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) — résilier, clôturer ou changer de formule.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0fe1fc8a-6c18-506f-a8b4-5f777c884a7e
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    problèmes d'accès ou de connexion
  body: 'Si vous rencontrez des difficultés pour accéder aux services numériques liés
    à votre Compte courant et Formule Essentielle (carte à débit immédiat incluse),
    nous vous invitons à suivre ce diagnostic.


    Symptôme : « Je ne parviens pas à me connecter à mon espace client ou mon accès
    est bloqué ».


    Causes probables :

    - Saisie erronée de l''identifiant ou du mot de passe.

    - Compte temporairement verrouillé après plusieurs tentatives infructueuses pour
    des raisons de sécurité.

    - Expiration de vos identifiants ou mise à jour nécessaire de l''application.


    Procédure de résolution :

    1. Vérifiez que vos identifiants sont correctement saisis (attention aux majuscules
    et minuscules).

    2. Si le compte est bloqué, demandez-nous de réinitialiser vos accès. Nous procéderons
    alors à une vérification rigoureuse de votre identité conformément aux normes
    KYC avant toute action.

    3. Si le problème persiste malgré des identifiants corrects, nous vérifierons
    l''état technique de votre compte pour s''assurer qu''aucune restriction administrative
    n''est active.


    Résolution et escalade :

    L''accès est généralement rétabli immédiatement après la validation de votre identité.
    Si le blocage est lié à une anomalie technique plus complexe, nous ouvrirons un
    ticket d''incident auprès de notre direction technique. Vous recevrez une notification
    dès que le service sera rétabli.


    Pour tout problème lié à une transaction spécifique plutôt qu''à l''accès global,
    veuillez consulter le document Compte courant et Formule Essentielle (carte à
    débit immédiat incluse) — opération échouée ou en attente.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f0dd8eed-b69c-5aa1-810a-aa664323b320
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    niveaux d'accès
  body: 'Le Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    est accessible selon différents niveaux de droits, basés sur le statut du client
    au sein de notre institution coopérative.


    | Profil | Conditions d''accès | Droits et Services inclus |

    | :--- | :--- | :--- |

    | Client Particulier | Justificatifs d''identité et de domicile conformes | Gestion
    quotidienne, carte à débit immédiat, cotisation de 7,90 €/mois. |

    | Client Sociétaire | Détention de parts sociales | Tous les services du client
    particulier + droit de vote en assemblée générale + participation à la gouvernance
    locale. |

    | Client en fragilité financière | Justificatif de situation sociale | Accès à
    une offre spécifique plafonnée à 3 € par mois pour limiter l''impact des frais
    d''incidents. |


    Note pour le conseiller : La vérification systématique de l''identité est obligatoire
    avant l''attribution de tout niveau d''accès. Pour les sociétaires, assurez-vous
    que la souscription aux parts sociales est finalisée.'
