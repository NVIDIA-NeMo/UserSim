- id: 41e65822-dc80-5549-b560-74b08eaacd58
  title: Parts sociales Mirabelle — opération échouée ou en attente
  body: 'Il peut arriver qu''une demande de souscription aux Parts sociales Mirabelle
    ne soit pas traitée immédiatement. Voici comment identifier et résoudre le problème.


    Symptôme : Vous avez demandé la souscription de parts sociales, mais votre statut
    de Sociétaire n''est pas encore actif ou le montant n''a pas été débité.


    Causes probables et vérifications :

    1. Solde insuffisant : Vérifiez que votre compte courant dispose d''un solde suffisant
    pour couvrir l''achat des parts (15 € par unité). Si le solde est insuffisant,
    l''opération est bloquée.

    2. Dossier KYC incomplet : La souscription aux parts sociales modifie l''état
    de votre compte et vos droits de propriété. Si votre pièce d''identité a expiré
    ou si des informations sensibles ne sont pas à jour, nous suspendons l''opération
    par sécurité.

    3. Délai de traitement administratif : L''enregistrement des titres de propriété
    peut prendre quelques jours ouvrés selon les périodes d''assemblée générale.


    Comment résoudre l''incident :

    - Si le solde était insuffisant : Approvisionnez votre compte et demandez-nous
    de relancer la souscription.

    - Si le dossier est incomplet : Fournissez-nous la pièce d''identité ou le justificatif
    de domicile requis. Nous validerons votre identité conformément aux normes de
    sécurité avant de finaliser l''achat.


    Échelon d''escalade :

    Si le problème persiste après la mise à jour de vos documents et de votre solde,
    nous transmettrons votre dossier à la direction d''agence pour une validation
    manuelle. Vous recevrez une notification de confirmation dès que vos parts sociales
    seront officiellement créditées à votre nom.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
