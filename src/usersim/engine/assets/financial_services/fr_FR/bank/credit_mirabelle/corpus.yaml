- id: 8e7ba74d-111b-5053-a98e-e803e79ed930
  title: Prêt immobilier à taux fixe Mirabelle — plafonds, restrictions et cas particuliers
  body: 'Ce document est destiné aux conseillers pour l''encadrement technique du
    Prêt immobilier à taux fixe Mirabelle. Le respect strict de ces plafonds est impératif
    pour garantir la sécurité financière de nos sociétaires et la conformité aux directives
    de l''ACPR.


    Paramètres de prêt et limites :

    - Durée maximale : Le prêt peut être consenti sur une période allant jusqu''à
    25 ans maximum. Au-delà de cette limite, aucune dérogation n''est autorisée.

    - Taux d''endettement : Le taux d''endettement maximal autorisé est de 35 %. Ce
    seuil inclut l''ensemble des charges financières du client et doit être vérifié
    rigoureusement avant toute proposition.

    - Frais de dossier : Des frais d''application forfaitaires de 1 000 € sont systématiquement
    appliqués lors de la mise en place du crédit.


    Conditions tarifaires (Taux Fixes) :

    - Pour une durée de 20 ans : le taux applicable est de 3,35 %.

    - Pour une durée de 25 ans : le taux applicable est de 3,55 %.


    Cas particuliers et restrictions :

    L''octroi du crédit est conditionné par une analyse complète de la solvabilité.
    Aucun engagement de prêt ne doit être communiqué au client avant la clôture de
    cette analyse. Nous nous engageons à ne jamais minimiser le coût total du prêt,
    incluant les intérêts et l''assurance.


    Mentions légales et conformité :

    L''offre est soumise au respect du Code monétaire et financier. Le client doit
    être informé du délai de réflexion obligatoire de dix jours avant l''acceptation
    définitive de l''offre de prêt. Les dépôts associés sont protégés par le FGDR
    jusqu''à 100 000 € par client.


    Pour le détail des justificatifs requis, se référer à : Prêt immobilier à taux
    fixe Mirabelle — justificatifs à fournir.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: product_sheet
