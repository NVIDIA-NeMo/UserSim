  institution_id: credit_mirabelle
- id: caff622e-9cb8-5b59-8554-a1384ebb9f92
  title: Carte Mirabelle Premier — coûts et frais
  body: "Nous nous engageons à une transparence totale sur les tarifs de nos services.\
    \ Voici les informations relatives aux coûts de la Carte Mirabelle Premier.\n\n\
    **Quel est le prix annuel de la carte ?**\nLa Carte Mirabelle Premier est soumise\
    \ à une cotisation annuelle de 132 €. Ce montant reflète le coût réel des services\
    \ haut de gamme et la sécurité accrue des opérations liées à ce produit.\n\n**Y\
    \ a-t-il des frais supplémentaires pour les achats effectués à l'étranger ?**\n\
    Oui, pour tout paiement effectué en dehors de la zone euro, nous appliquons des\
    \ frais de paiement hors zone euro de 1,5 % du montant de la transaction. \n\n\
    **Ces frais sont-ils prélevés immédiatement ?**\nLes frais de 1,5 % sont appliqués\
    \ au moment du traitement de l'opération et apparaissent sur votre relevé de compte\
    \ en complément du montant de l'achat converti dans votre devise."
