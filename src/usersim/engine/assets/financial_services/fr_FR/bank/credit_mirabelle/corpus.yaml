- id: a9f3dc77-e216-5a6f-b5eb-9a611b0c82eb
  title: Livret d'épargne populaire (LEP) — face à une offre concurrente type
  body: 'Le Livret d''épargne populaire (LEP) du Crédit Mirabelle se distingue des
    offres d''épargne classiques du marché par sa vocation sociale et sa rémunération
    bonifiée.


    Comparaison LEP vs Épargne classique :

    - Rémunération : Avec un taux de 2,5 %, le LEP surpasse généralement les livrets
    bancaires standards du marché, qui offrent souvent des taux variables et moins
    avantageux.

    - Fiscalité : Comme les livrets réglementés, le LEP est totalement exonéré d''impôts
    et de prélèvements sociaux, contrairement aux comptes sur livrets classiques où
    les intérêts sont taxés.

    - Accessibilité : Le LEP est réservé aux revenus modestes (≤ 23 028 € par part),
    là où les livrets classiques sont ouverts à tous sans condition de revenu.

    - Plafond : Le LEP est limité à 10 000 €, tandis que les offres concurrentes non
    réglementées proposent souvent des plafonds beaucoup plus élevés.


    Qui choisir ?

    - Le LEP est le meilleur choix pour tout client éligible fiscalement souhaitant
    maximiser le rendement de son épargne de précaution sans aucun risque.

    - Une offre concurrente classique est préférable pour les clients dont les revenus
    dépassent le plafond d''éligibilité ou qui souhaitent épargner au-delà de 10 000
    €.


    Pour une comparaison avec un autre produit de notre gamme, consultez : Livret
    A — face à un produit similaire de l''établissement.'
  domain: retail_banking
  product_category: lep
  document_type: comparison
  source_authority: official
  placeholder: true
