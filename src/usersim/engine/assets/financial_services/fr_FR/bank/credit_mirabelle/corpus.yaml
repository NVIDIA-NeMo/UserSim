  institution_id: credit_mirabelle
- id: 882da53b-1592-565c-992a-34ad6fa27a62
  title: Livret A — confidentialité et protection des données
  body: 'Crédit Mirabelle s''engage à protéger la confidentialité de vos informations
    et la sécurité de vos dépôts, conformément aux directives de l''ACPR et de la
    Banque de France.


    **Protection des dépôts**

    L''intégralité de vos avoirs sur votre Livret A est protégée par le Fonds de Garantie
    des Dépôts et de Résolution (FGDR). En cas de défaillance de l''établissement,
    vos dépôts sont garantis jusqu''à 100 000 € par client et par banque. Cette garantie
    s''applique à l''ensemble de vos comptes chez nous, incluant vos livrets et comptes
    courants.


    **Traitement des données personnelles**

    Nous collectons et traitons vos données uniquement pour les finalités suivantes
    : la gestion de votre compte, la lutte contre le blanchiment et le financement
    du terrorisme (LCB-FT) et la conformité aux obligations légales. Vos données sont
    traitées dans le respect du Règlement Général sur la Protection des Données (RGPD).


    **Transparence et accès**

    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Nous vous assurons qu''aucune information sensible n''est
    transmise à des tiers sans votre consentement explicite, sauf requête d''une autorité
    judiciaire ou administrative compétente.


    **Conformité réglementaire**

    Le Livret A est un produit réglementé. À ce titre, Crédit Mirabelle respecte strictement
    le Code monétaire et financier, notamment en ce qui concerne le calcul des intérêts
    et le respect du plafond de 22 950 €. Toute modification de nos politiques de
    confidentialité vous sera communiquée par voie numérique ou postale dans les délais
    légaux.'
  domain: retail_banking
  product_category: livret_a
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5c38b771-2ca8-5221-9d45-061e8f87f618
  title: Livret A — reconnaître les arnaques visant ce produit
  body: 'Le Livret A est l''un des produits d''épargne les plus courants, ce qui en
    fait une cible privilégiée pour les tentatives de fraude. À Crédit Mirabelle,
    nous tenons à vous protéger en vous aidant à identifier les signaux d''alerte.


    Certaines arnaques prennent la forme de promesses de rendements exceptionnels.
    Soyez vigilant : le taux du Livret A est réglementé et s''élève actuellement à
    1,7 %. Toute proposition d''un établissement se présentant comme un partenaire
    de Crédit Mirabelle vous promettant un taux nettement supérieur pour un produit
    identique est systématiquement frauduleuse.


    Les fraudeurs peuvent également utiliser le « phishing » (hameçonnage) en vous
    envoyant des courriels ou des SMS urgents, prétendant que votre livret est bloqué
    ou nécessite une mise à jour de vos données personnelles. Nous vous rappelons
    que nous ne vous demanderons jamais vos codes secrets, vos mots de passe ou vos
    identifiants de connexion par message ou par téléphone.


    Une autre variante consiste en des sollicitations pour « débloquer » des fonds
    via des frais d''activation. Le Livret A est un produit liquide et accessible
    ; aucun frais caché ne doit être payé pour accéder à vos propres économies.


    Si vous constatez une opération que vous n''avez pas autorisée sur votre Livret
    A, nous vous garantissons le remboursement des opérations non autorisées selon
    les délais légaux. Vous disposez d''un délai de 13 mois pour contester une opération
    mal exécutée ou non autorisée. En cas de doute, informez-nous immédiatement pour
    que nous puissions sécuriser vos avoirs.'
  domain: retail_banking
  product_category: livret_a
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 942d4742-12f4-5bf0-8654-a5b73d8677e9
  title: Livret A — plafonds, restrictions et cas particuliers
  body: 'Ce document détaille les limites techniques et les conditions de gestion
    du Livret A pour l''assistance aux clients.


    Le Livret A est régi par un plafond de dépôts strict. Le plafond des versements
    est fixé à 22 950 €. Ce montant représente la somme maximale que le client peut
    déposer sur son compte. Il est important de préciser au client que les intérêts
    capitalisés chaque année s''ajoutent au solde et peuvent donc porter le solde
    total au-delà de 22 950 €, mais aucun nouveau versement ne sera possible tant
    que le solde redescendra sous ce seuil.


    Concernant l''ouverture du compte, un versement initial minimum est requis. Le
    montant minimal pour ouvrir un Livret A est de 10 €. Ce montant doit être disponible
    sur le compte courant du client au moment de la souscription.


    Restrictions et particularités :

    - Un client ne peut détenir qu''un seul Livret A, tous établissements confondus.
    L''ouverture d''un second livret dans une autre banque entraînerait la clôture
    automatique du premier.

    - Les fonds sont disponibles à tout moment, sans frais de retrait.

    - La rémunération est appliquée selon un taux de 1,7 %.


    En cas de demande de versement dépassant le plafond de 22 950 €, l''opération
    sera systématiquement refusée par nos systèmes de contrôle. Il convient alors
    d''orienter le client vers d''autres solutions d''épargne selon son profil.'
  domain: retail_banking
  product_category: livret_a
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 46780be6-6c35-5110-930e-c7c73ed2ff76
  title: Livret A — coûts et frais
  body: 'Vous souhaitez ouvrir un Livret A et vous vous interrogez sur les frais associés.
    Voici les réponses à vos questions les plus fréquentes :


    **L''ouverture d''un Livret A est-elle payante ?**

    Non, l''ouverture d''un Livret A est entièrement gratuite. Le seul montant requis
    est le versement initial minimum de 10 €, qui constitue vos propres économies
    et non des frais.


    **Y a-t-il des frais de gestion annuels ou mensuels ?**

    Non, il n''y a aucun frais de tenue de compte ni de frais de gestion pour le Livret
    A. Nous nous engageons à une transparence totale : ce produit est exempt de frais
    de fonctionnement.


    **Le retrait de mes fonds engendre-t-il des frais ?**

    Absolument pas. Vous pouvez effectuer des retraits depuis votre Livret A vers
    votre compte courant sans aucun frais, et ce, à tout moment.


    Pour plus de détails sur l''ensemble de nos tarifs, nous vous invitons à consulter
    le document Livret A — grille tarifaire.'
  domain: retail_banking
  product_category: livret_a
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 7733f5be-311e-578a-930b-c93171c19b58
  title: Livret A — consulter le suivi ou l'historique
  body: 'Pour suivre l''évolution de votre épargne et vérifier vos derniers mouvements
    sur votre Livret A, nous vous accompagnons dans la démarche suivante :


    1. Demandez-nous l''extraction de l''historique des opérations de votre Livret
    A pour la période souhaitée.

    2. Nous procédons à la vérification de votre identité conformément à nos normes
    de sécurité et de connaissance client (KYC).

    3. Nous vous communiquons la liste détaillée de vos transactions, incluant les
    dates de versements, les montants des retraits et les intérêts crédités.

    4. Nous vous confirmons le solde actuel de votre compte, en précisant la distance
    restante par rapport au plafond de 22 950 €.


    Vous saurez que l''opération est réussie lorsque vous aurez reçu le récapitulatif
    complet de vos mouvements et que le solde affiché correspond à vos derniers calculs.


    Pour toute modification de vos informations de contact permettant la réception
    de ces documents, vous pouvez vous référer au guide Livret A — effectuer une modification.'
  domain: retail_banking
  product_category: livret_a
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: dc727061-06b9-5755-ba21-a505a82e5691
  title: Livret A — opération refusée ou bloquée
  body: 'Il peut arriver qu''une opération sur votre Livret A soit refusée. Voici
    comment identifier la cause et résoudre la situation.


    **Symptôme : Votre versement vers le Livret A est refusé.**

    - **Cause probable :** Le plafond réglementaire de 22 950 € a été atteint. Si
    le solde de votre livret, incluant les intérêts courus, atteint ce montant, aucun
    nouveau dépôt n''est possible.

    - **Action :** Vérifiez le solde actuel de votre compte. Si le plafond est atteint,
    vous devrez soit effectuer un retrait pour libérer de l''espace, soit orienter
    votre épargne vers un autre produit.


    **Symptôme : Votre demande de retrait est bloquée.**

    - **Cause probable 1 :** Solde insuffisant pour couvrir le montant demandé.

    - **Cause probable 2 :** Défaut de vérification d''identité. Pour des raisons
    de sécurité, certaines opérations sensibles requièrent une authentification forte.

    - **Action :** Confirmez le solde disponible. Si le solde est suffisant, nous
    vous demanderons de fournir une pièce d''identité valide pour lever le blocage.


    **Quand escalader la demande ?**

    Si le solde est inférieur à 22 950 € et que vos documents d''identité sont à jour,
    mais que l''opération reste bloquée, nous transmettrons votre dossier à la direction
    d''agence pour une analyse technique approfondie. Vous recevrez une notification
    de résolution sous 48 heures ouvrées.'
  domain: retail_banking
  product_category: livret_a
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: ebdfeeae-306e-5ff5-9ca6-25a068861620
  title: Livret A — quand changer ou monter en gamme
  body: 'Ce guide aide le conseiller à identifier le moment opportun pour proposer
    une alternative au Livret A.


    Le Livret A est idéal pour l''épargne de précaution grâce à sa liquidité totale
    et son taux de 1,7 %. Cependant, un changement de stratégie est recommandé dans
    les cas suivants :


    1. **Plafond atteint :** Lorsque le solde atteint 22 950 €, le client ne peut
    plus capitaliser sur ce support. Il convient alors de proposer un autre produit
    d''épargne.

    2. **Éligibilité au LEP :** Si le client a un revenu fiscal de référence modeste,
    le Livret d''épargne populaire (LEP) offre un taux bonifié supérieur à celui du
    Livret A. C''est la priorité absolue pour l''inclusion financière.

    3. **Recherche de gouvernance :** Pour un client souhaitant s''impliquer dans
    la vie coopérative de Crédit Mirabelle, la souscription de parts sociales est
    l''alternative appropriée pour devenir sociétaire.


    **Résumé pour le client :**

    - Conserver le Livret A pour l''argent disponible immédiatement.

    - Passer au LEP pour un meilleur rendement (sous condition de ressources).

    - S''orienter vers d''autres supports une fois les 22 950 € atteints.'
  domain: retail_banking
  product_category: livret_a
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 338d2e89-c45b-5c55-a4c0-85842a02295f
  title: Livret A — comparaison avec les alternatives et quand ne pas le choisir
  body: 'Le Livret A est la solution de référence pour l''épargne liquide, mais il
    n''est pas adapté à tous les projets financiers. Voici une analyse comparative
    pour vous aider à choisir.


    **Pourquoi choisir le Livret A ?**

    - **Sécurité totale :** Vos dépôts sont protégés par le FGDR jusqu''à 100 000
    € par client.

    - **Disponibilité :** L''argent reste disponible 24h/24 et 7j/7 sans aucun frais
    de retrait.

    - **Fiscalité avantageuse :** Les intérêts, au taux de 1,7 %, sont exonérés d''impôts
    et de prélèvements sociaux.


    **Quand ne pas le choisir ?**

    - **Si vous êtes éligible au LEP :** Le Livret d''épargne populaire (LEP) est
    réservé aux foyers aux revenus modestes et propose un taux plus attractif que
    les 1,7 % du Livret A. Si vous remplissez les conditions, privilégiez le LEP.

    - **Si vous avez déjà atteint le plafond :** Avec un plafond de 22 950 €, le Livret
    A ne peut pas absorber des surplus d''épargne importants.

    - **Si vous cherchez un rendement élevé à long terme :** Le Livret A privilégie
    la liquidité sur la performance. Pour des projets immobiliers ou de long terme,
    d''autres financements ou placements sont plus appropriés.


    En résumé, choisissez le Livret A pour votre « épargne de secours ». Si vos revenus
    sont modestes, vérifiez d''abord votre éligibilité au LEP. Si vous avez déjà 22
    950 € de côté, explorez nos autres solutions d''investissement.'
  domain: retail_banking
  product_category: livret_a
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 580fb685-cecf-5b67-9804-0482b23fad32
  title: Livret A — éligibilité et souscription
  body: 'Vous possédez déjà un compte chez nous et souhaitez ouvrir un Livret A. Voici
    les informations essentielles sur l''éligibilité et la souscription :


    **Qui peut ouvrir un Livret A ?**

    Le Livret A est accessible à tous, sans condition de revenus ni de nationalité.
    Toute personne physique peut en détenir un, à condition de ne pas posséder déjà
    un autre Livret A dans un autre établissement bancaire.


    **Quel est le montant minimum pour commencer ?**

    Pour activer votre compte, un versement initial minimum de 10 € est requis. Ce
    montant sera crédité sur votre livret dès l''ouverture.


    **Quelles sont les étapes de souscription ?**

    La souscription est rapide. Nous vous demanderons simplement de confirmer votre
    identité via nos procédures KYC et de nous indiquer le montant du premier versement
    (minimum 10 €). Une fois ces étapes validées, votre livret est actif et commence
    à produire des intérêts au taux de 1,7 %.


    Pour plus de détails sur la procédure, consultez le document Livret A — souscrire
    et activer.'
  domain: retail_banking
  product_category: livret_a
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6e0899d9-a477-50d2-85f8-29f2d1d21625
  title: Livret A — traiter une demande courante de bout en bout
  body: 'Voici la procédure pas à pas pour effectuer un versement depuis votre compte
    courant vers votre Livret A, l''une des opérations les plus fréquentes.


    **Prérequis :**

    - Posséder un compte courant Crédit Mirabelle actif.

    - Avoir un solde suffisant sur le compte courant pour couvrir le versement.

    - Avoir un Livret A ouvert et actif.


    **Étapes de l''opération :**

    1. Indiquez-nous le montant exact que vous souhaitez transférer vers votre Livret
    A.

    2. Nous vérifions que le montant demandé, ajouté au solde actuel, ne dépasse pas
    le plafond réglementaire de 22 950 €.

    3. Nous procédons à l''authentification forte de votre identité pour valider le
    mouvement de fonds.

    4. Nous exécutons le transfert immédiat du compte courant vers le Livret A.

    5. Nous vous confirmons la réussite de l''opération en vous communiquant le nouveau
    solde de votre livret et le montant restant avant d''atteindre le plafond de 22
    950 €.


    **Comment savoir si l''opération a réussi ?**

    L''opération est confirmée dès que nous vous annonçons le nouveau solde. Vous
    pourrez également constater le débit sur votre compte courant et le crédit sur
    votre Livret A lors de votre prochaine consultation d''historique.'
  domain: retail_banking
  product_category: livret_a
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f407ae48-8081-57e3-a76f-7e7b5110af44
  title: Livret A — écart avec vos relevés
  body: 'Ce document aide le conseiller à traiter les réclamations de clients constatant
    un écart entre le solde attendu et le solde affiché sur leurs relevés de Livret
    A.


    **Symptôme : Le client estime que les intérêts crédités sont inférieurs à ses
    calculs.**

    - **Cause probable :** Méconnaissance de la règle des quinzaines. Les intérêts
    du Livret A sont calculés le 1er et le 16 de chaque mois. Un versement effectué
    le 2 du mois ne produira des intérêts qu''à partir du 16.

    - **Vérification :** Examinez les dates de versements et de retraits sur le relevé.
    Appliquez le taux de 1,7 % sur les périodes de quinzaines complètes.

    - **Fix :** Expliquez au client le fonctionnement du calcul par quinzaine pour
    justifier l''écart.


    **Symptôme : Un versement apparaît sur le relevé mais pas dans le solde actuel.**

    - **Cause probable :** Opération en cours de traitement ou erreur d''affichage
    technique.

    - **Vérification :** Vérifiez si l''opération est marquée comme « en attente »
    ou si elle a été annulée suite au dépassement du plafond de 22 950 €.

    - **Fix :** Si l''opération a été refusée pour cause de plafond, informez le client
    et proposez une solution alternative.


    **Procédure d''escalade :**

    Si l''écart persiste après vérification des quinzaines et du plafond, et qu''une
    erreur de calcul est suspectée, le conseiller doit transmettre le dossier à la
    direction d''agence pour un audit des écritures comptables. Le client sera informé
    du délai de traitement, généralement sous 5 jours ouvrés.'
  domain: retail_banking
  product_category: livret_a
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 181d2739-cf4c-5822-b330-19d61c625466
  title: Livret d'épargne populaire (LEP) — présentation
  body: 'Le Livret d''épargne populaire (LEP) est une solution d''épargne réglementée
    conçue pour soutenir les foyers aux revenus modestes. Fidèle à l''engagement de
    Crédit Mirabelle en faveur de l''inclusion financière et de la proximité, ce livret
    permet de constituer une épargne de précaution liquide, disponible à tout moment,
    tout en bénéficiant d''une rémunération avantageuse.


    Ce produit se distingue par un taux d''intérêt attractif de 2,5 %, visant à protéger
    le pouvoir d''achat de nos sociétaires et clients. L''accès au LEP est conditionné
    par le respect d''un plafond de revenu fiscal de référence, fixé pour une part
    à 23 028 €. Cette condition nous permet de garantir que cet outil de soutien financier
    bénéficie prioritairement à ceux qui en ont le plus besoin.


    Pour ouvrir un compte, un versement initial minimum de 30 € est requis. Ce montant
    constitue le socle de votre épargne et permet l''activation immédiate du livret.
    Afin de maintenir l''équilibre et la vocation sociale du produit, le montant total
    des dépôts est limité par un plafond de 10 000 €. Tout versement dépassant ce
    montant sera refusé, bien que les intérêts capitalisés puissent porter le solde
    au-delà de cette limite.


    Comme pour l''ensemble de nos produits d''épargne, vos fonds sont protégés par
    le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à 100 000 € par
    client. Chez Crédit Mirabelle, nous privilégions la transparence totale : aucune
    commission de gestion n''est prélevée sur ce livret, reflétant notre volonté de
    minimiser l''impact des frais pour nos clients en situation de fragilité financière.


    Le LEP est un complément idéal à d''autres solutions de gestion. Pour vos besoins
    de liquidités quotidiennes, nous vous invitons à consulter la fiche produit Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) — présentation.'
  domain: retail_banking
  product_category: lep
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 4b3d66a3-db25-5ec7-b27f-882934bf8cb6
  title: 'Livret d''épargne populaire (LEP) — taux de rémunération : explications'
  body: "Comment est calculé le rendement de mon Livret d'épargne populaire ?\nLe\
    \ rendement de votre LEP est basé sur un taux d'intérêt de 2,5 %. Ce taux est\
    \ réglementé, ce qui signifie qu'il est fixé par l'État pour garantir une rémunération\
    \ homogène et attractive. Les intérêts sont calculés selon la règle des quinzaines\
    \ et sont crédités annuellement sur votre compte.\n\nLe taux de 2,5 % s'applique-t-il\
    \ à l'ensemble de mon épargne ?\nOui, ce taux unique s'applique à l'intégralité\
    \ des sommes déposées sur votre livret, dans la limite du plafond de 10 000 €.\
    \ \n\nOù puis-je consulter l'évolution de ce taux ?\nNous mettons à jour régulièrement\
    \ nos documents d'information. Vous pouvez retrouver le détail actuel dans le\
    \ document Livret d'épargne populaire (LEP) — grille des taux."
  domain: retail_banking
  product_category: lep
