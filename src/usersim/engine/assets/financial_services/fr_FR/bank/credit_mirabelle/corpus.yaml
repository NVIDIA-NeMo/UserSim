- id: cea08b2e-196c-585c-9751-88f72ec26320
  title: Parts sociales Mirabelle — face à un produit similaire de l'établissement
  body: 'Pour optimiser votre épargne, il est essentiel de distinguer les Parts sociales
    Mirabelle du Livret A, deux produits aux objectifs différents.


    | Dimension | Parts sociales Mirabelle | Livret A |

    | :--- | :--- | :--- |

    | Objectif | Propriété et Gouvernance | Épargne de précaution |

    | Rémunération | 2,1 % | Taux réglementé (voir grille) |

    | Liquidité | Limitée (sujet à approbation) | Immédiate |

    | Ticket d''entrée | 15 € (par part) | Versement minimum à l''ouverture |

    | Risque | Capital lié à la coopérative | Garanti par le FGDR jusqu''à 100 000
    € |


    Les Parts sociales Mirabelle conviennent aux clients souhaitant s''impliquer durablement
    dans la vie de leur banque et devenir copropriétaires de l''établissement. Le
    Livret A est préférable pour ceux qui recherchent une disponibilité totale de
    leurs fonds et une sécurité maximale sans engagement de gouvernance.


    Pour plus de détails sur le Livret A, consultez le document Livret A — présentation.'
  domain: retail_banking
