- id: 0635548e-4618-5e88-8d54-585c6218b1b3
  title: Carte Mirabelle Premier — frais ou montant inattendu
  body: 'Lorsqu''un client signale un montant prélevé inattendu ou des frais non identifiés
    sur son compte lié à sa Carte Mirabelle Premier, suivez cet ordre de vérification
    :


    Symptôme : Le client constate un prélèvement de 132 €.

    Cause probable : Il s''agit de la cotisation annuelle de la Carte Mirabelle Premier.
    Vérifiez la date d''anniversaire du contrat pour confirmer qu''il s''agit du renouvellement
    annuel.


    Symptôme : Le montant d''un achat effectué à l''étranger est supérieur au prix
    affiché en magasin.

    Cause probable : L''opération a été réalisée hors zone euro. Vérifiez si la commission
    de 1,5 % a été appliquée sur le montant converti. Expliquez au client que ce frais
    reflète le coût réel des opérations internationales.


    Symptôme : Une opération de paiement a été refusée alors que le solde du compte
    est suffisant.

    Cause probable : Le plafond de paiement a été atteint. Vérifiez si le cumul des
    paiements sur les 30 derniers jours a atteint la limite de 8 000 €. Si c''est
    le cas, informez le client que ce seuil est une sécurité liée à sa formule.


    Symptôme : Un retrait d''espèces a été refusé.

    Cause probable : Le plafond de retrait hebdomadaire a été atteint. Vérifiez si
    le cumul des retraits sur les 7 derniers jours a atteint 1 500 €.


    Résolution et Escalade :

    Si la cause n''est pas identifiée par ces vérifications, ou si le client conteste
    la légitimité d''une opération, nous ouvrirons un dossier de contestation. Rappelez
    au client qu''il dispose de 13 mois pour contester une opération non autorisée.
    Le dossier sera ensuite transmis à la direction d''agence pour analyse approfondie
    avant toute proposition de remboursement.'
