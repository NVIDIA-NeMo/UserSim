- id: 4988eae9-fd39-5959-be88-e035cee9b8e2
  title: Parts sociales Mirabelle — effectuer une modification
  body: 'Ce guide vous accompagne dans la modification de votre investissement en
    Parts sociales Mirabelle, notamment pour augmenter votre nombre de parts et renforcer
    votre engagement au sein de notre coopérative.


    Préalables : Vous devez être titulaire d''un compte chez Crédit Mirabelle et disposer
    d''une pièce d''identité valide.


    Étape 1 : Expression du besoin

    Informez-nous du nombre de parts sociales supplémentaires que vous souhaitez acquérir.
    Nous calculerons ensemble le montant total nécessaire, sur la base du prix unitaire
    de 15 € par part.


    Étape 2 : Validation de l''identité

    Pour garantir la sécurité de l''opération, nous procéderons à une vérification
    de votre identité conformément aux normes KYC. Si vos documents sont obsolètes,
    nous vous demanderons de nous fournir une pièce d''identité à jour.


    Étape 3 : Transfert des fonds

    Demandez-nous d''effectuer le transfert des fonds depuis votre compte courant
    vers le capital social. Nous confirmerons le montant exact (nombre de parts x
    15 €) avant de valider l''opération.


    Étape 4 : Confirmation de l''augmentation

    Nous vous notifierons la validation de l''opération. Vous recevrez une attestation
    mise à jour indiquant votre nouveau nombre de parts et confirmant votre maintien
    du statut de sociétaire.


    Étape 5 : Vérification de la rémunération

    Vous pourrez alors constater l''application du taux de rémunération de 2,1 % sur
    l''ensemble de vos parts lors du prochain arrêté annuel.'
