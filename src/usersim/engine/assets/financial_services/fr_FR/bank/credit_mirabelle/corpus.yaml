- id: 4e82904d-cf6c-5059-a7bd-c955823c923f
  title: Prêt immobilier à taux fixe Mirabelle — confidentialité et protection des
    données
  body: 'Dans le cadre de l''octroi et de la gestion du Prêt immobilier à taux fixe
    Mirabelle, Crédit Mirabelle s''engage à traiter vos données avec la plus haute
    confidentialité, conformément au Règlement Général sur la Protection des Données
    (RGPD) et au secret professionnel bancaire.


    **Collecte et Utilisation des Données**

    Pour analyser votre solvabilité et vérifier le respect du taux d''endettement
    maximal de 35 %, nous collectons des informations sur vos revenus, vos charges
    et votre patrimoine. Ces données sont exclusivement utilisées pour l''évaluation
    du risque et la mise en place du crédit.


    **Vérification d''Identité**

    Conformément aux normes KYC (Know Your Customer) et aux directives de l''ACPR,
    nous effectuons des vérifications rigoureuses de l''identité avant toute modification
    de contrat ou déblocage de fonds. Ces données sont conservées selon les durées
    légales en vigueur.


    **Protection des Dépôts et Garantie**

    Bien que ce document concerne un produit de crédit, nous rappelons que tous vos
    dépôts au sein de notre institution sont protégés par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR) jusqu''à 100 000 € par client et par banque.


    **Vos Droits**

    Vous disposez d''un droit d''accès, de rectification et d''opposition au traitement
    de vos données. Pour toute demande, vous pouvez vous adresser à votre direction
    d''agence ou à notre délégué à la protection des données.


    Le traitement équitable des clients et la transparence sur les coûts, tels que
    les frais d''application de 1 000 €, constituent les piliers de notre approche
    institutionnelle.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6b78b207-3c3f-5c76-a4da-516610ffad5f
  title: Prêt immobilier à taux fixe Mirabelle — reconnaître les arnaques visant ce
    produit
  body: "L'acquisition d'un bien immobilier est une étape majeure de votre vie, et\
    \ c'est précisément cette vulnérabilité émotionnelle que exploitent certains fraudeurs.\
    \ Nous vous appelons à la plus grande vigilance face aux offres de crédit qui\
    \ semblent trop avantageuses pour être vraies.\n\nReconnaître les signes d'alerte\
    \ : \nCertains escrocs peuvent usurper l'identité du Crédit Mirabelle en vous\
    \ contactant par e-mail ou par téléphone pour vous proposer un taux largement\
    \ inférieur à nos conditions actuelles (comme nos taux de 3,35 % ou 3,55 %) sans\
    \ aucune analyse de solvabilité préalable. Soyez extrêmement méfiants si l'on\
    \ vous demande de verser des fonds pour « débloquer » un dossier ou pour couvrir\
    \ des « frais d'assurance urgents » via un virement vers un compte personnel ou\
    \ une plateforme de paiement non sécurisée. À titre de rappel, nos frais de dossier\
    \ s'élèvent à 1 000 € et sont traités selon un processus institutionnel strict,\
    \ jamais via des demandes de fonds informelles.\n\nCe que nous ne ferons jamais\
    \ : \nNous ne vous demanderons jamais vos codes d'accès secrets, vos mots de passe\
    \ ou la validation d'une opération par SMS pour « confirmer » l'octroi d'un prêt.\
    \ Le Crédit Mirabelle n'engage jamais l'octroi d'un crédit avant l'analyse complète\
    \ de votre solvabilité et la validation de vos pièces justificatives.\n\nQue faire\
    \ en cas de doute ?\nSi vous recevez une communication suspecte, ne cliquez sur\
    \ aucun lien et ne transmettez aucune donnée. Nous vous invitons à nous signaler\
    \ immédiatement l'incident. Si vous constatez une opération non autorisée sur\
    \ vos comptes, sachez que vous disposez d'un délai de 13 mois pour contester l'opération.\n\
    \nPour plus d'informations sur la protection de vos avoirs, vous pouvez consulter\
    \ le document : Notes réglementaires : crédits et prêts immobiliers."
