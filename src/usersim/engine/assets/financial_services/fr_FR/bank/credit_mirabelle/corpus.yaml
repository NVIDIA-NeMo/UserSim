- id: 9fe3695c-3238-5758-aa49-32e94a12a17f
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    confidentialité et protection des données
  body: 'Crédit Mirabelle s''engage à protéger la confidentialité de vos informations
    et à garantir un traitement transparent de vos données personnelles dans le cadre
    de l''utilisation de votre Compte courant et Formule Essentielle (carte à débit
    immédiat incluse).


    Conformité et Cadre Légal :

    Notre institution opère en stricte conformité avec les directives de l''ACPR et
    de la Banque de France. Le traitement de vos données est encadré par le Règlement
    Général sur la Protection des Données (RGPD) et le Code monétaire et financier.
    Nous collectons uniquement les informations nécessaires à la gestion de votre
    compte et à la lutte contre le blanchiment d''argent et le financement du terrorisme
    (normes KYC).


    Protection des Dépôts :

    Nous vous informons que vos fonds sont protégés par le Fonds de Garantie des Dépôts
    et de Résolution (FGDR). Ce mécanisme garantit la protection de vos avoirs jusqu''à
    100 000 € par client et par banque, vous assurant une sécurité maximale pour votre
    épargne et vos dépôts à vue.


    Accès et Droits :

    Vous disposez d''un droit d''accès, de rectification et de suppression de vos
    données personnelles. Toute demande de modification doit être accompagnée d''une
    preuve d''identité valide pour éviter toute usurpation.


    Nous traitons vos données avec bienveillance et transparence, en limitant l''accès
    aux informations sensibles aux seuls collaborateurs habilités. Pour toute question
    sur la gestion des risques, vous pouvez consulter le document Compte courant et
    Formule Essentielle (carte à débit immédiat incluse) — informations sur les risques.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 958f5796-0ef5-59d5-b532-1ca978922f09
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    reconnaître les arnaques visant ce produit
  body: "La sécurité de vos avoirs est notre priorité absolue. Dans le cadre de l'utilisation\
    \ de votre Compte courant et Formule Essentielle (carte à débit immédiat incluse),\
    \ nous souhaitons vous alerter sur certaines méthodes frauduleuses visant à dérober\
    \ vos informations personnelles ou vos fonds.\n\nLes fraudeurs peuvent tenter\
    \ de vous contacter par e-mail, SMS ou appel téléphonique, en usurpant l'identité\
    \ de Crédit Mirabelle. Ils peuvent prétendre qu'une opération suspecte a été détectée\
    \ ou que votre carte à débit immédiat a été bloquée, vous demandant ainsi de cliquer\
    \ sur un lien ou de fournir vos codes secrets pour « débloquer » la situation.\
    \ \n\nSachez que nous ne vous demanderons jamais, sous aucun prétexte, de nous\
    \ communiquer votre mot de passe, vos codes de validation d'authentification forte\
    \ ou vos identifiants de connexion par message ou par téléphone. Toute demande\
    \ de ce type est une tentative d'escroquerie.\n\nSi vous constatez une opération\
    \ que vous n'avez pas autorisée sur votre compte, nous vous rappelons que vous\
    \ disposez d'un délai de 13 mois pour contester l'opération. Nous nous engageons\
    \ à traiter ces fraudes avec diligence et à garantir le remboursement des opérations\
    \ non autorisées selon les délais légaux en vigueur.\n\nEn cas de doute ou si\
    \ vous pensez avoir été victime d'une arnaque, nous vous invitons à nous signaler\
    \ l'incident immédiatement. Nous procéderons alors à une vérification rigoureuse\
    \ de votre identité, conformément aux normes KYC, avant toute action visant à\
    \ sécuriser votre compte ou à modifier vos données.\n\nPour approfondir vos connaissances\
    \ sur la protection de vos comptes, nous vous invitons à consulter le document\
    \ Compte courant et Formule Essentielle (carte à débit immédiat incluse) — bonnes\
    \ pratiques de sécurité du compte."
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: fb8ea996-0165-5cc3-8a0e-92a0c860f2cc
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    plafonds, restrictions et cas particuliers
  body: "Ce document détaille les modalités techniques et les limites financières\
    \ applicables au Compte courant et Formule Essentielle (carte à débit immédiat\
    \ incluse), afin d'accompagner au mieux nos clients dans la gestion de leur quotidien.\n\
    \nFrais de gestion et fonctionnement :\nL'accès aux services de cette formule\
    \ est conditionné par une cotisation mensuelle de 7,90 €. Ce montant reflète le\
    \ coût réel des services fournis et la sécurité des opérations effectuées avec\
    \ la carte à débit immédiat.\n\nGestion du découvert et incidents de paiement\
    \ :\nDans le cas où un client utiliserait une autorisation de découvert, conjugatez\
    \ l'utilisation des fonds au taux du découvert autorisé, qui s'élève à 15,9 %.\
    \ \n\nLorsqu'une opération entraîne un dépassement du découvert autorisé ou est\
    \ réalisée sans autorisation préalable, une commission d'intervention est appliquée.\
    \ Le montant de cette commission est de 8 € par opération. Pour protéger nos clients\
    \ contre l'accumulation excessive de frais en période de difficulté, nous appliquons\
    \ un plafond mensuel des commissions d'intervention fixé à 80 €. Au-delà de ce\
    \ montant, aucune commission d'intervention supplémentaire ne sera facturée durant\
    \ le mois civil en cours.\n\nRestrictions et cas particuliers :\nLe produit inclut\
    \ une carte à débit immédiat, ce qui signifie que les fonds sont retirés du compte\
    \ dès la validation de l'opération. En cas de fragilité financière avérée, Crédit\
    \ Mirabelle propose une offre spécifique, facturée 3 € par mois au plus, destinée\
    \ à limiter l'impact des frais d'incidents. L'éligibilité à cette offre doit faire\
    \ l'objet d'une étude au sein de l'agence.\n\nL'authentification forte est obligatoire\
    \ pour toute modification de données sensibles ou opération impactant l'état du\
    \ compte, conformément à notre politique de sécurité et de conformité."
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: product_sheet
  source_authority: official
