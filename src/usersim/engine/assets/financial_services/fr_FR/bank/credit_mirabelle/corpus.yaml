  institution_id: credit_mirabelle
- id: e601f702-c47f-575a-9cda-bc6f94765779
  title: Livret d'épargne populaire (LEP) — informations sur les risques
  body: 'Conformément à notre engagement de transparence, le Crédit Mirabelle vous
    communique les informations suivantes concernant les risques associés au Livret
    d''épargne populaire (LEP).


    Risque de capital et protection : Le capital déposé sur un LEP est garanti. Il
    n''existe aucun risque de perte en capital. En complément, vos avoirs sont protégés
    par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à un montant
    de 100 000 € par client et par établissement.


    Risque de taux : Le taux de rémunération du LEP est fixé par arrêté ministériel.
    Par conséquent, le taux actuel de 2,5 % peut être modifié à tout moment par l''État,
    à la hausse comme à la baisse, sans préavis. Ce risque est inhérent à tous les
    produits d''épargne réglementés.


    Risque de conformité fiscale : L''éligibilité au LEP est conditionnée par le respect
    d''un plafond de revenu fiscal de référence (23 028 € pour une part). Si, lors
    d''un contrôle périodique, il apparaît que vos revenus dépassent ce seuil, vous
    pourriez perdre le bénéfice du taux bonifié. Bien que le maintien du livret soit
    possible jusqu''à son plafond de 10 000 €, la perte du statut éligible peut impacter
    la rentabilité future de votre épargne.


    Liquidité : Le LEP offre une liquidité totale. Les fonds sont disponibles immédiatement,
    sans délai de préavis et sans frais de sortie, ce qui élimine tout risque d''indisponibilité
    des fonds.


    Le Crédit Mirabelle veille à la stricte conformité de ce produit avec les directives
    de l''ACPR et la réglementation bancaire française pour garantir un traitement
    équitable de tous nos sociétaires et clients.'
  domain: retail_banking
  product_category: lep
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 51240e64-9fc8-588c-9ed8-61b25bd91f00
  title: Livret d'épargne populaire (LEP) — calcul et application des taux
  body: 'Ce document détaille les modalités d''application du taux de rémunération
    pour le Livret d''épargne populaire (LEP) à l''usage des conseillers.


    Taux applicable : Le taux de rémunération annuel est de 2,5 %. Ce taux est unique
    et s''applique à l''ensemble des soldes, sans palier ni condition de montant,
    dès lors que le plafond de 10 000 € n''est pas dépassé.


    Mode de calcul : Les intérêts sont calculés selon la règle des quinzaines. Les
    fonds versés produisent des intérêts le 1er et le 16 de chaque mois. Les fonds
    retirés cessent de produire des intérêts le 1er et le 16 du mois suivant le retrait.


    Application et Crédit : Les intérêts sont capitalisés annuellement. Le crédit
    des intérêts s''effectue généralement au 31 décembre de chaque année. Si le solde
    dépasse 10 000 € suite au versement des intérêts, le taux de 2,5 % continue de
    s''appliquer sur la totalité du solde, mais aucun versement supplémentaire ne
    sera possible tant que le solde ne sera pas repassé sous le plafond.


    L''absence de frais de gestion garantit que le rendement net pour le client est
    exactement égal au taux nominal annoncé.'
  domain: retail_banking
  product_category: lep
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 8fe9f1df-0990-5013-86d3-06f86e7a9f02
  title: Livret d'épargne populaire (LEP) — offre de parrainage et de fidélité
  body: 'Nous avons le plaisir de vous présenter notre programme de parrainage dédié
    au Livret d''épargne populaire (LEP). Cette offre, valable du 1er octobre 2024
    au 31 décembre 2024, permet de récompenser votre fidélité et votre engagement
    envers notre modèle coopératif.


    Pour chaque nouveau client que vous parrainez et qui ouvre un compte LEP, nous
    vous versons une prime de fidélité de 20 €. Le filleul parrainé bénéficiera également
    d''une prime de bienvenue de 20 € lors de son premier versement.


    Pour rappel, le Livret d''épargne populaire (LEP) est un produit d''épargne réglementé
    offrant un taux de rémunération attractif de 2,5 %. L''ouverture est accessible
    à tout client dont le revenu fiscal de référence ne dépasse pas 23 028 € pour
    une part, avec un versement initial minimum de 30 €. Le plafond des dépôts est
    fixé à 10 000 €.


    Cette offre est limitée à cinq parrainages par sociétaire. Nous vous invitons
    à consulter vos conseillers en agence pour finaliser vos recommandations.'
  domain: retail_banking
  product_category: lep
