- id: 3101601d-7896-583e-b8d8-f16e90556941
  title: Parts sociales Mirabelle — consulter le suivi ou l'historique
  body: 'En tant que sociétaire, vous pouvez suivre l''évolution de vos parts et la
    rémunération perçue. Voici la marche à suivre pour consulter votre historique.


    Avant de commencer, assurez-vous d''avoir vos identifiants de connexion ou une
    pièce d''identité valide si vous effectuez la demande auprès d''un conseiller.


    1. Demandez-nous l''accès à votre relevé de détention de parts sociales. Cette
    demande peut être formulée lors d''un échange avec votre conseiller ou via votre
    interface numérique.

    2. Procédez à l''authentification forte. Conformément à nos normes de sécurité
    et de KYC, nous validerons votre identité avant de vous communiquer toute information
    sensible sur vos titres.

    3. Consultez le nombre de parts détenues. Le document vous confirmera le nombre
    total de parts acquises au prix de 15 € l''unité.

    4. Vérifiez l''application de la rémunération. Votre historique indiquera les
    intérêts crédités sur la base du taux de 2,1 %.

    5. Analysez les mouvements. Si vous avez effectué des souscriptions ou des demandes
    de rachat, celles-ci seront listées avec la date de valeur et le montant correspondant.


    Une fois ces étapes réalisées, vous disposerez d''une vision complète de votre
    engagement dans la coopérative. Si vous remarquez une incohérence dans vos chiffres,
    nous vous invitons à consulter le document : Parts sociales Mirabelle — écart
    avec vos relevés.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: how_to_guide
  source_authority: official
