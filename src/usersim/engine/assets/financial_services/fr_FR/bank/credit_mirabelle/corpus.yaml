- id: 6de783a8-6fdd-5e6e-8b88-659ada847377
  title: Livret d'épargne populaire (LEP) — protection contre la fraude et les opérations
    non autorisées
  body: 'Au sein du Crédit Mirabelle, la sécurité de vos économies est notre priorité
    absolue. Le Livret d''épargne populaire (LEP), en raison de son taux attractif
    de 2,5 %, peut être la cible de tentatives de fraude sophistiquées. Nous vous
    invitons à être particulièrement vigilants face aux sollicitations inhabituelles.


    Les fraudeurs peuvent tenter de vous contacter en se faisant passer pour des conseillers
    de notre banque, en utilisant des techniques d''ingénierie sociale pour vous inciter
    à effectuer des virements vers des comptes tiers sous prétexte de « sécuriser
    » vos fonds ou de « débloquer » des avantages fiscaux. Soyez conscients que le
    Crédit Mirabelle ne vous demandera jamais vos codes secrets, vos identifiants
    de connexion ou de transférer vos fonds vers un compte externe pour des raisons
    de sécurité.


    L''authentification forte et la vérification rigoureuse de l''identité sont obligatoires
    avant toute action modifiant l''état d''un compte. Si vous constatez une opération
    que vous n''avez pas autorisée, nous vous rappelons que vous disposez d''un délai
    légal de 13 mois pour contester une opération mal exécutée ou non autorisée. Nous
    traitons ces fraudes avec diligence et garantissons le remboursement des opérations
    non autorisées selon les délais légaux.


    En cas de doute sur la légitimité d''un appel ou d''un message, ne communiquez
    aucune information et contactez immédiatement votre conseiller en agence. Pour
    votre sérénité, sachez que vos dépôts sont protégés par le Fonds de Garantie des
    Dépôts et de Résolution (FGDR) jusqu''à 100 000 € par client et par banque, conformément
    aux directives de l''ACPR et de la Banque de France.


    Pour compléter vos connaissances sur la sécurisation de vos avoirs, nous vous
    suggérons de consulter le document suivant : Livret A — protection contre la fraude
    et les opérations non autorisées.'
  domain: retail_banking
  product_category: lep
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 0bffd575-8afc-52ce-a374-b65364adfa34
  title: Livret d'épargne populaire (LEP) — conditions générales
  body: 'Le présent document définit les conditions générales d''utilisation du Livret
    d''épargne populaire (LEP) au sein du Crédit Mirabelle. Ce produit est régi par
    le Code monétaire et financier et les directives de la Banque de France.


    Éligibilité et Ouverture : L''ouverture d''un LEP est strictement réservée aux
    personnes dont le revenu fiscal de référence ne dépasse pas le plafond légal,
    fixé pour une part fiscale à 23 028 €. Le client s''engage à fournir un avis d''imposition
    récent pour justifier de son éligibilité. Un versement initial minimum de 30 €
    est requis pour l''activation du compte.


    Gestion des Fonds : Le solde du livret est plafonné à 10 000 €. Tout versement
    entraînant un dépassement de ce plafond sera refusé ou devra être régularisé.
    Les fonds sont rémunérés au taux annuel de 2,5 %, dont le calcul suit la règle
    des quinzaines.


    Obligations de Vigilance : Le titulaire du compte a l''obligation d''informer
    la banque de tout changement de situation fiscale pouvant remettre en cause son
    éligibilité. Le Crédit Mirabelle procède périodiquement à des contrôles de revenus.
    En cas de dépassement du revenu fiscal de référence (supérieur à 23 028 € par
    part), le client sera invité à clôturer son LEP ou à le maintenir sous réserve
    que le plafond de 10 000 € ne soit pas dépassé, avec une possible modification
    de la rémunération selon la réglementation en vigueur.


    Clôture et Résiliation : Le LEP peut être clôturé à tout moment à la demande du
    client. La clôture entraîne le virement du solde restant vers un compte de dépôt
    ouvert au nom du titulaire. Le Crédit Mirabelle se réserve le droit de clôturer
    le compte en cas de non-respect répété des conditions d''éligibilité ou de manquement
    aux obligations de KYC (Know Your Customer).


    Protection : Les dépôts sont garantis par le FGDR jusqu''à 100 000 €.'
  domain: retail_banking
  product_category: lep
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: f3e0c778-2fa8-5de6-a7c3-14b1dc1e8508
  title: Livret d'épargne populaire (LEP) — pour qui et pour quels usages
  body: 'Le Livret d''épargne populaire (LEP) est une solution d''épargne réglementée
    conçue spécifiquement pour soutenir les ménages aux revenus modestes. Fidèles
    à notre engagement d''inclusion financière, nous proposons ce produit pour permettre
    à chacun de se constituer une épargne de précaution sécurisée et rémunératrice.


    Pour qui est fait ce produit ?

    Ce livret s''adresse aux particuliers dont le revenu fiscal de référence est modeste,
    avec un plafond d''éligibilité fixé à 23 028 € pour une part fiscale. C''est l''outil
    idéal pour ceux qui souhaitent mettre de côté des sommes tout en conservant une
    disponibilité totale de leurs fonds.


    Quels sont les usages recommandés ?

    1. L''épargne de précaution : Grâce à sa liquidité immédiate, le LEP permet de
    faire face aux imprévus du quotidien (réparations urgentes, frais de santé) sans
    fragiliser son budget courant.

    2. La transition vers des projets : Il peut servir de première étape pour accumuler
    un apport avant de s''orienter vers d''autres solutions d''épargne.


    Caractéristiques essentielles :

    - Rémunération : Un taux attractif de 2,5 %, exonéré d''impôts, pour favoriser
    la croissance de votre épargne.

    - Accessibilité : Un versement minimum d''ouverture très bas, fixé à 30 €.

    - Capacité : Un plafond de dépôts de 10 000 €, au-delà duquel les versements ne
    sont plus possibles.


    En résumé, le LEP est l''alternative privilégiée au Livret A pour les foyers éligibles,
    offrant une meilleure rémunération pour un risque nul et une disponibilité totale.
    Pour comprendre comment ce produit s''intègre avec vos autres comptes, vous pouvez
    consulter la présentation : Compte courant et Formule Essentielle (carte à débit
    immédiat incluse) — présentation.'
  domain: retail_banking
  product_category: lep
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c28072e6-ea3e-52b6-b99c-a5312f74a755
  title: 'Livret d''épargne populaire (LEP) — plafond des versements : explications'
  body: 'Question : Que se passe-t-il si je tente de verser une somme qui dépasse
    le plafond de 10 000 € ?

    Réponse : Le plafond du Livret d''épargne populaire (LEP) est strictement fixé
    à 10 000 €. Si vous effectuez un versement qui fait franchir ce seuil, l''opération
    sera refusée par nos systèmes. Nous vous recommandons de vérifier votre solde
    actuel avant tout transfert.


    Question : Les intérêts versés peuvent-ils faire dépasser le plafond de 10 000
    € ?

    Réponse : Oui, les intérêts capitalisés au taux de 2,5 % peuvent porter le solde
    total au-delà de 10 000 €. Dans ce cas précis, le livret continue de produire
    des intérêts sur la totalité de la somme, mais vous ne pourrez plus effectuer
    de nouveaux versements jusqu''à ce que le solde redescende sous le plafond par
    un retrait.


    Pour plus de détails sur la gestion de vos plafonds, veuillez vous référer au
    document : Livret d''épargne populaire (LEP) — conditions générales.'
  domain: retail_banking
  product_category: lep
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6a064039-a0f2-5f7e-85a6-d29b3483cc72
  title: Livret d'épargne populaire (LEP) — résilier, clôturer ou changer de formule
  body: 'La clôture de votre Livret d''épargne populaire (LEP) ou sa modification
    intervient généralement lorsque vos revenus évoluent ou que vos besoins d''épargne
    changent. Voici la marche à suivre pour finaliser cette opération avec nous.


    Ce dont vous avez besoin :

    - Votre pièce d''identité en cours de validité.

    - Le numéro du compte de destination (IBAN) où seront transférés vos fonds.


    Étapes de clôture :

    1. Demandez la clôture de votre LEP en nous précisant le compte vers lequel vous
    souhaitez transférer le solde restant.

    2. Nous procédons à l''arrêté des comptes pour calculer les intérêts courus au
    taux de 2,5 % jusqu''à la date du jour.

    3. Nous effectuons le virement global du capital et des intérêts vers le compte
    choisi.

    4. Nous vous confirmons la fermeture définitive du compte par un avis de clôture.


    Changer de formule (Transition vers le Livret A) :

    Si vos revenus ont dépassé le plafond de 23 028 € par part fiscale, vous n''êtes
    plus éligible à l''ouverture d''un LEP, mais vous pouvez conserver le vôtre jusqu''à
    son plafond de 10 000 €. Cependant, pour continuer à épargner au-delà, nous vous
    conseillons de souscrire à un Livret A.


    Pour initier ce changement :

    1. Demandez l''ouverture d''un Livret A.

    2. Transférez les fonds de votre LEP vers votre nouveau Livret A pour simplifier
    votre gestion.


    Une fois ces étapes réalisées, vous retrouverez la flexibilité d''un compte sans
    plafond de revenus. Pour plus d''informations sur l''alternative, consultez :
    Livret A — présentation.'
  domain: retail_banking
  product_category: lep
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 07b36245-5ee3-5a38-8379-c5c14dd1a2ad
  title: Livret d'épargne populaire (LEP) — frais ou montant inattendu
  body: 'Ce document est destiné aux conseillers pour accompagner les clients signalant
    un écart de montant ou des frais perçus sur leur Livret d''épargne populaire (LEP).


    Symptôme : Le client constate que le solde de son LEP a diminué sans virement
    apparent, ou qu''une opération a été bloquée malgré un solde positif.


    Causes probables et vérifications :

    1. Dépassement du plafond : Vérifiez si le client a tenté un versement alors que
    le solde était proche de 10 000 €. L''opération a pu être rejetée, générant parfois
    des frais de rejet si le compte source était insuffisamment provisionné.

    2. Rectification du taux : Si le client n''a pas fourni son avis d''imposition
    pour justifier d''un revenu inférieur à 23 028 €, le taux de 2,5 % a pu être suspendu
    ou modifié conformément à la réglementation.

    3. Erreur de virement : Vérifiez l''historique des opérations pour identifier
    un virement sortant vers un autre compte du même titulaire.


    Procédure de résolution :

    - Si l''erreur provient d''un manque de justificatif fiscal, demandez au client
    de nous transmettre son dernier avis d''imposition. Une fois validé, nous régulariserons
    la situation.

    - Si une opération a été bloquée par erreur technique, initiez une demande de
    correction manuelle.


    Escalade :

    Si la cause n''est pas identifiée après vérification des justificatifs et des
    flux, ou si le client conteste fermement un montant, le dossier doit être escaladé
    à la direction d''agence. Si le litige persiste, le client peut être orienté vers
    le médiateur de la banque. Le client doit être informé que tout remboursement
    d''opération non autorisée sera traité selon les délais légaux, avec un rappel
    du délai de 13 mois pour contester.'
  domain: retail_banking
  product_category: lep
