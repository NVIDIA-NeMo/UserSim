- id: 0153d284-56de-59c2-b10d-74f1b5c8894e
  title: Parts sociales Mirabelle — informations réglementaires
  body: 'Les Parts sociales Mirabelle constituent un titre de propriété au sein d''une
    société coopérative. Leur acquisition et leur détention sont soumises au respect
    du Code monétaire et financier et aux directives de l''ACPR et de la Banque de
    France.


    Nature du Capital : Contrairement aux dépôts bancaires classiques, les parts sociales
    représentent des fonds propres pour la banque. Elles ne sont pas des dépôts et,
    par conséquent, ne sont pas couvertes par le Fonds de Garantie des Dépôts et de
    Résolution (FGDR), lequel assure la protection des avoirs jusqu''à 100 000 € par
    client et par banque pour les produits de dépôt.


    Transparence et Équité : Nous nous engageons à une transparence totale sur la
    valeur nominale des parts, fixée à 15 €, ainsi que sur le taux de rémunération
    appliqué, actuellement de 2,1 %. Le traitement des Sociétaires est équitable et
    fondé sur le principe « un homme, une voix », indépendamment du nombre de parts
    détenues.


    Rachat des Parts : Le remboursement des parts sociales n''est pas automatique.
    Il intervient à la demande du Sociétaire, sous réserve de l''accord du Conseil
    d''Administration et de la disponibilité des liquidités de la coopérative, afin
    de ne pas fragiliser la structure financière de l''institution. Le délai de remboursement
    est précisé dans les statuts de la banque.


    Conformité KYC : Conformément aux obligations de lutte contre le blanchiment et
    le financement du terrorisme, aucune souscription ne sera validée sans une vérification
    rigoureuse de l''identité du souscripteur.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c94ce96e-e9b4-51a6-bf09-a55a2360d6dc
  title: Parts sociales Mirabelle — grille des taux
  body: 'L''investissement dans les Parts sociales Mirabelle permet de soutenir notre
    modèle coopératif tout en bénéficiant d''une rémunération régulière.


    | Produit | Taux de rémunération annuel | Application |

    | :--- | :--- | :--- |

    | Parts sociales Mirabelle | 2,1 % | Appliqué à l''ensemble du capital social
    détenu |


    Ce taux de 2,1 % est appliqué uniformément à toutes les parts sociales, quel que
    soit le montant total investi. La rémunération est calculée sur la base du nombre
    de parts détenues au cours de l''exercice comptable. Elle est généralement versée
    ou capitalisée après l''approbation des comptes lors de l''assemblée générale
    annuelle. Ce taux peut être révisé annuellement par la gouvernance de la banque
    en fonction des résultats de l''exercice et des réserves légales à constituer.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: rate_sheet
  source_authority: official
