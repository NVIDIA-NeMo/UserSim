- id: 2e1c567b-e7f3-5127-bfc9-a0f4f74d1f23
  title: Prêt immobilier à taux fixe Mirabelle — souscrire et activer
  body: 'La souscription à un Prêt immobilier à taux fixe Mirabelle est un processus
    rigoureux et transparent, conçu pour sécuriser votre investissement. Voici les
    étapes pour mener votre projet à bien.


    **Prérequis**

    Avant de commencer, munissez-vous de vos justificatifs de revenus (derniers bulletins
    de salaire, avis d''imposition) et des documents relatifs au bien immobilier visé
    (compromis de vente).


    **Étapes de souscription**


    1. **Demande de simulation** : Demandez-nous d''effectuer une simulation financière.
    Nous analyserons vos revenus et vos charges pour déterminer votre capacité d''emprunt,
    en veillant à ce que votre taux d''endettement ne dépasse pas 35 %.

    2. **Constitution du dossier** : Remettez-nous l''ensemble des pièces justificatives
    nécessaires. Nous procéderons à une vérification rigoureuse de votre identité
    conformément aux normes KYC et à l''analyse complète de votre solvabilité.

    3. **Émission de l''offre** : Une fois le dossier validé, nous vous remettrons
    une offre de prêt officielle détaillant le taux choisi (3,35 % sur 20 ans ou 3,55
    % sur 25 ans) ainsi que les frais de dossier de 1 000 €.

    4. **Délai de réflexion** : Vous disposez alors d''un délai de réflexion obligatoire
    de dix jours. C''est une période durant laquelle vous pouvez examiner l''offre
    sereinement avant de l''accepter.

    5. **Signature et activation** : Après l''expiration du délai de réflexion, vous
    signez l''offre. Nous validons l''activation du prêt et procédons au déblocage
    des fonds vers le notaire ou le vendeur.


    Vous saurez que l''opération est réussie lorsque vous recevrez la confirmation
    du déblocage des fonds et que votre tableau d''amortissement définitif vous sera
    communiqué.'
