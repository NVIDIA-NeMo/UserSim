- id: dae812de-a362-5fbe-be62-a2c2f8125d7a
  title: Carte Mirabelle Premier — opération refusée ou bloquée
  body: "Il peut arriver que votre Carte Mirabelle Premier soit refusée lors d'un\
    \ paiement ou d'un retrait. Voici comment identifier la cause et résoudre le problème.\n\
    \n**Symptôme :**\nLe terminal de paiement affiche « Opération refusée », « Plafond\
    \ atteint » ou le distributeur rejette votre carte sans délivrer d'espèces.\n\n\
    **Causes probables et vérifications :\n\n1. **Dépassement du plafond de paiement**\
    \ : Vérifiez si la somme de vos achats sur les 30 derniers jours a atteint 8 000\
    \ €. Si c'est le cas, la carte bloquera tout nouveau paiement jusqu'à ce que la\
    \ fenêtre glissante libère de la marge.\n2. **Dépassement du plafond de retrait**\
    \ : Vérifiez si vos retraits d'espèces sur les 7 derniers jours ont atteint 1\
    \ 500 €. \n3. **Solde insuffisant** : Assurez-vous que le solde de votre compte\
    \ courant est suffisant pour couvrir l'opération.\n4. **Blocage de sécurité**\
    \ : Pour protéger vos fonds, nous pouvons bloquer temporairement la carte en cas\
    \ de transaction atypique (montant inhabituel, pays à risque).\n\n**Comment résoudre\
    \ la situation ?**\n- Si vous avez atteint un plafond et que vous avez un besoin\
    \ urgent de fonds, demandez-nous d'augmenter temporairement vos plafonds. Nous\
    \ analyserons votre solvabilité et nous confirmerons l'augmentation après vérification\
    \ de votre identité.\n- Si la carte est bloquée pour sécurité, demandez-nous de\
    \ lever le blocage après avoir confirmé la validité de l'opération contestée.\n\
    \n**Échelon d'escalade :\n\nSi le problème persiste malgré ces vérifications,\
    \ nous créerons un ticket d'incident technique. Votre demande sera transmise à\
    \ la direction d'agence pour une analyse approfondie. Vous serez informé de la\
    \ résolution sous 48 heures ouvrées."
  domain: cards
  product_category: carte_premier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 8f894283-a91c-5698-b764-ad896c7cdb2f
  title: Carte Mirabelle Premier — quand changer ou monter en gamme
  body: 'Ce guide aide le conseiller à déterminer si la Carte Mirabelle Premier est
    plus adaptée que l''offre standard (Compte courant et Formule Essentielle).


    **Critères de basculement :


    - **Besoins de liquidités** : Si le client effectue régulièrement des retraits
    importants, le plafond de 1 500 € sur 7 jours de la Carte Mirabelle Premier est
    un avantage majeur face aux plafonds plus restrictifs de la Formule Essentielle.

    - **Volume de dépenses** : Un client ayant des achats mensuels fréquents ou des
    dépenses exceptionnelles (voyages, équipements) bénéficiera du plafond de paiement
    de 8 000 € sur 30 jours.

    - **Budget annuel** : La Carte Mirabelle Premier implique une cotisation annuelle
    de 132 €. Le passage à cette gamme est pertinent si le client valorise la liberté
    financière et les plafonds élevés plus que l''économie sur les frais de tenue
    de carte.


    **Recommandation :


    La Formule Essentielle convient aux clients recherchant la simplicité et un coût
    minimal. La Carte Mirabelle Premier est recommandée pour les profils ayant des
    flux financiers plus importants et nécessitant une plus grande souplesse opérationnelle.
    Pour plus de détails sur l''offre d''entrée, consultez Compte courant et Formule
    Essentielle (carte à débit immédiat incluse) — présentation.'
  domain: cards
  product_category: carte_premier
  document_type: comparison
  source_authority: official
