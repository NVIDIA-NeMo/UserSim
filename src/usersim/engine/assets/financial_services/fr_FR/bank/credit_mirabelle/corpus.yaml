- id: 60f2932a-582f-545a-aecb-4fc820bbd7e4
  title: Prêt immobilier à taux fixe Mirabelle — informations sur les risques
  body: 'L''octroi d''un crédit immobilier engage votre responsabilité financière
    sur le long terme. Nous vous prions de lire attentivement les informations suivantes
    :


    **Risque de solvabilité** : Un crédit vous engage et doit être remboursé. Nous
    vérifions rigoureusement votre capacité de remboursement. Le respect du taux d''endettement
    maximal de 35 % est une mesure de protection pour éviter que vos mensualités n''impactent
    trop sévèrement votre niveau de vie.


    **Coût total du crédit** : Le coût total d''un prêt ne se limite pas au taux d''intérêt
    (3,35 % pour 20 ans ou 3,55 % pour 25 ans). Il inclut également les frais de dossier
    de 1 000 €, l''assurance emprunteur obligatoire et les éventuelles taxes liées
    à l''acte notarié. Nous nous engageons à ne jamais minimiser ce coût global lors
    de nos simulations.


    **Droit de réflexion** : Conformément au Code monétaire et financier, tout emprunteur
    immobilier dispose d''un délai de réflexion obligatoire de dix jours. Vous ne
    pouvez accepter l''offre de prêt avant l''expiration de ce délai, ce qui vous
    permet d''analyser sereinement les termes du contrat.


    **Protection des fonds** : Les fonds déposés pour les garanties sont protégés
    par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à 100 000 €
    par client. Le Crédit Mirabelle opère dans la conformité stricte des directives
    de l''ACPR et de la Banque de France.'
