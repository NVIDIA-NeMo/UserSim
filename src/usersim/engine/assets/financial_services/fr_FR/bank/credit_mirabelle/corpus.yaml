- id: 57e9256c-b0f2-59e7-82de-e927dbe30bd3
  title: Livret A — choisir entre les formules
  body: 'Vous hésitez entre le Livret A et d''autres solutions d''épargne réglementée
    ? Voici les éléments clés pour vous aider à choisir la formule la plus adaptée
    à votre situation.


    **Le Livret A : La solution universelle**

    - **Accessibilité** : Ouvert à tous, sans condition de revenus.

    - **Rémunération** : Taux de 1,7 %.

    - **Plafond** : Jusqu''à 22 950 €.

    - **Atout** : Une liquidité totale et une simplicité d''ouverture (dès 10 €).


    **Le Livret d''Épargne Populaire (LEP) : La solution ciblée**

    Le LEP s''adresse aux foyers dont le revenu fiscal de référence est modeste. Il
    offre un taux de rémunération bonifié, supérieur à celui du Livret A, mais avec
    un plafond de dépôts nettement inférieur.


    **Lequel choisir ?**

    - Si vous êtes éligible au LEP, nous vous recommandons de saturer d''abord ce
    dernier pour bénéficier de son taux supérieur, puis de placer vos excédents sur
    le Livret A jusqu''au plafond de 22 950 €.

    - Si vous n''êtes pas éligible au LEP, le Livret A est votre meilleure option
    pour une épargne sécurisée et disponible immédiatement.'
  domain: retail_banking
  product_category: livret_a
  document_type: comparison
  source_authority: official
  placeholder: true
