  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5eb65074-cabc-54d5-8b86-38b9cc46e75b
  title: 'Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    plafond mensuel des commissions d''intervention : explications'
  body: 'Qu''est-ce que la commission d''intervention et comment est-elle appliquée
    ?


    La commission d''intervention est un frais appliqué lorsqu''une opération (paiement
    ou retrait) entraîne un dépassement de votre découvert autorisé ou est effectuée
    alors que vous n''avez pas d''autorisation de découvert. Pour le Compte courant
    et Formule Essentielle (carte à débit immédiat incluse), ce frais s''élève à 8
    € par opération.


    Existe-t-il une limite au montant total de ces frais chaque mois ?


    Oui, nous appliquons un principe de transparence et de protection. Le montant
    total des commissions d''intervention est plafonné à 80 € par mois. Cela signifie
    que même si vous effectuez plusieurs opérations entraînant des commissions, nous
    ne vous facturerons jamais plus de 80 € de commissions d''intervention sur un
    seul mois civil.


    Pour plus de détails sur la nature de ces frais, vous pouvez consulter le document
    Compte courant et Formule Essentielle (carte à débit immédiat incluse) — commission
    d''intervention : explications.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 33e18ac2-3cac-50fc-84d6-817896cc9481
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    consulter le suivi ou l'historique
  body: 'Nous vous accompagnons pour consulter l''historique des opérations de votre
    Compte courant et Formule Essentielle (carte à débit immédiat incluse) afin de
    suivre vos dépenses et vos revenus en toute transparence.


    Pour consulter votre suivi, vous disposez de plusieurs options selon vos besoins
    :


    1. Demande de solde et d''opérations récentes :

    Dites-nous simplement que vous souhaitez connaître votre solde actuel ou voir
    vos dernières transactions. Nous vous communiquerons alors le montant disponible
    sur votre compte ainsi que la liste chronologique des derniers mouvements (débits
    et crédits).


    2. Consultation de l''historique détaillé :

    Si vous recherchez une opération spécifique sur une période donnée, précisez-nous
    la plage de dates concernée. Nous analyserons vos écritures et nous vous fournirons
    le détail des transactions correspondantes, incluant le libellé de l''opération
    et le montant exact.


    3. Réception d''un relevé officiel :

    Pour obtenir un document contractuel récapitulatif, demandez-nous l''envoi de
    vos derniers relevés de compte. Nous vous confirmerons la mise à disposition de
    ces documents, qui détaillent l''ensemble des opérations, y compris la cotisation
    mensuelle de 7,90 € et les éventuelles commissions d''intervention de 8 €.


    Comment savoir si la demande a réussi ?


    La procédure est validée lorsque nous vous confirmons la lecture du solde, que
    nous vous listons les opérations demandées ou que nous vous confirmons l''envoi
    de vos relevés. Si une vérification d''identité est nécessaire pour accéder à
    ces informations sensibles, nous vous le signalerons avant de vous communiquer
    les données.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: fade2056-ec1b-5cc9-9ba4-ab1c9dcae6cb
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    opération refusée ou bloquée
  body: "Il peut arriver qu'une opération avec votre carte à débit immédiat soit refusée\
    \ lors d'un paiement ou d'un retrait. Voici comment identifier la cause et résoudre\
    \ la situation.\n\nSymptômes constatés :\nLe terminal de paiement indique « Opération\
    \ refusée » ou votre application signale que la transaction n'a pas pu être traitée.\n\
    \nCauses probables et vérifications :\n\n1. Solde insuffisant et dépassement de\
    \ plafond :\nVérifiez si le montant de l'achat dépasse le solde disponible sur\
    \ votre compte. Même avec un découvert autorisé, si le montant total dépasse vos\
    \ limites contractuelles, l'opération sera bloquée. Rappelons que le taux applicable\
    \ au découvert autorisé est de 15,9 %.\n\n2. Blocage de sécurité :\nSi vous effectuez\
    \ une opération inhabituelle (montant très élevé, paiement à l'étranger), nos\
    \ systèmes de sécurité peuvent bloquer la transaction pour vous protéger contre\
    \ la fraude. \n\n3. Problème de conformité KYC :\nSi vos informations d'identité\
    \ ne sont plus à jour ou si une pièce justificative manque à votre dossier, certaines\
    \ restrictions peuvent être appliquées à votre compte.\n\nRésolution de l'incident\
    \ :\n\n- Pour un solde insuffisant : Vous pouvez créditer votre compte ou nous\
    \ demander d'augmenter temporairement votre autorisation de découvert, sous réserve\
    \ d'analyse de votre solvabilité.\n- Pour un blocage de sécurité : Nous procéderons\
    \ à une vérification rigoureuse de votre identité. Une fois l'authentification\
    \ forte validée, nous débloquerons l'opération ou la carte.\n- Pour un problème\
    \ de dossier : Nous vous indiquerons le document manquant à nous fournir pour\
    \ rétablir le plein usage de vos services.\n\nSi le problème persiste malgré ces\
    \ vérifications, nous ouvrirons un dossier d'incident pour analyser la cause technique\
    \ et nous vous tiendrons informé du rétablissement de vos services."
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: af8fa39a-f86c-5ee3-bcf9-c8769c0282a5
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    quand changer ou monter en gamme
  body: 'Le Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    est idéal pour une gestion simple et transparente avec un coût mensuel fixe de
    7,90 €.


    Cependant, un changement de formule est recommandé dans les cas suivants :


    - Besoin de plafonds étendus : Si vos habitudes de consommation nécessitent des
    plafonds de paiement et de retrait plus élevés que ceux de la formule essentielle,
    une montée en gamme vers la Carte Mirabelle Premier est conseillée pour plus de
    liberté financière.

    - Recherche de services haut de gamme : Si vous souhaitez bénéficier d''assurances
    étendues ou de services de conciergerie, la gamme Premier est plus adaptée.

    - Situation de fragilité financière : Si les frais d''incidents (comme la commission
    d''intervention à 8 €) pèsent trop lourdement sur votre budget, nous vous suggérons
    de passer à notre offre spécifique dédiée, limitée à 3 € par mois au plus.


    En résumé, conservez la Formule Essentielle pour sa simplicité. Passez à la gamme
    Premier pour plus de flexibilité, ou à l''offre de fragilité pour une protection
    accrue des frais.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 9a32d679-1621-5ad7-8c72-aaa181fa6345
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    comparaison avec les alternatives et quand ne pas le choisir
  body: 'Le Compte courant et Formule Essentielle (carte à débit immédiat incluse)
    a été conçu comme une solution de gestion quotidienne fondamentale. Pour vous
    aider à déterminer s''il correspond à vos besoins, voici une analyse comparative.


    Pourquoi choisir la Formule Essentielle ?

    Elle convient parfaitement aux clients recherchant la transparence et la proximité
    d''une banque coopérative. Avec une cotisation de 7,90 € par mois, vous bénéficiez
    d''un ensemble de services essentiels et d''une carte à débit immédiat, permettant
    un suivi en temps réel de votre budget.


    Quand ne PAS choisir ce produit ?


    1. Si vous recherchez un débit différé : Ce produit inclut une carte à débit immédiat.
    Si vous préférez que vos dépenses soient cumulées et prélevées une fois par mois,
    ce produit n''est pas adapté.


    2. Si vous avez des besoins financiers complexes : Pour des plafonds de retrait
    et de paiement très élevés, la gamme Premier est préférable.


    3. Si vous êtes en situation de fragilité financière : Bien que ce compte soit
    accessible, les frais d''incidents comme la commission d''intervention de 8 €
    (plafonnée à 80 € par mois) peuvent être contraignants. Dans ce cas, nous recommandons
    notre offre spécifique à 3 € par mois au plus, conçue pour limiter l''impact financier
    des incidents de paiement.


    4. Si vous ne souhaitez pas de frais mensuels fixes : Ce compte implique un coût
    réel de 7,90 € mensuels. Si vous préférez une structure de frais uniquement à
    l''acte, d''autres options pourraient être discutées avec votre conseiller.


    Quel que soit votre choix, Crédit Mirabelle garantit une conformité stricte aux
    directives de l''ACPR et la protection de vos dépôts via le FGDR jusqu''à 100
    000 € par client.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 93a7cee7-6967-5575-841d-3efb56178ffe
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    coûts et frais
  body: 'Quels sont les frais mensuels pour l''utilisation de ce compte ?


    L''utilisation du Compte courant et Formule Essentielle (carte à débit immédiat
    incluse) entraîne une cotisation mensuelle de 7,90 €. Ce montant couvre la gestion
    du compte et la mise à disposition de votre carte à débit immédiat.


    Quels sont les frais en cas de découvert ?


    Si vous utilisez un découvert autorisé, un taux d''intérêt de 15,9 % est appliqué
    sur les sommes utilisées. Par ailleurs, si une opération entraîne un dépassement
    du découvert autorisé, une commission d''intervention de 8 € est facturée, dans
    la limite d''un plafond mensuel de 80 €.


    Ces frais sont-ils négociables ?


    Nos tarifs reflètent le coût réel des services et la sécurité des opérations.
    Toutefois, pour les clients en situation de fragilité financière, nous proposons
    une offre spécifique dont le coût est limité à 3 € par mois au plus afin de réduire
    l''impact des frais d''incidents.


    Pour une vue d''ensemble, veuillez consulter le document Compte courant et Formule
    Essentielle (carte à débit immédiat incluse) — grille tarifaire.'
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 32545934-5a8c-51f7-9c8b-33340d1e7314
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    traiter une demande courante de bout en bout
  body: "Nous vous expliquons ici comment nous traitons l'une de vos demandes les\
    \ plus courantes : la modification de vos informations personnelles ou la demande\
    \ d'un service spécifique lié à votre Compte courant et Formule Essentielle (carte\
    \ à débit immédiat incluse).\n\nVoici les étapes du processus, du premier contact\
    \ jusqu'à la confirmation finale :\n\n1. Formulation de la demande :\nVous nous\
    \ faites part de votre besoin (par exemple, un changement d'adresse, la demande\
    \ d'une nouvelle carte à débit immédiat ou la modification de vos plafonds). \n\
    \n2. Vérification d'identité (KYC) :\nS'agissant d'une action modifiant l'état\
    \ de votre compte ou touchant à des informations sensibles, nous procédons obligatoirement\
    \ à une authentification forte. Nous vous demanderons de confirmer votre identité\
    \ via les protocoles de sécurité en vigueur. Aucune modification ne sera effectuée\
    \ sans cette validation conforme.\n\n3. Analyse et traitement :\nUne fois votre\
    \ identité confirmée, nous traitons votre demande. Si celle-ci implique un changement\
    \ de tarif ou l'application de nouveaux frais (comme le passage à une offre de\
    \ fragilité à 3 € par mois au plus), nous vous en informerons explicitement avant\
    \ validation.\n\n4. Confirmation et clôture :\nNous vous confirmons la prise en\
    \ compte de votre demande et vous précisons le délai d'application (par exemple,\
    \ la date d'effet du changement d'adresse ou la date de réception de votre nouvelle\
    \ carte).\n\nComment savoir si la demande est traitée ?\n\nLe processus est terminé\
    \ lorsque nous vous envoyons une confirmation écrite ou orale du changement effectué.\
    \ Vous pourrez ensuite constater la mise à jour de vos informations ou la réception\
    \ de votre nouveau service."
  domain: retail_banking
  product_category: compte_courant_essentiel
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 48f66b94-290c-5523-ae40-51fad186a2c3
  title: Compte courant et Formule Essentielle (carte à débit immédiat incluse) —
    écart avec vos relevés
  body: 'Lorsqu''un client signale un écart entre le solde constaté et ses propres
    calculs sur son Compte courant et Formule Essentielle (carte à débit immédiat
    incluse), nous suivons un protocole d''analyse rigoureux pour identifier l''origine
    de la différence.


    Symptômes :

    Le client constate que le solde final de son relevé ne correspond pas à la somme
    de ses opérations enregistrées.


    Points de vérification par ordre de priorité :


    1. Identification des commissions d''intervention :

    Vérifiez si des commissions d''intervention de 8 € ont été appliquées. Il arrive
    que le client oublie de comptabiliser ces frais déclenchés par un dépassement
    de découvert. Vérifiez également si le plafond mensuel de 80 € a été atteint,
    ce qui stopperait la facturation de nouvelles commissions.


    2. Analyse des intérêts débiteurs :

    Si le client a utilisé un découvert autorisé, vérifiez le calcul des intérêts
    basés sur le taux de 15,9 %. Ces intérêts sont prélevés périodiquement et peuvent
    expliquer un écart de solde.


    3. Vérification de la cotisation mensuelle :

    Assurez-vous que la cotisation de 7,90 € liée à la Formule Essentielle a bien
    été prise en compte dans les calculs du client.


    4. Identification d''opérations non autorisées :

    Si l''écart correspond à une transaction inconnue, vérifiez la date de l''opération.
    Rappelez au client qu''il dispose d''un délai de 13 mois pour contester une opération
    non autorisée.


    Résolution et escalade :


    - Si l''écart est dû à un frais légitime : Expliquez au client la nature du frais
    (commission d''intervention ou intérêt) en vous appuyant sur la grille tarifaire.

    - Si l''écart provient d''une erreur technique : Nous procédons à une correction
    immédiate du solde et nous notifions le client de la régularisation.

    - Si une fraude est suspectée : Nous lançons la procédure de traitement des fraudes
    avec diligence pour garantir le remboursement des opérations non autorisées.


    Pour plus de détails sur les tarifs appliqués, référez-vous au document Compte
    courant et Formule Essentielle (carte à débit immédiat incluse) — grille tarifaire.'
