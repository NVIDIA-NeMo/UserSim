- id: 29780744-851d-5123-9890-dfaab93b3e20
  title: Livret d'épargne populaire (LEP) — opération échouée ou en attente
  body: "Il peut arriver qu'un versement vers votre Livret d'épargne populaire (LEP)\
    \ soit refusé ou reste en attente. Voici comment identifier et résoudre le problème.\n\
    \n**Symptôme : Le virement vers le LEP est refusé**\n\n**Causes probables**\n\
    La cause la plus fréquente est le dépassement du plafond réglementaire. Le montant\
    \ total des dépôts sur un LEP ne peut excéder 10 000 €. Si le versement prévu,\
    \ ajouté au solde actuel, dépasse cette limite, l'opération est systématiquement\
    \ bloquée.\n\n**Actions à vérifier**\n1. Consultez le solde actuel de votre LEP\
    \ dans votre interface numérique.\n2. Additionnez ce solde au montant du versement\
    \ tenté. Si le résultat est supérieur à 10 000 €, le refus est normal.\n3. Vérifiez\
    \ si vous possédez un autre LEP dans un établissement concurrent, car la détention\
    \ d'un seul LEP par personne est obligatoire.\n\n**Résolution et escalade**\n\
    Si le plafond n'est pas atteint et que l'opération échoue toujours, nous intervenons\
    \ pour analyser l'incident. Nous vérifierons d'abord la conformité de vos données\
    \ KYC. Si un blocage administratif est constaté, nous ouvrirons un dossier de\
    \ régularisation. Vous recevrez une confirmation de traitement sous 48 heures\
    \ ouvrées. \n\nEn cas de doute sur vos droits, veuillez vous référer au document\
    \ Livret d'épargne populaire (LEP) — conditions d'éligibilité."
  domain: retail_banking
  product_category: lep
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: d4ac401e-2043-5f29-8b37-140a5a7e4447
  title: Livret d'épargne populaire (LEP) — conditions d'éligibilité
  body: 'L''éligibilité au Livret d''épargne populaire (LEP) est strictement encadrée
    par la réglementation fiscale. Voici la matrice de décision appliquée par Crédit
    Mirabelle :


    | Condition | Valeur / Seuil | Résultat |

    | :--- | :--- | :--- |

    | Revenu fiscal de référence (par part) | ≤ 23 028 € | Éligible |

    | Revenu fiscal de référence (par part) | > 23 028 € | Non éligible |

    | Nombre de LEP détenus (toutes banques confondues) | 0 | Éligible |

    | Nombre de LEP détenus (toutes banques confondues) | ≥ 1 | Non éligible |

    | Versement initial minimum | ≥ 30 € | Ouverture possible |

    | Versement initial minimum | < 30 € | Ouverture impossible |


    Note : En cas de dépassement du plafond de revenus lors d''un contrôle annuel,
    nous vous informerons des modalités de clôture ou de transformation du livret.'
  domain: retail_banking
  product_category: lep
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
