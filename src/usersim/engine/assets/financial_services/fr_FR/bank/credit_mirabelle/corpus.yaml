- id: 0dcc18a7-a14f-5b20-8e70-72bed88ff57e
  title: Carte Mirabelle Premier — protection contre la fraude et les opérations non
    autorisées
  body: 'La sécurité de vos avoirs est au cœur de notre engagement coopératif. La
    Carte Mirabelle Premier, par sa nature haut de gamme, peut être ciblée par des
    tentatives de fraude sophistiquées. Nous vous rappelons que Crédit Mirabelle ne
    vous demandera jamais, par téléphone, par courriel ou par SMS, de communiquer
    votre code secret, vos identifiants de connexion ou de valider une opération que
    vous n''avez pas initiée.


    Pour protéger vos transactions, nous appliquons une authentification forte et
    une vérification rigoureuse de l''identité avant toute modification sensible de
    votre compte. Si vous constatez une opération suspecte sur vos relevés, nous vous
    invitons à nous en informer sans délai. Conformément à notre politique de transparence
    et de protection, vous disposez d''un délai de 13 mois pour contester une opération
    mal exécutée ou non autorisée.


    Les schémas de fraude les plus fréquents pour ce type de carte incluent le « phishing
    » (hameçonnage) visant à subtiliser vos coordonnées bancaires via de faux sites
    administratifs ou commerciaux, ainsi que le « skimming » (copie de piste magnétique).
    Soyez vigilants lors de l''utilisation de distributeurs dont l''aspect semble
    altéré.


    En cas de perte, de vol ou de suspicion de fraude, la première action à entreprendre
    est le blocage immédiat de votre carte. Une fois le blocage effectué, nous traiterons
    la fraude avec diligence, en garantissant le remboursement des opérations non
    autorisées selon les délais légaux en vigueur.


    Nous vous recommandons de surveiller régulièrement vos plafonds de paiement, fixés
    à 8 000 € sur 30 jours, car une activité inhabituelle proche de ce seuil peut
    être le signe d''une utilisation frauduleuse. Pour plus de détails sur la sécurité
    globale de vos comptes, vous pouvez consulter le document Compte courant et Formule
    Essentielle (carte à débit immédiat incluse) — bonnes pratiques de sécurité du
    compte.'
  domain: cards
  product_category: carte_premier
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c4a457a4-5f8d-532a-94ef-5be86e42944e
  title: Carte Mirabelle Premier — conditions générales
  body: 'Les présentes conditions générales régissent l''utilisation de la Carte Mirabelle
    Premier. L''octroi de cette carte est soumis à la validation de votre identité
    conformément aux normes KYC et à l''analyse de votre profil client par nos services.


    Cotisation et Frais : L''utilisation de la carte implique le paiement d''une cotisation
    annuelle fixée à 132 €. Ce montant est prélevé annuellement sur votre compte courant.
    Pour tout paiement effectué hors de la zone euro, une commission de 1,5 % est
    appliquée sur le montant de l''opération, reflétant les coûts de conversion et
    de sécurité des réseaux internationaux.


    Limites d''utilisation : La carte est assortie de plafonds de sécurité stricts.
    Le plafond de paiement est fixé à 8 000 € sur une période glissante de 30 jours.
    Le plafond de retrait d''espèces est fixé à 1 500 € sur une période glissante
    de 7 jours. Tout dépassement de ces seuils entraînera le refus systématique de
    l''opération, sauf dérogation exceptionnelle accordée par la direction d''agence.


    Obligations du client : Vous vous engagez à conserver vos codes confidentiels
    secrets et à nous notifier immédiatement toute perte ou vol. La responsabilité
    du titulaire est engagée en cas de négligence grave dans la conservation de l''instrument
    de paiement.


    Modification et Résiliation : Crédit Mirabelle se réserve le droit de modifier
    les présentes conditions, notamment les tarifs, moyennant un préavis conformément
    au Code monétaire et financier. Vous disposez du droit de résilier votre contrat
    de carte à tout moment, sans frais supplémentaires outre la cotisation annuelle
    déjà perçue pour l''année en cours.


    En cas de litige, le processus d''escalade prévoit une résolution amiable avec
    votre conseiller, puis avec la direction d''agence, et enfin, si nécessaire, par
    le médiateur de la banque.'
  domain: cards
  product_category: carte_premier
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: cd4fdae1-294a-5415-afc0-84f674c9d4ac
  title: Carte Mirabelle Premier — pour qui et pour quels usages
  body: 'La Carte Mirabelle Premier est conçue pour nos clients et sociétaires recherchant
    une plus grande liberté financière et des plafonds de gestion étendus pour leurs
    dépenses quotidiennes ou exceptionnelles.


    Ce produit s''adresse particulièrement aux profils ayant des besoins de paiement
    importants, ainsi qu''aux voyageurs fréquents qui nécessitent une flexibilité
    accrue lors de leurs déplacements.


    Caractéristiques principales :

    - Plafonds de paiement : Un montant élevé de 8 000 € sur 30 jours, permettant
    d''effectuer des achats substantiels sans restriction fréquente.

    - Plafonds de retrait : Une capacité de retrait d''espèces de 1 500 € sur 7 jours,
    offrant une sécurité et une liquidité confortables.

    - Coût de service : Une cotisation annuelle de 132 €, reflétant la qualité des
    services et la sécurité accrue des opérations.

    - Usage international : Utilisable mondialement avec une commission de 1,5 % sur
    les paiements effectués hors zone euro.


    Pourquoi choisir la Carte Mirabelle Premier ?

    Contrairement à une carte standard, la formule Premier vous libère des contraintes
    de plafonds bas, tout en restant ancrée dans le modèle de proximité et de bienveillance
    de notre banque coopérative. Elle s''intègre parfaitement dans une stratégie de
    gestion globale pour ceux qui souhaitent conjuguer prestige et transparence tarifaire.


    Si vos besoins sont plus modestes et que vous recherchez une solution de gestion
    fondamentale, nous vous invitons à consulter la présentation Compte courant et
    Formule Essentielle (carte à débit immédiat incluse) — présentation.'
