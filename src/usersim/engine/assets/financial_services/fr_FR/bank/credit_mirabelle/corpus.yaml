- id: b186ff4f-b62f-50d9-af91-df0674dab746
  title: Parts sociales Mirabelle — problèmes d'accès ou de connexion
  body: "Il peut arriver que vous ne puissiez pas visualiser vos Parts sociales Mirabelle\
    \ ou accéder aux informations liées à votre statut de sociétaire. Voici comment\
    \ résoudre ces situations.\n\nSymptôme : Le solde de vos parts sociales n'apparaît\
    \ pas dans votre espace client ou sur vos relevés.\n\nCauses probables :\n1. Dossier\
    \ KYC incomplet : Votre identité n'a pas été vérifiée récemment, ce qui bloque\
    \ l'affichage des informations sensibles.\n2. Actualisation des registres : Une\
    \ modification récente de vos parts est encore en cours de traitement administratif.\n\
    3. Problème d'authentification : Votre session n'a pas été validée par l'authentification\
    \ forte obligatoire.\n\nProcédure de résolution :\n1. Vérifiez vos documents :\
    \ Assurez-vous que nous disposons de votre pièce d'identité en cours de validité.\
    \ Si ce n'est pas le cas, remettez-nous un justificatif d'identité conforme.\n\
    2. Testez l'authentification : Déconnectez-vous et reconnectez-vous en utilisant\
    \ le processus d'authentification forte pour rafraîchir vos droits d'accès.\n\
    3. Demandez un extrait du registre : Demandez-nous l'édition d'une attestation\
    \ papier de vos parts sociales pour confirmer que vos titres sont bien enregistrés\
    \ malgré le problème d'affichage numérique.\n\nSi le problème persiste après ces\
    \ étapes, nous escaladerons votre demande vers la direction d'agence pour un audit\
    \ manuel de votre compte social. Vous recevrez une notification de résolution\
    \ sous un délai correspondant aux normes de traitement interne de l'agence. \n\
    \nEn cas de litige persistant sur la valeur ou le nombre de vos parts, vous conservez\
    \ la possibilité de solliciter le médiateur de la banque, conformément à notre\
    \ processus d'escalade institutionnel."
  domain: retail_banking
  product_category: parts_sociales
  document_type: troubleshooting
  source_authority: official
  placeholder: true
