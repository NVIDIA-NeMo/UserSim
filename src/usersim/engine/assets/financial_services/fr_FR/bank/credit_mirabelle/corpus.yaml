- id: 2e66489c-ebb9-5b10-b1ac-3131edb1aee2
  title: Prêt immobilier à taux fixe Mirabelle — présentation
  body: "Le Prêt immobilier à taux fixe Mirabelle est conçu pour vous accompagner\
    \ dans la réalisation de vos projets d'acquisition immobilière avec une visibilité\
    \ totale et une sérénité durable. Fidèles à notre modèle de banque coopérative,\
    \ nous vous proposons un financement dont le coût reste inchangé tout au long\
    \ de la durée du contrat, vous protégeant ainsi contre les fluctuations des marchés\
    \ financiers.\n\nCe prêt se distingue par sa transparence et son encadrement rigoureux,\
    \ visant à garantir votre équilibre financier. Nous proposons deux options de\
    \ durée principale avec des taux attractifs : un taux de 3,35 % pour un engagement\
    \ sur 20 ans, et un taux de 3,55 % pour un engagement sur 25 ans. La durée maximale\
    \ de remboursement est fixée à 25 ans, afin de limiter l'endettement sur le très\
    \ long terme.\n\nPour garantir la viabilité de votre projet, nous appliquons un\
    \ taux d'endettement maximal de 35 %. Cette limite nous permet de nous assurer\
    \ que vos mensualités restent compatibles avec vos revenus et vos charges, conformément\
    \ aux recommandations des autorités monétaires.\n\nL'ouverture de ce crédit implique\
    \ des frais de dossier s'élevant à 1 000 €. Ces frais reflètent le travail d'analyse\
    \ et de mise en place sécurisée de votre financement. \n\nEn choisissant le Prêt\
    \ immobilier à taux fixe Mirabelle, vous bénéficiez non seulement d'un outil financier\
    \ stable, mais aussi de l'accompagnement bienveillant de nos conseillers en agence.\
    \ Nous nous engageons à analyser votre solvabilité avec rigueur et honnêteté avant\
    \ tout octroi de crédit, sans jamais minimiser le coût total de votre emprunt.\n\
    \nPour plus de détails sur les coûts associés, nous vous invitons à consulter\
    \ la document Prêt immobilier à taux fixe Mirabelle — grille tarifaire."
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: product_sheet
  source_authority: official
  placeholder: true
