- id: 650b75e8-84b3-55c1-8f56-9bd2d21ff51d
  title: Livret A — protection contre la fraude et les opérations non autorisées
  body: 'La sécurité de vos avoirs est au cœur de l''engagement de Crédit Mirabelle.
    Bien que le Livret A soit un produit d''épargne stable, il n''est pas exempt des
    tentatives de fraude visant à détourner vos fonds.


    Nous attirons votre attention sur les scénarios de fraude les plus fréquents :
    l''usurpation d''identité et l''ingénierie sociale. Des fraudeurs pourraient tenter
    de vous contacter en se faisant passer pour un collaborateur de notre banque ou
    un organisme officiel, vous demandant de transférer des fonds depuis votre Livret
    A vers un compte tiers sous prétexte de « sécuriser » vos avoirs ou de régler
    un litige administratif. Soyez vigilants : Crédit Mirabelle ne vous demandera
    jamais de déplacer vos fonds pour des raisons de sécurité.


    Nous vous rappelons que l''authentification forte et la vérification rigoureuse
    de l''identité sont obligatoires avant toute action modifiant l''état d''un compte.
    Aucun changement de données n''est effectué sans une validation d''identité conforme
    aux normes KYC.


    Si vous constatez une opération suspecte ou un retrait non autorisé sur votre
    Livret A, nous vous recommandons d''agir immédiatement. Informez-nous sans délai
    pour que nous puissions prendre les mesures de blocage nécessaires.


    Conformément aux délais légaux, vous disposez d''un délai de 13 mois pour contester
    une opération mal exécutée ou non autorisée. Nous traitons les fraudes avec diligence
    et nous garantissons le remboursement des opérations non autorisées selon les
    dispositions réglementaires en vigueur.


    Pour une vision complète de nos mesures de protection, nous vous invitons à consulter
    le document Livret A — informations réglementaires.'
  domain: retail_banking
  product_category: livret_a
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 62fae93f-ea81-516d-af57-e6ce403e1f9d
  title: Livret A — conditions générales
  body: 'Les présentes conditions générales régissent l''ouverture, le fonctionnement
    et la clôture du Livret A au sein de Crédit Mirabelle.


    Ouverture et Éligibilité : Le Livret A est accessible à tous les particuliers.
    L''ouverture du compte est conditionnée par un versement initial minimum de 10
    €. Chaque détenteur ne peut posséder qu''un seul Livret A, conformément à la réglementation
    en vigueur.


    Gestion des Fonds : Le Livret A est un compte d''épargne dont le plafond des dépôts
    est fixé à 22 950 €. Au-delà de ce montant, aucun nouveau versement ne peut être
    effectué, bien que le solde puisse excéder ce plafond grâce à la capitalisation
    des intérêts.


    Rémunération : Les fonds déposés sont rémunérés au taux réglementé de 1,7 %. Les
    intérêts sont calculés selon la règle des quinzaines et sont versés annuellement
    au 31 décembre.


    Protection des Dépôts : En tant que banque coopérative, nous garantissons la sécurité
    de vos dépôts. Vos avoirs sont protégés par le Fonds de Garantie des Dépôts et
    de Résolution (FGDR) jusqu''à 100 000 € par client et par établissement.


    Modification et Clôture : Crédit Mirabelle se réserve le droit de modifier les
    conditions de fonctionnement du livret, notamment suite à une décision administrative
    modifiant le taux réglementé. La clôture du compte peut être demandée par le client
    à tout moment. Le solde sera alors transféré vers un compte de règlement désigné
    par le client.


    Tout litige relatif à l''exécution de ces conditions sera traité avec équité,
    suivant notre processus d''escalade allant du conseiller à la direction d''agence,
    puis au médiateur de la banque.'
  domain: retail_banking
  product_category: livret_a
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: fdadd226-7394-50a4-8fee-87110be55afc
  title: Livret A — pour qui et pour quels usages
  body: 'Le Livret A est la solution d''épargne fondamentale pour tout client souhaitant
    concilier sécurité, disponibilité et fiscalité avantageuse. À Crédit Mirabelle,
    nous positionnons ce produit comme l''outil idéal pour la constitution d''une
    épargne de précaution.


    Pour qui est-ce fait ?

    Ce livret s''adresse à tous les particuliers, quel que soit leur profil financier.
    Il est particulièrement recommandé pour ceux qui souhaitent mettre de côté des
    fonds tout en gardant la possibilité d''y accéder instantanément en cas d''imprévu.


    Quels usages privilégier ?

    1. Épargne de précaution : Idéal pour constituer un « coussin de sécurité » permettant
    de faire face à des dépenses urgentes (travaux, santé, réparation).

    2. Transition financière : Un support temporaire pour placer des fonds avant un
    investissement plus long terme, comme un projet immobilier.

    3. Premier pas vers l''épargne : Accessible dès 10 €, c''est un excellent moyen
    d''initier une habitude de gestion budgétaire.


    Caractéristiques clés :

    - Rémunération : Un taux d''intérêt de 1,7 %, exonéré d''impôts et de prélèvements
    sociaux.

    - Accessibilité : Les fonds sont liquides et disponibles à tout moment.

    - Plafond : Vous pouvez verser jusqu''à 22 950 €.

    - Ouverture : Un dépôt minimum de 10 € est requis pour activer le compte.


    Le Livret A s''intègre parfaitement dans une stratégie globale avec d''autres
    produits de notre gamme. Pour ceux ayant des revenus modestes, nous recommandons
    d''examiner également le Livret d''épargne populaire (LEP) — présentation pour
    optimiser leur rendement.'
  domain: retail_banking
