- id: 4a118255-eb91-58e7-adb3-f859f53e5f41
  title: Prêt immobilier à taux fixe Mirabelle — opération échouée ou en attente
  body: 'Lors de la demande de Prêt immobilier à taux fixe Mirabelle, il peut arriver
    que votre dossier soit marqué comme « en attente » ou que la demande soit « échouée
    ». Voici comment identifier la cause et résoudre la situation.


    **Symptômes courants**

    *   Votre demande de simulation ne peut aboutir.

    *   L''offre de prêt ne vous est pas transmise après l''analyse du dossier.

    *   Le déblocage des fonds est suspendu.


    **Causes probables et vérifications**

    1. **Dépassement du ratio d''endettement** : Vérifiez si vos charges mensuelles
    actuelles, ajoutées à la mensualité du futur prêt, dépassent 35 % de vos revenus
    nets. Si c''est le cas, la demande peut être bloquée car nous ne pouvons pas engager
    un crédit au-delà de ce seuil.

    2. **Dossier KYC incomplet** : Vérifiez que toutes vos pièces d''identité sont
    à jour et conformes. Aucun changement ou activation de compte ne peut être effectué
    sans une validation d''identité rigoureuse.

    3. **Pièces justificatives manquantes** : Un avis d''imposition manquant ou un
    bulletin de salaire obsolète peut placer le dossier en état d''attente.


    **Résolution et escalade**

    *   **Mise à jour du dossier** : Fournissez-nous les documents manquants ou actualisés.
    Nous relancerons l''analyse immédiatement.

    *   **Ajustement du projet** : Si le taux d''endettement de 35 % est dépassé,
    nous pouvons étudier ensemble une extension de la durée du prêt jusqu''à 25 ans
    pour réduire la mensualité, ou un ajustement du montant emprunté.


    Si le blocage persiste malgré la conformité de vos documents, nous escaladerons
    votre dossier à la direction d''agence pour une étude personnalisée. Vous recevrez
    une réponse écrite motivée dans les plus brefs délais.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: ebcff91c-1adb-5867-9cdc-7d6174341521
  title: Prêt immobilier à taux fixe Mirabelle — conditions d'éligibilité
  body: 'Le tableau suivant récapitule les conditions d''éligibilité pour l''obtention
    du Prêt immobilier à taux fixe Mirabelle.


    | Condition | Seuil / Valeur | Résultat |

    | :--- | :--- | :--- |

    | Taux d''endettement | ≤ 35 % | Éligible |

    | Taux d''endettement | $>$ 35 % | Non éligible |

    | Durée du prêt demandée | ≤ 25 ans | Éligible |

    | Durée du prêt demandée | $>$ 25 ans | Non éligible |

    | Vérification d''identité | Conforme normes KYC | Éligible |

    | Vérification d''identité | Non conforme / Incomplète | Non éligible |


    L''éligibilité finale est soumise à l''analyse complète de la solvabilité par
    nos services. Pour comprendre comment ces conditions impactent votre dossier,
    consultez Prêt immobilier à taux fixe Mirabelle — présentation.'
