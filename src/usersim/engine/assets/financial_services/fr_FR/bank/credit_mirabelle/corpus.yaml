  title: Carte Mirabelle Premier — niveaux d'accès
  body: 'L''accès à la Carte Mirabelle Premier est conditionné par des critères de
    profil et de revenus, visant à garantir l''adéquation entre les plafonds élevés
    et la capacité financière du client.


    | Condition | Résultat / Niveau d''accès |

    | :--- | :--- |

    | Revenus mensuels conformes aux critères « Premier » | Éligible à la souscription
    avec cotisation de 132 € |

    | Client détenteur de parts sociales (Sociétaire) | Accès prioritaire et analyse
    de solvabilité facilitée |

    | Absence d''incidents de paiement majeurs sur 12 mois | Accès aux plafonds standards
    (8 000 € paiement / 1 500 € retrait) |

    | Profil financier en fragilité | Orientation vers la Formule Essentielle pour
    limiter l''impact des frais |

    | Justificatifs d''identité et de domicile validés (KYC) | Activation effective
    et remise de la carte |'
