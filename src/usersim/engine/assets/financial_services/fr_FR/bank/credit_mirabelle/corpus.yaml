- id: aaf04f87-13e7-592c-8901-f1e769ecb979
  title: Livret d'épargne populaire (LEP) — traiter une demande courante de bout en
    bout
  body: 'Nous vous guidons à travers le processus complet de souscription à un Livret
    d''épargne populaire (LEP), de la vérification de l''éligibilité à l''activation
    du compte.


    Avant de commencer, munissez-vous de votre dernier avis d''imposition, car il
    est indispensable pour justifier vos revenus.


    Voici les étapes de la demande :


    1. Justification de l''éligibilité : Communiquez-nous votre dernier avis d''imposition.
    Nous vérifierons que votre revenu fiscal de référence ne dépasse pas le plafond
    légal, qui est de 23 028 € pour une part.

    2. Demande d''ouverture : Une fois l''éligibilité confirmée, demandez l''ouverture
    du livret. Nous vérifierons également que vous ne détenez pas déjà un LEP dans
    un autre établissement, car un seul compte est autorisé par personne.

    3. Alimentation initiale : Effectuez un versement initial d''un montant minimum
    de 30 €. Ce montant peut être prélevé directement depuis votre compte courant
    Crédit Mirabelle.

    4. Confirmation d''activation : Nous vous confirmerons l''ouverture du compte
    et vous communiquerons vos identifiants de suivi. Votre épargne commence alors
    à produire des intérêts au taux de 2,5 %.


    Vous saurez que votre demande a été traitée avec succès lorsque vous verrez le
    nouveau livret apparaître dans votre liste de comptes avec le solde initial d''au
    moins 30 €. Vous pourrez dès lors effectuer des versements supplémentaires jusqu''à
    atteindre le plafond de 10 000 €.'
  domain: retail_banking
  product_category: lep
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: e1122a38-97bf-5d57-9725-fea7c907cf61
  title: Livret d'épargne populaire (LEP) — écart avec vos relevés
  body: "Ce guide est destiné aux conseillers pour aider les clients qui constatent\
    \ une différence entre le solde affiché et leurs propres calculs sur leur Livret\
    \ d'épargne populaire (LEP).\n\nSymptôme : Le client signale que le solde de son\
    \ livret ne correspond pas à la somme de ses versements moins ses retraits, ou\
    \ s'interroge sur le montant des intérêts versés.\n\nPoints de vérification et\
    \ causes probables :\n\n1. Date de capitalisation des intérêts : Les intérêts\
    \ du LEP, au taux de 2,5 %, ne sont pas versés mensuellement mais sont capitalisés\
    \ une fois par an, généralement au 31 décembre. Un client peut donc avoir l'impression\
    \ que son argent ne « travaille » pas durant l'année.\n   - Action : Expliquez\
    \ au client le fonctionnement de la capitalisation annuelle et vérifiez la date\
    \ du dernier crédit d'intérêts sur le relevé.\n\n2. Règle des quinzaines : Le\
    \ calcul des intérêts repose sur la règle des quinzaines (le 1er et le 16 de chaque\
    \ mois). Un versement effectué le 2 du mois ne produira des intérêts qu'à partir\
    \ du 16. De même, un retrait le 17 fera perdre les intérêts de la quinzaine en\
    \ cours.\n   - Action : Reprenez les dates de valeurs des opérations avec le client\
    \ pour lui montrer l'impact de la règle des quinzaines sur le calcul final.\n\n\
    3. Opérations en cours de traitement : Certaines opérations peuvent apparaître\
    \ avec un décalage entre la date d'opération et la date de valeur.\n\nProcédure\
    \ de résolution :\n- Si l'écart persiste après ces vérifications, nous procéderons\
    \ à un audit complet des mouvements depuis l'ouverture du compte.\n- Si une erreur\
    \ de calcul est avérée, nous rectifierons le solde immédiatement et informerons\
    \ le client par écrit.\n- En cas de litige persistant, le client peut demander\
    \ l'intervention du médiateur de la banque après passage par la direction d'agence."
  domain: retail_banking
  product_category: lep
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1bb6ba1b-bcdf-59ce-b7a8-3735a229aaba
  title: Carte Mirabelle Premier — présentation
  body: 'Bienvenue chez Crédit Mirabelle. Nous avons conçu la Carte Mirabelle Premier
    pour vous offrir une plus grande liberté financière et un accompagnement adapté
    à vos besoins de gestion quotidienne plus exigeants. Cette carte haut de gamme
    s''adresse aux clients et sociétaires qui recherchent une flexibilité accrue dans
    leurs paiements et leurs retraits, tout en restant ancrés dans un modèle coopératif
    fondé sur la proximité et la transparence.


    L''atout majeur de la Carte Mirabelle Premier réside dans ses plafonds étendus.
    Pour vos achats, vous bénéficiez d''un plafond de paiement de 8 000 € sur une
    période de 30 jours, vous permettant de réaliser des acquisitions importantes
    sans contrainte technique. Pour vos besoins de liquidités, le plafond de retrait
    est fixé à 1 500 € sur 7 jours.


    En termes de coûts, nous appliquons une politique de transparence totale. La cotisation
    annuelle pour le bénéfice de ces services et de la sécurité associée est de 132
    €. Pour vos opérations effectuées hors de la zone euro, des frais de paiement
    de 1,5 % sont appliqués sur le montant de la transaction, reflétant le coût réel
    des opérations de change et de sécurisation internationale.


    En choisissant la Carte Mirabelle Premier, vous optez pour un instrument de paiement
    robuste, soutenu par l''expertise de nos conseillers en agence. Nous vous rappelons
    que, conformément à notre engagement d''inclusion financière, nous proposons également
    d''autres solutions de gestion pour tous les profils. Si vous souhaitez comparer
    cette offre avec notre entrée de gamme, nous vous invitons à consulter le document
    Compte courant et Formule Essentielle (carte à débit immédiat incluse) — présentation.


    La Carte Mirabelle Premier n''est pas seulement un outil technique ; elle est
    le reflet de notre volonté de vous accompagner dans toutes les étapes de votre
    vie financière, avec la bienveillance et la rigueur qui caractérisent notre institution
    coopérative. Nos équipes se tiennent à votre disposition pour analyser ensemble
    si ce produit est le plus adapté à votre profil de dépenses actuel.'
