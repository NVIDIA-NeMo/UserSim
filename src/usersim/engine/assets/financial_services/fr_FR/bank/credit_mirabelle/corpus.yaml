  institution_id: credit_mirabelle
- id: 2ee43ae9-7536-5ed7-bd88-d412bedf80a9
  title: Carte Mirabelle Premier — bonnes pratiques de sécurité du compte
  body: 'La Carte Mirabelle Premier vous offre des capacités de paiement étendues,
    avec un plafond de 8 000 € sur 30 jours. Cette flexibilité accrue nécessite une
    vigilance renforcée pour protéger vos avoirs contre la fraude.


    Nous vous rappelons que Crédit Mirabelle ne vous demandera jamais, ni par téléphone,
    ni par e-mail, ni par SMS, votre code secret ou vos identifiants de connexion.
    Toute demande d''authentification forte via un lien reçu par message doit être
    traitée avec la plus grande prudence : c''est souvent le signe d''une tentative
    de phishing.


    Voici les règles d''or pour sécuriser vos opérations :

    1. Ne communiquez jamais vos codes confidentiels, même à un collaborateur de la
    banque.

    2. Surveillez régulièrement vos relevés de compte pour détecter toute opération
    inhabituelle.

    3. En cas de perte ou de vol, demandez-nous immédiatement le blocage de votre
    carte pour suspendre toute utilisation malveillante.


    Conformément aux dispositions légales, vous disposez d''un délai de 13 mois pour
    contester toute opération mal exécutée ou non autorisée. Nous nous engageons à
    traiter les fraudes avec diligence et à garantir le remboursement des opérations
    non autorisées selon les délais légaux en vigueur.


    Si vous constatez une transaction suspecte, même d''un faible montant, nous vous
    invitons à nous en informer sans délai. La rapidité de votre signalement est essentielle
    pour limiter l''impact d''une éventuelle compromission et nous permettre de sécuriser
    votre compte et vos moyens de paiement.'
  domain: cards
  product_category: carte_premier
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 536e9a3c-3fa9-5085-a071-9120da7c2cb5
  title: Carte Mirabelle Premier — modification des conditions
  body: 'Le présent document définit les modalités de modification des conditions
    d''utilisation de la Carte Mirabelle Premier. L''utilisation de ce service est
    régie par la convention de compte et les tarifs en vigueur au sein de notre coopérative.


    Les conditions tarifaires, notamment la cotisation annuelle fixée à 132 €, ainsi
    que les frais de paiement hors zone euro s''élevant à 1,5 %, peuvent être révisés
    annuellement par Crédit Mirabelle. Toute modification de ces tarifs fera l''objet
    d''une information préalable envoyée par voie postale ou électronique, respectant
    un préavis minimal de deux mois.


    Les plafonds d''utilisation, à savoir le plafond de paiement de 8 000 € sur 30
    jours et le plafond de retrait de 1 500 € sur 7 jours, sont définis selon le profil
    de risque et la solvabilité du client. Nous nous réservons le droit de modifier
    ces plafonds en cas de changement significatif de votre situation financière ou
    suite à des incidents de paiement répétés.


    En cas de désaccord avec les nouvelles conditions proposées, vous disposez de
    la possibilité de résilier votre contrat sans frais, sous réserve d''un préavis
    de 30 jours, en nous retournant la carte physique ou en nous fournissant une attestation
    de destruction. La résiliation met fin à l''engagement lié à la formule Premier
    mais n''efface pas les dettes éventuelles liées aux opérations déjà effectuées
    avec la carte.


    L''acceptation des nouvelles conditions est tacite si aucune opposition n''est
    formulée dans le délai de préavis imparti. Nous nous engageons à maintenir une
    transparence totale sur l''évolution de nos coûts pour refléter la réalité des
    services et la sécurité des opérations.'
  domain: cards
  product_category: carte_premier
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 90537bf0-bada-59cc-ab2f-5b5b9c973aca
  title: Carte Mirabelle Premier — prise en main pas à pas
  body: 'Ce guide est destiné aux conseillers pour accompagner les clients dans l''activation
    et la première utilisation de la Carte Mirabelle Premier.


    L''objectif est de s''assurer que le client comprend parfaitement les avantages
    de sa nouvelle carte haut de gamme et les modalités de son fonctionnement.


    1. Validation de l''identité : Avant toute remise de moyen de paiement, effectuez
    une vérification rigoureuse de l''identité du client conformément aux normes KYC.
    Aucune carte ne doit être remise sans validation d''identité conforme.


    2. Explication des frais : Confirmez au client que la cotisation annuelle est
    de 132 €. Expliquez que ce montant reflète le coût réel des services et la sécurité
    accrue offerte par cette gamme.


    3. Présentation des plafonds : Détaillez les capacités de la carte pour éviter
    tout blocage lors des premiers achats :

    - Le plafond de paiement est fixé à 8 000 € sur une période glissante de 30 jours.

    - Le plafond de retrait est fixé à 1 500 € sur une période glissante de 7 jours.


    4. Usage international : Informez le client qu''en cas de paiement hors zone euro,
    des frais de 1,5 % s''appliquent sur le montant de l''opération.


    5. Activation : Guidez le client pour effectuer son premier retrait dans un distributeur
    automatique ou son premier paiement avec code secret, ce qui activera définitivement
    la puce de la carte.


    L''agent doit s''assurer que le client a bien compris que ces plafonds sont des
    limites de sécurité et non des crédits accordés. Pour toute demande de modification
    ultérieure de ces plafonds, le client pourra nous solliciter directement.'
  domain: cards
  product_category: carte_premier
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 98f661db-dfd7-5599-ba6b-e38214446ace
  title: 'Carte Mirabelle Premier — plafond de paiement sur 30 jours : explications'
  body: 'Qu''est-ce que le plafond de paiement sur 30 jours de la Carte Mirabelle
    Premier ?

    Le plafond de paiement est la somme maximale que vous pouvez dépenser avec votre
    carte sur une période glissante de 30 jours. Pour la Carte Mirabelle Premier,
    ce montant est fixé à 8 000 €.


    Comment est calculé ce plafond ?

    Il ne s''agit pas d''un montant mensuel calendaire (du 1er au 30 du mois), mais
    d''un cumul glissant. Chaque jour, le montant dépensé il y a exactement 30 jours
    est « libéré » et s''ajoute à nouveau à votre capacité de paiement disponible.


    Que se passe-t-il si j''atteins la limite de 8 000 € ?

    Si le montant de votre achat dépasse le solde restant de votre plafond, l''opération
    sera refusée par le terminal de paiement. Nous vous invitons alors à nous contacter
    pour demander une augmentation temporaire de plafond si votre situation le justifie.'
  domain: cards
  product_category: carte_premier
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 20d473b8-de8c-5f87-ad4e-0bdcec515748
  title: Carte Mirabelle Premier — effectuer une modification
  body: 'Vous souhaitez modifier les caractéristiques ou les options liées à votre
    Carte Mirabelle Premier ? Voici la marche à suivre pour effectuer ces changements
    en toute sécurité.


    Avant de commencer, munissez-vous d''une pièce d''identité valide, car toute modification
    touchant à l''état d''un compte ou à des informations sensibles nécessite une
    vérification rigoureuse de votre identité selon nos normes de conformité.


    1. Formulez votre demande : Indiquez-nous précisément la modification souhaitée
    (par exemple, une demande d''augmentation temporaire du plafond de paiement de
    8 000 € pour un voyage ou un achat important).

    2. Vérification d''identité : Nous procéderons à une authentification forte. Selon
    le canal utilisé, cela peut prendre la forme d''une validation via votre application
    sécurisée ou de la présentation d''un document officiel en agence.

    3. Analyse de la demande : Pour les modifications de plafonds, nous analyserons
    la solvabilité de votre compte et l''historique de vos opérations pour nous assurer
    que la modification est compatible avec votre profil financier.

    4. Confirmation : Une fois la demande validée, nous vous confirmerons la prise
    en compte du changement. S''il s''agit d''un plafond, vous recevrez la notification
    du nouveau montant disponible.


    Sachez que si vous souhaitez changer totalement de gamme de carte, nous vous invitons
    à consulter le document Carte Mirabelle Premier — choisir entre les formules pour
    comparer les options disponibles.'
  domain: cards
  product_category: carte_premier
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 99a1cb17-69c0-5e1b-8b45-e3e93feea2e7
  title: Carte Mirabelle Premier — problèmes d'accès ou de connexion
  body: 'Vous rencontrez des difficultés pour accéder aux services liés à votre Carte
    Mirabelle Premier ou pour effectuer une opération ? Voici comment identifier et
    résoudre le problème.


    Symptôme : Votre carte est refusée lors d''un paiement alors que votre solde est
    suffisant.

    Causes possibles :

    - Le plafond de paiement sur 30 jours (8 000 €) a été atteint.

    - Le plafond de retrait sur 7 jours (1 500 €) a été dépassé.

    - Votre code secret a été saisi trois fois consécutivement de manière erronée.

    - La puce de la carte est endommagée ou sale.


    Procédure de vérification :

    1. Vérifiez vos plafonds : Consultez vos derniers achats sur les 30 derniers jours
    pour voir si vous approchez de la limite des 8 000 €.

    2. Testez un autre terminal : Si possible, essayez un autre distributeur ou commerçant
    pour exclure une panne du terminal.

    3. Vérifiez l''état physique : Nettoyez délicatement la puce de votre carte avec
    un chiffon sec.


    Résolution et escalade :

    Si le problème persiste, nous pouvons intervenir immédiatement durant la conversation
    :

    - Nous pouvons débloquer votre carte si celle-ci a été suspendue suite à des erreurs
    de code.

    - Nous pouvons augmenter temporairement vos plafonds après analyse de votre solvabilité.


    Si la carte est physiquement défectueuse, nous déclencherons l''envoi d''une nouvelle
    carte. L''escalade vers la direction d''agence est prévue si un blocage persiste
    sans cause identifiée, afin de garantir le rétablissement rapide de vos services
    de paiement.'
  domain: cards
  product_category: carte_premier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
