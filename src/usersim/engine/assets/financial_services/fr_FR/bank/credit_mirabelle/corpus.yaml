- id: 2f9cbcc2-4a27-5677-b43a-2f40a23a24e6
  title: Prêt immobilier à taux fixe Mirabelle — comparaison avec les alternatives
    et quand ne pas le choisir
  body: 'Choisir son financement immobilier est une décision stratégique. Le Prêt
    immobilier à taux fixe Mirabelle offre la sécurité d''une mensualité immuable,
    mais il n''est pas adapté à tous les projets.


    Avantages de notre offre :

    La principale force de ce produit est la sérénité. Avec un taux fixe de 3,35 %
    sur 20 ans ou 3,55 % sur 25 ans, vous êtes protégé contre toute hausse des taux
    d''intérêt durant toute la durée du prêt. Vous connaissez exactement le coût de
    votre crédit dès le premier jour.


    Quand ne pas choisir ce produit ?

    - Si vous envisagez un remboursement anticipé très rapide : Un prêt à taux fixe
    peut être moins flexible qu''un prêt à taux variable dans certains contextes de
    marché.

    - Si vous avez besoin d''une durée de financement supérieure à 25 ans : Notre
    produit est strictement limité à une durée maximale de 25 ans. Pour des projets
    nécessitant un étalement plus long, d''autres solutions devront être recherchées.

    - Si vous ne respectez pas le critère d''endettement : Ce prêt ne peut être octroyé
    si vos charges dépassent 35 % de vos revenus.


    Comparaison structurelle :

    Contrairement aux offres de banques purement commerciales, notre modèle coopératif
    privilégie la proximité et la transparence. Nos frais de dossier de 1 000 € reflètent
    le coût réel de l''analyse rigoureuse de votre dossier pour garantir votre sécurité
    financière.


    Note réglementaire : Tout prêt immobilier est soumis à un délai de réflexion obligatoire
    de dix jours. Nous ne nous engageons jamais sur l''octroi d''un crédit avant l''analyse
    complète de votre solvabilité.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 7b3336ac-aefc-5708-a6b2-3a20dafb2853
  title: 'Prêt immobilier à taux fixe Mirabelle — durée maximale (années) : explications'
  body: "Question : Quelle est la durée maximale de remboursement pour un prêt immobilier\
    \ Mirabelle et quel impact cela a-t-il sur mon prêt ?\n\nRéponse : La durée maximale\
    \ autorisée pour le Prêt immobilier à taux fixe Mirabelle est de 25 ans. \n\n\
    L'impact de la durée est double :\n1. Sur la mensualité : Plus la durée est longue\
    \ (jusqu'à 25 ans), plus la mensualité est faible, ce qui facilite le respect\
    \ du taux d'endettement maximal de 35 %.\n2. Sur le coût total : Une durée plus\
    \ longue augmente le montant total des intérêts que vous paierez. C'est pourquoi,\
    \ pour une durée de 25 ans, le taux est de 3,55 %, alors qu'il est de 3,35 % pour\
    \ une durée de 20 ans.\n\nNous vous aidons à choisir la durée la plus équilibrée\
    \ entre votre confort mensuel et le coût global de votre acquisition. Pour plus\
    \ de détails sur les taux, consultez : Prêt immobilier à taux fixe Mirabelle —\
    \ présentation."
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 6e9da79f-9366-5664-865c-f241db2fd634
  title: Prêt immobilier à taux fixe Mirabelle — traiter une demande courante de bout
    en bout
  body: 'Voici le parcours complet pour souscrire à un Prêt immobilier à taux fixe
    Mirabelle, de la première demande au déblocage des fonds :


    1. Présentez-nous votre projet immobilier et vos documents financiers. Nous effectuons
    alors une vérification rigoureuse de votre identité conformément aux normes KYC.

    2. Nous réalisons l''analyse de votre solvabilité. Cette étape est cruciale :
    nous vérifions que vos charges futures, incluant la nouvelle mensualité, ne dépassent
    pas le taux d''endettement maximal de 35 %.

    3. Nous vous proposons une offre basée sur la durée choisie : un taux de 3,35
    % pour 20 ans ou 3,55 % pour 25 ans. Nous vous détaillons le coût total du prêt
    sans aucune minimisation.

    4. Vous recevez l''offre de prêt officielle. Vous disposez alors d''un délai de
    réflexion obligatoire de dix jours avant de pouvoir signer l''acceptation.

    5. Après signature et validation des garanties, nous appliquons les frais de dossier
    s''élevant à 1 000 €.

    6. Nous procédons au déblocage des fonds chez le notaire pour finaliser votre
    acquisition.


    Le processus est terminé lorsque les fonds sont versés et que vous recevez votre
    tableau d''amortissement définitif.


    Pour savoir quels documents préparer, consultez : Prêt immobilier à taux fixe
    Mirabelle — justificatifs à fournir.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 1b193988-dc88-5417-bafd-75f31d33860c
  title: Prêt immobilier à taux fixe Mirabelle — écart avec vos relevés
  body: 'Symptôme : Un client signale que le montant prélevé pour sa mensualité de
    prêt immobilier ne correspond pas au montant indiqué sur son tableau d''amortissement
    ou ses relevés précédents.


    Procédure de vérification pour le conseiller :

    1. Vérifier le taux appliqué : Confirmer si le prêt est sur 20 ans (3,35 %) ou
    25 ans (3,55 %). Un mauvais paramétrage du taux peut induire un écart.

    2. Analyser l''assurance emprunteur : L''écart provient souvent d''une modification
    de la prime d''assurance (échéance annuelle ou ajustement d''âge) qui s''ajoute
    à la mensualité du crédit.

    3. Contrôler la date de prélèvement : Vérifier si deux mensualités ont été prélevées
    le même mois suite à un décalage de calendrier ou un report autorisé.

    4. Vérifier les frais annexes : S''assurer qu''aucun frais d''incident n''a été
    imputé sur le compte courant, ce qui pourrait donner l''impression d''un coût
    de crédit plus élevé.


    Résolution :

    - S''il s''agit d''une erreur de calcul du taux, nous procédons immédiatement
    à une correction et au remboursement du trop-perçu sur le compte du client.

    - S''il s''agit de l''assurance, nous fournissons au client le détail du nouveau
    montant de la prime.


    Échelon d''escalade :

    Si l''écart persiste et n''est pas expliqué par l''assurance ou le taux, le dossier
    doit être remonté à la direction d''agence pour un audit comptable du prêt. Le
    client doit être informé du délai de traitement.


    Pour plus d''informations sur la gestion des comptes, voir : Compte courant et
    Formule Essentielle (carte à débit immédiat incluse) — frais ou montant inattendu.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 43345df3-f694-5f6e-ace4-0b7df8e13401
  title: Parts sociales Mirabelle — présentation
  body: 'Bienvenue chez Crédit Mirabelle. Nous vous proposons, à travers nos Parts
    sociales Mirabelle, bien plus qu''un simple placement financier : nous vous offrons
    l''opportunité de devenir un acteur central de notre institution.


    En souscrivant à nos parts sociales, vous changez de statut pour devenir un Sociétaire.
    Le Sociétaire est un client détenteur de parts sociales, participant à la gouvernance
    locale et disposant d''une voix en assemblée générale. Ce modèle coopératif nous
    permet de rester ancrés localement et de garantir que les décisions de la banque
    reflètent les besoins réels de nos membres et de notre communauté.


    Sur le plan financier, l''accès à ce capital est conçu pour être inclusif. Le
    prix d''une part sociale est fixé à 15 €. Vous pouvez souscrire au nombre de parts
    qui vous convient, selon vos capacités et vos souhaits d''implication.


    En contrepartie de votre engagement et de la mise à disposition de vos fonds,
    nous assurons une rémunération de vos parts sociales. Le taux de rémunération
    actuel est de 2,1 %. Ce rendement vous permet de faire fructifier votre capital
    tout en soutenant le développement de votre banque coopérative.


    Il est important de noter que les parts sociales représentent un titre de propriété.
    À ce titre, elles s''inscrivent dans une stratégie d''investissement à moyen ou
    long terme. Elles ne sont pas aussi liquides qu''un compte d''épargne classique,
    car leur rachat est soumis aux conditions de disponibilité des fonds de la coopérative
    et à l''approbation des instances de gouvernance.


    Nous vous invitons à consulter la grille des taux pour plus de détails sur la
    rémunération, ou à découvrir les conditions d''éligibilité pour débuter vos démarches.'
  domain: retail_banking
  product_category: parts_sociales
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 5a823fad-d1c5-5f03-8e38-8eaf911ed0d1
  title: 'Parts sociales Mirabelle — valeur d''une part sociale : explications'
  body: 'Question : Quel est le prix d''une part sociale Mirabelle et comment est-il
    déterminé ?

    Réponse : Le prix d''une seule part sociale est de 15 €. Cette valeur est fixe
    et permet à chaque client, quel que soit son niveau de revenu, d''accéder au statut
    de Sociétaire et de participer ainsi à la vie démocratique de notre banque.


    Question : La valeur de ma part sociale peut-elle augmenter avec le temps ?

    Réponse : La valeur nominale de la part reste de 15 €. Cependant, votre investissement
    est valorisé par la rémunération annuelle qui vous est versée. Actuellement, ce
    taux de rémunération est de 2,1 %.


    Question : Puis-je acheter un nombre fractionnaire de parts ?

    Réponse : Non, la souscription s''effectue exclusivement par parts entières. Vous
    devez donc investir des multiples de 15 €.


    Pour en savoir plus sur la nature de ce produit, nous vous suggérons la lecture
    du document Parts sociales Mirabelle — présentation.'
