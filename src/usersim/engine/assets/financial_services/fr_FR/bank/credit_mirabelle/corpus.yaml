- id: 07b3e101-c3ce-53f2-9a98-61fe406e1342
  title: Livret A — niveaux d'accès
  body: 'Ce tableau définit les droits d''accès et les opérations autorisées selon
    le profil de l''utilisateur pour le Livret A. Ces règles garantissent la sécurité
    des fonds et la conformité aux directives de l''ACPR.


    | Profil d''accès | Consultation du solde | Versements (jusqu''à 22 950 €) | Retraits
    / Virements | Modification des données |

    | :--- | :---: | :---: | :---: | :---: |

    | **Titulaire unique** | Oui | Oui | Oui | Oui |

    | **Co-titulaire** | Oui | Oui | Oui | Oui (avec accord) |

    | **Mandataire** | Oui | Non | Oui (selon mandat) | Non |

    | **Représentant légal** | Oui | Oui | Oui | Oui |


    **Notes importantes :**

    - L''accès "Mandataire" nécessite la signature d''un mandat formel et une vérification
    d''identité complète.

    - Tout retrait effectué par un mandataire doit rester dans le cadre des pouvoirs
    délégués pour éviter tout blocage de sécurité.

    - Le respect du plafond de 22 950 € est strictement contrôlé lors de chaque tentative
    de versement, quel que soit le profil d''accès.'
