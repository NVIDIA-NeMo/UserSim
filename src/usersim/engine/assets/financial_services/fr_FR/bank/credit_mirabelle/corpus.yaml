  institution_id: credit_mirabelle
- id: 3192f9f0-8c67-5aa6-b758-915e6aedccbe
  title: Prêt immobilier à taux fixe Mirabelle — informations réglementaires
  body: 'Le Prêt immobilier à taux fixe Mirabelle est régi par les dispositions du
    Code monétaire et financier et s''inscrit dans une conformité stricte aux directives
    de l''ACPR et de la Banque de France.


    **Protection et Garantie**

    Conformément aux normes en vigueur, vos avoirs et dépôts au sein de notre institution
    sont protégés par le Fonds de Garantie des Dépôts et de Résolution (FGDR) jusqu''à
    un montant de 100 000 € par client et par banque.


    **Obligations de l''Établissement**

    Nous nous engageons à une transparence totale sur les coûts. Le taux d''intérêt
    (3,35 % sur 20 ans ou 3,55 % sur 25 ans) est fixe et définitif pour la durée du
    contrat. Nous appliquons systématiquement une analyse de solvabilité rigoureuse
    avant tout engagement de prêt, afin de prévenir le surendettement. À ce titre,
    nous respectons un plafond strict de taux d''endettement maximal de 35 %.


    **Droits de l''Emprunteur**

    Conformément à la loi, tout emprunteur immobilier bénéficie d''un délai de réflexion
    obligatoire de dix jours après la réception de l''offre de prêt. Ce délai est
    indispensable pour permettre une analyse complète des engagements contractuels
    avant signature.


    **Frais et Transparence**

    Les frais de dossier, fixés à 1 000 €, sont communiqués dès la phase de simulation.
    Nous ne minimisons jamais le coût total du prêt et fournissons un tableau d''amortissement
    exhaustif lors de l''offre.


    Pour toute question relative à la gestion des litiges, sachez que notre processus
    d''escalade mène, en dernier recours, au médiateur de la banque.'
  domain: lending_mortgage
  product_category: pret_immobilier
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: c87da34a-2c1d-52ae-a805-44420cb25194
  title: Prêt immobilier à taux fixe Mirabelle — grille des taux
  body: 'Voici la grille des taux applicables pour le Prêt immobilier à taux fixe
    Mirabelle. Ces taux sont fixes, ce qui signifie qu''ils ne seront pas modifiés
