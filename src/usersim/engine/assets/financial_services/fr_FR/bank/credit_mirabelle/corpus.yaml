- id: ca90c298-ec33-5399-9c51-4d7eea49816f
  title: 'Livret A — taux de rémunération : explications'
  body: 'Vous possédez déjà un Livret A et vous vous interrogez sur son fonctionnement
    financier. Voici les réponses aux questions les plus fréquentes concernant sa
    rémunération.


    **Comment est calculé le taux de mon Livret A ?**

    Le taux du Livret A est fixé par l''État. Chez Crédit Mirabelle, nous appliquons
    scrupuleusement ce taux réglementé, qui est actuellement de 1,7 %. Les intérêts
    sont calculés selon la règle des quinzaines : ils sont dus pour chaque quinzaine
    complète où les fonds sont restés sur le compte.


    **À quand remonte la dernière mise à jour du taux ?**

    Le taux est révisé périodiquement par les autorités monétaires. Nous vous informons
    de tout changement via vos relevés de compte ou notre interface numérique.


    **Les intérêts sont-ils imposables ?**

    Non, l''un des avantages majeurs du Livret A est l''exonération totale d''impôt
    sur le revenu et de prélèvements sociaux sur les intérêts produits. Le montant
    de 1,7 % est donc net pour vous.


    Pour une vue d''ensemble des chiffres applicables, vous pouvez vous référer à
    la Livret A — grille des taux.'
  domain: retail_banking
  product_category: livret_a
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: credit_mirabelle
- id: 4bb7e8b1-231c-5ff3-9852-51ebfad52ec0
  title: Livret A — souscrire et activer
  body: 'L''ouverture d''un Livret A au sein de notre coopérative est une démarche
    simple et rapide. Si vous comparez différentes options d''épargne, sachez que
    ce produit offre un équilibre optimal entre sécurité et disponibilité.


    Voici les étapes pour souscrire et activer votre compte :


    1. **Fournir vos justificatifs d''identité** : Pour répondre aux normes KYC et
    garantir la sécurité de vos avoirs, nous vous demandons de nous présenter une
    pièce d''identité officielle en cours de validité. Cette étape est obligatoire
    avant toute modification d''état de compte.


    2. **Définir le versement initial** : Pour activer le compte, vous devez effectuer
    un premier dépôt. Ce montant doit être d''au moins 10 €. Vous pouvez nous indiquer
    la somme que vous souhaitez transférer depuis votre compte courant ou via un autre
    moyen de paiement.


    3. **Valider l''ouverture** : Une fois vos documents vérifiés et le dépôt initial
    reçu, nous procédons à l''ouverture technique du livret. Nous vous confirmons
    l''activation du compte par un message sécurisé ou un courriel.


    4. **Gérer vos fonds** : Votre Livret A est désormais actif. Vous pouvez commencer
    à épargner jusqu''au plafond réglementaire de 22 950 €. Vous pouvez effectuer
    vos opérations via vos conseillers en agence, notre centre d''appels ou votre
    interface numérique.


    Nous vous rappelons que vous ne pouvez détenir qu''un seul Livret A par personne,
    toutes banques confondues. Avant de commencer, nous vous suggérons de vérifier
    vos conditions d''éligibilité dans le document Livret A — conditions d''éligibilité.'
