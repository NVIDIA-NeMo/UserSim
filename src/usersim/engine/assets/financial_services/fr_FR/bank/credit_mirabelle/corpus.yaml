- id: 56ca65b9-2b96-5844-926b-76ea76b21000
  title: Parts sociales Mirabelle — bonnes pratiques de sécurité du compte
  body: "La détention de Parts sociales Mirabelle fait de vous un membre à part entière\
    \ de notre institution. Cette position implique une vigilance accrue concernant\
    \ la sécurité de vos informations et de vos accès.\n\nNous vous rappelons que\
    \ Crédit Mirabelle applique des normes de vérification d'identité rigoureuses\
    \ (KYC). Aucune modification de vos données personnelles ou demande de cession\
    \ de parts ne sera traitée sans une authentification forte et une validation d'identité\
    \ conforme. \n\nVoici les points de vigilance essentiels pour protéger vos avoirs\
    \ :\n\n1. Vigilance face au phishing : Nous ne vous demanderons jamais, par SMS\
    \ ou par courriel, de communiquer vos codes secrets, vos identifiants de connexion\
    \ ou de valider une opération de transfert de parts via un lien externe.\n2. Confidentialité\
    \ des documents : Vos attestations de détention de parts sociales contiennent\
    \ des informations sensibles. Veillez à ne les transmettre qu'à des organismes\
    \ certifiés.\n3. Signalement immédiat : Si vous constatez une anomalie dans le\
    \ nombre de vos parts ou une demande de modification que vous n'avez pas initiée,\
    \ informez-nous sans délai.\n\nSachez que vos dépôts et titres sont protégés conformément\
    \ aux directives en vigueur. Le Fonds de Garantie des Dépôts et de Résolution\
    \ (FGDR) assure la protection de vos avoirs jusqu'à 100 000 € par client et par\
    \ banque, vous offrant ainsi une sécurité optimale pour votre investissement coopératif.\n\
    \nEn cas de doute sur la légitimité d'une sollicitation, nous vous invitons à\
    \ suspendre toute action et à nous contacter directement via vos canaux habituels\
    \ pour vérification."
  domain: retail_banking
