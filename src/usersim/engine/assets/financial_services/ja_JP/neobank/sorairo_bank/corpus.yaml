- id: 4f884e00-6f40-5578-a647-5ac72c9fadd7
  title: 目的別口座：よくあるお手続きの流れ
  body: "目的別口座を新しく作成し、自動的に貯金を始めるまでの流れです。\n\n1.  アプリの「目的別口座」メニューから「新しく作る」ボタンをタップします。\n\
    2.  口座に名前を付けます（例：「2026年旅行資金」など）。\n3.  最初に移動させる金額を入力し、確定します。これで口座が作成され、年0.45%の金利が適用されます。\n\
    4.  （任意）「自動入金設定」を選択し、毎月移動させる金額を指定します。\n    *   **注意点**：自動入金を設定する場合、最低1,000円から指定いただけます。\n\
    5.  設定内容を確認し「完了」をタップすると、次回の指定日から自動的に普通預金から資金が振り分けられます。\n\nこれで、意識しなくても自動的に目的別の貯蓄が進む状態になります。"
