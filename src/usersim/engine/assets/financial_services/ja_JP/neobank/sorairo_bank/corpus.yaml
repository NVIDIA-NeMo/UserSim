- id: ffa5429c-11ec-57ce-a42b-06d41508a0fe
  title: 普通預金：商品概要
  body: 'そらいろ銀行の「普通預金」は、高い金利設定により、日常的な資金管理の基盤となるメイン口座です。店舗を持たないインターネット専業銀行として、スマートフォンアプリのみで完結するスムーズな体験を提供します。


    【主な特徴とメリット】

    ・業界競争力のある金利：普通預金金利は0.45%となっており、効率的な資産形成をサポートします。

    ・利便性の高い無料枠：日常的に使いやすいよう、他行あて振込手数料と提携ATM出金手数料に、それぞれ月2回の無料枠を設けています。

    ・安心のセキュリティ：金融庁の監督を受け、預金保険制度により元本1,000万円まで（決済用預金は全額）保護される安全な環境をご提供しています。


    【適用される各種数値】

    ・普通預金金利：0.45%

    ・他行あて振込手数料の無料回数（月、基本）：2回

    ・提携ATM出金手数料の無料回数（月、基本）：2回

    ・無料回数を超えた他行あて振込手数料：145円

    ・無料回数を超えたATM手数料：110円


    詳細な手数料については「普通預金：手数料一覧」をご確認ください。'
  domain: retail_banking
