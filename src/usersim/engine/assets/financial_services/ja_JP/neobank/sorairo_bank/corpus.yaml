- id: ab31acc7-3bfe-51dd-9953-54bb514a3a5f
  title: set_alerts を使う場面
  body: 'お客様から、口座残高が一定額を下回った際や、高額な入出金があった際に通知を受け取りたいという要望があった場合に本ツールを使用します。これにより、お客様はアプリを都度開くことなく、リアルタイムで資産状況を把握し、計画的な資金管理を行うことが可能になります。


    オペレーターは以下の手順に従って設定を行います。


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を使用して、通知設定を希望される口座の `account_id` を特定します。

    3. 通知を希望する条件（残高のしきい値や、特定の取引種別など）をお客様から聞き取ります。

    4. `set_alerts` を呼び出し、指定された条件で通知設定を有効にします。


    設定内容の確認や変更方法について、お客様から問い合わせがあった場合は、併せて「普通預金：状況・履歴の確認」をご案内ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: sorairo_bank
- id: a1b744c9-6e3c-5a85-9f6e-aca6e500370a
  title: set_alerts ツールリファレンス
  body: '口座の通知（アラート）設定を作成または変更するツールです。


    オペレーターは、`verify_identity` による本人確認が完了した後、本ツールを直接呼び出すことで、お客様の希望する条件に基づいた通知設定を適用します。設定対象の口座を特定するために、事前に
    `get_accounts` を実行してください。


    - 実行内容：残高変動や取引発生時に通知を飛ばすための条件設定

    - 前提条件：`verify_identity` による本人確認済みであること'
