- id: 1a5a1567-f6d3-54e3-b25d-aae76f0dad0a
  title: そらいろVisaデビット：個人情報の取扱い
  body: 'そらいろ銀行は、個人情報保護法および犯罪収益移転防止法を遵守し、お客様の個人情報を厳重に管理いたします。そらいろVisaデビットの利用に伴い取得する情報の取扱いは以下の通りです。


    ■取得する情報とその目的

    当行は、カードの発行および決済サービスの提供、不正利用の検知、および法令に基づく本人確認のため、氏名、住所、生年月日、取引履歴などの個人情報を取得します。特に、不正送金やフィッシング詐欺等の犯罪を防止するため、利用パターンなどのデータを分析し、安全な取引環境の維持に努めております。


    ■情報の第三者提供

    お客様の同意がある場合、または法令に基づき開示が求められた場合を除き、個人情報を第三者に提供することはありません。ただし、Visaネットワークを通じた決済処理のため、決済代行会社や加盟店に対し、必要な範囲で取引情報を共有いたします。


    ■お客様の権利

    お客様は、ご自身の個人情報の開示、訂正、または利用停止を請求することができます。手続きはアプリ内の設定メニューまたは当行オペレーターを通じて受け付けます。


    ■安全管理措置

    当行は、最新のセキュリティ技術を導入し、個人情報の漏洩、滅失、毀損の防止に万全を期しています。万が一、不正利用などの疑いがある場合は、速やかに「そらいろVisaデビット：安全にご利用いただくためのポイント」に沿った対応をお願いいたします。'
