- id: a583d0a1-3c0d-553d-ba42-499a8b8dd705
  title: 普通預金：個人情報の取扱い
  body: 'そらいろ銀行では、個人情報保護法および金融庁の監督指針に基づき、お客様の個人情報を厳重に管理しております。


    【個人情報の収集目的】

    普通預金口座の開設および維持管理にあたり、犯罪収益移転防止法に基づいた取引時確認（本人確認）を行います。収集した情報は、口座開設の審査、不正利用の防止、および法令に基づく報告業務にのみ利用いたします。


    【情報の保護と安全管理】

    お客様の個人情報は、高度な暗号化技術を用いて保護されており、厳格なアクセス権限管理のもとで取り扱われます。また、預金保険制度により、元本1,000万円まで（決済用預金は全額）保護される安全な環境を提供しております。


    【第三者提供について】

    法令に基づく要請がある場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    【お問い合わせ】

    個人情報の取り扱いに関するご質問や、開示・訂正のご請求は、アプリ内の設定メニューまたは専門オペレーターまでご連絡ください。


    重要事項の詳細については「普通預金：重要事項のご説明」をご参照ください。'
