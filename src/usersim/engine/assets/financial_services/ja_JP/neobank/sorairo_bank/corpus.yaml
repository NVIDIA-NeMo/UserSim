- id: 3c71d30e-c5d7-5c60-b285-1c5df59d69b0
  title: create_goal_pocket ツールリファレンス
  body: '目的別口座を新規作成するツールです。オペレーターが直接呼び出すことで、アプリに新しい貯蓄枠が追加されます。


    【引数】

    ・account_id: 親口座の識別子（get_accounts で取得）

    ・pocket_name: 口座の名称

    ・target_amount: 目標金額（円）

    ・monthly_auto_deposit: 毎月の自動入金額（円）


    目的別口座は最大10個まで作成できます。毎月の自動入金額は1,000円以上で指定します。'
