  institution_id: sorairo_bank
- id: dbed2f86-1066-5122-91a7-2415f0685bff
  title: 普通預金：金利・料率一覧
  body: '普通預金に適用される金利は以下の通りです。


    ■適用金利

    ・普通預金金利：0.45%


    【金利の適用について】

    ・本金利は、口座残高の金額にかかわらず、すべての方に一律で適用されます。

    ・金利は年率で表示されており、実際にお支払いされる利息は、計算方法に基づき算出されます。


    【金利の変更について】

    市場金利の変動に伴い、金利が改定される場合がございます。改定の際は、アプリ内通知および公式サイトにて速やかにお知らせいたします。'
