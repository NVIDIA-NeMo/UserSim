  institution_id: sorairo_bank
- id: 7aea2fe2-f013-552d-8fc2-b30b9167d785
  title: 普通預金：明細や記録と合わない
  body: '**【症状】**

    お客様から「アプリ上の残高や取引明細が、自身の記録と一致しない」と問い合わせがあった場合。


    **【確認ステップ】**

    1. **手数料の適用確認**：無料回数（振込2回、ATM出金2回）を超えて利用し、145円または110円の手数料が差し引かれていないか確認してください。

    2. **反映タイミングの確認**：他行からの振込などの場合、処理のタイミングにより明細への反映に時間がかかっている可能性があります。

    3. **未確定取引の確認**：デビット決済などの場合、一時的に「仮押さえ」の状態となり、最終的な確定金額と異なる場合があります。


    **【対応】**

    * 上記を確認しても不一致がある場合は、当行にて詳細な調査を行います。専門チームへエスカレーションし、調査結果をお客様へ通知いたします。'
