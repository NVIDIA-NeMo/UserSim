- id: 147f7508-67d7-567d-a424-47af97be91bb
  title: transfer_funds を使う場面
  body: 'お客様が、ご自身の口座間または他行の口座へ資金を移動させたい場合にこの手続きを行います。具体的には、「普通預金」から「目的別口座」への資金移動や、他行口座への振込などが対象です。


    【手続き手順】

    1. 本人確認を完了させます。

    2. `get_accounts` を使用して、送金元となる口座の口座IDを特定します。

    3. 送金先の口座情報（口座番号や金融機関など）と送金金額を確認します。

    4. `transfer_funds` を呼び出して送金処理を実行します。


    なお、友人や家族への少額送金で電話番号のみを利用したい場合は、「スマホ送金」のご案内を検討してください。'
