    ・海外利用事務手数料：海外加盟店で利用された場合、利用金額に対して2%の事務手数料を申し受けます。


    2. 利用限度額と決済

    ・1日あたりの利用限度額は、初期設定で300,000円です。この限度額はアプリ内で変更可能です。

    ・デビットカードの特性上、利用と同時に登録済みの普通預金口座から代金が引き落とされます。口座残高を超えて利用することはできません。


