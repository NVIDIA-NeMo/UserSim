- id: 47e2e19a-5f0e-546a-bd58-f9ba47c4769b
  title: 定期預金：おすすめの方と主な使い方
  body: '「定期預金」は、使う予定のない資金を安全に、かつ効率的に増やしたい方に最適な商品です。


    **このような方におすすめです**

    * 1,000円からという少額から資産形成を始めたい方

    * 普通預金よりも高い金利で、確実にお金を貯めたい方

    * 6か月や1年という期間を決めて、計画的に貯蓄したい方


    **商品の特徴**

    * **競争力のある金利**：期間に応じて年0.7%（6か月）または年0.9%（1年）の金利を提供します。

    * **少額から開始可能**：最低1,000円から預け入れが可能です。

    * **シンプルな管理**：スマートフォンアプリで完結するため、いつでも残高や満期日を確認できます。


    日々の決済には「普通預金：商品概要」でご紹介している普通預金を併用し、貯蓄分を定期預金に分けることで、効率的な資産管理が実現します。'
