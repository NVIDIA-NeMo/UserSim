  mentions_tools: []
  institution_id: sorairo_bank
- id: 84599f9b-3148-5bdc-b227-2c98cc67a101
  title: 目的別口座：商品概要
  body: 'そらいろ銀行の「目的別口座」は、一つの普通預金口座の中で、貯金箱のように資金を分けて管理できる便利な機能です。「旅行資金」「車購入費用」「教育費」など、目的ごとに最大10個まで口座を作成でき、計画的な資産形成をサポートします。


    【本商品のおすすめポイント】

    ・アプリひとつで簡単に資金を切り分けて管理できます。

    ・目的別口座に預けた資金にも、普通預金と同じ0.45%の金利が適用されます。

    ・自動入金機能を活用すれば、効率的に貯金を積み上げることが可能です。自動入金の最低金額は1,000円から設定いただけます。


    【安心の保護制度】

    本機能を含む預金は預金保険制度の対象です。そらいろ銀行が破綻した場合でも、預金保険機構により、元本1,000万円まで（決済用預金は全額）とその利息等が保護されます。


    【適用金利と制限】

    ・金利：0.45%

    ・作成可能数：最大10個

    ・自動入金最低金額：1,000円


    詳細な金利については「目的別口座：金利・料率一覧」をご確認ください。'
