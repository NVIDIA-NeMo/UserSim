- id: 8775fed8-1c14-5c2e-ba76-ab8d3adb2744
  title: 普通預金：他行あて振込手数料の無料回数（月、基本）について
  body: '**Q. 他行への振込手数料が無料になる回数は月に何回までですか？**


    A. 普通預金口座をご利用のお客さまは、月に2回まで無料で他行あて振込をご利用いただけます。


    **Q. 無料回数を超えた場合は、いくらの手数料がかかりますか？**


    A. 月に3回目以降の振込からは、1回につき145円の手数料がかかります。詳細は「普通預金：手数料一覧」をご確認ください。'
