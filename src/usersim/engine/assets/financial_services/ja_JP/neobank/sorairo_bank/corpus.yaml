- id: 46bf0be7-220f-5623-aeda-4e7d47fdc2aa
  title: スマホ送金：1回あたりの送金上限額について
  body: '【Q】スマホ送金で一度に送金できる金額の上限はいくらですか？


    A. 1回あたりの送金上限額は100,000円となっております。これを超える金額を送金したい場合は、お手数ですが複数回に分けてお手続きいただくか、通常の振込機能をご利用ください。


    【Q】1回あたりの上限額を引き上げることはできますか？


    A. 申し訳ございませんが、スマホ送金の1回あたりの送金上限額は一律で100,000円となっており、個別での変更は承っておりません。より高額な送金が必要な場合は、「普通預金：商品概要」にてご案内している通常の振込機能をご検討ください。'
