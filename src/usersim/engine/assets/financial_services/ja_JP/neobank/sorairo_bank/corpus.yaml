- id: 8c53a0e7-e95c-5e25-89be-7f41f2d964d2
  title: スマホ送金：登録内容の変更
  body: 'スマートフォンの機種変更や電話番号の変更に伴い、登録内容を変更する手順をご案内します。


    **【準備するもの】**

    ・新しく利用する電話番号が設定済みのスマートフォン

    ・マイナンバーカード（本人確認が必要な場合）


    **【変更の手順】**

    1. お客様から「登録電話番号を変更したい」旨を伝えていただきます。

    2. 私たちがご本人確認（二段階認証等）を行います。

    3. 新しい電話番号を提示していただき、私たちがシステムへの登録更新を行います。

    4. 新しい端末に認証SMSが届き、認証コードを入力して登録を完了させます。


    **【完了の確認】**

    アプリの「設定」画面にて、新しい電話番号が正しく表示されていれば完了です。'
