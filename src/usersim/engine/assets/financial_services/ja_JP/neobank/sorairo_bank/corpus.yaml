- id: 8906a2a3-8885-56c4-a0e9-53a5531055da
  title: スマホ送金：解約・変更・プランの切替え
  body: 'スマホ送金機能の停止や、登録電話番号の変更手続きについてご案内します。


    **【機能の停止（解約）手順】**

    1. チャットにて「スマホ送金の利用停止」を申し出てください。

    2. 当行が本人確認を行い、機能の無効化処理を行います。

    3. 処理完了後、アプリの送金メニューにアクセスできなくなったことを確認してください。


    **【登録電話番号の変更手順】**

    1. チャットにて「スマホ送金の登録番号変更」を依頼してください。

    2. 新しい電話番号と、変更理由を伝えてください。

    3. 新しい番号宛に認証コードが送信されますので、そのコードをチャットに入力してください。

    4. 当行が変更完了を通知します。以降、新しい番号での送受信が可能になります。


    なお、本サービスは単一のプランであるため、プランの切替えはありません。'
