- id: cdd6142c-1975-5456-b0c6-ba9fd40e39f0
  title: スマホ送金：リスクについてのご説明
  body: '「スマホ送金」のご利用にあたり、以下のリスクについて十分にご理解ください。


    ■誤送金のリスク

    本サービスは電話番号を用いて送金を行うため、番号の入力誤りにより、意図しない第三者に資金が送金されるリスクがあります。一度送金が完了した取引は、当行側で取り消すことができません。送金実行前に、必ず送金先の電話番号と金額が正しいことを再確認してください。


    ■上限額による制限

    本サービスは利便性を優先しているため、1回あたりの送金上限額は100,000円、1か月あたりの送金上限額は500,000円に制限されています。急ぎでこれ以上の金額を送金する必要がある場合は、通常の振込機能をご利用ください。


    ■セキュリティ上の注意

    スマートフォンの紛失や盗難により、第三者にアプリを操作された場合、上限額の範囲内で不正送金が行われるリスクがあります。端末の画面ロックおよびアプリの二段階認証を適切に設定し、管理を徹底してください。


    万が一の不正利用時には、当行規定に基づき公正な調査を行い、補償手続きを速やかに行います。'
