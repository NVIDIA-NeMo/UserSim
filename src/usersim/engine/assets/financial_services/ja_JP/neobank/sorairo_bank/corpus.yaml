- id: 88a7919d-be1c-5390-809d-e1c5f944e8d9
  title: そらいろVisaデビット：お申込みとご利用開始
  body: 'そらいろVisaデビットのお申込みからご利用開始までの手順をご案内します。本手続きはすべてスマートフォンアプリで完結します。


    【ご準備いただくもの】

    ・マイナンバーカード（ICチップ読み取りが必要です）


    【ご利用開始までのステップ】

    1. 本人確認：まず、お客様のフルネームと生年月日をお伝えください。

    2. お申込み：アプリ内のメニューから「そらいろVisaデビット」の申し込みを選択し、必要事項を入力してください。

    3. オンライン本人確認：マイナンバーカードのICチップをスマートフォンで読み取り、本人確認を完了させてください。

    4. カードの受取：審査完了後、ご登録の住所へカードが郵送されます。お手元に届くまで数営業日かかります。

    5. 利用開始：カード到着後、アプリで利用開始の手続きを行うことで、すぐにお買い物にご利用いただけます。


    初期状態で設定されている1日あたりの利用限度額（初期設定）は300,000円です。限度額の変更はアプリからいつでも簡単に行っていただけます。


    口座開設がお済みでない方は、先に「普通預金：お申込みとご利用開始」の手続きをお願いいたします。'
