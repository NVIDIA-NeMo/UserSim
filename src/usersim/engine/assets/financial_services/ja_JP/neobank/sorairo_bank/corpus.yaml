- id: fee40b6b-1899-5de1-95e5-b330dc483f6a
  title: 目的別口座：限度額・制限と注意事項
  body: 'オペレーターの方は、顧客へ案内する際に以下の制限事項と仕様を正確に伝えてください。


    **【利用限度と制限】**

    *   **作成可能な口座数**：最大10個まで作成いただけます。10個に達した場合は、既存の口座を解約しない限り新しい目的別口座は作成できません。

    *   **適用金利**：普通預金と同様の年0.45%が適用されます。


    **【注意事項】**

    *   目的別口座は、あくまで普通預金口座の中での「資金管理上の区分」であり、個別の口座番号は発行されません。

    *   外部からの振込指定口座として目的別口座を個別に指定することはできません。一度普通預金口座に入金された後、アプリ内で振り分ける必要があります。'
