- id: 05b9f87d-8644-5fb5-af6d-e2bffea9a5b6
  title: 目的別口座：安全にご利用いただくためのポイント
  body: '目的別口座を安全にご利用いただくために、以下の点にご注意ください。


    ・**二段階認証の徹底**：ログイン時や振込時に導入されている二段階認証を必ず有効にし、第三者による不正アクセスを防止してください。

    ・**不審な連絡への警戒**：当行がメールやSMSで、パスワードや暗証番号を直接伺うことはございません。不審なリンクは絶対にクリックしないでください。

    ・**異常を感じたらすぐに報告**：身に覚えのない資金移動がある場合は、直ちにご利用停止の手続きをお願いします。


    万が一、フィッシング詐欺などの被害に遭われた場合は、迅速にご報告ください。預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。'
