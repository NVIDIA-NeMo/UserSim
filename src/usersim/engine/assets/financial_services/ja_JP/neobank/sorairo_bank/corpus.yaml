- id: 37981f34-2b00-5381-9c6b-4b2baefb9599
  title: スマホ送金：規定・約款
  body: '本規定は、そらいろ銀行が提供する「スマホ送金」サービスの利用条件を定めるものです。お客様は本サービスのご利用にあたり、以下の条件に同意したものとみなされます。


    1. サービスの提供と利用制限

    当行は、お客様の電話番号に基づいた送金機能を提供します。安全な運用のた、1回あたりの送金上限額を100,000円、1か月あたりの送金上限額を500,000円と定めております。これらの限度額を超える送金はできません。


    2. 手数料について

    本サービスにおける送金手数料は0円です。ただし、法改正やサービス維持コストの変動により、当行が定めた手続きを経て手数料を変更する場合があります。


    3. 送金指示の確定と責任

    お客様がアプリ上で送金指示を完了した時点で、送金手続きは確定します。電話番号の入力誤りなど、お客様の過失により誤った相手に送金された場合、当行は原則として返金を保証いたしません。お客様は送金前に、必ず送金先が正しいことを確認する義務を負います。


    4. 合意の終了

    本サービスは、口座の解約または当行による利用停止措置が取られた時点で終了します。また、犯罪収益移転防止法に基づく本人確認が適切に行われない場合、サービスの提供を停止することがあります。'
