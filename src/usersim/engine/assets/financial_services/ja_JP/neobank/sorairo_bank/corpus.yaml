- id: 1b00353c-d68f-50a2-a5c7-84b41a65994b
  title: 普通預金：お手続きが完了しない・保留中のまま
  body: '【症状】

    口座開設の申し込み後、ステータスが「審査中」や「保留中」のまま進まない。


    【考えられる原因と確認事項】

    1. マイナンバーカードの読み取り不備：ICチップの読み取りが不完全だった可能性があります。

    2. 本人確認書類の不鮮明：撮影した画像が不鮮明な場合、確認に時間を要します。

    3. 通信環境の影響：認証処理中にネットワークが切断された可能性があります。


    【解決方法】

    ・アプリを再起動し、指示に従ってマイナンバーカードの再読み取りをお試しください。

    ・通信環境の良い場所（Wi-Fi環境など）で再度お手続きください。


    【エスカレーション】

    上記を確認しても解決しない場合は、当行の専門オペレーターが個別に審査状況を確認いたします。確認後、不足書類の再提出依頼または審査完了のご案内をアプリ内通知にてお送りします。


    手順の詳細は「普通預金：お申込みとご利用開始」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
