  body: '**Q：1回の送金で最大いくらまで送ることができますか？**


    A：1回あたりの送金上限額は100,000円です。これを超える金額を送金したい場合は、回数を分けてお手続きいただくか、通常の振込機能をご利用ください。


    **Q：上限額の設定を変更することはできますか？**


    A：恐れ入りますが、スマホ送金の1回あたりの上限額である100,000円を変更することはできません。あらかじめご了承ください。'
