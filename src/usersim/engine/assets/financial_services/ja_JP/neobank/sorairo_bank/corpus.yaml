- id: 7f9e6a7d-918e-54a4-92fc-c5eaeec55889
  title: そらいろVisaデビット：規定・約款の変更
  body: '本規定は、そらいろVisaデビットの提供条件を定めるものです。お客様は、本規定に同意することでサービスの提供を受けられます。


    ■規定の変更について

    当行は、法令の改正、経済状況の変化、またはサービス改善のために必要と判断した場合、本規定の内容を変更することがあります。変更される場合は、事前にアプリ内通知またはメールにて、変更内容および適用開始日をご案内いたします。ご案内後、一定期間内に異議申し立てがない場合は、変更後の規定に同意したものとみなされます。


    ■主要な条件の適用

    ・年会費：本カードの年会費は0円として提供されます。ただし、将来的に規定の変更により改定される場合があります。

    ・利用限度額：初期設定の1日あたりの利用限度額は300,000円です。お客様はアプリを通じてこの限度額を変更できますが、当行は審査に基づき上限を制限する権利を有します。

    ・キャッシュバック：0.8%のキャッシュバック率は、当行の規定に基づき算定され、所定のタイミングで口座へ還元されます。還元対象外の取引があるため、詳細は最新の利用規約をご確認ください。


    ■契約の終了

    口座の解約またはカードの有効期限切れ、あるいは当行が本規定に違反したと判断した場合、本契約は終了し、カードの利用は停止されます。'
