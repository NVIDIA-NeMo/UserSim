- id: 75709135-99de-5795-8113-b086881c8f98
  title: スマホ送金：当社の似た商品との比較
  body: '「スマホ送金」と、通常の「振込（普通預金）」のどちらを利用すべきか迷われている方向けに、主な違いを比較します。


    | 比較項目 | スマホ送金 | 普通預金（通常振込） |

    | :--- | :--- | :--- |

    | 必要な情報 | 電話番号のみ | 銀行名・支店名・口座番号 |

    | 送金手数料 | 0円 | 会員ランクにより無料枠あり |

    | 1回あたりの上限 | 100,000円 | より高額な送金が可能 |

    | 速度・手軽さ | 非常に高い（アプリ完結） | 標準的 |


    【どちらがおすすめか】

    ・友人との食事代の精算や少額の贈答など、スピードと手軽さを重視する場合は「スマホ送金」が最適です。

    ・家賃の支払いや高額な取引など、確実な記録と大きな金額の移動が必要な場合は、「普通預金：商品概要」でご案内している通常の振込をご利用ください。'
