- id: d5bb28bf-e44c-51ae-9899-d63e49086367
  title: 目的別口座：プランの選び方
  body: '資金管理の方法に迷われている方へ、通常の普通預金と「目的別口座」の使い分けをご提案します。


    【普通預金（メイン口座）】

    ・特徴：日常的な決済や支払いのための基盤となる口座です。

    ・向いている方：給与受取や公共料金の引き落としなど、流動性の高い資金を管理したい方。


    【目的別口座】

    ・特徴：一つの口座内で最大10個まで仮想的な貯金箱を作れる機能です。普通預金と同じ0.45%の高金利を維持しながら、資金を色分けして管理できます。

    ・向いている方：「車購入資金」「旅行代」「年越し資金」など、複数の貯金目標があり、計画的に資産を分けたい方。


    どちらを選んでも金利に差はありませんので、目的別に資金を整理したい場合は、ぜひ目的別口座の活用をご検討ください。


    詳細は「普通預金：商品概要」とあわせてご確認ください。'
