- id: d42e2f81-275c-5215-8bd1-f3494da41d31
  title: 定期預金：ログインできない・アクセスできない
  body: 'アプリにログインできず、定期預金の残高や金利（0.7%または0.9%）が確認できない場合の対処法です。


    **1. 通信環境の確認**

    ・Wi-Fiやモバイルデータ通信が安定しているかご確認ください。一度機内モードをオン・オフにすると改善する場合があります。


    **2. 二段階認証の不整合**

    ・機種変更後に認証の再登録を行っていない場合、ログインが制限されます。この場合は、デバイスの再登録手続きが必要です。


    **3. アプリのバージョン確認**

    ・最新バージョンが適用されているか、アプリストアでご確認ください。


    **解決しない場合**

    上記を確認しても解消されない場合は、当行でアカウントの状態を確認いたします。本人確認後、専門のオペレーターが認証のリセットまたは再登録をサポートし、アクセスを復旧させます。'
