- id: 14ae5b59-2f2d-5ff8-81c1-1cdd289fd892
  title: 普通預金：登録内容の変更
  body: 'ご登録内容（住所や氏名など）を変更する手順は以下の通りです。


    1. **変更申請**: チャットまたはオンラインヘルプセンターから「登録内容の変更」を申し出てください。

    2. **新情報の提示**: 変更後の情報を伝え、必要に応じて最新の本人確認書類をアプリを通じて提出してください。

    3. **当行による確認**: 当行にて提出書類の内容と登録情報の整合性を確認いたします。

    4. **完了通知**: 変更手続きが完了すると、アプリ内の通知にてお知らせいたします。


    **【ご注意】**

    お名前やご住所の変更など、重要な情報の変更時には、改めて取引時確認が必要となる場合がございますので、あらかじめご了承ください。'
