- id: 37710242-f948-5e45-846d-5324570d9e9e
  title: 定期預金：解約・変更・プランの切替え
  body: '定期預金の解約やプラン変更、または別の期間への切替えをご希望される際の手順をご案内します。


    【お手続きの流れ】

    1. 本人確認

    まず、お客さまのフルネームと生年月日をお伺いし、ご本人確認を行います。


    2. 対象口座の指定

    解約または変更を希望される定期預金口座を選択し、私たちにお伝えください。


    3. 内容の確認と承諾

    ・解約の場合：満期前解約となるため、適用金利が変更され、受取利息が減少する可能性があることをご案内します。内容に同意いただけるか確認させていただきます。

    ・切替えの場合：一度現在の定期預金を解約し、改めて新しい期間（6か月または1年）で預け入れを行う手続きとなります。


    4. 手続きの完了

    内容が確定し、処理が完了すると、元金と利息（税引き後）が普通預金口座へ払い戻されます。アプリの残高画面にて、正しく反映されていることをご確認ください。


    なお、詳細な規定については「定期預金：規定・約款」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3efd0928-a852-585b-9b96-ff58687daeea
  title: 定期預金：想定外の手数料・金額
  body: '定期預金の解約時や満期時に、「想定していた金額と異なる」と感じられた場合の確認事項です。


    【よくある状況と原因】

    ・利息が予想より少ない

    原因1：中途解約による金利の低下。満期前に解約した場合、当初の0.7%または0.9%ではなく、低い中途解約利率が適用されます。

    原因2：税金の控除。利息には所得税および地方税が課せられるため、表示される金利から税金が差し引かれた金額が払い戻されます。


    ・元金が不足している

    原因：預入時に指定した金額に誤りがあったか、あるいは別の口座への振替が行われた可能性があります。


    【対応手順】

    1. アプリの取引明細にて、適用された金利と税金の金額を再度ご確認ください。

    2. 「定期預金：金利・料率の決まり方と適用」に基づき、正しく金利が適用されているか照合します。

    3. 明らかに計算が異なる、あるいは操作ミスが疑われる場合は、専門のオペレーターへエスカレーションし、詳細な調査を行います。調査結果は後日、アプリ内通知またはメールにてご連絡いたします。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 46b233c4-7719-5c92-a341-29d885a683c3
  title: 定期預金：必要書類
  body: '定期預金のお申込みに必要な書類についてご案内します。


    | お客さまの状態 | 必要書類 | 判定・結果 |

    | :--- | :--- | :--- |

    | すでにそらいろ銀行の普通預金口座をお持ちの方 | 不要 | アプリ内で即時にお申込みいただけます |

    | まだ口座をお持ちでない方（新規開設） | マイナンバーカード（ICチップ搭載） | オンライン本人確認を経て口座開設後、ご利用いただけます |


    ※最低預入金額として1,000円以上の資金が普通預金口座にあることが条件となります。


    口座開設時の詳細な条件については、「普通預金：お申込みいただける方」をご参照ください。'
