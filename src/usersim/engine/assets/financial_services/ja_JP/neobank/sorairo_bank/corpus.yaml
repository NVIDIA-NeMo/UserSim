  body: '定期預金では、期間に応じて2つのプランからお選びいただけます。


    **・6か月もの（金利 0.7%）**

    半年後に資金を利用する予定がある方や、まずは短期間で試したい方に適しています。


    **・1年もの（金利 0.9%）**

    より高い金利で効率的に資産を増やしたい方、1年以上は使う予定のない余裕資金を運用したい方に最適です。


