- id: 394529e0-e8a4-5253-b51b-d88c25312aff
  title: 定期預金：当社の似た商品との比較
  body: 'そらいろ銀行で提供している、資金管理に関連する商品の比較です。


    【定期預金】

    ・金利：0.7%（6か月）/ 0.9%（1年）と高め

    ・流動性：期間中の原則解約不可（中途解約時は金利が変動）

    ・向いている方：一定期間、使う予定のない資金を効率よく増やしたい方


    【普通預金】

    ・金利：定期預金より低め

    ・流動性：いつでも自由に出し入れ可能

    ・向いている方：日常的な支払いや、急な出費に備えたい方


    【目的別口座】

    ・金利：普通預金と同等

    ・流動性：いつでも自由に出し入れ可能

    ・向いている方：貯金目的ごとに資金を分けて管理し、計画的に貯めたい方


    確実に高い金利で資産を増やしたい場合は「定期預金」、利便性を重視する場合は「普通預金」や「目的別口座」をご活用ください。'
