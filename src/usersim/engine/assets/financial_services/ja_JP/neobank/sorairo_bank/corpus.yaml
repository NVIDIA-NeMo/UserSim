  mentions_tools: []
  institution_id: sorairo_bank
- id: 96e35ca8-1395-527f-993c-c3dd8e602b79
  title: 目的別口座：規定・約款
  body: '本規定は、そらいろ銀行が提供する「目的別口座」の利用条件を定めるものです。本機能は、普通預金口座内で仮想的に資金を管理するための機能であり、法的に独立した別口座を創設するものではありません。


    1. 利用限度および構成

    お客さまは、1つの普通預金口座につき、最大で10まで「目的別口座」を作成し、資金を分けて管理することができます。作成数の上限である10を超えて作成することはできません。


    2. 自動入金設定

    自動入金機能を設定する場合、1回あたりの最低金額は1,000円とします。設定金額が1,000円未満である場合は、設定を完了することができません。


    3. 金利の適用

    目的別口座に預け入れられた資金には、普通預金と同様の金利（現在は年0.45%）が適用されます。金利の改定は、市場金利の変動等に基づき、当行の判断で随時変更される場合があります。


    4. 資金の移動と解約

    お客さまは、アプリを通じていつでも目的別口座から普通預金（メイン口座）へ資金を移動させることができます。目的別口座の解約（削除）を行う際は、あらかじめ当該口座内の残高を0円にする必要があります。


    5. 規定の変更

    本規定および手数料、金利等の条件は、法令の変更やサービス改善のため、当行の判断により変更されることがあります。変更内容はアプリ内通知等で事前にお知らせいたします。'
