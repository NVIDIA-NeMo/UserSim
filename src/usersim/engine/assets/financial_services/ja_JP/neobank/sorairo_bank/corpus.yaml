- id: 537de6b1-d2a7-52f5-b52f-3b5e6cb27ebb
  title: 普通預金：不正利用からお客さまを守るために
  body: 'そらいろ銀行では、大切なお資産を守るために厳格なセキュリティ体制を構築しています。普通預金をご利用の際は、以下の点にご注意ください。


    **【当行のセキュリティ対策】**

    * **厳格な本人確認**：口座開設時にマイナンバーカードのICチップ読み取りによるオンライン本人確認を必須としています。

    * **二段階認証の導入**：ログイン時および振込時には、パスワード以外の認証を組み合わせる二段階認証を行い、不正アクセスを徹底的に防止します。


    **【ご注意いただきたいこと】**

    当行がメールやチャットで、暗証番号や二段階認証のコードを直接お伺いすることはございません。不審な連絡があった場合は、すぐに詳細を当行へお知らせください。


    **【万が一のときは】**

    不正送金やフィッシング詐欺の疑いがある場合は、速やかにご連絡ください。迅速に口座の利用停止と調査を行います。預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: e228d5a6-4a08-5e53-b981-41e1bd88d85b
  title: 普通預金：規定・約款
  body: '本規定は、そらいろ銀行の普通預金のご利用条件を定めるものです。サポート担当者は、顧客への案内時に以下の項目を遵守してください。


    **1. 預金金利**

    本口座には、年0.45%の金利を適用します。金利の改定が必要な場合は、事前にアプリ内等でお知らせします。


    **2. 手数料の適用**

    * **振込手数料**：月2回まで無料で提供し、3回目以降の利用については1回につき145円を課金します。

    * **ATM利用手数料**：月2回まで無料で提供し、3回目以降の利用については1回につき110円を課金します。


    **3. 口座の維持と解約**

    口座開設時の取引時確認に基づき、適正な利用を求めます。解約を希望される場合は、アプリ内の手続きに従い、残高を全額出金した上で手続きを完了させてください。


    **4. 法令遵守**

    当行は銀行法および個人情報保護法を厳格に遵守し、顧客の個人情報を適切に管理します。'
