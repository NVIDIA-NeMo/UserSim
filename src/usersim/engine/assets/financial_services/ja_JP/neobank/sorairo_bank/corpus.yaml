- id: 0ea95f33-9262-56e1-886c-1da026ed7062
  title: 普通預金：おすすめの方と主な使い方
  body: 'そらいろ銀行の「普通預金」は、デジタルネイティブ層の方々に最適化された、利便性と収益性を兼ね備えたメイン口座です。


    【こんな方におすすめです】

    ・日々の資金管理をスマートフォンアプリ一つで完結させたい方

    ・大手銀行よりも高い金利で、効率的に資産を増やしたい方

    ・振込やATM利用の手数料負担を抑えたい方


    【主な活用方法】

    ・メイン口座としての利用：0.45%という競争力のある金利設定により、日常的な資金を預けておくだけで効率的な資産形成が可能です。

    ・スマートな決済基盤：他行あて振込手数料が月2回まで無料、提携ATM出金手数料も月2回まで無料で利用でき、ストレスのない資金移動を実現します。

    ・目的別管理との併用：一つの口座の中で仮想的に貯金箱を作れる「目的別口座」機能を活用し、「旅行代」「車購入」など、目的ごとの貯蓄とあわせてご利用ください。


    【基本スペック】

    ・普通預金金利：0.45%

    ・他行あて振込手数料（月、基本無料回数）：2回

    ・提携ATM出金手数料（月、基本無料回数）：2回

    ・無料回数超過後の振込手数料：145円

    ・無料回数超過後のATM手数料：110円'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: product_sheet
  source_authority: official
