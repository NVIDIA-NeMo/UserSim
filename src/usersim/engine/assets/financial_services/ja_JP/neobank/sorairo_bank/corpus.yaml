  title: 普通預金：安全にご利用いただくためのポイント
  body: 'お客さまの大切な資産を守るため、以下のポイントを必ずご確認ください。


    **【セキュリティ強化のポイント】**

    * **二段階認証の活用**: ログイン時および振込時には必ず二段階認証を行い、不正アクセスを防止してください。

    * **機種変更時の対応**: スマートフォンを買い替えた際は、必ず認証の再登録をお願いいたします。

    * **不審な連絡への注意**: 当行がメールやSMSで、暗証番号やパスワードを伺うことはございません。


    万が一、不正送金などの被害に遭われた場合は、速やかに当行までご連絡ください。預金者保護法に基づき、故意や重大な過失がない限り、原則として当行が補償いたします。'
