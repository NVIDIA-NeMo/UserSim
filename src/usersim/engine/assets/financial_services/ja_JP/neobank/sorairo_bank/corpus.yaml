- id: 3efd0928-a852-585b-9b96-ff58687daeea
  title: 定期預金：想定外の手数料・金額
  body: '「解約時の受取金額が予想より少ない」と感じられた場合は、以下の点をご確認ください。


    **考えられる原因と確認事項**

    1. **税金の差し引き**：利息には所得税および地方税がかかります。表示金額は税引後の金額となっているかご確認ください。

    2. **中途解約による金利変更**：満期前に解約された場合、当初の約定金利（0.7%または0.9%）ではなく、中途解約者向けの低い金利が適用されるため、利息額が減少します。


    **解決方法**

    アプリの「取引明細」から、適用された正確な利息額と税額をご確認ください。


    **エスカレーションについて**

    明細を確認しても計算が合わない場合は、専門のオペレーターへお問い合わせください。弊社にて再計算を行い、正当な金額であるか、または処理に不備がなかったかを調査し、結果をアプリ内メッセージで回答いたします。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
