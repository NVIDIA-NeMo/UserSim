- id: aaee5333-792c-5711-83fd-7218a5395be0
  title: 目的別口座：明細や記録と合わない
  body: '顧客から「目的別口座の残高や明細が、自分の計算と合わない」と問い合わせがあった際の確認フローです。


    **【確認すべきチェックポイント】**

    1.  **内部移動の有無**：目的別口座間の資金移動は、外部への出金ではなく「内部移動」として記録されます。普通預金全体の残高は変わりませんが、個別の口座残高が変動していることを説明してください。

    2.  **自動入金の実行タイミング**：設定した自動入金（最低1,000円〜）が、予定日に正しく実行されているか履歴を確認してください。

    3.  **利息の付与**：年0.45%の金利に基づき付与された利息が、どのタイミングで反映されているかをご確認ください。


    **【エスカレーション基準】**

    上記を確認しても、明らかに計算が合わない（例：移動させていないのに残高が減っている等）場合は、至急システムログの調査が必要です。詳細な不一致金額と発生日を添えて、バックオフィス専門チームへ調査を依頼してください。'
