- id: 8eb0230b-ea32-5195-b17a-a62acb0b6e14
  title: 目的別口座：お取引が拒否された・制限された
  body: '「目的別口座から資金を移動させようとしたがエラーになる」「振込が拒否された」などの症状がある場合の確認事項です。


    【考えられる原因と対処法】


    1. 普通預金口座全体の残高不足

    目的別口座は仮想的な管理機能です。口座全体の残高が不足している場合、目的別口座に金額が表示されていても、外部への送金や支払いが制限されることがあります。メイン口座の残高をご確認ください。


    2. 口座の凍結・制限

    犯罪収益移転防止法に基づく確認手続きが必要な場合や、不正利用の疑いがある場合に、一時的に口座へのアクセスが制限されることがあります。この場合、アプリ上で「制限中」などの表示が出ます。


    3. 認証情報の不一致

    二段階認証や機種変更後の再登録が正しく完了していない場合、取引が拒否されることがあります。


    【解決の手順】

    ・まず、アプリで「普通預金」の総残高が十分にあるかを確認してください。

    ・解決しない場合は、オペレーターに状況を伝えてください。フルネームと生年月日の確認後、制限がかかっているか調査いたします。


    【エスカレーション】

    本人確認後、システム的なエラーや不正検知による制限が判明した場合は、専門の審査チームへ案件をエスカレーションし、解除手続きを行います。解除までのお時間は、内容により数営業日かかる場合がございます。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c1529c49-80ae-51d4-b152-77aab4872522
  title: 目的別口座：切替えや上位プランを検討するとき
  body: 'お客様が「より確実な資産形成」や「高い金利」を求めてプランの変更を検討される際、目的別口座と定期預金の使い分けをご案内ください。


    ■目的別口座（現在のプラン）

    ・金利：0.45%

    ・特徴：いつでも自由に資金を出し入れできる。最大10個まで目的別に管理可能。

    ・向いている方：旅行や家電の購入など、近い将来に使う予定がある資金を柔軟に管理したい方。


    ■定期預金（切り替え先候補）

    ・金利：普通預金よりも高い金利を設定（詳細は「定期預金：商品概要」参照）。

    ・特徴：原則として満期まで引き出しを制限することで、確実な資産形成を支援。

    ・向いている方：当面使う予定のない資金を、より高い金利で安全に増やしたい方。


    目的別口座で「貯める習慣」をつけ、ある程度の金額が貯まった段階で「定期預金」へ移行して金利メリットを最大化させる運用を推奨してください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: comparison
  source_authority: official
