  body: '新規の口座開設処理を行います。オペレーターはこのツールを直接呼び出すことで、お客さまの情報を登録し、口座を有効化します。


    **引数：**

    - full_name：お客さまのフルネーム

    - date_of_birth：生年月日

    - address：現住所

    - contact_phone：連絡先電話番号

    - email_address：メールアドレス'
