- id: e1860449-5721-5200-8b7a-9b2cdfeddb49
  title: 定期預金：プランの選び方
  body: "お客様の目的や資金計画に合わせて、最適なプランをお選びください。\n\n【プラン別比較】\n- 6か月ものプラン：金利 0.7%\n  比較的短期間で資金をまとめたい方や、半年後の予定に合わせた準備をしたい方に向いています。\n\
    - 1年ものプラン：金利 0.9%\n  より高い利回りで、確実な資産形成を目指したい方向けのプランです。\n\n【選び方のポイント】\n- 「利回りを最大化したい」→\
    \ 1年もの（0.9%）がおすすめです。\n- 「半年後に使う予定がある」→ 6か月もの（0.7%）が適しています。\n- 「いつでも自由に引き出したい」→\
    \ 定期預金ではなく、普通預金をご利用ください。普通預金は流動性が高く、日常的な資金管理に最適です。\n\nいずれのプランも最低預入金額は1,000円からとなっております。少額から始めて、徐々に金額を増やしていくことも可能です。"
