- id: 267c5b5a-fe95-55cd-88dd-a7df2f88dd6e
  title: 定期預金：重要事項のご説明
  body: '本商品は、銀行法に基づき金融庁の監督を受けて提供されています。ご利用にあたり、以下の重要事項をご確認ください。


    【預金保険制度について】

    当行の定期預金は預金保険制度の対象です。万が一、当行が破綻した場合であっても、預金保険機構により、利息を含め1金融機関につき預金者1人当たり元本1,000万円までが保護されます。


    【金利の適用について】

    適用金利は、6か月ものの場合0.7%、1年ものの場合0.9%となります。これらは税引前の年率であり、実際のお受取額は税金が差し引かれた金額となります。


    【中途解約について】

    定期預金は原則として満期まで資金を預ける商品です。満期前に解約（中途解約）された場合、当初の適用金利ではなく、当行が別途定める中途解約利率が適用されるため、受け取れる利息が少なくなります。


    【最低預入金額】

    本商品のお申し込みには、最低1,000円の預入金額が必要です。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: disclosure
  source_authority: official
