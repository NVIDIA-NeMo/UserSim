- id: 3825cae9-ebfc-59dd-bf00-3bf4e80320b0
  title: スマホ送金：ご利用開始までの手順
  body: '【オペレーター用：スマホ送金のご利用開始ガイド】


    お客様がスマホ送金をスムーズに開始できるよう、以下の手順で案内してください。本サービスは電話番号のみで完結する利便性の高い送金手段です。


    ■サービスの基本仕様

    ・送金手数料：0円

    ・1回あたりの送金上限額：100,000円

    ・1か月あたりの送金上限額：500,000円


    ■ご利用開始までのステップ

    1. 本人確認の実施

    まず、お客様のフルネームと生年月日を確認し、ご本人様であることを照合してください。


    2. アプリ内設定の案内

    お客様にアプリの「送金」メニューから「スマホ送金」を選択するよう案内します。初回利用時は利用規約への同意が必要です。


    3. 電話番号の紐付け確認

    現在登録されている電話番号が、送金に使用されることを説明してください。相手方もそらいろ銀行の口座をお持ちで、スマホ送金設定を完了している必要があります。


    4. 操作確認と完了

    送金先の電話番号を入力し、金額（100,000円以内）を指定して送金を行う流れを説明します。完了後、アプリに通知が表示されることを伝えてください。


    ※複雑なエラーが発生した場合は、速やかに専門部署へエスカレーションしてください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: product_sheet
  source_authority: official
