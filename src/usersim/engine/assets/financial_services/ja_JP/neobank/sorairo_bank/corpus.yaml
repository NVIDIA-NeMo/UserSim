- id: eeff5a1b-d402-5449-8fad-d19d48e810f7
  title: スマホ送金：不正利用からお客さまを守るために
  body: 'そらいろ銀行の「スマホ送金」を安全にご利用いただくために、特にご注意いただきたい点をご案内いたします。


    ■このような詐欺にご注意ください

    「スマホ送金で至急送金してください」と、知人を装ったSNSメッセージやメールが届くケースがございます。たとえ親しい相手からの連絡に見えても、金額や急ぎ方を確認し、不自然な点がある場合は必ず相手に直接電話などで確認してください。


    ■当行が絶対に聞き出さない情報

    当行のオペレーターや担当者が、スマホ送金のご利用に関わらず、お客様の暗証番号、ログインパスワード、カード番号、CVV、または身分証番号などを聞き出すことは一切ございません。これらの情報を求める連絡は、すべて詐欺ですので絶対に応じないでください。


    ■万が一、不正利用の疑いがあるときは

    身に覚えのない送金履歴がある場合や、スマートフォンの紛失に気づいた際は、直ちに当行へご連絡ください。迅速に機能の停止手続きを行い、預金者保護法および当行規定に基づき、公正な調査と補償手続きを速やかに行います。


    安全なデジタル体験を提供するため、常に最新のアプリバージョンをご利用いただくことをお願いいたします。'
