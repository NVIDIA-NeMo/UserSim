- id: 84599f9b-3148-5bdc-b227-2c98cc67a101
  title: 目的別口座：商品概要
  body: '目的別口座は、一つの普通預金口座の中で、貯金したい目的ごとに最大10個まで資金を分けて管理できる便利なツールです。「旅行代」「車への買い替え」など、名前をつけて管理することで、計画的な資産形成をサポートします。


    【主な特徴と条件】

    ・金利：年0.45%（普通預金と同じ高い金利が適用されます）

    ・作成可能数：最大10個まで

    ・自動入金設定：最低1,000円から設定可能


    日々の決済に使うお金と、将来のために貯めるお金を明確に分けることで、効率的な資産管理を実現します。詳細は「目的別口座：お申込みとご利用開始」をご確認ください。'
