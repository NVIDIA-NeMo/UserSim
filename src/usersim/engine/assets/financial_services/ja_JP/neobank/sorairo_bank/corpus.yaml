- id: 7d411233-94e6-5654-83eb-7a3a3e6cb91a
  title: そらいろVisaデビット：お取引が拒否された・制限された
  body: '店舗やオンラインショップでのお支払いが拒否された場合、以下の原因が考えられます。順番にご確認ください。


    【考えられる原因とチェック項目】

    1. 口座残高の不足

    デビットカードは即時決済のため、お取引時点での口座残高が決済金額（および海外利用時は2%の手数料）を下回っている場合、決済は拒否されます。残高を十分にご準備ください。


    2. 1日あたりの利用限度額への到達

    1日の利用合計額が、設定されている限度額（初期設定は300,000円）に達している場合、それ以上の利用はできません。翌日までお待ちいただくか、限度額の変更をご検討ください。


    3. カードの利用停止状態

    紛失届などの手続きにより、カード自体が停止状態になっていないかご確認ください。


    4. セキュリティロック

    短時間に高額な決済を繰り返した際など、不正利用防止のため銀行側で一時的に制限をかける場合があります。


    【解決しない場合の対応】

    上記を確認しても解決しない場合は、担当者へお知らせください。詳細なエラーコードを調査し、制限の解除手続きや原因の特定を行います。必要に応じて専門のオペレーターへエスカレーションし、迅速に復旧を支援いたします。'
  domain: cards
  product_category: sorairo_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3d2418ea-1794-5dba-b974-2c3c4947e389
  title: そらいろVisaデビット：切替えや上位プランを検討するとき
  body: '現在ご利用のそらいろVisaデビットから、他プランへの切替えを検討される際の比較ポイントです。


    【そらいろVisaデビットの特長】

    ・年会費：0円とコスト負担がありません。

    ・還元：0.8%という高いキャッシュバック率を備えています。

    ・管理：口座残高の範囲内で利用するため、使いすぎを防止できます。


    【切替えを検討すべきケース】

    ・クレジットカードのように後払いを希望される場合（本商品は即時決済のため不可）。

    ・初期設定の1日あたり300,000円という限度額では不十分な高額決済が頻繁にある場合。


    基本的には、日常的な決済を一本化し、効率的にキャッシュバックを得たい方に最適です。費用を抑えつつ利便性を最大化したい場合は、本プランの継続を推奨いたします。'
  domain: cards
