- id: 49800cf2-9be9-520c-987e-d83b64f22748
  title: スマホ送金：安全にご利用いただくためのポイント
  body: '「スマホ送金」を安全にご利用いただくために、以下の点に十分ご注意ください。


    **【特にご注意いただきたいこと】**

    ・**二段階認証**を必ず有効にし、パスワードやワンタイムパスワードを第三者に教えないでください。

    ・面識のない相手から「送金してほしい」という突然の連絡があった場合は、詐欺の可能性があります。十分にご注意ください。

    ・不審なSMSやメールのリンクからログインせず、必ず公式アプリから操作してください。


    **【異常を感じたときは】**

    万が一、身に覚えのない送金があった場合や、アカウントの不正利用が疑われる場合は、すぐに利用停止の手続きをしてください。迅速に調査を行い、預金者保護法に基づき、故意や重大な過失がない限り原則として銀行が補償いたします。'
