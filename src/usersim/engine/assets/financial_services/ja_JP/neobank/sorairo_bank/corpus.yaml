- id: 4e428a74-052a-51b7-8cae-4a0bebed7a89
  title: create_goal_pocket を使う場面
  body: "お客様が「目的別口座」を新しく作成し、計画的に貯金をしたいと希望された際に、本ツールを使用して口座の作成と設定を行います。一つの普通預金口座の中で、最大10個まで貯金箱のように資金を分けることができる機能です。\n\
    \n【手続き手順】\n1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。\n2. `get_accounts`\
    \ を呼び出し、対象となる普通預金口座の `account_id` を特定します。\n3. お客様に、以下の設定内容を確認します。\n    - 目的別口座の名前（例：「旅行用」「車買い替え用」など）\n\
    \    - 目標金額（円）\n    - 毎月の自動入金額（円）\n4. `create_goal_pocket` を呼び出し、特定した `account_id`\
    \ と上記の設定内容を登録します。\n5. 作成完了を伝え、今後の資産形成を支援する案内を行ってください。\n\n目的別口座の詳細な仕組みについては、「目的別口座：商品概要」をご確認ください。"
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - create_goal_pocket
  institution_id: sorairo_bank
- id: 3c71d30e-c5d7-5c60-b285-1c5df59d69b0
  title: create_goal_pocket ツールリファレンス
  body: '普通預金口座内に、仮想的な貯金箱である「目的別口座」を新規作成するツールです。エージェントはこのツールを直接呼び出し、設定を行います。呼び出し前に
    `verify_identity` による本人確認が必須です。


    【引数】

    - `account_id`: `get_accounts` で特定した、親となる普通預金口座の識別子。

    - `pocket_name`: 目的別口座に付ける名称。

    - `goal_amount`: 貯金目標金額（円）。

    - `monthly_deposit_amount`: 毎月自動的に普通預金から振り替える金額（円）。


    【効果】

    指定された口座内に新しい目的別口座が作成され、自動入金設定が有効になります。'
