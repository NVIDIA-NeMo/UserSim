- id: 1b00353c-d68f-50a2-a5c7-84b41a65994b
  title: 普通預金：お手続きが完了しない・保留中のまま
  body: '【症状】

    口座開設や情報の変更手続きを行っている際、画面が「処理中」のまま動かない、または「手続き保留中」と表示され完了しない。


    【考えられる原因と確認事項】

    1. 本人確認書類の読み取り不備：マイナンバーカードのICチップ読み取り時にスマートフォンを動かしたり、写真が不鮮明だったりする場合、審査に時間がかかります。

    2. 通信環境の不安定：電波の弱い場所での操作により、データの送信が中断している可能性があります。

    3. システムの一時的な負荷：アクセス集中により処理に時間を要している場合があります。


    【解決方法】

    ・通信環境の良い場所（Wi-Fi環境など）で、再度アプリを立ち上げて状態を確認してください。

    ・保留中の通知に「再提出」の案内がある場合は、指示に従い再度書類の撮影を行ってください。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、専門のオペレーターへエスカレーションいたします。お調べしますので、フルネームと生年月日をお伝えください。状況を確認し、審査状況の照会または手続きの再開についてご案内いたします。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: troubleshooting
  source_authority: official
