- id: 31c25484-5a47-554b-b918-611f9789983b
  title: 定期預金：限度額・制限と注意事項
  body: '【定期預金：限度額・制限と注意事項】


    本商品は、安定した資産形成を目的とした預金商品であり、以下の制限および注意事項が適用されます。お客様への案内時に必ずご確認ください。


    ■預入金額の制限

    ・最低預入金額：1,000円からお申し込みいただけます。1,000円未満の金額での口座開設はできません。


    ■預金保護について

    ・本商品は預金保険制度の対象です。預金保険機構により、1金融機関につき預金者1人当たり元本1,000万円までと、破綻日までの利息等が保護されます。


    ■運用の制限と注意事項

    ・定期預金は原則として満期日まで資金を預ける商品です。中途解約を行う場合は、適用金利が変更されるなどの制限がございます。詳細は「定期預金：規定・約款」をご確認ください。

    ・本商品の金利（6か月もの0.7%、1年もの0.9%）は税引き前の年率であり、実際のお受取額は税引き後の金額となります。


    ■本人確認の徹底

    ・口座情報の照会や変更を行う際は、必ずお客様のフルネームと生年月日の確認を行ってください。セキュリティポリシーに基づき、暗証番号などの機密情報は一切聞き出さないよう徹底してください。'
