- id: ffb5e62f-5f30-51de-b235-7289ac41f14a
  title: そらいろVisaデビット：1日あたりの利用限度額（初期設定）について
  body: 'Q：カードを使い始めたとき、1日に利用できる金額の上限はいくらですか？

    A：そらいろVisaデビットの1日あたりの利用限度額（初期設定）は300,000円です。


    Q：1日の限度額を変更することはできますか？

    A：はい、アプリ内でご自身で変更が可能です。ご利用状況に合わせて上限額を調整し、安全にご利用ください。


    Q：口座に十分な残高があれば、300,000円を超えて利用できますか？

    A：いいえ、口座残高に関わらず、設定されている1日あたりの利用限度額までしかご利用いただけません。'
