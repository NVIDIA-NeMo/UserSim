- id: 1fea39d5-8d46-5e37-9fa5-370bd9ceed9c
  title: 定期預金：不正利用からお客さまを守るために
  body: 'そらいろ銀行では、大切なお資産を守るため、ログイン時および振込時に「二段階認証」を必須としています。定期預金の解約や資金移動の際は、必ずこの認証が行われますので、認証コードを第三者に教えないでください。


    **ご注意いただきたい点**

    * 銀行員が電話やメールで、暗証番号や認証コードを聞くことは絶対にありません。

    * 不審なメールのリンクから個人情報を入力しないようご注意ください。


    万が一、不正利用の疑いがある場合は、すぐにアプリから利用停止のお手続きをお願いいたします。預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として銀行が補償いたします。また、預金保険制度により、元本1,000万円までとその利息等が保護されますのでご安心ください。'
  domain: retail_banking
