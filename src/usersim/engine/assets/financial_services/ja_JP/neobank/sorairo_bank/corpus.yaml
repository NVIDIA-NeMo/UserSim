- id: d15705a8-33c9-5789-bbd7-6b2420b9aedd
  title: 普通預金：状況・履歴の確認
  body: '「普通預金」の残高や入出金履歴を確認する手順をご案内します。


    **【事前準備】**

    * スマートフォンアプリにログインできる状態であること。


    **【確認の手順】**

    1. アプリのホーム画面から「普通預金」の口座を選択します。

    2. 口座詳細画面が表示され、現在の最新残高が確認できます。

    3. 画面下の「入出金履歴」タブをタップし、過去の取引一覧を表示します。

    4. 特定の取引内容を詳しく知りたい場合は、該当する履歴項目をタップしてください。


    **【完了の目安】**

    * 取引日時、金額、相手先名などの詳細が表示されれば完了です。履歴はリアルタイムで更新されます。


    詳細な利用方法は「普通預金：商品概要」をご参照ください。'
