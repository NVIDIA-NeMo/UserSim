  mentions_tools: []
  institution_id: sorairo_bank
- id: e228d5a6-4a08-5e53-b981-41e1bd88d85b
  title: 普通預金：規定・約款
  body: '本規定は、そらいろ銀行が提供する「普通預金」の利用条件を定めるものです。お客さまは本約款に同意することで口座を開設し、サービスを利用いただけます。


    1. 預金保険制度による保護

    普通預金は預金保険制度の対象となっており、当行が破綻した場合には、預金保険機構により、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    2. 手数料の適用

    ・他行あて振込手数料：毎月2回まで無料です。無料回数を超えた後は、1回につき145円の手数料を申し受けます。

    ・提携ATM出金手数料：毎月2回まで無料です。無料回数を超えた後は、1回につき110円の手数料を申し受けます。


    3. 本人確認と口座管理

    犯罪収益移転防止法に基づき、口座開設時には厳格な本人確認を実施します。また、口座情報の照会や変更を行う際は、必ずフルネームと生年月日の確認を行います。


    4. 解約および終了

    お客さまはいつでもアプリを通じて口座の解約を申請できます。解約手続き完了後、口座内の残高は指定の口座へ送金されるか、返金手続きが行われます。


    5. 規定の変更

    当行は、法令の改正やサービス改善のため、本規定を変更することがあります。変更内容はアプリ内および公式サイトにて告知いたします。'
