- id: 4908d5a3-2db5-5125-8089-49b7a0e4f8e1
  title: そらいろVisaデビット：リスクについてのご説明
  body: 'そらいろVisaデビットをご利用いただくにあたり、以下のリスクと制限事項について十分にご確認ください。


    1. 決済不能リスク

    本カードはデビット方式であるため、決済時に口座残高が不足している場合、支払いは行われず決済は拒否されます。クレジットカードのような後払いはできません。十分な残高を維持してご利用ください。


    2. 海外利用時のコスト

    海外加盟店で利用する場合、決済金額に加えて2%の海外利用事務手数料が発生します。また、為替変動により、日本円での請求額が変動する可能性があります。


    3. 利用限度額の制限

    1日あたりの利用限度額（初期設定 300,000円）が設定されています。高額な決済を行う際は、あらかじめアプリにて限度額が十分であるかをご確認ください。


    4. 不正利用のリスク

    カード情報の流出等により、第三者が不正に利用するリスクがあります。万が一の際は、速やかに届出を行ってください。当行の規定に基づき補償を行いますが、重大な過失がある場合は補償額が減額されることがあります。


    5. 預金保険制度について

    本カードの紐付け先である普通預金等は、預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。外貨預金は対象外となります。'
