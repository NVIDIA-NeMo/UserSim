- id: 9280bffd-4e6d-5b79-8213-4fb045ebc249
  title: 定期預金：個人情報の取扱い
  body: '当行は、銀行法および個人情報保護法を厳格に遵守し、お客様の個人情報を適切に管理いたします。


    **情報の利用目的**

    定期預金の口座管理、金利（0.7%または0.9%）の計算、および法令に基づく報告などの目的のみに利用いたします。


    **第三者提供の制限**

    法令に基づく場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    **預金保険制度について**

    本商品は預金保険制度の対象です。当行が破綻した場合でも、預金保険機構により、利息のつく預金として1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。これにより、お客様に安心してお預けいただける体制を確保しております。'
