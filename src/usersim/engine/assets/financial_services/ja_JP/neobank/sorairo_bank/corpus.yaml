- id: 13aee733-db75-5409-a075-247bbd07d6ee
  title: スマホ送金：想定外の手数料・金額
  body: 'お客様より「手数料が0円だと思っていたのに、振込手数料が引かれている」といったお問い合わせをいただいた際の対応手順です。


    ■考えられる原因

    お客様が「スマホ送金」ではなく、通常の「振込（口座番号指定）」を利用して送金を行った可能性が高いと考えられます。通常の振込は、会員ランクに応じた無料回数を超えると手数料が発生します。


    ■確認手順と解決策

    1. 履歴の確認：お客様にアプリの取引明細を確認していただき、取引名称が「スマホ送金」となっているか、あるいは通常の「振込」となっているかを確認してください。

    2. 方法の案内：もし「振込」を利用していた場合は、電話番号で送る「スマホ送金」メニューから手続きを行うことで、手数料0円で利用できることをご案内ください。


    ■エスカレーションの判断

    「スマホ送金」として手続きしたにもかかわらず、手数料が差し引かれていることが明らかな場合は、システム不具合の可能性があるため、速やかに専門のオペレーターへエスカレーションし、調査を依頼してください。調査完了後、不当な請求が判明した場合は、規定に基づき速やかに返金処理を行います。'
