  title: 普通預金：当社の似た商品との比較
  body: '当行で提供している貯蓄・決済手段の比較です。


    ■ 普通預金

    金利：年0.45%

    特徴：いつでも出し入れが可能で、日常的な支払いに最適です。


    ■ 目的別口座

    金利：年0.45%

    特徴：普通預金と同じ金利で、最大10個まで資金を分けて管理でき、計画的な貯蓄に向いています。


    ■ 定期預金

    金利：最大年0.9%

    特徴：期間を定めて預けることで、より高い金利を確実に得られます。


