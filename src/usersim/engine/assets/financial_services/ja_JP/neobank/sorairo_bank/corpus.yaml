- id: b8b8a724-8814-5d08-9954-96ca75122853
  title: 目的別口座：他社の一般的な商品との比較
  body: '他社の一般的な銀行で「貯金を分ける」場合、複数の口座を開設するか、物理的な貯金箱を利用することが一般的です。そらいろ銀行の「目的別口座」との違いは以下の通りです。


    【他社の一般的商品（複数口座開設）】

    ・管理コスト：口座ごとに口座番号が発行されるため、管理が煩雑になりやすい。

    ・利便性：資金移動に振込手数料がかかる場合や、手続きに時間がかかることがある。

    ・金利：口座によって金利が異なる場合がある。


    【そらいろ銀行：目的別口座】

    ・管理コスト：1つの口座内で仮想的に分けるため、管理が非常にシンプル。最大10まで作成可能。

    ・利便性：アプリ内で即時に、かつ無料で資金を移動できる。

    ・金利：すべてに普通預金金利の0.45%が適用される。


    【結論】

    ・目的別口座が向いている方：手軽に、かつ金利メリットを享受しながら、複数の貯金目標を管理したいデジタルネイティブ層の方。

    ・他社商品が向いている方：法的な名義変更や、完全に独立した口座番号による管理が必要な特殊な資金運用をされる方。'
