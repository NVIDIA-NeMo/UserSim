- id: 6a23fbf4-abcc-5c74-80cf-204c0459fc15
  title: 定期預金：よくあるお手続きの流れ
  body: '定期預金を開設する際の手続きの流れをご案内します。


    1. まず、運用したい期間を「6か月（金利 0.7%）」か「1年（金利 0.9%）」からお選びください。

    2. 次に、預け入れたい金額を教えてください。最低 1,000円から設定可能です。

    3. 私たちが、選択された条件に基づいた満期日と、満期時に受け取れる概算利息を提示します。

    4. 内容にご同意いただいた後、普通預金口座から指定の金額を定期預金口座へ振り替えます。

    5. 振り替えが完了し、口座が開設されたことを私たちが通知いたします。


    以上のステップで、簡単にご利用を開始いただけます。'
