- id: f80e855e-2950-56cf-90af-6afac424e15f
  title: 普通預金：よくあるお手続きの流れ
  body: '「普通預金」の開設から利用開始までの一般的な流れをご案内します。


    **【事前準備】**

    * マイナンバーカード（ICチップ読み取り可能なもの）をご用意ください。


    **【お手続きの手順】**

    1. アプリから口座開設を申し込み、マイナンバーカードのICチップを読み取り、オンライン本人確認（取引時確認）を行います。

    2. 規約に同意し、登録内容を確認します。

    3. 当行による審査後、口座開設完了の通知が届き、口座番号が発行されます。

    4. 0.45%の金利が適用される「普通預金」口座が利用可能になります。


    **【完了の目安】**

    * アプリのホーム画面に「普通預金」の残高表示が出れば、即座に振込や入出金などの取引を開始いただけます。


    詳細は「普通預金：ご利用開始までの手順」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: how_to_guide
