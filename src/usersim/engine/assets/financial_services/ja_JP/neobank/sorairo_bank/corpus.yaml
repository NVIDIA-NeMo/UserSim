- id: 8071d408-4988-5e80-a33d-a2cda7c7efbb
  title: 定期預金：手数料と費用
  body: 'Q：定期預金の口座開設や解約に手数料はかかりますか？

    A：いいえ、定期預金の開設および満期による解約に手数料は一切かかりません。0円でご利用いただけます。


    Q：運用中に費用が発生することはありますか？

    A：口座維持などの手数料はございません。安心してお使いください。その他の手数料については「手数料・料金のご案内」をご参照ください。'
