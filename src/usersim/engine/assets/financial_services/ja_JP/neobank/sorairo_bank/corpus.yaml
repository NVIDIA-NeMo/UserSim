- id: 4e428a74-052a-51b7-8cae-4a0bebed7a89
  title: create_goal_pocket を使う場面
  body: 'お客さまが「目的別口座を作って貯金を管理したい」と希望された際に、本手続きを行います。目的別口座は最大10個まで作成可能です。


    【手続きの流れ】

    1. 本人確認を行い、お客さまの身元を確定させます。

    2. get_accounts を使用して、親口座となる普通預金の account_id を特定します。

    3. 以下の情報を伺います：

    　・口座の名前（例：旅行資金）

    　・目標金額（円）

    　・毎月の自動入金額（円）

    4. create_goal_pocket を呼び出し、口座の作成を完了させます。'
