- id: d8540aa9-171f-5cfd-ac13-9a5db4c3dec9
  title: order_replacement_card を使う場面
  body: 'お客さまから「そらいろVisaデビット」の紛失、盗難、またはカードの破損による再発行の依頼を受けた際に本手続きを行います。


    **【重要】**

    カードの紛失や盗難の場合、再発行前に必ずカードの利用停止処理を行ってください。詳細は「freeze_card を使う場面」をご確認ください。


    **【手続きの流れ】**

    1. 本人確認を行い、お客さまの本人性を確認します。

    2. `get_accounts` を使用して、対象となる口座の account_id を特定します。

    3. お客さまに再発行にかかる日数と配送方法を案内します。

    4. `order_replacement_card` を呼び出し、カードの再発行申請を完了させます。

    5. 手続き完了後、新しいカードが届くまでのお時間を改めてお伝えします。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: sorairo_bank
