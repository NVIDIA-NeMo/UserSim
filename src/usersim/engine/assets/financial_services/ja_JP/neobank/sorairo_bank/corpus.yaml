- id: 6749e1c3-24f8-5256-9564-3ab5a2e1d780
  title: 目的別口座：個人情報の取扱い
  body: '当行は、個人情報保護法および金融庁の監督に基づき、お客さまの個人情報を厳格に管理いたします。


    **【目的別口座における情報の取扱い】**

    本サービスで設定される「口座の目的名」などの情報は、お客さまの利便性向上および資産管理のサポートを目的として利用されます。これらの情報は、法令に基づく場合を除き、第三者に提供されることはございません。


    **【安心の保護制度】**

    目的別口座に預けられた資金は、預金保険制度の対象となります。当行が破綻した場合でも、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されますので、安心してご利用ください。'
