- id: 05b9f87d-8644-5fb5-af6d-e2bffea9a5b6
  title: 目的別口座：安全にご利用いただくためのポイント
  body: '目的別口座を安心してお使いいただくために、以下のセキュリティポイントをご確認ください。


    【不審な連絡にご注意ください】

    そらいろ銀行では、目的別口座の設定や変更を理由に、お客様の暗証番号、パスワード、カード番号、CVV、または身分証番号をメールや電話でお伺いすることは一切ございません。このような情報を求める連絡があった場合は、フィッシング詐欺の可能性がありますので、絶対に応答せず、速やかに当行までご連絡ください。


    【二段階認証の活用】

    当行では、ログイン時および振込時に二段階認証を導入しており、不正アクセスからお客様の資産を保護しています。認証コードを第三者に教えることは絶対におやめください。


    【本人確認について】

    口座情報の照会や変更手続きを行う際は、必ずお客様のフルネームと生年月日の確認をさせていただきます。これは、大切なお預金を守るための重要な手続きです。ご理解とご協力をお願いいたします。


    【異常を感じたら】

    目的別口座からの意図しない資金移動や、身に覚えのない通知があった場合は、直ちにアプリから利用停止手続きを行うか、専門のオペレーターへご連絡ください。迅速な報告により、預金者保護法および当行規定に基づいた公正な調査と補償手続きを速やかに行うことが可能となります。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: fda64e6f-bef7-53b9-844f-95e9ab469fdb
  title: 目的別口座：規定・約款の変更
  body: '本規定は、そらいろ銀行が提供する「目的別口座」機能の利用条件および、その変更手続きについて定めるものです。お客様は本規定に同意することで、本機能を利用いただけます。


    【機能の制限と条件】

    1. 作成できる目的別口座の数は、最大10個までとします。この上限数は、サービス提供の持続可能性およびシステム管理上の制約に基づき設定されており、当行の判断により将来的に変更される場合があります。

    2. 本機能における適用金利は、普通預金金利（年0.45%）に準じます。金利の変更が行われた場合、目的別口座内の残高にも同様に適用されます。

    3. 自動入金機能を設定する場合、最低金額は1,000円からとします。この基準額を下回る設定はできません。


    【規定の変更および通知】

    当行は、法令の改正、金融庁の監督指針の変更、またはサービス改善のため、本規定を変更することがあります。変更内容は、アプリ内通知または公式サイトにて事前にお知らせいたします。通知後、一定期間内に異議申し立てがない場合は、変更後の規定に同意したものとみなされます。


    【利用の終了】

    お客様が普通預金口座を解約された場合、または当行が口座利用停止措置を講じた場合、本機能の利用も同時に終了します。目的別口座内の資金は、原則として普通預金のメイン口座へ統合されます。


    詳細については、「目的別口座：重要事項のご説明」をご参照ください。'
