- id: b7e8711c-fb20-5588-ab72-a3b0402021d9
  title: そらいろVisaデビット：状況・履歴の確認
  body: 'カードのご利用状況や、過去の取引履歴を確認する手順をご案内します。


    【事前準備】

    ご本人様確認のため、フルネームと生年月日をお手元にご用意ください。


    【お手続きの流れ】

    1. 担当者に「Visaデビットの利用履歴を確認したい」旨を伝えてください。

    2. ご案内があった際に、フルネームと生年月日を提示し、本人確認を行ってください。

    3. 確認したい期間（例：直近1か月分など）を伝えてください。

    4. 担当者が最新の取引内容（利用店舗、金額、決済日時など）を確認し、口頭またはメッセージで回答します。


    【完了の確認】

    提示された履歴の内容と、ご自身の記録が一致していることを確認して完了です。もし身に覚えのない取引が含まれていた場合は、その場ですぐに担当者へお知らせください。速やかに調査および補償の手続きへと進ませていただきます。'
