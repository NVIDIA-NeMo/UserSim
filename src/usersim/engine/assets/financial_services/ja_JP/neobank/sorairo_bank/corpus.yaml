- id: a5aea6a2-b259-5f7b-9ed2-ab00b900a80b
  title: 定期預金：お取引が拒否された・制限された
  body: '「定期預金の開設や解約の手続きをした際に、エラーが表示されて取引が完了できない」という場合の対処法をご案内します。


    ■考えられる原因とチェック項目

    1. 預入金額が不足している

    定期預金の最低預入金額は1,000円です。振替元の普通預金口座に1,000円以上の残高があるかをご確認ください。


    2. 本人確認（KYC）の不備

    犯罪収益移転防止法に基づき、最新の本人確認が完了していない場合、お取引が制限されることがあります。アプリの通知に「本人確認書類の再提出」などの案内が出ていないかご確認ください。


    3. 通信環境またはアプリのバージョン

    不安定なネットワーク環境や、古いバージョンのアプリをご利用の場合にエラーが発生することがあります。


    ■解決策

    ・残高不足の場合は、「普通預金：商品概要」をご確認の上、資金を追加してください。

    ・本人確認の不備がある場合は、アプリの案内に従って再手続きをお願いします。


    ■解決しない場合の対応

    上記を確認しても解決しない場合は、当行にて口座の状態を詳細に調査いたします。オペレーターに状況を伝えていただき、専門部署へエスカレーションさせていただきます。調査完了後、アプリの通知またはメールにて結果をご案内いたします。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ec7466b7-9219-52ed-bcb3-1614f8d64c42
  title: 定期預金：切替えや上位プランを検討するとき
  body: '【エージェント向け：プラン検討の案内】


    お客様が資金の運用効率を高めたいと考えておられる場合、以下の視点でプランの切り替えをご案内ください。


    ■金利の比較

    ・6か月もの：0.7%

    ・1年もの：0.9%


    より高い収益性を重視される場合は、1年ものへの切り替え、または新規開設をご案内ください。0.2%の金利差があるため、預入金額が大きいほど効果的です。


    ■普通預金からの切り替え

    日常的に利用しない「余裕資金」を「普通預金：商品概要」の口座に置いている場合、定期預金へ移すことで金利メリットを最大化できます。ただし、定期預金は原則として満期まで引き出せないため、急ぎの資金は普通預金に残していただくよう案内してください。


    ■案内ポイント

    「1,000円から」という少額から設定可能なため、まずは少額で1年ものを試し、運用の感覚を掴んでいただく提案が有効です。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 4c7ea357-1ac2-5a4a-9afe-73d64897c5ff
  title: 定期預金：ほかの選択肢との比較と向かない場合
  body: '【定期預金：ほかの選択肢との比較と向かない場合】


    資産形成の方法は様々です。当行の「定期預金」と他の機能の特性を比較し、最適な選択をお手伝いします。


    ■他の選択肢との比較

    ・普通預金：いつでも自由に出し入れができ、日常的な決済に適しています。金利は定期預金より低くなります。

    ・目的別口座：一つの口座内で仮想的に資金を分けられるため、「旅行用」「車用」などの管理に最適です。利便性は高いですが、金利面でのメリットは定期預金の方が大きくなります。

    ・定期預金：6か月もの（0.7%）や1年もの（0.9%）のように、期間を定めることで高い金利を得られます。確実な資産形成を目指す方に最適です。


    ■定期預金が向かない方

    ・近いうちに使う予定がある資金を管理したい方：中途解約による金利低下のリスクがあるため、普通預金や「目的別口座：商品概要」での管理をお勧めします。

    ・1,000円未満の少額から積み立てたい方：本商品は最低預入金額が1,000円となっております。


    確実性と収益性のバランスを重視される方は、ぜひ「定期預金」をご活用ください。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: product_sheet
