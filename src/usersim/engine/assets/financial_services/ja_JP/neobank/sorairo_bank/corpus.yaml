- id: f3e317de-65f2-525c-8c25-8ce396735ce8
  title: そらいろVisaデビット：ログインできない・アクセスできない
  body: 'アプリにログインできず、カードの利用状況や0.8%のキャッシュバック履歴が確認できない場合の対処法です。


    **【考えられる原因とチェック項目】**

    - **認証情報の誤り**: パスワードが正しいか、大文字・小文字を含めて再確認してください。

    - **二段階認証の不整合**: 端末を変更された場合、認証の再登録が必要です。

    - **通信環境の不安定**: Wi-Fiやモバイルデータ通信が正常に動作しているかご確認ください。


    **【解決策】**

    - パスワードを忘れた場合は、アプリの「パスワード再設定」から手続きを行ってください。

    - 認証デバイスを変更した場合は、本人確認を経て認証の再登録をお願いします。


    上記で解決しない場合は、専門オペレーターへエスカレーションし、口座の状態を調査いたします。'
