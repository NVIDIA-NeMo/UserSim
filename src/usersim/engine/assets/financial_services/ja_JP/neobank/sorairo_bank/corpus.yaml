- id: 9afaede3-1a1d-53ae-a7a4-418bf64e1ee0
  title: 普通預金：普通預金の金利について
  body: '【Q】普通預金の金利はどのくらいですか？

    【A】そらいろ銀行の普通預金金利は0.45%です。デジタルネイティブなお客さまに選ばれる銀行として、競争力のある金利をご提供しております。


    【Q】金利はどのように適用されますか？

    【A】普通預金口座にあるすべての残高に対して、一律0.45%の金利が適用されます。複雑な条件はなく、どなたでもこの金利で資金を管理いただけます。


    金利の詳細な適用ルールについては、「普通預金：金利・料率一覧」をご参照ください。'
