- id: 1d0b6d80-efe9-5343-bf69-6db1c93296f0
  title: 普通預金：解約・変更・プランの切替え
  body: '普通預金口座の解約や登録内容の変更、プランの切り替えを希望される際の手順をご案内します。


    **【口座の解約手順】**

    1. **残高の確認と移動**：口座内の残高を0円にする必要があります。他口座への振込やATM出金にて、すべてのお金を移動させてください。

    2. **解約の申し出**：チャットサポートにて「口座解約」と伝えてください。

    3. **本人確認**：ご案内する認証手順に従い、二段階認証による本人確認を行います。

    4. **完了通知**：手続きが完了すると、アプリ内で解約完了のメッセージが表示されます。


    **【登録内容の変更手順】**

    1. **変更箇所の伝達**：住所や氏名など、変更したい内容をチャットで伝えてください。

    2. **書類の提出**：変更内容に応じて、マイナンバーカードなどの最新の本人確認書類をアプリ経由で提出してください。

    3. **審査と反映**：当行で確認を行い、承認後、登録情報が更新されます。


    **【プランの切替えについて】**

    プラン変更をご希望の場合は、現在の利用状況に基づき最適なプランをご案内しますので、チャットにてご相談ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ab1bc9c5-af2d-552a-b828-48296baf223b
  title: 普通預金：想定外の手数料・金額
  body: "お客さまから「身に覚えのない手数料が引かれている」などのご相談をいただいた場合の対応フローです。\n\n**【考えられる原因】**\n* **無料回数の超過**：月2回までの無料枠（振込およびATM利用）を超えて利用した場合、以下の手数料が自動的に課金されます。\n\
    \    * 振込手数料：145円 / 回\n    * ATM利用手数料：110円 / 回\n* **他社サービス等の自動引き落とし**：連携している外部サービスからの課金が発生している可能性があります。\n\
    \n**【確認ステップ】**\n1. **利用履歴の照会**：直近1か月間の振込回数とATM利用回数を確認し、無料枠の2回を超えていないか照合してください。\n\
    2. **明細の精査**：手数料の金額が145円または110円であるかを確認し、利用タイミングと一致しているかを確認します。\n\n**【解決策とエスカレーション】**\n\
    * **利用超過の場合**：無料枠の仕組みについて丁寧にご説明し、納得いただければ解決となります。\n* **不正利用の疑いがある場合**：至急、不正利用調査チームへ案件をエスカレーションし、口座の利用停止措置を検討してください。調査結果はお客さまへ速やかに通知します。"
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 45455f57-914b-51b2-8511-ef405e9f2eec
  title: 普通預金：必要書類
  body: '普通預金口座を開設いただくために必要な書類は以下の通りです。


    | 確認項目 | 必要書類 | 確認方法 |

