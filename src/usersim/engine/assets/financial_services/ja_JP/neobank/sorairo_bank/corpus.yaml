  institution_id: sorairo_bank
- id: 9efae040-1254-561d-9780-91d0e64bcba3
  title: 定期預金：金利・料率の決まり方と適用
  body: '定期預金に適用される金利の決定方法と適用ルールについてご案内します。


    【適用金利】

    預入時に選択した期間に基づき、以下の固定金利（年率）が適用されます。

    ・6か月もの：0.7%

    ・1年もの：0.9%


    【金利の決定と適用タイミング】

    金利は、お客さまがアプリで預入手続きを完了し、定期預金口座が開設された時点の利率で確定します。一度確定した金利は、満期まで変動することはありません。


    【適用条件】

    ・最低預入金額：1,000円以上

    ・適用対象：そらいろ銀行の普通預金口座をお持ちのお客さま


    【金利の変更について】

    市場環境の変化に伴い、新しく預け入れる際の適用金利は改定されることがあります。ただし、すでに預け入れ済みの分については、満期まで当初の金利が維持されます。


    具体的な金利の例については、「定期預金：1年ものの金利について」をご確認ください。'
