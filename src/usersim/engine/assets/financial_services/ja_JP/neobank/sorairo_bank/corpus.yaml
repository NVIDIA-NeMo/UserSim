  title: そらいろVisaデビット：状況・履歴の確認
  body: '「そらいろVisaデビット」のご利用状況や履歴を確認する手順をご案内します。


    **【確認の手順】**

    1. 当行のチャットまたはオンラインサポートにて、「デビットカードの利用履歴を確認したい」とお伝えください。

    2. ご本人確認後、直近の取引一覧が表示されます。ここで、利用日、利用店名、および決済金額を確認してください。

    3. 同時に、0.8%のキャッシュバックが正しく計算されているかもご確認いただけます。


    **【確認後のポイント】**

    * 決済直後は「処理中」となる場合があります。確定後に正式な明細として記録されます。

    * 1日あたりの利用限度額である300,000円まで、あといくら利用可能かも併せてご確認いただけます。'
  domain: cards
  product_category: sorairo_debit
