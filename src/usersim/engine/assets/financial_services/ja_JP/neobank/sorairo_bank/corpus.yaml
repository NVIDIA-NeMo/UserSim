  title: 目的別口座：プランの選び方
  body: '「普通預金」のみの利用か、「目的別口座」を併用するかでお悩みの方へ。どちらも金利は0.45%で変わりません。


    ・**普通預金のみ**：シンプルに1つの口座で全資金を管理したい方向けです。

    ・**目的別口座を併用**：旅行や車などの目標を立て、最大10個まで資金を分けて視覚的に管理したい方向けです。


