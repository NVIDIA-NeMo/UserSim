- id: b63d8c40-38fb-5095-b327-b224333a1bc0
  title: 目的別口座：金利・料率一覧
  body: '目的別口座に適用される金利は以下の通りです。


    ・適用金利（年率）：0.45%


    【金利の適用について】

    本金利は、目的別口座に預け入れられているすべての金額に一律で適用されます。残高による段階的な金利設定（ティア構造）はございません。目的別口座の資金は、実質的に普通預金として管理されているため、普通預金と同等の金利が適用されます。


    【変動の可能性】

    金利は市場環境や弊社の判断により変更される場合があります。金利が変更された場合は、アプリ内のお知らせおよび公式ウェブサイトにてご案内いたします。'
