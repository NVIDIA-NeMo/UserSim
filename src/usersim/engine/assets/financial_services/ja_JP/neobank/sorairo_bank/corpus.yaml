- id: eb103409-5de2-5f7e-9a6d-331506575208
  title: 普通預金：お申込みとご利用開始
  body: '普通預金口座の開設は、スマートフォンアプリから最短数分で完了します。


    【ご準備いただくもの】

    ・マイナンバーカード

    ・スマートフォン


    【お手続きの流れ】

    1. アプリをダウンロードし、「口座開設」を選択します。

    2. マイナンバーカードのICチップをスマートフォンの読み取り位置に合わせ、オンライン本人確認（eKYC）を行います。

    3. ご利用目的や職種などの必要事項を入力し、取引時確認を完了させます。

    4. ログイン用のパスワードを設定し、二段階認証の登録を行います。

    5. 審査完了後、アプリ内で口座開設の通知が届き、すぐにご利用いただけます。


    お申込みの条件については、「普通預金：お申込みいただける方」をご覧ください。'
