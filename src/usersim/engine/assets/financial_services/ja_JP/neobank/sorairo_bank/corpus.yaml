  institution_id: sorairo_bank
- id: 2472650d-bcfc-5ed9-ac4b-1053d05c8379
  title: スマホ送金：必要書類
  body: '「スマホ送金」をご利用いただくために必要な条件と書類は以下の通りです。


    | 確認事項 | 必要条件・書類 | 判定 |

    | :--- | :--- | :--- |

    | 口座保有状況 | 当行の普通預金口座を開設済みであること | 必須 |

    | 本人確認書類 | マイナンバーカード（ICチップ読み取りによるオンライン確認） | 必須（口座開設時） |

    | 通信環境 | 当行の最新版スマートフォンアプリがインストールされた端末 | 必須 |

    | 電話番号 | ご本人名義のスマートフォン電話番号の登録 | 必須 |


    ※口座開設時に適切に本人確認が完了しているため、機能利用にあたって追加の書類提出は原則不要です。'
