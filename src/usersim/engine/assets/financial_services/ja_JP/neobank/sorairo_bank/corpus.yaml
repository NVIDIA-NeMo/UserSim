- id: c998c74d-1126-5940-861c-81134ac81d93
  title: スマホ送金：状況・履歴の確認
  body: '送金した資金が相手に届いたか、または過去にどのような送金を行ったかを確認する手順をご案内します。


    【事前準備】

    ・そらいろ銀行のスマートフォンアプリにログインできる状態であること。


    【確認の手順】

    1. アプリのホーム画面から「スマホ送金」メニューを選択します。

    2. 画面内の「送金履歴」または「履歴一覧」をタップします。

    3. これまでに送金した履歴が一覧で表示されます。各履歴を選択すると、送金日時、金額、相手方の電話番号などの詳細を確認いただけます。

    4. ステータスが「完了」となっていれば、相手方の口座へ正常に送金されています。「処理中」の場合は、反映までしばらくお待ちください。


    【本人確認について】

    履歴の確認や詳細な照会をオペレーターへ依頼される場合は、ご本人様確認のため「フルネーム」と「生年月日」をお伺いいたします。


    【正常に完了したかの判断】

    履歴一覧で対象の取引が「完了」と表示され、あわせて「普通預金：商品概要」で管理されている口座残高から該当金額が差し引かれていることで、送金が成功したことを確認できます。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 72757145-a130-593b-89b5-c3173cf733c3
  title: スマホ送金：お取引が拒否された・制限された
  body: 'スマホ送金の手続き中にエラーが表示され、送金が完了できない場合の確認事項と解決策をご案内します。


    【よくある症状と原因】

    ・「限度額を超えています」というメッセージが出る

    → 1回あたりの送金上限額（100,000円）または、1か月あたりの送金上限額（500,000円）を超えて送金しようとしています。

    ・「送金先が見つかりません」というメッセージが出る

    → 入力した電話番号が正しくないか、相手方がスマホ送金を利用できる状態にありません。

    ・「お取引を制限しています」というメッセージが出る

    → セキュリティ上の理由により、一時的に機能が制限されている可能性があります。


    【確認の手順】

    1. 送金金額が100,000円以下であるか、今月の累計送金額が500,000円以下であるかを確認してください。

    2. 送金先の電話番号に誤りがないか、もう一度入力し直してください。

    3. アプリを最新バージョンにアップデートし、再度お試しください。


    【解決しない場合の対応】

    上記を確認しても解決しない場合は、当行にて制限の理由を調査いたします。オペレーターに「スマホ送金が利用できない」旨をお伝えください。ご本人様確認後、専門チームにて制限の解除または原因の特定を行い、結果をアプリ内通知またはメールでご連絡いたします。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ce0ad2e9-4082-50ad-ae24-af1e6bde93f7
  title: スマホ送金：切替えや上位プランを検討するとき
  body: '「スマホ送金」から、通常の「振込」手続きへの切替えを検討されている方向けの比較案内です。


    【スマホ送金と通常振込の比較】

    ・利便性：スマホ送金は電話番号のみで完結するため、口座番号を知る必要がなく非常に手軽です。一方、通常振込は銀行名・支店名・口座番号が必要です。

    ・コスト：スマホ送金の手数料は0円です。通常振込は、会員ランクに応じた無料回数を超えると手数料が発生します。

    ・限度額：スマホ送金は1回100,000円まで、月間500,000円までという制限があります。通常振込は、より高額な送金が可能です。


    【どちらを選ぶべきか】

    ・「スマホ送金」が向いている方：友人や家族への少額の割り勘、お祝い金など、スピードと手軽さを重視される場合。

    ・「通常振込」が向いている方：家賃や公共料金の支払い、100,000円を超える高額な送金、ビジネス利用など、正確性と金額的な柔軟性を重視される場合。


    詳細な振込手数料の無料回数については、「普通預金：他行あて振込手数料の無料回数（月、基本）について」をご確認ください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 70429678-2233-57ac-b1fa-d6ff7920041b
  title: スマホ送金：ほかの選択肢との比較と向かない場合
  body: '「スマホ送金」は利便性に特化したサービスですが、利用シーンによっては他の送金方法の方が適している場合があります。


    【スマホ送金が最適なシーン】

    ・相手の口座番号が分からなくても、電話番号だけで即座に送金したいとき。

    ・送金手数料を0円に抑えたいとき。

    ・100,000円以下の少額資金を、デジタルネイティブな感覚で素早く送りたいとき。


    【スマホ送金に向かないケース】

    ・高額な送金が必要な場合：1回あたり100,000円、1か月あたり500,000円の限度額があるため、これを超える送金はできません。

    ・公式な支払いを行う場合：相手方が個人ではなく企業や店舗である場合、通常は銀行口座への振込が求められます。

    ・相手方がスマートフォンアプリを利用していない場合：電話番号ベースのサービスであるため、アプリを通じた受け取りができない方には送金できません。


    このような場合は、通常の振込機能をご利用いただくことをおすすめいたします。振込の手順については、「普通預金：よくあるお手続きの流れ」をご参照ください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3d794088-394e-5b2b-9b06-99bd795c0b46
  title: スマホ送金：お申込みとご利用条件
  body: '「スマホ送金」の利用条件についてご案内します。


    Q. 利用するために別途申し込みは必要ですか？

    A. いいえ、別途のお申し込み手続きは不要です。そらいろ銀行の口座を開設し、スマートフォンアプリをご利用いただければ、そのまま本機能をご利用いただけます。


    Q. 誰でも利用できますか？

    A. 当行の口座を保有し、アプリにログイン可能なすべてのお客様にご利用いただけます。ただし、口座開設時の本人確認が完了している必要があります。


    Q. 相手方もそらいろ銀行の口座を持っている必要がありますか？

    A. はい。本サービスは、そらいろ銀行のユーザー同士で電話番号を用いて送金する機能です。相手方も当行の口座を保有し、アプリを利用している必要があります。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3d4e5f04-d22a-5d68-8589-b6fad83165b5
  title: スマホ送金：よくあるお手続きの流れ
  body: '電話番号を使って、手軽に資金を送金する際の手順をご案内します。


    【事前準備】

    ・送金先となる相手方の電話番号を確認してください。

    ・ご自身の口座に、送金希望額以上の残高があることを確認してください。


    【送金の手順】

    1. アプリのホーム画面から「スマホ送金」を選択します。

    2. 「送金する」ボタンをタップし、相手方の電話番号を入力します。

    3. 送金したい金額を入力します（1回あたりの上限は100,000円です）。

    4. 送金先の名前と金額を確認し、「確定」をタップします。

    5. 二段階認証等のセキュリティ確認画面が表示された場合は、画面の指示に従って認証を完了させてください。

    6. 「送金が完了しました」というメッセージが表示されれば手続き完了です。


    【本人確認について】

    お手続き中に不明点があり、オペレーターへ確認を依頼される場合は、ご本人様確認として「フルネーム」と「生年月日」をお伺いします。


    【完了後の確認】

    送金後、即座に相手方の口座へ資金が反映されます。詳細は「スマホ送金：状況・履歴の確認」からご確認いただけます。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: b6ffde7c-2a77-579a-997a-043a2402894d
  title: スマホ送金：明細や記録と合わない
  body: '「送金したはずなのに相手に届いていない」「明細の金額が想定と異なる」といった、記録の不一致に関する解決方法をご案内します。


    【確認すべきポイント】

    1. 送金履歴のステータスを確認してください

    → 「処理中」となっている場合は、ネットワーク遅延などで反映に時間がかかっている可能性があります。時間を置いて再度ご確認ください。

    2. 送金先の電話番号を再確認してください

    → 履歴に表示されている電話番号が、正しい相手のものか確認してください。一桁の間違いなどで、別の方に送金されている可能性があります。

    3. 口座残高の変動を確認してください

    → 「普通預金：商品概要」の口座から、正確に指定した金額が差し引かれているか確認します。


    【想定される原因】

    ・二重送金：通信エラーにより、確定ボタンを複数回押してしまったことで、同じ金額が2回送金されている場合があります。

    ・反映のタイムラグ：アプリの表示更新が遅れている場合があります。一度アプリを再起動してご確認ください。


    【解決しない場合の対応】

    履歴上の金額と実際の残高変動に明らかな乖離がある場合は、当行にて取引ログを精査いたします。オペレーターへ「スマホ送金の記録が合わない」旨をお伝えください。ご本人様確認（フルネームと生年月日）の後、調査を開始し、不備が確認された場合は速やかに補償手続きを行います。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c3e984fa-343d-5ef5-8dfc-674ff98f4489
  title: 手数料・料金のご案内
  body: 'そらいろ銀行では、お客様にストレスなく日常的にご利用いただけるよう、多くのサービスで無料回数の枠を設けております。これにより、心理的なハードルを下げた便利で快適なデジタルバンキング体験を提供いたします。


    無料回数を超えてご利用いただいた際の手数料は、サービスの品質維持および持続可能な提供のためのコストとして適切に設定させていただいております。


    具体的な手数料の金額や無料回数の詳細は、各商品ごとの手数料一覧（例：「普通預金：手数料一覧」など）をご確認ください。'
