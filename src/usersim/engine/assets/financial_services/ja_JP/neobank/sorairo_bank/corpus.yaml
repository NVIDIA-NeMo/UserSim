  institution_id: sorairo_bank
- id: a3573674-2c81-513e-a9b5-f96a54df8135
  title: そらいろVisaデビット：年会費について
  body: '【ご質問】そらいろVisaデビットを利用する場合、年会費はかかりますか？


    【回答】いいえ、そらいろVisaデビットの年会費は0円です。入会金や更新時に費用が発生することはありませんので、安心してお申し込みください。


    【ご質問】年会費が無料になる条件や、ランクによる変動はありますか？


    【回答】本商品はどなたでも一律で年会費0円でご利用いただけます。特定の条件を満たす必要はなく、永続的に無料で維持いただけるサービスです。


    その他の費用に関する詳細は、「そらいろVisaデビット：手数料一覧」にてご確認いただけます。'
