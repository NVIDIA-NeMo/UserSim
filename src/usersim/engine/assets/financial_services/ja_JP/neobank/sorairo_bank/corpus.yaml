- id: 4d72ed34-5bd7-5386-b795-edd046fc3f68
  title: 目的別口座：当社の似た商品との比較
  body: '目的別口座と、資産形成に役立つ「定期預金」を比較します。


    | 比較項目 | 目的別口座 | 定期預金 |

    | :--- | :--- | :--- |

    | 目的 | 柔軟な資金管理・貯金 | 確実な資産形成 |

    | 金利 | 0.45% | 商品により異なる（より高設定） |

    | 流動性 | いつでも自由に移動可能 | 原則として満期まで預け入れ |

    | 管理数 | 最大10個まで作成可能 | 預入件数に制限なし |


    【どちらがおすすめか】

    ・目的別口座：旅行や買い物など、近い将来に使う予定がある資金を、利便性を保ちながら分けて管理したい方に最適です。

    ・定期預金：一定期間お金に手をつけず、より高い金利で確実に資産を増やしたい方に向いています。


    詳細は「定期預金：商品概要」をご参照ください。'
