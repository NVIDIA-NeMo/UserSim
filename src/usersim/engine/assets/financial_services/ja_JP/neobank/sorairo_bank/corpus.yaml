- id: 1b75420c-755c-5b3d-858b-cebd5e8bfe58
  title: open_account を使う場面
  body: '新規にお客さまが「普通預金」口座を開設することを希望される場合に本手続きを行います。当行はインターネット専業銀行であるため、すべてオンラインで完結させます。


    **【重要】**

    口座開設には、マイナンバーカードのICチップ読み取りによる厳格なオンライン本人確認が必須となります。


    **【手続きの流れ】**

    1. お客さまから、氏名、生年月日、住所、連絡先などの必要情報を伺います。

    2. マイナンバーカードによる本人確認（取引時確認）が完了していることを確認します。

    3. `open_account` を呼び出し、口座開設処理を実行します。

    4. 開設完了後、アプリでの利用開始方法を案内します。詳細は「普通預金：ご利用開始までの手順」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: sorairo_bank
