- id: bc76e3da-a430-5eaf-abd9-952f0c3a9ddb
  title: 目的別口座：登録内容の変更
  body: '目的別口座に設定した名前や、自動入金の金額を変更する手順をご案内します。


    **【準備するもの】**

    ・ログイン済みのスマートフォンアプリ


    **【変更ステップ】**

    1. アプリのホーム画面から、変更したい「目的別口座」を選択します。

    2. 画面内の「設定」または「編集」ボタンをタップします。

    3. **名称の変更**：新しい目的の名前を入力し、「保存」をタップします。

    4. **入金設定の変更**：自動入金金額を変更したい場合は、金額入力欄に新しい数字（1,000円以上の金額）を入力します。

    5. **確認**：変更内容が保存されたことを確認し、トップ画面に戻ります。


    設定変更は即時に反映されます。もし変更が反映されない場合は、アプリを再起動して再度ご確認ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: how_to_guide
