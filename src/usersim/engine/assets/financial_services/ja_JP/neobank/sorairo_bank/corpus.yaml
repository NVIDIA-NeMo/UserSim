- id: b2c6dfb6-65e6-54bf-8aa1-07f89184263c
  title: 目的別口座：解約・変更・プランの切替え
  body: '目的別口座の名称変更や、不要になった口座の解約手順をご案内します。


    **目的別口座の名称を変更する**

    1. アプリの口座一覧から、変更したい目的別口座を選択します。

    2. 「設定」ボタンを押し、新しい名称を入力して保存してください。


    **目的別口座を解約する**

    1. 解約したい口座を選択し、「口座を閉じる」を選択します。

    2. 口座内に残高がある場合は、まずその資金を普通預金口座へ移動させる必要があります。「全額を普通預金へ戻す」を選択してください。

    3. 残高が0円になったことを確認し、「解約を確定する」を選択してください。これで解約が完了します。


    **注意点**

    * 自動入金設定をしている場合は、解約前に設定を解除してください。

    * 一度解約した口座の履歴は復元できませんのでご注意ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: cb60aeb8-be57-513b-9e5f-8b17594e5ffe
  title: 目的別口座：想定外の手数料・金額
  body: '「目的別口座に予定していた金額が入っていない」「身に覚えのない金額が移動している」と感じた場合は、以下をご確認ください。


    **原因1：自動入金設定の最低金額**

    自動入金機能をご利用の場合、設定金額が1,000円未満になっていないかご確認ください。当行の仕様により、自動入金の最低金額は1,000円からとなっております。設定金額が下回っている場合、入金が行われません。


    **原因2：普通預金側での不足**

    自動入金は普通預金口座の残高から行われます。普通預金口座の残高が設定額に満たない場合、入金はスキップされます。


    **解決しない場合**

    アプリの明細画面で、移動履歴にエラーが表示されていないかご確認ください。それでも原因が不明な場合は、専門オペレーターへオンライン相談をご依頼ください。調査の上、不足分等の正当な処理を行います。'
