- id: 6b613f62-5ab2-5446-97d3-0eadd9fede74
  title: そらいろVisaデビット：解約・変更・プランの切替え
  body: 'そらいろVisaデビットの解約手続きは以下の手順で行ってください。


    **【ご準備いただくもの】**

    *   ご本人様確認済みのスマートフォン（ログイン状態であること）


    **【お手続きの流れ】**

    1.  オペレーターに「そらいろVisaデビットの解約」を希望する旨を伝えてください。

    2.  カードに紐付いている口座の残高に問題がないか、および未決済の利用分がないかを確認します。

    3.  解約に伴い、カードの機能が即時に停止することを確認し、同意してください。

    4.  手続き完了後、解約完了の通知が届きます。


    **【ご確認事項】**

    *   解約後は、これまでにご利用いただいていた0.8%のキャッシュバック特典も適用されなくなります。

    *   カードの物理的な破棄はお客さまご自身の責任で行ってください。'
