- id: 614a55f7-544a-5c35-9f27-b9548eb52e55
  title: 定期預金：ご利用開始までの手順
  body: '【オペレーター用：定期預金開設フロー】

    顧客が定期預金を利用開始するまでの手順は以下の通りです。必ず必要条件を確認してください。


    **1. 準備確認**

    ・普通預金口座（sorairo_futsu）が開設済みであること。

    ・普通預金残高が最低預入金額の1,000円以上あること。


    **2. プランの選択**

    顧客の希望に合わせて、以下のいずれかの期間を選択していただきます。

    ・6か月もの：金利0.7%

    ・1年もの：金利0.9%


    **3. 預入手続き**

    ・顧客に預入金額（1,000円以上の整数値）を確認し、手続きを完了させます。

    ・普通預金から定期預金口座へ資金が移動したことを確認し、完了メッセージを伝えてください。


    **4. 確認事項**

    ・預金保険制度により、元本1,000万円までとその利息が保護されることを案内してください。'
