  institution_id: sorairo_bank
- id: e7ac18e0-0593-5054-ae8c-e2a69866d70a
  title: 普通預金：安全にご利用いただくためのポイント
  body: 'お客様の資産を安全に守るため、普通預金をご利用の際は以下のポイントに十分ご注意ください。


    1. 重要情報の管理について

    暗証番号、パスワード、カード番号、CVV、身分証番号などは、いかなる場合でも銀行員がお伺いすることはありません。これらの情報をメールや電話、SMSで入力・回答させることはございませんので、絶対に入力しないでください。


    2. ご本人確認の手続きについて

    当行では、口座情報の照会や変更手続きを行う前に、必ずお客様の「フルネーム」と「生年月日」を確認させていただきます。これ以外の機密情報を要求することはありません。


    3. 二段階認証の活用

    ログイン時や振込時には二段階認証を導入しております。ご自身のスマートフォン以外で認証通知が届いた場合は、速やかに当行へご連絡ください。


    4. 不正利用への対応

    万が一、不正な利用に気づいた場合は、直ちにアプリから利用停止手続きを行うか、オペレーターへご連絡ください。預金者保護法および当行規定に基づき、公正な調査と補償手続きを速やかに行います。


    詳細は「普通預金：不正利用からお客さまを守るために」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 11b2390f-82c7-5f96-b634-df7107f7844f
  title: 普通預金：規定・約款の変更
  body: 'そらいろ銀行の普通預金に関する規定および約款は、法令の改正やサービス向上に伴い、変更される場合がございます。


    【変更の手続きと通知】

    規定・約款を変更する場合、当行は変更内容および適用日を、アプリ内の通知機能または電子メールにて事前にお知らせいたします。お客様が変更後の規定に同意いただけない場合は、口座の解約手続きを行うことができます。


    【手数料および金利の変更】

    本商品に適用される普通預金の金利（現在は0.45%）や、無料回数を超えた際の手数料（他行あて振込手数料：145円、ATM出金手数料：110円）などの条件が変更される場合も、同様に事前通知を行います。


    【合意のみなし】

    適用日以降に普通預金をご利用いただいた場合、または通知後にお申し出がない場合は、変更後の規定・約款に同意したものとみなされます。


    本規定の詳細は「普通預金：規定・約款」をご確認ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: da647bf0-b5db-5942-8960-b47a113964e7
  title: 普通預金：ご利用開始までの手順
  body: '【サポートエージェント用：普通預金のご利用開始案内】


    お客様が普通預金口座を開設し、利用を開始するまでの標準的なフローを案内します。本手続きはすべてスマートフォンアプリで完結します。


    1. アプリのインストールと準備

    お客様に「そらいろ銀行」アプリをインストールしていただきます。お手元にマイナンバーカードをご用意いただくよう案内してください。


    2. オンライン本人確認（eKYC）

    アプリの指示に従い、マイナンバーカードのICチップを読み取っていただきます。犯罪収益移転防止法に基づき、厳格な本人確認を実施します。


    3. 口座情報の確定と開設

    必要事項を入力し、審査を経て口座開設が完了します。開設完了後、アプリ上で口座番号が発行されます。


    4. ご利用開始

    開設直後から、0.45%の金利が適用される普通預金としてご利用いただけます。また、月2回までの他行あて振込無料枠および、月2回までの提携ATM出金手数料無料枠が即時適用されます。


    詳細な流れについては「普通預金：お申込みとご利用開始」をご案内ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: f75a40c5-884f-5fc1-8886-d4c0da3394a6
  title: 普通預金：提携ATMの出金手数料の無料回数（月、基本）について
  body: 'Q：提携ATMでの出金手数料は、月に何回まで無料になりますか？


    A：普通預金口座をお持ちのお客様は、基本設定として月に2回まで提携ATMの出金手数料が無料となります。


    Q：無料回数を超えてATMを利用した場合はどうなりますか？


    A：月2回の無料枠を超えた後は、1回あたり110円のATM手数料がかかります。


    Q：無料回数はいつリセットされますか？


    A：毎月1日にリセットされ、再び2回まで無料でご利用いただけます。


    手数料の詳細については「普通預金：手数料一覧」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 14ae5b59-2f2d-5ff8-81c1-1cdd289fd892
  title: 普通預金：登録内容の変更
  body: '普通預金口座にご登録いただいている住所、電話番号、メールアドレスなどの変更手続きについてご案内します。


    【お手続きの流れ】


    1. 本人確認の実施

    まず、お客様のフルネームと生年月日をお伺いし、ご本人様であることを確認させていただきます。


    2. 変更内容の提示

    変更したい項目（例：住所、電話番号）と、新しい情報をオペレーターへお伝えください。


    3. 内容の照合と更新

    オペレーターが入力内容を確認し、システム上の登録情報を更新します。住所変更などの場合、必要に応じて追加の証明書類の提示をアプリ経由でお願いすることがあります。


    4. 完了通知の受領

    手続きが完了すると、登録済みのメールアドレスまたはアプリの通知にて完了報告が届きます。これで手続きはすべて完了です。


    なお、プランの変更や解約をご希望の場合は、「普通預金：解約・変更・プランの切替え」をご確認ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: eaf9cf26-7c60-573e-a508-174412abf7f1
  title: 普通預金：ログインできない・アクセスできない
  body: 'アプリにログインできない、または口座情報にアクセスできない場合の対処法をご案内します。


    【よくある症状と原因】

    - 「認証エラー」が表示される：パスワードの誤入力、または二段階認証の不整合が考えられます。

    - 画面が真っ白なまま進まない：通信環境の不安定、またはアプリのバージョンが古い可能性があります。

    - 機種変更後にログインできない：セキュリティ保護のため、以前の端末での認証が有効なままになっています。


    【チェック項目と解消法】

    1. 通信環境の確認：Wi-Fiを切り替えて、4G/5G回線で再度お試しください。

    2. アプリの更新：アプリストアで最新バージョンが提供されていないか確認し、更新してください。

    3. 認証の再登録：スマートフォンを機種変更された場合は、認証の再登録が必要です。フルネームと生年月日による本人確認後、新しい端末での認証設定を案内いたします。


    【解決しない場合】

    上記を試しても解消されない場合は、専門のオペレーターが状況を確認し、認証リセットなどの個別対応を行います。完了までにお時間をいただく場合がございます。


    お手続きが保留中のままとなっている場合は、「普通預金：お手続きが完了しない・保留中のまま」をご参照ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: d28afd90-c53d-5e02-b8ac-c4e1c667f89f
  title: 普通預金：ご利用条件による違い
  body: '【普通預金：基本条件適用表】


    本表は、普通預金口座を保有するすべてのお客様に適用される基本条件をまとめたものです。


    | 項目 | 適用条件 | 内容・数値 |

    | :--- | :--- | :--- |

    | 適用金利 | 全預金者 | 年 0.45% |

    | 他行あて振込手数料（月、基本） | 全預金者 | 2回まで無料 |

    | 提携ATM出金手数料（月、基本） | 全預金者 | 2回まで無料 |

    | 無料回数超過後の振込手数料 | 3回目以降 | 145円/回 |

    | 無料回数超過後のATM手数料 | 3回目以降 | 110円/回 |


    ※口座開設には、犯罪収益移転防止法に基づく本人確認が必要です。詳細は「普通預金：お申込みいただける方」をご確認ください。'
