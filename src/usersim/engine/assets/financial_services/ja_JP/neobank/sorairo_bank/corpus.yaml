  title: 目的別口座：必要書類
  body: '目的別口座は、当行の普通預金口座をお持ちの方であれば、追加の書類提出なしで即時に作成いただけます。


    | 条件 | 必要書類 | 判定 |

    | :--- | :--- | :--- |

    | 普通預金口座を保有している | 不要（アプリ内で完結） | 作成可能 |

    | 普通預金口座を未保有 | マイナンバーカード（ICチップ読み取り必須） | 口座開設後に作成可能 |


    ※口座開設時には、厳格な取引時確認のため、マイナンバーカードによるオンライン本人確認が必要です。'
