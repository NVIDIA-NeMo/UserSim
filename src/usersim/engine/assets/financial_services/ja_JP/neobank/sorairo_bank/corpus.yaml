- id: 037accc8-57cc-56b9-a53b-462754431753
  title: 目的別口座：お申込みとご利用開始
  body: '目的別口座の作成は、スマートフォンアプリから簡単にお手続きいただけます。以下の手順でご利用を開始してください。


    【ご用意いただくもの】

    ・そらいろ銀行の口座を開設済みのスマートフォンアプリ


    【作成手順】

    1. ご本人確認のため、フルネームと生年月日をお伝えください。弊社にて確認させていただきます。

    2. アプリ内の「目的別口座」メニューから「新しく作成する」を選択してください。

    3. 口座の名称（例：「旅行用」「予備費」など）を入力してください。

    4. 初回に振り替える金額を入力し、確定してください。

    5. 内容を確認し、完了ボタンを押してください。これで目的別口座が作成され、即座に利用可能となります。


    【自動入金の設定について】

    継続的に貯金をしたい場合は、自動入金機能の設定をおすすめします。自動入金の最低金額は1,000円から設定可能です。


    お手続きが完了すれば、メインの普通預金残高から指定した金額が目的別口座へ振り替えられます。詳細は「目的別口座：商品概要」をご覧ください。'
