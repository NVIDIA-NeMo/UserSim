- id: a131d0c3-078b-530a-965a-1ec1a13b0053
  title: 目的別口座：リスクについてのご説明
  body: '目的別口座のご利用にあたり、以下のリスクおよび制度についてご理解ください。


    **金利変動リスク**

    適用される年率0.45%の金利は固定ではありません。経済情勢や当行の判断により、将来的に変動する可能性があります。


    **預金保険制度について**

    当行は預金保険制度の適用を受けています。万が一当行が破綻した場合、預金保険機構により、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    **資金管理上の注意**

    目的別口座はあくまで資金を視覚的に分ける機能であり、法的に独立した別口座ではありません。親口座となる普通預金口座を解約された場合、全ての目的別口座も同時に解約されますのでご注意ください。'
