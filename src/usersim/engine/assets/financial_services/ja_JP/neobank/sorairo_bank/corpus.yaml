- id: f80e855e-2950-56cf-90af-6afac424e15f
  title: 普通預金：よくあるお手続きの流れ
  body: 'そらいろ銀行の普通預金を使い始めるための、代表的なお手続きの流れをご案内します。


    【口座開設の流れ】

    1. スマートフォンアプリをインストールし、「口座開設」を選択します。

    2. ご自身のフルネーム、生年月日などの基本情報を入力します。

    3. マイナンバーカードのICチップをスマートフォンの読み取り機能で読み取り、オンラインで本人確認（eKYC）を行います。

    4. 入力内容を確認し、申請を完了させます。

    5. 当行での審査後、口座開設完了の通知がアプリに届き、すぐに利用可能となります。


    【振込の手続き】

    1. アプリの「振込」メニューから、振込先口座情報を入力または選択します。

    2. 振込金額を入力します。

    3. 二段階認証を行い、振込を確定させます。

    4. 振込完了画面が表示され、同時に取引履歴に反映されます。


    【完了の確認】

    全ての手続きはアプリ内で完結します。各手続き後に表示される完了通知と、残高の変動をアプリでご確認ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 7aea2fe2-f013-552d-8fc2-b30b9167d785
  title: 普通預金：明細や記録と合わない
  body: '【症状】

    お客様より「アプリの残高や取引明細が、自分の記録している金額と一致しない」という問い合わせがあった場合。


    【確認すべきポイント（担当者向け）】

    1. 手数料の発生有無：他行あて振込やATM出金の無料回数（各月2回）を超えていないか確認してください。超過している場合、それぞれ145円または110円の手数料が差し引かれています。

    2. 取引のタイミング：振込の予約時間や、ATM利用の反映タイミングによるタイムラグがないか確認してください。

    3. 未確定の取引：決済代行サービスなどを利用しており、仮押さえ状態の金額がないか確認します。


    【解決の手順】

    1. まず、お客様にフルネームと生年月日を伺い、本人確認を行います。

    2. 詳細な取引明細を抽出し、手数料の発生箇所や、見落としやすい少額の取引がないかを一つずつ照合して説明します。

    3. 疑問点が解消されたことを確認し、手続きを完了します。


    【エスカレーション】

    上記を確認しても不整合が解消されない場合や、身に覚えのない出金がある場合は、不正利用の可能性を視野に入れ、速やかに「不正利用・紛失届出専門チーム」へエスカレーションしてください。預金者保護法に基づき、公正な調査と補償手続きを速やかに行います。'
