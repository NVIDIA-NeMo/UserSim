- id: 731d5792-418e-5695-811a-2edf0666ee2b
  title: reregister_device を使う場面
  body: 'お客様がスマートフォンの機種変更を行い、アプリへのログインや振込時に必要な二段階認証（スマートフォン認証）が利用できなくなった場合に、本ツールを使用して認証の再登録を行います。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. お客様が機種変更をされたこと、および現在のデバイスで認証が利用できない状況であることを確認します。

    3. `reregister_device` を呼び出し、お客様の認証情報を新しいデバイスで利用できるように再登録手続きを initiate します。

    4. 登録手続き完了後、アプリを再起動してログインおよび認証ができるか確認するよう案内してください。


    セキュリティに関する詳細は、「普通預金：安全にご利用いただくためのポイント」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - reregister_device
  institution_id: sorairo_bank
- id: 5b557135-8857-5aab-9750-fa1f30c2a52d
  title: reregister_device ツールリファレンス
  body: '機種変更などでスマートフォン認証が使えなくなったお客様に対し、認証の再登録を行うツールです。エージェントはこのツールを直接呼び出して手続きを完了させます。呼び出し前に
    `verify_identity` による本人確認が必須です。


    【引数】

    - `full_name`: お客様のフルネーム。

    - `date_of_birth`: お客様の生年月日。

    - `contact_info`: 登録済みの連絡先情報（電話番号など）。


    【効果】

    お客様の認証デバイスの紐付けがリセットされ、新しいスマートフォンで認証の再設定が可能になります。'
