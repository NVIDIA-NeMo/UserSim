- id: f64c4b25-87db-53a9-930d-dcb5411720fc
  title: 定期預金：お申込みとご利用開始
  body: '定期預金のお申し込みは、アプリを通じて簡単に行っていただけます。以下の手順で手続きを進めてください。


    【事前準備】

    ・そらいろ銀行の普通預金口座をお持ちであること

    ・普通預金口座に、最低預入金額である1,000円以上の残高があること


    【お申し込み手順】

    1. 本人確認：ご本人様確認のため、フルネームと生年月日をお伝えください。

    2. プランの選択：預入期間（6か月もの、または1年もの）を選択してください。なお、金利は6か月ものが0.7%、1年ものが0.9%です。

    3. 金額の指定：預け入れる金額を指定してください（最低1,000円以上）。

    4. 資金移動の確認：普通預金口座から指定金額が引き落とされることに同意し、確定操作を行ってください。

    5. 完了通知：お手続きが完了し、定期預金口座が開設されたことをお知らせします。


    以上の手順で、定期預金のご利用が開始されます。資産形成の目的に合わせた期間をお選びください。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
