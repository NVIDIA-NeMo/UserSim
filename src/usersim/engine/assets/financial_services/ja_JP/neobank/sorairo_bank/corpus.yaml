- id: 21b528e9-385d-5ac7-9060-51d38b102451
  title: update_contact_info を使う場面
  body: 'お客さまの住所変更、電話番号の変更、またはメールアドレスの変更依頼があった際に本手続きを行います。正確な連絡先情報は、重要な通知の送付やセキュリティ維持に不可欠です。


    **【手続きの流れ】**

    1. 本人確認を行い、変更権限があることを確認します。

    2. 変更後の新しい連絡先情報（新住所、新電話番号、新メールアドレスなど）を正確に伺います。

    3. `update_contact_info` を呼び出し、登録情報を更新します。

    4. 更新が完了したことをお客さまに伝え、登録内容の確認を促します。'
