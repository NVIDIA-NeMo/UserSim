- id: 37981f34-2b00-5381-9c6b-4b2baefb9599
  title: スマホ送金：規定・約款
  body: 'スマホ送金サービスの利用にあたっては、以下の規定が適用されます。


    **1. 利用限度額**

    本サービスでの送金は、1回あたり100,000円、1か月あたりの合計500,000円を上限とします。これらの限度額はセキュリティ維持のため設定されており、原則として変更はできません。


    **2. 手数料**

    本サービスによる送金手数料は、すべて0円とします。


    **3. 送金完了の定義**

    受取人が当行の口座を保有し、正しく認証された時点で送金手続きが完了します。誤送信による資金回収は、受取人の同意が得られない限り困難であるため、送金前に必ず電話番号を確認してください。


    **4. サービスの停止**

    不正利用の疑いがある場合や、法令遵守のため取引時確認が必要と判断された場合、当行は事前の通知なく本サービスの利用を停止できるものとします。'
