  mentions_tools: []
  institution_id: sorairo_bank
- id: c17fa2eb-2f78-5155-99eb-240d78aebbc1
  title: 目的別口座：ログインできない・アクセスできない
  body: '目的別口座の管理画面にアクセスできない、またはアプリにログインできない場合の対処法です。


    **【考えられる原因と確認事項】**

    1. **通信環境の不安定**：Wi-Fiまたはモバイルデータ通信が正常に動作しているかご確認ください。

    2. **認証情報の不一致**：パスワードの入力ミスがないか、または二段階認証の通知が届いているか確認してください。

    3. **機種変更による未登録**：機種変更後に認証の再登録を行っていない場合、セキュリティのためアクセスが制限されます。


    **【解決策】**

    ・認証エラーが続く場合は、パスワードの再設定をお試しください。

    ・機種変更をされた方は、マイナンバーカードを用いた本人確認を行い、認証の再登録手続きをお願いします。


    **【解決しない場合】**

    上記を試しても解決しない場合は、専門オペレーターによるオンライン相談へエスカレーションし、個別に状況を確認させていただきます。'
