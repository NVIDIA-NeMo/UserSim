- id: 8071d408-4988-5e80-a33d-a2cda7c7efbb
  title: 定期預金：手数料と費用
  body: 'Q. 定期預金の開設や解約に手数料はかかりますか？

    A. いいえ、定期預金の開設および満期時の解約に伴う手数料は一切かかりません。デジタル完結のサービスとして、お客様に費用負担なくご利用いただけます。


    Q. 預入金額の下限はありますか？

    A. はい。最低預入金額として1,000円からご利用いただけます。1,000円以上の金額をご用意の上、アプリよりお手続きください。


    Q. 中途解約時に費用が発生することはありますか？

    A. 解約手数料としての費用は発生いたしません。ただし、中途解約となった場合は、当初適用されていた金利ではなく、中途解約利率が適用されるため、受け取れる利息が少なくなります。あらかじめご了承ください。'
