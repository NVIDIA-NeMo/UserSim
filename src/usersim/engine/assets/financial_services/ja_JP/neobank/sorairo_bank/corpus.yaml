- id: 0ffb8f17-4774-5645-9999-e0d67a900fc2
  title: スマホ送金：お手続きが完了しない・保留中のまま
  body: '送金手続きをした後、画面に「保留中」と表示され、完了しない場合の対処法をご案内します。


    **【考えられる原因と確認事項】**

    1.  **通信環境の不安定：** 一時的にネットワークが遮断された可能性があります。通信状況を確認し、アプリを再起動してください。

    2.  **残高不足：** 送金金額および必要額が普通預金口座にあるか確認してください。

    3.  **相手側の未受取：** 送金は完了していても、お相手が受け取り操作を行っていない場合に「保留」に近い状態に見えることがあります。


    **【解決しない場合】**

    上記を確認しても状況が変わらない場合は、弊社にて取引履歴の調査を行います。調査後、結果をアプリ内通知またはメッセージにてお知らせいたします。'
