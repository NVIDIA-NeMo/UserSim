- id: deb6821b-a79e-5aec-abc1-85d2f2691530
  title: 定期預金：最低預入金額について
  body: '【Q】定期預金を始めるために、最低限いくらから預け入れることができますか？


    【A】当行の定期預金の最低預入金額は1,000円です。1,000円以上であれば、どなたでも手軽に資産形成を始めていただけます。


    【Q】1,000円未満の金額で定期預金を作成することはできますか？


    【A】申し訳ございませんが、1,000円未満での開設はできません。少額から柔軟に資金管理を行いたい場合は、「普通預金：商品概要」をご参照の上、普通預金のご利用をご検討ください。'
