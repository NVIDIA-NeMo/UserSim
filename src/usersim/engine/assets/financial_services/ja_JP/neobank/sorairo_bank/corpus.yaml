  institution_id: sorairo_bank
- id: 21b528e9-385d-5ac7-9060-51d38b102451
  title: update_contact_info を使う場面
  body: 'お客様の住所、電話番号、メールアドレスなどの登録連絡先情報を変更する場合に使用します。


    【手続き手順】

    1. 本人確認の実施：お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 変更内容の確認：変更したい項目（例：新住所、新電話番号）を正確に聞き取ります。

    3. 変更の実行：`update_contact_info` を呼び出し、最新の情報に更新します。

    4. 完了案内：変更が完了したことを伝え、アプリ上の登録情報画面で確認いただくよう案内してください。


    【留意事項】

    - 個人情報保護法に基づき、適切に情報を取り扱ってください。また、機種変更に伴う認証の再登録が必要な場合は、「reregister_device」の案内を併せて検討してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
