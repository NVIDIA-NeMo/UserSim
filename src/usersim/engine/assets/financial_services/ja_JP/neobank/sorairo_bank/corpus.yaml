    *   **年会費**: 0円とします。

    *   **利用限度額**: 1日あたりの利用限度額は300,000円です。この限度額はセキュリティ確保のため設定されており、原則として変更できません。

    *   **海外利用手数料**: 外国通貨建てで決済が行われた場合、決済金額に対して2%の手数料を課します。


    **2. お客さまの義務**

    カードの暗証番号を第三者に知られないよう厳重に管理してください。また、機種変更時には速やかに認証の再登録を行う必要があります。


