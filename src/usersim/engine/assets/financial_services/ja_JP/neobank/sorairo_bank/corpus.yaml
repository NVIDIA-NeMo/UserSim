- id: 21d9f5e6-c114-5eca-8ece-488cb976faf5
  title: open_time_deposit を使う場面
  body: 'お客様が普通預金から「定期預金」へ資金を移し、より高い金利での確実な資産形成を希望された際に、本ツールを使用して定期預金口座を開設します。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を呼び出し、原資となる普通預金口座の `account_id` を特定します。

    3. 定期預金に預け入れる「金額」と「預入期間（例：6か月、1年など）」を決定します。

    4. `open_time_deposit` を呼び出し、指定の金額と期間で定期預金を作成します。

    5. 手続き完了を伝え、適用される金利について案内してください。


    最低預入金額などの条件については、「定期預金：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: procedure
