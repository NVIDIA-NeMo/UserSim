  title: 普通預金：規定・約款の変更
  body: '当行は、法令の改正や経済状況の変化に伴い、普通預金の規定および約款を変更することがあります。変更の内容は、アプリ内のお知らせまたは電子メールにて事前にお知らせいたします。


