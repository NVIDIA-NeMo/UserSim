- id: 6749e1c3-24f8-5256-9564-3ab5a2e1d780
  title: 目的別口座：個人情報の取扱い
  body: 'そらいろ銀行は、個人情報保護法および関連法令を遵守し、お客様の個人情報を厳重に管理いたします。本機能における個人情報の取扱いは以下の通りです。


    【利用目的】

    目的別口座の利用にあたり、お客様が設定された「口座名称（目的）」および「入金スケジュール」などの情報は、以下の目的で利用いたします。

    ・目的別口座の管理および資金移動の処理

    ・自動入金指示に基づく適正な振替処理

    ・お客様の利便性向上を目的とした、貯蓄状況の可視化サービスの提供


    【安全管理措置】

    お客様の資産と情報を守るため、当行では厳格なセキュリティ体制を構築しています。目的別口座の作成・変更時には、フルネームと生年月日による本人確認を徹底し、第三者による不正な操作を防止します。また、収集した情報は適切に暗号化され、権限を持つ担当者のみがアクセス可能な環境で管理されます。


    【第三者提供について】

    法令に基づく場合を除き、お客様の同意なく目的別口座に関する情報を第三者に提供することはありません。犯罪収益移転防止法に基づいた取引時確認など、法定の義務がある場合に限り、適切に処理いたします。


    【開示および訂正】

    お客様は、ご自身の個人情報の開示や訂正を請求することが可能です。手続き方法については、当行の個人情報保護方針をご確認ください。


    制度の詳細については、「法令・制度に関するご案内：預金・日常のお取引」をご参照ください。'
