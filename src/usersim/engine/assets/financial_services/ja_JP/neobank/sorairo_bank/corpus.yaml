- id: bc76e3da-a430-5eaf-abd9-952f0c3a9ddb
  title: 目的別口座：登録内容の変更
  body: '目的別口座の名称（目的）や、自動入金の設定金額を変更する手順をご説明します。


    【お手続き前に】

    お手元にスマートフォンアプリをご用意ください。本手続きはアプリ内で完結します。


    【手順】

    1. 本人確認

    オペレーターによるサポートを受ける場合は、まずお客様のフルネームと生年月日をお伝えください。ご本人様確認が完了後、手続きに移ります。


    2. 対象口座の選択

    アプリの口座一覧から、変更したい「目的別口座」を選択します。


    3. 変更項目の選択

    「設定変更」メニューより、変更したい項目（口座名称、または自動入金金額）を選択してください。


    4. 内容の変更

    ・名称変更の場合：新しい目的（例：「旅行」→「海外旅行」）を入力します。

    ・自動入金金額の変更の場合：新しい金額を入力します。この際、最低金額の1,000円以上で設定してください。


    5. 確定と確認

    「変更を確定する」ボタンを押し、画面に表示される変更内容を確認します。完了後、「設定が完了しました」というメッセージが表示されます。


    【完了の確認】

    口座一覧画面に戻り、名称が新しくなっていること、または設定金額が更新されていることをご確認ください。これで手続きは完了です。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c17fa2eb-2f78-5155-99eb-240d78aebbc1
  title: 目的別口座：ログインできない・アクセスできない
  body: '目的別口座が利用できない、またはアプリにログインできない場合の対処法をご案内します。


    【想定される症状】

    ・アプリにログインしようとするとエラーが表示される

    ・ログインはできるが、作成した目的別口座が表示されない

    ・目的別口座への資金移動ボタンが反応しない


    【確認事項と解決策】

    1. 通信環境の確認

    安定したインターネット接続環境にあるかご確認ください。公共Wi-Fiなどで接続が不安定な場合、正しく表示されないことがあります。


    2. アプリのバージョン確認

    アプリが最新の状態かご確認ください。古いバージョンをご利用の場合、目的別口座などの新機能が正しく動作しないことがあります。ストアから最新版へアップデートをお願いいたします。


    3. アカウントの状態確認

    不適切なログイン試行により、セキュリティロックがかかっていないかご確認ください。ロックされている場合は、再登録の手続きが必要です。


    【解決しない場合のエスカレーション】

    上記を確認しても改善されない場合は、当行にて詳細な調査を行います。オペレーターに状況をお伝えください。当行で以下の対応を実施いたします。

    ・システムログの確認および不具合箇所の特定

    ・必要に応じたアカウントのロック解除処理

    ・専門の技術チームへの調査依頼


    調査結果および復旧の目処については、アプリ内通知またはご登録のメールアドレスへ速やかにご連絡いたします。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
