- id: ab85a3a5-34c4-5ddc-8d63-eea521c22d7d
  title: 定期預金：安全にご利用いただくためのポイント
  body: 'お客さまの大切な資産を守るため、定期預金をご利用いただく際のセキュリティ上の注意点をご案内いたします。


    まず、そらいろ銀行では、いかなる場合においても、お客さまの暗証番号、パスワード、カード番号、CVV、または身分証明書の番号などをメールや電話、チャットでお聞きすることはありません。これらの情報を求める連絡があった場合は、フィッシング詐欺の可能性が高いため、絶対に応答せず、速やかに当行へご連絡ください。


    お手続きの際、当行のオペレーターからご本人確認をお願いすることがございます。その際は、必ず「フルネーム」と「生年月日」のみを確認させていただきます。これ以外の機密情報を求められることはございません。


    また、スマートフォンのアプリを介したお取引の際は、OSの最新アップデートを適用し、二段階認証を有効に設定してください。万が一、身に覚えのない取引通知が届いた場合や、アプリへの不正アクセスの疑いがある場合は、直ちにご報告をお願いいたします。迅速な対応により、被害の拡大を最小限に抑えます。


    当行は金融庁の監督を受け、預金保険制度により元本1,000万円まで（利息を含みます）保護される安全な環境を提供しておりますので、安心してお使いください。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 11d06639-a25f-5072-ab6a-896938aa303f
  title: 定期預金：規定・約款の変更
  body: '本規定は、そらいろ銀行が提供する「定期預金」の利用条件を定めるものです。他行のサービスと比較検討される際は、以下の変更手続きおよび遵守事項をご確認ください。


    【規定・約款の変更について】

    当行は、法令の改定やサービス向上、運営上の必要に応じて、本規定を変更することがあります。変更を行う場合は、適用日の一定期間前までに、アプリ内通知または電子メールにてお客さまに告知いたします。告知後、当該規定に基づいた取引を行った時点で、変更に同意したものとみなされます。


    【預金者の義務と権利】

    お客さまは、犯罪収益移転防止法に基づいた厳格な本人確認にご協力いただく義務があります。また、預金保険制度に基づき、元本1,000万円まで（利息を含みます）が保護されます。外貨預金は本制度の対象外となりますのでご注意ください。


    【契約の終了】

    定期預金契約は、満期日の到来、またはお客さまによる中途解約の手続きによって終了します。中途解約の場合、適用金利が当初の契約（6か月もの0.7%または1年もの0.9%）から変更され、中途解約利率が適用されます。


    【最低預入金額の遵守】

    本商品の開設には、最低預入金額1,000円以上の資金が必要です。この基準を満たさない場合、口座開設のお手続きを完了することができません。'
