- id: 3825cae9-ebfc-59dd-bf00-3bf4e80320b0
  title: スマホ送金：ご利用開始までの手順
  body: '「スマホ送金」をご利用いただくまでの流れをご案内します。オペレーターの方は、お客様が迷わず手続きできるようサポートしてください。


    1. **口座開設の完了**: マイナンバーカードのICチップ読み取りによるオンライン本人確認を完了し、「普通預金：商品概要」にある口座を保有している必要があります。

    2. **電話番号の紐付け**: アプリ設定画面から、現在利用しているスマートフォンの電話番号を口座に登録します。この際、SMSによる認証が行われます。

    3. **相手の登録**: 送金したい相手の電話番号をアプリに入力します。

    4. **送金実行**: 金額を入力し、二段階認証を経て送金を完了します。


    **【サービスのポイント】**

    ・手数料：0円

    ・1回あたりの限度額：100,000円

    ・1か月の合計限度額：500,000円'
