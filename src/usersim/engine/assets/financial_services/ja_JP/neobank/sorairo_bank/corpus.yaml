  institution_id: sorairo_bank
- id: 2d429da1-e5d8-500b-b8ae-45811bb5c349
  title: そらいろVisaデビット：この商品をかたる詐欺にご注意ください
  body: '最近、そらいろVisaデビットをかたる不審なメールやSMS（ショートメッセージ）が確認されています。「カードの利用制限がかけられました」「重要なお知らせがあります」といった内容で、偽のウェブサイトへ誘導し、個人情報を盗み出そうとするフィッシング詐欺にご注意ください。


    そらいろ銀行では、メールやSMSで、暗証番号、パスワード、カード番号、CVV（セキュリティコード）、身分証番号などを聞き出すことは一切ございません。このような情報を求めるメッセージを受け取った場合は、記載されたリンクを絶対にクリックせず、速やかに削除してください。


    もし、不審なサイトで情報を入力してしまった場合や、身に覚えのない取引があることに気づいた場合は、直ちにカードの利用停止手続きを行ってください。不正利用の被害については、銀行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となります。迅速な届出が被害を最小限に抑えることにつながりますので、早急にご連絡をお願いいたします。'
