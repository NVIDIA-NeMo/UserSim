- id: 14a559af-88e9-51ad-bdd6-5e9f7a79cf7b
  title: スマホ送金：重要事項のご説明
  body: '【サービスの適正利用について】

    スマホ送金は、犯罪収益移転防止法および個人情報保護法を遵守して提供されます。なりすましや不正送金などの不正利用が疑われる場合、事前の通知なくサービスの利用を制限させていただくことがございます。


    【送金リスクと責任】

    ・電話番号による指定のため、番号の入力間違いによる誤送金のリスクがあります。送金確定前に必ず相手先をご確認ください。誤送金が発生した場合、弊社は預金者保護法および銀行規定に基づき公正な調査を行いますが、原則としてお客様の責任において相手方と協議し、返金を求めることとなります。


    【限度額の遵守】

    本サービスでは、セキュリティおよびリスク管理の観点から、1回あたりの送金上限額を100,000円、1か月あたりの送金上限額を500,000円と厳格に定めております。これらの制限は、不正送金被害を最小限に抑えるための措置です。


    【免責事項】

    システムメンテナンス等により、一時的にサービスが停止する場合がございます。あらかじめご了承ください。'
