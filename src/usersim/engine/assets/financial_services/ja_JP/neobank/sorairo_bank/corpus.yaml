  body: 'お客さまがそらいろVisaデビットのご利用を開始するまでの手順を案内します。


    1. **本人確認（KYC）**: マイナンバーカードのICチップ読み取りによるオンライン本人確認を完了していただきます。

    2. **カード発行申請**: アプリ内のメニューから「そらいろVisaデビット」を申請します。

    3. **カードの受取**: ご登録住所へカードが郵送されます。

    4. **利用開始設定**: アプリでカードの有効化を行い、1日あたりの利用限度額（初期設定300,000円）を確認していただきます。

    5. **利用開始**: Visa加盟店にてお買い物をされると、0.8%のキャッシュバックが適用されます。


    なお、年会費は0円であるため、維持コストはかかりません。不備がある場合は「そらいろVisaデビット：必要書類」をご案内ください。'
