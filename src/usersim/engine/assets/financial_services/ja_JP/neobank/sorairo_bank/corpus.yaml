- id: 63382f92-6d4d-5154-9df6-cd43209d8816
  title: よくあるご質問
  body: '【Q. 店舗に行かなくてもすべてのお手続きができますか？】

    はい。そらいろ銀行は店舗を持たないインターネット専業銀行です。口座開設から日常の振込、設定変更まで、すべてスマートフォンアプリで完結いたします。


    【Q. アプリで解決できない複雑な相談がある場合はどうすればよいですか？】

    アプリ内のサポートチャネルを通じてお問い合わせください。専門のオペレーターが対応し、必要に応じて詳細な調査や手続きをサポートいたします。


    【Q. お問い合わせの際に本人確認は必要ですか？】

    はい。口座情報の照会や変更を伴うお手続きの際は、セキュリティ保護のため、必ずフルネームと生年月日の確認を行わせていただきます。'
  domain: retail_banking
  product_category: general
