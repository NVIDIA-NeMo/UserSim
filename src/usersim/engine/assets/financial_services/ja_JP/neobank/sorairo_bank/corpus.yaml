- id: 6f14c3e8-8385-5ede-8f65-67bd5958b551
  title: スマホ送金：プランの選び方
  body: '送金方法に迷われている方へ、「スマホ送金」と「通常の振込」を比較します。


    ・**スマホ送金**: 手数料0円、電話番号だけで完結するため、友人や家族との少額のやり取りに最適です（1回100,000円まで）。

    ・**通常の振込**: 口座番号を指定して送金します。高額な送金や、ビジネス利用など、より確実な指定が必要な場合に適しています。


    日常的なやり取りであれば、コストがかからず簡単な「スマホ送金」がおすすめです。'
