- id: 51a09113-99d4-58ff-9920-0ae91978fb80
  title: スマホ送金：おすすめの方と主な使い方
  body: 'スマホ送金は、相手の口座番号を知らなくても、電話番号だけで簡単にお金を送れるサービスです。


    **【こんな方におすすめ】**

    ・友人や家族との割り勘を、手間なくスムーズに済ませたい方

    ・口座番号を教え合う手間や、入力ミスによる誤送金のリスクを減らしたい方

    ・少額の送金を頻繁に行うため、手数料を一切かけたくない方


    **【主な使い方】**

    アプリの連絡先から送金したい相手を選び、金額を入力して送信するだけで完了します。送金手数料は0円ですので、日常的なやり取りに最適です。


    **【ご利用上の制限】**

    ・1回あたりの送金上限額：100,000円

    ・1か月の送金合計限度額：500,000円


    詳細は「スマホ送金：商品概要」をご確認ください。'
