- id: 773bf73a-926a-5b11-a7f3-c14fa26c45f4
  title: 定期預金：状況・履歴の確認
  body: '定期預金の現在の残高や、これまでの利息付与などの履歴を確認する手順をご案内します。


    【準備するもの】

    ・そらいろ銀行公式アプリがインストールされたスマートフォン


    【確認の手順】

    1. オペレーターにフルネームと生年月日を伝え、本人確認を完了させてください。

    2. アプリのホーム画面から「定期預金」のメニューを選択します。

    3. 現在保有している定期預金の一覧が表示されます。詳細を確認したい口座をタップしてください。

    4. 画面上で「預入金額」「適用金利（0.7% または 0.9%）」「満期日」を確認できます。

    5. さらに下部の「履歴」タブを選択すると、過去の預入記録や利息の支払い履歴を時系列でご確認いただけます。


    【完了の確認】

    最新の残高および利息の反映状況が画面に表示されていれば、正しく状況を確認できています。もし表示内容に疑問がある場合は、そのままオペレーターへお問い合わせください。'
