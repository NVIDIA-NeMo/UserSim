- id: 99c0bca4-ce35-5d13-a56f-f5ad82991c71
  title: 普通預金：リスクについてのご説明
  body: '普通預金のご利用にあたり、以下のリスクと保護制度についてご理解ください。


    **【預金保険制度について】**

    当行は預金保険制度の対象となっております。万が一、当行が破綻した場合であっても、預金保険機構により、利息のつく預金は1金融機関につき預金者1人当たり**元本1,000万円までとその利息等**が保護されます。これにより、お客さまの資産の安心感を担保しています。


    **【金利変動のリスク】**

    普通預金に適用される0.45%の金利は、市場金利の変動や当行の判断により変更される場合があります。金利が低下した場合、期待していた利息収入が得られない可能性があります。


    **【利便性とセキュリティ】**

    スマートフォンアプリで完結する利便性を提供しておりますが、端末の紛失やパスワードの漏洩による不正利用のリスクが伴います。二段階認証を正しく設定し、安全にご利用ください。'
