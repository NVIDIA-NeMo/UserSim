- id: 31c25484-5a47-554b-b918-611f9789983b
  title: 定期預金：限度額・制限と注意事項
  body: '定期預金をご利用いただく際の制限および重要な注意事項は以下の通りです。


    **ご利用制限**

    ・最低預入金額：1,000円からお申し込みいただけます。1,000円未満の金額では口座を開設することができません。


    **預金保護について**

    ・本商品は預金保険制度の対象です。当行が破綻した場合でも、預金保険機構により、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されますので、安心してご利用ください。


    **注意事項**

    ・原則として満期まで資金を預ける商品です。中途解約をされる場合は、適用金利が変更となることがございます。

    ・口座開設時には、マイナンバーカードによるオンライン本人確認を必須としております。'
