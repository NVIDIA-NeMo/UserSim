- id: 1d0b6d80-efe9-5343-bf69-6db1c93296f0
  title: 普通預金：解約・変更・プランの切替え
  body: '普通預金口座の解約や、登録内容の変更、プランの切替え手続きは、以下の手順で承ります。


    【お手続きの流れ】

    1. 本人確認

    オペレーターにフルネームと生年月日をお伝えください。ご本人確認が完了した後に手続きを開始いたします。


    2. ご希望内容の提示

    「口座を解約したい」「登録情報を変更したい」「プランを切り替えたい」など、具体的なご要望をお伝えください。


    3. 内容の確認と承認

    オペレーターが変更後の内容や、解約に伴う残高の精算方法（振込先口座など）をご案内します。内容に間違いがないかをご確認ください。


    4. 手続き完了の通知

    手続きが完了すると、アプリへの通知または登録メールアドレス宛に完了通知が届きます。この通知をもって手続き完了となります。


    【ご注意事項】

    ・解約時に残高がある場合は、指定の外部口座へ送金いたします。送金先口座の情報をあらかじめご用意ください。

    ・プラン切替えを適用したい場合は、適用タイミングについてオペレーターがご案内いたします。


    登録内容の変更に関する詳細は「普通預金：登録内容の変更」をご確認ください。'
