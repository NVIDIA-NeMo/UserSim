- id: ffa5429c-11ec-57ce-a42b-06d41508a0fe
  title: 普通預金：商品概要
  body: 'そらいろ銀行の「普通預金」は、スマートフォンひとつで完結する利便性と、業界内で競争力のある高い金利を両立させた、当行のメイン口座です。


    【主な特徴】

    ■ 業界最高水準の金利：年0.45%の金利を提供し、日常的な決済と効率的な資産形成を同時に実現します。

    ■ 手数料の無料枠：月2回まで、他行あて振込手数料および提携ATM出金手数料が無料です。

    ■ 安心の保護制度：預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    【コストについて】

    無料回数を超えたご利用の場合、以下の手数料がかかります。

    ・他行あて振込手数料：145円/回

    ・提携ATM出金手数料：110円/回


    詳細は「普通預金：手数料一覧」をご確認ください。'
