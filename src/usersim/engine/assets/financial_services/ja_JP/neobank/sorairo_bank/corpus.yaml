  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 18faff9d-fe94-50e9-8dd5-307aeab083a0
  title: 定期預金：規定・約款
  body: '本定期預金のご利用にあたっては、以下の規定を適用します。


    **1. 預入条件**

    最低預入金額は1,000円とします。預入金額は1円単位で指定いただけます。


    **2. 適用金利**

    預入期間に応じて、以下の年利率を適用します。

    * 6か月：0.7%

    * 1年：0.9%

    金利は預入時に決定し、満期まで変更されません。


    **3. 解約と返金**

    満期前解約の場合、適用金利が変更されることがあります。解約手続き完了後、元本および利息（税引後）を普通預金口座へ払い戻します。


    **4. 預金保護**

    預金保険制度に基づき、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    規定の変更がある場合は、アプリ内のお知らせにて事前に通知いたします。'
