  body: '本サービスの規定および約款は、法令の改正やサービス向上に伴い変更されることがあります。変更の内容は、アプリ内のお知らせまたは電子メールにて事前に通知いたします。


    **【主な適用条件と制限】**

    ・送金手数料は原則として0円とします。

    ・1回あたりの送金限度額は100,000円、1か月あたりの送金合計限度額は500,000円とします。これらの限度額は、セキュリティ維持のため銀行の判断で変更される場合があります。


    本約款に同意いただけない場合は、サービスの利用を停止し、口座を解約することが可能です。なお、変更後の規定は、通知された適用開始日から有効となります。'
