- id: c117f406-6877-5049-b599-7b712ad92fe1
  title: get_accounts を使う場面
  body: 'お客さまが保有している口座の一覧を確認し、特定の手続き（振込、解約、再発行など）に必要な口座識別子（account_id）を特定する際に使用します。


    **【手続きの流れ】**

    1. 本人確認を完了させ、操作権限があることを確認します。

    2. `get_accounts` を呼び出し、お客さまが保有する口座（普通預金、目的別口座、定期預金など）の一覧を取得します。

    3. お客さまが提示した「口座番号の下4桁」などの情報と、取得した一覧を照合して、対象の account_id を決定します。

    4. 特定した account_id を用いて、次のお手続き（資金移動や設定変更など）へ進みます。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: sorairo_bank
