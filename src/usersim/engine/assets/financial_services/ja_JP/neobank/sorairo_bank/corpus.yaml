- id: 428d7953-3c92-5c26-84b9-8db7015b24d8
  title: 普通預金：当社の似た商品との比較
  body: '日常的な資金管理に最適な「普通預金」と、目的別の貯金に特化した「目的別口座」を比較します。


    ■普通預金

    ・特徴：高い金利（0.45%）で、入出金や振込など日常的な決済の基盤となる口座です。

    ・コスト：他行振込・ATM出金ともに月2回まで無料（超過後はそれぞれ145円、110円）。

    ・向いている方：給与受取や家計管理など、メイン口座として幅広く利用したい方。


    ■目的別口座

    ・特徴：一つの普通預金口座の中で、最大10個まで仮想的に資金を分けて管理できる機能です。

    ・コスト：普通預金の枠内で管理するため、追加の手数料はかかりません。

    ・向いている方：旅行資金や車購入など、目的ごとに貯金額を可視化して計画的に貯めたい方。


    まずは「普通預金」でメイン口座を作成し、その中で「目的別口座」を使い分ける方法が最も効率的です。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ac9e4c15-7d59-5525-9a42-7f08f11eb4b0
  title: 普通預金：重要事項のご説明
  body: '【監督当局および法的遵守】

    そらいろ銀行は銀行法に基づき、金融庁の監督を受けております。また、個人情報の取り扱いは個人情報保護法を遵守し、厳格に管理いたします。


    【預金保険制度について】

    本口座は預金保険制度の対象です。預金保険機構により、利息のつく普通預金は、1金融機関につき預金者1人当たり元本1,000万円までとその破綻日までの利息等が保護されます。なお、決済用預金として条件を満たすものは全額が保護されます。外貨預金は預金保険の対象外となりますのでご注意ください。


    【本人確認について】

    犯罪収益移転防止法に基づき、口座開設時には厳格な本人確認（取引時確認）を実施いたします。また、口座情報の照会や変更手続きの際は、必ずフルネームと生年月日の確認を行います。暗証番号、パスワード、カード番号、CVV、身分証番号などは、当行からお伺いすることは一切ございません。


    【補償について】

    万が一の不正利用や紛失の際は、預金者保護法および当行規定に基づき、公正な調査を行い、速やかな補償手続きを行います。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: disclosure
  source_authority: official
  placeholder: true
