- id: 1fea39d5-8d46-5e37-9fa5-370bd9ceed9c
  title: 定期預金：不正利用からお客さまを守るために
  body: 'そらいろ銀行では、お客さまの大切な資産を守るため、セキュリティの強化に努めております。特に定期預金のようなまとまった資金を管理される商品においては、巧妙なフィッシング詐欺などの被害に十分ご注意ください。


    【ご注意いただきたいポイント】

    当行が、メールやSMS、電話などで、お客さまの暗証番号、パスワード、カード番号、CVV、または身分証番号などを聞き出すことは一切ございません。「口座が凍結されたため確認が必要」や「特別な高金利プランへの切り替え手続き」といった名目で、これらの情報を求める連絡があった場合は、詐欺の可能性が非常に高いと考えられます。


    【万が一、不正利用の疑いがあるときは】

    心当たりのない取引がある場合や、認証情報を教えてしまったと感じられた場合は、ただちに当行へご連絡ください。不正利用や紛失の届出を迅速に受け付け、預金者保護法および銀行規定に基づき、公正な調査と補償手続きを速やかに行います。


    お客さまご自身でアプリのパスワード変更や二段階認証の設定を定期的にご確認いただくことが、最大の防御につながります。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 18faff9d-fe94-50e9-8dd5-307aeab083a0
  title: 定期預金：規定・約款
  body: '本規定は、そらいろ銀行が提供する「定期預金」の利用条件を定めるものです。


    1. 預入条件

    本商品をご利用いただく際は、最低預入金額として1,000円以上の資金が必要です。預入金額がこの基準に満たない場合、口座開設のお手続きは完了いたしません。


    2. 金利の適用と期間

    金利は、預入時に選択された期間（6か月または1年）に応じて適用されます。適用される金利は、6か月ものの場合は0.7%、1年ものの場合は0.9%（いずれも年率）となります。


    3. 満期と自動更新

    満期日の処理については、原則として元金とともに利息を普通預金口座へ払い戻します。お客さまのご指示に基づき、自動更新を設定することも可能です。


    4. 中途解約

    満期日前に解約される場合は、中途解約として取り扱われます。この場合、適用される金利は当初の約定金利ではなく、当行が定める中途解約利率が適用されるため、受取利息が減少することがあります。


    5. 契約の終了

    本契約は、預金の全額払い戻し、または当行による口座解約通知をもって終了します。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 47e2e19a-5f0e-546a-bd58-f9ba47c4769b
  title: 定期預金：おすすめの方と主な使い方
  body: '「定期預金」は、普通預金よりも高い金利設定により、確実な資産形成を目指すための預金商品です。デジタル完結の操作性で、効率的に資金を運用したい方に最適です。


    【おすすめの方】

    ・近い将来に使う予定のない余裕資金を、安全に増やしたい方

    ・目的を持って計画的に貯金をしたい方

    ・普通預金だけでは金利に満足できず、より高い利回りを求める方


    【商品概要と適用金利】

    ご希望の期間に合わせて、以下の金利を適用いたします。

    ・6か月もの：金利 0.7%

    ・1年もの：金利 0.9%

    ※金利はすべて年率で表示しています。


    【ご利用条件】

    ・最低預入金額：1,000円から


    【主な使い方】

    スマートフォンアプリから、預入金額と期間（6か月または1年）を選択するだけで、数分で手続きが完了します。満期まで資金を固定することで、計画的な資産形成をサポートします。日常的な資金管理については、あわせて「普通預金：商品概要」もご参照ください。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: a2544597-9bcc-5306-9040-a5d714d3ee29
  title: 定期預金：1年ものの金利について
  body: '【Q】1年ものの定期預金を利用した場合、金利はどのくらいになりますか？

    【A】1年ものの金利は0.9%（年率）です。普通預金よりも高い金利設定となっており、1年間の預け入れによって効率的に利息を得ることができます。


    【Q】1年ものの金利は、預入金額によって変動しますか？

    【A】いいえ。最低預入金額の1,000円以上であれば、預入金額に関わらず一律で0.9%（年率）の金利が適用されます。


    金利の詳細な適用ルールについては、「定期預金：金利・料率の決まり方と適用」をご確認ください。'
