- id: 205cdbe2-5c25-520d-8506-e9b3b0f2e05a
  title: 目的別口座：作成できる目的別口座の数について
  body: '【Q】目的別口座は最大でいくつまで作成できますか？


    A：一つの普通預金口座につき、最大10個まで作成いただけます。目的や目標に合わせて自由にご活用ください。


    【Q】すでに10個作成していますが、さらに増やしたい場合はどうすればよいですか？


    A：作成上限の10個に達している場合は、新しく作成することができません。不要になった目的別口座を一度解約（削除）していただくことで、再度新しい口座を作成いただけます。


    本機能の概要については「目的別口座：商品概要」をご参照ください。'
