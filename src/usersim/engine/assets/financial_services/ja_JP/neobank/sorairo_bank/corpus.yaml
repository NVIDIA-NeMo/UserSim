  body: '【Q】スマホ送金を利用する場合、いくらの手数料がかかりますか？

    【A】スマホ送金の送金手数料は0円です。回数に関わらず、どなたでも無料でご利用いただけます。


    【Q】無料回数の上限などはありますか？

