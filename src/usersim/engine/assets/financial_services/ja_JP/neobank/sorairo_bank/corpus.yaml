- id: 614a55f7-544a-5c35-9f27-b9548eb52e55
  title: 定期預金：ご利用開始までの手順
  body: '本資料は、サポートエージェントがお客様をガイドするための手順書です。お客さまが「定期預金」のご利用を開始するまでのフローを正確に案内してください。


    1. 本人確認の実施

    まず、お客さまのフルネームと生年月日を確認し、ご本人様であることを照合します。


    2. 資金の準備（普通預金からの振替）

    定期預金への預入資金が、当行の普通預金口座（sorairo_futsu）にあることを確認します。最低預入金額である1,000円以上の残高が必要です。


    3. 預入期間の選択案内

    お客さまの資産形成計画に合わせて、以下の金利プランを提示してください。

    - 6か月もの：金利 0.7%

    - 1年もの：金利 0.9%


    4. 預入金額の決定

    1,000円以上の任意の金額を決定していただきます。


    5. 開設手続きの完了

    アプリ上で上記条件（期間・金額）を選択し、確定操作を行っていただきます。手続き完了後、アプリの口座一覧に「定期預金」が表示されることを確認して案内を終了します。


    【注意点】

    - 個別の投資助言や税務判断は行わず、仕組みの案内にとどめてください。具体的な判断が必要な場合は、税理士などの専門家への相談を案内してください。

    - 預金保険制度により、元本1,000万円まで保護される旨を必要に応じて伝えてください。'
