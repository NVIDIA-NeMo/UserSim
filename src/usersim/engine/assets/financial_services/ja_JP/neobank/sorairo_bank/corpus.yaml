  mentions_tools: []
  institution_id: sorairo_bank
- id: 07afcab1-466f-54d3-bb17-df3188a354cc
  title: 目的別口座：お申込みいただける方
  body: '目的別口座をご利用いただける条件は以下の通りです。


    | 条件項目 | 内容 | 判定 |

    | :--- | :--- | :--- |

    | 口座保有状況 | そらいろ銀行の普通預金口座を開設済みであること | 必須 |

    | 本人確認 | 犯罪収益移転防止法に基づく本人確認が完了していること | 必須 |

    | 居住地 | 日本国内に居住していること | 必須 |

    | 作成数 | 現在の目的別口座数が10個未満であること | 必須 |


    上記条件をすべて満たしているお客様は、アプリからいつでも目的別口座を作成いただけます。'
