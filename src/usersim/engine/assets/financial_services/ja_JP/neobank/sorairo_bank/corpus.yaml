  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 8eb0230b-ea32-5195-b17a-a62acb0b6e14
  title: 目的別口座：お取引が拒否された・制限された
  body: '「目的別口座から資金を戻そうとしたがエラーになる」「口座が作成できない」といった場合の確認事項です。


    **【考えられる原因と解決策】**

    *   **残高不足**：移動させようとしている金額が、その目的別口座の残高を超えていないかご確認ください。

    *   **作成上限への到達**：すでに10個の目的別口座を作成している場合、新しい口座は作成できません。不要な口座を解約してから再度お試しください。

    *   **二段階認証の不一致**：金額の移動時に認証エラーが出る場合は、最新の認証デバイスで操作しているかご確認ください。


    **【解決しない場合】**

    上記を確認しても解消されない場合は、当行にてアカウントの状態を確認いたします。詳細なエラーメッセージを添えてチャットにてお知らせください。専門オペレーターが調査し、制限の解除手続きを行います。'
