  institution_id: sorairo_bank
- id: b2c6dfb6-65e6-54bf-8aa1-07f89184263c
  title: 目的別口座：解約・変更・プランの切替え
  body: '目的別口座の名称変更、資金の移動、および口座の削除（解約）の手順をご案内します。すべてアプリ内で完結いたします。


    【目的別口座の名称を変更する場合】

    1. アプリの口座一覧から、名称を変更したい目的別口座を選択します。

    2. 設定メニューから「名称変更」を選択し、新しい目的（例：「旅行資金」→「海外旅行資金」）を入力します。

    3. 「保存」をタップすると、即座に名称が変更されます。


    【目的別口座から資金を移動させる場合】

    1. 移動させたい目的別口座を選択し、「振替」ボタンをタップします。

    2. 振替先として「普通預金（メイン）」を選択し、移動させる金額を入力します。

    3. 確認画面で内容を確認し、確定操作を行います。これにより、目的別口座からメイン口座へ資金が移動します。


    【目的別口座を削除（解約）する場合】

    1. 削除したい目的別口座の残高を確認します。残高がある場合は、まず上記の手順で資金をすべて普通預金（メイン）へ移動させ、残高を0円にしてください。

    2. 残高が0円になった状態で、設定メニューから「口座を削除する」を選択します。

    3. 最終確認画面で「削除」を確定させると、目的別口座が消去されます。


    なお、削除した目的別口座の枠は空きとなり、改めて最大10まで作成することが可能です。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: cb60aeb8-be57-513b-9e5f-8b17594e5ffe
  title: 目的別口座：想定外の手数料・金額
  body: '目的別口座の利用において、残高や自動入金額に想定と異なる点がある場合の確認事項です。オペレーターの方は、以下の手順でお客さまの状況を確認してください。


    【症状：自動入金の設定ができない、またはエラーになる】

    ・原因：設定しようとしている金額が、自動入金の最低金額である1,000円を下回っている可能性があります。

    ・確認事項：お客さまが入力した金額を確認してください。1,000円未満（例：500円）である場合は、最低金額の制限により設定できない旨をご案内ください。

    ・解決策：金額を1,000円以上に変更して再度設定いただくよう案内します。


    【症状：普通預金の残高が予想より少ない】

    ・原因：目的別口座への自動入金や手動振替が行われたため、メイン口座の残高が減少している可能性があります。

    ・確認事項：アプリの取引履歴から、目的別口座への「振替」記録がないか確認してください。

    ・解決策：目的別口座の残高を合算して、総資産に相違がないかをお客さまと一緒に確認します。


    【症状：目的別口座を削除したいが、ボタンが押せない】

    ・原因：目的別口座の中に残高が残っているためです。

    ・確認事項：当該目的別口座の残高が0円であるかを確認してください。

    ・解決策：まず資金を普通預金（メイン）へ全額移動させる操作を案内し、その後削除手続きを完了していただきます。


    上記で解決しない場合は、内部ログを確認するため、専門のオペレーターへエスカレーションしてください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: cd26ad92-40f6-5b92-8f1a-1e3012d77fe0
  title: 目的別口座：必要書類
  body: '「目的別口座」は、そらいろ銀行の普通預金口座をお持ちのお客さまがご利用いただける機能です。別途、目的別口座のみでのお申し込み手続きや追加書類の提出は必要ありません。


    【ご利用までの条件と必要書類】

    ・普通預金口座の開設：完了していること

    ・本人確認書類：口座開設時に提出済みのマイナンバーカード（ICチップ読み取りによるオンライン本人確認）


    普通預金口座をお持ちであれば、アプリ内ですぐに目的別口座を作成いただけます。口座開設がお済みでない方は、まず「普通預金：お申込みとご利用開始」の手順に従って口座開設をお願いいたします。'
