- id: 9dad8365-59da-5c94-80c9-46c35745753c
  title: 定期預金：商品概要
  body: 'そらいろ銀行の「定期預金」は、普通預金よりも高い金利設定により、確実な資産形成を目指す方向けの預金商品です。一定期間、資金を預けることで、効率的に資産を増やすことができます。


    【商品の特長】

    ・高い金利：預入期間に応じて、競争力のある金利を提供します。6か月ものは0.7%、1年ものは0.9%の金利が適用されます。

    ・少額から開始可能：最低預入金額は1,000円からとなっており、どなたでも無理なく資産形成を始められます。

    ・安心の保護制度：預金保険制度により、元本1,000万円まで（利息を含む）が保護されるため、安全な環境で資金を管理いただけます。


    【適用金利と条件】

    ・6か月もの金利：0.7%

    ・1年もの金利：0.9%

    ・最低預入金額：1,000円


    本商品は、日々の支払いに利用する「普通預金：商品概要」とは異なり、まとまった資金を一定期間運用したい場合に最適です。アプリから簡単にお手続きいただけます。'
