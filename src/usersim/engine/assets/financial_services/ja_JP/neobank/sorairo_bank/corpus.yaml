- id: dcee7548-adb7-5e17-97ee-97c209caa611
  title: そらいろVisaデビット：ご利用開始までの手順
  body: '（オペレーター向け案内ガイド）


    お客様がそらいろVisaデビットをスムーズに利用開始できるよう、以下の手順に従って案内してください。本商品は年会費0円、キャッシュバック率0.8%という高い競争力を持つVisaデビットカードです。


    ■利用開始までのステップ

    1. アプリからの申し込み

    お客様にアプリ内の「カード発行」メニューから申し込み手続きを行うよう案内します。この際、普通預金口座（そらいろ普通預金）の保有が必須である旨を伝えてください。


    2. 本人確認（eKYC）

    マイナンバーカードのICチップ読み取りによるオンライン本人確認を案内します。犯罪収益移転防止法に基づき、厳格な確認が必要であることを説明してください。


    3. カードの発送と受取

    審査完了後、カードが登録住所に郵送されます。お届けまでにお時間をいただく場合があることをお伝えください。


    4. 利用開始設定

    カード到着後、アプリで「利用開始」の手続きを行うことで、即座に決済が可能になります。初期設定の1日あたりの利用限度額は300,000円であることを伝え、必要に応じてアプリから変更可能であることを案内してください。


    ■重要確認事項

    ・海外利用時には2%の事務手数料が発生することを事前にお伝えください。

    ・カード紛失時の迅速な届け出が、預金者保護法に基づく補償の鍵となることを強調してください。'
