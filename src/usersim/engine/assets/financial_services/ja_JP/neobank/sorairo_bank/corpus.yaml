- id: 88156454-4fa0-5856-af8c-1399341c0dc1
  title: そらいろVisaデビット：想定外の手数料・金額
  body: '**【症状】**

    「海外での利用後、明細を確認すると想定より高い金額が引き落とされている」


    **【考えられる原因】**

    海外でのご利用には、外貨決済に伴う事務手数料が発生します。そらいろVisaデビットでは、決済金額に対して2%の手数料を課しております。


    **【確認手順】**

    1.  利用明細の「利用通貨」を確認し、日本円以外での決済であるかを確認してください。

    2.  決済額に2%の手数料が加算されていないか計算してください。


    **【解決策】**

    上記の手数料によるものである場合は、正常な動作となります。


    **【エスカレーション】**

    もし2%の手数料を差し引いても金額が不自然である場合や、心当たりのない利用である場合は、直ちにカードの利用停止を行い、不正利用の調査を依頼してください。当行にて迅速に調査を実施します。'
