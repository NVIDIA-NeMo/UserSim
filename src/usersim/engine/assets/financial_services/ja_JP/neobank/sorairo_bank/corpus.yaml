  title: 目的別口座：当社の似た商品との比較
  body: '目的別口座と定期預金を比較します。


    ・目的別口座：金利0.45%。いつでも自由に出し入れが可能で、最大10個まで目的別に分けられます。柔軟に貯金したい方に最適です。

    ・定期預金：最大0.9%の金利。期間中の原則解約不可という制約がありますが、より高い金利で確実に資産を形成したい方に適しています。


    利便性を優先される方は目的別口座を、「定期預金：商品概要」で詳細を確認し、確実な運用を優先される方は定期預金をお選びください。'
