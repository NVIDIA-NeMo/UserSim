  mentions_tools: []
  institution_id: sorairo_bank
- id: 2d2efe71-06c7-5f9f-8636-33ce8bb71909
  title: 目的別口座：おすすめの方と主な使い方
  body: '「目的別口座」は、1つの普通預金口座の中で、貯金箱のように資金を分けて管理できる便利な機能です。口座をいくつも作る手間なく、直感的に資産形成をサポートします。


    【こんな方におすすめです】

    ・「旅行代」「車検費用」「趣味の資金」など、目的別に予算を分けて貯金したい方

    ・家計管理をシンプルに行いたいが、用途ごとの残高を明確に把握したい方

    ・普通預金の高い金利を維持しつつ、計画的に貯金をしたい方


    【主な活用方法】

    ・目的別の資金管理：最大10まで目的別口座を作成でき、「〇〇年〇月までにとにかく貯める」といった目標設定が可能です。

    ・効率的な資産運用：目的別口座に資金を分けていても、普通預金としての金利0.45%が適用されるため、効率よくお金を増やせます。

    ・自動入金による積立：1,000円からの最低金額で自動入金設定ができ、無理のない計画的な貯金が可能です。


    【ご利用のポイント】

    資金の移動はアプリ内で完結し、いつでも自由に行えます。メインの普通預金口座から目的別口座へ、またはその逆への振替がスムーズに行えるため、急な出費にも柔軟に対応可能です。まずは小さな目標から、あなただけの「貯金箱」を作ってみませんか。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: aa9bc78e-a379-5982-b415-31dbe14440f4
  title: 目的別口座：普通預金の金利について
  body: 'Q：目的別口座に分けて預けているお金に、金利はつきますか？


    A：はい、つきます。目的別口座は、一つの普通預金口座の中で資金を仮想的に分けて管理する機能であるため、目的別口座に預けている資金に対しても、普通預金と同様の金利年0.45%が適用されます。


    Q：目的別口座ごとに異なる金利を設定することはできますか？


    A：いいえ、目的別口座ごとの個別金利設定はできません。すべての目的別口座に、一律で普通預金の金利年0.45%が適用されます。金利の詳細については「目的別口座：金利・料率一覧」をご確認ください。'
