- id: d04317b9-dedf-5d0f-9e84-75015164227b
  title: activate_card を使う場面
  body: 'お客様の手元に「そらいろVisaデビット」カードが届き、アプリを通じて利用開始の手続き（アクティベーション）を行いたい場合に本ツールを使用します。カードが発行されただけでは利用できないため、この操作が必要です。


    **手続き手順**


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を呼び出し、お客様が保有するカードの card_id を特定してください。

    3. 特定した card_id を使用して `activate_card` を実行し、カードを有効化してください。


    アクティベーション完了後、すぐにショッピング等で利用可能になることをご案内ください。また、利用限度額の変更を希望される場合は、「そらいろVisaデビット：1日あたりの利用限度額（初期設定）について」をご案内ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: sorairo_bank
- id: 1dfb06d4-9a72-5285-b65a-703fefc8b869
  title: activate_card ツールリファレンス
  body: '発行済みの「そらいろVisaデビット」カードを利用可能状態（有効化）にします。エージェントはこのツールを呼び出すことで、カードの利用制限を解除します。


    **シグネチャ**

    `activate_card(card_id: string)`


    **引数**

    - `card_id`: 有効化したいデビットカードのID（`get_accounts` で取得）。


    **効果**

    指定されたカードがアクティベートされ、決済に利用できるようになります。この操作を行う前に、必ず `verify_identity` による本人確認を完了させてください。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: sorairo_bank
- id: d8540aa9-171f-5cfd-ac13-9a5db4c3dec9
  title: order_replacement_card を使う場面
  body: 'お客様の「そらいろVisaデビット」カードを紛失、盗難、または破損により再発行する場合に本ツールを使用します。


    再発行の手続きにあたっては、以下の手順を厳守してください。


    1. 本人確認の実施：まず、お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 対象カードの特定：お客様にカード番号の下4桁を確認していただき、`get_accounts` を使用して該当する `card_id` を特定します。

    3. カードの利用停止：紛失や盗難の場合、不正利用を防ぐため、速やかに `freeze_card` を呼び出してカードの利用を停止してください。この際、預金者保護法に基づき、届出日からさかのぼった一定期間の被害が補償対象となる旨を案内します。

    4. 再発行の実行：`order_replacement_card` を呼び出し、新しいカードの発行手続きを行います。


    再発行後のカード利用開始については、アプリ上での操作が必要となるため、その旨をお客様にご案内ください。詳細な手順は「そらいろVisaデビット：ご利用開始までの手順」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: sorairo_bank
- id: 649a35cb-44a9-5a18-804a-3d5684213781
  title: order_replacement_card ツールリファレンス
  body: '指定されたデビットカードの再発行手続きを行います。エージェントはこのツールを直接呼び出すことで、物理カードの再発行を依頼します。


    【引数】

    - `card_id`: `get_accounts` 等で特定した、再発行対象となるカードの識別子。


    【動作】

    - 対象カードの再発行処理を開始し、新しいカードを登録住所へ郵送します。

    - 本ツールを呼び出す前に、必ず `verify_identity` による本人確認が完了している必要があります。'
