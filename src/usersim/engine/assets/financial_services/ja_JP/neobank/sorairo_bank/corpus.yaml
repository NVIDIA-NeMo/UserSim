  body: 【2026年12月末まで】お友達をご紹介いただくと、ご紹介者様とご友人様の両方に特典を差し上げます。そらいろ銀行の普通預金なら、業界最高水準の0.45%という高い金利で効率的に資産を増やせます。さらに、月2回までの振込手数料とATM利用手数料が無料で、日常の決済を賢くサポートします。
