- id: 73987261-a3f2-5d11-a07b-99f777855e81
  title: update_beneficiary を使う場面
  body: 'お客様が、振込先として登録している口座情報の追加、変更、または削除を希望される場合に利用します。あらかじめ登録しておくことで、次回以降の振込手続きをスムーズに行うことが可能です。


    【手続き手順】

    1. 本人確認を完了させます。

    2. 登録振込先の「追加」「変更」「削除」のいずれを希望されるか確認します。

    3. 金融機関名、支店名、口座番号、受取人名などの正確な情報を伺います。

    4. `update_beneficiary` を呼び出して、登録内容の更新処理を実行します。'
