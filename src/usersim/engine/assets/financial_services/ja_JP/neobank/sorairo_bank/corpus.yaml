  title: 目的別口座：重要事項のご説明
  body: '【金利について】

    適用金利は年0.45%ですが、市場金利の変動に伴い、予告なく変更される場合があります。


    【預金保険制度について】

    目的別口座を含む預金は、預金保険制度に基づき、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    【注意事項】

    ・本サービスは資産管理を効率化するためのツールであり、個別の投資判断や税務、法律に関する助言を行うものではありません。

    ・詳細な法令遵守事項については「法令・制度に関するご案内：預金・日常のお取引」をご参照ください。'
