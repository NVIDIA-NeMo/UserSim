- id: 85f36319-66ef-5d23-9dea-db9d88031876
  title: 目的別口座：不正利用からお客さまを守るために
  body: 'そらいろ銀行では、お客さまの大切な資産を守るため、高度なセキュリティ体制を構築しております。特に「目的別口座」を便利にご利用いただく中で、以下の点にご注意ください。


    当行のオペレーターや担当者が、電話やメール、SMSなどで、お客さまの暗証番号、ログインパスワード、カード番号、CVV（セキュリティコード）、または身分証番号を伺うことは一切ございません。これらの情報を求める連絡があった場合は、詐欺の可能性が非常に高いため、絶対に応じないでください。


    口座情報の照会や変更手続きを行う際は、必ず最初にお客さまのフルネームと生年月日の確認をさせていただきます。これは、なりすましによる不正操作を防止するための重要な手続きです。


    万が一、身に覚えのない資金移動や、アプリへの不審なログイン通知に気づかれた場合は、直ちに当行へご連絡ください。不正利用の届出を迅速に受け付け、預金者保護法および当行規定に基づき、公正な調査と補償手続きを速やかに行います。早期の届出が、被害を最小限に抑える鍵となります。


    また、不審なメールのリンクから個人情報を入力させるフィッシング詐欺にご注意ください。当行からのお願いは、原則としてアプリ内の通知または公式な案内を通じて行います。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: security_advisory
  source_authority: official
