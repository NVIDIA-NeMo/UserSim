  title: 目的別口座：実施中のキャンペーン
  body: '【貯金習慣応援キャンペーン実施中！】


    あなたの目標達成をサポートするため、目的別口座の活用キャンペーンを実施いたします。


    ■期間

    2026年4月1日から2026年6月30日まで


    ■キャンペーン内容

    期間中に初めて「目的別口座」を作成し、自動入金設定（最低金額1,000円以上）を完了されたお客様を対象に、貯金応援として500円をプレゼントいたします。


    ■適用条件

    ・期間中に目的別口座を新規作成すること

    ・自動入金機能を有効にし、1,000円以上の金額を設定すること


    ぜひこの機会に、目的別口座で計画的な資産形成を始めてください。詳細は「目的別口座：商品概要」をご覧ください。'
