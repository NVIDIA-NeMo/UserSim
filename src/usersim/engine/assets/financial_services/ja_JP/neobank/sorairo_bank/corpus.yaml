- id: 537de6b1-d2a7-52f5-b52f-3b5e6cb27ebb
  title: 普通預金：不正利用からお客さまを守るために
  body: 'そらいろ銀行では、お客さまの資産を安全に守るため、厳格なセキュリティ体制を構築しています。特に普通預金口座を狙ったフィッシング詐欺や不正アクセスへの対策として、以下の点にご注意ください。


    【当行が絶対に聞き出さない情報】

    当行のオペレーターやメール、アプリ上の通知で、以下の情報を求めることは一切ございません。

    ・暗証番号、パスワード

    ・カード番号、CVV（セキュリティコード）

    ・身分証明書の番号

    これらの情報を求められた場合は、詐欺の可能性が非常に高いため、絶対に応じないでください。


    【万が一の被害に遭われた場合】

    身に覚えのない取引がある、またはキャッシュカードを紛失した場合は、直ちに当行へ届け出てください。預金者保護法および当行の規定に基づき、公正な調査を行い、故意や重大な過失がない限り、迅速に補償手続きを行います。


    【安全にご利用いただくために】

    ・ログイン時や振込時の二段階認証を必ず有効にしてください。

    ・不審なメールのURLを安易にクリックせず、必ず公式アプリからアクセスしてください。


    詳細については「普通預金：重要事項のご説明」も併せてご確認ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: security_advisory
  source_authority: official
