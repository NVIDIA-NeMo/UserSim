- id: 5b47d5be-d9b0-5cca-a4b6-1be012c8888c
  title: 普通預金：無料回数を超えたATM手数料について
  body: '**Q. ATMでの出金手数料が無料になる回数を超えた場合、いくらかかりますか？**


    A. 「普通預金」では、提携ATMでの出金手数料が毎月2回まで無料となります。この無料回数を超えてご利用いただいた場合は、1回につき110円の手数料を申し受けます。


    手数料の詳細については「普通預金：手数料一覧」をご確認ください。'
