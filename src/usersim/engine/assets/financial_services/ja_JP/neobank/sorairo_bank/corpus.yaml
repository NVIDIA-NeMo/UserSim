- id: d04317b9-dedf-5d0f-9e84-75015164227b
  title: activate_card を使う場面
  body: 'お客様の手元に「そらいろVisaデビット」カードが届き、その利用を開始（有効化）したい場合に利用します。カードは発行直後の状態では利用できないため、この手続きが必要です。


    【手続き手順】

    1. 本人確認を完了させます。

    2. `get_accounts` を使用して、カードが紐付いている口座IDを特定します。

    3. カードがお手元に届いていることを確認します。

    4. `activate_card` を呼び出して、デビットカードの利用を開始させます。'
