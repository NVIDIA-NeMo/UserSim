  title: 定期預金：手数料一覧
  body: '定期預金のご利用に関する手数料は以下の通りです。


    ・定期預金口座の開設手数料：無料

    ・定期預金口座の解約手数料：無料


    本商品は、お客様の資産形成を支援するため、口座開設および解約に際しての手数料は一切いただいておりません。なお、中途解約時の適用金利については、銀行規定に基づき変動いたしますのでご注意ください。'
