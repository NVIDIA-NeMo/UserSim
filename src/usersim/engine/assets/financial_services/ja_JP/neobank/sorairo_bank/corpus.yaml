- id: a131d0c3-078b-530a-965a-1ec1a13b0053
  title: 目的別口座：リスクについてのご説明
  body: '「目的別口座」のご利用にあたり、以下のリスクおよび制度上の注意点について改めてご確認をお願いいたします。


    1. 預金保険制度について

    目的別口座に預け入れられた資金を含め、当行の普通預金は預金保険制度の対象となります。万が一当行が破綻した場合であっても、利息のつく普通預金として、1金融機関につき預金者1人当たり元本1,000万円までと、破綻日までの利息等が保護されます。なお、外貨預金などは本制度の対象外となりますのでご注意ください。


    2. 資産運用の性質について

    目的別口座は、資金を整理して管理するための「貯金機能」であり、投資信託や株式などの投資商品ではありません。したがって、元本が変動するリスクはありませんが、価格上昇による大きな利益を得る仕組みでもありません。資産形成におけるリスク許容度に応じた使い分けをお願いいたします。


    3. 法的な独立性の欠如

    目的別口座は、あくまで1つの普通預金口座内での仮想的な区分管理です。法的に独立した別口座ではないため、差押えなどの法的手続きが行われた際は、目的別口座に分けた資金も含め、口座全体の残高が対象となります。


    4. 金利変動リスク

    現在適用されている金利0.45%は固定ではありません。市場金利の変動に伴い、当行の判断で金利を変更する場合があります。金利が低下した場合、期待していた貯金ペースに影響が出る可能性があります。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c531c151-c544-5b95-a76e-e2d39c9e5a62
  title: 目的別口座：金利・料率の決まり方と適用
  body: '目的別口座に適用される金利の決定方法と適用ルールについてご案内します。オペレーターの方は、お客さまへの金利説明時に本基準を用いてください。


    【適用金利】

    目的別口座に預け入れられたすべての資金に対し、一律で年0.45%（税引前）の金利を適用します。個別の目的別口座ごとに異なる金利を設定することはできません。


    【金利の決定方法】

    本金利は、当行の普通預金金利と連動しています。市場金利の動向に基づき、当行が適宜決定します。金利変更時には、アプリ内通知にて速やかにお知らせいたします。


    【適用タイミングと計算】

    ・計算方法：毎日の最終残高に基づき日割り計算されます。

    ・適用範囲：作成した最大10までのすべての目的別口座の合計残高に対して適用されます。


    【注意点】

    金利は年率表記です。実際の受取利息は、ここから税金（所得税・地方税）が差し引かれた金額となります。具体的な利息計算の詳細については、「普通預金：金利・料率一覧」をご参照ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 4d61f89e-13a5-5c26-8320-ac7c8a5fe8b9
  title: 目的別口座：ご紹介・継続利用の特典
  body: 'そらいろ銀行をご利用いただいている皆さまへ、計画的な貯金をサポートする「目的別口座」のご案内です。本機能をご利用いただくことで、一つの口座の中で最大10個まで目的ごとの貯金箱を作ることができ、資金管理がより直感的に行えます。


    さらに、目的別口座に預けていただいた資金にも、普通預金と同じ0.45%という高い金利が適用されます。日々の生活費とは別に、「旅行」や「資格試験」など、あなただけの目標を設定して効率よく資産を増やしませんか。アプリから簡単にご設定いただけますので、ぜひこの機会に継続的な資産形成にお役立てください。'
