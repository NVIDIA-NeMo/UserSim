  body: 'ご登録内容（住所、電話番号、メールアドレスなど）を変更する手順をご案内します。


    1. **変更内容の提示**: 変更したい項目と新しい情報を当社にお伝えください。

    2. **本人確認の再実施**: 機種変更時や重要な情報変更の際は、セキュリティ保護のため、二段階認証による再登録または本人確認書類の提示をお願いする場合があります。

    3. **変更内容の確認**: 当社にて情報の照合を行い、変更を適用します。

    4. **完了通知の受信**: アプリの通知またはメールにて、変更が完了した旨を通知いたします。


    これにより、カードの配送先変更などが正しく反映されます。なお、1日あたりの利用限度額（300,000円）の変更を希望される場合は、別途設定メニューよりお手続きください。'
