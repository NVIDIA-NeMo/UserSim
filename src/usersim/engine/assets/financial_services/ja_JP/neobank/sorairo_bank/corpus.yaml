  body: '【期間限定キャンペーン】

    2026年1月1日から2026年3月31日まで、お友だちをご紹介いただいた方と、ご紹介で「目的別口座」を開設し継続してご利用いただいた方それぞれに、特典として500円をプレゼントいたします。貯蓄の習慣化を応援する特別な機会にぜひご利用ください。'
