  title: 定期預金：お申込みとご利用条件
  body: 'Q：定期預金を始めるのに必要な最低金額はいくらですか？

    A：最低預入金額は1,000円からとなっております。


    Q：申し込みに特別な条件はありますか？

    A：当行の普通預金口座をお持ちの方であれば、どなたでもアプリから簡単にお申し込みいただけます。詳細は「定期預金：お申込みいただける方」をご確認ください。'
