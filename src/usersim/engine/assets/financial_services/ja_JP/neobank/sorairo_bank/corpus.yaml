  title: 普通預金：実施中のキャンペーン
  body: '【高金利提供キャンペーン】

    現在、そらいろ銀行ではデジタルネイティブ層の皆様の資産管理を応援するため、普通預金の金利を年0.45%という競争力のある水準で提供しております。


    特別な条件なく、口座をお持ちのすべてのお客さまにこの高金利を適用いたします。日々の決済口座としてご利用いただきながら、効率的に利息を得ることが可能です。


