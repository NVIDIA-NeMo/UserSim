  institution_id: sorairo_bank
- id: 0577e8d2-3dd9-5a21-9045-2de552863475
  title: スマホ送金：ログインできない・アクセスできない
  body: '「スマホ送金」の画面が開かない、あるいはログインできない場合の対処法をご案内します。


    ■考えられる原因とチェック項目

    1. 通信環境の不安定

    Wi-Fi接続が不安定な場合や、機内モードがオンになっている可能性があります。一度通信を切断し、再接続して改善するかご確認ください。


    2. アプリのバージョンが古い

    最新のアップデートが適用されていない場合、機能にアクセスできないことがあります。アプリストアで最新版があるか確認し、更新してください。


    3. デバイスの認証不整合

    機種変更後などに、以前のデバイスの認証情報が残っている場合があります。この場合は「認証の再登録」が必要です。


    ■解決しない場合の対応

    上記を確認しても解決しない場合は、当行のサポート窓口までお知らせください。以下の対応を行います。


    ・【当行での対応】

    お客様の認証ステータスを確認し、必要に応じて認証情報の初期化を行います。また、システム障害が発生している場合は、復旧の見込み時間を案内いたします。


    ・【完了の目安】

    認証の再設定を行った場合、その場で再度ログインを試行していただき、トップ画面が表示されることで完了となります。'
