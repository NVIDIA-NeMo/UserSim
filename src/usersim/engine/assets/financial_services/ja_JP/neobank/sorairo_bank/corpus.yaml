- id: 6b613f62-5ab2-5446-97d3-0eadd9fede74
  title: そらいろVisaデビット：解約・変更・プランの切替え
  body: 'そらいろVisaデビットの利用限度額の変更、またはカードの解約手続きについてご案内します。


    【利用限度額の変更（初期設定 300,000円から変更する場合）】

    1. オペレーターに利用限度額の変更希望を伝えてください。

    2. ご本人確認のため、フルネームと生年月日を提示してください。

    3. 新しい限度額（300,000円以下の範囲、または規定の上限まで）を伝えてください。

    4. 設定変更が完了した旨の通知をオペレーターから受け取り、完了です。


    【カードの解約（停止）】

    1. オペレーターに「そらいろVisaデビットの解約」を希望する旨を伝えてください。

    2. ご本人確認のため、フルネームと生年月日を提示してください。

    3. 解約に伴う注意事項（未確定の決済がある場合の取り扱い等）について説明を受け、同意してください。

    4. カードの利用停止および解約処理が完了したことを確認し、完了です。


    【ご注意】

    ・暗証番号やパスワード、カード番号、CVVなどの機密情報をオペレーターが聞き出すことはありません。提示を求められた場合は、絶対にお答えにならないでください。

    ・手続き完了後は、速やかにカードを裁断するなどして破棄してください。'
