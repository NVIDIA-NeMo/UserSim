- id: c886cadd-113d-5d51-9673-878c97c43e4c
  title: そらいろVisaデビット：商品概要
  body: 'そらいろVisaデビットは、お支払いの瞬間に、お客様のそらいろ銀行口座から代金が即時に引き落とされる便利なVisaデビットカードです。キャッシュバック特典を備え、家計管理と決済を一本化できるため、効率的な資金管理を求めるデジタルネイティブ層の方に最適です。


    【本商品の特徴と適用条件】

    ■コスト：年会費は0円となっており、どなたでも負担なくご利用いただけます。

    ■還元：ご利用金額に応じて、0.8%のキャッシュバックを提供いたします。日々の支払いがそのままお得になります。

    ■海外利用：海外でのショッピングやサービス利用時には、2%の海外利用時の事務手数料が適用されます。

    ■利用限度額：1日あたりの利用限度額（初期設定）は300,000円です。これにより、安心かつスムーズなお買い物をサポートします。


    本カードは、口座残高の範囲内でしか利用できないため、使いすぎを防ぐことができます。また、アプリを通じて利用停止や限度額の変更が直感的に行えるため、セキュリティ面でも安心です。


    詳細な手数料については、「そらいろVisaデビット：手数料一覧」をご確認ください。'
  domain: cards
  product_category: sorairo_debit
  document_type: product_sheet
  source_authority: official
