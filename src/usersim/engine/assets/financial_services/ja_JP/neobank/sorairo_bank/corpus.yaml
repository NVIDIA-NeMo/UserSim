- id: 7a94fdfd-8800-5aae-902a-6dffb69f1e5d
  title: 法令・制度に関するご案内：預金・日常のお取引
  body: 'そらいろ銀行は、銀行法に基づき金融庁の監督を受ける金融機関です。お客様の資産を安全に保護するため、以下の法令および制度を遵守しています。


    1. 預金保険制度について

    預金保険機構による預金保険制度の対象となっております。利息のつく普通預金や定期預金などの預金は、1金融機関につき預金者1人当たり、元本1,000万円までとその破綻日までの利息等が保護されます。なお、無利息、要求払い、決済サービス提供という3条件を満たす「決済用預金」は全額が保護されます。外貨預金は預金保険の対象外となります。


    2. 本人確認と個人情報保護

    犯罪収益移転防止法に基づき、口座開設などの取引時に厳格な本人確認（取引時確認）を実施します。また、お客様からお預かりした個人情報は、個人情報保護法に従い適切に管理・取り扱います。


    3. 預金者保護法

    偽造または盗難されたキャッシュカードによる不正な払戻しについては、預金者保護法に基づき、預金者に故意または重大な過失がない限り、原則として銀行が補償いたします。ただし、過失の程度により補償額が減額される場合があります。


    4. エージェントの義務

    お客様の口座情報を開示または変更する前に、必ず適切な本人確認手続きを完了させてください。苦情や紛争に関しては、全国銀行協会相談室での受け付けについても案内してください。'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 67b5e16a-2479-5b81-be06-fb67a7f02fc3
  title: 法令・制度に関するご案内：デビットカード
  body: '「そらいろVisaデビット」の運用にあたっては、金融庁の監督および以下の規制・ルールを適用します。エージェントは手数料、利用限度額、補償条件について誤った案内をしないよう徹底してください。


    1. デビットカードの基本原則

    デビットカードは、利用と同時に接続された預金口座から代金が即時に引き落とされる仕組みです。口座残高を超えて利用することはできず、原則として貸付（オーバードラフト）は行われません。


    2. セキュリティと本人認証

    インターネットショッピング等のオンライン利用においては、セキュリティ向上のため、本人認証サービス（EMV 3-Dセキュア）を導入しています。


    3. 紛失・盗難時の対応

    カードの紛失や盗難に気づいた場合、お客様はただちに銀行へ届け出て、カードの利用を停止させる必要があります。迅速な届け出が被害拡大の防止につながります。


    4. 不正利用の補償

    不正利用による被害については、銀行の規定に基づき、届出日からさかのぼった一定期間の利用分が補償の対象となります。なお、キャッシュカードの偽造・盗難による不正払戻しについては、前述の預金者保護法が適用されます。


    エージェントは、お客様から紛失・盗難の報告を受けた際、速やかに利用停止措置を講じ、再発行の手続きを案内してください。'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: e440e8b2-49a9-53b7-9a3a-28bdb1a490c9
  title: get_account_transactions を使う場面
  body: 'お客様から過去の取引履歴（入出金明細）の照会依頼を受けた場合に、このツールを使用して情報を取得します。


    【手順】

    1. 本人確認の実施

    `verify_identity` を呼び出し、お客様のフルネームと生年月日を確認します。必要に応じて、口座番号の下4桁も確認してください。


    2. 口座識別子の特定

    お客様から提示された口座番号（下4桁など）を、具体的な `account_id` に変換するため、`get_accounts` を呼び出して、該当する口座を特定します。


    3. 取引履歴の取得

    特定した `account_id` を引数として `get_account_transactions` を呼び出し、取引明細を取得します。


    4. 情報の提示

    取得した取引内容（日付、金額、相手方など）を、丁寧な「です・ます」調でお客様に伝えます。


    【注意事項】

    - 本人確認が完了する前に、口座の残高や取引履歴を伝えてはいけません。

    - 暗証番号やパスワードなどの機密情報を聞き出すことは、いかなる場合も禁止されています。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: sorairo_bank
- id: 7d146d49-b23c-5027-bb21-eeb1310bb097
  title: get_account_transactions ツールリファレンス
  body: '指定された口座の取引履歴を取得します。


    【シグネチャ】

    `get_account_transactions(account_id: string)`


    【引数】

    - `account_id`: 取引履歴を取得したい口座の識別子。`get_accounts` ツールで取得可能です。


    【効果】

    指定された口座の入出金明細（日付、金額、取引内容、残高など）を返します。


    【備考】

    本ツールはエージェントが直接呼び出して実行します。呼び出し前に `verify_identity` による本人確認が完了している必要があります。'
