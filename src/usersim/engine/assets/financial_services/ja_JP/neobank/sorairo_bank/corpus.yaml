  - file_transaction_dispute
  institution_id: sorairo_bank
- id: fa610e30-34b1-5b14-a5a3-730070b97f59
  title: file_transaction_dispute ツールリファレンス
  body: 'デビットカードの身に覚えのない利用について、調査と補償の申出を受け付けます。


    【シグネチャ】

    `file_transaction_dispute(card_id: string, transaction_id: string, reason: string)`


    【引数】

    - `card_id`: 対象となるデビットカードの識別子。

    - `transaction_id`: 紛争の対象となる特定の取引識別子。

    - `reason`: 不正利用を疑う理由や詳細な状況（お客様からの聴取内容）。


    【効果】

    指定された取引に対する紛争申出をシステムに登録し、調査プロセスを開始します。


    【備考】

    本ツールはエージェントが直接呼び出して実行します。呼び出し前に `verify_identity` による本人確認が完了している必要があります。'
