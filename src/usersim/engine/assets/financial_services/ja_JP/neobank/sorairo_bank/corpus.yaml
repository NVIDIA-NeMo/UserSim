- id: 7214c631-3e1f-5da5-8607-5d8e239a662f
  title: 目的別口座：手数料一覧
  body: '目的別口座のご利用に関する手数料は以下の通りです。


    ・目的別口座の作成手数料：無料

    ・目的別口座の名称変更手数料：無料

    ・目的別口座の解約手数料：無料

    ・普通預金から目的別口座への資金移動手数料：無料

    ・目的別口座から普通預金への資金移動手数料：無料


    目的別口座は、メインの普通預金口座内で仮想的に資金を分ける機能であるため、口座間の移動や管理に手数料はかかりません。日常的な資金管理に安心してお使いください。'
