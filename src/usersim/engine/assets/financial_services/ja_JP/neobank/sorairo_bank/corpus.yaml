- id: afdcf2b6-5bd8-5618-9cfb-c7d2ce5ab541
  title: そらいろVisaデビット：不正利用からお客さまを守るために
  body: 'そらいろVisaデビットを安心してお使いいただくために、セキュリティに関する重要なご案内をいたします。


    当社では、インターネットショッピングにおける安全性を高めるため、本人認証サービス（EMV 3-Dセキュア）を導入しています。これにより、カード番号などの情報が流出した場合でも、不正利用のリスクを大幅に低減することが可能です。


    【当行が絶対に聞き出さない情報】

    安心してお取引いただくため、当行のオペレーターが電話やチャットでお客さまに以下の情報を求めることはございません。不審な連絡があった場合は、絶対に応じないでください。

    ・暗証番号、パスワード

    ・カード番号、CVV（セキュリティコード）

    ・身分証番号


    【万が一、不正利用や紛失・盗難に気づいたときは】

    カードの紛失や盗難、身に覚えのない請求に気づいた際は、直ちにご連絡ください。迅速な届出により、カードの利用を即座に停止し、被害の拡大を防ぎます。不正利用の補償については、当行の規定に基づき、届出日からさかのぼった一定期間の分を対象に公正な調査を行い、補償手続きを速やかに行います。


    また、偽造・盗難キャッシュカードによる不正な払戻しについては、預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。


    詳細なリスクについては、「そらいろVisaデビット：リスクについてのご説明」も併せてご確認ください。'
