- id: a5aea6a2-b259-5f7b-9ed2-ab00b900a80b
  title: 定期預金：お取引が拒否された・制限された
  body: '定期預金の開設や解約、金額変更などの操作ができない場合の対処法です。


    **考えられる原因とチェック事項**

    ・**預入金額の不足**：預け入れ金額が最低金額の1,000円に満たない場合、開設手続きが拒否されます。普通預金残高をご確認ください。

    ・**本人確認の未完了**：マイナンバーカードによる取引時確認が最新の状態でない場合、制限がかかることがあります。

    ・**二段階認証の不一致**：機種変更後などに認証情報の再登録が行われていない場合、セキュリティ保護のため取引が制限されます。


    **解決策**

    ・不足分を普通預金へ入金し、再度1,000円以上の金額で手続きを行ってください。

    ・認証に問題がある場合は、最新のデバイスで再登録の手続きをお願いします。


    解決しない場合は、私たちが詳細なエラーログを調査し、必要に応じて専門チームへエスカレーションいたします。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ec7466b7-9219-52ed-bcb3-1614f8d64c42
  title: 定期預金：切替えや上位プランを検討するとき
  body: '運用期間の変更を検討される際は、金利の違いをご確認ください。


    ・**6か月もの**：金利 0.7%。半年後に資金を利用する予定がある方、または短期間で様子を見たい方に適しています。

    ・**1年もの**：金利 0.9%。より高い利回りを優先し、1年間資金を固定できる方に最適です。


    より高い金利を求める場合は、1年ものへの切り替えがおすすめです。詳細は「定期預金：商品概要」をご参照ください。'
