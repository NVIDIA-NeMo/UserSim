  institution_id: sorairo_bank
- id: fee40b6b-1899-5de1-95e5-b330dc483f6a
  title: 目的別口座：限度額・制限と注意事項
  body: '【目的別口座の制限と仕様】


    目的別口座は、一つの普通預金口座の中で、貯金箱のように仮想的に資金を分けて管理できる機能です。運用にあたっては以下の制限事項および注意事項を遵守してください。


    ■作成可能な口座数

    作成できる目的別口座の数は、最大で10までとなっております。これ以上の口座を作成したい場合は、既存の目的別口座を解約して枠を空ける必要があります。


    ■資金の管理について

    目的別口座に振り分けられた資金であっても、実体は普通預金口座の一部です。そのため、普通預金口座全体の残高が不足している場合は、目的別口座内の金額を移動させてからのお取引となります。


    ■金利の適用

    目的別口座に預け入れた資金には、普通預金の金利である0.45%が適用されます。これは普通預金口座のメイン残高と同様の金利設定です。


    ■預金保険制度の適用

    本機能による管理資金を含め、預金保険制度により、元本1,000万円まで（とその利息）が保護されます。決済用預金としてご利用の場合は全額が保護対象となります。


    詳細な金利については「目的別口座：普通預金の金利について」をご参照ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 7ea05f02-778a-5d34-930f-14e500d0abad
  title: 目的別口座：手数料と費用
  body: 'Q. 目的別口座を作成したり、資金を移動したりする際に手数料はかかりますか？


    A. いいえ、目的別口座の作成、名称変更、および普通預金口座（メイン）と目的別口座の間での資金移動に手数料は一切かかりません。すべて無料でご利用いただけます。


    Q. 自動入金設定を利用する場合に費用は発生しますか？


    A. 自動入金機能の利用に伴う手数料はございません。あらかじめ設定した金額を、無料で自動的に目的別口座へ振り分けることができます。


    なお、目的別口座から他行へ振り込む場合は、普通預金としての振込手数料が適用されます。無料回数などの詳細は「普通預金：手数料一覧」をご確認ください。'
