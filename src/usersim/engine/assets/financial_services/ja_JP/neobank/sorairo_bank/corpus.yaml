- id: 4908d5a3-2db5-5125-8089-49b7a0e4f8e1
  title: そらいろVisaデビット：リスクについてのご説明
  body: 'そらいろVisaデビットをご利用いただく際は、以下のリスクと制限について十分にご理解ください。


    **【即時決済のリスク】**

    本カードはデビット方式のため、決済と同時に口座から資金が引き落とされます。残高が不足している場合は決済が完了しませんのでご注意ください。


    **【利用限度額の制限】**

    セキュリティ上の理由から、1日あたりの利用限度額は300,000円に制限されています。これを超えるお支払いはできません。


    **【海外利用時のコスト】**

    海外で外貨決済を行う場合、決済金額に対して2%の手数料が発生します。為替レートの変動により、日本円での請求額が変動するリスクがあります。


    **【管理責任】**

    カードおよび二段階認証などの認証情報を第三者に知られた場合、不正利用のリスクが高まります。適切に管理をお願いいたします。'
