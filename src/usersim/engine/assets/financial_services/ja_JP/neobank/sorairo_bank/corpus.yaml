- id: 956fedec-9130-5530-b78c-de15d78744cf
  title: スマホ送金：お申込みとご利用開始
  body: 'スマホ送金をご利用いただくための手順をご案内します。本サービスは、そらいろ銀行の口座をお持ちの方であれば、アプリからすぐにご利用を開始いただけます。


    【ご利用開始までのステップ】

    1. 本人確認：オペレーターまたはアプリの案内に沿って、ご自身のフルネームと生年月日をお伝えください。

    2. 送金先の指定：送金したい相手の電話番号を正確に入力します。相手の方がそらいろ銀行のユーザーである必要があります。

    3. 金額の入力：送金金額を入力してください（1回あたりの送金上限額は100,000円です）。

    4. 二段階認証：セキュリティのため、画面の指示に従って二段階認証を行ってください。

    5. 送金完了：「送金が完了しました」というメッセージが表示され、口座残高から指定金額が差し引かれたことを確認して完了です。


    【ご利用前の注意点】

    ・送金前に、相手の電話番号に間違いがないか必ずご確認ください。誤送信による送金は、取り消しが困難な場合がございます。

    ・1か月あたりの送金上限額は500,000円です。上限に達した場合は、翌月までご利用いただけません。'
