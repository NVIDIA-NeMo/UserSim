  body: 'Q. 提携ATMでの出金手数料が無料になる回数を超えると、いくらかかりますか？


    A. そらいろ銀行の普通預金では、提携ATMの出金手数料の無料回数（月、基本）として2回分を提供しております。この無料回数を超えて出金を利用された場合は、1回につき110円の手数料を申し受けます。


