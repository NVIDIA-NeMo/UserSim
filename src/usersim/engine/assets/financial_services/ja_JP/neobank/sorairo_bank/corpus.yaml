- id: 37e281e5-5614-5726-8840-542ed7bf9fbb
  title: 定期預金：登録内容の変更
  body: '定期預金に紐づく登録内容（受取人などの設定）を変更する手順をご案内します。


    **事前準備**

    ・ご本人様確認が完了しているスマートフォンアプリを準備してください。


    **変更手順**

    1. アプリ内の定期預金詳細画面から、「登録内容の変更」を依頼してください。

    2. 変更したい項目（例：満期時の自動更新設定など）を指定し、新しい内容を伝えてください。

    3. 当行にて内容を確認し、変更手続きを行います。

    4. 完了後、アプリの通知またはメールで変更完了のお知らせが届きます。


    **確認ポイント**

    ・変更後、詳細画面に正しい内容が反映されていることをご確認ください。もし不備がある場合は、すぐにお知らせください。'
