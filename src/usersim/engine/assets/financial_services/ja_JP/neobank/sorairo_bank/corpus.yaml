- id: 99bfacc1-db78-54fe-bdd9-575fc1625dca
  title: 普通預金：金利・料率の決まり方と適用
  body: '普通預金に適用される金利の決定方法と適用ルールについてご案内します（サポート担当者向け）。


    **【適用金利】**

    * **年率 0.45%**


    **【金利の適用ルール】**

    * **一律適用**：残高金額にかかわらず、すべての普通預金口座に対して一律で0.45%の金利を適用します。金額に応じた段階的な金利設定（ティア構造）はありません。

    * **計算方法**：預金残高に対し日次で計算され、所定の利払日にまとめて口座へ入金されます。

    * **変動の可能性**：金利は固定ではなく、経済情勢や当行の資金調達状況に応じて改定される場合があります。改定時は、アプリ内通知および公式サイトにて告知します。'
