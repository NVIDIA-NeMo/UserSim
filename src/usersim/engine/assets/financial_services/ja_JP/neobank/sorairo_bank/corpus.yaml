- id: 88156454-4fa0-5856-af8c-1399341c0dc1
  title: そらいろVisaデビット：想定外の手数料・金額
  body: 'お客様から「身に覚えのない手数料が引かれている」「請求金額が想定より高い」とのお問い合わせを受けた際の対応フローです。


    【考えられる原因と確認事項】

    1. 海外での利用（海外事務手数料の発生）

    海外加盟店で利用した場合、利用金額に対して2%の海外利用事務手数料が加算されます。利用明細に海外での決済が含まれていないか、またその金額に2%の手数料が乗っていないかを確認してください。


    2. 利用限度額への到達

    1日あたりの利用限度額（初期設定 300,000円）に達しているため、決済が拒否された、あるいは分割して決済された可能性があります。当日の合計利用額を確認してください。


    3. キャッシュバックの計算相違

    キャッシュバック率は0.8%です。還元額が想定と異なる場合、対象外の取引が含まれていないか、または付与タイミング（翌月）であるかを確認してください。


    【解消しない場合の対応】

    上記を確認しても解決せず、不正利用の疑いがある場合は、速やかにカードの利用停止措置を行います。その後、預金者保護法および当行規定に基づき、公正な調査と補償手続きを案内してください。専門の調査チームへエスカレーションし、お客様へは調査完了までの目安期間を提示します。'
