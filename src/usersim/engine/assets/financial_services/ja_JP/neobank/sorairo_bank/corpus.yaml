- id: 218f9b33-b111-582c-9047-9c9575e5eb47
  title: そらいろVisaデビット：海外利用時の事務手数料について
  body: 'Q：海外の店舗やウェブサイトでそらいろVisaデビットを利用した場合、手数料はかかりますか？


    A：はい。海外加盟店で利用された場合、外貨決済への変換に伴い、2%の海外利用時の事務手数料が発生いたします。この手数料は、利用金額に加算されてお客様の口座から引き落とされます。


    Q：事務手数料はいつ決済されますか？


    A：原則として、利用時のレートおよび2%の手数料を適用した金額が、決済確定時に即時または後日、口座残高から引き落とされます。残高不足の場合は決済ができないため、十分な金額を口座にご用意ください。'
