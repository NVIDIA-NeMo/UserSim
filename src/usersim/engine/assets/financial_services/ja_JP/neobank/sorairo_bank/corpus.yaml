  institution_id: sorairo_bank
- id: 3b477f64-c1ba-5001-834c-0ab83f92cd9c
  title: スマホ送金：1か月あたりの送金上限額について
  body: '【よくあるご質問】


    Q：スマホ送金で1か月に送金できる金額に制限はありますか？


    A：はい。スマホ送金では、1か月あたりの送金上限額を500,000円に設定しております。この金額を超えて送金することはできませんのでご注意ください。


    Q：1回に送金できる金額はいくらまでですか？


    A：1回あたりの送金上限額は100,000円です。500,000円までの月間上限額の範囲内で、1回100,000円までのお取引が可能です。


    Q：上限額を個別に引き上げることはできますか？


    A：恐れ入りますが、スマホ送金の上限額は一律で設定されており、個別の変更は承っておりません。より高額な送金をご希望の場合は、通常の振込機能をご利用ください。詳細は「スマホ送金：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: sumaho_sokin
