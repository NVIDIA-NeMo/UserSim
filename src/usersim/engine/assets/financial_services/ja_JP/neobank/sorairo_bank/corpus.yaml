- id: 4bbc855f-b55f-53f1-affa-0b43b16c5dbb
  title: 定期預金：明細や記録と合わない
  body: '【エージェント向け：明細不一致への対応】


    お客様より「定期預金の利息や残高が、想定していた金額と異なる」というお問い合わせをいただいた際の調査フローです。


    ■確認すべき項目（優先順序）

    1. 適用金利の再確認

    お客様が「6か月もの（0.7%）」か「1年もの（0.9%）」のどちらを契約しているかを確認してください。期間によって金利が異なるため、誤認しているケースが多くあります。


    2. 税引き後の金額であるか

    提示している金利は税引き前です。実際に入金される利息は、所得税および復興特別所得税が差し引かれた後であるため、計算上の金額より少なくなります。


    3. 満期日の確認

    利息は満期時に一括して付与されるプランか、定期的に付与されるプランかを確認してください。満期前である場合、利息はまだ普通預金口座へ反映されません。


    ■対応とエスカレーション

    ・上記を確認しても不一致がある場合は、システム上の記録と照合するため、詳細な取引履歴を抽出します。

    ・計算根拠を明確にした上で、お客様へご説明してください。万が一、当行の計算誤りである可能性が高い場合は、速やかに上席および専門部署へ報告し、修正手続き（不足分の入金等）を案内してください。'
