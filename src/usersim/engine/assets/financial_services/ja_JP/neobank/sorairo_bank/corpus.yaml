  body: '定期預金のご開設に必要な書類は以下の通りです。


    * **本人確認書類**：マイナンバーカード（必須）

    * **確認方法**：スマートフォンアプリによるICチップ読み取り（オンライン本人確認）


    すでにそらいろ銀行の普通預金口座をお持ちの方は、追加の書類提出なしで、アプリ内で完結して定期預金をご開設いただけます。'
