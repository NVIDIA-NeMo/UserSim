- id: 51a09113-99d4-58ff-9920-0ae91978fb80
  title: スマホ送金：おすすめの方と主な使い方
  body: '「スマホ送金」は、相手の口座番号や店番を知らなくても、電話番号だけで手軽に少額の送金ができる利便性に特化したサービスです。


    ■このような方におすすめです

    ・友人や家族との食事代や飲み会費用の「割り勘」をスムーズに済ませたい方

    ・お祝いやプレゼントとして、少額の資金をすぐに送りたい方

    ・口座情報のやり取りをせず、チャット感覚で送金したい方


    ■本サービスの主な特長

    ・送金手数料：0円

    ・1回あたりの送金上限額：100,000円

    ・1か月あたりの送金上限額：500,000円


    ■主な使いかた

    1. アプリの「スマホ送金」メニューを選択します。

    2. 送金先の電話番号を入力し、金額を指定します。

    3. 内容を確認し、認証を行うことで即時に送金が完了します。


    日常的なちょっとした資金移動を、ストレスなく完結させることができます。より大きな金額を管理したい場合は、「普通預金：商品概要」も併せてご確認ください。'
