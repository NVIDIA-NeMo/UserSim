- id: 7208cab9-1eee-57cf-bcf0-5ae67bfffacb
  title: 目的別口座：お手続きが完了しない・保留中のまま
  body: '目的別口座の作成や資金移動の手続き中に、画面が切り替わらなかったり「処理中」のまま保留になったりする場合の対処法をご案内します。


    【よくある原因とチェック項目】

    1. 通信環境の不安定

    アプリが正しく動作せず、手続きが保留されることがあります。Wi-Fiのオン・オフを切り替えるか、安定した通信環境で再度お試しください。


    2. 普通預金残高の不足

    目的別口座への初回入金額や、自動入金設定額が普通預金の有効残高を超えている場合、エラーとなり手続きが完了しません。残高が十分にあるかご確認ください。特に自動入金を設定される際は、最低金額の1,000円以上が残高にある必要があります。


    3. アプリのバージョンが古い

    最新の機能が適用されていない可能性があります。アプリストアで最新バージョンへのアップデートがあるかご確認ください。


    【解決しない場合】

    上記を確認しても改善しない場合は、弊社オペレーターへお知らせください。弊社にてお客様の口座ステータスを確認し、保留中の手続きを解消するための調査および処理を行います。完了後、アプリ上の状況が更新されたことをご確認ください。'
