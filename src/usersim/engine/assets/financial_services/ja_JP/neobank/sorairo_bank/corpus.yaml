- id: 0f3a4376-f8a1-5325-936c-88d3890878ba
  title: 普通預金：限度額・制限と注意事項
  body: '【サポート担当者向け：普通預金の制限・注意事項】


    お客様へ案内する際は、以下の利用限度額および手数料の条件を正確に提示してください。


    ■手数料の無料枠と超過後のコスト

    ・他行あて振込手数料：月、基本の無料回数は2回です。無料回数を超えた後は、1回につき145円の手数料がかかります。

    ・提携ATM出金手数料：月、基本の無料回数は2回です。無料回数を超えた後は、1回につき110円の手数料がかかります。


    ■預金保護とコンプライアンス

    ・預金保険制度：普通預金は、預金保険機構により元本1,000万円まで（利息を含む）保護されます。

    ・本人確認：犯罪収益移転防止法に基づき、口座開設および重要な手続きには厳格な本人確認が必要です。情報の照会や変更前には、必ずお客様のフルネームと生年月日の確認を行ってください。


    ■注意事項

    ・暗証番号やパスワードなどの機密情報は、いかなる理由があってもお客様から聞き出してはいけません。

    ・個別の税務判断や法的助言、投資助言は行わず、必要に応じて専門家（税理士・弁護士等）への相談を案内してください。'
