- id: abdfc532-4b41-57a6-977a-589716cfdd37
  title: get_statements を使う場面
  body: 'お客様から、過去の取引明細の照会や、特定の期間の利用明細書の提供を求められた場合に本ツールを使用します。確定申告などの公的な手続きや、家計管理のために取引履歴を詳細に確認したいというニーズに対応するための手続きです。なお、明細の確認方法に関する一般的な案内については、「普通預金：状況・履歴の確認」をご参照ください。


    オペレーターは以下の手順に従って手続きを行います。


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を使用して、お客様が照会を希望される口座の `account_id` を特定します。お客様から口座番号の下4桁などで提示を受けた場合は、このツールで照合してください。

    3. 照会したい期間などの条件を確認し、`get_statements` を呼び出して明細情報を取得します。

    4. 取得した明細内容をお客様に案内します。


    本手続きは、アプリ内での完結を基本としていますが、お客様がアプリ操作に困難を感じている場合にオペレーターがサポートする形式で提供します。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: sorairo_bank
- id: 3190f082-5689-57a7-8818-b3ce21403701
  title: get_statements ツールリファレンス
  body: '指定された口座の取引明細（ステートメント）を取得するツールです。


    オペレーターは、`verify_identity` による本人確認が完了した後、本ツールを直接呼び出すことで明細情報を取得し、お客様に提示します。本ツールを呼び出す前に
    `get_accounts` を使用して、対象となる正確な口座識別子を特定しておく必要があります。


    - 実行内容：口座の取引履歴および明細情報の抽出

    - 前提条件：`verify_identity` による本人確認済みであること'
  domain: retail_banking
