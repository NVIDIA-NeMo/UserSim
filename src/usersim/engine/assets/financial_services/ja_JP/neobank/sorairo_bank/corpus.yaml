  institution_id: sorairo_bank
- id: 2d2efe71-06c7-5f9f-8636-33ce8bb71909
  title: 目的別口座：おすすめの方と主な使い方
  body: '目的別口座は、「貯金したいけれど、何にいくら使うか整理したい」という方に最適です。


    **こんな方におすすめです**

    * 旅行、車などの大きな買い物に向けて計画的に貯めたい方

    * 年間の税金や保険料など、将来の支払いに備えて資金を分けておきたい方

    * 家計簿アプリを使わずに、アプリ内でシンプルに資金管理を行いたい方


    **主な特徴と活用方法**

    * **最大10個まで作成可能**： 「旅行」「車」「教育資金」など、目的ごとに最大10個までポケットを作れます。

    * **高い金利を維持**： 分けて管理していても、普通預金と同じ年率0.45%の金利が得られるため、効率的に資産を増やせます。

    * **簡単移動**： 普通預金口座と目的別口座の間で、アプリからいつでも即時に資金を移動できます。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
