- id: fda64e6f-bef7-53b9-844f-95e9ab469fdb
  title: 目的別口座：規定・約款の変更
  body: '目的別口座のご利用に関する規定および約款は、法令の改正やサービス向上のため、当行の判断により変更される場合があります。


    **【変更の手続き】**

    約款を変更する場合、変更内容および適用開始日をアプリ内のお知らせや公式サイトにて事前にお知らせいたします。周知期間を経て適用された時点で、お客さまは同意したものとみなされます。


    **【適用される制限】**

    本サービスでは、最大10個までの目的別口座の作成が可能です。また、適用金利（普通預金と同等の0.45%）などの条件が変更される場合も、同様に事前告知を行います。ご不明な点は、いつでもチャットサポートまでお問い合わせください。'
