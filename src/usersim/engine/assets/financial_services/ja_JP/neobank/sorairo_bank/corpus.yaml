  title: 目的別口座：普通預金の金利について
  body: '**Q. 目的別口座に資金を分けると、金利は下がりますか？**


    A. いいえ、下がりません。目的別口座に預けていただいた資金にも、普通預金と同じ年率0.45%の金利が適用されます。資金を分けて管理しながら、高い金利をそのまま享受いただけます。


