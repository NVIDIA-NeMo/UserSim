  institution_id: sorairo_bank
- id: 0ec792c2-e00e-5d29-825e-4c9fe0a5c267
  title: 目的別口座：状況・履歴の確認
  body: '目的別口座の現在の残高や、過去の入出金履歴を確認する手順をご案内します。


    【事前準備】

    お手元に、ご登録のスマートフォンアプリをご用意ください。


    【確認の手順】

    1. オペレーターに「目的別口座の残高と履歴を確認したい」旨をお伝えください。

    2. ご本人様確認のため、フルネームと生年月日をお答えください。

    3. 確認したい特定の目的別口座の名前（例：「旅行用」「車買い替え用」など）を伝えてください。指定がない場合は、作成済みの全口座のリストを提示いたします。

    4. オペレーターが、指定された口座の現在の残高および直近の入出金履歴を提示します。内容に間違いがないかご確認ください。


    【完了の確認】

    提示された金額が、お客様ご自身の記録やアプリ上の表示と一致していれば完了です。もし履歴に心当たりのない取引がある場合は、そのままオペレーターへお知らせください。


    履歴の全体像については「普通預金：状況・履歴の確認」でもあわせてご確認いただけます。'
