- id: 03eef751-eb3e-5133-b2fb-b6571096d34e
  title: 定期預金：お手続きが完了しない・保留中のまま
  body: '定期預金のお申込み中に画面が停止したり、「保留中」のまま進まない場合の対処法をご案内します。


    **【考えられる原因と確認事項】**

    - **資金不足**：普通預金口座の残高が、預入希望額（最低1,000円〜）を下回っていないかご確認ください。

    - **通信環境**：電波の不安定な場所で操作されている可能性があります。


    **【解決方法】**

    1. アプリを一度完全に終了し、再起動して再度お手続きをお試しください。

    2. 普通預金口座に十分な残高があることを確認してください。


    **【解決しない場合】**

    上記を試しても改善しない場合は、当行にて調査いたします。状況を確認後、専門チームが原因を特定し、アプリ内通知にて結果をご報告いたします。'
