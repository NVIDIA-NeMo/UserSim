  institution_id: sorairo_bank
- id: 6f14c3e8-8385-5ede-8f65-67bd5958b551
  title: スマホ送金：プランの選び方
  body: '資金を移動させる際、「スマホ送金」と「通常の振込」のどちらを使うべきか迷われる方に、選び方のポイントをご案内します。


    ■スマホ送金が適しているケース

    ・少額（100,000円以下）を頻繁に送る場合

    ・相手の口座番号を調べる手間を省きたい（電話番号のみで完結）

    ・コストを抑えたい（送金手数料 0円）


    ■通常の振込が適しているケース

    ・100,000円を超える金額を送金する場合

    ・1か月で500,000円を超える合計額を送金する必要がある場合

    ・相手がそらいろ銀行以外に口座を持っている場合


    【比較まとめ】

    スマホ送金は「スピード」と「コスト（0円）」に特化しており、日常的な割り勘や少額の送金に最適です。一方で、大きな金額を動かす際には、上限額のない通常の振込が適しています。用途に合わせて使い分けることで、より効率的な資金管理が可能です。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 072ffca0-ba00-5d31-b3b8-3b144a73ba41
  title: スマホ送金：個人情報の取扱い
  body: 'そらいろ銀行は、個人情報保護法に基づき、お客様の個人情報を厳重に管理しております。「スマホ送金」における個人情報の取扱いは以下の通りです。


    ■収集する情報とその目的

    本サービスでは、送金手続きを円滑に行うため、お客様および送金先の方の「電話番号」および「口座情報」を利用します。これは、送金相手を正しく特定し、誤送金を防止することを目的としています。


    ■第三者への提供について

    法令に基づく場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。ただし、送金時に相手方へ通知される氏名等の情報は、本サービスの機能として同意いただいた範囲内で取り扱われます。


    ■安全管理措置

    お客様のデータは暗号化して保存され、アクセス権限を厳格に制限した環境で管理しています。また、不正アクセスによる情報漏えいを防ぐため、二段階認証などのセキュリティ対策を導入しています。


    ■開示・訂正・削除について

    ご自身の登録情報の確認や変更を希望される場合は、アプリ内の設定メニューから、または当行サポートまでご連絡ください。ご本人確認（フルネームおよび生年月日の照合）の上、速やかに対応いたします。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 1f8f56d7-8547-5401-a551-0a1a044c9290
  title: スマホ送金：この商品をかたる詐欺にご注意ください
  body: 'そらいろ銀行の「スマホ送金」を悪用した、巧妙な詐欺が発生しています。お客様の資産を守るため、以下の点に十分ご注意ください。


    【よくある詐欺の手口】

    ・「至急、少額の送金をしてほしい」という友人や親族をかたるメッセージが届き、電話番号を指定した送金を急がせる。

    ・「手数料を返金する」などの名目で、不審なURLへのアクセスや個人情報の入力を求める。


    【そらいろ銀行が絶対に行わないこと】

    当行のオペレーターが、お電話やチャット、メール等で以下の情報を聞き出すことは一切ございません。

    ・暗証番号、パスワード、ログインコード

    ・カード番号、CVV（セキュリティコード）

    ・身分証明書の番号


    【お手続き前の本人確認について】

    口座情報の照会や変更などの手続きを行う際は、必ずお客様の「フルネーム」と「生年月日」を確認させていただきます。これ以外の機密情報を求められた場合は、詐欺の可能性が高いため、すぐにご注意ください。


    【不審な点がある場合】

    少しでも「おかしい」と感じたり、身に覚えのない送金依頼を受けた場合は、送金を中断し、速やかに当行までご連絡ください。不正利用が発覚した際は、銀行規定に基づき速やかに調査と補償手続きを行います。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 23e5df2f-42f8-5ed6-a855-15651ecd9e68
  title: スマホ送金：限度額・制限と注意事項
  body: '「スマホ送金」を安全かつ便利にご利用いただくための、送金限度額と重要な制限事項についてご案内します。


    【送金限度額】

    本サービスでは、セキュリティ維持と少額決済への特化のため、以下の限度額を設定しております。

    ・1回あたりの送金上限額：100,000円

    ・1か月あたりの送金上限額：500,000円


    ※上記限度額は、お客様ご自身で変更することはできません。上限額を超える送金をご希望の場合は、通常の振込手続きをご利用ください。


    【ご利用上の注意事項】

    ・送金先は、相手方の電話番号で指定します。番号に誤りがある場合、意図しない相手に資金が送金される可能性があり、原則として当行での取り消しはできません。送信確定前に必ず相手方の情報を再確認してください。

    ・本サービスは、スマートフォンアプリを通じて提供されます。アプリのバージョンが古い場合や、通信環境が不安定な場合は、正常に完了しないことがあります。

    ・1か月あたりの上限額は、毎月1日にリセットされます。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 7b1095f7-c59e-5e32-9e29-085437edf99e
  title: スマホ送金：手数料と費用
  body: '「スマホ送金」のご利用にかかる費用について、よくあるご質問にお答えします。


    Q. スマホ送金を利用する際、送金手数料はかかりますか？

    A. いいえ、かかりません。スマホ送金の送金手数料は0円です。日常的な少額のやり取りを、コストを気にせず気軽にご利用いただけるサービスとなっております。


    Q. 受取側に手数料は発生しますか？

    A. 受取側のお客様に手数料が発生することはありません。無料で資金を受け取っていただけます。


    より詳細な手数料体系については、「手数料・料金のご案内」をご確認ください。'
