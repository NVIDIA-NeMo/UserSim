- id: c117f406-6877-5049-b599-7b712ad92fe1
  title: get_accounts を使う場面
  body: 'お客様が保有する口座やカードの情報を確認し、後続の手続きに必要な内部識別子（`account_id` や `card_id`）を特定する場合に使用します。本ツールは、特定の手続きを行う前の「照会ステップ」として不可欠です。


    【利用手順】

    1. 本人確認の実施：お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出してください。

    2. 情報の照会：`get_accounts` を呼び出し、お客様が保有する全ての口座（普通預金、目的別口座、定期預金）およびカードの一覧を取得します。

    3. 識別子の特定：お客様から提示された口座番号やカード番号の下4桁と、ツールから返却された情報を照合し、操作対象となる正確な ID を特定してください。


    【注意点】

    - セキュリティのため、エージェントからお客様へフル番号を伝えることは禁止されています。必ず「下4桁」での照合を行ってください。

    - 目的別口座の確認を含め、現在の残高やステータスを把握する際にも活用します。詳細な残高確認は「普通預金：状況・履歴の確認」も併せて参照してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: sorairo_bank
- id: 300a0290-ebc9-5f65-9de9-7f35826982da
  title: get_accounts ツールリファレンス
  body: '認証済みのお客様が保有する全ての口座およびカードのリストを取得します。エージェントはこのツールを直接呼び出して情報を確認します。


    【引数】

    - なし


    【返却値】

    - 口座ID (`account_id`)、口座種別、口座番号の下4桁、残高、ステータス、および保有カードID (`card_id`) のリスト。


    【動作】

    - 本ツールを呼び出す前に、必ず `verify_identity` による本人確認が完了している必要があります。'
