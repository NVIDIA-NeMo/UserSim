- id: 8906a2a3-8885-56c4-a0e9-53a5531055da
  title: スマホ送金：解約・変更・プランの切替え
  body: '「スマホ送金」は、口座に付帯する機能であるため、個別の「プラン」や「契約」という形式ではありません。そのため、プランの切替えはございませんが、機能の利用停止や設定変更についてご案内いたします。


    ■スマホ送金機能の利用停止（解約相当）の手順

    1. オペレーターに「スマホ送金機能の停止」を希望される旨をお伝えください。

    2. ご本人確認のため、フルネームと生年月日をお伺いします。

    3. 当行にて機能の停止処理を行います。

    4. 処理完了後、アプリ内で機能が利用できなくなったことをご確認いただきます。


    ■登録電話番号の変更手順

    1. オペレーターに「スマホ送金に紐づく電話番号の変更」を希望される旨をお伝えください。

    2. ご本人確認のため、フルネームと生年月日をお伺いします。

    3. 新しい電話番号をご提示ください。

    4. 当行にて変更手続きを行い、完了の旨を回答いたします。


    ■注意点

    機能の停止後、再度利用を希望される場合は、改めて認証手続きが必要となります。詳細な制限事項については「スマホ送金：限度額・制限と注意事項」をご参照ください。'
