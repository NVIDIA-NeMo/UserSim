- id: 0ec792c2-e00e-5d29-825e-4c9fe0a5c267
  title: 目的別口座：状況・履歴の確認
  body: '目的別口座の現在の残高や、過去にいくら移動させたかを確認する手順です。


    1.  アプリのホーム画面から「目的別口座」のメニューを選択します。

    2.  現在作成している口座の一覧が表示されます。確認したい目的（例：「旅行資金」など）をタップしてください。

    3.  その口座の現在の残高と、年0.45%の金利が適用されていることが確認できます。

    4.  画面下部の「履歴」をタップすると、普通預金からいくら移動し、いつ戻したかの履歴が日付順に表示されます。


    **【確認のポイント】**

    残高が想定と異なる場合は、自動入金設定が正しく動作しているか、または他の目的別口座へ資金を移動させていないかをご確認ください。'
