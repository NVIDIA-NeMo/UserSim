- id: 072ffca0-ba00-5d31-b3b8-3b144a73ba41
  title: スマホ送金：個人情報の取扱い
  body: '「スマホ送金」のご利用にあたり、お客様の個人情報は銀行法および個人情報保護法に基づき厳格に管理いたします。


    **【収集する情報とその目的】**

    ・**電話番号**: 送金先の特定および本人確認（二段階認証）のために利用します。

    ・**取引履歴**: 法令に基づく取引時確認および、不正送金防止のためのモニタリングに利用します。


    **【第三者への提供について】**

    法令に基づく場合を除き、お客様の同意なく電話番号等の個人情報を第三者に提供することはありません。また、送金時に相手方に通知される情報は、送金者の氏名などの必要最小限の内容に限定されます。詳細な取り扱いについては、当行のプライバシーポリシーをご確認ください。'
