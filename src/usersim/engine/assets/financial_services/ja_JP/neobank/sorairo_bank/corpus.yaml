- id: e43d2f02-4ed3-5e40-ac57-f3d53eafd675
  title: そらいろVisaデビット：登録内容の変更
  body: 'そらいろVisaデビットにご登録いただいている住所や氏名などの変更手続きは、以下の手順で簡単に行っていただけます。


    【お手続き前の準備】

    ・最新の情報を証明できる本人確認書類（マイナンバーカード等）をお手元にご用意ください。


    【お手続きの手順】

    1. 本人確認

    まず、お客様のフルネームと生年月日をお伺いし、ご本人様であることを確認させていただきます。


    2. 変更内容の提示

    変更を希望される項目（住所、氏名、電話番号など）と、新しい情報を当行へお伝えください。


    3. 書類のアップロード

    案内されたアプリの専用画面から、お手元にある本人確認書類の写真を撮影し、アップロードしてください。


    4. 内容の審査と完了

    当行にて提出書類と変更内容の照合を行います。審査が完了次第、アプリの通知にて「登録内容の変更が完了しました」というメッセージが届きます。これにより手続き完了となります。


    ※カードの送付先住所を変更された場合、必要に応じてカードの再発行手続きが必要となる場合がございます。'
