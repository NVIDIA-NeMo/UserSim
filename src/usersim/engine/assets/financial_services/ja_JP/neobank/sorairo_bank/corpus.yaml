- id: d42e2f81-275c-5215-8bd1-f3494da41d31
  title: 定期預金：ログインできない・アクセスできない
  body: 'アプリで定期預金の詳細画面が表示されない、またはログインできない場合の対処法です。


    【考えられる症状】

    - アプリを起動してもログイン画面から進まない。

    - 定期預金の残高照会画面でエラーが表示される。

    - 認証画面でタイムアウトになる。


    【確認および解決手順】

    1. 通信環境の確認

    安定したインターネット接続（Wi-Fiまたは4G/5G）環境にあるかをご確認ください。電波の弱い場所では認証に失敗することがあります。


    2. アプリのバージョン確認

    アプリが最新バージョンであるかをご確認ください。古いバージョンのままでは、セキュリティ上の理由でアクセスが制限される場合があります。


    3. 認証情報の再確認

    パスワードや生体認証が正しく動作しているかご確認ください。もしパスワードを忘れた場合は、アプリのログイン画面にある「パスワードを忘れた方」から再設定を行ってください。


    4. 端末の再起動

    一時的な不具合の場合、スマートフォンの再起動で解消することがあります。


    【解決しない場合】

    上記を試してもアクセスできない場合は、当行の専門オペレーターへエスカレーションいたします。その際、エラーコード（表示されている場合）を併せてお知らせください。オペレーターがアカウントの状態を調査し、認証の再登録などの解決策を提示いたします。'
