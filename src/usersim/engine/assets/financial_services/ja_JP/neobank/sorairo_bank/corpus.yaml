- id: 9afaede3-1a1d-53ae-a7a4-418bf64e1ee0
  title: 普通預金：普通預金の金利について
  body: 'Q. 普通預金の金利はどのくらいですか？

    A. 年0.45%の金利を適用しております。デジタルネイティブ世代の皆様に効率的な資産管理を行っていただけるよう、競争力のある金利を設定しています。


    Q. 金利はどのように適用されますか？

    A. 口座残高に対して適用され、定期的に計算されます。最新の金利情報は「普通預金：金利・料率一覧」にてご確認いただけます。'
