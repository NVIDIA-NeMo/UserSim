- id: a9ec4259-93f8-51d8-a2b4-53427ff73056
  title: そらいろVisaデビット：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが途中で止まってしまった場合や、「審査中」「保留中」のまま進まない場合の対処法をご案内します。


    【よくある原因とチェック事項】

    1. 通信環境の不安定：ICチップの読み取り時に通信が切断されると、手続きが保留になることがあります。Wi-Fi環境や安定した電波状況下で再度お試しください。

    2. 本人確認書類の不備：マイナンバーカードの読み取りエラーや、撮影した画像の不鮮明さが原因で、確認作業に時間を要している場合があります。

    3. システムメンテナンス：銀行側のシステムメンテナンス時間帯に手続きを行った場合、処理が一時的に保留されます。


    【解決方法】

    ・アプリを一度完全に終了し、再度ログインしてステータスを確認してください。

    ・本人確認の再提出を求められている場合は、画面の指示に従い、明るい場所で再度読み取りを行ってください。


    【エスカレーションについて】

    上記を確認しても3営業日以上ステータスが変わらない場合は、専門のオペレーターにて調査いたします。お客様のフルネームと生年月日を確認後、現在の審査状況を詳細に照会し、不足書類の有無や不備の内容をご案内します。'
