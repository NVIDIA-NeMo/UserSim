- id: 11d06639-a25f-5072-ab6a-896938aa303f
  title: 定期預金：規定・約款の変更
  body: '定期預金に関する規定および約款の変更についてご案内いたします。


    **変更の手続き**

    当行は、法令の改正や経済状況の変化に伴い、規定や約款を変更することがあります。変更の内容は、アプリ内通知またはご登録のメールアドレスにて事前にお知らせいたします。


    **金利の適用について**

    ・6か月もの（0.7%）および1年もの（0.9%）の金利は、預入時の約定に基づき適用されます。

    ・約定後の金利変更は原則として行われませんが、規定の変更により適用条件が変わる場合は、事前通知の上で実施いたします。


    **合意と解約**

    変更後の規定に同意いただけない場合は、本商品を解約することが可能です。解約手続きの詳細については、「定期預金：解約・変更・プランの切替え」をご確認ください。'
