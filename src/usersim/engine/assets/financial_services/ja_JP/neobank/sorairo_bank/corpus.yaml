- id: 731d5792-418e-5695-811a-2edf0666ee2b
  title: reregister_device を使う場面
  body: 'お客さまが「機種変更をしたため、アプリにログインできない」「二段階認証が使えなくなった」とお問い合わせいただいた際に、本手続きを行います。


