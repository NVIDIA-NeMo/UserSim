  body: '**Q: 提携ATMでのおろしの手数料は、月に何回まで無料になりますか？**


    A: 普通預金口座をお持ちのお客さまは、月に2回まで無料でATMをご利用いただけます。3回目以降の利用につきましては、1回あたり110円の手数料がかかります。詳細は「普通預金：手数料一覧」をご参照ください。'
