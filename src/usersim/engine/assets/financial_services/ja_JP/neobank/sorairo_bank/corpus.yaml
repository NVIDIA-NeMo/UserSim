- id: 037accc8-57cc-56b9-a53b-462754431753
  title: 目的別口座：お申込みとご利用開始
  body: '目的別口座の作成は、アプリから簡単に行えます。以下の手順でお手続きください。


    【準備するもの】

    ・普通預金口座の残高（自動入金を利用される場合は最低1,000円以上の資金）


    【お手続きの手順】

    1. 目的別口座の作成を依頼してください。

    2. 口座の「目的（名前）」を入力してください（例：〇〇旅行、貯蓄など）。

    3. 初回入金額、または毎月の自動入金額を設定してください。自動入金を利用する場合、最低金額は1,000円からとなります。

    4. 設定内容を確認し、完了ボタンを押してください。


    【完了の確認】

    手続き完了後、口座一覧に指定した名前の目的別口座が表示され、設定した金額が振り替えられたことを確認して完了です。'
