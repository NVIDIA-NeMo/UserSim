- id: abdfc532-4b41-57a6-977a-589716cfdd37
  title: get_statements を使う場面
  body: 'お客さまから、確定申告やローン審査などの提出書類として、または過去のお取引内容を詳しく確認したいというご要望があった際に利用します。


    【対応手順】

    1. 本人確認（`verify_identity`）を完了させます。

    2. 口座番号の下4桁を確認し、`get_accounts` を使用して正確な `account_id` を特定します。

    3. 必要となる期間（月次や年次など）を確認します。

    4. `get_statements` を呼び出し、該当する明細書を取得してお客さまへ提示します。


    ※もし提示した明細の内容についてお客さまから疑問を持たれた場合は、「普通預金：明細や記録と合わない」をご案内ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: sorairo_bank
- id: 3190f082-5689-57a7-8818-b3ce21403701
  title: get_statements ツールリファレンス
  body: '`get_statements`


    【概要】指定した口座の利用明細書を取得します。オペレーターが本ツールを直接呼び出すことで、お客さまに代わってデータを抽出します。


    【引数】

    ・`account_id`: 対象口座の識別ID

    ・`period`: 取得したい期間（例：2025年1月〜2025年3月）


    【効果】指定期間の取引明細データが返却されます。'
