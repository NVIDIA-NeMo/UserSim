- id: 63382f92-6d4d-5154-9df6-cd43209d8816
  title: よくあるご質問
  body: '【お問い合わせ方法について】

    Q：サポートはどのように受けられますか？

    A：スマートフォンアプリ内のチャットおよびオンラインヘルプセンターにて、いつでも簡単にご利用いただけます。


    Q：複雑な相談をしたい場合はどうすればよいですか？

    A：チャットで解決しない複雑な案件については、専門のオペレーターによるオンライン相談へエスカレーションし、個別にご案内いたします。'
  domain: retail_banking
