- id: 147f7508-67d7-567d-a424-47af97be91bb
  title: transfer_funds を使う場面
  body: 'お客様が、ご自身の口座間や他行の口座へ資金を移動させたい場合に本ツールを使用します。具体的には、メインとなる「普通預金」から「目的別口座」への資金移動、またはその逆の操作、および他金融機関の口座への振込手続きに対応します。


    本手続きは、お客様の資産を直接的に移動させる重要な操作であるため、必ず以下の手順に従って実施してください。


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 資金移動の元となる口座および移動先口座を特定するため、`get_accounts` を使用して、お客様が提示した口座番号の下4桁から正確な account_id
    を取得してください。

    3. 移動金額と移動先を確認し、`transfer_funds` を実行して資金移動を完了させてください。


    なお、他行あて振込の手数料や無料回数についての詳細は、「普通預金：手数料一覧」または「普通預金：他行あて振込手数料の無料回数（月、基本）について」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: sorairo_bank
- id: 01b8a3ba-97c6-5b52-8eba-aa0002e137fc
  title: transfer_funds ツールリファレンス
  body: '指定された口座から別の口座へ資金を移動させます。エージェントはこのツールを直接呼び出すことで、お客様に代わって資金移動を実行します。


    **シグネチャ**

    `transfer_funds(from_account_id: string, to_account_id: string, amount: number)`


    **引数**

    - `from_account_id`: 資金を出す元口座のID（`get_accounts` で取得）。

    - `to_account_id`: 資金を受け取る先口座のID（`get_accounts` または登録済みの振込先情報から取得）。

    - `amount`: 移動させる金額（円単位）。


    **効果**

    指定された金額が `from_account_id` から差し引かれ、`to_account_id` に即時に加算されます。本人確認（`verify_identity`）が完了していることが前提となります。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: sorairo_bank
- id: 73987261-a3f2-5d11-a07b-99f777855e81
  title: update_beneficiary を使う場面
  body: 'お客様が、振込先として登録している金融機関情報の追加、変更、または削除を希望される場合に本ツールを使用します。これにより、次回以降の振込手続きをよりスムーズに行うことが可能になります。


    登録内容には、金融機関名、支店名、口座番号、および受取人名が含まれます。情報の誤りは誤送金に繋がる恐れがあるため、慎重に確認してください。


    **手続き手順**


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 追加・変更・削除したい振込先の詳細（金融機関、支店、口座番号、受取人名）をお客様から伺います。

    3. 伺った内容に基づき、`update_beneficiary` を呼び出して登録情報の更新を行ってください。


    振込に関する制限や注意事項については、「普通預金：限度額・制限と注意事項」をご確認ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: sorairo_bank
- id: c525f907-0437-5cc0-915d-78cf473ee252
  title: update_beneficiary ツールリファレンス
  body: '登録済みの振込先情報を管理します。エージェントはこのツールを呼び出すことで、お客様の振込先リストを更新します。


    **シグネチャ**

    `update_beneficiary(action: string, bank_name: string, branch_name: string, account_number:
    string, beneficiary_name: string)`


    **引数**

    - `action`: 実行する操作（"add"で追加、"update"で変更、"delete"で削除）。

    - `bank_name`: 金融機関名。

    - `branch_name`: 支店名。

    - `account_number`: 口座番号。

    - `beneficiary_name`: 受取人名。


    **効果**

    お客様の口座に紐づく振込先名簿が更新されます。この操作には、事前に `verify_identity` による本人確認が完了している必要があります。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: sorairo_bank
- id: 9baacaeb-16a9-551b-a0d5-fc04a82f627f
  title: stop_payment を使う場面
  body: 'お客様から、口座振替（自動引落し）の停止依頼を受けた場合に本ツールを使用します。公共料金やサブスクリプションサービスの支払い停止など、あらかじめ設定された自動的な資金流出を止める手続きです。


    注意点として、そらいろ銀行では小切手および手形を取り扱っていないため、それらの支払停止手続きは提供しておりません。あくまで「口座振替」の停止のみが対象となります。


    **手続き手順**


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 停止を希望される振替サービス名や、対象となる口座を特定します。必要に応じて `get_accounts` で口座IDを確認してください。

    3. `stop_payment` を呼び出し、該当する口座振替の停止処理を行ってください。


    手続き完了後、反映までに時間を要する場合があることをお客様へお伝えください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: sorairo_bank
- id: db01d605-6bc0-5594-a040-6869e283c2b7
  title: stop_payment ツールリファレンス
  body: '設定されている口座振替（自動引落し）を停止します。エージェントはこのツールを使用して、指定されたサービスの引落しを無効化します。


    **シグネチャ**

    `stop_payment(account_id: string, service_name: string)`


    **引数**

    - `account_id`: 振替元となる口座のID。

    - `service_name`: 停止したい振替サービスの名称（例：電気料金、通信費など）。


    **効果**

    指定された口座から該当するサービスへの自動振替が停止されます。本ツールを実行する前に、必ず `verify_identity` による本人確認を完了させてください。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: sorairo_bank
- id: 13f17046-6cee-515e-a668-6e645ef179cb
  title: pay_bill を使う場面
  body: 'お客様が、税金や公共料金などの払込みを、ペイジー（Pay-easy）を利用して口座から行いたい場合に本ツールを使用します。請求書に記載された情報をもとに、即時に払込みを完了させることができます。


    **手続き手順**


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 払込みの原資となる口座を特定するため、`get_accounts` を使用して正しい account_id を取得してください。

    3. 払込票に記載されている「収納機関番号」「お客様番号」「確認番号」などのペイジー情報を正確に伺います。

    4. `pay_bill` を呼び出し、指定された金額の払込みを実行してください。


    払込み完了後、速やかに処理結果をお客様へ通知してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: sorairo_bank
- id: 59c4e1b5-cf89-59d7-b832-fb7ad3fd1183
  title: pay_bill ツールリファレンス
  body: 'ペイジー（Pay-easy）を利用して、税金や公共料金等の払込みを実行します。エージェントはこのツールを呼び出すことで、お客様の口座から直接決済を行います。


    **シグネチャ**

    `pay_bill(account_id: string, pay_easy_info: object)`


    **引数**

    - `account_id`: 払込み元口座のID。

    - `pay_easy_info`: ペイジー決済に必要な情報のセット（収納機関番号、お客様番号、確認番号、金額など）。


    **効果**

    指定された口座から払込み金額が引き落とされ、収納機関へ送金されます。実行前に `verify_identity` による本人確認が必須です。'
