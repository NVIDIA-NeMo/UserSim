- id: 96464648-3598-57b4-bfcc-c3c4184c1c2e
  title: 普通預金：お取引が拒否された・制限された
  body: '【症状】

    アプリでの振込やATMでの出金時に「お取引が制限されています」などのエラーが表示され、手続きが完了できない。


    【考えられる原因】

    1. 本人確認書類の有効期限切れ（犯罪収益移転防止法に基づく再確認が必要な場合）。

    2. 短期間に不自然な高額取引があり、不正利用防止のため一時的に制限がかかっている。

    3. 口座残高が不足している。


    【確認と解決の手順】

    1. まず、アプリのホーム画面で現在の残高が十分であるか確認してください。

    2. 本人確認状況に不備がないか、サポート担当者に照会します。この際、フルネームと生年月日を伝えてください。

    3. 制限の理由がセキュリティ上のものである場合、担当者が本人確認を行い、安全が確認され次第、制限を解除します。


    【エスカレーション】

    本人確認後の解除に時間がかかる場合や、不正利用の疑いがある場合は、専門の審査チームへ案件をエスカレーションします。調査結果は後日、アプリ内通知または登録連絡先へ案内されます。'
