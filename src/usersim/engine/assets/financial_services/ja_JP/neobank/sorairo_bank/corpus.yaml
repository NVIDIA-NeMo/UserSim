- id: 56790170-0a15-5ab1-a1e2-7dcd1fcc409b
  title: freeze_card を使う場面
  body: 'お客様から「そらいろVisaデビット」の紛失、盗難、または不正利用の疑いがある旨の連絡を受けた場合、被害を最小限に抑えるため、直ちにこのツールを使用してカードの利用を一時停止します。


    【手順】

    1. 本人確認の実施

    `verify_identity` を呼び出し、お客様のフルネームと生年月日を確認します。


    2. カード識別子の特定

    `get_accounts` を呼び出し、停止対象となるデビットカードの `card_id` を特定します。


    3. 利用停止の実行

    `freeze_card` を呼び出し、対象カードの利用を即座に停止させます。


    4. 後続手続きの案内

    - 紛失・盗難が確定している場合は、`order_replacement_card` によるカードの再発行を案内します。

    - 不正利用の疑いがある場合は、`file_transaction_dispute` による補償申出の手続きを案内します。


    【注意事項】

    - カード停止は迅速に行うことが最優先されます。

    - お客様には、アプリ内でも同様の操作が可能であることを併せて伝えてください。'
