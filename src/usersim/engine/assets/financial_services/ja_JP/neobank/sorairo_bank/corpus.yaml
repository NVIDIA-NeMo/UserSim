- id: df58595a-651f-526b-939e-93aa788d25c4
  title: 目的別口座：ご利用開始までの手順
  body: '【オペレーター向け：お客様への案内ガイド】

    お客様が目的別口座の利用を開始される際は、以下の手順に従ってご案内ください。本機能はアプリ内で完結するため、操作方法のレクチャーを中心に進めてください。


    1. 事前準備の確認

    お客様が最新バージョンのそらいろ銀行アプリをインストールし、普通預金口座を開設済みであることを確認してください。


    2. 目的別口座の作成手順の案内

    アプリの口座詳細画面から「目的別口座を作成する」ボタンを選択するようご案内します。ここで、貯金の目的（例：「旅行」「車」など）に応じた名称を入力していただきます。


    3. 作成可能数の説明

    目的別口座は、最大10個まで作成可能であることをお伝えください。用途に合わせて柔軟に使い分けていただける点をご案内します。


    4. 資金移動の説明

    メインの普通預金口座から、作成した目的別口座へ資金を移動させる操作をご案内します。この移動はアプリ内で即時に完了し、手数料はかかりません。


    5. 金利のメリットを提示

    目的別口座に振り分けた資金に対しても、普通預金と同等の0.45%という高い金利が適用されることを強調し、計画的な貯蓄のメリットを伝えてください。


    6. 自動入金設定の案内

    継続的な貯金を希望される場合は、自動入金機能をご案内してください。その際、自動入金の最低金額は1,000円からであるという制限について明確に説明してください。


    以上の手順で、お客様がスムーズに資産管理をスタートできるようサポートしてください。複雑な設定エラーが発生した場合は、専門部署へエスカレーションしてください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3c341238-4cbc-58ca-b7f9-f6121839ff64
  title: 目的別口座：自動入金の最低金額について
  body: 'Q: 目的別口座の自動入金を設定したいのですが、いくらから設定できますか？

    A: 自動入金の最低金額は1,000円からとなっております。1,000円以上の金額で、ご自身の計画に合わせた金額を設定してください。


    Q: 1,000円未満の金額を自動で積み立てることはできませんか？

    A: 誠に恐れ入りますが、システムの制約により、自動入金は1,000円からのみ承っております。少額の積み立てをご希望の場合は、お手数ですが手動で資金移動を行ってください。


    詳細な仕様については、「目的別口座：商品概要」をご確認ください。'
