- id: 23e5df2f-42f8-5ed6-a855-15651ecd9e68
  title: スマホ送金：限度額・制限と注意事項
  body: '「スマホ送金」をご利用いただく際の限度額と制限事項についてご案内いたします。安全かつ円滑な送金を実現するため、以下の制限を設けております。


    **ご利用限度額**

    - 1回あたりの送金限度額：100,000円

    - 1か月あたりの送金合計限度額：500,000円


    **注意事項**

    - 上記の限度額は、セキュリティ保持のため変更することができません。限度額を超える送金が必要な場合は、通常の振込機能をご利用ください。

    - 送金先の電話番号に誤りがある場合、誤送金となる可能性があります。確定前に必ず宛先をご確認ください。

    - お取引の際は、常に最新の二段階認証を完了していただく必要があります。'
