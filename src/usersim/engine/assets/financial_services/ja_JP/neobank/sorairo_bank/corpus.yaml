- id: ab31acc7-3bfe-51dd-9953-54bb514a3a5f
  title: set_alerts を使う場面
  body: 'お客さまが支出を効率的に管理したい場合や、想定外の高額な振込があった際に即時通知を受け取りたいというご要望があった際に利用します。


    【対応手順】

    1. 本人確認（`verify_identity`）を完了させます。

    2. 口座番号の下4桁を確認し、`get_accounts` を使用して `account_id` を特定します。

    3. 通知を希望される条件（例：10,000円以上の出金があった時など）を確認します。

    4. `set_alerts` を呼び出し、通知設定を有効にします。


    これにより、条件に合致した取引が発生した際、お客さまのスマートフォンアプリへリアルタイムで通知が届くようになります。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: sorairo_bank
- id: a1b744c9-6e3c-5a85-9f6e-aca6e500370a
  title: set_alerts ツールリファレンス
  body: '`set_alerts`


    【概要】口座の入出金に関する通知設定（アラート）を作成または変更します。オペレーターが本ツールを直接呼び出して設定を行います。


    【引数】

    ・`account_id`: 対象口座の識別ID

    ・`alert_type`: 通知の種類（入金・出金など）

    ・`threshold`: 通知をトリガーとする金額（例：10,000円）


    【効果】指定された条件に合致する取引が発生した際に、プッシュ通知が送信されるようになります。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: sorairo_bank
- id: 9a62d651-a894-5251-b9da-34ea95cb2fc0
  title: dispute_status を使う場面
  body: '「そらいろVisaデビット」などで身に覚えのない利用があり、既に `file_transaction_dispute` を通じて調査依頼を提出済みのお客さまから、現在の進捗状況について確認があった際に利用します。


    【対応手順】

    1. 本人確認（`verify_identity`）を完了させます。

    2. 調査依頼時に発行された「照会番号（dispute_id）」をお客さまに確認します。

    3. `dispute_status` を呼び出し、現在の調査状況（調査中、完了、補償決定など）を確認します。

    4. 確認した最新の状況をお客さまへ丁寧にご説明します。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: sorairo_bank
- id: 76cd829a-c548-5c0f-a0ad-02d9fd7ab5fe
  title: dispute_status ツールリファレンス
  body: '`dispute_status`


    【概要】提出された不正利用などの異議申し立て（ディスピュート）の現在の処理状況を確認します。オペレーターが本ツールを呼び出して状況を取得します。


    【引数】

    ・`dispute_id`: 異議申し立て時に割り当てられた固有の識別ID


    【効果】該当する調査案件の現在のステータス（進捗状況）が返却されます。'
