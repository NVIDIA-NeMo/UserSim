- id: 03eef751-eb3e-5133-b2fb-b6571096d34e
  title: 定期預金：お手続きが完了しない・保留中のまま
  body: '定期預金のお申し込み手続き中に、画面が切り替わらない、または「保留中」の状態が続く場合は、以下の点をご確認ください。


    【確認事項と対処法】

    1. 普通預金の残高不足：普通預金口座の残高が、指定した預入金額（最低1,000円）を下回っていないかご確認ください。残高が不足している場合、手続きを完了できません。

    2. 通信環境の不安定：電波状況の良い場所で、再度アプリを起動して状況をご確認ください。

    3. 認証情報の不一致：ご入力いただいた本人確認情報（フルネーム・生年月日）に誤りがないかご確認ください。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、弊社にて調査いたします。お客様の状況を詳しく伺った後、専門のオペレーターへ案件をエスカレーションし、手続きの再開またはキャンセル処理を行います。調査結果は、アプリ内の通知またはご登録の連絡先へ速やかにご案内いたします。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
