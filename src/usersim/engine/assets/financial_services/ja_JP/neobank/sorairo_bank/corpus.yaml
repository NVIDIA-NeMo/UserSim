- id: b612309f-ef18-5d69-aeca-15d09f81dbd7
  title: スマホ送金：他社の一般的な商品との比較
  body: "一般的な銀行の振込サービスと比較した、スマホ送金の特徴は以下の通りです。\n\n・**指定方法**：他社は「金融機関名・支店名・口座番号」が必要ですが、本サービスは「電話番号」のみで完結します。\n\
    ・**コスト**：他社では振込手数料が発生することが一般的ですが、本サービスは0円です。\n・**速度**：即時に資金が移動するため、相手への通知も迅速です。\n\
    \n**【どちらが適しているか】**\n・少額のやり取りを頻繁に行う方、利便性を最優先する方 → **スマホ送金**\n・100,000円を超える高額な送金を行う必要がある方\
