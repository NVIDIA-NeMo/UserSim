- id: e34bdeb8-afc2-5531-9fdc-509456eb5a3e
  title: 目的別口座：重要事項のご説明
  body: '目的別口座のご利用にあたり、以下の重要事項をご確認ください。


    【預金保険制度について】

    目的別口座に預け入れられた資金は、すべて普通預金の一部として取り扱われます。したがって、預金保険制度により、そらいろ銀行が破綻した場合でも、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    【金利の適用について】

    目的別口座の金利は年0.45%（税引前）です。これは普通預金に適用される金利と同等であり、目的別口座に資金を振り替えても金利上の不利はありません。


    【法令遵守について】

    弊社は犯罪収益移転防止法および個人情報保護法を遵守し、厳格な本人確認と情報管理を行っております。口座情報の照会や変更時には、フルネームと生年月日の確認を必須としております。


    【制限事項】

    作成できる目的別口座の数は最大10個までです。これを超える場合は、既存の口座を解約する必要があります。また、自動入金機能を設定する場合、最低設定金額は1,000円となります。


    本機能に関する規定については「目的別口座：規定・約款」をご確認ください。'
