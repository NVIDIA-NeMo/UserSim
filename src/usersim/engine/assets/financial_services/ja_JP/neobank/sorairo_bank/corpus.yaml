- id: 3e260823-b659-5604-bc4c-d0fa9875893e
  title: freeze_card ツールリファレンス
  body: 'デビットカードの利用を一時停止します。


    【シグネチャ】

    `freeze_card(card_id: string)`


    【引数】

    - `card_id`: 利用を停止したいデビットカードの識別子。


    【効果】

    指定されたカードによるすべての決済およびATM利用を即時に停止させます。


    【備考】

    本ツールはエージェントが直接呼び出して実行します。呼び出し前に `verify_identity` による本人確認が完了している必要があります。紛失・盗難時は、本ツール実行後に再発行の手続きを案内してください。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: sorairo_bank
- id: fe88c87d-58e2-5902-8f4d-d6604b766f73
  title: set_card_limits を使う場面
  body: 'お客様から「そらいろVisaデビット」の1日あたりの利用限度額を変更したいという要望を受けた際に、本ツールを使用して手続きを行います。限度額の変更は、セキュリティ上の理由で、また大きな買い物などの一時的なニーズに応じて、アプリまたはオペレーターを通じて設定可能です。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を呼び出し、お客様が提示したカード番号の下4桁から、対象となる `card_id` を特定します。

    3. お客様に、変更後の1日あたりの利用限度額をご希望の金額で提示していただきます。

    4. `set_card_limits` を呼び出し、特定した `card_id` とご希望の限度額を設定します。

    5. 手続きが完了したことをお客様に伝え、アプリ上でも設定内容が反映されていることを案内してください。


    限度額の設定範囲や詳細な制限については、「そらいろVisaデビット：限度額・制限と注意事項」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: sorairo_bank
- id: ce028753-3611-5bd3-bcb6-8f44effd20fe
  title: set_card_limits ツールリファレンス
  body: '「そらいろVisaデビット」の1日あたりの利用限度額を変更するツールです。エージェントはこのツールを直接呼び出すことで、お客様の限度額設定を即時更新します。本ツールを呼び出す前に、必ず
    `verify_identity` による本人確認が完了している必要があります。


    【引数】

    - `card_id`: `get_accounts` で特定したデビットカードの識別子。

    - `daily_limit`: 設定する1日あたりの利用限度額（円）。


    【効果】

    指定されたカードの1日あたりの利用限度額が更新され、以降の決済に適用されます。'
