- id: 56790170-0a15-5ab1-a1e2-7dcd1fcc409b
  title: freeze_card を使う場面
  body: 'そらいろVisaデビットの紛失、盗難、または不正利用の疑いがある場合に、被害拡大を防ぐため、即座にカード機能を停止させるために使用します。


    【手続き手順】

    1. 本人確認を完了させます。

    2. 二次被害を防ぐため、最優先で freeze_card を呼び出し、カードの利用を一時停止します。

    3. カードの紛失または盗難である場合は、そのまま order_replacement_card を案内し、カードの再発行手続きへ進みます。

    4. 状況に応じて、不審な取引がないか取引履歴を確認します。'
