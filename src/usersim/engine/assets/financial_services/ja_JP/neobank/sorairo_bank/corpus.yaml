  institution_id: sorairo_bank
- id: 6b7270bc-7cec-5149-871d-7a86665fc55b
  title: 定期預金：お申込みとご利用条件
  body: 'Q. 定期預金を開設するにはどのような条件がありますか？

    A. 当行の普通預金口座をお持ちの方であれば、どなたでもアプリから簡単にお申し込みいただけます。別途、店舗へお越しいただく必要はございません。


    Q. いくらから預けることができますか？

    A. 最低預入金額は1,000円です。1,000円以上の金額から、ご自由にご設定いただけます。


    Q. 預入期間は自由に選べますか？

    A. 現在、当行では「6か月もの（金利0.7%）」と「1年もの（金利0.9%）」の2つのプランをご用意しております。お客様の資金計画に合わせてどちらかを選択してください。'
