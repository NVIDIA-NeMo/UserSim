  mentions_tools: []
  institution_id: sorairo_bank
- id: 63fe1b3a-17ae-5beb-b093-a7bd6ded28f5
  title: スマホ送金：ご利用条件による違い
  body: '【オペレーター用：スマホ送金 利用条件一覧】


    お客様の状況に応じた利用可否と制限を判定するためのマトリクスです。


    | 条件 | 判定・制限 | 適用される値 |

    | :--- | :--- | :--- |

    | そらいろ銀行の口座を保有 | 利用可能 | 送金手数料 0円 |

    | 本人確認（KYC）が完了済み | 利用可能 | 1回あたり 100,000円 |

    | 登録電話番号が有効である | 利用可能 | 1か月あたり 500,000円 |

    | 相手方が本サービス未設定 | 利用不可 | 送金不能（相手方の設定が必要） |

    | 月間上限額に達している | 制限あり | 次月1日にリセット |


    ※本人確認が未完了のお客様は、まず「普通預金：お申込みとご利用開始」の手順に従い、口座開設および本人確認を完了させてください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: eligibility_matrix
  source_authority: official
