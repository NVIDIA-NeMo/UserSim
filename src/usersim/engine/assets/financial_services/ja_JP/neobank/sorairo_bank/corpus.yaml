- id: 4bbc855f-b55f-53f1-affa-0b43b16c5dbb
  title: 定期預金：明細や記録と合わない
  body: '「アプリ上の残高や利息の計算結果が、自分の想定と異なる」という場合、以下の点をご確認ください。


    **考えられる原因**

    ・**税金の控除**：利息には所得税および住民税がかかります。提示されている金額が「税引き後」であるため、計算上の額より少なく見えることがあります。

    ・**日割り計算の影響**：利息は日単位で計算されるため、預け入れ日によって端数が発生します。


    **解決の手順**

    1. まず、私たちが利息の計算根拠となる「税引き前金額」と「控除された税額」の内訳を提示します。

    2. お客さまにご自身の計算と照らし合わせていただき、相違点があるか確認します。

    3. それでも解決しない、または計算に誤りがあると思われる場合は、専門のオペレーターによるオンライン相談へエスカレーションし、詳細な再照会を行います。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
