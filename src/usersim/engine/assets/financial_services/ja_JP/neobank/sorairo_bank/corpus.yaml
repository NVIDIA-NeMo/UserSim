- id: b17b1e7b-010b-5b21-bf88-82c22d9a26a1
  title: そらいろVisaデビット：限度額・制限と注意事項
  body: 'そらいろVisaデビットのご利用における限度額および制限事項についてご案内します。


    【利用限度額について】

    1日あたりの利用限度額（初期設定）は300,000円です。この限度額は、1日の中で利用可能な最大金額を定めたものであり、口座残高がある場合でも、この金額を超えてのお取引はできません。なお、本商品はデビットカードであるため、利用と同時に預金口座から代金が引き落とされます。口座残高を超えて利用することはできませんのでご注意ください。


    【海外利用時の制限と費用】

    海外の店舗やサイトでご利用いただく際は、海外利用時の事務手数料として2%が加算されます。決済金額にこの手数料が上乗せされて口座から引き落とされます。


    【注意事項】

    ・カードの紛失や盗難に気づいた際は、ただちに銀行へ届け出て利用を停止させる必要があります。速やかな報告がない場合、補償範囲に影響が出る可能性があります。

    ・インターネットでの利用には、セキュリティ向上のため本人認証サービス（EMV 3-Dセキュア）が利用されます。


    詳細な商品概要については、「そらいろVisaデビット：商品概要」をご参照ください。'
