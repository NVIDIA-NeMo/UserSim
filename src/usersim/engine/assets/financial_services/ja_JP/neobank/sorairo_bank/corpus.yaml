- id: 47fb8ce3-fd42-56df-ab66-c0e161fba926
  title: そらいろVisaデビット：よくあるお手続きの流れ
  body: '「そらいろVisaデビット」のお申し込みから利用開始までの流れをご案内します。


    **【お手続きの手順】**

    1. **お申し込み**：チャットにて「デビットカードを申し込みたい」とお伝えください。

    2. **本人確認**：マイナンバーカードのICチップ読み取りによるオンライン本人確認（eKYC）を行います。画面の指示に従って読み取りを完了させてください。

    3. **審査・発行**：当行にて厳格な取引時確認を行い、発行手続きに入ります。

    4. **カード受取**：ご登録住所にカードが届きます。届いたカードをアプリで有効化してください。


    **【完了の目安】**

    カードの有効化が完了し、アプリ上のステータスが「利用可能」になれば、即座に0.8%のキャッシュバック付き決済が開始できます。'
  domain: cards
  product_category: sorairo_debit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 128704bf-e56b-543c-a739-7aea4b375703
  title: そらいろVisaデビット：明細や記録と合わない
  body: 'ご利用明細の金額が予想と異なる場合の確認手順をご案内します。


    **【確認すべきポイント】**

    1. **海外利用事務手数料の有無**：海外加盟店で利用した場合、決済金額に加えて2%の手数料が加算されています。これが原因で金額が増えている可能性があります。

    2. **キャッシュバックの計算**：還元額は0.8%で計算されます。端数処理により、想定額とわずかに異なる場合があります。

    3. **仮押さえ（オーソリゼーション）**：ホテルやレンタカーなどの利用時、実際より高い金額が一時的に「保留」として記録されることがあります。


    **【対応策】**

    上記を確認しても不一致がある場合は、当行へ詳細を伝えてください。調査を行い、不適切な請求が判明した場合は、預金者保護法に基づき適切な補償手続きを行います。'
  domain: cards
  product_category: sorairo_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 63774c58-b9e7-5c1f-b64f-14269780925d
  title: スマホ送金：商品概要
  body: '「スマホ送金」は、相手の口座番号や店番号を調べる手間なく、電話番号だけで簡単にお金を送ることができるサービスです。ご友人やご家族間での割り勘や少額のやり取りを、よりスムーズでシンプルにします。


    **【サービスの特徴】**

    *   **手数料：** 常に0円でご利用いただけます。

    *   **利便性：** 電話番号を指定するだけで送金が完了します。


    **【ご利用限度額】**

    *   **1回あたりの送金上限額：** 100,000円

    *   **1か月あたりの送金合計上限額：** 500,000円


    日常的な小さなお金のやり取りに最適なツールです。詳細な条件については、「スマホ送金：お申込みいただける方」をご確認ください。'
