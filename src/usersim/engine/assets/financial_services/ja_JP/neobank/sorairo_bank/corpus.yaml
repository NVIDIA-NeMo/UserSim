- id: eeff5a1b-d402-5449-8fad-d19d48e810f7
  title: スマホ送金：不正利用からお客さまを守るために
  body: 'スマホ送金をご利用の際は、以下の点に十分ご注意ください。


    **【特にご注意いただきたい詐欺の手口】**

    「至急、送金を完了させてください」といった不安を煽るSMSやメールが届き、偽のログイン画面へ誘導して二段階認証コードを盗み出すフィッシング詐欺が報告されています。


    **【当行が絶対に行わないこと】**

    そらいろ銀行が、メールやチャットで二段階認証コードや暗証番号を直接お伺いすることはありません。


    **【異常を感じた時の対応】**

    身に覚えのない送金通知が届いた場合や、認証情報を教えてしまった場合は、直ちにご連絡ください。迅速に口座の利用停止と調査を行います。


    預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として銀行が補償を行う体制を整えています。'
  domain: retail_banking
