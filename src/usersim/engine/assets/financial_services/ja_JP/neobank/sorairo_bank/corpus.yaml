  institution_id: sorairo_bank
- id: 96e35ca8-1395-527f-993c-c3dd8e602b79
  title: 目的別口座：規定・約款
  body: '本規定は、目的別口座の利用条件を定めるものです。


    **1. サービスの提供範囲**

    お客さまは、普通預金口座に紐づく形で、最大10個まで目的別口座を作成し、資金を分けて管理することができます。


    **2. 金利の適用**

    目的別口座に預け入れた資金には、普通預金と同様の年率0.45%の金利が適用されます。金利は市場状況により変動する場合があり、その際はアプリ内でお知らせいたします。


    **3. 自動入金機能**

    自動入金設定をご利用の場合、1回あたりの最低設定金額は1,000円となります。残高不足等により入金ができなかった場合の責任は負いかねます。


    **4. 合意の終了**

    目的別口座の解約、または親口座となる普通預金口座の解約により、本契約は終了します。解約時に残高がある場合は、速やかに普通預金口座へ払い戻されます。'
