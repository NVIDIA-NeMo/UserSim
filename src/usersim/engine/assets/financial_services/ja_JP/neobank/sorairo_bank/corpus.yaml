  title: file_transaction_dispute を使う場面
  body: 'そらいろVisaデビットにおいて、お客さまが「身に覚えのない利用がある」と報告された場合に、調査と補償の申出を受け付けるために使用します。


    【手続き手順】

    1. 本人確認を完了させます。

    2. get_account_transactions を使用して取引履歴を確認し、問題となっている取引の transaction_id を特定します。

    3. 預金者保護法に基づき、故意や重大な過失がない限り原則補償される方針であることを説明します。

    4. file_transaction_dispute を呼び出し、正式に調査依頼を起票します。'
