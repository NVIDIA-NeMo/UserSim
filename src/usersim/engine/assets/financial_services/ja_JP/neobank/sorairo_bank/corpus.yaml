- id: 8bf7db81-d36f-5cdb-891e-ab89c2a1a715
  title: 定期預金：6か月ものの金利について
  body: '【質問】6か月ものの定期預金を利用した場合、金利はどのくらいになりますか？

    【回答】6か月もの定期預金の金利は0.7%です。


    【質問】6か月ものの定期預金を始めるために、最低限必要な金額はありますか？

    【回答】最低預入金額は1,000円となっております。1,000円以上の金額であれば、アプリから簡単にお申し込みいただけます。


    詳細な金利については、「定期預金：金利・料率一覧」をご確認ください。'
