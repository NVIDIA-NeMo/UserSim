- id: 9936ba3a-b45f-5272-ab8a-9349e71154c1
  title: 目的別口座：この商品をかたる詐欺にご注意ください
  body: 'そらいろ銀行では、お客様の資産を安全に守るため、セキュリティの強化に努めておりますが、最近「目的別口座」の機能を悪用したり、当行の職員をかたったりして、お客様の個人情報を盗み出そうとする詐欺メールやメッセージなどの被害が報告されています。特に、他行の口座と比較して利便性の高いデジタルサービスを謳い、急ぎの手続きを促す手口にご注意ください。


    当行のオペレーターが、お問い合わせの際にお客様のフルネームと生年月日の確認を行うことはございますが、以下の情報はどのような場合であっても絶対にお聞き出しいたしません。


    ・暗証番号

    ・ログインパスワード

    ・キャッシュカード番号やCVV（セキュリティコード）

    ・マイナンバーカードなどの身分証番号


    もし、不審な連絡を受けたり、心当たりのない送金指示や情報の入力を求められた場合は、直ちに入力を中断し、当行の公式チャネルを通じてご連絡ください。また、万が一不正利用の疑いがある場合は、速やかに届出をお願いいたします。預金者保護法および当行の規定に基づき、公正な調査と補償手続きを速やかに行います。


    詳細は「目的別口座：不正利用からお客さまを守るために」をご確認ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
