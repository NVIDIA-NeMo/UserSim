- id: 23711517-6e63-5674-aff4-2f9301367572
  title: そらいろVisaデビット：手数料と費用
  body: 'Q：カードを維持するための年会費はかかりますか？

    A：いいえ、そらいろVisaデビットの年会費は0円です。どなたでも無料でご利用いただけます。


    Q：海外のサイトや店舗で利用したときに追加費用はかかりますか？

    A：はい。海外利用時の事務手数料として、利用金額の2%が加算されます。


    Q：キャッシュバックはどのように適用されますか？

