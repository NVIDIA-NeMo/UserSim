  body: '定期預金のお申し込み条件は以下の通りです。


    ・そらいろ銀行の口座保有：必須（普通預金口座をお持ちの方）

    ・本人確認手続き：完了済みであること（犯罪収益移転防止法に基づく取引時確認済みの方）

    ・最低預入金額：1,000円以上の資金を普通預金口座に保有していること


    上記条件をすべて満たしているお客様は、いつでもアプリから定期預金のお申し込みが可能です。'
