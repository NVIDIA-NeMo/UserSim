  title: close_account ツールリファレンス
  body: '指定された口座を解約し、閉鎖します。この操作は取り消しができないため、実行前に必ず残高確認と顧客同意を得てください。


    **引数：**

    - account_id：`get_accounts` 等で取得した、解約対象の口座識別子。'
