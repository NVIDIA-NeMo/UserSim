- id: eebd9fda-b7d0-523f-a52a-7526776d4739
  title: 定期預金：実施中のキャンペーン
  body: '【期間限定】定期預金・新規開設応援キャンペーンを実施中です！


    期間中に初めて定期預金を開設いただいたお客様を対象に、特別金利を適用いたします。


    【キャンペーン期間】

    2026年1月1日 〜 2026年3月31日


    【キャンペーン特典】

    期間中に「1年もの」の定期預金（最低1,000円以上）を新規に開設された方に、通常金利0.9%に加えて、さらに年0.1%のボーナス金利を上乗せいたします（合計1.0%）。


    【ご注意】

    ・本キャンペーンは、期間中に初めて定期預金を開設される方が対象です。

    ・ボーナス金利は、対象期間中に開設された口座の満期時まで適用されます。


    この機会に、ぜひお得な金利で資産形成を始めてください。'
