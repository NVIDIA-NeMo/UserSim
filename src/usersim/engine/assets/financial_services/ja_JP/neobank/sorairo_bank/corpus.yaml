  institution_id: sorairo_bank
- id: 8bc3280b-2bb0-532f-8572-205c121f88cf
  title: 目的別口座：ほかの選択肢との比較と向かない場合
  body: '目的別口座は、日々の資金管理を直感的に行いたい方に最適な機能ですが、目的によっては他の商品の方が適している場合があります。


    【目的別口座が適しているケース】

    ・「旅行」「車」「貯金」など、用途別に資金を分けて視覚的に管理したい。

    ・急に資金が必要になる可能性があるため、いつでも自由に引き出したい。

    ・普通預金の金利（0.45%）を維持しつつ、計画的に貯金したい。


    【向かないケースと推奨される代替案】


    1. より高い金利で確実な資産形成を目指したい場合

    目的別口座は利便性が高い反面、金利は普通預金と同等です。より高い金利を希望される場合は、「定期預金」をご検討ください。


    2. 長期的な資産運用（投資）を行いたい場合

    預金は元本が保護されますが、物価上昇などのリスクがあります。積立投資による資産形成を検討される場合は、新NISAの「つみたて投資枠」や「成長投資枠」の活用をご案内いたします。


    3. 非常に多額の資金を細かく管理したい（11個以上の目的がある）場合

    本機能で作成できる目的別口座の数は最大10までです。それ以上の細分化が必要な場合は、管理方法を整理いただくか、他の管理手段を併用いただく必要があります。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 4f1ef7d7-ddf8-5452-9e40-2d0207afa675
  title: 目的別口座：お申込みとご利用条件
  body: 'Q. 目的別口座を利用するために、別途申し込み手続きは必要ですか？


    A. いいえ、当行の普通預金口座をお持ちのお客様であれば、追加の手続きなしでアプリからいつでも目的別口座を作成いただけます。


    Q. 最大でいくつの目的別口座を作れますか？


    A. お一人様につき、最大10まで作成いただけます。


    Q. 自動入金設定を利用する場合、最低いくらから設定できますか？


    A. 自動入金の最低金額は1,000円からとなっております。1,000円以上の金額を、自由なタイミングで設定してご利用ください。


    Q. 目的別口座に預けている資金の金利はどうなりますか？


    A. 普通預金と同じ0.45%の金利が適用されます。'
