- id: 6a23fbf4-abcc-5c74-80cf-204c0459fc15
  title: 定期預金：よくあるお手続きの流れ
  body: '定期預金を新しく開設するための手続きの流れをご案内します。すべてアプリ内で完結いたします。


    【準備するもの】

    ・そらいろ銀行公式アプリ

    ・普通預金口座の残高（1,000円以上）


    【お手続きの手順】

    1. オペレーターにフルネームと生年月日を伝え、本人確認を完了させてください。

    2. アプリのメニューから「定期預金」を選択し、「新しく作成する」ボタンをタップします。

    3. 預入金額を入力します。最低預入金額の1,000円以上である必要があります。

    4. 預入期間を選択します。「6か月もの（金利0.7%）」または「1年もの（金利0.9%）」のいずれかを選択してください。

    5. 確認画面で、金額と期間、および適用金利に間違いがないかを確認し、「確定」をタップします。

    6. 普通預金から指定の金額が定期預金へ振り替えられ、手続きが完了します。


    【完了の確認】

    手続き完了後、アプリの定期預金一覧画面に、今作成した口座が表示されていれば成功です。また、振替元の普通預金口座の残高が正しく減少していることをご確認ください。'
