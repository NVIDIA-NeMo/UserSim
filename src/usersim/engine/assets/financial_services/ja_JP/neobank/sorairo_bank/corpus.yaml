  title: そらいろVisaデビット：不正利用からお客さまを守るために
  body: 'そらいろVisaデビットをご利用のお客さまは、フィッシング詐欺などの不正利用に十分ご注意ください。銀行員やカード会社を装い、メールやSMSで「口座を制限した」と不安を煽り、個人情報を入力させる手口が増えています。


