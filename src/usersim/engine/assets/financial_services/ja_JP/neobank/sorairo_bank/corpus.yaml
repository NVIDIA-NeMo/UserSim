- id: 1979b429-affe-5d7d-90d5-0789bcaf25b2
  title: そらいろVisaデビット：安全にご利用いただくためのポイント
  body: 'そらいろVisaデビットを安全にご利用いただくために、以下のポイントを必ずご確認ください。


    ■不正利用を防ぐための対策

    インターネットショッピングの際は、本人認証サービス（EMV 3-Dセキュア）の設定を推奨しています。これにより、決済時のセキュリティが大幅に向上します。また、アプリ内で「利用限度額」を適切に設定し、必要以上の設定を避けることで、万が一の被害を最小限に抑えることができます。


    ■当行が絶対にお聞きしないこと

    そらいろ銀行では、いかなる場合においても、お客様の暗証番号、パスワード、カード番号、CVV（セキュリティコード）、身分証番号などを、電話やメール、チャットでお聞きすることはありません。これらの情報を求める連絡があった場合は、詐欺の可能性が非常に高いため、絶対に応答せず、ただちに当行へご連絡ください。


    ■異常に気づいたときの対応

    カードの紛失や盗難、または身に覚えのない利用通知が届いた場合は、ただちにアプリからカードの利用停止手続きを行ってください。迅速な届け出により、預金者保護法および当行規定に基づいた公正な補償手続きが可能となります。詳細については「そらいろVisaデビット：不正利用からお客さまを守るために」をご参照ください。'
