- id: 5e323da4-e641-507e-9145-1a36a322605f
  title: 定期預金：ご紹介・継続利用の特典
  body: 'そらいろ銀行をご愛顧いただいているお客さまへ、特別なご紹介特典をご案内いたします。


    ご友人やご家族に当行のサービスをご紹介いただき、新しく口座を開設された方が「定期預金」をご利用になると、ご紹介者様とご入会者様の両方に特典を差し上げます。当行の定期預金は、6か月もので0.7%、1年もので0.9%という競争力のある金利をご提供しており、効率的な資産形成に最適です。


    また、継続的に当行をメイン口座としてご利用いただいているお客さまには、定期預金の満期後、自動継続を選択されることでさらなる利便性と安心をお届けします。最低預入金額1,000円から手軽に始められるため、少額からの積み上げをサポートいたします。詳細はアプリ内のキャンペーンページをご確認ください。'
