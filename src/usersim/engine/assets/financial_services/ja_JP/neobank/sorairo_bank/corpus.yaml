- id: cdd6142c-1975-5456-b0c6-ba9fd40e39f0
  title: スマホ送金：リスクについてのご説明
  body: 'スマホ送金をご利用いただく前に、以下のリスクについて十分にご理解ください。


    **【誤送金のリスク】**

    電話番号による指定のため、連絡先の選択ミスにより、意図しない相手に送金してしまう可能性があります。一度完了した送金は、当行の操作のみで取り消すことはできず、受取人の同意が必要です。必ず送信前に相手の名前と番号を再確認してください。


    **【利用制限による制約】**

    安全な取引を確保するため、1回あたり100,000円、1か月あたり500,000円という限度額を設けております。急ぎでこれ以上の金額を送金したい場合は、他の振込手段をご検討ください。


    **【なりすましリスク】**

    スマートフォンの紛失や、二段階認証コードの漏洩により、第三者に不正に送金されるリスクがあります。端末のロックおよび認証情報の管理を徹底してください。'
