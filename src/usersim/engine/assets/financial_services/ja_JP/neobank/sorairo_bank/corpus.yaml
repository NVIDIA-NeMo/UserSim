- id: 8c53a0e7-e95c-5e25-89be-7f41f2d964d2
  title: スマホ送金：登録内容の変更
  body: 'スマホ送金に使用する電話番号などの登録内容を変更する手順をご案内します。セキュリティ保護のため、ご本人様確認の上で手続きを行います。


    ■お手続き前に必要なもの

    ・ご本人様確認ができる情報（フルネーム・生年月日）

    ・新しく登録する電話番号が利用可能なスマートフォン


    ■変更手順

    1. ご本人様確認

    オペレーターに、お客様のフルネームと生年月日をお伝えください。


    2. 変更内容の申告

    「スマホ送金の登録電話番号を変更したい」旨をお伝えください。変更後の新しい電話番号を提示します。


    3. 確認コードの受信と入力

    新しい電話番号宛に、認証用の確認コードが送信されます。アプリ上の指定画面にそのコードを入力してください。


    4. 変更完了の確認

    画面に「登録内容の変更が完了しました」というメッセージが表示され、登録情報画面に新しい電話番号が反映されていれば完了です。


    ※もし認証コードが届かない場合は、入力した番号に誤りがないか、または通信環境を確認してください。'
