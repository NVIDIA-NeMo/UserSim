- id: eaf9cf26-7c60-573e-a508-174412abf7f1
  title: 普通預金：ログインできない・アクセスできない
  body: 'アプリにログインできない、またはアクセスできない場合は、以下の点を確認してください。


    **【確認事項と解決策】**

    * **二段階認証の不整合**: ワンタイムパスワードが正しく入力されているか確認してください。

    * **端末の変更**: 機種変更をされた場合、前端末の認証設定が残っているためログインできません。アプリの「認証再登録」から手続きを行ってください。

    * **通信環境**: インターネット接続が安定しているかご確認ください。


    **【解決しない場合】**

    上記を確認してもログインできない場合は、専門のオペレーターによるオンライン相談へエスカレーションいたします。本人確認後、認証情報の初期化などの対応を行い、再ログインが可能な状態になります。'
