- id: 1700fffa-9a45-51cb-b50b-adceff6b231d
  title: 普通預金：この商品をかたる詐欺にご注意ください
  body: 'そらいろ銀行の普通預金サービスをかたり、お客様の個人情報や資産を狙う詐欺が発生しています。不審なメールやSMS、電話には十分ご注意ください。


    【詐欺の典型的なパターン】

    「口座に制限がかかったため解除手続きが必要です」「金利アップのキャンペーンに当選しました」といった内容で、外部サイトへ誘導し、個人情報の入力を求める手口が見られます。


    【当行が絶対に行わないこと】

    そらいろ銀行が、メールや電話、チャットを通じてお客様の暗証番号、パスワード、カード番号、CVV、身分証番号などを聞き出すことは一切ございません。これらの情報を求める連絡はすべて詐欺です。


    【万が一の対応と保護】

    不審な連絡を受けた場合や、誤って情報を入力してしまった場合は、速やかに当行へご連絡ください。当行は預金保険制度に基づき、利息のつく普通預金について、1金融機関につき預金者1人当たり元本1,000万円までとその利息等を保護する安全な環境を提供しておりますが、詐欺被害を防ぐにはお客様の迅速な届出が不可欠です。


    不審な点がある場合は、まずアプリ内の公式サポート窓口へご確認いただくか、詳細を「普通預金：不正利用からお客さまを守るために」にてご確認ください。'
