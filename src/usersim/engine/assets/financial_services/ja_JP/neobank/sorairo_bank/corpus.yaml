- id: 37710242-f948-5e45-846d-5324570d9e9e
  title: 定期預金：解約・変更・プランの切替え
  body: '定期預金の解約や期間の変更は、アプリから以下の手順でお手続きいただけます。


    **お手続きの流れ**

    1. アプリの口座一覧から、対象の定期預金を選択し、「解約」または「プラン変更」を依頼してください。

    2. 二段階認証画面が表示されますので、認証コードを入力して本人確認を完了させてください。

    3. 解約の場合、現在の解約時点での適用金利に基づいた受取金額（元本＋利息）が表示されますので、内容を確認して確定してください。

    4. 手続きが完了すると、即座に指定の普通預金口座へ資金が振り込まれます。


    **完了の確認**

    手続き完了後、アプリの取引履歴に「定期預金解約」として金額が記載され、普通預金の残高が増加していれば完了です。プラン変更の場合は、新しく設定した期間と金利が詳細画面に反映されます。'
