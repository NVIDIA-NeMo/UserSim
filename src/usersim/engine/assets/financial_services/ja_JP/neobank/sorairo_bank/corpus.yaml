- id: 07d97408-ccaf-5b3f-9199-063aae6dc839
  title: open_time_deposit ツールリファレンス
  body: '普通預金口座から指定の金額を、指定の期間で「定期預金」として預け入れるツールです。エージェントはこのツールを直接呼び出して口座を開設します。呼び出し前に
    `verify_identity` による本人確認が必須です。


    【引数】

    - `account_id`: `get_accounts` で特定した、原資となる普通預金口座の識別子。

