- id: 8775fed8-1c14-5c2e-ba76-ab8d3adb2744
  title: 普通預金：他行あて振込手数料の無料回数（月、基本）について
  body: '【Q】他行への振込手数料は、月に何回まで無料になりますか？

    【A】普通預金口座をご利用のお客さまは、他行あて振込手数料が月に2回まで無料でご利用いただけます。


    【Q】無料回数を超えて振込をした場合は、いくらかかりますか？

    【A】月2回の無料枠を超えた後は、1回につき145円の手数料が発生いたします。


    【Q】無料回数はいつリセットされますか？

    【A】毎月1日にリセットされます。月途中で回数を確認したい場合は、アプリの履歴画面よりご確認いただけます。


    詳細は「普通預金：手数料一覧」をご参照ください。'
