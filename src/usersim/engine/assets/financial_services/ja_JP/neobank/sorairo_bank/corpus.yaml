- id: 48909f63-8774-5dfa-950c-19f928d989bd
  title: 普通預金：切替えや上位プランを検討するとき
  body: '【サポート担当者向け：プラン検討時の案内】


    お客様が資産運用の効率化を検討されている場合、普通預金（sorairo_futsu）と他の商品の特性を比較して案内してください。


    ■普通預金（本商品）

    ・特徴：いつでも出金可能で、日常的な資金管理に最適。金利は0.45%と競争力があります。

    ・適した方：生活費の管理や、急な出金に備えたい方。


    ■定期預金（sorairo_teiki）

    ・特徴：普通預金よりも高い金利で、確実な資産形成を目指せます。ただし、原則として満期まで出金が制限されます。

    ・適した方：当面使う予定のない資金を、より高い金利で運用したい方。


    ■目的別口座

    ・特徴：一つの普通預金の中で、最大10個まで貯金箱のように資金を分けて管理できます。

    ・適した方：旅行や車などの目的ごとに、計画的に貯金したい方。


    お客様の利用目的が「流動性」か「確実な蓄財」か、あるいは「管理のしやすさ」かを確認し、最適な選択肢を提案してください。'
