- id: 96464648-3598-57b4-bfcc-c3c4184c1c2e
  title: 普通預金：お取引が拒否された・制限された
  body: '**【症状】**

    振込や出金の手続き中にエラーが表示され、取引が完了できない。


    **【考えられる原因と確認事項】**

    1. **残高不足**：振込金額や手数料（無料枠を超えている場合は145円または110円）を含めた十分な残高があるか確認してください。

    2. **認証エラー**：二段階認証のコード入力に誤りがないか、または機種変更後の再登録が完了しているか確認してください。

    3. **制限の適用**：犯罪収益移転防止法に基づく取引時確認が必要な場合や、不審なアクセスを検知して一時的に制限がかかっている可能性があります。


    **【解決策】**

    * 残高を補充するか、認証情報を正しく再入力してください。

    * 制限がかかっている場合は、当行の専門オペレーターによるオンライン相談にて、本人確認手続きを行ってください。'
