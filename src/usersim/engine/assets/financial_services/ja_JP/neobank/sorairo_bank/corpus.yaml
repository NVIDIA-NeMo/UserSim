  institution_id: sorairo_bank
- id: 9da6cb90-35d6-5c77-a1cf-77018fae3987
  title: 普通預金：手数料一覧
  body: '普通預金のご利用に関する手数料は以下の通りです。ユーザーさまの利便性を最大化するため、基本回数の無料枠を設けております。


    ■他行あて振込手数料

    ・月間の無料回数（基本）：2回

    ・無料回数を超えた際の手数料：145円/回


    ■提携ATM出金手数料

    ・月間の無料回数（基本）：2回

    ・無料回数を超えた際の手数料：110円/回


    ※無料回数は毎月1日にリセットされます。回数のご確認はアプリ内の履歴よりお願いいたします。'
