- id: 267c5b5a-fe95-55cd-88dd-a7df2f88dd6e
  title: 定期預金：重要事項のご説明
  body: '定期預金のご利用にあたり、以下の重要事項を必ずご確認ください。


    **【預金保険制度について】**

    当行は預金保険制度の加入金融機関です。預金保険法に基づき、利息のつく預金は、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    **【金利と税金について】**

    - 適用金利は6か月 0.7%、1年 0.9%（税引前）です。

    - お受取となる利息には、所得税および住民税などの税金が課せられます。


    **【中途解約について】**

    満期日前に解約される場合は、当初の適用金利ではなく、中途解約利率が適用されます。あらかじめご了承ください。'
