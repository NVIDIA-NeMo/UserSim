- id: f57c9af5-6fb5-56da-b72c-f798e840cded
  title: send_phone_transfer を使う場面
  body: 'お客様が「スマホ送金」を利用して、相手の電話番号だけで手軽に送金したいと希望された際に、本ツールを使用して送金手続きを行います。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `get_accounts` を呼び出し、送金元となる普通預金口座の `account_id` を特定します。

    3. 送金先の「携帯電話番号」と「送金金額」を確認します。なお、本サービスは1回10万円までの少額送金に特化したサービスであることを案内してください。

    4. 重要事項として、「送金完了後は取り消しができない」ことを明確に伝え、お客様の同意を得てください。

    5. `send_phone_transfer` を呼び出し、送金を実行します。

    6. 送金完了を伝え、相手方に通知が届く旨を案内してください。


    上限額などの詳細については、「スマホ送金：商品概要」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_phone_transfer
  institution_id: sorairo_bank
- id: a9ae4cb3-4744-5598-9aca-3774427edc6f
  title: send_phone_transfer ツールリファレンス
  body: '相手の携帯電話番号を指定して、即時に送金を行うツールです。エージェントはこのツールを直接呼び出して送金を完了させます。呼び出し前に `verify_identity`
    による本人確認が必須です。


    【引数】

    - `account_id`: `get_accounts` で特定した、送金元の普通預金口座の識別子。

    - `recipient_phone_number`: 送金先相手の携帯電話番号。

    - `amount`: 送金金額（円）。最大10万円まで。


    【効果】

    指定された金額が即座に送金されます。この操作は不可逆的であり、一度実行すると取り消すことはできません。'
  domain: retail_banking
  product_category: procedure
