    *   メールやチャットで暗証番号や二段階認証のコードを伺うことはありません。

    *   不自然なURLへ誘導し、パスワードの再設定を急かすことはありません。


    **【異変に気づいたら】**

    身に覚えのない利用明細を見つけたり、カードを紛失したりした場合は、すぐにカードの利用停止手続きを依頼してください。迅速な対応により被害を最小限に抑えられます。


    なお、預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償を行う体制を整えております。'
