  title: そらいろVisaデビット：切替えや上位プランを検討するとき
  body: 「そらいろVisaデビット」は年会費0円でどなたでもご利用いただけるため、個別の「上位プラン」は設けておりません。しかし、より高度な資産管理を希望される場合は、本カードをベースに「目的別口座：商品概要」などの貯蓄ツールを併用することで、計画的な支出と管理を両立させることが可能です。
