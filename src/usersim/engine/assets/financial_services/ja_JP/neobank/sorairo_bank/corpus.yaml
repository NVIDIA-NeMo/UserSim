- id: 647ad553-35c0-540b-8258-712f0ce5c29f
  title: そらいろVisaデビット：重要事項のご説明
  body: 'そらいろVisaデビットのご利用にあたり、以下の重要事項をご確認ください。


    【決済の仕組み】

    本カードはデビットカードであり、利用と同時に連携する預金口座から代金が引き落とされます。口座残高を超えて利用することはできません。残高不足の場合は決済が拒否されます。


    【セキュリティと本人認証】

    インターネットでの利用には、安全性を高めるための本人認証サービス（EMV 3-Dセキュア）が導入されています。また、アプリにていつでも利用限度額（初期設定
    300,000円）の変更や、カードの利用停止手続きが行えます。


    【紛失・盗難および不正利用への対応】

    カードの紛失や盗難に気づいた場合は、ただちに銀行へ届け出てください。不正利用による被害については、銀行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となります。なお、キャッシュカード機能を含む偽造・盗難による不正払戻しについては、預金者保護法に基づき、故意や重大な過失がない限り原則として補償されます。


    【手数料】

    海外利用時には 2% の事務手数料が発生します。また、本カードの年会費は 0円 です。


    法令上の詳細については、「法令・制度に関するご案内：デビットカード」をご参照ください。'
