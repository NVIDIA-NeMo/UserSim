- id: 41aec122-9d3a-540d-b41c-c6b19c8a00a8
  title: close_account を使う場面
  body: 'お客さまから口座の解約依頼を受けた際に本手続きを行います。なお、本操作は取り消し不可（不可逆的）であるため、十分な注意が必要です。


    **【手続きの流れ】**

    1. 本人確認を完了させます。

    2. `get_accounts` を使用して、解約対象の account_id を特定します。

    3. 対象口座の残高が 0円 であることを確認します。残高がある場合は、先に `transfer_funds` 等で資金を移動していただくよう案内してください。

    4. 解約後の資金返還先や、紐づくサービスの停止について説明し、同意を得ます。

    5. `close_account` を呼び出し、口座を完全に閉鎖します。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: sorairo_bank
