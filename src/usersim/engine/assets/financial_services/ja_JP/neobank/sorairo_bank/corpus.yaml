  title: スマホ送金：この商品をかたる詐欺にご注意ください
  body: '最近、当行の「スマホ送金」サービスをかたった、巧妙なフィッシング詐欺の報告が増えています。不審なSMSやメールに記載されたURLを安易にクリックしないでください。


    **特にご注意いただきたい点**

    - 当行がメールやSMSで、二段階認証のコードやパスワードを直接伺うことは絶対にございません。

    - 「限度額を上げるため」に外部サイトへ誘導し、個人情報を入力させる手口にご注意ください。


    万が一、不審なメッセージを受け取った場合や、誤って情報を入力してしまった場合は、直ちにご連絡ください。迅速に口座の利用停止と調査を行い、お客様の資産を守ります。詳細は「スマホ送金：不正利用からお客さまを守るために」をご確認ください。'
