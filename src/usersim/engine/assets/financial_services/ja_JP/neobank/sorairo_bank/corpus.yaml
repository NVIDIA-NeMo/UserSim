- id: f57c9af5-6fb5-56da-b72c-f798e840cded
  title: send_phone_transfer を使う場面
  body: 'お客さまから「電話番号を使って、友人に少額の送金をしたい」という依頼を受けた際に、本手続きを行います。スマホ送金の手数料は0円です。


    【手続きの流れ】

    1. 本人確認を行い、お客さまの身元を確定させます。

    2. get_accounts を使用して、送金元口座の account_id を特定します。

    3. 送金先の携帯電話番号と送金金額（1回100,000円まで）を伺います。

    4. **「送金完了後は取り消しができない」**ことを明確に伝え、同意を得ます。

    5. send_phone_transfer を呼び出し、送金を完了させます。'
