- id: da647bf0-b5db-5942-8960-b47a113964e7
  title: 普通預金：ご利用開始までの手順
  body: 'サポート担当者は、お客さまに以下の手順をご案内ください。普通預金の開設はスマートフォンアプリで完結します。


    **【ご利用開始までのフロー】**

    1. **アプリのインストール**: 公式ストアからそらいろ銀行アプリをダウンロードしていただきます。

    2. **本人確認手続き**: マイナンバーカードのICチップ読み取りによるオンライン本人確認（取引時確認）を必須として案内してください。

    3. **口座情報の登録**: 氏名、住所、生年月日などの必要情報を入力し、口座開設を完了させます。

    4. **二段階認証の設定**: セキュリティ確保のため、ログインおよび振込時に使用する二段階認証の設定を完了していただきます。


    以上の手順が完了し、口座開設の審査が承認された時点で、0.45%の金利が適用される普通預金のご利用が可能になります。'
