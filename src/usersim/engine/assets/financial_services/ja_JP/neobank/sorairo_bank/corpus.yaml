  institution_id: sorairo_bank
- id: 7a94fdfd-8800-5aae-902a-6dffb69f1e5d
  title: 法令・制度に関するご案内：預金・日常のお取引
  body: 'そらいろ銀行は、金融庁の監督の下、銀行法および個人情報保護法を厳格に遵守して運営しております。お客さまに安心してお取引いただくため、以下の制度を導入しています。


    ■預金保険制度について

    預金保険制度に基づき、利息のつく預金は、1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    ■本人確認について

    犯罪収益移転防止法に基づき、口座開設時にはマイナンバーカードのICチップ読み取りによる厳格なオンライン本人確認（取引時確認）を実施しております。'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 67b5e16a-2479-5b81-be06-fb67a7f02fc3
  title: 法令・制度に関するご案内：デビットカード
  body: 'そらいろVisaデビットのご利用にあたり、お客さまの資産を守るため以下の体制を整えております。


    ■不正利用への対応

    フィッシング詐欺や不正送金などの被害報告を受けた際は、迅速にカードの利用停止および調査を行います。


    ■補償について

    預金者保護法に基づき、お客さまに故意または重大な過失がない限り、原則として銀行が被害額を補償いたします。万が一、身に覚えのない利用がある場合は、速やかにアプリまたはサポートセンターまでご連絡ください。'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: e440e8b2-49a9-53b7-9a3a-28bdb1a490c9
  title: get_account_transactions を使う場面
  body: 'お客さまから入出金明細の確認や、特定の取引内容について問い合わせがあった際に、取引履歴を照会するために使用します。


    【手続き手順】

    1. 本人確認を行い、認証が完了していることを確認します。

    2. お客さまから提示された口座番号の下4桁などの情報に基づき、get_accounts を使用して対象の account_id を特定します。

    3. get_account_transactions を呼び出し、該当口座の取引履歴を取得します。

    4. 取得した情報をもとに、お客さまへ取引日時、金額、相手先などの詳細を案内します。'
