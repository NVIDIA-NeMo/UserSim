- id: cdcde593-853b-50e4-a758-cd5962b64091
  title: file_transaction_dispute を使う場面
  body: 'お客様から「そらいろVisaデビット」で身に覚えのない利用がある、あるいは請求金額が正しくないといった不正利用や紛争の申出を受けた場合に、このツールを使用して調査と補償の手続きを開始します。


    【手順】

    1. 本人確認の実施

    `verify_identity` を呼び出し、お客様のフルネームと生年月日を確認します。


    2. カード識別子の特定

    `get_accounts` を呼び出し、お客様が利用しているデビットカードの `card_id` を特定します。


    3. 対象取引の特定

    お客様が指摘している不審な取引について、日付や金額を確認し、該当する `transaction_id` を特定します（必要に応じて `get_account_transactions`
    を併用します）。


    4. 紛争申出の受理

    `file_transaction_dispute` を呼び出し、`card_id`、`transaction_id`、およびお客様が述べた理由（例：カードを所持していたが身に覚えがない等）を登録します。


    5. 今後の案内

    銀行の規定に基づき、公正な調査が行われること、および結果に応じて補償手続きが進むことを案内します。


    【注意事項】

    - 不正利用の疑いがある場合は、併せて `freeze_card` によるカード停止を提案してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
