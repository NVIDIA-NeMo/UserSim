- id: eb103409-5de2-5f7e-9a6d-331506575208
  title: 普通預金：お申込みとご利用開始
  body: 'そらいろ銀行の普通預金口座は、スマートフォンアプリから最短数分でお申込みいただけます。お手元にマイナンバーカードをご用意ください。


    【お手続きの手順】

    1. 本人確認の開始：アプリの案内に従い、フルネームと生年月日をお伝えください。

    2. オンライン本人確認（eKYC）：マイナンバーカードのICチップをスマートフォンの読み取り位置に合わせ、情報を読み取ります。あわせて、ご本人の顔写真撮影を行います。

    3. ご利用条件の確認：口座開設にあたっての規約内容を確認し、同意いただきます。

    4. 開設完了の通知：審査完了後、アプリ内で口座開設が完了した旨の通知が届きます。これで即時にお取引が可能です。


    【ご利用開始後のポイント】

    口座開設後は、すぐに0.45%の金利が適用される普通預金をご利用いただけます。また、月2回までの他行あて振込手数料およびATM出金手数料の無料枠も同時にご利用可能です。


    お申込みいただける条件については、「普通預金：お申込みいただける方」をご確認ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: how_to_guide
  source_authority: official
