  institution_id: sorairo_bank
- id: bf6ae989-1c36-5741-982e-40036e03b713
  title: update_contact_info ツールリファレンス
  body: 'お客様の登録連絡先情報を更新します。エージェントはこのツールを直接呼び出します。


    【引数】

    - `full_name`: お客様のフルネーム（照合用）。

    - `contact_details`: 更新する連絡先情報（住所、電話番号、メールアドレスなど）。


    【動作】

    - データベース内の顧客連絡先情報を最新の状態に書き換えます。

    - 本ツールを呼び出す前に、必ず `verify_identity` による本人確認が完了している必要があります。'
