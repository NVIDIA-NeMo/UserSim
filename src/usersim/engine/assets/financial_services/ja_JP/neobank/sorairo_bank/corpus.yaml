- id: 46fb9216-6784-5dd7-9e80-92ccafc8c7b7
  title: スマホ送金：金利・料率の決まり方と適用
  body: '「スマホ送金」に適用される手数料および料率の決定方式についてご案内します。


    ■送金手数料の適用

    本サービスにおける送金手数料は、一律0円です。お客様の口座残高、会員ランク、または送金回数によって変動することはありません。すべてのユーザーに対し、同一の0円という料率が適用されます。


    ■適用タイミング

    手数料の適用は、お客様がアプリ上で送金指示を確定させた瞬間に行われます。本サービスは手数料無料であるため、送金金額と同額が口座から引き落とされ、そのまま相手方に届けられます。


    ■変更の可能性

    手数料の決定は当行のサービス運営方針に基づいています。持続可能なサービス提供のため、将来的に料率が変更される場合は、事前にアプリ内通知および公式サイトにてお知らせいたします。'
