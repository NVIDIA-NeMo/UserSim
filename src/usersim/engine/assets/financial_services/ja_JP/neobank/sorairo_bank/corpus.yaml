- id: ac9e4c15-7d59-5525-9a42-7f08f11eb4b0
  title: 普通預金：重要事項のご説明
  body: '【法令遵守と保護制度について】

    当行は金融庁の監督の下、銀行法および個人情報保護法を厳格に遵守して運営しております。本口座は預金保険制度の対象であり、当行が破綻した場合でも、預金保険機構により、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。


    【セキュリティについて】

    不正アクセス防止のため、ログインおよび振込時には二段階認証が必須となります。機種変更時には認証の再登録が必要です。万が一、不正送金等の被害に遭われた場合は、迅速に利用停止手続きを行ってください。預金者保護法に基づき、故意や重大な過失がない限り、原則として当行が補償いたします。


    詳細は「普通預金：不正利用からお客さまを守るために」をご確認ください。'
