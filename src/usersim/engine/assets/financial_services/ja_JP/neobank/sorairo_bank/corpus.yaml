- id: 9a62d651-a894-5251-b9da-34ea95cb2fc0
  title: dispute_status を使う場面
  body: 'お客様が以前に「そらいろVisaデビット」の身に覚えのない利用について調査・補償の申出（`file_transaction_dispute` の実行）を行い、その現在の進捗状況を確認したいと問い合わせられた場合に本ツールを使用します。不正利用への不安を抱えるお客様に対し、公正な調査状況を迅速に伝えることで安心感を提供します。


    オペレーターは以下の手順に従って状況を確認します。


    1. お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. `dispute_status` を呼び出し、現在進行中の紛争（ディスピュート）案件のステータスを取得します。

    3. 調査の進捗状況（調査中、補償決定、却下など）をお客様に丁寧にご説明します。


    もし、まだ不正利用の届出を行っていないお客様である場合は、まず「そらいろVisaデビット：状況・履歴の確認」に基づき、速やかに届出を行うよう案内してください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: sorairo_bank
- id: 76cd829a-c548-5c0f-a0ad-02d9fd7ab5fe
  title: dispute_status ツールリファレンス
  body: '提出された取引紛争（ディスピュート）の現在の処理状況を確認するツールです。


    オペレーターは、`verify_identity` による本人確認が完了した後、本ツールを直接呼び出すことで、該当するお客様の調査ステータスを取得します。これにより、銀行内部での審査状況や補償手続きの段階を把握し、お客様に回答することができます。


    - 実行内容：不正利用などの調査申出に対する最新の進捗状況の取得

    - 前提条件：`verify_identity` による本人確認済みであること'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
