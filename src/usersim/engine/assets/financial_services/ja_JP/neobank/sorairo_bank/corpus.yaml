- id: d15705a8-33c9-5789-bbd7-6b2420b9aedd
  title: 普通預金：状況・履歴の確認
  body: '普通預金の残高や、過去のお取引履歴を確認する手順をご案内します。


    【事前準備】

    お手元に、ログイン設定済みのスマートフォンアプリをご用意ください。


    【確認の手順】

    1. サポート担当者に履歴確認の旨を伝えます。

    2. ご本人確認のため、フルネームと生年月日を伝えます。

    3. 担当者が口座情報を照会し、現在の正確な残高を回答します。

    4. 特定の期間の明細が必要な場合は、その期間（例：先月分）を伝えます。

    5. 担当者が取引履歴を確認し、入出金の内容と金額を順に案内します。


    【完了の確認】

    提示された金額と、ご自身でアプリ上の「取引履歴」画面に表示されている内容が一致していることを確認して完了です。


    ※暗証番号やパスワードを求められることはございません。ご注意ください。'
