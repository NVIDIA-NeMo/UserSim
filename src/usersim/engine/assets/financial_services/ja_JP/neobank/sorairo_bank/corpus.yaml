- id: ab85a3a5-34c4-5ddc-8d63-eea521c22d7d
  title: 定期預金：安全にご利用いただくためのポイント
  body: '定期預金を安心してお取引いただくために、以下のポイントを必ずご確認ください。


    **セキュリティの徹底**

    ・ログイン時および振込時には、必ず二段階認証をご利用ください。

    ・機種変更の際は、速やかに認証の再登録をお願いいたします。


    **不審な連絡への注意**

    ・当社がメールやSMSで、暗証番号やパスワードを伺うことは一切ございません。

    ・「金利をさらに引き上げるため」などの理由で外部サイトへ誘導し、個人情報を求めるフィッシング詐欺にご注意ください。


    **異常を感じたら**

    万が一、身に覚えのない取引や不審な通知があった場合は、直ちにご報告ください。迅速に口座の利用停止と調査を行います。預金者保護法に基づき、故意や重大な過失がない限り、原則として当行が補償いたします。'
