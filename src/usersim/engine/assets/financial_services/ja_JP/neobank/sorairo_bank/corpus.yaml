- id: 21d9f5e6-c114-5eca-8ece-488cb976faf5
  title: open_time_deposit を使う場面
  body: 'お客さまから「定期預金を開設して、確実に資産形成をしたい」という相談を受けた際に、本手続きを行います。


    【手続きの流れ】

    1. 本人確認を行い、お客さまの身元を確定させます。

    2. get_accounts を使用して、資金を移動させる普通預金の account_id を特定します。

    3. 預け入れる金額（最低1,000円から）と、預入期間（月数）を伺います。

    4. open_time_deposit を呼び出し、定期預金口座の開設と預入を完了させます。


