  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 63774c58-b9e7-5c1f-b64f-14269780925d
  title: スマホ送金：商品概要
  body: 'そらいろ銀行の「スマホ送金」は、相手の口座番号や金融機関名を知らなくても、電話番号だけで手軽に少額の送金ができる利便性に特化したサービスです。デジタルネイティブ層の皆様が、友人や家族との割り勘やちょっとしたお祝い金などのやり取りを、アプリ一つで完結させることができます。


    【サービスの特徴】

    ・電話番号指定によるシンプルな送金操作

    ・アプリ内で完結する直感的なユーザー体験

    ・日常的な利用を促進する低コスト設計


    【ご利用限度額および手数料】

    ・1回あたりの送金上限額：100,000円

    ・1か月あたりの送金上限額：500,000円

    ・送金手数料：0円


    本サービスは、日常的な資金管理の基盤となる「普通預金」口座と連携してご利用いただけます。詳しいお申込み手順については、「スマホ送金：お申込みとご利用開始」をご確認ください。'
