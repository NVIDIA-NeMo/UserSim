- id: 37e281e5-5614-5726-8840-542ed7bf9fbb
  title: 定期預金：登録内容の変更
  body: '定期預金の登録内容（名義や通知設定など）を変更される際の手順をご案内します。


    【ご準備いただくもの】

    ご本人様確認のため、フルネームと生年月日をお答えいただける状態でお願いいたします。


    【お手続きの流れ】

    1. 本人確認

    オペレーターにフルネームと生年月日を伝え、ご本人確認を完了させてください。なお、暗証番号やパスワード、カード番号などの機密情報を聞かれることはございません。


    2. 変更内容の提示

    変更したい登録内容（例：住所変更に伴う通知先の変更、受取人の変更など）を具体的にお伝えください。


    3. 内容の照会と確定

    オペレーターが現在の登録内容と、変更後の内容を確認します。相違がないことを承諾してください。


    4. 完了通知の受領

    手続きが完了すると、アプリの通知センターまたは登録メールアドレスに、変更完了の通知が届きます。通知が届いたことを確認して、お手続きは完了です。


    【ご注意】

    定期預金の「預入期間（6か月もの、1年もの）」や「預入金額」そのものを変更したい場合は、一度解約して再設定いただく必要があります。解約の手順については「定期預金：解約・変更・プランの切替え」をご確認ください。'
