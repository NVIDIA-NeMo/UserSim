- id: 0ffb8f17-4774-5645-9999-e0d67a900fc2
  title: スマホ送金：お手続きが完了しない・保留中のまま
  body: 'スマホ送金のお手続き中に、画面が切り替わらない、または「処理中」のまま保留となっている場合の対処法をご案内します。


    【考えられる原因と確認事項】

    1. 通信環境の不安定：電波状況の良い場所で、アプリを再起動して状況をご確認ください。

    2. 残高不足：普通預金口座の残高が、送金金額および（もしあれば）その他の未決済分をカバーしているかご確認ください。

    3. 上限額への到達：1回あたりの上限額100,000円、または1か月あたりの上限額500,000円を超えていないかご確認ください。


    【解決しない場合の対応】

    上記を確認しても状況が変わらない場合は、弊社にて詳細な調査を行います。お客様から「送金日時」と「送金先電話番号」をお知らせください。弊社にて送金ステータスを確認し、不具合が認められる場合は専門チームへエスカレーションし、速やかに処理の完了または返金手続きを行います。結果については、アプリ内の通知またはメールにてご案内いたします。'
