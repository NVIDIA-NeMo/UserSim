- id: 13aee733-db75-5409-a075-247bbd07d6ee
  title: スマホ送金：想定外の手数料・金額
  body: '「手数料が引かれている気がする」「送金金額が正しくない」と感じられた場合は、以下の順に確認してください。


    **1. 手数料の再確認**

    スマホ送金の手数料は0円です。明細に記載されている金額が、送金指示額と一致しているかご確認ください。もし他の振込サービス（銀行振込など）をご利用の場合、そちらは手数料が発生している可能性があります。


    **2. 送金限度額の確認**

    1回に送金できる上限額は100,000円です。これを超える金額を一度に送ることはできません。また、月間の合計限度額500,000円に達している場合、手続きが拒否されます。


    **3. 対処法とエスカレーション**

    上記を確認しても金額に不整合がある場合は、お取引日時と金額を添えてお知らせください。当行にて取引ログを調査し、誤りのある場合は速やかに修正および返金処理を行います。'
