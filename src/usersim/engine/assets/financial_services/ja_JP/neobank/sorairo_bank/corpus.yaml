- id: f3e317de-65f2-525c-8c25-8ce396735ce8
  title: そらいろVisaデビット：ログインできない・アクセスできない
  body: 'アプリにログインできず、そらいろVisaデビットの管理画面にアクセスできない場合の対処法です。


    ■考えられる症状と原因

    ・「パスワードが正しくありません」と表示される → 入力ミス、またはパスワードの変更忘れが考えられます。

    ・ログイン画面でエラーが発生し、先に進めない → スマートフォンの機種変更後、認証の再登録が行われていない可能性があります。

    ・二段階認証のコードが届かない → 通信環境の不具合、または登録電話番号が古い可能性があります。


    ■確認と解決の手順

    1. 入力内容の再確認

    大文字・小文字、全角・半角が正しく入力されているか確認してください。


    2. 通信環境の切り替え

    Wi-Fiをオフにしてモバイルデータ通信に切り替えるなど、ネットワーク環境を変更して再度お試しください。


    3. 認証の再登録（機種変更時）

    新しい端末でログインを試み、案内される再登録フローに従って本人確認を完了させてください。


    ■解決しない場合

    上記を試してもログインできない場合は、当行の専門オペレーターへエスカレーションいたします。お客様のフルネームと生年月日を確認後、アカウントの状態を調査し、パスワードの再設定や認証解除などの措置を講じ、完了後に通知いたします。'
