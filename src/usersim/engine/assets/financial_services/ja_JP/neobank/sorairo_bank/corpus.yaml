- id: 9efae040-1254-561d-9780-91d0e64bcba3
  title: 定期預金：金利・料率の決まり方と適用
  body: '定期預金の金利は、預入時に選択した期間に応じて以下の固定金利が適用されます。


    * **6か月定期預金**：年 0.7%

    * **1年定期預金**：年 0.9%


    金利は一律で適用され、預入金額による変動（ティア構造）はありません。最低預入金額の1,000円以上であれば、どなたでも上記の金利を適用いただけます。金利は預入時点の利率で確定し、満期まで維持されます。'
