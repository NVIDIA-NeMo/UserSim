    - **最低預入金額**：1,000円から\n- **適用金利**：\n  - 6か月定期：0.7%\n  - 1年定期：0.9%\n\n**【安心のポイント】**\n\
    預金保険制度の対象となっており、当行が破綻した場合でも、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。\n\
