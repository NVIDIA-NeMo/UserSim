  institution_id: sorairo_bank
- id: 921cb91d-41fb-5412-ba77-285985c6d5f7
  title: 普通預金：無料回数を超えた他行あて振込手数料について
  body: 'Q. 他行への振込手数料が無料になる回数を超えた場合、いくらかかりますか？


    A. そらいろ銀行の普通預金では、他行あて振込手数料の無料回数（月、基本）として2回分を提供しております。この無料回数を超えて振込を利用された場合は、1回につき145円の手数料を申し受けます。


    手数料の詳細については、「普通預金：手数料一覧」をご確認ください。'
