- id: ab6c3cd0-5645-5016-af92-56f90aaadaa9
  title: スマホ送金：規定・約款の変更
  body: '本規定は、そらいろ銀行が提供する「スマホ送金」サービスの利用条件を定めるものです。本サービスを他社サービスと比較検討される際は、以下の拘束力を持つ条件をご確認ください。


    1. 利用限度額の遵守

    本サービスにおける送金限度額は、1回あたりの送金上限額を100,000円、1か月あたりの送金上限額を500,000円と定めます。これらの上限額を超える送金は、システムにより制限されます。


    2. 手数料の適用

    本サービスの送金手数料は0円とします。ただし、法規制の変更やサービス維持コストの変動に伴い、当行は事前の告知期間を経て手数料を変更できるものとします。


    3. 規定の変更と告知

    当行は、業務上の必要がある場合、本規定を変更することがあります。変更内容はアプリ内通知または公式サイトにて告知し、告知後の利用をもって変更に同意したものとみなします。


    4. サービスの停止・終了

    犯罪収益移転防止法に基づく本人確認が適切に行われない場合、または不正利用の疑いがある場合は、当行の判断で即時にサービスの利用を停止します。


    本サービスは、預金保険制度により、元本1,000万円まで（決済用預金は全額）保護される安全な環境で提供されます。'
