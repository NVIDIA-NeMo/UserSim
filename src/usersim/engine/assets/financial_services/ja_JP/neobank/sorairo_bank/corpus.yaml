- id: 9280bffd-4e6d-5b79-8213-4fb045ebc249
  title: 定期預金：個人情報の取扱い
  body: 'そらいろ銀行では、個人情報保護法および関連法令を遵守し、お客様からお預かりした個人情報を厳重に管理しております。定期預金のご利用にあたり、以下の通り取り扱いについてご説明いたします。


    【個人情報の利用目的】

    定期預金の口座開設、金利の計算、満期時の通知、および法令に基づく本人確認（犯罪収益移転防止法に基づく取引時確認）のために、お客様の氏名、生年月日、住所等の情報を利用いたします。


    【安全管理措置】

    当行はデジタルネイティブ層向けのネオバンクとして、高度な暗号化技術を用いたデータ管理を徹底しています。また、金融庁の監督のもと、厳格な内部監査を行い、情報の漏洩、滅失、毀損の防止に努めています。


    【第三者への提供】

    法令に基づく要請がある場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    【お客様の権利】

    お客様は、ご自身の個人情報の開示、訂正、利用停止を求める権利を有します。お手続きを希望される場合は、アプリの設定メニューまたはカスタマーサポートまでご連絡ください。


    【預金者保護について】

    個人情報の保護とともに、資産の安全性についても、預金保険制度により元本1,000万円まで（利息を含みます）が保護される環境を提供しております。'
  domain: retail_banking
  product_category: sorairo_teiki
  document_type: disclosure
  source_authority: official
