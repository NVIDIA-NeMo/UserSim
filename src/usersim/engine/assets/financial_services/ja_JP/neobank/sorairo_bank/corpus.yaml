- id: 4ada2978-2f38-5d0a-b2e4-eacdea602733
  title: 普通預金：他社の一般的な商品との比較
  body: '一般的な伝統的銀行（メガバンク等）の普通預金と、そらいろ銀行の普通預金を比較します。


    | 比較項目 | 一般的な銀行の普通預金 | そらいろ銀行の普通預金 |

    | :--- | :--- | :--- |

    | 金利 | 低金利（例: 0.001%〜0.02%程度） | 0.45%（高い金利設定） |

    | 振込手数料 | 初回から有料なケースが多い | 月2回まで無料（以降145円） |

    | ATM手数料 | 条件なしでは有料なことが多い | 月2回まで無料（以降110円） |

    | 口座開設 | 店舗訪問または郵送手続き | アプリで完結（オンライン完結） |


    【どちらが適しているか】

    ・そらいろ銀行が適している方：スマホ一台で全てを完結させたいデジタルネイティブ層の方、預金金利を重視して効率的に資産を増やしたい方。

    ・他行が適している方：対面での相談を重視される方や、現金での窓口取引が必須となる方。


    当行は、店舗を持たないことでコストを削減し、それを0.45%という高い金利や無料回数の提供という形で、お客さまへ還元しています。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 99c0bca4-ce35-5d13-a56f-f5ad82991c71
  title: 普通預金：リスクについてのご説明
  body: '普通預金のご利用にあたり、以下のリスクおよび留意事項についてご理解ください。


    1. 金利変動リスク

    普通預金の金利（現在は0.45%）は、市場金利の変動や当行の判断により、事前の予告なく変更される場合があります。金利が低下した場合、期待していた利息収益が得られない可能性があります。


    2. 預金保険制度の適用範囲

    当行は預金保険制度の対象金融機関です。万一当行が破綻した場合、普通預金（利息付き）は、1金融機関につき預金者1人当たり元本1,000万円までと、破綻日までの利息等が保護されます。1,000万円を超える元本および利息については、保護の対象外となるためご注意ください。


    3. 不正利用のリスク

    スマートフォンアプリを利用するため、端末の紛失やパスワードの漏洩により、第三者に不正に利用されるリスクがあります。二段階認証の利用など、セキュリティ対策を徹底してください。不正利用が発生した場合は、預金者保護法および当行規定に基づき調査し、補償を行います。


    4. 投資助言の禁止

    当行は普通預金の仕組みに関するご案内は行いますが、個別の税務判断や法的助言、および投資助言は行いません。具体的な判断が必要な場合は、税理士や弁護士等の専門家にご相談ください。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 99bfacc1-db78-54fe-bdd9-575fc1625dca
  title: 普通預金：金利・料率の決まり方と適用
  body: '普通預金に適用される金利の決定方法と適用ルールについてご案内します。


    【適用金利】

    ・普通預金金利：0.45%


    【金利の適用方法】

    ・本金利は、口座に預けられている全ての残高に対して一律に適用されます（ティア制などは採用しておりません）。

    ・利息は、日次の最終残高に基づき計算され、年2回（原則として定期的）にまとめて口座へ入金されます。


    【金利が変更されるケース】

    以下の要因により、金利が改定される場合があります。

    ・日本銀行による政策金利の変更など、市場金利の著しい変動があった場合。

    ・当行の資金調達状況や経営戦略に基づき、金利設定を見直した場合。


    金利変更の際は、アプリ内のお知らせ機能を通じて、事前にお客さまへ通知いたします。最新の金利状況は、常にアプリのマイページよりご確認いただけます。'
  domain: retail_banking
  product_category: sorairo_futsu
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: dd2e355c-dd0b-53bb-8f6a-f53bbd6a1d3a
  title: 普通預金：ご紹介・継続利用の特典
  body: 'そらいろ銀行の普通預金をご利用いただき、誠にありがとうございます。当行では、デジタルネイティブな皆様に心地よくお使いいただけるよう、継続利用およびお友達のご紹介に関する特典をご用意しております。


    【継続利用のメリット】

    メイン口座としてご利用いただくことで、業界最高水準の0.45%という高い金利を最大限に活用し、効率的な資産形成が可能です。また、月2回までの他行あて振込手数料無料枠と、月2回までの提携ATM出金手数料無料枠を継続的にご利用いただけます。


    【ご紹介特典について】

    お友達にご紹介いただき、口座開設に至った場合の特典詳細は、アプリ内の「キャンペーン一覧」よりご確認いただけます。


    詳細は「普通預金：商品概要」をご参照ください。'
