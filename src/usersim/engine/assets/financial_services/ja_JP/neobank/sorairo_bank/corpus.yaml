- id: 773bf73a-926a-5b11-a7f3-c14fa26c45f4
  title: 定期預金：状況・履歴の確認
  body: 'お手持ちの定期預金の運用状況や履歴を確認する手順をご案内します。


    1. 私たちに、確認したい定期預金口座の番号、または預け入れ期間（6か月もの、1年もの）をお知らせください。

    2. 私たちがシステムより、現在の預入金額、適用されている金利（0.7% または 0.9%）、および満期日を照会します。

    3. 照会した最新の状況をお客さまに提示し、現在の運用内容についてご確認いただきます。

    4. 必要に応じて、これまでについた利息の計算履歴や、次回満期時の予定金額についてご説明いたします。


    上記の手順により、アプリを開かなくても現在の資産状況を正確に把握することが可能です。'
