- id: 9936ba3a-b45f-5272-ab8a-9349e71154c1
  title: 目的別口座：この商品をかたる詐欺にご注意ください
  body: '最近、当行の「目的別口座」をかたる巧妙なフィッシング詐欺が発生しています。特に「特別な金利が適用される目的別口座をご案内します」や「口座の制限を解除するために認証が必要です」といった偽のメールやSMSにご注意ください。


    **【ご注意いただきたい点】**

    *   そらいろ銀行が、メールやSMSでパスワードや二段階認証のコードを伺うことは絶対にありません。

    *   不審なリンクから個人情報を入力させようとするサイトは偽物です。


    もし不審な連絡を受けたり、誤って情報を入力してしまった場合は、すぐにアプリから利用停止手続きを行うか、チャットサポートまでご連絡ください。迅速に調査し、被害を最小限に抑える対応をいたします。'
