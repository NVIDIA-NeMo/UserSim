  title: そらいろVisaデビット：手数料と費用
  body: '**Q: カードを所有し続けるための費用はかかりますか？**


    **A:** いいえ、「そらいろVisaデビット」の年会費は0円です。どなたでも無料でご利用いただけます。


    **Q: 海外で利用した場合に手数料はかかりますか？**


    **A:** はい。海外でご利用いただいた際は、ご利用金額に対して2%の海外利用事務手数料がかかります。'
