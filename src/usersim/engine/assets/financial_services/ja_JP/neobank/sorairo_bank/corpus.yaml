    2. マイナンバーカードをスマートフォンにかざし、ICチップによるオンライン本人確認を行ってください。これにより、厳格な取引時確認が完了します。

    3. 登録内容を確認し、発行を確定させてください。

    4. 数日後、ご自宅にカードが届きます。カード到着後、アプリ内で「利用開始」の手続きを行ってください。


    以上の手続きが完了すると、すぐにVisa加盟店でのお買い物が可能になります。'
