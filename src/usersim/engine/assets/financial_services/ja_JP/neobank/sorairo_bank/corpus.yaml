  institution_id: sorairo_bank
- id: 7d411233-94e6-5654-83eb-7a3a3e6cb91a
  title: そらいろVisaデビット：お取引が拒否された・制限された
  body: 'カードを利用しようとした際に、決済が拒否される場合の確認事項をご案内します。


    **【考えられる原因とチェック項目】**

    1. **口座残高の不足**：引き落とし口座に、決済金額以上の残高があるかご確認ください。

    2. **利用限度額への到達**：1日の利用限度額である300,000円を超えていないかご確認ください。

    3. **セキュリティロック**：短時間に連続して高額決済を行った場合など、不正利用防止のため一時的に制限がかかっている可能性があります。


    **【解決方法】**

    * 残高不足の場合は、口座へ入金してください。

    * 限度額に達している場合や、ロックが疑われる場合は、当行へ制限解除の依頼をしてください。専門のオペレーターが確認を行い、必要に応じて制限を解除いたします。'
  domain: cards
  product_category: sorairo_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
