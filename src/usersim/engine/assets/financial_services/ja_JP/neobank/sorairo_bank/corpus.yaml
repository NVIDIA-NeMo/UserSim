- id: 47fb8ce3-fd42-56df-ab66-c0e161fba926
  title: そらいろVisaデビット：よくあるお手続きの流れ
  body: 'カードの再発行など、よくあるお手続きの流れをご案内します。ここでは「カードの紛失による再発行」を例に説明します。


    【事前準備】

    ご本人様確認のため、フルネームと生年月日をお手元にご用意ください。


    【お手続きの流れ】

    1. 担当者に「カードを紛失したため、利用停止と再発行をしたい」旨を伝えてください。

    2. ご案内があった際に、フルネームと生年月日を提示し、本人確認を行ってください。

    3. 担当者が、現在のお手持ちのカードを即時に利用停止処理します。これにより、不正利用のリスクを最小限に抑えます。

    4. 再発行の意思確認を行い、登録されている住所への発送手続きを依頼してください。

    5. 担当者が手続き完了を報告します。新しいカードが届くまでにお時間をいただきます。


    【完了の確認】

    お手続き後、アプリ上のカードステータスが「再発行手続き中」に更新されたことを確認して完了です。新しいカードが到着しましたら、案内に沿って有効化してご利用ください。'
  domain: cards
  product_category: sorairo_debit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 128704bf-e56b-543c-a739-7aea4b375703
  title: そらいろVisaデビット：明細や記録と合わない
  body: 'お客様から「利用明細の金額が記憶している金額と異なる」との問い合わせを受けた際の対応手順です。


    【確認すべき項目と原因】

    1. 海外利用の有無を確認してください

    海外の店舗やサイトを利用している場合、海外利用時の事務手数料2%が加算されています。決済時の金額にこの手数料が上乗せされているため、利用額と引き落とし額に差が生じます。


    2. 未確定（保留）取引の有無を確認してください

    ホテルやレンタカーなどのサービスでは、事前の「仮押さえ（オーソリ）」が行われることがあります。この場合、一時的に金額が変動して見えることがありますが、確定時に正当な金額に修正されます。


    3. キャッシュバックの反映タイミングを確認してください

    キャッシュバック率0.8%による還元は、即時ではなく後日まとめて行われる場合があります。利用時の引き落とし額から直接差し引かれるわけではない点をご案内ください。


    【解決しない場合の対応】

    上記を確認しても不一致がある場合や、身に覚えのない請求である場合は、至急「不正利用」として調査を開始します。お客様から詳細な取引日時と金額を確認し、調査依頼を上げてください。預金者保護法および銀行規定に基づき、公正な調査を行い、不正と認められた場合は速やかに補償手続きを案内します。'
  domain: cards
