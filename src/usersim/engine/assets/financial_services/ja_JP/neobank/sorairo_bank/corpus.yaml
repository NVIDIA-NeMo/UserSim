    **【ご利用開始までのステップ】**

    1.  アプリのホーム画面から「スマホ送金」を選択します。

    2.  利用規約を確認し、「同意して開始する」をタップします。

    3.  ご自身の電話番号が正しく登録されていることを確認し、認証を完了させます。

    4.  「設定完了」の画面が表示されれば、すぐに送金が可能です。


    これで、お相手の電話番号を指定して0円で送金できるようになりました。詳しい制限については「スマホ送金：商品概要」をご覧ください。'
