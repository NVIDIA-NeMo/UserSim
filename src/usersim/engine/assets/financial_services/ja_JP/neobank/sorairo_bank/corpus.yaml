  institution_id: sorairo_bank
- id: cb95b1a1-d793-5c6a-95d7-fe8d5f5c5cd2
  title: 定期預金：この商品をかたる詐欺にご注意ください
  body: 'そらいろ銀行の「定期預金」をかたる、巧妙な詐欺へのご注意をお願いいたします。特に、他行を大幅に上回る金利を提示して、外部サイトへの誘導や個人情報の入力を求める手口が報告されています。


    当行では、定期預金の金利は公式アプリ内および公式サイトで提示している数値（6か月もの0.7%、1年もの0.9%）に基づき運用しており、個別に特別な高金利プランを電話やメールで案内することはございません。


    また、どのような場合であっても、当行のオペレーターがお客様の暗証番号、パスワード、カード番号、CVV、身分証番号などを聞き出すことは一切ございません。もしこのような要求があった場合は、詐欺の可能性が非常に高いため、すぐにお手続きを中断してください。


    万が一、不審な連絡を受けたり、情報を入力してしまったと感じられた場合は、直ちに当行へご連絡ください。迅速に口座の保護措置を講じ、不正利用の防止に努めます。また、不審なメール内のリンクは決してクリックせず、必ず公式アプリから情報を確認されるようお願いいたします。'
