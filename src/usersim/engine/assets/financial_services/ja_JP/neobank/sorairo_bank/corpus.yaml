- id: 45455f57-914b-51b2-8511-ef405e9f2eec
  title: 普通預金：必要書類
  body: '普通預金口座開設のために必要な書類は以下の通りです。


    | 項目 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | 本人確認書類 | マイナンバーカード | アプリでICチップを読み取るオンライン本人確認が必要です |

    | 連絡先確認 | スマートフォン | ご自身の名義で契約された電話番号が必要です |

    | 住所確認 | マイナンバーカード | カード記載の住所が現住所である必要があります |


    ※マイナンバーカードをお持ちでない場合は、別途ご案内いたしますのでお問い合わせください。'
