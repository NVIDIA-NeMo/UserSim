  title: そらいろVisaデビット：お手続きが完了しない・保留中のまま
  body: 'カードのお申込み手続きが完了せず、「保留中」のままとなっている場合は、以下の点をご確認ください。


    【確認事項と解決策】

    1. 本人確認の読み取りエラー：マイナンバーカードのICチップ読み取り時に、カードを動かしたり離したりしていませんか。平らな場所に置き、読み取りが完了するまで固定してください。

    2. 登録情報の不一致：口座開設時の氏名・住所と、カード申請時の情報に相違がないかご確認ください。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、私たちにお知らせください。専門の担当者が提出書類の内容を個別に確認し、審査状況のアップデートや再手続きのご案内をいたします。確認完了後、手続きの結果をアプリ通知にてお知らせします。'
