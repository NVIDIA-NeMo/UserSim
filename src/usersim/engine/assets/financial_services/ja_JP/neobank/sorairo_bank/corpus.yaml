  body: '**Q. 目的別口座の作成や管理に手数料はかかりますか？**


    A. いいえ、目的別口座の作成、名称変更、および普通預金との資金移動に手数料は一切かかりません。無料で最大10個まで作成し、効率的に資産管理をご利用いただけます。'
