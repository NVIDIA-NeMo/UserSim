- id: 3298249b-adb9-5a92-8978-ca6fa63d0bc5
  title: 定期預金：リスクについてのご説明
  body: '本商品は安全性の高い預金商品ですが、ご利用にあたり以下のリスクをご理解ください。


    【流動性リスク】

    定期預金は原則として満期日まで資金を預ける商品です。満期前に資金が必要となり中途解約される場合、当初の約定金利（0.7%または0.9%）よりも低い利率が適用され、期待していた利息が得られない可能性があります。


    【金利変動リスク】

    本商品の金利は預入時に確定しますが、市場金利が上昇した場合、相対的に本商品の金利が低く感じられる可能性があります。


    【預金保険制度による保護】

    お客さまの預金は、預金保険制度により、利息のつく普通預金や定期預金などは、1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護されます。


    【ご注意】

    当行は、商品の仕組みに関するご案内は行いますが、個別の税務判断や法的助言、投資助言は行いません。具体的な判断が必要な場合は、税理士や弁護士などの専門家へご相談ください。


    法令の詳細については、「法令・制度に関するご案内：預金・日常のお取引」をご参照ください。'
