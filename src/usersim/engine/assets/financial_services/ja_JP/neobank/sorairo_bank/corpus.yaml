- id: ab1bc9c5-af2d-552a-b828-48296baf223b
  title: 普通預金：想定外の手数料・金額
  body: 'お客さまから「身に覚えのない手数料が引かれている」「想定していた金額と異なる」というお問い合わせをいただいた際の確認手順です。


    【想定される原因】

    ・他行あて振込手数料の無料回数（月2回）を超過し、145円の手数料が発生した。

    ・提携ATM出金手数料の無料回数（月2回）を超過し、110円の手数料が発生した。


    【確認ステップ】

    1. 取引履歴の確認

    まず、アプリの取引明細にて、手数料が発生した日付と取引内容を確認してください。

    2. 無料回数のカウント確認

    当該月において、すでに2回の無料枠を使い切っていないか、振込回数およびATM利用回数を数えてください。

    3. 適用プランの確認

    現在適用されている会員ランクやプランにより、無料回数が変動している可能性があります。


    【解決策とエスカレーション】

    ・無料回数超過による正当な課金である場合は、その旨をお客さまへ丁寧にご説明ください。

    ・履歴に不整合がある場合や、システムエラーが疑われる場合は、速やかに専門のオペレーターへ案件をエスカレーションし、詳細な調査と必要に応じた返金処理を行います。調査結果はお客さまへアプリ通知またはメールで回答いたします。'
