  body: 'そらいろ銀行では、お客様に安心してお取引いただけるよう、セキュリティ対策を徹底しております。スマホ送金をご利用の際は、以下のポイントに十分ご注意ください。


    ■不審なメッセージに注意

    「送金手続きにエラーが発生しました」や「口座の確認が必要です」といった内容で、外部サイトへ誘導するSMSやメールにご注意ください。そらいろ銀行が、メッセージ内のリンクから暗証番号やパスワードの入力を求めることはございません。


    ■当行が絶対にお聞きしない情報

    サポート担当者が、お客様に以下の情報を伺うことは一切ございません。

    ・暗証番号、ログインパスワード

    ・カード番号、CVV（セキュリティコード）

    ・身分証番号


    ■本人確認について

    口座情報の照会や変更を行う際は、必ずお客様の「フルネーム」と「生年月日」を確認させていただきます。


    ■異常を感じたときは

    万が一、身に覚えのない送金通知が届いたり、スマートフォンの紛失・盗難が発生したりした場合は、ただちに当行までご連絡ください。預金者保護法および銀行規定に基づき、迅速に調査と補償手続きを行います。'
