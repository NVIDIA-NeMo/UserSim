- id: 4f884e00-6f40-5578-a647-5ac72c9fadd7
  title: 目的別口座：よくあるお手続きの流れ
  body: '目的別口座を新しく作成し、貯金を始めるまでの流れをご案内します。


    【事前準備】

    ・ご登録のスマートフォンアプリにログインしていること。

    ・普通預金口座に、最初に振り分けるための十分な残高があること。


    【お手続きの手順】

    1. オペレーターに「目的別口座を新しく作りたい」旨をお伝えください。

    2. 本人確認のため、フルネームと生年月日をお答えください。

    3. 作成したい口座の「名称（例：休暇旅行）」と、最初に振り分ける「金額」をお伝えください。

    4. オペレーターが設定内容を確認し、作成処理を行います。完了後、アプリ上の口座一覧に新しい目的別口座が表示されます。


    【自動入金の設定（オプション）】

    さらに、毎月決まった金額を自動で貯めたい場合は、続けて「自動入金の設定」を依頼してください。自動入金の最低金額は1,000円から設定可能です。


    【完了の確認】

    アプリのトップ画面で、指定した名称の口座が作成され、残高が正しく反映されていることをご確認いただければ完了です。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: aaee5333-792c-5711-83fd-7218a5395be0
  title: 目的別口座：明細や記録と合わない
  body: 'お客様より「目的別口座の残高が、自分の計算や明細と一致しない」とのお問い合わせを受けた際の対応手順です。


    【確認すべきポイント】


    1. 「普通預金合計」と「目的別口座残高」の混同

    目的別口座はあくまで普通預金の中での「仮想的な仕分け」です。入出金明細には「普通預金」としての取引のみが記載され、目的別口座間の移動は内部処理となるため、明細に反映されない場合があります。まず、普通預金の総残高と、各目的別口座の合計額が一致しているかを確認してください。


    2. 自動入金タイミングのずれ

    自動入金を設定している場合、設定日と実際の処理日にわずかなタイムラグが生じることがあります。最新の処理が完了しているかを確認してください。


    3. 他の取引による不足

    目的別口座に資金があっても、デビットカード利用などで普通預金全体の残高が不足した場合、自動的にメイン残高から充当されるため、意図せず目的別口座の資金が変動したように見える場合があります。


    【解決策】

    ・お客様に、目的別口座の個別残高ではなく、普通預金全体の「合計残高」を基準に確認いただくよう案内してください。

    ・それでも不一致がある場合は、フルネームと生年月日の確認後、詳細な取引ログを調査し、不整合の原因を特定します。


    【エスカレーション】

    システム上の不具合や計算ミスが疑われる場合は、速やかにシステム管理部門へ報告し、修正手続きを行います。'
