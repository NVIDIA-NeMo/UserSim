  institution_id: sorairo_bank
- id: f3da7cc8-5a29-571c-8a66-0058d707501e
  title: 普通預金：お申込みいただける方
  body: '普通預金口座のお申込み条件は以下の通りです。


    ■条件：日本国内に居住している個人の方

    → 結果：お申込みいただけます。


    ■条件：有効なマイナンバーカードを所有している方

    → 結果：オンラインでの本人確認が可能です。お申込みいただけます。


    ■条件：スマートフォン（iOS/Android）を所有し、当行アプリをインストールできる方

    → 結果：お申込みいただけます。本口座はアプリ完結型のサービスです。


    ■条件：犯罪収益移転防止法に基づく取引時確認に同意いただける方

    → 結果：お申込みいただけます。


    詳細な必要書類については「普通預金：必要書類」をご参照ください。'
