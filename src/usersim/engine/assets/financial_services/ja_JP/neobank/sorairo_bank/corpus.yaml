- id: f64c4b25-87db-53a9-930d-dcb5411720fc
  title: 定期預金：お申込みとご利用開始
  body: '定期預金のお申込みは、アプリからいつでも簡単に行っていただけます。


    **【ご準備いただくもの】**

    - そらいろ銀行の普通預金口座

    - 預入希望額（最低1,000円以上）


    **【お手続きの手順】**

    1. アプリの定期預金メニューから、預け入れたい金額（1,000円〜）を入力します。

    2. 預入期間（6か月または1年）を選択します。

    3. 資金を移動させる普通預金口座を指定し、内容を確認します。

    4. 「確定」を選択すると、即座に定期預金口座が開設されます。


    **【完了の確認】**

    お手続き後、アプリのトップ画面または口座一覧に「定期預金」が表示され、指定した金額が反映されていれば完了です。'
