- id: 85f36319-66ef-5d23-9dea-db9d88031876
  title: 目的別口座：不正利用からお客さまを守るために
  body: '目的別口座を安全にご利用いただくために、以下の点にご注意ください。


    **なりすましやフィッシング詐欺への対策**

    当行が、メールやSMSで「口座の凍結を解除するためにパスワードを入力してください」といった要求をすることはありません。不審なリンクはクリックせず、必ず公式アプリから操作してください。


    **二段階認証の徹底**

    ログイン時および振込時には二段階認証を導入しており、不正アクセスを防止しています。認証コードを第三者に教えることは絶対におやめください。


    **万が一の被害に遭われた場合**

    速やかに当行へご連絡ください。迅速な利用停止と調査を行います。預金者保護法に基づき、お客さまに故意や重大な過失がない限り、原則として当行が補償いたします。


    また、預金保険制度により、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されますのでご安心ください。'
