- id: 3298249b-adb9-5a92-8978-ca6fa63d0bc5
  title: 定期預金：リスクについてのご説明
  body: '定期預金をご利用いただくにあたり、以下のリスクをご理解ください。


    **1. 流動性リスク（資金拘束）**

    定期預金は、あらかじめ定めた期間（6か月または1年）資金を預ける商品です。満期前に解約することは可能ですが、その場合は当初の約定金利（0.7%または0.9%）よりも低い金利が適用されるため、期待していた利息が得られない場合があります。


    **2. インフレリスク**

    物価が上昇した場合、預金金利を上回るペースで物価が上がると、実質的な資産の価値が目減りする可能性があります。


    **3. 預金保護について**

    当行は預金保険制度の対象となっております。万が一、当行が破綻した場合であっても、預金保険機構により、利息のつく預金は1金融機関につき預金者1人当たり元本1,000万円までとその利息等が保護されます。'
