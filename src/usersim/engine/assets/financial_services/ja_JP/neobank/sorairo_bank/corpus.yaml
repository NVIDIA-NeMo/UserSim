- id: 7b1095f7-c59e-5e32-9e29-085437edf99e
  title: スマホ送金：手数料と費用
  body: '**Q: スマホ送金を利用する際の手数料はかかりますか？**


    A: いいえ、かかりません。スマホ送金のご利用手数料は、回数に関わらず一律0円です。


    **Q: 送金金額に応じて別途費用が発生することはありますか？**


    A: ございません。送金金額に関わらず、手数料は0円でご利用いただけます。安心してお気軽にご利用ください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c998c74d-1126-5940-861c-81134ac81d93
  title: スマホ送金：状況・履歴の確認
  body: '送金したお金が正しく相手に届いたか、過去にいくら送金したかを確認する手順をご案内します。


    **確認の手順**

    1. スマートフォンアプリにログインし、ホーム画面から「スマホ送金」メニューを選択します。

    2. 画面内の「送金履歴」タブをタップします。

    3. これまでの送金一覧が表示されます。確認したい取引を選択してください。

    4. 送金日時、送金先の電話番号、および送金金額（最大100,000円まで）が表示され、現在の処理状況（完了・保留など）がご確認いただけます。


    もし履歴に反映されていない場合や、状況についてご不明な点がある場合は、お気軽にお問い合わせください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 72757145-a130-593b-89b5-c3173cf733c3
  title: スマホ送金：お取引が拒否された・制限された
  body: "「スマホ送金」の操作中にエラーが表示され、送金が完了できない場合の対処法をご案内します。\n\n**考えられる原因と確認事項**\n1. **限度額への到達**\n\
    \   - 1回あたり100,000円を超えて送金しようとしていないかご確認ください。\n   - 今月の送金合計額が500,000円に達していないかご確認ください。\n\
    2. **認証エラー**\n   - 二段階認証のコードが正しく入力されているか、または有効期限が切れていないかをご確認ください。\n3. **口座残高の不足**\n\
    \   - 送金金額と手数料（0円）を合わせた金額が、普通預金口座にあるかご確認ください。\n\n**解決しない場合**\n上記を確認しても解決しない場合、当行にてセキュリティ上の制限をかけている可能性がございます。その際は、専門のオペレーターが詳細を調査し、制限解除の手続きを案内いたします。"
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: ce0ad2e9-4082-50ad-ae24-af1e6bde93f7
  title: スマホ送金：切替えや上位プランを検討するとき
  body: '「スマホ送金」は、電話番号だけで手軽に0円で送金できる便利なツールですが、利用目的によっては他の方法が適している場合があります。


    - **スマホ送金が適している場合**：友人や家族間での少額のやり取り（1回100,000円以内、月間500,000円以内）。

    - **通常の振込への切替えが適している場合**：100,000円を超える高額な送金が必要な場合や、ビジネス用途で正確な振込名義人を指定したい場合。


    より詳細な振込手数料や条件については、「普通預金：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 70429678-2233-57ac-b1fa-d6ff7920041b
  title: スマホ送金：ほかの選択肢との比較と向かない場合
  body: '「スマホ送金」は、スピードとコストパフォーマンスを重視したサービスです。他の送金手段と比較して、どのような場合に最適で、どのような場合に不向きかをご案内します。


    **スマホ送金が最適なケース**

    - 手数料を一切かけたくない（手数料0円）。

    - 相手の口座番号が分からなくても、電話番号だけで送金したい。

    - 100,000円以下の少額決済を頻繁に行う。


    **向かないケース**

    - **高額送金が必要な場合**：1回100,000円、月間500,000円の限度額があるため、これを超える送金には不向きです。

    - **正式な証明が必要な場合**：簡易的な送金であるため、詳細な振込明細を公的な証明として利用したい場合は、通常の銀行振込を推奨いたします。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3d794088-394e-5b2b-9b06-99bd795c0b46
  title: スマホ送金：お申込みとご利用条件
  body: '**Q: スマホ送金を利用するために別途申し込みは必要ですか？**


    A: いいえ、特別な申し込み手続きは不要です。当行の口座をお持ちで、アプリをご利用であればどなたでもそのままご利用いただけます。


    **Q: 利用するための条件はありますか？**


    A: 口座開設時にマイナンバーカードによる本人確認（取引時確認）を完了させていただけていることが条件となります。未完了の方は、アプリの案内に従って認証を行ってください。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3d4e5f04-d22a-5d68-8589-b6fad83165b5
  title: スマホ送金：よくあるお手続きの流れ
  body: '「スマホ送金」を使って、お友達やご家族に送金する際の流れをステップ形式でご案内します。


    **送金の手順**

    1. アプリの「スマホ送金」メニューを開き、送金先の電話番号を入力します。

    2. 送金したい金額を入力します（1回あたり100,000円まで）。

    3. 送金先のお名前と金額に間違いがないか、確認画面でチェックします。この際、手数料が0円であることをご確認ください。

    4. 二段階認証画面が表示されますので、認証を完了させてください。

    5. 「送金が完了しました」という画面が表示されれば手続き終了です。


    相手の方には、即座に送金が完了します。履歴は「スマホ送金：状況・履歴の確認」からいつでもご確認いただけます。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: b6ffde7c-2a77-579a-997a-043a2402894d
  title: スマホ送金：明細や記録と合わない
  body: 'お客様から「送金したはずなのに残高と合わない」「履歴に反映されていない」といったお問い合わせをいただいた際の対応手順です。


    **確認フロー**

    1. **履歴の同期確認**：アプリの「送金履歴」画面で、最新の状態に更新されているかを確認してください。

    2. **処理ステータスの確認**：送金が「完了」になっているか、「保留」や「エラー」になっていないかを確認します。

    3. **金額の照合**：1回100,000円、月間500,000円の限度額内で、正しく処理されているかを確認します（手数料は0円のため、送金額と減少額は一致します）。


    **エスカレーション基準**

    - 履歴には「完了」とあるが、相手に届いていないという申告があった場合。

    - システム上の不整合が疑われる場合。

    これらの場合は、専門チームにて取引ログを詳細に調査し、必要に応じて預金者保護法に基づいた補償手続きを含めた対応を行います。'
  domain: retail_banking
  product_category: sumaho_sokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: c3e984fa-343d-5ef5-8dfc-674ff98f4489
  title: 手数料・料金のご案内
  body: そらいろ銀行では、お客さまの日常的な利便性を最優先し、基本的な振込やATM利用に無料枠を設けております。無料回数を超えたご利用にのみ手数料を課す体系となっており、コスト負担を軽減した効率的な資産管理をサポートいたします。各商品ごとの詳細な無料回数や手数料については、それぞれの「手数料一覧」をご確認ください。
  domain: retail_banking
  product_category: general
