- id: 4c7ea357-1ac2-5a4a-9afe-73d64897c5ff
  title: 定期預金：ほかの選択肢との比較と向かない場合
  body: 'お客様の資産管理目的により、最適な商品は異なります。定期預金と他の選択肢を比較してください。


    **普通預金（そらいろ普通預金）との比較**

    ・金利：普通預金は0.45%ですが、定期預金は0.7%（6か月）または 0.9%（1年）と高い金利を提供します。

    ・自由度：普通預金はいつでも出金可能ですが、定期預金は満期まで預けることが前提となります。


    **定期預金が向かない方**

    ・急な出費に備えて、いつでも全額を自由に引き出したい方（→普通預金や目的別口座がおすすめです）。

    ・1,000円未満の少額から貯蓄を始めたい方。


    **定期預金がおすすめの方**

    ・使う予定のない資金を、普通預金よりも高い金利で効率的に増やしたい方。確実な資産形成を求める方に最適です。'
