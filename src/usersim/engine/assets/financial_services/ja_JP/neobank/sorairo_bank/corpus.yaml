- id: 7208cab9-1eee-57cf-bcf0-5ae67bfffacb
  title: 目的別口座：お手続きが完了しない・保留中のまま
  body: '目的別口座の作成手続きが「保留中」のまま完了しない場合、以下の点をご確認ください。


    【考えられる原因と確認事項】

    ・残高不足：初回入金額や自動入金設定額が、普通預金口座の現在の残高を上回っていないかご確認ください。特に自動入金を設定される場合は、最低1,000円以上の残高が必要です。

    ・通信環境：電波の不安定な場所で操作された場合、処理が中断することがあります。


    【対処法】

    1. 普通預金口座の残高を改めてご確認ください。

    2. 一度アプリを再起動し、再度手続きを試行してください。


    上記を確認しても解決せず、保留状態が続く場合は、当行にて取引ログの調査を行いますので、担当オペレーターへ詳細をお知らせください。調査結果は後ほどのご連絡にて回答いたします。'
