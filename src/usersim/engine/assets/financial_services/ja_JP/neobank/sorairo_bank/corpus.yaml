  title: スマホ送金：ご紹介・継続利用の特典
  body: 'あなたの大切なご友人に、便利で安心な「スマホ送金」をご紹介しませんか？


    スマホ送金は、お互いの電話番号さえ分かれば、アプリ一つで手軽に少額の送金ができるサービスです。最大の特徴は、送金手数料が0円であること。日常的なやり取りにコストがかからないため、デジタル世代の方々に大変ご好評いただいております。


    今なら、ご紹介いただいた方と、ご紹介を受けてご利用を開始された方の両方に、継続利用をサポートする特別な特典をご用意しております。詳細はアプリ内の「キャンペーン一覧」よりご確認ください。


    まずは、1回あたり100,000円まで、1か月あたり500,000円までという、使い勝手の良い上限設定で、スムーズな資金移動を体験してください。'
