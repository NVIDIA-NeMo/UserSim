- id: c531c151-c544-5b95-a76e-e2d39c9e5a62
  title: 目的別口座：金利・料率の決まり方と適用
  body: '目的別口座に適用される金利の仕組みについてご説明します。


    **適用金利**

    * **年率0.45%**


    **金利の適用ルール**

    * **一律適用**： 預入金額にかかわらず、全ての目的別口座に対して一律で年率0.45%が適用されます。特別なティア（段階）設定はありません。

    * **計算方法**： 普通預金と同様の計算方式で算出され、定期的に利息が加算されます。

    * **適用範囲**： 目的別口座に振り分けられた残高全てが対象となります。


    金利の変更が行われる場合は、アプリ内のお知らせおよびヘルプセンターにて速やかに公表いたします。'
