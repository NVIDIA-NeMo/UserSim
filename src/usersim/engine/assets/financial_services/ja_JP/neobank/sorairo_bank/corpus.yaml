  institution_id: sorairo_bank
- id: cb95b1a1-d793-5c6a-95d7-fe8d5f5c5cd2
  title: 定期預金：この商品をかたる詐欺にご注意ください
  body: '定期預金をかたる巧妙な詐欺にご注意ください。特に、「短期間で相場を大きく上回る高金利を保証する」といった勧誘メールやSMSには十分ご注意ください。当行の定期預金金利は最大で0.9%であり、これを超える不自然に高い金利を提示して送金を促すものは詐欺の可能性が非常に高いです。


    **ご注意いただきたい点**

    ・そらいろ銀行が、メールや電話でパスワードや暗証番号、二段階認証コードを伺うことは絶対にございません。

    ・「特別なプラン」への案内として、外部サイトへの誘導や個人情報の入力を求めることはございません。


    もし不審な連絡を受けたり、誤って情報を伝えてしまった場合は、すぐに利用停止の手続きを行ってください。迅速な対応が被害を最小限に抑えます。詳細なリスクについては「定期預金：リスクについてのご説明」をご確認ください。'
