- id: df58595a-651f-526b-939e-93aa788d25c4
  title: 目的別口座：ご利用開始までの手順
  body: '目的別口座を使い始めるための手順をご案内します。本サービスは、普通預金口座をお持ちの方であれば、アプリ内で完結してすぐに開始いただけます。


    **【開始までのステップ】**

    1. **機能の選択**：アプリのメニューから「目的別口座」を選択します。

    2. **目的の設定**：貯金したい目的（例：「旅行」「車」など）の名前を入力します。

    3. **金額の設定**：最初に振り分ける金額、または自動入金の設定を行います。

    4. **完了**：設定後、即座に目的別の管理画面が表示され、利用可能となります。


    **【基本スペック】**

    ・作成可能数：最大10個まで

    ・適用金利：0.45%（普通預金と同金利）

    ・自動入金：最低1,000円から設定可能


    詳細は「目的別口座：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: mokutekibetsu_koza
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sorairo_bank
- id: 3c341238-4cbc-58ca-b7f9-f6121839ff64
  title: 目的別口座：自動入金の最低金額について
  body: '**Q：目的別口座への自動入金を設定する場合、最低いくらから設定できますか？**


    A：自動入金機能をご利用いただく際は、最低1,000円から設定いただけます。少額から計画的に貯蓄を始めたい方に最適な機能です。設定方法は「目的別口座：お申込みとご利用開始」をご参照ください。'
