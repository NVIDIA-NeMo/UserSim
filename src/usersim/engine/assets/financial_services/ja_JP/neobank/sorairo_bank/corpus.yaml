- id: 0577e8d2-3dd9-5a21-9045-2de552863475
  title: スマホ送金：ログインできない・アクセスできない
  body: '「スマホ送金が利用できない」「ログインできない」という場合、以下の内容をご確認ください。


    **【よくある原因と解決策】**

    1. **パスワードの誤入力**: 正しいパスワードか再度ご確認ください。心当たりのない場合は再設定を行います。

    2. **二段階認証の不備**: ワンタイムパスワードが届かない場合、電波状況やSMS受信設定を確認してください。

    3. **機種変更後の未登録**: 機種変更をした際は、認証の再登録が必要です。手続きを行ってください。


    **【解決しない場合】**

    上記を確認してもログインできない場合は、専門のオペレーターへエスカレーションいたします。お客様のご本人確認を行った後、アカウントの状態を調査し、制限の解除や認証情報の再設定をサポートいたします。完了まで通常1〜3営業日いただきます。'
