- id: 1b75420c-755c-5b3d-858b-cebd5e8bfe58
  title: open_account を使う場面
  body: '新規にお客様の口座開設をサポートする場合に使用します。そらいろ銀行は店舗を持たないインターネット専業銀行であり、原則としてアプリ完結の口座開設を推奨していますが、オペレーターによるサポートが必要な場合に本ツールを用います。


    【手続き手順】

    1. 本人確認の準備：犯罪収益移転防止法に基づき、厳格な本人確認（取引時確認）が必要です。マイナンバーカードのICチップ読み取りによるオンライン本人確認が完了しているか確認してください。

    2. 口座開設の実行：お客様の氏名、生年月日、連絡先などの必要情報を確認し、`open_account` を呼び出して口座開設手続きを行います。

    3. 完了案内：口座開設完了後、アプリでのログイン方法や、メイン口座となる「普通預金」の活用方法についてご案内してください。


    【留意事項】

    - 口座開設時の条件や必要書類の詳細については、「普通預金：必要書類」および「普通預金：お申込みいただける方」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: sorairo_bank
- id: 54bd3c8e-dbd1-5987-9a4c-f50923b8c00e
  title: open_account ツールリファレンス
  body: '新規の銀行口座を開設します。エージェントはこのツールを直接呼び出して手続きを行います。


    【引数】

    - `full_name`: お客様のフルネーム。

    - `date_of_birth`: お客様の生年月日。

    - `contact_info`: 電話番号、メールアドレスなどの連絡先詳細。


    【動作】

    - 入力された情報に基づき、新規口座を作成し、口座番号を発行します。

    - 犯罪収益移転防止法に基づく本人確認が完了していることが前提となります。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
