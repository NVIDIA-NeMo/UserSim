- id: 41aec122-9d3a-540d-b41c-c6b19c8a00a8
  title: close_account を使う場面
  body: 'お客様の依頼に基づき、口座を解約（閉鎖）する場合に使用します。口座解約は取り消し不可能な操作であるため、慎重に手続きを行ってください。


    【手続き手順】

    1. 本人確認の実施：お客様のフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させてください。

    2. 対象口座の特定：`get_accounts` を使用し、解約対象となる口座の `account_id` を特定します。

    3. 残高の確認と処理：口座に資金が残っている場合、`transfer_funds` 等を用いて他口座へ資金を移動させるか、出金手続きを案内してください。残高がある状態では解約できない場合があります。

    4. 解約の実行：お客様に解約後の影響（振込先としての利用不可など）を改めて説明し、同意を得た上で `close_account` を呼び出します。


    【留意事項】

    - 定期預金などの解約については、「定期預金：解約・変更・プランの切替え」の手順に従ってください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: sorairo_bank
- id: 4a02c875-1320-5ef2-94dc-c7795912a3f5
  title: close_account ツールリファレンス
  body: '指定された口座を解約し、閉鎖します。この操作は不可逆的（取り消し不能）です。エージェントはこのツールを直接呼び出します。


    【引数】

    - `account_id`: 解約対象となる口座の識別子。


    【動作】

    - 指定された口座のステータスを「閉鎖」に変更し、以降の全ての取引を停止します。

    - 本ツールを呼び出す前に、必ず `verify_identity` による本人確認が完了している必要があります。'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
