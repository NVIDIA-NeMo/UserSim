  title: 普通預金：切替えや上位プランを検討するとき
  body: '顧客が資産運用の効率化を検討している場合は、以下の視点で提案してください。


    * **流動性と金利の両立を求める場合**：年利0.45%の「普通預金」が最適です。

    * **より高い金利で確実に貯めたい場合**：最大0.9%の金利が得られる「定期預金」への移行を提案してください。

    * **目的別に資金を整理したい場合**：同じ金利で最大10個まで管理できる「目的別口座」の併用を案内してください。


    詳細は「普通預金：当社の似た商品との比較」をご参照ください。'
