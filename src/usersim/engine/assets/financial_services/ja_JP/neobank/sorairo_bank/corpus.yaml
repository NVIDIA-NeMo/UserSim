  body: 'Q：スマホ送金で1か月に送金できる金額に上限はありますか？


    A：はい。1か月あたりの送金合計限度額は500,000円となっております。この金額を超えて送金したい場合は、通常の振込機能をご検討ください。詳細は「スマホ送金：商品概要」をご確認ください。'
