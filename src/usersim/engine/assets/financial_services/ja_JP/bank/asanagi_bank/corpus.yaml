- id: 88607d25-a6a4-5192-887c-6925f79ac953
  title: 朝凪カードローン：限度額・制限と注意事項
  body: '「朝凪カードローン」のご利用における限度額および制限事項についてご案内します。本商品は厳正な返済能力審査に基づき、お客様ごとに利用限度額を決定いたします。最大利用限度額は8,000,000円です。


    適用される貸付金利は年2%から14.5%の範囲内で、審査結果に応じて決定されます。本商品は総量規制の対象外となりますが、適正な借入金額を維持するため、個別の審査を徹底しております。


    【注意事項】

    ・審査結果により、ご希望の限度額に達しない場合がございます。

    ・返済状況により、利用限度額が一時的に制限される場合があります。

    ・重要な手続きの前には、犯罪収益移転防止法に基づく厳格な本人確認を実施いたします。'
