  institution_id: asanagi_bank
- id: ad25598d-4080-51fb-95f5-ad2c590e516b
  title: 普通預金：登録内容の変更
  body: '普通預金の登録内容（住所、氏名、電話番号など）を変更する手順は以下の通りです。


    1. 変更内容の提示：変更したい項目と、新しい情報を当行にお伝えください。

    2. 本人確認書類の提出：住所変更などの重要な手続きには、最新の住所が記載された住民票や免許証などの本人確認書類をご提示いただきます。

    3. 内容の照合と更新：当行にてご提示いただいた書類と登録内容を照合し、変更手続きを行います。

    4. 完了の確認：手続き完了後、変更内容が正しく反映されたことを確認し、手続き完了となります。


    ※重要な登録内容の変更にあたっては、セキュリティ確保のため厳格な本人確認を実施させていただきます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: a68d9f36-8326-5054-bbde-d13b22ea020b
  title: 普通預金：ログインできない・アクセスできない
  body: 'オンラインバンキングで普通預金口座にアクセスできない場合、以下の点をご確認ください。


    【考えられる原因と対処法】

    ・ログインIDやパスワードの入力誤り：大文字・小文字の区別を含め、正しく入力されているか再度ご確認ください。

    ・認証エラー：セキュリティカードの有効期限切れや、生体認証の一時的な不具合が考えられます。

    ・アカウントのロック：短時間に複数回入力を間違えた場合、セキュリティのため口座が一時的にロックされます。


    【解決しない場合】

    上記を確認しても解決しない場合は、当行へお知らせください。専門部署へエスカレーションし、本人確認の上でパスワードの再発行やロック解除の手続きを誠実に行わせていただきます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 1008f542-b9d0-598d-bc9a-fc8548617ec7
  title: 普通預金：ご利用条件による違い
  body: 'お客様のご利用条件による手数料の適用は以下の通りです。


    ・給与・年金受取口座に指定あり：ATM利用料、振込手数料などの優遇制度が適用され、条件に応じて無料となります。

    ・給与・年金受取口座に指定なし：通常の手数料（例：時間外ATM利用料 110円、他行あてオンライン振込手数料 220円）が適用されます。'
