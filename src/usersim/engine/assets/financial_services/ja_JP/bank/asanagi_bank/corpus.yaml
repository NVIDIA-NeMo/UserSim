  institution_id: asanagi_bank
- id: bf4c7207-abcb-5ab9-8b88-680c93bbee1b
  title: 朝凪カードローン：規定・約款の変更
  body: '本規定は、「朝凪カードローン」の利用条件を定めるものです。お客様と当行の合意に基づき、以下の条件で契約を締結します。


    ■金利および限度額

    貸付金利は年2%から14.5%の範囲内で、審査に基づき決定します。利用限度額は最大8,000,000円までとし、個別の返済能力審査により決定されます。


    ■返済義務

    お客様は、毎月2,000円以上の最低返済額を期日までに支払う義務を負います。


    ■約款の変更

    法令の改正や経済情勢の変化に伴い、当行は規定・約款を変更することがあります。変更内容は、適用日の1ヶ月前までにお知らせします。変更後の内容に同意いただけない場合は、本契約を解約いただけます。'
