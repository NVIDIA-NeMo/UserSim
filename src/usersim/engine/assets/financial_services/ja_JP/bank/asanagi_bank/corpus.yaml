- id: b1579e65-c70c-58c1-8864-c8f7cde89331
  title: 給与・年金受取特典：リスクについてのご説明
  body: '本特典のご利用にあたり、以下の点にご留意ください。


    【特典適用の条件について】

    本特典は、継続的に給与または年金をお受け取りいただくことが条件となります。転職や受給状況の変化により受取実績がなくなった場合、自動的に特典適用が停止されます。この場合、振込手数料やATM利用手数料が通常料金で発生いたしますのでご注意ください。


    【預金保護について】

    本特典を適用した口座の預金も預金保険制度の対象で、当行のほかの預金と合算して、預金者1人当たり元本1,000万円までと破綻日までの利息等が保護されます。


    【金利の変動について】

    年金受取に伴う0.1%の金利上乗せ分を含め、適用金利は市場環境や当行の金利改定方針に基づき変更される場合がございます。変更の際は、店頭掲示等でご案内いたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: disclosure
  source_authority: official
