  mentions_tools: []
  institution_id: asanagi_bank
- id: 509262a6-978a-579e-bd91-59e3eb73422d
  title: 給与・年金受取特典：限度額・制限と注意事項
  body: '本特典の適用における制限および注意事項は以下の通りです。サポート担当者は、お客様へご案内する際に正確な数値を用いて説明してください。


    【無料回数の制限】

    ・他行あて振込手数料の無料回数：月3回まで

    ・ATM利用手数料の無料回数：月5回まで

    ※月間の無料回数を超えた分については、所定の手数料が発生します。


    【金利優遇の制限】

    ・年金受取の方への上乗せ金利：0.1%

    ※本金利は年金受取口座として指定されている場合に限り適用されます。


    【適用条件】

    本特典は、当行の口座を給与受取または年金受取口座として指定しているお客様が対象です。指定が解除された場合、または受取実績が確認できなくなった場合は、翌月より特典の適用外となります。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e5c5e401-ab2e-5edf-b57a-398bd28dab08
  title: 給与・年金受取特典：手数料と費用
  body: 'Q：この特典を利用するために、別途費用や年会費はかかりますか？

    A：いいえ、本特典のご利用に費用は一切かかりません。給与や年金の受取口座に指定いただくことで無料で適用されます。


    Q：具体的にどのような手数料が無料になりますか？

    A：月3回までの他行あて振込手数料と、月5回までのATM利用手数料が無料となります。'
