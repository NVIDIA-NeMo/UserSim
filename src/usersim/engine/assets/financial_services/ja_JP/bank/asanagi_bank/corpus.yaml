- id: 1681eab8-9cdc-590c-b994-6276c2d9d273
  title: 朝凪カードローン：個人情報の取扱い
  body: '当行は、個人情報保護法および犯罪収益移転防止法を遵守し、お客様の個人情報を厳重に管理いたします。


    ■利用目的

    「朝凪カードローン」のお申込み時にご提供いただいた個人情報は、主に以下の目的で利用します。

    ・貸付審査（返済能力の確認）および利用限度額（最大8,000,000円）の決定

    ・貸付金利（年2%から14.5%）の算定

    ・ご契約内容の管理および返済状況の確認


    ■第三者への提供

    信用情報機関への照会および登録を行い、公正かつ透明性の高い取引を徹底します。また、法令に基づく正当な要請がある場合を除き、お客様の同意なく第三者に情報を提供することはありません。'
