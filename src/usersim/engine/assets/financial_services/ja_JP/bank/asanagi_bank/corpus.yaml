- id: b1e17b3d-936d-5ffd-9adf-332d51628a25
  title: 住宅ローン：限度額・制限と注意事項
  body: '【住宅ローン：限度額および制限事項】


    ■借入限度額

    最大100,000,000円まで。ただし、お客様の返済能力審査に基づき決定いたします。


    ■借入期間

    最長35年までとなります。


    ■融資手数料

    借入金額に対し2.2%の融資手数料を申し受けます。


    ■返済額の見直し（変動金利選択時）

    金利変動に伴う返済額の見直しは5年ごとに行われます。また、見直し後の返済額が前回の125%を超える場合は、原則として前回の返済額に据え置く上限設定（125%ルール）を導入しております。


    【注意事項】

    審査の結果、限度額に至らない場合や、ご希望の期間での借入ができない場合がございます。詳細な条件については、個別審査後のご案内となります。'
