- id: 14b7c5ac-8942-565c-b1d9-8ebfbcdf8357
  title: close_account を使う場面
  body: 'お客様から口座の解約（閉鎖）を依頼された場合に、本ツールを用いて手続きを行います。


    1. 取引時確認に基づき、厳格な本人確認を実施します。

    2. get_accountsを使用して、解約対象となる口座のaccount_idを正しく特定します。

    3. close_accountを呼び出し、口座の閉鎖手続きを完了させます。


    なお、口座に残高がある場合は、あらかじめ他口座への振替などの処理が必要となります。詳細な流れは「普通預金：解約・変更・プランの切替え」をご参照ください。'
