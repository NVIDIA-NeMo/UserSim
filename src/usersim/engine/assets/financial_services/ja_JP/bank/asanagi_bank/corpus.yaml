- id: 4521da27-ddf3-5337-b598-94cb2ddfbc29
  title: 給与・年金受取特典：この商品をかたる詐欺にご注意ください
  body: '最近、当行の「給与・年金受取特典」を悪用し、「特典内容をアップグレードするため」や「手数料無料回数を増やすため」などと称して、お客様の個人情報を聞き出そうとする不審な電話やメールが報告されています。


    当行から、特典の適用条件としてセキュリティカードの暗証番号やパスワードを伺うことは絶対にございません。また、不自然なURLへのアクセスを求めることもございません。もしこのような連絡があった場合は、すぐにお電話を切り、当行の窓口までご連絡ください。


    万が一、情報を伝えてしまった可能性がある場合は、被害を最小限に抑えるため、至急に口座の利用停止手続きを行ってください。迅速なご報告が、大切な資産を守ることにつながります。'
