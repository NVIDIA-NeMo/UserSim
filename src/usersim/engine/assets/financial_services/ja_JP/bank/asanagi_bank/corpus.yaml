  title: 朝凪Visaデビット：お申込みとご利用開始
  body: '朝凪Visaデビットのお申込みからご利用開始までの手順をご案内いたします。


    1. 本人確認書類（運転免許証、マイナンバーカードなど）をご用意ください。

    2. 当行の窓口またはオンラインバンキングにて、お申し込み手続きを行います。

    3. 当行にて厳格な本人確認（取引時確認）および審査を実施します。

    4. ご登録住所へカードが郵送されますので、お届けをお待ちください。

    5. お手元のカードを有効化していただくことで、Visa加盟店での即時引き落とし決済が開始されます。


    カードの有効化が完了すれば、すぐに日々のショッピングでご利用いただけます。'
