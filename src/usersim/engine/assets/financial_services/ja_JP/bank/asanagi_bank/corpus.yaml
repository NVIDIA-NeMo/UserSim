- id: b4e9c8cb-d74e-5127-b1a4-f26082e2be6d
  title: 住宅ローン：融資手数料（借入金額に対する割合）について
  body: 'Q：住宅ローンの契約時に支払う融資手数料はいくらになりますか？


    A：当行の住宅ローンでは、融資手数料として借入金額の2.2%を申し受けます。例えば、1,000万円をご借入の場合、手数料は220,000円となります。


    詳細な費用内訳については「住宅ローン：手数料一覧」をご確認ください。'
