  title: 朝凪カードローン：利用限度額の上限について
  body: 'Q：利用限度額は最大でいくらまで設定可能ですか？


    A：「朝凪カードローン」の利用限度額は、最大8,000,000円となります。ただし、実際の設定額は、お客様の年収や勤続年数、他社借入状況などの審査に基づき、個別に決定させていただきます。'
