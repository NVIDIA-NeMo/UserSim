  title: 給与・年金受取特典：時間外ATM手数料の無料回数（月）について
  body: 'Q：時間外ATM手数料の無料回数は、月に何回までですか？

    A：本特典をご利用のお客さまは、時間外ATM利用手数料が月に5回まで無料となります。


    Q：無料回数を超えた場合はどうなりますか？

    A：6回目以降のご利用分より、通常の手数料が適用されます。詳細は「給与・年金受取特典：手数料一覧」をご確認ください。'
