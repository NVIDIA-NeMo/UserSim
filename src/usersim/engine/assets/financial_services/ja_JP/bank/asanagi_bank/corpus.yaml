- id: 3b601105-5689-53c4-9064-6883ec6cc4e2
  title: 住宅ローン：お手続きが完了しない・保留中のまま
  body: '【症状】住宅ローンの申込み手続きをした後、ステータスが「保留中」のまま完了しない。


    【考えられる原因】

    ・ご提出いただいた本人確認書類や収入証明書の不備（期限切れや記載漏れ）。

    ・取引時確認における情報の不足。


    【確認・解決手順】

    1. 必要書類の再確認：最新の証明書が正しく提出されているかご確認ください。

    2. 不足情報の提供：当行から案内がある不足分について、追加で書類をご提示ください。


    【解決しない場合】

    審査に時間を要している場合がございます。当行にて専門部署へエスカレーションし、現在の進捗状況を確認いたします。確認後、担当者より改めてご連絡を差し上げます。'
