- id: c3350573-0929-51dd-87d4-a2cf3f0d5176
  title: 住宅ローン：この商品をかたる詐欺にご注意ください
  body: '当行の住宅ローンをかたり、「特別な低金利プランへの切り替え」や「審査なしでの限度額増額」をうたって個人情報を聞き出そうとする詐欺が発生しております。十分にご注意ください。


    朝凪銀行が、メールやSMSでセキュリティカードの暗証番号や、オンラインバンキングのログインパスワードを伺うことは決してございません。また、不自然な手数料の事前支払いを求めることもございません。


    もし不審な連絡を受け、個人情報を伝えてしまった場合や、金銭的な要求を受けた場合は、直ちにご相談ください。迅速な対応により被害を最小限に抑えます。日頃から不審な連絡に警戒し、信頼できる窓口でご確認いただくようお願い申し上げます。'
