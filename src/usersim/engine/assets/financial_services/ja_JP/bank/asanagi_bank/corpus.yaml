  institution_id: asanagi_bank
- id: 90e3472d-bffc-53dd-b5fa-fda11f9990cb
  title: 朝凪カードローン：切替えや上位プランを検討するとき
  body: 他商品のローンからの切り替えを検討される際は、柔軟性を重視するか、固定コストの低減を重視するかで選択が変わります。「朝凪カードローン」は、年2%から14.5%の金利範囲で、最大8,000,000円まで柔軟に借入・返済が可能です。特定の目的で低金利を固定したい場合は住宅ローン等が適していますが、急な支出への対応や自由な返済計画を優先される方には、本商品が最適です。
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: comparison
