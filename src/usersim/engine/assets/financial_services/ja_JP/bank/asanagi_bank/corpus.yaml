  title: get_account_transactions を使う場面
  body: 'お客様から入出金明細や取引履歴の照会依頼を受けた際に、以下の手順で対応します。


    1. `verify_identity` を用いて、お客様の本人確認を完了させます。

    2. お客様から提示された口座番号の下4桁を用い、`get_accounts` を呼び出して、対象となる正確な account_id を特定します。

    3. 特定した account_id を引数として `get_account_transactions` を実行し、最新の取引履歴を取得して、お客様に提示します。'
