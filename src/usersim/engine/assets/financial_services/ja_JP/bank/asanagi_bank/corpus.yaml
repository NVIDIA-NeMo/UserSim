- id: 914748ec-81ae-551b-b8e4-8e70e32f83ec
  title: 朝凪カードローン：安全にご利用いただくためのポイント
  body: '「朝凪カードローン」を安全にご利用いただくため、以下の点にご注意ください。


    ■不審な連絡への警戒

    当行からメールやSMSで、暗証番号やセキュリティカードの全番号を伺うことは絶対にございません。心当たりのないURLリンクは開かず、速やかに削除してください。


    ■カードの管理

    カードの紛失や盗難に心当たりがある場合は、直ちに当行までご連絡ください。迅速な届出により、被害を最小限に抑えることができます。


    ■万が一のときは

    身に覚えのない利用明細を確認した場合は、すぐに当行へお知らせください。ご報告から一定期間に基づき、誠実に調査と対応を行います。詳細は「朝凪カードローン：商品概要」をご確認ください。'
