- id: 5da59091-59eb-5a5b-938f-9c566964be9e
  title: 朝凪カードローン：不正利用からお客さまを守るために
  body: '朝凪カードローンをご利用のお客さまに、不正利用を防ぐための重要なご注意を申し上げます。当行が、電話やメール、SMSなどで、セキュリティカードの暗証番号やログインパスワードを直接お伺いすることはございません。このような要求があった場合は、詐欺の可能性が高いため、絶対に応じないでください。


    万が一、カードの紛失や盗難、または身に覚えのない利用があった場合は、直ちにご連絡ください。当行では預金者保護法に基づき、偽造・盗難カードによる被害を原則として補償いたします。迅速な届出が被害を最小限に抑える唯一の方法です。また、不審な取引を検知した際は、当行にて一時的に利用制限を設ける場合がございますので、あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: security_advisory
