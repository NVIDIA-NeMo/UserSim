  title: 住宅ローン：ご紹介・継続利用の特典
  body: 地域に根ざした朝凪銀行では、大切な方にご紹介いただいた方と、日頃より当行をご利用いただいているお客様へ向けた特別な優待をご用意しております。信頼ある地域コミュニティの一員として、皆様の理想の住まいづくりを誠心誠意サポートいたします。詳細な適用条件については、窓口にてご案内させていただきます。
