    【回答】変動金利（優遇後）は1.375%となります。市場金利の変動に伴い定期的に見直しが行われます。詳細については「住宅ローン：金利・料率一覧」をご確認ください。また、返済額の見直しは5年ごとに行われ、上昇幅は前回の125%が上限となります。'
