- id: 174c12f3-a540-5eb1-a86e-4f884422c6ab
  title: 住宅ローン：規定・約款の変更
  body: '当行の住宅ローン規定および約款は、法令の改正や経済情勢の変化に伴い変更される場合がございます。変更の際は、事前に書面または当行の告知によりお知らせいたします。


    特に変動金利プランをご利用の場合、返済額の見直しは5年ごとに行われます。その際、金利上昇による返済額の増加には上限が設けられており、前回の改定後のお支払額の125%が上限となります。この「5年ルール」と「125%ルール」は、お客様の急激な負担増を抑え、生活の安定を図るための重要な規定です。他社プランと比較される際は、これらの見直し周期と上昇幅の制限についてご確認いただくことをお勧めいたします。'
