- id: e312b9d4-e503-5e82-b07d-c98b02a0d7aa
  title: 朝凪カードローン：お手続きが完了しない・保留中のまま
  body: '【症状】お申込み手続きを完了させたが、ステータスが「保留中」のまま進まない。


    【考えられる原因】

    ・ご提示いただいた本人確認書類に不備（有効期限切れや記載内容の不鮮明など）がある。

    ・審査に時間を要する特別な確認事項が発生している。


    【対処法】

    1. 書類の再確認：提出された書類が最新であり、不備がないか改めてご確認ください。必要に応じて不足書類の追加提出をお願いいたします。

    2. 状況照会：当行にて現在の審査進捗を照会いたしますので、お申し付けください。


    【解決しない場合】

    審査専門部署へエスカレーションし、詳細な調査を行います。通常、数営業日以内に審査結果または不足書類のご案内を差し上げます。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: troubleshooting
