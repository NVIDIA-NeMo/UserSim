- id: 36ba83be-7301-5147-923c-df17cadd8907
  title: スーパー定期：手数料と費用
  body: 'Q：「スーパー定期」の口座開設や維持に手数料はかかりますか？


    A：いいえ、「スーパー定期」の口座開設および維持に手数料はかかりません。無料でご利用いただけます。なお、ATM利用料などの手数料を無料にするには、「給与・年金受取特典」の適用条件を満たすことをおすすめいたします。'
