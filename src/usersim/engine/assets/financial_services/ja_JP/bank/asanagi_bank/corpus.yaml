  title: cancel_time_deposit を使う場面
  body: 'お客様がスーパー定期を満期前に解約し、普通預金へ戻すことを希望される際に本手続きを行います。


    1. 本人確認（取引時確認）を完了させます。

    2. `get_accounts` を使用し、対象となるスーパー定期の口座番号を特定します。

    3. 中途解約利率が適用されるため、適用される利息が通常の預入金利よりも低くなる点について説明し、同意を得ます。

    4. `cancel_time_deposit` を呼び出し、元金と中途解約利率で計算した利息を普通預金に入金します。


    中途解約の詳細については「スーパー定期：規定・約款」をご確認ください。'
