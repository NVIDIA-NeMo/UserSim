  body: 朝凪Visaデビットのご利用規定および約款は、法令の改正やサービス維持コストの変動に伴い、変更される場合がございます。変更の内容がお客様に重要な影響を及ぼす場合は、書面または当行ホームページにて事前に告知いたします。本カードは年会費0円でご提供しておりますが、海外利用時には3%の事務手数料が発生いたします。また、1日あたりの利用限度額は500,000円と定められており、審査状況により変動する場合があります。お客様は、カードの管理責任を負い、紛失時は速やかに届出を行う義務がございます。約款の変更に同意いただけない場合は、いつでもカードの解約を申請いただけます。
