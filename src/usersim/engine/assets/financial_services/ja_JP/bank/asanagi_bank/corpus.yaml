- id: cba6d45d-d87a-51ad-84aa-c781f51cd373
  title: 給与・年金受取特典：当社の似た商品との比較
  body: '「普通預金：商品概要」の基本口座と、本特典を適用した際の違いを比較します。


    ■他行あて振込手数料

    ・普通預金（基本）：毎回所定の手数料が発生

    ・給与・年金受取特典：月3回まで0円


    ■ATM利用手数料

    ・普通預金（基本）：時間外利用時などに手数料が発生

    ・給与・年金受取特典：月5回まで0円


    ■金利面（年金受取の場合）

    ・普通預金（基本）：基本金利のみ

    ・給与・年金受取特典：基本金利に0.1%を上乗せ


    日々の振込やATM利用が多い方、または年金受取で効率的に資産を管理したい方は、本特典の適用が最適です。'
  domain: retail_banking
