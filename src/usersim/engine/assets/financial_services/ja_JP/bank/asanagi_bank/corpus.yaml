  title: 給与・年金受取特典：手数料一覧
  body: '給与・年金受取特典が適用されているお客様に適用される手数料は以下の通りです。


    ■他行あて振込手数料

    ・月1回目から3回まで：0円

    ・4回目以降：通常手数料を適用


    ■ATM利用手数料

    ・月1回目から5回まで：0円

    ・6回目以降：通常手数料を適用


    ※本特典は、給与または年金の受取口座として当行を指定されていることが条件となります。'
