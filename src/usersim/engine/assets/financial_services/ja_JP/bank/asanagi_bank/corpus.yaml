- id: 83dc5364-a026-51a1-b89f-24c3afab4da4
  title: 住宅ローン：個人情報の取扱い
  body: '朝凪銀行は、個人情報保護法および犯罪収益移転防止法を遵守し、お客様の個人情報を厳重に管理いたします。


    住宅ローンのお申込みにあたり、ご提供いただいた個人情報は、以下の目的で利用いたします。

    ・審査および融資額（最大100,000,000円まで）の決定のための信用情報照会

    ・ローン契約の締結および返済管理（最長35年）

    ・重要なお知らせの送付および本人確認（取引時確認）の実施


    当行は、お客様の同意なく個人情報を第三者に提供することはございません。ただし、法令に基づき開示を求められた場合はこの限りではありません。個人情報の取り扱いに関する詳細や開示請求については、当行の個人情報保護方針をご確認ください。'
