- id: d86c2c81-34ae-5e45-829a-96d42f61a05c
  title: 普通預金：他行あて振込手数料（インターネットバンキング）について
  body: 'Q：インターネットバンキングで他行に振り込む際の手数料はいくらですか？


    A：他行あて振込手数料は、1回につき220円となります。


    Q：手数料を無料にする方法はありますか？


    A：給与や年金の受取口座に指定いただくことで、手数料の優遇を受けられる「給与・年金受取特典：商品概要」がございます。条件を満たした場合、無料回数の提供がございますので、ぜひご検討ください。'
  domain: retail_banking
  product_category: futsu_yokin
