- id: 6eef4e46-4524-5376-aec5-7a90833f5b0b
  title: 給与・年金受取特典：ご利用開始までの手順
  body: 'お客様が「給与・年金受取特典」のご利用を開始するための手順は以下の通りです。


    1. 普通預金口座の確認：お客様が「普通預金：商品概要」に準じた口座を保有しているか確認します。

    2. 受取口座の指定：お客様ご自身で、勤務先または年金事務所等に対し、当行の口座を給与・年金の受取口座として指定していただきます。

    3. 受取の確認：当行にて、実際に給与または年金の振込が確認された時点で、特典の適用対象となります。

    4. 特典の適用：適用後は、月3回までの他行あて振込手数料が無料となり、月5回までATM利用手数料が無料となります。年金受取の方には、さらに定期預金の金利に0.1%が上乗せされます。'
