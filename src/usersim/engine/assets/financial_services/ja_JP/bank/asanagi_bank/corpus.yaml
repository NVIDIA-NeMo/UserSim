- id: 8b6e3c3e-d222-501e-a717-3432cbc608f0
  title: 給与・年金受取特典：登録内容の変更
  body: '特典適用のための登録内容を変更される際の手順をご案内します。


    1. 変更内容の提示：受取口座の変更や、給与・年金の受取状況に変更があった旨をお知らせください。

    2. 本人確認の実施：犯罪収益移転防止法に基づき、厳格な本人確認（取引時確認）を行います。必要な本人確認書類をご提示ください。

    3. 内容の更新：当行にて登録情報を更新し、変更内容を確定させます。

    4. 適用の確認：変更後、改めて給与または年金の振込が確認され次第、月3回の振込手数料無料、月5回のATM利用手数料無料、および年金受取の方への0.1%金利上乗せなどの特典が適用されます。手続き完了後、確認通知をいたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
