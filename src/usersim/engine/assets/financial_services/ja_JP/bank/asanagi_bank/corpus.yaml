- id: e239f2fe-f48a-52ae-a2f0-6c0e72947fb8
  title: freeze_card を使う場面
  body: 'キャッシュカードまたは朝凪Visaデビットの紛失・盗難の届出を受けた際は、二次被害を防止するため、直ちに以下の手順で利用停止措置を講じます。


    1. `verify_identity` を実行し、届け出者が正当な権限を持つ方であることを確認します。

    2. `get_accounts` を用いて、停止対象となるカードが紐付いている account_id を特定します。

    3. 即座に `freeze_card` を呼び出し、当該カードの利用を停止させます。その後、再発行の手続きについて案内します。'
