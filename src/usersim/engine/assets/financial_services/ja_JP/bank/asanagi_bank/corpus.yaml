  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 46bd5b76-712e-5164-b5d7-3988ab4b2311
  title: 給与・年金受取特典：ほかの選択肢との比較と向かない場合
  body: '本特典は、地域に根ざした当行をメインバンクとしてご利用いただく方に最適な制度です。


    【本特典が適している方】

    ・給与や年金を当行で受け取り、月々の支払いで他行への振込（月3回まで無料）や、コンビニ等のATM利用（月5回まで無料）が多い方。

    ・年金受取口座として指定し、0.1%の金利上乗せによる効率的な資産形成を目指す方。


    【向かない場合】

    ・給与や年金の受取先を他行に固定されており、変更が困難な方。

    ・月間の振込回数が極めて多く、月3回の無料枠では不十分な方。


    本特典は特定の受取条件を満たすことで利便性を最大化する仕組みとなっております。条件を満たさない場合は、通常の普通預金口座をご利用ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: product_sheet
  source_authority: official
