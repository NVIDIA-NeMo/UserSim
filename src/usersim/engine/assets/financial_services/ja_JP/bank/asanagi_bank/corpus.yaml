  title: 給与・年金受取特典：ご紹介・継続利用の特典
  body: '【2026年1月1日から2026年3月31日まで】

    当行の「給与・年金受取特典」を継続してご利用いただいているお客さま、およびご友人に本特典をご紹介いただいたお客さまへ、日頃の感謝を込めて、月3回の他行あて振込手数料無料と、月5回のATM利用手数料無料の優遇を適用いたします。地域に根ざした安心のサポートを、ぜひご体感ください。'
