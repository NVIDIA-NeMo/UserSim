- id: 66ecaabd-0d84-5d3d-ab21-1fa9c88ef528
  title: スーパー定期：安全にご利用いただくためのポイント
  body: '大切なお預金を安全に管理するため、以下のポイントにご注意ください。


    1. 多層的な認証の活用：

    オンラインバンキングでの操作時には、セキュリティカードや生体認証を必ず併用し、第三者による不正アクセスを防止してください。

    2. 秘密情報の管理：

    当行がメールや電話、SNS等で、お客様の暗証番号やセキュリティカードの情報を伺うことは絶対にございません。このような連絡があった場合は、詐欺の可能性がありますので十分にご注意ください。

    3. 迅速な報告：

    万が一、パスワードの漏洩や不審な取引に気づかれた場合は、直ちにご報告ください。被害を最小限に抑えるため、迅速な停止手続きを行います。'
