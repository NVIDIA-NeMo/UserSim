- id: ad0a470c-c55f-5e69-8c28-104aa3c087d7
  title: 朝凪カードローン：お取引が拒否された・制限された
  body: '【症状】カードローンでの借入や出金が拒否される、または利用制限がかかっている。


    【考えられる原因と確認事項】

    1. 利用限度額への到達：現在の利用額が、設定された限度額（最大8,000,000円）に達していないかご確認ください。

    2. お支払いの遅延：前月分などの返済が滞っている場合、制限がかかることがございます。

    3. セキュリティロック：短期間に不自然な操作があった場合、保護のため制限される場合がございます。


    【解消方法】

    まずはお取引状況を確認し、未払金がある場合は速やかなご返済をお願いいたします。


    【エスカレーション】

    審査状況の変更や、制限の解除に時間を要する場合、または理由が不明な場合は、専門部署にて詳細な信用状況の再確認を行い、結果をご案内いたします。'
