  institution_id: asanagi_bank
- id: 246ee1d9-5bbd-5dae-b304-e43f24e87bb0
  title: 朝凪カードローン：ログインできない・アクセスできない
  body: 'オンラインサービスでログインできない場合の確認事項です。


    ■症状：ログインボタンを押してもエラー画面になる、または「認証に失敗しました」と表示される。


    ■確認順序と対処法

    1. 入力内容の再確認：IDやパスワードに不要なスペースが入っていないか、大文字・小文字が正しく入力されているかを確認してください。

    2. 通信環境の確認：ネットワーク接続が不安定な場合、アクセスが遮断されることがあります。一度接続を切り、再度お試しください。

    3. パスワードの再設定：心当たりがない場合は、パスワードの再設定手続きを案内いたします。


    ■解決しない場合

    上記で解決しない場合は、当行にてアカウントの状態を調査します。状況に応じて専門部署へエスカレーションし、復旧までのお時間を改めてご案内いたします。'
