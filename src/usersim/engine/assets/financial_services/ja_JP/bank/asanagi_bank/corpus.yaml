- id: 69dd09aa-5ed8-5263-a3e2-d25e4d3b2be6
  title: 給与・年金受取特典：他社の一般的な商品との比較
  body: '他社の一般的な受取口座特典と比較し、当行の「給与・年金受取特典」は「振込」と「ATM」の両面でバランスの良い利便性を提供しています。


    【当行の特典内容】

    ・他行あて振込手数料：月3回まで無料

    ・時間外ATM利用手数料：月5回まで無料

    ・年金受取金利：0.1%上乗せ


    他社ではATM手数料のみが無料となるケースが多く、振込手数料まで月3回無料で提供するプランは希少です。特に、月々の送金回数が多い方や、年金受取による金利優遇を重視される方に、当行のプランは最適です。'
