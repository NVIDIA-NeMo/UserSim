- id: c70cd12c-deec-51d3-9783-f33b73bdbf56
  title: 朝凪カードローン：解約・変更・プランの切替え
  body: '朝凪カードローンの解約、または契約内容の変更手続きは以下の手順で行ってください。


    1. 本人確認書類をご提示いただき、犯罪収益移転防止法に基づいた取引時確認を実施します。

    2. 解約または変更（限度額の変更等）の内容を当行へお申し出ください。

    3. 解約の場合、借入残高がある場合は、利息を含む全額の返済手続きを行います。完済が確認できるまで解約は完了いたしません。

    4. 当行にて手続きを処理し、解約完了または変更完了の通知をいたします。


    なお、限度額の変更（増枠）を希望される場合は、改めて返済能力の審査を実施させていただきます。審査の結果によっては、ご希望の金額にご対応できない場合がございますので、あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 931e7f8f-30b7-5e8c-9bc5-f94a789830cf
  title: 朝凪カードローン：想定外の手数料・金額
  body: 'お客さまより「返済額が想定より高い」または「不明な金額が引き落とされている」というお問い合わせがあった場合の対応手順です。


    【考えられる原因】

    1. 利息の加算：適用金利（最大14.5%）に基づき、借入残高に応じた利息が日割りで計算されています。借入期間が長くなると、利息分が増加します。

    2. 最低返済額の適用：残高が少なくても、規定の最低返済額である2,000円が適用されている場合があります。

    3. 遅延損害金：返済期日を過ぎた場合、所定の遅延損害金が加算されます。


    【確認と解決策】

    ・まず、直近の利用明細と適用金利を確認してください。

    ・計算根拠についてご納得いただけない場合は、詳細な利息計算書を提示します。

    ・解決しない場合は、専門部署へエスカレーションし、精査した結果をお客さまへ回答します。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: troubleshooting
