  title: 朝凪Visaデビット：解約・変更・プランの切替え
  body: 'カードの解約やご登録内容の変更をご希望の場合は、以下の手順でお手続きください。


    1. お手続きの依頼：担当窓口にて、解約または変更のご希望をお伝えください。

    2. 本人確認：犯罪収益移転防止法に基づき、厳格な取引時確認（ご本人様確認書類のご提示）を実施いたします。

    3. 内容の確認：変更内容や解約に伴う注意点について、担当者よりご説明いたします。

    4. 手続き完了：手続き完了後、変更内容の通知または解約完了の旨をご案内いたします。


    なお、カードの利用限度額（500,000円）の変更についても同様の手順で承っております。ご不明な点は「朝凪Visaデビット：商品概要」をご参照ください。'
