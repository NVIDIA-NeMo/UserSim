- id: d694dae2-df9a-527c-b81e-ed7a6462a1c6
  title: スーパー定期：登録内容の変更
  body: '「スーパー定期」のご利用に伴う登録内容（住所、氏名、連絡先など）を変更する手順をご案内します。


    1. 変更内容の提示：

    変更を希望される項目と、新しい登録内容を当行へお伝えください。

    2. 本人確認の実施：

    重要な情報の変更となるため、運転免許証などの公的証明書をご提示いただき、厳格な取引時確認を行います。必要に応じてセキュリティカードによる認証も実施します。

    3. 変更内容の確定：

    当行にて登録情報の更新処理を行います。手続き完了後、オンラインバンキングの顧客情報画面などで、正しく変更されたことをご確認いただけます。


    なお、口座名義の変更など、複雑な案件については専門部署へエスカレーションし、対応させていただきます。'
  domain: retail_banking
