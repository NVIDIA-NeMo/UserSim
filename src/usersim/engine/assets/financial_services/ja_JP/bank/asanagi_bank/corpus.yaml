- id: 11e37c0a-90ab-53d8-84b1-4d87637824bb
  title: 給与・年金受取特典：状況・履歴の確認
  body: '現在適用されている特典の利用状況や、無料回数の消化履歴を確認する手順をご案内します。


    1. 担当者へ「給与・年金受取特典の今月の利用状況を確認したい」とお申し付けください。

    2. ご本人確認のため、口座番号などの必要事項を伺いますので、お答えください。

    3. 担当者が現在の月間無料回数の消費数（振込：最大3回、ATM利用：最大5回）を確認し、残り回数をご案内します。

    4. 過去の適用履歴を確認したい場合は、あわせて「特典適用後の取引明細の確認」を依頼してください。手数料が免除された取引内容を順に提示いたします。


    これにより、今月あと何回まで無料でサービスを利用できるかが明確になります。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e4b63c6e-10ef-5182-99e4-176ff798f9c1
  title: 給与・年金受取特典：お取引が拒否された・制限された
  body: '「振込やATM利用時にエラーが出て手続きができない」といった症状がある場合の確認事項です。


    【考えられる原因】

    ・月間の無料回数（振込3回、ATM利用5回）をすべて使い切り、手数料の不足により取引が制限されている。

    ・口座自体の利用制限（セキュリティロック等）がかかっている。


    【確認と解決策】

    1. まずは今月の利用回数が上限に達していないかご確認ください。上限に達している場合は、所定の手数料を口座にご準備いただく必要があります。

    2. 回数に余裕があるにもかかわらず制限される場合は、当行で制限状況を調査します。本人確認書類をご提示いただき、制限を解除いたします。


    解決しない場合は、専門部署へエスカレーションし、詳細な取引ログの調査を行い、結果をご連絡いたします。'
