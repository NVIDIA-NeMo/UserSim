  institution_id: asanagi_bank
- id: 8e26b09b-f446-56ce-b7ed-8f44f4e0ca95
  title: スーパー定期：5年ものの金利について
  body: 'Q: 5年ものの金利はどのくらいになりますか？


    A: 「スーパー定期」の5年ものの適用金利は1.05%（税引前）です。期間が長い分、1年もの（0.55%）や3年もの（0.85%）よりも高い金利設定となっており、効率的な資産形成を支援します。


    金利の詳細については、「スーパー定期：金利・料率一覧」をご確認ください。'
