  institution_id: asanagi_bank
- id: f3f581e2-6ec6-5093-be98-e5831f8d0f7a
  title: 給与・年金受取特典：金利・料率の決まり方と適用
  body: '本特典における金利および手数料無料枠の適用ルールは以下の通りです。


    【金利上乗せ】

    年金受取口座に指定された場合、普通預金金利に0.1%の上乗せを適用します。この金利は、年金受取実績が確認できる期間中、継続して適用されます。


    【無料枠の算定】

    ・他行あて振込手数料：毎月1日にリセットされ、月3回まで無料となります。

    ・時間外ATM利用手数料：毎月1日にリセットされ、月5回まで無料となります。


    いずれの無料枠も、暦月（1日から末日まで）でカウントし、翌月に繰り越すことはできません。'
