  body: 朝凪Visaデビットを安全にご利用いただくため、以下の点にご注意ください。最近では、銀行員を装い「セキュリティ更新が必要」として暗証番号やセキュリティカードの情報を聞き出そうとする詐欺が発生しております。当行が電話やメールで、お客様の暗証番号やパスワードをお伺いすることは一切ございません。不審な連絡を受けた場合や、身に覚えのない取引明細を確認された際は、直ちにご報告ください。紛失・盗難の届出を迅速に受け付け、規定の期間に基づき誠実に調査・対応いたします。また、1日あたりの利用限度額は初期設定で500,000円となっておりますので、ご自身の利用状況に合わせて適切に管理いただくことをお勧めいたします。
