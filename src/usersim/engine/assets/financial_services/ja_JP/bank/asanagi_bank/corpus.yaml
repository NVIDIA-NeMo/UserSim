- id: 33d1eb9e-ba76-5914-a78c-acc6ea183f38
  title: 朝凪カードローン：登録内容の変更
  body: 'ご住所やご連絡先などの登録内容を変更する際の手順をご案内します。


    1. 変更内容の提示：変更したい項目（住所、電話番号など）と新しい内容を当行にお伝えください。

    2. 本人確認の実施：犯罪収益移転防止法に基づき、最新の本人確認書類をご提示いただきます。これにより、安全な取引時確認を行います。

    3. 内容の照合：当行にてご提示いただいた書類と申請内容に相違がないかを確認します。

    4. 変更完了の通知：手続きが完了した後、変更内容を確定した旨を回答いたします。


    お手続き完了後、次回の利用明細から新しい登録内容が適用されます。'
