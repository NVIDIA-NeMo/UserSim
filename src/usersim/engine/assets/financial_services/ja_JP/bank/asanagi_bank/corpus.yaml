  title: 給与・年金受取特典：年金受取の方の定期預金金利の上乗せ幅について
  body: '問：年金受取口座に指定した場合、定期預金の金利はどのくらい上乗せされますか？

    答：「給与・年金受取特典」の適用により、年金を受取られているお客さまは、定期預金の適用金利に0.1%が上乗せされます。効率的な資産形成にぜひお役立てください。詳細は「スーパー定期：商品概要」をご参照ください。'
