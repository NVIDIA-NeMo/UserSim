- id: 88bc2056-5d98-5cb6-a9ac-a73278885896
  title: スーパー定期：金利・料率の決まり方と適用
  body: 'スーパー定期の金利は、お申込み時の預入期間に応じて以下の年利率が適用されます。


    ・1年預入：0.55%

    ・3年預入：0.85%

    ・5年預入：1.05%


    【適用の仕組み】

    ・金利は預入時に確定し、満期まで変更されません（固定金利）。

    ・利息計算は単利方式で行われます。

    ・お支払い時に20.315%の税金が差し引かれます。


    満期前に解約された場合は、上記の約定金利ではなく、別途定める「中途解約利率」が適用されます。'
