- id: 20c7e9be-6152-51c9-b9cd-694d9c768652
  title: 朝凪Visaデビット：よくあるお手続きの流れ
  body: '朝凪Visaデビットのお申込みからご利用開始までの流れをご案内します。


    1. お申込み内容の確認：ご希望のカード種類と、紐付ける普通預金口座をご指定いただきます。

    2. 取引時確認（本人確認）：犯罪収益移転防止法に基づき、運転免許証などの公的証明書をご提示いただき、ご本人確認を行います。

    3. 審査および発行手続き：当行にて規定の審査を行い、カードの発行手続きをいたします。

    4. カードの受領：ご登録住所へカードを郵送いたします。

    5. 利用開始：カードがお手元に届き、暗証番号等の設定（または確認）が完了した時点から、すぐにショッピングにご利用いただけます。


    お手続きに際して不明な点がございましたら、お気軽にお申し付けください。'
  domain: cards
  product_category: asanagi_debit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
