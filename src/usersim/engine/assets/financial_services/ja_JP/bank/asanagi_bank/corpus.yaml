  mentions_tools: []
  institution_id: asanagi_bank
- id: af70d77b-9812-5052-89a1-b9c1fa616550
  title: 住宅ローン：お取引が拒否された・制限された
  body: '【症状】

    ローンのお申込み手続き中や、繰上返済などの手続きにおいて「取引が制限されている」旨のメッセージが表示される、または手続きを拒否される。


    【考えられる原因】

    ・本人確認手続き（取引時確認）が未完了である。

    ・ご登録情報の変更（住所・氏名など）が反映されていない。

    ・セキュリティ上の理由により、一時的に口座に制限がかけられている。


    【対処法】

    1. 最新の本人確認書類をご提示いただき、登録情報に相違がないか確認してください。

    2. 必要な本人確認手続きがすべて完了しているか、担当者が確認いたします。


    【解決しない場合】

    上記で解決しない場合は、専門部署にて制限の原因を精査いたします。調査完了後、結果をご連絡いたしますので、今しばらくお待ちください。'
