- id: 5d3c79df-aee4-5911-baa8-289e249ba645
  title: 普通預金：リスクについてのご説明
  body: '普通預金のご利用にあたり、以下のリスクと制度についてご理解ください。


    【元本保証と預金保険制度】

    当行の普通預金は、預金保険制度の対象となっております。万が一、当行が破綻した場合であっても、1金融機関につき、預金者1人あたり元本1,000万円までとその利息を合わせて保護されます。


    【金利変動リスク】

    現在適用している0.4%の金利は、市場金利の変動に伴い、将来自由に変更される可能性があります。金利が低下した場合、受取利息が減少するリスクがあります。


    【法令遵守】

    当行は個人情報保護法および犯罪収益移転防止法を厳格に遵守しております。口座開設時や重要な手続きの際には、取引時確認を実施いたします。不審な取引が認められた場合は、法令に基づき口座を凍結することがあります。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: df7b4aa5-a758-5853-beb3-35dce7e82fef
  title: 普通預金：金利・料率の決まり方と適用
  body: '普通預金に適用される金利の仕組みについてご案内します。


    【適用金利】

    全ての普通預金口座に対し、一律で0.4%の年利率を適用いたします。残高の多寡にかかわらず、同一の利率が適用されるフラットな構造となっております。


    【利息の計算と適用】

    利息は日次で計算され、定期的（年2回）に口座へ入金されます。適用金利は、市場金利や当行の資金調達状況に基づき決定され、変更がある場合は店頭掲示およびホームページにてお知らせいたします。


    【注意点】

    本金利は税引前であり、実際にお受け取りになる金額は、ここから所得税および地方税（合わせて20.315%）が差し引かれた金額となります。'
