- id: 1912a9d4-1db4-59c5-bcf8-97f0b3337edf
  title: 住宅ローン：よくあるお手続きの流れ
  body: '住宅ローンのお申込みからご融資までの一般的な流れをご案内いたします。


    1. ご相談・事前審査：希望借入額や期間をお伝えいただき、概算の借入可能額を確認します。

    2. 正式申込み：必要書類（所得証明書、物件資料など）をご提示いただき、正式に審査を依頼してください。

    3. 本審査・承認：当行にて厳正な返済能力審査を行い、ご融資額（最大100,000,000円まで）と適用金利を決定します。

    4. ご契約・ご融資：金銭消費貸借契約を締結し、融資手数料（2.2%）を合わせて精算後、指定口座へ融資を実行いたします。


    各ステップで必要な書類やお手続きについて、担当者が丁寧にサポートいたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 8c95e233-0bbc-51e6-a594-2fc681665c50
  title: 住宅ローン：明細や記録と合わない
  body: '【症状】

    お客様が計算した返済残高や利息額が、当行の発行する明細書の金額と一致しない。


    【確認事項】

    1. 繰上返済の有無：オンラインでの繰上返済（手数料0円）を行った場合、その反映タイミングを確認してください。

    2. 利息計算タイミング：利息は日割り計算等で行われるため、計算期間にズレがないか確認します。

    3. 金利変更の適用日：変動金利の場合、5年ごとの見直しや金利変更が適用された日付を照合してください。


    【対処法】

    返済履歴を一件ずつ照合し、不一致が生じている期間を特定します。


    【エスカレーション】

    照合しても原因が不明な場合は、専門部署にて再計算および監査を実施します。調査結果は、後日書面またはご連絡にて回答いたします。'
  domain: lending_mortgage
  product_category: jutaku_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 0755d2c5-c8c2-5a8f-a6b4-e2ad48303b1a
  title: 朝凪カードローン：商品概要
  body: '朝凪カードローンは、地域住民の皆様の急な資金ニーズや、将来への備えとして柔軟にご利用いただける無担保ローン商品です。当行では、お客様お一人おひとりの返済能力を厳正に審査し、個別に最適な利用限度額を決定いたします。利用限度額の最大は8,000,000円となっており、幅広い用途にご活用いただけます。


    貸付金利は年2%から14.5%の範囲内で、審査結果に応じて適用されます。また、毎月の最低返済額を2,000円からに設定することで、無理のない計画的なご返済をサポートいたします。総量規制の対象外として、より柔軟な融資体制を整えつつ、公正かつ透明性の高い取引を徹底しております。日々の生活を支える安心のパートナーとして、ぜひご活用ください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: product_sheet
