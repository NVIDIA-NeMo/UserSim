- id: dee6f326-f696-50c8-8d76-959f9319e10e
  title: スーパー定期：ログインできない・アクセスできない
  body: '【症状】

    オンラインバンキングにログインしようとした際、エラーが表示され「スーパー定期」の残高や詳細を確認できない。


    【考えられる原因】

    ・パスワードの入力間違い

    ・セキュリティカードの入力ミスによるアカウントロック

    ・長時間操作がなかったことによるセッションタイムアウト


    【確認と対処法】

    1. 入力内容の再確認：

    半角英数字が正しく入力されているか、再度お試しください。

    2. ブラウザの再起動：

    一度ログアウトし、ブラウザを閉じてから再度アクセスしてください。


    【解決しない場合】

    上記を試してもアクセスできない場合は、当行にて認証状況を確認いたします。専門部署へエスカレーションし、パスワードの再発行またはロック解除の手続きをご案内いたします。'
  domain: retail_banking
  product_category: super_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
