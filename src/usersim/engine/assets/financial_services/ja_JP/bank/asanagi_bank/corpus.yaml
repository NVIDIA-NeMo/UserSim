- id: 2b664f48-aff7-58cd-92ff-61c30770f931
  title: 給与・年金受取特典：よくあるお手続きの流れ
  body: '給与・年金受取特典を適用させるためのお手続きの流れをご案内します。


    1. 担当者に「給与または年金の受取口座に指定したい」旨をお伝えください。

    2. 受取口座として指定するための「店番・口座番号」が記載された書類、または通帳をご提示ください。

    3. お客さまご自身で、勤務先（給与の場合）または年金事務所（年金の場合）へ、受取口座変更の手続きを行ってください。

    4. 当行にて受取実績が確認できた時点で、特典の適用を開始いたします。

    5. 適用後は、月3回までの他行あて振込手数料および月5回までのATM利用手数料が無料となります。また、年金受取の場合は0.1%の金利上乗せが適用されます。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
