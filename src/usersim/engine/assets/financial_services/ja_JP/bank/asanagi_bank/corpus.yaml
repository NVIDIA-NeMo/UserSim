- id: 60455147-ddb3-5046-88b2-0daab7b8a210
  title: 住宅ローン：安全にご利用いただくためのポイント
  body: '住宅ローンをご利用中のお客様へ、安全にお取引いただくための重要なポイントをご案内いたします。


    当行がメールや電話で、暗証番号やセキュリティカードの全桁を伺うことは決してございません。不審な連絡があった場合は、すぐに当行へご連絡ください。また、口座情報の変更や重要な手続きの前には、犯罪収益移転防止法に基づき厳格な「取引時確認」を実施いたします。本人確認書類のご提示をお願いすることがございますので、ご協力をお願い申し上げます。


    万が一、身に覚えのない通知や不正利用の疑いがある場合は、被害を最小限に抑えるため、速やかに当行までお届けください。'
