  body: '朝凪Visaデビットのご利用における制限事項および注意事項です。お客様へのご案内時にご活用ください。


    【利用限度額】

    1日あたりの利用限度額は500,000円となっております。この金額を超えるお取引は、カードの有効性に関わらず拒否されます。


    【注意事項】

    ・本商品はデビットカードであるため、お取引と同時に口座残高から即時引き落としが行われます。口座残高が不足している場合は、決済が完了いたしません。

    ・決済時点の残高に基づき処理されるため、振替待機中の金額などは利用可能額に含まれません。

    ・限度額の変更や一時的な制限解除については、規定の本人確認手続きが必要です。'
