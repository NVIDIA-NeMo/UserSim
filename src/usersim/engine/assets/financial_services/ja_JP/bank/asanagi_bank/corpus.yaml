- id: b1f79716-c2f1-50dc-a661-336cc553f751
  title: 給与・年金受取特典：個人情報の取扱い
  body: '当行は、個人情報保護法および犯罪収益移転防止法を遵守し、お客様の個人情報を適切に管理いたします。


    「給与・年金受取特典」の適用にあたり、当行は口座への振込履歴を確認することで、給与または年金の受取状況を判定いたします。この目的で得られた情報は、特典の適用判定および維持管理のみに使用し、それ以外の目的で第三者に提供することはありません。また、口座開設時や重要手続き時に実施する取引時確認に基づき、公正かつ透明性の高い取引を徹底しております。個人情報の取扱いに関する詳細については、当行のプライバシーポリシーをご確認ください。'
  domain: retail_banking
