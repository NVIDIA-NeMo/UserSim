- id: 72bf5e5c-d76e-522d-ace7-4b8332fcfec4
  title: 普通預金：重要事項のご説明
  body: '当行の普通預金をご利用いただくにあたり、以下の事項をご確認ください。


    【預金者保護について】

    当行は金融庁の監督を受けております。預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護されます。


    【法令遵守】

    個人情報保護法および犯罪収益移転防止法を遵守し、口座開設時には厳格な「取引時確認」を実施いたします。


    【コストについて】

    他行あて振込（オンライン）に220円、時間外ATM利用に110円、カード再発行に1,100円の手数料を申し受けます。これらの料金体系は透明性を維持し、適切に反映させております。'
