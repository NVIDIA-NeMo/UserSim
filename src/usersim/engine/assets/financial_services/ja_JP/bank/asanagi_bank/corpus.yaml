- id: 133127ae-9e01-5f9e-8ebd-343bd1aacf5e
  title: スーパー定期：重要事項のご説明
  body: '【預金保険制度について】

    当行は金融庁の監督を受けております。当行の預金は預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護されます。


    【税金について】

    お支払する利息には、所得税および地方税として20.315%の税金が課せられます。


    【中途解約について】

    満期前に解約される場合は「中途解約利率」が適用されます。この利率は、当初ご契約時の適用金利（0.55%〜1.05%）よりも低くなるため、ご注意ください。


    【本人確認について】

    犯罪収益移転防止法に基づき、口座開設時には厳格な取引時確認を実施いたします。'
