  body: '他社様の一般的な定期預金と、当行のスーパー定期を比較いたします。


    【当行スーパー定期】

    ・金利：期間に応じて年利率0.55%（1年）、0.85%（3年）、1.05%（5年）と、明確なステップアップを提供します。

    ・ハードル：最低預入金額1,000円からと、少額からでも資産形成を始められます。

    ・安心感：地域に根ざした店舗ネットワークによる対面サポートを重視しています。


    【他社の一般的商品（ネット銀行等）】

    ・金利：キャンペーン等で一時的に高い金利を提示することがありますが、変動しやすく、期間の制約が厳しい場合があります。

    ・利便性：オンライン完結の操作性に優れていますが、複雑な相談には不向きです。


    確実な金利での運用と、対面での安心感を重視される方には、当行のスーパー定期を推奨いたします。'
