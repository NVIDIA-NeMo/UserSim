  institution_id: asanagi_bank
- id: aced7d52-b969-52c5-81ae-d3705e9519f9
  title: 朝凪カードローン：ほかの選択肢との比較と向かない場合
  body: '「朝凪カードローン」は、限度額の範囲内で繰り返し借入ができる利便性の高い商品です。最大8,000,000円まで、審査に基づき設定されます。


    【他商品との比較】

    ・目的別ローン：金利が固定される傾向にあり、長期的に低コストで借りたい場合に適しています。対して本商品は、年2%から14.5%という幅のある金利設定ですが、使いたい時にすぐに使える柔軟性があります。


    【本商品が向かない場合】

    ・絶対的な低金利を最優先し、一度に多額を借りて長期的に返済したい方は、固定金利の商品をご検討ください。

    ・厳格な予算管理が必要な方は、借入が容易なカードローン形式よりも、使途を限定した融資の方が適している場合がございます。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: d5166b5c-96b6-5676-a73f-4dd35ea5a41d
  title: 朝凪カードローン：手数料と費用
  body: '【質問】利用にあたっての手数料はかかりますか？

    【回答】本商品のご利用における主なコストは貸付金利です。金利は年2%から14.5%の範囲内で、審査結果に基づき適用されます。ご返済時には、この金利に基づいた利息と元金をあわせてお支払いいただきます。詳細な金利適用については、審査時に改めてご案内いたします。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: ff1484d7-4e9d-5108-9d1a-d31c0a58dc2c
  title: 朝凪カードローン：よくあるお手続きの流れ
  body: '「朝凪カードローン」のお申込みからご利用開始までの流れをご案内します。


    1. お申込み内容の提示：お名前、ご住所、および年収などの収入情報を提示してください。

    2. 取引時確認の実施：犯罪収益移転防止法に基づき、運転免許証等の本人確認書類をご提示いただき、厳格な本人確認を行います。

    3. 審査および条件決定：当行にて返済能力を審査し、利用限度額（最大8,000,000円）と適用金利（年2%から14.5%）を決定いたします。

    4. 結果のご案内：審査結果および契約内容を通知いたします。内容にご同意いただいた後、お手続きが完了し、借入が可能となります。


    審査結果によっては、ご希望の条件に沿えない場合がございますので、あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 40ded84a-0b2d-53e0-b89c-33096215d557
  title: 朝凪カードローン：明細や記録と合わない
  body: '【症状】お客様が管理されている返済記録と、当行の貸付残高明細に相違がある。


    【確認手順】

    1. 入金日の確認：ご返済いただいた日付が、当行の処理日（営業日ベース）と一致しているか照合してください。

    2. 利息計算の再確認：適用金利（年2%から14.5%）に基づき、前回の返済日から起算して正しく利息が計算されているかを確認します。

    3. 最低返済額の確認：毎月の最低返済額2,000円が正しく充当されているかを確認してください。


    【解消方法】

    計算上の不一致が判明した場合は、正しい残高を再提示し、根拠となる計算式をご説明します。


    【エスカレーション】

    システム上の処理不備や、計算結果に合理的な説明がつかない場合は、専門のローン管理部署へ案件を上げ、精査した上で修正対応を行います。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 100e4477-2fde-52d5-8372-7c65fe6a7b3b
  title: 手数料・料金のご案内
  body: 当行では、サービスの維持コストを適切に反映した料金体系を採用しております。一方で、給与受取や年金受取などの条件を満たされるお客様には、手数料を無料とする優遇制度をご用意しております。詳細な手数料は商品ごとに異なりますので、各商品の手数料一覧をご確認ください。
  domain: retail_banking
  product_category: general
