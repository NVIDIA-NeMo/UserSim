- id: ee1db5cf-255b-5ae0-9b70-96ceeb71c52e
  title: set_alerts を使う場面
  body: 'お客様が口座残高の変動や、一定金額以上の高額取引があった際に通知を受け取りたいと希望される場合に設定します。これにより、不正利用の早期発見や、計画的な資金管理をサポートします。


    【手続き手順】

    1. 厳格な本人確認（取引時確認）を実施します。

    2. get_accounts を使用し、通知設定対象の account_id を特定します。

    3. 通知を希望する条件（通知の種類、金額のしきい値など）を確認します。

    4. set_alerts を呼び出し、アラート設定を完了させます。


    設定可能な詳細項目は「set_alerts ツールリファレンス」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: asanagi_bank
- id: 06a4eefc-143a-53b4-961c-c4db7e7806b9
  title: set_alerts ツールリファレンス
  body: 'このツールは、口座の取引や残高に関する自動通知（アラート）を設定するために使用します。


    【引数】

    ・account_id：アラートを設定する口座の識別子

    ・alert_type：通知の条件（例：入金、出金、残高低下など）

    ・threshold_amount：通知をトリガーとする金額のしきい値


    オペレーターは、お客様の希望条件に基づき、このツールを直接呼び出して設定を行います。'
