- id: c102ac0b-5b74-5153-bedd-11b9ce5fa851
  title: 普通預金：お手続きが完了しない・保留中のまま
  body: '口座開設のお申込み後、手続きが完了せず「保留中」のままとなっている場合の対応方法です。


    【考えられる原因と確認事項】

    ・本人確認書類の不備：ご提示いただいた書類の有効期限が切れている、または画像が不鮮明な場合、確認に時間を要します。改めて書類に不備がないかご確認ください。

    ・入力情報の相違：ご入力いただいた住所や氏名が、公的証明書と完全に一致しているかをご確認ください。


    【解決策】

    不足している書類がある場合は、追加でご提示をお願いいたします。書類に問題がないにもかかわらず数営業日経過している場合は、当行にて状況を確認いたします。当行にて調査を行い、必要に応じて専門部署へエスカレーションし、手続きを再開させます。完了次第、改めて通知いたします。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: troubleshooting
