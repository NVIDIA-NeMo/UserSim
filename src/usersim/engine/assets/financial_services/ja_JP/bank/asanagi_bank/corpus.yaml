- id: f281ad36-1777-5248-8423-33daa352ae7b
  title: 朝凪カードローン：重要事項のご説明
  body: 本商品は、厳正な返済能力審査に基づき利用限度額を決定いたします。最大利用限度額は8,000,000円です。貸付金利は年2%から14.5%の範囲内で適用され、借入残高に対して日割り計算で利息が発生します。毎月の最低返済額は2,000円であり、この金額を下回る返済となった場合は、契約違反として遅延損害金が発生する可能性があります。また、金利は経済情勢により変動する場合があり、その際は事前にお知らせいたします。借入額の増大は将来の返済負担を増加させるため、ご自身の返済能力に見合った計画的なご利用をお願いいたします。
