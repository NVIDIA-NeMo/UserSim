- id: 911ccb76-d55c-51df-9b8a-3b357d2de7cd
  title: 住宅ローン：状況・履歴の確認
  body: '現在の借入残高や、これまでの返済履歴を確認する手順をご案内いたします。


    1. 本人確認書類（運転免許証など）をご提示いただき、口座情報の照会を依頼してください。

    2. 「現在のローン残高」および「返済スケジュール（履歴）」の提示を希望される旨をお伝えください。

    3. 当行にて最新のデータを確認し、現在の借入残高、適用金利、および次回の返済予定日を回答いたします。

    4. 詳細な明細が必要な場合は、返済履歴書の発行を依頼してください。後日、書面にてお届けいたします。


    これにより、現在の資産状況と今後の返済計画を正確に把握いただけます。'
