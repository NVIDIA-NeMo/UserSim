  product_category: super_teiki
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: a8951702-ef5f-5c88-88c7-353cdb45aabf
  title: スーパー定期：最低預入金額について
  body: 'Q：スーパー定期を始めるために、最低限いくら預ける必要がありますか？


    A：「スーパー定期」の最低預入金額は1,000円です。少額からでも計画的な資産形成を始めていただけます。お申し込みの際は、ご希望の期間（1年、3年、5年）に合わせてご準備ください。'
