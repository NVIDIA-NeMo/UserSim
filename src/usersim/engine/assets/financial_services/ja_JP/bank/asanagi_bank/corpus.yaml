  body: 'Q：貸付金利の最低水準はどのくらいに設定されていますか？


    A：朝凪カードローンの貸付金利の下限は年2%となっております。実際にご適用される金利は、お客様のご審査結果やご契約内容に基づき決定いたします。詳細な金利体系については、「朝凪カードローン：金利・料率一覧」をご参照ください。'
