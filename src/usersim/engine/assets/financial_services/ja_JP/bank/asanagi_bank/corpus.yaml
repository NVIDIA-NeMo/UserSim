- id: 0a02d72b-fde9-59e3-9e42-0a968715b882
  title: file_transaction_dispute を使う場面
  body: '朝凪Visaデビットにおいて、身に覚えのない利用や二重引落しなどの不備が報告された場合、以下の手順で補償申請を受け付けます。


    1. `verify_identity` で厳格な本人確認を行います。

    2. `get_accounts` で対象口座を特定し、`get_account_transactions` で問題の取引内容（取引日時、金額、相手先等）を具体的に確認します。

    3. 調査に必要な情報を揃えた上で、`file_transaction_dispute` を呼び出し、正式に調査と補償の申出を登録します。'
