- id: f4c43d89-1660-5a80-bd53-e8df70f8841c
  title: スーパー定期：お申込みとご利用開始
  body: 'スーパー定期のお申込み手順をご案内いたします。あらかじめ、普通預金口座に最低預入金額の1,000円以上の残高をご用意ください。


    1. 預け入れたい金額（1,000円以上）と、預入期間（1年、3年、5年のいずれか）を当社にお伝えください。

    2. 指定された普通預金口座から、スーパー定期口座への資金振替処理を行います。

    3. 振替完了後、適用金利（0.55%、0.85%、または1.05%）と満期日を記載した開設確認書を提示いたします。


    以上で、資産形成に向けた運用が開始されます。運用中の状況確認については「スーパー定期：状況・履歴の確認」をご覧ください。'
