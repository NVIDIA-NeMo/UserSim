  body: '【症状】

    「利用した金額よりも多く口座から引き落とされている」または「身に覚えのない手数料がある」と感じられる場合。


    【原因と確認事項】

    1. 海外利用の有無：海外のサイトや店舗で利用されていませんか？海外利用時は3%の事務手数料が加算されます。

    2. キャッシュバックの適用：0.2%の還元は即時ではなく、規定のタイミングで処理されます。明細上の金額と還元タイミングに相違がないかご確認ください。


    【対応】

    上記に心当たりがない場合は、当行にて取引履歴の詳細を調査いたします。調査結果に基づき、誠実に対応させていただきます。必要に応じて専門部署へエスカレーションし、詳細な照会を行います。'
