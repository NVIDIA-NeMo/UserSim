  title: 住宅ローン：想定外の手数料・金額
  body: '【症状】

    お客様より「返済額が想定より高くなっている」「身に覚えのない手数料が引かれている」との問い合わせがある場合。


    【確認事項と原因】

    1. 融資手数料の確認：借入金額に対し2.2%の手数料が正しく適用されているか確認してください。

    2. 返済額見直しの確認：変動金利において5年ごとの見直し時期を迎えていないか、また、返済額が前回比125%の上限まで上昇していないかを確認してください。


    【対応】

    上記で解決しない、あるいは計算に不整合がある場合は、速やかに専門部署へエスカレーションし、詳細な再計算と調査を実施してください。結果は誠実かつ透明性を持ってお客様へ回答いたします。'
