- id: ba3251c1-3afb-5ffa-bea3-4fdfd365239b
  title: 普通預金：商品概要
  body: '朝凪銀行の「普通預金」は、公共料金のお支払い振替や、給与・年金の受取口座として最適な、日常的な決済と貯蓄の基本口座です。いつでも自由にお預入れやご出金ができるため、生活資金の管理に非常に便利です。


    【金利・手数料】

    ・適用金利：年 0.4%

    ・他行あて振込手数料（オンラインバンキング利用時）：220円

    ・時間外ATM利用手数料：110円

    ・キャッシュカード等再発行手数料：1,100円


    地域の皆様に安心感を提供し、デジタルサービスとの融合により利便性を高めております。詳細な手数料については「普通預金：手数料一覧」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 601ed1c1-ad7a-541f-b0be-36932f369397
  title: 普通預金：普通預金の金利について
  body: 'Q：普通預金の金利はどのくらいですか？

    A：当行の普通預金に適用される金利は年 0.4%です。お預入れいただいた金額に対し、この利率に基づき利息が計算されます。


    Q：金利は変動しますか？

    A：はい。市場金利の変動等に伴い、金利は改定される場合がございます。最新の情報は「普通預金：金利・料率一覧」にてご確認いただけます。'
