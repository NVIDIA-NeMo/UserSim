  institution_id: asanagi_bank
- id: 5a47f6a7-6f35-5031-833a-069d96fd6ff3
  title: スーパー定期：ほかの選択肢との比較と向かない場合
  body: '【他商品との比較】

    「普通預金」は利便性に優れていますが、「スーパー定期」は確実な利回り提供に特化した商品です。1年、3年、5年と預入期間を長く設定するほど、適用金利（0.55%、0.85%、1.05%）が高くなる仕組みとなっています。


    【向かないお客様】

    ・急な出費の可能性があり、いつでも全額を引き出したい方。満期前の解約には「中途解約利率」が適用されるため、想定していた利息が得られない場合があります。

    ・預入金額が1,000円に満たない方。


    【おすすめのお客様】

    ・まとまった資金を一定期間、安全に保管しつつ、普通預金よりも高い金利で運用したい方。特に5年以上の長期視点で資産を形成したい方に最適です。'
