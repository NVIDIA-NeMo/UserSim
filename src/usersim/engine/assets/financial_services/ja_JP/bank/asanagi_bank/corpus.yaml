  institution_id: asanagi_bank
- id: c5613e1a-1f49-5252-bcb4-b8a13a8a2865
  title: 普通預金：お申込みいただける方
  body: '【お申込み条件および結果】

    ・日本国内に居住する個人の方 → お申込みいただけます。要：取引時確認（本人確認書類の提示）。

    ・法人または団体の方 → 別途、審査および法人用書類のご提示により、お申込みいただけます。

    ・非居住者の方 → 原則としてお申込みいただけませんが、個別に状況を確認させていただきます。'
