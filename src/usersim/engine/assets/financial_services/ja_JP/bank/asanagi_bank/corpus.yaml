- id: 69969bc6-ed4b-5ec7-83d7-ac5a0b8472e0
  title: 普通預金：不正利用からお客さまを守るために
  body: '朝凪銀行では、お客さまの資産を安全に守るため、多層的な認証プロセスを導入しております。最近では、銀行員や公的機関を装い、暗証番号やセキュリティカードの情報を聞き出そうとする詐欺が発生しております。当行が電話やメールでお客さまの暗証番号を伺うことは決してございません。


    万が一、キャッシュカードの紛失や盗難、または身に覚えのないお取引に気づかれた場合は、直ちにご連絡ください。預金者保護法に基づき、偽造・盗難カードによる被害は原則として補償いたします。また、当行の預金は預金保険制度により、元本1,000万円までが保護されております。安心してお取引いただくため、不審な連絡があった際は、一度落ち着いてご確認をお願いいたします。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: caef32b3-2085-59b7-8401-180b2a42f2b7
  title: 普通預金：規定・約款
  body: '本口座の利用にあたっては、当行の規定および約款が適用されます。お客さまは、口座開設時の取引時確認を含む本人確認手続きを完了させ、正確な情報を届け出る義務を負います。


    【金利と手数料】

    適用金利は0.4%とし、市場環境に基づき変更される場合があります。また、インターネットバンキングを利用した他行あて振込手数料として220円、時間外ATM利用手数料として110円を申し受けます。キャッシュカード等の再発行手数料は1,100円となります。


    【契約の変更と終了】

    約款の変更を行う際は、事前に書面または当行の告知方法によりお知らせいたします。口座の解約を希望される場合は、所定の手続きを経て、残高を精算することで契約を終了します。不適切な利用が認められた場合、当行は口座を制限または解約することがあります。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: d4cf65f6-4483-5996-b9bb-12dac1949d26
  title: 普通預金：おすすめの方と主な使い方
  body: '普通預金は、公共料金の振替や給与・年金受取に最適な、日常的な決済と貯蓄の基本口座です。いつでも自由にお引き出しやご送金が可能なため、以下のような方におすすめです。


    【おすすめの方】

    ・生活費の管理を一つの口座で効率的に行いたい方

    ・給与や年金を確実に受け取りたい方

    ・いつでも利用できる安心感と、0.4%という適正な金利を両立させたい方


    【主な使い方】

    ・給与や年金の受取口座として指定し、日々の支払いに活用する

    ・インターネットバンキングを利用し、他行へ220円の手数料で迅速に送金する

    ・急な出金が必要な際は、時間外でも110円の手数料でATMから引き出す


    より詳細な条件については、「普通預金：商品概要」をご確認ください。'
