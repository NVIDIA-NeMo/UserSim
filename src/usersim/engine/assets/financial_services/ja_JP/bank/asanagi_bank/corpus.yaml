- id: 66b241f4-676a-541e-8a8f-e9c4d36579c3
  title: 普通預金：解約・変更・プランの切替え
  body: '口座の解約や登録内容の変更をご希望の方は、以下の手順でお手続きください。


    【解約の手順】

    1. お手続きを希望される旨を当行へお伝えください。

    2. 本人確認書類（運転免許証等）をご提示いただき、厳格な本人確認を実施します。

    3. 口座残高を確認し、全額を引き出すか、指定の他口座へ送金します。この際、他行あての場合は220円の振込手数料がかかります。

    4. 通帳およびキャッシュカードを回収し、解約手続きを完了します。手続き完了後、解約証明書を発行いたします。


    【内容変更の手順】

    1. 住所や氏名など、変更したい項目を当行へお伝えください。

    2. 最新の本人確認書類をご提示ください。

    3. 当行にて内容を更新し、変更完了の通知を差し上げます。


    詳細は「普通預金：お申込みとご利用開始」も併せてご覧ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: cc7c9003-20e3-5ab1-92fa-1c4d5c2e1609
  title: 普通預金：想定外の手数料・金額
  body: 'お客さまから「明細に想定していなかった手数料が記載されている」とのご相談をいただいた際の対応フローです。


    【確認事項と原因】

    1. 時間外のATM利用がなかったか：平日15:00以降や土日にATMをご利用の場合、110円の手数料が発生します。

    2. インターネットバンキングでの他行振込がなかったか：他行あての振込を行った場合、220円の手数料が発生します。

    3. カードの再発行手続きが行われなかったか：再発行時には1,100円の手数料を申し受けております。


    【解決策】

    上記に該当する場合、規定通りの請求であることを丁寧にご説明ください。もし、重複して請求されている、または条件を満たしているにもかかわらず手数料が発生している場合は、速やかに専門部署へエスカレーションし、調査および返金処理を行います。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e498a0bc-145b-5387-ad5b-5b1dc498dddc
  title: 普通預金：必要書類
  body: '普通預金口座を開設される際は、犯罪収益移転防止法に基づき、以下の書類による取引時確認が必要です。


    【個人のお客さま】

    ・運転免許証、マイナンバーカード、パスポートなどの公的証明書（いずれか1点）

    ・現住所を確認できる住民票または公共料金の領収書（免許証に現住所が記載されていない場合）


    【法人のお客さま】

    ・登記事項証明書（発行から6ヶ月以内）

    ・代表者および実質的支配者の本人確認書類


    これらの書類をご提示いただいた後、厳正な審査を経て口座開設となります。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 5fe7fbad-2112-5124-ae65-9543520f73f2
  title: 普通預金：他社の一般的な商品との比較
  body: '他社の一般的な普通預金商品と比較し、当行の普通預金は「地域密着の安心感」と「競争力のある金利」を重視しています。


    【金利面】

    他社で0.001%〜0.1%程度の金利が一般的であるなか、当行は0.4%という高い水準を提供し、効率的な資産形成を支援します。


    【コスト面】

    インターネットバンキングの他行あて振込手数料（220円）や、時間外ATM利用料（110円）は業界標準と同等ですが、給与受取等の条件を満たした際の優遇制度が充実しています。


    【結論】

    高い金利を享受しながら、地域に根ざした対面サポートも受けたい方に、当行の普通預金は最適な選択肢となります。'
