- id: 85becb23-0989-557a-901c-67788df172b5
  title: 朝凪Visaデビット：リスクについてのご説明
  body: '朝凪Visaデビットをご利用いただくにあたり、以下のリスクと制限事項をご理解ください。


    【残高不足による決済不能】

    本カードは口座残高から即時引き落としを行うため、残高が不足している場合は決済が拒否されます。クレジットカードのような信用供与（後払い）はございません。


    【海外利用時のコスト】

    海外でのご利用時には3%の事務手数料が課されます。為替レートの変動と合わせ、想定より高い金額が引き落とされる場合がございます。


    【利用限度額】

    1日あたりの利用限度額は500,000円となっております。これを超えるお取引はできませんのでご注意ください。


    【キャッシュバック】

    0.2%の還元率が適用されますが、還元対象外の取引がある場合がございます。'
