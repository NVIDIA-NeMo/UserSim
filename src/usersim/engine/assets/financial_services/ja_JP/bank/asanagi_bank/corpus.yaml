- id: 2b3873ad-39ff-52a3-b201-211e14170e64
  title: dispute_status を使う場面
  body: '朝凪Visaデビットなどで、身に覚えのない利用や二重引落しについて調査を依頼（file_transaction_dispute を実行）したお客様が、その後の調査進捗を確認したい場合に提供します。預金者保護法に基づき、誠実に調査・対応いたします。


    【手続き手順】

    1. 厳格な本人確認（取引時確認）を実施します。

    2. 調査依頼時に発行された dispute_id を確認します（不明な場合は、取引履歴等から特定します）。

    3. dispute_status を呼び出し、現在の調査状況を取得します。

    4. 取得したステータスに基づき、お客様へ現在の進捗状況を丁寧にご案内します。


    ツールの詳細仕様は「dispute_status ツールリファレンス」をご参照ください。'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: asanagi_bank
