  body: 朝凪Visaデビットのご利用開始までの手順についてご案内します。まず、お客様に取引時確認（本人確認）を実施し、ご本人であることを厳格に確認します。その後、お申し込みを受け付け、審査を経てカードを発行いたします。カードがお手元に届きましたら、指定の手続きにてアクティベーションを行っていただくことで、即時引き落としによる決済が可能となります。本カードは年会費0円で、1日あたりの利用限度額は初期設定で500,000円です。また、ご利用額に対して0.2%のキャッシュバックが適用されます。海外でのご利用時には3%の手数料がかかる点をご説明ください。詳細は「朝凪Visaデビット：商品概要」をご参照ください。
