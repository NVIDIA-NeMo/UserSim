  title: 住宅ローン：解約・変更・プランの切替え
  body: 'プランの切替えや解約（全額繰上返済）のお手続きは、以下の手順で進めてください。


    1. ご希望の変更内容または解約の旨をお伝えください。

    2. 本人確認書類および、プラン変更に伴い必要な物件確認書類をご提出いただきます。

    3. 当行にて審査および変更内容の確認を行います。

    4. 変更後の返済額や完了日についてのご案内を受け、内容を確認してください。


    【ポイント】

    オンラインバンキングを通じて繰上返済を行われる場合、手数料は0円です。手続き完了後、残高証明書などで正しく処理されたことをご確認いただけます。複雑な条件変更が伴う場合は、専門部署にて詳細を案内いたします。'
