  title: スーパー定期：ご紹介・継続利用の特典
  body: '【期間限定キャンペーン】

    2026年4月1日から2026年6月30日までの期間中、当行をご利用中のお客様からのご紹介で「スーパー定期」を新規に開設された方に、1年もの適用金利0.55%に上乗せして、さらに0.10%の特典金利を適用させていただきます。地域のみなさまの資産形成を応援する特別な機会にぜひご利用ください。'
