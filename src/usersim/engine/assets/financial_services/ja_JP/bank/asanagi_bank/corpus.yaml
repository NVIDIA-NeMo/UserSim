- id: 78b177d1-348d-5852-b86d-467879e75524
  title: スーパー定期：よくあるお手続きの流れ
  body: '「スーパー定期」の新規預入における一般的なお手続きの流れをご案内します。


    1. 預入内容の決定：預入金額（1,000円以上）と、預入期間（1年、3年、5年のいずれか）をお申し付けください。

    2. 本人確認の実施：犯罪収益移転防止法に基づき、「取引時確認」のため、運転免許証などの公的証明書をご提示ください。

    3. 金利の確認と承諾：選択した期間に応じた適用金利（0.55%、0.85%、または1.05%）をご案内し、ご了承をいただきます。

    4. 預入完了：普通預金口座から指定金額が振り替えられ、定期預金口座が開設されます。完了後、預金証書または通帳にて内容をご確認ください。


    以上で手続きは完了です。'
  domain: retail_banking
  product_category: super_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: b0f12fc3-2a79-5f03-8e5c-42c03b210905
  title: スーパー定期：明細や記録と合わない
  body: 'お客様が計算された利息額と、実際の明細上の金額に相違がある場合の確認手順です。


    【確認ステップ】

    1. 税金の控除確認：利息には20.315%の税金が課せられます。提示された金利（0.55%、0.85%、1.05%）で計算した額から、この税率分が差し引かれているかをご確認ください。

    2. 解約時期の確認：満期前に解約された場合、約定金利ではなく「中途解約利率」が適用されます。解約日の記録と照らし合わせ、適用利率が変更されていないか確認してください。

    3. 預入期間の再確認：選択した期間（1年、3年、5年）が正しく適用されているかを確認します。


    【対応】

    上記を確認しても不一致がある場合は、当行にて再計算を行い、詳細な内訳を提示いたします。計算根拠についてご不明な点は、専門部署にて詳しく解説させていただきます。'
  domain: retail_banking
  product_category: super_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 948ca124-3b9c-5e72-b319-5045c487cd80
  title: 給与・年金受取特典：商品概要
  body: '「給与・年金受取特典」は、当行の口座を給与受取または年金受取口座にご指定いただいたお客様へ提供される、利便性と経済性を兼ね備えた優遇制度です。日常的な決済コストを軽減し、安心感のある資産管理をサポートします。


    【主な特典内容】

    ■他行あて振込手数料：毎月3回まで無料

    ■ATM利用手数料：毎月5回まで無料

    ■年金受取の方への金利優遇：年金受取口座に指定された方向けに、0.1%の金利上乗せを適用します。


    本特典を適用することで、公共料金の振替や日々の送金にかかるコストを抑えながら、効率的な貯蓄が可能です。詳細は「給与・年金受取特典：手数料一覧」をご確認ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: ff09b633-f411-5225-9e87-6f4fa1ff6df6
  title: 給与・年金受取特典：他行あて振込手数料の無料回数（月）について
  body: 'Q：給与・年金受取特典を適用している場合、他行への振込手数料は月に何回まで無料になりますか？


    A：毎月3回まで手数料が無料となります。4回目以降のご利用分につきましては、通常の手数料が適用されます。無料回数の詳細やその他の手数料については、「給与・年金受取特典：手数料一覧」をご参照ください。'
