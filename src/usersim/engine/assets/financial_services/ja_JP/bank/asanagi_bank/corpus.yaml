    2. get_accountsを呼び出し、お客様に紐付く全ての口座情報を取得します。

    3. お客さまから提示された口座番号の下4桁などに基づき、操作対象となる正しい口座を特定します。


    本ツールは、振込やカード再発行など、口座を特定する必要がある多くのお手続きにおいて必須のステップとなります。'
