- id: 3fdc9cb0-ae1e-59fa-9076-e7e73a887dab
  title: スーパー定期：プランの選び方
  body: 'お客様の資産形成の目的に合わせて、最適な期間をお選びください。


    ・1年もの（金利0.55%）：

    近い将来に資金を利用する予定がある方や、まずは短期間で試したい方に向いています。

    ・3年もの（金利0.85%）：

    数年後のライフイベントに向けて、安定した運用を希望される方に適しています。

    ・5年もの（金利1.05%）：

    当行で最も高い金利を提供しており、中長期的に効率よく資産を増やしたい方に最適です。


    いずれのプランも最低預入金額は1,000円からとなっております。'
