- id: 8b422f9c-7b1f-5c34-b5bd-f691abc06136
  title: 朝凪カードローン：金利・料率の決まり方と適用
  body: '本商品の貸付金利は、年2%から14.5%の範囲内で決定されます。


    【決定方法】

    厳正な返済能力審査に基づき、お客様個別の信用状況、年収、勤務先、他社借入状況などを総合的に判断して決定します。


    【適用】

    決定した金利は、借入残高に対して日割りで計算され、毎月の返済額に加算されます。金利は固定ではなく、当行の規定に基づき見直される場合があります。'
