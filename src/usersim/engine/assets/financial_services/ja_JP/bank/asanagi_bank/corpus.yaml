- id: 6ec19cb7-4cb4-5e35-8d7a-7d40159ea2fb
  title: スーパー定期：状況・履歴の確認
  body: 'お手持ちの定期預金の残高や、満期日、利息の付与履歴を確認する手順をご案内します。


    1. お客様から、確認を希望される「スーパー定期」の口座番号をご提示いただくか、通帳をご提示ください。

    2. 当行にて、現在の預入金額、適用されている金利（0.55%、0.85%、1.05%のいずれか）、および満期日を確認します。

    3. これまでの利息付与額や、税引後の入金履歴について、明細形式でご案内いたします。


    手続き完了後、最新の残高と次回の満期予定日について改めてご確認いただき、相違がないかをご確認ください。詳細な履歴が必要な場合は、改めてお申し付けください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 08232c55-83c4-52b6-8cfc-b7712fdb401b
  title: スーパー定期：お取引が拒否された・制限された
  body: '「スーパー定期」の預入や解約などの手続きができない場合、以下の原因が考えられます。


    【考えられる原因と確認事項】

    1. 資金不足：預入時に指定した「普通預金」口座の残高が、預入金額（最低1,000円）に満っていない可能性があります。

    2. 本人確認の未完了：最新の「取引時確認」が完了していない場合、重要な手続きが制限されます。有効な身分証明書をご提示ください。

    3. 期間制限：満期前の解約において、手続き上の制限があるか、あるいは中途解約の手続きとして正しく受理されていない場合があります。


    【解決策】

    ・普通預金の残高を確認し、不足している場合は入金をお願いします。

    ・身分証明書をご提示いただき、本人確認手続きを完了させてください。


    上記を確認しても解決しない場合は、専門部署にて口座の状態を詳細に調査いたします。'
  domain: retail_banking
  product_category: super_teiki
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 41915db2-3bef-5ed4-9fcb-a8c6d3a7a351
  title: スーパー定期：切替えや上位プランを検討するとき
  body: '「普通預金」から「スーパー定期」への切替えを検討される際は、資金の流動性と金利のバランスをご確認ください。


    ・普通預金：いつでも自由に出し入れが可能ですが、金利は低めに設定されています。

    ・スーパー定期：1,000円から預入可能で、期間に応じて0.55%（1年）、0.85%（3年）、1.05%（5年）という高い金利を確保できます。ただし、満期まで資金が拘束されます。


    近い将来に使用する予定のない余裕資金については、スーパー定期への切替えが効率的な資産形成につながります。'
  domain: retail_banking
  product_category: super_teiki
  document_type: comparison
  source_authority: official
