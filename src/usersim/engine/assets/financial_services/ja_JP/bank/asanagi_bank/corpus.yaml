- id: d5657e80-f6e4-56b9-9fb1-257b5e3911d8
  title: 給与・年金受取特典：重要事項のご説明
  body: '本特典は、お客様の利便性向上を目的とした優遇制度です。以下の事項についてあらかじめご了承ください。


    ■適用条件の維持

    給与または年金の受取指定を解除された場合、あるいは受取が停止された場合、本特典による手数料無料および金利優遇（年金受取の0.1%上乗せ）は適用外となります。


    ■手数料の適用

    無料回数（振込月3回、ATM利用月5回）を超えた分につきましては、当行の規定に基づき所定の手数料を申し受けます。


    ■法令遵守

    本制度の運用にあたっては、個人情報保護法および犯罪収益移転防止法を遵守し、公正な取引を徹底いたします。また、預金保険制度により、元本1,000万円までが保護されます。'
