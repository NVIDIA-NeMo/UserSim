  institution_id: asanagi_bank
- id: c001b345-266d-5d8e-8ad2-9c27147a010e
  title: 給与・年金受取特典：明細や記録と合わない
  body: 'お客様より「無料回数内のはずなのに手数料が引かれている」「金利上乗せが反映されていない」とのお問い合わせがあった場合の対応手順です。


    【確認手順】

    1. 取引履歴を確認し、当該月の他行あて振込回数が3回を超えていないか、またはATM利用回数が5回を超えていないかを確認します。

    2. 年金受取金利の上乗せ（0.1%）について、受取実績が途切れた月がないか、または適用対象の口座であるかを再確認します。


    【解決策】

    ・回数オーバーによる課金であれば、その旨を丁寧にご説明ください。

    ・当行のシステム不備で正しく適用されていなかった場合は、速やかに不足分を精査し、差額を返金処理いたします。この際は、専門部署へエスカレーションし、正当な適用期間を確定させてください。'
