- id: 8f00bb50-b050-5d6b-8238-92a5e537398c
  title: スーパー定期：個人情報の取扱い
  body: '朝凪銀行では、個人情報保護法および犯罪収益移転防止法を厳格に遵守し、お客様の個人情報を適切に取り扱います。


    【取得目的】

    「スーパー定期」の口座開設および維持に不可欠な本人確認（取引時確認）を目的として、氏名、住所、生年月日などの情報を取得いたします。これらの情報は、公正かつ透明性の高い取引を徹底し、金融犯罪を防止するために利用されます。

    【情報の保護】

    お預かりした個人情報は、当行の厳格なセキュリティ体制のもとで管理され、法令に基づく場合を除き、お客様の同意なく第三者に提供することはございません。

    【権利について】

    お客様は、ご自身の個人情報の開示、訂正、利用停止を請求することが可能です。お手続きについては、店舗窓口またはオンラインバンキングにて承ります。'
  domain: retail_banking
  product_category: super_teiki
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e3bbe3de-54a6-55ce-b528-a59aee94f6a4
  title: スーパー定期：この商品をかたる詐欺にご注意ください
  body: '最近、当行の「スーパー定期」をかたる不審な電話やメール、SMSによる詐欺被害が報告されています。「特別な高金利プランがある」「手続きのために暗証番号が必要」といった案内はすべて詐欺です。当行からお客様の暗証番号やセキュリティカードの番号を伺うことは、どのような場合でもございません。


    特に、他社商品と比較検討中の方を狙い、「限定の優遇金利で資産を増やせる」と誘い、外部サイトへ誘導して個人情報を盗み出す手法が確認されています。不審な連絡を受けた場合は、決して指示に従わず、すぐに当行の窓口または電話にてご相談ください。万が一、情報を伝えてしまった場合は、被害拡大を防ぐため迅速に届出をお願いいたします。'
  domain: retail_banking
  product_category: super_teiki
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 80cd175c-cee9-526a-92d7-0848e864ce04
  title: スーパー定期：限度額・制限と注意事項
  body: '【預入制限と条件】

    ・最低預入金額：1,000円からお申し込みいただけます。

    ・預入期間：1年、3年、5年の期間から選択いただけます。それぞれの期間に応じた金利（0.55%、0.85%、1.05%）が適用されます。


    【注意事項】

    ・税金：利息には20.315%の税金（所得税および復興特別所得税、地方税）が課せられます。税引後の金額が口座に入金されます。

    ・中途解約：満期前に解約される場合は「中途解約利率」が適用され、当初の約定金利よりも低い利率となりますのでご注意ください。

    ・本人確認：口座開設や金額変更などの重要な手続きには、犯罪収益移転防止法に基づく「取引時確認」が必要です。


    詳細は「スーパー定期：重要事項のご説明」をご確認ください。'
