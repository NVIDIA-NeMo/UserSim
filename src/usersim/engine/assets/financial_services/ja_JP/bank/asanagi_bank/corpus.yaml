- id: 5ff9c52c-fe21-5c61-a075-cc550ee9edbe
  title: 朝凪カードローン：お申込みとご利用開始
  body: '朝凪カードローンのお申込みからご利用開始までの手順をご案内いたします。


    1. お申込み内容の提示：まず、借入希望額とお申込みの目的をお伝えください。併せて、運転免許証などの本人確認書類をご提示いただきます。

    2. 審査の実施：当行にて厳正な返済能力審査を行います。審査に基づき、適用金利（年2%〜14.5%）と利用限度額（最大8,000,000円）を決定いたします。結果のご案内までしばらくお待ちください。

    3. ご契約内容の確認と同意：審査承認後、決定した金利や返済条件などの契約内容をご説明いたします。内容にご同意いただき、契約手続きを完了させてください。

    4. ご利用開始：お手続き完了後、設定された利用限度額の範囲内でいつでもお借入れが可能となります。毎月の最低返済額は2,000円からとなります。'
