  institution_id: asanagi_bank
- id: 75f88e1d-7237-59d9-8ee1-58243230d827
  title: よくあるご質問
  body: '【営業時間は？】

    平日9:00から15:00までとなっております。


    【複雑な手続きはどうすればいい？】

    窓口や電話にて承ります。内容に応じて専門部署へエスカレーションし、適切にご案内いたします。


    【口座開設の流れは？】

    本人確認書類をご用意の上、店舗またはオンラインでお申込みください。'
  domain: retail_banking
  product_category: general
  document_type: faq
