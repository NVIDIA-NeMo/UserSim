- id: 4e4eb51d-4c90-5fdc-a669-de54742e832f
  title: 朝凪カードローン：おすすめの方と主な使い方
  body: '朝凪カードローンは、急な出費や一時的な資金不足を解消したい方に最適な、柔軟な融資商品です。地域に根ざした当行ならではの安心感と、便利な決済機能を兼ね備えています。


    【おすすめの方】

    ・将来的にまとまった金額を利用できる安心感を持ちたい方

    ・毎月の返済負担を最小限に抑えつつ、計画的に返済したい方


    【主な特徴と条件】

    ・利用限度額：最大8,000,000円まで、審査により決定します。

    ・貸付金利：年2%から14.5%の範囲内で、個別の審査に基づき適用されます。

    ・返済負担：毎月の最低返済額を2,000円からに設定しており、無理のない返済計画が可能です。


    一度のお申込みで、必要な時にいつでもご利用いただける便利な枠を確保いただけます。'
  domain: lending_mortgage
  product_category: asanagi_card_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 73479f25-5b64-5dbc-a237-ac5fc5266179
  title: 朝凪カードローン：貸付金利（上限）について
  body: 'Q：貸付金利の上限はどのくらいですか？


    A：本商品の貸付金利は、最大で年14.5%となっております。実際にご適用される金利は、審査における返済能力に基づき、年2%から14.5%の間で決定されます。


    Q：上限金利が適用されるのはどのような場合ですか？


    A：審査結果に基づき、リスク評価が上限に達する場合に適用されます。詳細は個別にご案内いたします。'
  domain: lending_mortgage
