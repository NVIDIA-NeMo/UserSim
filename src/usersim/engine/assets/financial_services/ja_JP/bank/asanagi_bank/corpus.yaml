  body: 'Q：住宅ローンで最大いくらまで借りることができますか？


    A：当行の住宅ローンでは、最大100,000,000円までお借入いただけます。ただし、実際のご融資額は、お客様のご年収や現在の債務状況などの返済能力審査に基づき、個別に決定させていただきます。


    詳細は「住宅ローン：商品概要」をご確認ください。'
