- id: 129a8318-a8a2-540e-bbd2-05645bb95e64
  title: スーパー定期：おすすめの方と主な使い方
  body: 'スーパー定期は、将来のライフイベントに向けて、確実かつ効率的に資産を形成したい方におすすめの商品です。


    【このような方におすすめです】

    ・数年後に使う予定の資金（教育資金や住宅購入資金など）を安全に保管したい方

    ・普通預金よりも高い金利で、確実な運用を行いたい方


    【主な活用方法】

    最低預入金額1,000円から、ライフプランに合わせて期間を選択いただけます。

    ・1年プラン（年利率0.55%）：短期的な資金準備に

    ・3年プラン（年利率0.85%）：中長期的な蓄財に

    ・5年プラン（年利率1.05%）：長期的な資産形成に


    日々の決済には「普通預金：商品概要」をご参照の普通預金をご利用いただき、貯蓄分を本商品で運用することで、利便性と収益性を両立させた管理が可能です。'
