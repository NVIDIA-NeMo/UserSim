- id: ba352e21-8e87-5376-a995-38f3dca17e0b
  title: 普通預金：ご紹介・継続利用の特典
  body: 朝凪銀行の普通預金をご利用いただきありがとうございます。新しく口座を開設される方を、ご家族やご友人がご紹介いただいた場合や、継続的にご利用いただくお客様には、特別な優遇をご用意しております。特に給与受取口座や年金受取口座にご指定いただくことで、ATM利用料などの手数料が無料となる特典を適用させていただきます。
  domain: retail_banking
