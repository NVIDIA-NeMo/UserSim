  institution_id: asanagi_bank
- id: 6a68d493-a2bf-5725-9d7e-4c8c42156873
  title: 普通預金：プランの選び方
  body: '日常的な決済と資産形成の目的に合わせてお選びください。


    ・普通預金：公共料金の振替や給与受取など、自由に出し入れしたい方に最適です。金利は0.4%で、利便性を最優先します。

    ・スーパー定期：一定期間預け入れ、効率的に資産を増やしたい方向けです。期間に応じた金利設定となります。


    まずは普通預金で基本口座を作成し、余裕資金を定期預金へ移行されるプランをお勧めいたします。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: bedfd342-fc89-51e1-9ada-8ce312f3f469
  title: 普通預金：個人情報の取扱い
  body: '当行は、個人情報保護法および犯罪収益移転防止法を遵守し、お客様の個人情報を厳重に管理いたします。


    【個人情報の収集と利用】

    口座開設時や重要手続き時に実施する「取引時確認」により、お客様の本人確認情報を収集します。これは法令に基づき、公正かつ透明性の高い取引を徹底し、金融犯罪を防止することを目的としております。


    【情報の管理】

    収集した情報は、口座管理、サービスの提供、および法令に基づく報告以外の目的で使用することはありません。また、預金保険制度により、元本1,000万円までが保護されます。個人情報の取り扱いについてのご質問や、開示請求等がございましたら、窓口までお申し付けください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 7697cc1d-c276-5bc5-bcb5-a74745ded084
  title: 普通預金：この商品をかたる詐欺にご注意ください
  body: '当行の普通預金をかたり、「特別な高金利プランへの案内」や「口座凍結を防ぐための手続き」を求める不審なメールやSMSにご注意ください。当行の普通預金金利は0.4%であり、個別のメールで急激に高い金利を提示して個人情報を求めることはございません。


    当行では、お客様の暗証番号やセキュリティカードの番号、オンラインバンキングのパスワードをメールや電話でお伺いすることは絶対にございません。不審な連絡を受けた場合は、決してURLをクリックせず、速やかに当行までご連絡ください。万が一、情報を伝えてしまった場合は、被害を最小限に抑えるため、直ちにお取引の停止手続きをお願いいたします。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 0c1d5b57-436c-5090-ab27-3c93c8990ce9
  title: 普通預金：限度額・制限と注意事項
  body: '普通預金のご利用にあたっては、安全な取引を維持するため、1日あたりおよび1回あたりのお取引限度額が設定されております。限度額の詳細や変更については、店頭またはオンラインバンキングにてご確認いただけます。


    特に高額の出金や振込、口座情報の変更などの重要な手続きの前には、犯罪収益移転防止法に基づき、厳格な本人確認である「取引時確認」を実施させていただきます。また、ATMをご利用の際は、時間外利用手数料として110円などの費用が発生いたしますのでご注意ください。不審な取引が検知された場合は、セキュリティ保護のため一時的に口座が制限されることがあり、その際は多層的な認証プロセスによる本人確認が必要となります。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 7402e1af-f420-50df-96c5-42b14852470b
  title: 普通預金：キャッシュカード・通帳の再発行手数料について
  body: 'Q：キャッシュカードや通帳を紛失してしまった場合、再発行に費用はかかりますか？


    A：はい、再発行手数料として1,100円を申し受けます。お手続きの際は、ご本人確認書類をご持参の上、窓口までお越しください。なお、紛失・盗難の届出を迅速に行うことで、預金者保護法に基づいた補償を受けられる場合がございます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: bc739b08-bc1a-55b9-9cb1-c546e3cc3520
  title: 普通預金：状況・履歴の確認
  body: '普通預金のお取引履歴や現在の残高を確認する手順をご案内します。


    1. 確認したい口座番号と、照会したい期間（例：直近1ヶ月分）を当行スタッフへお伝えください。

    2. 厳格な本人確認（取引時確認）のため、キャッシュカードまたはご本人確認書類をご提示ください。

    3. 当行にて照会を行い、入出金明細および現在の残高をご案内します。


    また、オンラインバンキングをご利用いただくと、いつでもリアルタイムで履歴がご確認いただけます。適用されている金利0.4%に基づく利息の入金記録なども、明細から容易に確認することが可能です。詳細なご利用方法は「普通預金：商品概要」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 47455abf-6f48-5324-9ca9-016a26662303
  title: 普通預金：お取引が拒否された・制限された
  body: 'ATMやオンラインバンキングでの取引が拒否された場合、以下の原因が考えられます。


    【考えられる原因】

    ・暗証番号の入力回数制限を超えた

    ・1日の出金・振込限度額に達した

    ・セキュリティ上の理由で口座に制限がかけられた


    【対処方法】

    まずは、入力内容に誤りがないか、または限度額を超えていないかをご確認ください。制限がかかっている場合は、当行へ制限解除をご依頼ください。その際、セキュリティカードや生体認証を含む多層的な本人確認を実施させていただきます。本人確認が完了し、正当な取引であることが確認され次第、制限を解除いたします。解決しない場合は、専門部署へエスカレーションし、詳細な調査を行います。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: e0a990d5-cf10-50be-b020-9b9f54ff8136
  title: 普通預金：切替えや上位プランを検討するとき
  body: お客様がより効率的な資産形成を希望される場合は、普通預金（金利0.4%）から「スーパー定期」への切替えをご提案ください。また、ATM利用料や振込手数料の負担を軽減したい場合は、「給与・年金受取特典」の適用条件を満たすようご案内することで、利便性を最大化できます。
  domain: retail_banking
  product_category: futsu_yokin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 6d1d3188-0958-591a-8fb9-fb94e22d8295
  title: 普通預金：ほかの選択肢との比較と向かない場合
  body: '普通預金は、0.4%の金利を享受しながら、いつでも自由に入出金ができるため、公共料金の振替や給与・年金の受取など、日常的な決済に最適です。


    一方、以下のような目的の方には、他の商品がより適しています。

    ・中長期的に効率よく資産を増やしたい方：一定期間預け入れることで、より高い金利設定が適用される「スーパー定期」をおすすめします。

    ・支出をリアルタイムで管理し、キャッシュレス決済をメインにしたい方：口座残高から即時引き落としされる「朝凪Visaデビット」の併用をご検討ください。


    普通預金は利便性に特化した口座であるため、資産形成のベースとしてご利用いただき、目的に応じて他の商品と組み合わせて活用してください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 980d28ec-6cc1-500b-8730-c9a94ec7cdc9
  title: 普通預金：手数料と費用
  body: 'Q：他行宛てにオンラインで振り込む際の手数料はいくらですか？


    A：他行宛てのオンライン振込手数料は220円です。


    Q：営業時間外にATMを利用する場合の費用を教えてください。


    A：時間外ATM利用手数料として110円を申し受けます。なお、「給与・年金受取特典」などの条件を満たすことで、これらの手数料が無料になる優遇制度がございます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: ae528b53-3b69-5c20-8cfb-391aed2a66ce
  title: 普通預金：よくあるお手続きの流れ
  body: '普通預金口座を開設し、ご利用を開始するまでの流れをご案内します。


    1. 窓口にて口座開設の意思をお伝えください。この際、犯罪収益移転防止法に基づき、運転免許証などの本人確認書類をご提示いただき、「取引時確認」を実施します。

    2. お名前やご住所などの基本情報を確認し、口座の種別を決定します。普通預金は金利0.4%で、日常的な決済に最適な口座です。

    3. 内容を確認後、ご署名をいただき、通帳とキャッシュカードの発行手続きを行います。

    4. キャッシュカードをお受け取りいただければ、すぐにATMやオンラインバンキングでのご利用が可能です。


    あわせて「給与・年金受取特典」へのご指定をいただくことで、手数料の優遇を受けられるため、併せてご検討ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 3b5f4dab-4c2d-5fb1-8132-c3c865f492ac
  title: 普通預金：明細や記録と合わない
  body: 'お客様から「明細の金額が想定と異なる」「心当たりのない出金がある」とのお問い合わせを受けた際は、以下の手順で確認してください。


    【確認ステップ】

    1. 直近の取引履歴を確認し、時間外ATM利用手数料（110円）や他行宛てオンライン振込手数料（220円）などの手数料が適切に計上されていないか照合します。

    2. 自動振替や公共料金の引き落としなど、定期的な決済が行われていないか確認します。

    3. 入金側で、金利0.4%に基づく利息の計算が正しく行われているか確認します。


    【対応とエスカレーション】

    上記を確認しても不一致が解消されない場合、または不正利用の疑いがある場合は、速やかに口座を一時凍結し、専門部署へエスカレーションしてください。その後、預金者保護法に基づき、誠実に調査および補償手続きを行います。'
