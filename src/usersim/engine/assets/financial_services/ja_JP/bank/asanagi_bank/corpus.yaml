  body: '【ご紹介キャンペーン】

    2025年10月1日から2025年12月31日まで、ご友人やご家族に「朝凪カードローン」をご紹介いただき、ご成約に至った場合、ご紹介者様とご成約者様それぞれに1,000円の特典を差し上げます。地域に根ざした安心のサポートを、ぜひ大切な方にもご紹介ください。'
