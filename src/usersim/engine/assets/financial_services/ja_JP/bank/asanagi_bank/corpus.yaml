  title: 朝凪Visaデビット：ログインできない・アクセスできない
  body: 'オンラインバンキングにて朝凪Visaデビットの利用明細や設定にアクセスできない場合、以下の点をご確認ください。


    【確認事項】

    ・パスワードやセキュリティカードの入力内容に誤りがないか。

    ・通信環境が安定しているか。


    【原因と対処法】

    ・パスワードを一定回数以上誤入力した場合、セキュリティ保護のため口座が一時的にロックされます。この場合は、本人確認書類をご用意の上、当行へロック解除を依頼してください。

    ・生体認証に失敗し続ける場合は、認証設定の再登録をお願いいたします。


    上記を確認しても解決しない場合は、専門部署へエスカレーションし、認証システムのログを調査いたします。調査結果は追ってご連絡いたします。'
