- id: 1773dd67-6410-5150-835a-8e260fcf3e6b
  title: スーパー定期：解約・変更・プランの切替え
  body: 'スーパー定期の解約、または期間プランの変更（切替え）をご希望の方は、以下の手順でお手続きください。


    1. お手続きの内容（解約またはプラン切替え）を当行窓口またはお電話にてお申し出ください。

    2. 本人確認のため、運転免許証などの公的な証明書をご提示ください。

    3. 当行より、現在の預入金額および適用される利息（中途解約の場合は中途解約利率を適用）を算出し、提示いたします。内容をご確認ください。

    4. お手続き完了後、元本と利息を合わせた金額がお客様の普通預金口座へ振り込まれます。


    ※プランの切替えは、一度現在の定期預金を解約し、改めて新しい期間で預け直す形となります。この際、解約時点での利率が適用されるため、当初の金利（0.55%〜1.05%）とは異なる場合があります。'
