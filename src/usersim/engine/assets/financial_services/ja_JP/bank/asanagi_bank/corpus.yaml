- id: 34f27076-2f91-528d-be07-24499628e628
  title: 法令・制度に関するご案内：預金・日常のお取引
  body: '当行は金融庁の監督を受け、法令を遵守して運営しております。預金は預金保険制度により、1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護されます。


    また、個人情報保護法および犯罪収益移転防止法に基づき、厳格な個人情報の取り扱いと、口座開設時等の「取引時確認」を徹底しております。公正かつ透明性の高い取引を通じて、地域住民の皆様に安心感を提供いたします。'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 11938198-8965-5f60-898d-fdf21cfb608d
  title: 法令・制度に関するご案内：デビットカード
  body: 'デビットカードのご利用に関しては、預金者保護法に基づき、偽造または盗難カードによる不正利用被害を原則として補償いたします。被害を最小限に抑えるため、カードの紛失や盗難に気づいた際は、速やかに当行へ届出を行ってください。規定の期間に基づき、誠実に調査および対応を実施いたします。


    なお、口座情報の変更や出金等の重要な手続きの前には、多層的な認証プロセス（セキュリティカードや生体認証など）による厳格な本人確認を実施いたします。'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: a0dcf0ab-5a9d-5262-b3b2-a904a1347132
  title: 法令・制度に関するご案内：ローン
  body: '当行は適合性の原則に基づき、お客様の資産状況や返済能力に最適な商品を提案いたします。住宅ローンにおいては、変動金利を選択された場合、5年ごとの返済額見直しが行われ、上昇幅は前回の125%を上限として制限されます。


    朝凪カードローンにつきましては、総量規制の対象外となる商品ではございますが、厳正な返済能力審査に基づき、個別の利用限度額を決定しております。なお、個別の税務や法務に関する具体的な助言は専門家へご案内しております。'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
