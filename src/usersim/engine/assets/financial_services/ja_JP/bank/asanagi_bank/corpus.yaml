- id: b8ee95d3-1784-5b59-a24c-ee0cbee7bb98
  title: スーパー定期：規定・約款の変更
  body: '本商品の規定および約款は、法令の改正や経済情勢の変化に応じて変更される場合がございます。


    【変更の手続き】

    約款を変更する場合、当行は変更内容および施行日を、店頭への掲示またはオンラインバンキング等の方法で事前に告知いたします。

    【適用条件の変更】

    現在、本商品の最低預入金額は1,000円と定められておりますが、この金額基準を含む重要な条件が変更される場合は、明確に区別して記載した通知を行います。

    【合意と終了】

    変更後の約款についてお客様が承諾いただけない場合は、規定に基づき本商品の解約手続きを行うことができます。解約に際しては、中途解約利率が適用される場合がございますのでご注意ください。'
