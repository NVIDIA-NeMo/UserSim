  body: 朝凪銀行は、個人情報保護法および犯罪収益移転防止法を厳格に遵守し、お客様の個人情報を適切に管理いたします。朝凪Visaデビットのお申し込みおよびご利用にあたり、収集した個人情報は、口座管理、不正利用の検知、および法令に基づく取引時確認の目的のみに使用いたします。具体的に、1日あたりの利用限度額500,000円の管理や、海外利用時の3%の手数料計算、0.2%のキャッシュバック処理等のサービス提供に利用されます。収集した情報は、厳重なセキュリティ体制の下で保管され、第三者への提供は法令に基づく場合を除き、あらかじめ本人の同意を得た上で実施いたします。
