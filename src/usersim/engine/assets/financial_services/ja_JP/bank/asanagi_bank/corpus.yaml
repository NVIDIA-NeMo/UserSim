- id: eeab43ae-a60a-5ec1-a673-b1e5e8640de4
  title: 給与・年金受取特典：お申込みとご利用開始
  body: '本特典のご利用を開始するための手順をご案内します。


    1. 担当者へ、当行口座を給与または年金の受取口座に指定したい旨をお伝えください。

    2. 当行より、受取口座として指定いただくための支店名および口座番号をご案内します。

    3. ご案内した口座情報を、お勤め先の給与担当部署または年金支給元（年金事務所等）へご提出ください。

    4. 指定後の初回振込が当行口座に確認できた時点で、特典の適用が開始されます。


    適用後は、毎月の他行あて振込3回分およびATM利用5回分が無料でご利用いただけます。適用状況の確認方法は「給与・年金受取特典：状況・履歴の確認」をご覧ください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
