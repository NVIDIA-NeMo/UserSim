- id: 0a9c88e5-8e42-5c21-aefd-20c4aaf5ee7c
  title: 住宅ローン：リスクについてのご説明
  body: '本ローンをご利用いただくにあたり、以下のリスクについて十分にご確認ください。


    1. 金利変動リスク：変動金利（1.375%）を選択した場合、市場金利の上昇に伴い、利息負担が増加する可能性があります。

    2. 返済額上昇リスク：返済額の見直しは5年ごとに行われ、金利上昇時には前回の返済額の最大125%まで月々の支払額が増加することがあります。

    3. 長期借入のリスク：最長35年の借入となるため、ライフステージの変化により返済計画の見直しが必要になる場合があります。


    これらのリスクを考慮し、適合性の原則に基づき、お客様の状況に最適なプランをご提案いたします。'
