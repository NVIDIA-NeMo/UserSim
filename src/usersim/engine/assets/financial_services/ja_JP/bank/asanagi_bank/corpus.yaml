  institution_id: asanagi_bank
- id: 55c9abad-e5e1-5112-b77e-71d76c4bbe1d
  title: スーパー定期：ご利用開始までの手順
  body: 'お客様が「スーパー定期」の利用を開始されるまでの手順は以下の通りです。


    1. 期間と金額の決定：

    お客様に、ご希望の預入期間（1年、3年、または5年）と預入金額を確認します。最低預入金額である1,000円以上であることを確認してください。

    2. 本人確認の実施：

    犯罪収益移転防止法に基づき、ご本人確認書類をご提示いただき、厳格な取引時確認を実施します。

    3. 資金の移動と契約：

    普通預金口座等の指定口座から、決定した金額をスーパー定期口座へ振り替えます。この時点で契約が成立し、適用金利（1年もの：0.55%、3年もの：0.85%、5年もの：1.05%）に基づいた運用が開始されます。


    詳細は「スーパー定期：商品概要」をご参照ください。'
  domain: retail_banking
  product_category: super_teiki
  document_type: product_sheet
