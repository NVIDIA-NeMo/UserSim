- id: 67c0edea-49e0-51d5-a56c-06059c3d2242
  title: 給与・年金受取特典：お申込みとご利用条件
  body: 'Q：この特典を適用してもらうにはどうすればよいですか？

    A：当行の普通預金口座を開設し、勤務先や年金事務所にて、受取口座として当行を指定してください。


    Q：給与受取と年金受取の両方を指定した場合、特典は重複しますか？

    A：はい。振込無料3回、ATM利用無料5回などの基本特典に加え、年金受取の方への金利上乗せ0.1%が適用されます。'
