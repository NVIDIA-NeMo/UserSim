  title: 給与・年金受取特典：金利・料率一覧
  body: '本特典における金利優遇の内容は以下の通りです。


    ■年金受取口座指定特典

    ・金利上乗せ幅：0.1%


    【適用内容】

    年金受取口座として当行をご指定いただいたお客様に対し、適用される預金金利に0.1%を加算して提供いたします。この上乗せ金利は、年金受取の条件を満たしている期間中、継続的に適用されます。適用される基本金利の詳細については、「普通預金：金利・料率一覧」をご確認ください。'
