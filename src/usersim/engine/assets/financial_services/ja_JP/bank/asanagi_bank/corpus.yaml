    ・変動金利：1.375%（市場金利に連動し、5年ごとに返済額を見直します）

    ・固定金利期間選択型（10年）：3.7%（借入から10年間は金利が固定されます）

    ・融資手数料：2.2%（借入金額に対して一回限りの手数料として適用されます）


