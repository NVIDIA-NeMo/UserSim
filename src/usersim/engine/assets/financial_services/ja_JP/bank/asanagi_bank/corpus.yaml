- id: 11c6de99-5127-5fdf-9149-4b4917204fde
  title: 朝凪Visaデビット：お取引が拒否された・制限された
  body: '「お店でカードを使ったが、決済が拒否された」という場合に考えられる原因と対処法です。


    【確認事項と原因】

    1. 口座残高の不足：決済金額以上の残高があるかご確認ください。即時引き落としのため、残高不足ですぐに拒否されます。

    2. 利用限度額の超過：1日あたりの利用限度額である500,000円を超えていないかご確認ください。

    3. カードの有効期限切れ：カード表面の有効期限が切れていないかご確認ください。

    4. セキュリティロック：短時間に不自然な利用があった場合、当行で一時的に制限をかけている可能性があります。


    【解決策】

    ・残高不足の場合は、不足分を口座に入金してください。

    ・限度額超過やセキュリティロックの場合は、ご本人確認の上で制限の解除や調整を承ります。専門部署にて調査し、解除完了後にご案内いたします。'
