  body: '朝凪Visaデビットは、日々の支出をスマートに管理したい方におすすめの決済カードです。


    【このような方におすすめです】

    ・クレジットカードのような後払いではなく、予算内で支出を管理したい方

    ・キャッシュレス決済を利用しつつ、口座残高をリアルタイムに把握したい方


