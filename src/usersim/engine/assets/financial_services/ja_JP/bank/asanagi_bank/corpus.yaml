- id: 4dffd2e1-94ad-58e8-984a-82454b9568f1
  title: スーパー定期：お手続きが完了しない・保留中のまま
  body: 'スーパー定期の開設手続きが完了せず、「保留中」のままとなっている場合は、以下の点をご確認ください。


    【考えられる原因と確認事項】

    1. 資金不足：振替元となる普通預金口座に、指定した預入金額（最低1,000円）以上の残高があるかご確認ください。

    2. 本人確認の不備：取引時確認に必要な書類や情報が不足している可能性がございます。


    【解決策】

    ・不足金がある場合は、普通預金へ入金し、再度手続きを依頼してください。

    ・本人確認に不備がある場合は、最新の身分証明書をご提示ください。


    上記を確認しても解決しない場合は、専門部署へエスカレーションし、詳細な調査を行います。調査結果は後日、改めてご連絡いたします。'
