  body: '住宅ローンのご契約に関わる重要な手続きにおいて、なりすましによる不正申請などのリスクがございます。当行では、犯罪収益移転防止法に基づき、厳格な取引時確認を実施しております。


    当行の職員が、電話やメールで暗証番号やセキュリティカードの全番号を伺うことは一切ございません。不審な連絡を受けた場合は、直ちにご案内を中断し、当行までお知らせください。


    万が一、個人情報の流出や不正利用の疑いがある場合は、速やかに届出をお願いいたします。迅速な対応により、被害の拡大を最小限に抑えることが可能です。詳細な手続きについては「住宅ローン：商品概要」をご確認ください。'
