  title: 普通預金：金利・料率一覧
  body: '【適用金利】

    ・普通預金金利：年 0.4%


    本金利は、口座の残高にかかわらず一律に適用されます。利息は、預入金額に対して上記の利率に基づき計算され、定期的にお客様の口座へ入金されます。市場環境の変化により、金利は改定される場合がございますのでご了承ください。'
