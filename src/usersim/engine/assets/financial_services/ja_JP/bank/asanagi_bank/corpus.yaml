- id: f2847f6c-0f4a-5646-a141-acf37f49aab1
  title: 住宅ローン：登録内容の変更
  body: '住宅ローンのご契約者様で、住所、電話番号、またはご連絡先などの登録内容を変更される際の手順をご案内します。


    1. 変更内容の提示：変更したい項目（例：転居による住所変更）を当行担当者へお伝えください。

    2. 本人確認の実施：犯罪収益移転防止法に基づき、最新の本人確認書類（運転免許証など）をご提示いただき、「取引時確認」を行います。

    3. 内容の照合と更新：提示された書類と申請内容に相違がないかを確認し、当行にて登録情報を更新します。

    4. 完了の通知：登録内容の変更が完了した旨を、書面またはオンラインバンキングを通じてお客様に通知いたします。


    これにより、今後の重要なお知らせが正しく届くようになります。'
