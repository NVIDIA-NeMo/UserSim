- id: 0cb253e8-599e-5d29-ab24-29123361deaf
  title: 普通預金：安全にご利用いただくためのポイント
  body: 'お客様のの大切な資産を守るため、普通預金をご利用の際は以下のポイントにご注意ください。


    1. 多層的な認証の活用：当行ではセキュリティカードや生体認証を導入しております。これらを適切に設定し、第三者に認証情報を教えないでください。

    2. 暗証番号の管理：単純な数字を避け、定期的に変更することをお勧めします。

    3. 不審な連絡への警戒：当行からメールや電話で、暗証番号やパスワードを直接お伺いすることはございません。


    万が一、カードの紛失や不正利用の疑いがある場合は、直ちにご報告ください。預金者保護法に基づき、規定の期間に基づき誠実に調査・対応させていただきます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 4ffa0891-6ab8-50b3-b280-83f01d9e8ef0
  title: 普通預金：規定・約款の変更
  body: '普通預金のご利用に関する規定および約款は、法令の改正や経済情勢の変化に応じて変更される場合がございます。金利（例：0.4%）や、他行あて振込手数料（220円）、時間外ATM利用手数料（110円）などの改定を含む重要な変更を行う際は、事前に店頭掲示や書面、オンラインバンキング等でお客様へ通知いたします。


    通知後、一定期間までにご異議がない場合は、変更後の規定に同意いただいたものとみなされます。最新の約款内容については、店頭または当行の窓口にていつでもご確認いただけます。お客様には、常に不透明感のない料金体系と誠実なサービスを提供することに努めております。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 1a1c3949-d3c9-56d4-9efd-7b0ac47b2a2d
  title: 普通預金：ご利用開始までの手順
  body: 'お客様が普通預金のご利用を開始するまでの手順は以下の通りです。サポート担当者は、お客様に以下の流れをご案内ください。


    1. 本人確認（取引時確認）：犯罪収益移転防止法に基づき、運転免許証などの本人確認書類をご提示いただき、厳格な本人確認を実施します。

    2. 口座開設手続き：必要事項をご記入いただき、口座開設を完了させます。この際、0.4%の金利適用についてご説明します。

    3. キャッシュカード・通帳の発行：手続き完了後、カードおよび通帳を発行します。再発行が必要な場合は、1,100円の手数料がかかる旨をお伝えください。

    4. サービス設定：オンラインバンキングの利用設定や、給与・年金受取の指定手続きを行い、利便性の高い環境を整えていただきます。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 5563a56f-1b59-5ccd-824b-664dedc4d4a8
  title: 普通預金：時間外のATM利用手数料について
  body: '【質問】時間外にATMを利用した場合、手数料はかかりますか？

    【回答】はい、時間外ATM利用手数料として110円をいただいております。


    なお、給与や年金の受取口座としてご指定いただいているお客様は、特典により手数料が無料となる場合がございます。詳細は「給与・年金受取特典：商品概要」をご確認ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: faq
