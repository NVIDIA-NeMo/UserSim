  title: 朝凪カードローン：この商品をかたる詐欺にご注意ください
  body: '最近、当行の「朝凪カードローン」をかたる不審な電話やメールにより、個人情報を盗み出そうとする詐欺が発生しております。誠に恐れ入りますが、当行が電話やメールで、お客様の暗証番号やセキュリティカードの番号、合言葉などを伺うことは決してございません。


    特に「低金利への切り替え」や「限度額の増枠」を条件に、至急の手続きを求める内容には十分ご注意ください。もし不審な連絡を受けた場合や、カード情報の流出が疑われる場合は、直ちにご相談ください。迅速な届出により、被害を最小限に抑えることが可能です。お客様の安心と安全のため、多層的な認証プロセスを導入しておりますので、不自然な手続きを求められた際は一度手を止め、ご確認をお願いいたします。'
