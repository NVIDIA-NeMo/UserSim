- id: dbf38b9f-d824-5cf5-8c7b-40de0558f6ef
  title: 給与・年金受取特典：解約・変更・プランの切替え
  body: '給与・年金受取口座の変更や、特典の適用停止を希望される際の手順をご案内します。


    1. 当行の窓口またはお電話にて、受取口座の変更または特典の解約を希望される旨をお伝えください。その際、ご本人様確認のため、キャッシュカードや印鑑などの必要書類をご提示いただきます。

    2. お勤め先または年金事務所等の支給元へ、受取口座の変更手続きを行ってください。当行から支給元へ直接手続きを行うことはできませんので、お客さまご自身でのお手続きをお願いいたします。

    3. 支給元での手続きが完了し、当行口座に給与または年金の入金が確認された時点で、新しいプランへの切替えまたは特典の適用が確定します。


    手続き完了後、次回の明細にて特典の適用状況（無料回数のリセット等）をご確認いただけます。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 264b90d9-7222-5b68-a687-ede6283f91fe
  title: 給与・年金受取特典：想定外の手数料・金額
  body: '「特典を適用しているはずなのに、手数料が引かれている」という場合に確認すべき事項をご案内します。


    【原因の確認】

    ・無料回数の超過：今月の他行あて振込が3回、または時間外ATM利用が5回を超えていないか、取引明細をご確認ください。

    ・受取実績の不足：前月に給与または年金の入金実績がなかった場合、一時的に特典が停止している可能性がございます。


    【解決策】

    回数制限内であるにもかかわらず手数料が発生している場合は、当行にて適用状況を調査いたします。至急、対象の取引日時と金額をお知らせください。


    【エスカレーション】

    原因が特定できない複雑な案件については、専門部署へエスカレーションし、精査した上で正当な手数料であるか、または返金が必要かを判断いたします。調査結果は改めてご連絡いたします。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: f043d4ad-087a-57f7-84ce-cc17c354147a
  title: 給与・年金受取特典：必要書類
  body: '特典適用の申請時に必要な書類は以下の通りです。


    ・給与受取特典をご希望の方：

    　ご本人確認書類、および給与振込指定書（またはお勤め先が発行する受取口座確認書類）


    ・年金受取特典をご希望の方：

    　ご本人確認書類、および年金証書または年金受給権者確認書


    ※書類の内容により、追加で確認事項をお願いする場合がございます。'
