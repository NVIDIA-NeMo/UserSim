  institution_id: asanagi_bank
- id: 0c9ca147-d58d-540d-bcd1-d162a0ed97a7
  title: 朝凪カードローン：規定・約款
  body: '本規定は、朝凪カードローンの利用に関する合意事項を定めるものです。お客さまは、厳正な返済能力審査に基づき決定された利用限度額（最大8,000,000円）の範囲内で借入を行うことができます。


    【返済義務】借入金および適用金利（年2%から14.5%）に基づき算出された利息を、指定の期日までに支払う義務を負います。毎月の最低返済額は2,000円となります。

    【条件の変更】当行は、法令の変更や社会情勢の変化、またはお客さまの信用状況の変化に基づき、金利や限度額を変更できるものとします。変更の際は、事前にお知らせいたします。

    【契約の終了】完済による解約のほか、規定の違反があった場合は当行より契約を解除し、残高の一括返済を求めることがあります。'
  domain: lending_mortgage
