  body: 'お客様のライフプランに合わせて、2つのプランからお選びいただけます。


    ・変動金利プラン（1.375%）：金利を低く抑えたい方向けです。ただし、市場金利に応じて返済額が変動するリスクがあります。

    ・固定金利期間選択型10年（3.7%）：将来の金利上昇に備え、10年間返済額を確定させたい方向けです。計画的に資産形成を行いたい方に適しています。


