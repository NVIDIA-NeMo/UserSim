- id: b3bc4914-7c66-5e31-8030-316520f60fba
  title: 朝凪Visaデビット：お手続きが完了しない・保留中のまま
  body: '【症状】

    オンラインでのお申込み手続き中、画面が切り替わらない、または「手続き保留中」の状態が続いている。


    【考えられる原因】

    ・本人確認書類の画像が不鮮明である、または端が切れている。

    ・通信環境が不安定なため、データの送信が完了していない。


    【確認・対応手順】

    1. アップロードした書類の画像に不備がないか改めてご確認ください。

    2. 通信環境を切り替え、再度手続きをお試しください。


    【解決しない場合】

    当行にて申請状況を確認し、不足している情報の再提出をご案内いたします。専門部署にて審査状況を調査し、改めて結果を通知させていただきます。'
