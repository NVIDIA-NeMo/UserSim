  title: 給与・年金受取特典：切替えや上位プランを検討するとき
  body: 本特典（月3回の振込無料、月5回のATM無料、年金受取0.1%金利上乗せ）と一般口座を比較します。日常的に他行への送金やATM利用がある方は、本特典への切替えでコストを大幅に削減できます。一方で、受取口座の指定が難しい場合は、通常の普通預金での運用となります。お客様のライフステージに合わせた最適な選択をご提案してください。
  domain: retail_banking
