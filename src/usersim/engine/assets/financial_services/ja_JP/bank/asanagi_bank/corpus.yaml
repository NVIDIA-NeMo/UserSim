- id: 374a4c29-1c5b-5c7f-bef7-0afa47351a3c
  title: 住宅ローン：最長借入期間（年）について
  body: 'Q：住宅ローンを借りる場合、最長で何年まで返済期間を設定できますか？


    A：当行の住宅ローンでは、最長で35年まで借入期間を設定することが可能です。お客様のご年齢や完済予定年齢、および審査結果により、上限期間が変動する場合がございます。


    詳細は「住宅ローン：商品概要」にてご確認ください。'
