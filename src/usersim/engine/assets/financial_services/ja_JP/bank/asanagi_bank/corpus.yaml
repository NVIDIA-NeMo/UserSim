  title: 朝凪Visaデビット：状況・履歴の確認
  body: '朝凪Visaデビットのご利用状況や取引履歴を確認する手順をご案内します。


    1. ご本人確認書類をご提示いただき、口座所有者であることを確認します。

    2. 履歴の確認を希望される期間（例：直近1ヶ月分など）をお伝えください。

    3. 当行にて、決済日、利用店名、および引き落とし金額の詳細を照会します。

    4. ご案内した内容が、お客様のご記憶にある利用履歴と一致しているかをご確認いただきます。


    なお、決済直後の取引は「仮売上」として処理され、後日確定額で正しく反映されます。確定まで数日かかる場合がございますので、あらかじめご了承ください。'
