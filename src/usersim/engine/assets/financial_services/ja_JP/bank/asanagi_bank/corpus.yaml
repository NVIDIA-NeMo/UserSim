- id: 5d579727-f641-5e80-87ba-6e5449911568
  title: 給与・年金受取特典：規定・約款の変更
  body: '本特典の適用条件および提供内容（月3回の他行あて振込手数料無料、月5回のATM利用手数料無料、および年金受取の方への0.1%の金利上乗せ）は、当行の規定および約款に基づき決定されます。


    法令の改正や経済状況の変化に伴い、これらの規定を変更する場合、当行は事前にお客様へ通知し、店頭またはオンラインバンキングにて告知いたします。変更後の条件は、告知された適用開始日から有効となります。本特典をご利用の際は、常に最新の規定をご確認ください。なお、本特典の適用を維持するためには、継続的に給与または年金の受取口座として当行をご指定いただく必要がございます。'
