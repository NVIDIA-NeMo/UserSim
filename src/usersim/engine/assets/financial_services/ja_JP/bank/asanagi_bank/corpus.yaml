  title: 住宅ローン：他社の一般的な商品との比較
  body: '他社の一般的な住宅ローンと比較し、当行の「住宅ローン」は、変動金利における「5年ごとの返済額見直し」および「上昇幅上限125%」というルールにより、急激な返済額増加を抑える仕組みを導入しています。


    また、オンラインでの繰上返済手数料を0円に設定しており、利便性とコストパフォーマンスを両立しています。返済計画の安定性を重視される方には、当行のプランが適しています。'
