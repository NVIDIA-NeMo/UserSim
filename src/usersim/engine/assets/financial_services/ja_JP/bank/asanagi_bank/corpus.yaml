  institution_id: asanagi_bank
- id: 7877d9cf-0d60-532f-88d2-d49e24b78fdc
  title: スーパー定期：想定外の手数料・金額
  body: 'お客様より「満期に受け取った金額が、想定していた利息よりも少ない」というお問い合わせをいただいた場合の対応手順です。


    【考えられる原因と確認事項】

    1. 税金の差し引き：利息に対して20.315%の税金が適用されているか確認してください。

    2. 中途解約の有無：満期まで保有せず、途中で解約された場合、「中途解約利率」が適用されており、当初の年利率（0.55%〜1.05%）よりも低くなっている可能性があります。


    【解決策】

    お客様に、税引前利息、差し引かれた税額、および適用利率を具体的に提示し、計算根拠をご説明ください。


    【エスカレーション】

    計算根拠を説明してもご納得いただけない場合や、システム上の誤りが疑われる場合は、速やかに専門部署へエスカレーションし、詳細な取引履歴の調査を依頼してください。'
