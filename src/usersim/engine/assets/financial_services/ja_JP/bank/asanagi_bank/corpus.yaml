- id: c7788ca6-b4eb-5898-bd99-9bd9612bfcaa
  title: 給与・年金受取特典：安全にご利用いただくためのポイント
  body: '「給与・年金受取特典」を安全にご利用いただくため、以下の点にご注意ください。


    当行では、セキュリティカードや生体認証を用いた多層的な認証プロセスを導入しております。また、口座情報の変更などの重要な手続きの前には、必ず厳格な本人確認（取引時確認）を実施いたします。


    不審なメールや電話で、暗証番号やセキュリティカードの情報を求めることは絶対にございません。万が一、不自然な連絡を受けた場合は、速やかに当行までお知らせください。あわせて「普通預金：不正利用からお客さまを守るために」をご一読いただき、安全な運用の徹底をお願い申し上げます。'
