- id: c4aa50b6-3989-561e-957e-df91ecde4292
  title: 給与・年金受取特典：不正利用からお客さまを守るために
  body: '給与・年金受取口座は、生活の基盤となる重要な資金が管理されるため、犯罪グループによる標的になりやすい傾向があります。「給与振込の手続きに不備がある」などの虚偽の内容で、口座番号や暗証番号を聞き出そうとする不審な電話やメールにご注意ください。


    朝凪銀行では、いかなる場合においても、電話やメールで暗証番号やセキュリティカードの情報を伺うことはございません。もし不審な連絡を受けたり、身に覚えのない出金があったりした場合は、直ちにご報告ください。迅速に口座の利用停止措置を講じ、被害の拡大を防ぎます。また、万が一カードを紛失・盗難された場合でも、預金者保護法に基づき、規定の範囲内で誠実に補償対応をさせていただきます。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 3f0c1175-e364-5a20-b436-6a3e1b2127c9
  title: 給与・年金受取特典：規定・約款
  body: '本特典は、当行の普通預金口座を給与受取口座または年金受取口座に指定し、継続的に利用されるお客さまに適用されます。


    【特典の内容と条件】

    1. 他行あて振込手数料の無料回数：月3回まで。

    2. 時間外ATM利用手数料の無料回数：月5回まで。

    3. 年金受取口座に指定された場合、規定の条件に基づき0.1%の金利上乗せを適用します。


    【適用の中止】

    受取口座の指定が解除された場合、または一定期間受取実績が確認できない場合は、翌月より本特典の適用を停止いたします。適用停止後の手数料は、通常の手数料体系に基づきご請求させていただきます。本規定は、法令の改正や当行の判断により、事前の告知をもって変更される場合があります。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 0eea1d64-604e-506c-b30f-0909218887ae
  title: 給与・年金受取特典：おすすめの方と主な使い方
  body: '「給与・年金受取特典」は、日々の生活資金を管理される皆さまに、安心と利便性を提供するためのサービスです。特に以下の方におすすめしております。


    ・毎月の給与や年金を当行で受け取り、公共料金の支払いや他行への送金を頻繁に行う方

    ・時間外にATMを利用することが多く、手数料を抑えたい方


    【主な活用方法とメリット】

    本特典を適用することで、他行あて振込手数料が月3回まで無料となり、効率的な資金移動が可能です。また、時間外ATM利用手数料が月5回まで無料となるため、急な現金需要にも柔軟に対応いただけます。さらに、年金受取口座にご指定の方は、0.1%の金利上乗せという資産形成のサポートを同時に受けられます。日常的な決済口座として、ぜひご活用ください。'
