- id: d009279e-26c2-50fd-9582-a8e446b9b407
  title: スーパー定期：必要書類
  body: 'スーパー定期のお申込みに必要な書類は、お客様のご状況によって異なります。


    | お客さまの区分 | 必要書類 | 判定 |

    | :--- | :--- | :--- |

    | 個人（口座あり） | ご印鑑、またはご署名 | 即時受付可能 |

    | 個人（新規口座） | 本人確認書類（運転免許証等）、ご印鑑 | 取引時確認後、受付 |

    | 法人 | 法人実印、登記簿謄本、代表者本人確認書類 | 書類確認後、受付 |


    ※最低預入金額として1,000円以上の資金をご用意ください。'
