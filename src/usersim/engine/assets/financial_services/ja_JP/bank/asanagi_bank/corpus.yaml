- id: 4ba8e54e-dc9d-5522-b84c-a1d609cbdd4e
  title: 普通預金：お申込みとご利用開始
  body: '普通預金口座の開設からご利用開始までの手順をご案内いたします。


    1. 本人確認書類のご提示：犯罪収益移転防止法に基づき、運転免許証やマイナンバーカードによる「取引時確認」を実施いたします。必要書類を提示し、ご本人様の確認を受けてください。

    2. 口座開設のお申込み：ご希望の利用目的（給与受取など）を伝え、口座開設の手続きを行います。

    3. 口座情報の受領：手続き完了後、口座番号のご案内とともに、キャッシュカード等の発行手続きを行います。

    4. ご利用開始：カードの受け取り後、ATMまたはオンラインバンキングにて初回のお預入れを行うことで、正式にご利用いただけます。


    お手続きの詳細や必要書類については「普通預金：お申込みいただける方」をご参照ください。'
  domain: retail_banking
  product_category: futsu_yokin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: cd473c4d-f113-55e5-b7d9-9e4f03f0aa3e
  title: 普通預金：手数料一覧
  body: '普通預金のご利用にかかる主な手数料は以下の通りです。


    ・他行あて振込手数料（オンラインバンキング）：220円

    ・時間外ATM利用手数料：110円

    ・キャッシュカード等再発行手数料：1,100円


    なお、給与受取などの条件を満たすことで手数料が無料になる優遇制度がございます。詳細は「給与・年金受取特典：商品概要」をご確認ください。'
