  title: スーパー定期：ご利用条件による違い
  body: '【預入金額による条件】

    ・1,000円以上：スーパー定期の開設が可能です。期間に応じた金利（0.55%〜1.05%）が適用されます。

    ・1,000円未満：本商品をご利用いただけません。日常的な決済に適した「普通預金」等のご案内をしてください。


    【取引時確認の状況】

    ・確認完了済み：即時にお手続きが可能です。

    ・確認未完了：本人確認書類のご提示後、お手続きいただけます。'
