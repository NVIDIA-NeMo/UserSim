- id: 7414cc74-41d0-5f15-9dd7-30f8e5ffd487
  title: 給与・年金受取特典：お手続きが完了しない・保留中のまま
  body: '「受取口座の指定手続きをしたはずなのに、特典が適用されていない」と感じられる場合は、以下の点をご確認ください。


    【考えられる原因と確認事項】

    1. 初回振込の未完了：受取口座の指定後、実際に給与や年金の振込が当行口座に行われるまで適用されません。支給日を過ぎて数営業日経過しているかご確認ください。

    2. 指定情報の不備：支給元への提出書類に誤りがあり、振込が正常に行われていない可能性がございます。


    【解決策】

    ・通帳またはオンラインバンキングで、直近の支給日に正しい名義で入金があるかをご確認ください。

    ・入金が確認できない場合は、支給元へ手続き状況をお問い合わせください。


    上記を確認しても解決せず、入金があるにもかかわらず特典が適用されない場合は、当行にて調査いたしますので、その旨をお申し付けください。'
  domain: retail_banking
  product_category: kyuyo_nenkin_tokuten
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 923cb143-2910-58a8-ae83-3d653907db99
  title: 給与・年金受取特典：お申込みいただける方
  body: '本特典の適用条件は以下の通りです。


    【条件】

    ・当行の普通預金口座を保有し、かつ以下のいずれかを満たす方

    　- 給与の受取口座として指定し、継続的に受取がある

    　- 年金の受取口座として指定し、継続的に受取がある


    【結果】

    ・上記条件を満たす場合、他行あて振込手数料（月3回まで）およびATM利用手数料（月5回まで）が無料となります。また、年金受取の方は別途金利優遇が適用されます。'
