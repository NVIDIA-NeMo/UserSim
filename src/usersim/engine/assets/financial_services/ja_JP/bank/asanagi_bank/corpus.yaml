  mentions_tools: []
  institution_id: asanagi_bank
- id: f720156c-e409-52b3-bb3b-cc07bcf7f595
  title: 給与・年金受取特典：ログインできない・アクセスできない
  body: 'オンラインバンキングで特典の利用状況が確認できない、またはログインできない場合の対応です。


    【症状】ログイン時にエラーが表示される、または特典の無料回数が正しく表示されない。

    【原因と確認事項】

    ・パスワードの入力間違いや、ロックがかかっていないかご確認ください。

    ・生体認証やセキュリティカードの認証が正常に完了しているかご確認ください。


    【解決策】

    ・パスワードを忘れた場合は、再設定手続きを行ってください。

    ・認証エラーが続く場合は、認証デバイスの再起動をお試しください。


    【エスカレーション】

    上記で解決しない場合は、当行の専門部署にてアカウント状況を調査いたします。調査完了後、ログイン可能となった旨を改めてご連絡いたします。'
