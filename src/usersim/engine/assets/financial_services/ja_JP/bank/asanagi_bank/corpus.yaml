  institution_id: asanagi_bank
- id: 797ede45-2b13-52bb-b7b7-2c247471eb90
  title: 朝凪Visaデビット：明細や記録と合わない
  body: 'お客様から「口座の引き落とし金額が、お店での支払額と合わない」とのお問い合わせがあった際の対応手順です。


    【想定される原因】

    1. 海外利用の手数料：海外加盟店での利用時、ご利用金額に加えて3%の海外利用手数料が加算されている可能性があります。これが原因で、請求額が想定より高くなるケースが多く見られます。

    2. 仮売上と確定額の差：ホテルやレンタカー等の利用で、一時的に保証金（デポジット）として多めに引き落とされ、後日差額が返金される場合があります。

    3. キャッシュバックの反映タイミング：0.2%のキャッシュバックは即時ではなく、規定のタイミングで一括して口座に払い戻されます。


    【対応策】

    ・取引日時と金額を照合し、海外利用がある場合は3%の手数料が適用されているかを計算して説明してください。解決しない場合は、詳細な調査のため専門部署へエスカレーションし、調査結果をお客様へ回答いたします。'
  domain: cards
  product_category: asanagi_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: asanagi_bank
- id: 818f6f8b-1b94-507d-a447-df18490f4c6a
  title: 住宅ローン：商品概要
  body: '朝凪銀行の「住宅ローン」は、お客様の理想の住まいづくりをサポートする融資商品です。借入限度額は最大100,000,000円まで、最長で35年の返済期間を設定いただけます。


    金利プランは、市場に合わせて変動する変動金利（1.375%）と、10年間の金利を固定できる固定金利（3.7%）からお選びいただけます。融資手数料として借入金額の2.2%を申し受けますが、オンラインでの繰上返済手数料は0円となっており、計画的な資産形成を支援します。


    また、変動金利をご選択の場合、5年ごとの返済額見直しを行い、上昇幅に上限を設ける125%ルールを適用することで、急激な返済額の変化を抑え、安心感のある生活設計をサポートいたします。'
