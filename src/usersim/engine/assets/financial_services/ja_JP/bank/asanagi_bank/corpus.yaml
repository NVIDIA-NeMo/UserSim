  body: '最近、朝凪Visaデビットをかたる不審なメールやSMS（ショートメッセージ）が報告されています。「カードの利用制限が解除されました」や「不審な利用が検知されたため、至急確認が必要です」といった内容で、偽のウェブサイトへ誘導し、個人情報を盗み出そうとする手口に十分ご注意ください。


