- id: f44e1d68-3764-55be-9871-1f12cb1d2355
  title: 朝凪カードローン：リスクについてのご説明
  body: '朝凪カードローンをご利用にあたり、以下のリスクについて十分にご理解ください。


    【金利負担のリスク】

    本商品は年2%から14.5%の金利が適用されます。借入金額や利用期間に応じて利息が発生するため、返済が長期化すると、当初の想定よりも利息負担が増加します。


    【過剰借入のリスク】

    最大8,000,000円という高い利用限度額が設定される場合がありますが、これはあくまで返済能力に基づいた枠であり、限度額まで借りることが適切であるとは限りません。ご自身の収入に見合った計画的な利用をお願いいたします。


    【返済遅延のリスク】

    毎月の最低返済額である2,000円以上の支払いが滞った場合、遅延損害金が発生し、信用情報に影響を及ぼす可能性があります。返済が困難になった場合は、速やかに当行へご相談ください。'
