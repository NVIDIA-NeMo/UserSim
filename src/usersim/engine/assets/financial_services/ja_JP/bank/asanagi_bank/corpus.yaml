- id: 3d962fbd-2be5-567f-81be-8aaafd147571
  title: 住宅ローン：重要事項のご説明
  body: '本商品は、住宅の取得を目的とした融資です。以下の重要事項を必ずご確認ください。


    1. 金利変動リスク：変動金利（1.375%）を選択された場合、将来的に金利が上昇し、返済額が増加する可能性があります。

    2. 返済額の見直し：変動金利の場合、5年ごとに返済額の見直しを行います。その際、返済額の上昇幅は前回の125%を上限とするルールを適用します。

    3. 費用負担：ご契約時に借入金額の2.2%の融資手数料が発生します。

    4. 団体信用生命保険：借入者が死亡または高度障害状態になった際、保険金でローン残高が完済される仕組みがございます。


    個別の税務や法務に関する助言は専門家へご案内いたします。適合性の原則に基づき、お客様の状況に最適な提案をさせていただきます。'
