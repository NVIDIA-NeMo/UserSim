- id: 07356eca-274b-5918-993c-77b61dfb6497
  title: 朝凪カードローン：状況・履歴の確認
  body: '「朝凪カードローン」のご利用状況およびお取引履歴を確認する手順をご案内します。


    1. 貸付残高とご利用履歴の照会を依頼してください。その際、ご本人様確認のため、セキュリティカードや生体認証による認証を行います。

    2. 現在の貸付残高、および直近の返済実績についてのご案内をいたします。

    3. 適用されている金利（年2%から14.5%の範囲内）と、それに基づいた利息の計算結果をご確認ください。

    4. 返済計画の変更や、限度額（最大8,000,000円）に対する現在の利用率について詳細が必要な場合は、合わせてお知らせください。


    上記の手順により、現在の債務状況を正確に把握し、計画的な返済にご活用いただけます。'
