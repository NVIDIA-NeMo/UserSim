  body: 'このツールは、指定された期間の口座取引明細書を取得するために使用します。


    【引数】

    ・account_id：明細を取得する口座の識別子

    ・start_date：抽出期間の開始日

    ・end_date：抽出期間の終了日


    オペレーターは、お客様が希望する期間を指定し、このツールを直接呼び出して明細情報を取得します。'
