  title: スーパー定期：不正利用からお客さまを守るために
  body: '大切な資産を預ける定期預金において、最近では「特別な高金利プランへの切り替え」を謳い、口座情報を聞き出そうとする詐欺の手口が報告されています。


    朝凪銀行では、いかなる場合もお電話やメールで、お客様の暗証番号やセキュリティカードの番号を伺うことはございません。不審な連絡を受けた際は、決して情報を伝えずに、すぐにご相談ください。


