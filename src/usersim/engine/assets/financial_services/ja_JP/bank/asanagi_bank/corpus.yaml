- id: c2b3b783-dd24-556e-b54b-974d8f0e64e2
  title: 朝凪カードローン：ご利用開始までの手順
  body: '「朝凪カードローン」のご利用開始までの標準的なフローは以下の通りです。サポート担当者は、お客様の状況に合わせてご案内ください。


    1. お申込み：お客様より必要事項の申告および本人確認書類のご提示をいただきます。

    2. 審査：厳正な返済能力審査を行い、適用金利（年2%から14.5%）および利用限度額（最大8,000,000円）を決定します。

    3. ご契約：決定した条件をご提示し、ご同意いただいた後、契約手続きを完了します。

    4. カード発行：ご登録住所へカードを郵送します。


    本商品は、毎月の最低返済額が2,000円からとなっており、お客様の負担を軽減しつつ柔軟な資金調達を支援します。'
