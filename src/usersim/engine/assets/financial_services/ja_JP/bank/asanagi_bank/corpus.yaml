- id: a06953fd-4185-5481-ac1c-77da4504427d
  title: 住宅ローン：お申込みとご利用開始
  body: '「住宅ローン」のお申込みからご利用開始までの手順をご案内いたします。


    1. ご相談とシミュレーション：まず、ご希望の借入金額や期間をお知らせください。最大100,000,000円の限度額内で、最適な返済計画を提案いたします。

    2. 必要書類のご提出：本人確認書類および収入証明書をご提示ください。当行にて厳格な取引時確認を実施いたします。

    3. 審査：ご提出いただいた書類に基づき、返済能力の審査を行います。

    4. ご契約手続き：審査承認後、金利プラン（変動金利1.375%または固定金利3.7%）を決定し、ご契約を締結します。この際、借入金額の2.2%の融資手数料が発生いたします。

    5. 融資実行：手続き完了後、指定の口座へ融資が実行され、ご利用開始となります。'
