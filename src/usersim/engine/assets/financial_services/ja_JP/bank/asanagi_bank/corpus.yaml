- id: ba0ac261-a038-5b63-81cb-a922d8807d05
  title: 住宅ローン：ご利用開始までの手順
  body: '【担当者用：住宅ローン提供フロー】

    お客様が住宅ローンをご利用開始されるまでの標準的な手順は以下の通りです。


    1. ご相談・事前審査：お客様の希望額（最大借入金額：100,000,000円）と借入期間（最長35年）を確認し、事前審査を行います。

    2. 本審査：物件資料および収入証明書を提出いただき、厳正な返済能力審査を実施します。

    3. 金利プランの決定：変動金利（1.375%）または固定金利期間選択型10年（3.7%）のいずれかを選択いただきます。

    4. 契約手続き：融資手数料（借入金額の2.2%）および契約内容についてご説明し、ご署名・ご捺印をいただきます。

    5. 融資実行：物件の引き渡しに合わせて、ご指定の口座へ融資を実行します。


    ※複雑な審査案件については、専門部署へエスカレーションしてください。'
  domain: lending_mortgage
  product_category: jutaku_loan
