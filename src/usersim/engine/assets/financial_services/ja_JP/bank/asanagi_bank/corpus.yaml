  body: '【質問】毎月最低いくらから返済すればよいですか？

    【回答】「朝凪カードローン」の毎月の最低返済額は2,000円からとなっております。ご利用金額に応じて設定されますが、最低2,000円以上の返済が必要です。なお、最低返済額以上の金額を随時ご返済いただくことで、利息負担を軽減し、より効率的に完済することが可能です。'
