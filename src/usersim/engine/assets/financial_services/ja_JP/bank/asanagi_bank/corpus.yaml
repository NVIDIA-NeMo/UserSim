- id: 465f9311-b710-59a5-9a22-c359d8b7bc3b
  title: 住宅ローン：ログインできない・アクセスできない
  body: '【症状】オンラインバンキングで住宅ローンの残高照会や返済スケジュールの確認画面にアクセスできない。


    【考えられる原因と対策】

    ・パスワードの入力間違い：大文字・小文字の区別に注意して再入力してください。

    ・アカウントのロック：短時間に複数回認証に失敗すると、セキュリティのためロックされます。

    ・認証情報の期限切れ：セキュリティカード等の有効期限が切れている可能性があります。


    【解決方法】

    1. まずはIDとパスワードを再度正確に入力してください。

    2. それでも解消しない場合は、当行にて厳格な本人確認（取引時確認）を行った後、パスワードの再発行またはロック解除を行います。


    【エスカレーション】

    認証不備が解消せず、システムエラーが表示される場合は、当行の専門部署にてアカウント状態を調査し、復旧完了後に改めてご連絡いたします。'
