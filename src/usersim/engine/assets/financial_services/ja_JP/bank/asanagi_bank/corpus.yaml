- id: e6f79e82-97a8-5c9f-b0ed-f3c818f56c22
  title: スーパー定期：リスクについてのご説明
  body: '本商品をご利用いただくにあたり、以下のリスクについてご理解ください。


    【流動性リスク】

    本商品は一定期間資金を預ける商品です。満期前に解約される場合は「中途解約利率」が適用されるため、当初の約定金利（0.55%〜1.05%）よりも受取利息が大幅に少なくなります。


    【インフレーションリスク】

    物価上昇率が適用金利を上回った場合、実質的な資産価値が目減りする可能性があります。


    【元本保証について】

    本商品は元本保証の商品です。また、預金保険制度により、1金融機関につき元本1,000万円までが保護されます。


    個別の税務上の取り扱いについては、税理士等の専門家にご相談ください。'
