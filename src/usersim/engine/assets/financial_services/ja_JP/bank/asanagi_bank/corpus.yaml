  title: 朝凪Visaデビット：不正利用からお客さまを守るために
  body: '朝凪Visaデビットを安心してお使いいただくために、不正利用への対策についてご案内いたします。当行では、多層的な認証プロセスを導入し、お客さまの資産を保護しております。


    【ご注意いただきたい点】

    当行の職員が、電話やメールでお客さまの暗証番号やセキュリティカードの情報を伺うことはございません。不審な連絡があった場合は、決して情報を伝えず、すぐにご相談ください。


    【万が一の対応】

    カードの紛失や盗難、身に覚えのない請求にお気づきになった際は、迅速に届出をお願いいたします。預金者保護法に基づき、偽造・盗難カードによる被害は原則として補償いたします。当行にて誠実に調査し、対応させていただきます。'
