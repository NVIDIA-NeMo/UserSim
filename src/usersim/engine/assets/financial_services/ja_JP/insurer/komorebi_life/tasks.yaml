  - >-
    出産と引っ越しが重なりました。住所の変更（{{address}}）、定期保険の受取人を{{beneficiary}}に変更、それから{{product}}への申込みをお願いします。
  - >-
    家族が増えたので、住所を{{address}}に、定期保険の受取人を{{beneficiary}}に変えて、{{product}}にも加入したいです。
  account_state:
    account_id: teiki_kl_0001
    account_type: こもれび定期保険
    customer_id: cust_kl_0001
  param_space:
    address: ['宮城県仙台市青葉区春日町7-21-3', '広島県広島市南区段原山崎2-5-17']
    beneficiary: [妻, 夫]
    product: [こもれび医療保険, こもれびがん保険]
  gold_tool_sequence: [update_contact_info, update_beneficiary, open_account]
  expected_state_deltas: {contact_updated: true, beneficiary_updated: true, new_account_status: OPEN}
- id: TPL-KL-CANCERPROXY-001
  tier: verifiable
  task_type: transactional
  domain: insurance
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
