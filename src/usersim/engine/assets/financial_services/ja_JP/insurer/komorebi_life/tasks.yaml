  account_state:
    account_id: gan_kl_0001
    account_type: こもれびがん保険
    contract_date: '2023-06-01'
  param_space:
    person: [妻, 夫, 長女]
  gold_tool_sequence: [file_claim, update_beneficiary, set_alerts]
  expected_state_deltas: {claim_status: FILED, beneficiary_updated: true, alerts_updated: true}
- id: TPL-KL-COOLINGOFF-SWITCH-001
  tier: verifiable
  task_type: transactional
  domain: insurance
  placeholder: true
  persona_tags: [region:any, age:any]
  opening_user_messages:
