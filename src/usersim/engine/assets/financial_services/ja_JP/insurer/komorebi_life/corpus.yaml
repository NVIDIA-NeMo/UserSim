  body: 'Q：入院して手術を受けた場合、どのような給付金が支払われますか？


    A：「こもれび医療保険」では、入院中の手術に対して、入院給付金とは別に「入院中の手術給付金」として100,000円を給付いたします。これにより、入院費に加え、手術に伴う費用負担の軽減をサポートいたします。'
