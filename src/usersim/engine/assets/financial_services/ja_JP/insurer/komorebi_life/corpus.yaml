- id: 81799146-9d93-5e05-a1a9-50a48c7444b7
  title: こもれび個人年金保険：リスクについてのご説明
  body: '本プランをご検討されるにあたり、以下のリスクについて正しくご理解ください。


    【インフレリスク】

    本プランはあらかじめ定められた金額を準備する仕組みです。将来的に物価が大きく上昇（インフレーション）した場合、実質的なお金の価値が下がり、期待していた生活水準を維持できなくなる可能性があります。


    【早期解約による元本割れリスク】

    本商品は長期的な積立を前提としています。契約から短期間で解約された場合、解約返戻金がそれまでにご加入いただいた保険料の合計額を下回る（元本割れする）ことがあります。


    【告知義務違反によるリスク】

    ご契約時の告知義務に違反し、事実に反する内容を伝えた場合、保険業法に基づき契約が解除されることがあります。その際、年金や給付金が支払われない可能性があるため、必ず正確な告知をお願いいたします。


    【破綻時の保護について】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。これにより、お客さまの大切な資産は最大限保護されます。


    当社は金融庁の監督および保険業法に基づき、公正な取引と厳格なデータプライバシー保護を徹底しております。'
