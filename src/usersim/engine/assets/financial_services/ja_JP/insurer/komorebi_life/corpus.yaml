- id: 67d92187-218c-5357-aef4-b7bbfad6ce94
  title: こもれび終身保険（低解約返戻金型）：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまのの大切な資産を守るため、厳格な本人認証を徹底しております。特に受取人の変更や解約など、契約状態を変化させるお手続きの際は、必ず「本人確認書類」および「契約者番号」による認証を行います。これらの認証が完了するまで、機密性の高い情報の開示やお手続きの実行はいたしません。


    【ご注意ください】

    当社が、電話やメールで暗証番号やクレジットカードの完全な情報を直接お伺いすることはございません。万が一、不審な連絡があった場合や、身に覚えのない手続き通知を受け取った場合は、速やかに当社までご連絡ください。迅速な対応により、不正な契約変更や資金流出を未然に防ぎます。'
