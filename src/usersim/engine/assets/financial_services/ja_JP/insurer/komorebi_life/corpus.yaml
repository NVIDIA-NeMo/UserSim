    ご契約時の健康状態等の告知に事実と異なる点があった場合、告知義務違反となり、契約解除や保険金・給付金が支払われない可能性がございます。


    【クーリング・オフについて】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。


    【責任準備金の補償】

    当社は金融庁の監督および保険業法を厳格に遵守しております。万が一の場合でも、生命保険契約者保護機構により、責任準備金等の90%まで補償される体制となっております。'
