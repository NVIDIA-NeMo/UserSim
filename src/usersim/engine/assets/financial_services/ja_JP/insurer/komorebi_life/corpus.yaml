- id: 8fdc8081-6504-5d84-b43d-5437f109f5b1
  title: set_alerts を使う場面
  body: 'お客様が保険料の払込期日の通知や、給付金のお支払い状況に関するお知らせなど、特定のアラート設定を希望される場合に set_alerts ツールを使用します。これにより、お客様は重要なタイミングを逃さず、安心してお手続きを進めていただけます。


    手続き手順：

    1. 本人確認書類および契約者番号を用い、厳格な本人認証を行います。

    2. get_accounts ツールを使用して、お客様の契約者番号から該当するアカウントIDを特定します。

    3. 設定したいアラートの内容（通知したい項目やタイミング）について、お客様のご意向を詳しく確認します。

    4. set_alerts ツールを呼び出し、お客様のご希望に沿ったアラート設定を完了させます。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: komorebi_life
