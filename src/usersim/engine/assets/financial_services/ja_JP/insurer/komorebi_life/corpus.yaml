  title: こもれび医療保険：ご紹介・継続利用の特典
  body: '【ご紹介・継続利用キャンペーンのご案内】


    いつもこもれび生命をご利用いただき、誠にありがとうございます。このたび、多くの方に安心をお届けするため、ご紹介および継続利用の特典をご用意いたしました。


    期間：2026年1月1日から2026年6月30日まで


    すでにご契約中の方がご家族やご友人に「こもれび医療保険」をご紹介いただき、新しくご契約に至った場合、ご紹介者様とご成約者様の両方に、日頃の感謝を込めた特典を差し上げます。


    また、プランの継続利用をいただいているお客様には、ライフプランの見直し相談を無料で承ります。シンプルで分かりやすい保障内容を強みとする当プランを、ぜひこの機会にご検討ください。'
