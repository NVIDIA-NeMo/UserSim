- id: 36e71c53-8b82-5b5a-b2a9-bb7fb9e2bc1a
  title: こもれび医療保険：この商品をかたる詐欺にご注意ください
  body: 'こもれび生命では、お客様の安心を守るため、セキュリティへの取り組みを強化しております。最近、当社の「こもれび医療保険」をかたる不審な連絡（電話やメール、SNSなど）が報告されています。被害を防ぐため、以下の点に十分ご注意ください。


    【詐欺の主な手口】

    ・「特別なプランへの変更で保険料を大幅に安くできる」と持ちかける。

    ・「給付金の支払手続きに不備があるため、至急確認が必要」と不安を煽る。

    ・当社の社員を名乗り、個人情報を聞き出そうとする。


    【こもれび生命が絶対に要求しない情報】

    当社が、電話やチャットでお客様に以下の情報を要求することは一切ございません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・ログインパスワード

    ・身分証明書番号（マイナンバーなど）


    もし不審な連絡を受けたり、「おかしいな」と感じたりした場合は、すぐにやり取りを中断し、当社のカスタマーセンターまでご連絡ください。また、万が一情報を伝えてしまった場合は、速やかにご相談をお願いいたします。お客様の情報を守るため、常に警戒をお願いいたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 04275433-79c5-559d-a6cd-10ea9efeff72
  title: こもれび医療保険：限度額・制限と注意事項
  body: '本資料は、サポート担当者が顧客へ案内するための「こもれび医療保険」の制限事項および注意事項をまとめたものです。案内時には、お客様が誤解のないよう、以下の数値を正確に伝えてください。


    【給付金の支払限度額・日数】

    ・1回の入院の支払限度日数：60

    ・入院給付金の通算支払限度日数：1095

    ・先進医療給付金の通算限度額：20,000,000円


    【重要な注意事項】

    1. 告知義務について：契約時に健康状態を正確に伝える義務があります。事実に反する告知をした場合、契約解除や給付金が支払われない可能性があることを明確に案内してください。

    2. クーリング・オフ：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回できる制度があることを伝えてください。

    3. 高額療養費制度との関係：公的医療保険の制度により自己負担額に上限があるため、本保険はあくまでその不足分を補完するものであることを説明してください。


    重要な免責事項や注釈は、必ず区分して記載し、お客様が視覚的に理解しやすい形で提示してください。'
