  body: '【症状】

    専用ページにログインできない、またはアクセス時にエラーが表示される。


    【考えられる原因と確認事項】

    ・契約者番号やパスワードの入力誤りがないか、再度ご確認ください。

    ・ブラウザのキャッシュやクッキーの影響が考えられます。別のブラウザでの試行をお願いします。


    【解決方法】

    パスワードを忘れた場合は、本人認証を経て再設定を行います。担当エージェントへ再発行を依頼してください。


    【エスカレーション】

    上記で解決しない、またはアカウントがロックされている場合は、専門部署およびコンプライアンス部門へ案件をエスカレーションし、詳細な調査を実施いたします。'
