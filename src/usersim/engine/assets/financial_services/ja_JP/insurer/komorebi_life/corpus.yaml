- id: 2dce6e67-1116-5330-bb21-6cbd50c8c399
  title: こもれびがん保険：想定外の手数料・金額
  body: 'お客さまより「保険料が想定していた金額（例：1,980円）と異なる」というお問い合わせをいただいた場合の対応手順です。


    【原因の確認】

    ・ご契約時の年齢やリスク区分が変更されていないかを確認してください。

    ・特約の追加や、プランの変更が行われていないか履歴を照会してください。


    【解決策】

    ・保険料はリスクと年齢に基づき適正に設定されており、持続可能な保障提供のために変動する場合があります。根拠となる料率表に基づき、現在の金額が適正であることを丁寧にご説明ください。


    【エスカレーション】

    ・説明後もお客さまが納得されず、強い不満や苦情に発展した場合は、速やかに専門部署およびコンプライアンス部門へエスカレーションし、誠実な解決を図ってください。'
