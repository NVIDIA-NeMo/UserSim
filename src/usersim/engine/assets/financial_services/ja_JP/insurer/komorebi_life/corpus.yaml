  institution_id: komorebi_life
- id: 367b2806-2f9f-5362-8189-f0fb2cbf0825
  title: change_payment_method を使う場面
  body: '保険料の払込方法（口座振替からクレジットカードへの変更、またはその逆）や、振替口座を変更したいという依頼を受けた際にこの手続きを行います。


    【手続きの流れ】

    1. お客さまのフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させます。

    2. `get_accounts` を呼び出し、変更対象となる契約の account_id を特定します。

    3. 新しい払込方法（口座振替またはクレジットカード）と、口座情報等の詳細を確認します。

    4. `change_payment_method` を呼び出し、account_id と新しい払込情報を指定して変更手続きを完了させます。


    ※クレジットカード番号や暗証番号などの機密情報は、ツールを通じて適切に処理されるため、エージェントがチャットや電話で直接的に要求したり、メモしたりしないよう十分にご注意ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_payment_method
  institution_id: komorebi_life
- id: 4d7c3c04-74a2-52c8-a806-b3f0915e5fe6
  title: change_payment_method ツールリファレンス
  body: 'このツールは、お客様の保険料のお支払い方法を変更するために使用します。口座振替からクレジットカードへの変更、あるいは引落口座の変更などを直接的に処理します。


    【操作内容】

    エージェントがこのツールを呼び出すことで、指定された契約の払込方法または口座情報を更新します。


    【引数】

    - account_id: 変更対象となる保険契約のID（get_accountsツールなどで特定します）。

    - payment_method: 新しい支払方法（「口座振替」または「クレジットカード」）。

    - account_details: 新しい口座番号やカード番号などの詳細情報。


    【注意事項】

    本ツールを実行する前に、必ず verify_identity を用いてお客様の本人確認を完了させてください。機密情報（パスワードや暗証番号）はこのツールでは要求しません。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_payment_method
  institution_id: komorebi_life
- id: cd92aba6-0f74-5ddd-993d-f374dee8663b
  title: withdraw_application を使う場面
  body: 'お客様から保険申し込みの撤回（クーリング・オフ）の申し出があった場合、本手続きを行います。


    クーリング・オフは、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば可能です。この期間内であるかを確認し、手続きを進めてください。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、verify_identity を呼び出して本人確認を完了させます。

    2. 対象となる申し込み内容を確認します。

    3. クーリング・オフの適用期間（8日以内）であることを確認します。

    4. withdraw_application ツールを呼び出し、申し込みの撤回処理を完了させます。


    手続き完了後、お客様には撤回が受理されたことを丁寧にご案内ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_application
  institution_id: komorebi_life
- id: e5f7f9b8-3d33-5e85-bb2c-86b128a57abb
  title: withdraw_application ツールリファレンス
  body: 'このツールは、クーリング・オフ制度に基づき、保険の申し込みを撤回するために使用します。


    【操作内容】

    エージェントがこのツールを呼び出すことで、指定された申し込みを無効化し、手続きを撤回します。これは不可逆的な操作となります。


    【引数】

    - account_id: 撤回対象となる申し込みのID。


    【注意事項】

    本ツールを実行する前に、verify_identity による本人確認を完了させてください。また、申込日または書面受取日のいずれか遅い日から8日以内という期限内であるかを確認してください。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_application
  institution_id: komorebi_life
- id: 157cb42a-c971-5ace-86d6-915acdc235c0
  title: open_account を使う場面
  body: 'お客様が新しい保険契約を希望された場合、本手続きを通じて申し込みを受け付けます。


    保険契約にあたっては「告知義務」がございます。お客様の健康状態などを正確に伝える義務があり、事実に反する告知をした場合、将来的に契約解除や保険金・給付金が支払われない可能性があることを事前にお伝えください。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、verify_identity を呼び出して本人確認を完了させます。

    2. お客様の意向と客観的なデータに基づき、適切なプラン（こもれび定期保険、こもれび終身保険（低解約返戻金型）など）をご提案します。

    3. 告知内容を含む、契約に必要な詳細情報を伺います。

    4. open_account ツールを呼び出し、申し込み手続きを完了させます。


    個別の税務相談や医療的な助言は行わず、保険制度の一般的な解説に留めてください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: komorebi_life
- id: 878e8ed7-c091-56f6-9385-87bd9862dbf4
  title: open_account ツールリファレンス
  body: 'このツールは、新しい保険契約の申し込みを受け付けるために使用します。


    【操作内容】

    エージェントがこのツールを呼び出すことで、お客様の情報を登録し、保険契約の申し込み処理を行います。この際、告知内容の登録も同時に行われます。


    【引数】

    - product_id: 申し込みたい商品のID（例：teiki_hoken, shushin_hoken など）。

    - customer_details: フルネーム、生年月日、連絡先などの顧客情報。

    - disclosure_info: 健康状態などの告知内容。

    - payment_info: 保険料の支払方法および口座・カード情報。


    【注意事項】

    実行前に verify_identity による本人確認を完了させてください。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: komorebi_life
- id: ea19a0ca-285a-503c-a77c-acafb960953f
  title: update_beneficiary を使う場面
  body: '死亡保険金受取人や指定代理請求者の変更を希望された場合に、本手続きを行います。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、verify_identity を呼び出して本人確認を完了させます。

    2. get_accounts を呼び出し、対象となる契約（account_id）を特定します。

    3. 新しい受取人または指定代理請求人の情報を伺います（フルネーム、生年月日、連絡先など）。

    4. update_beneficiary ツールを呼び出し、変更手続きを完了させます。


    受取人の変更は将来の給付に関わる重要な手続きであるため、慎重に情報の確認を行ってください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: komorebi_life
- id: ed675433-182d-5192-a525-d78a35d921c1
  title: update_beneficiary ツールリファレンス
  body: 'このツールは、死亡保険金受取人や指定代理請求人を変更するために使用します。


    【操作内容】

    エージェントがこのツールを呼び出すことで、指定された契約の受取人情報を更新します。


    【引数】

    - account_id: 変更対象となる保険契約のID。

    - beneficiary_details: 新しい受取人または指定代理請求人の詳細情報（氏名、生年月日、連絡先等）。

    - role: 変更する役割（「死亡保険金受取人」または「指定代理請求人」）。


    【注意事項】

    本ツールを実行する前に、必ず verify_identity による本人確認を完了させてください。'
