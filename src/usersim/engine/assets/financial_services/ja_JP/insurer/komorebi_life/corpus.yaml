  body: 'お客様の情報を守るため、以下の点にご注意ください。当社では、受取人の変更や契約内容の変更など、重要なお手続きの前には、必ず本人確認書類および契約者番号を用いた厳格な本人認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行はいたしません。


