  institution_id: komorebi_life
- id: 273b77fe-e705-50d8-b1dc-7b76421fc948
  title: こもれび定期保険：リスクについてのご説明
  body: '「こもれび定期保険」のご契約にあたり、以下のリスクについて十分にご確認ください。


    【掛け捨て型に伴うリスク】

    本商品は低コストで大きな保障を得るための「掛け捨て型」プランです。終身保険とは異なり、貯蓄性はございません。そのため、満期時や中途解約時に戻ってくる解約返戻金はございませんので、資産形成を目的としたプランではない点にご注意ください。


    【保険期間終了後のリスク】

    保険期間は10年です。期間終了後は保障がなくなります。再度加入を希望される場合は、その時点の年齢で再審査となり、保険料が上昇するか、あるいは健康状態により加入いただけない可能性があります。


    【告知義務違反のリスク】

    契約時の健康状態等の告知に事実と異なる点があった場合、告知義務違反となり、契約解除や保険金・給付金の不支払いに至る可能性があります。


    【万が一の補償について】

    当社が万が一破綻した場合、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減されることがある点をご留意ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 0565ece8-253c-597d-8729-99bfa13f774f
  title: こもれび定期保険：金利・料率の決まり方と適用
  body: '「こもれび定期保険」の保険料（料率）の決定プロセスについて、サポート担当者は以下の通り案内してください。


    【料率の決定根拠】

    本商品の保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用することを前提に、合理的かつ透明性の高い体系を採用しています。統計的な死亡率データに基づき、適正価格を維持しています。


    【適用される要因】

    個別の保険料は、以下の要素を組み合わせて決定されます。

    ・加入時の年齢（上限70歳まで）

    ・性別

    ・設定する保険金額（例：30,000,000円など）

    ・健康状態（告知内容）


    【適用期間】

    一度決定した保険料は、保険期間である10年を通じて固定されます。期間中の保険料変動はございません。'
  domain: insurance
  product_category: teiki_hoken
  document_type: rate_sheet
  source_authority: official
  placeholder: true
