- id: 1a5db90b-a901-507b-bb70-301dcaf00757
  title: こもれび医療保険：入院給付金の通算支払限度日数について
  body: '【よくあるご質問】


    Q：入院給付金は、一生の間で最大で何日まで支払われますか？


    A：「こもれび医療保険」における入院給付金の通算支払限度日数は、1,095日です。これは、ご契約期間中に累計で支払われる入院日数の上限を指します。


    Q：1回の入院で支払われる日数に制限はありますか？


    A：はい、1回の入院につき支払限度日数は60日までとなっております。詳細な条件については、「こもれび医療保険：商品概要」をご確認ください。'
