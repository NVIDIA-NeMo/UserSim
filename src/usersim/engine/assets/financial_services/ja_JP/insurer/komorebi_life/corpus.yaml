- id: d738f9d7-c281-5cb4-8f79-dc66a4b6b658
  title: こもれび個人年金保険：重要事項のご説明
  body: '【法令および制度に基づく重要事項】


    本商品は、保険業法に基づき金融庁の監督を受けております。ご契約にあたり、以下の事項を必ずご確認ください。


    1. 生命保険契約者保護機構について

    万が一、弊社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があります。


    2. クーリング・オフについて

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回（クーリング・オフ）することができます。


    3. 告知義務について

    ご契約時に健康状態等を正確に伝える義務があります。事実に反する告知をした場合、契約が解除されたり、保険金や給付金が支払われなかったりすることがあります。


    4. 個別相談の制限について

    弊社は保険制度の一般的な解説や教育的な案内は行いますが、個別の税務相談や医療的な助言は行いません。税金に関する詳細は管轄の税務署または税理士にご確認ください。


    5. 苦情および紛争の解決

    苦情や不正疑義には迅速かつ誠実に対応します。必要に応じて、生命保険協会の生命保険相談所と連携し、公正な解決を図ります。'
