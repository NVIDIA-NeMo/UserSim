- id: 4dc2ab0b-35c8-5daa-87b7-a100209afbbc
  title: こもれび医療保険：金利・料率の決まり方と適用
  body: 「こもれび医療保険」の保険料（料率）は、加入者の年齢および統計的なリスクに基づき適正に設定されています。長期的に持続可能な保障を提供することを最優先とし、公平なプラン維持と運営コストの回収を目的に算出しております。個別の保険料例として、月額2,480円などの設定がございますが、最終的な適用料率は、告知内容に基づくリスク判定および加入時の年齢によって決定されます。
