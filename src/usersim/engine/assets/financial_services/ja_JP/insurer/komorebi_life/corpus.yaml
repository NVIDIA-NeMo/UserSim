- id: f957984e-f7ae-5dd5-9062-5355d4506211
  title: こもれび終身保険（低解約返戻金型）：低解約返戻金期間中の解約返戻金の水準について
  body: '【質問】

    低解約返戻金期間中に解約した場合、どのくらいのお金が戻ってきますか？


    【回答】

    「こもれび終身保険（低解約返戻金型）」では、保険料を抑えるために、一定期間（低解約返戻金期間）の解約返戻金を低く設定しております。この期間中に解約された場合、解約返戻金の水準は、標準的な終身保険の70%となります。


    このため、短期間で解約されると、支払った保険料よりも大幅に少ない金額しか戻ってこない可能性が高くなります。将来の保障と貯蓄を目的とした長期的なプランであることをご理解の上、ご検討ください。'
  domain: insurance
  product_category: shushin_hoken
