- id: 1104312f-312b-5e43-a506-16175805754e
  title: こもれび終身保険（低解約返戻金型）：リスクについてのご説明
  body: '本商品にご加入にあたり、以下の重要なリスクについて十分にご理解ください。


    【解約返戻金に関するリスク】

    本プランは低解約返戻金型です。低解約返戻金期間中に解約された場合、解約返戻金は標準的な解約返戻金の70%となります。このため、早期に解約される場合は、払い込んだ保険料を下回る可能性があります。


    【告知義務について】

    ご契約時の健康状態などの「告知義務」に違反し、事実と異なる告知をされた場合、保険金・給付金が支払われない、または契約が解除されるリスクがあります。


    【クーリング・オフ】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。安心で誠実な保障を提供するため、これらの事項を十分にご確認ください。'
