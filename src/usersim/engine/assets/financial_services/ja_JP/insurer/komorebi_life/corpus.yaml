- id: 784c4983-dc89-5c7a-97db-bad8586f0201
  title: こもれび個人年金保険：お取引が拒否された・制限された
  body: '【症状】

    受取人の変更や解約など、契約内容を変更する手続きが拒否される、または制限されている。


    【考えられる原因】

    ・本人認証書類（運転免許証やマイナンバーカード等）の有効期限が切れている。

    ・ご提示いただいた契約者番号と登録情報が一致していない。


    【対処法】

    1. 最新の本人確認書類を再度ご提示いただき、再認証を行ってください。

    2. 登録されている住所や電話番号に変更がある場合は、まず連絡先情報の更新手続きを行ってください。


    【エスカレーション】

    本人確認が困難な場合や、不正利用の疑いがある場合は、コンプライアンス部門および専門部署へ案件をエスカレーションし、厳格な調査を実施した上で改めて回答いたします。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 558ebcac-6954-5a37-baf4-e56d56f168f8
  title: こもれび個人年金保険：切替えや上位プランを検討するとき
  body: 老後の資金確保を最優先される場合は、受取開始年齢65歳、受取期間10年と明確な設計の「こもれび個人年金保険」が適しています。一方で、生涯にわたる保障と万一の備えを重視される場合は、「こもれび終身保険（低解約返戻金型）」への切り替えが有効です。お客様のライフステージとリスク許容度に基づき、最適なプランをご提案ください。
  domain: insurance
  product_category: kojin_nenkin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 706eb211-7edf-5867-91bc-b452271149b1
  title: こもれび個人年金保険：ほかの選択肢との比較と向かない場合
  body: '【資産形成の選択肢】

    ・新NISA（つみたて投資枠・成長投資枠）：運用効率を重視し、柔軟に資産を管理したい方向けです。

    ・こもれび個人年金保険：65歳からの年金受取を確定させ、老後の不安を解消したい方向けです。例えば、月々10,000円の保険料で計画的に積み立てが可能です。


    【向かないケース】

    ・短期間での解約を想定されている方：解約返戻金が支払われるまで時間がかかり、運用期間が短い場合は元本を割り込む可能性があります。

    ・極めて高い流動性を求める方：定額の年金形式で受け取る設計であるため、随時自由に引き出したいニーズには適しておりません。


    目的が「資産運用」か「老後の確実な保障」かを見極めてご検討ください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: da54fc33-f36f-563c-98c7-24314ff630db
  title: こもれび個人年金保険：手数料と費用
  body: 'Q：このプランに手数料はかかりますか？


    A：公平なプラン維持と運営コスト回収のため、契約者貸付の手数料や一部の事務手数料を設定しております。これらの根拠は明確に提示しており、持続可能な保障を提供するための適正な設定となっております。詳細は「こもれび個人年金保険：手数料一覧」をご確認ください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 06b00a3e-6495-5e3d-9fa7-85875726769e
  title: こもれび個人年金保険：よくあるお手続きの流れ
  body: '年金受取人の変更など、契約内容を変更する際の一般的な流れをご案内します。


    1. 変更希望の内容をお伝えいただき、あわせて本人確認書類と契約者番号をご提示ください。

    2. 当社にて厳格な本人認証を実施し、認証完了を確認いたします。

    3. 新しい受取人の氏名、生年月日、続柄などの必要情報を正確にお伝えください。

    4. 変更内容を確認後、手続きを完了いたします。完了後、変更内容を記載した書面がご自宅に届きます。


    機密情報を扱うため、認証完了まで手続きの実行は行われません。あらかじめご了承ください。お手続きに際しての注意事項は「こもれび個人年金保険：限度額・制限と注意事項」をご参照ください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: e06b6b1c-e461-5966-a93a-2b8e4b3e6c3d
  title: こもれび個人年金保険：明細や記録と合わない
  body: '【症状】

    お客様が管理されている保険料の払込記録と、当社が発行した明細の金額や回数が一致しない。


    【確認手順】

    1. まず、お振込日と当社への入金反映日のタイムラグ（銀行営業日の影響）がないかをご確認ください。

    2. 契約者番号に誤りがないか、また別のプラン（例：こもれび定期保険）への振込になっていないかを確認します。

    3. 振込明細書などの客観的な証憑をご提示いただき、入金履歴を再照会します。


    【解決策】

    入金確認漏れが判明した場合は、速やかに正しい記録へ修正いたします。


    【エスカレーション】

    原因が特定できない場合や、複雑な計算差異がある場合は、専門部署へエスカレーションし、精緻な調査を行った上で回答いたします。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 05d108bb-f93d-5a18-9524-9e9597ec3858
  title: 手数料・料金のご案内
  body: こもれび生命では、リスクと年齢に基づいた適正な保険料を設定し、持続可能な保障を提供しております。契約者貸付の手数料や事務手数料は、公平なプラン維持と運営コスト回収のために設定されており、その根拠を明確に提示いたします。個別の商品に関する詳細な費用については、各商品の手数料一覧をご参照ください。
  domain: insurance
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 6786c5d5-55bf-51c0-97e2-756705609461
  title: よくあるご質問
  body: '【お問い合わせ方法について】

    ウェブサイト、お電話、または担当エージェントにて承っております。


    【苦情や紛争の解決について】

    誠実かつ迅速な解決に努めるとともに、生命保険協会の生命保険相談所と連携して対応いたします。


    【お手続きについて】

    契約内容の変更などは、本人確認完了後に担当者が承ります。詳細は「法令・制度に関するご案内：生命保険・医療保険」をご確認ください。'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 5afcc4f4-16e7-50dc-bdba-6247b9efc55a
  title: 法令・制度に関するご案内：生命保険・医療保険
  body: '当社は金融庁の監督および保険業法を厳格に遵守しております。万一の際にも、生命保険契約者保護機構により責任準備金等の90%まで補償される旨をご案内いたします。


    また、お客様の権利保護のため、以下の事項を徹底しております。

    ・クーリング・オフ：申込日または書面受取日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。

    ・告知義務：契約時に健康状態等を正しく伝える義務がございます。告知義務違反があった場合、契約解除や保険金・給付金が支払われないリスクがあることを十分にご理解ください。'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: ab022f2d-5b88-58a4-94de-e48479719d96
  title: request_policy_loan を使う場面
  body: 'お客様が解約返戻金の範囲内で一時的な資金調達を希望される場合に、契約者貸付の手続きを行います。


    【手続き手順】

    1. verify_identity を用い、契約者の本人認証を厳格に行います。

    2. get_accounts を使用し、お客様の契約番号（account_id）を特定します。

    3. 貸付可能額（解約返戻金の一定範囲内）を算出し、お客様に提示します。

    4. お客様から借入希望金額の承諾を得た後、request_policy_loan を実行して貸付を申し込みます。'
