  institution_id: komorebi_life
- id: 692d3424-ebf2-5e87-acbd-1a318e0de646
  title: こもれび定期保険：お申込みとご利用開始
  body: 'こもれび定期保険のお申込みから保障開始までの手順をご案内します。


    【ご準備いただくもの】

    ・ご本人様の確認情報（フルネームと生年月日）

    ・保険料のお支払い口座またはクレジットカード情報


    【お手続きの流れ】

    1. 本人確認：まず、お客様のフルネームと生年月日を確認し、ご本人様であることを確認させていただきます。

    2. プランの決定：ご希望の保険金額（例：30,000,000円など）と、保険期間（10年）を確認し、プランを決定します。

    3. 告知事項の回答：現在の健康状態について正確にお伝えいただく「告知義務」の手続きを行います。事実に反する告知をした場合、契約解除や保険金が支払われないことがありますのでご注意ください。

    4. お支払い方法の登録：月払保険料（例：3,150円）のお支払い方法を登録します。

    5. 契約内容の確認：保険会社にて審査を行い、承諾となった後、契約内容を記載した書面をお送りします。


    書面をお受け取りになり、内容に同意いただけましたら保障が開始されます。なお、申込日または書面受取日のいずれか遅い日から8日以内であれば、クーリング・オフによる申し込みの撤回が可能です。'
  domain: insurance
  product_category: teiki_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 8716f152-1eb2-523a-8108-223fb0589808
  title: こもれび定期保険：手数料一覧
  body: 'こもれび定期保険の費用体系をご案内します。本商品は合理的かつ透明性の高い保険料体系を採用しております。


    【保険料】

    ・月払保険料：プラン内容（年齢、性別、保障額、期間）に応じて設定されます。

    （例：30歳男性、保険期間10年、保険金額30,000,000円の場合、月額3,150円）


    【その他の費用】

    ・契約手数料：0円

    ・プラン変更手数料：0円

    ・解約手数料：0円


    本商品は「掛け捨て型」のプランであるため、運用による貯蓄性はございませんが、その分、加入時のコストを最小限に抑えた適正価格で提供しております。'
  domain: insurance
  product_category: teiki_hoken
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 3832ed6d-351f-5798-a9d1-c4a0df6cc240
  title: こもれび定期保険：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、保留状態となっている場合に考えられる原因と対処法をご案内します。


    【よくある原因と確認事項】

    1. 告知事項の回答漏れ

    健康状態に関する質問にすべて回答されていますか。一部でも未回答がある場合、審査に進めず保留となります。すべての項目に正確に回答してください。


    2. 本人確認情報の不一致

    ご提示いただいたフルネームと生年月日が、ご登録情報と一致していない可能性があります。正しい情報であるか再度ご確認ください。


    3. お支払い情報の不備

    クレジットカードの有効期限切れや、口座情報の入力誤りがある場合、手続きが完了しません。


    【解決しない場合の対応】

    上記を確認しても解決しない場合は、当社のコンプライアンス部門および審査担当にて詳細を確認いたします。状況を確認し、不足している書類や情報の案内を速やかに行います。通常、営業日3日以内に進捗をご連絡いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: f6cc6bf8-9363-526f-983d-83b56b9c471f
  title: こもれび定期保険：お申込みいただける方
  body: 'こもれび定期保険のお申込み条件は以下の通りです。


    | 条件項目 | 基準・しきい値 | 判定結果 |

    | :--- | :--- | :--- |

    | 契約年齢 | 70歳以下 | お申込みいただけます |

    | 契約年齢 | 71歳以上 | お申込みいただけません |

    | 健康状態 | 告知義務に基づき適正な告知が行われた方 | 審査後にご契約いただけます |

    | 本人確認 | フルネームと生年月日の確認が完了した方 | お手続きが可能です |'
