- id: eaf2dc0d-9ea1-5490-9a9e-46cd082bf273
  title: こもれび終身保険（低解約返戻金型）：切替えや上位プランを検討するとき
  body: 'お客様が保障内容の変更を検討される際は、以下の視点からご提案ください。


    【定期保険との比較】

    「こもれび定期保険：商品概要」で提供しているプランは、必要な期間だけ効率的に大きな保障を確保するものです。一方、本商品は生涯にわたる保障と資産形成を目的としています。


    【切替えの判断基準】

    ・教育資金など、特定の期間のみ高額な保障が必要な場合は定期保険が適しています。

    ・葬儀費用や相続対策として、一生涯の保障を確保したい場合は、本商品（終身保険）の継続を推奨します。


    【注意点】

    本商品から他のプランへ切り替える際、低解約返戻金期間内である場合は、解約返戻金が70%水準となるため、資産的な損失が発生する可能性があることを必ずお伝えください。'
