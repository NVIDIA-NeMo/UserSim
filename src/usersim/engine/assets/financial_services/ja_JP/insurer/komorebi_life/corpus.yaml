- id: 349999dd-e887-57d0-ba38-dcdcbc7f5515
  title: こもれびがん保険：お取引が拒否された・制限された
  body: '受取人の変更や契約内容の変更手続きにおいて、お取引が拒否または制限される場合がございます。


    【考えられる原因】

    ・本人確認書類の不備、または有効期限切れにより認証が完了していない。

    ・保険料の未納により、契約が失効または制限状態にある。

    ・提出された書類の内容に矛盾があり、コンプライアンス部門による確認が必要な状態である。


    【解決策】

    最新の本人確認書類を再度ご提示ください。また、未納分がある場合は速やかにお支払い手続きをお願いいたします。


    【エスカレーション】

    書類に不備がないにもかかわらず制限が解除されない場合は、専門部署およびコンプライアンス部門にて厳格な調査を行い、結果をご案内いたします。'
