  title: こもれび医療保険：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが「保留中」となり、完了しない場合の確認事項をご案内いたします。


    【考えられる原因と対処法】

    1. 本人確認書類の不備：ご提出いただいた書類の記載内容や有効期限に不備がある場合がございます。改めて最新の本人確認書類をご提示ください。

    2. 告知内容の確認事項：ご回答いただいた健康状態について、詳細な確認が必要な場合がございます。弊社担当者からの追加質問にご回答をお願いいたします。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、弊社コンプライアンス部門および専門部署にて厳格な審査を行います。審査完了後、結果を速やかにお知らせいたします。'
