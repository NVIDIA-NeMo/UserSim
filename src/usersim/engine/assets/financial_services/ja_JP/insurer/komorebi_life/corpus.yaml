- id: b1de9d10-d97c-54e0-9dc3-a948e8280a62
  title: こもれび定期保険：解約・変更・プランの切替え
  body: 'ご契約内容の変更や解約をご希望される際は、以下の手順でお手続きください。


    1. 手続き内容の提示：担当エージェントまたは電話窓口にて、解約または変更（受取人の変更など）の意向をお伝えいただき、契約者番号をご提示ください。

    2. 本人確認：ご本人様確認書類をご提示いただき、厳格な本人認証を行います。

    3. 内容の確認：変更後のプラン内容や、解約に伴う手続きについて詳細をご案内します。あわせて、書面受取後8日以内のクーリング・オフ権利についても改めてご案内いたします。

    4. 完了通知：手続きが完了した後、書面または電子通知にて確定内容をお送りいたします。


    プランの切替えをご検討の方は、現在の保障範囲とリスク許容度を改めてご確認いただき、客観的なデータに基づいた最適なご提案をさせていただきます。'
  domain: insurance
  product_category: teiki_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 94e27447-b268-595e-b92f-d118dd744455
  title: こもれび定期保険：想定外の手数料・金額
  body: 'お客さまから「想定していた金額と異なる」とのご指摘を受けた際の対応手順です。


    【症状】

    保険料の金額や、契約者貸付に伴う手数料、事務手数料について、不整合があると感じられる。


    【確認事項と対策】

    1. 根拠の提示：保険料はリスクと年齢に基づき適正に設定されています。まず、ご契約時のプラン内容と、手数料設定の根拠（運営コストの回収等）を明確に提示し、公平なプラン維持のためであることをご説明ください。

    2. 誤認の確認：告知義務違反等による影響がないか、契約内容を再確認します。


    【エスカレーション】

    誠実な説明を行っても解決に至らない場合や、強い不満がある場合は、速やかに専門部署およびコンプライアンス部門へエスカレーションし、生命保険協会の生命保険相談所と連携して解決を図ります。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 5c0c9108-88a6-544d-8c6f-f8fb20575c95
  title: こもれび定期保険：必要書類
  body: 'お手続き内容に応じて、以下の書類が必要となります。


    ・新規お申込み：本人確認書類、健康状態に関する告知書

    ・ご契約内容の変更（受取人変更等）：本人確認書類、契約者番号が確認できる書類

    ・ご解約手続き：本人確認書類、契約者番号、保険証券（原本または写し）


    ※すべてのお手続きにおいて、厳格な本人認証が完了するまで情報の開示や実行は行われません。'
