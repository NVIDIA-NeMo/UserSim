  body: 'こもれび医療保険にお申込みいただける条件は以下の通りです。


    | 条件 | 内容・基準 | 結果 |

    | :--- | :--- | :--- |

    | 本人確認 | フルネームと生年月日の提示 | 確認完了後、手続き可能 |

    | 告知義務 | 現在の健康状態を正確に告知すること | 承諾後、契約可能 |

    | 告知義務違反 | 事実に反する告知をした場合 | 契約解除または給付金不払い |

    | 年齢 | 商品規定の加入可能年齢であること | 審査後、加入可能 |


    ※健康状態などの告知内容により、ご加入いただけない場合や、特定の部位を保障対象外とする「部位不担保」などの条件が付く場合がございます。'
