  institution_id: komorebi_life
- id: 368d1951-4408-59cd-a1be-8351b7c06f9c
  title: こもれび医療保険：規定・約款
  body: '「こもれび医療保険」のご契約にあたり、以下の規定および約款が適用されます。本規定は、公正な取引と誠実な保障提供を目的としています。


    1. 告知義務について

    ご契約時に、健康状態などの重要な事項を正確に伝える義務があります。事実に反する告知をした場合、保険業法および内部規定に基づき、ご契約の解除や、保険金・給付金が支払われないことがあります。


    2. 給付金の支払条件と限度額

    ・入院給付金：入院日額10,000円を支払います。ただし、1回の入院における支払限度日数は60日までとします。

    ・通算限度：入院給付金の通算支払限度日数は1,095日までです。

    ・手術給付金：入院中の手術は100,000円、外来の手術は50,000円を支払います。

    ・先進医療：先進医療給付金は、通算限度額20,000,000円まで保障します。


    3. クーリング・オフ

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回いただけます。


    4. 解約および変更

    ご契約者はいつでも解約いただけます。また、所定の手続きを経て受取人の変更が可能です。詳細な手続きは、カスタマーセンターにてご案内いたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 2e310cbc-9748-5e7d-8bde-887f1402628f
  title: こもれび医療保険：おすすめの方と主な使い方
  body: '「こもれび医療保険」は、公的医療保険制度（高額療養費制度など）でカバーしきれない自己負担分を補い、入院や手術への不安を軽減するためのプランです。


    【このような方におすすめです】

    ・シンプルで分かりやすい保障内容を重視される方

    ・急な入院や手術にかかる費用を、合理的かつ透明性の高い保険料で準備したい方

    ・先進医療などの高額な治療に備えたい方


    【保障内容のポイント】

    ・入院時の安心：入院給付金日額10,000円を支給します（1回の入院につき最大60日まで）。

    ・手術への備え：入院中の手術には100,000円、外来での手術には50,000円を支給します。

    ・高度な治療への対応：先進医療給付金として、通算20,000,000円まで幅広くカバーします。


    【保険料の例】

    35歳女性（終身払）の場合、月払保険料は2,480円となります。お客さまの年齢やプラン内容に応じた適正価格で、将来の安心を提供します。


    公的医療保険の「高額療養費制度」により、所得に応じた月ごとの自己負担上限が設けられていますが（2026年8月診療分からは年間上限も適用）、差額ベッド代や食事代などは全額自己負担となります。本プランを併用することで、より安心なライフプランニングが可能です。'
  domain: insurance
  product_category: iryo_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 848813ec-ece8-59dd-95ad-e7661da5ad07
  title: こもれび医療保険：1回の入院の支払限度日数について
  body: '【質問】1回の入院で、最大で何日分まで給付金を受け取ることができますか？


    【回答】「こもれび医療保険」では、1回の入院に対する支払限度日数を60日と定めております。そのため、入院日額10,000円のご契約の場合、1回の入院につき最大で600,000円（10,000円
    × 60日）まで給付金をお支払いいたします。


    なお、入院期間が60日を超えた場合は、その回における給付金の支払いは終了となります。また、生涯を通じて受け取れる入院給付金の合計日数には「通算支払限度日数」という制限がございます。詳細は「こもれび医療保険：規定・約款」をご確認ください。'
  domain: insurance
  product_category: iryo_hoken
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 48727be5-5197-5bb8-bfa4-cd323b4909c1
  title: こもれび医療保険：解約・変更・プランの切替え
  body: '「こもれび医療保険」のご契約内容の変更、または解約をご希望される際の手順をご案内します。


    【ご準備いただくもの】

    ・ご契約者さまご本人によるお問い合わせ（フルネームと生年月日のご提示が必要です）


    【お手続きの流れ】

    1. カスタマーセンターへ変更または解約の意向をお伝えください。

    2. お客さまのフルネームと生年月日を確認し、本人確認を完了させます。

    3. 具体的な変更内容（受取人の変更など）または解約の理由を確認させていただきます。

    4. 変更後のプラン内容や、解約に伴う手続きについてご案内します。プランの切替えを行う場合は、改めて告知義務（健康状態の確認）が必要となる場合がございますのでご注意ください。

    5. 内容にご合意いただいた後、当社にて手続きを完了させ、結果を通知いたします。


    【ご注意点】

    ・解約された場合、それまでの保障はすべて終了いたします。

    ・プランの切替えにあたり、新たな告知内容によっては、ご希望の保障内容で承れない場合がございます。


    誠実な対応を心がけ、お客さまの意向に基づいた最適なプランニングをサポートいたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 26eab404-dad0-5743-b6e5-f2451e874308
  title: こもれび医療保険：想定外の手数料・金額
  body: 'お客さまより「請求した給付金が想定していた金額より少ない」などのご相談をいただいた際の確認事項です。


    【想定される原因】

    1. 支払限度日数の超過

    1回の入院で60日を超えて入院された場合、61日目以降の入院給付金は支払われません。そのため、入院日数分すべてが支給されないことがあります。


    2. 通算支払限度日数の到達

    生涯の入院給付金支払日数が合計で1,095日に達している場合、それ以上の支払いは行われません。


    3. 告知義務違反による制限

    ご契約時の告知内容と事実に相違があった場合、規定に基づき給付金の一部または全部が支払われないことがあります。


    【対応手順】

    ・まずはお客さまのご入院期間と、これまでの累計支払日数を確認します。

    ・約款の限度額（1回60日、通算1,095日）に照らして計算結果が正しいか照合します。

    ・もし計算に不備がある場合や、告知義務に関する複雑な判断が必要な場合は、速やかに専門のコンプライアンス部門へエスカレーションし、透明性のある解決を図ります。'
  domain: insurance
  product_category: iryo_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: baa7b308-fda3-502e-bbff-3830271ccbe5
  title: こもれび医療保険：必要書類
  body: '「こもれび医療保険」の給付金請求にあたり、状況に応じて以下の書類が必要となります。


    | 請求内容 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | 入院給付金の請求 | 入院医療機関が発行する診断書 | 入院期間および病名を確認します |

    | 手術給付金の請求 | 手術証明書または診断書 | 手術名および手術日を確認します |

    | 先進医療給付金の請求 | 先進医療に係る診療明細書・領収書 | 治療内容と費用を確認します |

    | 受取人の変更 | 変更申請書、本人確認書類 | ご契約者本人の申請が必要です |'
