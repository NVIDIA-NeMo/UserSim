  title: こもれび個人年金保険：当社の似た商品との比較
  body: '老後の備えとして、「こもれび個人年金保険」と「こもれび終身保険（低解約返戻金型）」を比較します。


    ・こもれび個人年金保険：65歳から10年間の受取など、計画的な資産形成を目的とします（返戻率例：108%）。老後の生活費を確保したい方に最適です。

    ・こもれび終身保険（低解約返戻金型）：生涯にわたる保障を目的としたプランです。万が一の備えと貯蓄を両立させたい方に適しています。


    目的が「資産形成」であれば個人年金保険を、「生涯の保障」であれば終身保険をお選びください。詳細は「こもれび終身保険（低解約返戻金型）：商品概要」をご覧ください。'
