- id: 9e3496c2-c840-5540-845f-1ba067fa2f8d
  title: こもれび終身保険（低解約返戻金型）：登録内容の変更
  body: 'ご契約内容やご登録情報の変更手続きについてご案内します。


    【お手続きの流れ】


    1. 本人確認

    まず、お客様のフルネームと生年月日をお伺いし、ご本人様であることを確認させていただきます。


    2. 変更内容の提示

    変更したい内容（住所、氏名、受取人の変更など）を具体的にお伝えください。


    3. 内容の確認と審査

    弊社にて変更内容を確認します。受取人の変更など、一部の手続きでは追加の書類が必要になる場合がございます。その際は、弊社より必要書類をご案内します。


    4. 完了通知の受領

    お手続きが完了しましたら、弊社より変更内容を記載した書面または電磁的記録にて通知いたします。


    【ご注意事項】

    ・クレジットカードの変更などの際、弊社からクレジットカード番号や暗証番号を直接お伺いすることはありません。専用の安全な手続き方法をご案内します。

    ・受取人の変更などの重要な手続きは、内部規定に基づき適切に処理し、公正な取引を徹底しております。'
