- id: 0e01925e-4af0-5a0b-b552-6b3054f48b1c
  title: こもれび終身保険（低解約返戻金型）：お取引が拒否された・制限された
  body: '【症状】

    受取人の変更手続きや、契約者貸付の申請を行った際に、手続きが拒否された、あるいは制限がかかった。


    【考えられる原因】

    1. 本人確認書類の不備または有効期限切れ。

    2. 契約者番号と登録情報の不一致。

    3. 告知義務違反による契約解除手続き中であるため、状態変更がロックされている。


    【対応策】

    ・最新の本人確認書類（運転免許証やマイナンバーカード等）を改めてご提示ください。

    ・登録されているご連絡先が最新であるかを確認し、必要に応じて更新手続きを行ってください。


    【エスカレーション】

    本人確認が完了しても制限が解除されない場合、またはコンプライアンス上の理由で制限されている場合は、専門部署およびコンプライアンス部門にて詳細な調査を行い、結果をご案内いたします。'
