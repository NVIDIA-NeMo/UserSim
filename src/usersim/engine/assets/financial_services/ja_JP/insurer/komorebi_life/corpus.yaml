- id: e513747e-20e6-5f1a-9ae0-65c9c7ff0e38
  title: こもれび個人年金保険：解約・変更・プランの切替え
  body: 'ご契約内容の変更や解約をご希望される場合は、以下の手順でお手続きを進めてください。


    【お手続きに必要なもの】

    ・ご本人確認書類（運転免許証やマイナンバーカードなど）

    ・保険証券（お手元にある場合）

    ・解約返戻金などの受取先となる口座情報


    【お手続きの流れ】

    1. 本人確認を行います。お客さまの「フルネーム」と「生年月日」をお伝えください。

    2. 変更または解約の内容を具体的にお伝えください（例：「プランを切り替えたい」「全額解約したい」など）。

    3. 当社より、お手続きに必要な書類をご案内いたします。案内に従って書類をご提出ください。

    4. 書類の内容を確認し、手続きが完了したことをお知らせいたします。


    【ご注意事項】

    ・解約される場合、解約返戻金が支払われますが、加入期間が短い場合は、払い込んだ保険料の合計額を下回る場合があります。

    ・プランの切替えをご希望の場合、改めて告知義務が発生し、審査の結果、お引き受けできない場合や条件が変わる場合がございます。


    お手続きに関してご不明な点がある場合は、いつでもカスタマーセンターまでお問い合わせください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 08ab2590-ceaf-56d1-b3e1-bf9e1edc3e9a
  title: こもれび個人年金保険：想定外の手数料・金額
  body: '「解約返戻金の金額が予想より少ない」「想定していた金額と異なる」といったお問い合わせへの対応指針です。


    【よくある原因とチェック項目】

    1. 早期解約による影響

    本商品は長期的な資産形成を目的としています。契約から短期間で解約された場合、運用コストや保険会社の運営経費が差し引かれるため、解約返戻金が払い込んだ保険料の合計を下回ることがあります。契約時の「解約返戻金」の例を改めてご確認ください。


    2. 告知義務違反による影響

    告知内容に不備があり、契約解除となった場合は、規定に基づき返戻金の額が変動したり、支払われないケースがあります。


    3. 運用実績の変動

    返戻率の例（108%）はあくまで例であり、実際の運用成果や契約条件によって変動します。


    【対応フロー】

    ・まず、お客さまがどの時点での金額を想定されていたか（例：パンフレットの例、概算提示など）を確認します。

    ・計算根拠となる約款の規定を丁寧に説明し、納得いただけない場合は、速やかに専門のコンプライアンス部門へエスカレーションしてください。


    お客さまの不利益を最小限に抑えるため、透明性のある解決プロセスを提供し、誠実に対応いたします。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
