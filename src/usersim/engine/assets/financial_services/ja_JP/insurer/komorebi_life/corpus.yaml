- id: 2a90bd5c-84d2-5664-81de-f12b8ce10e79
  title: こもれび定期保険：ご紹介・継続利用の特典
  body: こもれび定期保険では、大切な方へのご紹介や、ライフステージに合わせた継続的なプラン見直しをいただくことで、将来の不安を解消するお手伝いをいたします。誠実な保障を提供し続けるパートナーとして、お客様のご要望に寄り添った最適なサポートをご提案させていただきます。詳細は担当エージェントまでお問い合わせください。
