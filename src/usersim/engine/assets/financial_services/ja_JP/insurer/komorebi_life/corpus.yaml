- id: e9c87e33-ed99-5467-bdfd-d3bbd30ee83f
  title: こもれび個人年金保険：規定・約款
  body: '本保険の契約および運用に関する規定は以下の通りです。担当エージェントは、お客様へ案内する際、これらの条件を正確に伝えてください。


    1. 給付条件：年金の受取開始年齢は65歳とし、受取期間は10年と定めます。

    2. 告知義務：契約時に健康状態等を正しく伝える義務があり、告知義務違反があった場合、契約解除や保険金・給付金が支払われないことがあります。

    3. クーリング・オフ：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。

    4. 契約者貸付および手数料：公平なプラン維持と運営コスト回収のため、所定の手数料を設定しております。その根拠は明確に提示いたします。

    5. 契約の終了：受取期間である10年の経過、または解約によって契約は終了します。'
