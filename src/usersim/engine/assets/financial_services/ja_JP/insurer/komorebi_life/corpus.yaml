  title: こもれび終身保険（低解約返戻金型）：ご紹介・継続利用の特典
  body: 大切な方へ安心を広めていただけるよう、こもれび終身保険（低解約返戻金型）のご紹介キャンペーンを実施しております。例えば、5,000,000円の大きな保障を無理なく準備できる本プランを、ご友人やご親族にご紹介ください。誠実な保障を次世代へ繋ぐパートナーとして、皆様の継続的なご利用とご紹介を心よりお待ちしております。
