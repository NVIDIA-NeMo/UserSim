  title: こもれび終身保険（低解約返戻金型）：安全にご利用いただくためのポイント
  body: お客様の資産と情報を守るため、以下の点にご注意ください。受取人の変更や契約内容の変更など、契約状態を変化させる全ての手続きの前には、必ず本人確認書類および契約者番号を用いた厳格な本人認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行は一切行いません。弊社担当者が突然、電話やメールで暗証番号や機密情報を求めることはございません。不審な連絡があった場合は、速やかに弊社コンプライアンス部門までお知らせください。
