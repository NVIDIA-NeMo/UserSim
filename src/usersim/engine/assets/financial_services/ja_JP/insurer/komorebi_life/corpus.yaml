- id: 7c02543b-0e9a-55c9-a5e2-d7e430c62102
  title: こもれび個人年金保険：ログインできない・アクセスできない
  body: 'Webチャットやお客様専用ページにログインできない、またはアクセスできない場合の対処法をご案内します。


    【よくある症状と原因】

    ・「IDまたはパスワードが正しくありません」と表示される → 入力ミス、またはパスワードの有効期限切れの可能性があります。

    ・画面が白くなって読み込まれない → 通信環境の不安定さや、ブラウザのキャッシュの問題が考えられます。

    ・アカウントがロックされている → 短時間に何度も誤ったパスワードを入力した可能性があります。


    【確認と解決の手順】

    1. 入力内容の再確認：半角英数字であるか、大文字・小文字が正しく入力されているかを確認し、再度お試しください。

    2. 通信環境の確認：Wi-Fiのオン・オフを切り替えるか、別の通信回線でアクセスできるかをご確認ください。

    3. パスワードのリセット：解決しない場合は、担当者に「ログインできない」旨をお伝えください。ご本人確認（フルネームと生年月日）の後、パスワードのリセット手続きを行います。


    【解決しない場合（エスカレーション）】

    上記を試しても解決しない場合や、身に覚えのないログイン試行がある場合は、速やかに専門のコンプライアンス部門へエスカレーションいたします。調査後、状況と対策について改めてご連絡を差し上げます。'
