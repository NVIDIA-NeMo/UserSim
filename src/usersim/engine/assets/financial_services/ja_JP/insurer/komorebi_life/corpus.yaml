  body: '「こもれびがん保険」の適用にあたり、以下の制限と注意事項を必ずご確認ください。


    【待ち期間について】

    本商品には90日の待ち期間が設けられています。ご契約から90日以内にがんと診断された場合は、保障の対象外となり、保険金・給付金は支払われませんのでご注意ください。


    【給付額の限度】

    ・がん診断一時金：1,000,000円

    ・がん治療給付金（月額）：100,000円


    【重要事項】

    ご契約時の告知義務に違反し、事実と異なる告知をした場合、保険業法に基づき契約解除となるリスクがございます。また、書面受取後8日以内であればクーリング・オフが可能です。詳細は「こもれびがん保険：重要事項のご説明」をご確認ください。'
