  body: '【ご紹介キャンペーンのご案内】


    こもれび生命では、より多くの方に安心をお届けするため、ご紹介キャンペーンを実施しております。


    ■特典内容

    ご友人やご家族の方に「こもれびがん保険」をご紹介いただき、新たに契約が成立した場合、ご紹介者様とご成約者様それぞれに、Amazonギフトカード5,000円分をプレゼントいたします。


    ■キャンペーン期間

    2024年11月1日から2025年1月31日まで


    ■適用条件

    ・本プランへの新規ご加入であること

    ・契約後のクーリング・オフ（8日以内の申込み撤回）が適用されていないこと


    大切な方への安心の提案とともに、ぜひ本特典をご活用ください。'
