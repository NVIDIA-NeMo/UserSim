- id: 7e369d5a-c741-5727-9370-89e1a52425c9
  title: こもれびがん保険：リスクについてのご説明
  body: 'こもれびがん保険のご契約にあたり、以下のリスクを十分にご理解ください。


    【告知義務違反のリスク】

    ご契約時の健康状態について正しく告知しなかった場合、告知義務違反となり、契約解除や保険金・給付金が支払われないことがあります。


    【待ち期間について】

    本保険には90日の待ち期間があります。この期間中にがんと診断された場合は、保障の対象外となり、給付金は支払われません。


    【クーリング・オフについて】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。


    【補償限度】

    本商品は生命保険契約者保護機構の制度に基づき、責任準備金等の90%まで補償されます。'
