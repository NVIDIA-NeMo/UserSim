- id: a71e5cd0-b002-5377-bdee-c160771a1de1
  title: こもれび終身保険（低解約返戻金型）：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが「保留中」となり、完了しない場合は以下の点をご確認ください。


    【考えられる原因と対策】

    ・本人確認書類の不備：提出された書類の有効期限が切れているか、画像が不鮮明な可能性があります。最新の書類を再度ご提示ください。

    ・告知事項の不足：健康状態に関する回答に不足がある場合、確認のため保留となります。追加の質問事項にお答えください。


    【解決しない場合】

    上記を確認しても解決しない場合は、専門部署およびコンプライアンス部門へエスカレーションし、詳細な審査を行います。審査状況については、担当エージェントより順次ご連絡いたします。'
