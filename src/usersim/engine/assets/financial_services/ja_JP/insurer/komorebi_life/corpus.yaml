- id: b1de9d10-d97c-54e0-9dc3-a948e8280a62
  title: こもれび定期保険：解約・変更・プランの切替え
  body: '「こもれび定期保険」の解約、契約内容の変更、または他プランへの切替えをご希望される際の手順をご案内します。


    【お手続き前にご用意いただくもの】

    ・ご契約者さまのご本人確認ができる情報（フルネーム、生年月日）


    【お手続きの流れ】

    1. 本人確認：まず、お客様のフルネームと生年月日をお伺いし、ご本人確認を完了させます。

    2. 内容のご相談：解約のご希望か、あるいは保障額の変更やプランの切替えをご希望かをお伝えください。切替えをご希望の場合、新しいプランの保障内容と保険料をご提示します。

    3. 意向確認と手続き：内容にご納得いただけましたら、変更または解約の手続きを行います。プラン切替えの場合は、改めて告知義務に基づいた健康状態のご確認が必要となる場合があります。

    4. 完了通知：お手続きが完了しましたら、変更後の契約内容または解約完了の旨を通知いたします。


    ※本商品は掛け捨て型のため、解約による返戻金はございませんのであらかじめご了承ください。また、個別の税務上の影響については、税理士等の専門家にご相談ください。'
