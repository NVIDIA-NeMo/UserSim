  body: '「こもれびがん保険」と「こもれび医療保険」の比較です。


    ■こもれびがん保険：がんに特化し、診断時に1,000,000円の一時金でまとまった資金を確保したい方に最適です。

    ■こもれび医療保険：入院・手術など幅広く包括的な保障を求め、公的医療保険（高額療養費制度）を補完したい方に適しています。


