- id: 26eab404-dad0-5743-b6e5-f2451e874308
  title: こもれび医療保険：想定外の手数料・金額
  body: 'お客さまより「給付金額が想定より少ない」または「保険料が変更された」との問い合わせがあった場合は、以下の順で確認してください。


    【給付金額の不一致】

    ・支払限度日数の確認：1回の入院が60日を超えていないか、また通算1,095日に達していないかを確認してください。限度を超えた分は支払対象外となります。

    ・告知義務違反の有無：契約時の告知内容と実際の病歴に相違があり、支払い制限がかかっていないか確認してください。


    【保険料の変動】

    ・年齢更新のタイミング：リスクと年齢に基づき保険料を適正に設定しているため、更新時に金額が変動します。


    解決しない場合は、速やかにコンプライアンス部門へエスカレーションし、算出根拠の再提示を行ってください。'
