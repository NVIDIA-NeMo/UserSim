- id: 9316a85d-c0cb-5ebe-b50d-5543935f2557
  title: こもれび医療保険：実施中のキャンペーン
  body: '【2026年 新春安心サポートキャンペーン】


    いつもこもれび生命をご利用いただき、誠にありがとうございます。現在、既にご契約者様のお勧めにより新しく「こもれび医療保険」にご加入いただいた方を対象に、以下の特典をご提供しております。


    ■特典内容：ご紹介者様およびご加入者様へ、それぞれ 1,000円 のギフトカードを贈呈いたします。

    ■期間：2026年1月1日から2026年3月31日まで

    ■対象：期間中に「こもれび医療保険」の新規契約を完了された方


    お申し込みの際は、ご紹介者様の契約者番号を併せてお知らせください。詳細についてのご質問は、カスタマーセンター（平日9時から17時まで）にて承っております。'
