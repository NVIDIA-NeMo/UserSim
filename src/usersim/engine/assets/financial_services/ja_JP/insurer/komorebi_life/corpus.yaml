- id: 2c31ffc3-c3ad-5e73-b383-afb7c5c049bc
  title: こもれび医療保険：規定・約款の変更
  body: 'こもれび医療保険の規定および約款の変更に関する重要事項をご案内いたします。本商品は、透明性の高い商品設計を追求しており、お客様に不利益のない誠実な運用を心がけております。


    【約款変更の基準と通知】

    法令の改正や、生命保険業界の標準的な基準の変更、または保険業法に基づく監督官庁（金融庁）の指示がある場合、約款の内容を変更することがあります。変更を行う際は、事前にお客様へ書面または電磁的記録にて通知いたします。


    【保障内容の適用】

    例えば、入院給付金日額の10,000円や、1回の入院の支払限度日数（60日）、入院中の手術給付金（100,000円）などの給付基準は、ご契約時の約款に基づきます。変更後の約款が適用されるタイミングについては、個別の通知にて明確に区分して記載いたします。


    【合意と承諾】

    約款の変更についてお客様から承諾が得られない場合、または変更内容に同意いただけない場合は、規定の手続きに従って契約の取り扱いを決定いたします。


    【お問い合わせ】

    規定や約款の詳細についてご不明な点がございましたら、カスタマーセンターにて丁寧にご説明いたします。また、公正な解決を希望される場合は、生命保険協会の生命保険相談所と連携し、誠実に対応いたします。'
