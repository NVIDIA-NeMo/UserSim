- id: b45e3c31-710f-5390-80da-0edbbc06aa1a
  title: こもれびがん保険：状況・履歴の確認
  body: 'ご契約中の「こもれびがん保険」の現在の状況や、過去の保険料お支払い履歴を確認する手順をご案内します。


    【ご準備いただくもの】

    特に書類のご準備は必要ありません。ご本人様確認のため、お名前と生年月日をお伺いします。


    【確認の手順】

    1. ご本人様確認のため、フルネームと生年月日をお伝えください。

    2. 「契約状況の確認」または「お支払い履歴の確認」など、確認したい内容を具体的にお伝えください。

    3. 当社にて、現在の契約状態（有効・失効など）や、直近の保険料お支払い日、金額を確認し、回答いたします。

    4. 給付金の請求履歴がある場合は、請求日と支払完了日などの詳細についてご案内いたします。


    【完了の確認】

    担当者が口頭で、またはチャット画面にて、最新の状況を提示した時点で確認完了となります。もし、お支払い内容に心当たりがない場合や、明細と合わない点がある場合は、そのまま担当者にお申し付けください。'
  domain: insurance
  product_category: gan_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 349999dd-e887-57d0-ba38-dcdcbc7f5515
  title: こもれびがん保険：お取引が拒否された・制限された
  body: '「こもれびがん保険」の住所変更や受取人の変更などの手続きにおいて、お取引が拒否されたり、制限がかかったりする場合の対応についてご案内します。


    【考えられる原因】

    ・ご本人様確認（フルネームと生年月日の照合）が正しく完了していない。

    ・ご契約内容の変更に必要な書類が不足している、または不備がある。

    ・保険料のお支払いが滞っており、契約が「失効」状態にあるため、変更手続きが制限されている。


    【確認と解決の手順】

    1. まず、改めてご本人様のフルネームと生年月日をお伝えいただき、照合をやり直してください。

    2. お支払い状況を確認し、もし失効している場合は、まず「復活」の手続きを行う必要があります。復活に必要な条件や書類についてご案内いたします。

    3. 必要書類に不備がある場合は、具体的にどの箇所の修正が必要かをご案内しますので、改めてご提出ください。


    【解決しない場合】

    上記を確認しても制限が解除されない場合や、不正利用の疑いがある複雑な案件については、内部規定に基づき、速やかに専門のコンプライアンス部門へエスカレーションし、調査を行います。調査結果については、後日改めてご連絡いたします。'
  domain: insurance
  product_category: gan_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 322cc13d-5ec6-5ae0-a2af-9d29ec6c2159
  title: こもれびがん保険：切替えや上位プランを検討するとき
  body: 'お客様が現在のご保障を見直し、「こもれびがん保険」への切替えや、他のプランとの組み合わせを検討される際にご案内ください。


    「こもれびがん保険」は、がん診断時に1,000,000円の一時金が支払われるなど、がんに特化した手厚い保障が強みです。一方で、入院や手術全般を幅広くカバーしたい場合は、「こもれび医療保険：商品概要」でご案内しているプランが適しています。


    【選び方の目安】

    ・がん治療に伴うまとまった費用や、治療中の生活費を重点的に備えたい方 → 「こもれびがん保険」

    ・がん以外の病気やケガによる入院・手術費用を幅広く補完したい方 → 「こもれび医療保険」


    多くのお客様には、公的医療保険の高額療養費制度を補完するため、両プランを組み合わせて最適に設計することを提案いたします。お客様の意向と客観的なデータに基づき、誠実に提案してください。'
  domain: insurance
  product_category: gan_hoken
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 06c9f9b3-e01e-5511-b811-ab9dbdf77bae
  title: こもれびがん保険：ほかの選択肢との比較と向かない場合
  body: '「こもれびがん保険」は、がんという特定の疾患に対する経済的リスクを効率的にカバーするための特化型プランです。万能な保険ではないため、目的によっては他の商品が適している場合があります。


    【本商品が適している方】

    ・がん診断時にまとまった資金（1,000,000円）を確保し、治療方針の選択肢を広げたい方

    ・月々の治療給付金（100,000円）により、治療中の収入減少を補いたい方


    【本商品が向かない方・ほかの選択肢が適している方】

    ・がん以外の病気やケガによる入院費を心配される方 → 「こもれび医療保険」の方が幅広くカバーできます。

    ・死亡時の遺族の生活保障を主目的とされる方 → 「こもれび定期保険」や「こもれび終身保険（低解約返戻金型）」が適しています。

    ・老後の資金準備を優先したい方 → 「こもれび個人年金保険」による計画的な積立をお勧めします。


    【注意点】

    本商品には90日間の「待ち期間」があります。すでに健康不安がある方や、即座に保障を開始したい方は、告知義務の内容や待ち期間の制限について十分にご確認ください。'
  domain: insurance
  product_category: gan_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 8fcd4576-20f6-51da-aaf1-4055afd40697
  title: こもれびがん保険：手数料と費用
  body: '【ご質問】

    保険料以外に、加入時や維持のためにかかる手数料はありますか？


    【回答】

    「こもれびがん保険」では、ご契約者が負担する別途の加入手数料や維持管理費はございません。合理的な保険料体系を採用しており、例として40歳男性（終身払）の場合の月払保険料は1,980円となっております。透明性の高い価格設定で、長期的な安心を提供いたします。


    【ご質問】

    支払った保険料にかかる税制上の優遇はありますか？


    【回答】

    生命保険料控除の対象となります。新制度の契約では、区分ごとに所得税で最高40,000円、合計で最高120,000円まで適用されます。詳細は税務署または税理士にご確認ください（当社では個別の税務相談は行っておりません）。'
  domain: insurance
  product_category: gan_hoken
