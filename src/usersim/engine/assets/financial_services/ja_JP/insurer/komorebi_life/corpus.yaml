- id: 06c9f9b3-e01e-5511-b811-ab9dbdf77bae
  title: こもれびがん保険：ほかの選択肢との比較と向かない場合
  body: '「こもれびがん保険」は、がんという特定のリスクに対して効率的に備えたい方に最適な特化型プランです。


    【本プランが向いている方】

    ・がん診断時に1,000,000円の給付金を受け取り、治療費や生活費に充てたい方

    ・月額100,000円の治療給付金により、長期的な治療に専念できる環境を整えたい方


    【向かない場合と代替案】

    がん以外の病気や怪我による入院・手術全般を幅広くカバーしたい場合は、本プランのみでは不足します。その場合は、公的医療保険の高額療養費制度を補完する「こもれび医療保険」との併用、または切り替えをご検討ください。お客様のリスク許容度に基づき、客観的なデータを用いて最適なプランを提案いたします。'
  domain: insurance
  product_category: gan_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
