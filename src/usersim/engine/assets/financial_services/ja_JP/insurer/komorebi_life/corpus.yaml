- id: 1a0a1be1-ca92-50c3-a63c-ab110e8189db
  title: こもれび定期保険：お取引が拒否された・制限された
  body: '「こもれび定期保険」のお申し込みやお手続きにおいて、エラーが発生したり、受け付けが拒否されたりする場合の対処法をご案内します。


    【考えられる原因とチェック項目】

    1. 年齢制限への抵触：ご契約時の年齢が70歳を超えていないかご確認ください。本プランは70歳が上限となっております。

    2. 告知内容の不備：健康状態の告知において、必須項目に未回答の部分や、矛盾する記載がないかご確認ください。告知義務に違反すると、お手続きが進まない場合がございます。

    3. 本人確認情報の不一致：お伝えいただいたフルネームまたは生年月日が、ご登録情報や公的書類と一致しているかご確認ください。

    4. お支払い方法の不備：設定されたクレジットカードや口座に問題があり、保険料の引き落としが制限されている可能性があります。


    【解決策】

    ・情報の修正：誤りがある場合は、正しい内容で再度お知らせください。

    ・不足書類の提出：担当者から案内があった必要書類を速やかにご提示ください。


    【エスカレーションについて】

    上記を確認しても解決しない場合や、コンプライアンス上の疑義がある複雑な案件については、内部規定に基づき、速やかに専門のコンプライアンス部門へエスカレーションし、調査を行います。その際は、改めて担当者よりご連絡いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: e8aae3f1-a767-5544-9cbb-d17f94ce405b
  title: こもれび定期保険：切替えや上位プランを検討するとき
  body: 'お客様が「こもれび定期保険」から他のプランへの切替えを検討される際は、以下の視点でご案内してください。


    【こもれび定期保険の特徴】

    低コストで大きな保障を効率的に確保できるプランです。例えば、保険金額30,000,000円という大きな保障を、月払保険料3,150円（30歳男性・10年期間）というリーズナブルな価格で準備できます。ただし、掛け捨て型のため、貯蓄性はございません。


    【切替えの判断基準】

    ・「一生涯の保障が欲しい」または「将来的に資金を貯めておきたい」というご意向がある場合は、「こもれび終身保険（低解約返戻金型）」への切替えを提案してください。

    ・「特定の期間だけ集中的に保障が必要（例：お子様が独立するまで）」という場合は、本プランが最適です。


    お客様のライフステージと、保障期間（本プランは10年）の整合性を確認し、誠実な標準的ケアをもって最適なプランを提案してください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 43a28ce7-e411-58cb-8318-24c106954939
  title: こもれび定期保険：ほかの選択肢との比較と向かない場合
  body: '「こもれび定期保険」は、限られた期間に効率よく大きな保障を準備したい方に最適なプランですが、すべての方に向いているわけではありません。他プランとの違いを正しくご理解ください。


    【本プランが向いている方】

    ・月々のコストを抑えつつ、30,000,000円などの高額な死亡保障を確保したい方

    ・お子様の成長など、特定の期間（本プランでは10年）だけ保障が必要な方

    ・合理的でシンプルな掛け捨て型の保障を求める方


    【本プランが向かない方】

    ・終身（一生涯）の保障を確保したい方 → 「こもれび終身保険（低解約返戻金型）」をご検討ください。

    ・保険料を積み立てて、将来の貯蓄に充てたい方 → 貯蓄性のある終身保険や「こもれび個人年金保険」が適しています。

    ・入院や手術など、医療費のカバーを主目的とする方 → 「こもれび医療保険」や「こもれびがん保険」をご検討ください。


    【プランの特性】

    本プランは「掛け捨て型」であり、保険期間が10年と決まっています。そのため、期間終了後は保障がなくなります。将来にわたる安心を長期的に準備したい場合は、他の選択肢との比較をお勧めします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
