- id: 3f438dd1-e1c8-5a6c-99cf-92bf941b3598
  title: こもれび個人年金保険：お申込みとご利用開始
  body: '将来の安心を準備するための「こもれび個人年金保険」のお申込み手順をご案内いたします。


    1. プランのご提案と決定：お客様のご希望に合わせて、月々の保険料（例：10,000円）などのプラン内容を決定します。

    2. 本人確認と告知：契約者番号の確認および本人確認書類をご提示ください。あわせて、健康状態などを正しく伝える「告知義務」に基づいた内容の確認を行います。

    3. 書面による内容確認：プラン詳細および重要事項を記載した書面をお渡しします。内容を十分にご確認ください。

    4. 契約成立と払込み開始：手続きが完了し、保険料の払込みが開始されることで保障が有効となります。


    なお、書面受取後8日以内であれば、クーリング・オフ制度により無条件で契約を撤回することが可能です。'
