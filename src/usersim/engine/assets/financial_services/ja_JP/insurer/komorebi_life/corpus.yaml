  body: 'ご契約内容の変更や解約をご希望の場合、以下の手順でお手続きを承ります。


    1. ご本人様確認：契約者番号と、有効な本人確認書類をご提示ください。

    2. ご要望の提示：解約、受取人等の変更、またはプランの切替えなど、具体的なご要望をお伝えください。

    3. 内容の確認：解約の場合は、その時点での解約返戻金の金額を提示いたします。変更の場合は、変更後の条件を改めてご案内します。

    4. 手続きの実行：内容にご合意いただいた後、当社にて手続きを行い、完了後、書面にて通知いたします。


    なお、書面受取後8日以内であれば、クーリング・オフ制度に基づき無条件で撤回が可能です。'
