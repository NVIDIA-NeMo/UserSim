- id: dcd1d08f-8630-5dda-a5e8-ed17382a577c
  title: こもれびがん保険：月払保険料の例（40歳男性、終身払）について
  body: '【ご質問】

    「こもれびがん保険」に加入した場合、毎月の保険料はどのくらいになりますか？


    【回答】

    お客様の年齢やプラン内容によって異なりますが、例として「40歳男性、終身払」でご加入いただいた場合の月払保険料は1,980円となります。


    なお、この金額はあくまで一例であり、実際のお見積もり金額は、お客様のご年齢や健康状態、選択される保障内容によって変動いたします。詳細な保険料について知りたい場合は、お客様の情報を添えてお問い合わせください。誠実にご提案させていただきます。'
  domain: insurance
