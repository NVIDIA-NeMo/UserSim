  title: こもれび終身保険（低解約返戻金型）：保険金額の例について
  body: 'Q：保険金額を5,000,000円に設定した場合、どのような保障になりますか？


    A：ご契約者が亡くなられた際、ご指定の受取人様に5,000,000円の死亡保険金がお支払いされます。この金額は、ご家族の生活費や葬儀費用など、将来への不安を解消するための確実な備えとなります。詳細な設計については、担当エージェントまでご相談ください。'
