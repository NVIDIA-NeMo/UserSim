  institution_id: komorebi_life
- id: 33c2f3d7-96b6-5c3e-8acf-f0511f6807e3
  title: こもれび個人年金保険：金利・料率一覧
  body: '【金利・返戻率について】


    こもれび個人年金保険は、合理的かつ透明性の高い保険料体系を採用し、安定した運用を目指しております。


    ・返戻率の例：108%

    （※返戻率とは、払い込んだ保険料の総額に対して、将来受け取る年金総額がどの程度の割合になるかを示す指標です。上記の数値はあくまで例であり、加入年齢や払込期間によって変動します。）


    【適用について】

    本商品の料率は、リスクの分散と安定した給付金支払いのための原資として運用される仕組みに基づいています。個別の契約内容に応じて適正価格を維持しており、一律の固定金利を保証するものではありません。


    詳細なシミュレーションについては、お客様の年齢や希望される月払保険料に基づき、個別にご提示させていただきます。'
