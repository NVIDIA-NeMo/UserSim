- id: 3832ed6d-351f-5798-a9d1-c4a0df6cc240
  title: こもれび定期保険：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが「保留中」のまま進まない場合、以下の原因が考えられます。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：ご提示いただいた書類が最新のものであるか、または不鮮明でないかをご確認ください。

    2. 告知事項の未回答：健康状態に関する告知義務への回答に漏れがないか、再度ご確認をお願いいたします。


    【解決方法】

    不足している書類の再提示、または未回答項目の追記をお願いいたします。内容が確認でき次第、速やかに手続きを再開いたします。


    【エスカレーション】

    上記を確認しても解消しない、あるいは審査に時間を要している場合は、弊社コンプライアンス部門および専門部署にて厳格に調査を行い、結果を改めてご案内いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
