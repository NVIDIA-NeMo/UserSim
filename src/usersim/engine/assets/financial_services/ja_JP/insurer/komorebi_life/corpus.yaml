- id: 5061574b-ef26-587a-a77c-961069a5a777
  title: こもれび医療保険：お手続きが完了しない・保留中のまま
  body: 'お申し込み手続きが完了せず、「保留」の状態になっている場合に考えられる原因と対処法をご案内します。


    【考えられる原因】

    ・本人確認情報の不一致：ご提示いただいたフルネームまたは生年月日が、登録情報と異なっている。

    ・告知内容の確認事項：告知義務に関する回答の中で、追加の確認が必要な事項がある。


    【確認の手順】

    1. 本人確認情報の再確認：正しい氏名と生年月日でお手続きいただいているかご確認ください。

    2. 告知内容の再確認：健康状態について、漏れや誤りがないか改めてご確認ください。


    【解決しない場合】

    上記を確認しても解決しない場合や、複雑な事情がある場合は、当社にて速やかに専門のコンプライアンス部門へエスカレーションし、審査を行います。審査の結果、お手続きが可能かどうかが決定し、改めてご連絡いたします。


    なお、手続き上の疑問がある場合は、平日の9時から17時まで運営しているカスタマーセンターにて承っております。'
  domain: insurance
  product_category: iryo_hoken
  document_type: troubleshooting
  source_authority: official
