- id: dac02f31-2952-5a48-bbe1-0d4a29d9e685
  title: こもれびがん保険：規定・約款
  body: '本規定は、こもれびがん保険の契約における権利と義務を定めるものです。契約者は、適正に設定された保険料（例：1,980円）を期日に払い込む義務を負います。また、契約時に健康状態を正しく伝える「告知義務」を遵守していただく必要があり、事実と異なる告知をした場合、契約解除や給付金が支払われないリスクがあります。


    本保険には、契約後90日の待ち期間が設けられており、この期間内にがんと診断された場合は保障の対象外となります。一方、契約者は申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回できる「クーリング・オフ」の権利を有します。


    なお、本保険は生命保険契約者保護機構により、責任準備金等の90%まで補償される制度の対象となっております。'
