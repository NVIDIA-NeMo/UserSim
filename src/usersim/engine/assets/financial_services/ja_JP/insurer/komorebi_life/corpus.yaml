  institution_id: komorebi_life
- id: eaf2dc0d-9ea1-5490-9a9e-46cd082bf273
  title: こもれび終身保険（低解約返戻金型）：切替えや上位プランを検討するとき
  body: 'お客様が現在のプランから他のプランへの切替えを検討される際、以下の視点でご案内ください。


    【こもれび定期保険との比較】

    ・効率的な保障を求める場合：低コストで一定期間の大きな保障を確保できる「こもれび定期保険」が適しています。

    ・一生涯の保障と貯蓄性を求める場合：本商品（こもれび終身保険）が適しています。


    【切替え時の注意点】

    本商品から他のプランへ切替える際、低解約返戻金期間中に解約して手続きを行うと、解約返戻金が70%の水準となるため、大きな損失が出る可能性があります。また、新たなプランへの加入時には再度「告知義務」が発生し、健康状態によっては加入できない場合があることをお伝えください。


    【提案の方向性】

    「今は低コストで大きな保障がほしい」という方には定期保険を、「将来にわたって確実な保障と、ある程度の資産形成を両立させたい」という方には本商品を推奨します。'
  domain: insurance
  product_category: shushin_hoken
  document_type: comparison
  source_authority: official
