- id: 77326353-48e6-5ea8-bb3c-ba23506261d9
  title: こもれび定期保険：安全にご利用いただくためのポイント
  body: 'お客様の重要な保障を守るため、こもれび定期保険のご利用にあたっては以下の点にご注意ください。


    1. 本人確認の徹底：受取人の変更や契約内容の変更など、状態を変化させるすべての手続きの前には、本人確認書類および契約者番号を用いた厳格な本人認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行はいたしません。

    2. 不審な連絡への警戒：弊社がメールや電話で、暗証番号や機密情報を不自然に要求することはありません。少しでも不審な点がある場合は、直ちにご相談ください。


    安心してお取引いただくため、弊社では金融庁の監督および保険業法を厳格に遵守しております。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
