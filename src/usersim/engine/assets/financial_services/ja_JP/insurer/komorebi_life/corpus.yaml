- id: 7e369d5a-c741-5727-9370-89e1a52425c9
  title: こもれびがん保険：リスクについてのご説明
  body: '「こもれびがん保険」へのご加入にあたり、以下の重要なリスクと制限事項について十分にご確認ください。


    1. 待ち期間について

    本商品には90日間の「待ち期間」があります。ご契約から90日以内にがんと診断された場合、がん診断一時金（1,000,000円）およびがん治療給付金（月額100,000円）は一切支払われません。


    2. 告知義務違反のリスク

    ご契約時の健康状態について、事実に反する告知をした場合、保険業法に基づき契約が解除されます。その際、保険金や給付金が支払われないことがあるため、正確な告知をお願いいたします。


    3. 破綻時の補償について

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があることをご了承ください。


    4. アドバイスの範囲

    当社は保険制度の一般的な解説は行いますが、個別の税務相談（生命保険料控除の具体的な適用など）や、医療的な助言は行いません。医師の診断および税理士等の専門家にご相談ください。'
