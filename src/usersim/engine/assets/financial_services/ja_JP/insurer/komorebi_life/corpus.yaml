  institution_id: komorebi_life
- id: 2c96350c-f18e-52d8-a1f0-e1f44a8a49cb
  title: こもれび定期保険：契約できる年齢の上限について
  body: '【質問】「こもれび定期保険」に加入できる年齢に制限はありますか？


    【回答】はい、ございます。本プランでご契約いただける年齢の上限は70歳までとなっております。


    【質問】71歳から加入したい場合はどうなりますか？


    【回答】誠に恐れ入りますが、本プランは契約できる年齢の上限が70歳であるため、71歳以上の方はお申し込みいただけません。お客様のご状況に合わせた別のプランをご検討ください。詳細な条件については、「こもれび定期保険：お申込みいただける方」をご確認ください。'
