- id: 9e2bbe94-6964-5bd1-ac2a-3a2fcf1bd84f
  title: こもれび終身保険（低解約返戻金型）：明細や記録と合わない
  body: 'お客様から「保険料を支払ったはずなのに明細に反映されていない」「解約返戻金の金額が想定と違う」といったお問い合わせをいただいた際の対応手順です。


    【確認すべき項目】

    1. お支払い日の確認

    振込日や引き落とし日と、当社のデータ反映タイミングに時間差がある場合があります。正確な日付を確認してください。

    2. 払込み方法の確認

    口座振替、クレジットカードなど、どのお支払い方法で手続きが行われたかを確認します。

    3. 低解約返戻金期間の適用確認

    解約返戻金についてのご相談の場合、現在が「低解約返戻金期間」内であるかを確認してください。この期間内であれば、返戻金は標準的な水準の70%となるため、お客様の想定（100%）と乖離が生じます。


    【対処法】

    ・データ反映の遅延が原因である場合は、反映予定日を案内し、お待ちいただくようお願いします。

    ・低解約返戻金期間による金額の差である場合は、商品設計上の仕組みであることを丁寧に説明してください。


    【エスカレーション】

    支払いの事実が確認できるにもかかわらず、システム上の記録と合致せず解決できない場合は、速やかに専門のコンプライアンス部門へ報告し、調査を依頼してください。'
