- id: 339cad93-76b6-5a5c-88c9-996c89caf1d1
  title: こもれびがん保険：がん診断一時金について
  body: '【Q】がん診断一時金はどのような時に、いくら受け取れますか？


    【A】医師によってがんと確定診断を受けた際に、一時金として1,000,000円をお支払いいたします。これにより、治療費だけでなく、療養中の生活費など幅広くご活用いただけます。詳細な適用条件については、約款をご確認いただくか、担当エージェントまでお問い合わせください。'
