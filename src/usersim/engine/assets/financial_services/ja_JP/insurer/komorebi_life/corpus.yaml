- id: 807dbc4e-4b76-59e0-9247-7b8dde39a7bb
  title: こもれび医療保険：よくあるお手続きの流れ
  body: '本プランで最も多くのお問い合わせをいただく「給付金の請求手続き」の流れをご案内します。


    【お手続きの流れ】

    1. 本人確認：カスタマーセンターにて、お客様のフルネームと生年月日をお伝えください。

    2. 内容の申告：入院・手術の期間、および診断名など、請求される内容を具体的にお伝えください。

    3. 書類の提出：当社よりご案内する「保険金・給付金請求書」および、医師の証明書（診断書）を郵送または電磁的記録にてご提出ください。

    4. 審査と支払い：ご提出いただいた書類に基づき、当社にて審査を行います。書類がすべて揃い、審査が完了した後、速やかに指定口座へ給付金をお振り込みいたします。


    【ポイント】

    ・告知義務に基づき、正しい情報を申告していただく必要があります。

    ・必要書類が不足していると支払時期が遅れるため、担当者の案内に沿って正確にご準備ください。


    手続きについてご不明な点がある場合は、平日の9時から17時の間にいつでもご相談ください。'
  domain: insurance
  product_category: iryo_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
