- id: 69caf36f-8135-5b9a-9091-674a42bc193b
  title: こもれび個人年金保険：個人情報の取扱い
  body: 'こもれび生命は、金融庁の監督および保険業法に基づき、公正な取引と厳格なデータプライバシー保護を徹底しております。こもれび個人年金保険をご利用いただく際にお預かりする個人情報の取扱いについて、以下の通り開示いたします。


    【利用目的】

    お客様からお預かりした個人情報は、以下の目的のみに使用いたします。

    ・保険契約の締結、管理、および保険金・給付金の支払手続き

    ・保険料のお支払いに関する確認およびご連絡

    ・法令に基づく報告および監督官庁による監査への対応

    ・サービス向上のための統計的な分析（個人が特定できない形式での利用）


    【安全管理措置】

    当社は、不正アクセスや漏洩を防ぐため、社内規定に基づいた厳格なアクセス制御と暗号化を実施しております。また、個人情報の管理責任者を配置し、定期的な監査を行っております。


    【第三者への提供】

    法令に基づく場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。ただし、公正な解決を図るために必要と判断される場合、生命保険協会の生命保険相談所と連携することがございます。


    【お客様の権利】

    ご自身の個人情報の開示、訂正、または利用停止を希望される場合は、カスタマーセンターまでお申し出ください。ご本人確認（フルネームと生年月日の照会）の後、速やかに対応させていただきます。'
