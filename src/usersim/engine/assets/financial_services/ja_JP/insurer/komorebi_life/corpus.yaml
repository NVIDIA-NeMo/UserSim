- id: a2331a42-fd54-5d7e-9301-99a11afc9eed
  title: こもれび終身保険（低解約返戻金型）：規定・約款の変更
  body: '本規定は、こもれび終身保険（低解約返戻金型）の契約における権利義務を定めるものです。他社商品と比較検討される際は、特に以下の点にご注意ください。


    【告知義務について】

    ご契約時に健康状態等を正確に伝える「告知義務」がございます。事実に反する告知をした場合、保険業法および内部規定に基づき、契約が解除されたり、保険金や給付金が支払われなかったりすることがあります。


    【クーリング・オフ制度】

    お申込み後、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回できる「クーリング・オフ」が適用されます。


    【解約返戻金に関する重要事項】

    本商品は「低解約返戻金型」です。低解約返戻金期間中に解約された場合、解約返戻金の水準は70%となり、一般的な終身保険に比べて返戻金が低くなる設計となっています。長期的な保障と貯蓄性のバランスを考慮したプランである点をご理解ください。


    【約款の変更】

    法令の改正や監督官庁（金融庁）の指示に基づき、約款の内容を変更することがあります。変更がある場合は、あらかじめお客様へ通知いたします。'
