- id: 05912254-c350-5ed9-85ac-18111a33157c
  title: こもれび終身保険（低解約返戻金型）：お申込みとご利用開始
  body: 'こもれび終身保険（低解約返戻金型）のお申込みから保障開始までの手順をご案内します。


    【事前のご準備】

    ・ご本人様確認書類（フルネームと生年月日を確認させていただきます）

    ・現在の健康状態に関する情報


    【お申込みの手順】

    1. 本人確認：まずはお客様のフルネームと生年月日をお伺いし、本人確認を完了させます。

    2. プランの決定：保険金額（例：5,000,000円）や、保険料の払込みが終わる年齢（例：60歳）などの条件を決定します。

    3. 告知のお手続き：現在の健康状態について正確にお伝えいただく「告知義務」の手続きを行います。事実に反する告知をした場合、契約解除や保険金が支払われないことがありますのでご注意ください。

    4. 契約内容の確認と承諾：ご提示した保障内容と保険料（例：月払12,400円）に同意いただき、お申込みを完了します。

    5. 書面の受領と開始：契約内容を記載した書面がお手元に届き、手続きが完了した時点で保障が開始されます。


    【ご確認事項】

    申込日または書面を受け取った日のいずれか遅い日から8日以内であれば、クーリング・オフ（申込みの撤回）が可能です。'
