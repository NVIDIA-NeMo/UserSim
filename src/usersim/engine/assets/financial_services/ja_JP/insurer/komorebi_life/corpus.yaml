- id: 9e2bbe94-6964-5bd1-ac2a-3a2fcf1bd84f
  title: こもれび終身保険（低解約返戻金型）：明細や記録と合わない
  body: '【症状】

    お客様が計算した想定解約返戻金と、当社が提示した明細書の金額に乖離がある。


    【考えられる原因】

    多くの場合、本商品の特性である「低解約返戻金型」の適用期間であることを失念されていることが原因です。低解約返戻金期間中は、解約返戻金が標準的な水準の70%に制限されます。


    【確認および解決手順】

    1. お客様が参照している金額が「標準的な終身保険」の数値であるか確認してください。

    2. 現在の契約経過年数が、低解約返戻金期間内にあるかを確認します。

    3. 70%の制限が適用された後の正確な金額を改めて提示し、商品設計の仕組みについて丁寧に説明してください。


    【エスカレーション】

    仕組みの説明後も計算根拠に納得いただけない場合は、専門部署にて詳細な積立計算書を作成し、改めてご案内いたします。'
