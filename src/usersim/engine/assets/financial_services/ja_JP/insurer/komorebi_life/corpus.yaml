  title: こもれび終身保険（低解約返戻金型）：ご利用開始までの手順
  body: 'サポートエージェントは、お客様が以下の手順でスムーズにご契約いただけるよう案内してください。


    1. コンサルティング：お客様のライフステージとリスク許容度を確認し、最適な保障額（例：5,000,000円）を提案します。

    2. 告知義務の履行：健康状態などを正しく伝える告知義務について説明し、適切に回答を得ます。

    3. プラン確定と保険料確認：月々の保険料（例：12,400円）などの支払条件を提示し、合意を得ます。

    4. 契約手続き：本人確認書類を確認し、契約書を作成します。書面受取後8日以内はクーリング・オフが可能である旨を周知してください。'
