  institution_id: komorebi_life
- id: 63dbeddf-9281-5fcb-9cb1-03232bc59ea8
  title: update_contact_info を使う場面
  body: 'お客さまの住所変更、電話番号の変更、メールアドレスの更新など、連絡先情報を変更したいという要望があった場合に使用します。保険金請求などの重要な案内を正確に届けるため、常に最新の情報に保つ必要があります。


    【対応手順】

    1. お客さまのフルネームと生年月日を確認し、verify_identityを呼び出して本人確認を完了させてください。

    2. 新しい住所や電話番号など、更新したい連絡先の詳細を伺います。

    3. update_contact_infoを呼び出し、伺った最新の連絡先情報を送信して更新を完了させてください。

    4. 更新が完了したことをお客さまにお伝えください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: komorebi_life
- id: a76acc7a-f0b0-5666-af65-a8c413e33c8b
  title: update_contact_info ツールリファレンス
  body: 'このツールは、お客さまの登録連絡先情報を更新するために使用します。オペレーターが直接呼び出すことで、システム上の住所や電話番号等を変更します。


    【引数】

    ・contact_details：更新後の住所、電話番号、メールアドレスなどの詳細情報。


    【効果】

    指定された連絡先情報が最新の状態に更新されます。機密情報の保護のため、実行前に必ずverify_identityによる本人確認を完了させてください。'
