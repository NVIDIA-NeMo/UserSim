  title: こもれびがん保険：重要事項のご説明
  body: '【重要事項および免責事項】


    ■告知義務について：ご契約時に健康状態を正しく伝える義務がございます。事実と異なる告知をした場合、契約解除や保険金・給付金が支払われないことがあります。

    ■待ち期間：本保険は契約から90日の待ち期間を設けております。この期間中の診断は保障対象外となります。

    ■クーリング・オフ：申込日または書面受取日のいずれか遅い日から8日以内であれば、無条件で契約を撤回できます。

    ■責任準備金の保護：生命保険契約者保護機構により、責任準備金等の90%まで補償されます。


    本商品は金融庁の監督および保険業法を厳格に遵守し、透明性の高い運用を行っております。'
