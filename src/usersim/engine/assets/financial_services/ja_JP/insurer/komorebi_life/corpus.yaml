- id: ac2ed799-a9fc-5d9d-87dc-21faa5d116d5
  title: こもれび定期保険：当社の似た商品との比較
  body: '「こもれび定期保険」と、同様に死亡保障を提供する「こもれび終身保険（低解約返戻金型）」を比較します。


    【比較表】

    | 比較項目 | こもれび定期保険 | こもれび終身保険（低解約返戻金型） |

    | :--- | :--- | :--- |

    | 保障期間 | 10年（一定期間） | 一生涯 |

    | 費用（保険料） | 低コスト（例: 3,150円/月） | 定期保険より高めに設定 |

    | 貯蓄性 | なし（掛け捨て） | あり（解約返戻金あり） |

    | 特徴 | 効率的に大きな保障を確保 | 保障と貯蓄を両立 |


    【どちらが向いているか】

    ・こもれび定期保険：お子様が独立するまでなど、特定の期間だけ集中的に、かつ安価に大きな保障（例：30,000,000円）を準備したい方に最適です。

    ・こもれび終身保険（低解約返戻金型）：期間に関わらず一生涯の保障を持ちたい方や、将来に向けた資産形成も同時に行いたい方に最適です。'
  domain: insurance
  product_category: teiki_hoken
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 4079ee0c-8db2-5d0c-b393-8b1f9895d305
  title: こもれび定期保険：重要事項のご説明
  body: 'こもれび定期保険のご契約にあたり、以下の重要事項を必ずご確認ください。


    【告知義務について】

    ご契約時に健康状態等を正確に伝える「告知義務」がございます。事実に反する告知をした場合、保険業法に基づき契約が解除され、保険金や給付金が支払われないことがあります。誠実な告知をお願いいたします。


    【クーリング・オフについて】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回（クーリング・オフ）することができます。


    【資産保護について】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があることをご了承ください。


    【免責事項】

    ・個別の税務相談や医療的な助言は行いません。

    ・保険金や給付金の支払いを確約する表現はいたしません。審査および約款に基づきお支払いいたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: eaf3cb59-49ec-5c2d-88fd-15ee3db9a972
  title: こもれび定期保険：金利・料率一覧
  body: 'こもれび定期保険の保険料率についてご案内します。本商品は、リスクの分散と安定した給付金支払いのための原資として運用し、プランに応じた適正価格を維持しております。


    【保険料の例】

    ・月払保険料：3,150円

    （条件：30歳男性、保険期間10年、保険金額30,000,000円の場合）


    【料率の決まり方】

    保険料は、以下の要素に基づいて算出されます。

    1. 契約時の年齢および性別

    2. 設定される保険金額（例：30,000,000円）

    3. 保険期間（本プランは10年）

    4. 健康状態（告知内容による判定）


    本商品は掛け捨て型のため、適用される金利による積立金は発生いたしません。シンプルに保障のみを確保したい方向けの合理的価格となっております。'
  domain: insurance
  product_category: teiki_hoken
