- id: 252e4156-c5a5-58b9-ad1c-1f3849e23215
  title: こもれび終身保険（低解約返戻金型）：解約・変更・プランの切替え
  body: 'ご契約内容の変更や解約をご希望の場合は、以下の手順でお手続きをお願いいたします。


    1. お手続きの内容（解約、受取人の変更、プランの切替えなど）を当社担当者へお伝えください。

    2. ご本人様確認のため、「契約者番号」および「本人確認書類（運転免許証やマイナンバーカード等）」をご提示ください。

    3. 当社にて厳格な本人認証を行い、認証完了後に現在の契約状況を確認します。

    4. 低解約返戻金型プランの場合、解約返戻金が標準の70%となる期間があることなど、重要な注意点について改めてご案内いたします。

    5. 内容にご同意いただいた後、お手続きを確定させます。手続き完了後、変更内容を記載した書面が送付されますので、内容をご確認ください。'
  domain: insurance
