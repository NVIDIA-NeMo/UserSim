- id: ffb1b49e-0acc-5cbd-aa9c-38ed0abebf15
  title: こもれび医療保険：個人情報の取扱い
  body: 'こもれび生命では、お客様からお預かりした個人情報を厳重に管理し、適切に取り扱っております。以下にその方針をご説明いたします。


    【法令遵守と監督】

    当社は、金融庁の監督および保険業法に基づき、公正な取引と厳格なデータプライバシー保護を徹底しております。お客様の個人情報は、保険契約の締結、維持、および保険金・給付金の支払いのためにのみ利用いたします。


    【情報の利用目的】

    ・保険契約の内容確認および管理

    ・入院給付金（日額10,000円等）や手術給付金の支払い手続き

    ・重要なお知らせや約款変更のご案内

    ・法令に基づく照会への対応


    【安全管理措置】

    個人情報の漏洩、滅失、または毀損を防止するため、内部規定に基づいたアクセス制限や暗号化などの安全管理措置を講じております。また、本人確認の際は「フルネーム」と「生年月日」を確認し、なりすましによる情報漏洩を防止します。


    【第三者への提供】

    法令に定める場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。ただし、保険金・給付金の支払いの際、必要に応じて医療機関等から診断書等の情報を取得することがございます。


    【お客様の権利】

    ご自身の個人情報の開示、訂正、または利用停止を希望される場合は、カスタマーセンターまでご連絡ください。誠実かつ迅速に対応させていただきます。'
