- id: 692d3424-ebf2-5e87-acbd-1a318e0de646
  title: こもれび定期保険：お申込みとご利用開始
  body: 'こもれび定期保険のお申込みから保障開始までの手順をご案内いたします。


    1. ご希望の保険金額（例：30,000,000円）と、保険期間（10年）を弊社担当者へお伝えください。

    2. 告知義務に基づき、現在の健康状態についてのご回答をいただきます。正しく告知いただくことで、確実な保障が提供されます。

    3. ご本人確認書類および契約者番号をご提示いただき、厳格な本人認証を行います。認証完了まで機密情報の開示は行われません。

    4. 内容に同意いただき、お手続きが完了すると、保険契約成立の通知が届きます。


    なお、契約内容に関する重要な注意点は「こもれび定期保険：重要事項のご説明」に記載しておりますので、併せてご確認ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 8716f152-1eb2-523a-8108-223fb0589808
  title: こもれび定期保険：手数料一覧
  body: 'こもれび定期保険の費用体系は、長期的な持続可能性を最優先に設定しております。


    ・保険料：お客様のリスクと年齢に基づき、適正に設定いたします。

    ・事務手数料：公平なプラン維持および運営コスト回収のため、所定の手数料をいただいております。

    ・契約者貸付手数料：貸付利用時に、根拠に基づいた適正な手数料を申し受けます。'
  domain: insurance
  product_category: teiki_hoken
