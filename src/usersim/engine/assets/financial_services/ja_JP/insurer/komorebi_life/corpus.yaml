  body: 一生涯の保障を効率的に準備したい方は、本プラン（低解約返戻金型）が最適です。低解約返戻金期間中の解約返戻金は70%に抑えられている分、月々の保険料を低く設定でき、例えば5,000,000円の保障を無理なく確保できます。一方、必要な期間だけ集中的に大きな保障を得たい場合は「こもれび定期保険：商品概要」をご検討ください。長期的な資産形成と保障の両立を目指す方に本プランを推奨いたします。
