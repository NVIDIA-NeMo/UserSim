- id: 2a90bd5c-84d2-5664-81de-f12b8ce10e79
  title: こもれび定期保険：ご紹介・継続利用の特典
  body: 'いつもこもれび生命をご愛顧いただき、誠にありがとうございます。私たちは、お客様が将来への安心をより多くの方と共有できるよう、「ご紹介・継続利用の特典」をご用意しております。


    大切なご家族やご友人に「こもれび定期保険」をご紹介いただき、新しくご契約に至った場合、ご紹介者様とご契約者様の両方に感謝の気持ちを込めた特典をご提供いたします。また、保険期間の満了後に継続して当社のプランをご利用いただくお客様への優遇措置もございます。


    詳細な特典内容や適用条件につきましては、カスタマーセンターにてご案内しております。お客様一人ひとりに寄り添うパートナーとして、誠実なサポートをさせていただきます。'
