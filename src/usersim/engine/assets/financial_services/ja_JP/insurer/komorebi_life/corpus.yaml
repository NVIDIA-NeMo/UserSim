  body: こもれび生命では、金融庁の監督および保険業法を厳格に遵守し、お客様の個人情報を適切に管理いたします。ご提供いただいた情報は、保険契約の締結、維持、および保険金・給付金の支払い手続き、ならびに法令に基づく開示請求への対応にのみ利用いたします。また、受取人の変更等の手続きに際しては、なりすまし防止のため本人確認書類と契約者番号による厳格な認証を行います。個人情報の取扱いに関する詳細な規定は「こもれび終身保険（低解約返戻金型）：規定・約款」に定めております。
