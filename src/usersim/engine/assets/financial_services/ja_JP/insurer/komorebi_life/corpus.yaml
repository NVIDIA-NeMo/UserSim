  title: こもれび終身保険（低解約返戻金型）：保険料の払込みが終わる年齢について
  body: '【質問】保険料の払込みはいつまでにする必要がありますか？


    【回答】本プランでは、お客様のライフプランに合わせて払込期間を選択いただけます。例えば、60歳で払込みを完了させる設定にすることで、定年退職後の収入減少に合わせた無理のない資金計画が可能です。払込期間満了後は、保険料を支払うことなく、一生涯の保障を継続いただけます。


    詳細は「こもれび終身保険（低解約返戻金型）：商品概要」をご参照ください。'
