- id: 916399bb-c2ff-5d7b-9c0a-0e4248353d3e
  title: こもれび定期保険：登録内容の変更
  body: 'ご契約内容やご登録情報の変更手続きについてご案内いたします。


    【お手続きの流れ】


    1. 本人確認

    まず、ご本人様確認のため、「フルネーム」と「生年月日」をお知らせください。


    2. 変更内容の提示

    住所、電話番号、または保険金受取人の変更など、具体的にどの情報を変更したいかをお伝えください。


    3. 必要書類の提出

    変更内容に応じて、当社より必要書類をご案内します。特に受取人の変更などの重要事項については、所定の書面へのご署名・ご捺印が必要となりますので、案内に従って書類をご提出ください。


    4. 変更内容の確認と完了

    当社にて書類の確認が完了し、内容が正しく更新されたことをお知らせいたします。これにより手続きは完了となります。


    【ご注意】

    クレジットカード番号やパスワードなどの機密情報は、変更手続きにおいても一切要求いたしませんのでご注意ください。'
