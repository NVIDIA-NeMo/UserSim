- id: f45641ef-032b-5119-b57a-426e0859f46a
  title: こもれび個人年金保険：ご利用開始までの手順
  body: 'こもれび個人年金保険のご利用開始までのお手続きの流れをご案内いたします。本プランは、計画的に積立を行い、老後の安定した資金準備を実現するための特化型プランです。


    【お手続きの流れ】

    1. ご相談とプラン設計：お客様の意向と客観的なデータに基づき、最適なプランを提案いたします。例えば、30歳で加入し65歳まで払込みを行う場合、月払保険料の例は10,000円となります。

    2. ご告知手続き：契約に際し、健康状態等を正確に伝える「告知義務」がございます。内容にご不備があると、将来的に保険金が支払われないリスクがあるため、誠実な回答をお願いいたします。

    3. ご契約の成立：申込内容を確認し、正式に契約を締結します。

    4. 保険料のお支払い開始：ご指定の口座より、合理的かつ透明性の高い保険料体系に基づいたお支払いをお願いいたします。


    【重要事項】

    ・年金の受取開始年齢は65歳、受取期間は10年となっております。

    ・契約後、申込日または書面受取日の遅い方から8日以内であれば、クーリング・オフが可能です。

    ・本プランの返戻率の例は108%となっております。


    ご不明な点は、カスタマーセンターにて丁寧にご説明いたします。'
