- id: ef7fedc1-c5c1-5a63-8c8b-67c0eb504cfc
  title: file_claim を使う場面
  body: '入院、手術、がんの診断、または死亡による保険金・給付金の請求を承る際は、以下の手順で手続きを行います。


    1. 本人確認を行い、契約者または正当な受取人であることを確認します。

    2. 請求したい給付金・保険金の内容および事故・病状の詳細を伺います。

    3. 請求に必要な書類（診断書や同意書など）の内容を案内します。

    4. file_claim ツールを呼び出し、請求受付手続きを完了させます。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: komorebi_life
- id: 96029ffd-451c-51a6-8de6-072e39297def
  title: file_claim ツールリファレンス
  body: エージェントは本ツールを直接呼び出し、給付金や保険金の請求手続きを行います。引数として、契約者番号（account_id）、請求の種類（claim_type）、および事故や病状などの詳細（incident_details）が必要です。実行後、お客様へ必要書類の案内が行われます。
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: komorebi_life
- id: bdbd4b9b-b591-5f14-88f3-35026e68bcfb
  title: get_claim_status を使う場面
  body: '請求中の給付金・保険金の支払状況についてお問い合わせがあった際は、以下の手順で案内します。


    1. 本人確認を行い、請求者であることを確認します。

    2. 必要に応じて get_accounts ツールを使用して、お客様の契約者番号を特定します。

    3. get_claim_status ツールを実行し、現在の手続き状況（書類の受付、確認、支払など）を取得します。

    4. ツールから得られた最新の状況を、お客様へ丁寧にご案内します。


    契約照会の詳細は「get_accounts を使う場面」をご参照ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: komorebi_life
- id: 07995a5a-203e-5eab-b5f4-6c333b7754c4
  title: get_claim_status ツールリファレンス
  body: このツールは、お客様が申し込まれた給付金や保険金の請求手続きが現在どのような状況にあるかを確認するために使用します。エージェントが直接このツールを呼び出すことで、書類の受付状況、審査の進捗、および支払完了までのステータスをリアルタイムで取得し、お客様へご案内いただけます。
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: komorebi_life
- id: 0cc8b6a7-444d-5ea7-99b1-6302f1148e3f
  title: update_policy を使う場面
  body: 'お客様から保険金額の減額や、特約の追加・解約などの契約内容変更を希望された場合に本手続きを行います。手順は以下の通りです。


    1. `verify_identity` を使用し、厳格な本人認証を完了させてください。

    2. `get_accounts` を呼び出し、変更対象となる契約の番号を特定します。

    3. お客様の意向を確認し、変更後の保険金額や追加・削除する特約の詳細を伺います。

    4. `update_policy` ツールを実行し、契約内容を更新します。


    お手続きの詳細は「update_policy ツールリファレンス」をご参照ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: komorebi_life
- id: 9151ad93-eebf-55bd-a01e-4c2048ae2532
  title: update_policy ツールリファレンス
  body: このツールは、既存の保険契約の内容を変更するために使用します。エージェントが直接呼び出すことで、保険金額の増減や特約の変更をシステムに反映させます。引数として、対象となる契約番号と変更内容の詳細を指定します。実行後、契約内容は即時または所定の審査を経て更新されます。
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: komorebi_life
- id: d55eeb1e-8df1-574b-a648-f68f843e0529
  title: close_account を使う場面
  body: 'お客様から保険契約の解約を申し出られた際に本手続きを行います。解約は取り消し不能な操作であるため、慎重に進めてください。


    1. `verify_identity` を行い、ご本人であることを確認します。

    2. `get_accounts` を使用して、解約対象の契約を特定します。

    3. 解約返戻金の有無とその金額について正確にご案内し、お客様の同意を得ます。

    4. `close_account` ツールを実行して契約を終了させます。返戻金がある場合は、指定の口座へ送金されます。


    ツールの仕様は「close_account ツールリファレンス」を確認してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: komorebi_life
- id: cef7fef0-c586-5063-bddd-8fa0e5e867ab
  title: close_account ツールリファレンス
  body: このツールは、保険契約を完全に解約するために使用します。エージェントが直接呼び出し、対象の契約番号を指定して実行します。実行されると契約は失効し、解約返戻金が存在する場合は、あらかじめ登録された口座へ払い戻し手続きが自動的に開始されます。
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: komorebi_life
- id: 719ed546-c994-5bc4-91cb-ba9337b14f5d
  title: get_accounts を使う場面
  body: 'お客様がどの保険契約をお持ちか確認する場合や、特定の手続きに必要な契約番号を特定する場合に使用します。


    1. まず `verify_identity` を実行し、本人確認を完了させてください。認証が完了するまで、機密性の高い情報は開示できません。

    2. `get_accounts` ツールを呼び出し、お客様が保有しているすべての有効な保険契約の一覧を取得します。

    3. 表示された一覧から、お客様が手続きを希望される対象の契約を特定し、内容を確認します。


    ツールの詳細は「get_accounts ツールリファレンス」をご参照ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: komorebi_life
- id: 91c6874c-ca92-5b9f-8c53-6be044431822
  title: get_accounts ツールリファレンス
  body: このツールは、認証済みのお客様が保有している保険契約の一覧を取得するために使用します。エージェントが直接呼び出すことで、現在有効な契約の番号や商品名などの基本情報をまとめて確認でき、以降の個別手続きにおける契約特定に利用します。
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: komorebi_life
- id: 63dbeddf-9281-5fcb-9cb1-03232bc59ea8
  title: update_contact_info を使う場面
  body: 'お客様の住所、電話番号、メールアドレスなどの連絡先情報に変更があった際に行う手続きです。


    1. `verify_identity` を使用し、本人確認を厳格に行います。

    2. `get_accounts` を呼び出し、どの契約に紐づく連絡先を更新するかを特定します（全契約共通の変更か、個別契約の変更かを確認します）。

    3. 新しい連絡先情報を正確に伺い、入力内容に誤りがないか復唱して確認します。

    4. `update_contact_info` ツールを実行し、情報を更新します。


    詳細は「update_contact_info ツールリファレンス」をご覧ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: komorebi_life
- id: a76acc7a-f0b0-5666-af65-a8c413e33c8b
  title: update_contact_info ツールリファレンス
  body: このツールは、お客様の登録連絡先情報を更新するために使用します。エージェントが直接呼び出し、対象の契約番号と新しい連絡先（住所、電話番号、メールアドレス等）を指定して実行します。これにより、今後の通知先や重要書類の送付先が最新の状態に更新されます。
  domain: insurance
