  institution_id: komorebi_life
- id: 9a8c7554-6885-5bbd-bd38-d53582b7e002
  title: こもれび終身保険（低解約返戻金型）：想定外の手数料・金額
  body: '【症状】

    お客様から「解約返戻金の金額が、想定していた金額よりも大幅に少ない」というお問い合わせをいただいた場合。


    【原因】

    本商品は「低解約返戻金型」であり、特定の期間（低解約返戻金期間）内に解約された場合、解約返戻金が標準的な金額の70%に設定されているためです。


    【対応策】

    1. まず、お客様の契約内容を確認し、現在が「低解約返戻金期間」に該当するかをチェックしてください。

    2. 該当する場合、商品設計として返戻金が70%となる仕組みであることを、丁寧にご説明ください。

    3. 払済年齢である60歳までの払込状況と、今後の返戻金推移について改めてご案内します。


    【エスカレーション】

    お客様が納得されない場合や、約款の解釈に関する詳細な説明が必要な場合は、速やかにコンプライアンス部門へエスカレーションし、誠実な解決を図ってください。'
