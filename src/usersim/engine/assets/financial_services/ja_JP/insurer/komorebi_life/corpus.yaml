- id: fcdfa0e4-581e-585a-afdc-77e91042e85b
  title: reinstate_policy を使う場面
  body: '保険料の払込猶予期間を過ぎて契約が失効し、お客様が保障の復活を希望される場合に手続きを行います。


    【手続き手順】

    1. verify_identity により本人確認を行います。

    2. get_accounts で失効している契約を特定します。

    3. 復活可能な所定の期間内であるかを確認します。

    4. 復活には改めて「告知」が必要となるため、現在の健康状態について伺います。

    5. 告知内容に問題がないことを確認し、reinstate_policy を実行して復活を申し込みます。'
