  title: こもれび終身保険（低解約返戻金型）：月払保険料の例（40歳女性、60歳払済）について
  body: 'Q: 40歳の女性が、60歳までに保険料の払込みを完了させる設定にした場合の保険料はいくらになりますか？


    A: ご加入時の年齢や保障額により異なりますが、死亡保険金を5,000,000円とした場合の例として、月払保険料は12,400円となります。詳細な御見積もりは、お客様のご意向とリスク許容度に基づき、客観的なデータを用いてご提案いたします。'
