  title: こもれび終身保険（低解約返戻金型）：規定・約款の変更
  body: 本保険の規定および約款は、法令の改正や運営コストの変動に伴い変更される場合があります。特に「低解約返戻金型」という商品特性上、低解約返戻金期間中に解約された場合の解約返戻金は、標準的なプランの70%という水準に設定されており、この比率は契約時の約款に基づき厳格に適用されます。約款の変更が行われる際は、書面または弊社ウェブサイトにて事前にお知らせいたします。内容についてご不明な点がある場合は、いつでも担当エージェントまでお問い合わせください。
