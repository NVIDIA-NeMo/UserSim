- id: 68eead93-4eee-5866-ab08-bad20907a69d
  title: こもれび定期保険：規定・約款の変更
  body: 'こもれび定期保険の規定および約款は、法令の改正や保険業法に基づく監督指針の変更、または持続可能な保障を提供するための運営コストの適正化に伴い、変更される場合がございます。


    変更がある場合は、書面または弊社ウェブサイトにて事前にお客様へ通知いたします。変更後の規定に同意いただけない場合のお手続きや、クーリング・オフ制度（書面受取後8日以内）の適用範囲については、個別の契約状況により異なりますので、詳細を必ずご確認ください。弊社は透明性の高い商品設計を維持し、変更の根拠を明確に提示することを最優先にいたします。'
  domain: insurance
