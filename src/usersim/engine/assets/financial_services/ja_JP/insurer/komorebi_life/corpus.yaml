- id: 05912254-c350-5ed9-85ac-18111a33157c
  title: こもれび終身保険（低解約返戻金型）：お申込みとご利用開始
  body: 'こもれび終身保険（低解約返戻金型）のお申込みは、以下の手順で進めていただけます。


    1. 保障内容の決定：ご希望の保険金額（例：5,000,000円）と、保険料の払込期間（例：60歳まで）を決定します。

    2. 本人確認：ご本人確認書類と契約者番号をご提示いただき、厳格な本人認証を行います。

    3. 告知義務の履行：現在の健康状態について正しくお知らせください。告知内容に基づき、お引き受けの可否を判定します。

    4. ご契約の成立：審査完了後、保険証券をお送りします。書面受取後8日以内であれば、クーリング・オフ制度により無条件で撤回が可能です。


    手続きが完了し、初回保険料（例：12,400円）の入金が確認された時点で保障が開始されます。'
  domain: insurance
  product_category: shushin_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
