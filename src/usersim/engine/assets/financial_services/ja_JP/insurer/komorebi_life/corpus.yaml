- id: 7288a95d-7ca6-5bb4-97e2-128bed15ccf8
  title: こもれびがん保険：よくあるお手続きの流れ
  body: '「こもれびがん保険」にお申し込みいただき、保障が開始されるまでの一般的な流れをご案内します。


    【お手続きの流れ】

    1. お見積もりとプラン決定

    お客様の年齢や希望する保障内容に基づき、保険料を算出します（例：40歳男性、終身払で1,980円など）。

    2. ご告知（健康状態の確認）

    現在の健康状態について正確にお伝えいただきます。これは「告知義務」に基づき、適切に審査を行うために不可欠なステップです。

    3. お申し込み手続き

    ご本人様確認（フルネームと生年月日の確認）を行い、正式に申し込みを受け付けます。

    4. ご審査と契約成立

    当社にて審査を行い、問題がなければ契約が成立し、保険証券などの重要書類をお送りします。

    5. 待ち期間の開始

    契約成立から90日間の「待ち期間」が始まります。この期間が経過した後に、保障が正式に適用されます。


    【重要事項】

    申込日または書面を受け取った日のいずれか遅い日から8日以内であれば、クーリング・オフ（申込みの撤回）が可能です。また、告知内容に事実と異なる点があった場合、将来的に契約解除や給付金の不払いとなる可能性がありますので、誠実な告知をお願いいたします。'
  domain: insurance
  product_category: gan_hoken
