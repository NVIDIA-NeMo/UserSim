- id: 294138c6-f824-51b7-a167-79f93f904f35
  title: こもれび定期保険：保険期間（年）について
  body: '【よくあるご質問】


    Q. こもれび定期保険の保障期間はどのくらいですか？


    A. 本プランの保険期間（年）は 10 となっております。一定期間、効率的に大きな保障を確保したい方に最適な掛け捨て型のプランです。


    Q. 10年の保険期間が終わった後はどうなりますか？


    A. 保険期間が満了すると保障は終了いたします。将来的な保障の継続をご検討される場合は、改めてその時点でのプラン内容や年齢に基づいたご提案をさせていただきます。


    詳しくは「こもれび定期保険：商品概要」をご参照ください。'
  domain: insurance
