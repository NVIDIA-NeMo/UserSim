- id: fd057bdd-f271-5055-8308-e0741ea4dd73
  title: こもれびがん保険：規定・約款の変更
  body: 'こもれびがん保険の規定および約款は、法令の改正や社会情勢の変化に伴い、変更される場合があります。変更が行われる際は、あらかじめ書面またはWebチャット、電子メール等で通知いたします。


    ■変更の適用範囲

    変更は、主に以下のような項目に適用される可能性があります。

    ・保障内容の改定（例：がん診断一時金 1,000,000円や、がん治療給付金（月額） 100,000円の支給基準の変更）

    ・保険料の改定

    ・告知義務に関する基準の変更


    ■承諾と解除

    約款の変更内容に同意いただけない場合は、契約を解約することが可能です。変更後の条件が適用される前に、所定の手続きを行ってください。


    ■クーリング・オフについて

    なお、新規契約時やプラン変更時に、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申込みを撤回できるクーリング・オフ制度が適用されます。


    詳細な約款の内容については、契約時に交付される保険約款をご参照ください。'
