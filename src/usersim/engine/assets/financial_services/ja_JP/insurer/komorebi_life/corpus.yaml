- id: 67d92187-218c-5357-aef4-b7bbfad6ce94
  title: こもれび終身保険（低解約返戻金型）：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの大切なご契約と資産を守るため、セキュリティの徹底に取り組んでおります。特に「こもれび終身保険（低解約返戻金型）」のような長期的な保障を目的とした商品において、第三者によるなりすましや不正な解約手続きを防ぐことは非常に重要です。


    当社のサポート担当者が、お手続きの際にお客さまへ確認するのは「フルネーム」と「生年月日」のみです。本人確認が完了するまで、ご契約内容の変更や解約などの手続きは行いません。


    【重要：当社の対応について】

    当社が、電話やメール、チャットを通じて、以下のような機密情報を要求することは一切ございません。

    ・クレジットカード番号

    ・口座の暗証番号

    ・Webサービスのパスワード

    ・身分証明書（マイナンバーカード等）の番号そのもの


    もし、当社を名乗る人物からこれらの情報の提示を求められた場合は、詐欺の可能性がございます。すぐにやり取りを中断し、当社の正規窓口へご連絡ください。また、身に覚えのない手続きの通知が届いた場合も、速やかにカスタマーセンターへお知らせいただけますようお願い申し上げます。'
  domain: insurance
  product_category: shushin_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 74a3259f-21d1-580e-b93d-bcee31df5b49
  title: こもれび終身保険（低解約返戻金型）：規定・約款
  body: '本規定は、「こもれび終身保険（低解約返戻金型）」の契約における権利と義務を定めるものです。


    1. 告知義務について

    ご契約者は、契約時に健康状態などの重要事項を正確に伝える「告知義務」を負います。事実に反する告知をした場合、保険業法および内部規定に基づき、ご契約の解除や、保険金・給付金が支払われないことがあります。


    2. クーリング・オフについて

    お申し込み後、申込日または契約内容を記載した書面（電磁的記録を含む）を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回いただけます。


    3. 解約返戻金に関する特則

    本商品は「低解約返戻金型」であり、あらかじめ定められた低解約返戻金期間中に解約された場合、解約返戻金の水準は70%となります。期間経過後は、通常の解約返戻金が適用されます。


    4. 保険料の払込み

    プランにより異なりますが、例として保険料の払込みが終わる年齢を60歳と設定した場合、60歳までにすべての払込みを完了させる義務があります。


    5. 契約の終了

    保険金の支払い、満期、または契約者による解約によって本契約は終了します。解約時の返戻金は、前述の低解約返戻金期間の規定に従い計算されます。'
