- id: 148718d5-2523-59c5-ae1b-7e3d114545d8
  title: こもれびがん保険：登録内容の変更
  body: 'ご契約内容やご登録情報の変更を希望される際は、以下の手順でお手続きください。


    ■ご準備いただくもの

    ・ご契約者様ご本人様であること


    ■お手続きの手順

    1. 本人確認

    カスタマーセンターまたはチャットにて、お客様の「フルネーム」と「生年月日」をお伝えください。ご本人様確認が完了します。


    2. 変更内容の伝達

    「住所を変更したい」「保険金の受取人を変更したい」など、具体的にどのような内容を変更したいかを伝えてください。


    3. 必要書類の提出（必要な場合のみ）

    受取人の変更など、法的な証明が必要な手続きの場合は、当社から案内する必要書類を郵送またはアップロードしていただきます。


    4. 変更完了の通知

    当社にて内容を確認し、手続きが完了しましたら、変更内容を記載した書面または電子通知をお送りします。


    ■ご注意点

    クレジットカード情報の変更など、機密情報に関するお手続きでは、当社からカード番号などを直接伺うことはございません。所定の安全な変更方法をご案内いたします。'
