  title: こもれび終身保険（低解約返戻金型）：手数料一覧
  body: '【保険料】

    リスクと年齢に基づき適正に設定されます（例：月払12,400円）。


    【事務手数料および貸付手数料】

    公平なプラン維持と運営コスト回収のため、契約者貸付等の手続きに際して所定の手数料を設定しております。個別の手数料額については、ご契約内容に基づき明確な根拠を提示いたします。詳細は約款をご確認ください。'
