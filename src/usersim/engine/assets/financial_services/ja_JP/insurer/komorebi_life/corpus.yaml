- id: d738f9d7-c281-5cb4-8f79-dc66a4b6b658
  title: こもれび個人年金保険：重要事項のご説明
  body: '【法令遵守と保障】

    当社は金融庁の監督および保険業法を厳格に遵守しております。本契約は生命保険契約者保護機構により、責任準備金等の90%まで補償されます。


    【重要事項】

    ・告知義務について：契約時に健康状態等を正しく伝える義務があります。事実に反する告知をした場合、契約解除や保険金・給付金が支払われないことがあります。

    ・クーリング・オフ：申込日または書面受取日のいずれか遅い日から8日以内であれば、無条件で契約を撤回いただけます。

    ・プラン内容：受取開始年齢は65歳、受取期間は10年として設計されています。


    【ご注意】

    個別の税務相談や具体的な医療診断などの専門的助言は行っておりません。客観的なデータに基づいたご提案をさせていただきます。'
