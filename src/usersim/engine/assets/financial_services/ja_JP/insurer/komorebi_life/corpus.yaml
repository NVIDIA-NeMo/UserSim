  institution_id: komorebi_life
- id: 09353de2-5f56-511c-a460-05b9f63d0f0d
  title: こもれび定期保険：限度額・制限と注意事項
  body: '「こもれび定期保険」の契約にあたっての制限事項および重要な注意事項についてご案内します。サポート担当者は、お客様への案内の際、以下の数値を正確に伝えてください。


    【契約上の制限】

    ・契約できる年齢の上限：70歳までとなります。これを超える年齢の方はご契約いただけません。

    ・保険期間：10年と定められております。


    【重要な注意事項】

    ・告知義務について：ご契約時に健康状態などを正確に伝える義務があります。事実に反する告知をした場合、契約解除や保険金・給付金が支払われないことがありますので、十分にご注意ください。

    ・クーリング・オフ制度：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回することが可能です。


    【安全性の保障について】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があることを適切に案内してください。


    詳細については、「こもれび定期保険：重要事項のご説明」をご参照ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
