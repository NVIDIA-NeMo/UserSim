- id: 1ec0ac57-ee7a-5398-8449-2b9a2ea73e11
  title: こもれび個人年金保険：おすすめの方と主な使い方
  body: '「こもれび個人年金保険」は、将来の自分への贈り物として、計画的に老後資金を準備したい方に最適なプランです。


    【このような方におすすめです】

    ・公的年金だけでなく、民間の年金で上乗せの安心を得たい方

    ・投資のような大きなリスクを避け、確実性の高い準備をしたい方

    ・若いうちから少額ずつ、無理のない範囲で積立を始めたい方


    【プランの活用例】

    例えば、30歳で加入し65歳まで保険料を払い込んだ場合、月払保険料の例として10,000円という設定で準備を進めることが可能です。このように、人生の早い段階から計画的に備えることで、老後の生活をより豊かに、安心したものにできます。


    【本プランの魅力】

    ・シンプルで分かりやすい設計：複雑な条件を排除し、誰でも理解しやすい仕組みです。

    ・安定した資産形成：返戻率の例として108%という数字が示す通り、誠実かつ合理的な運用により、将来の安心をサポートします。

    ・受取開始の明確化：65歳から10年という受取期間が設定されており、ライフプランが立てやすくなっています。


    将来への不安を安心に変え、あなたらしい人生設計をサポートするパートナーとして、ぜひご活用ください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 85032c16-a54d-59d5-aac7-fbabb9897f5f
  title: こもれび個人年金保険：年金の受取期間（年）について
  body: '【質問】年金はいつから、どのくらいの期間受け取ることができますか？


    【回答】本プランでは、年金の受取開始年齢を65歳と定めております。受取が始まった後は、10年間にわたって年金をお支払いいたします。


    【質問】受取期間を途中で変更することはできますか？


    【回答】原則として、契約時に定められた受取期間（10年）の変更はできません。ライフプランに基づいた適切なプランニングをお願いいたします。詳細については「こもれび個人年金保険：規定・約款」をご確認ください。'
