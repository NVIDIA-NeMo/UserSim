- id: 0a57b616-f274-5bf5-89d3-f954b815725e
  title: こもれび定期保険：ご利用開始までの手順
  body: 'お客様がこもれび定期保険のご利用を開始されるまでの流れは以下の通りです。サポート担当者は、お客様が各ステップを十分に理解できるようご案内ください。


    1. 意向把握とプラン提案：お客様のリスク許容度を尊重し、客観的なデータに基づいた最善の提案を行います。

    2. お申込みと告知：契約時に健康状態などを正しく伝える「告知義務」についてご説明し、正確な情報を収集します。

    3. ご審査（引受審査）：告知内容に基づき、保障の可否を判断します。

    4. ご契約成立：審査完了後、保険証券等の書面を送付します。お客様は書面受取後8日以内であれば、クーリング・オフにより無条件で契約を撤回することが可能です。


    手続きの際は、必ず厳格な本人認証を実施してください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 294138c6-f824-51b7-a167-79f93f904f35
  title: こもれび定期保険：保険期間（年）について
  body: '【ご質問】保険期間はどのくらいに設定できますか？

    【回答】こもれび定期保険では、例えば10年といった一定の期間に限定して保障を確保するプランをご用意しております。少ない保険料で、必要な期間だけ大きな保障を確保できるため、お子様の成長期など、集中的に保障が必要なライフステージに非常に効率的なプランです。'
  domain: insurance
  product_category: teiki_hoken
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 916399bb-c2ff-5d7b-9c0a-0e4248353d3e
  title: こもれび定期保険：登録内容の変更
  body: 'ご契約者様の住所や連絡先などの登録内容を変更する手順は以下の通りです。


    1. 本人確認：まず、ご契約者番号と本人確認書類をご提示ください。厳格な本人認証が完了するまで、お手続きは開始いたしません。

    2. 変更内容の伝達：変更を希望される項目（住所、電話番号、メールアドレスなど）と、新しい内容を弊社担当者へお伝えください。

    3. 内容の確認と修正：担当者が現在の登録内容と照らし合わせ、変更事項を正確に記録します。

    4. 完了通知の受取：変更手続きが完了した後、弊社より確定通知をご案内いたします。これで登録内容の変更は完了です。'
  domain: insurance
  product_category: teiki_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 3be01fc0-4713-5878-b32a-bac24fa86a8f
  title: こもれび定期保険：ログインできない・アクセスできない
  body: '【症状】ウェブサイトから契約内容の確認やお手続きにアクセスできない。


    【考えられる原因と確認事項】

    ・ご入力いただいた契約者番号またはパスワードに誤りがある。

    ・セキュリティ保護のため、アカウントが一時的にロックされている。


    【解決策】

    1. 入力内容を再度ご確認ください。特に半角・全角の区別に注意してください。

    2. パスワードを忘れた場合は、再設定の手続きを行ってください。


    【エスカレーション】

    上記を試しても解決しない場合は、弊社コンプライアンス部門および専門部署にてアカウントの状態を調査いたします。調査完了後、復旧方法について改めてご案内いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 48fffc8a-c737-52bf-a1ad-70fbca315d6b
  title: こもれび定期保険：ご利用条件による違い
  body: '【加入可能条件】

    ・加入年齢：最大70歳までの方がお申込みいただけます。70歳を超える場合は、本プランの対象外となります。

    ・健康状態：告知義務に基づき、正しく健康状態を告知していただいた上で、審査の結果、加入可能と判断された方が対象です。


    保険料は、お客様のリスクと年齢に基づき適正に設定されます。'
  domain: insurance
