- id: 0ce733d9-4591-5e00-8c2d-1c970f3f686e
  title: こもれび終身保険（低解約返戻金型）：商品概要
  body: 'こもれび終身保険（低解約返戻金型）は、一生涯の死亡保障を確保しながら、将来に向けた貯蓄性をバランスよく両立させたプランです。シンプルで分かりやすい設計により、あらゆる世代の方が将来に安心を持てるライフプランニングをサポートします。


    【本プランの特徴】

    低解約返戻金型を採用しており、保険料を抑えながら効率的に保障を準備できます。ただし、低解約返戻金期間中に解約された場合、解約返戻金の水準は70%となりますのでご注意ください。


    【保障内容と保険料の例】

    ・保険金額の例：5,000,000円

    ・月払保険料の例：12,400円（40歳女性、60歳払済の場合）


    【保険料の払込みについて】

    保険料の払込みが終わる年齢を60歳として設定するプランなど、ライフステージに合わせた計画的な準備が可能です。


    【安心のサポート】

    万が一の破綻時には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。誠実な顧客対応と透明性の高い設計で、お客様の人生に寄り添うパートナーとしてサポートいたします。'
  domain: insurance
  product_category: shushin_hoken
