- id: 6f6090dc-5461-5c22-a0d3-3591651d9fe7
  title: こもれび終身保険（低解約返戻金型）：他社の一般的な商品との比較
  body: '一般的な終身保険と、当社の「こもれび終身保険（低解約返戻金型）」を比較します。


    【一般的・標準的な終身保険】

    ・保険料：比較的高い傾向にあります。

    ・解約返戻金：加入初期から一定の水準で積み上がります。

    ・向いている方：早期に解約する可能性がある方、または高い保険料を支払ってでも早期の返戻金を重視する方。


    【こもれび終身保険（低解約返戻金型）】

    ・保険料：低解約返戻金設計により、保険料が抑えられています。

    ・解約返戻金：低解約返戻金期間中の解約返戻金の水準は70%と低く設定されています。

    ・向いている方：一生涯の保障を目的とし、途中で解約せず長期的に保有できる方。合理的なコストで大きな保障（例：5,000,000円）を準備したい方。


    どちらが正解ということはございません。保障の確保とコストのバランスに合わせてお選びください。'
