- id: a6022270-7885-536d-99d4-ce1f3ab86919
  title: こもれび医療保険：状況・履歴の確認
  body: 'ご契約内容の状況や、これまでの給付金お支払い履歴を確認する手順をご案内します。


    【ご用意いただくもの】

    ・お客様のご本人確認情報（フルネームと生年月日）


    【確認の手順】

    1. カスタマーセンターへご連絡いただき、ご本人確認のため、お客様のフルネームと生年月日をお伝えください。

    2. 担当者が本人確認を完了させた後、「現在の契約状況」または「給付金の支払い履歴」の確認を希望される旨をお伝えください。

    3. 担当者が最新のデータを確認し、現在の保障内容や、過去にいつ、いくらの給付金が支払われたかを口頭または書面にてご案内します。


    【完了の目安】

    担当者から「現在の状況は〇〇です」との説明を受け、不明点が解消された時点で確認完了となります。


    ※クレジットカード番号やパスワードなどの機密情報は、確認の手続きにおいて一切要求いたしませんのでご安心ください。'
