  title: こもれび個人年金保険：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが「保留中」のまま完了しない場合は、以下の点をご確認ください。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：ご提示いただいた書類の有効期限が切れている、または記載内容に不備がある場合がございます。

    2. 告知内容の不足：告知義務に基づく健康状態の回答に不足がある場合、確認のため手続きが一時停止いたします。


    【解決方法】

    不足している書類や情報の再提示を私たちにお申し付けください。速やかに確認作業を行い、手続きを再開いたします。


    【エスカレーションについて】

    複雑な案件や、お手続きに関するご苦情については、専門部署およびコンプライアンス部門へエスカレーションし、誠実かつ迅速に解決を図ります。'
