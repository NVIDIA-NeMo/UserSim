- id: 8abf206e-938d-5f52-87c6-4273e622d12c
  title: こもれびがん保険：商品概要
  body: '「こもれびがん保険」は、がん診断時のまとまった一時金と治療費を重点的に保障する、特化型のプランです。がんという大きな病気に直面した際、治療費だけでなく生活費への備えとしても活用いただけるよう設計されています。


    【主な保障内容】

    ■がん診断一時金：1,000,000円

    がんと診断された際に、まとまった金額を一度にお支払いします。


    ■がん治療給付金（月額）：100,000円

    治療中の負担を軽減するため、月々のお支払いでサポートします。


    【保険料の例】

    ■月払保険料：1,980円（40歳男性、終身払の場合）


    【ご注意点】

    ■待ち期間：90

    ご契約から90日間は、保障が適用されない「待ち期間」がございます。この期間中にがんと診断された場合は、保障の対象外となりますのでご注意ください。


    本プランは、公的医療保険の高額療養費制度でカバーしきれない自己負担分を補完し、安心して治療に専念できる環境を整えるための商品です。'
  domain: insurance
  product_category: gan_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 339cad93-76b6-5a5c-88c9-996c89caf1d1
  title: こもれびがん保険：がん診断一時金について
  body: '「こもれびがん保険」のがん診断一時金について、よくあるご質問にお答えします。


    Q. がん診断一時金とはどのような保障ですか？

    A. がんと診断された際に、治療費や生活費として自由にご活用いただける1,000,000円の一時金をお支払いする保障です。


    Q. いつ受け取ることができますか？

    A. 医師による診断書に基づき、がんであると診断されたことが確認された後、請求手続きを経てお支払いいたします。


    Q. 待ち期間中の診断でも受け取れますか？

    A. いいえ。ご契約から90日間の待ち期間中に診断された場合は、お支払い対象外となります。詳細については「こもれびがん保険：商品概要」をご確認ください。'
