- id: dc8a9a56-3589-5f09-8437-7ea60743226b
  title: こもれび医療保険：入院中の手術給付金について
  body: '【ご質問】

    入院して手術を受けた場合、どのような給付金が支払われますか？


    【回答】

    入院中に手術を受けられた場合は、「入院中の手術給付金」として100,000円をお支払いいたします。


    なお、この給付金に入院日額分の「入院給付金」が別途加算されます。詳細な保障内容については、「こもれび医療保険：商品概要」にてご確認いただけます。お客様のご状況に合わせて、最適なプランをご提案させていただきます。'
