- id: 9674fc69-6210-59f3-8ffd-9df18b533f8f
  title: こもれびがん保険：金利・料率の決まり方と適用
  body: '「こもれびがん保険」の保険料は、リスクの分散と安定した給付金支払いのための原資として運用し、合理的かつ透明性の高い料率で決定しています。


    【保険料の決定要因】

    本商品の保険料は、主に「加入時の年齢」「性別」「払込期間」に基づいて算出されます。がんの発症リスクという統計的なデータに基づき、すべての顧客に公正に適用される標準的なケアをもって料率を設定しています。


    【保険料の例】

    ・40歳男性（終身払）：月払保険料 1,980円


    【適用について】

    上記はあくまで例であり、加入者の条件によって異なります。一度決定した保険料は、契約形態（終身払など）に基づき維持されます。保険料は、将来的に多くのお客さまへ確実に1,000,000円の診断一時金や月額100,000円の給付金を支払うための原資として適切に管理・運用されます。'
