- id: f16e4311-30b4-5b19-9ae3-6f98d0443819
  title: こもれび終身保険（低解約返戻金型）：よくあるお手続きの流れ
  body: '本商品のお申込みから保障開始までの一般的な流れをご案内します。


    1. ご意向の確認とプラン設計：お客様のライフステージに合わせ、保険金額（例：5,000,000円）や払込期間（例：60歳まで）を決定します。

    2. 告知書の作成：健康状態などを正しく伝える「告知義務」に基づき、書類を作成し当社へ提出してください。

    3. ご審査：当社にて告知内容を審査し、お引き受けの可否を判定します。

    4. ご契約成立：保険金請求権の発生日（または第1回保険料の払込日）をもって契約成立となります。

    5. 保険証券の受取：ご契約内容を記載した書面をお届けします。受取後8日以内であれば、クーリング・オフによる無条件撤回が可能です。'
