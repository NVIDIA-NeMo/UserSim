  body: '【お申込み条件と判定】

    ・年齢条件：規定の加入年齢範囲内であること → お申込みいただけます

    ・告知義務：健康状態等を正しく告知し、審査基準を満たしていること → お申込みいただけます

    ・本人確認：有効な本人確認書類および契約者番号による認証が完了していること → お申込みいただけます


