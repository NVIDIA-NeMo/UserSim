- id: 0beb7800-875c-57c1-8269-06b87c2f02ee
  title: こもれび個人年金保険：お手続きが完了しない・保留中のまま
  body: '【症状：お申込み手続きが「保留」となっており、完了しない】


    お客様から「手続きをしたはずなのに、完了の通知が来ない」「ステータスが保留のままである」というお問い合わせをいただいた場合の確認事項です。


    【考えられる原因と確認手順】

    1. 告知事項の不足

    告知義務に基づき、健康状態などの回答に不備がある場合、確認のために手続きが保留されることがあります。弊社より不足事項について改めてご連絡いたしますので、内容をご確認ください。


    2. 本人確認書類の不一致

    ご登録いただいたフルネームまたは生年月日が、公的書類と一致しない場合に保留となることがあります。


    3. 支払い情報の不備

    クレジットカードや口座情報の入力に誤りがある場合、保険料の引き落とし設定ができず、手続きが止まることがあります。


    【解決方法】

    弊社スタッフが現在の保留理由を特定し、不足している情報や修正が必要な箇所をお伝えします。お客様に不足分を補っていただくことで、速やかに手続きを再開いたします。


    【エスカレーション】

    社内での確認により解決しない複雑な案件や、手続きの遅延に対する苦情については、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションし、透明性のある解決を図ります。'
