  title: こもれび個人年金保険：年金の受取開始年齢について
  body: 'Q：年金はいつから受け取ることができますか？

    A：本プランでは、受取開始年齢を65歳として設定しております。これにより、定年退職後の生活資金として計画的にご活用いただけます。


    Q：受取期間はどのくらいですか？

    A：受取期間は10年となっており、一定期間にわたって安定した収入を確保できる設計です。詳細なプラン内容は「こもれび個人年金保険：商品概要」をご参照ください。'
