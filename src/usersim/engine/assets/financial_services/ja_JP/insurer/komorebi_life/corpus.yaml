- id: 4079ee0c-8db2-5d0c-b393-8b1f9895d305
  title: こもれび定期保険：重要事項のご説明
  body: 'ご契約にあたり、以下の重要事項を必ずご確認ください。


    【告知義務について】

    契約時に健康状態を正しく伝える義務があります。事実と異なる告知をした場合、契約解除や保険金・給付金が支払われないリスクがあります。


    【クーリング・オフ】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。


    【責任準備金の補償】

    生命保険契約者保護機構により、責任準備金等の90%まで補償されます。


    詳細な規定については「こもれび定期保険：規定・約款」をご参照ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: disclosure
