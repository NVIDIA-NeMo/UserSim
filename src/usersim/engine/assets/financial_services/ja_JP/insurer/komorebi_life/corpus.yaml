- id: 142ae301-1525-58af-b300-56fd16f7a56d
  title: こもれびがん保険：不正利用からお客さまを守るために
  body: 'こもれびがん保険をご検討中のお客さまへ、安心してお手続きいただくための重要なご案内です。昨今、保険契約をかたった巧妙なフィッシング詐欺や個人情報の窃取が報告されています。


    当社では、受取人の変更や契約内容の変更など、重要な手続きを行う前に、必ず本人確認書類および契約者番号を用いた厳格な本人認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行はいたしません。また、当社からメールやSMSで、クレジットカードの暗証番号やパスワードを直接伺うことはございません。


    もし不審な連絡を受け取られた場合は、速やかに当社の専用窓口までお知らせください。迅速な対応により、不正な契約変更や給付金の不正請求を未然に防ぎ、お客さまの権利を守ります。'
