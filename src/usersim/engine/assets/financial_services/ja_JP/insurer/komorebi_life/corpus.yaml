- id: c7025df9-42b2-5de8-9c83-57a05fd4e358
  title: こもれび医療保険：安全にご利用いただくためのポイント
  body: 'お客様の重要な情報を守るため、こもれび医療保険では厳格な本人確認を実施しております。受取人の変更や契約内容の変更など、状態を変化させるすべてのお手続きの前には、必ず「本人確認書類」および「契約者番号」を用いた認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行は一切行いませんのでご了承ください。


    また、当社からメールや電話で、認証手続き以外に暗証番号やパスワードを直接お伺いすることはございません。不審な連絡があった場合は、速やかに担当窓口までお知らせください。お客様の安心と信頼を最優先に、セキュリティ体制の強化に努めております。'
