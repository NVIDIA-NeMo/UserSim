- id: 1104312f-312b-5e43-a506-16175805754e
  title: こもれび終身保険（低解約返戻金型）：リスクについてのご説明
  body: '本商品にご加入いただく前に、以下のリスクと制度について必ずご確認ください。


    【解約に伴う元本割れのリスク】

    本商品は低解約返戻金型です。低解約返戻金期間中に解約された場合、解約返戻金の水準は70%となります。このため、それまでに支払った保険料の合計額を下回る（元本割れする）可能性が非常に高い商品です。長期的な保有を前提にご検討ください。


    【告知義務違反のリスク】

    ご契約時の健康状態について不実の告知があった場合、告知義務違反となり、保険業法に基づきご契約が解除されることがあります。その際、保険金や給付金が支払われない可能性があります。


    【会社の破綻時の補償について】

    万が一、当社が破綻した場合、生命保険契約者保護機構により、補償対象契約の責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減されることがある点にご留意ください。


    【税制について】

    生命保険料控除の適用により所得税が軽減されます。新制度では区分ごとに最高4万円、合計で最高12万円まで適用されます。なお、2026年分と2027年分は、23歳未満の扶養親族がいる方の一般生命保険料控除が最高6万円（合計上限は12万円のまま）となります。個別の税務相談は行えませんので、管轄の税務署へご相談ください。'
  domain: insurance
  product_category: shushin_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
