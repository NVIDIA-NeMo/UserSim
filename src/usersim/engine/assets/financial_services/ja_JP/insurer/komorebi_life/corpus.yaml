- id: 9a8c7554-6885-5bbd-bd38-d53582b7e002
  title: こもれび終身保険（低解約返戻金型）：想定外の手数料・金額
  body: '【お客様からのご相談】

    「解約返戻金の金額を確認したが、想定していたよりも大幅に少ない。計算が間違っているのではないか」


    【原因の確認】

    この現象が発生している場合、多くはお客さまが現在「低解約返戻金期間」にあることが原因です。本商品は、保険料を抑える代わりに、特定の期間内に解約した際の返戻金を低く設定しております。


    【確認ステップ】

    1. ご契約時の商品概要書または保険証券を確認し、「低解約返戻金期間」がいつまでかを確認してください。

    2. 現在の日付がその期間内であるかを確認します。


    【解決策とご案内】

    低解約返戻金期間中の解約返戻金の水準は70%と定められております。これは商品設計上の仕様であり、計算ミスではございません。期間が経過すれば返戻金水準は上昇します。


    【エスカレーション】

    お客様が期間の認識について強く不信感をお持ちの場合や、約款の説明不足を指摘された場合は、速やかに専門のコンプライアンス部門へエスカレーションし、誠実な解決プロセスを提供してください。'
