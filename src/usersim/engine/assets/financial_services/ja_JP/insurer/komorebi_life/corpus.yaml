- id: e2433bd7-a665-5e72-876e-5aa6e81a1e50
  title: こもれびがん保険：当社の似た商品との比較
  body: '「こもれびがん保険」と、幅広くカバーする「こもれび医療保険」の比較です。


    | 比較項目 | こもれびがん保険 | こもれび医療保険 |

    | :--- | :--- | :--- |

    | 保障の目的 | がん治療への重点的な備え | 入院・手術全般への幅広い備え |

    | 特徴的な給付 | がん診断一時金：1,000,000円 | 入院日額給付金（日ごとの保障） |

    | 継続的なサポート | がん治療給付金：月額100,000円 | 入院期間に応じた給付金 |

    | 適用制限 | 待ち期間（90日）あり | 原則として待ち期間なし |


    【どちらを選ぶべきか】

    ・がん診断時にまとまった資金（1,000,000円）を確保し、治療に専念したい方は「こもれびがん保険」が適しています。

    ・がんだけでなく、あらゆる病気やケガによる入院・手術費用を幅広くカバーしたい方は「こもれび医療保険」が適しています。


    お客様の意向とライフプランに基づき、最適なプランをご提案いたします。'
