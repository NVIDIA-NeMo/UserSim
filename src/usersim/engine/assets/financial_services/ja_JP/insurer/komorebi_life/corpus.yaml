- id: 6c7e9edc-d8a3-5e7b-8d46-e46202ad071b
  title: こもれび個人年金保険：登録内容の変更
  body: 'ご住所、お名前、お支払い方法などのご登録内容を変更される際の手順をご案内いたします。


    【ご準備いただくもの】

    ・ご契約者様ご本人によるお手続きをお願いいたします。


    【お手続きの手順】

    1. 本人確認：担当者に「登録内容の変更を希望する」旨をお伝えください。まず、ご本人確認のため「フルネーム」と「生年月日」をお伺いします。

    2. 変更内容の提示：変更したい項目（例：住所の変更、振替口座の変更など）と、新しい情報を正確にお伝えください。

    3. 内容の確認と受理：担当者が変更内容をシステムに反映し、間違いがないか確認事項を読み上げますので、内容に同意してください。

    4. 完了通知の受取：手続き完了後、変更内容が反映されたことを知らせる確認通知（書面または電磁的記録）をお受け取りください。これで手続きは完了です。


    【ご注意】

    ・クレジットカード番号や暗証番号などの機密情報は、いかなる場合もお伺いいたしませんのでご注意ください。

    ・複雑な変更内容や、権利関係が関わる案件については、内部規定に基づき専門のコンプライアンス部門が内容を確認するため、お時間をいただく場合がございます。'
