- id: ca3a2456-7388-5016-bda2-0de064e2caa2
  title: こもれび医療保険：ご利用開始までの手順
  body: 'こもれび医療保険のご契約から保障開始までの流れを詳しくご案内いたします。お客様が迷わず手続きを完了できるよう、以下のステップで進めてまいります。


    1. お申込みと告知

    お客様の意向に基づき、プランの内容を決定し、お申込みいただきます。この際、「告知義務」に基づき、健康状態等を正確にお伝えいただきます。事実に反する告知をした場合、将来的に契約解除や給付金が支払われないことがあるため、誠実な回答をお願いいたします。


    2. ご審査

    お伺いした告知内容に基づき、適切にご審査を行います。審査の結果、ご契約をお引き受けできるかどうかが決定いたします。


    3. ご契約の成立と書類の送付

    審査通過後、ご契約が成立します。保険証券などの契約内容を記載した書面をお送りいたします。


    4. クーリング・オフ期間の確認

    お申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回できる「クーリング・オフ」制度が適用されます。


    【保障内容の例】

    ・入院給付金日額：10,000円

    ・1回の入院の支払限度日数：60日

    ・入院給付金の通算支払限度日数：1095日

    ・入院中の手術給付金：100,000円

    ・外来の手術給付金：50,000円

    ・先進医療給付金の通算限度額：20,000,000円

    ・月払保険料の例（35歳女性、終身払）：2,480円


    以上のお手続きを経て、安心のライフプランニングが始まります。'
  domain: insurance
  product_category: iryo_hoken
  document_type: product_sheet
  source_authority: official
