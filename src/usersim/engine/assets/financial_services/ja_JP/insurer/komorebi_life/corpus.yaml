  title: こもれび終身保険（低解約返戻金型）：手数料と費用
  body: 'Q：このプランにかかる費用について教えてください。


    A：主にかかる費用は月々の保険料です。例えば、プラン設計によって月々12,400円といった保険料をお支払いいただきます。また、契約者貸付をご利用の際は、公平なプラン維持と運営コスト回収のため、所定の手数料が発生いたします。詳細な料金体系は「こもれび終身保険（低解約返戻金型）：手数料一覧」にてご確認いただけます。'
