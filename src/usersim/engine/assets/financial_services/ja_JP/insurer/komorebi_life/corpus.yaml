- id: 54c70ddb-8796-5c2f-b2ab-fc52a1539390
  title: こもれび医療保険：お取引が拒否された・制限された
  body: '【症状】

    受取人の変更や契約内容の変更手続きを申し出た際、手続きが進まない、あるいは拒否された。


    【考えられる原因】

    ・本人認証書類の不備、または契約者番号との不一致。

    ・告知義務違反などの理由により、契約に制限がかかっている。


    【確認と解決策】

    1. 本人確認の再実施：最新の有効な本人確認書類をご提示いただき、認証をやり直してください。

    2. 書類不備の解消：不足している書類がある場合は、速やかにご提出をお願いいたします。


    【エスカレーション】

    認証に問題がないにもかかわらず制限が解除されない場合は、コンプライアンス部門および専門部署にて詳細な調査を行います。調査結果および今後の手続きについては、後日改めてご連絡いたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 82e5e28f-ab02-5162-abd0-3f7633ce9c8f
  title: こもれび医療保険：切替えや上位プランを検討するとき
  body: 'お客様が保障の拡充を検討される際は、現状の「こもれび医療保険」の基準（例：月払保険料 2,480円などの例）と、追加したい保障内容を比較してご提案ください。


    特に「がん治療への特化」を希望される場合は、包括的な医療保障に加えて「こもれびがん保険」の併用をご案内することが適切です。お客様のライフステージやリスク許容度に基づき、客観的なデータを用いて最善のプランを提示してください。'
  domain: insurance
