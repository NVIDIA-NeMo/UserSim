  body: 本保険の規定および約款は、法令の改正や社会情勢の変化に伴い、変更される場合がございます。変更にあたっては、事前に書面またはウェブサイトにてご案内いたします。年金受取開始年齢（65歳）や年金受取期間（10年）などの基本設計に変更が生じる場合は、特に詳細な周知に努めます。なお、契約者は書面受取後8日以内であれば、クーリング・オフ制度により無条件で契約を撤回できる権利を有します。約款の変更内容がお客様の意向に沿わない場合は、所定の手続きにより解約を検討いただけます。
