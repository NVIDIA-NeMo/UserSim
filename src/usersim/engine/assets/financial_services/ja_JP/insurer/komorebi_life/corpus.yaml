- id: c7025df9-42b2-5de8-9c83-57a05fd4e358
  title: こもれび医療保険：安全にご利用いただくためのポイント
  body: 'こもれび医療保険を安心してお使いいただくために、セキュリティに関する重要なポイントをご案内いたします。


    【当社が絶対に要求しない情報】

    こもれび生命では、どのような場合であっても、電話やメール、チャットを通じて以下の機密情報を要求することはございません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・Webサービスのパスワード

    ・身分証明書番号（マイナンバー等）


    【本人確認の手続きについて】

    ご契約内容の変更や給付金の請求手続きを行う際は、まずお客様の「フルネーム」と「生年月日」を確認し、本人確認を完了させます。これら以外の機密情報を求められた場合は、速やかに中断し、不審な連絡としてご注意ください。


    【不審な連絡への対応】

    万が一、当社をかたる不審な電話やメールを受け取った場合や、心当たりのない手続き通知が届いた場合は、すぐにご相談ください。迅速かつ誠実に対応し、お客様の不利益を最小限に抑えるための解決プロセスを提供いたします。


    【ご注意】

    金融庁の監督および保険業法に基づき、私たちは厳格なデータプライバシー保護を徹底しております。お客様の大切な情報を守るため、ご協力をお願い申し上げます。'
