- id: 126c1b73-62f0-5455-825a-c822d9384430
  title: こもれびがん保険：安全にご利用いただくためのポイント
  body: 'こもれびがん保険を安全にご利用いただくために、以下のセキュリティ上の注意点をご確認ください。


    ■当社の対応について

    こもれび生命では、お手続きの前に必ずお客様の「フルネーム」と「生年月日」を確認し、ご本人様であることを確認いたします。しかし、どのような場合であっても、以下の機密情報を電話やメール、チャットで要求することは一切ございません。


    ・クレジットカード番号

    ・暗証番号（PIN）

    ・パスワード

    ・身分証明書番号


    ■不審な連絡への注意

    当社をかたる人物から、上記のような情報を求める連絡があった場合は、すぐにお電話を切ってください。また、不自然なURLが記載されたメールのリンクはクリックせず、速やかに削除をお願いいたします。


    ■万が一、疑わしいと感じたときは

    個人情報の漏えいや不正利用の疑いがある場合は、直ちに当社のカスタマーセンターまでご連絡ください。迅速に状況を確認し、対応させていただきます。'
