- id: ee9f7a45-6e83-55f0-b14d-718f1e6860ee
  title: こもれび終身保険（低解約返戻金型）：保険料の払込みが終わる年齢について
  body: '【質問】保険料の払込みはいつまで続ける必要がありますか？


    【回答】本プランでは、あらかじめ「保険料の払込みが終わる年齢」を設定いただけます。例えば、設定を60歳とした場合、60歳で払込みが完了し、以降は保険料を支払うことなく一生涯の保障を継続いただけます。


    【例】

    40歳女性の方が、保険料の払込みが終わる年齢を60歳としてご加入された場合、月払保険料の例は12,400円となります。このように、計画的に積立を完了させることが可能です。詳細は「こもれび終身保険（低解約返戻金型）：商品概要」をご確認ください。'
