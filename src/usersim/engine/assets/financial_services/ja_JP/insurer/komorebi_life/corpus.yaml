- id: 322cc13d-5ec6-5ae0-a2af-9d29ec6c2159
  title: こもれびがん保険：切替えや上位プランを検討するとき
  body: 「こもれびがん保険」から他のプランへの切替えを検討される際は、保障の目的を明確にしてください。本商品はがん治療に特化し、診断時に1,000,000円のまとまった資金を確保できるプランです。一方で、入院・手術全般への備えを広げたい場合は、「こもれび医療保険：商品概要」で案内している包括的なプランが適しています。保障内容を重複させず、ライフステージに合わせた最適な組み合わせをご提案します。
