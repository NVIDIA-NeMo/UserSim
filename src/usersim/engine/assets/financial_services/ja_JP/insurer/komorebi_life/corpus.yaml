- id: 2cf53413-b501-5ce9-ae50-588f3fa3e594
  title: こもれび定期保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの資産と大切な情報を守るため、厳格な本人確認体制を敷いております。こもれび定期保険の受取人変更や契約内容の変更など、契約状態を変化させるすべてのお手続きの前には、必ず本人確認書類および契約者番号を用いた厳格な本人認証を行います。認証が完了するまで、機密性の高い情報の開示や手続きの実行は一切行いません。


    【ご注意ください】

    当社がメールや電話で、暗証番号やパスワードなどの機密情報を直接お伺いすることはございません。不審な連絡があった場合や、身に覚えのない手続きの通知を受け取った場合は、直ちにお知らせください。迅速に調査を行い、不正利用の防止に努めます。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: f62d20a2-d26f-594b-a4b9-631a890fe543
  title: こもれび定期保険：規定・約款
  body: '本保険は、一定の期間において大きな保障を効率的に確保することを目的とした定期保険です。主な規定は以下の通りです。


    1. 加入条件：加入時の年齢が70歳までの方を対象としております。

    2. 保険期間：本プランの保険期間は10年となります。

    3. 告知義務：ご契約時に健康状態などを正しく伝える義務がございます。告知義務違反があった場合、契約解除や保険金・給付金が支払われないリスクがございます。

    4. クーリング・オフ：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。

    5. 解約：契約者が任意に解約いただけますが、定期保険の特性上、解約返戻金の金額はプランにより異なります。詳細は「こもれび定期保険：商品概要」をご確認ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: becffe98-fe56-523a-a6f8-91639e65f788
  title: こもれび定期保険：おすすめの方と主な使い方
  body: 'こもれび定期保険は、「少ない保険料で、必要な期間だけ大きな保障を確保できる効率的なプラン」です。以下のような方におすすめです。


    ・お子さまが独立されるまでなど、人生の特定の期間だけ重点的に保障を準備したい方

    ・限られた予算の中で、万が一の際に家族に十分な資金（例：30,000,000円など）を残したい方


    【プラン例】

    30歳男性が保険期間10年で加入された場合、月払保険料の例として3,150円で大きな保障を確保することが可能です。このように、ライフステージに合わせた柔軟な設計により、将来への不安を解消するパートナーとしてご活用いただけます。'
  domain: insurance
