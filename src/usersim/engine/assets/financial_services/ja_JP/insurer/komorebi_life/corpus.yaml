  body: '本プランの適用にあたり、以下の限度額および制限事項を正確にご案内ください。


    【給付の限度額と制限】

    ・1回の入院における支払限度日数：60

    ・入院給付金の通算支払限度日数：1095

    ・先進医療特約の給付限度額：20,000,000円


    【重要な注意事項】

    ・告知義務について：ご契約時に健康状態などを正しくお伝えいただく義務がございます。事実と異なる告知をした場合、契約解除や保険金・給付金が支払われないリスクがございますので、十分にご説明ください。

    ・クーリング・オフについて：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回いただけます。


    これらの制限事項は、長期的に持続可能な保障を提供するための適正な設計に基づいております。'
