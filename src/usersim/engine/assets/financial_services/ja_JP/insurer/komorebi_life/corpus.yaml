- id: 5f23ce88-b925-5603-8069-53845748c6ec
  title: こもれび個人年金保険：不正利用からお客さまを守るために
  body: 'こもれび個人年金保険をご検討中のお客さまへ、資産を守るための重要なご案内をいたします。当社では、お客様の信頼に応えるため、受取人の変更や契約内容の変更など、状態を変化させるすべての手続きの前に、本人確認書類および契約者番号を用いた厳格な本人認証を行っております。


    【ご注意いただきたい点】

    ・当社がメールや電話で、暗証番号やパスワードを直接お伺いすることはございません。

    ・「特別な高金利プランへの切り替え」をうたって個人情報を求める不審な連絡には十分ご注意ください。


    万が一、不審な連絡を受けたり、身に覚えのない手続きの通知が届いたりした場合は、速やかに当社までお知らせください。認証が完了するまで、機密性の高い情報の開示や手続きの実行は一切行われませんのでご安心ください。'
