- id: 142ae301-1525-58af-b300-56fd16f7a56d
  title: こもれびがん保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの安心を最優先に考え、厳格なデータプライバシー保護を徹底しております。しかしながら、保険商品をかたる巧妙な詐欺や不正利用の手口が増えております。お客さまの大切な資産と情報を守るため、以下の点にご注意ください。


    【当社の対応について】

    お手続きの際、私たちは必ずお客さまの「フルネーム」と「生年月日」を確認し、ご本人確認を完了させます。これ以外の機密情報について、電話やチャットで要求することはございません。


    【絶対に教えないでください】

    以下の情報は、いかなる理由があっても、当社社員や担当者がお伺いすることはありません。

    ・クレジットカード番号およびその有効期限

    ・暗証番号（PIN）

    ・Webサービスのログインパスワード

    ・身分証明書番号（マイナンバーなど）


    【不審な点を感じたら】

    「至急手続きをしないと保障がなくなる」といった不安を煽る連絡や、上記のような機密情報を求める指示を受けた場合は、すぐにやり取りを中断してください。速やかに当社のカスタマーセンターへご連絡いただき、状況をお知らせください。迅速かつ誠実に対応し、被害を最小限に抑えるための解決プロセスを提供いたします。'
  domain: insurance
  product_category: gan_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: dac02f31-2952-5a48-bbe1-0d4a29d9e685
  title: こもれびがん保険：規定・約款
  body: '本規定は、「こもれびがん保険」の契約における権利と義務を定めるものです。サポート担当者は、以下の重要事項に基づき顧客対応を行ってください。


    1. 告知義務について

    契約者は、契約時に健康状態等を正確に伝える義務（告知義務）を負います。事実に反する告知をした場合、保険業法および内部規定に基づき、契約解除や、がん診断一時金（1,000,000円）およびがん治療給付金（月額100,000円）が支払われないことがあります。


    2. クーリング・オフ制度

    申込日、または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回（クーリング・オフ）することが可能です。


    3. 保障の適用と制限

    本プランには「待ち期間」が設けられており、契約後90日間は保障が適用されません。この期間中にがんと診断された場合は、給付金の支払対象外となります。


    4. 契約の終了と解約

    契約者の申し出による解約、または保険料の払込停止による失効により契約は終了します。解約時の返戻金については、プラン内容に応じた規定に基づき算出します。


    5. 紛争解決

    万が一、解決に至らない苦情や紛争が発生した場合は、生命保険協会の生命保険相談所と連携し、公正な解決を図ります。'
  domain: insurance
  product_category: gan_hoken
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 0d7ef5a3-4956-5d54-9195-b228eba9a3a0
  title: こもれびがん保険：おすすめの方と主な使い方
  body: '「こもれびがん保険」は、がんと診断された際の経済的な不安を軽減し、治療に専念できる環境を整えるための特化型プランです。シンプルで分かりやすい保障内容が特徴です。


    【このような方におすすめです】

    ・がんと診断された際に、まとまった治療費や生活費を確保したい方

    ・入院だけでなく、外来治療などが長期にわたる場合に備えたい方

    ・合理的で透明性の高い保険料で、効率的に備えたい方


    【保障内容のポイント】

    ・がん診断一時金：がんと診断された際、まとまった資金として1,000,000円をお支払いします。これにより、初期の治療費や一時的な収入減少をカバーできます。

    ・がん治療給付金（月額）：治療が続く限り、月々100,000円を継続的に支給します。長期的な治療に伴う負担を幅広くサポートします。


    【保険料の例】

    40歳男性が終身払で加入された場合の月払保険料は1,980円です。リスクの分散と安定した給付金支払いのための原資として適切に運用し、適正価格を維持しています。


    【ご利用の注意点】

    ご契約から90日間の「待ち期間」があるため、早期の加入をおすすめいたします。詳細は「こもれびがん保険：リスクについてのご説明」をご確認ください。'
  domain: insurance
  product_category: gan_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 04b1f862-fcc9-565c-9347-720faf572995
  title: こもれびがん保険：がん治療給付金（月額）について
  body: '【質問】がん治療給付金（月額）はどのような場合に、いくら支払われますか？

    【回答】本プランでは、がんの治療を受けている期間中、月額100,000円の給付金を支給いたします。これにより、入院中だけでなく外来での治療継続に伴う費用負担をサポートします。


    【質問】給付金の請求にはどのような手続きが必要ですか？

    【回答】医師による診断書などの必要書類をご提出いただき、審査を経てお支払いいたします。必要書類の詳細については、「こもれびがん保険：必要書類」をご参照ください。


    【質問】待ち期間中に治療を開始した場合も支払われますか？

    【回答】いいえ。ご契約から90日間の待ち期間中にがんと診断された場合は、月額給付金を含むすべての保障の対象外となりますのでご注意ください。'
  domain: insurance
  product_category: gan_hoken
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: ff245c38-3930-5b73-a02c-14f805dd426c
  title: こもれびがん保険：解約・変更・プランの切替え
  body: '「こもれびがん保険」の解約、契約内容の変更、または他のプランへの切替えをご希望の場合の手順をご案内します。


    【お手続き前にご準備ください】

    ・ご契約者さまご本人によるお申込みが必要です。


    【お手続きの流れ】

    1. ご本人確認

    まず、お客さまの「フルネーム」と「生年月日」をお知らせください。弊社にてご本人確認を完了させます。


    2. ご要望のお伝え

    「解約したい」「受取人を変更したい」「別のプランに切り替えたい」など、具体的なご要望をお伝えください。プラン切替えの場合、新たな告知義務が発生することがあります。


    3. 内容の確認と同意

    変更後の保険料や、解約に伴う解約返戻金の有無など、重要な条件を弊社からご説明します。内容に同意いただいた後、お手続きを確定させます。


    4. 完了通知の受領

    お手続き完了後、変更内容や解約完了を記した書面（または電磁的記録）が送付されます。内容に相違がないかご確認ください。


    ※プランの切替えを行う際は、改めて「告知義務」が生じます。事実に反する告知をした場合、契約解除となる可能性があるため、正確な情報を伝えてください。'
  domain: insurance
  product_category: gan_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 2dce6e67-1116-5330-bb21-6cbd50c8c399
  title: こもれびがん保険：想定外の手数料・金額
  body: 'お客さまより「給付金の金額が想定と違う」「保険料の金額が変更されている」といったお問い合わせをいただいた際の対応手順です。


    【想定される状況と原因】

    1. 給付金額が不足している（例：1,000,000円支払われるはずが少額である）

    ・原因：告知義務違反により一部給付制限がかかっている、または待ち期間中の診断であったため不支給となった可能性があります。


    2. 保険料が例示（1,980円）と異なる

    ・原因：保険料は年齢、性別、払込期間によって異なります。例示は「40歳男性、終身払」の場合であり、個別の契約条件により変動します。


    【確認と解決策】

    ・まず、契約時の告知内容と診断書の整合性を確認してください。

    ・待ち期間（90日）が経過していたか、契約日を照合してください。


    【エスカレーション】

    告知義務違反の疑いや、複雑な給付金計算への不服、または深刻な苦情である場合は、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションしてください。公正な解決プロセスを経て、お客さまへ回答いたします。'
