- id: 76db948a-ed8d-5936-aad6-b8abfd35d967
  title: こもれび個人年金保険：ご紹介・継続利用の特典
  body: '将来への安心を、大切な方と一緒に準備しませんか。こもれび生命では、こもれび個人年金保険をすでにご利用中のお客様がご家族やご友人に本プランをご紹介いただいた際や、長きにわたりご契約を継続いただいているお客様への感謝を込めて、特別な特典をご用意しております。


    本プランは、計画的な積立により老後の安定した資金準備を実現するプランです。例えば、30歳で加入し65歳まで保険料をお支払いいただく場合、月払保険料の例は10,000円となります。シンプルで透明性の高い設計により、どなたでも無理なく将来への備えを始めることができます。


    特典の適用条件や詳細につきましては、カスタマーセンターまでお問い合わせください。誠実なサポートで、お客様のライフプランニングを応援いたします。'
