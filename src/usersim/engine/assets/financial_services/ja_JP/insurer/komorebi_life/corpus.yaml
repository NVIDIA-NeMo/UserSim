- id: 500fe862-8d76-52e4-af4d-e59cfe4e28b2
  title: こもれび終身保険（低解約返戻金型）：この商品をかたる詐欺にご注意ください
  body: '最近、「こもれび終身保険（低解約返戻金型）」をかたり、市場金利を大幅に上回る利回りを保証するという不審な電話やメールが報告されています。当社がこのような勧誘を行うことはございません。


    【ご注意いただきたい点】

    ・当社が、SMSやメールで暗証番号やクレジットカード情報の入力を求めることは絶対にございません。

    ・「特別プラン」として、通常とは異なる手続きを急かす行為には十分ご注意ください。


    もし不審な連絡を受け、不安を感じられた場合は、すぐに当社の公式窓口へご連絡ください。また、万が一個人情報を伝えてしまった場合は、速やかにお手持ちの金融機関へご連絡をお願いいたします。お客様の資産を守るため、冷静なご対応をお願い申し上げます。'
