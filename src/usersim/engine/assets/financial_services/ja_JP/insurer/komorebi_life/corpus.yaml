- id: d8832099-2a35-59ff-adbb-a23240fa2bc9
  title: get_statements を使う場面
  body: 'お客さまから、これまでの保険料の払込履歴や、現在の契約状況がわかる明細書（ステートメント）が欲しいという要望をいただいた場合に使用します。


    【対応手順】

    1. お客さまのフルネームと生年月日を確認し、verify_identityを呼び出して本人確認を完了させてください。

    2. get_accountsを呼び出し、明細を確認したい契約のaccount_idを特定します。

    3. get_statementsを呼び出し、該当する契約の明細情報を取得してください。

    4. 取得した内容に基づき、払込状況や現在の積立金額などの情報を丁寧にご案内ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: komorebi_life
- id: 74e9607d-1ab4-5b4f-8a35-1ee0294cdd05
  title: get_statements ツールリファレンス
  body: 'このツールは、本人確認が完了したお客様の保険料の払込明細や、保険金・給付金の支払履歴などのステートメント（取引明細書）を取得するために使用します。


    エージェントはこのツールを直接呼び出すことで、お客様の最新の記録を画面上で確認できます。お客様へ内容を案内する際に活用してください。


    【ツール仕様】

    - ツール名: `get_statements`

    - 引数: なし

    - 実行内容: 本人確認済みの契約者に紐づく明細情報を取得し、返します。

    - 属性: 参照専用（read_only）


    ※このツールを呼び出す前に、必ず `verify_identity` による本人確認を完了させてください。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: komorebi_life
- id: 8fdc8081-6504-5d84-b43d-5437f109f5b1
  title: set_alerts を使う場面
  body: 'お客様から「保険料の支払期限を知らせてほしい」や「契約内容に変更があった際に通知がほしい」といったご要望をいただいた場合に、このツールを使用して通知設定（アラート設定）を行います。


    手続きの手順は以下の通りです。


    1. 本人確認の実施

    お客様のフルネームと生年月日を確認し、`verify_identity` ツールを呼び出して本人確認を完了させてください。

    2. 契約状況の確認

    必要に応じて `get_accounts` ツールを使用し、お客様が現在どの保険契約（「こもれび定期保険」や「こもれび終身保険（低解約返戻金型）」など）を保有しているかを確認します。

    3. 通知設定の有効化

    お客様のご意向に基づき、`set_alerts` ツールを呼び出します。これにより、システム上の標準的な通知設定が適用されます。

    4. 完了の案内

    設定が正常に完了したことをお客様へ丁寧にお伝えください。


    なお、通知タイミングの詳細なカスタマイズなど、標準設定以外の複雑なご要望や苦情については、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションしてください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: komorebi_life
- id: 1c3db7a0-4c17-5660-a425-4b4472e63ec6
  title: set_alerts ツールリファレンス
  body: 'このツールは、本人確認が完了したお客様に対して、保険料の払込案内や重要なお知らせなどの通知設定（アラート）を有効にするために使用します。


    エージェントは、お客様の同意を得た後、このツールを直接呼び出して設定を行います。


