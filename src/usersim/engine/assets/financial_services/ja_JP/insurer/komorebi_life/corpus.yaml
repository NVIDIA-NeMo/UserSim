- id: 36e71c53-8b82-5b5a-b2a9-bb7fb9e2bc1a
  title: こもれび医療保険：この商品をかたる詐欺にご注意ください
  body: '最近、当社の「こもれび医療保険」をかたる不審な電話やメールにより、お客様の個人情報を搾取しようとする詐欺行為が報告されています。「特別プランへの切り替えで保険料が大幅に安くなる」や「未請求の給付金があるため至急手続きが必要」といった内容で、不自然に不安を煽る案内には十分ご注意ください。


    こもれび生命では、いかなる場合においても、メールや電話で暗証番号やクレジットカードのセキュリティコードを伺うことはございません。また、担当エージェント以外の第三者が、突然の電話で振込口座の変更を促すことはございません。


    もし不審な連絡を受けられた場合は、すぐに手続きを中断し、当社までお知らせください。万が一、個人情報を伝えてしまった場合は、速やかにご相談いただけますようお願い申し上げます。'
