- id: 136869d7-4e72-540e-a704-88f8786e988e
  title: こもれびがん保険：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず「保留中」となっている場合は、以下の点をご確認ください。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：提出いただいた書類の有効期限が切れている、または画像が不鮮明な場合がございます。

    2. 告知内容の不足：健康状態に関する回答に未記入や不明確な点がある場合、詳細の確認が必要となります。

    3. 認証情報の不一致：契約者番号またはご本人確認情報が正しく入力されていない可能性がございます。


    【解決方法】

    不足している書類の再提出や、告知内容の補足を行ってください。弊社にて確認ができ次第、速やかに審査を再開いたします。状況が改善しない場合は、専門部署にて詳細な調査を行い、進捗を改めてご案内いたします。'
  domain: insurance
  product_category: gan_hoken
