- id: 29b9b362-31f5-57c7-a40f-2f80d088aaf0
  title: こもれびがん保険：待ち期間（日）について
  body: 'Q：こもれびがん保険に加入してすぐにがんが見つかった場合、保険金はもらえますか？


    A：いいえ、もらえません。本保険には「待ち期間」が設けられており、契約後90日間は保障が適用されません。この期間中にがんと診断された場合、がん診断一時金などの給付金はお支払いできなくなります。これは、加入直前にがんであることが分かっている状態で加入することを防ぐための制度です。


    Q：待ち期間はいつから数えますか？


    A：保険契約が成立した日（または保険料の初回払込日など、約款で定められた日）から起算して90日となります。詳細はご契約内容をご確認ください。'
