- id: 5ac3829c-0b30-54ff-a78e-0fa9362ff64f
  title: こもれび医療保険：ログインできない・アクセスできない
  body: 'オンラインサービスへのアクセスに問題が発生した場合は、以下の手順でご確認をお願いいたします。


    ■想定される症状

    「ログインボタンを押しても画面が切り替わらない」「認証エラーが表示される」


    ■確認事項と解決策

    1. 認証情報の再確認：入力した契約者番号やパスワードに誤りがないか、大文字・小文字の区別を含めて再度ご確認ください。

    2. ブラウザの更新：キャッシュが影響している可能性があるため、ブラウザの再起動や履歴の消去をお試しください。


    ■解決しない場合

    上記を確認しても改善しない場合は、当社専門部署にてアカウントの状態を調査いたします。担当者までご連絡いただければ、速やかに原因を特定し、復旧に向けたサポートをさせていただきます。'
