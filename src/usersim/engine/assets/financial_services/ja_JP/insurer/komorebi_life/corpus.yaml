- id: bf7fb04c-31a8-5bae-ac7d-d0f500b6296a
  title: こもれび終身保険（低解約返戻金型）：おすすめの方と主な使い方
  body: '「こもれび終身保険（低解約返戻金型）」は、低解約返戻金という仕組みを導入することで、月々の負担を抑えながら、将来にわたって確かな保障を準備したい方に最適なプランです。


    【このような方におすすめです】

    ・少ない負担で、万が一の際に十分な保障を確保したい方

    ・老後の資金準備と保障を両立させたい方


    【具体例】

    例えば、死亡保険金を5,000,000円と設定した場合の月払保険料は12,400円（条件により変動）となります。また、払込期間を60歳までとする設定が可能です。低解約返戻金期間中は解約返戻金が70%に抑制されますが、その分、効率的な保障確保が可能となります。長期的な視点でお客様のライフステージに寄り添う誠実な保障を提供いたします。'
  domain: insurance
  product_category: shushin_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
