  body: '【ご質問】入院給付金は、生涯で最大何日まで受け取ることができますか？


    【回答】こもれび医療保険における入院給付金の通算支払限度日数は、1,095日となっております。この日数の範囲内で、入院時の保障を継続的に提供いたします。詳細な条件については、こもれび医療保険：商品概要をご参照ください。'
