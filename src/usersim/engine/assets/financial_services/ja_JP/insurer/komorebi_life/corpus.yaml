  title: こもれび個人年金保険：金利・料率一覧
  body: '【適用料率】

    本プランの返戻率の例は108%となっております。この数値は、計画的な積み立てによる資産形成の目安として提示しております。


    【料率の決定について】

    保険料および適用される料率は、お客様のリスクと年齢に基づき適正に設定されており、長期的な持続可能性を最優先としています。詳細な適用料率については、ご契約時のプラン内容にて個別に提示させていただきます。'
