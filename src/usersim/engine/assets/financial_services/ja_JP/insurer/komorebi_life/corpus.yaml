- id: 7bf7385e-eee3-5e3e-87ef-24701871f5df
  title: こもれび定期保険：商品概要
  body: 'こもれび定期保険は、少ない保険料で、必要な期間だけ大きな保障を確保できる効率的なプランです。ライフステージの変化に合わせて、一定期間の安心を低コストで準備したい方に最適です。


    【プラン例】

    保険期間を10年とし、保険金額を30,000,000円に設定した場合、月払保険料の例として3,150円という設計が可能です。このように、限られた予算で最大限の保障を確保できる点が本商品の特徴です。


    詳細な料率については「こもれび定期保険：金利・料率一覧」をご参照ください。誠実な商品設計を通じて、お客様の将来への不安を解消するパートナーとしてサポートいたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 669eed24-b501-5042-9af6-5187a5988345
  title: こもれび定期保険：保険金額の例について
  body: '【ご質問】保障額を検討していますが、保険金額の目安はありますか？


    【回答】はい、プラン例として保険金額30,000,000円の設定がございます。お客様のご意向とリスク許容度に基づき、最適な保障額をご提案いたします。詳細は「こもれび定期保険：商品概要」にてご確認いただけます。'
