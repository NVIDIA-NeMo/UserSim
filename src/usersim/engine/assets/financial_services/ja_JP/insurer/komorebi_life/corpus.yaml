  body: 'こもれび医療保険の保険料は、合理的かつ透明性の高い料率に基づき算出しております。リスクの分散と安定した給付金支払いを実現するための適正価格を維持しています。


    【保険料の例】

    ・月払保険料： 2,480円

    （条件：35歳女性、終身払の場合）


    ※保険料は、ご加入時の年齢、性別、プラン内容、および健康状態（告知内容）によって変動します。個別の正確な保険料については、お客様の意向と客観的なデータに基づき、誠実な標準的ケアをもってご提案いたします。


    なお、本プランは掛け捨て型に近い設計となっており、運用による金利付与や解約返戻金は原則としてございませんので、あらかじめご了承ください。'
