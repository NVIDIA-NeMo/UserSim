  institution_id: komorebi_life
- id: f16e4311-30b4-5b19-9ae3-6f98d0443819
  title: こもれび終身保険（低解約返戻金型）：よくあるお手続きの流れ
  body: 'ご契約後の「受取人の変更」など、よくあるお手続きの流れをご案内します。


    【お手続きの準備】

    ・ご契約者さまのフルネーム

    ・生年月日

    ・（変更後の受取人の方の）氏名、生年月日、ご契約者さまとの関係


    【お手続きの手順】

    1. カスタマーセンターまたはWebチャットにて、「受取人の変更をしたい」旨をお伝えください。

    2. 本人確認のため、ご契約者さまのフルネームと生年月日をお伺いします。正しくお伝えください。

    3. 新しい受取人の方の情報を、当社スタッフにお伝えください。

    4. 当社にて内容を確認し、変更手続きを完了させます。完了後、その旨を改めてご連絡いたします。


    【その他の手続きについて】

    保険料の払込み方法の変更や、住所変更などの手続きも、同様に「本人確認（フルネームと生年月日）」から開始し、対話形式で完了することが可能です。


    ※クレジットカード番号やパスワードなどの機密情報を要求することはございませんので、ご安心ください。'
