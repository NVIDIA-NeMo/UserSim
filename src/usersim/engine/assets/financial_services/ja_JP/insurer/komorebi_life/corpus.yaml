- id: dfe4ddbc-8e07-5a76-bc3a-91db1f18ae8e
  title: こもれび医療保険：ほかの選択肢との比較と向かない場合
  body: '「こもれび医療保険」は、公的医療保険の高額療養費制度を補完し、入院や手術時の不安を軽減することに特化した包括的なプランです。


    【本プランが適している方】

    ・どのような病気やケガでも幅広くカバーしたい方

    ・公的制度だけでは不足する差額ベッド代や食事代に備えたい方


    【本プランが向かない場合】

    ・がん治療に特化したまとまった一時金を最優先に確保したい方は、「こもれびがん保険」の方がより効率的です。

    ・特定の疾患のみを限定的に保障したい場合は、特約の組み合わせを慎重に検討いただく必要があります。


    当プランは、幅広い世代の方々に安心を提供し、将来への不安を解消するパートナーとしての設計となっております。'
  domain: insurance
  product_category: iryo_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: c4aff530-99a6-5bd1-aec5-917c92d9ad70
  title: こもれび医療保険：外来の手術給付金について
  body: 'Q：入院を伴わない「日帰り手術」などの外来手術を受けた場合でも給付金は受け取れますか？


    A：はい、受け取れます。外来での手術に対しては、「外来の手術給付金」として50,000円を給付いたします。入院の有無にかかわらず、手術による経済的負担をサポートいたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 807dbc4e-4b76-59e0-9247-7b8dde39a7bb
  title: こもれび医療保険：よくあるお手続きの流れ
  body: '給付金の請求など、一般的にお手続きの流れについてご案内いたします。


    1. 請求の申し出：入院や手術などの事由が発生した際、当社へ給付金の請求を申し出てください。

    2. 必要書類のご案内：請求内容に基づき、診断書などの必要書類を当社よりご案内いたします。

    3. 書類の提出：ご案内した書類を当社へご提出ください。

    4. 審査と確認：当社にて、契約内容および告知義務への適合性などを審査いたします。

    5. 給付金の支払い：審査完了後、速やかに指定の口座へ給付金をお振込みいたします。


    なお、受取人の変更など契約内容を変化させる手続きの前には、必ず厳格な本人認証を実施させていただきます。'
  domain: insurance
  product_category: iryo_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: dfa8724c-d909-5a3c-bf4e-42679abd2483
  title: こもれび医療保険：明細や記録と合わない
  body: '【症状】

    お客様から「想定していた給付金額よりも少ない」あるいは「支払われた日数に不足がある」との指摘を受けた。


    【確認すべき点】

    1. 支払限度日数の確認：1回の入院における支払限度日数が60日を超えていないかを確認してください。

    2. 通算限度日数の確認：生涯の通算支払限度日数である1095日に到達していないかを確認してください。

    3. 給付対象の確認：手術の内容が、入院中の手術給付金（100,000円）か外来の手術給付金（50,000円）のどちらに該当するかを再照会してください。


    【対応】

    限度額に達している場合は、その根拠となる約款の規定を丁寧に説明してください。計算に誤りがあることが判明した場合は、速やかに再計算を行い、差額分を追加入金する手続きを専門部署にて実行します。'
  domain: insurance
  product_category: iryo_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 8abf206e-938d-5f52-87c6-4273e622d12c
  title: こもれびがん保険：商品概要
  body: '「こもれびがん保険」は、がんという大きな病気に直面した際、診断時のまとまった給付金により、治療に専念できる環境を整えるための特化型プランです。


    【主な保障内容】

    ■がん診断一時金：1,000,000円

    ■がん治療給付金（月額）：100,000円


    【ご注意点】

    本プランには90日の待ち期間がございます。契約から90日以内にがんと診断された場合は保障の対象外となりますので、あらかじめご了承ください。


    【保険料の例】

    月払保険料：1,980円（プラン内容やご年齢により異なります）


    お客様一人ひとりのライフステージに寄り添い、将来への不安を解消する誠実な保障を提供いたします。'
