- id: 1aed04d4-c75f-5def-b9ba-49dbdeee9490
  title: こもれび個人年金保険：商品概要
  body: 'こもれび個人年金保険は、計画的な積立により、老後の安定した資金準備を実現する個人年金プランです。公的年金に上乗せして、将来の安心を形にするためのお手伝いをいたします。


    【商品の特徴】

    シンプルで分かりやすい設計となっており、定まった期間に保険料を積み立てることで、将来的にまとまった年金形式で給付金を受け取ることができます。


    【プランの例と数値】

    ・年金の受取開始年齢：65

    ・年金の受取期間（年）：10

    ・月払保険料の例：10,000円（30歳で加入し、65歳まで保険料を払い込んだ場合）

    ・返戻率の例：108%


    【税制上のメリット】

    本商品は「生命保険料控除」の対象となります。新制度の契約では、個人年金保険料の区分で所得税が最高40,000円、他の区分（一般生命保険料、介護医療保険料）と合わせて合計で最高120,000円まで適用されます。なお、2026年分と2027年分については、23歳未満の扶養親族がいる方の一般生命保険料控除が最高60,000円となります（合計上限は120,000円のままです）。


    詳細な適用条件やお手続きについては、カスタマーセンターまでお問い合わせください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: f67c26a5-2914-5ec2-92e6-d5d07e11a236
  title: こもれび個人年金保険：年金の受取開始年齢について
  body: '【よくあるご質問】


    問：年金はいつから受け取ることができますか？

    答：こもれび個人年金保険の年金の受取開始年齢は65歳となっております。この年齢に達したときから、計画的に積み立てた年金をお受け取りいただけます。


    問：受取開始年齢を変更することはできますか？

    答：ご契約内容によって異なります。お手元の保険証券をご確認いただくか、担当者までお問い合わせください。


    問：受取期間はどのくらいですか？

    答：本プランでは、年金の受取期間（年）を10として設定しております。これにより、老後の生活資金を安定的に確保することが可能です。


    詳細については「こもれび個人年金保険：商品概要」をご参照ください。'
