- id: cef7fef0-c586-5063-bddd-8fa0e5e867ab
  title: close_account ツールリファレンス
  body: 'このツールは、保険契約を正式に解約するために使用します。オペレーターが直接呼び出すことで、契約を終了させます。


    【引数】

    ・account_id：解約する保険契約の識別番号。


    【効果】

    指定された契約が解約されます。解約返戻金がある場合は、登録済みの指定口座へ自動的に支払手続きが行われます。一度実行すると取り消しはできません。実行前にverify_identityによる本人確認を完了させてください。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: komorebi_life
- id: 719ed546-c994-5bc4-91cb-ba9337b14f5d
  title: get_accounts を使う場面
  body: 'お客さまがご自身の契約内容を忘れてしまった場合や、複数の保険（例：「こもれび医療保険」と「こもれびがん保険」の両方）に加入しており、それらを一括して確認したい場合に活用します。また、他の手続きを行うためのaccount_idを特定する際の必須ステップとなります。


    【対応手順】

    1. お客さまのフルネームと生年月日を確認し、verify_identityを呼び出して本人確認を完了させてください。

    2. get_accountsを呼び出します。これにより、そのお客さまが保有するすべての契約（account_id、保険の種類、下4桁、残高・解約返戻金、ステータス）の一覧が表示されます。

    3. 表示された一覧に基づき、お客さまが探している契約や、手続きに必要なaccount_idを特定し、案内してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: komorebi_life
- id: 91c6874c-ca92-5b9f-8c53-6be044431822
  title: get_accounts ツールリファレンス
  body: 'このツールは、本人確認が完了したお客さまが保有しているすべての保険契約の一覧を取得するために使用します。


    【引数】

    なし（現在認証されているユーザーの情報を自動的に取得します）。


    【効果】

    検証済みのお客さまの契約リスト（account_id、契約種類、口座/カードの下4桁、残高/返戻金、現在のステータス）を返します。オペレーターはこれにより、お客さまが提示した「下4桁」から正確なaccount_idを特定できます。実行前にverify_identityが完了している必要があります。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
