- id: e039f1fd-359b-5542-84b4-c2663b3c8dd8
  title: こもれび医療保険：重要事項のご説明
  body: '本保険をご契約いただくにあたり、以下の重要事項を必ずご確認ください。


    【告知義務について】

    ご契約時に健康状態などを正確に伝える義務があります。事実に反する告知をした場合、保険業法および内部規定に基づき、契約解除や保険金・給付金が支払われないことがあります。


    【クーリング・オフについて】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から 8 日以内であれば、申し込みを撤回できます。


    【保険契約者保護機構による補償】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の 90% まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があります。


    【公的制度との関係】

    公的医療保険の高額療養費制度により、所得に応じた月ごとの自己負担上限が設けられています。また、2026年8月の診療分からは年間の上限も設けられています。本保険は、これらの制度でカバーしきれない差額ベッド代や食事代、先進医療費などの自己負担分を補完するものです。'
  domain: insurance
  product_category: iryo_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
