- id: 1ec0ac57-ee7a-5398-8449-2b9a2ea73e11
  title: こもれび個人年金保険：おすすめの方と主な使い方
  body: 'こもれび個人年金保険は、老後の資金形成を目的として、計画的に資産を積み立てたい方に最適なプランです。


    【おすすめの方】

    ・公的年金に加えて、自分年金を用意し、将来への不安を解消したい方

    ・無理のない範囲で、長期的な視点で確実な資産形成を行いたい方


    【プランの活用例】

