- id: 54c70ddb-8796-5c2f-b2ab-fc52a1539390
  title: こもれび医療保険：お取引が拒否された・制限された
  body: '【症状】

    受取人の変更やプランの変更手続きを依頼した際、「現在手続きができない」または「制限されている」と案内された。


    【考えられる原因】

    1. 本人確認の不備：お伝えいただいたフルネームや生年月日が、ご登録内容と一致していない。

    2. 契約の失効：保険料のお支払いが一定期間滞り、契約が「失効」状態にある。

    3. 必要書類の不足：手続きに必要な証明書等が提出されていない。


    【確認と解決の手順】

    1. まず、ご登録されている正確なフルネームと生年月日を再度お伝えいただき、本人確認をやり直してください。

    2. 契約状態を確認し、もし失効している場合は、復活手続きが可能か担当者に確認してください。

    3. 不足している書類がある場合は、その名称を具体的に案内させていただきますので、速やかにご提出ください。


    【解決しない場合】

    上記を確認しても制限が解除されない場合、内部規定に基づき、専門のコンプライアンス部門へエスカレーションし、詳細な調査を行います。調査結果については、後日担当者より改めてご連絡いたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 82e5e28f-ab02-5162-abd0-3f7633ce9c8f
  title: こもれび医療保険：切替えや上位プランを検討するとき
  body: 'お客様が現在のプランからの切替えや、保障の強化を検討されている場合の案内指針です。


    【こもれび医療保険の特長】

    入院給付金日額10,000円をベースに、入院・手術による幅広い費用をカバーします。公的医療保険の不足分を補う標準的なプランです。


    【他プランとの使い分け】

    ・がんへの特化を希望される場合：

    「こもれびがん保険」への切替え、または併用をご提案ください。医療保険が「入院全般」をカバーするのに対し、がん保険は「がん診断時のまとまった一時金」と「がん治療費」に重点を置いています。


    【提案のポイント】

    お客様が「特定の病気への不安」を強く持たれているか、あるいは「幅広い病気やケガへの備え」を重視されているかを確認してください。客観的なデータに基づき、誠実な標準的ケアをもって最適な組み合わせを提案してください。'
  domain: insurance
  product_category: iryo_hoken
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: dfe4ddbc-8e07-5a76-bc3a-91db1f18ae8e
  title: こもれび医療保険：ほかの選択肢との比較と向かない場合
  body: '「こもれび医療保険」をご検討中の方へ、本プランが適している方と、そうでない方の判断基準をご案内します。


    【本プランが向いている方】

    ・入院や手術などの医療費負担を幅広くカバーしたい方。

    ・公的医療保険（高額療養費制度など）だけでは、自己負担分に不安がある方。

    ・シンプルで分かりやすい保障内容で、将来に安心を持ちたい方。

    （例：35歳女性、終身払の場合の月払保険料は2,480円です）


    【本プランが向かない可能性がある方】

    ・既に十分な額の医療保障を勤務先の福利厚生などで確保されている方。

    ・医療費として充てられる十分な貯蓄があり、保険による備えを必要としない方。

    ・「がん」など、特定の疾患に対する高額な一時金保障のみを求めている方（この場合は「こもれびがん保険」が適しています）。


    【比較の視点】

    医療保険は「幅広く、長く」備えるものです。一方で、がん保険は「特定の病気に深く」備えるものです。お客様のご不安の正体が「入院費全般」か「がん治療費」かによって、選択肢が変わります。'
  domain: insurance
  product_category: iryo_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: c4aff530-99a6-5bd1-aec5-917c92d9ad70
  title: こもれび医療保険：外来の手術給付金について
  body: '【ご質問】

    入院せずに外来で手術を受けた場合でも、給付金は支払われますか？


    【回答】

    はい、お支払いいたします。「外来の手術給付金」として50,000円をお支払いいたします。


    最近の医療現場では日帰り手術が増えておりますが、本プランでは入院の有無にかかわらず、対象の手術を受けられた際にご安心いただけるよう保障を設けております。請求手続きの詳細については、カスタマーセンターまでお問い合わせください。'
