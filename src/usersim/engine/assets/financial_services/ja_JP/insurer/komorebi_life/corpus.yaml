  title: こもれび個人年金保険：状況・履歴の確認
  body: '現在の積立状況や保険料の払込履歴を確認する手順は以下の通りです。


    1. 契約者番号とお手元の本人確認書類をご提示ください。厳格な本人認証を行います。

    2. 認証完了後、確認したい内容（現在の解約返戻金相当額や、過去の払込履歴など）を具体的にお伝えください。

    3. 当社にて最新のデータを照会し、現在の状況を口頭または書面にて回答いたします。


    認証が完了するまで、機密性の高い情報の開示は行えませんので、あらかじめご了承ください。内容に相違があると感じられた場合は、「こもれび個人年金保険：明細や記録と合わない」をご参照ください。'
  domain: insurance
