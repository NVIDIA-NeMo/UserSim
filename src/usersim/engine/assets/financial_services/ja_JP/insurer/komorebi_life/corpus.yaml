  body: '「こもれび定期保険」のお申込みに際して必要な書類は以下の通りです。


    | 書類名 | 提出の要否 | 備考 |

    | :--- | :--- | :--- |

    | ご本人確認書類 | 必須 | フルネームと生年月日の確認に使用します |

    | 健康告知書 | 必須 | 告知義務に基づき、正確な健康状態をご記入ください |

    | 保険金受取人指定書 | 必須 | 万が一の際の受取人を指定いただく書類です |

    | 診断書 | 条件により必須 | 告知内容により、当社が提出を求める場合があります |'
