- id: ef7fedc1-c5c1-5a63-8c8b-67c0eb504cfc
  title: file_claim を使う場面
  body: '入院、手術、がんの診断などの給付金、または死亡保険金の請求を希望された場合に、本手続きを行います。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、verify_identity を呼び出して本人確認を完了させます。

    2. get_accounts を呼び出し、請求対象となる契約（account_id）を特定します。

    3. 請求の種類（入院、手術、がん診断、死亡など）を確認します。

    4. file_claim ツールを呼び出し、請求の受付を行います。ツールから提示される必要書類をご案内ください。

    5. 書類がすべて揃い、確認が完了した後の支払時期について説明します。


    なお、エージェントは保険金や給付金の支払いを確約する表現（「必ず支払われます」など）は絶対に使用しないでください。審査の結果に基づき支払われる旨を誠実にお伝えください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: komorebi_life
- id: 96029ffd-451c-51a6-8de6-072e39297def
  title: file_claim ツールリファレンス
  body: 'このツールは、保険金や給付金の請求を受け付け、必要書類を案内するために使用します。


    【操作内容】

    エージェントがこのツールを呼び出すことで、請求手続きを開始し、請求内容に応じた必要書類のリストを生成します。


    【引数】

    - account_id: 請求対象となる保険契約のID。

    - claim_type: 請求の種類（例：「入院」、「手術」、「がん診断」、「死亡」など）。

    - incident_date: 事故または診断が発生した日付。


    【注意事項】

    本ツールを実行する前に、必ず verify_identity による本人確認を完了させてください。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: komorebi_life
- id: bdbd4b9b-b591-5f14-88f3-35026e68bcfb
  title: get_claim_status を使う場面
  body: '既に請求手続きを行ったお客様から、現在の進捗状況について問い合わせがあった場合に、本手続きを行います。


    【手続き手順】

    1. お客様のフルネームと生年月日を確認し、verify_identity を呼び出して本人確認を完了させます。

    2. get_accounts を呼び出し、対象となる契約（account_id）を特定します。

    3. get_claim_status ツールを呼び出し、現在の状況（書類の受付状況、確認中、支払完了など）を確認します。

    4. 確認した状況に基づき、お客様へ丁寧にご案内します。


    もし書類に不備がある場合は、速やかに不足している書類を案内してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: komorebi_life
- id: 07995a5a-203e-5eab-b5f4-6c333b7754c4
  title: get_claim_status ツールリファレンス
  body: 'このツールは、お客さまから請求された保険金や給付金の手続き状況を確認するために使用します。オペレーターがこのツールを直接呼び出すことで、現在の処理段階を即時に把握できます。


    【引数】

    ・account_id：確認対象となる保険契約の識別番号。get_accountsツールなどで取得してください。


    【効果】

    指定された契約の請求状況（書類の受付完了、審査中、支払完了など）を返します。本人確認（verify_identity）が完了していることが前提となります。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: komorebi_life
- id: 0cc8b6a7-444d-5ea7-99b1-6302f1148e3f
  title: update_policy を使う場面
  body: 'お客さまから、現在ご契約中の保険内容を変更したいというご要望をいただいた場合に使用します。例えば、「こもれび定期保険」の保険金額を減額して保険料を抑えたい場合や、特約の追加・解約を行いたい場合などが該当します。


    【対応手順】

    1. お客さまのフルネームと生年月日を確認し、verify_identityを呼び出して本人確認を完了させてください。

    2. お客さまがどの契約を変更したいかを確認します。契約番号が不明な場合は、get_accountsを呼び出し、提示された下4桁から該当するaccount_idを特定してください。

    3. 変更後の具体的な内容（減額後の金額や追加したい特約など）を伺います。

    4. update_policyを呼び出し、特定したaccount_idと変更内容を送信して手続きを完了させてください。


    ※個別の税務相談や医療的な助言は行わず、あくまで契約内容の変更手続きのみをサポートしてください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: komorebi_life
- id: 9151ad93-eebf-55bd-a01e-4c2048ae2532
  title: update_policy ツールリファレンス
  body: 'このツールは、保険金額の減額や特約の追加・解約など、契約内容の変更を適用するために使用します。オペレーターが直接呼び出すことで、システム上の契約情報を更新します。


    【引数】

    ・account_id：変更を行う保険契約の識別番号。

    ・change_details：変更したい具体的な内容（例：「保険金額を1,000万円から500万円に減額」など）。


    【効果】

    指定された契約のプラン内容が更新されます。実行前にverify_identityによる本人確認が必須です。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: komorebi_life
- id: d55eeb1e-8df1-574b-a648-f68f843e0529
  title: close_account を使う場面
  body: 'お客さまから、保険契約の解約を希望された場合に使用します。特に「こもれび終身保険（低解約返戻金型）」などの貯蓄性のある商品では、解約時に解約返戻金が発生するため、丁寧な案内が必要です。


    【対応手順】

    1. お客さまのフルネームと生年月日を確認し、verify_identityを呼び出して本人確認を完了させてください。

    2. get_accountsを呼び出し、解約対象となる契約のaccount_idを特定します。

    3. 解約に伴い、解約返戻金がある場合は指定の口座に支払われることを説明してください。

    4. close_accountを呼び出し、対象のaccount_idを指定して解約処理を確定させてください。


    【注意事項】

    解約は取り消しができない不可逆的な操作（irreversible）であるため、お客さまの意思を十分に確認した上で実行してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
