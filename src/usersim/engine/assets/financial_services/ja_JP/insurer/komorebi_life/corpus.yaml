  title: こもれび医療保険：必要書類
  body: '「こもれび医療保険」のお申込みおよびお手続きに必要な書類は以下の通りです。


    ・新規ご契約時：保険申込書、告知書、本人確認書類（運転免許証、マイナンバーカード等）

    ・給付金請求時：保険金請求書、診断書（医師による記入）、入院時等の領収書

    ・契約内容変更時：変更届出書、本人確認書類、および契約者番号の提示'
