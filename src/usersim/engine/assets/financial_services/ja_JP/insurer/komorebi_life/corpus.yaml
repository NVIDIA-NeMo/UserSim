- id: bf6efbb6-6b35-53b0-ac1c-41d75dee780f
  title: こもれび定期保険：この商品をかたる詐欺にご注意ください
  body: '最近、当社の「こもれび定期保険」をかたる不審な連絡があるとの報告を受けております。お客様の資産を守るため、以下の点に十分ご注意ください。


    当社では、いかなる場合においても、電話やメール、チャットを通じてお客様のクレジットカード番号、暗証番号、パスワード、または身分証明書番号などの機密情報を要求することはありません。また、「特別なプランで保険料を大幅に安くできる」といった、不自然に好条件な提案を個別に持ちかけることはございません。当社の保険料は、例えば30歳男性・保険期間10年のプランで月払保険料3,150円のように、合理的で透明性の高い体系を採用しております。


    もし、当社社員を名乗る人物から機密情報の提供を求められたり、不審な点があると感じたりした場合は、すぐにその連絡を中断してください。また、万が一、不審なメールやメッセージを受け取った際は、速やかに当社のカスタマーセンターへお知らせください。


    お客様に安心してお手続きいただけるよう、本人確認の際は必ず「フルネーム」と「生年月日」を確認させていただきます。それ以外の機密情報を求められた場合は、詐欺の可能性が高いと考えられますので、十分にご警戒ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
