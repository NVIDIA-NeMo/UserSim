  body: 'Q：1回の入院で、最大で何日分まで給付金を受け取ることができますか？


    A：「こもれび医療保険」では、1回の入院につき、支払限度日数を60日までと定めております。そのため、入院期間が60日を超える場合でも、給付金は60日分までのお支払いとなります。なお、通算の支払限度日数（1,095日）についてもあわせてご確認ください。'
