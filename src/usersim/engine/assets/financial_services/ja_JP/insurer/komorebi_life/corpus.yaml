- id: 3f438dd1-e1c8-5a6c-99cf-92bf941b3598
  title: こもれび個人年金保険：お申込みとご利用開始
  body: 'こもれび個人年金保険へのお申込み手順をご案内します。お客様の将来に寄り添うプランを一緒に決定しましょう。


    1. ご本人確認

    まずはお客様のフルネームと生年月日を伺い、本人確認を完了させます。


    2. ライフプランのご相談とプラン選択

    老後資金としてどの程度の準備が必要かをお伺いし、月払保険料（例：10,000円）などの金額を決定します。年金の受取開始年齢（65歳）や受取期間（10年）についても改めてご確認いただきます。


    3. 告知事項の確認（告知義務）

    ご契約にあたり、健康状態などの告知事項について正確にお答えいただきます。事実に反する告知をした場合、契約解除や給付金が支払われないことがあるため、誠実な回答をお願いいたします。


    4. お申込み手続きの完了

    内容に同意いただいた後、正式にお申し込みを承ります。手続き完了後、契約内容を記載した書面をお送りします。


    5. 保険料のお支払い開始

    ご指定の口座またはクレジットカードにて、保険料の払い込みが開始されます。


    【ご注意】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、クーリング・オフ（申込みの撤回）が可能です。'
