- id: 1ae24d82-01d5-538a-8abb-a332d321c873
  title: こもれび医療保険：リスクについてのご説明
  body: '「こもれび医療保険」のご契約にあたり、以下の重要なリスクと制度についてご理解ください。


    【告知義務に関するリスク】

    ご契約時の健康状態等の告知に不備があった場合、保険業法に基づき、ご契約の解除や保険金・給付金が支払われない可能性があります。誠実な告知をお願いいたします。


    【保障の制限】

    本プランは、入院給付金について「1回の入院につき60日まで」「通算で1,095日まで」という支払限度を設けております。これを超える長期入院の費用は保障対象外となりますのでご注意ください。


    【万が一の保護機構について】

    当社が万が一破綻した場合には、「生命保険契約者保護機構」により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があります。


    【クーリング・オフ】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回できる制度がございます。


    当社は金融庁の監督の下、公正な取引と厳格なデータプライバシー保護を徹底しております。'
  domain: insurance
  product_category: iryo_hoken
