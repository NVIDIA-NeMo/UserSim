  body: '「こもれび医療保険」のお申込みから保障開始までの手順をご案内いたします。


    1. プランの選択：お客様のご意向とリスク許容度に基づき、最適な保障内容を決定します。

    2. 告知事項の回答：現在の健康状態など、告知義務に基づいた正確な情報を弊社へお伝えください。

    3. 本人確認：契約者番号および本人確認書類をご提示いただき、厳格な本人認証を行います。

    4. 審査と承諾：弊社にて審査を行い、承諾となった後、保険契約成立となります。

    5. 書面の受領：契約内容を記載した書面をお受け取りください。書面受領後8日以内であれば、クーリング・オフによる無条件撤回が可能です。


    上記手続きが完了し、初回保険料のお支払いが確認できた時点より保障が開始されます。'
