- id: e8264c60-55ec-5325-8cc3-20a9f3de573f
  title: こもれび個人年金保険：この商品をかたる詐欺にご注意ください
  body: '最近、当社の「こもれび個人年金保険」をかたる不審な電話やメールによる詐欺が発生しています。お客様の大切な資産を守るため、以下の点に十分ご注意ください。


    【詐欺の典型的なパターン】

    「特別プランへの切り替えで、返戻率を大幅に向上させる」などといい、手数料や手続き費用を先払いで要求したり、個人情報を聞き出そうとしたりします。


    【当社が絶対にお伺いしないこと】

    こもれび生命では、いかなる場合であっても、お電話やメール、チャットを通じて以下の情報の提供を求めることはございません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・ログインパスワード

    ・身分証明書番号


    【不審に感じた時の対応】

    もし、少しでも「おかしい」と感じる連絡を受けた場合は、すぐにやり取りを中断してください。その後、速やかに当社のカスタマーセンターまでお知らせください。


    私たちは、透明性の高い商品設計を大切にしており、不透明な特別プランの提示や、機密情報の要求は一切行いません。ご不安な点がある場合は、いつでもご相談ください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: security_advisory
  source_authority: official
