- id: 2c31ffc3-c3ad-5e73-b383-afb7c5c049bc
  title: こもれび医療保険：規定・約款の変更
  body: 'こもれび医療保険の規定および約款は、長期にわたる持続可能な保障を提供するため、社会情勢や法改正に伴い変更される場合がございます。変更の際は、事前にお客様へ通知いたします。現在、本プランでは1回の入院につき最大60日まで、入院中の手術給付金として100,000円、外来での手術給付金として50,000円を規定しております。


    なお、お申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、契約を無条件で撤回できるクーリング・オフ制度がございます。また、告知義務違反があった場合、契約解除や保険金・給付金が支払われないリスクがある点にご留意ください。誠実なご告知をお願い申し上げます。'
