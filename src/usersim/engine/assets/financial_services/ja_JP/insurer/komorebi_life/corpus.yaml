- id: a6d27f31-d555-558a-8552-58bd7ccd18fb
  title: こもれび医療保険：商品概要
  body: 'こもれび医療保険は、入院や手術などの医療費負担を幅広くカバーし、公的医療保険では不足する費用を補完するためのプランです。シンプルで分かりやすい保障内容で、あらゆる世代の方々に将来の安心を提供します。


    【主な保障内容】

    ■入院給付金：入院1日につき 10,000円 をお支払いします。

    ■支払限度日数：1回の入院につき 60 日まで、通算で 1,095 日まで保障いたします。

    ■手術給付金：

    ・入院中の手術： 100,000円

    ・外来の手術： 50,000円

    ■先進医療給付金：先進医療にかかった費用を、通算限度額 20,000,000円 まで保障いたします。


    【保険料の例】

    35歳女性が終身払いで加入された場合の月払保険料は 2,480円 です。


    本プランは、合理的で透明性の高い保険料体系を採用しており、リスクの分散と安定した給付金支払いのための原資として適切に運用されています。詳細な手続きについては「こもれび医療保険：お申込みとご利用開始」をご参照ください。'
  domain: insurance
  product_category: iryo_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 4dbce293-317d-5872-a8c5-a12e85114f33
  title: こもれび医療保険：入院給付金日額について
  body: '【質問】入院給付金は1日あたりいくら受け取れますか？

    【回答】こもれび医療保険の入院給付金日額は 10,000円 です。入院された日数分、この金額をお支払いいたします。


    【質問】入院給付金が支払われる日数に制限はありますか？

    【回答】はい、制限がございます。1回の入院につき 60 日まで、また通算（合計）での支払限度日数は 1,095 日となっております。この限度日数を超えた分については給付金をお支払いできませんのでご注意ください。


    詳細な保障内容については「こもれび医療保険：商品概要」をご確認ください。'
