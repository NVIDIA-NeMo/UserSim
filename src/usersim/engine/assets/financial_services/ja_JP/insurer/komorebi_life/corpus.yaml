- id: 6786c5d5-55bf-51c0-97e2-756705609461
  title: よくあるご質問
  body: '【お問い合わせについて】

    問：カスタマーセンターの受付時間はいつですか？

    答：平日の9時から17時まで、お電話およびWebチャットにてサポートを提供しております。


    【苦情・ご相談について】

    問：サービス内容に不満がある場合はどうすればよいですか？

    答：誠実に対応させていただきます。担当者が承った後、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションし、解決を図ります。また、公正な解決のために生命保険協会の生命保険相談所と連携する場合もございます。


    【お手続きについて】

    問：契約内容の変更はどこでできますか？

    答：カスタマーセンターでの電話対応またはWebチャットで承っております。詳細は「法令・制度に関するご案内：生命保険・医療保険」などの案内をご確認ください。'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 5afcc4f4-16e7-50dc-bdba-6247b9efc55a
  title: 法令・制度に関するご案内：生命保険・医療保険
  body: 'こもれび生命は、保険業法に基づき金融庁の監督を受けており、公正な取引と厳格なデータプライバシー保護を徹底しております。以下に重要な制度についてご案内いたします。


    ■生命保険契約者保護機構について

    万が一、弊社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性がある点にご留意ください。


    ■クーリング・オフについて

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回（クーリング・オフ）することが可能です。


    ■告知義務について

    ご契約時に健康状態等を正確に伝える義務があります。事実に反する告知（告知義務違反）があった場合、契約が解除されたり、保険金・給付金が支払われなかったりすることがあります。


    ■生命保険料控除について

    新制度の契約では、一般生命保険料、介護医療保険料、個人年金保険料の区分ごとに所得税で最高40,000円、合計で最高120,000円まで適用されます。なお、2026年分と2027年分に限り、23歳未満の扶養親族がいる方の一般生命保険料控除は最高60,000円となります（合計上限は120,000円のままです）。


    ■高額療養費制度について

    公的医療保険により、所得に応じた月ごとの自己負担上限が設けられています。また、2026年8月の診療分からは、年間の上限も設けられています。民間の医療保険は、こうした公的制度でカバーしきれない不足分を補完する役割を担います。'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: ab022f2d-5b88-58a4-94de-e48479719d96
  title: request_policy_loan を使う場面
  body: 'お客さまから、解約返戻金がある保険契約について「契約者貸付（ポリシーローン）」の申し込みがあった際に、この手続きを行います。契約者貸付とは、解約返戻金の一定範囲内で資金を借り入れることができる制度です。


    【手続きの流れ】

    1. お客さまのフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させます。

    2. `get_accounts` を呼び出し、お客さまが保有している契約の一覧から、対象となる契約の account_id を特定します。

    3. お客さまが希望される借入金額を確認します。

    4. `request_policy_loan` を呼び出し、特定した account_id と借入希望金額を指定して、貸付の申し込みを完了させます。


    ※貸付金利や返済方法などの詳細について、個別の税務相談や医療的助言は行わないようご注意ください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_policy_loan
  institution_id: komorebi_life
- id: fba9a14b-b151-536b-bb49-4314f1ded710
  title: request_policy_loan ツールリファレンス
  body: '解約返戻金の一定範囲内で、契約者貸付を申し込むためのツールです。エージェントはこのツールを直接呼び出すことで手続きを完了させます。


    ■シグネチャ

    `request_policy_loan(account_id: string, loan_amount: number)`


    ■引数

    - `account_id`: `get_accounts` 等で特定した、貸付対象となる保険契約の識別子です。

    - `loan_amount`: お客さまが希望される借入金額（円）です。


    ■動作

    指定された契約の解約返戻金に基づき、貸付可能額の範囲内で申し込み処理を行います。本人確認（`verify_identity`）が完了していることが前提となります。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_policy_loan
  institution_id: komorebi_life
- id: fcdfa0e4-581e-585a-afdc-77e91042e85b
  title: reinstate_policy を使う場面
  body: '保険料の払い込みが滞り、払込猶予期間を過ぎて契約が「失効」してしまったお客さまから、契約の「復活」を希望された場合にこの手続きを行います。復活手続きには、原則として所定の期間内であることと、改めての告知が必要となります。


    【手続きの流れ】

    1. お客さまのフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させます。

    2. `get_accounts` を呼び出し、失効状態にある契約の account_id を特定します。

    3. 復活にあたり、現在の健康状態などの告知事項を伺います。

    4. `reinstate_policy` を呼び出し、account_id を指定して復活の申し込みを行います。


    ※告知内容に不備がある場合や、期間を過ぎている場合は復活できないことがある旨を誠実に案内してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - reinstate_policy
  institution_id: komorebi_life
- id: 12dad949-234a-5a5b-8040-75ece2be66f8
  title: reinstate_policy ツールリファレンス
  body: '払込猶予期間を過ぎて失効した契約の復活を申し込むためのツールです。エージェントはこのツールを直接呼び出すことで手続きを完了させます。


    ■シグネチャ

    `reinstate_policy(account_id: string)`


    ■引数

    - `account_id`: `get_accounts` 等で特定した、失効している保険契約の識別子です。


    ■動作

    指定された契約の復活手続きを受け付けます。このツールを呼び出す前に、エージェントは必ず最新の告知内容を確認し、復活可能な期間内であることを確認する必要があります。本人確認（`verify_identity`）が完了していることが前提となります。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - reinstate_policy
  institution_id: komorebi_life
- id: fe698491-1b42-5263-9161-4819c38fb7cd
  title: send_deduction_certificate を使う場面
  body: 'お客さまから、確定申告や年末調整に必要な「生命保険料控除証明書」の再発行および郵送の依頼があった際にこの手続きを行います。


    【手続きの流れ】

    1. お客さまのフルネームと生年月日を確認し、`verify_identity` を呼び出して本人確認を完了させます。

    2. お客さまの現在の住所に間違いがないか確認します。住所変更が必要な場合は、先に連絡先情報の更新を行ってください。

    3. `send_deduction_certificate` を呼び出し、証明書の再発行と郵送を依頼します。


    ※控除額の具体的な計算や、個別の税務相談については、「個別の税務相談は行わない」という方針に基づき、税理士または管轄の税務署へ案内してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_deduction_certificate
  institution_id: komorebi_life
- id: e7d3be38-8a4b-5832-947e-7b73d29eea8c
  title: send_deduction_certificate ツールリファレンス
  body: '生命保険料控除証明書を再発行して郵送するためのツールです。エージェントはこのツールを直接呼び出すことで手続きを完了させます。


    ■シグネチャ

    `send_deduction_certificate()`


    ■引数

    なし（認証済みのお客さまの登録住所へ郵送されます）。


    ■動作

    認証済みのお客さまの最新の契約内容に基づき、生命保険料控除証明書を発行し、登録住所へ郵送手続きを行います。本人確認（`verify_identity`）が完了していることが前提となります。'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
