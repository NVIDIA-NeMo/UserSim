- id: 252e4156-c5a5-58b9-ad1c-1f3849e23215
  title: こもれび終身保険（低解約返戻金型）：解約・変更・プランの切替え
  body: 'ご契約内容の変更や解約、プランの切替えを希望される際の手順をご案内します。


    【お手続きの流れ】

    1. 内容の提示：カスタマーセンターまたはWebチャットにて、「解約したい」「プランを変更したい」旨をお伝えください。

    2. 本人確認：ご契約者のフルネームと生年月日をお伺いし、本人確認を完了させます。

    3. 現状の確認：現在の解約返戻金の金額をご確認いただきます。本商品は低解約返戻金型のため、低解約返戻金期間中の場合は、解約返戻金の水準が70%となる点について改めてご説明いたします。

    4. 手続きの実施：

    ・解約の場合：解約申請書へのご署名・ご捺印をいただき、当社へご返送ください。書類が届き次第、手続きが完了し、返戻金がお振込みとなります。

    ・変更・切替えの場合：新しいプラン内容をご提案し、同意を得た後、変更手続きを行います。


    【ご注意事項】

    低解約返戻金期間中に解約された場合、受け取れる金額が大幅に少なくなる可能性がございます。プランの切替えをご検討の際は、十分にご検討ください。'
