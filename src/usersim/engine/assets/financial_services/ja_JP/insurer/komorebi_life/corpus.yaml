- id: 741e8208-8152-58e4-9920-a54eb507e246
  title: こもれび個人年金保険：規定・約款の変更
  body: 'こもれび個人年金保険の規定および約款は、法令の改正や社会情勢の変化に基づき、適切に変更されることがあります。本プランをご検討中の方は、以下の基本原則についてご確認をお願いいたします。


    【契約者の権利と義務】

    お客様には、契約時に健康状態等を正確に伝える「告知義務」がございます。事実に反する告知をした場合、契約が解除されたり、保険金・給付金が支払われなかったりすることがありますので、十分にご注意ください。


    【クーリング・オフについて】

    お申し込み後、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回（クーリング・オフ）することが可能です。


    【資産の保護について】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される場合があることをあらかじめご了承ください。


    【変更の通知】

    約款の内容を変更する場合、当社はあらかじめお客様に通知いたします。変更後の規定に基づき、適正な保険料体系と安定した給付金支払いの原資を維持し、お客様の長期的な安心を第一に考えた運用を行います。'
