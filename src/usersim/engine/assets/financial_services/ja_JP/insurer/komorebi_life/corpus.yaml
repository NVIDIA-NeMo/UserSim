  body: 'お客様より「想定していた金額や手数料と異なる」との申し出があった場合は、以下の手順で確認してください。


    【確認ステップ】

    1. 適用率の確認：現在の返戻率の例（108%）などの基準値と、お客様の契約時の料率に乖離がないか確認します。

    2. 手数料の根拠提示：事務手数料や貸付手数料が発生している場合、その運営コスト回収の根拠を明確に説明します。

    3. 告知義務等の確認：告知義務違反等による制限が発生していないか確認します。


    【解決しない場合】

    上記で解決せず、お客様が納得されない場合は、速やかに専門部署およびコンプライアンス部門へエスカレーションしてください。生命保険協会の生命保険相談所と連携し、誠実かつ迅速な解決を図ります。'
