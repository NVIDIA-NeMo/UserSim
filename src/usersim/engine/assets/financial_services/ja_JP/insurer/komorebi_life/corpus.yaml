  title: こもれび終身保険（低解約返戻金型）：重要事項のご説明
  body: '【責任準備金等の補償】

    本商品は生命保険契約者保護機構の制度対象であり、万が一の際も責任準備金等の90%まで補償されます。


    【解約時の注意点】

    本商品は低解約返戻金型です。低解約返戻金期間中に解約された場合、解約返戻金は標準的な終身保険の70%となるため、元本を割り込むリスクがあります。


    【告知義務と契約解除】

    契約時の告知義務に違反し、事実と異なる告知をした場合、保険法に基づき契約解除や保険金・給付金が支払われないことがあります。


    【クーリング・オフ】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、無条件で契約を撤回いただけます。'
