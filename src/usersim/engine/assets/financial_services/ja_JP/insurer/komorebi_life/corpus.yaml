- id: 5f1846d5-8fa3-5022-bebe-395331cf40df
  title: こもれび終身保険（低解約返戻金型）：個人情報の取扱い
  body: 'こもれび生命では、金融庁の監督および保険業法に基づき、お客様の個人情報を厳格に保護いたします。


    【個人情報の利用目的】

    ご提供いただいたフルネーム、生年月日、健康状態などの個人情報は、以下の目的のみに利用いたします。

    ・保険契約の審査および成立手続き

    ・保険金および給付金の適正な支払い

    ・契約内容の変更手続きおよびお問い合わせへの対応


    【プライバシー保護の徹底】

    お客様の機密情報は厳重に管理し、法令に基づく場合を除き、第三者に提供することはありません。また、セキュリティ強化のため、クレジットカード番号やパスワードなどの機密情報を弊社から要求することはございません。


    【データ保護に関する権利】

    お客様は、ご自身の個人情報の開示、訂正、利用停止を請求することが可能です。手続きの詳細については、カスタマーセンターまでお問い合わせください。


    【万が一の保護機構について】

    弊社が万が一破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。透明性の高い運営を通じて、お客様の長期的な安心を第一に考えたサービスを提供してまいります。'
