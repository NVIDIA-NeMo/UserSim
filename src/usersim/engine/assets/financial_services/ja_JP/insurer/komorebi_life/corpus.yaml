  body: '【質問】入院した際、一日あたりいくらの給付金を受け取れますか？

    【回答】「こもれび医療保険」では、入院給付金として日額10,000円を支給しております。


    【質問】入院給付金を受け取れる日数に制限はありますか？

    【回答】はい。1回の入院につき最大60日まで、また契約期間を通じて通算で最大1,095日まで支給対象となります。詳細は「こもれび医療保険：商品概要」をご確認ください。'
