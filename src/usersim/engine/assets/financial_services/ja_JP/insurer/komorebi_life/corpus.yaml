- id: b3e3c314-6381-55f7-b5fe-fd77dada3082
  title: こもれび終身保険（低解約返戻金型）：限度額・制限と注意事項
  body: '「こもれび終身保険（低解約返戻金型）」をご案内いただく際は、以下の制限および注意事項について正確にお伝えください。


    【解約返戻金の制限】

    本商品は、保険料を抑えるために「低解約返戻金期間」を設けております。この期間中に解約された場合、受け取れる解約返戻金の水準は、標準的な終身保険と比較して70%となる設計です。早期解約によるお客様の不利益を避けるため、この点について十分なご説明をお願いします。


    【保険料の払込み期間】

    プランによって払込み期間が異なります。例えば、保険料の払込みが終わる年齢を60歳とする設定などが一般的です。払込満了後は、保険料の支払いは不要ですが、保障は一生涯継続されます。


    【保障額の例】

    保険金額の例として5,000,000円などの設定が可能ですが、お客様の年齢や健康状態、告知内容によってお引き受けできる限度額が異なります。


    【重要事項】

    ・告知義務に違反した場合、契約解除や保険金・給付金が支払われないことがあります。

    ・本商品は医療的な助言や個別の税務相談を行うものではありません。

    ・万が一の破綻時には、生命保険契約者保護機構により責任準備金等の90%まで（高予定利率契約を除く）が補償されます。'
