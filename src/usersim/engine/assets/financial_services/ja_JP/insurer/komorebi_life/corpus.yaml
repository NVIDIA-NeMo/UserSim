- id: 7b98f00c-026b-54cb-9594-2650fe0541c8
  title: こもれびがん保険：重要事項のご説明
  body: '本保険をご契約いただくにあたり、以下の重要事項を必ずご確認ください。


    【監督および保護制度】

    当社は保険業法に基づき、金融庁の監督を受けております。万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があることをあらかじめご了承ください。


    【告知義務について】

    ご契約時に健康状態等を正確に伝える義務がございます。事実に反する告知をした場合、契約解除や保険金・給付金が支払われないことがあります。


    【保障の制限】

    本保険には、契約後90日間の「待ち期間」が設けられています。この期間中の診断については保障されません。


    【クーリング・オフ】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回いただけます。


    【免責事項】

    当社は保険制度の一般的な解説は行いますが、個別の税務相談や医療的な助言は一切行いません。ご不明な点は税理士や医師などの専門家にご相談ください。'
  domain: insurance
  product_category: gan_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
