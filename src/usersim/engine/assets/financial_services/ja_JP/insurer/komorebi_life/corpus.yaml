- id: 500fe862-8d76-52e4-af4d-e59cfe4e28b2
  title: こもれび終身保険（低解約返戻金型）：この商品をかたる詐欺にご注意ください
  body: 'こもれび生命では、お客様の安心を第一に考えております。最近、当社の「こもれび終身保険（低解約返戻金型）」をかたる悪質な詐欺が発生しております。以下の点に十分ご注意ください。


    【詐欺の典型的な手口】

    「低解約返戻金型という特殊な仕組みを利用して、短期間で資産を大幅に増やせる」などと、保険の本来の目的とは異なる不自然な利益を強調して勧誘するケースがございます。当社の商品は、将来の保障と貯蓄性をバランスよく両立させるものであり、短期間で高額な利益を保証する投資商品ではございません。


    【当社の徹底したルール】

    こもれび生命では、どのような理由があっても、電話やメール、チャットなどのやり取りの中で、以下のような機密情報を要求することは一切ございません。

    ・クレジットカード番号

    ・暗証番号

    ・パスワード

    ・身分証明書番号（マイナンバーなど）


    【不審なと感じたときの対応】

    もし、「手続きのために暗証番号が必要だ」と言われたり、不自然な点を感じたりした場合は、すぐにやり取りを中止してください。まずは当社のカスタマーセンターまでご連絡をお願いいたします。


    お客様のご資産と大切な情報を守るため、不審な連絡には十分にご注意ください。'
