- id: 7ecda29c-91ac-591c-8d6b-af92f4a49c08
  title: こもれびがん保険：個人情報の取扱い
  body: 'こもれび生命では、金融庁の監督および保険業法に基づき、お客様の個人情報を厳格に保護いたします。


    ■個人情報の収集目的

    「こもれびがん保険」の提供にあたり、以下の目的で個人情報を利用いたします。

    ・保険契約の締結および管理

    ・告知内容に基づく引受審査（加入可否の判断）

    ・保険金および給付金のお支払い手続き

    ・重要事項のご案内およびお知らせの送付


    ■情報の管理と保護

    お客様からお預かりした健康状態などの機密情報は、厳重なセキュリティ体制のもとで管理し、法令に基づき適切に取り扱います。正当な理由なく第三者に提供することはございません。


    ■お客様の権利

    ご自身の登録内容の確認や修正、削除を希望される場合は、カスタマーセンターまでご連絡ください。本人確認（フルネームおよび生年月日の確認）の後、速やかに対応いたします。


    ■破綻時の補償について

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。'
