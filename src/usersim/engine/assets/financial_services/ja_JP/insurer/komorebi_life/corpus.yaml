- id: 74a3259f-21d1-580e-b93d-bcee31df5b49
  title: こもれび終身保険（低解約返戻金型）：規定・約款
  body: '本商品は、生涯にわたる保障を提供することを目的とした生命保険契約です。契約者は、設定された保険料を支払済年齢である60歳まで（または選択した払込期間まで）に払い込む義務を負います。本プランは低解約返戻金型を採用しており、解約返戻金支払事由が発生した際、低解約返戻金期間中の解約返戻金は、標準的な解約返戻金の70%となる規定となっております。


    また、契約者は告知義務を負い、事実と異なる告知があった場合は契約解除となる可能性があります。一方、契約者は書面受取後8日以内であれば、クーリング・オフ制度に基づき無条件で契約を撤回できる権利を有します。契約内容の変更および解約の手続きについては、厳格な本人認証を経て実行されます。'
