  institution_id: komorebi_life
- id: 1cbab1dd-61e0-5275-9b4c-ab15489b58a4
  title: こもれび終身保険（低解約返戻金型）：状況・履歴の確認
  body: '現在のご契約状況や、これまでの保険料のお支払い履歴を確認する方法をご案内します。


    【ご用意いただくもの】

    ・ご契約者さまのフルネーム

    ・生年月日


    【お手続きの手順】

    1. カスタマーセンターまたはWebチャットにて、状況確認を希望される旨をお伝えください。

    2. 本人確認のため、ご契約者さまのフルネームと生年月日をお伺いしますので、正しくお伝えください。

    3. 確認したい内容（例：現在の解約返戻金の見込額、直近の保険料お支払い日など）をお伝えください。

    4. 当社にて最新のデータを確認し、現在の状況や履歴を回答いたします。


    【ご確認いただける内容】

    ・現在の解約返戻金の概算額（低解約返戻金期間中かどうかを含めて回答します）

    ・保険料の払込み状況

    ・保険金額（例：5,000,000円など）の再確認


    ※パスワードや暗証番号、身分証明書番号をお伺いすることはございません。ご注意ください。'
