- id: 0e01925e-4af0-5a0b-b552-6b3054f48b1c
  title: こもれび終身保険（低解約返戻金型）：お取引が拒否された・制限された
  body: 'ご契約内容の変更や、契約者貸付などの手続きができない、または制限されている場合に考えられる原因と対処法をご案内します。


    【よくある原因】

    1. 本人確認が完了していない

    手続きの前に、フルネームと生年月日の確認が必要です。入力内容や申告内容が登録情報と一致しない場合、セキュリティ保護のため手続きが制限されます。

    2. 保険料の未払い（失効状態）

    保険料の払込みが一定期間滞り、契約が「失効」している場合、一部の手続き（貸付や変更など）ができなくなります。

    3. 内部規定による制限

    コンプライアンス上の確認が必要な案件として、専門部門へエスカレーションされている場合があります。


    【対処法】

    ・まず、改めてフルネームと生年月日を正確にお伝えいただき、本人確認を完了させてください。

    ・保険料のお支払い状況を確認し、もし失効している場合は「復活」の手続きについてご相談ください。


    【解決しない場合】

    上記の確認を行っても制限が解除されない場合は、当社のコンプライアンス部門にて詳細を調査いたします。調査完了後、速やかにお客様へご連絡いたします。'
  domain: insurance
  product_category: shushin_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
