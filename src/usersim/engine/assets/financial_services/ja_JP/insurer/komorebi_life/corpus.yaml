- id: 6dd323be-3ee3-5405-90f0-0d574e24ee48
  title: こもれび終身保険（低解約返戻金型）：ご利用開始までの手順
  body: 'こもれび終身保険（低解約返戻金型）のご利用開始までの流れをご案内します。サポート担当者は、お客様が迷わず手続きを完了できるよう、以下のステップに沿ってご案内ください。


    1. お申込みと意向確認

    お客様の意向と客観的なデータに基づき、最適なプランを提案します。例えば、保険金額の例として5,000,000円などの設定が可能です。


    2. 本人確認

    手続きの前に、お客様のフルネームと生年月日を確認し、本人確認を完了させます。


    3. 告知事項の確認

    健康状態などの告知義務についてご説明し、正確な回答をいただきます。事実に反する告知があった場合、将来的に契約解除となるリスクがあることを明確に伝えます。


    4. 審査とご成約

    告知内容に基づき審査を行い、承諾となった後、契約成立となります。


    5. 保険証券の送付

    契約内容を記載した書面をお届けします。お客様には、書面受取後8日以内であればクーリング・オフが可能である旨を改めてご案内してください。


    【プランの特徴】

    ・低コストで死亡保障と貯蓄性を両立させています。

    ・低解約返戻金期間中の解約返戻金の水準は70%です。

    ・例として、40歳女性が60歳まで保険料を払い込む場合、月払保険料の例は12,400円となります。'
