- id: 5ac3829c-0b30-54ff-a78e-0fa9362ff64f
  title: こもれび医療保険：ログインできない・アクセスできない
  body: 'Webチャットやお客様専用ページにログインできない、またはアクセスできない場合の対処法をご案内いたします。


    【よくある症状】

    ・IDまたはパスワードを入力しても「認証に失敗しました」と表示される

    ・ログインボタンを押しても画面が切り替わらない

    ・ページが表示されず、エラーメッセージが出る


    【確認していただきたいこと】

    1. 入力内容の再確認：大文字・小文字の区別や、不要なスペースが入っていないかをご確認ください。

    2. 通信環境の確認：Wi-Fiやモバイルデータ通信が安定しているか、機内モードになっていないかをご確認ください。

    3. ブラウザの更新：ブラウザのキャッシュをクリアするか、別のブラウザでお試しください。


    【解決しない場合の対応】

    上記を確認しても解決しない場合は、カスタマーセンターまでお知らせください。弊社にて以下の対応を行います。

    ・アカウントの状態確認：ロックがかかっていないか、または有効期限が切れていないかを確認します。

    ・パスワード再設定のご案内：ご本人確認（フルネームと生年月日）の上、パスワードの再設定手順をご案内します。


    【専門部署へのエスカレーション】

    システム的な不具合が疑われる複雑な案件については、内部規定に基づき、速やかに専門のコンプライアンス部門およびシステム管理部門へエスカレーションし、原因究明と復旧に努めます。解決までにお時間をいただく場合がございますが、誠実に対応させていただきます。'
