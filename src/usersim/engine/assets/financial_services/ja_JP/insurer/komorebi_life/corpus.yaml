- id: bcca801b-9570-5223-b708-88ae24355ef8
  title: こもれび終身保険（低解約返戻金型）：ほかの選択肢との比較と向かない場合
  body: '本商品は、長期的な視点で誠実な保障を準備したい方に最適ですが、すべての方に向いているわけではありません。


    【本商品が向いている方】

    ・生涯にわたる死亡保障を確保しつつ、無理のない保険料で準備したい方。

    ・60歳までの払込期間など、計画的に資産を積み上げたい方。


    【本商品が向かない方】

    ・数年以内に解約して資金を回収する可能性がある方。低解約返戻金期間中の解約返戻金は70%に制限されるため、大きな損失となります。

    ・短期的に高い流動性を求める方。


    【代替案の検討】

    短期間の保障のみを目的とする場合は、「こもれび定期保険：商品概要」をご検討ください。また、老後資金のみを目的とする場合は、個人年金保険の方が適している場合がございます。'
