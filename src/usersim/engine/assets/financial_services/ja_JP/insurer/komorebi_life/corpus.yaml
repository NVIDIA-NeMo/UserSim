- id: 63bbc242-29c6-5d9a-b732-40d271489047
  title: こもれびがん保険：お申込みとご利用開始
  body: '「こもれびがん保険」への加入手続きは、以下のステップで進めていただけます。


    【お手続きの流れ】

    1. 本人確認：まず、お客様のフルネームと生年月日をお伺いし、ご本人様確認を完了させます。

    2. 告知事項の確認：現在の健康状態などについて、正確にお伝えいただく「告知義務」がございます。事実に反する告知をされますと、将来的に契約解除や保険金の不支払いに繋がる可能性があるため、誠実な回答をお願いいたします。

    3. プランの決定：保障内容と保険料をご確認いただき、プランを選択します（例：40歳男性・終身払の場合、月払保険料は1,980円となります）。

    4. 契約成立：内容に同意いただき、お手続きが完了すると保障が開始されます。


    【重要：クーリング・オフについて】

    お申込み後、または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回（クーリング・オフ）することが可能です。


    【完了の確認】

    お手続き完了後、ご登録の連絡先に契約成立の通知をお送りいたします。通知をもって正式に保障が開始されます。'
