- id: c8a66168-eff3-51d4-8cea-e8eb4c004474
  title: こもれび個人年金保険：月払保険料の例（30歳加入、65歳払込満了）について
  body: '【質問】

    30歳で加入し、65歳で保険料の払込みを終える（払込満了）場合、月々の保険料はどのくらいになりますか？


    【回答】

    月払保険料の例は10,000円です。


    保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用し、透明性の高い価格設定としております。なお、実際のお手続きにあたっては、お客様の状況により異なる場合がございますので、詳細なプラン提案をご希望の方はぜひお問い合わせください。'
