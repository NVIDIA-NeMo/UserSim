- id: e9de1797-b611-5417-9e88-363b308922d1
  title: こもれび定期保険：個人情報の取扱い
  body: 'こもれび生命では、お客様からお預かりした個人情報を、金融庁の監督および保険業法に基づき厳格に管理いたします。


    【利用目的】

    ・保険契約の締結、維持、および保険金・給付金のお支払い手続き

    ・告知義務違反の確認および不正請求防止のための調査

    ・生命保険契約者保護機構への報告（責任準備金等の90%まで補償される仕組みの維持のため）


    【安全管理】

    個人情報の漏洩を防ぐため、内部管理体制を整備し、アクセス権限を厳格に制限しております。また、受取人の変更等の重要手続きに際しては、本人確認書類を用いた厳格な認証を必須としております。詳細については、弊社のプライバシーポリシーをご確認ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: bf6efbb6-6b35-53b0-ac1c-41d75dee780f
  title: こもれび定期保険：この商品をかたる詐欺にご注意ください
  body: '最近、当社の「こもれび定期保険」をかたる不審な電話やメールが増加しております。特に「限定プランで保険料を大幅に下げられる」や「至急、契約内容の更新が必要」といった内容で、個人情報や振込先口座の変更を促す手口が報告されています。


    こもれび生命では、電話やメールでクレジットカード番号の全桁や、暗証番号などの機密情報を伺うことはございません。また、担当エージェント以外から突然、不自然な送金を求めることはございません。


    もし不審な連絡を受け取られた場合は、すぐに手続きを中断し、ご契約時に案内されている担当窓口までお知らせください。万が一、個人情報を伝えてしまった場合は、速やかに当社のコンプライアンス部門へご報告いただけますようお願い申し上げます。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 09353de2-5f56-511c-a460-05b9f63d0f0d
  title: こもれび定期保険：限度額・制限と注意事項
  body: '「こもれび定期保険」のご案内における重要な制限事項および注意事項は以下の通りです。お客様へのご提案時に必ずご確認ください。


    ■加入制限および限度額

    ・契約可能な年齢の上限：70歳まで

    ・保険期間：10年（固定）


    ■保障内容の例

    ・保険金額の例：30,000,000円

    ・月払保険料の例：3,150円

    ※上記はあくまで例であり、実際のリスクと年齢に基づき適正に設定されます。


    ■重要な注意事項

    ・告知義務について：ご契約時に健康状態等を正しく伝える義務がございます。事実と異なる告知をした場合、契約解除や保険金・給付金が支払われないリスクがあります。

    ・クーリング・オフ：書面受取後8日以内であれば、無条件で契約を撤回いただけます。


    詳細は「こもれび定期保険：重要事項のご説明」をご参照ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 2c96350c-f18e-52d8-a1f0-e1f44a8a49cb
  title: こもれび定期保険：契約できる年齢の上限について
  body: 'Q：こもれび定期保険に加入できる年齢には上限がありますか？


    A：はい。本プランに加入いただける年齢の上限は70歳までとなっております。


    Q：71歳の方ですが、プランの内容を変更して加入することは可能ですか？


    A：申し訳ございませんが、「こもれび定期保険」は上限年齢が70歳と定められており、それを超える方の新規ご加入は承ることができません。お客様のライフステージに合わせた他のプランについて、担当エージェントにご相談ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: faq
  source_authority: official
