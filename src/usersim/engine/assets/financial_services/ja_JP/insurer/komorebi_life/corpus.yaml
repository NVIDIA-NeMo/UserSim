- id: b938aa67-878c-5231-9fd1-40454d621081
  title: こもれび終身保険（低解約返戻金型）：安全にご利用いただくためのポイント
  body: 'こもれび終身保険（低解約返戻金型）を安全にご利用いただくために、以下のセキュリティ上の注意点をご確認ください。


    【本人確認について】

    契約内容の変更や、給付金のお手続きを行う際は、必ずお客様の「フルネーム」と「生年月日」を確認させていただきます。これは、大切なお客様の情報を守るための重要な手続きです。


    【弊社が絶対に要求しない情報】

    こもれび生命では、いかなる場合においても、電話やメール、チャットを通じて以下の機密情報を要求することはございません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・お客様のパスワード

    ・身分証明書番号（マイナンバーなど）


    もし、弊社社員を名乗る人物からこれらの情報を求められた場合は、詐欺の可能性があります。すぐに通話を切り、カスタマーセンターまでご連絡ください。


    【不審な点があるときは】

    心当たりのない通知が届いた場合や、手続き内容に不自然な点があると感じられた際は、速やかに弊社までお知らせください。お客様の不利益を最小限に抑えるため、迅速かつ誠実に対応いたします。'
