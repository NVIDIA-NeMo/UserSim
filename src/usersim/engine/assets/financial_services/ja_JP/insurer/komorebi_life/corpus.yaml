- id: a39f5547-9bfc-5750-944d-6c2ead3477f1
  title: こもれび定期保険：よくあるお手続きの流れ
  body: '「こもれび定期保険」のお申し込みからご契約完了までの一般的な流れをご案内します。


    【お手続きの流れ】

    1. 保障内容の決定：お客様が必要とされる保険金額（例：30,000,000円）と、保険期間（10年）を確認し、プランを決定します。

    2. ご告知：現在の健康状態について、正確にお伝えください。告知義務に基づき、事実に反する内容がないか確認させていただきます。

    3. お支払い方法の設定：月払保険料（例：3,150円）のお支払い方法（口座振替またはクレジットカード）を指定してください。

    4. ご契約の成立：当社にて審査を行い、承諾となりましたらご契約成立となります。この際、契約内容を記載した書面をお届けします。

    5. クーリング・オフ期間の確認：書面を受け取った日（または申込日）のいずれか遅い日から8日以内であれば、お申し込みを撤回することが可能です。


    【完了の目安】

    保険証券がお手元に届き、保障内容に相違がないことをご確認いただいた時点で、すべてのお手続きが完了となります。


    詳細な条件については、「こもれび定期保険：商品概要」をご参照ください。'
