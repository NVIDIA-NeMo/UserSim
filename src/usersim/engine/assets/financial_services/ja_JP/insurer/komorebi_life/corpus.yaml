- id: 24c7a3e3-55be-5ca7-9669-f9e5878a9bf2
  title: こもれび定期保険：プランの選び方
  body: 'こもれび定期保険は、「少ない保険料で、必要な期間だけ大きな保障を確保できる効率的なプランです」。


    生涯にわたる保障を準備したい方は「こもれび終身保険（低解約返戻金型）」が適していますが、特定の期間（例：10年）だけ集中的に、例えば30,000,000円のような大きな保障を、月々3,150円などの低廉な保険料で確保したい場合は、本プランが最適です。お客様のライフステージとリスク許容度に合わせてお選びください。'
  domain: insurance
