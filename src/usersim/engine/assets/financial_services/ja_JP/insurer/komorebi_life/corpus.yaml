  title: こもれび終身保険（低解約返戻金型）：登録内容の変更
  body: 'ご住所やご連絡先などの登録内容を変更される際は、以下の手順でお手続きください。


    1. 変更内容の提示：変更したい項目（住所、電話番号、メールアドレス等）を弊社担当者へお伝えください。

    2. 本人認証：ご本人確認書類および契約者番号をご提示ください。厳格な本人認証を経て手続きへ進みます。

    3. 内容の確認と更新：弊社にて変更内容を確認し、登録情報を更新いたします。

    4. 完了通知：手続き完了後、変更内容を記載した確認書を発送または電子的に送付いたします。


    セキュリティの詳細については「こもれび終身保険（低解約返戻金型）：安全にご利用いただくためのポイント」をご確認ください。'
