- id: 2e310cbc-9748-5e7d-8bde-887f1402628f
  title: こもれび医療保険：おすすめの方と主な使い方
  body: '「こもれび医療保険」は、公的医療保険の高額療養費制度を補完し、入院や手術に伴う経済的な不安を軽減したい方に最適なプランです。特に、予期せぬ病気やケガに備え、効率的に保障を確保したい方におすすめいたします。


    【本プランの主な保障】

    ・入院給付金：日額10,000円を支給し、入院中の生活費や差額ベッド代に充てることができます。

    ・手術給付金：入院中の手術には100,000円、外来での手術には50,000円を支給します。

    ・先進医療への備え：高額な治療費が必要な先進医療に対し、最大20,000,000円まで保障いたします。


    【保険料の例】

    月額2,480円からという無理のないプラン設計で、将来への安心を準備いただけます。詳細なプラン選びについては、「こもれび医療保険：プランの選び方」をご参照ください。'
