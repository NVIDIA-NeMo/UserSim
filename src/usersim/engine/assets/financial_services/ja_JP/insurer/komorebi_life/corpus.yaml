  title: こもれび終身保険（低解約返戻金型）：当社の似た商品との比較
  body: '【こもれび終身保険（低解約返戻金型）】

    ・特徴：生涯の保障と解約返戻金の積み立てが可能。低解約返戻金型のため保険料を抑制。

    ・費用例：月払12,400円（例）

    ・向いている方：一生涯の保障を確保しつつ、将来的に解約返戻金を活用したい方。


    【こもれび定期保険：商品概要】

    ・特徴：必要な期間だけ大きな保障を効率的に確保。解約返戻金は原則的にありません。

