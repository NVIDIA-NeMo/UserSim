- id: 0dc68397-948c-5276-a557-737e6c0bc6c1
  title: こもれび終身保険（低解約返戻金型）：ログインできない・アクセスできない
  body: 'Webチャットやマイページにログインできず、契約内容の確認ができない場合の対処法をご案内します。


    【考えられる原因と確認事項】

    1. 入力情報の誤り

    IDやパスワードに誤りがないか、大文字・小文字や全角・半角が正しく入力されているかをご確認ください。


    2. 通信環境の影響

    インターネット接続が不安定な場合、正しく認証されないことがあります。一度接続を確認し、再度お試しください。


    【解決方法】

    上記を確認しても解決しない場合は、カスタマーセンターまでお知らせください。以下の手順で対応いたします。


    1. 本人確認

    お電話またはチャットにて、お客様のフルネームと生年月日を確認し、ご本人様であることを認証します。


    2. 原因の特定とリセット

    アカウントの状態を確認し、必要に応じてパスワードの再発行手続きを行います。


    【弊社での対応（エスカレーション）】

    認証情報に不整合があるなど、複雑な案件については、速やかに専門のコンプライアンス部門へエスカレーションし、安全かつ確実にアクセスを復旧させます。解決までにお時間をいただく場合がございますが、誠実に対応させていただきます。'
