- id: 5f23ce88-b925-5603-8069-53845748c6ec
  title: こもれび個人年金保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの大切な資産と個人情報を守るため、セキュリティ対策を徹底しております。しかし、保険商品をかたる巧妙な詐欺の手口が増えています。被害を防ぐため、以下の点に十分ご注意ください。


    【こもれび生命が絶対に要求しない情報】

    当社がお電話やチャット、メールなどで、以下の機密情報を求めることは一切ございません。

    ・クレジットカード番号

    ・口座の暗証番号

    ・Webサービスのパスワード

    ・身分証明書（マイナンバーカード等）の番号そのもの


    【ご本人確認の方法について】

    契約内容の変更や解約などのお手続きを行う際は、まずお客さまの「フルネーム」と「生年月日」を確認させていただきます。これ以外の機密情報を提示するように求められた場合は、不審な連絡である可能性が高いため、すぐにやり取りを中止してください。


    【もし不安を感じたら】

    「急いで手続きをしないと損をする」といった強い言葉で不安を煽られたり、不自然な点があると感じたりした場合は、すぐにカスタマーセンターへご連絡ください。迅速に状況を確認し、誠実に対応させていただきます。


    お客さまに安心してお選びいただけるよう、透明性の高い運用と厳格なプライバシー保護を徹底してまいります。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: security_advisory
  source_authority: official
