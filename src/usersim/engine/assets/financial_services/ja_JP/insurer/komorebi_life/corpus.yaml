- id: 48727be5-5197-5bb8-bfa4-cd323b4909c1
  title: こもれび医療保険：解約・変更・プランの切替え
  body: 'ご契約内容の変更や解約、プランの切替えを希望される場合は、以下の手順でお手続きをお願いいたします。


    1. お手続き内容の提示：変更したい内容（例：受取人の変更、保障額の変更、または解約）を当社にお申し出ください。

    2. 本人認証：セキュリティ保護のため、契約者番号および本人確認書類（運転免許証等）のご提示をお願いいたします。認証が完了するまで手続きは行えません。

    3. 内容の確認と提案：プラン切替えの場合、現在の保障内容と新しいプランの差異、および保険料の変化についてご案内いたします。

    4. 承諾と完了：内容にご同意いただいた後、変更手続きを実行いたします。手続き完了後、変更内容を記載した書面が発送されます。


    なお、新契約時にクーリング・オフを希望される場合は、書面受取後8日以内にご連絡ください。'
