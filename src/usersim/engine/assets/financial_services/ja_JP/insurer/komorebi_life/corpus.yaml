  title: set_alerts ツールリファレンス
  body: set_alerts ツールは、お客様のご契約に関する各種通知（アラート）を設定するために使用します。エージェントはこのツールを直接呼び出すことで、お客様が希望される通知項目の有効化や変更を即座に実行し、お客様が将来への不安を解消し、安心感を得られるようなサポートを実現します。
