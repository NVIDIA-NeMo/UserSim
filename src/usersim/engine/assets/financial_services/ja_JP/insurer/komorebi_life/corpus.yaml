- id: 94e27447-b268-595e-b92f-d118dd744455
  title: こもれび定期保険：想定外の手数料・金額
  body: 'お客様より「提示されていた保険料と実際の請求額が異なる」などの、想定外の金額に関するお問い合わせをいただいた際の対応手順です。


    【考えられる原因】

    ・例示金額（3,150円など）を実際の適用金額と混同されている。

    ・年齢や性別、保険金額の設定が、例示の条件（30歳男性、10年期間）と異なっている。

    ・告知内容に基づき、保険料に調整が入っている。


    【確認と解決ステップ】

    1. 条件の再確認：お客様が設定された「保険金額」と「保険期間（10年）」、および加入時の年齢・性別を改めて確認します。

    2. 例示との違いを説明：ご提示した金額が「例」であったことを丁寧にお伝えし、現在の設定に基づいた適正価格であることを具体的に説明します。

    3. 明細の提示：月払保険料の内訳を明確にし、透明性の高い説明を行います。


    【エスカレーション】

    上記の説明を行っても納得いただけない場合や、不当な請求であるとの苦情に発展した場合は、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションしてください。公正な解決を図るため、必要に応じて生命保険協会の生命保険相談所と連携します。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
