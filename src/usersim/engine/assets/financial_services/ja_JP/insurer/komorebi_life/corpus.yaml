  title: こもれび終身保険（低解約返戻金型）：金利・料率一覧
  body: 'こもれび終身保険（低解約返戻金型）の保険料設定についてご案内します。当社はリスクの分散と安定した給付金支払いのための原資として適切に運用し、透明性の高い料率を維持しています。


