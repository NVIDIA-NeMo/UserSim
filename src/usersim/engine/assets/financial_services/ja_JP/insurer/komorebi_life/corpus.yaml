- id: 3be01fc0-4713-5878-b32a-bac24fa86a8f
  title: こもれび定期保険：ログインできない・アクセスできない
  body: '「マイページにログインできない」「契約内容の確認画面にアクセスできない」といった場合の解決方法をご案内します。


    【考えられる原因と確認事項】

    1. 通信環境の確認

    インターネット接続が不安定な場合があります。一度接続を切断し、再度お試しください。

    2. 入力情報の再確認

    IDやパスワードに誤りがないか、大文字・小文字の区別を含めて再度ご確認ください。


    【解決しない場合の対応】

    上記を確認しても解決しない場合は、カスタマーセンターまでお知らせください。担当者が状況を確認し、以下の対応を行います。


    ・社内の専門技術部門へ調査を依頼（エスカレーション）します。

    ・パスワードの再発行手続きなどのサポートをいたします。


    【完了までの目安】

    技術的な調査が必要な場合、解決まで数営業日いただく場合がございます。進捗については、ご登録の連絡先へ随時通知いたします。


    なお、ログインに関するお問い合わせであっても、暗証番号やパスワードを直接お伺いすることはありませんのでご安心ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 48fffc8a-c737-52bf-a1ad-70fbca315d6b
  title: こもれび定期保険：ご利用条件による違い
  body: '【サポート担当者向け：加入条件判定マトリクス】


    | 条件項目 | 判定基準・しきい値 | 判定結果 |

    | :--- | :--- | :--- |

    | 年齢 | 70 歳以下（契約できる年齢の上限） | 加入可能 |

    | 年齢 | 71 歳以上 | 加入不可 |

    | 健康状態 | 告知義務に基づき正確な申告がある | 審査を経て決定 |

    | 健康状態 | 告知義務に違反（事実と異なる告知） | 契約解除・給付金不支払の可能性あり |


    ※審査の結果によっては、保険料が変動する場合や、特定の保障が制限される場合があります。常に誠実な標準的ケアをもってご提案ください。'
