  institution_id: komorebi_life
- id: 56f9ab06-0d08-5da4-bf07-5ecf4bd7513f
  title: こもれびがん保険：明細や記録と合わない
  body: 'お客様から「保険料を支払ったはずなのに、記録に反映されていない」または「給付金の金額が想定と異なる」といったお問い合わせをいただいた際の対応手順です。


    【確認すべき事項】

    1. お支払い情報の再照合

    お客様に、保険料を引き落とした口座の明細（日付と金額）を確認していただきます。当社の記録上の入金日と相違ないか照合してください。

    2. 契約状態の確認

    保険料の未払いで契約が「失効」していた期間がないか、または払込猶予期間中でなかったかを確認します。

    3. 給付金計算の根拠確認

    給付金の場合、診断されたがんの種類や治療内容が、約款上の支払対象となる条件を満たしているか、改めて審査記録を確認してください。


    【解決策】

    ・入金ずれが判明した場合は、速やかに入金処理を行い、正しい状況を回答します。

    ・計算誤りがあった場合は、不足分を速やかに支払う手続きを取ります。


    【エスカレーション】

    金額の相違についてお客様と合意に至らない場合や、システム上の不整合が疑われる場合は、内部規定に基づき、速やかに専門のコンプライアンス部門へエスカレーションし、公正な解決を図ります。'
