- id: 099fd6a4-6c08-5f30-a296-5970251e2a9d
  title: こもれび医療保険：プランの選び方
  body: 'お客様のライフプランに合わせて、最適な保障をお選びください。


    【こもれび医療保険】

    入院や手術などの医療費負担を幅広くカバーし、公的医療保険（高額療養費制度など）で不足する分を補完するプランです。幅広い病気やケガに備えたい方に最適です。


    【こもれびがん保険との違い】

    「こもれびがん保険：商品概要」でご案内しているプランは、がん診断時のまとまった一時金と治療費に特化しています。広範な医療保障を求めるなら「医療保険」、がんという特定のリスクに重点的に備えたいなら「がん保険」が適しています。


    【選び方の目安】

    ・入院・手術全般に備えたい → こもれび医療保険

    ・がん治療の費用を重点的に確保したい → こもれびがん保険


    どちらのプランも、誠実な標準的ケアをもって、お客様の意向に沿ったご提案をさせていただきます。'
