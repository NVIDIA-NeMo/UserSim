- id: d0913761-4596-560c-8602-b0aa7052529f
  title: こもれび個人年金保険：安全にご利用いただくためのポイント
  body: 'こもれび個人年金保険を安全にご利用いただくために、以下の重要なポイントをご確認ください。お客様の大切な資産と個人情報を守るため、こもれび生命では厳格なセキュリティ対策を講じております。


    【当社が絶対にお伺いしない情報】

    当社からのお電話やチャットにおいて、以下の機密情報を要求することは一切ございません。

    ・クレジットカード番号

    ・口座の暗証番号

    ・Webサービスのパスワード

    ・身分証明書番号（マイナンバー等）


    【ご本人確認について】

    契約内容の変更などの手続きを行う際は、必ず最初にお客様の「フルネーム」と「生年月日」を確認し、ご本人様であることの確認を完了させていただきます。これら以外の機密情報を求められた場合は、速やかにやり取りを中止してください。


    【不審な連絡があった場合】

    当社をかたる不審なメールや電話、メッセージを受け取られた場合は、すぐにカスタマーセンターまでご連絡ください。また、万が一、情報の漏洩や不正利用の疑いがあると感じられた際も、迅速にご報告いただけますようお願い申し上げます。お客様の不利益を最小限に抑えるため、誠実かつ迅速に対応し、解決に向けたプロセスを提供いたします。'
