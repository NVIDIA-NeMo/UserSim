  institution_id: komorebi_life
- id: a6d27f31-d555-558a-8552-58bd7ccd18fb
  title: こもれび医療保険：商品概要
  body: '「こもれび医療保険」は、公的医療保険の高額療養費制度を補完し、入院や手術に伴う経済的な不安を軽減するための包括的なプランです。


    【主な保障内容】

    ■入院給付金：日額10,000円を支給いたします。

    ■入院期間の限度：1回の入院につき最大60日まで、通算で最大1,095日まで保障いたします。

    ■手術給付金：入院中の手術は100,000円、外来での手術は50,000円を支給いたします。

    ■先進医療特約：先進医療にかかった費用を最大20,000,000円まで的に保障いたします。


    【保険料の例】

    月払保険料の例として2,480円というプランがございます（年齢やリスクにより異なります）。


    安心で誠実な保障を通じて、お客様のライフステージに寄り添うパートナーとしてサポートいたします。'
  domain: insurance
  product_category: iryo_hoken
