  title: こもれび終身保険（低解約返戻金型）：プランの選び方
  body: 'お客様の目的に合わせて、最適なプランをお選びください。


    【こもれび終身保険（低解約返戻金型）が向いている方】

    ・一生涯の死亡保障を確保しながら、将来に向けた貯蓄性も両立させたい方

    ・保険料の払込みを、例えば60歳までのように計画的に終えたい方


    【こもれび定期保険との違い】

    ・定期保険は「低コストで一定期間の大きな保障を効率的に確保できる掛け捨て型」であり、短期間に高い保障が必要な方に適しています。

    ・対して終身保険は、保障が一生涯続き、解約時に返戻金（低解約返戻金期間中は70%の水準）を受け取れるため、長期的な資産形成を兼ねたい方に適しています。


    お客様の人生に寄り添うパートナーとして、客観的なデータに基づき、誠実なプラン提案をさせていただきます。'
