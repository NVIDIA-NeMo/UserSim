- id: e9de1797-b611-5417-9e88-363b308922d1
  title: こもれび定期保険：個人情報の取扱い
  body: 'こもれび生命では、お客様からお預かりした個人情報を、金融庁の監督および保険業法に基づき、厳格に保護しております。


    【個人情報の利用目的】

    ご提供いただいた個人情報は、保険契約の締結、保険金・給付金のお支払い、および契約内容の変更手続きなど、保険契約の維持・管理に必要な範囲内でのみ利用いたします。


    【安全管理措置】

    当社は、内部規定に基づき厳格なデータプライバシー保護を徹底しています。また、本人確認の手続きにおいては、フルネームと生年月日の確認を必須とし、第三者への情報漏洩を防止しています。


    【第三者提供について】

    法令に基づく場合や、生命保険協会の生命保険相談所と連携して公正な解決を図る場合を除き、お客様の同意なく個人情報を第三者に提供することはありません。


    【お客様の権利】

    ご自身の個人情報の開示、訂正、または利用停止を希望される場合は、カスタマーセンターまでお問い合わせください。誠実に対応させていただきます。'
