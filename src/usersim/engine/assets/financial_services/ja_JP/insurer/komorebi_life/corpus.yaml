  institution_id: komorebi_life
- id: 2cf53413-b501-5ce9-ae50-588f3fa3e594
  title: こもれび定期保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの安心と安全を最優先に考え、厳格なセキュリティ対策に取り組んでいます。特に「こもれび定期保険」をご検討中、またはご利用中のお客さまに、改めてご注意いただきたい点をご案内します。


    【なりすまし詐欺へのご注意】

    当社社員を名乗り、電話やメールで個人情報を聞き出そうとする不正なアプローチにご注意ください。こもれび生命では、ご本人確認の手続きにおいて、お客様のフルネームと生年月日を確認させていただきます。しかし、それ以外の機密情報を要求することはございません。


    【当社が絶対に要求しない情報】

    以下の情報は、いかなる場合であっても、電話やチャット、メールでお伺いすることはありません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・ログインパスワード

    ・身分証明書番号（マイナンバーなど）


    もし、これらの情報を求める連絡があった場合は、すぐに通話を終了し、当社のカスタマーセンターへご連絡ください。また、不審な点があると感じられた場合は、速やかにご報告をお願いいたします。迅速かつ誠実に対応し、透明性のある解決プロセスを提供いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: f62d20a2-d26f-594b-a4b9-631a890fe543
  title: こもれび定期保険：規定・約款
  body: '本規定は、「こもれび定期保険」の契約および運用に関する基本事項を定めるものです。サポート担当者は、本規定に基づき正確な案内を行ってください。


    1. 契約の成立と義務

    本商品は、契約時の告知義務に基づき、健康状態等を正確に伝えることが条件となります。事実に反する告知をした場合、保険業法および社内規定に基づき、契約解除や保険金・給付金が支払われないことがあります。


    2. 契約可能条件

    本プランに加入できる年齢の上限は70歳までとなります。


    3. クーリング・オフについて

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回できる制度（クーリング・オフ）が適用されます。


    4. 保障期間と終了

    本商品の保険期間は10年です。期間満了をもって保障は終了します。


    5. 契約の変更および解約

    契約内容の変更や解約を希望される場合は、本人確認（フルネームと生年月日）を完了させた後、所定の手続きに従って行います。本商品は掛け捨て型のプランであるため、解約時の返戻金は原則として発生いたしません。'
  domain: insurance
  product_category: teiki_hoken
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: becffe98-fe56-523a-a6f8-91639e65f788
  title: こもれび定期保険：おすすめの方と主な使い方
  body: '「こもれび定期保険」は、低コストで一定期間の大きな保障を効率的に確保できる、掛け捨て型のプランです。シンプルで分かりやすい設計により、人生の特定の時期に重点的な備えをしたい方に最適です。


    【このような方におすすめです】

    ・お子さまが独立されるまでなど、限られた期間だけ手厚い死亡保障がほしい方

    ・月々の保険料を抑えつつ、万が一の際に家族に十分な資金を残したい方

    ・複雑な特約よりも、シンプルで透明性の高い保障内容を重視される方


    【保障内容の例】

    例えば、保険金額を30,000,000円に設定した場合、月々の負担を抑えながら大きな安心を確保できます。

    （例：30歳男性、保険期間10年の場合、月払保険料は3,150円となります）


    【主な使い方】

    本プランは保険期間が10年と定められており、この期間中に万が一のことがあった場合に、設定した保険金額が支払われます。貯蓄性はございませんが、その分、合理的で透明性の高い保険料体系を実現しています。将来のライフプランに合わせて、効率的にリスクヘッジを行いたい方に最適な選択肢です。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 5e8660b9-56ad-5bd0-b75d-2a5c87152671
  title: こもれび定期保険：月払保険料の例（30歳男性、保険期間10年）について
  body: '【質問】

    資料にある「30歳男性、保険期間10年で月払保険料3,150円」という例は、誰にでも適用される金額ですか？


    【回答】

    いいえ、こちらはあくまで目安としての例です。実際の保険料は、ご契約者さまの加入時の年齢、性別、および設定される保険金額によって異なります。また、健康状態などの告知内容によっても決定されます。お客さま一人ひとりに適した正確な保険料につきましては、個別のプラン作成を通じてご案内いたします。'
  domain: insurance
