- id: 136869d7-4e72-540e-a704-88f8786e988e
  title: こもれびがん保険：お手続きが完了しない・保留中のまま
  body: '「お申込みをしたけれど、手続きが完了せず保留状態になっている」という場合、以下の点をご確認ください。


    【考えられる原因とチェック項目】

    1. 告知内容の不足：健康状態に関する告知事項に未回答の箇所や、確認が必要な記載がある場合、審査に時間を要することがあります。

    2. 本人確認の不備：フルネームや生年月日の照合が正しく行われなかった可能性があります。

    3. 必要書類の未提出：診断書などの提出が必要な手続きの場合、書類が当社に届くまで保留となります。


    【解決方法】

    まず、お手元の通知メールや書面にて、不足している情報がないかをご確認ください。不明な点がある場合は、カスタマーセンターまでお問い合わせください。不足事項を補完していただくことで、速やかに審査を再開いたします。


    【エスカレーションについて】

    告知内容に関する判断でご納得いただけない場合や、複雑な事情がある場合は、内部規定に基づき速やかに専門のコンプライアンス部門へエスカレーションし、公正な解決を図ります。'
  domain: insurance
  product_category: gan_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
