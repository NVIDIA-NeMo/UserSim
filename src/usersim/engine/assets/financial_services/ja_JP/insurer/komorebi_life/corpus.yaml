  title: こもれびがん保険：ご利用開始までの手順
  body: 'お客様が「こもれびがん保険」のご利用を開始するまでの標準的なフローは以下の通りです。サポート担当者は、お客様が各ステップを十分に理解できるよう案内してください。


    1. ご相談・プラン提案：お客様の意向とリスク許容度に基づき、最適な保障内容をご提案します。

    2. ご申込み・告知：お客様に健康状態などの告知義務を遂行していただきます。

    3. 審査（引受審査）：告知内容に基づき、契約可否を判断します。

    4. ご契約成立：審査通過後、保険料（例：1,980円）のお支払い方法を確認し、契約を締結します。

    5. 書面交付：契約内容を記載した書面をお届けします。受取後8日以内はクーリング・オフが可能です。'
