- id: 6797f969-c724-55d2-a295-3f7b3173c600
  title: こもれび定期保険：状況・履歴の確認
  body: '現在のご契約状況や保険料のお支払い履歴を確認する手順をご案内します。


    1. ご本人確認書類（運転免許証など）とご契約者番号を提示し、本人認証を受けてください。

    2. 担当者へ「現在の保障内容およびお支払い履歴の確認」を依頼してください。

    3. 以下の項目について回答を受け、内容に相違がないか確認します。

    　・現在の保険金額（例：30,000,000円など）

    　・保険期間の残り年数（最大10年のうち、経過した期間と残り期間）

    　・直近の保険料（例：3,150円など）の決済完了日


    認証が完了するまで、機密性の高い情報の開示は行えませんので、必ず有効な本人確認書類をご用意ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 1a0a1be1-ca92-50c3-a63c-ab110e8189db
  title: こもれび定期保険：お取引が拒否された・制限された
  body: '保険料のお支払いや、受取人の変更などの手続きが拒否または制限された場合の対応についてご案内します。


    【想定される原因】

    ・本人認証書類の有効期限切れ、または不備がある。

    ・ご契約者番号と提示された情報の不一致。

    ・告知義務違反の疑いによる審査保留。


    【確認・解決手順】

    1. 最新の本人確認書類（有効期限内であること）を再度ご提示ください。

    2. ご契約者番号が正しく入力されているか、最新の保険証券で再確認してください。

    3. 書類に不備がある場合は、正しい形式で再提出をお願いいたします。


    【解決しない場合】

    認証が完了しない場合や、コンプライアンス上の確認が必要な案件は、専門部署およびコンプライアンス部門へエスカレーションし、詳細な調査を行います。調査結果は後日改めて通知いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: e8aae3f1-a767-5544-9cbb-d17f94ce405b
  title: こもれび定期保険：切替えや上位プランを検討するとき
  body: '「こもれび定期保険」から他のプランへの切替えを検討される際は、保障の「目的」に基づいてご判断ください。


    ・効率的な保障を優先する場合：

    「こもれび定期保険」は、10年という期間を定め、少ない保険料（例：3,150円）で大きな保障（例：30,000,000円）を確保できるため、お子様の成長期間など、一時的に高い保障が必要な方に最適です。


    ・生涯にわたる保障と資産形成を優先する場合：

    「こもれび終身保険（低解約返戻金型）」への切替えをご検討ください。こちらは期間の制限なく保障を継続でき、将来的に解約返戻金を受け取ることができます。


    お客様のリスク許容度に基づき、最適なプランをご提案いたします。'
  domain: insurance
  product_category: teiki_hoken
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 43a28ce7-e411-58cb-8318-24c106954939
  title: こもれび定期保険：ほかの選択肢との比較と向かない場合
  body: '「こもれび定期保険」は、必要な期間だけ効率的に保障を確保したい方に最適なプランです。他商品との特性の違いをご理解ください。


    ■本プランが最適なケース

    ・「10年間だけ、30,000,000円のような大きな保障を確保したい」という方

    ・「月々のコストを抑えたい（例：月払保険料3,150円など）」という方


    ■本プランが向かないケース

    ・貯蓄性を重視し、将来的に解約返戻金を受け取りたい方

    ・一生涯、保障を継続させたい方

    → この場合は、「こもれび終身保険（低解約返戻金型）」が適しています。


    ■注意点

    本プランは掛け捨て型であるため、期間満了時に保障は終了し、解約返戻金は原則として発生いたしません。資産形成を目的とされる場合は、個人年金保険などの併用をご検討ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: af9d020d-30ba-5304-a0be-9f1248111744
  title: こもれび定期保険：手数料と費用
  body: 'Q：この保険を維持するためにかかる費用はいくらですか？


    A：主にかかる費用は月々の保険料です。年齢やリスクにより異なりますが、例として月払保険料3,150円といった適正な価格設定となっております。


    Q：事務手数料などの別途費用はありますか？


    A：原則として月々の保険料に含まれておりますが、契約者貸付の手数料や一部の事務手続きには費用が発生する場合がございます。詳細は「こもれび定期保険：手数料一覧」にて根拠とともに提示しております。'
  domain: insurance
  product_category: teiki_hoken
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: a39f5547-9bfc-5750-944d-6c2ead3477f1
  title: こもれび定期保険：よくあるお手続きの流れ
  body: '「こもれび定期保険」のお申込みから保障開始までの標準的な流れをご案内します。


    1. 告知事項の回答：健康状態などを正しくお伝えください（告知義務の履行）。事実と異なる告知がある場合、将来的に契約解除となる可能性があります。

    2. 審査および承認：当社にてリスク審査を行い、ご加入可否を判断いたします。この際、上限年齢が70歳までであるかを確認します。

    3. 契約内容の確認：保険金額（例：30,000,000円）や保険料（例：3,150円）、保険期間（10年）などの条件を確定します。

    4. 書面の受取：保険証券等の重要書類を受け取ってください。

    5. クーリング・オフ期間の経過：書面受取後8日以内であれば、無条件で契約を撤回いただけます。期間経過後、正式に保障が開始されます。'
  domain: insurance
