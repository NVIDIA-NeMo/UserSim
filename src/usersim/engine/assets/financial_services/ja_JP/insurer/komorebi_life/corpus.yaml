- id: 391c0d8f-995f-5ed3-9ea7-1961e31ee998
  title: こもれびがん保険：ご利用開始までの手順
  body: '【オペレーター向け：こもれびがん保険 お申込みフロー】


    お客様が「こもれびがん保険」への加入を希望された際は、以下の手順で案内し、手続きを進めてください。


    1. 意向把握とプラン提示

    お客様の意向を確認し、がん診断一時金 1,000,000円、がん治療給付金（月額） 100,000円といった保障内容を説明します。また、例として月払保険料
    1,980円（40歳男性、終身払）などの目安を提示してください。


    2. 告知義務の説明と回答確認

    「告知義務」について詳しく説明し、現在の健康状態等を正確に伝えていただく必要があります。事実に反する告知をした場合、契約解除や給付金が支払われないリスクがあることを明確に伝えてください。


    3. お申込み手続き

    必要書類を案内し、お客様から正式な申込みを受け付けます。


    4. 保険会社の審査（引受審査）

    告知内容に基づき、審査を行います。


    5. 契約成立と証券発行

    審査通過後、契約が成立し、保険証券を発行します。


    【重要：待ち期間の案内】

    契約成立後、90日の待ち期間があることを必ず説明してください。この期間中にがんと診断された場合は、保障が適用されない点に十分ご注意ください。'
