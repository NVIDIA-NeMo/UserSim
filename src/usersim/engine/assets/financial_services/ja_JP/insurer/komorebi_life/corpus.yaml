  institution_id: komorebi_life
- id: dfa8724c-d909-5a3c-bf4e-42679abd2483
  title: こもれび医療保険：明細や記録と合わない
  body: '【症状】

    お客様から「入院していた日数分、給付金が支払われていない」「計算が合わない」という指摘を受けた。


    【チェック項目と原因】

    1. 1回の入院の支払限度日数の確認：

    本プランでは「1回の入院の支払限度日数」が60日となっております。入院日数が60日を超えている場合、超えた分は支払対象外となります。

    2. 通算支払限度日数の確認：

    「入院給付金の通算支払限度日数」である1095日に達していないかを確認してください。上限に達した後は、入院給付金は支払われません。

    3. 給付金種別の確認：

    「入院中の手術給付金（100,000円）」と「外来の手術給付金（50,000円）」が正しく使い分けられているか、また入院日額（10,000円）の計算が正しいかを確認してください。


    【対応】

    ・計算根拠をお客様に分かりやすく説明し、限度日数による制限があった場合はその旨を丁寧にお伝えください。

    ・もし当社の計算ミスや記録漏れが判明した場合は、速やかに修正し、不足分を支払います。

    ・お客様が納得されない場合は、内部規定に基づき速やかにコンプライアンス部門へエスカレーションしてください。'
