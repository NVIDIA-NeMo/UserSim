- id: a10cd12e-ab83-5525-a986-37a7b158590f
  title: こもれびがん保険：この商品をかたる詐欺にご注意ください
  body: '最近、「こもれびがん保険」の名称をかたり、特別な割引や限定プランを提示して個人情報を聞き出そうとする不審な連絡が増えています。お客様の安心を守るため、以下の点に十分ご注意ください。


    こもれび生命では、いかなる場合においても、電話やメール、チャットを通じて、お客様のクレジットカード番号、暗証番号、オンラインサービスのパスワード、または身分証明書の番号などの機密情報を要求することはありません。


    もし、以下のような不審な点がある場合は、すぐに手続きを中断してください。

    ・「今だけの特別価格で、通常よりも大幅に保険料が安くなる」と急かされる

    ・公式ではないメールアドレスやSNSを通じて、個人情報の入力を求めるリンクが送られてくる

    ・手続きのために暗証番号やパスワードを教えるよう指示される


    万が一、不審な連絡を受けた場合や、情報を伝えてしまった可能性がある場合は、速やかに当社のカスタマーセンターまでお知らせください。迅速に状況を確認し、適切に対応いたします。お客様の情報を守るため、不審な連絡には十分にご注意いただき、誠実な対応を心がけております。'
