  title: こもれび終身保険（低解約返戻金型）：実施中のキャンペーン
  body: '【大切なお知らせ】こもれび終身保険（低解約返戻金型）加入者様向けキャンペーンを実施いたします。


    【キャンペーン内容】

    期間中にお申込みいただき、契約が成立したお客様に、健康管理をサポートするための「ウェルネスギフトカード 1,000円分」をプレゼントいたします。


    【実施期間】

    2026年1月1日から2026年3月31日まで


    【対象となる方】

    期間中に本プランへ新規にご加入いただいたお客様（既にご契約中の方は対象外となります）。


    【受取方法】

    契約成立後、ご登録のご住所へ郵送にてお届けいたします。詳細な条件につきましては、担当スタッフまでお気軽にお問い合わせください。'
