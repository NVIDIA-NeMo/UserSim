  body: 'お手続き内容に応じて、以下の書類をご用意ください。


    ・新規お申込み：本人確認書類、告知書

    ・受取人の変更：本人確認書類、契約者番号、新受取人の承諾書

    ・ご契約の解約：本人確認書類、契約者番号、解約返戻金受取口座の確認書類

    ・住所・連絡先変更：本人確認書類、契約者番号'
