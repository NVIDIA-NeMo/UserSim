- id: 4dc2ab0b-35c8-5daa-87b7-a100209afbbc
  title: こもれび医療保険：金利・料率の決まり方と適用
  body: '「こもれび医療保険」の保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用し、合理的かつ透明性の高い体系で決定しています。


    【料率の適用について】

    保険料は、加入時の年齢、性別、および選択された保障プランに基づき算出されます。特定の年齢層や条件で変動する仕組みとなっており、不透明な上乗せ料金は一切ございません。


    【保険料の例】

    ・35歳女性（終身払）の場合：月払保険料 2,480円


    【改定について】

    保険業法および金融庁の監督に基づき、適正な価格を維持します。料率の変更が必要な場合は、内部規定に基づき適切に告知いたします。なお、個別の税務相談や医療的な助言は行っておりませんので、専門の税理士や医師にご相談ください。'
  domain: insurance
  product_category: iryo_hoken
