  institution_id: komorebi_life
- id: af9d020d-30ba-5304-a0be-9f1248111744
  title: こもれび定期保険：手数料と費用
  body: '【質問】「こもれび定期保険」の保険料はいくらになりますか？


    【回答】保険料は、ご加入時の年齢やプラン内容によって異なります。例えば、30歳男性で保険期間10年の方の場合、月払保険料の例として3,150円となります。お客様のご年齢に基づいた正確な金額をご案内いたしますので、お気軽にお問い合わせください。


    【質問】契約時や更新時に、別途手数料はかかりますか？


    【回答】当社では透明性の高い商品設計を心がけており、プラン内容に応じた適正な保険料をいただいております。詳細な費用体系については、「こもれび定期保険：手数料一覧」をご確認ください。'
