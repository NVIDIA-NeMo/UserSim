- id: 90a083f6-b16c-56f6-a59c-1c57741281d5
  title: こもれびがん保険：プランの選び方
  body: 'がんへの備えを検討される際は、保障の「幅」と「深さ」でプランをお選びください。


    ■こもれびがん保険（特化型プラン）

    がんという特定の病気に重点的に備えるプランです。がんと診断された際にまとまった「がん診断一時金 1,000,000円」を受け取れるため、治療費だけでなく生活費の補填にも活用できます。また、月額
    100,000円のがん治療給付金により、長期的な治療にも対応可能です。保険料の例として、40歳男性（終身払）で月額 1,980円という合理的な価格設定となっています。


    ■こもれび医療保険（総合型プラン）

    入院や手術など、がん以外の幅広い病気やケガをカバーしたい方に適しています。公的医療保険の高額療養費制度を補完する仕組みです。


    【選び方の目安】

    ・「がんの治療費や一時的な大きな出費に備えたい」 → こもれびがん保険

    ・「あらゆる入院・手術のリスクを幅広くカバーしたい」 → こもれび医療保険


    併せてご加入いただくことで、より盤石な備えを構築いただけます。'
