- id: c638e190-7193-509b-8970-1ba341712712
  title: こもれび個人年金保険：金利・料率の決まり方と適用
  body: '本プランの料率および返戻率は、リスクの分散と安定した給付金支払いのための原資を確保し、合理的かつ透明性の高い体系で決定しています。


    【返戻率について】

    返戻率の例として108%を提示しております。この数値は、プラン内容に応じた適正価格を維持し、長期的な安定運用を行うことで実現されています。


    【適用ルール】

    ・料率は、加入時の年齢、払込期間、プラン内容に基づいて決定されます。

    ・一度決定した契約内容に基づく運用は、社内の厳格な規定に基づき、安定的な給付を目指して運用されます。


    個別の税務相談（生命保険料控除の詳細など）については、管轄の税務署または税理士にご相談ください。当社では一般的な制度解説のみを行っております。'
