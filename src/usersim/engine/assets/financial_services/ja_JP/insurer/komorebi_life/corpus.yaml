- id: 41768522-aa8a-5e30-9a00-93a135086f5c
  title: こもれびがん保険：必要書類
  body: '給付金の請求にあたり、以下の状況に応じて必要書類をご用意ください。


    | 請求内容 | 必要書類 | 備考 |

    | :--- | :--- | :--- |

    | がん診断一時金（1,000,000円）の請求 | 医師による診断書（病理検査結果を含む） | がんと確定診断されたことを証明する書類が必要です |

    | がん治療給付金（月額100,000円）の請求 | 診療明細書 または 通院・入院証明書 | 治療を継続的に受けていることを証明する書類が必要です |

    | 受取人の変更手続き | 新しい受取人の同意書、本人確認書類 | 変更手続き時に必要な書類です |

    | 解約手続き | 解約返戻金受取口座の確認書類 | 解約返戻金がある場合に必要となります |'
