  institution_id: komorebi_life
- id: 1ae24d82-01d5-538a-8abb-a332d321c873
  title: こもれび医療保険：リスクについてのご説明
  body: 'ご契約にあたり、以下のリスクと重要事項について十分にご確認ください。


    【告知義務について】

    ご契約時の健康状態に関する「告知義務」を怠り、事実と異なる告知をした場合、保険業法に基づき、契約解除や保険金・給付金が支払われないことがあります。誠実な告知をお願いいたします。


    【クーリング・オフについて】

    本契約は、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、無条件で契約を撤回（クーリング・オフ）いただけます。


    【保障の制限】

    入院給付金は1回の入院につき60日、通算で1,095日の支払限度がございます。これを超える期間の入院については保障対象外となりますので、あらかじめご了承ください。'
