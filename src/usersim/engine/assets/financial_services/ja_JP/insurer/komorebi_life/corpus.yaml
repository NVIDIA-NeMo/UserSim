- id: 77326353-48e6-5ea8-bb3c-ba23506261d9
  title: こもれび定期保険：安全にご利用いただくためのポイント
  body: 'こもれび定期保険を安心してお使いいただくために、セキュリティに関する重要なポイントをご案内いたします。


    【ご本人確認について】

    契約内容の変更などのお手続きを行う際は、必ずお客様の「フルネーム」と「生年月日」を確認させていただきます。これは、大切なお客様の情報を守るための重要な手続きです。


    【当社が絶対に要求しない情報】

    こもれび生命では、どのような場合であっても、以下の機密情報を電話やメール、チャットで要求することはありません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・パスワード

    ・身分証明書番号（マイナンバーなど）


    【不審な連絡があった場合】

    万が一、当社を名乗る人物から上記のような情報の提示を求められた場合は、すぐに連絡を中断し、当社のカスタマーセンターまでお知らせください。お客様の資産とプライバシーを保護するため、厳格なデータ管理を徹底しております。


    詳細は「こもれび定期保険：不正利用からお客さまを守るために」も併せてご確認ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 68eead93-4eee-5866-ab08-bad20907a69d
  title: こもれび定期保険：規定・約款の変更
  body: 'こもれび定期保険のご契約にあたり、規定および約款の変更に関する事項をご説明いたします。


    【約款の変更について】

    法令の改正や、より透明性の高い商品設計への見直しに伴い、約款の内容を変更することがあります。変更がある場合は、あらかじめ書面やWebチャット等を通じてお客様に通知いたします。


    【お客様の義務と告知義務】

    本保険は、誠実な告知に基づいた相互扶助の精神で運用されています。契約時に健康状態等を正確に伝える「告知義務」があり、事実に反する告知をした場合、保険業法および社内規定に基づき、契約解除や保険金・給付金が支払われないことがありますのでご注意ください。


    【契約の終了】

    本プランの保険期間（年）は 10 とされており、この期間の満了をもって保障は終了いたします。また、クーリング・オフ制度により、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から
    8 日以内であれば、申し込みを撤回することが可能です。


    公正な取引を実現するため、金融庁の監督および保険業法を厳守して運営しております。'
  domain: insurance
  product_category: teiki_hoken
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 0a57b616-f274-5bf5-89d3-f954b815725e
  title: こもれび定期保険：ご利用開始までの手順
  body: '【サポート担当者向け：ご利用開始ガイド】

    お客様がこもれび定期保険のご契約を完了し、保障を開始するまでの標準的な手順は以下の通りです。


    1. ご意向の確認とプラン提案

    お客様のライフプランに基づき、掛け捨て型で効率的に大きな保障を確保できる本プランの特性を説明します。例として、保険金額の例が 30,000,000円 の場合のプランなどを提示してください。


    2. 加入資格の確認

    契約できる年齢の上限が 70 であることを確認し、お客様が条件を満たしているか確認します。


    3. お申込みと告知手続き

    申込書への記入を案内し、特に「告知義務」について丁寧に説明します。健康状態などを正確に伝えていただくことが、将来の確実な給付につながることをお伝えください。


    4. 審査および承諾

    社内規定に基づき審査を行い、承諾となった場合は契約成立となります。


    5. 保険料のお支払い

    月払保険料の例（30歳男性、保険期間10年）である 3,150円 のように、プランに応じた適正な保険料の支払い方法を確認します。


    6. 保険証券の送付

    手続き完了後、保険証券を送付します。お客様には、書面受取後 8 日以内であればクーリング・オフが可能である旨を明確に案内してください。'
