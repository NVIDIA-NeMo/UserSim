- id: 24c7a3e3-55be-5ca7-9669-f9e5878a9bf2
  title: こもれび定期保険：プランの選び方
  body: 'お客様のご要望に合わせて、最適なプランをお選びください。


    【こもれび定期保険が向いている方】

    「低コストで、一定期間だけ大きな保障を準備したい」という方に最適です。掛け捨て型のため、保険料を抑えて効率的に備えられます。

    （例：30歳男性、保険期間 10 年の場合、月払保険料 3,150円 で保険金額 30,000,000円 の保障を確保することが可能です）


    【こもれび終身保険（低解約返戻金型）が向いている方】

    「保障を一生涯継続させたい」または「死亡保障と併せて貯蓄性も持たせたい」という方に向いています。


    【選び方のポイント】

    ・お子様が独立されるまでの期間など、保障が必要な期間が決まっている場合は「定期保険」が合理的です。

    ・長期的な資産形成と保障を両立させたい場合は「終身保険」をご検討ください。


    お客様のご意向と客観的なデータに基づき、誠実にご提案させていただきます。'
