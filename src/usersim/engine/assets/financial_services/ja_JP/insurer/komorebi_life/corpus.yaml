- id: e9c87e33-ed99-5467-bdfd-d3bbd30ee83f
  title: こもれび個人年金保険：規定・約款
  body: '本規定は、「こもれび個人年金保険」の契約に関する重要なルールを定めたものです。サポート担当者は、お客さまへご案内する際に必ず本内容を遵守してください。


    1. 保障と給付の基本

    本商品は、計画的な積立により老後の資金を準備するプランです。年金の受取開始年齢は65歳とし、その後10年間にわたって年金をお支払いします。


    2. お客さまの義務（告知義務）

    ご契約時に、健康状態などの重要な事項を正確に伝える「告知義務」がございます。事実に反する告知をした場合、保険業法および当社規定に基づき、契約解除や年金・給付金が支払われないことがあります。


    3. クーリング・オフについて

    申込日、または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により申し込みを撤回できる制度です。


    4. 保険料の支払いと失効

    保険料の支払いが一定期間滞った場合、契約が「失効」し、保障が受けられなくなります。ただし、所定の猶予期間内に手続きを行うことで「復活」させることが可能です。


    5. 契約の終了と解約返戻金

    年金の受取期間が満了したとき、またはお客さまの申し出により解約したときに契約は終了します。解約時に支払われる解約返戻金は、プラン内容や経過期間に応じて決定されます。'
