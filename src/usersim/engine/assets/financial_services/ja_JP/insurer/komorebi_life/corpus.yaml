- id: 7288a95d-7ca6-5bb4-97e2-128bed15ccf8
  title: こもれびがん保険：よくあるお手続きの流れ
  body: 'がん診断時の給付金請求について、標準的なお手続きの流れをご案内します。


    1. 医師による診断確定後、速やかに当社へ診断の旨をご連絡ください。

    2. 当社から送付する請求書類に必要事項を記入し、医師が作成した診断書を添えてご提出ください。

    3. 当社にて、ご契約内容および告知義務違反の有無、待ち期間（90日）の経過を確認する審査を行います。

    4. 審査完了後、条件を満たしている場合に、がん診断一時金として1,000,000円を、および該当する場合に月額100,000円のがん治療給付金をご指定の口座へお振込みいたします。


    審査状況についてのご質問は、本人確認完了後に随時承ります。'
  domain: insurance
  product_category: gan_hoken
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 56f9ab06-0d08-5da4-bf07-5ecf4bd7513f
  title: こもれびがん保険：明細や記録と合わない
  body: 'お客様のお手元の記録と、当社の保険料納付明細や給付金振込額に相違がある場合の対応についてご案内します。


    【確認すべき事項】

    ・保険料の改定や、特約の追加・削除が行われたタイミングと一致しているか。

    ・お振込額が、税金や所定の手数料を差し引いた後の金額になっていないか。

    ・前月分までの未納分が合算して引き落とされていないか。


    【対応方法】

    相違箇所を具体的に添えて、担当窓口まで照会を依頼してください。当社にて納付履歴および支払計算書を再照合いたします。


    【エスカレーション】

    再照合の結果、当社の計算に誤りがあることが判明した場合は、専門部署にて速やかに修正手続きを行い、不足分を追記または返金いたします。'
  domain: insurance
  product_category: gan_hoken
