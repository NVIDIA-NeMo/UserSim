  title: こもれび終身保険（低解約返戻金型）：ログインできない・アクセスできない
  body: '【症状】お客様専用ページにログインできない、またはアクセスが制限されている。


    【原因と確認事項】

    ・契約者番号の入力誤りがないかご確認ください。

    ・パスワードの有効期限が切れている、または回数制限によりロックがかかっている可能性があります。


    【解決方法】

    弊社担当者へ状況をお伝えください。本人確認書類による認証完了後、パスワードのリセットまたはロック解除を弊社側で実施いたします。


    【エスカレーション】

    認証後も解決しない場合は、専門部署へ調査を依頼し、原因究明後の復旧状況を改めてお客様へご連絡いたします。登録内容の変更が必要な場合は「こもれび終身保険（低解約返戻金型）：登録内容の変更」の手順に沿って対応します。'
