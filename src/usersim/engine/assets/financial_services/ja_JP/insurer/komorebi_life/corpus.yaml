- id: 4121a504-8d93-5f2d-8953-3a1621fd40d1
  title: こもれび定期保険：明細や記録と合わない
  body: 'お客様が保有されるお支払い記録と、当社の明細に相違がある場合の確認手順です（サポートエージェント向け）。


    【確認事項】

    1. お支払い日の照合：お客様の口座引き落とし日と、当社の入金処理日のタイムラグがないか確認してください。

    2. 保険料の金額確認：適用されている保険料（例：3,150円）が、契約時のプランと一致しているか確認します。

    3. 二重支払いの有無：振込と口座振替が重複して行われていないか履歴を精査してください。


    【対応策】

    ・単純な処理遅延である場合は、処理予定日を案内し、お客様に安心感を提供してください。

    ・金額に根本的な差異がある場合や、不整合が解消されない場合は、速やかに専門部署（経理・精算部門）へエスカレーションし、詳細な照会調査を依頼してください。調査完了後、正しい明細を再発行いたします。'
