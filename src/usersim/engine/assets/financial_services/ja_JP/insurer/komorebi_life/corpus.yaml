- id: db455bb3-dbb7-5153-b600-e0ba607671bb
  title: こもれび終身保険（低解約返戻金型）：重要事項のご説明
  body: 'こもれび終身保険（低解約返戻金型）のご契約にあたり、以下の重要事項を必ずご確認ください。


    【告知義務について】

    ご契約時に健康状態等を正確に伝える義務があります。事実に反する告知をした場合、保険業法および社内規定に基づき、契約解除や保険金・給付金が支払われないことがあります。


    【クーリング・オフについて】

    申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録により、申し込みを撤回（クーリング・オフ）することが可能です。


    【解約返戻金について】

    本プランは低解約返戻金型です。低解約返戻金期間中に解約された場合、解約返戻金の水準は70%となり、通常の商品よりも返戻金が少なくなります。


    【契約者保護について】

    万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される場合があります。


    【助言の範囲】

    当社は保険制度の一般的な解説は行いますが、個別の税務相談や医療的な助言は行いません。'
  domain: insurance
  product_category: shushin_hoken
  document_type: disclosure
  source_authority: official
