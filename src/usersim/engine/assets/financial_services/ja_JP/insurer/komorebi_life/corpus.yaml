- id: 12fa84ff-bd6a-5087-817f-1f8efad72cb4
  title: こもれび定期保険：実施中のキャンペーン
  body: '【大切なお知らせ】こもれび定期保険 ご加入者様向け・保障拡充応援キャンペーンを実施いたします。


    すでに当社の保険をご利用いただいているお客様が、新たに「こもれび定期保険」に加入されるか、現在の保障額を増額される場合、以下の特典を適用させていただきます。


    【キャンペーン内容】

    加入後、初回の月払保険料から500円を割引いたします。


    【実施期間】

    2026年7月1日から2026年9月30日までのお申込み分が対象となります。


    【適用条件】

    ・期間内に本プランへのお申込みまたは増額手続きを完了された方。

    ・本人確認（フルネームおよび生年月日）が完了していること。


    この機会に、将来への安心をさらに強固にするライフプランニングをご検討ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: promo_notice
  source_authority: official
  placeholder: true
