- id: 368d1951-4408-59cd-a1be-8351b7c06f9c
  title: こもれび医療保険：規定・約款
  body: '本保険の保障提供にあたっては、以下の規定を適用します。エージェントは、お客さまへご案内する際にこれらの制限を正確に伝えてください。


    1. 給付金の支払限度：入院給付金は、1回の入院につき最大60日まで、通算して最大1,095日までを支払限度とします。

    2. 告知義務：ご契約時に健康状態等を正しく伝える義務があります。告知義務違反があった場合、保険業法に基づき、契約解除や給付金の不支払となるリスクがあります。

    3. 契約の撤回：書面受取後8日以内であれば、クーリング・オフ制度により無条件で契約を撤回いただけます。

    4. 保障内容：入院日額10,000円、入院中の手術給付金100,000円、外来手術給付金50,000円、および先進医療特約（上限20,000,000円）を規定の条件に基づき提供します。'
