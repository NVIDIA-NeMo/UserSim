- id: 63bbc242-29c6-5d9a-b732-40d271489047
  title: こもれびがん保険：お申込みとご利用開始
  body: '「こもれびがん保険」のお申込みから保障開始までの流れをご案内いたします。


    1. 意向の確認：お客様のご希望の保障額やリスク許容度に基づき、最適なプランを提案させていただきます。

    2. 本人確認：ご本人確認書類および契約者番号を用いて厳格な本人認証を行います。

    3. ご告知：現在の健康状態について正しくお知らせください（告知義務）。

    4. 審査および承諾：弊社にて審査を行い、お引き受けの可否を決定いたします。

    5. 書面受取と確認：契約内容を記載した書面をお受け取りください。内容に相違がないかご確認をお願いいたします。


    【保障の開始について】

    お手続き完了後、90日の待ち期間を経て保障が有効となります。なお、書面受取後8日以内であれば、クーリング・オフによる無条件撤回が可能です。'
  domain: insurance
