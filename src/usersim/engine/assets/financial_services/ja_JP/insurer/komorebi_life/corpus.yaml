  institution_id: komorebi_life
- id: bf7fb04c-31a8-5bae-ac7d-d0f500b6296a
  title: こもれび終身保険（低解約返戻金型）：おすすめの方と主な使い方
  body: '「こもれび終身保険（低解約返戻金型）」は、一生涯の死亡保障を確保しながら、将来に向けた貯蓄性をバランスよく両立させたい方に最適なプランです。


    【本商品の特徴】

    低解約返戻金型を採用することで、通常の終身保険よりも保険料を抑えて、大きな保障を準備いただけます。例えば、保険金額の例として5,000,000円の保障を設定し、ご家族への遺産準備や葬儀費用の備えとして活用することが可能です。


    【おすすめの方】

    ・一生涯変わらない安心感（死亡保障）を確保したい方

    ・保険料の負担を抑えつつ、効率的に資産を積み立てたい方

    ・お子さまの独立やご自身の退職などのタイミングに合わせて、保険料の払込みを完了させたい方（例：保険料の払込みが終わる年齢を60歳に設定）


    【主な使い方】

    1. 死亡保障として：万が一の際にご家族へ5,000,000円などのまとまった資金を遺す。

    2. 貯蓄の準備として：低解約返戻金期間を過ぎた後に、解約返戻金を老後の資金やライフイベントの費用として活用する。


    ※低解約返戻金期間中の解約返戻金の水準は70%となります。長期的な視点でのご加入をおすすめいたします。'
  domain: insurance
  product_category: shushin_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 9a66c297-209e-5b5f-bbc6-cdd7146c0023
  title: こもれび終身保険（低解約返戻金型）：月払保険料の例（40歳女性、60歳払済）について
  body: 'Q：40歳の女性が、60歳までに保険料の払込みを完了させるプランに加入した場合、月々の保険料はいくらになりますか？


    A：月払保険料の例として、12,400円となります。このプランでは、保険料の払込みが終わる年齢を60歳と設定しており、60歳以降は保険料を支払うことなく、一生涯の保障を継続して受けることができます。


    なお、実際の保険料は、ご希望の保険金額や健康状態等によって変動いたします。詳細なお見積もりについては、カスタマーセンターまでお問い合わせください。'
