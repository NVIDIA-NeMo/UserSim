- id: bad650b6-1ac5-5219-98e8-60a049d4352b
  title: こもれびがん保険：ログインできない・アクセスできない
  body: 'お客様専用ページにログインできない、またはページにアクセスできない場合の対処法をご案内します。


    ■よくある症状と原因

    ・「IDまたはパスワードが正しくありません」と表示される

    → 入力内容に誤りがあるか、パスワードの有効期限が切れている可能性があります。

    ・ページが読み込まれず、白い画面のままになる

    → インターネット接続の一時的な不具合や、ブラウザのキャッシュが影響している可能性があります。


    ■確認と解決の手順

    1. 入力内容の再確認

    大文字・小文字の区別が正しく入力されているか、再度ご確認ください。


    2. ブラウザの更新または再起動

    ページを再読み込み（リフレッシュ）するか、一度ブラウザを閉じて再度アクセスしてください。


    3. パスワードの再設定

    ログイン画面の「パスワードを忘れた方」から、ご本人様確認を経て再設定を行ってください。


    ■解決しない場合の対応

    上記を試しても解決しない場合は、当社にてアカウントの状態を確認いたします。お客様のフルネームと生年月日を添えてお問い合わせください。専門部署にてアクセス権限の確認および復旧手続きを行います。'
