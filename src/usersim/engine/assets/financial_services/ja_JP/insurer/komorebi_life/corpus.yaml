- id: 4121a504-8d93-5f2d-8953-3a1621fd40d1
  title: こもれび定期保険：明細や記録と合わない
  body: 'お客様から「保険料を支払ったはずなのに、記録に反映されていない」などの、明細や記録の不一致についてのご相談を受けた際の対応手順です。


    【確認手順】

    1. 本人確認：まず、お客様の「フルネーム」と「生年月日」を確認し、正確なご契約者様であることを特定してください。

    2. 支払い履歴の照合：お客様が提示される振込日や引き落とし日と、当社の受取記録を照合します。銀行側の処理遅延や、口座不備による振替不能が発生していないかを確認してください。

    3. 内容の精査：保険料の金額（例：3,150円）が正しく引き落とされているか、別のプランの保険料と混同されていないかを確認します。


    【解決策】

    ・記録の更新：当社の受取確認漏れであった場合は、速やかに記録を修正し、お客様へ完了を報告してください。

    ・不足分の案内：引き落としができていなかった場合は、払込猶予期間について案内し、お支払い方法の変更を提案してください。


    【エスカレーション】

    金額の不一致が解消されない場合や、不正アクセスの疑いがあるなど、不自然な記録の乖離が見られる場合は、内部規定に基づき速やかにコンプライアンス部門へ報告し、詳細な調査を依頼してください。'
