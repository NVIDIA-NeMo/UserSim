- id: 1b182fb4-14c8-53d4-9b18-9387f197bf0b
  title: こもれび個人年金保険：実施中のキャンペーン
  body: '【安心の未来準備キャンペーンのご案内】


    老後の備えを始める方を応援するため、期間限定のキャンペーンを実施いたします。


    ■キャンペーン期間

    2025年1月1日から2025年3月31日まで


    ■キャンペーン内容

    期間中に「こもれび個人年金保険」に新規でお申し込みいただき、第1回保険料の払い込みが完了したお客様へ、ギフトカード1,000円分をプレゼントいたします。


    ■対象となる方

    ・期間中に新規でご契約を完了された方

    ・月払保険料（例：10,000円）の設定が完了している方


    ■ご注意事項

    ・本キャンペーンは、お一人様につき1回限りとなります。

    ・ギフトカードは、ご契約完了後の後日郵送にてお届けいたします。


    将来の安心を、今から一緒に準備しましょう。詳細はお気軽にお問い合わせください。'
