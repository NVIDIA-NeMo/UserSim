  title: こもれびがん保険：お申込みいただける方
  body: '「こもれびがん保険」のお申込み条件と判定についてご案内します。


    | 条件 | 判定・結果 |

    | :--- | :--- |

    | 正確な告知義務の履行 | ご契約いただけます |

    | 事実に反する告知があった場合 | 契約解除、または保険金・給付金の不支払いの対象となります |

    | 申込日から8日以内（書面受領後含む） | クーリング・オフによる申し込み撤回が可能です |

    | 契約後90日以内の診断 | 「待ち期間」に該当し、保障は適用されません |


    ※お申込みの際は、必ず最新の健康状態を正確にお伝えください。'
