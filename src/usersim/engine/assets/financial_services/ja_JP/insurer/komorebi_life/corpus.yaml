- id: 66f6b23e-cbfb-55ce-b498-7d387d49957e
  title: こもれび医療保険：登録内容の変更
  body: 'ご住所、お名前、または保険料のお支払い方法などの登録内容を変更する手順をご案内いたします。


    【お手続き前にご用意いただくもの】

    ・ご契約者様ご本人様であることの確認（フルネームと生年月日）


    【変更の手順】


    1. 本人確認を行います

    まず、お客様のフルネームと生年月日をお伺いし、ご本人様であることを確認させていただきます。なお、クレジットカード番号や暗証番号、パスワードなどの機密情報は一切要求いたしませんのでご注意ください。


    2. 変更内容をお伝えください

    「住所を変更したい」「支払い方法をクレジットカードから口座振替に変更したい」など、具体的にどのような変更を希望されるかをお伝えください。


    3. 内容の確認と変更処理

    担当者が変更内容をシステムに反映させます。変更に伴い、新たな書類の送付が必要な場合は、その旨をご案内いたします。


    4. 完了通知の受領

    お手続きが完了しましたら、変更内容を記載した確認書をお送りします（またはWebチャット等で完了をお知らせします）。内容に間違いがないか、必ずご確認をお願いいたします。


    【ご注意】

    受取人の変更など、重要な契約内容の変更については、別途ご本人様による署名や押印が必要な場合がございます。その際は、別途案内する書類を郵送にてご提出ください。'
