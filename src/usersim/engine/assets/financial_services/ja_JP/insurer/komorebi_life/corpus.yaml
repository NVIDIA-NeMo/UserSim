  institution_id: komorebi_life
- id: bcca801b-9570-5223-b708-88ae24355ef8
  title: こもれび終身保険（低解約返戻金型）：ほかの選択肢との比較と向かない場合
  body: '「こもれび終身保険（低解約返戻金型）」は、一生涯の死亡保障と、将来的な貯蓄性をバランスよく備えたプランです。一方で、すべての方に最適とは限りません。


    【本商品が向いている方】

    ・一生涯変わらない保障を持ちたい方

    ・無理のない保険料で、将来に向けた備え（貯蓄性）を準備したい方

    ・保険料の払込みを一定の年齢（例：60歳）で完了させたい方


    【本商品が向かない方・ほかの選択肢】

    ・「子どもの独立まで」など、特定の期間だけ集中的に大きな保障がほしい方

    →「こもれび定期保険」のように、低コストで効率的に保障を確保できる掛け捨て型プランが適しています。

    ・短期間で解約する可能性がある方

    →本商品は低解約返戻金期間中の解約返戻金が70%となるため、早期解約による不利益が大きくなります。


    【判断のポイント】

    保障の「期間」と「コスト」のどちらを優先するかで選択肢が変わります。本商品は、長期的に視点を置き、誠実にライフプランを築きたい方に最適なパートナーとなる商品です。'
  domain: insurance
  product_category: shushin_hoken
  document_type: product_sheet
  source_authority: official
