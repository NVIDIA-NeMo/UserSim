- id: a6022270-7885-536d-99d4-ce1f3ab86919
  title: こもれび医療保険：状況・履歴の確認
  body: 'ご契約内容の状況や、過去の給付金お支払い履歴を確認する手順をご案内いたします。


    1. ご本人確認：まず、契約者番号をお伺いし、本人確認書類に基づいた厳格な認証を行います。

    2. 確認事項の提示：確認したい内容（例：直近の給付金支払額、現在の保障状況など）を当社にお伝えください。

    3. 内容の照会：当社にて最新の契約状況および履歴を照会いたします。

    4. 結果の回答：照会結果に基づき、給付金額や手続きの進捗状況を口頭または書面にてご案内いたします。


    認証が完了するまで、機密性の高い情報の開示は行えませんので、あらかじめご了承ください。'
