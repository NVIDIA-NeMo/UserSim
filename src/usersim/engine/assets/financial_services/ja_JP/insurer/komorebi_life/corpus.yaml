  title: こもれび終身保険（低解約返戻金型）：ご紹介・継続利用の特典
  body: 'こもれび生命をご愛顧いただいているお客様へ、大切な方への安心を広げる「ご紹介特典」をご案内いたします。


    現在、こもれび終身保険（低解約返戻金型）にご加入中のお客様から、ご家族やご友人に本プランをご紹介いただき、新しくご契約に至った場合に特典を設けております。また、長年継続してご利用いただいているお客様への感謝として、継続利用特典をご用意しております。


    詳細な条件や特典内容につきましては、カスタマーセンターにてご案内いたします。お客様と、お客様の大切な方の将来に寄り添うパートナーとして、誠実なサポートをさせていただきます。'
