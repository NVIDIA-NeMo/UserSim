  title: こもれび個人年金保険：リスクについてのご説明
  body: '本保険にご加入いただく前に、以下のリスクについて十分にご理解ください。


    【解約に関するリスク】

    契約途中で解約された場合、解約返戻金がお支払い済みの保険料を下回る可能性があります。長期的な資産形成を目的とした商品であるため、早期解約は推奨されません。


    【告知義務に関するリスク】

    契約時の告知義務に違反し、事実と異なる告知をした場合、契約解除や給付金が支払われないことがあります。


    【補償について】

    当社は生命保険契約者保護機構の加盟保険会社であり、万が一の際には責任準備金等の90%まで補償される仕組みとなっております。個別の税務相談などの専門的助言は行いませんので、詳細は税理士等の専門家にご相談ください。'
