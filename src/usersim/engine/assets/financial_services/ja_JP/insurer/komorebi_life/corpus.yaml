- id: 9edc4aee-f241-5dea-8b90-ec5a7e60d487
  title: こもれび医療保険：お申込みとご利用開始
  body: 'こもれび医療保険へのご加入は、以下の手順で進めていただけます。


    1. 本人確認

    まず、お客様のフルネームと生年月日を確認し、ご本人様であることの確認を完了させます。


    2. 告知義務の履行

    現在のご健康状態や、過去に治療を受けた履歴について正確にお伝えください。これを「告知義務」と呼びます。事実に反する告知をした場合、契約解除や給付金が支払われないことがありますので、誠実な回答をお願いいたします。


    3. プランの確定と書面確認

    保障内容と保険料を確認し、お申し込みを確定させます。その後、契約内容を記載した書面（または電磁的記録）をお受け取りください。


    4. 保険料のお支払い

    ご指定の口座またはクレジットカードにて保険料のお手続きを行います。


    【クーリング・オフについて】

    お申し込み後、申込日または契約内容の書面を受け取った日のいずれか遅い日から 8 日以内であれば、申し込みを撤回（クーリング・オフ）することが可能です。その際は書面または電磁的記録にてお知らせください。'
