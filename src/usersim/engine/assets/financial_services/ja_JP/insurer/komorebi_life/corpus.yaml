- id: 4b1f97ee-5547-58f7-aa36-8e52727c8dd6
  title: こもれび個人年金保険：返戻率の例について
  body: '**質問：返戻率とは何ですか？また、この商品の返戻率の例を教えてください。**


    **回答：**

    返戻率とは、お客様が支払った保険料の総額に対して、将来的に受け取る年金などの合計額がどれくらいの割合になるかを示す指標です。


    「こもれび個人年金保険」の返戻率の例は108%です。これは、計画的に積み立てを行うことで、元本を上回る安定した資金準備を目指せる設計になっていることを意味します。


    ※実際の受取額は、加入時の年齢やプラン内容によって異なります。詳細なシミュレーションについては、担当者までお問い合わせください。'
