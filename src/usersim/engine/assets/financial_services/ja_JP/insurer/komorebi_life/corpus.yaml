  body: '最近、「こもれび個人年金保険」をかたり、「短期間で確実に資産を倍増させる」など、不自然に高い利回りをうたって送金を求める詐欺の手口が報告されています。当社が、メールやSNSを通じてお客様のパスワードや暗証番号を伺うことは決してございません。また、指定口座以外への送金を指示することもございません。


