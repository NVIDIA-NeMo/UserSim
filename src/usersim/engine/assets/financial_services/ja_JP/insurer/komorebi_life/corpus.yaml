- id: 6797f969-c724-55d2-a295-3f7b3173c600
  title: こもれび定期保険：状況・履歴の確認
  body: 'ご契約中の「こもれび定期保険」の現在の状況や、これまでの保険料お支払い履歴を確認する手順をご案内します。


    【ご準備いただくもの】

    特になし（ご本人確認のみで可能です）


    【確認の手順】

    1. カスタマーセンターの担当者に、現在の契約状況またはお支払い履歴を確認したい旨をお伝えください。

    2. 本人確認のため、お客様の「フルネーム」と「生年月日」をお伝えください。

    3. 担当者が本人確認を完了させた後、現在の契約状態（有効か、失効しているかなど）および、直近の保険料お支払い状況を口頭または書面にて回答いたします。


    【完了の目安】

    担当者より「現在の状況は〇〇です」と案内があり、ご不明点が解消された時点で完了となります。


    お支払い金額の詳細や、過去の明細について詳しく確認したい場合は、「こもれび定期保険：手数料一覧」をご参照いただくか、担当者までお問い合わせください。'
