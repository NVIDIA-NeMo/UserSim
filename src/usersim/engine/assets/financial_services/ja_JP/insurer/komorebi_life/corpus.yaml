  body: '| 提出書類 | 必要なケース | 備考 |

    | :--- | :--- | :--- |

    | お申込書 | 新規加入時 | 告知事項を正確にご記入ください |

    | 本人確認書類（写し） | 新規加入・契約者変更時 | 運転免許証、マイナンバーカード等 |

