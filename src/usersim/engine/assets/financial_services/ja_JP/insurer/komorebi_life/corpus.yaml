  body: 本商品の保険料は、お客様のリスクと加入年齢に基づき、長期的な持続可能性を最優先に設定しております。低解約返戻金型として、解約返戻金率を標準の70%に設定することで、保険料の低減を実現しています。この70%という比率は、プラン維持と運営コスト回収の根拠に基づいた固定の設計値であり、一律に適用されます。
