- id: 967c91ce-7c6a-5168-b5ad-c3eb6dd744dc
  title: こもれび終身保険（低解約返戻金型）：保険金額の例について
  body: '【質問】保険金額はどのくらいに設定できるのでしょうか？また、具体的な例を教えてください。


    【回答】お客様のご希望やライフプランに合わせて設定いただけます。例えば、保険金額の例として5,000,000円という設定がございます。この金額は、万が一の際にご家族へ残される資金や、葬儀費用などの準備としてご活用いただけます。具体的な設定金額によって月々の保険料が変わりますので、詳細なプラン作成については、お客様の意向に基づき誠実に提案させていただきます。


    詳細は「こもれび終身保険（低解約返戻金型）：商品概要」をご確認ください。'
