  institution_id: komorebi_life
- id: d8832099-2a35-59ff-adbb-a23240fa2bc9
  title: get_statements を使う場面
  body: 'お客様から、保険料の支払明細や契約内容の確認書などのステートメント（報告書・明細書）の発行を求められた際に本手続きを行います。


    1. `verify_identity` を実行し、本人認証を完了させてください。

    2. `get_accounts` を使用して、どの契約に関する明細が必要かを確認します。

    3. 必要とされる書類の種類（期間や内容）を伺います。

    4. `get_statements` ツールを呼び出し、該当する明細書の発行および送付手続きを行います。


    ツールの詳細は「get_statements ツールリファレンス」を確認してください。'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: komorebi_life
- id: 74e9607d-1ab4-5b4f-8a35-1ee0294cdd05
  title: get_statements ツールリファレンス
  body: get_statements ツールは、お客様の保険契約に関する明細書や払込履歴などのステートメントを取得するために使用します。エージェントはこのツールを直接呼び出すことで、お客様の最新の契約状況や資産形成の進捗などを正確に確認し、その内容に基づいた丁寧な案内を行うことが可能です。
