  institution_id: komorebi_life
- id: fb470039-64aa-5df9-b8bc-eb31d0d2dd5a
  title: こもれび終身保険（低解約返戻金型）：金利・料率の決まり方と適用
  body: '「こもれび終身保険（低解約返戻金型）」の保険料および返戻金の算出根拠についてご案内します。


    【保険料の決定】

    保険料は、加入時の年齢、性別、保障額（例：5,000,000円）、および保険料の払込みが終わる年齢（例：60歳）に基づき、リスクの分散と安定した支払いのための原資として合理的に算出しています。


    【解約返戻金の適用率】

    本商品は、期間によって返戻率が異なる設計となっています。

    ・低解約返戻金期間中：解約返戻金の水準を70%に設定しています。これにより、期間中の保険料を抑えることが可能となっています。

    ・期間経過後：通常の解約返戻金率が適用され、積立 portion の成長に応じた金額となります。


    【適用タイミング】

    これらの率および保険料は、契約締結時の約款に基づき適用され、原則として契約期間中の変更はございません。'
