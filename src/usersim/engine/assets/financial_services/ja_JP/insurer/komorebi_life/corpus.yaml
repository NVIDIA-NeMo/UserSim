- id: a71e5cd0-b002-5377-bdee-c160771a1de1
  title: こもれび終身保険（低解約返戻金型）：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、「保留中」のままとなっている場合に考えられる原因と対処法をご案内します。


    【考えられる原因とチェック項目】

    1. 告知内容の不足：健康状態に関する告知事項に未回答の項目がある場合、審査が進まず保留となります。入力内容に漏れがないか再度ご確認ください。

    2. 本人確認情報の不一致：ご提示いただいたフルネームや生年月日が、登録情報と一致していない場合がございます。

    3. 提出書類の不備：必要書類の画像が不鮮明である、または不足している可能性があります。


    【解決方法】

    ・不足している情報の追加提供、または不鮮明な書類の再提出をお願いいたします。これらの対応が完了次第、速やかに審査を再開いたします。


    【エスカレーションについて】

    上記を確認しても解決しない場合、または複雑な事情がある場合は、内部規定に基づき専門のコンプライアンス部門へエスカレーションし、誠実に対応させていただきます。解決までにお時間をいただく場合がございますので、あらかじめご了承ください。'
