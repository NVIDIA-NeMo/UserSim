  body: 'こもれびがん保険の解約や契約内容の変更、プランの切替えをご希望の方は、以下の手順でお手続きください。


    1. お手続きの内容（解約、受取人の変更、プラン変更など）を当社担当者へお伝えください。

    2. 本人確認のため、ご契約者番号と有効な本人確認書類（運転免許証やマイナンバーカード等）をご提示ください。厳格な認証完了後、手続きへ進みます。

    3. 変更後の内容や、解約に伴う解約返戻金の有無について、担当者より詳細な説明を受け、内容に同意してください。

    4. 手続き完了後、変更内容を記載した書面または通知が送付されます。内容を確認し、お手続きが正しく完了したことをご確認ください。


    なお、書面受取後8日以内であれば、クーリング・オフ制度による撤回が可能です。'
