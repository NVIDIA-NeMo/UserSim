  title: こもれびがん保険：金利・料率一覧
  body: '「こもれびがん保険」の保険料についてご案内します。


    【保険料の例】

    ■月払保険料：1,980円

    （条件：40歳男性、終身払の場合）


    【料率の考え方】

    当社の保険料は、リスクの分散と安定した給付金支払いのための原資を確保しつつ、合理的かつ透明性の高い体系で算出されています。年齢、性別、プラン内容に応じて適正価格を維持しております。


    【料率の変動について】

    原則として、一度ご契約いただいたプランの保険料は、契約期間中に変動することはありません（終身払の場合）。プラン変更を希望される場合は、その時点での料率に基づき再計算いたします。'
