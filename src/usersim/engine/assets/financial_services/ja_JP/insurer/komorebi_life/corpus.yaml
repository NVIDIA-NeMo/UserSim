- id: 739bc761-8622-535d-8875-f152d90959a8
  title: こもれび医療保険：当社の似た商品との比較
  body: '「こもれび医療保険」と「こもれびがん保険」の主な違いをご案内します。


    ■こもれび医療保険

    ・特徴：入院や手術など、病気やケガ全般を幅広くカバーします。

    ・給付例：入院1日につき 10,000円。外来手術 50,000円など。

    ・向いている方：どのような入院・手術の負担にも備えたい方。


    ■こもれびがん保険

    ・特徴：がん診断時のまとまった一時金と、がん治療に特化した保障を提供します。

    ・給付例：がん診断時のまとまった一時金（詳細は「こもれびがん保険：商品概要」参照）。

    ・向いている方：がん治療に重点的に備えたい方。


    公的医療保険の不足分を幅広く補いたい場合は「こもれび医療保険」を、特定の疾患に備えたい場合は「こもれびがん保険」が適しています。組み合わせによる備えも可能です。'
