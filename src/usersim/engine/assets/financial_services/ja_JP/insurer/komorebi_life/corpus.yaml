- id: a2a176cd-1501-53e5-b66e-83cdbca26e24
  title: こもれび終身保険（低解約返戻金型）：手数料と費用
  body: '【質問】

    この保険に入るために、保険料以外に手数料はかかりますか？また、保険料の目安を教えてください。


    【回答】

    ご契約に際して、別途「加入手数料」のような費用をいただくことはございません。お客様にご負担いただくのは、プランに応じた適正な保険料のみとなります。


    （保険料の例）

    40歳女性の方が、保険料の払込みが終わる年齢を60歳として加入された場合、月払保険料の例は12,400円となります。


    保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用されます。詳細な保険料は、お客様のご年齢や保障金額（例：5,000,000円など）に応じて算出いたしますので、個別にお見積もりいたします。'
