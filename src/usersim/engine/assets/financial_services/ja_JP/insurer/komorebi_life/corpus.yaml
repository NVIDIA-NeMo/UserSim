- id: 7bf7385e-eee3-5e3e-87ef-24701871f5df
  title: こもれび定期保険：商品概要
  body: 'こもれび定期保険は、低コストで一定期間の大きな保障を効率的に確保できる、掛け捨て型のプランです。人生の特定のステージにおいて、万が一の際にご家族に十分な資金を残したいというニーズに最適です。


    【商品の特徴】

    本プランは、貯蓄性をあえて持たせない「掛け捨て型」にすることで、合理的な保険料で高い保障額を準備できる設計となっています。シンプルな仕組みで、どなたでも分かりやすくご利用いただけます。


    【主なプラン内容】

    ・保険期間（年）：10

    ・契約できる年齢の上限：70


    【保障額と保険料の例】

    ・保険金額の例：30,000,000円

    ・月払保険料の例（30歳男性、保険期間10年）：3,150円


    ※上記の例は、お客様の年齢、性別、健康状態によって異なります。詳細なプラン設計については、担当スタッフまでお問い合わせください。


    【ご留意事項】

    本商品は掛け捨て型のため、満期金や解約返戻金はございません。あらかじめご了承いただけますようお願い申し上げます。'
  domain: insurance
  product_category: teiki_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 669eed24-b501-5042-9af6-5187a5988345
  title: こもれび定期保険：保険金額の例について
  body: '【質問】こもれび定期保険で準備できる保険金額の目安を教えてください。


    【回答】お客様のご状況に合わせて柔軟に設定いただけます。例えば、保険金額の例として30,000,000円という設定がございます。このように、一定期間だけ効率的に大きな保障を確保したい場合に非常に有効なプランです。


    具体的な金額の設定や、それに基づいた保険料のお見積もりについては、お客様の現在の年齢やご希望のプランに合わせて算出いたします。詳細は「こもれび定期保険：商品概要」をご参照ください。'
  domain: insurance
  product_category: teiki_hoken
  document_type: faq
  source_authority: official
