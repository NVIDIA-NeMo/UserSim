  institution_id: komorebi_life
- id: 1aed04d4-c75f-5def-b9ba-49dbdeee9490
  title: こもれび個人年金保険：商品概要
  body: '「こもれび個人年金保険」は、老後の資金形成を目的として、計画的に資産を積み立てるためのプランです。将来への不安を解消し、安心できるセカンドライフをサポートいたします。


    【プランの特長】

    本プランでは、年金の受取開始年齢を65歳に設定し、その後10年間にわたって計画的な受取が可能です。例えば、月々の保険料を10,000円として積み立てた場合、返戻率の例として108%という効率的な資産形成を目指せます。


    【安心のサポート】

    透明性の高い商品設計により、お客様のライフステージに寄り添ったコンサルティングを提供いたします。詳細な契約条件や免責事項については、「こもれび個人年金保険：重要事項のご説明」にてご確認いただけます。'
