- id: d45ae4c1-1160-5d1a-905b-317cf009a1b1
  title: こもれび個人年金保険：状況・履歴の確認
  body: '「こもれび個人年金保険」の現在の契約状況や、これまでの払込履歴を確認する手順をご案内します。


    【準備するもの】

    ・ご契約者様ご本人であること


    【確認の手順】

    1. カスタマーセンターまたはWebチャットにて、「契約状況と払込履歴を確認したい」とお伝えください。

    2. 本人確認のため、ご登録の「フルネーム」と「生年月日」をお伝えください。

    3. 担当者がシステムで照会を行い、以下の内容を確認し、回答いたします。

    　・現在の契約状態（有効、払込猶予期間中など）

    　・これまでの保険料の払込回数と金額

    　・現在の解約返戻金の概算額（ご要望に応じて）


    【完了の確認】

    担当者から口頭またはチャット画面上で、最新の履歴について回答があった時点で手続き完了となります。内容に不明点がある場合は、その場で詳細についてお問い合わせください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 784c4983-dc89-5c7a-97db-bad8586f0201
  title: こもれび個人年金保険：お取引が拒否された・制限された
  body: '「受取人の変更手続きができない」「解約の手続きが制限されている」など、お取引が拒否されたと感じられる場合の原因と対処法をご案内します。


    【考えられる原因】

    1. 本人確認が完了していない：ご提示いただいた情報が登録内容と一致していない可能性があります。

    2. 契約の状態が「失効」している：保険料の払込が滞り、保障および積立が停止している状態で、一部の手続きが制限されることがあります。

    3. 書類の不備：必要書類に不備がある場合、手続きが保留となります。


    【対処方法】

    ・まず、ご登録のフルネームと生年月日が正しく伝わっているか、再度ご確認をお願いします。

    ・契約状態を確認し、もし「失効」している場合は、復活手続きが可能かをご確認ください。


    【解決しない場合】

    上記を確認しても制限が解除されない場合、または不正利用の疑いがある場合は、速やかに専門のコンプライアンス部門へエスカレーションし、詳細な調査を行います。調査結果については、改めてご連絡差し上げます。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 558ebcac-6954-5a37-baf4-e56d56f168f8
  title: こもれび個人年金保険：切替えや上位プランを検討するとき
  body: '【サポート担当者向け：プラン検討の指針】


    顧客から「こもれび個人年金保険」から他のプランへの切り替えや、保障の強化について相談を受けた際は、以下の視点で比較提案を行ってください。


    ■ 目的による使い分け

    ・老後の資金準備を最優先したい → 「こもれび個人年金保険」を継続。

    ・万が一の死亡保障と貯蓄性を両立させたい → 「こもれび終身保険（低解約返戻金型）」への切り替えまたは併用を検討。

    ・低コストで一定期間の大きな保障を確保したい → 「こもれび定期保険」を検討。


    ■ 切り替え時の注意点

    個人年金保険を中途解約して他商品へ切り替える場合、解約返戻金が払込保険料を下回る可能性があります。顧客の不利益を最小限にするため、現在の積立状況と将来の受取予定額を提示し、誠実な標準的ケアをもって提案してください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 706eb211-7edf-5867-91bc-b452271149b1
  title: こもれび個人年金保険：ほかの選択肢との比較と向かない場合
  body: '「こもれび個人年金保険」は、老後の安定した資金準備を目的としたプランです。お客様の目的によっては、他の商品の方が適している場合があります。


    ■ この商品が向いている方

    ・定年退職後の生活資金を、計画的に、かつ確実に準備したい方

    ・個人の判断で老後の年金的な収入を確保したい方


    ■ この商品が向かない方（他の選択肢を推奨する場合）

    ・【死亡保障を優先したい方】

    　ご家族への保障を主目的とする場合は、「こもれび終身保険（低解約返戻金型）」の方が適しています。

    ・【短期間に大きな保障を効率的に得たい方】

    　掛け捨て型で低コストに保障を確保したい場合は、「こもれび定期保険」をご検討ください。

    ・【短期的な資金の流動性を重視する方】

    　本商品は長期的な積立を前提としており、早期に解約すると元本を割り込む可能性があります。いつでも自由に引き出したい資金の運用には向いていません。


    お客様の意向と客観的なデータに基づき、最適なライフプランニングをご提案いたします。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: da54fc33-f36f-563c-98c7-24314ff630db
  title: こもれび個人年金保険：手数料と費用
  body: '**質問：このプランの保険料はどのように決まりますか？また、月々いくらくらいになりますか？**


    **回答：**

    当社の保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用し、合理的かつ透明性の高い体系を採用しています。


    【保険料の例】

    30歳で加入し、65歳まで保険料を払い込むプランの場合、月払保険料の例は10,000円となります。


    保険料はプラン内容や加入年齢に応じて適正な価格に設定されており、分かりやすい設計となっております。詳細なプラン内容に応じたお見積もりは、いつでも承っております。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 06b00a3e-6495-5e3d-9fa7-85875726769e
  title: こもれび個人年金保険：よくあるお手続きの流れ
  body: '「こもれび個人年金保険」のお申し込みからご利用開始までの基本的な流れをご案内します。


    【お手続きの流れ】

    1. **プランのご相談と意向確認**

    　お客様の将来のライフプランに基づき、希望される年金受取額や払込期間をご提示ください。

    2. **告知義務への対応**

    　ご契約にあたり、現在の健康状態などの告知をお願いします。事実に反する告知をした場合、契約解除や給付金が支払われないことがあるため、正確な内容をお伝えください。

    3. **重要事項のご確認**

    　保障内容、保険料、およびクーリング・オフ（書面受領後8日以内）についてのご説明を受け、内容に同意していただきます。

    4. **お申し込みの完了と保険料のお支払い**

    　お申し込み手続きを完了し、指定の口座等から保険料の払込が開始されます。


    【完了の確認】

    お手続き完了後、契約内容を記載した書面（保険証券等）が届きます。内容をご確認いただき、ご不明点があればカスタマーセンターまでお問い合わせください。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: e06b6b1c-e461-5966-a93a-2b8e4b3e6c3d
  title: こもれび個人年金保険：明細や記録と合わない
  body: '【サポート担当者向け：明細不一致への対応】


    お客様から「払込保険料の金額が記録と違う」「想定していた解約返戻金と乖離がある」といったお問い合わせがあった場合の対応手順です。


    【確認ステップ】

    1. **本人確認の徹底**

    　フルネームと生年月日を確認し、正しい契約者のデータであるか再照合してください。

    2. **払込履歴の精査**

    　保険料の未払いや、払込猶予期間による失効が発生していないかを確認します。

    3. **税制適用の確認**

    　生命保険料控除などの適用により、お客様が認識されている金額と実質の負担額に差が出ていないかを確認してください。なお、新制度では個人年金保険料区分で最高40,000円まで所得税の控除が適用されます。


    【解決しない場合の対応】

    システム上の不整合が疑われる場合や、計算根拠について強い不信感を持たれている場合は、速やかに内部規定に基づき、専門のコンプライアンス部門へエスカレーションしてください。解決までのプロセスは透明性を持って顧客に案内し、必要に応じて生命保険協会の生命保険相談所との連携を検討します。'
  domain: insurance
  product_category: kojin_nenkin
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
- id: 05d108bb-f93d-5a18-9524-9e9597ec3858
  title: 手数料・料金のご案内
  body: 'こもれび生命では、お客さまに長期的な安心を提供するため、合理的で透明性の高い保険料体系を採用しております。


    ■保険料について

    各プランの保険料は、リスクの分散と安定した給付金支払いのための原資として適切に運用し、プラン内容に応じた適正価格を維持しています。具体的な保険料は、ご加入時の年齢、性別、保障内容によって異なります。


    ■手数料について

    弊社では、分かりやすい商品設計を心がけており、ご契約に際して不透明な手数料をいただくことはございません。各商品ごとの詳細な費用については、それぞれの「手数料一覧」をご参照ください。'
  domain: insurance
