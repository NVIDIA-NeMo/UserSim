- id: ac29a16d-7ea2-5c0e-97c0-7df978f3909b
  title: こもれび医療保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの安心を守るため、厳格な本人確認体制を敷いております。特に「こもれび医療保険」における受取人の変更や契約内容の変更など、状態を変化させるすべてのお手続きの前には、必ず契約者番号および本人確認書類を用いた認証を行います。この認証が完了するまで、機密性の高い情報の開示や手続きの実行は一切行いません。


    【ご注意ください】

    当社がメールや電話で、暗証番号やクレジットカードのセキュリティコードを直接お伺いすることはございません。不審な連絡があった場合は、速やかにお手続きを中断し、当社までご連絡ください。また、万が一、不正利用の疑いがある場合は、被害を最小限に抑えるため、直ちにご報告をお願いいたします。'
