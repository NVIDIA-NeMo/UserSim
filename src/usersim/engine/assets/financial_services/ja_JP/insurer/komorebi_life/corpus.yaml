  institution_id: komorebi_life
- id: 8fcd4576-20f6-51da-aaf1-4055afd40697
  title: こもれびがん保険：手数料と費用
  body: 'Q：契約維持や手続きに際して、別途手数料はかかりますか？


    A：通常の保険契約の維持における事務手数料は、保険料に含まれております。ただし、契約者貸付をご利用される際の手数料などは、公平なプラン維持と運営コスト回収のために設定されており、その根拠を明確に提示しております。詳細な費用項目については「こもれびがん保険：手数料一覧」をご確認ください。'
  domain: insurance
