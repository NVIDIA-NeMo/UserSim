- id: 38faaa2a-2c3a-5512-8c7f-837fd09e1f85
  title: こもれびがん保険：限度額・制限と注意事項
  body: '「こもれびがん保険」をご案内する際は、以下の限度額および制限事項について正確にお伝えください。本商品はがん治療に特化した保障を提供するため、特有の制限がございます。


    【主な保障内容と限度額】

    ・がん診断一時金：1,000,000円（がんとの診断が確定した際に一度限り支払われます）

    ・がん治療給付金（月額）：100,000円（治療内容に基づき、月々の負担をサポートします）


    【重要な制限事項】

    ・待ち期間：ご契約から90日間は保障が適用されない「待ち期間」がございます。この期間中にがんの診断を受けた場合は、保険金・給付金の支払対象外となりますので、必ずご説明ください。

    ・告知義務：ご契約時に健康状態を正確に伝える義務があります。事実に反する告知をした場合、告知義務違反となり、契約解除や保険金・給付金が支払われないことがあります。


    【その他の注意事項】

    ・クーリング・オフ：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回できます。

    ・破綻時の補償：万が一、当社が破綻した場合には、生命保険契約者保護機構により、責任準備金等の90%まで（高予定利率契約を除く）が補償されます。ただし、保険金額などが削減される可能性があります。'
