- id: ffb1b49e-0acc-5cbd-aa9c-38ed0abebf15
  title: こもれび医療保険：個人情報の取扱い
  body: 'こもれび生命では、金融庁の監督および保険業法を厳格に遵守し、お客様の個人情報を適切に管理しております。お預かりした個人情報は、保険契約の維持、保険金・給付金のお支払い、および法令に基づく手続きの目的のみに利用し、正当な理由なく第三者に提供することはありません。


    特に、給付金請求時の診断書などの機密情報については、厳重なセキュリティ体制下で取り扱い、責任ある管理を徹底いたします。また、生命保険契約者保護機構により、責任準備金等の90%まで補償される制度についても適切にご案内し、お客様が安心して保障を継続できる環境を整えております。個人情報の取扱いに関する詳細な同意事項は、契約締結時の重要事項説明書にてご案内しております。'
