- id: 0ce733d9-4591-5e00-8c2d-1c970f3f686e
  title: こもれび終身保険（低解約返戻金型）：商品概要
  body: 'こもれび終身保険（低解約返戻金型）は、低解約返戻金型を採用することで、生涯にわたる保障を無理なく準備できるプランです。保険料を抑えながら、万が一の際に備えて確実な保障を確保したい方に最適です。


    【プラン例】

    ・保険金額：5,000,000円

    ・月払保険料：12,400円（例）

    ・払込満了年齢：60歳


    本商品は、一定期間内の解約返戻金を低く設定する代わりに、月々の負担を軽減しています。低解約返戻金期間中の解約返戻金は、標準的な終身保険の70%となる設計です。これにより、長期的な視点でお客様のライフステージに寄り添った誠実な保障を提供いたします。'
  domain: insurance
  product_category: shushin_hoken
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: komorebi_life
