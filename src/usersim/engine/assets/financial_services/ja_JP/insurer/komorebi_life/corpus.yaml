- id: 5e8660b9-56ad-5bd0-b75d-2a5c87152671
  title: こもれび定期保険：月払保険料の例（30歳男性、保険期間10年）について
  body: '【ご質問】

    30歳の男性が保険期間10年で加入した場合の月払保険料はどのくらいになりますか？


    【回答】

    加入される方の年齢やプランによって異なりますが、例として月払保険料3,150円でご加入いただけるプランがございます。詳細な御見積もりについては、お客さまの状況に基づきご案内いたします。'
