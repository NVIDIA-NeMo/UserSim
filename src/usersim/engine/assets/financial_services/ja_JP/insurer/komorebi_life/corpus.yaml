- id: ca3a2456-7388-5016-bda2-0de064e2caa2
  title: こもれび医療保険：ご利用開始までの手順
  body: '担当エージェントの方は、お客様がこもれび医療保険の保障を適切に開始できるよう、以下の手順でサポートを行ってください。


    1. 意向把握とプラン提案：お客様のライフステージとリスク許容度を確認し、客観的データに基づいた提案を行います。

    2. 告知手続き：健康状態を正しく伝える「告知義務」について十分な説明を行い、正確な告知をいただきます。

    3. 審査・承諾：社内審査を経て、契約の承諾可否を決定します。

    4. 書面交付と確認：契約内容を記載した書面を交付し、内容を十分に説明します。この際、8日間のクーリング・オフ権利についても併せて周知してください。

    5. 保険料の支払い設定：ご指定の口座等で保険料の納付手続きを完了させ、保障を開始します。'
