- id: b3e3c314-6381-55f7-b5fe-fd77dada3082
  title: こもれび終身保険（低解約返戻金型）：限度額・制限と注意事項
  body: '本商品は、長期的な保障提供を目的とした設計となっており、以下の制限および注意事項が適用されます。サポート担当者は、お客様へご案内する際に必ずこれらの条件を明示してください。


    【解約返戻金の制限】

    低解約返戻金期間中に契約を解約された場合、解約返戻金は標準的な終身保険の解約返戻金から70%の水準に抑制されます。この点は、短期的な資金調達を目的とされるお客様にとって重要な制約となります。


    【保険料払込期間】

    本プランの例として、60歳まで保険料を払い込む設定（払込期間）が一般的です。払込満了後の保障継続について、適切に案内してください。


    【重要事項】

    告知義務違反があった場合、契約解除や保険金・給付金の支払拒否に至るリスクがあります。また、書面受取後8日以内であればクーリング・オフが可能です。'
