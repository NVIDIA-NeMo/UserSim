- id: ac29a16d-7ea2-5c0e-97c0-7df978f3909b
  title: こもれび医療保険：不正利用からお客さまを守るために
  body: 'こもれび生命では、お客さまの大切なご契約と個人情報を守るため、厳格なセキュリティ体制を整えています。特に「こもれび医療保険」をご検討中の方や、既にご加入中の方は、以下の点にご注意ください。


    【当社が絶対に要求しない情報】

    当社から、電話やメール、チャットを通じて、以下の機密情報を伺うことは一切ございません。

    ・クレジットカード番号

    ・暗証番号（PIN）

    ・Webサービスのパスワード

    ・身分証明書（マイナンバーカード等）の番号そのもの


    【本人確認の手続きについて】

    ご契約内容の変更や給付金のお手続きを行う際は、まずお客さまの「フルネーム」と「生年月日」を確認させていただきます。この手順は、なりすましによる不正な手続きを防ぎ、お客さまの権利を保護するためのものです。


    【不審な連絡への対応】

    もし当社を名乗る人物から、上記のような機密情報を要求されたり、不自然な手続きを急かされたりした場合は、すぐに応答を停止してください。速やかに当社のカスタマーセンターまでご連絡いただき、状況をお知らせください。誠実かつ迅速に調査し、お客さまの不利益を最小限に抑える対応をいたします。'
  domain: insurance
  product_category: iryo_hoken
  document_type: security_advisory
  source_authority: official
  placeholder: true
