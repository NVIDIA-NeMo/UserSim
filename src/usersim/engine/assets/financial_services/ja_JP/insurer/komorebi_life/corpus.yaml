    （条件：40歳女性、保険料の払込みが終わる年齢を60歳とした場合）


    【料率の仕組み】

    保険料は、お客様の加入年齢、性別、保障額、および払込期間（払込満了年齢）に基づいて算出されます。低解約返戻金型を採用することで、通常の終身保険よりも月々の負担を抑えた設計となっております。


