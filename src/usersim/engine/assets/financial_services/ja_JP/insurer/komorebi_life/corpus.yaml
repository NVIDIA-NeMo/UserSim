- id: fece30e3-49fb-5f06-80bb-c81886e33a78
  title: こもれび個人年金保険：限度額・制限と注意事項
  body: '【サポート担当者向け：商品制限・注意事項】


    「こもれび個人年金保険」を案内する際は、以下の制限事項と法的義務を正確に伝えてください。


    ■ 商品の基本設計

    ・年金の受取開始年齢：65歳（原則としてこの年齢から受取が始まります）

    ・年金の受取期間（年）：10年（確定年金として10年間にわたり給付されます）


    ■ 重要な法的義務と権利

    ・告知義務：契約時に健康状態等を正確に伝える義務があります。事実に反する告知をした場合、契約解除や保険金・給付金が支払われない可能性があることを明確に伝えてください。

    ・クーリング・オフ：申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、申し込みを撤回できます。


    ■ 運用上の注意

    本商品は計画的な積立による老後資金の準備を目的としています。早期に解約した場合、解約返戻金が支払った保険料を下回る可能性がある点に注意し、顧客のライフプランに沿った提案を行ってください。


    詳細な手続きについては、「こもれび個人年金保険：よくあるお手続きの流れ」を確認してください。'
  domain: insurance
  product_category: kojin_nenkin
