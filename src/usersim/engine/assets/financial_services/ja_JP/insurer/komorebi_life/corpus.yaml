  title: こもれび個人年金保険：ログインできない・アクセスできない
  body: '【症状】専用ページにログインできない、またはアクセスが拒否される。


    【原因と確認事項】

    ・パスワードの入力誤り：大文字・小文字の区別をご確認ください。

    ・契約者番号の不一致：お手元の保険証券に記載された番号と一致しているかご確認ください。

    ・認証情報の期限切れ：セキュリティ上の理由で再認証が必要な場合がございます。


    【解決策】

    パスワードの再設定手続きを行い、再度ログインを試行してください。


    【エスカレーション】

    上記で解決しない場合、当社コンプライアンス部門にてアカウントの状態を調査し、復旧方法をご案内いたします。'
