- id: f957984e-f7ae-5dd5-9062-5355d4506211
  title: こもれび終身保険（低解約返戻金型）：低解約返戻金期間中の解約返戻金の水準について
  body: 'Q：低解約返戻金期間中に解約した場合、どのくらいの金額が戻ってきますか？


    A：低解約返戻金期間中に解約された場合、解約返戻金は通常の終身保険に比べて低く設定されており、70%の水準となります。そのため、期間内の解約は解約返戻金が大幅に少なくなる可能性がございます。あらかじめご了承ください。


    詳細については、「こもれび終身保険（低解約返戻金型）：商品概要」をご参照ください。'
