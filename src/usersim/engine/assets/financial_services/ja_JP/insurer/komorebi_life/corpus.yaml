- id: 1cbab1dd-61e0-5275-9b4c-ab15489b58a4
  title: こもれび終身保険（低解約返戻金型）：状況・履歴の確認
  body: '現在のご契約状況や、これまでの保険料払込履歴を確認する手順をご案内します。


    1. ご契約者番号および本人確認書類をご用意ください。

    2. 担当者へ「現在の解約返戻金の金額」および「保険料の払込履歴」の確認を依頼してください。

    3. 本人認証手続きを行い、照会権限を確定させます。

    4. 担当者より、現在の積立状況、次回のお支払予定日、および低解約返戻金期間の適用状況について回答を受けます。


    【確認のポイント】

    低解約返戻金型のため、解約返戻金を確認される際は、現在の水準が70%制限の期間内にあるかをご確認ください。'
