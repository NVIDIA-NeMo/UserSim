  body: 大切なお年金資産を守るため、セキュリティへのご注意をお願いいたします。当社では、メールやSMSでクレジットカード番号や暗証番号を伺うことはございません。また、受取人の変更や契約内容の変更など、重要な手続きの前には必ず本人確認書類と契約者番号による厳格な本人認証を行います。万が一、不審な連絡を受けたり、身に覚えのない通知が届いたりした場合は、直ちにご報告ください。迅速に専門部署にて調査を行い、お客様の資産を保護いたします。
