- id: fe609b22-d720-58c1-bfe3-e9add32ba785
  title: こもれび個人年金保険：手数料一覧
  body: '【保険料および費用のご案内】


    こもれび個人年金保険では、透明性の高い保険料体系を採用しております。


    ・月払保険料：お客様が選択されるプラン内容（積立額・期間）に応じた適正価格となります。

    （例：30歳加入、65歳払込満了の場合、月々10,000円）


    ・加入手数料：無料


    ・契約内容変更手数料：無料


    ※保険料は、リスクの分散と安定した給付金支払いのための原資として運用されます。合理的かつ透明性の高い価格を維持し、お客様の長期的な安心を第一に考えた設計となっております。'
