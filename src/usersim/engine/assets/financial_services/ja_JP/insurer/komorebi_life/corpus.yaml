  body: '最近、当社の「こもれびがん保険」をかたる不審な電話やメールによる詐欺被害が報告されています。犯人は「特別なプランへの切り替えで保険料を大幅に下げる」や「審査なしで給付金を早急に支払う」といった虚偽の内容で、お客様の個人情報を聞き出そうとします。


