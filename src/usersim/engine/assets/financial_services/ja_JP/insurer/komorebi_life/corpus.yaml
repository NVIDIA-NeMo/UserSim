  body: エージェントは本ツールを直接呼び出すことで、死亡保険金受取人や指定代理請求人の変更手続きを行います。引数として、契約者番号（account_id）および、新しい受取人の氏名・関係などの詳細情報（beneficiary_details）が必要です。
