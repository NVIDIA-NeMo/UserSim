- id: 66f6b23e-cbfb-55ce-b498-7d387d49957e
  title: こもれび医療保険：登録内容の変更
  body: 'ご住所やご連絡先など、ご登録内容の変更手続きは以下の手順で承ります。


    1. 変更内容の伝達：変更したい項目と、新しい情報を当社担当者へお伝えください。

    2. 本人認証の実施：セキュリティ保護のため、ご提示いただいた「本人確認書類」と「契約者番号」を用いて、厳格な本人確認を行います。

    3. 内容の照合と更新：認証完了後、当社にて登録情報の更新手続きを行います。

    4. 完了通知の受領：手続きが完了しましたら、変更内容を記載した通知書を発送いたします。書面がお手元に届いた時点で、変更が正式に完了となります。


    受取人の変更など、重要な契約内容の変更につきましても、同様に厳格な本人認証を経て安全に執行いたします。'
  domain: insurance
