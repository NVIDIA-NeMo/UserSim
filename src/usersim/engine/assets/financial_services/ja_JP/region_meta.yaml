domain_regulators:
  retail_banking:
    regulators:
    - 金融庁
    - 預金保険機構
    regulator_text: 銀行は銀行法に基づき金融庁の監督を受ける。預金保険制度により、利息のつく普通預金や定期預金などは、1金融機関につき預金者1人当たり元本1,000万円までと破綻日までの利息等が保護され、無利息、要求払い、決済サービスを提供できるという3つの条件を満たす決済用預金は全額が保護される。外貨預金は預金保険の対象外である。偽造・盗難キャッシュカードによる不正な払戻しは、預金者保護法に基づき、預金者に故意や重大な過失がない限り原則として銀行が補償する（盗難カードで預金者に過失がある場合は、補償が減額されることがある）。口座の開設などでは、犯罪収益移転防止法に基づく取引時確認（本人確認）が必要になる。個人情報は個人情報保護法に従って取り扱う。苦情や紛争は全国銀行協会相談室で受け付けている。エージェントは、口座の情報を伝えたり変更したりする前に本人確認を行う。
  cards:
    regulators:
    - 金融庁
    regulator_text: デビットカードは利用と同時に預金口座から代金が引き落とされ、口座残高を超えて利用することはできない。紛失や盗難に気づいたら、ただちに銀行に届け出てカードの利用を止める必要がある。インターネットでの利用には本人認証サービス（EMV
      3-Dセキュア）が使われる。不正利用による被害は、銀行の規定に基づき、届出日からさかのぼった一定期間の分が補償の対象となる。キャッシュカードの偽造・盗難による不正な払戻しは預金者保護法の対象となる。エージェントは、手数料、利用限度額、補償の条件を誤って伝えてはならない。
  lending_mortgage:
    regulators:
    - 金融庁
    regulator_text: 銀行の住宅ローンやカードローンは銀行法に基づき金融庁の監督を受け、貸金業法の総量規制の対象外だが、銀行は返済能力を審査したうえで利用限度額を決める。クレジットカードのキャッシングやカードローンなど、貸金業者による個人向けの貸付けは貸金業法の対象で、総量規制により、貸金業者からの借入れの合計は原則として年収の3分の1までとなる。利息制限法により、上限金利は元本10万円未満が年20%、10万円以上100万円未満が年18%、100万円以上が年15%で、貸金業者の遅延損害金の上限は年20%である。借入れの状況は指定信用情報機関に登録される。住宅ローン控除は、2030年末までに入居した場合に、年末のローン残高の0.7%を所得税などから控除する制度で、住宅の省エネ性能などによって借入限度額と控除期間が異なる。エージェントは融資の承認を約束せず、総返済額を小さく見せず、返済が難しい顧客には早めの相談と返済条件の見直しを案内する。
  payments:
    regulators:
    - 経済産業省
    regulator_text: クレジットカードのショッピングは割賦販売法の対象で、カード会社は経済産業省に登録した包括信用購入あっせん業者として、カードの発行時と利用可能枠を増やすときに支払可能見込額を調査し、それを超える利用可能枠を設定しない。リボ払いや分割払いでは、販売店とのトラブルを理由にカード会社への支払いを拒める場合がある（支払停止の抗弁）。カード会社はカード番号などの情報を適切に管理し、インターネットでの利用には本人認証サービス（EMV
      3-Dセキュア）を導入している。ショッピングの利用は貸金業法の総量規制の対象外である。苦情は日本クレジット協会の消費者相談室でも受け付けている。エージェントは手数料や支払総額を誤って伝えず、リボ払いや分割払いを案内するときは手数料がかかることを明確に伝える。
  insurance:
    regulators:
    - 金融庁
    - 生命保険契約者保護機構
    regulator_text: 生命保険会社は保険業法に基づき金融庁の監督を受ける。生命保険会社が破綻した場合、生命保険契約者保護機構により、補償対象契約の責任準備金等の90%まで（高予定利率契約を除く）が補償されるが、保険金額などが削減されることがある。契約者は、申込日または契約内容を記載した書面を受け取った日のいずれか遅い日から8日以内であれば、書面または電磁的記録によりクーリング・オフ（申込みの撤回）ができる。告知義務に違反すると契約が解除され、保険金や給付金が支払われないことがある。生命保険料控除は、新制度の契約では一般生命保険料、介護医療保険料、個人年金保険料の区分ごとに所得税で最高4万円、合計で最高12万円である。苦情や紛争は生命保険協会の生命保険相談所で受け付けている。エージェントは保険金や給付金の支払いを約束せず、個別の税務や医療の助言は行わない。
  brokerage_investing:
    regulators:
    - 金融庁
    - 日本証券業協会
    regulator_text: 証券会社は金融商品取引法に基づき金融庁に登録し、その監督を受ける。顧客から預かった金銭や有価証券は証券会社の財産と分けて管理され（分別管理）、証券会社が破綻して返還されない場合は、日本投資者保護基金が1人当たり1,000万円まで補償する。相場の変動による損失は補償の対象外である。証券会社は、顧客の知識、経験、財産の状況、投資の目的に照らして不適当な勧誘をしてはならず（適合性の原則）、顧客の最善の利益を考えて業務を行う。上場株式等の譲渡益と配当には20.315%の税金がかかり、NISA口座で得た利益は非課税になる。iDeCoは確定拠出年金法に基づく制度で、国民年金基金連合会が実施し、証券会社は運営管理機関として運用商品の提示や情報提供を行う。証券口座の開設にはマイナンバーの届出が必要である。苦情や紛争は証券・金融商品あっせん相談センター（FINMAC）で受け付けている。エージェントは利益を保証せず、個別の税務の助言は行わない。
