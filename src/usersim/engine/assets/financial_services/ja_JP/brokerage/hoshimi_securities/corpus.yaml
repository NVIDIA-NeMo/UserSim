- id: 59ca471f-16b0-52d7-a175-897eb0196b76
  title: 特定口座（源泉徴収あり）：商品概要
  body: '特定口座（源泉徴収あり）は、上場株式などの譲渡益や配当金にかかる税金を、証券会社がお客様に代わって計算し、自動的に源泉徴収する口座です。最大のメリットは、原則としてお客様ご自身で確定申告を行う手間を省ける点にあります。


    本口座では、国内株式の取引手数料を0円に設定し、コストを抑えた効率的な資産形成を支援します。また、上場株式等の譲渡損が発生した場合、最大3年間にわたり損失を翌年以降に繰り越して、将来の利益と相殺できる損失繰越控除制度をご利用いただけます。適用される税率は20.315%です。デジタル完結のシンプルな手続きで、利便性の高い投資環境を提供いたします。'
