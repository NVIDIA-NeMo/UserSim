  title: NISA（成長投資枠）：よくあるお手続きの流れ
  body: 'NISA（成長投資枠）のご利用開始までの流れは以下の通りです。


    1. 当社へ口座開設の意思を伝えてください。

    2. 指示に従い、マイナンバー届出および本人確認書類を提出してください。厳格な審査を経て口座が開設されます。

    3. 投資したい銘柄と金額を当社へお伝えください。この際、年間の投資枠2,400,000円の範囲内であるかを確認いたします。

    4. 多要素認証による本人確認を行い、注文を確定させます。

    5. 約定後、取引完了の通知をいたします。これにより非課税での資産運用が開始されます。'
