- id: f85ed8b6-36c5-5469-b12f-d1d9fc1f51cb
  title: 特定口座（源泉徴収あり）：この商品をかたる詐欺にご注意ください
  body: '近年、「特定口座（源泉徴収あり）を利用して必ず利益が出る」などと謳い、弊社を装って投資勧誘を行う詐欺行為が報告されています。星見証券が、SNSや個別のメッセージを通じて、特定の銘柄の購入を執拗に勧めたり、外部サイトへの誘導や秘密の投資プランを提示したりすることはございません。


    特にご注意いただきたいのは、多要素認証のコードやパスワードを電話やメールで聞き出そうとする手口です。弊社がこれらの機密情報を直接お伺いすることは一切ございません。もし不審な連絡を受けた場合は、直ちに操作を中断し、弊社までお知らせください。あわせて、資産を守るための設定について「特定口座（源泉徴収あり）：安全にご利用いただくためのポイント」をご確認ください。'
