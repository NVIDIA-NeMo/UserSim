- id: a3629b16-6fff-57b4-b9ea-a3c2e487c8d9
  title: iDeCo（個人型確定拠出年金）：ほかの選択肢との比較と向かない場合
  body: 'iDeCo（個人型確定拠出年金）は、所得控除による強力な節税メリットがある一方で、運用上の制約も大きいため、以下の方は慎重な検討が必要です。


    【向かない方】

    ・近い将来に住宅購入や教育資金など、まとまった現金が必要な方（原則60歳まで出金不可のため）。

    ・月々の拠出額を5,000円未満に抑えたい方（最低拠出額が5,000円であるため）。


    【比較と選択】

