- id: 76a09f15-d33a-57bd-9f26-f5b46a85728b
  title: 特定口座（源泉徴収あり）：ログインできない・アクセスできない
  body: 'ログインできない場合、以下の要因が考えられます。


    【症状と原因】

    ・IDまたはパスワードの誤入力：入力内容に誤りがないか再度ご確認ください。

    ・多要素認証の不整合：認証コードが正しく入力されていないか、期限が切れている可能性があります。

    ・口座の凍結：不正利用の疑いがある場合、セキュリティ保護のため直ちに口座を凍結しています。


    【解決策】

    1. パスワードの再設定：再設定の手続きを行い、再度ログインを試みてください。

    2. 認証デバイスの確認：多要素認証に設定したデバイスが正しく動作しているか確認してください。


    【エスカレーション】

    上記で解決せず、口座凍結の疑いがある場合は、専任のコンプライアンス担当者が詳細な調査を行い、結果を報告いたします。'
