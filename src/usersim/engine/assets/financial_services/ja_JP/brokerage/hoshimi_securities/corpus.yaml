  title: NISA（成長投資枠）：手数料と費用
  body: 'Q：国内株式を取引する場合の手数料はいくらですか？

    A：国内株式の手数料は0円です。業界最安水準の低コスト戦略により、お客様の投資効率を最大限に高めています。


    Q：その他の費用はかかりますか？

    A：原則として取引手数料は抑えておりますが、サービスの安定性とセキュリティ維持に必要な最小限の運営費用のみ設定しております。'
