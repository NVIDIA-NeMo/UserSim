- id: ca5e2258-ce64-5083-b52d-63db7d61fae3
  title: NISA（つみたて投資枠）：解約・変更・プランの切替え
  body: '積立金額の変更や、積立の中止（解約）をご希望の手順は以下の通りです。


    1. 積立設定の変更内容を弊社へお伝えください（金額の変更、または積立の停止）。

    2. 資産状態を変化させる操作となるため、多要素認証による本人確認を実施します。画面の指示に従い認証を完了させてください。

    3. 弊社にて変更内容を反映し、完了した旨を通知いたします。


    なお、保有している商品をすべて売却して口座を完全に解約される場合は、別途手続きが必要です。売却後の非課税枠の再利用については、「NISA（つみたて投資枠）：非課税保有限度額について」をご参照ください。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: d6c8b7d7-f6fb-53e0-8869-0cdcb4a5ad42
  title: NISA（つみたて投資枠）：想定外の手数料・金額
  body: '「想定していた金額と異なる」または「身に覚えのない費用がある」と感じられた場合は、以下の点をご確認ください。


    【確認事項】

    1. 信託報酬の確認：星見証券の取引手数料は低コストですが、投資信託自体に設定されている運用管理費用（信託報酬）は、純資産総額から日々差し引かれます。

    2. 積立金額の端数：設定金額と実際の約定金額にわずかな差が生じることがあります。


    上記を確認しても解決しない場合は、弊社コンプライアンス担当者が詳細を調査いたします。調査結果に基づき、社内規定のタイムラインに沿ってご報告いたします。'
