  title: iDeCo（個人型確定拠出年金）：ご利用開始までの手順
  body: 'お客様がiDeCo（個人型確定拠出年金）の利用を開始するまでの標準的なフローは以下の通りです。


    1. お申込みの受付：お客様から加入希望の意思を確認し、手続きを開始します。

    2. 本人確認と届出：口座開設時に必須となるマイナンバーの届出および厳格な本人確認プロセスを実施します。

    3. 初期費用の発生：加入にあたり、加入者立替金として2,829円の手数料が発生することを案内します。

    4. 口座開設完了：審査および国民年金基金連合会等の手続きを経て、運用可能な状態となります。


    当社の運営管理機関手数料は0円で、低コストでの資産形成が可能です。なお、国民年金基金連合会などの手数料として、2026年12月分から毎月186円がかかります。'
