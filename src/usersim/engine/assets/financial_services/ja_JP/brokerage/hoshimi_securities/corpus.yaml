- id: aed44c8a-be8d-5840-969a-c989050ae059
  title: NISA（成長投資枠）：状況・履歴の確認
  body: 'NISA（成長投資枠）の利用状況および取引履歴を確認する手順は以下の通りです。


    1. 当社サポートへ、現在の保有資産および本年の投資枠の利用状況の照会を依頼してください。

    2. 当社より、現在の評価額と、年間投資枠2,400,000円に対して利用済みの金額を回答いたします。

    3. 過去の取引履歴について詳細が必要な場合は、その旨をお伝えください。約定日、銘柄、数量、金額を記載した履歴を提供いたします。

    4. 生涯で利用可能な非課税保有限度額12,000,000円に対する、現在の累計利用額を確認し、今後の投資計画に役立ててください。'
