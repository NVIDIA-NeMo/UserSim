  institution_id: hoshimi_securities
- id: 8bf6cc46-5832-57be-b235-75df63e992f3
  title: iDeCo（個人型確定拠出年金）：商品概要
  body: 'iDeCo（個人型確定拠出年金）は、ご自身で掛金を拠出し、運用した資産を原則60歳まで非課税で準備する老後資金形成制度です。掛金全額が所得控除の対象となるため、高い節税効果を得ながら資産形成が可能です。


    【拠出限度額（月額）】

    ・会社員の方：62,000円

    ・自営業の方：75,000円

    ※最低拠出金額は月額5,000円からとなっております。


    【費用体系】

    ・加入時手数料：2,829円

    ・月額手数料（2026年12月分から）：186円

    ・口座管理手数料（当社負担分）：0円


    長期的な資産最大化を目指すため、低コストな運用環境を提供いたします。運用商品は、個々のリスク許容度に合わせてお選びいただけます。詳細なリスクについては、「iDeCo（個人型確定拠出年金）：重要事項のご説明」をご確認ください。'
