  title: NISA（つみたて投資枠）：この商品をかたる詐欺にご注意ください
  body: '星見証券のNISA（つみたて投資枠）をかたり、「必ず利益が出る」「元本を保証して高配当を実現する」といった勧誘を行う詐欺が発生しています。当社のサービスは、金融庁の監督下で運用されており、相場変動による元本割れのリスクがあるため、いかなる場合も元本を保証する案内はいたしません。


    また、当社がメールやチャットで、パスワードや多要素認証のコードを直接伺うことはございません。不審な連絡を受けた際は、決してリンクをクリックせず、直ちにご相談ください。万一、不正利用の疑いがある場合は、社内規定に基づき速やかに口座を凍結し、調査を開始いたします。'
