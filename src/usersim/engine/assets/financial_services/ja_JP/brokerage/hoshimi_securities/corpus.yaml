- id: f1ca1eec-becb-5ea9-b7a8-52359e5b12c8
  title: NISA（成長投資枠）：解約・変更・プランの切替え
  body: 'NISA（成長投資枠）の解約または他社への変更手続きは、以下の手順で進めてください。


    1. 手続きの依頼：解約または変更を希望する旨と、口座番号を弊社にお伝えください。

    2. 資産状況の確認：現在の保有資産が非課税保有限度額（12,000,000円）の範囲内であることを弊社が確認し、手続き上の注意点をご案内します。

    3. 本人確認：多要素認証による本人確認を実施します。

    4. 完了通知：手続きが完了次第、弊社より確定通知をいたします。


    なお、成長投資枠からつみたて投資枠への直接的な「プラン切替え」という概念はございません。それぞれの枠を併用して運用いただく形となります。'
