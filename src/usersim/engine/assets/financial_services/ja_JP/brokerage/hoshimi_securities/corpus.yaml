- id: 56f2c6e8-18a8-5341-a048-62f4d1e349c1
  title: NISA（成長投資枠）：規定・約款
  body: '本規定は、NISA（成長投資枠）の運用に関する合意事項を定めたものです。顧客は、口座開設時にマイナンバー届出を行う義務を負い、適切に本人確認を完了させる必要があります。


    1. 投資限度額：年間の投資枠は2,400,000円、非課税保有限度額（生涯投資枠）は12,000,000円までとします。これらを超過する注文は、制度上の制限により受け付けられません。

    2. 手数料：国内株式の取引手数料は0円として提供されます。

    3. 資産管理：顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による元本割れは補償対象外となります。

    4. 終了：口座の解約または制度の変更がある場合、速やかに弊社へ届け出てください。'
