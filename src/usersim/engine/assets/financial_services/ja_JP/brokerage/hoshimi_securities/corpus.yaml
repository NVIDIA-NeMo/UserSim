- id: e925ff24-3ec0-5cb5-8474-2f5544e4e55a
  title: NISA（つみたて投資枠）：商品概要
  body: 'NISA（つみたて投資枠）は、少額から無理なく、長期的な資産形成を目指すための非課税制度です。金融庁が認めた低コストの投資信託を対象に、積立投資を行うことで、運用益に税金がかからないメリットを享受できます。


    【投資限度額】

    ・年間投資枠：1,200,000円

    ・非課税保有限度額（生涯限度額）：18,000,000円


    【お取引条件】

    ・最低積立金額：100円から


    星見証券では、業界最安水準の低コスト戦略に基づき、お客さまの資産最大化を支援します。詳細なリスクについては、「NISA（つみたて投資枠）：重要事項のご説明」をご参照ください。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 08baa63b-2538-5334-a90e-e614149313b0
  title: NISA（つみたて投資枠）：年間投資枠について
  body: 'Q：NISA（つみたて投資枠）で1年間に投資できる金額はいくらまでですか？

    A：年間投資枠は1,200,000円です。この枠内での運用益は非課税となります。


    Q：年間の枠を使い切った場合はどうなりますか？

    A：その年はそれ以上の買い付けができません。翌年1月1日に再び1,200,000円の枠が設定されます。詳細は「NISA（つみたて投資枠）：商品概要」をご確認ください。'
  domain: brokerage_investing
