- id: 96e0d760-305c-5f79-92a7-a3c5d85cffd6
  title: 特定口座（源泉徴収あり）：ほかの選択肢との比較と向かない場合
  body: '本口座を、一般口座やNISA等の他の選択肢と比較した際の特徴をご説明します。


    【一般口座との比較】

    一般口座ではお客様ご自身で取引記録を管理し、確定申告を行う必要があります。一方、特定口座（源泉徴収あり）では、弊社が20.315%の税率で源泉徴収を行うため、原則として確定申告が不要という高い利便性を提供します。


    【向かないケース】

    ・NISAの非課税枠内で十分な運用ができる方：税金が0円となるNISAを優先されることを推奨します。

    ・ご自身で詳細な税務申告を行い、他の所得と合算して税率を最適化したい方：源泉徴収なしの口座設定が向いている場合があります。


    なお、本口座でも国内株式手数料は0円であり、コスト面でのメリットは維持されます。'
