  title: iDeCo（個人型確定拠出年金）：不正利用からお客さまを守るために
  body: 'iDeCo（個人型確定拠出年金）の資産を守るため、星見証券では厳格なセキュリティ体制を運用しています。特に、年金資産の受取口座や掛金額の変更など、資産の状態を変化させる操作の前には、必ず多要素認証による本人確認を実施いたします。


    昨今、金融機関をかたる不審なメールやSMSにより、ログイン情報を盗み取ろうとするフィッシング詐欺が報告されています。弊社がメールやチャットで、お客様のパスワードや暗証番号を直接お伺いすることはございません。万が一、不審な連絡を受け取られた場合や、身に覚えのない操作通知が届いた場合は、直ちに弊社までご連絡ください。迅速に口座を凍結し、社内規定に基づいた調査と報告を行います。'
