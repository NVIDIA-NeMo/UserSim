  title: 投資信託の積立：解約・変更・プランの切替え
  body: '積立内容の変更や解約をご希望の場合は、以下の手順で手続きを行ってください。


    1. 変更または解約したい積立プランを当社スタッフに伝えます。

    2. 変更後の積立金額（最低100円、クレジットカード積立の場合は上限100,000円まで）または解約の旨を伝えます。

    3. 資産の状態を変化させる操作となるため、多要素認証による本人確認を実施します。画面または通知に従い認証を完了させてください。

    4. 当社にて手続きを完了し、変更内容または解約完了の旨を回答いたします。


    設定変更が適用されるタイミングは、次回積立予定日に準じます。手続き完了後、口座状況の画面にて最新の設定内容をご確認ください。'
