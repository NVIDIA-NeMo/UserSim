- id: 62bc37e4-3500-527d-9388-bd106bca9e24
  title: deposit_funds を使う場面
  body: '顧客から提携金融機関の口座から証券総合口座へ即時入金を希望された場合に、本ツールを使用します。


    【手続き手順】

    1. 本人確認（identity verification）を完了させます。

    2. `get_accounts` を使用し、顧客が提示した口座番号の下4桁などから正確な account_id を特定します。

    3. 顧客から入金希望金額（例：10,000円）を確認します。

    4. `deposit_funds` を呼び出し、特定した account_id と金額を指定して入金処理を完了させます。


    入金後は速やかに、残高が正しく反映されたことを顧客に伝えてください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: hoshimi_securities
- id: 3dea2034-b43c-5ab3-9b1b-fd334583c5e2
  title: deposit_funds ツールリファレンス
  body: '本ツールは、提携金融機関の口座から証券総合口座へ即時入金を行うために使用します。オペレーターが直接 `deposit_funds` を呼び出すことで処理が実行されます。


    【引数】

    ・account_id：入金先となる証券総合口座の識別子

    ・amount：入金額（円）


    【効果】

    指定された金額が、提携銀行口座から星見証券の証券総合口座へ即時に振り替えられます。'
