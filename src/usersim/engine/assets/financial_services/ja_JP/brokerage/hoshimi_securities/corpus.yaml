  title: get_accounts を使う場面
  body: '顧客の口座情報を特定したり、保有している口座の一覧およびその状態（account_idなど）を確認したりする場合に使用します。他の多くのツールで必要となる
    account_id を取得するための基盤となる操作です。


    【手続き手順】

    1. 本人確認（identity verification）を完了させます。

    2. 顧客から提供された口座番号の下4桁、または登録氏名などの情報を確認します。

    3. `get_accounts` を呼び出し、確認した情報を引数に指定して、システムから該当する口座情報を取得します。

    4. 取得した結果から、操作対象となる正確な account_id を特定します。


    特定した account_id は、その後の入出金や設定変更などのツール呼び出しに正確に使用してください。'
