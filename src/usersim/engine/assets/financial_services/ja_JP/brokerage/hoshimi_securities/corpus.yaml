- id: 77567135-5b38-546f-b151-c29633cb0cca
  title: NISA（成長投資枠）：プランの選び方
  body: 'NISAの2つの枠について、選び方のポイントを解説します。


    【NISA（成長投資枠）】

    ・年間投資枠：2,400,000円

    ・特徴：個別株や多様な投資信託に柔軟に投資可能。国内株式は手数料0円。

    ・向いている方：特定の銘柄を選んで能動的に資産を増やしたい方、成長性の高い資産を組み入れたい方。


    【NISA（つみたて投資枠）】

    ・年間投資枠：1,200,000円

    ・特徴：長期・積立・分散投資に特化した投資信託のみを対象とする。

    ・向いている方：時間をかけてコツコツと安定的に資産形成を行いたい方。


    ※両枠の併用が可能です。リスク許容度に合わせて組み合わせをご検討ください。'
