- id: 9ba4217c-7343-59d1-b78a-955bd2385b77
  title: open_nisa_account を使う場面
  body: '新たに NISA 口座の開設を希望されるお客様に対し `open_nisa_account` を使用します。


    1. `verify_identity` を行い、口座開設に必要なマイナンバー届出が完了しているか確認します。

    2. つみたて投資枠および成長投資枠の制度概要について説明し、同意を得ます。

    3. `open_nisa_account` を呼び出して、開設手続きを申し込みます。


    手続き完了後、税務署での確認を経て利用可能となります。なお、既に他社で NISA 口座を保有している場合は、金融機関変更の手続きが必要となるため、`change_nisa_provider`
    の利用を案内してください。'
  domain: brokerage_investing
