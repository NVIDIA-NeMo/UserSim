- id: 63936980-9ded-5337-97ea-51b6a94b1593
  title: 投資信託の積立：この商品をかたる詐欺にご注意ください
  body: '星見証券の「投資信託の積立」サービスをかたる巧妙な詐欺にご注意ください。特に、SNSやメールを通じて「元本保証で高利回りの積立プランがある」として、弊社以外の外部口座への送金を促す手口が報告されています。


    弊社が、メールやSMSでパスワードや多要素認証のコードを直接伺うことは決してございません。また、投資信託は相場変動により元本を割り込むリスクがあるため、「絶対的に儲かる」という勧誘は虚偽です。


    もし、不審な連絡を受けたり、身に覚えのない口座操作が行われた疑いがある場合は、直ちに弊社サポートまでご連絡ください。状況を確認し、社内規定に基づき速やかに口座を凍結して被害の拡大を防ぎます。'
