- id: c20a7f7d-7e92-5388-a9b8-e36e3aaead02
  title: 特定口座（源泉徴収あり）：不正利用からお客さまを守るために
  body: '星見証券では、お客さまの貴重な資産を不正利用から守るため、厳格なセキュリティ体制を構築しています。特定口座（源泉徴収あり）のご利用にあたり、口座開設時のマイナンバー届出を必須とし、徹底した本人確認を行っております。


    特に、出金手続きや口座情報の変更など、資産の状態に影響を与える操作の前には、必ず多要素認証による本人確認を実施します。これにより、第三者によるなりすましや不正な資金移動を未然に防ぎます。万一、身に覚えのない通知や不審な操作にお気づきの際は、直ちにご連絡ください。迅速に口座を凍結し、社内規定に基づいた調査と報告を行います。安心してお取引いただける環境を提供し、長期的な資産形成をサポートいたします。'
