- id: b8b6fa02-9fef-5b2b-acab-a91ac435cb2b
  title: iDeCo（個人型確定拠出年金）：お申込みとご利用開始
  body: 'iDeCo（個人型確定拠出年金）のご利用開始までの手順をご案内いたします。


    1. 必要書類の提示：マイナンバーカードおよび本人確認書類をご提示ください。厳格な本人確認プロセスを実施いたします。

    2. 掛金の設定：月々の拠出金額を決定します。最低金額は5,000円からとなります。会社員の方は最大62,000円、自営業の方は最大75,000円まで設定可能です。

    3. 運用商品の選択：ご自身の投資目的に合わせ、提供商品の中から運用先を選択します。

    4. 加入手続きの完了：国民年金基金連合会等の審査を経て、口座開設が完了します。この際、加入時手数料として2,829円が発生いたします。


    手続き完了後、ご指定の口座から毎月の掛金拠出が開始されます。運用状況は定期的にご報告いたします。'
