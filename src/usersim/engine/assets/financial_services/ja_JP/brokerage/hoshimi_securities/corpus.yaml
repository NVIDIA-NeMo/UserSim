- id: 04dff538-d404-5eca-a3cd-291c88d945aa
  title: 特定口座（源泉徴収あり）：規定・約款
  body: '本口座は、法令に基づき証券会社が顧客に代わって所得税および住民税を計算し、源泉徴収を行う口座です。適用される税率は20.315%とし、配当金や譲渡益から自動的に差し引かれます。


    国内株式の取引手数料については、顧客の投資効率を最大化するため0円として運用します。また、運用過程で損失が発生し、確定申告を行うことで損失の繰越控除を適用する場合、その期間は最大3年までと定めています。本規定は、金融庁および日本証券業協会の監督下で策定されており、適合性の原則を遵守し、顧客の最善の利益を追求します。規定の変更がある場合は、事前にデジタルチャネルを通じて通知し、承諾を得る手続きを行います。'
