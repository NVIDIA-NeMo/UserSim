- id: 44d8172b-5b0f-519b-9003-19383fdc1cb0
  title: change_nisa_provider を使う場面
  body: '他の金融機関で NISA 口座を保有しており、星見証券へ移管（金融機関変更）したい場合に `change_nisa_provider` を使用します。


    1. `verify_identity` を完了させ、本人確認を行います。

    2. 現在の NISA 口座の利用状況を確認します。

    3. `change_nisa_provider` を呼び出し、金融機関変更の手続きを開始します。


    注意点として、その年に既に NISA 口座で買付けを行っている場合は、翌年分からの変更となることをお客様に明確に説明してください。手続きの詳細は `open_nisa_account
    を使う場面` でも参照いただけます。'
