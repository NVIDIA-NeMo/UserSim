- id: fc65db7f-f341-5f0f-9820-78f9d64c8a49
  title: 投資信託の積立：登録内容の変更
  body: '「投資信託の積立」の金額や決済カードを変更する手順は以下の通りです。


    1. 変更したい積立設定の銘柄名と、変更後の希望内容（金額またはカード情報）を伝えてください。

    2. 資産状態を変化させる操作となるため、画面の指示に従い多要素認証による本人確認を行ってください。

    3. 積立金額を変更する場合、最低100円以上の金額を指定してください。また、クレジットカード積立を利用される場合は、月間上限の100,000円を超えない範囲で設定してください。

    4. 変更内容を確認し、確定させてください。


    手続き完了後、変更内容を記載した確認通知が届きますので、内容に誤りがないかご確認ください。'
