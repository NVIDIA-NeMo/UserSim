  body: 'iDeCo（個人型確定拠出年金）の運用状況や拠出履歴を確認する手順は以下の通りです。


    1. 資産残高および拠出履歴の照会をリクエストしてください。

    2. 当社より、最新の運用報告書または資産明細書を提示いたします。こちらで現在の評価額と累計拠出額をご確認いただけます。

    3. 運用商品ごとの損益状況を確認し、現在の資産配分がご自身の投資方針に合致しているか検討してください。


