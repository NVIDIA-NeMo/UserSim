  body: '星見証券では、お客さまのの大切な資産を守るため、厳格なセキュリティ体制を運用しています。「投資信託の積立」における資産状況の変更や出金などの操作前には、必ず多要素認証による本人確認を実施し、第三者による不正操作を防止しています。


    また、口座開設時にはマイナンバー届出を必須とし、厳格な本人確認プロセスを導入しております。当社スタッフが、認証コードやパスワード、暗証番号を直接お伺いすることはございません。万が一、不審な連絡があった場合や、身に覚えのない取引履歴を確認された場合は、直ちに当社のサポート窓口へご連絡ください。不正利用の疑いがある場合は、社内規定に基づき速やかに口座を凍結し、詳細な調査と報告を行います。'
