  title: NISA（つみたて投資枠）：状況・履歴の確認
  body: '現在の積立状況および投資履歴を確認する手順は以下の通りです。


    1. ご本人様確認のため、口座番号と認証コードをご提示ください。

    2. 弊社にて現在の「非課税保有限度額」の利用状況と、本年の「年間投資枠（1,200,000円）」の消化額を照会します。

    3. これまでに行われた積立の回数、金額、および現在の評価額を明細として提示いたします。

    4. 必要に応じて、過去の約定履歴をPDF形式で発行し、ご案内いたします。


    上記の手順により、ご自身の資産形成の進捗を正確に把握いただけます。'
