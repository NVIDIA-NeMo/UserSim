  body: '【継続利用特典のご案内】

    2025年1月1日から2025年12月31日まで、NISA（成長投資枠）を継続してご利用いただいているお客さまへ、国内株式の売買手数料0円の適用を継続して提供いたします。低コストな環境で、効率的な資産形成をぜひご活用ください。'
