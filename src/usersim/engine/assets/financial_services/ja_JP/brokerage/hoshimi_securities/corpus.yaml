    ・元本保証を希望される方：相場変動による元本割れは補償されません。

    ・完全な自動積立を希望される方：個別株の売買は都度のご判断が必要です。定額での自動投資を希望される場合は「投資信託の積立」をご検討ください。

    ・税務申告の手間を避けたい方：特定口座（源泉徴収あり）をご利用いただくことで、原則として確定申告が不要になります。


