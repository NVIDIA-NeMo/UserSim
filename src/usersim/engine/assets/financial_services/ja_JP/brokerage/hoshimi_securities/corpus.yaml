  title: NISA（つみたて投資枠）：未成年者の年間投資枠（2027年1月から）について
  body: 'Q：2027年1月から未成年者の年間投資枠はどのように変わりますか？


    A：2027年1月より、未成年の方の年間投資枠は600,000円に設定されます。これにより、若年層の方々がより計画的に資産形成を始められる環境を整備いたします。詳細な適用条件については、担当者までお問い合わせください。'
