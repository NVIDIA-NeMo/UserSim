- id: da36020a-8a7c-5a74-86cb-17c9d8a58da8
  title: NISA（つみたて投資枠）：不正利用からお客さまを守るために
  body: '星見証券では、大切なお資産を守るため厳格なセキュリティ体制を構築しています。NISA（つみたて投資枠）のご利用にあたり、口座開設時のマイナンバー届出を必須とした厳格な本人確認プロセスを導入しております。


    特に、出金操作や口座情報の変更など、資産の状態を変化させる重要な操作の前には、必ず多要素認証による本人確認を実施いたします。弊社から、認証コードを電話で聞き出したり、パスワードの直接入力を求めるメールをお送りすることはありません。万一、不審な連絡があった場合は、直ちに弊社へお知らせください。迅速に口座凍結などの保護措置を講じ、社内規定に基づいた調査を行います。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: d5965c98-ff8d-5af4-bf47-9d4f296bc84b
  title: NISA（つみたて投資枠）：規定・約款
  body: '本制度における投資限度額は、年間投資枠が1,200,000円、非課税保有限度額（生涯限度額）が18,000,000円までと規定されています。これらの限度額は、商品の取得価額に基づき管理されます。


    顧客資産は法令に基づき分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による元本割れは補償対象外となります。また、弊社は適合性の原則を遵守し、顧客の最善の利益を追求します。本約款の内容に変更が生じる場合は、事前にデジタルチャネルを通じて通知し、同意を求める手続きを行います。'
