  body: 'Q：国内株式を取引する際の手数料はいくらですか？


    A：星見証券では、お客様の長期的な資産形成を支援するため、国内株式の売買手数料を0円としております。低コストな取引環境により、投資効率の最大化を実現いただけます。'
