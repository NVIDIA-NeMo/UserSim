- id: 9a42bde9-dec0-5656-9d07-fe251a3a58aa
  title: NISA（つみたて投資枠）：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、「保留中」のままとなっている場合は、以下の点をご確認ください。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：マイナンバーカードの画像が不鮮明である、または住所変更後の届出がなされていない可能性があります。

    2. 多要素認証の未完了：資産操作前の本人確認ステップが完了していない場合がございます。


    【解決策】

    不足している書類の再提出、または認証操作を再度お試しください。解決しない場合は、弊社コンプライアンス担当者が審査状況を確認し、個別に通知いたします。通常、営業日ベースで数日以内に結果をご報告いたします。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 77323122-9676-543b-8c72-0bf6f16d626d
  title: NISA（つみたて投資枠）：お申込みいただける方
  body: '【お申込み条件】

    ・日本国内に住所を有する個人の方

    ・マイナンバーの届出が完了している方


    【年齢区分による限度額の違い】

    ・成人：年間投資枠 1,200,000円 / 非課税保有限度額 18,000,000円

    ・未成年（2027年1月より適用）：年間投資枠 600,000円 / 非課税保有限度額 6,000,000円


    ※未成年の方の2027年以前の枠については、法令に基づき別途案内いたします。'
