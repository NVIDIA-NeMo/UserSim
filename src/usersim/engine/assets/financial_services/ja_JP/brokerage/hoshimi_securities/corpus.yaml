  title: NISA（つみたて投資枠）：規定・約款の変更
  body: 当社の規定および約款は、法令の改正やサービス向上に伴い変更される場合がございます。変更の際は、あらかじめWebサイトまたはメールにて通知いたします。特に、年間投資枠の1,200,000円という上限設定や、非課税保有限度額の運用ルールは、税制改正により変動する可能性があります。他社サービスと比較検討される際は、最新の約款をご確認ください。星見証券は、常に透明性の高い手数料体系を維持し、お客さまの利益を最優先に運営いたします。
