  title: 米国株式の取引：想定外の手数料・金額
  body: 'お客さまより「取引明細の手数料が想定と異なる」との問い合わせを受けた際は、以下の順で確認を行ってください。


    1. 取引手数料の計算確認：約定代金に0.495%を乗じた金額が適用されているか。また、上限の22 USDが正しく適用されているかを確認します。

    2. 為替手数料の確認：米ドルへの交換時、または日本円への戻し時に、1米ドルあたり25銭の為替手数料が加算されているかを確認します。


    【対処法】

    計算間違いや表示上の不備が判明した場合は、速やかに修正し、お客さまへ謝罪と説明を行います。もし計算根拠に納得いただけず、苦情としてエスカレーションが必要な場合は、専任のコンプライアンス担当者へ回付し、誠実かつ迅速に調査結果を報告します。解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）をご案内してください。'
