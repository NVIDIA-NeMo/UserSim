  title: get_positions ツールリファレンス
  body: '`get_positions`

    引数: account_id（文字列）

    効果: 指定された口座の保有資産（ポジション）の一覧を取得します。

    エージェントは、`get_accounts` 等で特定した口座IDを直接指定してこのツールを呼び出し、お客様の保有状況を確認します。'
