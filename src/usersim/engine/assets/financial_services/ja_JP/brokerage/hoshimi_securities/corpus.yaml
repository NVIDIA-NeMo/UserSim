  institution_id: hoshimi_securities
- id: 432ec43b-05e1-5a66-9777-099c5e6d0ac6
  title: 特定口座（源泉徴収あり）：切替えや上位プランを検討するとき
  body: '非課税制度であるNISA（つみたて投資枠・成長投資枠）への切替えを検討される場合、最大の相違点は「課税の有無」です。特定口座（源泉徴収あり）では20.315%の税金がかかりますが、NISAでは非課税で運用可能です。


    一方、投資額がNISAの年間投資枠を超える場合や、より柔軟な資産運用を希望される場合は、本口座が適しています。お客様の資産状況に合わせ、使い分けをご提案いたします。'
