- id: a6a70287-d9b7-58af-8b9d-dea036489e83
  title: withdraw_funds を使う場面
  body: '顧客が証券総合口座の預り金を、登録済みの銀行口座へ出金することを希望した場合に使用します。資産の状態を変化させる操作であるため、厳格な認証が必要です。


    【手続き手順】

    1. 本人確認を完了させます。

    2. 多要素認証による追加の本人確認を実施し、正当な権限があることを確認します。

    3. `get_accounts` を使用して、出金元となる account_id を特定します。

    4. 出金希望金額（例：50,000円）を確認します。

    5. `withdraw_funds` を呼び出し、account_id と金額を指定して出金処理を実行します。


    出金先はあらかじめ登録された銀行口座に限定されます。出金先の変更が必要な場合は、別途変更手続きをご案内ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: hoshimi_securities
- id: a74df7f8-f9d2-5867-9585-e08749ea55bd
  title: withdraw_funds ツールリファレンス
  body: '本ツールは、証券総合口座の預り金を登録済みの銀行口座へ出金するために使用します。オペレーターが直接 `withdraw_funds` を呼び出すことで処理が実行されます。


    【引数】

    ・account_id：出金元となる証券総合口座の識別子

    ・amount：出金額（円）


    【効果】

    指定された金額が、証券総合口座から登録済みの出金先銀行口座へ送金されます。この操作は不可逆的な処理となります。'
  domain: brokerage_investing
