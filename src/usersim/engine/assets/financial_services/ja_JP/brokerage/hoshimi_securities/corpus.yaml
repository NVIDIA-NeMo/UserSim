- id: 9f0dc2aa-4881-51d1-8341-282fde51c51d
  title: NISA（つみたて投資枠）：お取引が拒否された・制限された
  body: '積立設定や買い付け時に取引が拒否される場合、以下の原因が考えられます。


    ・年間投資枠の超過：本年の利用額が1,200,000円に達している場合、追加の買い付けは制限されます。

    ・生涯投資枠の不足：非課税保有限度額（18,000,000円）を使い切っている場合、新たな投資はできません。

    ・本人確認の不備：多要素認証が正常に完了していない場合、資産状態を変化させる操作は拒否されます。

    ・口座の凍結：不正利用の疑いがある場合、セキュリティ保護のため一時的に制限がかかります。


    制限の解除には、最新の本人確認書類の再提示や、認証情報の更新が必要です。弊社にて状況を確認し、適切にエスカレーションいたします。'
