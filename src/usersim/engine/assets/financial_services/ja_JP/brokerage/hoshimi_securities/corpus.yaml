- id: d0297fb3-3e65-59dc-9226-55abf252f6a0
  title: NISA（成長投資枠）：想定外の手数料・金額
  body: '【症状】お客様より「国内株式を取引したはずなのに、手数料が発生している」との申し出があった場合。


    【確認事項】

    1. 取引銘柄が国内株式であるかを確認してください。NISA（成長投資枠）での国内株式手数料は0円です。

    2. 取引が「特定口座」や「一般口座」で行われていないか確認してください。国内株式の売買手数料はNISA口座以外でも0円ですが、特定口座（源泉徴収あり）では売却益から20.315%の税金が差し引かれるため、手数料と誤解される場合があります。


    【解決策】

    口座指定の誤りであった場合は、今後の取引時にNISA口座を選択いただくようご案内してください。


    【エスカレーション】

    システム不具合の疑いがある場合や、正当なNISA取引であるにもかかわらず課金されている場合は、直ちに専任のコンプライアンス担当者へエスカレーションし、調査を依頼してください。'
