- id: 869ab2ee-3b23-511b-9cdc-47235817393b
  title: NISA（成長投資枠）：お手続きが完了しない・保留中のまま
  body: '【症状】

    NISA（成長投資枠）の開設手続きが「保留中」のまま進まない、または完了通知が届かない。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：提出されたマイナンバー届出書類に不備があるか、画像が不鮮明な可能性があります。

    2. 多要素認証の未完了：セキュリティ設定が完了していないため、最終的な口座有効化が止まっている可能性があります。


    【解決策】

    ・書類の再提出が必要な場合は、当方より個別に案内いたしますので、指示に従い再アップロードをお願いします。

    ・多要素認証の設定状況を改めてご確認ください。


    【エスカレーション】

    上記を確認しても解決しない場合は、専任のコンプライアンス担当者が審査状況を詳細に調査し、結果を報告いたします。'
