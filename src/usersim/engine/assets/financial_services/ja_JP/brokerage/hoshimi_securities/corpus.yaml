- id: 4788061c-23ab-5558-be6d-e6768d8e50f6
  title: NISA（成長投資枠）：ログインできない・アクセスできない
  body: '【症状】

    ログインを試みるとエラーが表示される、またはログイン後のNISA（成長投資枠）の管理画面にアクセスできない。


    【考えられる原因と対処法】

    1. 認証情報の誤入力

    IDまたはパスワードが正しくない可能性があります。大文字・小文字の区別に注意して再入力してください。


    2. 多要素認証の不整合

    認証デバイスの変更等により、認証コードが届かない、または不一致となっている場合があります。この場合は、ご本人様確認書類を提示いただき、認証設定のリセットを行います。


    3. 口座の凍結

    不正利用の疑いがある場合、社内規定に基づき直ちに口座を凍結しております。心当たりがない場合は、至急当社までご連絡ください。


    【解決しない場合】

    上記を確認しても解決しない場合は、専任のコンプライアンス担当者へエスカレーションし、内部調査を行います。調査結果は社内規定のタイムラインに基づき報告いたします。'
