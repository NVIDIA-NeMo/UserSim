  title: NISA（つみたて投資枠）：登録内容の変更
  body: 'ご登録内容（住所、連絡先、振替口座など）を変更する手順は以下の通りです。


    1. 変更内容の提示：変更したい項目と新しい情報を当社にお伝えください。

    2. 本人確認の実施：資産に関わる重要な変更となるため、多要素認証による本人確認を行います。画面の指示に従い認証を完了させてください。

    3. 変更内容の確認：当社から変更内容の最終確認を行い、お客さまに承諾いただきます。

    4. 完了通知：手続き完了後、変更内容が反映されたことを通知いたします。


    手続きに不備がある場合は、改めて追加書類の提出をお願いすることがあります。'
