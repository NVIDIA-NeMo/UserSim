  title: iDeCo（個人型確定拠出年金）：当社の似た商品との比較
  body: 'iDeCo（個人型確定拠出年金）と「NISA（つみたて投資枠）：商品概要」を比較します。


    【iDeCo】

    ・メリット：掛金全額が所得控除対象となり、節税効果が非常に高い。

    ・制約：原則60歳まで資産を引き出せないロック期間がある。

    【NISA（つみたて投資枠）】

    ・メリット：いつでも売却・出金が可能で、柔軟性が高い。

    ・制約：所得控除のメリットはない。


    節税を優先し老後資金を確実に準備したい方はiDeCo、中期的な資金使途への柔軟性を求める方はNISAが適しています。'
