  title: NISA（成長投資枠）：商品概要
  body: 'NISA（成長投資枠）は、上場株式や投資信託など幅広い商品に柔軟に投資し、運用益を非課税で享受できる制度です。星見証券では、個人投資家の皆様の長期的な資産最大化を支援するため、業界最安水準のコスト環境を提供しています。


    【主な仕様と限度額】

    ・年間投資枠：2,400,000円

    ・非課税保有限度額（生涯限度額）：12,000,000円

    ・国内株式取引手数料：0円


    本制度を利用することで、通常20.315%かかる税金が免除され、効率的な資産形成が可能です。あわせて「NISA（つみたて投資枠）」をご利用いただくことで、より盤石なポートフォリオを構築いただけます。'
