- id: d1c48e3a-08fa-5d58-83ab-a41f1b0cfbb9
  title: NISA（成長投資枠）：明細や記録と合わない
  body: '【症状】取引明細の金額や、利用済みの投資枠の記録が自身の計算と合わない。


    【確認事項】

    1. 約定日と受渡日の違い：取引が成立した日（約定日）と、実際に資産が移動した日（受渡日）に乖離があるため、どちらの基準で確認しているか照合してください。

    2. 非課税保有限度額の計算：生涯限度額12,000,000円の計算は、取得価額ベースで行われます。現在の時価ではなく、購入時の金額で計算されているか確認してください。


    【解決策】

    上記を確認しても不整合がある場合は、当社へ詳細をお知らせください。内部調査を行い、正しい記録を再提示いたします。'
