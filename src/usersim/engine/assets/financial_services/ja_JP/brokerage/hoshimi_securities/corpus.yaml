- id: b1d0e982-82da-5c7f-9cfb-06d5c9c2d5cf
  title: 特定口座（源泉徴収あり）：よくあるお手続きの流れ
  body: '特定口座（源泉徴収あり）の開設から利用開始までの流れをご案内します。


    1. お申込みと書類提出：口座開設を希望される旨をお伝えいただき、マイナンバーカードなどの本人確認書類をご提示ください。

    2. 本人確認プロセス：弊社にて厳格な審査および本人確認を実施します。不備がある場合は追加資料を依頼させていただきます。

    3. 口座開設の完了通知：審査完了後、口座開設が完了した旨を通知いたします。

    4. 運用開始：入金後、国内株式（手数料0円）などの取引を開始いただけます。


    なお、出金や口座情報の変更など、資産の状態を変化させる操作の前には、必ず多要素認証による本人確認を実施していただきます。'
