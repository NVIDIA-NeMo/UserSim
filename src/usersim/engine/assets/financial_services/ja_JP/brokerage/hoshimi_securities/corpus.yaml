  title: 投資信託の積立：金利・料率の決まり方と適用
  body: '「投資信託の積立」における還元率は以下の通りです。


    ・クレジットカード積立還元率：0.5%


    この還元率は、クレジットカードで積立決済が行われた金額に対して適用されます。設定金額（月額上限100,000円まで）に基づき算出され、所定のタイミングで還元されます。本サービスにおける還元率は一律であり、預金残高や取引実績による変動はありません。'
