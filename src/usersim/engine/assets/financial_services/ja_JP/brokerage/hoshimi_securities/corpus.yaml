- id: d9f52f91-7a51-5b76-9fbe-7adc18b5bf66
  title: 特定口座（源泉徴収あり）：お申込みとご利用開始
  body: '特定口座（源泉徴収あり）の開設手順をご案内します。確定申告の手間を省きたい方や、効率的に資産運用を始めたい方に最適な選択肢です。


    1. 開設希望の旨を弊社にお伝えください。担当者が手続きを開始します。

    2. 本人確認のため、マイナンバーカードなどの必要書類を提示してください。弊社にて厳格な本人確認プロセスを実施いたします。

    3. 出金や口座情報の変更等に備え、多要素認証の設定を完了させてください。

    4. 弊社による審査および口座開設完了の通知をもって、ご利用開始となります。


    口座開設後は、国内株式の手数料0円の環境で、すぐに取引を開始いただけます。NISA口座との併用を検討される場合は、「NISA（成長投資枠）：商品概要」も併せてご参照ください。'
