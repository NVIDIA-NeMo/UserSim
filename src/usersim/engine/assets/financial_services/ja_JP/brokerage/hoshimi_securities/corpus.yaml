- id: 233c6140-f33a-5a4b-828e-2253968e19e8
  title: open_account を使う場面
  body: "星見証券の証券総合口座（特定口座を含む）を新規に開設したい顧客に対して本ツールを使用します。口座開設にはマイナンバーの届出が必須となるため、必ずその旨を案内してください。\n\
    \n【手続き手順】\n1. 顧客から以下の基本情報を収集します。\n   - 氏名（フルネーム）\n   - 生年月日\n   - 連絡先（電話番号、メールアドレス）\n\
    2. 口座開設にあたりマイナンバーの届出が必要であることを説明し、同意を得ます。\n3. 収集した情報を元に `open_account` を呼び出し、口座開設の申し込みを完了させます。"
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
