  title: 米国株式の取引：お手続きが完了しない・保留中のまま
  body: '米国株式取引の有効化手続きが完了せず、保留状態となっている場合は、以下の点をご確認ください。


    【想定される原因と確認事項】

    1. 本人確認書類の不備：マイナンバー届出の内容に不備がある場合、審査が保留となります。提出書類の画像が鮮明であるか、有効期限内であるかをご確認ください。

    2. 多要素認証の未完了：資産状態を変化させる操作の前に必要な認証が完了していない可能性があります。


    【解決策】

    不備がある場合は、改めて正しい書類をご提示ください。認証が届かない場合は、登録メールアドレスや電話番号に誤りがないかをご確認ください。


    【エスカレーション】

    上記を確認しても解決しない場合は、専任のコンプライアンス担当者が詳細な調査を行います。調査結果は社内規定に基づいたタイムラインで速やかにご報告いたします。'
