- id: a830aea5-0fa5-5b19-9607-c5b01a144f9e
  title: NISA（つみたて投資枠）：おすすめの方と主な使い方
  body: 'NISA（つみたて投資枠）は、長期的な視点でコツコツと資産形成を行いたい方に最適です。年間1,200,000円の枠を活用し、非課税で「積立・分散」投資を実現できるため、将来に向けた確かな資産基盤を築けます。


    【主な特徴と使い方】

    ・少額から開始：最低100円から積立設定が可能です。

    ・非課税メリット：運用益に税金がかからないため、効率的に資産を最大化できます。

    ・生涯限度額：最大18,000,000円まで非課税で保有可能です。


    まずは少額から設定し、ライフステージに合わせて積立金額を調整していく方法を推奨しております。詳細な概要は「NISA（つみたて投資枠）：商品概要」をご確認ください。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 57f21170-5c44-558e-bfd6-d55f324e11a0
  title: NISA（つみたて投資枠）：非課税保有限度額について
  body: 'Q：非課税保有限度額とは何ですか？

    A：NISA（つみたて投資枠）を含め、NISA口座全体で非課税で保有できる商品取得価額の合計限度額のことです。最大18,000,000円までとなっております。


    Q：限度額の計算はどうなりますか？

    A：商品の時価ではなく、購入時の「取得価額」で計算されます。商品を売却した場合は、その分の枠が再利用可能です。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: faq
  source_authority: official
