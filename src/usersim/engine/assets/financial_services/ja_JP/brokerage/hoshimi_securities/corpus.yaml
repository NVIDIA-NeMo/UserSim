  body: '特定口座（源泉徴収あり）のお申込み条件は以下の通りです。


    ・日本国内に住所を有し、マイナンバーの届出が可能な方 → お申込みいただけます

    ・マイナンバーの届出が困難な方 → 本口座の開設はできません（一般口座をご検討ください）


