  title: iDeCo（個人型確定拠出年金）：お取引が拒否された・制限された
  body: '【症状】

    掛金の変更や運用商品のスイッチング（買い替え）を依頼したが、手続きが拒否される、または制限されている。


    【考えられる原因】

    ・多要素認証などの本人確認が完了していない。

    ・適合性の原則に基づき、選択された商品がお客様の投資経験や目的に照らして不適当であると判断された。

    ・口座情報の変更手続きが保留中である。


    【解決方法】

    1. まず、多要素認証が正しく完了しているかをご確認ください。

    2. 制限の内容について当社担当者へ詳細を確認してください。


    【エスカレーション】

    本人確認ができているにもかかわらず制限が解除されない場合や、コンプライアンス上の疑義がある場合は、専任のコンプライアンス担当者へエスカレーションし、社内規定に基づいた調査を行います。'
