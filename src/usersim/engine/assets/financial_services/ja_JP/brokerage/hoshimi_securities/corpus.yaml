- id: 8e5f2f5d-352c-5bc5-ad79-928415df851d
  title: NISA（つみたて投資枠）：限度額・制限と注意事項
  body: 'NISA（つみたて投資枠）のご利用における限度額および制限事項は以下の通りです。


    ・年間投資枠：1,200,000円（1年間に投資できる上限額です）

    ・非課税保有限度額（生涯投資枠）：18,000,000円（成長投資枠との合算で管理されます）

    ・最低積立金額：100円から設定可能です


    【注意事項】

    本制度は長期的な資産形成を目的としており、元本保証はありません。相場の変動により、投資金額を下回る（元本割れ）可能性があります。また、非課税保有限度額の管理は、取得価額ベースで行われます。詳細なリスクについては「NISA（つみたて投資枠）：リスクについてのご説明」をご確認ください。'
