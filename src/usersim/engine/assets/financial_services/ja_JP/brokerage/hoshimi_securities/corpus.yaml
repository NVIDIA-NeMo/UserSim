  title: 特定口座（源泉徴収あり）：当社の似た商品との比較
  body: 'NISA口座（つみたて投資枠・成長投資枠）と特定口座（源泉徴収あり）を比較します。


    ・税制：NISAは非課税ですが、特定口座は20.315%の税率で課税されます。

    ・利便性：特定口座は源泉徴収により原則確定申告が不要です。

    ・上限：NISAには非課税保有限度額がありますが、特定口座に金額制限はありません。


    少額から非課税で長期運用したい方は「NISA（つみたて投資枠）：商品概要」を、NISA枠を超えて柔軟に高額投資を行いたい方は特定口座をお選びください。'
