- id: 349423ce-c890-5719-8d84-ad3a189afc2e
  title: 特定口座（源泉徴収あり）：解約・変更・プランの切替え
  body: '特定口座のプラン変更（源泉徴収ありからなしへの変更）または口座解約の手順をご案内します。


    1. 現在の保有資産を確認し、売却または他社への移管が必要か判断します。

    2. 担当者へ「特定口座のプラン変更」または「口座解約」の希望を伝えます。

    3. 多要素認証による本人確認を実施し、申請内容の照合を行います。

    4. 変更または解約の確定通知をデジタルチャネルで受け取ります。


    なお、プランの切り替えは原則として年1回までとなっております。また、解約にあたっては、未決済の注文がないことを確認していただく必要があります。手続き完了後、資産の状態が正しく更新されたことを確認画面にてご確認いただけます。'
