- id: ae03b434-7bca-5d15-9a03-a1de4f2452dc
  title: place_trade を使う場面
  body: '株式や投資信託の売買注文を執行する際に `place_trade` を使用します。


    1. `verify_identity` を行い、厳格な本人確認を完了させます。

    2. `get_accounts` を使用して、取引対象となる口座IDを確定させます。

    3. お客様から売買したい銘柄、数量、注文価格などの詳細を確認します。

    4. 全ての条件が確定した後、`place_trade` を呼び出して注文を執行します。


    資産の状態を変化させる操作であるため、多要素認証による本人確認が必須となります。また、特定の銘柄の推奨は禁じられており、あくまでお客様ご自身の判断に基づく注文のみを承ります。'
  domain: brokerage_investing
