- id: a6e0e9ba-6620-59c8-a5ab-1d9d9f5798db
  title: iDeCo（個人型確定拠出年金）：規定・約款
  body: '本制度の利用にあたり、お客様は加入時に加入手数料として2,829円を支払うものとします。また、2026年12月分より、月額186円の口座管理手数料が発生いたします。掛金の拠出額は月額5,000円以上とし、上限額は加入者の区分（会社員、自営業者等）により異なります。


    星見証券は、顧客資産を分別管理し、適合性の原則に基づき適切な運用を支援します。原則として、積立金は60歳まで引き出すことができないため、中途解約による資産の取り出しは制度上の制限により不可能です。規約の変更および手数料の改定については、事前に告知期間を設けて通知いたします。本契約に関する紛争が解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）へ案内いたします。'
