- id: 421b1e31-a25f-5249-82ba-df14b51158cc
  title: 特定口座（源泉徴収あり）：おすすめの方と主な使い方
  body: '特定口座（源泉徴収あり）は、日々の取引から税金の計算までを自動化したい方に最適な口座です。最大のメリットは、原則として確定申告が不要になる利便性にあります。20.315%の税率で源泉徴収が行われるため、ご自身で複雑な計算を行う手間が省けます。


    【おすすめの方】

    ・確定申告の手間を省き、スムーズに資産運用を行いたい方

    ・低コストな環境で国内株式の取引を積極的に行いたい方（国内株式手数料は0円です）


    【主な使い方】

    口座開設時に本プランを選択していただき、通常通り銘柄の売買を行ってください。利益が出た際は自動的に課税され、損失が出た場合は口座内で自動的に損益通算が行われます。より効率的な非課税運用をご検討の方は、「NISA（成長投資枠）：商品概要」も併せてご参照ください。'
