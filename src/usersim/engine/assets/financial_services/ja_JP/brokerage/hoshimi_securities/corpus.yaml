- id: 887a4e90-0375-51d0-a55b-6174b4d6ab07
  title: 特定口座（源泉徴収あり）：状況・履歴の確認
  body: '口座の状況および取引履歴を確認する手順は以下の通りです。


    1. 履歴の照会を依頼する：現在の保有資産状況および、特定口座における取引履歴の出力をお願いしてください。

    2. 履歴内容の確認：提供された明細にて、約定代金、および源泉徴収された税金（税率20.315%）が正しく反映されているかを確認します。

    3. 納税状況の把握：年間の損益通算の結果、いくらが源泉徴収され、いくらが口座に残っているかを確認します。


    上記の手順により、確定申告の要否や、次年度に繰り越せる損失があるかを判断いただけます。詳細な計算根拠が必要な場合は、別途「特定口座（源泉徴収あり）：商品概要」にて制度の詳細をご確認ください。'
