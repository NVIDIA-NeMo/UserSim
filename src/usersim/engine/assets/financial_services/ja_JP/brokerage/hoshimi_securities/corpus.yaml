- id: 6655a5ee-4843-5ac8-a72f-f3e3a3e92344
  title: NISA（つみたて投資枠）：よくあるお手続きの流れ
  body: 'NISA（つみたて投資枠）のご利用開始までの一般的な流れをご案内します。


    1. お申し込み：NISA口座の開設を希望される旨をお伝えください。

    2. 本人確認：マイナンバー届出を含む厳格な本人確認プロセスを実施します。

    3. 税務署への申請：弊社がお客様に代わり、管轄の税務署へ口座開設の申請を行います。

    4. 開設完了の通知：審査完了後、口座開設が完了した旨を通知いたします。

    5. 積立設定：年間投資枠1,200,000円の範囲内で、月々の積立金額（最低100円から）と投資商品をご選択いただきます。


    以上のステップを完了することで、非課税での資産形成が開始されます。'
