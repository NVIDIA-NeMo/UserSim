- id: b0f1ad9a-cf83-5a19-9c47-e3272c7f067b
  title: NISA（成長投資枠）：国内株式の売買手数料について
  body: 'Q：NISA（成長投資枠）で国内株式を売買する場合、手数料はかかりますか？


    A：いいえ、星見証券では国内株式の売買手数料を0円としております。コストを最小限に抑えた効率的な投資が可能です。


    Q：手数料0円は期間限定ですか？


    A：現在は恒久的な低コスト戦略として0円を提供しておりますが、変更がある場合は事前にお知らせいたします。'
