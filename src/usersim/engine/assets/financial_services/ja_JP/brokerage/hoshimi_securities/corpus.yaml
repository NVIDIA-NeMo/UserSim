    引数: account_id, 銘柄コード, 数量, 売買区分, 注文価格 等

    効果: 指定された条件で有価証券の売買注文を出し、口座に反映させます。

    エージェントは、お客様から得た注文詳細と `get_accounts` で特定した口座IDを用いて、このツールを直接呼び出します。'
