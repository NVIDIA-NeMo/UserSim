  body: 'お客様の資産を守るため、特定口座（源泉徴収あり）のご利用にあたっては以下の点にご注意ください。


    1. 多要素認証の徹底：出金や口座情報の変更など、資産の状態を変化させる操作の前には必ず多要素認証を実施します。認証コードを第三者に教えないでください。

    2. 個人情報の管理：当社がメールやチャットで、お客様のパスワードやマイナンバーを直接伺うことはございません。

    3. 不正利用の疑いがある場合：速やかに当社へご連絡ください。直ちに口座を凍結し、社内規定に基づいた調査を行います。


    セキュリティの詳細は「特定口座（源泉徴収あり）：個人情報の取扱い」をご確認ください。'
