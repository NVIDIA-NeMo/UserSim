- id: 06575fba-e9a9-5a00-a078-16da8bd6dc38
  title: NISA（成長投資枠）：お取引が拒否された・制限された
  body: '【症状】注文を出したが、取引が拒否された、または制限が表示される。


    【考えられる原因と確認事項】

    1. 年間投資枠の超過：本年の投資額が2,400,000円に達していないかご確認ください。

    2. 非課税保有限度額の超過：生涯の投資枠12,000,000円の上限に達していないかご確認ください。

    3. 本人確認の未完了：資産を変化させる操作に必要な多要素認証が正しく完了しているかご確認ください。


    【解決策】

    枠に余裕があるにもかかわらず制限される場合は、当社へ状況をお知らせください。専任のコンプライアンス担当者が詳細を調査し、結果を報告いたします。'
