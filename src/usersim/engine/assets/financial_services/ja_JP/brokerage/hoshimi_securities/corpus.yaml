  title: 投資信託の積立：規定・約款の変更
  body: '「投資信託の積立」における規定および約款の変更についてご案内いたします。本サービスでは、顧客の皆様の長期的な資産形成を阻害しない低コスト戦略を追求しており、積立金額の下限を100円に設定しております。また、クレジットカード積立の月間上限額は100,000円として運用しております。


    これらの上限・下限設定を含む約款の内容に変更が生じる場合は、事前にお客様へ通知いたします。変更後の規定に同意いただけない場合は、積立設定の解約が可能です。本サービスは金融庁および日本証券業協会の監督の下、適合性の原則を遵守して提供されます。'
