- id: e7dceb5f-26aa-52c1-ac37-459c95f3fa05
  title: iDeCo（個人型確定拠出年金）：お手続きが完了しない・保留中のまま
  body: 'お申込み手続きが完了せず、「保留中」の状態となっている場合は、以下の原因が考えられます。


    【考えられる原因と確認事項】

    1. 本人確認書類の不備：マイナンバー届出の内容に不備があるか、画像が不鮮明な場合に審査が停滞します。最新の書類が正しく提出されているかご確認ください。

    2. 適格性の確認：加入資格や拠出限度額（会社員：62,000円、自営業：75,000円）を超えた設定になっていないかご確認ください。


    【解決策】

    不備がある場合は、改めて正しい書類の再提出をお願いいたします。再提出後、社内規定に基づいたタイムラインで審査を再開し、完了次第通知いたします。


    解決に至らない場合は、専任のコンプライアンス担当者へエスカレーションし、詳細な調査を行います。'
