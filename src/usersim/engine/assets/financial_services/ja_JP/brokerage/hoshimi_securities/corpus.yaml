- id: 50b582d7-5fe1-5880-a9d3-4adaf4867c6d
  title: NISA（つみたて投資枠）：安全にご利用いただくためのポイント
  body: 'お客さまの資産を安全に守るため、以下の点にご注意ください。星見証券では、出金や口座情報の変更など、資産の状態を変化させる操作の前に必ず多要素認証による本人確認を実施しております。認証コードを第三者に教えることは絶対におやめください。


    また、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場の変動による元本割れは補償対象外となります。不審なメールや通知に心当たりがある場合は、直ちにご連絡ください。'
