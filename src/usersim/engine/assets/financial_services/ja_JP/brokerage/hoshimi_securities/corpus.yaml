  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: hoshimi_securities
- id: a2aae9c3-853b-5d1a-b6e9-093ee0aa532a
  title: update_beneficiary を使う場面
  body: '顧客が、出金先として登録している銀行口座（出金先口座）の変更を希望した場合に使用します。口座情報の変更はセキュリティ上の重要操作に該当します。


    【手続き手順】

    1. 本人確認を完了させます。

    2. 多要素認証による追加の本人確認を実施し、本人であることを厳格に確認します。

    3. `get_accounts` を使用して、対象となる account_id を特定します。

    4. 新しい出金先口座の情報（金融機関名、支店名、口座番号）を正確に確認します。

    5. `update_beneficiary` を呼び出し、account_id と新しい口座情報を指定して更新を完了させます。


    情報の誤入力は出金不能の原因となるため、入力内容の復唱確認を徹底してください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: hoshimi_securities
