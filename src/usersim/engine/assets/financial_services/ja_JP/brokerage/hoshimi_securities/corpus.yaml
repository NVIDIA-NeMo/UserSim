  title: 特定口座（源泉徴収あり）：上場株式等の譲渡益・配当にかかる税率について
  body: '【質問】特定口座（源泉徴収あり）で上場株式などの取引をした際、利益に課税される税率はいくらですか？


    【回答】上場株式等の譲渡益および配当金に適用される税率は、一律で20.315%です。この税金は、お取引のたびに弊社が自動的に源泉徴収し、納付いたします。詳細については「特定口座（源泉徴収あり）：金利・料率一覧」をご確認ください。'
