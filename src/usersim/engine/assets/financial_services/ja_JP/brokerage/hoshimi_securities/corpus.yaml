- id: 9a97c740-ba6b-5df0-a50f-b02e398c1410
  title: NISA（つみたて投資枠）：ご紹介・継続利用の特典
  body: 星見証券では、長期的な資産形成を支援するため、NISA（つみたて投資枠）の継続的なご利用を推奨しております。低コストな取引環境を最大限に活用し、着実な資産最大化を目指しましょう。また、ご家族やご友人に当社の透明性の高いサービスをご紹介いただいた際の特典についても、順次ご案内しております。詳細は担当者までお問い合わせください。
