  title: iDeCo（個人型確定拠出年金）：登録内容の変更
  body: 'iDeCo（個人型確定拠出年金）の登録内容（住所、連絡先、掛金額など）を変更する手順は以下の通りです。


    1. 変更内容の伝達：変更したい項目と新しい情報を当社にお伝えください。

    2. 本人確認の実施：資産の状態に影響を与える操作となるため、多要素認証による本人確認を実施します。画面の指示に従い認証を完了させてください。

    3. 内容の照合と確定：当社にて変更内容の整合性を確認し、手続きを完了します。

    4. 完了通知の受領：変更が完了した旨の通知が届いたことを確認してください。


    なお、掛金額の変更には、最低月額5,000円という制限がある点にご留意ください。'
