    米国株式は価格変動リスクがあり、投資額を上回る損失が生じる可能性があります。相場の変動による元本割れは、補償対象外となります。


    【為替リスク】

    米ドル建てで取引を行うため、株価に変動がなくても、為替相場の変動により円貨ベースでの資産価値が減少するリスクがあります。


