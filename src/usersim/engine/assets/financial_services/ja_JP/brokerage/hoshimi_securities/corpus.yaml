  title: 特定口座（源泉徴収あり）：他社の一般的な商品との比較
  body: '他社の一般的な特定口座と比較して、星見証券は「徹底した低コスト」と「デジタル完結の利便性」に強みを置いています。特に国内株式手数料を0円とすることで、取引頻度の高い投資家の方のコストを最小限に抑えています。


