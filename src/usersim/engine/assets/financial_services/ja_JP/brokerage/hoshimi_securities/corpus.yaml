- id: 4fb17197-8742-5438-8659-9d514b175655
  title: 投資信託の積立：重要事項のご説明
  body: '【リスクについて】

    投資信託は元本保証のある商品ではありません。相場の変動により、投資元本を割り込む（元本割れ）可能性があります。元本割れが発生した場合、弊社では補償いたしかねますので、十分にご理解の上でご判断ください。


    【資産の管理と保護】

    顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【適合性の原則】

    弊社は、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を遵守し、お客様の最善の利益を追求いたします。なお、個別の税務・法的助言および特定の銘柄推奨は行いません。'
