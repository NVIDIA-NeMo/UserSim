- id: b0369fa1-0b97-5768-a239-d81a7f43e220
  title: NISA（成長投資枠）：お申込みとご利用開始
  body: 'NISA（成長投資枠）のご利用開始までの手順をご案内します。


    1. お申込みの意思表明：担当者へNISA口座（成長投資枠）の開設を依頼してください。

    2. 本人確認書類の提出：マイナンバーカード等の必要書類を提示してください。厳格な本人確認プロセスに基づき審査を行います。

    3. 多要素認証の設定：資産の状態を変化させる操作に必須となる多要素認証の設定を完了させてください。

    4. 開設完了通知の受領：審査完了後、口座開設が完了した旨を通知いたします。


    以上のステップが完了すると、年間2,400,000円の枠内で非課税取引が開始いただけます。具体的な手数料については「NISA（成長投資枠）：手数料一覧」をご参照ください。'
