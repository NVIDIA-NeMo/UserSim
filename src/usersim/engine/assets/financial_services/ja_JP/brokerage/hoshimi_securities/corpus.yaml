  body: 'Q：2027年1月から、未成年者の非課税保有限度額（生涯投資枠）はどうなりますか？


    A：2027年1月より、未成年の方の非課税保有限度額は6,000,000円に設定されます。この枠内で、長期にわたって非課税での資産運用が可能となります。なお、この限度額は成長投資枠を含めた合算での管理となります。'
