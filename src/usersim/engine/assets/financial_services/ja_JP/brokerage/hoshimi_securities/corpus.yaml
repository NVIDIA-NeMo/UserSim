  title: 米国株式の取引：ほかの選択肢との比較と向かない場合
  body: '「米国株式の取引」は、特定の米国企業に直接投資したい方に最適です。取引手数料0.495%（上限22 USD）および為替手数料1米ドルあたり25銭という業界最安水準のコストで提供しています。


