- id: a0a6bc7b-d99a-5635-a633-9aaeae9d80f5
  title: 特定口座（源泉徴収あり）：明細や記録と合わない
  body: 'お客様から「明細の金額が想定と異なる」とのお問い合わせを受けた際、サポート担当者は以下の点を確認してください。


    【確認ポイント】

    1. 源泉徴収額の有無：利益確定時に20.315%の税率で源泉徴収が行われているか確認してください。お客様が税引前金額で計算している場合、乖離が発生します。

    2. 損失の繰越控除の適用：過去3年分までの損失が適切に相殺されているかを確認してください。確定申告を行っている場合、その反映状況を確認する必要があります。

    3. 手数料の確認：国内株式手数料は0円ですが、他商品や外貨建て資産の場合、別途費用が発生していないか確認してください。


    【対応】

    上記で解決しない場合は、詳細な取引履歴を抽出し、計算根拠を明示した上で再案内します。不整合が社内データに起因する場合は、速やかにコンプライアンス担当者へエスカレーションしてください。'
