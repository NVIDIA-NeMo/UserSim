- id: dd065925-c759-5ae0-ae66-f284e5994d8c
  title: manage_authorized_users を使う場面
  body: '未成年口座における法定代理人（親権者）の登録、または登録情報の変更を希望された場合に使用します。


    【手続き手順】

    1. 本人確認を完了させます。

    2. 多要素認証による本人確認を実施し、正当な権限を持つ申請者であることを確認します。

    3. `get_accounts` を使用して、対象となる未成年口座の account_id を特定します。

    4. 法定代理人の氏名、続柄、および連絡先情報を確認します。

    5. `manage_authorized_users` を呼び出し、account_id と代理人情報を指定して登録・変更処理を完了させます。


    必要書類の確認が済んでいることを前提に操作を行ってください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
