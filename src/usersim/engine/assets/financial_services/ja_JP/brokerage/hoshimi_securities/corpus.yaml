  title: NISA（成長投資枠）：不正利用からお客さまを守るために
  body: 'NISA（成長投資枠）をご利用にあたり、投資名義を悪用した詐欺にご注意ください。特に「元本保証で高利回りを約束する」という勧誘は、制度の性質上あり得ません。星見証券では、多要素認証による厳格な本人確認を実施しており、資産の状態を変化させる操作の前には必ず認証を求めます。


    弊社がチャットやメールで、お客様のパスワードや暗証番号を直接お伺いすることはございません。もし不審な連絡を受けたり、身に覚えのない取引通知が届いたりした場合は、直ちに弊社へお知らせください。不正利用の疑いがある場合、弊社は直ちに口座を凍結し、社内規定に基づいたタイムラインで調査と報告を行います。'
