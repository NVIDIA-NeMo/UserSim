  title: NISA（つみたて投資枠）：ログインできない・アクセスできない
  body: '【症状】ログイン画面でエラーが出る、または多要素認証が進まない。


    【原因と確認事項】

    ・IDまたはパスワードの入力間違いがないかご確認ください。

    ・認証デバイスに届いている通知やコードが最新のものかご確認ください。


    【解決策】

    ・パスワード再設定の手続きを行い、最新の認証情報で再度ログインを試みてください。


    【エスカレーション】

    上記で解決しない場合は、専任のコンプライアンス担当者がアカウントの状態を調査し、再設定を支援いたします。調査結果は社内規定のタイムラインに基づき、速やかにご連絡いたします。'
