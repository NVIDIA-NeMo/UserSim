- id: da6adabf-d6e4-5d84-8808-49f7c1a6e4e4
  title: open_account ツールリファレンス
  body: '本ツールは、証券総合口座（特定口座を含む）の開設申し込みを行うために使用します。オペレーターが直接 `open_account` を呼び出すことで手続きが開始されます。


