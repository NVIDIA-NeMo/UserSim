  body: '本サービスにおける積立設定および運用に関する規定は以下の通りです。


    1. 積立金額の制限：積立の最低金額は100円からとします。また、クレジットカードを利用した積立の場合、月額の上限は100,000円までと定めています。

    2. 義務と責任：お客さまは、最新の本人確認情報を維持する義務を負います。多要素認証などのセキュリティ手続きに不備がある場合、資産保護のため一時的に操作を制限することがあります。

    3. 変更および終了：積立プランの変更や解約は、所定の手続きをもって行われます。規定の変更がある場合は、事前にお客さまへ通知いたします。

    4. 資産管理：顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による元本割れは補償対象外となります。'
