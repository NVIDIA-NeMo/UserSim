- id: 67c73d9d-4de3-59b8-acf6-057666e14c87
  title: iDeCo（個人型確定拠出年金）：リスクについてのご説明
  body: 'iDeCo（個人型確定拠出年金）で運用する商品には、以下のリスクが伴います。十分にご理解の上でご判断ください。


    【元本割れリスク】

    投資信託などの商品を選択した場合、相場の変動により元本を割り込む可能性があります。元本保証はありません。万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による損失は補償対象外です。


    【流動性リスク】

    本制度は原則として60歳まで資産を引き出すことができません。急な資金需要がある場合でも、中途解約ができない点にご注意ください。


    【適合性の原則】

    お客様の知識、経験、投資目的に照らし、不適当な勧誘は行いません。最終的な投資決定はお客様ご自身の判断で行っていただきます。'
