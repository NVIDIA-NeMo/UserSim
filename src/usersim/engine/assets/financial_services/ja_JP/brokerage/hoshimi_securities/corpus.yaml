- id: 118b4859-a5d7-56e2-b617-d50f1fd6f72c
  title: NISA（成長投資枠）：ご利用開始までの手順
  body: '【エージェント向け：ご利用開始案内フロー】

    お客様を以下の手順で案内し、NISA（成長投資枠）の利用を開始させてください。


    1. 口座開設の確認

    まず、総合口座の開設が完了しているかを確認します。未開設の場合は、マイナンバー届出を含む本人確認手続きを案内してください。


    2. NISA口座の申請

    お客様にNISA口座の開設申請を依頼します。申請後、税務署による審査が行われるため、完了まで数営業日かかる旨を伝えてください。


    3. 枠の確認と銘柄選択

    審査完了後、年間投資枠2,400,000円が利用可能になります。国内株式は手数料0円で取引できることを伝え、投資したい銘柄の選択をサポートしてください。


    4. 初回注文の実施

    注文方法を案内し、約定を確認することで手続き完了となります。詳細は「NISA（成長投資枠）：商品概要」をご参照ください。'
