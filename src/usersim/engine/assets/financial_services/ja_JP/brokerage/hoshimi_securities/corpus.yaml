  product_category: toshin_tsumitate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 3bc25719-ff8c-5284-9208-9fa224474c93
  title: 投資信託の積立：手数料と費用
  body: 'Q：投資信託の積立に際して、どのような費用がかかりますか？

    A：星見証券では、低コストな取引環境を提供しており、積立設定自体の手数料は無料です。ただし、投資信託そのものに付随する運用管理費用（信託報酬）などは、各商品ごとに発生します。


    Q：クレジットカード積立を利用するメリットはありますか？

    A：はい。クレジットカードでの積立をご利用いただくと、0.5%の還元を受けることができ、効率的な資産形成を支援いたします。'
  domain: brokerage_investing
