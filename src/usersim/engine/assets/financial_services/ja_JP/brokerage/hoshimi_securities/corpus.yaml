- id: c923a45e-a6b2-564e-b601-e7e1b5720bfe
  title: 投資信託の積立：プランの選び方
  body: '「投資信託の積立」では、現金による積立とクレジットカード積立を選択いただけます。


    ・クレジットカード積立：0.5%の還元があるため、効率を重視される方におすすめです。ただし、月間100,000円の上限があります。

    ・現金積立：上限を気にせず柔軟に金額を設定したい方に適しています。


    どちらのプランも最低100円から開始でき、長期・分散投資を実現します。非課税での運用を検討される場合は、「NISA（つみたて投資枠）：商品概要」も併せてご検討ください。'
