- id: fc518292-bdfe-5aa6-8147-a526ec7839be
  title: NISA（成長投資枠）：登録内容の変更
  body: 'NISA（成長投資枠）をご利用中の登録内容（住所・氏名等）を変更する手順は以下の通りです。


    【事前準備】

    ・ご本人様確認書類（運転免許証、マイナンバーカード等）

    ・多要素認証が可能なデバイス


    【変更ステップ】

    1. 変更内容の提示

    変更したい項目（例：住所の変更）を当社にお伝えください。

    2. 本人確認の実施

    資産の状態を変化させる操作となるため、多要素認証による本人確認を行います。画面またはメッセージに表示される認証コードを入力してください。

    3. 必要書類の提出

    住所変更などの場合、最新の住民票や免許証の写しを、当社の指定する方法で提出してください。

    4. 変更完了の通知

    当社にて書類審査を行い、登録内容の変更が完了した後、完了通知をいたします。


    【完了の確認】

    口座情報の照会画面にて、新住所等が正しく反映されていることをご確認ください。'
