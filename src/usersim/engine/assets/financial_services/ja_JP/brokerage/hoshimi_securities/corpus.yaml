- id: b776cd60-ee1a-54b0-82bd-8fe8281e8976
  title: 米国株式の取引：明細や記録と合わない
  body: 'お客様の記録と当社の明細に差異がある場合の確認手順です。


    【チェックリスト】

    1. 手数料の算定：約定代金に0.495%の手数料が正しく適用されているか、また上限の22 USDを超えていないか確認してください。

    2. 為替コストの確認：米ドルへの交換時に1米ドルあたり25銭の手数料が差し引かれているか確認してください。

    3. 決済日の差異：米国株式は約定から決済まで時間を要するため、残高への反映タイミングにズレが生じます。


    【解決しない場合】

    上記を確認しても不一致が解消されない場合は、至急コンプライアンス担当者へエスカレーションし、正確な取引ログに基づいた再調査を行います。調査結果は社内規定のタイムラインに従って速やかに報告いたします。'
