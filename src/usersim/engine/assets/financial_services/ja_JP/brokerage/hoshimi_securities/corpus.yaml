- id: 739279d6-a767-549f-acbf-b2f3a5c8b888
  title: 投資信託の積立：ご利用開始までの手順
  body: '（サポート担当者向け）お客様が「投資信託の積立」を開始される際は、以下の手順で案内してください。


    1. 口座開設時のマイナンバー届出が完了しているか確認します。

    2. 積立対象となる投資信託の商品を選択していただきます。

    3. 積立金額を設定します。最低金額は100円からであることを伝えてください。

    4. 出金元としてクレジットカードを登録します。クレジットカード積立の月間上限額は100,000円までとなることを説明してください。

    5. 最終的な設定内容を提示し、お客様の同意を得て設定を完了します。


    完了後、設定内容が正しく反映されたことを確認し、お客様へ通知してください。'
