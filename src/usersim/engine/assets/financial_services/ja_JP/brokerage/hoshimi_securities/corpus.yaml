- id: c0722def-64ec-59d0-a2ce-72a8fbb533e1
  title: 投資信託の積立：限度額・制限と注意事項
  body: '「投資信託の積立」における利用限度額および制限事項は以下の通りです。顧客対応の際は、これらの数値を正確に案内してください。


    【積立金額の制限】

    ・最低積立金額：100円から設定可能です。


    【クレジットカード積立の制限】

    ・月間利用限度額：1回あたりの積立金額は、月額最大100,000円までとなります。


    【注意事項】

    ・クレジットカード積立の枠は、設定金額に基づいて判定されます。限度額を超える設定はできません。

    ・積立設定の変更および解除は、各銘柄の約定タイミングにより、反映までに数営業日を要する場合があります。

    ・資産の状況を変化させる操作の前には、必ず多要素認証による本人確認が必要です。'
