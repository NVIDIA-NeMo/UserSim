- id: 8c8fccbd-34be-52c3-8cc9-3fdc09d058c7
  title: 投資信託の積立：状況・履歴の確認
  body: '現在の積立状況および過去の履歴を確認する手順をご案内します。


    1. 資産状況の照会を依頼してください。現在保有している投資信託の数量、現在の評価額、および累計投資金額が表示されます。

    2. 積立履歴の詳細を確認してください。毎月の積立実行日、購入金額、および適用された口数が一覧で表示されます。

    3. クレジットカード積立をご利用の場合は、月間の利用額が限度額の100,000円に対してどの程度であるかを確認してください。


    上記の手順で、計画通りに資産形成が進んでいるかをご確認いただけます。履歴に不明点がある場合は、詳細な明細の提示をさせていただきます。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: af67a41a-7a94-5bcc-81ce-a2817f665458
  title: 投資信託の積立：お取引が拒否された・制限された
  body: '「積立設定が完了しない」「取引が拒否された」という症状がある場合、以下の原因が考えられます。


    【確認事項と対処法】

    1. クレジットカードの限度額超過：月間の積立額が100,000円を超えていないか、またはカード自体の利用可能枠が不足していないかを確認してください。

    2. 本人確認書類の不備：マイナンバー届出などの本人確認プロセスが完了しているか確認してください。

    3. 口座の凍結：不正利用の疑いにより口座が一時的に制限されている場合があります。


    【解決しない場合】

    上記を確認しても解消しない場合は、専任のコンプライアンス担当者へエスカレーションいたします。調査後、社内規定のタイムラインに基づき、制限解除の手続きまたは詳細な理由を報告させていただきます。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 56d1e2c4-e33a-58e8-9ee1-120700d1e6aa
  title: 投資信託の積立：切替えや上位プランを検討するとき
  body: '特定口座での「投資信託の積立」から、より税制メリットのある制度への切替えを検討される場合、NISA（つみたて投資枠）への移行を推奨します。


    【比較ポイント】

    ・特定口座：運用益に20.315%の税率で課税されます。

    ・NISA（つみたて投資枠）：運用益が非課税となり、長期的な資産最大化に適しています。


    どちらも100円からの少額積立が可能ですが、非課税のメリットを最大限に活用したい方は、NISA（つみたて投資枠）が最適です。詳細は「NISA（つみたて投資枠）：商品概要」をご参照ください。'
