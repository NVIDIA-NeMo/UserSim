- id: bce22db5-4a36-53d5-97b3-61a696cbc4cd
  title: 投資信託の積立：ログインできない・アクセスできない
  body: '「投資信託の積立」の設定変更時などにログインできない場合、以下の点をご確認ください。


    【症状】

    ・ログインボタンを押しても反応がない、またはエラーメッセージが表示される。

    ・多要素認証のコードが届かない。


    【確認事項と解決策】

    1. 入力したIDとパスワードが正確か、大文字・小文字を含め再確認してください。

    2. 通信環境を確認し、安定したネットワークで再度お試しください。

    3. 多要素認証の通知が届かない場合は、登録メールアドレスや電話番号に変更がないかをご確認ください。


    【エスカレーション】

    上記を確認しても解決しない場合は、当社にてアカウントの状態を調査いたします。状況を確認後、専任の担当者より解決策を回答いたします。'
