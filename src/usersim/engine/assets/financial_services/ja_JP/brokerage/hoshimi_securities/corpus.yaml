- id: 550cddd4-ed82-5a7c-b6a6-76b577a09ec2
  title: 投資信託の積立：個人情報の取扱い
  body: '「投資信託の積立」のご利用にあたり、当社は金融庁および日本証券業協会の監督の下、個人情報を厳重に管理いたします。口座開設時に必須となるマイナンバー等の重要情報は、法令に基づいた本人確認および税務報告の目的のみに使用されます。


    お客様の有価証券および金銭は、当社の財産とは明確に分けて管理する「分別管理」を徹底しております。また、積立設定におけるクレジットカード情報などの機密情報は、厳格なセキュリティ基準に基づき保護されます。本サービスを通じて取得した個人情報の取扱いに関する詳細や、権利行使についてのご質問は、当社コンプライアンス担当までお問い合わせください。'
