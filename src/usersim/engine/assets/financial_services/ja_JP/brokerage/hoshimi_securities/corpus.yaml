  body: '米国株式の注文が拒否された、または口座に制限がかかった場合の確認事項です。


    【考えられる原因と対処法】

    1. 買付余力の不足：約定代金に加え、0.495%の取引手数料（最大22 USD）および為替手数料（1米ドルあたり25銭）を賄う十分な米ドル残高があるか確認してください。

    2. 本人確認の未完了：資産の状態を変化させる操作には多要素認証が必要です。認証が正しく完了しているか確認してください。

    3. 適合性の原則による制限：お客様の知識、経験、投資目的に照らして不適当と判断された銘柄への投資は、制限される場合があります。


    【解決しない場合】

    上記を確認しても制限が解除されない場合は、当社が詳細を調査します。コンプライアンス担当者へエスカレーションし、調査結果を追って報告いたします。'
