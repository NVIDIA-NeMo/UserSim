  title: iDeCo（個人型確定拠出年金）：ログインできない・アクセスできない
  body: '【症状】iDeCo（個人型確定拠出年金）の管理画面にログインできない、またはアクセスが拒否される。


    【考えられる原因と対処法】

    1. パスワードの誤入力：大文字・小文字の区別に注意して再入力してください。解決しない場合はパスワード再設定の手続きを行います。

    2. 多要素認証の不備：登録済みのデバイスや認証手段が正しく動作しているか確認してください。

    3. アカウントのロック：短時間に複数回ログインに失敗した場合、セキュリティのため一時的にロックされます。


    【解決しない場合】

    上記を確認しても解消されない場合は、当社で認証状態の確認を行います。また、不正アクセスの疑いがある場合は、直ちに口座を凍結し、社内規定に基づいた調査を実施いたします。'
