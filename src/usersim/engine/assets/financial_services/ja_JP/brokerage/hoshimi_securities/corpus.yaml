- id: b26012ec-2a01-59d6-a672-7811af306fae
  title: NISA（つみたて投資枠）：リスクについてのご説明
  body: 'NISA（つみたて投資枠）を利用した投資には、以下のリスクが伴います。十分にご理解の上でご判断ください。


    【元本保証について】

    本制度は投資信託等への投資であり、元本保証はありません。相場の変動により、投資した金額を下回る（元本割れ）可能性があります。この変動による損失は補償対象外となります。


    【補償範囲について】

    顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、これは証券会社の破綻時の補償であり、運用による損失を補償するものではない点にご留意ください。'
