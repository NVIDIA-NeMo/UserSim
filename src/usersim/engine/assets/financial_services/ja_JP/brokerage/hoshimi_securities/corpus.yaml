  title: iDeCo（個人型確定拠出年金）：重要事項のご説明
  body: 'iDeCo（個人型確定拠出年金）のご利用にあたり、以下の重要事項をご確認ください。


    【元本保証について】

    運用商品によっては、相場変動により元本割れするリスクがあります。元本保証がない商品が含まれるため、投資決定はご自身の判断で行ってください。


    【資産の管理と補償】

    顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場変動による損失は補償対象外です。


    【手数料】

    加入時に2,829円、および2026年12月分から月額186円の手数料が発生します。また、口座管理手数料は0円です。


    【制度の制約】

    原則として60歳まで資産の引き出しができません。中途解約には厳しい制限があることを十分にご理解ください。'
