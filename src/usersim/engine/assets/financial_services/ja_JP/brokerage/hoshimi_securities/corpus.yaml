- id: 3fd54ccb-dc9d-5c16-99b0-e9c3e9fb976a
  title: 特定口座（源泉徴収あり）：損失の繰越控除ができる期間（年）について
  body: 'Q：特定口座で発生した損失を、翌年以降の利益から差し引く「繰越控除」はいつまで可能ですか？


    A：損失の繰越控除ができる期間は、最大3年です。確定申告を行うことで、過去3年分までの損失を翌年以降の譲渡所得から控除し、税負担を軽減することが可能です。詳細な手続きについては「特定口座（源泉徴収あり）：商品概要」をご確認ください。'
