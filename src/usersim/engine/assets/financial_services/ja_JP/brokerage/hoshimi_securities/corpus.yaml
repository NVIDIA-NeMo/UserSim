- id: b17c0b89-54c8-52e7-a123-09edf714ab8b
  title: 投資信託の積立：想定外の手数料・金額
  body: 'お客さまから「積立金額が想定と異なる」または「決済金額が正しくない」とのお問い合わせがあった際は、以下の点を確認してください。


    【確認事項】

    1. クレジットカード積立の上限超過：月額の積立設定額が100,000円を超えていないか確認します。上限を超えた分は決済されません。

    2. 最低金額の不備：積立金額が100円未満に設定されていないか確認します。

    3. カード決済エラー：利用限度額の不足などにより決済が完了していない可能性があります。


    【対応】

    設定内容に誤りがある場合は、正しい金額への変更手続きをご案内してください。原因が不明な場合や、システム的な不整合が疑われる場合は、専任のコンプライアンス担当者へエスカレーションし、社内調査の結果をお客さまへ報告します。'
