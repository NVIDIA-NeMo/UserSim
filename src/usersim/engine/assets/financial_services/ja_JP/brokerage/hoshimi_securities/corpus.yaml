- id: 7b6aa0a7-8675-5a19-b957-f1c2a21043dd
  title: 特定口座（源泉徴収あり）：限度額・制限と注意事項
  body: '本口座の運用における主な制限と注意事項は以下の通りです。


    【税率と管理】

    上場株式等の譲渡益および配当金に対しては、20.315%の税率で源泉徴収が行われます。これにより、原則として確定申告の手間を省くことが可能です。


    【損失の繰越控除】

    年間の取引で損失が出た場合、確定申告を行うことで最大3年まで損失を繰り越すことができ、翌年以降の利益と相殺することが可能です。


    【コスト】

    国内株式の取引手数料は0円となっております。ただし、その他の商品やサービスによっては別途費用が発生する場合があるため、詳細は「特定口座（源泉徴収あり）：手数料一覧」をご参照ください。


    【リスク】

    相場の変動により元本を割り込む可能性があります。元本保証はありませんので、ご自身の判断による投資をお願いいたします。'
