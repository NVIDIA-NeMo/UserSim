- id: 5bf0ca9f-a22c-55d8-a20f-c46743cef175
  title: 米国株式の取引：よくあるお手続きの流れ
  body: '米国株式の取引を開始し、実際に売買を行うまでの流れは以下の通りです。


    1. 取引口座の開設依頼：米国株式の取引を希望する旨を伝えてください。

    2. 本人確認書類の提出：マイナンバー届出を含む厳格な本人確認プロセスを完了させてください。

    3. 資金の入金と米ドルへの交換：日本円を入金し、米ドルへ交換してください。この際、1米ドルあたり25銭の為替手数料が発生します。

    4. 注文の指示：購入したい銘柄と数量を伝えてください。約定後、約定代金の0.495%（最大22 USD）の取引手数料が差し引かれます。

    5. 約定確認：取引が成立した通知を受け取り、資産状況に銘柄が反映されたことを確認して完了です。'
