- id: b5d9d010-07ae-5d80-a2b4-815e8022cbf6
  title: iDeCo（個人型確定拠出年金）：明細や記録と合わない
  body: '【症状】

    提示された運用明細の残高や、拠出履歴の金額が、お客様ご自身の計算と一致しない。


    【考えられる原因】

    ・拠出金が口座に反映されるまでのタイムラグが発生している。

    ・2026年12月分より適用されている月額186円の手数料が差し引かれている。

    ・運用商品の評価額が相場変動により変動している。


    【確認ステップ】

    1. 拠出日の日付と、実際に資産に反映された日付に乖離がないか履歴を確認してください。

    2. 2026年12月以降の明細において、月額186円の手数料が正しく計上されているか照合してください。


    【エスカレーション】

    上記を確認してもなお不整合がある場合は、詳細な計算根拠を添えてご報告ください。当社にて再調査を行い、必要に応じてコンプライアンス担当者が精査し、修正または詳細な説明をさせていただきます。'
