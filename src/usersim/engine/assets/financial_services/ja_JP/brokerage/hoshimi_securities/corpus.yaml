- id: 31384776-cf09-5dcb-a64b-26d0379a4329
  title: 特定口座（源泉徴収あり）：想定外の手数料・金額
  body: 'お客様より「想定していた金額と異なる」との問い合わせを受けた際は、以下の順序で確認してください。


    1. 税金の徴収有無を確認：本口座では、利益に対して20.315%の税金が自動的に源泉徴収されます。受取金額が約20%減少している場合は、正常な課税処理です。

    2. 取引手数料の確認：国内株式の手数料は0円です。もし費用が発生している場合は、米国株式など他商品の取引ではないか確認してください。

    3. 損益通算の適用状況を確認：口座内での損益通算が行われた結果、徴収額が変動している可能性があります。


    上記で解決せず、依然として不整合がある場合は、速やかに専任のコンプライアンス担当者へエスカレーションし、詳細な調査を依頼してください。'
