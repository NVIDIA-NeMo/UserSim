  title: iDeCo（個人型確定拠出年金）：解約・変更・プランの切替え
  body: 'iDeCo（個人型確定拠出年金）の掛金額の変更や、運用商品の切替え手続きは以下の手順で行います。


    1. 変更希望の内容（掛金額の増減や、切替えたい商品名）を弊社にお伝えください。

    2. 多要素認証による本人確認を実施し、ご本人様であることを確認いたします。

    3. 変更内容の確認書を提示いたしますので、内容に間違いがないかご確認をお願いします。

    4. 弊社にて手続きを完了させ、完了通知をいたします。


    なお、本制度は老後資金形成を目的としているため、原則として60歳まで資産を引き出す（解約する）ことはできません。脱退一時金などの例外的な手続きが必要な場合は、別途必要書類のご案内をいたします。'
