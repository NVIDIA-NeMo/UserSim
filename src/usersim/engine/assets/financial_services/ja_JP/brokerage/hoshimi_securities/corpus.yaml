- id: a72dbf7c-00d1-5a4c-90b2-4917a4b9db4a
  title: NISA（つみたて投資枠）：明細や記録と合わない
  body: 'お客様の記録と弊社の明細に差異がある場合、以下の点をご確認ください。


    ・約定日のタイムラグ：積立注文から実際に約定し、明細に反映されるまでには数営業日の時間を要します。

    ・取得価額の計算：非課税保有限度額（18,000,000円）の判定は、時価ではなく「取得価額（購入時の金額）」で計算されるため、評価額と乖離します。

    ・枠の重複確認：つみたて投資枠と成長投資枠を併用されている場合、それぞれの枠の利用額が合算されて表示されていないかご確認ください。


    上記を確認しても解決しない場合は、弊社にて詳細な取引履歴を再照会いたします。不整合の内容を具体的にお知らせください。'
