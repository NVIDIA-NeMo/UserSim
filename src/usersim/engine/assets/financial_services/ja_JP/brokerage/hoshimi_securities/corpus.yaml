- id: e6b5ad9d-2f28-54aa-817b-22bddab747e2
  title: 特定口座（源泉徴収あり）：お取引が拒否された・制限された
  body: 'お取引が拒否された、あるいは制限された場合に考えられる原因と対処法です。


    【想定される原因】

    ・買付余力（証拠金）の不足：取引に必要な資金が不足している可能性があります。

    ・本人確認の未完了：口座開設時のマイナンバー届出や、重要な操作前の多要素認証が完了していない場合に制限がかかります。

    ・コンプライアンス上の制限：適合性の原則に基づき、一部の銘柄や取引が制限されている場合があります。


    【確認と解決策】

    1. 余力確認：現在の口座残高を確認し、不足している場合は入金を行ってください。

    2. 認証の実施：多要素認証を正しく完了させてください。

    3. 状況の照会：制限の理由が不明な場合は、専任のコンプライアンス担当者へエスカレーションし、詳細を回答いたします。'
