  title: NISA（成長投資枠）：手数料一覧
  body: 'NISA（成長投資枠）におけるご利用手数料は以下の通りです。


    ・国内株式売買手数料：0円


    星見証券では、お客様の長期的な資産形成を阻害しないよう、国内株式の手数料を0円とする低コスト戦略を追求しております。その他の運営費用は、サービスの安定性とセキュリティ維持のためにのみ設定しております。'
