  body: 'NISA（成長投資枠）のお申込み条件は以下の通りです。


    ・日本国内に居住しており、マイナンバーの届出が可能な方 → お申込み可能

    ・18歳以上の方（または法定代理人の同意がある未成年の方） → お申込み可能

    ・既に他社でNISA口座を開設済みの方 → 金融機関変更手続き後に、当社のNISA（成長投資枠）をご利用いただけます'
