- id: 6e64e868-483e-54b3-ab78-af43ef4a0981
  title: get_order_status を使う場面
  body: '顧客から注文状況の照会があった際の手順は以下の通りです。


    1. verify_identityを用いて本人確認を完了させます。

    2. get_accountsを呼び出し、顧客の口座IDを特定します。

    3. 注文IDまたは口座IDを用いてget_order_statusツールを実行し、現在の注文状態（未約定、約定済、取消済など）を取得します。

    4. 取得した情報を基に、顧客へ現在の進捗状況を誠実かつ明快に伝えます。


    注文内容の変更や取消を希望される場合は、「cancel_order を使う場面」に従い手続きを案内してください。'
