  title: NISA（つみたて投資枠）：積立の最低金額について
  body: '【質問】積立を開始できる最低金額はいくらですか？

    【回答】NISA（つみたて投資枠）での積立は、100円から開始いただけます。少額からでも長期的に積み立てることで、効率的な資産形成が可能です。詳細な設定方法は「NISA（つみたて投資枠）：商品概要」をご確認ください。'
