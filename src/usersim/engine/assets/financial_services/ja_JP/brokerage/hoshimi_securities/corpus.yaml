  title: NISA（成長投資枠）：リスクについてのご説明
  body: 'NISA（成長投資枠）を利用した投資には、以下のリスクが伴います。あらかじめ十分にご理解いただいた上で、お客様ご自身の判断で投資決定を行ってください。


    1. 価格変動リスク：株式や投資信託は相場変動により価格が上下します。投資金額を下回る元本割れが発生する可能性があり、その損失は顧客に帰属します。

    2. 元本保証の不存在：本制度は元本を保証するものではありません。相場変動による損失は、日本投資者保護基金の補償対象外となります。

    3. 補償について：顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    弊社は一般的な制度解説は行いますが、特定の銘柄の売買推奨や個別の税務助言は行いません。'
