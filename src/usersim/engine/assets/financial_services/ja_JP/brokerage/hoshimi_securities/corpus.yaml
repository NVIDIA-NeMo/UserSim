- id: 12e8a9f8-c7ec-5170-a6db-51efa9692b72
  title: initiate_securities_transfer を使う場面
  body: '顧客が他社の特定口座で保有している株式や投資信託を、星見証券の口座へ移管（入庫）したい場合に本ツールを使用します。


    【手続き手順】

    1. 本人確認を実施します。

    2. `get_accounts` を使用し、顧客の account_id を特定します。

    3. 移管元となる金融機関名および移管対象の銘柄・数量などの情報を確認します。

    4. `initiate_securities_transfer` を呼び出し、移管手続きを開始します。'
