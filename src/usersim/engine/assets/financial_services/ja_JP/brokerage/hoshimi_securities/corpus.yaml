  body: NISA（つみたて投資枠）における取引手数料は、お客様の長期的な資産形成を阻害しないよう、業界最安水準の低コスト戦略を追求しております。個別の取引にかかる手数料は原則として0円であり、すべての顧客様に一律に適用されます。なお、投資信託内部で発生する信託報酬等の運用費用は、各商品の目論見書に基づき決定されます。
