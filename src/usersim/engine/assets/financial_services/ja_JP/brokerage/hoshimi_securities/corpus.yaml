- id: 326e032c-7e0d-513a-8306-d5bd30c4e892
  title: NISA（成長投資枠）：重要事項のご説明
  body: '【適合性の原則とリスク】

    当社は適合性の原則を遵守し、お客様の知識、経験、財産状況に照らして不適当な勧誘を行いません。なお、NISA（成長投資枠）での運用は元本保証がなく、相場の変動により元本を割り込む可能性があります。元本割れは補償対象外となります。


    【資産管理と保護】

    顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【助言の範囲】

    制度の解説や一般的な資産形成の教育は行いますが、個別の税務・法的助言、および特定の銘柄の売買推奨は行いません。投資決定はお客様ご自身の判断でお願いいたします。'
