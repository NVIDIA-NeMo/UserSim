  title: 投資信託の積立：安全にご利用いただくためのポイント
  body: '「投資信託の積立」を安全にご利用いただくため、以下の点にご注意ください。資産の状態を変化させる操作の前には、必ず多要素認証による本人確認を実施いたします。


    星見証券が、パスワードや暗証番号をメールやチャットで直接お伺いすることはありません。不審な連絡があった場合は、直ちにご報告ください。万一、不正利用の疑いがある場合は、社内規定に基づき速やかに口座を凍結し、調査を行います。お客様の資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されますが、相場変動による元本割れは補償対象外となりますのでご了承ください。'
