  title: 特定口座（源泉徴収あり）：登録内容の変更
  body: '特定口座（源泉徴収あり）の登録内容（住所・氏名・連絡先など）を変更する手順は以下の通りです。


    1. 変更内容の伝達：チャットまたはメールにて、変更したい項目と新しい内容を当社へお知らせください。

    2. 本人確認書類の提出：変更内容に応じて、最新の本人確認書類およびマイナンバー確認書類の提出を依頼します。

    3. 多要素認証による承認：資産状態に影響する変更の場合、多要素認証による本人確認を実施します。

    4. 変更完了の通知：社内審査を経て、登録内容の変更が完了したことを通知いたします。


    変更完了後、次回の取引より新しい登録情報が適用されます。'
