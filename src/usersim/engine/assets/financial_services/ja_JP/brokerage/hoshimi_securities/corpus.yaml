- id: edb38bd2-c32b-57fa-950c-453d95fae016
  title: NISA（成長投資枠）：安全にご利用いただくためのポイント
  body: 'NISA（成長投資枠）を安全にご利用いただくために、以下の点にご注意ください。


    1. 多要素認証の徹底

    出金や口座情報の変更など、資産の状態を変化させる操作の前には、必ず多要素認証による本人確認を実施いたします。認証コードを第三者に教えることは絶対におやめください。


    2. 重要情報の管理

    当社がメールやチャットで、お客様のパスワードや暗証番号を直接お伺いすることはございません。不審な連絡があった場合は、直ちに当社までお知らせください。


    3. 本人確認書類の取り扱い

    口座開設時のマイナンバー届出を含む厳格な本人確認プロセスを導入しております。書類の提出は、必ず当社の指定する安全なチャネルを通じて行ってください。'
