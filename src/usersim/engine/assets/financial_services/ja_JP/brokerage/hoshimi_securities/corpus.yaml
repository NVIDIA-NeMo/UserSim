- id: 44b91b3f-4e49-5082-a494-032feef7302c
  title: NISA（成長投資枠）：個人情報の取扱い
  body: '星見証券は、お客様の個人情報を厳格に管理し、法令および社内規定に基づき適切に取り扱います。


    1. マイナンバーの収集と利用

    NISA（成長投資枠）の開設にあたり、法令に基づきマイナンバーの届出を必須としております。収集した番号は、税務当局への報告および非課税処理の適正な運用のためにのみ利用し、それ以外の目的には使用いたしません。


    2. 分別管理の徹底

    お客様からお預かりした資産は、当社の固有財産とは明確に分けて管理する「分別管理」を実施しております。万一の際は、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    3. 第三者提供の制限

    法令に基づく場合や、お客様の同意がある場合を除き、個人情報を第三者に提供することはありません。個人情報の開示・訂正を希望される場合は、当社までお問い合わせください。'
