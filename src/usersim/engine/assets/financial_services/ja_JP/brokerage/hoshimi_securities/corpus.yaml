  title: 投資信託の積立：クレジットカード積立のポイント還元率について
  body: 'Q：クレジットカードで積立設定をした場合、ポイント還元はありますか？


    A：はい。クレジットカードによる積立をご利用の場合、0.5%の還元を受けられるツールとなっております。少額の100円から自動投資を開始でき、還元分を再投資に回すことで、より効率的な資産形成が可能です。詳細は「投資信託の積立：商品概要」をご参照ください。'
