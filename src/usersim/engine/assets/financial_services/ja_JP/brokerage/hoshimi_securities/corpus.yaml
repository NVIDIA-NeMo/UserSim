  title: NISA（つみたて投資枠）：個人情報の取扱い
  body: '星見証券は、金融庁および日本証券業協会の監督の下、お客さまの個人情報を厳重に管理しております。口座開設時にご提出いただくマイナンバーなどの重要情報は、法令に基づき適切に保管され、税務申告等の目的以外に使用されることはございません。


    また、顧客資産は分別管理されており、社内規定に基づいた厳格なセキュリティ体制を構築しています。個人情報の取扱いに関する詳細や、第三者提供の制限については、当社のプライバシーポリシーに準拠いたします。'
