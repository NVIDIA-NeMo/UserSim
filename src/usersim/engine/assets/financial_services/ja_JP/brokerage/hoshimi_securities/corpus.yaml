  title: 特定口座（源泉徴収あり）：手数料と費用
  body: 'Q：特定口座（源泉徴収あり）を利用する際の手数料はいくらですか？


    A：国内株式の取引手数料は0円です。低コストな環境で資産形成を支援いたします。


    Q：税金はどう処理されますか？


    A：利益に対して20.315%の税率で源泉徴収が行われます。弊社が税金を計算し、自動的に納付するため、原則としてお客様による確定申告は不要です。'
