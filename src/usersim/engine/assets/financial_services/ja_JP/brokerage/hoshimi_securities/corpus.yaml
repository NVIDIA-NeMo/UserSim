- id: 387e9c5c-ab86-517d-a856-6912e055f25b
  title: NISA（つみたて投資枠）：実施中のキャンペーン
  body: '【クレジットカード積立還元キャンペーン】

    資産形成をより効率的に進めていただくため、クレジットカードによる積立設定をご利用のお客様に、0.5%のポイント還元を提供しております。


    ・対象：NISA（つみたて投資枠）にてクレジットカード積立を設定された方

    ・還元率：0.5%


    低コストな取引環境とポイント還元を組み合わせることで、投資効率を最大限に高めることが可能です。設定方法は「NISA（つみたて投資枠）：お申込みとご利用開始」をご参照ください。'
