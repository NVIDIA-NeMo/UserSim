- id: 24a3ac5e-c86d-50b4-9ce7-409ad5fbfef4
  title: 特定口座（源泉徴収あり）：お手続きが完了しない・保留中のまま
  body: '【症状】口座開設の申し込みをした後、ステータスが「保留中」のままである、または手続きが完了しない。


    【考えられる原因】

    ・提出いただいた本人確認書類（マイナンバー届出等）に不備がある。

    ・多要素認証の設定が完了していない。


    【確認と解決策】

    1. 提出済みの書類に記載漏れや画像の不鮮明な箇所がないか、再度ご確認ください。

    2. 不備がある場合は、正しい書類をチャットまたはメールにて再送してください。

    3. 弊社にて内容を確認し、不備が解消され次第、速やかに審査を再開します。


    【エスカレーション】

    書類に問題がないにもかかわらず3営業日以上保留が続く場合は、専任のコンプライアンス担当者が詳細な調査を行い、個別に進捗を報告いたします。'
  domain: brokerage_investing
  product_category: tokutei_koza
  document_type: troubleshooting
  source_authority: official
