  body: '星見証券では、金融庁および日本証券業協会の監督の下、お客様の個人情報を厳重に管理しています。


    特定口座（源泉徴収あり）の運用において、税務申告の代行および適正な課税管理のため、マイナンバーの収集と利用が法律で義務付けられています。収集した個人情報は、法令に基づいた税務報告および本人確認目的以外に使用することはありません。


    顧客資産は分別管理され、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による元本割れは補償対象外となりますので、あらかじめご了承ください。'
