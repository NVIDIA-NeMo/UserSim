  title: NISA（成長投資枠）：非課税保有限度額について
  body: 'Q：成長投資枠で保有できる資産の合計上限はいくらですか？

    A：非課税保有限度額（生涯投資枠）は、最大で12,000,000円です。これは商品の取得価額で計算されます。


    Q：限度額を使い切った場合、どうなりますか？

    A：上限に達すると、新たに非課税での買い付けはできません。商品を売却した場合は、その商品の取得価額分だけ、翌年以降に枠が再利用可能となります。'
