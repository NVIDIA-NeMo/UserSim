  body: '`open_nisa_account`

    引数: なし（認証済みユーザーのコンテキストを使用）

    効果: NISA口座の開設を申し込みます。

    エージェントは、本人確認完了後、このツールを直接呼び出して手続きを開始します。実際の利用開始には税務署の確認が必要です。'
