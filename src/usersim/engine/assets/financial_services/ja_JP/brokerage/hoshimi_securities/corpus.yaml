- id: a3b2d9d8-c121-5e75-a6f0-ddf5ac284ec8
  title: 投資信託の積立：ほかの選択肢との比較と向かない場合
  body: '「投資信託の積立」は、少額からコツコツと長期的に資産を形成したい方に最適なツールです。100円という極めて低い最低金額から開始でき、クレジットカード積立による0.5%の還元も受けられます。


    【向かないケース】

    ・短期的な相場変動を利用して利益を得たい方：この機能は分散投資による長期運用を目的としています。短期トレードを希望される場合は、個別株取引をご検討ください。

    ・柔軟な金額変更を頻繁に行いたい方：積立設定の変更には反映まで時間がかかるため、都度金額を調整したい場合は、スポット購入を組み合わせていただくことをお勧めします。


    ご自身の投資目的が「長期的な資産最大化」であるか、改めてご確認いただくことで、最適な制度を選択いただけます。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: ecbd6841-68f6-5994-8001-278686e39fa2
  title: 投資信託の積立：お申込みとご利用条件
  body: 'Q：利用を始めるために必要な条件はありますか？

    A：星見証券の口座を開設し、マイナンバーによる本人確認手続きを完了させている必要があります。


    Q：クレジットカード積立の還元を受けるための条件はありますか？

    A：有効なクレジットカードを登録し、積立設定を完了させていただければ、0.5%の還元が適用されます。ただし、月間の積立上限額は100,000円までとなります。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 2f5abc5c-458b-53ff-8585-1d6eaef7c6f4
  title: 投資信託の積立：よくあるお手続きの流れ
  body: '「投資信託の積立」を開始するための一般的な流れをご案内します。


    1. 積立対象となる投資信託銘柄を選択してください。ご自身の投資目的（リスク許容度）に合った商品を選びます。

    2. 毎回の積立金額を設定してください。最低100円から設定可能です。

    3. お支払い方法を選択してください。クレジットカードを選択した場合、月額100,000円を上限として設定でき、0.5%の還元を受けられます。

    4. 設定内容を確認し、確定してください。この際、資産状態を変化させる操作となるため、多要素認証による本人確認を実施します。


    手続き完了後、指定された日に自動的に買い付けが実行されます。設定の変更や解除も同様の流れで簡単に行っていただけます。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 5b064301-b6c6-538e-b9c3-a843ac833fa9
  title: 投資信託の積立：明細や記録と合わない
  body: '「積立金額と口座残高の変動額が一致しない」というお問い合わせへの対応手順です。


    【想定原因と確認事項】

    1. 約定日のズレ：投資信託は注文日と約定日（価格が決まる日）が異なります。明細上の日付が「注文日」か「約定日」かを確認してください。

    2. カード決済のタイミング：クレジットカード積立の場合、決済日と実際に基金が買い付けられる日にタイムラグが生じます。カード明細の請求日と、口座への反映日を照合してください。

    3. 信託報酬の差し引き：投資信託の運用管理費用は、基準価額に日々反映されるため、純粋な積立額とは異なる変動となります。


    【対応】

    上記で解決しない計算上の不整合が認められる場合は、詳細な取引ログを抽出するため、専任の担当者へエスカレーションし、精査した結果を報告いたします。'
  domain: brokerage_investing
  product_category: toshin_tsumitate
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 0bf15f62-966b-5b2d-a83d-a424b9d7cf95
  title: 手数料・料金のご案内
  body: 星見証券では、お客様の長期的な資産形成を支援するため、業界最安水準の低コスト戦略を追求しております。国内株式の売買手数料を0円とするなど、投資効率を最大限に高める環境を提供いたします。なお、サービスの安定的な運営およびセキュリティ維持のためにのみ、一部の運営費用を設定させていただいております。
  domain: brokerage_investing
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 31558db1-0d48-5b05-9616-c9489201abd9
  title: よくあるご質問
  body: 'Q: サポートの対応時間と連絡方法は？

    A: 日本標準時の平日 9:00〜17:00 に、チャット、メール、およびWebフォームにて承っております。


    Q: 苦情や紛争が発生した場合はどうなりますか？

    A: 誠実かつ迅速に対応いたします。万一、社内での解決に至らない場合は、証券・金融商品あっせん相談センター（FINMAC）への案内を行います。'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 51ea7d42-5d4f-59be-bf39-61ffc6b6844f
  title: 法令・制度に関するご案内：株式・投資信託・NISA・iDeCo
  body: '星見証券は、金融庁および日本証券業協会の監督の下、適合性の原則を遵守し、お客様の最善の利益を追求しております。お客様の資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり最大1,000万円まで補償されます。ただし、相場の変動による元本割れは補償対象外となりますので、あらかじめご了承ください。


    また、弊社は投資制度の解説や一般的な資産形成の教育は行いますが、個別の税務助言、法的助言、および特定の銘柄の売買推奨は一切行いません。お客様が自らの判断で投資決定を行うための情報提供に徹し、元本保証がないリスクを提示いたします。'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 6a57e4f6-035f-5a1c-9eee-2e58d124c77c
  title: get_positions を使う場面
  body: 'お客様の保有資産や現在のポジションを確認する場合に `get_positions` を使用します。


    1. まず、`verify_identity` を呼び出し、お客様の本人確認を完了させてください。

    2. 次に、`get_accounts` を使用して、お客様の口座番号（下4桁など）から正確な口座IDを特定します。

    3. 特定した口座IDを引数として `get_positions` を実行し、保有銘柄、数量、評価額などの情報を取得します。


    これにより、お客様の現在の資産状況に基づいた正確な案内が可能になります。取得した情報は機密性が高いため、取り扱いには十分ご注意ください。'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: hoshimi_securities
