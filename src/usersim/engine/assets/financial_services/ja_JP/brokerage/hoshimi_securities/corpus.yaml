- id: 30ca5b19-4d2e-52b8-b054-b9f131323367
  title: cancel_order を使う場面
  body: '顧客から注文の取消依頼があった際の手順は以下の通りです。


    1. verify_identityを用いて本人確認を完了させます。

    2. get_accountsを呼び出し、顧客が提示した口座番号の下4桁から、正確な口座IDを特定します。

    3. 取消対象となる注文IDを確認します。注文IDが不明な場合は、get_order_statusを用いて現在の注文状況を確認してください。

    4. cancel_orderツールを実行し、注文の取消処理を完了させます。


    なお、すでに約定済みの注文は取消できません。状況確認の詳細については、「get_order_status を使う場面」をご参照ください。'
