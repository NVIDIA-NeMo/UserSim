- id: 9a97bbf3-9b31-5ff4-bf11-572676dfda4e
  title: NISA（成長投資枠）：この商品をかたる詐欺にご注意ください
  body: 'NISA（成長投資枠）の非課税メリットを悪用し、「必ず利益が出る」「元本を保証して高利回りを約束する」といった勧誘を行う詐欺が発生しています。星見証券では、適合性の原則に基づき、元本保証のないリスクを十分に提示しており、特定の銘柄の売買推奨や、確実な利益を保証する案内は一切行いません。


    また、当社がお客様のパスワードや多要素認証のコードを、電話やメールでお伺いすることはございません。不審な連絡を受けた場合は、直ちに社内規定に基づいた調査を行うため、当社までご連絡ください。万一、不正利用の疑いがある場合は、資産保護のため直ちに口座を凍結いたします。'
