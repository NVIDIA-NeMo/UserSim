- id: fc06570e-3c10-5a6e-9aca-3720910e3dc4
  title: 特定口座（源泉徴収あり）：リスクについてのご説明
  body: '特定口座（源泉徴収あり）を通じた投資には、以下のリスクが伴います。十分にご理解の上、ご自身の判断で投資決定を行ってください。


    【元本割れのリスク】

    投資信託や株式は価格が変動するため、投資した金額を下回る（元本割れする）可能性があります。相場の変動による元本割れは、いかなる場合も補償対象外となります。


    【資産の保護について】

    お客様の資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【税務上の注意】

    本口座は20.315%の税率で源泉徴収を行いますが、他の金融機関での損益通算を希望される場合は、別途確定申告が必要となります。元本保証がないリスクを十分にご認識ください。'
