- id: fa9c9d9c-baa3-5f4f-8d3a-97c1e5915093
  title: NISA（つみたて投資枠）：ご利用開始までの手順
  body: 'お客さまがNISA（つみたて投資枠）の利用を開始するまでのフローは以下の通りです。サポート担当者はこの手順に沿って案内してください。


    1. 口座開設の申請：マイナンバー届出を含む厳格な本人確認プロセスを完了していただきます。

    2. NISA口座の開設：税務署への申請を行い、非課税口座を開設します。

    3. 積立設定：投資対象の選択と、月々の積立金額（最低100円から）を設定します。

    4. 運用開始：設定した金額が自動的に積み立てられ、長期・分散投資が開始されます。


    全工程において、デジタルチャネルでの迅速な対応を心がけてください。'
