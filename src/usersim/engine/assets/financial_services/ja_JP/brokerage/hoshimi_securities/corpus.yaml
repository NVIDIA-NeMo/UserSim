    ※ご加入の年金制度により上限が異なります。


    【最低拠出金額】

    ・月額5,000円から設定いただけます。


    【重要な制限と注意事項】

    ・原則として、積み立てた資産は60歳まで引き出すことができません。資金の流動性が制限されるため、中長期的な資産形成を目的とした運用をお願いいたします。

    ・適合性の原則に基づき、お客様の投資経験や目的に照らして適切な商品をご提案しますが、相場変動により元本を割り込むリスクがあることを十分にご理解ください。'
