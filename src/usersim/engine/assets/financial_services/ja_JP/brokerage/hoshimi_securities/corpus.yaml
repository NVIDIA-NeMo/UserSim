- id: fee49004-9294-5d3e-82e3-5893ecb5f0c1
  title: NISA（成長投資枠）：年間投資枠について
  body: 'Q：NISA（成長投資枠）で1年間に投資できる上限額はいくらですか？

    A：年間投資枠は2,400,000円です。この枠内での買い付け分について、譲渡益および配当金が非課税となります。


    Q：年間の枠を使い切った場合はどうなりますか？

    A：その年はそれ以上の非課税買い付けはできません。翌年1月1日に再び2,400,000円の枠が設定されます。詳細については「NISA（成長投資枠）：商品概要」をご確認ください。'
