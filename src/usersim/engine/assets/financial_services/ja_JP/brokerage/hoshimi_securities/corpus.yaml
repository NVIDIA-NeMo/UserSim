- id: b8bc1f8e-7078-5f2f-a942-3c15b8fa18a2
  title: NISA（つみたて投資枠）：お申込みとご利用開始
  body: 'NISA（つみたて投資枠）のご利用開始までの手順をご案内します。


    1. マイナンバーの届出：口座開設時、または追加届出としてマイナンバーカード等の本人確認書類をご提示ください。

    2. NISA口座開設の依頼：弊社担当へNISA口座の開設を依頼してください。適合性の原則に基づき、お客様の投資目的に照らして適切なご案内をいたします。

    3. 多要素認証の実施：資産状態を変化させる操作となるため、認証アプリやSMSによる本人確認を実施してください。

    4. 積立設定の完了：投資信託の銘柄と、100円からの積立金額、振替日を指定してください。


    以上のステップが完了し、弊社から開設完了の通知をお受け取りいただいた後、次回の積立指定日から運用が開始されます。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: 903ec186-f725-505e-a2b6-8a70f8bc6f2a
  title: NISA（つみたて投資枠）：手数料一覧
  body: '星見証券は、お客様の長期的な資産形成を阻害しない低コスト戦略を追求しております。


    ・NISA口座開設手数料：0円

    ・つみたて投資枠による買い付け手数料：0円

    ・口座維持管理手数料：0円


    ※投資信託自体の信託報酬（運用管理費用）は、各銘柄の目論見書に記載された料率が適用されます。'
