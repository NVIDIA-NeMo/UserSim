  title: iDeCo（個人型確定拠出年金）：安全にご利用いただくためのポイント
  body: 'お客様の資産を守るため、以下の点にご注意ください。星見証券では、出金や口座情報の変更など、資産の状態を変化させる操作の前に、必ず多要素認証による本人確認を実施します。パスワードや認証コードをメールや電話で伺うことはございません。


