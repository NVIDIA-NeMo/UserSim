- id: 7bf1e113-644e-5d52-ba5a-e41c5668c26e
  title: NISA（成長投資枠）：規定・約款の変更
  body: '本規定は、NISA（成長投資枠）の運用に関する約款の変更について定めたものです。


    第1条（投資枠の遵守）

    お客様は、年間投資枠2,400,000円および非課税保有限度額（生涯投資枠）12,000,000円の範囲内で取引を行う義務を負います。これらの限度額を超えた取引は、税法上の規定に基づき制限されます。


    第2条（手数料の変更）

    国内株式の売買手数料0円を含む手数料体系は、市場環境や運営コストの変化に基づき、当社が適宜変更することがあります。変更の際は、事前にWebサイトおよびメールにて通知いたします。


    第3条（契約の終了）

    口座の解約または制度の変更により本契約が終了する場合、非課税保有限度額の再利用に関する処理は、法令および日本証券業協会の指針に従って行われます。'
