- id: 80cade76-e12a-5de0-9322-c909f7468fc3
  title: NISA（つみたて投資枠）：当社の似た商品との比較
  body: '「NISA（つみたて投資枠）」と「NISA（成長投資枠）」の主な違いは以下の通りです。


    ・つみたて投資枠：100円からの積立投資に特化し、年1,200,000円まで投資可能。長期・分散投資を重視される方に最適です。

    ・成長投資枠：個別株や多様な投資信託に柔軟に投資でき、年2,400,000円まで投資可能。より積極的な資産運用を希望される方向けです。


    どちらの枠も非課税で運用できますが、資産形成の基盤作りには「つみたて投資枠」を推奨いたします。'
  domain: brokerage_investing
