- id: a71f7d61-84b2-59c1-86ff-c31cd909e8db
  title: 投資信託の積立：リスクについてのご説明
  body: '「投資信託の積立」をご利用いただく前に、以下のリスクについて十分にご確認ください。


    本サービスで取り扱う投資信託は、元本を保証するものではありません。市場価格の変動により、投資した金額を下回る（元本割れ）可能性があります。相場の変動による損失は、日本投資者保護基金の補償対象外となりますので、あらかじめご了承ください。


    当社は適合性の原則に基づき、お客さまの知識、経験、財産状況、投資目的に照らして適切な情報提供に努めますが、個別の銘柄推奨や法的・税務的助言は行いません。投資決定は、提示されたリスクを十分にご理解いただいた上で、お客さまご自身の判断で行っていただきますようお願い申し上げます。'
