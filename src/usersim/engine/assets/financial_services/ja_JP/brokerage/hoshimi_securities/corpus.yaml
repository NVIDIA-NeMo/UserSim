- id: fadfb801-0bed-501d-8dc3-16a666d576d2
  title: NISA（つみたて投資枠）：重要事項のご説明
  body: '【元本保証について】

    本制度で購入される投資信託は、相場の変動により元本を割り込むリスクがあります。元本保証はされておりません。


    【資産の保護】

    お客様の資産は、弊社資産とは明確に分けて管理する「分別管理」を徹底しております。万一の場合には、日本投資者保護基金により1人当たり1,000万円まで補償されます。


    【適合性の原則】

    弊社は、お客様の知識、経験、財産の状況、および投資目的に照らして不適当な勧誘を行わない「適合性の原則」を遵守し、お客様の最善の利益を追求します。'
  domain: brokerage_investing
  product_category: nisa_tsumitate
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hoshimi_securities
- id: b316a71b-0737-55e5-ba3b-ed4a3b502400
  title: NISA（つみたて投資枠）：金利・料率一覧
  body: '【適用税率】

    ・運用益および配当金への課税：0%


    通常、特定口座（源泉徴収あり）では20.315%の税率で課税されますが、NISA（つみたて投資枠）で保有する商品から得られる利益はすべて非課税となります。


    【適用条件】

    本制度の年間投資枠（1,200,000円）および非課税保有限度額（18,000,000円）の範囲内で保有している場合に限り、この税率が適用されます。'
