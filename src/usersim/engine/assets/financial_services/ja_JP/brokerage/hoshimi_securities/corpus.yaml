- id: be2305ce-ebaf-5343-8d8f-f33917c96d7a
  title: NISA（成長投資枠）：ほかの選択肢との比較と向かない場合
  body: 'NISA（成長投資枠）と他の口座の比較および留意点は以下の通りです。


    【特定口座との比較】

    特定口座では利益に20.315%の税率で課税されますが、NISA（成長投資枠）では非課税で運用可能です。ただし、NISAの非課税保有限度額は総枠18,000,000円（うち成長投資枠12,000,000円）のため、それを超える資産運用を希望される場合は特定口座の併用が最適です。


    【向かないケース】

    ・短期間で頻繁に全資産を現金化し、生涯限度額を何度も再利用したい方（非課税枠の再利用にはルールがあるため）。

    ・投資における元本保証を最優先される方（相場変動による元本割れリスクがあるため）。'
