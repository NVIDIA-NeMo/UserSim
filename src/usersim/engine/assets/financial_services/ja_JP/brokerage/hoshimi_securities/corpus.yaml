- id: ba9e6930-5370-57a7-ba1c-01b499ba7c7d
  title: 特定口座（源泉徴収あり）：重要事項のご説明
  body: '【資産の管理と保護】

    お客様の資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、相場の変動による元本割れは補償対象外となりますので、十分にご注意ください。


    【税務上の取扱い】

    本口座では20.315%の税率で源泉徴収を行います。損失が発生し、それを翌年以降に繰り越して相殺する場合（損失繰越控除）は、最大3年まで適用されますが、この権利を享受するためには確定申告が必要です。


    【リスク】

    投資商品には価格変動リスクがあり、元本が保証されておりません。お客様は、ご自身の判断と責任において投資決定を行ってください。'
