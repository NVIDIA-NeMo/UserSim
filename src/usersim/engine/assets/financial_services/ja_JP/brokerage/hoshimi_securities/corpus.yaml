- id: b16ece89-69c8-5562-83b7-7247a10359fa
  title: 特定口座（源泉徴収あり）：お申込みとご利用条件
  body: 'Q：口座開設にあたって必要なものはありますか？


    A：厳格な本人確認のため、マイナンバーの届出が必須となります。


    Q：どのような方が利用できますか？


    A：適合性の原則に基づき、お客様の知識、経験、財産の状況および投資目的に照らして、適切に運用いただける方にご提供しております。詳細は「特定口座（源泉徴収あり）：お申込みいただける方」をご確認ください。'
