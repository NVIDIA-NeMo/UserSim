- id: e33f4b56-b71d-5751-a445-7a86748bb34d
  title: 特定口座（源泉徴収あり）：ご利用開始までの手順
  body: '特定口座（源泉徴収あり）の開設にあたり、サポート担当者は以下の手順でお客様を案内してください。


    1. お申込みの受付：お客様に必要事項の入力と、マイナンバー届出の提出を依頼します。マイナンバーの届出は口座開設の必須条件です。

    2. 本人確認プロセスの実施：厳格な本人確認を実施し、審査を行います。

    3. 多要素認証の設定：資産を操作する際に必須となる多要素認証の設定を案内します。

    4. 口座開設完了の通知：審査完了後、口座開設が完了した旨を通知します。これにより、国内株式手数料0円での取引が可能となります。


    手続きの詳細については「特定口座（源泉徴収あり）：登録内容の変更」も併せてご参照ください。'
