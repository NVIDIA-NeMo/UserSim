- id: 50e0c1ef-4daf-5da0-a0b2-a6eaa1a18c86
  title: 米国株式の取引：リスクについてのご説明
  body: '米国株式の取引には、以下のリスクが伴います。十分にご理解いただいた上で投資決定を行ってください。


    1. 価格変動リスク：株価の変動により、投資元本を割り込む可能性があります。元本は保証されておりません。

    2. 為替変動リスク：米ドル建て資産であるため、株価に変動がなくとも、円安・円高の為替変動により、日本円ベースでの評価額が変動します。

    3. 制度的リスク：米国市場のルール変更や税制変更の影響を受ける可能性があります。


    【資産の保護について】

    お客さまの資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。ただし、上述の相場変動による元本割れは補償の対象外となります。投資決定は、提供する情報を基に、お客さまご自身の判断で行っていただきます。'
