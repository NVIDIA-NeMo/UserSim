- id: 15abae44-779e-5c1e-9e7c-4e156a506099
  title: 投資信託の積立：お手続きが完了しない・保留中のまま
  body: '積立設定の手続きが完了せず、「保留中」の状態となっている場合に考えられる原因と対処法をご案内します。


    【考えられる原因】

    ・本人確認書類（マイナンバー）の不備または未提出

    ・クレジットカードの有効期限切れや限度額超過

    ・多要素認証のタイムアウト


    【確認および解決手順】

    1. 口座情報に最新のマイナンバーが正しく登録されているかご確認ください。

    2. ご利用のクレジットカードが有効であり、月間上限の100,000円を超えていないかご確認ください。

    3. 再度お手続きを行い、認証画面で速やかに多要素認証を完了させてください。


    上記を確認しても解決しない場合は、弊社にて詳細な調査を行います。状況を確認し、速やかに結果をご報告いたします。'
