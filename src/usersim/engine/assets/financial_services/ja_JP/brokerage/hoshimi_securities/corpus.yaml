- id: 25414400-f34d-5189-b627-7b148b86b710
  title: NISA（成長投資枠）：限度額・制限と注意事項
  body: 'NISA（成長投資枠）の運用に関する限度額および制限事項は以下の通りです。


    ・年間投資枠：最大2,400,000円まで投資可能です。

    ・非課税保有限度額（生涯限度額）：最大12,000,000円まで非課税で保有いただけます。


    【注意事項】

    ・相場の変動により元本を割り込む可能性があります。元本割れは補償対象外となります。

    ・顧客資産は分別管理されており、万一の際は日本投資者保護基金により1人当たり1,000万円まで補償されます。

    ・出金や口座情報の変更など、資産の状態を変化させる操作の前には、必ず多要素認証による本人確認を実施いたします。'
