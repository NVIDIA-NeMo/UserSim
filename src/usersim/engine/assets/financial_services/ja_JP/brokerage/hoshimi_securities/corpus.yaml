  title: NISA（成長投資枠）：必要書類
  body: 'NISA（成長投資枠）の開設には、以下の書類が必要です。


    ・マイナンバーカード：必須（表面および裏面）。本人確認書類およびマイナンバー届出として兼用いただけます。

    ・通知カード ＋ パスポート/運転免許証：マイナンバーカードをお持ちでない場合に必要です。


    これらをご提示いただき、厳格な本人確認プロセスを完了させることで口座開設が可能となります。'
