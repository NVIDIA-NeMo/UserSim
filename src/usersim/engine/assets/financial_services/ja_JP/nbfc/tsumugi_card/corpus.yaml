  institution_id: tsumugi_card
- id: 3743e96f-4a64-5694-9f6e-e23b513a54fd
  title: つむぎカード：明細や記録と合わない
  body: 'お客様から「請求金額が利用した金額と異なる」「身に覚えのない請求がある」とのお問い合わせを受けた際の対応手順です。


    **【原因の切り分けと確認事項】**

    1.  **未確定取引の確認**: 仮売上（オーソリゼーション）の状態であり、確定後の金額が変動する場合があるため、最新の確定明細を確認してください。

    2.  **返金処理のタイミング**: キャンセルや返品が行われた場合、処理に時間を要し、次月以降の明細に相殺されることがあります。

    3.  **利用店舗名の相違**: 店舗名ではなく、決済代行会社の名称で記載されている場合がございます。利用日時と金額から照合してください。


    **【解決とエスカレーション】**

    *   確認しても不一致が解消されない場合は、至急「不正利用」の可能性を疑い、カードの停止を検討してください。

    *   正当な理由をもって支払いを拒む「支払停止の抗弁」に該当する場合は、速やかに専門のコンプライアンス担当者へエスカレーションし、日本クレジット協会とも連携した誠実な解決を図ります。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
