  title: キャッシング：実施中のキャンペーン
  body: '**【ATM利用手数料 特別還元キャンペーン】**


    日頃のご愛顧に感謝し、キャッシングの利便性をより実感していただくためのキャンペーンを実施いたします。


    - **期間**：2026年4月1日 〜 2026年6月30日

