    - account_id: 対象アカウントの識別子

    - amount: 繰上返済を行う金額（例：10,000円）


    【効果】

    オペレーターが本ツールを直接実行することで、指定された金額の繰上返済予約が行われ、手数料の軽減処理に繋がります。'
