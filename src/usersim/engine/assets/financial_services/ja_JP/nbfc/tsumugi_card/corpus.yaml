- id: c31a282c-cac2-5448-b55a-cdc78fb3f821
  title: request_limit_change を使う場面
  body: 'お客様から、ショッピング枠やキャッシング枠の利用限度額を変更したいというご要望をいただいた際に本手続きを行います。増枠（限度額を上げる）と減枠（限度額を下げる）の両方に対応します。


    **手続きの流れ**

    1. 多要素認証等を用いて、お客様の本人確認を厳格に実施します。

    2. `get_accounts` を使用し、お客様のカード番号の下4桁などから該当する account_id を特定します。

    3. 変更を希望される枠（ショッピング枠またはキャッシング枠）と、具体的な希望金額を確認します。

    4. **増枠の場合**は、審査が必要となる旨を事前にお伝えください。

    5. `request_limit_change` を呼び出し、変更申請を完了させます。


    限度額の詳細は、「つむぎカード：限度額・制限と注意事項」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_limit_change
  institution_id: tsumugi_card
- id: f14f35ed-455f-59cb-80e5-b244a7cdc4a1
  title: request_limit_change ツールリファレンス
  body: 'オペレーターが `request_limit_change` ツールを直接呼び出すことで、お客様の利用限度額の変更申請を行います。


    **引数**

    - `account_id`: `get_accounts` 等で特定した、対象口座の識別子です。

    - `limit_type`: 変更対象の枠を指定します（ショッピング枠またはキャッシング枠）。

    - `new_limit_amount`: 変更後の希望限度額を数値（円）で指定します。


    **効果**

    指定された口座の限度額変更申請が受理されます。増枠申請の場合は、社内審査を経て結果が通知されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_limit_change
  institution_id: tsumugi_card
- id: b910f72c-fa50-5e9f-94d1-962eed58ab03
  title: get_loan_details を使う場面
  body: "お客様が、現在の借入状況や今後の返済計画を確認したいと希望された際に本手続きを行います。キャッシングおよび「つむぎカードローン」の両方の詳細を確認いただけます。\n\
    \n**手続きの流れ**\n1. 多要素認証等を用いて、お客様の本人確認を実施します。\n2. `get_accounts` を使用し、お客様の account_id\
    \ を特定します。\n3. `get_loan_details` を呼び出し、以下の情報を取得します。\n    - 現在の借入残高（円）\n    - 適用されている金利（%）\n\
    \    - 次回の返済日および返済予定額（円）\n4. 取得した内容を、丁寧にお客様へご案内します。\n\n金利の詳細については、「つむぎカードローン：金利・料率一覧」をご確認ください。"
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: tsumugi_card
- id: 5c9b9fe5-e1ab-5c49-8231-0a6a384cf364
  title: get_loan_details ツールリファレンス
  body: 'オペレーターが `get_loan_details` ツールを直接呼び出すことで、借入に関する最新の詳細情報を取得します。


    **引数**

    - `account_id`: `get_accounts` 等で特定した、対象口座の識別子です。


    **効果**

    指定された口座に紐づくキャッシングおよびカードローンの借入残高、適用金利、次回返済日、次回返済額を返します。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_loan_details
  institution_id: tsumugi_card
- id: 3ca58642-2193-57e5-b22f-a1846968667f
  title: apply_loan を使う場面
  body: 'お客様から「つむぎカードローン」の新規申し込みを承る際に本手続きを行います。


    **手続きの流れ**

    1. 多要素認証等を用いて、お客様の本人確認を実施します。

    2. `get_accounts` を使用し、お客様の account_id を特定します。

    3. ご希望の借入金額を確認します。

    4. **総量規制の確認**: 貸金業法に基づき、借入合計額が原則として年収の3分の1までとなるよう、支払可能見込額の調査を行います。

    5. `apply_loan` を呼び出し、申し込み手続きを完了させます。


    **注意点**

    本手続きは申し込みであり、最終的な融資可否は審査の結果に基づきます。詳細は「つむぎカードローン：お申込みいただける方」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: tsumugi_card
- id: e40cddfa-53b6-55fa-bb71-5679ce22665f
  title: apply_loan ツールリファレンス
  body: 'オペレーターが `apply_loan` ツールを直接呼び出すことで、「つむぎカードローン」の申し込み手続きを行います。


    **引数**

    - `account_id`: `get_accounts` 等で特定した、対象口座の識別子です。

    - `requested_amount`: お客様が希望される借入金額を数値（円）で指定します。


    **効果**

    ローン申し込みが受理され、審査プロセスに移行します。審査通過後、指定の口座へ融資が行われます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: tsumugi_card
- id: 9d62b3ce-b009-519b-b35f-fa4510d299a7
  title: pay_emi を使う場面
  body: '口座引落しができなかった月の支払いや、キャッシング・「つむぎカードローン」の返済を、振込やATMを通じて行いたいというお客様のご要望に対応する際に本手続きを行います。


    **手続きの流れ**

    1. 多要素認証等を用いて、お客様の本人確認を実施します。

    2. `get_accounts` を使用し、お客様の account_id を特定します。

    3. 今回お支払いいただく金額（円）および、支払い方法（振込またはATM）を確認します。

    4. `pay_emi` を呼び出し、返済手続きを受け付けます。


    返済に関するその他の詳細は、「つむぎカードローン：よくあるお手続きの流れ」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: tsumugi_card
- id: 723870eb-c2f5-52a5-9cd2-f07dc26e9fd8
  title: pay_emi ツールリファレンス
  body: 'オペレーターが `pay_emi` ツールを直接呼び出すことで、未払金やローンの個別返済手続きを処理します。


    **引数**

    - `account_id`: `get_accounts` 等で特定した、対象口座の識別子です。

    - `payment_amount`: 返済する金額を数値（円）で指定します。

    - `payment_method`: 支払い手段（「振込」または「ATM」）を指定します。


    **効果**

    指定された金額の返済手続きが受理され、残高に反映されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: tsumugi_card
- id: f90824b1-6446-59a6-b4bf-d791eecc8260
  title: foreclose_loan を使う場面
  body: 'お客様が、キャッシングや「つむぎカードローン」の借入残高をすべて一括で返済したい（完済したい）と希望された際に本手続きを行います。


    **手続きの流れ**

    1. 多要素認証等を用いて、お客様の本人確認を実施します。

    2. `get_accounts` を使用し、お客様の account_id を特定します。

    3. `get_loan_details` を呼び出し、現在の正確な借入残高（円）を確認します。

    4. お客様に一括返済に必要な総額を提示し、同意を得ます。

    5. `foreclose_loan` を呼び出し、一括返済手続きを完了させます。


    一括返済後は、当該借入枠の残高が0円となります。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: tsumugi_card
- id: cecc2749-f070-54b8-a9d6-6713c2ce38d0
  title: foreclose_loan ツールリファレンス
  body: 'オペレーターが `foreclose_loan` ツールを直接呼び出すことで、借入残高の全額返済（一括返済）を処理します。


    **引数**

    - `account_id`: `get_accounts` 等で特定した、対象口座の識別子です。


    **効果**

    指定された口座のキャッシングおよびカードローンの全残高が返済され、完済状態となります。この操作は不可逆的な手続きです。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: tsumugi_card
- id: 08a5fb9a-9b4a-59b0-9190-c8f6535ff184
  title: update_repayment_mandate を使う場面
  body: 'お客様が、つむぎカードの月々の支払いに利用する引落口座を変更したい場合に本手続きを行います。口座変更を適切に行わない場合、支払遅延が発生し、信用情報に影響を及ぼす可能性があるため、迅速かつ正確に処理してください。


    【手続き手順】

    1. 多要素認証等を用いて、お客様の本人確認を厳格に実施します。

    2. ツール get_accounts を使用し、お客様が保有するカードの account_id を特定します。

    3. 新しい引落口座の情報（金融機関名、支店名、口座種別、口座番号、名義人）を確認します。

    4. ツール update_repayment_mandate を呼び出し、口座情報を更新します。


    **注意点：**

    *   変更のタイミングによっては、次回の支払いに反映されない場合があります。その際は、お客様に最新の支払日にご注意いただくよう案内してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: tsumugi_card
- id: 44d3c002-50f6-5ec7-8adf-9d9d4ce2b141
  title: update_repayment_mandate ツールリファレンス
  body: '指定された口座の引落設定を更新します。エージェントはこのツールを直接呼び出すことで、外部サイトへ誘導することなく口座変更を完了させます。


    【引数】

    *   account_id: 対象となるカード口座の識別子（get_accounts で取得）。

    *   bank_details: 新しい引落口座の詳細情報。


    【効果】

    月々の支払いに利用される金融機関口座が更新されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: tsumugi_card
- id: 6e0d9c4e-5185-5a1d-8a68-c2ec9a94b16f
  title: update_beneficiary を使う場面
  body: 'つむぎカードローンの融資金（借入金）を受け取るための振込先口座を変更したい場合に本手続きを行います。融資金の誤送金を防ぐため、情報の整合性を十分に確認してください。


    【手続き手順】

    1. 多要素認証等を用いて、お客様の本人確認を厳格に実施します。

    2. ツール get_accounts または get_loan_details を使用し、対象となる loan_id を特定します。

    3. 融資金の振込先として希望される新しい口座情報を確認します。

    4. ツール update_beneficiary を呼び出し、振込先口座を更新します。


    **注意点：**

    *   振込先口座の名義人は、必ずご本人様である必要があります。他名義への変更は原則として認められませんのでご注意ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: tsumugi_card
- id: e6cb9fd4-7f54-58a4-9d4f-92daa9ba1a11
  title: update_beneficiary ツールリファレンス
  body: 'ローン融資金の振込先口座を更新します。エージェントはこのツールを直接呼び出すことで、手続きを完結させます。


    【引数】

    *   loan_id: 対象となるローンの識別子。

    *   new_account_details: 新しい振込先口座の詳細情報。


    【効果】

    つむぎカードローンでの借入時に、融資金が振り込まれる口座が変更されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: tsumugi_card
- id: f250a3db-250a-5955-bee7-356782f283b4
  title: open_account を使う場面
  body: 'つむぎカードの家族カードの追加発行、またはETCカードの発行を希望される場合に本手続きを行います。家族カードの発行には、本会員様の同意と家族の方の基本情報の提供が必要です。


    【手続き手順】

    1. 多要素認証等を用いて、本会員様の本人確認を厳格に実施します。

    2. ツール get_accounts を使用して、本会員様の account_id を特定します。

    3. 発行希望のカード種別（家族カードまたはETCカード）と、必要となる申込者情報（氏名、生年月日、連絡先など）を確認します。

    4. ツール open_account を呼び出し、追加発行の申し込みを完了させます。


    **注意点：**

    *   家族カードの利用限度額は、本会員様の限度額の範囲内で設定されます。審査の結果、発行できない場合があることをあらかじめお伝えください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tsumugi_card
- id: 317039fc-9306-5be3-b382-734f35528abb
  title: open_account ツールリファレンス
  body: '家族カードやETCカードの追加発行申し込みを行います。エージェントはこのツールを直接呼び出し、申し込み処理を完結させます。


    【引数】

    *   primary_account_id: 本会員様の口座識別子。

    *   card_type: 発行するカードの種類（例：家族カード、ETCカード）。

    *   applicant_details: 申込者の氏名、生年月日等の詳細情報。


    【効果】

    指定された種類のカード発行手続きが開始されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tsumugi_card
- id: f0345870-bdd3-5165-b028-5ddda4a12cdc
  title: close_account を使う場面
  body: 'お客様が、つむぎカードの解約（退会）を希望される場合に本手続きを行います。解約後も、未精算の残高がある場合は支払いが継続することを明確に説明してください。


    【手続き手順】

    1. 多要素認証等を用いて、お客様の本人確認を厳格に実施します。

    2. ツール get_accounts を使用し、解約対象の account_id を特定します。

    3. 現在の利用残高（リボ払い、分割払い、キャッシング等の残高）を確認し、解約後もこれらの支払いは続くことをお客様に承諾いただきます。

    4. ツール close_account を呼び出し、解約手続きを完了させます。


    **注意点：**

    *   解約手続きは不可逆的な操作です。一度完了すると、同一カードの再開はできず、新規申し込みとして審査が必要になることを案内してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tsumugi_card
- id: 9955ebc1-fa67-589e-bfa4-bfd5777c83b8
  title: close_account ツールリファレンス
  body: '指定されたカード口座を解約します。エージェントはこのツールを直接呼び出し、解約処理を実行します。


    【引数】

    *   account_id: 解約対象となる口座の識別子。


    【効果】

    カードの利用権限が消滅し、口座が解約されます。ただし、既存の借入金やリボ・分割の残高がある場合は、完済まで支払義務が継続します。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tsumugi_card
- id: f00c1182-0d11-517c-9dc5-810697b7cecb
  title: get_accounts を使う場面
  body: 'お客様が保有するカード口座の情報を確認し、個別の account_id を特定する場合に本手続きを行います。他の多くの変更手続きにおいて、正しい口座を特定するための前提ステップとして利用します。


    【手続き手順】

    1. 多要素認証等を用いて、お客様の本人確認を厳格に実施します。

    2. ツール get_accounts を呼び出し、お客様に紐づく口座一覧を取得します。

    3. 提示された一覧から、お客様が操作を希望しているカード（例：カード番号の下4桁等で照合）の account_id を特定します。


    **注意点：**

    *   複数のカードを保有しているお客様の場合、誤った口座を操作すると重大な問題につながるため、必ずお客様にどのカードに関する手続きかを確認し、照合してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tsumugi_card
- id: afb193d0-2ddf-5386-9843-3cdba7aebdf7
  title: get_accounts ツールリファレンス
  body: 'お客様に紐づくすべての口座情報を取得します。エージェントはこのツールを呼び出し、後続の手続きに必要な account_id を特定します。


    【引数】

    *   なし（現在認証済みのユーザーコンテキストに基づいて取得されます）。


    【効果】

    保有しているカードのリストと、それぞれの account_id が返されます。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tsumugi_card
- id: bdfd9bc4-70cf-54bb-8a46-7333f8815287
  title: update_contact_info を使う場面
  body: 'お客様のご住所、電話番号、メールアドレスなどのご連絡先変更を承る際に本手続きを行います。


    1. 多要素認証を用いて、厳格な本人確認を完了させます。

    2. `get_accounts` を使用し、対象となるアカウントの account_id を特定します。

    3. 変更後の正確なご連絡先情報を、お客様から直接伺い確認します。

    4. `update_contact_info` を呼び出し、登録情報を最新の状態に更新します。


    登録内容の変更に関する一般的な流れについては、「つむぎカード：登録内容の変更」をご参照ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tsumugi_card
- id: 343613d4-8f99-5dd7-b921-f62d7e8d8fdd
  title: update_contact_info ツールリファレンス
  body: '`update_contact_info` は、お客様の登録連絡先情報を更新するツールです。


    引数：

    - account_id：対象アカウントの識別子

    - 更新後の連絡先詳細：新しい住所、電話番号、メールアドレスなどの情報


    エージェントがこのツールを直接呼び出すことで、システム上の登録情報を即時に書き換えます。'
