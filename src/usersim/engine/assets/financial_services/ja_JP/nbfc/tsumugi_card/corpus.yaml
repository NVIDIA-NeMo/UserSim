- id: 24525dac-8268-50e3-8044-ff4ebc8c8513
  title: 分割払い：金利・料率の決まり方と適用
  body: '「分割払い」に適用される金利・料率の決定方法についてご案内いたします。


    **適用利率の範囲**

    本サービスでは、実質年率12%から15%の範囲内で利率を設定しております。


    **利率の決定要因**

    具体的な適用利率は、お客様の信用状況、年収、既存の借入状況などの審査結果に基づき、個別に決定されます。一度決定した利率は、原則としてそのお取引の完了まで適用されます。


    **特例手数料**

    3回払いをご利用の場合、利用金額100円あたり2.01円の手数料を適用しております。これにより、短期間の分割利用におけるコストを明確にしています。'
