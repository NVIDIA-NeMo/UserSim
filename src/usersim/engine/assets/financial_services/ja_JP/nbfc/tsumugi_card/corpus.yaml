- id: 4b63bc93-1d78-54c5-bf91-40f7d7c82521
  title: つむぎカード：解約・変更・プランの切替え
  body: 'つむぎカードの解約や、登録情報の変更、プランの切替えをご希望の方は、以下の手順で手続きを行ってください。


    1.  **お手続き内容の提示**：解約、または変更したい内容（住所、氏名、プラン等）を当社にお伝えください。

    2.  **本人確認の実施**：セキュリティ保護のため、多要素認証による厳格な本人確認を行います。画面の指示に従って認証を完了させてください。

    3.  **内容の確認と承諾**：変更後の条件や、解約に伴うカード利用停止についてのご案内を確認し、承諾いただきます。

    4.  **完了通知の受領**：お手続きが完了すると、確認の通知が届きます。これにより、正式に変更または解約が適用されたことになります。


    なお、解約時点での年会費（1,375円）の取り扱いについては、ご契約時期により異なります。詳細は担当者までお問い合わせください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 82271b8c-eb98-5d0d-b15e-2cd6222e3cfd
  title: つむぎカード：想定外の手数料・金額
  body: 'お客様より「身に覚えのない手数料が請求されている」とのご連絡をいただいた際は、以下の順序で確認を行ってください。


    **確認ステップ**

    1.  **固定費の確認**：年会費の**1,375円**、またはETCカード発行手数料の**550円**が請求タイミングで発生していないか確認します。

    2.  **支払い方法の確認**：1回払い以外の「リボ払い」や「分割払い」を選択されており、それに伴う信用供与手数料が発生していないかを確認します。

    3.  **利用明細の照合**：利用した店舗名や金額が、お客様の記憶と一致しているか照合します。


    **解決とエスカレーション**

    *   上記で解消しない場合、または不正利用の疑いがある場合は、速やかにカードを停止し、専門のコンプライアンス担当者へエスカレーションしてください。調査後、規定に基づいた補償手続きを案内します。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
