- id: 3a50ad86-c750-52bd-9a59-fe00a354d9df
  title: リボ払い：解約・変更・プランの切替え
  body: 'リボ払いの設定変更や解約の手順をご案内します。


    **【お手続きの流れ】**

    1.  **変更内容の提示**: カスタマーセンターへ、リボ払いの解約、または月々の支払額の変更（5,000円以上の金額への変更など）を伝えます。

    2.  **現状の確認**: 現在のリボ残高および、変更後に適用される支払スケジュールについて弊社よりご説明いたします。

    3.  **本人確認**: 多要素認証による厳格な本人確認を実施し、操作を承認します。

    4.  **完了通知**: 設定変更が完了した旨を、公式アプリまたはメールにて通知いたします。


    ※リボ払いを解約する場合、原則として残高を全額一括で返済いただく必要があります。詳細なプラン比較は「リボ払い：当社の似た商品との比較」をご参照ください。'
