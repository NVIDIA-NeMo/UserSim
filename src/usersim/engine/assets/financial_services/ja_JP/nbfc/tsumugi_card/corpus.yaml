  title: つむぎカードローン：プランの選び方
  body: '資金ニーズに合わせて、適切な商品をお選びください。


    **つむぎカードローン**

    大きな金額を計画的に返済したい方向けです。金利は年4.5%～18%で、最大5,000,000円までご利用いただけます。


    **キャッシング**

    ATM等で即座に小口の資金が必要な方向けです。


    返済能力に応じた誠実な提案をいたしますので、詳細は「つむぎカードローン：当社の似た商品との比較」をご参照ください。'
