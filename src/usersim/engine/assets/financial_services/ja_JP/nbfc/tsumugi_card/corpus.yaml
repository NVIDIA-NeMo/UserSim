  title: 分割払い：必要書類
  body: '「分割払い」を初めてご利用いただく際、または利用限度額の変更を伴う場合に必要となる書類は以下の通りです。


    *   **本人確認書類**: 運転免許証、マイナンバーカードなどの公的証明書（原本または有効な写し）

    *   **収入証明書類**: 源泉徴収票や確定申告書など（支払可能見込額の調査が必要な場合に提示をお願いしております）


    ※すでに「つむぎカード」をご利用中の方は、多くの場合、追加書類なしでご利用いただけます。'
