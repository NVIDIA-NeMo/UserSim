- id: 23c9699f-c9c9-5bce-9f3c-44a563b29c86
  title: つむぎカードローン：お取引が拒否された・制限された
  body: 'つむぎカードローンにおいて、借入や手続きが拒否された場合の原因と対処法をご案内いたします。


    **【考えられる原因】**

    * **利用限度額への到達：** 設定された限度額（最大5,000,000円）に達している場合、追加の借入はできません。

    * **お支払いの遅延：** 毎月の最低返済額4,000円のお支払いが滞っている場合、一時的に利用が制限されることがあります。

    * **セキュリティロック：** 短時間に不自然な操作があった場合、不正利用防止のため制限がかかる場合がございます。


    **【対処方法】**

    1. まずは最新の利用残高と、お支払いの状況をご確認ください。

    2. お支払いに遅延がある場合は、至急ご返済のお手続きをお願いいたします。

    3. それでも解決しない場合は、私たちに状況をお知らせください。本人確認の上、制限を解除できるか審査いたします。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 86269b52-e9fd-555a-8ba3-ed7af343aa1b
  title: つむぎカードローン：切替えや上位プランを検討するとき
  body: 'お客様が「キャッシング」から「つむぎカードローン」への切替えを検討される際は、以下の視点でご案内ください。


    キャッシングはATMでの即時利用に適した短期的な小口融資ですが、つむぎカードローンは最大5,000,000円までという大きな金額を、年4.5% ～ 18%という計画的な返済プランで利用できる点がメリットです。まとまった資金が必要で、より低金利で長期的に返済したいお客様には、つむぎカードローンが適しています。'
