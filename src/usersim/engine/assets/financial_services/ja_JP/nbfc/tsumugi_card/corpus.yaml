- id: 7faa2a9a-2333-56a0-bcc7-0a641f1e6f55
  title: 分割払い：不正利用からお客さまを守るために
  body: 'つむぎカードの「分割払い」をご利用いただく際は、安心してお買い物ができるよう、以下のセキュリティ対策を導入しております。


    **不正利用防止の取り組み**

    インターネットショッピングにおいては、EMV 3-Dセキュアなどの本人認証サービスを導入し、第三者による不正な決済を未然に防止しています。また、高額な決済を分割払いでご利用いただく場合など、不自然な利用パターンが検知された際は、多要素認証による厳格な本人確認を実施することがございます。


    **ご注意いただきたい点**

    つむぎカードから、メールや電話でカードの暗証番号やセキュリティコードを伺うことは決してございません。不審な連絡があった場合は、すぐにご連絡ください。


    **万が一のときは**

    カードの紛失や盗難、または身に覚えのない請求に気づいた場合は、直ちに利用停止の手続きをお願いいたします。規定に基づき、迅速な補償手続きを行います。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 0d368e7c-a0c6-51e4-8162-ba298d0cc5bc
  title: 分割払い：規定・約款
  body: '「分割払い」のご利用に関する規定および約款をご案内いたします。


    **1. サービス内容と支払回数**

    お客様は、加盟店でのショッピング利用時に、あらかじめ決められた回数で計画的に返済する「分割払い」を選択いただけます。最大支払回数は24回までとなっております。


    **2. 手数料（金利）の適用**

    分割払いのご利用には、実質年率12%から15%の範囲内で設定された手数料が課金されます。適用される具体的な利率は、審査結果に基づき決定いたします。


    **3. お支払い義務**

    お客様は、毎月定まった期日に、元金と所定の手数料を合わせてお支払いいただく義務を負います。支払いが遅延した場合、規定の遅延損害金が発生することがあります。


    **4. 契約の変更と終了**

    支払回数の変更や繰上返済を希望される場合は、所定の手続きが必要です。また、当社は法令に基づき、支払可能見込額の調査結果により利用を制限する場合があることをご了承ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e8d322f1-badd-5b1d-8460-56fe5cbfc840
  title: 分割払い：おすすめの方と主な使い方
  body: '「分割払い」は、高額な買い物をされた際に、月々の負担を抑えて計画的に返済したい方に最適なサービスです。


    **このような方におすすめです**

    *   家電製品や家具など、まとまった金額の買い物をされる方

    *   月々の家計の支出を一定に保ちながら、余裕を持って返済したい方

    *   リボ払いよりも、いつ完済できるかが明確なプランを好まれる方


    **主な使い方**

    お買い物時に「分割払い」を選択し、ご希望の回数（最大24回まで）をご指定ください。これにより、一度に全額を支払うのではなく、期間を分散して無理のない支払いを実現できます。


    **ご利用時のポイント**

    実質年率12%〜15%の手数料がかかりますが、あらかじめ返済計画が立てられるため、経済的な安心感を「紡ぐ」ことができます。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: a5d6e368-e0fa-5c77-b73c-1cd042caa297
  title: 分割払い：分割払いの手数料率（実質年率、上限）について
  body: '**Q: 分割払いを利用した際の手数料（実質年率）の上限はいくらですか？**


    A: 「分割払い」に適用される実質年率の上限は15%となっております。お客様の審査結果に基づき、12%から15%の範囲内で適用利率が決定いたします。


    詳細な金利の決まり方については、「分割払い：金利・料率の決まり方と適用」をご参照ください。'
