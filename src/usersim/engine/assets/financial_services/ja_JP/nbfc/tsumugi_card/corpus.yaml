- id: dd4a2604-30d2-505e-8cdb-c0c63f56043c
  title: 分割払い：登録内容の変更
  body: '「分割払い」に関する登録内容（ご連絡先やご請求先など）を変更する手順は以下の通りです。


    1. **変更内容の提示**：変更したい登録項目と、新しい内容を当社担当者へお伝えください。

    2. **本人確認の実施**：セキュリティ保護のため、多要素認証による本人確認を行います。画面に表示された指示に従い、認証を完了させてください。

    3. **変更内容の確認**：担当者が変更内容を復唱し、間違いがないか最終確認を行います。

    4. **完了通知の受領**：手続き完了後、登録内容が更新された旨の通知が届きますので、内容をご確認ください。


    ※お支払い回数の変更（例：24回から12回への変更）を希望される場合は、別途審査が必要となる場合がございます。その際は「分割払い：商品概要」に基づいた案内をさせていただきます。'
