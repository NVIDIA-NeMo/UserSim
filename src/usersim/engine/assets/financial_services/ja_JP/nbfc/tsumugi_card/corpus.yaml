- id: 5c7b7cda-468d-5f36-8935-6e9ec5723644
  title: キャッシング：お手続きが完了しない・保留中のまま
  body: 'キャッシングのお申込み手続きが完了せず、「保留中」の状態が続いている場合に考えられる原因と対処法をご案内します。


    **【考えられる原因】**

    - **書類の不備**：ご提出いただいた本人確認書類の画像が不鮮明であるか、有効期限が切れている可能性があります。

    - **審査の時間を要している**：支払可能見込額の調査に時間を要している場合がございます。

    - **認証の未完了**：多要素認証による本人確認が完了していない可能性があります。


    **【確認と解決方法】**

    1. **提出書類の再確認**：最新かつ鮮明な書類が提出されているかをご確認ください。不備がある場合は、改めて正しくご提示いただきます。

    2. **認証状況の確認**：認証通知が届いている場合は、速やかに完了させてください。


    **【エスカレーションについて】**

    上記を確認しても解決せず、3営業日以上経過している場合は、当社コンプライアンス担当者が個別に状況を確認し、結果を通知いたします。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8d8fcd82-a370-5f15-a35f-4e4902064230
  title: キャッシング：お申込みいただける方
  body: 'キャッシングのご利用には、以下の条件を満たしている必要があります。


    | 条件項目 | 内容・基準 | 結果 |

    | :--- | :--- | :--- |

    | **本人確認** | 有効な公的証明書の提示が可能であること | 必須 |

    | **返済能力** | 支払可能見込額の調査により、無理のない返済が可能と判断されること | 必須 |

    | **借入制限** | 他社借入を含め、原則として年収の3分の1（総量規制）を超えないこと | 必須 |

    | **審査結果** | 当社所定の信用審査を通過すること | 必須 |


    上記すべてを満たし、審査に合格された方に、最大 500,000円 の限度額の範囲内でご利用を承認いたします。'
  domain: lending_mortgage
  product_category: cashing
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
