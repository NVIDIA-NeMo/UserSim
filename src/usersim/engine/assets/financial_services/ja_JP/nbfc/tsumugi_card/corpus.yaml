  institution_id: tsumugi_card
- id: f3ce42d7-fd31-51f4-8f28-78db5b4259d8
  title: キャッシング：個人情報の取扱い
  body: 'つむぎカードでは、お客様の個人情報を金融庁および経済産業省の監督指針に基づき、厳重に管理しております。


    **信用情報機関への登録**：適切な信用供与と過剰債務防止のため、ご契約内容およびお支払い状況を指定信用情報機関に登録し、照会させていただきます。

    **利用目的**：個人情報は、審査、契約維持、および法令に基づく報告にのみ利用し、公正に取り扱います。

    **開示請求**：お客様ご自身の情報の開示をご希望の場合は、所定の手続きにより透明性のある開示を行います。


    多要素認証の導入により、不正アクセスからお客様の情報を守る体制を整えています。'
  domain: lending_mortgage
  product_category: cashing
  document_type: disclosure
  source_authority: official
  placeholder: true
