  title: リボ払い：重要事項のご説明
  body: '本サービスのご利用にあたり、以下の重要事項をご確認ください。


    リボ払いは、実質年率15%の手数料が発生いたします。毎月の最低支払額は5,000円となります。支払額を低く設定しすぎると、元金の減少が進まず、結果として手数料の総額が増加し、完済までにかかる期間が長期化するリスクがあります。


    当社は、割賦販売法に基づく支払可能見込額の調査を徹底することで、お客様の過剰債務を防止します。ショッピングのリボ払いは貸金業法の総量規制の対象外ですが、ご自身の返済能力に見合った計画的なご利用をお願いいたします。


    詳細なリスクについては「リボ払い：リスクについてのご説明」をご参照ください。'
