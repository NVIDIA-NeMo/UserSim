  institution_id: tsumugi_card
- id: 0f710179-28f1-5e2d-8bb8-8e07ba8846ea
  title: つむぎカード：ご利用開始までの手順
  body: "本ドキュメントは、お客様をサポートする担当者が参照するためのご利用開始フローです。\n\n**【ご利用開始までのステップ】**\n\n1. **お申し込みの受付**\n\
    \   お客様より、公式アプリまたはウェブサイトを通じてお申し込みをいただきます。\n2. **支払可能見込額の調査および審査**\n   年収や生活維持費、既存のクレジット債務に基づき、無理なく支払える金額を調査します。ショッピング利用可能枠は、割賦販売法に基づくこの調査の範囲内で設定し、過剰債務を防止します。\n\
    3. **カードの発行・送付**\n   審査完了後、つむぎカードを発行し、お客様のご登録住所へ郵送いたします。\n4. **カードの有効化（アクティベーション）**\n\
    \   お客様にカードが届いた後、多要素認証による本人確認を経て、利用可能状態となります。\n\n**【基本設定値】**\n・年会費：1,375円\n・ショッピング利用可能枠：最大1,000,000円まで（審査により決定）"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 15c1c458-e1d8-5fcb-8f8b-1448380b71a4
  title: つむぎカード：ショッピング利用可能枠の上限について
  body: '**Q. ショッピングで利用できる金額の上限はいくらですか？**


    **A.** つむぎカードのショッピング利用可能枠は、最大で**1,000,000円**となっております。ただし、実際にご設定いただく限度額は、お客様の年収、生活維持費、および他社様での借入状況などの「支払可能見込額」を審査した上で、個別に決定させていただきます。


    **Q. 限度額を上げてもらうことは可能ですか？**


    **A.** はい、可能です。ただし、割賦販売法に基づく支払可能見込額の調査を含む厳格な審査を行った上でご案内いたします。


    詳細は「つむぎカード：限度額・制限と注意事項」をご確認ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: de70954a-9e0f-5063-a984-115e5610216b
  title: つむぎカード：登録内容の変更
  body: "ご住所、お電話番号、メールアドレスなどのご登録内容を変更する手順をご案内します。\n\n**【ご準備いただくもの】**\n・つむぎカード（または会員番号）\n\
    ・本人確認書類（住所変更の場合）\n\n**【お手続きの流れ】**\n1. **変更内容の提示**\n   担当者に、変更したい項目（例：新住所、新しい電話番号）を伝えてください。\n\
    2. **本人確認（多要素認証）**\n   セキュリティ保護のため、ご登録の端末への通知や認証コードを用いた厳格な本人確認を実施します。\n3. **変更内容の確認と確定**\n\
    \   担当者が入力した内容に間違いがないか、最終的な確認画面または口頭での確認を行い、確定させます。\n4. **完了通知の受領**\n   手続き完了後、ご登録のメールアドレスまたはアプリへ完了通知が届きますので、内容をご確認ください。\n\
    \n**注意点**：重要な変更の前には、必ず多要素認証による本人確認が行われます。"
