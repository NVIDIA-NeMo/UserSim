- id: 2f1711a9-1a4f-57bd-988f-91b4afe3de15
  title: つむぎカードローン：個人情報の取扱い
  body: 'つむぎカードローンでは、お客様の個人情報を適切に管理し、公正に取り扱います。


    **情報の利用目的**

    ご提供いただいた情報は、審査における支払可能見込額の調査、およびご契約後の債権管理に利用いたします。


    **信用情報機関への登録**

    法令に基づき、指定信用情報機関へ情報の登録および照会を行います。これにより、過剰債務を防止し、お客様の経済的な安心を紡ぎます。


    **情報の開示と管理**

    個人情報の開示や訂正をご希望の場合は、所定の手続きを経て対応いたします。多要素認証による厳格な本人確認を実施した上で、適切に開示します。詳細は「つむぎカードローン：重要事項のご説明」をご確認ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: disclosure
