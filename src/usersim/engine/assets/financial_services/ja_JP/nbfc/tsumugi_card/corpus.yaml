- id: f05a5fff-2e4d-53a4-ae5d-f776570f089b
  title: リボ払い：お申込みとご利用条件
  body: '**Q. リボ払いの申し込みにはどのような条件がありますか？**

    A. つむぎカードをお持ちで、当社の定める審査基準を満たしたお客様がご利用いただけます。適用される手数料は実質年率15%となります。


    **Q. 利用にあたっての最低条件はありますか？**

    A. 毎月の最低支払額として5,000円を維持していただく必要があります。詳細は「リボ払い：お申込みいただける方」をご確認ください。'
