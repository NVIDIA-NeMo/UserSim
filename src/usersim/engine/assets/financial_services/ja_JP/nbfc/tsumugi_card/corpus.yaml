  institution_id: tsumugi_card
- id: d9f63ea5-923a-5226-8922-39a490f18b70
  title: キャッシング：規定・約款
  body: '本規定は、キャッシングサービスの利用に関する合意事項を定めたものです。


    **1. 信用供与と限度額**

    お客様には、審査に基づき最大500,000円までの利用限度額を付与します。ただし、貸金業法に基づく「総量規制」により、借入合計額は原則として年収の3分の1までに制限されます。


    **2. 手数料および金利**

    ・適用金利：実質年率18%にて運用いたします。

    ・ATM利用手数料：10,000円以下の場合は110円、10,000円を超える場合は220円を課金いたします。


    **3. 返済義務**

    お客様は、約定した支払日に、元金および利息を遅滞なく支払う義務を負います。


    **4. 契約の終了**

    限度額の変更やサービスの解約を希望される場合は、多要素認証による本人確認を経て手続きを行います。また、支払可能見込額に著しい変動がある場合、当社は限度額を制限することがあります。'
  domain: lending_mortgage
  product_category: cashing
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: fbd99606-6910-57b4-b325-bef101992858
  title: キャッシング：おすすめの方と主な使い方
  body: "キャッシングは、ATMを通じて急な資金ニーズに即座に対応できる、短期的な小口融資機能です。\n\n**このような方におすすめです**\n・急な出費があり、一時的に少額の現金が必要な方\n\
    ・複雑なローン審査を待たず、手軽に資金を調達したい方\n\n**ご利用の仕組みとコスト**\n・**利用限度額**：最大500,000円（審査により決定）\n\
    ・**適用金利**：実質年率18%\n・**ATM手数料**：\n  - 10,000円以下の引き出し：110円\n  - 10,000円を超える引き出し：220円\n\
    \n**主な使い方**\n全国の対応ATMにて、お手持ちのカードと暗証番号で簡単にお引き出しいただけます。短期間で返済することで、利息負担を最小限に抑えながら、家計の急な変動を柔軟にカバーすることが可能です。"
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: ed99a5d3-3b77-56b2-bfcc-a37dc43fb4ff
  title: キャッシング：キャッシング利用可能枠の上限について
  body: '**Q: キャッシングの利用限度額は最大でいくらまで設定できますか？**


    A: 最大500,000円まで設定可能です。ただし、お客様の年収や生活維持費、他社借入状況に基づく「支払可能見込額」の調査、および年収の3分の1までという「総量規制」に基づき審査を行い、個別に決定させていただきます。'
