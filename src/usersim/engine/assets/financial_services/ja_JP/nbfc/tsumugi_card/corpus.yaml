- id: 2ec809e6-ec5b-5893-b5e1-ddb430a4034a
  title: つむぎカード：商品概要
  body: 'つむぎカードは、日々の生活に寄り添い、無理のない柔軟な支払いを提案することで、お客様の経済的な安心を「紡ぐ」ことを目指す汎用決済カードです。若年層からファミリー層まで、幅広い方々に安心感と利便性を提供いたします。


    【基本スペック】

    ・年会費：1,375円

    ・ポイント還元率：0.5%

    ・ショッピング利用限度額：最大1,000,000円

    ・ETCカード年会費：550円


    透明性の高い手数料体系を採用しており、日常的な決済から計画的な支出管理まで幅広くご利用いただけます。詳細な費用については「つむぎカード：手数料一覧」をご確認ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bee552e7-dc38-5a05-891c-e29e5a971f2c
  title: つむぎカード：年会費について
  body: '【よくあるご質問】


    Q：つむぎカードの年会費はいくらですか？

    A：年会費は1,375円となっております。


    Q：ETCカードを別途申し込む場合、費用はかかりますか？

    A：はい、ETCカードの年会費として別途550円をいただいております。


    その他の費用詳細については、「つむぎカード：手数料一覧」をご参照ください。'
  domain: payments
