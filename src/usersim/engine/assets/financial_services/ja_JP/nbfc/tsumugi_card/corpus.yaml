  title: 分割払い：実施中のキャンペーン
  body: 'いつも「分割払い」をご利用いただき、誠にありがとうございます。


    誠に恐れ入りますが、現在、分割払いサービスに関する特別な金利優待や手数料無料などのキャンペーンは実施しておりません。


    今後、お得なプランやキャンペーンが開始された際には、公式アプリまたはウェブサイトにて速やかにご案内させていただきます。あわせて「分割払い：商品概要」にて、現在の標準的なサービス内容をご確認ください。'
