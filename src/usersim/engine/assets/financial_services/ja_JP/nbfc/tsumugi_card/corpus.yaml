- id: 5695c50b-f084-5d1a-bdfd-095867c43c48
  title: prepay_revolving_balance を使う場面
  body: 'お客様が、リボ払いの残高の一部または全部を予定より早く返済したい（繰上返済）と希望される場合に使用します。繰上返済を行うことで、将来的に支払う手数料を軽減することができ、お客様の負担軽減につながります。


    【手続き手順】

    1. 多要素認証により、お客様の本人確認を適切に実施します。

    2. get_accounts を使用して、対象となる account_id を特定します。

    3. get_loan_details 等を用いて現在のリボ残高を確認し、お客様に繰上返済したい金額を確認します。

    4. 振込やATMでの返済手続きについて案内し、お客様の同意を得ます。

    5. prepay_revolving_balance を呼び出し、繰上返済の受付手続きを完了させます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - prepay_revolving_balance
  institution_id: tsumugi_card
