  title: リボ払い：不正利用からお客さまを守るために
  body: 'リボ払いの設定変更を装ったフィッシング詐欺などの不正利用にご注意ください。


    **つむぎカードから、メールやSMSでパスワードや暗証番号を伺うことはございません。**


    不審な連絡を受け、リボ払いのプラン変更や限度額の調整を誘導された場合は、決して情報を入力せず、すぐに弊社カスタマーセンターまでご連絡ください。また、ご利用限度額の変更や契約内容の変更時には、必ず多要素認証による厳格な本人確認を実施しております。


    もしカードの紛失や盗難、または身に覚えのない請求に気づかれた場合は、**直ちに利用停止の手続き**をお願いいたします。迅速な報告により、規定に基づいた補償をスムーズに行うことが可能です。'
