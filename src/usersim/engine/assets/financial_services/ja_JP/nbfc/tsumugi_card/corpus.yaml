- id: 173fdd14-81ec-5a16-aa51-796174e7c885
  title: キャッシング：よくあるお手続きの流れ
  body: 'キャッシングのご利用限度額の設定や、お申し込みの一般的な流れをご案内します。


    1. **利用申請の依頼**: 当社にキャッシング利用枠の設定を申し出てください。

    2. **情報の提供**: 正確な審査のため、年収、就業状況、および他社からの借入状況についてお知らせください。

    3. **支払可能見込額の審査**: ご提供いただいた情報に基づき、貸金業法に則った「支払可能見込額」の調査と「総量規制（原則として年収の3分の1まで）」の確認を行います。

    4. **審査結果の通知**: 審査の結果、お客様に最適な利用限度額（最大500,000円まで）を決定し、通知いたします。

    5. **ご利用開始**: 通知後、すぐにATMにてキャッシングのご利用が可能となります。


    ※審査の結果、ご希望の限度額に届かない場合や、ご利用いただけない場合がございますので、あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bbb4636d-eb78-5e58-80d0-095a6323eb18
  title: キャッシング：明細や記録と合わない
  body: 'お客様が記録している金額と、当社の明細上の残高に相違がある場合、以下の要因が考えられます。


    **確認すべきポイント**

    1. **ATM利用手数料の計上**: お引出し金額とは別に、110円または220円の手数料が加算されているかご確認ください。

    2. **利息の日割り計算**: キャッシングの利息（実質年率18%）は日割りで計算されます。前回の請求から当日までの経過日数により、想定より金額が変動することがあります。

    3. **未処理の取引**: ATMでの取引直後は、システムへの反映に時間がかかる場合がございます。


    **解決方法**

    - 解決しない場合は、当社にて詳細な取引履歴を再照合いたします。本人確認の上、お取引日ごとの「元金」「利息」「手数料」の内訳を詳しくご案内します。

    - 明らかな計上ミスが判明した場合は、速やかに修正手続きを行い、正しい残高を通知いたします。不明点がある場合は「キャッシング：手数料一覧」と照らし合わせてご確認ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 88c9014f-af74-5c4b-977c-4c80389ace7f
  title: つむぎカードローン：商品概要
  body: 'つむぎカードローンは、キャッシングよりも大きな金額を、より計画的な返済プランで利用できる低金利のローン商品です。お客様の経済的な安心を「紡ぐ」ため、無理のない柔軟な借り入れを提案いたします。


    【主な特徴と条件】

    ・利用限度額：最大5,000,000円

    ・貸付金利：年4.5% ～ 18%

    ・最低月々返済額：4,000円


    審査により、お客様に最適な金利と限度額を決定いたします。詳細な金利設定については、「つむぎカードローン：金利・料率一覧」をご確認ください。'
