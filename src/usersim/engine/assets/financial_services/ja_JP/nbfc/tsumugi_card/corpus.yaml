- id: 1dd757a9-5571-5559-b484-7394efb21577
  title: set_alerts を使う場面
  body: '利用金額の通知や、セキュリティ上の重要な通知設定を変更したい場合に本手続きを行います。


    1. 多要素認証を用いて、厳格な本人確認を完了させます。

    2. `get_accounts` を使用し、対象となる account_id を特定します。

    3. 通知を希望する項目（例：一定金額以上の利用通知など）とその条件を確認します。

    4. `set_alerts` を呼び出し、アラート設定を有効化または変更します。


    安全なご利用に関するポイントについては、「つむぎカード：安全にご利用いただくためのポイント」をご参照ください。'
