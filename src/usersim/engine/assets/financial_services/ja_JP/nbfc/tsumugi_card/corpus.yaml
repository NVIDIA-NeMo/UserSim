- id: 98619de7-7769-5590-8dc4-efce58ffa3b1
  title: つむぎカードローン：規定・約款の変更
  body: 'つむぎカードローンでは、法令遵守およびサービス向上のため、規定・約款を適宜見直しております。


    **変更の適用について**

    変更内容は、適用日の前にウェブサイトまたは公式アプリにてご案内いたします。


    **主な適用基準**

    ・貸付金利は年4.5%から18%の範囲で設定されており、審査に基づき決定されます。

    ・利用限度額は最大5,000,000円までとなります。

    ・毎月の最低返済額は4,000円と定めております。


    これらの基準に変更が生じる場合は、事前にお客様へ通知いたします。他社サービスと比較される際は、最新の「つむぎカードローン：金利・料率一覧」と併せて、変更履歴をご確認ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 223c0704-ffc7-576e-81a7-55cd73264220
  title: つむぎカードローン：ご利用開始までの手順
  body: 'つむぎカードローンのご利用開始までの流れをご案内します。


    1. **お申込み**：必要事項を入力し、お申込みください。

    2. **本人確認書類の提出**：ご案内した書類を提出いただき、弊社にて審査を行います。

    3. **審査・限度額の決定**：年収や借入状況に基づき、支払可能見込額を調査し、最大5,000,000円までの利用限度額を決定します。

    4. **ご契約完了**：審査通過後、ご契約手続きが完了し、年4.5%～18%の貸付金利および毎月の最低返済額4,000円が適用されます。

    5. **ご利用開始**：指定の口座へお振込み、またはATM等を通じてご利用いただけます。


    詳細な必要書類については、「つむぎカードローン：必要書類」をご確認ください。'
