- id: 4f224f95-c07e-56c1-a597-094247fcb876
  title: キャッシング：不正利用からお客さまを守るために
  body: 'つむぎカードでは、お客様の資産と安心を守るため、キャッシング機能に厳格なセキュリティを導入しています。


    **不正利用を防ぐための取り組み**

    ・利用限度額の変更など、重要な設定変更の前には必ず**多要素認証**による本人確認を実施いたします。

    ・ATM利用時の暗証番号は、第三者に推測されにくい数字に設定し、適切に管理してください。


    **ご注意いただきたい点**

    当社からメールや電話で、暗証番号やセキュリティコードを直接お伺いすることはございません。不審な連絡があった場合は、十分にご注意ください。


    **万が一のときは**

    カードの紛失や盗難、身に覚えのない利用に気づいた場合は、直ちに当社カスタマーセンターへご連絡ください。迅速に利用停止手続きを行い、規定に基づいた補償対応をさせていただきます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: security_advisory
  source_authority: official
  placeholder: true
