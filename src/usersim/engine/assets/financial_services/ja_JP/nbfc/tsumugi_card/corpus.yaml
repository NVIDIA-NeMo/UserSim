  institution_id: tsumugi_card
- id: 429eeef2-bea3-5e0d-ac6a-19e4fcea421d
  title: つむぎカード：規定・約款の変更
  body: 'つむぎカードのご利用規定および約款は、法令の改正やサービス向上のため、適宜変更される場合がございます。


    **主な変更の対象となる項目**

    ・**年会費（1,375円）**および**ETCカード年会費（550円）**の改定

    ・**ショッピング利用可能枠（最大1,000,000円）**の算定基準の変更

    ・ポイント還元率（0.5%）の変更


    **変更の手続きと告知**

    規定の変更を行う場合は、適用日の前に公式アプリ、ウェブサイト、または書面にて十分な余裕をもって告知いたします。告知後、一定期間内に異議申し立てがない場合は、変更後の規定に同意いただいたものとみなされます。


    お客様の経済的な安心を紡ぐため、常に公正で透明性の高い約款運用に努めてまいります。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: terms_conditions
