- id: 49888cbf-60c7-53bf-ba28-5fc4e8ebe059
  title: キャッシング：お申込みとご利用開始
  body: 'キャッシングのご利用開始までの手順をご案内いたします。


    **【ご準備いただくもの】**

    - ご本人確認書類（運転免許証など）

    - 収入証明書（年収に応じてご提示をお願いする場合がございます）


    **【ご利用開始までのステップ】**

    1. **お申込みの意思提示**：キャッシング機能の利用希望をお伝えください。

    2. **本人確認と審査**：ご提示いただいた書類に基づき、支払可能見込額の調査と審査を行います。ここで、貸金業法に基づく「総量規制（原則として年収の3分の1まで）」の確認が行われます。

    3. **限度額の決定**：審査結果に基づき、最大 500,000円 までの範囲内でご利用限度額を決定し、お知らせいたします。

    4. **設定完了の通知**：キャッシング機能が有効になったことを通知いたします。これにより、ATM等でのお引き出しが可能となります。


    審査の詳細については「キャッシング：お申込みいただける方」をご参照ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 624beaac-b2a7-541d-a34b-2f1837331f03
  title: キャッシング：手数料一覧
  body: 'キャッシング利用時に発生する手数料は以下の通りです。誠実で透明性の高い料金体系を維持しております。


    **【ATM利用手数料】**

    - 1回のお引き出し額が 10,000円 以下の場合：110円

    - 1回のお引き出し額が 10,000円 を超える場合：220円


    ※上記手数料は、ご利用されるATMの規定に基づき加算される場合があります。金利（実質年率 18%）は別途発生いたします。'
