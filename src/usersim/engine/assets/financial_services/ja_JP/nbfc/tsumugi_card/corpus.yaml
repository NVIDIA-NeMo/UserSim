  title: 分割払い：金利・料率一覧
  body: '分割払いにおける金利および手数料の詳細は以下の通りです。


    **【適用金利・料率】**

    *   **実質年率（下限）**：12%

    *   **実質年率（上限）**：15%

    *   **3回払い手数料**：利用金額100円あたり2.01円


    **【適用条件】**

    上記の実質年率は、お客様の信用状況や返済能力を審査した結果に基づき、12%から15%の範囲で個別に適用されます。一律の固定金利ではなく、審査により決定される点にご留意ください。


    商品全体の概要は「分割払い：商品概要」でご確認いただけます。'
