  title: つむぎカードローン：安全にご利用いただくためのポイント
  body: 'つむぎカードローンを安全にご利用いただくために、以下の点に十分ご注意ください。


    **本人確認について**

    限度額の変更やご契約内容の変更操作の前には、必ず多要素認証による厳格な本人確認を実施いたします。


    **ご注意いただきたいこと**

    ・弊社からメールや電話で、暗証番号やパスワードを直接お伺いすることはございません。

    ・不審な連絡があった場合は、すぐに弊社カスタマーセンターまでお知らせください。


    万が一、不正利用が疑われる場合は、規定に基づき迅速な補償を行うため、速やかにご連絡をお願いいたします。詳細は「つむぎカードローン：不正利用からお客さまを守るために」をご参照ください。'
