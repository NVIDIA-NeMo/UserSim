- id: ee076b2e-b15c-5f51-9c32-00ae0f30d262
  title: リボ払い：状況・履歴の確認
  body: '現在のリボ払いのご利用状況や返済履歴を確認する手順は以下の通りです。


    1.  **現在の残高確認を依頼する**：お客様から「リボ払いの現在の利用残高と、次回の支払予定額を知りたい」とお申し付けください。

    2.  **最新状況の回答**：当社より、現在のリボ払い残高、適用されている15%の手数料、および次回の請求予定額を回答いたします。

    3.  **返済履歴の照会を依頼する**：さらに詳細な履歴が必要な場合は、「過去の支払履歴を確認したい」とお伝えください。

    4.  **履歴の提示**：当社より、過去の支払回数、元金の充当額、および支払った手数料の明細を提示し、返済が進んでいることをご確認いただきます。


    これにより、現在の債務状況と今後の返済計画を正確に把握いただけます。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 9637cc72-0d0c-5b6c-b851-b3911bfb5cf0
  title: リボ払い：お取引が拒否された・制限された
  body: '「リボ払いに切り替えたいが、手続きが拒否された」という場合の対処法をご案内します。


    **【考えられる原因】**

    *   **利用可能枠の不足**：ショッピング利用可能枠の上限に達している場合、リボ払いへの変更が制限されることがあります。

    *   **審査基準への抵触**：最新の支払可能見込額の調査により、追加の信用供与が困難と判断された可能性があります。

    *   **支払可能見込額による制限**：ご利用額が、支払可能見込額の調査で設定した利用可能枠に達している場合、制限がかかります。


    **【確認と解決策】**

    1.  現在の利用残高を確認し、枠に余裕があるかチェックしてください。

    2.  余裕がない場合は、繰上返済を行い、利用可能枠を確保してください。


    **【エスカレーション】**

    上記を確認しても解決せず、個別の状況判断が必要な場合は、専門のコンプライアンス担当者が詳細な審査を行い、制限解除の可否を判断いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b770333e-3bbb-518f-a857-c449b19d931b
  title: リボ払い：切替えや上位プランを検討するとき
  body: 'お客様が「リボ払い」か「分割払い」かで迷われている場合は、以下の基準でご案内ください。


    *   **リボ払い**：月々の支払額を5,000円などの一定額に抑え、家計の変動を緩やかにしたい方向けです。柔軟に支払額を変更でき、利便性に優れています。

    *   **分割払い**：高額な買い物を、あらかじめ決まった回数で計画的に返済したい方向けです。終了時期が明確であるため、完済計画が立てやすくなります。


    月々の負担軽減を最優先される場合はリボ払いが適していますが、総支払額を明確に管理したい場合は分割払いがより安心な選択肢となります。'
  domain: payments
  product_category: ribo_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: d12e1494-36b7-5ed1-aed6-f9186c25e79a
  title: リボ払い：ほかの選択肢との比較と向かない場合
  body: '「リボ払い」をご検討の方へ、他の支払い方法との比較と、ご利用を控えていただきたいケースをご案内します。


    **【他の選択肢との比較】**

    *   **1回払い**：手数料はかかりません。最も経済的ですが、高額利用時に月々の負担が大きくなります。

    *   **リボ払い**：実質年率15%の手数料が発生しますが、月々の支払額を5,000円からと低く抑えられ、家計にゆとりを持たせることができます。


    **【リボ払いが向かない場合】**

    *   **短期間で全額返済できる場合**：15%の手数料を支払うため、1回払いで十分に対応できる場合はおすすめしません。

    *   **厳格な完済期限を設けたい場合**：支払額を低く設定しすぎると完済まで時間がかかり、結果的に手数料負担が増えます。

    *   **月々5,000円の最低支払額の維持が困難な場合**：無理のない返済計画が立てられない場合は、他の支払い方法をご検討ください。'
  domain: payments
  product_category: ribo_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 10cc271a-4db9-5066-b49d-87f8f1757414
  title: リボ払い：ご利用方法の手順
  body: '**Q. リボ払いを使い始めるにはどうすればよいですか？**

    A. 当社へ「リボ払いの設定をしたい」とお申し付けください。お手続きの流れをご案内します。


    **Q. 支払額を増やして早く返済したい場合は？**

    A. 「繰上返済」の手続きが可能です。ご希望の金額を当社へお伝えください。手数料負担を軽減でき、効率的な返済が可能です。詳細は「リボ払い：よくあるお手続きの流れ」をご覧ください。'
  domain: payments
