- id: 2bb521c1-e128-5552-af99-f5b5ce85eb41
  title: つむぎカードローン：明細や記録と合わない
  body: 'お客様から「借入残高や利息の計算が明細と合わない」とのお問い合わせをいただいた際の対応フローです。


    **【確認すべき事項】**

    1. **計算期間の確認：** 利息は日割りで計算されます。年4.5% ～ 18%の金利が、どの期間に適用されているかを確認してください。

    2. **返済タイミングの確認：** 毎月の最低返済額4,000円の引き落とし日と、実際の入金日のズレによる利息の変動がないかを確認します。

    3. **繰上返済の反映：** 予定外の返済（繰上返済）が行われた場合、残高の減少に伴い、その後の利息計算額が変わります。


    **【解決しない場合の対応】**

    上記を確認しても不一致がある場合は、速やかに専門のコンプライアンス担当者へエスカレーションし、詳細な再計算と原因究明を行ってください。お客様には誠実かつ迅速に調査結果を報告いたします。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 44a5d07d-f34a-533f-9a73-a9a4cdfb28d9
  title: 手数料・料金のご案内
  body: つむぎカードでは、安全な決済インフラの維持とサービス向上のため、適正な手数料を設定しております。1回払いなどの手数料無料プランを基本としておりますが、リボ払いや分割払いなど信用供与を伴うサービスについては、リスクと利便性に見合った手数料を課金させていただきます。
  domain: payments
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8f86b76e-a86a-5703-b374-5e616e016625
  title: よくあるご質問
  body: '【サポート窓口はどこですか？】

    公式アプリ、ウェブサイト、およびカスタマーセンターにて、マルチチャネルでサポートを提供しております。


    【複雑な相談や苦情がある場合は？】

    専門のコンプライアンス担当者へエスカレーションし、誠実に解決を図ります。詳細は「法令・制度に関するご案内：クレジットカードのショッピング」をご確認ください。'
  domain: payments
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 62a0f71f-51b1-53c7-b2a6-151217bcc49f
  title: 法令・制度に関するご案内：クレジットカードのショッピング
  body: 'つむぎカードは、経済産業省（割賦販売法）および金融庁（銀行法・貸金業法）の監督指針を厳守しております。


    **重要事項**

    ・**支払可能見込額の調査**：お客様の年収や生活維持費、既存の借入状況に基づき、無理のない支払額を事前に調査し、過剰債務を防止します。

    ・**支払停止の抗弁**：販売店とのトラブルがある場合、正当な理由をもって当社への支払いを一時的に拒める権利を認めております。


    当社は、個人情報を指定信用情報機関へ適切に登録・管理し、透明性の高い開示を行う義務を負っております。'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1873ebf8-143c-595e-98b1-4d287e1d14f7
  title: 法令・制度に関するご案内：ローン
  body: 'キャッシングおよびつむぎカードローンの提供にあたり、当社は金融庁の監督指針および貸金業法を厳格に遵守いたします。


    **総量規制について**

    貸金業法に基づき、貸金業者からの借入合計額は、原則として**年収の3分の1**までに制限されます。これにより、お客様が返済能力を超えた借入れを行うことを防ぎ、経済的な安心を維持することを目的としています。


    審査の際は、返済能力を十分に確認し、適切かつ誠実な提案を行います。個別の税務相談や法的助言、投資銘柄の推奨は行いませんので、専門家へご相談ください。'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8574e72c-de59-503e-94f0-f2c054aa05c1
  title: get_account_transactions を使う場面
  body: 'お客様からショッピングまたはキャッシングの利用明細について問い合わせがあった際に、以下の手順で対応します。


    1. `verify_identity` を使用し、お客様の本人確認を厳格に実施します。

    2. `get_accounts` を使用し、お客様が提示したカード番号の下4桁から正確な `account_id` を特定します。

    3. `get_account_transactions` を呼び出し、該当口座の利用履歴を取得して、お客様に詳細を案内します。


    明細の内容に心当たりがない場合は、「file_transaction_dispute を使う場面」に従い、不正利用の調査手続きへ移行してください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: tsumugi_card
- id: 5cb7e6ac-69d4-5831-b1c4-c1cecb896d65
  title: get_account_transactions ツールリファレンス
  body: '**ツール名**: `get_account_transactions`

    **引数**: `account_id` (特定された口座識別子)

    **効果**: 指定された口座のショッピングおよびキャッシングの利用明細を取得します。


    エージェントはこのツールを直接呼び出すことで明細を確認し、お客様に回答します。お客様に外部サイトへ誘導して自己完結させるのではなく、会話内で情報を提示してください。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: tsumugi_card
- id: 8aa40902-1391-5b2c-b36a-a15fe1b46f36
  title: file_transaction_dispute を使う場面
  body: '身に覚えのない請求や、二重請求などのトラブルが発生し、お客様から調査・補償の依頼があった場合に実施します。


    1. `verify_identity` で本人確認を完了させます。

    2. `get_accounts` で対象の口座を特定し、`get_account_transactions` で問題の取引を特定します。

    3. お客様から不整合の内容（理由）を確認します。

    4. `file_transaction_dispute` を呼び出し、不正利用の補償手続きと調査を開始します。


    紛争解決にあたっては、日本クレジット協会の相談窓口とも連携し、誠実かつ迅速に対応いたします。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: tsumugi_card
- id: a36fa9f5-7841-547a-b4b4-8840ac04f693
  title: file_transaction_dispute ツールリファレンス
  body: '**ツール名**: `file_transaction_dispute`

    **引数**: `account_id`, `transaction_id`, `reason` (お客様から伺った理由)

    **効果**: 特定の取引に対する異議申し立てを受け付け、不正利用の調査および規定に基づく補償手続きを開始します。


    エージェントは、特定した取引IDと理由を引数として本ツールを直接実行してください。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: tsumugi_card
- id: 5ca51abe-8642-5965-9971-991b36509689
  title: freeze_card を使う場面
  body: 'カードの紛失、盗難、または不正利用の疑いがあるとの連絡を受けた際、被害を最小限に抑えるために即座に実施します。


    1. `verify_identity` を使用し、迅速に本人確認を行います。

    2. `get_accounts` を用いて対象の `account_id` を特定します。

    3. 直ちに `freeze_card` を呼び出し、カードの利用停止処理を完了させます。

    4. 利用停止後、必要に応じて `order_replacement_card` を案内し、新しいカード番号での再発行手続きをサポートしてください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: tsumugi_card
- id: 9aa11710-cdd0-55ba-9434-c685994570fb
  title: freeze_card ツールリファレンス
  body: '**ツール名**: `freeze_card`

    **引数**: `account_id` (特定された口座識別子)

    **効果**: 対象カードの利用を即時に停止します。紛失・盗難届出への対応として使用されます。


    エージェントは、本人確認および口座特定後、直ちに本ツールを呼び出して利用停止を実行してください。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: tsumugi_card
- id: c8ad552f-9fce-58ae-a48b-6a248843e187
  title: order_replacement_card を使う場面
  body: 'お客様が「つむぎカード」を紛失、または盗難に遭われた際、カードの利用停止手続き完了後に新しいカードを再発行するために本ツールを使用します。カード番号が新しくなるため、セキュリティ上の安全を確保しつつ、引き続きサービスをご利用いただくための重要な手続きです。


    【手続き手順】

    1. 多要素認証を用い、お客様の本人確認を厳格に実施します。

    2. カードの下4桁を確認し、get_accounts を使用して対象の account_id を特定します。

    3. カードの紛失・盗難届が完了し、利用停止状態であることを確認します（未完了の場合は、まず freeze_card の手続きを優先してください）。

    4. order_replacement_card を呼び出し、新しいカードの再発行手続きを完了させます。


    再発行の手続きが完了した旨をお客様へ丁寧に伝え、お届けまでの目安期間をご案内ください。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: tsumugi_card
- id: 2c21d5c9-b62c-5ce5-a398-3987e048ca18
  title: order_replacement_card ツールリファレンス
  body: '指定されたアカウントのクレジットカードを再発行し、新しいカード番号を割り当てます。


    【引数】

    - account_id: get_accounts 等で特定した、再発行対象となるアカウントの識別子


    【効果】

    オペレーターが本ツールを直接実行することで、カードの再発行処理がシステム的に行われます。お客様に外部サイトやアプリでの操作を依頼する必要はありません。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: tsumugi_card
- id: 59751945-b60a-5659-98e2-eed6996f4fdb
  title: change_to_revolving を使う場面
  body: 'お客様が、すでに「1回払い」で利用したショッピング決済を、お支払日前に「リボ払い」へ変更することを希望される場合（あとからリボ）に使用します。月々の支払額を一定に抑え、家計の変動を緩やかにしたいというニーズに応えるための手続きです。


    【手続き手順】

    1. 多要素認証により、お客様の本人確認を適切に実施します。

    2. get_accounts を使用して、対象となる account_id を特定します。

    3. get_account_transactions を使用し、リボ払いへ変更したい決済の transaction_id を特定します。

    4. リボ払い適用後の手数料について、リボ払い：商品概要に基づき、お客様に十分な説明を行い、同意を得ます。

    5. change_to_revolving を呼び出し、支払方法の変更を完了させます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: tsumugi_card
- id: bf9c2213-db4e-5323-85be-eebea2218ac7
  title: change_to_revolving ツールリファレンス
  body: '1回払いのショッピング利用分を、リボ払いへと変更します。


    【引数】

    - account_id: 対象アカウントの識別子

    - transaction_id: 変更対象となる決済の識別子


    【効果】

    オペレーターが本ツールを直接実行することで、指定された取引の支払方法がリボ払いに変更されます。お客様にセルフサービスでの操作を求める必要はありません。'
  domain: payments
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_revolving
  institution_id: tsumugi_card
- id: 8a512d4a-fac3-590d-ad02-197d4c21ef26
  title: change_to_installments を使う場面
  body: 'お客様が、高額な買い物などの「1回払い」決済を、後から指定の回数で計画的に返済する「分割払い」へ変更することを希望される場合（あとから分割）に使用します。


    【手続き手順】

    1. 多要素認証により、お客様の本人確認を適切に実施します。

    2. get_accounts を使用して、対象となる account_id を特定します。

    3. get_account_transactions を使用し、分割払いに変更したい決済の transaction_id を特定します。

    4. お客様に希望の分割回数を確認します。

    5. 分割払い：商品概要に基づき、適用される手数料について説明し、同意を得ます。

    6. change_to_installments を呼び出し、回数を指定して支払方法の変更を完了させます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_to_installments
  institution_id: tsumugi_card
