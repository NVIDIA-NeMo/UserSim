- id: 94d5a8aa-3ee5-5549-a726-d3f7d0f3490e
  title: つむぎカード：限度額・制限と注意事項
  body: '本ドキュメントは、サポート担当者がお客様へ限度額や利用制限について案内するための資料です。


    **【ショッピング利用限度額】**

    つむぎカードのショッピング利用限度額の最大値は**1,000,000円**です。ただし、個別の限度額は、お客様の年収や生活維持費、既存の借入状況に基づき、無理なく支払えると考えられる「支払可能見込額」を審査した上で決定されます。


    **【利用制限と注意事項】**

    *   **総量規制の適用**: キャッシングは貸金業法の総量規制の対象で、他社を含む借入合計額は原則として年収の3分の1までに制限されます。ショッピングは対象外です。

    *   **本人確認の徹底**: 利用限度額の変更や契約内容の変更を行う際は、必ず多要素認証による厳格な本人確認を実施してください。

    *   **不正利用防止**: インターネットショッピングではEMV 3-Dセキュア等の本人認証サービスを推奨し、不正利用の未然防止に努めてください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 762cf3fc-b057-59e8-bb25-d05d8aa8fc65
  title: つむぎカード：ETCカードの年会費について
  body: '**Q: つむぎカードでETCカードを申し込む場合、年会費はかかりますか？**


    **A: はい、ETCカードの年会費として550円（税込）をいただいております。**


    つむぎカード本体の年会費とは別に設定されておりますので、あわせてご確認ください。詳細な料金体系については「つむぎカード：手数料一覧」をご参照ください。'
