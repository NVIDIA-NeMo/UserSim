- id: 2058d19b-ea33-5d06-a876-2fdb63f11549
  title: リボ払い：想定外の手数料・金額
  body: '「請求金額が予想より高い」と感じられた場合の確認事項です。


    **【考えられる原因】**

    *   **手数料の累積**: リボ残高に対し実質年率15%の手数料が日々加算されているため、支払額を最低限（5,000円）に設定している場合、元金の減少速度が緩やかになり、総支払額が増加します。

    *   **利用額の増加**: リボ設定後の新たな買い物が累積している可能性があります。


    **【対応策】**

    1.  最新の明細書にて、元金と手数料の内訳を確認してください。

    2.  返済期間を短縮したい場合は、繰上返済をご検討ください。


    解決しない場合や、計算に不備があると思われる場合は、専門のコンプライアンス担当者へエスカレーションし、誠実に調査いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 8649863d-c32b-5bd1-8172-86969dec628d
  title: リボ払い：必要書類
  body: 'リボ払いのご利用開始、または利用限度額の変更に伴い、以下の書類が必要となる場合がございます。


    *   **本人確認書類**: 運転免許証、マイナンバーカード等の公的証明書（必須）

    *   **収入証明書**: 源泉徴収票や確定申告書（限度額の増枠を希望される場合など、支払可能見込額の調査に必要な場合に提出を求めます）


    **【審査結果】**

    提出書類に基づき、支払可能見込額の調査を行い、適切であると判断された場合にリボ払い機能をご提供いたします。詳細は「リボ払い：お申込みいただける方」をご確認ください。'
