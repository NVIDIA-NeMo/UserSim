- id: 779e98e0-ae3b-525a-bdec-2e510258b543
  title: リボ払い：ご紹介・継続利用の特典
  body: '【ご紹介キャンペーンのご案内】

    2026年1月1日から2026年3月31日までの期間中、つむぎカードの「リボ払い」を初めてご利用の方、またはご友人に紹介してご利用いただいた方に、特典として1,000円分のポイントを進呈いたします。


    日々の支払額を一定に抑えられる柔軟なリボ払いで、無理のない家計管理を始めてみませんか。詳細については、担当者までお問い合わせください。'
