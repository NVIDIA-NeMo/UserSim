- id: 47c44897-593e-5517-8bd4-5b5f9b5e4600
  title: つむぎカード：お取引が拒否された・制限された
  body: '「店舗でカードが使えなかった」「オンライン決済でエラーが出た」という場合の確認事項です。


    **【考えられる原因と確認手順】**

    1.  **利用限度額への到達**: ショッピング利用限度額（最大1,000,000円）に達していないか、現在の利用残高をご確認ください。

    2.  **セキュリティロックの作動**: 短時間に高額な決済や、不自然な場所での利用があった場合、不正利用防止のため一時的に制限がかかることがあります。

    3.  **カード情報の不一致**: 有効期限やセキュリティコードの入力に誤りがないか、再度ご確認ください。


    **【解決方法とエスカレーション】**

    *   限度額不足の場合は、繰上返済をご検討いただくか、審査を経て限度額変更を申請してください。

    *   セキュリティロックの場合は、本人確認後に制限を解除いたします。

    *   原因が不明な場合は、当社にて詳細な取引ログを確認し、必要に応じて専門のコンプライアンス担当者へエスカレーションして調査いたします。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
