- id: 938a9804-db36-5288-8dd0-0c75e2447960
  title: つむぎカード：リスクについてのご説明
  body: 'つむぎカードのご利用にあたり、以下のリスクと規制についてご理解ください。


    **過剰債務の防止について**

    当社は、ショッピングのご利用については割賦販売法に基づく**支払可能見込額**の調査を、キャッシングについては貸金業法に基づく総量規制（原則として年収の3分の1まで）を徹底しています。これにより、無理のない返済計画をサポートし、経済的な安心を「紡ぐ」ことを目指しています。


    **限度額と責任**

    最大1,000,000円のショッピング利用可能枠が付与されますが、これはお客様の返済能力に基づいた審査結果によるものです。限度額を最大限に利用される場合は、将来的な支払負担が増加するリスクがあることを十分にご認識ください。


    **個人情報の取り扱い**

    ご提供いただいた個人情報は、指定信用情報機関への登録を含め、適切に管理され、公正に取り扱われます。詳細は「つむぎカード：個人情報の取扱い」をご参照ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: disclosure
  source_authority: official
  placeholder: true
