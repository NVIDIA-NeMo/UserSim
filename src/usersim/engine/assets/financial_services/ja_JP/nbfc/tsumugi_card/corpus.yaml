  title: キャッシング：ご紹介・継続利用の特典
  body: つむぎカードのキャッシングを継続的にご利用いただいているお客様や、ご友人にご紹介いただいたお客様へ、感謝の気持ちを込めて特別な特典をご用意しております。詳細な条件や現在のキャンペーン内容については、ぜひ担当スタッフまでお問い合わせください。お客様の生活に寄り添い、安心を紡ぐサービスをぜひご体験ください。
