- id: 72ad5751-4b62-5c7a-b0a0-1c6e5f781f30
  title: 分割払い：解約・変更・プランの切替え
  body: '「分割払い」のプラン変更や、他のお支払い方法への切り替え手順をご案内いたします。


    **1. プラン変更・繰上返済のご依頼**

    現在ご利用中の分割払いについて、残高をまとめて返済（繰上返済）したい場合や、支払回数の変更を希望される場合は、その旨をお伝えください。現在の残高と、精算に必要な金額を確認いたします。


    **2. 内容の確認と承諾**

    ご提案した精算金額や、変更後の月々のお支払い額をご確認いただき、承諾のお返事をいただきます。


    **3. 手続きの完了**

    承諾後、速やかに変更処理を行います。処理が完了すると、次回の請求明細に反映されます。


    なお、分割払いから「リボ払い」への切り替えを検討される場合は、月々の支払額をより柔軟に設定できるため、併せてご検討ください。詳細は「リボ払い：商品概要」をご確認ください。'
