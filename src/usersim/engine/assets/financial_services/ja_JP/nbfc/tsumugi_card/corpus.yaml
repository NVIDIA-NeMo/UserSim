- id: 3edec5bd-1fc2-5428-ba21-2f5f9f17b538
  title: つむぎカード：ポイント還元率について
  body: '**Q: つむぎカードのポイント還元率はどのくらいですか？**

    A: つむぎカードの基本ポイント還元率は**0.5%**です。ご利用金額に応じてポイントが貯まります。


    **Q: ポイント還元には条件がありますか？**

    A: 通常のショッピング利用が対象となります。詳細は「つむぎカード：商品概要」をご確認ください。'
