  body: '分割払いのお申込み可否は、以下の条件に基づいて判断されます。


    | 条件 | 判定 |

    | :--- | :--- |

    | つむぎカード（標準）を所有し、有効な状態である | 申請可能 |

    | 支払可能見込額の範囲内である | 申請可能 |

    | 支払可能見込額の調査により、返済能力が十分であると認められた | 利用可能 |

    | 信用情報機関への照会により、規定の審査基準を満たしている | 利用可能 |


