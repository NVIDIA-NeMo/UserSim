  institution_id: tsumugi_card
- id: 6dc8ad9d-761e-5545-9805-e797debb0b74
  title: キャッシング：ご利用開始までの手順
  body: 'お客様がキャッシングのご利用を開始されるまでの標準的なフローは以下の通りです。


    1. **お申込みと審査**：お客様から申込みを受け、年収や生活維持費に基づき「支払可能見込額」の調査を行います。

    2. **限度額の決定**：審査結果に基づき、最大500,000円の範囲内で利用限度額を設定します。

    3. **ご契約・カード発行**：貸金業法および銀行法等の監督指針に基づき契約を締結し、カードを発行します。

    4. **ご利用開始**：ATMにてキャッシングが利用可能となります。


    操作に伴う本人確認は多要素認証で厳格に行います。詳細な条件は「キャッシング：お申込みいただける方」をご確認ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: dc70fba8-330d-5966-8110-0d3269e37d45
  title: キャッシング：ATM利用手数料（1万円以下）について
  body: '**Q: 10,000円以下の金額をATMでキャッシングする場合、手数料はいくらになりますか？**


    A: 10,000円以下のご利用の場合、ATM利用手数料は110円となります。

    なお、ご利用金額が10,000円を超える場合は、別途手数料（220円）が適用されます。詳細は「キャッシング：手数料一覧」にてご確認いただけます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: faq
  source_authority: official
