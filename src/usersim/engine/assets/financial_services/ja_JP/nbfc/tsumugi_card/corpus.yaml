- id: 6e3dd069-9583-57e6-89c9-e67e932c3617
  title: 分割払い：個人情報の取扱い
  body: '「分割払い」のご利用にあたり、当社はお客様の個人情報を以下の通り適切に管理いたします。


    **情報の収集と利用目的**：

    本サービスでは、割賦販売法および貸金業法に基づき、お客様の年収、生活維持費、既存の借入状況などの情報を収集し、「支払可能見込額」の調査を実施します。これは過剰債務を防止し、お客様の経済的な安心を紡ぐための不可欠な手続きです。


    **信用情報機関への登録**：

    ご契約内容およびお支払い状況は、指定信用情報機関に登録され、適切に管理されます。これらの情報は、公正な取引と透明性の確保のために利用されます。


    **情報の開示と管理**：

    お客様からの請求に基づき、登録情報の開示を行います。また、個人情報保護法を遵守し、厳格なセキュリティ体制の下で管理しております。個人情報の詳細な取り扱いについては「つむぎカード：個人情報の取扱い」をご確認ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 16620a96-0d67-5429-bef9-fc6fecca6c69
  title: 分割払い：この商品をかたる詐欺にご注意ください
  body: 'つむぎカードの「分割払い」サービスをかたる巧妙な詐欺が発生しています。お客様にご注意いただきたい点をご案内いたします。


    **【想定される詐欺の手口】**

    *   「特別な低金利の分割プランが適用された」という虚偽のメールやSMSを送り、外部サイトへ誘導する。

    *   「分割払いの回数変更手続きを行うため」として、カード番号、セキュリティコード、または暗証番号を要求する。


    **【重要：つむぎカードからのお願い】**

    当社がメールやSMSで、お客様の**暗証番号やパスワード、セキュリティコードを伺うことは絶対にございません。**


    もし不審な連絡を受け、不安を感じられた場合は、すぐに利用停止の手続きを行ってください。不正利用が疑われる場合は、速やかに当社カスタマーセンターまでご連絡をお願いいたします。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 62af9e60-f04a-509c-accf-d2b299352bf5
  title: 分割払い：限度額・制限と注意事項
  body: '「分割払い」のご利用に関する制限および注意事項についてご案内いたします。サポート担当者は、お客様への案内時に以下の基準を遵守してください。


    **【利用制限と限度額】**

    *   **最大支払回数：** 最長で24回まで設定可能です。

    *   **利用可能枠：** 割賦販売法に基づくお客様の「支払可能見込額」の調査結果をもとに、個別に設定されたショッピング利用限度額の範囲内でご利用いただけます。


    **【注意事項】**

    *   高額な決済を分割払いに設定される場合、審査の結果、希望回数が適用されない場合がございます。

    *   分割払いのご利用には、実質年率12%から15%の手数料が発生します。


    詳細なリスクについては、「分割払い：リスクについてのご説明」をご参照ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: c956758e-87bb-50b5-81d9-92095ae52613
  title: 分割払い：分割払いの最大支払回数について
  body: '**Q：分割払いは最大で何回まで分けることができますか？**


    A：つむぎカードの「分割払い」では、最大24回までのお支払回数を選択いただけます。


    **Q：利用金額によって回数に制限はありますか？**


    A：はい。ご利用金額に応じて選択可能な回数が異なります。また、最終的な回数の適用には審査がございますので、あらかじめご了承ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 87b6e1a9-f703-585b-a12c-c2f4e7e820c1
  title: 分割払い：状況・履歴の確認
  body: '現在ご利用中の「分割払い」の残高や、お支払いの状況を確認する手順をご案内いたします。


    1.  担当者に「分割払いの利用状況を確認したい」旨をお伝えください。

    2.  多要素認証によるご本人確認を実施いたします。画面に表示される指示に従い、認証を完了させてください。

    3.  担当者が、現在のご利用金額、支払回数の状況（例：24回中の5回目）、および今後の返済予定額を提示いたします。

    4.  提示された内容が、お客様のお手元の記録と相違ないかをご確認ください。


    ご確認後、もし早めに返済を完了させたい場合は、「繰上返済」の手続きについてもあわせてご相談ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 078cb225-6b19-59f2-8b14-4732a7b2462b
  title: 分割払い：お取引が拒否された・制限された
  body: '店舗での決済時やアプリでの変更時に、「分割払い」が選択できず拒否された場合の対処法です。


    **【考えられる原因】**

    *   **利用限度額の超過：** 分割払いの元金と予定手数料の合計が、ショッピング利用可能枠を超えている。

    *   **支払可能見込額による制限：** 他社のクレジット債務を含めた支払可能見込額の調査の結果、審査基準を満たさなかった。

    *   **本人認証の不備：** 多要素認証などの本人確認が正常に完了しなかった。


    **【確認と解決策】**

    1.  現在の利用可能枠に十分な余裕があるかをご確認ください。

    2.  認証エラーが出ている場合は、再度、正確な情報を入力して認証をやり直してください。


    上記を確認しても解決せず、正当な理由で利用を希望される場合は、担当者が専門のコンプライアンス担当者へエスカレーションし、再審査の可否を判断いたします。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e4972a71-39ce-5dff-a4d3-a1a330f0f29c
  title: 分割払い：切替えや上位プランを検討するとき
  body: 'お客様が「分割払い」から他の支払い方法への切り替えを検討される際、サポート担当者は以下の基準でご案内ください。


    **【分割払い vs リボ払い】**

    *   **分割払い：** 支払回数（最大24回）が固定されており、いつ完済するかが明確です。特定の高額商品を購入し、計画的に返済したい方に適しています。

    *   **リボ払い：** 毎月の支払額を一定に抑えることができます。月々の家計の変動を緩やかにしたい方に適しています。


    **【判断基準】**

    *   「この買い物だけを数回で済ませたい」場合は**分割払い**を推奨してください。

    *   「月々の支払額を固定して、家計管理を楽にしたい」場合は、**リボ払い**をご提案ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: f61c8b66-6ad9-5b4c-ae5b-403536a651ba
  title: 分割払い：ほかの選択肢との比較と向かない場合
  body: '「分割払い」を検討される際、どのような場合に最適で、どのような場合に不向きかをご説明します。


    **【分割払いが適しているケース】**

    *   家電製品や家具など、高額な買い物をした際に、あらかじめ24回までの期間を決めて計画的に返済したい場合。


    **【向かないケースと代替案】**

    *   **少額の日常決済：** 手数料が発生するため、1回払いでの決済をおすすめします。

    *   **毎月の支払額を変動させたくない：** 返済期間ではなく「月々の支払額」を固定したい場合は、「リボ払い」が適しています。

    *   **より大きな金額を低金利で借りたい：** ショッピング枠ではなく、計画的な資金調達が必要な場合は「つむぎカードローン」をご検討ください。


    **【注意点】**

    分割払いは、一度設定すると原則として回数を増やすことはできません。無理のない返済計画を立ててご利用ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 6b2c3eaa-3c19-5770-99ad-f3825c1e7f02
  title: 分割払い：手数料と費用
  body: '**Q：分割払いを利用する場合の手数料はいくらですか？**


    A：分割払いの実質年率は12%から15%の範囲で設定されており、お客様の審査結果に基づき適用されます。


    **Q：3回払いの場合の具体的な手数料を教えてください。**


    A：3回払いの場合は、利用金額100円あたり2.01円の手数料を申し受けます。


    **Q：手数料を安くする方法はありますか？**


    A：お支払回数を少なく設定されるか、または「繰上返済」を行うことで、将来的に支払う手数料を軽減させることが可能です。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 3300d1d9-f768-5a8b-94e8-c39e729889c9
  title: 分割払い：よくあるお手続きの流れ
  body: 'ショッピングのご利用分を「分割払い」へ変更する際のお手続きの流れをご案内いたします。


    1.  担当者に、分割払いに変更したい「利用店舗名」と「利用金額」、および「希望の支払回数（最大24回まで）」をお伝えください。

    2.  当社にて、お客様の「支払可能見込額」に基づき、分割払いへの変更が可能か審査を行います。

    3.  審査通過後、適用される実質年率（12%〜15%）と、それに基づく合計手数料額を提示いたします。

    4.  提示内容に同意いただいた後、お手続きを完了いたします。完了後、変更内容が確認できる通知をいたします。


    ※多要素認証による本人確認が必要な場合がございます。あらかじめご了承ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 46bcbfca-7beb-5f68-8710-54440d1f2ce5
  title: 分割払い：明細や記録と合わない
  body: 'お客様から「分割払いの明細金額や、残高の記録が想定と異なる」とのお問い合わせをいただいた際の対応手順です。


    **【確認すべき事項】**

    1.  **適用回数の再確認：** 設定された支払回数が、お客様の記憶している回数（最大24回まで）と一致しているか確認してください。

    2.  **手数料の計算：** 実質年率12%〜15%に基づき、正しく手数料が加算されているか再計算してください。

    3.  **繰上返済の有無：** 過去に「繰上返済」を行っていないか、履歴を確認してください。これにより残高が変動します。


    **【解決策】**

    *   計算の不一致が判明した場合は、正しい内訳を丁寧にご説明ください。

    *   もしシステム上の不備や、計算根拠に疑義がある場合は、担当者が速やかにコンプライアンス担当者へエスカレーションし、精査した結果を後日お客様へ回答いたします。'
  domain: payments
