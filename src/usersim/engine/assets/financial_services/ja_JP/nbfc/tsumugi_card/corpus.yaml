  mentions_tools: []
  institution_id: tsumugi_card
- id: 5f607ca0-5702-5867-9a51-79d6a8aa09f3
  title: つむぎカードローン：おすすめの方と主な使い方
  body: 'つむぎカードローンは、短期的な資金ニーズではなく、中長期的な視点で計画的に資金を準備したい方におすすめの商品です。


    **【このような方におすすめです】**

    ・キャッシングよりも大きな金額を、より低金利で利用したい方

    ・月々の返済額をコントロールし、無理のない計画的な返済を目指す方


    **【商品の特徴】**

    ・**利用限度額：** 最大5,000,000円まで

    ・**適用金利：** 年4.5% ～ 18%

    ・**最低返済額：** 毎月4,000円から


    急な出費への備えとしてだけでなく、生活基盤を整えるための柔軟な資金調達手段としてご活用ください。詳細な条件については「つむぎカードローン：商品概要」をご確認ください。'
