  mentions_tools: []
  institution_id: tsumugi_card
- id: 21834d88-263e-5044-8ce5-17f5bd100fa5
  title: リボ払い：プランの選び方
  body: 'つむぎカードでは、お買い物の金額や返済計画に合わせて、「リボ払い」と「分割払い」を選択いただけます。


    **リボ払い（本プラン）**

    *   **特徴**：利用金額に関わらず、月々の支払額を一定（最低5,000円から）に設定できます。家計の変動を緩やかにしたい方に最適です。

    *   **コスト**：実質年率15%の手数料がかかります。


    **分割払い**

    *   **特徴**：あらかじめ決められた回数で計画的に返済します。高額な買い物を完結させたい方に適しています。


    **選び方の目安**

    *   毎月の支出を固定して、無理のない柔軟な支払いを希望される方は「リボ払い」をお選びください。

    *   いつまでに完済するかという期限を明確にしたい方は「分割払い」が適しています。


    詳細は「分割払い：商品概要」と併せてご確認ください。'
  domain: payments
  product_category: ribo_barai
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 47892796-d5fd-5a29-b0bd-09c2ddeefc66
  title: リボ払い：個人情報の取扱い
  body: 'つむぎカードは、お客様の個人情報を適切に管理し、透明性のある開示を行います。本サービス「リボ払い」のご利用に際し、以下の通り取り扱います。


    **個人情報の収集と利用**

    *   **信用情報の照会**：適切な信用供与を行うため、指定信用情報機関に登録されている情報を参照し、支払可能見込額の調査を実施します。

    *   **利用目的**：収集した情報は、審査、契約管理、および割賦販売法に基づく支払可能見込額の調査のために利用いたします。

    *   **第三者提供**：法令に基づき、またはお客様の同意がある場合を除き、正当な理由なく第三者に個人情報を提供することはありません。


    **お客様の権利**

    お客様は、ご自身の個人情報の開示や訂正を求めることができます。また、不適切な取り扱いがある場合は、日本クレジット協会の相談窓口とも連携し、誠実かつ迅速に解決を図ります。'
  domain: payments
  product_category: ribo_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 9ef8dc68-2dca-5db4-bbe7-b3c7705e8de7
  title: リボ払い：この商品をかたる詐欺にご注意ください
  body: '最近、つむぎカードの「リボ払い」をかたる不審な連絡が増えております。特に「特別に低金利でリボ払いに切り替えられる」や「未払金があるため至急手続きが必要」といった内容で、個人情報やパスワードを巧みに聞き出そうとする手口にご注意ください。


    **つむぎカードから、メールや電話でお客様のパスワード、暗証番号、または多要素認証のコードを伺うことは絶対にございません。**


    不審な連絡を受けた場合は、指示に従わず、すぐに当社のカスタマーセンターまでご連絡ください。また、身に覚えのない請求や不審な操作履歴がある場合は、速やかに利用停止の手続きを行ってください。お客様の安心と安全を守るため、不審な案内には十分にご警戒いただけますようお願い申し上げます。'
  domain: payments
  product_category: ribo_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
