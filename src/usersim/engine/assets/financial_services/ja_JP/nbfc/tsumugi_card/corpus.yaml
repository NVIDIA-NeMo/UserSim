- id: 7eb541e0-ed8c-5837-a1be-c4580b5b34e7
  title: リボ払い：安全にご利用いただくためのポイント
  body: 'リボ払いを安心・安全にご利用いただくために、以下の点にご注意ください。


    **セキュリティの基本ポイント**

    *   **多要素認証の活用**：利用限度額の変更や契約内容の変更時には、必ず多要素認証による厳格な本人確認を実施します。認証コードを第三者に教えないでください。

    *   **不正利用の防止**：インターネットショッピングでは、EMV 3-Dセキュアなどの本人認証サービスを導入しています。不審な決済通知が届いた場合は、すぐにご連絡ください。

    *   **パスワードの管理**：暗証番号やログインパスワードをメモしてカードと一緒に保管することは避け、定期的に変更することをお勧めします。


    もしカードの紛失や盗難、身に覚えのない請求に気づいた場合は、直ちにご連絡ください。規定に基づき、迅速な利用停止と補償手続きを行います。'
  domain: payments
  product_category: ribo_barai
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 28c121c0-b8a2-5e8c-a20d-8c0eea444669
  title: リボ払い：規定・約款の変更
  body: '本サービス「リボ払い」の規定および約款に変更が生じる場合、つむぎカードは事前にお客様へ通知いたします。


    **変更に関する重要事項**

    *   **通知方法**：約款の変更は、公式アプリ、ウェブサイトへの掲載、または書面にてお知らせいたします。変更後の規定は、指定された適用日から有効となります。

    *   **手数料の改定**：実質年率15%の手数料率や、毎月の最低支払額5,000円などの重要な条件を変更する場合、十分な猶予期間をもって告知します。

    *   **同意の扱い**：変更適用日以降に本サービスを継続して利用された場合、新しい約款に同意したものとみなされます。


    本約款は、経済産業省（割賦販売法）および金融庁（銀行法・貸金業法）の監督指針に基づき、公正に運用されます。内容にご不明点がある場合は、いつでもお問い合わせください。'
