- id: 171bc462-8b73-5d1e-aefa-0fefb20eef2f
  title: つむぎカード：お手続きが完了しない・保留中のまま
  body: '【症状】

    お申込み手続きを行ったが、ステータスが「保留中」のまま進まない。


    【考えられる原因】

    ・ご本人確認書類の画像が不鮮明で、認証が完了していない。

    ・入力された個人情報と信用情報機関の登録内容に相違がある。


    【確認・解決方法】

    1. アップロードした書類の画像に、文字切れや光の反射がないか再度ご確認ください。

    2. 住所や氏名の表記（漢字・カナ）が最新の住民票と一致しているかご確認ください。

    3. 不備がある場合は、正しい情報を再提示してください。


    【解決しない場合】

    上記を確認しても状況が変わらない場合は、弊社にて詳細を確認いたします。専門のコンプライアンス担当者へエスカレーションし、審査状況を精査した上で、結果を改めてご連絡差し上げます。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 9ef6c03a-0c3b-5689-a7cc-86494ade09a5
  title: つむぎカード：お申込みいただける方
  body: 'つむぎカードのお申込み条件は以下の通りです。


    ・**満年令および居住地**：日本国内に居住し、安定した収入がある方 → お申込みいただけます。

    ・**信用状況**：指定信用情報機関による審査で、支払能力が認められた方 → お申込みいただけます。

    ・**支払可能見込額**：年収や生活維持費、他社のクレジット債務から見て、無理なく支払える範囲の方 → お申込みいただけます。キャッシング枠は、他社借入を含め原則として年収の3分の1まで（貸金業法の総量規制）です。


    審査の結果、ショッピング利用限度額は最大1,000,000円の範囲内で個別に設定されます。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: c2253ae0-0f4e-5df7-a1a0-149918381af7
  title: つむぎカード：当社の似た商品との比較
  body: 'つむぎカードは、日常の決済を基本とする汎用カードです。


    ・**つむぎカード**：年会費1,375円。0.5%の還元率で日々の買い物を効率的に行いたい方向けです。

    ・**つむぎカードローン**：より大きな金額を計画的に借りたい方向けの低金利商品です。


    日常的な支払いとポイント還元を重視される場合は、つむぎカードが最適です。資金調達を目的とされる場合は、つむぎカードローンをご検討ください。'
