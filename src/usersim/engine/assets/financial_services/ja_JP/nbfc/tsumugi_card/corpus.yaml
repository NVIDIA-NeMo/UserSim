  title: get_statements を使う場面
  body: '過去のご利用明細書（ステートメント）の照会を希望される場合に本手続きを行います。


    1. 多要素認証を用いて、厳格な本人確認を完了させます。

    2. `get_accounts` を使用し、対象となる account_id を特定します。

    3. 確認したい明細の対象期間（年月）をお客様に確認します。

    4. `get_statements` を呼び出し、該当期間の明細情報を取得して提示します。


    履歴の確認方法に関する詳細は、「つむぎカード：状況・履歴の確認」をご参照ください。'
