- id: b6eb20d1-6fc8-5785-9bde-b221729eac1d
  title: つむぎカード：安全にご利用いただくためのポイント
  body: 'お客様に安心してお買い物をお楽しみいただくため、以下のセキュリティ対策を徹底しております。


    **1. 本人認証サービスの導入**

    インターネットショッピングの際は、**EMV 3-Dセキュア**などの本人認証サービスを導入しており、第三者による不正利用を未然に防止します。


    **2. 多要素認証の実施**

    利用限度額の変更や重要な契約内容の変更など、状態を変更する操作の前には、必ず**多要素認証**による厳格な本人確認を実施いたします。


    **3. 万が一のトラブル対応**

    カードの紛失や盗難に気づいた際は、すぐに利用停止の手続きを行ってください。規定に基づき、迅速な補償対応をさせていただきます。


    不審なメールや電話があった際は、決して個人情報を伝えず、速やかに当社までご連絡ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: security_advisory
