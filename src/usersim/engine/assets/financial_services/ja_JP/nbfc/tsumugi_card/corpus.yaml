- id: 2bf395b1-5a83-52c4-a659-b49ef1e0e6c9
  title: つむぎカード：金利・料率の決まり方と適用
  body: 'つむぎカードに適用される主要な料率は以下の通りです。


    *   **ポイント還元率**：一律**0.5%**が適用されます。利用金額に基づき算出されます。

    *   **年会費**：一律**1,375円**です。契約更新時に適用されます。

    *   **ETCカード発行手数料**：一律**550円**です。発行時に一度のみ適用されます。


    これらの料率は、安全な決済インフラの維持と持続的なサービス向上のための適正価格として設定されており、原則として一律に適用されます。'
