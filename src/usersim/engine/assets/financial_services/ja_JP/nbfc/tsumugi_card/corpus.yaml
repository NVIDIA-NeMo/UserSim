  title: つむぎカードローン：手数料と費用
  body: '**Q: つむぎカードローンを利用する際の手数料や費用について教えてください。**


    A: 本商品の主な費用は、借入金額に対して発生する利息（貸付金利）です。金利は年4.5% ～ 18%の範囲で、お客様の審査結果に基づき決定いたします。


    なお、無理のない返済をサポートするため、毎月の最低返済額を4,000円と設定しております。詳細な金利の適用については、ご契約時の条件をご確認ください。'
