  title: change_revolving_payment ツールリファレンス
  body: 'リボ払いにおける毎月の支払金額の設定を変更します。


    【引数】

    - account_id: 対象アカウントの識別子

    - new_monthly_amount: 変更後の月々支払額（例：5,000円）


