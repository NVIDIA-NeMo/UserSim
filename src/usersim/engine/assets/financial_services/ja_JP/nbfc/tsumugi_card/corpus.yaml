- id: eea6f3e4-c0ae-57cd-a33c-220342d6979e
  title: 分割払い：ご利用条件による違い
  body: 'お客様のご利用条件による適用内容の違いは以下の通りです。


    ・**審査結果（標準）**：実質年率 12%〜15% / 最大支払回数 24回

    ・**支払可能見込額の範囲内**：利用可能（上限は個別の利用限度額に準じます）

    ・**支払可能見込額の調査**：年収や生活維持費、他社のクレジット債務に基づき、利用枠が調整されます。


    詳細な審査基準は「分割払い：お申込みいただける方」をご参照ください。'
