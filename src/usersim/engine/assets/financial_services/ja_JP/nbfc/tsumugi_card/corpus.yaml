  title: つむぎカード：手数料と費用
  body: '**Q: つむぎカードを利用する際にかかる主な費用を教えてください。**


    **A: 主な費用は以下の通りです。**

    *   **年会費**: 1,375円

    *   **ETCカード年会費**: 550円


    なお、1回払いなどの手数料無料プランを基本としておりますが、リボ払いなどの信用供与を伴うサービスをご利用の際は、別途所定の手数料がかかります。詳細は「つむぎカード：手数料一覧」をご確認ください。'
