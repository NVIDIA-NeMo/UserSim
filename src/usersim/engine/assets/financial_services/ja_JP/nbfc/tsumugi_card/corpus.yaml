- id: 97a7dc7e-2241-5bc8-8d3d-344856c79063
  title: つむぎカード：ログインできない・アクセスできない
  body: "アプリやウェブサイトにログインできず、サービスを利用できない場合の対処法です。\n\n**【考えられる原因と対処法】**\n\n- **パスワードの誤入力**\n\
    \  - **症状**：「パスワードが正しくありません」というエラーが表示される。\n  - **対処**：大文字・小文字の区別や、不要なスペースが入っていないかを確認し、再度入力してください。\n\
    \n- **多要素認証の通知が届かない**\n  - **症状**：認証コードが届かず、先に進めない。\n  - **対処**：通信環境を確認し、アプリの通知設定が「オン」になっているかをご確認ください。\n\
    \n- **アカウントの一時ロック**\n  - **症状**：正解のパスワードを入れてもログインが拒否される。\n  - **対処**：短時間に複数回誤入力をした場合、セキュリティのためロックがかかります。一定時間の経過後にお試しいただくか、担当者へ解除を依頼してください。\n\
    \n**【解決しない場合】**\n上記を確認しても改善しない場合は、専門の担当者が状況を確認し、認証情報の再設定手続きをサポートいたします。"
  domain: payments
  product_category: tsumugi_card_standard
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b51c11bb-6318-5910-a171-5bdfe0c58f63
  title: つむぎカード：ご利用条件による違い
  body: 'お客様の条件に基づき、設定される利用可能枠や審査基準の方向性を以下にまとめます（担当者参照用）。


    | ご利用条件 | 設定される利用可能枠の傾向 | 審査の重点ポイント |

    | :--- | :--- | :--- |

    | **安定した収入がある方** | 最大**1,000,000円**までの範囲で、審査に基づき高めに設定 | 支払可能見込額および継続的な返済能力 |

    | **若年層（社会人1年目など）** | 支払可能見込額に基づき、控えめな金額から設定 | 将来的な支払い能力と生活維持費のバランス |

    | **他社借入がある方** | **支払可能見込額**の範囲内で枠を設定（キャッシング枠は年収の3分の1まで） | 他社のクレジット債務・借入額と年収 |


    ※すべての設定は、経済産業省および金融庁の監督指針に基づき、過剰債務を防止する観点から決定されます。'
  domain: payments
