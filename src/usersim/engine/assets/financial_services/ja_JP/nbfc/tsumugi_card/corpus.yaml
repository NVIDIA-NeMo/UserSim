  body: 'つむぎカードに適用される還元率は以下の通りです。


    ・**ショッピングポイント還元率：0.5%**


    本還元率は、すべての加盟店でのご利用に対して一律に適用されます。利用金額に応じてポイントが付与され、お客様のライフスタイルに合わせて柔軟にご利用いただけます。還元率の変更を行う場合は、事前にお知らせいたします。'
