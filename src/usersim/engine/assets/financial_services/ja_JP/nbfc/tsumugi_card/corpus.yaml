- id: 26322fac-f173-5c0f-92fb-74dc36b1c6af
  title: リボ払い：リスクについてのご説明
  body: 'リボ払いのご利用にあたっては、以下のリスクを十分にご理解ください。


    **【過剰債務のリスク】**

    毎月の支払額を最低額の5,000円に設定し続けると、実質年率15%の手数料が優先的に充当されるため、元金の減少が遅くなります。その結果、完済までにかかる期間が長期化し、最終的な支払総額が大幅に増加する恐れがあります。


    **【法令遵守】**

    弊社は割賦販売法に基づき、お客様の支払可能見込額を厳格に審査します。無理のない返済計画を立てることが重要です。詳細な重要事項は「リボ払い：重要事項のご説明」に記載しております。'
  domain: payments
  product_category: ribo_barai
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 29a73823-04e6-5fee-a330-706eec744d8f
  title: リボ払い：金利・料率の決まり方と適用
  body: 'リボ払いに適用される金利（手数料率）の仕組みをご説明します。


    *   **適用金利**: すべてのお客様に一律で実質年率15%が適用されます。残高や利用期間による変動はありません。

    *   **計算方法**: 「リボ残高 × 実質年率15% ÷ 365日 × 利用日数」として、日割りで計算されます。

    *   **適用タイミング**: 決済が行われた日から、当該金額が完済されるまで適用されます。


    手数料を軽減させる唯一の方法は、繰上返済によりリボ残高を早期に減らすことです。詳細な一覧は「リボ払い：金利・料率一覧」をご参照ください。'
