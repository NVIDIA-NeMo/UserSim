- id: 5d586df3-fcaf-567d-ac10-776973912057
  title: リボ払い：お手続きが完了しない・保留中のまま
  body: '【症状】リボ払いの申し込み手続き中に画面が止まる、または「保留中」のまま完了しない。


    【考えられる原因】

    ・多要素認証による本人確認が正常に完了していない。

    ・支払可能見込額の調査において、追加の確認事項が発生している。


    【確認と解決策】

    1. 認証通知が届いていないか、再度デバイスを確認してください。

    2. 入力内容に誤りがないか、再度確認をお願いいたします。


    【解決しない場合】

    担当者が状況を確認し、必要に応じて専門のコンプライアンス担当者へエスカレーションいたします。審査状況や不備の内容について、折り返しのご連絡を差し上げますので、今しばらくお待ちください。'
