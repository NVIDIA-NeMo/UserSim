  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e268cb14-4f76-5dda-9676-7100efe26447
  title: キャッシング：商品概要
  body: "つむぎカードの「キャッシング」は、ATMを通じて急な資金ニーズに即座に対応できる、短期的な小口融資機能です。お客様の経済的な安心を紡ぐため、シンプルで透明性の高いサービスを提供いたします。\n\
    \n**【主な仕様と条件】**\n- **実質年率**：18%\n- **利用限度額**：最大 500,000円\n- **ATM利用手数料**：\n  -\
    \ 10,000円以下のご利用：110円\n  - 10,000円超のご利用：220円\n\n本サービスは、日々の生活の中での一時的な資金不足を補うためのものです。ご利用にあたっては、お客様の返済能力を適切に審査させていただきます。\n\
    \n詳細な金利については「キャッシング：金利・料率一覧」を、手数料の詳細については「キャッシング：手数料一覧」をご参照ください。"
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b955dd5a-99c6-5545-ba6a-39b49eb708ac
  title: キャッシング：キャッシングの金利（実質年率）について
  body: '**Q. キャッシングを利用した際の実質年率はいくらになりますか？**


    A. つむぎカードのキャッシングにおける実質年率は 18% です。この利率は、ご利用金額に対して日割りで計算されます。


    **Q. 金利は利用金額によって変動しますか？**


    A. いいえ、本サービスでは一律で 18% の実質年率を適用しております。個別の金利適用条件については「キャッシング：金利・料率一覧」をご確認ください。'
