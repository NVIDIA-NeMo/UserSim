  title: set_alerts ツールリファレンス
  body: '`set_alerts` は、お客様への通知（アラート）設定を管理するツールです。


    引数：

    - account_id：対象アカウントの識別子

    - 通知の種類：設定したいアラートの項目

    - 通知条件：通知をトリガーする金額や条件


    エージェントがこのツールを直接呼び出すことで、指定された条件に基づいた自動通知を設定します。'
