  title: リボ払い：規定・約款
  body: 'リボ払いサービスのご利用にあたり、以下の規定を適用いたします。


    *   **お支払い義務**: お客様は、毎月の最低支払額である5,000円、またはリボ残高のいずれか少ない金額を、指定の期日までにお支払いいただく義務を負います。

    *   **手数料の適用**: リボ払い残高に対し、実質年率15%の手数料が日割り計算で課金されます。

    *   **契約の変更**: 弊社は、法令の改正や経済状況の変化に基づき、事前の通知をもって本約款を変更することがあります。

    *   **契約の終了**: お客様による解約のお申し出、または支払不能等の事由により弊社が契約を解除した場合に終了します。


    詳細なリスクおよび重要事項については、「リボ払い：重要事項のご説明」をご確認ください。'
