- id: fc4f8a57-4164-5768-8bec-332a23697d84
  title: 分割払い：規定・約款の変更
  body: '「分割払い」の規定および約款の変更に関する事項をご案内いたします。


    本サービスにおける実質年率は、お客様の審査結果に基づき12%から15%の範囲で設定されます。経済情勢の変化や法令の改正に伴い、これらの利率や手数料体系を変更させていただく場合がございます。変更がある場合は、事前に公式アプリまたはウェブサイトにて通知いたします。


    **主な遵守事項**：

    ・お支払回数は最大24回までとし、定められた期日までにご返済いただく義務を負います。

    ・支払可能見込額の調査に基づき、利用限度額が制限される場合があります。


    本約款の詳細や、他社サービスとの比較検討をされる際は、最新の「分割払い：商品概要」をご参照ください。ご同意いただけない場合は、速やかに解約手続きをお願いいたします。'
