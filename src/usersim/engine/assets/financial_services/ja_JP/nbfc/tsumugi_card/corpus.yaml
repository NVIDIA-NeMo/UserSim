  title: つむぎカード：実施中のキャンペーン
  body: '【2026年限定：つむぎスタート応援キャンペーン】


    2026年12月31日までにお申込みいただいたお客様を対象に、つむぎカードの基本還元率0.5%を最大限にご活用いただけるよう、ご利用ガイドのご案内を実施しております。


    日々の生活に寄り添うつむぎカードで、無理のない柔軟な支払いプランと、確かな安心感をぜひご体験ください。'
