- id: b87eb794-0d4c-50ea-a789-88119d577ee4
  title: つむぎカードローン：解約・変更・プランの切替え
  body: 'つむぎカードローンの解約、またはご契約内容の変更をご希望の方は、以下の手順でお手続きください。


    **【お手続きの流れ】**

    1. **意思のご提示：** 当社担当者に、解約または変更（限度額の変更など）の希望をお伝えください。

    2. **本人確認：** セキュリティ保護のため、多要素認証による厳格な本人確認を実施します。画面の指示に従い認証を完了させてください。

    3. **内容の確認：** 解約の場合は、現在の借入残高および精算すべき利息の合計額を確認し、同意いただきます。

    4. **手続きの完了：** 当社にて処理を行い、手続き完了の通知をお送りします。


    **【完了の確認】**

    手続き完了後、公式アプリまたはウェブサイトのマイページにて、契約状態が「解約済み」または「変更後」になっていることをご確認いただけます。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: how_to_guide
