- id: 9121c79f-a188-50f0-ab7e-4a2f1431a142
  title: キャッシング：規定・約款の変更
  body: 'つむぎカードのキャッシング利用規定および約款は、法令の改正や経済状況の変化に伴い変更される場合がございます。


    **変更の通知**：規定の変更がある場合は、公式ウェブサイトへの掲載または書面にて事前にお知らせいたします。

    **適用される条件**：現在、実質年率18%の手数料、最大500,000円の利用限度額に基づき運用しております。

    **同意の扱い**：変更後も継続して本サービスを利用された場合、変更後の規定に同意したものとみなされます。


    お客様の過剰債務を防止するため、総量規制（原則として年収の3分の1まで）を厳守し、適正な信用供与を維持いたします。'
  domain: lending_mortgage
  product_category: cashing
  document_type: terms_conditions
  source_authority: official
  placeholder: true
