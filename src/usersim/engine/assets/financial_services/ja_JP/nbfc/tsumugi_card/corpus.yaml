- id: 4e9adae9-1d66-511a-9c59-12d841da523a
  title: 分割払い：ログインできない・アクセスできない
  body: '「分割払い」の設定変更画面にアクセスできない、またはログインできない場合の対処法です。


    **考えられる原因と確認事項**：

    1. **認証情報の誤り**：IDまたはパスワードが正しく入力されているか再度ご確認ください。

    2. **多要素認証の不備**：認証デバイスが手元にあるか、通信環境に問題がないかをご確認ください。

    3. **アカウントの制限**：セキュリティ上の理由で一時的にアクセスが制限されている可能性があります。


    **解決策**：

    ・パスワードを忘れた場合は、再設定手続きを行ってください。

    ・認証エラーが続く場合は、ブラウザのキャッシュ消去またはアプリの再起動をお試しください。


    上記を確認しても解決せず、至急の設定変更が必要な場合は、当社にて状況を確認いたします。専門のコンプライアンス担当者および技術チームへエスカレーションし、最短1営業日以内に解決策を回答させていただきます。'
