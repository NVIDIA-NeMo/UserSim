  institution_id: tsumugi_card
- id: d30861a1-1453-5f18-86b4-30549a47a648
  title: リボ払い：手数料と費用
  body: '**Q: リボ払いを利用する場合、どのような手数料がかかりますか？**

    A: リボ払いのご利用には、実質年率15%の手数料がかかります。これは、柔軟な支払いプランを提供するためのリスクと利便性に見合った適正な設定となっております。


    **Q: 毎月最低いくらから支払うことができますか？**

    A: 毎月の最低支払額は5,000円からとなっております。お客様のご都合に合わせて、この金額以上の範囲で月々のお支払額を設定いただけます。


    詳細は「リボ払い：手数料一覧」をご参照ください。'
  domain: payments
  product_category: ribo_barai
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: c0609f9d-7abc-524c-a4e5-bc411a05a12f
  title: リボ払い：登録内容の変更
  body: 'リボ払いの月々の支払金額などの登録内容を変更される際の手順をご案内します。


    **変更手続きの流れ**

    1.  **変更希望の提示**：担当者に「リボ払いの月々支払額を変更したい」旨をお伝えください。

    2.  **金額の指定**：新しく設定したい支払金額を提示してください。なお、最低支払額は5,000円となりますので、この金額以上の設定をお願いいたします。

    3.  **本人確認**：安全のため、多要素認証による本人確認を行います。画面の指示に従って認証を完了させてください。

    4.  **内容の確認と確定**：担当者が変更後の金額と、それに伴う返済期間の目安を案内します。内容に間違いがなければ、確定を依頼してください。

    5.  **完了の確認**：手続き完了後、変更内容が反映された旨の通知を受け取ったことで、変更は完了となります。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 024ba31a-95db-510c-96fd-044732a5a2b8
  title: リボ払い：ログインできない・アクセスできない
  body: 'リボ払いの設定確認や変更を行う際、アプリやウェブサイトにログインできない場合の対処法です。


    **考えられる原因と解決策**

    *   **パスワードの入力誤り**：大文字・小文字の区別が正しく行われているか、不要なスペースが入っていないかをご確認ください。解決しない場合は、パスワードの再設定をお願いします。

    *   **認証エラー**：多要素認証のコードが届かない場合は、通信状況を確認し、再送を依頼してください。

    *   **アカウントのロック**：短時間に何度も誤ったパスワードを入力すると、セキュリティのためロックがかかります。この場合は、本人確認手続きが必要です。


    **解決しない場合の対応**

    上記を試してもログインできない場合は、担当者がお客様の本人確認を改めて実施し、アクセス権限の復旧やパスワードのリセットを行います。状況に応じて専門のコンプライアンス担当者が対応し、安全にアクセスを再開できるようサポートいたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: aff73ff4-944a-5769-ac8c-7060e7273daa
  title: リボ払い：ご利用条件による違い
  body: "【サポート担当者向け：リボ払い利用判定基準】\nお客様の状況に応じた提供可否の判断基準です。\n\n*   **支払可能見込額の調査結果 ＞ 希望利用額**\
    \ → **承認**：規定の手数料（実質年率15%）にて提供可能です。\n*   **希望利用額 ＞ 支払可能見込額の調査結果**\
    \ → **不可**：割賦販売法に基づき、支払可能見込額を超える利用可能枠は設定できません。\n*   **信用情報機関への登録内容に重大な懸念あり**\
    \ → **審査保留/否決**：社内審査基準に基づき、個別に判断します。\n*   **本人確認（多要素認証）不可** →\
    \ **手続き停止**：厳格な本人確認が完了するまで、設定変更は行えません。"
