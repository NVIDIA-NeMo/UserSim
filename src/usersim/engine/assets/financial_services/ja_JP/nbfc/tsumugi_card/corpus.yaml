- id: 2738c3e9-eee1-527c-836f-87ba6cbfb33b
  title: つむぎカードローン：限度額・制限と注意事項
  body: 'つむぎカードローンの利用限度額および制限に関する規定です。オペレーターの方は、お客様へのご案内時に以下の数値を正確に提示してください。


    **【限度額と金利】**

    * **最大利用限度額：** 5,000,000円

    * **適用金利：** 年4.5% ～ 18%


    **【制限と遵守事項】**

    * **総量規制の遵守：** 貸金業法に基づき、原則として年収の3分の1までという総量規制を厳守します。支払可能見込額の調査を徹底し、過剰債務を防止します。

    * **本人確認の厳格化：** 限度額の変更や新規契約などの状態変更操作の前には、必ず多要素認証による厳格な本人確認を実施してください。


    **【注意点】**

    審査結果により、最大限度額の5,000,000円に満たない金額が設定される場合がございます。あらかじめご了承ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: product_sheet
  source_authority: official
