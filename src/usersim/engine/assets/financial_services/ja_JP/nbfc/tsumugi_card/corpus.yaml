- id: 15f4ffaa-39ed-5635-9959-819d3f088327
  title: つむぎカード：個人情報の取扱い
  body: 'つむぎカードでは、お客様の個人情報を適切に管理し、公正に取り扱うことをお約束いたします。


    **1. 個人情報の利用目的**

    ご提供いただいた個人情報は、カードの発行、利用限度額（最大**1,000,000円**）の審査、およびサービス向上のための分析に利用いたします。


    **2. 信用情報機関への登録**

    法令に基づき、ご契約内容や支払状況などの個人信用情報を、指定信用情報機関に登録し、またそこから情報を取得いたします。これは、過剰債務を防止し、安全な決済インフラを維持するために不可欠な手続きです。


    **3. 情報の開示と管理**

    お客様からご自身の個人情報の開示を求められた場合は、透明性のある手続きに基づき、迅速に開示いたします。


    **4. 安全管理措置**

    重要な操作の前には多要素認証を導入し、不正なアクセスや情報漏洩を防止するための厳格な管理体制を構築しております。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: disclosure
