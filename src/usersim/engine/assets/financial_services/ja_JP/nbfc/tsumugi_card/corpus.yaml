  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e34c7151-276b-53e0-ab09-8421959ca2d8
  title: キャッシング：金利・料率の決まり方と適用
  body: 'キャッシングに適用される金利および手数料の基準は以下の通りです。


    **1. 適用金利**

    ・実質年率：18%

    本金利はすべてのお客様に一律で適用され、お借入残高に対して日割り計算で算出されます。


    **2. ATM利用手数料**

    一度の引き出し金額に応じて、以下の手数料が適用されます。

    ・10,000円以下：110円

    ・10,000円超：220円


    金利および手数料は、安全な決済インフラの維持と持続的なサービス向上のため、適正な水準に設定しております。'
