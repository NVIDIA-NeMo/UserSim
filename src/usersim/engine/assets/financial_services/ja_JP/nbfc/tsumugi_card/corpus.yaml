- id: 9e59bf67-7d95-5f78-aad0-a1ce7c980f1e
  title: 分割払い：安全にご利用いただくためのポイント
  body: '「分割払い」を安全にご利用いただくために、以下の点にご注意ください。


    ・**多要素認証の徹底**：お支払い回数の変更や契約内容の変更など、重要な操作の前には必ず多要素認証による本人確認を実施いたします。認証コードを第三者に教えないでください。

    ・**不審な連絡への警戒**：つむぎカードから、メールやSMSで暗証番号やセキュリティコードを伺うことはございません。不自然なリンクが含まれるメッセージには十分ご注意ください。

    ・**不正利用の早期発見**：ご利用明細を定期的にご確認いただき、心当たりのない分割決済がある場合は、直ちにご連絡ください。


    万が一、カードの紛失や盗難、不正利用が疑われる場合は、迅速に利用停止手続きを行います。詳細は「つむぎカード：不正利用からお客さまを守るために」をご確認ください。'
