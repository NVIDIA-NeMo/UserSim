- id: 4b8196e9-c4c5-5bc2-a203-846d1df7846e
  title: 分割払い：想定外の手数料・金額
  body: '請求金額や手数料が想定と異なる場合の確認手順をご案内します。


    **考えられる原因と確認事項**

    *   **適用利率の確認**: 「分割払い」の手数料は実質年率12%から15%の間で決定されます。ご自身の適用利率がどちらであるかをご確認ください。

    *   **3回払い手数料の計算**: 3回払いをご利用の場合、利用金額100円あたり2.01円の手数料が適用されています。計算に相違がないかご確認ください。

    *   **端数処理**: 回数によって月々の支払額に数円の端数調整が発生する場合がございます。


    **解決しない場合の対応**

    上記を確認しても金額に納得がいかない場合は、詳細な計算内訳を提示させていただきます。弊社にて再計算を行い、誤りがある場合は速やかに修正し、次回の請求分で調整いたします。'
