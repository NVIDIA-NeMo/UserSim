  title: つむぎカードローン：利用限度額の上限について
  body: 'Q：つむぎカードローンの利用限度額は最大でいくらまでですか？


    A：最大5,000,000円までとなっております。ただし、お客様の年収や生活維持費、既存の借入状況に基づいた「支払可能見込額」の調査および総量規制に基づき、個別に審査させていただきます。詳細は「つむぎカードローン：商品概要」をご覧ください。'
