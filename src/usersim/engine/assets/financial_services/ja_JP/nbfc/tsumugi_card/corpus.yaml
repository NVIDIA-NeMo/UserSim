  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 057f1c0d-40ff-5b40-a909-32de8ae988d8
  title: つむぎカードローン：この商品をかたる詐欺にご注意ください
  body: '最近、つむぎカードローンをかたる第三者による詐欺行為が報告されています。お客様の安心を「紡ぐ」当行として、以下の点に十分ご注意ください。


    **【特にご注意いただきたい点】**

    * **手数料の先払い要求：** 融資手続きのために「保証料」や「事務手数料」などの名目で、事前にお金を振り込ませることは一切ございません。

    * **機密情報の要求：** メールや電話で、暗証番号や多要素認証のコードを直接伺うことはございません。

    * **不自然な低金利の提示：** 当商品の金利は4.5%から18%の範囲で審査により決定いたします。これらを大幅に下回る条件を提示し、個人情報を求める案内にはご注意ください。


    もし不審な連絡を受けられた場合は、すぐに当社のカスタマーセンターまでお知らせください。迅速に状況を確認し、お客様をサポートいたします。'
  domain: lending_mortgage
