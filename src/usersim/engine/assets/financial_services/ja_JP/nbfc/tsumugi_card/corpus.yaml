- id: bd18e170-c722-5e45-9004-21d0c96c7a81
  title: つむぎカードローン：状況・履歴の確認
  body: 'つむぎカードローンの現在の借入残高や、これまでの返済履歴を確認する手順をご案内いたします。


    **【ご確認の手順】**

    1. **確認内容の提示：** ご利用状況の確認を希望される旨を、私たちにお伝えください。

    2. **本人確認の実施：** ご本人様であることを確認するため、多要素認証による確認手続きを行います。画面の指示に従って操作をお願いいたします。

    3. **状況の提示：** 確認が完了次第、現在の借入残高、適用されている金利（4.5% ～ 18%の範囲内）、および次回のお支払い予定額を提示いたします。

    4. **履歴の提供：** 過去の返済履歴や詳細な明細が必要な場合は、その旨をお申し付けください。後ほど正式なご利用明細書をご案内いたします。


    これにより、計画的な返済プランの再検討や、家計の状況把握に役立てていただけます。'
