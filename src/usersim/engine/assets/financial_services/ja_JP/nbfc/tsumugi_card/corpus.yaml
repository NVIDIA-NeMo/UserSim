- id: 9ef3c026-d2a1-55fe-9197-82a89c23c680
  title: つむぎカード：不正利用からお客さまを守るために
  body: 'つむぎカードでは、お客様に安心してお使いいただくため、業界基準の厳格なセキュリティを導入しています。特にインターネットショッピングにおいては、最新の本人認証サービスである**EMV
    3-Dセキュア**を導入し、なりすましによる不正利用を未然に防止しています。


    また、利用限度額の変更（最大1,000,000円まで）やローンのご契約など、重要なお手続きの前には必ず**多要素認証**による厳格な本人確認を実施いたします。これにより、第三者による不正な操作を遮断します。


    万が一、カードの紛失や盗難、身に覚えのない請求に気づいた場合は、直ちにご連絡ください。規定に基づき、迅速な利用停止と再発行、および不正利用に対する補償手続きを行います。安全な決済環境を維持することが、私たちの最優先事項です。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bf94ad4e-ff20-5331-820e-02b4c9e427b2
  title: つむぎカード：規定・約款
  body: '本規定は、つむぎカードのご利用に関するお客様と当社の合意事項を定めるものです。お客様は、本約款に基づき、設定された利用限度額（最大1,000,000円）の範囲内で決済サービスを利用することができます。


    **主な費用および義務**

    *   **年会費**：1,375円（税込）を毎年ご負担いただきます。

    *   **ETCカード発行手数料**：550円（税込）を別途申し受けます。

    *   **支払義務**：利用金額および所定の手数料を、指定の期日までにお支払いください。


    **契約の変更および終了**

    規定の変更がある場合は、事前にお知らせいたします。お客様が解約を希望される場合は、所定の手続きを経て契約を終了させることができます。なお、解約時においても未払いの残高がある場合は、速やかに清算していただく必要があります。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 4012af4d-9827-5288-9299-d4b5e11fc16c
  title: つむぎカード：おすすめの方と主な使い方
  body: "つむぎカードは、日々の生活における決済をシンプルにまとめたい方や、無理のない計画的な支出を目指す方に最適な汎用決済カードです。\n\n**このような方におすすめです**\n\
    *   日常的なお買い物で、着実にポイントを貯めたい方（還元率0.5%）\n*   信頼感のあるサポート体制のもとで、安心してカードを利用したい方\n* \
    \  最大1,000,000円の利用限度額を活かし、大きな買い物も柔軟に行いたい方\n\n**主な使い方の例**\n*   **日常決済**：スーパーやコンビニなど、あらゆるシーンで利用し、0.5%のポイントを還元。\
    \ \n*   **ETC利用**：550円の手数料でETCカードを発行し、高速道路の支払いをスムーズに。\n*   **計画的な支払い**：年会費1,375円で、安心の決済インフラを維持し、家計管理に役立ててください。"
  domain: payments
