- id: 7bf4b8db-1bb3-55de-9d34-4cdd32918c4a
  title: つむぎカード：プランの選び方
  body: "お客様のライフスタイルに合わせた「つむぎカード」の活用方法をご提案します。\n\n**【このような方におすすめです】**\n- **日常的な決済をシンプルにまとめたい方**\n\
    \  - **年会費 1,375円**で、あらゆるシーンで利用可能な汎用決済カードをお探しの方に最適です。\n- **効率的にポイントを貯めたい方**\n\
    \  - 全ての利用に対して**0.5%**のポイント還元があるため、日々の買い物で着実にメリットを得たい方向けです。\n- **安心感を重視される方**\n\
    \  - 最大**1,000,000円**の利用可能枠（審査による）があり、急な出費にも対応できる安心感があります。\n\n**【他プランとの考え方】**\n\
    月々の支払額を一定に抑えたい場合は、オプションの「リボ払い」を、高額な買い物を計画的に返済したい場合は「分割払い」を組み合わせることで、より柔軟な家計管理が可能です。"
