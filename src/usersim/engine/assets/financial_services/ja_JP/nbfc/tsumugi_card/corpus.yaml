  body: '【2026年1月1日から2026年3月31日まで】


    日々の生活に寄り添い、安心を紡ぐ「つむぎカード」では、ご紹介および継続利用の特典をご用意しております。


    **特典内容**

    ・ご利用金額に応じて、**0.5%**のポイント還元を継続的に提供いたします。

    ・ご紹介いただいた方、および新しくお申し込みいただいた方双方に、日々の決済をよりお得にしていただける還元プランを適用いたします。


