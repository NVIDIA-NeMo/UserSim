- id: b9591b41-1ff2-5a37-b0de-299a7a05bac4
  title: キャッシング：状況・履歴の確認
  body: '現在のご利用残高や、過去のキャッシング履歴を確認する手順をご案内します。


    1. **確認の依頼**: 当社カスタマーセンターにて、キャッシングの現在の利用状況と履歴の照会を申し出てください。

    2. **本人確認の実施**: セキュリティ保護のため、多要素認証による厳格な本人確認を行います。画面の指示に従い、認証を完了させてください。

    3. **内容の確認**: 本人確認完了後、オペレーターより「現在の利用残高」および「直近のご利用明細（日付、金額、ATM手数料など）」をご案内いたします。


    **確認できる項目**

    - 利用可能枠（最大500,000円までのうち、あといくら利用できるか）

    - 直近の引出金額および適用されたATM手数料（110円または220円）

    - 現在の未返済残高'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 97b17e45-22fa-5e43-a32e-219f8042a910
  title: キャッシング：お取引が拒否された・制限された
  body: 'ATMなどでキャッシングの取引が拒否された場合、以下の原因が考えられます。順にご確認ください。


    **考えられる原因と確認事項**

    1. **利用限度額への到達**: 現在の利用残高が、お客様に設定された限度額（最大500,000円）に達していないかご確認ください。

    2. **暗証番号の誤入力**: 暗証番号を複数回間違えた場合、セキュリティのため一時的にロックがかかります。

    3. **ご返済の遅延**: お支払いに遅れがある場合、法令および規定に基づき、利用制限がかかっている可能性がございます。


    **解決策と対応**

    - 限度額内であるにもかかわらず利用できない場合は、当社にてカードの状態を確認いたします。本人確認後、制限の解除が可能か審査させていただきます。

    - 暗証番号のロック解除や再設定が必要な場合は、改めてお手続きをご案内します。


    解決しない場合は、専門のコンプライアンス担当者へエスカレーションし、詳細な調査結果をご報告いたします。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 11fb28e1-47fd-5a69-be43-56fa9fc89b11
  title: キャッシング：切替えや上位プランを検討するとき
  body: '急な資金ニーズへの対応に便利な「キャッシング」と、より計画的なご利用が可能な「つむぎカードローン」の使い分けについてご案内します。


    - **キャッシング**: ATMで即座に現金を得られる利便性が特徴です。実質年率は18%となります。短期的な小口資金の調達に適しています。

    - **つむぎカードローン**: キャッシングよりも大きな金額を、より低金利で、計画的な返済プランに基づいて利用できます。


    **選び方の目安**

    - 数日間から数週間で完済できる短期的な資金が必要な場合は、「キャッシング」が最適です。

    - 返済期間を長く設定し、月々の負担を軽減しながらまとまった金額を借りたい場合は、「つむぎカードローン」への切り替えをご検討ください。詳細は「つむぎカードローン：商品概要」をご参照ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 780b8d6d-bc2c-5312-9e94-2b2a882d0fe5
  title: キャッシング：ほかの選択肢との比較と向かない場合
  body: '「キャッシング」は非常に利便性の高いサービスですが、コスト面から見て最適ではない場合がございます。以下の比較をご参考にしてください。


    **他の支払いオプションとの比較**

    - **キャッシング**: 実質年率18%と高めに設定されており、ATM利用手数料（110円または220円）もかかります。即時性は最大ですが、コストは最も高くなります。

    - **分割払い**: 高額な買い物を計画的に返済する場合に適しています。キャッシングで現金を借りて支払うよりも手数料を抑えられる場合があります。

    - **つむぎカードローン**: より低金利で、まとまった資金を計画的に借りたい場合に適しています。


    **向かないケース**

    - **長期的な借入を検討している方**: 18%という金利は短期利用を前提としたものです。長期にわたる借入は、利息負担が大きくなるため推奨いたしません。

    - **計画的な出費が決まっている方**: 物品購入が目的であれば、「分割払い」の方が経済的である可能性が高いです。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1df0ba5e-ec02-5a29-97f1-f79ef5640d1e
  title: キャッシング：手数料と費用
  body: "**Q: キャッシングを利用した際にかかる費用について教えてください。**\n\nA: 主に「利息（手数料）」と「ATM利用手数料」の2点がございます。\n\
    \n- **利息**: ご利用金額に対し、実質年率18%の手数料が日割りで計算されます。\n- **ATM利用手数料**: \n  - 10,000円以下のお引出し：110円\n\
    \  - 10,000円超のお引出し：220円\n\nこれらはご利用金額や回数に応じて加算されます。詳細な計算方法は「キャッシング：金利・料率一覧」をご確認ください。"
