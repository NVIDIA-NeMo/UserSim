- id: a679ff72-95e1-5a9c-968a-b9674f537d73
  title: リボ払い：よくあるお手続きの流れ
  body: '特定の利用分を「リボ払い」へ切り替える際の手続きの流れをご案内します。


    1.  **対象取引の指定**：お客様から「〇月〇日の〇〇円の利用分をリボ払いに変更したい」とお申し付けください。

    2.  **条件の提示と確認**：当社より、リボ払い適用後の実質年率15%の手数料についてご説明し、同意をいただきます。

    3.  **支払額の決定**：毎月の支払額を決定します。最低支払額である5,000円以上の金額をご指定ください。

    4.  **手続きの完了**：当社にて設定を完了し、次回の請求からリボ払いとして適用されることを回答いたします。


    **【完了の確認】**

    手続き後、次回の請求明細にて、対象の取引がリボ払いとして計上され、ご指定の金額（5,000円以上）が請求されていることでご確認いただけます。'
  domain: payments
  product_category: ribo_barai
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: d8a5828e-905e-5dbb-889c-1224838ff4f8
  title: リボ払い：明細や記録と合わない
  body: '「リボ払いの残高が、自分の計算よりも減っていないように感じる」というお問い合わせへの対応です。


    **【想定される原因】**

    *   **手数料の加算**：リボ払いは実質年率15%の手数料が日割りで計算され、元金に加算されます。支払額の多くがまず手数料の充当に充てられるため、元金が減りにくいと感じられることがあります。

    *   **最低支払額の設定**：毎月5,000円の最低支払額に近い設定の場合、返済期間が長期化し、利息負担の割合が高まります。


    **【確認手順】**

    1.  直近の明細で「手数料」としていくら請求されているかを確認してください。

    2.  支払った金額のうち、いくらが元金に充当され、いくらが手数料に充当されたかを照合します。


    **【エスカレーション】**

    計算に明らかな誤りがあると思われる場合や、詳細な再計算が必要な場合は、請求管理専門チームへエスカレーションし、正確な算出根拠を提示いたします。'
  domain: payments
  product_category: ribo_barai
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: b66e569c-4251-58bd-bdd3-e06f9fe15214
  title: 分割払い：商品概要
  body: '「分割払い」は、高額な買い物などの際にご利用いただける、計画的な返済をサポートする決済サービスです。あらかじめ決められた回数で、月々の支払額を分散させることで、家計への急激な負担を抑えながらお買い物を楽しんでいただけます。


    **【ご利用条件と手数料】**

    *   **最大支払回数**：最大24回まで設定可能です。

    *   **実質年率**：12% ～ 15%（審査により決定いたします）。

    *   **3回払い手数料**：利用金額100円あたり2.01円となります。


    日々の生活に寄り添い、無理のない柔軟な支払いをご提案することで、お客様の経済的な安心を「紡ぐ」お手伝いをいたします。詳細な金利については、「分割払い：金利・料率一覧」をご参照ください。'
  domain: payments
  product_category: bunkatsu_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
