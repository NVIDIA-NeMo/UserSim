  institution_id: tsumugi_card
- id: b81caba7-da54-5628-bf1c-58dd8fd61b44
  title: キャッシング：この商品をかたる詐欺にご注意ください
  body: '最近、つむぎカードの「キャッシング」サービスを装い、「審査なしで即日融資」や「特別な低金利での提供」を謳う偽のメールやSMSによる詐欺が発生しております。このような案内はすべて虚偽であり、当社がこのような手法でお客様にアプローチすることはありません。


    **特にご注意いただきたい点**

    - 当社が電話やメールで、暗証番号やセキュリティコード、パスワードなどの個人情報を伺うことは絶対にございません。

    - 公式アプリや公式サイト以外で、キャッシングの申し込みを促す不審なURLをクリックしないでください。


    万が一、不審な連絡を受けたり、心当たりのない取引がある場合は、速やかに当社のカスタマーセンターへご連絡ください。また、不正利用の防止策については「つむぎカード：不正利用からお客さまを守るために」でもご確認いただけます。'
  domain: lending_mortgage
  product_category: cashing
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 1aa961a6-cd54-5f69-a47a-5bdbae495a0f
  title: キャッシング：限度額・制限と注意事項
  body: 'キャッシングサービスのご利用にあたっては、以下の限度額および制限事項が適用されます。安全なご利用のため、必ず内容をご確認ください。


    **限度額と金利**

    - **最大利用限度額**: 500,000円

    - **実質年率**: 18%


    **ご利用上の重要な制限**

    - **総量規制の適用**: 貸金業法に基づき、お客様の年収の3分の1までという借入制限（総量規制）を厳守しております。これを超えるご利用はいただけません。

    - **支払可能見込額の調査**: 無理のないご返済をいただくため、年収や生活維持費、他社借入状況に基づき、適切に支払可能見込額を審査しております。


    **注意事項**

    - 限度額の変更や契約内容の変更を行う際は、多要素認証による厳格な本人確認を実施いたします。

    - ご返済が遅延した場合、ご利用が一時的に制限される場合がございます。詳細は「キャッシング：規定・約款」をご参照ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: bdc7e33c-8d27-52c4-8186-ce584f586c78
  title: キャッシング：ATM利用手数料（1万円超）について
  body: '**Q: ATMで10,000円を超える金額をキャッシングした場合、手数料はいくらになりますか？**


    A: 10,000円を超える金額をお引出しの場合、ATM利用手数料は220円となります。


    なお、10,000円以下のお引出しの場合は110円となります。手数料の詳細については「キャッシング：手数料一覧」をご確認ください。'
