  title: 分割払い：分割払いの手数料率（実質年率、下限）について
  body: '**Q：分割払いを利用する際の手数料（実質年率）の下限はいくらですか？**


    A：分割払いの実質年率の下限は12%となっております。実際にお客様に適用される金利は、審査の結果に基づき12%から15%の範囲内で決定されます。


    詳細な料率については、「分割払い：金利・料率一覧」にてご確認いただけます。'
