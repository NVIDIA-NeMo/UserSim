  institution_id: tsumugi_card
- id: 7a0c076c-941a-5c33-a279-102516b96ff5
  title: キャッシング：プランの選び方
  body: '短期的な資金ニーズには「キャッシング」、より大きな金額を計画的に返済したい場合は「つむぎカードローン」が適しています。


    キャッシングは実質年率18%で、ATMから即座に利用できる利便性が特徴です。一方、カードローンはより低金利で長期的なプランが可能です。お客様の返済能力に合わせて誠実にご提案いたします。詳細は「キャッシング：当社の似た商品との比較」をご覧ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: comparison
  source_authority: official
  placeholder: true
