- id: 26e2248a-17d7-57cf-959b-1196804d756b
  title: 分割払い：お申込みとご利用開始
  body: '分割払いのご利用は、以下の手順で簡単にお手続きいただけます。計画的な返済プランを立てて、安心してお買い物をご利用ください。


    1.  **利用希望の提示**：対象となるお買い物の金額と、分割払いへの変更希望を私たちにお伝えください。

    2.  **回数の選択**：ご希望の支払回数をお選びください。最大24回まで設定が可能です。

    3.  **条件の確認**：適用される実質年率（12% ～ 15%）に基づいた月々の返済額と、最終的な手数料額を提示いたします。内容をご確認ください。

    4.  **承諾と確定**：提示内容にご同意いただけましたら、分割払いへの変更が完了し、次回以降の請求に適用されます。


    お申込みにあたっては、お客様の返済能力を審査し、適切かつ誠実なご提案をさせていただきます。概要は「分割払い：商品概要」をご覧ください。'
