- id: cd553a65-1b8b-5720-b3a2-9268a3322bf1
  title: つむぎカードローン：重要事項のご説明
  body: '本商品は、経済産業省（割賦販売法）および金融庁（銀行法・貸金業法）の監督指針を厳守して提供されます。過剰債務を防止するため、原則として年収の3分の1までとする「総量規制」および「支払可能見込額」の調査を徹底しております。


    【契約内容の要点】

    ・貸付金利：年4.5% ～ 18%（審査により決定）

    ・最大利用限度額：5,000,000円

    ・毎月の最低返済額：4,000円


    お客様の個人情報は指定信用情報機関へ登録され、適切に管理されます。公正な取り扱いと透明性のある開示に努めてまいります。'
