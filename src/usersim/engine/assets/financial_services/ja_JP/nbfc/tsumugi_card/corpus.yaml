  body: 'リボ払いは、月々の支払額を一定に抑えることで、家計の変動を緩やかにし、経済的な安心を「紡ぐ」ことができる柔軟な支払いオプションです。高額な買い物をした際や、月々の支出を管理したい方に最適です。


    【主な仕様】

    ・手数料（実質年率）：15%

