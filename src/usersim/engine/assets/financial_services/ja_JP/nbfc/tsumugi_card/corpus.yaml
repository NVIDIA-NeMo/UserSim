- id: f82536fb-73bf-5169-8c80-11e6646df18b
  title: つむぎカードローン：ご利用条件による違い
  body: 'ご利用条件による審査結果および適用内容の違いは以下の通りです。


    ・**審査基準を満たす場合**：最大5,000,000円の限度額、および年4.5%～18%の範囲内で金利を決定します。

    ・**総量規制に抵触する場合**：原則として年収の3分の1までという制限に基づき、利用限度額が調整されます。

    ・**支払可能見込額が不足する場合**：無理のない返済プランをご提案するため、限度額を低く設定するか、お申込みをお断りすることがあります。'
