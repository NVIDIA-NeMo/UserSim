- id: 02c2c3c3-4978-5e53-876b-3c420a02d337
  title: キャッシング：重要事項のご説明
  body: '本サービスは、貸金業法および金融庁の監督指針を厳守して運営されています。


    **【重要事項】**

    - **金利について**：本サービスの実質年率は 18% です。借入残高に対して日割りで計算され、毎月のご請求額に含まれます。

    - **限度額と総量規制**：ご利用限度額は最大 500,000円 ですが、貸金業法に基づき、原則として年収の3分の1を超える借入はできません（総量規制）。

    - **信用情報機関への登録**：ご契約内容およびお支払い状況は、指定信用情報機関に登録されます。適切に管理し、公正に取り扱います。

    - **本人確認**：限度額変更などの重要な操作の前には、多要素認証による厳格な本人確認を実施いたします。


    過剰債務を防止し、お客様が無理のない返済計画を維持できるよう、審査および限度額の設定を徹底しております。'
  domain: lending_mortgage
  product_category: cashing
