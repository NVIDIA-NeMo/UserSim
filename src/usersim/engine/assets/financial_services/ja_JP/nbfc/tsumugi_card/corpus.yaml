- id: 4348a8d3-616c-5efa-9dfd-35191f98e791
  title: つむぎカード：切替えや上位プランを検討するとき
  body: 'お客様が現在のつむぎカードから、より高機能なプランへの切替えを検討されている場合の案内指針です。


    **【判断基準】**

    *   **還元率の重視**: 現在の還元率0.5%以上のメリットを求めるか、あるいは年会費1,375円を上回る付帯サービスの価値を重視されるかを確認してください。

    *   **利用限度額のニーズ**: 最大1,000,000円の枠で不足が生じているかを確認し、より高い信用供与が必要な場合は上位プランをご提案ください。


    お客様の現在の返済能力を十分に審査した上で、誠実な提案を行ってください。詳細なプラン選びについては「つむぎカード：プランの選び方」をご参照ください。'
