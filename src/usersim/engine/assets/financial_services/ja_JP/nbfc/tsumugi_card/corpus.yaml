- id: dc28a6c0-60da-51e9-91e4-f251aeee3b36
  title: キャッシング：解約・変更・プランの切替え
  body: 'キャッシング機能の解約や利用限度額の変更をご希望の方は、以下の手順でお手続きください。


    **お手続きの手順**

    1. **ご要望の提示**：限度額の増減またはキャッシング機能の解約を当社へお申し付けください。

    2. **本人確認の実施**：セキュリティ保護のため、多要素認証による厳格な本人確認を行います。画面の指示に従い認証を完了させてください。

    3. **審査および内容確認**：限度額変更の場合、改めて支払可能見込額の調査を行い、適用可能な金額を提示いたします。

    4. **手続き完了の通知**：変更内容または解約が完了した旨を、アプリまたはメールにて通知いたします。


    **ご注意点**

    ・解約手続きを行う際は、まず現在のお借入残高をすべて完済していただく必要がございます。完済後の手続きとなりますのでご了承ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: d012b6e1-f1ce-5fcf-8a40-3cf10b3e8845
  title: キャッシング：想定外の手数料・金額
  body: "お客様より「ATM手数料が想定と異なる」または「請求金額が予想より高い」との申し出があった場合は、以下の順で確認してください。\n\n**1. ATM手数料の確認**\n\
    引き出し金額に応じて手数料が変動します。正しく適用されているか確認してください。\n・10,000円以下の場合 → 110円\n・10,000円超の場合\
    \ → 220円\n\n**2. 利息計算の確認**\nキャッシングの金利は実質年率18%であり、お借入残高に対して日割りで計算されます。利用期間が長いほど利息額が増加します。\n\
    \n**3. 対処とエスカレーション**\n上記を確認しても不整合がある場合、またはお客様が納得されない場合は、速やかに専門のコンプライアンス担当者へエスカレーションし、詳細な取引履歴の精査と回答を依頼してください。"
