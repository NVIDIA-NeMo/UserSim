- id: d9766aba-b3e1-5faf-8741-0e4a98ddcf09
  title: つむぎカード：状況・履歴の確認
  body: 'つむぎカードのご利用状況や、過去のお取引履歴を確認する手順をご案内します。


    **【確認の手順】**

    1.  **利用履歴の照会を依頼する**: 当社カスタマーセンターまたは公式アプリにて、確認したい期間の利用明細の照会を伝えてください。

    2.  **明細内容の確認**: 表示された各利用店舗名、利用日時、および決済金額（円）を確認します。ここで、リボ払いや分割払いが適用されているかどうかも併せてご確認いただけます。

    3.  **現在の利用可能枠の確認**: ショッピング利用限度額（最大1,000,000円）に対し、現在いくらまで利用可能かを確認します。


    **【完了の目安】**

    最新の決済状況が正しく反映されており、次回の請求予定金額が提示された時点で確認完了となります。'
