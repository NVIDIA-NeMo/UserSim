- id: 22725985-62d8-55b6-949c-8003e9c99137
  title: つむぎカードローン：お手続きが完了しない・保留中のまま
  body: '【症状】お申込み手続きが完了せず、画面が「保留中」のままとなっている。


    【考えられる原因】

    ・提出された本人確認書類の不備や、画像が不鮮明である。

    ・多要素認証（MFA）による本人確認が正常に完了していない。

    ・入力された情報と、指定信用情報機関の登録内容に相違がある。


    【確認および解決方法】

    1. ご提示いただいた書類の有効期限が切れていないか、再度ご確認ください。

    2. 認証メールやSMSが届いているかご確認いただき、必要に応じて再送手続きを行ってください。


    上記を確認しても解決しない場合は、専門のコンプライアンス担当者へエスカレーションし、審査状況の詳細を確認いたします。'
