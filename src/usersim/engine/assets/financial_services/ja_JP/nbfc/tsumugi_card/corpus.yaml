- id: 21ca6048-4cd6-5936-905e-ea0e7bad7ed6
  title: change_revolving_payment を使う場面
  body: 'お客様が、現在設定されているリボ払いの「毎月の支払額（約定支払額）」を変更したい場合に本ツールを使用します。収支状況に合わせて、返済スピードを調整することで、経済的な安心をサポートします。


    【手続き手順】

    1. 多要素認証により、お客様の本人確認を適切に実施します。

    2. get_accounts を使用して、対象となる account_id を特定します。

    3. お客様に、変更後の毎月の支払希望額を確認します。

    4. 支払額を減らす場合は、完済までの期間が延び、結果として支払手数料が増加することを丁寧に説明し、同意を得ます。

    5. change_revolving_payment を呼び出し、月々の支払額の変更を完了させます。'
  domain: payments
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_revolving_payment
  institution_id: tsumugi_card
