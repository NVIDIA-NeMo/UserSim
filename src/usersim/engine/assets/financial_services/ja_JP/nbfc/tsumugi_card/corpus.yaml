- id: 867b2353-b87f-5036-9156-ab7134590c2f
  title: つむぎカード：よくあるお手続きの流れ
  body: 'つむぎカードのお申込みからご利用開始までの一般的な流れをご案内します。


    **【お手続きのステップ】**

    1.  **お申込みの意思伝達**: ご希望のカード種別を当社にお伝えください。

    2.  **審査書類の提出**: 本人確認書類および収入証明書などを提出いただき、支払可能見込額の調査を行います。

    3.  **審査結果のご案内**: 審査に基づき、ショッピング利用限度額（最大1,000,000円まで）を決定し、結果をご通知します。

    4.  **カードの受取と有効化**: ご自宅に届いたカードを確認し、初回利用時の設定を行ってください。


    **【完了の目安】**

    カードが手元に届き、初回の決済（またはアプリでの利用状況確認）が正常に行えた時点で、お手続きは完了となります。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: how_to_guide
