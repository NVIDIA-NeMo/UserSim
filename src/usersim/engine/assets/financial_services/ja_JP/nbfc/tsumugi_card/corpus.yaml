- id: 24ddec24-432b-5339-822f-ef55a56d8383
  title: つむぎカードローン：リスクについてのご説明
  body: 'つむぎカードローンのご利用にあたり、以下のリスクについて十分にご理解ください。


    **【過剰債務の防止について】**

    当社は貸金業法に基づき、原則として年収の3分の1までという「総量規制」を厳守しております。支払可能見込額を超えた借入は、生活の安定を損なう恐れがあります。


    **【金利に関するリスク】**

    適用金利は年4.5%から最大18%まで変動します。金利が高い設定となった場合、返済期間が長期化し、支払利息の総額が増加する可能性があります。


    **【返済の義務】**

    毎月最低4,000円の返済が必要となります。無理のない返済計画を立て、誠実にご利用ください。ご不安がある場合は、専門家への相談を推奨いたします。'
