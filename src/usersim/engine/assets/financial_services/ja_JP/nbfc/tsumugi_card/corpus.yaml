- id: 0712f188-6398-54fc-87f6-71ef2a58aa52
  title: つむぎカード：お申込みとご利用開始
  body: 'つむぎカードのお申込みからご利用開始までの手順をご案内いたします。


    1. **必要書類の提示**：ご本人確認書類（運転免許証など）と、年収等の情報を弊社へ提示してください。

    2. **審査と限度額の決定**：弊社にて支払可能見込額の調査を行い、ショッピング利用限度額（最大1,000,000円）を決定いたします。

    3. **カードの受取と暗証番号設定**：ご自宅に届いたカードを確認し、指定の方法で暗証番号の設定を完了させてください。

    4. **利用開始の確認**：公式アプリにてカードの状態が「有効」になっていることをご確認いただければ、すぐにご利用いただけます。


    お手続きの詳細や条件については、「つむぎカード：お申込みいただける方」をご覧ください。'
  domain: payments
  product_category: tsumugi_card_standard
