  body: 'Q：つむぎカードローンの貸付金利の最低金利はどのくらいですか？


    A：つむぎカードローンの下限金利は年4.5%です。実際にご適用となる金利は、お客様の年収や生活維持費、既存の借入状況に基づき、年4.5%から18%の範囲内で審査により決定されます。'
