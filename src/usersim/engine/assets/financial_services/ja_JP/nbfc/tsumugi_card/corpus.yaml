- id: ff32247f-452b-52f1-9339-f3169cda7986
  title: 分割払い：当社の似た商品との比較
  body: "「分割払い」と「リボ払い」は、どちらも支払額を分散できるサービスですが、仕組みが異なります。\n\n*   **分割払い**：最大24回というあらかじめ決められた回数で計画的に返済します。終了時期が明確であるため、高額な買い物の返済計画を立てたい方に最適です。\n\
    *   **リボ払い**：月々の支払額を一定に抑え、家計の変動を緩やかにします。利用金額が増えても月々の負担が変わらないため、日常的な支出を管理したい方に適しています。\n\
    \n**【選び方】**\n*   特定の高額商品について、期限を決めて完済したい場合 → **分割払い**\n*   月々の支払額を固定し、柔軟に家計を管理したい場合\
    \ → **リボ払い**\n\n詳細は「リボ払い：商品概要」をご覧ください。"
