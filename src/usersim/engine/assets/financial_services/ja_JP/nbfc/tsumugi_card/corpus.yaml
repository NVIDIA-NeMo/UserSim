  institution_id: tsumugi_card
- id: b228f07d-79d2-5185-ba3e-402abe7700eb
  title: つむぎカードローン：ログインできない・アクセスできない
  body: '公式アプリやウェブサイトにログインできない場合は、以下の点をご確認ください。


    **考えられる原因と対処法**

    ・**ID・パスワードの誤入力**：大文字・小文字、全角・半角が正しく入力されているかご確認ください。

    ・**通信環境の不安定**：Wi-Fiやモバイルデータ通信の接続状況をご確認ください。

    ・**アカウントのロック**：認証に複数回失敗した場合、セキュリティのため一時的にロックされます。


    **解決しない場合**

    上記を確認しても解決しない場合は、弊社にて本人確認を行った後、パスワードの再設定を承ります。なお、他社サービスからの移行をご検討中の方で、アクセス制限などの不安がある場合は「つむぎカードローン：商品概要」にて当社のサポート体制をご確認ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
