  institution_id: tsumugi_card
- id: d26e70c3-a220-5c53-bc83-162258b18152
  title: キャッシング：当社の似た商品との比較
  body: '急な資金ニーズがある場合、「キャッシング」と「つむぎカードローン」のどちらが適しているかをご案内します。


    | 比較軸 | キャッシング | つむぎカードローン |

    | :--- | :--- | :--- |

    | **目的** | 短期的な小口融資（即時性重視） | 計画的な中長期の借入（低コスト重視） |

    | **金利（年率）** | 18% | より低金利（詳細は個別審査） |

    | **限度額** | 最大 500,000円 | キャッシングより大きな金額が可能 |

    | **利便性** | ATMで即座に現金化可能 | 返済プランを事前に設定 |


    **【選び方の目安】**

    - 数日〜数週間で返済可能な少額の資金が必要な方は、利便性の高い**キャッシング**が最適です。

    - より大きな金額を、低金利で計画的に返済したい方は、**つむぎカードローン**をお勧めいたします。'
  domain: lending_mortgage
  product_category: cashing
