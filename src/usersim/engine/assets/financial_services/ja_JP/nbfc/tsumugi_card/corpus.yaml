- id: f3192b03-7533-5c84-9a13-d45ab4d7c0db
  title: つむぎカードローン：登録内容の変更
  body: 'ご住所や電話番号などの登録内容を変更される際の手順をご案内します。


    **準備するもの**

    ・ご本人様確認書類（運転免許証など）


    **お手続きの流れ**

    1. **変更内容の伝達**：変更したい項目（住所、連絡先など）を弊社担当にお伝えください。

    2. **本人確認の実施**：セキュリティ保護のため、多要素認証による厳格な本人確認を行います。

    3. **書類の提出**：住所変更などの場合は、最新の確認書類をご提出ください。

    4. **完了通知の受領**：弊社にて内容を確認後、変更完了の通知をお送りいたします。


    ご返済口座の変更については、「つむぎカードローン：解約・変更・プランの切替え」をご参照ください。'
  domain: lending_mortgage
