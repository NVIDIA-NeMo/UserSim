  title: リボ払い：お申込みとご利用開始
  body: 'リボ払いのご利用開始までの手順をご案内いたします。


    1. お手続きの依頼：担当者へリボ払いへの変更または新規申し込みを伝えてください。

    2. 本人確認：多要素認証による厳格な本人確認を実施します。画面の指示に従い認証を完了させてください。

    3. 審査と確認：割賦販売法に基づきお客様の「支払可能見込額」を調査し、無理のない返済能力があるかを確認します。

    4. 条件の合意：実質年率15%の手数料と、毎月の最低支払額5,000円について、内容に同意していただきます。

    5. 利用開始：手続き完了の通知をもって、リボ払いをご利用いただけます。


    ご利用状況の確認については「リボ払い：状況・履歴の確認」をご参照ください。'
