  institution_id: tsumugi_card
- id: 53709ed9-9ce7-5d35-973a-6dca7a654646
  title: キャッシング：登録内容の変更
  body: 'ご登録情報の変更をご希望の場合は、以下の手順でお手続きください。


    1. **変更内容の提示**：住所や電話番号など、変更したい内容を私たちにお知らせください。

    2. **本人確認の実施**：セキュリティ保護のため、多要素認証による厳格な本人確認を行います。画面の指示に従い認証を完了させてください。

    3. **変更内容の確定**：担当者が変更内容を確認し、登録を更新します。

    4. **完了通知の受領**：お手続きが完了した後、確認の通知が届きます。


    ご不明な点は「キャッシング：状況・履歴の確認」をご参照ください。'
  domain: lending_mortgage
  product_category: cashing
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: e8171f47-582d-5e7a-b8e4-b3072d53f148
  title: キャッシング：ログインできない・アクセスできない
  body: 'キャッシングの管理画面にログインできない場合は、以下の点をご確認ください。


    **考えられる原因と対処法**：

    - **ID・パスワードの誤入力**：大文字・小文字が正しく入力されているかご確認ください。

    - **アカウントのロック**：認証失敗が続いた場合、セキュリティのため一時的に制限されます。

    - **通信環境の不安定**：ネットワーク接続を再確認し、再度お試しください。


    **解決しない場合**：

    私たちにお知らせいただければ、本人確認の上、パスワードの再設定やロック解除をサポートいたします。複雑な不具合については、専門のコンプライアンス担当者へエスカレーションし、迅速に解決を図ります。'
  domain: lending_mortgage
  product_category: cashing
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: 16a11a1d-b285-5703-939e-80f490adc57a
  title: キャッシング：ご利用条件による違い
  body: 'お客様の状況に応じたキャッシング利用可否の判断基準は以下の通りです。


    - **年収の3分の1以下（借入合計額）**：原則として審査通過後、最大500,000円の範囲内で限度額を設定。

    - **年収の3分の1を超える借入がある場合**：総量規制に基づき、原則として新規利用不可。

    - **支払可能見込額が不足している場合**：過剰債務防止のため、利用不可または限度額を制限。'
  domain: lending_mortgage
  product_category: cashing
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
