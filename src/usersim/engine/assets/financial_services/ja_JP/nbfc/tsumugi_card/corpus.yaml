- id: 92804016-1932-5a01-8635-c9eb09117a5c
  title: つむぎカード：この商品をかたる詐欺にご注意ください
  body: '最近、つむぎカードの社員をかたり、お客様の個人情報やカード情報を聞き出そうとする不審な電話やメールが増えております。以下の点に十分ご注意ください。


    **【つむぎカードから絶対に行わないこと】**

    *   **暗証番号（PIN）やセキュリティコードを電話やメールで伺うことはございません。**

    *   **メールに記載されたURLから、パスワードの再設定を急かして個人情報を入力させることはございません。**

    *   **ギフトカードなどの金券による支払いを要求することはございません。**


    もし「限度額の引き上げに必要」などの理由で不審な連絡を受けた場合は、すぐにお電話を切り、当社カスタマーセンターまでご連絡ください。万が一、情報を伝えてしまった可能性がある場合は、**直ちにカードの利用停止手続き**を行ってください。迅速な対応が被害を最小限に抑えることにつながります。'
