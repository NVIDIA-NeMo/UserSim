  body: '**Q: リボ払いの毎月の最低支払額はいくらですか？**

    A: つむぎカードのリボ払いにおける毎月の最低支払額は5,000円です。残高が5,000円未満の場合は、その全額がお支払い額となります。


    **Q: 最低支払額以上の金額を支払うことはできますか？**

    A: はい、可能です。「繰上返済」として追加でお支払いいただくことで、効率的に残高を減らし、実質年率15%の手数料を節約いただけます。詳細は「リボ払い：手数料一覧」をご覧ください。'
