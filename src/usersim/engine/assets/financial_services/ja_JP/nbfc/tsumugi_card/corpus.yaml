- id: eb3a8457-7940-5cf2-a2fb-3e872519b365
  title: リボ払い：ご利用開始までの手順
  body: '【サポート担当者向け：リボ払い利用開始ガイダンス】

    お客様が「リボ払い」の利用を開始される際の手順は以下の通りです。誠実かつ丁寧に案内してください。


    1.  **意向確認と説明**：お客様に、月々の支払額を一定に抑えられる利便性と、実質年率15%の手数料が発生することを明確に説明します。

    2.  **支払可能見込額の調査**：年収、生活維持費、既存のクレジット債務に基づき、無理のない返済計画が可能かを確認します。

    3.  **本人確認の実施**：契約内容の変更となるため、多要素認証を用いて厳格な本人確認を行います。

    4.  **設定の完了**：最低支払額（5,000円）を含む、月々の支払金額を決定し、設定を完了させます。

    5.  **完了通知**：設定内容を改めてお客様に伝え、手続きが完了したことを案内します。'
  domain: payments
  product_category: ribo_barai
  document_type: product_sheet
  source_authority: official
  placeholder: true
