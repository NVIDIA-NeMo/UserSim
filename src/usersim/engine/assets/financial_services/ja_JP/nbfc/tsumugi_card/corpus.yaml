- id: 2bc363fd-0347-571c-b5c1-9d734af26e59
  title: キャッシング：安全にご利用いただくためのポイント
  body: 'キャッシングを安全にご利用いただくために、以下の点に十分ご注意ください。


    **暗証番号の管理**：推測されやすい番号を避け、第三者に教えないでください。

    **利用状況の確認**：不審な利用がないか、定期的にご利用明細をご確認ください。

    **本人確認の徹底**：利用限度額の変更や契約内容の変更時には、必ず多要素認証による厳格な本人確認を実施いたします。


    万が一、カードの紛失や盗難が発生した場合は、直ちに利用停止の手続きを行ってください。規定に基づいた迅速な補償対応により、お客様の資産を守ります。


    詳細は「キャッシング：不正利用からお客さまを守るために」もあわせてご覧ください。'
