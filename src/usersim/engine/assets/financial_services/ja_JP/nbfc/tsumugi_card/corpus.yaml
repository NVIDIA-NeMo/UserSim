- id: e07e6950-d6b1-531a-ba6f-d22948644103
  title: 分割払い：重要事項のご説明
  body: '本サービスは、経済産業省（割賦販売法）および金融庁（銀行法・貸金業法）の監督指針を厳守して提供されます。


    **【重要事項】**

    *   **手数料について**：分割払いのご利用には、実質年率12% ～ 15%の手数料が発生します。これは安全な決済インフラの維持とサービス向上のための適正な料金です。

    *   **支払回数**：最大24回までとなります。

    *   **過剰債務の防止**：当社は割賦販売法に基づきお客様の支払可能見込額を調査し、その範囲内で利用可能枠を設定することで、無理のないご利用を促します。

    *   **個人情報の取り扱い**：指定信用情報機関への登録を含め、適切に管理し、透明性のある開示を行います。


    金利の詳細については「分割払い：金利・料率一覧」をご参照ください。'
