- id: 590473b6-3786-506d-8047-b6e938033ffd
  title: リボ払い：限度額・制限と注意事項
  body: '「リボ払い」のご利用にあたっては、以下の限度額および制限事項をご案内ください。


    **【適用される手数料と支払額】**

    *   実質年率：15%

    *   毎月の最低支払額：5,000円


    **【利用制限と注意事項】**

    *   **支払可能見込額の調査**：割賦販売法に基づき、カードの発行時と利用可能枠の増額時に支払可能見込額を調査し、過剰債務を防止するための厳格な審査を実施しております。ショッピングのリボ払いは貸金業法の総量規制の対象外です。

    *   **利息の発生**：リボ払いは、支払額を一定に抑えられる利便性がある一方、返済期間が長くなるほど、15%の手数料負担が増加します。

    *   **最低支払額の遵守**：毎月5,000円以上の支払いが必須となります。この金額を下回る設定はできず、支払いが滞った場合は遅延損害金が発生する可能性があります。'
