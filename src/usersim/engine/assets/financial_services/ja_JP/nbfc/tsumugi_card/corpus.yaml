- id: a48e126e-d56f-544a-8293-cd6d13865e8f
  title: つむぎカードローン：お申込みとご利用開始
  body: 'つむぎカードローンのお申込みからご利用開始までの手順をご案内します。


    1. お申込みの意思をお伝えいただき、本人確認書類および収入証明書をご提示ください。

    2. 当社にて、年収や生活維持費に基づく「支払可能見込額」の調査および信用情報機関への照会を行い、審査を実施いたします。

    3. 審査結果に基づき、最大5,000,000円までの利用限度額を決定し、ご案内いたします。

    4. ご契約手続き後、多要素認証による厳格な本人確認を経て、ご指定の口座へ資金を振り込ませていただきます。


    手続き完了後、公式アプリやウェブサイトにて、適用金利（年4.5% ～ 18%）と限度額をご確認いただけます。'
