- id: 7e57086a-169a-574f-bd3b-6b5a0230b95d
  title: 分割払い：ご利用開始までの手順
  body: '【サポート担当者向け：分割払い利用開始の案内フロー】


    お客様が「分割払い」の利用を希望された際は、以下の手順で案内し、手続きを完了させてください。


    1. **本人確認の実施**：状態変更を伴う操作となるため、多要素認証を用いて厳格な本人確認を行ってください。

    2. **支払可能見込額の確認**：お客様の年収や既存の借入状況を確認し、過剰債務を防止するための審査基準を満たしているか確認します。

    3. **条件の提示と合意**：適用される実質年率（12%から15%の範囲内）および、最大24回までの分割回数について説明し、お客様の同意を得てください。

    4. **設定の完了**：ご希望の回数に基づき決済設定を適用し、完了した旨を通知します。


    注意点として、3回払いを選択される場合は、利用金額100円あたり2.01円の手数料が発生することを明確に伝えてください。詳細な料金体系は「分割払い：手数料一覧」を併せて参照してください。'
