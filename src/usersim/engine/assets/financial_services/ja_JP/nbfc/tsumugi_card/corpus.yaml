- id: e199902d-2863-5f71-9215-e12c97038b7f
  title: 分割払い：お手続きが完了しない・保留中のまま
  body: '分割払いの変更手続きが完了せず、「保留中」のままとなっている場合は、以下の点をご確認ください。


    **【考えられる原因と確認事項】**

    *   **本人確認の未完了**：状態変更の前に必要な多要素認証が完了していない可能性があります。認証手続きが正しく行われたか再度ご確認ください。

    *   **利用限度額の不足**：分割払いの適用により、一時的に利用可能枠の計算が変動し、制限がかかっている場合があります。

    *   **審査への回付**：お申込み内容に基づき、詳細な審査を行っております。通常、数営業日以内に結果が反映されます。


    **【解決しない場合】**

    上記を確認しても解決しない場合は、専門のコンプライアンス担当者が審査状況を確認し、個別に結果を通知いたします。適用条件については「分割払い：お申込みいただける方」をご参照ください。'
