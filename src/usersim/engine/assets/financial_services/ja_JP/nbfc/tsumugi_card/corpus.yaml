- id: 787afeae-798a-50ba-b22c-88cfb1cd0b53
  title: 分割払い：リスクについてのご説明
  body: '「分割払い」のご利用にあたり、以下のリスクについて十分にご理解ください。


    **手数料による負担増**

    分割払いを利用すると、実質年率12%から15%の手数料が発生します。一括払いに比べて、最終的な支払総額は多くなります。特に回数を長く設定する場合、手数料の負担が増える点にご注意ください。


    **過剰債務の防止**

    無理な分割支払いは、家計を圧迫する原因となります。当社では、割賦販売法に基づき、お客様の「支払可能見込額」に基づいた適切な審査を行い、過剰な債務を抱えないよう配慮いたします。


    **お支払い遅延のリスク**

    支払いが遅れた場合、遅延損害金が発生し、信用情報機関への登録を通じて今後のカード利用やローン契約に影響を及ぼす可能性があります。'
