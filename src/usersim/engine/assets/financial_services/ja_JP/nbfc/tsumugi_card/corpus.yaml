- id: 4d476e7e-5fe9-50ba-a11f-0743824357d8
  title: つむぎカード：重要事項のご説明
  body: '本製品のご利用にあたり、以下の重要事項をご確認ください。


    **【信用供与と限度額】**

    つむぎカードのショッピング利用限度額は、審査に基づき最大1,000,000円まで設定されます。これはお客様の支払可能見込額を調査し、過剰債務を防止するための措置です。


    **【個人情報の取扱い】**

    お申込みに際し、指定信用情報機関への登録および照会を行います。取得した個人情報は、割賦販売法および貸金業法に基づき厳正に管理いたします。


    **【費用負担】**

    年1回、1,375円の年会費が発生します。また、ETCカードを併用される場合は別途550円の年会費を申し受けます。支払期限を過ぎた場合は、遅延損害金が発生する場合がありますのでご注意ください。'
  domain: payments
  product_category: tsumugi_card_standard
  document_type: disclosure
  source_authority: official
