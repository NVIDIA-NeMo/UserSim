- id: 9034cf4d-a8e7-5bbd-b46c-a4221b9b057b
  title: つむぎカードローン：想定外の手数料・金額
  body: 'お客様より「請求金額が想定より高い」とのご相談を受けた際は、以下の点をご確認ください。


    **【考えられる原因】**

    ・**金利の適用：** 適用金利が年4.5%から18%の範囲で設定されており、借入残高に応じて日割り計算で利息が発生しているためです。

    ・**返済サイクルのずれ：** 返済日の変更や、繰上返済が行われなかったことにより、利息の累積額が変動した可能性があります。


    **【対応手順】**

    1. 直近の利用明細と適用金利（最大18%）を確認します。

    2. 利息計算の根拠を具体的にご説明し、ご納得いただけるか確認します。

    3. 計算に不備がある場合や、解決が困難な場合は、専門のコンプライアンス担当者へエスカレーションし、精査いたします。'
