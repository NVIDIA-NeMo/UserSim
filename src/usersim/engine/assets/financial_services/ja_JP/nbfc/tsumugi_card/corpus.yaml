- id: 26312ffc-16d7-58ff-89ac-ece5ea8cfdaa
  title: キャッシング：リスクについてのご説明
  body: 'キャッシングをご利用いただく前に、以下のリスクについて十分にご確認ください。


    **金利負担について**

    本サービスの実質年率は18%です。利息は日割りで計算されるため、返済期間が長くなるほど、支払う手数料（利息）の総額が増加します。


    **過剰債務の防止について**

    当社では、貸金業法に基づき、原則として年収の3分の1までという「総量規制」を厳守しています。無理な借入は経済的な不安につながるため、お客様の返済能力に応じた適切な利用をお願いいたします。


    **返済の義務**

    キャッシングはあくまで借入であり、将来的に必ず返済する必要があります。支払いが遅延した場合は、遅延損害金が発生し、信用情報機関への登録を通じて今後の金融サービス利用に影響が出る可能性があります。'
