- id: 66b74e98-572f-585f-aaaa-19c272e6c8d3
  title: つむぎカードローン：不正利用からお客さまを守るために
  body: 'つむぎカードローンでは、お客さまの資産を守るため、厳格なセキュリティ体制を整えております。


    **【安全にご利用いただくための仕組み】**

    ・利用限度額の変更やご契約内容の変更など、重要な操作の前には必ず**多要素認証**による本人確認を実施いたします。

    ・インターネット経由での手続きには、最新の認証規格を導入し、第三者によるなりすましを防止しています。


    **【ご注意いただきたい点】**

    当社が、メールや電話で暗証番号やパスワードを直接お伺いすることはございません。不審な連絡があった場合は、すぐに利用停止の手続きを行ってください。万が一、不正利用の疑いがある場合は、迅速に補償手続きを承りますので、速やかに当社までお知らせください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tsumugi_card
- id: c6d66ac2-457d-5533-9d26-82f8f6447d95
  title: つむぎカードローン：規定・約款
  body: '本規定は、つむぎカードローンの利用に関する合意事項を定めるものです。


    **1. 貸付条件と限度額**

    お客様の審査に基づき、最大5,000,000円までの利用限度額を設定いたします。適用金利は年4.5%から18%の範囲内で決定されます。


    **2. お支払い義務**

    お客様は、毎月最低4,000円以上の返済を行う義務を負います。返済日の遅延が発生した場合、規定に基づき遅延損害金が加算されることがあります。


    **3. 契約の変更と終了**

    ご契約内容の変更は、多要素認証による本人確認完了後に承ります。また、残高をすべて完済し、解約手続きを完了させることで本契約は終了いたします。


    詳細な法令遵守事項については、「法令・制度に関するご案内：ローン」をご参照ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
  document_type: terms_conditions
  source_authority: official
