- id: ac18b9f3-8573-51cc-ab63-99bfef198132
  title: つむぎカードローン：よくあるお手続きの流れ
  body: 'つむぎカードローンのご契約からご利用開始までの一般的な流れをご案内いたします。


    **【お手続きの流れ】**

    1. **お申込み：** 年収や生活維持費などの情報をご提示いただき、お申込み手続きを行います。

    2. **審査：** ご提示いただいた情報に基づき、「支払可能見込額」の調査および審査を行います。ここでは総量規制（年収の3分の1まで）に基づいた適切な限度額を決定します。

    3. **本人確認：** 審査通過後、多要素認証による厳格な本人確認を実施します。

    4. **契約締結：** 適用金利（4.5% ～ 18%）および利用限度額（最大5,000,000円）を確認し、ご契約を締結します。

    5. **資金の利用：** 指定の口座等へ資金を振り込み、ご利用可能となります。


    審査結果によっては、ご希望の限度額に達しない場合や、お申込みをお断りする場合があることをあらかじめご了承ください。'
  domain: lending_mortgage
  product_category: tsumugi_card_loan
