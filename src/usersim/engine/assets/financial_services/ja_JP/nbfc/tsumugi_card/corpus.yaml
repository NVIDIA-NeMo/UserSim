  title: 分割払い：3回払いの手数料（利用金額100円あたり）について
  body: 'Q：分割払いで「3回払い」を選択した場合の手数料はいくらになりますか？


    A：「分割払い」の3回払い手数料は、利用金額100円あたり2.01円となります。


    例として、10,000円のお買い物を3回払いにされた場合、手数料は201円となります。詳細な料金プランについては、「分割払い：手数料一覧」をご確認ください。'
