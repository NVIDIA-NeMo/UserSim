- id: 993d7b17-fe2c-5a03-93f9-3f53ec255c25
  title: Joint Brokerage Account — resolve a common request end-to-end
  body: 'One of the most common requests for joint accounts is the process of transferring
    the account to another institution. This guide explains how to resolve this request
    from start to finish.


    **Prerequisites**

    - Consent from both joint account holders.

    - The account number and receiving details (DTC number) of the new brokerage.

    - A verified secure session for both parties.


    **Steps to Transfer the Account Out**

    1. **Initiate Request**: State that you wish to transfer your **Joint Brokerage
    Account** to another institution. Provide the receiving firm''s details.

    2. **Joint Verification**: We will require both account owners to authenticate
    their identity via multi-factor authentication to authorize the transfer. This
    prevents unauthorized asset movement.

    3. **Fee Acknowledgement**: We will notify you that an account transfer out fee
    of $75 applies. You must confirm your acceptance of this charge.

    4. **Asset Review**: We will provide a list of all current holdings to ensure
    they are transferable. Note that any trades currently in the **Settlement** process
    must be finalized before the transfer can complete.

    5. **Execution**: We will initiate the transfer process. You will receive a confirmation
    message once the assets have been sent to the receiving firm.


    **How you know it worked**

    - You will receive a final statement showing the $75 transfer fee deduction.

    - Your positions will no longer appear in your Solstice Invest portfolio.

    - The receiving institution will notify you once the assets have been successfully
    deposited into your new account.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: how_to_guide
  source_authority: official
