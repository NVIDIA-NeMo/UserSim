    \ to Minors Act (UGMA) and operates under the regulatory frameworks of the SEC\
    \ and FINRA. \n\n**Standard of Care**\nIn accordance with **Regulation Best Interest**,\
    \ Solstice Invest acts in the best interest of the retail customer. We provide\
    \ suitable product recommendations and educational materials. However, we explicitly\
    \ do not offer individualized tax or legal advice. Custodians are encouraged to\
    \ consult with a tax professional regarding the implications of UGMA accounts.\n\
    \n**Risk Disclosure**\nInvesting in securities involves the risk of loss. Solstice\
    \ Invest does not guarantee returns on any investment. All assets held within\
    \ the Custodial (UGMA) Brokerage are subject to market risk. \n\n**Fees and Costs**\n\
    To ensure democratization of market access, this account features a **stock trade\
    \ commission of $0**, an **account maintenance fee of $0**, and a **minimum opening\
    \ deposit of $0**. Fees may only be applied for specific administrative actions\
    \ or specialized credit services required for regulatory compliance.\n\n**Settlement\
    \ and Liquidity**\n**Settlement** is the process by which a trade is finalized.\
    \ The timing of this process is subject to SEC and FINRA regulations and may impact\
    \ the immediate availability of cash or securities.\n\n**Data Privacy**\nWe maintain\
    \ strict data privacy standards. Identity verification and multi-factor authentication\
    \ are mandatory for all state-changing actions to protect the assets of the minor."
