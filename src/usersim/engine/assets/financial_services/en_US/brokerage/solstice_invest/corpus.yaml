- id: 85c6c7a1-f90a-52da-9423-b1d5b25c81f0
  title: Individual Brokerage Account — privacy and data handling
  body: 'Solstice Invest is committed to the highest standards of data privacy and
    transparency. This disclosure explains how we handle your personal and financial
    information associated with your Individual Brokerage Account.


    **Data Collection and Usage**

    We collect personal identifiers, financial history, and trading activity to comply
    with SEC and FINRA frameworks. This data is used exclusively to facilitate your
    trades, manage your account, and ensure regulatory compliance. We do not sell
    your personal data to third-party marketers.


    **Secure Processing**

    To prevent unauthorized access, we implement strict multi-factor authentication
    and identity verification. No state-changing action—such as a fund transfer or
    a change in account ownership—is processed without a verified secure session.
    This ensures that your assets and identity remain protected.


    **Regulatory Compliance**

    Under **Regulation Best Interest**, we maintain a strict standard of care. We
    use your data to ensure that product recommendations are suitable for your investment
    profile. All data handling processes are designed to prioritize the best interest
    of the retail customer.


    **Information Sharing**

    We may share your information with regulatory bodies (such as the SEC or FINRA)
    when required by law or during a standardized investigation to resolve fraud disputes
    fairly. We follow a strict investigation timeline and notify clients of progress
    through secure channels.


    **Client Rights**

    Clients have the right to review the data we hold and request corrections to their
    personal information. These requests are handled via secure in-app messaging and
    are processed once the identity of the requester is verified.


    *Disclaimer: While we employ rigorous security measures, returns on investments
    are never guaranteed, and all trading involves market risk.*'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: disclosure
  source_authority: official
