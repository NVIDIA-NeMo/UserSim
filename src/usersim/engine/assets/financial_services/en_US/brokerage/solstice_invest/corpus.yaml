- id: f3f2c1e6-dd1e-5cb7-9294-309dcb2f1ba4
  title: Custodial (UGMA) Brokerage — a discrepancy in your records or statement
  body: '**Symptom:** You have noticed a discrepancy between your personal records
    and the official account statement for the Custodial (UGMA) Brokerage (e.g., a
    missing deposit, an incorrect share balance, or an unexpected figure).


    **Likely Causes**

    - **Pending Settlement:** A trade may be visible in your history but has not yet
    reached **Settlement**, causing a temporary difference in available cash.

    - **Timing Difference:** The statement was generated before a recent deposit or
    trade was finalized.

    - **Dividend Reinvestment:** A dividend may have been automatically reinvested
    into shares, changing the share count without a manual trade appearing in your
    notes.


    **What to Check (In Order)**

    1. **Check Pending Transactions:** Review the ''Pending'' section of your account
    activity to see if any funds are currently in the settlement window.

    2. **Compare Dates:** Match the date of the discrepancy against the statement''s
    ''As Of'' date to ensure the activity occurred within the reporting period.

    3. **Review Dividend History:** Check for any automated credits or share additions
    resulting from dividends.


    **The Fix**

    - If the discrepancy is due to settlement, no action is needed; the records will
    align once the trade is finalized.

    - If you find a genuine error (e.g., a deposit was made but not credited), provide
    us with the transaction ID or a bank confirmation of the transfer. We will reconcile
    the account immediately.


    **When to Escalate**

    If we cannot resolve the discrepancy during the conversation, we will initiate
    a formal internal audit of the account. We treat these reports with urgency and
    will provide progress updates through secure channels. You will receive a final
    resolution notice once the audit is complete and any necessary corrections are
    applied.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: ec527ce6-55cb-5550-b0b1-804ad3fd2c60
  title: Margin Investing Account — overview
  body: 'The **Margin Investing Account** is an advanced tool for experienced investors
    to leverage their equity for increased buying power. By borrowing funds from Solstice
    Invest and using your account equity as collateral, you can purchase more securities
    than you could with cash alone.


    **Key Financial Terms**

    To maintain a Margin Investing Account, the following requirements and costs apply:


    *   **Margin Rate**: Borrowed funds are subject to an interest rate of 8.5%.

    *   **Minimum Equity**: A minimum equity of $2000 is required to open and maintain
    the account.

    *   **Maintenance Margin**: You must maintain an equity percentage of 25% of the
    total market value of the securities in your account.


    **How It Works**

    When you use **Margin**, you are effectively taking a loan from the brokerage
    to amplify your market position. While this can increase potential returns, it
    also increases potential losses. If your account equity falls below the 25% **Maintenance
    Margin**, you may receive a margin call, requiring you to deposit additional funds
    or sell securities to bring the account back into compliance.


    **Our Commitment**

    In alignment with **Regulation Best Interest**, we provide these tools to sophisticated
    traders who understand the inherent risks of leverage. We maintain a strict standard
    of care: we never guarantee returns, and all investors must be aware that you
    can lose more than your initial investment when trading on margin.


    **Disclaimer**: Investing involves risk. Returns are not guaranteed. Margin trading
    increases the risk of loss.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 2bf6a8fc-e0f0-586c-b1ef-e44153b88e72
  title: Margin Investing Account — margin rate explained
  body: '**How is the margin rate applied to my account?**

    The **Margin Investing Account** carries a flat margin rate of 8.5%. This interest
    is charged on the total amount of funds you have borrowed from Solstice Invest
    to purchase securities. Interest accrues daily and is typically debited from your
    account on a monthly basis.


    **Does the 8.5% rate change?**

    While the current rate is 8.5%, this rate is subject to change based on market
    conditions and regulatory shifts. We will notify you of any rate adjustments through
    secure in-app messaging.


    **How can I avoid paying the margin rate?**

    You only pay the 8.5% interest on the amount you actually borrow. If you purchase
    securities using only your own deposited cash (cash-basis trading), no margin
    interest is charged. For more details on costs, see the Margin Investing Account
    — fee schedule.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: faq
  source_authority: official
