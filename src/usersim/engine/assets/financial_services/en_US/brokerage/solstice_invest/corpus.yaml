- id: 7a261a6a-2e72-54a1-b51f-4964edcbae70
  title: Joint Brokerage Account — check status or history
  body: 'Monitoring your joint investments ensures that both account holders stay
    aligned on their financial goals. Follow these steps to review your account status
    and transaction history.


    **Prerequisites**

    - A verified secure session (multi-factor authentication completed).

    - Access to your account login credentials.


    **Steps to Review Account Status**

    1. **Request Account Overview**: Ask us for a current summary of your **Joint
    Brokerage Account**. We will provide your total account equity, current cash balance,
    and a list of your open positions.

    2. **Review Settlement Status**: If you have recently traded, ask us to check
    the status of your pending trades. We will confirm if the trade has reached **Settlement**
    or if it is still processing.

    3. **Request Transaction History**: Specify the time frame you wish to review
    (e.g., the last 30 days or the previous calendar year). We will provide a detailed
    list of all deposits, withdrawals, and trades.

    4. **Verify Fee Deductions**: Review your history for any options contract fees
    of $0.65 or administrative charges to ensure your records match your expectations.


    **How you know it worked**

    - You will receive a structured summary of your holdings.

    - You will see a chronological list of finalized and pending transactions.

    - All balances will be displayed with their current market value as of the last
    update.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: how_to_guide
