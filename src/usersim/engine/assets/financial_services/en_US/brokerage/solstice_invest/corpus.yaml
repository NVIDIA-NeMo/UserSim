  institution_id: solstice_invest
- id: 6cd6c043-3350-522f-9662-74d465e77a56
  title: Joint Brokerage Account — a discrepancy in your records or statement
  body: '**Symptom**: You have noticed a difference between your personal trade logs
    and the official monthly statement for your **Joint Brokerage Account**, such
    as a missing trade or an unexpected fee.


    **Likely Causes**

    - **Settlement Timing**: A trade was executed at the end of the statement period
    but did not reach **Settlement** until the following period, causing it to appear
    on a different statement.

    - **Options Fee Overlook**: You may be seeing charges of $0.65 per contract for
    options trades that were not accounted for in your personal logs.

    - **Joint Activity**: The other account holder may have executed a trade or withdrawal
    that you were not immediately aware of.

    - **Data Lag**: A temporary delay in the display of real-time data versus the
    finalized statement.


    **What to Check**

    1. **Compare Trade Dates vs. Settlement Dates**: Check if the discrepancy aligns
    with the standard settlement window.

    2. **Review Option Volume**: Count the total number of options contracts traded
    and multiply by $0.65 to see if the total matches the charges on your statement.

    3. **Consult Co-Owner**: Review recent activity with the joint owner to identify
    any transactions you may have missed.


    **The Fix**

    - **For Timing Issues**: No action is needed; the trade will be reflected in the
    subsequent statement.

    - **For Log Errors**: Update your personal records to reflect the $0.65 per-contract
    options fee.

    - **For Unrecognized Trades**: If both owners are unaware of a transaction, report
    it as a potential fraud event immediately.


    **When to Escalate**

    If the discrepancy remains after checking settlement dates and consulting the
    co-owner, we will initiate a formal investigation. We follow a standardized investigation
    timeline to resolve disputes fairly. You will be notified of the progress through
    our secure channels. If an error is found on our end, we will apply the necessary
    corrections to your account balance.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 6c7b8256-3df8-5f20-80a7-75cbd29a2fa5
  title: Custodial (UGMA) Brokerage — overview
  body: "The **Custodial (UGMA) Brokerage** account is a zero-cost entry point designed\
    \ to build long-term wealth for minors. It allows a custodian to manage investments\
    \ on behalf of a minor, ensuring that the next generation has a foundational start\
    \ in the markets.\n\nAt Solstice Invest, we prioritize low-friction investing.\
    \ This account is designed to remove the financial barriers associated with starting\
    \ a portfolio for a child. There is a **minimum opening deposit of $0**, meaning\
    \ you can establish the account without any initial capital. To keep the focus\
    \ on growth, we charge an **account maintenance fee of $0**.\n\nTrading is equally\
    \ accessible. We offer **$0 stock commissions**, ensuring that every dollar contributed\
    \ goes toward the minor's future rather than transaction costs. \n\n**Key Product\
    \ Details:**\n- **Minimum Opening Deposit:** $0\n- **Account Maintenance Fee:**\
    \ $0\n- **Stock Trade Commission:** $0\n\n**Important Considerations:**\nInvesting\
    \ involves risk. Returns are never guaranteed, and the value of securities can\
    \ fluctuate based on market conditions. We operate under **Regulation Best Interest**,\
    \ meaning we provide educational resources and suitable product recommendations\
    \ to help you navigate these choices, though we do not provide individualized\
    \ tax or legal advice.\n\n**Settlement** refers to the process by which a trade\
    \ is finalized and the transfer of securities and cash is completed. Please be\
    \ aware that settlement timing can affect when funds are available for withdrawal\
    \ or further trading."
