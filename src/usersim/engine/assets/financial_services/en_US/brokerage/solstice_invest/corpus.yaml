- id: 3ebd8bff-b805-5eca-af0c-3d9f7a59f8e0
  title: Joint Brokerage Account — a declined or blocked action
  body: '**Symptom**: You attempted to place a trade, withdraw funds, or change account
    settings, but the action was declined or blocked by the system.


    **Likely Causes**

    - **Verification Failure**: A state-changing action was attempted without a fully
    verified secure session or failed multi-factor authentication.

    - **Insufficient Settled Funds**: You attempted to withdraw or trade using funds
    that have not yet completed **Settlement**.

    - **Ownership Restrictions**: A restriction has been placed on the account due
    to a dispute between joint owners or a regulatory hold.

    - **Compliance Lock**: The action violates **Regulation Best Interest** standards
    or exceeds the risk profile established for the account.


    **What to Check**

    1. **Check Session Status**: Ensure you have completed all identity verification
    steps for the current session.

    2. **Review Available Cash**: Check your ''Settled Cash'' balance rather than
    your ''Total Equity'' to see if funds are available for withdrawal.

    3. **Consult Co-Owner**: Confirm with the other account holder if any restrictions
    were requested or if they are seeing similar blocks.


    **The Fix**

    - **For Verification Issues**: Re-authenticate your identity using our secure
    multi-factor process. Once verified, retry the action.

    - **For Settlement Issues**: Wait for the standard settlement period to conclude.
    We can provide the exact date your funds will be available.

    - **For Ownership Blocks**: Both joint owners must provide verified consent to
    remove a restriction.


    **When to Escalate**

    If the action remains blocked after verification and settlement are confirmed,
    we will raise a case with our licensed brokerage specialists. You will receive
    a notification via secure in-app messaging once the specialist has reviewed the
    restriction and provided a resolution timeline.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: f8600b72-8e50-5b59-abe5-f6a57bc8bc9e
  title: Joint Brokerage Account — when to switch or upgrade
  body: 'Depending on your evolving financial needs, a **Joint Brokerage Account**
    may no longer be the optimal choice. Here is when to consider a change:


    **Switch to an Individual Brokerage Account**

    If you no longer wish to share ownership or if the partnership has dissolved,
    moving to an individual account is appropriate. While the **Joint Brokerage Account**
    offers collaborative investing, the Individual Brokerage Account — overview provides
    solo control. Note that moving assets out of the joint account may trigger an
    account transfer out fee of $75.


    **Upgrade to a Margin Investing Account**

    If you and your partner are experienced traders who wish to leverage your existing
    equity for increased buying power, a margin account is the better choice. While
    the joint account provides a foundational collaborative space, the Margin Investing
    Account — overview details how to borrow against your collateral. Be aware that
    margin involves significantly higher risk and different regulatory requirements.


    **Recommendation**

    - **Stay with Joint**: If you are partners seeking a low-cost, shared entry point
    with $0 stock commissions.

    - **Switch**: If you require solo autonomy or advanced leverage.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 1015d6f8-4cd1-5703-9a47-b403ab3f27de
  title: Joint Brokerage Account — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right account depends on who is investing and what the goals
    are. The **Joint Brokerage Account** is a collaborative tool, but it is not suitable
    for every scenario.


    **Comparison with Alternatives**

    - **Vs. Individual Brokerage**: The Individual Brokerage Account is for solo investors.
    The joint account is for partners. Both offer $0 stock commissions, but the joint
    account allows multiple owners to manage the same pool of assets.

    - **Vs. Custodial Brokerage**: The Custodial (UGMA) Brokerage is specifically
    for minors. It is a zero-cost entry point for long-term wealth building for children,
    whereas the joint account is for adults seeking collaborative investing.

    - **Vs. Margin Account**: A margin account is an advanced tool for experienced
    investors to leverage equity. The joint account is a cash-based foundational account
    (unless upgraded) focusing on low-cost access.


    **When NOT to Choose the Joint Brokerage Account**

    - **Lack of Trust**: Because joint owners typically have equal access, this account
    should not be used if there is not complete trust between parties.

    - **Solo Control**: If you require total autonomy over your trades and withdrawals
    without the involvement of another party, choose an individual account.

    - **Minor Beneficiaries**: If the goal is to save for a child, the custodial option
    is the appropriate regulatory vehicle.


    **Key Costs to Consider**

    - **Stock Trades**: $0 commission.

    - **Options Contracts**: $0.65 per contract.

    - **Account Transfers Out**: $75 fee.


    **Disclaimer**: Solstice Invest adheres to **Regulation Best Interest**. We provide
    suitable product recommendations based on your needs, but we never guarantee returns
    or ignore material market risks.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: product_sheet
  source_authority: official
