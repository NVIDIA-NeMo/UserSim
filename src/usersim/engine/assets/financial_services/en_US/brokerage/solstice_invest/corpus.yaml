- id: 993f9ad2-b347-5e40-89bf-e172360b2fdf
  title: Custodial (UGMA) Brokerage — eligibility and setup
  body: '**Who can open a Custodial (UGMA) Brokerage?**

    Any legal adult acting as a custodian for a minor is eligible to open this account.
    You will need to provide identity verification for both yourself and the minor.


    **Is there a minimum amount required to start the account?**

    No. The **minimum opening deposit** is $0, making it accessible for any budget.


    **How is the account set up?**

    Setup involves a verified secure session where you provide the minor''s information
