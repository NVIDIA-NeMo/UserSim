- id: f329061c-035d-5c39-9aa5-8dd749735aa1
  title: Joint Brokerage Account — risk disclosures
  body: 'Investing in securities involves significant risk. This disclosure outlines
    the material risks associated with the Joint Brokerage Account.


    **Market Risk**

    All investments are subject to market fluctuations. There is no guarantee that
    the value of your investments will increase, and you may lose some or all of your
    principal. **Returns are never guaranteed**.


    **Options Risk**

    This account supports options trading, which involves higher risk than standard
    stock investing. Options can expire worthless, leading to a total loss of the
    premium paid. Because of this complexity, we charge a fee of **$0.65 per options
    contract** to cover the specialized administrative requirements of these instruments.


    **Joint Ownership Risk**

    By using a Joint Brokerage Account, you grant equal access to all account holders.
    Any single owner can execute trades or withdraw funds, which may impact the other
    owner''s financial position. Solstice Invest is not a mediator for disputes between
    joint owners.


    **Regulatory Framework**

    We operate under SEC and FINRA frameworks. Our commitment to **Regulation Best
    Interest** means we provide suitable product recommendations and educational resources;
    however, we strictly prohibit the provision of individualized tax or legal advice.


    **Settlement Risk**

    Users must be aware of **Settlement** timing (the period until a trade is finalized
    and cash/securities are transferred). Attempting to withdraw funds before settlement
    may result in failed transactions or regulatory violations.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 9bd0ea1b-1a04-550d-96ff-05ee91bc12f0
  title: Joint Brokerage Account — how rates are tiered and applied
  body: 'The Joint Brokerage Account utilizes a flat-fee structure rather than a tiered
    rate system for its primary brokerage activities. This ensures transparency and
    predictability for all partners, regardless of account balance.


    **Applied Rates**

    * **Stock Trade Commission**: A flat rate of **$0** applies to all stock trades
    for all account balances.

    * **Options Contract Fee**: A flat rate of **$0.65 per contract** is applied to
    all options trades, regardless of the volume or total account equity.

    * **Account Transfer Out**: A one-time flat fee of **$75** is applied when the
    account is closed and assets are transferred to another institution.


    Because there are no tiered interest rates or balance-based discounts for these
    specific actions, the costs remain identical for a beginner investor as they do
    for a sophisticated trader. Any changes to these fees will be communicated via
    secure channels in accordance with our change-of-terms policy.'
