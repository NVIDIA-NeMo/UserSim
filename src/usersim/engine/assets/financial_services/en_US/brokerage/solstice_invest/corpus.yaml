- id: 46b61446-39d9-53ad-b526-8d8b06cc523b
  title: General frequently asked questions
  body: '**How do I get started with a Solstice Invest account?**

    You can open an account directly through our secure app. Depending on your goals,
    you might choose an **Individual Brokerage Account**, a **Joint Brokerage Account**,
    or a **Custodial (UGMA) Brokerage**. For more details on the process, please refer
    to the specific account''s setup guide.


    **How can I contact support for help?**

    Our support team is available via **secure in-app messaging** and **phone lines**
    during Eastern Time (ET) business hours. Generalists handle initial requests and
    will escalate complex brokerage inquiries to licensed specialists.


    **What happens if I report fraud or a dispute?**

    We treat all fraud reports with **immediate urgency**. We follow a standardized
    investigation timeline to ensure fair resolution and will notify you of the progress
    through secure channels.


    **Can Solstice Invest tell me which specific stocks to buy for my tax situation?**

    No. While we provide educational resources and suitable product recommendations
    under **Regulation Best Interest**, we never offer individualized tax or legal
    advice.'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 5c397241-28f0-5a5d-9fc5-37f00a6e9980
  title: Regulatory notes for brokerage_investing
  body: 'Solstice Invest operates under the regulatory frameworks established by the
    **SEC** and **FINRA**. All employees and agents must adhere to these standards
    to ensure market integrity and client protection.


    **Regulation Best Interest (Reg BI)**

    Our firm adheres to **Regulation Best Interest**, which requires broker-dealers
    to act in the best interest of the retail customer at the time a recommendation
    is made. This means we prioritize the client''s financial goals and needs over
    the firm''s profit.


    **Agent Obligations**

    1. **Standard of Care**: Agents are strictly prohibited from guaranteeing investment
    returns or ignoring material risks associated with a product. Every communication
    must be transparent regarding the potential for loss.

    2. **Advice Boundaries**: Agents may provide educational materials and suggest
    products that are suitable for the client''s profile. However, agents must **never**
    provide individualized tax or legal advice. If a client requires such expertise,
    they must be referred to a certified tax professional or legal counsel.

    3. **Transparency**: Agents must be clear about **Settlement** timing (the process
    by which a trade is finalized) and the risks associated with **Margin** (borrowing
    against account equity).


    **Compliance and Privacy**

    We maintain strict data privacy standards and fair treatment protocols. No sensitive
    account modifications may occur without a verified secure session, and multi-factor
    authentication is mandatory for state-changing actions.


    **Disclaimer**: Investing involves risk. Past performance does not guarantee future
    results.'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 55d2da64-5fc8-57fe-9dfc-7cbba3f4db0d
  title: When to use get_positions
  body: 'The `get_positions` tool is the authoritative method for retrieving a real-time
    snapshot of the securities and cash balances currently held within a client''s
    brokerage account. This tool should be used whenever a client asks "What do I
    own?", "What is my current balance?", or "How many shares of X do I have?"


    **Operational Constraints**

    Agents must not rely on cached data or previous conversation turns to report current
    holdings, as market values and positions fluctuate. A fresh call to `get_positions`
    is required for every specific inquiry regarding holdings.


    **Procedure for Retrieval**

    1. **Verify Identity**: Ensure the client has completed a verified secure session
    with multi-factor authentication.

    2. **Resolve Account ID**: If the client provides a partial account number (e.g.,
    last 4 digits), the agent must first call `get_accounts` to retrieve the full,
    unique `account_id` associated with that client.

    3. **Execute Tool**: Call `get_positions` using the resolved `account_id`.

    4. **Communicate Results**: Present the positions to the client clearly, using
    bolded terms for security names and quantities. If the account is a **Margin Investing
    Account**, the agent must also note any margin utilization if requested.


    **Prohibited Actions**

    Agents must not use this tool to provide investment advice or predict future movements
    of the positions retrieved. The agent''s role is to report the current state of
    the account as documented in the system.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: solstice_invest
- id: 517194b8-142a-5c6b-846c-adf7001ee11c
  title: get_positions tool reference
  body: '**Tool Name**: `get_positions`


    **Description**: Retrieves a comprehensive list of all current securities, asset
    quantities, and cash balances for a specific brokerage account.


    **Arguments**:

    *   `account_id` (string): The unique identifier for the brokerage account.


    **Effect**: This is a **read_only** action. It returns the current holdings of
    the account without modifying any data.


    **Agent Execution**: The agent performs this action by calling the tool directly
    within the secure session. The agent does not direct the customer to a portal
    to view their positions but provides the information directly in the chat based
    on the tool''s output.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: solstice_invest
- id: b96bdb4c-e081-5980-a451-45c4f38b7261
  title: When to use place_trade
  body: 'The `place_trade` tool is used to execute the purchase or sale of securities
    on behalf of a client. Because this is a **state_changing** action that involves
    the movement of capital, strict adherence to verification and compliance protocols
    is mandatory.


    **Prerequisites for Execution**

    1. **Identity Verification**: The agent must confirm the client''s identity through
    a verified secure session using multi-factor authentication. No trade may be placed
    without this verification.

    2. **Account Resolution**: Use `get_accounts` to ensure the `account_id` is correct
    and active.

    3. **Availability of Funds**: The agent should verify that sufficient settled
    cash or available **Margin** exists for the trade using `get_positions` to avoid
    order rejection.


    **Step-by-Step Procedure**

    1. **Gather Trade Details**: Obtain the ticker symbol, action (Buy/Sell), quantity,
    and order type (e.g., Market or Limit) from the client.

    2. **Confirm Order**: Repeat the trade details back to the client for explicit
    confirmation.

    3. **Execute Trade**: Call the `place_trade` tool with the required parameters.

    4. **Confirm Settlement**: Inform the client that the trade has been placed and
    explain the **Settlement** process (the time required for the transfer of securities
    and cash to be completed).


    **Compliance Notes**

    Agents must not suggest a specific trade or guarantee a price. All trades are
    executed according to the order type specified. If a client asks for a recommendation,
    the agent must follow **Regulation Best Interest** guidelines and refer to educational
    resources rather than providing individualized advice.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: solstice_invest
- id: e470793a-ce52-54b1-84b5-121ca010bbbc
  title: place_trade tool reference
  body: '**Tool Name**: `place_trade`


    **Description**: Executes a buy or sell order for a security within a specified
    brokerage account.


    **Arguments**:

    *   `account_id` (string): The unique identifier for the brokerage account.

    *   `symbol` (string): The ticker symbol of the security.

    *   `quantity` (integer): The number of shares to trade.

    *   `side` (string): Either ''buy'' or ''sell''.

    *   `order_type` (string): The type of order (e.g., ''market'', ''limit'').


    **Effect**: This is a **state_changing** action. It initiates a trade that, once
    executed, will move toward **Settlement**.


    **Agent Execution**: The agent performs this action by calling the tool directly
    after the client has explicitly confirmed the trade details in a verified session.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: solstice_invest
- id: c12a3c39-fad0-5e76-964d-382e9479e2bc
  title: When to use initiate_acat_transfer
  body: 'The `initiate_acat_transfer` tool is used to move assets from another brokerage
    firm into a Solstice Invest account via the Automated Customer Account Transfer
    (ACAT) system. This is a **state_changing** action and requires precise data entry
    to avoid transfer failures.


    **Procedure for Initiation**

    1. **Verify Identity**: The client must be in a verified secure session with multi-factor
    authentication.

    2. **Account Identification**: Use `get_accounts` to identify the destination
    Solstice Invest `account_id` (e.g., an **Individual Brokerage Account**).

    3. **Collect External Details**: Gather the name of the delivering firm, the external
    account number, and the type of assets to be transferred (full or partial).

    4. **Disclosure of Timing**: Inform the client that ACAT transfers are not instantaneous
    and are subject to the delivering firm''s processing times and standard **Settlement**
    windows.

    5. **Execute Transfer**: Call `initiate_acat_transfer` with the provided external
    and internal account details.


    **Handling Potential Issues**

    If a transfer is rejected, the agent should not attempt to guess the error. They
    should use the internal tracking systems to identify the reason and communicate
    this to the client through secure channels.


    **Restrictions**

    Agents may not provide advice on whether a client *should* transfer their assets.
    The decision to move assets is solely the client''s. The agent''s role is to facilitate
    the technical process of the transfer efficiently.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_acat_transfer
  institution_id: solstice_invest
- id: c9c0933b-61c0-51fc-b041-b3ef8dde5860
  title: initiate_acat_transfer tool reference
  body: '**Tool Name**: `initiate_acat_transfer`


    **Description**: Starts the process of transferring securities and cash from an
    external brokerage to a Solstice Invest account using the ACAT system.


    **Arguments**:

    *   `destination_account_id` (string): The Solstice Invest account receiving the
    assets.

    *   `source_firm_name` (string): The name of the brokerage firm delivering the
    assets.

    *   `source_account_number` (string): The account number at the delivering firm.

    *   `transfer_type` (string): Whether the transfer is ''full'' or ''partial''.


    **Effect**: This is a **state_changing** action. It sends a request to the external
    firm to move the specified assets.


    **Agent Execution**: The agent performs this action by calling the tool directly.
    The agent does not ask the client to fill out a paper form or visit an external
    website to start the ACAT process.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_acat_transfer
  institution_id: solstice_invest
- id: 7aed0cec-04b4-5657-8d45-45e2c2c2b7ab
  title: When to use get_accounts
  body: 'The `get_accounts` tool is the primary discovery mechanism for identifying
    all brokerage accounts associated with a specific client. It is often the first
    tool called in a service interaction to ensure the agent is acting on the correct
    account.


    **Primary Use Cases**

    1. **Account Resolution**: When a client references an account by a nickname or
    a partial number (e.g., "my account ending in 1234"), `get_accounts` is used to
    find the full `account_id`.

    2. **Portfolio Overview**: When a client asks what types of accounts they hold
    with Solstice Invest (e.g., if they have both an **Individual Brokerage Account**
    and a **Margin Investing Account**).

    3. **Verification**: To confirm that an account is active and eligible for a requested
    action before attempting a state-changing call.


    **Standard Procedure**

    1. **Identity Verification**: The agent must first ensure the client is in a verified
    secure session.

    2. **Execution**: Call `get_accounts` to retrieve the list of all accounts linked
    to the client''s profile.

    3. **Clarification**: If multiple accounts are returned, the agent must ask the
    client to specify which account they wish to discuss or modify before proceeding
    with other tools (like `get_positions` or `place_trade`).


    **Data Privacy**

    Account lists are sensitive information. Agents must only display account details
    (such as account type and masked account numbers) within the secure session and
    must never export this data to unencrypted channels.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: solstice_invest
- id: c26645b1-7deb-570e-98cc-fd343352ea96
  title: get_accounts tool reference
  body: 'The **get_accounts** tool allows the agent to retrieve a comprehensive list
    of all accounts associated with a verified client. This tool is essential for
    identifying specific account IDs when a client provides only a partial identifier
    (such as the last four digits of an account number).


    **Tool Signature:** `get_accounts()`


    **Arguments:** None.


    **Effect:** Returns a list of all open accounts belonging to the authenticated
    user, including account IDs, account types (e.g., Individual Brokerage Account,
    Margin Investing Account), and current statuses.


    **Execution:** The agent performs this action by calling the tool directly within
    the secure session to resolve account details before proceeding with other account-specific
    requests.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: solstice_invest
- id: 1c953254-be78-5a78-9291-3b88cf319f05
  title: When to use open_account
  body: 'This policy outlines the procedure for assisting clients in establishing
    a new investment account. Solstice Invest offers several products to meet different
    investor needs, including the **Individual Brokerage Account**, **Joint Brokerage
    Account**, **Custodial (UGMA) Brokerage**, and the **Margin Investing Account**.


    **Procedure:**

    1. **Identify Needs:** Determine the client''s goal. For solo investors, an Individual
    Brokerage Account is standard; for partners, a Joint Brokerage Account; for minors,
    a Custodial (UGMA) Brokerage; and for experienced traders seeking leverage, a
    Margin Investing Account.

    2. **Verify Eligibility:** Confirm the client meets the requirements for the chosen
    product. Refer to the specific eligibility matrix for the selected account type.

    3. **Identity Verification:** Perform a strict multi-factor authentication and
    identity verification process. No account can be opened without a verified secure
    session.

    4. **Collect Data:** Gather the necessary personal and financial information required
    for regulatory compliance under SEC and FINRA frameworks.

    5. **Execute Opening:** Call the **open_account** tool to officially create the
    account in the system.


    **Compliance Note:** In accordance with **Regulation Best Interest**, agents must
    ensure the product recommendation is suitable for the client. Agents must never
    guarantee returns or ignore material risks during the onboarding process.


    For detailed requirements on specific accounts, see Individual Brokerage Account
    — eligibility requirements.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: solstice_invest
- id: a8ee6ec8-8c2d-5185-a41c-33f3cbbd72c3
  title: open_account tool reference
  body: 'The **open_account** tool is used to programmatically create a new brokerage
    account for a verified client.


    **Tool Signature:** `open_account(product_id, account_details)`


    **Arguments:**

    - `product_id`: The unique identifier for the account type (e.g., `individual_brokerage`,
    `joint_brokerage`, `custodial_brokerage`, or `margin_account`).

    - `account_details`: A structured object containing the required personal, tax,
    and regulatory information for the account holder(s).


    **Effect:** Initializes a new account in the Solstice Invest ledger and assigns
    a unique account ID.


    **Execution:** The agent performs this action by calling the tool directly after
    the client has passed all identity verification and suitability checks. This is
    a state-changing action and requires a secure, verified session.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: solstice_invest
- id: 4b0d5160-ba81-5110-98a6-4a8065327b00
  title: When to use close_account
  body: 'Closing an account is an **irreversible** action. Agents must follow these
    steps to ensure all regulatory and financial obligations are met before the account
    is terminated.


    **Procedure:**

    1. **Verify Identity:** Confirm the client''s identity using multi-factor authentication.
    This is a mandatory security requirement for all state-changing actions.

    2. **Confirm Account ID:** Use **get_accounts** to verify the exact account ID
    the client wishes to close.

    3. **Verify Zero Balance:** Ensure that all securities have been sold or transferred
    and that the cash balance is $0. If funds remain, the agent must first assist
    the client in using **withdraw_funds** or **transfer_funds** to clear the balance.

    4. **Settle All Trades:** Confirm that all pending trades have reached **Settlement**
    (the process by which a trade is finalized and the transfer of securities and
    cash is completed).

    5. **Final Confirmation:** Explicitly confirm with the client that they understand
    the action is irreversible.

    6. **Execute Closure:** Call the **close_account** tool to terminate the account.


    **Important Considerations:**

    - Clients closing accounts may be subject to specific administrative fees; refer
    to the applicable fee schedule for the account type.

    - If the account is a **Margin Investing Account**, all margin loans must be paid
    in full before closure.


    For a guide on the customer-facing process, refer to Individual Brokerage Account
    — cancel, close, or downgrade.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: solstice_invest
- id: 7075887e-6efb-5371-ba07-52df878c1c60
  title: close_account tool reference
  body: 'The **close_account** tool permanently terminates a client''s brokerage account.


    **Tool Signature:** `close_account(account_id)`


    **Arguments:**

    - `account_id`: The unique identifier of the account to be closed.


    **Effect:** Marks the account as closed in the system. This action is **irreversible**;
    once called, the account cannot be reopened, and a new account must be created
    if the client wishes to return.


    **Execution:** The agent performs this action by calling the tool directly. This
    request must only be executed after the account has been cleared of all assets
    and liabilities, and the client''s identity has been strictly verified.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: solstice_invest
- id: d9c7eced-bad4-5633-8a04-dcdbe0ba7759
  title: When to use update_contact_info
  body: 'Maintaining accurate client data is critical for regulatory compliance and
    the secure delivery of account statements. Agents use the **update_contact_info**
    tool to modify a client''s registered communication details.


    **Procedure:**

    1. **Verify Identity:** Require multi-factor authentication. Because contact information
    is used for security alerts and verification, this is a high-sensitivity action.

    2. **Identify Account:** Use **get_accounts** to confirm which account profile
    is being updated.

    3. **Validate Information:** Ensure the new information (e.g., email address,
    physical address, or phone number) is provided in a valid format.

    4. **Execute Update:** Call the **update_contact_info** tool with the corrected
    details.

    5. **Notify Client:** Inform the client that the changes have been saved and they
    will receive a confirmation via their secure in-app messaging channel.


    **Security Warning:** If a client requests a change to their primary email or
    phone number and the request seems unusual, agents must treat it with immediate
    urgency as a potential fraud report and follow the standardized investigation
    timeline.


    For more information on managing account details, see Individual Brokerage Account
    — make a change or update.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: solstice_invest
- id: 18963d76-9d8c-5a66-9a96-c455b07e26bb
  title: update_contact_info tool reference
  body: 'The **update_contact_info** tool updates the personal contact details associated
    with a client''s profile.


    **Tool Signature:** `update_contact_info(account_id, contact_fields)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `contact_fields`: A dictionary of the fields to be updated (e.g., `email`, `phone_number`,
    `mailing_address`).


    **Effect:** Updates the client''s contact information in the Solstice Invest database.


    **Execution:** The agent performs this action by calling the tool directly. A
    verified secure session is mandatory before this tool can be utilized to prevent
    unauthorized account takeover.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: solstice_invest
- id: f3b71086-15d7-51e5-90fa-f5aca0f81560
  title: When to use get_statements
  body: 'Clients may request account statements for tax purposes, personal record-keeping,
    or to resolve discrepancies. The **get_statements** tool provides access to these
    official documents.


    **Procedure:**

    1. **Verify Identity:** Perform standard identity verification to ensure the requester
    is the authorized account holder or a legal representative.

    2. **Identify Account:** Use **get_accounts** to resolve the correct account ID.

    3. **Define Parameters:** Determine the specific statement period (e.g., monthly,
    quarterly, or annual) and the date range required by the client.

    4. **Execute Retrieval:** Call the **get_statements** tool using the account ID
    and the requested time frame.

    5. **Delivery:** Provide the statements to the client via the secure in-app messaging
    portal. Documents must never be sent via unencrypted email.


    **Compliance Note:** Solstice Invest prioritizes transparency regarding market
    risk and **Settlement** timing. All statements are generated based on finalized
    transaction data.


    If a client identifies an error in their statement, refer them to the process
    in Individual Brokerage Account — a discrepancy in your records or statement.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: solstice_invest
- id: 7744b691-7879-5aff-b036-71372490563f
  title: get_statements tool reference
  body: 'The **get_statements** tool retrieves official account statements for a specified
    period.


    **Tool Signature:** `get_statements(account_id, statement_type, date_range)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `statement_type`: The frequency of the statement (e.g., ''monthly'', ''quarterly'',
    ''annual'').

    - `date_range`: The specific start and end dates for the requested documents.


    **Effect:** Returns the requested statements in a secure, downloadable format.


    **Execution:** The agent performs this action by calling the tool directly. Access
    is granted only to verified users or authorized representatives during a secure
    session.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: solstice_invest
- id: 535dc147-8c6b-537f-8479-c4b726815fed
  title: When to use update_beneficiary
  body: 'Updating beneficiaries ensures that assets are distributed according to the
    client''s wishes. This is a sensitive legal update that requires strict adherence
    to verification protocols.


    **Procedure:**

    1. **Verify Identity:** Require high-assurance multi-factor authentication. Because
    this action affects the legal transfer of assets, identity verification is non-negotiable.

    2. **Identify Account:** Use **get_accounts** to ensure the update is applied
    to the correct brokerage account.

    3. **Collect Beneficiary Data:** Gather the full legal name, relationship to the
    account holder, and the percentage of the account to be allocated to each beneficiary.
    The total allocation must equal 100%.

    4. **Execute Update:** Call the **update_beneficiary** tool with the detailed
    beneficiary information.

    5. **Confirm Completion:** Notify the client that the beneficiary records have
    been updated.


    **Legal Boundary:** In accordance with our **advice_boundaries**, Solstice Invest
    employees may assist with the administrative process of updating beneficiaries
    but **never offer individualized tax or legal advice** regarding estate planning
    or the tax implications of beneficiary designations. Clients are encouraged to
    consult with a qualified legal or tax professional for such guidance.


    For general account update procedures, see Individual Brokerage Account — make
    a change or update.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: solstice_invest
- id: c0d7fec4-f092-58d1-b3b2-acd3a109fa83
  title: deposit_funds tool reference
  body: 'The **deposit_funds** tool is used by the agent to programmatically initiate
    the transfer of cash into a client''s brokerage account. The agent performs this
    action by calling the tool directly once the client''s identity is verified and
    the source of funds is confirmed.


    **Tool Signature:**

    `deposit_funds(account_id: string, amount: number, source_account: string)`


    **Arguments:**

    - **account_id**: The unique identifier of the Solstice Invest account receiving
    the funds.

    - **amount**: The specific dollar amount to be deposited.

    - **source_account**: The identifier for the external linked bank account from
    which funds are being drawn.


    **Effect:**

    This action triggers a state-changing request to move funds from the external
    source into the specified Solstice Invest account. The funds will become available
    according to standard **Settlement** timelines. The agent must ensure the session
    is secure before executing this tool.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: solstice_invest
- id: 61d30ab5-1041-55b5-bf2f-bb4a6c35077b
  title: When to use withdraw_funds
  body: 'This policy outlines the requirements and steps for processing client requests
    to move cash from their Solstice Invest account to an external destination. Because
    this is an irreversible action, strict security protocols must be followed.


    **Guidelines for Use**

    Agents should use the **withdraw_funds** tool when a client wishes to liquidate
    their cash balance or move proceeds from a sale. The agent must first confirm
    that the funds have completed **Settlement** and are not restricted by pending
    trades or margin requirements. If the client is using a **Margin Investing Account**,
    the agent must ensure the withdrawal does not trigger a margin call.


    **Procedure**

    1. **Identity Verification**: Perform strict multi-factor authentication to verify
    the client''s identity. No fund transfers occur without a verified secure session.

    2. **Account Resolution**: Use **get_accounts** to resolve the client''s account
    identifier from the last four digits of the account number.

    3. **Balance Check**: Verify that the available cash balance is sufficient to
    cover the requested withdrawal amount.

    4. **Destination Verification**: Confirm the destination bank account is a pre-verified
    linked account on file.

    5. **Execution**: Call the **withdraw_funds** tool with the required account and
    amount details to complete the request.


    **Compliance Note**

    All withdrawals must adhere to the transparency standards regarding market risk
    and timing. Clients should be reminded that while we strive for efficiency, the
    actual arrival of funds depends on the receiving institution''s processing times.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: solstice_invest
- id: 144975c2-7f6a-50a3-93b0-3d66cae27f1c
  title: withdraw_funds tool reference
  body: 'The **withdraw_funds** tool is the authoritative mechanism for moving cash
    from a Solstice Invest account to an external linked bank account. This is an
    irreversible action; once the tool is called, the transfer process cannot be undone
    by the agent.


    **Tool Signature:**

    `withdraw_funds(account_id: string, amount: number, destination_account: string)`


    **Arguments:**

    - **account_id**: The unique identifier of the Solstice Invest account from which
    funds are being withdrawn.

    - **amount**: The specific dollar amount to be transferred out.

    - **destination_account**: The identifier for the verified external bank account
    receiving the funds.


    **Effect:**

    Calling this tool initiates a state-changing request to export funds. The agent
    performs this action directly within the secure session. The client will be notified
    of the transfer progress through secure channels. Agents must ensure that the
    account has sufficient settled cash before calling this tool to avoid transaction
    failure.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: solstice_invest
- id: adfc8ef7-7e03-5fb8-b705-c269d30f8817
  title: When to use manage_authorized_users
  body: 'Solstice Invest allows account holders to grant specific access permissions
    to other individuals. This is particularly common for the **Joint Brokerage Account**
    or when a primary holder wishes to provide read-only or trading access to a trusted
    party.


    **Guidelines for Use**

    Agents use the **manage_authorized_users** tool to add, remove, or modify the
    permission levels of individuals associated with an account. This tool is used
    for administrative changes to account access and does not grant legal ownership
    of the assets.


    **Procedure**

    1. **Identity Verification**: The agent must verify the identity of the primary
    account holder using multi-factor authentication. Only the primary holder (or
    a joint owner with full authority) may modify authorized users.

    2. **Account Resolution**: Use **get_accounts** to identify the correct account
    associated with the request.

    3. **User Detail Collection**: Gather the full name, contact information, and
    the specific level of access (e.g., read-only, trade-only) to be granted to the
    new user.

    4. **Permission Review**: Confirm with the client exactly what the authorized
    user will be able to see or do to ensure there is no misunderstanding regarding
    account security.

    5. **Execution**: Call the **manage_authorized_users** tool to update the account''s
    authorized user list.


    **Security Standards**

    No sensitive account modifications, including the addition of authorized users,
    occur without a verified secure session. Agents must ensure that all changes are
    documented in the account audit log. For complex inquiries regarding the legal
    implications of authorized users, agents should escalate the request to a licensed
    specialist.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: solstice_invest
- id: 13e30b99-a1fb-5640-bd03-12c70f7472ce
  title: manage_authorized_users tool reference
  body: 'The **manage_authorized_users** tool allows an agent to modify the list of
    individuals permitted to access or perform actions on a specific brokerage account.
    The agent executes this change directly via the tool after the primary account
    holder has been verified.


    **Tool Signature:**

    `manage_authorized_users(account_id: string, user_details: object, action: string,
    permissions: list)`


    **Arguments:**

    - **account_id**: The unique identifier of the brokerage account being modified.

    - **user_details**: The person''s full name, date of birth and contact details,
    exactly as the account holder gives them.

    - **action**: The type of change to be made (e.g., ''ADD'', ''REMOVE'', ''UPDATE'').

    - **permissions**: A list of specific access rights being granted to the user.


    **Effect:**

    This tool performs a state-changing update to the account''s access control list.
    Once called, the specified user will immediately gain or lose the designated permissions.
    The agent must ensure that the session is fully verified before calling this tool
    to prevent unauthorized access to client assets.'
