- id: 528a9fe1-ee90-57c9-b836-78aa54fdb37f
  title: Custodial (UGMA) Brokerage — access or login problems
  body: '**Symptom:** "I am unable to log into my custodial account" or "My MFA code
    is not arriving."


    **Likely Causes**

    - Incorrect credentials or an expired password.

    - MFA delivery delays due to network issues.

    - Account lock triggered by multiple failed login attempts.

    - Session expiration during a sensitive state-changing action.


    **What to Check**

    1. **Credential Accuracy:** Verify that you are using the email address associated
    with the custodian''s identity.

    2. **MFA Device:** Ensure your mobile device has a stable signal to receive SMS
    or app-based codes.

    3. **Security Notifications:** Check your registered email for any alerts regarding
    unauthorized login attempts that may have triggered a security freeze.


    **The Fix**

    - **Password Reset:** Request a password reset. You will be required to undergo
    a secure identity verification process before a new password can be set.

    - **MFA Resync:** If codes are not arriving, we can trigger a manual resynchronization
    of your MFA device after you verify your identity via a secure session.

    - **Account Unlock:** If the account is locked due to security protocols, we will
    review the failed attempts and unlock the account once your identity is confirmed.


    **When to Escalate**

    If you suspect your login credentials have been compromised, tell us immediately.
    We will escalate this to our fraud investigation team, who will freeze the account
    and follow a standardized investigation timeline to resolve the dispute. You will
    be notified of progress through secure channels.


    **Disclaimer:** For your protection, no sensitive account modifications occur
    without a verified secure session.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: troubleshooting
  source_authority: official
