    | **Minimum Equity** | $2000 or more | Eligible for account activation |

    | **Minimum Equity** | Less than $2000 | Ineligible for margin features |

    | **Account Equity %** | 25% or more of market value | Account remains in good
    standing |

    | **Account Equity %** | Less than 25% of market value | Subject to Margin Call
