- id: 7e312fb6-cbf7-546f-8210-6a2bd4b0b10c
  title: Individual Brokerage Account — resolve a common request end-to-end
  body: 'This guide explains how to complete the process of transferring your assets
    from Solstice Invest to another brokerage institution.


    **Prerequisites**

    *   A verified secure session using multi-factor authentication.

    *   The account number and DTC participant code of the receiving institution.


    **Steps to Transfer Assets Out**

    1.  **Initiate the request**: Tell us that you wish to perform a full account
    transfer to another institution and provide the receiving broker''s details.

    2.  **Acknowledge the fee**: We will notify you that an account transfer out fee
    of $75 will be applied to your balance. You must confirm your acceptance of this
    fee to proceed.

    3.  **Confirm asset list**: We will provide a list of the securities and cash
    balances currently in your account. You must confirm that you wish to transfer
    all listed assets.

    4.  **Verify the transfer**: We will perform a final security check to ensure
    the request is authorized. You may be asked to complete a secondary MFA challenge.

    5.  **Await Settlement**: We will initiate the transfer process. We will notify
    you once the assets have left your account and the **Settlement** process is complete.


    **Confirmation of Success**

    You will know the request is resolved when you receive a final confirmation message
    stating the transfer has been completed and your Individual Brokerage Account
    balance reflects the deduction of the $75 fee and the transferred assets.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: how_to_guide
