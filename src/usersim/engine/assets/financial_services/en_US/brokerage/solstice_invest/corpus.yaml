- id: 736abbd1-938d-5426-be9b-cd66c31a8d27
  title: Joint Brokerage Account — fraud and unauthorized-activity protection
  body: 'When managing a Joint Brokerage Account, security is a shared responsibility.
    Because multiple parties have access to the same funds and securities, this account
    type can be targeted by specific fraud patterns, such as ''account takeover''
    attempts where a bad actor tries to add an unauthorized joint owner or change
    the linked bank account to divert funds.


    **What Solstice Invest Will Never Do**

    To protect your assets, please remember that we will **never** ask you for your
    password, multi-factor authentication (MFA) codes, or full Social Security number
    via email or text message. We will never pressure you to move funds into a ''safe''
    account to avoid a freeze, nor will we request payment in gift cards or cryptocurrency
    to ''verify'' your identity.


    **Unauthorized Activity Protection**

    We utilize strict multi-factor authentication for all state-changing actions.
    If you notice a trade you did not authorize or a withdrawal you did not approve,
    you must notify us immediately. We treat fraud reports with immediate urgency.
    Once a report is filed, we follow a standardized investigation timeline to resolve
    the dispute fairly, providing progress updates through secure in-app messaging.


    **Immediate First Action**

    If you suspect unauthorized access to your Joint Brokerage Account, tell us immediately
    to freeze the account. This prevents further outflows while our specialists investigate
    the breach. Prompt reporting is critical to minimizing your liability and ensuring
    the fastest possible resolution.


    **Disclaimer**: Returns are never guaranteed, and all investing involves material
    risk of loss.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 14b6529d-aa9e-51d5-8f63-3bb2420064f5
  title: Joint Brokerage Account — account agreement
  body: "This agreement governs the use of the Joint Brokerage Account provided by\
    \ Solstice Invest. By opening this account, all joint owners agree to the following\
