- id: 936ba42a-d9ab-5e90-b85a-e7cf911ff8f1
  title: Joint Brokerage Account — a failed or pending action
  body: '**Symptom**: A trade, fund transfer, or account modification is marked as
    ''Pending'' for longer than expected or has ''Failed'' without a clear explanation.


    **Likely Causes**:

    - **Settlement Timing**: The most common cause for pending funds is **Settlement**.
    Securities and cash transfers are not instant and must follow SEC/FINRA timelines.

    - **Verification Failure**: A state-changing action may fail if the session was
    not fully verified via **multi-factor authentication**.

    - **Insufficient Equity**: For options trades, the trade may fail if the account
    does not meet the minimum requirement for the **$0.65 per contract** fee.

    - **Incorrect Funding Data**: A fund transfer may fail due to a mismatch in the
    external bank account details.


    **What to check**:

    1. Check your transaction history to see if the action is still in the **Settlement**
    window.

    2. Ensure you have completed all prompts for identity verification or multi-factor
    authentication.

    3. Verify that your available cash covers both the asset price and the associated
    fees (e.g., **$0.65 per options contract**).


    **Resolution and Escalation**:

    If the action remains pending beyond standard settlement windows or continues
    to fail, tell us the specific transaction ID. We will investigate the block. If
    the issue is related to a suspected fraud report, we treat this with immediate
    urgency and will follow our standardized investigation timeline.


    **What happens next**: We will route the inquiry to a licensed specialist who
    will review the trade or transfer. You will be notified of the progress through
    our secure in-app messaging channels until the resolution is finalized.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
