- id: 8edce73e-7f40-54bf-86a0-38be24873ca5
  title: Margin Investing Account — account security best practices
  body: 'Protecting your **Margin Investing Account** is critical because the use
    of leverage can accelerate financial losses if an account is compromised. At Solstice
    Invest, we employ strict multi-factor authentication to ensure that only you can
    execute state-changing actions.


    **Common Threats for Margin Users**

    Fraudsters may target margin accounts by attempting to initiate unauthorized fund
    transfers or liquidate positions to trigger a cash-out. Be alert for ''urgent''
    messages claiming your account is facing a margin call that requires immediate
    payment to an external address; Solstice Invest will always communicate margin
    deficiencies through secure in-app channels.


    **Our Security Commitments**

    - We will **never** ask for your password or MFA codes via phone or email.

    - We will **never** request that you transfer funds to a third-party ''security
    account'' to protect your equity.

    - All sensitive account modifications require a verified secure session.


    **Immediate Action Steps**

    If you notice an unauthorized trade or a sudden change in your borrowed balance,
    notify us immediately. Fraud reports are treated with immediate urgency. To limit
    your liability, any suspected unauthorized activity must be reported within 60
    days of the statement date.


    **Standard of Care**

    We follow a standardized investigation timeline to resolve disputes fairly, and
    you will be notified of our progress through secure channels. Remember that while
    we provide the tools for leverage, the responsibility for monitoring account equity
    rests with the client.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 71f5e65e-6db5-51c2-94c9-7a9a1a5074f3
  title: Margin Investing Account — change-of-terms policy
  body: 'This policy governs how Solstice Invest modifies the terms associated with
    your **Margin Investing Account**. By maintaining this account, you agree to the
    following terms regarding adjustments to rates and requirements.


    **Rate and Requirement Adjustments**

    Solstice Invest reserves the right to change the **margin rate** (currently 8.5%),
    the **minimum equity** threshold (currently $2000), and the **maintenance margin**
    (currently 25%) based on market volatility, regulatory changes, or the risk profile
    of the securities held in your account.


    **Notice Period**

    We will provide a minimum of 30 calendar days'' notice before any change to the
    **margin rate** or **maintenance margin** takes effect. Notice will be delivered
    via secure in-app messaging. If the change is mandated by a regulatory body (such
    as the SEC or FINRA), the notice period may be shortened to comply with the law.


    **Client Obligations**

    Upon notification of a change, it is the client''s responsibility to ensure their
    account equity remains above the new **minimum equity** or **maintenance margin**
    levels. Failure to do so may result in a margin call.


    **Termination of Agreement**

    Either party may terminate this margin agreement at any time. Upon termination,
    all outstanding borrowed funds, including accrued interest at the 8.5% rate, must
    be paid in full before the account can be closed or converted to a cash account.


    **Standard of Care**

    In accordance with **Regulation Best Interest**, we ensure that any change in
    terms is applied fairly and transparently across our retail client base.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 47745f22-6f5a-50da-85a2-36ca5926eeac
  title: Margin Investing Account — getting started walkthrough
  body: 'This guide is for support agents assisting clients in the activation of a
    **Margin Investing Account**. This product is an advanced tool for experienced
    investors to leverage their equity for increased buying power.


    **Core Product Specifications**

    - **Margin Rate**: 8.5% (Annual rate applied to the borrowed balance).

    - **Minimum Equity**: $2000 (The minimum amount of own funds required to open
    and maintain the margin feature).

    - **Maintenance Margin**: 25% (The minimum percentage of equity that must be maintained
    in the account to avoid a margin call).


    **Step-by-Step Activation Process**

    1. **Eligibility Check**: Verify the client has a qualifying brokerage account.
    They must be an experienced investor capable of understanding the risks of leverage.

    2. **Equity Verification**: Confirm the client has at least $2000 in eligible
    equity to meet the **minimum equity** requirement.

    3. **Agreement Execution**: Facilitate the signing of the Margin Agreement. Ensure
    the client acknowledges that returns are not guaranteed and that they can lose
    more than their initial investment.

    4. **Feature Activation**: Once the agreement is signed and the $2000 minimum
    is verified, activate the margin feature. The client will now see ''Buying Power''
    in their account dashboard, which exceeds their cash balance.

    5. **Confirmation**: Provide the client with a summary of the 8.5% **margin rate**
    and the 25% **maintenance margin** requirement.


    **Support Escalation**

    If a client disputes their available buying power or has complex questions regarding
    **Settlement** timing on margin trades, escalate the inquiry to a licensed specialist.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: de09b786-33a0-5765-bb3e-8445f2cd191d
  title: Margin Investing Account — maintenance margin explained
  body: '**What is the maintenance margin?**

    The **maintenance margin** is the minimum amount of equity you must keep in your
    **Margin Investing Account** to keep it in good standing. At Solstice Invest,
    this is set at 25% of the total market value of the securities in your account.


    **What happens if my equity falls below 25%?**

    If your equity drops below the 25% **maintenance margin**, you will receive a
    ''margin call.'' This means you must either deposit more cash or sell some of
    your securities to bring your equity back up to the required level.


    **Can Solstice Invest sell my stocks without my permission?**

    Yes. If you do not meet a margin call promptly, we reserve the right to sell securities
    in your account to cover the deficiency. This is done to maintain platform stability
    and regulatory compliance.


    For more details on account requirements, see the **Margin Investing Account —
    eligibility requirements** document.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: b08fdca8-90c8-542f-ab00-641c8c6b7c4e
  title: Margin Investing Account — make a change or update
  body: "Use this process to update the settings or status of your **Margin Investing\
    \ Account**. \n\n**Updating Margin Preferences**\nIf you wish to change how your\
    \ account handles margin (e.g., switching from a margin-enabled state to a cash-only\
    \ state), follow these steps:\n\n1. **Request the Change**: Tell us that you would\
    \ like to update your account type or disable margin borrowing.\n2. **Equity Review**:\
    \ We will review your current balance. If you have an outstanding loan, we will\
    \ provide the exact amount needed to pay off the debt, including the accrued 8.5%\
    \ **margin rate** interest.\n3. **Settlement of Debt**: Provide the necessary\
    \ funds or authorize the sale of securities to clear the borrowed balance. We\
    \ will confirm once the balance is $0.\n4. **Confirmation of Update**: We will\
    \ process the change and send a confirmation through the secure in-app messenger\
    \ stating that your account is no longer utilizing margin.\n\n**Updating Contact\
    \ Information for Margin Calls**\nBecause margin calls are time-sensitive, ensuring\
    \ your contact details are current is vital:\n\n1. **Provide New Details**: Give\
    \ us the updated phone number or email address you wish to use for urgent notifications.\n\
    2. **Identity Verification**: Complete the required multi-factor authentication\
    \ to verify your identity.\n3. **Verification of Update**: We will confirm that\
    \ your profile has been updated and that all future alerts regarding your 25%\
    \ **maintenance margin** will be sent to the new contact method."
  domain: brokerage_investing
  product_category: margin_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: d2decd8e-b22c-54aa-907b-50a07cf7d28c
  title: Margin Investing Account — access or login problems
  body: 'If you are unable to access your **Margin Investing Account** or are experiencing
    login failures, follow these steps to resolve the issue.


    **Symptom: ''Unable to authenticate'' or ''Account Locked''**


    **Likely Causes**

    - Incorrect multi-factor authentication (MFA) tokens.

    - Multiple failed login attempts triggering a security freeze.

    - An expired secure session.


    **Resolution Steps**

    1. **Verify Connection**: Ensure you are using a stable internet connection and
    that your device''s time settings are synchronized (incorrect time can cause MFA
    failures).

    2. **Reset Secure Session**: Log out completely and attempt to log back in. Ensure
    you are using the most recent MFA code sent to your verified device.

    3. **Identity Re-verification**: If the account is locked, tell us you need to
    regain access. We will initiate a strict identity verification process. You will
    need to provide government-issued identification and complete a live verification
    check.

    4. **Session Restoration**: Once identity is verified, we will unlock the account
    and you will receive a notification that your secure session is restored.


    **When to Escalate**

    If you believe your login problems are the result of unauthorized access (e.g.,
    you received an MFA code you did not request), tell us immediately. We will treat
    this as a fraud report with immediate urgency. We will then freeze all state-changing
    actions on the account, including margin trades and fund transfers, while a specialist
    team conducts a formal investigation. You will be notified of the progress through
    secure channels.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
