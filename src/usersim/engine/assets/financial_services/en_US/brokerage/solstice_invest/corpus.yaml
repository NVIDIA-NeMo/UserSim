- id: 2bbfc1b9-5fbc-5dea-9d97-c577bd43c104
  title: Joint Brokerage Account — cancel, close, or downgrade
  body: "Closing or changing your Joint Brokerage Account requires coordination between\
    \ all account holders to ensure fair treatment and security. Follow these steps\
    \ to complete the process:\n\n**Prerequisites**\n* All pending trades must reach\
    \ **Settlement** (the process where the trade is finalized and securities/cash\
    \ are transferred).\n* All outstanding margin balances (if applicable) must be\
    \ paid in full.\n* Both joint owners must be available to verify their identities\
    \ via multi-factor authentication.\n\n**Step-by-Step Process**\n1. **Initiate\
    \ the Request**: Tell us that you wish to close or downgrade your Joint Brokerage\
    \ Account. You must specify if you want to liquidate assets for cash or transfer\
    \ them to another firm.\n2. **Identity Verification**: We will prompt both joint\
    \ owners to complete a secure verification session to authorize the action.\n\
    3. **Asset Disposition**: \n    * **To Liquidate**: Tell us to sell all remaining\
    \ holdings. We will execute the trades and move the cash to your linked bank account.\n\
    \    * **To Transfer**: Provide the receiving firm's details. We will initiate\
    \ the transfer, and a **fee of $75** will be deducted from the account balance\
    \ for the transfer out.\n4. **Confirmation**: Once the assets are moved or liquidated\
    \ and the final fees are processed, we will send a closing confirmation to both\
    \ owners via secure in-app messaging.\n\n**How you know it worked**\nYour account\
    \ status will change to 'Closed' in your account dashboard, and you will receive\
    \ a final account statement reflecting a zero balance."
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 51ef63a4-47a5-5e8d-8c18-27afcfb69fe0
  title: Joint Brokerage Account — an unexpected charge or amount
  body: '**Symptom**: You notice a deduction in your account balance that you do not
    recognize or a trade total that is higher than expected.


    **Likely Causes**

    * **Options Fees**: You may have traded options, which incur a fee of **$0.65
    per contract**, unlike stock trades which are $0.

    * **Transfer Out Fee**: If you recently moved assets to another brokerage, a **fee
    of $75** is applied for the account transfer out.

    * **Settlement Timing**: A trade may have settled at a different price than the
    initial order, or a dividend/corporate action occurred.


    **What to Check**

    1. **Review Order History**: Check the ''Activity'' tab to see if the charge corresponds
    to an options trade. Calculate the number of contracts multiplied by $0.65.

    2. **Check Transfer Logs**: Verify if an ACAT or internal transfer was initiated,
    which would trigger the $75 fee.

    3. **Verify Settlement**: Ensure the trade has reached **Settlement** and check
    the final execution price.


    **The Fix**

    If the charge is a valid fee (such as the $0.65 options fee or $75 transfer fee),
    no further action is needed. If you believe the charge is an error or the result
    of unauthorized activity, tell us immediately.


    **When we escalate**

    If you dispute a charge as fraudulent, we will immediately freeze the account
    and raise a formal dispute case. We will follow our standardized investigation
    timeline and notify you of the progress and the final resolution through secure
    channels.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: troubleshooting
  source_authority: official
