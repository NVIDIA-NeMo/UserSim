- id: 06f3af4c-2f68-5239-828d-cfef8378d920
  title: Joint Brokerage Account — make a change or update
  body: 'Use these steps to update the personal information or account settings on
    your **Joint Brokerage Account**. Because this is a shared account, certain changes
    require the consent of both owners.


    **Prerequisites**

    - A verified secure session for the user requesting the change.

    - Valid identification for any party whose information is being updated.


    **Steps to Update Account Details**

    1. **Request the Change**: Tell us which specific detail needs updating (e.g.,
    legal name, residential address, or contact email).

    2. **Identity Verification**: We will prompt you to complete a **multi-factor
    authentication** check to ensure the request is authorized.

    3. **Provide Documentation**: For legal name changes or address updates, provide
    a digital copy of the supporting legal document (such as a marriage license or
    utility bill).

    4. **Joint Consent**: For changes that affect the ownership structure or account
    permissions, we will reach out to the other joint owner via secure in-app messaging
    to obtain their digital consent.

    5. **Confirmation**: Once we have verified the documents and received all necessary
    consents, we will confirm that the update has been applied to your account.


    **How you know it worked**

    You will receive a secure notification confirming the change, and the updated
    information will be reflected in your account profile immediately.


    *Note: We cannot change the fundamental account type from joint to individual;
    this would require closing the account and opening a new one, which may trigger
    the **$75 account transfer out fee** if assets are moved to another firm.*'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 973e3607-488f-58bb-9b39-e6336699cf2a
  title: Joint Brokerage Account — access or login problems
  body: '**Symptom**: You or your partner are unable to log into the **Joint Brokerage
    Account**, or you are receiving an ''Authentication Failed'' error despite using
    the correct password.


    **Likely Causes**

    - Outdated multi-factor authentication (MFA) device.

    - Account lock due to multiple failed login attempts.

    - Session expiration during a state-changing action.


    **Resolution Steps**

    1. **Check MFA Connectivity**: Ensure your mobile device is receiving signals.
    If you have changed your phone number, you will need to undergo a full identity
    re-verification.

    2. **Verify Session Status**: If you were in the middle of a trade, your session
    may have timed out for security. Try logging in again from the main screen.

    3. **Request a Password Reset**: If the password is forgotten, request a reset.
    We will send a verification link to your registered secure email.

    4. **Clear Cache**: If the app is freezing on the login screen, ensure you are
    using the latest version of the Solstice Invest app.


    **When to Escalate**

    If you have completed the steps above and still cannot access the account, or
    if you suspect your login credentials have been compromised, tell us immediately.


    **What we will do next**

    We will freeze the account to prevent unauthorized trades or transfers and route
    your case to our security specialists. They will perform a manual identity verification
    of both joint owners. You will receive a notification through your secure backup
    channel once access has been restored.


    *Disclaimer: All account modifications require a verified secure session to protect
    your assets.*'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
