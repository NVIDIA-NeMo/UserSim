    | Requirement | Condition | Outcome |

    | :--- | :--- | :--- |

    | **Age** | All applicants must be 18 years or older | Eligible |

    | **Residency** | Legal resident of the United States | Eligible |

    | **Identification** | Valid government-issued photo ID for all parties | Eligible
    |

    | **Verification** | Successful completion of multi-factor authentication | Active
    Account |

    | **Taxes** | Valid Social Security Number (SSN) or TIN for all parties | Eligible
    |


