- id: b41b9ddb-0fad-5c4a-b52c-072322989957
  title: Custodial (UGMA) Brokerage — account security best practices
  body: "Protecting the future assets of a minor requires vigilance. Because a **Custodial\
    \ (UGMA) Brokerage** account involves a custodian managing funds for a beneficiary,\
    \ it can be a target for social engineering scams. \n\n**Common Fraud Patterns**\n\
    Be wary of unsolicited communications claiming there is a \"tax windfall\" or\
    \ \"mandatory update\" required for the minor's beneficiary status. Scammers may\
    \ attempt to pressure custodians into transferring funds to an external account\
    \ to \"secure\" them. Remember: Solstice Invest will **never** ask you for your\
    \ password or multi-factor authentication (MFA) codes via text or email.\n\n**Our\
    \ Security Standards**\nTo maintain platform stability and protect your assets,\
    \ we require **strict multi-factor authentication** and identity verification\
    \ before any state-changing action or fund transfer. No sensitive account modifications—such\
    \ as changing the registered custodian's contact information—will occur without\
    \ a verified secure session.\n\n**Immediate Actions**\nIf you notice any unauthorized\
    \ login attempts or suspicious activity, notify us immediately. We treat fraud\
    \ reports with immediate urgency and follow a standardized investigation timeline\
    \ to resolve disputes fairly. To limit your liability, reports of unauthorized\
    \ fund transfers should be made within 60 days of the statement date.\n\n**Disclaimer:**\
    \ While we provide robust security tools, the custodian is responsible for maintaining\
    \ the confidentiality of their login credentials. Market risks apply to all securities\
    \ held within the account."
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: security_advisory
