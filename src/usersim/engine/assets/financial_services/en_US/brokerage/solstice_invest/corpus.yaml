- id: bdd66f7c-0062-585c-bc72-40b3896de381
  title: Margin Investing Account — vs. a similar product here
  body: 'When choosing between a **Margin Investing Account** and an **Individual
    Brokerage Account**, the primary difference is the source of your buying power.


    **Individual Brokerage Account**

    *   **Funding**: Limited to the cash you deposit.

    *   **Risk**: Market risk only; you cannot lose more than your initial investment.

    *   **Cost**: $0 commissions; no interest charges.

    *   **Best For**: Beginners or conservative investors seeking low-cost market
    entry.


    **Margin Investing Account**

    *   **Funding**: Your deposits plus borrowed funds from Solstice Invest.

    *   **Risk**: Higher; leverage can amplify losses, and you may owe more than your
    initial investment.

    *   **Cost**: $0 commissions; 8.5% margin rate on borrowed funds.

    *   **Requirements**: Requires a **Minimum Equity** of $2000 and a 25% **Maintenance
    Margin**.

    *   **Best For**: Experienced traders looking to increase their buying power through
    leverage.


    If you prefer a simple, no-debt approach to investing, the Individual Brokerage
    Account is the better choice.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 92a2bf59-db74-5605-b41e-40a5d0683622
  title: Margin Investing Account — regulatory disclosures
  body: 'This disclosure provides essential regulatory information regarding the **Margin
    Investing Account**. Solstice Invest operates under SEC and FINRA frameworks,
    prioritizing transparency regarding market risk and **Settlement** timing.


    **Risk of Leverage**

    Trading on margin involves significant risk. While leverage can increase potential
    gains, it equally amplifies potential losses. You can lose more money than you
    deposited in your account. Returns are never guaranteed.


    **Margin Calls and Liquidation**

    To maintain your account, you must adhere to the 25% **Maintenance Margin** requirement.
    If your equity falls below this threshold, Solstice Invest may issue a margin
    call. If the equity is not restored to the required level, we reserve the right
    to liquidate securities in your account without prior notice to cover the margin
    deficiency.


    **Interest and Costs**

    Borrowed funds are subject to a margin rate of 8.5%. This rate is applied to the
    debit balance of your account. All clients must maintain a **Minimum Equity**
    of $2000 to qualify for these services.


    **Regulation Best Interest**

    In accordance with **Regulation Best Interest**, we provide educational resources
    and suitable product recommendations. However, Solstice Invest does not provide
    individualized tax or legal advice. We encourage all clients to consult with a
    qualified professional regarding their specific financial situation.


    **Data Privacy**

    We maintain strict data privacy and fair treatment standards. No sensitive account
    modifications occur without a verified secure session using multi-factor authentication.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
