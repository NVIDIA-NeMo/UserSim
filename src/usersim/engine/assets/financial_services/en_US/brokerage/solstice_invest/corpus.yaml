- id: 1b8e781c-0518-5821-a6ab-d429a4f05bd5
  title: Individual Brokerage Account — who it is best for and common use cases
  body: 'The **Individual Brokerage Account** is the foundational tool for solo investors
    seeking low-cost market entry. It is specifically designed for those who want
    full control over their investment strategy without the complexity of joint ownership.


    **Who It Is Best For**

    *   **Beginner Investors**: Those starting their journey who benefit from **$0
    stock commissions** to build a diversified portfolio without high entry costs.

    *   **Independent Traders**: Individuals who prefer sole decision-making power
    over their asset allocation.

    *   **Long-term Savers**: Investors focused on wealth accumulation who value a
    transparent, low-fee environment.


    **Common Use Cases**

    *   **Dollar-Cost Averaging**: Regularly investing small amounts into stocks or
    ETFs using our zero-commission structure.

    *   **Strategic Leveraging**: Experienced investors may use the account''s **Margin**
    capabilities to increase buying power, subject to a margin rate of **8.5%**.

    *   **Portfolio Consolidation**: Moving assets from other brokerages into one
    streamlined, modern interface.


    **Key Cost Summary**

    *   **Stock Trade Commission**: $0

    *   **Margin Rate**: 8.5%

    *   **Account Transfer-Out Fee**: $75


    **Disclaimer**: All investing involves risk. Returns are never guaranteed, and
    the use of margin can increase potential losses.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: b4278989-51a6-569e-ad9d-f74cba63ce47
  title: Individual Brokerage Account — margin rate explained
  body: '**What is the cost of borrowing on margin for my Individual Brokerage Account?**

    If you choose to borrow against your account equity to purchase more securities,
    you will be charged a margin rate of **8.5%**. This interest is calculated based
    on the amount of credit extended to you.


    **How is the margin rate applied?**

    The **8.5%** rate is an annual percentage. Interest accrues daily on the debit
    balance of your account and is typically posted to your account monthly.


    **Is there a way to avoid this rate?**

    Yes. To avoid paying the **8.5%** margin rate, ensure you only trade using the
    settled cash available in your account. Trading on a ''cash-only'' basis means
    you are not borrowing funds from Solstice Invest.


    For more details on how this interacts with your balance, please refer to the
    **Individual Brokerage Account — rate sheet**.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 7bf9f864-9d45-5f20-b077-18032eeb32de
  title: Individual Brokerage Account — cancel, close, or downgrade
  body: "Closing your **Individual Brokerage Account** is a straightforward process.\
    \ Before beginning, ensure all your open trades have reached **Settlement** and\
    \ that you have a plan for your remaining assets.\n\n**Steps to Close Your Account**\n\
    1.  **Liquidate or Transfer Assets**: Tell us if you would like to sell your current\
    \ positions for cash or transfer them to another firm. If you choose to move your\
    \ assets to another brokerage, a **$75** account transfer-out fee will be applied\
    \ to your balance.\n2.  **Clear Pending Obligations**: We will review your account\
    \ to ensure there are no outstanding margin debits or pending trades. If you have\
    \ a margin balance, it must be paid in full (including any accrued interest at\
    \ the **8.5%** rate) before the account can be closed.\n3.  **Request Final Closure**:\
    \ Once your balance is in cash and obligations are met, ask us to formally close\
    \ the account. \n4.  **Receive Confirmation**: We will process the closure and\
    \ send a final confirmation notice through your secure in-app messaging channel.\
    \ This notice will include your final balance and details on the disbursement\
    \ of any remaining funds.\n\n**Note on Downgrading**: If you wish to keep your\
    \ account but remove margin privileges to avoid the risk of the **8.5%** rate,\
    \ simply ask us to convert your account to a cash-only brokerage account."
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: d66be249-3421-5a6e-934e-b63d6f08be28
  title: Individual Brokerage Account — an unexpected charge or amount
  body: 'If you notice a charge or a balance discrepancy in your **Individual Brokerage
    Account**, follow these steps to identify the cause.


    **Common Symptoms**

    *   A deduction of **$75** from your cash balance.

    *   Daily or monthly interest charges appearing in your transaction history.

    *   A lower-than-expected balance after a trade.


    **What to Check**

    1.  **Check for Asset Transfers**: Did you recently move securities to another
    firm? If so, the **$75** charge is the standard account transfer-out fee.

    2.  **Review Margin Usage**: Have you purchased securities using more than your
    available cash? If you have a debit balance, you will see interest charges reflecting
    the **8.5%** margin rate.

    3.  **Verify Trade Settlement**: Check the date of your last trade. Remember that
    **Settlement** takes time; your ''available to withdraw'' balance may differ from
    your ''total account value'' until the trade is finalized.


    **Resolution and Escalation**

    If the charge is not related to a transfer or margin interest, tell us the specific
    transaction date and amount. We will investigate the discrepancy. If we find a
    billing error, we will apply a correction to your account. If the issue involves
    potential unauthorized activity, we will immediately treat it as a fraud report
    and follow our standardized investigation timeline to resolve the dispute fairly.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
