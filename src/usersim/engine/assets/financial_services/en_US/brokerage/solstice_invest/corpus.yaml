- id: dda585ef-5dff-5902-8370-a870d1d99342
  title: Individual Brokerage Account — vs. a similar product here
  body: 'When deciding between the **Individual Brokerage Account** and the **Joint
    Brokerage Account**, the primary considerations are ownership structure and intended
    use.


    **Individual Brokerage Account**

    *   **Ownership**: Solely owned by one person.

    *   **Cost**: $0 stock commissions.

    *   **Best For**: Solo investors seeking low-cost market entry and full control
    over their investment strategy.


    **Joint Brokerage Account**

    *   **Ownership**: Collaborative ownership for partners.

    *   **Cost**: $0 stock commissions.

    *   **Best For**: Partners who wish to invest together and require added support
    for options trading.


    Both accounts provide the same cost-efficiency regarding stock trades, but the
    **Joint Brokerage Account** is the superior choice for those coordinating wealth
    with a spouse or partner. The **Individual Brokerage Account** is the better choice
    for individuals who prioritize independence and simplicity in their portfolio
    management.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: c68099a9-a84f-5074-af1d-11fcb577704a
  title: Individual Brokerage Account — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the **Individual
    Brokerage Account**. Solstice Invest operates under the frameworks established
    by the SEC and FINRA.


    **Standard of Care**

    In accordance with **Regulation Best Interest**, Solstice Invest is committed
    to acting in the best interest of our retail customers. While we provide suitable
    product recommendations and educational resources, we do not offer individualized
    tax or legal advice. Clients are encouraged to consult with a certified tax professional
    or legal counsel for such matters.


    **Risk and Returns**

    Investment in securities involves inherent market risk. Solstice Invest strictly
    prohibits the guaranteeing of returns. All communications provided to the client
    maintain a standard of transparency regarding the possibility of loss. Past performance
    is not a guarantee of future results.


    **Margin Terms**

    Clients who utilize **Margin** (borrowing against account equity) are subject
    to a **margin rate of 8.5%**. Margin trading increases the risk of loss and may
    result in a loss greater than the initial amount invested. Solstice Invest reserves
    the right to liquidate positions to cover margin deficiencies.


    **Asset Transfers**

    While stock trades are offered at a **commission of $0**, certain administrative
    actions are subject to fees. A fee of **$75** is charged for the transfer of assets
    out of the account to another institution.


    **Settlement and Privacy**

    All trades are subject to standard **Settlement** periods. Solstice Invest maintains
    strict data privacy and fair treatment standards to protect client information
    and ensure equitable market access.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
