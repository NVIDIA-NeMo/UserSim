- id: 2c88670a-f8f2-51d8-bd82-9ee868195a04
  title: Custodial (UGMA) Brokerage — a failed or pending action
  body: '**Symptom:** You attempted to open a Custodial (UGMA) Brokerage account or
    execute a trade, but the action is marked as ''Pending'' or ''Failed''.


    **Likely Causes:**

    - **Identity Verification:** The most common cause is an incomplete multi-factor
    authentication or a mismatch in the minor''s provided SSN/Date of Birth.

    - **Settlement Timing:** For trades, the action may be pending due to standard
    **Settlement** timelines (the process where the transfer of securities and cash
    is completed).

    - **Security Lock:** A state-changing action may have been flagged if the session
    was not fully verified.


    **What to check in order:**

    1. **Session Status:** Ensure you are in a verified secure session. If the session
    timed out, the action will fail.

    2. **Documentation:** Double-check that the minor''s legal information matches
    their official government records exactly.

    3. **Funding Status:** While the **minimum opening deposit is $0**, ensure any
    funds intended for a trade have completed settlement.


    **The Fix:**

    - If the issue is verification, provide the requested identification documents
    or re-authenticate via the secure prompt.

    - If the issue is settlement, wait for the standard settlement window to close.


    **When we escalate:**

    If the action remains ''Pending'' beyond the standard regulatory window, we will
    raise a case with our licensed brokerage specialists. You will be notified of
    the investigation progress through secure channels. We treat all account discrepancies
    with urgency to resolve the dispute fairly.'
