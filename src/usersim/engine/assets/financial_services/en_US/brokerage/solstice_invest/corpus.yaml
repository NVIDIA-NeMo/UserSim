- id: 5ae883c5-b5c1-53e9-b2d5-0c6e17164a06
  title: Individual Brokerage Account — make a change or update
  body: 'Follow these steps to update your personal information or modify your account
    settings for your Individual Brokerage Account.


    **Prerequisites**

    Before starting, ensure you have your current government-issued ID available if
    you are changing your legal name or tax identification number.


    **Step-by-Step Update Process**

    1. **Specify the Change**: Tell us exactly which piece of information needs updating
    (e.g., "I need to change my residential address" or "I want to update my email
    address").

    2. **Identity Verification**: You will be prompted to complete a multi-factor
    authentication check. This is a required security step for any state-changing
    action.

    3. **Provide New Details**: Give us the updated information. If you are updating
    a legal name, provide a digital copy of your updated legal documentation.

    4. **Review and Confirm**: We will read back the changes to you to ensure accuracy.
    Confirm that the details are correct.

    5. **Verification of Completion**: We will send a confirmation message to your
    secure in-app inbox once the update is finalized in our systems.


    **Important Considerations**

    - **Secure Sessions**: No sensitive account modifications occur without a verified
    secure session to protect your data privacy.

    - **Processing Time**: Simple contact updates are usually instant; legal name
    or tax ID changes may take 2-3 business days for verification.


    For instructions on closing your account, see Individual Brokerage Account — cancel,
    close, or downgrade.'
