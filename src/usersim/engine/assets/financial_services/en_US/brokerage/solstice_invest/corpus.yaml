- id: deb722f1-3a29-5745-8848-aca0ddce6d1b
  title: Custodial (UGMA) Brokerage — cancel, close, or downgrade
  body: 'Closing a Custodial (UGMA) Brokerage account requires careful handling to
    ensure the minor''s assets are protected and transferred correctly.


    **Requirements Before Starting**

    * All pending trades must have reached **Settlement** (the process where the transfer
    of securities and cash is finalized).

    * All open orders must be canceled.

    * A verified secure session must be established via multi-factor authentication.


    **Steps to Close the Account**

    1. **Request Account Closure**: Tell us that you wish to close the Custodial (UGMA)
    Brokerage account. You must specify if the assets are being transferred to the
    minor (due to age of majority) or to another brokerage.

    2. **Liquidate or Transfer Assets**: Provide instructions on whether to sell all
    current holdings (converting them to cash) or to initiate a transfer of securities
    to another institution.

    3. **Verify Destination**: Provide the verified account details for the destination
    of the funds or securities. We will perform an identity verification check on
    the receiving party to prevent fraud.

    4. **Confirm Final Balance**: We will provide a final statement showing the remaining
    cash balance and any applicable administrative fees.

    5. **Receive Confirmation**: Once the assets are moved and the balance is $0,
    we will send a secure confirmation that the account is officially closed.


    **How You Know It Worked**

    You will receive a final account statement via secure messaging and a confirmation
    notice stating that the account is closed and no further activity is permitted.'
