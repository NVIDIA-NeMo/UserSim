- id: efe65be2-7ac6-5fd8-a93f-a31c82d88f5a
  title: Individual Brokerage Account — check status or history
  body: 'Follow these steps to review your current holdings, trade history, and account
    status.


    **Prerequisites**

    You must have a verified secure session active through multi-factor authentication
    to access your account records.


    **Steps to Review Your Account**

    1.  **Request your current positions**: Ask us for a list of your current holdings.
    We will provide a detailed breakdown of the securities you own and their current
    market value.

    2.  **Request trade history**: Ask for your transaction history for a specific
    date range. We will provide a list of all buy and sell orders, including the execution
    price and the $0 stock commission applied to each trade.

    3.  **Check settlement status**: For recent trades, ask us to verify the **Settlement**
    status. We will confirm if the transfer of securities and cash has been completed
    or if the trade is still pending.

    4.  **Review balance and margin**: Ask for your current account balance. If you
    are utilizing margin, we will provide the current amount borrowed and confirm
    the applied margin rate of 8.5%.


    **Confirmation of Success**

    You will know the process is complete when you receive a comprehensive summary
    of your assets, a confirmed list of past transactions, and a clear statement of
    your available cash versus borrowed margin funds.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: how_to_guide
  source_authority: official
