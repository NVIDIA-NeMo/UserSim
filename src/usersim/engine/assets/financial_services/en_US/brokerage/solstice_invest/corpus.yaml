- id: 30ab7699-b749-5c00-9723-4503f4fd0500
  title: Joint Brokerage Account — who it is best for and common use cases
  body: 'The Joint Brokerage Account is designed for partners, spouses, or family
    members who wish to build wealth together through a single, collaborative portfolio.
    It balances ease of access with the powerful tools needed for sophisticated trading.


    **Best For**

    * **Couples and Partners**: Ideal for those managing household investments together
    with shared goals.

    * **Collaborative Traders**: Partners who want to coordinate strategies and share
    the ability to trade options.

    * **Family Wealth Building**: A transparent way for family members to contribute
    to and grow a shared pool of assets.


    **Common Use Cases**

    * **Shared Retirement Planning**: Building a diversified portfolio of stocks and
    ETFs together without needing separate accounts.

    * **Strategic Options Trading**: Utilizing the account''s support for options
    to hedge a joint portfolio or generate income.

    * **Simplified Asset Management**: Consolidating funds into one place to reduce
    the administrative burden of tracking multiple individual portfolios.


    **Cost Structure**

    * **Stock Commissions**: $0

    * **Options Trading**: $0.65 per contract

    * **Account Transfer Out Fee**: $75


    **Key Benefits**

    This account offers a low-cost entry point to the markets, democratizing access
    through $0 stock commissions while maintaining a professional standard of care.
    It is a more collaborative alternative to the Individual Brokerage Account — overview.


    **Disclaimer**: All investing involves risk. Returns are not guaranteed.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 2c48e8ce-3308-59b2-b3dd-e58383d26680
  title: Joint Brokerage Account — options contract fee explained
  body: '**What is the fee for trading options in my Joint Brokerage Account?**

    While we offer $0 commissions for stock trades, options trading carries a specific
    administrative cost. You will be charged a fee of **$0.65 per options contract**
    traded.


    **How is this fee calculated?**

    The fee is applied per contract. For example, if you buy 10 options contracts
    in a single trade, the total fee for that transaction would be $6.50 (10 contracts
    x $0.65).


    **Why is there a fee for options but not for stocks?**

    To maintain platform stability and ensure regulatory compliance for more complex
    instruments, we apply specific administrative fees to specialized services like
    options trading. For a full breakdown of all costs, please refer to the Joint
    Brokerage Account — fee schedule.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
