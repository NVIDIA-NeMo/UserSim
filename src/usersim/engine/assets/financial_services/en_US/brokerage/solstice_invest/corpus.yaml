- id: 5637ead9-8922-5e7f-9b59-cdd60ca88880
  title: Joint Brokerage Account — account transfer out fee explained
  body: '**What is the account transfer out fee for a Joint Brokerage Account?**

    If you decide to move your assets from Solstice Invest to another brokerage firm,
    there is a one-time **$75 account transfer out fee**. This fee is applied to maintain
    platform stability and cover the administrative costs of the transfer process.


    **How is this fee paid?**

    The $75 fee is typically deducted from the cash balance of your account before
    the assets are transferred. If there is not enough cash available, we may liquidate
    a portion of your holdings to cover the cost.


    **Are there any other fees for trading?**

    No. We believe in low-friction investing and offer **$0 stock commissions**. However,
    if you trade options, there is a fee of **$0.65 per options contract**. For more
    details on our cost structure, please see Joint Brokerage Account — overview.'
