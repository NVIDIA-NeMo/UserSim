- id: 2dd9701a-0675-594d-999f-c6cd91d0666a
  title: Individual Brokerage Account — account transfer out fee explained
  body: '**What is the fee for transferring my assets to another brokerage?**

    Solstice Invest charges a **$75 account transfer out fee**. This is a standard
    administrative fee applied when you move your securities and cash to another institution
    via the ACATS system.


    **Why is there a fee for transferring out when stock commissions are $0?**

    We believe in low-friction investing and offer **$0 stock commissions** to make
    the markets accessible. However, certain administrative actions—like the complex
    coordination required to move assets to another firm—carry a cost to maintain
    platform stability and regulatory compliance.


    **Can this fee be waived?**

    Fee waivers are handled on a case-by-case basis by our licensed specialists. Please
    provide the details of your request through our secure in-app messaging.


    For a full list of costs, please refer to the Individual Brokerage Account — fee
    schedule.'
