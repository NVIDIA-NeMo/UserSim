- id: af4fe599-181c-5bec-b497-4f0c3c820141
  title: Custodial (UGMA) Brokerage — make a change or update
  body: 'As a custodian, you may need to update account details or modify how the
    **Custodial (UGMA) Brokerage** account is managed. Follow these steps to ensure
    a secure update.


    **Prerequisites**

    You must have an active, verified secure session. Because these are state-changing
    actions, multi-factor authentication (MFA) is mandatory.


    **Steps to Update Account Information**

    1. **Specify the Change:** Tell us exactly which piece of information needs updating
    (e.g., the custodian''s residential address or the beneficiary''s legal name change).

    2. **Provide Documentation:** For legal name changes or address updates, provide
    a digital copy of the supporting legal documentation (e.g., a court order or government
    ID).

    3. **Verification Check:** We will verify the documents against your identity
    on file. You will receive a notification via secure in-app messaging once the
    verification is complete.

    4. **Confirmation of Update:** Once verified, we will apply the change and provide
    a confirmation message stating that the account records have been updated.


    **Updating Investment Preferences**

    If you wish to change the types of securities you are trading, simply place a
    new trade. Remember that we provide **$0 stock commissions**, but all trades are
    subject to **Settlement** timing as per SEC and FINRA frameworks.


    **Disclaimer:** Solstice Invest cannot provide legal advice on whether a change
    of custodian is appropriate for your specific situation. Please consult a legal
    professional for such inquiries.'
