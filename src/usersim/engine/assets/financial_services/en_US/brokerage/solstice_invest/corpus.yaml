- id: ada7e6f6-bf1e-576c-8380-35516aba8b57
  title: Individual Brokerage Account — account security best practices
  body: 'Protecting your assets in your Individual Brokerage Account is a shared responsibility.
    At Solstice Invest, we employ strict security frameworks, but your active participation
    is essential to prevent unauthorized access.


    **Core Security Requirements**

    To maintain the integrity of your funds, we require **multi-factor authentication
    (MFA)** and identity verification before any state-changing action or fund transfer
    occurs. No sensitive account modifications, such as changing your linked bank
    account or updating your legal address, will occur without a verified secure session.


    **Best Practices for Account Holders**

    - **Unique Credentials**: Use a complex password for your account that is not
    shared with any other service.

    - **Monitor Activity**: Regularly review your trade confirmations and monthly
    statements for any unfamiliar activity.

    - **Secure Connectivity**: Avoid accessing your brokerage account over public
    or unsecured Wi-Fi networks.

    - **Update Information**: Ensure your contact details are current so we can reach
    you immediately regarding suspicious activity.


    **What Solstice Invest Will Never Do**

    We will never ask you to reveal your password or MFA codes via email or text message.
    We will never request that you transfer funds to a third-party account to "verify"
    your identity or "unlock" a frozen account.


    **Immediate Action for Suspicious Activity**

    If you notice an unauthorized trade or a login attempt you did not initiate, notify
    us immediately via our secure in-app messaging. We treat fraud reports with immediate
    urgency and follow a standardized investigation timeline to resolve disputes fairly.
    You will be notified of our progress through secure channels throughout the resolution
    process.


    *Disclaimer: While we prioritize security, all market investments carry inherent
    risk. Solstice Invest does not guarantee returns.*'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: aadf352f-67ef-565b-8f11-eb3d0d9a7d19
  title: Individual Brokerage Account — change-of-terms policy
  body: 'This policy outlines the conditions under which Solstice Invest may modify
    the terms, fees, and rates associated with your Individual Brokerage Account.
    By maintaining an account, you agree to these terms.


    **Notification of Changes**

    Solstice Invest reserves the right to update the fee schedule or interest rates.
    For example, changes to the **$0 stock commission** structure or the **8.5% margin
    rate** will be communicated via secure in-app notification or email. We provide
    a minimum notice period of 30 calendar days before any fee increase or restrictive
    term change becomes effective.


    **Fee Adjustments**

    Fees are applied only to specific administrative actions or specialized credit
    services to maintain platform stability. If the **$75 account transfer out fee**
    is adjusted, clients will be notified within the standard 30-day window.


    **Client Obligations**

    Clients must maintain accurate identity verification and comply with all SEC and
    FINRA frameworks. Failure to maintain required equity in accounts utilizing **Margin**
    may result in the immediate liquidation of securities without prior notice to
    cover the deficit.


    **Acceptance and Termination**

    Continued use of the account after the effective date of a change constitutes
    acceptance of the new terms. If you do not agree to a change, you may close your
    account prior to the effective date. Closing an account remains subject to the
    current **$75 account transfer out fee** if assets are moved to another institution.


    **Standard of Care**

    Following **Regulation Best Interest**, we act in the best interest of the retail
    customer. We provide educational resources and suitable product recommendations
    but never offer individualized tax or legal advice.


    *Disclaimer: Returns are never guaranteed. All investing involves material risk.*'
