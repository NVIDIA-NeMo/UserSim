- id: f34d7119-330e-5f4a-b9ff-60590a94c7f6
  title: Custodial (UGMA) Brokerage — resolve a common request end-to-end
  body: 'This guide explains how to handle a common request: adding funds to a Custodial
    (UGMA) Brokerage and using those funds to purchase a stock for the minor.


    **Prerequisites**

    - An active Custodial (UGMA) Brokerage account.

    - A verified secure session established via multi-factor authentication.

    - A linked funding source (bank account) in the custodian''s name.


    **Step-by-Step Process**

    1. **Initiate Fund Deposit:** Tell us the amount you wish to deposit into the
    custodial account. We will process the transfer from your linked bank account.

    2. **Confirm Deposit Receipt:** We will notify you once the funds have landed
    in the account. Because the **minimum opening deposit** is $0, you can start with
    any amount.

    3. **Select Security:** Provide us with the ticker symbol or name of the stock
    you wish to purchase for the minor.

    4. **Execute Trade:** Tell us the number of shares or the dollar amount you wish
    to invest. We will execute the trade at the current market price.

    5. **Verify Commission:** Review the trade confirmation. You will see that the
    **commission for the stock trade** is $0.

    6. **Monitor Settlement:** Ask us for the **Settlement** date. We will confirm
    when the transaction is finalized and the securities are officially held in the
    account.


    **How you know it worked**

    Your account balance will reflect the deduction of the invested amount, and your
    holdings list will now include the new security. You will receive a trade confirmation
    showing $0 in commissions.'
