- id: 0f45a79b-a401-54dd-a386-4be6ba8a9e4a
  title: Joint Brokerage Account — privacy and data handling
  body: 'This disclosure outlines how Solstice Invest handles data and privacy for
    the **Joint Brokerage Account**. As a joint account, the privacy expectations
    differ from those of an individual account.


    **Data Visibility**

    All joint owners have full visibility into the account''s activity. This includes
    trade history, deposits, withdrawals, and current holdings. Neither party can
    hide transactions from the other, as the account is legally owned by both parties.


    **Verification and Access**

    In compliance with our security standards, we require **strict multi-factor authentication**
    for any action that changes the state of the account. While both owners have access,
    we maintain a detailed audit log of which authenticated user performed each specific
    action.


    **Data Sharing and Regulatory Reporting**

    We operate under SEC and FINRA frameworks. Solstice Invest may share account data
    with regulatory bodies as required by law. We adhere to **Regulation Best Interest**,
    ensuring that our data handling practices do not conflict with the best interests
    of the retail customer.


    **Privacy Protections**

    We maintain strict data privacy and fair treatment standards. Your personal identification
    information is encrypted and is never sold to third parties. However, because
    this is a joint product, communications regarding the account may be sent to both
    registered email addresses.


    **Fees and Transparency**

    We maintain transparency regarding all costs. This account features **$0 stock
    commissions**, an options contract fee of **$0.65**, and an account transfer out
    fee of **$75**. These fees are applied consistently across all joint accounts
    to ensure platform stability.


    *Disclaimer: Returns are never guaranteed. Solstice Invest does not provide individualized
    tax or legal advice. All investing involves market risk.*'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: fd3ada2c-b2f9-5d88-a2da-9816df892601
  title: Joint Brokerage Account — recognizing scams targeting this product
  body: 'When managing a **Joint Brokerage Account**, you and your co-owner are sharing
    financial access, which can create unique vulnerabilities. Scammers often target
    joint accounts by attempting to drive a wedge between the account holders or by
    impersonating one partner to mislead the other.


    **Common Scam Patterns**

    One frequent tactic involves ''urgency scams,'' where a fraudster poses as a Solstice
    Invest representative or a legal entity, claiming there is a critical issue with
    the joint ownership status. They may pressure you to move funds to a ''secure
    temporary account'' to avoid account freezes. Another common pattern is the ''social
    engineering'' approach, where a scammer gains the trust of one account holder
    to solicit the login credentials or multi-factor authentication codes of the other.


    **Our Security Standards**

    To protect your assets, Solstice Invest maintains a strict security posture. Please
    remember:

    - We will **never** ask you to transfer funds to an external account to ''verify''
    your identity or protect your balance.

    - We will **never** request your password or multi-factor authentication codes
    via phone or email.

    - Any state-changing action, such as adding a new co-owner or transferring a large
    sum of money, requires **strict multi-factor authentication** and identity verification
    for the parties involved.


    **Immediate Action Steps**

    If you notice a transaction you did not authorize, or if your co-owner reports
    suspicious activity, notify us immediately. We treat fraud reports with immediate
    urgency. A prompt report is essential to our standardized investigation timeline
    to ensure a fair resolution. All updates regarding the investigation will be provided
    to you through our secure in-app messaging channels.


    **Disclaimer**: Returns on investments are never guaranteed, and all market participation
    involves risk. Solstice Invest operates under SEC and FINRA frameworks to ensure
    transparency and fair treatment of all clients.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: a1d4cafb-52aa-5218-b963-c82962ca2a3e
  title: Joint Brokerage Account — limits, restrictions, and edge cases
  body: 'The **Joint Brokerage Account** is designed for collaborative investing between
    partners. While it offers flexibility, support agents must be aware of the following
    limits and restrictions to accurately guide customers.


    **Trading and Fee Restrictions**

    - **Stock Trading**: Standard stock trades carry a commission of $0, promoting
    low-friction market access.

    - **Options Trading**: While this account supports options, each contract carries
    a fee of $0.65. Agents should ensure customers are aware of this per-contract
    cost.

    - **Asset Transfers**: Transferring the account out to another institution incurs
    a one-time fee of $75.


    **Operational Limits**

    - **Settlement**: All trades are subject to standard **Settlement** periods (the
    process by which a trade is finalized and the transfer of securities and cash
    is completed). Funds are not available for withdrawal until settlement is complete.

    - **Authorization**: Any state-changing action, including fund transfers or security
    modifications, requires a verified secure session and multi-factor authentication.
    If one partner cannot be verified, the action may be blocked to protect the account
    equity.


    **Edge Cases**

    - **Disputes Between Owners**: In the event of a disagreement between joint owners
    regarding a trade or withdrawal, the account may be restricted to ''liquidation
    only'' until a legal agreement is reached or the account is closed.

    - **Account Closure**: Closing a joint account typically requires the consent
    or verified request of both parties, depending on the specific ownership agreement
    signed at onboarding.


    **Compliance Note**

    Under **Regulation Best Interest**, we provide educational resources and suitable
    recommendations. We do not offer individualized tax or legal advice regarding
    the implications of joint ownership. We maintain a strict standard of care that
    prohibits guaranteeing returns.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 3770dc56-6ed5-5cfd-8925-ebc56e3d8c72
  title: Joint Brokerage Account — cost and charges
  body: '**How much does it cost to trade stocks in a Joint Brokerage Account?**

    We believe in democratizing market access. Therefore, the commission for stock
    trades is $0.


    **Are there fees for trading options?**

    Yes. While we provide low-cost access, options trading carries a fee of $0.65
    per contract.


    **Is there a fee if I want to move my joint account to another brokerage?**

    Yes, there is an account transfer out fee of $75 applied to the administrative
    process of moving your assets to another firm.


    **Are there any other hidden costs?**

    No. We maintain a transparent fee philosophy. Fees are only applied to specific
    administrative actions or specialized services to ensure platform stability and
    regulatory compliance. For a full breakdown, please refer to the Joint Brokerage
    Account — fee schedule.'
