- id: 40066e8f-37fd-5aed-a591-fc4297918acc
  title: Custodial (UGMA) Brokerage — risk disclosures
  body: 'This disclosure outlines the material risks associated with the Custodial
    (UGMA) Brokerage account. All clients should review these terms before investing.


    **Market Risk and Returns**

    Investing in securities involves the risk of loss. Solstice Invest maintains a
    strict standard of care that prohibits guaranteeing returns. The value of the
    assets in the account may fluctuate based on market conditions, and it is possible
    to lose the entire principal invested.


    **Regulation Best Interest**

    In accordance with **Regulation Best Interest**, we provide educational resources
    and suitable product recommendations designed to act in the best interest of the
    retail customer. However, these recommendations are not guarantees of profit.


    **Settlement and Liquidity**

    Clients must be aware of **Settlement** timing. The process by which a trade is
    finalized and the transfer of securities and cash is completed takes time. Funds
    are not immediately available for withdrawal until the settlement period has elapsed.


    **Tax and Legal Advice**

    While we facilitate the UGMA account structure, Solstice Invest does not offer
    individualized tax or legal advice. The tax implications of UGMA accounts—including
    the ''kiddie tax'' and the transfer of assets to the minor—vary by jurisdiction.
    We strongly recommend consulting a qualified tax professional.


    **Fee Transparency**

    We believe in low-friction investing. We charge a **commission of $0** for stock
    trades and an **account maintenance fee of $0**. Fees are applied only to specific
    administrative actions or specialized credit services to maintain platform stability
    and regulatory compliance.'
