  institution_id: solstice_invest
- id: 6c541dbe-2722-572f-ae40-58dbadc404b1
  title: Individual Brokerage Account — set up and activate
  body: 'Follow these steps to establish your **Individual Brokerage Account** and
    begin investing.


    **Prerequisites**

    You will need a valid government-issued photo ID and your Social Security Number
    (SSN) or Taxpayer Identification Number (TIN) to satisfy regulatory identity verification
    requirements.


    **Activation Steps**

    1. **Provide Personal Details**: Tell us your full legal name, residential address,
    date of birth, and contact information.

    2. **Verify Identity**: Provide your SSN/TIN and upload a clear image of your
    government-issued ID. We will perform a secure identity verification to comply
    with SEC and FINRA frameworks.

    3. **Set Up Security**: Establish your password and enable multi-factor authentication.
    This ensures a verified secure session for all future state-changing actions.

    4. **Fund Your Account**: Tell us the amount you wish to deposit and provide your
    linked bank account details. We will confirm once the funds have been successfully
    transferred to your balance.

    5. **Confirm Activation**: We will send a notification through our secure channel
    confirming that your account is active and ready for trading.


    **Confirmation of Success**

    You will know the process is complete when you can view your available buying
    power in your account dashboard and see your initial deposit reflected in your
    balance.


    For more information on the costs associated with this account, see the **Individual
    Brokerage Account — overview**.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
