- id: 25cdaa43-bc0f-57b5-994f-b347e2da0fd2
  title: Individual Brokerage Account — fraud and unauthorized-activity protection
  body: 'At Solstice Invest, we prioritize the safety of your assets. Because the
    **Individual Brokerage Account** is designed for solo investors, it is often targeted
    by social engineering scams where bad actors attempt to gain control of your account
    to liquidate positions or transfer funds.


    **Common Fraud Patterns**

    Be alert for ''urgent'' requests via text or email claiming there is a problem
    with your **Settlement** or a regulatory hold on your funds. Fraudsters may attempt
    to trick you into revealing your multi-factor authentication codes or passwords
    to ''unlock'' your account. Remember, Solstice Invest will **never** ask you for
    your password, MFA codes, or request that you move funds to a ''safe account''
    via a third-party app.


    **Our Security Standards**

    To protect your equity, we require strict multi-factor authentication and identity
    verification before any state-changing action—such as a fund transfer or a change
    in contact information—is processed. No sensitive modifications occur without
    a verified secure session.


    **Immediate Action Steps**

    If you notice an unauthorized trade or a fund transfer you did not initiate, notify
    us immediately. We treat fraud reports with immediate urgency. Once a report is
    filed, we follow a standardized investigation timeline to resolve the dispute
    fairly, and you will be notified of the progress through our secure in-app messaging
    channels.


    **Disclaimer**: While we provide robust security frameworks, all investing involves
    market risk. Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 4526318e-7435-5a5c-bdeb-5a029c2b414a
  title: Individual Brokerage Account — account agreement
  body: 'This agreement governs the relationship between Solstice Invest and the client
    regarding the **Individual Brokerage Account**. By opening this account, both
    parties agree to the following terms:


    **1. Trading and Commissions**

    Solstice Invest provides market access with a **$0 stock commission** for standard
    trades. This low-friction model is designed to democratize investing; however,
    Solstice Invest reserves the right to modify this fee structure with prior notice.


    **2. Margin and Borrowing**

    If the client elects to use **Margin** to increase buying power, the client agrees
    to pay a margin rate of **8.5%**. The client acknowledges that using margin involves
    significant risk and that Solstice Invest may liquidate securities to cover a
    margin deficiency without prior notice.


    **3. Account Transfers**

    While we facilitate easy entry into the markets, a fee of **$75** is applied to
    all account transfer-out requests (ACATS) to cover administrative costs and regulatory
    compliance.


    **4. Standard of Care**

    Following **Regulation Best Interest**, Solstice Invest acts in the best interest
    of the retail customer. We provide educational resources and suitable recommendations
    but do not provide individualized tax or legal advice.


    **5. Termination**

    Either party may terminate this agreement. Upon closure, all outstanding fees,
    including the **$75** transfer-out fee if applicable, must be settled. The account
    will be closed once all positions have reached **Settlement** and cash balances
    are disbursed.


    **Disclaimer**: Investing involves risk of loss. Returns are not guaranteed.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
