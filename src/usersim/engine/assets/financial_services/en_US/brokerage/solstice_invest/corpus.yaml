- id: 04188925-fbf1-529f-89e1-b2af024f48ef
  title: Margin Investing Account — privacy and data handling
  body: 'This disclosure outlines the privacy and data handling practices specifically
    applicable to the **Margin Investing Account** at Solstice Invest.


    **Data Collection for Risk Management**

    To maintain the stability of our brokerage and ensure regulatory compliance, we
    collect and monitor specific data points related to your margin usage. This includes
    real-time tracking of your total account equity, the current market value of your
    securities, and your borrowed balance. This data is used exclusively to calculate
    your **maintenance margin** (currently 25%) and to trigger margin calls when necessary.


    **Information Sharing**

    We operate under SEC and FINRA frameworks. As such, we may share account data
    with these regulatory bodies during audits or as required by law. We do not sell
    your personal financial data to third-party marketers.


    **Security of Financial Records**

    All records pertaining to your margin loans, interest accrued at the 8.5% **margin
    rate**, and equity snapshots are stored using industry-standard encryption. Access
    to these records is restricted to licensed specialists and compliance officers.


    **Client Rights and Data Privacy**

    Clients have the right to request a summary of the data held regarding their margin
    activity. In accordance with our fair treatment standards, we ensure that all
    data used to make margin-related decisions (such as liquidating positions to cover
    a deficiency) is accurate and updated according to standard **Settlement** timings.


    **Standard of Care**

    Following **Regulation Best Interest**, Solstice Invest prioritizes transparency.
    We maintain strict data privacy and fair treatment standards to ensure your financial
    information is handled with professional integrity. Returns are never guaranteed,
    and the use of margin carries inherent market risk.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 9b2ed120-598d-5563-8ab0-92c38984511e
  title: Margin Investing Account — recognizing scams targeting this product
  body: 'Because a **Margin Investing Account** allows for increased buying power,
    it is often targeted by sophisticated scammers who promise guaranteed returns
    through ''leveraged strategies.'' It is critical to remember that Solstice Invest
    will never guarantee returns or ignore material risks, as these actions violate
    **Regulation Best Interest**.


    **Common Fraud Patterns**

    Scammers may contact you pretending to be a Solstice Invest specialist, claiming
    you have been pre-approved for a ''special margin rate'' significantly lower than
    our standard 8.5% to lure you into moving funds to an external account. Others
    may use ''spoofing'' to make a call appear as though it is coming from our office,
    urging you to liquidate positions quickly to avoid a fake margin call. Be wary
    of any individual requesting your multi-factor authentication codes or asking
    you to transfer your equity to a third-party ''management'' account to ''optimize''
    your leverage.


    **What Solstice Invest Will Never Do**

    - We will never ask for your password or MFA codes over the phone or via email.

    - We will never request that you transfer funds to a personal account or an unregistered
    third party to ''secure'' your margin equity.

    - We will never promise a guaranteed profit regardless of market volatility.


    **Immediate Action Steps**

    If you suspect fraudulent activity or receive a suspicious request regarding your
    leverage, notify us immediately via secure in-app messaging. We treat fraud reports
    with immediate urgency. To protect your assets, ensure that any state-changing
    action is performed only within a verified secure session. For more on general
    protection, see Margin Investing Account — fraud and unauthorized-activity protection.


    **Disclaimer**: Investing on margin involves the risk of loss in excess of deposits.
    Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 23cc62e3-c0b7-507b-9f6f-faf723d62924
  title: Margin Investing Account — limits, restrictions, and edge cases
  body: 'This guide outlines the operational boundaries and restrictions for the **Margin
    Investing Account**. Support agents should use these figures to determine if a
    customer''s request is compliant with our risk frameworks.


    **Equity Requirements**

    - **Minimum Equity**: To open and maintain a Margin Investing Account, a minimum
    equity of $2000 is required. Accounts falling below this threshold may be subject
    to restrictions or conversion to a cash account.

    - **Maintenance Margin**: Clients must maintain a minimum equity percentage of
    25% of the total market value of the securities in the account. This is the strict
    floor required to avoid a margin call.


    **Cost of Leverage**

    - **Margin Rate**: Borrowing against account equity incurs an annual interest
    rate of 8.5%. This rate is applied to the debit balance and is not a flat fee,
    but a cost of borrowing.


    **Restrictions and Edge Cases**

    - **Margin Calls**: If the account equity falls below the 25% maintenance margin,
    the client must either deposit additional funds or liquidate securities immediately
    to restore the required level. Solstice Invest reserves the right to sell securities
    without notice to meet this requirement.

    - **Settlement Timing**: Standard **Settlement** rules apply to all trades. Buying
    on margin allows for immediate execution, but the underlying transfer of securities
    and cash must still follow SEC and FINRA timing frameworks.

    - **Concentrated Positions**: Certain high-volatility securities may be subject
    to higher maintenance requirements than the standard 25%, depending on current
    risk assessments.


    **Disclaimer**: Returns are never guaranteed. Margin trading increases the potential
    for both gain and loss.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 6b24e39f-709e-5371-81a3-df5b4675f722
  title: Margin Investing Account — cost and charges
  body: '**What is the cost of borrowing money on margin?**

    Using a **Margin Investing Account** involves an annual interest rate of 8.5%
    on the amount of money borrowed from Solstice Invest to purchase securities.


    **Are there commissions for trading stocks in this account?**

    No. Following our philosophy of low-friction investing, we offer $0 stock commissions
    to democratize market access. Fees are only applied to specific administrative
    actions or specialized credit services.


    **What happens if I don''t have enough equity?**

    If your account equity drops below the maintenance margin of 25%, you may receive
    a margin call requiring you to add funds or sell assets. For more details, see
    Margin Investing Account — maintenance margin explained.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: eb27fbc9-fa6b-5286-9b14-c87b00ccdbca
  title: Margin Investing Account — check status or history
  body: 'Use these steps to review your current leverage, available buying power,
    and the history of your margin interest charges.


    **Prerequisites**

    - An active **Margin Investing Account**.

    - A verified secure session (multi-factor authentication completed).


    **Steps to Check Status and History**

    1. **Request Account Summary**: Ask us for your current account summary. We will
    provide your total account value, your current equity, and your total margin debit
    balance.

    2. **Verify Maintenance Level**: Ask us to confirm your current equity percentage.
    We will verify if you are above the required 25% maintenance margin.

    3. **Review Borrowing Costs**: Ask for a summary of interest charges for the current
    billing cycle. We will provide the total amount accrued based on the 8.5% annual
    margin rate.

    4. **Request Transaction History**: Ask for your ledger history for a specific
    date range. We will provide a list of all trades, deposits, withdrawals, and the
    dates when margin interest was debited from your account.


    **How you know it worked**

    - You will receive a detailed breakdown of your equity vs. your loan balance.

    - You will see a specific line item for interest charges confirming the application
    of the 8.5% rate.

    - You will have a confirmed percentage showing your distance from the 25% maintenance
    margin floor.


    **Disclaimer**: All data is provided based on the most recent **Settlement** of
    trades. Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 5c24fe83-db94-5031-8f55-c1b1f19cdd44
  title: Margin Investing Account — a declined or blocked action
  body: '**Symptom**: A customer reports that they are unable to place a new trade
    or withdraw funds from their **Margin Investing Account**, receiving a ''restricted
    action'' or ''insufficient equity'' notification.


    **Likely Causes**

    1. **Maintenance Margin Violation**: The account equity has fallen below the 25%
    maintenance margin threshold.

    2. **Minimum Equity Breach**: The total account equity has dropped below the required
    $2000 minimum.

    3. **Unsettled Funds**: The customer is attempting to withdraw funds that have
    not yet completed the **Settlement** process.

    4. **Security Lock**: A state-changing action was attempted without a verified
    secure session or MFA.


    **What to Check (In Order)**

    1. **Equity Percentage**: Check the current equity as a percentage of the total
    market value. If it is below 25%, the account is restricted from further borrowing.

    2. **Absolute Equity Value**: Check if the total equity is below $2000. If so,
    the account may be blocked from new margin trades.

    3. **Settlement Status**: Check if the funds being moved are from a trade that
    has not yet settled.

    4. **Session Status**: Confirm that the user has completed the required multi-factor
    authentication for the current session.


    **The Fix**

    - **For Margin Violations**: We will notify the customer that they must deposit
    additional cash or sell existing securities to bring the equity back above 25%
    and/or the $2000 minimum.

    - **For Settlement Issues**: We will provide the specific date the funds will
    become available for withdrawal.

    - **For Security Locks**: We will prompt the user to re-authenticate via our secure
    channels.


    **When to Escalate**

    If the equity levels are sufficient and the session is verified but the block
    persists, we will raise a case to our licensed brokerage specialists for a manual
    account review. The customer will be notified of the progress through secure channels.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: ccb29025-e27e-55c3-93db-cc90084d492a
  title: Margin Investing Account — when to switch or upgrade
  body: 'Deciding whether to move from an **Individual Brokerage Account** to a **Margin
    Investing Account** depends on your risk tolerance and available capital.


    **Key Differences**

    - **Buying Power**: An Individual Brokerage Account limits you to the cash you
    have on hand. A **Margin Investing Account** allows you to borrow against your
    equity to increase your market exposure.

    - **Costs**: While both offer $0 stock commissions, the Margin account introduces
    a borrowing cost of 8.5% annually on any funds borrowed.

    - **Requirements**: The Margin account requires a minimum equity of $2000 and
    a continuous maintenance margin of 25%, whereas the basic brokerage account has
    no such leverage-based floors.

    - **Risk**: Individual accounts cannot lose more than the initial investment.
    Margin accounts carry the risk of losses exceeding the original deposit.


    **Who it Suits**

    - **Individual Brokerage Account**: Best for beginners or conservative investors
    who prefer to avoid debt and only invest available cash.

    - **Margin Investing Account**: Best for experienced traders who understand **Regulation
    Best Interest** and wish to use leverage to potentially amplify returns, while
    accepting the associated risks.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: ba937b97-93f7-5329-9f96-45cbaf511d92
  title: Margin Investing Account — comparison vs. alternatives and when not to choose
    it
  body: 'The **Margin Investing Account** is a specialized tool designed for leverage.
    It is fundamentally different from our cash-based offerings in terms of cost,
    risk, and requirement.


    **Comparison vs. Cash Alternatives**

    Unlike the Individual Brokerage Account, the **Margin Investing Account** provides
    the ability to purchase securities using borrowed funds. This leverage can increase
    your buying power but introduces a recurring cost: an annual margin rate of 8.5%.


    **When NOT to Choose This Product**

    - **Low Capital**: If you cannot maintain a minimum equity of $2000, this account
    is not suitable.

    - **Risk Aversion**: If you are uncomfortable with the possibility of losing more
    than your initial investment, you should avoid margin. Because you must maintain
    a 25% maintenance margin, a sharp market drop can trigger a margin call, forcing
    the liquidation of assets at an inopportune time.

    - **Long-Term Passive Holding with No Capital**: If you do not intend to borrow
    and prefer a zero-cost structure, the Individual Brokerage Account is a better
    fit, as it avoids the risks associated with leverage.

    - **Minor Accounts**: This product is not available for custodial accounts; see
    Custodial (UGMA) Brokerage — overview for those needs.


    **Summary of Constraints**

    - **Minimum Equity**: $2000

    - **Maintenance Margin**: 25%

    - **Annual Borrowing Rate**: 8.5%

    - **Commissions**: $0 for stocks


    **Disclaimer**: Solstice Invest operates under SEC and FINRA frameworks. Returns
    are never guaranteed, and margin investing increases the risk of significant loss.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: b68e7501-815e-5532-9914-5e7a587c9801
  title: Margin Investing Account — eligibility and setup
  body: '**Who is eligible to open a Margin Investing Account?**

    This account is available to retail investors who meet our identity verification
    standards and can maintain the minimum equity requirement of $2000. It is designed
    for those who understand the risks of leverage.


    **How do I set up the account?**

    Existing customers can request an upgrade to a **Margin Investing Account**. You
    will need to confirm your financial profile and agree to the margin terms. Once
    verified via a secure session, the leverage features will be activated.


    **What is the first thing I need to deposit?**

    You must ensure your account has at least $2000 in equity to meet the minimum
    opening and maintenance threshold. For a step-by-step on activation, see Margin
    Investing Account — set up and activate.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 81527c2c-5638-5476-a664-5136edea70d5
  title: Margin Investing Account — resolve a common request end-to-end
  body: 'This guide explains how to resolve a margin call by adding funds to your
    **Margin Investing Account** to return to a healthy equity position.


    **Prerequisites**

    - A notification that your account has fallen below the 25% maintenance margin.

    - Access to external funds for deposit.


    **Steps to Resolve a Margin Call**

    1. **Determine the Shortfall**: Ask us for the exact dollar amount required to
    bring your account back to the 25% maintenance margin level. We will provide the
    specific amount needed based on your current holdings.

    2. **Initiate Fund Transfer**: Tell us the amount you wish to deposit and the
    linked bank account to use. We will initiate the transfer and provide a confirmation
    number.

    3. **Verify Deposit**: Ask us to confirm when the funds have been received and
    credited to your account. We will notify you once the balance is updated.

    4. **Confirm Margin Status**: Ask us to recalculate your current equity percentage.
    We will confirm that you are now above the 25% maintenance margin and that any
    trading restrictions have been lifted.


    **How you know it worked**

    - You receive a confirmation that your equity is again above the 25% threshold.

    - Your account status changes from ''Restricted'' or ''Margin Call'' to ''Active''.

    - You are once again able to place trades using your available buying power.


    **Disclaimer**: Please be aware that if a margin call is not resolved promptly,
    Solstice Invest may liquidate securities to cover the shortfall. Returns are never
    guaranteed.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 4265b2d1-a01f-5d3d-9c99-dada7af37b78
  title: Margin Investing Account — a discrepancy in your records or statement
  body: '**Symptom**: A customer believes the margin interest charged to their account
    is incorrect or that their equity percentage is being calculated inaccurately
    on their statement.


    **Likely Causes**

    1. **Interest Accrual Timing**: The customer may be looking at a daily balance
    while interest is calculated and debited on a different cycle.

    2. **Settlement Lag**: A recent trade may not have reached **Settlement**, meaning
    the equity calculation is based on the previous day''s settled positions.

    3. **Misunderstanding the Rate**: The customer may be applying the 8.5% annual
    rate as a monthly or one-time fee rather than an annualized rate.

    4. **Corporate Actions**: A stock split or dividend may have temporarily altered
    the equity percentage before the statement was finalized.


    **What to Check (In Order)**

    1. **Calculation Method**: Verify the debit balance used for the interest charge.
    Confirm that the annual rate of 8.5% was applied correctly to the average daily
    balance.

    2. **Settlement Dates**: Check the dates of the most recent trades. Confirm if
    the discrepancy disappears once the trades reach full **Settlement**.

    3. **Equity Floor**: Check the total market value of securities against the loan
    balance to ensure the 25% maintenance margin is being calculated on the current
    market value, not the purchase price.


    **The Fix**

    - **For Calculation Errors**: If a clerical error is found in the interest charge,
    we will apply a correction credit to the account immediately.

    - **For Educational Gaps**: We will provide a detailed breakdown of how the 8.5%
    annual rate is applied to their specific debit balance to clear up the confusion.

    - **For Settlement Issues**: We will provide the corrected equity figure based
    on the pending settlement dates.


    **When to Escalate**

    If the discrepancy persists after these checks, we will route the inquiry to a
    licensed brokerage specialist for a full audit of the account ledger. The customer
    will be updated on the investigation timeline via secure channels.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 2de44583-f27c-5456-b265-f7bccef9da2a
  title: update_beneficiary tool reference
  body: 'The **update_beneficiary** tool allows the agent to modify the designated
    beneficiaries for a client''s brokerage account. The agent performs this action
    by calling the tool directly within the secure session after the client''s identity
    has been verified.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: object)`


    **Arguments:**

    - **account_id**: The unique identifier of the brokerage account being updated.

    - **beneficiary_details**: An object containing the legal name, relationship,
    and percentage share of the assets assigned to the beneficiary.


    **Effect:**

    This tool updates the legal record of who is entitled to the account assets upon
    the account holder''s passing. Because this is a state-changing action, it requires
    a verified secure session to ensure data privacy and prevent unauthorized modifications.
    This tool supports all account types, including the **Individual Brokerage Account**,
    **Joint Brokerage Account**, and **Custodial (UGMA) Brokerage**.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: solstice_invest
- id: 860cf0e1-2c69-54f2-a720-25feb2f0e54b
  title: When to use set_alerts
  body: 'Solstice Invest provides customizable notifications to help clients monitor
    their portfolios and manage market risks. The **set_alerts** tool is used to create,
    modify, or remove these notifications. Agents should use this tool when a client
    expresses a desire to be notified of specific price movements, account balance
    thresholds, or the completion of a **Settlement**.


    **Procedure for Setting Alerts:**

    1. **Verify Identity**: Ensure the client has completed multi-factor authentication
    for the current session.

    2. **Identify Account**: Call `get_accounts` to resolve the correct **account_id**
    using the client''s provided account details or last-four digits.

    3. **Define Alert Parameters**: Confirm the specific trigger (e.g., a stock hitting
    a certain price) and the preferred notification channel (e.g., secure in-app message).

    4. **Execute Action**: Call the **set_alerts** tool with the resolved **account_id**
    and the defined alert parameters.

    5. **Confirm**: Notify the client that the alert has been successfully established.


    **Guidelines:**

    - Alerts are educational and monitoring tools; agents must not suggest specific
    price alerts as a guarantee of future returns, in accordance with **Regulation
    Best Interest**.

    - Clients may set multiple alerts across different products, such as the **Individual
    Brokerage Account** and the **Margin Investing Account**.

    - If a client is unsure what alerts to set, agents should provide educational
    resources on market volatility and risk management rather than individualized
    investment advice.


    For technical details on the tool''s parameters, refer to the set_alerts tool
    reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: solstice_invest
- id: c551197e-9d9a-5ba0-bd64-e1571a8d5608
  title: set_alerts tool reference
  body: 'The **set_alerts** tool is used by agents to manage a client''s notification
    preferences for their investment accounts. The agent performs this action by calling
    the tool directly during a verified session.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_type: string, trigger_value: any, notification_method:
    string)`


    **Arguments:**

    - **account_id**: The unique identifier of the account for which the alert is
    being set.

    - **alert_type**: The category of the alert (e.g., ''price_movement'', ''balance_threshold'',
    ''trade_settlement'').

    - **trigger_value**: The specific value or condition that triggers the notification.

    - **notification_method**: The delivery channel (e.g., ''push_notification'',
    ''email'', ''in_app_message'').


    **Effect:**

    Creates or updates a trigger in the Solstice Invest monitoring system. When the
    trigger condition is met, the system automatically sends a notification to the
    client via the specified method. This allows clients to stay informed about their
    holdings without manual checking.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: solstice_invest
- id: ccdcbee8-d90d-5317-97b2-38a341f70ded
  title: When to use transfer_funds
  body: 'The **transfer_funds** tool is utilized to move cash between two existing
    Solstice Invest accounts held by the same client or an authorized party. This
    is a low-friction process designed to provide ease of access to capital across
    different investment strategies.


    **Procedure for Transferring Funds:**

    1. **Verify Identity**: Confirm the client''s identity via strict multi-factor
    authentication.

    2. **Resolve Account IDs**: Call `get_accounts` to retrieve the **account_id**
    for both the source account (where funds are leaving) and the destination account
    (where funds are arriving).

    3. **Verify Balance**: Ensure the source account has sufficient available cash
    to cover the transfer amount.

    4. **Execute Transfer**: Call the **transfer_funds** tool specifying the source
    **account_id**, destination **account_id**, and the exact dollar amount.

    5. **Confirm Action**: Provide the client with a confirmation of the transfer
    and the expected timing for the funds to appear in the destination account.


    **Usage Constraints:**

    - **transfer_funds** is for internal movement. For moving money from an external
    bank to Solstice Invest, use `deposit_funds`.

    - For moving assets (securities) from another brokerage, use `initiate_acat_transfer`.

    - Transfers involving a **Margin Investing Account** must be monitored to ensure
    the client maintains the required equity to avoid a margin call.

    - In accordance with our fee philosophy, internal transfers between brokerage
    accounts are generally $0 commission, though specific administrative fees may
    apply depending on the account type.


    For more information on the tool''s technical requirements, see the transfer_funds
    tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: solstice_invest
- id: 700b7e94-0a0a-5aaa-8463-f001bcea43b3
  title: transfer_funds tool reference
  body: 'The **transfer_funds** tool enables the agent to move cash internally between
    a client''s Solstice Invest accounts. The agent performs this action by calling
    the tool directly during a verified secure session.


    **Tool Signature:**

    `transfer_funds(source_account_id: string, destination_account_id: string, amount:
    number, currency: string)`


    **Arguments:**

    - **source_account_id**: The ID of the account from which funds will be debited.

    - **destination_account_id**: The ID of the account where funds will be credited.

    - **amount**: The specific amount of money to be moved (expressed as a positive
    number).

    - **currency**: The currency of the transfer (e.g., ''USD'').


    **Effect:**

    Immediately debits the source account and credits the destination account. This
    is a state-changing action that is recorded in the client''s transaction history
    and reflected in their monthly statements.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: solstice_invest
- id: a031f82b-d00c-58bd-a3f5-11bd705ac498
  title: When to use cancel_order
  body: 'The **cancel_order** tool is used to void a trade request that has been placed
    but not yet executed or settled. Because market conditions change rapidly, Solstice
    Invest provides this tool to give retail investors control over their active orders.


    **Procedure for Canceling an Order:**

    1. **Verify Identity**: Confirm the client''s identity via multi-factor authentication.

    2. **Locate Order**: Call `get_order_status` to find the specific order ID and
    confirm that the order is still in a ''Pending'' or ''Open'' state.

    3. **Confirm Intent**: Clearly verify with the client that they wish to cancel
    the specific trade, including the security and quantity.

    4. **Execute Cancellation**: Call the **cancel_order** tool using the specific
    order ID.

    5. **Final Confirmation**: Notify the client that the order has been canceled
    and that any held funds (buying power) have been released.


    **Important Limitations:**

    - An order cannot be canceled once it has reached **Settlement** or has been fully
    executed in the market.

    - Orders that are ''Filling'' (partially executed) may only be canceled for the
    remaining unfilled portion.

    - Agents must emphasize that canceling an order does not guarantee that a previous
    price point will be available if the client chooses to re-trade.

    - All order cancellations are processed in accordance with SEC and FINRA frameworks
    to ensure fair treatment of all market participants.


    For tool parameters, refer to the cancel_order tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: solstice_invest
- id: f4ea6f05-f49c-5661-8db2-54c7501f5c8d
  title: cancel_order tool reference
  body: 'The **cancel_order** tool is used to terminate a pending trade request before
    it is executed. The agent performs this action by calling the tool directly during
    a verified session.


    **Tool Signature:**

    `cancel_order(order_id: string)`


    **Arguments:**

    - **order_id**: The unique identifier of the trade order to be canceled.


    **Effect:**

    The tool sends a request to the order management system to void the trade. If
    successful, the order status is updated to ''Canceled'', and any cash or securities
    that were earmarked for the trade are returned to the client''s available balance.
    This action is only possible for orders that have not yet been filled.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: solstice_invest
- id: b3b9043d-0f4e-56ef-b8c0-79873db5b69c
  title: When to use get_order_status
  body: "The **get_order_status** tool provides real-time visibility into the lifecycle\
    \ of a trade. Agents should use this tool whenever a client inquires about whether\
    \ a trade has been executed, is still pending, or has failed.\n\n**Procedure for\
    \ Checking Order Status:**\n1. **Verify Identity**: Confirm the client's identity\
    \ through the standard secure verification process.\n2. **Identify Account**:\
    \ Call `get_accounts` to resolve the **account_id** associated with the trade\
    \ in question.\n3. **Retrieve Status**: Call the **get_order_status** tool using\
    \ the **account_id** (to see all recent orders) or a specific order ID if provided\
    \ by the client.\n4. **Communicate Result**: Explain the current status using\
    \ clear, non-jargon terms. Common statuses include:\n    - **Pending**: The order\
    \ is placed but not yet matched.\n    - **Executed/Filled**: The trade has been\
    \ completed.\n    - **Canceled**: The order was voided by the client or system.\n\
    \    - **Rejected**: The order could not be processed (e.g., due to insufficient\
    \ funds).\n5. **Address Next Steps**: If an order is pending, inform the client\
    \ about the typical **Settlement** timeline. If it was rejected, help them resolve\
    \ the underlying issue.\n\n**Compliance Note:**\nAgents must not guarantee the\
    \ timing of an order's execution. All communications must maintain transparency\
    \ regarding market risk and the fact that returns are never guaranteed.\n\nFor\
    \ detailed tool arguments, see the get_order_status tool reference."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: solstice_invest
- id: 8af6acc3-e7ce-5a35-a1f2-832046309358
  title: get_order_status tool reference
  body: 'The **get_order_status** tool allows agents to retrieve the current state
    of a specific trade or a list of recent trades for an account. The agent performs
    this action by calling the tool directly.


    **Tool Signature:**

    `get_order_status(account_id: string, order_id: string = None)`


    **Arguments:**

    - **account_id**: The unique identifier of the brokerage account.

    - **order_id** (Optional): The specific identifier of a single trade. If omitted,
    the tool returns the status of all recent orders for the account.


    **Effect:**

    Returns a read-only data object containing the order''s current status, the time
    it was placed, the security involved, the quantity, and the execution price if
    applicable. This tool is used primarily for information gathering and does not
    change the state of the account.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: solstice_invest
- id: 1f63589c-37f4-5db0-bb13-9e91fcb2e440
  title: When to use deposit_funds
  body: 'The **deposit_funds** tool is used to initiate the movement of cash from
    an external linked financial institution into a Solstice Invest brokerage account.
    This is the primary method for clients to fund their investment activity.


    **Procedure for Depositing Funds:**

    1. **Verify Identity**: Confirm the client''s identity using multi-factor authentication.

    2. **Resolve Account ID**: Call `get_accounts` to identify the destination account
    (e.g., an **Individual Brokerage Account** or **Custodial (UGMA) Brokerage**).

    3. **Confirm Source**: Verify that the external bank account is already linked
    and verified in the client''s profile.

    4. **Specify Amount**: Confirm the exact dollar amount the client wishes to deposit.

    5. **Execute Deposit**: Call the **deposit_funds** tool with the **account_id**,
    the external source identifier, and the amount.

    6. **Provide Timeline**: Inform the client of the expected window for funds to
    become available for trading, noting that this depends on standard **Settlement**
    and banking timelines.


    **Policy Guidelines:**

    - In line with our fee philosophy, Solstice Invest offers $0 commissions on stock
    trades, and depositing funds is a low-friction, typically no-cost action to democratize
    market access.

    - Agents must not provide tax advice regarding the source of deposited funds;
    such inquiries should be referred to the client''s legal or tax professional.

    - For clients using a **Margin Investing Account**, agents should remind them
    that deposits increase their account equity, which may affect their buying power.


    For technical details, see the deposit_funds tool reference.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: solstice_invest
