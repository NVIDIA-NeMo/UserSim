    \ investing environment. Stock trades are executed with a **commission of $0**.\
    \ For options trading, a fee of **$0.65 per options contract** is applied to each\
    \ trade. These fees are deducted from the account equity at the time of trade\
    \ execution.\n\n**Account Transfers and Closures**\nClients may move their assets\
    \ to another institution. In the event of a full account transfer out, a **fee\
    \ of $75** will be applied to the account to cover administrative costs. \n\n\
    **Joint Obligations**\nAll account holders are equally responsible for maintaining\
    \ the account in compliance with SEC and FINRA frameworks. Any joint owner may\
    \ initiate a trade or withdrawal, and Solstice Invest is not responsible for disputes\
    \ between account holders regarding the use of funds.\n\n**Changes and Termination**\n\
    Solstice Invest reserves the right to modify these terms to maintain platform\
    \ stability or meet regulatory requirements. Notice of such changes will be provided\
    \ via secure channels. This agreement ends upon the closing of the account by\
    \ the joint owners or by Solstice Invest due to a breach of terms or regulatory\
    \ necessity.\n\n**Standard of Care**\nIn accordance with **Regulation Best Interest**,\
    \ we act in the best interest of our retail customers. However, we do not provide\
    \ individualized tax or legal advice, and we do not guarantee investment returns."
  domain: brokerage_investing
