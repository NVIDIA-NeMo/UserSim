- id: 9c117065-98af-5061-a7da-89f885e46498
  title: Individual Brokerage Account — risk disclosures
  body: 'This document provides essential risk disclosures regarding the **Individual
    Brokerage Account**. All clients must review these terms to understand the inherent
    risks of market participation.


    **Market Risk**

    Investing in securities involves the risk of loss. The value of your investments
    can fluctuate based on market conditions, and you may lose some or all of your
    principal. Solstice Invest strictly prohibits guaranteeing returns on any product.


    **Margin Risk**

    Borrowing money through **Margin** to purchase securities increases your buying
    power but also increases your potential for loss. When using margin, you are subject
    to a margin rate of **8.5%**. If the value of your collateral drops, you may be
    subject to a margin call, requiring you to deposit additional funds or sell securities
    immediately to cover the debt.


    **Settlement Risk**

    Users must be aware of **Settlement** timing. The process by which a trade is
    finalized can affect the availability of funds for withdrawal or further trading.
    Trading on unsettled funds may lead to regulatory violations or account restrictions.


    **Regulatory Standard**

    Solstice Invest operates under SEC and FINRA frameworks. In accordance with **Regulation
    Best Interest**, we provide suitable product recommendations but do not offer
    individualized tax or legal advice. Clients are encouraged to consult with a professional
    tax advisor for specific financial planning.


    **Disclaimer**: Returns are never guaranteed. All investments carry material risk.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: f68543d0-5945-59d6-be0c-ac37ce942215
  title: Individual Brokerage Account — how rates are tiered and applied
  body: 'The **Individual Brokerage Account** utilizes a flat-rate pricing model for
    borrowing to ensure clarity and fairness for all retail investors.


    **Margin Rate**

    *   **Standard Rate**: 8.5%


    This single rate of **8.5%** applies to all accounts regardless of the total balance
    or the amount of equity leveraged. There are no tiered discounts or premium surcharges
    based on account size.


    **Application and Calculation**

    Interest is calculated daily on the outstanding debit balance and is applied to
    the account on a monthly basis. The rate is quoted as an annual percentage. This
    rate may be adjusted in response to changes in the federal funds rate or broader
    market conditions; clients will be notified of any changes via secure in-app messaging.


    **Commission Rate**

    *   **Stock Trades**: $0


    As part of our commitment to democratize market access, stock commissions are
    set at **$0** for all users.'
