- id: 869e034a-6916-5e6b-88bb-8d40221cf878
  title: Individual Brokerage Account — limits, restrictions, and edge cases
  body: "This guide provides support agents with the necessary technical boundaries\
    \ and restrictions associated with the Individual Brokerage Account to ensure\
    \ accurate client communication.\n\n**Trading and Cost Constraints**\nWhile the\
    \ account offers $0 stock commissions to democratize access, this applies specifically\
    \ to standard equity trades. Other administrative actions may incur fees. For\
    \ example, if a client chooses to move their entire portfolio to another institution,\
    \ an account transfer out fee of $75 applies. Agents must clearly state this fee\
    \ before initiating the process.\n\n**Credit and Margin Boundaries**\nFor clients\
    \ utilizing credit services, the Individual Brokerage Account carries a margin\
    \ rate of 8.5%. This is the cost for borrowing money from Solstice Invest to purchase\
    \ securities using account equity as collateral. Agents should remind clients\
    \ that using margin increases potential risk and that returns are not guaranteed.\n\
    \n**Operational Restrictions**\n*   **Settlement**: All trades must undergo the\
    \ **Settlement** process (the finalization of the trade and transfer of cash/securities)\
    \ before funds are available for withdrawal. \n*   **Verification**: No state-changing\
    \ actions, such as fund transfers or sensitive account modifications, can be performed\
    \ without a verified secure session and strict multi-factor authentication.\n\
    *   **Regulation Best Interest**: All recommendations provided to the client must\
    \ adhere to **Regulation Best Interest**, ensuring the client's interests come\
    \ first. We provide educational resources but cannot offer individualized tax\
    \ or legal advice.\n\n**Edge Cases**\nIn cases where a client's equity falls below\
    \ required thresholds while using margin, the account may be subject to a margin\
    \ call. Agents should refer to the internal margin policy for specific liquidation\
    \ timelines."
