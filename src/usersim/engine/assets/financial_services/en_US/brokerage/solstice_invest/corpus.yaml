- id: 93e7eb68-dc13-5ffa-bd15-7f6fb49f9383
  title: Joint Brokerage Account — eligibility and setup
  body: '**Who is eligible to open a Joint Brokerage Account?**

    Any two eligible adults who wish to invest collaboratively can open this account.
    Both parties must pass our strict identity verification and multi-factor authentication
    process.


    **What information is needed to set up the account?**

    Both the primary and joint owners must provide valid government-issued identification
    and tax identification numbers to ensure regulatory compliance with SEC and FINRA
    frameworks.


    **Can I add a third person to my Joint Brokerage Account?**

    Our current joint account structure is limited to two owners. If you require a
    different ownership structure, please consult with a licensed specialist via our
    secure messaging.


    **How long does the setup take?**

    Once all parties have completed the identity verification and secure session requirements,
    the account is typically activated immediately. For more details on the process,
    see Joint Brokerage Account — set up and activate.'
