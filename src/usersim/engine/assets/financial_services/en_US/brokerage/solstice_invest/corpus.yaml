    | Requirement | Documentation Needed | Outcome |

    | :--- | :--- | :--- |

    | **Identity Verification** | Valid Gov-issued Photo ID | Required for all applicants
    |

    | **Financial Suitability** | Proof of Income / Net Worth Statement | Required
    to approve margin leverage |

    | **Account Funding** | Transfer of cash or securities | Minimum equity of $2000
    must be met |

    | **Tax Residency** | Completed Form W-9 or W-8BEN | Required for regulatory compliance
    |

    | **Risk Acknowledgement** | Signed Margin Agreement | Required to activate borrowing
    features |


    **Note:** Failure to provide any of the above will result in the application being
