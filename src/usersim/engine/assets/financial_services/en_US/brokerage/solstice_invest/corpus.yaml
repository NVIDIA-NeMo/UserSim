  mentions_tools: []
  institution_id: solstice_invest
- id: 499ef7b1-73e6-5b50-97b3-7a20b0038b4e
  title: Individual Brokerage Account — a declined or blocked action
  body: '**Symptom**

    You attempted to place a trade, transfer funds, or modify account settings, but
    the action was declined or blocked by the system.


    **Likely Causes**

    1.  **Verification Failure**: The session was not fully verified via multi-factor
    authentication, which is required for all state-changing actions.

    2.  **Insufficient Funds/Settlement**: You attempted to use funds from a trade
    that has not yet reached **Settlement**.

    3.  **Margin Limits**: You attempted to purchase securities using margin that
    exceeds your available account equity.

    4.  **Regulatory Block**: The action may conflict with **Regulation Best Interest**
    or other SEC/FINRA frameworks.


    **What to Check**

    *   **Security Status**: Check if your current session is verified. If you have
    been inactive, you may need to re-authenticate.

    *   **Available Cash**: Review your ''Available to Trade'' balance rather than
    your total account value to ensure funds have settled.

    *   **Margin Balance**: If you are borrowing at the 8.5% margin rate, check if
    your equity has fallen below the required maintenance threshold.


    **Resolution**

    *   **For Verification**: Re-run the identity verification process to establish
    a secure session.

    *   **For Settlement**: Wait for the standard settlement window to close before
    attempting the transfer or trade again.

    *   **For Margin**: Deposit additional funds or sell existing securities to increase
    your equity.


    **Escalation**

    If the action remains blocked after checking the above, we will raise a case with
    our licensed specialists. You will receive a notification through secure in-app
    messaging once the specialist has reviewed the regulatory or technical block and
    provided a resolution.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 06fdf130-3688-58b3-8286-a17f8273ae74
  title: Individual Brokerage Account — when to switch or upgrade
  body: 'Determining whether to move from an Individual Brokerage Account depends
    on your evolving financial goals and the need for additional features.


    **When to stay with the Individual Brokerage Account**

    This account is best for solo investors who prioritize cost-efficiency and a simple,
    $0 stock commission structure for building a personal portfolio.


    **When to switch to a Joint Brokerage Account**

    Switch to a Joint Brokerage Account if you are investing with a partner. This
    provides collaborative access and added support for options trading that the individual
    account does not prioritize.


    **When to upgrade to a Margin Investing Account**

    If you are an experienced trader looking to leverage your equity for increased
    buying power, a Margin Investing Account is the appropriate tool. While you can
    use margin in an individual account at a rate of 8.5%, the dedicated Margin Investing
    Account is designed specifically for high-leverage strategies.


    **When to open a Custodial (UGMA) Brokerage**

    If your goal is to build long-term wealth for a minor, this is the only suitable
    choice to ensure the account is legally structured for a child.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: c98a938c-ba53-5b0c-a899-220ffed1eadf
  title: Individual Brokerage Account — comparison vs. alternatives and when not to
    choose it
  body: 'The Individual Brokerage Account is designed as the foundational tool for
    solo investors. To ensure you choose the right product, review how it compares
    to other options and the scenarios where it may not be the best fit.


    **Core Value Proposition**

    This account competes on transparency and low cost, featuring $0 stock commissions.
    It is intended for those who want a direct, low-friction way to enter the market
    without the complexity of collaborative or leveraged-first accounts.


    **Comparison with Alternatives**

    *   **vs. Joint Accounts**: While the Individual account offers total control
    to one person, Joint accounts are necessary for partners. Joint accounts also
    provide specific support for options trading.

    *   **vs. Custodial Accounts**: Individual accounts are for adults. If you are
    investing for a minor, the Custodial (UGMA) Brokerage is the required vehicle
    for legal compliance.

    *   **vs. Specialized Margin Accounts**: While the Individual account allows for
    borrowing at a margin rate of 8.5%, sophisticated traders seeking maximum leverage
    and advanced tools should opt for the Margin Investing Account.


    **When NOT to Choose This Account**

    1.  **Collaborative Investing**: Do not choose this if you need a partner to have
    legal ownership and access to the assets.

    2.  **Minor Beneficiaries**: Do not choose this if the assets are intended for
    a child; use a custodial account instead.

    3.  **Complex Tax/Legal Strategies**: Because we provide educational resources
    but never individualized tax or legal advice, users requiring highly specific
    legal structuring should consult a professional before opening a standard brokerage
    account.


    **Cost Summary**

    *   **Stock Trades**: $0 commission.

    *   **Margin Rate**: 8.5%.

    *   **Account Transfer Out**: $75 fee.'
