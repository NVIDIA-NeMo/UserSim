- id: baee0613-2082-5b0b-a8c1-fd689425d9ee
  title: Institution-wide fees and charges
  body: 'At Solstice Invest, we are committed to **low-friction investing**. To democratize
    market access, we offer **$0 stock commissions** across all brokerage account
    types. This means you will not pay a commission fee for standard stock trades.


    While most trading is commission-free, certain costs apply to maintain platform
    stability and ensure regulatory compliance:


    *   **Administrative Actions**: Specific account maintenance or specialized requests
    may incur administrative fees. These vary based on the action performed.

    *   **Specialized Credit Services**: Fees and interest rates apply to credit-based
    services, such as those found in the **Margin Investing Account**.

    *   **Product-Specific Fees**: Certain account types may have unique fee structures
    (e.g., custodial maintenance). Please refer to the specific fee schedule for your
    account type for detailed costs.


    **Disclaimer**: All fees are subject to change. Returns on investments are never
    guaranteed, and all investing involves risk of loss.'
