- id: 505a2426-db11-5b51-bdaa-3ad1fdf2d29e
  title: Custodial (UGMA) Brokerage — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational constraints and edge cases associated with the Custodial (UGMA) Brokerage.


    **Core Financial Limits**

    - **Minimum Opening Deposit:** $0. There is no financial barrier to opening this
    account.

    - **Stock Trade Commissions:** $0. This allows for low-friction portfolio building
    for the minor.

    - **Account Maintenance Fee:** $0. No recurring costs are applied to maintain
    the account.


    **Key Restrictions**

    - **Ownership:** Assets are legally the property of the minor, though the custodian
    manages the account. Withdrawals must be made for the benefit of the minor.

    - **Margin Trading:** This product does not support borrowing against equity.
    If a customer seeks leverage, they must be referred to a Margin Investing Account,
    provided they meet the eligibility requirements.

    - **Trading Scope:** Access is limited to suitable product recommendations and
    educational resources. We do not provide individualized tax or legal advice regarding
    the UGMA structure.


    **Edge Cases and Handling**

    - **Age of Majority:** When the minor reaches the legal age of majority (which
    varies by state), the account must be transferred to the minor. Agents should
    guide the customer through the legal transfer process at this time.

    - **Custodian Changes:** Changing the adult custodian requires strict identity
    verification and legal documentation to ensure the security of the minor''s assets.

    - **Settlement Timing:** All trades are subject to standard SEC and FINRA settlement
    timelines. Funds are not available for withdrawal until the trade has reached
    full **Settlement**.


    **Compliance Reminder:** Always ensure that the customer understands that returns
    are never guaranteed and that all market investments carry inherent risks.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: product_sheet
  source_authority: official
