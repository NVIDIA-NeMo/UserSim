- id: f91ea6c6-303e-5576-b7b0-fefd3d5699df
  title: Joint Brokerage Account — interest rate / APY schedule
  body: 'The **Joint Brokerage Account** is primarily a vehicle for investing in securities
    rather than a savings product. As such, there is no tiered interest rate or APY
    applied to the uninvested cash balances held within this account.


    A flat interest rate of 0% applies to all cash balances in the Joint Brokerage
    Account. This rate is constant across all balance levels and is not subject to
    promotional increases or tiers. Because this is a brokerage account, we encourage
    clients to utilize their cash to purchase securities to seek growth, keeping in
    mind that all market investments carry risk and returns are never guaranteed.'
