- id: 2f689f47-a1e5-561f-b9f3-3c7fbdbd4908
  title: Individual Brokerage Account — access or login problems
  body: '**Symptom**: "I cannot log into my account," or "My multi-factor authentication
    code isn''t arriving."


    **Likely Causes**

    - Incorrect login credentials.

    - Outdated app version preventing secure session establishment.

    - Network latency delaying the delivery of MFA codes.

    - Account lock due to multiple failed login attempts.


    **Resolution Steps**

    1. **Verify Credentials**: Double-check that your username and password are correct.
    Remember that passwords are case-sensitive.

    2. **Check Network**: Ensure you are not on a restrictive public Wi-Fi. Switch
    to cellular data or a trusted home network and try again.

    3. **Update the App**: Ensure you are using the latest version of the Solstice
    Invest app to maintain compatibility with our security frameworks.

    4. **Request a New Code**: If the MFA code has not arrived after 60 seconds, request
    a new one. Ensure your signal strength is sufficient.


    **When to Escalate**

    If you have attempted the above steps and still cannot access your account, or
    if you believe your account has been compromised, notify us immediately.


    **Our Escalation Process**

    - We will initiate a secure identity verification process involving secondary
    documentation.

    - A security specialist will review the login logs to identify the cause of the
    block.

    - Once identity is confirmed, we will reset your access and provide a temporary
    secure entry path.

    - You will receive a confirmation via your verified backup email once access is
    restored.


    *Disclaimer: Solstice Invest prioritizes data privacy and security. We will never
    ask for your password during the recovery process.*'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
