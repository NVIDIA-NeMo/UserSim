- id: 47bb5620-8d13-5a24-86dc-2a999d94ae97
  title: Joint Brokerage Account — account security best practices
  body: "Maintaining the security of your **Joint Brokerage Account** is a shared\
    \ responsibility. Because these accounts allow multiple individuals to execute\
    \ trades and transfer funds, they can be targets for sophisticated social engineering\
    \ scams. \n\n**Common Fraud Patterns**\nBe wary of 'urgent' requests from someone\
    \ claiming to be a Solstice Invest representative asking you to move funds to\
    \ a 'safe' account or requesting your login credentials to 'verify' your joint\
    \ ownership. We will never ask for your password or multi-factor authentication\
    \ (MFA) codes via phone or email.\n\n**Our Security Standards**\nTo protect your\
    \ assets, Solstice Invest requires **strict multi-factor authentication** and\
    \ identity verification before any state-changing action or fund transfer occurs.\
    \ No sensitive account modifications will be processed without a verified secure\
    \ session.\n\n**Best Practices for Joint Owners**\n1. **Unique Credentials**:\
    \ Each joint owner should maintain their own secure login and password; never\
    \ share a single set of credentials.\n2. **Alert Monitoring**: Enable real-time\
    \ notifications for all trades and withdrawals so both partners are aware of account\
    \ activity.\n3. **Verification**: If you receive a request for a large transfer\
    \ from your partner that seems unusual, verify the request through a separate,\
    \ trusted communication channel before proceeding.\n\n**Immediate Action**\nIf\
    \ you suspect unauthorized activity or notice a trade you did not approve, notify\
    \ us immediately. We treat fraud reports with immediate urgency. Following our\
    \ standardized investigation timeline, we will work to resolve the dispute fairly\
    \ and keep you notified of our progress through secure channels.\n\n*Disclaimer:\
    \ While we employ rigorous security measures, all investing involves market risk\
    \ and returns are not guaranteed.*"
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 05a60610-c549-591c-ae48-7a57857890e1
  title: Joint Brokerage Account — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms governing
    your **Joint Brokerage Account**. By maintaining an account with Solstice Invest,
    all joint owners agree to be bound by these terms.


    **Right to Modify**

    Solstice Invest reserves the right to change fees, service terms, or account requirements
    to maintain platform stability and regulatory compliance. This includes, but is
    not limited to, updates to the **$0 stock commission** structure, the **$0.65
    options contract fee**, or the **$75 account transfer out fee**.


    **Notice Period**

    We will provide notice of any material changes to the terms of service at least
    30 calendar days before the change takes effect. Notification will be delivered
    via secure in-app messaging or the email address associated with the primary account
    holder.


    **Acceptance of Changes**

    Continued use of the account after the effective date of a change constitutes
    acceptance of the new terms by all joint owners. If any owner disagrees with the
    modified terms, the only recourse is to close the account.


    **Account Closure and Transfers**

    Upon request to close the account and transfer assets to another institution,
    a **$75 account transfer out fee** will be applied to the account balance. If
    the balance is insufficient to cover this fee, we reserve the right to liquidate
    securities to satisfy the obligation.


    **Regulatory Compliance**

    All changes are made in accordance with SEC and FINRA frameworks. We adhere to
    **Regulation Best Interest**, ensuring that any changes to our product offerings
    continue to serve the best interests of our retail customers.


    *Disclaimer: Returns are never guaranteed. Solstice Invest does not provide individualized
    tax or legal advice.*'
