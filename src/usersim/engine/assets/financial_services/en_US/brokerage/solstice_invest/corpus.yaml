- id: 5ffed494-918d-5947-9e89-8c736ee37beb
  title: Joint Brokerage Account — regulatory disclosures
  body: 'This disclosure outlines the regulatory framework and obligations associated
    with the **Joint Brokerage Account** at Solstice Invest.


    **Standard of Care**:

    Solstice Invest operates under SEC and FINRA frameworks. In accordance with **Regulation
    Best Interest**, we are required to act in the best interest of our retail customers.
    We provide educational resources and product recommendations suitable for your
    profile; however, we do not offer individualized tax or legal advice. It is the
    responsibility of the account holders to understand the tax implications of joint
    ownership.


    **Market Risk and Returns**:

    All investing involves risk. We maintain a strict standard of care that prohibits
    guaranteeing returns. Market volatility can lead to the loss of principal. No
    communication from Solstice Invest should be interpreted as a guarantee of profit.


    **Fees and Costs**:

    The account is subject to the following costs: **$0 stock commissions**, a fee
    of **$0.65 per options contract**, and an **account transfer out fee of $75**.
    These fees are applied to maintain platform stability and regulatory compliance.


    **Settlement and Liquidity**:

    Users must be aware of **Settlement**, the process by which a trade is finalized
    and the transfer of securities and cash is completed. Funds are not immediately
    available for withdrawal or further trading until settlement is complete.


    **Security and Privacy**:

    To protect account integrity, strict multi-factor authentication and identity
    verification are required before any state-changing action or fund transfer. Solstice
    Invest adheres to strict data privacy and fair treatment standards to ensure the
    security of all joint account holders.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: disclosure
  source_authority: official
