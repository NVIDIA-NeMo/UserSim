- id: f59e95a5-4b25-5bcf-b957-ae76cbca627a
  title: Margin Investing Account — fraud and unauthorized-activity protection
  body: 'Because a **Margin Investing Account** provides increased buying power through
    borrowed funds, it is a high-value target for bad actors. We employ strict multi-factor
    authentication and identity verification for all state-changing actions to protect
    your equity.


    **Common Fraud Patterns**

    Fraudsters may attempt to trick you into revealing your secure session credentials
    or transferring funds to ''external clearing accounts'' to ''unlock'' higher margin
    limits. Be wary of any urgent requests to move money or change account security
    settings via email or text. Solstice Invest will never ask you for your password
    or MFA codes over the phone.


    **Unauthorized Activity**

    Unauthorized trades made using your margin can lead to rapid losses and potential
    margin calls. If you notice any trade or fund transfer that you did not authorize,
    you must notify us immediately. We treat fraud reports with immediate urgency
    and follow a standardized investigation timeline to resolve disputes fairly. You
    will be notified of our progress through secure channels throughout the resolution
    process.


    **Your Protection**

    To maintain the highest level of security, no sensitive account modifications
    occur without a verified secure session. If you suspect your account has been
    compromised, the first action you should take is to notify us to freeze the account.
    This prevents further unauthorized borrowing or liquidation of your assets.


    **Disclaimer:** All investing involves risk. Returns are never guaranteed, and
    using margin increases the potential for both gain and loss.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 0c338696-8a36-546c-ad91-32fa9d21646d
  title: Margin Investing Account — account agreement
  body: 'This agreement governs the use of the **Margin Investing Account** provided
    by Solstice Invest. By opening this account, you agree to the following binding
    terms:


    **1. Credit Extension and Interest**

    Solstice Invest agrees to extend credit for the purchase of securities. In exchange,
    the client agrees to pay interest on all borrowed funds at a rate of 8.5%. This
    rate is applied to the debit balance of the account.


    **2. Equity Obligations**

    To activate and maintain the account, the client must adhere to strict equity
    requirements. A **minimum equity** of $2000 is required to establish the account.
    Furthermore, the client must maintain a **maintenance margin** of 25% of the total
    market value of the securities held in the account.


    **3. Solstice Invest Rights (Liquidation)**

    If the account equity falls below the 25% maintenance margin, Solstice Invest
    reserves the right to issue a margin call. If the client fails to deposit additional
    funds or securities to meet the requirement, Solstice Invest may liquidate securities
    in the account without prior notice to cover the deficiency.


    **4. Changes to Terms**

    Solstice Invest may modify interest rates or margin requirements to maintain platform
    stability and regulatory compliance. Clients will be notified of such changes
    through secure channels.


    **5. Termination**

    Either party may terminate this agreement. Upon closure, the client is obligated
    to repay all outstanding margin debits and accrued interest immediately. The account
    will not be closed until the balance is settled to $0.


    **Disclaimer:** Returns are never guaranteed. Margin trading involves significant
    risk of loss.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 20e3990f-4205-5a21-b969-36ec2989a066
  title: Margin Investing Account — who it is best for and common use cases
  body: 'The **Margin Investing Account** is an advanced tool designed for experienced
    investors who wish to leverage their existing equity to increase their total buying
    power in the market.


    **Who It Is Best For**

    This account is ideal for sophisticated traders who understand the mechanics of
    borrowing against securities and are comfortable with the increased risk associated
    with leverage. It is not recommended for beginners or those with a low risk tolerance.


    **Common Use Cases**

    * **Increased Buying Power:** Investors can purchase more securities than they
    could with cash alone, potentially amplifying returns on successful trades.

    * **Strategic Liquidity:** Accessing cash for other opportunities without needing
    to sell existing positions and trigger immediate tax events.

    * **Short-Term Hedging:** Using leverage to take specific tactical positions in
    the market.


    **Key Financial Terms**

    * **Margin Rate:** Borrowed funds are subject to an interest rate of 8.5%.

    * **Minimum Equity:** An initial equity of $2000 is required to open the account.

    * **Maintenance Margin:** You must keep your equity at or above 25% of the total
    market value of your securities to avoid a margin call.


    **Core Benefits**

    We offer $0 stock commissions to democratize market access, ensuring that the
    cost of trading does not hinder your strategy. However, users must be mindful
    that borrowed funds are not free and the 8.5% rate applies to all margin debits.


    **Disclaimer:** Returns are never guaranteed. Margin investing can lead to losses
    that exceed your initial investment.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 1e037691-4f03-5dd3-84e7-6aa49cd4567f
  title: Margin Investing Account — minimum equity explained
  body: '**What is the minimum equity required for a Margin Investing Account?**

    To open and activate a **Margin Investing Account**, you must have a minimum equity
    of $2000. This ensures that the account has a sufficient baseline of assets to
    support the risks associated with borrowing.


    **Can I open the account with less than $2000?**

    No. The $2000 minimum equity is a strict requirement for this specific product.
    If you do not currently meet this threshold, you may consider starting with an
    Individual Brokerage Account — overview and upgrading once your equity grows.


    **Does the minimum equity count toward my buying power?**

    Yes, your equity serves as the collateral for your margin loan. While the $2000
    is the minimum required to start, your total buying power will depend on the specific
    securities you hold and the current margin rules.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 19714287-4e7e-5e8f-bd8c-bfb0b81fa10d
  title: Margin Investing Account — cancel, close, or downgrade
  body: 'If you no longer wish to use leverage or want to move your assets to a cash-based
    account, follow these steps to cancel or downgrade your **Margin Investing Account**.


    **Requirements Before Starting**

    * Your account must have no outstanding margin debit balance.

    * All pending trades must have reached **Settlement** (the process by which a
    trade is finalized and the transfer of securities and cash is completed).


    **Steps to Close or Downgrade**

    1. **Settle Outstanding Debits:** If you have borrowed funds, you must either
    deposit cash or sell securities to bring your margin balance to $0. We will confirm
    once the debit is cleared.

    2. **Request the Change:** Tell us whether you wish to close the account entirely
    or downgrade to a cash account (such as an Individual Brokerage Account — overview).

    3. **Verify Identity:** We will perform a security check via multi-factor authentication
    to verify the request.

    4. **Confirm Final Balance:** We will provide a final statement showing that all
    interest at the 8.5% rate has been paid and no balances remain.

    5. **Execution:** We will process the closure or downgrade. You will receive a
    confirmation message once the account status has been updated.


    **How You Know It Worked**

    Your account dashboard will no longer show ''Margin Buying Power,'' and your account
    type will reflect either ''Closed'' or ''Cash/Individual,'' depending on your
    choice.


    **Disclaimer:** Once an account is closed, any remaining fractional shares may
    be liquidated. Returns on remaining assets are never guaranteed.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: de76980e-b47d-5578-86a7-a27d4e823180
  title: Margin Investing Account — an unexpected charge or amount
  body: '**Symptom:** You notice a deduction from your account balance or an increase
    in your debit balance that you did not expect.


    **Likely Causes**

    * **Accrued Margin Interest:** Interest on borrowed funds is calculated based
    on the 8.5% margin rate and is typically charged periodically.

    * **Maintenance Margin Shortfall:** If your equity fell below 25%, you may have
    been subject to automatic liquidation of assets to cover the gap.

    * **Administrative Fees:** While stock commissions are $0, specific administrative
    actions may incur fees to maintain platform stability.


    **What to Check**

    1. **Review Your Margin Balance:** Check if you have a debit balance. If you have
    borrowed money, the 8.5% interest is the most likely cause.

    2. **Check Equity Percentage:** Verify if your account equity dropped below the
    25% maintenance margin threshold. If it did, look for ''Sell'' orders you did
    not place; these are likely liquidation trades.

    3. **Inspect Transaction History:** Look for labels such as ''Margin Interest''
    or ''Admin Fee.''


    **Resolution**

    * **For Interest Charges:** These are standard for all borrowed funds. No further
    action is needed unless you wish to pay down the loan to stop further interest
    accrual.

    * **For Liquidation Questions:** If you believe a liquidation occurred in error,
    tell us. We will review the equity levels at the time of the trade.

    * **For Unidentified Charges:** Tell us the specific date and amount. We will
    initiate an investigation. If the charge is found to be fraudulent, we follow
    a standardized investigation timeline to resolve the dispute fairly.


    **Escalation**

    If the charge remains unexplained, we will route your request to a licensed brokerage
    specialist for a detailed audit of your account ledger. You will be notified of
    the outcome via secure messaging.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: f90cf23a-2e7b-557d-8424-332a2373c4a7
  title: Margin Investing Account — required documentation
  body: 'To open a **Margin Investing Account**, applicants must provide specific
    documentation to satisfy SEC and FINRA frameworks. The following requirements
