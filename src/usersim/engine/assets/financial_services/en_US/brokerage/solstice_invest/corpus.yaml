- id: 7728fbfa-844d-58e1-9fe5-c8b00a69789d
  title: Custodial (UGMA) Brokerage — fraud and unauthorized-activity protection
  body: 'Protecting the future of the next generation is our priority. Because a Custodial
    (UGMA) Brokerage account involves assets held for a minor, it can be a target
    for specific social engineering scams. Fraudsters may attempt to impersonate the
    custodian or the minor to initiate unauthorized transfers.


    **Fraud Patterns to Recognize**

    Be wary of urgent requests via email or text claiming there is a ''tax emergency''
    or a ''regulatory hold'' on the minor''s account that requires you to move funds
    to a ''safe'' external account. Solstice Invest will never ask you to transfer
    assets to an unverified third party to ''protect'' them from fraud.


    **Our Security Standards**

    To prevent unauthorized activity, we enforce **strict multi-factor authentication**
    and identity verification for every state-changing action. No sensitive account
    modifications, such as changing the linked bank account or updating custodian
    contact information, will occur without a verified secure session.


    **Immediate Action for Unauthorized Activity**

    If you notice a trade or withdrawal you did not authorize, notify us immediately.
    We treat fraud reports with immediate urgency. Once reported, we follow a standardized
    investigation timeline to resolve the dispute fairly, and you will be notified
    of our progress through secure in-app messaging or phone calls.


    **What We Will Never Ask For**

    We will never ask for your full password or multi-factor authentication codes
    over the phone or via email. If someone claiming to be from Solstice Invest asks
    for these, terminate the communication and alert us through our secure channels.


    **Disclaimer**: While we provide robust security frameworks, market risks remain.
    Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
