- id: 880bf1fa-4fe8-516d-874a-f6a20212d6dc
  title: Joint Brokerage Account — vs. a typical competitor offering
  body: 'When comparing the Joint Brokerage Account to traditional brokerage offerings,
    the primary differences lie in the cost structure and the accessibility of advanced
    tools.


    **Cost Comparison**

    * **Stock Trading**: Many competitors still charge per-trade commissions. Solstice
    Invest offers **$0 stock commissions** to democratize market access.

    * **Options Trading**: While some firms offer ''free'' options, they often bake
    the cost into wider spreads. We are transparent, charging a flat **$0.65 per options
    contract**.

    * **Account Portability**: Like most industry standards, we charge a **fee of
    $75** for transferring an account out to another firm.


    **Key Trade-offs**

    * **Solstice Invest**: Best for retail investors and partners who value a modern,
    transparent interface, $0 stock costs, and a commitment to **Regulation Best Interest**.

    * **Typical Competitors**: May be better for institutional-level traders requiring
    complex legacy reporting or those who prefer physical branch access.


    Our model prioritizes low-friction investing and clear, standardized fees over
    hidden costs.'
