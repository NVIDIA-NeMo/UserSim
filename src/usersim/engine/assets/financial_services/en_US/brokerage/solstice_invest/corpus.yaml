- id: 5e5a8ab8-10f0-5ae9-b8b0-69f3f87d8fdc
  title: Individual Brokerage Account — overview
  body: "The **Individual Brokerage Account** is the foundational account for solo\
    \ investors seeking low-cost market entry. Designed for transparency and ease\
    \ of access, this account allows you to build a diversified portfolio of securities\
    \ while minimizing the costs typically associated with trading.\n\n**Core Features\
    \ and Costs**\nAt Solstice Invest, we believe in democratizing market access.\
    \ To support this, we offer a **commission for stock trades of $0**, ensuring\
    \ that your capital goes toward your investments rather than transaction fees.\
    \ \n\nFor investors seeking increased buying power, you may utilize **Margin**\
    \ (borrowing money from Solstice Invest using your account equity as collateral).\
    \ The current **margin rate is 8.5%**. Please be aware that using margin increases\
    \ your potential for both gain and loss.\n\n**Administrative Fees**\nWhile we\
    \ strive for low-friction investing, certain administrative actions incur costs.\
    \ If you choose to move your assets to another institution, an **account transfer\
    \ out fee of $75** will be applied.\n\n**Our Commitment**\nWe operate under **Regulation\
    \ Best Interest**, meaning we are required to act in your best interest when making\
    \ recommendations. We provide educational resources to empower your journey, but\
    \ we do not provide individualized tax or legal advice. \n\n**Important Risk Warning**\n\
    Investing involves risk of loss. Returns are **never guaranteed**, and all investors\
    \ should be mindful of market volatility and **Settlement** timing (the process\
    \ by which a trade is finalized and the transfer of securities and cash is completed).\n\
    \n**Disclaimer**: Solstice Invest is a member of FINRA and SEC regulated. All\
    \ investments carry risk, and past performance is not indicative of future results."
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 66c620f2-51da-5bc3-aa41-9c8d85354da8
  title: Individual Brokerage Account — commission stock trade explained
  body: '**Do I have to pay a fee every time I buy or sell a stock?**

    No. To make investing more accessible, the **commission for stock trades** in
    your **Individual Brokerage Account** is **$0**. You can execute your trades without
    worrying about per-trade costs.


    **Are there any other costs associated with trading?**

    While stock commissions are **$0**, other specialized services or administrative
    actions may carry fees. For a full list of applicable charges, please refer to
    the **Individual Brokerage Account — fee schedule**.


    **Does the $0 commission apply to all account types?**

    This fee structure is a core part of our effort to democratize market access across
    our retail offerings, including the **Individual Brokerage Account**. We encourage
    you to review the specific details of your account type to confirm all applicable
    terms.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: faq
  source_authority: official
