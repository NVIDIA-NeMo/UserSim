- id: af9c99d6-5a13-5ff0-b3a1-fad97094d019
  title: Custodial (UGMA) Brokerage — a declined or blocked action
  body: '**Symptom:** You attempted to make a trade, transfer funds, or update account
    details, but the action was declined or blocked by the system.


    **Likely Causes**

    - **Verification Failure:** The session was not fully verified via multi-factor
    authentication, which is required for all state-changing actions.

    - **Settlement Lag:** You are attempting to trade or withdraw funds from a recent
    sale that has not yet reached **Settlement**.

    - **Regulatory Restriction:** The trade involves a security that is not suitable
    for a custodial account under our standard of care.

    - **Documentation Gap:** Required identity verification for the custodian or the
    minor is expired or missing.


    **What to Check (In Order)**

    1. **Session Status:** Confirm that you have successfully completed all identity
    verification prompts for the current session.

    2. **Funds Availability:** Check your ''available to trade'' balance versus your
    ''total account value'' to see if funds are locked in the settlement process.

    3. **Trade Suitability:** Review if the security you are attempting to purchase
    is permitted in a custodial account.


    **The Fix**

    - If the issue is verification, please re-authenticate your identity using your
    registered MFA device.

    - If the issue is settlement, wait for the standard SEC settlement period to conclude
    before attempting the action again.

    - If the issue is documentation, provide the requested identity verification documents
    via our secure channel.


    **When to Escalate**

    If you have verified your identity and the funds have settled, but the action
    is still blocked, we will raise a formal case with our compliance team. We will
    investigate the restriction and provide a resolution update via secure messaging
    within our standard investigation timeline.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: cf23b6d8-9f33-5817-8430-999df4380e9b
  title: Custodial (UGMA) Brokerage — when to switch or upgrade
  body: 'A Custodial (UGMA) Brokerage is ideal for building long-term wealth for a
    minor. However, there are specific milestones where switching or upgrading is
    necessary:


    **When to Switch to an Individual Brokerage Account**

    - **Age of Majority:** Once the minor reaches the legal age of majority, the assets
    must legally transition to them. At this point, the account should be moved to
    an Individual Brokerage Account.

    - **Direct Control:** If the original intent was not a gift for a minor but a
    personal investment, an Individual Brokerage Account is the correct choice.


    **When to Upgrade to a Margin Account**

    - **Advanced Strategies:** If the account holder (now an adult) wishes to leverage
    their equity for increased buying power, they can upgrade to a Margin Investing
    Account. Note that the Custodial (UGMA) Brokerage has a $0 commission structure
    and $0 maintenance fees, whereas margin accounts involve borrowing costs.


    **Comparison Summary**

    - **Custodial (UGMA):** Best for minors; $0 minimum deposit; $0 stock commissions.

    - **Individual:** Best for adults; allows for full personal control.

    - **Margin:** Best for experienced traders; allows borrowing against equity.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 5dfc91da-fb53-548e-aded-b664158deb7b
  title: Custodial (UGMA) Brokerage — comparison vs. alternatives and when not to
    choose it
  body: 'The Custodial (UGMA) Brokerage is a specialized tool designed for the long-term
    benefit of a minor. To ensure this is the right choice for your goals, compare
    it against our other brokerage offerings.


    **Comparison with Alternatives**

    - **Vs. Individual Brokerage Account:** While both offer $0 stock commissions,
    the Individual Brokerage Account is for a single adult''s use. The Custodial account
    is a legal arrangement where an adult manages assets that belong to a minor.

    - **Vs. Joint Brokerage Account:** Joint accounts are for partners sharing ownership
    and control. Custodial accounts have a clear distinction: the custodian manages,
    but the minor owns.

    - **Vs. Margin Investing Account:** The Margin Investing Account is for experienced
    traders to increase buying power through borrowing. Custodial accounts prohibit
    this type of risk to protect the minor''s assets.


    **When NOT to Choose This Product**

    - **If you want full control:** Assets in a Custodial (UGMA) Brokerage belong
    to the minor. Once the minor reaches the age of majority, the assets are theirs
    to control, not yours.

    - **If you need leverage:** This account does not allow for **Margin** borrowing.

    - **If you need tax/legal customization:** We provide educational resources, but
    we do not offer individualized tax or legal advice. If you require a complex trust
    structure, a standard UGMA account may not be sufficient.


    **Financial Highlights**

    - **Minimum Opening Deposit:** $0

    - **Stock Trade Commissions:** $0

    - **Account Maintenance Fee:** $0


    **Standard Warning:** All investments carry risk. Returns are never guaranteed,
    and the value of the account may fluctuate based on market conditions.'
