- id: cbd3f806-cca4-562f-8165-9e37258af752
  title: Margin Investing Account — a failed or pending action
  body: '**Symptom**: You attempted to open a **Margin Investing Account** or place
    a trade using leverage, but the action is marked as ''failed'' or ''pending.''


    **Likely Causes**

    *   **Insufficient Equity**: Your account balance is below the **Minimum Equity**
    threshold of $2000.

    *   **Verification Gap**: Your identity verification or multi-factor authentication
    session has expired.

    *   **Maintenance Breach**: A pending trade would push your equity below the 25%
    **Maintenance Margin** requirement.


    **Resolution Steps**

    1. **Check Balance**: Verify that your total account equity is at least $2000.
    If it is lower, the account cannot be activated.

    2. **Re-verify Identity**: If the action is pending due to security, re-initiate
    the verification process via a secure session.

    3. **Calculate Margin**: Ensure that the purchase you are attempting does not
    violate the 25% **Maintenance Margin** rule. If the trade is too large for your
    current collateral, reduce the trade size.


    **Escalation Process**

    If you have confirmed the above and the action still fails, tell us to review
    the block. We will escalate the matter to a licensed brokerage specialist. You
    will receive a status update via secure in-app messaging once the specialist has
    reviewed the account restriction. Our specialists will determine if the block
    is due to a regulatory hold or a technical settlement issue.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
