- id: 06f91c58-5b95-5da4-a1cc-68ff3696212f
  title: Joint Brokerage Account — getting started walkthrough
  body: 'This guide is intended for support agents assisting customers in the setup
    and initial funding of a **Joint Brokerage Account**. This product is designed
    for collaborative investing for partners and offers added support for options
    trading.


    **Step 1: Identity Verification**

    Ensure both applicants provide valid government-issued identification. Per our
    security policy, **strict multi-factor authentication** and identity verification
    are required for both parties before the account can be opened.


    **Step 2: Account Configuration**

    Confirm the joint ownership structure. Once the account is active, the clients
    will have access to the following cost structure:

    - **Stock Commissions**: $0 per trade

    - **Options Contracts**: $0.65 fee per contract

    - **Account Transfer Out**: $75 fee (applies only when moving the full account
    to another firm)


    **Step 3: Funding the Account**

    Guide the customer to link their external bank account. Remind them that for any
    fund transfer, a verified secure session is mandatory.


    **Step 4: Trading Education**

    Since this account supports options trading, remind the customer that while we
    provide educational resources and suitable product recommendations, we follow
    **Regulation Best Interest** and never offer individualized tax or legal advice.


    **Step 5: Confirmation of Settlement**

    Explain the concept of **Settlement** to the customer: this is the process by
    which their trade is finalized and the transfer of securities and cash is completed.
    Ensure they understand that returns are never guaranteed and that all market investments
    carry inherent risk.


    **Agent Note**: If the customer requests complex brokerage advice or specialized
    tax strategies, escalate the request to a licensed specialist. Generalists should
    stick to the product''s foundational features and fee transparency.'
