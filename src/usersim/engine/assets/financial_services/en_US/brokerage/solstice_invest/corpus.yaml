- id: 3aa8e89d-e2b3-5bab-8261-721be2443729
  title: Margin Investing Account — vs. a typical competitor offering
  body: 'When comparing the **Margin Investing Account** at Solstice Invest to typical
    industry competitors, the primary differences lie in cost transparency and access.


    **Solstice Invest**

    * **Commission:** $0 stock commissions for all trades.

    * **Margin Rate:** A clear, flat rate of 8.5% on borrowed funds.

    * **Minimums:** $2000 minimum equity required to start.

    * **Maintenance:** A strict 25% maintenance margin requirement.


    **Typical Competitors**

    * **Commission:** May charge per-trade fees or hide costs in a wider bid-ask spread.

    * **Margin Rate:** Often use tiered pricing based on the size of the loan, which
    can make the effective cost harder to calculate for smaller accounts.

    * **Minimums:** Some competitors have lower entry points but offset this with
    higher interest rates for smaller balances.


    **Which to Choose?**

    * **Choose Solstice Invest** if you value a professional, transparent cost structure
    with $0 commissions and a predictable 8.5% rate.

    * **Choose a Competitor** if you have a very small starting balance (under $2000)
    and cannot meet our minimum equity requirement, though you may pay more in commissions
    or variable interest.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 9995ae5d-86c1-59e7-9b39-ed69ba405a31
  title: Margin Investing Account — risk disclosures
  body: 'This disclosure provides essential information regarding the risks associated
    with the **Margin Investing Account**. Please read this carefully before utilizing
    leverage.


    **Leverage Risk**

    **Margin** is the process of borrowing money from Solstice Invest to purchase
    securities, using the account equity as collateral. While this can increase potential
    gains, it equally increases potential losses. You can lose more money than you
    originally deposited.


    **Margin Calls and Liquidation**

    To ensure platform stability and regulatory compliance, you must maintain a **maintenance
    margin** of 25%. If your equity falls below this 25% threshold, Solstice Invest
    will issue a margin call. You will be required to deposit additional funds or
    securities immediately. If you do not, Solstice Invest may liquidate any assets
    in your account without further notice to cover the loan.


    **Cost of Borrowing**

    Borrowing is not free. A margin rate of 8.5% is applied to all debit balances.
    This interest cost accrues regardless of whether the securities you purchased
    increase or decrease in value.


    **Regulatory Standards**

    We operate under SEC and FINRA frameworks and follow **Regulation Best Interest**,
    which requires us to act in the best interest of the retail customer. However,
    this does not eliminate market risk. Solstice Invest never guarantees returns
    on any investment strategy.


    **Settlement Timing**

    All trades are subject to **Settlement**, the process by which a trade is finalized
    and the transfer of securities and cash is completed. Margin availability may
    be impacted by settlement timelines.


    **Disclaimer:** All investing involves risk. Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 73c624ae-1404-5f7a-876e-d9635c28e146
  title: Margin Investing Account — how rates are tiered and applied
  body: 'The **Margin Investing Account** utilizes a simplified, flat-rate pricing
    model to ensure transparency for all our clients.


    **Applicable Rate**

    * **Annual Margin Rate:** 8.5%


    **Application and Calculation**

    This single rate of 8.5% applies to all borrowed funds regardless of the total
    balance or the length of the loan. Interest is calculated daily based on the closing
    debit balance of the account and is typically posted to the account on a monthly
    basis.


    **What Changes the Rate?**

    While the current rate is 8.5%, Solstice Invest may adjust this rate in response
    to changes in the federal funds rate or other broader market benchmarks to maintain
    regulatory compliance and platform stability. Any change to the rate will be communicated
    to clients via secure in-app messaging prior to taking effect.


    **Cost Offset**

    To keep your overall investing costs low, Solstice Invest continues to provide
    $0 stock commissions for all trades made within the account.'
  domain: brokerage_investing
  product_category: margin_account
  document_type: rate_sheet
  source_authority: official
