- id: 923f5ac2-44ed-59cf-9de9-4ced42b2d445
  title: Custodial (UGMA) Brokerage — an unexpected charge or amount
  body: '**Symptom**: You notice a deduction from the account balance or a charge
    on your statement that you do not recognize.


    **Likely Causes**

    * **Administrative Fees**: While stock trades are free, certain specific administrative
    actions (such as specialized legal document processing) may carry a fee.

    * **Settlement Timing**: A trade may have been executed, but the cash has not
    yet settled, creating a discrepancy between ''available'' and ''current'' balances.

    * **Unauthorized Activity**: A potential security breach or fraudulent trade.


    **What to Check**

    1. **Review the Transaction History**: Check if the charge is listed as a ''Commission''
    or an ''Admin Fee.'' Note that the **commission for stock trades is $0**, so any
    trade commission would be an error.

    2. **Verify Maintenance Fees**: Confirm that no maintenance fees were charged.
    For this account, the **account maintenance fee is $0**.

    3. **Check Settlement Status**: Look at your recent trades to see if they have
    completed the **Settlement** process.


    **The Fix**

    If the charge is an error (e.g., a commission was charged despite the $0 rate),
    tell us the transaction ID. We will review the trade and apply a correction to
    the balance immediately.


    **When to Escalate**

    If the charge is the result of a trade you did not authorize, this is treated
    as fraud. We will immediately raise a high-priority investigation case, follow
    our standardized investigation timeline, and keep you updated through secure channels
    until the dispute is resolved.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: troubleshooting
