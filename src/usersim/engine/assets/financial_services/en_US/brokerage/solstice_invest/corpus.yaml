- id: 7609f355-18eb-54fb-984b-68b22b548ca9
  title: Individual Brokerage Account — getting started walkthrough
  body: 'This guide is for support agents assisting new clients in the onboarding
    process for the Individual Brokerage Account, the foundational account for solo
    investors seeking low-cost market entry.


    **Onboarding Sequence**

    1. **Identity Verification**: Ensure the client completes the strict multi-factor
    authentication and identity verification process. No account can be opened without
    a verified secure session.

    2. **Account Funding**: Guide the client to link their bank account. Remind them
    that funds must undergo **Settlement** (the process by which a trade is finalized
    and the transfer of securities and cash is completed) before they can be used
    for certain trade types.

    3. **First Trade**: Explain that the account features **$0 stock commissions**
    to democratize market access.


    **Key Product Figures for Client Communication**

    - **Trading Costs**: $0 for stock commissions.

    - **Credit Costs**: For clients seeking increased buying power, the **margin rate
    is 8.5%**. Ensure they understand that **Margin** involves borrowing money from
    Solstice Invest using account equity as collateral.

    - **Exit Costs**: If the client asks about moving assets later, the **account
    transfer out fee is $75**.


    **Compliance Reminders**

    When assisting the client, agents must adhere to **Regulation Best Interest**.
    You may provide educational resources on how the platform works, but you are strictly
    prohibited from:

    - Offering individualized tax or legal advice.

    - Guaranteeing any specific rate of return.

    - Ignoring or downplaying material market risks.


    **Support Escalation**

    Generalists should handle the initial setup. If the client has complex brokerage
    inquiries regarding specific securities or advanced tax implications, escalate
    the request to a licensed specialist via the internal ticketing system.


    *Disclaimer: All communications must emphasize that returns are never guaranteed.*'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: product_sheet
