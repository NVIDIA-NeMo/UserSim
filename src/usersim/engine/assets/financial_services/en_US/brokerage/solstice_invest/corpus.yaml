  title: Individual Brokerage Account — interest rate / APY schedule
  body: 'The following rate applies to the **Individual Brokerage Account** for clients
    utilizing credit services:


    **Margin Interest Rate: 8.5%**


    This is a flat annual rate applied to all balances borrowed under a **Margin**
    agreement, regardless of the account balance. Interest is calculated based on
    the daily balance of the margin loan and is debited from the account on a monthly
    basis.


    This rate may change based on fluctuations in the federal funds rate or adjustments
    to Solstice Invest''s internal cost of capital. In the event of a rate change,
    clients will be notified via secure in-app messaging. This rate applies to the
    borrowing of funds to purchase securities, using the account equity as collateral.'
