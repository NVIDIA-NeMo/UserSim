- id: a559e58d-241d-5526-887f-ccc8cf778eeb
  title: Custodial (UGMA) Brokerage — recognizing scams targeting this product
  body: "Because the Custodial (UGMA) Brokerage is designed for minors, scammers often\
    \ target the adults managing these accounts by exploiting the emotional desire\
    \ to secure a child's financial future. \n\n**Common Scam Patterns**\nOne frequent\
    \ tactic involves 'guaranteed return' schemes. A fraudster may contact you claiming\
    \ to have a 'risk-free' investment opportunity that will exponentially grow the\
    \ child's savings. Please remember that Solstice Invest strictly prohibits guaranteeing\
    \ returns, as all market investments carry material risk. Another common scam\
    \ is the 'Urgent Account Update,' where a bad actor poses as a regulatory body\
    \ or Solstice Invest staff, claiming the custodial account will be frozen unless\
    \ you provide your full login credentials or transfer funds to a 'secure' external\
    \ holding account.\n\n**What We Will Never Ask**\nSolstice Invest will **never**\
    \ ask you to reveal your password, multi-factor authentication (MFA) codes, or\
    \ your full Social Security number via an unsecured channel. We will never ask\
    \ you to move funds out of your Custodial (UGMA) Brokerage into a third-party\
    \ account to 'verify' your identity or 'unlock' a higher tier of service.\n\n\
    **Immediate Action Steps**\nIf you notice any unauthorized activity or receive\
    \ a suspicious request:\n1. **Stop all communication** with the suspicious party\
    \ immediately.\n2. **Notify us** through our secure in-app messaging or verified\
    \ phone lines to report the fraud.\n3. **Review your recent activity** to ensure\
    \ no unauthorized transfers were initiated.\n\nWe treat fraud reports with immediate\
    \ urgency. Once a report is filed, we follow a standardized investigation timeline\
    \ to resolve the dispute fairly, and you will be notified of our progress through\
    \ secure channels throughout the resolution process.\n\n**Disclaimer:** Returns\
    \ are never guaranteed, and all investments involve risk of loss."
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
