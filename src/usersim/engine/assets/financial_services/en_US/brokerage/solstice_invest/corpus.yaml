- id: 368f4ffc-b79d-52c2-9291-0a9c16dc43d3
  title: Individual Brokerage Account — eligibility and setup
  body: '**Who is eligible to open an Individual Brokerage Account?**

    This account is designed for individual retail investors. You must meet our standard
    identity verification and multi-factor authentication requirements to open an
    account.


    **How do I get started with my account?**

    Once you provide the required identity documentation and verify your identity,
    we will activate your account. For a detailed step-by-step, see Individual Brokerage
    Account — set up and activate.


    **Can I add another person to my Individual account later?**

    No. By design, this is a solo account. If you decide you want to invest collaboratively
    with a partner, you would need to open a Joint Brokerage Account.


    **Is there a minimum deposit required to start trading?**

    We aim to democratize market access; however, you must ensure you have enough
    funds to cover your first trade. All stock trades are $0 commission, reducing
    the barrier to entry.'
