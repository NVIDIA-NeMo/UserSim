- id: c520716b-e683-58be-a2d8-1ec1ca8c0035
  title: Individual Brokerage Account — a discrepancy in your records or statement
  body: '**Symptom**

    A customer reports that their account statement shows a balance, trade price,
    or fee that does not match their own records.


    **Likely Causes**

    1.  **Settlement Timing**: The customer is looking at a ''real-time'' balance,
    but the statement reflects the balance at the end of the **Settlement** period.

    2.  **Margin Interest**: The customer may have overlooked the 8.5% margin rate
    being applied to their borrowed balance, resulting in a lower cash balance than
    expected.

    3.  **Administrative Fees**: The customer may have performed an action, such as
    a transfer, that triggered the $75 account transfer out fee.

    4.  **Commission Misunderstanding**: While stock trades are $0 commission, other
    specialized services may have costs.


    **What to Check (Agent Workflow)**

    *   **Trade Dates vs. Settlement Dates**: Compare the date the trade was placed
    with the date it reached **Settlement**. Explain to the customer that funds are
    not finalized until settlement is complete.

    *   **Margin Usage**: Check if the account has a margin balance. Calculate the
    interest based on the 8.5% rate to see if the discrepancy matches the accrued
    interest.

    *   **Fee History**: Review the account for any $75 charges associated with account
    transfers.


    **Resolution**

    *   **For Timing Issues**: Provide the customer with the exact settlement date
    for the pending transaction.

    *   **For Fee/Interest Issues**: Itemize the specific charges (e.g., the 8.5%
    margin interest or the $75 transfer fee) and explain when they were applied.


    **Escalation**

    If the discrepancy cannot be explained by settlement timing, margin rates, or
    stated fees, the agent must raise a formal dispute. We will begin a standardized
    investigation and notify the customer of the progress through secure channels.
    If a clerical error is found, a correction will be applied to the account balance
    immediately.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 7f33da81-0540-5370-9a5b-8c8433c64bcf
  title: Joint Brokerage Account — overview
  body: 'The **Joint Brokerage Account** is designed for partners, spouses, or family
    members who wish to invest collaboratively. This account provides a shared pool
    of capital and combined access to market opportunities, making it an ideal choice
    for couples managing a household portfolio or partners building long-term wealth
    together.


    At Solstice Invest, we prioritize **low-friction investing**. We believe in democratizing
    market access, which is why we offer **$0 stock commissions** for all trades within
    this account. For those looking to employ more advanced strategies, the Joint
    Brokerage Account also supports options trading with a clear, transparent cost
    of **$0.65 per options contract**.


    While we strive to make moving your assets easy, please note that if you choose
    to move your entire portfolio to another institution, an **account transfer out
    fee of $75** will be applied to the transaction.


    **Key Product Highlights:**

    - **Collaborative Access**: Multiple owners can manage and contribute to the same
    portfolio.

    - **Zero-Cost Stocks**: Pay **$0** in commissions for stock trades.

    - **Options Ready**: Access options markets for a fee of **$0.65 per contract**.

    - **Transparent Costs**: A flat **$75** fee applies only when transferring the
    account out.


    **Important Considerations**:

    Investing involves risk. In accordance with **Regulation Best Interest**, we provide
    these tools to help you invest suitably, but we never guarantee returns. All investments
    are subject to market risk, and you may lose some or all of your principal. Please
    be aware of **Settlement** timings, as the transfer of securities and cash is
    not instantaneous.


    *Disclaimer: Solstice Invest does not provide individualized tax or legal advice.
    Please consult with a professional regarding the legal implications of joint account
    ownership.*'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
- id: 85c89f18-9e64-5a03-acd8-a91797cc1a05
  title: Joint Brokerage Account — commission stock trade explained
  body: '**What is the cost to trade stocks in my Joint Brokerage Account?**

    Solstice Invest offers **$0 stock commissions**. This means you will not be charged
    a fee by us to buy or sell stocks within your account, as part of our commitment
    to low-friction investing.


    **Are there any other trading fees I should know about?**

    While stock trades are free, other specialized instruments have costs. For example,
    trading options incurs a fee of **$0.65 per options contract**. For a full list
    of costs, please refer to the Joint Brokerage Account — fee schedule.


    **Does the $0 commission apply to all joint account holders?**

    Yes, the **$0 stock commission** is a standard feature of the Joint Brokerage
    Account and applies to all eligible users of the product regardless of their trading
    volume.'
