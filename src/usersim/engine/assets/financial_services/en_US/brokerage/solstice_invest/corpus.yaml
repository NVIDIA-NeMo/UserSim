- id: ddb3353e-4904-5ace-9b54-2d8f5541441c
  title: Individual Brokerage Account — a failed or pending action
  body: '**Symptom**: You attempted to fund your account, place a trade, or transfer
    assets, but the action is marked as "Pending" or "Failed."


    **Likely Causes**

    *   **Verification Gap**: Your identity verification may be incomplete or expired,
    preventing state-changing actions.

    *   **Insufficient Funds**: For trades, you may not have enough settled cash or
    available **Margin** to cover the cost.

    *   **Settlement Timing**: You may be attempting to move funds that have not yet
    completed **Settlement** (the process by which the transfer of securities and
    cash is finalized).

    *   **Security Trigger**: A lack of a verified secure session or a multi-factor
    authentication failure may have blocked the request.


    **What to Check**

    1. **Check Notification Center**: Look for secure messages from Solstice Invest
    regarding missing documentation or verification requests.

    2. **Review Available Balance**: Confirm that the funds you are using are "Settled"
    and not "Pending."

    3. **Verify Session**: Ensure you have successfully completed the most recent
    multi-factor authentication prompt.


    **Resolution**

    If the action is simply pending due to **Settlement**, no further action is needed;
    the trade or transfer will finalize according to standard market timelines. If
    the action failed due to verification, provide the requested identification documents
    to us in the chat, and we will update your status.


    **Escalation**

    If the cause is not apparent after these checks, we will raise a formal investigation
    case. You will be notified of the progress through secure channels. For complex
    brokerage inquiries, we will route your request to a licensed specialist for resolution.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: solstice_invest
