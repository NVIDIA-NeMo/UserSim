- id: 2ce41c02-eb66-5b9b-95f0-a84072a2a432
  title: Custodial (UGMA) Brokerage — check status or history
  body: 'To review the current standing, holdings, and transaction history of your
    Custodial (UGMA) Brokerage, follow these steps:


    **Prerequisites**

    - You must be the registered custodian of the account.

    - You must have completed multi-factor authentication to establish a verified
    secure session.


    **Step-by-Step Process**

    1. **Request Account Overview:** Ask us for the current status and total balance
    of the custodial account. We will provide the current account value and a list
    of active holdings.

    2. **Request Transaction History:** Tell us the specific time frame you wish to
    review (e.g., ''the last 30 days'' or ''since the account was opened'').

    3. **Review Trade Details:** We will provide a list of all executed trades, including
    the date, the security traded, the quantity, and the price. You will see that
    the commission for these stock trades is $0.

    4. **Verify Settlement Status:** For any recent trades, ask us for the **Settlement**
    status. We will confirm whether the transfer of securities and cash is completed
    or still pending based on SEC timelines.

    5. **Confirm Statement Availability:** Ask us to provide the most recent monthly
    or quarterly statement. We will send this document through our secure messaging
    channel.


    **How you know it worked**

    You will have a verified list of all transactions and a current valuation of the
    assets held for the minor, delivered via a secure, encrypted channel.'
  domain: brokerage_investing
  product_category: custodial_brokerage
  document_type: how_to_guide
  source_authority: official
