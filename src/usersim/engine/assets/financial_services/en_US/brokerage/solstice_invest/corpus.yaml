- id: 3fff2274-327a-5c33-bf64-39b565755a6b
  title: Joint Brokerage Account — set up and activate
  body: 'Setting up a **Joint Brokerage Account** requires the cooperation of both
    parties to ensure security and regulatory compliance. Follow these steps to activate
    your collaborative investing account:


    1. **Provide Applicant Details**: Both the primary and secondary account holders
    must provide their full legal names, dates of birth, Social Security numbers,
    and current residential addresses.

    2. **Submit Identity Verification**: Both parties must provide a clear copy of
    a government-issued photo ID (such as a passport or driver''s license) to satisfy
    our identity verification requirements.

    3. **Confirm Joint Ownership Terms**: Both applicants must review and agree to
    the joint ownership terms, acknowledging that all assets in the account are owned
    collectively.

    4. **Complete Security Setup**: Each user must establish their own secure login
    and complete **multi-factor authentication** setup. This ensures that all state-changing
    actions are performed in a verified secure session.

    5. **Fund the Account**: Once the account is approved, initiate your first transfer
    of cash or securities. You can do this by providing the routing and account numbers
    of your external funding source.


    **How you know it worked**:

    Once these steps are complete, we will send a secure notification to both parties
    confirming the account is active. You will then see the Joint Brokerage Account
    listed in your account dashboard with a balance reflecting your initial deposit.'
  domain: brokerage_investing
  product_category: joint_brokerage
  document_type: how_to_guide
