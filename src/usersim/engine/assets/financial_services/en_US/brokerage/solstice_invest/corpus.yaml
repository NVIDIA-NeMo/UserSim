- id: 638a651d-4deb-5f02-87f6-1a55462bc38b
  title: Custodial (UGMA) Brokerage — account agreement
  body: 'This account agreement governs the relationship between Solstice Invest and
    the Custodian for the benefit of the minor in a Custodial (UGMA) Brokerage account.


    **Financial Obligations and Fees**

    Solstice Invest provides a low-friction investing experience. The **commission
    for stock trades is $0**, and there is **no account maintenance fee ($0)**. We
    require a **minimum opening deposit of $0**, allowing for immediate account accessibility.


    **Custodian Responsibilities**

    The Custodian agrees to manage the account in the best interest of the minor,
    adhering to the Uniform Gifts to Minors Act (UGMA). All assets in the account
    are the legal property of the minor; the Custodian is authorized to make investment
    decisions until the minor reaches the age of majority as defined by state law.


    **Settlement and Trading**

    All trades are subject to standard **Settlement** periods. The process by which
    a trade is finalized and the transfer of securities and cash is completed must
    be observed before funds can be withdrawn from the account.


    **Modification and Termination**

    Solstice Invest reserves the right to modify these terms to maintain platform
    stability or ensure regulatory compliance. Clients will be notified of any material
    changes via secure channels. This agreement ends when the minor reaches the age
    of majority and the account is transferred to their name, or upon the formal closing
    of the account by the Custodian.


    **Standard of Care**

    Following **Regulation Best Interest**, we provide educational resources and suitable
    product recommendations. However, we do not offer individualized tax or legal
    advice regarding the UGMA structure.'
