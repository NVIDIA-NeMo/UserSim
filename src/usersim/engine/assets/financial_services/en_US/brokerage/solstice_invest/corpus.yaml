- id: 5ee0da9a-9dd4-5b1b-ba5f-59bebde6e7ea
  title: Individual Brokerage Account — recognizing scams targeting this product
  body: 'As you compare the Individual Brokerage Account against other market options,
    it is important to remain vigilant against fraudulent activity. Scammers often
    target retail investors by promising guaranteed returns or exclusive ''inside''
    tips to lure them into transferring assets or sharing credentials.


    **Common Scam Patterns**

    One frequent tactic involves imposters claiming to be Solstice Invest representatives
    who pressure you to move your funds to a ''secure'' external account or demand
    an immediate payment to ''unlock'' a high-yield opportunity. Be wary of any individual
    guaranteeing a specific profit margin; per our standard of care, Solstice Invest
    never guarantees returns, as all market investments carry inherent risk.


    **What We Will Never Ask**

    To protect your assets, please remember that Solstice Invest will **never** ask
    you for your password, your multi-factor authentication (MFA) codes, or request
    that you transfer funds to a third-party individual to ''verify'' your account.
    Any request for sensitive account modifications will only occur within a verified
    secure session.


    **Immediate Action Steps**

    If you encounter a suspicious communication or notice an unauthorized trade, notify
    us immediately. We treat fraud reports with immediate urgency. To limit your liability
    and ensure a fair resolution, report any suspected unauthorized activity as soon
    as it is discovered. Once reported, we follow a standardized investigation timeline
    and will notify you of the progress through secure channels.


    **Disclaimer**: Investment involves risk of loss. Returns are never guaranteed.'
  domain: brokerage_investing
  product_category: individual_brokerage
  document_type: security_advisory
  source_authority: official
