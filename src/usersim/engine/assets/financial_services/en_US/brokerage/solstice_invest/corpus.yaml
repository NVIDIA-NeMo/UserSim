- id: 55d22b5b-3e4f-5430-a0e7-7e2b63f900d5
  title: Individual Brokerage Account — cost and charges
  body: '**How much does it cost to trade stocks?**

    We believe in low-friction investing. The Individual Brokerage Account features
    $0 stock commissions, allowing you to enter the market without per-trade costs.


    **Are there any fees for moving my account to another broker?**

    Yes. To maintain platform stability and regulatory compliance, there is an account
    transfer out fee of $75 for moving your assets to another institution.


    **Is there a cost to borrow money for investing?**

    If you choose to use margin to increase your buying power, a margin rate of 8.5%
    applies to the borrowed amount. For more details on how this works, please see
    Individual Brokerage Account — margin rate explained.


    **Are there monthly maintenance fees?**

    No, we prioritize cost-efficiency for our retail investors. Fees are only applied
    to specific administrative actions or specialized credit services.'
