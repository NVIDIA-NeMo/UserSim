  title: ESG Impact Portfolio — set up and activate
  body: 'Activating the ESG Impact Portfolio involves a rigorous alignment process
    to ensure the strategy matches your financial objectives and ethical priorities.
    Please follow these steps to begin:


    1. Provide your current financial statements and a confirmation of available liquid
    assets to verify you meet the minimum investment of $250,000.

    2. Complete our comprehensive risk profiling process. This is the process of evaluating
    your ability and willingness to lose principal in exchange for potential returns;
    we will provide you with a documented risk profile for your review and signature.

    3. Define your specific ESG priorities (e.g., carbon neutrality, board diversity,
    or social justice) so we may tailor the asset allocation within the strategy''s
    framework.

    4. Review and sign the Investment Advisory Agreement, which formalizes our fiduciary
    duty to you and confirms the non-negotiable annual advisory fee of 0.9%.

    5. Instruct us to initiate the transfer of funds. We will execute the movement
    of assets using mandatory multi-factor authentication (MFA) and identity verification
    to ensure security.


    Once the funds are received and the portfolio is constructed, we will provide
    a formal confirmation notice and your initial asset allocation report, signifying
    that your ESG Impact Portfolio is active.'
