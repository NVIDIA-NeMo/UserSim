- id: 901781ed-8916-5a6a-8652-3303a631011a
  title: Private Wealth Advisory — comparison vs. alternatives and when not to choose
    it
  body: 'Private Wealth Advisory is designed as the pinnacle of our service offerings,
    providing bespoke strategies for ultra-high-net-worth individuals. However, it
    is not the optimal choice for every investor.


    **Comparing Our Tiers**

    * **Private Wealth Advisory**: Best for those with a minimum investment of $1000000
    who require highly customized, high-touch management. The annual advisory fee
    is 0.75%.

    * **Tax-Managed Portfolio**: A superior choice for high-income earners whose primary
    objective is the aggressive minimization of tax liabilities rather than bespoke
    asset customization.

    * **ESG Impact Portfolio**: The ideal selection for investors whose primary driver
    is aligning financial growth with environmental, social, and governance impact.

    * **Managed Portfolio**: Our foundational solution, best for those seeking professional
    management with a balanced risk approach and lower entry thresholds.


    **When Not to Choose Private Wealth Advisory**

    We advise against this tier if:

    1. **Capital Threshold Not Met**: You cannot commit the minimum investment of
    $1000000. Our other portfolios provide excellent fiduciary management at lower
    entry points.

    2. **Preference for Simplicity**: You prefer a standardized, model-based portfolio
    over a bespoke strategy. The high-touch nature of this tier involves more frequent
    consultations and a more complex asset structure.

    3. **Specific Single-Objective Focus**: Your sole priority is either tax efficiency
    or ESG impact. While we can incorporate these elements into a bespoke plan, our
    dedicated portfolios are specifically optimized for those singular goals.


    **Fiduciary Commitment**

    Regardless of the tier selected, we maintain a steadfast commitment to the client''s
    best interest. We operate under a Fiduciary Duty, ensuring that the product recommended—whether
    it is Private Wealth Advisory or a foundational portfolio—is rooted in your documented
    Risk Profiling and financial goals.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 7fe79001-1791-5c55-a664-3547234150c2
  title: Private Wealth Advisory — how-to / step-by-step
  body: '**How do I update my risk profile for my bespoke strategy?**

    Simply tell us that you wish to update your Risk Profiling. We will then conduct
    a new evaluation of your ability and willingness to lose principal. Once the new
    profile is documented, your Senior Portfolio Strategist will propose adjustments
    to your asset allocation.


    **How is the advisory fee collected?**

    Your annual advisory fee of 0.75% is calculated based on the assets under management
    and is deducted from your account. This transparent fee ensures our success is
    aligned with the growth of your assets.


    **How do I request a change to my investment goals?**

    Inform your Relationship Manager of the specific changes to your financial objectives.
    We will review these against your current portfolio and, if necessary, schedule
    a phone consultation with a Senior Portfolio Strategist to refine your strategy.
    For more on our process, see Private Wealth Advisory — overview.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: faq
  source_authority: official
