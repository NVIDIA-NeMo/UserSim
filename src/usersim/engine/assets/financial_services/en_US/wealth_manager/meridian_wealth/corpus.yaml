- id: e6390794-8ce4-5a7e-95ec-b4387cfa3cec
  title: Managed Portfolio — access or login problems
  body: "If you are unable to access your account via our secure client portal, it\
    \ is typically due to security locks or authentication failures. \n\nSymptoms:\n\
    - The portal rejects your credentials despite multiple attempts.\n- You are not\
    \ receiving the multi-factor authentication (MFA) code.\n- An 'Account Locked'\
    \ message appears upon login.\n\nResolution Steps:\n1. Verify Credentials: Ensure\
    \ you are using the correct username and that your caps lock is off. If you have\
    \ forgotten your password, request a reset through the portal.\n2. Check MFA Delivery:\
    \ Ensure your registered mobile device or email is active. If the code does not\
    \ arrive within two minutes, request a resend.\n3. Identity Verification: If the\
    \ account is locked, inform us. We will initiate a rigorous identity verification\
    \ process to ensure the security of your $250,000+ investment. This may involve\
    \ confirming specific account details or providing government-issued identification.\n\
    \nWhen to Escalate:\nIf the identity verification fails or if you suspect your\
    \ credentials have been compromised, we will escalate the matter to our security\
    \ team. We will then perform a comprehensive audit of all recent account activity\
    \ and place a temporary freeze on fund movements to protect your assets. You will\
    \ receive a formal status update via your verified email within one business day.\n\
    \nFor issues regarding specific charges, please see Managed Portfolio — an unexpected\
    \ charge or amount."
  domain: wealth_management
  product_category: managed_portfolio
  document_type: troubleshooting
  source_authority: official
