- id: 34f45972-49cc-5120-bdce-84897cb7ea72
  title: ESG Impact Portfolio — how-to / step-by-step
  body: '**How do I add more funds to my ESG Impact Portfolio?**

    To increase your investment, simply notify us of the amount and the source of
    funds. We will provide the necessary transfer instructions and confirm once the
    capital has been allocated according to your ESG strategy.


    **How do I change the impact focus of my portfolio?**

    If you wish to shift your focus (e.g., from environmental to social governance),
    ask us to update your impact preferences. We will conduct a brief review to ensure
    the change aligns with your risk profile and then rebalance your holdings accordingly.


    **How is the annual advisory fee of 0.9% collected?**

    The fee is calculated based on the assets under management and is deducted periodically
    from your account. You can view these deductions by following the steps in ESG
    Impact Portfolio — check status or history.'
