- id: 0846b266-5949-5e99-9aa3-a3374a7a2402
  title: Tax-Managed Portfolio — risk disclosures
  body: 'Investment in the Tax-Managed Portfolio involves risk, including the potential
    loss of principal. This strategy is designed for investors who have undergone
    rigorous Risk Profiling and have a documented ability to withstand market volatility
    in exchange for potential after-tax returns.


    Tax-Specific Risks:

    - Legislative Risk: The effectiveness of tax-loss harvesting and other optimization
    strategies depends on current tax laws. Changes in the internal revenue code may
    reduce or eliminate the tax benefits of this portfolio.

    - Tracking Error: Because we may avoid certain securities to minimize tax liabilities,
    the portfolio''s performance may deviate from the benchmark it is intended to
    track.

    - Wash Sale Risk: Despite our rigorous management, certain external trades made
    by the client in separate accounts could trigger ''wash sale'' rules, neutralizing
    the tax benefits of our harvesting efforts.


    Fee Disclosure:

    The annual advisory fee of 0.95% is charged for professional portfolio management
    and financial guidance. This fee is deducted regardless of portfolio performance.


    Regulatory Standing:

    Our operations strictly adhere to SEC regulations and the fiduciary standards
    of the Advisers Act. We prioritize full disclosure of conflicts and frame data
    privacy as a cornerstone of our trust-based relationship.


    Disclaimer: We provide holistic investment strategy and asset allocation; however,
    we defer specific legal and tax filing advice to certified external professionals.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: disclosure
  source_authority: official
