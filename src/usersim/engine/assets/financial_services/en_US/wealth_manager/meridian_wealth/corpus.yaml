- id: f2c1d3a6-ca33-5030-be81-a04fac9c66d8
  title: Tax-Managed Portfolio — vs. a similar product here
  body: 'When choosing between our core offerings, clients often compare the Tax-Managed
    Portfolio with the Managed Portfolio.


    **Tax-Managed Portfolio**

    *   **Primary Goal**: After-tax return optimization.

    *   **Cost**: Annual advisory fee of 0.95%.

    *   **Entry Barrier**: Minimum investment of $500,000.

    *   **Best For**: High-income earners in high tax brackets who require active
    tax-loss harvesting.


    **Managed Portfolio**

    *   **Primary Goal**: Professional management with a balanced risk approach.

    *   **Cost**: Lower annual advisory fee (refer to Managed Portfolio — fee schedule).

    *   **Entry Barrier**: Lower minimum investment requirement.

    *   **Best For**: Investors seeking foundational professional management without
    the specific need for aggressive tax-optimization overlays.


    While the Managed Portfolio provides an excellent balance for most, the Tax-Managed
    Portfolio is the superior choice for those whose tax liabilities significantly
    erode their portfolio growth, provided they meet the $500,000 minimum.'
