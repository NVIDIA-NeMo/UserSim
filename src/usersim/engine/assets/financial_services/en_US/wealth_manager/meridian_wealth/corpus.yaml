  title: Tax-Managed Portfolio — cost and charges
  body: '**What is the cost to maintain a Tax-Managed Portfolio?**

    We employ a transparent fee structure to align our success with the growth of
    your assets. The Tax-Managed Portfolio carries an annual advisory fee of 0.95%.
