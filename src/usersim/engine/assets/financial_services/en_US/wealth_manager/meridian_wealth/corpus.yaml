- id: b988226b-03e6-5a7f-95ca-de8a0e028730
  title: Managed Portfolio — a failed or pending action
  body: 'Clients may occasionally encounter a status where a funding request or an
    account modification appears as ''failed'' or ''pending.''


    **Common Symptoms**

    *   Funds have left the originating institution but are not yet reflected in the
    Managed Portfolio.

    *   An update to the risk profile is marked as ''pending review.''

    *   A request to move funds has been declined without an immediate explanation.


    **Likely Causes and Resolution Steps**

    1. **Verification Failure**: Due to our zero-trust posture regarding account modifications,
    any action lacking mandatory multi-factor authentication (MFA) will be automatically
    blocked. Ensure all identity verification steps were completed successfully.

    2. **Insufficient Funding**: For new accounts, any initial deposit below the minimum
    investment of $250,000 will result in a failed activation. Verify that the total
    transferred amount meets this threshold exactly.

    3. **Compliance Review**: Certain modifications to asset allocation may trigger
    a fiduciary review to ensure the change remains rooted in your documented risk
    profile. These are typically marked as ''pending.''


    **Escalation Process**

    If an action remains pending beyond 3 business days, we will escalate the matter
    from your Relationship Manager to a Senior Portfolio Strategist. For disputes
    regarding failed transactions, we adhere to a philosophy of rapid investigation.
    Initial reviews are conducted within 5-10 business days, and you will receive
    a formal written determination upon the conclusion of our investigation.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 2a18f3cd-cd07-5d76-96ab-08b28f5e4835
  title: Managed Portfolio — eligibility requirements
  body: 'Eligibility for the Managed Portfolio is determined by the following financial
