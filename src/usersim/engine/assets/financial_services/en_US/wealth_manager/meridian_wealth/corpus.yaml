- id: 0fa76ece-6a5d-5ba1-942a-090529a4bb49
  title: ESG Impact Portfolio — an unexpected charge or amount
  body: 'Symptom: You notice a deduction from your account balance that you do not
    recognize, or the amount of a fee seems higher than expected.


    Likely Causes:

    - Annual Advisory Fee: The most common cause is the application of the 0.9% annual
    advisory fee, which may be deducted in installments or as a lump sum depending
    on your billing cycle.

    - Market Volatility: Changes in the valuation of ESG-specific assets can result
    in a lower overall account balance, which may be mistaken for an unexpected charge.

    - External Asset Costs: While our advisory fee is 0.9%, certain underlying ESG
    funds may have their own internal expense ratios.


    Steps to Resolve:

    1. Review your most recent statement: Check for a line item specifically labeled
    as the advisory fee. Verify if the amount aligns with 0.9% of your average assets
    under management for the period.

    2. Verify the timing: Confirm if the charge aligns with your scheduled billing
    interval.

    3. Compare against the fee philosophy: Remember that our fees are non-negotiable
    to ensure equitable treatment across our client base.


    When to Escalate:

    If the charge is not a result of the 0.9% advisory fee or market movement, or
    if you believe a technical error has occurred, tell us immediately. We will raise
    a formal dispute case. Following our dispute philosophy, we will conduct an initial
    review within 5-10 business days. You will receive a formal written determination
    upon the conclusion of this investigation. If the charge is found to be erroneous,
    we will apply a corrective credit to your account.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
