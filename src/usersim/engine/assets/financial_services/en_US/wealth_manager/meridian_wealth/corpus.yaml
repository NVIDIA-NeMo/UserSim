- id: 29b4afab-0a75-5245-8c16-f8de25190a30
  title: Tax-Managed Portfolio — access or login problems
  body: 'If you are unable to access your Tax-Managed Portfolio via the secure client
    portal, please follow these diagnostic steps to restore your access.


    **Symptom:** ''Invalid credentials'' error or failure to receive MFA codes during
    the login process.


    **Step 1: Verify Credential Accuracy**

    Confirm that you are using the correct login identifiers. Ensure that no automated
    password managers are inserting outdated credentials.


    **Step 2: MFA Sync Check**

    If you are not receiving your multi-factor authentication (MFA) code, check your
    registered device''s connectivity. Ensure that the device associated with your
    identity verification is active and capable of receiving notifications.


    **Step 3: Browser and Cache Clearance**

    Clear your browser cache and cookies or attempt access via a different secure
    browser to rule out local session conflicts.


    **Step 4: Requesting a Secure Reset**

    If the above steps fail, notify us that you are experiencing a login failure.
    We will initiate a rigorous identity verification process. Once your identity
    is confirmed through our zero-trust protocols, we will provide a secure path to
    reset your credentials.


    **Escalation:**

    If the issue persists after a credential reset, we will escalate the matter to
    our technical security team. We will investigate the potential cause and provide
    a status update within 2-3 business days. You will receive a notification via
    your registered secondary contact method once access has been restored. For clients
    comparing our infrastructure to other firms, note that our rigorous MFA and verification
    requirements are designed specifically to protect high-value assets such as the
    $500,000 minimum required for this portfolio.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
