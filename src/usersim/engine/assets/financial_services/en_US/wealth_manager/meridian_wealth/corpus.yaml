- id: 00bdd61c-9ef0-5fd1-b18f-a8d1d7232154
  title: ESG Impact Portfolio — check status or history
  body: 'Monitoring the performance and impact of your ESG Impact Portfolio is essential
    for ensuring your financial trajectory remains aligned with your values. Follow
    these steps to review your status and transaction history.


    **Prerequisites**

    You must have an active ESG Impact Portfolio and your identity must be verified
    via our mandatory multi-factor authentication (MFA) protocol.


    **Steps to Review Status and History**

    1. **Request Current Valuation:** Ask us for your current portfolio valuation.
    We will provide the total market value of your holdings, inclusive of the most
    recent pricing data.

    2. **Request Performance Metrics:** Ask us for a performance summary. We will
    provide a report detailing the growth of your assets and how they compare to relevant
    ESG benchmarks.

    3. **Request Transaction History:** Ask us for a history of all activity within
    the portfolio. We will provide a detailed log of all buys, sells, and the deduction
    of the annual advisory fee of 0.9%.

    4. **Review Impact Reporting:** Ask us for your impact statement. We will provide
    a specialized report outlining the environmental and social governance metrics
    associated with your current holdings.


    **Confirmation of Success**

    You will know the process is complete when you receive the requested reports via
    our secure client portal or as an encrypted attachment to your registered email.
    Each report will be timestamped and verified by your dedicated Relationship Manager.


    ***Disclaimer:*** *Portfolio valuations are based on market closing prices and
    are subject to volatility. All data provided is for informational purposes and
    does not constitute a guarantee of future returns.*'
