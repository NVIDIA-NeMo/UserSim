  mentions_tools: []
  institution_id: meridian_wealth
- id: 5455a73d-8279-53f3-bb41-3c4722b512e7
  title: Private Wealth Advisory — risk disclosures
  body: 'Investment in the Private Wealth Advisory tier involves inherent risks. All
    clients must acknowledge the following disclosures before assets are deployed:


    1. Market Risk: No investment strategy can guarantee a profit or protect against
    loss. The value of portfolios can fluctuate based on market conditions, and it
    is possible to lose a portion or all of the principal investment. All strategies
    are developed based on the client''s documented risk profile.


    2. Fee Impact: The annual advisory fee of 0.75% is deducted regardless of portfolio
    performance. This fee reduces the overall net return of the investment.


    3. Liquidity Risk: Certain bespoke strategies employed within the Private Wealth
    Advisory tier may involve assets that are less liquid than standard exchange-traded
    instruments, potentially delaying the movement of funds.


    4. Fiduciary Limitations: While we operate under a fiduciary duty to act in your
    best interest, we defer specific legal and tax filing advice to certified external
    professionals. Clients are encouraged to consult with their own tax advisors regarding
    the implications of their investment choices.


    5. Regulatory Adherence: Our operations strictly adhere to SEC regulations and
    the fiduciary standards of the Advisers Act. We prioritize full disclosure of
    conflicts and risk profiling as cornerstones of our trust-based relationship.


    Disclaimer: The minimum investment of $1,000,000 is a requirement for entry into
    this tier. All product recommendations are rooted in the client''s documented
    risk profile and financial goals.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 3ca9717f-d8e3-5792-8c06-42250198e147
  title: Private Wealth Advisory — how rates are tiered and applied
  body: "The Private Wealth Advisory service utilizes a flat, transparent fee structure\
    \ to ensure equitable treatment across our entire client base. \n\nAn annual advisory\
    \ fee of 0.75% is applied to all portfolios within this tier. This rate is not\
    \ tiered by balance; whether a portfolio is at the minimum investment of $1,000,000\
    \ or significantly exceeds it, the rate remains constant at 0.75% per annum.\n\
    \nThis fee is charged for professional portfolio management and financial guidance.\
    \ It is calculated based on the average daily balance of the assets under management\
    \ and is deducted on a regular schedule. \n\nBecause we maintain a non-negotiable\
    \ fee philosophy to ensure fairness, this rate cannot be adjusted for individual\
    \ accounts. Any changes to the overarching fee structure would be communicated\
    \ in writing in accordance with our change-of-terms policy."
