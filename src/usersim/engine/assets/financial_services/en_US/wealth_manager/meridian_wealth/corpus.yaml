- id: cb2d773b-cc7c-5b96-a414-076f54750809
  title: Regulatory notes for wealth_management
  body: 'Meridian Wealth operates as a premier fiduciary wealth manager. Consequently,
    our operations strictly adhere to SEC regulations and the fiduciary standards
    of the Advisers Act. This regulatory framework mandates that we prioritize the
    client''s best interest above all other considerations, ensuring full disclosure
    of any potential conflicts of interest.


    Our commitment to the Fiduciary Duty requires that all investment recommendations
    be based on a comprehensive understanding of the client''s financial situation.
    Therefore, Risk Profiling is not merely a preliminary step but a continuous requirement.
    No assets shall be allocated to a product—whether a Managed Portfolio, Tax-Managed
    Portfolio, ESG Impact Portfolio, or Private Wealth Advisory—without a documented
    risk profile that justifies the volatility and liquidity characteristics of that
    specific strategy.


    Furthermore, we frame data privacy and security as a cornerstone of the trust-based
    investor relationship. To protect client assets and sensitive information, we
    maintain a zero-trust posture. This means that multi-factor authentication (MFA)
    and rigorous identity verification are mandatory before any state-changing action
    or movement of funds can be executed. We strictly prohibit account modifications
    via unverified channels.


    Finally, while we provide holistic investment strategy and asset allocation based
    on a fiduciary standard of care, we maintain clear professional boundaries to
    ensure clients receive specialized expertise. Meridian Wealth defers specific
    legal and tax filing advice to certified external professionals. We provide the
    strategic framework and tax-optimized product recommendations, but the formal
    execution of legal documents and tax filings must be handled by the client''s
    appointed legal or tax counsel.'
  domain: wealth_management
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 6e3726e8-376c-5df4-95bc-1259776e350c
  title: When to use get_portfolio
  body: 'The get_portfolio tool is the authoritative mechanism for retrieving the
    detailed current state of a client''s investment holdings. This tool should be
    utilized whenever a client requests an update on their asset allocation, current
    valuation, or the performance of a specific strategy.


    To ensure compliance with our zero-trust security posture and SEC regulations,
    the following procedure must be followed:


    1. Verify the client''s identity using the mandated multi-factor authentication
    (MFA) and identity verification protocols.

    2. If the client provides a partial account identifier (such as the last four
    digits), the agent must first call get_accounts to resolve the full account_id.

    3. Once the identity is confirmed and the correct account_id is retrieved, the
    agent shall call get_portfolio to fetch the real-time data.

    4. Present the portfolio data to the client in a sophisticated and poised manner,
    clarifying any industry jargon related to the specific assets held.


    This tool is read-only and does not modify the account state. It is intended for
    information gathering and reporting. If the client expresses a desire to change
    their allocation based on the portfolio data retrieved, the agent must pivot to
    the appropriate state-changing procedure, such as updating the risk profile or
    scheduling a consultation with a Senior Portfolio Strategist.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_portfolio
  institution_id: meridian_wealth
- id: 58c92d05-2b2c-5bd0-88c6-be4a95b2c844
  title: get_portfolio tool reference
  body: "The get_portfolio tool allows an agent to retrieve the current holdings,\
    \ valuations, and asset allocation for a specific client account. \n\nSignature:\
    \ get_portfolio(account_id: string)\n\nEffect: Returns a detailed snapshot of\
    \ the investment portfolio associated with the provided account_id, including\
    \ current market value and distribution across asset classes.\n\nThe agent performs\
    \ this action by calling the tool directly within the secure session after the\
    \ client's identity has been successfully verified. This is a read-only operation."
