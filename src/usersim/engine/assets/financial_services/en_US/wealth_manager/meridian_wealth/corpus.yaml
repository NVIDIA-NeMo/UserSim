  institution_id: meridian_wealth
- id: 559b572d-61bb-5c88-bf4b-a3d1eb3d83e0
  title: Tax-Managed Portfolio — recognizing scams targeting this product
  body: 'At Meridian Wealth, we prioritize the sanctity of the trust-based investor
    relationship. Because the Tax-Managed Portfolio is designed for high-income earners
    seeking to minimize tax liabilities, it can unfortunately attract sophisticated
    bad actors who attempt to impersonate our firm or external tax authorities.


    Common scam patterns targeting this specific strategy include ''Urgent Tax Compliance''
    notices. In these scenarios, attackers may contact you claiming that a specific
    asset within your portfolio has triggered an immediate tax penalty or an urgent
    SEC audit, demanding an immediate transfer of funds to a ''secure escrow account''
    to avoid legal action. We wish to be explicitly clear: we will never request the
    movement of funds via unverified channels or ask you to transfer assets to a third-party
    account to resolve a tax discrepancy.


    Furthermore, be wary of ''Guaranteed Tax-Shield'' offers. Some fraudulent entities
    may contact our clients claiming they can ''supercharge'' the tax-efficiency of
    your Tax-Managed Portfolio beyond our established fiduciary strategies in exchange
    for an upfront fee. We operate on a transparent advisory fee structure; we do
    not solicit one-time ''optimization'' fees through unsolicited communications.


    Our security posture is rooted in a zero-trust framework. We require multi-factor
    authentication (MFA) and rigorous identity verification before any state-changing
    action or movement of funds is executed. If you receive a communication that creates
    a sense of artificial urgency or requests sensitive credentials, do not engage.


    If you suspect your account has been targeted or you notice unauthorized activity,
    notify us immediately. Rapid reporting is essential to our philosophy of rapid
    investigation and fair resolution. Once a dispute is raised, we conduct initial
    reviews within 5-10 business days to secure your assets and provide a formal written
    determination upon conclusion.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 1ad1d7d5-425e-57fa-9b7c-20e93cfbd0d5
  title: Tax-Managed Portfolio — limits, restrictions, and edge cases
  body: 'The Tax-Managed Portfolio is a sophisticated vehicle optimized for tax efficiency.
    To maintain the integrity of this strategy and adhere to our fiduciary standard
    of care, several operational limits and restrictions apply.


    Investment Thresholds:

    To ensure the strategy''s efficacy, we require a minimum investment of $500,000.
    Portfolios that fall below this threshold due to significant withdrawals may no
    longer be viable for the specialized tax-loss harvesting and asset location strategies
    required for this product, and we may recommend a transition to a different management
    tier.


    Fee Structure:

    This product carries an annual advisory fee of 0.95%. This fee is non-negotiable
    to ensure equitable treatment across our entire client base and reflects the increased
    active management required to minimize tax liabilities for high-income earners.


    Operational Restrictions:

    1. Asset Transfers: We maintain a zero-trust posture regarding account modifications
    via unverified channels. All requests to move funds or change beneficiaries must
    pass our mandatory multi-factor authentication (MFA) and identity verification
    protocols.

    2. External Advice: While we provide holistic investment strategy and asset allocation,
    we defer specific legal and tax filing advice to certified external professionals.
    We do not file tax returns on behalf of clients.

    3. Risk Profile Alignment: All product recommendations, including adjustments
    within the Tax-Managed Portfolio, must be rooted in the client''s documented risk
    profile. We cannot execute trades that deviate from the agreed-upon risk parameters
    without a formal update to the client''s risk profiling.


    Edge Cases:

    In the event of a significant change in a client''s tax bracket or residency (e.g.,
    moving to a different state or country), the current tax-optimization strategy
    may become suboptimal. In such cases, we will initiate a review with the client''s
    Senior Portfolio Strategist to re-align the portfolio''s tax-alpha goals.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: d3f2fbc5-80ae-5534-8c29-ff0dc2a0c615
  title: Tax-Managed Portfolio — eligibility and setup
  body: 'Questions regarding the onboarding process for the Tax-Managed Portfolio
    are addressed below.


    **Who is eligible for the Tax-Managed Portfolio?**

    This strategy is designed for high-net-worth individuals and institutional clients
    who seek to minimize their annual tax liabilities. To qualify, a minimum investment
    of $500,000 is required. Additionally, the product must align with your documented
    risk profile and financial goals.


    **How do we establish the account?**

    Setup begins with a rigorous risk profiling process to evaluate your ability and
    willingness to lose principal in exchange for potential returns. Once your profile
    is documented, we will align the asset allocation to your specific tax situation.
    You will then be required to complete our identity verification and multi-factor
    authentication (MFA) setup to ensure the security of your assets.


    **What are the costs associated with setting up this portfolio?**

    There are no setup fees; however, the portfolio is subject to an annual advisory
    fee of 0.95%, which aligns our success with the growth of your assets.'
