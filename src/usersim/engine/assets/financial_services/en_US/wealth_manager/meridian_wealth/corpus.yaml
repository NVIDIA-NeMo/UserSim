- id: e6924fdf-4660-5093-b50d-7ee5155bdcd1
  title: ESG Impact Portfolio — privacy and data handling
  body: 'Meridian Wealth maintains a steadfast commitment to the privacy of our high-net-worth
    and institutional clients. This disclosure outlines how data is handled specifically
    for those enrolled in the ESG Impact Portfolio.


    Data Collection and Purpose: We collect financial data, risk tolerance metrics,
    and specific ethical preferences to ensure your portfolio is constructed according
    to your documented goals. This information is used exclusively to fulfill our
    fiduciary duty and to manage the active requirements of the ESG strategy.


    Security Standards: All client data is protected by multi-factor authentication
    (MFA) and encrypted storage. We maintain a zero-trust posture regarding account
    modifications; therefore, no changes to your ESG preferences or fund movements
    will be processed without rigorous identity verification.


    Third-Party Disclosure: To accurately measure the ''impact'' of your investments,
    we may utilize data from external ESG rating agencies. In such instances, we share
    only the necessary asset identifiers and avoid disclosing personally identifiable
    information (PII) unless required by law or SEC regulations.


    Regulatory Compliance: Our operations strictly adhere to SEC regulations and the
    fiduciary standards of the Advisers Act. We prioritize full disclosure of conflicts
    and risk-profiling, framing data privacy as a cornerstone of the trust-based investor
    relationship. The annual advisory fee of 0.9% and the minimum investment of $250,000
    are disclosed transparently and applied consistently to all clients in this tier
    to avoid preferential conflicts.


    For further information on our general account agreements, please see the ESG
    Impact Portfolio — change-of-terms policy.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: d3149c07-f123-5a6e-ac8c-4bb9b9f85995
  title: ESG Impact Portfolio — recognizing scams targeting this product
  body: "As the demand for sustainable investing grows, we have observed an increase\
    \ in sophisticated fraudulent schemes targeting investors interested in the ESG\
    \ Impact Portfolio. These scams often utilize 'greenwashing'—the practice of making\
    \ misleading claims about the environmental benefits of an investment—to lure\
    \ individuals into unverified third-party funds.\n\nCommon patterns include unsolicited\
    \ offers of 'exclusive' ESG opportunities that promise guaranteed returns far\
    \ exceeding market norms, or requests to move funds to an external account to\
    \ 'verify' your commitment to a sustainable cause. Please be advised that Meridian\
    \ Wealth will never ask you to transfer funds to a personal account or an unverified\
    \ third-party entity to activate your portfolio. Furthermore, we will never request\
    \ your multi-factor authentication (MFA) codes or passwords via email or SMS.\n\
    \nOur commitment to a zero-trust posture means that any request to modify your\
    \ account or move funds through unverified channels will be blocked. If you receive\
    \ a communication that appears to be from us but requests sensitive credentials\
    \ or immediate payment to a non-Meridian account, treat it as a security breach.\
    \ \n\nIf you suspect you have been targeted by a scam or notice unauthorized activity,\
    \ you must notify us immediately. Rapid reporting is essential to our investigation\
    \ process. We approach all disputes with a philosophy of rapid investigation;\
    \ initial reviews are conducted within 5-10 business days, with formal written\
    \ determinations provided upon conclusion.\n\n***Disclaimer:*** *Investment in\
    \ the ESG Impact Portfolio involves risk, including the possible loss of principal.\
    \ Past performance of sustainable assets does not guarantee future results.*"
  domain: wealth_management
  product_category: esg_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 2bf4a400-d482-519a-b3a0-154783ca3acc
  title: ESG Impact Portfolio — limits, restrictions, and edge cases
  body: 'The ESG Impact Portfolio is a sophisticated vehicle designed to align financial
    growth with environmental, social, and governance impact. To maintain the integrity
    of this strategy and ensure fiduciary excellence, certain limits and restrictions
    apply.


    **Investment Thresholds**

    To ensure the portfolio is managed with the necessary rigor and diversification,
    we require a minimum investment of $250,000. This threshold is mandatory for all
    initial account openings to maintain the viability of the underlying impact strategies.


    **Fee Structure**

    We employ a transparent advisory fee structure to align our success with the growth
    of your assets. The ESG Impact Portfolio carries an annual advisory fee of 0.9%.
    This fee is non-negotiable, ensuring equitable treatment across our entire client
    base.


    **Restrictions and Edge Cases**

    1. **Asset Constraints:** Because this portfolio strictly adheres to ESG mandates,
    certain high-yield sectors (such as traditional energy or tobacco) are excluded
    regardless of their potential short-term performance. This may result in performance
    divergence from broader market indices.

    2. **Liquidity Considerations:** While we prioritize accessibility, certain impact-focused
    assets may have lower liquidity than standard equities. Large-scale withdrawals
    may require a coordination period with a Senior Portfolio Strategist to minimize
    market impact.

    3. **Tax Implications:** While we manage the assets for growth and impact, we
    defer specific tax filing advice to certified external professionals. For clients
    whose primary goal is tax minimization rather than impact, we suggest reviewing
    the Tax-Managed Portfolio — overview.


    ***Disclaimer:*** *All product recommendations are rooted in the client''s documented
    risk profile and financial goals. Fiduciary duty governs all asset allocations.*'
