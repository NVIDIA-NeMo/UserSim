- id: d3c6c875-e42f-56b5-a5f6-2f5b79ccf19a
  title: Tax-Managed Portfolio — when to switch or upgrade
  body: 'Determining when to transition from a Tax-Managed Portfolio to another Meridian
    Wealth offering depends on changes in your net worth and tax complexity.


    **Switching to Managed Portfolio**

    If your investable assets fall below the minimum investment of $500,000, or if
    your tax bracket decreases to a level where the active tax-optimization no longer
    justifies the annual advisory fee of 0.95%, the Managed Portfolio is the superior
    choice. It provides professional management with a more balanced, less tax-centric
    approach.


    **Upgrading to Private Wealth Advisory**

    For ultra-high-net-worth clients whose needs have evolved beyond standardized
    tax-managed strategies, we recommend upgrading to Private Wealth Advisory. While
    the Tax-Managed Portfolio is highly efficient, Private Wealth Advisory offers
    bespoke, high-touch strategies that can incorporate more complex legal structures
    and alternative assets that are not available in the Tax-managed tier.


    **Decision Summary**

    - **Choose Tax-Managed Portfolio**: When you have at least $500,000 and high taxable
    income requiring active loss harvesting.

    - **Choose Managed Portfolio**: When you seek a foundational solution with a balanced
    risk approach and lower minimum requirements.

    - **Choose Private Wealth Advisory**: When you require the most exclusive, bespoke
    strategies for ultra-high-net-worth portfolios.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: comparison
  source_authority: official
