- id: 7da6a264-3410-542a-bd1e-97b40896ca8f
  title: Tax-Managed Portfolio — a failed or pending action
  body: 'If you have requested an account modification, a fund transfer, or the activation
    of a Tax-Managed Portfolio and the action appears as ''pending'' or ''failed,''
    please review the following possibilities:


    **Common Symptoms**

    *   The account status has not updated to reflect the Tax-Managed strategy.

    *   A fund transfer of the $500,000 minimum investment has not been credited.

    *   An identity verification request remains outstanding.


    **Potential Causes**

    1. **Insufficient Funding**: The minimum investment threshold of $500,000 was
    not fully met at the time of the request.

    2. **Verification Gap**: Multi-factor authentication (MFA) was not completed,
    or identity verification documents were deemed insufficient. We maintain a zero-trust
    posture regarding account modifications via unverified channels.

    3. **Risk Profile Expiration**: Your documented risk profile may require an update
    before we can legally deploy the tax-managed strategy under our fiduciary duty.


    **Resolution Steps**

    *   First, verify that the total amount transferred meets the $500,000 requirement
    exactly.

    *   Ensure all MFA prompts have been responded to via your secure client portal.

    *   Ask us to check the status of your identity verification; we will confirm
    if further documentation is required.


    If the issue persists, we will escalate the matter from your Relationship Manager
    to a Senior Portfolio Strategist for complex resolution. You will receive a status
    update within 5-10 business days should a formal investigation be required.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: troubleshooting
