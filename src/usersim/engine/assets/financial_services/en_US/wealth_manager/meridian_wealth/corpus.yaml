- id: c3703123-b0e4-5c83-a50c-157d51fe4262
  title: Managed Portfolio — getting started walkthrough
  body: 'The Managed Portfolio is our foundational investment solution, designed for
    those seeking professional management with a balanced risk approach. To ensure
    this product aligns with your financial trajectory, we follow a rigorous onboarding
    sequence.


    Step 1: Risk Profiling. We begin by evaluating your ability and willingness to
    lose principal in exchange for potential returns. This risk profiling process
    is essential, as all product recommendations are rooted in this documented profile.


    Step 2: Capital Commitment. We verify the initial funding to meet our minimum
    investment requirement of $250,000. This ensures the portfolio has sufficient
    scale to implement our diversified asset allocation strategies.


    Step 3: Fiduciary Agreement. We execute the management agreement, detailing our
    fiduciary duty to act solely in your best interest. This document clarifies that
    while we provide holistic strategy, we defer specific legal and tax filing advice
    to your external certified professionals.


    Step 4: Fee Acknowledgement. You will confirm the annual advisory fee of 0.85%.
    This transparent fee aligns our success with the growth of your assets and covers
    the professional portfolio management and financial guidance provided throughout
    the year.


    Step 5: Implementation. Once the risk profile and funding are confirmed, our Senior
    Portfolio Strategists deploy the assets according to the agreed-upon allocation.


    Support agents should ensure the client has completed the risk profile before
    discussing specific asset allocations. For further details on requirements, refer
    to Managed Portfolio — eligibility requirements.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 306940e0-2975-523f-8fc7-625cb74f251e
  title: Managed Portfolio — cost and charges
  body: 'Q: What are the primary costs associated with the Managed Portfolio?

    A: The primary cost is the annual advisory fee of 0.85%. This is the annual percentage
    charged for professional portfolio management and financial guidance, designed
    to align our incentives with your asset growth.


    Q: Is the advisory fee negotiable based on the size of my investment?

    A: No. To ensure equitable treatment across our entire client base, our fees are
    non-negotiable and are based on the specific complexity and active management
    required for the product.


    Q: Are there any other minimums I should be aware of?

    A: Yes, we require a minimum investment of $250,000 to open and maintain a Managed
    Portfolio. For a more detailed breakdown of costs, please refer to Managed Portfolio
    — fee schedule.'
