- id: 88209e10-1933-5f46-86a0-6d338a5b5ae2
  title: Private Wealth Advisory — set up and activate
  body: 'Activating a Private Wealth Advisory engagement requires a rigorous onboarding
    process to ensure the strategy is perfectly aligned with your financial objectives
    and risk tolerance. Before beginning, please ensure you have a verified source
    of funds for the required minimum investment of $1,000,000.


    1. Provide your financial objectives and current asset overview: We will begin
    by collecting a comprehensive summary of your current holdings and long-term goals.
    We will then conduct a formal Risk Profiling session to determine your tolerance
    for principal volatility.

    2. Review the Bespoke Strategy Proposal: Based on your risk profile, we will present
    a tailored asset allocation strategy. We will discuss the rationale behind each
    recommendation to ensure it meets your specific needs.

    3. Execute the Fiduciary Agreement: Once you approve the strategy, we will provide
    the formal agreement outlining our fiduciary obligations and the 0.75% annual
    advisory fee. You will provide your electronic signature to formalize the relationship.

    4. Fund the Account: We will provide secure instructions for the transfer of your
    $1,000,000 minimum investment. We will confirm via your secure portal once the
    funds have been successfully received and reconciled.

    5. Initial Portfolio Implementation: We will execute the trades necessary to align
    your assets with the agreed-upon strategy. We will provide a confirmation report
    detailing the initial allocations.


    You will know the process is complete when you receive a final activation notice
    and your first scheduled consultation with your Senior Portfolio Strategist is
    confirmed.'
