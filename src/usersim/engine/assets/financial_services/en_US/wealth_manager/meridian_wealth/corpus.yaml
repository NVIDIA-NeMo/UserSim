- id: 65a9a2c7-afde-519a-9313-a276b307c6d8
  title: ESG Impact Portfolio — a failed or pending action
  body: 'If you observe that a funding request or a portfolio modification is listed
    as ''pending'' or has ''failed,'' it is typically due to our stringent security
    and compliance protocols.


    Likely Causes:

    1. Verification Failure: Our zero-trust posture requires rigorous identity verification.
    If MFA was not completed or the identity documents provided did not match our
    records, the action will be blocked.

    2. Insufficient Minimums: If a partial withdrawal or transfer brings the account
    balance below the minimum investment of $250,000, the action may be flagged for
    review to prevent a breach of product eligibility.

    3. Risk Profile Mismatch: A requested change in asset allocation that contradicts
    your documented risk profile may be paused for fiduciary review.


    Resolution Steps:

    - Confirm that you have completed all requested MFA prompts for the transaction.

    - Verify that the remaining balance in the account will stay at or above $250,000.

    - Ensure your current risk profile is up to date if you are requesting a significant
    strategy shift.


    If the issue persists, we will escalate the matter to a Senior Portfolio Strategist
    for a complex resolution. You will receive a status update or a formal determination
    regarding the action within 5-10 business days.'
