- id: 65573458-72b0-503d-965a-a22886f27152
  title: Private Wealth Advisory — fraud and unauthorized-activity protection
  body: "At Meridian Wealth, we recognize that the significant asset concentrations\
    \ associated with Private Wealth Advisory can attract sophisticated fraudulent\
    \ actors. We employ a zero-trust posture regarding account modifications; therefore,\
    \ multi-factor authentication (MFA) and rigorous identity verification are mandatory\
    \ before any movement of funds or state-changing action is executed. \n\nClients\
    \ should be vigilant against 'urgent' requests for fund transfers or the disclosure\
    \ of security credentials via unverified channels. We will never ask you to provide\
    \ your password, MFA codes, or sensitive account credentials via email or SMS.\
    \ A common fraud pattern targeting ultra-high-net-worth portfolios involves the\
    \ impersonation of senior executives or legal counsel to expedite an 'off-market'\
    \ transaction; we advise that any such request be verified through a scheduled\
    \ phone consultation during EST business hours.\n\nIf you detect unauthorized\
    \ activity or suspect that your account credentials have been compromised, you\
    \ must notify us immediately. Rapid reporting is critical to mitigating loss.\
    \ We approach all disputes with a philosophy of rapid investigation and fair resolution,\
    \ conducting initial reviews within 5-10 business days. A formal written determination\
    \ will be provided upon the conclusion of our investigation. \n\nDisclaimer: While\
    \ we maintain rigorous security protocols, the client shares responsibility for\
    \ the confidentiality of their access credentials. Failure to notify us of unauthorized\
    \ activity in a timely manner may impact the resolution process."
