  institution_id: meridian_wealth
- id: 6b90d9fe-346a-5e17-9383-80258626eb66
  title: Managed Portfolio — a discrepancy in your records or statement
  body: 'Clients may occasionally identify a discrepancy between their internal records
    and the official statements provided by Meridian Wealth. We approach all such
    disputes with a philosophy of rapid investigation and fair resolution.


    **Common Symptoms**

    - The ending balance on the statement does not match your personal calculations.

    - The deducted advisory fee appears higher or lower than the expected 0.85% annual
    rate.

    - A transaction you authorized does not appear in the history, or an unknown transaction
    is listed.


    **What to Check First**

    1. **Accrual Timing**: Confirm if the discrepancy is related to the timing of
    the advisory fee. Since the 0.85% fee is applied pro-rata, the amount deducted
    in a partial month may look different than a full month.

    2. **Settlement Dates**: Ensure you are looking at the settlement date of the
    trade rather than the trade date; assets may take T+2 days to reflect in the final
    balance.

    3. **Pending Deposits**: Verify if any recent contributions toward your $250,000
    minimum are still in a pending state.


    **How to Resolve**

    1. **Submit a Formal Inquiry**: Tell us exactly which transaction or balance figure
    is in question and provide your supporting documentation.

    2. **Initial Review**: We will conduct an initial review of the transaction logs
    and fee calculations. This review is typically completed within 5-10 business
    days.

    3. **Determination**: We will provide a formal written determination upon the
    conclusion of our investigation, either correcting the error or providing a detailed
    explanation of the calculation.


    **Escalation**

    If the initial resolution is unsatisfactory, we will escalate the dispute to a
    Senior Portfolio Strategist for a final audit. You will receive a final written
    determination and, if an error occurred, a correction to your balance will be
    applied immediately.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 07bae4bb-ab81-54c6-901d-6552c37ab3dc
  title: Tax-Managed Portfolio — overview
  body: "The Tax-Managed Portfolio is an advanced investment strategy specifically\
    \ optimized to minimize tax liabilities for high-income earners. At Meridian Wealth,\
    \ we recognize that for our most successful clients, the impact of taxation can\
    \ be as significant as market volatility. This solution employs sophisticated\
    \ harvesting techniques and asset location strategies to enhance after-tax returns\
    \ while adhering to our strict fiduciary duty—the legal and ethical obligation\
    \ to act solely in the client's best interest.\n\nTo maintain the rigor of this\
    \ active management strategy, we require a minimum investment of $500,000. This\
    \ threshold ensures that the scale of the assets justifies the complexity of the\
    \ tax-optimization overlays applied to the portfolio. Our fee structure is transparent\
    \ and designed to align our success with the growth of your assets; this product\
    \ carries an annual advisory fee of 0.95%. Please note that our fees are non-negotiable\
    \ to ensure equitable treatment across our entire client base.\n\nEvery Tax-Managed\
    \ Portfolio is rooted in a comprehensive risk profiling process, wherein we evaluate\
    \ your ability and willingness to lose principal in exchange for potential returns.\
    \ This ensures that the pursuit of tax efficiency never compromises your documented\
    \ risk tolerance or long-term financial goals. \n\n***Disclaimer: While we provide\
    \ holistic investment strategy and asset allocation based on a fiduciary standard\
    \ of care, we defer specific legal and tax filing advice to certified external\
    \ professionals. All investment involves risk of loss.***"
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
