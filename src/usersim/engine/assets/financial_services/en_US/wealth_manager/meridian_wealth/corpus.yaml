- id: d2f663bc-cad3-5e1f-a219-bb83d0258c5b
  title: Private Wealth Advisory — make a change or update
  body: 'Because Private Wealth Advisory accounts utilize bespoke strategies, any
    modification to your investment goals or personal profile requires a rigorous
    verification and review process to maintain our fiduciary standard.


    To update your risk profile or financial goals:

    1. Tell us that you wish to update your risk profile or that your financial objectives
    have changed.

    2. We will provide a new risk profiling questionnaire to evaluate your current
    ability and willingness to lose principal in exchange for potential returns.

    3. Once you submit the updated profile, we will schedule a consultation with your
    Senior Portfolio Strategist to discuss how these changes impact your current asset
    allocation.

    4. We will provide a written proposal outlining the recommended adjustments to
    your portfolio to align with the new profile.

    5. Once you provide your written approval, we will execute the trades and notify
    you when the portfolio has been rebalanced.


    To update account permissions or authorized users:

    1. Tell us which individual or entity you wish to add or remove from your account.

    2. We will initiate a rigorous identity verification process for the new party,
    as we maintain a zero-trust posture regarding account modifications.

    3. You will be asked to confirm the specific level of authority (e.g., inquiry-only
    or full trading authority) granted to the user.

    4. We will notify you via the secure client portal once the authorization has
    been updated and the new user has completed the mandatory multi-factor authentication
    (MFA) setup.


    You will know these updates are complete when you receive a formal confirmation
    notice in your secure client portal.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 18e3b87a-7046-536b-b7fb-8aef1e184aef
  title: Private Wealth Advisory — access or login problems
  body: "Difficulty accessing your Private Wealth Advisory portal is typically related\
    \ to our stringent security requirements. Because we prioritize data privacy and\
    \ a zero-trust posture, access is strictly controlled.\n\nSymptom: \"I cannot\
    \ log in to my secure client portal\" or \"My MFA code is not being accepted.\"\
    \n\nLikely Causes:\n1. Outdated MFA device or synchronization error.\n2. Account\
    \ lockout following multiple unsuccessful identity verification attempts.\n3.\
    \ Unverified channel access attempt (attempting to enter the portal via a non-secure\
    \ link).\n\nSteps to Resolve:\n1. Verify your internet connection and ensure you\
    \ are using the official Meridian Wealth secure portal link. Avoid clicking links\
    \ provided in emails.\n2. Check that your MFA device is synchronized to the current\
    \ time. If you have replaced your mobile device, your MFA tokens will no longer\
    \ match.\n3. Attempt a password reset through the portal's secure recovery flow.\
    \ This will require a secondary identity verification step.\n\nWhen to escalate:\n\
    If you have attempted the recovery flow and remain unable to access your account,\
    \ or if you suspect your MFA device has been stolen, notify us immediately. \n\
    \nWhat we will do:\nWe will initiate a manual identity verification process. This\
    \ involves a scheduled consultation with your Relationship Manager to verify your\
    \ identity through secure, out-of-band methods. Once verified, we will reset your\
    \ security credentials and assist you in re-establishing MFA. You will receive\
    \ a confirmation email once your access has been restored."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: b966afc7-768d-573f-9e88-4a3434f8122d
  title: Private Wealth Advisory — qualification tiers
  body: 'Support agents should use the following matrix to determine if a prospect
    qualifies for the Private Wealth Advisory tier. This is our most exclusive offering,
    designated for ultra-high-net-worth individuals and institutions.


    Condition: Investable Assets

    Requirement: $\ge$ $1,000,000

    Outcome: Qualified for Private Wealth Advisory


    Condition: Investable Assets

    Requirement: $<$ $1,000,000

    Outcome: Not qualified for Private Wealth Advisory; refer to Managed Portfolio
    or other appropriate tiers.


    Condition: Risk Profile Status

    Requirement: Completed and Documented

    Outcome: Eligible for bespoke strategy implementation.


    Condition: Risk Profile Status

    Requirement: Pending or Incomplete

    Outcome: Ineligible for asset allocation until profiling is concluded.


    Note: All qualified clients are subject to the non-negotiable annual advisory
    fee of 0.75%.'
