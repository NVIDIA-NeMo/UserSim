- id: 13bdad8c-001b-51f4-9a76-c8ce61faaebe
  title: Managed Portfolio — who it is best for and common use cases
  body: 'The Managed Portfolio serves as our foundational investment solution, specifically
    engineered for high-net-worth individuals and institutional clients who seek professional,
    fiduciary-led management with a balanced approach to risk. This product is most
    suitable for investors who prefer a strategic, holistic asset allocation over
    the volatility of self-directed trading.


    Common Use Cases:

    - Transitioning Wealth: Ideal for clients who have recently experienced a liquidity
    event and require a disciplined framework to deploy capital without emotional
    bias.

    - Long-Term Growth: Suited for those seeking steady appreciation of principal
    while adhering to a rigorous risk profile to avoid excessive drawdown.

    - Institutional Baselines: Frequently used by small foundations or trusts as a
    core holding to ensure a fiduciary standard of care is applied to their primary
    assets.


    Financial Specifications:

    - Minimum Investment: $250,000

    - Annual Advisory Fee: 0.85%


    Our approach ensures that your portfolio is not merely a collection of assets,
    but a calibrated strategy. We utilize comprehensive Risk Profiling—the process
    of evaluating your ability and willingness to lose principal in exchange for potential
    returns—to ensure that every recommendation aligns with your documented goals.


    Disclaimer: All product recommendations are rooted in the client''s documented
    risk profile. Investment involves risk, and past performance is not indicative
    of future results.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 03a95e39-a287-549c-8c29-6a806cce9155
  title: Managed Portfolio — minimum investment explained
  body: 'Q: What is the minimum investment required to open a Managed Portfolio?

    A: To ensure we can provide the necessary level of professional oversight and
    institutional-grade strategy, we require a minimum investment of $250,000.


    Q: What happens if my portfolio value drops below $250,000 due to market fluctuations?

    A: We understand that markets are volatile. If your balance dips below the minimum
    investment of $250,000 due to market performance, we will not immediately close
    the account. Instead, your Relationship Manager will consult with you to determine
    if a portfolio rebalance or additional contribution is appropriate.


    Q: Can the minimum investment be waived for institutional clients?

    A: Our minimums are non-negotiable to ensure equitable treatment across our client
    base. Please refer to Managed Portfolio — eligibility requirements for more detail
    on qualification.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: dd5d362c-eece-51a5-b731-98fbb715e1c0
  title: Managed Portfolio — cancel, close, or downgrade
  body: 'If you wish to terminate your Managed Portfolio or transition to a different
    strategy, please follow these steps to ensure a secure and orderly dissolution
    of the account:


    1. Request for Closure: Inform your Relationship Manager of your intent to close
    the account or downgrade your service level. You must specify whether you wish
    to liquidate the assets to cash or transfer them in-kind to another institution.


    2. Portfolio Review: We will provide a final summary of your current holdings
    and a calculation of any pro-rated advisory fees owed for the current period,
    based on the 0.85% annual rate.


    3. Verification of Identity: To comply with our security posture, you must complete
    a mandatory identity verification and multi-factor authentication (MFA) process.
    This ensures that the request is legitimate and protects your assets from unauthorized
    movement.


    4. Settlement of Fees: We will deduct any outstanding fees from the account balance
    or request a separate payment to clear the balance.


    5. Asset Distribution: Once verified and settled, we will execute the transfer
    or liquidation. You will receive a final confirmation statement detailing the
    total amount disbursed and the official date of account closure.


    Completion: The process is complete when you receive the final account statement
    and the funds are confirmed in your receiving account. For those considering other
    internal options, you may wish to review Managed Portfolio — vs. a similar product
    here.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 8e7cc2d9-129f-5f4b-a68c-793b9c5bf74e
  title: Managed Portfolio — an unexpected charge or amount
  body: 'Symptom: You notice a deduction from your account balance that does not align
    with your expected monthly or quarterly totals, or a charge that appears unfamiliar.


    Likely Causes:

    - Periodic Advisory Fee: The most common cause is the application of the 0.85%
    annual advisory fee, which may be billed in installments (e.g., quarterly).

    - Market Value Adjustment: The ''amount'' may seem unexpected due to natural market
    fluctuations affecting the principal.

    - External Professional Fees: Charges related to legal or tax filings handled
    by external certified professionals you have engaged.


    What to Check:

    1. Review your most recent statement to see if the charge is labeled as an ''Advisory
    Fee''.

    2. Verify the current market value of your assets to see if the change is a result
    of performance rather than a fee.

    3. Cross-reference the date of the charge with our standard billing cycle.


    Resolution:

    If the charge remains unexplained, inform your Relationship Manager. We will conduct
    a rapid investigation into the transaction. If the charge is found to be an error,
    we will apply a correction to your account immediately. If the charge is valid,
    we will provide a detailed breakdown of the calculation.


    Escalation:

    If the issue is not resolved through your Relationship Manager, we will escalate
    the matter to a Senior Portfolio Strategist for a formal review. You can expect
    an initial response within 5-10 business days, followed by a written determination
    if the matter involves a formal dispute.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
