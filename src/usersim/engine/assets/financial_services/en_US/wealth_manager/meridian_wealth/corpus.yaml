- id: 4de93a9f-eb29-5279-af6f-37f4e4d2537d
  title: ESG Impact Portfolio — make a change or update
  body: 'If you wish to modify your investment strategy or update the parameters of
    your ESG Impact Portfolio, please follow these steps:


    1. Request a Strategy Review: Inform us that you wish to update your ESG goals
    or risk tolerance. We will then schedule a consultation with your Relationship
    Manager.


    2. Update Risk Profile: Since all our recommendations are rooted in your documented
    risk profile, you must provide updated financial information or goals. We will
    guide you through a new risk profiling session to determine if your willingness
    to accept principal volatility has changed.


    3. Propose Allocation Changes: During your consultation, specify the environmental,
    social, or governance themes you wish to emphasize or deprioritize. We will analyze
    these requests against the current market landscape.


    4. Review the Proposed Adjustment: We will provide a written proposal detailing
    how the changes will affect your asset allocation and whether they remain consistent
    with the minimum investment of $250,000 required for this strategy.


    5. Confirm and Execute: Once you provide written approval of the new allocation,
    we will execute the trades. You will receive a confirmation notice via the secure
    client portal once the update is complete.


    If you find that your goals have shifted so significantly that a different strategy
    is required, you may wish to review the ESG Impact Portfolio — choosing between
    tiers or options.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: how_to_guide
  source_authority: official
