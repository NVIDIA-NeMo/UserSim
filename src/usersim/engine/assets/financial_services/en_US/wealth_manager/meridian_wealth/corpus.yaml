  product_category: esg_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 7c985ae8-0810-5767-a9be-4be9330323bb
  title: ESG Impact Portfolio — a discrepancy in your records or statement
  body: '**Symptom**

    You notice a discrepancy between your expected balance and the amount shown on
    your statement, or you find an unfamiliar charge associated with your ESG Impact
    Portfolio.


    **Likely Causes**

    1. **Fee Timing:** The annual advisory fee of 0.9% is deducted periodically. A
    discrepancy may simply be the scheduled deduction of this fee.

    2. **Market Volatility:** Because ESG assets can be more volatile or less liquid
    than broad-market indices, the valuation on your statement reflects the market
    close of the statement date, which may differ from your internal tracking.

    3. **Pending Transactions:** A recent contribution or withdrawal may not have
    fully settled by the time the statement was generated.


    **Resolution Steps**

    1. **Review Fee Schedule:** Check your statement for any line item labeled as
    an advisory fee. Confirm if the amount corresponds to 0.9% of your average assets
    under management for the period.

    2. **Verify Trade Dates:** Compare the date of your last known transaction with
    the statement closing date. If a transaction occurred within 3-5 business days
    of the closing, it may appear on the subsequent statement.

    3. **Request a Detailed Audit:** If the discrepancy remains unexplained, ask us
    for a transaction-level audit. We will provide a line-by-line ledger of all credits,
    debits, and fee assessments.


    **Escalation**

    If we cannot resolve the discrepancy through a detailed audit, we will initiate
    a formal dispute investigation. In accordance with our policy, we conduct initial
    reviews within 5-10 business days. You will receive a formal written determination
    upon the conclusion of the investigation. If a clerical error is found, we will
    apply a corrective credit to your account immediately.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: da081025-475d-5aa4-a016-6714469eea7a
  title: Private Wealth Advisory — overview
  body: 'Private Wealth Advisory represents the most exclusive tier of our service
    model, offering bespoke, high-touch strategies tailored specifically for ultra-high-net-worth
    portfolios. We operate under a strict Fiduciary Duty, meaning we are legally and
    ethically obligated to act solely in your best interest at all times. Our approach
    combines rigorous Risk Profiling—the process of evaluating your ability and willingness
    to lose principal in exchange for potential returns—with sophisticated asset allocation
    to preserve and grow your legacy.


    To maintain the high level of customization and active management required for
    this tier, we require a minimum investment of $1,000,000. This ensures that the
    portfolio scale justifies the intensity of the bespoke strategy and the senior-level
    oversight provided by our Portfolio Strategists.


    Our compensation is based on a transparent Advisory Fee, which is the annual percentage
    charged for professional portfolio management and financial guidance. For the
    Private Wealth Advisory tier, this is set at 0.75% annually. This fee structure
    is non-negotiable, ensuring that every client within this tier receives equitable
    treatment and a consistent standard of care.


    Disclaimer: While we provide holistic investment strategy and asset allocation
    based on a fiduciary standard of care, we defer specific legal and tax filing
    advice to certified external professionals. All product recommendations are rooted
    in the client''s documented risk profile and financial goals. Our operations strictly
    adhere to SEC regulations and the fiduciary standards of the Advisers Act.'
