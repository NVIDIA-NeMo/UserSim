- id: 5940eba5-42fe-592e-a7ce-817c37415b0d
  title: When to use manage_authorized_users
  body: 'To facilitate the seamless management of high-net-worth estates, we allow
    clients to designate authorized users who may access or manage their accounts.
    The `manage_authorized_users` tool is used to add, modify, or remove these permissions.


    Given our zero-trust posture, the modification of account access is a high-sensitivity
    action. We strictly prohibit account modifications via unverified channels.


    **Procedure for Implementation:**

    1. **Primary Account Holder Verification:** The request must be initiated and
    verified by the primary account owner using mandatory MFA.

    2. **Identification:** Use `get_accounts` to ensure the correct account is being
    modified.

    3. **Permission Definition:** Clearly define the level of access for the authorized
    user (e.g., read-only access for a CPA vs. full transactional authority for a
    spouse).

    4. **Execution:** Call the `manage_authorized_users` tool with the `account_id`
    and the specific user details and permission levels.

    5. **Audit Trail:** Ensure the change is logged and a notification is sent to
    all existing authorized users on the account.


    For concerns regarding unauthorized access or suspected fraud, agents should refer
    to the philosophy of rapid investigation and fair resolution outlined in our general
    dispute handling, where initial reviews are conducted within 5-10 business days.'
