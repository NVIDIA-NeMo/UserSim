- id: b4036678-cda4-57f2-9ee2-3124051fcc61
  title: ESG Impact Portfolio — account security best practices
  body: "At Meridian Wealth, we view data privacy as a cornerstone of the trust-based\
    \ investor relationship. Given the bespoke nature of the ESG Impact Portfolio,\
    \ we urge our clients to maintain rigorous vigilance regarding their account security.\n\
    \nWe employ a zero-trust posture regarding account modifications. Consequently,\
    \ multi-factor authentication (MFA) and rigorous identity verification are mandatory\
    \ before any state-changing action or movement of funds is executed. Please be\
    \ advised that we will never request your MFA codes, passwords, or full social\
    \ security number via email or unsolicited text messages.\n\nSpecific risks associated\
    \ with impact investing often involve sophisticated phishing attempts where bad\
    \ actors impersonate ESG rating agencies or sustainability auditors to solicit\
    \ account access. We will never ask you to move funds to an external 'verification\
    \ account' to validate your ESG credentials. \n\nShould you detect any unauthorized\
    \ access or receive a suspicious communication appearing to be from Meridian Wealth,\
    \ you must notify us immediately. To ensure the highest level of protection and\
    \ to limit potential liability, we require reporting of suspected unauthorized\
    \ activity within 24 hours of discovery. Upon notification, we will initiate a\
    \ rapid investigation, with initial reviews conducted within 5-10 business days.\
    \ Our priority is the absolute integrity of your assets and the preservation of\
    \ your financial goals."
  domain: wealth_management
  product_category: esg_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: db953d77-ea3e-5185-9fd8-172c7a9f7b54
  title: ESG Impact Portfolio — change-of-terms policy
  body: "This document outlines the policy governing modifications to the terms of\
    \ the ESG Impact Portfolio. As a fiduciary, Meridian Wealth is committed to transparency\
    \ and the equitable treatment of all clients.\n\nFees and Requirements: The current\
    \ advisory fee for the ESG Impact Portfolio is 0.9% annually. This fee is non-negotiable\
    \ to ensure fairness across our client base. Additionally, the portfolio requires\
    \ a minimum investment of $250,000 to maintain its strategic efficacy. \n\nModification\
    \ Process: We reserve the right to amend the advisory fee or the minimum investment\
    \ threshold to reflect changes in market complexity or active management requirements.\
    \ Any such change will be communicated to the client in writing via the secure\
    \ client portal or email.\n\nNotice Period: Clients will receive at least 30 calendar\
    \ days' advance notice prior to the implementation of any change in fees or investment\
    \ minimums. If a change in terms is unacceptable to the client, they maintain\
    \ the right to terminate the management agreement and withdraw their assets without\
    \ penalty, provided the request is submitted in writing before the effective date\
    \ of the change.\n\nTermination: This agreement may be terminated by either party\
    \ upon written notice. Upon termination, any accrued but unpaid portions of the\
    \ 0.9% annual advisory fee will be settled from the account balance prior to the\
    \ final distribution of funds. All asset allocations remaining at the time of\
    \ closure will be liquidated or transferred according to the client's documented\
    \ instructions."
