- id: ffce976e-10bb-58aa-9350-1735245175d6
  title: Managed Portfolio — make a change or update
  body: 'Updating your Managed Portfolio parameters ensures your strategy remains
    aligned with your evolving life goals. Whether you are changing your risk tolerance
    or updating your personal details, please follow these steps:


    1. Provide the updated information: Tell us specifically what you wish to change.
    For example, if your financial goals have shifted, provide the new objectives;
    if you are updating contact information, provide the new details.

    2. Review Risk Profiling: If the change affects your financial goals or risk appetite,
    we will initiate a new risk profiling session. This is the process of evaluating
    your ability and willingness to lose principal in exchange for potential returns.
    We will present the updated profile for your review.

    3. Confirm the Adjustment: Once the new risk profile or detail is documented,
    we will provide a written confirmation of the change and, if applicable, how it
    will shift your asset allocation.

    4. Implementation: We will adjust the portfolio to reflect the new strategy. You
    will receive a notification via the secure portal once the trades have been executed
    to align with the update.


    Note: Changes to the fundamental structure of the account (such as beneficiary
    updates) require rigorous identity verification. For guidance on closing an account,
    refer to Managed Portfolio — cancel, close, or downgrade.'
  domain: wealth_management
  product_category: managed_portfolio
