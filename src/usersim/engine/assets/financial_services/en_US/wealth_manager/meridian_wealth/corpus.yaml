- id: 6590cb2b-940e-5507-a701-ce4921724be7
  title: Managed Portfolio — resolve a common request end-to-end
  body: 'A common request for Managed Portfolio clients is the redistribution of assets
    following a significant change in financial goals (e.g., approaching retirement
    or a liquidity event). This process ensures your portfolio remains rooted in your
    documented risk profile.


    **Prerequisites**

    You must have a current account balance of at least $250,000 and access to your
    secure client portal for document signing.


    **Steps to Rebalance Your Strategy**

    1. **Initiate a Strategy Review**: Tell us that you wish to update your investment
    objectives. We will then schedule a consultation with your Relationship Manager
    to discuss your new goals.

    2. **Complete Updated Risk Profiling**: We will provide a new risk profiling questionnaire.
    You must complete this to evaluate your current ability and willingness to lose
    principal in exchange for potential returns.

    3. **Review the Proposed Allocation**: Once we analyze your new profile, we will
    present a proposed asset allocation. We will explain how this new strategy maintains
    our fiduciary duty to act in your best interest.

    4. **Authorize the Change**: Ask us to send the allocation authorization form
    to your secure portal. You must sign this document electronically to move forward.

    5. **Execution and Confirmation**: We will execute the necessary trades to align
    your portfolio with the new strategy. We will then send a confirmation notice
    once the rebalancing is complete.


    **Confirmation of Completion**

    The request is resolved when you receive the ''Portfolio Rebalance Confirmation''
    document in your portal. This document will show your new asset distribution and
    confirm that the 0.85% annual advisory fee continues to apply to the updated balance.


    If you notice any errors in the resulting balances, please refer to Managed Portfolio
    — a discrepancy in your records or statement.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
