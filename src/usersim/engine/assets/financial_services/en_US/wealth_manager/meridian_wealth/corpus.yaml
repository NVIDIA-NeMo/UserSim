- id: d14a4332-6104-5441-ba9e-a8ddf6724deb
  title: Tax-Managed Portfolio — make a change or update
  body: 'Updating the parameters of your Tax-Managed Portfolio requires a structured
    process to ensure we maintain our fiduciary standard of care and adhere to your
    documented risk profile.


    **Requirements Before Starting:**

    Ensure you have a clear understanding of the change you wish to make (e.g., adjusting
    your risk tolerance or updating your financial goals) and be prepared to undergo
    identity verification.


    **Step 1: Initiation of Request**

    Inform us of the specific change you wish to implement. Whether you are adjusting
    your long-term goals or reacting to a change in your income bracket, provide the
    updated details clearly.


    **Step 2: Identity Verification**

    Because we maintain a zero-trust posture regarding account modifications, we will
    perform a rigorous identity verification. This will include multi-factor authentication
    (MFA) to ensure the request is authorized.


    **Step 3: Risk Profile Re-evaluation**

    If the change affects your investment appetite, we will conduct a new Risk Profiling
    session. This is necessary because all product recommendations must be rooted
    in your current risk profile and financial goals.


    **Step 4: Strategic Adjustment**

    Our portfolio strategists will review the requested changes against the Tax-Managed
    Portfolio''s objective of minimizing tax liabilities. We will then confirm the
    updated allocation strategy with you.


    **Step 5: Confirmation**

    We will provide a written confirmation of the update via the secure client portal.
    You will know the process is complete when the updated allocation and risk profile
    are reflected in your digital dashboard.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: how_to_guide
  source_authority: official
