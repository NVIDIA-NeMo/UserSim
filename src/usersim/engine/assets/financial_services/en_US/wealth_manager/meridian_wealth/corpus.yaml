- id: aac4b69f-7bfe-52e9-a89f-9900680f050b
  title: ESG Impact Portfolio — interest rate / APY schedule
  body: 'The ESG Impact Portfolio is an actively managed investment strategy rather
    than a fixed-income deposit account; therefore, it does not offer a guaranteed
    interest rate or a fixed Annual Percentage Yield (APY).


    Returns are generated through the performance of the underlying sustainable assets
    selected based on the client''s risk profile. The cost of this professional management
    is a flat annual advisory fee of 0.9%, which applies to all account balances regardless
    of size, provided the minimum investment of $250,000 is maintained.


    Performance and yield fluctuate based on market conditions and the specific ESG-compliant
    securities held within the portfolio. We do not quote a projected APY to ensure
    we remain compliant with our fiduciary duty and avoid misleading expectations.'
