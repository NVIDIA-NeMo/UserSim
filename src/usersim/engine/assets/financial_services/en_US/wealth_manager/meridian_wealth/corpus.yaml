- id: 77928af2-ee4f-5070-910b-5bfb841b1184
  title: Managed Portfolio — regulatory disclosures
  body: 'This disclosure governs the administration of the Managed Portfolio provided
    by Meridian Wealth. Our operations strictly adhere to SEC regulations and the
    fiduciary standards of the Advisers Act. We act as a fiduciary, meaning we are
    legally and ethically obligated to act solely in the client''s best interest at
    all times.


    **Fee Disclosure**

    Clients of the Managed Portfolio are charged a non-negotiable annual advisory
    fee of 0.85%. This fee is applied to the assets under management to ensure equitable
    treatment across our client base. The minimum investment required to maintain
    this account is $250,000. All fees are transparently disclosed and deducted in
    accordance with the signed account agreement.


    **Investment Risk and Advice Boundaries**

    All product recommendations are rooted in the client''s documented risk profile
    and financial goals. However, investment involves risk, including the potential
    loss of principal. While we provide holistic investment strategy and asset allocation,
    Meridian Wealth does not provide legal or tax filing advice. We expressly defer
    these matters to certified external professionals. Clients are encouraged to consult
    with their own tax advisors regarding the implications of their portfolio.


    **Privacy and Security**

    Data privacy is a cornerstone of the trust-based investor relationship at Meridian
    Wealth. We maintain a zero-trust posture regarding account modifications via unverified
    channels. Multi-factor authentication (MFA) and rigorous identity verification
    are mandatory before any state-changing action or movement of funds is executed.


    **Dispute Resolution**

    We approach disputes with a philosophy of rapid investigation and fair resolution.
    Initial reviews of reported discrepancies are conducted within 5-10 business days,
    with formal written determinations provided upon conclusion of the investigation.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: aac1ea79-2d21-5724-84cb-dd52d6e7dbb4
  title: Managed Portfolio — interest rate / APY schedule
  body: "The Managed Portfolio is an actively managed investment vehicle and does\
    \ not offer a fixed interest rate or a guaranteed Annual Percentage Yield (APY).\
    \ Instead, returns are generated through a diversified asset allocation based\
    \ on the client's specific risk profile.\n\nBecause this product is focused on\
    \ market-based growth and wealth preservation, the yield fluctuates based on market\
    \ performance and the specific assets held within the portfolio. The only fixed\
    \ percentage associated with this product is the annual advisory fee of 0.85%,\
    \ which is charged for professional management regardless of the portfolio's quarterly\
    \ performance. \n\nAny projected returns provided during the risk profiling process\
    \ are estimates and not guarantees. Changes to the portfolio's expected yield\
    \ would typically result from a formal update to the client's risk profile or\
    \ a strategic shift in asset allocation conducted by our Senior Portfolio Strategists."
  domain: wealth_management
  product_category: managed_portfolio
  document_type: rate_sheet
  source_authority: official
  placeholder: true
