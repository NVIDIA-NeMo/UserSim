  institution_id: meridian_wealth
- id: bc638f78-6c9a-5126-bdb6-5a26a76ac18d
  title: ESG Impact Portfolio — when to switch or upgrade
  body: 'Determining when to transition from the ESG Impact Portfolio depends on your
    evolving financial goals and the complexity of your wealth requirements.


    **Switching to Managed Portfolio**

    If your priorities shift from specific ESG impact goals to a more generalized,
    balanced risk approach, the Managed Portfolio — overview may be more suitable.
    While the ESG Impact Portfolio focuses on sustainable growth, the Managed Portfolio
    offers a foundational solution without specific sectoral exclusions.


    **Upgrading to Private Wealth Advisory**

    For clients whose portfolios grow significantly beyond the initial $250,000 minimum
    investment and who require bespoke, high-touch strategies, we recommend upgrading
    to the Private Wealth Advisory. This tier is designed for ultra-high-net-worth
    individuals who require a level of customization that exceeds the standardized
    mandates of the ESG Impact Portfolio.


    **Decision Matrix**

    - **Stay with ESG Impact Portfolio:** If your primary driver is aligning your
    $250,000+ investment with environmental and social governance and you are comfortable
    with the annual advisory fee of 0.9%.

    - **Switch/Upgrade:** If you require higher-touch bespoke management or if you
    no longer wish to adhere to ESG-specific investment constraints.'
  domain: wealth_management
  product_category: esg_portfolio
