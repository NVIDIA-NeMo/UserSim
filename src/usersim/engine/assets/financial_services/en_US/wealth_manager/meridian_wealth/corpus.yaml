    | Requirement | Threshold/Condition | Outcome |

    | :--- | :--- | :--- |

    | Minimum Investable Assets | $250,000 | Eligible for Account Opening |

    | Minimum Investable Assets | Below $250,000 | Ineligible for this product |

    | Risk Profile | Completed and Documented | Eligible for Asset Allocation |

    | Risk Profile | Not Completed | Pending Setup |

    | Identity Verification | MFA Successfully Validated | Eligible for Fund Movement
    |

    | Identity Verification | Failed or Unverified | Action Blocked |


    All eligible clients are subject to the same non-negotiable annual advisory fee
    of 0.85%.'
