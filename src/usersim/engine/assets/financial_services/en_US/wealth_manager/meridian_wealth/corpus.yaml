- id: 3305395c-fcca-58c2-bb33-f0141efc815f
  title: manage_authorized_users tool reference
  body: 'The `manage_authorized_users` tool is used to control which individuals have
    legal authorization to view or act upon a client''s account.


    **Tool Signature:** `manage_authorized_users(account_id: string, user_action:
    string, user_details: object)`


    **Arguments:**

    - `account_id`: The unique identifier for the account.

    - `user_action`: The operation to perform (e.g., ''add'', ''remove'', ''update_permissions'').

    - `user_details`: An object containing the user''s identity information and the
    specific access level granted.


    **Effect:** Updates the access control list (ACL) for the account, immediately
    granting or revoking permissions in the system.


    Agents perform this action by calling the tool directly after the primary account
    holder has been rigorously verified. This ensures that account security remains
    a cornerstone of our relationship with the investor.'
