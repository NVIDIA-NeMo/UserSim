- id: d5e1b3d1-5271-56d1-b8f4-fb1bb3e1d5e6
  title: Private Wealth Advisory — resolve a common request end-to-end
  body: "One of the most common requests for our ultra-high-net-worth clients is the\
    \ reallocation of assets to align with a shift in long-term financial goals. Because\
    \ we operate under a strict fiduciary standard, this process is thorough and documented.\n\
    \n**Requirements Before Starting**\nEnsure you have a clear understanding of your\
    \ new financial objectives and any changes to your tolerance for risk.\n\n**Step-by-Step\
    \ Process**\n1. **Initiate the Request**: Tell us that you wish to modify your\
    \ current asset allocation. \n2. **Update Risk Profiling**: We will lead you through\
    \ a refreshed Risk Profiling process. You will provide updated information regarding\
    \ your liquidity needs and your willingness to accept principal volatility in\
    \ exchange for potential returns.\n3. **Review Proposed Strategy**: Your Senior\
    \ Portfolio Strategist will develop a bespoke reallocation plan. We will present\
    \ this plan to you, detailing how the new allocation adheres to your updated risk\
    \ profile.\n4. **Formal Approval**: Once you provide your explicit approval of\
    \ the new strategy, we will execute the trades and rebalance your portfolio.\n\
    5. **Confirmation**: We will provide a final confirmation once the reallocation\
    \ is complete, including an updated summary of your holdings.\n\n**Verification\
    \ of Success**\n The process is complete when you receive the updated portfolio\
    \ summary in your secure portal. You will notice the new asset distribution reflecting\
    \ your updated goals, while the annual advisory fee of 0.75% continues to be applied\
    \ to the total managed assets.\n\nDisclaimer: While we provide holistic investment\
    \ strategy, we defer specific legal and tax filing advice to certified external\
    \ professionals to ensure the highest level of expertise."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: ae58a0bd-fa89-5108-87c0-4f350836c810
  title: Private Wealth Advisory — a discrepancy in your records or statement
  body: "A discrepancy in a Private Wealth Advisory statement is treated as a high-priority\
    \ matter given the complexity of bespoke portfolios. If you notice a balance,\
    \ transaction, or fee that does not align with your records, please follow this\
    \ resolution path.\n\n**Symptom**\n The client reports that a statement balance\
    \ is incorrect, a transaction is missing, or the applied annual advisory fee does\
    \ not match the expected 0.75% rate.\n\n**Likely Causes**\n* **Timing Differences**:\
    \ Transactions may be in a pending state and not yet reflected in the final statement\
    \ balance.\n* **Fee Calculation Cycle**: The advisory fee may have been applied\
    \ across a different period than the client's internal tracking.\n* **Asset Valuation\
    \ Lag**: Bespoke or illiquid assets within the Private Wealth Advisory tier may\
    \ have valuation dates that differ from standard equity prices.\n\n**Resolution\
    \ Steps**\n1. **Provide Documentation**: The client should share the specific\
    \ statement and the internal record that shows the discrepancy.\n2. **Internal\
    \ Audit**: We will perform a reconciliation of all account movements against the\
    \ documented strategy and our internal ledger.\n3. **Clarification**: If the discrepancy\
    \ is due to valuation lag or timing, we will provide a detailed explanation and\
    \ the corrected effective date.\n4. **Correction**: If an error is found, we will\
    \ apply the necessary correction to the account immediately.\n\n**Escalation and\
    \ Timeline**\nIf the discrepancy cannot be resolved through initial reconciliation,\
    \ we escalate the case to our Senior Portfolio Strategists and compliance team.\
    \ In accordance with our dispute philosophy, we conduct an initial review within\
    \ 5-10 business days. A formal written determination will be provided to the client\
    \ upon the conclusion of the investigation.\n\nDisclaimer: Our operations strictly\
    \ adhere to SEC regulations and the fiduciary standards of the Advisers Act."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
