- id: 5776f511-a342-5070-858f-e235ede0b37d
  title: ESG Impact Portfolio — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right wealth management vehicle requires a clear understanding
    of the trade-offs between impact, tax efficiency, and general growth. The ESG
    Impact Portfolio is designed specifically for those who view their capital as
    a tool for global change.


    **Comparative Analysis**

    - **Vs. Managed Portfolio:** The Managed Portfolio is our foundational solution.
    While it provides professional management, it does not apply the rigorous ESG
    filters found in the ESG Impact Portfolio. If you are indifferent to the environmental
    or social impact of your holdings and seek a broader market exposure, the Managed
    Portfolio is the more appropriate choice.

    - **Vs. Tax-Managed Portfolio:** The Tax-Managed Portfolio is optimized specifically
    to minimize tax liabilities for high-income earners. While the ESG Impact Portfolio
    focuses on *what* is being bought (impact), the Tax-Managed Portfolio focuses
    on *how* it is held (tax efficiency). If your primary financial pain point is
    tax erosion rather than sustainable alignment, the Tax-Managed Portfolio is superior.


    **When NOT to Choose the ESG Impact Portfolio**

    1. **Below Minimum Capital:** This product is not available for investments below
    $250,000.

    2. **Strict Performance Maximization:** Because we exclude certain sectors (e.g.,
    fossil fuels, weapons) to meet ESG standards, there may be periods where the portfolio
    underperforms the general market. If you are unwilling to sacrifice potential
    returns for impact, this is not the right product.

    3. **High Tax Sensitivity:** If your immediate priority is reducing current-year
    tax liabilities above all else, our specialized tax strategies are more effective.


    **Cost Summary**

    Regardless of the specific asset allocation within the strategy, the ESG Impact
    Portfolio maintains a transparent and non-negotiable annual advisory fee of 0.9%.


    ***Disclaimer:*** *All investments carry risk. Our fiduciary duty ensures that
    recommendations are based solely on your documented risk profile and financial
    goals.*'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: product_sheet
  source_authority: official
