- id: 6cca532f-0607-5678-bf3d-4ea31f2c1b8b
  title: Managed Portfolio — choosing between tiers or options
  body: "When selecting the appropriate management strategy, investors typically choose\
    \ between the Managed Portfolio and more specialized offerings based on their\
    \ specific tax and impact goals.\n\nManaged Portfolio: Our foundational solution.\
    \ It requires a minimum investment of $250,000 and carries an annual advisory\
    \ fee of 0.85%. This is best for clients seeking professional, balanced management\
    \ without specific tax-optimization or ESG constraints.\n\nTax-Managed Portfolio:\
    \ This is the superior choice for high-income earners specifically looking to\
    \ minimize tax liabilities. While both require professional fiduciary oversight,\
    \ the Tax-Managed Portfolio employs advanced strategies to reduce the tax drag\
    \ on returns.\n\nESG Impact Portfolio: This is the optimal choice for investors\
    \ who wish to align their financial growth with environmental, social, and governance\
    \ impact. \n\nIf you require a bespoke, high-touch strategy for an ultra-high-net-worth\
    \ portfolio, we recommend the Private Wealth Advisory tier. For a deeper dive\
