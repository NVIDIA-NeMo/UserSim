- id: d8023cb7-a538-5338-84f9-1652f13fcc7c
  title: When to use get_accounts
  body: 'The get_accounts tool serves as the primary directory service for resolving
    client identifiers. Due to our commitment to data privacy and security, we do
    not permit state-changing actions to be performed using ambiguous identifiers
    (such as the last four digits of an account number).


    This tool must be used in the following circumstances:

    1. As a prerequisite for any other tool call that requires a full account_id.

    2. When a client references multiple accounts and the agent must verify the total
    number of active relationships held at Meridian Wealth.

    3. To confirm the current product association (e.g., whether the client holds
    a Managed Portfolio or a Tax-Managed Portfolio) before initiating a product-specific
    query.


    Procedure:

    1. Initiate the conversation and perform mandatory identity verification and MFA.

    2. Once the identity is established, call get_accounts to retrieve the full list
    of account_ids associated with that verified identity.

    3. Match the client''s provided partial identifier (if any) to the full account_id
    returned by the tool.

    4. Use the resolved account_id for all subsequent tool calls in the session.


    This process ensures that we adhere to our zero-trust posture and prevent the
    accidental modification of incorrect accounts, thereby protecting the client''s
    assets and maintaining the integrity of our fiduciary care.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: meridian_wealth
- id: 0b191b39-0ec7-5b34-9634-b2910b97ad5f
  title: get_accounts tool reference
  body: 'The `get_accounts` tool allows the agent to retrieve a comprehensive list
    of all accounts associated with a verified client profile. We utilize this tool
    to identify specific account identifiers and current statuses, which is a prerequisite
    for most state-changing operations.


    **Tool Signature:** `get_accounts()`

    **Arguments:** None

    **Effect:** Returns a list of accounts, including account IDs, account types,
    and current balances.


    The agent performs this action by calling the tool directly within the secure
    session once the client''s identity has been established. This ensures that we
    maintain a zero-trust posture regarding account access, strictly adhering to our
    internal security and verification standards.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: meridian_wealth
- id: 58b6ee88-110b-58da-8fa6-6cc7d5589563
  title: When to use open_account
  body: 'At Meridian Wealth, we ensure that every new account is established with
    a rigorous commitment to our fiduciary duty, ensuring the product aligns with
    the client''s documented risk profile and financial goals. This policy governs
    the initiation of new investment vehicles, including our Managed Portfolio, Tax-Managed
    Portfolio, ESG Impact Portfolio, and Private Wealth Advisory tiers.


    To open a new account, the agent must follow these authoritative steps:


    1. **Identity Verification**: Confirm the client''s identity using the mandatory
    multi-factor authentication (MFA) and rigorous identity verification protocols.
    We maintain a zero-trust posture; no account may be opened via unverified channels.

    2. **Risk Alignment**: Verify that the client has a current risk profile on file.
    If the client is seeking a product that exceeds their documented risk tolerance,
    the agent must first facilitate a review of their Risk Profiling (the process
    of evaluating a client''s ability and willingness to lose principal in exchange
    for potential returns).

    3. **Product Selection**: Confirm the specific product choice based on the client''s
    needs (e.g., minimizing tax liabilities via the Tax-Managed Portfolio).

    4. **Fee Disclosure**: Clearly communicate the transparent, non-negotiable advisory
    fee structure associated with the chosen product to ensure equitable treatment
    across our client base.

    5. **Execution**: Call the `open_account` tool to formally establish the account
    in the system.


    We defer specific legal and tax filing advice to certified external professionals;
    therefore, the agent should not provide such guidance during the account opening
    process. For detailed requirements on specific product qualifications, refer to
    the relevant eligibility matrices.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: meridian_wealth
- id: f1e1d658-8013-5e6d-b695-f4f934009a3a
  title: open_account tool reference
  body: "The `open_account` tool is the authoritative mechanism for creating a new\
    \ investment account for a verified client. This tool executes the backend provisioning\
    \ of the account based on the selected strategy.\n\n**Tool Signature:** `open_account(product_id:\
    \ string, account_details: object)`\n**Arguments:** \n- `product_id`: The unique\
    \ identifier for the chosen product (e.g., `managed_portfolio`, `tax_managed_portfolio`,\
    \ `esg_portfolio`, or `private_wealth_advisory`).\n- `account_details`: A structured\
    \ object containing the necessary account configurations and client preferences.\n\
    **Effect:** Creates a new account and returns the new account identifier.\n\n\
    The agent performs this action by calling the tool directly. This action is state-changing\
    \ and requires a previously verified identity session to comply with SEC regulations\
    \ and the Advisers Act."
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: meridian_wealth
- id: 414c9748-ae48-5798-b56a-789cb4d2e6f3
  title: When to use close_account
  body: 'The closure of an account at Meridian Wealth is an irreversible action that
    requires the highest level of security scrutiny to protect our clients'' assets
    and maintain our fiduciary standard of care. We approach these requests with professional
    poise and a commitment to full disclosure of the implications of closure.


    To close an account, the agent must adhere to the following sequence:


    1. **Strict Identity Verification**: Because this is an irreversible action, the
    agent must perform mandatory multi-factor authentication (MFA) and rigorous identity
    verification. No account closure may be initiated via unverified channels.

    2. **Account Identification**: Use the `get_accounts` tool to resolve the specific
    account ID from the client''s request (e.g., from a last-four digit reference).

    3. **Balance Resolution**: Ensure that all remaining assets are accounted for
    and determine the method of fund movement. All movements of funds require MFA.

    4. **Fiduciary Review**: Confirm that the closure does not leave the client in
    a position of undue risk, though the final decision rests with the client.

    5. **Execution**: Call the `close_account` tool to finalize the termination of
    the account.


    Following the execution, the agent should provide the client with a confirmation
    of the closure. If the closure is the result of a dispute, the agent must follow
    our philosophy of rapid investigation, where initial reviews are conducted within
    5-10 business days, with formal written determinations provided upon conclusion.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: meridian_wealth
- id: 5f0d3d9d-c90b-5ab6-bc99-16ec1362f219
  title: close_account tool reference
  body: "The `close_account` tool is used to permanently terminate a client's investment\
    \ account. This is an irreversible state-changing action.\n\n**Tool Signature:**\
    \ `close_account(account_id: string)`\n**Arguments:** \n- `account_id`: The unique\
    \ identifier of the account to be closed.\n**Effect:** Permanently closes the\
    \ specified account and marks it as inactive in the ledger.\n\nThe agent performs\
    \ this action by calling the tool directly. Due to the irreversible nature of\
    \ this operation, it is only permissible after rigorous identity verification\
    \ and MFA have been successfully completed. We maintain a zero-trust posture regarding\
    \ account modifications initiated via unverified channels."
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: meridian_wealth
- id: 7e220d94-a0da-5ad7-a4de-ecda64f76df4
  title: When to use update_contact_info
  body: 'Maintaining accurate client data is a cornerstone of the trust-based investor
    relationship at Meridian Wealth. We prioritize data privacy and security, ensuring
    that contact information is only updated through authenticated and verified channels
    to prevent unauthorized account access or fraudulent redirections.


    To update a client''s contact information, the agent must follow these steps:


    1. **Verification**: Perform mandatory multi-factor authentication (MFA) to verify
    the client''s identity. We do not accept contact updates via unverified email
    or phone requests.

    2. **Information Gathering**: Collect the updated details (e.g., new primary residence,
    email address, or phone number) and ensure they are provided clearly.

    3. **Consistency Check**: Verify that the updated information does not conflict
    with existing regulatory requirements or identity documentation on file.

    4. **Execution**: Call the `update_contact_info` tool to commit the changes to
    the client''s secure profile.

    5. **Confirmation**: Notify the client via their previously verified contact method
    that the update has been successfully processed.


    Our operations strictly adhere to SEC regulations; therefore, any suspicious patterns
    in contact updates must be escalated immediately to a Senior Portfolio Strategist
    for complex resolution. We maintain a zero-trust posture regarding any request
    that bypasses our standard MFA protocols.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: meridian_wealth
- id: 4a3cb308-4dfc-5c58-8280-be0ef33e7687
  title: update_contact_info tool reference
  body: "The `update_contact_info` tool allows the agent to modify the personal contact\
    \ details associated with a client's profile. This is a state-changing operation.\n\
    \n**Tool Signature:** `update_contact_info(contact_details: object)`\n**Arguments:**\
    \ \n- `contact_details`: An object containing the fields to be updated (e.g.,\
    \ address, email, phone).\n**Effect:** Updates the client's contact records in\
    \ the central database.\n\nThe agent performs this action by calling the tool\
    \ directly. This action must only be taken after the client's identity has been\
    \ verified through mandatory MFA and identity verification processes to ensure\
    \ the integrity of the client's data privacy."
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: meridian_wealth
- id: db28d9ab-80eb-5df7-aec4-18a445f240ee
  title: When to use get_statements
  body: 'Meridian Wealth is committed to transparency and the full disclosure of portfolio
    performance. We provide clients with access to their official account statements,
    which detail their asset allocation, advisory fees, and overall growth in alignment
    with their specific risk profile.


    To provide statements to a client, the agent must follow these steps:


    1. **Identity Verification**: Confirm the client''s identity through mandatory
    multi-factor authentication (MFA). Statements contain sensitive financial data
    and cannot be released via unverified channels.

    2. **Account Identification**: Use the `get_accounts` tool to identify the specific
    account(s) for which the client requires statements.

    3. **Parameter Specification**: Determine the specific time frame or statement
    period requested by the client (e.g., monthly, quarterly, or annual).

    4. **Execution**: Call the `get_statements` tool to retrieve the requested documents.

    5. **Delivery**: Provide the statements to the client via the secure client portal
    or as a secure attachment through our authorized communication channels.


    If a client reports a discrepancy in their records or statements, the agent should
    guide them through our dispute resolution process. We approach disputes with a
    philosophy of rapid investigation and fair resolution, with initial reviews conducted
    within 5-10 business days. For further guidance on handling discrepancies, refer
    to the relevant troubleshooting documentation.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: meridian_wealth
- id: 0681c171-f979-51c5-b465-af35910c849f
  title: get_statements tool reference
  body: "The `get_statements` tool retrieves official financial statements for a client's\
    \ specified account. This is a read-only operation.\n\n**Tool Signature:** `get_statements(account_id:\
    \ string, statement_period: string)`\n**Arguments:** \n- `account_id`: The unique\
    \ identifier of the account.\n- `statement_period`: The specific time frame for\
    \ the statement (e.g., '2023-Q4').\n**Effect:** Returns the account statements\
    \ for the given period.\n\nThe agent performs this action by calling the tool\
    \ directly. Access to statements is strictly governed by our security and verification\
    \ protocols, requiring a verified identity session to ensure that sensitive financial\
    \ data is only disclosed to the authorized account holder."
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: meridian_wealth
- id: f867539e-5948-561f-8f09-d2d25be16291
  title: When to use update_beneficiary
  body: 'Designating beneficiaries is a critical component of a holistic investment
    strategy and estate planning. At Meridian Wealth, we ensure that these designations
    are handled with the utmost precision and security to honor the client''s wishes
    and maintain our fiduciary duty.


    To update a beneficiary, the agent must follow these authoritative steps:


    1. **Rigorous Verification**: Perform mandatory multi-factor authentication (MFA)
    and identity verification. Given the legal implications of beneficiary designations,
    we maintain a zero-trust posture regarding these modifications.

    2. **Account Identification**: Use the `get_accounts` tool to ensure the update
    is applied to the correct account(s).

    3. **Information Collection**: Collect the full legal names, relationship to the
    client, and the specific percentage of assets allocated to each beneficiary. The
    total allocation must equal 100%.

    4. **External Advice Disclaimer**: Explicitly remind the client that while we
    provide holistic asset allocation, we defer specific legal and tax filing advice
    to certified external professionals. We recommend the client consult with a legal
    expert regarding the implications of their beneficiary choices.

    5. **Execution**: Call the `update_beneficiary` tool to update the account records.

    6. **Confirmation**: Provide the client with a written confirmation of the updated
    beneficiary designations.


    Any request to update beneficiaries that appears anomalous or conflicts with previously
    established legal documents must be escalated to a Senior Portfolio Strategist
    for a thorough review.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: meridian_wealth
- id: 1effd91c-56f1-5a49-ac59-339b0be6cf33
  title: update_beneficiary tool reference
  body: "The `update_beneficiary` tool allows the agent to modify the designated beneficiaries\
    \ for a client's account. This action is critical for ensuring the proper distribution\
    \ of assets according to the client's estate planning wishes. \n\n**Tool Signature:**\
    \ `update_beneficiary(account_id: string, beneficiary_details: object)`\n\n**Arguments:**\n\
    - `account_id`: The unique identifier of the wealth management account.\n- `beneficiary_details`:\
    \ An object containing the full legal name, relationship, and percentage allocation\
    \ for each beneficiary. Total allocations must equal 100%.\n\n**Effect:** Updates\
    \ the legal beneficiary records associated with the specified account in the core\
    \ ledger. \n\nAgents perform this action by calling the tool directly within the\
    \ secure session after the client's identity has been rigorously verified. We\
    \ do not direct clients to external forms for this specific update process."
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: meridian_wealth
- id: 38aedd19-5c76-565b-97e3-f94f244299c6
  title: When to use set_alerts
  body: "To maintain our commitment to transparency and proactive communication, we\
    \ provide clients with customizable notification systems. The `set_alerts` mechanism\
    \ is used to establish triggers for account activity, balance thresholds, or portfolio\
    \ performance milestones. \n\nWe utilize this procedure when a client expresses\
    \ a need for real-time monitoring of their assets or when specific risk-profile\
    \ adjustments necessitate closer oversight of account movements. \n\n**Procedure\
    \ for Implementation:**\n1. **Identity Verification:** Confirm the client's identity\
    \ using mandatory multi-factor authentication (MFA) to adhere to our zero-trust\
    \ security posture.\n2. **Account Identification:** Use `get_accounts` to resolve\
    \ the specific `account_id` associated with the client's request (e.g., matching\
    \ a provided last-4 digit identifier).\n3. **Parameter Definition:** Define the\
    \ alert criteria, including the event trigger (e.g., a deposit over a certain\
    \ amount) and the preferred delivery channel (secure portal or email).\n4. **Execution:**\
    \ Call the `set_alerts` tool using the identified `account_id` and the defined\
    \ alert parameters.\n5. **Confirmation:** Verbally or textually confirm to the\
    \ client that the alerts are now active.\n\nAll alert configurations are subject\
    \ to our data privacy standards, which we view as a cornerstone of the trust-based\
    \ investor relationship. For further details on account maintenance, refer to\
    \ update_contact_info tool reference."
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: meridian_wealth
- id: 7fc24094-b367-56d1-aa02-3ea819e8d4f6
  title: set_alerts tool reference
  body: 'The `set_alerts` tool is used by agents to configure automated notifications
    for client accounts based on specific activity or value-based triggers.


    **Tool Signature:** `set_alerts(account_id: string, alert_criteria: object)`


    **Arguments:**

    - `account_id`: The unique identifier for the account to be monitored.

    - `alert_criteria`: An object specifying the trigger event (e.g., balance drop,
    large transaction, or periodic review) and the notification method.


    **Effect:** Registers the specified triggers within the client''s notification
    profile, ensuring they receive timely updates via their chosen secure channels.


    Agents execute this action by calling the tool directly. This eliminates the need
    for the client to navigate complex settings menus independently, maintaining our
    high-touch service model.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: meridian_wealth
- id: 3bad2e40-62ed-5269-a405-ecf96b2bcdba
  title: When to use fund_account
  body: 'Funding an account is a primary state-changing action that requires strict
    adherence to our security and verification protocols. We use the `fund_account`
    process to facilitate the movement of capital into a client''s selected investment
    vehicle, whether it be a Managed Portfolio or a more bespoke Private Wealth Advisory
    strategy.


    This procedure is invoked during the initial onboarding phase or when a client
    wishes to increase their asset allocation based on a revised financial plan.


    **Procedure for Implementation:**

    1. **Identity Verification:** Perform rigorous identity verification and MFA.
    We maintain a zero-trust posture regarding the movement of funds.

    2. **Account Resolution:** Utilize `get_accounts` to determine the exact `account_id`
    where the funds should be deposited.

    3. **Funding Detail Collection:** Obtain the source of funds, the exact dollar
    amount, and the transfer method from the client.

    4. **Tool Execution:** Call the `fund_account` tool, providing the `account_id`,
    the amount, and the source account details.

    5. **Verification of Transfer:** Confirm the initiation of the transfer and provide
    the client with the expected timeframe for the funds to reflect in their balance.


    Because we operate as a fiduciary, we ensure all funding actions align with the
    client''s documented risk profile. If the funding amount significantly alters
    the portfolio''s risk posture, the agent should suggest a review via schedule_advisor_meeting
    tool reference.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - fund_account
  institution_id: meridian_wealth
- id: 889df32f-9842-532d-a3f7-8b9ca55adf70
  title: fund_account tool reference
  body: 'The `fund_account` tool enables the agent to initiate the transfer of assets
    into a client''s account at Meridian Wealth.


    **Tool Signature:** `fund_account(account_id: string, amount: number, source_details:
    object)`


    **Arguments:**

    - `account_id`: The target account receiving the funds.

    - `amount`: The specific numerical value of the deposit in USD.

    - `source_details`: An object containing the originating institution and account
    information.


    **Effect:** Triggers the electronic transfer process and creates a pending transaction
    record in the client''s ledger.


    Agents perform this action by calling the tool directly. In accordance with our
    security posture, this tool cannot be invoked without a successfully completed
    identity verification sequence in the current session.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - fund_account
  institution_id: meridian_wealth
- id: 0d39b0e2-d554-5659-89c5-4a52e0628eb7
  title: When to use generate_financial_plan
  body: "At Meridian Wealth, we provide holistic investment strategy and asset allocation\
    \ based on a fiduciary standard of care. The `generate_financial_plan` tool is\
    \ our primary mechanism for synthesizing client goals, risk tolerance, and current\
    \ assets into a cohesive roadmap.\n\nThis tool should be used during initial consultations,\
    \ annual reviews, or following a significant life event (e.g., inheritance or\
    \ retirement) that necessitates a shift in strategy. \n\n**Procedure for Implementation:**\n\
    1. **Identity Verification:** Verify the client's identity via secure channels.\n\
    2. **Data Review:** Review the current portfolio using `get_portfolio` and ensure\
    \ the client's risk profile is up-to-date using `update_risk_profile` if necessary.\n\
    3. **Goal Alignment:** Confirm the client's short-term and long-term financial\
    \ objectives during the consultation.\n4. **Execution:** Call the `generate_financial_plan`\
    \ tool, passing the `account_id` and any updated financial parameters.\n5. **Delivery:**\
    \ Present the generated plan to the client for review and discussion.\n\n**Important\
    \ Boundary:** While the financial plan provides holistic strategy, we defer specific\
    \ legal and tax filing advice to certified external professionals. The plan is\
    \ a strategic guide, not a legal document. For details on tax-specific strategies,\
    \ refer to Tax-Managed Portfolio — overview."
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - generate_financial_plan
  institution_id: meridian_wealth
- id: 3c5dee20-a9b2-5e0f-a795-d1212298f6e1
  title: generate_financial_plan tool reference
  body: 'The `generate_financial_plan` tool creates a comprehensive strategic financial
    roadmap based on a client''s current assets and future goals.


    **Tool Signature:** `generate_financial_plan(account_id: string, goals: object,
    risk_tolerance: string)`


    **Arguments:**

    - `account_id`: The identifier for the client account.

    - `goals`: An object defining the client''s financial objectives (e.g., retirement
    date, desired annual income).

    - `risk_tolerance`: The client''s documented risk level (e.g., Conservative, Moderate,
    Aggressive).


    **Effect:** Produces a detailed financial plan document that outlines recommended
    asset allocation and projected growth paths.


    Agents execute this action by calling the tool directly. The resulting plan serves
    as the foundation for subsequent product recommendations, ensuring all advice
    is rooted in the client''s documented financial goals.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - generate_financial_plan
