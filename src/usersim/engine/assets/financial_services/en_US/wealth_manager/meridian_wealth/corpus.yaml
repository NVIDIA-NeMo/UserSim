- id: cd86328a-a71c-5ad3-9b8d-fcea23c73cc4
  title: Managed Portfolio — overview
  body: 'The Managed Portfolio serves as our foundational investment solution, meticulously
    crafted for clients who seek professional oversight paired with a balanced risk
    approach. At Meridian Wealth, we operate under a strict Fiduciary Duty—the legal
    and ethical obligation to act solely in the client''s best interest—ensuring that
    every asset allocation decision is aligned with your documented financial goals.


    Our process begins with rigorous Risk Profiling, where we evaluate your ability
    and willingness to lose principal in exchange for potential returns. This ensures
    that the Managed Portfolio is tailored to your specific tolerance for volatility.
    We provide holistic investment strategy and asset allocation; however, please
    be advised that we defer specific legal and tax filing advice to certified external
    professionals.


    To maintain the quality of our oversight and the efficacy of our strategies, the
    Managed Portfolio requires a minimum investment of $250,000. Our compensation
    is structured to align our success with the growth of your assets through a transparent
    Advisory Fee. For this product, we charge an annual advisory fee of 0.85%. These
    fees are non-negotiable to ensure equitable treatment across our entire client
    base.


    Our commitment to transparency extends to our compliance posture. We strictly
    adhere to SEC regulations and the fiduciary standards of the Advisers Act, prioritizing
    full disclosure of conflicts and framing data privacy as a cornerstone of our
    trust-based relationship. By combining professional management with a disciplined
    risk framework, we provide a poised path toward long-term wealth preservation
    and growth.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 679e53d4-7fc4-5ac6-b3ac-7cb972a761af
  title: Managed Portfolio — advisory fee annual explained
  body: '### How is the advisory fee calculated for my Managed Portfolio?

    We employ a transparent fee structure where the annual advisory fee of 0.85% is
    applied to the assets under our management. This fee covers the continuous professional
    portfolio management, periodic rebalancing, and the ongoing financial guidance
    provided by your dedicated Relationship Manager.


    ### Why is the fee non-negotiable?

    To ensure equitable treatment across our client base, our fees are based on the
    specific complexity and active management required for each product. By maintaining
    a standard annual advisory fee of 0.85% for the Managed Portfolio, we ensure that
    all clients receive the same rigorous standard of fiduciary care without disparity.


    ### When is the fee deducted from my account?

    Fees are typically accrued and deducted on a quarterly basis, though they are
    quoted as an annual percentage. For a detailed breakdown of all costs, please
    refer to the Managed Portfolio — fee schedule.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: faq
  source_authority: official
