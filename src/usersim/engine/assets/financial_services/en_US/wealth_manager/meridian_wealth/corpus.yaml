  institution_id: meridian_wealth
- id: e1d5c4fc-c2bb-52a6-8416-0e66e02b51ad
  title: Managed Portfolio — check status or history
  body: 'Monitoring the performance and history of your Managed Portfolio is essential
    for maintaining alignment with your long-term financial goals. Follow these steps
    to review your account status.


    **Prerequisites**

    You must have your secure client portal credentials active and your multi-factor
    authentication (MFA) device available.


    **Steps to Review Account Status**

    1. **Request a Current Valuation**: Ask us for your most recent portfolio valuation.
    We will provide a real-time snapshot of your total assets under management and
    the current allocation of your holdings.

    2. **Review Performance History**: Ask us to provide your performance history
    for a specific period (e.g., quarterly or annually). We will deliver a detailed
    report showing the growth of your assets relative to the benchmarks established
    during your risk profiling.

    3. **Verify Fee Deductions**: Ask us to provide a summary of the advisory fees
    charged to date. We will confirm the application of the 0.85% annual advisory
    fee, detailing how it was calculated based on your average daily balance.

    4. **Audit Transaction History**: Ask us for a ledger of all movements within
    the portfolio. We will provide a comprehensive list of all buy/sell actions and
    any deposits or withdrawals made from the account.


    **Confirmation of Completion**

    You will know the process is complete when you have received the requested reports
    via the secure client portal. These documents will clearly display your current
    balance, the cumulative effect of the 0.85% annual advisory fee, and your current
    asset distribution.


    For a more formal monthly or quarterly review, you may refer to Managed Portfolio
    — a discrepancy in your records or statement if you notice any inconsistencies.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 621f5d2b-438b-506a-9164-8856e35d014b
  title: Managed Portfolio — a declined or blocked action
  body: 'You may occasionally find that a request to move funds or modify your Managed
    Portfolio is declined or blocked. Because we operate as a fiduciary with a zero-trust
    security posture, these blocks are typically protective measures.


    **Common Symptoms**

    - A request to withdraw funds is denied despite sufficient balance.

    - An attempt to change account beneficiaries or contact information is blocked.

    - A request to alter the investment strategy is declined.


    **Likely Causes**

    1. **Verification Failure**: The most common cause is a failure in identity verification.
    Multi-factor authentication (MFA) is mandatory before any state-changing action
    or movement of funds.

    2. **Minimum Balance Protection**: A withdrawal request may be blocked if it would
    bring the portfolio balance significantly below the minimum investment of $250,000
    without prior coordination with a Relationship Manager.

    3. **Risk Profile Mismatch**: A request to change assets may be blocked if the
    new allocation contradicts your documented risk profile.


    **Resolution Steps**

    1. **Verify Identity**: Ensure you have completed the required MFA challenge.
    If you are unable to access your MFA device, let us know, and we will initiate
    our rigorous manual identity verification process.

    2. **Review Risk Constraints**: If a strategy change was blocked, ask us to review
    your current risk profile. We can then determine if your financial goals have
    evolved, necessitating a new risk profiling session.

    3. **Coordinate Withdrawals**: For requests involving large sums that affect the
    $250,000 minimum, ask us to schedule a consultation with your Relationship Manager
    to discuss the impact on your holistic strategy.


    **Escalation**

    If the block persists after verification, we will escalate the matter from your
    Relationship Manager to a Senior Portfolio Strategist. You will receive a notification
    of the escalation and a resolution timeline within 5-10 business days.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: c57fab3c-e86c-5f3c-95e5-92042be67916
  title: Managed Portfolio — when to switch or upgrade
  body: 'As your financial situation evolves, the Managed Portfolio may no longer
    be the optimal vehicle for your wealth. We recommend considering an upgrade or
    transition in the following scenarios:


    **Switch to Tax-Managed Portfolio**

    If you have entered a higher income tax bracket and your primary goal is to minimize
    annual tax liabilities rather than simply maintaining a balanced risk approach,
    the Tax-Managed Portfolio is the superior choice. While the Managed Portfolio
    focuses on holistic allocation, the Tax-Managed version is specifically optimized
    for tax efficiency.


    **Upgrade to Private Wealth Advisory**

    When your assets grow significantly beyond the $250,000 minimum and you require
    bespoke, high-touch strategies that go beyond a balanced risk approach, you should
    upgrade to Private Wealth Advisory. This exclusive tier is designed for ultra-high-net-worth
    portfolios that require custom-tailored mandates.


    **Switch to ESG Impact Portfolio**

    If your priorities shift toward aligning financial growth with environmental,
    social, and governance impact, the ESG Impact Portfolio should replace the Managed
    Portfolio.


    Regardless of the choice, all our products are rooted in a fiduciary standard
    of care. For a detailed comparison of fees and thresholds, please refer to Managed
    Portfolio — vs. a similar product here.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 1744dbe0-c427-5473-86bf-d46dc1748a4a
  title: Managed Portfolio — comparison vs. alternatives and when not to choose it
  body: 'The Managed Portfolio serves as our foundational investment solution, designed
    for those seeking professional management with a balanced risk approach. However,
    it is not the appropriate choice for every investor.


    **When to Choose the Managed Portfolio**

    This product is ideal for investors who meet the minimum investment of $250,000
    and desire a disciplined, fiduciary-led strategy without the need for extreme
    specialization. It provides a sophisticated balance of growth and preservation,
    managed at a transparent annual advisory fee of 0.85%.


    **When to Choose Alternatives**

    - **For Tax Optimization**: If your primary concern is the reduction of tax drag
    on a high-income portfolio, our Tax-Managed Portfolio is a more effective tool.
    The Managed Portfolio provides holistic strategy but does not prioritize tax-loss
    harvesting to the same extent.

    - **For Values-Based Investing**: If your investment mandate requires strict adherence
    to ESG (Environmental, Social, and Governance) criteria, you should select the
    ESG Impact Portfolio.

    - **For Ultra-High-Net-Worth Needs**: Clients requiring bespoke, highly complex
    strategies and white-glove service should move directly to Private Wealth Advisory,
    as the Managed Portfolio follows a more standardized (though professionally managed)
    balanced approach.


    **When NOT to Choose This Product**

    1. **Below Minimum Capital**: If you cannot commit the minimum investment of $250,000,
    this product is unavailable.

    2. **Desire for Self-Direction**: Because we provide professional management based
    on a documented risk profile, this is not for investors who wish to execute individual
    trades or maintain total discretionary control over specific security selection.

    3. **Negotiable Fees**: Our advisory fee of 0.85% is non-negotiable to ensure
    equitable treatment across our client base. Investors seeking a negotiable fee
    structure will find our model incompatible with their preferences.


    For more on our fiduciary obligations, see Managed Portfolio — regulatory disclosures.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 5a782356-e7e4-5d28-aa52-8dbf744d6efb
  title: Managed Portfolio — how-to / step-by-step
  body: '**How do I update my risk profile for my Managed Portfolio?**

    To change your investment strategy, first ask us to initiate a risk profiling
    review. We will guide you through a new assessment of your financial goals and
    risk tolerance. Once the updated profile is documented and signed, we will rebalance
    your portfolio to align with the new parameters.


    **How is the advisory fee paid?**

    You do not need to make manual payments. The annual advisory fee of 0.85% is automatically
    deducted from your account assets on a pro-rata basis. This ensures that our success
    is directly aligned with the growth of your assets.


    **How do I add more funds to my portfolio?**

    Simply notify us of the amount you wish to contribute. We will provide the secure
    wiring instructions. Once the funds arrive, we will allocate them according to
    your current risk profile. For more details, see Managed Portfolio — set up and
    activate.'
