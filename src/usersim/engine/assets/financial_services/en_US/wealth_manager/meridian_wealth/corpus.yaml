- id: 0b015ef0-ccf8-5b60-94ec-6c737465d8f2
  title: Private Wealth Advisory — account security best practices
  body: 'At Meridian Wealth, we view data privacy as a cornerstone of the trust-based
    relationship we maintain with our ultra-high-net-worth clients. Given the bespoke
    nature of the Private Wealth Advisory service, your accounts may be targets for
    sophisticated social engineering. We urge you to adhere to the following security
    protocols to protect your principal.


    First, multi-factor authentication (MFA) is mandatory for all access to your secure
    client portal. We maintain a zero-trust posture; therefore, any request to modify
    account details or move funds via unverified channels—such as an unexpected email
    or a text message—will be rejected. We will never ask you to provide your MFA
    codes, passwords, or full social security number via email or SMS.


    Be vigilant regarding ''urgent'' requests for fund transfers. Any state-changing
    action, including the movement of assets, requires rigorous identity verification.
    If you receive a communication that appears to be from your Relationship Manager
    but creates an artificial sense of urgency or requests a deviation from our established
    verification protocols, please treat it as fraudulent.


    Should you suspect that your credentials have been compromised or notice an unauthorized
    attempt to access your portfolio, you must notify us immediately. Reporting suspicious
    activity within 24 hours of discovery is critical to mitigating potential loss
    and ensuring a rapid investigation. We approach all security disputes with a philosophy
    of fair resolution, typically conducting initial reviews within 5-10 business
    days.


    For further details on how we protect your assets, please refer to Private Wealth
    Advisory — regulatory disclosures.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 518b520a-9afa-52db-a292-616886b9c4fb
  title: Private Wealth Advisory — change-of-terms policy
  body: "This document outlines the policy governing modifications to the terms of\
    \ the Private Wealth Advisory agreement. As a premier fiduciary, Meridian Wealth\
    \ is committed to transparency and equitable treatment across our client base.\n\
    \nOur current fee structure includes an annual advisory fee of 0.75%. This fee\
    \ is non-negotiable to ensure that all clients receive an equitable standard of\
    \ professional management relative to the complexity of their portfolios. Similarly,\
    \ the minimum investment threshold of $1,000,000 is a binding requirement for\
    \ maintaining the bespoke status of this tier.\n\nMeridian Wealth reserves the\
    \ right to amend the advisory fee or the minimum investment requirements to reflect\
    \ changes in market conditions or the cost of active management. We will provide\
    \ formal written notice of any such changes at least 60 calendar days prior to\
    \ the effective date. Such notices will be delivered via the secure client portal\
    \ or registered mail.\n\nUpon receipt of a notice of change, clients have 30 calendar\
    \ days to provide written consent or to initiate the closure of their account.\
    \ If no action is taken by the end of the notice period, the new terms will be\
    \ deemed accepted and applied to the account. \n\nTermination of this agreement\
    \ may be initiated by either party. In the event of account closure, any accrued\
    \ but unpaid portion of the 0.75% annual advisory fee will be deducted from the\
    \ remaining assets prior to the final distribution of funds. All closures are\
    \ subject to the standard settlement periods of the underlying assets in the portfolio."
