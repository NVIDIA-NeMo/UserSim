- id: 7428eadd-072d-599e-9ef7-266284d40a8b
  title: Managed Portfolio — privacy and data handling
  body: "Meridian Wealth adheres to strict SEC regulations and the fiduciary standards\
    \ of the Advisers Act. We treat data privacy as a cornerstone of the trust-based\
    \ investor relationship, particularly for clients maintaining the minimum investment\
    \ of $250,000 in our Managed Portfolio.\n\nData Collection and Use: We collect\
    \ personal and financial data solely to perform rigorous risk profiling and to\
    \ implement asset allocation strategies that align with your documented goals.\
    \ This data is used to ensure that every investment recommendation is rooted in\
    \ your specific risk tolerance and financial capacity.\n\nThird-Party Disclosure:\
    \ As a fiduciary, we do not sell client data. We disclose information to external\
    \ parties only when required by law or when necessary to facilitate the management\
    \ of your assets. Please be advised that while we provide holistic strategy, we\
    \ defer specific legal and tax filing advice to certified external professionals;\
    \ any data shared with these professionals is done so only with your explicit\
    \ consent.\n\nSecurity Protocols: To protect your assets and identity, we employ\
    \ multi-factor authentication (MFA) and a zero-trust posture regarding account\
    \ modifications. Any state-changing action or movement of funds requires rigorous\
    \ identity verification. \n\nConfidentiality: All communications regarding your\
    \ portfolio, including the application of the 0.85% annual advisory fee, are handled\
    \ through our secure client portal or verified channels. We maintain full disclosure\
    \ of any potential conflicts of interest, ensuring that our obligation to act\
    \ solely in your best interest remains paramount. For further information on risk,\
    \ refer to Managed Portfolio — risk disclosures."
