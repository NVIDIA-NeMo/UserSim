- id: 36fb520f-4bf3-5e04-ac80-fe13b6ddea4d
  title: Managed Portfolio — account security best practices
  body: "At Meridian Wealth, we view data privacy as a cornerstone of the trust-based\
    \ investor relationship. Given the significant assets typically held within a\
    \ Managed Portfolio, these accounts are often targets for sophisticated social\
    \ engineering. To maintain the integrity of your holdings, we mandate the use\
    \ of multi-factor authentication (MFA) for all portal access. \n\nWe maintain\
    \ a zero-trust posture regarding account modifications. We will never request\
    \ your password, MFA codes, or full Social Security number via an unverified email\
    \ or text message. Be particularly vigilant against 'urgent' requests to move\
    \ funds to a 'safe harbor' account; this is a hallmark of fraudulent activity.\
    \ \n\nOur security protocols require rigorous identity verification before any\
    \ state-changing action or movement of funds is executed. If you receive a communication\
    \ that appears to be from us but requests that you bypass these security steps,\
    \ treat it as a security breach. The first action you should take is to notify\
    \ your Relationship Manager immediately through our secure client portal. To ensure\
    \ the most robust protection and limit potential liability, we require that any\
    \ suspected unauthorized activity be reported to us within 48 hours of discovery.\
    \ We approach all such disputes with a philosophy of rapid investigation, conducting\
    \ initial reviews within 5-10 business days to reach a fair resolution."
  domain: wealth_management
  product_category: managed_portfolio
  document_type: security_advisory
  source_authority: official
