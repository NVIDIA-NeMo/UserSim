- id: deb327cd-7629-59b4-b3b9-3600c773c297
  title: Tax-Managed Portfolio — account security best practices
  body: 'At Meridian Wealth, we view data privacy and account integrity as the cornerstones
    of the trust-based relationship we maintain with our clients. Given the high-value
    nature of the Tax-Managed Portfolio, we urge all clients to adhere to the following
    security protocols to protect their assets.


    First, multi-factor authentication (MFA) is mandatory for all account access.
    We maintain a zero-trust posture regarding account modifications; therefore, any
    request to change your risk profile, update contact information, or move funds
    will require rigorous identity verification. We will never ask you to provide
    your password or MFA codes via email or unverified messaging channels.


    Be vigilant against ''urgent'' requests that bypass our standard secure client
    portal. Any state-changing action involving your portfolio—particularly those
    impacting your tax-managed assets—must be verified through our established security
    channels. If you detect any unauthorized attempt to access your account or receive
    a communication that seems incongruous with our sophisticated tone, please notify
    us immediately. Rapid reporting is essential; any suspected fraud must be reported
    within 24 hours to ensure the fastest possible investigation and resolution.


    We approach all security disputes with a philosophy of rapid investigation. Initial
    reviews are conducted within 5-10 business days, and we provide a formal written
    determination upon the conclusion of the investigation. By maintaining these rigorous
    standards, we ensure that your investment of $500,000 or more remains secure and
    managed according to your documented goals.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: f61f4d53-9044-51e2-8321-7be48610e45a
