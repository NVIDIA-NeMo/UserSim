- id: 6e5ab838-d856-50dd-a72d-24ec79d792ce
  title: ESG Impact Portfolio — vs. a typical competitor offering
  body: 'When comparing the ESG Impact Portfolio to typical competitor ESG offerings,
    the primary distinctions lie in the fiduciary standard and fee transparency.


    Many competitors utilize a ''broker-dealer'' model, where advisors may be incentivized
    to recommend specific ESG funds based on commissions. In contrast, Meridian Wealth
    operates under a strict fiduciary duty, meaning we are legally obligated to act
    solely in your best interest. We employ a transparent, non-negotiable annual advisory
    fee of 0.9%, which removes the conflict of interest inherent in commission-based
    models.


    While some competitors may offer lower entry points than our $250,000 minimum
    investment, they often do so by using generic ''ESG-lite'' indices. Our portfolio
    involves more rigorous, active management to ensure true impact alignment, which
    is reflected in our fee structure.


    Who each suits:

    - Typical Competitor Offerings: Suit investors with lower initial capital or those
    who prefer a self-directed approach with lower levels of professional oversight.

    - ESG Impact Portfolio: Suits high-net-worth individuals and institutional clients
    who require a professional fiduciary to manage complex sustainability goals with
    complete fee transparency and rigorous risk profiling.'
  domain: wealth_management
  product_category: esg_portfolio
