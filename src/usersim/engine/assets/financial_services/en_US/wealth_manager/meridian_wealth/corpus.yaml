- id: 8a8804e0-c435-5fd9-b86f-b0b96b6d3e10
  title: Tax-Managed Portfolio — check status or history
  body: 'To maintain full transparency regarding your investments and the efficacy
    of your tax-optimization strategy, we provide comprehensive reporting on your
    portfolio''s status and history.


    **Prerequisites**

    Before requesting status or history updates, ensure your identity has been verified
    via our multi-factor authentication (MFA) protocols to maintain our zero-trust
    security posture.


    **Steps to Review Portfolio Status**

    1. Request a current portfolio snapshot. We will provide a detailed breakdown
    of your current asset allocation and the total market value of your holdings.

    2. Ask for a summary of tax-loss harvesting activities. We will provide a report
    detailing the specific lots sold to offset gains, demonstrating how we are actively
    working to minimize your tax liabilities.

    3. Request a statement of fees. We will confirm the application of your annual
    advisory fee of 0.95% and provide the exact amount deducted during the last billing
    cycle.

    4. Request a historical performance report. We will provide a comparative analysis
    of your portfolio''s growth relative to its benchmark, adjusted for the tax-alpha
    generated.


    **Verification of Completion**

    Your request is considered complete once you have received the requested documentation
    via your secure client portal or email. You will know the process is successful
    when you can verify that the asset balances and fee deductions match your internal
    records. If you identify any discrepancies in the provided history, please notify
    your Relationship Manager immediately for a formal review.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: b70f1543-a2e5-596c-a4cf-32618bf343ac
  title: Tax-Managed Portfolio — a declined or blocked action
  body: "Clients may occasionally encounter a situation where a request to move funds\
    \ or modify their Tax-Managed Portfolio is declined or blocked. Because we operate\
    \ under a strict fiduciary standard and a zero-trust security posture, these blocks\
    \ are typically protective measures.\n\n**Common Symptoms**\n- A request to transfer\
    \ funds is denied without immediate execution.\n- A request to change account\
    \ beneficiaries or contact information is placed on hold.\n- An attempt to adjust\
    \ the risk profile of the portfolio is blocked.\n\n**Likely Causes and Resolution\
    \ Steps**\n1. **Identity Verification Failure**: The most frequent cause is a\
    \ failure to complete mandatory multi-factor authentication (MFA). \n   *Check*:\
    \ Confirm that you have access to your MFA device and that the verification prompt\
    \ was successfully completed.\n   *Fix*: Re-initiate the request and follow the\
    \ identity verification prompts exactly as presented.\n\n2. **Risk Profile Mismatch**:\
    \ If you have requested a trade or asset allocation change that contradicts your\
    \ documented risk profiling, we will block the action to protect you from unintended\
    \ exposure.\n   *Check*: Review your current risk profile on file with us.\n \
    \  *Fix*: If your financial goals have changed, ask us to initiate a new risk\
    \ profiling session. Once your profile is updated and documented, we can execute\
    \ the requested action.\n\n3. **Minimum Balance Threshold**: Actions that would\
    \ result in the portfolio falling below the minimum investment of $500,000 may\
    \ be flagged for review.\n   *Check*: Calculate the remaining balance after the\
    \ proposed withdrawal.\n   *Fix*: Consult with your Relationship Manager to determine\
    \ if the Tax-Managed Portfolio remains the appropriate vehicle for your remaining\
    \ assets.\n\n**Escalation Process**\nIf a block persists after these checks, we\
    \ will escalate the matter from your Relationship Manager to a Senior Portfolio\
    \ Strategist. You will receive a notification once the review is complete and\
    \ a resolution is reached."
