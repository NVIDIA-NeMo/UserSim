- id: ac0b4555-e10f-5f81-b401-9d2eeac6de40
  title: Tax-Managed Portfolio — set up and activate
  body: 'Transitioning to a Tax-Managed Portfolio requires a coordinated effort to
    ensure your risk profile and tax objectives are perfectly aligned. Please follow
    these steps to activate this strategy:


    1. **Confirm Capital Eligibility**: Provide us with confirmation that you have
    the required minimum investment of $500,000 available for allocation. We will
    verify these funds via our mandatory identity verification and multi-factor authentication
    protocols.

    2. **Undergo Risk Profiling**: We will conduct a detailed session to evaluate
    your ability and willingness to lose principal. This process defines your documented
    risk profile, which serves as the guardrail for all subsequent investment recommendations.

    3. **Review the Fee Agreement**: We will present the advisory fee structure for
    your approval. You will confirm your acceptance of the annual advisory fee of
    0.95%, which is non-negotiable to ensure fairness across our clientele.

    4. **Asset Transition**: Instruct us on the source of funds. We will then execute
    the transfer and begin the initial tax-aware positioning of your assets.


    Once these steps are complete, we will provide a formal confirmation of account
    activation and your first projected asset allocation map.


    ***Disclaimer: We defer specific legal and tax filing advice to certified external
    professionals. Please consult your CPA or tax attorney regarding the specific
    implications of this portfolio on your individual filing.***'
