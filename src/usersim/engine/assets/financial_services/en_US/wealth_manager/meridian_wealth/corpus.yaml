- id: 89121ca4-a6f0-5cc5-bd61-4ccd5b32cc52
  title: Tax-Managed Portfolio — advisory fee annual explained
  body: '### How is the annual advisory fee calculated for my Tax-Managed Portfolio?

    We employ a transparent fee structure where the annual advisory fee of 0.95% is
    applied to the total assets under management. This fee covers the professional
    portfolio management and the specialized active management required to execute
    tax-loss harvesting and tax-efficient asset allocation.


    ### Why is the fee for this portfolio different from other options?

    The 0.95% rate reflects the increased complexity and active oversight necessary
    to minimize your tax liabilities compared to a standard balanced approach. We
    believe this alignment ensures you receive a level of service commensurate with
    the sophisticated needs of high-income earners.


    ### Can I negotiate this fee based on my total assets with Meridian Wealth?

    To ensure equitable treatment across our client base, our fees are non-negotiable.
    We provide the same high standard of fiduciary care to all clients within this
    product tier. For more details, you may review the Tax-Managed Portfolio — fee
    schedule.'
