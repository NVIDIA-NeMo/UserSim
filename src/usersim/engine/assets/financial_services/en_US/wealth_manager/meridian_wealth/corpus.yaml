- id: 07e6f24b-8ca0-5b41-b3b2-6a9d4e92416c
  title: Tax-Managed Portfolio — comparison vs. alternatives and when not to choose
    it
  body: 'The Tax-Managed Portfolio is a premier fiduciary solution, but it is not
    the optimal choice for every investor. Understanding where this product fits within
    the Meridian Wealth ecosystem is essential for aligned asset allocation.


    **Comparison with Alternatives**

    Compared to our Managed Portfolio, the Tax-Managed Portfolio employs more aggressive
    tax-loss harvesting and strategic asset location to minimize the drag of taxes
    on your returns. While the Managed Portfolio serves as our foundational solution,
    the Tax-Managed Portfolio is an advanced strategy specifically optimized for high-income
    earners. This higher level of active management is reflected in the annual advisory
    fee of 0.95%.


    **When NOT to Choose the Tax-Managed Portfolio**

    We advise against this product in the following scenarios:

    1. **Insufficient Capital**: If you cannot meet the minimum investment of $500,000,
    this strategy cannot be implemented effectively.

    2. **Low Tax Sensitivity**: Investors in lower tax brackets or those investing
    primarily through tax-advantaged accounts (like a Roth IRA) will not derive significant
    benefit from this strategy, as the tax-alpha generated would not outweigh the
    advisory fee.

    3. **ESG-Primary Goals**: If your primary objective is to align your financial
    growth with environmental, social, and governance impact, the ESG Impact Portfolio
    is the more appropriate vehicle.

    4. **Requirement for Bespoke Structures**: If you require highly customized legal
    arrangements or access to ultra-exclusive alternative assets, you should move
    directly to Private Wealth Advisory.


    **Fiduciary Alignment**

    As a fiduciary, we will only recommend the Tax-Managed Portfolio if it is in your
    best interest based on your documented risk profile and tax situation. If we believe
    a different strategy would better serve your financial goals, we will provide
    a transparent explanation and a recommended path for transition.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: product_sheet
