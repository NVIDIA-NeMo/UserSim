- id: 69cc2c78-5178-5f06-9423-ba4e5ae87429
  title: Managed Portfolio — recognizing scams targeting this product
  body: 'As you evaluate wealth management options, it is imperative to remain vigilant
    against sophisticated fraud patterns targeting high-net-worth investors. We have
    observed several scams specifically designed to mimic the structure of a Managed
    Portfolio to deceive prospective clients.


    One common tactic involves ''guaranteed return'' solicitations. We operate under
    a strict fiduciary duty—the legal and ethical obligation to act solely in the
    client''s best interest—which precludes us from guaranteeing specific market returns.
    Any communication promising a fixed, high yield with zero risk is not from Meridian
    Wealth and should be treated as fraudulent.


    Another prevalent scam involves ''urgent account verification'' requests. Fraudsters
    may impersonate our Relationship Managers, claiming that your initial funding
    of the minimum investment of $250,000 is stalled due to a security breach. They
    may pressure you to provide passwords or transfer funds to a ''temporary secure
    account.'' Please be advised: we maintain a zero-trust posture regarding account
    modifications via unverified channels. We will never ask for your multi-factor
    authentication (MFA) codes, passwords, or request that you move funds to an external
    account via an unverified email or text message.


    Furthermore, be wary of ''exclusive'' offers that claim to waive our non-negotiable
    advisory fee of 0.85% in exchange for an upfront ''processing fee'' paid via wire
    or cryptocurrency. Our fee structure is transparent and deducted from assets under
    management; we never request separate, upfront payments for account activation.


    If you encounter any communication that feels coercive or deviates from our established
    protocols, your first action must be to notify us immediately. Reporting unauthorized
    activity promptly is critical to the resolution process. For more information
    on our general protective measures, please refer to Managed Portfolio — fraud
    and unauthorized-activity protection.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 36b971ea-80af-534a-958e-25d01d55d814
  title: Managed Portfolio — limits, restrictions, and edge cases
  body: 'This document provides support personnel with the necessary technical constraints
    and boundary conditions associated with the Managed Portfolio. Adherence to these
    limits ensures equitable treatment across our client base and maintains our fiduciary
    standards.


    **Investment Thresholds**

    The Managed Portfolio requires a minimum investment of $250,000. Accounts that
    fall below this threshold due to market volatility are generally permitted to
    remain active; however, if a client intentionally withdraws funds bringing the
    balance below $250,000, the account may be flagged for review to determine if
    it still meets the product''s strategic intent.


    **Fee Application**

    The annual advisory fee of 0.85% is non-negotiable. This fee is calculated based
    on the average daily balance of the assets under management and is deducted on
    a pro-rata basis. Support agents must not offer discounts or fee waivers, as our
    philosophy is to align our success with the growth of client assets consistently
    across all portfolios.


    **Withdrawal and Liquidity Restrictions**

    While the Managed Portfolio is designed for professional management with a balanced
    risk approach, certain asset allocations may have varying liquidity windows. Clients
    should be reminded that while we strive for flexibility, the underlying assets
    may require standard settlement periods (typically T+2).


    **Risk Profile Alignment**

    No portfolio adjustments can be made that deviate from the client''s documented
    risk profile. If a client requests an allocation that exceeds their established
    risk tolerance, they must first undergo a new risk profiling process—the evaluation
    of their ability and willingness to lose principal—before the change can be implemented.


    **Compliance and Tax Deferral**

    We provide holistic investment strategy; however, we defer specific legal and
    tax filing advice to certified external professionals. Agents should not provide
    specific tax-loss harvesting advice for this product, as such specialized needs
    may be better served by the Tax-Managed Portfolio.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: b14d62ef-12cf-5b3f-973e-942b0b7a7403
  title: Managed Portfolio — eligibility and setup
  body: '**Who is eligible to open a Managed Portfolio?**

    We welcome high-net-worth individuals and institutional clients who seek professional
    management with a balanced risk approach. The primary requirement is a minimum
    investment of $250,000.


    **What is the first step in the setup process?**

    Prospective clients must first complete a comprehensive risk profiling session.
    This allows us to document your financial goals and your willingness to accept
    principal risk, ensuring that the portfolio is rooted in your specific needs.


    **How is the account funded?**

    Once your risk profile is approved and the account agreement is signed, you may
    fund the account via wire transfer or the transfer of existing securities. We
    require the full minimum investment of $250,000 to be present to activate the
    professional management strategy.


    For further details on the onboarding process, please refer to Managed Portfolio
    — set up and activate.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: faq
  source_authority: official
  placeholder: true
