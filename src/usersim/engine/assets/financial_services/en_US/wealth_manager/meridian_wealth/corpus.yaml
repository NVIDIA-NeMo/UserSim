- id: 07e7414e-7582-5f62-aa9c-a7b014d7f3d0
  title: Tax-Managed Portfolio — how-to / step-by-step
  body: 'Below are step-by-step guides for common requests associated with the Tax-Managed
    Portfolio.


    **How do I increase my investment in this portfolio?**

    1. Tell us the amount you wish to add to your account.

    2. We will verify the funds via our mandatory identity verification and MFA protocols.

    3. We will then allocate the new capital according to your current risk profile
    and tax-optimization strategy.


    **How do I update my tax information?**

    1. Provide us with the updated tax details (e.g., a change in your filing status
    or tax bracket).

    2. We will route this information to your Senior Portfolio Strategist.

    3. We will then confirm in writing if any adjustments to your asset allocation
    are required to maintain the efficiency of the strategy.


    **How is the advisory fee applied?**

    Our annual advisory fee of 0.95% is deducted proportionally from your account
    balance. You can request a fee statement at any time to see the exact amount charged.'
