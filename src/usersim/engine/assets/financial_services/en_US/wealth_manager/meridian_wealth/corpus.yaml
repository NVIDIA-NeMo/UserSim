- id: b53e976e-2d7d-5685-921a-024d87e3260b
  title: Tax-Managed Portfolio — choosing between tiers or options
  body: 'When deciding between our primary investment tiers, the choice typically
    rests on the balance between general growth and tax optimization.


    **Tax-Managed Portfolio**

    This is an advanced strategy specifically optimized to minimize tax liabilities
    for high-income earners. It requires a higher minimum investment of $500,000 and
    carries an annual advisory fee of 0.95%. It is the superior choice for clients
    in high tax brackets who seek to maximize after-tax returns through active management.


    **Managed Portfolio**

    Our foundational solution is designed for those seeking professional management
    with a balanced risk approach. While it offers a more accessible entry point and
    different fee dynamics (see Managed Portfolio — advisory fee annual explained),
    it does not provide the same level of aggressive tax-loss harvesting and liability
    optimization found in the Tax-Managed tier.


    **Decision Summary:**

    - Choose the **Tax-Managed Portfolio** if you have at least $500,000 and your
    primary goal is reducing the tax drag on your investment growth.

    - Choose the **Managed Portfolio** if you seek a balanced, professional core strategy
    without the specific high-income tax optimization focus.'
