- id: 13a56b7d-8df1-5f28-90bc-9385b3d29b1c
  title: Managed Portfolio — vs. a similar product here
  body: 'When choosing between our core offerings, clients often compare the Managed
    Portfolio with the Tax-Managed Portfolio.


    **Managed Portfolio**

    *   **Annual Advisory Fee**: 0.85%

    *   **Minimum Investment**: $250,000

    *   **Primary Goal**: Professional management with a balanced risk approach.

    *   **Best For**: Investors seeking a foundational, diversified strategy focused
    on steady growth and risk mitigation.


    **Tax-Managed Portfolio**

    *   **Primary Goal**: Optimization to minimize tax liabilities for high-income
    earners.

    *   **Best For**: Clients in high tax brackets who prioritize after-tax returns
    over simple balanced growth.


    While the Managed Portfolio provides our standard fiduciary oversight and balanced
    allocation, the Tax-Managed Portfolio employs more advanced, specific strategies
    to shield gains from taxes. Both require a commitment to our fiduciary standards
    and non-negotiable fee structures. If you are unsure which fits your current trajectory,
    we recommend reviewing Managed Portfolio — overview to see if our foundational
    approach meets your needs.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: comparison
  source_authority: official
