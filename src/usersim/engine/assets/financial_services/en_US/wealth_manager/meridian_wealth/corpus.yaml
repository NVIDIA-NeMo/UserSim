    Q: Why is the 0.9% fee non-negotiable?

    A: To ensure equitable treatment across our entire client base, Meridian Wealth
    maintains a consistent fee structure. This ensures that every client receiving
    the ESG Impact Portfolio strategy is treated with the same standard of care and
    transparency.


    Q: When is this fee deducted from my account?

    A: The advisory fee is accrued daily and typically deducted on a quarterly basis
    from the assets under management. For further details on how our costs are structured,
