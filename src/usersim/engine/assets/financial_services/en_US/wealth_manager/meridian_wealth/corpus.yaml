  institution_id: meridian_wealth
- id: 4a3790b6-fcdd-50a3-81bd-ccdcc53dfc47
  title: ESG Impact Portfolio — risk disclosures
  body: 'Investment in the ESG Impact Portfolio involves specific risks that potential
    investors must consider. While we adhere to a fiduciary standard of care and root
    all recommendations in your documented risk profile, no investment is without
    risk.


    1. Concentration Risk: By excluding companies and sectors that do not meet our
    environmental, social, and governance criteria, the ESG Impact Portfolio may be
    less diversified than a broad-market index. This concentration can lead to higher
    volatility in certain market conditions.


    2. ESG Rating Divergence: There is no universal standard for ESG scoring. Different
    rating agencies may categorize the same company differently. Our internal selection
    process is rigorous, but the subjective nature of ESG metrics means that certain
    assets may not meet every investor''s personal ethical threshold.


    3. Performance Trade-offs: While we aim for competitive returns, the restriction
    to ESG-compliant assets may result in the portfolio underperforming the broader
    market during periods when non-compliant sectors (such as traditional energy)
    experience significant growth.


    4. Fee Disclosure: This portfolio is subject to a non-negotiable annual advisory
    fee of 0.9%. This fee is charged regardless of portfolio performance to ensure
    the continued provision of professional, active management.


    5. Regulatory Framework: Our operations strictly adhere to SEC regulations and
    the fiduciary standards of the Advisers Act. We prioritize full disclosure of
    conflicts and risk profiling as a cornerstone of the investor relationship.


    6. External Advice Disclaimer: Meridian Wealth provides holistic investment strategy
    and asset allocation; however, we defer specific legal and tax filing advice to
    certified external professionals. Clients are encouraged to consult with a tax
    professional regarding the implications of their ESG investments.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: disclosure
  source_authority: official
