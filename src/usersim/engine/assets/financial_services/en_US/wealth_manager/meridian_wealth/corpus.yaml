- id: 463fe164-7aed-51f9-86e3-637811f05220
  title: When to use update_risk_profile
  body: 'Risk Profiling is the cornerstone of our fiduciary commitment, as it defines
    the legal and ethical boundaries of our investment recommendations. The update_risk_profile
    tool must be used whenever there is a material change in a client''s financial
    goals, time horizon, or willingness to accept principal loss.


    Agents must initiate this procedure in the following scenarios:

    1. The client explicitly requests a change in their risk tolerance (e.g., moving
    from a balanced approach to a more aggressive growth strategy).

    2. The client experiences a significant life event (e.g., retirement, inheritance,
    or a change in employment status) that alters their financial capacity for risk.

    3. A periodic review indicates that the current documented profile no longer reflects
    the client''s actual risk appetite.


    Procedure:

    1. Perform mandatory identity verification and MFA.

    2. Use get_accounts to ensure the correct account_id is being targeted.

    3. Conduct a collegiate-level consultation to determine the new risk parameters,
    ensuring the client understands the implications of the change on their potential
    returns and principal stability.

    4. Call the update_risk_profile tool to commit the new risk parameters to the
    client''s record.

    5. Inform the client that their portfolio will be reviewed by a Senior Portfolio
    Strategist to ensure alignment with the new profile.


    Failure to maintain an accurate risk profile is a breach of our fiduciary standard
    of care.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_risk_profile
  institution_id: meridian_wealth
- id: 7592e819-9698-54af-9dde-5c230ff6fe03
  title: update_risk_profile tool reference
  body: 'The update_risk_profile tool is used to modify the documented risk tolerance
    and financial goals of a client, which in turn dictates the allowable product
    recommendations.


    Signature: update_risk_profile(account_id: string, risk_score: integer, goals:
    string)


    Effect: Updates the client''s risk profile in the system of record. This is a
    state-changing action that alters the parameters for future asset allocation.


    The agent performs this action by calling the tool directly after verifying the
    client''s identity and confirming the new risk parameters through a professional
    consultation.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_risk_profile
  institution_id: meridian_wealth
- id: 2946f750-01e5-5d99-ad6c-48da4517ba4d
  title: When to use schedule_advisor_meeting
  body: 'At Meridian Wealth, complex financial resolutions and bespoke strategy adjustments
    are handled through direct interaction with our expert staff. The schedule_advisor_meeting
    tool is used to coordinate these high-touch consultations.


    This procedure should be utilized when:

    1. A client requires a deep-dive analysis of their current portfolio that exceeds
    the scope of standard reporting.

    2. The client is considering a transition to the Private Wealth Advisory tier
    for bespoke, high-touch strategies.

    3. There is a complex dispute regarding account activity that requires the intervention
    of a Senior Portfolio Strategist.

    4. The client wishes to generate a new, comprehensive financial plan that requires
    human oversight.


    Procedure:

    1. Verify the client''s identity via MFA and identity verification.

    2. Use get_accounts to confirm the client''s identity and relationship level.

    3. Determine the objective of the meeting and the necessary level of expertise
    (Relationship Manager vs. Senior Portfolio Strategist).

    4. Use the schedule_advisor_meeting tool to lock in a time during EST business
    hours.

    5. Confirm the appointment details with the client via their preferred secure
    channel.


    Agents should not attempt to provide bespoke strategy adjustments themselves;
    such actions must be deferred to the scheduled consultation to maintain our fiduciary
    standard.'
  domain: wealth_management
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - schedule_advisor_meeting
  institution_id: meridian_wealth
- id: 9e978599-9d9f-55e3-ab44-5c1604a762cd
  title: schedule_advisor_meeting tool reference
  body: 'The schedule_advisor_meeting tool facilitates the booking of a professional
    consultation between a client and a Meridian Wealth advisor.


    Signature: schedule_advisor_meeting(account_id: string, meeting_date: string,
    meeting_time: string, objective: string)


    Effect: Creates a calendar event and notifies the appropriate Relationship Manager
    or Senior Portfolio Strategist of the upcoming consultation.


    The agent performs this action by calling the tool directly after identity verification
    and confirming the client''s availability during EST business hours.'
  domain: wealth_management
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
