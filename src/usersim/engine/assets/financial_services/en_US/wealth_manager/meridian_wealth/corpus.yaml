- id: f555b7ae-d052-553d-9589-4011a45e15a6
  title: ESG Impact Portfolio — access or login problems
  body: 'Clients may occasionally encounter difficulties accessing their portfolio
    data via our secure channels. Below are the common symptoms and the resolution
    path.


    Symptom: ''Invalid Credentials'' or ''Account Locked'' during login.

    Likely Cause: Multiple failed password attempts or an expired MFA token.

    Resolution Steps:

    1. Verify that you are using the correct credentials and that your MFA device
    is synchronized with the current time.

    2. If the account remains locked, tell us that you are unable to access your portal.
    We will initiate a rigorous identity verification process to confirm your ownership
    of the account.

    3. Once identity is verified, we will reset your access parameters and provide
    a temporary secure link to re-establish your credentials.


    Symptom: MFA code not received via the primary channel.

    Likely Cause: Network latency or an outdated contact method on file.

    Resolution Steps:

    1. Confirm with us that your contact information is current. If an update is needed,
    we will perform identity verification before changing the record.

    2. Ask us to trigger a manual MFA override or send the code through an alternative
    verified channel.


    When to Escalate:

    If access cannot be restored after two verification attempts, we will escalate
    the matter to our Senior Portfolio Strategists and the security team. You will
    receive a status update on the resolution within 1-2 business days. For general
    guidance on our security posture, you may refer to the ESG Impact Portfolio —
    account security best practices.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: troubleshooting
  source_authority: official
