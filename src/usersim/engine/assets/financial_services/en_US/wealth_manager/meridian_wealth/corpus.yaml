- id: 2f984b19-73e4-56e4-b680-9f0ec7f02024
  title: Managed Portfolio — fraud and unauthorized-activity protection
  body: 'At Meridian Wealth, we view data privacy and asset security as the cornerstone
    of the trust-based relationship we maintain with our clients. When utilizing the
    Managed Portfolio, it is imperative to remain vigilant against sophisticated fraud
    patterns, such as ''social engineering''—where bad actors impersonate our Senior
    Portfolio Strategists to solicit sensitive information—or unauthorized attempts
    to redirect fund distributions.


    We maintain a rigorous zero-trust posture regarding account modifications. Please
    be advised that we will never request your passwords, multi-factor authentication
    (MFA) codes, or full social security numbers via email or unverified messaging
    channels. Any state-changing action, including the movement of funds or updates
    to your beneficiary designations, requires mandatory multi-factor authentication
    and rigorous identity verification before execution.


    If you detect any unauthorized activity or receive a communication that appears
    suspicious, your first action must be to notify your dedicated Relationship Manager
    immediately. Rapid reporting is critical; while we approach all disputes with
    a philosophy of rapid investigation, notifying us within 24 hours of a suspected
    breach significantly enhances our ability to freeze assets and mitigate loss.
    In accordance with our dispute and fraud handling philosophy, we will conduct
    an initial review of any reported unauthorized activity within 5-10 business days,
    followed by a formal written determination upon the conclusion of our investigation.


    Disclaimer: While we employ institutional-grade security measures, the client
    shares responsibility for the safeguarding of their access credentials. Failure
    to adhere to MFA requirements may impact the timeline of dispute resolution.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 1ed39406-302a-5897-8bc7-40744eac91c1
  title: Managed Portfolio — account agreement
  body: 'This account agreement governs the relationship between the client and Meridian
    Wealth regarding the Managed Portfolio. By enrolling in this service, the client
    agrees to the following binding terms:


    1. Fiduciary Standard and Management: We agree to manage the portfolio under a
    strict Fiduciary Duty, meaning we are legally and ethically obligated to act solely
    in the client''s best interest. All asset allocations are rooted in the client''s
    documented risk profile.


    2. Fee Obligations: The client agrees to pay a non-negotiable annual advisory
    fee of 0.85%. This fee is designed to align our success with the growth of client
    assets and ensures equitable treatment across our client base. This fee is calculated
    based on the assets under management and is billed according to our standard institutional
    cycle.


    3. Minimum Capital Requirement: To maintain the Managed Portfolio, the client
    must maintain a minimum investment of $250,000. Should the account value fall
    below this threshold due to market volatility, we reserve the right to review
    the account''s viability or request additional funding to restore the minimum.


    4. Termination and Closure: Either party may terminate this agreement upon written
    notice. Upon closure, all outstanding advisory fees will be settled from the remaining
    account balance prior to the distribution of assets.


    5. Amendments: We reserve the right to modify these terms to ensure compliance
    with SEC regulations and the Advisers Act. Clients will be provided with formal
    notice of any material changes to the fee structure or operational mandates.


    Disclaimer: We provide holistic investment strategy; however, we defer specific
    legal and tax filing advice to certified external professionals.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: terms_conditions
  source_authority: official
  placeholder: true
