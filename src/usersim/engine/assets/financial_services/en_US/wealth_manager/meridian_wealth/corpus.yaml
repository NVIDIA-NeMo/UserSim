- id: 787efdfd-9a61-569b-be38-9d7b48dbf799
  title: Private Wealth Advisory — account agreement
  body: "This account agreement governs the relationship between the client and Meridian\
    \ Wealth regarding the Private Wealth Advisory service. \n\n1. Fiduciary Standard:\
    \ We operate under a fiduciary duty, meaning we are legally and ethically obligated\
    \ to act solely in the client's best interest at all times. All asset allocation\
    \ and investment strategies are rooted in the client's documented risk profile.\n\
    \n2. Fee Obligations: The client agrees to an annual advisory fee of 0.75%. This\
    \ fee is non-negotiable to ensure equitable treatment across our client base and\
    \ is charged for professional portfolio management and financial guidance. This\
    \ fee is calculated based on the assets under management and is deducted according\
    \ to the schedule outlined in the Private Wealth Advisory — fee schedule.\n\n\
    3. Minimum Investment: To maintain the exclusive, high-touch nature of this tier,\
    \ a minimum investment of $1,000,000 is required. Should the total account value\
    \ fall below this threshold due to market volatility, we reserve the right to\
    \ review the account's eligibility for this tier.\n\n4. Advice Boundaries: We\
    \ provide holistic investment strategy; however, the client acknowledges that\
    \ we defer specific legal and tax filing advice to certified external professionals.\n\
    \n5. Termination: Either party may terminate this agreement upon written notice.\
    \ Upon closure, any accrued but unpaid advisory fees will be settled from the\
    \ remaining account balance. \n\n6. Amendments: Meridian Wealth may amend these\
    \ terms to comply with SEC regulations or the Advisers Act. Clients will be notified\
    \ of material changes in writing."
  domain: wealth_management
  product_category: private_wealth_advisory
