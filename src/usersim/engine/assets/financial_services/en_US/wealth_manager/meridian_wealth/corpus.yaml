- id: b8a8ca54-bf69-510e-b4a5-88b0084429e5
  title: Private Wealth Advisory — choosing between tiers or options
  body: "Choosing the right management tier depends on your asset level and the degree\
    \ of customization you require. \n\nPrivate Wealth Advisory is our most exclusive\
    \ tier, designed for those with a minimum investment of $1,000,000. It offers\
    \ bespoke, high-touch strategies and a holistic fiduciary approach. The cost is\
    \ an annual advisory fee of 0.75%. This is the ideal choice for ultra-high-net-worth\
    \ clients who require an intricate, individualized strategy tailored to complex\
    \ financial goals.\n\nIn contrast, the Managed Portfolio is our foundational solution,\
    \ suited for investors seeking professional management with a balanced risk approach\
    \ and lower entry thresholds. While both tiers adhere to our fiduciary duty, the\
    \ Managed Portfolio provides a more standardized investment experience rather\
    \ than the bespoke nature of the Private Wealth Advisory tier.\n\nIf your primary\
    \ objective is high-touch, individualized portfolio architecture and you meet\
    \ the $1,000,000 minimum, Private Wealth Advisory is the superior option. For\
    \ those seeking professional guidance without the need for bespoke ultra-high-net-worth\
    \ strategies, the Managed Portfolio is the more appropriate selection."
