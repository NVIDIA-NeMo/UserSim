- id: ed0adfa5-a2ba-5448-bb52-2695cc30c6fa
  title: ESG Impact Portfolio — cancel, close, or downgrade
  body: 'If you wish to cancel your ESG Impact Portfolio, close your account, or downgrade
    to a different management tier, please follow these steps:


    1. Request a Portfolio Review: Tell us that you wish to close or downgrade your
    ESG Impact Portfolio. We will first provide a current valuation of your assets
    and a summary of any accrued, unpaid portions of your 0.9% annual advisory fee.


    2. Specify the Destination of Funds: Provide instructions on where the assets
    should be moved. You may choose to transfer them to another Meridian Wealth product
    or liquidate the positions for a transfer to an external institution.


    3. Complete Identity Verification: To adhere to our zero-trust security posture,
    you must complete a mandatory multi-factor authentication (MFA) process and a
    rigorous identity verification. This is required before any state-changing action
    or movement of funds can occur.


    4. Confirm Final Fee Settlement: We will calculate the final pro-rated advisory
    fee based on the time since your last billing cycle. Once you confirm the settlement
    amount, we will deduct this from the account balance.


    5. Final Execution: We will execute the closure or transfer. You will receive
    a final written confirmation and a closing statement detailing the total assets
    distributed and the final fees paid.


    Knowing it worked: The process is complete when you receive the final closing
    statement and the funds are reflected in your designated destination account.
    If you are downgrading to a simpler strategy, you will see the new product reflected
    in your portfolio dashboard and a confirmation of the updated fee structure.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
