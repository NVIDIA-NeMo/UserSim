  institution_id: meridian_wealth
- id: 94fce7a4-d4b2-5b27-bca6-55e5d369db23
  title: Managed Portfolio — risk disclosures
  body: "Investment in the Managed Portfolio involves an inherent risk of loss. Clients\
    \ should be aware that no strategy, including our professional asset allocation,\
    \ can guarantee a profit or protect against loss in a declining market. \n\nRisk\
    \ Profiling is the process we use to evaluate a client's ability and willingness\
    \ to lose principal in exchange for potential returns. However, the resulting\
    \ portfolio is still subject to market volatility. The annual advisory fee of\
    \ 0.85% is charged regardless of the portfolio's performance; this fee compensates\
    \ for the professional management and fiduciary guidance provided, not for guaranteed\
    \ returns.\n\nOur operations strictly adhere to SEC regulations and the fiduciary\
    \ standards of the Advisers Act. We prioritize the full disclosure of conflicts\
    \ and the rigorous application of risk profiles. It is important to note that\
    \ while we provide holistic investment strategy, we are not licensed to provide\
    \ specific legal or tax filing advice; we defer such matters to certified external\
    \ professionals. \n\nFurthermore, the minimum investment of $250,000 is required\
    \ to ensure the portfolio's diversification is viable. Diversification does not\
    \ eliminate the risk of experience losses in a diversified portfolio.\n\nDisclaimer:\
    \ All investments carry risk. Please consult with your certified tax and legal\
    \ advisors regarding the specific implications of your investment choices."
  domain: wealth_management
  product_category: managed_portfolio
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: f091cc08-cdc1-5033-aef9-16b0e08892cb
  title: Managed Portfolio — how rates are tiered and applied
  body: 'The Managed Portfolio employs a streamlined, transparent fee structure to
    ensure equitable treatment and alignment of interests between the client and Meridian
    Wealth.


    Annual Advisory Fee: 0.85%


    This is a flat annual rate applied to all assets under management within the Managed
    Portfolio. We do not employ a tiered or sliding scale for this specific product;
    the 0.85% rate applies uniformly to all accounts that meet the minimum investment
    of $250,000. This non-negotiable fee covers all professional portfolio management,
    periodic rebalancing, and fiduciary financial guidance.


    The fee is typically calculated daily and billed on a quarterly basis, deducted
    directly from the account''s cash reserves. Any changes to this rate will be communicated
    in writing in accordance with our change-of-terms policy.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: rate_sheet
  source_authority: official
