- id: ecac66b5-d805-5659-8d38-c2f7af46354f
  title: ESG Impact Portfolio — a declined or blocked action
  body: '**Symptom**

    You receive a notification that a request to move funds, change an account beneficiary,
    or modify the asset allocation of your ESG Impact Portfolio has been declined
    or blocked.


    **Likely Causes**

    1. **Verification Failure:** The most common cause is a failure to complete the
    mandatory multi-factor authentication (MFA) or an attempt to make changes via
    an unverified communication channel.

    2. **Minimum Balance Violation:** An attempted withdrawal that would bring the
    total portfolio value below the minimum investment of $250,000 may be flagged
    for review.

    3. **Risk Profile Mismatch:** A request to pivot to assets that contradict your
    documented risk profile may be blocked to uphold our fiduciary duty.


    **Resolution Steps**

    1. **Verify Identity:** Ensure you are using a verified channel. If you attempted
    the action via email without subsequent MFA verification, please re-initiate the
    request through the secure client portal.

    2. **Check Balance Thresholds:** Review your current balance. If your request
    would result in a balance under $250,000, please consult with your Relationship
    Manager to discuss if the ESG Impact Portfolio remains the appropriate vehicle
    for your needs.

    3. **Update Risk Documentation:** If the action was blocked due to a risk mismatch,
    ask us to initiate a new risk profiling session. We will update your goals and
    tolerance, after which the action may be approved.


    **Escalation**

    If the block persists despite these checks, we will escalate the matter from your
    Relationship Manager to a Senior Portfolio Strategist. You will receive a formal
    notification of the reason for the block and a proposed resolution path within
    5-10 business days.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
